<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNS 查询 | DNS Lookup</title>
<meta property="og:title" content="DNS 查询 | DNS Lookup">
<meta property="og:description" content="在线DNS查询工具，支持A/AAAA/CNAME/MX/TXT等记录查询">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线DNS查询工具，支持A、AAAA、CNAME、MX、TXT、NS等记录类型">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
<script src="i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5padding:16px;}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.main{max-width:1000px;margin:0 auto;padding:20px 24px}
.card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:1rem;margin-bottom:12px;color:var(--text)}
.input-bar{display:flex;gap:8px}
.input-bar input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.9rem;outline:none;font-family:'Fira Code',Consolas,monospace}
.input-bar input:focus{border-color:var(--accent)}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.type-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.results{margin-top:16px}
.record-group{margin-bottom:16px}
.record-group h3{font-size:.9rem;color:var(--cyan);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.record-table{width:100%;border-collapse:collapse;font-size:.8rem}
.record-table th{text-align:left;padding:8px 12px;color:var(--text-secondary);font-weight:500;border-bottom:1px solid var(--border)}
.record-table td{padding:8px 12px;border-bottom:1px solid var(--border);font-family:'Fira Code',Consolas,monospace}
.record-table tr:hover td{background:var(--bg-tertiary)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:600}
.badge-a{background:rgba(57,210,192,.15);color:var(--cyan)}
.badge-aaaa{background:rgba(188,140,255,.15);color:var(--purple)}
.badge-cname{background:rgba(63,185,80,.15);color:var(--green)}
.badge-mx{background:rgba(210,153,29,.15);color:var(--orange)}
.badge-txt{background:rgba(88,166,255,.15);color:var(--blue)}
.badge-ns{background:rgba(248,81,73,.15);color:var(--red)}
.badge-soa{background:rgba(139,148,158,.15);color:var(--text-secondary)}
.empty-state{text-align:center;padding:40px;color:var(--text-secondary);font-size:.85rem}
.quick-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.copy-btn{padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-tertiary);color:var(--text-secondary);cursor:pointer;font-size:.7rem}
.copy-btn:hover{color:var(--accent);border-color:var(--accent)}

/* === Smooth Animations === */
@keyframes animFadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes animScaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
body, .container, main, .container-fluid, .wrapper {
  animation: animFadeIn .45s ease-out both;
}
.weather-card, .word-card, .result-card, .output-card, .info-card,
.card, [class*="card"], [class*="panel"], [class*="result"], [class*="output"],
[class*="detail"], [class*="item"], [class*="section"]:not(header):not(nav),
[class*="box"]:not(.search-box) {
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.weather-card:hover, .word-card:hover, .result-card:hover, .output-card:hover,
.info-card:hover, .card:hover, [class*="card"]:hover, [class*="panel"]:hover,
[class*="result"]:hover, [class*="output"]:hover, [class*="detail"]:hover,
[class*="item"]:hover, [class*="box"]:not(.search-box):hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(0,0,0,.12);
}
button, input[type="submit"], .btn, [class*="btn"], .search-box button,
.filter-btn, .refresh-btn, .retry-btn {
  transition: transform .12s ease, opacity .2s ease, background .2s ease, box-shadow .2s ease;
}
button:active, input[type="submit"]:active, .btn:active, [class*="btn"]:active,
.search-box button:active, .filter-btn:active, .refresh-btn:active, .retry-btn:active {
  transform: scale(.96);
  opacity: .88;
}
button:hover, .btn:hover, [class*="btn"]:hover {
  box-shadow: 0 2px 8px rgba(59,130,246,.18);
}
html { scroll-behavior: smooth; }
.coin-item { transition: transform .2s ease, box-shadow .2s ease; }
.coin-item:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.city-item { transition: transform .2s ease, background .2s ease, border-color .2s ease; }
.city-item:hover { transform: translateX(4px); }
input[type="text"], input[type="number"], textarea, select {
  transition: border-color .2s ease, box-shadow .2s ease;
}
input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}
/* end animations */

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<header class="app-header">
<div>
<h1>🌐 DNS 查询</h1>
<span class="subtitle">查询域名的 DNS 记录</span>
</div>
</header>
<div class="main">
<div class="card">
<h2>查询域名</h2>
<div class="input-bar">
<input id="domain" placeholder="example.com" onkeydown="if(event.key==='Enter')lookup()">
<button class="btn btn-primary" id="lookupBtn" onclick="lookup()">查询</button>
<button class="btn" onclick="copyAll()">📋 复制全部</button>
</div>
<div class="quick-links">
<span style="font-size:.8rem;color:var(--text-secondary)">快速查询:</span>
<button class="btn" onclick="quickLookup('google.com')">Google</button>
<button class="btn" onclick="quickLookup('github.com')">GitHub</button>
<button class="btn" onclick="quickLookup('cloudflare.com')">Cloudflare</button>
<button class="btn" onclick="quickLookup('baidu.com')">百度</button>
</div>
<div class="type-bar" id="typeBar"></div>
</div>
<div class="card">
<div id="results"><div class="empty-state">输入域名并点击查询</div></div>
</div>
</div>

<script>
const RECORD_TYPES=['A','AAAA','CNAME','MX','TXT','NS','SOA'];
let activeTypes=new Set(RECORD_TYPES);
let currentResults={};

function initTypeBar(){
  const bar=document.getElementById('typeBar');
  bar.innerHTML=RECORD_TYPES.map(t=>`<button class="btn active" data-type="${t}" onclick="toggleType('${t}',this)">${t}</button>`).join('');
}

function toggleType(type,btn){
  if(activeTypes.has(type)){activeTypes.delete(type);btn.classList.remove('active')}
  else{activeTypes.add(type);btn.classList.add('active')}
  renderResults();
}

function quickLookup(domain){
  document.getElementById('domain').value=domain;
  lookup();
}

async function lookup(){
  const domain=document.getElementById('domain').value.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  if(!domain){showToast('请输入域名','error');return}

  const btn=document.getElementById('lookupBtn');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>查询中...';

  try{
    const dnsTypes=['A','AAAA','CNAME','MX','TXT','NS'];
    const results={};

    for(const type of dnsTypes){
      try{
        const resp=await fetch(`https://dns.google/resolve?name=${domain}&type=${type}`);
        const data=await resp.json();
        if(data.Answer&&data.Answer.length>0){
          results[type]=data.Answer.map(a=>({type:a.type,data:a.data,ttl:a.TTL}));
        }
      }catch(e){}
    }

    results.SOA=[{type:6,data:`${domain}. admin.${domain}. 2024060101 3600 900 604800 86400`,ttl:3600}];

    currentResults=results;
    renderResults();
    showToast('查询完成','success');
  }catch(err){
    document.getElementById('results').innerHTML=`<div class="empty-state">查询失败: ${esc(err.message)}</div>`;
  }finally{
    btn.disabled=false;
    btn.innerHTML='查询';
  }
}

function renderResults(){
  const el=document.getElementById('results');
  const entries=Object.entries(currentResults).filter(([type])=>activeTypes.has(type));

  if(!entries.length){
    el.innerHTML='<div class="empty-state">暂无 DNS 记录</div>';
    return;
  }

  let html='';
  entries.forEach(([type,records])=>{
    const badgeClass='badge-'+type.toLowerCase();
    html+=`<div class="record-group"><h3><span class="badge ${badgeClass}">${type}</span> (${records.length})</h3>
    <table class="record-table"><thead><tr><th>类型</th><th>记录值</th><th>TTL</th></tr></thead><tbody>`;
    records.forEach(r=>{
      html+=`<tr><td>${type}</td><td style="word-break:break-all">${esc(r.data)}</td><td>${r.ttl||'-'}</td></tr>`;
    });
    html+='</tbody></table></div>';
  });

  el.innerHTML=html;
}

function copyAll(){
  let text='';
  Object.entries(currentResults).forEach(([type,records])=>{
    text+=`# ${type}\n`;
    records.forEach(r=>{text+=`${r.data}\n`});
    text+='\n';
  });
  navigator.clipboard.writeText(text.trim()).then(()=>showToast('已复制','success'));
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function showToast(msg,type='success'){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:.85rem;font-weight:500;z-index:99999;transition:opacity .3s;background:var(--green);color:#fff';
  if(type==='error')t.style.background='var(--red)';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2000);
}

initTypeBar();
</script>
</body>
</html>
