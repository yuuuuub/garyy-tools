<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国传统烹饪百科 - Chinese Traditional Cooking Encyclopedia</title>
<meta name="description" content="中国传统烹饪百科，涵盖八大菜系、烹饪技法、经典名菜与饮食文化">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国传统烹饪百科 - Chinese Traditional Cooking Encyclopedia">
<meta property="og:description" content="中国传统烹饪百科，涵盖八大菜系、烹饪技法、经典名菜与饮食文化">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-cooking-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a00 0%,#2a1505 50%,#3d200a 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3010;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a,#b06a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.cuisine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.cuisine-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.cuisine-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.cuisine-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.cuisine-card .c-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cuisine-card .c-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(232,168,124,0.15);color:var(--accent)}
.cuisine-card .c-name{font-size:1.3em;font-weight:bold}
.cuisine-card .c-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.cuisine-card .c-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cuisine-card .c-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.cuisine-card .c-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.cuisine-card .c-detail strong{color:var(--text)}
.cuisine-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.cuisine-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🍳 中国传统烹饪百科</h1>
<p>Chinese Traditional Cooking Encyclopedia — 探索八大菜系与中华美食文化</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索菜系、名菜或烹饪技法...（如"川菜""北京烤鸭""红烧"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部菜系</button>
<button class="filter-btn" data-filter="川菜">🌶️ 川菜</button>
<button class="filter-btn" data-filter="鲁菜">🍲 鲁菜</button>
<button class="filter-btn" data-filter="粤菜">🦐 粤菜</button>
<button class="filter-btn" data-filter="苏菜">🍜 苏菜</button>
<button class="filter-btn" data-filter="浙菜">🐟 浙菜</button>
<button class="filter-btn" data-filter="闽菜">🍲 闽菜</button>
<button class="filter-btn" data-filter="湘菜">🔥 湘菜</button>
<button class="filter-btn" data-filter="徽菜">🥩 徽菜</button>
<button class="filter-btn" data-filter="烹饪技法">🔪 烹饪技法</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="cuisine-grid" id="cuisineGrid"></div>
<footer><p>🍳 中国传统烹饪百科 — 民以食为天，食以味为先</p></footer>
</div>
<script>
const COOKING_DATA=[
  {id:1,name:"川菜",en:"Sichuan Cuisine",category:"川菜",icon:"🌶️",origin:"四川成都",features:"麻辣鲜香、一菜一格",history:"川菜是中国四大菜系之一，以麻辣著称。取材广泛，调味多变，被誉为'一菜一格，百菜百味'。",dishes:["麻婆豆腐","回锅肉","水煮鱼","宫保鸡丁","鱼香肉丝","夫妻肺片","担担面","火锅"],techniques:["炒","熘","炸","爆","煸","蒸","炖","煮"],seasonings:["花椒","辣椒","豆瓣酱","豆豉","泡椒","姜","蒜","葱"],culture:"川菜的精髓在于'味'，麻辣是其最突出的特点，但川菜讲究的是复合味型。"},
  {id:2,name:"鲁菜",en:"Shandong Cuisine",category:"鲁菜",icon:"🍲",origin:"山东济南",features:"咸鲜为主、雍容华贵",history:"鲁菜是中国四大菜系之首，是北方菜系的代表。历史上鲁菜曾是宫廷御膳的主要组成部分。",dishes:["糖醋鲤鱼","九转大肠","葱烧海参","爆炒腰花","油爆双脆","锅塌豆腐","奶汤蒲菜","四喜丸子"],techniques:["爆","炒","烧","塌","熘","炸","蒸","扒"],seasonings:["葱","姜","蒜","酱油","醋","糖","盐","料酒"],culture:"鲁菜讲究'以咸提鲜'，注重原汁原味，是中国宫廷菜的基础。"},
  {id:3,name:"粤菜",en:"Cantonese Cuisine",category:"粤菜",icon:"🦐",origin:"广东广州",features:"清淡鲜美、兼容并蓄",history:"粤菜是中国四大菜系之一，以清淡鲜美著称。粤菜善于吸收外来烹饪技法，兼容并蓄。",dishes:["白切鸡","烧鹅","叉烧","蒸鱼","虾饺","肠粉","煲仔饭","老火汤"],techniques:["蒸","炒","煲","焗","烤","卤","白灼","清蒸"],seasonings:["蚝油","豆豉","柱侯酱","海鲜酱","沙茶酱","XO酱","鱼露","陈皮"],culture:"粤菜以'鲜'为核心，讲究食材的新鲜和原味，是中国最国际化的菜系。"},
  {id:4,name:"苏菜",en:"Jiangsu Cuisine",category:"苏菜",icon:"🍜",origin:"江苏南京",features:"清淡平和、精致典雅",history:"苏菜是中国四大菜系之一，以精致典雅著称。苏菜注重刀工和火候，讲究色香味形俱全。",dishes:["松鼠鳜鱼","蟹粉狮子头","大煮干丝","水晶肴蹄","清炖蟹粉","盐水鸭","鸭血粉丝汤","无锡排骨"],techniques:["炖","焖","煨","蒸","烧","炒","熘","煎"],seasonings:["糖","醋","酱油","料酒","姜","葱","盐","胡椒"],culture:"苏菜体现了江南文化的精致和典雅，是中国文人菜的代表。"},
  {id:5,name:"浙菜",en:"Zhejiang Cuisine",category:"浙菜",icon:"🐟",origin:"浙江杭州",features:"清鲜脆嫩、讲究时令",history:"浙菜是中国四大菜系之一，以清鲜脆嫩著称。浙菜注重时令，讲究'不时不食'。",dishes:["西湖醋鱼","东坡肉","龙井虾仁","叫化鸡","宋嫂鱼羹","干炸响铃","油焖春笋","片儿川"],techniques:["蒸","炒","炖","焖","炸","烩","卤","糟"],seasonings:["糖","醋","酱油","酒","葱","姜","盐","味精"],culture:"浙菜体现了浙江人的精致生活态度，注重食材的时令和品质。"},
  {id:6,name:"闽菜",en:"Fujian Cuisine",category:"闽菜",icon:"🍲",origin:"福建福州",features:"汤菜为主、鲜香清淡",history:"闽菜是中国四大菜系之一，以汤菜著称。闽菜讲究'一汤十变'，注重汤的制作。",dishes:["佛跳墙","荔枝肉","醉排骨","太极明虾","红糟鸡","鸡汤氽海蚌","半月沉江","爆炒双脆"],techniques:["煨","蒸","炖","炒","炸","焖","糟","醉"],seasonings:["红糟","虾油","沙茶酱","鱼露","糖","醋","姜","蒜"],culture:"闽菜以汤见长，'无汤不成席'是闽菜的特色，体现了福建人对汤的热爱。"},
  {id:7,name:"湘菜",en:"Hunan Cuisine",category:"湘菜",icon:"🔥",origin:"湖南长沙",features:"香辣酸鲜、浓烈醇厚",history:"湘菜是中国四大菜系之一，以香辣著称。湘菜注重酸辣，口味浓烈。",dishes:["剁椒鱼头","毛氏红烧肉","小炒黄牛肉","湘西外婆菜","永州血鸭","腊味合蒸","东安鸡","组庵鱼翅"],techniques:["炒","蒸","炖","煨","腊","酱","熏","糟"],seasonings:["剁椒","腊肉","豆豉","腐乳","醋","蒜","姜","紫苏"],culture:"湘菜体现了湖南人'吃得苦、耐得烦、霸得蛮'的性格特点。"},
  {id:8,name:"徽菜",en:"Anhui Cuisine",category:"徽菜",icon:"🥩",origin:"安徽黄山",features:"重油重色、擅长烧炖",history:"徽菜是中国四大菜系之一，以重油重色著称。徽菜擅长烧炖，注重保持食材原味。",dishes:["臭鳜鱼","毛豆腐","一品锅","黄山双石","问政山笋","虎皮毛豆腐","刀板香","胡适一品锅"],techniques:["烧","炖","蒸","炒","炸","熏","腊","腌"],seasonings:["酱油","糖","醋","酒","姜","葱","盐","辣椒"],culture:"徽菜体现了徽商文化，'重油重色重火功'是其核心特点。"},
  {id:9,name:"炒",en:"Stir-frying",category:"烹饪技法",icon:"🔥",origin:"中国",features:"旺火速成、锅气十足",history:"炒是中国最重要的烹饪技法，分为生炒、熟炒、滑炒、干炒、软炒等。",dishes:["清炒时蔬","滑炒肉丝","干炒牛肉","软炒虾仁","生炒排骨","爆炒腰花","炒饭","炒面"],techniques:["生炒","熟炒","滑炒","干炒","软炒","爆炒","煸炒","清炒"],culture:"炒是中国烹饪的精髓，'镬气'是炒菜的灵魂。"},
  {id:10,name:"蒸",en:"Steaming",category:"烹饪技法",icon:"♨️",origin:"中国",features:"原汁原味、营养保留",history:"蒸是中国传统的烹饪技法，能最大程度保留食材的营养和原味。",dishes:["清蒸鱼","蒸排骨","蒸蛋","蒸包子","蒸饺","粉蒸肉","蒸螃蟹","蒸南瓜"],techniques:["清蒸","粉蒸","酿蒸","包蒸","干蒸","湿蒸","气蒸","水蒸"],culture:"蒸体现了中国烹饪'原汁原味'的理念，是最健康的烹饪方式之一。"}
];
function renderCards(data){
  document.getElementById('cuisineGrid').innerHTML=data.map(c=>`
    <div class="cuisine-card" data-category="${c.category}">
      <div class="c-header"><div class="c-icon">${c.icon}</div><div><div class="c-name">${c.name}</div><div class="c-sub">${c.en} · ${c.origin}</div></div></div>
      <div class="c-meta"><span>${c.features}</span></div>
      <div class="c-detail"><strong>历史：</strong>${c.history}</div>
      <div class="c-detail"><strong>代表菜：</strong>${c.dishes.join('、')}</div>
      <div class="c-detail"><strong>技法：</strong>${c.techniques.join('、')}</div>
      <div class="c-detail"><strong>调料：</strong>${c.seasonings.join('、')}</div>
      <div class="c-detail"><strong>文化：</strong>${c.culture}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(c=>{cats[c.category]=(cats[c.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">菜系/技法</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.cuisine-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.cuisine-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(COOKING_DATA);renderStats(COOKING_DATA);
</script>
</body>
</html>
