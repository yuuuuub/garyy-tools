<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国旅行预算计算器 - Chinese Travel Budget Calculator</title>
<meta name="description" content="中国旅行预算计算器，帮你估算交通、住宿、餐饮、门票等各项费用">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国旅行预算计算器 - Chinese Travel Budget Calculator">
<meta property="og:description" content="中国旅行预算计算器，帮你估算交通、住宿、餐饮、门票等各项费用">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💵</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#16a34a;--accent2:#15803d}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#16a34a;--accent2:#15803d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#041a0a 0%,#0a2e14 50%,#0f3d1c 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #166534;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#16a34a,#4ade80,#22c55e,#86efac);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1200px;margin:0 auto;padding:20px}
.calc-grid{display:grid;grid-template-columns:1fr 380px;gap:20px}
@media(max-width:768px){.calc-grid{grid-template-columns:1fr}}
.form-section{background:var(--card);border-radius:14px;padding:24px;border:1px solid var(--border)}
.form-section h2{font-size:1.1em;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--text2);font-weight:600}
.field input,.field select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;transition:border-color 0.2s}
.field input:focus,.field select:focus{border-color:var(--accent)}
.result-panel{position:sticky;top:20px}
.result-card{background:var(--card);border-radius:14px;padding:24px;border:1px solid var(--border);margin-bottom:16px}
.result-card h3{font-size:1em;margin-bottom:12px;color:var(--text2)}
.total-amount{font-size:2.8em;font-weight:700;color:var(--accent);margin:8px 0}
.total-label{font-size:0.85em;color:var(--text2)}
.breakdown-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:0.9em}
.breakdown-item:last-child{border-bottom:none}
.breakdown-item .label{color:var(--text2);display:flex;align-items:center;gap:6px}
.breakdown-item .value{font-weight:600}
.bar-chart{margin-top:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-row .bar-label{font-size:12px;color:var(--text2);width:60px;text-align:right}
.bar-row .bar-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-row .bar-fill{height:100%;border-radius:4px;transition:width 0.5s ease}
.bar-row .bar-pct{font-size:12px;color:var(--text2);width:40px}
.tip-box{background:rgba(22,163,74,0.08);border:1px solid rgba(22,163,74,0.2);border-radius:10px;padding:14px;font-size:0.85em;color:var(--text2);line-height:1.6;margin-top:12px}
.tip-box strong{color:var(--accent)}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>💵 中国旅行预算计算器</h1>
<p>Chinese Travel Budget Calculator — 精打细算，明明白白去旅行</p>
</header>
<div class="container">
<div class="calc-grid">
<div>
<div class="form-section" style="margin-bottom:16px">
<h2>✈️ 交通费用</h2>
<div class="form-row">
<div class="field"><label>往返机票 (¥)</label><input type="number" id="flight" value="2000" min="0" oninput="calc()"></div>
<div class="field"><label>当地交通/天 (¥)</label><input type="number" id="localTransport" value="80" min="0" oninput="calc()"></div>
</div>
<div class="form-row">
<div class="field"><label>高铁/火车票 (¥)</label><input type="number" id="train" value="0" min="0" oninput="calc()"></div>
<div class="field"><label>打车/网约车 (¥)</label><input type="number" id="taxi" value="200" min="0" oninput="calc()"></div>
</div>
</div>
<div class="form-section" style="margin-bottom:16px">
<h2>🏨 住宿费用</h2>
<div class="form-row">
<div class="field"><label>每晚价格 (¥)</label><input type="number" id="hotelPrice" value="300" min="0" oninput="calc()"></div>
<div class="field"><label>住宿天数</label><input type="number" id="hotelNights" value="5" min="1" oninput="calc()"></div>
</div>
</div>
<div class="form-section" style="margin-bottom:16px">
<h2>🍜 餐饮费用</h2>
<div class="form-row">
<div class="field"><label>早餐/天 (¥)</label><input type="number" id="breakfast" value="20" min="0" oninput="calc()"></div>
<div class="field"><label>午餐/天 (¥)</label><input type="number" id="lunch" value="50" min="0" oninput="calc()"></div>
</div>
<div class="form-row">
<div class="field"><label>晚餐/天 (¥)</label><input type="number" id="dinner" value="80" min="0" oninput="calc()"></div>
<div class="field"><label>零食饮品/天 (¥)</label><input type="number" id="snacks" value="30" min="0" oninput="calc()"></div>
</div>
</div>
<div class="form-section" style="margin-bottom:16px">
<h2>🎫 景点门票</h2>
<div class="form-row">
<div class="field"><label>景点门票 (¥)</label><input type="number" id="tickets" value="500" min="0" oninput="calc()"></div>
<div class="field"><label>体验项目 (¥)</label><input type="number" id="activities" value="300" min="0" oninput="calc()"></div>
</div>
</div>
<div class="form-section">
<h2>🛍️ 其他费用</h2>
<div class="form-row">
<div class="field"><label>购物预算 (¥)</label><input type="number" id="shopping" value="1000" min="0" oninput="calc()"></div>
<div class="field"><label>保险 (¥)</label><input type="number" id="insurance" value="100" min="0" oninput="calc()"></div>
</div>
<div class="form-row">
<div class="field"><label>通讯/WiFi (¥)</label><input type="number" id="sim" value="50" min="0" oninput="calc()"></div>
<div class="field"><label>其他杂费 (¥)</label><input type="number" id="misc" value="200" min="0" oninput="calc()"></div>
</div>
</div>
</div>
<div class="result-panel">
<div class="result-card">
<h3>💰 总预算</h3>
<div class="total-amount" id="totalAmount">¥0</div>
<div class="total-label">预估旅行总费用</div>
</div>
<div class="result-card">
<h3>📊 费用明细</h3>
<div class="breakdown-item"><span class="label">✈️ 交通</span><span class="value" id="bTransport">¥0</span></div>
<div class="breakdown-item"><span class="label">🏨 住宿</span><span class="value" id="bHotel">¥0</span></div>
<div class="breakdown-item"><span class="label">🍜 餐饮</span><span class="value" id="bFood">¥0</span></div>
<div class="breakdown-item"><span class="label">🎫 门票</span><span class="value" id="bTickets">¥0</span></div>
<div class="breakdown-item"><span class="label">🛍️ 其他</span><span class="value" id="bOther">¥0</span></div>
</div>
<div class="result-card">
<h3>📊 费用占比</h3>
<div class="bar-chart" id="barChart"></div>
</div>
<div class="tip-box">
<strong>💡 省钱小贴士：</strong><br>
• 提前预订机票和酒店可省15-30%<br>
• 使用公交地铁比打车便宜60%以上<br>
• 景区门票很多可通过官方APP提前购买<br>
• 错峰出行，避开国庆、春节等高峰期
</div>
</div>
</div>
<footer><p>💵 中国旅行预算计算器 — 旅行不花冤枉钱</p></footer>
</div>
<script>
const vals=id=>parseFloat(document.getElementById(id).value)||0;
const nights=()=>vals('hotelNights');
const colors=['#16a34a','#3b82f6','#f59e0b','#ef4444','#8b5cf6'];
const labels=['交通','住宿','餐饮','门票','其他'];
function calc(){
const days=nights();
const flight=vals('flight'),train=vals('train'),taxi=vals('taxi'),localTransport=vals('localTransport');
const transport=flight+train+taxi+localTransport*days;
const hotel=vals('hotelPrice')*nights();
const food=(vals('breakfast')+vals('lunch')+vals('dinner')+vals('snacks'))*days;
const tickets=vals('tickets')+vals('activities');
const other=vals('shopping')+vals('insurance')+vals('sim')+vals('misc');
const total=transport+hotel+food+tickets+other;
document.getElementById('totalAmount').textContent='¥'+total.toLocaleString();
document.getElementById('bTransport').textContent='¥'+transport.toLocaleString();
document.getElementById('bHotel').textContent='¥'+hotel.toLocaleString();
document.getElementById('bFood').textContent='¥'+food.toLocaleString();
document.getElementById('bTickets').textContent='¥'+tickets.toLocaleString();
document.getElementById('bOther').textContent='¥'+other.toLocaleString();
const parts=[transport,hotel,food,tickets,other];
const chart=document.getElementById('barChart');
chart.innerHTML='';
parts.forEach((v,i)=>{
const pct=total?Math.round(v/total*100):0;
chart.innerHTML+=`<div class="bar-row"><span class="bar-label">${labels[i]}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${colors[i]}"></div></div><span class="bar-pct">${pct}%</span></div>`;
});
}
calc();
</script>
</body>
</html>
