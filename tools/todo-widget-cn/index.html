<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>待办组件 - garyy-tools</title>
<meta name="description" content="待办事项小组件，支持添加、完成、删除、优先级标记">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;scroll-behavior:smooth}.container{max-width:500px;margin:auto;padding-bottom:50px}header{text-align:center;padding:28px 0 16px}h1{font-size:1.3rem;margin-bottom:4px}.sub{color:var(--text2);font-size:.85rem}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}button{padding:8px 16px;border-radius:6px;border:none;background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;transition:opacity .2s}button:hover{opacity:.85}input,select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.9rem;width:100%;outline:none;font-family:inherit}input:focus,select:focus{border-color:var(--blue)}.input-row{display:flex;gap:10px;margin-bottom:12px}.input-row input{flex:1}.input-row select{width:auto;flex-shrink:0}.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--bg);border-radius:6px;padding:4px}.tab{flex:1;text-align:center;padding:7px 0;border-radius:4px;cursor:pointer;font-size:.85rem;color:var(--text2);transition:all .2s}.tab.active{background:var(--blue);color:var(--text)}.todo-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);animation:fadeIn .3s ease}.todo-item:last-child{border:none}.todo-item .ck{width:18px;height:18px;cursor:pointer;accent-color:var(--green);flex-shrink:0}.todo-item .text{flex:1;font-size:.9rem;word-break:break-all}.todo-item .text.done{text-decoration:line-through;color:var(--text2)}.todo-item .priority{font-size:.7rem;padding:2px 6px;border-radius:4px;flex-shrink:0;font-weight:600}.priority.high{background:rgba(239,68,68,.15);color:var(--red)}.priority.mid{background:rgba(245,158,11,.15);color:var(--gold)}.priority.low{background:rgba(59,130,246,.15);color:var(--blue)}.todo-item .del{background:none;border:none;color:var(--red);cursor:pointer;font-size:.9rem;padding:4px;border-radius:4px;flex-shrink:0}.todo-item .del:hover{background:rgba(239,68,68,.15)}.count-info{text-align:center;color:var(--text2);font-size:.82rem;margin-top:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="待办组件 - garyy-tools">
<meta property="og:description" content="待办事项小组件，支持添加、完成、删除、优先级标记">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>📋 待办组件</h1>
<div class="sub">任务管理 · 优先级标记</div>
</header>
<div class="card">
<div class="input-row">
<input type="text" id="todoInput" placeholder="添加新任务..." maxlength="200">
<select id="prioritySel"><option value="mid">中</option><option value="high">高</option><option value="low">低</option></select>
<button id="btnAdd">添加</button>
</div>
<div class="tabs">
<div class="tab active" data-f="all">全部</div>
<div class="tab" data-f="active">待完成</div>
<div class="tab" data-f="done">已完成</div>
</div>
<div id="todoList"></div>
<div class="count-info" id="countInfo"></div>
</div>
</div>
<script>
(function(){
'use strict';
let todos=JSON.parse(localStorage.getItem('widget-todos')||'[]');
let filter='all';
const input=document.getElementById('todoInput');
const list=document.getElementById('todoList');
const countInfo=document.getElementById('countInfo');
function save(){localStorage.setItem('widget-todos',JSON.stringify(todos));}
function render(){
const filtered=todos.filter(t=>filter==='all'||(filter==='active'&&!t.done)||(filter==='done'&&t.done));
list.innerHTML=filtered.length?filtered.map(t=>'<div class="todo-item"><input type="checkbox" class="ck" '+(t.done?'checked':'')+' data-id="'+t.id+'"><div class="text'+(t.done?' done':'')+'">'+escHtml(t.text)+'</div><span class="priority '+t.priority+'">'+{high:'高',mid:'中',low:'低'}[t.priority]+'</span><button class="del" data-id="'+t.id+'">✕</button></div>').join(''):'<div style="text-align:center;color:var(--text2);padding:20px;font-size:.85rem">暂无任务</div>';
const total=todos.length,done=todos.filter(t=>t.done).length;
countInfo.textContent=total+'项任务，已完成 '+done+' 项';
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
document.getElementById('btnAdd').onclick=addTodo;
input.onkeydown=function(e){if(e.key==='Enter')addTodo();};
function addTodo(){
const text=input.value.trim();if(!text)return;
todos.unshift({id:Date.now(),text,done:false,priority:document.getElementById('prioritySel').value});
input.value='';save();render();
}
list.onclick=function(e){
if(e.target.classList.contains('ck')){
const id=+e.target.dataset.id;const t=todos.find(t=>t.id===id);if(t){t.done=!t.done;save();render();}
}
if(e.target.classList.contains('del')){
const id=+e.target.dataset.id;todos=todos.filter(t=>t.id!==id);save();render();
}
};
document.querySelectorAll('.tab').forEach(tab=>{
tab.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');filter=tab.dataset.f;render();};
});
render();
})();
</script>
</body>
</html>
