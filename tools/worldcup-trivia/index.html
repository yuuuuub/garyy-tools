<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ 世界杯冷知识问答 - Gary's Tools</title>
<meta name="description" content="2026世界杯趣味问答，测试你的足球知识！含世界杯历史之最、球队奇闻、球星冷知识等">
<style>
:root{--bg:#0d1a0d;--card:#132213;--text:#e0f0e0;--text2:#7a9a7a;--accent:#22c55e;--gold:#f59e0b;--red:#ef4444;--blue:#3b82f6;--border:#1a3a20;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 50%,rgba(34,197,94,.04),transparent 60%),radial-gradient(circle at 80% 50%,rgba(59,130,246,.04),transparent 60%);pointer-events:none}
.container{max-width:500px;width:100%;position:relative;z-index:1}
header{text-align:center;padding:24px 0}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#22c55e,#f59e0b,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.score-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.score-item{text-align:center}
.score-num{font-size:1.8rem;font-weight:900;color:var(--gold)}
.score-label{font-size:.7rem;color:var(--text2)}
.progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:20px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:2px;transition:width .4s}
.question-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;margin-bottom:16px;min-height:200px}
.q-num{font-size:.75rem;color:var(--text2);margin-bottom:12px}
.q-text{font-size:1.15rem;font-weight:700;line-height:1.6;margin-bottom:24px}
.options{display:flex;flex-direction:column;gap:10px}
.option{width:100%;padding:14px 18px;border:2px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-size:.9rem;cursor:pointer;transition:all .2s;text-align:left;font-family:inherit}
.option:hover:not(:disabled){border-color:var(--accent);background:rgba(34,197,94,.05)}
.option.correct{border-color:var(--accent);background:rgba(34,197,94,.15);color:var(--accent)}
.option.wrong{border-color:var(--red);background:rgba(239,68,68,.1);color:var(--red)}
.option:disabled{cursor:not-allowed}
.fact-box{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:10px;padding:12px 16px;margin-top:12px;font-size:.8rem;line-height:1.5;color:var(--gold);display:none}
.result-card{text-align:center;padding:40px 24px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.result-emoji{font-size:4rem;display:block;margin-bottom:12px}
.result-title{font-size:1.4rem;font-weight:800;margin-bottom:8px}
.result-msg{font-size:.85rem;color:var(--text2);line-height:1.6}
.btn-restart{display:inline-block;margin-top:20px;padding:12px 32px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:none;border-radius:25px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit}
footer{text-align:center;padding:20px 0;color:var(--text2);font-size:.7rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="⚽ 世界杯冷知识问答 - Gary's Tools">
  <meta property="og:description" content="2026世界杯趣味问答，测试你的足球知识！含世界杯历史之最、球队奇闻、球星冷知识等">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/worldcup-trivia/">
</head>
<body>
<div class="container">
<header><h1>⚽ 世界杯冷知识问答</h1><p>10道题测测你的足球知识等级</p></header>

<div class="score-bar">
<div class="score-item"><div class="score-num" id="scoreNum">0</div><div class="score-label">得分</div></div>
<div class="score-item"><div class="score-num" id="comboNum">0</div><div class="score-label">连对</div></div>
<div class="score-item"><div class="score-num" id="qRemain">10</div><div class="score-label">剩余</div></div>
</div>
<div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>

<div id="gameArea"></div>
<footer>⚽ 2026世界杯 · 知识就是力量</footer>
</div>

<script>
const QUESTIONS=[
{q:'2026年世界杯将在哪三个国家举办？',o:['美国、加拿大、墨西哥','美国、英国、法国','巴西、阿根廷、智利','卡塔尔、沙特、阿联酋'],a:0,f:'史上首次三国联合主办，也是首次扩军至48支球队'},
{q:'世界杯历史上夺冠次数最多的国家是？',o:['德国','阿根廷','巴西','意大利'],a:2,f:'巴西共5次夺冠(1958/1962/1970/1994/2002)，被称为"五星巴西"'},
{q:'世界杯单届进球纪录保持者是谁？',o:['贝利(巴西)','方丹(法国)','克洛泽(德国)','罗纳尔多(巴西)'],a:1,f:'方丹在1958年瑞典世界杯打入13球，这项纪录至今无人打破'},
{q:'2026世界杯首次扩军到多少支球队？',o:['32支','36支','40支','48支'],a:3,f:'从2026年开始世界杯从32支扩军到48支，小组赛改为16组×3队'},
{q:'世界杯参赛次数最多的球员是？',o:['C罗(葡萄牙)','梅西(阿根廷)','布冯(意大利)','马特乌斯(德国)'],a:1,f:'梅西和C罗都参加了5届世界杯(2006-2022)，但梅西还会参加2026届'},
{q:'哪个国家参加过所有届世界杯？',o:['德国','阿根廷','巴西','意大利'],a:2,f:'巴西是唯一参加了所有22届世界杯的国家，从1930年第一届至今从未缺席'},
{q:'世界杯最快进球用时多少秒？',o:['8.2秒','11秒','15秒','5.8秒'],a:1,f:'2002年世界杯，土耳其前锋哈坎·苏克在季军战中对韩国开场11秒破门'},
{q:'世界杯奖杯"大力神杯"有多重？',o:['3.8公斤','6.175公斤','10公斤','15公斤'],a:1,f:'大力神杯由18K金制成，高36.8厘米，重6.175公斤。1974年起替代雷米特杯'},
{q:'世界杯历史上最大比分胜利是多少？',o:['7-0','8-0','9-0','10-1'],a:2,f:'匈牙利9-0韩国(1954)、南斯拉夫9-0扎伊尔(1974)、匈牙利9-0萨尔瓦多(1982)'},
{q:'2022卡塔尔世界杯决赛比分是？',o:['法国2-1阿根廷','阿根廷2-1法国','阿根廷3-3法国(点球4-2)','法国3-3阿根廷(点球5-3)'],a:2,f:'120分钟3-3战平，点球大战阿根廷4-2夺冠，梅西圆梦大力神杯'},
];

let current=0,score=0,combo=0,maxCombo=0,answered=false;

function renderQ(){
if(current>=QUESTIONS.length)return renderResult();
answered=false;
const q=QUESTIONS[current];
document.getElementById('qRemain').textContent=QUESTIONS.length-current;
document.getElementById('progressBar').style.width=((current/QUESTIONS.length)*100)+'%';
document.getElementById('gameArea').innerHTML=`
<div class="question-card">
<div class="q-num">📋 第 ${current+1}/${QUESTIONS.length} 题</div>
<div class="q-text">${q.q}</div>
<div class="options">${q.o.map((o,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>
<div class="fact-box" id="factBox">💡 ${q.f}</div>
</div>`;
}

function answer(idx){
if(answered)return;
answered=true;
const q=QUESTIONS[current];
const btns=document.querySelectorAll('.option');
btns.forEach((b,i)=>{
b.disabled=true;
if(i===q.a)b.classList.add('correct');
if(i===idx&&i!==q.a)b.classList.add('wrong');
});

if(idx===q.a){
score+=10;combo++;
if(combo>maxCombo)maxCombo=combo;
if(combo>=3){score+=combo*2;}
}else{
combo=0;
}

document.getElementById('scoreNum').textContent=score;
document.getElementById('comboNum').textContent=combo;
document.getElementById('factBox').style.display='block';

setTimeout(()=>{current++;renderQ();},1800);
}

function renderResult(){
document.getElementById('progressBar').style.width='100%';
const max=QUESTIONS.length*10;
const pct=score/max;
let emoji,title,msg;
if(pct>=0.9){emoji='🏆';title='足球大师！';msg=`你得了 ${score} 分，世界杯知识已经炉火纯青！`;}
else if(pct>=0.7){emoji='⚽';title='资深球迷！';msg=`你得了 ${score} 分，对世界杯非常了解！`;}
else if(pct>=0.5){emoji='📺';title='普通球迷';msg=`你得了 ${score} 分，还需要多看几场球~`;}
else{emoji='🤔';title='足球新手';msg=`你得了 ${score} 分，趁世界杯前多补补知识吧！`;}

document.getElementById('gameArea').innerHTML=`
<div class="result-card">
<span class="result-emoji">${emoji}</span>
<div class="result-title">${title}</div>
<div class="result-msg">${msg}<br>最长连对：${maxCombo}题 | 总分：${score}/${max}</div>
<button class="btn-restart" onclick="restart()">🔄 再来一局</button>
</div>`;
}

function restart(){current=0;score=0;combo=0;maxCombo=0;document.getElementById('scoreNum').textContent='0';document.getElementById('comboNum').textContent='0';renderQ();}

renderQ();
</script>
</body>
</html>
