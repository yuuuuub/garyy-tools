<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期权策略分析</title>
<meta name="description" content="期权策略构建与盈亏分析，支持看涨看跌、价差、组合策略">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#f59e0b;--purple:#a855f7;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
.container{max-width:900px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
input,select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.9rem}
input:focus{outline:none;border-color:var(--blue)}
.btn{background:var(--blue);color:#fff;border:none;padding:10px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s;width:100%;margin-top:10px}
.btn:hover{opacity:.85}
.strategy-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.stab{padding:6px 12px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;cursor:pointer;background:var(--card);color:var(--text2);transition:all .2s}
.stab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.pnl-chart{width:100%;height:300px;position:relative;margin-top:10px}
.pnl-canvas{width:100%;height:100%}
.legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:.8rem}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.result-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.result-row:last-child{border-bottom:none}
.up{color:var(--green)}.down{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--border)}
th{color:var(--text2);font-weight:500;background:var(--bg)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="期权策略分析">
<meta property="og:description" content="期权策略构建与盈亏分析工具">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📈 期权策略分析</h1>
    <p>构建期权策略，分析盈亏曲线</p>
  </header>
  <div class="card">
    <div class="strategy-tabs" id="stratTabs">
      <div class="stab active" data-s="call">买入看涨</div>
      <div class="stab" data-s="put">买入看跌</div>
      <div class="stab" data-s="bull-spread">牛市价差</div>
      <div class="stab" data-s="bear-spread">熊市价差</div>
      <div class="stab" data-s="straddle">跨式组合</div>
      <div class="stab" data-s="strangle">宽跨式</div>
      <div class="stab" data-s="iron-condor">铁鹰式</div>
      <div class="stab" data-s="butterfly">蝶式</div>
    </div>
    <div class="form-grid">
      <div><label>标的现价</label><input type="number" id="spot" value="100" step="0.01"></div>
      <div><label>行权价 K1</label><input type="number" id="k1" value="100" step="0.01"></div>
      <div><label>行权价 K2</label><input type="number" id="k2" value="105" step="0.01"></div>
      <div><label>行权价 K3</label><input type="number" id="k3" value="110" step="0.01"></div>
      <div><label>期权费 (K1)</label><input type="number" id="premium1" value="3.5" step="0.01"></div>
      <div><label>期权费 (K2)</label><input type="number" id="premium2" value="1.8" step="0.01"></div>
      <div><label>合约数量</label><input type="number" id="lots" value="1" min="1" max="100"></div>
      <div><label>合约乘数</label><input type="number" id="multiplier" value="100" min="1"></div>
    </div>
    <button class="btn" id="calcBtn">分析策略</button>
  </div>
  <div id="pnlResult"></div>
  <div class="card" style="position:relative">
    <b>盈亏曲线</b>
    <canvas id="pnlCanvas" class="pnl-canvas"></canvas>
  </div>
  <div id="detailResult"></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const tabs=document.querySelectorAll('.stab');
let strategy='call';
tabs.forEach(t=>{t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');strategy=t.dataset.s;calc();}});
function calc(){
  const S=+$('spot').value;
  const K1=+$('k1').value,K2=+$('k2').value,K3=+$('k3').value;
  const p1=+$('premium1').value,p2=+$('premium2').value;
  const lots=+$('lots').value,mult=+$('multiplier').value;
  function payoff(ST){
    switch(strategy){
      case'call':return Math.max(ST-K1,0)-p1;
      case'put':return Math.max(K1-ST,0)-p1;
      case'bull-spread':return Math.max(Math.min(ST-K1,K2-K1),0)-p1+p2;
      case'bear-spread':return Math.max(Math.min(K1-ST,K1-K2),0)-p1+p2;
      case'straddle':return Math.max(ST-K1,0)+Math.max(K1-ST,0)-p1-p2;
      case'strangle':return Math.max(Math.max(ST-K2,0),0)+Math.max(Math.max(K1-ST,0),0)-p1-p2;
      case'iron-condor':return Math.max(Math.min(K1-ST,K1-K2),0)+Math.max(Math.min(ST-K3,K2-K3),0)-p1+p2-p1+p2;
      case'butterfly':return Math.max(Math.min(ST-K1,K2-K1),0)+Math.max(Math.min(K3-ST,K3-K2),0)-p1+2*p2-p1;
      default:return 0;
    }
  }
  const range=[];for(let x=S*0.5;x<=S*1.5;x+=S*0.02){range.push(Math.round(x*100)/100);}
  const pns=range.map(x=>payoff(x)*lots*mult);
  const maxPnL=Math.max(...pns),minPnL=Math.min(...pns);
  const maxGain=pns.reduce((m,v)=>v>m?v:m,0);
  const maxLoss=pns.reduce((m,v)=>v<m?v:m,0);
  const breakevens=range.filter((x,i)=>i>0&&(pns[i]*pns[i-1]<=0||(pns[i]===0))).map(x=>x);
  let html='<div class="card"><b>策略盈亏摘要</b>';
  const nameMap={call:'买入看涨',put:'买入看跌','bull-spread':'牛市价差','bear-spread':'熊市价差',straddle:'跨式组合',strangle:'宽跨式','iron-condor':'铁鹰式',butterfly:'蝶式'};
  html+=`<div class="result-row"><span class="result-label">策略类型</span><span class="result-val">${nameMap[strategy]}</span></div>`;
  html+=`<div class="result-row"><span class="result-label">最大收益</span><span class="result-val up">¥${maxGain.toFixed(2)}</span></div>`;
  html+=`<div class="result-row"><span class="result-label">最大亏损</span><span class="result-val down">¥${maxLoss.toFixed(2)}</span></div>`;
  html+=`<div class="result-row"><span class="result-label">盈亏平衡点</span><span class="result-val">${breakevens.length?breakevens.map(x=>'¥'+x.toFixed(2)).join(', '):'--'}</span></div>`;
  html+=`<div class="result-row"><span class="result-label">净期权费</span><span class="result-val">¥${((p1-p2)*lots*mult).toFixed(2)}</span></div>`;
  html+='</div>';
  $('pnlResult').innerHTML=html;
  // Draw chart
  const canvas=$('pnlCanvas');
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=(rect.width-36)*dpr;canvas.height=300*dpr;
  canvas.style.width=(rect.width-36)+'px';canvas.style.height='300px';
  ctx.scale(dpr,dpr);
  const w=rect.width-36,h=300;
  const pad={t:20,r:20,b:30,l:60};
  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;
  const xMin=range[0],xMax=range[range.length-1];
  const yRange=Math.max(Math.abs(maxPnL),Math.abs(minPnL))*1.2||100;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='var(--border)';ctx.lineWidth=0.5;
  for(let i=0;i<=5;i++){
    const y=pad.t+ph*i/5;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();
    ctx.fillStyle='#8b949e';ctx.font='11px sans-serif';ctx.textAlign='right';
    ctx.fillText((yRange-yRange*2*i/5).toFixed(0),pad.l-6,y+4);
  }
  const zeroY=pad.t+ph/2;
  ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,zeroY);ctx.lineTo(w-pad.r,zeroY);ctx.stroke();
  // Line
  ctx.beginPath();
  range.forEach((x,i)=>{
    const px=pad.l+(x-xMin)/(xMax-xMin)*pw;
    const py=pad.t+ph/2-pns[i]/yRange*ph/2;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  });
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.stroke();
  // Fill
  ctx.beginPath();
  range.forEach((x,i)=>{
    const px=pad.l+(x-xMin)/(xMax-xMin)*pw;
    const py=pad.t+ph/2-pns[i]/yRange*ph/2;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  });
  ctx.lineTo(pad.l+pw,zeroY);ctx.lineTo(pad.l,zeroY);ctx.closePath();
  ctx.fillStyle='rgba(59,130,246,0.08)';ctx.fill();
  // X labels
  ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';ctx.textAlign='center';
  for(let i=0;i<range.length;i+=Math.floor(range.length/6)){
    const px=pad.l+(range[i]-xMin)/(xMax-xMin)*pw;
    ctx.fillText(range[i].toFixed(0),px,h-6);
  }
  ctx.fillStyle='#8b949e';ctx.textAlign='center';ctx.fillText('到期价格',w/2,h);
  // Detail table
  let dt='<div class="card"><b>到期损益表</b><table><thead><tr><th>到期价</th><th>单位盈亏</th><th>总盈亏</th></tr></thead><tbody>';
  const step=Math.max(1,Math.floor(range.length/15));
  for(let i=0;i<range.length;i+=step){
    const v=pns[i];
    dt+=`<tr><td>¥${range[i].toFixed(2)}</td><td class="${v>=0?'up':'down'}">¥${(pns[i]/lots/mult).toFixed(2)}</td><td class="${v>=0?'up':'down'}">¥${v.toFixed(2)}</td></tr>`;
  }
  dt+='</tbody></table></div><div class="hint">数据为模拟数据，仅供参考</div>';
  $('detailResult').innerHTML=dt;
}
$('calcBtn').onclick=calc;
calc();
})();
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
