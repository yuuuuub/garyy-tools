<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中式时令饮食 - Chinese Seasonal Food</title>
<meta name="description" content="中式时令饮食指南，按季节推荐应季食材和经典节令美食">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中式时令饮食 - Chinese Seasonal Food">
<meta property="og:description" content="按季节推荐应季食材和经典节令美食">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-seasonal-food-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
header{background:linear-gradient(135deg,#1a0a00,#2a1505,#3d200a);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3010;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1200px;margin:0 auto;padding:20px}
.current-season{text-align:center;margin-bottom:24px;padding:20px;background:var(--card);border-radius:14px;border:1px solid var(--border)}
.current-season .season-icon{font-size:3em;margin-bottom:8px}
.current-season .season-name{font-size:1.6em;font-weight:bold;color:var(--accent)}
.current-season .season-desc{font-size:.88em;color:var(--text2);margin-top:4px}
.season-tabs{display:flex;gap:8px;margin-bottom:20px;justify-content:center;flex-wrap:wrap}
.season-tab{padding:10px 24px;border-radius:12px;border:2px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.95em;transition:all .2s;font-weight:600}
.season-tab:hover,.season-tab.active{border-color:var(--accent);color:var(--accent);background:rgba(232,168,124,.1)}
.section{margin-bottom:24px}
.section-title{font-size:1.1em;font-weight:bold;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ingredient-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ing-item{background:var(--card);border-radius:10px;padding:14px;border:1px solid var(--border);transition:all .3s}
.ing-item:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.ing-item .i-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ing-item .i-icon{font-size:1.4em}
.ing-item .i-name{font-size:.95em;font-weight:bold}
.ing-item .i-desc{font-size:.78em;color:var(--text2);line-height:1.5}
.dish-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.dish-item{background:var(--card);border-radius:10px;padding:14px;border:1px solid var(--border);transition:all .3s}
.dish-item:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.dish-item .d-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dish-item .d-icon{font-size:1.3em}
.dish-item .d-name{font-size:.95em;font-weight:bold}
.dish-item .d-desc{font-size:.78em;color:var(--text2);line-height:1.5}
.dish-item .d-season{font-size:.72em;color:var(--accent);margin-top:4px}
.tips-box{background:rgba(232,168,124,.1);border:1px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:20px}
.tips-box strong{color:var(--accent)}
.tips-box p{font-size:.85em;color:var(--text2);line-height:1.7;margin-top:6px}
footer{text-align:center;padding:30px;color:var(--text2);font-size:.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.ingredient-grid,.dish-list{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🌸 中式时令饮食</h1>
<p>Chinese Seasonal Food — 不时不食，顺时而食</p>
</header>
<div class="container">
<div class="current-season" id="currentSeason"></div>
<div class="season-tabs" id="seasonTabs"></div>
<div id="seasonContent"></div>
<footer><p>🌸 中式时令饮食 — 春生夏长，秋收冬藏</p></footer>
</div>
<script>
const SEASONS=[
{name:"春",icon:"🌸",color:"#10b981",months:"2月-4月",desc:"春季万物复苏，饮食以养肝护阳为主。多吃绿色蔬菜和芽苗类，少吃酸多食甘。",principles:["养肝护阳","多吃绿色蔬菜","少吃酸多食甘","芽苗类食材佳"],
ingredients:[
{name:"春笋",icon:"🎋",desc:"春季时令食材之王，鲜嫩脆爽。油焖春笋、腌笃鲜是经典做法。"},
{name:"荠菜",icon:"🥬",desc:"春季野菜代表，清香可口。荠菜馄饨、荠菜豆腐羹是春季经典。"},
{name:"香椿",icon:"🌿",desc:"独特的春季香气。香椿炒蛋、香椿拌豆腐是必吃菜式。"},
{name:"韭菜",icon:"🥬",desc:"'春韭贵如金'，春天的韭菜最鲜嫩。韭菜盒子、韭菜炒蛋是经典。"},
{name:"豆苗",icon:"🌱",desc:"清新鲜嫩的芽苗菜。上汤豆苗、豆苗炒虾仁是清淡佳品。"},
{name:"草莓",icon:"🍓",desc:"春季水果代表。新鲜草莓直接吃或做甜品。"}
],
dishes:[
{name:"腌笃鲜",icon:"🍲",desc:"春笋、咸肉、鲜肉炖汤，鲜上加鲜。江南春季必喝的汤。",season:"早春"},
{name:"油焖春笋",icon:"🍽️",desc:"春笋切段油焖，酱香浓郁。杭帮菜经典。",season:"春季"},
{name:"香椿炒蛋",icon:"🥚",desc:"香椿焯水切碎与鸡蛋同炒，春天独有的味道。",season:"春季"},
{name:"荠菜馄饨",icon:"🥟",desc:"荠菜猪肉馅馄饨，清新鲜美。江南春季传统美食。",season:"春季"},
{name:"春卷",icon:"🌯",desc:"立春时节的节令食品，寓意'咬春'。馅料可荤可素。",season:"立春"}
],
tips:"春季饮食宜清淡，多吃应季绿色蔬菜。春笋虽好但含草酸，焯水后再烹饪更健康。香椿含亚硝酸盐，一定要焯水。"},
{name:"夏",icon:"☀️",color:"#f59e0b",months:"5月-7月",desc:"夏季炎热，饮食以清热解暑为主。多吃瓜果和凉性食物，注意补充水分和盐分。",principles:["清热解暑","多吃瓜果","补充水分","清淡为主"],
ingredients:[
{name:"西瓜",icon:"🍉",desc:"夏季消暑第一果。西瓜皮可以炒菜，西瓜汁可做饮品。"},
{name:"苦瓜",icon:"🥒",desc:"清热解毒的夏季佳品。凉拌苦瓜、苦瓜炒蛋是经典。"},
{name:"绿豆",icon:"🫘",desc:"清热解毒。绿豆汤是夏季最佳消暑饮品。"},
{name:"黄瓜",icon:"🥒",desc:"清脆爽口，水分充足。拍黄瓜是夏季必吃的凉菜。"},
{name:"冬瓜",icon:"🍈",desc:"利尿消暑。冬瓜排骨汤、冬瓜虾仁是夏季清淡佳品。"},
{name:"莲藕",icon:"🪷",desc:"清热凉血。凉拌藕片、莲藕排骨汤是夏季好选择。"}
],
dishes:[
{name:"绿豆汤",icon:"🍵",desc:"清热解毒的消暑圣品。冰镇后饮用更佳。",season:"夏季"},
{name:"凉拌黄瓜",icon:"🥒",desc:"蒜泥拍黄瓜，酸辣爽口。夏季最受欢迎的凉菜。",season:"夏季"},
{name:"冬瓜排骨汤",icon:"🍲",desc:"清淡鲜美，消暑解腻。夏季家常汤品。",season:"夏季"},
{name:"酸梅汤",icon:"🥤",desc:"传统消暑饮品，酸甜开胃。冰镇后是夏日最佳饮品。",season:"夏季"},
{name:"凉面",icon:"🍜",desc:"芝麻酱凉面、鸡丝凉面。夏季最受欢迎的主食。",season:"夏季"}
],
tips:"夏季饮食要注意卫生，食物容易变质。西瓜虽好但性寒，脾胃虚寒者少吃。绿豆汤不要用铁锅煮。"},
{name:"秋",icon:"🍂",color:"#f97316",months:"8月-10月",desc:"秋季干燥，饮食以润肺养阴为主。多吃白色食物和水果，注意滋阴润燥。",principles:["润肺养阴","多吃白色食物","滋阴润燥","贴秋膘"],
ingredients:[
{name:"螃蟹",icon:"🦀",desc:"秋风起，蟹脚痒。大闸蟹是秋季最期待的美味。"},
{name:"板栗",icon:"🌰",desc:"秋季坚果代表。糖炒栗子、板栗烧鸡是经典做法。"},
{name:"银耳",icon:"🍄",desc:"润肺养颜。银耳莲子羹是秋季经典甜品。"},
{name:"梨",icon:"🍐",desc:"润肺止咳。冰糖炖雪梨是秋季养生佳品。"},
{name:"莲藕",icon:"🪷",desc:"秋天的莲藕最粉糯。桂花糯米藕是秋季经典。"},
{name:"柿子",icon:"🍅",desc:"秋季水果代表。软柿子和脆柿子各有风味。"}
],
dishes:[
{name:"清蒸大闸蟹",icon:"🦀",desc:"秋季最期待的美食。蘸姜醋食用，鲜美无比。",season:"秋季"},
{name:"桂花糯米藕",icon:"🪷",desc:"糯米灌入莲藕，淋上桂花蜜。江南秋季经典甜品。",season:"秋季"},
{name:"糖炒栗子",icon:"🌰",desc:"街边飘香的秋季美食。现炒现吃最香。",season:"秋季"},
{name:"银耳莲子羹",icon:"🍵",desc:"润肺养颜的甜品。冰镇或热饮皆宜。",season:"秋季"},
{name:"板栗烧鸡",icon:"🍗",desc:"板栗与鸡肉同烧，软糯鲜香。秋季家常菜。",season:"秋季"}
],
tips:"秋季干燥要多喝水多吃水果。大闸蟹性寒，配姜醋可中和。柿子不能与螃蟹同食。"},
{name:"冬",icon:"❄️",color:"#3b82f6",months:"11月-1月",desc:"冬季寒冷，饮食以温补为主。多吃肉类和根茎类食物，注意补肾驱寒。",principles:["温补驱寒","多吃肉类","补肾养藏","热食为主"],
ingredients:[
{name:"羊肉",icon:"🐑",desc:"冬季温补首选。涮羊肉、羊肉汤是冬季暖身佳品。"},
{name:"萝卜",icon:"🥕",desc:"'冬吃萝卜夏吃姜'。萝卜排骨汤、萝卜牛腩是冬季经典。"},
{name:"白菜",icon:"🥬",desc:"北方冬季的当家菜。白菜炖豆腐、醋溜白菜是家常菜。"},
{name:"红薯",icon:"🍠",desc:"冬季暖身食材。烤红薯是冬日街头最暖的味道。"},
{name:"饺子",icon:"🥟",desc:"冬至必吃。猪肉白菜馅、羊肉馅是冬季经典。"},
{name:"火锅",icon:"🍲",desc:"冬季聚餐首选。涮菜涮肉，暖身又暖心。"}
],
dishes:[
{name:"涮羊肉",icon:"🐑",desc:"铜锅涮肉，蘸麻酱。北京冬季最温暖的美食。",season:"冬季"},
{name:"羊肉汤",icon:"🍲",desc:"驱寒暖身的汤品。配烧饼是冬季早餐标配。",season:"冬季"},
{name:"饺子",icon:"🥟",desc:"冬至不端饺子碗，冻掉耳朵没人管。冬季必吃。",season:"冬至"},
{name:"火锅",icon:"🍲",desc:"围炉而坐，涮菜涮肉。冬季聚餐的最佳选择。",season:"冬季"},
{name:"糖炒栗子",icon:"🌰",desc:"冬日街头的暖手美食。现炒现吃最香。",season:"冬季"}
],
tips:"冬季饮食要温热，少吃生冷。羊肉性温，适合冬季食用。火锅虽好但不宜过量，注意蔬菜搭配。"}
];
function getCurrentSeason(){
  const m=new Date().getMonth();
  if(m>=1&&m<=3)return 0;
  if(m>=4&&m<=6)return 1;
  if(m>=7&&m<=9)return 2;
  return 3;
}
let currentSeasonIdx=getCurrentSeason();
function render(){
  const season=SEASONS[currentSeasonIdx];
  document.getElementById('currentSeason').innerHTML=`
    <div class="season-icon">${season.icon}</div>
    <div class="season-name">${season.name}季 · ${season.months}</div>
    <div class="season-desc">${season.desc}</div>`;
  document.getElementById('seasonTabs').innerHTML=SEASONS.map((s,i)=>`
    <button class="season-tab ${i===currentSeasonIdx?'active':''}" onclick="switchSeason(${i})">${s.icon} ${s.name}季</button>`).join('');
  document.getElementById('seasonContent').innerHTML=`
    <div class="tips-box"><strong>📋 ${season.name}季饮食原则</strong><p>${season.principles.join(' · ')}</p></div>
    <div class="section"><div class="section-title">🥬 应季食材</div><div class="ingredient-grid">${season.ingredients.map(i=>`
      <div class="ing-item"><div class="i-head"><span class="i-icon">${i.icon}</span><span class="i-name">${i.name}</span></div><div class="i-desc">${i.desc}</div></div>`).join('')}</div></div>
    <div class="section"><div class="section-title">🍽️ 时令美食</div><div class="dish-list">${season.dishes.map(d=>`
      <div class="dish-item"><div class="d-head"><span class="d-icon">${d.icon}</span><span class="d-name">${d.name}</span></div><div class="d-desc">${d.desc}</div><div class="d-season">🗓️ ${d.season}</div></div>`).join('')}</div></div>
    <div class="tips-box"><strong>💡 ${season.name}季饮食贴士</strong><p>${season.tips}</p></div>`;
}
function switchSeason(idx){currentSeasonIdx=idx;render()}
render();
</script>
</body>
</html>
