<div class="container"><h1>🎪 中国木偶戏</h1><p class="sub">木偶类型 · 表演技艺 · 地方流派 · 经典剧目</p>

<script>
var data=[
{title:'木偶戏起源',era:'汉代',cat:'历史',tags:['傀儡','丧葬','百戏'],desc:'木偶戏起源于汉代的"傀儡"，最初用于丧葬仪式。',detail:'木偶戏古称"傀儡戏"，起源于汉代。最初木偶用于丧葬仪式中的"俑"，后来发展为表演用的"傀儡"。汉代"百戏"中已有木偶表演的记载。三国时期马钧制作的木偶能表演各种杂技，标志着木偶戏从丧葬仪式走向娱乐表演。',ref:'《风俗通义》'},
{title:'唐宋繁荣',era:'唐宋',cat:'历史',tags:['宫廷','市井','专业'],desc:'唐代木偶戏进入宫廷，宋代在市井中广泛演出。',detail:'唐代木偶戏进入宫廷，唐玄宗曾作诗咏傀儡。宋代城市经济发展，木偶戏在瓦舍勾栏中广泛演出，成为市民娱乐的重要形式。宋代木偶戏已分化出多种类型，出现了专业的木偶戏班子。《东京梦华录》记载了开封木偶戏演出的盛况。',ref:'《东京梦华录》'},
{title:'明清鼎盛',era:'明清',cat:'历史',tags:['鼎盛','地方特色','出国'],desc:'明清是木偶戏的鼎盛期，形成了众多地方流派。',detail:'明清时期木偶戏达到鼎盛。福建、广东、浙江、湖南等地形成了各具特色的地方流派。清代木偶戏还传播到了东南亚各国，在印尼、泰国、缅甸等地产生了深远影响。印尼的"瓦扬"木偶戏就深受中国木偶戏的影响。',ref:'《中国木偶戏史》'},
{title:'提线木偶',era:'汉代至今',cat:'类型',tags:['悬丝傀儡','线戏','最复杂'],desc:'用丝线操纵的木偶，是最古老也是最复杂的木偶类型。',detail:'提线木偶又称"悬丝傀儡"，是中国最古老的木偶类型。木偶身体各部位系有丝线，艺人从上方操纵。一个复杂的提线木偶可有16-30根线，能做出各种细腻的动作。福建泉州提线木偶最为著名，2006年被列入国家级非物质文化遗产。',ref:'《泉州木偶戏》'},
{title:'掌中木偶',era:'明代至今',cat:'类型',tags:['布袋戏','掌中戏','灵活'],desc:'套在手上表演的木偶，又称"布袋戏"，动作灵活敏捷。',detail:'掌中木偶又称"布袋戏"或"掌中戏"，木偶头部和四肢用布袋连接，艺人将手伸入布袋操纵。掌中木偶动作灵活、表演生动，特别适合武打场面。福建漳州和台湾的布袋戏最为著名。台湾的"霹雳布袋戏"将传统布袋戏与现代科技结合，风靡全球。',ref:'《布袋戏史话》'},
{title:'杖头木偶',era:'汉代至今',cat:'类型',tags:['举偶','大偶','气势'],desc:'用木杖操纵的大型木偶，又称"举偶"，造型高大、气势磅礴。',detail:'杖头木偶又称"举偶"或"托棍木偶"。木偶头部用木杖支撑，双手各有一根操纵杆。杖头木偶体型较大（约60-100厘米），动作舒展大方，适合表现气势恢宏的场面。四川、陕西、广东等地的杖头木偶各具特色。',ref:'《中国木偶艺术》'},
{title:'铁枝木偶',era:'清代至今',cat:'类型',tags:['潮州','铁枝','独特'],desc:'用铁枝操纵的木偶，是潮州特有的木偶类型。',detail:'铁枝木偶是广东潮州特有的木偶类型。木偶背后有三根铁枝：一根支撑身体，两根操纵双手。铁枝木偶体型较小（约30厘米），操纵灵活，表演细腻。铁枝木偶与潮剧配合演出，具有浓郁的潮州地方特色。',ref:'《潮州木偶戏》'},
{title:'雕刻',era:'历代',cat:'技艺',tags:['木雕','彩绘','造型'],desc:'木偶头的雕刻是木偶制作的核心，讲究造型传神、彩绘精美。',detail:'木偶头的雕刻是木偶制作最核心的工序。艺人以樟木为材料，用刻刀雕刻出人物的面部表情。一个精美的木偶头需要经过粗雕、细雕、打磨、上漆、彩绘等多道工序。福建泉州木偶头雕刻大师江加走的作品被视为国宝。',ref:'《泉州木偶头雕刻》'},
{title:'操纵技巧',era:'历代',cat:'技艺',tags:['操纵','手眼配合','表演'],desc:'木偶操纵是木偶戏的灵魂，要求手眼配合、身心合一。',detail:'木偶操纵是一门独特的技艺。提线木偶要求艺人双手同时操纵多根丝线，掌中木偶要求手指灵活配合。高水平的木偶艺人可以让木偶做出穿衣、写字、舞剑、翻跟头等各种动作。"人偶合一"是木偶操纵的最高境界。',ref:'《木偶表演艺术》'},
{title:'配音唱腔',era:'历代',cat:'技艺',tags:['配音','一人多角','口技'],desc:'木偶戏的配音由幕后艺人完成，一人常需为多个角色配音。',detail:'木偶戏的配音由幕后艺人完成。高水平的木偶艺人"一人多角"——一个人为多个角色配音，同时操纵木偶表演。配音要求声情并茂，既能演唱又能口技。有些地方的木偶戏还配有乐队伴奏，音乐与表演相得益彰。',ref:'《木偶戏表演艺术》'},
{title:'泉州木偶戏',era:'宋代至今',cat:'流派',tags:['提线','泉州','闽南'],desc:'福建泉州的提线木偶戏，是中国木偶戏的代表，已列入联合国非遗。',detail:'泉州提线木偶戏是中国木偶戏的杰出代表。其特点是木偶制作精美、操纵技巧高超、表演细腻传神。泉州木偶戏以闽南语演唱，配有南音乐队伴奏。2006年被列入国家级非物质文化遗产，2012年入选联合国教科文组织"人类非物质文化遗产代表作名录"。',ref:'《泉州木偶戏》'},
{title:'漳州布袋戏',era:'明代至今',cat:'流派',tags:['布袋','漳州','闽南'],desc:'福建漳州的掌中木偶戏，以武打场面精彩著称。',detail:'漳州布袋戏是福建漳州的传统掌中木偶戏。其特点是木偶制作精巧、操纵灵活、武打场面精彩。漳州布袋戏以闽南语演唱，剧目多取材于历史演义和武侠小说。"掌中木偶艺术"被列入国家级非物质文化遗产。',ref:'《漳州布袋戏》'},
{title:'台湾霹雳布袋戏',era:'1980年代至今',cat:'流派',tags:['霹雳','创新','影视'],desc:'将传统布袋戏与现代影视技术结合，创造全新的演出形式。',detail:'霹雳布袋戏是台湾的创新布袋戏形式，由黄俊雄创立。霹雳布袋戏将传统布袋戏与现代影视技术结合，制作了大量电视剧和电影。其特点是木偶造型华丽、特效丰富、剧情曲折，吸引了大量年轻观众。代表作有《霹雳神州》《素还真》系列。',ref:'《霹雳布袋戏》'},
{title:'《西游记》',era:'历代',cat:'剧目',tags:['孙悟空','降妖','神话'],desc:'木偶戏的经典剧目，孙悟空的猴戏表演尤为精彩。',detail:'《西游记》是木偶戏最受欢迎的剧目之一。孙悟空的猴戏表演是木偶戏的绝活——通过精妙的操纵技巧，木偶孙悟空能做出翻跟头、舞金箍棒等各种高难度动作。猪八戒的憨态可掬、沙僧的忠厚老实，都通过木偶的表演栩栩如生。',ref:'《西游记》'},
{title:'《大闹天宫》',era:'1960年代',cat:'剧目',tags:['孙悟空','动画','经典'],desc:'上海美术电影制片厂制作的木偶动画片，是木偶艺术的经典之作。',detail:'《大闹天宫》是1960年代上海美术电影制片厂制作的木偶动画片（实为剪纸动画，但常与木偶动画并提），是中国人自主制作的第一部彩色动画长片。虽然严格来说不是木偶戏，但其精美的造型设计深受传统木偶艺术的影响。',ref:'《中国动画电影史》'},
{title:'《赵氏孤儿》',era:'元代至今',cat:'剧目',tags:['悲剧','忠义','程婴'],desc:'经典悲剧剧目，讲述程婴舍子救孤的忠义故事。',detail:'《赵氏孤儿》是元代杂剧家纪君祥创作的悲剧，也是木偶戏的经典剧目。故事讲述春秋时期程婴为保护赵氏孤儿，牺牲自己的儿子的忠义故事。这部剧是中国十大古典悲剧之一，曾被翻译成多种语言在欧洲上演。',ref:'《元曲选》'},
{title:'木偶与印尼瓦扬',era:'明代至今',cat:'历史',tags:['传播','东南亚','文化交流'],desc:'中国木偶戏传播到东南亚，对印尼瓦扬木偶戏产生深远影响。',detail:'中国木偶戏在明代随华人移民传播到东南亚各国。印尼的"瓦扬"（Wayang）木偶戏深受中国提线木偶和皮影戏的影响。泰国、缅甸、越南等国也有类似中国木偶戏的传统。这是中国与东南亚文化交流的重要见证。',ref:'《东南亚文化史》'}
];
var currentCat='all';
function renderList(items){
  var el=document.getElementById('list');
  var s=document.getElementById('stats');
  s.textContent='共 '+items.length+' 条知识';
  el.innerHTML=items.map(function(d,i){
    return '<div class="item" onclick="this.classList.toggle(\'open\')">'+
    '<div class="item-title">'+d.title+'</div>'+
    '<div class="item-era">年代：'+d.era+'</div>'+
    '<div class="item-desc">'+d.desc+'</div>'+
    '<div class="item-detail"><h4>详细介绍</h4><p>'+d.detail+'</p>'+
    '<p style="margin-top:8px;color:var(--accent2)">参考：'+d.ref+'</p>'+
    '<div>'+d.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div></div>';
  }).join('');
}
function filterList(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=data.filter(function(d){
    var matchQ=d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q)||d.era.toLowerCase().includes(q);
    var matchC=currentCat==='all'||d.cat===currentCat;
    return matchQ&&matchC;
  });
  renderList(filtered);
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterList();
}
renderList(data);
</script></body></html>
