<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字动态效果 - 交互式文字动画</title>
<meta property="og:title" content="汉字动态效果 - 交互式文字动画">
<meta property="og:description" content="汉字动态效果 - 多种交互式文字动画模式 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="汉字动态效果 - 弹跳、波浪、旋转、缩放脉冲、色彩循环、重力下落等多种动画模式">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--transition:0.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:800px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px;transition:var(--transition)}
.btn:hover{opacity:.85}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn-secondary{background:var(--border);color:var(--text)}
.input{width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:1rem;text-align:center;margin-bottom:12px}
.input:focus{outline:none;border-color:var(--blue)}
.preset-chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.preset-chip{padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:.85rem;transition:var(--transition)}
.preset-chip:hover,.preset-chip.active{border-color:var(--blue);color:var(--blue)}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mode-card{padding:12px;text-align:center;background:var(--bg);border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:var(--transition)}
.mode-card:hover{border-color:var(--blue)}
.mode-card.active{border-color:var(--blue);background:rgba(59,130,246,0.1)}
.mode-icon{font-size:1.5rem;margin-bottom:4px}
.mode-name{font-size:.8rem;color:var(--text2)}
.preview{min-height:200px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius);margin:16px 0;overflow:hidden;position:relative}
.preview .char-span{display:inline-block;font-size:3rem;font-weight:bold;transition:none;position:relative}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}
.controls label{font-size:.85rem;color:var(--text2);white-space:nowrap}
.controls input[type="range"]{width:100px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>🎭 汉字动态效果</h1>
  <p class="sub">交互式文字动画，多种模式可选</p>

  <div class="card">
    <input class="input" id="textInput" placeholder="输入文字" value="天道酬勤" oninput="updatePreview()">
    <h3 style="margin:12px 0 8px;font-size:.9rem">快捷短语</h3>
    <div class="preset-chips">
      <div class="preset-chip active" onclick="setPreset(this,'天道酬勤')">天道酬勤</div>
      <div class="preset-chip" onclick="setPreset(this,'学无止境')">学无止境</div>
      <div class="preset-chip" onclick="setPreset(this,'厚德载物')">厚德载物</div>
      <div class="preset-chip" onclick="setPreset(this,'自强不息')">自强不息</div>
      <div class="preset-chip" onclick="setPreset(this,'宁静致远')">宁静致远</div>
      <div class="preset-chip" onclick="setPreset(this,'海纳百川')">海纳百川</div>
    </div>
    <h3 style="margin:12px 0 8px;font-size:.9rem">动画模式</h3>
    <div class="mode-grid">
      <div class="mode-card active" onclick="setMode(this,0)"><div class="mode-icon"> bounce</div><div class="mode-name">弹跳</div></div>
      <div class="mode-card" onclick="setMode(this,1)"><div class="mode-icon">🌊</div><div class="mode-name">波浪</div></div>
      <div class="mode-card" onclick="setMode(this,2)"><div class="mode-icon">🔄</div><div class="mode-name">旋转</div></div>
      <div class="mode-card" onclick="setMode(this,3)"><div class="mode-icon">💫</div><div class="mode-name">缩放脉冲</div></div>
      <div class="mode-card" onclick="setMode(this,4)"><div class="mode-icon">🌈</div><div class="mode-name">色彩循环</div></div>
      <div class="mode-card" onclick="setMode(this,5)"><div class="mode-icon">⬇️</div><div class="mode-name">重力下落</div></div>
    </div>
  </div>

  <div class="card">
    <div class="preview" id="preview"></div>
    <div class="controls">
      <label>速度:</label>
      <input type="range" id="speedSlider" min="1" max="10" value="5" oninput="updateSpeedLabel()">
      <span id="speedLabel" style="font-size:.85rem;color:var(--text2)">5</span>
      <label>强度:</label>
      <input type="range" id="intensitySlider" min="1" max="10" value="5">
    </div>
    <div class="btn-group" style="justify-content:center">
      <button class="btn" onclick="startAnim()">▶ 播放</button>
      <button class="btn btn-secondary" onclick="pauseAnim()">⏸ 暂停</button>
      <button class="btn btn-secondary" onclick="resetAnim()">↺ 重置</button>
      <button class="btn btn-secondary" onclick="toggleTheme()">🌓 主题</button>
    </div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var animType = 0;
var animId = null;
var paused = false;
var frame = 0;
var charSpans = [];

var presets = {
  'bounce':function(i,t,speed,intensity){var h=Math.abs(Math.sin(t*speed*0.003+i*0.8))*30*intensity/5;return 'translateY('+-h+'px)'},
  'wave':function(i,t,speed,intensity){var y=Math.sin(t*speed*0.003+i*0.6)*20*intensity/5;var r=Math.sin(t*speed*0.002+i*0.4)*10*intensity/5;return 'translateY('+y+'px) rotate('+r+'deg)'},
  'rotate':function(i,t,speed,intensity){var r=Math.sin(t*speed*0.004+i*0.7)*360*intensity/10;return 'rotate('+r+'deg)'},
  'scale':function(i,t,speed,intensity){var s=1+Math.sin(t*speed*0.004+i*0.5)*0.3*intensity/5;return 'scale('+s+')'},
  'color':function(i,t,speed,intensity){return ''},
  'gravity':function(i,t,speed,intensity){var h=Math.abs(Math.sin(t*speed*0.002+i*1.2))*60*intensity/5;return 'translateY('+-h+'px)'}
};

function setPreset(el, text) {
  document.querySelectorAll('.preset-chip').forEach(function(c) { c.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('textInput').value = text;
  updatePreview();
}

function setMode(el, idx) {
  document.querySelectorAll('.mode-card').forEach(function(c) { c.classList.remove('active'); });
  el.classList.add('active');
  animType = idx;
  resetAnim();
  startAnim();
}

function updatePreview() {
  var text = document.getElementById('textInput').value || '天道酬勤';
  var html = '';
  for (var i = 0; i < text.length; i++) {
    var color = animType === 4 ? 'hsl(' + ((i * 60) % 360) + ',70%,60%)' : 'var(--text)';
    html += '<span class="char-span" style="color:' + color + '">' + text[i] + '</span>';
  }
  document.getElementById('preview').innerHTML = html;
  charSpans = document.querySelectorAll('.char-span');
}

function startAnim() {
  if (animId && !paused) return;
  paused = false;
  updatePreview();
  animate();
}

function pauseAnim() { paused = true; }

function resetAnim() {
  paused = false;
  frame = 0;
  if (animId) cancelAnimationFrame(animId);
  animId = null;
  updatePreview();
}

function animate() {
  if (paused) return;
  var speed = parseInt(document.getElementById('speedSlider').value);
  var intensity = parseInt(document.getElementById('intensitySlider').value);
  var modeNames = ['bounce','wave','rotate','scale','color','gravity'];
  var modeFn = presets[modeNames[animType]];

  charSpans.forEach(function(span, i) {
    var transform = modeFn(i, frame, speed, intensity);
    span.style.transform = transform;
    if (animType === 4) {
      var hue = (frame * 3 + i * 40) % 360;
      span.style.color = 'hsl(' + hue + ',70%,60%)';
    }
  });

  frame++;
  animId = requestAnimationFrame(animate);
}

function updateSpeedLabel() {
  document.getElementById('speedLabel').textContent = document.getElementById('speedSlider').value;
}

function toggleTheme() {
  var h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
}

updatePreview();
startAnim();
</script>
</body>
</html>
