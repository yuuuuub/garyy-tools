<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字动态效果</title>
<meta name="description" content="汉字粒子动画、打字机效果、弹跳、旋转等动态文字效果">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:800px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.canvas-container{position:relative;width:100%;height:400px;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:12px 0}
canvas{width:100%;height:100%}
.effect-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.effect-btn{padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;transition:all .2s}
.effect-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.effect-btn.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
.effect-btn .icon{font-size:1.5rem;margin-bottom:4px}.effect-btn .label{font-size:.8rem;color:var(--text2)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.speed-slider{-webkit-appearance:none;width:150px;height:6px;background:var(--border);border-radius:3px;outline:none}
.speed-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--accent);border-radius:50%;cursor:pointer}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="汉字动态效果">
<meta property="og:description" content="粒子动画、打字机、弹跳等动态效果">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>✨ 汉字动态效果</h1><p>粒子动画、打字机、弹跳、旋转等动态文字效果</p></div>

<div class="cd"><h2>设置</h2>
<div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap">
<div><label style="font-size:.85rem;color:var(--text2)">输入文字</label><input type="text" id="textInput" value="汉字之美" maxlength="20" style="width:200px;margin-top:4px"></div>
<div><label style="font-size:.85rem;color:var(--text2)">速度</label><div><input type="range" class="speed-slider" id="speedSlider" min="1" max="10" value="5"></div></div>
</div></div>

<div class="cd"><h2>选择效果</h2>
<div class="effect-grid" id="effectGrid"></div>
<div class="controls">
<button onclick="startEffect()">▶ 播放</button>
<button class="sec" onclick="stopEffect()">⏹ 停止</button>
<button class="sec" onclick="resetCanvas()">↺ 重置</button>
</div></div>

<div class="cd"><h2>效果预览</h2>
<div class="canvas-container"><canvas id="mainCanvas"></canvas></div></div>

<div class="cd"><h2>效果说明</h2><div id="effectDesc" style="color:var(--text2);font-size:.9rem"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let canvas,ctx;let currentEffect='particle';let animId=null;let particles=[];let charPositions=[];
const colors=['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#f97316'];

const effects=[
{id:'particle',name:'粒子散落',icon:'🌟',desc:'汉字分解成粒子后重新聚合'},
{id:'typewriter',name:'打字机',icon:'⌨️',desc:'逐字打出，带光标闪烁'},
{id:'bounce',name:'弹跳',icon:'🏀',desc:'每个字依次弹跳出现'},
{id:'rotate3d',name:'3D旋转',icon:'🔄',desc:'文字3D旋转进入'},
{id:'wave',name:'波浪',icon:'🌊',desc:'文字呈波浪形运动'},
{id:'glitch',name:'故障干扰',icon:'📡',desc:'随机位移和色彩偏移'},
{id:'explode',name:'爆炸',icon:'💥',desc:'文字爆炸四散'},
{id:'rain',name:'字符雨',icon:'🌧️',desc:'矩阵风格字符雨'},
{id:'spiral',name:'螺旋',icon:'🌀',desc:'文字螺旋展开'},
{id:'scale',name:'缩放弹出',icon:'🔍',desc:'文字从无到有弹性缩放'},
{id:'slide',name:'滑入',icon:'➡️',desc:'文字从不同方向滑入'},
{id:'fade',name:'逐字淡入',icon:'☁️',desc:'文字逐个淡入显示'},
];

function init(){
  canvas=$('mainCanvas');
  const container=canvas.parentElement;
  canvas.width=container.clientWidth;canvas.height=container.clientHeight;
  ctx=canvas.getContext('2d');
  $('effectGrid').innerHTML=effects.map(e=>`<div class="effect-btn ${e.id===currentEffect?'active':''}" onclick="selectEffect('${e.id}')"><div class="icon">${e.icon}</div><div class="label">${e.name}</div></div>`).join('');
  selectEffect(currentEffect);
  resetCanvas();
  window.addEventListener('resize',()=>{canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight;resetCanvas()});
}

function selectEffect(id){
  currentEffect=id;
  document.querySelectorAll('.effect-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.effect-btn[onclick="selectEffect('${id}')"]`).classList.add('active');
  const e=effects.find(x=>x.id===id);
  $('effectDesc').textContent=e?e.desc:'';
}

function resetCanvas(){
  stopEffect();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles=[];charPositions=[];
}

function startEffect(){
  stopEffect();resetCanvas();
  const text=$('textInput').value||'汉字之美';
  const speed=parseInt($('speedSlider').value);
  switch(currentEffect){
    case'particle':initParticle(text,speed);break;
    case'typewriter':initTypewriter(text,speed);break;
    case'bounce':initBounce(text,speed);break;
    case'rotate3d':initRotate3d(text,speed);break;
    case'wave':initWave(text,speed);break;
    case'glitch':initGlitch(text,speed);break;
    case'explode':initExplode(text,speed);break;
    case'rain':initRain(text,speed);break;
    case'spiral':initSpiral(text,speed);break;
    case'scale':initScale(text,speed);break;
    case'slide':initSlide(text,speed);break;
    case'fade':initFade(text,speed);break;
  }
}

function stopEffect(){if(animId)cancelAnimationFrame(animId);animId=null}

function initParticle(text,speed){
  const chars=[...text];
  const fontSize=Math.min(60,canvas.width/(chars.length+1));
  const startX=(canvas.width-fontsSize*chars.length)/2;
  chars.forEach((ch,i)=>{
    const targetX=startX+i*fontSize+fontSize/2;
    const targetY=canvas.height/2;
    for(let j=0;j<30;j++){
      particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,targetX,targetY,ch,sz:fontSize*(0.3+Math.random()*0.7),color:colors[i%colors.length],vx:0,vy:0,settled:false});
    }
  });
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let allSettled=true;
    particles.forEach(p=>{
      const dx=p.targetX-p.x;const dy=p.targetY-p.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>1){p.x+=dx*0.05*speed/5;p.y+=dy*0.05*speed/5;allSettled=false}
      else{p.x=p.targetX;p.y=p.targetY}
      ctx.globalAlpha=Math.min(1,dist/50+0.5);ctx.fillStyle=p.color;
      ctx.font=`bold ${p.sz}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(p.ch,p.x,p.y);
    });
    ctx.globalAlpha=1;
    if(!allSettled)animId=requestAnimationFrame(animate);
  }
  animId=requestAnimationFrame(animate);
}

function initTypewriter(text,speed){
  const chars=[...text];
  const fontSize=Math.min(60,canvas.width/(chars.length+1));
  const startX=(canvas.width-fontsSize*chars.length)/2;
  let idx=0;let cursorVisible=true;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.font=`bold ${fontSize}px "PingFang SC","Noto Sans SC",sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
    for(let i=0;i<idx;i++){
      ctx.fillText(chars[i],startX+i*fontSize+fontSize/2,canvas.height/2);
    }
    if(idx<chars.length){
      cursorVisible=!cursorVisible;
      if(cursorVisible){
        ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
        ctx.fillRect(startX+idx*fontSize,canvas.height/2-fontSize/2,3,fontSize);
      }
      setTimeout(()=>{idx++;animId=requestAnimationFrame(animate)},300/speed);
    }else{
      cursorVisible=!cursorVisible;
      if(cursorVisible){
        ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
        ctx.fillRect(startX+idx*fontSize,canvas.height/2-fontSize/2,3,fontSize);
      }
      animId=requestAnimationFrame(animate);
    }
  }
  animId=requestAnimationFrame(animate);
}

function initBounce(text,speed){
  const chars=[...text];
  const fontSize=Math.min(60,canvas.width/(chars.length+1));
  const startX=(canvas.width-fontsSize*chars.length)/2;
  chars.forEach((ch,i)=>{
    charPositions.push({ch,x:startX+i*fontSize+fontSize/2,y:-fontSize,tY:canvas.height/2,vy:0,bounced:false,phase:0});
  });
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let allDone=true;
    charPositions.forEach((p,i)=>{
      if(p.phase===0){p.phase=1;setTimeout(()=>{p.falling=true},i*150/speed)}
      if(p.falling&&!p.bounced){
        p.vy+=0.5*speed/5;p.y+=p.vy;
        if(p.y>=p.tY){p.y=p.tY;p.vy=-p.vy*0.6;if(Math.abs(p.vy)<1){p.bounced=true;p.y=p.tY}}
        allDone=false;
      }
      ctx.font=`bold ${fontSize}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=colors[i%colors.length];
      ctx.fillText(p.ch,p.x,p.y);
    });
    if(!allDone)animId=requestAnimationFrame(animate);
  }
  animId=requestAnimationFrame(animate);
}

function initRotate3d(text,speed){
  const chars=[...text];
  const fontSize=Math.min(60,canvas.width/(chars.length+1));
  const startX=(canvas.width-fontsSize*chars.length)/2;
  let progress=0;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    progress+=0.02*speed/5;
    chars.forEach((ch,i)=>{
      const delay=i*0.15;
      const t=Math.max(0,Math.min(1,(progress-delay)/0.5));
      const eased=1-Math.pow(1-t,3);
      const angle=(1-eased)*Math.PI;
      const scaleY=Math.cos(angle);
      const alpha=Math.abs(scaleY);
      ctx.save();
      ctx.translate(startX+i*fontSize+fontSize/2,canvas.height/2);
      ctx.scale(1,Math.max(0.1,Math.abs(scaleY)));
      ctx.globalAlpha=alpha;
      ctx.font=`bold ${fontSize}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=colors[i%colors.length];
      ctx.fillText(ch,0,0);
      ctx.restore();
    });
    ctx.globalAlpha=1;
    if(progress<chars.length*0.15+0.5)animId=requestAnimationFrame(animate);
  }
  animId=requestAnimationFrame(animate);
}

function initWave(text,speed){
  const chars=[...text];
  const fontSize=Math.min(60,canvas.width/(chars.length+1));
  const startX=(canvas.width-fontsSize*chars.length)/2;
  let t=0;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    t+=0.05*speed/5;
    chars.forEach((ch,i)=>{
      const y=canvas.height/2+Math.sin(t+i*0.5)*30;
      const x=startX+i*fontSize+fontSize/2;
      ctx.font=`bold ${fontSize}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=colors[i%colors.length];
      ctx.fillText(ch,x,y);
    });
    animId=requestAnimationFrame(animate);
  }
  animId=requestAnimationFrame(animate);
}

function initGlitch(text,speed){
  const chars=[...text];
  const fontSize=Math.min(60,canvas.width/(chars.length+1));
  const startX=(canvas.width-fontsSize*chars.length)/2;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    chars.forEach((ch,i)=>{
      const x=startX+i*fontSize+fontSize/2;
      const y=canvas.height/2;
      const isGlitching=Math.random()<0.3;
      const dx=isGlitching?(Math.random()-0.5)*20*speed/5:0;
      const dy=isGlitching?(Math.random()-0.5)*10*speed/5:0;
      if(isGlitching){
        ctx.fillStyle='#ef4444';ctx.globalAlpha=0.5;
        ctx.font=`bold ${fontSize}px "PingFang SC","Noto Sans SC",sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(ch,x+dx+2,y+dy);
        ctx.fillStyle='#3b82f6';
        ctx.fillText(ch,x+dx-2,y+dy);
      }
      ctx.globalAlpha=1;ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
      ctx.font=`bold ${fontSize}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(ch,x+dx,y+dy);
    });
    animId=requestAnimationFrame(animate);
  }
  animId=requestAnimationFrame(animate);
}

function initExplode(text,speed){
  const chars=[...text];
  const fontSize=Math.min(60,canvas.width/(chars.length+1));
  const centerX=canvas.width/2;const centerY=canvas.height/2;
  chars.forEach((ch,i)=>{
    const angle=(i/chars.length)*Math.PI*2;
    charPositions.push({ch,x:centerX,y:centerY,tx:centerX+Math.cos(angle)*300,ty:centerY+Math.sin(angle)*300,phase:0});
  });
  let t=0;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    t+=0.03*speed/5;
    charPositions.forEach((p,i)=>{
      if(t<0.3){
        const st=t/0.3;
        ctx.globalAlpha=st;
        ctx.font=`bold ${fontSize}px "PingFang SC","Noto Sans SC",sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle=colors[i%colors.length];
        ctx.fillText(p.ch,p.x,p.y);
      }else{
        const et=Math.min(1,(t-0.3)/0.7);
        const x=p.x+(p.tx-p.x)*et;
        const y=p.y+(p.ty-p.y)*et;
        ctx.globalAlpha=1-et*0.8;
        ctx.font=`bold ${fontSize*(1-et*0.5)}px "PingFang SC","Noto Sans SC",sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle=colors[i%colors.length];
        ctx.fillText(p.ch,x,y);
      }
    });
    ctx.globalAlpha=1;
    if(t<1)animId=requestAnimationFrame(animate);
  }
  animId=requestAnimationFrame(animate);
}

function initRain(text,speed){
  const chars=[...text];
  const fontSize=16;
  const cols=Math.floor(canvas.width/fontSize);
  const drops=Array(cols).fill(0);
  const charArr=[...text,'永','和','的','是','了','不','在','有','我','他','这','中','大','来','上','国','到','说','们','为','子','和','你','地','会','出','就','分','对','成'];
  function animate(){
    ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#00ff41';ctx.font=`${fontSize}px monospace`;
    for(let i=0;i<cols;i++){
      const ch=charArr[Math.floor(Math.random()*charArr.length)];
      ctx.fillText(ch,i*fontSize,drops[i]*fontSize);
      if(drops[i]*fontSize>canvas.height&&Math.random()>0.975)drops[i]=0;
      drops[i]+=speed/5;
    }
    animId=requestAnimationFrame(animate);
  }
  animId=requestAnimationFrame(animate);
}

function initSpiral(text,speed){
  const chars=[...text];
  const fontSize=Math.min(40,canvas.width/(chars.length+1));
  let t=0;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    t+=0.03*speed/5;
    chars.forEach((ch,i)=>{
      const angle=t+i*(Math.PI*2/chars.length);
      const radius=50+t*30;
      const x=canvas.width/2+Math.cos(angle)*radius;
      const y=canvas.height/2+Math.sin(angle)*radius;
      const alpha=Math.min(1,t/2);
      ctx.globalAlpha=alpha;
      ctx.font=`bold ${fontSize}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=colors[i%colors.length];
      ctx.fillText(ch,x,y);
    });
    ctx.globalAlpha=1;
    if(t<10)animId=requestAnimationFrame(animate);
  }
  animId=requestAnimationFrame(animate);
}

function initScale(text,speed){
  const chars=[...text];
  const fontSize=Math.min(60,canvas.width/(chars.length+1));
  const startX=(canvas.width-fontsSize*chars.length)/2;
  let t=0;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    t+=0.02*speed/5;
    chars.forEach((ch,i)=>{
      const delay=i*0.12;
      const ct=Math.max(0,t-delay);
      const scale=ct<0.5?ct*2*1.2:1.2-(ct-0.5)*0.4;
      const s=Math.max(0.01,Math.min(1.2,scale));
      const alpha=Math.min(1,ct*3);
      ctx.save();
      ctx.translate(startX+i*fontSize+fontSize/2,canvas.height/2);
      ctx.scale(s,s);
      ctx.globalAlpha=alpha;
      ctx.font=`bold ${fontSize}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=colors[i%colors.length];
      ctx.fillText(ch,0,0);
      ctx.restore();
    });
    ctx.globalAlpha=1;
    if(t<chars.length*0.12+1)animId=requestAnimationFrame(animate);
  }
  animId=requestAnimationFrame(animate);
}

function initSlide(text,speed){
  const chars=[...text];
  const fontSize=Math.min(60,canvas.width/(chars.length+1));
  const startX=(canvas.width-fontsSize*chars.length)/2;
  const dirs=[{dx:0,dy:-200},{dx:200,dy:0},{dx:0,dy:200},{dx:-200,dy:0}];
  let t=0;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    t+=0.02*speed/5;
    chars.forEach((ch,i)=>{
      const delay=i*0.1;
      const ct=Math.max(0,Math.min(1,(t-delay)/0.5));
      const eased=1-Math.pow(1-ct,3);
      const dir=dirs[i%dirs.length];
      const x=startX+i*fontSize+fontSize/2+dir.dx*(1-eased);
      const y=canvas.height/2+dir.dy*(1-eased);
      ctx.globalAlpha=eased;
      ctx.font=`bold ${fontSize}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=colors[i%colors.length];
      ctx.fillText(ch,x,y);
    });
    ctx.globalAlpha=1;
    if(t<chars.length*0.1+0.5)animId=requestAnimationFrame(animate);
  }
  animId=requestAnimationFrame(animate);
}

function initFade(text,speed){
  const chars=[...text];
  const fontSize=Math.min(60,canvas.width/(chars.length+1));
  const startX=(canvas.width-fontsSize*chars.length)/2;
  let t=0;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    t+=0.02*speed/5;
    chars.forEach((ch,i)=>{
      const delay=i*0.15;
      const ct=Math.max(0,t-delay);
      const alpha=Math.min(1,ct*2);
      ctx.globalAlpha=alpha;
      ctx.font=`bold ${fontSize}px "PingFang SC","Noto Sans SC",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
      ctx.fillText(ch,startX+i*fontSize+fontSize/2,canvas.height/2);
    });
    ctx.globalAlpha=1;
    if(t<chars.length*0.15+1)animId=requestAnimationFrame(animate);
  }
  animId=requestAnimationFrame(animate);
}

init();
</script>
</body>
