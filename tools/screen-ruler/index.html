<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>屏幕标尺 - Screen Ruler</title>
<meta name="description" content="屏幕标尺工具，用手机测量物体的实际尺寸">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {--bg: #1a1a2e;
--bg2: #16213e;
--bg3: #0f3460;
--text: #e0e0e0;
--text2: #a0a0b0;
--accent: #e94560;
--accent2: #533483;
--border: #2a2a4a;
--ruler-bg: #1e1e36;
--ruler-tick: #555577;
--measure-line: #00ff88;
--grid-color: rgba(255,255,255,0.06);
--btn-bg: #2a2a4a;
--btn-hover: #3a3a5a;
--btn-active: #4a4a6a;
--input-bg: #252540;
--snap-line: #ff6b6b}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
background: var(--bg);
color: var(--text);
overflow: hidden;
height: 100vh;
width: 100vw;
user-select: none;
-webkit-user-select: none;
display: flex;
flex-direction: columnpadding:16px;scroll-behavior:smooth;}
#toolbar {display: flex;
align-items: center;
gap: 6px;
padding: 8px 12px;
background: var(--bg2);
border-bottom: 1px solid var(--border);
flex-shrink: 0;
flex-wrap: wrap;
z-index: 100;
min-height: 48px}
#toolbar .sep {width: 1px;
height: 24px;
background: var(--border);
margin: 0 4px}
#toolbar label {font-size: 13px;
color: var(--text2);
white-space: nowrap}
#toolbar button, #toolbar .btn {padding: 6px 12px;
border: 1px solid var(--border);
border-radius: 6px;
background: var(--btn-bg);
color: var(--text);
cursor: pointer;
font-size: 13px;
font-family: inherit;
white-space: nowrap;
transition: background 0.15s, border-color 0.15s}
#toolbar button:hover { background: var(--btn-hover); }
#toolbar button.active {background: var(--accent);
border-color: var(--accent);
color: var(--text)}
#toolbar button.danger { border-color: var(--accent); color: var(--accent); }
#toolbar button.danger:hover { background: var(--accent); color: var(--text); }
#toolbar input[type="color"] {width: 28px; height: 28px;
border: 2px solid var(--border);
border-radius: 4px;
cursor: pointer;
background: var(--input-bg);
padding: 0}
#toolbar input[type="number"] {width: 56px;
padding: 4px 6px;
border: 1px solid var(--border);
border-radius: 4px;
background: var(--input-bg);
color: var(--text);
font-size: 13px;
font-family: inherit;
text-align: center}
#toolbar .dpi-display {font-size: 12px;
color: var(--accent);
font-weight: 600;
min-width: 80px;
text-align: center}
#main-area {flex: 1;
display: flex;
overflow: hidden;
position: relative}
#ruler-top, #ruler-left {background: var(--ruler-bg);
position: relative;
z-index: 50;
overflow: hidden}
#ruler-top {height: 28px;
display: none;
border-bottom: 1px solid var(--border)}
#ruler-left {width: 28px;
display: none;
border-right: 1px solid var(--border)}
#ruler-top canvas, #ruler-left canvas {display: block}
#canvas-wrap {flex: 1;
position: relative;
overflow: hidden;
background: var(--bg)}
#grid-canvas {position: absolute; inset: 0; z-index: 1;
pointer-events: none;
display: none}
#measure-canvas {position: absolute; inset: 0; z-index: 10;
cursor: crosshair}
#cursor-info {position: absolute;
pointer-events: none;
z-index: 200;
background: rgba(0,0,0,0.85);
color: var(--measure-line);
font-size: 12px;
padding: 4px 8px;
border-radius: 4px;
border: 1px solid var(--measure-line);
display: none;
font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace;
white-space: nowrap}
#status-bar {display: flex;
align-items: center;
justify-content: space-between;
padding: 4px 16px;
background: var(--bg2);
border-top: 1px solid var(--border);
font-size: 12px;
color: var(--text2);
flex-shrink: 0;
min-height: 28px;
font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace}
#status-bar span { margin: 0 8px; }
#status-bar .coord { color: var(--measure-line); font-weight: 600; }
.modal-overlay {position: fixed; inset: 0; z-index: 999;
background: rgba(0,0,0,0.7);
display: flex; align-items: center; justify-content: center}
.modal-overlay.hidden { display: none; }
.modal {background: var(--bg2);
border: 1px solid var(--border);
border-radius: 12px;
padding: 24px;
min-width: 380px;
max-width: 90vw;
box-shadow: 0 20px 60px rgba(0,0,0,0.5)}
.modal h2 {font-size: 18px;
margin-bottom: 16px;
color: var(--text)}
.modal p { font-size: 13px; color: var(--text2); margin-bottom: 12px; line-height: 1.6; }
.modal .cal-item {display: flex; align-items: center; gap: 12px;
padding: 12px; margin-bottom: 8px;
background: var(--bg); border-radius: 8px;
cursor: pointer; border: 2px solid transparent;
transition: border-color 0.15s}
.modal .cal-item:hover { border-color: var(--accent); }
.modal .cal-item .icon { font-size: 28px; }
.modal .cal-item .info { flex:1; }
.modal .cal-item .info .title { font-weight: 600; font-size: 14px; }
.modal .cal-item .info .desc { font-size: 12px; color: var(--text2); }
.modal .btn-row { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
.modal button {padding: 8px 20px; border-radius: 6px; border: 1px solid var(--border);
background: var(--btn-bg); color: var(--text); cursor: pointer;
font-size: 14px; font-family: inherit}
.modal button.primary { background: var(--accent); border-color: var(--accent); color: var(--text); }
.modal button:hover { opacity: 0.85; }
#ctx-menu {position: absolute;
z-index: 300;
background: var(--bg2);
border: 1px solid var(--border);
border-radius: 8px;
padding: 4px 0;
min-width: 120px;
display: none;
box-shadow: 0 8px 24px rgba(0,0,0,0.4)}
#ctx-menu .item {padding: 8px 16px;
cursor: pointer;
font-size: 13px;
color: var(--text);
white-space: nowrap}
#ctx-menu .item:hover { background: var(--btn-hover); }
#ctx-menu .item.danger { color: var(--accent); }
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);outline:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style>

  <meta name="robots" content="index, follow">

<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1 style="text-align:center;padding:20px 0;font-size:1.5rem">屏幕标尺 - Screen Ruler</h1>

<div id="toolbar">
  <button id="btn-measure" class="active" title="拖拽测量距离">📏 测量</button>

  <div style="display:flex;flex-direction:column;flex:1;overflow:hidden;">

<div id="ctx-menu"></div>

<div id="status-bar">
  <span>鼠标位置: <span class="coord" id="coord-pos">--</span></span>
  <span>测量线条数: <span id="coord-count">0</span></span>

</div>

<div class="modal-overlay hidden" id="cal-modal-overlay">
  <div class="modal">
    <h2>🔧 屏幕 DPI 校准</h2>
    <p>选择一种已知尺寸的实物进行校准，以获得准确的毫米/厘米估算。</p>
    <div class="cal-item" data-cal="credit-card" onclick="startCalibration('credit-card')">
      <span class="icon">💳</span>

      </div>
    </div>

      <span class="icon">📄</span>

      </div>
    </div>
    <div class="cal-item" data-cal="a4-height" onclick="startCalibration('a4-height')">
      <span class="icon">📃</span>
      <div class="info">
        <div class="title">A4 纸高度</div>

      </div>
    </div>
    <div class="cal-item" data-cal="custom" onclick="promptCustomCalibration()">
      <span class="icon">📏</span>
      <div class="info">
        <div class="title">自定义尺寸</div>
        <div class="desc">输入实际毫米数进行校准</div>
      </div>
    </div>
    <div class="btn-row">

      <button class="primary" onclick="resetDPI()">恢复默认 DPI (96)</button>
    </div>
  </div>
</div>

<script>
const state = {
  dpi: 96,
  mode: 'measure',
  calibrationType: null,
  calibrationRealMM: 0,
  calibrationStart: null,
  calibrationEnd: null,
  showGrid: false,
  showRulers: false,
  snapEnabled: false,
  fullscreen: false,
  rulerColor: '#00ff88',
  mouseX: 0,
  mouseY: 0,
  measuring: false,
  measureStart: null,
  measureCurrent: null,
  lines: [],
  nextLineId: 1,
  hoveredLineId: null,
  gridSize: 50,
  rulerTickMajor: 50,
  rulerTickMinor: 10,
  ctxMenuLineId: null,
};
function saveState() {
  try {
    localStorage.setItem('screen-ruler-state', JSON.stringify({
      dpi: state.dpi,
      showGrid: state.showGrid,
      showRulers: state.showRulers,
      snapEnabled: state.snapEnabled,
      rulerColor: state.rulerColor,
      gridSize: state.gridSize,
    }));
  } catch(e) {}
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('screen-ruler-state'));
    if (s) {
      state.dpi = s.dpi || 96;
      state.showGrid = s.showGrid || false;
      state.showRulers = s.showRulers || false;
      state.snapEnabled = s.snapEnabled || false;
      state.rulerColor = s.rulerColor || '#00ff88';
      state.gridSize = s.gridSize || 50;
    }
  } catch(e) {}
}
loadState();
const canvasWrap = document.getElementById('canvas-wrap');
const measureCanvas = document.getElementById('measure-canvas');
const measureCtx = measureCanvas.getContext('2d');
const gridCanvas = document.getElementById('grid-canvas');
const gridCtx = gridCanvas.getContext('2d');
const rulerTopCanvas = document.getElementById('ruler-top');
const rulerTopCtx = rulerTopCanvas.getContext('2d');
const rulerLeftCanvas = document.getElementById('ruler-left');
const rulerLeftCtx = rulerLeftCanvas.getContext('2d');
const cursorInfo = document.getElementById('cursor-info');
const ctxMenu = document.getElementById('ctx-menu');
const calModalOverlay = document.getElementById('cal-modal-overlay');
const btnMeasure = document.getElementById('btn-measure');
const btnClear = document.getElementById('btn-clear');
const btnGrid = document.getElementById('btn-grid');
const btnRuler = document.getElementById('btn-ruler');
const btnSnap = document.getElementById('btn-snap');
const btnCalibrate = document.getElementById('btn-calibrate');
const btnFullscreen = document.getElementById('btn-fullscreen');
const colorPicker = document.getElementById('color-picker');
const dpiDisplay = document.getElementById('dpi-display');
function resizeCanvases() {
  const dpr = window.devicePixelRatio || 1;
  const wrapW = canvasWrap.clientWidth;
  const wrapH = canvasWrap.clientHeight;
  [measureCanvas, gridCanvas].forEach(c => {
    c.width = wrapW * dpr;
    c.height = wrapH * dpr;
    c.style.width = wrapW + 'px';
    c.style.height = wrapH + 'px';
  });
  measureCtx.setTransform(1, 0, 0, 1, 0, 0);
  measureCtx.scale(dpr, dpr);
  gridCtx.setTransform(1, 0, 0, 1, 0, 0);
  gridCtx.scale(dpr, dpr);
  rulerTopCanvas.width = wrapW * dpr;
  rulerTopCanvas.height = 28 * dpr;
  rulerTopCanvas.style.width = wrapW + 'px';
  rulerTopCanvas.style.height = '28px';
  rulerTopCtx.setTransform(1, 0, 0, 1, 0, 0);
  rulerTopCtx.scale(dpr, dpr);
  rulerLeftCanvas.width = 28 * dpr;
  rulerLeftCanvas.height = wrapH * dpr;
  rulerLeftCanvas.style.width = '28px';
  rulerLeftCanvas.style.height = wrapH + 'px';
  rulerLeftCtx.setTransform(1, 0, 0, 1, 0, 0);
  rulerLeftCtx.scale(dpr, dpr);
  drawAll();
}
function initUI() {
  colorPicker.value = state.rulerColor;
  dpiDisplay.textContent = `DPI: ${state.dpi}`;
  if (state.showGrid) btnGrid.classList.add('active');
  if (state.showRulers) btnRuler.classList.add('active');
  if (state.snapEnabled) btnSnap.classList.add('active');
  updateRulerVisibility();
}
function drawAll() {
  drawGrid();
  drawMeasurements();
  drawRulers();
  updateStatusBar();
}
function drawGrid() {
  const w = canvasWrap.clientWidth;
  const h = canvasWrap.clientHeight;
  gridCtx.clearRect(0, 0, w, h);
  if (!state.showGrid) return;
  const gs = state.gridSize;
  gridCtx.strokeStyle = state.rulerColor.replace(')', ',0.15)').replace('rgb', 'rgba');
  if (state.rulerColor.startsWith('#')) {
    const r = parseInt(state.rulerColor.slice(1,3), 16);
    const g = parseInt(state.rulerColor.slice(3,5), 16);
    const b = parseInt(state.rulerColor.slice(5,7), 16);
    gridCtx.strokeStyle = `rgba(${r},${g},${b},0.12)`;
  }
  gridCtx.lineWidth = 0.5;
  for (let x = gs; x < w; x += gs) {
    gridCtx.beginPath();
    gridCtx.moveTo(x, 0);
    gridCtx.lineTo(x, h);
    gridCtx.stroke();
  }
  for (let y = gs; y < h; y += gs) {
    gridCtx.beginPath();
    gridCtx.moveTo(0, y);
    gridCtx.lineTo(w, y);
    gridCtx.stroke();
  }
}
function drawMeasurements() {
  const w = canvasWrap.clientWidth;
  const h = canvasWrap.clientHeight;
  measureCtx.clearRect(0, 0, w, h);
  measureCtx.setLineDash([6, 4]);
  state.lines.forEach(line => {
    drawLine(line, line.id === state.hoveredLineId);
  });
  if (state.measuring && state.measureStart && state.measureCurrent) {
    drawLine({
      x1: state.measureStart.x,
      y1: state.measureStart.y,
      x2: state.measureCurrent.x,
      y2: state.measureCurrent.y,
      color: state.rulerColor,
    }, true);
  }
  if (state.mode === 'calibrating' && state.calibrationStart) {
    const end = state.calibrationEnd || state.measureCurrent;
    if (end) {
      measureCtx.setLineDash([6, 4]);
      measureCtx.strokeStyle = '#ffaa00';
      measureCtx.lineWidth = 2;
      measureCtx.beginPath();
      measureCtx.moveTo(state.calibrationStart.x, state.calibrationStart.y);
      measureCtx.lineTo(end.x, end.y);
      measureCtx.stroke();
      measureCtx.fillStyle = '#ffaa00';
      measureCtx.beginPath();
      measureCtx.arc(state.calibrationStart.x, state.calibrationStart.y, 5, 0, Math.PI * 2);
      measureCtx.fill();
      if (end !== state.calibrationStart) {
        measureCtx.beginPath();
        measureCtx.arc(end.x, end.y, 5, 0, Math.PI * 2);
        measureCtx.fill();
      }
    }
  }
  measureCtx.setLineDash([]);
}
function drawLine(line, highlighted) {
  const dx = line.x2 - line.x1;
  const dy = line.y2 - line.y1;
  const distPx = Math.round(Math.sqrt(dx * dx + dy * dy));
  const distMM = (distPx / state.dpi) * 25.4;
  const lw = highlighted ? 2.5 : 2;
  const color = line.color || state.rulerColor;
  measureCtx.strokeStyle = color;
  measureCtx.lineWidth = lw;
  measureCtx.beginPath();
  measureCtx.moveTo(line.x1, line.y1);
  measureCtx.lineTo(line.x2, line.y2);
  measureCtx.stroke();
  measureCtx.fillStyle = color;
  [{ x: line.x1, y: line.y1 }, { x: line.x2, y: line.y2 }].forEach((p, i) => {
    measureCtx.beginPath();
    measureCtx.arc(p.x, p.y, highlighted ? 5 : 4, 0, Math.PI * 2);
    measureCtx.fill();
    measureCtx.beginPath();
    measureCtx.arc(p.x, p.y, highlighted ? 9 : 7, 0, Math.PI * 2);
    measureCtx.strokeStyle = color;
    measureCtx.lineWidth = 1.5;
    measureCtx.stroke();
  });
  const midX = (line.x1 + line.x2) / 2;
  const midY = (line.y1 + line.y2) / 2;
  const labelText = `${distPx} px  |  ${distMM.toFixed(1)} mm  (${(distMM / 10).toFixed(2)} cm)`;
  measureCtx.font = `${highlighted ? 'bold ' : ''}12px "SF Mono","Cascadia Code","Fira Code",monospace`;
  const textW = measureCtx.measureText(labelText).width;
  const padX = 8, padY = 6;
  measureCtx.fillStyle = 'rgba(0,0,0,0.82)';
  measureCtx.fillRect(midX - textW / 2 - padX, midY - 18, textW + padX * 2, 22);
  measureCtx.strokeStyle = color;
  measureCtx.lineWidth = 1;
  measureCtx.strokeRect(midX - textW / 2 - padX, midY - 18, textW + padX * 2, 22);
  measureCtx.fillStyle = color;
  measureCtx.textAlign = 'center';
  measureCtx.textBaseline = 'middle';
  measureCtx.fillText(labelText, midX, midY - 7);
}
function drawRulers() {
  const show = state.showRulers;
  document.getElementById('ruler-top').style.display = show ? 'block' : 'none';
  document.getElementById('ruler-left').style.display = show ? 'block' : 'none';
  if (!show) return;
  const wrapW = canvasWrap.clientWidth;
  const wrapH = canvasWrap.clientHeight;
  const tickStep = state.rulerTickMinor;
  const majorStep = state.rulerTickMajor;
  rulerTopCtx.clearRect(0, 0, wrapW, 28);
  rulerTopCtx.fillStyle = '#1e1e36';
  rulerTopCtx.fillRect(0, 0, wrapW, 28);
  for (let x = 0; x < wrapW; x += tickStep) {
    const isMajor = (x % majorStep === 0);
    const tickH = isMajor ? 14 : 7;
    rulerTopCtx.strokeStyle = isMajor ? '#8888aa' : '#555577';
    rulerTopCtx.lineWidth = isMajor ? 1.2 : 0.5;
    rulerTopCtx.beginPath();
    rulerTopCtx.moveTo(x, 28);
    rulerTopCtx.lineTo(x, 28 - tickH);
    rulerTopCtx.stroke();
    if (isMajor) {
      rulerTopCtx.fillStyle = '#aaaacc';
      rulerTopCtx.font = '9px monospace';
      rulerTopCtx.textAlign = 'center';
      rulerTopCtx.fillText(x, x, 13);
    }
  }
  rulerLeftCtx.clearRect(0, 0, 28, wrapH);
  rulerLeftCtx.fillStyle = '#1e1e36';
  rulerLeftCtx.fillRect(0, 0, 28, wrapH);
  for (let y = 0; y < wrapH; y += tickStep) {
    const isMajor = (y % majorStep === 0);
    const tickW = isMajor ? 14 : 7;
    rulerLeftCtx.strokeStyle = isMajor ? '#8888aa' : '#555577';
    rulerLeftCtx.lineWidth = isMajor ? 1.2 : 0.5;
    rulerLeftCtx.beginPath();
    rulerLeftCtx.moveTo(28, y);
    rulerLeftCtx.lineTo(28 - tickW, y);
    rulerLeftCtx.stroke();
    if (isMajor) {
      rulerLeftCtx.save();
      rulerLeftCtx.fillStyle = '#aaaacc';
      rulerLeftCtx.font = '9px monospace';
      rulerLeftCtx.textAlign = 'right';
      rulerLeftCtx.translate(13, y);
      rulerLeftCtx.rotate(-Math.PI / 2);
      rulerLeftCtx.fillText(y.toString(), 0, 0);
      rulerLeftCtx.restore();
    }
  }
  if (state.mouseX > 0 && state.mouseY > 0) {
    rulerTopCtx.fillStyle = state.rulerColor;
    rulerTopCtx.beginPath();
    rulerTopCtx.moveTo(state.mouseX, 28);
    rulerTopCtx.lineTo(state.mouseX - 4, 22);
    rulerTopCtx.lineTo(state.mouseX + 4, 22);
    rulerTopCtx.closePath();
    rulerTopCtx.fill();
    rulerLeftCtx.fillStyle = state.rulerColor;
    rulerLeftCtx.beginPath();

function getPos(e) {
  const rect = canvasWrap.getBoundingClientRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top,
  };
}
function snapToEdges(pos) {
  if (!state.snapEnabled) return pos;
  const threshold = 8;
  const w = canvasWrap.clientWidth;
  const h = canvasWrap.clientHeight;
  let { x, y } = pos;
  if (Math.abs(x) < threshold) x = 0;
  if (Math.abs(x - w) < threshold) x = w;
  if (Math.abs(y) < threshold) y = 0;
  if (Math.abs(y - h) < threshold) y = h;
  state.lines.forEach(line => {
    [{ x: line.x1, y: line.y1 }, { x: line.x2, y: line.y2 }].forEach(pt => {
      const d = Math.hypot(x - pt.x, y - pt.y);
      if (d < threshold) { x = pt.x; y = pt.y; }
    });
  });
  if (state.measuring && state.measureStart) {
    const dx = x - state.measureStart.x;
    const dy = y - state.measureStart.y;
    const angle = Math.atan2(dy, dx);
    const deg = (angle * 180) / Math.PI;
    const snapAngles = [0, 45, 90, 135, 180, -45, -90, -135];
    for (const sa of snapAngles) {
      const diff = ((deg - sa + 540) % 360) - 180;
      if (Math.abs(diff) < 8) {
        const dist = Math.hypot(dx, dy);
        const newAngle = (sa * Math.PI) / 180;
        x = state.measureStart.x + Math.cos(newAngle) * dist;
        y = state.measureStart.y + Math.sin(newAngle) * dist;
        break;
      }
    }
  }
  return { x, y };
}

      finishCalibration();
    }

    return;
  }
  const pos = snapToEdges(getPos(e));

  state.measureStart = pos;
  state.measureCurrent = pos;

measureCanvas.addEventListener('pointermove', (e) => {

measureCanvas.addEventListener('pointerup', (e) => {
  if (!state.measuring) return;

  const distPx = Math.round(Math.hypot(

    state.lines.push({
      x1: state.measureStart.x,

  }

measureCanvas.addEventListener('contextmenu', (e) => {

    const d = distToSegment(pos, state.lines[i]);
    if (d < threshold) { foundLine = state.lines[i]; break; }
  }
  if (foundLine) {
    const d1 = Math.hypot(pos.x - foundLine.x1, pos.y - foundLine.y1);
    const d2 = Math.hypot(pos.x - foundLine.x2, pos.y - foundLine.y2);
    state.ctxMenuLineId = foundLine.id;
    let menuHTML = '';
    if (d1 < 12 || d2 < 12) {
      menuHTML += `<div class="item" onclick="nudgeEndpoint(${foundLine.id},${d1<d2?1:2},-1,0)">← 左移 1px</div>`;
      menuHTML += `<div class="item" onclick="nudgeEndpoint(${foundLine.id},${d1<d2?1:2},1,0)">→ 右移 1px</div>`;
      menuHTML += `<div class="item" onclick="nudgeEndpoint(${foundLine.id},${d1<d2?1:2},0,-1)">↑ 上移 1px</div>`;
      menuHTML += `<div class="item" onclick="nudgeEndpoint(${foundLine.id},${d1<d2?1:2},0,1)">↓ 下移 1px</div>`;

function nudgeEndpoint(lineId, endpointNum, dx, dy) {
  const line = state.lines.find(l => l.id === lineId);
  if (!line) return;
  if (endpointNum === 1) { line.x1 += dx; line.y1 += dy; }
  else { line.x2 += dx; line.y2 += dy; }

  drawAll();
  ctxMenu.style.display = 'none';
}
function duplicateLine(lineId) {
  const line = state.lines.find(l => l.id === lineId);
  if (!line) return;
  state.lines.push({
    x1: line.x1 + 10, y1: line.y1 + 10,
    x2: line.x2 + 10, y2: line.y2 + 10,
    color: line.color,
    id: state.nextLineId++,
  });
  saveLines();
  drawAll();
  ctxMenu.style.display = 'none';
}
function deleteLine(lineId) {

function distToSegment(p, line) {
  const { x: px, y: py } = p;
  const { x1, y1, x2, y2 } = line;
  const A = px - x1, B = py - y1;
  const C = x2 - x1, D = y2 - y1;
  const dot = A * C + B * D;
  const lenSq = C * C + D * D;
  let param = lenSq !== 0 ? dot / lenSq : -1;
  let xx, yy;
  if (param < 0) { xx = x1; yy = y1; }
  else if (param > 1) { xx = x2; yy = y2; }
  else { xx = x1 + param * C; yy = y1 + param * D; }
  return Math.hypot(px - xx, py - yy);
}

function startCalibration(type) {

function finishCalibration() {
  const dx = state.calibrationEnd.x - state.calibrationStart.x;
  const dy = state.calibrationEnd.y - state.calibrationStart.y;
  const distPx = Math.sqrt(dx * dx + dy * dy);
  if (distPx < 10) {
    showToast('测量距离太短，请重新测量');

    state.calibrationEnd = null;

  }
  const newDPI = Math.round((distPx / state.calibrationRealMM) * 25.4);

  saveState();

document.addEventListener('keydown', (e) => {

      btnGrid.classList.toggle('active', state.showGrid);
      gridCanvas.style.display = state.showGrid ? 'block' : 'none';

      break;
    case 'r':

    case 's':
