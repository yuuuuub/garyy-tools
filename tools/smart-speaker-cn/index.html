<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔊 智能音箱控制</title>
<meta name="description" content="智能音箱音乐播放、语音助手与智能家居控制中心">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.player{text-align:center;padding:30px;border-radius:var(--radius);background:var(--bg);margin-bottom:16px}
.album-art{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:3rem;animation:spin 10s linear infinite paused}
.album-art.playing{animation-play-state:running}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.song-title{font-size:1.2rem;font-weight:600;margin-bottom:4px}
.song-artist{color:var(--text2);font-size:.9rem}
.progress-bar{height:6px;background:var(--border);border-radius:3px;margin:16px 0;position:relative;cursor:pointer}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.time-display{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2);margin-bottom:16px}
.player-controls{display:flex;justify-content:center;gap:16px;align-items:center}
.ctrl-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--bg);color:var(--text);cursor:pointer;font-size:1.2rem;transition:all .2s;display:flex;align-items:center;justify-content:center}
.ctrl-btn:hover{background:rgba(59,130,246,.1)}
.ctrl-btn.play{width:56px;height:56px;background:var(--accent);color:#fff;font-size:1.5rem}
.ctrl-btn.play:hover{background:var(--accent2)}
.volume-control{display:flex;align-items:center;gap:12px;margin-top:16px}
.volume-slider{flex:1;accent-color:var(--accent)}
.playlist{max-height:300px;overflow-y:auto}
.playlist-item{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .2s}
.playlist-item:hover{background:var(--bg)}
.playlist-item.active{background:rgba(59,130,246,.1)}
.playlist-info{display:flex;align-items:center;gap:12px}
.playlist-num{width:24px;text-align:center;color:var(--text2)}
.playlist-title{font-weight:600}
.playlist-artist{font-size:.85rem;color:var(--text2)}
.playlist-duration{color:var(--text2);font-size:.85rem}
.voice-assistant{text-align:center;padding:30px;border-radius:var(--radius);background:var(--bg)}
.voice-wave{display:flex;justify-content:center;gap:4px;margin:20px 0}
.voice-bar{width:4px;height:20px;background:var(--accent);border-radius:2px;animation:voiceWave 0.5s ease-in-out infinite alternate}
.voice-bar:nth-child(2){animation-delay:.1s}
.voice-bar:nth-child(3){animation-delay:.2s}
.voice-bar:nth-child(4){animation-delay:.3s}
.voice-bar:nth-child(5){animation-delay:.4s}
@keyframes voiceWave{from{height:10px}to{height:30px}}
.voice-input{margin-top:16px}
.voice-input input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem}
.alarm-list{display:flex;flex-direction:column;gap:8px}
.alarm-item{padding:12px;background:var(--bg);border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.alarm-time{font-size:1.5rem;font-weight:700}
.alarm-days{font-size:.8rem;color:var(--text2)}
.settings-group{margin-bottom:16px}
.settings-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px}
.settings-group input[type=text],.settings-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
.toggle-group{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.toggle-group:last-child{border-bottom:none}
.toggle{width:50px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background .2s;cursor:pointer}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s}
.toggle.on::after{transform:translateX(24px)}
button{padding:8px 16px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔊 智能音箱控制">
<meta property="og:description" content="智能音箱音乐播放、语音助手与智能家居控制中心">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🔊 智能音箱控制</h1><p>播放音乐，语音控制，智能家居联动</p></div>

<div class="cd">
<div class="player">
<div class="album-art" id="albumArt">🎵</div>
<div class="song-title" id="songTitle">未播放</div>
<div class="song-artist" id="songArtist">选择歌曲开始播放</div>
<div class="progress-bar" onclick="seek(event)">
<div class="progress-fill" id="progressFill" style="width:0%"></div>
</div>
<div class="time-display">
<span id="currentTime">0:00</span>
<span id="totalTime">0:00</span>
</div>
<div class="player-controls">
<button class="ctrl-btn" onclick="prevTrack()">⏮</button>
<button class="ctrl-btn play" id="playBtn" onclick="togglePlay()">▶</button>
<button class="ctrl-btn" onclick="nextTrack()">⏭</button>
</div>
<div class="volume-control">
<span>🔈</span>
<input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70" oninput="updateVolume()">
<span>🔊</span>
<span id="volumeValue">70%</span>
</div>
</div>
</div>

<div class="cd">
<h2>播放列表</h2>
<div class="playlist" id="playlist"></div>
</div>

<div class="cd">
<h2>语音助手</h2>
<div class="voice-assistant">
<div class="voice-wave" id="voiceWave">
<div class="voice-bar"></div>
<div class="voice-bar"></div>
<div class="voice-bar"></div>
<div class="voice-bar"></div>
<div class="voice-bar"></div>
</div>
<div style="margin:16px 0;color:var(--text2)">点击麦克风或输入语音命令</div>
<div class="voice-input">
<input type="text" id="voiceInput" placeholder="说出你的命令..." onkeypress="if(event.key==='Enter')sendVoice()">
</div>
<button onclick="sendVoice()" style="margin-top:12px;width:100%">发送命令</button>
<div id="voiceResponse" style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px;display:none"></div>
</div>
</div>

<div class="cd">
<h2>闹钟设置</h2>
<div class="alarm-list" id="alarmList"></div>
<div style="margin-top:12px">
<button onclick="addAlarm()">+ 添加闹钟</button>
</div>
</div>

<div class="cd">
<h2>音箱设置</h2>
<div class="settings-group">
<label>音箱名称</label>
<input type="text" id="speakerName" value="客厅音箱" onchange="saveSettings()">
</div>
<div class="settings-group">
<label>均衡器预设</label>
<select id="eqPreset" onchange="saveSettings()">
<option value="flat" selected>平坦</option>
<option value="bass">低音增强</option>
<option value="treble">高音增强</option>
<option value="vocal">人声</option>
<option value="rock">摇滚</option>
</select>
</div>
<div class="toggle-group">
<span>夜间模式</span>
<div class="toggle" id="nightToggle" onclick="toggleSetting('night')"></div>
</div>
<div class="toggle-group">
<span>多房间同步</span>
<div class="toggle on" id="multiRoomToggle" onclick="toggleSetting('multiRoom')"></div>
</div>
<div class="toggle-group">
<span>语音唤醒</span>
<div class="toggle on" id="wakeWordToggle" onclick="toggleSetting('wakeWord')"></div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let isPlaying=false;
let currentTrack=0;
let volume=70;
let progress=0;
let alarms=JSON.parse(localStorage.getItem('ssp_alarms')||'[]');
let settings=JSON.parse(localStorage.getItem('ssp_settings')||'{"name":"客厅音箱","eq":"flat","night":false,"multiRoom":true,"wakeWord":true}');
const playlist=[
  {title:'夜曲',artist:'周杰伦',duration:'3:46'},
  {title:'晴天',artist:'周杰伦',duration:'4:29'},
  {title:'稻香',artist:'周杰伦',duration:'3:43'},
  {title:'七里香',artist:'周杰伦',duration:'4:58'},
  {title:'简单爱',artist:'周杰伦',duration:'4:30'},
  {title:'青花瓷',artist:'周杰伦',duration:'3:59'},
  {title:'告白气球',artist:'周杰伦',duration:'3:35'},
  {title:'等你下课',artist:'周杰伦',duration:'4:33'}
];

function saveAlarms(){localStorage.setItem('ssp_alarms',JSON.stringify(alarms));}
function saveSettings(){localStorage.setItem('ssp_settings',JSON.stringify(settings));}

function updateUI(){
  $('speakerName').value=settings.name;
  $('eqPreset').value=settings.eq;
  ['night','multiRoom','wakeWord'].forEach(key=>{
    $(key+'Toggle').className='toggle '+(settings[key]?'on':'');
  });
}

function renderPlaylist(){
  $('playlist').innerHTML=playlist.map((t,i)=>`
    <div class="playlist-item ${i===currentTrack?'active':''}" onclick="playTrack(${i})">
      <div class="playlist-info">
        <div class="playlist-num">${i===currentTrack&&isPlaying?'🔊':i+1}</div>
        <div>
          <div class="playlist-title">${t.title}</div>
          <div class="playlist-artist">${t.artist}</div>
        </div>
      </div>
      <div class="playlist-duration">${t.duration}</div>
    </div>
  `).join('');
}

function playTrack(index){
  currentTrack=index;
  const track=playlist[currentTrack];
  $('songTitle').textContent=track.title;
  $('songArtist').textContent=track.artist;
  $('totalTime').textContent=track.duration;
  progress=0;
  isPlaying=true;
  updatePlayState();
  renderPlaylist();
}

function togglePlay(){
  isPlaying=!isPlaying;
  updatePlayState();
}

function updatePlayState(){
  $('playBtn').textContent=isPlaying?'⏸':'▶';
  $('albumArt').className='album-art '+(isPlaying?'playing':'');
  renderPlaylist();
}

function prevTrack(){
  currentTrack=(currentTrack-1+playlist.length)%playlist.length;
  playTrack(currentTrack);
}

function nextTrack(){
  currentTrack=(currentTrack+1)%playlist.length;
  playTrack(currentTrack);
}

function updateVolume(){
  volume=$('volumeSlider').value;
  $('volumeValue').textContent=volume+'%';
}

function seek(event){
  const rect=event.target.getBoundingClientRect();
  const x=event.clientX-rect.left;
  progress=(x/rect.width)*100;
  $('progressFill').style.width=progress+'%';
  const track=playlist[currentTrack];
  const [min,sec]=track.duration.split(':').map(Number);
  const total=min*60+sec;
  const current=Math.floor(total*progress/100);
  $('currentTime').textContent=Math.floor(current/60)+':'+(current%60).toString().padStart(2,'0');
}

function updateProgress(){
  if(!isPlaying)return;
  progress+=0.5;
  if(progress>=100){
    nextTrack();
    progress=0;
  }
  $('progressFill').style.width=progress+'%';
  const track=playlist[currentTrack];
  const [min,sec]=track.duration.split(':').map(Number);
  const total=min*60+sec;
  const current=Math.floor(total*progress/100);
  $('currentTime').textContent=Math.floor(current/60)+':'+(current%60).toString().padStart(2,'0');
}

function sendVoice(){
  const command=$('voiceInput').value.trim();
  if(!command)return;
  const response=processVoiceCommand(command);
  $('voiceResponse').style.display='block';
  $('voiceResponse').textContent=response;
  $('voiceInput').value='';
  setTimeout(()=>$('voiceResponse').style.display='none',3000);
}

function processVoiceCommand(cmd){
  if(cmd.includes('播放')||cmd.includes('放')){
    return '正在播放音乐...';
  }else if(cmd.includes('暂停')||cmd.includes('停止')){
    isPlaying=false;
    updatePlayState();
    return '已暂停播放';
  }else if(cmd.includes('下一首')){
    nextTrack();
    return '切换到下一首';
  }else if(cmd.includes('上一首')){
    prevTrack();
    return '切换到上一首';
  }else if(cmd.includes('音量')){
    const match=cmd.match(/(\d+)/);
    if(match){
      volume=parseInt(match[1]);
      $('volumeSlider').value=volume;
      $('volumeValue').textContent=volume+'%';
      return '音量已调整为'+volume+'%';
    }
    return '请说出音量值，如：音量50';
  }else if(cmd.includes('天气')){
    return '今天天气晴朗，温度25°C';
  }else if(cmd.includes('时间')){
    return '现在是'+new Date().toLocaleTimeString('zh-CN');
  }else{
    return '抱歉，我没有理解您的命令';
  }
}

function renderAlarms(){
  $('alarmList').innerHTML=alarms.map((a,i)=>`
    <div class="alarm-item">
      <div>
        <div class="alarm-time">${a.time}</div>
        <div class="alarm-days">${a.days.join(', ')}</div>
      </div>
      <div style="display:flex;gap:8px">
        <div class="toggle ${a.enabled?'on':''}" onclick="toggleAlarm(${i})"></div>
        <button onclick="removeAlarm(${i})" style="background:var(--danger)">删除</button>
      </div>
    </div>
  `).join('');
}

function addAlarm(){
  const time=prompt('设置闹钟时间 (HH:MM):');
  if(time){
    alarms.push({time,enabled:true,days:['周一','周二','周三','周四','周五']});
    saveAlarms();
    renderAlarms();
  }
}

function toggleAlarm(index){
  alarms[index].enabled=!alarms[index].enabled;
  saveAlarms();
  renderAlarms();
}

function removeAlarm(index){
  alarms.splice(index,1);
  saveAlarms();
  renderAlarms();
}

function toggleSetting(key){
  settings[key]=!settings[key];
  saveSettings();
  updateUI();
}

// Initialize with sample data
if(alarms.length===0){
  alarms=[
    {time:'07:00',enabled:true,days:['周一','周二','周三','周四','周五']},
    {time:'09:00',enabled:false,days:['周六','周日']}
  ];
  saveAlarms();
}

updateUI();
renderPlaylist();
renderAlarms();
playTrack(0);
setInterval(updateProgress,1000);
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
