<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字部首查询</title><meta name="description" content="汉字部首查询 - 在线查询汉字部首"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.radical-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;margin-top:16px}.radical-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:transform .2s}.radical-item:hover{transform:translateY(-2px)}.radical-char{font-size:1.5rem;font-weight:700;color:var(--blue)}.radical-name{font-size:.85rem;color:var(--text2);margin-top:4px}.radical-stroke{font-size:.75rem;color:var(--green)}</style><meta property="og:title" content="汉字部首查询"><meta property="og:description" content="汉字部首查询 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div class="container"><h1>📚 汉字部首查询</h1><p class="sub">在线查询汉字部首</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="getRadicalInfo()">
</div>
<button class="btn" onclick="getRadicalInfo()">查询</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div>
<div class="card">
<h3>常用部首</h3>
<div class="radical-grid" id="radicalGrid"></div>
</div></div>
<script src="../i18n.js" defer></script>
<script>
var radicals={
  '人':{name:'人字旁',strokes:2,examples:'你、他、们、仁、位'},
  '亻':{name:'单人旁',strokes:2,examples:'你、他、们、仁、位'},
  '口':{name:'口字旁',strokes:3,examples:'吃、喝、叫、吹、听'},
  '扌':{name:'提手旁',strokes:3,examples:'打、找、拿、推、拉'},
  '足':{name:'足字旁',strokes:7,examples:'跑、跳、踢、路、跟'},
  '心':{name:'心字底',strokes:4,examples:'想、思、念、意、感'},
  '忄':{name:'竖心旁',strokes:3,examples:'快、慢、情、性、怕'},
  '日':{name:'日字旁',strokes:4,examples:'明、时、早、晚、春'},
  '月':{name:'月字旁',strokes:4,examples:'明、朋、期、朝、腿'},
  '木':{name:'木字旁',strokes:4,examples:'林、树、桃、李、杨'},
  '水':{name:'水字旁',strokes:4,examples:'江、河、湖、海、洋'},
  '氵':{name:'三点水',strokes:3,examples:'江、河、湖、海、洋'},
  '火':{name:'火字旁',strokes:4,examples:'灯、烧、烤、炒、炸'},
  '土':{name:'土字旁',strokes:3,examples:'地、场、城、坐、块'},
  '金':{name:'金字旁',strokes:8,examples:'铁、银、铜、钢、锡'},
  '钅':{name:'金字旁',strokes:5,examples:'铁、银、铜、钢、锡'},
  '石':{name:'石字旁',strokes:5,examples:'砖、砍、破、矿、碗'},
  '手':{name:'手字底',strokes:4,examples:'拿、掌、拳、摩、擦'},
  '王':{name:'王字旁',strokes:4,examples:'珠、球、理、琴、玩'},
  '玉':{name:'玉字旁',strokes:5,examples:'珠、球、理、琴、玩'},
  '女':{name:'女字旁',strokes:3,examples:'妈、姐、妹、娘、姑'},
  '子':{name:'子字旁',strokes:3,examples:'字、学、孩、孙、孝'},
  '目':{name:'目字旁',strokes:5,examples:'眼、睛、盯、看、盼'},
  '耳':{name:'耳字旁',strokes:6,examples:'听、闻、聪、联、职'},
  '竹':{name:'竹字头',strokes:6,examples:'笔、笑、篮、筷、筒'},
  '艹':{name:'草字头',strokes:3,examples:'花、草、茶、药、菜'},
  '走':{name:'走字旁',strokes:7,examples:'跑、走、赶、越、超'},
  '辶':{name:'走之底',strokes:3,examples:'边、过、还、进、道'},
  '门':{name:'门字框',strokes:3,examples:'问、间、闪、闭、开'},
  '车':{name:'车字旁',strokes:4,examples:'轮、转、轻、较、载'},
  '马':{name:'马字旁',strokes:3,examples:'骑、驱、驰、骄、验'},
  '鸟':{name:'鸟字旁',strokes:5,examples:'鸡、鸭、鹅、鹰、鹤'},
  '鱼':{name:'鱼字旁',strokes:8,examples:'鲜、鲤、鲸、鲨、鳄'},
  '虫':{name:'虫字旁',strokes:6,examples:'蛇、蛙、蝶、蜘、蜂'},
  '牛':{name:'牛字旁',strokes:4,examples:'物、特、牺、牲、犁'},
  '羊':{name:'羊字旁',strokes:6,examples:'美、群、样、洋、鲜'},
  '米':{name:'米字旁',strokes:6,examples:'粮、糖、粥、精、类'},
  '衣':{name:'衣字旁',strokes:6,examples:'初、被、裕、裤、衫'},
  '衤':{name:'衣字旁',strokes:5,examples:'初、被、裕、裤、衫'},
  '食':{name:'食字旁',strokes:9,examples:'饭、饮、饱、饿、馋'},
  '饣':{name:'食字旁',strokes:3,examples:'饭、饮、饱、饿、馋'}
};
function getRadicalInfo(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var radical=getRadicalForChar(char);
  var html='<div class="card">';
  html+='<div style="text-align:center;padding:20px">';
  html+='<div style="font-size:4rem;font-weight:700;color:var(--blue)">'+char+'</div>';
  html+='<div style="font-size:1.2rem;margin-top:8px">部首：<strong>'+radical.char+'</strong> ('+radical.name+')</div>';
  html+='<div style="font-size:1rem;color:var(--text2);margin-top:4px">部首笔画：'+radical.strokes+'画</div>';
  html+='</div>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>Unicode：</strong>U+'+char.charCodeAt(0).toString(16).toUpperCase().padStart(4,'0')+'</div>';
  html+='<div><strong>五笔编码：</strong>暂无</div>';
  html+='<div><strong>常见词组：</strong>'+radical.examples+'</div>';
  html+='</div></div>';
  r.innerHTML=html;
}
function getRadicalForChar(char){
  var charCode=char.charCodeAt(0);
  var radicalKeys=Object.keys(radicals);
  for(var i=0;i<radicalKeys.length;i++){
    if(radicals[radicalKeys[i]].examples.includes(char)){
      return{char:radicalKeys[i],name:radicals[radicalKeys[i]].name,strokes:radicals[radicalKeys[i]].strokes,examples:radicals[radicalKeys[i]].examples};
    }
  }
  return{char:'一',name:'横',strokes:1,examples:'暂无'};
}
function randomCharacter(){
  var chars='的是一不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  getRadicalInfo();
}
function renderRadicals(){
  var grid=document.getElementById('radicalGrid');
  var html='';
  var radicalKeys=Object.keys(radicals).slice(0,20);
  radicalKeys.forEach(function(key){
    html+='<div class="radical-item" onclick="selectRadical(\''+key+'\')">';
    html+='<div class="radical-char">'+key+'</div>';
    html+='<div class="radical-name">'+radicals[key].name+'</div>';
    html+='<div class="radical-stroke">'+radicals[key].strokes+'画</div>';
    html+='</div>';
  });
  grid.innerHTML=html;
}
function selectRadical(radical){
  document.getElementById('characterInput').value=radical;
  getRadicalInfo();
}
renderRadicals();
getRadicalInfo();
</script></body></html>
