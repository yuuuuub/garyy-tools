<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔮 今日运势</title>
  <meta name="description" content="今日运势查询，查看各星座每日运势预测">
  <style>
    :root {
      --bg: #0d0221;
      --card-bg: rgba(20, 10, 50, 0.85);
      --text: #e0d8f0;
      --text-secondary: #a094c4;
      --border: rgba(120, 90, 180, 0.3);
      --accent: #9b59b6;
      --input-bg: rgba(255, 255, 255, 0.06);
      --input-border: rgba(155, 89, 182, 0.4);
      --gold: #ffd700;
      --green: #4caf50;
      --blue: #448aff;
      --gray: #9e9e9e;
      --red: #ff5252;
      --star-empty: rgba(255,255,255,0.15);
      --radius: 16px;
      --shadow: 0 4px 30px rgba(100, 40, 180, 0.25);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 16px;
    }
    .stars {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
      opacity: 0;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.4); }
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(1); }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-60px) scale(0.3); }
    }
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      animation: floatUp 1.2s ease-out forwards;
      font-size: 20px;
    }
    .container {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #c084fc, #e879f9, #f0abfc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
    }
    .input-group {
      display: flex; gap: 10px; margin-bottom: 20px;
    }
    .input-group input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }
    .input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(155, 89, 182, 0.15);
    }
    .input-group input::placeholder { color: var(--text-secondary); }
    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #a855f7);
      color: #fff;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 25px rgba(139, 92, 246, 0.55);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.14); }
    .actions {
      display: flex; gap: 10px; margin-bottom: 20px;
      justify-content: center; flex-wrap: wrap;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease;
    }
    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .card-header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .card-header .level-badge {
      display: inline-block;
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card-header .user-name {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .card-header .date-display {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .level-大吉 { background: rgba(255,215,0,0.2); color: var(--gold); border: 1px solid rgba(255,215,0,0.4); }
    .level-吉 { background: rgba(76,175,80,0.2); color: var(--green); border: 1px solid rgba(76,175,80,0.4); }
    .level-平 { background: rgba(68,138,255,0.2); color: var(--blue); border: 1px solid rgba(68,138,255,0.4); }
    .level-凶 { background: rgba(158,158,158,0.2); color: var(--gray); border: 1px solid rgba(158,158,158,0.4); }
    .level-大凶 { background: rgba(255,82,82,0.2); color: var(--red); border: 1px solid rgba(255,82,82,0.4); }
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .stat-row:last-of-type { border-bottom: none; }
    .stat-label {
      font-size: 15px;
      font-weight: 500;
      min-width: 72px;
    }
    .stat-stars {
      font-size: 18px;
      letter-spacing: 2px;
    }
    .stat-desc {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: right;
      max-width: 180px;
      line-height: 1.4;
    }
    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .progress-bar {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.8s ease;
    }
    .progress-label {
      font-size: 13px;
      min-width: 36px;
      text-align: right;
    }
    .extra-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .extra-label {
      font-size: 14px;
      min-width: 72px;
      color: var(--text-secondary);
    }
    .extra-value {
      font-size: 14px;
      font-weight: 500;
    }
    .color-swatch {
      display: inline-block;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.2);
      vertical-align: middle;
      margin-right: 6px;
    }
    .dos-section, .donts-section {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
    }
    .dos-section {
      background: rgba(76,175,80,0.08);
      border: 1px solid rgba(76,175,80,0.2);
    }
    .donts-section {
      background: rgba(255,82,82,0.06);
      border: 1px solid rgba(255,82,82,0.15);
      margin-top: 8px;
    }
    .dos-section h4 { color: var(--green); font-size: 14px; margin-bottom: 6px; }
    .donts-section h4 { color: var(--red); font-size: 14px; margin-bottom: 6px; }
    .dos-section span, .donts-section span { font-size: 14px; }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(139, 92, 246, 0.9);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      backdrop-filter: blur(10px);
    }
    .toast.show { opacity: 1; }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.8;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; display: block; }
    @media (max-width: 380px) {
      .stat-label, .extra-label { min-width: 60px; font-size: 13px; }
      .stat-desc { max-width: 140px; font-size: 12px; }
      .card { padding: 20px 16px; }
    }
  </style>

  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🔮 今日运势">

<body>

<!-- 星空背景 -->
<canvas class="stars" id="starCanvas"></canvas>

<div class="container">
  <h1>🔮 今日运势</h1>
  <div class="input-group">
    <input type="text" id="nameInput" placeholder="输入你的名字或星座..." maxlength="20" autocomplete="off"/>
    <button class="btn btn-primary" id="generateBtn" onclick="generateFortune()">查看运势</button>
  </div>
  <div class="actions">
    <button class="btn btn-secondary" id="randomBtn" onclick="randomFortune()">🎲 随机</button>
    <button class="btn btn-secondary" id="shareBtn" onclick="shareFortune()" style="display:none;">📸 分享</button>
  </div>

  <div class="card" id="fortuneCard">
    <div class="empty-state" id="emptyState">
      <span class="icon">🌙</span>
      输入名字或星座<br>查看今日运势
    </div>
    <div class="card-header" id="cardHeader" style="display:none;">
      <div class="level-badge" id="levelBadge"></div>
      <div class="user-name" id="displayName"></div>
      <div class="date-display" id="displayDate"></div>
    </div>
    <div id="fortuneContent" style="display:none;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const today = new Date();
const dateKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

const luckyColors = [
  { name: '紫罗兰', hex: '#8b5cf6' }, { name: '金色', hex: '#ffd700' }, { name: '翠绿', hex: '#10b981' },
  { name: '珊瑚橙', hex: '#ff6b6b' }, { name: '天蓝', hex: '#60a5fa' }, { name: '玫瑰粉', hex: '#f472b6' },
  { name: '琥珀', hex: '#f59e0b' }, { name: '青碧', hex: '#06b6d4' }, { name: '薰衣草', hex: '#c4b5fd' },
  { name: '桃红', hex: '#e879f9' }, { name: '薄荷绿', hex: '#34d399' }, { name: '杏色', hex: '#fb923c' },
];

const loveTexts = [
  '桃花运旺盛，适合拓展社交圈', '平淡是真，小确幸就在身边', '可能有意外邂逅，保持微笑',
  '感情需要耐心灌溉', '旧人重逢，珍惜缘分', '独处也是一种幸福',
  '主动表达心意会有惊喜', '顺其自然，缘分自会到来', '小心言语冲突破坏气氛',
  '今日宜陪伴，温情升温', '给对方一些空间会更好', '小小的浪漫能点亮一整天',
  '避免翻旧账，向前看', '适合和朋友聊聊心事', '新的缘分正在路上',
];
const workTexts = [
  '灵感迸发，大胆推进项目', '稳扎稳打，步步为营', '团队协作效率倍增',
  '注意细节，避免返工', '今日适合规划长远目标', '贵人相助，把握机会',
  '独立思考会带来新突破', '避免冲动决策，多听意见', '按计划执行会有好结果',
  '适合学习新技能充实自己', '小的成就值得庆贺', '注意时间管理，保持专注',
  '与同事沟通顺畅有效率', '适合处理积压的任务', '保持低调，厚积薄发',
];
const wealthTexts = [
  '正财运稳定，守住钱袋', '小有偏财，见好就收', '理性消费，做好预算',
  '投资需谨慎，不宜冲动', '可能有意外收入', '适合审视理财计划',
  '开销略多，注意控制', '财运平稳，守成为上', '长期投资今日有利',
  '适合记账梳理开支', '防止冲动购物', '储蓄计划可以启动',
  '小额投资可以尝试', '贵人带财，留意人脉', '今日宜开源节流',
];
const healthTexts = [
  '精力充沛，适合运动', '注意颈椎保养', '多喝水，保持活力',
  '早睡早起精神好', '适当放松，避免过劳', '注意饮食均衡',
  '散步有助于放松心情', '保持心情愉悦最重要', '做个拉伸缓解疲劳',
  '注意天气变化添减衣物', '适合慢跑或瑜伽', '保证充足睡眠',
  '少喝咖啡多喝茶', '深呼吸缓解压力', '晒晒太阳补充能量',
];
const dosList = [
  ['穿戴亮色衣服', '主动沟通', '投资自己', '请客吃饭', '制定计划',
   '表达感谢', '早睡早起', '整理房间', '联系旧友', '做运动',
   '记日记', '献爱心', '学习新知', '陪伴家人', '拍照留念'],
  ['注意言行', '冲动消费', '熬夜加班', '与人争执', '做重大决定',
   '暴饮暴食', '传播负能量', '过度劳累', '拖延怠惰', '轻信他人',
   '心浮气躁', '过度节俭', '吃生冷食物', '长期看屏幕', '独自承受压力'],
];

function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash |= 0;
  }
  return Math.abs(hash);
}

function getLevel(score) {
  if (score >= 95) return '大吉';
  if (score >= 80) return '吉';
  if (score >= 60) return '平';
  if (score >= 35) return '凶';
  return '大凶';
}

function getProgressColor(level) {
  const map = { '大吉': 'var(--gold)', '吉': 'var(--green)', '平': 'var(--blue)', '凶': 'var(--gray)', '大凶': 'var(--red)' };
  return map[level] || 'var(--gray)';
}

function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    return s / 0x7fffffff;
  };
}

function buildStars(count) {
  const full = '★', empty = '☆';
  return Array.from({length:5}, (_,i) => `<span style="color:${i<count?'var(--gold)':'var(--star-empty)'}">${i<count?full:empty}</span>`).join('');
}

function getStarCount(level) {
  const map = { '大吉': 5, '吉': 4, '平': 3, '凶': 2, '大凶': 1 };
  return map[level] || 3;
}

function getLevelScore(level) {
  const map = { '大吉': 95, '吉': 80, '平': 60, '凶': 35, '大凶': 15 };
  return map[level] || 60;
}

function generateFortune(userName) {
  const name = (userName || '').trim() || document.getElementById('nameInput').value.trim();
  if (!name) {
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('cardHeader').style.display = 'none';
    document.getElementById('fortuneContent').style.display = 'none';
    return;
  }

  const inputKey = name + dateKey;
  const hash = simpleHash(inputKey);
  const rand = seededRandom(hash);

  const overallScore = 15 + Math.floor(rand() * 85);
  const level = getLevel(overallScore);
  const starCount = getStarCount(level);

  const starCountLove = 1 + Math.floor(rand() * 5);
  const starCountWork = 1 + Math.floor(rand() * 5);
  const starCountWealth = 1 + Math.floor(rand() * 5);
  const starCountHealth = 1 + Math.floor(rand() * 5);

  const loveIdx = Math.floor(rand() * loveTexts.length);
  const workIdx = Math.floor(rand() * workTexts.length);
  const wealthIdx = Math.floor(rand() * wealthTexts.length);
  const healthIdx = Math.floor(rand() * healthTexts.length);

  const luckyColor = luckyColors[Math.floor(rand() * luckyColors.length)];
  const luckyNumber = 1 + Math.floor(rand() * 99);

  const dos = dosList[0][Math.floor(rand() * dosList[0].length)];
  const donts = dosList[1][Math.floor(rand() * dosList[1].length)];

  const scorePercent = Math.round((overallScore / 100) * 100);

  document.getElementById('emptyState').style.display = 'none';
  const cardHeader = document.getElementById('cardHeader');
  cardHeader.style.display = 'block';

  const badge = document.getElementById('levelBadge');
  badge.textContent = level;
  badge.className = 'level-badge level-' + level;

  document.getElementById('displayName').textContent = name;
  document.getElementById('displayDate').textContent = dateKey + ' 运势';

  const fortuneContent = document.getElementById('fortuneContent');
  fortuneContent.style.display = 'block';
  fortuneContent.innerHTML = `
    <div class="progress-container">
      <span class="stat-label">综合运势</span>
      <div class="progress-bar">
        <div class="progress-fill" style="width:0;background:${getProgressColor(level)}" id="overallProgress"></div>
      </div>
      <span class="progress-label" style="color:${getProgressColor(level)}">${buildStars(starCount)} ${scorePercent}%</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">💕 爱情</span>
      <span class="stat-stars">${buildStars(starCountLove)}</span>
      <span class="stat-desc">${loveTexts[loveIdx]}</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">💼 事业</span>
      <span class="stat-stars">${buildStars(starCountWork)}</span>
      <span class="stat-desc">${workTexts[workIdx]}</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">💰 财运</span>
      <span class="stat-stars">${buildStars(starCountWealth)}</span>
      <span class="stat-desc">${wealthTexts[wealthIdx]}</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">🏃 健康</span>
      <span class="stat-stars">${buildStars(starCountHealth)}</span>
      <span class="stat-desc">${healthTexts[healthIdx]}</span>
    </div>
    <div class="extra-row">
      <span class="extra-label">🎨 幸运色</span>
      <span class="extra-value"><span class="color-swatch" style="background:${luckyColor.hex}"></span>${luckyColor.name}</span>
    </div>
    <div class="extra-row">
      <span class="extra-label">🔢 幸运数字</span>
      <span class="extra-value" style="font-size:1.2em;font-weight:700;color:var(--accent)">${luckyNumber}</span>
    </div>
    <div class="dos-section">
      <h4>✅ 今日宜</h4>
      <span>${dos}</span>
    </div>
    <div class="donts-section">
      <h4>❌ 今日忌</h4>
      <span>${donts}</span>
    </div>
  `;

  const card = document.getElementById('fortuneCard');
  card.classList.add('visible');

  setTimeout(() => {
    const progressFill = document.getElementById('overallProgress');
    if (progressFill) progressFill.style.width = scorePercent + '%';
  }, 200);

  document.getElementById('shareBtn').style.display = 'inline-block';

  spawnParticles(level);
}

function spawnParticles(level) {
  const colors = {
    '大吉': ['✨','🌟','⭐'],
    '吉': ['✨','🌟'],
    '平': ['💫','⭐'],
    '凶': ['💧'],
    '大凶': ['💔']
  };
  const emojis = colors[level] || ['✨'];
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const p = document.createElement('span');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = (30 + Math.random() * 40) + '%';
      p.style.top = (50 + Math.random() * 30) + '%';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1300);
    }, i * 80);
  }
}

function randomFortune() {
  const randNames = ['白羊座','金牛座','双子座','巨蟹座','狮子座','处女座','天秤座','天蝎座','射手座','摩羯座','水瓶座','双鱼座'];
  const randName = randNames[Math.floor(Math.random() * randNames.length)];
  document.getElementById('nameInput').value = randName;
  generateFortune(randName);
}

function shareFortune() {
  const card = document.getElementById('fortuneCard');
  const toast = document.getElementById('toast');

  // Try native share API
  if (navigator.share) {
    const name = document.getElementById('nameInput').value.trim();
    const level = document.getElementById('levelBadge').textContent;
    navigator.share({
      title: '🔮 今日运势',
      text: `${name} 今日运势：${level}！ 快来查看你的今日运势吧~`,
      url: window.location.href,
    }).catch(() => {});
    return;
  }

  // Fallback: suggest screenshot
  showToast('📸 请截图保存或长按保存运势卡片！');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ---- 星空背景 ----
function initStars() {
  const canvas = document.getElementById('starCanvas');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = [];
    const count = Math.floor((canvas.width * canvas.height) / 2500);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.6 + 0.4,
        alpha: Math.random(),
        alphaSpeed: (Math.random() - 0.5) * 0.015,
        maxAlpha: Math.random() * 0.6 + 0.4,
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      s.alpha += s.alphaSpeed;
      if (s.alpha > s.maxAlpha || s.alpha < 0.1) s.alphaSpeed *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,180,255,${s.alpha.toFixed(2)})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
}

// 回车键生成
document.getElementById('nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') generateFortune();
});

initStars();
</script>
