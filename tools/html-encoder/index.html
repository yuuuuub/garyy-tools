<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML编码解码</title><meta name="description" content="HTML编码解码 - 在线HTML实体编码与解码工具"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;margin:4px}.btn:hover{opacity:.85}.btn-green{background:var(--green)}.btn-group{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}</style>
<meta property="og:title" content="HTML编码解码">
<meta property="og:description" content="HTML编码解码 - 在线HTML实体编码与解码工具">
<meta property="og:image" content="/og-default.png">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div class="container"><h1>🔒 HTML编码解码</h1><p class="sub">在线HTML实体编码与解码工具</p>
<div class="card"><div style="font-size:.85rem;color:var(--text2);margin-bottom:8px">输入文本（将被编码/解码）</div>
<textarea id="inputText" placeholder="在此输入文本...">Hello <b>World</b> &amp; "quotes" © ®</textarea>
<div class="btn-group">
<button class="btn" onclick="htmlEncode()">HTML编码</button>
<button class="btn" onclick="htmlDecode()">HTML解码</button>
<button class="btn" onclick="urlEncode()">URL编码</button>
<button class="btn" onclick="urlDecode()">URL解码</button>
<button class="btn" onclick="base64Encode()">Base64编码</button>
<button class="btn" onclick="base64Decode()">Base64解码</button>
<button class="btn" onclick="unicodeEncode()">Unicode编码</button>
<button class="btn" onclick="unicodeDecode()">Unicode解码</button>
<button class="btn btn-green" onclick="copyResult()">复制结果</button>
</div></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var lastResult='';
function htmlEncode(){
  var t=document.getElementById('inputText').value;
  var r=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  lastResult=r;showResult(r);
}
function htmlDecode(){
  var t=document.getElementById('inputText').value;
  var el=document.createElement('textarea');el.innerHTML=t;
  lastResult=el.value;showResult(lastResult);
}
function urlEncode(){
  var t=document.getElementById('inputText').value;
  lastResult=encodeURIComponent(t);showResult(lastResult);
}
function urlDecode(){
  var t=document.getElementById('inputText').value;
  try{lastResult=decodeURIComponent(t);showResult(lastResult);}
  catch(e){showError('解码失败: '+e.message);}
}
function base64Encode(){
  var t=document.getElementById('inputText').value;
  try{lastResult=btoa(unescape(encodeURIComponent(t)));showResult(lastResult);}
  catch(e){showError('编码失败: '+e.message);}
}
function base64Decode(){
  var t=document.getElementById('inputText').value;
  try{lastResult=decodeURIComponent(escape(atob(t)));showResult(lastResult);}
  catch(e){showError('解码失败: 无效的Base64字符串');}
}
function unicodeEncode(){
  var t=document.getElementById('inputText').value;
  lastResult=t.split('').map(function(c){return'&#'+c.charCodeAt(0)+';';}).join('');
  showResult(lastResult);
}
function unicodeDecode(){
  var t=document.getElementById('inputText').value;
  lastResult=t.replace(/&#(\d+);/g,function(_,n){return String.fromCharCode(parseInt(n));}).replace(/\\u([0-9a-fA-F]{4})/g,function(_,h){return String.fromCharCode(parseInt(h,16));});
  showResult(lastResult);
}
function copyResult(){
  if(!lastResult)return;
  navigator.clipboard.writeText(lastResult).then(function(){alert('已复制');});
}
function showResult(t){document.getElementById('result').innerHTML='<div class="card"><div class="result-block">'+escapeHtml(t)+'</div><button class="copy-btn" onclick="copyResult()">复制结果</button></div>';}
function showError(msg){document.getElementById('result').innerHTML='<div class="card" style="color:var(--red)">'+msg+'</div>';}
function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
htmlEncode();
</script></body></html>
