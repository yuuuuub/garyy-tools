<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抛硬币</title>
<meta name="description" content="抛硬币随机工具，模拟抛硬币做出随机决定">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
h1{font-size:1.5rem;margin-bottom:20px;color:#3b82f6}
.coin-wrap{perspective:600px;margin-bottom:30px}
.coin{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:bold;transition:transform .1s;position:relative}
.coin.flipping{animation:flipCoin 1s ease-in-out}
@keyframes flipCoin{
  0%{transform:rotateY(0)}
  25%{transform:rotateY(900deg) translateY(-40px)}
  50%{transform:rotateY(1800deg) translateY(-20px)}
  75%{transform:rotateY(2700deg) translateY(-40px)}
  100%{transform:rotateY(3600deg) translateY(0)}
}
.coin.heads{background:linear-gradient(135deg,#fbbf24,#f59e0b);border:4px solid #d97706;color:#78350f}
.coin.tails{background:linear-gradient(135deg,#60a5fa,#3b82f6);border:4px solid #2563eb;color:#1e3a5f}
.coin.idle{background:linear-gradient(135deg,#6b7280,#4b5563);border:4px solid #374151;color:#d1d5db}
.controls{display:flex;gap:12px;margin-bottom:25px}
button{padding:12px 28px;border:none;border-radius:8px;cursor:pointer;font-size:1rem;color:#fff}
.btn-flip{background:#3b82f6}.btn-flip:hover{background:#2563eb}
.btn-reset{background:#30363d}.btn-reset:hover{background:#484f58}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:10px}
.stat{background:#161b22;padding:15px 20px;border-radius:8px;border:1px solid #30363d;text-align:center}
.stat .num{font-size:1.8rem;font-weight:bold}.stat .lbl{font-size:0.85rem;color:#8b949e;margin-top:4px}
.streak{margin-top:15px;font-size:1rem;color:#8b949e;min-height:1.5em}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="抛硬币">
  <meta property="og:description" content="抛硬币随机工具，模拟抛硬币做出随机决定">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/coin-flip/">
</head>
<body>
<h1>🪙 抛硬币</h1>
<div class="coin-wrap"><div class="coin idle" id="coin">🪙</div></div>
<div class="controls">
<button class="btn-flip" onclick="flip()">抛硬币</button>
<button class="btn-reset" onclick="reset()">重置统计</button>
</div>
<div class="stats">
<div class="stat"><div class="num" id="heads">0</div><div class="lbl">正面 🟡</div></div>
<div class="stat"><div class="num" id="tails">0</div><div class="lbl">反面 🔵</div></div>
<div class="stat"><div class="num" id="total">0</div><div class="lbl">总次数</div></div>
</div>
<div class="streak" id="streak"></div>
<script>
let stats={heads:0,tails:0},flipping=false,maxStreak=0,curStreak=0,curSide='';

function flip(){
  if(flipping)return;flipping=true;
  const coin=document.getElementById('coin');
  coin.className='coin flipping';
  const isHeads=Math.random()<0.5;

  setTimeout(()=>{
    coin.className=`coin ${isHeads?'heads':'tails'}`;
    coin.textContent=isHeads?'正':'反';
    stats[isHeads?'heads':'tails']++;
    document.getElementById('heads').textContent=stats.heads;
    document.getElementById('tails').textContent=stats.tails;
    document.getElementById('total').textContent=stats.heads+stats.tails;

    if(isHeads===curSide){curStreak++;maxStreak=Math.max(maxStreak,curStreak)}
    else{curSide=isHeads;curStreak=1}
    const s=document.getElementById('streak');
    if(curStreak>=3)s.textContent=`连续${curSide?'正面':'反面'} ${curStreak} 次！🔥`;
    else if(maxStreak>=3)s.textContent=`最长连续: ${maxStreak} 次`;
    else s.textContent='';

    flipping=false;
  },1000);
}

function reset(){
  stats={heads:0,tails:0};maxStreak=0;curStreak=0;curSide='';
  document.getElementById('heads').textContent=0;
  document.getElementById('tails').textContent=0;
  document.getElementById('total').textContent=0;
  document.getElementById('streak').textContent='';
  const coin=document.getElementById('coin');
  coin.className='coin idle';coin.textContent='🪙';
}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
