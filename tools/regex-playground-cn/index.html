<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正则表达式游乐场 - 在线正则测试</title>
<meta name="description" content="在线正则表达式测试工具，实时匹配和高亮显示结果">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;--muted:#8b949e}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warning:#9a6700;--error:#cf222e;--muted:#656d76}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
nav .logo{font-size:18px;font-weight:600;color:var(--accent2)}
nav a{color:var(--accent);text-decoration:none;font-size:14px}
.main{max-width:1200px;margin:0 auto;padding:16px}
.toolbar{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{opacity:.8}
.regex-input{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:16px}
.regex-input label{font-size:13px;color:var(--accent2);font-weight:500;margin-bottom:8px;display:block}
.regex-row{display:flex;gap:8px;align-items:center}
.regex-row input[type="text"]{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:14px;outline:none}
.regex-row input[type="text"]:focus{border-color:var(--accent)}
.flags{display:flex;gap:6px}
.flag-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer;transition:.2s;font-family:monospace}
.flag-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.test-area{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:16px}
.test-area label{font-size:13px;color:var(--accent2);font-weight:500;margin-bottom:8px;display:block}
.test-area textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:14px;line-height:1.6;resize:vertical;outline:none}
.test-area textarea:focus{border-color:var(--accent)}
.results{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:16px}
.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.results-header h3{font-size:14px;color:var(--accent2)}
.match-count{font-size:12px;color:var(--muted);background:var(--bg);padding:4px 10px;border-radius:12px}
.match-item{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.match-item .match-value{font-family:monospace;color:var(--success);font-size:13px;margin-bottom:4px}
.match-item .match-groups{font-size:12px;color:var(--muted)}
.match-item .match-index{font-size:11px;color:var(--accent2);margin-top:4px}
.highlighted{background:rgba(59,130,246,0.2);border-bottom:2px solid var(--accent);padding:2px 0;border-radius:2px}
.templates{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:16px}
.templates h3{font-size:14px;color:var(--accent2);margin-bottom:8px}
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.template-item{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;cursor:pointer;transition:.2s}
.template-item:hover{border-color:var(--accent)}
.template-item .name{font-size:13px;font-weight:500;margin-bottom:4px}
.template-item .pattern{font-family:monospace;font-size:11px;color:var(--accent2);word-break:break-all}
.explanation{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px}
.explanation h3{font-size:14px;color:var(--accent2);margin-bottom:8px}
.explanation .parts{font-family:monospace;font-size:13px;line-height:2}
.explanation .part{display:inline-block;padding:2px 8px;margin:2px;border-radius:4px;border:1px solid var(--border)}
.explanation .part:hover{border-color:var(--accent);background:rgba(59,130,246,0.1)}
.explanation .desc{font-size:11px;color:var(--muted);margin-left:4px}
@media(max-width:768px){.template-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.main{animation:fadeIn .4s ease-out}
h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="正则表达式游乐场 - 在线正则测试">
<meta property="og:description" content="在线正则表达式测试工具，实时匹配和高亮显示结果">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/regex-playground-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="/i18n.js" defer></script>
</head>
<body>
<h1>正则表达式游乐场 - 在线正则测试</h1>
<nav>
<span class="logo">正则游乐场</span>
<a href="/index.html">← 返回工具箱</a>
</nav>
<div class="main">
<div class="regex-input">
<label>正则表达式</label>
<div class="regex-row">
<span style="color:var(--muted);font-family:monospace">/</span>
<input type="text" id="regexInput" value="\b[\w.-]+@[\w.-]+\.\w+\b" placeholder="输入正则表达式...">
<span style="color:var(--muted);font-family:monospace">/</span>
<div class="flags">
<button class="flag-btn active" data-flag="g" onclick="toggleFlag(this)">g</button>
<button class="flag-btn" data-flag="i" onclick="toggleFlag(this)">i</button>
<button class="flag-btn" data-flag="m" onclick="toggleFlag(this)">m</button>
<button class="flag-btn" data-flag="s" onclick="toggleFlag(this)">s</button>
<button class="flag-btn" data-flag="u" onclick="toggleFlag(this)">u</button>
</div>
</div>
</div>
<div class="test-area">
<label>测试文本</label>
<textarea id="testText">联系我们：
邮箱：zhangsan@example.com
客服：support@company.cn
个人：user.name@domain.org
电话：400-123-4567
网站：https://www.example.com</textarea>
</div>
<div class="toolbar">
<button class="btn btn-primary" onclick="testRegex()">▶ 测试匹配</button>
<button class="btn btn-secondary" onclick="copyRegex()">复制正则</button>
<button class="btn btn-secondary" onclick="resetAll()">重置</button>
</div>
<div class="results" id="resultsSection">
<div class="results-header">
<h3>匹配结果</h3>
<span class="match-count" id="matchCount">0 个匹配</span>
</div>
<div id="matchResults"></div>
<div id="highlightedText" style="margin-top:12px;padding:12px;background:var(--bg);border-radius:6px;line-height:1.8;white-space:pre-wrap;font-size:13px"></div>
</div>
<div class="templates">
<h3>常用正则模板</h3>
<div class="template-grid">
<div class="template-item" onclick="loadTemplate('\\b[\\w.-]+@[\\w.-]+\\.\\w+\\b', '请输入测试文本')"><div class="name">邮箱验证</div><div class="pattern">\\b[\\w.-]+@[\\w.-]+\\.\\w+\\b</div></div>
<div class="template-item" onclick="loadTemplate('1[3-9]\\d{9}', '手机号码：13812345678')"><div class="name">手机号码</div><div class="pattern">1[3-9]\\d{9}</div></div>
<div class="template-item" onclick="loadTemplate('https?://[\\w\\-._~:/?#\\[\\]@!$&\'()*+,;=%]+', '网址：https://www.example.com')"><div class="name">URL匹配</div><div class="pattern">https?://[\\w\\-._~:/?#...]+</div></div>
<div class="template-item" onclick="loadTemplate('[\\u4e00-\\u9fa5]+', '中文测试：你好世界Hello')"><div class="name">中文字符</div><div class="pattern">[\\u4e00-\\u9fa5]+</div></div>
<div class="template-item" onclick="loadTemplate('\\d{17}[\\dXx]', '身份证：110101199001011234')"><div class="name">身份证号</div><div class="pattern">\\d{17}[\\dXx]</div></div>
<div class="template-item" onclick="loadTemplate('\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b', 'IP地址：192.168.1.1')"><div class="name">IP地址</div><div class="pattern">\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b</div></div>
</div>
</div>
<div class="explanation" id="explanation">
<h3>正则解析</h3>
<div class="parts" id="explanationParts"></div>
</div>
</div>
<script>
const regexInput = document.getElementById('regexInput');
const testText = document.getElementById('testText');
let activeFlags = new Set(['g']);

function toggleFlag(btn) {
  const flag = btn.dataset.flag;
  if (activeFlags.has(flag)) { activeFlags.delete(flag); btn.classList.remove('active'); }
  else { activeFlags.add(flag); btn.classList.add('active'); }
  testRegex();
}

function testRegex() {
  const pattern = regexInput.value;
  const text = testText.value;
  const flags = [...activeFlags].join('');
  const resultsDiv = document.getElementById('matchResults');
  const highlightDiv = document.getElementById('highlightedText');
  const countSpan = document.getElementById('matchCount');

  if (!pattern) {
    resultsDiv.innerHTML = '';
    highlightDiv.innerHTML = '';
    countSpan.textContent = '0 个匹配';
    return;
  }

  try {
    const regex = new RegExp(pattern, flags);
    const matches = [];
    let match;
    const globalSearch = flags.includes('g');

    if (globalSearch) {
      while ((match = regex.exec(text)) !== null) {
        matches.push({ value: match[0], index: match.index, groups: match.slice(1) });
        if (match.index === regex.lastIndex) regex.lastIndex++;
      }
    } else {
      match = regex.exec(text);
      if (match) matches.push({ value: match[0], index: match.index, groups: match.slice(1) });
    }

    countSpan.textContent = matches.length + ' 个匹配';

    let html = '';
    matches.forEach((m, i) => {
      html += '<div class="match-item">';
      html += '<div class="match-value">匹配 ' + (i + 1) + ': "' + escapeHtml(m.value) + '"</div>';
      if (m.groups.length > 0) {
        html += '<div class="match-groups">分组: ' + m.groups.map((g, j) => '(' + (j + 1) + '): "' + escapeHtml(g || '') + '"').join(', ') + '</div>';
      }
      html += '<div class="match-index">位置: ' + m.index + '-' + (m.index + m.value.length) + '</div>';
      html += '</div>';
    });
    resultsDiv.innerHTML = html || '<div style="color:var(--muted);padding:8px">无匹配结果</div>';

    // Highlight in text
    if (matches.length > 0) {
      let highlighted = '';
      let lastIdx = 0;
      const sortedMatches = [...matches].sort((a, b) => a.index - b.index);
      sortedMatches.forEach(m => {
        highlighted += escapeHtml(text.slice(lastIdx, m.index));
        highlighted += '<span class="highlighted">' + escapeHtml(m.value) + '</span>';
        lastIdx = m.index + m.value.length;
      });
      highlighted += escapeHtml(text.slice(lastIdx));
      highlightDiv.innerHTML = highlighted;
    } else {
      highlightDiv.innerHTML = escapeHtml(text);
    }

    explainRegex(pattern);
  } catch(e) {
    resultsDiv.innerHTML = '<div style="color:var(--error);padding:8px">错误: ' + escapeHtml(e.message) + '</div>';
    highlightDiv.innerHTML = escapeHtml(text);
    countSpan.textContent = '正则错误';
  }
}

function explainRegex(pattern) {
  const partsDiv = document.getElementById('explanationParts');
  const parts = [];
  const descriptions = {
    '\\d': '数字', '\\w': '单词字符', '\\s': '空白', '\\b': '单词边界',
    '\\D': '非数字', '\\W': '非单词字符', '\\S': '非空白',
    '+': '一次或多次', '*': '零次或多次', '?': '零次或一次',
    '^': '行首', '$': '行尾', '.': '任意字符',
    '|': '或', '(': '分组开始', ')': '分组结束',
    '[': '字符类开始', ']': '字符类结束',
    '{': '量词开始', '}': '量词结束',
    '\\': '转义'
  };
  let i = 0;
  while (i < pattern.length) {
    let consumed = 1;
    let desc = '';
    const ch = pattern[i];
    if (ch === '\\' && i + 1 < pattern.length) {
      const next = pattern[i + 1];
      consumed = 2;
      desc = descriptions['\\' + next] || '转义字符';
    } else if (ch === '[') {
      const end = pattern.indexOf(']', i + 1);
      if (end !== -1) { consumed = end - i + 1; desc = '字符类'; }
    } else if (ch === '{') {
      const end = pattern.indexOf('}', i + 1);
      if (end !== -1) { consumed = end - i + 1; desc = '量词'; }
    } else if (ch === '(' || ch === ')') {
      desc = ch === '(' ? '分组开始' : '分组结束';
    } else {
      desc = descriptions[ch] || '字符 "' + ch + '"';
    }
    parts.push({ text: pattern.slice(i, i + consumed), desc });
    i += consumed;
  }
  partsDiv.innerHTML = parts.map(p =>
    '<span class="part">' + escapeHtml(p.text) + '<span class="desc"> ' + p.desc + '</span></span>'
  ).join('');
}

function escapeHtml(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function loadTemplate(pattern, text) {
  regexInput.value = pattern;
  testText.value = text;
  testRegex();
}

function copyRegex() {
  const flags = [...activeFlags].join('');
  navigator.clipboard.writeText('/' + regexInput.value + '/' + flags).then(() => alert('正则已复制'));
}

function resetAll() {
  regexInput.value = '';
  testText.value = '';
  document.getElementById('matchResults').innerHTML = '';
  document.getElementById('highlightedText').innerHTML = '';
  document.getElementById('matchCount').textContent = '0 个匹配';
  document.getElementById('explanationParts').innerHTML = '';
}

regexInput.addEventListener('input', testRegex);
testText.addEventListener('input', testRegex);
testRegex();
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
