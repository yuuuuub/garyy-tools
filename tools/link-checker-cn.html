<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="链接检查工具 - 检测网页中的死链接">
    <meta name="robots" content="index, follow">
    <title>链接检查工具</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #dee2e6;
            --card-bg: #f8f9fa;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #444444;
            --card-bg: #2d2d2d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-family: monospace;
            resize: vertical;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
        }
        .link-item {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .link-item.broken {
            background-color: rgba(220, 53, 69, 0.1);
            border-left: 4px solid var(--danger-color);
        }
        .link-item.valid {
            background-color: rgba(40, 167, 69, 0.1);
            border-left: 4px solid var(--success-color);
        }
        .link-item.redirect {
            background-color: rgba(255, 193, 7, 0.1);
            border-left: 4px solid var(--warning-color);
        }
        .link-url {
            word-break: break-all;
            flex: 1;
        }
        .link-status {
            margin-left: 10px;
            font-weight: bold;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .stat {
            padding: 10px;
            border-radius: 4px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>链接检查工具</h1>
        <p>输入HTML代码检查链接有效性</p>
        
        <div class="form-group">
            <label for="htmlInput">HTML代码:</label>
            <textarea id="htmlInput" rows="10" placeholder="粘贴HTML代码..."></textarea>
        </div>
        
        <button onclick="runCheck()">开始检查</button>
        
        <div id="result" class="result" style="display: none;">
            <h2>检查结果</h2>
            <div id="stats" class="stats"></div>
            <div id="links"></div>
        </div>
    </div>

    <script src="i18n.js" defer></script>
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            html.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
        }

        function runCheck() {
            const htmlInput = document.getElementById('htmlInput').value;
            
            if (!htmlInput) {
                alert('请输入HTML代码');
                return;
            }
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlInput, 'text/html');
            
            const links = doc.querySelectorAll('a[href]');
            const results = [];
            
            links.forEach(link => {
                const href = link.getAttribute('href');
                const text = link.textContent.trim() || '无文本';
                
                // 模拟链接检查
                let status = 'valid';
                let statusCode = 200;
                
                // 简单模拟一些无效链接
                if (href === '#' || href === '' || href === 'javascript:void(0)') {
                    status = 'broken';
                    statusCode = 404;
                } else if (href.startsWith('mailto:') || href.startsWith('tel:')) {
                    status = 'valid';
                    statusCode = 200;
                } else if (href.includes('404') || href.includes('error')) {
                    status = 'broken';
                    statusCode = 404;
                } else if (href.includes('redirect') || href.includes('moved')) {
                    status = 'redirect';
                    statusCode = 301;
                }
                
                results.push({
                    url: href,
                    text: text.substring(0, 50) + (text.length > 50 ? '...' : ''),
                    status: status,
                    statusCode: statusCode
                });
            });
            
            // 统计
            const validCount = results.filter(r => r.status === 'valid').length;
            const brokenCount = results.filter(r => r.status === 'broken').length;
            const redirectCount = results.filter(r => r.status === 'redirect').length;
            
            // 显示统计
            const statsDiv = document.getElementById('stats');
            statsDiv.innerHTML = `
                <div class="stat">
                    <div>总链接数</div>
                    <div class="stat-value">${results.length}</div>
                </div>
                <div class="stat">
                    <div>有效链接</div>
                    <div class="stat-value" style="color: var(--success-color)">${validCount}</div>
                </div>
                <div class="stat">
                    <div>死链接</div>
                    <div class="stat-value" style="color: var(--danger-color)">${brokenCount}</div>
                </div>
                <div class="stat">
                    <div>重定向</div>
                    <div class="stat-value" style="color: var(--warning-color)">${redirectCount}</div>
                </div>
            `;
            
            // 显示链接列表
            const linksDiv = document.getElementById('links');
            linksDiv.innerHTML = results.map(result => 
                `<div class="link-item ${result.status}">
                    <div class="link-url">${result.url}</div>
                    <div class="link-status">${result.statusCode}</div>
                </div>`
            ).join('');
            
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
