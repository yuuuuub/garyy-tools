<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 变更请求</title>
<meta name="description" content="变更请求管理工具，提交和审批项目变更，追踪变更影响">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
button.grn{background:var(--green)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:14px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-num{font-size:1.5rem;font-weight:700}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:2px}
.cr-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:all .2s}
.cr-card:hover{border-color:var(--accent)}
.cr-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cr-id{font-size:.8rem;color:var(--accent);font-weight:700}
.cr-title{font-weight:600;font-size:1rem;margin:4px 0}
.cr-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--text2)}
.badge{padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600;white-space:nowrap}
.badge-draft{background:rgba(139,148,158,.15);color:var(--text2)}
.badge-pending{background:rgba(210,153,34,.15);color:var(--yellow)}
.badge-approved{background:rgba(63,185,80,.15);color:var(--green)}
.badge-rejected{background:rgba(248,81,73,.1);color:var(--red)}
.badge-implemented{background:rgba(59,130,246,.15);color:var(--accent)}
.badge-urgent{background:rgba(248,81,73,.2);color:var(--red)}
.badge-normal{background:rgba(59,130,246,.15);color:var(--accent)}
.badge-low{background:rgba(63,185,80,.15);color:var(--green)}
.cr-section{margin-top:10px;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:.85rem}
.cr-section .sl{font-size:.75rem;font-weight:600;color:var(--text2);margin-bottom:4px}
.impact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.impact-item{padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;text-align:center}
.impact-item .il{font-size:.7rem;color:var(--text2)}
.impact-item .iv{font-size:.9rem;font-weight:600}
.cr-actions{display:flex;gap:6px;margin-top:10px}
.cr-actions button{padding:5px 12px;font-size:.8rem}
.timeline{margin-top:12px;padding-left:20px;border-left:2px solid var(--border)}
.timeline-item{padding:8px 0 8px 16px;position:relative;font-size:.85rem}
.timeline-item::before{content:'';position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.timeline-item .tt{font-size:.75rem;color:var(--text2)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto}
.empty{color:var(--text2);text-align:center;padding:30px}
@media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}.impact-grid{grid-template-columns:1fr}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📝 变更请求">
<meta property="og:description" content="变更请求管理工具，提交和审批项目变更，追踪变更影响">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/change-request-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='changereq_data';
let state=JSON.parse(localStorage.getItem(STORE)||'{"crs":[]}');
if(!state.crs.length){
  state.crs=[
    {id:'CR-001',title:'升级支付SDK至v3.0',description:'当前支付SDK版本过旧，存在安全隐患，需升级到最新版本',
      reason:'安全合规要求',priority:'urgent',status:'approved',
      impact:{schedule:'影响1天',cost:'无额外成本',scope:'无变化',risk:'中等',quality:'提升安全性',resources:'需1名开发'},
      submitter:'张三',reviewer:'技术总监',submitDate:new Date().toISOString().slice(0,10),reviewDate:'',
      timeline:[{action:'提交变更',user:'张三',date:new Date().toISOString().slice(0,10)}]},
    {id:'CR-002',title:'增加微信登录方式',description:'用户反馈希望支持微信一键登录，提升注册转化率',
      reason:'提升用户体验',priority:'normal',status:'pending',
      impact:{schedule:'影响3天',cost:'微信认证费',scope:'新增登录模块',risk:'低',quality:'提升体验',resources:'需1名前端+1名后端'},
      submitter:'产品经理',reviewer:'',submitDate:'2025-06-22',reviewDate:'',
      timeline:[{action:'提交变更',user:'产品经理',date:'2025-06-22'}]}
  ];
}
let showModal=false,editingCR=null;
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function genId(){const n=state.crs.length+1;return'CR-'+String(n).padStart(3,'0')}

function render(){
  let h=`<div class="hdr"><h1>📝 变更请求</h1><p>管理和追踪项目变更</p></div>`;
  const crs=state.crs;
  h+=`<div class="stats-grid"><div class="stat"><div class="stat-num">${crs.length}</div><div class="stat-label">总变更</div></div><div class="stat"><div class="stat-num" style="color:var(--yellow)">${crs.filter(c=>c.status==='pending').length}</div><div class="stat-label">待审批</div></div><div class="stat"><div class="stat-num" style="color:var(--green)">${crs.filter(c=>c.status==='approved').length}</div><div class="stat-label">已批准</div></div><div class="stat"><div class="stat-num" style="color:var(--accent)">${crs.filter(c=>c.status==='implemented').length}</div><div class="stat-label">已实施</div></div></div>`;

  h+=`<div class="cd"><div class="flex-between"><h2 style="margin:0">变更列表</h2><button onclick="openNew()">+ 提交变更</button></div></div>`;

  if(!crs.length)h+=`<div class="cd"><p class="empty">暂无变更请求</p></div>`;
  crs.forEach(c=>{
    const statusLabels={draft:'📝 草稿',pending:'⏳ 待审批',approved:'✅ 已批准',rejected:'❌ 已否决',implemented:'🚀 已实施'};
    const priLabels={urgent:'紧急',normal:'普通',low:'低'};
    h+=`<div class="cr-card"><div class="cr-header"><div><span class="cr-id">${c.id}</span><div class="cr-title">${c.title}</div><div class="cr-meta"><span class="badge badge-${c.status}">${statusLabels[c.status]}</span><span class="badge badge-${c.priority}">${priLabels[c.priority]}</span><span>👤 ${c.submitter}</span><span>📅 ${c.submitDate}</span>${c.reviewer?`<span>🔍 ${c.reviewer}</span>`:''}</div></div></div>`;
    h+=`<div class="cr-section"><div class="sl">📋 变更描述</div>${c.description}</div>`;
    h+=`<div class="cr-section"><div class="sl">💭 变更原因</div>${c.reason}</div>`;
    if(c.impact){
      h+=`<div class="cr-section"><div class="sl">📊 影响评估</div><div class="impact-grid">`;
      Object.entries({schedule:'⏱️ 进度',cost:'💰 成功',scope:'📐 范围',risk:'⚠️ 风险',quality:'✅ 质量',resources:'👥 资源'}).forEach(([k,label])=>{
        if(c.impact[k])h+=`<div class="impact-item"><div class="il">${label}</div><div class="iv">${c.impact[k]}</div></div>`;
      });
      h+=`</div></div>`;
    }
    if(c.timeline?.length){
      h+=`<div class="cr-section"><div class="sl">📜 审批时间线</div><div class="timeline">`;
      c.timeline.forEach(t=>{h+=`<div class="timeline-item">${t.action} <span style="color:var(--accent)">${t.user}</span><div class="tt">${t.date}</div></div>`});
      h+=`</div></div>`;
    }
    h+=`<div class="cr-actions">`;
    if(c.status==='draft'||c.status==='pending')h+=`<button onclick="updateCRStatus('${c.id}','approved')">✅ 批准</button>`;
    if(c.status==='pending')h+=`<button class="dng" onclick="updateCRStatus('${c.id}','rejected')">❌ 否决</button>`;
    if(c.status==='approved')h+=`<button onclick="updateCRStatus('${c.id}','implemented')">🚀 实施</button>`;
    h+=`<button class="sec" onclick="editCR('${c.id}')">✏️ 编辑</button><button class="dng" onclick="deleteCR('${c.id}')">🗑️</button></div></div>`;
  });

  if(showModal)h+=renderModal();
  $('app').innerHTML=h;
}

function renderModal(){
  const isEdit=!!editingCR?.id;
  const c=editingCR||{};
  const imp=c.impact||{};
  let h=`<div class="modal-overlay" onclick="showModal=false;editingCR=null;render()"><div class="modal" onclick="event.stopPropagation()">`;
  h+=`<h2 style="margin-bottom:16px">${isEdit?'✏️ 编辑变更':'📝 提交变更'}</h2>`;
  h+=`<label>变更标题</label><input id="mTitle" value="${c.title||''}" placeholder="例：升级支付SDK">`;
  h+=`<label>变更描述</label><textarea id="mDesc" placeholder="详细描述变更内容...">${c.description||''}</textarea>`;
  h+=`<label>变更原因</label><textarea id="mReason" rows="2">${c.reason||''}</textarea>`;
  h+=`<div style="display:flex;gap:12px"><div style="flex:1"><label>优先级</label><select id="mPriority"><option value="urgent" ${c.priority==='urgent'?'selected':''}>🔴 紧急</option><option value="normal" ${c.priority==='normal'?'selected':''}>🔵 普通</option><option value="low" ${c.priority==='low'?'selected':''}>🟢 低</option></select></div><div style="flex:1"><label>状态</label><select id="mStatus"><option value="draft" ${c.status==='draft'?'selected':''}>草稿</option><option value="pending" ${c.status==='pending'?'selected':''}>待审批</option><option value="approved" ${c.status==='approved'?'selected':''}>已批准</option></select></div></div>`;
  h+=`<label>提交人</label><input id="mSubmitter" value="${c.submitter||''}">`;
  h+=`<label>审批人</label><input id="mReviewer" value="${c.reviewer||''}">`;
  h+=`<div class="cr-section"><div class="sl">📊 影响评估</div>`;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;
  h+=`<div><label>进度影响</label><input id="mSchedule" value="${imp.schedule||''}" placeholder="如：影响3天"></div>`;
  h+=`<div><label>成本影响</label><input id="mCost" value="${imp.cost||''}" placeholder="如：无额外成本"></div>`;
  h+=`<div><label>范围影响</label><input id="mScope" value="${imp.scope||''}" placeholder="如：新增模块"></div>`;
  h+=`<div><label>风险评估</label><input id="mRisk" value="${imp.risk||''}" placeholder="如：低/中/高"></div>`;
  h+=`<div><label>质量影响</label><input id="mQuality" value="${imp.quality||''}" placeholder="如：提升性能"></div>`;
  h+=`<div><label>资源需求</label><input id="mResources" value="${imp.resources||''}" placeholder="如：需2名开发"></div>`;
  h+=`</div></div>`;
  h+=`<div class="flex" style="margin-top:16px;justify-content:flex-end"><button class="sec" onclick="showModal=false;editingCR=null;render()">取消</button><button onclick="saveCR()">${isEdit?'保存':'提交'}</button></div>`;
  h+=`</div></div>`;
  return h;
}

function openNew(){editingCR={priority:'normal',status:'draft',impact:{},timeline:[]};showModal=true;render()}
function editCR(id){const c=state.crs.find(x=>x.id===id);editingCR={...c,impact:{...c.impact},timeline:[...c.timeline]};showModal=true;render()}
function saveCR(){
  const title=$('mTitle').value.trim();
  if(!title){alert('请输入标题');return}
  const cr={
    id:editingCR?.id||genId(),title,description:$('mDesc').value.trim(),
    reason:$('mReason').value.trim(),priority:$('mPriority').value,
    status:$('mStatus').value||editingCR?.status||'draft',
    submitter:$('mSubmitter').value.trim(),reviewer:$('mReviewer').value.trim(),
    submitDate:editingCR?.submitDate||new Date().toISOString().slice(0,10),reviewDate:'',
    impact:{schedule:$('mSchedule').value.trim(),cost:$('mCost').value.trim(),scope:$('mScope').value.trim(),risk:$('mRisk').value.trim(),quality:$('mQuality').value.trim(),resources:$('mResources').value.trim()},
    timeline:editingCR?.timeline||[]
  };
  const idx=state.crs.findIndex(x=>x.id===cr.id);
  if(idx>=0)state.crs[idx]=cr;else state.crs.unshift(cr);
  save();showModal=false;editingCR=null;render();
}
function deleteCR(id){if(!confirm('确定删除？'))return;state.crs=state.crs.filter(c=>c.id!==id);save();render()}
function updateCRStatus(id,status){
  const c=state.crs.find(x=>x.id===id);if(!c)return;
  c.status=status;
  const actions={approved:'批准变更',rejected:'否决变更',implemented:'实施变更'};
  c.timeline.push({action:actions[status]||status,user:'我',date:new Date().toISOString().slice(0,10)});
  if(status==='approved')c.reviewDate=new Date().toISOString().slice(0,10);
  save();render();
}
render();
</script>
</body>
</html>
