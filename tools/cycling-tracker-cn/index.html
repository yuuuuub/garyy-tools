<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚴 骑行追踪</title>
<meta name="description" content="骑行数据追踪器，记录距离、速度、海拔，查看骑行统计和个人记录">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:10px 0;margin-top:8px}
.bar-chart .bar{flex:1;background:linear-gradient(180deg,var(--warn),var(--accent));border-radius:4px 4px 0 0;position:relative;min-width:20px;transition:height .3s}
.bar-chart .bar .val{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--text2)}
.bar-chart .bar .lbl{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--text2);white-space:nowrap}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚴</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🚴 骑行追踪">
<meta property="og:description" content="骑行数据追踪器，记录距离、速度、海拔">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/cycling-tracker-cn/">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🚴 骑行追踪</h1><p>骑行在路上，数据在手中</p></div>

<div class="cd">
<div class="gr">
<div class="st"><div class="nm" id="totalDist">0</div><div class="lb">总距离(km)</div></div>
<div class="st"><div class="nm" id="avgSpeed" style="color:var(--success)">0</div><div class="lb">平均速度(km/h)</div></div>
<div class="st"><div class="nm" id="maxSpeed" style="color:var(--warn)">0</div><div class="lb">最高速度(km/h)</div></div>
<div class="st"><div class="nm" id="totalElev" style="color:var(--danger)">0</div><div class="lb">总爬升(m)</div></div>
</div>
</div>

<div class="cd"><h2>记录骑行</h2>
<div class="fr">
<div><label>距离(km)</label><input type="number" id="cDist" placeholder="20.0" step="0.1" min="0.1"></div>
<div><label>用时(分钟)</label><input type="number" id="cMin" placeholder="60" min="1"></div>
</div>
<div class="fr">
<div><label>地形</label><select id="cTerrain"><option>公路</option><option>山地</option><option>城市</option><option>室内骑行台</option><option>越野</option></select></div>
<div><label>爬升(米)</label><input type="number" id="cElev" placeholder="100" min="0"></div>
</div>
<div><label>日期</label><input type="date" id="cDate"></div>
<div class="bg"><button onclick="addRide()">保存骑行</button></div></div>

<div class="cd"><h2>最近10次距离</h2><div class="bar-chart" id="distChart"></div></div>

<div class="cd"><h2>骑行记录</h2><div id="rideList" class="es">暂无记录</div>
<div class="bg"><button class="dng" onclick="clearRides()">清空所有</button></div></div>
</div>
<script>
(function(){
var DB_KEY='cycling_tracker_cn';
var rides=JSON.parse(localStorage.getItem(DB_KEY)||'[]');
var today=function(){return new Date().toISOString().slice(0,10)};

window.addRide=function(){
var dist=parseFloat(document.getElementById('cDist').value)||0;
var min=parseInt(document.getElementById('cMin').value)||0;
if(!dist||!min){alert('请填写距离和用时');return;}
var terrain=document.getElementById('cTerrain').value;
var elev=parseInt(document.getElementById('cElev').value)||0;
var date=document.getElementById('cDate').value||today();
var speed=dist/(min/60);
rides.push({id:Date.now(),distance:dist,duration:min,terrain:terrain,elevation:elev,date:date,speed:speed});
localStorage.setItem(DB_KEY,JSON.stringify(rides));
document.getElementById('cDist').value='';document.getElementById('cMin').value='';document.getElementById('cElev').value='';
render();
};

window.delRide=function(id){rides=rides.filter(function(r){return r.id!==id});localStorage.setItem(DB_KEY,JSON.stringify(rides));render();};
window.clearRides=function(){if(!confirm('确定清空所有？'))return;rides=[];localStorage.setItem(DB_KEY,JSON.stringify(rides));render();};

function render(){
var totalD=0,totalE=0,maxSpd=0;
rides.forEach(function(r){totalD+=r.distance;totalE+=r.elevation;if(r.speed>maxSpd)maxSpd=r.speed;});
var avgSpd=rides.length?(totalD/(rides.reduce(function(a,r){return a+r.duration;},0)/60)):0;

document.getElementById('totalDist').textContent=totalD.toFixed(1);
document.getElementById('avgSpeed').textContent=avgSpd.toFixed(1);
document.getElementById('maxSpeed').textContent=maxSpd.toFixed(1);
document.getElementById('totalElev').textContent=totalE;

var last10=rides.slice(-10);
var maxD=1;last10.forEach(function(r){if(r.distance>maxD)maxD=r.distance;});
var chartH=last10.map(function(r,i){
var h=Math.round(r.distance/maxD*100);
return '<div class="bar" style="height:'+Math.max(h,3)+'%"><div class="val">'+r.distance+'</div><div class="lbl">'+(i+1)+'</div></div>';
}).join('');
document.getElementById('distChart').innerHTML=chartH||'<div class="es" style="width:100%">暂无数据</div>';

var el=document.getElementById('rideList');
if(!rides.length){el.innerHTML='<div class="es">暂无记录</div>';return;}
el.innerHTML=rides.slice().reverse().map(function(r){
return '<div class="li"><div style="flex:1"><strong>'+r.distance+'km</strong> <span class="tag">'+r.terrain+'</span><br><span style="font-size:.8rem;color:var(--text2)">速度'+r.speed.toFixed(1)+'km/h · '+r.duration+'分钟 · 爬升'+r.elevation+'m · '+r.date+'</span></div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="delRide('+r.id+')">✕</button></div>';
}).join('');
}
document.getElementById('cDate').value=today();
render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
