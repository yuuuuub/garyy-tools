<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元素周期表 - 交互式化学元素周期表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#161b22}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}

/* Header */
.header{background:#161b22;border-bottom:1px solid #30363d;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.header h1{font-size:1.5rem;background:linear-gradient(135deg,#58a6ff,#bc8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.search-box{position:relative;flex:1;min-width:200px;max-width:360px}
.search-box input{width:100%;padding:8px 36px 8px 14px;border:1px solid #30363d;border-radius:20px;background:#0d1117;color:#c9d1d9;font-size:0.9rem;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:#58a6ff}
.search-box .clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#8b949e;cursor:pointer;font-size:1.1rem;display:none}
.search-box .clear-btn.visible{display:block}
.header-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.header-controls button{padding:7px 14px;border:1px solid #30363d;border-radius:18px;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:0.85rem;transition:all .2s;white-space:nowrap}
.header-controls button:hover{background:#30363d;border-color:#58a6ff}
.header-controls button.active{background:#1f6feb;border-color:#1f6feb;color:#fff}

/* Main layout */
.container{max-width:1400px;margin:0 auto;padding:16px}
.main-layout{display:flex;gap:16px}
.table-area{flex:1;min-width:0}
.detail-panel{width:340px;flex-shrink:0;background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto;display:none}
.detail-panel.show{display:block}
.detail-panel .close-panel{position:absolute;top:10px;right:12px;background:none;border:none;color:#8b949e;cursor:pointer;font-size:1.3rem}
.detail-panel h3{font-size:1.4rem;margin-bottom:4px}
.detail-panel .en-name{color:#8b949e;font-size:0.9rem;margin-bottom:12px}
.detail-panel .prop-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:0.85rem}
.detail-panel .prop-grid .prop-label{color:#8b949e}
.detail-panel .prop-grid .prop-value{color:#c9d1d9;font-weight:500}
.detail-panel .uses-section{margin-top:14px}
.detail-panel .uses-section h4{font-size:0.95rem;color:#58a6ff;margin-bottom:6px}
.detail-panel .uses-section p{font-size:0.85rem;line-height:1.6;color:#8b949e}

/* Temperature slider */
.temp-control{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#161b22;border:1px solid #30363d;border-radius:10px;margin-bottom:16px;flex-wrap:wrap}
.temp-control label{font-size:0.9rem;white-space:nowrap}
.temp-control input[type=range]{flex:1;min-width:120px;accent-color:#58a6ff}
.temp-control .temp-value{font-weight:600;min-width:60px;text-align:center;font-size:0.9rem}
.temp-legend{display:flex;gap:12px;font-size:0.78rem}
.temp-legend span{padding:2px 8px;border-radius:4px}
.temp-legend .solid{background:rgba(255,200,100,.25);color:#ffc864}
.temp-legend .liquid{background:rgba(100,180,255,.25);color:#64b4ff}
.temp-legend .gas{background:rgba(180,140,255,.25);color:#b48cff}

/* Grid table */
.table-wrapper{overflow-x:auto}
.periodic-grid{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;min-width:900px;padding-bottom:8px}
.periodic-grid .cell{background:#161b22;border:1px solid #21262d;border-radius:5px;padding:4px 3px;cursor:pointer;transition:all .15s;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.periodic-grid .cell:hover{transform:scale(1.08);z-index:10;border-color:#58a6ff;box-shadow:0 0 12px rgba(88,166,255,.3)}
.periodic-grid .cell.highlight{border-color:#f0c040!important;box-shadow:0 0 14px rgba(240,192,64,.4)!important;z-index:5}
.periodic-grid .cell.hidden{opacity:.15;pointer-events:none}
.periodic-grid .cell .num{font-size:0.6rem;color:#8b949e;line-height:1}
.periodic-grid .cell .sym{font-size:1rem;font-weight:700;line-height:1.2}
.periodic-grid .cell .zh{font-size:0.6rem;line-height:1.2}
.periodic-grid .cell .mass{font-size:0.55rem;color:#8b949e;line-height:1}
.periodic-grid .cell .state-dot{position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;opacity:.7}
.periodic-grid .empty-cell{background:transparent;border:none;pointer-events:none}
.periodic-grid .group-label{display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#484f58;font-weight:600}
.separator-row{height:8px}
.series-label{padding:4px 8px;font-size:0.75rem;color:#8b949e}

/* Category colors */
.cat-alkali-metal{background:#2d1a1a!important;border-color:#ff444488!important}.cat-alkali-metal .sym{color:#ff6b6b}
.cat-alkaline-earth{background:#2d2010!important;border-color:#ff880088!important}.cat-alkaline-earth .sym{color:#ffa64d}
.cat-transition-metal{background:#1a1a2d!important;border-color:#4488ff88!important}.cat-transition-metal .sym{color:#6badff}
.cat-post-transition{background:#1a2d1a!important;border-color:#44cc4488!important}.cat-post-transition .sym{color:#66dd66}
.cat-metalloid{background:#1a2d2d!important;border-color:#44cccc88!important}.cat-metalloid .sym{color:#66cccc}
.cat-nonmetal{background:#2d2d1a!important;border-color:#cccc4488!important}.cat-nonmetal .sym{color:#cccc44}
.cat-halogen{background:#1a1d2d!important;border-color:#8844ff88!important}.cat-halogen .sym{color:#aa77ff}
.cat-noble-gas{background:#2d1a2d!important;border-color:#cc44cc88!important}.cat-noble-gas .sym{color:#dd66dd}
.cat-lanthanide{background:#2d1a28!important;border-color:#ff44aa88!important}.cat-lanthanide .sym{color:#ff77bb}
.cat-actinide{background:#281a2d!important;border-color:#cc44aa88!important}.cat-actinide .sym{color:#dd77bb}

/* Legend */
.legend-section{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0}
.legend-item{display:flex;align-items:center;gap:5px;font-size:0.75rem;cursor:pointer;padding:3px 8px;border-radius:4px;border:1px solid transparent;transition:all .2s}
.legend-item:hover{border-color:#30363d}
.legend-item.active{border-color:#58a6ff!important;background:#1f6feb22!important}
.legend-swatch{width:14px;height:14px;border-radius:3px;flex-shrink:0}

/* Quiz */
.quiz-panel{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;margin-bottom:16px;display:none}
.quiz-panel.show{display:block}
.quiz-panel h3{font-size:1.2rem;margin-bottom:12px;color:#58a6ff}
.quiz-question{font-size:1.1rem;margin-bottom:10px}
.quiz-question .highlight-sym{font-size:2rem;font-weight:700;color:#ffa64d}
.quiz-input{display:flex;gap:8px;margin-bottom:8px}
.quiz-input input{padding:8px 12px;border:1px solid #30363d;border-radius:8px;background:#0d1117;color:#c9d1d9;font-size:1rem;flex:1;outline:none}
.quiz-input input:focus{border-color:#58a6ff}
.quiz-input button{padding:8px 16px;border:1px solid #30363d;border-radius:8px;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:0.9rem}
.quiz-input button:hover{background:#30363d}
.quiz-result{font-size:0.9rem;margin-top:6px;min-height:20px}
.quiz-result.correct{color:#3fb950}
.quiz-result.wrong{color:#f85149}
.quiz-score{font-size:0.85rem;color:#8b949e;margin-bottom:8px}

/* Responsive */
@media(max-width:1100px){
  .main-layout{flex-direction:column}
  .detail-panel{width:100%;position:static;max-height:none}
}

/* Tooltip for temp state */
.temp-legend{display:flex;gap:16px;font-size:0.78rem;align-items:center}
.temp-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
</style>
</head>
<body>
<div class="header">
  <h1>⚛ 元素周期表</h1>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索元素名称、符号或原子序数...">
    <button class="clear-btn" id="clearSearch">&times;</button>
  </div>
  <div class="header-controls">
    <button id="quizToggle">🧪 元素测验</button>
    <button id="resetTemp">🌡 重置温度</button>
  </div>
</div>

<div class="container">
  <!-- Quiz Panel -->
  <div class="quiz-panel" id="quizPanel">
    <h3>🧪 元素测验 - 猜猜这是什么元素？</h3>
    <div class="quiz-score" id="quizScore">得分: 0 / 0</div>
    <div class="quiz-question">
      这个元素的符号是：<span class="highlight-sym" id="quizSymbol">--</span>
      <br><span style="font-size:0.85rem;color:#8b949e">原子序数: <span id="quizNumber">--</span></span>
      <br><span style="font-size:0.85rem;color:#8b949e">类别: <span id="quizCategory">--</span></span>
    </div>
    <div class="quiz-input">
      <input type="text" id="quizAnswer" placeholder="输入元素的中文名称..." autocomplete="off">
      <button id="quizSubmit">提交</button>
      <button id="quizSkip">跳过</button>
    </div>
    <div class="quiz-result" id="quizResult"></div>
  </div>

  <!-- Temperature Control -->
  <div class="temp-control">
    <label for="tempSlider">🌡 温度</label>
    <input type="range" id="tempSlider" min="0" max="1200" value="25" step="1">
    <span class="temp-value" id="tempDisplay">25°C</span>
    <span class="temp-legend">
      <span class="solid"><span class="dot"></span>固态</span>
      <span class="liquid"><span class="dot"></span>液态</span>
      <span class="gas"><span class="dot"></span>气态</span>
    </span>
  </div>

  <!-- Legend -->
  <div class="legend-section" id="legend">
  </div>

  <!-- Main Layout -->
  <div class="main-layout">
    <div class="table-area">
      <div class="table-wrapper">
        <div class="periodic-grid" id="periodicGrid"></div>
      </div>
    </div>
    <div class="detail-panel" id="detailPanel">
      <button class="close-panel" id="closePanel">&times;</button>
      <h3 id="detailSymbol">--</h3>
      <div class="en-name" id="detailName">--</div>
      <div class="prop-grid" id="detailProps"></div>
      <div class="uses-section">
        <h4>主要用途</h4>
        <p id="detailUses">--</p>
      </div>
    </div>
  </div>
</div>

// Grid position map: atomic number -> {row, col}
function getElementPosition(n) {
  if (n <= 2) return {row:1, col:n===1?1:18};
  if (n <= 10) {
    const c = n - 2;
    return {row:2, col:c<=2?c:c+10};
  }
  if (n <= 18) {
    const c = n - 10;
    return {row:3, col:c<=2?c:c+10};
  }
  if (n <= 36) return {row:4, col:n-18};
  if (n <= 54) return {row:5, col:n-36};
  if (n <= 56) return {row:6, col:n-54};
  // n 57-71: Lanthanides
  if (n >= 57 && n <= 71) return {row:8, col:n-54}; // row 8 for lanthanides
  if (n <= 86) return {row:6, col:n-68};
  if (n <= 88) return {row:7, col:n-86};
  // n 89-103: Actinides
  if (n >= 89 && n <= 103) return {row:9, col:n-86}; // row 9 for actinides
  if (n <= 118) return {row:7, col:n-100};
  return {row:1, col:1};
}

// Get physical state at a given temperature in Celsius
function getStateAtTemp(el, tempC) {
  if (el.mp === null || el.bp === null) return "unknown";
  if (tempC < el.mp - 273.15) return "solid";
  if (tempC < el.bp - 273.15) return "liquid";
  return "gas";
}

// Render everything

function getElementByNumber(n) {
  return elements.find(e => e.n === n);
}

function renderLegend() {
  const legend = document.getElementById("legend");
  legend.innerHTML = categories.map(c =>
    `<div class="legend-item" data-cat="${c.key}" onclick="filterByCategory('${c.key}')" style="--cat-color:${c.color}">
      <div class="legend-swatch" style="background:${c.color}"></div>
      <span>${c.zh}</span>
    </div>`
  ).join('');
}

function renderTable() {
  const grid = document.getElementById("periodicGrid");
  let html = '';

  // Group labels row
  for (let col = 1; col <= 18; col++) {
    html += `<div class="group-label">${col}</div>`;
  }

  // Create all cell positions
  const maxRow = 9;
  const placed = new Set();

  for (let r = 1; r <= maxRow; r++) {
    for (let c = 1; c <= 18; c++) {
      // Find element at this position
      const el = elements.find(e => {
        const pos = getElementPosition(e.n);
        return pos.row === r && pos.col === c;
      });

      if (el) {
        placed.add(el.n);
        const state = getStateAtTemp(el, currentTemp);
        const stateColor = state === 'solid' ? '#ffc864' : state === 'liquid' ? '#64b4ff' : state === 'gas' ? '#b48cff' : '#8b949e';
        const hiddenClass = (activeCategoryFilter && el.cat !== activeCategoryFilter) ? ' hidden' : '';
        html += `<div class="cell cat-${el.cat}${hiddenClass}" data-n="${el.n}"
          onmouseenter="highlightGroup(${el.g})" onmouseleave="unhighlightGroup()"
          onclick="showDetail(${el.n})">
          <div class="num">${el.n}</div>
          <div class="sym">${el.s}</div>
          <div class="zh">${el.zh}</div>
          <div class="mass">${el.mass}</div>
          <div class="state-dot" style="background:${stateColor}" title="${state==='solid'?'固态':state==='liquid'?'液态':state==='gas'?'气态':'未知'}"></div>
        </div>`;
      } else {
        // Check if this is La/Ac placeholder in row 6 or 7
        if ((r === 6 && c === 3) || (r === 7 && c === 3)) {
          const label = r === 6 ? '57-71' : '89-103';
          html += `<div class="cell group-label" style="font-size:0.65rem;color:#6badff">${label}</div>`;
        } else {
          html += `<div class="empty-cell"></div>`;
        }
      }
    }
  }

  grid.innerHTML = html;
}

function highlightGroup(group) {
  highlightedGroup = group;
  document.querySelectorAll('.cell[data-n]').forEach(cell => {
    const n = parseInt(cell.dataset.n);
    const el = getElementByNumber(n);
    if (el && el.g === group) {
      cell.classList.add('highlight');
    }
  });
}

function unhighlightGroup() {
  highlightedGroup = null;
  document.querySelectorAll('.cell.highlight').forEach(cell => {
    cell.classList.remove('highlight');
  });
}

function showDetail(n) {
  const el = getElementByNumber(n);
  if (!el) return;

  selectedElement = el;
  const panel = document.getElementById("detailPanel");
  panel.classList.add("show");

  const cat = categories.find(c => c.key === el.cat);
  const catZh = cat ? cat.zh : el.cat;

  document.getElementById("detailSymbol").innerHTML = `<span style="color:${cat?cat.color:'#c9d1d9'}">${el.s}</span> - ${el.zh}`;
  document.getElementById("detailName").textContent = `${el.en} (${el.n})`;

  const state = getStateAtTemp(el, currentTemp);
  const stateText = state === 'solid' ? '固态' : state === 'liquid' ? '液态' : state === 'gas' ? '气态' : '未知';
  const densityStr = el.density !== null ? (typeof el.density === 'string' ? el.density : `${el.density} g/cm³`) : '未知';
  const mpStr = el.mp !== null ? `${el.mp.toFixed(1)} K (${(el.mp-273.15).toFixed(0)}°C)` : '未知';
  const bpStr = el.bp !== null ? `${el.bp.toFixed(1)} K (${(el.bp-273.15).toFixed(0)}°C)` : '未知';
  const egStr = el.en !== null ? (typeof el.en === 'string' ? el.en : el.en.toFixed(2)) : '—';

  document.getElementById("detailProps").innerHTML = `
    <div class="prop-label">原子序数</div><div class="prop-value">${el.n}</div>
    <div class="prop-label">原子量</div><div class="prop-value">${el.mass}</div>
    <div class="prop-label">类别</div><div class="prop-value" style="color:${cat?cat.color:'#c9d1d9'}">${catZh}</div>
    <div class="prop-label">族 / 周期</div><div class="prop-value">第${el.g}族 / 第${el.p}周期</div>
    <div class="prop-label">密度</div><div class="prop-value">${densityStr}</div>
    <div class="prop-label">熔点</div><div class="prop-value">${mpStr}</div>
    <div class="prop-label">沸点</div><div class="prop-value">${bpStr}</div>
    <div class="prop-label">电负性</div><div class="prop-value">${egStr}</div>
    <div class="prop-label">电子排布</div><div class="prop-value">${el.ec}</div>
    <div class="prop-label">当前温度下</div><div class="prop-value">${stateText} (${currentTemp}°C)</div>
    <div class="prop-label">发现年份</div><div class="prop-value">${el.year}</div>
    <div class="prop-label">发现者</div><div class="prop-value">${el.disc}</div>
  `;
  document.getElementById("detailUses").textContent = el.uses;

  // Highlight selected cell
  document.querySelectorAll('.cell[data-n]').forEach(c => c.style.boxShadow = '');
  const selCell = document.querySelector(`.cell[data-n="${n}"]`);
  if (selCell) {
    selCell.style.boxShadow = '0 0 16px rgba(88,166,255,.6)';
    selCell.scrollIntoView({behavior:'smooth',block:'center'});
  }
}

function filterByCategory(cat) {
  if (activeCategoryFilter === cat) {
    activeCategoryFilter = null;
  } else {
    activeCategoryFilter = cat;
  }

  // Update legend
  document.querySelectorAll('.legend-item').forEach(item => {
    if (item.dataset.cat === activeCategoryFilter) {
      item.classList.add('active');
    } else {
      item.classList.remove('active');
    }
  });

  // Toggle cell visibility
  document.querySelectorAll('.cell[data-n]').forEach(cell => {
    if (!activeCategoryFilter) {
      cell.classList.remove('hidden');
    } else {
      const n = parseInt(cell.dataset.n);
      const el = getElementByNumber(n);
      if (el && el.cat === activeCategoryFilter) {
        cell.classList.remove('hidden');
      } else {
        cell.classList.add('hidden');
      }
    }
  });
}

  tempSlider.value = 25;
  tempDisplay.textContent = "25°C";
  updateCellStates();
  if (selectedElement) showDetail(selectedElement.n);
});

function updateCellStates() {
  document.querySelectorAll('.cell[data-n]').forEach(cell => {
    const n = parseInt(cell.dataset.n);
    const el = getElementByNumber(n);
    if (!el) return;
    const state = getStateAtTemp(el, currentTemp);
    const stateColor = state === 'solid' ? '#ffc864' : state === 'liquid' ? '#64b4ff' : state === 'gas' ? '#b48cff' : '#8b949e';
    const dot = cell.querySelector('.state-dot');
    if (dot) {
      dot.style.background = stateColor;
      dot.title = state==='solid'?'固态':state==='liquid'?'液态':state==='gas'?'气态':'未知';
    }
  });
}

// Search
const searchInput = document.getElementById("searchInput");
const clearSearch = document.getElementById("clearSearch");

searchInput.addEventListener("input", () => {
  const query = searchInput.value.trim().toLowerCase();
  if (query) {
    clearSearch.classList.add("visible");
  } else {
    clearSearch.classList.remove("visible");
  }

  document.querySelectorAll('.cell[data-n]').forEach(cell => {
    const n = parseInt(cell.dataset.n);
    const el = getElementByNumber(n);
    if (!el) return;
    const match = !query ||
      el.zh.toLowerCase().includes(query) ||
      el.s.toLowerCase().includes(query) ||
      el.en.toLowerCase().includes(query) ||
      String(el.n).includes(query) ||
      el.cat.toLowerCase().includes(query);
    if (!match && !cell.classList.contains('hidden')) {
      cell.classList.add('hidden');
    } else if (match && cell.classList.contains('hidden') && (!activeCategoryFilter || el.cat === activeCategoryFilter)) {
      cell.classList.remove('hidden');
    } else if (match && !activeCategoryFilter) {
      cell.classList.remove('hidden');
    }
  });
});

clearSearch.addEventListener("click", () => {
  searchInput.value = "";
  clearSearch.classList.remove("visible");
  // Reset visibility based on category filter
  document.querySelectorAll('.cell[data-n]').forEach(cell => {
    const n = parseInt(cell.dataset.n);
    const el = getElementByNumber(n);
    if (!el) return;
    if (!activeCategoryFilter || el.cat === activeCategoryFilter) {
      cell.classList.remove('hidden');
    }
  });
});

// Close detail panel
document.getElementById("closePanel").addEventListener("click", () => {
  document.getElementById("detailPanel").classList.remove("show");
  selectedElement = null;
  document.querySelectorAll('.cell[data-n]').forEach(c => c.style.boxShadow = '');
});

// Quiz
let quizMode = false;
const quizToggle = document.getElementById("quizToggle");
const quizPanel = document.getElementById("quizPanel");
const quizSymbol = document.getElementById("quizSymbol");
const quizNumber = document.getElementById("quizNumber");
const quizCategory = document.getElementById("quizCategory");
const quizAnswer = document.getElementById("quizAnswer");
const quizSubmit = document.getElementById("quizSubmit");
const quizSkip = document.getElementById("quizSkip");
const quizResult = document.getElementById("quizResult");
const quizScoreDisplay = document.getElementById("quizScore");

function pickRandomElement() {
  const idx = Math.floor(Math.random() * elements.length);
  return elements[idx];
}

function newQuiz() {
  quizElement = pickRandomElement();
  quizSymbol.textContent = quizElement.s;
  quizNumber.textContent = quizElement.n;
  const cat = categories.find(c => c.key === quizElement.cat);
  quizCategory.textContent = cat ? cat.zh : quizElement.cat;
  quizAnswer.value = "";
  quizResult.textContent = "";
  quizResult.className = "quiz-result";
  quizAnswer.focus();
}

function updateQuizScore() {
  quizScoreDisplay.textContent = `得分: ${quizScore} / ${quizTotal}`;
}

quizToggle.addEventListener("click", () => {
  quizMode = !quizMode;
  if (quizMode) {
    quizPanel.classList.add("show");
    quizToggle.classList.add("active");
    quizToggle.textContent = "🧪 关闭测验";
    newQuiz();
  } else {
    quizPanel.classList.remove("show");
    quizToggle.classList.remove("active");
    quizToggle.textContent = "🧪 元素测验";
    quizScore = 0;
    quizTotal = 0;
    updateQuizScore();
  }
});

quizSubmit.addEventListener("click", () => {
  if (!quizElement) return;
  quizTotal++;
  const userAnswer = quizAnswer.value.trim();
  const correctAnswers = [quizElement.zh, quizElement.en.toLowerCase()];
  if (correctAnswers.includes(userAnswer.toLowerCase()) || userAnswer.toLowerCase() === quizElement.s.toLowerCase()) {
    quizScore++;
    quizResult.textContent = `✅ 正确！${quizElement.zh} (${quizElement.s})`;
    quizResult.className = "quiz-result correct";
  } else {
    quizResult.textContent = `❌ 错误！答案是：${quizElement.zh} (${quizElement.s})`;
    quizResult.className = "quiz-result wrong";
  }
  updateQuizScore();
  setTimeout(() => newQuiz(), 1500);
});

quizSkip.addEventListener("click", () => {
  if (!quizElement) return;
  quizTotal++;
  quizResult.textContent = `已跳过。答案是：${quizElement.zh} (${quizElement.s})`;
  quizResult.className = "quiz-result";
  updateQuizScore();
  setTimeout(() => newQuiz(), 1000);
});

quizAnswer.addEventListener("keydown", (e) => {
  if (e.key === "Enter") quizSubmit.click();
});

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    document.getElementById("detailPanel").classList.remove("show");
    selectedElement = null;
    document.querySelectorAll('.cell[data-n]').forEach(c => c.style.boxShadow = '');
    // Clear search
    searchInput.value = "";
    clearSearch.classList.remove("visible");
    activeCategoryFilter = null;
    document.querySelectorAll('.legend-item').forEach(item => item.classList.remove('active'));
    document.querySelectorAll('.cell[data-n]').forEach(cell => cell.classList.remove('hidden'));
  }
  if (e.key === "/" && document.activeElement !== searchInput && document.activeElement !== quizAnswer) {
    e.preventDefault();
    searchInput.focus();
  }
});

// Initial render
legend.innerHTML = ''; // Reset
renderLegend();
renderTable();

// Load legend after render
(function(){
  const legendEl = document.getElementById("legend");
  legendEl.innerHTML = categories.map(c =>
    `<div class="legend-item" data-cat="${c.key}" onclick="filterByCategory('${c.key}')" style="--cat-color:${c.color}">
      <div class="legend-swatch" style="background:${c.color}"></div>
      <span>${c.zh}</span>
    </div>`
  ).join('');
})();
</script>
</body>
