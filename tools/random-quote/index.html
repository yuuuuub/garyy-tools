<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16pxscroll-behavior:smooth;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;color:var(--text)}
.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.quote-card{margin-top:30px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:40px 32px;text-align:center}
.quote-mark{font-size:3.5rem;color:var(--border);line-height:.6;margin-bottom:10px;opacity:.5}
.quote-text{font-size:1.25rem;line-height:1.7;color:var(--text);margin-bottom:20px}
.quote-author{font-size:.9rem;color:var(--gold);font-weight:600}
.next-btn{display:block;margin:24px auto 0;padding:12px 32px;background:var(--blue);border:none;border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.9rem;transition:.2s}
.next-btn:hover{opacity:.9}
.filter-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.filter-btn{padding:6px 14px;background:var(--card);border:1px solid var(--border);border-radius:16px;color:var(--text2);cursor:pointer;font-size:.8rem;transition:.2s}
.filter-btn.active{background:var(--blue);color:var(--text);border-color:var(--blue)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>

var categories=['全部','古诗词','现代名言'];
var currentCat='全部';
function renderFilter(){
var html='';
categories.forEach(function(c){
html+='<button class="filter-btn'+(c===currentCat?' active':'')+'" onclick="filterQuote(\''+c+'\')">'+c+'</button>';
});
document.getElementById('filterBar').innerHTML=html;
}
window.filterQuote=function(cat){currentCat=cat;renderFilter();loadQuote();};
function loadQuote(){
var filtered=quotes.filter(function(q){return currentCat==='全部'||q.s===currentCat;});
var data=filtered[Math.floor(Math.random()*filtered.length)];
var html='<div class="quote-card">';
html+='<div class="quote-mark">"</div>';
html+='<div class="quote-text">'+data.t+'</div>';
html+='<div class="quote-author">— '+data.a+'</div>';
html+='</div>';
html+='<button class="next-btn" onclick="loadQuote()">🔄 换一个</button>';
document.getElementById('app').innerHTML=html;
}
