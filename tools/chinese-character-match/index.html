<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字配对</title><meta name="description" content="汉字配对 - 在线玩汉字配对游戏"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.match-area{display:flex;justify-content:space-between;gap:20px;margin:16px 0}.match-column{flex:1}.match-item{padding:16px;background:var(--bg);border:2px solid var(--border);border-radius:8px;margin-bottom:12px;cursor:pointer;transition:all .2s;text-align:center;font-size:1.2rem}.match-item:hover{border-color:var(--blue)}.match-item.selected{border-color:var(--green);background:rgba(35,134,54,.1)}.match-item.matched{border-color:var(--green);background:rgba(35,134,54,.2);pointer-events:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}.score-display{font-size:1.2rem;margin:16px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字配对"><meta property="og:description" content="汉字配对 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔗 汉字配对</h1><p class="sub">在线玩汉字配对游戏</p>
<div class="card">
<div class="btn-group">
<button class="btn" onclick="startMatch()">开始游戏</button>
<button class="btn" onclick="resetMatch()">重新开始</button>
</div>
<div class="score-display" id="scoreDisplay"></div>
</div>
<div id="result"></div>
<div class="card" id="historyCard" style="display:none">
<h3 style="margin-bottom:16px">游戏记录</h3>
<div id="history" style="padding:12px;background:var(--bg);border-radius:8px"></div>
</div></div>
<script src="../i18n.js" defer></script>
<script>
var characters=[
  {char:'一',pinyin:'yī',meaning:'一，第一'},
  {char:'二',pinyin:'èr',meaning:'二，第二'},
  {char:'三',pinyin:'sān',meaning:'三，第三'},
  {char:'四',pinyin:'sì',meaning:'四，第四'},
  {char:'五',pinyin:'wǔ',meaning:'五，第五'},
  {char:'六',pinyin:'liù',meaning:'六，第六'},
  {char:'七',pinyin:'qī',meaning:'七，第七'},
  {char:'八',pinyin:'bā',meaning:'八，第八'},
  {char:'九',pinyin:'jiǔ',meaning:'九，第九'},
  {char:'十',pinyin:'shí',meaning:'十，第十'},
  {char:'大',pinyin:'dà',meaning:'大的，巨大'},
  {char:'小',pinyin:'xiǎo',meaning:'小的，微小'},
  {char:'多',pinyin:'duō',meaning:'多的，很多'},
  {char:'少',pinyin:'shǎo',meaning:'少的，很少'},
  {char:'上',pinyin:'shàng',meaning:'上面，上方'},
  {char:'下',pinyin:'xià',meaning:'下面，下方'}
];
var leftItems=[];
var rightItems=[];
var selectedItem=null;
var matchedPairs=0;
var totalPairs=8;
var score=0;
var moves=0;
function startMatch(){
  var selectedCharacters=characters.slice(0,totalPairs);
  leftItems=selectedCharacters.map(function(char){
    return{type:'char',value:char.char,id:char.char};
  });
  rightItems=selectedCharacters.map(function(char){
    return{type:'pinyin',value:char.pinyin,id:char.char};
  });
  leftItems=shuffleArray(leftItems);
  rightItems=shuffleArray(rightItems);
  selectedItem=null;
  matchedPairs=0;
  score=0;
  moves=0;
  renderMatch();
}
function renderMatch(){
  var html='<div class="card">';
  html+='<div class="match-area">';
  html+='<div class="match-column">';
  html+='<h3 style="margin-bottom:12px">汉字</h3>';
  leftItems.forEach(function(item,index){
    var isMatched=matchedPairs>0&&leftItems.some(function(li){return li.id===item.id;})&&rightItems.some(function(ri){return ri.id===item.id;});
    html+='<div class="match-item '+(selectedItem&&selectedItem.index===index&&selectedItem.side==='left'?'selected':'')+(isMatched?' matched':'')+'" onclick="selectItem('+index+',\'left\')">'+item.value+'</div>';
  });
  html+='</div>';
  html+='<div class="match-column">';
  html+='<h3 style="margin-bottom:12px">拼音</h3>';
  rightItems.forEach(function(item,index){
    var isMatched=matchedPairs>0&&leftItems.some(function(li){return li.id===item.id;})&&rightItems.some(function(ri){return ri.id===item.id;});
    html+='<div class="match-item '+(selectedItem&&selectedItem.index===index&&selectedItem.side==='right'?'selected':'')+(isMatched?' matched':'')+'" onclick="selectItem('+index+',\'right\')">'+item.value+'</div>';
  });
  html+='</div></div></div>';
  document.getElementById('result').innerHTML=html;
  updateScore();
}
function selectItem(index,side){
  if(!selectedItem){
    selectedItem={index:index,side:side};
    renderMatch();
  }else{
    if(selectedItem.side===side){
      selectedItem={index:index,side:side};
      renderMatch();
    }else{
      moves++;
      var leftIndex=side==='left'?index:selectedItem.index;
      var rightIndex=side==='right'?index:selectedItem.index;
      var leftItem=leftItems[leftIndex];
      var rightItem=rightItems[rightIndex];
      if(leftItem.id===rightItem.id){
        matchedPairs++;
        score+=100;
        selectedItem=null;
        renderMatch();
        if(matchedPairs===totalPairs){
          setTimeout(function(){
            alert('🎉 恭喜完成！得分：'+score+'分，步数：'+moves+'步');
            updateHistory();
          },300);
        }
      }else{
        selectedItem=null;
        renderMatch();
      }
    }
  }
}
function resetMatch(){
  startMatch();
}
function updateScore(){
  document.getElementById('scoreDisplay').innerHTML='得分：'+score+'分 | 已配对：'+matchedPairs+'/'+totalPairs+' | 步数：'+moves+'步';
}
function updateHistory(){
  document.getElementById('historyCard').style.display='block';
  var html='<div style="padding:8px;background:rgba(35,134,54,.1);border-radius:4px">';
  html+='<strong>完成游戏</strong> | 得分：'+score+'分 | 步数：'+moves+'步';
  html+='</div>';
  document.getElementById('history').innerHTML=html;
}
function shuffleArray(array){
  for(var i=array.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var temp=array[i];
    array[i]=array[j];
    array[j]=temp;
  }
  return array;
}
startMatch();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
