<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📏 音程训练</title>
<meta property="og:title" content="📏 音程训练">
<meta property="og:description" content="📏 音程训练 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线音程训练工具，听辨和识别各种音程关系">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📏</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tab-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;font-weight:600}
.tab-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.play-area{text-align:center;padding:16px}
.play-big{width:72px;height:72px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:24px;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(99,102,241,.4)}
.play-big:hover{transform:scale(1.05)}
.play-big:active{transform:scale(0.95)}
.interval-visual{display:flex;align-items:center;justify-content:center;gap:20px;margin:16px 0}
.iv-note{width:50px;height:50px;border-radius:50%;background:var(--tag-bg);color:var(--tag-text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;transition:all .3s}
.iv-note.playing{background:var(--accent);color:#fff;transform:scale(1.1)}
.iv-arrow{font-size:20px;color:var(--text-secondary)}
.iv-semitones{font-size:13px;color:var(--text-secondary);text-align:center;margin-top:4px}
.options-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.opt-btn{padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;text-align:center}
.opt-btn:hover{border-color:var(--accent)}
.opt-btn.correct{background:var(--green);color:#fff;border-color:var(--green)}
.opt-btn.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.opt-btn:disabled{opacity:.6;cursor:not-allowed}
.ref-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.ref-table th,.ref-table td{padding:6px 8px;border:1px solid var(--border);text-align:center}
.ref-table th{background:var(--tag-bg);color:var(--tag-text);font-weight:600}
.ref-table tr:hover{background:var(--preview-bg)}
.score-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);margin-top:12px}
.footer{text-align:center;padding:20px 0;font-size:12px;color:var(--text-secondary)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📏 音程训练</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">🎯 训练模式</div>
<div class="tab-bar" id="modeTabs"></div>
</div>
<div class="card">
<div class="card-title">🔊 播放音程</div>
<div class="play-area">
<button class="play-big" onclick="playCurrentInterval()">▶</button>
<div class="interval-visual">
<div class="iv-note" id="ivNote1">C</div>
<div class="iv-arrow">→</div>
<div class="iv-note" id="ivNote2">E</div>
</div>
<div class="iv-semitones" id="ivInfo">点击播放，听辨音程</div>
<div class="options-grid" id="optsGrid"></div>
</div>
<div class="score-row">
<span>得分: <b id="score">0</b>/<b id="total">0</b></span>
<span id="feedback"></span>
</div>
</div>
<div class="card">
<div class="card-title">📖 音程参考表</div>
<table class="ref-table">
<tr><th>音程</th><th>半音</th><th>示例</th><th>色彩</th></tr>
<tr><td>纯一度</td><td>0</td><td>C-C</td><td>同音</td></tr>
<tr><td>小二度</td><td>1</td><td>E-F</td><td>紧张</td></tr>
<tr><td>大二度</td><td>2</td><td>C-D</td><td>明亮</td></tr>
<tr><td>小三度</td><td>3</td><td>D-F</td><td>忧伤</td></tr>
<tr><td>大三度</td><td>4</td><td>C-E</td><td>明亮</td></tr>
<tr><td>纯四度</td><td>5</td><td>C-F</td><td>开阔</td></tr>
<tr><td>三全音</td><td>6</td><td>C-F#</td><td>不安</td></tr>
<tr><td>纯五度</td><td>7</td><td>C-G</td><td>空旷</td></tr>
<tr><td>小六度</td><td>8</td><td>E-C</td><td>柔和</td></tr>
<tr><td>大六度</td><td>9</td><td>C-A</td><td>温暖</td></tr>
<tr><td>小七度</td><td>10</td><td>D-C</td><td>蓝调</td></tr>
<tr><td>大七度</td><td>11</td><td>C-B</td><td>尖锐</td></tr>
<tr><td>纯八度</td><td>12</td><td>C-C'</td><td>融合</td></tr>
</table>
</div>
<div class="footer">音程训练 - Web Audio API | 建议戴耳机</div>
</div>
<script>
let audioCtx,currentMode=0,score=0,total=0;
let currentInterval={},answered=false;
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const INTERVALS=[
{name:'纯一度',semitones:0,color:'同音共鸣'},
{name:'小二度',semitones:1,color:'紧张不安'},
{name:'大二度',semitones:2,color:'明亮坚定'},
{name:'小三度',semitones:3,color:'忧伤柔美'},
{name:'大三度',semitones:4,color:'明亮温暖'},
{name:'纯四度',semitones:5,color:'庄严开阔'},
{name:'三全音',semitones:6,color:'神秘不安'},
{name:'纯五度',semitones:7,color:'空旷有力'},
{name:'小六度',semitones:8,color:'柔和忧郁'},
{name:'大六度',semitones:9,color:'温暖甜美'},
{name:'小七度',semitones:10,color:'蓝调慵懒'},
{name:'大七度',semitones:11,color:'尖锐梦幻'},
{name:'纯八度',semitones:12,color:'完美融合'}
];
const MODES=[
{name:'🎯 听音辨认',desc:'听两个音，选择音程名称'},
{name:'📝 识别练习',desc:'看音程名称，播放并确认'},
{name:'🎲 随机挑战',desc:'随机音程，快速反应'}
];
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playFreq(freq,delay=0,dur=0.6){initAudio();const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;g.gain.setValueAtTime(0.3,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+delay+dur);osc.connect(g);g.connect(audioCtx.destination);osc.start(audioCtx.currentTime+delay);osc.stop(audioCtx.currentTime+delay+dur)}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildModeTabs(){document.getElementById('modeTabs').innerHTML=MODES.map((m,i)=>`<button class="tab-btn${i===currentMode?' active':''}" onclick="selectMode(${i})">${m.name}</button>`).join('')}
function selectMode(i){currentMode=i;buildModeTabs();generateQuestion()}
function generateQuestion(){answered=false;const root=Math.floor(Math.random()*12);const interval=INTERVALS[Math.floor(Math.random()*INTERVALS.length)];const topNote=(root+interval.semitones)%12;currentInterval={root,topNote,semitones:interval.semitones,name:interval.name};document.getElementById('ivNote1').textContent=NOTES[root];document.getElementById('ivNote2').textContent=NOTES[topNote];document.getElementById('ivNote1').classList.remove('playing');document.getElementById('ivNote2').classList.remove('playing');document.getElementById('ivInfo').textContent='点击播放，听辨音程';const opts=shuffle([interval.name,...INTERVALS.filter(i=>i.name!==interval.name).sort(()=>Math.random()-.5).slice(0,5).map(i=>i.name)]);document.getElementById('optsGrid').innerHTML=opts.map(o=>`<button class="opt-btn" onclick="checkAnswer(this,'${o}')">${o}</button>`).join('')}
function playCurrentInterval(){if(!currentInterval.root&&currentInterval.root!==0)return;const rootFreq=440*Math.pow(2,(currentInterval.root+60-69)/12);const topFreq=440*Math.pow(2,(currentInterval.topNote+60-69)/12);document.getElementById('ivNote1').classList.add('playing');playFreq(rootFreq,0,0.6);setTimeout(()=>{document.getElementById('ivNote1').classList.remove('playing');document.getElementById('ivNote2').classList.add('playing');playFreq(topFreq,0,0.6);setTimeout(()=>document.getElementById('ivNote2').classList.remove('playing'),600)},700)}
function checkAnswer(btn,name){if(answered)return;answered=true;total++;const correct=name===currentInterval.name;if(correct){score++;btn.classList.add('correct');document.getElementById('feedback').textContent='✅ 正确! '+currentInterval.color;document.getElementById('feedback').style.color='var(--green)';const iv=INTERVALS.find(i=>i.name===currentInterval.name);document.getElementById('ivInfo').textContent=`${currentInterval.name} (${currentInterval.semitones}半音) - ${iv.color}`}else{btn.classList.add('wrong');document.getElementById('feedback').textContent='❌ 答案: '+currentInterval.name;document.getElementById('feedback').style.color='var(--red)';document.querySelectorAll('.opt-btn').forEach(b=>{if(b.textContent===currentInterval.name)b.classList.add('correct')})}document.querySelectorAll('.opt-btn').forEach(b=>b.style.pointerEvents='none');document.getElementById('score').textContent=score;document.getElementById('total').textContent=total;setTimeout(generateQuestion,1800)}
buildModeTabs();generateQuestion();
</script>
</body>
</html>
