<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国节日习俗大全</title><meta name="description" content="中国节日习俗大全 - 传统节日风俗文化百科"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}.btn-primary{background:var(--blue);color:#fff}.btn-secondary{background:var(--border);color:var(--text)}.hidden{display:none}.cat-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}.cat-tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s}.cat-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.region-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.region-tab{padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.75rem;transition:all .2s}.region-tab.active{background:var(--green);color:#fff;border-color:var(--green)}.tradition-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .2s}.tradition-card:hover{border-color:var(--blue)}.tradition-header{display:flex;justify-content:space-between;align-items:flex-start}.tradition-icon{font-size:1.5rem;margin-right:10px}.tradition-info{flex:1}.tradition-name{font-size:1rem;font-weight:600}.tradition-festival{font-size:.8rem;color:var(--blue)}.tradition-desc{font-size:.85rem;color:var(--text2);margin-top:6px;line-height:1.5}.tradition-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.85rem;line-height:1.7;display:none}.tradition-detail.show{display:block}.tradition-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.tradition-tag{padding:2px 8px;border-radius:10px;font-size:.7rem;background:rgba(59,130,246,.1);color:var(--blue)}.region-tag{background:rgba(35,134,54,.1);color:var(--green)}.calendar-month{margin-bottom:16px}.calendar-month h3{font-size:1rem;margin-bottom:8px;padding:8px 0;border-bottom:1px solid var(--border)}.calendar-item{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.85rem;border-bottom:1px solid rgba(48,54,61,.5)}.calendar-item:last-child{border:none}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}</style><meta property="og:title" content="中国节日习俗大全"><meta property="og:description" content="中国节日习俗大全 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎊</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎊 中国节日习俗大全</h1><p class="sub">传统节日风俗文化百科</p>
<div id="viewTabs" style="display:flex;gap:8px;margin-bottom:16px"><button class="btn btn-primary" onclick="showView('list')" id="viewList">📜 习俗列表</button><button class="btn btn-secondary" onclick="showView('calendar')" id="viewCal">📅 习俗日历</button><button class="btn btn-secondary" onclick="showView('region')" id="viewRegion">🗺️ 地域分布</button></div>
<div id="listView">
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索习俗..." oninput="filterTraditions()"></div>
<div class="cat-tabs" id="catTabs"><span class="cat-tab active" onclick="selectCat(this,'all')">全部</span><span class="cat-tab" onclick="selectCat(this,'祭祀')">🙏 祭祀</span><span class="cat-tab" onclick="selectCat(this,'饮食')">🍽️ 饮食</span><span class="cat-tab" onclick="selectCat(this,'娱乐')">🎮 娱乐</span><span class="cat-tab" onclick="selectCat(this,'装饰')">🎨 装饰</span><span class="cat-tab" onclick="selectCat(this,'社交')">👥 社交</span></div>
<div id="traditionList"></div></div>
<div id="calendarView" class="hidden"></div>
<div id="regionView" class="hidden"></div></div>
<script src="../i18n.js" defer></script>
<script>
var traditions=[
{name:'贴春联',icon:'📝',festival:'春节',cat:'装饰',desc:'在门框上贴红纸对联，表达对新年的美好祝愿',detail:'春联源于古代的"桃符"，五代后蜀开始在桃木板上题写吉祥语。明代朱元璋大力推广贴春联，从此成为春节最重要的装饰习俗。春联内容多为祈福纳祥、辞旧迎新。贴春联有讲究：上联贴右，下联贴左，横批从左到右。',regions:['全国'],symbolism:'红色辟邪，对联祈福'},
{name:'放鞭炮',icon:'🧨',festival:'春节',cat:'娱乐',desc:'燃放爆竹烟花，驱邪迎新，营造节日气氛',detail:'放鞭炮的习俗源于先秦时期的"庭燎"和"爆祭"。传说"年"兽怕红色和响声，人们用爆竹驱赶。汉代用真竹子投入火中发出爆裂声，唐宋以后改用火药制作鞭炮。现代城市出于环保和安全考虑，很多地方已禁止燃放。',regions:['全国（部分城市禁放）'],symbolism:'驱邪辟灾，辞旧迎新'},
{name:'拜年',icon:'🙏',festival:'春节',cat:'社交',desc:'正月初一至十五走亲访友，互致新年祝福',detail:'拜年是春节期间最重要的社交活动。传统拜年顺序：初一拜本家，初二拜岳家，初三拜姑母。晚辈向长辈磕头或鞠躬，长辈给晚辈压岁钱。现代拜年增加了电话、短信、微信拜年等方式。',regions:['全国'],symbolism:'增进感情，传递祝福'},
{name:'吃年夜饭',icon:'🍽️',festival:'除夕',cat:'饮食',desc:'除夕全家团聚吃丰盛晚餐，是一年中最重要的一顿饭',detail:'年夜饭又称"团圆饭"，是除夕最重要的习俗。北方必有饺子（形如元宝），南方必有鱼（年年有余），还有年糕（年年高升）、鸡（大吉大利）等寓意菜。全家围坐，边吃边看春晚，守岁到新年。',regions:['全国'],symbolism:'团圆美满，辞旧迎新'},
{name:'守岁',icon:'⏰',festival:'除夕',cat:'娱乐',desc:'除夕夜全家围坐不睡，等待新年钟声',detail:'守岁又称"熬年"，从除夕夜到新年天亮不睡觉。古代守岁有两层含义：对老人是"辞旧岁"，珍惜时光；对年轻人是为父母延年益寿。现代守岁主要看春晚、聊天、打牌。',regions:['全国'],symbolism:'珍惜光阴，祈福长寿'},
{name:'吃元宵/汤圆',icon:'🥣',festival:'元宵节',cat:'饮食',desc:'正月十五吃元宵或汤圆，象征团圆美满',detail:'元宵和汤圆做法不同：元宵是"摇"出来的，馅料切成小块在糯米粉中滚动；汤圆是"包"出来的，像包饺子一样。北方叫元宵，南方叫汤圆。馅料有黑芝麻、花生、豆沙等多种。',regions:['全国（南北叫法不同）'],symbolism:'团团圆圆，和和美美'},
{name:'赏花灯',icon:'🏮',festival:'元宵节',cat:'娱乐',desc:'正月十五赏花灯，各式花灯争奇斗艳',detail:'元宵赏灯起源于汉代，到唐宋达到鼎盛。花灯种类繁多：宫灯、纱灯、走马灯、莲花灯、兔子灯等。现代灯会更加丰富多彩，加入了声光电等现代技术。著名的灯会有：南京秦淮灯会、自贡灯会、上海豫园灯会等。',regions:['全国'],symbolism:'光明美好，前途光明'},
{name:'猜灯谜',icon:'🧩',festival:'元宵节',cat:'娱乐',desc:'将谜语写在花灯上供人猜射',detail:'灯谜始于宋代，当时称"隐语"或"灯虎"。将谜面贴在花灯上，猜中者可获得奖品。灯谜类型有：会意法、拆字法、谐音法等。现代元宵节的猜灯谜活动依然是最受欢迎的节日娱乐之一。',regions:['全国'],symbolism:'启迪智慧，增添乐趣'},
{name:'赛龙舟',icon:'🐲',festival:'端午节',cat:'娱乐',desc:'多人划龙舟竞渡，纪念屈原的水上运动',detail:'赛龙舟相传是楚国百姓划船寻找屈原遗体的演变。龙舟狭长，船头雕有龙头，船尾有龙尾。比赛时鼓手在船头击鼓，划手跟随鼓点整齐划桨。现代龙舟赛已发展为国际性体育赛事。',regions:['南方为主'],symbolism:'团结协作，奋勇争先'},
{name:'吃粽子',icon:'🫔',festival:'端午节',cat:'饮食',desc:'用竹叶包裹糯米蒸制的食品',detail:'粽子是端午节最重要的食品。北方多甜粽（红枣、豆沙），南方多咸粽（鲜肉、蛋黄）。粽子的包法各地不同：三角粽、四角粽、枕头粽等。2009年中国端午节入选联合国非遗名录。',regions:['全国（南北口味不同）'],symbolism:'纪念屈原，驱邪祈福'},
{name:'挂艾草',icon:'🌿',festival:'端午节',cat:'装饰',desc:'在门上悬挂艾草和菖蒲，驱邪避瘟',detail:'艾草和菖蒲都有特殊香气，古人认为可以驱邪避瘟、防蚊虫。端午时节正值仲夏，蚊虫增多，挂艾草也有实际的卫生作用。有些地方还将艾草编成虎形挂在门上，称为"艾虎"。',regions:['全国'],symbolism:'驱邪避瘟，祈求安康'},
{name:'赏月',icon:'🌕',festival:'中秋节',cat:'娱乐',desc:'中秋夜全家赏月，品尝月饼',detail:'中秋赏月始于唐代，到宋代成为全民活动。赏月时摆放月饼、柚子、桂花酒等。著名的赏月地有：杭州西湖三潭印月、南京莫愁湖、苏州石湖等。现代人也会通过网络直播"云赏月"。',regions:['全国'],symbolism:'花好月圆，阖家团圆'},
{name:'吃月饼',icon:'🥮',festival:'中秋节',cat:'饮食',desc:'中秋节必备食品，种类丰富口味各异',detail:'月饼种类繁多：广式月饼（皮薄馅多）、苏式月饼（酥皮）、京式月饼（自来红）、潮式月饼（朥饼）等。馅料有五仁、豆沙、蛋黄莲蓉、鲜肉等。月饼圆形象征团圆，是中秋节最重要的象征物。',regions:['全国'],symbolism:'团圆美满，思念故乡'},
{name:'登高',icon:'⛰️',festival:'重阳节',cat:'娱乐',desc:'重阳节登高望远，锻炼身体祈福',detail:'重阳登高的习俗与东汉桓景避灾的传说有关。九月九日，桓景听从仙人费长房的指点，携家人登高避灾，佩戴茱萸，饮菊花酒，果然平安。后来重阳登高成为全民习俗，也是敬老爱老的重要日子。',regions:['全国'],symbolism:'步步高升，健康长寿'},
{name:'插茱萸',icon:'🌿',festival:'重阳节',cat:'装饰',desc:'重阳节佩戴茱萸，辟邪祈福',detail:'茱萸是一种有浓烈香气的植物，古人认为可以辟邪消灾。重阳节时人们将茱萸插在头上或佩戴在身上。王维名句"遍插茱萸少一人"就描写了这一习俗。茱萸还有药用价值，可以温中、止痛、杀虫。',regions:['全国'],symbolism:'辟邪消灾，祈求平安'},
{name:'扫墓祭祖',icon:'🪦',festival:'清明节',cat:'祭祀',desc:'清明节祭扫先人墓地，表达思念',detail:'清明扫墓是最重要的祭祀活动。传统习俗包括：上坟除草、添土、烧纸钱、摆供品、磕头。现代增加了献花、鞠躬等文明祭祀方式。清明节也是爱国主义教育的重要时机，人们会祭扫烈士陵园。',regions:['全国'],symbolism:'慎终追远，感恩先人'},
{name:'踏青',icon:'🌸',festival:'清明节',cat:'娱乐',desc:'清明时节春暖花开，外出郊游赏景',detail:'清明踏青又叫"春游"或"探春"。清明前后，万物复苏，正是外出赏花踏青的好时节。踏青时还可以放风筝、荡秋千、蹴鞠等。古人踏青时还会采野花、折柳枝，享受春天的美好。',regions:['全国'],symbolism:'亲近自然，感受春天'},
{name:'喝腊八粥',icon:'🥣',festival:'腊八节',cat:'饮食',desc:'腊月初八喝腊八粥，拉开春节序幕',detail:'腊八粥用多种谷物和干果熬制：大米、红豆、绿豆、花生、红枣、桂圆、莲子、百合等。传说与佛教有关，释迦牟尼在腊月初八悟道成佛。喝腊八粥寓意五谷丰登、温暖祥和。',regions:['全国'],symbolism:'五谷丰登，祈求丰收'},
{name:'祭灶神',icon:'🔥',festival:'小年',cat:'祭祀',desc:'腊月二十三祭灶王爷，送灶王上天',detail:'小年（腊月二十三或二十四）要祭灶神。人们在灶台摆上糖瓜、关东糖等甜食，让灶王爷"嘴甜"，上天多说好话。有的地方还用糖涂在灶王爷嘴上，寓意"上天言好事，下界保平安"。',regions:['全国（南北日期不同）'],symbolism:'祈求灶神保佑'},
{name:'舞龙舞狮',icon:'🐉',festival:'春节',cat:'娱乐',desc:'春节期间的民间表演，祈求风调雨顺',detail:'舞龙起源于汉代的"鱼龙曼衍"之戏。龙是中华民族的图腾，舞龙寓意祈求风调雨顺、五谷丰登。舞狮分南狮和北狮：南狮造型威猛，动作夸张；北狮形象逼真，动作细腻。舞龙舞狮是春节和庆典的重要表演项目。',regions:['全国'],symbolism:'祈求吉祥，驱邪纳福'}
];

var currentCat='all',currentView='list';

function showView(view){
  currentView=view;
  document.getElementById('listView').classList.toggle('hidden',view!=='list');
  document.getElementById('calendarView').classList.toggle('hidden',view!=='calendar');
  document.getElementById('regionView').classList.toggle('hidden',view!=='region');
  document.getElementById('viewList').className=view==='list'?'btn btn-primary':'btn btn-secondary';
  document.getElementById('viewCal').className=view==='calendar'?'btn btn-primary':'btn btn-secondary';
  document.getElementById('viewRegion').className=view==='region'?'btn btn-primary':'btn btn-secondary';
  if(view==='calendar')renderCalendar();
  if(view==='region')renderRegion();
}

function selectCat(el,cat){
  document.querySelectorAll('.cat-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');currentCat=cat;filterTraditions();
}

function filterTraditions(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=traditions.filter(function(t){
    if(currentCat!=='all'&&t.cat!==currentCat)return false;
    if(search&&!t.name.toLowerCase().includes(search)&&!t.desc.toLowerCase().includes(search))return false;
    return true;
  });
  renderTraditions(filtered);
}

function renderTraditions(items){
  var h='';
  items.forEach(function(t,i){
    h+='<div class="tradition-card" onclick="toggleDetail('+traditions.indexOf(t)+')">';
    h+='<div class="tradition-header"><div style="display:flex;align-items:flex-start"><span class="tradition-icon">'+t.icon+'</span><div class="tradition-info">';
    h+='<div class="tradition-name">'+t.name+'</div><div class="tradition-festival">'+t.festival+' · '+t.cat+'</div></div></div></div>';
    h+='<div class="tradition-desc">'+t.desc+'</div>';
    h+='<div class="tradition-detail" id="td-'+traditions.indexOf(t)+'">';
    h+='<p>'+t.detail+'</p>';
    h+='<p style="margin-top:8px;color:var(--blue)">✨ 寓意: '+t.symbolism+'</p>';
    h+='<div class="tradition-tags">'+t.regions.map(function(r){return '<span class="tradition-tag region-tag">'+r+'</span>'}).join('')+'</div></div>';
    h+='<div class="tradition-tags">'+t.regions.map(function(r){return '<span class="tradition-tag region-tag">'+r+'</span>'}).join('')+'<span class="tradition-tag">'+t.cat+'</span></div>';
    h+='</div>';
  });
  document.getElementById('traditionList').innerHTML=h||'<div class="card" style="text-align:center;color:var(--text2)">没有找到匹配的习俗</div>';
}

function toggleDetail(idx){
  var el=document.getElementById('td-'+idx);
  if(el)el.classList.toggle('show');
}

function renderCalendar(){
  var months=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  var monthTraditions={};
  var festivalMonth={'除夕':1,'春节':1,'小年':12,'元宵节':1,'龙抬头':2,'清明节':4,'端午节':5,'七夕节':7,'中元节':7,'中秋节':8,'重阳节':9,'腊八节':12};
  traditions.forEach(function(t){
    var m=festivalMonth[t.festival];
    if(m){if(!monthTraditions[m])monthTraditions[m]=[];monthTraditions[m].push(t)}
  });
  var h='';
  months.forEach(function(m,i){
    var idx=i+1;
    if(monthTraditions[idx]){
      h+='<div class="calendar-month"><h3>📅 '+m+'</h3>';
      monthTraditions[idx].forEach(function(t){
        h+='<div class="calendar-item"><span>'+t.icon+'</span><span style="font-weight:600">'+t.name+'</span><span style="color:var(--text2)"> - '+t.festival+'</span></div>';
      });
      h+='</div>';
    }
  });
  document.getElementById('calendarView').innerHTML=h;
}

function renderRegion(){
  var regions=['全国','北方','南方','东部','西部'];
  var regionData={};
  traditions.forEach(function(t){
    t.regions.forEach(function(r){
      if(!regionData[r])regionData[r]=[];
      regionData[r].push(t);
    });
  });
  var h='<div class="region-tabs">';
  regions.forEach(function(r,i){h+='<span class="region-tab'+(i===0?' active':'')+'" onclick="filterRegion(this,\''+r+'\')">'+r+'</span>'});
  h+='</div><div id="regionList">';
  var r=regions[0];
  (regionData[r]||[]).forEach(function(t){
    h+='<div class="tradition-card"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:1.5rem">'+t.icon+'</span><div><div style="font-weight:600">'+t.name+'</div><div style="font-size:.8rem;color:var(--blue)">'+t.festival+'</div></div></div></div>';
  });
  h+='</div>';
  document.getElementById('regionView').innerHTML=h;
}

function filterRegion(el,r){
  document.querySelectorAll('.region-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  var regionData={};
  traditions.forEach(function(t){t.regions.forEach(function(rg){if(!regionData[rg])regionData[rg]=[];regionData[rg].push(t)})});
  var h='';
  (regionData[r]||regionData['全国']||[]).forEach(function(t){
    h+='<div class="tradition-card"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:1.5rem">'+t.icon+'</span><div><div style="font-weight:600">'+t.name+'</div><div style="font-size:.8rem;color:var(--blue)">'+t.festival+'</div></div></div></div>';
  });
  document.getElementById('regionList').innerHTML=h||'<div class="card" style="text-align:center;color:var(--text2)">暂无数据</div>';
}

filterTraditions();
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input');if(inp)inp.focus()}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur()}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
