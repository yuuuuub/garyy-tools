<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国武术训练指南 - Chinese Martial Arts Training</title>
<meta name="description" content="中国武术训练指南，涵盖基本功、套路、器械、对练等系统训练方法">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国武术训练指南 - Chinese Martial Arts Training">
<meta property="og:description" content="中国武术训练指南，涵盖基本功、套路、器械、对练等系统训练方法">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-martial-arts-training-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💪</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a05 0%,#2a1510 50%,#3d2015 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a,#b06a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.training-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px}
.training-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.training-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.training-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.training-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.training-card .t-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(232,168,124,0.15);color:var(--accent)}
.training-card .t-name{font-size:1.3em;font-weight:bold}
.training-card .t-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.training-card .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.training-card .t-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.training-card .t-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.training-card .t-detail strong{color:var(--text)}
.training-card .t-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.training-card .t-items span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.training-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.training-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>💪 中国武术训练指南</h1>
<p>Chinese Martial Arts Training — 系统化的武术训练方法与进阶之路</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索训练内容或方法...">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部内容</button>
<button class="filter-btn" data-filter="基本功">🏋️ 基本功</button>
<button class="filter-btn" data-filter="套路训练">🥋 套路训练</button>
<button class="filter-btn" data-filter="器械训练">⚔️ 器械训练</button>
<button class="filter-btn" data-filter="对练训练">🤝 对练训练</button>
<button class="filter-btn" data-filter="内功修炼">🧘 内功修炼</button>
<button class="filter-btn" data-filter="体能训练">🏃 体能训练</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="training-grid" id="trainingGrid"></div>
<footer><p>💪 中国武术训练指南 — 冬练三九，夏练三伏</p></footer>
</div>
<script>
const TRAINING_DATA=[
  {id:1,name:"桩功训练",en:"Stance Training",category:"基本功",icon:"🧍",difficulty:"初学者",duration:"30分钟/天",description:"桩功是武术训练的基础，通过静态站立培养内劲和稳定性。站桩能增强腿部力量，培养正确的身体结构。",keyPoints:["身体中正","呼吸自然","意念集中","放松入静"],items:["马步桩","弓步桩","虚步桩","仆步桩","歇步桩","三体式","混元桩","浑圆桩"],tips:"初学者从5分钟开始，逐渐增加到30分钟"},
  {id:2,name:"腿法训练",en:"Leg Technique Training",category:"基本功",icon:"🦵",difficulty:"初学者",duration:"40分钟/天",description:"腿法是武术的重要组成部分，'手是两扇门，全靠腿打人'。腿法训练包括压腿、踢腿、控腿等。",keyPoints:["循序渐进","热身充分","拉伸到位","力量与柔韧并重"],items:["正压腿","侧压腿","后压腿","正踢腿","侧踢腿","外摆腿","里合腿","控腿"],tips:"压腿要循序渐进，避免拉伤"},
  {id:3,name:"腰功训练",en:"Waist Training",category:"基本功",icon:"🔄",difficulty:"初学者",duration:"20分钟/天",description:"腰是武术运动的枢纽，'练拳不练腰，终究艺不高'。腰功训练包括拧腰、涮腰、甩腰等。",keyPoints:["以腰为轴","灵活转动","力从腰发","腰马合一"],items:["拧腰","涮腰","甩腰","下腰","弹腰","折腰","翻身","旋转"],tips:"腰部训练要充分热身，避免受伤"},
  {id:4,name:"拳法套路",en:"Fist Form Training",category:"套路训练",icon:"🥊",difficulty:"中级",duration:"60分钟/天",description:"拳法套路是武术训练的核心内容，通过练习套路掌握攻防技法，培养武术意识。",keyPoints:["动作规范","节奏分明","攻防含义清楚","精神饱满"],items:["长拳","南拳","太极拳","形意拳","八卦掌","咏春拳","洪拳","翻子拳"],tips:"套路练习要注重攻防含义，不能只追求好看"},
  {id:5,name:"器械套路",en:"Weapon Form Training",category:"器械训练",icon:"⚔️",difficulty:"中级",duration:"60分钟/天",description:"器械套路是在拳法基础上的进阶训练，通过器械练习掌握兵器的使用方法。",keyPoints:["器械与身体协调","力达器械尖端","招式清晰","攻防意识"],items:["刀术","剑术","枪术","棍术","太极剑","太极刀","九节鞭","双截棍"],tips:"器械练习要注意安全，初学者使用木质器械"},
  {id:6,name:"散手对练",en:"Sparring Training",category:"对练训练",icon:"🤝",difficulty:"高级",duration:"45分钟/天",description:"散手对练是武术实战能力的培养，通过双人对练提高实战技巧和反应能力。",keyPoints:["安全第一","循序渐进","攻防转换","距离感"],items:["散打","推手","黐手","对练","拆招","喂招","实战","搏击"],tips:"对练时要佩戴护具，注意安全"},
  {id:7,name:"桩功进阶",en:"Advanced Stance Training",category:"内功修炼",icon:"🧘",difficulty:"高级",duration:"30分钟/天",description:"进阶桩功是内功修炼的核心，通过高级桩法培养内劲，达到'外练筋骨皮，内练一口气'。",keyPoints:["意念引导","呼吸配合","放松入静","内外合一"],items:["混元桩","浑圆桩","三体式","无极桩","太极桩","八卦桩","形意桩","静功"],tips:"进阶桩功需要有基础桩功的积累"},
  {id:8,name:"柔韧性训练",en:"Flexibility Training",category:"体能训练",icon:"🤸",difficulty:"初学者",duration:"30分钟/天",description:"柔韧性是武术的重要素质，良好的柔韧性能使动作更加舒展大方，减少受伤风险。",keyPoints:["充分热身","循序渐进","静态拉伸","持之以恒"],items:["压腿","劈叉","下腰","踢腿","拉伸","瑜伽","芭蕾基训","体操"],tips:"柔韧性训练要每天坚持，不能急于求成"},
  {id:9,name:"力量训练",en:"Strength Training",category:"体能训练",icon:"💪",difficulty:"中级",duration:"45分钟/天",description:"力量是武术的基础，通过力量训练增强肌肉力量和爆发力，提高武术技术水平。",keyPoints:["全面训练","循序渐进","注意恢复","避免过度"],items:["俯卧撑","引体向上","深蹲","平板支撑","哑铃","杠铃","壶铃","弹力带"],tips:"力量训练要与武术训练相结合"},
  {id:10,name:"速度训练",en:"Speed Training",category:"体能训练",icon:"🏃",difficulty:"中级",duration:"30分钟/天",description:"速度是武术的关键要素，通过速度训练提高出拳、出腿的速度和反应能力。",keyPoints:["反应速度","动作速度","位移速度","协调性"],items:["跳绳","冲刺","反应球","速度球","靶位练习","条件反射","实战模拟","计时训练"],tips:"速度训练要在充分热身之后进行"},
  {id:11,name:"耐力训练",en:"Endurance Training",category:"体能训练",icon:"🏃‍♂️",difficulty:"中级",duration:"40分钟/天",description:"耐力是武术持续作战的能力，通过耐力训练提高心肺功能和肌肉耐力。",keyPoints:["有氧训练","无氧训练","呼吸配合","循序渐进"],items:["长跑","间歇跑","跳绳","游泳","骑车","登山","武术组合","循环训练"],tips:"耐力训练要循序渐进，避免过度疲劳"},
  {id:12,name:"套路表演",en:"Form Performance",category:"套路训练",icon:"🎭",difficulty:"高级",duration:"60分钟/天",description:"套路表演是在套路基础上的艺术化呈现，通过表演展示武术的美感和技击含义。",keyPoints:["精气神","节奏感","艺术表现","攻防清晰"],items:["规定套路","自选套路","传统套路","表演套路","竞技套路","集体项目","太极表演","器械表演"],tips:"表演要注重精气神的表达"}
];
function renderCards(data){
  document.getElementById('trainingGrid').innerHTML=data.map(m=>`
    <div class="training-card" data-category="${m.category}">
      <div class="t-header"><div class="t-icon">${m.icon}</div><div><div class="t-name">${m.name}</div><div class="t-sub">${m.en} · ${m.difficulty}</div></div></div>
      <div class="t-meta"><span>时间：${m.duration}</span><span>难度：${m.difficulty}</span></div>
      <div class="t-detail"><strong>说明：</strong>${m.description}</div>
      <div class="t-detail"><strong>要点：</strong>${m.keyPoints.join('、')}</div>
      <div class="t-items">${m.items.map(i=>`<span>${i}</span>`).join('')}</div>
      <div class="t-detail"><strong>提示：</strong>${m.tips}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">训练项目</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.training-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.training-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(TRAINING_DATA);renderStats(TRAINING_DATA);
</script>
</body>
</html>
