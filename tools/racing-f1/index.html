<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1赛车</title>
    <meta name="description" content="F1一级方程式赛车，体验极速赛车的刺激">
    <style>
:root {--bg: #0d1117;
--card: #161b22;
--border: #30363d;
--text: #e6edf3;
--accent: #3b82f6}
* {margin: 0;
padding: 0;
box-sizing: border-box}
body {background: var(--bg);
color: var(--text);
font-family: 'Segoe UI', system-ui, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
padding: 20px}
h1 {margin-bottom: 10px;
color: #3b82f6}
.controls {background: var(--card);
border: 1px solid var(--border);
border-radius: 8px;
padding: 15px;
margin-bottom: 15px;
width: 100%;
max-width: 800px;
text-align: center}
.info {display: flex;
justify-content: space-between;
margin-bottom: 10px;
font-size: 18px}
canvas {border: 2px solid var(--border);
border-radius: 8px;
background: #1a1e24;
max-width: 100%}
.btn {background: #3b82f6;
color: white;
border: none;
padding: 10px 20px;
border-radius: 6px;
cursor: pointer;
font-size: 16px;
margin: 5px}
.btn:hover {opacity: 0.9}
.message {margin-top: 15px;
font-size: 16px;
color: #8b949e}
.dashboard {display: flex;
justify-content: space-around;
margin-top: 10px;
padding: 10px;
background: #2d333b;
border-radius: 8px}
.gauge {text-align: center}
.gauge-value {font-size: 24px;
font-weight: bold;
color: #3b82f6}
.gauge-label {font-size: 12px;
color: #8b949e}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="F1赛车">
  <meta property="og:description" content="F1一级方程式赛车，体验极速赛车的刺激">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/racing-f1/">
</head>
<body>
    <h1>🏁 F1赛车</h1>
    <div class="controls">
        <div class="info">
            <span>圈数: <span id="laps">0</span>/5</span>
            <span>时间: <span id="time">0.0</span>秒</span>
            <span>最快圈速: <span id="bestLap">--</span></span>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="dashboard">
            <div class="gauge">
                <div class="gauge-value" id="speedGauge">0</div>
                <div class="gauge-label">速度 (km/h)</div>
            </div>
            <div class="gauge">
                <div class="gauge-value" id="rpmGauge">0</div>
                <div class="gauge-label">转速 (RPM)</div>
            </div>
            <div class="gauge">
                <div class="gauge-value" id="gearGauge">1</div>
                <div class="gauge-label">档位</div>
            </div>
            <div class="gauge">
                <div class="gauge-value" id="fuelGauge">100</div>
                <div class="gauge-label">燃油 (%)</div>
            </div>
        </div>
        <div style="margin-top: 10px;">
            <button class="btn" onclick="startGame()">开始比赛</button>
            <button class="btn" onclick="resetGame()">重新开始</button>
        </div>
        <div class="message">方向键/WASD控制，空格键DRS加速，完成5圈比赛！</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lapsEl = document.getElementById('laps');
        const timeEl = document.getElementById('time');
        const bestLapEl = document.getElementById('bestLap');
        const speedGauge = document.getElementById('speedGauge');
        const rpmGauge = document.getElementById('rpmGauge');
        const gearGauge = document.getElementById('gearGauge');
        const fuelGauge = document.getElementById('fuelGauge');
        
        let gameRunning = false;
        let gameTime = 0;
        let lastTime = 0;
        let laps = 0;
        let bestLapTime = Infinity;
        let currentLapTime = 0;
        let car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30, gear: 1, fuel: 100, drs: false };
        let keys = {};
        let checkpoints = [0, 0, 0, 0];
        let lastCheckpoint = -1;
        
        // F1赛道（椭圆形）
        const track = [
            { x: 400, y: 500, type: 'start' },
            { x: 400, y: 400, type: 'straight' },
            { x: 400, y: 300, type: 'straight' },
            { x: 300, y: 200, type: 'curve' },
            { x: 200, y: 150, type: 'straight' },
            { x: 200, y: 100, type: 'straight' },
            { x: 300, y: 50, type: 'curve' },
            { x: 500, y: 50, type: 'straight' },
            { x: 600, y: 100, type: 'curve' },
            { x: 600, y: 200, type: 'straight' },
            { x: 600, y: 300, type: 'straight' },
            { x: 500, y: 400, type: 'curve' },
            { x: 400, y: 500, type: 'finish' }
        ];
        
        function drawTrack() {
            // 赛道表面
            ctx.strokeStyle = '#30363d';
            ctx.lineWidth = 80;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            ctx.moveTo(track[0].x, track[0].y);
            for (let i = 1; i < track.length; i++) {
                ctx.lineTo(track[i].x, track[i].y);
            }
            ctx.stroke();
            
            // 赛道边线
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(track[0].x, track[0].y);
            for (let i = 1; i < track.length; i++) {
                ctx.lineTo(track[i].x, track[i].y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 起点线
            ctx.strokeStyle = '#ff6b6b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(360, 500);
            ctx.lineTo(440, 500);
            ctx.stroke();
        }
        
        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // F1车身
            ctx.fillStyle = #3b82f6;
            ctx.fillRect(-car.width/2, -car.height/2, car.width, car.height);
            
            // 车鼻
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(-car.width/4, -car.height/2 - 10, car.width/2, 10);
            
            // 尾翼
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(-car.width/2 - 5, car.height/2 - 5, car.width + 10, 5);
            
            // DRS指示灯
            if (car.drs) {
                ctx.fillStyle = '#00ff00';
                ctx.beginPath();
                ctx.arc(0, -car.height/2 - 15, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function updateCar(deltaTime) {
            // 燃油消耗
            car.fuel -= 0.01 * car.speed;
            fuelGauge.textContent = Math.max(0, Math.round(car.fuel));
            
            if (car.fuel <= 0) {
                car.speed *= 0.95;
            }
            
            // DRS加速
            if (keys[' '] && car.fuel > 10) {
                car.drs = true;
                car.speed = Math.min(car.speed + 0.2, 12);
                car.fuel -= 0.05;
            } else {
                car.drs = false;
            }
            
            // 加速/减速
            if (keys['ArrowUp'] || keys['w']) {
                car.speed = Math.min(car.speed + 0.1, 8);
            } else if (keys['ArrowDown'] || keys['s']) {
                car.speed = Math.max(car.speed - 0.2, -3);
            } else {
                car.speed *= 0.98;
            }
            
            // 转向
            if (keys['ArrowLeft'] || keys['a']) {
                car.angle -= 0.05 * car.speed;
            }
            if (keys['ArrowRight'] || keys['d']) {
                car.angle += 0.05 * car.speed;
            }
            
            // 档位计算
            const speedKmh = Math.abs(car.speed * 20);
            if (speedKmh < 60) car.gear = 1;
            else if (speedKmh < 100) car.gear = 2;
            else if (speedKmh < 140) car.gear = 3;
            else if (speedKmh < 180) car.gear = 4;
            else if (speedKmh < 220) car.gear = 5;
            else if (speedKmh < 260) car.gear = 6;
            else car.gear = 7;
            
            // 转速计算
            const rpm = (speedKmh / 300) * 10000 + Math.random() * 500;
            
            // 更新仪表
            speedGauge.textContent = Math.round(speedKmh);
            rpmGauge.textContent = Math.round(rpm);
            gearGauge.textContent = car.gear;
            
            // 更新位置
            car.x += Math.sin(car.angle) * car.speed;
            car.y -= Math.cos(car.angle) * car.speed;
            
            // 边界检查
            car.x = Math.max(20, Math.min(canvas.width - 20, car.x));
            car.y = Math.max(20, Math.min(canvas.height - 20, car.y));
            
            // 圈数计算
            currentLapTime += deltaTime;
            if (car.y > 490 && car.y < 510 && car.x > 350 && car.x < 450) {
                if (lastCheckpoint !== 0) {
                    lastCheckpoint = 0;
                    checkpoints[0] = 1;
                }
            }
            
            // 检查是否完成一圈
            if (checkpoints.every(c => c === 1)) {
                laps++;
                lapsEl.textContent = laps;
                
                if (currentLapTime < bestLapTime) {
                    bestLapTime = currentLapTime;
                    bestLapEl.textContent = bestLapTime.toFixed(1);
                }
                
                currentLapTime = 0;
                checkpoints = [0, 0, 0, 0];
                lastCheckpoint = -1;
                
                if (laps >= 5) {
                    gameOver();
                }
            }
        }
        
        function updateGame(timestamp) {
            if (!gameRunning) return;
            
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            
            gameTime += deltaTime;
            timeEl.textContent = gameTime.toFixed(1);
            
            updateCar(deltaTime);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();
            drawCar();
            
            requestAnimationFrame(updateGame);
        }
        
        function gameOver() {
            gameRunning = false;
            garyyToast('比赛完成！总时间: ' + gameTime.toFixed(1) + '秒\n最快圈速: ' + bestLapTime.toFixed(1) + '秒');
        }
        
        function startGame() {
            if (gameRunning) return;
            
            car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30, gear: 1, fuel: 100, drs: false };
            gameTime = 0;
            laps = 0;
            currentLapTime = 0;
            bestLapTime = Infinity;
            
            lapsEl.textContent = '0';
            timeEl.textContent = '0.0';
            bestLapEl.textContent = '--';
            
            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(updateGame);
        }
        
        function resetGame() {
            gameRunning = false;
            car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30, gear: 1, fuel: 100, drs: false };
            gameTime = 0;
            laps = 0;
            currentLapTime = 0;
            bestLapTime = Infinity;
            
            lapsEl.textContent = '0';
            timeEl.textContent = '0.0';
            bestLapEl.textContent = '--';
            speedGauge.textContent = '0';
            rpmGauge.textContent = '0';
            gearGauge.textContent = '1';
            fuelGauge.textContent = '100';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();
            drawCar();
        }
        
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // 初始绘制
        drawTrack();
        drawCar();
    </script>
<script src="../i18n.js" defer></script>
</body>
</html>
