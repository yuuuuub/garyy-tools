<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌬️ 空气质量监测</title>
<meta name="description" content="实时空气质量指数AQI监测，PM2.5、PM10等污染物数据，健康建议">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.aqi-display{text-align:center;padding:30px}
.aqi-circle{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto;border:4px solid}
.aqi-value{font-size:3rem;font-weight:700}
.aqi-level{font-size:1.1rem;margin-top:4px}
.aqi-desc{margin-top:8px;font-size:.9rem}
.aqi-scale{display:flex;justify-content:space-between;margin-top:20px;font-size:.75rem}
.aqi-scale-item{text-align:center;flex:1}
.aqi-scale-color{height:8px;border-radius:4px;margin-bottom:4px}
.pollutant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.pollutant{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
.pollutant .name{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.pollutant .value{font-size:1.4rem;font-weight:700}
.pollutant .unit{font-size:.75rem;color:var(--text2)}
.pollutant .bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px}
.pollutant .bar-fill{height:100%;border-radius:2px}
.health-tips{background:var(--bg);border-radius:8px;padding:12px;margin-bottom:8px}
.health-tips .title{font-weight:600;font-size:.9rem;margin-bottom:6px}
.health-tips .content{font-size:.8rem;color:var(--text2);line-height:1.6}
.health-tips .icon{margin-right:6px}
.forecast-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.forecast-item{text-align:center;padding:8px;background:var(--bg);border-radius:8px}
.forecast-day{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.forecast-aqi{font-size:1.2rem;font-weight:700}
.forecast-icon{font-size:1.2rem;margin:4px 0}
.location-info{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.location-info .name{font-size:1rem;font-weight:600}
.location-info .update{font-size:.8rem;color:var(--text2)}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.stat-label{color:var(--text2)}
.stat-value{font-weight:600}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.aqi-circle{animation:pulse 2s ease-in-out infinite}

@media(max-width:600px){
  body{padding:12px!important}
  .container{max-width:100%!important;padding:0!important}
  h1{font-size:1.3rem!important}
  .card{padding:14px!important;margin-bottom:10px!important}
  .btn{padding:8px 16px!important;font-size:.85rem!important}
  textarea,.input-group input,.input-group select{font-size:16px!important}
  .tools-grid,.grid,.result-grid{grid-template-columns:1fr!important}
  table{font-size:.78rem!important}
  th,td{padding:5px 4px!important}
  .tab-bar{gap:4px!important}
  .tab{padding:6px 10px!important;font-size:.75rem!important}
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌬️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🌬️ 空气质量监测">
<meta property="og:description" content="实时空气质量指数AQI监测，PM2.5、PM10等污染物数据">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🌬️ 空气质量监测</h1><p>实时监测空气质量，守护呼吸健康</p></div>

<div class="cd">
<div class="location-info">
<div>
<div class="name">📍 北京市海淀区</div>
<div class="update">更新时间: <span id="updateTime">刚刚</span></div>
</div>
</div>
<div class="aqi-display">
<div class="aqi-circle" id="aqiCircle">
<div class="aqi-value" id="aqiValue">75</div>
<div class="aqi-level" id="aqiLevel">良</div>
</div>
<div class="aqi-desc" id="aqiDesc">空气质量可以接受，某些污染物对少数异常敏感人群健康有轻微影响</div>
<div class="aqi-scale">
<div class="aqi-scale-item"><div class="aqi-scale-color" style="background:#00e400"></div>优 0-50</div>
<div class="aqi-scale-item"><div class="aqi-scale-color" style="background:#ffff00"></div>良 51-100</div>
<div class="aqi-scale-item"><div class="aqi-scale-color" style="background:#ff7e00"></div>轻度 101-150</div>
<div class="aqi-scale-item"><div class="aqi-scale-color" style="background:#ff0000"></div>中度 151-200</div>
<div class="aqi-scale-item"><div class="aqi-scale-color" style="background:#8f3f97"></div>重度 201-300</div>
<div class="aqi-scale-item"><div class="aqi-scale-color" style="background:#7e0023"></div>严重 >300</div>
</div>
</div>
</div>

<div class="cd">
<h2>污染物浓度</h2>
<div class="pollutant-grid" id="pollutantGrid"></div>
</div>

<div class="cd">
<h2>健康建议</h2>
<div id="healthTips"></div>
</div>

<div class="cd">
<h2>7日预报</h2>
<div class="forecast-grid" id="forecastGrid"></div>
</div>

<div class="cd">
<h2>详细数据</h2>
<div class="stat-row"><span class="stat-label">温度</span><span class="stat-value" id="temperature">26°C</span></div>
<div class="stat-row"><span class="stat-label">湿度</span><span class="stat-value" id="humidity">65%</span></div>
<div class="stat-row"><span class="stat-label">风向</span><span class="stat-value" id="windDir">东南风</span></div>
<div class="stat-row"><span class="stat-label">风速</span><span class="stat-value" id="windSpeed">3.2 m/s</span></div>
<div class="stat-row"><span class="stat-label">气压</span><span class="stat-value" id="pressure">1013 hPa</span></div>
<div class="stat-row"><span class="stat-label">能见度</span><span class="stat-value" id="visibility">15 km</span></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const pollutants=[
  {name:'PM2.5',unit:'μg/m³',value:35,max:250,color:'#3b82f6'},
  {name:'PM10',unit:'μg/m³',value:68,max:350,color:'#8b5cf6'},
  {name:'SO₂',unit:'μg/m³',value:12,max:150,color:'#06b6d4'},
  {name:'NO₂',unit:'μg/m³',value:45,max:200,color:'#f59e0b'},
  {name:'CO',unit:'mg/m³',value:0.8,max:4,color:'#10b981'},
  {name:'O₃',unit:'μg/m³',value:120,max:300,color:'#ef4444'}
];
const healthAdvice=[
  {icon:'🏃',title:'运动建议',content:'适宜进行户外运动，可正常开展各类户外活动'},
  {icon:'😷',title:'防护建议',content:'极少数异常敏感人群应减少户外活动'},
  {icon:'🪟',title:'通风建议',content:'空气质量良好，适宜开窗通风'},
  {icon:'🌿',title:'植物养护',content:'适宜户外植物养护，无需特殊防护'}
];
const forecasts=[
  {day:'周一',aqi:72,icon:'☀️'},
  {day:'周二',aqi:68,icon:'⛅'},
  {day:'周三',aqi:85,icon:'🌤️'},
  {day:'周四',aqi:110,icon:'🌥️'},
  {day:'周五',aqi:95,icon:'⛅'},
  {day:'周六',aqi:78,icon:'☀️'},
  {day:'周日',aqi:65,icon:'☀️'}
];

function getAQIColor(aqi){
  if(aqi<=50)return'#00e400';
  if(aqi<=100)return'#ffff00';
  if(aqi<=150)return'#ff7e00';
  if(aqi<=200)return'#ff0000';
  if(aqi<=300)return'#8f3f97';
  return'#7e0023';
}

function getAQILevel(aqi){
  if(aqi<=50)return'优';
  if(aqi<=100)return'良';
  if(aqi<=150)return'轻度污染';
  if(aqi<=200)return'中度污染';
  if(aqi<=300)return'重度污染';
  return'严重污染';
}

function getAQIDesc(aqi){
  if(aqi<=50)return'空气质量令人满意，基本无空气污染';
  if(aqi<=100)return'空气质量可以接受，某些污染物对少数异常敏感人群健康有轻微影响';
  if(aqi<=150)return'敏感人群症状有轻度加剧，健康人群出现刺激症状';
  if(aqi<=200)return'可能对健康人群心脏、呼吸系统有影响';
  if(aqi<=300)return'心脏病和肺病患者症状显著加剧，运动耐受力降低';
  return'健康人群运动耐受力降低，有明显强烈症状，提前出现某些疾病';
}

function renderPollutants(){
  $('pollutantGrid').innerHTML=pollutants.map(p=>{
    const percent=(p.value/p.max)*100;
    return`<div class="pollutant">
      <div class="name">${p.name}</div>
      <div class="value" style="color:${p.color}">${p.value}</div>
      <div class="unit">${p.unit}</div>
      <div class="bar"><div class="bar-fill" style="width:${percent}%;background:${p.color}"></div></div>
    </div>`;
  }).join('');
}

function renderHealthTips(){
  $('healthTips').innerHTML=healthAdvice.map(t=>`<div class="health-tips">
    <div class="title"><span class="icon">${t.icon}</span>${t.title}</div>
    <div class="content">${t.content}</div>
  </div>`).join('');
}

function renderForecast(){
  $('forecastGrid').innerHTML=forecasts.map(f=>`<div class="forecast-item">
    <div class="forecast-day">${f.day}</div>
    <div class="forecast-icon">${f.icon}</div>
    <div class="forecast-aqi" style="color:${getAQIColor(f.aqi)}">${f.aqi}</div>
  </div>`).join('');
}

function updateAQI(){
  const aqi=50+Math.floor(Math.random()*60);
  $('aqiValue').textContent=aqi;
  $('aqiCircle').style.borderColor=getAQIColor(aqi);
  $('aqiLevel').textContent=getAQILevel(aqi);
  $('aqiLevel').style.color=getAQIColor(aqi);
  $('aqiDesc').textContent=getAQIDesc(aqi);
}

function simulateData(){
  pollutants.forEach(p=>{
    p.value=Math.max(0,p.value+(Math.random()-0.5)*5);
  });
  renderPollutants();
  $('temperature').textContent=(25+Math.random()*3).toFixed(1)+'°C';
  $('humidity').textContent=Math.floor(60+Math.random()*15)+'%';
  $('windSpeed').textContent=(2+Math.random()*3).toFixed(1)+' m/s';
}

renderPollutants();
renderHealthTips();
renderForecast();
updateAQI();
setInterval(()=>{simulateData();updateAQI();},10000);
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
