<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>序列记忆</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
h1{font-size:1.5rem;margin-bottom:10px;color:#3b82f6}
.hud{display:flex;gap:20px;margin-bottom:20px;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(3,100px);gap:10px}
.cell{width:100px;height:100px;background:#161b22;border:2px solid #30363d;border-radius:12px;cursor:pointer;transition:all .2s}
.cell:hover{border-color:#475569}
.cell.lit{background:#3b82f6;border-color:#60a5fa;box-shadow:0 0 20px rgba(59,130,246,0.5)}
.cell.correct{background:#22c55e;border-color:#22c55e}
.cell.wrong{background:#ef4444;border-color:#ef4444}
.status{margin-top:20px;font-size:1.1rem;min-height:1.5em}
button{padding:10px 28px;border:none;background:#3b82f6;color:#fff;border-radius:8px;cursor:pointer;font-size:1rem;margin-top:12px}
</style>
</head>
<body>
<h1>🧠 序列记忆</h1>
<div class="hud"><span>关卡: <b id="level">1</b></span><span>最高: <b id="best">0</b></span></div>
<div class="grid" id="grid"></div>
<div class="status" id="status">点击开始记忆序列</div>
<button id="startBtn" onclick="startGame()">开始游戏</button>
<script>
let sequence=[],playerSeq=[],showing=false,playing=false,level=0,best=0;
const cells=[];

for(let i=0;i<9;i++){
  const c=document.createElement('div');c.className='cell';
  c.onclick=()=>handleClick(i);
  document.getElementById('grid').appendChild(c);
  cells.push(c);
}

function startGame(){level=0;nextRound()}

function nextRound(){
  sequence.push(Math.floor(Math.random()*9));
  playerSeq=[];showing=true;playing=false;
  document.getElementById('level').textContent=sequence.length;
  document.getElementById('status').textContent='观察序列...';
  document.getElementById('startBtn').disabled=true;

  let i=0;
  const iv=setInterval(()=>{
    if(i>=sequence.length){
      clearInterval(iv);showing=false;playing=true;
      document.getElementById('status').textContent='你的回合！按顺序点击';
      return;
    }
    cells[sequence[i]].classList.add('lit');
    setTimeout(()=>cells[sequence[i]].classList.remove('lit'),400);
    i++;
  },600);
}

function handleClick(i){
  if(!playing)return;
  playerSeq.push(i);
  const idx=playerSeq.length-1;
  if(sequence[idx]===i){
    cells[i].classList.add('correct');
    setTimeout(()=>cells[i].classList.remove('correct'),300);
    if(playerSeq.length===sequence.length){
      playing=false;level++;
      if(level>best){best=level;document.getElementById('best').textContent=best}
      document.getElementById('status').textContent='正确！准备下一关...';
      document.getElementById('startBtn').disabled=false;
      setTimeout(nextRound,1000);
    }
  }else{
    cells[i].classList.add('wrong');setTimeout(()=>cells[i].classList.remove('wrong'),300);
    playing=false;
    document.getElementById('status').textContent=`游戏结束！你到了第 ${sequence.length} 关`;
    document.getElementById('startBtn').disabled=false;document.getElementById('startBtn').textContent='再来一次';
  }
}
</script>
</body>
</html>
