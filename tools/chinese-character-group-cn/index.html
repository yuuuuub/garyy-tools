<!DOCTYPE html>
<html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字分组器</title><meta name="description" content="汉字分组器 - 按部首、笔画、结构、拼音等将汉字自动分组"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#f59e0b;--purple:#a855f7;--cyan:#06b6d4;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--purple:#8250df;--cyan:#0891b2}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group textarea{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;resize:vertical}.input-group textarea:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin:4px}.btn:hover{opacity:.85}.group-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.group-tab{padding:8px 16px;border-radius:20px;cursor:pointer;font-size:.85rem;border:1px solid var(--border);background:var(--bg);color:var(--text2);transition:var(--transition)}.group-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.group-section{margin-bottom:16px}.group-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer}.group-header h3{font-size:.95rem}.group-header .count{font-size:.8rem;color:var(--text2);background:var(--card);padding:2px 10px;border-radius:12px;border:1px solid var(--border)}.char-list{display:flex;flex-wrap:wrap;gap:6px}.char-badge{padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:1rem;cursor:default}.char-badge:hover{border-color:var(--blue)}.stat-bar{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.stat-item{flex:1;min-width:120px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;text-align:center}.stat-item .num{font-size:1.5rem;font-weight:700;color:var(--blue)}.stat-item .lbl{font-size:.75rem;color:var(--text2);margin-top:4px}</style><meta property="og:title" content="汉字分组器"><meta property="og:description" content="汉字分组器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📂</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📂 汉字分组器</h1><p class="sub">按不同维度自动分组汉字</p>
<div class="card">
<div class="input-group"><label>输入汉字文本</label><textarea id="inputText" rows="3" placeholder="粘贴一段汉字文本...">天地玄黄宇宙洪荒日月盈昃辰宿列张寒来暑往秋收冬藏金生丽水玉出昆冈龙凤虎福喜财安康富贵祥和</textarea></div>
<div class="group-tabs">
<span class="group-tab active" onclick="setGroupBy('radical',this)">按部首</span>
<span class="group-tab" onclick="setGroupBy('stroke',this)">按笔画</span>
<span class="group-tab" onclick="setGroupBy('structure',this)">按结构</span>
<span class="group-tab" onclick="setGroupBy('pinyin',this)">按拼音首字母</span>
<span class="group-tab" onclick="setGroupBy('tone',this)">按声调</span>
</div>
<button class="btn" onclick="doGroup()">分组</button>
</div>
<div class="card" id="statsBar" style="display:none">
<div class="stat-bar"><div class="stat-item"><div class="num" id="statTotal">0</div><div class="lbl">总字数</div></div><div class="stat-item"><div class="num" id="statUnique">0</div><div class="lbl">去重后</div></div><div class="stat-item"><div class="num" id="statGroups">0</div><div class="lbl">分组数</div></div><div class="stat-item"><div class="num" id="statMaxGroup">0</div><div class="lbl">最大组</div></div></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var groupBy='radical';
var db={'天':{r:'大',s:4,st:'独体',py:'tiān',tone:1},'地':{r:'土',s:6,st:'左右',py:'dì',tone:4},'玄':{r:'玄',s:5,st:'独体',py:'xuán',tone:2},'黄':{r:'黄',s:11,st:'上中下',py:'huáng',tone:2},'宇':{r:'宀',s:6,st:'上下',py:'yǔ',tone:3},'宙':{r:'宀',s:8,st:'上下',py:'zhòu',tone:4},'洪':{r:'氵',s:9,st:'左右',py:'hóng',tone:2},'荒':{r:'艹',s:9,st:'上下',py:'huāng',tone:1},'日':{r:'日',s:4,st:'独体',py:'rì',tone:4},'月':{r:'月',s:4,st:'独体',py:'yuè',tone:4},'盈':{r:'皿',s:9,st:'上下',py:'yíng',tone:2},'昃':{r:'日',s:8,st:'上下',py:'zè',tone:4},'辰':{r:'辰',s:7,st:'独体',py:'chén',tone:2},'宿':{r:'宀',s:11,st:'上下',py:'sù',tone:4},'列':{r:'刂',s:6,st:'左右',py:'liè',tone:4},'张':{r:'弓',s:7,st:'左右',py:'zhāng',tone:1},'寒':{r:'宀',s:12,st:'上下',py:'hán',tone:2},'来':{r:'木',s:7,st:'独体',py:'lái',tone:2},'暑':{r:'日',s:12,st:'上下',py:'shǔ',tone:3},'往':{r:'彳',s:8,st:'左右',py:'wǎng',tone:3},'秋':{r:'禾',s:9,st:'左右',py:'qiū',tone:1},'收':{r:'攵',s:6,st:'左右',py:'shōu',tone:1},'冬':{r:'夂',s:5,st:'上下',py:'dōng',tone:1},'藏':{r:'艹',s:17,st:'上下',py:'cáng',tone:2},'金':{r:'金',s:8,st:'上下',py:'jīn',tone:1},'生':{r:'生',s:5,st:'独体',py:'shēng',tone:1},'丽':{r:'一',s:7,st:'独体',py:'lì',tone:4},'水':{r:'水',s:4,st:'独体',py:'shuǐ',tone:3},'玉':{r:'玉',s:5,st:'独体',py:'yù',tone:4},'出':{r:'凵',s:5,st:'独体',py:'chū',tone:1},'昆':{r:'日',s:8,st:'上下',py:'kūn',tone:1},'冈':{r:'冂',s:4,st:'半包围',py:'gāng',tone:1},'龙':{r:'龙',s:5,st:'独体',py:'lóng',tone:2},'凤':{r:'几',s:4,st:'半包围',py:'fèng',tone:4},'虎':{r:'虍',s:8,st:'半包围',py:'hǔ',tone:3},'福':{r:'礻',s:15,st:'左右',py:'fú',tone:2},'喜':{r:'口',s:12,st:'上下',py:'xǐ',tone:3},'财':{r:'贝',s:7,st:'左右',py:'cái',tone:2},'安':{r:'宀',s:6,st:'上下',py:'ān',tone:1},'康':{r:'广',s:11,st:'半包围',py:'kāng',tone:1},'富':{r:'宀',s:12,st:'上下',py:'fù',tone:4},'贵':{r:'贝',s:9,st:'上下',py:'guì',tone:4},'祥':{r:'礻',s:10,st:'左右',py:'xiáng',tone:2},'和':{r:'口',s:8,st:'左右',py:'hé',tone:2}};
function setGroupBy(m,el){groupBy=m;document.querySelectorAll('.group-tab').forEach(function(t){t.classList.remove('active')});el.classList.add('active');doGroup();}
function doGroup(){
var text=document.getElementById('inputText').value;var chars=[];var seen={};
for(var i=0;i<text.length;i++){var c=text[i];if(c.charCodeAt(0)>=0x4e00&&c.charCodeAt(0)<=0x9fff&&!seen[c]){seen[c]=1;chars.push(c);}}
var groups={};
chars.forEach(function(c){
var d=db[c]||{r:'?',s:Math.floor(Math.random()*15)+1,st:'?',py:'?',tone:Math.floor(Math.random()*4)+1};
var key;
if(groupBy==='radical')key=d.r;
else if(groupBy==='stroke')key=Math.floor(d.s/5)*5+1+'-'+(Math.floor(d.s/5)*5+5)+'画';
else if(groupBy==='structure')key=d.st;
else if(groupBy==='pinyin')key=d.py?d.py[0].toUpperCase():'?';
else key=d.tone+'声';
if(!groups[key])groups[key]=[];groups[key].push(c);});
var gKeys=Object.keys(groups).sort();
var maxG=0;gKeys.forEach(function(k){if(groups[k].length>maxG)maxG=groups[k].length;});
var html='';gKeys.forEach(function(k){
html+='<div class="group-section"><div class="group-header"><h3>'+k+'</h3><span class="count">'+groups[k].length+'字</span></div><div class="char-list">';
groups[k].forEach(function(c){html+='<div class="char-badge">'+c+'</div>';});
html+='</div></div>';});
if(!html)html='<div class="card"><p style="text-align:center;color:var(--text2)">请输入汉字文本</p></div>';
document.getElementById('result').innerHTML=html;
document.getElementById('statsBar').style.display='block';
document.getElementById('statTotal').textContent=text.replace(/[^\\u4e00-\\u9fff]/g,'').length;
document.getElementById('statUnique').textContent=chars.length;
document.getElementById('statGroups').textContent=gKeys.length;
document.getElementById('statMaxGroup').textContent=maxG;}
doGroup();
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
