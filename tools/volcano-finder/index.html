<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火山查找</title>
<meta name="description" content="火山查找工具，发现世界著名火山和地质奇观">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--red:#ef4444;--orange:#f97316;--green:#22c55e;--muted:#8b949e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:1200px;margin:0 auto}
h1{text-align:center;font-size:1.8rem;margin-bottom:6px}
.subtitle{text-align:center;color:var(--muted);margin-bottom:24px;font-size:.9rem}
.controls{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.search-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;outline:none;transition:border .2s}
.search-input:focus{border-color:var(--accent)}
.filter-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-group label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.filter-group select{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;font-size:.85rem;outline:none;min-width:120px}
.sort-btns{display:flex;gap:6px;flex-wrap:wrap}
.sort-btn{padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:.8rem;cursor:pointer;transition:all .2s}
.sort-btn.active,.sort-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.results-info{margin-bottom:16px;color:var(--muted);font-size:.85rem}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-name{font-size:1.15rem;font-weight:600}
.card-type{padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:600;white-space:nowrap}
.type-active{background:rgba(239,68,68,.2);color:var(--red);border:1px solid rgba(239,68,68,.4)}
.type-dormant{background:rgba(249,115,22,.2);color:var(--orange);border:1px solid rgba(249,115,22,.4)}
.type-extinct{background:rgba(107,114,128,.2);color:#9ca3af;border:1px solid rgba(107,114,128,.4)}
.card-location{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.card-desc{color:var(--muted);font-size:.88rem;line-height:1.5;margin-bottom:12px}
.card-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.meta-tag{padding:4px 10px;border-radius:6px;font-size:.75rem}
.tag-elev{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:var(--accent)}
.tag-danger{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.tag-safe{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:var(--green)}
.card-features{list-style:none;padding:0}
.card-features li{padding:3px 0;font-size:.83rem;color:var(--muted)}
.card-features li::before{content:"• ";color:var(--accent)}
.no-results{text-align:center;color:var(--muted);padding:60px 20px;font-size:1.1rem}
@media(max-width:600px){.results{grid-template-columns:1fr}.search-row{flex-direction:column}.filter-row{flex-direction:column;align-items:stretch}.filter-group select{min-width:auto;width:100%}h1{font-size:1.4rem}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="火山查找">
  <meta property="og:description" content="火山查找工具，发现世界著名火山和地质奇观">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/volcano-finder/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<h1>🌋 火山查找</h1>
<p class="subtitle">探索地球最壮观的火山奇观</p>
<div class="controls">
<div class="search-row"><input type="text" class="search-input" id="searchInput" placeholder="搜索火山名称或国家..."></div>
<div class="filter-row">
<div class="filter-group"><label>状态</label><select id="typeFilter"><option value="">全部</option><option value="活火山">活火山</option><option value="休眠火山">休眠火山</option><option value="死火山">死火山</option></select></div>
<div class="filter-group"><label>地区</label><select id="regionFilter"><option value="">全部地区</option><option value="亚洲">亚洲</option><option value="欧洲">欧洲</option><option value="北美洲">北美洲</option><option value="南美洲">南美洲</option><option value="大洋洲">大洋洲</option><option value="非洲">非洲</option></select></div>
<div class="filter-group"><label>难度</label><select id="diffFilter"><option value="">全部</option><option value="简单">简单</option><option value="中等">中等</option><option value="困难">困难</option></select></div>
<div class="filter-group"><label>排序</label>
<div class="sort-btns"><button class="sort-btn active" data-sort="elevation">海拔 ↓</button><button class="sort-btn" data-sort="rating">评分 ↓</button><button class="sort-btn" data-sort="name">名称</button></div>
</div></div></div>
<div class="results-info" id="resultsInfo"></div>
<div class="results" id="results"></div>
</div>
<script>
const volcanoes=[
{id:1,name:"富士山",country:"日本",region:"亚洲",type:"休眠火山",elevation:3776,lastEruption:"1707年",hikeDiff:"中等",safety:"安全",rating:4.9,desc:"日本最高峰与精神象征，完美圆锥形火山体是世界文化遗产。",features:["年度登山季7-8月","五合目起步","山顶日出","新宿直达巴士"]},
{id:2,name:"维苏威火山",country:"意大利",region:"欧洲",type:"活火山",elevation:1281,lastEruption:"1944年",hikeDiff:"中等",safety:"需关注",rating:4.7,desc:"历史上最致命的火山之一，公元79年摧毁了庞贝古城。",features:["庞贝古城遗址","火山口徒步","那不勒斯湾全景","火山观测站"]},
{id:3,name:"基拉韦厄火山",country:"美国",region:"北美洲",type:"活火山",elevation:1247,lastEruption:"2023年",hikeDiff:"简单",safety:"受控开放",rating:4.8,desc:"世界上最活跃的火山之一，持续喷发超过35年，造就新陆地。",features:["火山国家公园","熔岩湖","火山口裂隙"," ranger 导览"]},
{id:4,name:"科托帕希火山",country:"厄瓜多尔",region:"南美洲",type:"休眠火山",elevation:5897,lastEruption:"2016年",hikeDiff:"困难",safety:"需高山装备",rating:4.6,desc:"世界最高活火山之一，接近雪线的壮丽冰川与火山共存景观。",features:["高山冰川","4800米露营","夜间攀登","赤道纪念碑"]},
{id:5,name:"默拉皮火山",country:"印度尼西亚",region:"亚洲",type:"活火山",elevation:2930,lastEruption:"2023年",hikeDiff:"困难",safety:"高风险",rating:4.5,desc:"爪哇岛最活跃火山，火山灰频繁喷发，当地精神信仰中心。",features:["火山观测站","梭罗古城","日惹婆罗浮屠","警戒区标识"]},
{id:6,name:"埃特纳火山",country:"意大利",region:"欧洲",type:"活火山",elevation:3357,lastEruption:"2024年",hikeDiff:"中等",safety:"受控开放",rating:4.7,desc:"欧洲最高活火山，持续喷发，火山口附近可乘缆车。",features:["缆车+越野车","火山溶洞","葡萄酒产区","冬季滑雪"]},
{id:7,name:"圣海伦斯火山",country:"美国",region:"北美洲",type:"休眠火山",elevation:2549,lastEruption:"2008年",hikeDiff:"困难",safety:"需许可",rating:4.4,desc:"1980年灾难性喷发改变了整座山体，现为火山研究基地。",features:["游客中心","火山口观景台","考古遗址","学术导览"]},
{id:8,name:"阿贡火山",country:"印度尼西亚",region:"亚洲",type:"活火山",elevation:3031,lastEruption:"2019年",hikeDiff:"困难",safety:"需关注",rating:4.6,desc:"巴厘岛最高峰，印度教圣地，日出攀登体验令人难忘。",features:["日出攀登","百沙基母庙","巴厘传统仪式","高原徒步"]},
{id:9,name:"波波卡特佩特火山",country:"墨西哥",region:"北美洲",type:"活火山",elevation:5426,lastEruption:"2023年",hikeDiff:"困难",safety:"受控开放",rating:4.5,desc:"北美第二高峰火山，阿兹特克人称之为'冒烟之山'。",features:["登山小屋","普埃布拉古城","特奥蒂瓦坎","仙人掌林"]},
{id:10,name:"奥格斯汀火山",country:"哥伦比亚",region:"南美洲",type:"活火山",elevation:4100,lastEruption:"1993年",hikeDiff:"中等",safety:"需关注",rating:4.3,desc:"哥伦比亚最活跃火山，温泉群与火山景观完美结合。",features:["温泉浴场","泥浆浴","咖啡庄园","观鸟天堂"]}
];
let currentSort="elevation";
let filtered=[...volcanoes];
function render(){
const s=document.getElementById("searchInput").value.toLowerCase();
const type=document.getElementById("typeFilter").value;
const region=document.getElementById("regionFilter").value;
const diff=document.getElementById("diffFilter").value;
filtered=volcanoes.filter(v=>{
if(s&&!v.name.includes(s)&&!v.country.includes(s))return false;
if(type&&v.type!==type)return false;
if(region&&v.region!==region)return false;
if(diff&&v.hikeDiff!==diff)return false;
return true;
});
if(currentSort==="elevation")filtered.sort((a,b)=>b.elevation-a.elevation);
else if(currentSort==="rating")filtered.sort((a,b)=>b.rating-a.rating);
else if(currentSort==="name")filtered.sort((a,b)=>a.name.localeCompare(b.name,"zh"));
document.getElementById("resultsInfo").textContent=`找到 ${filtered.length} 座火山`;
const c=document.getElementById("results");
if(!filtered.length){c.innerHTML='<div class="no-results">没有找到匹配的火山</div>';return;}
c.innerHTML=filtered.map(v=>`<div class="card">
<div class="card-header"><span class="card-name">🌋 ${v.name}</span><span class="card-type type-${v.type==="活火山"?"active":v.type==="休眠火山"?"dormant":"extinct"}">${v.type}</span></div>
<div class="card-location">📍 ${v.country} · 海拔 ${v.elevation.toLocaleString()}m · ⭐ ${v.rating}</div>
<div class="card-desc">${v.desc}</div>
<div class="card-meta">
<span class="meta-tag tag-elev">🏔️ ${v.elevation}m</span>
<span class="meta-tag tag-danger">🔥 最近喷发: ${v.lastEruption}</span>
<span class="meta-tag ${v.safety==="安全"?"tag-safe":"tag-danger"}">🛡️ ${v.safety}</span>
<span class="meta-tag tag-elev">🥾 难度: ${v.hikeDiff}</span>
</div>
<ul class="card-features">${v.features.map(f=>`<li>${f}</li>`).join("")}</ul>
</div>`).join("");
}
document.querySelectorAll(".sort-btn").forEach(b=>{b.addEventListener("click",()=>{document.querySelectorAll(".sort-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentSort=b.dataset.sort;render();})});
document.getElementById("searchInput").addEventListener("input",render);
document.getElementById("typeFilter").addEventListener("change",render);
document.getElementById("regionFilter").addEventListener("change",render);
document.getElementById("diffFilter").addEventListener("change",render);
render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
