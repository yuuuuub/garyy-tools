function setFilter(f,el){currentFilter=f;currentPage=1;document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});el.classList.add('active');filterList();}
function filterList(){
var q=document.getElementById('searchInput').value.trim().toLowerCase();
var sort=document.getElementById('sortSelect').value;
filteredData=data.filter(function(d){
if(q&&!d.c.includes(q)&&!d.p.toLowerCase().includes(q))return false;
if(currentFilter==='常用一级')return d.g==='常用一级';
if(currentFilter==='常用二级')return d.g==='常用二级';
if(currentFilter==='1-5画')return d.s>=1&&d.s<=5;
if(currentFilter==='6-10画')return d.s>=6&&d.s<=10;
if(currentFilter==='11-15画')return d.s>=11&&d.s<=15;
return true;});
filteredData.sort(function(a,b){if(sort==='strokes')return a.s-b.s;if(sort==='radical')return a.r.localeCompare(b.r);return a.f-b.f;});
document.getElementById('showCount').textContent=filteredData.length;
document.getElementById('totalCount').textContent=data.length;
renderPage();}
function renderPage(){
var start=(currentPage-1)*perPage;var pageData=filteredData.slice(start,start+perPage);
var html='';pageData.forEach(function(d){
html+='<tr><td class="char-cell">'+d.c+'</td><td>'+d.p+'</td><td>'+d.r+'</td><td>'+d.s+'画</td><td>'+d.st+'</td><td><span class="char-count">'+d.g+'</span></td></tr>';});
document.getElementById('listBody').innerHTML=html;
var totalPages=Math.ceil(filteredData.length/perPage);var pHtml='';
for(var i=1;i<=totalPages;i++){
pHtml+='<div class="page-btn'+(i===currentPage?' active':'')+'" onclick="goPage('+i+')">'+i+'</div>';}
document.getElementById('pagination').innerHTML=pHtml;}
function goPage(p){currentPage=p;renderPage();window.scrollTo({top:0,behavior:'smooth'});}
filterList();
