<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字排序 - 在线汉字排序练习</title>
<meta name="description" content="汉字排序 - 通过排序游戏学习汉字，支持拼音、笔画、部首等多种排序方式">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --blue: #3b82f6;
  --green: #238636;
  --red: #ef4444;
  --radius: 10px;
  --transition: 0.2s ease;
}
[data-theme="light"] {
  --bg: #f6f8fa;
  --card: #fff;
  --border: #d0d7de;
  --text: #1f2328;
  --text2: #656d76;
  --blue: #0969da;
  --green: #1a7f37;
  --red: #cf222e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  padding: 16px;
}
.container { max-width: 800px; margin: auto; }
h1 { text-align: center; padding: 24px 0 8px; font-size: 1.5rem; }
.sub { text-align: center; color: var(--text2); font-size: .85rem; margin-bottom: 20px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.btn {
  display: inline-block;
  padding: 10px 24px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: .9rem;
  margin-top: 12px;
  transition: var(--transition);
}
.btn:hover { opacity: .85; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.btn-secondary { background: var(--border); color: var(--text); }
.sort-container {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 16px 0;
  min-height: 100px;
  padding: 16px;
  background: var(--bg);
  border-radius: var(--radius);
  border: 2px dashed var(--border);
}
.sort-item {
  padding: 12px 20px;
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 8px;
  cursor: grab;
  transition: var(--transition);
  user-select: none;
  text-align: center;
}
.sort-item:hover {
  border-color: var(--blue);
  transform: translateY(-2px);
}
.sort-item.dragging {
  opacity: 0.5;
  border-color: var(--blue);
}
.sort-item.correct {
  border-color: var(--green);
  background: rgba(35,134,54,0.1);
}
.sort-item.wrong {
  border-color: var(--red);
  background: rgba(239,68,68,0.1);
}
.sort-item.pinyin {
  min-width: 80px;
}
.sort-item .char {
  font-size: 1.5rem;
  margin-bottom: 4px;
}
.sort-item .info {
  font-size: .8rem;
  color: var(--text2);
}
.sort-mode {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
.mode-btn {
  padding: 8px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: .85rem;
  transition: var(--transition);
}
.mode-btn:hover {
  border-color: var(--blue);
}
.mode-btn.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.difficulty-select {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
.difficulty-btn {
  padding: 8px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: .85rem;
  transition: var(--transition);
}
.difficulty-btn.active {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.reference-order {
  display: flex;
  gap: 8px;
  margin: 16px 0;
  padding: 12px;
  background: var(--bg);
  border-radius: 8px;
  flex-wrap: wrap;
}
.reference-item {
  padding: 8px 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: .9rem;
}
.reference-item .ref-char {
  font-weight: bold;
}
.reference-item .ref-info {
  font-size: .75rem;
  color: var(--text2);
}
.stats {
  display: flex;
  justify-content: space-around;
  margin: 16px 0;
  font-size: .9rem;
}
.stat { text-align: center; }
.stat-value { font-size: 1.2rem; font-weight: bold; color: var(--blue); }
.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin: 12px 0;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--green);
  transition: width 0.3s;
  border-radius: 3px;
}
.result-message {
  text-align: center;
  padding: 20px;
  margin: 16px 0;
  background: var(--bg);
  border-radius: 8px;
  display: none;
}
.result-message.show {
  display: block;
}
.result-message.success {
  border: 1px solid var(--green);
  color: var(--green);
}
.result-message.error {
  border: 1px solid var(--red);
  color: var(--red);
}
.char-list {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  margin: 16px 0;
}
.char-item {
  padding: 8px;
  text-align: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: var(--transition);
  font-size: 1.2rem;
}
.char-item:hover {
  border-color: var(--blue);
  background: var(--card);
}
.history {
  margin-top: 16px;
}
.history-item {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  font-size: .85rem;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
body, .container { animation: fadeIn .4s ease-out; }
@keyframes correctPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}
@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>📊 汉字排序</h1>
  <p class="sub">通过排序游戏学习汉字</p>

  <div class="card">
    <div class="sort-mode">
      <button class="mode-btn active" onclick="setMode('pinyin')">按拼音排序</button>
      <button class="mode-btn" onclick="setMode('stroke')">按笔画排序</button>
      <button class="mode-btn" onclick="setMode('radical')">按部首排序</button>
      <button class="mode-btn" onclick="setMode('meaning')">按释义排序</button>
    </div>
    <div class="difficulty-select">
      <button class="difficulty-btn active" onclick="setDifficulty(4)">4个</button>
      <button class="difficulty-btn" onclick="setDifficulty(6)">6个</button>
      <button class="difficulty-btn" onclick="setDifficulty(8)">8个</button>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="startSort()">开始排序</button>
      <button class="btn btn-secondary" onclick="shuffleItems()">打乱顺序</button>
      <button class="btn btn-secondary" onclick="checkOrder()">检查排序</button>
      <button class="btn btn-secondary" onclick="toggleTheme()">🌓 切换主题</button>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="stat-value" id="moves">0</div><div>移动次数</div></div>
      <div class="stat"><div class="stat-value" id="correct">0</div><div>正确位置</div></div>
      <div class="stat"><div class="stat-value" id="time">00:00</div><div>时间</div></div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressBar" style="width:0%"></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">正确顺序</h3>
    <div class="reference-order" id="referenceOrder"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">你的排序 (拖拽调整顺序)</h3>
    <div class="sort-container" id="sortContainer"></div>
  </div>

  <div class="result-message" id="resultMessage"></div>

  <div class="card">
    <h3 style="margin-bottom:12px">选择汉字</h3>
    <div class="char-list" id="charList"></div>
  </div>

  <div class="card history" id="historyCard" style="display:none">
    <h3 style="margin-bottom:12px">游戏记录</h3>
    <div id="history"></div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var characters = [
  {char:'永',pinyin:'yǒng',meaning:'永远',radical:'水',stroke:5},
  {char:'一',pinyin:'yī',meaning:'一个',radical:'一',stroke:1},
  {char:'二',pinyin:'èr',meaning:'两个',radical:'二',stroke:2},
  {char:'三',pinyin:'sān',meaning:'三个',radical:'一',stroke:3},
  {char:'四',pinyin:'sì',meaning:'四个',radical:'囗',stroke:5},
  {char:'五',pinyin:'wǔ',meaning:'五个',radical:'二',stroke:4},
  {char:'六',pinyin:'liù',meaning:'六个',radical:'八',stroke:4},
  {char:'七',pinyin:'qī',meaning:'七个',radical:'一',stroke:2},
  {char:'八',pinyin:'bā',meaning:'八个',radical:'八',stroke:2},
  {char:'九',pinyin:'jiǔ',meaning:'九个',radical:'乙',stroke:2},
  {char:'十',pinyin:'shí',meaning:'十个',radical:'十',stroke:2},
  {char:'大',pinyin:'dà',meaning:'大的',radical:'大',stroke:3},
  {char:'小',pinyin:'xiǎo',meaning:'小的',radical:'小',stroke:3},
  {char:'人',pinyin:'rén',meaning:'人类',radical:'人',stroke:2},
  {char:'口',pinyin:'kǒu',meaning:'嘴巴',radical:'口',stroke:3},
  {char:'日',pinyin:'rì',meaning:'太阳',radical:'日',stroke:4},
  {char:'月',pinyin:'yuè',meaning:'月亮',radical:'月',stroke:4},
  {char:'水',pinyin:'shuǐ',meaning:'水',radical:'水',stroke:4},
  {char:'火',pinyin:'huǒ',meaning:'火',radical:'火',stroke:4},
  {char:'木',pinyin:'mù',meaning:'树木',radical:'木',stroke:4},
  {char:'金',pinyin:'jīn',meaning:'金属',radical:'金',stroke:8},
  {char:'土',pinyin:'tǔ',meaning:'泥土',radical:'土',stroke:3},
  {char:'山',pinyin:'shān',meaning:'山',radical:'山',stroke:3},
  {char:'石',pinyin:'shí',meaning:'石头',radical:'石',stroke:5},
  {char:'田',pinyin:'tián',meaning:'田地',radical:'田',stroke:5},
  {char:'王',pinyin:'wáng',meaning:'国王',radical:'王',stroke:4},
  {char:'马',pinyin:'mǎ',meaning:'马',radical:'马',stroke:3},
  {char:'鸟',pinyin:'niǎo',meaning:'鸟',radical:'鸟',stroke:5},
  {char:'鱼',pinyin:'yú',meaning:'鱼',radical:'鱼',stroke:8},
  {char:'牛',pinyin:'niú',meaning:'牛',radical:'牛',stroke:4},
  {char:'羊',pinyin:'yáng',meaning:'羊',radical:'羊',stroke:6},
  {char:'龙',pinyin:'lóng',meaning:'龙',radical:'龙',stroke:5}
];

var sortMode = 'pinyin';
var difficulty = 4;
var items = [];
var correctOrder = [];
var moves = 0;
var seconds = 0;
var timer = null;
var gameActive = false;
var history = [];
var draggedItem = null;

function init() {
  renderCharList();
  startSort();
}

function setMode(mode) {
  sortMode = mode;
  document.querySelectorAll('.mode-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.textContent.includes(getModeLabel(mode)));
  });
  startSort();
}

function getModeLabel(mode) {
  var labels = {pinyin:'拼音',stroke:'笔画',radical:'部首',meaning:'释义'};
  return labels[mode] || mode;
}

function setDifficulty(count) {
  difficulty = count;
  document.querySelectorAll('.difficulty-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.textContent.includes(count + '个'));
  });
  startSort();
}

function renderCharList() {
  var html = '';
  characters.forEach(function(c) {
    html += '<div class="char-item" onclick="addChar(\'' + c.char + '\')">' + c.char + '</div>';
  });
  document.getElementById('charList').innerHTML = html;
}

function addChar(ch) {
  if(items.length >= 10) return;
  var charData = characters.find(function(c) { return c.char === ch; });
  if(charData && !items.some(function(i) { return i.char === ch; })) {
    items.push(charData);
    generateCorrectOrder();
    renderItems();
    renderReference();
  }
}

function startSort() {
  var shuffled = characters.slice().sort(function() { return Math.random() - 0.5; });
  items = shuffled.slice(0, difficulty);
  correctOrder = generateCorrectOrder();
  items = shuffleArray(items.slice());
  moves = 0;
  seconds = 0;
  gameActive = true;
  if(timer) clearInterval(timer);
  timer = setInterval(function() {
    seconds++;
    document.getElementById('time').textContent = formatTime(seconds);
  }, 1000);
  renderItems();
  renderReference();
  updateStats();
}

function generateCorrectOrder() {
  var sorted = items.slice();
  switch(sortMode) {
    case 'pinyin':
      sorted.sort(function(a, b) { return a.pinyin.localeCompare(b.pinyin); });
      break;
    case 'stroke':
      sorted.sort(function(a, b) { return a.stroke - b.stroke; });
      break;
    case 'radical':
      sorted.sort(function(a, b) { return a.radical.localeCompare(b.radical); });
      break;
    case 'meaning':
      sorted.sort(function(a, b) { return a.meaning.localeCompare(b.meaning); });
      break;
  }
  return sorted;
}

function renderItems() {
  var html = '';
  items.forEach(function(item, index) {
    var info = '';
    switch(sortMode) {
      case 'pinyin': info = item.pinyin; break;
      case 'stroke': info = item.stroke + '画'; break;
      case 'radical': info = item.radical; break;
      case 'meaning': info = item.meaning; break;
    }
    html += '<div class="sort-item pinyin" draggable="true" data-index="' + index + '" ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="drop(event)" ondragend="dragEnd(event)">';
    html += '<div class="char">' + item.char + '</div>';
    html += '<div class="info">' + info + '</div>';
    html += '</div>';
  });
  document.getElementById('sortContainer').innerHTML = html;
}

function renderReference() {
  var html = '';
  correctOrder.forEach(function(item) {
    var info = '';
    switch(sortMode) {
      case 'pinyin': info = item.pinyin; break;
      case 'stroke': info = item.stroke + '画'; break;
      case 'radical': info = item.radical; break;
      case 'meaning': info = item.meaning; break;
    }
    html += '<div class="reference-item">';
    html += '<div class="ref-char">' + item.char + '</div>';
    html += '<div class="ref-info">' + info + '</div>';
    html += '</div>';
  });
  document.getElementById('referenceOrder').innerHTML = html;
}

function dragStart(e) {
  draggedItem = e.target;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function dragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function drop(e) {
  e.preventDefault();
  if(draggedItem === e.target) return;
  var fromIndex = parseInt(draggedItem.dataset.index);
  var toIndex = parseInt(e.target.closest('.sort-item').dataset.index);
  var temp = items[fromIndex];
  items[fromIndex] = items[toIndex];
  items[toIndex] = temp;
  moves++;
  renderItems();
  updateStats();
}

function dragEnd(e) {
  e.target.classList.remove('dragging');
  draggedItem = null;
}

function shuffleItems() {
  items = shuffleArray(items);
  moves++;
  renderItems();
  updateStats();
}

function checkOrder() {
  var isCorrect = true;
  var correctCount = 0;
  var sortItems = document.querySelectorAll('.sort-item');
  items.forEach(function(item, index) {
    if(item.char === correctOrder[index].char) {
      correctCount++;
      sortItems[index].classList.add('correct');
      sortItems[index].classList.remove('wrong');
      sortItems[index].style.animation = 'correctPulse 0.3s';
    } else {
      isCorrect = false;
      sortItems[index].classList.add('wrong');
      sortItems[index].classList.remove('correct');
      sortItems[index].style.animation = 'wrongShake 0.3s';
    }
  });
  updateStats();
  if(isCorrect) {
    gameComplete();
  }
}

function gameComplete() {
  clearInterval(timer);
  gameActive = false;
  var msg = document.getElementById('resultMessage');
  msg.className = 'result-message show success';
  msg.innerHTML = '🎉 恭喜! 排序正确!<br>移动次数: ' + moves + ' | 时间: ' + formatTime(seconds);
  addToHistory();
}

function updateStats() {
  document.getElementById('moves').textContent = moves;
  var correctCount = 0;
  items.forEach(function(item, index) {
    if(item.char === correctOrder[index].char) correctCount++;
  });
  document.getElementById('correct').textContent = correctCount;
  document.getElementById('progressBar').style.width = ((correctCount / items.length) * 100) + '%';
}

function addToHistory() {
  history.unshift({
    mode: getModeLabel(sortMode),
    count: difficulty,
    moves: moves,
    time: formatTime(seconds),
    date: new Date().toLocaleString()
  });
  if(history.length > 10) history.pop();
  renderHistory();
}

function renderHistory() {
  if(history.length === 0) {
    document.getElementById('historyCard').style.display = 'none';
    return;
  }
  document.getElementById('historyCard').style.display = 'block';
  var html = '';
  history.forEach(function(h) {
    html += '<div class="history-item">';
    html += '<span>' + h.mode + ' ' + h.count + '个</span>';
    html += '<span>' + h.moves + '次 ' + h.time + '</span>';
    html += '<span style="color:var(--text2)">' + h.date + '</span>';
    html += '</div>';
  });
  document.getElementById('history').innerHTML = html;
}

function shuffleArray(arr) {
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = a[i];
    a[i] = a[j];
    a[j] = temp;
  }
  return a;
}

function formatTime(s) {
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
}

function toggleTheme() {
  var html = document.documentElement;
  var current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
}

init();
</script>
</body>
</html>
