<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>性能测试</title>
<meta name="description" content="设备性能测试工具，检测手机运行速度">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#238636;--red:#da3633;--yellow:#9e6a03;--dim:#8b949e}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:20pxscroll-behavior:smooth;}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--dim);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
input[type=text]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:14px}
textarea{width:100%;min-height:120px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:12px;font-family:'Fira Code',monospace;font-size:13px;resize:vertical}
button{background:var(--accent);color:var(--text);border:none;border-radius:6px;padding:10px 20px;font-size:14px;cursor:pointer;font-weight:600;transition:opacity .2s}
button:hover{opacity:.85}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.results{display:none;margin-top:16px}
.metric{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
.metric:last-child{border-bottom:none}
.metric-label{color:var(--dim)}
.metric-value{font-weight:600}
.good{color:var(--green)}
.warn{color:var(--yellow)}
.bad{color:var(--red)}
.summary{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.summary-item{padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600}
.s-good{background:#23863633;color:var(--green)}
.s-warn{background:#9e6a0333;color:var(--yellow)}
.s-bad{background:#da363333;color:var(--red)}
.tip{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px 12px;margin-top:8px;font-size:12px;color:var(--dim);line-height:1.5}
.tip-title{color:var(--accent);font-weight:600;margin-bottom:4px}
.progress{width:100%;height:4px;background:var(--border);border-radius:2px;margin-top:12px;overflow:hidden;display:none}
.progress-bar{height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width .3s}
@media(max-width:600px){textarea{min-height:100px}}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);outline:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="性能测试">
  <meta property="og:description" content="设备性能测试工具，检测手机运行速度">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/performance-tester/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>⚡ 性能测试</h1>
<p class="subtitle">分析页面DOM、资源和性能指标，提供优化建议</p>

<div class="card">
<h2 style="margin-bottom:12px">分析模式</h2>
<div class="btn-row">
<button onclick="analyzeCurrentPage()">分析当前页面</button>
<button onclick="showCustomInput()" style="background:var(--border)">粘贴HTML分析</button>
<button onclick="analyzeUrl()" style="background:var(--border)">输入URL分析</button>
</div>
</div>

<div class="card" id="customInput" style="display:none">
<h2 style="margin-bottom:12px">粘贴HTML代码</h2>
<textarea id="htmlInput" placeholder="在此粘贴 HTML 代码..."></textarea>
<div class="btn-row">
<button onclick="analyzeHtml()">分析</button>
</div>
</div>

<div class="card" id="urlInput" style="display:none">
<h2 style="margin-bottom:12px">输入URL</h2>
<input type="text" id="urlField" placeholder="https://example.com" title="Enter键搜索">
<div class="btn-row">
<button onclick="fetchAndAnalyze()">获取并分析</button>
</div>
</div>

<div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>

<div class="results" id="results">
<div class="card">
<div class="summary" id="summary"></div>
<div id="resultList"></div>
</div>

<div class="card" id="tipsCard" style="display:none">
<h2 style="margin-bottom:12px">💡 优化建议</h2>
<div id="tipsList"></div>
</div>
</div>
</div>

<script>
function showCustomInput(){document.getElementById('customInput').style.display='block';document.getElementById('urlInput').style.display='none';}
function showUrlInput(){document.getElementById('urlInput').style.display='block';document.getElementById('customInput').style.display='none';}
function showCustomInput2(){document.getElementById('customInput').style.display='block';}
function showUrlInput2(){document.getElementById('urlInput').style.display='block';}
document.querySelector('[onclick="showCustomInput()"]').onclick=showCustomInput2;
document.querySelector('[onclick="analyzeUrl()"]').onclick=showUrlInput2;
function analyzeCurrentPage(){
const perf=performance;
const nav=perf.getEntriesByType('navigation')[0];
const resources=perf.getEntriesByType('resource');
const dom=document.documentElement.outerHTML;
const result=analyzeHtmlContent(dom);
if(nav){
result.metrics.push({label:'DNS 查询时间',value:Math.round(nav.domainLookupEnd-nav.domainLookupStart)+'ms',score:nav.domainLookupEnd-nav.domainLookupStart<50?'good':nav.domainLookupEnd-nav.domainLookupStart<200?'warn':'bad'});
result.metrics.push({label:'TCP 连接时间',value:Math.round(nav.connectEnd-nav.connectStart)+'ms',score:nav.connectEnd-nav.connectStart<100?'good':nav.connectEnd-nav.connectStart<300?'warn':'bad'});
result.metrics.push({label:'首字节时间 (TTFB)',value:Math.round(nav.responseStart-nav.requestStart)+'ms',score:nav.responseStart-nav.requestStart<200?'good':nav.responseStart-nav.requestStart<500?'warn':'bad'});
result.metrics.push({label:'页面加载总时间',value:Math.round(nav.loadEventEnd-nav.startTime)+'ms',score:nav.loadEventEnd-nav.startTime<1000?'good':nav.loadEventEnd-nav.startTime<3000?'warn':'bad'});
}
result.metrics.push({label:'资源数量',value:resources.length+'个',score:resources.length<30?'good':resources.length<60?'warn':'bad'});
const totalSize=resources.reduce((a,r)=>a+(r.transferSize||0),0);
result.metrics.push({label:'资源总大小',value:formatSize(totalSize),score:totalSize<500000?'good':totalSize<2000000?'warn':'bad'});
showResults(result);
}
function analyzeHtml(){
const html=document.getElementById('htmlInput').value;
if(!html.trim()){document.getElementById('results').innerHTML='<div style="text-align:center;padding:40px;color:var(--red)">请输入HTML代码</div>';document.getElementById('results').style.display='block';return;}
const result=analyzeHtmlContent(html);
showResults(result);
}
async function fetchAndAnalyze(){
const url=document.getElementById('urlField').value;
if(!url.trim()){document.getElementById('results').innerHTML='<div style="text-align:center;padding:40px;color:var(--red)">请输入URL</div>';document.getElementById('results').style.display='block';return;}
document.getElementById('progress').style.display='block';
document.getElementById('progressBar').style.width='30%';
try{
const resp=await fetch(url);
document.getElementById('progressBar').style.width='70%';
const html=await resp.text();
document.getElementById('progressBar').style.width='100%';
setTimeout(()=>{document.getElementById('progress').style.display='none';},500);
const result=analyzeHtmlContent(html);
result.metrics.unshift({label:'页面大小',value:formatSize(new Blob([html]).size),score:new Blob([html]).size<50000?'good':new Blob([html]).size<200000?'warn':'bad'});
result.metrics.unshift({label:'HTTP状态',value:resp.status+' '+resp.statusText,score:resp.ok?'good':'bad'});
showResults(result);
}catch(e){
document.getElementById('progress').style.display='none';
document.getElementById('results').innerHTML='<div style="text-align:center;padding:40px;color:var(--red)">获取失败: '+e.message+'</div>';
document.getElementById('results').style.display='block';
}
}
function analyzeHtmlContent(html){
const parser=new DOMParser();
const doc=parser.parseFromString(html,'text/html');
const metrics=[];
const tips=[];
const domCount=doc.querySelectorAll('*').length;
metrics.push({label:'DOM 节点数',value:domCount,score:domCount<1500?'good':domCount<3000?'warn':'bad'});
if(domCount>1500)tips.push({title:'DOM节点过多',text:`当前有 ${domCount} 个DOM节点，建议控制在1500以内。过深的DOM树会增加渲染时间和内存占用。考虑使用虚拟滚动或延迟加载。`});
const depth=getDomDepth(doc.body);
metrics.push({label:'DOM 深度',value:depth+'层',score:depth<15?'good':depth<25?'warn':'bad'});
if(depth>15)tips.push({title:'DOM嵌套过深',text:`DOM深度为${depth}层，建议不超过15层。过深的嵌套会影响布局计算和CSS选择器性能。`});
const imgs=doc.querySelectorAll('img');
metrics.push({label:'图片数量',value:imgs.length+'张',score:imgs.length<20?'good':imgs.length<50?'warn':'bad'});
let missingAlt=0;
imgs.forEach(img=>{if(!img.hasAttribute('alt'))missingAlt++;});
if(missingAlt>0){
metrics.push({label:'缺少alt的图片',value:missingAlt+'张',score:'bad'});
tips.push({title:'图片缺少alt属性',text:`${missingAlt}张图片缺少alt属性。搜索引擎和屏幕阅读器需要alt来理解图片内容。`});
}
const scripts=doc.querySelectorAll('script');
const inlineScripts=Array.from(scripts).filter(s=>!s.src).length;
const externalScripts=Array.from(scripts).filter(s=>s.src).length;
metrics.push({label:'外部脚本',value:externalScripts+'个',score:externalScripts<5?'good':externalScripts<10?'warn':'bad'});
metrics.push({label:'内联脚本',value:inlineScripts+'个',score:inlineScripts<3?'good':inlineScripts<8?'warn':'bad'});
if(externalScripts>5)tips.push({title:'外部脚本过多',text:`有${externalScripts}个外部脚本，会增加HTTP请求和解析时间。考虑合并或使用异步加载。`});
const styles=doc.querySelectorAll('style');
const styleLinks=doc.querySelectorAll('link[rel="stylesheet"]');
metrics.push({label:'样式表数量',value:styleLinks.length+'个',score:styleLinks.length<5?'good':styleLinks.length<10?'warn':'bad'});
const links=doc.querySelectorAll('a');
let noHref=0;
links.forEach(a=>{if(!a.href)noHref++;});
if(noHref>0)metrics.push({label:'无href链接',value:noHref+'个',score:'warn'});
const headings=['h1','h2','h3','h4','h5','h6'];
let headingIssues=0;
let lastLevel=0;
headings.forEach((h,i)=>{
doc.querySelectorAll(h).forEach(el=>{
const level=i+1;
if(lastLevel>0&&level>lastLevel+1)headingIssues++;
lastLevel=level;
});
});
if(headingIssues>0){
metrics.push({label:'标题层级问题',value:headingIssues+'处',score:'warn'});
tips.push({title:'标题层级不连续',text:'标题层级跳跃（如h1直接到h3），影响SEO和屏幕阅读器的页面结构理解。'});
}
const forms=doc.querySelectorAll('form');
let unlabeled=0;
forms.forEach(form=>{
form.querySelectorAll('input,select,textarea').forEach(input=>{
if(input.type==='hidden'||input.type==='submit'||input.type==='button')return;
const id=input.id;
const hasLabel=id?doc.querySelector(`label[for="${id}"]`):false;
if(!hasLabel&&!input.getAttribute('aria-label'))unlabeled++;
});
});
if(unlabeled>0){
metrics.push({label:'未标记表单字段',value:unlabeled+'个',score:'warn'});
tips.push({title:'表单字段缺少标签',text:`${unlabeled}个表单输入框缺少关联的label或aria-label。`});
}
const inlineStyles=html.match(/style\s*=/gi)||[];
metrics.push({label:'内联样式',value:inlineStyles.length+'处',score:inlineStyles.length<5?'good':inlineStyles.length<15?'warn':'bad'});
if(inlineStyles.length>5)tips.push({title:'内联样式过多',text:`有${inlineStyles.length}处内联样式，建议提取到CSS文件中以提高可维护性和缓存效率。`});
const htmlSize=new Blob([html]).size;
metrics.push({label:'HTML大小',value:formatSize(htmlSize),score:htmlSize<10000?'good':htmlSize<50000?'warn':'bad'});
if(htmlSize>10000)tips.push({title:'HTML体积较大',text:`HTML文件大小为${formatSize(htmlSize)}，建议压缩并精简不必要的标记。`});
return{metrics,tips};
}
function getDomDepth(el){
if(!el||!el.children||el.children.length===0)return 1;
let max=0;
Array.from(el.children).forEach(child=>{
max=Math.max(max,getDomDepth(child));
});
return max+1;
}
function formatSize(bytes){
if(bytes===0)return'0 B';
const k=1024;
const sizes=['B','KB','MB','GB'];
const i=Math.floor(Math.log(bytes)/Math.log(k));
return parseFloat((bytes/Math.pow(k,i)).toFixed(1))+' '+sizes[i];
}
function showResults(result){
document.getElementById('results').style.display='block';
const goods=result.metrics.filter(m=>m.score==='good').length;
const warns=result.metrics.filter(m=>m.score==='warn').length;
const bads=result.metrics.filter(m=>m.score==='bad').length;
let summaryHtml='';
if(bads===0&&warns===0)summaryHtml+=`<div class="summary-item s-good">✅ 性能良好</div>`;
if(bads>0)summaryHtml+=`<div class="summary-item s-bad">❌ ${bads} 个严重问题</div>`;
if(warns>0)summaryHtml+=`<div class="summary-item s-warn">⚠️ ${warns} 个警告</div>`;
if(goods>0)summaryHtml+=`<div class="summary-item s-good">✅ ${goods} 项通过</div>`;
document.getElementById('summary').innerHTML=summaryHtml;
let html='';
result.metrics.forEach(m=>{
const cls=m.score==='good'?'good':m.score==='warn'?'warn':'bad';
html+=`<div class="metric"><span class="metric-label">${m.label}</span><span class="metric-value ${cls}">${m.value}</span></div>`;
});
document.getElementById('resultList').innerHTML=html;
const tipsCard=document.getElementById('tipsCard');
const tipsList=document.getElementById('tipsList');
if(result.tips.length>0){
tipsCard.style.display='block';
let tipsHtml='';
result.tips.forEach(t=>{
tipsHtml+=`<div class="tip"><div class="tip-title">${t.title}</div>${t.text}</div>`;
});
tipsList.innerHTML=tipsHtml;
}else{
tipsCard.style.display='none';
}
}
</script>
<script src="../i18n.js" defer>
document.getElementById("urlField").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();analyzeCurrentPage();}});

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
