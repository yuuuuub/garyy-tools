<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>密码强度检测</title><meta name="description" content="密码强度检测 - 在线检查密码安全等级"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>"><meta name="robots" content="index, follow"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--orange:#d2991d;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#9a6700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:600px;margin:auto}h1{text-align:center;padding:20px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-wrap{position:relative}input[type=password],input[type=text]{width:100%;padding:14px 50px 14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1.1rem;font-family:monospace;outline:none}input:focus{border-color:var(--blue)}.toggle-vis{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.2rem;opacity:.6}.toggle-vis:hover{opacity:1}.strength-bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;margin:16px 0 8px}.strength-fill{height:100%;border-radius:4px;transition:width .3s,background .3s}.strength-label{font-size:.9rem;font-weight:600;margin-bottom:16px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:6px;font-size:.82rem}.check-icon{font-size:1rem}.score-bar{display:flex;gap:4px;margin:12px 0}.score-dot{width:20px;height:8px;border-radius:4px;background:var(--border);transition:background .3s}.score-dot.filled{background:var(--blue)}.gen-btn{display:inline-block;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.82rem;margin-top:8px}.gen-btn:hover{opacity:.85}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<meta property="og:title" content="密码强度检测">
<meta property="og:description" content="密码强度检测 - 在线检查密码安全等级">
<meta property="og:image" content="/og-default.png">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔐 密码强度检测</h1><p class="sub">检测密码安全等级并提供改进建议</p>
<div class="card">
<div class="input-wrap"><input type="password" id="pwd" placeholder="输入密码查看强度" oninput="check()"><span class="toggle-vis" onclick="toggleVis()">👁️</span></div>
<div class="strength-bar"><div class="strength-fill" id="bar"></div></div>
<div class="strength-label" id="label">请输入密码</div>
<div class="score-bar" id="scoreBar"></div>
<div class="checks" id="checks"></div>
<div style="margin-top:16px;text-align:center"><button class="gen-btn" onclick="generate()">🎲 生成强密码</button></div></div></div>
<script src="../i18n.js" defer></script>
<script>
function toggleVis(){var p=document.getElementById('pwd');p.type=p.type==='password'?'text':'password';}
function check(){
  var pwd=document.getElementById('pwd').value;
  var score=0;
  var rules=[
    {id:'len',label:'8个以上字符',test:pwd.length>=8},
    {id:'upper',label:'包含大写字母',test:/[A-Z]/.test(pwd)},
    {id:'lower',label:'包含小写字母',test:/[a-z]/.test(pwd)},
    {id:'digit',label:'包含数字',test:/\d/.test(pwd)},
    {id:'special',label:'包含特殊字符',test:/[^A-Za-z0-9]/.test(pwd)},
    {id:'long',label:'12个以上字符',test:pwd.length>=12},
    {id:'nocommon',label:'不是常见密码',test:!['123456','password','qwerty','111111','abc123'].includes(pwd)},
    {id:'mixed',label:'大小写+数字混合',test:/[A-Z]/.test(pwd)&&/[a-z]/.test(pwd)&&/\d/.test(pwd)}
  ];
  rules.forEach(function(r){if(r.test)score++;});
  var pct=score/8*100;
  var level,color;
  if(!pwd){level='请输入密码';color='var(--text2)';pct=0;}
  else if(score<=2){level='弱 - 容易被破解';color='var(--red)';}
  else if(score<=4){level='中等 - 建议加强';color='var(--orange)';}
  else if(score<=6){level='强 - 安全性不错';color='var(--blue)';}
  else{level='非常强 - 高度安全';color='var(--green)';}
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('bar').style.background=color;
  document.getElementById('label').textContent=level;
  document.getElementById('label').style.color=color;
  var scoreHtml='';for(var i=0;i<8;i++)scoreHtml+='<div class="score-dot'+(i<score?' filled':'')+'" style="background:'+(i<score?color:'')+'"></div>';
  document.getElementById('scoreBar').innerHTML=scoreHtml;
  var checksHtml='';rules.forEach(function(r){checksHtml+='<div class="check-item"><span class="check-icon">'+(r.test?'✅':'❌')+'</span><span>'+r.label+'</span></div>';});
  document.getElementById('checks').innerHTML=checksHtml;
}
function generate(){
  var chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
  var pwd='';for(var i=0;i<16;i++)pwd+=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('pwd').value=pwd;document.getElementById('pwd').type='text';check();
  navigator.clipboard.writeText(pwd).then(function(){garyyToast('密码已生成并复制','success')}).catch(function(){});
}
check();
</script></body></html>
