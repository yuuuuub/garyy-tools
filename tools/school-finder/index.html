<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学校查找 - School Finder</title>
<meta name="description" content="学校查找工具，帮你找到附近的学校和教育机构">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#22c55e;--yellow:#eab308;--muted:#8b949e}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vhpadding:16px;scroll-behavior:smooth;}
.container{max-width:1200px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 0}
header h1{font-size:1.8em;margin-bottom:4px}
header p{color:var(--muted)}
.filters{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.filter-group label{font-size:12px;color:var(--muted);font-weight:600}
.filter-group input,.filter-group select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px;width:100%}
.filter-group input:focus,.filter-group select:focus{outline:none;border-color:var(--accent)}
.cat-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cat-tab{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s}
.cat-tab.active{background:var(--accent);border-color:var(--accent);color:var(--text)}
.sort-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.sort-bar span{color:var(--muted);font-size:14px}
.sort-options{display:flex;gap:8px}
.sort-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.sort-btn.active{background:var(--accent);border-color:var(--accent)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card h3{font-size:16px;margin-bottom:6px}
.card-cat{font-size:11px;padding:3px 8px;border-radius:12px;display:inline-block;margin-bottom:8px}
.cat-kindergarten{background:rgba(251,146,60,.15);color:#fb923c}
.cat-primary{background:rgba(34,197,94,.15);color:var(--green)}
.cat-secondary{background:rgba(59,130,246,.15);color:var(--accent)}
.cat-university{background:rgba(168,85,247,.15);color:#a855f7}
.card-info{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);margin-bottom:10px}
.card-info span{display:flex;align-items:center;gap:6px}
.rating{color:var(--yellow);font-weight:600}
.desc{font-size:13px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.no-results{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:640px){.results{grid-template-columns:1fr}.filters{flex-direction:column}}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="学校查找 - School Finder">
  <meta property="og:description" content="学校查找工具，帮你找到附近的学校和教育机构">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/school-finder/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>🏫 学校查找</h1><p>查找附近学校，了解教育信息</p></header>
<div class="filters">
<div class="filter-group" style="flex:2"><label>搜索</label><input type="text" id="search" placeholder="输入学校名称或地址..."></div>
<div class="filter-group"><label>性质</label><select id="natureFilter"><option value="">全部</option><option value="公立">公立</option><option value="私立">私立</option><option value="国际">国际</option></select></div>
</div>
<div class="cat-tabs"><button class="cat-tab active" data-cat="">全部</button><button class="cat-tab" data-cat="kindergarten">🎓 幼儿园</button><button class="cat-tab" data-cat="primary">📚 小学</button><button class="cat-tab" data-cat="secondary">📖 中学</button><button class="cat-tab" data-cat="university">🎓 大学</button></div>
<div class="sort-bar"><span id="resultCount"></span><div class="sort-options"><button class="sort-btn active" data-sort="rating">评分优先</button><button class="sort-btn" data-sort="capacity">容量优先</button><button class="sort-btn" data-sort="name">名称排序</button></div></div>
<div class="results" id="results"></div>
</div>
<script>
const schools=[
{id:1,name:"北京师范大学附属幼儿园",address:"海淀区新街口外大街19号",category:"kindergarten",nature:"公立",rating:4.8,capacity:300,phone:"010-58801234",description:"北师大直属，优质学前教育"},
{id:2,name:"北京市实验小学",address:"西城区南新华街17号",category:"primary",nature:"公立",rating:4.7,capacity:1200,phone:"010-63033951",description:"百年名校，北京市重点小学"},
{id:3,name:"人大附中",address:"海淀区中关村大街37号",category:"secondary",nature:"公立",rating:4.9,capacity:3000,phone:"010-62512054",description:"全国顶尖中学，高考成绩名列前茅"},
{id:4,name:"清华大学",address:"海淀区清华园1号",category:"university",nature:"公立",rating:4.9,capacity:50000,phone:"010-62793001",description:"中国顶尖高等学府，世界一流大学"},
{id:5,name:"北京德威英国国际学校",address:"顺义区后沙峪镇安华街9号",category:"kindergarten",nature:"国际",rating:4.6,capacity:500,phone:"010-64508888",description:"英式课程体系，国际化教育"},
{id:6,name:"中关村第三小学",address:"海淀区中关村南大街12号",category:"primary",nature:"公立",rating:4.6,capacity:1500,phone:"010-62556888",description:"海淀区优质小学，注重素质教育"},
{id:7,name:"北京四中",address:"西城区西黄城根北街2号",category:"secondary",nature:"公立",rating:4.8,capacity:2500,phone:"010-66175566",description:"百年名校，北京市重点中学"},
{id:8,name:"北京大学",address:"海淀区颐和园路5号",category:"university",nature:"公立",rating:4.9,capacity:45000,phone:"010-62752114",description:"中国最高学府之一，综合性研究型大学"},
{id:9,name:"王府学校(双语幼儿园)",address:"昌平区北七家镇王府街11号",category:"kindergarten",nature:"私立",rating:4.4,capacity:400,phone:"010-60782288",description:"中英双语教学，注重个性发展"},
{id:10,name:"北京市育才学校",address:"东城区西晓市街53号",category:"secondary",nature:"公立",rating:4.5,capacity:2800,phone:"010-67053165",description:"十二年一贯制学校，教育教学质量优异"}
];
let currentCat="",currentSort="rating";
const catLabels={kindergarten:"幼儿园",primary:"小学",secondary:"中学",university:"大学"};
function render(){
const q=document.getElementById("search").value.toLowerCase();
const nf=document.getElementById("natureFilter").value;
let filtered=schools.filter(s=>{
if(q&&!s.name.includes(q)&&!s.address.includes(q))return false;
if(currentCat&&s.category!==currentCat)return false;
if(nf&&s.nature!==nf)return false;
return true;
});
filtered.sort({rating:(a,b)=>b.rating-a.rating,capacity:(a,b)=>b.capacity-a.capacity,name:(a,b)=>a.name.localeCompare(b.name,"zh")}[currentSort]||(a,b)=>b.rating-a.rating);
document.getElementById("resultCount").textContent=`找到 ${filtered.length} 所学校`;
const c=document.getElementById("results");
if(!filtered.length){c.innerHTML='<div class="no-results"><p>未找到符合条件的学校</p></div>';return}
c.innerHTML=filtered.map(s=>`<div class="card"><h3>${s.name}</h3><span class="card-cat cat-${s.category}">${catLabels[s.category]} · ${s.nature}</span><div class="card-info"><span>📍 ${s.address}</span><span>📞 ${s.phone}</span><span class="rating">⭐ ${s.rating}</span><span>👥 容量：${s.capacity}人</span></div><p class="desc">${s.description}</p></div>`).join("")
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("natureFilter").addEventListener("change",render);
document.querySelectorAll(".cat-tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".cat-tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentCat=b.dataset.cat;render()}));
document.querySelectorAll(".sort-btn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".sort-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentSort=b.dataset.sort;render()}));
render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
