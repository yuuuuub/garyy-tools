<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💡 头脑风暴模板</title>
<meta name="description" content="头脑风暴模板工具，可视化收集和组织创意想法">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
button.grn{background:var(--green)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.idea-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.idea-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;position:relative;transition:transform .2s}
.idea-card:hover{transform:translateY(-2px)}
.idea-card .text{font-size:.95rem;margin-bottom:8px}
.idea-card .votes{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--text2)}
.vote-btn{background:none;border:none;cursor:pointer;font-size:1.2rem;padding:2px 6px;border-radius:4px}
.vote-btn:hover{background:var(--border)}
.idea-card .cat{position:absolute;top:8px;right:8px;font-size:.7rem;padding:2px 8px;border-radius:10px;font-weight:600}
.cat-tech{background:rgba(59,130,246,.2);color:var(--accent)}
.cat-design{background:rgba(168,85,247,.2);color:#a855f7}
.cat-biz{background:rgba(63,185,80,.2);color:var(--green)}
.cat-other{background:rgba(210,153,34,.2);color:var(--yellow)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.hidden{display:none!important}
.remove-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:.85rem;position:absolute;bottom:8px;right:8px}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){background:var(--border)}
@media(max-width:600px){body{padding:10px}.ctn{max-width:100%}.cd{padding:14px}h1{font-size:1.4rem}.idea-board{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="💡 头脑风暴模板">
<meta property="og:description" content="头脑风暴模板工具，可视化收集和组织创意想法">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/brainstorm-template-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='brainstorm_data';
let sessions=JSON.parse(localStorage.getItem(STORE)||'[]');
let curSession=null,filter='all';
function save(){localStorage.setItem(STORE,JSON.stringify(sessions))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function render(){
  let h=`<div class="hdr"><h1>💡 头脑风暴模板</h1><p>可视化收集和组织创意想法</p></div>`;
  h+=`<div class="flex" style="justify-content:center;margin-bottom:16px"><button onclick="newSession()">新建脑暴</button><button class="sec" onclick="curSession=null;render()">全部会话</button></div>`;
  h+=`<div id="viewMain"></div>`;
  $('app').innerHTML=h;
  if(curSession)renderBoard();else renderSessions();
}
function renderSessions(){
  let h=`<div class="cd">`;
  if(!sessions.length){h+=`<p class="empty">暂无脑暴会话，点击"新建脑暴"开始</p>`}
  sessions.slice().reverse().forEach(s=>{
    h+=`<div class="flex-between" style="padding:12px;border-bottom:1px solid var(--border);cursor:pointer" onclick="openSession('${s.id}')">`;
    h+=`<div><b>${s.name}</b><div style="font-size:.8rem;color:var(--text2)">${s.ideas?s.ideas.length:0}个想法 · ${s.date}</div></div>`;
    h+=`<button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="event.stopPropagation();delSession('${s.id}')">删除</button></div>`;
  });
  h+=`</div>`;$('viewMain').innerHTML=h;
}
function newSession(){
  const name=prompt('脑暴会话名称：');
  if(!name)return;
  sessions.push({id:uid(),name,date:new Date().toLocaleDateString('zh-CN'),ideas:[]});
  save();curSession=sessions[sessions.length-1].id;render();
}
function openSession(id){curSession=id;render()}
function delSession(id){if(!confirm('确定删除?'))return;sessions=sessions.filter(s=>s.id!==id);save();curSession=null;render()}
function getSession(){return sessions.find(s=>s.id===curSession)}
function renderBoard(){
  const s=getSession();if(!s){curSession=null;render();return}
  const cats=['all','tech','design','biz','other'];
  const catNames={all:'全部',tech:'技术',design:'设计',biz:'商业',other:'其他'};
  let h=`<div class="cd"><h2>${s.name}</h2>`;
  h+=`<div class="tabs">`;
  cats.forEach(c=>{h+=`<div class="tab ${filter===c?'active':''}" onclick="filter='${c}';renderBoard()">${catNames[c]}</div>`});
  h+=`</div>`;
  h+=`<div class="flex"><input id="ideaText" placeholder="输入新想法..." style="flex:1;margin-bottom:0">`;
  h+=`<select id="ideaCat" style="width:auto;margin-bottom:0"><option value="tech">技术</option><option value="design">设计</option><option value="biz">商业</option><option value="other">其他</option></select>`;
  h+=`<button onclick="addIdea()">添加</button></div></div>`;
  const ideas=(s.ideas||[]).filter(i=>filter==='all'||i.cat===filter);
  h+=`<div class="idea-board">`;
  if(!ideas.length)h+=`<p class="empty" style="grid-column:1/-1">暂无想法</p>`;
  ideas.forEach(idea=>{
    h+=`<div class="idea-card"><span class="cat cat-${idea.cat}">${catNames[idea.cat]||idea.cat}</span>`;
    h+=`<div class="text">${idea.text}</div>`;
    h+=`<div class="votes"><button class="vote-btn" onclick="vote('${s.id}','${idea.id}',-1)">👎</button><span>${idea.votes||0}</span><button class="vote-btn" onclick="vote('${s.id}','${idea.id}',1)">👍</button></div>`;
    h+=`<button class="remove-btn" onclick="removeIdea('${s.id}','${idea.id}')">✕</button></div>`;
  });
  h+=`</div><div class="bg"><button class="sec" onclick="curSession=null;render()">返回</button></div></div>`;
  $('viewMain').innerHTML=h;
}
function addIdea(){
  const s=getSession();const text=$('ideaText').value.trim();if(!text)return;
  s.ideas=s.ideas||[];s.ideas.push({id:uid(),text,cat:$('ideaCat').value,votes:0});
  save();renderBoard();
}
function vote(sid,iid,delta){
  const s=sessions.find(x=>x.id===sid);if(!s)return;
  const idea=s.ideas.find(i=>i.id===iid);if(!idea)return;
  idea.votes=(idea.votes||0)+delta;save();renderBoard();
}
function removeIdea(sid,iid){
  const s=sessions.find(x=>x.id===sid);if(!s)return;
  s.ideas=s.ideas.filter(i=>i.id!==iid);save();renderBoard();
}
render();
</script>
</body>
</html>
