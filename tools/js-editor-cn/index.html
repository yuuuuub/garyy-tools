<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文JS编辑器</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px}
nav a{color:var(--accent2);text-decoration:none;font-size:14px}
nav h1{font-size:18px;font-weight:600}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar button{background:var(--border);color:var(--text);border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .2s}
.toolbar button:hover{background:var(--accent)}
.toolbar button.success{background:var(--success)}
.toolbar button.danger{background:var(--error)}
.toolbar .spacer{flex:1}
.panels{display:flex;flex:1;overflow:hidden}
.panel{flex:1;display:flex;flex-direction:column}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 16px;font-size:13px;color:#8b949e;display:flex;justify-content:space-between;align-items:center}
#editor{flex:1;width:100%;background:var(--bg);color:var(--text);border:none;padding:16px;font-size:14px;line-height:1.6;font-family:"SF Mono",Monaco,Consolas,monospace;resize:none;outline:none;tab-size:2}
#console{flex:1;background:#010409;color:var(--text);border:none;padding:16px;font-size:13px;line-height:1.6;font-family:"SF Mono",Monaco,Consolas,monospace;resize:none;outline:none;overflow:auto;white-space:pre-wrap}
.divider{width:4px;background:var(--border);cursor:col-resize;flex-shrink:0}
.log-entry{padding:4px 8px;border-bottom:1px solid var(--border);font-family:"SF Mono",Monaco,Consolas,monospace;font-size:13px}
.log-entry.log{color:var(--text)}
.log-entry.warn{color:var(--warning);background:rgba(210,153,34,0.1)}
.log-entry.error{color:var(--error);background:rgba(248,81,73,0.1)}
.log-entry.info{color:var(--accent2)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--success);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
@media(max-width:768px){.panels{flex-direction:column}.divider{width:100%;height:4px;cursor:row-resize}}
</style>
</head>
<body>
<nav>
  <a href="../index.html">← 返回</a>
  <h1>中文JS编辑器</h1>
</nav>
<div class="toolbar">
  <button onclick="runCode()" class="success" title="执行代码">▶ 运行</button>
  <button onclick="clearConsole()" class="danger" title="清空控制台">🗑 清空控制台</button>
  <button onclick="copyCode()">📋 复制代码</button>
  <button onclick="loadDemo()">📄 加载示例</button>
  <span class="spacer"></span>
  <span style="font-size:13px;color:#8b949e">Ctrl+Enter 运行</span>
</div>
<div class="panels">
  <div class="panel">
    <div class="panel-header"><span>JavaScript 代码</span></div>
    <textarea id="editor" spellcheck="false" placeholder="在这里输入JavaScript代码..."></textarea>
  </div>
  <div class="divider" id="divider"></div>
  <div class="panel">
    <div class="panel-header"><span>控制台输出</span><span id="logCount">0 条日志</span></div>
    <div id="console"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const editor = document.getElementById('editor');
const consoleEl = document.getElementById('console');
const logCount = document.getElementById('logCount');
let logs = [];

function addLog(type, ...args) {
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + type;
  const prefix = type === 'error' ? '❌ ' : type === 'warn' ? '⚠️ ' : type === 'info' ? 'ℹ️ ' : '› ';
  entry.textContent = prefix + args.map(a => {
    if (typeof a === 'object') try { return JSON.stringify(a, null, 2); } catch { return String(a); }
    return String(a);
  }).join(' ');
  consoleEl.appendChild(entry);
  consoleEl.scrollTop = consoleEl.scrollHeight;
  logs.push(type);
  logCount.textContent = logs.length + ' 条日志';
}

function clearConsole() {
  consoleEl.innerHTML = '';
  logs = [];
  logCount.textContent = '0 条日志';
}

function runCode() {
  clearConsole();
  const code = editor.value;
  try {
    const originalLog = console.log;
    const originalWarn = console.warn;
    const originalError = console.error;
    const originalInfo = console.info;

    console.log = (...args) => { addLog('log', ...args); };
    console.warn = (...args) => { addLog('warn', ...args); };
    console.error = (...args) => { addLog('error', ...args); };
    console.info = (...args) => { addLog('info', ...args); };

    const result = new Function(code)();
    if (result !== undefined) addLog('log', '← 返回值:', result);

    console.log = originalLog;
    console.warn = originalWarn;
    console.error = originalError;
    console.info = originalInfo;
  } catch (e) {
    addLog('error', e.message);
  }
  showToast('代码执行完成');
}

editor.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCode(); }
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, end = editor.selectionEnd;
    editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = s + 2;
  }
});

function copyCode() {
  navigator.clipboard.writeText(editor.value).then(() => showToast('已复制代码'));
}

function loadDemo() {
  editor.value = `// JavaScript 示例
console.log("你好，世界！");

// 变量和运算
const a = 10;
const b = 20;
console.log(a + " + " + b + " = " + (a + b));

// 数组操作
const fruits = ["苹果", "香蕉", "橙子"];
console.log("水果列表:", fruits);
fruits.forEach((f, i) => console.log(\`  \${i + 1}. \${f}\`));

// 对象
const user = { name: "张三", age: 25 };
console.log("用户信息:", user);

// 异步示例
console.log("开始...");
setTimeout(() => console.log("1秒后执行"), 1000);
console.log("同步代码先执行");

// 错误示例（取消注释查看效果）
// console.error("这是一个错误");
// console.warn("这是一个警告");`;
}

// Resizable divider
const divider = document.getElementById('divider');
let isDragging = false;
divider.addEventListener('mousedown', (e) => { isDragging = true; e.preventDefault(); });
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const panels = document.querySelector('.panels');
  const rect = panels.getBoundingClientRect();
  const pct = ((e.clientX - rect.left) / rect.width) * 100;
  const clamped = Math.min(Math.max(pct, 20), 80);
  panels.children[0].style.flex = 'none';
  panels.children[0].style.width = clamped + '%';
  panels.children[2].style.flex = '1';
});
document.addEventListener('mouseup', () => { isDragging = false; });

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

loadDemo();
</script>

<script>
(function(){
  var e=document.getElementById('editor');
  if(e&&!e.value)e.value=`// JavaScript 示例
const arr = [1, 2, 3, 4, 5];

const doubled = arr.map(x => x * 2);
console.log(doubled);

// 输出: [2, 4, 6, 8, 10]`;
})();
</script>
</body>
</html>
