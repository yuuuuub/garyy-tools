<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔄 间隔重复</title>
<meta name="description" content="间隔重复记忆工具，科学安排复习时间，高效记忆知识">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
.review-box{text-align:center;padding:30px}
.review-q{font-size:1.3rem;font-weight:600;margin-bottom:20px;min-height:60px;display:flex;align-items:center;justify-content:center}
.review-a{font-size:1.1rem;color:var(--success);margin-bottom:20px;min-height:40px;display:none}
.show-btn{padding:12px 24px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer}
.rating-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rating-btns button{padding:10px 18px;font-size:.9rem}
.btn-hard{background:var(--danger)}.btn-good{background:var(--accent)}.btn-easy{background:var(--success)}
.card-item{padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.card-item:last-child{border-bottom:none}
.card-item .q{font-weight:600}.card-item .meta{font-size:.8rem;color:var(--text2)}
.level-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:600}
.level-new{background:rgba(59,130,246,.15);color:var(--accent)}
.level-learning{background:rgba(245,158,11,.15);color:var(--warn)}
.level-review{background:rgba(34,197,94,.15);color:var(--success)}
.level-mature{background:rgba(139,92,246,.15);color:#8b5cf6}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔄 间隔重复">
<meta property="og:description" content="间隔重复记忆工具，科学安排复习时间">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🔄 间隔重复</h1><p>科学记忆，事半功倍</p></div>

<div class="cd"><h2>➕ 添加卡片</h2>
<label>问题</label><textarea id="cardQ" placeholder="输入问题..." style="min-height:50px"></textarea>
<label>答案</label><textarea id="cardA" placeholder="输入答案..." style="min-height:50px"></textarea>
<label>类别（可选）</label><input type="text" id="cardCat" placeholder="如：英语、数学、历史">
<div class="bg"><button onclick="addCard()">添加卡片</button></div></div>

<div class="cd"><h2>📖 今日复习</h2>
<div class="review-box" id="reviewArea">
<div style="font-size:1.1rem;font-weight:600;margin-bottom:12px">待复习：<span id="dueCount" style="color:var(--accent)">0</span> 张</div>
<button onclick="startReview()" id="startBtn" style="padding:14px 28px;font-size:1rem">开始复习</button>
</div>
<div id="reviewCard" class="hidden">
<div class="review-box">
<div class="review-q" id="reviewQ"></div>
<button class="show-btn" onclick="showAnswer()">显示答案</button>
<div class="review-a" id="reviewA"></div>
<div class="rating-btns hidden" id="ratingBtns">
<button class="btn-hard" onclick="rate(1)">😰 困难</button>
<button class="btn-good" onclick="rate(3)">😊 良好</button>
<button class="btn-easy" onclick="rate(5)">😎 简单</button>
</div>
</div></div></div>

<div class="cd"><h2>📋 卡片列表</h2>
<div class="bg" style="margin-bottom:12px">
<select id="catFilter" onchange="renderCards()" style="max-width:150px"><option value="all">全部类别</option></select>
</div>
<div id="cardList"></div></div>

<div class="cd"><h2>📊 统计</h2><div id="stats"></div>
<div class="bg"><button class="sec" onclick="clearAll()">清空全部</button></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let cards=JSON.parse(localStorage.getItem('sr_cards')||'[]');
let reviewQueue=[],reviewIdx=0;

function save(){localStorage.setItem('sr_cards',JSON.stringify(cards))}

function addCard(){
  const q=$('cardQ').value.trim(),a=$('cardA').value.trim(),cat=$('cardCat').value.trim()||'默认';
  if(!q||!a){alert('请输入问题和答案');return}
  cards.push({id:Date.now(),q,a,cat,interval:0,ease:2.5,reps:0,lapse:0,nextReview:Date.now(),level:'new'});
  save();$('cardQ').value='';$('cardA').value='';renderCards();renderStats();
}

function getDueCards(){return cards.filter(c=>c.nextReview<=Date.now())}

function startReview(){
  reviewQueue=getDueCards();
  if(!reviewQueue.length){alert('没有待复习的卡片');return}
  reviewIdx=0;showReviewCard();
  $('startBtn').classList.add('hidden');$('reviewCard').classList.remove('hidden');
}

function showReviewCard(){
  if(reviewIdx>=reviewQueue.length){$('reviewCard').classList.add('hidden');$('startBtn').classList.remove('hidden');$('startBtn').textContent='🎉 复习完成！点击继续';renderCards();renderStats();return}
  const c=reviewQueue[reviewIdx];
  $('reviewQ').textContent=c.q;$('reviewA').textContent=c.a;
  $('reviewA').style.display='none';$('ratingBtns').classList.add('hidden');
  document.querySelector('.show-btn').style.display='';
}

function showAnswer(){$('reviewA').style.display='block';$('ratingBtns').classList.remove('hidden');document.querySelector('.show-btn').style.display='none'}

function rate(quality){
  const c=reviewQueue[reviewIdx];
  const card=cards.find(x=>x.id===c.id);
  if(quality<3){card.reps=0;card.interval=1;card.lapse++;card.level='learning'}
  else{
    if(card.reps===0)card.interval=1;
    else if(card.reps===1)card.interval=6;
    else card.interval=Math.round(card.interval*card.ease);
    card.reps++;card.ease=Math.max(1.3,card.ease+(0.1-(5-quality)*(0.08+(5-quality)*0.02)));
    card.level=card.interval>=21?'mature':card.reps>=3?'review':'learning';
  }
  card.nextReview=Date.now()+card.interval*86400000;
  save();reviewIdx++;showReviewCard();
}

function renderCards(){
  const cat=$('catFilter').value;
  const list=cat==='all'?cards:cards.filter(c=>c.cat===cat);
  if(!list.length){$('cardList').innerHTML='<div class="es">暂无卡片</div>';return}
  $('cardList').innerHTML=list.map(c=>{
    const isDue=c.nextReview<=Date.now();
    return `<div class="card-item"><div><div class="q">${c.q.substring(0,40)}${c.q.length>40?'...':''}</div><div class="meta">${c.cat} · 复习${c.reps}次 · 间隔${c.interval}天 ${isDue?'<span style="color:var(--warn)">· 待复习</span>':''}</div></div><div><span class="level-badge level-${c.level}">${{new:'新卡片',learning:'学习中',review:'复习',mature:'已掌握'}[c.level]}</span> <span style="cursor:pointer;color:var(--danger);margin-left:8px" onclick="delCard(${c.id})">✕</span></div></div>`;
  }).join('');
  const cats=[...new Set(cards.map(c=>c.cat))];
  $('catFilter').innerHTML='<option value="all">全部类别</option>'+cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function delCard(id){cards=cards.filter(c=>c.id!==id);save();renderCards();renderStats()}

function renderStats(){
  const due=getDueCards().length;
  const newC=cards.filter(c=>c.level==='new').length;
  const learning=cards.filter(c=>c.level==='learning').length;
  const review=cards.filter(c=>c.level==='review').length;
  const mature=cards.filter(c=>c.level==='mature').length;
  $('stats').innerHTML=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center"><div><div style="font-size:1.3rem;font-weight:700;color:var(--accent)">${cards.length}</div><div style="font-size:.75rem;color:var(--text2)">总计</div></div><div><div style="font-size:1.3rem;font-weight:700;color:var(--warn)">${due}</div><div style="font-size:.75rem;color:var(--text2)">待复习</div></div><div><div style="font-size:1.3rem;font-weight:700;color:var(--accent)">${newC}</div><div style="font-size:.75rem;color:var(--text2)">新卡片</div></div><div><div style="font-size:1.3rem;font-weight:700;color:var(--success)">${review}</div><div style="font-size:.75rem;color:var(--text2)">复习中</div></div><div><div style="font-size:1.3rem;font-weight:700;color:#8b5cf6">${mature}</div><div style="font-size:.75rem;color:var(--text2)">已掌握</div></div></div>`;
}

function clearAll(){if(!confirm('确定清空全部卡片？'))return;cards=[];save();renderCards();renderStats()}
renderCards();renderStats();
</script>
</body>
</html>
