<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文打字测试</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--success:#22c55e;--error:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8rem;margin-bottom:10px;color:var(--accent)}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.toolbar button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:0.85rem;cursor:pointer;font-family:inherit}
.toolbar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.info-bar{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.info-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:0.85rem}
.info-item span{color:var(--accent);font-weight:bold}
.text-display{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:15px;width:100%;max-width:700px;min-height:120px;font-size:1.3rem;line-height:2;letter-spacing:2px}
.char{padding:2px 1px;transition:all 0.15s;border-radius:3px}
.char.current{background:rgba(59,130,246,0.3);border-bottom:3px solid var(--accent)}
.char.correct{color:var(--success)}
.char.wrong{color:var(--error);background:rgba(239,68,68,0.15);text-decoration:line-through}
.char.typed{opacity:0.6}
.input-area{width:100%;max-width:700px;margin-bottom:15px}
.input-area textarea{width:100%;background:var(--card);border:2px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:1.1rem;font-family:inherit;resize:none;height:60px;outline:none;transition:border-color 0.2s}
.input-area textarea:focus{border-color:var(--accent)}
.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:1rem;cursor:pointer;font-family:inherit;transition:all 0.2s}
button:hover{opacity:0.85}
.results{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:15px;width:100%;max-width:500px;text-align:center}
.results h2{color:var(--accent);margin-bottom:15px}
.results .stat{font-size:1.1rem;margin-bottom:8px}
.results .stat span{color:var(--accent);font-weight:bold;font-size:1.3rem}
.hidden{display:none!important}
</style>
</head>
<body>
<h1>⌨️ 中文打字测试</h1>
<div class="toolbar">
  <button onclick="setTime(60)" id="t60" class="active">60秒</button>
  <button onclick="setTime(120)" id="t120">120秒</button>
  <button onclick="setTime(180)" id="t180">180秒</button>
</div>
<div class="info-bar">
  <div class="info-item">⏱ <span id="timer">0</span>秒</div>
  <div class="info-item">📊 速度: <span id="cps">0</span>字/分</div>
  <div class="info-item">✅ 正确: <span id="correct">0</span></div>
  <div class="info-item">❌ 错误: <span id="errors">0</span></div>
</div>
<div class="text-display" id="textDisplay"></div>
<div class="input-area">
  <textarea id="input" placeholder="开始输入..." disabled></textarea>
</div>
<div class="buttons">
  <button onclick="startTest()">▶ 开始</button>
  <button onclick="resetTest()">🔄 重置</button>
</div>
<div class="results hidden" id="results">
  <h2>📊 测试结果</h2>
  <div class="stat">速度: <span id="rCps">0</span> 字/分钟</div>
  <div class="stat">正确率: <span id="rAccuracy">0</span>%</div>
  <div class="stat">正确: <span id="rCorrect">0</span> 字</div>
  <div class="stat">错误: <span id="rErrors">0</span> 字</div>
  <div class="stat">用时: <span id="rTime">0</span> 秒</div>
</div>
<script>
const TEXTS=[
  '天地玄黄宇宙洪荒日月盈昃辰宿列张寒来暑往秋收冬藏闰余成岁律吕调阳云腾致雨露结为霜金生丽水玉出昆冈剑号巨阙珠称夜光果珍李柰菜重芥姜海咸河淡鳞潜羽翔',
  '人生如梦一尊还酹江月大江东去浪淘尽千古风流人物故垒西边人道是三国周郎赤壁乱石穿空惊涛拍岸卷起千堆雪江山如画一时多少豪杰遥想公瑾当年小乔初嫁了雄姿英发羽扇纶巾谈笑间樯橹灰飞烟灭',
  '春眠不觉晓处处闻啼鸟夜来风雨声花落知多少白日依山尽黄河入海流欲穷千里目更上一层楼床前明月光疑是地上霜举头望明月低头思故乡离离原上草一岁一枯荣野火烧不尽春风吹又生远芳侵古道晴翠接荒城',
  '学而时习之不亦说乎有朋自远方来不亦乐乎人不知而不愠不亦君子乎温故而知新可以为师矣学而不思则罔思而不学则殆知之为知之不知为不知是知也见贤思齐焉见不贤而内自省也三人行必有我师焉择其善者而从之',
  '北冥有鱼其名为鲲鲲之大不知其几千里也化而为鸟其名为鹏鹏之背不知其几千里也怒而飞其翼若垂天之云是鸟也海运则将徙于南冥南冥者天池也齐谐者志怪者也谐之言曰鹏之徙于南冥也水击三千里抟扶摇而上者九万里'
];
let targetText='',currentIdx=0,timerValue=60,timer=null,running=false,correctCount=0,errorCount=0;

function setTime(t){
  timerValue=t;
  document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
  document.getElementById('t'+t).classList.add('active');
  resetTest();
}

function renderText(){
  const el=document.getElementById('textDisplay');
  el.innerHTML=targetText.split('').map((c,i)=>{
    let cls='char';
    if(i<currentIdx)cls+=targetText[i]===(document.getElementById('input').value[i]||'')?' correct typed':' wrong typed';
    if(i===currentIdx)cls+=' current';
    return `<span class="${cls}">${c}</span>`;
  }).join('');
}

function startTest(){
  targetText=TEXTS[Math.floor(Math.random()*TEXTS.length)];
  currentIdx=0;correctCount=0;errorCount=0;running=true;
  document.getElementById('input').value='';
  document.getElementById('input').disabled=false;
  document.getElementById('input').focus();
  document.getElementById('correct').textContent=0;
  document.getElementById('errors').textContent=0;
  document.getElementById('cps').textContent=0;
  document.getElementById('timer').textContent=timerValue;
  document.getElementById('results').classList.add('hidden');
  renderText();
  clearInterval(timer);
  timer=setInterval(()=>{
    timerValue--;
    document.getElementById('timer').textContent=timerValue;
    const elapsed=parseInt(document.getElementById('timer').textContent)||0;
    if(timerValue<=0)endTest();
  },1000);
}

function resetTest(){
  clearInterval(timer);running=false;timerValue=parseInt(document.getElementById('t60').classList.contains('active')?60:document.getElementById('t120').classList.contains('active')?120:180);
  document.getElementById('input').value='';document.getElementById('input').disabled=true;
  document.getElementById('textDisplay').innerHTML='<span style="opacity:0.5">点击"开始"进行打字测试</span>';
  document.getElementById('timer').textContent=timerValue;
  document.getElementById('correct').textContent=0;
  document.getElementById('errors').textContent=0;
  document.getElementById('cps').textContent=0;
  document.getElementById('results').classList.add('hidden');
  currentIdx=0;correctCount=0;errorCount=0;
}

document.getElementById('input').addEventListener('input',e=>{
  if(!running)return;
  const typed=e.target.value;
  currentIdx=typed.length;
  correctCount=0;errorCount=0;
  for(let i=0;i<typed.length&&i<targetText.length;i++){
    if(typed[i]===targetText[i])correctCount++;
    else errorCount++;
  }
  const elapsed=(parseInt(document.getElementById('t60').classList.contains('active')?60:120)-timerValue)||1;
  document.getElementById('correct').textContent=correctCount;
  document.getElementById('errors').textContent=errorCount;
  document.getElementById('cps').textContent=Math.round(correctCount/elapsed*60);
  renderText();
  if(currentIdx>=targetText.length)endTest();
});

function endTest(){
  clearInterval(timer);running=false;
  document.getElementById('input').disabled=true;
  const total=correctCount+errorCount;
  const accuracy=total>0?Math.round(correctCount/total*100):0;
  const timeUsed=parseInt(document.getElementById('timer').textContent)||0;
  document.getElementById('rCps').textContent=Math.round(correctCount/60*60);
  document.getElementById('rAccuracy').textContent=accuracy;
  document.getElementById('rCorrect').textContent=correctCount;
  document.getElementById('rErrors').textContent=errorCount;
  document.getElementById('rTime').textContent=60-timeUsed;
  document.getElementById('results').classList.remove('hidden');
}

renderText();
</script>
</body>
</html>
