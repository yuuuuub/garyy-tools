<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>语录组件 - garyy-tools</title>
<meta name="description" content="每日语录组件，精选名人名言和励志语录，支持随机刷新和收藏">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;scroll-behavior:smooth}.container{max-width:600px;margin:auto;padding-bottom:50px}header{text-align:center;padding:28px 0 16px}h1{font-size:1.3rem;margin-bottom:4px}.sub{color:var(--text2);font-size:.85rem}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;text-align:center}button{padding:8px 16px;border-radius:6px;border:none;background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;transition:opacity .2s}button:hover{opacity:.85}.btn-gold{background:var(--gold)}.quote-box{padding:20px 0}.quote-text{font-size:1.2rem;line-height:1.8;font-style:italic;margin-bottom:16px;position:relative;padding:0 20px}.quote-text::before{content:'"';font-size:3rem;color:var(--blue);position:absolute;left:-10px;top:-20px;opacity:.3}.quote-author{font-size:.9rem;color:var(--text2);margin-bottom:4px}.quote-source{font-size:.8rem;color:var(--text2)}.btn-row{display:flex;gap:8px;justify-content:center;margin-top:16px}.fav-list{text-align:left}.fav-item{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border)}.fav-item:last-child{border:none}.fav-item .text{font-size:.85rem;line-height:1.5;flex:1;margin-right:10px}.fav-item .author{font-size:.8rem;color:var(--text2);white-space:nowrap}.fav-item .rm{background:none;border:none;color:var(--red);cursor:pointer;font-size:.8rem;padding:4px;flex-shrink:0}.tag-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}.tag{padding:4px 12px;border-radius:16px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-size:.78rem;transition:all .2s}.tag:hover{border-color:var(--blue)}.tag.active{border-color:var(--blue);background:rgba(59,130,246,.1);color:var(--blue)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="语录组件 - garyy-tools">
<meta property="og:description" content="每日语录组件，精选名人名言和励志语录，支持随机刷新和收藏">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>💬 语录组件</h1>
<div class="sub">每日语录 · 名人名言 · 收藏夹</div>
</header>
<div class="card">
<div class="tag-row" id="tagRow"></div>
<div class="quote-box">
<div class="quote-text" id="qText"></div>
<div class="quote-author" id="qAuthor"></div>
<div class="quote-source" id="qSource"></div>
</div>
<div class="btn-row">
<button class="btn-gold" id="btnFav">⭐ 收藏</button>
<button id="btnNext">🔄 下一条</button>
<button id="btnCopy">📋 复制</button>
</div>
</div>
<div class="card">
<div style="font-weight:600;margin-bottom:12px">我的收藏</div>
<div class="fav-list" id="favList"></div>
</div>
</div>
<script>
(function(){
'use strict';
const quotes=[
{t:'生活不是等待暴风雨过去，而是学会在雨中跳舞。',a:'维维安·格林',s:'励志'},
{t:'千里之行，始于足下。',a:'老子',s:'哲学'},
{t:'学而不思则罔，思而不学则殆。',a:'孔子',s:'学习'},
{t:'天行健，君子以自强不息。',a:'《周易》',s:'哲学'},
{t:'业精于勤，荒于嬉；行成于思，毁于随。',a:'韩愈',s:'励志'},
{t:'书山有路勤为径，学海无涯苦作舟。',a:'韩愈',s:'学习'},
{t:'宝剑锋从磨砺出，梅花香自苦寒来。',a:'《警世贤文》',s:'励志'},
{t:'不积跬步，无以至千里。',a:'荀子',s:'哲学'},
{t:'三人行，必有我师焉。',a:'孔子',s:'学习'},
{t:'世上无难事，只怕有心人。',a:'谚语',s:'励志'},
{t:'知识就是力量。',a:'弗朗西斯·培根',s:'学习'},
{t:'时间就像海绵里的水，只要愿挤，总还是有的。',a:'鲁迅',s:'时间'},
{t:'路漫漫其修远兮，吾将上下而求索。',a:'屈原',s:'哲学'},
{t:'知之者不如好之者，好之者不如乐之者。',a:'孔子',s:'学习'},
{t:'静以修身，俭以养德。',a:'诸葛亮',s:'哲学'},
{t:'博观而约取，厚积而薄发。',a:'苏轼',s:'励志'},
{t:'纸上得来终觉浅，绝知此事要躬行。',a:'陆游',s:'学习'},
{t:'少壮不努力，老大徒伤悲。',a:'《长歌行》',s:'时间'},
{t:'一寸光阴一寸金，寸金难买寸光阴。',a:'谚语',s:'时间'},
{t:'己所不欲，勿施于人。',a:'孔子',s:'哲学'},
{t:'失败是成功之母。',a:'谚语',s:'励志'},
{t:'千里之堤，溃于蚁穴。',a:'《韩非子》',s:'哲学'},
{t:'温故而知新，可以为师矣。',a:'孔子',s:'学习'},
{t:'生当作人杰，死亦为鬼雄。',a:'李清照',s:'励志'},
{t:'穷则独善其身，达则兼济天下。',a:'孟子',s:'哲学'}
];
let favs=JSON.parse(localStorage.getItem('widget-favs')||'[]');
let curCat='全部',curIdx=0;
const tags=['全部','励志','学习','哲学','时间'];
function renderTags(){
document.getElementById('tagRow').innerHTML=tags.map(t=>'<div class="tag'+(t===curCat?' active':'')+'" data-cat="'+t+'">'+t+'</div>').join('');
}
function getFiltered(){return curCat==='全部'?quotes:quotes.filter(q=>q.s===curCat);}
function showQuote(){
const list=getFiltered();if(!list.length)return;
curIdx=curIdx%list.length;const q=list[curIdx];
document.getElementById('qText').textContent=q.t;
document.getElementById('qAuthor').textContent='— '+q.a;
document.getElementById('qSource').textContent=q.s;
}
function renderFavs(){
const el=document.getElementById('favList');
if(!favs.length){el.innerHTML='<div style="text-align:center;color:var(--text2);padding:16px;font-size:.85rem">暂无收藏</div>';return;}
el.innerHTML=favs.map((f,i)=>'<div class="fav-item"><div><div class="text">'+f.t+'</div><div class="author">— '+f.a+'</div></div><button class="rm" data-i="'+i+'">✕</button></div>').join('');
}
document.getElementById('tagRow').onclick=function(e){
const tag=e.target.closest('.tag');if(!tag)return;
curCat=tag.dataset.cat;curIdx=0;renderTags();showQuote();
};
document.getElementById('btnNext').onclick=()=>{curIdx++;showQuote();};
document.getElementById('btnFav').onclick=()=>{
const list=getFiltered();const q=list[curIdx];
if(!favs.find(f=>f.t===q.t)){favs.unshift(q);localStorage.setItem('widget-favs',JSON.stringify(favs));renderFavs();alert('已收藏！');}
};
document.getElementById('btnCopy').onclick=()=>{
const list=getFiltered();const q=list[curIdx];
navigator.clipboard.writeText(q.t+' —— '+q.a).then(()=>alert('已复制'));
};
document.getElementById('favList').onclick=function(e){
if(e.target.classList.contains('rm')){
const i=+e.target.dataset.i;favs.splice(i,1);localStorage.setItem('widget-favs',JSON.stringify(favs));renderFavs();
}
};
renderTags();showQuote();renderFavs();
})();
</script>
</body>
</html>
