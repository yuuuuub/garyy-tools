<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 客户生命周期价值计算器</title>
<meta property="og:title" content="💰 客户生命周期价值计算器">
<meta property="og:description" content="💰 客户生命周期价值计算器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="LTV客户生命周期价值计算工具，预测客户长期价值，优化获客成本和留存策略">
<meta name="robots" content="index, follow">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:20px}
.container{max-width:1000px;margin:0 auto}
h1{color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
label{display:block;font-weight:600;margin-bottom:4px;font-size:13px;color:var(--text2)}
input,select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-orange{background:var(--orange)}
.theme-toggle{position:fixed;top:20px;right:20px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:6px;cursor:pointer;z-index:100}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-box{text-align:center;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.stat-box .num{font-size:24px;font-weight:700;color:var(--blue)}
.stat-box .label{font-size:11px;color:var(--text2);margin-top:4px}
.result-highlight{padding:20px;border-radius:8px;text-align:center;margin:16px 0}
.result-highlight .big{font-size:48px;font-weight:700}
.result-highlight .sub{font-size:14px;color:var(--text2);margin-top:4px}
.formula-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:16px;margin:12px 0;font-family:monospace;font-size:14px;line-height:2}
.formula-var{color:var(--blue);font-weight:600}
.compare-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.compare-item{text-align:center;padding:16px;border:1px solid var(--border);border-radius:8px;background:var(--card)}
.compare-item .val{font-size:24px;font-weight:700;margin:8px 0}
.compare-item .label{font-size:12px;color:var(--text2)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{font-weight:600;color:var(--text2);font-size:12px}
.insight-box{padding:12px;border-radius:6px;margin-top:8px;font-size:13px;border:1px solid var(--border);background:var(--bg)}
.chart-area{position:relative;height:200px;margin:16px 0}
.chart-area canvas{width:100%;height:100%}
.segment-row{display:flex;gap:8px;margin:6px 0;align-items:center;font-size:13px}
.segment-row .name{width:120px;flex-shrink:0;font-weight:600}
.segment-row .bar-bg{flex:1;height:20px;background:var(--border);border-radius:4px;overflow:hidden}
.segment-row .bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11px;font-weight:600}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>💰 客户生命周期价值计算器</h1>

<div class="card">
<h3 style="margin-bottom:12px">业务数据输入</h3>
<div class="grid-2">
<div>
<h4 style="margin-bottom:8px;color:var(--blue)">基础指标</h4>
<div class="grid-2" style="gap:8px">
<div><label>平均客单价 (¥)</label><input type="number" id="arpu" value="200"></div>
<div><label>月均购买频次</label><input type="number" id="freq" value="2" step="0.1"></div>
<div><label>平均客户生命周期 (月)</label><input type="number" id="lifespan" value="24"></div>
<div><label>毛利率 (%)</label><input type="number" id="margin" value="60"></div>
</div>
</div>
<div>
<h4 style="margin-bottom:8px;color:var(--green)">获客与留存</h4>
<div class="grid-2" style="gap:8px">
<div><label>获客成本 CAC (¥)</label><input type="number" id="cac" value="150"></div>
<div><label>月流失率 (%)</label><input type="number" id="churnRate" value="5" step="0.1"></div>
<div><label>月留存率 (%)</label><input type="number" id="retention" value="95" step="0.1"></div>
<div><label>折现率 (%)</label><input type="number" id="discount" value="10"></div>
</div>
</div>
</div>
<div style="margin-top:12px;display:flex;gap:8px">
<button onclick="calculateLTV()">💰 计算LTV</button>
<button class="btn-green" onclick="loadSaaS()">💻 SaaS示例</button>
<button class="btn-orange" onclick="loadEcommerce()">🛒 电商示例</button>
<button class="btn-red" onclick="loadSubscription()">📦 订阅示例</button>
<button class="btn-sm" onclick="exportReport()" style="margin-left:auto">📥 导出报告</button>
</div>
</div>

<div id="statsArea"></div>

<div id="resultArea"></div>

<div class="card" id="formulaCard" style="display:none">
<h3 style="margin-bottom:8px">计算公式</h3>
<div class="formula-box" id="formulaContent"></div>
</div>

<div class="card" id="sensitivityCard" style="display:none">
<h3 style="margin-bottom:12px">敏感性分析</h3>
<div id="sensitivityContent"></div>
</div>

<div class="card" id="projectionCard" style="display:none">
<h3 style="margin-bottom:12px">LTV预测曲线</h3>
<canvas id="ltvChart"></canvas>
</div>

<div class="card" id="benchmarkCard" style="display:none">
<h3 style="margin-bottom:12px">LTV/CAC比值分析</h3>
<div id="benchmarkContent"></div>
</div>

<div class="card">
<h3 style="margin-bottom:12px">分析历史</h3>
<div id="historyList"></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var history=JSON.parse(localStorage.getItem('ltv_history')||'[]');

function loadSaaS(){
  document.getElementById('arpu').value=99;
  document.getElementById('freq').value=1;
  document.getElementById('lifespan').value=36;
  document.getElementById('margin').value=80;
  document.getElementById('cac').value=500;
  document.getElementById('churnRate').value=3;
  document.getElementById('retention').value=97;
  document.getElementById('discount').value=10;
}

function loadEcommerce(){
  document.getElementById('arpu').value=200;
  document.getElementById('freq').value=3;
  document.getElementById('lifespan').value=18;
  document.getElementById('margin').value=45;
  document.getElementById('cac').value=120;
  document.getElementById('churnRate').value=8;
  document.getElementById('retention').value=92;
  document.getElementById('discount').value=10;
}

function loadSubscription(){
  document.getElementById('arpu').value=49;
  document.getElementById('freq').value=1;
  document.getElementById('lifespan').value=24;
  document.getElementById('margin').value=70;
  document.getElementById('cac').value=200;
  document.getElementById('churnRate').value=6;
  document.getElementById('retention').value=94;
  document.getElementById('discount').value=8;
}

function calculateLTV(){
  var arpu=parseFloat(document.getElementById('arpu').value)||0;
  var freq=parseFloat(document.getElementById('freq').value)||1;
  var lifespan=parseFloat(document.getElementById('lifespan').value)||12;
  var margin=parseFloat(document.getElementById('margin').value)/100||0.5;
  var cac=parseFloat(document.getElementById('cac').value)||0;
  var churnRate=parseFloat(document.getElementById('churnRate').value)/100||0.05;
  var retentionRate=parseFloat(document.getElementById('retention').value)/100||0.95;
  var discountRate=parseFloat(document.getElementById('discount').value)/100||0.1;

  var monthlyRevenue=arpu*freq;
  var monthlyMargin=monthlyRevenue*margin;
  var avgLifetimeMonths=churnRate>0?1/churnRate:lifespan;
  var discountedLTV=discountRate>0?monthlyMargin*(1-Math.pow(1+discountRate,-avgLifetimeMonths*12/12))/(discountRate/12):monthlyMargin*avgLifetimeMonths;
  var simpleLTV=monthlyMargin*avgLifetimeMonths;
  var ltvToCac=cac>0?discountedLTV/cac:0;
  var paybackMonths=cac>0?cac/monthlyMargin:0;
  var breakEvenMonths=paybackMonths;

  var roi=(discountedLTV-cac)/cac*100;

  document.getElementById('statsArea').innerHTML='<div class="stat-row"><div class="stat-box"><div class="num" style="color:var(--green)">¥'+Math.round(discountedLTV).toLocaleString()+'</div><div class="label">LTV (折现)</div></div><div class="stat-box"><div class="num" style="color:var(--blue)">¥'+Math.round(simpleLTV).toLocaleString()+'</div><div class="label">LTV (简单)</div></div><div class="stat-box"><div class="num" style="color:'+(ltvToCac>=3?'var(--green)':ltvToCac>=1?'var(--orange)':'var(--red)')+'">'+ltvToCac.toFixed(1)+'x</div><div class="label">LTV/CAC</div></div><div class="stat-box"><div class="num" style="color:var(--purple)">'+paybackMonths.toFixed(1)+'月</div><div class="label">回本周期</div></div></div>';

  document.getElementById('resultArea').innerHTML='<div class="result-highlight" style="background:'+(roi>0?'rgba(26,127,55,.08)':'rgba(207,34,46,.08)')+';border:1px solid '+(roi>0?'var(--green)':'var(--red)')+'"><div class="big" style="color:'+(roi>0?'var(--green)':'var(--red)')+'">¥'+Math.round(discountedLTV).toLocaleString()+'</div><div class="sub">每位客户的生命周期价值 (LTV)</div><div class="sub" style="margin-top:8px;font-size:16px">ROI: '+roi.toFixed(0)+'% · 回本周期: '+paybackMonths.toFixed(1)+'个月</div></div><div class="compare-grid"><div class="compare-item"><div class="label">月收入/客户</div><div class="val" style="color:var(--blue)">¥'+Math.round(monthlyRevenue).toLocaleString()+'</div></div><div class="compare-item"><div class="label">月毛利/客户</div><div class="val" style="color:var(--green)">¥'+Math.round(monthlyMargin).toLocaleString()+'</div></div><div class="compare-item"><div class="label">平均客户寿命</div><div class="val" style="color:var(--purple)">'+avgLifetimeMonths.toFixed(1)+'月</div></div></div>';

  document.getElementById('formulaCard').style.display='block';
  document.getElementById('formulaContent').innerHTML='<span class="formula-var">月毛利</span> = 客单价(¥'+arpu+') × 频次('+freq+') × 毛利率('+(margin*100)+'%) = <strong>¥'+monthlyMargin.toFixed(2)+'</strong><br><span class="formula-var">平均寿命</span> = 1 / 月流失率('+(churnRate*100)+'%) = <strong>'+avgLifetimeMonths.toFixed(1)+'个月</strong><br><span class="formula-var">LTV(简单)</span> = 月毛利 × 平均寿命 = ¥'+monthlyMargin.toFixed(2)+' × '+avgLifetimeMonths.toFixed(1)+' = <strong>¥'+simpleLTV.toFixed(2)+'</strong><br><span class="formula-var">LTV(折现)</span> = 月毛利 × [(1-(1+r)^-n)/r] = <strong>¥'+discountedLTV.toFixed(2)+'</strong><br><span class="formula-var">LTV/CAC</span> = ¥'+discountedLTV.toFixed(2)+' / ¥'+cac+' = <strong>'+ltvToCac.toFixed(2)+'x</strong><br><span class="formula-var">回本周期</span> = CAC / 月毛利 = ¥'+cac+' / ¥'+monthlyMargin.toFixed(2)+' = <strong>'+paybackMonths.toFixed(1)+'个月</strong>';

  document.getElementById('sensitivityCard').style.display='block';
  var sensHTML='<div class="grid-2"><div><h4 style="margin-bottom:8px">流失率敏感性</h4>';
  [0.02,0.03,0.05,0.08,0.1,0.15].forEach(function(cr){
    var lt=1/cr;var ltv=monthlyMargin*lt;
    var pct=Math.min(100,ltv/simpleLTV*100);
    sensHTML+='<div class="segment-row"><span class="name">流失'+(cr*100)+'%</span><div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%;background:var(--blue)">¥'+Math.round(ltv).toLocaleString()+'</div></div></div>';
  });
  sensHTML+='</div><div><h4 style="margin-bottom:8px">客单价敏感性</h4>';
  [100,150,200,250,300,400].forEach(function(p){
    var mr=p*freq*margin;var lt=1/churnRate;var ltv=mr*lt;
    var pct=Math.min(100,ltv/simpleLTV*100);
    sensHTML+='<div class="segment-row"><span class="name">客单¥'+p+'</span><div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%;background:var(--green)">¥'+Math.round(ltv).toLocaleString()+'</div></div></div>';
  });
  sensHTML+='</div></div>';
  document.getElementById('sensitivityContent').innerHTML=sensHTML;

  document.getElementById('projectionCard').style.display='block';
  drawProjection(monthlyMargin,avgLifetimeMonths,discountRate);

  document.getElementById('benchmarkCard').style.display='block';
  var benchHTML='<div style="text-align:center;margin:12px 0"><div style="font-size:36px;font-weight:700;color:'+(ltvToCac>=3?'var(--green)':ltvToCac>=1?'var(--orange)':'var(--red)')+'">'+ltvToCac.toFixed(2)+'x</div><div style="color:var(--text2)">LTV / CAC 比值</div></div>';
  if(ltvToCac>=3)benchHTML+='<div class="insight-box" style="border-color:var(--green)">✅ LTV/CAC ≥ 3x，商业模式健康。可以适当增加获客投入来扩大规模。</div>';
  else if(ltvToCac>=1)benchHTML+='<div class="insight-box" style="border-color:var(--orange)">⚠️ LTV/CAC 在1-3x之间，有盈利但空间有限。建议优化留存或提升客单价。</div>';
  else benchHTML+='<div class="insight-box" style="border-color:var(--red)">🔴 LTV/CAC < 1x，每获取一个客户都在亏损。需立即优化获客成本或提升客户价值。</div>';
  benchHTML+='<div class="compare-grid"><div class="compare-item" style="border-color:var(--green)"><div class="label">健康</div><div class="val" style="color:var(--green);font-size:20px">≥ 3x</div></div><div class="compare-item" style="border-color:var(--orange)"><div class="label">一般</div><div class="val" style="color:var(--orange);font-size:20px">1-3x</div></div><div class="compare-item" style="border-color:var(--red)"><div class="label">危险</div><div class="val" style="color:var(--red);font-size:20px">< 1x</div></div></div>';
  document.getElementById('benchmarkContent').innerHTML=benchHTML;

  history.unshift({date:new Date().toLocaleDateString('zh-CN'),ltv:Math.round(discountedLTV),cac:cac,ratio:ltvToCac.toFixed(1)+'x',payback:paybackMonths.toFixed(1)+'月'});
  if(history.length>10)history.pop();
  localStorage.setItem('ltv_history',JSON.stringify(history));
  renderHistory();
}

function drawProjection(monthlyMargin,lifespan,discountRate){
  var canvas=document.getElementById('ltvChart');
  var ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth;canvas.height=200;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  var w=canvas.width,h=canvas.height,pad=50;

  var months=Math.min(60,Math.ceil(lifespan*1.5));
  var data=[];var cumLTV=0;
  for(var m=0;m<=months;m++){
    cumLTV+=m===0?0:monthlyMargin*Math.pow(1-discountRate/12,m);
    data.push({month:m,lTV:cumLTV});
  }
  var maxLTV=Math.max(...data.map(function(d){return d.lTV;}));

  ctx.strokeStyle='#d0d7de';ctx.lineWidth=1;
  for(var i=0;i<=4;i++){
    var y=pad+(h-2*pad)*i/4;
    ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-10,y);ctx.stroke();
    ctx.fillStyle='#656d76';ctx.font='11px sans-serif';ctx.textAlign='right';
    ctx.fillText('¥'+Math.round(maxLTV*(1-i/4)).toLocaleString(),pad-6,y+4);
  }

  ctx.strokeStyle='#0969da';ctx.lineWidth=2.5;ctx.beginPath();
  data.forEach(function(d,i){
    var x=pad+i*(w-pad-10)/months;
    var y=pad+(1-d.lTV/maxLTV)*(h-2*pad);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();

  var gradient=ctx.createLinearGradient(0,pad,0,h-pad);
  gradient.addColorStop(0,'rgba(9,105,218,.15)');
  gradient.addColorStop(1,'rgba(9,105,218,0)');
  ctx.lineTo(pad+months*(w-pad-10)/months,h-pad);ctx.lineTo(pad,h-pad);ctx.closePath();
  ctx.fillStyle=gradient;ctx.fill();

  ctx.fillStyle='#656d76';ctx.font='11px sans-serif';ctx.textAlign='center';
  for(var i=0;i<=Math.min(6,months);i+=Math.max(1,Math.floor(months/6))){
    ctx.fillText(i+'月',pad+i*(w-pad-10)/months,h-6);
  }
}

function exportReport(){
  var arpu=parseFloat(document.getElementById('arpu').value)||0;
  var freq=parseFloat(document.getElementById('freq').value)||1;
  var lifespan=parseFloat(document.getElementById('lifespan').value)||12;
  var margin=parseFloat(document.getElementById('margin').value)/100||0.5;
  var cac=parseFloat(document.getElementById('cac').value)||0;
  var churnRate=parseFloat(document.getElementById('churnRate').value)/100||0.05;
  var monthlyMargin=arpu*freq*margin;
  var avgLifetime=1/churnRate;
  var ltv=monthlyMargin*avgLifetime;
  var ratio=cac>0?ltv/cac:0;

  var report='LTV分析报告\n\n';
  report+='客单价: ¥'+arpu+'\n月频次: '+freq+'\n毛利率: '+(margin*100)+'%\n获客成本: ¥'+cac+'\n月流失率: '+(churnRate*100)+'%\n\n';
  report+='计算结果:\n';
  report+='月毛利: ¥'+monthlyMargin.toFixed(2)+'\n';
  report+='平均寿命: '+avgLifetime.toFixed(1)+'个月\n';
  report+='LTV: ¥'+ltv.toFixed(2)+'\n';
  report+='LTV/CAC: '+ratio.toFixed(2)+'x\n';
  report+='回本周期: '+(cac/monthlyMargin).toFixed(1)+'个月\n';
  report+='生成时间: '+new Date().toLocaleString('zh-CN');
  var blob=new Blob([report],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ltv-report.txt';a.click();
}

function renderHistory(){
  document.getElementById('historyList').innerHTML=history.length?history.map(function(h){
    return '<div style="padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between"><div><strong>'+h.date+'</strong></div><div style="font-size:12px">LTV: ¥'+h.ltv.toLocaleString()+' · CAC: ¥'+h.cac+' · 比值: '+h.ratio+' · 回本: '+h.payback+'</div></div>';
  }).join(''):'<p style="color:var(--text2);font-size:13px">暂无历史记录</p>';
}

function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
renderHistory();
</script>
</body>
</html>
