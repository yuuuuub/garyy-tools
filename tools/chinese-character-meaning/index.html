<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字释义</title><meta name="description" content="汉字释义 - 在线查询汉字含义"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.character-display{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.character-main{font-size:6rem;font-weight:700;color:var(--blue)}.meaning-list{margin-top:16px}.meaning-item{padding:12px;background:var(--bg);border-radius:8px;margin-bottom:8px}.meaning-type{font-size:.85rem;color:var(--green);margin-bottom:4px;font-weight:600}.meaning-text{font-size:.9rem;color:var(--text);line-height:1.6}.meaning-example{font-size:.85rem;color:var(--text2);margin-top:4px;font-style:italic}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字释义"><meta property="og:description" content="汉字释义 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📖 汉字释义</h1><p class="sub">在线查询汉字含义</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="getMeaning()">
</div>
<button class="btn" onclick="getMeaning()">查询</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var meaningData={
  '中':{meanings:[{type:'名词',text:'中间，中心',example:'中央、中心、中间'},{type:'形容词',text:'中等的，普通的',example:'中等、中庸、中流'},{type:'动词',text:'击中，命中',example:'中奖、中靶、中选'}],origin:'甲骨文像旗帜飘扬之形，表示中央之意。'},
  '国':{meanings:[{type:'名词',text:'国家，国土',example:'中国、国家、国土'},{type:'名词',text:'国都，京城',example:'国人、国门'}],origin:'从囗从或，表示有疆界的地方。'},
  '人':{meanings:[{type:'名词',text:'人类，人们',example:'人们、人类、人生'},{type:'名词',text:'别人，他人',example:'人称、人品、人格'},{type:'量词',text:'用于人',example:'一家人、三个人'}],origin:'甲骨文像人侧面站立之形。'},
  '大':{meanings:[{type:'形容词',text:'大的，巨大的',example:'大小、大人、大学'},{type:'副词',text:'很，非常',example:'大约、大概、大事'},{type:'名词',text:'长大，年长',example:'老大、大嫂'}],origin:'甲骨文像人张开双臂之形，表示大。'},
  '小':{meanings:[{type:'形容词',text:'小的，微小',example:'大小、小孩、小学'},{type:'副词',text:'稍微',example:'小看、小心、小跑'},{type:'名词',text:'小的方面',example:'大小、小节'}],origin:'甲骨文像细小的沙粒之形。'},
  '天':{meanings:[{type:'名词',text:'天空',example:'天上、天空、天国'},{type:'名词',text:'一天，白天',example:'今天、明天、天黑'},{type:'形容词',text:'天然的',example:'天赋、天才、天性'}],origin:'甲骨文像人头顶之形，表示天空。'},
  '地':{meanings:[{type:'名词',text:'地面，土地',example:'土地、地球、地方'},{type:'助词',text:'状语标志',example:'慢慢地、轻轻地'}],origin:'从土从也，表示土地。'},
  '年':{meanings:[{type:'名词',text:'年份，年龄',example:'今年、明年、年代'},{type:'量词',text:'用于年',example:'一年、三年、年轻'}],origin:'甲骨文像人背负禾谷之形，表示丰收。'},
  '月':{meanings:[{type:'名词',text:'月亮，月份',example:'月亮、月光、月薪'},{type:'量词',text:'用于月',example:'一个月、两个月'}],origin:'甲骨文像月亮之形。'},
  '日':{meanings:[{type:'名词',text:'太阳，日子',example:'日出、日期、日记'},{type:'量词',text:'用于天',example:'一日、三日、日历'}],origin:'甲骨文像太阳之形。'},
  '水':{meanings:[{type:'名词',text:'水，液体',example:'河水、水果、水平'},{type:'量词',text:'用于水',example:'一水、两水'}],origin:'甲骨文像流水之形。'},
  '火':{meanings:[{type:'名词',text:'火，火焰',example:'火灾、火车、火柴'},{type:'形容词',text:'紧急的',example:'火速、火急、火暴'}],origin:'甲骨文像火焰之形。'},
  '木':{meanings:[{type:'名词',text:'木头，树木',example:'树木、木头、木材'},{type:'形容词',text:'木制的',example:'木桌、木椅、木门'}],origin:'甲骨文像树木之形。'},
  '金':{meanings:[{type:'名词',text:'金属，黄金',example:'黄金、金钱、金融'},{type:'形容词',text:'金色的',example:'金色、金黄'}],origin:'从金从今，表示金属。'},
  '土':{meanings:[{type:'名词',text:'土壤，土地',example:'土地、国土、土质'},{type:'形容词',text:'本地的',example:'土产、土话、土著'}],origin:'甲骨文像土堆之形。'},
  '山':{meanings:[{type:'名词',text:'山，山脉',example:'高山、山峰、山林'},{type:'量词',text:'用于山',example:'一座山、两座山'}],origin:'甲骨文像山峰之形。'},
  '石':{meanings:[{type:'名词',text:'石头，岩石',example:'石头、石块、石碑'},{type:'量词',text:'用于石头',example:'一石、两石'}],origin:'甲骨文像石块之形。'},
  '心':{meanings:[{type:'名词',text:'心脏，心思',example:'心情、心理、心意'},{type:'名词',text:'中心，中央',example:'中心、核心、重心'}],origin:'甲骨文像心脏之形。'},
  '手':{meanings:[{type:'名词',text:'手，手掌',example:'手指、手表、手段'},{type:'量词',text:'用于手',example:'一手、两手'}],origin:'甲骨文像手之形。'},
  '目':{meanings:[{type:'名词',text:'眼睛，目光',example:'目光、目标、目前'},{type:'动词',text:'看，注视',example:'目送、目击'}],origin:'甲骨文像眼睛之形。'},
  '口':{meanings:[{type:'名词',text:'嘴，口',example:'门口、出口、人口'},{type:'量词',text:'用于口',example:'一口、两口'}],origin:'甲骨文像嘴巴之形。'}
};
function getMeaning(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=meaningData[char];
  if(!data){
    data={meanings:[{type:'暂无',text:'暂无详细释义',example:'暂无例句'}],origin:'暂无字源信息'};
  }
  var html='<div class="card">';
  html+='<div class="character-display">';
  html+='<div class="character-main">'+char+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>释义</h3>';
  html+='<div class="meaning-list">';
  data.meanings.forEach(function(meaning){
    html+='<div class="meaning-item">';
    html+='<div class="meaning-type">'+meaning.type+'</div>';
    html+='<div class="meaning-text">'+meaning.text+'</div>';
    html+='<div class="meaning-example">例：'+meaning.example+'</div>';
    html+='</div>';
  });
  html+='</div></div>';
  html+='<div class="section"><h3>字源</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div>'+data.origin+'</div>';
  html+='</div></div>';
  html+='</div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(meaningData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  getMeaning();
}
getMeaning();
</script></body></html>
