<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebSocket 测试器 | WebSocket Tester</title>
<meta property="og:title" content="WebSocket 测试器 | WebSocket Tester">
<meta property="og:description" content="在线WebSocket连接测试工具，发送和接收实时消息">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线WebSocket测试工具，连接WebSocket服务器并实时收发消息">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<script src="i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.main{max-width:1200px;margin:0 auto;padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:.9rem;font-weight:500;display:flex;align-items:center;justify-content:space-between}
.card-body{padding:16px;flex:1;display:flex;flex-direction:column}
.input-bar{display:flex;gap:8px;margin-bottom:12px}
.input-bar input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.85rem;outline:none;font-family:'Fira Code',Consolas,monospace}
.input-bar input:focus{border-color:var(--accent)}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-danger:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-disconnected{background:var(--red)}
.status-connecting{background:var(--orange);animation:pulse 1s infinite}
.status-connected{background:var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.message-area{flex:1;min-height:300px;max-height:500px;overflow-y:auto;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'Fira Code',Consolas,monospace;font-size:.8rem;line-height:1.6}
.msg{margin-bottom:8px;padding:6px 10px;border-radius:6px;word-break:break-all}
.msg-sent{background:rgba(88,166,255,.15);border-left:3px solid var(--accent)}
.msg-received{background:rgba(63,185,80,.15);border-left:3px solid var(--green)}
.msg-system{background:var(--bg-tertiary);color:var(--text-secondary);font-style:italic;border-left:3px solid var(--text-secondary)}
.msg-time{font-size:.7rem;color:var(--text-secondary);margin-bottom:2px}
.msg-text{white-space:pre-wrap}
.send-bar{display:flex;gap:8px;margin-top:12px}
.send-bar textarea{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.85rem;font-family:'Fira Code',Consolas,monospace;resize:none;height:60px;outline:none;line-height:1.5}
.send-bar textarea:focus{border-color:var(--accent)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-item{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm)}
.info-label{font-size:.7rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px}
.info-value{font-size:.85rem;font-family:'Fira Code',Consolas,monospace;margin-top:2px}
.clear-btn{padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg-tertiary);color:var(--text-secondary);cursor:pointer;font-size:.75rem}
.clear-btn:hover{color:var(--red);border-color:var(--red)}
.empty-state{text-align:center;padding:40px;color:var(--text-secondary);font-size:.85rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<header class="app-header">
<div>
<h1>⚡ WebSocket 测试器</h1>
<span class="subtitle">连接 WebSocket 服务器并收发消息</span>
</div>
<div id="connStatus">
<span class="status-dot status-disconnected"></span>
<span style="font-size:.8rem">未连接</span>
</div>
</header>
<div class="main">
<div class="card">
<div class="card-header">
<span>🔌 连接配置</span>
</div>
<div class="card-body">
<div class="input-bar">
<input id="wsUrl" placeholder="wss://echo.websocket.org" value="wss://echo.websocket.org">
</div>
<div class="input-bar">
<button class="btn btn-primary" id="connectBtn" onclick="toggleConnection()">连接</button>
<button class="btn" onclick="setEcho()">Echo 服务器</button>
<button class="btn" onclick="setWSDemo()">WS Demo</button>
</div>
<div class="info-grid" style="margin-top:16px">
<div class="info-item">
<div class="info-label">状态</div>
<div class="info-value" id="infoState">Disconnected</div>
</div>
<div class="info-item">
<div class="info-label">协议</div>
<div class="info-value" id="infoProtocol">-</div>
</div>
<div class="info-item">
<div class="info-label">发送消息</div>
<div class="info-value" id="infoSent">0</div>
</div>
<div class="info-item">
<div class="info-label">接收消息</div>
<div class="info-value" id="infoReceived">0</div>
</div>
<div class="info-item">
<div class="info-label">连接时间</div>
<div class="info-value" id="infoTime">-</div>
</div>
<div class="info-item">
<div class="info-label">延迟</div>
<div class="info-value" id="infoLatency">-</div>
</div>
</div>
</div>
</div>

<div class="card">
<div class="card-header">
<span>💬 消息日志</span>
<button class="clear-btn" onclick="clearLog()">清空</button>
</div>
<div class="card-body" style="padding:0">
<div class="message-area" id="messageArea">
<div class="empty-state">连接 WebSocket 服务器后开始收发消息</div>
</div>
<div style="padding:12px;border-top:1px solid var(--border)">
<div class="send-bar">
<textarea id="msgInput" placeholder="输入要发送的消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
<div style="display:flex;flex-direction:column;gap:6px">
<button class="btn btn-primary" onclick="sendMessage()" id="sendBtn" disabled>发送</button>
<button class="btn" onclick="sendPing()">Ping</button>
</div>
</div>
</div>
</div>
</div>
</div>

<script>
let ws=null;
let sentCount=0;
let receivedCount=0;
let connectTime=null;
let pingTime=null;

function setEcho(){document.getElementById('wsUrl').value='wss://echo.websocket.org'}
function setWSDemo(){document.getElementById('wsUrl').value='wss://ws.postman-echo.com/raw'}

function toggleConnection(){
  if(ws&&ws.readyState===WebSocket.OPEN){
    ws.close();
  }else{
    connect();
  }
}

function connect(){
  const url=document.getElementById('wsUrl').value.trim();
  if(!url){showToast('请输入 WebSocket URL','error');return}

  try{
    ws=new WebSocket(url);
    updateStatus('connecting');
    addSystem('正在连接 '+url+'...');

    ws.onopen=()=>{
      updateStatus('connected');
      connectTime=Date.now();
      addSystem('已连接到 '+url);
      document.getElementById('infoState').textContent='Connected';
      document.getElementById('infoProtocol').textContent=ws.protocol||'-';
      document.getElementById('infoTime').textContent=new Date().toLocaleTimeString();
      document.getElementById('sendBtn').disabled=false;
    };

    ws.onmessage=(e)=>{
      receivedCount++;
      document.getElementById('infoReceived').textContent=receivedCount;
      addMessage('received',e.data);
    };

    ws.onclose=(e)=>{
      updateStatus('disconnected');
      addSystem(`连接关闭 (code: ${e.code}, reason: ${e.reason||'无'})`);
      document.getElementById('infoState').textContent='Disconnected';
      document.getElementById('sendBtn').disabled=true;
      document.getElementById('infoProtocol').textContent='-';
    };

    ws.onerror=()=>{
      addSystem('连接错误');
      document.getElementById('infoState').textContent='Error';
    };
  }catch(err){
    showToast('连接失败: '+err.message,'error');
  }
}

function sendMessage(){
  if(!ws||ws.readyState!==WebSocket.OPEN)return;
  const input=document.getElementById('msgInput');
  const msg=input.value.trim();
  if(!msg)return;

  ws.send(msg);
  sentCount++;
  document.getElementById('infoSent').textContent=sentCount;
  addMessage('sent',msg);
  input.value='';
}

function sendPing(){
  if(!ws||ws.readyState!==WebSocket.OPEN)return;
  const msg=JSON.stringify({type:'ping',time:Date.now()});
  pingTime=Date.now();
  ws.send(msg);
  sentCount++;
  document.getElementById('infoSent').textContent=sentCount;
  addMessage('sent',msg);
}

function addMessage(type,text){
  const area=document.getElementById('messageArea');
  const empty=area.querySelector('.empty-state');
  if(empty)empty.remove();

  const time=new Date().toLocaleTimeString();
  const div=document.createElement('div');
  div.className='msg msg-'+type;
  div.innerHTML=`<div class="msg-time">${time} ${type==='sent'?'→ 发送':'← 接收'}</div><div class="msg-text">${esc(text)}</div>`;
  area.appendChild(div);
  area.scrollTop=area.scrollHeight;
}

function addSystem(text){
  const area=document.getElementById('messageArea');
  const empty=area.querySelector('.empty-state');
  if(empty)empty.remove();

  const time=new Date().toLocaleTimeString();
  const div=document.createElement('div');
  div.className='msg msg-system';
  div.innerHTML=`<div class="msg-time">${time}</div><div class="msg-text">${esc(text)}</div>`;
  area.appendChild(div);
  area.scrollTop=area.scrollHeight;
}

function updateStatus(status){
  const el=document.getElementById('connStatus');
  const btn=document.getElementById('connectBtn');
  if(status==='connected'){
    el.innerHTML='<span class="status-dot status-connected"></span><span style="font-size:.8rem">已连接</span>';
    btn.textContent='断开';
    btn.className='btn btn-danger';
  }else if(status==='connecting'){
    el.innerHTML='<span class="status-dot status-connecting"></span><span style="font-size:.8rem">连接中...</span>';
    btn.textContent='取消';
    btn.className='btn';
  }else{
    el.innerHTML='<span class="status-dot status-disconnected"></span><span style="font-size:.8rem">未连接</span>';
    btn.textContent='连接';
    btn.className='btn btn-primary';
    btn.disabled=false;
  }
}

function clearLog(){
  document.getElementById('messageArea').innerHTML='<div class="empty-state">连接 WebSocket 服务器后开始收发消息</div>';
  sentCount=0;receivedCount=0;
  document.getElementById('infoSent').textContent='0';
  document.getElementById('infoReceived').textContent='0';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function showToast(msg,type='success'){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:.85rem;font-weight:500;z-index:99999;transition:opacity .3s;background:var(--green);color:#fff';
  if(type==='error')t.style.background='var(--red)';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2000);
}
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
