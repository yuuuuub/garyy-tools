<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚌 智能公共交通</title>
<meta name="description" content="智能公共交通系统，实时公交查询、线路规划、乘车码、到站提醒">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:1100px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.stat-card .icon{font-size:1.8rem;margin-bottom:4px}
.stat-card .val{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.8rem;color:var(--text2)}
.line-list{max-height:400px;overflow-y:auto}
.line-item{padding:14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.line-item:hover{background:var(--bg)}
.line-item .top{display:flex;justify-content:space-between;align-items:center}
.line-item .name{font-weight:600;font-size:.95rem}
.line-item .badge{padding:2px 8px;border-radius:10px;font-size:.75rem}
.badge-running{background:rgba(34,197,94,.15);color:var(--success)}
.badge-stop{background:rgba(239,68,68,.15);color:var(--danger)}
.line-item .route{font-size:.8rem;color:var(--text2);margin-top:4px}
.line-item .next{font-size:.8rem;color:var(--accent);margin-top:4px}
.station-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}
.station{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;text-align:center;font-size:.8rem;cursor:pointer;transition:all .2s}
.station:hover{border-color:var(--accent)}
.station.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.station .time{font-size:.7rem;color:var(--text2);margin-top:2px}
.station.active .time{color:rgba(255,255,255,.8)}
.subway-map{overflow-x:auto;padding:10px 0}
.subway-line{display:flex;align-items:center;gap:0;margin-bottom:10px}
.subway-station{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:600;position:relative;z-index:1;cursor:pointer;transition:all .2s}
.subway-station:hover{transform:scale(1.2)}
.subway-connector{width:30px;height:4px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.8rem;transition:all .2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text]{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.85rem;margin-bottom:8px}
.btn{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-size:.85rem}
.btn:hover{background:var(--accent2)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🚌 智能公共交通">
<meta property="og:description" content="智能公共交通系统，实时公交查询、线路规划、乘车码、到站提醒">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🚌 智能公共交通</h1><p>实时公交查询、线路规划、乘车码、到站提醒</p></div>

<div class="cd">
<h2>📊 运营概况</h2>
<div class="grid" id="stats"></div>
</div>

<div class="cd">
<h2>🔍 查询公交线路</h2>
<input type="text" id="searchInput" placeholder="输入线路号或站点名称...">
<div class="tabs" id="lineTabs"></div>
<div class="line-list" id="lineList"></div>
<div class="station-grid" id="stationGrid"></div>
</div>

<div class="cd">
<h2>🚇 地铁线路图</h2>
<div class="subway-map" id="subwayMap"></div>
</div>

<div class="cd">
<h2>📱 乘车码</h2>
<div id="qrcodeArea" style="text-align:center;padding:20px"></div>
</div>

<div class="cd">
<h2>📋 乘车记录</h2>
<div id="rideHistory"></div>
</div>
</div>

<script src="i18n.js" defer></script>
<script>
(function(){
var lines=[
  {name:'1路',from:'老山公交场站',to:'四惠枢纽站',interval:5,status:'running',stations:['老山','八宝山','玉泉路','军事博物馆','木樨地','工会大楼','南礼士路','复兴门','西单','天安门西','天安门东','东单','北京站口东','日坛路','大北窑','四惠']},
  {name:'52路',from:'平乐园',to:'西直门',interval:6,status:'running',stations:['平乐园','北工大','潘家园','劲松','双井','国贸','大北窑','呼家楼','金台夕照','亮马桥','三元桥','静安庄','国际展览中心','西直门']},
  {name:'300路',from:'十里河桥西',to:'十里河桥西',interval:4,status:'running',stations:['十里河','潘家园','双井','国贸','大望路','四惠','十里河桥西']},
  {name:'快速公交1线',from:'德茂庄',to:'前门',interval:3,status:'running',stations:['德茂庄','东高地','万源路','集美家居','前门']},
  {name:'夜28路',from:'地铁回龙观站',to:'北京西站',interval:15,status:'stop',stations:['回龙观','龙泽','西二旗','上地','五道口','知春路','积水潭','德胜门','鼓楼','安定门','雍和宫','北京站','崇文门','北京西站']}
];
var subwayLines=[
  {name:'1号线',color:'#c23a30',stations:['苹果园','古城','八角游乐园','八宝山','玉泉路','五棵松','万寿路','公主坟','军事博物馆','木樨地','南礼士路','复兴门','西单','天安门西','天安门东','王府井','东单','建国门','永安里','国贸','大望路','四惠','四惠东']},
  {name:'2号线',color:'#006098',stations:['西直门','积水潭','鼓楼大街','安定门','雍和宫','东直门','东四十条','朝阳门','建国门','北京站','崇文门','前门','和平门','宣武门','长椿街','复兴门','阜成门','车公庄']},
  {name:'4号线',color:'#008e9e',stations:['安河桥北','北宫门','西苑','圆明园','北京大学东门','中关村','海淀黄庄','人民大学','魏公村','国家图书馆','动物园','西直门','新街口','平安里','西四','灵境胡同','西单','宣武门','菜市口','陶然亭','北京南站']}
];
var currentTab='全部';

function renderStats(){
  var data=[
    {icon:'🚌',val:Math.round(3000+Math.random()*1000),label:'运营车辆'},
    {icon:'👥',val:Math.round(500+Math.random()*300)+'万',label:'今日客运量'},
    {icon:'⏱️',val:Math.round(3+Math.random()*5)+'min',label:'平均发车间隔'},
    {icon:'✅',val:Math.round(90+Math.random()*8)+'%',label:'准点率'},
    {icon:'💰',val:'¥'+Math.round(2000+Math.random()*1000)+'万',label:'今日营收'},
    {icon:'📱',val:Math.round(200+Math.random()*100)+'万',label:'扫码乘车'}
  ];
  var h='';
  data.forEach(function(d){h+='<div class="stat-card"><div class="icon">'+d.icon+'</div><div class="val">'+d.val+'</div><div class="label">'+d.label+'</div></div>'});
  document.getElementById('stats').innerHTML=h;
}

function renderLineTabs(){
  var tabs=['全部','运行中','已停运'];
  var h='';
  tabs.forEach(function(t){h+='<div class="tab'+(t===currentTab?' active':'')+'" onclick="filterLines(\''+t+'\')">'+t+'</div>'});
  document.getElementById('lineTabs').innerHTML=h;
}

window.filterLines=function(tab){
  currentTab=tab;
  renderLineTabs();
  renderLines();
};

function renderLines(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=lines.filter(function(l){
    if(currentTab==='运行中'&&l.status!=='running') return false;
    if(currentTab==='已停运'&&l.status!=='stop') return false;
    if(search&&l.name.toLowerCase().indexOf(search)===-1) return false;
    return true;
  });
  var h='';
  filtered.forEach(function(l,i){
    var nextMin=Math.round(1+Math.random()*l.interval);
    h+='<div class="line-item" onclick="showStations('+i+')"><div class="top"><span class="name">🚌 '+l.name+'</span><span class="badge '+(l.status==='running'?'badge-running':'badge-stop')+'">'+(l.status==='running'?'运行中':'已停运')+'</span></div><div class="route">'+l.from+' → '+l.to+'</div><div class="next">下一班：约'+nextMin+'分钟 · '+l.stations.length+'站</div></div>';
  });
  document.getElementById('lineList').innerHTML=h||'<div style="text-align:center;color:var(--text2);padding:20px">暂无匹配线路</div>';
}

window.showStations=function(idx){
  var l=lines[idx];
  var h='';
  l.stations.forEach(function(s,i){
    var arrival=i<3?'即将到站':Math.round(2+i*1.5)+'分钟后';
    h+='<div class="station'+(i===0?' active':'')+'" onclick="selectStation(this)"><div>●</div><div>'+s+'</div><div class="time">'+(l.status==='running'?arrival:'停运')+'</div></div>';
  });
  document.getElementById('stationGrid').innerHTML=h;
};

window.selectStation=function(el){
  document.querySelectorAll('.station').forEach(function(s){s.classList.remove('active')});
  el.classList.add('active');
};

function renderSubway(){
  var h='';
  subwayLines.forEach(function(line){
    h+='<div class="subway-line"><div style="font-size:.7rem;font-weight:600;min-width:60px;color:'+line.color+'">'+line.name+'</div>';
    line.stations.forEach(function(s,i){
      h+='<div class="subway-station" style="background:'+line.color+';color:#fff;border:2px solid #fff;box-shadow:0 0 0 2px '+line.color+'" title="'+s+'">'+s.charAt(0)+'</div>';
      if(i<line.stations.length-1) h+='<div class="subway-connector" style="background:'+line.color+'"></div>';
    });
    h+='</div>';
  });
  document.getElementById('subwayMap').innerHTML=h;
}

function renderQRCode(){
  var code=Math.random().toString(36).substring(2,14).toUpperCase();
  document.getElementById('qrcodeArea').innerHTML='<div style="width:160px;height:160px;background:#fff;margin:0 auto 12px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:2px solid var(--border)"><div style="font-size:3rem">📱</div></div><div style="font-size:1.2rem;font-weight:700;color:var(--accent);margin-bottom:4px">'+code+'</div><div style="font-size:.8rem;color:var(--text2)">向司机出示此码乘车</div><button class="btn" style="margin-top:12px" onclick="refreshQR()">刷新二维码</button>';
}

window.refreshQR=function(){renderQRCode();garyyToast('二维码已刷新','success')};

function renderHistory(){
  var routes=['1路','52路','300路','快速公交1线','地铁2号线'];
  var h='';
  for(var i=0;i<5;i++){
    var entry=Random.time(24)+':'+Random.int(0,59).toString().padStart(2,'0');
    h+='<div style="display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:.85rem"><span style="margin-right:8px">🚌</span><span style="flex:1"><strong>'+Random.pick(routes)+'</strong><br><span style="font-size:.8rem;color:var(--text2)">'+entry+'乘车 · 费用 ¥'+(2+Math.round(Math.random()*5))+'</span></span></div>';
  }
  document.getElementById('rideHistory').innerHTML=h;
}

document.getElementById('searchInput').addEventListener('input',function(){renderLines()});
renderStats();renderLineTabs();renderLines();renderSubway();renderQRCode();renderHistory();
setInterval(renderStats,10000);
})();
</script>
</body>
</html>
