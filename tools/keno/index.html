<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>基诺</title>
<meta name="description" content="基诺彩票游戏，在线体验基诺数字抽奖"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#8b5cf6;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20pxscroll-behavior:smooth;}
h1{font-size:1.8em;margin-bottom:8px;text-align:center}
.subtitle{color:#8b949e;margin-bottom:20px;text-align:center;font-size:.9em}
.game-area{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:100%;margin-bottom:16px}
.btn{background:var(--accent);color:var(--text);border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:1em;transition:all .2s}
.btn:hover{opacity:.9;transform:scale(1.02)}
.btn:active{transform:scale(.98)}
.btn-sm{padding:6px 14px;font-size:.85em}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-yellow{background:var(--yellow);color:#000}.btn-orange{background:var(--orange)}
.flex{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;gap:4px}
.info{text-align:center;color:#8b949e;margin:12px 0;font-size:.95em}
.result{text-align:center;font-size:1.2em;margin:16px 0;padding:16px;border-radius:8px;background:var(--bg);min-height:40px}
.token{display:inline-block;padding:4px 10px;margin:3px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.token:hover{border-color:var(--accent)}
.token.active{background:var(--accent);border-color:var(--accent);color:var(--text)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media(max-width:480px){body{padding:12px}.game-area{padding:16px}h1{font-size:1.4em}}
</style><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="基诺">
  <meta property="og:description" content="基诺彩票游戏，在线体验基诺数字抽奖">
  <meta property="og:type" content="website">

</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>基诺</h1><p class="subtitle">经典基诺数字游戏</p>
<div class="game-area"><div id="board" class="grid" style="grid-template-columns:repeat(8,44px);margin:0 auto;width:fit-content"></div>
<div class="flex" style="margin-top:16px"><button class="btn" onclick="newKeno()">新游戏</button><button class="btn btn-green" onclick="drawKeno()">开奖</button></div>
<div class="result" id="result"></div>
<script>
let selected=new Set();
function render(){const b=document.getElementById('board');b.innerHTML='';
for(let i=1;i<=40;i++){const d=document.createElement('div');
d.style.cssText='width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:'+(selected.has(i)?'var(--accent)':'var(--card)');
d.textContent=i;d.onclick=()=>{selected.has(i)?selected.delete(i):selected.add(i);render();};b.appendChild(d);}}
function newKeno(){selected.clear();render();document.getElementById('result').innerHTML='选择1-10个号码';}
function drawKeno(){if(selected.size===0)return;const draw=new Set();while(draw.size<20)draw.add(Math.floor(Math.random()*40)+1);
const hits=[...selected].filter(n=>draw.has(n)).length;
document.getElementById('result').innerHTML='开奖: '+[...draw].sort((a,b)=>a-b).join(' ')+'<br>命中 '+hits+'/'+selected.size;}
newKeno();</script>
</div><script src="../i18n.js" defer></script>
</body></html>
