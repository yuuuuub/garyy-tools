<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>百分比计算器</title><meta name="description" content="百分比计算器 - 在线百分比计算工具"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.calc-row{display:flex;gap:8px;align-items:center;margin:8px 0}.calc-row input{flex:1;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem}.calc-row span{color:var(--text2);font-size:.9rem}.calc-row .result{font-weight:600;color:var(--blue);min-width:100px;text-align:right}</style><meta property="og:title" content="百分比计算器"><meta property="og:description" content="百分比计算器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"></head><body>
<div class="container"><h1>📊 百分比计算器</h1><p class="sub">在线百分比计算工具</p>
<div class="card">
<h3>计算A是B的百分之几</h3>
<div class="calc-row">
<input type="number" id="calc1A" placeholder="A" oninput="calc1()">
<span>是</span>
<input type="number" id="calc1B" placeholder="B" oninput="calc1()">
<span>的</span>
<span class="result" id="result1">0%</span>
</div>
</div>
<div class="card">
<h3>计算A的B%是多少</h3>
<div class="calc-row">
<input type="number" id="calc2A" placeholder="A" oninput="calc2()">
<span>的</span>
<input type="number" id="calc2B" placeholder="B%" oninput="calc2()">
<span>是</span>
<span class="result" id="result2">0</span>
</div>
</div>
<div class="card">
<h3>计算百分比变化</h3>
<div class="calc-row">
<input type="number" id="calc3A" placeholder="原值" oninput="calc3()">
<span>→</span>
<input type="number" id="calc3B" placeholder="新值" oninput="calc3()">
<span>变化</span>
<span class="result" id="result3">0%</span>
</div>
</div>
<div class="card">
<h3>计算折扣后价格</h3>
<div class="calc-row">
<input type="number" id="calc4A" placeholder="原价" oninput="calc4()">
<span>×</span>
<input type="number" id="calc4B" placeholder="折扣%" oninput="calc4()">
<span>=</span>
<span class="result" id="result4">0</span>
</div>
</div>
<div class="card">
<h3>计算加税后价格</h3>
<div class="calc-row">
<input type="number" id="calc5A" placeholder="价格" oninput="calc5()">
<span>×</span>
<input type="number" id="calc5B" placeholder="税率%" oninput="calc5()">
<span>=</span>
<span class="result" id="result5">0</span>
</div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function calc1(){
  var a=parseFloat(document.getElementById('calc1A').value)||0;
  var b=parseFloat(document.getElementById('calc1B').value)||0;
  var result=b===0?0:(a/b*100);
  document.getElementById('result1').textContent=result.toFixed(2)+'%';
}
function calc2(){
  var a=parseFloat(document.getElementById('calc2A').value)||0;
  var b=parseFloat(document.getElementById('calc2B').value)||0;
  var result=a*(b/100);
  document.getElementById('result2').textContent=result.toFixed(2);
}
function calc3(){
  var a=parseFloat(document.getElementById('calc3A').value)||0;
  var b=parseFloat(document.getElementById('calc3B').value)||0;
  var result=a===0?0:((b-a)/a*100);
  document.getElementById('result3').textContent=result.toFixed(2)+'%';
}
function calc4(){
  var a=parseFloat(document.getElementById('calc4A').value)||0;
  var b=parseFloat(document.getElementById('calc4B').value)||0;
  var result=a*(1-b/100);
  document.getElementById('result4').textContent=result.toFixed(2);
}
function calc5(){
  var a=parseFloat(document.getElementById('calc5A').value)||0;
  var b=parseFloat(document.getElementById('calc5B').value)||0;
  var result=a*(1+b/100);
  document.getElementById('result5').textContent=result.toFixed(2);
}
calc1();calc2();calc3();calc4();calc5();
</script></body></html>
