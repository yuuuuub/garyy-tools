<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汇率换算器</title>
<meta property="og:title" content="汇率换算器">
<meta property="og:description" content="汇率换算器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="实时汇率换算工具，支持全球主要货币互换">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💱</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#3fb950;--yellow:#d29922;--red:#f85149}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;padding:16px}
.header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.header h1{font-size:20px;white-space:nowrap}
.header h1 span{font-size:24px}
.converter{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.converter-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.currency-box{flex:1;min-width:200px}
.currency-box label{font-size:12px;color:var(--text2);display:block;margin-bottom:6px}
.currency-box select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:8px}
.currency-box .amount{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:12px;font-size:24px;font-weight:700}
.currency-box .amount:focus{border-color:var(--accent);outline:none}
.swap-btn{background:var(--accent);color:#fff;border:none;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:18px;flex-shrink:0;transition:transform .2s}
.swap-btn:hover{transform:rotate(180deg)}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:16px}
.result-card .big-result{font-size:36px;font-weight:700;color:var(--accent);margin:8px 0}
.result-card .rate-info{font-size:14px;color:var(--text2)}
.quick-amounts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.quick-btn{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;transition:all .15s}
.quick-btn:hover,.quick-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.rate-table{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.rate-table h3{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px}
.rate-table table{width:100%;border-collapse:collapse}
.rate-table th,.rate-table td{padding:8px 16px;text-align:left;font-size:13px;border-bottom:1px solid var(--border)}
.rate-table th{background:var(--bg);color:var(--text2);font-weight:600;font-size:12px}
.rate-table tr:hover{background:var(--bg)}
.rate-table .rate-val{font-weight:600;color:var(--accent)}
.history{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.history h3{font-size:14px;margin-bottom:12px}
.history-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.history-item:last-child{border:none}
.history-item .hl{color:var(--text2)}
.history-item .hr{font-weight:600}
.copy-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--green);color:#fff;padding:8px 20px;border-radius:8px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.copy-toast.show{opacity:1}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="header">
<h1><span>💱</span> 汇率换算器</h1>
<div style="margin-left:auto;font-size:12px;color:var(--text2)" id="updateTime"></div>
</div>
<div class="converter">
<div class="converter-row">
<div class="currency-box">
<label>源货币</label>
<select id="fromCurrency" onchange="convert()"></select>
<input type="number" class="amount" id="fromAmount" value="1000" oninput="convert()">
</div>
<button class="swap-btn" onclick="swapCurrency()" title="交换">⇄</button>
<div class="currency-box">
<label>目标货币</label>
<select id="toCurrency" onchange="convert()"></select>
<input type="text" class="amount" id="toAmount" readonly>
</div>
</div>
</div>
<div class="quick-amounts">
<span style="font-size:13px;color:var(--text2);padding:6px 0">快捷金额：</span>
<button class="quick-btn" onclick="setAmount(100)">100</button>
<button class="quick-btn" onclick="setAmount(500)">500</button>
<button class="quick-btn" onclick="setAmount(1000)">1,000</button>
<button class="quick-btn" onclick="setAmount(5000)">5,000</button>
<button class="quick-btn" onclick="setAmount(10000)">10,000</button>
<button class="quick-btn" onclick="setAmount(50000)">50,000</button>
</div>
<div class="result-card">
<div class="rate-info" id="rateText">1 CNY = 0.14 USD</div>
<div class="big-result" id="bigResult">¥1,000 = $140.00</div>
<div class="rate-info" id="rateInverse">1 USD = 7.14 CNY</div>
</div>
<div class="rate-table">
<h3>📊 常用货币汇率 (基于CNY)</h3>
<table><thead><tr><th>货币</th><th>代码</th><th>1 CNY =</th><th>1 = CNY</th><th>换1000CNY</th></tr></thead>
<tbody id="rateTableBody"></tbody></table>
</div>
<div class="history">
<h3>📝 最近换算</h3>
<div id="historyList"><div style="color:var(--text2);font-size:13px">暂无记录</div></div>
</div>
<script>
const currencies=[
{code:'CNY',name:'人民币',symbol:'¥',flag:'🇨🇳',rate:1},
{code:'USD',name:'美元',symbol:'$',flag:'🇺🇸',rate:0.1378},
{code:'EUR',name:'欧元',symbol:'€',flag:'🇪🇺',rate:0.1268},
{code:'GBP',name:'英镑',symbol:'£',flag:'🇬🇧',rate:0.1093},
{code:'JPY',name:'日元',symbol:'¥',flag:'🇯🇵',rate:20.73},
{code:'KRW',name:'韩元',symbol:'₩',flag:'🇰🇷',rate:188.5},
{code:'HKD',name:'港币',symbol:'HK$',flag:'🇭🇰',rate:1.074},
{code:'TWD',name:'新台币',symbol:'NT$',flag:'🇹🇼',rate:4.38},
{code:'SGD',name:'新加坡元',symbol:'S$',flag:'🇸🇬',rate:0.187},
{code:'THB',name:'泰铢',symbol:'฿',flag:'🇹🇭',rate:4.95},
{code:'MYR',name:'马来西亚林吉特',symbol:'RM',flag:'🇲🇾',rate:0.612},
{code:'AUD',name:'澳元',symbol:'A$',flag:'🇦🇺',rate:0.210},
{code:'CAD',name:'加元',symbol:'C$',flag:'🇨🇦',rate:0.189},
{code:'CHF',name:'瑞士法郎',symbol:'CHF',flag:'🇨🇭',rate:0.123},
{code:'SEK',name:'瑞典克朗',symbol:'kr',flag:'🇸🇪',rate:1.44},
{code:'NZD',name:'新西兰元',symbol:'NZ$',flag:'🇳🇿',rate:0.226},
{code:'INR',name:'印度卢比',symbol:'₹',flag:'🇮🇳',rate:11.52},
{code:'RUB',name:'俄罗斯卢比',symbol:'₽',flag:'🇷🇺',rate:12.65},
{code:'BRL',name:'巴西雷亚尔',symbol:'R$',flag:'🇧🇷',rate:0.72},
{code:'AED',name:'阿联酋迪拉姆',symbol:'د.إ',flag:'🇦🇪',rate:0.506},
{code:'SAR',name:'沙特里亚尔',symbol:'﷼',flag:'🇸🇦',rate:0.517},
{code:'ZAR',name:'南非兰特',symbol:'R',flag:'🇿🇦',rate:2.54},
{code:'TRY',name:'土耳其里拉',symbol:'₺',flag:'🇹🇷',rate:4.68},
{code:'MXN',name:'墨西哥比索',symbol:'$',flag:'🇲🇽',rate:2.35},
{code:'PHP',name:'菲律宾比索',symbol:'₱',flag:'🇵🇭',rate:7.78},
{code:'IDR',name:'印尼盾',symbol:'Rp',flag:'🇮🇩',rate:2175},
{code:'VND',name:'越南盾',symbol:'₫',flag:'🇻🇳',rate:3482}
];
let history=JSON.parse(localStorage.getItem('currencyHistory')||'[]');
function initSelects(){
const from=document.getElementById('fromCurrency');
const to=document.getElementById('toCurrency');
from.innerHTML=currencies.map(c=>`<option value="${c.code}">${c.flag} ${c.code} ${c.name}</option>`).join('');
to.innerHTML=currencies.map(c=>`<option value="${c.code}">${c.flag} ${c.code} ${c.name}</option>`).join('');
from.value='CNY';to.value='USD';
}
function convert(){
const fromCode=document.getElementById('fromCurrency').value;
const toCode=document.getElementById('toCurrency').value;
const amount=parseFloat(document.getElementById('fromAmount').value)||0;
const fromCur=currencies.find(c=>c.code===fromCode);
const toCur=currencies.find(c=>c.code===toCode);
if(!fromCur||!toCur)return;
const inCNY=amount/fromCur.rate;
const result=inCNY*toCur.rate;
const formatted=result.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
document.getElementById('toAmount').value=formatted;
const rate1=toCur.rate/fromCur.rate;
const rate2=fromCur.rate/toCur.rate;
document.getElementById('rateText').textContent=`1 ${fromCode} = ${rate1.toFixed(4)} ${toCode}`;
document.getElementById('bigResult').textContent=`${fromCur.symbol}${amount.toLocaleString()} = ${toCur.symbol}${formatted}`;
document.getElementById('rateInverse').textContent=`1 ${toCode} = ${rate2.toFixed(4)} ${fromCode}`;
renderRateTable(fromCode);
addToHistory(fromCode,toCode,amount,formatted);
}
function renderRateTable(baseCode){
const base=currencies.find(c=>c.code===baseCode);
const tbody=document.getElementById('rateTableBody');
const display=currencies.filter(c=>c.code!==baseCode).slice(0,12);
tbody.innerHTML=display.map(c=>{
const rate=base.rate/c.rate;
const inv=1/rate;
const conv=(1000*inv).toFixed(2);
return `<tr><td>${c.flag} ${c.name}</td><td>${c.code}</td><td class="rate-val">${rate.toFixed(4)}</td><td>${inv.toFixed(4)}</td><td>${c.symbol}${parseFloat(conv).toLocaleString()}</td></tr>`;
}).join('');
}
function swapCurrency(){
const f=document.getElementById('fromCurrency');
const t=document.getElementById('toCurrency');
[f.value,t.value]=[t.value,f.value];
convert();
}
function setAmount(v){document.getElementById('fromAmount').value=v;convert();}
function addToHistory(from,to,amt,result){
history.unshift({from,to,amt,result,time:new Date().toLocaleTimeString()});
history=history.slice(0,10);
localStorage.setItem('currencyHistory',JSON.stringify(history));
renderHistory();
}
function renderHistory(){
const el=document.getElementById('historyList');
if(!history.length){el.innerHTML='<div style="color:var(--text2);font-size:13px">暂无记录</div>';return;}
el.innerHTML=history.map(h=>`<div class="history-item"><span class="hl">${h.time} ${h.from}→${h.to}</span><span class="hr">${h.amt} → ${h.result}</span></div>`).join('');
}
document.getElementById('updateTime').textContent='更新: '+new Date().toLocaleString('zh-CN');
initSelects();convert();renderHistory();
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();}if(e.key==='Escape'){}});
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
