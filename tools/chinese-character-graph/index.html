<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字关系图</title><meta name="description" content="汉字关系图 - 在线查看汉字关系图"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.graph-container{position:relative;width:100%;height:400px;background:var(--bg);border-radius:12px;margin:16px 0;overflow:hidden}.graph-node{position:absolute;padding:12px;background:var(--card);border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;z-index:1}.graph-node:hover{border-color:var(--blue);transform:scale(1.1);z-index:2}.graph-node.center{border-color:var(--green);background:rgba(35,134,54,.1)}.graph-char{font-size:1.5rem;font-weight:700;color:var(--blue);text-align:center}.graph-pinyin{font-size:.75rem;color:var(--text2);text-align:center;margin-top:2px}.graph-line{position:absolute;height:2px;background:var(--border);transform-origin:left center;z-index:0}</style><meta property="og:title" content="汉字关系图"><meta property="og:description" content="汉字关系图 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div class="container"><h1>🕸️ 汉字关系图</h1><p class="sub">在线查看汉字关系图</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="showGraph()">
</div>
<button class="btn" onclick="showGraph()">查看关系图</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var graphData={
  '明':{related:[{char:'日',relation:'部件'},{char:'月',relation:'部件'},{char:'朋',relation:'相似'},{char:'朝',relation:'包含'}]},
  '林':{related:[{char:'木',relation:'部件'},{char:'森',relation:'递增'},{char:'村',relation:'组合'},{char:'树',relation:'组合'}]},
  '森':{related:[{char:'木',relation:'部件'},{char:'林',relation:'递减'},{char:'梦',relation:'组合'},{char:'楚',relation:'组合'}]},
  '从':{related:[{char:'人',relation:'部件'},{char:'众',relation:'递增'},{char:'仁',relation:'组合'},{char:'会',relation:'组合'}]},
  '众':{related:[{char:'人',relation:'部件'},{char:'从',relation:'递减'},{char:'会',relation:'组合'},{char:'众',relation:'相同'}]},
  '品':{related:[{char:'口',relation:'部件'},{char:'器',relation:'组合'},{char:'回',relation:'相似'},{char:'吕',relation:'相似'}]},
  '晶':{related:[{char:'日',relation:'部件'},{char:'明',relation:'组合'},{char:'星',relation:'组合'},{char:'晨',relation:'组合'}]},
  '鑫':{related:[{char:'金',relation:'部件'},{char:'银',relation:'相似'},{char:'铜',relation:'相似'},{char:'铁',relation:'相似'}]},
  '淼':{related:[{char:'水',relation:'部件'},{char:'河',relation:'组合'},{char:'海',relation:'组合'},{char:'湖',relation:'组合'}]},
  '焱':{related:[{char:'火',relation:'部件'},{char:'灯',relation:'组合'},{char:'烟',relation:'组合'},{char:'炉',relation:'组合'}]},
  '垚':{related:[{char:'土',relation:'部件'},{char:'地',relation:'组合'},{char:'城',relation:'组合'},{char:'场',relation:'组合'}]},
  '犇':{related:[{char:'牛',relation:'部件'},{char:'牧',relation:'组合'},{char:'物',relation:'组合'},{char:'特',relation:'组合'}]},
  '骉':{related:[{char:'马',relation:'部件'},{char:'骑',relation:'组合'},{char:'驱',relation:'组合'},{char:'驰',relation:'组合'}]},
  '鱻':{related:[{char:'鱼',relation:'部件'},{char:'鲜',relation:'组合'},{char:'鲤',relation:'组合'},{char:'鲸',relation:'组合'}]},
  '猋':{related:[{char:'犬',relation:'部件'},{char:'狗',relation:'组合'},{char:'猫',relation:'相似'},{char:'狼',relation:'组合'}]},
  '麤':{related:[{char:'鹿',relation:'部件'},{char:'麒',relation:'组合'},{char:'麟',relation:'组合'},{char:'麝',relation:'组合'}]}
};
function showGraph(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=graphData[char];
  if(!data){
    data={related:[]};
  }
  var html='<div class="card">';
  html+='<div class="section"><h3>🕸️ '+char+' 的关系图</h3></div>';
  html+='<div class="graph-container" id="graphContainer">';
  html+='<div class="graph-node center" style="left:50%;top:50%;transform:translate(-50%,-50%)">';
  html+='<div class="graph-char">'+char+'</div>';
  html+='</div>';
  var relatedChars=data.related;
  var radius=150;
  var angleStep=360/relatedChars.length;
  relatedChars.forEach(function(item,index){
    var angle=index*angleStep*Math.PI/180;
    var x=50+50*Math.cos(angle);
    var y=50+50*Math.sin(angle);
    html+='<div class="graph-node" style="left:'+x+'%;top:'+y+'%;transform:translate(-50%,-50%)">';
    html+='<div class="graph-char">'+item.char+'</div>';
    html+='<div class="graph-pinyin">'+item.relation+'</div>';
    html+='</div>';
  });
  html+='</div>';
  html+='<div class="section"><h3>📊 关系详情</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  relatedChars.forEach(function(item){
    html+='<div style="margin-bottom:8px"><strong>'+char+'</strong> → <strong>'+item.char+'</strong> ('+item.relation+')</div>';
  });
  html+='</div></div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(graphData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showGraph();
}
showGraph();
</script></body></html>
