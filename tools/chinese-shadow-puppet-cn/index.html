<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国皮影戏</title><meta name="description" content="中国皮影戏 - 在线了解中国皮影艺术"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a017;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .2s}.item:hover{transform:translateY(-2px)}.item-title{font-size:1.2rem;font-weight:600;color:var(--gold);margin-bottom:8px}.item-meta{font-size:.9rem;color:var(--text2);margin-bottom:4px}.item-display{font-size:3rem;text-align:center;padding:30px;background:var(--bg);border-radius:8px;margin-bottom:12px;min-height:100px;display:flex;align-items:center;justify-content:center}.item-desc{font-size:.9rem;color:var(--text)}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .2s}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;position:relative}.modal h2{color:var(--gold);margin-bottom:12px}.modal p{color:var(--text2);line-height:1.8;margin-bottom:12px}.close-btn{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer}.theme-toggle{position:fixed;top:8px;right:80px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;color:var(--text);font-size:.75rem}.stage{background:linear-gradient(180deg,#1a0a2e 0%,#2d1b4e 50%,#0d1117 100%);border-radius:12px;padding:30px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden;min-height:200px}.stage::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,200,100,.15) 0%,transparent 70%);pointer-events:none}.stage-title{color:var(--gold);font-size:1.1rem;margin-bottom:16px;position:relative;z-index:1}.puppets{display:flex;justify-content:center;gap:40px;position:relative;z-index:1}.puppet{font-size:4rem;cursor:pointer;transition:transform .3s;animation:puppetMove 3s ease-in-out infinite alternate}.puppet:hover{transform:scale(1.2)}.puppet:nth-child(2){animation-delay:.5s}.puppet:nth-child(3){animation-delay:1s}@keyframes puppetMove{from{transform:translateX(-5px) rotate(-3deg)}to{transform:translateX(5px) rotate(3deg)}}.controls{display:flex;gap:8px;justify-content:center;margin-top:12px;position:relative;z-index:1}</style><meta property="og:title" content="中国皮影戏"><meta property="og:description" content="中国皮影戏 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>"></head><body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎭 中国皮影戏</h1><p class="sub">在线了解中国皮影艺术</p>
<div class="stage">
<div class="stage-title" id="stageTitle">🎬 白蛇传 - 断桥相会</div>
<div class="puppets" id="puppetsArea">
<span class="puppet" onclick="movePuppet(this)">👤</span>
<span class="puppet" onclick="movePuppet(this)">👤</span>
<span class="puppet" onclick="movePuppet(this)">🌿</span>
</div>
<div class="controls">
<button class="btn" onclick="prevScene()">◀ 上一幕</button>
<button class="btn" onclick="playPause()">⏯ 播放/暂停</button>
<button class="btn" onclick="nextScene()">下一幕 ▶</button>
</div>
</div>
<div class="card"><div class="search-box"><input type="text" id="searchInput" placeholder="搜索皮影剧目..." oninput="filterItems()"></div>
<div class="btn-group"><button class="btn active" onclick="filterByType('all',this)">全部</button><button class="btn" onclick="filterByType('神话',this)">神话</button><button class="btn" onclick="filterByType('历史',this)">历史</button><button class="btn" onclick="filterByType('民间',this)">民间</button><button class="btn" onclick="filterByType('武打',this)">武打</button></div></div>
<div id="itemList"></div></div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="close-btn" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><div id="modalDisplay" class="item-display"></div><p id="modalMeta"></p><p id="modalDesc"></p><p id="modalDetail" style="padding-top:12px;border-top:1px solid var(--border);margin-top:8px"></p></div></div>
<script src="../i18n.js" defer></script>
<script>
var scenes=[
  {title:'🎬 白蛇传 - 断桥相会',puppets:['👤','👤','🌿']},
  {title:'🎬 白蛇传 - 水漫金山',puppets:['👤','👤','🌊']},
  {title:'🎬 西游记 - 三打白骨精',puppets:['🐵','👹','🧍']},
  {title:'🎬 三国演义 - 空城计',puppets:['👑','⚔️','🏙️']},
  {title:'🎬 杨家将 - 穆桂英挂帅',puppets:['👩','⚔️','🚩']}
];
var sceneIdx=0,playing=true,sceneTimer;
function updateScene(){document.getElementById('stageTitle').textContent=scenes[sceneIdx].title;document.getElementById('puppetsArea').innerHTML=scenes[sceneIdx].puppets.map(function(p){return '<span class="puppet" onclick="movePuppet(this)">'+p+'</span>';}).join('');}
function nextScene(){sceneIdx=(sceneIdx+1)%scenes.length;updateScene();}
function prevScene(){sceneIdx=(sceneIdx-1+scenes.length)%scenes.length;updateScene();}
function playPause(){playing=!playing;if(playing){sceneTimer=setInterval(nextScene,3000);}else{clearInterval(sceneTimer);}}
function movePuppet(el){el.style.transform='scale(1.5) rotate(10deg)';setTimeout(function(){el.style.transform='';},500);}
sceneTimer=setInterval(nextScene,3000);

var items=[
  {title:'白蛇传',type:'神话',emoji:'🐍',desc:'讲述白蛇精白素贞与许仙的爱情故事，是中国四大民间传说之一。皮影戏中常演"断桥""水漫金山"等经典折子。',detail:'白蛇传皮影戏以精美的皮影人物和特效著称，水漫金山一幕中的水浪效果是皮影戏的绝活。'},
  {title:'西游记',type:'神话',emoji:'🐵',desc:'以唐僧师徒西天取经为故事主线，皮影戏中孙悟空的形象最为生动，"大闹天宫"是最受欢迎的剧目。',detail:'西游记皮影戏中的孙悟空造型独特，金箍棒可以伸缩，火眼金睛会发光，展现了皮影艺人的高超技艺。'},
  {title:'三国演义',type:'历史',emoji:'⚔️',desc:'以三国时期为背景，"赤壁之战""空城计"等经典战役是皮影戏的热门剧目。',detail:'三国皮影戏中的武打场面最为精彩，皮影人物手持兵器，在幕后艺人的操控下打斗激烈。'},
  {title:'杨家将',type:'历史',emoji:'🏇',desc:'讲述杨家三代抗击辽国的故事，"穆桂英挂帅""杨门女将"等剧目广为流传。',detail:'杨家将皮影戏中的女将形象英姿飒爽，是皮影戏中少有的女性英雄题材。'},
  {title:'梁山伯与祝英台',type:'民间',emoji:'🦋',desc:'中国四大民间传说之一，皮影戏中"十八相送""化蝶"等场景感人至深。',detail:'梁祝皮影戏以细腻的情感表达著称，"化蝶"一幕中两只蝴蝶翩翩起舞，是皮影戏的经典场景。'},
  {title:'封神演义',type:'神话',emoji:'⚡',desc:'以商周交替为背景，神仙妖怪众多，皮影戏中的法术特效令人叹为观止。',detail:'封神演义皮影戏中的特效最多，雷公电母、风火轮等法术效果展现了皮影戏的独特魅力。'},
  {title:'岳飞传',type:'历史',emoji:'🗡️',desc:'讲述民族英雄岳飞抗金的故事，"精忠报国""风波亭"等剧目感人至深。',detail:'岳飞传皮影戏是爱国主义教育的经典剧目，岳飞背上的"精忠报国"四字是皮影戏的标志性场景。'},
  {title:'牛郎织女',type:'民间',emoji:'🌌',desc:'中国四大民间传说之一，讲述牛郎与织女的爱情故事，"鹊桥相会"是经典场景。',detail:'牛郎织女皮影戏中的鹊桥效果是皮影艺人的拿手好戏，喜鹊由小到大逐渐出现，最后搭成一座桥。'},
  {title:'隋唐演义',type:'武打',emoji:'🏹',desc:'以隋唐时期为背景，"罗成叫关""秦琼卖马"等武打剧目精彩纷呈。',detail:'隋唐演义皮影戏中的武打场面最为精彩，刀枪剑戟的打斗配合锣鼓点，气氛紧张刺激。'},
  {title:'水浒传',type:'民间',emoji:'🗡️',desc:'以梁山好汉为故事主角，"武松打虎""林冲夜奔"等剧目广为流传。',detail:'水浒传皮影戏中的人物造型各异，108位好汉各有特色，是皮影戏中人物最多的剧目。'},
  {title:'葫芦娃',type:'民间',emoji:'葫芦',desc:'中国经典动画改编的皮影戏，七个葫芦兄弟各怀绝技，深受儿童喜爱。',detail:'葫芦娃皮影戏是传统皮影与现代动画的结合，色彩鲜艳，动作活泼，吸引了年轻观众。'},
  {title:'孙悟空大闹天宫',type:'武打',emoji:'🐒',desc:'西游记中最精彩的片段，孙悟空与天兵天将的打斗场面是皮影戏的巅峰之作。',detail:'大闹天宫皮影戏中的打斗场面最为激烈，孙悟空的七十二变通过快速更换皮影来实现，令人叹为观止。'}
];
var currentType='all';
function renderItems(list){
  var el=document.getElementById('itemList');
  var html='';
  list.forEach(function(p,i){
    html+='<div class="item" onclick="showDetail('+items.indexOf(p)+')">';
    html+='<div class="item-title">'+p.emoji+' '+p.title+'</div>';
    html+='<div class="item-meta">'+p.type+'</div>';
    html+='<div class="item-display">'+p.emoji+'</div>';
    html+='<div class="item-desc">'+p.desc.substring(0,60)+'...</div>';
    html+='</div>';
  });
  el.innerHTML=html||'<div class="card" style="text-align:center;color:var(--text2)">未找到匹配的剧目</div>';
}
function filterItems(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=items.filter(function(p){return(p.title.includes(q)||p.desc.includes(q))&&(currentType==='all'||p.type===currentType);});
  renderItems(filtered);
}
function filterByType(type,btn){
  currentType=type;
  document.querySelectorAll('.btn-group .btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterItems();
}
function showDetail(i){
  var p=items[i];
  document.getElementById('modalTitle').textContent=p.title;
  document.getElementById('modalDisplay').textContent=p.emoji;
  document.getElementById('modalMeta').textContent=p.type;
  document.getElementById('modalDesc').textContent=p.desc;
  document.getElementById('modalDetail').textContent=p.detail;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='light'?'dark':'light');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
renderItems(items);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
