<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎶 和弦进行练习</title>
<meta property="og:title" content="🎶 和弦进行练习">
<meta property="og:description" content="🎶 和弦进行练习 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线和弦进行练习工具，支持常见和弦进行模式试听和自定义练习">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎶</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.key-selector{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.key-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:13px;cursor:pointer;transition:all .2s;font-weight:600}
.key-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.progression-list{display:flex;flex-direction:column;gap:10px}
.progression-item{padding:12px;border-radius:10px;border:1px solid var(--border);cursor:pointer;transition:all .2s}
.progression-item:hover{border-color:var(--accent)}
.progression-item.active{border-color:var(--accent);background:var(--tag-bg)}
.progression-name{font-size:14px;font-weight:700;margin-bottom:4px}
.progression-desc{font-size:11px;color:var(--text-secondary)}
.progression-chords{font-size:12px;color:var(--accent);font-weight:600;margin-top:4px;font-family:monospace}
.player{padding:16px;background:var(--preview-bg);border-radius:12px;margin-top:12px}
.player-controls{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.play-btn{padding:10px 20px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.play-btn:hover{background:var(--accent-hover)}
.play-btn:disabled{opacity:.5;cursor:not-allowed}
.tempo-control{display:flex;align-items:center;gap:8px;margin-top:8px}
.tempo-control label{font-size:12px;color:var(--text-secondary)}
.tempo-control input{width:100px;accent-color:var(--accent)}
.chord-display{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chord-slot{width:60px;height:60px;border-radius:10px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:all .3s}
.chord-slot.current{border-color:var(--accent);background:var(--accent);color:#fff;transform:scale(1.1)}
.chord-slot.played{border-color:var(--green);background:var(--green);color:#fff}
.custom-area{margin-top:12px}
.custom-input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:13px;font-family:monospace}
.custom-input::placeholder{color:var(--text-secondary)}
.footer{text-align:center;padding:20px 0;font-size:12px;color:var(--text-secondary)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🎶 和弦进行练习</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">🔑 选择调性</div>
<div class="key-selector" id="keySelector"></div>
</div>
<div class="card">
<div class="card-title">📋 和弦进行</div>
<div class="progression-list" id="progList"></div>
</div>
<div class="card">
<div class="card-title">🎛️ 播放器</div>
<div class="chord-display" id="chordDisplay"></div>
<div class="player">
<div class="player-controls">
<button class="play-btn" id="playBtn" onclick="togglePlay()">▶ 播放</button>
<button class="play-btn" onclick="stopPlay()" style="background:var(--red)">⏹ 停止</button>
</div>
<div class="tempo-control">
<label>BPM:</label>
<input type="range" min="60" max="200" value="100" id="tempoSlider" oninput="updateTempo()">
<span id="tempoVal">100</span>
</div>
</div>
</div>
<div class="card">
<div class="card-title">✏️ 自定义进行</div>
<div class="custom-area">
<input class="custom-input" id="customInput" placeholder="输入和弦，如: C G Am F（空格分隔）">
<button class="play-btn" onclick="playCustom()" style="margin-top:8px;width:100%">🎯 试听自定义</button>
</div>
</div>
<div class="footer">和弦进行练习 - Web Audio API</div>
</div>
<script>
let audioCtx,currentKey='C',currentProg=0,isPlaying=false,playTimer=null,tempo=100,beatIdx=0;
const KEYS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const KEY_NAMES={C:'C大调',D:'D大调',E:'E大调',F:'F大调',G:'G大调',A:'A大调','C#':'C#大调','D#':'D#大调','F#':'F#大调','G#':'G#大调','A#':'A#大调',B:'B大调'};
const PROGRESSIONS=[
{name:'流行万能进行',desc:'最经典的流行和弦进行',chords:'I - V - vi - IV'},
{name:'卡农进行',desc:'古典音乐经典进行',chords:'I - V - vi - iii - IV - I - IV - V'},
{name:'12小节蓝调',desc:'蓝调音乐基础进行',chords:'I - I - I - I - IV - IV - I - I - V - IV - I - V'},
{name:'爵士ii-V-I',desc:'爵士乐核心进行',chords:'ii - V - I'},
{name:'50年代进行',desc:'复古摇滚经典',chords:'I - vi - IV - V'},
{name:'安魂曲进行',desc:'庄严的进行',chords:'i - VI - III - VII'},
{name:'Axis进行',desc:'大量流行歌曲使用',chords:'I - V - vi - IV'},
{name:'Andalusian进行',desc:'西班牙风情',chords:'i - bVII - bVI - V'}
];
const CHORD_MAP={
I:{intervals:[0,4,7],suffix:''},ii:{intervals:[2,5,9],suffix:'m'},iii:{intervals:[4,7,11],suffix:'m'},
IV:{intervals:[5,9,12],suffix:''},V:{intervals:[7,11,14],suffix:''},vi:{intervals:[9,12,16],suffix:'m'},
vii:{intervals:[11,14,17],suffix:'dim'},i:{intervals:[0,3,7],suffix:'m'},bVII:{intervals:[10,14,17],suffix:''},
bVI:{intervals:[8,12,15],suffix:''},bV:{intervals:[6,10,13],suffix:''}
};
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset=t;document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playChord(notes,dur=0.8){initAudio();notes.forEach((freq,i)=>{setTimeout(()=>{const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type='triangle';osc.frequency.value=freq;g.gain.setValueAtTime(0.25,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);osc.connect(g);g.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+dur)},i*20)})}
function getChordFreqs(roman){const rootIdx=KEYS.indexOf(currentKey);const def=CHORD_MAP[roman];if(!def)return[];return def.intervals.map(i=>440*Math.pow(2,(rootIdx+i+60-69)/12))}
function getChordName(roman){const def=CHORD_MAP[roman];if(!def)return roman;const root=(KEYS.indexOf(currentKey)+def.intervals[0])%12;return KEYS[root]+def.suffix}
function buildKeySelector(){document.getElementById('keySelector').innerHTML=KEYS.map(k=>`<button class="key-btn${k===currentKey?' active':''}" onclick="selectKey('${k}')">${k}</button>`).join('')}
function selectKey(k){currentKey=k;buildKeySelector();buildProgList();updateDisplay()}
function buildProgList(){document.getElementById('progList').innerHTML=PROGRESSIONS.map((p,i)=>`<div class="progression-item${i===currentProg?' active':''}" onclick="selectProg(${i})"><div class="progression-name">${p.name}</div><div class="progression-desc">${p.desc}</div><div class="progression-chords">${p.chords}</div></div>`).join('')}
function selectProg(i){currentProg=i;buildProgList();stopPlay();updateDisplay()}
function parseChords(romanStr){return romanStr.split(/\s*[-–]\s*/).map(s=>s.trim())}
function updateDisplay(){const chords=parseChords(PROGRESSIONS[currentProg].chords);document.getElementById('chordDisplay').innerHTML=chords.map((c,i)=>`<div class="chord-slot" id="slot${i}">${getChordName(c)}</div>`).join('')}
function togglePlay(){if(isPlaying){stopPlay()}else{startPlay()}}
function startPlay(){initAudio();isPlaying=true;beatIdx=0;document.getElementById('playBtn').textContent='⏸ 暂停';playNext()}
function stopPlay(){isPlaying=false;clearTimeout(playTimer);document.getElementById('playBtn').textContent='▶ 播放';document.querySelectorAll('.chord-slot').forEach(s=>{s.classList.remove('current','played')});beatIdx=0}
function playNext(){if(!isPlaying)return;const chords=parseChords(PROGRESSIONS[currentProg].chords);const roman=chords[beatIdx%chords.length];const freqs=getChordFreqs(roman);if(freqs.length)playChord(freqs);document.querySelectorAll('.chord-slot').forEach((s,i)=>{s.classList.remove('current','played');if(i===beatIdx%chords.length)s.classList.add('current');if(i<beatIdx%chords.length)s.classList.add('played')});const interval=60000/tempo;playTimer=setTimeout(()=>{beatIdx++;if(beatIdx>=chords.length)beatIdx=0;playNext()},interval)}
function updateTempo(){tempo=+document.getElementById('tempoSlider').value;document.getElementById('tempoVal').textContent=tempo}
function playCustom(){const input=document.getElementById('customInput').value.trim();if(!input)return;initAudio();const chords=input.split(/\s+/);let delay=0;chords.forEach(c=>{setTimeout(()=>{const match=c.match(/^([A-G]#?)(m|dim|aug|maj7|m7|7|sus2|sus4)?$/);if(match){const rootIdx=KEYS.indexOf(match[1]);const type=match[2]||'';let intervals=[0,4,7];if(type==='m')intervals=[0,3,7];else if(type==='dim')intervals=[0,3,6];else if(type==='aug')intervals=[0,4,8];else if(type==='maj7')intervals=[0,4,7,11];else if(type==='m7')intervals=[0,3,7,10];else if(type==='7')intervals=[0,4,7,10];const freqs=intervals.map(i=>440*Math.pow(2,(rootIdx+i+60-69)/12));playChord(freqs)}},delay);delay+=800})}
buildKeySelector();buildProgList();updateDisplay();
</script>
</body>
</html>
