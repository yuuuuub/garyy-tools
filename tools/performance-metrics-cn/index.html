<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📈 绩效指标</title>
<meta name="description" content="绩效指标分析工具，追踪个人和团队绩效数据">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--purple:#7c3aed}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
input[type=text],input[type=number]{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
input:focus{outline:none;border-color:var(--accent)}
select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem}
.metric-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;transition:all .2s}
.metric-row:hover{border-color:var(--accent)}
.metric-icon{font-size:1.3rem;min-width:36px;text-align:center}
.metric-info{flex:1}
.metric-name{font-weight:600;font-size:.9rem}
.metric-desc{font-size:.8rem;color:var(--text2)}
.metric-value{text-align:right}
.metric-num{font-size:1.3rem;font-weight:700}
.metric-unit{font-size:.75rem;color:var(--text2)}
.metric-trend{font-size:.8rem;margin-top:2px}
.metric-trend.up{color:var(--green)}.metric-trend.down{color:var(--red)}.metric-trend.flat{color:var(--yellow)}
.score-ring{width:120px;height:120px;margin:0 auto 12px;position:relative}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring .ring-bg{fill:none;stroke:var(--border);stroke-width:8}
.score-ring .ring-fg{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s}
.score-ring .score-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.score-ring .score-num{font-size:2rem;font-weight:700}
.score-ring .score-label{font-size:.75rem;color:var(--text2)}
.radar-chart{width:200px;height:200px;margin:0 auto}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-row .bar-label{width:80px;font-size:.8rem;text-align:right;color:var(--text2)}
.bar-row .bar-track{flex:1;height:20px;background:var(--border);border-radius:10px;overflow:hidden}
.bar-row .bar-fill{height:100%;border-radius:10px;transition:width .5s}
.bar-row .bar-val{width:50px;font-size:.8rem;font-weight:600}
.hidden{display:none}
@media(max-width:600px){body{padding:10px}.metric-row{flex-direction:column;text-align:center}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📈 绩效指标">
<meta property="og:description" content="绩效指标分析工具，追踪个人和团队绩效数据">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='perf_metrics';
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{
  categories:['工作效率','代码质量','团队协作','创新能力','沟通能力'],
  people:[
    {name:'张三',scores:[85,92,78,80,88]},
    {name:'李四',scores:[90,85,88,75,82]},
    {name:'王五',scores:[78,88,92,85,90]},
    {name:'赵六',scores:[82,80,85,90,78]}
  ]
};
let selectedPerson=-1;
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function getAvg(person){return Math.round(person.scores.reduce((a,b)=>a+b,0)/person.scores.length)}
function addPerson(){const name=prompt('输入姓名:');if(name&&name.trim()){state.people.push({name:name.trim(),scores:state.categories.map(()=>50)});save();render()}}
function removePerson(i){if(confirm('确定删除?')){state.people.splice(i,1);save();render()}}
function addCategory(){const name=prompt('输入指标类别:');if(name&&name.trim()){state.categories.push(name.trim());state.people.forEach(p=>p.scores.push(50));save();render()}}
function removeCategory(i){if(confirm('确定删除此指标?')){state.categories.splice(i,1);state.people.forEach(p=>p.scores.splice(i,1));save();render()}}
function getGrade(score){return score>=90?'优秀':score>=80?'良好':score>=70?'合格':'待改进'}
function getGradeColor(score){return score>=90?'var(--green)':score>=80?'var(--accent)':score>=70?'var(--yellow)':'var(--red)'}
function exportData(){let txt='绩效指标报告\n'+'='.repeat(40)+'\n\n';state.people.forEach(p=>{txt+=`${p.name} (平均: ${getAvg(p)}分 - ${getGrade(getAvg(p))})\n`;state.categories.forEach((c,i)=>{txt+=`  ${c}: ${p.scores[i]}分\n`});txt+='\n'});const blob=new Blob([txt],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='绩效报告.txt';a.click()}
function render(){
  const overallAvg=state.people.length?Math.round(state.people.reduce((s,p)=>s+getAvg(p),0)/state.people.length):0;
  let h=`<div class="hdr"><h1>📈 绩效指标</h1><p>个人与团队绩效追踪</p></div>`;
  h+=`<div class="cd"><div style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:16px">`;
  h+=`<div class="score-ring"><svg viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="42"/><circle class="ring-fg" cx="50" cy="50" r="42" stroke="${getGradeColor(overallAvg)}" stroke-dasharray="263.89" stroke-dashoffset="${263.89*(1-overallAvg/100)}"/></svg><div class="score-text"><div class="score-num" style="color:${getGradeColor(overallAvg)}">${overallAvg}</div><div class="score-label">团队平均</div></div></div>`;
  h+=`<div style="flex:1;min-width:200px">`;
  state.categories.forEach((c,i)=>{const avg=state.people.length?Math.round(state.people.reduce((s,p)=>s+p.scores[i],0)/state.people.length):0;
    h+=`<div class="bar-row"><div class="bar-label">${c}</div><div class="bar-track"><div class="bar-fill" style="width:${avg}%;background:${getGradeColor(avg)}"></div></div><div class="bar-val" style="color:${getGradeColor(avg)}">${avg}</div></div>`});
  h+=`</div></div></div>`;
  h+=`<div class="cd"><h2>👥 人员绩效 <button class="sec" style="font-size:.75rem;padding:3px 10px;margin-left:6px" onclick="addPerson()">+ 添加</button><button class="sec" style="font-size:.75rem;padding:3px 10px" onclick="exportData()">导出</button></h2>`;
  h+=`<div class="metric-row" style="font-weight:600;font-size:.85rem;color:var(--text2)"><div class="metric-icon">👤</div><div class="metric-info">姓名</div>`;
  state.categories.forEach((c,i)=>{h+=`<div style="width:60px;text-align:center;font-size:.75rem">${c} <span style="cursor:pointer;color:var(--red);font-size:.7rem" onclick="removeCategory(${i})">✕</span></div>`});
  h+=`<div style="width:80px;text-align:center;font-size:.75rem">平均</div><div style="width:60px"></div></div>`;
  state.people.forEach((p,i)=>{const avg=getAvg(p);
    h+=`<div class="metric-row" onclick="selectedPerson=${selectedPerson===${i}?-1:${i}}" style="cursor:pointer">`;
    h+=`<div class="metric-icon" style="background:${getGradeColor(avg)};color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem">${p.name[0]}</div>`;
    h+=`<div class="metric-info"><div class="metric-name">${p.name}</div><div class="metric-desc">${getGrade(avg)}</div></div>`;
    p.scores.forEach((s,si)=>{h+=`<div style="width:60px;text-align:center"><input type="range" min="0" max="100" value="${s}" oninput="state.people[${i}].scores[${si}]=+this.value;this.nextElementSibling.textContent=this.value;save()" style="width:50px" onclick="event.stopPropagation()"><div style="font-size:.75rem;font-weight:600;color:${getGradeColor(s)}">${s}</div></div>`});
    h+=`<div style="width:80px;text-align:center"><span style="font-size:1.1rem;font-weight:700;color:${getGradeColor(avg)}">${avg}</span></div>`;
    h+=`<div style="width:60px"><button class="sec dng" style="padding:2px 6px;font-size:.75rem" onclick="event.stopPropagation();removePerson(${i})">✕</button></div></div>`});
  h+=`<div style="margin-top:12px"><button class="sec" style="font-size:.8rem" onclick="addCategory()">+ 添加指标</button></div></div>`;
  h+=`<div class="cd"><h2>📊 维度分析</h2>`;
  state.categories.forEach((c,ci)=>{const scores=state.people.map(p=>p.scores[ci]);const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;const max=Math.max(...scores,0);const min=Math.min(...scores,100);
    h+=`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-weight:600;font-size:.9rem">${c}</span><span style="font-size:.85rem;color:var(--text2)">均值${avg} | 最高${max} | 最低${min}</span></div>`;
    h+=`<div style="display:flex;gap:4px;align-items:flex-end;height:60px">`;
    state.people.forEach((p,i)=>{const s=p.scores[ci];h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center"><div style="width:100%;height:${s*0.6}px;background:${getGradeColor(s)};border-radius:3px 3px 0 0;transition:height .3s"></div><div style="font-size:.6rem;color:var(--text2);margin-top:2px">${p.name[0]}</div></div>`});
    h+=`</div></div>`});
  h+=`</div>`;
  $('app').innerHTML=h;
}
render();
</script>
</body>
</html>
