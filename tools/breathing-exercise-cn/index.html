<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌬️ 呼吸练习</title>
<meta name="description" content="呼吸练习工具，多种呼吸模式、动画引导、记录练习数据">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:500px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mode-card{padding:14px;border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;transition:all .2s}.mode-card:hover{border-color:var(--accent)}.mode-card.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
.mode-card .icon{font-size:2rem}.mode-card .name{font-size:.9rem;margin-top:4px;font-weight:600}.mode-card .desc{font-size:.75rem;color:var(--text2);margin-top:2px}
.breath-container{display:flex;flex-direction:column;align-items:center;padding:30px 0}
.breath-circle{width:200px;height:200px;border-radius:50%;border:4px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:all 1s ease-in-out;position:relative}
.breath-circle.inhale{transform:scale(1.3);border-color:var(--success);box-shadow:0 0 40px rgba(34,197,94,.3)}
.breath-circle.exhale{transform:scale(0.8);border-color:var(--danger);box-shadow:0 0 40px rgba(239,68,68,.3)}
.breath-circle.hold{border-color:var(--warn);box-shadow:0 0 40px rgba(245,158,11,.3)}
.breath-text{font-size:1.5rem;font-weight:700}.breath-sub{font-size:.85rem;color:var(--text2);margin-top:4px}
.cycle-count{margin-top:20px;font-size:1.1rem;color:var(--text2)}
.instruction{font-size:1rem;color:var(--accent);margin-top:12px;min-height:1.5em;text-align:center}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}.stat-card .num{font-size:1.4rem;font-weight:700;color:var(--accent)}.stat-card .lbl{font-size:.7rem;color:var(--text2);margin-top:2px}
.pattern-visual{display:flex;align-items:center;gap:4px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.pattern-step{padding:6px 12px;border-radius:16px;font-size:.8rem;font-weight:600}
.pattern-step.in{background:rgba(34,197,94,.2);color:var(--success)}
.pattern-step.hold{background:rgba(245,158,11,.2);color:var(--warn)}
.pattern-step.out{background:rgba(239,68,68,.2);color:var(--danger)}
.pattern-arrow{color:var(--text2);font-size:.8rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌬️</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div class="ctn">
<div class="hdr"><h1>🌬️ 呼吸练习</h1><p>平静呼吸，放松身心</p></div>

<div class="cd">
<div class="mode-grid" id="modeGrid"></div>
</div>

<div class="cd">
<div class="pattern-visual" id="patternViz"></div>
<div class="breath-container">
  <div class="breath-circle" id="breathCircle">
    <div class="breath-text" id="breathText">准备</div>
    <div class="breath-sub" id="breathSub">选择模式开始</div>
  </div>
  <div class="cycle-count" id="cycleCount"></div>
  <div class="instruction" id="instruction"></div>
</div>
<div class="bg">
<button id="startBtn" onclick="toggleBreathing()" style="padding:14px 40px;font-size:1.1rem">▶ 开始</button>
<button class="sec" onclick="stopBreathing()">⏹ 停止</button>
</div>
<div style="text-align:center;margin-top:12px">
  <label style="display:inline">练习时长</label>
  <select id="durSelect" style="width:auto;display:inline;padding:6px 12px;margin-left:8px" onchange="setDuration(this.value)">
    <option value="1">1分钟</option><option value="3" selected>3分钟</option><option value="5">5分钟</option><option value="10">10分钟</option>
  </select>
</div>
</div>

<div class="cd"><h2>📊 练习统计</h2>
<div class="stats-grid" id="stats"></div>
<div style="margin-top:12px;text-align:center;font-size:.85rem;color:var(--text2)" id="streak"></div></div>

<div class="cd"><h2>📋 最近练习</h2><div id="recentList" class="empty">暂无记录</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let sessions=JSON.parse(localStorage.getItem('be_sessions')||'[]');
const today=()=>new Date().toISOString().slice(0,10);
const save=()=>localStorage.setItem('be_sessions',JSON.stringify(sessions));

const patterns=[
  {name:'4-7-8 呼吸',desc:'放松助眠',icon:'🌙',inhale:4,hold1:7,exhale:8,hold2:0},
  {name:'腹式呼吸',desc:'基础放松',icon:'💚',inhale:4,hold1:0,exhale:6,hold2:0},
  {name:'方块呼吸',desc:'专注力提升',icon:'🔷',inhale:4,hold1:4,exhale:4,hold2:4},
  {name:'交替鼻孔',desc:'平衡身心',icon:'👃',inhale:4,hold1:0,exhale:4,hold2:0},
  {name:'活力呼吸',desc:'提神醒脑',icon:'⚡',inhale:3,hold1:0,exhale:3,hold2:0},
  {name:'深度呼吸',desc:'减压放松',icon:'🌊',inhale:6,hold1:2,exhale:8,hold2:2}
];

let selectedPattern=0,isRunning=false,breathTimer=null,cycleTimer=null;
let totalSec=180,elapsed=0,cycles=0,currentPhase='',phaseTime=0;

function init(){
  let modeHtml='';patterns.forEach((p,i)=>{
    modeHtml+=`<div class="mode-card ${i===selectedPattern?'active':''}" onclick="selectPattern(${i})">
      <div class="icon">${p.icon}</div><div class="name">${p.name}</div><div class="desc">${p.desc}</div></div>`;
  });$('modeGrid').innerHTML=modeHtml;
  updatePatternViz();renderStats();renderRecent();
}

function selectPattern(i){
  selectedPattern=i;
  document.querySelectorAll('.mode-card').forEach((el,j)=>{el.classList.toggle('active',j===i)});
  updatePatternViz();
}

function updatePatternViz(){
  const p=patterns[selectedPattern];let html='';
  if(p.inhale)html+=`<span class="pattern-step in">吸 ${p.inhale}s</span>`;
  if(p.hold1)html+=`<span class="pattern-arrow">→</span><span class="pattern-step hold">屏 ${p.hold1}s</span>`;
  html+=`<span class="pattern-arrow">→</span><span class="pattern-step out">呼 ${p.exhale}s</span>`;
  if(p.hold2)html+=`<span class="pattern-arrow">→</span><span class="pattern-step hold">屏 ${p.hold2}s</span>`;
  $('patternViz').innerHTML=html;
}

function setDuration(v){totalSec=v*60;elapsed=0;updateTimerDisplay()}

function toggleBreathing(){if(isRunning)pauseBreathing();else startBreathing()}

function startBreathing(){
  isRunning=true;$('startBtn').textContent='⏸ 暂停';
  $('breathCircle').style.transition='all 1s ease-in-out';
  runCycle();
  breathTimer=setInterval(()=>{
    elapsed++;updateTimerDisplay();
    if(elapsed>=totalSec){completeSession()}
  },1000);
}

function pauseBreathing(){
  isRunning=false;clearInterval(breathTimer);clearTimeout(cycleTimer);
  $('startBtn').textContent='▶ 继续';
}

function stopBreathing(){
  isRunning=false;clearInterval(breathTimer);clearTimeout(cycleTimer);
  $('startBtn').textContent='▶ 开始';
  $('breathCircle').className='breath-circle';$('breathText').textContent='准备';
  $('breathSub').textContent='选择模式开始';$('instruction').textContent='';
}

function runCycle(){
  if(!isRunning)return;
  const p=patterns[selectedPattern];
  const phases=[];
  if(p.inhale)phases.push({name:'吸气',dur:p.inhale,cls:'inhale'});
  if(p.hold1)phases.push({name:'屏息',dur:p.hold1,cls:'hold'});
  phases.push({name:'呼气',dur:p.exhale,cls:'exhale'});
  if(p.hold2)phases.push({name:'屏息',dur:p.hold2,cls:'hold'});

  let pi=0;
  function nextPhase(){
    if(!isRunning||pi>=phases.length){cycles++;$('cycleCount').textContent=`第 ${cycles} 轮`;runCycle();return}
    const ph=phases[pi];$('breathCircle').className='breath-circle '+ph.cls;
    $('breathText').textContent=ph.name;$('breathSub').textContent=`${ph.dur} 秒`;
    const instr=['放松肩膀','感受气息','专注当下','保持平静','全身放松'];
    $('instruction').textContent=instr[Math.floor(Math.random()*instr.length)];
    let count=ph.dur;
    const cnt=setInterval(()=>{if(!isRunning||count<=0){clearInterval(cnt);return}count--;$('breathSub').textContent=`${count} 秒`},1000);
    pi++;cycleTimer=setTimeout(nextPhase,ph.dur*1000);
  }
  nextPhase();
}

function updateTimerDisplay(){
  const rem=totalSec-elapsed;const min=Math.floor(rem/60);const sec=rem%60;
  $('cycleCount').textContent=`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')} | 第 ${cycles} 轮`;
}

function completeSession(){
  stopBreathing();
  sessions.push({date:today(),mode:patterns[selectedPattern].name,duration:Math.round(totalSec/60),cycles,completedAt:new Date().toISOString()});
  save();renderStats();renderRecent();$('instruction').textContent='🎉 练习完成！';
}

function renderStats(){
  const total=sessions.length;const totalMin=sessions.reduce((s,x)=>s+x.duration,0);
  const totalCycles=sessions.reduce((s,x)=>s+x.cycles,0);
  $('stats').innerHTML=`
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">总次数</div></div>
    <div class="stat-card"><div class="num">${totalMin}</div><div class="lbl">总分钟</div></div>
    <div class="stat-card"><div class="num">${totalCycles}</div><div class="lbl">总轮次</div></div>`;
  let s=0;const d=new Date();for(let i=0;i<365;i++){const k=d.toISOString().slice(0,10);if(sessions.some(s=>s.date===k))s++;else break;d.setDate(d.getDate()-1)}
  $('streak').textContent=s>0?`🔥 连续练习 ${s} 天`:'开始你的呼吸练习之旅';
}

function renderRecent(){
  const sorted=[...sessions].sort((a,b)=>b.completedAt.localeCompare(a.completedAt)).slice(0,10);
  let html='';sorted.forEach(s=>{
    html+=`<div class="li"><div style="display:flex;justify-content:space-between;align-items:center">
      <div><strong>${s.mode}</strong><div style="font-size:.8rem;color:var(--text2)">${s.date} · ${s.cycles}轮</div></div>
      <span class="tag s">${s.duration}分钟</span></div></div>`;
  });$('recentList').innerHTML=html||'<div class="empty">暂无记录</div>';
}

function updateTimerDisplay(){
  const rem=totalSec-elapsed;const min=Math.floor(rem/60);const sec=rem%60;
  $('cycleCount').textContent=`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')} | 第 ${cycles} 轮`;
}

init();
</script>
</body>
</html>
