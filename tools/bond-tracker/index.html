<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📃 债券追踪器</title>
<meta name="description" content="债券投资追踪器，记录和分析债券持仓收益情况">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6scroll-behavior:smooth;}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text);margin-right:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.pb{width:100%;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px}
.pb .fl{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}
.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:.9rem}
th{color:var(--text2);font-weight:600}
.hidden{display:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="📃 债券追踪器">
  <meta property="og:description" content="债券投资追踪器，记录和分析债券持仓收益情况">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/bond-tracker/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📃 债券追踪器</h1><p>债券投资追踪</p></div>
<div class="cd"><h2>添加记录</h2>
<label>债券名称</label><input type="text" id="bdName"  placeholder="债券名称" title="Enter键搜索">
<label>票面利率%</label><input type="text" id="bdRate"  placeholder="票面利率%" title="Enter键搜索">
<label>投资金额</label><input type="text" id="bdAmount"  placeholder="投资金额" title="Enter键搜索">
<label>到期日</label><input type="text" id="bdDate"  placeholder="到期日" title="Enter键搜索">
<div class="bg"><button onclick="addRec()">添加记录</button></div></div>
<div class="cd"><h2>记录列表</h2><div id="recL" class="es">暂无记录</div></div>
</div>
<script>let REC=JSON.parse(localStorage.getItem('bond_trackerList')||'[]');
function rRec(){$('recL').innerHTML=REC.length?REC.map((r,i)=>'<div class="li"><div style="flex:1"><span class="tag">{{r.date}}</span> {{r.bdRate}} | {{r.bdAmount}} | {{r.bdDate}}</div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="REC.splice('+i+',1);localStorage.setItem('bond_trackerList',JSON.stringify(REC));rRec()">删除</button></div>').reverse().join(''):'<div class="es">暂无记录</div>'}
function addRec(){bdName=document.getElementById('bdName').value.trim()||'未命名';bdRate=document.getElementById('bdRate').value,bdAmount=document.getElementById('bdAmount').value,bdDate=document.getElementById('bdDate').value;REC.push({bdName:bdName,bdRate:bdRate,bdAmount:bdAmount,bdDate:bdDate,date:new Date().toLocaleDateString()});localStorage.setItem('bond_trackerList',JSON.stringify(REC));rRec();,$('bdRate').value='',$('bdAmount').value='',$('bdDate').value=''}
function $(id){return document.getElementById(id)}rRec()</script>
<script src="../i18n.js" defer>
document.getElementById("bdName").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addRec();}});

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
</body>
</html>
