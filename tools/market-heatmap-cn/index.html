<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市场热力图</title>
<meta name="description" content="A股市场热力图，按行业/概念板块可视化涨跌分布">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#f59e0b;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
.container{max-width:1000px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.view-tabs{display:flex;gap:6px;margin-bottom:14px}
.view-tab{padding:5px 12px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;cursor:pointer;background:var(--card);color:var(--text2);transition:all .2s}
.view-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.heatmap{display:grid;gap:4px}
.heat-cell{border-radius:6px;padding:8px 10px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;min-height:60px;display:flex;flex-direction:column;justify-content:center}
.heat-cell:hover{transform:scale(1.03);z-index:1;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.heat-cell .name{font-size:.82rem;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.heat-cell .change{font-size:1.05rem;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.heat-cell .meta{font-size:.7rem;opacity:.8;margin-top:2px}
.legend{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;font-size:.78rem;color:var(--text2)}
.legend-bar{width:200px;height:12px;border-radius:6px;background:linear-gradient(to right,#b91c1c,#ef4444,#f87171,#fca5a5,#374151,#6ee7b7,#34d399,#10b981,#059669)}
.tooltip{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:.82rem;pointer-events:none;z-index:999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:220px}
.tooltip .tt-name{font-weight:700;margin-bottom:4px}
.tooltip .tt-row{display:flex;justify-content:space-between;gap:12px;color:var(--text2);font-size:.78rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="市场热力图">
<meta property="og:description" content="A股市场热力图，可视化涨跌分布">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🗺️ 市场热力图</h1>
    <p>A股行业板块涨跌热力图</p>
  </header>
  <div class="card">
    <div class="view-tabs" id="viewTabs">
      <span class="view-tab active" data-v="sector">行业板块</span>
      <span class="view-tab" data-v="concept">概念板块</span>
      <span class="view-tab" data-v="size">市值分布</span>
    </div>
    <div class="heatmap" id="heatmap"></div>
    <div class="legend">
      <span>-5%</span>
      <div class="legend-bar"></div>
      <span>+5%</span>
    </div>
  </div>
  <div class="tooltip" id="tooltip"></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const sectorData=[
  {name:'白酒',change:1.85,marketCap:4.2,volume:285,count:18},
  {name:'新能源车',change:2.35,marketCap:3.8,volume:520,count:42},
  {name:'半导体',change:-0.82,marketCap:2.5,volume:680,count:65},
  {name:'银行',change:0.52,marketCap:12.5,volume:180,count:42},
  {name:'房地产',change:-1.45,marketCap:1.8,volume:320,count:120},
  {name:'医药',change:0.68,marketCap:3.2,volume:450,count:380},
  {name:'光伏',change:-2.15,marketCap:1.5,volume:420,count:45},
  {name:'AI',change:3.12,marketCap:2.8,volume:890,count:88},
  {name:'军工',change:0.95,marketCap:2.1,volume:350,count:68},
  {name:'证券',change:1.88,marketCap:3.5,volume:720,count:50},
  {name:'消费电子',change:1.55,marketCap:1.9,volume:380,count:35},
  {name:'保险',change:0.65,marketCap:2.8,volume:120,count:6},
  {name:'通信',change:1.15,marketCap:4.5,volume:280,count:48},
  {name:'食品饮料',change:0.88,marketCap:2.6,volume:210,count:72},
  {name:'汽车零部件',change:0.42,marketCap:1.2,volume:260,count:85},
  {name:'传媒',change:-0.35,marketCap:0.8,volume:310,count:55},
  {name:'旅游',change:2.05,marketCap:0.6,volume:180,count:28},
  {name:'教育',change:-0.92,marketCap:0.4,volume:150,count:32},
  {name:'钢铁',change:0.15,marketCap:1.5,volume:95,count:35},
  {name:'有色',change:1.25,marketCap:2.2,volume:380,count:48},
  {name:'化工',change:-0.55,marketCap:1.8,volume:290,count:120},
  {name:'煤炭',change:0.72,marketCap:1.6,volume:140,count:28},
  {name:'电力',change:0.38,marketCap:2.5,volume:180,count:45},
  {name:'物流',change:1.05,marketCap:0.9,volume:220,count:38}
];
const conceptData=[
  {name:'ChatGPT概念',change:3.52,marketCap:0.8,volume:920,count:25},
  {name:'华为概念',change:2.85,marketCap:1.2,volume:780,count:45},
  {name:'CPO概念',change:4.15,marketCap:0.5,volume:650,count:18},
  {name:'机器人',change:2.28,marketCap:0.9,volume:520,count:35},
  {name:'减肥药',change:1.95,marketCap:0.3,volume:480,count:12},
  {name:'低空经济',change:3.25,marketCap:0.6,volume:580,count:22},
  {name:'数据要素',change:1.78,marketCap:0.7,volume:420,count:30},
  {name:'存储芯片',change:-0.65,marketCap:0.4,volume:380,count:15},
  {name:'氢能源',change:0.85,marketCap:0.5,volume:350,count:20},
  {name:'虚拟现实',change:-1.25,marketCap:0.6,volume:280,count:28},
  {name:'新能源',change:1.42,marketCap:2.5,volume:650,count:55},
  {name:'碳中和',change:0.55,marketCap:1.8,volume:320,count:40},
  {name:'一带一路',change:0.92,marketCap:3.5,volume:280,count:65},
  {name:'数字经济',change:2.15,marketCap:2.2,volume:580,count:48},
  {name:'专精特新',change:1.35,marketCap:1.5,volume:420,count:52},
  {name:'国产替代',change:2.45,marketCap:1.8,volume:620,count:38}
];
const sizeData=[
  {name:'大盘股(>500亿)',change:0.85,marketCap:45,volume:1200,count:120},
  {name:'中盘股(100-500亿)',change:1.25,marketCap:18,volume:2800,count:350},
  {name:'小盘股(30-100亿)',change:1.85,marketCap:8,volume:4500,count:800},
  {name:'微盘股(<30亿)',change:2.35,marketCap:3,volume:6200,count:2500}
];
let view='sector';
const tooltip=$('tooltip');
document.querySelectorAll('.view-tab').forEach(t=>{
  t.onclick=()=>{document.querySelectorAll('.view-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');view=t.dataset.v;render();};
});
function getColor(change){
  const clamped=Math.max(-5,Math.min(5,change));
  if(clamped>=3)return'#059669';
  if(clamped>=2)return'#10b981';
  if(clamped>=1)return'#34d399';
  if(clamped>=0.3)return'#6ee7b7';
  if(clamped>-0.3)return'#374151';
  if(clamped>-1)return'#fca5a5';
  if(clamped>-2)return'#f87171';
  if(clamped>-3)return'#ef4444';
  return'#b91c1c';
}
function getSize(item){
  const data=view==='sector'?sectorData:view==='concept'?conceptData:sizeData;
  const maxVol=Math.max(...data.map(d=>d.volume));
  return Math.max(1,Math.min(3,Math.ceil(item.volume/maxVol*3)));
}
function render(){
  const data=view==='sector'?sectorData:view==='concept'?conceptData:sizeData;
  const sorted=[...data].sort((a,b)=>b.change-a.change);
  const cols=sorted.length<=6?3:sorted.length<=12?4:sorted.length<=20?5:6;
  let h='';
  sorted.forEach(s=>{
    const color=getColor(s.change);
    const textColor=Math.abs(s.change)>1.5?'#fff':'var(--text)';
    h+=`<div class="heat-cell" style="background:${color};color:${textColor}" data-name="${s.name}" data-change="${s.change}" data-cap="${s.marketCap}" data-vol="${s.volume}" data-count="${s.count}">
      <div class="name">${s.name}</div>
      <div class="change">${s.change>=0?'+':''}${s.change.toFixed(2)}%</div>
      <div class="meta">${s.volume}亿成交</div>
    </div>`;
  });
  $('heatmap').style.gridTemplateColumns=`repeat(${cols},1fr)`;
  $('heatmap').innerHTML=h;
  // Tooltip
  document.querySelectorAll('.heat-cell').forEach(cell=>{
    cell.onmouseenter=e=>{
      const d=cell.dataset;
      tooltip.innerHTML=`<div class="tt-name">${d.name}</div><div class="tt-row"><span>涨跌幅</span><span style="color:${+d.change>=0?'var(--green)':'var(--red)'};font-weight:600">${+d.change>=0?'+':''}${(+d.change).toFixed(2)}%</span></div><div class="tt-row"><span>总市值</span><span>${d.cap}万亿</span></div><div class="tt-row"><span>成交额</span><span>${d.vol}亿</span></div><div class="tt-row"><span>成分股</span><span>${d.count}只</span></div>`;
      tooltip.style.display='block';
    };
    cell.onmousemove=e=>{tooltip.style.left=e.clientX+12+'px';tooltip.style.top=e.clientY+12+'px';};
    cell.onmouseleave=()=>{tooltip.style.display='none';};
  });
}
render();
})();
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
