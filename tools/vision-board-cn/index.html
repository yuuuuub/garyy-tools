<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖼️ 愿景板</title>
<meta name="description" content="愿景板工具，可视化你的目标和梦想，用图片和文字构建理想生活">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=url],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.board-item{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:var(--bg);transition:all .2s;cursor:pointer}
.board-item:hover{transform:translateY(-3px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.board-item .img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--text2)}
.board-item .overlay{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.board-item .title{font-weight:600;font-size:.9rem;color:#fff}
.board-item .category{font-size:.75rem;color:rgba(255,255,255,.7);margin-top:2px}
.board-item .actions{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.board-item .actions button{padding:4px 8px;font-size:.7rem;border-radius:6px;opacity:0;transition:opacity .2s}
.board-item:hover .actions button{opacity:1}
.board-item .emoji-icon{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:3rem;background:var(--bg)}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;margin-right:4px}
.tag.career{background:rgba(59,130,246,.15);color:var(--accent)}
.tag.health{background:rgba(34,197,94,.15);color:var(--success)}
.tag.finance{background:rgba(245,158,11,.15);color:var(--warn)}
.tag.travel{background:rgba(139,92,246,.15);color:#8b5cf6}
.tag.relationship{background:rgba(236,72,153,.15);color:#ec4899}
.tag.other{background:rgba(107,114,128,.15);color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🖼️ 愿景板">
<meta property="og:description" content="愿景板工具，可视化你的目标和梦想">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🖼️ 愿景板</h1><p>可视化你的目标和梦想，构建理想生活</p></div>

<div class="cd"><h2>添加愿景</h2>
<input type="text" id="itemTitle" placeholder="愿景标题（如：环游世界）">
<input type="url" id="itemImg" placeholder="图片URL（可选，不填则用表情）">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<div><label>分类</label><select id="itemCat">
<option value="career">💼 事业</option><option value="health">💪 健康</option><option value="finance">💰 财务</option>
<option value="travel">✈️ 旅行</option><option value="relationship">💕 关系</option><option value="other">📌 其他</option>
</select></div>
<div><label>表情图标</label><input type="text" id="itemEmoji" placeholder="🌟" maxlength="4"></div>
</div>
<label>描述</label><textarea id="itemDesc" placeholder="详细描述你的愿景..."></textarea>
<div class="bg"><button onclick="addItem()">添加愿景</button></div></div>

<div class="cd"><h2>我的愿景板</h2>
<div class="bg" style="margin-bottom:12px"><select id="filterCat" onchange="render()" style="max-width:150px">
<option value="all">全部</option><option value="career">事业</option><option value="health">健康</option>
<option value="finance">财务</option><option value="travel">旅行</option><option value="relationship">关系</option><option value="other">其他</option>
</select></div>
<div id="board" class="board"></div></div>

<div class="cd"><h2>统计</h2><div class="gr" id="stats"></div>
<div class="bg"><button class="sec" onclick="clearAll()">清空全部</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let items=JSON.parse(localStorage.getItem('vb_items')||'[]');
const catLabels={career:'事业',health:'健康',finance:'财务',travel:'旅行',relationship:'关系',other:'其他'};

function save(){localStorage.setItem('vb_items',JSON.stringify(items));}

function addItem(){
  const title=$('itemTitle').value.trim();
  if(!title){alert('请输入愿景标题');return;}
  items.push({
    id:Date.now(),title,
    img:$('itemImg').value.trim(),
    emoji:$('itemEmoji').value.trim()||'🌟',
    cat:$('itemCat').value,
    desc:$('itemDesc').value.trim(),
    date:new Date().toLocaleDateString()
  });
  save();render();
  $('itemTitle').value='';$('itemImg').value='';$('itemEmoji').value='';$('itemDesc').value='';
}

function deleteItem(id){items=items.filter(x=>x.id!==id);save();render();}
function clearAll(){items=[];save();render();}

function render(){
  const filter=$('filterCat').value;
  const filtered=filter==='all'?items:items.filter(i=>i.cat===filter);
  
  $('board').innerHTML=filtered.length?filtered.map(item=>`<div class="board-item">
    ${item.img?`<img src="${item.img}" alt="${item.title}" style="width:100%;aspect-ratio:4/3;object-fit:cover" onerror="this.outerHTML='<div class=emoji-icon>${item.emoji}</div>'">`:`<div class="emoji-icon">${item.emoji}</div>`}
    <div class="overlay">
      <div class="title">${item.title}</div>
      <div class="category"><span class="tag ${item.cat}">${catLabels[item.cat]||item.cat}</span></div>
    </div>
    <div class="actions">
      <button class="dng" onclick="deleteItem(${item.id})">删除</button>
    </div>
    ${item.desc?`<div style="position:absolute;bottom:40px;left:12px;right:12px;font-size:.75rem;color:rgba(255,255,255,.8);display:none" class="desc">${item.desc}</div>`:''}
  </div>`).join(''):'<div class="es">暂无愿景，添加你的第一个梦想吧！</div>';
  
  const cats={};items.forEach(i=>{cats[i.cat]=(cats[i.cat]||0)+1;});
  $('stats').innerHTML=`
    <div class="st"><div class="nm">${items.length}</div><div class="lb">总愿景</div></div>
    <div class="st"><div class="nm" style="color:var(--accent)">${cats.career||0}</div><div class="lb">事业</div></div>
    <div class="st"><div class="nm" style="color:var(--success)">${cats.health||0}</div><div class="lb">健康</div></div>
    <div class="st"><div class="nm" style="color:var(--warn)">${cats.travel||0}</div><div class="lb">旅行</div></div>`;
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
