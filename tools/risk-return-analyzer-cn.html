<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="风险收益分析器 - 分析投资资产的风险与收益特征，生成散点图和风险评级">
    <meta name="robots" content="index, follow">
    <title>风险收益分析器</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="i18n.js" defer></script>
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #3b82f6; --secondary-color: #6b7280; --success-color: #10b981; --warning-color: #f59e0b; --danger-color: #ef4444; --border-color: #e5e7eb; --card-bg: #f9fafb; }
        [data-theme="dark"] { --bg-color: #111827; --text-color: #f9fafb; --primary-color: #60a5fa; --secondary-color: #9ca3af; --success-color: #34d399; --warning-color: #fbbf24; --danger-color: #f87171; --border-color: #374151; --card-bg: #1f2937; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-top: 0; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 12px; background: var(--card-bg); margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); color: var(--text-color); font-size: 14px; }
        input:focus { outline: 2px solid var(--primary-color); border-color: transparent; }
        button { background: var(--primary-color); color: #fff; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: opacity 0.2s; }
        button:hover { opacity: 0.85; }
        .btn-danger { background: var(--danger-color); }
        .btn-sm { padding: 5px 12px; font-size: 13px; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 14px; background: var(--secondary-color); color: #fff; border: none; border-radius: 8px; cursor: pointer; z-index: 100; }
        .asset-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; }
        .asset-row input { flex: 1; }
        .asset-row .remove { background: var(--danger-color); color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 16px; flex-shrink: 0; }
        .result-chart { width: 100%; height: 360px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        canvas { width: 100%; height: 100%; }
        .stat-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .stat-box { flex: 1; min-width: 130px; text-align: center; padding: 16px; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--border-color); }
        .stat-box .num { font-size: 22px; font-weight: 700; color: var(--primary-color); }
        .stat-box .lbl { font-size: 12px; color: var(--secondary-color); margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { font-weight: 600; color: var(--secondary-color); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge-low { background: #d1fae5; color: #065f46; }
        .badge-med { background: #fef3c7; color: #92400e; }
        .badge-high { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>📈 风险收益分析器</h1>
        <p style="color:var(--secondary-color)">输入资产的历史收益和波动率，分析风险收益特征</p>

        <div class="card">
            <div class="grid-2">
                <div>
                    <h3>添加资产</h3>
                    <div id="assetInputs"></div>
                    <button onclick="addAsset()" style="margin-top:8px">+ 添加资产</button>
                </div>
                <div>
                    <h3>分析设置</h3>
                    <label>无风险利率 (%)</label>
                    <input type="number" id="rfRate" value="2.5" step="0.1">
                    <label style="margin-top:10px">评估周期</label>
                    <select id="period">
                        <option value="1">1年</option>
                        <option value="3" selected>3年</option>
                        <option value="5">5年</option>
                        <option value="10">10年</option>
                    </select>
                    <button onclick="analyze()" style="margin-top:16px;width:100%">分析风险收益</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>风险收益散点图</h3>
            <div class="result-chart"><canvas id="scatterCanvas"></canvas></div>
        </div>

        <div class="card">
            <h3>综合分析结果</h3>
            <div class="stat-row" id="summaryStats"></div>
        </div>

        <div class="card">
            <h3>资产对比表</h3>
            <div id="compTable"></div>
        </div>
    </div>

    <script>
        let assets = [
            { name: '沪深300ETF', ret: 10.2, vol: 21.5, maxDD: -32.1 },
            { name: '中证500ETF', ret: 12.5, vol: 27.3, maxDD: -38.6 },
            { name: '纯债基金', ret: 4.2, vol: 3.8, maxDD: -5.2 },
            { name: '黄金ETF', ret: 8.6, vol: 16.2, maxDD: -18.4 },
            { name: '标普500', ret: 11.8, vol: 19.4, maxDD: -33.9 }
        ];

        function init() { renderAssets(); analyze(); }

        function renderAssets() {
            document.getElementById('assetInputs').innerHTML = assets.map((a, i) => `
                <div class="asset-row">
                    <input value="${a.name}" onchange="assets[${i}].name=this.value" style="max-width:120px">
                    <input type="number" value="${a.ret}" placeholder="收益%" step="0.1" onchange="assets[${i}].ret=+this.value" style="max-width:80px">
                    <input type="number" value="${a.vol}" placeholder="波动率%" step="0.1" onchange="assets[${i}].vol=+this.value" style="max-width:80px">
                    <input type="number" value="${a.maxDD}" placeholder="最大回撤%" step="0.1" onchange="assets[${i}].maxDD=+this.value" style="max-width:80px">
                    <button class="remove" onclick="removeAsset(${i})">×</button>
                </div>
            `).join('');
        }

        function addAsset() {
            assets.push({ name: '新资产', ret: 8, vol: 15, maxDD: -20 });
            renderAssets();
        }

        function removeAsset(i) {
            if (assets.length <= 1) return;
            assets.splice(i, 1);
            renderAssets();
        }

        function analyze() {
            const rf = +document.getElementById('rfRate').value / 100;
            const results = assets.map(a => {
                const sharpe = (a.ret / 100 - rf) / (a.vol / 100);
                const sortino = (a.ret / 100 - rf) / (a.vol / 100 * 0.7);
                const calmar = a.ret / Math.abs(a.maxDD);
                const riskScore = a.vol < 8 ? '低' : a.vol < 18 ? '中' : a.vol < 25 ? '中高' : '高';
                return { ...a, sharpe, sortino, calmar, riskScore };
            });

            drawScatter(results);
            renderSummary(results);
            renderTable(results, rf);
        }

        function drawScatter(data) {
            const canvas = document.getElementById('scatterCanvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.parentElement.clientWidth;
            const H = 360;
            canvas.width = W * 2; canvas.height = H * 2;
            canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            ctx.scale(2, 2);
            ctx.clearRect(0, 0, W, H);

            const pad = { l: 60, r: 30, t: 30, b: 50 };
            const xMax = Math.max(...data.map(d => d.vol)) * 1.2;
            const yMax = Math.max(...data.map(d => d.ret)) * 1.3;
            const yMin = Math.min(0, Math.min(...data.map(d => d.ret))) * 1.2;

            ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 0.5;
            for (let i = 0; i <= 5; i++) {
                const x = pad.l + (i / 5) * (W - pad.l - pad.r);
                ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, H - pad.b); ctx.stroke();
                ctx.fillStyle = '#999'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText((i / 5 * xMax).toFixed(0) + '%', x, H - 15);
            }
            for (let i = 0; i <= 4; i++) {
                const y = pad.t + (i / 4) * (H - pad.t - pad.b);
                ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
                ctx.fillStyle = '#999'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
                ctx.fillText((yMax - i / 4 * (yMax - yMin)).toFixed(0) + '%', pad.l - 8, y + 4);
            }

            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899'];
            data.forEach((d, i) => {
                const sx = pad.l + (d.vol / xMax) * (W - pad.l - pad.r);
                const sy = pad.t + ((yMax - d.ret) / (yMax - yMin)) * (H - pad.t - pad.b);
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath(); ctx.arc(sx, sy, 8, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = colors[i % colors.length]; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left';
                ctx.fillText(d.name, sx + 12, sy + 4);
            });

            const rf = +document.getElementById('rfRate').value;
            const rfY = pad.t + ((yMax - rf) / (yMax - yMin)) * (H - pad.t - pad.b);
            ctx.strokeStyle = '#999'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(pad.l, rfY); ctx.lineTo(W - pad.r, rfY); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#999'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
            ctx.fillText('无风险利率', pad.l + 4, rfY - 6);

            ctx.fillStyle = '#999'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('波动率 (风险)', W / 2, H - 5);
            ctx.save(); ctx.translate(15, H / 2); ctx.rotate(-Math.PI / 2);
            ctx.fillText('年化收益率', 0, 0); ctx.restore();
        }

        function renderSummary(data) {
            const bestSharpe = data.reduce((a, b) => a.sharpe > b.sharpe ? a : b);
            const lowestVol = data.reduce((a, b) => a.vol < b.vol ? a : b);
            const highestReturn = data.reduce((a, b) => a.ret > b.ret ? a : b);
            const avgSharpe = data.reduce((s, d) => s + d.sharpe, 0) / data.length;

            document.getElementById('summaryStats').innerHTML = `
                <div class="stat-box"><div class="num">${bestSharpe.name}</div><div class="lbl">最佳夏普比率 (${bestSharpe.sharpe.toFixed(2)})</div></div>
                <div class="stat-box"><div class="num">${lowestVol.name}</div><div class="lbl">最低波动率 (${lowestVol.vol}%)</div></div>
                <div class="stat-box"><div class="num">${highestReturn.name}</div><div class="lbl">最高收益 (${highestReturn.ret}%)</div></div>
                <div class="stat-box"><div class="num">${avgSharpe.toFixed(2)}</div><div class="lbl">平均夏普比率</div></div>
            `;
        }

        function renderTable(data, rf) {
            let html = '<table><tr><th>资产</th><th>年化收益</th><th>波动率</th><th>最大回撤</th><th>夏普比率</th><th>卡玛比率</th><th>风险等级</th></tr>';
            data.sort((a, b) => b.sharpe - a.sharpe).forEach(d => {
                const cls = d.vol < 8 ? 'badge-low' : d.vol < 18 ? 'badge-med' : 'badge-high';
                html += `<tr><td style="font-weight:600">${d.name}</td><td>${d.ret}%</td><td>${d.vol}%</td><td>${d.maxDD}%</td>
                    <td>${d.sharpe.toFixed(2)}</td><td>${d.calmar.toFixed(2)}</td>
                    <td><span class="badge ${cls}">${d.riskScore}风险</span></td></tr>`;
            });
            html += '</table>';
            document.getElementById('compTable').innerHTML = html;
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            analyze();
        }

        init();
        window.addEventListener('resize', analyze);
    </script>
</body>
</html>
