<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土壤分析器</title>
<meta property="og:title" content="土壤分析器">
<meta property="og:description" content="土壤分析器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="土壤成分分析与改良建议，了解你的土壤类型，科学种植">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪴</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0757b5;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;margin-right:4px}
.tag.g{background:var(--accent);color:#fff}.tag.w{background:var(--warn);color:#fff}.tag.r{background:var(--danger);color:#fff}
.li{padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gauge{position:relative;width:100%;height:20px;background:var(--bg);border-radius:10px;overflow:hidden;margin:6px 0}
.gauge .fill{height:100%;border-radius:10px;transition:width .5s}
.gauge .marker{position:absolute;top:-2px;width:3px;height:24px;background:#fff;border-radius:2px;transition:left .5s}
.radar-wrap{display:flex;justify-content:center;margin:16px 0}
.result-card{padding:16px;background:var(--bg);border-radius:8px;margin-top:12px}
.result-card h3{font-size:1rem;margin-bottom:8px}
.slider-group{margin-top:12px}
.slider-group label{display:flex;justify-content:space-between;align-items:center}
.slider-group input[type=range]{width:100%;margin-top:6px;accent-color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🪴 土壤分析器</h1><p>成分分析 · 改良建议 · 科学种植</p></div>

<div class="cd">
<h2>土壤采样信息</h2>
<div class="fr">
<div><label>采样位置</label><input type="text" id="sLocation" placeholder="如：花坛A区"></div>
<div><label>采样日期</label><input type="text" id="sDate" placeholder="YYYY-MM-DD"></div>
</div>
<div class="fr">
<div><label>种植用途</label><select id="sPurpose"><option>蔬菜种植</option><option>花卉种植</option><option>果树种植</option><option>草坪</option><option>多肉植物</option></select></div>
<div><label>采样深度</label><select id="sDepth"><option>表层(0-15cm)</option><option>中层(15-30cm)</option><option>深层(30cm+)</option></select></div>
</div>
</div>

<div class="cd">
<h2>物理性质测定</h2>
<div class="slider-group">
<label><span>砂土含量</span><span id="sandVal">40%</span></label>
<input type="range" id="sand" min="0" max="100" value="40" oninput="updateSliders()">
</div>
<div class="slider-group">
<label><span>粉砂含量</span><span id="siltVal">30%</span></label>
<input type="range" id="silt" min="0" max="100" value="30" oninput="updateSliders()">
</div>
<div class="slider-group">
<label><span>黏土含量</span><span id="clayVal">30%</span></label>
<input type="range" id="clay" min="0" max="100" value="30" oninput="updateSliders()">
</div>
<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px">
<div style="font-size:.85rem;font-weight:600">土壤类型判定：<span id="soilType" style="color:var(--accent)">壤土</span></div>
</div>
</div>

<div class="cd">
<h2>化学性质测定</h2>
<div class="slider-group">
<label><span>pH值</span><span id="phVal">6.5</span></label>
<input type="range" id="ph" min="3" max="10" step="0.1" value="6.5" oninput="updateSliders()">
</div>
<div class="slider-group">
<label><span>有机质含量(%)</span><span id="omVal">3.0</span></label>
<input type="range" id="om" min="0" max="10" step="0.1" value="3" oninput="updateSliders()">
</div>
<div class="slider-group">
<label><span>氮含量(mg/kg)</span><span id="nVal">150</span></label>
<input type="range" id="nContent" min="0" max="500" value="150" oninput="updateSliders()">
</div>
<div class="slider-group">
<label><span>磷含量(mg/kg)</span><span id="pVal">30</span></label>
<input type="range" id="pContent" min="0" max="100" value="30" oninput="updateSliders()">
</div>
<div class="slider-group">
<label><span>钾含量(mg/kg)</span><span id="kVal">150</span></label>
<input type="range" id="kContent" min="0" max="500" value="150" oninput="updateSliders()">
</div>
</div>

<div class="cd">
<h2>分析结果</h2>
<div id="resultSection"></div>
<div class="bg"><button onclick="saveResult()">保存分析结果</button></div>
</div>

<div class="cd">
<h2>历史分析</h2>
<div id="historyList" class="es">暂无历史记录</div>
</div>
</div>

<script>
const DB='soil_analyzer_db';
let records=JSON.parse(localStorage.getItem(DB)||'[]');

function updateSliders(){
  const sand=+document.getElementById('sand').value;
  const silt=+document.getElementById('silt').value;
  const clay=+document.getElementById('clay').value;
  const total=sand+silt+clay;
  const ph=+document.getElementById('ph').value;
  const om=+document.getElementById('om').value;
  const n=+document.getElementById('nContent').value;
  const p=+document.getElementById('pContent').value;
  const k=+document.getElementById('kContent').value;

  document.getElementById('sandVal').textContent=Math.round(sand/total*100)+'%';
  document.getElementById('siltVal').textContent=Math.round(silt/total*100)+'%';
  document.getElementById('clayVal').textContent=Math.round(clay/total*100)+'%';
  document.getElementById('phVal').textContent=ph.toFixed(1);
  document.getElementById('omVal').textContent=om.toFixed(1);
  document.getElementById('nVal').textContent=n;
  document.getElementById('pVal').textContent=p;
  document.getElementById('kVal').textContent=k;

  const ns=sand/total*100,sl=silt/total*100,cl=clay/total*100;
  let soilType='壤土';
  if(cl>40)soilType='黏土';
  else if(ns>60)soilType='砂土';
  else if(sl>50)soilType='粉砂土';
  else if(ns>40&&cl>25)soilType='砂质壤土';
  else if(sl>40&&cl>25)soilType='粉砂质壤土';
  document.getElementById('soilType').textContent=soilType;

  renderResults(soilType,ph,om,n,p,k,ns,sl,cl);
}

function renderResults(soilType,ph,om,n,p,k,sand,silt,clay){
  const phStatus=ph<5.5?'偏酸':ph<6.5?'微酸':ph<7.5?'中性':ph<8.5?'微碱':'偏碱';
  const phClass=ph>=5.5&&ph<=7.5?'g':ph>=4.5&&ph<=8.5?'w':'r';
  const omStatus=om<2?'偏低':om<5?'适中':'偏高';
  const omClass=om>=2&&om<=5?'g':om>=1&&om<=8?'w':'r';
  const nStatus=n<100?'缺乏':n<300?'适中':'过量';
  const pStatus=p<15?'缺乏':p<50?'适中':'过量';
  const kStatus=k<100?'缺乏':k<300?'适中':'过量';

  const purpose=document.getElementById('sPurpose').value;
  const phRanges={'蔬菜种植':[6.0,7.0],'花卉种植':[5.5,6.5],'果树种植':[6.0,7.5],'草坪':[6.0,7.0],'多肉植物':[5.5,6.5]};
  const [idealLow,idealHigh]=phRanges[purpose]||[6.0,7.0];
  const phOk=ph>=idealLow&&ph<=idealHigh;

  let suggestions=[];
  if(!phOk) suggestions.push(ph<idealLow?`施用石灰提高pH至${idealLow}-${idealHigh}`:`施用硫磺粉降低pH至${idealLow}-${idealHigh}`);
  if(om<2) suggestions.push('添加腐熟有机肥或堆肥提高有机质');
  if(n<100) suggestions.push('追施氮肥（尿素或有机氮肥）');
  if(p<15) suggestions.push('施用磷肥（过磷酸钙或骨粉）');
  if(k<100) suggestions.push('施用钾肥（硫酸钾或草木灰）');
  if(soilType==='黏土') suggestions.push('掺入砂和有机质改善透气性');
  if(soilType==='砂土') suggestions.push('添加黏土和有机质提高保水保肥能力');
  if(suggestions.length===0) suggestions.push('土壤状况良好，保持现有管理即可');

  document.getElementById('resultSection').innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px">
      <div style="text-align:center;padding:16px;background:var(--bg);border-radius:8px"><div style="font-size:1.3rem;font-weight:700;color:var(--accent)">${soilType}</div><div style="font-size:.8rem;color:var(--text2)">土壤类型</div></div>
      <div style="text-align:center;padding:16px;background:var(--bg);border-radius:8px"><div style="font-size:1.3rem;font-weight:700;color:var(--${phClass})">${ph.toFixed(1)}</div><div style="font-size:.8rem;color:var(--text2)">pH值 (${phStatus})</div></div>
      <div style="text-align:center;padding:16px;background:var(--bg);border-radius:8px"><div style="font-size:1.3rem;font-weight:700;color:var(--${omClass})">${om.toFixed(1)}%</div><div style="font-size:.8rem;color:var(--text2)">有机质 (${omStatus})</div></div>
    </div>
    <div style="margin-bottom:16px">
      <div style="font-size:.85rem;font-weight:600;margin-bottom:8px">质地三角图（简化）</div>
      <div style="display:flex;gap:4px;height:24px;border-radius:4px;overflow:hidden">
        <div style="width:${sand}%;background:var(--warn)"></div>
        <div style="width:${silt}%;background:var(--accent)"></div>
        <div style="width:${clay}%;background:var(--danger)"></div>
      </div>
      <div style="display:flex;gap:12px;margin-top:6px;font-size:.8rem;color:var(--text2)">
        <span>🟨 砂${Math.round(sand)}%</span><span>🟦 粉砂${Math.round(silt)}%</span><span>🟥 黏土${Math.round(clay)}%</span>
      </div>
    </div>
    <div style="margin-bottom:16px">
      <div style="font-size:.85rem;font-weight:600;margin-bottom:8px">养分含量</div>
      ${[['氮(N)',n,500,nStatus],['磷(P)',p,100,pStatus],['钾(K)',k,500,kStatus]].map(([label,val,max,status])=>`
        <div style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;font-size:.8rem"><span>${label}</span><span class="tag ${status==='适中'?'g':status==='缺乏'?'r':'w'}">${status} ${val}mg/kg</span></div>
          <div class="gauge"><div class="fill" style="width:${val/max*100}%;background:${status==='适中'?'var(--success)':status==='缺乏'?'var(--danger)':'var(--warn)'}"></div></div>
        </div>`).join('')}
    </div>
    <div class="result-card">
      <h3>🎯 改良建议</h3>
      ${suggestions.map(s=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem">• ${s}</div>`).join('')}
    </div>`;
}

function saveResult(){
  const r={
    id:Date.now(),
    location:document.getElementById('sLocation').value.trim()||'未命名',
    date:document.getElementById('sDate').value||new Date().toLocaleDateString(),
    purpose:document.getElementById('sPurpose').value,
    depth:document.getElementById('sDepth').value,
    sand:+document.getElementById('sand').value,
    silt:+document.getElementById('silt').value,
    clay:+document.getElementById('clay').value,
    ph:+document.getElementById('ph').value,
    om:+document.getElementById('om').value,
    n:+document.getElementById('nContent').value,
    p:+document.getElementById('pContent').value,
    k:+document.getElementById('kContent').value,
  };
  records.push(r);localStorage.setItem(DB,JSON.stringify(records));renderHistory();
}

function renderHistory(){
  const el=document.getElementById('historyList');
  if(!records.length){el.innerHTML='<div class="es">暂无历史记录</div>';return}
  el.innerHTML=records.map((r,i)=>`<div class="li" style="display:flex;justify-content:space-between;align-items:center">
    <div><strong>${r.location}</strong> <span class="tag g">${r.date}</span><div style="font-size:.85rem;color:var(--text2)">pH:${r.ph} 有机质:${r.om}% 深度:${r.depth}</div></div>
    <button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="records.splice(${i},1);localStorage.setItem('${DB}',JSON.stringify(records));renderHistory()">删除</button>
  </div>`).reverse().join('');
}

updateSliders();renderHistory();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
