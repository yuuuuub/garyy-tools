<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字动画生成器</title><meta name="description" content="汉字动画生成器 - 为汉字添加各种动画效果，包括旋转、缩放、弹跳、渐变等"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select,.input-group textarea{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.preview-box{min-height:200px;display:flex;align-items:center;justify-content:center;border:2px dashed var(--border);border-radius:12px;margin-top:16px;background:var(--bg);font-size:5rem;overflow:hidden}.anim-rotate{animation:rotate 2s linear infinite}.anim-scale{animation:scale 1.5s ease-in-out infinite}.anim-bounce{animation:bounce 1s ease-in-out infinite}.anim-shake{animation:shake 0.5s ease-in-out infinite}.anim-flip{animation:flip 2s ease-in-out infinite}.anim-fade{animation:fade 2s ease-in-out infinite}.anim-pulse{animation:pulse 1.5s ease-in-out infinite}.anim-slide{animation:slide 2s ease-in-out infinite}.anim-wave{animation:wave 2s ease-in-out infinite}.anim-glow{animation:glow 2s ease-in-out infinite}.anim-float{animation:float 3s ease-in-out infinite}.anim-spin3d{animation:spin3d 3s linear infinite}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes scale{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes flip{0%{transform:perspective(400px) rotateY(0)}100%{transform:perspective(400px) rotateY(360deg)}}
@keyframes fade{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:0.8}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(50px)}}
@keyframes wave{0%,100%{transform:rotate(0deg)}25%{transform:rotate(15deg)}75%{transform:rotate(-15deg)}}
@keyframes glow{0%,100%{text-shadow:0 0 10px currentColor}50%{text-shadow:0 0 40px currentColor,0 0 80px currentColor}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes spin3d{from{transform:rotateY(0) rotateX(0)}to{transform:rotateY(360deg) rotateX(360deg)}}
.color-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.color-opt{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s}.color-opt.active{border-color:var(--blue);transform:scale(1.1)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字动画生成器"><meta property="og:description" content="汉字动画生成器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>✨ 汉字动画生成器</h1><p class="sub">为汉字添加各种动画效果</p>
<div class="card">
<div class="input-group"><label>输入文字</label><input type="text" id="charInput" placeholder="输入要添加动画的文字" value="龙" maxlength="4"></div>
<div class="input-group"><label>选择动画效果</label><select id="animSelect"><option value="anim-rotate">旋转</option><option value="anim-scale">缩放</option><option value="anim-bounce" selected>弹跳</option><option value="anim-shake">抖动</option><option value="anim-flip">翻转</option><option value="anim-fade">渐隐</option><option value="anim-pulse">脉冲</option><option value="anim-slide">滑动</option><option value="anim-wave">摇摆</option><option value="anim-glow">发光</option><option value="anim-float">漂浮</option><option value="anim-spin3d">3D旋转</option></select></div>
<div class="input-group"><label>动画速度</label><select id="speedSelect"><option value="slow">慢速</option><option value="normal" selected>正常</option><option value="fast">快速</option></select></div>
<div class="input-group"><label>字体颜色</label><div class="color-options" id="colorOptions"></div></div>
<button class="btn" onclick="applyAnim()">应用动画</button>
<button class="btn" onclick="exportGif()" style="background:var(--green)">导出HTML</button>
</div>
<div class="preview-box" id="preview"><span class="anim-bounce" style="color:#3b82f6">龙</span></div></div>
<script src="../i18n.js" defer></script>
<script>
var colors=['#3b82f6','#ef4444','#22c55e','#eab308','#a855f7','#ec4899','#06b6d4','#f97316','#8b5cf6','#14b8a6'];
var selectedColor='#3b82f6';
function initColors(){var h='';colors.forEach(function(c,i){h+='<div class="color-opt'+(i===0?' active':'')+'" style="background:'+c+'" onclick="selectColor(\''+c+'\',this)"></div>'});document.getElementById('colorOptions').innerHTML=h}
function selectColor(c,el){selectedColor=c;document.querySelectorAll('.color-opt').forEach(function(e){e.classList.remove('active')});el.classList.add('active');applyAnim()}
function applyAnim(){
var text=document.getElementById('charInput').value||'龙';
var anim=document.getElementById('animSelect').value;
var speed=document.getElementById('speedSelect').value;
var dur=speed==='slow'?'3s':speed==='fast'?'0.5s':'1.5s';
document.getElementById('preview').innerHTML='<span class="'+anim+'" style="color:'+selectedColor+';animation-duration:'+dur+'">'+text+'</span>';
}
function exportGif(){
var text=document.getElementById('charInput').value||'龙';
var anim=document.getElementById('animSelect').value;
var speed=document.getElementById('speedSelect').value;
var dur=speed==='slow'?'3s':speed==='fast'?'0.5s':'1.5s';
var css='@keyframes rotate{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes scale{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}@keyframes flip{0%{transform:perspective(400px) rotateY(0)}100%{transform:perspective(400px) rotateY(360deg)}}@keyframes fade{0%,100%{opacity:1}50%{opacity:0.3}}@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:0.8}}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(50px)}}@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(15deg)}75%{transform:rotate(-15deg)}}@keyframes glow{0%,100%{text-shadow:0 0 10px currentColor}50%{text-shadow:0 0 40px currentColor,0 0 80px currentColor}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}@keyframes spin3d{from{transform:rotateY(0) rotateX(0)}to{transform:rotateY(360deg) rotateX(360deg)}}';
var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+text+' 动画</title><style>body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#0d1117;margin:0}.char{font-size:8rem;color:'+selectedColor+';animation:'+anim.replace('anim-','')+' '+dur+' linear infinite}'+css+'</style></head><body><div class="char">'+text+'</div></body></html>';
var blob=new Blob([html],{type:'text/html'});
var a=document.createElement('a');a.download='animation.html';a.href=URL.createObjectURL(blob);a.click();
}
initColors();applyAnim();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
