<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥁 节奏训练器</title>
<meta property="og:title" content="🥁 节奏训练器">
<meta property="og:description" content="🥁 节奏训练器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线节奏训练工具，练习节拍感、节奏型和速度控制">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥁</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tab-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;font-weight:600}
.tab-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.tempo-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tempo-row label{font-size:13px;font-weight:600}
.tempo-row input[type=range]{flex:1;accent-color:var(--accent)}
.tempo-val{font-size:20px;font-weight:700;color:var(--accent);min-width:60px;text-align:center}
.beat-grid{display:flex;gap:8px;margin:16px 0;justify-content:center}
.beat-dot{width:48px;height:48px;border-radius:50%;border:3px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:all .15s}
.beat-dot.active{border-color:var(--accent);background:var(--accent);color:#fff;transform:scale(1.15)}
.beat-dot.accent-beat{border-color:var(--red)}
.beat-dot.accent-beat.active{background:var(--red);border-color:var(--red)}
.controls{display:flex;gap:8px;justify-content:center;margin:16px 0}
.ctrl-btn{padding:12px 24px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.ctrl-btn.primary{background:var(--accent);color:#fff}
.ctrl-btn.primary:hover{background:var(--accent-hover)}
.ctrl-btn.danger{background:var(--red);color:#fff}
.pattern-display{display:flex;gap:4px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.pattern-cell{width:32px;height:32px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s}
.pattern-cell.hit{background:var(--green);border-color:var(--green);color:#fff}
.pattern-cell.miss{background:var(--red);border-color:var(--red);color:#fff}
.pattern-cell.current{border-color:var(--accent);transform:scale(1.1)}
.tap-area{width:100%;height:100px;border-radius:16px;border:3px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-secondary);cursor:pointer;transition:all .2s;user-select:none}
.tap-area:active,.tap-area.tapping{border-color:var(--accent);background:var(--tag-bg);transform:scale(0.98)}
.stats{display:flex;gap:12px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.stat{padding:8px 14px;border-radius:8px;background:var(--preview-bg);font-size:12px;text-align:center}
.stat .val{font-size:18px;font-weight:700;color:var(--accent)}
.stat .lbl{font-size:10px;color:var(--text-secondary)}
.footer{text-align:center;padding:20px 0;font-size:12px;color:var(--text-secondary)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🥁 节奏训练器</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">🎵 节拍</div>
<div class="tab-bar" id="meterTabs"></div>
</div>
<div class="card">
<div class="card-title">⚡ 速度 (BPM)</div>
<div class="tempo-row">
<label>慢</label>
<input type="range" min="40" max="240" value="100" id="tempoSlider" oninput="updateTempo()">
<label>快</label>
</div>
<div class="tempo-val" id="tempoVal">100 BPM</div>
</div>
<div class="card">
<div class="card-title">🎯 节拍器</div>
<div class="beat-grid" id="beatGrid"></div>
<div class="controls">
<button class="ctrl-btn primary" id="startBtn" onclick="toggleMetronome()">▶ 开始</button>
<button class="ctrl-btn danger" onclick="stopMetronome()">⏹ 停止</button>
</div>
</div>
<div class="card">
<div class="card-title">👆 跟拍练习</div>
<div class="pattern-display" id="patternDisplay"></div>
<div class="tap-area" id="tapArea" onclick="handleTap()">点击此处跟拍</div>
<div class="stats" id="statsArea">
<div class="stat"><div class="val" id="statHits">0</div><div class="lbl">命中</div></div>
<div class="stat"><div class="val" id="statMiss">0</div><div class="lbl">失误</div></div>
<div class="stat"><div class="val" id="statAccuracy">0%</div><div class="lbl">准确率</div></div>
<div class="stat"><div class="val" id="statAvg">0ms</div><div class="lbl">平均偏差</div></div>
</div>
</div>
<div class="footer">节奏训练器 - Web Audio API | 点击或按空格键跟拍</div>
</div>
<script>
let audioCtx,metronomeRunning=false,metronomeTimer=null,currentBeat=0;
let tempo=100,meterBeats=4,meterType='4/4';
let taps=[],tapPattern=[],tapIdx=0,hits=0,misses=0,totalTaps=0;
const METERS=[{name:'4/4',beats:4,accent:[0]},{name:'3/4',beats:3,accent:[0]},{name:'2/4',beats:2,accent:[0]},{name:'6/8',beats:6,accent:[0,3]},{name:'5/4',beats:5,accent:[0]},{name:'7/8',beats:7,accent:[0]}];
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playClick(accent=false){initAudio();const freq=accent?1000:800;const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type='square';osc.frequency.value=freq;g.gain.setValueAtTime(accent?0.15:0.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.05);osc.connect(g);g.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+0.05)}
function playTone(){initAudio();const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type='sine';osc.frequency.value=600;g.gain.setValueAtTime(0.2,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);osc.connect(g);g.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+0.1)}
function buildMeterTabs(){document.getElementById('meterTabs').innerHTML=METERS.map((m,i)=>`<button class="tab-btn${m.name===meterType?' active':''}" onclick="selectMeter(${i})">${m.name}</button>`).join('')}
function selectMeter(i){meterType=METERS[i].name;meterBeats=METERS[i].beats;buildMeterTabs();buildBeatGrid();stopMetronome();resetPattern()}
function updateTempo(){tempo=+document.getElementById('tempoSlider').value;document.getElementById('tempoVal').textContent=tempo+' BPM'}
function buildBeatGrid(){const meter=METERS.find(m=>m.name===meterType);document.getElementById('beatGrid').innerHTML=Array.from({length:meter.beats},(_,i)=>`<div class="beat-dot${meter.accent.includes(i)?' accent-beat':''}" id="beat${i}">${i+1}</div>`).join('')}
function toggleMetronome(){if(metronomeRunning)stopMetronome();else startMetronome()}
function startMetronome(){metronomeRunning=true;currentBeat=0;document.getElementById('startBtn').textContent='⏸ 暂停';tick()}
function stopMetronome(){metronomeRunning=false;clearTimeout(metronomeTimer);document.getElementById('startBtn').textContent='▶ 开始';document.querySelectorAll('.beat-dot').forEach(d=>d.classList.remove('active'));currentBeat=0}
function tick(){if(!metronomeRunning)return;const meter=METERS.find(m=>m.name===meterType);const isAccent=meter.accent.includes(currentBeat);playClick(isAccent);document.querySelectorAll('.beat-dot').forEach(d=>d.classList.remove('active'));const dot=document.getElementById('beat'+currentBeat);if(dot)dot.classList.add('active');currentBeat=(currentBeat+1)%meter.beats;metronomeTimer=setTimeout(tick,60000/tempo)}
function generatePattern(){const meter=METERS.find(m=>m.name===meterType);tapPattern=[];for(let i=0;i<meter.beats*2;i++){tapPattern.push(Math.random()>0.3?1:0)}return tapPattern}
function resetPattern(){hits=0;misses=0;totalTaps=0;taps=[];tapIdx=0;generatePattern();renderPattern();updateStats()}
function renderPattern(){document.getElementById('patternDisplay').innerHTML=tapPattern.map((v,i)=>`<div class="pattern-cell" id="pc${i}">${v?'♩':'·'}</div>`).join('')}
function handleTap(){if(!metronomeRunning)return;playTone();const now=performance.now();taps.push(now);const expected=taps.length>1?60000/tempo*(taps.length-1):0;const actual=taps.length>1?now-taps[0]:0;const cell=document.getElementById('pc'+tapIdx);if(cell){const beatTime=(60000/tempo)*(tapIdx);const diff=Math.abs(actual-beatTime);if(tapPattern[tapIdx]===1){if(diff<150){cell.classList.add('hit');hits++}else{cell.classList.add('miss');misses++}}else{misses++;cell.classList.add('miss')}}tapIdx++;totalTaps++;updateStats();if(tapIdx>=tapPattern.length){setTimeout(resetPattern,1000)}}
function updateStats(){document.getElementById('statHits').textContent=hits;document.getElementById('statMiss').textContent=misses;document.getElementById('statAccuracy').textContent=totalTaps?Math.round(hits/totalTaps*100)+'%':'0%';if(taps.length>1){const diffs=[];for(let i=1;i<taps.length;i++)diffs.push(Math.abs(taps[i]-taps[i-1]-60000/tempo));const avg=diffs.length?Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length):0;document.getElementById('statAvg').textContent=avg+'ms'}}
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();handleTap()}});
buildMeterTabs();buildBeatGrid();generatePattern();renderPattern();
</script>
</body>
</html>
