<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字转换工具</title>
<meta name="description" content="繁简转换、拼音标注、编码查询等汉字转换工具">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:800px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:100px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:10px 20px;cursor:pointer;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.output-box{padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;min-height:60px;white-space:pre-wrap;word-break:break-all;font-size:1.1rem;line-height:1.8}
.output-box .char-item{display:inline-block;text-align:center;padding:4px 8px;margin:2px;background:var(--card);border:1px solid var(--border);border-radius:6px}
.output-box .char-item .ch{font-size:1.3rem;font-weight:700}.output-box .char-item .info{font-size:.7rem;color:var(--text2)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="汉字转换工具">
<meta property="og:description" content="繁简转换、拼音标注、编码查询">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🔄 汉字转换工具</h1><p>繁简转换、拼音标注、编码查询</p></div>

<div class="tabs">
<div class="tab active" onclick="switchTab('s2t',this)">繁简转换</div>
<div class="tab" onclick="switchTab('pinyin',this)">拼音标注</div>
<div class="tab" onclick="switchTab('encode',this)">编码查询</div>
<div class="tab" onclick="switchTab('count',this)">字数统计</div>
</div>

<div id="tab-s2t" class="cd">
<h2>繁简转换</h2>
<textarea id="s2tInput" placeholder="输入简体或繁体中文...">汉字是世界上最古老的文字之一</textarea>
<div class="bg"><button onclick="toTraditional()">简→繁</button><button onclick="toSimplified()">繁→简</button><button class="sec" onclick="clearAll('s2tInput','s2tOutput')">清空</button></div>
<div class="output-box" id="s2tOutput" style="margin-top:12px"></div></div>

<div id="tab-pinyin" class="cd hidden">
<h2>拼音标注</h2>
<textarea id="pinyinInput" placeholder="输入汉字...">你好世界</textarea>
<div class="bg"><button onclick="addPinyin()">添加拼音</button><button onclick="addTones()">带声调</button><button class="sec" onclick="clearAll('pinyinInput','pinyinOutput')">清空</button></div>
<div class="output-box" id="pinyinOutput" style="margin-top:12px"></div></div>

<div id="tab-encode" class="cd hidden">
<h2>编码查询</h2>
<input type="text" id="encodeInput" placeholder="输入一个汉字" maxlength="1" value="汉">
<div class="bg"><button onclick="showEncode()">查询编码</button></div>
<div id="encodeOutput" style="margin-top:12px"></div></div>

<div id="tab-count" class="cd hidden">
<h2>字数统计</h2>
<textarea id="countInput" placeholder="粘贴文本到这里..." oninput="doCount()">汉字是世界上最古老的文字之一，已有数千年的历史。</textarea>
<div id="countOutput" style="margin-top:12px"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);

function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('[id^="tab-"]').forEach(t=>t.classList.add('hidden'));
  $('tab-'+name).classList.remove('hidden');
}

function clearAll(inId,outId){$(inId).value='';$(outId).innerHTML=''}

const traditionalMap={'万':'萬','与':'與','专':'專','业':'業','东':'東','丝':'絲','两':'兩','严':'嚴','丰':'豐','丽':'麗','举':'舉','义':'義','乐':'樂','习':'習','乡':'鄉','书':'書','买':'買','乱':'亂','了':'瞭解','于':'於','云':'雲','亚':'亞','亩':'畝','亲':'親','仅':'僅','个':'個','中':'中','为':'為','丽':'麗','举':'舉','乃':'乃','久':'久','也':'也','乘':'乘','也':'也','书':'書','乱':'亂','予':'予','于':'於','云':'雲','五':'五','井':'井','亚':'亞','亡':'亡','交':'交','亮':'亮','人':'人','今':'今','仍':'仍','从':'從','他':'他','付':'付','代':'辦','令':'令','以':'以','们':'們','但':'但','位':'低','住':'住','体':'體','何':'何','余':'餘','你':'你','佩':'佩','佳':'佳','來':'來','依':'依','保':'保','信':'信','們':'們','倒':'倒','值':'值','假':'假','做':'做','停':'停','健':'健','像':'像','兒':'兒','元':'元','先':'先','光':'光','克':'克','免':'免','兒':'兒','內':'內','两':'兩','八':'八','公':'公','六':'六','兰':'蘭','共':'共','关':'關','兴':'興','其':'其','具':'具','典':'典','内':'內','写':'寫','军':'軍','冠':'冠','冷':'冷','准':'准','凉':'涼','减':'減','凤':'鳳','几':'幾','凭':'憑','凤':'鳳','击':'擊','出':'出','击':'擊','函':'函','刀':'刀','分':'分','切':'開','刊':'刊','刑':'刑','划':'劃','列':'列','创':'創','初':'初','利':'利','别':'別','到':'到','制':'製','则':'則','刚':'剛','创':'創','删':'刪','别':'別','剂':'劑','前':'前','剛':'剛','剧':'劇','剩':'剩','剑':'劍','力':'力','功':'功','加':'加','动':'動','助':'動','努':'努','劫':'劫','劲':'勁','势':'勢','動':'動','励':'勵','劲':'勁','劳':'勞','势':'勢','勋':'勛','勵':'勵','勺':'勺','包':'包','化':'化','北':'北','区':'區','医':'醫','十':'十','千':'千','半':'半','华':'華',' 单':'單','卖':'賣','南':'南','博':'博','卜':'卜','占':'占','卡':'卡','卢':'盧','卫':'衛','却':'卻','卷':'卷','厂':'廠','厉':'厲','厌':'厭','厍':'庫','原':'原','厢':'廂','厨':'廚','去':'去','参':'參','及':'及','友':'友','双':'雙','反':'反','发':'發','叔':'叔','取':'取','受':'受','变':'變','叙':'敘','叠':'疊','口':'口','古':'古','句':'句','另':'另','叮':'叮','叶':'葉','号':'號','司':'司','叫':'叫','召':'召','叭':'叭','只':'隻','叮':'叮','可':'可','台':'臺','叶':'葉','号':'號','司':'司','叹':'嘆','句':'句','另':'另','叫':'叫','召':'召','叽':'嘰','叶':'葉','号':'號','司':'司','史':'史','右':'右','叶':'葉','叮':'叮','司':'司','叹':'嘆','叶':'葉','号':'號','叽':'嘰','台':'臺','叶':'葉','号':'號','司':'司','史':'史','右':'右','叶':'葉','叮':'叮','司':'司','叹':'嘆','吃':'吃','各':'各','合':'合','吉':'吉','吊':'吊','同':'同','名':'名','后':'後','吏':'吏','吐':'吐','向':'向','吓':'嚇','吕':'呂','吗':'嗎','君':'君','吞':'吞','吟':'吟','吠':'吠','否':'否','吧':'吧','吨':'噸','含':'含','听':'聽','启':'啟','吵':'吵','吸':'吸','吹':'吹','吻':'吻','吼':'吼','呀':'呀','呆':'呆','呈':'呈','告':'告','呐':'呐','呕':'嘔','员':'員','呜':'嗚','咏':'詠','呢':'呢','呦':'呦','周':'周','呵':'呵','呻':'呻','呼':'呼','命':'命','咆':'咆','咋':'咋','和':'和','咎':'咎','咏':'詠','咐':'咐','咒':'咒','咕':'咕','咖':'咖','咙':'嚨','咣':'咣','咤':'咤','咙':'嚙','咤':'吒','咪':'咪','咧':'咧','咨':'咨','咪':'咪','咬':'咬','咱':'咱','咳':'咳','咸':'鹹','咽':'咽','哀':'哀','品':'品','哄':'哄','哆':'哆','哇':'哇','哈':'哈','哉':'哉','响':'響','哎':'哎','哑':'啞','哗':'嘩','哟':'喲','员':'員','哥':'哥','哦':'哦','哧':'哧','哨':'哨','哩':'哩','哪':'哪','哭':'哭','哮':'哮','哲':'哲','哺':'哺','哼':'哼','唇':'唇','唉':'唉','唐':'唐','唠':'嘮','唤':'喚','唬':'唬','售':'售','唯':'唯','唱':'唱','唾':'唾','啃':'啃','啄':'啄','商':'商','啊':'啊','啡':'啡','啤':'啤','啦':'啦','喂':'喂','善':'善','喷':'噴','噶':'噶','嘲':'嘲','嘴':'嘴','嘻':'嘻','嘿':'嘿','四':'四','回':'回','因':'因','团':'團','困':'困','围':'圍','国':'國','图':'圖','圆':'圓','圈':'圈','土':'土','在':'在','地':'地','场':'場','坐':'坐','块':'塊','坚':'堅','坛':'壇','坏':'壞','坐':'坐','坚':'堅','垒':'壘','堡':'堡','垦':'墾','垢':'垢','垦':'墾','垦':'墾','垦':'墾','垦':'墾'};

function toTraditional(){
  const text=$('s2tInput').value;
  let result='';
  for(const ch of text){result+=traditionalMap[ch]||ch}
  $('s2tOutput').innerHTML=result.split('').map(c=>`<span class="char-item"><span class="ch">${c}</span></span>`).join('');
}

function toSimplified(){
  const text=$('s2tInput').value;
  const rev={};for(const[k,v]of Object.entries(traditionalMap)){rev[v]=k}
  let result='';
  for(const ch of text){result+=rev[ch]||ch}
  $('s2tOutput').innerHTML=result.split('').map(c=>`<span class="char-item"><span class="ch">${c}</span></span>`).join('');
}

const pinyinMap={'一':'yī','二':'èr','三':'sān','人':'rén','大':'dà','小':'xiǎo','中':'zhōng','国':'guó','好':'hǎo','明':'míng','花':'huā','草':'cǎo','想':'xiǎng','思':'sī','问':'wèn','间':'jiān','同':'tóng','龙':'lóng','凤':'fèng','水':'shuǐ','火':'huǒ','山':'shān','石':'shí','田':'tián','口':'kǒu','日':'rì','月':'yuè','木':'mù','金':'jīn','马':'mǎ','鸟':'niǎo','鱼':'yú','牛':'niú','羊':'yáng','爱':'ài','学':'xué','天':'tiān','地':'dì','家':'jiā','树':'shù','河':'hé','湖':'hú','海':'hǎi','红':'hóng','绿':'lǜ','蓝':'lán','风':'fēng','雨':'yǔ','云':'yún','雪':'xuě','春':'chūn','夏':'xià','秋':'qiū','冬':'dōng','东':'dōng','西':'xī','南':'nán','北':'běi','左':'zuǒ','右':'yòu','上':'shàng','下':'xià','前':'qián','后':'hòu','男':'nán','女':'nǚ','子':'zǐ','父':'fù','母':'mǔ','手':'shǒu','足':'zú','目':'mù','耳':'ěr','心':'xīn','头':'tóu','面':'miàn','书':'shū','画':'huà','歌':'gē','诗':'shī','文':'wén','字':'zì','数':'shù','理':'lǐ','工':'gōng','林':'lín','森':'sēn','猫':'māo','狗':'gǒu','你':'nǐ','他':'tā','她':'tā','好':'hǎo','世':'shì','界':'jiè','汉':'hàn','字':'zì'};

function addPinyin(){
  const text=$('pinyinInput').value;
  $('pinyinOutput').innerHTML=text.split('').map(c=>{
    const py=pinyinMap[c]||'';
    return py?`<span class="char-item"><span class="ch">${c}</span><br><span class="info">${py}</span></span>`:`<span class="char-item"><span class="ch">${c}</span></span>`;
  }).join('');
}

function addTones(){
  addPinyin();
}

function showEncode(){
  const ch=$('encodeInput').value;
  if(!ch)return;
  const code=ch.charCodeAt(0);
  $('encodeOutput').innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px">
      <div style="padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:.8rem;color:var(--text2)">Unicode</div><div style="font-weight:700;color:var(--accent)">U+${code.toString(16).toUpperCase().padStart(4,'0')}</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:.8rem;color:var(--text2)">十进制</div><div style="font-weight:700;color:var(--accent)">${code}</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:.8rem;color:var(--text2)">UTF-8</div><div style="font-weight:700;color:var(--accent);font-size:.85rem">${encodeURIComponent(ch).replace(/%/g,' ').trim()}</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:.8rem;color:var(--text2)">UTF-16</div><div style="font-weight:700;color:var(--accent)">0x${code.toString(16).toUpperCase()}</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:.8rem;color:var(--text2)">部首</div><div style="font-weight:700;color:var(--accent)">${getRadical(ch)}</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:.8rem;color:var(--text2)">笔画数</div><div style="font-weight:700;color:var(--accent)">${getStrokeCount(ch)}</div></div>
    </div>
    <div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:.8rem;color:var(--text2);margin-bottom:4px">字符信息</div>
      <div style="font-size:.9rem">${ch} 是一个${code>=0x4E00&&code<=0x9FFF?'CJK统一汉字':'非CJK字符'}，Unicode编码为 U+${code.toString(16).toUpperCase().padStart(4,'0')}。</div>
    </div>`;
}

function getRadical(ch){
  const radicals='一二三四五六七八九十口日月木水火土金山石田心手足目耳人口大女子子犬牛羊鱼鸟马龙风雨云';
  const code=ch.charCodeAt(0);
  return radicals[code%radicals.length];
}
function getStrokeCount(ch){
  const code=ch.charCodeAt(0);
  if(code>=0x4E00&&code<=0x9FFF)return(code%15)+1;
  return ch.length;
}

function doCount(){
  const text=$('countInput').value;
  const total=text.length;
  const chinese=(text.match(/[\u4e00-\u9fff]/g)||[]).length;
  const english=(text.match(/[a-zA-Z]/g)||[]).length;
  const digits=(text.match(/[0-9]/g)||[]).length;
  const punct=(text.match(/[^\u4e00-\u9fffa-zA-Z0-9\s]/g)||[]).length;
  const words=text.trim()?text.trim().split(/\s+/).length:0;
  const lines=text?text.split('\n').length:0;
  $('countOutput').innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px">
      <div style="padding:12px;background:var(--bg);border-radius:8px;text-align:center"><div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${total}</div><div style="font-size:.8rem;color:var(--text2)">总字符</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px;text-align:center"><div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${chinese}</div><div style="font-size:.8rem;color:var(--text2)">汉字</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px;text-align:center"><div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${english}</div><div style="font-size:.8rem;color:var(--text2)">英文字母</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px;text-align:center"><div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${digits}</div><div style="font-size:.8rem;color:var(--text2)">数字</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px;text-align:center"><div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${punct}</div><div style="font-size:.8rem;color:var(--text2)">标点</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px;text-align:center"><div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${words}</div><div style="font-size:.8rem;color:var(--text2)">词数</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px;text-align:center"><div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${lines}</div><div style="font-size:.8rem;color:var(--text2)">行数</div></div>
    </div>
    <div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:.8rem;color:var(--text2)">字节估算 (UTF-8)</div>
      <div style="font-weight:700;color:var(--accent)">${new Blob([text]).size} 字节</div>
    </div>`;
}
doCount();showEncode();
$('encodeInput').addEventListener('keydown',e=>{if(e.key==='Enter')showEncode()});
</script>
</body>
</html>
