<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复利计算器</title>
<meta name="description" content="复利计算器，计算投资复利收益和增长曲线">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.btn{background:var(--blue);color:var(--text);border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s}
.btn:hover{opacity:.85}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.result-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.stat-card{text-align:center;padding:14px;background:var(--bg);border-radius:var(--radius)}
.stat-card .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:1.2rem;font-weight:700}
.stat-card .value.gold{color:var(--gold)}
.stat-card .value.green{color:var(--green)}
.growth-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
.growth-table th,.growth-table td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}
.growth-table th{color:var(--text2);font-weight:500;background:var(--bg)}
.growth-table td:first-child,.growth-table th:first-child{text-align:left}
.growth-table tr:last-child td{border-bottom:none}
.chart-container{padding:10px 0}
.chart-bar{display:flex;align-items:center;gap:6px;margin:3px 0}
.chart-bar .year-label{min-width:40px;font-size:.72rem;color:var(--text2);text-align:right}
.chart-bar .bar-track{flex:1;height:16px;background:var(--bg);border-radius:4px;overflow:hidden}
.chart-bar .bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .5s}
.chart-bar .val-label{min-width:70px;font-size:.72rem;color:var(--text);text-align:right}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.preset-group{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.preset-btn{padding:4px 12px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;background:var(--card);color:var(--text);cursor:pointer;transition:all .2s}
.preset-btn:hover{border-color:var(--blue);color:var(--blue)}
.preset-btn.active{background:var(--blue);color:var(--text);border-color:var(--blue)}
@media(max-width:640px){.form-row{flex-direction:column}.result-grid{grid-template-columns:1fr}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="复利计算器">
  <meta property="og:description" content="复利计算器，计算投资复利收益和增长曲线">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/compound-calc/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
  <header>
    <h1>📈 复利计算器</h1>
    <p>计算复利投资收益</p>
  </header>

  <div class="card">
    <div class="form-row">
      <div class="group">
        <label>本金 (元)</label>
        <input type="number" id="principal" value="100000" min="0" step="any">
      </div>
      <div class="group">
        <label>年利率 (%)</label>
        <input type="number" id="rate" value="8" min="0" max="100" step="any">
      </div>
    </div>
    <div class="preset-group" id="ratePresets"></div>
    <div class="form-row">
      <div class="group">
        <label>投资年限</label>
        <input type="number" id="years" value="10" min="1" max="100" step="1">
      </div>
      <div class="group">
        <label>复利频率</label>
        <select id="frequency">
          <option value="yearly">每年</option>
          <option value="monthly" selected>每月</option>
          <option value="daily">每天</option>
        </select>
      </div>
    </div>
    <div class="preset-group" id="yearPresets"></div>
  </div>

  <div class="card">
    <div class="section-title">📊 计算结果</div>
    <div class="result-grid" id="resultGrid"></div>
  </div>

  <div class="card">
    <div class="section-title">📈 逐年增长</div>
    <div class="chart-container" id="chartContainer"></div>
    <div style="margin-top:10px;max-height:300px;overflow-y:auto" id="growthTableContainer"></div>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const principalInp = $('principal');
const rateInp = $('rate');
const yearsInp = $('years');
const frequencySel = $('frequency');
const resultGrid = $('resultGrid');
const chartContainer = $('chartContainer');
const growthTableContainer = $('growthTableContainer');
const ratePresets = [3,5,8,10,12,15,20];
const yearPresets = [3,5,10,15,20,30];
function renderPresets(container, values, input, suffix){
  container.innerHTML = values.map(v => {
    const cls = parseFloat(input.value) === v ? 'preset-btn active' : 'preset-btn';
    return `<button class="${cls}" data-val="${v}">${v}${suffix}</button>`;
  }).join('');
  container.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.val;
      container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calc();
    });
  });
}
function calc(){
  const P = parseFloat(principalInp.value) || 0;
  const r = (parseFloat(rateInp.value) || 0) / 100;
  const n = parseInt(yearsInp.value) || 1;
  const freq = frequencySel.value;
  const periodsPerYear = freq === 'monthly' ? 12 : freq === 'daily' ? 365 : 1;
  const totalPeriods = n * periodsPerYear;
  const finalAmount = P * Math.pow(1 + r / periodsPerYear, totalPeriods);
  const totalInterest = finalAmount - P;
  resultGrid.innerHTML = `
    <div class="stat-card"><div class="label">本息合计</div><div class="value gold">¥${finalAmount.toLocaleString('zh-CN',{minimumFractionDigits:2})}</div></div>
    <div class="stat-card"><div class="label">总收益</div><div class="value green">¥${totalInterest.toLocaleString('zh-CN',{minimumFractionDigits:2})}</div></div>
    <div class="stat-card"><div class="label">收益率</div><div class="value">${((totalInterest/P)*100).toFixed(2)}%</div></div>
  `;
  const yearlyData = [];
  for(let y = 1; y <= n; y++){
    const periods = y * periodsPerYear;
    const amt = P * Math.pow(1 + r / periodsPerYear, periods);
    yearlyData.push({year: y, amount: amt, interest: amt - P});
  }
  const maxAmt = yearlyData[n-1].amount;
  chartContainer.innerHTML = yearlyData.map(d => {
    const pct = (d.amount / maxAmt * 100);
    return `<div class="chart-bar">
      <div class="year-label">第${d.year}年</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="val-label">¥${d.amount.toLocaleString('zh-CN',{minimumFractionDigits:0})}</div>
    </div>`;
  }).join('');
  growthTableContainer.innerHTML = `<table class="growth-table">
    <thead><tr><th>年份</th><th>本息合计</th><th>当年收益</th><th>累计收益</th><th>收益率</th></tr></thead>
    <tbody>${yearlyData.map((d,i) => {
      const prevAmt = i === 0 ? P : yearlyData[i-1].amount;
      const yearInterest = d.amount - prevAmt;
      return `<tr>
        <td>第${d.year}年</td>
        <td>¥${d.amount.toLocaleString('zh-CN',{minimumFractionDigits:2})}</td>
        <td>¥${yearInterest.toLocaleString('zh-CN',{minimumFractionDigits:2})}</td>
        <td>¥${d.interest.toLocaleString('zh-CN',{minimumFractionDigits:2})}</td>
        <td>${((d.interest/P)*100).toFixed(2)}%</td>
      </tr>`;
    }).join('')}</tbody></table>`;
  renderPresets($('ratePresets'), ratePresets, rateInp, '%');
  renderPresets($('yearPresets'), yearPresets, yearsInp, '年');
}
[principalInp, rateInp, yearsInp, frequencySel].forEach(el => {
  el.addEventListener('input', calc);
  el.addEventListener('change', calc);
});
calc();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
