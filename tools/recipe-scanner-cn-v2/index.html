<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📸 智能食谱扫描器 v2</title>
<meta property="og:title" content="📸 智能食谱扫描器 v2">
<meta property="og:description" content="📸 智能食谱扫描器 v2 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="输入菜名获取营养分析、烹饪步骤和食材清单，支持历史记录">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#06b6d4;--accent2:#0891b2;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0891b2;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--blue:#0969da;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:750px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text]{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nutrition-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.nut-item{text-align:center;padding:12px 8px;background:var(--bg);border-radius:8px}
.nut-item .val{font-size:1.2rem;font-weight:700;color:var(--accent)}
.nut-item .lbl{font-size:.7rem;color:var(--text2);margin-top:2px}
.ing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.ing-chip{background:var(--bg);padding:8px 12px;border-radius:8px;font-size:.85rem;display:flex;justify-content:space-between}
.ing-chip b{color:var(--accent)}
.steps{counter-reset:step;margin:12px 0}
.steps li{list-style:none;padding:10px 0;border-bottom:1px solid var(--border);counter-increment:step;position:relative;padding-left:36px;font-size:.9rem}
.steps li::before{content:counter(step);position:absolute;left:0;top:10px;width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.75rem;margin:2px}
.tag.green{background:rgba(34,197,94,.15);color:var(--green)}
.tag.yellow{background:rgba(234,179,8,.15);color:var(--yellow)}
.tag.red{background:rgba(239,68,68,.15);color:var(--red)}
.tag.blue{background:rgba(59,130,246,.15);color:var(--blue)}
.tip-card{padding:12px;background:var(--bg);border-radius:8px;margin-top:10px;font-size:.85rem;border-left:3px solid var(--accent)}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px}
.quick-item{padding:10px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;font-size:.85rem}
.quick-item:hover{border-color:var(--accent);transform:translateY(-2px)}
.quick-item .emoji{font-size:1.5rem;margin-bottom:4px}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.history-item:last-child{border-bottom:none}
.history-item .info{flex:1}
.history-item .name{font-weight:600}
.history-item .meta{font-size:.8rem;color:var(--text2)}
.empty{text-align:center;padding:30px;color:var(--text2);font-size:.9rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📸 智能食谱扫描器 v2</h1><p>输入菜名，获取营养分析和烹饪指南</p></div>

<div class="cd"><h2>🔍 查询菜品</h2>
<label>菜名</label><input type="text" id="dishInput" placeholder="输入菜名，如：宫保鸡丁" onkeydown="if(event.key==='Enter')scanDish()">
<div class="bg"><button onclick="scanDish()">🔍 分析</button><button class="sec" onclick="randomDish()">🎲 随机</button></div>
<div class="quick-grid" id="quickDishes"></div></div>

<div class="cd" id="resultCard" style="display:none"><h2 id="resultTitle">分析结果</h2>
<div class="nutrition-bar" id="nutBar"></div>
<div id="recipeInfo"></div>
<div id="ingSection"></div>
<h3 style="color:var(--accent);margin:16px 0 8px">👨‍🍳 烹饪步骤</h3>
<ol class="steps" id="stepsList"></ol>
<div class="tip-card" id="tipCard"></div>
<div class="bg" style="margin-top:16px"><button onclick="saveToHistory()">💾 保存</button><button class="sec" onclick="shareResult()">📤 分享</button></div></div>

<div class="cd"><h2>📜 历史记录</h2><div id="historyList" class="empty">暂无记录</div></div>
</div>
<script>
var DB='recipe_scanner_v2',hist=JSON.parse(localStorage.getItem(DB)||'[]');
var RECIPES={
'宫保鸡丁':{cal:230,protein:18,carb:12,fat:13,diff:'中等',time:25,cat:'川菜',
ing:{鸡胸肉:'250g',花生米:'50g',干辣椒:'10个',花椒:'1小勺',葱:'2根',蒜:'3瓣',姜:'3片',酱油:'2勺',醋:'1勺',糖:'1勺',淀粉:'1勺'},
steps:['鸡胸肉切丁加料酒淀粉腌10分钟','调碗汁：酱油2勺醋1勺糖1勺淀粉1勺水2勺','花生米小火炒熟备用','热油爆香干辣椒花椒','下鸡丁炒至变色','倒入碗汁翻炒均匀','加入花生米出锅'],
tip:'花生米最后加入可保持酥脆口感'},
'红烧肉':{cal:480,protein:22,carb:8,fat:40,diff:'中等',time:90,cat:'家常菜',
ing:{五花肉:'500g',冰糖:'30g',酱油:'3勺',料酒:'2勺',葱:'2根',姜:'5片',八角:'2个',桂皮:'1小块'},
steps:['五花肉切块焯水去血沫','锅中放少许油炒化冰糖至焦糖色','放入肉块翻炒上色','加葱姜八角桂皮炒香','加酱油料酒和没过肉的水','大火烧开转小火炖60分钟','大火收汁即可'],
tip:'小火慢炖是关键，至少40分钟以上更入味'},
'番茄炒蛋':{cal:180,protein:10,carb:8,fat:12,diff:'简单',time:10,cat:'家常菜',
ing:{鸡蛋:'3个',番茄:'2个',葱:'1根',糖:'1小勺',盐:'适量'},
steps:['番茄切块鸡蛋打散加少许盐','热锅多油炒鸡蛋盛出','锅留底油炒番茄至出汁','加糖盐调味','倒回鸡蛋翻炒均匀出锅'],
tip:'番茄要炒出汁才好吃，可以先用开水烫去皮'},
'麻婆豆腐':{cal:200,protein:12,carb:6,fat:15,diff:'中等',time:15,cat:'川菜',
ing:{嫩豆腐:'1盒',猪肉末:'100g',豆瓣酱:'1勺',花椒粉:'适量',葱花:'适量',蒜末:'适量'},
steps:['豆腐切小块焯水沥干','热油炒肉末至变色','加豆瓣酱蒜末炒出红油','加少许水烧开放入豆腐','小火煮3分钟入味','水淀粉勾芡撒花椒粉葱花'],
tip:'豆腐焯水可以去除豆腥味，也更容易入味'},
'清蒸鲈鱼':{cal:150,protein:28,carb:2,fat:4,diff:'中等',time:25,cat:'粤菜',
ing:{鲈鱼:'1条',葱:'3根',姜:'1块',蒸鱼豉油:'2勺',料酒:'1勺'},
steps:['鱼处理干净两面划刀','抹料酒姜片腌10分钟','水烧开后大火蒸8分钟','倒掉蒸出的汤汁','铺葱丝淋热油','最后淋蒸鱼豉油'],
tip:'蒸鱼时间不宜过长，8-10分钟即可，否则肉质变老'},
'蛋炒饭':{cal:350,protein:10,carb:50,fat:12,diff:'简单',time:8,cat:'快手菜',
ing:{隔夜饭:'1碗',鸡蛋:'2个',葱:'1根',盐:'适量',酱油:'少许'},
steps:['鸡蛋打散葱切花','热锅多油下蛋液','半凝固时加米饭','大火翻炒至粒粒分明','加盐少许酱油调色调味','撒葱花出锅'],
tip:'用隔夜饭效果最好，水分少容易炒散'},
'可乐鸡翅':{cal:280,protein:16,carb:20,fat:14,diff:'简单',time:30,cat:'家常菜',
ing:{鸡翅中:'8个',可乐:'1罐',酱油:'2勺',姜:'3片',料酒:'1勺'},
steps:['鸡翅划刀冷水焯水捞出','热油煎鸡翅至两面金黄','加姜片料酒酱油翻炒','倒入可乐没过鸡翅','大火烧开转中火煮15分钟','大火收汁'],
tip:'收汁时要不停翻动，防止粘锅'},
'酸辣土豆丝':{cal:120,protein:3,carb:20,fat:4,diff:'简单',time:10,cat:'家常菜',
ing:{土豆:'2个',干辣椒:'5个',醋:'2勺',蒜:'3瓣',葱:'1根'},
steps:['土豆去皮切丝泡水去淀粉','热油爆香干辣椒蒜末','下土豆丝大火翻炒','沿锅边淋醋','加盐调味撒葱花出锅'],
tip:'土豆丝要泡水去淀粉，这样炒出来才脆'},
'水煮牛肉':{cal:320,protein:25,carb:8,fat:22,diff:'较难',time:40,cat:'川菜',
ing:{牛肉:'300g',豆芽:'200g',豆瓣酱:'2勺',花椒:'1勺',干辣椒:'10个',蒜:'5瓣'},
steps:['牛肉切片加蛋清淀粉料酒腌15分钟','豆芽焯水铺碗底','热油炒豆瓣酱出红油','加水烧开下牛肉片煮至变色','连汤倒入碗中','另起油锅炸花椒干辣椒浇在牛肉上'],
tip:'牛肉片要顺着纹理切，腌制后口感更嫩'},
'蒜蓉西兰花':{cal:80,protein:5,carb:6,fat:4,diff:'简单',time:8,cat:'快手菜',
ing:{西兰花:'1棵',蒜:'5瓣',盐:'适量',蚝油:'1勺'},
steps:['西兰花掰小朵盐水泡10分钟','烧水加少许油盐焯西兰花1分钟捞出','热油爆香蒜末','下西兰花翻炒','加蚝油盐调味出锅'],
tip:'焯水时加盐和油可以保持翠绿色'},
'糖醋排骨':{cal:350,protein:20,carb:25,fat:20,diff:'中等',time:40,cat:'家常菜',
ing:{小排:'500g',醋:'3勺',糖:'4勺',酱油:'2勺',料酒:'2勺',姜:'3片'},
steps:['排骨焯水捞出','热油煎排骨至微黄','加姜片料酒酱油翻炒','加入糖醋和适量水','大火烧开转中火煮20分钟','大火收汁至浓稠'],
tip:'糖醋比例约3:4，可根据口味调整'}
};
var QUICK_DISHES=['宫保鸡丁','红烧肉','番茄炒蛋','麻婆豆腐','清蒸鲈鱼','蛋炒饭','可乐鸡翅','酸辣土豆丝','水煮牛肉','蒜蓉西兰花','糖醋排骨'];

function scanDish(){
var name=document.getElementById('dishInput').value.trim();
if(!name){alert('请输入菜名');return;}
var r=RECIPES[name];
if(!r){var keys=Object.keys(RECIPES).filter(function(k){return k.includes(name)||name.includes(k)});
r=keys.length?RECIPES[keys[0]]:null;}
if(!r){alert('未找到"' +name+ '"的食谱数据');return;}
showResult(name,r);
}
function randomDish(){
var keys=Object.keys(RECIPES);var name=keys[Math.floor(Math.random()*keys.length)];
document.getElementById('dishInput').value=name;showResult(name,RECIPES[name]);
}
function showResult(name,r){
document.getElementById('resultCard').style.display='block';
document.getElementById('resultTitle').textContent='📊 '+name+' 分析结果';
document.getElementById('nutBar').innerHTML=[
{v:r.cal,l:'热量',u:'千卡'},{v:r.protein+'g',l:'蛋白质'},{v:r.carb+'g',l:'碳水'},{v:r.fat+'g',l:'脂肪'}
].map(function(n){return '<div class="nut-item"><div class="val">'+n.v+'</div><div class="lbl">'+n.l+(n.u?' ('+n.u+')':'')+'</div></div>'}).join('');
var diffClass=r.diff==='简单'?'green':r.diff==='中等'?'yellow':'red';
document.getElementById('recipeInfo').innerHTML='<div style="margin:8px 0"><span class="tag blue">'+r.cat+'</span><span class="tag '+diffClass+'">'+r.diff+'</span><span class="tag">⏱ '+r.time+'分钟</span></div>';
document.getElementById('ingSection').innerHTML='<h3 style="color:var(--accent);margin:16px 0 8px">🥗 食材清单</h3><div class="ing-grid">'+Object.entries(r.ing).map(function(e){return '<div class="ing-chip"><span>'+e[0]+'</span><b>'+e[1]+'</b></div>'}).join('')+'</div>';
document.getElementById('stepsList').innerHTML=r.steps.map(function(s){return '<li>'+s+'</li>'}).join('');
document.getElementById('tipCard').innerHTML='💡 <b>小贴士：</b>'+r.tip;
document.getElementById('resultCard').scrollIntoView({behavior:'smooth'});
}
function saveToHistory(){
var name=document.getElementById('dishInput').value.trim();
if(!name)return;
hist.unshift({name:name,time:new Date().toLocaleString()});
hist=[...new Set(hist.map(function(h){return h.name}))].slice(0,20).map(function(n){return{name:n,time:new Date().toLocaleString()}});
localStorage.setItem(DB,JSON.stringify(hist));renderHistory();
}
function shareResult(){
var name=document.getElementById('dishInput').value.trim();var r=RECIPES[name];
if(!r)return;
var text='【'+name+'】\n热量:'+r.cal+'千卡 蛋白质:'+r.protein+'g\n食材:'+Object.entries(r.ing).map(function(e){return e[0]+e[1]}).join('、')+'\n步骤:'+r.steps.join('\n');
if(navigator.share){navigator.share({title:name,text:text});}else{navigator.clipboard.writeText(text);alert('已复制到剪贴板');}
}
function renderHistory(){
if(!hist.length){document.getElementById('historyList').innerHTML='<div class="empty">暂无记录</div>';return;}
document.getElementById('historyList').innerHTML=hist.slice(0,10).map(function(h){
return '<div class="history-item"><div class="info"><div class="name">'+h.name+'</div><div class="meta">'+h.time+'</div></div><button class="sec" style="padding:4px 10px;font-size:.75rem" onclick="document.getElementById(\'dishInput\').value=\''+h.name+'\';scanDish()">查看</button></div>';
}).join('');
}
function renderQuick(){
document.getElementById('quickDishes').innerHTML=QUICK_DISHES.slice(0,8).map(function(d){
return '<div class="quick-item" onclick="document.getElementById(\'dishInput\').value=\''+d+'\';scanDish()">'+d+'</div>';
}).join('');
}
renderQuick();renderHistory();
</script>
</body>
</html>
