<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="动画工作室 - 创建和预览CSS动画效果">
    <meta name="robots" content="index, follow">
    <title>动画工作室</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #0ea5e9; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #38bdf8; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        textarea { resize: vertical; min-height: 100px; font-family: 'Courier New', monospace; font-size: 13px; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 8px; }
        button:hover { opacity: 0.9; }
        .btn-sm { padding: 4px 10px; font-size: 13px; }
        .btn-success { background-color: var(--success-color); }
        .btn-danger { background-color: var(--danger-color); }
        .btn-outline { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .preview-area { min-height: 250px; border: 2px dashed var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; background: repeating-conic-gradient(var(--border-color) 0% 25%, transparent 0% 50%) 50% / 20px 20px; position: relative; }
        .anim-box { width: 80px; height: 80px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 14px; }
        .keyframe-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); }
        .keyframe-row input { width: 60px !important; }
        .keyframe-row select { width: 120px !important; }
        .code-output { white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 13px; background: var(--bg-color); padding: 16px; border-radius: 6px; border: 1px solid var(--border-color); max-height: 300px; overflow-y: auto; }
        .preset-btn { padding: 6px 14px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--card-bg); cursor: pointer; font-size: 13px; }
        .preset-btn:hover { border-color: var(--primary-color); }
        .timeline { position: relative; height: 40px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 4px; margin-top: 12px; overflow: hidden; }
        .timeline-marker { position: absolute; top: 0; height: 100%; background: var(--primary-color); opacity: 0.3; border-radius: 4px; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>动画工作室</h1>

        <div class="card">
            <h3>预设动画</h3>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="preset-btn" onclick="applyPreset('fadeIn')">淡入</button>
                <button class="preset-btn" onclick="applyPreset('slideUp')">上滑</button>
                <button class="preset-btn" onclick="applyPreset('slideLeft')">左滑</button>
                <button class="preset-btn" onclick="applyPreset('bounce')">弹跳</button>
                <button class="preset-btn" onclick="applyPreset('rotate')">旋转</button>
                <button class="preset-btn" onclick="applyPreset('pulse')">脉冲</button>
                <button class="preset-btn" onclick="applyPreset('shake')">抖动</button>
                <button class="preset-btn" onclick="applyPreset('flip')">翻转</button>
                <button class="preset-btn" onclick="applyPreset('glow')">发光</button>
                <button class="preset-btn" onclick="applyPreset('typewriter')">打字机</button>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>动画配置</h3>
                <div class="form-group">
                    <label>动画名称</label>
                    <input type="text" id="animName" value="myAnimation" onchange="updateCode()">
                </div>
                <div class="grid-3">
                    <div class="form-group">
                        <label>时长 (s)</label>
                        <input type="number" id="duration" value="1" min="0.1" max="10" step="0.1" onchange="updateCode()">
                    </div>
                    <div class="form-group">
                        <label>缓动函数</label>
                        <select id="easing" onchange="updateCode()">
                            <option value="ease">ease</option>
                            <option value="linear">linear</option>
                            <option value="ease-in">ease-in</option>
                            <option value="ease-out">ease-out</option>
                            <option value="ease-in-out" selected>ease-in-out</option>
                            <option value="cubic-bezier(0.68,-0.55,0.265,1.55)">弹性</option>
                            <option value="steps(5)">步进</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>延迟 (s)</label>
                        <input type="number" id="delay" value="0" min="0" max="5" step="0.1" onchange="updateCode()">
                    </div>
                </div>
                <div class="grid-3">
                    <div class="form-group">
                        <label>次数</label>
                        <select id="iteration" onchange="updateCode()">
                            <option value="1">1次</option>
                            <option value="2">2次</option>
                            <option value="3">3次</option>
                            <option value="infinite" selected>无限</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>方向</label>
                        <select id="direction" onchange="updateCode()">
                            <option value="normal" selected>normal</option>
                            <option value="reverse">reverse</option>
                            <option value="alternate">alternate</option>
                            <option value="alternate-reverse">alternate-reverse</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>填充</label>
                        <select id="fillMode" onchange="updateCode()">
                            <option value="none">none</option>
                            <option value="forwards" selected>forwards</option>
                            <option value="backwards">backwards</option>
                            <option value="both">both</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>元素样式</label>
                    <div class="grid-2">
                        <input type="color" id="boxColor" value="#0ea5e9" onchange="updateBox()" style="width:100%;height:40px;">
                        <input type="number" id="boxSize" value="80" min="20" max="200" onchange="updateBox()" style="width:100%;">
                    </div>
                </div>

                <h4>关键帧</h4>
                <div id="keyframes"></div>
                <button class="btn-sm" onclick="addKeyframe()">+ 添加关键帧</button>
            </div>

            <div class="card">
                <h3>预览</h3>
                <div style="display:flex;gap:8px;margin-bottom:12px;">
                    <button class="btn-success btn-sm" onclick="playAnimation()">播放</button>
                    <button class="btn-danger btn-sm" onclick="stopAnimation()">停止</button>
                </div>
                <div class="preview-area" id="previewArea">
                    <div class="anim-box" id="animBox" style="background:#0ea5e9;">动画</div>
                </div>
                <div class="timeline" id="timeline"></div>
            </div>
        </div>

        <div class="card">
            <h3>生成的CSS <button class="btn-sm" onclick="copyCode()">复制</button></h3>
            <div class="code-output" id="codeOutput"></div>
        </div>

        <div class="card">
            <h3>导出HTML</h3>
            <button class="btn-sm" onclick="exportHTML()">生成完整HTML</button>
            <div class="code-output" id="htmlOutput" style="margin-top:10px;">点击"生成完整HTML"查看</div>
        </div>
    </div>

    <script defer src="i18n.js"></script>
    <script>
        let keyframes = [
            { percent: 0, props: { opacity: '1', transform: 'scale(1)' } },
            { percent: 50, props: { opacity: '0.5', transform: 'scale(1.1)' } },
            { percent: 100, props: { opacity: '1', transform: 'scale(1)' } }
        ];

        const presets = {
            fadeIn: [{ percent:0, props:{opacity:'0'} },{ percent:100, props:{opacity:'1'} }],
            slideUp: [{ percent:0, props:{transform:'translateY(50px)',opacity:'0'} },{ percent:100, props:{transform:'translateY(0)',opacity:'1'} }],
            slideLeft: [{ percent:0, props:{transform:'translateX(50px)',opacity:'0'} },{ percent:100, props:{transform:'translateX(0)',opacity:'1'} }],
            bounce: [{ percent:0, props:{transform:'translateY(0)'} },{ percent:30, props:{transform:'translateY(-30px)'} },{ percent:50, props:{transform:'translateY(0)'} },{ percent:70, props:{transform:'translateY(-15px)'} },{ percent:100, props:{transform:'translateY(0)'} }],
            rotate: [{ percent:0, props:{transform:'rotate(0deg)'} },{ percent:100, props:{transform:'rotate(360deg)'} }],
            pulse: [{ percent:0, props:{transform:'scale(1)'} },{ percent:50, props:{transform:'scale(1.1)'} },{ percent:100, props:{transform:'scale(1)'} }],
            shake: [{ percent:0, props:{transform:'translateX(0)'} },{ percent:10, props:{transform:'translateX(-10px)'} },{ percent:20, props:{transform:'translateX(10px)'} },{ percent:30, props:{transform:'translateX(-10px)'} },{ percent:40, props:{transform:'translateX(10px)'} },{ percent:50, props:{transform:'translateX(0)'} }],
            flip: [{ percent:0, props:{transform:'perspective(400px) rotateY(0)'} },{ percent:100, props:{transform:'perspective(400px) rotateY(180deg)'} }],
            glow: [{ percent:0, props:{boxShadow:'0 0 5px rgba(14,165,233,0.2)'} },{ percent:50, props:{boxShadow:'0 0 20px rgba(14,165,233,0.8)'} },{ percent:100, props:{boxShadow:'0 0 5px rgba(14,165,233,0.2)'} }],
            typewriter: [{ percent:0, props:{width:'0'} },{ percent:100, props:{width:'100%'} }]
        };

        function init() { renderKeyframes(); updateCode(); }

        function renderKeyframes() {
            document.getElementById('keyframes').innerHTML = keyframes.map((kf, i) => `
                <div class="keyframe-row">
                    <input type="number" value="${kf.percent}" min="0" max="100" onchange="updateKF(${i},'percent',+this.value)">
                    <span>%</span>
                    <input type="text" value="${Object.entries(kf.props).map(([k,v])=>`${k}:${v}`).join('; ')}" onchange="parseProps(${i},this.value)" style="flex:1;">
                    <button class="btn-danger btn-sm" onclick="removeKF(${i})">×</button>
                </div>
            `).join('');
            updateCode();
        }

        function addKeyframe() {
            keyframes.push({ percent: 50, props: { opacity: '1' } });
            renderKeyframes();
        }

        function removeKF(i) { keyframes.splice(i, 1); renderKeyframes(); }

        function updateKF(i, key, val) { keyframes[i][key] = val; updateCode(); }

        function parseProps(i, val) {
            const props = {};
            val.split(';').forEach(p => {
                const [k, v] = p.split(':').map(s => s.trim());
                if (k && v) props[k] = v;
            });
            keyframes[i].props = props;
            updateCode();
        }

        function applyPreset(name) {
            keyframes = JSON.parse(JSON.stringify(presets[name]));
            document.getElementById('animName').value = name;
            renderKeyframes();
            playAnimation();
        }

        function updateBox() {
            const box = document.getElementById('animBox');
            box.style.background = document.getElementById('boxColor').value;
            const s = document.getElementById('boxSize').value;
            box.style.width = s + 'px';
            box.style.height = s + 'px';
        }

        function generateCSS() {
            const name = document.getElementById('animName').value || 'myAnimation';
            const dur = document.getElementById('duration').value;
            const easing = document.getElementById('easing').value;
            const delay = document.getElementById('delay').value;
            const iter = document.getElementById('iteration').value;
            const dir = document.getElementById('direction').value;
            const fill = document.getElementById('fillMode').value;

            const sorted = [...keyframes].sort((a,b) => a.percent - b.percent);
            const kfBody = sorted.map(kf => {
                const props = Object.entries(kf.props).map(([k,v]) => `  ${k}: ${v};`).join('\n');
                return `  ${kf.percent}% {\n${props}\n}`;
            }).join('\n');

            const kfCSS = `@keyframes ${name} {\n${kfBody}\n}`;
            const animCSS = `.animated-element {\n  animation: ${name} ${dur}s ${easing} ${delay}s ${iter} ${dir} ${fill};\n}`;

            return { kfCSS, animCSS, name, dur, easing, delay, iter, dir, fill };
        }

        function updateCode() {
            const { kfCSS, animCSS } = generateCSS();
            document.getElementById('codeOutput').textContent = kfCSS + '\n\n' + animCSS;
            renderTimeline();
        }

        function playAnimation() {
            const box = document.getElementById('animBox');
            const { name, dur, easing, delay, iter, dir, fill } = generateCSS();
            box.style.animation = 'none';
            box.offsetHeight;
            box.style.animation = `${name} ${dur}s ${easing} ${delay}s ${iter} ${dir} ${fill}`;
        }

        function stopAnimation() {
            document.getElementById('animBox').style.animation = 'none';
        }

        function renderTimeline() {
            const dur = +document.getElementById('duration').value;
            const sorted = [...keyframes].sort((a,b) => a.percent - b.percent);
            document.getElementById('timeline').innerHTML = sorted.map(kf => {
                const left = kf.percent;
                const width = Math.max(2, 100 - kf.percent);
                return `<div class="timeline-marker" style="left:${left}%;width:${width}%;background:var(--primary-color);opacity:0.5;"></div>`;
            }).join('') + sorted.map(kf => `<div style="position:absolute;left:${kf.percent}%;top:50%;transform:translate(-50%,-50%);font-size:10px;background:var(--card-bg);padding:1px 4px;border-radius:3px;border:1px solid var(--border-color);">${kf.percent}%</div>`).join('');
        }

        function copyCode() { navigator.clipboard.writeText(document.getElementById('codeOutput').textContent).then(() => alert('已复制')); }

        function exportHTML() {
            const { kfCSS, animCSS, name, dur, easing, delay, iter, dir, fill } = generateCSS();
            const html = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CSS动画 - ${name}</title>
  <style>
${kfCSS}

${animCSS}

.box {
  width: 80px;
  height: 80px;
  background: ${document.getElementById('boxColor').value};
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
  margin: 100px auto;
}
  </style>
</head>
<body>
  <div class="box animated-element">动画</div>
</body>
</html>`;
            document.getElementById('htmlOutput').textContent = html;
        }

        function toggleTheme() {
            const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
        }

        init();
    </script>
</body>
</html>
