<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏋️ 综合健身追踪器</title>
<meta name="description" content="综合健身运动追踪器，记录跑步、游泳、力量训练等各种运动数据，查看每周统计">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding:10px 0;margin-top:8px}
.bar-chart .bar{flex:1;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:4px 4px 0 0;position:relative;min-width:20px;transition:height .3s}
.bar-chart .bar .lbl{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--text2);white-space:nowrap}
.bar-chart .bar .val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--text2)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🏋️ 综合健身追踪器">
<meta property="og:description" content="综合健身运动追踪器，记录跑步、游泳、力量训练等各种运动数据">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/fitness-tracker-cn/">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏋️ 综合健身追踪器</h1><p>记录每一次运动，见证你的进步</p></div>

<div class="cd">
<div class="gr">
<div class="st"><div class="nm" id="weekCount" style="color:var(--success)">0</div><div class="lb">本周运动次数</div></div>
<div class="st"><div class="nm" id="weekDuration" style="color:var(--accent)">0</div><div class="lb">本周总时长(分钟)</div></div>
<div class="st"><div class="nm" id="weekCal" style="color:var(--warn)">0</div><div class="lb">本周消耗(千卡)</div></div>
<div class="st"><div class="nm" id="weekDays" style="color:var(--danger)">0</div><div class="lb">运动天数</div></div>
</div>
</div>

<div class="cd"><h2>添加运动</h2>
<div class="fr">
<div><label>运动类型</label><select id="eType"><option>跑步</option><option>游泳</option><option>力量训练</option><option>跳绳</option><option>瑜伽</option><option>骑行</option><option>HIIT</option><option>拳击</option><option>篮球</option><option>羽毛球</option><option>其他</option></select></div>
<div><label>时长(分钟)</label><input type="number" id="eDur" placeholder="运动时长" min="1"></div>
</div>
<div class="fr">
<div><label>消耗卡路里(千卡)</label><input type="number" id="eCal" placeholder="估算热量消耗"></div>
<div><label>强度</label><select id="eInt"><option value="低">🟢 低</option><option value="中" selected>🟡 中</option><option value="高">🔴 高</option></select></div>
</div>
<div><label>日期</label><input type="date" id="eDate"></div>
<div class="bg"><button onclick="addRecord()">添加记录</button></div></div>

<div class="cd"><h2>快捷添加</h2><div class="bg" id="quickBtns"></div></div>

<div class="cd"><h2>本周运动趋势</h2><div class="bar-chart" id="weekChart"></div></div>

<div class="cd"><h2>运动记录</h2><div id="recordList" class="es">暂无记录</div>
<div class="bg"><button class="dng" onclick="clearRecords()">清空所有</button></div></div>

<div class="cd"><h2>近14天统计</h2><div id="historyStats" class="es">暂无历史数据</div></div>
</div>
<script>
(function(){
var DB_KEY='fitness_tracker_cn';
var records=JSON.parse(localStorage.getItem(DB_KEY)||'[]');
var today=function(){return new Date().toISOString().slice(0,10)};
var QUICK=[
{n:'跑步',d:30,c:300,i:'中',e:'跑步'},{n:'游泳',d:45,c:400,i:'中',e:'游泳'},
{n:'力量训练',d:60,c:350,i:'高',e:'力量训练'},{n:'跳绳',d:20,c:200,i:'高',e:'跳绳'},
{n:'瑜伽',d:60,c:180,i:'低',e:'瑜伽'},{n:'骑行',d:30,c:250,i:'中',e:'骑行'}
];

function renderQuick(){
document.getElementById('quickBtns').innerHTML=QUICK.map(function(q,i){
return '<button onclick="quickAdd('+i+')" style="font-size:.8rem;padding:6px 10px">'+q.n+'<br><span style="font-size:.7rem;opacity:.7">'+q.d+'min '+q.c+'kcal</span></button>';
}).join('');
}
window.quickAdd=function(i){var q=QUICK[i];document.getElementById('eType').value=q.e;document.getElementById('eDur').value=q.d;document.getElementById('eCal').value=q.c;document.getElementById('eInt').value=q.i;};

window.addRecord=function(){
var type=document.getElementById('eType').value;
var dur=parseInt(document.getElementById('eDur').value)||0;
var cal=parseInt(document.getElementById('eCal').value)||0;
var intensity=document.getElementById('eInt').value;
var date=document.getElementById('eDate').value;
if(!dur){alert('请填写运动时长');return;}
records.push({type:type,duration:dur,calories:cal,intensity:intensity,date:date||today(),id:Date.now()});
localStorage.setItem(DB_KEY,JSON.stringify(records));
document.getElementById('eDur').value='';document.getElementById('eCal').value='';
render();
};

window.delRecord=function(id){records=records.filter(function(r){return r.id!==id});localStorage.setItem(DB_KEY,JSON.stringify(records));render();};
window.clearRecords=function(){if(!confirm('确定清空所有记录？'))return;records=[];localStorage.setItem(DB_KEY,JSON.stringify(records));render();};

function getWeekRecords(){
var now=new Date();var dayOfWeek=now.getDay()||7;
var weekStart=new Date(now);weekStart.setDate(now.getDate()-dayOfWeek+1);weekStart.setHours(0,0,0,0);
return records.filter(function(r){return new Date(r.date)>=weekStart;});
}

function render(){
var tr=getWeekRecords();
var totalDur=0,totalCal=0,days={};
tr.forEach(function(r){totalDur+=r.duration;totalCal+=r.calories;days[r.date]=true;});
document.getElementById('weekCount').textContent=tr.length;
document.getElementById('weekDuration').textContent=totalDur;
document.getElementById('weekCal').textContent=totalCal;
document.getElementById('weekDays').textContent=Object.keys(days).length;

var dayNames=['一','二','三','四','五','六','日'];
var now=new Date();var dayOfWeek=now.getDay()||7;
var weekStart=new Date(now);weekStart.setDate(now.getDate()-dayOfWeek+1);weekStart.setHours(0,0,0,0);
var dailyDur={};var maxDur=1;
for(var i=0;i<7;i++){
var d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
var ds=d.toISOString().slice(0,10);dailyDur[ds]=0;
}
tr.forEach(function(r){dailyDur[r.date]=(dailyDur[r.date]||0)+r.duration;});
Object.values(dailyDur).forEach(function(v){if(v>maxDur)maxDur=v;});

var chartHtml='';
for(var i=0;i<7;i++){
var d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
var ds=d.toISOString().slice(0,10);
var h=Math.round((dailyDur[ds]||0)/maxDur*100);
chartHtml+='<div class="bar" style="height:'+Math.max(h,3)+'%"><div class="val">'+(dailyDur[ds]||0)+'</div><div class="lbl">周'+dayNames[i]+'</div></div>';
}
document.getElementById('weekChart').innerHTML=chartHtml;

var el=document.getElementById('recordList');
if(!records.length){el.innerHTML='<div class="es">暂无记录</div>';return;}
var html='';records.slice().reverse().forEach(function(r){
var intClass=r.intensity==='高'?'d':r.intensity==='中'?'w':'s';
html+='<div class="li"><div style="flex:1"><strong>'+r.type+'</strong> <span class="tag '+intClass+'">'+r.intensity+'</span> '+r.duration+'分钟 <span style="color:var(--text2);font-size:.8rem">'+r.calories+'千卡 · '+r.date+'</span></div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="delRecord('+r.id+')">✕</button></div>';
});
el.innerHTML=html;

var hist={};
var histDays=14;
var histStart=new Date();histStart.setDate(histStart.getDate()-histDays);
records.forEach(function(r){if(new Date(r.date)>=histStart){
if(!hist[r.date])hist[r.date]={d:0,c:0};hist[r.date].d+=r.duration;hist[r.date].c+=r.calories;}});
var hDates=Object.keys(hist).sort().reverse();
var hEl=document.getElementById('historyStats');
if(!hDates.length){hEl.innerHTML='<div class="es">暂无历史数据</div>';return;}
hEl.innerHTML=hDates.map(function(d){return '<div class="li"><span>'+d+'</span><span style="font-weight:600;color:var(--accent)">'+hist[d].d+'分钟 · '+hist[d].c+'千卡</span></div>';}).join('');
}

document.getElementById('eDate').value=today();
renderQuick();render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
