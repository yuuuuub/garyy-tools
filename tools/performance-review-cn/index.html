<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绩效评估</title>
<meta property="og:title" content="绩效评估">
<meta property="og:description" content="绩效评估 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="绩效评估工具 - 全面评估员工工作表现，制定发展目标">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a371f7;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
input,textarea,select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
textarea{resize:vertical;min-height:60px}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:550px;max-height:80vh;overflow-y:auto}
.review-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.review-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.review-name{font-weight:700;font-size:1.1rem}
.review-period{font-size:.8rem;color:var(--text2)}
.rating-scale{display:flex;gap:4px;margin:8px 0}
.rating-star{width:36px;height:36px;border:2px solid var(--border);border-radius:8px;background:var(--bg);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.rating-star:hover,.rating-star.active{border-color:var(--yellow);color:var(--yellow)}
.rating-label{font-size:.8rem;color:var(--text2);margin-bottom:4px}
.criteria-grid{display:grid;gap:12px}
.criteria-item{padding:12px;background:var(--bg);border-radius:8px}
.criteria-name{font-weight:600;font-size:.9rem;margin-bottom:4px}
.overall-score{font-size:2.5rem;font-weight:700;text-align:center;margin:16px 0}
.grade-badge{display:inline-block;padding:6px 16px;border-radius:20px;font-size:1rem;font-weight:700}
.grade-s{background:rgba(63,185,80,.2);color:var(--green)}
.grade-a{background:rgba(59,130,246,.2);color:var(--accent)}
.grade-b{background:rgba(210,153,34,.2);color:var(--yellow)}
.grade-c{background:rgba(248,81,73,.2);color:var(--red)}
.progress-section{margin:8px 0}
.progress-label{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:4px}
.progress-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .5s}
.strength-item{padding:8px 12px;background:var(--bg);border-left:3px solid var(--green);border-radius:0 8px 8px 0;margin-bottom:6px;font-size:.9rem}
.improve-item{padding:8px 12px;background:var(--bg);border-left:3px solid var(--yellow);border-radius:0 8px 8px 0;margin-bottom:6px;font-size:.9rem}
.goal-item{padding:8px 12px;background:var(--bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;margin-bottom:6px;font-size:.9rem}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.75rem;font-weight:600;margin:2px}
@media(max-width:600px){h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='⭐ 绩效评估';
const APP=document.getElementById('app');
const CRITERIA=['工作质量','工作数量','团队协作','创新能力','主动性','沟通能力','问题解决','目标达成'];
let data=JSON.parse(localStorage.getItem('pr_data')||'{"reviews":[],"goals":[]}');

function save(){localStorage.setItem('pr_data',JSON.stringify(data))}

function getGrade(score){return score>=4.5?'S':score>=4?'A':score>=3?'B':'C'}
function getGradeClass(score){return 'grade-'+getGrade(score).toLowerCase()}

function render(){
  let h=`<h1>⭐ 绩效评估</h1><p class="subtitle">全面评估员工表现</p>`;

  h+=`<div class="card"><div class="flex-between"><b>🎯 发展目标</b><button class="btn btn-sm" onclick="addGoal()">+ 添加</button></div>`;
  data.goals.forEach((g,i)=>{
    h+=`<div class="goal-item"><div class="flex-between"><span>${g.text}</span><div class="flex"><span class="tag ${g.done?'tag tag-green':'tag tag-yellow'}">${g.done?'已完成':'进行中'}</span><button class="btn btn-sm btn-danger" onclick="delGoal(${i})">✕</button></div></div></div>`;
  });
  if(!data.goals.length) h+=`<p style="color:var(--text2);font-size:.85rem">暂无目标</p>`;
  h+=`</div>`;

  h+=`<div class="flex-between" style="margin:16px 0 12px"><b style="font-size:1.1rem">📋 评估记录</b><button class="btn btn-sm" onclick="addReview()">+ 新建评估</button></div>`;

  if(!data.reviews.length) h+=`<div class="card" style="text-align:center;color:var(--text2);padding:40px">暂无评估记录</div>`;

  data.reviews.forEach((r,i)=>{
    const avg=CRITERIA.reduce((s,c)=>s+(r.scores[c]||0),0)/CRITERIA.length;
    h+=`<div class="review-card"><div class="review-header"><div><span class="review-name">${r.name}</span><span class="grade-badge ${getGradeClass(avg)}" style="margin-left:8px">${getGrade(avg)}</span></div><div class="flex"><span class="review-period">${r.period}</span><button class="btn btn-sm btn-danger" onclick="delReview(${i})">删除</button></div></div>`;
    h+=`<div class="overall-score" style="color:${avg>=4?'var(--green)':avg>=3?'var(--yellow)':'var(--red)'}">${avg.toFixed(1)}</div>`;

    CRITERIA.forEach(c=>{
      const s=r.scores[c]||0;
      h+=`<div class="progress-section"><div class="progress-label"><span>${c}</span><span>${s}/5</span></div><div class="progress-bar"><div class="progress-fill" style="width:${s*20}%;background:${s>=4?'var(--green)':s>=3?'var(--yellow)':'var(--red)'}"></div></div></div>`;
    });

    if(r.strengths){h+=`<div style="margin-top:12px"><b style="font-size:.85rem;color:var(--green)">💪 优势</b>`;r.strengths.split('\n').filter(s=>s.trim()).forEach(s=>{h+=`<div class="strength-item">${s}</div>`});h+=`</div>`}
    if(r.improvements){h+=`<div style="margin-top:8px"><b style="font-size:.85rem;color:var(--yellow)">📈 改进点</b>`;r.improvements.split('\n').filter(s=>s.trim()).forEach(s=>{h+=`<div class="improve-item">${s}</div>`});h+=`</div>`}
    if(r.comments){h+=`<div style="margin-top:8px"><b style="font-size:.85rem;color:var(--text2)">💬 评语</b><p style="font-size:.9rem;margin-top:4px">${r.comments}</p></div>`}
    h+=`</div>`;
  });
  APP.innerHTML=h;
}

function addReview(){
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">⭐ 新建评估</h3>
    <label>姓名</label><input id="rp" placeholder="员工姓名">
    <label>评估周期</label><input id="rperiod" placeholder="如：2024-Q1" value="${new Date().getFullYear()}-Q${Math.ceil((new Date().getMonth()+1)/3)}">
    ${CRITERIA.map(c=>`<label>${c}（1-5分）</label><select id="r_${c}"><option value="1">1 - 需要改进</option><option value="2">2 - 基本达标</option><option value="3" selected>3 - 达标</option><option value="4">4 - 优秀</option><option value="5">5 - 卓越</option></select>`).join('')}
    <label>优势</label><textarea id="rstr" placeholder="每行一条优势"></textarea>
    <label>改进点</label><textarea id="rimp" placeholder="每行一条改进点"></textarea>
    <label>评语</label><textarea id="rcom" placeholder="综合评语"></textarea>
    <div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    <button class="btn btn-success" onclick="saveReview()">保存</button></div></div>`;
  document.body.appendChild(m);
}
function saveReview(){
  const name=document.getElementById('rp').value.trim();if(!name){alert('请输入姓名');return}
  const scores={};CRITERIA.forEach(c=>{scores[c]=parseInt(document.getElementById('r_'+c).value)});
  const review={name,period:document.getElementById('rperiod').value,scores,strengths:document.getElementById('rstr').value,improvements:document.getElementById('rimp').value,comments:document.getElementById('rcom').value,date:new Date().toISOString()};
  data.reviews.push(review);save();document.querySelector('.modal-overlay').remove();render();
}
function delReview(i){if(confirm('删除此评估？')){data.reviews.splice(i,1);save();render()}}
function addGoal(){const t=prompt('发展目标：');if(t){data.goals.push({text:t,done:false});save();render()}}
function delGoal(i){if(confirm('删除？')){data.goals.splice(i,1);save();render()}}
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
