<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字统计器</title><meta name="description" content="汉字统计器 - 统计文本中的汉字数量、笔画数、使用频率等信息"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group textarea{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;min-height:120px;resize:vertical;font-family:inherit}.input-group textarea:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.stat-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}.stat-item .num{font-size:1.8rem;font-weight:700;color:var(--blue)}.stat-item .label{font-size:.8rem;color:var(--text2);margin-top:4px}.freq-list{margin-top:12px}.freq-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--border)}.freq-item:last-child{border:none}.bar-container{width:60%;background:var(--bg);border-radius:4px;height:8px;overflow:hidden;margin-left:8px}.bar-fill{height:100%;background:var(--blue);border-radius:4px;transition:width .3s}
</style><meta property="og:title" content="汉字统计器"><meta property="og:description" content="汉字统计器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔢 汉字统计器</h1><p class="sub">统计文本中的汉字信息</p>
<div class="card">
<div class="input-group"><label>输入文本</label><textarea id="textInput" placeholder="输入要统计的文本...">龙腾虎跃，凤舞九天。福禄寿喜，财旺安康。</textarea></div>
<button class="btn" onclick="count()">统计分析</button>
<button class="btn" onclick="loadSample()" style="background:var(--green)">加载示例</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var strokeDB={'龙':5,'凤':4,'虎':8,'福':15,'寿':7,'喜':12,'财':7,'旺':8,'安':6,'康':11,'富':12,'贵':9,'祥':10,'和':8,'顺':9,'春':9,'夏':10,'秋':9,'冬':5,'花':7,'月':4,'水':4,'火':4,'山':3,'木':4,'日':4,'目':5,'口':3,'人':2,'天':4,'大':3,'小':3,'中':4,'上':3,'下':3,'一':1,'二':2,'三':3,'四':5,'五':4,'六':4,'七':2,'八':2,'九':2,'十':2};
function count(){
var text=document.getElementById('textInput').value;
if(!text.trim()){alert('请输入文本');return}
var chars=text.replace(/[^\u4e00-\u9fa5]/g,'');
var total=text.length;
var chinese=chars.length;
var nonChinese=total-chinese;
var charsArr=chars.split('');
var freq={};
charsArr.forEach(function(c){freq[c]=(freq[c]||0)+1});
var sorted=Object.keys(freq).sort(function(a,b){return freq[b]-freq[a]});
var totalStrokes=0;
charsArr.forEach(function(c){totalStrokes+=(strokeDB[c]||10)});
var uniqueChars=sorted.length;
var html='<div class="card">';
html+='<div class="stats-grid">';
html+='<div class="stat-item"><div class="num">'+total+'</div><div class="label">总字符数</div></div>';
html+='<div class="stat-item"><div class="num" style="color:var(--green)">'+chinese+'</div><div class="label">汉字数</div></div>';
html+='<div class="stat-item"><div class="num" style="color:var(--red)">'+nonChinese+'</div><div class="label">非汉字字符</div></div>';
html+='<div class="stat-item"><div class="num" style="color:#a855f7">'+uniqueChars+'</div><div class="label">不同汉字</div></div>';
html+='<div class="stat-item"><div class="num" style="color:#f97316">'+totalStrokes+'</div><div class="label">总笔画数</div></div>';
html+='<div class="stat-item"><div class="num" style="color:#06b6d4">'+(chinese>0?Math.round(totalStrokes/chinese*10)/10:0)+'</div><div class="label">平均笔画</div></div>';
html+='</div>';
html+='<h3 style="margin:20px 0 12px">汉字使用频率 (Top 20)</h3>';
html+='<div class="freq-list">';
var maxFreq=freq[sorted[0]]||1;
sorted.slice(0,20).forEach(function(c,i){
var pct=Math.round(freq[c]/maxFreq*100);
html+='<div class="freq-item"><span>'+(i+1)+'. <strong>'+c+'</strong></span><span style="display:flex;align-items:center">'+freq[c]+'次<div class="bar-container"><div class="bar-fill" style="width:'+pct+'%"></div></div></span></div>';
});
html+='</div>';
html+='<h3 style="margin:20px 0 12px">汉字列表</h3>';
html+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
sorted.forEach(function(c){html+='<span style="padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:.9rem" title="出现'+freq[c]+'次">'+c+'</span>'});
html+='</div></div>';
document.getElementById('result').innerHTML=html;
}
function loadSample(){
document.getElementById('textInput').value='春风又绿江南岸，明月何时照我还。千里江陵一日还，两岸猿声啼不住。轻舟已过万重山。人生得意须尽欢，莫使金樽空对月。天生我材必有用，千金散尽还复来。';
count();
}
count();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
