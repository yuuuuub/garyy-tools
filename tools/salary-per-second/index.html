<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你的时间值多少钱</title>
  <meta name="description" content="时间价值计算器，看看你的每秒钟值多少钱">
  <style>
:root {--bg: #0f0f0f;
--card-bg: #1a1a1a;
--border: #2a2a2a;
--text: #e0e0e0;
--text-secondary: #999;
--accent: #f59e0b;
--accent-dim: rgba(245, 158, 11, 0.15);
--green: #10b981;
--green-dim: rgba(16, 185, 129, 0.15);
--blue: #3b82f6;
--blue-dim: rgba(59, 130, 246, 0.15);
--purple: #8b5cf6;
--purple-dim: rgba(139, 92, 246, 0.15);
--red: #ef4444;
--radius: 16px;
--shadow: 0 4px 24px rgba(0, 0, 0, 0.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
justify-content: center;
padding: 20px 16px 40px;
-webkit-font-smoothing: antialiasedscroll-behavior:smooth;}
.container {max-width: 480px;
width: 100%;
display: flex;
flex-direction: column;
gap: 20px}
.header {text-align: center;
padding: 24px 0 8px}
.header h1 {font-size: 28px;
font-weight: 700;
margin-bottom: 6px}
.header .subtitle {color: var(--text-secondary);
font-size: 14px}
.card {background: var(--card-bg);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 20px;
box-shadow: var(--shadow)}
.input-group {display: flex;
align-items: center;
gap: 10px}
.input-group label {font-size: 15px;
color: var(--text-secondary);
white-space: nowrap}
.input-group .prefix {font-size: 18px;
color: var(--text-secondary)}
.input-group input {flex: 1;
background: transparent;
border: none;
border-bottom: 2px solid var(--border);
color: var(--text);
font-size: 24px;
font-weight: 600;
padding: 6px 4px;
outline: none;
text-align: center;
transition: border-color 0.2s;
-moz-appearance: textfield}
.input-group input::-webkit-outer-spin-button,
.input-group input::-webkit-inner-spin-button {-webkit-appearance: none;
margin: 0}
.input-group input:focus {border-bottom-color: var(--accent)}
.input-group .suffix {font-size: 15px;
color: var(--text-secondary)}
.counter-card {background: linear-gradient(135deg, var(--accent-dim), var(--green-dim));
border-color: rgba(245, 158, 11, 0.3);
text-align: center;
padding: 28px 20px}
.counter-card .label {font-size: 13px;
color: var(--text-secondary);
margin-bottom: 8px;
letter-spacing: 1px}
.counter-card .amount {font-size: 42px;
font-weight: 800;
color: var(--accent);
font-variant-numeric: tabular-nums;
font-family: 'SF Mono', 'Menlo', 'Consolas', monospace}
.counter-card .unit {font-size: 16px;
color: var(--text-secondary);
margin-top: 4px}
.breakdown {display: grid;
grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
gap: 12px}
.stat-item {background: rgba(255, 255, 255, 0.03);
border-radius: 12px;
padding: 14px 10px;
text-align: center}
.stat-item .stat-label {font-size: 11px;
color: var(--text-secondary);
margin-bottom: 4px;
letter-spacing: 0.5px}
.stat-item .stat-value {font-size: 18px;
font-weight: 700;
color: var(--accent);
font-variant-numeric: tabular-nums;
font-family: 'SF Mono', 'Menlo', 'Consolas', monospace}
.scenarios {display: flex;
flex-direction: column;
gap: 10px}
.scenario {display: flex;
align-items: center;
justify-content: space-between;
padding: 14px 16px;
background: var(--card-bg);
border: 1px solid var(--border);
border-radius: 12px}
.scenario .scenario-icon {font-size: 22px;
margin-right: 10px}
.scenario .scenario-text {flex: 1;
font-size: 14px;
color: var(--text)}
.scenario .scenario-value {font-size: 18px;
font-weight: 700;
color: var(--accent);
white-space: nowrap;
font-variant-numeric: tabular-nums;
font-family: 'SF Mono', 'Menlo', 'Consolas', monospace}
.conversions {display: flex;
flex-direction: column;
gap: 10px}
.conversion {display: flex;
align-items: center;
gap: 12px;
padding: 14px 16px;
background: var(--card-bg);
border: 1px solid var(--border);
border-radius: 12px}
.conversion .conv-icon {font-size: 28px;
width: 44px;
height: 44px;
display: flex;
align-items: center;
justify-content: center;
border-radius: 12px;
flex-shrink: 0}
.conversion .conv-icon.milktea { background: var(--blue-dim); }
.conversion .conv-icon.hotpot { background: var(--red); background: rgba(239, 68, 68, 0.15); }
.conversion .conv-icon.iphone { background: var(--purple-dim); }
.conversion .conv-text {flex: 1;
font-size: 14px;
line-height: 1.5}
.conversion .conv-highlight {color: var(--accent);
font-weight: 700}
.footer {text-align: center;
padding: 12px 0;
color: var(--text-secondary);
font-size: 12px;
opacity: 0.5}
@media (max-width: 380px) {.header h1 { font-size: 24px; }
.counter-card .amount { font-size: 36px; }
.stat-item .stat-value { font-size: 16px; }}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="你的时间值多少钱">
  <meta property="og:description" content="时间价值计算器，看看你的每秒钟值多少钱">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/salary-per-second/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
  <div class="container">

    <div class="header">
      <h1>💰 你的时间值多少钱</h1>
      <div class="subtitle">输入月薪，看看你每分每秒的价值</div>
    </div>

    <div class="card">
      <div class="input-group">
        <label for="salary">月薪</label>
        <span class="prefix">¥</span>
        <input type="number" id="salary" placeholder="15000" min="0" step="100" autofocus>
        <span class="suffix">/月</span>
      </div>
    </div>

    <div class="card counter-card">
      <div class="label">💸 从打开页面开始</div>
      <div class="amount" id="realtime-counter">¥0.00</div>
      <div class="unit">你已经赚了</div>
    </div>

    <div class="card">
      <div class="breakdown" id="breakdown">
        <div class="stat-item">
          <div class="stat-label">每秒</div>
          <div class="stat-value" id="per-second">¥0.000</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">每分钟</div>
          <div class="stat-value" id="per-minute">¥0.00</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">每小时</div>
          <div class="stat-value" id="per-hour">¥0.00</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">每天</div>
          <div class="stat-value" id="per-day">¥0.00</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">每周</div>
          <div class="stat-value" id="per-week">¥0.00</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="scenarios">
        <div class="scenario">
          <span class="scenario-icon">🚽</span>
          <span class="scenario-text">拉一泡屎（5分钟）</span>
          <span class="scenario-value" id="scenario-toilet">¥0.00</span>
        </div>
        <div class="scenario">
          <span class="scenario-icon">📋</span>
          <span class="scenario-text">开一个会（1小时）</span>
          <span class="scenario-value" id="scenario-meeting">¥0.00</span>
        </div>
        <div class="scenario">
          <span class="scenario-icon">🐟</span>
          <span class="scenario-text">摸鱼一天</span>
          <span class="scenario-value" id="scenario-slacking">¥0.00</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="conversions">
        <div class="conversion">
          <div class="conv-icon milktea">🧋</div>
          <div class="conv-text">
            每赚一杯<span class="conv-highlight">奶茶（¥20）</span><br>需要工作 <span class="conv-highlight" id="conv-milktea">--</span>
          </div>
        </div>
        <div class="conversion">
          <div class="conv-icon hotpot">🍲</div>
          <div class="conv-text">
            每赚一顿<span class="conv-highlight">火锅（¥200）</span><br>需要工作 <span class="conv-highlight" id="conv-hotpot">--</span>
          </div>
        </div>
        <div class="conversion">
          <div class="conv-icon iphone">📱</div>
          <div class="conv-text">
            每赚一部<span class="conv-highlight">iPhone（¥7000）</span><br>需要工作 <span class="conv-highlight" id="conv-iphone">--</span>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">数据仅保存在本地 · 安心使用</div>
  </div>

  <script>
    (function () {
      const DAYS_PER_MONTH = 30;
      const SECONDS_PER_MONTH = DAYS_PER_MONTH * 24 * 3600;
      const MILKTEA_PRICE = 20;
      const HOTPOT_PRICE = 200;
      const IPHONE_PRICE = 7000;
      const salaryInput = document.getElementById('salary');
      const realtimeCounter = document.getElementById('realtime-counter');
      const elPerSecond = document.getElementById('per-second');
      const elPerMinute = document.getElementById('per-minute');
      const elPerHour   = document.getElementById('per-hour');
      const elPerDay    = document.getElementById('per-day');
      const elPerWeek   = document.getElementById('per-week');
      const elToilet   = document.getElementById('scenario-toilet');
      const elMeeting  = document.getElementById('scenario-meeting');
      const elSlacking = document.getElementById('scenario-slacking');
      const elMilkTea = document.getElementById('conv-milktea');
      const elHotPot  = document.getElementById('conv-hotpot');
      const elIPhone  = document.getElementById('conv-iphone');
      let salary = 0;
      let perSecond = 0;
      let pageStartTime = Date.now();
      function fmt(n) {
        if (n === 0) return '¥0.00';
        if (n < 0.01 && n > 0) return '¥' + n.toFixed(4);
        return '¥' + n.toFixed(2);
      }
      function fmtSmall(n) {
        if (n < 0.001 && n > 0) return '¥' + n.toFixed(5);
        return '¥' + n.toFixed(3);
      }
      function fmtDuration(seconds) {
        if (seconds < 60) return Math.round(seconds) + ' 秒';
        if (seconds < 3600) {
          const m = Math.floor(seconds / 60);
          const s = Math.round(seconds % 60);
          return s > 0 ? m + ' 分 ' + s + ' 秒' : m + ' 分钟';
        }
        if (seconds < 86400) {
          const h = Math.floor(seconds / 3600);
          const m = Math.round((seconds % 3600) / 60);
          return m > 0 ? h + ' 小时 ' + m + ' 分钟' : h + ' 小时';
        }
        const d = Math.floor(seconds / 86400);
        const h = Math.round((seconds % 86400) / 3600);
        return h > 0 ? d + ' 天 ' + h + ' 小时' : d + ' 天';
      }
      function updateDisplay() {
        if (salary <= 0) {
          realtimeCounter.textContent = '¥0.00';
          elPerSecond.textContent = '¥0.000';
          elPerMinute.textContent = '¥0.00';
          elPerHour.textContent   = '¥0.00';
          elPerDay.textContent    = '¥0.00';
          elPerWeek.textContent   = '¥0.00';
          elToilet.textContent   = '¥0.00';
          elMeeting.textContent  = '¥0.00';
          elSlacking.textContent = '¥0.00';
          elMilkTea.textContent = '--';
          elHotPot.textContent  = '--';
          elIPhone.textContent  = '--';
          return;
        }
        perSecond = salary / SECONDS_PER_MONTH;
        elPerSecond.textContent = fmtSmall(perSecond);
        elPerMinute.textContent = fmt(perSecond * 60);
        elPerHour.textContent   = fmt(perSecond * 3600);
        elPerDay.textContent    = fmt(perSecond * 86400);
        elPerWeek.textContent   = fmt(perSecond * 86400 * 7);
        elToilet.textContent   = fmt(perSecond * 300);
        elMeeting.textContent  = fmt(perSecond * 3600);
        elSlacking.textContent = fmt(perSecond * 86400);
        if (perSecond > 0) {
          elMilkTea.textContent = fmtDuration(MILKTEA_PRICE / perSecond);
          elHotPot.textContent  = fmtDuration(HOTPOT_PRICE / perSecond);
          elIPhone.textContent  = fmtDuration(IPHONE_PRICE / perSecond);
        }
      }
      function tick() {
        if (salary <= 0) {
          realtimeCounter.textContent = '¥0.00';
        } else {
          const elapsed = (Date.now() - pageStartTime) / 1000;
          const earned = perSecond * elapsed;
          realtimeCounter.textContent = fmt(earned);
        }
        requestAnimationFrame(tick);
      }
      function handleInput() {
        const raw = parseFloat(salaryInput.value);
        if (isNaN(raw) || raw <= 0) {
          salary = 0;
        } else {
          salary = raw;
          pageStartTime = Date.now();
        }
        if (salary > 0) {
          localStorage.setItem('salary-per-second-monthly', salary.toString());
        } else {
          localStorage.removeItem('salary-per-second-monthly');
        }
        updateDisplay();
      }
      function init() {
        const saved = localStorage.getItem('salary-per-second-monthly');
        if (saved) {
          const val = parseFloat(saved);
          if (!isNaN(val) && val > 0) {
            salaryInput.value = val;
            salary = val;
          }
        } else {
          salaryInput.value = '15000';
          salary = 15000;
        }
        updateDisplay();
        salaryInput.addEventListener('input', handleInput);
        requestAnimationFrame(tick);
      }
      init();
    })();
}
  </script>
<script src="../i18n.js" defer></script>
</body>
</html>
