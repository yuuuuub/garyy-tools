<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔊 音效生成器</title>
<meta property="og:title" content="🔊 音效生成器">
<meta property="og:description" content="🔊 音效生成器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="使用Web Audio API合成各种音效，支持12种预设音效和自定义参数调节">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔊</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--text:#f1f5f9;--text-secondary:#94a3b8;--accent:#8b5cf6;--border:#475569;--shadow:0 4px 24px rgba(0,0,0,0.3);--radius:12px;--transition:0.25s ease}
[data-theme="light"]{--bg:#f8fafc;--surface:#ffffff;--surface-2:#f1f5f9;--text:#1e293b;--text-secondary:#64748b;--accent:#8b5cf6;--border:#e2e8f0;--shadow:0 4px 24px rgba(0,0,0,0.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif,'PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;min-height:100vh;padding:16px;transition:background var(--transition),color var(--transition)}
.container{max-width:800px;width:100%;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;transition:background var(--transition),box-shadow var(--transition)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header h1{font-size:1.5rem}
.theme-toggle{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:1rem;transition:all var(--transition)}
.theme-toggle:hover{border-color:var(--accent)}
.section-title{font-size:1.1rem;font-weight:600;margin:16px 0 10px;color:var(--accent)}
.presets-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.preset-btn{background:var(--surface-2);border:2px solid var(--border);color:var(--text);border-radius:8px;padding:12px 8px;cursor:pointer;font-size:.9rem;transition:all var(--transition);text-align:center}
.preset-btn:hover,.preset-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.preset-btn .emoji{font-size:1.3rem;display:block;margin-bottom:4px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.control-group{display:flex;flex-direction:column;gap:4px}
.control-group label{font-size:.8rem;color:var(--text-secondary);display:flex;justify-content:space-between}
.control-group label span{color:var(--accent);font-weight:600}
input[type="range"]{width:100%;accent-color:var(--accent);cursor:pointer}
select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:.85rem;transition:border-color var(--transition)}
select:focus{outline:none;border-color:var(--accent)}
.waveform-canvas{width:100%;height:100px;background:var(--surface-2);border-radius:8px;margin-bottom:12px;border:1px solid var(--border)}
.action-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:.9rem;transition:all var(--transition)}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn-outline{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn-danger{background:#ef4444;border:none;color:#fff}
.btn-danger:hover{background:#dc2626}
.layers{margin-bottom:16px}
.layer-item{display:flex;align-items:center;gap:8px;padding:8px;background:var(--surface-2);border-radius:8px;margin-bottom:6px;font-size:.85rem}
.layer-item .layer-name{flex:1}
.layer-item .layer-remove{background:none;border:none;color:#ef4444;cursor:pointer;font-size:1rem}
.custom-sounds{margin-bottom:16px}
.custom-item{display:flex;align-items:center;gap:8px;padding:8px;background:var(--surface-2);border-radius:8px;margin-bottom:6px}
.custom-item .custom-name{flex:1;font-size:.85rem}
.custom-item button{background:none;border:none;cursor:pointer;font-size:.9rem;padding:4px}
.saved-list{max-height:200px;overflow-y:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .3s;z-index:100;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:600px){.presets-grid{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🔊 音效生成器</h1>
<button class="theme-toggle" id="themeToggle">🌙</button>
</div>

<h3 class="section-title">预设音效</h3>
<div class="presets-grid" id="presetsGrid"></div>

<h3 class="section-title">参数调节</h3>
<div class="controls">
<div class="control-group">
<label>频率 <span id="freqVal">440</span> Hz</label>
<input type="range" id="freqSlider" min="20" max="2000" value="440" step="1">
</div>
<div class="control-group">
<label>时长 <span id="durVal">0.5</span> 秒</label>
<input type="range" id="durSlider" min="0.1" max="3" value="0.5" step="0.1">
</div>
<div class="control-group">
<label>音量 <span id="volVal">0.5</span></label>
<input type="range" id="volSlider" min="0" max="1" value="0.5" step="0.01">
</div>
<div class="control-group">
<label>起音 <span id="atkVal">0.01</span></label>
<input type="range" id="atkSlider" min="0" max="1" value="0.01" step="0.01">
</div>
<div class="control-group">
<label>衰减 <span id="decVal">0.1</span></label>
<input type="range" id="decSlider" min="0" max="2" value="0.1" step="0.05">
</div>
<div class="control-group">
<label>音高弯曲 <span id="pbVal">0</span></label>
<input type="range" id="pbSlider" min="-1200" max="1200" value="0" step="1">
</div>
<div class="control-group">
<label>波形</label>
<select id="waveSelect">
<option value="sine">正弦波</option>
<option value="square">方波</option>
<option value="sawtooth">锯齿波</option>
<option value="triangle">三角波</option>
<option value="noise">白噪声</option>
</select>
</div>
<div class="control-group">
<label>预设参数</label>
<select id="presetParams">
<option value="">自定义</option>
</select>
</div>
</div>

<h3 class="section-title">波形可视化</h3>
<canvas class="waveform-canvas" id="waveCanvas"></canvas>

<div class="action-bar">
<button class="btn" id="playBtn">▶ 播放</button>
<button class="btn btn-outline" id="randomBtn">🎲 随机生成</button>
<button class="btn btn-outline" id="saveBtn">💾 保存自定义</button>
<button class="btn btn-outline" id="exportBtn">📤 导出JSON</button>
</div>

<h3 class="section-title">同时播放层 <span id="layerCount">(0/3)</span></h3>
<div class="layers" id="layersList"></div>

<h3 class="section-title">自定义音效库 <span id="customCount">(0/20)</span></h3>
<div class="custom-sounds saved-list" id="customList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const PRESETS = [
  {name:'爆炸',emoji:'💥',freq:80,dur:0.8,vol:0.7,atk:0.001,dec:0.5,pb:-800,wave:'noise'},
  {name:'激光',emoji:'🔫',freq:1200,dur:0.3,vol:0.6,atk:0.001,dec:0.2,pb:-1200,wave:'sawtooth'},
  {name:'电流',emoji:'⚡',freq:60,dur:0.5,vol:0.5,atk:0.01,dec:0.3,pb:0,wave:'square'},
  {name:'风声',emoji:'🌬️',freq:300,dur:2,vol:0.3,atk:0.5,dec:1,pb:50,wave:'noise'},
  {name:'雷声',emoji:'⛈️',freq:50,dur:1.5,vol:0.8,atk:0.001,dec:1.2,pb:-200,wave:'noise'},
  {name:'脚步',emoji:'👣',freq:120,dur:0.15,vol:0.5,atk:0.001,dec:0.1,pb:0,wave:'sine'},
  {name:'开门',emoji:'🚪',freq:200,dur:0.4,vol:0.4,atk:0.01,dec:0.3,pb:200,wave:'triangle'},
  {name:'玻璃碎',emoji:'💔',freq:3000,dur:0.2,vol:0.6,atk:0.001,dec:0.15,pb:-500,wave:'square'},
  {name:'水滴',emoji:'💧',freq:800,dur:0.1,vol:0.4,atk:0.001,dec:0.08,pb:600,wave:'sine'},
  {name:'鸟叫',emoji:'🐦',freq:2000,dur:0.15,vol:0.3,atk:0.001,dec:0.1,pb:400,wave:'sine'},
  {name:'警报',emoji:'🚨',freq:600,dur:1.5,vol:0.6,atk:0.01,dec:0.5,pb:300,wave:'square'},
  {name:'倒计时',emoji:'⏰',freq:1000,dur:0.2,vol:0.5,atk:0.001,dec:0.15,pb:0,wave:'sine'}
];

let audioCtx = null;
let activeLayers = [];
let activeNodes = [];
let selectedPreset = 0;
let animFrame = null;
const MAX_LAYERS = 3;
const MAX_CUSTOM = 20;

const $ = id => document.getElementById(id);
const presetsGrid = $('presetsGrid');
const waveCanvas = $('waveCanvas');
const waveCtx = waveCanvas.getContext('2d');

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// Theme
function initTheme() {
  const saved = localStorage.getItem('se-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  $('themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
}
$('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('se-theme', next);
  $('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
});
initTheme();

// Toast
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// Presets
function renderPresets() {
  presetsGrid.innerHTML = PRESETS.map((p, i) =>
    `<button class="preset-btn${i===selectedPreset?' active':''}" data-idx="${i}">
      <span class="emoji">${p.emoji}</span>${p.name}</button>`
  ).join('');
  presetsGrid.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedPreset = +btn.dataset.idx;
      applyPreset(PRESETS[selectedPreset]);
      renderPresets();
    });
  });
  // preset params dropdown
  const optHtml = PRESETS.map(p => `<option value="${p.name}">${p.emoji} ${p.name}</option>`).join('');
  $('presetParams').innerHTML = `<option value="">自定义</option>` + optHtml;
}

function applyPreset(p) {
  $('freqSlider').value = p.freq; $('freqVal').textContent = p.freq;
  $('durSlider').value = p.dur; $('durVal').textContent = p.dur;
  $('volSlider').value = p.vol; $('volVal').textContent = p.vol;
  $('atkSlider').value = p.atk; $('atkVal').textContent = p.atk;
  $('decSlider').value = p.dec; $('decVal').textContent = p.dec;
  $('pbSlider').value = p.pb; $('pbVal').textContent = p.pb;
  $('waveSelect').value = p.wave;
}

$('presetParams').addEventListener('change', e => {
  const p = PRESETS.find(pr => pr.name === e.target.value);
  if (p) { applyPreset(p); drawWaveform(); }
});

// Sliders
['freq','dur','vol','atk','dec','pb'].forEach(k => {
  const slider = $(k + 'Slider');
  const display = $(k + 'Val');
  slider.addEventListener('input', () => { display.textContent = slider.value; drawWaveform(); });
});

// Generate sound
function generateSound(params, destination) {
  const ctx = getCtx();
  const now = ctx.currentTime;
  const { freq, dur, vol, atk, dec, pb, wave } = params;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(vol, now + atk);
  gain.gain.exponentialRampToValueAtTime(0.001, now + atk + dec);
  gain.gain.linearRampToValueAtTime(vol * 0.6, now + atk + dec + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
  gain.connect(destination || ctx.destination);

  const nodes = [];

  if (wave === 'noise') {
    const bufSize = ctx.sampleRate * dur;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    if (pb !== 0) {
      src.playbackRate.setValueAtTime(1, now);
      src.playbackRate.linearRampToValueAtTime(1 + pb / 1200, now + dur);
    }
    src.connect(gain);
    src.start(now);
    src.stop(now + dur);
    nodes.push(src, gain);
  } else {
    const osc = ctx.createOscillator();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, now);
    if (pb !== 0) {
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.linearRampToValueAtTime(freq * Math.pow(2, pb / 1200), now + dur);
    }
    osc.connect(gain);
    osc.start(now);
    osc.stop(now + dur);
    nodes.push(osc, gain);
  }

  return nodes;
}

function getParams() {
  return {
    freq: +$('freqSlider').value,
    dur: +$('durSlider').value,
    vol: +$('volSlider').value,
    atk: +$('atkSlider').value,
    dec: +$('decSlider').value,
    pb: +$('pbSlider').value,
    wave: $('waveSelect').value
  };
}

// Play
function playSound() {
  const ctx = getCtx();
  if (ctx.state === 'suspended') ctx.resume();
  const params = getParams();
  const nodes = generateSound(params, ctx.destination);
  activeNodes.push(...nodes);
  startVisualization(params);

  // Layer
  if (activeLayers.length < MAX_LAYERS) {
    const name = PRESETS[selectedPreset]?.name || '自定义';
    activeLayers.push({ name, params });
    renderLayers();
  }
}

$('playBtn').addEventListener('click', playSound);

// Random
$('randomBtn').addEventListener('click', () => {
  const waves = ['sine','square','sawtooth','triangle','noise'];
  $('freqSlider').value = Math.round(20 + Math.random() * 1980);
  $('durSlider').value = +(0.1 + Math.random() * 2.9).toFixed(1);
  $('volSlider').value = +(0.1 + Math.random() * 0.9).toFixed(2);
  $('atkSlider').value = +(Math.random() * 0.3).toFixed(2);
  $('decSlider').value = +(0.05 + Math.random() * 1.5).toFixed(2);
  $('pbSlider').value = Math.round(-1200 + Math.random() * 2400);
  $('waveSelect').value = waves[Math.floor(Math.random() * waves.length)];
  ['freq','dur','vol','atk','dec','pb'].forEach(k => $(k+'Val').textContent = $(k+'Slider').value);
  drawWaveform();
  showToast('🎲 已随机生成参数');
});

// Layers
function renderLayers() {
  $('layerCount').textContent = `(${activeLayers.length}/${MAX_LAYERS})`;
  $('layersList').innerHTML = activeLayers.map((l, i) =>
    `<div class="layer-item">
      <span>${PRESETS.find(p=>p.name===l.name)?.emoji||'🎵'}</span>
      <span class="layer-name">${l.name}</span>
      <button class="layer-remove" data-idx="${i}">✕</button>
    </div>`
  ).join('');
  $('layersList').querySelectorAll('.layer-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      activeLayers.splice(+btn.dataset.idx, 1);
      renderLayers();
    });
  });
}

// Canvas visualization
function drawWaveform() {
  const W = waveCanvas.width = waveCanvas.clientWidth * 2;
  const H = waveCanvas.height = waveCanvas.clientHeight * 2;
  const params = getParams();
  waveCtx.clearRect(0, 0, W, H);
  waveCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent');
  waveCtx.lineWidth = 2;
  waveCtx.beginPath();
  for (let x = 0; x < W; x++) {
    const t = x / W;
    const dur = params.dur;
    const atk = params.atk;
    const dec = params.dec;
    let amp = 0;
    if (t < atk / dur) amp = t * dur / atk;
    else if (t < (atk + dec) / dur) amp = 1 - (t - atk / dur) * dur / dec * 0.8;
    else amp = 0.2 * Math.exp(-(t - (atk + dec) / dur) * 3);

    let y;
    if (params.wave === 'noise') {
      y = H / 2 + (Math.random() * 2 - 1) * amp * H * 0.35;
    } else {
      const freqMod = params.pb !== 0 ? params.freq * Math.pow(2, t * params.pb / 1200) : params.freq;
      const phase = t * freqMod * dur * 2 * Math.PI;
      if (params.wave === 'sine') y = H / 2 + Math.sin(phase) * amp * H * 0.35;
      else if (params.wave === 'square') y = H / 2 + (Math.sin(phase) > 0 ? 1 : -1) * amp * H * 0.35;
      else if (params.wave === 'sawtooth') y = H / 2 + ((phase % (2*Math.PI)) / Math.PI - 1) * amp * H * 0.35;
      else y = H / 2 + (1 - Math.abs((phase % (2*Math.PI)) / Math.PI - 1) * 2) * amp * H * 0.35;
    }
    x === 0 ? waveCtx.moveTo(x, y) : waveCtx.lineTo(x, y);
  }
  waveCtx.stroke();
}

let vizOsc = null;
function startVisualization(params) {
  drawWaveform();
}

// Save custom
function loadCustom() {
  try { return JSON.parse(localStorage.getItem('se-custom') || '[]'); } catch { return []; }
}
function saveCustom(list) {
  localStorage.setItem('se-custom', JSON.stringify(list));
}
function renderCustom() {
  const list = loadCustom();
  $('customCount').textContent = `(${list.length}/${MAX_CUSTOM})`;
  $('customList').innerHTML = list.map((c, i) =>
    `<div class="custom-item">
      <button class="play-custom" data-idx="${i}">▶</button>
      <span class="custom-name">${c.name}</span>
      <button class="del-custom" data-idx="${i}">🗑️</button>
    </div>`
  ).join('');

  $('customList').querySelectorAll('.play-custom').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = list[+btn.dataset.idx];
      applyPreset(c);
      drawWaveform();
      playSound();
    });
  });
  $('customList').querySelectorAll('.del-custom').forEach(btn => {
    btn.addEventListener('click', () => {
      list.splice(+btn.dataset.idx, 1);
      saveCustom(list);
      renderCustom();
      showToast('已删除');
    });
  });
}

$('saveBtn').addEventListener('click', () => {
  const list = loadCustom();
  if (list.length >= MAX_CUSTOM) { showToast('已达最大数量20个'); return; }
  const name = prompt('为音效命名：', PRESETS[selectedPreset]?.name || '自定义音效');
  if (!name) return;
  list.push({ name, ...getParams() });
  saveCustom(list);
  renderCustom();
  showToast('✅ 已保存');
});

// Export
$('exportBtn').addEventListener('click', () => {
  const data = { presets: PRESETS, custom: loadCustom() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sound-effects.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('📤 已导出');
});

// Init
renderPresets();
renderLayers();
renderCustom();
drawWaveform();
window.addEventListener('resize', drawWaveform);
</script>
</body>
</html>
