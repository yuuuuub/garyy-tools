<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="数字华容道 - 经典滑块拼图益智游戏">
    <meta name="robots" content="index, follow">
    <title>数字华容道</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="i18n.js" defer></script>
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #0984e3; --secondary-color: #636e72; --success-color: #00b894; --warning-color: #fdcb6e; --danger-color: #d63031; --border-color: #dfe6e9; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a2e; --text-color: #eee; --primary-color: #74b9ff; --secondary-color: #b2bec3; --success-color: #55efc4; --warning-color: #ffeaa7; --danger-color: #ff7675; --border-color: #444; --card-bg: #16213e; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        h1 { color: var(--primary-color); text-align: center; border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 500px; margin: 0 auto; text-align: center; }
        .card { padding: 24px; border: 1px solid var(--border-color); border-radius: 12px; background: var(--card-bg); margin-bottom: 20px; }
        .stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 16px; }
        .stat-item .num { font-size: 24px; font-weight: bold; color: var(--primary-color); }
        .stat-item .label { font-size: 12px; color: var(--secondary-color); }
        .controls { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
        .ctrl-btn { padding: 8px 16px; border: 2px solid var(--border-color); border-radius: 6px; background: var(--card-bg); color: var(--text-color); cursor: pointer; font-size: 14px; }
        .ctrl-btn.active { border-color: var(--primary-color); background: var(--primary-color); color: #fff; }
        .board { display: grid; gap: 4px; justify-content: center; margin: 16px auto; }
        .board-3 { grid-template-columns: repeat(3, 90px); }
        .board-4 { grid-template-columns: repeat(4, 80px); }
        .board-5 { grid-template-columns: repeat(5, 70px); }
        .tile { height: 80px; border-radius: 8px; border: 2px solid var(--border-color); background: var(--primary-color); color: #fff; font-size: 24px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; user-select: none; }
        .board-5 .tile { height: 70px; font-size: 20px; }
        .tile.empty { background: transparent; border-color: transparent; cursor: default; }
        .tile:not(.empty):hover { transform: scale(1.05); }
        .btn { background: var(--primary-color); color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 12px; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background: var(--secondary-color); color: #fff; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .message { font-size: 18px; font-weight: bold; margin-top: 12px; min-height: 28px; color: var(--success-color); }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>数字华容道</h1>
        <div class="card">
            <div class="stats">
                <div class="stat-item"><div class="num" id="moves">0</div><div class="label">步数</div></div>
                <div class="stat-item"><div class="num" id="timer">0s</div><div class="label">用时</div></div>
            </div>
            <div class="controls">
                <button class="ctrl-btn" onclick="setSize(3,this)">3×3</button>
                <button class="ctrl-btn active" onclick="setSize(4,this)">4×4</button>
                <button class="ctrl-btn" onclick="setSize(5,this)">5×5</button>
            </div>
            <div id="board" class="board board-4"></div>
            <div class="message" id="message"></div>
            <button class="btn" onclick="startGame()">重新开始</button>
        </div>
    </div>
    <script>
        let size = 4, grid = [], emptyPos, moves = 0, seconds = 0, timerInterval = null, started = false;

        function setSize(s, btn) {
            size = s;
            document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            startGame();
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
            return a;
        }

        function isSolvable(arr, n) {
            let inversions = 0;
            const flat = arr.filter(v => v !== 0);
            for (let i = 0; i < flat.length; i++) for (let j = i + 1; j < flat.length; j++) if (flat[i] > flat[j]) inversions++;
            if (n % 2 === 1) return inversions % 2 === 0;
            const emptyRow = Math.floor(arr.indexOf(0) / n);
            return (inversions + emptyRow) % 2 === 1;
        }

        function startGame() {
            clearInterval(timerInterval);
            moves = 0; seconds = 0; started = false;
            document.getElementById('moves').textContent = '0';
            document.getElementById('timer').textContent = '0s';
            document.getElementById('message').textContent = '';
            const board = document.getElementById('board');
            board.className = `board board-${size}`;
            let nums;
            do { nums = shuffle(Array.from({ length: size * size }, (_, i) => i)); } while (!isSolvable(nums, size));
            grid = nums;
            emptyPos = nums.indexOf(0);
            render();
            timerInterval = setInterval(() => { seconds++; document.getElementById('timer').textContent = seconds + 's'; }, 1000);
        }

        function render() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            grid.forEach((val, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile' + (val === 0 ? ' empty' : '');
                tile.textContent = val === 0 ? '' : val;
                tile.onclick = () => moveTile(i);
                board.appendChild(tile);
            });
        }

        function moveTile(i) {
            const emptyRow = Math.floor(emptyPos / size), emptyCol = emptyPos % size;
            const tileRow = Math.floor(i / size), tileCol = i % size;
            const adjacent = (Math.abs(emptyRow - tileRow) + Math.abs(emptyCol - tileCol)) === 1;
            if (!adjacent) return;
            if (!started) { started = true; }
            [grid[emptyPos], grid[i]] = [grid[i], grid[emptyPos]];
            emptyPos = i;
            moves++;
            document.getElementById('moves').textContent = moves;
            render();
            if (isWin()) {
                clearInterval(timerInterval);
                document.getElementById('message').textContent = `🎉 恭喜通关！${moves}步 ${seconds}秒`;
            }
        }

        function isWin() {
            for (let i = 0; i < size * size - 1; i++) if (grid[i] !== i + 1) return false;
            return grid[size * size - 1] === 0;
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
        }

        startGame();
    </script>
</body>
</html>
