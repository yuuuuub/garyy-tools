<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cookie管理</title>
<meta name="description" content="浏览器Cookie管理工具，查看和管理网站Cookie">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950;--red:#f85149}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vhpadding:16px;scroll-behavior:smooth;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.container{max-width:800px;margin:0 auto;padding:24px}
.btn{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px;transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--text)}
.btn-primary:hover{opacity:.9}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
.cookie-table{width:100%;border-collapse:collapse;font-size:13px}
.cookie-table th{text-align:left;padding:8px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:500}
.cookie-table td{padding:8px;border-bottom:1px solid var(--border);word-break:break-all;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cookie-table tr:hover td{background:rgba(59,130,246,.05)}
.empty{text-align:center;padding:40px;color:var(--muted)}
.add-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.add-form .full{grid-column:1/-1}
.form-input{width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none}
.form-input:focus{border-color:var(--accent)}
.form-label{font-size:13px;color:var(--muted);margin-bottom:4px;display:block}
.count-badge{background:var(--accent);color:var(--text);padding:2px 8px;border-radius:10px;font-size:12px;margin-left:8px}
@media(max-width:600px){.add-form{grid-template-columns:1fr}.cookie-table{font-size:12px}.cookie-table td,.cookie-table th{padding:6px}}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Cookie管理">
  <meta property="og:description" content="浏览器Cookie管理工具，查看和管理网站Cookie">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/cookie-manager/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="header">
<span style="font-size:28px">🍪</span>
<h1>Cookie管理</h1>
</div>
<div class="container">
<div class="toolbar">
<button class="btn" onclick="refreshCookies()">🔄 刷新</button>
<button class="btn btn-danger" onclick="clearAllCookies()">🗑️ 清除全部</button>
<button class="btn" onclick="exportCookies()">📥 导出JSON</button>
<button class="btn" onclick="toggleAddForm()">➕ 添加Cookie</button>
</div>
<div class="card" id="addForm" style="display:none">
<h2>➕ 添加Cookie</h2>
<div class="add-form">
<div><label class="form-label">名称 *</label><input class="form-input" id="cName" placeholder="cookie_name"></div>
<div><label class="form-label">值 *</label><input class="form-input" id="cValue" placeholder="cookie_value"></div>
<div><label class="form-label">过期时间</label><input class="form-input" id="cExpire" type="datetime-local"></div>
<div><label class="form-label">路径</label><input class="form-input" id="cPath" placeholder="/" value="/"></div>
<div class="full"><button class="btn btn-primary" onclick="addCookie()">保存Cookie</button></div>
</div>
</div>
<div class="card">
<h2>📋 Cookie列表 <span class="count-badge" id="cookieCount">0</span></h2>
<div id="cookieList"></div>
</div>
</div>
<script>
function refreshCookies(){
const cookies=parseCookies();
document.getElementById('cookieCount').textContent=cookies.length;
if(!cookies.length){document.getElementById('cookieList').innerHTML='<div class="empty">当前页面没有Cookie</div>';return}
let html=`<table class="cookie-table"><thead><tr><th>名称</th><th>值</th><th>操作</th></tr></thead><tbody>`;
cookies.forEach(c=>{
html+=`<tr><td title="${c.name}">${c.name}</td><td title="${c.value}">${c.value}</td><td><button class="btn btn-danger" style="padding:4px 8px;font-size:11px" onclick="deleteCookie('${c.name}')">删除</button></td></tr>`;
});
html+='</tbody></table>';
document.getElementById('cookieList').innerHTML=html;
}
function parseCookies(){
return document.cookie.split(';').filter(s=>s.trim()).map(s=>{
const idx=s.indexOf('=');
return{name:s.slice(0,idx).trim(),value:s.slice(idx+1).trim()};
});
}
function addCookie(){
const name=document.getElementById('cName').value.trim();
const value=document.getElementById('cValue').value.trim();
const expire=document.getElementById('cExpire').value;
const path=document.getElementById('cPath').value||'/';
if(!name){garyyToast('请输入Cookie名称');return}
let cookie=`${name}=${value};path=${path}`;
if(expire){cookie+=`;expires=${new Date(expire).toUTCString()}`}
document.cookie=cookie;
document.getElementById('cName').value='';
document.getElementById('cValue').value='';
document.getElementById('cExpire').value='';
refreshCookies();
}
function deleteCookie(name){
document.cookie=`${name}=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/`;
refreshCookies();
}
function clearAllCookies(){
parseCookies().forEach(c=>deleteCookie(c.name));
refreshCookies();
}
function exportCookies(){
const data=JSON.stringify(parseCookies(),null,2);
const blob=new Blob([data],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cookies.json';a.click();
}
function toggleAddForm(){
const f=document.getElementById('addForm');
f.style.display=f.style.display==='none'?'block':'none';
}
refreshCookies();
</script>
<script src="../i18n.js" defer>
document.getElementById("cName").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();refreshCookies();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
