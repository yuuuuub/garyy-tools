<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房贷计算器</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s}
.btn:hover{opacity:.85}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.result-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.result-grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-top:12px}
.stat-card{text-align:center;padding:14px;background:var(--bg);border-radius:var(--radius)}
.stat-card .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:1.15rem;font-weight:700}
.stat-card .value.gold{color:var(--gold)}
.stat-card .value.green{color:var(--green)}
.stat-card .value.red{color:var(--red)}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.compare-card{padding:16px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border)}
.compare-card h4{font-size:.9rem;margin-bottom:10px;text-align:center}
.compare-card h4.one{color:var(--blue)}
.compare-card h4.two{color:var(--gold)}
.compare-item{display:flex;justify-content:space-between;padding:6px 0;font-size:.82rem;border-bottom:1px solid var(--border)}
.compare-item:last-child{border-bottom:none}
.compare-item .cl{color:var(--text2)}
.compare-item .cr{font-weight:600}
.chart-bar-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.chart-bar-row .label{min-width:50px;font-size:.75rem;color:var(--text2)}
.chart-bar-row .bar-track{flex:1;height:16px;background:var(--bg);border-radius:4px;overflow:hidden}
.chart-bar-row .bar-fill{height:100%;border-radius:4px;transition:width .5s}
.chart-bar-row .val{min-width:60px;text-align:right;font-size:.75rem;font-weight:600}
.preset-group{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.preset-btn{padding:4px 12px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;background:var(--card);color:var(--text);cursor:pointer;transition:all .2s}
.preset-btn:hover{border-color:var(--blue);color:var(--blue)}
@media(max-width:640px){.form-row{flex-direction:column}.result-grid{grid-template-columns:1fr}.result-grid-4{grid-template-columns:1fr 1fr}.compare-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏠 房贷计算器</h1>
    <p>等额本息 vs 等额本金</p>
  </header>

  <div class="card">
    <div class="form-row">
      <div class="group">
        <label>房屋总价 (元)</label>
        <input type="number" id="totalPrice" value="3000000" min="0" step="any">
      </div>
      <div class="group">
        <label>首付比例 (%)</label>
        <input type="number" id="downPayPct" value="30" min="0" max="100" step="any">
      </div>
    </div>
    <div class="preset-group" id="downPayPresets"></div>
    <div class="form-row">
      <div class="group">
        <label>贷款利率 (%)</label>
        <input type="number" id="rate" value="4.2" min="0" max="100" step="any">
      </div>
      <div class="group">
        <label>贷款年限</label>
        <input type="number" id="years" value="30" min="1" max="50" step="1">
      </div>
    </div>
    <div class="preset-group" id="yearPresets"></div>
  </div>

  <div class="card">
    <div class="section-title">📊 贷款概览</div>
    <div class="result-grid-4" id="overviewGrid"></div>
  </div>

  <div class="card">
    <div class="section-title">📊 还款方式对比</div>
    <div class="compare-grid" id="compareGrid"></div>
  </div>

  <div class="card">
    <div class="section-title">📈 月供对比图</div>
    <div id="chartArea"></div>
  </div>
</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const totalPriceInp = $('totalPrice');
const downPayPctInp = $('downPayPct');
const rateInp = $('rate');
const yearsInp = $('years');
const overviewGrid = $('overviewGrid');
const compareGrid = $('compareGrid');
const chartArea = $('chartArea');

const downPayPresets = [20, 30, 40, 50, 60];
const yearPresets = [10, 15, 20, 25, 30];

function renderPresets(container, values, input, suffix){
  container.innerHTML = values.map(v => {
    return `<button class="preset-btn${parseFloat(input.value) === v ? ' active' : ''}" data-val="${v}">${v}${suffix}</button>`;
  }).join('');
  container.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.val;
      container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calc();
    });
  });
}

function calc(){
  const totalPrice = parseFloat(totalPriceInp.value) || 0;
  const downPct = (parseFloat(downPayPctInp.value) || 0) / 100;
  const annualRate = (parseFloat(rateInp.value) || 0) / 100;
  const n = parseInt(yearsInp.value) || 1;
  const totalMonths = n * 12;
  const monthlyRate = annualRate / 12;

  const downPayment = totalPrice * downPct;
  const loanAmount = totalPrice - downPayment;

  overviewGrid.innerHTML = `
    <div class="stat-card"><div class="label">房屋总价</div><div class="value">¥${totalPrice.toLocaleString()}</div></div>
    <div class="stat-card"><div class="label">首付金额</div><div class="value gold">¥${downPayment.toLocaleString()}</div></div>
    <div class="stat-card"><div class="label">贷款金额</div><div class="value">¥${loanAmount.toLocaleString()}</div></div>
    <div class="stat-card"><div class="label">首付比例</div><div class="value">${(downPct*100).toFixed(0)}%</div></div>
  `;

  if(loanAmount <= 0 || annualRate <= 0){
    compareGrid.innerHTML = '<div style="text-align:center;color:var(--text2);padding:20px">请输入有效数值</div>';
    chartArea.innerHTML = '';
    renderPresets($('downPayPresets'), downPayPresets, downPayPctInp, '%');
    renderPresets($('yearPresets'), yearPresets, yearsInp, '年');
    return;
  }

  // 等额本息
  const compound = Math.pow(1 + monthlyRate, totalMonths);
  const monthlyEqual = loanAmount * monthlyRate * compound / (compound - 1);
  const totalEqual = monthlyEqual * totalMonths;
  const interestEqual = totalEqual - loanAmount;

  // 等额本金
  const monthlyPrincipal = loanAmount / totalMonths;
  let totalPrincipalPayment = 0;
  let totalPrincipalInterest = 0;
  const monthlyPayments = [];
  for(let m = 1; m <= totalMonths; m++){
    const balance = loanAmount - (m - 1) * monthlyPrincipal;
    const interestPart = balance * monthlyRate;
    const payment = monthlyPrincipal + interestPart;
    totalPrincipalPayment += payment;
    totalPrincipalInterest += interestPart;
    monthlyPayments.push(payment);
  }
  const firstMonth = monthlyPayments[0] || 0;
  const lastMonth = monthlyPayments[totalMonths - 1] || 0;
  const interestPrincipal = totalPrincipalPayment - loanAmount;

  compareGrid.innerHTML = `
    <div class="compare-card">
      <h4 class="one">等额本息</h4>
      <div class="compare-item"><span class="cl">月供</span><span class="cr">¥${monthlyEqual.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
      <div class="compare-item"><span class="cl">总利息</span><span class="cr" style="color:var(--red)">¥${interestEqual.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
      <div class="compare-item"><span class="cl">总还款额</span><span class="cr">¥${totalEqual.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
      <div class="compare-item"><span class="cl">月供特点</span><span class="cr" style="font-size:.75rem;color:var(--text2)">每月固定</span></div>
    </div>
    <div class="compare-card">
      <h4 class="two">等额本金</h4>
      <div class="compare-item"><span class="cl">首月月供</span><span class="cr">¥${firstMonth.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
      <div class="compare-item"><span class="cl">末月月供</span><span class="cr">¥${lastMonth.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
      <div class="compare-item"><span class="cl">总利息</span><span class="cr" style="color:var(--green)">¥${interestPrincipal.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
      <div class="compare-item"><span class="cl">节省利息</span><span class="cr" style="color:var(--green)">¥${(interestEqual - interestPrincipal).toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
    </div>
  `;

  // 月供对比图 - 前120个月
  const displayMonths = Math.min(120, totalMonths);
  let chartHtml = '';
  for(let m = 1; m <= displayMonths; m++){
    if(m > 1 && m % 12 !== 1 && m !== displayMonths) continue;
    const eqAmount = monthlyEqual;
    const prinAmount = monthlyPayments[m - 1] || 0;
    const maxVal = Math.max(eqAmount, firstMonth);
    const eqPct = (eqAmount / maxVal * 100);
    const prinPct = (prinAmount / maxVal * 100);
    chartHtml += `<div style="font-size:.72rem;color:var(--text2);margin:2px 0">第${m}月</div>
      <div class="chart-bar-row" style="margin:1px 0">
        <div class="label" style="min-width:35px;font-size:.7rem;color:var(--blue)">本息</div>
        <div class="bar-track" style="height:10px"><div class="bar-fill" style="width:${eqPct}%;background:var(--blue);height:10px"></div></div>
        <div class="val" style="font-size:.7rem;min-width:50px">¥${eqAmount.toLocaleString('zh-CN',{minimumFractionDigits:0})}</div>
      </div>
      <div class="chart-bar-row" style="margin:1px 0">
        <div class="label" style="min-width:35px;font-size:.7rem;color:var(--gold)">本金</div>
        <div class="bar-track" style="height:10px"><div class="bar-fill" style="width:${prinPct}%;background:var(--gold);height:10px"></div></div>
        <div class="val" style="font-size:.7rem;min-width:50px">¥${prinAmount.toLocaleString('zh-CN',{minimumFractionDigits:0})}</div>
      </div>`;
  }
  if(totalMonths > 120) chartHtml += '<div style="text-align:center;font-size:.72rem;color:var(--text2);margin-top:4px">仅显示前120个月数据</div>';
  chartArea.innerHTML = chartHtml;

  renderPresets($('downPayPresets'), downPayPresets, downPayPctInp, '%');
  renderPresets($('yearPresets'), yearPresets, yearsInp, '年');
}

[totalPriceInp, downPayPctInp, rateInp, yearsInp].forEach(el => {
  el.addEventListener('input', calc);
  el.addEventListener('change', calc);
});

calc();
})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
