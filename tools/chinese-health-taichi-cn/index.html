<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.form-item{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px}
.form-item:hover{border-color:var(--accent)}
.form-item.completed{border-color:var(--success);background:rgba(34,197,94,.05)}
.form-num{width:28px;height:28px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.form-item.completed .form-num{background:var(--success);color:#fff}
.progress-bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥋</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div class="ctn">
<div class="hdr">
<h1>🥋 太极养生</h1>
<p>太极拳养生指南，二十四式简化太极拳分解教学</p>
</div>

<div class="cd" id="listView">
<h2>📜 二十四式简化太极拳</h2>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<p style="font-size:.8rem;color:var(--text2);margin-bottom:12px" id="progressText"></p>
<div id="formList"></div>
</div>

<div class="cd" id="detailView" style="display:none">
<button class="sec" onclick="showList()" style="margin-bottom:16px">← 返回列表</button>
<h2 id="detailNum"></h2>
<h3 id="detailName" style="font-size:1.3rem;margin:8px 0"></h3>
<div style="margin:16px 0">
<h4 style="font-size:.9rem;margin-bottom:8px;color:var(--accent)">📖 动作描述</h4>
<p id="detailDesc" style="padding:12px;background:var(--bg);border-radius:8px;line-height:1.6"></p>
</div>
<div style="margin:16px 0">
<h4 style="font-size:.9rem;margin-bottom:8px;color:var(--success)">✅ 要点提示</h4>
<div id="detailPoints"></div>
</div>
<div style="margin:16px 0">
<h4 style="font-size:.9rem;margin-bottom:8px;color:var(--danger)">⚠️ 常见错误</h4>
<div id="detailMistakes"></div>
</div>
<div style="margin:16px 0">
<h4 style="font-size:.9rem;margin-bottom:8px;color:var(--warn)">🌬️ 呼吸要领</h4>
<p id="detailBreath" style="padding:12px;background:var(--bg);border-radius:8px"></p>
</div>
<div style="display:flex;gap:8px;margin-top:16px">
<button onclick="toggleLearned()" id="learnBtn">标记为已学</button>
<button class="sec" onclick="nextForm()">下一式 →</button>
</div>
</div>

<div class="cd" id="practiceView" style="display:none">
<h2>🎯 练习模式</h2>
<p style="color:var(--text2);margin-bottom:12px">选择要练习的招式：</p>
<div id="practiceSelect"></div>
<div style="margin-top:16px;text-align:center">
<button onclick="startPracticeSession()">开始练习</button>
</div>
</div>

<div class="cd" id="sessionView" style="display:none">
<h2>🧘 练习中</h2>
<p id="sessionForm" style="font-size:1.2rem;font-weight:600;color:var(--accent);text-align:center;margin:16px 0"></p>
<p id="sessionDesc" style="text-align:center;color:var(--text2);margin-bottom:16px"></p>
<p id="sessionTimer" style="text-align:center;font-size:2rem;font-weight:700;margin:16px 0"></p>
<div style="display:flex;gap:8px;justify-content:center">
<button onclick="sessionPrev()">上一式</button>
<button onclick="sessionNext()">下一式</button>
</div>
<div style="text-align:center;margin-top:12px">
<button class="sec" onclick="endSession()">结束练习</button>
</div>
</div>

<div class="cd" id="historyView" style="display:none">
<h2>📊 练习历史</h2>
<div id="historyStats" style="display:flex;gap:12px;margin-bottom:16px"></div>
<div id="historyList"></div>
</div>

<div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
<button class="sec" onclick="showView('listView')">📜 招式</button>
<button class="sec" onclick="showView('practiceView')">🎯 练习</button>
<button class="sec" onclick="showView('historyView')">📊 历史</button>
</div>
</div>

<script>
const FORMS = [
  {name:'起势',desc:'两脚开立，与肩同宽，两臂慢慢向前举起，屈膝按掌。身体保持中正，呼吸自然。',points:['身体中正安舒','两臂抬起时吸气','屈膝按掌时呼气','动作轻柔缓慢'],mistakes:['身体前倾后仰','手臂抬得过高','膝盖超过脚尖','动作僵硬不柔和'],breath:'起势时吸气，按掌时呼气，呼吸要深长均匀。'},
  {name:'野马分鬃',desc:'左野马分鬃：抱球收脚，转体迈步，弓步分掌。右野马分鬃动作相同方向相反。',points:['转体时以腰为轴','分掌时两手要有掤劲','弓步时前腿屈膝后腿蹬直','眼神跟随上手'],mistakes:['转体时身体歪斜','分掌时手臂伸得过直','弓步不够深','上下肢不协调'],breath:'抱球时吸气，分掌时呼气，弓步到位时呼气完毕。'},
  {name:'白鹤亮翅',desc:'跟步抱球，后坐转体，虚步分手。右手上提至额前，左手下按至左胯旁。',points:['分手时要有上下对拉之意','虚步时重心在后腿','身体保持中正','动作要舒展大方'],mistakes:['身体偏向一侧','虚步重心不稳','手臂动作生硬','含胸过度'],breath:'跟步抱球吸气，分手亮翅呼气，动作完成时气沉丹田。'},
  {name:'搂膝拗步',desc:'转体落手，收脚举臂，弓步搂推。一手搂膝前推，另一手从耳侧向前推出。',points:['转体时以腰带手','搂膝手经过膝盖前方','推掌时力达掌根','弓步与推掌同时到位'],mistakes:['搂膝手离身体太远','推掌时耸肩','弓步方向不正','动作脱节'],breath:'收脚举臂吸气，搂膝推掌呼气，推出时气贯掌心。'},
  {name:'手挥琵琶',desc:'跟步展臂，后坐挑掌，虚步合臂。两手前后如抱琵琶状，前后手要有呼应。',points:['后坐时重心稳定','挑掌与合臂协调','虚步脚尖点地','两臂要有掤劲'],mistakes:['身体后仰','两臂僵直','重心不稳','动作不到位'],breath:'跟步展臂吸气，后坐合臂呼气，定式时气沉丹田。'},
  {name:'倒卷肱',desc:'转体撤手，退步卷肱，虚步推掌。连续退步，两手交替前后推收。',points:['退步时脚尖先着地','转体以腰为轴','推掌力达掌根','退步与推掌协调'],mistakes:['退步时身体摇晃','转体幅度过大','推掌无力','动作不连贯'],breath:'撤手时吸气，推掌时呼气，退步时呼吸自然。'},
  {name:'左揽雀尾',desc:'掤：转体掤臂；捋：转体捋手；挤：转体前挤；按：后坐按掌。揽雀尾包含太极四正手。',points:['掤臂要有向外的掤劲','捋手要借力打力','挤手要合力向前','按掌要松沉有力'],mistakes:['四个动作脱节','掤劲不足','捋手方向错误','按掌时耸肩'],breath:'掤时吸气，捋时呼气，挤时吸气，按时呼气，呼吸与动作紧密配合。'},
  {name:'右揽雀尾',desc:'与左揽雀尾动作相同，方向相反。同样包含掤、捋、挤、按四个基本手法。',points:['与左揽雀尾要领相同','注意方向转换的协调','保持身体中正','四正手要清晰分明'],mistakes:['与左式常见错误相同','左右不对称','转换时身体歪斜','动作不到位'],breath:'与左揽雀尾呼吸方法相同，注意方向转换时呼吸的连贯性。'},
  {name:'单鞭',desc:'转体勾手，收脚转体，弓步推掌。一手成勾手，另一手向前推出。',points:['勾手时五指捏拢','转体以腰为轴','推掌时力达掌根','弓步方向要正'],mistakes:['勾手动作不规范','转体时身体倾斜','弓步与推掌不协调','动作僵硬'],breath:'转体勾手吸气，弓步推掌呼气，推掌到位时气贯掌心。'},
  {name:'云手',desc:'转体扣脚，收脚翻掌，开步云手。两手在体前交替划圆，如行云流水。',points:['以腰为轴带动手臂','两手交替运行','步法轻灵','动作连贯圆活'],mistakes:['手臂动作与腰脱节','两手同时运动','步法沉重','动作生硬'],breath:'云手时呼吸自然，一般一手升时吸气，一手降时呼气。'},
  {name:'单鞭',desc:'与前单鞭动作相同，作为云手后的衔接动作。',points:['与前单鞭要领相同','注意从云手过渡的协调','保持动作连贯','勾手推掌清晰'],mistakes:['过渡动作不自然','勾手推掌不清晰','身体歪斜','动作脱节'],breath:'与前单鞭呼吸方法相同。'},
  {name:'高探马',desc:'跟步翻掌，虚步推掌。身体微转，一手前探，一手收于腰间。',points:['跟步要轻灵','虚步重心稳定','推掌有力','身体保持中正'],mistakes:['跟步过重','虚步不稳','推掌无力','身体前倾'],breath:'跟步翻掌吸气，虚步推掌呼气。'},
  {name:'右蹬脚',desc:'穿掌交叉，分手蹬脚。两手分开，右脚向前蹬出，力达脚跟。',points:['蹬脚前要稳定重心','蹬脚力达脚跟','分手与蹬脚同时','身体保持平衡'],mistakes:['蹬脚方向不正','重心不稳','分手与蹬脚不协调','蹬脚无力'],breath:'穿掌交叉吸气，分手蹬脚呼气，蹬脚时呼气发力。'},
  {name:'双峰贯耳',desc:'落脚收拳，弓步贯拳。两拳从两侧向前方弧形贯击，拳眼斜向下。',points:['贯拳走弧形路线','弓步时前腿屈膝','两拳同时到位','力达拳面'],mistakes:['贯拳走直线','弓步方向不正','两拳不同时','耸肩僵硬'],breath:'落脚收拳吸气，弓步贯拳呼气。'},
  {name:'转身左蹬脚',desc:'转体分手，收脚蹬脚。身体左转，左脚向前蹬出。',points:['转体以脚跟为轴','蹬脚力达脚跟','分手与蹬脚协调','保持身体平衡'],mistakes:['转体不稳','蹬脚方向偏','分手不协调','身体歪斜'],breath:'转体分手吸气，蹬脚时呼气。'},
  {name:'左下势独立',desc:'收脚勾手，仆步穿掌，弓步挑掌，提膝挑掌。身体下沉成仆步，然后起身独立。',points:['仆步要低','穿掌贴地而行','独立时提膝要高','动作要连贯'],mistakes:['仆步不够低','穿掌离地太高','独立时晃动','动作脱节'],breath:'仆步时呼气，起身独立时吸气。'},
  {name:'右下势独立',desc:'与左下势独立动作相同，方向相反。',points:['与左式要领相同','注意方向转换','仆步穿掌要到位','独立要稳定'],mistakes:['与左式常见错误相同','左右不对称','转换不自然','重心不稳'],breath:'与左下势独立呼吸方法相同。'},
  {name:'左右穿梭',desc:'落脚翻掌，收脚抱球，弓步架推。两手交替向上架推，如穿梭织布。',points:['架掌要有向上掤劲','推掌力达掌根','弓步方向45度','动作要协调'],mistakes:['架掌无力','推掌方向不正','弓步角度不对','上下不协调'],breath:'收脚抱球吸气，弓步架推呼气。'},
  {name:'海底针',desc:'跟步落手，虚步插掌。身体前俯，一手向前下方插出，如探海底。',points:['身体前俯适度','插掌方向斜向下','虚步要稳','动作要舒展'],mistakes:['身体过度前俯','插掌方向不正','虚步不稳','低头弯腰'],breath:'跟步落手吸气，虚步插掌呼气。'},
  {name:'闪通臂',desc:'收脚举臂，弓步推掌。一手上架，另一手向前推出，如闪通背部。',points:['架掌要有掤劲','推掌力达掌根','弓步要深','身体保持中正'],mistakes:['架掌无力','推掌耸肩','弓步不够深','身体歪斜'],breath:'收脚举臂吸气，弓步推掌呼气。'},
  {name:'转身搬拦捶',desc:'转体搬拳，收脚拦掌，弓步冲拳。包含搬、拦、捶三个连续动作。',points:['搬拳走弧形','拦掌要有拦截之意','冲拳力达拳面','三个动作连贯'],mistakes:['搬拳走直线','拦掌无力','冲拳不正','动作脱节'],breath:'转体搬拳吸气，拦掌呼气，冲拳时短促呼气。'},
  {name:'如封似闭',desc:'穿掌翻掌，后坐收掌，弓步按掌。两手回收后再向前按出，如封闭门户。',points:['后坐时重心稳定','收掌要有引化之意','按掌要松沉有力','动作要连贯'],mistakes:['后坐时身体后仰','收掌无力','按掌耸肩','动作不协调'],breath:'穿掌翻掌吸气，后坐收掌呼气，弓步按掌再呼气。'},
  {name:'十字手',desc:'转体分手，收脚合抱。两手在胸前交叉成十字，如怀抱太极。',points:['分手时以腰为轴','合抱要有掤劲','身体中正安舒','呼吸自然'],mistakes:['分手时身体歪斜','合抱无力','动作僵硬','呼吸紊乱'],breath:'分手时吸气，合抱时呼气，定式时气沉丹田。'},
  {name:'收势',desc:'翻掌分手，两臂慢慢下落，收脚并立。全身放松，气息归元。',points:['两臂下落要缓慢','全身逐渐放松','呼吸自然均匀','意念收回丹田'],mistakes:['动作过快','身体紧张','呼吸急促','草草收场'],breath:'翻掌分手吸气，两臂下落呼气，最后气沉丹田，归于平静。'}
];

let learnedForms=JSON.parse(localStorage.getItem('taichi_learned')||'[]');
let sessionHistory=JSON.parse(localStorage.getItem('taichi_history')||'[]');
let sessionState=null;
let sessionTimer=null;
let selectedForms=new Set();

function showView(id){
  ['listView','detailView','practiceView','sessionView','historyView'].forEach(v=>document.getElementById(v).style.display='none');
  document.getElementById(id).style.display='block';
  if(id==='historyView') renderHistory();
  if(id==='practiceView') renderPracticeSelect();
}

function renderForms(){
  const el=document.getElementById('formList');
  el.innerHTML=FORMS.map((f,i)=>`
    <div class="form-item ${learnedForms.includes(i)?'completed':''}" onclick="showDetail(${i})">
      <div class="form-num">${learnedForms.includes(i)?'✓':i+1}</div>
      <div><strong>${f.name}</strong></div>
    </div>
  `).join('');
  const pct=Math.round(learnedForms.length/FORMS.length*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=`已学习 ${learnedForms.length}/${FORMS.length} 式 (${pct}%)`;
}

function showDetail(idx){
  const f=FORMS[idx];
  document.getElementById('detailNum').textContent=`第${idx+1}式`;
  document.getElementById('detailName').textContent=f.name;
  document.getElementById('detailDesc').textContent=f.desc;
  document.getElementById('detailPoints').innerHTML=f.points.map(p=>`<div style="padding:6px 12px;background:var(--bg);border-radius:6px;margin-bottom:4px;font-size:.85rem">✓ ${p}</div>`).join('');
  document.getElementById('detailMistakes').innerHTML=f.mistakes.map(m=>`<div style="padding:6px 12px;background:var(--bg);border-radius:6px;margin-bottom:4px;font-size:.85rem">✗ ${m}</div>`).join('');
  document.getElementById('detailBreath').textContent=f.breath;
  document.getElementById('learnBtn').textContent=learnedForms.includes(idx)?'取消已学标记':'标记为已学';
  document.getElementById('learnBtn').dataset.idx=idx;
  showView('detailView');
}

function showList(){showView('listView');}

function nextForm(){
  const idx=parseInt(document.getElementById('learnBtn').dataset.idx);
  if(idx<FORMS.length-1) showDetail(idx+1);
}

function toggleLearned(){
  const idx=parseInt(document.getElementById('learnBtn').dataset.idx);
  if(learnedForms.includes(idx)){
    learnedForms=learnedForms.filter(i=>i!==idx);
  } else {
    learnedForms.push(idx);
  }
  localStorage.setItem('taichi_learned',JSON.stringify(learnedForms));
  document.getElementById('learnBtn').textContent=learnedForms.includes(idx)?'取消已学标记':'标记为已学';
  renderForms();
}

function renderPracticeSelect(){
  const el=document.getElementById('practiceSelect');
  el.innerHTML=FORMS.map((f,i)=>`
    <label style="display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:6px;margin-bottom:4px;cursor:pointer">
      <input type="checkbox" ${selectedForms.has(i)?'checked':''} onchange="toggleForm(${i})">
      <span>${i+1}. ${f.name}</span>
    </label>
  `).join('');
}

function toggleForm(i){
  if(selectedForms.has(i)) selectedForms.delete(i); else selectedForms.add(i);
}

function startPracticeSession(){
  const forms=[...selectedForms].sort((a,b)=>a-b).map(i=>FORMS[i]);
  if(!forms.length){alert('请至少选择一式');return;}
  sessionState={forms,current:0,seconds:0};
  document.getElementById('sessionForm').textContent=forms[0].name;
  document.getElementById('sessionDesc').textContent=forms[0].desc;
  showView('sessionView');
  if(sessionTimer) clearInterval(sessionTimer);
  sessionTimer=setInterval(()=>{
    sessionState.seconds++;
    const m=Math.floor(sessionState.seconds/60);
    const s=sessionState.seconds%60;
    document.getElementById('sessionTimer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  },1000);
}

function sessionNext(){
  if(!sessionState||sessionState.current>=sessionState.forms.length-1) return;
  sessionState.current++;
  updateSession();
}

function sessionPrev(){
  if(!sessionState||sessionState.current<=0) return;
  sessionState.current--;
  updateSession();
}

function updateSession(){
  const f=sessionState.forms[sessionState.current];
  document.getElementById('sessionForm').textContent=f.name;
  document.getElementById('sessionDesc').textContent=f.desc;
}

function endSession(){
  if(sessionTimer) clearInterval(sessionTimer);
  sessionHistory.push({
    date:new Date().toISOString(),
    forms:sessionState.forms.map(f=>f.name),
    duration:sessionState.seconds
  });
  localStorage.setItem('taichi_history',JSON.stringify(sessionHistory));
  sessionState=null;
  showView('listView');
  alert('练习已记录！');
}

function renderHistory(){
  const total=sessionHistory.length;
  const totalMin=Math.round(sessionHistory.reduce((a,b)=>a+b.duration,0)/60);
  document.getElementById('historyStats').innerHTML=`
    <div style="flex:1;text-align:center;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${total}</div>
      <div style="font-size:.8rem;color:var(--text2)">练习次数</div>
    </div>
    <div style="flex:1;text-align:center;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:1.5rem;font-weight:700;color:var(--success)">${totalMin}</div>
      <div style="font-size:.8rem;color:var(--text2)">总分钟</div>
    </div>
    <div style="flex:1;text-align:center;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:1.5rem;font-weight:700;color:var(--warn)">${learnedForms.length}/24</div>
      <div style="font-size:.8rem;color:var(--text2)">已学招式</div>
    </div>
  `;
  document.getElementById('historyList').innerHTML=sessionHistory.length?sessionHistory.slice(-10).reverse().map(h=>`
    <div class="li">
      <div><strong>${h.forms.join(' → ')}</strong><br><span style="color:var(--text2);font-size:.8rem">${new Date(h.date).toLocaleDateString('zh-CN')}</span></div>
      <span class="tag s">${Math.round(h.duration/60)}分钟</span>
    </div>
  `).join(''):'<div class="empty">暂无练习记录</div>';
}

renderForms();
</script>
</body>
</html>
