<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 闪卡制作器</title>
<meta property="og:title" content="📝 闪卡制作器">
<meta property="og:description" content="📝 闪卡制作器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="闪卡制作器 - 创建、学习和管理记忆闪卡，支持正反面翻转和分组管理">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}
.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.card-flip{perspective:1000px;min-height:200px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
.card-flip .inner{position:relative;width:100%;min-height:200px;transition:transform .6s;transform-style:preserve-3d}
.card-flip.flipped .inner{transform:rotateY(180deg)}
.card-flip .front,.card-flip .back{position:absolute;width:100%;min-height:200px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:20px;border-radius:8px}
.card-flip .back{transform:rotateY(180deg)}
.card-flip .front{background:var(--bg);border:2px solid var(--accent)}
.card-flip .back{background:var(--accent);color:#fff}
.hidden{display:none}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid var(--border);padding-bottom:0}
.tabs button{background:none;border:none;color:var(--text2);padding:8px 16px;border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:600}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📝 闪卡制作器</h1><p>创建学习闪卡，支持翻转记忆和分组管理</p></div>

<div class="tabs">
<button class="active" onclick="switchTab('create')">创建</button>
<button onclick="switchTab('study')">学习</button>
<button onclick="switchTab('manage')">管理</button>
</div>

<div id="tab-create">
<div class="cd">
<h2>创建新闪卡</h2>
<label>分组</label>
<input type="text" id="group" placeholder="例如：英语单词、数学公式">
<label>正面（问题）</label>
<textarea id="front" placeholder="输入正面内容"></textarea>
<label>背面（答案）</label>
<textarea id="back" placeholder="输入背面内容"></textarea>
<div class="bg">
<button onclick="addCard()">添加闪卡</button>
<button class="sec" onclick="exportCards()">导出JSON</button>
</div>
</div>
<div class="cd">
<h2>批量导入</h2>
<label>格式：正面---背面（每行一张）</label>
<textarea id="bulkImport" placeholder="apple---苹果\nbook---书\npen---钢笔"></textarea>
<button onclick="bulkAdd()">批量导入</button>
</div>
</div>

<div id="tab-study" class="hidden">
<div class="cd">
<h2>选择分组</h2>
<select id="studyGroup" onchange="loadStudyGroup()">
<option value="">全部闪卡</option>
</select>
<button onclick="startStudy()" style="margin-top:8px">开始学习</button>
</div>
<div id="studyArea" class="hidden">
<div class="cd">
<div class="gr" style="margin-bottom:16px">
<div class="st"><div class="nm" id="studyTotal">0</div><div class="lb">总数</div></div>
<div class="st"><div class="nm" id="studyDone">0</div><div class="lb">已学</div></div>
<div class="st"><div class="nm" id="studyRemain">0</div><div class="lb">剩余</div></div>
</div>
<div class="card-flip" id="flipCard" onclick="flipStudy()">
<div class="inner">
<div class="front" id="studyFront"><p id="studyQ" style="font-size:1.2rem;text-align:center"></p></div>
<div class="back" id="studyBack"><p id="studyA" style="font-size:1.2rem;text-align:center"></p></div>
</div>
</div>
<p style="text-align:center;color:var(--text2);margin:12px 0" id="studyHint">点击卡片翻转查看答案</p>
<div style="text-align:center;color:var(--text2);margin-bottom:12px" id="studyProgress">1 / 1</div>
<div class="bg" style="justify-content:center">
<button class="sec" onclick="prevStudy()">← 上一张</button>
<button onclick="nextStudy()">下一张 →</button>
<button class="dng" style="padding:6px 12px" onclick="shuffleStudy()">🔀 随机</button>
</div>
</div>
</div>
</div>

<div id="tab-manage" class="hidden">
<div class="cd">
<h2>所有闪卡 (<span id="totalCards">0</span>张)</h2>
<select id="filterGroup" onchange="renderList()" style="margin-bottom:8px">
<option value="">全部分组</option>
</select>
<div id="cardList" class="es">暂无闪卡</div>
</div>
<div class="bg"><button class="dng" onclick="clearAll()">清空全部</button></div>
</div>
</div>

<script>
let cards=[],studyList=[],studyIdx=0,isFlipped=false;
function $(id){return document.getElementById(id)}
function load(){try{return JSON.parse(localStorage.getItem('flashcard-maker-data'))||[]}catch(e){return[]}}
function save(){localStorage.setItem('flashcard-maker-data',JSON.stringify(cards))}
cards=load();

function switchTab(t){
  ['create','study','manage'].forEach(n=>$('tab-'+n).classList.toggle('hidden',n!==t));
  document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',['create','study','manage'][i]===t));
  if(t==='study')updateGroupSelect();
  if(t==='manage')renderList();
}

function addCard(){
  const g=$('group').value.trim()||'默认',f=$('front').value.trim(),b=$('back').value.trim();
  if(!f||!b)return alert('请填写正面和背面');
  cards.push({group:g,front:f,back:b,created:Date.now()});
  save();$('front').value='';$('back').value='';alert('添加成功');
}

function bulkAdd(){
  const lines=$('bulkImport').value.trim().split('\n').filter(l=>l.includes('---'));
  if(!lines.length)return alert('格式错误，请每行用---分隔');
  const g=$('group').value.trim()||'默认';
  lines.forEach(l=>{const[p,q]=l.split('---');cards.push({group:g,front:p.trim(),back:q.trim(),created:Date.now()})});
  save();$('bulkImport').value='';alert('批量导入'+lines.length+'张');
}

function exportCards(){
  const blob=new Blob([JSON.stringify(cards,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='flashcards.json';a.click();
}

function updateGroupSelect(){
  const groups=[...new Set(cards.map(c=>c.group))];
  ['studyGroup','filterGroup'].forEach(id=>{
    const el=$(id);el.innerHTML='<option value="">全部闪卡</option>';
    groups.forEach(g=>{el.innerHTML+='<option value="'+g+'">'+g+' ('+cards.filter(c=>c.group===g).length+')</option>'});
  });
}

function loadStudyGroup(){startStudy()}
function startStudy(){
  const g=$('studyGroup').value;
  studyList=g?cards.filter(c=>c.group===g):[...cards];
  if(!studyList.length)return alert('没有闪卡可学习');
  studyIdx=0;isFlipped=false;$('studyArea').classList.remove('hidden');showStudy();
}
function showStudy(){
  const c=studyList[studyIdx];
  $('studyQ').textContent=c.front;$('studyA').textContent=c.back;
  $('studyProgress').textContent=(studyIdx+1)+' / '+studyList.length;
  $('studyTotal').textContent=studyList.length;$('studyDone').textContent=studyIdx;$('studyRemain').textContent=studyList.length-studyIdx;
  $('flipCard').classList.remove('flipped');$('studyHint').textContent='点击卡片翻转查看答案';isFlipped=false;
}
function flipStudy(){isFlipped=!isFlipped;$('flipCard').classList.toggle('flipped');$('studyHint').textContent=isFlipped?'点击翻回正面':'点击查看答案'}
function nextStudy(){if(studyIdx<studyList.length-1){studyIdx++;showStudy()}}
function prevStudy(){if(studyIdx>0){studyIdx--;showStudy()}}
function shuffleStudy(){studyList.sort(()=>Math.random()-.5);studyIdx=0;showStudy()}

function renderList(){
  const g=$('filterGroup').value;
  const list=g?cards.filter(c=>c.group===g):cards;
  $('totalCards').textContent=cards.length;
  const el=$('cardList');
  if(!list.length){el.innerHTML='<div class="es">暂无闪卡</div>';return}
  el.innerHTML=list.map((c,i)=>{
    const idx=cards.indexOf(c);
    return '<div class="li"><div><span class="tag">'+c.group+'</span> '+c.front.substring(0,30)+(c.front.length>30?'...':'')+' → '+c.back.substring(0,20)+'</div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="cards.splice('+idx+',1);save();renderList()">删除</button></div>';
  }).join('');
}

function clearAll(){if(confirm('确定清空所有闪卡？')){cards=[];save();renderList()}}
renderList();updateGroupSelect();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
