ding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.name-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}.name-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:transform .2s}.name-item:hover{transform:translateY(-2px)}.name-value{font-size:1.5rem;font-weight:700;color:var(--blue);margin-bottom:8px}.name-pinyin{font-size:.85rem;color:var(--text2);margin-bottom:4px}.name-meaning{font-size:.9rem;color:var(--text)}

<div class="container"><h1>👨‍👩‍👧‍👦 中文名字生成器</h1><p class="sub">在线生成中文名字</p>
<div class="card">
<div class="input-group">
<label>姓氏</label>
<select id="surname">
<option value="">随机姓氏</option>
<option value="王">王</option>
<option value="李">李</option>
<option value="张">张</option>
<option value="刘">刘</option>
<option value="陈">陈</option>
<option value="杨">杨</option>
<option value="赵">赵</option>
<option value="黄">黄</option>
<option value="周">周</option>
<option value="吴">吴</option>
<option value="徐">徐</option>
<option value="孙">孙</option>
<option value="胡">胡</option>
<option value="朱">朱</option>
<option value="高">高</option>
<option value="林">林</option>
<option value="何">何</option>
<option value="郭">郭</option>
<option value="马">马</option>
<option value="罗">罗</option>
</select>
</div>
<div class="input-group">
<label>性别</label>
<select id="gender">
<option value="male">男</option>
<option value="female">女</option>
<option value="neutral">中性</option>
</select>
</div>
<div class="input-group">
<label>生成数量</label>
<input type="number" id="count" value="10" min="1" max="50">
</div>
<div class="input-group">
<label>名字风格</label>
<select id="style">
<option value="classic">古典</option>
<option value="modern">现代</option>
<option value="literary">文艺</option>
<option value="nature">自然</option>
</select>
</div>
<button class="btn" onclick="generateNames()">生成名字</button>
</div>
<div class="name-grid" id="nameGrid"></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var surnames=['王','李','张','刘','陈','杨','赵','黄','周','吴','徐','孙','胡','朱','高','林','何','郭','马','罗'];
var maleNames={
  classic:['伟','强','磊','军','勇','杰','涛','明','超','华','建国','建军','志强','志明','文博'],
  modern:['子轩','浩然','宇航','晨曦','天佑','俊杰','子涵','明轩','浩宇','鑫鹏','瑞霖','致远','烨磊','晟睿','天翔'],
  literary:['墨轩','书涵','文昊','思远','致远','明哲','嘉懿','煜城','懿轩','烨伟'],
  nature:['林峰','山泉','海涛','云飞','风华','星辰','雨泽','天宇','浩然','正豪']
};
var femaleNames={
  classic:['芳','娟','英','华','敏','静','丽','强','磊','洋','秀英','淑华','玉兰','桂花','凤英'],
  modern:['子萱','欣怡','紫萱','雨桐','梓涵','诗涵','可馨','梦洁','婧怡','雅楠','心怡','语嫣','若曦','雨薇','思颖'],
  literary:['诗韵','雨薇','若兰','清雅','梦琪','雅琴','婉清','静姝','思雨','语嫣'],
  nature:['花香','雨荷','雪梅','春兰','秋菊','夏荷','冬梅','晓月','清风','白云']
};
var neutralNames=['子轩','子涵','子墨','子睿','子安','子宁','子恒','子谦','子昂','子扬'];
function generateNames(){
  var surname=document.getElementById('surname').value||surnames[Math.floor(Math.random()*surnames.length)];
  var gender=document.getElementById('gender').value;
  var count=parseInt(document.getElementById('count').value)||10;
  var style=document.getElementById('style').value;
  var names=[];
  var namePool;
  if(gender==='male'){namePool=maleNames[style];}
  else if(gender==='female'){namePool=femaleNames[style];}
  else{namePool=neutralNames;}
  for(var i=0;i<count;i++){
    var name=namePool[Math.floor(Math.random()*namePool.length)];
    names.push({surname:surname,name:name,full:surname+name});
  }
  renderNames(names);
}
function renderNames(names){
  var grid=document.getElementById('nameGrid');
  var html='';
  names.forEach(function(name){
    html+='<div class="name-item" onclick="copyName(\''+name.full+'\')">';
    html+='<div class="name-value">'+name.full+'</div>';
    html+='<div class="name-pinyin">'+getPinyin(name.full)+'</div>';
    html+='<div class="name-meaning">'+getNameMeaning(name.name)+'</div>';
    html+='</div>';
  });
  grid.innerHTML=html;
}
function getPinyin(name){
  var pinyinMap={'王':'wang','李':'li','张':'zhang','刘':'liu','陈':'chen','杨':'yang','赵':'zhao','黄':'huang','周':'zhou','吴':'wu','徐':'xu','孙':'sun','胡':'hu','朱':'zhu','高':'gao','林':'lin','何':'he','郭':'guo','马':'ma','罗':'luo'};
  var result='';
  for(var i=0;i<name.length;i++){
    if(pinyinMap[name[i]]){result+=pinyinMap[name[i]]+' ';}
    else{result+=name[i]+' ';}
  }
  return result.trim();
}
function getNameMeaning(name){
  var meanings={
    '伟':'伟大','强':'强大','磊':'光明磊落','军':'军人','勇':'勇敢','杰':'杰出','涛':'波涛','明':'光明','超':'超越','华':'中华',
    '子':'有学问的人','轩':'气宇轩昂','浩':'浩大','然':'自然','宇':'宇宙','航':'航行','晨':'早晨','曦':'阳光','佑':'保佑','俊':'俊俏',
    '墨':'文墨','书':'书籍','涵':'涵养','文':'文化','思':'思考','致':'达到','哲':'哲学','嘉':'美好','懿':'美好','煜':'照耀',
    '林':'森林','山':'山峰','泉':'泉水','海':'大海','云':'云彩','风':'风华','星':'星辰','雨':'雨水','天':'天空','正':'正直',
    '芳':'芬芳','娟':'美好','英':'英才','华':'华丽','敏':'敏捷','静':'安静','丽':'美丽','秀':'优秀','淑':'淑女','玉':'玉石',
    '萱':'萱草','怡':'快乐','紫':'紫色','桐':'梧桐','梓':'梓树','诗':'诗歌','馨':'温馨','洁':'纯洁','婧':'美好','雅':'优雅',
    '韵':'韵味','薇':'蔷薇','兰':'兰花','清':'清澈','雅':'优雅','琪':'美玉','琴':'琴棋书画','婉':'温婉','姝':'美好','雨':'雨水',
    '花':'花朵','香':'香气','荷':'荷花','雪':'白雪','梅':'梅花','春':'春天','菊':'菊花','夏':'夏天','冬':'冬天','晓':'清晨'
  };
  var meaning='';
  for(var i=0;i<name.length;i++){
    if(meanings[name[i]]){meaning+=meanings[name[i]]+' ';}
  }
  return meaning.trim()||'美好寓意';
}
function copyName(name){
  navigator.clipboard.writeText(name).then(function(){alert('已复制: '+name);}).catch(function(){alert('复制失败');});
}
generateNames();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
