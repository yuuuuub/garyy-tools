var fallbackAnalysis={
imagery:['明月','山水','花鸟','清风','流水'],
rhetoric:['比喻','拟人','对仗','借景抒情'],
emotion:'含蓄深沉的情感表达',
features:['意境深远','语言凝练','情景交融','韵味悠长']
};

function loadExample(idx){
document.getElementById('poemInput').value=examples[idx].text;
}

function analyzePoem(){
var text=document.getElementById('poemInput').value.trim();
var mode=document.getElementById('analysisMode').value;
if(!text){alert('请输入古诗内容');return;}

var lines=text.split('\n').filter(function(l){return l.trim();});
var title='未知';
var author='未知';
var dynasty='未知';

for(var i=0;i<examples.length;i++){
if(text.indexOf(examples[i].text.substring(0,10))>=0||examples[i].text.indexOf(text.substring(0,10))>=0){
title=examples[i].title;
author=examples[i].author;
dynasty=examples[i].dynasty;
break;
}
}

var analysis=analysisDB[title]||null;

var html='<div class="result-block">';

if(mode==='full'||mode==='emotion'){
html+='<div class="section-title">📋 基本信息</div>';
html+='<div class="section-content">';
html+='<p><strong>诗题：</strong>'+title+'</p>';
html+='<p><strong>作者：</strong>'+author+'</p>';
html+='<p><strong>朝代：</strong>'+dynasty+'</p>';
html+='<p><strong>体裁：</strong>'+detectType(lines)+'</p>';
html+='</div>';
}

if(mode==='full'||mode==='structure'){
html+='<div class="section-title">📝 逐句赏析</div>';
html+='<div class="section-content">';
if(analysis){
analysis.lines.forEach(function(l){
html+='<div class="line-analysis"><div class="original">'+l.original+'</div><div class="explain">'+l.analysis+'</div></div>';
});
}else{
lines.forEach(function(line){
var clean=line.replace(/[，。！？、；：]/g,'');
html+='<div class="line-analysis"><div class="original">'+clean+'</div><div class="explain">此句'+(clean.length<=5?'简洁凝练':'意境深远')+'，'+analyzeLineBasic(clean)+'</div></div>';
});
}
html+='</div>';
}

if(mode==='full'||mode==='imagery'){
html+='<div class="section-title">🎨 意象分析</div><div class="section-content">';
var imgs=analysis?analysis.imagery:extractImagery(text);
imgs.forEach(function(img){html+='<span class="tag tag-blue">'+img+'</span> ';});
html+='</div>';
}

if(mode==='full'||mode==='rhetoric'){
html+='<div class="section-title">✨ 修辞手法</div><div class="section-content">';
var rha=analysis?analysis.rhetoric:fallbackAnalysis.rhetoric;
rha.forEach(function(r){html+='<span class="tag tag-purple">'+r+'</span> ';});
html+='</div>';
}

if(mode==='full'||mode==='emotion'){
html+='<div class="section-title">💕 情感基调</div><div class="section-content">';
html+=analysis?analysis.emotion:analyzeEmotionBasic(text);
html+='</div>';
}

if(mode==='full'){
html+='<div class="section-title">🌟 艺术特色</div><div class="section-content">';
var feats=analysis?analysis.features:fallbackAnalysis.features;
feats.forEach(function(f){html+='<span class="tag tag-green">'+f+'</span> ';});
html+='</div>';
}

html+='<div style="text-align:center;padding-top:12px"><button class="btn btn-green" onclick="copyAnalysis()">📋 复制分析结果</button></div>';
html+='</div>';
document.getElementById('result').innerHTML=html;
}

function detectType(lines){
var counts=lines.map(function(l){return l.replace(/[^\u4e00-\u9fa5]/g,'').length;});
var avg=counts.reduce(function(a,b){return a+b;},0)/counts.length;
if(avg<=5&&lines.length===4)return'五言绝句';
if(avg>5&&lines.length===4)return'七言绝句';
if(avg<=5&&lines.length===8)return'五言律诗';
if(avg>5&&lines.length===8)return'七言律诗';
if(lines.length>8)return'古风/歌行';
return'词/曲';
}

function analyzeLineBasic(line){
var len=line.length;
if(len<=5)return'言简意赅，以少胜多。';
if(len<=7)return'句式工整，朗朗上口。';
return'句式舒展，气势充沛。';
}

function extractImagery(text){
var common=['明月','清风','流水','花','鸟','山','水','云','雨','雪','夕阳','秋','春','柳','梅','竹','松','荷','酒','舟'];
var found=[];
common.forEach(function(w){if(text.indexOf(w)>=0)found.push(w);});
return found.length>0?found:['景物','意象'];
}

function analyzeEmotionBasic(text){
var sad=['悲','愁','泪','恨','孤','寒','冷','寂','凄','苦'];
var happy=['乐','欢','喜','笑','醉','歌','舞','笑'];
var sadCount=0;var happyCount=0;
sad.forEach(function(w){if(text.indexOf(w)>=0)sadCount++;});
happy.forEach(function(w){if(text.indexOf(w)>=0)happyCount++;});
if(sadCount>happyCount)return'情感偏向忧伤、沉郁，带有感怀身世或忧国忧民之意。';
if(happyCount>sadCount)return'情感偏向欢乐、豪放，表达积极乐观的人生态度。';
return'情感含蓄内敛，寓情于景，耐人寻味。';
}

function copyAnalysis(){
var el=document.getElementById('result');
navigator.clipboard.writeText(el.textContent).then(function(){alert('已复制分析结果');}).catch(function(){alert('复制失败');});
}
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
