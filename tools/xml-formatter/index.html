<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XML格式化</title>
<meta name="description" content="XML格式化工具，一键美化和压缩XML代码">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#60a5fa;--success:#4ade80;--danger:#f87171;--muted:#8b949e;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.5rem;text-align:center;margin-bottom:20px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;transition:.2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent)}
.setting{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.setting select{padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:.8rem}
.editor-wrap{display:flex;gap:12px;min-height:400px}
.editor-panel{flex:1;display:flex;flex-direction:column}
.panel-header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;font-size:.8rem;color:var(--muted)}
.editor-area{flex:1;border:1px solid var(--border);border-radius:0 0 8px 8px;overflow:hidden}
textarea.code-input{width:100%;height:100%;min-height:380px;padding:12px;border:none;background:var(--bg);color:var(--text);font-family:'Fira Code',monospace;font-size:.85rem;line-height:1.5;resize:vertical;outline:none;tab-size:2}
.output-area{width:100%;height:100%;min-height:380px;padding:12px;background:var(--bg);color:var(--text);font-family:'Fira Code',monospace;font-size:.85rem;line-height:1.5;overflow:auto;white-space:pre}
.status-bar{display:flex;justify-content:space-between;padding:6px 12px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;font-size:.75rem;color:var(--muted)}
.error-msg{color:var(--danger);font-size:.85rem;padding:8px;background:rgba(248,113,113,.05);border:1px solid var(--danger);border-radius:6px;margin-top:8px;display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 16px;border-radius:8px;font-size:.85rem;opacity:0;transition:.3s;z-index:100}
.toast.show{opacity:1}
@media(max-width:700px){.editor-wrap{flex-direction:column}.editor-area textarea,.output-area{min-height:200px}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="XML格式化">
  <meta property="og:description" content="XML格式化工具，一键美化和压缩XML代码">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/xml-formatter/">
</head>
<body>
<div class="container">
<h1>📋 XML格式化</h1>
<div class="toolbar">
<button class="btn btn-primary" onclick="formatXML()">美化</button>
<button class="btn btn-outline" onclick="minifyXML()">压缩</button>
<button class="btn btn-outline" onclick="validateXML()">验证</button>
<button class="btn btn-outline" onclick="toTreeView()">树视图</button>
<button class="btn btn-outline" onclick="copyOutput()">复制</button>
<button class="btn btn-outline" onclick="clearAll()">清空</button>
<div class="setting"><span>缩进:</span><select id="indentSize"><option value="2">2 空格</option><option value="4">4 空格</option><option value="tab">Tab</option></select></div>
</div>
<div class="editor-wrap">
<div class="editor-panel">
<div class="panel-header"><span>输入 XML</span><button class="btn btn-sm btn-outline" style="padding:4px 8px;font-size:.75rem;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text);cursor:pointer" onclick="loadExample()">示例</button></div>
<div class="editor-area"><textarea class="code-input" id="codeInput" placeholder="在此粘贴 XML 代码..." oninput="autoValidate()"></textarea></div>
<div class="status-bar"><span id="inputInfo">0 行, 0 字符</span><span id="xmlStatus"></span></div>
</div>
<div class="editor-panel">
<div class="panel-header"><span>输出</span><span id="outputInfo"></span></div>
<div class="editor-area"><div class="output-area" id="codeOutput"></div></div>
<div class="status-bar"><span id="treeInfo"></span></div>
</div>
</div>
<div class="error-msg" id="errorMsg"></div>
</div>
<div class="toast" id="toast"></div>
<script>
function getIndent() {
  const v = document.getElementById('indentSize').value;
  return v === 'tab' ? '\t' : ' '.repeat(parseInt(v));
}
function autoValidate() {
  const code = document.getElementById('codeInput').value;
  document.getElementById('inputInfo').textContent = `${code.split('\n').length} 行, ${code.length} 字符`;
  const err = validateXMLCode(code);
  document.getElementById('xmlStatus').textContent = err ? '❌ 格式错误' : '✅ 格式正确';
  document.getElementById('xmlStatus').style.color = err ? 'var(--danger)' : 'var(--success)';
}
function validateXMLCode(xml) {
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xml, 'text/xml');
    const error = doc.querySelector('parsererror');
    return error ? error.textContent : null;
  } catch (e) { return e.message; }
}
function validateXML() {
  const code = document.getElementById('codeInput').value;
  const err = validateXMLCode(code);
  const el = document.getElementById('errorMsg');
  if (err) {
    el.style.display = 'block';
    el.textContent = '验证错误: ' + err;
    document.getElementById('codeOutput').textContent = '';
  } else {
    el.style.display = 'block';
    el.style.borderColor = 'var(--success)';
    el.style.background = 'rgba(74,222,128,.05)';
    el.style.color = 'var(--success)';
    el.textContent = '✅ XML 格式正确！';
    setTimeout(() => { el.style.display = 'none'; el.style.borderColor = ''; el.style.color = ''; }, 3000);
  }
}
function formatXML() {
  const code = document.getElementById('codeInput').value.trim();
  if (!code) return;
  const err = validateXMLCode(code);
  if (err) { document.getElementById('errorMsg').style.display = 'block'; document.getElementById('errorMsg').textContent = '输入 XML 格式错误: ' + err; return; }
  document.getElementById('errorMsg').style.display = 'none';
  const indent = getIndent();
  let result = '', level = 0;
  const xml = code.replace(/(>)\s*(<)/g, '$1\n$2');
  xml.split('\n').forEach(line => {
    line = line.trim();
    if (!line) return;
    if (line.match(/^<\
    result += indent.repeat(level) + line + '\n';
    if (line.match(/^<\w[^>]*[^\/]>$/) && !line.match(/^<(br|hr|img|input|meta|link|source)/i) && !line.match(/^<\
  });
  document.getElementById('codeOutput').textContent = result.trim();
  document.getElementById('outputInfo').textContent = `${result.trim().split('\n').length} 行`;
}
function minifyXML() {
  const code = document.getElementById('codeInput').value.trim();
  if (!code) return;
  const result = code.replace(/>\s+</g, '><').replace(/\s+/g, ' ').trim();
  document.getElementById('codeOutput').textContent = result;
  document.getElementById('outputInfo').textContent = `${result.length} 字符`;
}
function toTreeView() {
  const code = document.getElementById('codeInput').value.trim();
  if (!code) return;
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(code, 'text/xml');
    if (doc.querySelector('parsererror')) { showToast('XML 格式错误'); return; }
    const lines = [];
    function walk(node, depth) {
      const indent = '│ '.repeat(depth);
      if (node.nodeType === 1) {
        let attrs = '';
        if (node.attributes.length) {
          attrs = ' ' + Array.from(node.attributes).map(a => `${a.name}="${a.value}"`).join(' ');
        }
        if (node.childNodes.length === 0 || (node.childNodes.length === 1 && node.childNodes[0].nodeType === 3)) {
          const text = node.textContent.trim();
          lines.push(`${indent}├─ <${node.tagName}${attrs}>${text ? ' ' + text : ''}</${node.tagName}>`);
        } else {
          lines.push(`${indent}├─ <${node.tagName}${attrs}>`);
          Array.from(node.childNodes).forEach(c => walk(c, depth + 1));
          lines.push(`${indent}└─ </${node.tagName}>`);
        }
      } else if (node.nodeType === 3 && node.textContent.trim()) {
        lines.push(`${indent}├─ "${node.textContent.trim()}"`);
      }
    }
    walk(doc.documentElement, 0);
    document.getElementById('codeOutput').textContent = lines.join('\n');
    document.getElementById('treeInfo').textContent = `${lines.length} 个节点`;
  } catch(e) { showToast('解析失败'); }
}
function copyOutput() {
  const text = document.getElementById('codeOutput').textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => showToast('已复制'));
}
function clearAll() {
  document.getElementById('codeInput').value = '';
  document.getElementById('codeOutput').textContent = '';
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('inputInfo').textContent = '0 行, 0 字符';
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
function loadExample() {
  document.getElementById('codeInput').value = '<?xml version="1.0" encoding="UTF-8"?><bookstore><book category="fiction"><title lang="en">Harry Potter</title><author>J.K. Rowling</author><price>29.99</price></book><book category="tech"><title lang="en">Learning XML</title><author>Erik T. Ray</author><price>39.95</price></book></bookstore>';
  autoValidate();
  formatXML();
}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
