<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市场情绪分析</title>
<meta name="description" content="市场情绪分析工具，恐惧贪婪指数和市场情绪指标">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6;scroll-behavior:smooth}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:var(--text);font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.stat{text-align:center;padding:12px}
.stat-num{font-size:2rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.8rem;color:var(--text2)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.table th{color:var(--text2);font-size:.85rem;font-weight:600}
.table tr:hover{background:rgba(59,130,246,.05)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.grid-2,.grid-3{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="市场情绪分析">
<meta property="og:description" content="市场情绪分析工具，恐惧贪婪指数和市场情绪指标">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/market-sentiment-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🧠 市场情绪分析';
const APP=document.getElementById('app');

let sentimentHistory=JSON.parse(localStorage.getItem('ms_history')||'[]');
let customScore=JSON.parse(localStorage.getItem('ms_custom')||'{"marketBreadth":50,"putCallRatio":50,"marginDebt":50,"volumeTrend":50,"advanceDecline":50}');

const SECTORS=[
  {name:'科技',score:0},{name:'金融',score:0},{name:'能源',score:0},
  {name:'医疗',score:0},{name:'消费',score:0},{name:'工业',score:0},
  {name:'房地产',score:0},{name:'材料',score:0}
];

function getFearGreedIndex(){
  if(sentimentHistory.length>0)return sentimentHistory[sentimentHistory.length-1].value;
  return 50;
}

function getLabel(v){
  if(v<=20)return{label:'极度恐惧',color:'var(--red)'};
  if(v<=40)return{label:'恐惧',color:'var(--red)'};
  if(v<=60)return{label:'中性',color:'var(--yellow)'};
  if(v<=80)return{label:'贪婪',color:'var(--green)'};
  return{label:'极度贪婪',color:'var(--green)'};
}

function drawGauge(canvasId,value){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const w=canvas.width,h=canvas.height;
  const cx=w/2,cy=h*0.6,r=Math.min(w,h)*0.4;
  ctx.clearRect(0,0,w,h);

  const startAngle=Math.PI;
  const endAngle=2*Math.PI;
  const segments=[
    {start:0,end:0.2,color:'#f85149'},
    {start:0.2,end:0.4,color:'#f97316'},
    {start:0.4,end:0.6,color:'#d29922'},
    {start:0.6,end:0.8,color:'#3fb950'},
    {start:0.8,end:1.0,color:'#238636'}
  ];
  segments.forEach(s=>{
    ctx.beginPath();
    ctx.arc(cx,cy,r,startAngle+s.start*Math.PI,startAngle+s.end*Math.PI);
    ctx.lineWidth=20;ctx.strokeStyle=s.color;ctx.stroke();
  });

  const needleAngle=startAngle+(value/100)*Math.PI;
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.cos(needleAngle)*(r-30),cy+Math.sin(needleAngle)*(r-30));
  ctx.lineWidth=3;ctx.strokeStyle='#e6edf3';ctx.stroke();

  ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fillStyle='#e6edf3';ctx.fill();

  const info=getLabel(value);
  ctx.fillStyle=info.color;ctx.font='bold 24px sans-serif';ctx.textAlign='center';
  ctx.fillText(value,cx,cy+30);
  ctx.fillStyle='#8b949e';ctx.font='14px sans-serif';
  ctx.fillText(info.label,cx,cy+50);
}

function drawHistoryChart(canvasId){
  const canvas=document.getElementById(canvasId);
  if(!canvas||sentimentHistory.length<2)return;
  const ctx=canvas.getContext('2d');
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);

  const data=sentimentHistory.slice(-30);
  const padL=40,padR=10,padT=10,padB=30;
  const cw=w-padL-padR,ch=h-padT-padB;

  ctx.strokeStyle='#30363d';ctx.lineWidth=1;
  [0,20,40,60,80,100].forEach(v=>{
    const y=padT+ch-(v/100)*ch;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke();
    ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';ctx.textAlign='right';
    ctx.fillText(v,padL-5,y+3);
  });

  ctx.beginPath();
  data.forEach((d,i)=>{
    const x=padL+(i/(data.length-1))*cw;
    const y=padT+ch-(d.value/100)*ch;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.stroke();

  const gradient=ctx.createLinearGradient(0,padT,0,padT+ch);
  gradient.addColorStop(0,'rgba(59,130,246,0.3)');
  gradient.addColorStop(1,'rgba(59,130,246,0)');
  ctx.lineTo(padL+cw,padT+ch);ctx.lineTo(padL,padT+ch);ctx.closePath();
  ctx.fillStyle=gradient;ctx.fill();
}

function drawSectorBars(canvasId){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const barH=(h-20)/SECTORS.length;
  SECTORS.forEach((s,i)=>{
    const y=10+i*barH;
    const barW=(s.score/100)*(w-140);
    const color=s.score>60?'#3fb950':s.score>40?'#d29922':'#f85149';
    ctx.fillStyle=color;
    ctx.fillRect(100,y+2,barW,barH-8);
    ctx.fillStyle='#e6edf3';ctx.font='12px sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(s.name,90,y+barH/2);
    ctx.textAlign='left';ctx.fillText(s.score,105+barW,y+barH/2);
  });
}

function tickSentiment(){
  const current=getFearGreedIndex();
  const delta=(Math.random()-0.48)*4;
  let newVal=Math.max(5,Math.min(95,current+delta));

  SECTORS.forEach(s=>{
    s.score=Math.max(5,Math.min(95,s.score+(Math.random()-0.48)*6));
  });

  const now=new Date();
  const ts=now.toISOString().slice(0,16);
  sentimentHistory.push({time:ts,value:Math.round(newVal)});
  if(sentimentHistory.length>100)sentimentHistory.shift();
  localStorage.setItem('ms_history',JSON.stringify(sentimentHistory));

  SECTORS.forEach(s=>{if(s.score===0)s.score=Math.round(30+Math.random()*40)});
  render();
}

function calcCustomScore(){
  const v=customScore;
  const score=Math.round((v.marketBreadth*0.25+(100-v.putCallRatio)*0.2+(100-v.marginDebt)*0.2+v.volumeTrend*0.15+v.advanceDecline*0.2));
  return Math.max(0,Math.min(100,score));
}

function saveCustom(){
  ['marketBreadth','putCallRatio','marginDebt','volumeTrend','advanceDecline'].forEach(k=>{
    customScore[k]=parseInt(document.getElementById('cs_'+k)?.value)||50;
  });
  localStorage.setItem('ms_custom',JSON.stringify(customScore));
  render();
}

function render(){
  const fgi=getFearGreedIndex();
  const info=getLabel(fgi);
  let h=`<h1>🧠 市场情绪分析</h1><p class="subtitle">恐惧贪婪指数与市场情绪指标</p>`;

  h+=`<div class="grid grid-2">`;
  h+=`<div class="card"><div style="text-align:center"><h3 style="margin-bottom:12px">恐惧与贪婪指数</h3>`;
  h+=`<canvas id="gauge" width="300" height="200"></canvas>`;
  h+=`</div></div>`;
  h+=`<div class="card"><h3 style="margin-bottom:12px">情绪历史趋势</h3>`;
  h+=`<canvas id="historyChart" width="400" height="200"></canvas>`;
  h+=`</div></div>`;
  h+=`</div>`;

  h+=`<div class="card"><h3 style="margin-bottom:12px">行业情绪</h3>`;
  h+=`<canvas id="sectorBars" width="800" height="280"></canvas>`;
  h+=`</div>`;

  h+=`<div class="card"><h3 style="margin-bottom:12px">波动率指标</h3>`;
  const vix=Math.round(15+Math.random()*20);
  h+=`<div class="grid grid-3">`;
  h+=`<div class="stat"><div class="stat-num" style="font-size:1.5rem;color:${vix>25?'var(--red)':vix>18?'var(--yellow)':'var(--green)'}">${vix}</div><div class="stat-label">VIX指数</div></div>`;
  const putCall=(0.7+Math.random()*0.6).toFixed(2);
  h+=`<div class="stat"><div class="stat-num" style="font-size:1.5rem">${putCall}</div><div class="stat-label">看跌/看涨比率</div></div>`;
  const advDec=Math.round(40+Math.random()*60);
  h+=`<div class="stat"><div class="stat-num" style="font-size:1.5rem;color:${advDec>50?'var(--green)':'var(--red)'}">${advDec}%</div><div class="stat-label">上涨比例</div></div>`;
  h+=`</div></div>`;

  h+=`<div class="card"><h3 style="margin-bottom:12px">情绪计算器</h3><p style="font-size:.85rem;color:var(--text2);margin-bottom:12px">根据市场指标计算自定义情绪分数</p>`;
  const labels={marketBreadth:'市场广度 (0=窄,100=广)',putCallRatio:'看跌/看涨比率 (0=低,100=高)',marginDebt:'融资余额 (0=低,100=高)',volumeTrend:'成交量趋势 (0=缩量,100=放量)',advanceDecline:'涨跌比 (0=跌多,100=涨多)'};
  Object.entries(labels).forEach(([k,v])=>{
    h+=`<label>${v}</label><input id="cs_${k}" type="range" min="0" max="100" value="${customScore[k]}" oninput="document.getElementById('cs_val_${k}').textContent=this.value;saveCustom()"><span id="cs_val_${k}" style="font-size:.85rem">${customScore[k]}</span>`;
  });
  const cs=calcCustomScore();
  h+=`<div style="text-align:center;margin-top:16px"><span style="font-size:1.5rem;font-weight:700;color:${getLabel(cs).color}">${cs}</span> <span style="color:var(--text2)">${getLabel(cs).label}</span></div>`;
  h+=`</div>`;

  h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">历史记录</span><button class="btn btn-sm btn-danger" onclick="if(confirm('清除所有历史？')){sentimentHistory=[];localStorage.removeItem('ms_history');render()}">清除</button></div>`;
  if(sentimentHistory.length===0)h+=`<div class="empty">暂无历史数据</div>`;
  else{
    h+=`<table class="table"><thead><tr><th>时间</th><th>指数</th><th>状态</th></tr></thead><tbody>`;
    sentimentHistory.slice().reverse().slice(0,20).forEach(s=>{
      const info=getLabel(s.value);
      h+=`<tr><td>${s.time}</td><td style="font-weight:700">${s.value}</td><td><span class="badge" style="background:${info.color}20;color:${info.color}">${info.label}</span></td></tr>`;
    });
    h+=`</tbody></table>`;
  }
  h+=`</div>`;

  APP.innerHTML=h;
  drawGauge('gauge',fgi);
  drawHistoryChart('historyChart');
  drawSectorBars('sectorBars');
}

setInterval(tickSentiment,8000);
render();
</script>
</body>
</html>
