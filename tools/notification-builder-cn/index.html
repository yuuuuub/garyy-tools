<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔔 通知构建器</title>
<meta name="description" content="应用内通知模板构建器，创建各类通知消息模板并预览效果">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔔 通知构建器">
<meta property="og:description" content="通知构建器 - Gary's Tools">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔔</text></svg>">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;transition:background .3s,color .3s}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.3rem;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:60px}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-orange{background:var(--orange)}.btn-purple{background:var(--purple)}.btn-sm{padding:4px 10px;font-size:.8rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px}
.theme-toggle{position:fixed;top:12px;right:12px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:8px;cursor:pointer;z-index:100}
.notif-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;transition:transform .2s}
.notif-card:hover{transform:translateY(-1px)}
.notif-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.notif-icon.info{background:#dbeafe;color:#2563eb}
.notif-icon.success{background:#dcfce7;color:#16a34a}
.notif-icon.warning{background:#fef3c7;color:#d97706}
.notif-icon.error{background:#fee2e2;color:#dc2626}
.notif-icon.message{background:#ede9fe;color:#7c3aed}
.notif-body{flex:1}
.notif-title{font-weight:600;font-size:.9rem;margin-bottom:2px}
.notif-text{font-size:.8rem;color:var(--text2);line-height:1.4}
.notif-time{font-size:.7rem;color:var(--text2);margin-top:4px}
.notif-actions{display:flex;gap:6px;margin-top:8px}
.notif-actions button{padding:4px 10px;font-size:.75rem;border-radius:6px}
.notif-actions .dismiss{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;color:#fff}
.notif-list{max-height:400px;overflow-y:auto}
.preview-phone{width:360px;margin:0 auto;background:#1a1a2e;border-radius:24px;padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.preview-screen{background:#0f0f1a;border-radius:16px;padding:12px;min-height:450px}
.status-bar{display:flex;justify-content:space-between;font-size:.65rem;color:#666;padding:4px 8px}
.notif-banner{background:rgba(255,255,255,.1);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;backdrop-filter:blur(10px)}
.notif-banner .nb-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.notif-banner .nb-title{font-size:.8rem;font-weight:600;color:#fff}
.notif-banner .nb-text{font-size:.72rem;color:#aaa;line-height:1.3}
.notif-banner .nb-time{font-size:.6rem;color:#666;margin-top:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>🔔 通知构建器</h1>

<div class="card">
<div class="section-title">快速类型</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn-sm" onclick="setType('info')">ℹ️ 信息</button>
<button class="btn-sm btn-green" onclick="setType('success')">✅ 成功</button>
<button class="btn-sm btn-orange" onclick="setType('warning')">⚠️ 警告</button>
<button class="btn-sm btn-red" onclick="setType('error')">❌ 错误</button>
<button class="btn-sm btn-purple" onclick="setType('message')">💬 消息</button>
</div>
</div>

<div class="form-row">
<div class="card">
<div class="section-title">通知编辑</div>
<div style="margin-bottom:12px"><label>通知类型</label><select id="nType"><option value="info">信息</option><option value="success">成功</option><option value="warning">警告</option><option value="error">错误</option><option value="message">消息</option></select></div>
<div style="margin-bottom:12px"><label>标题</label><input type="text" id="nTitle" placeholder="通知标题"></div>
<div style="margin-bottom:12px"><label>内容</label><textarea id="nContent" rows="3" placeholder="通知内容"></textarea></div>
<div class="form-row">
<div><label>图标(emoji)</label><input type="text" id="nIcon" value="🔔" maxlength="2"></div>
<div><label>来源应用</label><input type="text" id="nApp" placeholder="例：微信"></div>
</div>
<div class="form-row">
<div><label>操作按钮1</label><input type="text" id="nAction1" placeholder="例：查看"></div>
<div><label>操作按钮2</label><input type="text" id="nAction2" placeholder="例：关闭"></div>
</div>
<div style="margin-top:12px;display:flex;gap:8px">
<button onclick="addNotification()">➕ 添加通知</button>
<button class="btn-green" onclick="simulateNotif()">🔔 模拟弹出</button>
</div>
</div>
<div class="card">
<div class="section-title">手机预览</div>
<div class="preview-phone"><div class="preview-screen">
<div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
<div id="phoneNotifs" style="animation:slideDown .3s ease-out">
<div class="notif-banner">
<div class="nb-icon" style="background:rgba(37,99,235,.3);color:#60a5fa">ℹ️</div>
<div><div class="nb-title">系统通知</div><div class="nb-text">点击左侧添加通知</div><div class="nb-time">现在</div></div>
</div>
</div>
</div></div>
</div>
</div>

<div class="card">
<div class="section-title">通知列表 <span id="notifCount" style="font-size:.8rem;color:var(--text2)">(0)</span></div>
<div class="notif-list" id="notifList"></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var notifications = JSON.parse(localStorage.getItem('notifications') || '[]');
var idCounter = notifications.length ? Math.max(...notifications.map(n=>n.id)) + 1 : 1;

var iconMap = {info:'ℹ️',success:'✅',warning:'⚠️',error:'❌',message:'💬'};
var bgMap = {info:'background:rgba(37,99,235,.3);color:#60a5fa',success:'background:rgba(22,163,74,.3);color:#4ade80',warning:'background:rgba(217,119,6,.3);color:#fbbf24',error:'background:background:rgba(220,38,38,.3);color:#f87171',message:'background:rgba(124,58,237,.3);color:#a78bfa'};

function setType(type){
  document.getElementById('nType').value=type;
  document.getElementById('nIcon').value=iconMap[type]||'🔔';
}

function addNotification(){
  var title=document.getElementById('nTitle').value.trim();
  var content=document.getElementById('nContent').value.trim();
  if(!title){alert('请输入通知标题');return;}
  var n={
    id:idCounter++,type:document.getElementById('nType').value,
    title:title,content:content,icon:document.getElementById('nIcon').value||'🔔',
    app:document.getElementById('nApp').value||'系统',
    action1:document.getElementById('nAction1').value,
    action2:document.getElementById('nAction2').value,
    time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),
    created:new Date().toLocaleDateString('zh-CN')
  };
  notifications.unshift(n);
  localStorage.setItem('notifications',JSON.stringify(notifications));
  renderNotifs();
  updatePhonePreview();
  document.getElementById('nTitle').value='';
  document.getElementById('nContent').value='';
  alert('通知添加成功！');
}

function renderNotifs(){
  var el=document.getElementById('notifList');
  document.getElementById('notifCount').textContent='('+notifications.length+')';
  if(!notifications.length){el.innerHTML='<p style="color:var(--text2);text-align:center;padding:20px">暂无通知</p>';return;}
  el.innerHTML=notifications.map(function(n,i){
    return '<div class="notif-card"><div class="notif-icon '+n.type+'">'+n.icon+'</div><div class="notif-body"><div class="notif-title">'+n.title+'</div><div class="notif-text">'+n.content+'</div><div class="notif-time">'+n.app+' · '+n.time+' · '+n.created+'</div><div class="notif-actions">'+(n.action1?'<button onclick="alert(\'操作: '+n.action1+'\')">'+n.action1+'</button>':'')+(n.action2?'<button class="dismiss" onclick="dismissNotif('+n.id+')">'+n.action2+'</button>':'')+'<button class="dismiss" onclick="deleteNotif('+n.id+')">删除</button></div></div></div>';
  }).join('');
}

function dismissNotif(id){deleteNotif(id);}
function deleteNotif(id){notifications=notifications.filter(n=>n.id!==id);localStorage.setItem('notifications',JSON.stringify(notifications));renderNotifs();updatePhonePreview();}

function updatePhonePreview(){
  var el=document.getElementById('phoneNotifs');
  if(!notifications.length){el.innerHTML='<div class="notif-banner"><div class="nb-icon" style="background:rgba(37,99,235,.3);color:#60a5fa">ℹ️</div><div><div class="nb-title">系统通知</div><div class="nb-text">暂无通知</div></div></div>';return;}
  el.innerHTML=notifications.slice(0,5).map(function(n){
    var bg=bgMap[n.type]||bgMap.info;
    return '<div class="notif-banner"><div class="nb-icon" style="'+bg+'">'+n.icon+'</div><div><div class="nb-title">'+n.title+'</div><div class="nb-text">'+n.content+'</div><div class="nb-time">'+n.app+' · '+n.time+'</div></div></div>';
  }).join('');
}

function simulateNotif(){
  var title=document.getElementById('nTitle').value.trim()||'测试通知';
  var content=document.getElementById('nContent').value.trim()||'这是一条模拟通知';
  var type=document.getElementById('nType').value;
  var el=document.createElement('div');
  el.style.cssText='position:fixed;top:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.2);z-index:10000;animation:slideDown .3s ease-out;display:flex;gap:10px;align-items:flex-start';
  el.innerHTML='<div class="notif-icon '+type+'" style="width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0">'+iconMap[type]+'</div><div style="flex:1"><div style="font-weight:600;font-size:.9rem;margin-bottom:2px">'+title+'</div><div style="font-size:.8rem;color:var(--text2)">'+content+'</div></div><button onclick="this.parentElement.remove()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:1.1rem;padding:0">×</button>';
  document.body.appendChild(el);
  setTimeout(function(){if(el.parentElement)el.remove();},5000);
}

function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
renderNotifs();updatePhonePreview();
</script>
</body>
</html>
