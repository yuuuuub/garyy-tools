<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字大写转换器</title>
  <meta name="description" content="数字转中文大写工具，金额大写一键转换">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { bg: '#0f172a', card: '#1e293b', border: '#334155', text: '#e2e8f0', muted: '#94a3b8', accent: '#6366f1' }
          }
        }
      }
    }
  </script>
  <style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}

    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
    .mode-btn.active { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; box-shadow: 0 4px 14px rgba(99,102,241,0.4); }
    .dark .mode-btn:not(.active) { background: #334155; color: #cbd5e1; }
    .mode-btn:not(.active) { background: #e2e8f0; color: #475569; }
    .result-box { word-break: break-all; min-height: 4rem; }
    .quick-btn { transition: all 0.15s ease; }
    .quick-btn:active { transform: scale(0.95); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    .copied-flash { animation: flash 0.5s ease; }
    @keyframes flash { 0%,100% { background: transparent; } 50% { background: rgba(99,102,241,0.15); } }
    .theme-toggle { transition: transform 0.3s ease; }
    html.dark .theme-toggle { transform: rotate(180deg); }
  </style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="数字大写转换器">
  <meta property="og:description" content="数字转中文大写工具，金额大写一键转换">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/number-to-chinese/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body class="dark:bg-dark-bg bg-slate-50 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">
  <div class="w-full max-w-lg mx-auto">

    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold dark:text-white text-slate-800">数字大写转换器</h1>
      <button id="themeBtn" onclick="toggleTheme()" class="theme-toggle text-2xl p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" aria-label="切换主题">
        <span id="themeIcon">&#x1F319;</span>
      </button>
    </div>

    <div class="dark:bg-dark-card bg-white rounded-2xl shadow-lg dark:shadow-2xl p-5 sm:p-6 transition-colors duration-300">

      <div class="flex gap-2 mb-5" role="tablist">
        <button class="mode-btn active flex-1 py-2.5 px-3 rounded-xl text-sm sm:text-base font-medium transition-all duration-200" data-mode="rmb" onclick="switchMode('rmb')" role="tab" aria-selected="true">人民币大写</button>
        <button class="mode-btn flex-1 py-2.5 px-3 rounded-xl text-sm sm:text-base font-medium transition-all duration-200" data-mode="lower" onclick="switchMode('lower')" role="tab" aria-selected="false">中文小写</button>
        <button class="mode-btn flex-1 py-2.5 px-3 rounded-xl text-sm sm:text-base font-medium transition-all duration-200" data-mode="upper" onclick="switchMode('upper')" role="tab" aria-selected="false">中文大写</button>
      </div>

      <div class="mb-4">
        <label class="block text-xs sm:text-sm font-medium dark:text-dark-muted text-slate-500 mb-1.5" id="inputLabel">输入金额（人民币大写）</label>
        <input type="text" id="numInput" inputmode="decimal" placeholder="请输入数字，如 12345.67" title="Enter键搜索"
          class="w-full px-4 py-3 rounded-xl border-2 dark:border-dark-border border-slate-200 dark:bg-dark-bg bg-slate-50 dark:text-white text-slate-800 text-lg focus:outline-none focus:border-indigo-400 dark:focus:border-indigo-500 transition-colors"
          oninput="onInput()" autofocus>
      </div>

      <div class="mb-5">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-xs sm:text-sm font-medium dark:text-dark-muted text-slate-500">转换结果</span>
          <button id="copyBtn" onclick="copyResult()" class="text-xs sm:text-sm text-indigo-500 hover:text-indigo-400 font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed" disabled>复制</button>
        </div>
        <div id="resultBox" class="result-box w-full px-4 py-3 rounded-xl border-2 dark:border-dark-border border-slate-200 dark:bg-dark-bg bg-slate-50 dark:text-white text-slate-600 text-lg sm:text-xl min-h-[3.5rem] flex items-center transition-colors">
          <span class="dark:text-dark-muted text-slate-400">等待输入...</span>
        </div>
      </div>

      <div>
        <p class="text-xs sm:text-sm font-medium dark:text-dark-muted text-slate-500 mb-2.5" id="quickLabel">常用金额（人民币大写）</p>
        <div id="quickBtns" class="grid grid-cols-3 sm:grid-cols-4 gap-2"></div>
      </div>
    </div>

    <p class="text-center text-xs dark:text-slate-600 text-slate-400 mt-5">支持最大到万亿级别</p>
  </div>

  <script>
    const DIGITS_LOWER = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    const DIGITS_UPPER = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
    const UNITS_LOWER  = ['', '十', '百', '千'];
    const UNITS_UPPER  = ['', '拾', '佰', '仟'];
    const SECTION_UNITS = ['', '万', '亿', '万亿'];
    let currentMode = 'rmb';
    const rmbQuick = [
      { label: '100', val: '100' },
      { label: '500', val: '500' },
      { label: '1,000', val: '1000' },
      { label: '5,000', val: '5000' },
      { label: '1万', val: '10000' },
      { label: '5万', val: '50000' },
      { label: '10万', val: '100000' },
      { label: '50万', val: '500000' },
      { label: '100万', val: '1000000' },
      { label: '1.5万', val: '15000' },
      { label: '8.88万', val: '88800' },
      { label: '100.50', val: '100.50' },
    ];
    const lowerQuick = [
      { label: '123', val: '123' },
      { label: '500', val: '500' },
      { label: '1,080', val: '1080' },
      { label: '5,050', val: '5050' },
      { label: '1万', val: '10000' },
      { label: '11万', val: '110000' },
      { label: '101万', val: '1010000' },
      { label: '1亿', val: '100000000' },
      { label: '10亿', val: '1000000000' },
      { label: '100亿', val: '10000000000' },
      { label: '1000亿', val: '100000000000' },
      { label: '1万亿', val: '1000000000000' },
    ];
    const upperQuick = [
      { label: '123', val: '123' },
      { label: '500', val: '500' },
      { label: '1,080', val: '1080' },
      { label: '5,050', val: '5050' },
      { label: '1万', val: '10000' },
      { label: '11万', val: '110000' },
      { label: '101万', val: '1010000' },
      { label: '1亿', val: '100000000' },
      { label: '10亿', val: '1000000000' },
      { label: '100亿', val: '10000000000' },
      { label: '1000亿', val: '100000000000' },
      { label: '1万亿', val: '1000000000000' },
    ];
    const quickData = {
      rmb:   { data: rmbQuick,   label: '常用金额（人民币大写）' },
      lower: { data: lowerQuick, label: '常用数字（中文小写）' },
      upper: { data: upperQuick, label: '常用数字（中文大写）' },
    };
    function integerToChinese(numStr, isUpper) {
      const digits = isUpper ? DIGITS_UPPER : DIGITS_LOWER;
      const units  = isUpper ? UNITS_UPPER  : UNITS_LOWER;
      if (numStr === '0') return digits[0];
      numStr = numStr.replace(/^0+/, '');
      const padLen = Math.ceil(numStr.length / 4) * 4;
      const padded = numStr.padStart(padLen, '0');
      const sectionCount = padded.length / 4;
      let result = '';
      let prevHasContent = false;
      let zeroGap = false;
      for (let si = 0; si < sectionCount; si++) {
        const section = padded.substring(si * 4, (si + 1) * 4);
        const secVal = parseInt(section, 10);
        const unitIdx = sectionCount - 1 - si;
        if (secVal === 0) {
          if (prevHasContent) zeroGap = true;
          continue;
        }
        if (prevHasContent && (zeroGap || section[0] === '0')) {
          result += digits[0];
        }
        zeroGap = false;
        prevHasContent = true;
        let secResult = '';
        let secNeedZero = false;
        for (let j = 0; j < 4; j++) {
          const d = parseInt(section[j], 10);
          const pos = 3 - j;
          if (d === 0) {
            if (secResult.length > 0) {
              let hasRemaining = false;
              for (let k = j + 1; k < 4; k++) {
                if (parseInt(section[k], 10) !== 0) { hasRemaining = true; break; }
              }
              if (hasRemaining) secNeedZero = true;
            }
            continue;
          }
          if (secNeedZero) {
            secResult += digits[0];
            secNeedZero = false;
          }
          if (!isUpper && pos === 1 && d === 1 && secResult.length === 0) {
            secResult += units[pos];
          } else {
            secResult += digits[d] + units[pos];
          }
        }
        result += secResult;
        if (unitIdx > 0) {
          result += SECTION_UNITS[unitIdx];
        }
      }
      return result || digits[0];
    }
    function toRmb(intStr, decStr) {
      let result = '';
      const intVal = BigInt(intStr || '0');
      if (intVal > 0n) {
        result += integerToChinese(intStr, true) + '元';
      } else {
        result += '零元';
      }
      const d = (decStr || '0').padEnd(2, '0').substring(0, 2);
      const jiao = parseInt(d[0], 10);
      const fen  = parseInt(d[1], 10);
      if (jiao === 0 && fen === 0) {
        result += '整';
      } else {
        if (jiao > 0) {
          result += DIGITS_UPPER[jiao] + '角';
        }
        if (fen > 0) {
          if (jiao === 0 && intVal === 0n) {
          }
          if (jiao === 0) {
            result += '零';
          }
          result += DIGITS_UPPER[fen] + '分';
        }
      }
      return result;
    }
    function convert(raw, mode) {
      const trimmed = raw.replace(/,/g, '').replace(/\s+/g, '');
      if (!trimmed) return { success: false, result: '', error: '' };
      if (!/^\d+(\.\d+)?$/.test(trimmed)) {
        return { success: false, result: '', error: '请输入有效数字' };
      }
      let [intStr, decStr = ''] = trimmed.split('.');
      intStr = intStr.replace(/^0+(?=\d)/, '');
      if (!intStr) intStr = '0';
      decStr = decStr.substring(0, 2);
      if (intStr.length > 14) {
        return { success: false, result: '', error: '数字太大（最大支持万亿级别）' };
      }
      let result = '';
      if (mode === 'rmb') {
        result = toRmb(intStr, decStr);
      } else if (mode === 'lower') {
        result = integerToChinese(intStr, false);
        if (decStr && parseInt(decStr, 10) > 0) {
          result += '点';
          for (const ch of decStr) {
            result += DIGITS_LOWER[parseInt(ch, 10)];
          }
        }
      } else {
        result = integerToChinese(intStr, true);
        if (decStr && parseInt(decStr, 10) > 0) {
          result += '点';
          for (const ch of decStr) {
            result += DIGITS_UPPER[parseInt(ch, 10)];
          }
        }
      }
      return { success: true, result, error: '' };
    }
    function onInput() {
      const input = document.getElementById('numInput');
      const resultBox = document.getElementById('resultBox');
      const copyBtn = document.getElementById('copyBtn');
      const { success, result, error } = convert(input.value, currentMode);
      if (!input.value.trim()) {
        resultBox.innerHTML = '<span class="dark:text-dark-muted text-slate-400">等待输入...</span>';
        copyBtn.disabled = true;
        return;
      }
      if (!success) {
        resultBox.innerHTML = '<span class="text-red-400">' + error + '</span>';
        copyBtn.disabled = true;
        return;
      }
      resultBox.innerHTML = '<span class="fade-in dark:text-white text-slate-800 font-medium">' + result + '</span>';
      copyBtn.disabled = false;
    }
    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.setAttribute('aria-selected', 'false');
        if (btn.dataset.mode === mode) {
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
        }
      });
      const qd = quickData[mode];
      document.getElementById('inputLabel').textContent = '输入金额（' + qd.label.replace(/（.*$/, '') + '）';
      document.getElementById('quickLabel').textContent = qd.label;
      renderQuickButtons();
      onInput();
    }
    function renderQuickButtons() {
      const container = document.getElementById('quickBtns');
      const qd = quickData[currentMode];
      container.innerHTML = qd.data.map(item =>
        '<button class="quick-btn px-2 py-2 rounded-lg text-xs sm:text-sm font-medium dark:bg-dark-border bg-slate-100 dark:text-dark-text text-slate-600 hover:bg-indigo-100 dark:hover:bg-indigo-900/30 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" onclick="setQuick(\'' + item.val + '\')">' + item.label + '</button>'
      ).join('');
    }
    function setQuick(val) {
      const input = document.getElementById('numInput');
      input.value = val;
      onInput();
      input.focus();
    }
    async function copyResult() {
      const resultBox = document.getElementById('resultBox');
      const copyBtn = document.getElementById('copyBtn');
      const text = resultBox.textContent.trim();
      if (!text || text === '等待输入...') return;
      try {
        await navigator.clipboard.writeText(text);
        const orig = copyBtn.textContent;
        copyBtn.textContent = '已复制!';
        copyBtn.classList.add('copied-flash');
        setTimeout(() => {
          copyBtn.textContent = orig;
          copyBtn.classList.remove('copied-flash');
        }, 1500);
      } catch {
        copyBtn.textContent = '复制失败';
        setTimeout(() => { copyBtn.textContent = '复制'; }, 1500);
      }
    }
    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.innerHTML = '&#x2600;&#xFE0F;';
      } else {
        html.classList.add('dark');
        icon.innerHTML = '&#x1F319;';
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      renderQuickButtons();
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').innerHTML = '&#x2600;&#xFE0F;';
      }
    });
  </script>
<script src="../i18n.js" defer>
document.getElementById("numInput").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();toggleTheme();}});
</script>
</body>
</html>
