<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {--bg: #1a1a2e;
--bg-card: #16213e;
--bg-input: #0f0f23;
--text: #e0e0e0;
--text-secondary: #a0a0b8;
--accent: #ff6b6b;
--accent-hover: #ff8787;
--border: #2a2a4a;
--tag-bg: #2a1a3e;
--tag-text: #c084fc;
--success: #4ade80;
--warning: #fbbf24}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
padding: 16px;
line-height: 1.6scroll-behavior:smooth;}
.container {width: 100%;
max-width: 600px;
margin: 0 auto}
header {text-align: center;
padding: 32px 0 24px}
.logo {font-size: 48px;
margin-bottom: 4px;
animation: bounce 2s infinite}
@keyframes bounce {0%, 100% { transform: translateY(0); }
50% { transform: translateY(-8px); }}
h1 {font-size: clamp(1.4rem, 5vw, 1.8rem);
font-weight: 800;
background: linear-gradient(135deg, var(--accent), #f97316, #eab308);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text}
.subtitle {color: var(--text-secondary);
font-size: 0.85rem;
margin-top: 6px}
.mode-tabs {display: flex;
gap: 8px;
margin-bottom: 20px;
background: var(--bg-card);
border-radius: 12px;
padding: 4px;
border: 1px solid var(--border)}
.mode-tab {flex: 1;
padding: 10px 8px;
border: none;
background: transparent;
color: var(--text-secondary);
border-radius: 10px;
cursor: pointer;
font-size: 0.85rem;
font-weight: 600;
transition: all 0.2s;
white-space: nowrap}
.mode-tab.active {background: var(--accent);
color: var(--text);
box-shadow: 0 2px 12px rgba(255, 107, 107, 0.3)}
.mode-tab:hover:not(.active) {background: rgba(255, 107, 107, 0.15);
color: var(--text)}
.mode-desc {background: var(--bg-card);
border: 1px solid var(--border);
border-radius: 10px;
padding: 10px 14px;
margin-bottom: 16px;
font-size: 0.8rem;
color: var(--text-secondary);
display: flex;
align-items: center;
gap: 8px}
.mode-desc .icon {font-size: 1.2rem}
.input-group {margin-bottom: 12px}
.input-label {display: block;
font-size: 0.8rem;
font-weight: 600;
color: var(--text-secondary);
margin-bottom: 8px;
text-transform: uppercase;
letter-spacing: 0.5px}
textarea {width: 100%;
min-height: 100px;
background: var(--bg-input);
border: 2px solid var(--border);
border-radius: 12px;
color: var(--text);
padding: 14px;
font-size: 0.95rem;
font-family: inherit;
resize: vertical;
transition: border-color 0.2s;
outline: none}
textarea:focus {border-color: var(--accent)}
textarea::placeholder {color: #555}
.quick-examples {display: flex;
flex-wrap: wrap;
gap: 6px;
margin-bottom: 16px}
.quick-tag {background: var(--bg-card);
border: 1px solid var(--border);
color: var(--text-secondary);
padding: 5px 10px;
border-radius: 20px;
font-size: 0.75rem;
cursor: pointer;
transition: all 0.15s;
white-space: nowrap}
.quick-tag:hover {background: var(--accent);
color: var(--text);
border-color: var(--accent)}
.btn-row {display: flex;
gap: 10px;
margin-bottom: 20px}
.btn {padding: 10px 20px;
border: none;
border-radius: 10px;
cursor: pointer;
font-size: 0.9rem;
font-weight: 700;
transition: all 0.2s;
display: flex;
align-items: center;
gap: 6px;
justify-content: center}
.btn-primary {flex: 2;
background: var(--accent);
color: var(--text)}
.btn-primary:hover {background: var(--accent-hover);
transform: translateY(-1px);
box-shadow: 0 4px 16px rgba(255, 107, 107, 0.35)}
.btn-primary:active {transform: translateY(0)}
.btn-secondary {flex: 1;
background: var(--bg-card);
color: var(--text);
border: 1px solid var(--border)}
.btn-secondary:hover {border-color: var(--accent);
color: var(--accent)}
.btn-icon {font-size: 1rem}
.output-section {background: var(--bg-card);
border: 1px solid var(--border);
border-radius: 14px;
padding: 18px;
margin-bottom: 16px;
position: relative;
min-height: 80px;
display: flex;
flex-direction: column;
gap: 8px}
.output-section.empty::after {content: "翻译结果将显示在这里...";
color: #3a3a5a;
font-size: 0.9rem;
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%)}
.output-label {font-size: 0.75rem;
font-weight: 700;
color: var(--accent);
text-transform: uppercase;
letter-spacing: 1px}
.output-text {font-size: 0.95rem;
color: var(--text);
line-height: 1.7;
word-break: break-word}
.highlight-count {background: var(--accent);
color: var(--text);
font-size: 0.7rem;
padding: 2px 8px;
border-radius: 10px;
font-weight: 700}
.toast {position: fixed;
bottom: 30px;
left: 50%;
transform: translateX(-50%);
background: var(--success);
color: #000;
padding: 10px 24px;
border-radius: 10px;
font-weight: 700;
font-size: 0.85rem;
opacity: 0;
pointer-events: none;
transition: opacity 0.3s;
z-index: 100}
.toast.show {opacity: 1}
.stats {display: flex;
gap: 12px;
margin-bottom: 20px}
.stat-card {flex: 1;
background: var(--bg-card);
border: 1px solid var(--border);
border-radius: 10px;
padding: 10px 12px;
text-align: center}
.stat-value {font-size: 1.3rem;
font-weight: 800;
color: var(--accent)}
.stat-label {font-size: 0.7rem;
color: var(--text-secondary);
margin-top: 2px}
footer {text-align: center;
padding: 16px 0;
color: #3a3a5a;
font-size: 0.75rem}
.dict-toggle {background: transparent;
border: none;
color: var(--text-secondary);
font-size: 0.75rem;
cursor: pointer;
text-decoration: underline;
text-underline-offset: 3px;
margin-top: 4px}
.dict-toggle:hover {color: var(--accent)}
.dict-panel {display: none;
background: var(--bg-input);
border: 1px solid var(--border);
border-radius: 10px;
padding: 12px;
margin-top: 8px;
max-height: 200px;
overflow-y: auto;
font-size: 0.78rem}
.dict-panel.show {display: block}
.dict-row {display: flex;
gap: 8px;
padding: 4px 0;
border-bottom: 1px solid rgba(42, 42, 74, 0.5)}
.dict-row:last-child {border-bottom: none}
.dict-from {color: var(--text-secondary);
flex: 1;
text-decoration: line-through;
text-decoration-color: rgba(255, 255, 255, 0.15)}
.dict-arrow {color: var(--accent);
flex-shrink: 0}
.dict-to {color: var(--success);
flex: 2}
@media (max-width: 400px) {body { padding: 8px; }
header { padding: 20px 0 16px; }
.mode-tab { font-size: 0.75rem; padding: 8px 4px; }
.btn { font-size: 0.85rem; padding: 10px 14px; }}
</style>

<body>
<div class="container">
  <header>
    <div class="logo">🤡</div>

  <div class="mode-tabs" id="modeTabs">

  </div>

  <div class="input-group">
    <label class="input-label">🔤 输入你的大实话</label>
    <textarea id="inputText" placeholder="比如：这周修了几个 bug，开了几个会，没什么进展...">这周主要改了首页的按钮样式，修了两个线上 bug，周三和产品开了个会讨论下一步需求，其他时间都在摸鱼。</textarea>
  </div>

  <div class="quick-examples" id="quickExamples">
    <span class="quick-tag" data-text="这周没什么活，就改了个按钮颜色">改了个按钮</span>
    <span class="quick-tag" data-text="天天都在划水，啥正事没干">天天划水</span>
    <span class="quick-tag" data-text="不知道干什么，每天发呆">不知道干啥</span>
    <span class="quick-tag" data-text="需求又改了，代码还没写完，又要加班">加班赶工</span>
    <span class="quick-tag" data-text="公司没钱发年终奖了，老板说这是福报">没钱发奖金</span>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="btnTranslate">
      <span class="btn-icon">✨</span> 翻译成黑话
    </button>
    <button class="btn btn-secondary" id="btnCopy">
      <span class="btn-icon">📋</span> 复制
    </button>
  </div>

  <div class="output-section empty" id="outputSection">
    <div class="output-label" id="outputLabel"></div>
    <div class="output-text" id="outputText"></div>
    <span class="highlight-count" id="highlightCount" style="display:none;"></span>
  </div>

  <div class="stats" id="stats" style="display:none;">
    <div class="stat-card">
      <div class="stat-value" id="statWords">0</div>
      <div class="stat-label">原文词数</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statReplacements">0</div>
      <div class="stat-label">黑话替换</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statPuffery">0%</div>
      <div class="stat-label">膨胀系数</div>
    </div>
  </div>

  <button class="dict-toggle" id="dictToggle">📖 查看当前词库</button>
  <div class="dict-panel" id="dictPanel"></div>

  <footer>
    🎭 本工具纯属娱乐，请勿在真实工作中使用 | 保命要紧
  </footer>
</div>

<div class="toast" id="toast">✅ 已复制到剪贴板</div>

<script>
(function() {
  const weeklyDict = [
    ["改了个按钮", "优化了核心用户交互流程"],
    ["改按钮", "重构关键触达节点的视觉体验"],

    ["改需求", "响应业务侧的敏捷迭代诉求"],
    ["没啥进展", "持续推进中，多项工作已取得阶段性成果"],

    ["写文档", "沉淀团队知识资产，赋能组织长期发展"],
    ["看代码", "进行关键技术方案的深度调研"],
    ["帮同事", "提供跨职能技术支持与能力输出"],
    ["延误了", "为保证交付质量进行了必要的排期优化"],
    ["来不及做", "基于资源现状进行优先级动态调整"],
    ["忘了", "在并行任务的高负载下产生了信息同步延迟"],
    ["搞错了", "在快速试错中积累了宝贵的反思经验"],
    ["崩溃了", "系统在极端压力测试下触发了容灾机制"],
    ["失败了", "在一次有价值的探索中收获了关键认知"],
    ["没人做", "当前项目处于人力资源结构性优化阶段"],
    ["太复杂", "该需求的实现存在较高的技术复杂度"],
  ];
  const reportDict = [
    ["摸鱼", "承担了跨业务线的战略规划与资源协调工作"],
    ["划水", "深度参与了多个关键项目的并行支持"],
    ["不知道干啥", "聚焦于团队能力建设与长期技术方向研判"],
    ["没干活", "在多个战略层面上进行优先级评估与资源整合"],
    ["偷懒", "践行高效能工作理念，以最小投入撬动最大产出"],
    ["啥也没做", "为团队的长期可持续发展储备战略级思考"],
    ["没产出", "本阶段的贡献集中在隐性知识沉淀与组织赋能"],
    ["玩手机", "通过碎片化信息获取保持行业前沿敏锐度"],
    ["刷视频", "开展竞品调研与行业趋势动态追踪"],
    ["逛淘宝", "进行采购需求预测与供应链可行性评估"],
    ["看小说", "通过跨领域阅读拓展产品创新的灵感来源"],
    ["睡觉", "在创造性工作中安排必要的认知重启周期"],
    ["迟到", "为优化工作效率进行了弹性工作时间调整"],
    ["早退", "在高效完成既定任务后启动了个人效能复盘"],
    ["请假", "启动了远程协作办公的敏捷实践"],
    ["不加班", "严格践行工作与生活的可持续平衡理念"],
    ["没什么成果", "沉淀了多个维度的隐性资产，将在下一周期集中释放"],
    ["被领导骂了", "接受了一次高强度的管理反馈与成长赋能"],
    ["想离职", "正在重新评估个人职业路径与组织战略的匹配度"],
    ["没涨薪", "当前处于薪酬体系的周期性评估窗口"],
  ];
  const pieDict = [
    ["没钱", "我们正处于价值投资的战略储备期"],
    ["发不出工资", "公司正在推行股权激励为核心的长期激励方案"],
    ["裁员", "进行组织架构的战略性优化重组"],
    ["降薪", "启动全员价值共创与共担机制"],
    ["亏损", "处于战略性投入阶段，为未来增长蓄力"],
    ["没客户", "正在深耕种子用户，打造标杆案例"],
    ["产品烂", "产品处于快速迭代周期，每个版本都在大幅进化"],
    ["要被开了", "公司将为你匹配更合适的成长赛道"],
    ["公司要倒闭", "公司正在进行战略转型与业务模式升级"],
    ["没有年终奖", "年终激励将以更有想象力的方式呈现"],
    ["996", "我们倡导奋斗者文化，为梦想全情投入"],
    ["加班费", "公司提供丰厚的项目激励资源包"],
    ["福利少", "轻量化的福利体系让我们能聚焦于更重要的长期回报"],
    ["涨不了薪", "薪酬体系正在进行对标行业领先水平的全面升级"],
    ["活太多", "你正处在个人能力边界的黄金拓展期"],
    ["干不完", "项目目标具有极强的挑战性，这正是成长的机遇"],
    ["没人了", "我们是一个精干高效的精英化团队"],
    ["技术债", "系统的技术演进方向正在经历战略性重构"],
    ["bug太多", "产品健壮性持续提升中，稳定性曲线呈积极态势"],
    ["项目要黄", "项目进入了关键的价值验证与方向聚焦阶段"],
  ];
  const allDicts = {
    weekly: { title: "📋 周报模式", desc: "把简单工作写成史诗级成就，让你的周报闪闪发光", dict: weeklyDict },
    report: { title: "📊 述职模式", desc: "把摸鱼写成战略级贡献，述职汇报让你躺赢", dict: reportDict },
    pie: { title: "🥮 画饼模式", desc: "把没钱写成宏大愿景，给团队打鸡血的不二法门", dict: pieDict },
    auto: { title: "🤖 智能混合", desc: "自动匹配最优黑话组合，效果最炸裂", dict: [...weeklyDict, ...reportDict, ...pieDict] },
  };
  let currentMode = "weekly";
  const $modeTabs = document.getElementById("modeTabs");
  const $modeDescText = document.getElementById("modeDescText");
  const $inputText = document.getElementById("inputText");
  const $btnTranslate = document.getElementById("btnTranslate");
  const $btnCopy = document.getElementById("btnCopy");
  const $outputSection = document.getElementById("outputSection");
  const $outputLabel = document.getElementById("outputLabel");
  const $outputText = document.getElementById("outputText");
  const $highlightCount = document.getElementById("highlightCount");
  const $stats = document.getElementById("stats");
  const $statWords = document.getElementById("statWords");
  const $statReplacements = document.getElementById("statReplacements");
  const $statPuffery = document.getElementById("statPuffery");
  const $toast = document.getElementById("toast");
  const $dictToggle = document.getElementById("dictToggle");
  const $dictPanel = document.getElementById("dictPanel");
  const $quickExamples = document.getElementById("quickExamples");
  $modeTabs.addEventListener("click", function(e) {
    const tab = e.target.closest(".mode-tab");
    if (!tab) return;
    document.querySelectorAll(".mode-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentMode = tab.dataset.mode;
    const info = allDicts[currentMode];
    $modeDescText.textContent = info.desc;
    doTranslate();
  });
  $quickExamples.addEventListener("click", function(e) {
    const tag = e.target.closest(".quick-tag");
    if (!tag) return;
    $inputText.value = tag.dataset.text;
    doTranslate();
    $inputText.scrollIntoView({ behavior: "smooth", block: "center" });
  });
  $btnTranslate.addEventListener("click", doTranslate);
  $inputText.addEventListener("keydown", function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      doTranslate();
    }
  });
  $btnCopy.addEventListener("click", function() {
    const text = $outputText.textContent;
    if (!text || text === $outputText.dataset.placeholder) return;
    navigator.clipboard.writeText(text).then(function() {
      $toast.classList.add("show");
      setTimeout(function() { $toast.classList.remove("show"); }, 2000);
    }).catch(function() {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      $toast.classList.add("show");
      setTimeout(function() { $toast.classList.remove("show"); }, 2000);
    });
  });
  $dictToggle.addEventListener("click", function() {
    $dictPanel.classList.toggle("show");
    if ($dictPanel.classList.contains("show")) {
      renderDictPanel();
    }
  });
  function doTranslate() {
    var input = $inputText.value.trim();
    if (!input) {
      $outputSection.classList.add("empty");
      $outputLabel.textContent = "";
      $outputText.textContent = "";
      $highlightCount.style.display = "none";
      $stats.style.display = "none";
      return;
    }
    var info = allDicts[currentMode];
    var dict = info.dict;
    var result = input;
    var replaceCount = 0;
    var sortedDict = dict.slice().sort(function(a, b) {
      return b[0].length - a[0].length;
    });
    sortedDict.forEach(function(pair) {
      var from = pair[0];
      var to = pair[1];
      if (result.indexOf(from) !== -1) {
        replaceCount++;
        result = result.split(from).join(to);
      }
    });
    if (replaceCount === 0 && currentMode !== "auto") {
      var prefixes = [
        "本周期重点推进了以下工作：",
        "在核心战场取得关键突破：",
        "围绕战略目标完成了以下事项：",
      ];
      var suffix = getModeSuffix(currentMode);
      result = prefixes[Math.floor(Math.random() * prefixes.length)] + result + suffix;
      replaceCount = 1;
    }
    if (replaceCount === 0 && currentMode === "auto") {
      result = "经过多维度的战略思考，" + result + "相关工作已进入全面赋能阶段。";
      replaceCount = 1;
    }
    $outputSection.classList.remove("empty");
    $outputLabel.textContent = info.title + " 翻译结果";
    $outputText.textContent = result;
    if (replaceCount > 0) {
      $highlightCount.textContent = replaceCount + " 处替换";
      $highlightCount.style.display = "inline-block";
    } else {
      $highlightCount.style.display = "none";
    }
    $stats.style.display = "flex";
    var inputLen = input.length;
    var outputLen = result.length;
    $statWords.textContent = inputLen;
    $statReplacements.textContent = replaceCount;
    var puffery = inputLen > 0 ? Math.round((outputLen - inputLen) / inputLen * 100) : 0;
    $statPuffery.textContent = (puffery >= 0 ? "+" : "") + puffery + "%";
  }
  function getModeSuffix(mode) {
    if (mode === "weekly") {
      return [
        "，整体工作节奏紧凑有序，多项任务已取得阶段性突破，后续将持续跟进以确保项目顺利交付。",
        "，各条线工作稳步推进，核心指标均呈正向趋势，下周将聚焦重点深化执行。",
      ][Math.floor(Math.random() * 2)];
    }
    if (mode === "report") {
      return [
        "，通过上述工作有效赋能了团队整体效能提升，为组织创造了显著的战略价值。",
        "，以上成果充分体现了个人在复杂环境下的综合统筹能力与战略执行力。",
      ][Math.floor(Math.random() * 2)];
    }
    return [
      "，放眼未来，我们正站在一个前所未有的历史机遇窗口，只要坚定信念，胜利就在前方。",
      "，当前的挑战正是我们弯道超车的最佳时机，让我们一起拥抱变化、创造奇迹！",
    ][Math.floor(Math.random() * 2)];
  }
  function renderDictPanel() {
    var info = allDicts[currentMode];
    var html = "";
    info.dict.forEach(function(pair) {
      html += '<div class="dict-row"><span class="dict-from">' + pair[0] + '</span><span class="dict-arrow">→</span><span class="dict-to">' + pair[1] + '</span></div>';
    });
    $dictPanel.innerHTML = html;
  }
  doTranslate();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
