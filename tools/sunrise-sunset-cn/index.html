<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌅 日出日落</title>
<meta name="description" content="查询全球日出日落时间，黄金时刻摄影建议，昼夜时长计算">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.sun-arc{height:200px;position:relative;margin:20px 0;border-bottom:2px solid var(--border)}
.arc-path{position:absolute;width:100%;height:100%}
.sun-position{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--warn);transform:translate(-50%,-50%);box-shadow:0 0 20px var(--warn)}
.horizon-line{position:absolute;bottom:0;width:100%;height:2px;background:var(--border)}
.time-display{position:absolute;bottom:25px;font-size:.8rem;color:var(--text2)}
.time-display.sunrise{left:10%}
.time-display.sunset{right:10%}
.time-display.noon{left:50%;transform:translateX(-50%)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.info-card{background:var(--bg);border-radius:8px;padding:16px;text-align:center}
.info-card .icon{font-size:2rem;margin-bottom:8px}
.info-card .value{font-size:1.3rem;font-weight:700;color:var(--accent)}
.info-card .label{font-size:.8rem;color:var(--text2);margin-top:4px}
.location-select{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.location-btn{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.85rem;transition:all .2s}
.location-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.date-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
.date-nav button{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--text)}
.date-nav button:hover{background:var(--accent);color:#fff}
.date-display{font-size:1.1rem;font-weight:600}
.daylight-bar{height:30px;background:var(--bg);border-radius:15px;position:relative;margin:16px 0;overflow:hidden}
.daylight-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#3b82f6);border-radius:15px;position:absolute}
.daylight-label{position:absolute;top:50%;transform:translateY(-50%);font-size:.75rem;font-weight:600}
.daylight-label.start{left:10px;color:#fff}
.daylight-label.end{right:10px;color:#fff}
.golden-hour{background:rgba(245,158,11,.1);border-radius:8px;padding:12px;margin-top:12px}
.golden-hour .title{font-weight:600;font-size:.9rem;margin-bottom:6px;color:var(--warn)}
.golden-hour .time{font-size:.85rem;color:var(--text2)}
.month-chart{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:12px}
.month-bar{height:60px;background:var(--bg);border-radius:4px;position:relative;overflow:hidden}
.month-bar-fill{position:absolute;bottom:0;width:100%;background:linear-gradient(180deg,var(--warn),var(--accent));border-radius:4px}
.month-label{text-align:center;font-size:.7rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes sunMove{0%{left:10%;bottom:20px}50%{left:50%;bottom:180px}100%{left:90%;bottom:20px}}
.sun-animation{animation:sunMove 10s ease-in-out infinite}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🌅 日出日落">
<meta property="og:description" content="查询全球日出日落时间，黄金时刻摄影建议">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🌅 日出日落</h1><p>查询日出日落时间，规划摄影和户外活动</p></div>

<div class="cd">
<h2>选择地点</h2>
<div class="location-select" id="locationSelect"></div>
</div>

<div class="cd">
<h2>日期选择</h2>
<div class="date-nav">
<button onclick="changeDate(-1)">◀ 上一天</button>
<div class="date-display" id="dateDisplay">2024年1月15日</div>
<button onclick="changeDate(1)">下一天 ▶</button>
</div>
</div>

<div class="cd">
<h2>太阳轨迹</h2>
<div class="sun-arc" id="sunArc">
<div class="horizon-line"></div>
<div class="sun-position sun-animation" id="sunPosition"></div>
<div class="time-display sunrise" id="sunriseTime">06:30</div>
<div class="time-display noon" id="noonTime">12:00</div>
<div class="time-display sunset" id="sunsetTime">17:30</div>
</div>
</div>

<div class="cd">
<h2>今日信息</h2>
<div class="info-grid" id="infoGrid"></div>
</div>

<div class="cd">
<h2>昼夜时长</h2>
<div class="daylight-bar" id="daylightBar"></div>
</div>

<div class="cd">
<h2>黄金时刻</h2>
<div id="goldenHours"></div>
</div>

<div class="cd">
<h2>全年日照时长</h2>
<div class="month-chart" id="monthChart"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const locations=[
  {name:'北京',lat:39.9,lng:116.4,timezone:8},
  {name:'上海',lat:31.2,lng:121.5,timezone:8},
  {name:'广州',lat:23.1,lng:113.3,timezone:8},
  {name:'成都',lat:30.6,lng:104.1,timezone:8},
  {name:'哈尔滨',lat:45.8,lng:126.5,timezone:8},
  {name:'乌鲁木齐',lat:43.8,lng:87.6,timezone:6}
];
let currentLocation=locations[0];
let currentDate=new Date();

function calculateSunTimes(date,location){
  const dayOfYear=Math.floor((date-new Date(date.getFullYear(),0,0))/(86400000));
  const declination=23.45*Math.sin(2*Math.PI*(dayOfYear-81)/365);
  const latRad=location.lat*Math.PI/180;
  const declRad=declination*Math.PI/180;
  const hourAngle=Math.acos(-Math.tan(latRad)*Math.tan(declRad))*180/Math.PI;
  const sunrise=12-hourAngle/15;
  const sunset=12+hourAngle/15;
  const dayLength=sunset-sunrise;
  
  const formatTime=hours=>{
    const h=Math.floor(hours);
    const m=Math.floor((hours-h)*60);
    return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  };
  
  return{
    sunrise:formatTime(sunrise),
    sunset:formatTime(sunset),
    noon:'12:00',
    dayLength:formatTime(dayLength),
    nightLength:formatTime(24-dayLength),
    dayHours:dayLength,
    nightHours:24-dayLength
  };
}

function renderLocations(){
  $('locationSelect').innerHTML=locations.map(l=>`<div class="location-btn ${l.name===currentLocation.name?'active':''}" onclick="selectLocation('${l.name}')">${l.name}</div>`).join('');
}

function selectLocation(name){
  currentLocation=locations.find(l=>l.name===name);
  renderLocations();
  renderAll();
}

function changeDate(delta){
  currentDate.setDate(currentDate.getDate()+delta);
  renderAll();
}

function renderInfo(){
  const sunTimes=calculateSunTimes(currentDate,currentLocation);
  $('infoGrid').innerHTML=`
    <div class="info-card"><div class="icon">🌅</div><div class="value">${sunTimes.sunrise}</div><div class="label">日出时间</div></div>
    <div class="info-card"><div class="icon">🌇</div><div class="value">${sunTimes.sunset}</div><div class="label">日落时间</div></div>
    <div class="info-card"><div class="icon">☀️</div><div class="value">${sunTimes.noon}</div><div class="label">正午时间</div></div>
    <div class="info-card"><div class="icon">⏱️</div><div class="value">${sunTimes.dayLength}</div><div class="label">日照时长</div></div>
    <div class="info-card"><div class="icon">🌙</div><div class="value">${sunTimes.nightLength}</div><div class="label">黑夜时长</div></div>
    <div class="info-card"><div class="icon">📍</div><div class="value">${currentLocation.lat}°N</div><div class="label">纬度</div></div>
  `;
  $('sunriseTime').textContent=sunTimes.sunrise;
  $('sunsetTime').textContent=sunTimes.sunset;
}

function renderDaylightBar(){
  const sunTimes=calculateSunTimes(currentDate,currentLocation);
  const sunriseMinutes=sunTimes.dayHours*60/24*100;
  const sunsetMinutes=(24-sunTimes.nightHours)*60/24*100;
  $('daylightBar').innerHTML=`
    <div class="daylight-fill" style="left:${sunriseMinutes}%;width:${sunsetMinutes-sunriseMinutes}%"></div>
    <div class="daylight-label start">☀️ ${sunTimes.sunrise}</div>
    <div class="daylight-label end">🌙 ${sunTimes.sunset}</div>
  `;
}

function renderGoldenHours(){
  const sunTimes=calculateSunTimes(currentDate,currentLocation);
  const sunriseH=parseFloat(sunTimes.sunrise.split(':')[0]);
  const sunriseM=parseFloat(sunTimes.sunrise.split(':')[1]);
  const sunsetH=parseFloat(sunTimes.sunset.split(':')[0]);
  const sunsetM=parseFloat(sunTimes.sunset.split(':')[1]);
  
  const formatTime=(h,m)=>`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  
  const morningStart=sunriseH*60+sunriseM;
  const morningEnd=morningStart+30;
  const eveningStart=sunsetH*60+sunsetM-30;
  const eveningEnd=sunsetH*60+sunsetM;
  
  $('goldenHours').innerHTML=`
    <div class="golden-hour">
      <div class="title">🌅 晨光黄金时刻</div>
      <div class="time">${formatTime(Math.floor(morningStart/60),morningStart%60)} - ${formatTime(Math.floor(morningEnd/60),morningEnd%60)}（日出前后30分钟）</div>
      <div class="time" style="margin-top:4px">柔和的暖色调光线，适合人像和风景摄影</div>
    </div>
    <div class="golden-hour" style="margin-top:8px">
      <div class="title">🌇 暮光黄金时刻</div>
      <div class="time">${formatTime(Math.floor(eveningStart/60),eveningStart%60)} - ${formatTime(Math.floor(eveningEnd/60),eveningEnd%60)}（日落前后30分钟）</div>
      <div class="time" style="margin-top:4px">温暖的橙红色调，最适合拍摄剪影和全景</div>
    </div>
  `;
}

function renderMonthChart(){
  const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const data=months.map((_,i)=>{
    const date=new Date(currentDate.getFullYear(),i,15);
    const sunTimes=calculateSunTimes(date,currentLocation);
    return sunTimes.dayHours;
  });
  const maxHours=Math.max(...data);
  
  $('monthChart').innerHTML=months.map((m,i)=>{
    const height=(data[i]/maxHours)*100;
    return`<div><div class="month-bar"><div class="month-bar-fill" style="height:${height}%"></div></div><div class="month-label">${m}</div></div>`;
  }).join('');
}

function renderAll(){
  const dateStr=currentDate.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  $('dateDisplay').textContent=dateStr;
  renderInfo();
  renderDaylightBar();
  renderGoldenHours();
  renderMonthChart();
}

renderLocations();
renderAll();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
