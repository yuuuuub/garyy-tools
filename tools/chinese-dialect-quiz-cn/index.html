<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国方言测试</title><meta name="description" content="中国方言测试 - 测试你对方言的了解"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{opacity:.85}.btn-secondary{background:var(--border);color:var(--text)}.hidden{display:none}.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}.mode-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;transition:transform .2s;text-align:center}.mode-card:hover{transform:translateY(-2px);border-color:var(--blue)}.mode-card h3{font-size:1rem;margin-bottom:6px}.mode-card p{font-size:.8rem;color:var(--text2)}.progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;margin-bottom:16px;overflow:hidden}.progress-fill{height:100%;background:var(--blue);border-radius:3px;transition:width .3s}.question-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.q-header{display:flex;justify-content:space-between;margin-bottom:12px}.q-num{font-size:.85rem;color:var(--text2)}.q-dialect{font-size:.75rem;padding:4px 10px;border-radius:12px;background:rgba(59,130,246,.15);color:var(--blue)}.q-text{font-size:1.3rem;font-weight:600;margin-bottom:8px;text-align:center;padding:16px;background:var(--card);border-radius:8px;line-height:1.6}.q-hint{font-size:.85rem;color:var(--text2);text-align:center;margin-bottom:16px}.options{display:flex;flex-direction:column;gap:10px}.option-btn{padding:14px;background:var(--card);border:2px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;cursor:pointer;text-align:left;transition:all .2s}.option-btn:hover{border-color:var(--blue);background:rgba(59,130,246,.1)}.option-btn.correct{border-color:var(--green);background:rgba(35,134,54,.15)}.option-btn.wrong{border-color:var(--red);background:rgba(239,68,68,.15)}.explanation{margin-top:12px;padding:12px;background:rgba(59,130,246,.08);border-radius:8px;font-size:.9rem;color:var(--text2);border-left:3px solid var(--blue)}.flashcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:30px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:all .3s}.flashcard:hover{border-color:var(--blue)}.flashcard .dialect{font-size:2rem;font-weight:700;margin-bottom:8px}.flashcard .meaning{font-size:1.1rem;color:var(--text2);margin-bottom:6px}.flashcard .phonetic{font-size:.9rem;color:var(--blue)}.flashcard .region{font-size:.8rem;color:var(--text2);margin-top:8px}.result-card{text-align:center;padding:30px}.result-card h2{font-size:1.4rem;margin-bottom:10px}.result-card .big-score{font-size:3rem;font-weight:700;color:var(--blue);margin:16px 0}.dialect-breakdown{text-align:left}.dialect-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}.dialect-row:last-child{border:none}.dialect-bar{width:100px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-left:8px}.dialect-bar-fill{height:100%;background:var(--blue);border-radius:3px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}</style><meta property="og:title" content="中国方言测试"><meta property="og:description" content="中国方言测试 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗣️</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🗣️ 中国方言测试</h1><p class="sub">测试你对中国方言的了解</p>
<div id="menuScreen">
<div class="mode-grid">
<div class="mode-card" onclick="startQuiz()"><h3>🎯 方言测试</h3><p>猜猜这句话是哪里的方言</p></div>
<div class="mode-card" onclick="startFlashcard()"><h3>📖 方言卡片</h3><p>学习各地有趣的方言</p></div>
</div>
<div class="card"><h3 style="margin-bottom:8px">📊 你的记录</h3>
<div style="display:flex;gap:16px;font-size:.9rem;color:var(--text2)"><span>已答题: <b id="totalAnswered">0</b></span><span>正确率: <b id="accuracy">0%</b></span></div></div></div>
<div id="quizScreen" class="hidden"></div>
<div id="flashScreen" class="hidden"></div>
</div>
<script src="../i18n.js" defer></script>
<script>
var dialects=[
{text:'雷好',meaning:'你好',dialect:'四川话',phonetic:'léi hǎo',region:'四川',hint:'四川人打招呼的方式'},
{text:'你造吗',meaning:'你知道吗',dialect:'东北话',phonetic:'nǐ zào ma',region:'东北',hint:'东北人常用的口头禅'},
{text:'阿拉',meaning:'我们/我',dialect:'上海话',phonetic:'ā lā',region:'上海',hint:'上海人的自称'},
{text:'靓仔',meaning:'帅哥/小伙子',dialect:'粤语',phonetic:'leng3 zai2',region:'广东',hint:'广东人对男性的称呼'},
{text:'撒子',meaning:'什么',dialect:'四川话',phonetic:'sá zi',region:'四川',hint:'四川人问"什么"'},
{text:'咋整',meaning:'怎么办',dialect:'东北话',phonetic:'zǎ zhěng',region:'东北',hint:'东北人说"怎么办"'},
{text:'搞么子',meaning:'干什么',dialect:'湖南话',phonetic:'gǎo mó zǐ',region:'湖南',hint:'湖南人问"干什么"'},
{text:'得闲',meaning:'有空/有时间',dialect:'粤语',phonetic:'dak1 haan4',region:'广东',hint:'广东人说"有空"'},
{text:'俺',meaning:'我',dialect:'山东话',phonetic:'ǎn',region:'山东',hint:'山东人的自称'},
{text:'咋回事',meaning:'怎么回事',dialect:'河南话',phonetic:'zǎ huí shì',region:'河南',hint:'河南人问"怎么回事"'},
{text:'巴适',meaning:'舒服/好',dialect:'四川话',phonetic:'bā shì',region:'四川',hint:'四川话中形容"舒服"'},
{text:'老铁',meaning:'好朋友/兄弟',dialect:'东北话',phonetic:'lǎo tiě',region:'东北',hint:'东北人对好朋友的称呼'},
{text:'做啥',meaning:'做什么',dialect:'陕西话',phonetic:'zuò shá',region:'陕西',hint:'陕西人问"做什么"'},
{text:'猴赛雷',meaning:'好厉害',dialect:'粤语',phonetic:'hau2 coi3 leoi4',region:'广东',hint:'粤语中"好厉害"的谐音'},
{text:'嘎哈',meaning:'干什么',dialect:'东北话',phonetic:'gà há',region:'东北',hint:'东北人说"干什么"'},
{text:'嬲',meaning:'生气/纠缠',dialect:'湖南话',phonetic:'niǎo',region:'湖南',hint:'湖南方言中一个特别的字'},
{text:'唔该',meaning:'谢谢/劳驾',dialect:'粤语',phonetic:'m4 goi1',region:'广东',hint:'广东人说"谢谢"'},
{text:'额滴神',meaning:'我的天',dialect:'陕西话',phonetic:'é dī shén',region:'陕西',hint:'陕西人的感叹语'},
{text:'杠杠的',meaning:'非常好',dialect:'东北话',phonetic:'gàng gàng de',region:'东北',hint:'东北人形容"非常好"'},
{text:'啥子',meaning:'什么',dialect:'四川话',phonetic:'shá zi',region:'四川',hint:'四川人问"什么"的另一种说法'},
{text:'中',meaning:'行/可以',dialect:'河南话',phonetic:'zhōng',region:'河南',hint:'河南人说"可以"'},
{text:'咋了',meaning:'怎么了',dialect:'山东话',phonetic:'zǎ le',region:'山东',hint:'山东人问"怎么了"'},
{text:'搞咩',meaning:'干什么',dialect:'粤语',phonetic:'gau2 me1',region:'广东',hint:'广东人问"干什么"'},
{text:'晓得',meaning:'知道',dialect:'四川话',phonetic:'xiǎo dé',region:'四川',hint:'四川人说"知道"'},
{text:'嘎嘎',meaning:'肉',dialect:'四川话',phonetic:'gā gā',region:'四川',hint:'四川方言中"肉"的说法'}
];

var quizState={questions:[],current:0,score:0,answers:[]};
var stats={answered:0,correct:0};

function startQuiz(){
  var pool=dialects.slice().sort(function(){return Math.random()-.5});
  quizState={questions:pool.slice(0,10),current:0,score:0,answers:[]};
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion(){
  var qs=document.getElementById('quizScreen');
  if(quizState.current>=quizState.questions.length){renderResult();return}
  var q=quizState.questions[quizState.current];
  var others=dialects.filter(function(d){return d.dialect!==q.dialect});
  var opts=[q.dialect];
  while(opts.length<4){var r=others[Math.floor(Math.random()*others.length)];if(opts.indexOf(r.dialect)===-1)opts.push(r.dialect)}
  opts.sort(function(){return Math.random()-.5});
  var h='<div class="progress-bar"><div class="progress-fill" style="width:'+((quizState.current/quizState.questions.length)*100)+'%"></div></div>';
  h+='<div class="question-card"><div class="q-header"><span class="q-num">第 '+(quizState.current+1)+' / '+quizState.questions.length+' 题</span></div>';
  h+='<div class="q-text">'+q.text+'</div>';
  h+='<div class="q-hint">💡 '+q.hint+'</div>';
  h+='<div class="options" id="quizOptions">';
  opts.forEach(function(o){h+='<button class="option-btn" onclick="checkAnswer(this,\''+o+'\')">'+o+'</button>'});
  h+='</div><div id="explanationBox"></div></div>';
  h+='<button class="btn btn-secondary" onclick="quitQuiz()" style="width:100%">退出测试</button>';
  qs.innerHTML=h;
}

function checkAnswer(el,dialect){
  var q=quizState.questions[quizState.current];
  var correct=dialect===q.dialect;
  stats.answered++;
  if(correct){stats.score++;stats.correct++}
  var btns=document.querySelectorAll('#quizOptions .option-btn');
  btns.forEach(function(b){
    b.onclick=null;
    if(b.textContent===q.dialect)b.classList.add('correct');
    if(b.textContent===dialect&&!correct)b.classList.add('wrong');
  });
  var expHtml='<div class="explanation">'+(correct?'✅ 正确！':'❌ 答错了。正确答案: '+q.dialect)+'<br><b>'+q.text+'</b> 意思是 "'+q.meaning+'"，发音: '+q.phonetic+'</div>';
  document.getElementById('explanationBox').innerHTML=expHtml;
  quizState.answers.push({text:q.text,dialect:q.dialect,yourAnswer:dialect,correct:correct});
  setTimeout(function(){quizState.current++;renderQuestion()},2000);
}

function quitQuiz(){if(confirm('确定退出吗？'))renderResult()}

function renderResult(){
  var qs=document.getElementById('quizScreen');
  var total=quizState.questions.length;
  var pct=Math.round(quizState.score/total*100);
  var grade=pct>=80?'🏆 方言达人':pct>=60?'🌟 还不错':pct>=40?'📖 多学习':'💪 加油';
  var h='<div class="result-card"><h2>'+grade+'</h2>';
  h+='<div class="big-score">'+quizState.score+' / '+total+'</div>';
  h+='<p style="color:var(--text2)">正确率: '+pct+'%</p>';
  h+='<div class="dialect-breakdown card">';
  var dialectStats={};
  quizState.answers.forEach(function(a){
    if(!dialectStats[a.dialect])dialectStats[a.dialect]={correct:0,total:0};
    dialectStats[a.dialect].total++;
    if(a.correct)dialectStats[a.dialect].correct++;
  });
  Object.keys(dialectStats).forEach(function(d){
    var s=dialectStats[d];
    var pct=Math.round(s.correct/s.total*100);
    h+='<div class="dialect-row"><span>'+d+'</span><div class="dialect-bar"><div class="dialect-bar-fill" style="width:'+pct+'%"></div></div><span style="font-size:.8rem;color:var(--text2)">'+s.correct+'/'+s.total+'</span></div>';
  });
  h+='</div><div style="margin-top:16px;display:flex;gap:8px;justify-content:center"><button class="btn btn-primary" onclick="startQuiz()">再来一轮</button><button class="btn btn-secondary" onclick="backToMenu()">返回菜单</button></div></div>';
  qs.innerHTML=h;
  updateStats();
}

function startFlashcard(){
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('flashScreen').classList.remove('hidden');
  renderFlashcard(0);
}

var fcIdx=0;
function renderFlashcard(idx){
  fcIdx=idx;
  var d=dialects[idx];
  var fs=document.getElementById('flashScreen');
  var h='<div class="card" style="text-align:center;margin-bottom:12px"><span style="font-size:.9rem;color:var(--text2)">'+(idx+1)+' / '+dialects.length+'</span></div>';
  h+='<div class="flashcard" onclick="this.querySelector(\'.back\').classList.toggle(\'hidden\');this.querySelector(\'.front\').classList.toggle(\'hidden\')">';
  h+='<div class="front"><div class="dialect">'+d.text+'</div><p style="color:var(--text2);font-size:.85rem">点击翻转查看含义</p></div>';
  h+='<div class="back hidden"><div class="dialect" style="color:var(--green)">'+d.text+'</div><div class="meaning">含义: '+d.meaning+'</div><div class="phonetic">发音: '+d.phonetic+'</div><div class="region">📍 '+d.region+' · '+d.dialect+'</div></div></div>';
  h+='<div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-secondary" onclick="prevFlash()" style="flex:1" '+(idx===0?'disabled':'')+'>← 上一个</button><button class="btn btn-primary" onclick="nextFlash()" style="flex:1">'+(idx<dialects.length-1?'下一个 →':'返回菜单')+'</button></div>';
  fs.innerHTML=h;
}

function prevFlash(){if(fcIdx>0)renderFlashcard(fcIdx-1)}
function nextFlash(){if(fcIdx<dialects.length-1)renderFlashcard(fcIdx+1);else backToMenu()}

function backToMenu(){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('flashScreen').classList.add('hidden');
  document.getElementById('menuScreen').classList.remove('hidden');
}

function updateStats(){
  document.getElementById('totalAnswered').textContent=stats.answered;
  document.getElementById('accuracy').textContent=stats.answered?Math.round(stats.correct/stats.answered*100)+'%':'0%';
}

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input');if(inp)inp.focus()}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur()}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0})</script>
</body></html>
