<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>贪吃蛇圈地</title>
<meta name="description" content="贪吃蛇圈地游戏，占领更多领地击败对手">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
body{background:var(--bg);color:var(--text);font-family:monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100}
#overlay h1{font-size:36px;color:var(--accent);margin-bottom:10px}
#overlay p{font-size:14px;color:#8b949e;margin-bottom:20px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 28px;font-size:15px;border-radius:6px;cursor:pointer;font-family:monospace}
.btn:hover{filter:brightness(1.2)}
canvas{display:block;border:1px solid var(--border);background:#111;border-radius:4px}
#hud{display:flex;gap:20px;margin:10px 0;font-size:13px;color:#8b949e}
#hud b{color:var(--accent)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="贪吃蛇圈地">
  <meta property="og:description" content="贪吃蛇圈地游戏，占领更多领地击败对手">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/snake-zone/">
</head>
<body>
<div id="overlay">
<h1>贪吃蛇圈地</h1>
<p>出圈画线，回到领地占领新地盘！</p>
<p style="font-size:12px">方向键控制 | 领地越大分数越高 | 撞到线或边界即死</p>
<button class="btn" onclick="startGame()">开始圈地</button>
</div>
<div id="hud">
领地: <b id="territory">10</b>% |
分数: <b id="score">0</b> |
AI最大: <b id="aiMax">0</b>%
</div>
<canvas id="gc" width="600" height="600"></canvas>
<script>
const W=600,H=600,G=10,COLS=W/G,ROWS=H/G;
const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
const AI_COUNT=3;
let grid,player,ais,gameOn,timer,food;
const AI_COLORS=['rgba(239,68,68,','rgba(34,197,94,','rgba(168,85,247,'];
function initGrid(){
return Array.from({length:ROWS},()=>Array(COLS).fill(0));
}
function createSnake(isPlayer,x,y,color){
return{
body:[{x,y},{x:x-1,y},{x:x-2,y}],
dir:{x:1,y:0},
color:color||'#3b82f6',
colorAlpha:isPlayer?'rgba(59,130,246,':'rgba(100,100,100,',
isPlayer,
alive:true,
territory:0,
trailing:false,
trail:[],
aiTimer:0
};
}
function countTerritory(grid,color){
let count=0;
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]===color)count++;
return count;
}
function floodFill(grid,sx,sy,fill){
const target=grid[sy][sx];
if(target===fill)return;
const stack=[[sx,sy]];
const visited=new Set();
while(stack.length){
const[x,y]=stack.pop();
const key=x+','+y;
if(visited.has(key))continue;
visited.add(key);
if(x<0||x>=COLS||y<0||y>=ROWS)continue;
if(grid[y][x]!==target)continue;
grid[y][x]=fill;
stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
}
}
function fillTerritory(snake){
const color=snake.color;
snake.body.forEach(b=>{if(b.x>=0&&b.x<COLS&&b.y>=0&&b.y<ROWS)grid[b.y][b.x]=color});
const temp=grid.map(r=>[...r]);
snake.body.forEach(b=>{if(b.x>=0&&b.x<COLS&&b.y>=0&&b.y<ROWS)temp[b.y][b.x]='SNAKE'});
const borderCells=[];
for(let c=0;c<COLS;c++){borderCells.push([c,0],[c,ROWS-1])}
for(let r=0;r<ROWS;r++){borderCells.push([0,r],[COLS-1,r])}
borderCells.forEach(([x,y])=>{if(temp[y][x]!=='SNAKE'&&temp[y][x]!==color)temp[y][x]='OUT'});
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
if(temp[r][c]!=='OUT'&&temp[r][c]!=='SNAKE'&&temp[r][c]!==color)grid[r][c]=color;
}
}
function draw(){
ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
if(grid[r][c]&&grid[r][c]!=='OUT'){
ctx.fillStyle=grid[r][c]==='#3b82f6'?'rgba(59,130,246,0.3)':grid[r][c]==='#ef4444'?'rgba(239,68,68,0.3)':grid[r][c]==='#22c55e'?'rgba(34,197,94,0.3)':grid[r][c]==='#a855f7'?'rgba(168,85,247,0.3)':'rgba(100,100,100,0.3)';
ctx.fillRect(c*G,r*G,G,G);
}
}
[player,...ais].forEach(s=>{
if(!s.alive)return;
s.body.forEach((b,i)=>{
ctx.fillStyle=i===0?s.color:s.colorAlpha+'0.8)';
ctx.fillRect(b.x*G,b.y*G,G,G);
});
s.trail.forEach(t=>{
ctx.fillStyle=s.colorAlpha+'0.5)';
ctx.fillRect(t.x*G,t.y*G,G,G);
});
});
}
function moveSnake(s){
const head={x:s.body[0].x+s.dir.x,y:s.body[0].y+s.dir.y};
s.body.unshift(head);
if(s.trailing){
s.trail.push({...head});
}
const ate=food&&head.x===food.x&&head.y===food.y;
if(ate){
spawnFood();
s.body.push({...s.body[s.body.length-1]});
}
if(!ate)s.body.pop();
}
function checkDeath(s){
const h=s.body[0];
if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS)return true;
const allBodies=[];
[player,...ais].forEach(o=>{
if(o===s)return;
if(o.alive)allBodies.push(...o.body);
});
if(grid[h.y][h.x]!==s.color&&grid[h.y][h.x]!==0){
if(allBodies.some(b=>b.x===h.x&&b.y===h.y))return true;
}
if(s.trail.some(t=>t.x===h.x&&t.y===h.y))return true;
return false;
}
function aiControl(s){
if(s.isPlayer||!s.alive)return;
s.aiTimer++;
if(s.aiTimer<2)return;
s.aiTimer=0;
const head=s.body[0];
const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
const valid=dirs.filter(d=>!(d.x===-s.dir.x&&d.y===-s.dir.y));
let target=null;
if(s.trailing){
let minDist=999;
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
if(grid[r][c]===s.color){
const d=Math.abs(c-head.x)+Math.abs(r-head.y);
if(d<minDist&&d>0){minDist=d;target={x:c,y:r}}
}
}
}
const terr=countTerritory(grid,s.color);
const total=ROWS*COLS;
if(!s.trailing&&terr>total*0.5){
s.trailing=true;
}
let best=null,bestScore=-999;
valid.forEach(d=>{
const nx=head.x+d.x,ny=head.y+d.y;
if(nx<0||nx>=COLS||ny<0||ny>=ROWS){return}
let sc=0;
if(target)sc-=(Math.abs(nx-target.x)+Math.abs(ny-target.y));
if(food)sc-=(Math.abs(nx-food.x)+Math.abs(ny-food.y))*0.5;
[player,...ais].forEach(o=>{
if(o!==s&&o.alive&&o.body.some(b=>b.x===nx&&b.y===ny))sc-=100;
});
if(grid[ny][nx]===s.color)sc+=5;
if(sc>bestScore){bestScore=sc;best=d}
});
if(best)s.dir=best;
else s.dir=valid[Math.floor(Math.random()*valid.length)];
}
function spawnFood(){
food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
}
function gameLoop(){
if(!gameOn)return;
[player,...ais].forEach(aiControl);
[player,...ais].forEach(s=>{
if(!s.alive)return;
moveSnake(s);
if(checkDeath(s)){s.alive=false;return}
});
[player,...ais].forEach(s=>{if(s.alive)fillTerritory(s)});
const aliveCount=[player,...ais].filter(s=>s.alive).length;
if(aliveCount<=1)endGame();
draw();updateHUD();
timer=setTimeout(gameLoop,120);
}
function updateHUD(){
const terr=countTerritory(grid,'#3b82f6');
const total=ROWS*COLS;
document.getElementById('territory').textContent=Math.round(terr/total*100);
document.getElementById('score').textContent=terr;
let maxAI=0;
ais.forEach(a=>{if(a.alive){const t=countTerritory(grid,a.color);if(t>maxAI)maxAI=t}});
document.getElementById('aiMax').textContent=Math.round(maxAI/total*100);
}
function startGame(){
document.getElementById('overlay').style.display='none';
grid=initGrid();
player=createSnake(true,10,10,'#3b82f6');
ais=[];
const colors=['#ef4444','#22c55e','#a855f7'];
for(let i=0;i<AI_COUNT;i++){
ais.push(createSnake(false,COLS-10-i*8,ROWS-10-i*5,colors[i]));
}
[player,...ais].forEach(s=>{
s.body.forEach(b=>{grid[b.y][b.x]=s.color});
});
spawnFood();
gameOn=true;gameLoop();
}
function endGame(){
gameOn=false;
const winner=[player,...ais].find(s=>s.alive)||player;
const ov=document.getElementById('overlay');ov.style.display='flex';
const terr=Math.round(countTerritory(grid,'#3b82f6')/(ROWS*COLS)*100);
if(player.alive){
ov.innerHTML=`<h1>圈地成功！</h1><p>你的领地: ${terr}%</p><button class="btn" onclick="startGame()">再来一局</button>`;
}else{
ov.innerHTML=`<h1>你被淘汰了</h1><p>你的领地: ${terr}%</p><button class="btn" onclick="startGame()">再来一局</button>`;
}
}
document.addEventListener('keydown',e=>{
if(!gameOn||!player.alive)return;
e.preventDefault();
const d=player.dir;
if((e.key==='ArrowUp'||e.key==='w')&&d.y!==1)player.dir={x:0,y:-1};
else if((e.key==='ArrowDown'||e.key==='s')&&d.y!==-1)player.dir={x:0,y:1};
else if((e.key==='ArrowLeft'||e.key==='a')&&d.x!==1)player.dir={x:-1,y:0};
else if((e.key==='ArrowRight'||e.key==='d')&&d.x!==-1)player.dir={x:1,y:0};
});
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
