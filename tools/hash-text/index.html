      for(j=0;j<16;j++)W[j]=BigInt(M[j*8])<<56n|BigInt(M[j*8+1])<<48n|BigInt(M[j*8+2])<<40n|BigInt(M[j*8+3])<<32n|BigInt(M[j*8+4])<<24n|BigInt(M[j*8+5])<<16n|BigInt(M[j*8+6])<<8n|BigInt(M[j*8+7]);
      for(j=16;j<80;j++){
        var s0=rightrotate(W[j-15],1n)^rightrotate(W[j-15],8n)^(W[j-15]>>7n);
        var s1=rightrotate(W[j-2],19n)^rightrotate(W[j-2],61n)^(W[j-2]>>6n);
        W[j]=(W[j-16]+s0+W[j-7]+s1)&0xffffffffffffffffn;
      }
      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(j=0;j<80;j++){
        var S1=rightrotate(e,14n)^rightrotate(e,18n)^rightrotate(e,41n);
        var ch=(e&f)^(~e&g);
        var temp1=(h+S1+ch+K[j]+W[j])&0xffffffffffffffffn;
        var S0=rightrotate(a,28n)^rightrotate(a,34n)^rightrotate(a,39n);
        var maj=(a&b)^(a&c)^(b&c);
        var temp2=(S0+maj)&0xffffffffffffffffn;
        h=g;g=f;f=e;e=(d+temp1)&0xffffffffffffffffn;d=c;c=b;b=a;a=(temp1+temp2)&0xffffffffffffffffn;
      }
      H[0]=(H[0]+a)&0xffffffffffffffffn;H[1]=(H[1]+b)&0xffffffffffffffffn;H[2]=(H[2]+c)&0xffffffffffffffffn;H[3]=(H[3]+d)&0xffffffffffffffffn;
      H[4]=(H[4]+e)&0xffffffffffffffffn;H[5]=(H[5]+f)&0xffffffffffffffffn;H[6]=(H[6]+g)&0xffffffffffffffffn;H[7]=(H[7]+h)&0xffffffffffffffffn;
    }
    return H.map(function(v){return('0000000000000000'+v.toString(16)).slice(-16);}).join('');
  }
  return sha512(str);
}
