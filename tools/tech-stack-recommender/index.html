<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技术栈推荐器</title>
<meta name="description" content="根据项目需求智能推荐最合适的技术栈组合">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.6rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:16px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.9rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
input,select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hidden{display:none!important}
.option-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.option{padding:12px;border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;transition:all .2s;font-size:.85rem}
.option:hover{border-color:var(--accent)}
.option.selected{border-color:var(--accent);background:rgba(59,130,246,.1)}
.option .icon{font-size:1.5rem;margin-bottom:4px}
.option .name{font-weight:600;font-size:.9rem}
.option .desc{font-size:.75rem;color:var(--text2);margin-top:2px}
.rec-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.rec-header{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.rec-header b{font-size:.9rem}
.rec-body{padding:12px 16px}
.rec-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.rec-row:last-child{border-bottom:none}
.rec-label{min-width:80px;font-size:.8rem;color:var(--text2);font-weight:600}
.rec-tech{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tech-badge{padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s}
.tech-badge:hover{border-color:var(--accent);color:var(--accent)}
.score{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:10px;font-size:.78rem;font-weight:600}
.score-high{background:rgba(63,185,80,.2);color:var(--green)}
.score-mid{background:rgba(210,153,34,.2);color:var(--yellow)}
.score-low{background:rgba(248,81,73,.2);color:var(--red)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;background:rgba(59,130,246,.15);color:var(--accent2);margin:2px}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.detail-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.detail-content{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.pros-cons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.pros,.cons{font-size:.85rem}
.pros b{color:var(--green)}
.cons b{color:var(--red)}
.pros li,.cons li{margin:4px 0;font-size:.82rem}
@media(max-width:600px){body{padding:10px}h1{font-size:1.3rem}.option-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="技术栈推荐器">
<meta property="og:description" content="根据项目需求智能推荐最合适的技术栈组合">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🛠 技术栈推荐器';
const APP=document.getElementById('app');

let step=0;
let projectType='';
let scale='';
let features=new Set();
let teamSize='';
let recommendations=[];
let showDetail=-1;

const PROJECT_TYPES=[
  {id:'website',icon:'🌐',name:'网站/Web应用',desc:'前端为主的网站'},
  {id:'saas',icon:'☁️',name:'SaaS平台',desc:'多租户云服务'},
  {id:'mobile',icon:'📱',name:'移动应用',desc:'iOS/Android应用'},
  {id:'ecommerce',icon:'🛒',name:'电商平台',desc:'在线商城'},
  {id:'api',icon:'🔌',name:'API服务',desc:'后端微服务'},
  {id:'data',icon:'📊',name:'数据平台',desc:'数据分析/可视化'},
  {id:'ai',icon:'🤖',name:'AI应用',desc:'机器学习/深度学习'},
  {id:'game',icon:'🎮',name:'游戏',desc:'网页/移动端游戏'},
];

const SCALES=[
  {id:'mini',name:'小型',desc:'1-3人，1-2周'},
  {id:'small',name:'中小型',desc:'3-5人，1-2月'},
  {id:'medium',name:'中型',desc:'5-15人，3-6月'},
  {id:'large',name:'大型',desc:'15+人，6月+'},
];

const FEATURES=[
  {id:'auth',name:'用户认证',category:'核心'},
  {id:'payment',name:'支付集成',category:'核心'},
  {id:'realtime',name:'实时通信',category:'核心'},
  {id:'cms',name:'内容管理',category:'核心'},
  {id:'search',name:'全文搜索',category:'功能'},
  {id:'notification',name:'消息推送',category:'功能'},
  {id:'analytics',name:'数据分析',category:'功能'},
  {id:'i18n',name:'国际化',category:'功能'},
  {id:'admin',name:'管理后台',category:'功能'},
  {id:'ssr',name:'服务端渲染',category:'性能'},
  {id:'pwa',name:'PWA支持',category:'性能'},
  {id:'cache',name:'缓存层',category:'性能'},
];

const TECH_DB={
  frontend:[
    {name:'React',desc:'最流行的UI库',pros:['生态庞大','社区活跃','灵活度高'],cons:['需要自行选型','学习曲线'],tags:['Web','SPA','SSR']},
    {name:'Vue 3',desc:'渐进式框架',pros:['易上手','中文友好','Composition API'],cons:['大型项目需规划','TypeScript支持'],tags:['Web','SPA','SSR']},
    {name:'Next.js',desc:'React全栈框架',pros:['SSR/SSG','API Routes','部署简单'],cons:['较重','Vercel依赖'],tags:['Web','SSR','Fullstack']},
    {name:'Nuxt 3',desc:'Vue全栈框架',pros:['SSR/SSG','自动导入','Nitro引擎'],cons:['生态较Next.js小'],tags:['Web','SSR','Fullstack']},
    {name:'React Native',desc:'跨平台移动开发',pros:['一套代码','原生性能','热更新'],cons:['原生桥接复杂'],tags:['Mobile','Cross-platform']},
    {name:'Flutter',desc:'Google跨平台框架',pros:['高性能','一套代码','UI一致性'],cons:['体积大','Web支持一般'],tags:['Mobile','Cross-platform','Web']},
    {name:'Svelte',desc:'编译时框架',pros:['体积小','性能极佳','语法简洁'],cons:['生态较小','IDE支持'],tags:['Web','SPA']},
    {name:'Solid.js',desc:'细粒度响应式',pros:['性能最佳','体积小','JSX'],cons:['生态小','学习资源少'],tags:['Web','SPA']},
  ],
  backend:[
    {name:'Node.js',desc:'JavaScript运行时',pros:['前后端统一','npm生态','异步IO'],cons:['CPU密集型弱'],tags:['API','Realtime','Fullstack']},
    {name:'Go',desc:'高性能后端语言',pros:['极高并发','编译快','部署简单'],cons:['生态不如Node.js'],tags:['API','Microservice','High Performance']},
    {name:'Python/Django',desc:'全功能Web框架',pros:['开发快速','ORM强大','Admin自带'],cons:['性能一般','GIL限制'],tags:['API','CMS','Data']},
    {name:'Python/FastAPI',desc:'高性能Python API',pros:['异步支持','自动文档','类型安全'],cons:['较新','ORM需另选'],tags:['API','Data','ML']},
    {name:'Java/Spring Boot',desc:'企业级框架',pros:['成熟稳定','生态庞大','微服务支持'],cons:['较重','启动慢'],tags:['Enterprise','API','Microservice']},
    {name:'Rust/Actix',desc:'系统级性能',pros:['零成本抽象','极高性能','内存安全'],cons:['学习曲线陡'],tags:['High Performance','API']},
    {name:'Go/Gin',desc:'轻量级Go框架',pros:['高性能','简洁','中间件丰富'],cons:['功能需自行扩展'],tags:['API','Microservice']},
  ],
  database:[
    {name:'PostgreSQL',desc:'功能最强的RDBMS',pros:['JSON支持','扩展强','ACID完整'],cons:['运维复杂'],tags:['RDBMS','JSON','Full-text']},
    {name:'MySQL',desc:'最流行的RDBMS',pros:['广泛使用','工具丰富','性能好'],cons:['JSON支持弱'],tags:['RDBMS','Web']},
    {name:'MongoDB',desc:'文档数据库',pros:['灵活Schema','水平扩展','JSON原生'],cons:['事务支持弱','内存占用'],tags:['Document','NoSQL','Flexible']},
    {name:'Redis',desc:'内存数据库',pros:['极快速度','数据结构丰富','发布订阅'],cons:['内存限制','持久化'],tags:['Cache','Queue','Realtime']},
    {name:'SQLite',desc:'嵌入式数据库',pros:['零配置','单文件','性能好'],concurrent:['不支持并发写入'],tags:['Embedded','Mobile','Testing']},
  ],
  infra:[
    {name:'Docker',desc:'容器化',pros:['环境一致','部署简单','微服务基础'],cons:['学习成本'],tags:['Container','DevOps']},
    {name:'Kubernetes',desc:'容器编排',pros:['自动扩缩','高可用','服务发现'],cons:['复杂度高','运维成本'],tags:['Container','Scaling','Enterprise']},
    {name:'Cloudflare Workers',desc:'边缘计算',pros:['全球CDN','冷启动快','免费额度'],cons:['API限制','调试困难'],tags:['Serverless','Edge','CDN']},
    {name:'Vercel',desc:'前端部署平台',pros:['零配置','预览部署','Analytics'],cons:['费用高','Vendor Lock-in'],tags:['Deploy','SSR','Frontend']},
    {name:'AWS',desc:'云服务巨头',pros:['服务最全','全球部署','企业级'],cons:['复杂度高','费用管理'],tags:['Cloud','Enterprise','Full Stack']},
    {name:'Supabase',desc:'开源Firebase替代',pros:['PostgreSQL','实时订阅','Auth内置'],cons:['规模限制','自托管复杂'],tags:['BaaS','Realtime','Auth']},
  ]
};

function getRecommendations(){
  let recs=[];
  const t=projectType,s=scale,f=[...features];

  // Frontend recommendations
  let feScores={};
  TECH_DB.frontend.forEach(t=>{
    let score=0;
    if(t.tags.includes('Mobile')&&(s==='mobile'))score+=30;
    if(t.tags.includes('SSR')&&(s==='saas'||s==='ecommerce'||s==='website'))score+=20;
    if(t.tags.includes('Fullstack'))score+=15;
    if(t.name==='React'||t.name==='Vue 3')score+=10;
    if(t.tags.includes('Cross-platform')&&s==='mobile')score+=25;
    feScores[t.name]={score:Math.min(score,100),tech:t};
  });
  let feSorted=Object.values(feScores).sort((a,b)=>b.score-a.score);
  recs.push({label:'前端框架',techs:feSorted.slice(0,3)});

  // Backend recommendations
  let beScores={};
  TECH_DB.backend.forEach(t=>{
    let score=0;
    if(t.tags.includes('ML')&&s==='ai')score+=30;
    if(t.tags.includes('High Performance')&&(s==='api'||s==='data'))score+=20;
    if(t.tags.includes('Enterprise')&&(s==='saas'))score+=25;
    if(t.tags.includes('Fullstack'))score+=10;
    if(t.tags.includes('Realtime')&&f.includes('realtime'))score+=20;
    beScores[t.name]={score:Math.min(score,100),tech:t};
  });
  let beSorted=Object.values(beScores).sort((a,b)=>b.score-a.score);
  recs.push({label:'后端技术',techs:beSorted.slice(0,3)});

  // Database
  let dbScores={};
  TECH_DB.database.forEach(t=>{
    let score=0;
    if(t.tags.includes('Cache')&&f.includes('realtime'))score+=25;
    if(t.tags.includes('Document')&&f.includes('cms'))score+=20;
    if(t.tags.includes('RDBMS')&&(s==='saas'||s==='ecommerce'))score+=20;
    if(t.tags.includes('Flexible')&&s==='ai')score+=15;
    dbScores[t.name]={score:Math.min(score,100),tech:t};
  });
  let dbSorted=Object.values(dbScores).sort((a,b)=>b.score-a.score);
  recs.push({label:'数据库',techs:dbSorted.slice(0,3)});

  // Infrastructure
  let infScores={};
  TECH_DB.infra.forEach(t=>{
    let score=0;
    if(t.tags.includes('Enterprise')&&scale==='large')score+=25;
    if(t.tags.includes('Serverless')&&scale==='mini')score+=20;
    if(t.tags.includes('Scaling')&&(scale==='large'||scale==='medium'))score+=20;
    if(t.tags.includes('Frontend')&&t.name==='Vercel')score+=15;
    infScores[t.name]={score:Math.min(score,100),tech:t};
  });
  let infSorted=Object.values(infScores).sort((a,b)=>b.score-a.score);
  recs.push({label:'基础设施',techs:infSorted.slice(0,3)});

  return recs;
}

function render(){
  let h=`<h1>🛠 技术栈推荐器</h1><p class="subtitle">根据项目需求推荐最佳技术组合</p>`;
  if(step===0){
    h+=`<div class="card"><label>项目类型</label><div class="option-grid">`;
    PROJECT_TYPES.forEach(p=>{h+=`<div class="option ${projectType===p.id?'selected':''}" onclick="projectType='${p.id}';step=1;render()"><div class="icon">${p.icon}</div><div class="name">${p.name}</div><div class="desc">${p.desc}</div></div>`});
    h+=`</div></div>`;
  } else if(step===1){
    h+=`<div class="card"><label>项目规模</label><div class="option-grid">`;
    SCALES.forEach(s=>{h+=`<div class="option ${scale===s.id?'selected':''}" onclick="scale='${s.id}';step=2;render()"><div class="name">${s.name}</div><div class="desc">${s.desc}</div></div>`});
    h+=`</div></div>`;
  } else if(step===2){
    h+=`<div class="card"><label>所需功能（可多选）</label><div class="option-grid">`;
    FEATURES.forEach(f=>{h+=`<div class="option ${features.has(f.id)?'selected':''}" onclick="toggleFeature('${f.id}')"><div class="name">${f.name}</div><div class="desc">${f.category}</div></div>`});
    h+=`</div><button class="btn" onclick="step=3;recommendations=getRecommendations();render()">生成推荐</button><button class="btn btn-outline" style="margin-left:8px" onclick="step=0;render()">重新开始</button></div>`;
  } else if(step===3){
    h+=`<div class="card"><div class="flex" style="justify-content:space-between"><button class="btn btn-sm btn-outline" onclick="step=2;render()">← 返回修改</button><button class="btn btn-sm" onclick="step=0;render()">重新开始</button></div></div>`;
    recommendations.forEach((rec,ri)=>{
      h+=`<div class="rec-card"><div class="rec-header"><b>${rec.label}</b></div><div class="rec-body"><div class="rec-row"><div class="rec-tech">`;
      rec.techs.forEach((t,ti)=>{
        let scoreClass=t.score>=60?'score-high':t.score>=30?'score-mid':'score-low';
        h+=`<div class="tech-badge" onclick="showDetailDialog('${t.tech.name}')"><span class="score ${scoreClass}">${t.score}分</span> ${t.tech.name}</div>`;
      });
      h+=`</div></div></div></div>`;
    });
    let allTechs=recommendations.flatMap(r=>r.techs.map(t=>t.tech.name));
    h+=`<div class="card"><b>推荐组合</b><div style="margin-top:8px">`;
    allTechs.forEach(t=>{h+=`<span class="tag">${t}</span>`});
    h+=`</div><div style="margin-top:12px"><button class="btn btn-sm btn-outline" onclick="copyStack()">复制技术栈</button><button class="btn btn-sm btn-outline" style="margin-left:8px" onclick="saveStack()">保存</button></div></div>`;
  }

  if(showDetail>=0){
    let tech=TECH_DB.frontend.concat(TECH_DB.backend,TECH_DB.database,TECH_DB.infra).find(t=>t.name===showDetail);
    if(tech){
      h+=`<div class="detail-modal" onclick="showDetail=-1;render()"><div class="detail-content" onclick="event.stopPropagation()"><div class="flex-between"><b>${tech.name}</b><button class="btn btn-sm btn-outline" onclick="showDetail=-1;render()">×</button></div><p style="color:var(--text2);margin:8px 0;font-size:.9rem">${tech.desc}</p><div class="pros-cons"><div class="pros"><b>优点</b><ul>${(tech.pros||[]).map(p=>`<li>${p}</li>`).join('')}</ul></div><div class="cons"><b>缺点</b><ul>${(tech.cons||[]).map(c=>`<li>${c}</li>`).join('')}</ul></div></div><div style="margin-top:12px">${(tech.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></div>`;
    }
  }

  APP.innerHTML=h;
}

function toggleFeature(id){features.has(id)?features.delete(id):features.add(id);render()}
function showDetailDialog(name){let idx=TECH_DB.frontend.concat(TECH_DB.backend,TECH_DB.database,TECH_DB.infra).findIndex(t=>t.name===name);showDetail=idx>=0?name:-1;render()}

function copyStack(){
  let stack=recommendations.map(r=>r.label+': '+r.techs.map(t=>t.tech.name).join(', ')).join('\n');
  navigator.clipboard.writeText(stack);alert('已复制到剪贴板');
}

function saveStack(){
  let saved=JSON.parse(localStorage.getItem('tech_stacks')||'[]');
  saved.push({date:new Date().toLocaleDateString('zh-CN'),project:PROJECT_TYPES.find(p=>p.id===projectType)?.name||projectType,scale:SCALES.find(s=>s.id===scale)?.name||scale,stack:recommendations.map(r=>({label:r.label,techs:r.techs.map(t=>t.tech.name)}))});
  localStorage.setItem('tech_stacks',JSON.stringify(saved));alert('已保存');
}

render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
