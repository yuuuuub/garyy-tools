<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌬️ 中医呼吸功法</title>
<meta property="og:title" content="🌬️ 中医呼吸功法">
<meta property="og:description" content="中医呼吸养生功法，腹式呼吸、六字诀、吐纳功等 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="中医呼吸养生功法，腹式呼吸、六字诀、吐纳功等">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌬️</text></svg>">
<meta name="robots" content="index, follow">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}.tag.b{background:rgba(59,130,246,.15);color:var(--blue)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.detail{display:none}.detail.active{display:block}
.step{padding:10px;border-left:3px solid var(--accent);margin-bottom:8px;background:var(--bg);border-radius:0 8px 8px 0}
.step-num{font-weight:700;color:var(--accent);margin-right:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{padding:12px;background:var(--bg);border-radius:8px}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border)}
.log-date{color:var(--text2);font-size:.85rem}
.breath-circle{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.3),rgba(59,130,246,.1));margin:20px auto;display:flex;align-items:center;justify-content:center;transition:transform .1s ease;position:relative}
.breath-circle::after{content:'';position:absolute;width:100%;height:100%;border-radius:50%;border:2px solid var(--accent);opacity:.5}
.breath-circle.inhale{transform:scale(1.3)}
.breath-circle.hold{transform:scale(1.3)}
.breath-circle.exhale{transform:scale(0.8)}
.breath-label{font-size:1.2rem;font-weight:600;color:var(--accent)}
.breath-counter{font-size:2rem;font-weight:700;color:var(--accent);text-align:center}
.round-display{font-size:.9rem;color:var(--text2);text-align:center;margin-top:8px}
.control-row{display:flex;gap:8px;justify-content:center;margin:12px 0}
.adjust-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center}
.adjust-btn:hover{border-color:var(--accent)}
.time-display{text-align:center;font-size:1.5rem;font-weight:600;color:var(--accent)}
.time-label{text-align:center;font-size:.75rem;color:var(--text2)}
</style>
</head>
<body>
<div class="ctn">
<div class="hdr">
<h1>🌬️ 中医呼吸功法</h1>
<p>吐故纳新，调息养气</p>
</div>

<div class="tab-bar" id="tabs">
<div class="tab active" data-tab="exercises">呼吸功法</div>
<div class="tab" data-tab="detail">功法详解</div>
<div class="tab" data-tab="practice">练习计时</div>
<div class="tab" data-tab="record">健康记录</div>
</div>

<div id="view-exercises" class="detail active">
<div class="cd">
<h2>📋 呼吸功法</h2>
<div id="exercise-list"></div>
</div>
</div>

<div id="view-detail" class="detail">
<div class="cd" id="detail-card" style="display:none">
<h2 id="det-title">功法详情</h2>
<div id="det-content"></div>
<button onclick="startPractice()" style="width:100%;margin-top:12px">开始练习</button>
</div>
<div class="cd" id="detail-empty"><div class="empty">请从呼吸功法列表中选择一项</div></div>
</div>

<div id="view-practice" class="detail">
<div class="cd">
<h2>⏱️ 练习计时</h2>
<div id="breath-params"></div>
<div class="breath-circle" id="breath-circle">
<div class="breath-label" id="breath-label">准备</div>
</div>
<div class="breath-counter" id="breath-counter">0</div>
<div class="round-display" id="round-display">第 0 / 0 轮</div>
<div style="text-align:center;margin-top:12px">
<button onclick="toggleBreathing()" id="breath-btn">开始练习</button>
<button class="sec" onclick="stopBreathing()" style="margin-left:8px">停止</button>
</div>
</div>
</div>

<div id="view-record" class="detail">
<div class="cd">
<h2>📊 练习统计</h2>
<div class="stats">
<div class="stat"><div class="stat-num" id="total-sessions">0</div><div class="stat-label">总次数</div></div>
<div class="stat"><div class="stat-num" id="total-minutes">0</div><div class="stat-label">总分钟</div></div>
<div class="stat"><div class="stat-num" id="streak-days">0</div><div class="stat-label">连续天数</div></div>
</div>
</div>
<div class="cd">
<h2>📅 近期记录</h2>
<div id="recent-records"></div>
</div>
</div>
</div>

<script>
const exercises = [
  {name:'腹式呼吸',desc:'通过腹部的起伏进行深长呼吸，是最基础的呼吸功法。吸气时腹部隆起，呼气时腹部凹陷。',difficulty:'简单',inhale:4,hold:0,exhale:6,rounds:10,benefits:['增强肺活量','按摩内脏','放松身心','改善消化'],steps:['仰卧或舒适坐姿，一手放胸口一手放腹部','鼻吸气4秒，感受腹部隆起','口呼气6秒，感受腹部凹陷','胸口尽量不动','重复10次为一组']},
  {name:'逆腹式呼吸',desc:'与腹式呼吸相反，吸气时腹部内收，呼气时腹部外凸。难度较高但效果更强。',difficulty:'中等',inhale:4,hold:2,exhale:6,rounds:8,benefits:['增强核心力量','提升内气','强化丹田','改善体态'],steps:['舒适坐姿，全身放松','鼻吸气4秒，同时腹部内收','屏息2秒','口呼气6秒，同时腹部外凸','意守丹田','重复8次为一组']},
  {name:'六字诀呼吸',desc:'通过嘘、呵、呼、呬、吹、嘻六个字的发音来调理脏腑。每个字对应一个脏腑。',difficulty:'中等',inhale:4,hold:0,exhale:8,rounds:6,benefits:['调理脏腑','平衡阴阳','疏通经络','调和气血'],steps:['吸气4秒（鼻子）','嘘字诀（肝）：两唇微合，慢慢呼出','呵字诀（心）：口半张，慢慢呼出','呼字诀（脾）：撮口如管，慢慢呼出','呬字诀（肺）：上下齿对合，慢慢呼出','吹字诀（肾）：嘴角后引，慢慢呼出','嘻字诀（三焦）：嘴角后引，慢慢呼出','每字6次为一组']},
  {name:'吐纳功',desc:'道家传统呼吸法，强调"吐故纳新"，通过有意识的呼吸控制来修炼内气。',difficulty:'中等',inhale:6,hold:4,exhale:8,rounds:8,benefits:['修炼内气','增强体质','延年益寿','提升精力'],steps:['盘腿坐姿，脊柱挺直','鼻缓慢吸气6秒，意想清气入体','屏息4秒，意想清气充实全身','口缓慢呼气8秒，意想浊气排出','意守丹田','重复8次为一组']},
  {name:'胎息法',desc:'高级呼吸法，模拟胎儿在母体中的呼吸状态。呼吸极其微弱，几乎看不到胸腹起伏。',difficulty:'高级',inhale:8,hold:6,exhale:10,rounds:6,benefits:['深度放松','培养元气','延缓衰老','增强免疫'],steps:['深度放松，全身松软','将呼吸逐渐放慢、放轻','吸气8秒，极其缓慢轻柔','屏息6秒','呼气10秒，几乎无声音','呼吸微弱到几乎感觉不到']},
  {name:'站桩呼吸',desc:'结合站桩姿势进行呼吸练习，培养内气、增强下肢力量。',difficulty:'中等',inhale:4,hold:2,exhale:6,rounds:10,benefits:['培养内气','稳定身心','增强下肢','疏通经络'],steps:['两脚开立与肩同宽，膝盖微曲','两臂环抱于胸前','鼻吸气4秒，意想天地之气入体','屏息2秒，气沉丹田','口呼气6秒，意想浊气下沉','重复10次为一组']},
  {name:'打坐调息',desc:'配合打坐姿势进行呼吸调节，是静坐冥想的基础功法。',difficulty:'简单',inhale:4,hold:0,exhale:6,rounds:10,benefits:['安定心神','调和气血','改善睡眠','培养定力'],steps:['盘腿坐姿，脊柱挺直','双手结定印放于脐下','闭眼，放松全身','鼻吸气4秒','口呼气6秒','专注于呼吸的出入']},
  {name:'八段锦呼吸',desc:'配合八段锦动作的呼吸方法，动作与呼吸协调配合。',difficulty:'中等',inhale:4,hold:0,exhale:6,rounds:8,benefits:['协调身心','调理脏腑','强身健体','疏通经络'],steps:['起势：两臂前举时吸气','下落时呼气','每个动作配合一次呼吸','动作缓慢，呼吸均匀','意随形走，气随意行','整套约15-20分钟']}
];

let currentExercise = null;
let breathPhase = 'idle';
let breathTimer = null;
let breathCount = 0;
let currentRound = 0;
let isBreathing = false;
let sessionStart = 0;

function loadData() { return JSON.parse(localStorage.getItem('breathing-data') || '{"records":[]}'); }
function saveData(d) { localStorage.setItem('breathing-data', JSON.stringify(d)); }

function renderExerciseList() {
  document.getElementById('exercise-list').innerHTML = exercises.map((e, i) => `
    <div class="li" onclick="showDetail(${i})">
      <div><strong>${e.name}</strong><br><span style="color:var(--text2);font-size:.85rem">${e.difficulty} · 吸${e.inhale}s 屏${e.hold}s 呼${e.exhale}s</span></div>
      <span class="tag s">${e.benefits.length}种功效</span>
    </div>
  `).join('');
}

function showDetail(i) {
  currentExercise = i;
  const e = exercises[i];
  document.getElementById('detail-card').style.display = 'block';
  document.getElementById('detail-empty').style.display = 'none';
  document.getElementById('det-title').textContent = e.name;
  document.getElementById('det-content').innerHTML = `
    <p style="margin-bottom:12px;color:var(--text2)">${e.desc}</p>
    <div style="margin-bottom:8px"><span class="tag s">${e.difficulty}</span> <span class="tag w" style="margin-left:4px">吸${e.inhale}s 屏${e.hold}s 呼${e.exhale}s · ${e.rounds}轮</span></div>
    <div style="margin-bottom:12px"><strong>功效：</strong>${e.benefits.map(b => `<span class="tag s" style="margin:2px">${b}</span>`).join('')}</div>
    <div><strong>步骤：</strong>${e.steps.map((s, j) => `<div class="step"><span class="step-num">${j+1}.</span>${s}</div>`).join('')}</div>`;
}

function startPractice() {
  if (currentExercise === null) return;
  document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
  document.querySelector('[data-tab="practice"]').classList.add('active');
  document.getElementById('view-practice').classList.add('active');
  setupPractice();
}

function setupPractice() {
  const e = exercises[currentExercise];
  document.getElementById('breath-params').innerHTML = `
    <div style="text-align:center;margin-bottom:8px"><strong>${e.name}</strong></div>
    <div style="display:flex;justify-content:center;gap:16px;margin-bottom:12px">
      <div><div class="time-display">${e.inhale}s</div><div class="time-label">吸气</div></div>
      ${e.hold ? `<div><div class="time-display">${e.hold}s</div><div class="time-label">屏息</div></div>` : ''}
      <div><div class="time-display">${e.exhale}s</div><div class="time-label">呼气</div></div>
    </div>`;
  currentRound = 0;
  document.getElementById('round-display').textContent = `第 0 / ${e.rounds} 轮`;
  document.getElementById('breath-counter').textContent = '0';
}

function toggleBreathing() {
  if (isBreathing) {
    clearInterval(breathTimer);
    isBreathing = false;
    document.getElementById('breath-btn').textContent = '继续';
    document.getElementById('breath-circle').className = 'breath-circle';
  } else {
    isBreathing = true;
    document.getElementById('breath-btn').textContent = '暂停';
    if (breathPhase === 'idle') sessionStart = Date.now();
    runBreathCycle();
  }
}

function runBreathCycle() {
  const e = exercises[currentExercise];
  let phase = 0;
  const phases = [{name:'吸气',dur:e.inhale,cls:'inhale'}];
  if (e.hold) phases.push({name:'屏息',dur:e.hold,cls:'hold'});
  phases.push({name:'呼气',dur:e.exhale,cls:'exhale'});

  function nextPhase() {
    if (!isBreathing) return;
    if (phase >= phases.length) {
      currentRound++;
      document.getElementById('round-display').textContent = `第 ${currentRound} / ${e.rounds} 轮`;
      if (currentRound >= e.rounds) {
        stopBreathing();
        recordSession();
        alert('🎉 练习完成！');
        return;
      }
      phase = 0;
    }
    const p = phases[phase];
    breathPhase = p.name;
    document.getElementById('breath-label').textContent = p.name;
    document.getElementById('breath-circle').className = 'breath-circle ' + p.cls;
    let count = p.dur;
    document.getElementById('breath-counter').textContent = count;
    breathTimer = setInterval(() => {
      count--;
      document.getElementById('breath-counter').textContent = count;
      if (count <= 0) {
        clearInterval(breathTimer);
        phase++;
        nextPhase();
      }
    }, 1000);
  }
  nextPhase();
}

function stopBreathing() {
  clearInterval(breathTimer);
  isBreathing = false;
  breathPhase = 'idle';
  document.getElementById('breath-btn').textContent = '开始练习';
  document.getElementById('breath-circle').className = 'breath-circle';
  document.getElementById('breath-label').textContent = '准备';
  document.getElementById('breath-counter').textContent = '0';
}

function recordSession() {
  const data = loadData();
  const duration = Math.floor((Date.now() - sessionStart) / 1000);
  data.records.push({
    date: new Date().toISOString().split('T')[0],
    exercise: exercises[currentExercise].name,
    duration,
    rounds: currentRound,
    timestamp: Date.now()
  });
  saveData(data);
}

function renderRecord() {
  const data = loadData();
  const records = data.records;
  document.getElementById('total-sessions').textContent = records.length;
  document.getElementById('total-minutes').textContent = Math.floor(records.reduce((s, r) => s + r.duration, 0) / 60);

  const dates = [...new Set(records.map(r => r.date))].sort().reverse();
  let streak = 0;
  let checkDate = new Date();
  while (dates.includes(checkDate.toISOString().split('T')[0])) {
    streak++;
    checkDate.setDate(checkDate.getDate() - 1);
  }
  document.getElementById('streak-days').textContent = streak;

  const recent = records.slice(-7).reverse();
  document.getElementById('recent-records').innerHTML = recent.length ? recent.map(r => `
    <div class="log-item">
      <div><strong>${r.exercise}</strong><br><span class="log-date">${r.date} · ${Math.floor(r.duration/60)}分钟 · ${r.rounds}轮</span></div>
      <span class="tag s">✓</span>
    </div>
  `).join('') : '<div class="empty">暂无记录</div>';
}

// Tabs
document.querySelectorAll('#tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'practice' && currentExercise !== null) setupPractice();
    if (tab.dataset.tab === 'record') renderRecord();
  });
});

renderExerciseList();
</script>
</body>
</html>
