ont-size:1rem;font-weight:600;margin-bottom:2px}.evolution-desc{font-size:.85rem;color:var(--text2)}.evolution-line{position:absolute;left:30px;bottom:-16px;width:2px;height:16px;background:var(--border)}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}</style><meta property="og:title" content="汉字进化10"><meta property="og:description" content="汉字进化10 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🧬 汉字进化10</h1><p class="sub">在线查看汉字进化过程</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="showEvolution()">
</div>
<button class="btn" onclick="showEvolution()">查看进化</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var evolutionData={
  '龙':{stages:[{era:'甲骨文',char:'🐉',name:'象形字',desc:'像蜿蜒的龙形，有角有须'},{era:'金文',char:'龍',name:'象形字',desc:'更加复杂的龙形描绘'},{era:'小篆',char:'龍',name:'象形字',desc:'规范化龙字'},{era:'隶书',char:'龍',name:'繁体字',desc:'繁体龙字定型'},{era:'楷书',char:'龙',name:'简体字',desc:'现代简体写法'}]},
  '凤':{stages:[{era:'甲骨文',char:'🦚',name:'象形字',desc:'像华丽的凤凰形状'},{era:'金文',char:'鳳',name:'象形字',desc:'繁复的凤鸟描绘'},{era:'小篆',char:'鳳',name:'象形字',desc:'规范化凤字'},{era:'隶书',char:'鳳',name:'繁体字',desc:'繁体凤字定型'},{era:'楷书',char:'凤',name:'简体字',desc:'现代简体写法'}]},
  '虎':{stages:[{era:'甲骨文',char:'🐅',name:'象形字',desc:'像猛虎的形状，张口露齿'},{era:'金文',char:'虎',name:'象形字',desc:'虎头虎身清晰'},{era:'小篆',char:'虎',name:'象形字',desc:'规范化虎字'},{era:'隶书',char:'虎',name:'方块字',desc:'更加规整'},{era:'楷书',char:'虎',name:'标准字',desc:'现代标准写法'}]},
  '马':{stages:[{era:'甲骨文',char:'🐎',name:'象形字',desc:'像奔马的形状，四蹄飞扬'},{era:'金文',char:'馬',name:'象形字',desc:'马鬃马尾清晰'},{era:'小篆',char:'馬',name:'象形字',desc:'规范化马字'},{era:'隶书',char:'馬',name:'繁体字',desc:'繁体马字定型'},{era:'楷书',char:'马',name:'简体字',desc:'现代简体写法'}]},
  '牛':{stages:[{era:'甲骨文',char:'🐄',name:'象形字',desc:'像牛头的形状，有角'},{era:'金文',char:'牛',name:'象形字',desc:'牛角牛耳清晰'},{era:'小篆',char:'牛',name:'象形字',desc:'规范化牛字'},{era:'隶书',char:'牛',name:'方块字',desc:'更加规整'},{era:'楷书',char:'牛',name:'标准字',desc:'现代标准写法'}]},
  '羊':{stages:[{era:'甲骨文',char:'🐑',name:'象形字',desc:'像羊头的形状，有弯角'},{era:'金文',char:'羊',name:'象形字',desc:'羊角弯曲明显'},{era:'小篆',char:'羊',name:'象形字',desc:'规范化羊字'},{era:'隶书',char:'羊',name:'方块字',desc:'更加规整'},{era:'楷书',char:'羊',name:'标准字',desc:'现代标准写法'}]},
  '鸟':{stages:[{era:'甲骨文',char:'🐦',name:'象形字',desc:'像飞鸟的形状，有喙有翅'},{era:'金文',char:'鳥',name:'象形字',desc:'鸟形更加生动'},{era:'小篆',char:'鳥',name:'象形字',desc:'规范化鸟字'},{era:'隶书',char:'鳥',name:'繁体字',desc:'繁体鸟字定型'},{era:'楷书',char:'鸟',name:'简体字',desc:'现代简体写法'}]},
  '鱼':{stages:[{era:'甲骨文',char:'🐟',name:'象形字',desc:'像游鱼的形状，有鳞有尾'},{era:'金文',char:'魚',name:'象形字',desc:'鱼形更加完整'},{era:'小篆',char:'魚',name:'象形字',desc:'规范化鱼字'},{era:'隶书',char:'魚',name:'繁体字',desc:'繁体鱼字定型'},{era:'楷书',char:'鱼',name:'简体字',desc:'现代简体写法'}]},
  '龟':{stages:[{era:'甲骨文',char:'🐢',name:'象形字',desc:'像乌龟的形状，有壳有足'},{era:'金文',char:'龜',name:'象形字',desc:'龟形更加细致'},{era:'小篆',char:'龜',name:'象形字',desc:'规范化龟字'},{era:'隶书',char:'龜',name:'繁体字',desc:'繁体龟字定型'},{era:'楷书',char:'龟',name:'简体字',desc:'现代简体写法'}]},
  '蛇':{stages:[{era:'甲骨文',char:'🐍',name:'象形字',desc:'像蜿蜒的蛇形'},{era:'金文',char:'蛇',name:'形声字',desc:'从虫，它声'},{era:'小篆',char:'蛇',name:'形声字',desc:'规范化蛇字'},{era:'隶书',char:'蛇',name:'形声字',desc:'更加规整'},{era:'楷书',char:'蛇',name:'标准字',desc:'现代标准写法'}]}
};
function showEvolution(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=evolutionData[char];
  if(!data){
    data={stages:[{era:'古代',char:char,name:'汉字',desc:'暂无详细进化信息'},{era:'现代',char:char,name:'标准字',desc:'现代标准写法'}]};
  }
  var html='<div class="card">';
  html+='<div style="text-align:center;margin-bottom:20px">';
  html+='<div style="font-size:4rem;font-weight:700;color:var(--blue)">'+char+'</div>';
  html+='<div style="font-size:1.1rem;color:var(--text2);margin-top:8px">汉字进化历程</div>';
  html+='</div>';
  html+='<div class="evolution-timeline">';
  data.stages.forEach(function(stage,index){
    html+='<div class="evolution-stage">';
    html+='<div class="evolution-char">'+stage.char+'</div>';
    html+='<div class="evolution-info">';
    html+='<div class="evolution-era">'+stage.era+'</div>';
    html+='<div class="evolution-name">'+stage.name+'</div>';
    html+='<div class="evolution-desc">'+stage.desc+'</div>';
    html+='</div>';
    if(index<data.stages.length-1){
      html+='<div class="evolution-line"></div>';
    }
    html+='</div>';
  });
  html+='</div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(evolutionData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showEvolution();
}
showEvolution();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
