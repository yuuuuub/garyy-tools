<div class="container"><h1>🔄 汉字变形35</h1><p class="sub">在线查看汉字变形效果</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="变" oninput="showTransform19()">
</div>
<button class="btn" onclick="showTransform19()">显示变形</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var transformTypes19=['3d','cube','sphere','cylinder','cone','pyramid','torus','knot','helix','spiral'];
var currentTransform19='3d';
function showTransform19(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="transform19-options">';
  transformTypes19.forEach(function(type){
    html+='<div class="transform19-option '+(type===currentTransform19?'active':'')+'" onclick="setTransform19(\''+type+'\')">'+getTransformName19(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="transform19-container">';
  html+='<div class="transform19-char" style="animation:'+getTransformCSS19(currentTransform19)+'">'+char+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>📋 变形说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>变形类型：</strong>'+getTransformName19(currentTransform19)+'</div>';
  html+='<div><strong>效果描述：</strong>'+getTransformDescription19(currentTransform19)+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function setTransform19(type){
  currentTransform19=type;
  showTransform19();
}
function getTransformName19(type){
  switch(type){
    case '3d':return'3D旋转';
    case 'cube':return'立方体';
    case 'sphere':return'球体';
    case 'cylinder':return'圆柱体';
    case 'cone':return'圆锥体';
    case 'pyramid':return'金字塔';
    case 'torus':return'环面';
    case 'knot':return'纽结';
    case 'helix':return'螺旋';
    case 'spiral':return'漩涡';
    default:return'未知';
  }
}
function getTransformDescription19(type){
  switch(type){
    case '3d':return'3D空间中的旋转效果';
    case 'cube':return'立方体旋转效果';
    case 'sphere':return'球体旋转效果';
    case 'cylinder':return'圆柱体旋转效果';
    case 'cone':return'圆锥体旋转效果';
    case 'pyramid':return'金字塔旋转效果';
    case 'torus':return'环面旋转效果';
    case 'knot':return'纽结旋转效果';
    case 'helix':return'螺旋旋转效果';
    case 'spiral':return'漩涡旋转效果';
    default:return'未知效果';
  }
}
function getTransformCSS19(type){
  switch(type){
    case '3d':return'rotate3d19 3s linear infinite';
    case 'cube':return'cube19 4s linear infinite';
    case 'sphere':return'sphere19 3s linear infinite';
    case 'cylinder':return'cylinder19 3s linear infinite';
    case 'cone':return'cone19 3s linear infinite';
    case 'pyramid':return'pyramid19 4s linear infinite';
    case 'torus':return'torus19 3s linear infinite';
    case 'knot':return'knot19 4s linear infinite';
    case 'helix':return'helix19 3s linear infinite';
    case 'spiral':return'spiral19 3s linear infinite';
    default:return'none';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showTransform19();
}
showTransform19();
</script>
<style>
@keyframes rotate3d19{0%{transform:rotateX(0) rotateY(0)}100%{transform:rotateX(360deg) rotateY(360deg)}}
@keyframes cube19{0%{transform:rotateX(0) rotateY(0)}25%{transform:rotateX(90deg) rotateY(90deg)}50%{transform:rotateX(180deg) rotateY(180deg)}75%{transform:rotateX(270deg) rotateY(270deg)}100%{transform:rotateX(360deg) rotateY(360deg)}}
@keyframes sphere19{0%,100%{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(0.8)}}
@keyframes cylinder19{0%,100%{transform:rotateY(0) scaleY(1)}50%{transform:rotateY(180deg) scaleY(0.5)}}
@keyframes cone19{0%,100%{transform:rotateY(0) scaleX(1)}50%{transform:rotateY(180deg) scaleX(0.3)}}
@keyframes pyramid19{0%,100%{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(0.7)}}
@keyframes torus19{0%{transform:rotateX(0) rotateY(0)}100%{transform:rotateX(360deg) rotateY(360deg)}}
@keyframes knot19{0%{transform:rotateX(0) rotateY(0) rotateZ(0)}100%{transform:rotateX(360deg) rotateY(360deg) rotateZ(360deg)}}
@keyframes helix19{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(180deg) translateY(-20px)}100%{transform:rotateY(360deg) translateY(0)}}
@keyframes spiral19{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(0.5)}100%{transform:rotate(360deg) scale(1)}}
