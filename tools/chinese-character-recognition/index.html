<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字识别</title><meta name="description" content="汉字识别 - 在线识别汉字信息"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.upload-area{border:2px dashed var(--border);border-radius:8px;padding:40px;text-align:center;cursor:pointer;transition:border-color .2s}.upload-area:hover{border-color:var(--blue)}.upload-icon{font-size:3rem;margin-bottom:12px}.upload-text{color:var(--text2);font-size:.9rem}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.preview{margin-top:16px;text-align:center}.preview canvas{max-width:100%;border-radius:8px;border:1px solid var(--border)}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字识别"><meta property="og:description" content="汉字识别 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔍 汉字识别</h1><p class="sub">在线识别汉字信息</p>
<div class="card">
<div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
<div class="upload-icon">📤</div>
<div class="upload-text">点击或拖拽图片到此处</div>
</div>
<input type="file" id="fileInput" style="display:none" accept="image/*" onchange="handleImage(event)">
<div class="preview" id="preview" style="display:none">
<canvas id="canvas"></canvas>
</div>
<div class="btn-group">
<button class="btn" onclick="analyzeImage()">分析图片</button>
<button class="btn" onclick="clearImage()">清除图片</button>
</div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var currentImage=null;
function handleImage(event){
  var file=event.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    currentImage=new Image();
    currentImage.onload=function(){
      var canvas=document.getElementById('canvas');
      var ctx=canvas.getContext('2d');
      canvas.width=currentImage.width;
      canvas.height=currentImage.height;
      ctx.drawImage(currentImage,0,0);
      document.getElementById('preview').style.display='block';
    };
    currentImage.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function analyzeImage(){
  if(!currentImage){
    alert('请先上传图片');
    return;
  }
  var r=document.getElementById('result');
  var html='<div class="card">';
  html+='<div class="section"><h3>📋 分析结果</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px;margin-bottom:12px">';
  html+='<div><strong>图片尺寸：</strong>'+currentImage.width+' x '+currentImage.height+' 像素</div>';
  html+='<div><strong>文件类型：</strong>图片文件</div>';
  html+='</div>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>识别说明：</strong></div>';
  html+='<div style="margin-top:8px;color:var(--text2)">';
  html+='由于浏览器安全限制，无法直接进行OCR识别。';
  html+='建议使用专业的OCR服务或API进行汉字识别。';
  html+='以下是一些可用的OCR服务：';
  html+='<ul style="margin-top:8px;padding-left:20px">';
  html+='<li>百度OCR API</li>';
  html+='<li>腾讯OCR API</li>';
  html+='<li>阿里云OCR API</li>';
  html+='<li>Tesseract.js（本地识别）</li>';
  html+='</ul></div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function clearImage(){
  currentImage=null;
  document.getElementById('preview').style.display='none';
  document.getElementById('result').innerHTML='';
  document.getElementById('fileInput').value='';
}
var uploadArea=document.getElementById('uploadArea');
uploadArea.addEventListener('dragover',function(e){
  e.preventDefault();
  uploadArea.style.borderColor='var(--blue)';
});
uploadArea.addEventListener('dragleave',function(){
  uploadArea.style.borderColor='var(--border)';
});
uploadArea.addEventListener('drop',function(e){
  e.preventDefault();
  uploadArea.style.borderColor='var(--border)';
  if(e.dataTransfer.files.length>0){
    handleImage({target:{files:e.dataTransfer.files}});
  }
});
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
