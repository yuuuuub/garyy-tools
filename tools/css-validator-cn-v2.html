<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CSS验证工具 - 验证CSS代码规范性">
    <meta name="robots" content="index, follow">
    <title>CSS验证工具</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #dee2e6;
            --card-bg: #f8f9fa;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #444444;
            --card-bg: #2d2d2d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-family: monospace;
            resize: vertical;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
        }
        .error-item {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            background-color: rgba(220, 53, 69, 0.1);
            border-left: 4px solid var(--danger-color);
        }
        .warning-item {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            background-color: rgba(255, 193, 7, 0.1);
            border-left: 4px solid var(--warning-color);
        }
        .info-item {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            background-color: rgba(0, 123, 255, 0.1);
            border-left: 4px solid var(--primary-color);
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .score {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }
        .score.good {
            color: var(--success-color);
        }
        .score.average {
            color: var(--warning-color);
        }
        .score.poor {
            color: var(--danger-color);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>CSS验证工具</h1>
        <p>输入CSS代码验证规范性</p>
        
        <div class="form-group">
            <label for="cssInput">CSS代码:</label>
            <textarea id="cssInput" rows="15" placeholder="粘贴CSS代码..."></textarea>
        </div>
        
        <button onclick="runValidation()">开始验证</button>
        
        <div id="result" class="result" style="display: none;">
            <h2>验证结果</h2>
            <div id="score" class="score"></div>
            <div id="issues"></div>
        </div>
    </div>

    <script src="i18n.js" defer></script>
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            html.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
        }

        function runValidation() {
            const cssInput = document.getElementById('cssInput').value;
            
            if (!cssInput) {
                alert('请输入CSS代码');
                return;
            }
            
            const issues = [];
            let score = 100;
            
            // 检查语法错误
            const openBraces = (cssInput.match(/{/g) || []).length;
            const closeBraces = (cssInput.match(/}/g) || []).length;
            if (openBraces !== closeBraces) {
                score -= 20;
                issues.push({
                    type: 'error',
                    message: '大括号不匹配'
                });
            }
            
            // 检查分号
            const lines = cssInput.split('\n');
            lines.forEach((line, index) => {
                const trimmed = line.trim();
                if (trimmed && !trimmed.endsWith('{') && !trimmed.endsWith('}') && !trimmed.endsWith(';') && !trimmed.startsWith('/*') && !trimmed.startsWith('*')) {
                    if (trimmed.includes(':') && !trimmed.includes('<!--')) {
                        score -= 2;
                        issues.push({
                            type: 'warning',
                            message: `第${index + 1}行可能缺少分号`
                        });
                    }
                }
            });
            
            // 检查废弃属性
            const deprecatedProps = ['behavior', 'filter', 'voice-family'];
            deprecatedProps.forEach(prop => {
                if (cssInput.includes(prop + ':')) {
                    score -= 5;
                    issues.push({
                        type: 'warning',
                        message: `使用了废弃的CSS属性: ${prop}`
                    });
                }
            });
            
            // 检查浏览器前缀
            const prefixes = ['-webkit-', '-moz-', '-ms-', '-o-'];
            const prefixCount = prefixes.reduce((count, prefix) => {
                return count + (cssInput.split(prefix).length - 1);
            }, 0);
            if (prefixCount > 5) {
                score -= 3;
                issues.push({
                    type: 'info',
                    message: `使用了${prefixCount}个浏览器前缀，考虑使用Autoprefixer`
                });
            }
            
            // 检查!important使用
            const importantCount = (cssInput.match(/!important/g) || []).length;
            if (importantCount > 3) {
                score -= 5;
                issues.push({
                    type: 'warning',
                    message: `使用了${importantCount}次!important，建议减少使用`
                });
            }
            
            // 检查颜色值
            const colorRegex = /#[0-9a-fA-F]{3,6}/g;
            const colors = cssInput.match(colorRegex) || [];
            if (colors.length > 10) {
                score -= 3;
                issues.push({
                    type: 'info',
                    message: `使用了${colors.length}种颜色值，考虑使用CSS变量`
                });
            }
            
            // 检查选择器深度
            const selectorDepth = (cssInput.match(/{[^}]*}/g) || []).length;
            if (selectorDepth > 50) {
                score -= 3;
                issues.push({
                    type: 'info',
                    message: 'CSS规则较多，考虑模块化'
                });
            }
            
            // 检查注释
            if (!cssInput.includes('/*') && cssInput.length > 200) {
                score -= 2;
                issues.push({
                    type: 'info',
                    message: '建议添加CSS注释'
                });
            }
            
            // 计算最终分数
            score = Math.max(0, Math.min(100, score));
            
            // 显示结果
            const scoreDiv = document.getElementById('score');
            const issuesDiv = document.getElementById('issues');
            
            scoreDiv.textContent = `${score}分`;
            scoreDiv.className = `score ${score >= 80 ? 'good' : score >= 60 ? 'average' : 'poor'}`;
            
            if (issues.length === 0) {
                issuesDiv.innerHTML = '<div class="info-item">CSS验证通过</div>';
            } else {
                issuesDiv.innerHTML = issues.map(issue => 
                    `<div class="${issue.type}-item">${issue.message}</div>`
                ).join('');
            }
            
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
