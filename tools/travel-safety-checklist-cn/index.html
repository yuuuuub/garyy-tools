<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行安全清单</title>
<meta name="description" content="出国旅行安全检查清单，确保旅途安全无忧">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#3fb950;--yellow:#d29922;--red:#f85149}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;padding:16px}
.header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.header h1{font-size:20px;white-space:nowrap}
.header h1 span{font-size:24px}
.header .score{margin-left:auto;text-align:center}
.header .score .num{font-size:28px;font-weight:700}
.header .score .lbl{font-size:11px;color:var(--text2)}
.progress-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.progress-text{display:flex;justify-content:space-between;font-size:12px;color:var(--text2)}
.safety-level{text-align:center;padding:8px;border-radius:6px;font-weight:600;font-size:14px;margin-top:8px}
.safety-level.safe{background:rgba(63,185,80,.15);color:var(--green)}
.safety-level.warning{background:rgba(210,153,34,.15);color:var(--yellow)}
.safety-level.danger{background:rgba(248,81,73,.15);color:var(--red)}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cat-btn{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:12px;transition:all .15s;display:flex;align-items:center;gap:4px}
.cat-btn:hover,.cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.checklist{display:flex;flex-direction:column;gap:12px}
.check-group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.group-header{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);cursor:pointer}
.group-header:hover{background:var(--bg)}
.group-header .icon{font-size:20px}
.group-header .title{flex:1;font-weight:600;font-size:14px}
.group-header .badge{padding:2px 8px;border-radius:10px;font-size:11px;background:var(--bg);color:var(--text2)}
.group-header .badge.done{background:rgba(63,185,80,.15);color:var(--green)}
.group-body{padding:8px 12px;display:none}
.group-body.open{display:block}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:6px;transition:background .15s}
.check-item:hover{background:var(--bg)}
.check-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
.check-item .info{flex:1}
.check-item .name{font-size:14px;line-height:1.4}
.check-item .name.done{text-decoration:line-through;color:var(--text2)}
.check-item .desc{font-size:11px;color:var(--text2);margin-top:2px}
.check-item .priority{font-size:10px;padding:1px 6px;border-radius:4px;margin-left:8px;vertical-align:middle}
.priority.high{background:rgba(248,81,73,.15);color:var(--red)}
.priority.medium{background:rgba(210,153,34,.15);color:var(--yellow)}
.priority.low{background:rgba(63,185,80,.15);color:var(--green)}
.tips-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px}
.tips-card h3{font-size:14px;margin-bottom:12px}
.tip-item{padding:8px;background:var(--bg);border-radius:6px;margin-bottom:6px;font-size:13px;line-height:1.6}
.tip-item .tip-title{font-weight:600;margin-bottom:2px}
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
</style>
</head>
<body>
<div class="header">
<h1><span>🛡️</span> 旅行安全清单</h1>
<div class="score">
<div class="num" id="scoreNum">0%</div>
<div class="lbl">安全准备度</div>
</div>
</div>
<div class="progress-section">
<div class="progress-text"><span>完成进度</span><span id="progressText">0 / 0</span></div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="safety-level" id="safetyLevel">⚠️ 请开始检查安全事项</div>
</div>
<div class="toolbar">
<button class="btn btn-green btn-sm" onclick="checkAll()">☑ 全部完成</button>
<button class="btn btn-outline btn-sm" onclick="uncheckAll()">☐ 全部重置</button>
<button class="btn btn-outline btn-sm" onclick="exportChecklist()">📤 导出</button>
<button class="btn btn-outline btn-sm" onclick="saveChecklist()">💾 保存</button>
<button class="btn btn-outline btn-sm" onclick="loadChecklist()">📂 加载</button>
</div>
<div class="categories" id="categories"></div>
<div class="checklist" id="checklist"></div>
<div class="tips-card">
<h3>💡 安全小贴士</h3>
<div id="tipsContainer"></div>
</div>
<script>
const checklistData=[
{cat:'📄 证件安全',icon:'📄',items:[
{name:'护照有效期检查（6个月以上）',desc:'确保护照在回国后仍有6个月以上有效期',priority:'high'},
{name:'护照复印件/电子版备份',desc:'拍照存手机+邮箱备份，遗失时方便补办',priority:'high'},
{name:'签证有效期确认',desc:'检查签证类型和停留期限',priority:'high'},
{name:'身份证/驾驶证备份',desc:'国内证件也需备份',priority:'medium'},
{name:'旅行保险购买',desc:'建议包含医疗、意外、行李丢失',priority:'high'},
{name:'紧急联系人信息',desc:'记录家人、使馆、保险公司电话',priority:'high'},
{name:'行程单打印',desc:'机票、酒店确认单纸质备份',priority:'low'}
]},
{cat:'💰 财务安全',icon:'💰',items:[
{name:'银行卡海外使用权限开通',desc:'提前联系银行开通境外交易',priority:'high'},
{name:'信用卡额度确认',desc:'确保足够额度，了解手续费',priority:'medium'},
{name:'携带少量当地现金',desc:'约200-500等值人民币的当地货币',priority:'medium'},
{name:'分散存放现金',desc:'不要把所有钱放一个地方',priority:'medium'},
{name:'告知银行出行计划',desc:'避免信用卡被冻结',priority:'low'},
{name:'记录银行卡挂失电话',desc:'各国银行客服热线',priority:'high'}
]},
{cat:'🏥 健康安全',icon:'🏥',items:[
{name:'常备药品准备',desc:'感冒药、止泻药、创可贴、晕车药',priority:'high'},
{name:'处方药带够量',desc:'携带医生证明和英文处方',priority:'high'},
{name:'疫苗接种',desc:'根据目的地接种必要疫苗',priority:'medium'},
{name:'防晒霜/驱蚊液',desc:'热带地区必备',priority:'low'},
{name:'了解当地医疗资源',desc:'记录附近医院/诊所地址',priority:'medium'},
{name:'过敏药物/过敏卡',desc:'严重过敏者必备',priority:'high'}
]},
{cat:'📱 通讯安全',icon:'📱',items:[
{name:'开通国际漫游/eSIM',desc:'确保到达后能通讯',priority:'high'},
{name:'下载离线地图',desc:'Google Maps/高德离线包',priority:'high'},
{name:'VPN准备',desc:'如需访问国内服务',priority:'medium'},
{name:'紧急联络人设置',desc:'手机紧急联络人功能',priority:'high'},
{name:'WiFi设备/eSIM卡',desc:'按需准备便携WiFi',priority:'low'},
{name:'备份重要联系方式',desc:'邮箱/云端存储',priority:'medium'}
]},
{cat:'🏠 住宿安全',icon:'🏠',items:[
{name:'酒店地址当地语言版本',desc:'打车/问路时出示',priority:'high'},
{name:'酒店安全设施检查',desc:'门锁、保险箱、逃生通道',priority:'medium'},
{name:'房间号不外泄',desc:'不对外透露具体房间号',priority:'medium'},
{name:'入住时确认紧急出口',desc:'熟悉逃生路线',priority:'medium'},
{name:'贵重物品锁保险箱',desc:'护照、现金、珠宝',priority:'high'}
]},
{cat:'🚗 出行安全',icon:'🚗',items:[
{name:'了解当地交通规则',desc:'靠左/靠右行驶、限速等',priority:'medium'},
{name:'保存当地紧急电话',desc:'报警/急救/火警号码',priority:'high'},
{name:'打车软件准备',desc:'Uber/Grab/滴滴国际版',priority:'medium'},
{name:'不坐黑车/不拼车',desc:'选择正规交通工具',priority:'high'},
{name:'夜间出行注意',desc:'避免深夜独自外出',priority:'medium'},
{name:'告知家人行程',desc:'分享实时位置',priority:'high'}
]},
{cat:'🔒 信息安全',icon:'🔒',items:[
{name:'重要密码备份',desc:'加密存储或纸质备份',priority:'high'},
{name:'公共WiFi谨慎使用',desc:'不登录银行等敏感账户',priority:'medium'},
{name:'手机锁屏设置',desc:'指纹/面容/密码',priority:'high'},
{name:'照片备份到云端',desc:'避免手机丢失损失',priority:'low'},
{name:'不随意连接陌生WiFi',desc:'防止信息泄露',priority:'medium'}
]},
{cat:'🆘 应急准备',icon:'🆘',items:[
{name:'使馆/领事馆地址电话',desc:'记录中国驻当地使领馆',priority:'high'},
{name:'当地报警电话',desc:'每个国家不同',priority:'high'},
{name:'旅行保险理赔电话',desc:'出险时第一时间联系',priority:'high'},
{name:'SOS紧急求助方式',desc:'了解当地紧急求助渠道',priority:'medium'},
{name:'遗失证件补办流程',desc:'提前了解流程',priority:'medium'}
]}
];
let state={};let activeCat='all';
function initChecklist(){
const saved=localStorage.getItem('travelSafety');
if(saved)state=JSON.parse(saved);
else checklistData.forEach(g=>g.items.forEach((_,i)=>{state[g.cat+i]=false;}));
renderCategories();
renderChecklist();
renderTips();
}
function renderCategories(){
const el=document.getElementById('categories');
el.innerHTML=`<button class="cat-btn active" onclick="setCat('all',this)">全部</button>`+
checklistData.map(g=>`<button class="cat-btn" onclick="setCat('${g.cat}',this)">${g.icon} ${g.cat.replace(/[\u{1F300}-\u{1F9FF}]/gu,'').trim()}</button>`).join('');
}
function setCat(cat,btn){
activeCat=cat;
document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
renderChecklist();
}
function renderChecklist(){
const el=document.getElementById('checklist');
const groups=activeCat==='all'?checklistData:checklistData.filter(g=>g.cat===activeCat);
el.innerHTML=groups.map(g=>{
const doneCount=g.items.filter((_,i)=>state[g.cat+i]).length;
return `<div class="check-group">
<div class="group-header" onclick="this.nextElementSibling.classList.toggle('open')">
<span class="icon">${g.icon}</span>
<span class="title">${g.cat.replace(/[\u{1F300}-\u{1F9FF}]/gu,'').trim()}</span>
<span class="badge ${doneCount===g.items.length?'done':''}">${doneCount}/${g.items.length}</span>
<span style="font-size:12px;color:var(--text2)">▶</span></div>
<div class="group-body ${activeCat!=='all'?'open':''}">${g.items.map((item,i)=>{
const key=g.cat+i;
const checked=state[key]||false;
return `<div class="check-item"><input type="checkbox" ${checked?'checked':''} onchange="toggleItem('${key.replace(/'/g,"\\'")}',this.checked)">
<div class="info"><div class="name ${checked?'done':''}">${item.name} <span class="priority ${item.priority}">${item.priority==='high'?'必做':item.priority==='medium'?'建议':'可选'}</span></div>
<div class="desc">${item.desc}</div></div></div>`;
}).join('')}</div></div>`;
}).join('');
updateProgress();
}
function toggleItem(key,checked){state[key]=checked;renderChecklist();}
function updateProgress(){
const total=checklistData.reduce((s,g)=>s+g.items.length,0);
const done=checklistData.reduce((s,g)=>s+g.items.filter((_,i)=>state[g.cat+i]).length,0);
const pct=total?Math.round(done/total*100):0;
document.getElementById('scoreNum').textContent=pct+'%';
document.getElementById('progressText').textContent=`${done} / ${total}`;
document.getElementById('progressFill').style.width=pct+'%';
document.getElementById('scoreNum').style.color=pct>=80?'var(--green)':pct>=50?'var(--yellow)':'var(--red)';
const level=document.getElementById('safetyLevel');
if(pct>=80){level.className='safety-level safe';level.textContent='✅ 安全准备充分，可以放心出发！';}
else if(pct>=50){level.className='safety-level warning';level.textContent='⚠️ 安全准备进行中，还有'+(total-done)+'项待完成';}
else{level.className='safety-level danger';level.textContent='🚨 安全准备不足，请尽快完成必做事项';}
}
function renderTips(){
const tips=[
{title:'证件拍照备份',text:'护照、签证、身份证拍照存手机，同时发送到自己邮箱作为云端备份'},
{title:'购买旅行保险',text:'特别是医疗险，国外就医费用高昂。建议保额不低于50万'},
{title:'告知家人行程',text:'出发前把行程单、酒店信息分享给家人，保持定期联系'},
{title:'大使馆电话',text:'提前存好中国驻当地大使馆/领事馆电话，紧急时拨打12308'},
{title:'不要炫富',text:'在公共场所避免展示大量现金、贵重珠宝，低调出行更安全'},
{title:'保持联系',text:'每天给家人报平安，分享实时位置，遇到危险及时求助'}
];
document.getElementById('tipsContainer').innerHTML=tips.map(t=>`<div class="tip-item"><div class="tip-title">💡 ${t.title}</div><div>${t.text}</div></div>`).join('');
}
function checkAll(){checklistData.forEach(g=>g.items.forEach((_,i)=>{state[g.cat+i]=true;}));renderChecklist();}
function uncheckAll(){if(confirm('确定重置所有检查项？')){state={};renderChecklist();}}
function exportChecklist(){
let text='🛡️ 旅行安全清单\n'+'━'.repeat(30)+'\n\n';
checklistData.forEach(g=>{
text+=`${g.icon} ${g.cat}\n`;
g.items.forEach((item,i)=>{
const checked=state[g.cat+i];
text+=`${checked?'  ☑ ':'  ☐ '}${item.name}${item.priority==='high'?' [必做]':''}\n`;
});
text+='\n';
});
const total=checklistData.reduce((s,g)=>s+g.items.length,0);
const done=checklistData.reduce((s,g)=>s+g.items.filter((_,i)=>state[g.cat+i]).length,0);
text+=`完成度: ${done}/${total} (${Math.round(done/total*100)}%)`;
const blob=new Blob([text],{type:'text/plain'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='旅行安全清单.txt';a.click();
}
function saveChecklist(){localStorage.setItem('travelSafety',JSON.stringify(state));alert('已保存！');}
function loadChecklist(){const s=localStorage.getItem('travelSafety');if(s){state=JSON.parse(s);renderChecklist();alert('已加载！');}else alert('没有已保存的记录');}
initChecklist();
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();}if(e.key==='Escape'){}});
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
