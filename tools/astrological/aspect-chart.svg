<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#111827" rx="8"/>
  
  <!-- Aspect wheel diagram -->
  <circle cx="250" cy="100" r="70" fill="none" stroke="#4B5563" stroke-width="1"/>
  
  <!-- Points on the wheel -->
  <circle cx="320" cy="100" r="3" fill="#6B7280"/>
  <circle cx="303.5" cy="135" r="3" fill="#6B7280"/>
  <circle cx="285" cy="165" r="3" fill="#6B7280"/>
  <circle cx="250" cy="170" r="3" fill="#6B7280"/>
  <circle cx="215" cy="165" r="3" fill="#6B7280"/>
  <circle cx="196.5" cy="135" r="3" fill="#6B7280"/>
  <circle cx="180" cy="100" r="3" fill="#6B7280"/>
  <circle cx="196.5" cy="65" r="3" fill="#6B7280"/>
  <circle cx="215" cy="35" r="3" fill="#6B7280"/>
  <circle cx="250" cy="30" r="3" fill="#6B7280"/>
  <circle cx="285" cy="35" r="3" fill="#6B7280"/>
  <circle cx="303.5" cy="65" r="3" fill="#6B7280"/>
  
  <!-- Example aspect lines -->
  <line x1="320" y1="100" x2="180" y2="100" stroke="#F59E0B" stroke-width="2"/>
  <line x1="320" y1="100" x2="215" y2="35" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="320" y1="100" x2="250" y2="170" stroke="#EF4444" stroke-width="2"/>
  <line x1="320" y1="100" x2="285" y2="165" stroke="#6366F1" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Aspect symbols and descriptions -->
  <text x="80" y="200" text-anchor="middle" font-size="24" fill="#FFFFFF">☌</text>
  <text x="150" y="200" font-size="16" fill="#D1D5DB">Conjunction</text>
  <text x="280" y="200" font-size="16" fill="#9CA3AF">0°</text>
  
  <text x="80" y="230" text-anchor="middle" font-size="24" fill="#6366F1">⚹</text>
  <text x="150" y="230" font-size="16" fill="#D1D5DB">Sextile</text>
  <text x="280" y="230" font-size="16" fill="#9CA3AF">60°</text>
  <line x1="320" y1="225" x2="380" y2="225" stroke="#6366F1" stroke-width="2" stroke-dasharray="4,2"/>
  
  <text x="80" y="260" text-anchor="middle" font-size="24" fill="#EF4444">□</text>
  <text x="150" y="260" font-size="16" fill="#D1D5DB">Square</text>
  <text x="280" y="260" font-size="16" fill="#9CA3AF">90°</text>
  <line x1="320" y1="255" x2="380" y2="255" stroke="#EF4444" stroke-width="2"/>
  
  <text x="80" y="290" text-anchor="middle" font-size="24" fill="#3B82F6">△</text>
  <text x="150" y="290" font-size="16" fill="#D1D5DB">Trine</text>
  <text x="280" y="290" font-size="16" fill="#9CA3AF">120°</text>
  <line x1="320" y1="285" x2="380" y2="285" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  
  <text x="80" y="320" text-anchor="middle" font-size="24" fill="#F59E0B">☍</text>
  <text x="150" y="320" font-size="16" fill="#D1D5DB">Opposition</text>
  <text x="280" y="320" font-size="16" fill="#9CA3AF">180°</text>
  <line x1="320" y1="315" x2="380" y2="315" stroke="#F59E0B" stroke-width="2"/>
</svg>
