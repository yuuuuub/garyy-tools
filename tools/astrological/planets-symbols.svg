<svg viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#111827" rx="8"/>
  
  <!-- Sun -->
  <circle cx="60" cy="40" r="20" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="60" y="47" text-anchor="middle" font-size="24" fill="#F59E0B">☉</text>
  <text x="60" y="80" text-anchor="middle" font-size="12" fill="#D1D5DB">Sun</text>
  
  <!-- Moon -->
  <circle cx="115" cy="40" r="20" fill="#3B82F6" fill-opacity="0.2"/>
  <text x="115" y="47" text-anchor="middle" font-size="24" fill="#3B82F6">☽</text>
  <text x="115" y="80" text-anchor="middle" font-size="12" fill="#D1D5DB">Moon</text>
  
  <!-- Mercury -->
  <circle cx="170" cy="40" r="20" fill="#9CA3AF" fill-opacity="0.2"/>
  <text x="170" y="47" text-anchor="middle" font-size="24" fill="#9CA3AF">☿</text>
  <text x="170" y="80" text-anchor="middle" font-size="12" fill="#D1D5DB">Mercury</text>
  
  <!-- Venus -->
  <circle cx="225" cy="40" r="20" fill="#EC4899" fill-opacity="0.2"/>
  <text x="225" y="47" text-anchor="middle" font-size="24" fill="#EC4899">♀</text>
  <text x="225" y="80" text-anchor="middle" font-size="12" fill="#D1D5DB">Venus</text>
  
  <!-- Mars -->
  <circle cx="280" cy="40" r="20" fill="#EF4444" fill-opacity="0.2"/>
  <text x="280" y="47" text-anchor="middle" font-size="24" fill="#EF4444">♂</text>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#D1D5DB">Mars</text>
  
  <!-- Jupiter -->
  <circle cx="335" cy="40" r="20" fill="#8B5CF6" fill-opacity="0.2"/>
  <text x="335" y="47" text-anchor="middle" font-size="24" fill="#8B5CF6">♃</text>
  <text x="335" y="80" text-anchor="middle" font-size="12" fill="#D1D5DB">Jupiter</text>
  
  <!-- Saturn -->
  <circle cx="390" cy="40" r="20" fill="#6B7280" fill-opacity="0.2"/>
  <text x="390" y="47" text-anchor="middle" font-size="24" fill="#6B7280">♄</text>
  <text x="390" y="80" text-anchor="middle" font-size="12" fill="#D1D5DB">Saturn</text>
  
  <!-- Uranus -->
  <circle cx="445" cy="40" r="20" fill="#14B8A6" fill-opacity="0.2"/>
  <text x="445" y="47" text-anchor="middle" font-size="24" fill="#14B8A6">♅</text>
  <text x="445" y="80" text-anchor="middle" font-size="12" fill="#D1D5DB">Uranus</text>
  
  <!-- Neptune -->
  <circle cx="500" cy="40" r="20" fill="#3B82F6" fill-opacity="0.2"/>
  <text x="500" y="47" text-anchor="middle" font-size="24" fill="#3B82F6">♆</text>
  <text x="500" y="80" text-anchor="middle" font-size="12" fill="#D1D5DB">Neptune</text>
  
  <!-- Pluto -->
  <circle cx="555" cy="40" r="20" fill="#4B5563" fill-opacity="0.2"/>
  <text x="555" y="47" text-anchor="middle" font-size="24" fill="#4B5563">♇</text>
  <text x="555" y="80" text-anchor="middle" font-size="12" fill="#D1D5DB">Pluto</text>
</svg>
