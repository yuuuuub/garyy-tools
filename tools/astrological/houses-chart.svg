<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#111827" rx="8"/>
  
  <!-- Houses wheel -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="#4B5563" stroke-width="1"/>
  
  <!-- House dividing lines -->
  <line x1="250" y1="250" x2="250" y2="70" stroke="#4B5563" stroke-width="1"/>
  <line x1="250" y1="250" x2="340.5" y2="93.3" stroke="#4B5563" stroke-width="1"/>
  <line x1="250" y1="250" x2="406.7" y2="159.5" stroke="#4B5563" stroke-width="1"/>
  <line x1="250" y1="250" x2="430" y2="250" stroke="#4B5563" stroke-width="1"/>
  <line x1="250" y1="250" x2="406.7" y2="340.5" stroke="#4B5563" stroke-width="1"/>
  <line x1="250" y1="250" x2="340.5" y2="406.7" stroke="#4B5563" stroke-width="1"/>
  <line x1="250" y1="250" x2="250" y2="430" stroke="#4B5563" stroke-width="1"/>
  <line x1="250" y1="250" x2="159.5" y2="406.7" stroke="#4B5563" stroke-width="1"/>
  <line x1="250" y1="250" x2="93.3" y2="340.5" stroke="#4B5563" stroke-width="1"/>
  <line x1="250" y1="250" x2="70" y2="250" stroke="#4B5563" stroke-width="1"/>
  <line x1="250" y1="250" x2="93.3" y2="159.5" stroke="#4B5563" stroke-width="1"/>
  <line x1="250" y1="250" x2="159.5" y2="93.3" stroke="#4B5563" stroke-width="1"/>
  
  <!-- House numbers -->
  <text x="250" y="100" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#D1D5DB">1</text>
  <text x="320" y="125" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#D1D5DB">2</text>
  <text x="370" y="180" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#D1D5DB">3</text>
  <text x="400" y="250" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#D1D5DB">4</text>
  <text x="370" y="320" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#D1D5DB">5</text>
  <text x="320" y="375" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#D1D5DB">6</text>
  <text x="250" y="400" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#D1D5DB">7</text>
  <text x="180" y="375" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#D1D5DB">8</text>
  <text x="130" y="320" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#D1D5DB">9</text>
  <text x="100" y="250" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#D1D5DB">10</text>
  <text x="130" y="180" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#D1D5DB">11</text>
  <text x="180" y="125" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#D1D5DB">12</text>
  
  <!-- Key house points -->
  <circle cx="250" cy="70" r="6" fill="#6366F1"/>
  <text x="250" y="45" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#6366F1">ASC</text>
  
  <circle cx="430" cy="250" r="6" fill="#3B82F6"/>
  <text x="455" y="250" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#3B82F6">IC</text>
  
  <circle cx="250" cy="430" r="6" fill="#6366F1"/>
  <text x="250" y="455" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#6366F1">DSC</text>
  
  <circle cx="70" cy="250" r="6" fill="#3B82F6"/>
  <text x="45" y="250" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#3B82F6">MC</text>
  
  <!-- Center decoration -->
  <circle cx="250" cy="250" r="5" fill="#6366F1"/>
</svg>
