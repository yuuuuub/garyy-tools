<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>占星学工具 - 占星学入门指南</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tool-card {
            transition: all 0.3s ease;
        }
        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.2);
        }
        .memory-card {
            perspective: 1000px;
        }
        .memory-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .memory-card.flipped .memory-card-inner {
            transform: rotateY(180deg);
        }
        .memory-card-front, .memory-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .memory-card-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-black text-gray-100 font-sans min-h-screen">
    <header class="py-6 border-b border-gray-800">
        <div class="container mx-auto px-4 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-semibold text-white">占星学工具</h1>
                <p class="text-gray-400 mt-2">实用的占星学学习和练习工具</p>
            </div>
            <a href="index.html" class="text-indigo-400 hover:text-indigo-300 transition-colors">返回首页</a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="grid md:grid-cols-3 gap-6 mb-12">
            <!-- 星座查询器 -->
            <div class="bg-gray-900 rounded-lg p-6 border border-gray-800 tool-card">
                <h2 class="text-xl font-semibold text-white mb-4">星座日期查询</h2>
                <div class="mb-4">
                    <input type="month" id="birth-month" class="w-full bg-gray-800 text-white px-4 py-2 rounded-lg border border-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-4">
                    <input type="number" id="birth-day" min="1" max="31" placeholder="日期 (1-31)" class="w-full bg-gray-800 text-white px-4 py-2 rounded-lg border border-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button onclick="checkZodiac()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg transition-colors">查询星座</button>
                <div id="zodiac-result" class="mt-4 p-4 bg-gray-800 rounded-lg hidden">
                    <div class="text-4xl text-center mb-2" id="zodiac-symbol"></div>
                    <div class="text-xl font-semibold text-white text-center" id="zodiac-name"></div>
                </div>
            </div>

            <!-- 行星符号记忆游戏 -->
            <div class="bg-gray-900 rounded-lg p-6 border border-gray-800 tool-card">
                <h2 class="text-xl font-semibold text-white mb-4">行星符号记忆游戏</h2>
                <button onclick="startMemoryGame()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg transition-colors mb-4">开始游戏</button>
                <div id="memory-game" class="grid grid-cols-2 gap-2 hidden">
                    <!-- 卡片将动态生成 -->
                </div>
                <div id="game-score" class="mt-4 text-center text-gray-400 hidden">匹配: <span id="matches">0</span>/5</div>
            </div>

            <!-- 占星学小测验 -->
            <div class="bg-gray-900 rounded-lg p-6 border border-gray-800 tool-card">
                <h2 class="text-xl font-semibold text-white mb-4">占星学小测验</h2>
                <button onclick="startQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg transition-colors mb-4">开始测验</button>
                <div id="quiz-container" class="hidden">
                    <div id="quiz-question" class="mb-4 text-white"></div>
                    <div id="quiz-options" class="space-y-2 mb-4"></div>
                    <div id="quiz-result" class="mt-4 p-4 bg-gray-800 rounded-lg hidden"></div>
                    <div class="text-sm text-gray-400 mb-4">问题 <span id="quiz-progress">0</span>/5</div>
                </div>
            </div>
        </div>
    </main>

    <script src="tools.js"></script>
</body>
</html>
