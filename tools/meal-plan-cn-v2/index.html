<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 智能膳食计划 v2</title>
<meta property="og:title" content="📅 智能膳食计划 v2">
<meta property="og:description" content="📅 智能膳食计划 v2 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="制定每周膳食计划，自动计算营养目标和生成购物清单">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#8b5cf6;--accent2:#7c3aed;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#7c3aed;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--blue:#0969da;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=number]{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;width:80px}
select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}
@media(max-width:700px){.week-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:400px){.week-grid{grid-template-columns:repeat(2,1fr)}}
.day-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;min-height:120px;cursor:pointer;transition:all .2s}
.day-card:hover{border-color:var(--accent)}
.day-card.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-card .day-name{font-weight:700;font-size:.85rem;color:var(--accent);margin-bottom:6px}
.day-card .meal{font-size:.75rem;color:var(--text2);padding:3px 0;border-bottom:1px dashed var(--border)}
.day-card .meal:last-child{border-bottom:none}
.day-card .meal b{color:var(--text);font-weight:600}
.meal-tag{display:inline-block;padding:2px 6px;border-radius:6px;font-size:.65rem;margin-right:4px}
.meal-tag.breakfast{background:rgba(59,130,246,.15);color:var(--blue)}
.meal-tag.lunch{background:rgba(34,197,94,.15);color:var(--green)}
.meal-tag.dinner{background:rgba(234,179,8,.15);color:var(--yellow)}
.meal-tag.snack{background:rgba(139,92,246,.15);color:var(--accent)}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:200;display:none;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:500px;width:100%;border:1px solid var(--border);padding:24px;max-height:80vh;overflow-y:auto}
.modal h3{margin-bottom:16px;color:var(--accent)}
.modal-close{float:right;background:none;border:none;color:var(--text2);cursor:pointer;font-size:1.2rem}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.stat-box{text-align:center;padding:12px 8px;background:var(--bg);border-radius:8px}
.stat-box .num{font-size:1.1rem;font-weight:700;color:var(--accent)}
.stat-box .lbl{font-size:.7rem;color:var(--text2);margin-top:2px}
.recipe-option{padding:10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;margin-bottom:8px;transition:all .2s}
.recipe-option:hover{border-color:var(--accent);background:var(--bg)}
.recipe-option .name{font-weight:600}
.recipe-option .meta{font-size:.8rem;color:var(--text2)}
.grocery-list{columns:2;column-gap:16px}
.grocery-item{break-inside:avoid;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem;display:flex;align-items:center;gap:8px}
.grocery-item input[type=checkbox]{accent-color:var(--accent)}
.grocery-item.done{text-decoration:line-through;color:var(--text2)}
.empty{text-align:center;padding:30px;color:var(--text2);font-size:.9rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📅 智能膳食计划 v2</h1><p>制定每周膳食计划，自动计算营养摄入</p></div>

<div class="cd"><h2>⚙️ 营养目标设置</h2>
<div class="fr">
<div><label>每日热量目标(千卡)</label><input type="number" id="targetCal" value="2000" min="500" max="5000"></div>
<div><label>饮食偏好</label><select id="dietType">
<option value="balanced">均衡饮食</option><option value="highProtein">高蛋白</option><option value="lowCarb">低碳水</option><option value="vegetarian">素食</option>
</select></div>
</div>
<div class="bg"><button onclick="autoFill()">🎲 智能填充整周</button><button class="sec" onclick="clearWeek()">🗑️ 清空</button><button class="sec" onclick="showGroceryList()">🛒 查看购物清单</button></div></div>

<div class="cd"><h2>📊 本周营养概览</h2><div class="stats-grid" id="weekStats"></div></div>

<div class="week-grid" id="weekGrid"></div>

<div class="modal-overlay" id="modal">
<div class="modal">
<button class="modal-close" onclick="closeModal()">✕</button>
<h3 id="modalTitle">添加餐食</h3>
<div id="modalBody"></div>
</div>
</div>

<div class="cd" id="groceryCard" style="display:none"><h2>🛒 购物清单</h2><div class="grocery-list" id="groceryList"></div>
<div class="bg"><button onclick="exportGrocery()">📋 复制清单</button></div></div>
</div>
<script>
var DB='meal_plan_v2',plan=JSON.parse(localStorage.getItem(DB)||'{}');
var DAYS=['周一','周二','周三','周四','周五','周六','周日'];
var MEALS=['早餐','午餐','晚餐','加餐'];
var RECIPES=[
{name:'燕麦牛奶',meal:'早餐',cal:280,p:12,c:42,f:8,ings:['燕麦50g','牛奶200ml','蜂蜜10g']},
{name:'鸡蛋三明治',meal:'早餐',cal:350,p:18,c:30,f:16,ings:['面包2片','鸡蛋2个','生菜2片','番茄1片']},
{name:'豆浆油条',meal:'早餐',cal:400,p:12,c:50,f:18,ings:['豆浆300ml','油条2根']},
{name:'水果酸奶',meal:'早餐',cal:200,p:8,c:30,f:5,ings:['酸奶150g','苹果半个','蜂蜜5g']},
{name:'红烧肉配饭',meal:'午餐',cal:650,p:25,c:60,f:35,ings:['五花肉200g','米饭150g','酱油15ml','冰糖10g']},
{name:'鸡胸肉沙拉',meal:'午餐',cal:380,p:32,c:15,f:22,ings:['鸡胸肉150g','生菜100g','番茄50g','橄榄油10ml']},
{name:'番茄鸡蛋面',meal:'午餐',cal:450,p:16,c:65,f:12,ings:['面条200g','鸡蛋2个','番茄2个']},
{name:'宫保鸡丁配饭',meal:'午餐',cal:520,p:28,c:55,f:20,ings:['鸡胸肉150g','花生米30g','米饭150g','干辣椒5个']},
{name:'清蒸鱼配蔬菜',meal:'晚餐',cal:350,p:30,c:10,f:20,ings:['鲈鱼200g','西兰花100g','蒸鱼豉油10ml']},
{name:'蔬菜汤面',meal:'晚餐',cal:300,p:10,c:50,f:6,ings:['面条150g','白菜100g','胡萝卜50g']},
{name:'虾仁炒蛋配饭',meal:'晚餐',cal:450,p:28,c:45,f:18,ings:['虾仁100g','鸡蛋2个','米饭150g']},
{name:'豆腐蔬菜煲',meal:'晚餐',cal:280,p:15,c:20,f:14,ings:['豆腐200g','白菜100g','胡萝卜50g']},
{name:'苹果',meal:'加餐',cal:52,p:0.3,c:14,f:0.2,ings:['苹果1个']},
{name:'坚果',meal:'加餐',cal:180,p:6,c:6,f:16,ings:['混合坚果30g']},
{name:'酸奶',meal:'加餐',cal:97,p:3.5,c:12,f:3.3,ings:['酸奶100g']},
{name:'香蕉',meal:'加餐',cal:89,p:1.1,c:23,f:0.3,ings:['香蕉1根']}
];

function renderWeek(){
var grid=document.getElementById('weekGrid');
var today=new Date().getDay();var todayIdx=today===0?6:today-1;
grid.innerHTML=DAYS.map(function(d,i){
var dayPlan=plan[i]||{};
var isToday=i===todayIdx;
return '<div class="day-card'+(isToday?' today':'')+'" onclick="openDay('+i+')"><div class="day-name">'+d+(isToday?' 📍':'')+'</div>'+
MEALS.map(function(m){var r=dayPlan[m];return r?'<div class="meal"><span class="meal-tag '+getMealClass(m)+'">'+m+'</span><b>'+r.name+'</b> '+r.cal+'千卡</div>':'<div class="meal"><span class="meal-tag '+getMealClass(m)+'">'+m+'</span><span style="color:var(--text2)">+</span></div>'}).join('')+
'</div>'}).join('');
updateStats();
}
function getMealClass(m){return m==='早餐'?'breakfast':m==='午餐'?'lunch':m==='晚餐'?'dinner':'snack';}
function openDay(dayIdx){
var dayName=DAYS[dayIdx];
document.getElementById('modalTitle').textContent=dayName+' - 添加餐食';
var body='<div id="mealSections">';
MEALS.forEach(function(m){
var existing=plan[dayIdx]&&plan[dayIdx][m];
body+='<div style="margin-bottom:16px"><h4 style="color:var(--accent);margin-bottom:8px">'+m+(existing?' - '+existing.name:'')+'</h4>';
if(existing)body+='<button class="dng" style="font-size:.8rem;padding:4px 10px;margin-bottom:8px" onclick="removeMeal('+dayIdx+',\''+m+'\')">移除</button>';
var options=RECIPES.filter(function(r){return r.meal===m;});
body+=options.map(function(r){return '<div class="recipe-option" onclick="addMeal('+dayIdx+',\''+m+'','+JSON.stringify(r).replace(/"/g,'&quot;')+')"><div class="name">'+r.name+'</div><div class="meta">'+r.cal+'千卡 · 蛋白质'+r.p+'g</div></div>'}).join('');
body+='</div>';
});
body+='</div>';
document.getElementById('modalBody').innerHTML=body;
document.getElementById('modal').classList.add('show');
}
function addMeal(dayIdx,meal,recipe){
if(!plan[dayIdx])plan[dayIdx]={};plan[dayIdx][meal]=recipe;
localStorage.setItem(DB,JSON.stringify(plan));closeModal();renderWeek();
}
function removeMeal(dayIdx,meal){if(plan[dayIdx])delete plan[dayIdx][meal];localStorage.setItem(DB,JSON.stringify(plan));closeModal();renderWeek();}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function updateStats(){
var weekCal=0,weekP=0,weekC=0,weekF=0;
DAYS.forEach(function(_,i){var dp=plan[i]||{};Object.values(dp).forEach(function(r){weekCal+=r.cal;weekP+=r.p;weekC+=r.c;weekF+=r.f})});
var target=parseInt(document.getElementById('targetCal').value)||2000;
document.getElementById('weekStats').innerHTML=[
{v:weekCal,l:'本周总热量',s:'千卡'},{v:(weekCal/7).toFixed(0),l:'日均热量',s:'千卡'},
{v:(weekP/7).toFixed(0)+'g',l:'日均蛋白质',s:''},{v:Math.round(weekCal/(target*7)*100)+'%',l:'目标达成率',s:''}
].map(function(i){return '<div class="stat-box"><div class="num">'+i.v+'</div><div class="lbl">'+i.l+'</div></div>'}).join('');
}
function autoFill(){
RECIPES.forEach(function(r){var available=Object.values(plan).filter(function(d){return d&&d[r.meal]&&d[r.meal].name===r.name}).length;if(available>=2)return;
for(var i=0;i<7;i++){if(!plan[i])plan[i]={};if(!plan[i][r.meal]){plan[i][r.meal]=r;break;}}});
localStorage.setItem(DB,JSON.stringify(plan));renderWeek();
}
function clearWeek(){if(confirm('确定清空整周计划？')){plan={};localStorage.setItem(DB,JSON.stringify(plan));renderWeek();}}
function showGroceryList(){
var card=document.getElementById('groceryCard');card.style.display='block';
var allIngs={};DAYS.forEach(function(_,i){var dp=plan[i]||{};Object.values(dp).forEach(function(r){(r.ings||[]).forEach(function(ing){allIngs[ing]=(allIngs[ing]||0)+1})})});
document.getElementById('groceryList').innerHTML=Object.entries(allIngs).map(function(e){return '<div class="grocery-item"><input type="checkbox" onchange="this.parentElement.classList.toggle(\'done\')"><span>'+e[0]+(e[1]>1?' ×'+e[1]:'')+'</span></div>'}).join('')||'<div class="empty">暂无购物项</div>';
card.scrollIntoView({behavior:'smooth'});
}
function exportGrocery(){
var items=[];document.querySelectorAll('.grocery-item').forEach(function(el){items.push('☐ '+el.textContent)});navigator.clipboard.writeText(items.join('\n'));alert('已复制到剪贴板');
}
renderWeek();
</script>
</body>
</html>
