<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 实体编码转换工具</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;
  --bg-secondary:#161b22;
  --bg-tertiary:#21262d;
  --border:#30363d;
  --text:#e6edf3;
  --text-secondary:#8b949e;
  --text-muted:#6e7681;
  --accent:#58a6ff;
  --accent-hover:#79c0ff;
  --green:#3fb950;
  --green-hover:#56d364;
  --red:#f85149;
  --orange:#d2991d;
  --purple:#a371f7;
  --font-mono:'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --radius:8px;
}
html{font-size:16px}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-sans);
  line-height:1.6;
  min-height:100vh;
}
.container{max-width:1100px;margin:0 auto;padding:24px 20px}
header{text-align:center;padding:32px 0 16px}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text-secondary);margin-top:6px;font-size:0.95rem}
.card{
  background:var(--bg-secondary);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:20px;
}
.card-title{font-size:1.1rem;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:1.25rem}
.mode-selector{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.mode-btn{
  flex:1;min-width:140px;
  padding:10px 16px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--bg-tertiary);
  color:var(--text);
  font-size:0.9rem;
  cursor:pointer;
  font-family:var(--font-sans);
  transition:all .2s;
  text-align:center;
}
.mode-btn:hover{border-color:var(--accent);background:var(--bg)}
.mode-btn.active{
  border-color:var(--accent);
  background:rgba(88,166,255,0.12);
  color:var(--accent);
  box-shadow:0 0 0 1px rgba(88,166,255,0.25);
}
.textarea-wrap{position:relative;margin-bottom:12px}
.textarea-wrap label{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:6px;font-size:0.85rem;color:var(--text-secondary);
}
.char-count{font-family:var(--font-mono);font-size:0.8rem;color:var(--text-muted)}
textarea{
  width:100%;min-height:160px;max-height:400px;
  padding:14px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);
  font-family:var(--font-mono);
  font-size:0.9rem;
  line-height:1.55;
  resize:vertical;
  transition:border-color .2s;
}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(88,166,255,0.15)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn{
  padding:9px 18px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  font-size:0.9rem;
  cursor:pointer;
  font-family:var(--font-sans);
  transition:all .2s;
  font-weight:500;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{
  background:var(--bg-tertiary);
  color:var(--text);
}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-green:hover{background:var(--green-hover)}
.btn-sm{padding:5px 10px;font-size:0.8rem}
.swap-btn{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;
  border-radius:50%;
  background:var(--bg-tertiary);
  border:1px solid var(--border);
  color:var(--text-secondary);
  cursor:pointer;
  font-size:1.1rem;
  transition:all .2s;
  padding:0;margin:0 auto;
}
.swap-btn:hover{border-color:var(--accent);color:var(--accent)}
.search-input{
  width:100%;padding:10px 14px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);
  font-size:0.9rem;
  font-family:var(--font-sans);
  margin-bottom:12px;
}
.search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(88,166,255,0.15)}
.search-input::placeholder{color:var(--text-muted)}
.entity-table-wrap{max-height:420px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius)}
.entity-table-wrap::-webkit-scrollbar{width:6px}
.entity-table-wrap::-webkit-scrollbar-track{background:var(--bg)}
.entity-table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:0.85rem}
table thead{position:sticky;top:0;z-index:1}
table th{
  background:var(--bg-tertiary);
  padding:10px 12px;
  text-align:left;
  font-weight:600;
  color:var(--text-secondary);
  border-bottom:1px solid var(--border);
  font-size:0.8rem;
  white-space:nowrap;
}
table td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table tbody tr{cursor:pointer;transition:background .15s}
table tbody tr:hover{background:rgba(88,166,255,0.06)}
table tbody tr:active{background:rgba(88,166,255,0.12)}
.char-cell{font-size:1.3rem;font-weight:700;text-align:center;min-width:40px}
.entity-cell{font-family:var(--font-mono);color:var(--accent)}
.num-cell{font-family:var(--font-mono);color:var(--text-muted)}
.desc-cell{color:var(--text-secondary)}
.copy-toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:var(--green);color:#fff;padding:10px 24px;
  border-radius:var(--radius);font-size:0.9rem;
  z-index:999;pointer-events:none;
  opacity:0;transition:opacity .3s;
}
.copy-toast.show{opacity:1}
.history-list{list-style:none}
.history-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;
  border-radius:6px;
  margin-bottom:4px;
  cursor:pointer;
  font-family:var(--font-mono);
  font-size:0.8rem;
  background:var(--bg);
  border:1px solid transparent;
  transition:all .15s;
  gap:8px;
}
.history-item:hover{
  border-color:var(--border);
  background:var(--bg-tertiary);
}
.history-item .mode-tag{
  font-family:var(--font-sans);
  font-size:0.7rem;
  padding:2px 8px;
  border-radius:20px;
  background:var(--bg-tertiary);
  color:var(--text-muted);
  white-space:nowrap;
}
.history-item .preview{
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-secondary);
}
.history-item .del-btn{
  background:none;border:none;color:var(--text-muted);
  cursor:pointer;font-size:1rem;padding:2px 6px;
  border-radius:4px;transition:all .15s;
}
.history-item .del-btn:hover{color:var(--red);background:rgba(248,81,73,0.1)}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.empty-state{text-align:center;padding:24px;color:var(--text-muted);font-size:0.9rem}
footer{text-align:center;padding:24px 0;color:var(--text-muted);font-size:0.8rem}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
@media(max-width:640px){
  .container{padding:12px}
  header h1{font-size:1.5rem}
  .mode-selector{flex-direction:column}
  .btn-row{flex-direction:column}
  .btn{justify-content:center}
  table{font-size:0.75rem}
  table th,table td{padding:6px 8px}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>HTML 实体编码转换工具</h1>
<p>在线 HTML Entity 编码/解码，支持多种转换模式与实体速查</p>
</header>

<div class="card">
<div class="card-title"><span class="icon">&#9881;</span>转换模式</div>
<div class="mode-selector" id="modeSelector">
<button class="mode-btn active" data-mode="special">仅特殊字符</button>
<button class="mode-btn" data-mode="numeric">全部字符</button>
<button class="mode-btn" data-mode="named">命名实体</button>
</div>
</div>

<div class="card">
<div class="card-title"><span class="icon">&#9998;</span>输入</div>
<div class="textarea-wrap">
<label>输入 HTML 代码或文本 <span class="char-count" id="inputCount">0 字符</span></label>
<textarea id="inputArea" placeholder="在此粘贴 HTML 代码或普通文本..."></textarea>
</div>
<div class="btn-row">
<button class="btn btn-primary" id="encodeBtn">&#8594; 编码</button>
<button class="btn btn-primary" id="decodeBtn">&#8592; 解码</button>
<button class="btn btn-secondary" id="copyInputBtn">&#128203; 复制输入</button>
<button class="btn btn-secondary" id="clearInputBtn">&#128465; 清空</button>
</div>
</div>

<div style="text-align:center;margin:-8px 0;">
<button class="swap-btn" id="swapBtn" title="交换输入输出">&#8645;</button>
</div>

<div class="card">
<div class="card-title"><span class="icon">&#10003;</span>结果</div>
<div class="textarea-wrap">
<label>转换结果 <span class="char-count" id="outputCount">0 字符</span></label>
<textarea id="outputArea" placeholder="转换结果将显示在这里..." readonly></textarea>
</div>
<div class="btn-row">
<button class="btn btn-green" id="copyResultBtn">&#128203; 复制结果</button>
<button class="btn btn-secondary" id="clearOutputBtn">&#128465; 清空结果</button>
</div>
</div>

<div class="card">
<div class="card-title"><span class="icon">&#128218;</span>HTML 实体参考表 <span style="font-weight:400;font-size:0.8rem;color:var(--text-muted)">（点击行复制实体）</span></div>
<input type="text" class="search-input" id="entitySearch" placeholder="搜索实体名称、字符或描述...">
<div class="entity-table-wrap">
<table>
<thead>
<tr><th>字符</th><th>命名实体</th><th>数字代码</th><th>描述</th></tr>
</thead>
<tbody id="entityTableBody"></tbody>
</table>
</div>
</div>

<div class="card">
<div class="history-header">
<span class="card-title" style="margin-bottom:0"><span class="icon">&#128337;</span>历史记录</span>
<button class="btn btn-secondary btn-sm" id="clearHistoryBtn">清空历史</button>
</div>
<ul class="history-list" id="historyList">
<li class="empty-state">暂无转换记录</li>
</ul>
</div>

<footer>
<p>HTML 实体编码转换工具 &middot; 数据仅在浏览器本地存储 &middot; <a href="https://developer.mozilla.org/zh-CN/docs/Glossary/Entity" target="_blank" rel="noopener">MDN 实体文档</a></p>
</footer>
</div>

<div class="copy-toast" id="copyToast"></div>

  {ch:'\u2030',name:'&permil;', num:'&#8240;', desc:'千分号 (per mille)'},
  {ch:'\u20B9',name:'&#8377;', num:'&#8377;', desc:'印度卢比 (Indian rupee)'},
  {ch:'\u2116',name:'&numero;', num:'&#8470;', desc:'编号符号 (numero sign)'},
  {ch:'\u2126',name:'&ohm;', num:'&#8486;', desc:'欧姆 (ohm)'},
  {ch:'\u2200',name:'&forall;', num:'&#8704;', desc:'全称量词 (for all)'},
  {ch:'\u2202',name:'&part;', num:'&#8706;', desc:'偏微分 (partial differential)'},
  {ch:'\u2203',name:'&exist;', num:'&#8707;', desc:'存在量词 (there exists)'},
  {ch:'\u2205',name:'&empty;', num:'&#8709;', desc:'空集 (empty set)'},
  {ch:'\u2208',name:'&isin;', num:'&#8712;', desc:'属于 (element of)'},
  {ch:'\u2209',name:'&notin;', num:'&#8713;', desc:'不属于 (not an element of)'},
  {ch:'\u220B',name:'&ni;', num:'&#8715;', desc:'包含 (contains as member)'},
  {ch:'\u2217',name:'&lowast;', num:'&#8727;', desc:'星号运算符 (asterisk operator)'},
  {ch:'\u221D',name:'&prop;', num:'&#8733;', desc:'正比于 (proportional to)'},
  {ch:'\u2220',name:'&ang;', num:'&#8736;', desc:'角 (angle)'},
  {ch:'\u2227',name:'&and;', num:'&#8743;', desc:'逻辑与 (logical and)'},
  {ch:'\u2228',name:'&or;', num:'&#8744;', desc:'逻辑或 (logical or)'},
  {ch:'\u2229',name:'&cap;', num:'&#8745;', desc:'交集 (intersection)'},
  {ch:'\u222A',name:'&cup;', num:'&#8746;', desc:'并集 (union)'},
  {ch:'\u2282',name:'&sub;', num:'&#8834;', desc:'子集 (subset of)'},
  {ch:'\u2283',name:'&sup;', num:'&#8835;', desc:'超集 (superset of)'},
  {ch:'\u2286',name:'&sube;', num:'&#8838;', desc:'子集或等于 (subset of or equal to)'},
  {ch:'\u2287',name:'&supe;', num:'&#8839;', desc:'超集或等于 (superset of or equal to)'},
];

const nameMap = {};
const charMap = {};
ENTITIES.forEach(function(e){
  nameMap[e.name] = e.ch;
  if(!charMap[e.ch]) charMap[e.ch] = e;
});

function decodeEntities(text){
  return text.replace(/&(?:[a-zA-Z]+|#\d+|#x[0-9a-fA-F]+);/g, function(m){
    if(nameMap[m]) return nameMap[m];
    var num = null;
    if(m.indexOf('#x')===1){num=parseInt(m.slice(3,-1),16);}
    else if(m.indexOf('#')===1){num=parseInt(m.slice(2,-1),10);}
    if(num!==null&&num>0){try{return String.fromCodePoint(num);}catch(e2){return m;}}
    return m;
  });
}

function countChars(text){
  var len = 0;
  for(var i=0;i<text.length;i++){
    var c=text.charCodeAt(i);
    if(c>=0xD800&&c<=0xDBFF){i++;len++;}
    else{len++;}
  }
  return len;
}

function encodeSpecial(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function encodeNumeric(text){
  var result='';
  for(var i=0;i<text.length;i++){
    var c=text.charCodeAt(i);
    if(c>=0xD800&&c<=0xDBFF&&i+1<text.length){
      var lo=text.charCodeAt(i+1);
      if(lo>=0xDC00&&lo<=0xDFFF){
        var cp=(c-0xD800)*0x400+(lo-0xDC00)+0x10000;
        result+='&#'+cp+';';
        i++;
        continue;
      }
    }
    if(c===38){result+='&amp;';}
    else if(c===60){result+='&lt;';}
    else if(c===62){result+='&gt;';}
    else if(c===34){result+='&quot;';}
    else{result+='&#'+c+';';}
  }
  return result;
}

function encodeNamed(text){
  var result='';
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(c==='&'){result+='&amp;';continue;}
    if(c==='<'){result+='&lt;';continue;}
    if(c==='>'){result+='&gt;';continue;}
    if(c==='"'){result+='&quot;';continue;}
    var ent=charMap[c];
    if(ent&&ent.name.substring(0,1)!=='&'||(ent&&ent.name.charAt(0)==='&'&&ent.name.charAt(1)!=='#')){
      if(ent.name.indexOf('&#')===0){
        result+=ent.num;
      }else{
        result+=ent.name;
      }
    }else{
      result+=c;
    }
  }
  return result;
}

var mode='special';
var history=[];
var MAX_HISTORY=20;

function getMode(){return document.querySelector('.mode-btn.active').dataset.mode;}

function encode(text,m){
  if(m==='special')return encodeSpecial(text);
  if(m==='numeric')return encodeNumeric(text);
  if(m==='named')return encodeNamed(text);
  return text;
}

function updateCounts(){
  var input=document.getElementById('inputArea').value;
  var output=document.getElementById('outputArea').value;
  document.getElementById('inputCount').textContent=countChars(input)+' 字符';
  document.getElementById('outputCount').textContent=countChars(output)+' 字符';
}

function doEncode(){
  var input=document.getElementById('inputArea').value;
  if(!input)return;
  var m=getMode();
  var result=encode(input,m);
  document.getElementById('outputArea').value=result;
  updateCounts();
  addHistory(input,result,m,'encode');
}

function doDecode(){
  var input=document.getElementById('inputArea').value;
  if(!input)return;
  var result=decodeEntities(input);
  document.getElementById('outputArea').value=result;
  updateCounts();
  addHistory(input,result,'','decode');
}

function copyText(text,label){
  navigator.clipboard.writeText(text).then(function(){
    showToast(label+' 已复制！');
  }).catch(function(){
    showToast('复制失败，请手动选择复制');
  });
}

function showToast(msg){
  var t=document.getElementById('copyToast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout=setTimeout(function(){t.classList.remove('show');},2000);
}

function swapAreas(){
  var input=document.getElementById('inputArea');
  var output=document.getElementById('outputArea');
  var tmp=input.value;
  input.value=output.value;
  output.value=tmp;
  updateCounts();
}

function loadHistory(){
  try{
    var raw=localStorage.getItem('html_entity_history');
    if(raw){history=JSON.parse(raw);}
  }catch(e){history=[];}
}

function saveHistory(){
  try{
    localStorage.setItem('html_entity_history',JSON.stringify(history));
  }catch(e){}
}

function addHistory(input,result,modeType,opType){
  var item={
    input:input.length>80?input.substring(0,80)+'...':input,
    result:result.length>80?result.substring(0,80)+'...':result,
    fullInput:input,
    fullResult:result,
    mode:opType==='encode'?modeType:'解码',
    op:opType,
    ts:Date.now()
  };
  history.unshift(item);
  if(history.length>MAX_HISTORY)history.pop();
  saveHistory();
  renderHistory();
}

function renderHistory(){
  var list=document.getElementById('historyList');
  if(!history.length){
    list.innerHTML='<li class="empty-state">暂无转换记录</li>';
    return;
  }
  var html='';
  history.forEach(function(item,idx){
    var modeLabel=item.mode;
    if(item.mode==='special')modeLabel='仅特殊字符';
    else if(item.mode==='numeric')modeLabel='全部字符';
    else if(item.mode==='named')modeLabel='命名实体';
    html+='<li class="history-item" data-idx="'+idx+'">'+
      '<span class="mode-tag">'+modeLabel+'</span>'+
      '<span class="preview" title="'+item.result.replace(/"/g,'&quot;')+'">'+item.result+'</span>'+
      '<button class="del-btn" data-action="del" data-idx="'+idx+'">&times;</button>'+
      '</li>';
  });
  list.innerHTML=html;
}

function renderEntityTable(filter){
  var tbody=document.getElementById('entityTableBody');
  var f=(filter||'').toLowerCase();
  var rows='';
  ENTITIES.forEach(function(e){
    if(f&&e.name.toLowerCase().indexOf(f)===-1&&e.ch.toLowerCase().indexOf(f)===-1&&e.desc.toLowerCase().indexOf(f)===-1&&e.num.toLowerCase().indexOf(f)===-1)return;
    rows+='<tr data-entity="'+e.name.replace(/"/g,'&quot;')+'">'+
      '<td class="char-cell">'+e.ch+'</td>'+
      '<td class="entity-cell">'+e.name+'</td>'+
      '<td class="num-cell">'+e.num+'</td>'+
      '<td class="desc-cell">'+e.desc+'</td>'+
      '</tr>';
  });
  tbody.innerHTML=rows;
}

document.addEventListener('DOMContentLoaded',function(){
  loadHistory();
  renderHistory();

  document.getElementById('modeSelector').addEventListener('click',function(e){
    var btn=e.target.closest('.mode-btn');
    if(!btn)return;
    document.querySelectorAll('.mode-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    mode=btn.dataset.mode;
  });

  document.getElementById('encodeBtn').addEventListener('click',doEncode);
  document.getElementById('decodeBtn').addEventListener('click',doDecode);

  document.getElementById('copyResultBtn').addEventListener('click',function(){
    var val=document.getElementById('outputArea').value;
    if(val)copyText(val,'结果');
  });

  document.getElementById('copyInputBtn').addEventListener('click',function(){
    var val=document.getElementById('inputArea').value;
    if(val)copyText(val,'输入');
  });

  document.getElementById('clearInputBtn').addEventListener('click',function(){
    document.getElementById('inputArea').value='';
    updateCounts();
  });

  document.getElementById('clearOutputBtn').addEventListener('click',function(){
    document.getElementById('outputArea').value='';
    updateCounts();
  });

  document.getElementById('swapBtn').addEventListener('click',swapAreas);

  document.getElementById('clearHistoryBtn').addEventListener('click',function(){
    history=[];
    saveHistory();
    renderHistory();
    showToast('历史记录已清空');
  });

  document.getElementById('historyList').addEventListener('click',function(e){
    var delBtn=e.target.closest('[data-action="del"]');
    if(delBtn){
      e.stopPropagation();
      var idx=parseInt(delBtn.dataset.idx);
      history.splice(idx,1);
      saveHistory();
      renderHistory();
      return;
    }
    var item=e.target.closest('.history-item');
    if(item){
      var idx=parseInt(item.dataset.idx);
      var h=history[idx];
      if(h){
        document.getElementById('inputArea').value=h.fullInput;
        document.getElementById('outputArea').value=h.fullResult;
        updateCounts();
      }
    }
  });

  document.getElementById('entitySearch').addEventListener('input',function(){
    renderEntityTable(this.value);
  });

  document.getElementById('entityTableBody').addEventListener('click',function(e){
    var row=e.target.closest('tr');
    if(!row)return;
    var entity=row.dataset.entity;
    if(entity){
      copyText(entity,'实体 '+entity);
    }
  });

  document.getElementById('inputArea').addEventListener('input',updateCounts);

  renderEntityTable('');
  updateCounts();
});
})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
