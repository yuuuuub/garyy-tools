<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git提交日志可视化</title>
<meta name="description" content="粘贴Git日志，可视化展示提交历史、分支和统计信息">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:1200px;margin:0 auto}
h1{font-size:1.6rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:16px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.9rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
textarea{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Fira Code',monospace;font-size:.82rem;resize:vertical;min-height:150px}
textarea:focus{outline:none;border-color:var(--accent)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.stat{text-align:center;padding:12px}
.stat-num{font-size:2rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.8rem;color:var(--text2)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.commit{padding:12px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.commit:last-child{border-bottom:none}
.commit-hash{font-family:'Fira Code',monospace;font-size:.82rem;color:var(--accent);min-width:70px}
.commit-msg{flex:1;font-size:.9rem}
.commit-meta{font-size:.78rem;color:var(--text2);margin-top:2px}
.commit-author{font-size:.78rem;color:var(--green);min-width:80px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:600}
.tag-feat{background:rgba(63,185,80,.2);color:var(--green)}
.tag-fix{background:rgba(248,81,73,.2);color:var(--red)}
.tag-docs{background:rgba(59,130,246,.2);color:var(--accent2)}
.tag-style{background:rgba(139,92,246,.2);color:#a78bfa}
.tag-refactor{background:rgba(210,153,34,.2);color:var(--yellow)}
.tag-test{background:rgba(6,182,212,.2);color:#06b6d4}
.tag-other{background:var(--bg);color:var(--text2)}
.chart-bar{height:24px;border-radius:4px;margin:2px 0;position:relative;cursor:pointer;transition:opacity .15s}
.chart-bar:hover{opacity:.85}
.chart-label{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.75rem;font-weight:600}
.author-bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.85rem}
.author-bar .bar{height:20px;border-radius:4px;transition:width .5s}
.hidden{display:none!important}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto}
.tab{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.82rem;white-space:nowrap;color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){background:var(--border)}
#timeline{position:relative;padding-left:30px}
#timeline::before{content:'';position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-dot{position:absolute;left:6px;width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);background:var(--card)}
@media(max-width:600px){body{padding:10px}h1{font-size:1.3rem}}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Git提交日志可视化">
<meta property="og:description" content="粘贴Git日志，可视化展示提交历史和统计">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📊 Git提交日志可视化';
const APP=document.getElementById('app');
let commits=[];
let viewTab='timeline';
const SAMPLE=`a1b2c3d 2025-01-15 张三 <zhang@example.com> feat: 新增用户登录功能
e4f5g6h 2025-01-15 张三 <zhang@example.com> fix: 修复登录验证bug
i7j8k9l 2025-01-14 李四 <li@example.com> docs: 更新API文档
m0n1o2p 2025-01-14 李四 <li@example.com> feat: 添加数据导出功能
q3r4s5t 2025-01-13 王五 <wang@example.com> style: 优化页面样式
u6v7w8x 2025-01-13 王五 <wang@example.com> fix: 修复导出格式问题
y9z0a1b 2025-01-12 张三 <zhang@example.com> feat: 新增图表展示
c2d3e4f 2025-01-12 张三 <zhang@example.com> refactor: 重构数据层
g5h6i7j 2025-01-11 李四 <li@example.com> test: 添加单元测试
k8l9m0n 2025-01-11 王五 <wang@example.com> feat: 实现权限管理
o1p2q3r 2025-01-10 张三 <zhang@example.com> fix: 修复权限验证
s4t5u6v 2025-01-10 张三 <zhang@example.com> docs: 编写使用文档
w7x8y9z 2025-01-09 李四 <li@example.com> feat: 添加日志功能
a0b1c2d 2025-01-09 王五 <wang@example.com> style: 统一按钮样式
e3f4g5h 2025-01-08 张三 <zhang@example.com> feat: 实现搜索功能`;

function parseLog(text){
  commits=[];
  text.split('\n').filter(l=>l.trim()).forEach(line=>{
    let m=line.match(/^([a-f0-9]+)\s+(\d{4}-\d{2}-\d{2})\s+(.+?)\s+<(.+?)>\s+(.+)$/);
    if(m){
      let msg=m[5];
      let type='other';
      if(/^feat[\s:]/.test(msg))type='feat';
      else if(/^fix[\s:]/.test(msg))type='fix';
      else if(/^docs[\s:]/.test(msg))type='docs';
      else if(/^style[\s:]/.test(msg))type='style';
      else if(/^refactor[\s:]/.test(msg))type='refactor';
      else if(/^test[\s:]/.test(msg))type='test';
      commits.push({hash:m[1],date:m[2],author:m[3],email:m[4],message:msg,type});
    }
  });
}

function render(){
  let h=`<h1>📊 Git提交日志可视化</h1><p class="subtitle">粘贴 git log 输出，可视化提交历史</p>`;
  if(commits.length===0){
    h+=`<div class="card"><label>粘贴 git log 输出</label><textarea id="log-input" placeholder="格式：hash date author <email> message\n\n示例：\na1b2c3d 2025-01-15 张三 <zhang@example.com> feat: 新增功能">${SAMPLE}</textarea>`;
    h+=`<div class="flex" style="margin-top:8px"><button class="btn" onclick="parseAndRender()">解析日志</button><button class="btn btn-outline" onclick="loadSample()">加载示例</button></div></div>`;
  } else {
    let stats=getStats();
    h+=`<div class="card"><div class="flex-between"><div class="flex"><b>已解析 ${commits.length} 条提交</b></div><div class="flex"><button class="btn btn-sm" onclick="commits=[];render()">清空</button><button class="btn btn-sm btn-outline" onclick="exportData()">导出JSON</button></div></div></div>`;
    h+=`<div class="stats-grid"><div class="stat"><div class="stat-num">${commits.length}</div><div class="stat-label">总提交</div></div><div class="stat"><div class="stat-num">${stats.authors.length}</div><div class="stat-label">贡献者</div></div><div class="stat"><div class="stat-num">${stats.feat}</div><div class="stat-label">新功能</div></div><div class="stat"><div class="stat-num">${stats.fix}</div><div class="stat-label">Bug修复</div></div></div>`;
    h+=`<div class="tabs"><div class="tab ${viewTab==='timeline'?'active':''}" onclick="viewTab='timeline';render()">时间线</div><div class="tab ${viewTab==='authors'?'active':''}" onclick="viewTab='authors';render()">贡献者</div><div class="tab ${viewTab==='types'?'active':''}" onclick="viewTab='types';render()">类型分布</div><div class="tab ${viewTab==='daily'?'active':''}" onclick="viewTab='daily';render()">每日统计</div></div>`;
    if(viewTab==='timeline'){
      h+=`<div class="card"><div id="timeline">`;
      commits.forEach(c=>{
        h+=`<div style="position:relative;padding:8px 0 8px 30px"><div class="timeline-dot" style="border-color:${typeColor(c.type)}"></div><div><span class="commit-hash">${c.hash.substring(0,7)}</span> <span class="tag tag-${c.type}">${c.type}</span></div><div class="commit-msg">${esc(c.message)}</div><div class="commit-meta">${c.date} · ${esc(c.author)}</div></div>`;
      });
      h+=`</div></div>`;
    } else if(viewTab==='authors'){
      h+=`<div class="card">`;
      let maxCount=Math.max(...stats.authors.map(a=>a.count));
      stats.authors.forEach(a=>{
        let pct=(a.count/maxCount*100).toFixed(0);
        h+=`<div class="author-bar"><span style="min-width:80px">${esc(a.name)}</span><div class="bar" style="width:${pct}%;background:var(--accent)"></div><span style="font-size:.82rem;color:var(--text2)">${a.count}</span></div>`;
      });
      h+=`</div>`;
    } else if(viewTab==='types'){
      h+=`<div class="card">`;
      let typeData=[{type:'feat',label:'新功能',count:stats.feat},{type:'fix',label:'Bug修复',count:stats.fix},{type:'docs',label:'文档',count:stats.docs},{type:'style',label:'样式',count:stats.style},{type:'refactor',label:'重构',count:stats.refactor},{type:'test',label:'测试',count:stats.test},{type:'other',label:'其他',count:stats.other}];
      let maxType=Math.max(...typeData.map(t=>t.count),1);
      typeData.forEach(t=>{
        let pct=(t.count/maxType*100).toFixed(0);
        h+=`<div class="chart-bar" style="background:${typeColor(t.type)};width:${Math.max(pct,2)}%;min-width:40px"><span class="chart-label">${t.label} (${t.count})</span></div>`;
      });
      h+=`</div>`;
    } else if(viewTab==='daily'){
      h+=`<div class="card">`;
      let byDate={};
      commits.forEach(c=>{byDate[c.date]=(byDate[c.date]||0)+1});
      let sorted=Object.entries(byDate).sort((a,b)=>a[0].localeCompare(b[0]));
      let maxDaily=Math.max(...sorted.map(d=>d[1]),1);
      sorted.forEach(([date,count])=>{
        let pct=(count/maxDaily*100).toFixed(0);
        h+=`<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span style="min-width:90px;font-size:.82rem;color:var(--text2)">${date}</span><div style="height:20px;width:${Math.max(pct,3)}%;background:var(--accent);border-radius:4px"></div><span style="font-size:.82rem">${count}</span></div>`;
      });
      h+=`</div>`;
    }
  }
  APP.innerHTML=h;
}

function getStats(){
  let authors={};let feat=0,fix=0,docs=0,style=0,refactor=0,test=0,other=0;
  commits.forEach(c=>{
    if(!authors[c.author])authors[c.author]={name:c.author,count:0};
    authors[c.author].count++;
    if(c.type==='feat')feat++;else if(c.type==='fix')fix++;else if(c.type==='docs')docs++;else if(c.type==='style')style++;else if(c.type==='refactor')refactor++;else if(c.type==='test')test++;else other++;
  });
  return{authors:Object.values(authors).sort((a,b)=>b.count-a.count),feat,fix,docs,style,refactor,test,other};
}

function typeColor(t){return{feat:'#3fb950',fix:'#f85149',docs:'#58a6ff',style:'#a78bfa',refactor:'#d29922',test:'#06b6d4',other:'#8b949e'}[t]||'#8b949e'}

function parseAndRender(){
  let input=document.getElementById('log-input');
  if(input)parseLog(input.value);
  render();
}

function loadSample(){parseLog(SAMPLE);render()}

function exportData(){
  let blob=new Blob([JSON.stringify(commits,null,2)],{type:'application/json'});
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='git-log.json';a.click();
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
