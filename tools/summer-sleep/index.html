<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😴 夏日睡眠改善 - Gary's Tools</title>
<meta name="description" content="夏天太热睡不着？科学降温助眠方法：空调设定、床品选择、睡前习惯、快速入眠法、失眠急救">
<style>
:root{--bg:#f5f3ff;--card:#fff;--text:#1e1b4b;--text2:#7c3aed;--accent:#8b5cf6;--blue:#6366f1;--moon:#c4b5fd;--border:#e0e7ff;--radius:16px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
[data-theme="dark"]{--bg:#0f0b1e;--card:#1a1530;--text:#ddd6fe;--text2:#8b5cf6;--border:#2d2456}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16pxscroll-behavior:smooth;}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#6366f1,#8b5cf6,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.03)}
.card h3{font-size:1rem;font-weight:700;margin-bottom:12px}
.temp-opt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.temp-card{padding:14px;border-radius:10px;text-align:center;border:2px solid var(--border);transition:all .2s;cursor:pointer}
.temp-card.active{border-color:var(--accent);background:rgba(139,92,246,.05)}
.temp-card .t-emoji{font-size:2rem;display:block;margin-bottom:4px}
.temp-card .t-temp{font-weight:900;font-size:1.2rem}
.temp-card .t-label{font-size:.7rem;color:var(--text2)}
.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.method-item{padding:12px;border-radius:10px;background:var(--bg);font-size:.78rem;line-height:1.5;text-align:center}
.method-item .m-emoji{font-size:1.5rem;display:block;margin-bottom:4px}
.timer-card{text-align:center;padding:24px}
.timer-display{font-size:3rem;font-weight:900;color:var(--accent);font-family:monospace;margin:12px 0}
.btn-large{width:100%;padding:16px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:var(--text);border:none;border-radius:14px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit}
.breath-steps{display:flex;justify-content:center;gap:16px;margin:12px 0}
.breath-step{text-align:center;font-size:.7rem;color:var(--text2)}
.breath-step .circle{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;margin:0 auto 4px}
.breath-inhale{background:rgba(99,102,241,.1);color:var(--blue);animation:pulse 4s infinite}
.breath-hold{background:rgba(139,92,246,.1);color:var(--accent);animation:pulse 7s infinite}
.breath-exhale{background:rgba(196,181,253,.1);color:var(--moon);animation:pulse 8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="😴 夏日睡眠改善 - Gary's Tools">
  <meta property="og:description" content="夏天太热睡不着？科学降温助眠方法：空调设定、床品选择、睡前习惯、快速入眠法、失眠急救">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/summer-sleep/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>😴 夏日睡眠改善</h1><p>天热睡不着？科学助眠不熬夜</p></header>

<div class="card">
<h2>🌡️ 最佳睡眠温度</h2>
<div class="temp-opt" id="tempCards"></div>
<div id="tempAdvice" style="font-size:.82rem;line-height:1.6;color:var(--text2);padding:10px;background:var(--bg);border-radius:10px"></div>
</div>

<div class="card">
<h2>💤 快速入眠法（4-7-8呼吸法）</h2>
<div style="text-align:center">
<div class="breath-steps">
<div class="breath-step"><div class="circle breath-inhale">4s</div>用鼻子<br>吸气</div>
<div class="breath-step"><div class="circle breath-hold">7s</div>屏住<br>呼吸</div>
<div class="breath-step"><div class="circle breath-exhale">8s</div>用嘴巴<br>呼气</div>
</div>
<button class="btn-large" id="breathBtn" onclick="startBreathing()">🧘 开始呼吸引导</button>
<div class="timer-display" id="breathDisplay" style="display:none">4</div>
<div id="breathHint" style="font-size:.8rem;color:var(--text2)"></div>
</div>
</div>

<div class="card">
<h2>🛏️ 夏日助眠清单</h2>
<div class="method-grid" id="methodList"></div>
</div>

<div class="card">
<h2>🆘 失眠急救箱</h2>
<div style="display:flex;flex-direction:column;gap:8px" id="rescueList"></div>
</div>

<footer>今晚好梦 🌙</footer>
</div>

<script>
const temps=[{e:'❄️',t:'16-18°C',l:'开空调',advise:'设26°C+睡眠模式+定时关闭。盖薄被或夏凉被，穿棉质睡衣。这是最舒适的睡眠温度区间。'},
{e:'🌡️',t:'24-26°C',l:'不开空调',advise:'开窗通风+风扇摇头。铺凉席(竹席够凉/冰丝席温和)。穿无袖轻薄睡衣，不盖被或只盖薄毯。'},
{e:'🥵',t:'28°C+',l:'怎么降温',advise:'睡前冲温水澡(别用冷水)。把冰袋/冰水瓶放在腋下和颈部大动脉处。湿毛巾敷额头。避免开灯增加热源。'},
{e:'💡',t:'通用技巧',l:'都适用',advise:'睡前1小时不玩手机(屏幕蓝光抑制褪黑素)。喝一小杯温牛奶或菊花茶。遮光窗帘+眼罩制造全黑环境。'}];
document.getElementById('tempCards').innerHTML=temps.map(t=>`<div class="temp-card" onclick="showAdvice(${temps.indexOf(t)})"><span class="t-emoji">${t.e}</span><div class="t-temp">${t.t}</div><div class="t-label">${t.l}</div></div>`).join('');
function showAdvice(i){document.getElementById('tempAdvice').textContent=temps[i].advise;}
const methods=[
{e:'🛏️',t:'凉席选择',d:'竹凉席最凉但偏硬；冰丝席温和亲肤；乳胶凉席透气抗菌'},
{e:'🧴',t:'睡前冲澡',d:'水温35-38°C温水澡，扩张血管帮助散热，别用冷水'},
{e:'🧊',t:'冷敷大法',d:'冰袋包毛巾敷额头/颈部/腋下，持续10分钟体感降温明显'},
{e:'🌬️',t:'风扇角度',d:'风扇对着窗户吹(不是人)，形成空气对流带走热气'},
{e:'🍵',t:'助眠食物',d:'温牛奶/香蕉/核桃/燕麦含色氨酸，1小时前吃少量'},
{e:'📵',t:'远离手机',d:'蓝光抑制褪黑素59%！睡前用纸质书或播客替代'},
];
document.getElementById('methodList').innerHTML=methods.map(m=>`<div class="method-item"><span class="m-emoji">${m.e}</span><b>${m.t}</b><div style="font-size:.7rem;color:var(--text2);margin-top:4px">${m.d}</div></div>`).join('');
const rescues=[
'e=\"💡\",t=\"20分钟法则\",d=\"躺下20分钟睡不着就起来，去另一个房间看会书，等困了再回去。不要在床上玩手机！\"',
'e=\"✍️\",t=\"写下烦恼\",d=\"睡前把焦虑的事情写在纸上，告诉自己\"这些明天再处理\"。大脑清空更容易入睡。\"',
'e=\"🎵\",t=\"白噪音/ASMR\",d=\"下雨声、风扇声、海浪声，掩盖环境噪音帮助入眠。不要听有歌词的歌。\"',
'e=\"🏃\",t=\"白天运动\",d=\"下午4-6点运动最助眠，睡前3小时避免剧烈运动。白天累一点晚上自然困。\"',
];
document.getElementById('rescueList').innerHTML=rescues.map(r=>`<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.8rem;line-height:1.5"><span style="font-size:1.3rem;flex-shrink:0">${r.split('t=')[0].split('"')[1]}</span><div><b>${r.split('t=')[1].split('"')[1]}：</b>${r.split('d=')[1].split('"')[1]}</div></div>`).join('');
let breathInterval;
function startBreathing(){
clearInterval(breathInterval);
document.getElementById('breathDisplay').style.display='block';
const btn=document.getElementById('breathBtn');
btn.disabled=true;
let cycle=0,sec=4;
const display=document.getElementById('breathDisplay');
const hint=document.getElementById('breathHint');
display.textContent=sec;hint.textContent='🌬️ 用鼻子吸气';
breathInterval=setInterval(()=>{
sec--;
if(sec<=0){
cycle++;
if(cycle%3===0){sec=4;display.textContent=sec;hint.textContent='🌬️ 用鼻子吸气'}
else if(cycle%3===1){sec=7;display.textContent=sec;hint.textContent='⏸️ 屏住呼吸'}
else{sec=8;display.textContent=sec;hint.textContent='💨 用嘴巴慢慢呼气'}
if(cycle>=6){clearInterval(breathInterval);display.textContent='✨';hint.textContent='完成2轮！感觉放松了一些吗？';btn.disabled=false;return;}
}
display.textContent=sec;
if(cycle%3===0)display.style.color='var(--blue)';
else if(cycle%3===1)display.style.color='var(--accent)';
else display.style.color='var(--moon)';
},1000);
}
showAdvice(0);
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
