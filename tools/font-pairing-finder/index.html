<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔤 字体搭配查找器</title>
<meta name="description" content="字体搭配查找器，帮你找到完美字体组合方案">
<style>
:root{--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tag-grid{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);cursor:pointer;font-size:13px;transition:all .2s;user-select:none}
.tag:hover{border-color:var(--accent);transform:translateY(-1px)}
.tag.active{background:var(--accent);color:var(--text);border-color:var(--accent);font-weight:600}
.input-group{margin-bottom:12px}
.input-group:last-child{margin-bottom:0}
.input-group label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px;font-weight:500}
.input-group select{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;outline:none}
.input-group input{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;outline:none}
.preview-box{border-radius:12px;padding:24px;border:1px solid var(--border);background:var(--preview-bg);margin:12px 0}
.preview-heading{margin-bottom:8px}
.preview-body{color:var(--text-secondary);line-height:1.8}
.font-info{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--preview-bg);border-radius:10px;margin-top:8px;border:1px solid var(--border)}
.font-info .name{font-weight:600;font-size:14px}
.font-info .copy-btn{background:var(--accent);color:#fff;border:none;padding:4px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.pair-card{border:1.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;transition:all .2s;cursor:pointer}
.pair-card:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(99,102,241,.15)}
.pair-card.active{border-color:var(--accent);background:var(--tag-bg)}
.pair-heading{font-size:20px;font-weight:700;margin-bottom:4px}
.pair-body{font-size:14px;color:var(--text-secondary);line-height:1.6}
.pair-meta{display:flex;gap:8px;margin-top:8px}
.pair-badge{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--accent);color:#fff}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔤</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔤 字体搭配查找器">
<meta property="og:description" content="字体搭配查找器，帮你找到完美字体组合方案">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/font-pairing-finder/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🔤 字体搭配查找器</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">🎯 风格筛选</div>
    <div class="tag-grid" id="styleGrid">
      <div class="tag active" data-val="all">全部</div>
      <div class="tag" data-val="modern">现代</div>
      <div class="tag" data-val="classic">经典</div>
      <div class="tag" data-val="elegant">优雅</div>
      <div class="tag" data-val="tech">科技</div>
      <div class="tag" data-val="art">艺术</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📝 预览文字</div>
    <div class="input-group">
      <input type="text" id="previewText" value="The quick brown fox jumps over the lazy dog 快速的棕色狐狸跳过懒狗">
    </div>
  </div>

  <div class="card">
    <div class="card-title">✨ 实时预览</div>
    <div class="preview-box" id="livePreview">
      <div class="preview-heading" id="liveHeading" style="font-size:28px;font-weight:700">字体搭配预览</div>
      <div class="preview-body" id="liveBody">选择下方的字体组合，这里会实时展示搭配效果。</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="font-info"><span class="name" id="headingFontName">-</span></div>
      <div class="font-info"><span class="name" id="bodyFontName">-</span></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🎨 推荐搭配</div>
    <div id="pairList"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="randomBtn">🎲 随机搭配</button>
    <button class="btn btn-outline" id="copyBtn">📋 复制CSS</button>
  </div>

  <footer>© 2025 Gary's Tools | garyy.top</footer>
</div>
<div class="toast" id="toast"></div>

<script>
function toggleTheme(){var h=document.documentElement;var t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('garyy_theme',t)}
(function(){var s=localStorage.getItem('garyy_theme');if(s==='dark'){document.documentElement.setAttribute('data-theme','dark');document.querySelector('.theme-toggle').textContent='☀️'}})();

function initTags(id,cb){var c=document.getElementById(id);c.addEventListener('click',function(e){var t=e.target.closest('.tag');if(!t)return;c.querySelectorAll('.tag').forEach(function(x){x.classList.remove('active')});t.classList.add('active');if(cb)cb()})}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

var fontPairs=[
  {heading:'Playfair Display',body:'Source Sans Pro',style:'elegant',cn:'经典衬线+无衬线'},
  {heading:'Montserrat',body:'Merriweather',style:'modern',cn:'几何+可读衬线'},
  {heading:'Oswald',body:'Lato',style:'tech',cn:'紧凑标题+友好正文'},
  {heading:'Raleway',body:'Roboto',style:'modern',cn:'优雅+中性'},
  {heading:'Poppins',body:'Inter',style:'modern',cn:'几何圆润+清晰'},
  {heading:'Nunito',body:'Open Sans',style:'classic',cn:'圆润+中性'},
  {heading:'Abril Fatface',body:'Lato',style:'art',cn:'展示型+简约'},
  {heading:'PT Serif',body:'PT Sans',style:'classic',cn:'俄式经典搭配'},
  {heading:'Libre Baskerville',body:'Source Sans Pro',style:'classic',cn:'传统+现代'},
  {heading:'Crimson Text',body:'Work Sans',style:'elegant',cn:'文学+简洁'},
  {heading:'Bebas Neue',body:'Roboto Condensed',style:'tech',cn:'工业+紧凑'},
  {heading:'Fira Code',body:'Fira Sans',style:'tech',cn:'编程+可读'},
  {heading:'Dancing Script',body:'Nunito',style:'art',cn:'手写+圆润'},
  {heading:'Pacifico',body:'Raleway',style:'art',cn:'复古手写+优雅'},
  {heading:'Bitter',body:'Raleway',style:'modern',cn:'板衬线+几何'},
  {heading:'Cormorant Garamond',body:'Proza Libre',style:'elegant',cn:'法国优雅+现代'}
];

var googleFontsUrl='https://fonts.googleapis.com/css2?family=';

function loadFonts(heading,body){
  var families=[heading,body].map(function(f){return f.replace(/ /g,'+')+':wght@400;700'}).join('&family=');
  var existing=document.getElementById('gf-'+heading.replace(/ /g,''));
  if(!existing){
    var link=document.createElement('link');link.id='gf-'+heading.replace(/ /g,'');
    link.rel='stylesheet';link.href=googleFontsUrl+families+'&display=swap';
    document.head.appendChild(link);
  }
}

function render(){
  var style=document.querySelector('#styleGrid .tag.active').dataset.val;
  var pairs=style==='all'?fontPairs:fontPairs.filter(function(p){return p.style===style});
  var list=document.getElementById('pairList');list.innerHTML='';
  pairs.forEach(function(pair,i){
    loadFonts(pair.heading,pair.body);
    var card=document.createElement('div');card.className='pair-card';
    card.innerHTML='<div class="pair-heading" style="font-family:\''+pair.heading+'\',serif">'+pair.heading+'</div>'+
      '<div class="pair-body" style="font-family:\''+pair.body+'\',sans-serif">这是一段示例正文文字，用来展示 '+pair.body+' 的实际效果。The quick brown fox jumps over the lazy dog.</div>'+
      '<div class="pair-meta"><span class="pair-badge">'+pair.style+'</span><span class="pair-badge">'+pair.cn+'</span></div>';
    card.addEventListener('click',function(){
      document.querySelectorAll('.pair-card').forEach(function(c){c.classList.remove('active')});
      card.classList.add('active');
      var txt=document.getElementById('previewText').value||'字体搭配预览 The quick brown fox';
      var parts=txt.split(/(?<=[。！？.!?\n])/);
      document.getElementById('liveHeading').style.fontFamily="'"+pair.heading+"',serif";
      document.getElementById('liveHeading').textContent=parts[0]||pair.heading;
      document.getElementById('liveBody').style.fontFamily="'"+pair.body+"',sans-serif";
      document.getElementById('liveBody').textContent=parts.slice(1).join('')||'选择下方的字体组合，这里会实时展示搭配效果。The quick brown fox jumps over the lazy dog.';
      document.getElementById('headingFontName').textContent='标题: '+pair.heading;
      document.getElementById('bodyFontName').textContent='正文: '+pair.body;
    });
    list.appendChild(card);
  });
  if(pairs.length>0)list.children[0].click();
}

initTags('styleGrid',render);
document.getElementById('previewText').addEventListener('input',function(){
  var active=document.querySelector('.pair-card.active');
  if(active)active.click();
});

document.getElementById('randomBtn').addEventListener('click',function(){
  var idx=Math.floor(Math.random()*fontPairs.length);
  var cards=document.querySelectorAll('.pair-card');
  if(cards[idx]){cards[idx].click();cards[idx].scrollIntoView({behavior:'smooth',block:'center'})}
});

document.getElementById('copyBtn').addEventListener('click',function(){
  var active=document.querySelector('.pair-card.active');
  if(!active){showToast('请先选择一个搭配');return}
  var headings=active.querySelector('.pair-heading').textContent;
  var bodies=active.querySelector('.pair-body').textContent;
  var code='/* Font Pairing: '+headings+' + '+document.querySelector('.pair-badge',active).textContent+' */\n';
  code+='@import url("'+googleFontsUrl+headings.replace(/ /g,'+')+'+wght@400;700&family='+document.getElementById('bodyFontName').textContent.replace('正文: ','').replace(/ /g,'+')+':wght@400;700&display=swap");\n\n';
  code+='h1, h2, h3 {\n  font-family: "'+headings+'", serif;\n  font-weight: 700;\n}\n\n';
  code+='body, p {\n  font-family: "'+document.getElementById('bodyFontName').textContent.replace('正文: ','')+'", sans-serif;\n  line-height: 1.6;\n}';
  navigator.clipboard.writeText(code).then(function(){showToast('✅ 已复制CSS')});
});

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:.8;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=.8">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
