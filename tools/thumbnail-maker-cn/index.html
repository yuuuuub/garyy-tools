<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📸 缩略图制作工具</title>
<meta property="og:title" content="📸 缩略图制作工具">
<meta property="og:description" content="📸 缩略图制作工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线缩略图制作工具，YouTube/B站封面模板，文字叠加，导出PNG">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:960px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.canvas-wrap{display:flex;justify-content:center;overflow:auto;padding:10px 0}
canvas#thumbCanvas{border:1px solid var(--border);border-radius:8px}
.form-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.form-row label{font-size:13px;color:var(--text-secondary);min-width:70px}
.form-row input[type="text"],.form-row select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--input-bg);color:var(--text);flex:1;min-width:120px}
.form-row input[type="color"]{width:40px;height:32px;border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:2px}
.form-row input[type="range"]{flex:1;accent-color:var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
.preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.preset{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s}
.preset:hover{border-color:var(--accent)}
.preset.active{border-color:var(--accent);background:var(--tag-bg)}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.tpl-card{border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;font-size:12px;transition:all .2s;overflow:hidden}
.tpl-card:hover{border-color:var(--accent)}
.tpl-card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tpl-card canvas{display:block;width:100%}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text-secondary)}
.upload-zone:hover{border-color:var(--accent);color:var(--accent)}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📸 缩略图制作工具</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">📐 尺寸</div>
    <div class="preset-row" id="sizePresets"></div>
  </div>

  <div class="card">
    <div class="card-title">🖼️ 预览</div>
    <div class="canvas-wrap"><canvas id="thumbCanvas" width="1280" height="720"></canvas></div>
  </div>

  <div class="card">
    <div class="card-title">📸 背景图片</div>
    <div class="upload-zone" id="uploadZone">点击或拖拽上传背景图片</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="card">
    <div class="card-title">🎨 背景效果</div>
    <div class="form-row"><label>亮度</label><input type="range" min="0" max="200" value="100" id="brightness" oninput="render()"><span id="brVal">100%</span></div>
    <div class="form-row"><label>对比度</label><input type="range" min="0" max="200" value="100" id="contrast" oninput="render()"><span id="ctVal">100%</span></div>
    <div class="form-row"><label>模糊</label><input type="range" min="0" max="20" value="0" id="blur" oninput="render()"><span id="blVal">0</span></div>
    <div class="form-row"><label>暗化叠加</label><input type="range" min="0" max="80" value="30" id="overlay" oninput="render()"><span id="ovVal">30%</span></div>
  </div>

  <div class="card">
    <div class="card-title">📝 标题</div>
    <div class="form-row"><label>文字</label><input type="text" id="titleText" value="超酷视频标题" oninput="render()"></div>
    <div class="form-row"><label>字号</label><input type="range" min="24" max="120" value="64" id="titleSize" oninput="render()"><span id="tsVal">64</span></div>
    <div class="form-row"><label>颜色</label><input type="color" id="titleColor" value="#ffffff" onchange="render()"></div>
    <div class="form-row"><label>描边</label><input type="range" min="0" max="10" value="3" id="titleStroke" oninput="render()"><span id="tswVal">3</span></div>
    <div class="form-row"><label>描边色</label><input type="color" id="titleStrokeColor" value="#000000" onchange="render()"></div>
    <div class="form-row"><label>Y位置</label><input type="range" min="10" max="90" value="45" id="titleY" oninput="render()"><span id="tyVal">45%</span></div>
    <div class="form-row"><label>阴影</label><input type="checkbox" id="titleShadow" checked onchange="render()"></div>
  </div>

  <div class="card">
    <div class="card-title">📝 副标题</div>
    <div class="form-row"><label>文字</label><input type="text" id="subTitle" value="" oninput="render()"></div>
    <div class="form-row"><label>字号</label><input type="range" min="12" max="60" value="28" id="subSize" oninput="render()"><span id="ssVal">28</span></div>
    <div class="form-row"><label>颜色</label><input type="color" id="subColor" value="#ffd700" onchange="render()"></div>
    <div class="form-row"><label>Y位置</label><input type="range" min="10" max="90" value="62" id="subY" oninput="render()"><span id="syVal">62%</span></div>
  </div>

  <div class="card">
    <div class="card-title">🏷️ 标签</div>
    <div class="form-row"><label>标签文字</label><input type="text" id="badgeText" value="推荐" oninput="render()"></div>
    <div class="form-row"><label>背景色</label><input type="color" id="badgeBg" value="#ef4444" onchange="render()"></div>
    <div class="form-row"><label>文字色</label><input type="color" id="badgeFg" value="#ffffff" onchange="render()"></div>
    <div class="form-row"><label>显示</label><input type="checkbox" id="showBadge" checked onchange="render()"></div>
  </div>

  <div class="card">
    <div class="card-title">🎭 预设风格</div>
    <div class="tpl-grid" id="tplGrid"></div>
  </div>

  <div class="card">
    <div class="card-title">⚡ 操作</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="exportPNG()">💾 导出PNG</button>
      <button class="btn btn-outline" onclick="exportJPG()">💾 导出JPG</button>
    </div>
  </div>

  <footer>📸 缩略图制作工具 - 创作吸睛封面</footer>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/i18n-js@3/dist/i18n.min.js" defer></script>
<script>
const C=document.getElementById('thumbCanvas'),ctx=C.getContext('2d');
let bgImg=null;
const sizes=[{w:1280,h:720,l:'YouTube 1280x720'},{w:1920,h:1080,l:'全高清 1920x1080'},{w:1280,h:800,l:'B站 1280x800'},{w:1080,h:1080,l:'方形 1080'},{w:1200,h:630,l:'OG图 1200x630'},{w:800,h:450,l:'4:3横版'}];
const templates=[
  {title:'震撼标题',sub:'副标题文字',titleSize:64,subSize:28,titleColor:'#ffffff',subColor:'#ffd700',badge:'推荐',badgeBg:'#ef4444'},
  {title:'教程分享',sub:'手把手教你',titleSize:56,subSize:24,titleColor:'#22c55e',subColor:'#ffffff',badge:'教程',badgeBg:'#3b82f6'},
  {title:'限时特惠',sub:'全场五折',titleSize:72,subSize:32,titleColor:'#ef4444',subColor:'#fbbf24',badge:'特价',badgeBg:'#ef4444'},
  {title:'新品发布',sub:'全新体验',titleSize:60,subSize:26,titleColor:'#ffffff',subColor:'#a5b4fc',badge:'NEW',badgeBg:'#6366f1'},
  {title:'深度测评',sub:'真相揭秘',titleSize:58,subSize:26,titleColor:'#fbbf24',subColor:'#e8e8e8',badge:'测评',badgeBg:'#f97316'},
  {title:'干货满满',sub:'建议收藏',titleSize:54,subSize:24,titleColor:'#14b8a6',subColor:'#ffffff',badge:'收藏',badgeBg:'#14b8a6'},
];

function init(){
  renderSizes();renderTemplates();
  const uz=document.getElementById('uploadZone');
  const fi=document.getElementById('fileInput');
  uz.onclick=()=>fi.click();
  uz.ondragover=e=>{e.preventDefault();uz.style.borderColor='var(--accent)';};
  uz.ondragleave=()=>uz.style.borderColor='var(--border)';
  uz.ondrop=e=>{e.preventDefault();uz.style.borderColor='var(--border)';handleFile(e.dataTransfer.files[0]);};
  fi.onchange=()=>handleFile(fi.files[0]);
  render();
}

function renderSizes(){
  const row=document.getElementById('sizePresets');row.innerHTML='';
  sizes.forEach(s=>{
    const b=document.createElement('button');b.className='preset';b.textContent=s.l;
    b.onclick=()=>{C.width=s.w;C.height=s.h;render();};
    row.appendChild(b);
  });
}

function renderTemplates(){
  const grid=document.getElementById('tplGrid');grid.innerHTML='';
  templates.forEach((t,i)=>{
    const card=document.createElement('div');card.className='tpl-card';
    const tc=document.createElement('canvas');tc.width=180;tc.height=101;
    const tctx=tc.getContext('2d');
    tctx.fillStyle='#1e293b';tctx.fillRect(0,0,180,101);
    tctx.fillStyle='rgba(0,0,0,0.3)';tctx.fillRect(0,0,180,101);
    tctx.font=`bold ${Math.round(t.titleSize/4)}px Arial Black`;tctx.textAlign='center';
    tctx.fillStyle=t.titleColor;tctx.fillText(t.title,90,45);
    tctx.font=`${Math.round(t.subSize/4)}px Arial`;tctx.fillStyle=t.subColor;tctx.fillText(t.sub,90,65);
    if(t.badge){tctx.fillStyle=t.badgeBg;const tw=tctx.measureText(t.badge).width;tctx.fillRect(180-tw-18,8,tw+12,20);tctx.fillStyle='#fff';tctx.font='bold 10px Arial';tctx.textAlign='left';tctx.fillText(t.badge,180-tw-12,23);}
    card.appendChild(tc);
    const lb=document.createElement('div');lb.textContent='风格'+(i+1);lb.style.padding='6px';card.appendChild(lb);
    card.onclick=()=>{
      document.getElementById('titleText').value=t.title;document.getElementById('subTitle').value=t.sub;
      document.getElementById('titleSize').value=t.titleSize;document.getElementById('subSize').value=t.subSize;
      document.getElementById('titleColor').value=t.titleColor;document.getElementById('subColor').value=t.subColor;
      document.getElementById('badgeText').value=t.badge;document.getElementById('badgeBg').value=t.badgeBg;
      render();
    };
    grid.appendChild(card);
  });
}

function handleFile(f){
  if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{bgImg=img;render();showToast('背景图片已加载');};
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

function render(){
  const w=C.width,h=C.height;
  ctx.clearRect(0,0,w,h);

  const br=parseInt(document.getElementById('brightness').value);
  const ct=parseInt(document.getElementById('contrast').value);
  const bl=parseInt(document.getElementById('blur').value);
  const ov=parseInt(document.getElementById('overlay').value);
  document.getElementById('brVal').textContent=br+'%';
  document.getElementById('ctVal').textContent=ct+'%';
  document.getElementById('blVal').textContent=bl;
  document.getElementById('ovVal').textContent=ov+'%';

  ctx.filter=`brightness(${br}%) contrast(${ct}%) blur(${bl}px)`;
  if(bgImg){
    const scale=Math.max(w/bgImg.width,h/bgImg.height);
    const sw=bgImg.width*scale,sh=bgImg.height*scale;
    ctx.drawImage(bgImg,(w-sw)/2,(h-sh)/2,sw,sh);
  }else{
    const grad=ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0,'#1e293b');grad.addColorStop(1,'#334155');
    ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(255,255,255,0.05)';
    for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(Math.random()*w,Math.random()*h,Math.random()*100+50,0,Math.PI*2);ctx.fill();}
  }
  ctx.filter='none';

  if(ov>0){ctx.fillStyle=`rgba(0,0,0,${ov/100})`;ctx.fillRect(0,0,w,h);}

  const badgeText=document.getElementById('badgeText').value;
  const showBadge=document.getElementById('showBadge').checked;
  if(showBadge&&badgeText){
    const bbg=document.getElementById('badgeBg').value;
    const bfg=document.getElementById('badgeBg').value;
    ctx.font=`bold ${Math.round(h*0.04)}px Arial`;
    const btw=ctx.measureText(badgeText).width;
    const bp=Math.round(h*0.03);
    ctx.fillStyle=bbg;
    roundRect(ctx,w-btw-bp*2-16,bp,btw+bp*2,h*0.06,bp);ctx.fill();
    ctx.fillStyle=document.getElementById('badgeFg').value;
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(badgeText,w-bp-8,bp+h*0.03);
  }

  const titleText=document.getElementById('titleText').value;
  const titleSize=parseInt(document.getElementById('titleSize').value);
  const titleColor=document.getElementById('titleColor').value;
  const titleStroke=parseInt(document.getElementById('titleStroke').value);
  const titleStrokeColor=document.getElementById('titleStrokeColor').value;
  const titleYP=parseInt(document.getElementById('titleY').value)/100;
  const titleShadow=document.getElementById('titleShadow').checked;

  ctx.font=`bold ${titleSize}px "Arial Black","PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(titleShadow){ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=12;ctx.shadowOffsetY=4;}
  if(titleStroke>0){ctx.strokeStyle=titleStrokeColor;ctx.lineWidth=titleStroke*2;ctx.lineJoin='round';ctx.strokeText(titleText,w/2,h*titleYP);}
  ctx.fillStyle=titleColor;ctx.fillText(titleText,w/2,h*titleYP);
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;

  document.getElementById('tsVal').textContent=titleSize;
  document.getElementById('tswVal').textContent=titleStroke;
  document.getElementById('tyVal').textContent=Math.round(titleYP*100)+'%';

  const subTitle=document.getElementById('subTitle').value;
  if(subTitle){
    const subSize=parseInt(document.getElementById('subSize').value);
    const subColor=document.getElementById('subColor').value;
    const subYP=parseInt(document.getElementById('subY').value)/100;
    ctx.font=`bold ${subSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.fillStyle=subColor;ctx.fillText(subTitle,w/2,h*subYP);
    document.getElementById('ssVal').textContent=subSize;
    document.getElementById('syVal').textContent=Math.round(subYP*100)+'%';
  }
}

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}

function exportPNG(){
  const link=document.createElement('a');link.download='缩略图_'+C.width+'x'+C.height+'_'+Date.now()+'.png';link.href=C.toDataURL('image/png');link.click();showToast('已导出PNG');
}
function exportJPG(){
  const link=document.createElement('a');link.download='缩略图_'+C.width+'x'+C.height+'_'+Date.now()+'.jpg';link.href=C.toDataURL('image/jpeg',0.95);link.click();showToast('已导出JPG');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function toggleTheme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';document.querySelector('.theme-toggle').textContent=d.dataset.theme==='dark'?'☀️':'🌙';}
init();
</script>
</body>
</html>
