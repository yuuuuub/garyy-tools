<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON格式化</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
textarea{width:100%;min-height:260px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none;tab-size:2}
textarea:focus{border-color:var(--blue)}
.btn-row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.btn{padding:8px 18px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.82rem;background:var(--blue);color:#fff;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.green{background:var(--green)}
.btn.gold{background:var(--gold);color:#000}
.btn.red{background:var(--red)}
.status{font-size:.82rem;margin:6px 0;min-height:24px;font-family:monospace}
.status.ok{color:var(--green)}
.status.err{color:var(--red)}
.output-wrap{position:relative}
.copy-badge{position:absolute;top:8px;right:8px;padding:4px 10px;background:var(--green);color:#fff;border:none;border-radius:4px;font-size:.75rem;cursor:pointer;opacity:0;transition:opacity .2s}
.output-wrap:hover .copy-badge{opacity:1}
.byte-count{color:var(--text2);font-size:.75rem;margin-top:4px;text-align:right}
</style>
</head>
<body>
<div class="container">
<header><h1>JSON格式化</h1><p>JSON验证 · 格式化 · 压缩</p></header>
<div class="card">
<textarea id="input" placeholder='在此粘贴 JSON...&#10;例如: {"name":"张三","age":25}'></textarea>
<div class="status" id="status"></div>
<div class="btn-row">
<button class="btn green" id="format-btn">格式化</button>
<button class="btn" id="compress-btn">压缩</button>
<button class="btn gold" id="validate-btn">验证</button>
<button class="btn red" id="clear-btn">清空</button>
</div>
</div>
<div class="card">
<h3 style="font-size:.85rem;color:var(--text2);margin-bottom:10px">输出</h3>
<div class="output-wrap">
<textarea id="output" placeholder="结果将显示在这里..." readonly></textarea>
<button class="copy-badge" id="copy-btn">复制</button>
</div>
<div class="byte-count" id="byte-count"></div>
</div>
</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const input = $('input');
const output = $('output');
const status = $('status');
const byteCount = $('byte-count');

function process(mode) {
  const val = input.value.trim();
  if(!val) {
    status.textContent = '请输入 JSON';
    status.className = 'status err';
    return;
  }
  try {
    const parsed = JSON.parse(val);
    if(mode === 'validate') {
      status.textContent = '有效的 JSON';
      status.className = 'status ok';
      output.value = val;
    } else if(mode === 'compress') {
      const compressed = JSON.stringify(parsed);
      output.value = compressed;
      status.textContent = '压缩成功';
      status.className = 'status ok';
    } else {
      const formatted = JSON.stringify(parsed, null, 2);
      output.value = formatted;
      status.textContent = '格式化成功';
      status.className = 'status ok';
    }
    byteCount.textContent = '长度: ' + output.value.length + ' 字符';
  } catch(e) {
    let msg = e.message;
    const m = msg.match(/position\s+(\d+)/);
    if(m) {
      const pos = parseInt(m[1]);
      const before = input.value.substring(0, pos);
      const line = before.split('\n').length;
      const lastNl = before.lastIndexOf('\n');
      const col = pos - lastNl;
      msg = '第 ' + line + ' 行第 ' + col + ' 列: ' + e.message;
    }
    status.textContent = msg;
    status.className = 'status err';
    output.value = '';
    byteCount.textContent = '';
  }
}

$('format-btn').addEventListener('click', function(){ process('format'); });
$('compress-btn').addEventListener('click', function(){ process('compress'); });
$('validate-btn').addEventListener('click', function(){ process('validate'); });

$('clear-btn').addEventListener('click', function() {
  input.value = '';
  output.value = '';
  status.textContent = '';
  status.className = 'status';
  byteCount.textContent = '';
  input.focus();
});

$('copy-btn').addEventListener('click', function() {
  const val = output.value;
  if(!val) return;
  navigator.clipboard.writeText(val).then(function() {
    var btn = this;
    var orig = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(function(){ btn.textContent = orig; }, 1500);
  }.bind(this));
});

input.addEventListener('keydown', function(e) {
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    $('format-btn').click();
  }
});

})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
