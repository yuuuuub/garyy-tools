<script>
// ============ 全局状态 ============
const STORAGE_KEY = 'json_formatter_history';
const MAX_HISTORY = 30;
let currentJsonData = null;
let currentJsonText = '';

// ============ 示例 JSON ============
const SAMPLE_JSON = JSON.stringify({
  "name": "JSON 格式化工具",
  "version": "2.1.0",
  "author": {
    "name": "开发者",
    "email": "dev@example.com",
    "active": true
  },
  "features": [
    "格式化与压缩",
    "JSON 校验并显示错误位置",
    "可折叠树形视图",
    "拖拽 .json 文件加载",
    "从 URL 加载 JSON"
  ],
  "config": {
    "indent_size": 2,
    "max_depth": null,
    "sort_keys": false,
    "theme": "dark"
  },
  "metadata": {
    "created_at": "2024-01-15T08:30:00Z",
    "downloads": 12580,
    "rating": 4.8
  },
  "nested": {
    "level1": {
      "level2": {
        "level3": {
          "message": "这是一个深层嵌套的对象"
        }
      }
    }
  },
  "mixed_array": [
    42,
    "hello",
    true,
    null,
    { "id": 1, "label": "项目 A" }
  ]
}, null, 2);

// ============ 初始化 ============
window.addEventListener('DOMContentLoaded', () => {
  const ta = document.getElementById('jsonInput');
  ta.value = SAMPLE_JSON;

  // 拖拽事件
  const ib = document.getElementById('inputBody');
  const ov = document.getElementById('dragOverlay');

  let dragCnt = 0;
  ib.addEventListener('dragenter', e => { e.preventDefault(); e.stopPropagation(); dragCnt++; ov.classList.add('show'); });
  ib.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
  ib.addEventListener('dragleave', e => { e.preventDefault(); e.stopPropagation(); dragCnt--; if(dragCnt<=0){ dragCnt=0; ov.classList.remove('show'); } });
  ib.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    dragCnt = 0;
    ov.classList.remove('show');
    const file = e.dataTransfer.files[0];
    if (file && (file.name.endsWith('.json') || file.type === 'application/json')) {
      const reader = new FileReader();
      reader.onload = ev => { ta.value = ev.target.result; processJson(); };
      reader.readAsText(file);
    } else {
      showError('请拖放 .json 格式的文件');
    }
  });

  // 点击空白关闭历史列表
  document.addEventListener('click', e => {
    if (!e.target.closest('.history-wrapper')) {
      document.getElementById('historyList').classList.remove('show');
    }
  });

  ta.addEventListener('input', debounce(processJson, 400));
  processJson();
  renderHistory();
});

// ============ 防抖 ============
function debounce(fn, delay) {
  let t;
  return function(...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), delay); };
}

// ============ 错误显示 ============
function showError(msg) {
  const eb = document.getElementById('errorBox');
  eb.textContent = msg;
  eb.classList.add('show');
}
function hideError() {
  document.getElementById('errorBox').classList.remove('show');
}

// ============ JSON 处理核心 ============
function tryParse(text) {
  if (!text.trim()) return { data: null, error: null, text: '' };
  try {
    const data = JSON.parse(text);
    return { data, error: null, text: JSON.stringify(data, null, 2) };
  } catch(e) {
    // 解析错误详情
    let msg = e.message;
    let line = '', col = '';
    const lm = msg.match(/position\s+(\d+)/i);
    if (lm) {
      const pos = parseInt(lm[1]);
      const before = text.substring(0, pos);
      line = before.split('\n').length;
      const lastLine = before.lastIndexOf('\n');
      col = pos - lastLine;
      const context = text.substring(Math.max(0, pos - 30), Math.min(text.length, pos + 30));
      msg = `JSON 解析错误 (第 ${line} 行, 第 ${col} 列):\n${e.message}\n\n上下文: ...${context}...`;
    }
    return { data: null, error: msg, text: '' };
  }
}

function countKeys(obj) {
  if (obj === null || typeof obj !== 'object') return 0;
  let count = 0;
  for (const key in obj) {
    if (obj.hasOwnProperty(key)) {
      count++;
      count += countKeys(obj[key]);
    }
  }
  return count;
}

function getMaxDepth(obj, depth = 0) {
  if (obj === null || typeof obj !== 'object') return depth;
  let max = depth;
  for (const key in obj) {
    if (obj.hasOwnProperty(key)) {
      max = Math.max(max, getMaxDepth(obj[key], depth + 1));
    }
  }
  return max;
}

function getSizeInfo(text) {
  const bytes = new Blob([text]).size;
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function getLineCount(text) {
  return text ? text.split('\n').length : 0;
}

function updateStats(data, text) {
  document.getElementById('statKeys').textContent = data ? countKeys(data) : '-';
  document.getElementById('statDepth').textContent = data ? getMaxDepth(data, 0) : '-';
  document.getElementById('statSize').textContent = text ? getSizeInfo(text) : '-';
  document.getElementById('statLines').textContent = text ? getLineCount(text) : '-';
  const typeEl = document.getElementById('statType');
  if (data === null || data === undefined) typeEl.textContent = '-';
  else if (Array.isArray(data)) typeEl.textContent = 'Array';
  else if (typeof data === 'object') typeEl.textContent = 'Object';
  else typeEl.textContent = typeof data;
}

function processJson() {
  const text = document.getElementById('jsonInput').value;
  const { data, error, text: formatted } = tryParse(text);
  hideError();
  if (error) {
    showError(error);
    currentJsonData = null;
    currentJsonText = '';
    updateStats(null, null);
    document.getElementById('treeView').innerHTML = `<div style="padding: 16px; color: var(--red); margin-top: 20px; text-align:center; white-space:pre-wrap; font-family:monospace; font-size:0.82rem;">${escapeHtml(error)}</div>`;
  } else {
    currentJsonData = data;
    currentJsonText = formatted;
    updateStats(data, formatted);
    renderTree(data);
    saveHistory(text);
  }
}

// ============ 树形视图 ============
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getType(val) {
  if (val === null) return 'null';
  if (Array.isArray(val)) return 'array';
  return typeof val;
}

function valClass(val) {
  const t = getType(val);
  if (t === 'string') return 'tree-val-string';
  if (t === 'number') return 'tree-val-number';
  if (t === 'boolean') return 'tree-val-boolean';
  if (t === 'null') return 'tree-val-null';
  return '';
}

function formatValue(val) {
  const t = getType(val);
  if (t === 'string') return `"${escapeHtml(val)}"`;
  if (t === 'null') return 'null';
  if (t === 'boolean') return val ? 'true' : 'false';
  if (t === 'number') return String(val);
  return '';
}

function buildTreeNode(key, val, depth, path) {
  const t = getType(val);
  const id = 'tn-' + path.join('-');
  const hasChildren = t === 'object' || t === 'array';
  const isObj = t === 'object';
  const keys = hasChildren ? Object.keys(val) : [];
  const isLarge = keys.length > 50;

  let html = `<div class="tree-node" id="${id}">`;
  html += `<div class="tree-line">`;
  // 折叠按钮
  if (hasChildren && keys.length > 0) {
    html += `<span class="tree-toggle" onclick="toggleNode('${id}')">▼</span>`;
  } else {
    html += `<span class="tree-toggle leaf">▼</span>`;
  }
  // key
  if (key !== null && key !== '') {
    html += `<span class="tree-key" onclick="copyPath('${path.join('.')}')">"${escapeHtml(key)}"</span>`;
    html += `<span class="tree-colon">: </span>`;
  }
  // 括号和类型
  if (hasChildren) {
    const brace = isObj ? '{' : '[';
    const endBrace = isObj ? '}' : ']';
    html += `<span class="tree-bracket">${brace}</span>`;
    html += `<span class="tree-count">${keys.length} 个${isObj ? '属性' : '元素'}</span>`;
    html += `</div>`; // tree-line
    html += `<div class="tree-children" id="${id}-children">`;
    let maxShow = isLarge ? Math.min(30, keys.length) : keys.length;
    for (let i = 0; i < maxShow; i++) {
      const k = keys[i];
      const childPath = [...path, isObj ? k : i];
      html += buildTreeNode(isObj ? k : `[${i}]`, val[k], depth + 1, childPath);
    }
    if (isLarge) {
      html += `<div class="tree-line"><span class="tree-toggle leaf">▼</span><span class="tree-ellipsis" onclick="expandAllChildren('${id}')">... 还有 ${keys.length - maxShow} 项，点击展开全部</span></div>`;
    }
    html += `</div>`; // children
    html += `<div class="tree-line"><span class="tree-toggle leaf">▼</span><span class="tree-bracket">${endBrace}</span></div>`;
  } else {
    // 叶子节点
    html += `<span class="${valClass(val)}">${formatValue(val)}</span>`;
    html += `</div>`; // tree-line
  }
  html += `</div>`; // tree-node
  return html;
}

function renderTree(data) {
  const tv = document.getElementById('treeView');
  if (data === null || data === undefined) {
    tv.innerHTML = `<div style="padding: 16px; color: var(--text-secondary); text-align: center; margin-top: 40px;">请输入有效的 JSON</div>`;
    return;
  }
  let html = '';
  if (Array.isArray(data)) {
    html += buildTreeNode('', data, 0, ['root']);
  } else if (typeof data === 'object') {
    html += buildTreeNode('', data, 0, ['root']);
  }
  tv.innerHTML = html;
}

// 树操作
function toggleNode(id) {
  const children = document.getElementById(id + '-children');
  if (!children) return;
  const toggle = document.querySelector(`#${id} > .tree-line .tree-toggle`);
  children.classList.toggle('collapsed');
  if (toggle) toggle.classList.toggle('collapsed');
}

function expandAll() {
  document.querySelectorAll('.tree-children').forEach(el => el.classList.remove('collapsed'));
  document.querySelectorAll('.tree-toggle:not(.leaf)').forEach(el => el.classList.remove('collapsed'));
}

function collapseAll() {
  document.querySelectorAll('.tree-children').forEach(el => el.classList.add('collapsed'));
  document.querySelectorAll('.tree-toggle:not(.leaf)').forEach(el => el.classList.add('collapsed'));
}

function expandAllChildren(id) {
  const container = document.getElementById(id);
  if (!container) return;
  // 移除省略号行
  const ellipsis = container.querySelector('.tree-ellipsis');
  if (ellipsis) {
    const line = ellipsis.closest('.tree-line');
    if (line) line.remove();
  }
  // 加载全部子节点
  const lastChildDiv = container.querySelector(`#${id}-children`);
  if (!lastChildDiv) return;
  // 重新获取数据并渲染完整子节点
  const pathStr = id.replace('tn-root-', '').replace(/^tn-/, '');
  const parts = pathStr.split('-');
  let node = currentJsonData;
  for (const p of parts) {
    if (p === 'root') continue;
    if (p === '') continue;
    if (node === null || node === undefined) break;
    const idx = /^\d+$/.test(p) ? parseInt(p) : p;
    node = node[idx];
  }
  if (node && (typeof node === 'object')) {
    const isObj = !Array.isArray(node);
    const keys = Object.keys(node);
    let childHtml = '';
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      const childPath = [...parts, isObj ? k : i];
      childHtml += buildTreeNode(isObj ? k : `[${i}]`, node[k], parts.length, childPath);
    }
    lastChildDiv.innerHTML = childHtml;
  }
}

function copyPath(path) {
  navigator.clipboard.writeText(path).catch(() => {});
}

// ============ 按钮操作 ============
function formatJson() {
  const text = document.getElementById('jsonInput').value;
  try {
    const obj = JSON.parse(text);
    const formatted = JSON.stringify(obj, null, 2);
    document.getElementById('jsonInput').value = formatted;
    hideError();
    currentJsonData = obj;
    currentJsonText = formatted;
    updateStats(obj, formatted);
    renderTree(obj);
    saveHistory(formatted);
  } catch(e) {
    showError('无法格式化：JSON 格式无效。请先修复语法错误。');
  }
}

function minifyJson() {
  const text = document.getElementById('jsonInput').value;
  try {
    const obj = JSON.parse(text);
    const minified = JSON.stringify(obj);
    document.getElementById('jsonInput').value = minified;
    hideError();
    currentJsonData = obj;
    currentJsonText = minified;
    updateStats(obj, minified);
    renderTree(obj);
    saveHistory(minified);
  } catch(e) {
    showError('无法压缩：JSON 格式无效。请先修复语法错误。');
  }
}

function validateJson() {
  const text = document.getElementById('jsonInput').value;
  if (!text.trim()) {
    showError('请输入 JSON 内容');
    return;
  }
  const { data, error, text: formatted } = tryParse(text);
  if (error) {
    showError(error);
    currentJsonData = null;
    currentJsonText = '';
    updateStats(null, null);
    document.getElementById('treeView').innerHTML = `<div style="padding: 16px; color: var(--red); margin-top: 20px; text-align:center; white-space:pre-wrap; font-family:monospace; font-size:0.82rem;">${escapeHtml(error)}</div>`;
  } else {
    hideError();
    currentJsonData = data;
    currentJsonText = formatted;
    updateStats(data, formatted);
    renderTree(data);
    saveHistory(text);
    // 临时绿色提示
    const eb = document.getElementById('errorBox');
    eb.textContent = '✅ JSON 校验通过！格式有效。';
    eb.style.background = 'rgba(63,185,80,0.15)';
    eb.style.border = '1px solid var(--green)';
    eb.style.color = 'var(--green)';
    eb.classList.add('show');
    setTimeout(() => { eb.classList.remove('show'); eb.style.background = ''; eb.style.border = ''; eb.style.color = ''; }, 2500);
  }
}

function copyOutput() {
  const text = currentJsonText || document.getElementById('jsonInput').value;
  if (!text.trim()) return;
  navigator.clipboard.writeText(text).then(() => {
    const eb = document.getElementById('errorBox');
    eb.textContent = '✅ 已复制到剪贴板！';
    eb.style.background = 'rgba(63,185,80,0.15)';
    eb.style.border = '1px solid var(--green)';
    eb.style.color = 'var(--green)';
    eb.classList.add('show');
    setTimeout(() => { eb.classList.remove('show'); eb.style.background = ''; eb.style.border = ''; eb.style.color = ''; }, 2000);
  }).catch(() => showError('复制失败'));
}

function loadSample() {
  document.getElementById('jsonInput').value = SAMPLE_JSON;
  hideError();
  processJson();
}

function clearAll() {
  document.getElementById('jsonInput').value = '';
  hideError();
  currentJsonData = null;
  currentJsonText = '';
  updateStats(null, null);
  document.getElementById('treeView').innerHTML = `<div style="padding: 16px; color: var(--text-secondary); text-align: center; margin-top: 40px;"><svg viewBox="0 0 16 16" width="48" height="48" style="fill: var(--text-secondary); opacity: 0.3; margin-bottom: 12px;"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0Zm.75 2v4.94l2.65 2.65-.53.53-2.87-2.87V2h.75Z"/></svg><div>输入 JSON 并点击「格式化」或「校验」查看树形视图</div></div>`;
}

function handleFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('jsonInput').value = e.target.result;
    processJson();
  };
  reader.readAsText(file);
  event.target.value = '';
}

async function loadFromUrl() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { showError('请输入 URL 地址'); return; }
  try {
    showError('⏳ 正在加载...');
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
    const text = await resp.text();
    document.getElementById('jsonInput').value = text;
    hideError();
    processJson();
  } catch(e) {
    showError(`加载失败: ${e.message}`);
  }
}

// ============ 历史记录 ============
function saveHistory(text) {
  if (!text || !text.trim()) return;
  const trimmed = text.trim();
  // 避免重复
  let history = getHistory();
  history = history.filter(h => h.text !== trimmed);
  history.unshift({ text: trimmed, time: Date.now() });
  if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  renderHistory();
}

function getHistory() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch { return []; }
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const history = getHistory();
  if (history.length === 0) {
    list.innerHTML = '<div class="history-item" style="cursor:default;color:var(--text-secondary);">暂无历史记录</div>';
    return;
  }
  list.innerHTML = history.map((h, i) => {
    const d = new Date(h.time);
    const timeStr = d.toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
    const preview = h.text.length > 60 ? h.text.substring(0, 60) + '...' : h.text;
    return `<div class="history-item" onclick="loadHistory(${i})"><span>${escapeHtml(preview)}</span><span class="time">${timeStr}</span></div>`;
  }).join('');
}

function loadHistory(index) {
  const history = getHistory();
  if (index < 0 || index >= history.length) return;
  document.getElementById('jsonInput').value = history[index].text;
  document.getElementById('historyList').classList.remove('show');
  hideError();
  processJson();
}

function toggleHistory() {
  const list = document.getElementById('historyList');
  list.classList.toggle('show');
  if (list.classList.contains('show')) renderHistory();
}
