<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字变化</title><meta name="description" content="汉字变化 - 在线查看汉字变化效果"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.change-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.change-char{font-size:6rem;font-weight:700;color:var(--blue);display:inline-block;transition:all 0.5s}.change-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.change-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.change-option:hover{border-color:var(--blue)}.change-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

</style><meta property="og:title" content="汉字变化"><meta property="og:description" content="汉字变化 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔄 汉字变化</h1><p class="sub">在线查看汉字变化效果</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="化" oninput="showChange()">
</div>
<button class="btn" onclick="showChange()">显示变化</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var changeTypes=['color','size','opacity','rotate','scale','skew','blur','shadow','glow','gradient'];
var currentChange='color';
function showChange(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="change-options">';
  changeTypes.forEach(function(type){
    html+='<div class="change-option '+(type===currentChange?'active':'')+'" onclick="setChange(\''+type+'\')">'+getChangeName(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="change-container">';
  html+='<div class="change-char" style="'+getChangeCSS(currentChange)+'">'+char+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>📋 变化说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>变化类型：</strong>'+getChangeName(currentChange)+'</div>';
  html+='<div><strong>效果描述：</strong>'+getChangeDescription(currentChange)+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function setChange(type){
  currentChange=type;
  showChange();
}
function getChangeName(type){
  switch(type){
    case 'color':return'颜色变化';
    case 'size':return'大小变化';
    case 'opacity':return'透明度变化';
    case 'rotate':return'旋转变化';
    case 'scale':return'缩放变化';
    case 'skew':return'倾斜变化';
    case 'blur':return'模糊变化';
    case 'shadow':return'阴影变化';
    case 'glow':return'发光变化';
    case 'gradient':return'渐变变化';
    default:return'未知';
  }
}
function getChangeDescription(type){
  switch(type){
    case 'color':return'颜色在不同色调之间变化';
    case 'size':return'大小在不同尺寸之间变化';
    case 'opacity':return'透明度在不同值之间变化';
    case 'rotate':return'角度在不同度数之间变化';
    case 'scale':return'缩放比例在不同值之间变化';
    case 'skew':return'倾斜角度在不同值之间变化';
    case 'blur':return'模糊程度在不同值之间变化';
    case 'shadow':return'阴影效果在不同样式之间变化';
    case 'glow':return'发光效果在不同强度之间变化';
    case 'gradient':return'渐变色在不同颜色之间变化';
    default:return'未知效果';
  }
}
function getChangeCSS(type){
  switch(type){
    case 'color':return'animation:colorChange 3s infinite';
    case 'size':return'animation:sizeChange 2s infinite';
    case 'opacity':return'animation:opacityChange 2s infinite';
    case 'rotate':return'animation:rotateChange 3s infinite';
    case 'scale':return'animation:scaleChange 2s infinite';
    case 'skew':return'animation:skewChange 2s infinite';
    case 'blur':return'animation:blurChange 3s infinite';
    case 'shadow':return'animation:shadowChange 3s infinite';
    case 'glow':return'animation:glowChange 2s infinite';
    case 'gradient':return'animation:gradientChange 3s infinite';
    default:return'none';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showChange();
}
showChange();
</script>
<style>
@keyframes colorChange{0%,100%{color:var(--blue)}25%{color:var(--green)}50%{color:var(--red)}75%{color:var(--blue)}}
@keyframes sizeChange{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes opacityChange{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes rotateChange{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes scaleChange{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.5)}}
@keyframes skewChange{0%,100%{transform:skew(0deg)}50%{transform:skew(20deg)}}
@keyframes blurChange{0%,100%{filter:blur(0px)}50%{filter:blur(5px)}}
@keyframes shadowChange{0%,100%{text-shadow:2px 2px 4px rgba(0,0,0,0.5)}50%{text-shadow:5px 5px 10px rgba(0,0,0,0.8)}}
@keyframes glowChange{0%,100%{text-shadow:0 0 10px var(--blue)}50%{text-shadow:0 0 30px var(--blue),0 0 50px var(--blue)}}
@keyframes gradientChange{0%{background:linear-gradient(45deg,var(--blue),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}50%{background:linear-gradient(45deg,var(--green),var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent}100%{background:linear-gradient(45deg,var(--blue),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}}
</style></body></html>
