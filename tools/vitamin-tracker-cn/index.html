<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💊 维生素追踪器</title>
<meta name="description" content="每日维生素摄入追踪器，记录各类维生素服用情况和每日完成度">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;color:#fff;margin-right:4px;margin-bottom:2px}
.es{text-align:center;padding:40px;color:var(--text2)}
.pw{height:20px;background:var(--bg);border-radius:10px;overflow:hidden;margin:8px 0}.pf{height:100%;border-radius:10px;transition:width .5s}
.vit-card{display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--border)}.vit-card:last-child{border-bottom:none}
.vit-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-right:12px;flex-shrink:0}
.vit-info{flex:1}.vit-name{font-weight:600;font-size:.9rem}.vit-dose{font-size:.8rem;color:var(--text2)}
.vit-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:1rem;flex-shrink:0}
.vit-check.done{background:var(--success);border-color:var(--success)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1,transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="💊 维生素追踪器">
<meta property="og:description" content="每日维生素摄入追踪器，记录各类维生素服用情况和每日完成度">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/vitamin-tracker-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>💊 维生素追踪器</h1><p>记录每日维生素摄入，保持营养均衡</p></div>

<div class="cd">
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="font-size:.9rem;color:var(--text2)">今日完成度</span>
<span style="font-weight:700;color:var(--accent)" id="progressLabel">0/0</span>
</div>
<div class="pw"><div class="pf" id="progressBar" style="width:0;background:linear-gradient(90deg,var(--success),var(--accent))"></div></div>
</div>

<div class="cd"><h2>今日维生素清单</h2><div id="todayList"></div></div>

<div class="cd"><h2>添加维生素</h2>
<div class="fr">
<div><label>维生素名称</label><input type="text" id="vitName" placeholder="如：维生素C"></div>
<div><label>剂量</label><input type="text" id="vitDose" placeholder="如：500mg"></div>
</div>
<label>建议服用时间</label>
<select id="vitTime"><option value="早晨">🌅 早晨</option><option value="午饭后">☀️ 午饭后</option><option value="晚饭后">🌙 晚饭后</option><option value="睡前">😴 睡前</option></select>
<label>颜色标识</label>
<div class="bg" id="colorBtns"></div>
<div class="bg"><button onclick="addVitamin()">添加维生素</button></div></div>

<div class="cd"><h2>已添加的维生素</h2><div id="vitList"></div></div>

<div class="cd"><h2>📊 近7天记录</h2><div id="weekStats"></div></div>
</div>
<script>
(function(){
var DB='vitamin_tracker_cn';
var vitamns=JSON.parse(localStorage.getItem(DB+'_list')||'[]');
var taken=JSON.parse(localStorage.getItem(DB+'_taken')||'{}');
var colors=['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#ec4899'];
var selectedColor=colors[0];

if(!vitamns.length){
vitamns=[
{name:'维生素A',dose:'900mcg',time:'早晨',color:'#f59e0b',id:1},
{name:'维生素B族',dose:'1片',time:'早晨',color:'#22c55e',id:2},
{name:'维生素C',dose:'1000mg',time:'午饭后',color:'#ef4444',id:3},
{name:'维生素D',dose:'2000IU',time:'午饭后',color:'#3b82f6',id:4},
{name:'维生素E',dose:'400IU',time:'晚饭后',color:'#8b5cf6',id:5}
];
localStorage.setItem(DB+'_list',JSON.stringify(vitamns));
}

function today(){return new Date().toLocaleDateString()}
function todayKey(){return today()}

function renderColors(){
document.getElementById('colorBtns').innerHTML=colors.map(function(c){
return '<button onclick="pickColor(\''+c+'\')" style="width:32px;height:32px;border-radius:50%;background:'+c+';border:3px solid '+(selectedColor===c?'var(--text)':'transparent')+';cursor:pointer;padding:0"></button>';
}).join('');
}
window.pickColor=function(c){selectedColor=c;renderColors();};

window.addVitamin=function(){
var name=document.getElementById('vitName').value.trim();
var dose=document.getElementById('vitDose').value.trim();
var time=document.getElementById('vitTime').value;
if(!name){alert('请输入维生素名称');return;}
vitamns.push({name:name,dose:dose||'适量',time:time,color:selectedColor,id:Date.now()});
localStorage.setItem(DB+'_list',JSON.stringify(vitamns));
document.getElementById('vitName').value='';document.getElementById('vitDose').value='';
render();
};

window.delVitamin=function(id){vitamns=vitamns.filter(function(v){return v.id!==id});localStorage.setItem(DB+'_list',JSON.stringify(vitamns));render();};

window.toggleTaken=function(id){
var tk=todayKey();
if(!taken[tk])taken[tk]={};
taken[tk][id]=!taken[tk][id];
localStorage.setItem(DB+'_taken',JSON.stringify(taken));
render();
};

function render(){
var tk=todayKey();
if(!taken[tk])taken[tk]={};
var total=vitamns.length;
var done=vitamns.filter(function(v){return taken[tk][v.id]}).length;
var pct=total?Math.round(done/total*100):0;
document.getElementById('progressLabel').textContent=done+'/'+total;
document.getElementById('progressBar').style.width=pct+'%';

var el=document.getElementById('todayList');
if(!total){el.innerHTML='<div class="es">请先添加维生素</div>';return;}
var byTime={};
vitamns.forEach(function(v){if(!byTime[v.time])byTime[v.time]=[];byTime[v.time].push(v);});
var html='';
Object.keys(byTime).forEach(function(t){
html+='<div style="margin-bottom:8px"><span style="font-size:.85rem;font-weight:600;color:var(--text2)">'+t+'</span></div>';
byTime[t].forEach(function(v){
var isDone=taken[tk][v.id];
html+='<div class="vit-card"><div class="vit-icon" style="background:'+v.color+'20;color:'+v.color+'">'+v.name.charAt(0)+'</div><div class="vit-info"><div class="vit-name">'+v.name+'</div><div class="vit-dose">'+v.dose+'</div></div><div class="vit-check'+(isDone?' done':'')+'" onclick="toggleTaken('+v.id+')">'+(isDone?'✓':'')+'</div></div>';
});
});
el.innerHTML=html;

var vEl=document.getElementById('vitList');
vEl.innerHTML=vitamins?vitamns.map(function(v){
return '<div class="li"><div><span style="color:'+v.color+';font-weight:600">●</span> '+v.name+' <span style="color:var(--text2);font-size:.8rem">'+v.dose+' · '+v.time+'</span></div><button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="delVitamin('+v.id+')">✕</button></div>';
}).join(''):'<div class="es">暂无维生素</div>';

renderWeekStats();
}

function renderWeekStats(){
var el=document.getElementById('weekStats');
var stats=[];
for(var i=6;i>=0;i--){
var d=new Date();d.setDate(d.getDate()-i);
var dk=d.toLocaleDateString();
var dayTaken=taken[dk]||{};
var done=vitamns.filter(function(v){return dayTaken[v.id]}).length;
stats.push({date:dk.substring(5),done:done,total:vitamns.length});
}
var maxTotal=Math.max(vitamns.length,1);
el.innerHTML=stats.map(function(s){
var pct=Math.round(s.done/maxTotal*100);
return '<div class="li"><span>'+s.date+'</span><div style="flex:1;margin:0 12px"><div class="pw" style="margin:0;height:12px"><div class="pf" style="width:'+pct+'%;background:var(--accent)"></div></div></div><span style="font-size:.85rem;color:var(--text2)">'+s.done+'/'+s.total+'</span></div>';
}).join('');
}
renderColors();render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
