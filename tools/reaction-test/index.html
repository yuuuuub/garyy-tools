<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反应速度测试</title>
<meta name="description" content="反应速度测试工具，测试你的反应时间">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{max-width:600px;width:100%;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.test-area{width:100%;height:360px;background:var(--card);border:2px solid var(--border);border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;margin-bottom:20px;user-select:none;position:relative}
.test-area.waiting{background:var(--bg);border-color:var(--border)}
.test-area.ready{background:var(--red);border-color:var(--red)}
.test-area.go{background:var(--green);border-color:var(--green)}
.test-area.stopped{background:var(--card);border-color:var(--border);cursor:default}
.test-text{font-size:1.4rem;font-weight:600;color:var(--text);text-align:center;padding:20px;line-height:1.6}
.test-area.ready .test-text{color:var(--text)}
.test-area.go .test-text{color:var(--text)}
.stats{display:flex;gap:12px;margin-bottom:16px}
.stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat .num{font-size:1.4rem;font-weight:700;color:var(--gold)}
.stat .label{font-size:.75rem;color:var(--text2);margin-top:4px}
.stat .num.best{color:var(--green)}
.stat .num.worst{color:var(--red)}
.results-list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;max-height:200px;overflow-y:auto}
.results-list h3{font-size:.85rem;color:var(--text2);margin-bottom:8px}
.result-item{display:flex;justify-content:space-between;padding:4px 0;font-size:.82rem;border-bottom:1px solid var(--border)}
.result-item:last-child{border-bottom:none}
.result-item .idx{color:var(--text2)}
.result-item .val{font-weight:600;color:var(--gold)}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{padding:8px 24px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.85rem;background:var(--blue);color:var(--text);transition:opacity .2s;flex:1}
.btn:hover{opacity:.85}
.btn.green{background:var(--green)}
.btn.gold{background:var(--gold);color:#000}
.instructions{text-align:center;color:var(--text2);font-size:.8rem;margin-top:8px}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="反应速度测试">
  <meta property="og:description" content="反应速度测试工具，测试你的反应时间">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/reaction-test/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>反应速度测试</h1><p>测试你的反应时间</p></header>
<div class="stats">
<div class="stat"><div class="num best" id="best-time">--</div><div class="label">最快 (ms)</div></div>
<div class="stat"><div class="num" id="avg-time">--</div><div class="label">平均 (ms)</div></div>
<div class="stat"><div class="num worst" id="worst-time">--</div><div class="label">最慢 (ms)</div></div>
</div>
<div class="test-area waiting" id="test-area">
<div class="test-text" id="test-text">点击任意位置开始<br><span style="font-size:.8rem;color:var(--text2)">等待随机变绿后快速点击</span></div>
</div>
<div class="stats" style="margin-bottom:8px">
<div class="stat"><div class="num" id="test-count">0</div><div class="label">已完成</div></div>
<div class="stat"><div class="num" id="remain-count">7</div><div class="label">剩余</div></div>
</div>
<div class="results-list" id="results-list">
<h2>历史记录</h2>
<div style="color:var(--text2);font-size:.8rem;text-align:center;padding:16px 0">暂无记录，开始测试</div>
</div>
<div class="btn-row">
<button class="btn green" id="new-test-btn">重新开始</button>
<button class="btn gold" id="clear-btn">清除记录</button>
</div>
<div class="instructions">目标测试次数: 7次 | 变绿后越快点击越好</div>
</div>

<script>
(function(){
'use strict';
const TARGET_COUNT = 7;
let state = 'idle';
let results = [];
let timeoutId = null;
let startTime = 0;
let currentCount = 0;
const $ = id => document.getElementById(id);
const area = $('test-area');
const text = $('test-text');
const bestEl = $('best-time');
const avgEl = $('avg-time');
const worstEl = $('worst-time');
const countEl = $('test-count');
const remainEl = $('remain-count');
const resultsList = $('results-list');
function updateStats() {
  if(results.length === 0) {
    bestEl.textContent = '--';
    avgEl.textContent = '--';
    worstEl.textContent = '--';
    return;
  }
  const best = Math.min(...results);
  const worst = Math.max(...results);
  const avg = Math.round(results.reduce((a,b)=>a+b,0) / results.length);
  bestEl.textContent = best;
  avgEl.textContent = avg;
  worstEl.textContent = worst;
}
function updateCount() {
  countEl.textContent = results.length;
  remainEl.textContent = Math.max(0, TARGET_COUNT - results.length);
}
function renderHistory() {
  if(results.length === 0) {
    resultsList.innerHTML = '<h3>历史记录</h3><div style="color:var(--text2);font-size:.8rem;text-align:center;padding:16px 0">暂无记录</div>';
    return;
  }
  let html = '<h3>历史记录</h3>';
  results.forEach((r, i) => {
    html += `<div class="result-item"><span class="idx">#${i+1}</span><span class="val">${r} ms</span></div>`;
  });
  resultsList.innerHTML = html;
  resultsList.scrollTop = resultsList.scrollHeight;
}
function setState(s) {
  state = s;
  area.className = 'test-area ' + s;
}
function resetToIdle() {
  clearTimeout(timeoutId);
  setState('idle');
  text.innerHTML = '点击任意位置开始<br><span style="font-size:.8rem;color:var(--text2)">等待随机变绿后快速点击</span>';
}
function finishTest() {
  setState('stopped');
  const best = Math.min(...results);
  const worst = Math.max(...results);
  const avg = Math.round(results.reduce((a,b)=>a+b,0) / results.length);
  text.innerHTML = `测试完成！<br>平均反应: <strong style="color:var(--gold)">${avg} ms</strong><br>最快: <strong style="color:var(--green)">${best} ms</strong> | 最慢: <strong style="color:var(--red)">${worst} ms</strong>`;
}
function startWaiting() {
  const delay = 1000 + Math.random() * 3000;
  setState('waiting');
  text.innerHTML = '等待变绿...<br><span style="font-size:.8rem;color:var(--text2)">请勿提前点击</span>';
  clearTimeout(timeoutId);
  timeoutId = setTimeout(() => {
    setState('go');
    text.innerHTML = '点击！现在！';
    startTime = performance.now();
  }, delay);
}
function handleClick() {
  if(state === 'stopped') return;
  if(state === 'idle' || state === 'waiting') {
    if(state === 'waiting') {
      clearTimeout(timeoutId);
      setState('ready');
      text.innerHTML = '点击太快了！<br><span style="font-size:.8rem">等待变绿再点击</span>';
      setTimeout(() => {
        if(state === 'ready') startWaiting();
      }, 1000);
      return;
    }
    startWaiting();
    return;
  }
  if(state === 'ready') {
    return;
  }
  if(state === 'go') {
    const elapsed = Math.round(performance.now() - startTime);
    results.push(elapsed);
    updateStats();
    updateCount();
    renderHistory();
    if(results.length >= TARGET_COUNT) {
      finishTest();
      return;
    }
    setState('ready');
    text.innerHTML = `${elapsed} ms<br><span style="font-size:.8rem;color:var(--text2)">继续...</span>`;
    setTimeout(() => {
      if(state === 'ready') startWaiting();
    }, 800);
    return;
  }
}
function newTest() {
  clearTimeout(timeoutId);
  results = [];
  updateStats();
  updateCount();
  renderHistory();
  setState('idle');
  text.innerHTML = '点击任意位置开始<br><span style="font-size:.8rem;color:var(--text2)">等待随机变绿后快速点击</span>';
}
function clearResults() {
  clearTimeout(timeoutId);
  results = [];
  updateStats();
  updateCount();
  renderHistory();
  resetToIdle();
}
area.addEventListener('click', handleClick);
$('new-test-btn').addEventListener('click', newTest);
$('clear-btn').addEventListener('click', clearResults);
updateCount();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
