<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎼 音乐理论学习</title>
<meta property="og:title" content="🎼 音乐理论学习">
<meta property="og:description" content="🎼 音乐理论学习 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线音乐理论学习工具，涵盖音阶、和弦、调式、节拍等基础乐理知识">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎼</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tab-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;font-weight:600}
.tab-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.info-block{padding:14px;background:var(--preview-bg);border-radius:12px;margin-bottom:12px}
.info-block h3{font-size:15px;font-weight:700;margin-bottom:8px}
.info-block p,.info-block li{font-size:13px;color:var(--text-secondary);line-height:1.8}
.info-block ul{padding-left:18px}
.note-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.note-tag{padding:6px 12px;border-radius:8px;background:var(--tag-bg);color:var(--tag-text);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.note-tag:hover{transform:scale(1.05)}
.note-tag.highlight{background:var(--accent);color:#fff}
.quiz-area{margin-top:16px}
.quiz-q{font-size:15px;font-weight:600;margin-bottom:12px}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quiz-opt{padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:13px;cursor:pointer;transition:all .2s;text-align:center}
.quiz-opt:hover{border-color:var(--accent)}
.quiz-opt.correct{background:var(--green);color:#fff;border-color:var(--green)}
.quiz-opt.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.quiz-score{font-size:13px;color:var(--text-secondary);margin-top:10px;text-align:center}
.footer{text-align:center;padding:20px 0;font-size:12px;color:var(--text-secondary)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🎼 音乐理论学习</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">📚 选择主题</div>
<div class="tab-bar" id="topicTabs"></div>
</div>
<div class="card" id="contentCard">
<div class="card-title" id="contentTitle">📖 基础知识</div>
<div id="contentArea"></div>
</div>
<div class="card">
<div class="card-title">🎯 知识测验</div>
<div class="quiz-area" id="quizArea"></div>
</div>
<div class="footer">音乐理论学习 - Web Audio API</div>
</div>
<script>
let audioCtx,currentTopic='notes';
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_NAMES=['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const TOPICS=[
{id:'notes',name:'🎵 音名',desc:'十二平均律与音名体系'},
{id:'intervals',name:'📏 音程',desc:'音程的种类与性质'},
{id:'scales',name:'🎹 音阶',desc:'大调、小调与调式'},
{id:'chords',name:'🎸 和弦',desc:'三和弦与七和弦'},
{id:'keys',name:'🔑 调性',desc:'大小调与关系调'},
{id:'rhythm',name:'🥁 节拍',desc:'拍号与节奏型'}
];
const CONTENT={
notes:{title:'🎵 音名与十二平均律',html:`<div class="info-block"><h3>十二平均律</h3><p>将八度等分为12个半音，相邻两个音之间的频率比为2^(1/12)≈1.05946。C4(中央C)的频率为261.63Hz。</p></div><div class="info-block"><h3>音名对照</h3><div class="note-row" id="noteRow"></div></div><div class="info-block"><h3>音组</h3><ul><li>大字二组 (A0-B0)：钢琴最低音区</li><li>小字一组 (c1-b1)：中央C所在音组</li><li>小字五组 (c5-b5)：钢琴最高音区</li></ul></div>`},
intervals:{title:'📏 音程',html:`<div class="info-block"><h3>音程的度数</h3><p>音程由"度数"和"音数"两个要素决定。度数指两音之间包含的音级数，音数指包含的半音数。</p></div><div class="info-block"><h3>常见音程</h3><ul><li>纯一度 (0半音) - 同一音</li><li>小二度 (1半音) - E-F</li><li>大二度 (2半音) - C-D</li><li>小三度 (3半音) - D-F</li><li>大三度 (4半音) - C-E</li><li>纯四度 (5半音) - C-F</li><li>三全音 (6半音) - C-F#</li><li>纯五度 (7半音) - C-G</li><li>小六度 (8半音) - E-C</li><li>大六度 (9半音) - C-A</li><li>小七度 (10半音) - D-C</li><li>大七度 (11半音) - C-B</li><li>纯八度 (12半音) - C-C</li></ul></div>`},
scales:{title:'🎹 音阶',html:`<div class="info-block"><h3>大调音阶</h3><p>全-全-半-全-全-全-半。C大调：C D E F G A B C。</p></div><div class="info-block"><h3>自然小调</h3><p>全-半-全-全-半-全-全。A小调：A B C D E F G A。</p></div><div class="info-block"><h3>五声音阶</h3><p>全-全-小三-全-小三。中国民族音乐的基础音阶。</p></div><div class="info-block"><h3>教会调式</h3><ul><li>Ionian (大调)：1 2 3 4 5 6 7</li><li>Dorian：1 2 b3 4 5 6 b7</li><li>Phrygian：1 b2 b3 4 5 b6 b7</li><li>Lydian：1 2 3 #4 5 6 7</li><li>Mixolydian：1 2 3 4 5 6 b7</li><li>Aeolian (小调)：1 2 b3 4 5 b6 b7</li><li>Locrian：1 b2 b3 4 b5 b6 b7</li></ul></div>`},
chords:{title:'🎸 和弦',html:`<div class="info-block"><h3>三和弦</h3><ul><li>大三和弦：根+大三度+纯五度 (1-3-5)</li><li>小三和弦：根+小三度+纯五度 (1-b3-5)</li><li>减三和弦：根+小三度+减五度 (1-b3-b5)</li><li>增三和弦：根+大三度+增五度 (1-3-#5)</li></ul></div><div class="info-block"><h3>七和弦</h3><ul><li>大七和弦 (maj7)：1-3-5-7</li><li>小七和弦 (m7)：1-b3-5-b7</li><li>属七和弦 (7)：1-3-5-b7</li><li>减七和弦 (dim7)：1-b3-b5-bb7</li></ul></div><div class="info-block"><h3>和弦标记</h3><p>C = C大三和弦, Cm = C小三和弦, C7 = C属七和弦, Cmaj7 = C大七和弦</p></div>`},
keys:{title:'🔑 调性',html:`<div class="info-block"><h3>大调与关系小调</h3><p>每个大调都有一个关系小调，共享相同的调号。C大调的关系小调是A小调。</p></div><div class="info-block"><h3>五度圈</h3><p>调性之间的关系可以用五度圈表示：C→G→D→A→E→B→F#→Db→Ab→Eb→Bb→F→C</p></div><div class="info-block"><h3>调号</h3><ul><li>无升降：C大调/A小调</li><li>1#(F#)：G大调/E小调</li><li>2#(F#,C#)：D大调/B小调</li><li>1b(Bb)：F大调/D小调</li><li>2b(Bb,Eb)：Bb大调/G小调</li></ul></div>`},
rhythm:{title:'🥁 节拍与节奏',html:`<div class="info-block"><h3>拍号</h3><p>拍号上方数字表示每小节拍数，下方数字表示以哪种音符为一拍。</p><ul><li>4/4：每小节4拍，四分音符为一拍（最常见）</li><li>3/4：每小节3拍，华尔兹节奏</li><li>2/4：每小节2拍，进行曲</li><li>6/8：每小节6拍，八分音符为一拍</li></ul></div><div class="info-block"><h3>音符时值</h3><ul><li>全音符 = 4拍</li><li>二分音符 = 2拍</li><li>四分音符 = 1拍</li><li>八分音符 = 1/2拍</li><li>十六分音符 = 1/4拍</li></ul></div><div class="info-block"><h3>节奏型</h3><p>附点音符延长原时值的一半。三连音将一拍等分为三份。切分节奏打破强弱规律。</p></div>`}
};
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playNote(note,dur=0.5){initAudio();const idx=NOTES.indexOf(note);const freq=440*Math.pow(2,(idx+3-9)/12);const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;g.gain.setValueAtTime(0.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);osc.connect(g);g.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+dur)}
function buildTabs(){const el=document.getElementById('topicTabs');el.innerHTML=TOPICS.map(t=>`<button class="tab-btn${t.id===currentTopic?' active':''}" onclick="selectTopic('${t.id}')">${t.name}</button>`).join('')}
function selectTopic(id){currentTopic=id;buildTabs();renderContent()}
function renderContent(){const c=CONTENT[currentTopic];document.getElementById('contentTitle').textContent=c.title;const area=document.getElementById('contentArea');area.innerHTML=c.html;if(currentTopic==='notes')renderNoteRow();renderQuiz()}
function renderNoteRow(){const el=document.getElementById('noteRow');if(!el)return;el.innerHTML=NOTES.map((n,i)=>`<span class="note-tag" onclick="playNote('${n}')" title="${NOTE_NAMES[i]}">${n}</span>`).join('')}
let quizScore=0,quizTotal=0;
function generateQuiz(){const types=['notes','intervals','scales','chords'];const type=types[Math.floor(Math.random()*types.length)];if(type==='notes'){const correct=Math.floor(Math.random()*12);const freq=440*Math.pow(2,(correct+3-9)/12);return{question:`点击播放的音是哪个音？`,answer:NOTES[correct],options:shuffle([NOTES[correct],NOTES[(correct+3)%12],NOTES[(correct+7)%12],NOTES[(correct+5)%12]]),playNote:()=>{initAudio();const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;g.gain.setValueAtTime(0.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1);osc.connect(g);g.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1)}}}if(type==='intervals'){const ivs=[{name:'纯一度',semitones:0},{name:'小二度',semitones:1},{name:'大二度',semitones:2},{name:'小三度',semitones:3},{name:'大三度',semitones:4},{name:'纯四度',semitones:5},{name:'纯五度',semitones:7},{name:'八度',semitones:12}];const correct=ivs[Math.floor(Math.random()*ivs.length)];const root=Math.floor(Math.random()*12);const options=shuffle([correct.name,...ivs.filter(i=>i.name!==correct.name).sort(()=>Math.random()-.5).slice(0,3).map(i=>i.name)]);return{question:`播放的音程是什么？`,answer:correct.name,options,playNote:()=>{initAudio();[0,correct.semitones].forEach((s,j)=>{setTimeout(()=>{const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type='sine';osc.frequency.value=440*Math.pow(2,(root+s-9)/12);g.gain.setValueAtTime(0.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.8);osc.connect(g);g.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+0.8)},j*600)})}}}const scales=[{name:'C大调',notes:'C D E F G A B'},{name:'A小调',notes:'A B C D E F G'},{name:'G大调',notes:'G A B C D E F#'},{name:'D大调',notes:'D E F# G A B C#'}];const correct=scales[Math.floor(Math.random()*scales.length)];return{question:`哪个是${correct.name}的组成音？`,answer:correct.notes,options:shuffle([correct.notes,...scales.filter(s=>s.notes!==correct.notes).sort(()=>Math.random()-.5).slice(0,3).map(s=>s.notes)]),playNote:null}}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let currentQuiz=null;
function renderQuiz(){quizScore=0;quizTotal=0;nextQuiz()}
function nextQuiz(){currentQuiz=generateQuiz();quizTotal++;const el=document.getElementById('quizArea');let html=`<div class="quiz-q">${currentQuiz.question}</div>`;if(currentQuiz.playNote)html+=`<button class="tab-btn" onclick="currentQuiz.playNote()" style="margin-bottom:12px">▶ 播放</button>`;html+=`<div class="quiz-options">${currentQuiz.options.map(o=>`<button class="quiz-opt" onclick="checkAnswer(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div><div class="quiz-score">得分: ${quizScore}/${quizTotal}</div>`;el.innerHTML=html;if(currentQuiz.playNote)setTimeout(()=>currentQuiz.playNote(),100)}
function checkAnswer(btn,answer){if(!currentQuiz)return;const opts=document.querySelectorAll('.quiz-opt');opts.forEach(o=>o.style.pointerEvents='none');if(answer===currentQuiz.answer){btn.classList.add('correct');quizScore++}else{btn.classList.add('wrong');opts.forEach(o=>{if(o.textContent===currentQuiz.answer)o.classList.add('correct')})}setTimeout(nextQuiz,1200)}
buildTabs();renderContent();
</script>
</body>
</html>
