<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>手相</title><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#8b5cf6;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8em;margin-bottom:8px;text-align:center}
.subtitle{color:#8b949e;margin-bottom:20px;text-align:center;font-size:.9em}
.game-area{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:100%;margin-bottom:16px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:1em;transition:all .2s}
.btn:hover{opacity:.9;transform:scale(1.02)}
.btn:active{transform:scale(.98)}
.btn-sm{padding:6px 14px;font-size:.85em}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-yellow{background:var(--yellow);color:#000}.btn-orange{background:var(--orange)}
.flex{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;gap:4px}
.info{text-align:center;color:#8b949e;margin:12px 0;font-size:.95em}
.result{text-align:center;font-size:1.2em;margin:16px 0;padding:16px;border-radius:8px;background:var(--bg);min-height:40px}
.token{display:inline-block;padding:4px 10px;margin:3px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.token:hover{border-color:var(--accent)}
.token.active{background:var(--accent);border-color:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media(max-width:480px){body{padding:12px}.game-area{padding:16px}h1{font-size:1.4em}}
</style></head><body>
<h1>手相</h1><p class="subtitle">手相分析</p>
<div class="game-area"><div style="font-size:6em;text-align:center;margin:20px 0">✋</div>
<div class="flex"><button class="btn" style="background:var(--accent)" onclick="divine()">占卜</button></div>
<div class="result" id="result"></div>
<script>
const rs=["生命线长，健康长寿", "事业线深，前途光明", "感情线弯，桃花运旺", "智慧线长，聪明过人"];
function divine(){document.getElementById('result').innerHTML='<div style="font-size:1.3em">'+rs[Math.floor(Math.random()*rs.length)]+'</div>';}
divine();</script>
</div></body></html>
