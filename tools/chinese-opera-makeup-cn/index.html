<meta property="og:title" content="中国戏曲脸谱大全 - Chinese Opera Makeup Encyclopedia">
<meta property="og:description" content="中国戏曲脸谱大全，详解京剧、川剧、豫剧等各剧种脸谱的色彩寓意与绘制技法">

<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#c97e4a;--accent2:#a86530}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#b06a30;--accent2:#8a5020}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0e05 0%,#2a1a0a 50%,#3d2510 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3a1a;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#c97e4a,#e8a87c,#d4956b,#a86530);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.makeup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.makeup-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.makeup-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.makeup-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.makeup-card .mk-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.makeup-card .mk-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(201,126,74,0.15);color:var(--accent)}
.makeup-card .mk-name{font-size:1.3em;font-weight:bold}
.makeup-card .mk-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.makeup-card .mk-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.makeup-card .mk-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.makeup-card .mk-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.makeup-card .mk-detail strong{color:var(--text)}
.makeup-card .mk-colors{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.makeup-card .mk-colors .cl-label{font-size:0.8em;color:var(--accent);margin-bottom:6px}
.makeup-card .mk-colors .cl-list{display:flex;flex-wrap:wrap;gap:6px}
.makeup-card .mk-colors .cl-tag{font-size:0.75em;padding:3px 10px;border-radius:10px;display:flex;align-items:center;gap:4px}
.cl-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.makeup-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.makeup-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🎨 中国戏曲脸谱大全</h1>
<p>Chinese Opera Makeup Encyclopedia — 探索戏曲脸谱的色彩寓意、绘制技法与角色象征</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索脸谱类型、色彩或剧种...（如"红脸""关羽""丑角"）" title="Enter键搜索">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="整脸">整脸</button>
<button class="filter-btn" data-filter="三块瓦脸">三块瓦脸</button>
<button class="filter-btn" data-filter="十字门脸">十字门脸</button>
<button class="filter-btn" data-filter="碎花脸">碎花脸</button>
<button class="filter-btn" data-filter="歪脸">歪脸</button>
<button class="filter-btn" data-filter="丑角脸">丑角脸</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="makeup-grid" id="makeupGrid"></div>
</div>
<footer>中国戏曲脸谱大全 — 传承国粹艺术 · garyy.top</footer>
<script>
const makeupData=[
{name:"红整脸",category:"整脸",icon:"🔴",subtitle:"忠义正直",colors:["红","黑","白"],meaning:"红色代表忠义、正直，多用于正面人物",characters:"关羽、姜维、赵匡胤",origin:"京剧",difficulty:"高级",description:"红整脸是京剧脸谱中最具代表性的谱式，以红色为主色调，勾画整张脸面。红色象征忠义勇敢，是正面人物的标志。关羽的红脸是红整脸的经典代表。"},
{name:"黑整脸",category:"整脸",icon:"⚫",subtitle:"刚直勇猛",colors:["黑","白"],meaning:"黑色代表刚直不阿、勇猛无畏",characters:"包拯、张飞、李逵",origin:"京剧",difficulty:"中级",description:"黑整脸以黑色为主，象征刚直、勇猛。包拯的黑脸最为著名，额头常有月牙标志，代表公正无私。"},
{name:"白整脸",category:"整脸",icon:"⚪",subtitle:"奸诈阴险",colors:["白","黑","红"],meaning:"白色象征奸诈、阴险、多疑",characters:"曹操、严嵩、司马懿",origin:"京剧",difficulty:"高级",description:"白整脸以白色为主，是奸臣的标志。曹操的白脸最为经典，整张脸涂白，眉毛细长上挑，表现其奸诈多疑的性格。"},
{name:"黄三块瓦",category:"三块瓦脸",icon:"🟡",subtitle:"勇猛暴烈",colors:["黄","黑","红"],meaning:"黄色代表勇猛、暴烈、凶狠",characters:"典韦、宇文成都",origin:"京剧",difficulty:"中级",description:"三块瓦脸将脸部分为额、左颊、右颊三块，中间以黑色勾画眉眼。黄三块瓦表示人物勇猛凶悍。"},
{name:"蓝三块瓦",category:"三块瓦脸",icon:"🔵",subtitle:"刚强骁勇",colors:["蓝","黑","白"],meaning:"蓝色代表刚强、骁勇、有心计",characters:"窦尔敦、单雄信",origin:"京剧",difficulty:"中级",description:"蓝三块瓦脸以蓝色为主，象征人物刚强骁勇。窦尔敦是蓝三块瓦脸的典型代表，蓝色浓重，表现其草莽英雄的气质。"},
{name:"绿三块瓦",category:"三块瓦脸",icon:"🟢",subtitle:"侠骨义肠",colors:["绿","黑","红"],meaning:"绿色代表侠义、莽撞、暴躁",characters:"程咬金、徐世英",origin:"京剧",difficulty:"初级",description:"绿三块瓦脸以绿色为主，多用于绿林好汉。绿色象征侠义豪爽，也暗示人物性格暴躁莽撞。"},
{name:"紫十字门",category:"十字门脸",icon:"🟣",subtitle:"肃穆威严",colors:["紫","黑","白"],meaning:"紫色代表肃穆、稳重、威严",characters:"徐延昭、专诸",origin:"京剧",difficulty:"高级",description:"十字门脸在面部中央勾画十字形图案，将脸分为四部分。紫十字门脸表现人物的肃穆威严。"},
{name:"黑十字门",category:"十字门脸",icon:"⬛",subtitle:"铁面无私",colors:["黑","白"],meaning:"黑色十字门脸代表刚正不阿",characters:"包拯（另一版本）",origin:"京剧",difficulty:"高级",description:"黑十字门脸是包拯的另一经典谱式，十字形将脸部分割，黑白分明，表现铁面无私的性格。"},
{name:"红碎花脸",category:"碎花脸",icon:"🔴",subtitle:"英武刚烈",colors:["红","黑","金"],meaning:"碎花脸表示人物性格复杂多面",characters:"孟良、焦赞",origin:"京剧",difficulty:"专家",description:"碎花脸在整脸基础上添加碎花纹饰，线条繁复。红碎花脸表现人物英武刚烈而又不失细腻。"},
{name:"黑碎花脸",category:"碎花脸",icon:"⬛",subtitle:"勇猛凶悍",colors:["黑","红","白"],meaning:"黑碎花脸表示极度勇猛",characters:"牛皋、胡大海",origin:"京剧",difficulty:"专家",description:"黑碎花脸线条最为复杂，黑色底上勾画各种碎花纹样，表现人物的极度勇猛和复杂性格。"},
{name:"歪脸",category:"歪脸",icon:"😕",subtitle:"丑陋凶恶",colors:["白","黑","红"],meaning:"歪脸表示面部有伤残或性格扭曲",characters:"郑恩、颜佩韦",origin:"京剧",difficulty:"高级",description:"歪脸的特点是左右不对称，面部歪斜。多用于面部有伤残或性格凶恶的人物，表现其凶悍丑陋。"},
{name:"豆腐块丑脸",category:"丑角脸",icon:"😊",subtitle:"滑稽幽默",colors:["白","黑"],meaning:"丑角脸鼻梁处画白色豆腐块",characters:"蒋干、崇公道",origin:"京剧",difficulty:"初级",description:"豆腐块丑脸是丑角的基本谱式，在鼻梁处画白色方块。小花脸以白色豆腐块为核心，表现人物滑稽幽默。"},
{name:"腰子丑脸",category:"丑角脸",icon:"🎭",subtitle:"机灵狡黠",colors:["白","黑"],meaning:"腰子形白色图案表示机灵",characters:"刘利华、朱光祖",origin:"京剧",difficulty:"初级",description:"腰子丑脸在鼻梁处画腰子形白色图案，比豆腐块更圆润，表示人物机灵狡黠。"},
{name:"川剧变脸",category:"整脸",icon:"🎭",subtitle:"瞬息万变",colors:["红","蓝","黑","金"],meaning:"川剧变脸是独特的舞台技艺",characters:"各类角色",origin:"川剧",difficulty:"专家",description:"川剧变脸是中国戏曲独特的表演技艺，演员能在瞬间变换多张脸谱。技法包括扯脸、吹粉、抹脸等，令人叹为观止。"},
{name:"秦腔脸谱",category:"三块瓦脸",icon:"🔴",subtitle:"粗犷豪放",colors:["红","黑","白","绿"],meaning:"秦腔脸谱线条粗犷，色彩浓烈",characters:"生旦净丑各类",origin:"秦腔",difficulty:"高级",description:"秦腔脸谱比京剧脸谱更加粗犷豪放，线条大胆，色彩浓烈，体现了西北文化的豪迈气质。"},
{name:"豫剧脸谱",category:"碎花脸",icon:"🟡",subtitle:"朴实大方",colors:["红","黑","白","黄"],meaning:"豫剧脸谱兼具京剧与地方特色",characters:"各类角色",origin:"豫剧",difficulty:"中级",description:"豫剧脸谱在借鉴京剧脸谱的基础上，融入河南地方特色，风格朴实大方，色彩鲜明。"}
];
function getStats(data){const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});return cats}
function renderStats(data){
const stats=getStats(data);
const el=document.getElementById('statsOverview');
el.innerHTML=`<div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">脸谱总数</div></div>`+Object.entries(stats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('');
}
function renderCards(data){
const grid=document.getElementById('makeupGrid');
grid.innerHTML=data.map(m=>`<div class="makeup-card" data-category="${m.category}">
<div class="mk-header"><div class="mk-icon">${m.icon}</div><div><div class="mk-name">${m.name}</div><div class="mk-sub">${m.subtitle}</div></div></div>
<div class="mk-meta"><span>${m.origin}</span><span>${m.category}</span><span>${m.difficulty}</span></div>
<div class="mk-detail"><strong>色彩寓意：</strong>${m.meaning}<br><strong>代表人物：</strong>${m.characters}<br><strong>简介：</strong>${m.description}</div>
<div class="mk-colors"><div class="cl-label">🎨 色彩构成</div><div class="cl-list">${m.colors.map(c=>{const colorMap={红:'#ef4444',黑:'#1f2937',白:'#f3f4f6',黄:'#eab308',蓝:'#3b82f6',绿:'#22c55e',紫:'#a855f7',金:'#f59e0b'};return`<span class="cl-tag" style="background:${colorMap[c]||'#888'}22;border:1px solid ${colorMap[c]||'#888'}44;color:${colorMap[c]||'#888'}"><span class="cl-dot" style="background:${colorMap[c]||'#888'}"></span>${c}</span>`}).join('')}</div></div>
</div>`).join('');
}
function filterCards(){
const q=document.getElementById('searchInput').value.toLowerCase();
const f=document.querySelector('.filter-btn.active').dataset.filter;
const filtered=makeupData.filter(m=>{
const matchF=f==='all'||m.category===f;
const matchQ=!q||m.name.toLowerCase().includes(q)||m.characters.toLowerCase().includes(q)||m.description.toLowerCase().includes(q)||m.origin.toLowerCase().includes(q)||m.colors.some(c=>c.includes(q));
return matchF&&matchQ;
});
renderCards(filtered);renderStats(filtered);
}
document.getElementById('searchInput').addEventListener('input',filterCards);
document.getElementById('filterRow').addEventListener('click',e=>{
if(e.target.classList.contains('filter-btn')){
document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');filterCards();
}});
renderCards(makeupData);renderStats(makeupData);
</script>
</body>
</html>
