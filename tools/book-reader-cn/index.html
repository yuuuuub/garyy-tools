<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 中文电子书阅读器</title>
<meta property="og:title" content="📖 中文电子书阅读器">
<meta property="og:description" content="📖 中文电子书阅读器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线电子书阅读器，支持TXT导入、章节导航、阅读进度保存、多种阅读主题">
<meta name="robots" content="index, follow">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.8}
.ctn{max-width:800px;margin:0 auto;padding:20px}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:120px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin:2px}
.hidden{display:none}
.bookmark-list{max-height:300px;overflow-y:auto}
.bookmark-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border);cursor:pointer}
.bookmark-item:hover{background:var(--bg)}
.toc-item{padding:8px 12px;cursor:pointer;border-radius:6px;margin:2px 0;transition:background .15s}
.toc-item:hover{background:var(--bg)}
.toc-item.active{background:var(--accent);color:#fff}
.reader-area{min-height:400px;padding:24px;line-height:2;white-space:pre-wrap;word-wrap:break-word;cursor:text}
.reader-area h2{margin:20px 0 10px;color:var(--accent)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.stat-box{padding:16px;background:var(--bg);border-radius:8px}
.stat-num{font-size:1.6rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.8rem;color:var(--text2);margin-top:4px}
.settings-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.settings-row label{margin:0;min-width:80px}
.settings-row input[type=range]{flex:1}
.theme-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);cursor:pointer;transition:all .2s}
.theme-btn:hover,.theme-btn.active{border-color:var(--accent);transform:scale(1.1)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1 style="position:fixed;top:6px;left:80px;z-index:999;font-size:1rem;pointer-events:none">📖 中文电子书阅读器</h1>
<div class="ctn" style="padding-top:50px">
<div class="cd" id="import-section">
<h2 style="margin-bottom:12px">📚 导入书籍</h2>
<p style="color:var(--text2);margin-bottom:12px">支持导入 TXT 文件或粘贴文本内容</p>
<div class="bg">
<button onclick="document.getElementById('file-input').click()">📁 导入TXT文件</button>
<button class="sec" onclick="pasteText()">📋 粘贴文本</button>
<button class="sec" onclick="loadDemo()">📖 加载示例</button>
</div>
<input type="file" id="file-input" accept=".txt,.text" style="display:none" onchange="handleFile(event)">
</div>

<div class="cd hidden" id="reader-section">
<div class="bg" style="margin-bottom:16px">
<button onclick="showView('read')" id="btn-read" class="">📖 阅读</button>
<button onclick="showView('toc')" class="sec">📑 目录</button>
<button onclick="showView('bookmarks')" class="sec">🔖 书签</button>
<button onclick="showView('settings')" class="sec">⚙️ 设置</button>
<button onclick="showView('stats')" class="sec">📊 统计</button>
<div style="flex:1"></div>
<button class="sec" onclick="toggleFullscreen()" id="btn-full">⛶ 全屏</button>
</div>
<div id="progress-bar" style="width:100%;height:4px;background:var(--border);border-radius:2px;margin-bottom:16px"><div id="progress-fill" style="height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width .3s"></div></div>

<div id="view-read" class="">
<div id="search-bar" class="hidden" style="margin-bottom:12px">
<div style="display:flex;gap:8px">
<input type="text" id="search-input" placeholder="搜索内容..." onkeyup="searchText(event)">
<button onclick="searchText()" style="white-space:nowrap">搜索</button>
<button class="sec" onclick="toggleSearchBar()" style="white-space:nowrap">关闭</button>
</div>
<div id="search-count" style="font-size:.8rem;color:var(--text2);margin-top:4px"></div>
</div>
<div class="reader-area" id="reader-content" onscroll="onScroll()"></div>
</div>

<div id="view-toc" class="hidden"><div id="toc-list"></div></div>
<div id="view-bookmarks" class="hidden"><div id="bookmark-list" class="bookmark-list"></div></div>
<div id="view-settings" class="hidden" id="settings-panel"></div>
<div id="view-stats" class="hidden"></div>
</div>
</div>

<div class="modal-overlay hidden" id="paste-modal">
<div class="modal">
<h2 style="margin-bottom:12px">📋 粘贴文本</h2>
<textarea id="paste-input" rows="12" placeholder="在此粘贴书籍内容..."></textarea>
<div class="bg" style="margin-top:12px">
<button onclick="confirmPaste()">确认导入</button>
<button class="sec" onclick="closePaste()">取消</button>
</div>
</div>
</div>

<script>
const STORAGE_KEY='book_reader_data';
let book={title:'',content:'',chapters:[],fontSize:18,lineHeight:2,fontFamily:'system',bgTheme:'dark',scrollPos:0,bookmarks:[],readTime:0,startTime:Date.now()};
const fontFamilies={system:'系统默认',serif:'宋体/Serif',songti:'Songti SC',kaiti:'Kaiti SC',yahei:'Microsoft YaHei'};
const bgThemes={dark:'深色',light:'浅色',sepia:'护眼',night:'夜间'};
const bgColors={dark:'var(--bg)',light:'#fff',sepia:'#f4ecd8',night:'#1a1a2e'};
const textColors={dark:'var(--text)',light:'#1f2328',sepia:'#5b4636',night:'#e0e0e0'};

function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY));if(d)book={...book,...d}}catch(e){}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(book))}
function handleFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){book.title=f.name.replace(/\.txt$/i,'');book.content=ev.target.result;parseChapters();book.scrollPos=0;book.bookmarks=[];save();showReader()};r.readAsText(f)}
function pasteText(){document.getElementById('paste-modal').classList.remove('hidden')}
function closePaste(){document.getElementById('paste-modal').classList.add('hidden')}
function confirmPaste(){const t=document.getElementById('paste-input').value.trim();if(!t)return;book.title='粘贴文本';book.content=t;parseChapters();save();closePaste();showReader()}
function loadDemo(){book.title='示例书籍 - 三体';book.content=`
第一章 疯狂年代
中国，1967年。
"红色联合"对"四·二八兵团"总部大楼的攻击已持续了两天。他们的旗帜在大楼顶上激烈地飘扬着，下面的炮声不断。汪淼透过窗户，看着远方的火光，心中充满了不安。

第二章 寂静的春天
在叶文洁的记忆中，那个黄昏改变了她的一生。红岸基地的电磁波射向太空，人类第一次向宇宙发出了自己的声音。那是1971年的夏天，一个注定要改变世界的时刻。

第三章 地球往事
2007年，纳米材料科学家汪淼被卷入一场离奇的事件。一个名为"科学边界"的组织，一系列科学家的自杀，以及一个名为"三体"的游戏，逐渐揭开了一个跨越光年的秘密。

第四章 三体世界
在那个虚拟游戏中，汪淼目睹了一个世界的毁灭与重生。三体人生活在三个太阳之间，他们的文明在恒纪元与乱纪元之间反复轮回。每一次日出，都不知道是否还有下一个。

第五章 古筝行动
当人类终于意识到三体舰队正在向地球进发时，恐慌席卷全球。"古筝行动"是人类的第一次反击，用纳米丝切割了"审判日"号巨轮。鲜血染红了巴拿马运河。

第六章 面壁者
面对智子的监控，人类制定了"面壁计划"。四位面壁者各自制定了秘密的战略计划，而三体人则派出了"破壁人"来识破他们。罗辑，一个看似平凡的社会学家，被选为面壁者之一。`;parseChapters();book.scrollPos=0;book.bookmarks=[];save();showReader()}

function parseChapters(){
book.chapters=[];
const lines=book.content.split('\n');
let chapterStart=-1;
lines.forEach((line,i)=>{
const t=line.trim();
if(/^(第[一二三四五六七八九十百千零\d]+[章节回卷]|Chapter|卷|章)/i.test(t)){
if(chapterStart>=0)book.chapters.push({title:lines[chapterStart].trim(),line:chapterStart});
chapterStart=i;
}
});
if(chapterStart>=0)book.chapters.push({title:lines[chapterStart].trim(),line:chapterStart});
}

function showReader(){
document.getElementById('import-section').classList.add('hidden');
document.getElementById('reader-section').classList.remove('hidden');
renderContent();
applySettings();
updateStats();
}

function renderContent(){
const el=document.getElementById('reader-content');
if(!book.content){el.innerHTML='<p style="text-align:center;color:var(--text2);padding:40px">暂无内容</p>';return;}
const paragraphs=book.content.split('\n');
let html='';
paragraphs.forEach((p,i)=>{
const t=p.trim();
if(!t){html+='<br>';return;}
if(/^(第[一二三四五六七八九十百千零\d]+[章节回卷]|Chapter|卷|章)/i.test(t)){
html+=`<h2 id="ch-${i}" data-line="${i}">${t}</h2>`;
}else{
html+=`<p data-line="${i}">${t}</p>`;
}
});
el.innerHTML=html;
if(book.scrollPos)el.scrollTop=book.scrollPos;
}

function showView(v){
['read','toc','bookmarks','settings','stats'].forEach(id=>{
document.getElementById('view-'+id).classList.toggle('hidden',id!==v);
document.getElementById('btn-'+id)?.classList.toggle('active',id===v);
});
if(v==='toc')renderTOC();
if(v==='bookmarks')renderBookmarks();
if(v==='settings')renderSettings();
if(v==='stats')updateStats();
}

function renderTOC(){
const el=document.getElementById('toc-list');
if(!book.chapters.length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)">未检测到章节</div>';return;}
el.innerHTML=book.chapters.map((c,i)=>`<div class="toc-item" onclick="goToChapter(${i})">${c.title}</div>`).join('');
}

function goToChapter(i){
const line=book.chapters[i].line;
const el=document.getElementById('reader-content');
const target=el.querySelector(`[data-line="${line}"]`);
if(target){el.scrollTop=target.offsetTop-20;book.scrollPos=el.scrollTop;save();}
showView('read');
}

function renderBookmarks(){
const el=document.getElementById('bookmark-list');
if(!book.bookmarks.length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)">暂无书签</div>';return;}
el.innerHTML=book.bookmarks.map((b,i)=>`<div class="bookmark-item"><div><strong>${b.title}</strong><br><span style="color:var(--text2);font-size:.8rem">${b.text.substring(0,50)}...</span></div><div class="bg"><button class="sec" onclick="jumpToBookmark(${i})">跳转</button><button class="dng" onclick="removeBookmark(${i})">删除</button></div></div>`).join('');
}

function addBookmark(){
const el=document.getElementById('reader-content');
const scrollPercent=el.scrollTop/(el.scrollHeight-el.clientHeight||1);
const charIndex=Math.floor(scrollPercent*book.content.length);
const text=book.content.substring(charIndex,charIndex+100);
const title=`书签 - ${new Date().toLocaleTimeString('zh-CN')}`;
book.bookmarks.push({title,text,scrollPos:el.scrollTop,charIndex});
save();renderBookmarks();
alert('书签已添加！');
}

function jumpToBookmark(i){
const el=document.getElementById('reader-content');
el.scrollTop=book.bookmarks[i].scrollPos;
book.scrollPos=el.scrollTop;save();showView('read');
}

function removeBookmark(i){book.bookmarks.splice(i,1);save();renderBookmarks()}

function onScroll(){
const el=document.getElementById('reader-content');
book.scrollPos=el.scrollTop;
const pct=el.scrollTop/(el.scrollHeight-el.clientHeight||1)*100;
document.getElementById('progress-fill').style.width=pct+'%';
book.readTime+=1;
if(book.readTime%10===0)save();
}

function applySettings(){
const el=document.getElementById('reader-content');
const bg=bgThemes[book.bgTheme]||'dark';
el.style.fontSize=book.fontSize+'px';
el.style.lineHeight=book.lineHeight;
const ff=fontFamilies[book.fontFamily]||'system';
el.style.fontFamily=ff==='system'?'-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif':ff==='serif'?'Songti SC,SimSun,serif':ff;
el.style.background=bgColors[bg]||bgColors.dark;
el.style.color=textColors[bg]||textColors.dark;
el.style.padding='24px';
el.style.borderRadius='12px';
}

function renderSettings(){
const el=document.getElementById('view-settings');
el.innerHTML=`
<div class="cd">
<h2 style="margin-bottom:12px">⚙️ 阅读设置</h2>
<div class="settings-row"><label>字号</label><input type="range" min="12" max="32" value="${book.fontSize}" oninput="book.fontSize=this.value;applySettings();save()"><span style="min-width:40px">${book.fontSize}px</span></div>
<div class="settings-row"><label>行距</label><input type="range" min="1.2" max="3" step="0.1" value="${book.lineHeight}" oninput="book.lineHeight=this.value;applySettings();save()"><span style="min-width:40px">${book.lineHeight}</span></div>
<label>字体</label>
<div class="bg">${Object.entries(fontFamilies).map(([k,v])=>`<button class="${book.fontFamily===k?'':'sec'}" onclick="book.fontFamily='${k}';applySettings();save();renderSettings()">${v}</button>`).join('')}</div>
<label>阅读主题</label>
<div class="bg">${Object.entries(bgThemes).map(([k,v])=>`<button class="${book.bgTheme===k?'':'sec'}" onclick="book.bgTheme='${k}';applySettings();save();renderSettings()">${v}</button>`).join('')}</div>
<div class="bg" style="margin-top:16px">
<button onclick="addBookmark()">🔖 添加书签</button>
<button class="sec" onclick="toggleSearchBar();showView('read')">🔍 搜索</button>
<button class="dng" onclick="if(confirm('确定清除所有数据？')){localStorage.removeItem('${STORAGE_KEY}');location.reload()}">🗑️ 清除数据</button>
</div>
</div>`;
}

function updateStats(){
const el=document.getElementById('view-stats');
const totalChars=book.content.length;
const readMinutes=Math.floor(book.readTime/60);
const wordsPerMin=Math.floor(totalChars/(readMinutes||1));
el.innerHTML=`<div class="cd"><h2 style="margin-bottom:12px">📊 阅读统计</h2><div class="stat-grid">
<div class="stat-box"><div class="stat-num">${book.chapters.length}</div><div class="stat-label">章节数</div></div>
<div class="stat-box"><div class="stat-num">${totalChars.toLocaleString()}</div><div class="stat-label">总字数</div></div>
<div class="stat-box"><div class="stat-num">${book.bookmarks.length}</div><div class="stat-label">书签数</div></div>
<div class="stat-box"><div class="stat-num">${readMinutes}</div><div class="stat-label">阅读分钟</div></div>
<div class="stat-box"><div class="stat-num">${wordsPerMin}</div><div class="stat-label">字/分钟</div></div>
<div class="stat-box"><div class="stat-num">${book.title?'✅':'❌'}</div><div class="stat-label">已加载</div></div>
</div></div>`;
}

function toggleSearchBar(){document.getElementById('search-bar').classList.toggle('hidden')}
let searchMatches=[];let searchIndex=0;
function searchText(e){
if(e&&e.key!=='Enter')return;
const q=document.getElementById('search-input').value.trim();
if(!q)return;
searchMatches=[];searchIndex=0;
const el=document.getElementById('reader-content');
const paras=el.querySelectorAll('p,h2');
paras.forEach(p=>{if(p.textContent.includes(q))searchMatches.push(p)});
document.getElementById('search-count').textContent=`找到 ${searchMatches.length} 处匹配`;
if(searchMatches.length){searchMatches[0].scrollIntoView({behavior:'smooth',block:'center'});highlightSearch(searchMatches[0],q)}
}

function highlightSearch(el,q){
el.style.background='var(--yellow)';el.style.color='#000';el.style.borderRadius='4px';el.style.padding='4px';
setTimeout(()=>{el.style.background='';el.style.color='';el.style.padding='';},2000);
}

function toggleFullscreen(){
if(!document.fullscreenElement)document.documentElement.requestFullscreen();
else document.exitFullscreen();
}

window.addEventListener('beforeunload',()=>{book.scrollPos=document.getElementById('reader-content')?.scrollTop||0;save()});
load();
if(book.content)showReader();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
