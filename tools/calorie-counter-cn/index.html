<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 卡路里计算器</title>
<meta name="description" content="每日卡路里摄入计算器，设定目标并追踪每日热量消耗与摄入">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.pw{height:20px;background:var(--bg);border-radius:10px;overflow:hidden;margin:12px 0}.pf{height:100%;border-radius:10px;transition:width .5s;background:linear-gradient(90deg,var(--success),var(--accent))}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔥 卡路里计算器">
<meta property="og:description" content="每日卡路里摄入计算器，设定目标并追踪每日热量消耗与摄入">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/calorie-counter-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🔥 卡路里计算器</h1><p>每日热量追踪，管理你的饮食目标</p></div>

<div class="cd">
<div class="gr">
<div class="st"><div class="nm" id="todayCal" style="color:var(--success)">0</div><div class="lb">今日摄入 (kcal)</div></div>
<div class="st"><div class="nm" id="todayTarget">2000</div><div class="lb">每日目标 (kcal)</div></div>
<div class="st"><div class="nm" id="remainCal" style="color:var(--accent)">2000</div><div class="lb">剩余 (kcal)</div></div>
</div>
<div class="pw"><div class="pf" id="progressBar" style="width:0%"></div></div>
<div style="text-align:center;color:var(--text2);font-size:.85rem" id="progressText">0% 已完成</div>
</div>

<div class="cd"><h2>添加食物</h2>
<div class="fr">
<div><label>食物名称</label><input type="text" id="foodName" placeholder="如：炒饭"></div>
<div><label>数量 (份)</label><input type="number" id="foodQty" value="1" min="0.5" step="0.5"></div>
</div>
<div class="fr">
<div><label>热量 (kcal)</label><input type="number" id="foodCal" placeholder="每份热量"></div>
<div><label>餐次</label>
<select id="mealType"><option value="早餐">🌅 早餐</option><option value="午餐">☀️ 午餐</option><option value="晚餐">🌙 晚餐</option><option value="零食">🍪 零食</option></select></div>
</div>
<div class="bg"><button onclick="addFood()">添加食物</button></div></div>

<div class="cd"><h2>快捷添加</h2><div class="bg" id="quickBtns"></div></div>

<div class="cd"><h2>今日记录</h2><div id="recordList" class="es">暂无记录</div>
<div class="bg"><button class="sec" onclick="setTarget()">设置每日目标</button><button class="dng" onclick="clearAll()">清空今日</button></div></div>

<div class="cd"><h2>历史统计</h2><div id="historyStats" class="es">暂无历史数据</div></div>
</div>
<script>
(function(){
var DB_KEY='calorie_counter_cn';
var TGT_KEY='calorie_counter_cn_target';
var records=JSON.parse(localStorage.getItem(DB_KEY)||'[]');
var target=parseInt(localStorage.getItem(TGT_KEY))||2000;
var QUICK=[{n:'白米饭(碗)',c:230},{n:'馒头(个)',c:220},{n:'面条(碗)',c:450},{n:'鸡蛋(个)',c:72},{n:'牛奶(杯)',c:160},{n:'苹果(个)',c:95},{n:'香蕉(根)',c:105},{n:'鸡胸肉(100g)',c:165},{n:'牛肉(100g)',c:250},{n:'豆腐(100g)',c:76},{n:'可乐(罐)',c:140},{n:'薯片(包)',c:540}];

function today(){return new Date().toLocaleDateString()}
function todayRecords(){return records.filter(function(r){return r.date===today()})}

function renderQuick(){
document.getElementById('quickBtns').innerHTML=QUICK.map(function(q,i){
return '<button onclick="quickAdd('+i+')" style="font-size:.8rem;padding:6px 10px">'+q.n+'<br><span style="font-size:.7rem;opacity:.7">'+q.c+'kcal</span></button>';
}).join('');
}
window.quickAdd=function(i){var q=QUICK[i];document.getElementById('foodName').value=q.n;document.getElementById('foodCal').value=q.c;};

window.addFood=function(){
var name=document.getElementById('foodName').value.trim();
var qty=parseFloat(document.getElementById('foodQty').value)||1;
var cal=parseFloat(document.getElementById('foodCal').value)||0;
var meal=document.getElementById('mealType').value;
if(!name||!cal){alert('请填写食物名称和热量');return;}
records.push({name:name,qty:qty,cal:cal,meal:meal,date:today(),id:Date.now()});
localStorage.setItem(DB_KEY,JSON.stringify(records));
document.getElementById('foodName').value='';document.getElementById('foodQty').value='1';document.getElementById('foodCal').value='';
render();
};

window.delRecord=function(id){records=records.filter(function(r){return r.id!==id});localStorage.setItem(DB_KEY,JSON.stringify(records));render();};
window.clearAll(){records=records.filter(function(r){return r.date!==today()});localStorage.setItem(DB_KEY,JSON.stringify(records));render();}
window.setTarget=function(){var v=prompt('设置每日卡路里目标 (kcal)',target);if(v&&!isNaN(v)&&parseInt(v)>0){target=parseInt(v);localStorage.setItem(TGT_KEY,target);render();}};

function render(){
var tr=todayRecords();
var total=0;tr.forEach(function(r){total+=r.cal*r.qty});
document.getElementById('todayCal').textContent=Math.round(total);
document.getElementById('todayTarget').textContent=target;
document.getElementById('remainCal').textContent=Math.max(0,target-Math.round(total));
var pct=Math.min(100,Math.round(total/target*100));
document.getElementById('progressBar').style.width=pct+'%';
document.getElementById('progressText').textContent=pct+'% 已完成';
document.getElementById('remainCal').style.color=pct>100?'var(--danger)':'var(--accent)';

var el=document.getElementById('recordList');
if(!tr.length){el.innerHTML='<div class="es">暂无记录</div>';return;}
var html='';tr.slice().reverse().forEach(function(r){
html+='<div class="li"><div style="flex:1"><strong>'+r.name+'</strong> ×'+r.qty+' <span class="tag">'+r.meal+'</span> <span style="color:var(--text2);font-size:.8rem">'+r.cal*r.qty+'kcal</span></div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="delRecord('+r.id+')">✕</button></div>';
});
el.innerHTML=html;

var hist={};
records.forEach(function(r){if(!hist[r.date])hist[r.date]=0;hist[r.date]+=r.cal*r.qty});
var dates=Object.keys(hist).sort().reverse().slice(0,7);
var hEl=document.getElementById('historyStats');
if(!dates.length){hEl.innerHTML='<div class="es">暂无历史数据</div>';return;}
hEl.innerHTML=dates.map(function(d){return '<div class="li"><span>'+d+'</span><span style="font-weight:600;color:var(--accent)">'+Math.round(hist[d])+' kcal</span></div>';}).join('');
}
renderQuick();render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
