<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 色彩和谐轮</title>
<meta property="og:title" content="🎨 色彩和谐轮">
<meta property="og:description" content="🎨 色彩和谐轮 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="交互式色彩和谐轮，支持多种色彩和谐模式与调色板导出">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--text:#f1f5f9;--text-secondary:#94a3b8;--accent:#8b5cf6;--border:#475569;--shadow:0 4px 24px rgba(0,0,0,0.3);--radius:12px;--transition:0.25s ease}
[data-theme="light"]{--bg:#f8fafc;--surface:#ffffff;--surface-2:#f1f5f9;--text:#1e293b;--text-secondary:#64748b;--accent:#8b5cf6;--border:#e2e8f0;--shadow:0 4px 24px rgba(0,0,0,0.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif,'PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;min-height:100vh;padding:16px;transition:background var(--transition),color var(--transition)}
.container{max-width:800px;width:100%;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;transition:background var(--transition),box-shadow var(--transition)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header h1{font-size:1.5rem}
.theme-toggle{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:1rem;transition:all var(--transition)}
.theme-toggle:hover{border-color:var(--accent)}
.section-title{font-size:1.1rem;font-weight:600;margin:16px 0 10px;color:var(--accent)}
.wheel-container{display:flex;justify-content:center;margin-bottom:16px;position:relative}
#wheelCanvas{cursor:crosshair;border-radius:50%}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.control-group{display:flex;flex-direction:column;gap:4px}
.control-group label{font-size:.8rem;color:var(--text-secondary);display:flex;justify-content:space-between}
.control-group label span{color:var(--accent);font-weight:600}
input[type="range"]{width:100%;accent-color:var(--accent);cursor:pointer}
select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:.85rem;transition:border-color var(--transition)}
select:focus{outline:none;border-color:var(--accent)}
.hex-input{display:flex;gap:8px;margin-bottom:16px}
.hex-input input{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.9rem;font-family:monospace}
.hex-input input:focus{outline:none;border-color:var(--accent)}
.hex-input button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.9rem}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.swatch{width:60px;height:60px;border-radius:8px;cursor:pointer;border:2px solid var(--border);transition:all var(--transition);position:relative}
.swatch:hover{transform:scale(1.1);border-color:var(--accent)}
.swatch.base{border-width:3px;border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.swatch-info{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.65rem;white-space:nowrap;color:var(--text-secondary)}
.mode-buttons{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.mode-btn{background:var(--surface-2);border:2px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.8rem;transition:all var(--transition)}
.mode-btn:hover,.mode-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.action-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:.9rem;transition:all var(--transition)}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn-outline{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.history{display:flex;gap:6px;flex-wrap:wrap}
.history-swatch{width:32px;height:32px;border-radius:6px;cursor:pointer;border:2px solid var(--border);transition:all var(--transition)}
.history-swatch:hover{transform:scale(1.15);border-color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .3s;z-index:100;pointer-events:none}
.toast.show{opacity:1}
.color-values{background:var(--surface-2);border-radius:8px;padding:12px;margin-bottom:16px;font-size:.85rem;font-family:monospace;line-height:1.8}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🎨 色彩和谐轮</h1>
<button class="theme-toggle" id="themeToggle">🌙</button>
</div>

<h3 class="section-title">选择基础色</h3>
<div class="wheel-container">
<canvas id="wheelCanvas" width="300" height="300"></canvas>
</div>

<div class="hex-input">
<input type="text" id="hexInput" placeholder="输入HEX颜色，如 #8b5cf6" maxlength="7">
<button id="hexBtn">应用</button>
</div>

<div class="controls">
<div class="control-group">
<label>饱和度 <span id="satVal">100</span>%</label>
<input type="range" id="satSlider" min="0" max="100" value="100">
</div>
<div class="control-group">
<label>亮度 <span id="lightVal">50</span>%</label>
<input type="range" id="lightSlider" min="0" max="100" value="50">
</div>
</div>

<h3 class="section-title">和谐模式</h3>
<div class="mode-buttons" id="modeButtons"></div>

<h3 class="section-title">色彩调板</h3>
<div class="swatches" id="swatches"></div>
<div class="color-values" id="colorValues"></div>

<div class="action-bar">
<button class="btn btn-outline" id="cssBtn">📋 导出CSS变量</button>
<button class="btn btn-outline" id="twBtn">📋 导出Tailwind配置</button>
<button class="btn btn-outline" id="randomBtn">🎲 随机基础色</button>
</div>

<h3 class="section-title">历史记录 (最近10个)</h3>
<div class="history" id="history"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const MODES = [
  {name:'互补色', id:'complementary', count:2},
  {name:'类似色', id:'analogous', count:3},
  {name:'三色组', id:'triadic', count:3},
  {name:'分裂互补', id:'split-complementary', count:3},
  {name:'四色组', id:'tetradic', count:4},
  {name:'单色', id:'monochromatic', count:5}
];

let baseHue = 262;
let saturation = 100;
let lightness = 50;
let currentMode = 'complementary';
let history = JSON.parse(localStorage.getItem('ch-history') || '[]');

const $ = id => document.getElementById(id);
const canvas = $('wheelCanvas');
const ctx = canvas.getContext('2d');
const SIZE = 300;
const CENTER = SIZE / 2;
const RADIUS = 130;

// Theme
function initTheme() {
  const saved = localStorage.getItem('ch-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  $('themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
}
$('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ch-theme', next);
  $('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
  drawWheel();
});
initTheme();

// Toast
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// HSL helpers
function hslToRgb(h, s, l) {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [Math.round(f(0)*255), Math.round(f(8)*255), Math.round(f(4)*255)];
}
function rgbToHex(r, g, b) { return '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join(''); }
function hslToHex(h, s, l) { return rgbToHex(...hslToRgb(h, s, l)); }
function hexToHsl(hex) {
  let r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if (max===min) { h=s=0; } else {
    const d=max-min; s=l>0.5?d/(2-max-min):d/(max+min);
    switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break;}
  }
  return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
}

// Draw wheel
function drawWheel() {
  const w = SIZE, h = SIZE;
  ctx.clearRect(0, 0, w, h);
  // Draw hue wheel
  for (let angle = 0; angle < 360; angle++) {
    const startAngle = (angle - 1) * Math.PI / 180;
    const endAngle = (angle + 1) * Math.PI / 180;
    const grad = ctx.createRadialGradient(CENTER, CENTER, RADIUS * 0.4, CENTER, CENTER, RADIUS);
    grad.addColorStop(0, `hsl(${angle}, ${saturation}%, ${Math.min(lightness + 30, 95)}%)`);
    grad.addColorStop(1, `hsl(${angle}, ${saturation}%, ${lightness}%)`);
    ctx.beginPath();
    ctx.moveTo(CENTER, CENTER);
    ctx.arc(CENTER, CENTER, RADIUS, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
  }
  // Inner circle (desaturated center)
  const innerGrad = ctx.createRadialGradient(CENTER, CENTER, 0, CENTER, CENTER, RADIUS * 0.35);
  innerGrad.addColorStop(0, `hsl(${baseHue}, 0%, ${lightness}%)`);
  innerGrad.addColorStop(1, `hsl(${baseHue}, 0%, ${lightness}%)`);
  ctx.beginPath();
  ctx.arc(CENTER, CENTER, RADIUS * 0.35, 0, Math.PI * 2);
  ctx.fillStyle = innerGrad;
  ctx.fill();
  // Base hue marker
  const markerAngle = (baseHue - 90) * Math.PI / 180;
  const markerR = RADIUS * 0.7;
  const mx = CENTER + Math.cos(markerAngle) * markerR;
  const my = CENTER + Math.sin(markerAngle) * markerR;
  ctx.beginPath();
  ctx.arc(mx, my, 10, 0, Math.PI * 2);
  ctx.fillStyle = hslToHex(baseHue, saturation, lightness);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.stroke();
  // Harmony markers
  const hues = getHarmonyHues();
  hues.forEach(h => {
    if (h === baseHue) return;
    const a = (h - 90) * Math.PI / 180;
    const r = RADIUS * 0.7;
    const x = CENTER + Math.cos(a) * r;
    const y = CENTER + Math.sin(a) * r;
    ctx.beginPath();
    ctx.arc(x, y, 7, 0, Math.PI * 2);
    ctx.fillStyle = hslToHex(h, saturation, lightness);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  });
  // Lines connecting harmonies
  if (hues.length > 1) {
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    hues.forEach((h, i) => {
      const a = (h - 90) * Math.PI / 180;
      const r = RADIUS * 0.7;
      const x = CENTER + Math.cos(a) * r;
      const y = CENTER + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

// Click wheel to pick hue
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left - CENTER * (rect.width / SIZE);
  const y = e.clientY - rect.top - CENTER * (rect.height / SIZE);
  const dist = Math.sqrt(x*x + y*y) * (SIZE / rect.width);
  if (dist > RADIUS * 0.35 && dist < RADIUS * 1.05) {
    let angle = Math.atan2(y, x) * 180 / Math.PI + 90;
    if (angle < 0) angle += 360;
    baseHue = Math.round(angle) % 360;
    addHistory();
    update();
  }
});

// Get harmony hues
function getHarmonyHues() {
  const h = baseHue;
  switch (currentMode) {
    case 'complementary': return [h, (h + 180) % 360];
    case 'analogous': return [h, (h + 30) % 360, (h - 30 + 360) % 360];
    case 'triadic': return [h, (h + 120) % 360, (h + 240) % 360];
    case 'split-complementary': return [h, (h + 150) % 360, (h + 210) % 360];
    case 'tetradic': return [h, (h + 90) % 360, (h + 180) % 360, (h + 270) % 360];
    case 'monochromatic': return [h, h, h, h, h];
    default: return [h];
  }
}

// Render swatches
function renderSwatches() {
  const hues = getHarmonyHues();
  const swatchDiv = $('swatches');
  swatchDiv.innerHTML = hues.map((h, i) => {
    let s = saturation, l = lightness;
    if (currentMode === 'monochromatic') {
      l = Math.max(10, Math.min(90, lightness - 30 + i * 15));
    }
    const hex = hslToHex(h, s, l);
    const rgb = hslToRgb(h, s, l);
    return `<div class="swatch${i===0?' base':''}" style="background:${hex}" title="${hex}" data-hex="${hex}">
      <span class="swatch-info">${hex}</span>
    </div>`;
  }).join('');

  // Color values text
  const valuesHtml = hues.map((h, i) => {
    let s = saturation, l = lightness;
    if (currentMode === 'monochromatic') l = Math.max(10, Math.min(90, lightness - 30 + i * 15));
    const hex = hslToHex(h, s, l);
    const rgb = hslToRgb(h, s, l);
    return `<div>色${i+1}: HEX ${hex} | RGB rgb(${rgb.join(',')}) | HSL hsl(${h},${s}%,${l}%)</div>`;
  }).join('');
  $('colorValues').innerHTML = valuesHtml;

  swatchDiv.querySelectorAll('.swatch').forEach(el => {
    el.addEventListener('click', () => {
      navigator.clipboard.writeText(el.dataset.hex).then(() => showToast('已复制 ' + el.dataset.hex));
    });
  });
}

// Mode buttons
function renderModes() {
  $('modeButtons').innerHTML = MODES.map(m =>
    `<button class="mode-btn${m.id===currentMode?' active':''}" data-mode="${m.id}">${m.name}</button>`
  ).join('');
  $('modeButtons').querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentMode = btn.dataset.mode;
      renderModes();
      update();
    });
  });
}

// Update
function update() {
  drawWheel();
  renderSwatches();
  $('hexInput').value = hslToHex(baseHue, saturation, lightness);
}

// Sliders
$('satSlider').addEventListener('input', e => { saturation = +e.target.value; $('satVal').textContent = saturation; update(); });
$('lightSlider').addEventListener('input', e => { lightness = +e.target.value; $('lightVal').textContent = lightness; update(); });

// HEX input
$('hexBtn').addEventListener('click', () => {
  const v = $('hexInput').value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(v)) {
    const [h, s, l] = hexToHsl(v);
    baseHue = h; saturation = s; lightness = l;
    $('satSlider').value = s; $('satVal').textContent = s;
    $('lightSlider').value = l; $('lightVal').textContent = l;
    addHistory();
    update();
  } else {
    showToast('请输入有效HEX颜色');
  }
});
$('hexInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('hexBtn').click(); });

// Random
$('randomBtn').addEventListener('click', () => {
  baseHue = Math.floor(Math.random() * 360);
  addHistory();
  update();
  showToast('🎲 已随机选择基础色');
});

// History
function addHistory() {
  const hex = hslToHex(baseHue, saturation, lightness);
  history = history.filter(h => h !== hex);
  history.unshift(hex);
  if (history.length > 10) history = history.slice(0, 10);
  localStorage.setItem('ch-history', JSON.stringify(history));
  renderHistory();
}
function renderHistory() {
  $('history').innerHTML = history.map(hex =>
    `<div class="history-swatch" style="background:${hex}" title="${hex}" data-hex="${hex}"></div>`
  ).join('');
  $('history').querySelectorAll('.history-swatch').forEach(el => {
    el.addEventListener('click', () => {
      const [h, s, l] = hexToHsl(el.dataset.hex);
      baseHue = h; saturation = s; lightness = l;
      $('satSlider').value = s; $('satVal').textContent = s;
      $('lightSlider').value = l; $('lightVal').textContent = l;
      update();
    });
  });
}

// Export CSS
$('cssBtn').addEventListener('click', () => {
  const hues = getHarmonyHues();
  let css = ':root {\n';
  hues.forEach((h, i) => {
    let s = saturation, l = lightness;
    if (currentMode === 'monochromatic') l = Math.max(10, Math.min(90, lightness - 30 + i * 15));
    const hex = hslToHex(h, s, l);
    const name = i === 0 ? 'primary' : `color-${i+1}`;
    css += `  --${name}: ${hex};\n`;
  });
  css += '}';
  navigator.clipboard.writeText(css).then(() => showToast('✅ 已复制CSS变量'));
});

// Export Tailwind
$('twBtn').addEventListener('click', () => {
  const hues = getHarmonyHues();
  let tw = 'module.exports = {\n  theme: {\n    extend: {\n      colors: {\n';
  hues.forEach((h, i) => {
    let s = saturation, l = lightness;
    if (currentMode === 'monochromatic') l = Math.max(10, Math.min(90, lightness - 30 + i * 15));
    const hex = hslToHex(h, s, l);
    const name = i === 0 ? 'primary' : `color${i+1}`;
    tw += `        '${name}': '${hex}',\n`;
  });
  tw += '      },\n    },\n  },\n};';
  navigator.clipboard.writeText(tw).then(() => showToast('✅ 已复制Tailwind配置'));
});

// Init
renderModes();
renderHistory();
update();
</script>
</body>
</html>
