<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP地理定位</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem}.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.search-box{display:flex;gap:8px;max-width:400px;margin:16px auto 0}
.search-box input{flex:1;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.9rem;outline:none}
.search-box button{padding:10px 20px;background:var(--blue);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:.9rem}
.info-card{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px}
.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--text2);font-size:.85rem}
.info-value{font-weight:600;font-size:.9rem}
</style>
</head>
<body>
<div class="container">
<header><h1>🌐 IP地理定位</h1><p class="sub">ip-api.com · IP查询</p></header>
<div class="search-box">
<input type="text" id="searchInput" placeholder="输入IP地址（留空查询本机）" onkeydown="if(event.key==='Enter')lookupIP()">
<button onclick="lookupIP()">查询</button>
</div>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var input=document.getElementById('searchInput');
window.lookupIP=function(){
var ip=input.value.trim();
var url=ip?'http://ip-api.com/json/'+encodeURIComponent(ip)+'?fields=status,message,query,country,regionName,city,zip,lat,lon,isp,org,timezone,continent,countryCode':'http://ip-api.com/json/?fields=status,message,query,country,regionName,city,zip,lat,lon,isp,org,timezone,continent,countryCode';
app.innerHTML='<div style="text-align:center;padding:60px 0;color:var(--text2)"><div class="spinner" style="width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px"></div><p>查询中...</p></div>';
fetch(url)
.then(function(r){return r.json();})
.then(function(data){
if(data.status==='fail'){app.innerHTML='<div style="text-align:center;padding:40px 0;color:var(--text2)"><p>⚠️ '+data.message+'</p></div>';return;}
var html='<div class="info-card">';
var rows=[
{label:'🌐 IP地址',value:data.query},
{label:'🌍 国家',value:data.country+' ('+data.countryCode+')'},
{label:'📍 地区',value:data.regionName},
{label:'🏙️ 城市',value:data.city},
{label:'📮 邮编',value:data.zip},
{label:'📐 经度',value:data.lon},
{label:'📐 纬度',value:data.lat},
{label:'🏢 运营商',value:data.isp},
{label:'🏛️ 组织',value:data.org},
{label:'🕐 时区',value:data.timezone},
{label:'🗺️ 大洲',value:data.continent}
];
rows.forEach(function(r){
html+='<div class="info-row"><span class="info-label">'+r.label+'</span><span class="info-value">'+r.value+'</span></div>';
});
html+='</div>';
app.innerHTML=html;
})
.catch(function(e){
app.innerHTML='<div style="text-align:center;padding:40px 0;color:var(--text2)"><p>⚠️ '+e.message+'</p></div>';
});
};
lookupIP();
})();
</script>
</body>
</html>
