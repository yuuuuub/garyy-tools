<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚛️ 物理模拟器</title>
<meta property="og:title" content="⚛️ 物理模拟器">
<meta property="og:description" content="⚛️ 物理模拟器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="物理模拟器 - 自由落体、抛体运动、弹簧振动、单摆、万有引力等多种物理场景模拟">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚛️</text></svg>">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;line-height:1.4}
.hdr{text-align:center;margin-bottom:16px}.hdr h1{font-size:1.6rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.scene-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.scene-tabs button{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.8rem;transition:all .2s}
.scene-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sim-area{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative}
canvas{display:block;width:100%;cursor:crosshair}
.controls{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
.controls .row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.controls label{font-size:.8rem;color:var(--text2);min-width:80px}
.controls input[type=range]{flex:1;accent-color:var(--accent)}
.controls .val{font-size:.8rem;color:var(--accent);min-width:60px;text-align:right}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.9}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.9}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.info-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:12px;font-size:.8rem;color:var(--text2);line-height:1.6}
.info-box span{color:var(--accent);font-weight:600}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="hdr"><h1>⚛️ 物理模拟器</h1><p>自由落体、抛体运动、弹簧振动、单摆模拟</p></div>
<div class="scene-tabs" id="sceneTabs"></div>
<div class="sim-area"><canvas id="canvas"></canvas></div>
<div class="controls" id="controls"></div>
<div class="info-box" id="infoBox"></div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W,H,running=false,animId=null;
let curScene='freefall';
const scenes=[
{id:'freefall',name:'自由落体',icon:'🍎'},
{id:'projectile',name:'抛体运动',icon:'🚀'},
{id:'spring',name:'弹簧振动',icon:'🔩'},
{id:'pendulum',name:'单摆',icon:'🔔'},
{id:'gravity',name:'万有引力',icon:'🌍'}
];

let sim={};
const g=9.81;

function initCanvas(){
const dpr=window.devicePixelRatio||1;
const rect=canvas.parentElement.getBoundingClientRect();
W=rect.width;H=Math.min(400,window.innerHeight*0.5);
canvas.width=W*dpr;canvas.height=H*dpr;
canvas.style.height=H+'px';
ctx.scale(dpr,dpr);
}

function initTabs(){
document.getElementById('sceneTabs').innerHTML=scenes.map(s=>`<button class="${s.id===curScene?'active':''}" onclick="setScene('${s.id}')">${s.icon} ${s.name}</button>`).join('');
}

function setScene(id){
curScene=id;
initTabs();
stopSim();
initSim();
draw();
}

function initSim(){
if(curScene==='freefall'){
sim={ball:{x:W/2,y:40,r:15,vy:0,color:'#e74c3c'},time:0,started:false,height:200};
document.getElementById('controls').innerHTML=`
<div class="row"><label>初始高度</label><input type="range" min="50" max="350" value="200" oninput="sim.height=+this.value;this.nextElementSibling.textContent=this.value+'px'"><span class="val">200px</span></div>
<div class="row"><label>重力加速度</label><input type="range" min="1" max="30" value="10" step="0.5" oninput="sim.g=+this.value;this.nextElementSibling.textContent=this.value+'m/s²'"><span class="val">10m/s²</span></div>
<div class="btn-row"><button class="btn btn-primary" onclick="startFreefall()">开始下落</button><button class="btn btn-secondary" onclick="stopSim();initSim();draw()">重置</button></div>`;
sim.g=10;
}else if(curScene==='projectile'){
sim={ball:{x:60,y:H-40,r:8,color:'#3498db'},vx:0,vy:0,angle:45,speed:20,started:false,trail:[]};
document.getElementById('controls').innerHTML=`
<div class="row"><label>发射角度</label><input type="range" min="5" max="85" value="45" oninput="sim.angle=+this.value;this.nextElementSibling.textContent=this.value+'°'"><span class="val">45°</span></div>
<div class="row"><label>初速度</label><input type="range" min="5" max="40" value="20" oninput="sim.speed=+this.value;this.nextElementSibling.textContent=this.value+'m/s'"><span class="val">20m/s</span></div>
<div class="btn-row"><button class="btn btn-primary" onclick="launchProjectile()">发射</button><button class="btn btn-secondary" onclick="stopSim();initSim();draw()">重置</button></div>`;
}else if(curScene==='spring'){
sim={block:{x:W/2,y:H/2,r:20,color:'#2ecc71'},k:0.05,damping:0.995,displacement:80,velocity:0,started:false};
document.getElementById('controls').innerHTML=`
<div class="row"><label>弹簧系数k</label><input type="range" min="0.01" max="0.15" value="0.05" step="0.005" oninput="sim.k=+this.value;this.nextElementSibling.textContent=this.value"><span class="val">0.05</span></div>
<div class="row"><label>初始位移</label><input type="range" min="20" max="150" value="80" oninput="sim.displacement=+this.value;sim.block.x=W/2+sim.displacement;this.nextElementSibling.textContent=this.value+'px'"><span class="val">80px</span></div>
<div class="btn-row"><button class="btn btn-primary" onclick="startSpring()">开始振动</button><button class="btn btn-secondary" onclick="stopSim();initSim();draw()">重置</button></div>`;
sim.block.x=W/2+sim.displacement;
}else if(curScene==='pendulum'){
sim={length:150,angle:Math.PI/4,angularVel:0,origin:{x:W/2,y:60},bob:{r:15,color:'#f39c12'},started:false,damping:0.999};
document.getElementById('controls').innerHTML=`
<div class="row"><label>摆长</label><input type="range" min="50" max="250" value="150" oninput="sim.length=+this.value;this.nextElementSibling.textContent=this.value+'px'"><span class="val">150px</span></div>
<div class="row"><label>初始角度</label><input type="range" min="5" max="85" value="45" oninput="sim.angle=this.value*Math.PI/180;this.nextElementSibling.textContent=this.value+'°'"><span class="val">45°</span></div>
<div class="btn-row"><button class="btn btn-primary" onclick="startPendulum()">释放摆球</button><button class="btn btn-secondary" onclick="stopSim();initSim();draw()">重置</button></div>`;
sim.angle=45*Math.PI/180;
}else if(curScene==='gravity'){
sim={bodies:[],adding:true};
sim.bodies=[
{x:W/2,y:H/2,vx:0,vy:0,mass:500,r:20,color:'#f39c12',fixed:true},
{x:W/2+180,y:H/2,vx:0,vy:-2,mass:5,r:6,color:'#3498db',fixed:false}
];
document.getElementById('controls').innerHTML=`
<div class="row"><label>点击添加天体</label><span class="val">拖拽设置速度</span></div>
<div class="btn-row"><button class="btn btn-primary" onclick="sim.adding=!sim.adding;this.textContent=sim.adding?'停止添加':'开始添加'">停止添加</button><button class="btn btn-secondary" onclick="sim.bodies=sim.bodies.slice(0,2);sim.bodies[1].x=W/2+180;sim.bodies[1].y=H/2;sim.bodies[1].vx=0;sim.bodies[1].vy=-2">重置</button></div>`;
}
document.getElementById('infoBox').innerHTML=getInfo();
}

function getInfo(){
const infos={
freefall:'<span>自由落体公式</span>: h = ½gt², v = gt, v² = 2gh<br>忽略空气阻力，所有物体下落加速度相同',
projectile:'<span>抛体运动公式</span>: x = v₀cosθ·t, y = v₀sinθ·t - ½gt²<br>最大射程在45°时取得',
spring:'<span>弹簧振动公式</span>: F = -kx, T = 2π√(m/k)<br>简谐运动，位移随时间呈正弦变化',
pendulum:'<span>单摆周期公式</span>: T = 2π√(L/g)<br>小角度近似下周期与振幅无关',
gravity:'<span>万有引力公式</span>: F = GMm/r²<br>点击画布添加天体，拖拽设置初始速度'
};
return infos[curScene];
}

function draw(){
ctx.clearRect(0,0,W,H);
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
ctx.fillRect(0,0,W,H);
if(curScene==='freefall')drawFreefall();
else if(curScene==='projectile')drawProjectile();
else if(curScene==='spring')drawSpring();
else if(curScene==='pendulum')drawPendulum();
else if(curScene==='gravity')drawGravity();
}

function drawFreefall(){
ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.setLineDash([5,5]);
for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.setLineDash([]);
const b=sim.ball;
ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='12px monospace';
ctx.fillText(`t=${sim.time.toFixed(2)}s  v=${(sim.g*sim.time).toFixed(1)}m/s  h=${(sim.height-b.y+40).toFixed(0)}px`,10,20);
}

function drawProjectile(){
ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.moveTo(0,H-30);ctx.lineTo(W,H-30);ctx.stroke();
if(sim.trail.length>1){ctx.strokeStyle='rgba(52,152,219,0.3)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sim.trail[0][0],sim.trail[0][1]);sim.trail.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.stroke();ctx.lineWidth=1}
if(!sim.started){
const rad=sim.angle*Math.PI/180;
ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.moveTo(60,H-40);ctx.lineTo(60+Math.cos(rad)*50,H-40-Math.sin(rad)*50);ctx.stroke();
}
ctx.fillStyle=sim.ball.color;ctx.beginPath();ctx.arc(sim.ball.x,sim.ball.y,sim.ball.r,0,Math.PI*2);ctx.fill();
ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='12px monospace';
const t=sim.t||0;ctx.fillText(`t=${t.toFixed(2)}s  vx=${sim.vx.toFixed(1)}  vy=${sim.vy.toFixed(1)}`,10,20);
}

function drawSpring(){
const anchor={x:W/2,y:60};
ctx.strokeStyle='#888';ctx.lineWidth=2;
const segs=15;const dx=(sim.block.x-anchor.x)/segs;
ctx.beginPath();ctx.moveTo(anchor.x,anchor.y);
for(let i=1;i<segs;i++){
const x=anchor.x+dx*i;const y=anchor.y+(i%2===1?-8:8);
ctx.lineTo(x,y);
}
ctx.lineTo(sim.block.x,sim.block.y);ctx.stroke();ctx.lineWidth=1;
ctx.fillStyle='#666';ctx.fillRect(anchor.x-15,anchor.y-4,30,8);
ctx.fillStyle=sim.block.color;ctx.fillRect(sim.block.x-sim.block.r,sim.block.y-sim.block.r,sim.block.r*2,sim.block.r*2);
ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(W/2,60);ctx.lineTo(W/2,H-20);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='12px monospace';
ctx.fillText(`x=${sim.displacement.toFixed(1)}px  v=${sim.velocity.toFixed(1)}  F=${(-sim.k*sim.displacement).toFixed(2)}`,10,20);
}

function drawPendulum(){
const bX=sim.origin.x+sim.length*Math.sin(sim.angle);
const bY=sim.origin.y+sim.length*Math.cos(sim.angle);
ctx.strokeStyle='#888';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sim.origin.x,sim.origin.y);ctx.lineTo(bX,bY);ctx.stroke();ctx.lineWidth=1;
ctx.fillStyle='#666';ctx.fillRect(sim.origin.x-20,sim.origin.y-4,40,8);
ctx.fillStyle=sim.bob.color;ctx.beginPath();ctx.arc(bX,bY,sim.bob.r,0,Math.PI*2);ctx.fill();
ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='12px monospace';
ctx.fillText(`θ=${(sim.angle*180/Math.PI).toFixed(1)}°  T≈${(2*Math.PI*Math.sqrt(sim.length/1000/g)).toFixed(2)}s`,10,20);
}

function drawGravity(){
sim.bodies.forEach(b=>{
const grad=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2);
grad.addColorStop(0,b.color);grad.addColorStop(1,'transparent');
ctx.fillStyle=grad;ctx.beginPath();ctx.arc(b.x,b.y,b.r*2,0,Math.PI*2);ctx.fill();
ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
});
ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='12px monospace';
ctx.fillText(`天体数量: ${sim.bodies.length}`,10,20);
}

function startFreefall(){
sim.ball.y=40;sim.time=0;sim.started=true;
function step(){
if(!running)return;
sim.time+=0.02;
sim.ball.y=40+0.5*sim.g*100*sim.time*sim.time;
if(sim.ball.y>H-20){sim.ball.y=H-20;sim.started=false;draw();return}
draw();animId=requestAnimationFrame(step);
}
running=true;step();
}

function launchProjectile(){
const rad=sim.angle*Math.PI/180;
sim.vx=sim.speed*Math.cos(rad);sim.vy=-sim.speed*Math.sin(rad);
sim.ball.x=60;sim.ball.y=H-40;sim.trail=[[60,H-40]];sim.t=0;sim.started=true;
function step(){
if(!running)return;
sim.t+=0.02;
sim.ball.x+=sim.vx*2;sim.ball.y+=sim.vy*2;sim.vy+=g*0.02;
sim.trail.push([sim.ball.x,sim.ball.y]);
if(sim.ball.y>H-30||sim.ball.x>W){sim.started=false;draw();return}
draw();animId=requestAnimationFrame(step);
}
running=true;step();
}

function startSpring(){
sim.started=true;
function step(){
if(!running)return;
const acc=-sim.k*sim.displacement;
sim.velocity+=acc;sim.velocity*=sim.damping;
sim.displacement+=sim.velocity;
sim.block.x=W/2+sim.displacement;
draw();animId=requestAnimationFrame(step);
}
running=true;step();
}

function startPendulum(){
sim.started=true;
function step(){
if(!running)return;
const acc=-(g/1000)*Math.sin(sim.angle)/sim.length*100;
sim.angularVel+=acc*0.02;sim.angularVel*=sim.damping;
sim.angle+=sim.angularVel;
draw();animId=requestAnimationFrame(step);
}
running=true;step();
}

function stepGravity(){
if(!running)return;
const G=0.5;
for(let i=0;i<sim.bodies.length;i++){
if(sim.bodies[i].fixed)continue;
let ax=0,ay=0;
for(let j=0;j<sim.bodies.length;j++){
if(i===j)continue;
const dx=sim.bodies[j].x-sim.bodies[i].x;
const dy=sim.bodies[j].y-sim.bodies[i].y;
const r=Math.sqrt(dx*dx+dy*dy);
if(r<sim.bodies[i].r+sim.bodies[j].r)continue;
const f=G*sim.bodies[j].mass/(r*r);
ax+=f*dx/r;ay+=f*dy/r;
}
sim.bodies[i].vx+=ax*0.1;sim.bodies[i].vy+=ay*0.1;
sim.bodies[i].x+=sim.bodies[i].vx;sim.bodies[i].y+=sim.bodies[i].vy;
}
draw();animId=requestAnimationFrame(step);
}

function stopSim(){
running=false;if(animId)cancelAnimationFrame(animId);animId=null;
}

canvas.addEventListener('click',e=>{
if(curScene!=='gravity'||!sim.adding)return;
const rect=canvas.getBoundingClientRect();
const x=e.clientX-rect.left;const y=e.clientY-rect.top;
sim.bodies.push({x,y,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,mass:Math.random()*10+1,r:Math.random()*5+3,color:`hsl(${Math.random()*360},70%,60%)`,fixed:false});
if(!running){running=true;stepGravity();}
});

window.addEventListener('resize',()=>{initCanvas();draw()});
initCanvas();initTabs();initSim();draw();
</script>
</body>
</html>
