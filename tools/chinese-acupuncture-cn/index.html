<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国针灸推拿百科 - Chinese Acupuncture & Massage Encyclopedia</title>
<meta name="description" content="中国针灸推拿百科，涵盖经络穴位、针灸技法、推拿手法与艾灸养生">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国针灸推拿百科 - Chinese Acupuncture & Massage Encyclopedia">
<meta property="og:description" content="中国针灸推拿百科，涵盖经络穴位、针灸技法、推拿手法与艾灸养生">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-acupuncture-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#5b8c5a;--accent2:#4a7a4a}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#238636;--accent2:#1a7f37}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#0a1510 0%,#142818 50%,#1a3a20 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #2a5a30;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#5b8c5a,#8fc98a,#7a9e6a,#6b9e5a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.acu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.acu-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.acu-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.acu-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.acu-card .a-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.acu-card .a-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(91,140,90,0.15);color:var(--accent)}
.acu-card .a-name{font-size:1.3em;font-weight:bold}
.acu-card .a-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.acu-card .a-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.acu-card .a-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.acu-card .a-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.acu-card .a-detail strong{color:var(--text)}
.acu-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.acu-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>📍 中国针灸推拿百科</h1>
<p>Chinese Acupuncture & Massage Encyclopedia — 探索经络穴位、针灸技法与推拿手法</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索穴位、针灸或推拿...（如"足三里""合谷""艾灸"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部内容</button>
<button class="filter-btn" data-filter="经络系统">🗺️ 经络系统</button>
<button class="filter-btn" data-filter="常用穴位">📍 常用穴位</button>
<button class="filter-btn" data-filter="针灸技法">🪡 针灸技法</button>
<button class="filter-btn" data-filter="推拿手法">🤲 推拿手法</button>
<button class="filter-btn" data-filter="艾灸疗法">🔥 艾灸疗法</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="acu-grid" id="acuGrid"></div>
<footer><p>📍 中国针灸推拿百科 — 一针一灸，调和阴阳</p></footer>
</div>
<script>
const ACU_DATA=[
  {id:1,name:"任脉",en:"Ren Meridian",category:"经络系统",icon:"🗺️",features:"阴脉之海、主一身之阴",history:"任脉是奇经八脉之一，起于胞中，止于下唇。'任'有妊养之意，为阴脉之海。",location:"起于会阴，沿腹部正中线上行至下唇",functions:"调节阴经气血、主生殖、任养胎儿",indication:"月经不调、不孕、遗精、疝气、腹痛",culture:"任脉是人体最重要的阴脉，与督脉一起构成人体阴阳的总纲。"},
  {id:2,name:"督脉",en:"Du Meridian",category:"经络系统",icon:"🗺️",features:"阳脉之海、主一身之阳",history:"督脉是奇经八脉之一，起于胞中，止于上唇。'督'有督促之意，为阳脉之海。",location:"起于会阴，沿脊柱上行至头部",functions:"调节阳经气血、主生殖、主脑髓",indication:"头痛、腰痛、脊强、癫痫、遗精",culture:"督脉是人体最重要的阳脉，与任脉一起构成人体阴阳的总纲。"},
  {id:3,name:"足三里",en:"Zusanli (ST36)",category:"常用穴位",icon:"📍",features:"保健要穴、强壮第一穴",location:"犊鼻下3寸，胫骨前嵴外一横指",functions:"健脾和胃、扶正培元、通经活络",indication:"胃痛、呕吐、腹胀、泄泻、便秘、虚劳、下肢痿痹",needling:"直刺1-2寸，可灸",culture:"足三里是中国民间最常用的保健穴位，'常按足三里，胜吃老母鸡'。"},
  {id:4,name:"合谷穴",en:"Hegu (LI4)",category:"常用穴位",icon:"📍",features:"面口合谷收、止痛要穴",location:"手背第一二掌骨之间，第二掌骨桡侧中点",functions:"疏风解表、通络镇痛、开窍醒神",indication:"头痛、牙痛、面瘫、感冒、咽喉肿痛、手指麻木",needling:"直刺0.5-1寸，孕妇禁针",culture:"合谷是止痛要穴，'面口合谷收'说明其治疗头面部疾病的重要作用。"},
  {id:5,name:"三阴交",en:"Sanyinjiao (SP6)",category:"常用穴位",icon:"📍",features:"妇科要穴、三阴交汇",location:"内踝尖上3寸，胫骨内侧缘后方",functions:"健脾利湿、调经止带、滋补肝肾",indication:"月经不调、痛经、带下、不孕、失眠、消化不良",needling:"直刺1-1.5寸，孕妇禁针",culture:"三阴交是肝、脾、肾三条阴经的交会穴，是治疗妇科疾病的要穴。"},
  {id:6,name:"毫针刺法",en:"Filiform Needle",category:"针灸技法",icon:"🪡",features:"最常用的针灸方法",history:"毫针刺法是针灸最常用的方法，使用不锈钢毫针刺入穴位，通过提插捻转来调节经络气血。",techniques:["进针法","行针法","补泻法","留针法","出针法"],needling_depth:"一般0.5-2寸，因穴位而异",indication:"各种经络脏腑疾病",culture:"毫针刺法是针灸学的核心技术，体现了中医'以针调气'的治疗理念。"},
  {id:7,name:"艾灸疗法",en:"Moxibustion",category:"艾灸疗法",icon:"🔥",features:"温经散寒、扶阳固脱",history:"艾灸是用艾叶制成的艾条或艾柱燃烧后刺激穴位的治疗方法。有数千年历史。",techniques:["温和灸","雀啄灸","回旋灸","隔姜灸","隔蒜灸","隔盐灸","艾炷灸","艾条灸"],indication:"寒证、虚证、痹证、慢性病",culture:"艾灸体现了中医'寒者热之'的治疗原则，是中国传统医学的重要组成部分。"},
  {id:8,name:"推拿手法",en:"Tui Na Massage",category:"推拿手法",icon:"🤲",features:"手法丰富、疗效显著",history:"推拿是中国传统的手法医学，通过各种手法作用于体表穴位和经络，达到治疗和保健的目的。",techniques:["推法","拿法","按法","摩法","揉法","搓法","抖法","拍法"],indication:"颈肩腰腿痛、软组织损伤、内科杂病",culture:"推拿是中医外治法的重要组成部分，体现了中医'以手代针'的治疗理念。"},
  {id:9,name:"拔罐疗法",en:"Cupping Therapy",category:"艾灸疗法",icon:"🔴",features:"活血化瘀、祛风散寒",history:"拔罐是用竹罐、玻璃罐等工具吸附于体表穴位的治疗方法。有数千年历史。",techniques:["留罐法","闪罐法","走罐法","刺络拔罐","药罐法"],indication:"风湿痹痛、腰背酸痛、感冒咳嗽、消化不良",culture:"拔罐是中国传统医学的独特疗法，体现了中医'以罐祛邪'的治疗理念。"},
  {id:10,name:"刮痧疗法",en:"Gua Sha Therapy",category:"推拿手法",icon:"🔵",features:"活血化瘀、排毒养颜",history:"刮痧是用刮痧板在体表反复刮动的治疗方法。通过刮拭使皮肤出现红色粟粒状或暗红色出血点。",techniques:["刮颈项部","刮背部","刮胸部","刮四肢","刮头部","刮腹部"],indication:"感冒、中暑、头痛、颈椎病、腰痛",culture:"刮痧是中国民间常用的保健方法，体现了中医'以刮排毒'的治疗理念。"},
  {id:11,name:"拔罐穴位",en:"Cupping Points",category:"常用穴位",icon:"📍",features:"拔罐常用穴位组合",location:"大椎、肺俞、膏肓、脾俞、肾俞等",functions:"调理脏腑、疏通经络、扶正祛邪",indication:"感冒、咳嗽、哮喘、腰痛、消化不良",culture:"拔罐穴位的选择体现了中医'循经取穴'的治疗原则。"},
  {id:12,name:"耳穴疗法",en:"Auricular Therapy",category:"针灸技法",icon:"👂",features:"全息理论、简便廉验",history:"耳穴疗法是通过刺激耳廓上的穴位来治疗疾病的方法。基于'耳为宗脉之所聚'的理论。",techniques:["耳针","耳穴贴压","耳穴放血","耳穴按摩","耳穴埋豆"],indication:"失眠、头痛、戒烟、减肥、消化不良",culture:"耳穴疗法体现了中医'全息理论'，认为耳廓是人体的缩影。"}
];
function renderCards(data){
  document.getElementById('acuGrid').innerHTML=data.map(a=>`
    <div class="acu-card" data-category="${a.category}">
      <div class="a-header"><div class="a-icon">${a.icon}</div><div><div class="a-name">${a.name}</div><div class="a-sub">${a.en}</div></div></div>
      <div class="a-meta"><span>${a.features}</span></div>
      ${a.location?`<div class="a-detail"><strong>位置：</strong>${a.location}</div>`:''}
      ${a.functions?`<div class="a-detail"><strong>功效：</strong>${a.functions}</div>`:''}
      ${a.indication?`<div class="a-detail"><strong>主治：</strong>${a.indication}</div>`:''}
      ${a.techniques?`<div class="a-detail"><strong>技法：</strong>${a.techniques.join('、')}</div>`:''}
      ${a.needling?`<div class="a-detail"><strong>针法：</strong>${a.needling}</div>`:''}
      ${a.culture?`<div class="a-detail"><strong>文化：</strong>${a.culture}</div>`:''}
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(a=>{cats[a.category]=(cats[a.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">知识点</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.acu-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.acu-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(ACU_DATA);renderStats(ACU_DATA);
</script>
</body>
</html>
