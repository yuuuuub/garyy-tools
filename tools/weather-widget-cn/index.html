<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>天气组件 - garyy-tools</title>
<meta name="description" content="模拟天气组件，支持多城市天气预报和实时天气显示">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;scroll-behavior:smooth}.container{max-width:500px;margin:auto;padding-bottom:50px}header{text-align:center;padding:28px 0 16px}h1{font-size:1.3rem;margin-bottom:4px}.sub{color:var(--text2);font-size:.85rem}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.9rem;width:100%;outline:none;margin-bottom:16px}select:focus{border-color:var(--blue)}.weather-main{text-align:center;padding:20px 0}.weather-icon{font-size:4rem;margin-bottom:8px}.weather-temp{font-size:3.5rem;font-weight:700}.weather-desc{font-size:1.1rem;color:var(--text2);margin-top:4px}.weather-details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.detail-item{text-align:center;padding:12px 0;background:var(--bg);border-radius:8px}.detail-item .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.detail-item .value{font-size:1.1rem;font-weight:600}.forecast{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:8px}.forecast-day{flex:1;min-width:60px;text-align:center;padding:12px 8px;background:var(--bg);border-radius:8px;font-size:.8rem}.forecast-day .day-name{color:var(--text2);margin-bottom:6px}.forecast-day .day-icon{font-size:1.5rem;margin-bottom:4px}.forecast-day .day-temp{font-weight:600}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="天气组件 - garyy-tools">
<meta property="og:description" content="模拟天气组件，支持多城市天气预报和实时天气显示">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>🌤 天气组件</h1>
<div class="sub">多城市天气预报 · 实时天气</div>
</header>
<div class="card">
<select id="citySelect">
<option value="beijing">北京</option>
<option value="shanghai">上海</option>
<option value="guangzhou">广州</option>
<option value="shenzhen">深圳</option>
<option value="hangzhou">杭州</option>
<option value="chengdu">成都</option>
<option value="wuhan">武汉</option>
<option value="xian">西安</option>
</select>
<div class="weather-main">
<div class="weather-icon" id="wIcon">☀️</div>
<div class="weather-temp" id="wTemp">26°</div>
<div class="weather-desc" id="wDesc">晴</div>
</div>
<div class="weather-details">
<div class="detail-item"><div class="label">湿度</div><div class="value" id="wHumidity">45%</div></div>
<div class="detail-item"><div class="label">风速</div><div class="value" id="wWind">12km/h</div></div>
<div class="detail-item"><div class="label">紫外线</div><div class="value" id="wUV">中等</div></div>
</div>
</div>
<div class="card">
<div style="font-weight:600;margin-bottom:12px">7日预报</div>
<div class="forecast" id="forecast"></div>
</div>
</div>
<script>
(function(){
'use strict';
const weatherDB={
beijing:{city:'北京',icon:'☀️',temp:26,desc:'晴',humidity:'45%',wind:'12km/h',uv:'中等'},
shanghai:{city:'上海',icon:'⛅',temp:24,desc:'多云',humidity:'65%',wind:'18km/h',uv:'强'},
guangzhou:{city:'广州',icon:'🌧',temp:29,desc:'阵雨',humidity:'80%',wind:'8km/h',uv:'弱'},
shenzhen:{city:'深圳',icon:'🌤',temp:28,desc:'晴间多云',humidity:'70%',wind:'15km/h',uv:'强'},
hangzhou:{city:'杭州',icon:'☁️',temp:22,desc:'阴',humidity:'55%',wind:'10km/h',uv:'弱'},
chengdu:{city:'成都',icon:'🌫',temp:20,desc:'雾',humidity:'75%',wind:'5km/h',uv:'弱'},
wuhan:{city:'武汉',icon:'⛅',temp:25,desc:'多云',humidity:'60%',wind:'14km/h',uv:'中等'},
xian:{city:'西安',icon:'☀️',temp:27,desc:'晴',humidity:'35%',wind:'20km/h',uv:'很强'}
};
const icons=['☀️','⛅','🌤','☁️','🌧','⛈','🌫','🌨'];
function render(city){
const w=weatherDB[city];
document.getElementById('wIcon').textContent=w.icon;
document.getElementById('wTemp').textContent=w.temp+'°';
document.getElementById('wDesc').textContent=w.desc;
document.getElementById('wHumidity').textContent=w.humidity;
document.getElementById('wWind').textContent=w.wind;
document.getElementById('wUV').textContent=w.uv;
const days=['周日','周一','周二','周三','周四','周五','周六'];
const today=new Date().getDay();
let html='';
for(let i=0;i<7;i++){
const d=(today+i)%7;
const tempVar=Math.round(w.temp+(Math.random()-0.5)*8);
const icon=icons[Math.floor(Math.random()*icons.length)];
html+='<div class="forecast-day"><div class="day-name">'+(i===0?'今天':days[d])+'</div><div class="day-icon">'+icon+'</div><div class="day-temp">'+tempVar+'°</div></div>';
}
document.getElementById('forecast').innerHTML=html;
}
document.getElementById('citySelect').onchange=function(){render(this.value);};
render('beijing');
})();
</script>
</body>
</html>
