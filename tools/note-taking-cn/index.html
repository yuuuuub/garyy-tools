<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 中文笔记工具</title>
<meta name="description" content="在线笔记工具，支持富文本编辑、文件夹分类、标签管理、搜索和导出功能">
<meta name="robots" content="index, follow">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
button{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical}
label{display:block;font-size:.85rem;color:var(--text2);margin:8px 0 4px}
.sidebar{width:260px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:12px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.sidebar-header input{flex:1;min-width:120px;padding:6px 10px;font-size:.85rem}
.folder-item{padding:10px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .15s;border-bottom:1px solid var(--border)}
.folder-item:hover{background:var(--bg)}
.folder-item.active{background:var(--accent);color:#fff}
.folder-item .count{font-size:.75rem;background:var(--bg);padding:2px 8px;border-radius:10px}
.note-list{flex:1;overflow-y:auto}
.note-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.note-item:hover{background:rgba(59,130,246,.05)}
.note-item.active{background:rgba(59,130,246,.1);border-left:3px solid var(--accent)}
.note-item .title{font-weight:600;font-size:.9rem;margin-bottom:4px}
.note-item .preview{font-size:.8rem;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item .meta{font-size:.7rem;color:var(--text2);margin-top:4px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.toolbar{padding:8px 16px;background:var(--card);border-bottom:1px solid var(--border);display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.toolbar button{padding:6px 10px;font-size:.85rem;min-width:32px}
.toolbar .sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.editor{flex:1;padding:24px;overflow-y:auto;min-height:300px}
.editor[contenteditable]{outline:none;line-height:1.8}
.editor:empty::before{content:attr(data-placeholder);color:var(--text2)}
.tag-list{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;cursor:pointer}
.tag:hover{opacity:.8}
.empty{text-align:center;padding:40px;color:var(--text2)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:400px}
.hidden{display:none}
@media(max-width:768px){.sidebar{width:100%;max-height:40vh}.main{min-height:60vh}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1 style="position:fixed;top:6px;left:80px;z-index:999;font-size:1rem;pointer-events:none">📝 中文笔记工具</h1>

<div style="display:flex;height:100vh;padding-top:30px">
<div class="sidebar">
<div class="sidebar-header">
<input type="text" id="search-input" placeholder="搜索笔记..." oninput="filterNotes()">
<button onclick="createFolder()" style="padding:6px 10px;font-size:.8rem">+ 新建</button>
</div>
<div style="padding:8px 12px;border-bottom:1px solid var(--border)">
<select id="folder-select" onchange="selectFolder(this.value)" style="padding:6px 10px;font-size:.85rem"></select>
</div>
<div class="note-list" id="note-list"></div>
</div>
<div class="main">
<div class="toolbar">
<button onclick="execCmd('bold')" title="加粗"><b>B</b></button>
<button onclick="execCmd('italic')" title="斜体"><i>I</i></button>
<button onclick="execCmd('underline')" title="下划线"><u>U</u></button>
<div class="sep"></div>
<button onclick="execBlock('h1')" title="标题1">H1</button>
<button onclick="execBlock('h2')" title="标题2">H2</button>
<button onclick="execBlock('h3')" title="标题3">H3</button>
<div class="sep"></div>
<button onclick="execCmd('insertUnorderedList')" title="无序列表">•≡</button>
<button onclick="execCmd('insertOrderedList')" title="有序列表">1≡</button>
<button onclick="execBlock('pre')" title="代码块">&lt;/&gt;</button>
<button onclick="execBlock('blockquote')" title="引用">❝</button>
<div class="sep"></div>
<button onclick="togglePin()" id="pin-btn" title="置顶">📌</button>
<button onclick="exportNote()" title="导出">💾</button>
<button class="dng" onclick="deleteNote()" title="删除">🗑️</button>
<div style="flex:1"></div>
<span id="word-count" style="font-size:.8rem;color:var(--text2)">0 字</span>
</div>
<div class="tag-list" id="tag-list"></div>
<div class="editor" id="editor" contenteditable="true" data-placeholder="开始输入笔记内容..." oninput="onEditorInput()"></div>
</div>
</div>

<div class="modal-overlay hidden" id="folder-modal">
<div class="modal">
<h2 id="folder-modal-title">新建文件夹</h2>
<label>文件夹名称</label>
<input type="text" id="folder-name-input" placeholder="输入文件夹名称">
<div style="margin-top:16px;display:flex;gap:8px">
<button onclick="saveFolder()">保存</button>
<button class="sec" onclick="closeModal('folder-modal')">取消</button>
</div>
</div>
</div>

<script>
const STORAGE_KEY='note_taking_data';
let data={notes:[],folders:['默认'],currentFolder:'默认',currentNote:null,editingFolder:null};

function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY));if(d)data={...data,...d}}catch(e){}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}

function init(){
load();
renderFolders();renderNoteList();
if(data.notes.length)selectNote(data.notes[0].id);
}

function createFolder(){data.editingFolder=null;document.getElementById('folder-modal-title').textContent='新建文件夹';document.getElementById('folder-name-input').value='';document.getElementById('folder-modal').classList.remove('hidden');document.getElementById('folder-name-input').focus()}
function saveFolder(){const name=document.getElementById('folder-name-input').value.trim();if(!name)return;if(data.editingFolder){const idx=data.folders.indexOf(data.editingFolder);if(idx>=0)data.folders[idx]=name;data.notes.forEach(n=>{if(n.folder===data.editingFolder)n.folder=name});data.currentFolder=name}else{if(!data.folders.includes(name))data.folders.push(name);data.currentFolder=name}save();closeModal('folder-modal');renderFolders();renderNoteList();selectFolder(data.currentFolder)}
function deleteFolder(folder){if(folder==='默认')return;if(!confirm(`删除文件夹"${folder}"？笔记将移至默认`))return;data.notes.forEach(n=>{if(n.folder===folder)n.folder='默认'});data.folders=data.folders.filter(f=>f!==folder);data.currentFolder='默认';save();renderFolders();renderNoteList();selectFolder('默认')}

function renderFolders(){
const sel=document.getElementById('folder-select');
sel.innerHTML=data.folders.map(f=>`<option value="${f}" ${f===data.currentFolder?'selected':''}>${f}</option>`).join('');
}

function selectFolder(f){data.currentFolder=f;renderNoteList()}

function createNote(){
const note={id:Date.now(),title:'新建笔记',content:'',folder:data.currentFolder,tags:[],pinned:false,created:Date.now(),updated:Date.now()};
data.notes.unshift(note);data.currentNote=note.id;save();renderNoteList();selectNote(note.id);
}

function renderNoteList(){
const q=document.getElementById('search-input').value.toLowerCase();
const el=document.getElementById('note-list');
let notes=data.notes.filter(n=>n.folder===data.currentFolder);
if(q)notes=notes.filter(n=>n.title.toLowerCase().includes(q)||n.content.toLowerCase().includes(q)||n.tags.some(t=>t.includes(q)));
notes.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.updated-a.updated));
if(!notes.length){el.innerHTML='<div class="empty">暂无笔记，点击"+ 新建"创建</div>';return}
el.innerHTML=notes.map(n=>`<div class="note-item ${n.id===data.currentNote?'active':''}" onclick="selectNote(${n.id})"><div class="title">${n.pinned?'📌 ':''}${n.title||'无标题'}</div><div class="preview">${n.content.replace(/<[^>]+>/g,'').substring(0,60)||'空笔记'}</div><div class="meta">${new Date(n.updated).toLocaleDateString('zh-CN')} · ${n.tags.map(t=>'#'+t).join(' ')}</div></div>`).join('');
}

function selectNote(id){
data.currentNote=id;
const note=data.notes.find(n=>n.id===id);
if(!note)return;
document.getElementById('editor').innerHTML=note.content;
document.getElementById('tag-list').innerHTML=note.tags.map(t=>`<span class="tag" onclick="removeTag('${t}')">${t} ×</span>`).join('')+'<span class="tag" onclick="addTag()" style="background:var(--border)">+ 标签</span>';
document.getElementById('pin-btn').textContent=note.pinned?'📌':'📌';
document.getElementById('pin-btn').style.opacity=note.pinned?1:.5;
updateWordCount();
renderNoteList();
}

function onEditorInput(){
const note=data.notes.find(n=>n.id===data.currentNote);
if(!note)return;
note.content=document.getElementById('editor').innerHTML;
note.updated=Date.now();
if(!note.title||note.title==='新建笔记'){const text=note.content.replace(/<[^>]+>/g,'').substring(0,20);if(text)note.title=text}
updateWordCount();save();
}

function updateWordCount(){
const text=document.getElementById('editor').innerText;
document.getElementById('word-count').textContent=text.trim().length+' 字';
}

function execCmd(cmd){document.execCommand(cmd,false,null);document.getElementById('editor').focus()}
function execBlock(tag){
const sel=window.getSelection();
if(!sel.rangeCount)return;
const range=sel.getRangeAt(0);
const html=sel.toString()?`<${tag}>${sel.toString()}</${tag}>`:`<${tag}></${tag}>`;
document.execCommand('insertHTML',false,html);
}

function togglePin(){
const note=data.notes.find(n=>n.id===data.currentNote);
if(!note)return;
note.pinned=!note.pinned;save();selectNote(note.id);
}

function deleteNote(){
if(!data.currentNote)return;
if(!confirm('确定删除此笔记？'))return;
data.notes=data.notes.filter(n=>n.id!==data.currentNote);
data.currentNote=data.notes.length?data.notes[0].id:null;
save();renderNoteList();
if(data.currentNote)selectNote(data.currentNote);
else{document.getElementById('editor').innerHTML='';document.getElementById('tag-list').innerHTML=''}
}

function addTag(){
const tag=prompt('输入标签名称:');
if(!tag||!tag.trim())return;
const note=data.notes.find(n=>n.id===data.currentNote);
if(!note)return;
if(!note.tags.includes(tag.trim())){note.tags.push(tag.trim());save();selectNote(note.id)}
}

function removeTag(tag){
const note=data.notes.find(n=>n.id===data.currentNote);
if(!note)return;
note.tags=note.tags.filter(t=>t!==tag);save();selectNote(note.id);
}

function exportNote(){
const note=data.notes.find(n=>n.id===data.currentNote);
if(!note)return;
const text=note.title+'\n\n'+note.content.replace(/<[^>]+>/g,'\n').replace(/\n{3,}/g,'\n\n');
const blob=new Blob([text],{type:'text/plain'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${note.title||'笔记'}.txt`;a.click();
}

function filterNotes(){renderNoteList()}

function closeModal(id){document.getElementById(id).classList.add('hidden')}

document.getElementById('editor').addEventListener('keydown',e=>{
if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ')}
});

init();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
