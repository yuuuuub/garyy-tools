<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 植物养护</title>
<meta property="og:title" content="🌱 植物养护">
<meta property="og:description" content="🌱 植物养护 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="记录植物养护日志，追踪浇水和施肥提醒">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1}.ctn{padding:0}}
.li{padding:14px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.gr .st{text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;color:#fff;margin-right:4px}
.tag.indoor{background:var(--success)}.tag.outdoor{background:var(--accent)}.tag.succulent{background:var(--warn)}
.need-water{border-left:3px solid var(--accent);background:rgba(59,130,246,.05)}
.need-fertilize{border-left:3px solid var(--warn);background:rgba(245,158,11,.05)}
.action-btn{padding:6px 14px;font-size:.85rem;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;cursor:pointer;transition:all .2s}
.action-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🌱 植物养护</h1><p>照顾你的绿色伙伴</p></div>

<div class="gr">
<div class="st"><div class="nm" id="sTotal">0</div><div class="lb">总植物</div></div>
<div class="st"><div class="nm" id="sNeedWater">0</div><div class="lb">需要浇水</div></div>
<div class="st"><div class="nm" id="sNeedFert">0</div><div class="lb">需要施肥</div></div>
<div class="st"><div class="nm" id="sHealthy">0</div><div class="lb">状态良好</div></div>
</div>

<div class="cd" style="margin-top:16px"><h2>添加植物</h2>
<div class="fr">
<div><label>植物名称</label><input type="text" id="plName" placeholder="如：绿萝"></div>
<div><label>品种</label><input type="text" id="plSpecies" placeholder="可选"></div>
</div>
<div class="fr">
<div><label>位置</label><select id="plLocation"><option value="indoor">室内</option><option value="outdoor">室外</option><option value="succulent">多肉</option></select></div>
<div><label>浇水间隔(天)</label><input type="number" id="plWaterDays" placeholder="7" min="1"></div>
</div>
<div class="fr">
<div><label>施肥间隔(天)</label><input type="number" id="plFertDays" placeholder="30" min="1"></div>
<div><label>购入日期</label><input type="date" id="plBought"></div>
</div>
<label>备注</label><textarea id="plNote" placeholder="养护心得..."></textarea>
<div class="bg"><button onclick="addPlant()">添加植物</button></div>
<div id="plMsg" style="display:none;text-align:center;padding:8px;border-radius:8px;margin-top:8px;font-size:.85rem"></div></div>

<div class="cd"><h2>我的植物</h2>
<div id="plantList" class="es">暂无植物</div>
</div>
</div>

<script>
let plants=JSON.parse(localStorage.getItem('plantCareCn')||'[]');
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function save(){localStorage.setItem('plantCareCn',JSON.stringify(plants))}
function showMsg(m,t){const e=$('plMsg');e.textContent=m;e.style.display='block';e.style.background=t==='error'?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)';e.style.color=t==='error'?'var(--danger)':'var(--success)';setTimeout(()=>e.style.display='none',2000)}
function today(){return new Date().toISOString().slice(0,10)}
function daysSince(d){if(!d)return 999;return Math.floor((new Date()-new Date(d))/(1000*60*60*24))}
function addPlant(){const name=$('plName').value.trim(),species=$('plSpecies').value.trim(),location=$('plLocation').value,waterDays=parseInt($('plWaterDays').value)||7,fertDays=parseInt($('plFertDays').value)||30,bought=$('plBought').value,note=$('plNote').value.trim();if(!name){showMsg('请填写植物名称','error');return}plants.push({name,species,location,waterDays,fertDays,bought,note,lastWatered:today(),lastFertilized:today(),addedAt:Date.now()});save();render();showMsg('植物已添加','success');['plName','plSpecies','plWaterDays','plFertDays','plNote'].forEach(id=>$(id).value='')}
function water(i){plants[i].lastWatered=today();save();render()}
function fertilize(i){plants[i].lastFertilized=today();save();render()}
function removePlant(i){if(!confirm('确认删除？'))return;plants.splice(i,1);save();render()}
function render(){const now=new Date();let needWater=0,needFert=0,healthy=0;const locMap={indoor:'室内',outdoor:'室外',succulent:'多肉'};$('plantList').innerHTML=plants.length?plants.map((p,i)=>{const waterDays=daysSince(p.lastWatered);const fertDays=daysSince(p.lastFertilized);const needsW=waterDays>=p.waterDays;const needsF=fertDays>=p.fertDays;if(needsW)needWater++;if(needsF)needFert++;if(!needsW&&!needsF)healthy++;const waterPct=Math.min(100,waterDays/p.waterDays*100);const fertPct=Math.min(100,fertDays/p.fertDays*100);return '<div class="li'+(needsW?' need-water':'')+(needsF?' need-fertilize':'')+'"><div style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-size:1.2rem">🌿</span> <span style="font-weight:600">'+esc(p.name)+'</span>'+(p.species?' <span style="color:var(--text2)">('+esc(p.species)+')</span>':'')+'<br><span class="tag '+p.location+'">'+locMap[p.location]+'</span>'+(p.bought?'<span style="color:var(--text2);font-size:.8rem;margin-left:4px">购于 '+p.bought+'</span>':'')+'</div></div><div style="margin-top:10px"><div style="font-size:.8rem;color:var(--text2);margin-bottom:2px">💧 上次浇水: '+p.lastWatered+' ('+waterDays+'天前)</div><div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div style="height:100%;background:'+(needsW?'var(--accent)':'var(--success)')+';border-radius:3px;width:'+waterPct+'%"></div></div>'+(needsW?'<div style="color:var(--accent);font-size:.75rem;margin-top:2px">需要浇水!</div>':'')+'<div style="font-size:.8rem;color:var(--text2);margin:6px 0 2px">🧪 上次施肥: '+p.lastFertilized+' ('+fertDays+'天前)</div><div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div style="height:100%;background:'+(needsF?'var(--warn)':'var(--success)')+';border-radius:3px;width:'+fertPct+'%"></div></div>'+(needsF?'<div style="color:var(--warn);font-size:.75rem;margin-top:2px">需要施肥!</div>':'')+'</div>'+(p.note?'<div style="font-size:.85rem;color:var(--text2);margin-top:6px">'+esc(p.note)+'</div>':'')+'<div class="bg" style="margin-top:8px"><button class="action-btn" onclick="water('+i+')">💧 浇水</button><button class="action-btn" onclick="fertilize('+i+')">🧪 施肥</button><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="removePlant('+i+')">删除</button></div></div>'}).join(''):'<div class="es">暂无植物，添加一株吧!</div>';$('sTotal').textContent=plants.length;$('sNeedWater').textContent=needWater;$('sNeedFert').textContent=needFert;$('sHealthy').textContent=healthy}
$('plBought').value=today();
render()
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
