<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 项目指标</title>
<meta name="description" content="项目管理指标工具，追踪项目进度、工时和质量数据">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--purple:#7c3aed}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:1000px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
input[type=text],input[type=number],input[type=date]{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
input:focus{outline:none;border-color:var(--accent)}
select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;width:100%;margin-bottom:8px}
.project-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ptab{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:.85rem;transition:all .2s}
.ptab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat-card{text-align:center;padding:14px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-card .num{font-size:1.5rem;font-weight:700}
.stat-card .lbl{font-size:.75rem;color:var(--text2);margin-top:2px}
.task-list{margin-top:12px}
.task-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;transition:all .2s}
.task-row:hover{border-color:var(--accent)}
.task-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--green)}
.task-row .task-title{flex:1;font-size:.9rem}
.task-row .task-title input{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:.9rem;width:100%}
.task-row .task-assignee{width:80px}
.task-row .task-assignee select{margin:0;padding:4px 8px;font-size:.8rem;width:80px}
.task-row .task-hours{width:60px}
.task-row .task-hours input{width:60px;margin:0;padding:4px 8px;font-size:.8rem}
.task-row .task-priority{width:60px}
.task-row .task-priority select{margin:0;padding:4px 8px;font-size:.8rem;width:70px}
.task-row .task-delete{padding:2px 6px;font-size:.75rem}
.gantt-bar{height:16px;border-radius:4px;margin-top:4px;transition:width .3s}
.burndown{position:relative;height:200px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg)}
.burndown canvas{width:100%;height:100%}
.hidden{display:none}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr)}.task-row{flex-wrap:wrap}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📦 项目指标">
<meta property="og:description" content="项目管理指标工具，追踪项目进度、工时和质量数据">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='proj_metrics';
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{
  projects:['商城小程序','管理后台','API网关'],
  currentProject:0,
  members:['张三','李四','王五'],
  tasks:[
    {title:'用户登录模块',project:0,assignee:'张三',hours:16,priority:'high',done:true,plannedHours:20},
    {title:'商品列表页',project:0,assignee:'李四',hours:24,priority:'high',done:false,plannedHours:30},
    {title:'购物车功能',project:0,assignee:'王五',hours:12,priority:'mid',done:false,plannedHours:20},
    {title:'后台首页',project:1,assignee:'张三',hours:8,priority:'low',done:true,plannedHours:10},
    {title:'API网关搭建',project:2,assignee:'王五',hours:32,priority:'high',done:true,plannedHours:40}
  ],
  burndownData:[100,85,72,60,50,38,25,15,5,0]
};
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function getProjectTasks(){return state.tasks.filter(t=>t.project===state.currentProject)}
function addTask(){state.tasks.push({title:'新任务',project:state.currentProject,assignee:state.members[0]||'',hours:0,priority:'mid',done:false,plannedHours:8});save();render()}
function removeTask(i){state.tasks.splice(i,1);save();render()}
function addProject(){const name=prompt('输入项目名称:');if(name&&name.trim()){state.projects.push(name.trim());state.currentProject=state.projects.length-1;save();render()}}
function removeProject(){if(state.projects.length<=1)return;if(!confirm('确定删除该项目?'))return;state.tasks=state.tasks.filter(t=>t.project!==state.currentProject);state.projects.splice(state.currentProject,1);state.currentProject=Math.min(state.currentProject,state.projects.length-1);save();render()}
function addMember(){const name=prompt('输入成员姓名:');if(name&&name.trim()){state.members.push(name.trim());save();render()}}
function getCompletion(){const tasks=getProjectTasks();if(!tasks.length)return 0;return Math.round(tasks.filter(t=>t.done).length/tasks.length*100)}
function getTotalHours(){return getProjectTasks().reduce((s,t)=>s+t.hours,0)}
function getPlannedHours(){return getProjectTasks().reduce((s,t)=>s+t.plannedHours,0)}
function getBugCount(){return Math.floor(Math.random()*5)}
function exportData(){const tasks=getProjectTasks();let txt=`${state.projects[state.currentProject]} 项目指标\n`+'='.repeat(40)+'\n\n';txt+=`完成率: ${getCompletion()}%\n总工时: ${getTotalHours()}h / ${getPlannedHours()}h\n任务数: ${tasks.length}\n已完成: ${tasks.filter(t=>t.done).length}\n\n任务明细:\n`;tasks.forEach(t=>{txt+=`  ${t.done?'✓':'○'} ${t.title} | ${t.assignee} | ${t.hours}h/${t.plannedHours}h | ${t.priority}\n`});const blob=new Blob([txt],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='项目指标.txt';a.click()}
function render(){
  const tasks=getProjectTasks();
  const completion=getCompletion();
  const totalH=getTotalHours();
  const plannedH=getPlannedHours();
  const doneCount=tasks.filter(t=>t.done).length;
  let h=`<div class="hdr"><h1>📦 项目指标</h1><p>项目进度与质量追踪</p></div>`;
  h+=`<div class="cd"><div class="project-tabs">`;
  state.projects.forEach((p,i)=>{h+=`<div class="ptab${state.currentProject===i?' active':''}" onclick="state.currentProject=${i};save();render()">${p}</div>`});
  h+=`<div class="ptab" onclick="addProject()">+</div></div>`;
  h+=`<div class="stats-grid">`;
  h+=`<div class="stat-card"><div class="num" style="color:${completion>=80?'var(--green)':completion>=50?'var(--yellow)':'var(--red)'}">${completion}%</div><div class="lbl">完成率</div></div>`;
  h+=`<div class="stat-card"><div class="num" style="color:var(--accent)">${tasks.length}</div><div class="lbl">总任务</div></div>`;
  h+=`<div class="stat-card"><div class="num" style="color:var(--green)">${doneCount}</div><div class="lbl">已完成</div></div>`;
  h+=`<div class="stat-card"><div class="num" style="color:var(--yellow)">${totalH}h</div><div class="lbl">实际工时</div></div>`;
  h+=`<div class="stat-card"><div class="num" style="color:var(--text2)">${plannedH}h</div><div class="lbl">计划工时</div></div>`;
  const efficiency=plannedH?Math.round((1-Math.abs(totalH-plannedH)/plannedH)*100):0;
  h+=`<div class="stat-card"><div class="num" style="color:${efficiency>=90?'var(--green)':efficiency>=70?'var(--yellow)':'var(--red)'}">${efficiency}%</div><div class="lbl">工时效率</div></div></div>`;
  h+=`<div class="bg"><button class="sec" onclick="removeProject()" style="font-size:.8rem;padding:4px 12px">删除项目</button><button class="sec" onclick="addMember()" style="font-size:.8rem;padding:4px 12px">+ 成员</button><button class="sec" onclick="exportData()" style="font-size:.8rem;padding:4px 12px">导出</button></div></div>`;
  h+=`<div class="cd"><h2>📋 任务列表 <button class="sec" style="font-size:.75rem;padding:3px 10px;margin-left:6px" onclick="addTask()">+ 任务</button></h2>`;
  h+=`<div class="task-list">`;
  tasks.forEach((t,i)=>{const origIdx=state.tasks.indexOf(t);const barColor=t.done?'var(--green)':t.priority==='high'?'var(--red)':t.priority==='mid'?'var(--yellow)':'var(--accent)';
    h+=`<div class="task-row"><input type="checkbox"${t.done?' checked':''} onchange="state.tasks[${origIdx}].done=this.checked;save();render()">`;
    h+=`<div class="task-title"><input value="${t.title}" onchange="state.tasks[${origIdx}].title=this.value;save()"></div>`;
    h+=`<div class="task-assignee"><select onchange="state.tasks[${origIdx}].assignee=this.value;save()">${state.members.map(m=>`<option${t.assignee===m?' selected':''}>${m}</option>`).join('')}</select></div>`;
    h+=`<div class="task-hours"><input type="number" value="${t.hours}" onchange="state.tasks[${origIdx}].hours=+this.value;save()" placeholder="h" style="width:50px;margin:0"></div>`;
    h+=`<div style="width:50px;font-size:.8rem;color:var(--text2)">/ ${t.plannedHours}h</div>`;
    h+=`<div class="task-priority"><select onchange="state.tasks[${origIdx}].priority=this.value;save();render()" style="width:60px;margin:0"><option value="high"${t.priority==='high'?' selected':''}>高</option><option value="mid"${t.priority==='mid'?' selected':''}>中</option><option value="low"${t.priority==='low'?' selected':''}>低</option></select></div>`;
    h+=`<button class="sec task-delete" onclick="removeTask(${origIdx})">✕</button></div>`});
  h+=`</div></div>`;
  h+=`<div class="cd"><h2>📉 燃尽图</h2><div class="burndown"><canvas id="burndownCanvas"></canvas></div></div>`;
  $('app').innerHTML=h;
  setTimeout(drawBurndown,100);
}
function drawBurndown(){
  const canvas=$('burndownCanvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width;canvas.height=rect.height;
  const data=state.burndownData;
  const w=canvas.width,h=canvas.height;
  const pad={top:20,right:20,bottom:30,left:40};
  const plotW=w-pad.left-pad.right;const plotH=h-pad.top-pad.bottom;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='var(--border)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad.left,pad.top);ctx.lineTo(pad.left,h-pad.bottom);ctx.lineTo(w-pad.right,h-pad.bottom);ctx.stroke();
  ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';
  for(let i=0;i<=4;i++){const y=pad.top+plotH*(i/4);const val=Math.round(100-i*25);ctx.fillText(val,pad.left-30,y+4);ctx.strokeStyle='rgba(48,54,61,0.5)';ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(w-pad.right,y);ctx.stroke()}
  const ideal=[];for(let i=0;i<data.length;i++)ideal.push(100-i*(100/(data.length-1)));
  ctx.strokeStyle='rgba(139,148,158,0.4)';ctx.setLineDash([4,4]);ctx.beginPath();
  ideal.forEach((v,i)=>{const x=pad.left+i*(plotW/(data.length-1));const y=pad.top+plotH*(1-v/100);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();ctx.setLineDash([]);
  const grad=ctx.createLinearGradient(0,pad.top,0,h-pad.bottom);grad.addColorStop(0,'rgba(59,130,246,0.3)');grad.addColorStop(1,'rgba(59,130,246,0.05)');
  ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(pad.left,h-pad.bottom);
  data.forEach((v,i)=>{const x=pad.left+i*(plotW/(data.length-1));const y=pad.top+plotH*(1-v/100);ctx.lineTo(x,y)});
  ctx.lineTo(pad.left+(data.length-1)*(plotW/(data.length-1)),h-pad.bottom);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.beginPath();
  data.forEach((v,i)=>{const x=pad.left+i*(plotW/(data.length-1));const y=pad.top+plotH*(1-v/100);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();
  data.forEach((v,i)=>{const x=pad.left+i*(plotW/(data.length-1));const y=pad.top+plotH*(1-v/100);ctx.fillStyle='#3b82f6';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()});
}
render();
</script>
</body>
</html>
