<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动漫搜索</title>
<meta name="description" content="动漫搜索 - 动漫番剧信息查询">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16pxscroll-behavior:smooth;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem}.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.search-box{display:flex;gap:8px;max-width:400px;margin:16px auto 0}
.search-box input{flex:1;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.9rem;outline:none}
.search-box button{padding:10px 20px;background:var(--blue);border:none;border-radius:10px;color:var(--text);cursor:pointer;font-size:.9rem}
.loading{text-align:center;padding:60px 0}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:40px 0;color:var(--red)}
.anime-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:10px;display:flex;gap:16px}
.anime-img{width:100px;height:140px;object-fit:cover;border-radius:8px;flex-shrink:0}
.anime-info{flex:1}
.anime-title{font-size:1rem;font-weight:600}
.anime-title-cn{font-size:.85rem;color:var(--blue);margin-top:2px}
.anime-meta{font-size:.78rem;color:var(--text2);margin-top:8px}
.anime-synopsis{font-size:.82rem;color:var(--text2);margin-top:8px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.quick-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.quick-btn{padding:5px 10px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.78rem}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);outline:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="动漫搜索">
  <meta property="og:description" content="动漫搜索 - 动漫番剧信息查询">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/anime-search/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>🎬 动漫搜索</h1><p class="sub">支持中文名搜索 · Jikan API</p></header>
<div class="search-box">
<input type="text" id="searchInput" placeholder="输入动漫名称，如 龙珠、火影忍者" title="Enter键搜索" onkeydown="if(event.key==='Enter')searchAnime()">
<button onclick="searchAnime()">搜索</button>
</div>
<div class="quick-list" id="quickList"></div>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var input=document.getElementById('searchInput');
var cnToJp={
'龙珠':'Dragon Ball','火影忍者':'Naruto','海贼王':'One Piece','进击的巨人':'Shingeki no Kyojin',
'鬼灭之刃':'Kimetsu no Yaiba','咒术回战':'Jujutsu Kaisen','间谍过家家':'Spy x Family',
'电锯人':'Chainsaw Man','我的英雄学院':'Boku no Hero Academia','一拳超人':'One Punch Man',
'死亡笔记':'Death Note','刀剑神域':'Sword Art Office','Re:从零开始':'Re:Zero',
'辉夜大小姐':'Kaguya-sama','紫罗兰永恒花园':'Violet Evergarden',
'名侦探柯南':'Detective Conan','哆啦A梦':'Doraemon','灌篮高手':'Slam Dunk',
'犬夜叉':'Inuyasha','银魂':'Gintama','排球少年':'Haikyuu',
'蓝色监狱':'Blue Lock','东京喰种':'Tokyo Ghoul','钢之炼金术师':'Fullmetal Alchemist',
'你的名字':'Kimi no Na wa','天气之子':'Tenki no Ko','千与千寻':'Sen to Chihiro',
'龙猫':'My Neighbor Totoro','幽灵公主':'Mononoke Hime','新世纪福音战士':'Neon Genesis Evangelion',
'攻壳机动队':'Ghost in the Shell','命运之夜':'Fate stay night',
'斗破苍穹':'Battle Through the Heavens','完美世界':'Perfect World',
'斗罗大陆':'Soul Land','一人之下':'Hitori no Shita',
'狐妖小红娘':'Fox Spirit Matchmaker','秦时明月':'The Legend of Qin',
'伍六七':'Scissor Seven','刺客伍六七':'Scissor Seven',
'仙逆':'Renegade Immortal','凡人修仙传':'A Record of a Mortal',
'吞噬星空':'Swallowed Star','枕刀歌':'Song of Pillow and Sword',
'大理寺日志':'Diary of the Mysterious Cases','中国奇谭':'Yao Chinese Folktales',
'宝可梦':'Pokemon','数码宝贝':'Digimon','游戏王':'Yu-Gi-Oh',
'光之美少女':'Precure','美少女战士':'Sailor Moon',
'蜡笔小新':'Crayon Shin-chan','足球小将':'Captain Tsubasa',
'城市猎人':'City Hunter','北斗神拳':'Fist of the North Star',
'圣斗士星矢':'Saint Seiya','浪客剑心':'Rurouni Kenshin',
'全职猎人':'Hunter x Hunter'
};
var jpToCn={};
Object.keys(cnToJp).forEach(function(k){jpToCn[cnToJp[k]]=k;});
var quickAnime=['龙珠','火影忍者','海贼王','鬼灭之刃','你的名字','哆啦A梦','名侦探柯南','咒术回战'];
function renderQuick(){
var html='';
quickAnime.forEach(function(name){
html+='<button class="quick-btn" onclick="quickSearch(\''+name+'\')">'+name+'</button>';
});
document.getElementById('quickList').innerHTML=html;
}
var animeCache={};
window.quickSearch=function(name){input.value=name;searchAnime();};
window.searchAnime=function(){
var q=input.value.trim();
if(!q){app.innerHTML='<div class="error"><p>请输入动漫名称</p></div>';return;}
var apiName=cnToJp[q]||q;
var cacheKey=apiName.toLowerCase();
if(animeCache[cacheKey]&&Date.now()-animeCache[cacheKey].time<300000){
var cached=animeCache[cacheKey].data;
renderAnimeResults(cached,q);return;}
app.innerHTML='<div class="loading"><div class="spinner"></div><p>搜索中...</p></div>';
fetch('https://api.jikan.moe/v4/anime?q='+encodeURIComponent(apiName)+'&limit=10')
.then(function(r){if(!r.ok)throw new Error('请求失败 ('+r.status+')');return r.json();})
.then(function(data){animeCache[cacheKey]={data:data,time:Date.now()};renderAnimeResults(data,q);})
.catch(function(e){
app.innerHTML='<div class="error"><p>⚠️ '+e.message+'</p></div>';
});
};
function renderAnimeResults(data,q){
if(!data.data||!data.data.length){app.innerHTML='<div class="error"><p>未找到"'+q+'"</p></div>';return;}
var html='';
data.data.forEach(function(a){
var title=a.title||'';
var titleCn=jpToCn[title]||'';
var img=a.images&&a.images.jpg?a.images.jpg.image_url:'';
var score=a.score?a.score+'分':'暂无评分';
var episodes=a.episodes?a.episodes+'集':'未知集数';
var status=a.status||'未知';
html+='<div class="anime-card">';
if(img)html+='<img class="anime-img" src="'+img+'" alt="'+title+'" loading="lazy">';
html+='<div class="anime-info">';
html+='<div class="anime-title">'+title+'</div>';
if(titleCn)html+='<div class="anime-title-cn">'+titleCn+'</div>';
html+='<div class="anime-meta">⭐ '+score+' · 📺 '+episodes+' · '+status+'</div>';
if(a.synopsis)html+='<div class="anime-synopsis">'+a.synopsis+'</div>';
html+='</div></div>';
});
app.innerHTML=html;
}
renderQuick();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
