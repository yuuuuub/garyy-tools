<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字变形动画 - 在线汉字变形展示</title>
<meta name="description" content="汉字变形动画 - 观看汉字从一种形态变形为另一种形态的动画效果">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>">
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --blue: #3b82f6;
  --green: #238636;
  --red: #ef4444;
  --radius: 10px;
  --transition: 0.2s ease;
}
[data-theme="light"] {
  --bg: #f6f8fa;
  --card: #fff;
  --border: #d0d7de;
  --text: #1f2328;
  --text2: #656d76;
  --blue: #0969da;
  --green: #1a7f37;
  --red: #cf222e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  padding: 16px;
}
.container { max-width: 800px; margin: auto; }
h1 { text-align: center; padding: 24px 0 8px; font-size: 1.5rem; }
.sub { text-align: center; color: var(--text2); font-size: .85rem; margin-bottom: 20px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.btn {
  display: inline-block;
  padding: 10px 24px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: .9rem;
  margin-top: 12px;
  transition: var(--transition);
}
.btn:hover { opacity: .85; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.btn-secondary { background: var(--border); color: var(--text); }
.morph-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin: 20px 0;
  min-height: 200px;
}
.morph-char {
  width: 150px;
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 6rem;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  transition: all 0.8s ease;
}
.morph-char.active {
  border-color: var(--blue);
  transform: scale(1.1);
  box-shadow: 0 0 20px rgba(59,130,246,0.3);
}
.morph-arrow {
  font-size: 2rem;
  color: var(--blue);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.2); }
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 16px 0;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--blue);
  transition: width 0.3s;
  border-radius: 2px;
}
.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 16px 0;
}
.speed-control {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: .85rem;
}
.speed-control input {
  width: 100px;
}
.morph-info {
  text-align: center;
  margin: 16px 0;
  font-size: .9rem;
}
.morph-info span {
  color: var(--blue);
  font-weight: bold;
}
.char-list {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  margin: 16px 0;
}
.char-item {
  padding: 8px;
  text-align: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: var(--transition);
  font-size: 1.2rem;
}
.char-item:hover {
  border-color: var(--blue);
  background: var(--card);
}
.char-item.selected {
  border-color: var(--blue);
  background: rgba(59,130,246,0.1);
}
.history {
  margin-top: 16px;
}
.history-item {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  font-size: .85rem;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
body, .container { animation: fadeIn .4s ease-out; }
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>🔄 汉字变形动画</h1>
  <p class="sub">观看汉字从一种形态变形为另一种形态的动画效果</p>

  <div class="card">
    <div class="btn-group">
      <button class="btn" onclick="startMorph()">开始变形</button>
      <button class="btn btn-secondary" onclick="pauseMorph()">暂停</button>
      <button class="btn btn-secondary" onclick="resetMorph()">重置</button>
      <button class="btn btn-secondary" onclick="toggleTheme()">🌓 切换主题</button>
    </div>

    <div class="speed-control">
      <span>速度:</span>
      <input type="range" id="speed" min="1" max="10" value="5" oninput="updateSpeed()">
      <span id="speedLabel">5x</span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress" style="width:0%"></div>
    </div>

    <div class="morph-stage">
      <div class="morph-char" id="fromChar">大</div>
      <div class="morph-arrow">→</div>
      <div class="morph-char" id="toChar">天</div>
    </div>

    <div class="morph-info" id="morphInfo">
      选择起始汉字和目标汉字，点击开始变形
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">选择汉字</h3>
    <div class="char-list" id="charList"></div>
    <div style="margin-top:12px;font-size:.85rem;color:var(--text2)">
      <span>当前选择: </span>
      <span id="selectedFrom">大</span> → <span id="selectedTo">天</span>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">预设变形组</h3>
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="setPreset('basic')">基础变形</button>
      <button class="btn btn-secondary" onclick="setPreset('radical')">部首变形</button>
      <button class="btn btn-secondary" onclick="setPreset('stroke')">笔画变形</button>
      <button class="btn btn-secondary" onclick="setPreset('similar')">相似汉字</button>
    </div>
  </div>

  <div class="card history" id="historyCard" style="display:none">
    <h3 style="margin-bottom:12px">变形记录</h3>
    <div id="history"></div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var characters = [
  {char:'一',pinyin:'yī'},
  {char:'二',pinyin:'èr'},
  {char:'三',pinyin:'sān'},
  {char:'大',pinyin:'dà'},
  {char:'小',pinyin:'xiǎo'},
  {char:'人',pinyin:'rén'},
  {char:'口',pinyin:'kǒu'},
  {char:'日',pinyin:'rì'},
  {char:'月',pinyin:'yuè'},
  {char:'木',pinyin:'mù'},
  {char:'禾',pinyin:'hé'},
  {char:'本',pinyin:'běn'},
  {char:'末',pinyin:'mò'},
  {char:'未',pinyin:'wèi'},
  {char:'天',pinyin:'tiān'},
  {char:'夫',pinyin:'fū'},
  {char:'太',pinyin:'tài'},
  {char:'犬',pinyin:'quǎn'},
  {char:'火',pinyin:'huǒ'},
  {char:'水',pinyin:'shuǐ'},
  {char:'山',pinyin:'shān'},
  {char:'石',pinyin:'shí'},
  {char:'田',pinyin:'tián'},
  {char:'王',pinyin:'wáng'},
  {char:'土',pinyin:'tǔ'},
  {char:'干',pinyin:'gàn'},
  {char:'工',pinyin:'gōng'},
  {char:'十',pinyin:'shí'},
  {char:'又',pinyin:'yòu'},
  {char:'寸',pinyin:'cùn'},
  {char:'力',pinyin:'lì'},
  {char:'刀',pinyin:'dāo'}
];

var presets = {
  basic: [['大','天'],['人','大'],['口','日'],['木','本'],['一','二'],['十','千']],
  radical: [['木','林'],['木','森'],['水','淼'],['火','焱'],['土','垚'],['金','鑫']],
  stroke: [['一','二'],['二','三'],['三','王'],['口','日'],['日','目'],['月','朋']],
  similar: [['未','末'],['己','已'],['日','曰'],['大','犬'],['天','夫'],['土','士']]
};

var fromChar = '大';
var toChar = '天';
var morphing = false;
var paused = false;
var speed = 5;
var progress = 0;
var animationId = null;
var history = [];
var selectMode = 'from';

function init() {
  renderCharList();
}

function renderCharList() {
  var html = '';
  characters.forEach(function(c) {
    var cls = 'char-item';
    if(c.char === fromChar || c.char === toChar) cls += ' selected';
    html += '<div class="' + cls + '" onclick="selectChar(\'' + c.char + '\')">' + c.char + '</div>';
  });
  document.getElementById('charList').innerHTML = html;
}

function selectChar(ch) {
  if(selectMode === 'from') {
    fromChar = ch;
    selectMode = 'to';
  } else {
    toChar = ch;
    selectMode = 'from';
  }
  document.getElementById('fromChar').textContent = fromChar;
  document.getElementById('toChar').textContent = toChar;
  document.getElementById('selectedFrom').textContent = fromChar;
  document.getElementById('selectedTo').textContent = toChar;
  renderCharList();
}

function setPreset(type) {
  var p = presets[type];
  var random = p[Math.floor(Math.random() * p.length)];
  fromChar = random[0];
  toChar = random[1];
  document.getElementById('fromChar').textContent = fromChar;
  document.getElementById('toChar').textContent = toChar;
  document.getElementById('selectedFrom').textContent = fromChar;
  document.getElementById('selectedTo').textContent = toChar;
  renderCharList();
}

function startMorph() {
  if(morphing && !paused) return;
  if(!morphing) {
    progress = 0;
    document.getElementById('morphInfo').innerHTML = '变形中: <span>' + fromChar + '</span> → <span>' + toChar + '</span>';
  }
  morphing = true;
  paused = false;
  animate();
}

function pauseMorph() {
  paused = true;
  if(animationId) cancelAnimationFrame(animationId);
}

function resetMorph() {
  morphing = false;
  paused = false;
  progress = 0;
  if(animationId) cancelAnimationFrame(animationId);
  document.getElementById('progress').style.width = '0%';
  document.getElementById('fromChar').style.opacity = '1';
  document.getElementById('toChar').style.opacity = '0.3';
  document.getElementById('morphInfo').innerHTML = '选择起始汉字和目标汉字，点击开始变形';
}

function animate() {
  if(paused) return;
  progress += speed * 0.02;
  if(progress >= 100) {
    progress = 100;
    morphing = false;
    document.getElementById('morphInfo').innerHTML = '变形完成: <span>' + fromChar + '</span> → <span>' + toChar + '</span>';
    addToHistory();
  }
  document.getElementById('progress').style.width = progress + '%';
  var fromOpacity = 1 - progress / 100;
  var toOpacity = progress / 100;
  document.getElementById('fromChar').style.opacity = fromOpacity;
  document.getElementById('toChar').style.opacity = toOpacity;
  if(morphing) {
    animationId = requestAnimationFrame(animate);
  }
}

function updateSpeed() {
  speed = parseInt(document.getElementById('speed').value);
  document.getElementById('speedLabel').textContent = speed + 'x';
}

function addToHistory() {
  history.unshift({from:fromChar, to:toChar, time:new Date().toLocaleString()});
  if(history.length > 10) history.pop();
  renderHistory();
}

function renderHistory() {
  if(history.length === 0) {
    document.getElementById('historyCard').style.display = 'none';
    return;
  }
  document.getElementById('historyCard').style.display = 'block';
  var html = '';
  history.forEach(function(h) {
    html += '<div class="history-item">';
    html += '<span>' + h.from + ' → ' + h.to + '</span>';
    html += '<span style="color:var(--text2)">' + h.time + '</span>';
    html += '</div>';
  });
  document.getElementById('history').innerHTML = html;
}

function toggleTheme() {
  var html = document.documentElement;
  var current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
}

init();
document.getElementById('toChar').style.opacity = '0.3';
</script>
</body>
</html>
