*{margin:0;padding:0;box-sizing:border-box}
:root{--game-select:none;--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a28;--bg-card:#151520;
--text:#e0e0e0;--text2:#888;--accent:#ff6b35;--accent2:#ff4da6;
--platform-pc:#00b4d8;--platform-ps5:#0070d1;--platform-xbox:#107c10;
--platform-switch:#e60012;--platform-mobile:#ff9500;
--tag-rpg:#9b59b6;--tag-action:#e74c3c;--tag-adventure:#2ecc71;
--tag-fps:#f39c12;--tag-indie:#1abc9c;--tag-strategy:#3498db;
--tag-sports:#e67e22;--tag-horror:#c0392b;--tag-mmo:#8e44ad;
--tag-simulation:#27ae60;--tag-puzzle:#f1c40f;--tag-fighting:#e91e63;
--border:1px solid rgba(255,255,255,0.06);--radius:12px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6padding:16px;scroll-behavior:smooth;}
a{color:var(--accent);text-decoration:none}
.container{max-width:1400px;margin:0 auto;padding:0 20px}
header{background:var(--bg2);border-bottom:var(--border);position:sticky;top:0;z-index:100;padding:16px 0}
header .container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{font-size:32px}
.logo h1{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo span{font-size:12px;color:var(--text2);margin-left:4px}
.search-box{position:relative}
.search-box input{background:var(--bg3);border:var(--border);color:var(--text);padding:10px 40px 10px 16px;border-radius:24px;width:240px;font-size:14px;outline:none;transition:all .2s}

.stats-row{display:flex;justify-content:center;gap:32px;margin-top:20px;flex-wrap:wrap}
.stat-item{text-align:center}
.stat-num{font-size:28px;font-weight:700;color:var(--accent)}

.filter-btn{background:var(--bg3);border:var(--border);color:var(--text2);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s;white-space:nowrap}
.filter-btn:hover{color:var(--text);border-color:var(--accent)}
.filter-btn.active{background:var(--accent);color:var(--text);border-color:var(--accent);font-weight:600}
.filter-btn.platform-pc.active{background:var(--platform-pc);border-color:var(--platform-pc)}
.filter-btn.platform-ps5.active{background:var(--platform-ps5);border-color:var(--platform-ps5)}
.filter-btn.platform-xbox.active{background:var(--platform-xbox);border-color:var(--platform-xbox)}
.filter-btn.platform-switch.active{background:var(--platform-switch);border-color:var(--platform-switch)}
.filter-btn.platform-mobile.active{background:var(--platform-mobile);border-color:var(--platform-mobile)}
.filter-btn.wishlist-btn{border-color:var(--accent2);color:var(--accent2)}
.filter-btn.wishlist-btn.active{background:var(--accent2);color:var(--text);border-color:var(--accent2)}
.section-title{font-size:22px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.section-title .badge{font-size:12px;background:var(--accent);color:var(--text);padding:2px 10px;border-radius:12px;font-weight:400}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:40px}
.game-card{background:var(--bg-card);border:var(--border);border-radius:var(--radius);padding:16px;transition:all .2s;position:relative;cursor:pointer;overflow:hidden}
.game-card:hover{transform:translateY(-2px);border-color:rgba(255,107,53,0.3);box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.game-card.released{opacity:0.85}
.game-card.released .card-cover{filter:grayscale(0.1)}
.card-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.card-cover{width:64px;height:64px;background:var(--bg3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0;border:2px solid rgba(255,255,255,0.05)}
.card-info{flex:1;min-width:0}
.card-name{font-size:16px;font-weight:700;margin-bottom:4px;line-height:1.3}
.card-dev{font-size:12px;color:var(--text2);margin-bottom:6px}
.card-date{font-size:13px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:6px}
.card-date .countdown{font-size:11px;background:rgba(255,107,53,0.15);padding:1px 8px;border-radius:10px;color:var(--accent)}

.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.tag-rpg{background:rgba(155,89,182,0.2);color:var(--tag-rpg)}
.tag-action{background:rgba(231,76,60,0.2);color:var(--tag-action)}
.tag-adventure{background:rgba(46,204,113,0.2);color:var(--tag-adventure)}
.tag-fps{background:rgba(243,156,18,0.2);color:var(--tag-fps)}
.tag-indie{background:rgba(26,188,156,0.2);color:var(--tag-indie)}
.tag-strategy{background:rgba(52,152,219,0.2);color:var(--tag-strategy)}
.tag-sports{background:rgba(230,126,34,0.2);color:var(--tag-sports)}
.tag-horror{background:rgba(192,57,43,0.2);color:var(--tag-horror)}
.tag-mmo{background:rgba(142,68,173,0.2);color:var(--tag-mmo)}
.tag-simulation{background:rgba(39,174,96,0.2);color:var(--tag-simulation)}
.tag-puzzle{background:rgba(241,196,15,0.2);color:var(--tag-puzzle)}
.tag-fighting{background:rgba(233,30,99,0.2);color:var(--tag-fighting)}
.card-platforms{display:flex;gap:4px;margin-bottom:10px}
.platform-tag{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;letter-spacing:.5px}
.platform-tag.pc{background:rgba(0,180,216,0.2);color:var(--platform-pc)}
.platform-tag.ps5{background:rgba(0,112,209,0.2);color:var(--platform-ps5)}
.platform-tag.xbox{background:rgba(16,124,16,0.2);color:var(--platform-xbox)}
.platform-tag.switch{background:rgba(230,0,18,0.2);color:var(--platform-switch)}
.platform-tag.mobile{background:rgba(255,149,0,0.2);color:var(--platform-mobile)}
.heat-bar-wrap{display:flex;align-items:center;gap:8px}
.heat-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.heat-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .4s}
.heat-label{font-size:11px;color:var(--text2);white-space:nowrap}
.wishlist-btn-card{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,0.05);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:5}

.empty-state p{font-size:16px}
.countdown-section{margin-bottom:40px}
.countdown-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

.countdown-cover{font-size:28px;width:40px;text-align:center}
.countdown-info{flex:1}
.countdown-name{font-weight:700;font-size:14px;margin-bottom:2px}
.countdown-date{font-size:12px;color:var(--accent)}
.countdown-days{font-size:11px;color:var(--text2)}
footer{background:var(--bg2);border-top:var(--border);padding:24px 0;text-align:center;margin-top:60px}
footer p{color:var(--text2);font-size:13px}

.game-grid{grid-template-columns:1fr}
.search-box input{width:180px}
.filter-row{justify-content:center}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,0.4)}50%{box-shadow:0 0 20px 4px rgba(255,107,53,0.2)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.game-card{animation:fadeIn .4s ease both}
.game-card:nth-child(1){animation-delay:0s}
.game-card:nth-child(2){animation-delay:.05s}
.game-card:nth-child(3){animation-delay:.1s}
.game-card:nth-child(4){animation-delay:.15s}
.game-card:nth-child(5){animation-delay:.2s}
.game-card:nth-child(6){animation-delay:.25s}
.game-card:nth-child(7){animation-delay:.3s}
.game-card:nth-child(8){animation-delay:.35s}
.game-card:nth-child(9){animation-delay:.4s}
.game-card:nth-child(10){animation-delay:.45s}
.game-card:nth-child(11){animation-delay:.5s}
.game-card:nth-child(12){animation-delay:.55s}
.heat-bar-fill.mega{background:linear-gradient(90deg,#ff4da6,#ff6b35,#ffd700)}
.heat-bar-fill.high{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.heat-bar-fill.mid{background:linear-gradient(90deg,#f39c12,#e74c3c)}
.heat-bar-fill.low{background:linear-gradient(90deg,#3498db,#2ecc71)}
.game-card.top-pick{border-color:rgba(255,215,0,0.4)}
.game-card.top-pick::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);border-radius:var(--radius) var(--radius) 0 0}
.game-card.top-pick .card-cover{animation:pulseGlow 3s infinite}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-content{background:var(--bg2);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:28px;max-width:500px;width:90%;max-height:85vh;overflow-y:auto;animation:fadeIn .2s ease}
.modal-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.modal-cover{font-size:56px;width:80px;height:80px;background:var(--bg3);border-radius:14px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,0.08);flex-shrink:0}
.modal-info{flex:1}
.modal-name{font-size:22px;font-weight:800;margin-bottom:4px}
.modal-dev{font-size:13px;color:var(--text2);margin-bottom:8px}
.modal-date{font-size:14px;color:var(--accent);font-weight:600;margin-bottom:8px}
.modal-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.modal-desc{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:16px}
.modal-heat{padding:12px 0;border-top:var(--border);border-bottom:var(--border);margin-bottom:16px}
.modal-heat-label{font-size:13px;color:var(--text2);margin-bottom:6px}
.modal-actions{display:flex;gap:10px}
.modal-btn{padding:10px 24px;border-radius:24px;border:var(--border);background:var(--bg3);color:var(--text);cursor:pointer;font-size:14px;transition:all .2s;flex:1}
.modal-btn:hover{background:var(--accent);color:var(--text);border-color:var(--accent)}
.modal-btn.wishlist-btn{color:var(--accent2);border-color:rgba(255,77,166,0.4)}
.modal-btn.wishlist-btn:hover{background:var(--accent2);color:var(--text);border-color:var(--accent2)}
.modal-btn.wishlist-btn.active-btn{background:var(--accent2);color:var(--text)}
.modal-close{position:absolute;top:0;left:0;right:0;bottom:0;z-index:-1}
.reset-filter{padding:4px 12px;border-radius:16px;border:var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;transition:all .2s}
.reset-filter:hover{background:rgba(255,255,255,0.05);color:var(--text)}
.game-card::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:var(--radius);opacity:0;transition:opacity .3s;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,107,53,0.08) 0%,transparent 70%)}
.game-card:hover::after{opacity:1}
.game-card.skeleton .card-cover{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
.game-card.skeleton .card-name,.game-card.skeleton .card-dev,.game-card.skeleton .card-desc{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px;color:transparent}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:var(--border);border-radius:12px;padding:12px 20px;color:var(--text);font-size:14px;z-index:300;animation:fadeIn .3s ease;display:flex;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,0.5)}

let currentMonth = new Date().getMonth();
let selectedMonth = 'all';
let selectedPlatform = 'all';
let searchQuery = '';
let showWishlistOnly = false;
let wishlist = JSON.parse(localStorage.getItem('gc_wishlist') || '[]');
function toggleWishlist(gameId, showToast = true) {
  const idx = wishlist.indexOf(gameId);
  const game = games.find(g => g.id === gameId);
  if (idx >= 0) {
    wishlist.splice(idx, 1);
    if (showToast) showToastMessage(`已从愿望单移除「${game ? game.name : ''}」`, '🤍');
  } else {
    wishlist.push(gameId);
    if (showToast) showToastMessage(`已加入愿望单「${game ? game.name : ''}」`, '❤️');
  }
  localStorage.setItem('gc_wishlist', JSON.stringify(wishlist));
  renderAll();
}
function showToastMessage(msg, icon) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `${icon} ${msg}`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('fadeout');
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}
function openGameModal(gameId) {
  const g = games.find(g => g.id === gameId);
  if (!g) return;
  document.getElementById('modalCover').textContent = g.cover;
  document.getElementById('modalName').textContent = g.name;
  document.getElementById('modalDev').textContent = g.dev;
  document.getElementById('modalDate').textContent = '📅 ' + g.date + (g.released ? ' (已发售)' : '');
  document.getElementById('modalPlatforms').innerHTML = g.platforms.map(p => `<span class="platform-tag ${getPlatformClass(p)}">${p}</span>`).join('');
  document.getElementById('modalTags').innerHTML = g.tags.map(t => `<span class="tag ${getCardTagClass(t)}">${t}</span>`).join('');
  document.getElementById('modalDesc').textContent = g.desc;
  document.getElementById('modalHeatBar').style.width = g.heat + '%';
  const heatClass = g.heat >= 95 ? 'mega' : g.heat >= 85 ? 'high' : g.heat >= 75 ? 'mid' : 'low';
  document.getElementById('modalHeatBar').className = 'heat-bar-fill ' + heatClass;
  const wishlistBtn = document.getElementById('modalWishlistBtn');
  const isFav = isWishlisted(g.id);
  wishlistBtn.textContent = isFav ? '💔 移出愿望单' : '💖 加入愿望单';
  wishlistBtn.className = 'modal-btn wishlist-btn' + (isFav ? ' active-btn' : '');
  wishlistBtn.onclick = () => toggleWishlist(g.id);
  document.getElementById('gameModal').style.display = 'flex';
}
function isWishlisted(gameId) {
  return wishlist.includes(gameId);
}
function getMonthLabel(m) { return `${m + 1}月`; }
function getMonthFromDate(dateStr) {
  const m = parseInt(dateStr.split('-')[1]) - 1;
  return m;
}
function getCardTagClass(tag) {
  const map = {
    '角色扮演':'tag-rpg','动作':'tag-action','冒险':'tag-adventure',
    '射击':'tag-fps','独立':'tag-indie','策略':'tag-strategy',
    '竞速':'tag-sports','体育':'tag-sports','恐怖':'tag-horror',
    '模拟':'tag-simulation','生存':'tag-simulation','沙盒':'tag-simulation',
    '开放世界':'tag-adventure','大逃杀':'tag-action','MOBA':'tag-strategy',
    '解谜':'tag-puzzle','格斗':'tag-fighting','音乐':'tag-indie',
  };
  return map[tag] || 'tag-action';
}
function getPlatformClass(p) {
  const map = {'PC':'pc','PS5':'ps5','Xbox':'xbox','Switch':'switch','手机':'mobile'};
  return map[p] || 'pc';
}
function getCountdown(dateStr) {
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const diff = target - now;
  if (diff <= 0) return null;
  const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
  if (days <= 0) return '今日发售';
  if (days === 1) return '明天发售';
  if (days <= 30) return `还有 ${days} 天`;
  const months = Math.floor(days / 30);
  return `${months} 个月`;
}
function matchGame(g, platform, month, query, wishlistOnly) {
  if (platform !== 'all' && !g.platforms.includes(platform)) return false;
  if (month !== 'all' && getMonthFromDate(g.date) !== parseInt(month)) return false;
  if (query && !g.name.toLowerCase().includes(query.toLowerCase())) return false;
  if (wishlistOnly && !isWishlisted(g.id)) return false;
  return true;
}
function renderAll() {
  const filtered = games.filter(g => matchGame(g, selectedPlatform, selectedMonth, searchQuery, showWishlistOnly));
  document.getElementById('totalGames').textContent = games.length;
  document.getElementById('releasedCount').textContent = games.filter(g => g.released).length;
  document.getElementById('upcomingCount').textContent = games.filter(g => !g.released).length;
  document.getElementById('wishlistCount').textContent = wishlist.length;
  document.getElementById('resultCount').textContent = filtered.length;
  const now = new Date();
  const thisMonth = now.getMonth();
  const nextMonth = thisMonth === 11 ? 0 : thisMonth + 1;
  const recentGames = games.filter(g => g.released && getMonthFromDate(g.date) === thisMonth);
  const upcomingGames = games.filter(g => !g.released && getMonthFromDate(g.date) === nextMonth);
  if (upcomingGames.length === 0) {
    const unreleased = games.filter(g => !g.released);
    unreleased.sort((a,b) => new Date(a.date) - new Date(b.date));
    const nextBatch = unreleased.slice(0, 4);
    renderCountdownCards('upcomingCards', nextBatch, 'countdown', `${getMonthLabel(nextMonth)}月`);
  } else {
    renderCountdownCards('upcomingCards', upcomingGames, 'countdown', `${getMonthLabel(nextMonth)}月`);
  }
  document.getElementById('upcomingBadge').textContent = `${getMonthLabel(nextMonth)}月`;
  document.getElementById('recentBadge').textContent = `${getMonthLabel(thisMonth)}月`;
  renderCountdownCards('recentCards', recentGames.length > 0 ? recentGames : games.filter(g => g.released).slice(-4), 'recent', `${getMonthLabel(thisMonth)}月`);
  const grid = document.getElementById('gameGrid');
  const empty = document.getElementById('emptyState');
  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    filtered.sort((a,b) => {
      if (!a.released && b.released) return -1;
      if (a.released && !b.released) return 1;
      if (!a.released && !b.released) return new Date(a.date) - new Date(b.date);
      return new Date(b.date) - new Date(a.date);
    });
    grid.innerHTML = filtered.map(g => {
      const cd = g.released ? null : getCountdown(g.date);
      const heatClass = g.heat >= 95 ? 'mega' : g.heat >= 85 ? 'high' : g.heat >= 75 ? 'mid' : 'low';
      const topPick = g.heat >= 95 ? ' top-pick' : '';
      return `
      <div class="game-card ${g.released ? 'released' : ''}${topPick}" onclick="openGameModal(${g.id})">
        <button class="wishlist-btn-card${isWishlisted(g.id) ? ' favorited' : ''}" onclick="event.stopPropagation();toggleWishlist(${g.id})">${isWishlisted(g.id) ? '❤️' : '🤍'}</button>
        <div class="card-header">
          <div class="card-cover">${g.cover}</div>
          <div class="card-info">
            <div class="card-name">${g.name}</div>
            <div class="card-dev">${g.dev}</div>
          </div>
        </div>
        <div class="card-date">
          📅 ${g.date}
          ${g.released ? '<span class="released-badge">已发售</span>' : (cd ? `<span class="countdown">${cd}</span>` : '')}
        </div>
        <div class="card-platforms">${g.platforms.map(p => `<span class="platform-tag ${getPlatformClass(p)}">${p}</span>`).join('')}</div>
        <div class="card-tags">${g.tags.map(t => `<span class="tag ${getCardTagClass(t)}">${t}</span>`).join('')}</div>
        <div class="card-desc">${g.desc}</div>
        <div class="heat-bar-wrap">
          <span style="font-size:12px;color:var(--text2)">期待值</span>
          <div class="heat-bar"><div class="heat-bar-fill ${heatClass}" style="width:${g.heat}%"></div></div>
          <span class="heat-label">${g.heat}</span>
        </div>
      </div>`;
    }).join('');
  }
}
function renderCountdownCards(containerId, gamesList, type, label) {
  const container = document.getElementById(containerId);
  if (gamesList.length === 0) {
    container.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:8px">暂无数据</div>';
    return;
  }
  container.innerHTML = gamesList.slice(0, 4).map(g => {
    const cd = type === 'countdown' ? getCountdown(g.date) : null;
    return `
      <div class="countdown-card" onclick="openGameModal(${g.id})" style="cursor:pointer">
        <div class="countdown-cover">${g.cover}</div>
        <div class="countdown-info">
          <div class="countdown-name">${g.name}</div>
          <div class="countdown-date">📅 ${g.date}</div>
        </div>
        ${cd ? `<div class="countdown-days">⏰ ${cd}</div>` : '<div class="countdown-days">✅</div>'}
      </div>
    `;
  }).join('');
}
function initMonthButtons() {
  const monthRow = document.querySelector('.filter-row');
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const allBtn = monthRow.querySelector('[data-month="all"]');
  months.forEach((label, idx) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn month-btn';
    btn.dataset.month = String(idx);
    btn.textContent = label;
    if (idx === currentMonth) btn.classList.add('active');
    monthRow.appendChild(btn);
  });
  selectedMonth = String(currentMonth);
  document.querySelectorAll('.month-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedMonth = btn.dataset.month;
      renderAll();
    });
  });
}
document.querySelectorAll('.platform-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedPlatform = btn.dataset.platform;
    showWishlistOnly = false;
    document.getElementById('wishlistFilter').classList.remove('active');
    renderAll();
  });
});
document.getElementById('wishlistFilter').addEventListener('click', function() {
  showWishlistOnly = !showWishlistOnly;
  if (showWishlistOnly) {
    this.classList.add('active');
    document.querySelectorAll('.platform-btn').forEach(b => {
      b.classList.remove('active');
      if (b.dataset.platform === 'all') b.classList.add('active');
    });
    selectedPlatform = 'all';
    document.querySelectorAll('.month-btn').forEach(b => {
      b.classList.remove('active');
      if (b.dataset.month === 'all') b.classList.add('active');
    });
    selectedMonth = 'all';
  } else {
    this.classList.remove('active');
  }
  renderAll();
});
let searchTimeout;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = this.value.trim();
    renderAll();
  }, 200);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('gameModal').style.display = 'none';
});
initMonthButtons();
renderAll();
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
