<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ 世界杯比分竞猜 - Gary's Tools</title>
<meta name="description" content="2026世界杯趣味比分竞猜，预测小组赛和淘汰赛比分，和朋友比拼预测准确率">
<style>
:root{--bg:#0a0e1a;--card:#111827;--border:#1f2937;--text:#e5e7eb;--text2:#9ca3af;--gold:#f59e0b;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--radius:14px;--shadow:0 4px 24px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;-webkit-font-smoothing:antialiased}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:1rem;font-weight:700;margin-bottom:14px;color:var(--gold)}
.key-matches{display:flex;flex-direction:column;gap:10px}
.match-row{display:flex;align-items:center;gap:10px;padding:14px;background:rgba(255,255,255,.02);border-radius:10px;border:1px solid var(--border)}
.match-info{min-width:55px;text-align:center}
.match-info .date{font-size:.7rem;color:var(--text2)}
.match-info .time{font-size:.85rem;font-weight:700;color:var(--gold)}
.match-teams{flex:1;display:flex;align-items:center;gap:6px;justify-content:center}
.match-teams .team{text-align:center;font-size:.82rem;font-weight:600}
.match-teams .flag{font-size:1.2rem;display:block;margin-bottom:2px}
.match-teams .vs{font-size:.7rem;color:var(--text2);margin:0 6px}
.score-predict{display:flex;align-items:center;gap:4px}
.score-predict input{width:32px;height:36px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:1rem;font-weight:700;font-family:inherit}
.score-predict input:focus{border-color:var(--gold);outline:none}
.score-predict .dash{color:var(--text2)}
.predict-btn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--gold),#d97706);color:#000;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:14px;transition:opacity .2s;font-family:inherit}
.predict-btn:hover{opacity:.9}
.predict-btn:active{transform:scale(.98)}
.result-show{text-align:center;padding:16px;border-radius:10px;margin-top:12px}
.result-show .res-text{font-size:1.1rem;font-weight:700;margin-bottom:4px}
.result-show .res-sub{font-size:.8rem;color:var(--text2)}
.hot-picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hot-pick{background:rgba(245,158,11,.05);border:1px solid rgba(245,158,11,.15);border-radius:10px;padding:12px;text-align:center;font-size:.82rem}
.hot-pick .hp-percent{font-size:1.2rem;font-weight:800;color:var(--gold)}
.hot-pick .hp-label{font-size:.72rem;color:var(--text2)}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="⚽ 世界杯比分竞猜 - Gary's Tools">
  <meta property="og:description" content="2026世界杯趣味比分竞猜，预测小组赛和淘汰赛比分，和朋友比拼预测准确率">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/wc-score-predict/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<header>
<h1>⚽ 世界杯比分竞猜</h1>
<p>预测重点比赛比分 · 看看你的眼光准不准</p>
</header>

<div class="card">
<h2>🔥 热门比赛预测</h2>
<div class="key-matches" id="keyMatches"></div>
<button class="predict-btn" onclick="submitAll()">🎯 提交所有预测</button>
<div id="predictResult" class="result-show" style="display:none"></div>
</div>

<div class="card">
<h2>📊 热门冠军预测</h2>
<div class="hot-picks">
<div class="hot-pick"><div class="hp-percent">28%</div><div class="hp-label">🇦🇷 阿根廷</div></div>
<div class="hot-pick"><div class="hp-percent">22%</div><div class="hp-label">🇫🇷 法国</div></div>
<div class="hot-pick"><div class="hp-percent">15%</div><div class="hp-label">🇧🇷 巴西</div></div>
<div class="hot-pick"><div class="hp-percent">12%</div><div class="hp-label">🏴󠁧󠁢󠁥󠁮󠁧󠁿 英格兰</div></div>
<div class="hot-pick"><div class="hp-percent">8%</div><div class="hp-label">🇪🇸 西班牙</div></div>
<div class="hot-pick"><div class="hp-percent">6%</div><div class="hp-label">🇩🇪 德国</div></div>
<div class="hot-pick"><div class="hp-percent">5%</div><div class="hp-label">🇵🇹 葡萄牙</div></div>
<div class="hot-pick"><div class="hp-percent">4%</div><div class="hp-label">其他</div></div>
</div>
</div>

<div class="card">
<h2>📜 我的预测记录</h2>
<div id="history" style="font-size:.82rem;color:var(--text2);text-align:center;padding:20px">
暂无预测记录，快来参与吧！
</div>
</div>
<footer>仅供娱乐 · 预测结果不影响实际比赛 🎲</footer>
</div>

<script>
const KEY_MATCHES=[
{date:'6.11',time:'21:00',home:'🇺🇸 美国',away:'🇵🇹 葡萄牙',type:'揭幕战'},
{date:'6.13',time:'21:00',home:'🇦🇷 阿根廷',away:'🇳🇱 荷兰',type:'焦点战'},
{date:'6.15',time:'03:00',home:'🏴󠁧󠁢󠁥󠁮󠁧󠁿 英格兰',away:'🇩🇪 德国',type:'强强对话'},
{date:'6.17',time:'21:00',home:'🇧🇷 巴西',away:'🇭🇷 克罗地亚',type:'复仇之战'},
{date:'6.19',time:'03:00',home:'🇫🇷 法国',away:'🇩🇰 丹麦',type:'欧洲德比'},
{date:'6.21',time:'21:00',home:'🇨🇳 中国',away:'🇨🇱 智利',type:'亚洲希望'},
];
function renderMatches(){
document.getElementById('keyMatches').innerHTML=KEY_MATCHES.map((m,i)=>`
<div class="match-row">
<div class="match-info"><div class="date">${m.date}</div><div class="time">${m.time}<br><small style="font-size:.6rem;color:var(--text2)">${m.type}</small></div></div>
<div class="match-teams">
<div class="team"><span class="flag">${m.home.slice(0,2)}</span>${m.home.slice(3)}</div>
<div class="vs">VS</div>
<div class="team"><span class="flag">${m.away.slice(0,2)}</span>${m.away.slice(3)}</div>
</div>
<div class="score-predict">
<input type="number" id="h${i}" min="0" max="10" value="1" onfocus="this.select()">
<span class="dash">-</span>
<input type="number" id="a${i}" min="0" max="10" value="1" onfocus="this.select()">
</div>
</div>`).join('');
try{
const d=JSON.parse(localStorage.getItem('wc-predict')||'[]');
KEY_MATCHES.forEach((m,i)=>{
if(d[i]){document.getElementById('h'+i).value=d[i].h;document.getElementById('a'+i).value=d[i].a;}
});
}catch(e){}
renderHistory();
}
function renderHistory(){
try{
const h=JSON.parse(localStorage.getItem('wc-predict-history')||'[]');
if(h.length===0){
document.getElementById('history').innerHTML='<p style="text-align:center;color:var(--text2);padding:20px">暂无预测记录，快来参与吧！</p>';
return;
}
document.getElementById('history').innerHTML='<div style="display:flex;flex-direction:column;gap:8px">'+h.slice(-10).reverse().map(p=>{
const m=KEY_MATCHES[p.mi];
return`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,.02);border-radius:8px">
<span style="font-size:.75rem">${m.home.slice(3)} ${p.h}-${p.a} ${m.away.slice(3)}</span>
<span style="font-size:.7rem;color:var(--text2)">${p.time}</span>
</div>`;
}).join('')+'</div>';
}catch(e){}
}
function submitAll(){
const predicts=[];
KEY_MATCHES.forEach((m,i)=>{
const h=parseInt(document.getElementById('h'+i).value)||0;
const a=parseInt(document.getElementById('a'+i).value)||0;
predicts.push({mi:i,h:Math.max(0,Math.min(10,h)),a:Math.max(0,Math.min(10,a))});
});
localStorage.setItem('wc-predict',JSON.stringify(predicts));
let history=[];
try{history=JSON.parse(localStorage.getItem('wc-predict-history')||'[]');}catch(e){}
history.push({time:new Date().toLocaleString('zh-CN'),mis:predicts.map(p=>({...p}))});
localStorage.setItem('wc-predict-history',JSON.stringify(history));
const r=document.getElementById('predictResult');
r.style.display='block';
const totalGoals=predicts.reduce((s,p)=>s+p.h+p.a,0);
r.innerHTML=`<div class="res-text" style="color:var(--gold)">✅ 预测已保存！</div><div class="res-sub">你预测了 ${KEY_MATCHES.length} 场比赛，共 ${totalGoals} 个进球</div>`;
renderHistory();
}
renderMatches();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
