<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧗 攀岩追踪</title>
<meta name="description" content="攀岩数据追踪器，记录抱石、顶绳、先锋攀岩等级和发送率">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.grade-chart{display:flex;gap:4px;align-items:flex-end;height:100px;margin-top:8px}
.grade-chart .gc{flex:1;text-align:center;font-size:.7rem}
.grade-chart .gc .gb{border-radius:4px 4px 0 0;margin-bottom:4px;transition:height .3s}
.grade-chart .gc .gn{color:var(--text2);font-size:.65rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧗</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🧗 攀岩追踪">
<meta property="og:description" content="攀岩数据追踪器，记录抱石、顶绳、先锋攀岩等级和发送率">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/climbing-tracker-cn/">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🧗 攀岩追踪</h1><p>挑战极限，记录每一次攀登</p></div>

<div class="cd">
<div class="gr">
<div class="st"><div class="nm" id="totalClimbs">0</div><div class="lb">总攀爬次数</div></div>
<div class="st"><div class="nm" id="hardestGrade" style="color:var(--warn)">-</div><div class="lb">最高等级</div></div>
<div class="st"><div class="nm" id="sendRate" style="color:var(--success)">0%</div><div class="lb">发送率</div></div>
<div class="st"><div class="nm" id="monthClimbs" style="color:var(--danger)">0</div><div class="lb">本月攀爬</div></div>
</div>
</div>

<div class="cd"><h2>记录攀爬</h2>
<div class="fr">
<div><label>攀爬类型</label><select id="clType"><option>抱石</option><option>顶绳</option><option>先锋</option><option>多段</option></select></div>
<div><label>等级</label><select id="clGrade"></select></div>
</div>
<div class="fr">
<div><label>尝试次数</label><input type="number" id="clAttempts" value="1" min="1"></div>
<div><label>结果</label><select id="clResult"><option value="send">Send ✅</option><option value="fall">Fall ❌</option><option value="top">Top rope 🧵</option></select></div>
</div>
<div class="fr">
<div><label>场地</label><select id="clWall"><option>室内</option><option>室外</option></select></div>
<div><label>日期</label><input type="date" id="clDate"></div>
</div>
<div class="bg"><button onclick="addClimb()">保存攀爬</button></div></div>

<div class="cd"><h2>等级分布</h2><div class="grade-chart" id="gradeChart"></div></div>

<div class="cd"><h2>攀爬记录</h2><div id="climbList" class="es">暂无记录</div>
<div class="bg"><button class="dng" onclick="clearClimbs()">清空所有</button></div></div>
</div>
<script>
(function(){
var DB_KEY='climbing_tracker_cn';
var climbs=JSON.parse(localStorage.getItem(DB_KEY)||'[]');
var today=function(){return new Date().toISOString().slice(0,10)};

var BOULDER_GRADES=['V0','V1','V2','V3','V4','V5','V6','V7','V8','V9','V10','V11','V12','V13','V14','V15'];
var ROUTE_GRADES=['5.6','5.7','5.8','5.9','5.10a','5.10b','5.10c','5.10d','5.11a','5.11b','5.11c','5.11d','5.12a','5.12b','5.12c','5.12d','5.13a','5.13b','5.13c','5.13d','5.14a'];

function updateGrades(){
var type=document.getElementById('clType').value;
var grades=type==='抱石'?BOULDER_GRADES:ROUTE_GRADES;
var sel=document.getElementById('clGrade');
sel.innerHTML=grades.map(function(g){return '<option>'+g+'</option>';}).join('');
}
document.getElementById('clType').addEventListener('change',updateGrades);

window.addClimb=function(){
var type=document.getElementById('clType').value;
var grade=document.getElementById('clGrade').value;
var attempts=parseInt(document.getElementById('clAttempts').value)||1;
var result=document.getElementById('clResult').value;
var wall=document.getElementById('clWall').value;
var date=document.getElementById('clDate').value||today();
climbs.push({id:Date.now(),type:type,grade:grade,attempts:attempts,result:result,wall:wall,date:date});
localStorage.setItem(DB_KEY,JSON.stringify(climbs));
document.getElementById('clAttempts').value='1';
render();
};

window.delClimb=function(id){climbs=climbs.filter(function(c){return c.id!==id});localStorage.setItem(DB_KEY,JSON.stringify(climbs));render();};
window.clearClimbs=function(){if(!confirm('确定清空所有？'))return;climbs=[];localStorage.setItem(DB_KEY,JSON.stringify(climbs));render();};

function gradeIndex(g){
var i=BOULDER_GRADES.indexOf(g);if(i>=0)return i;
i=ROUTE_GRADES.indexOf(g);return i>=0?i:0;
}

function render(){
var total=climbs.length;
var sends=climbs.filter(function(c){return c.result==='send'||c.result==='top';}).length;
var rate=total?Math.round(sends/total*100):0;
var hardest='-';
var maxIdx=-1;
climbs.forEach(function(c){var idx=gradeIndex(c.grade);if(idx>maxIdx){maxIdx=idx;hardest=c.grade;}});
var cm=new Date().toISOString().slice(0,7);
var month=climbs.filter(function(c){return c.date.indexOf(cm)===0;}).length;

document.getElementById('totalClimbs').textContent=total;
document.getElementById('hardestGrade').textContent=hardest;
document.getElementById('sendRate').textContent=rate+'%';
document.getElementById('monthClimbs').textContent=month;

var gradeCounts={};
climbs.forEach(function(c){gradeCounts[c.grade]=(gradeCounts[c.grade]||0)+1;});
var allGrades=BOULDER_GRADES.concat(ROUTE_GRADES);
var usedGrades=allGrades.filter(function(g){return gradeCounts[g];});
var maxCount=1;usedGrades.forEach(function(g){if(gradeCounts[g]>maxCount)maxCount=gradeCounts[g];});

var chartEl=document.getElementById('gradeChart');
if(!usedGrades.length){chartEl.innerHTML='<div class="es" style="width:100%">暂无数据</div>';return;}
chartEl.innerHTML=usedGrades.slice(-12).map(function(g){
var h=Math.round(gradeCounts[g]/maxCount*80);
return '<div class="gc"><div class="gb" style="height:'+h+'px;background:linear-gradient(180deg,var(--accent),var(--success))"></div><div class="gn">'+g+'</div><div style="font-size:.6rem;color:var(--text2)">'+gradeCounts[g]+'</div></div>';
}).join('');

var el=document.getElementById('climbList');
if(!climbs.length){el.innerHTML='<div class="es">暂无记录</div>';return;}
el.innerHTML=climbs.slice().reverse().map(function(c){
var rc=c.result==='send'?'s':c.result==='fall'?'d':'w';
var rl=c.result==='send'?'Send ✅':c.result==='fall'?'Fall ❌':'Top 🧵';
return '<div class="li"><div style="flex:1"><strong>'+c.grade+'</strong> <span class="tag">'+c.type+'</span><span class="tag '+rc+'">'+rl+'</span><span class="tag s">'+c.wall+'</span><br><span style="font-size:.8rem;color:var(--text2)">尝试'+c.attempts+'次 · '+c.date+'</span></div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="delClimb('+c.id+')">✕</button></div>';
}).join('');
}
document.getElementById('clDate').value=today();
updateGrades();render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
