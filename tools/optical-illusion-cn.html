<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👁️ 视觉错觉</title>
<meta property="og:title" content="👁️ 视觉错觉">
<meta property="og:description" content="👁️ 视觉错觉 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="视觉错觉 - 各种经典视觉错觉效果">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>">
<script src="i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.hdr{text-align:center;margin-bottom:16px}.hdr h1{font-size:1.6rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.canvas-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
canvas{display:block;width:100%}
.controls{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.controls .row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.controls label{font-size:.8rem;color:var(--text2);min-width:70px}
.controls input[type=range]{flex:1;accent-color:var(--accent)}
.controls .val{font-size:.8rem;color:var(--accent);min-width:50px;text-align:right}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.8rem;transition:all .2s}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.info-bar{display:flex;gap:16px;justify-content:center;color:var(--text2);font-size:.8rem;padding:8px 0;flex-wrap:wrap}
.info-bar span{color:var(--accent);font-weight:600}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="hdr"><h1>👁️ 视觉错觉</h1><p>各种经典视觉错觉效果 - 动态生成</p></div>

<div class="tabs" id="illTabs">
<button class="active" data-ill="spiral">旋转螺旋</button>
<button data-ill="checker">棋盘阴影</button>
<button data-ill="munker">蒙克尔条纹</button>
<button data-ill="hermann">赫尔曼栅格</button>
<button data-ill="fraser">弗雷泽螺旋</button>
<button data-ill="cafe">咖啡墙错觉</button>
</div>

<div class="canvas-wrap"><canvas id="c" width="800" height="600"></canvas></div>

<div class="info-bar">
<span>类型: <b id="illType">旋转螺旋</b></span>
<span>参数: <b id="illParam">0</b></span>
</div>

<div class="btn-row">
<button class="btn btn-primary" id="btnToggle">▶ 动画</button>
<button class="btn btn-outline" id="btnScreenshot">📷 截图</button>
</div>

<div class="controls">
<div class="row"><label>速度</label><input type="range" id="speedRange" min="1" max="20" value="5"><span class="val" id="speedVal">5</span></div>
<div class="row"><label>密度</label><input type="range" id="densityRange" min="1" max="30" value="10"><span class="val" id="densVal">10</span></div>
<div class="row"><label>颜色</label><input type="range" id="colorShift" min="0" max="360" value="0"><span class="val" id="colorVal">0°</span></div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=canvas.width,H=canvas.height;
let illType='spiral',animating=true,t=0;
let speed=5,density=10,colorShift=0,animId=null;

function drawSpiral(){
ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
const cx=W/2,cy=H/2;
for(let i=0;i<density*20;i++){
const angle=i*0.1+t*0.02;
const r=i*3;
const x=cx+Math.cos(angle)*r;
const y=cy+Math.sin(angle)*r;
const hue=(i*10+colorShift)%360;
ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);
ctx.fillStyle=`hsl(${hue},80%,60%)`;ctx.fill();
}
ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fillStyle='#f59e0b';ctx.fill();
}

function drawChecker(){
ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
const size=Math.max(20,60-density*3);
const rows=Math.ceil(H/size)+1;
const cols=Math.ceil(W/size)+1;
for(let r=0;r<rows;r++){
for(let c=0;c<cols;c++){
const x=c*size,y=r*size;
ctx.fillStyle=(r+c)%2===0?'#e6edf3':'#30363d';
ctx.fillRect(x,y,size-1,size-1);
}
}
const glowR=size*3;
for(let r=0;r<rows;r++){
for(let c=0;c<cols;c++){
const x=c*size+size/2,y=r*size+size/2;
if((r+c)%2===0){
ctx.beginPath();ctx.arc(x,y,glowR,0,Math.PI*2);
const grad=ctx.createRadialGradient(x,y,0,x,y,glowR);
grad.addColorStop(0,'rgba(0,0,0,0.3)');grad.addColorStop(1,'transparent');
ctx.fillStyle=grad;ctx.fill();
}
}
}
}

function drawMunker(){
ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
const stripeH=Math.max(15,40-density);
const numStripes=Math.ceil(H/stripeH);
for(let i=0;i<numStripes;i++){
const y=i*stripeH;
const hue=(i*20+colorShift)%360;
ctx.fillStyle=`hsl(${hue},70%,50%)`;
ctx.fillRect(0,y,W,stripeH/3);
}
const dotR=8;
for(let x=50;x<W;x+=60){
for(let y=50;y<H;y+=60){
ctx.beginPath();ctx.arc(x,y,dotR,0,Math.PI*2);
ctx.fillStyle='#8b949e';ctx.fill();
}
}
}

function drawHermann(){
ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
const size=Math.max(30,70-density*2);
const cols=Math.ceil(W/size)+1;
const rows=Math.ceil(H/size)+1;
for(let r=0;r<rows;r++){
for(let c=0;c<cols;c++){
ctx.fillStyle='#e6edf3';
ctx.fillRect(c*size,r*size,size-2,size-2);
}
}
}

function drawFraser(){
ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
const cx=W/2,cy=H/2;
for(let ring=1;ring<=density;ring++){
const r=ring*30;
for(let a=0;a<360;a+=5){
const rad=a*Math.PI/180;
const x1=cx+Math.cos(rad)*r;
const y1=cy+Math.sin(rad)*r;
const x2=cx+Math.cos(rad+0.1)*(r+8);
const y2=cy+Math.sin(rad+0.1)*(r+8);
ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
ctx.strokeStyle=(a%10===0)?'#e6edf3':'#30363d';
ctx.lineWidth=2;ctx.stroke();
}
}
ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fillStyle='#f59e0b';ctx.fill();
}

function drawCafe(){
ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
const brickW=Math.max(40,80-density*3);
const brickH=25;
const rows=Math.ceil(H/brickH)+1;
const cols=Math.ceil(W/brickW)+1;
for(let r=0;r<rows;r++){
const offset=(r%2)*brickW/2;
const dark=r%2===0;
for(let c=-1;c<cols;c++){
const x=c*brickW+offset;
const y=r*brickH;
const baseHue=(colorShift+r*10)%360;
ctx.fillStyle=dark?`hsl(${baseHue},40%,25%)`:`hsl(${baseHue},40%,35%)`;
ctx.fillRect(x,y,brickW-2,brickH-1);
}
}
for(let r=0;r<rows;r++){
const y=r*brickH;
ctx.fillStyle='#000';
ctx.fillRect(0,y-1,W,2);
}
}

function draw(){
switch(illType){
case'spiral':drawSpiral();break;
case'checker':drawChecker();break;
case'munker':drawMunker();break;
case'hermann':drawHermann();break;
case'fraser':drawFraser();break;
case'cafe':drawCafe();break;
}
document.getElementById('illParam').textContent=density;
}

function animate(){
if(!animating)return;
t+=speed*0.1;draw();animId=requestAnimationFrame(animate);
}

document.getElementById('illTabs').onclick=e=>{
const btn=e.target.closest('button');if(!btn)return;
document.querySelectorAll('#illTabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');illType=btn.dataset.ill;
document.getElementById('illType').textContent=btn.textContent;
draw();
};

document.getElementById('btnToggle').onclick=()=>{animating=!animating;document.getElementById('btnToggle').textContent=animating?'⏸ 暂停':'▶ 动画';if(animating)animate();};
document.getElementById('btnScreenshot').onclick=()=>{
const link=document.createElement('a');link.download='illusion.png';link.href=canvas.toDataURL();link.click();
};

document.getElementById('speedRange').oninput=function(){speed=+this.value;document.getElementById('speedVal').textContent=this.value;};
document.getElementById('densityRange').oninput=function(){density=+this.value;document.getElementById('densVal').textContent=this.value;draw();};
document.getElementById('colorShift').oninput=function(){colorShift=+this.value;document.getElementById('colorVal').textContent=this.value+'°';draw();};

draw();animate();
</script>
</body>
</html>
