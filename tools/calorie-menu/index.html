const categories = ["全部","主食","肉类","蔬菜","水果","零食","饮料","快餐","乳制品"];
const meals = [
  {id:"breakfast",label:"早餐",icon:"🌅"},
  {id:"lunch",label:"午餐",icon:"☀️"},
  {id:"dinner",label:"晚餐",icon:"🌙"},
  {id:"snacks",label:"零食",icon:"🍪"},
];
let today = new Date().toISOString().split("T")[0];
let plate = [];
let dailyGoal = 2000;
let activeCat = "全部";
let selectedMeal = "lunch";
let searchQuery = "";
function init(){
  loadPlate();
  renderCatTabs();
  renderFoodList();
  renderGoalSelector();
  renderPlate();
  renderHistory();
  document.getElementById("modalOverlay").addEventListener("click",function(e){
    if(e.target===this) closeModal();
  });
}
document.addEventListener("DOMContentLoaded",init);
function getStorageKey(date){return "calorie-plate-"+date}
function loadPlate(){
  let key = getStorageKey(today);
  let raw = localStorage.getItem(key);
  plate = raw ? JSON.parse(raw) : [];
}
function savePlate(){localStorage.setItem(getStorageKey(today),JSON.stringify(plate))}
function saveHistory(date,kcal){
  let hist = JSON.parse(localStorage.getItem("calorie-history")||"{}");
  hist[date] = kcal;
  localStorage.setItem("calorie-history",JSON.stringify(hist));
}
function getHistory(){
  return JSON.parse(localStorage.getItem("calorie-history")||"{}");
}
function densityClass(kcal100){
  if(kcal100<80) return "low";
  if(kcal100<200) return "medium";
  return "high";
}
function densityLabel(kcal100){
  if(kcal100<80) return "低热量";
  if(kcal100<200) return "中热量";
  return "高热量";
}
function renderCatTabs(){
  let tabs = document.getElementById("catTabs");
  tabs.innerHTML = categories.map(c=>{
    let cls = c===activeCat?"cat-tab active":"cat-tab";
    return `<span class="${cls}" onclick="selectCat('${c}')">${c}</span>`;
  }).join("");
}
function selectCat(cat){
  activeCat = cat;
  renderCatTabs();
  renderFoodList();
}
function renderFoodList(){
  let query = (document.getElementById("searchInput").value||"").trim().toLowerCase();
  searchQuery = query;
  let filtered = foodDB;
  if(activeCat!=="全部") filtered = filtered.filter(f=>f.cat===activeCat);
  if(query){
    filtered = filtered.filter(f=>
      f.name.toLowerCase().includes(query) ||
      f.cat.toLowerCase().includes(query)
    );
  }
  let container = document.getElementById("foodList");
  if(filtered.length===0){
    container.innerHTML = `<div class="no-results">未找到匹配的食物</div>`;
    return;
  }
  if(activeCat==="全部" && !query){
    let html = "";
    let cats = ["主食","肉类","蔬菜","水果","零食","饮料","快餐","乳制品"];
    cats.forEach(cat=>{
      let items = filtered.filter(f=>f.cat===cat);
      if(items.length===0) return;
      html += `<div class="section-title">${cat} (${items.length})</div>`;
      html += `<div class="food-grid">${items.map(f=>foodCard(f)).join("")}</div>`;
    });
    container.innerHTML = html;
  } else {
    container.innerHTML = `
      <div class="section-title">${activeCat==="全部" && query?"搜索结果":activeCat} (${filtered.length})</div>
      <div class="food-grid">${filtered.map(f=>foodCard(f)).join("")}</div>
    `;
  }
}
function foodCard(f){
  let dcls = densityClass(f.kcal100);
  let dlbl = densityLabel(f.kcal100);
  return `<div class="food-card" onclick="openDetail(${f.id})">
    <div class="food-name">${f.name}</div>
    <div class="food-info">
      <span class="food-kcal">${f.kcal100}</span>
      <span class="food-unit">kcal/100g</span>
    </div>
    <div class="food-per-serving">${f.servingName}: <b>约${Math.round(f.kcal100*f.serving/100)} kcal</b></div>
    <span class="density-tag density-${dcls}">${dlbl}</span>
  </div>`;
}
function openDetail(id){
  let f = foodDB.find(f=>f.id===id);
  if(!f) return;
  let servingKcal = Math.round(f.kcal100 * f.serving / 100);
  document.getElementById("modalContent").innerHTML = `
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2>${f.name}</h2>
    <span class="cat-badge">${f.cat}</span>
    <div class="detail-row"><span class="label">每100克热量</span><span class="value">${f.kcal100} kcal</span></div>
    <div class="detail-row"><span class="label">每份(${f.servingName})</span><span class="value">${servingKcal} kcal</span></div>
    <div class="detail-row"><span class="label">热量密度</span><span class="value density-tag density-${densityClass(f.kcal100)}">${densityLabel(f.kcal100)}</span></div>
    <div class="portion-input">
      <label>食用量 (克)</label>
      <input type="number" id="portionGrams" value="${f.serving}" min="1" max="5000"
        oninput="updateModalKcal(${f.id},this.value)">
      <div class="quick-grams">
        ${[50,100,150,200,300,500].map(g=>`<span class="gram-chip${g===f.serving?' active':''}" onclick="setGram(${g})">${g}g</span>`).join("")}
      </div>
      <div style="margin-top:8px;font-size:13px;color:var(--text-secondary);text-align:center">
        该份量热量: <b style="color:var(--accent)" id="modalCalDisplay">${servingKcal} kcal</b>
      </div>
    </div>
    <div style="font-size:13px;color:var(--text-secondary);margin-top:12px">添加到餐盘:</div>
    <div class="meal-select">
      ${meals.map(m=>{
        let sel = selectedMeal===m.id?" selected":"";
        return `<div class="meal-option${sel}" onclick="selectMealInModal('${m.id}')" id="mealOpt_${m.id}">${m.icon} ${m.label}</div>`;
      }).join("")}
    </div>
    <button class="add-btn" onclick="addToPlate(${f.id})">添加到今日餐盘</button>
  `;
  document.getElementById("modalOverlay").style.display = "flex";
}
function closeModal(){
  document.getElementById("modalOverlay").style.display = "none";
  selectedMeal = "lunch";
}
function setGram(g){
  document.getElementById("portionGrams").value = g;
  document.querySelectorAll(".gram-chip").forEach(c=>c.classList.remove("active"));
  event.target.classList.add("active");
  let input = document.getElementById("portionGrams");
  let id = parseInt(input.getAttribute("oninput").match(/\d+/)[0]);
  updateModalKcal(id, g);
}
function updateModalKcal(foodId, grams){
  let f = foodDB.find(f=>f.id===foodId);
  let kcal = Math.round(f.kcal100 * grams / 100);
  let el = document.getElementById("modalCalDisplay");
  if(el) el.textContent = kcal + " kcal";
}
function selectMealInModal(mealId){
  selectedMeal = mealId;
  meals.forEach(m=>{
    document.getElementById("mealOpt_"+m.id).classList.toggle("selected",m.id===mealId);
  });
}
function addToPlate(foodId){
  let f = foodDB.find(f=>f.id===foodId);
  let grams = parseInt(document.getElementById("portionGrams").value) || f.serving;
  let kcal = Math.round(f.kcal100 * grams / 100);
  plate.push({foodId, name:f.name, cat:f.cat, kcal100:f.kcal100, grams, kcal, meal:selectedMeal});
  savePlate();
  saveHistory(today, getTotalKcal());
  closeModal();
  renderPlate();
  renderHistory();
  showToast(`已添加 ${f.name} (${grams}g, ${kcal}kcal) 到${meals.find(m=>m.id===selectedMeal).label}`);
}
function renderGoalSelector(){
  let goals = [1500,1800,2000,2200,2500,3000];
  let html = goals.map(g=>{
    let cls = dailyGoal===g?"goal-option active":"goal-option";
    return `<span class="${cls}" onclick="setGoal(${g})">${g} kcal</span>`;
  }).join("");
  document.getElementById("goalSelector").innerHTML = html;
}
function setGoal(g){
  dailyGoal = g;
  renderGoalSelector();
  renderPlate();
}
function getTotalKcal(){return plate.reduce((s,i)=>s+i.kcal,0)}
function getMealKcal(mealId){
  return plate.filter(i=>i.meal===mealId).reduce((s,i)=>s+i.kcal,0);
}
function renderPlate(){
  let total = getTotalKcal();
  let pct = Math.min(total/dailyGoal*100, 100);
  document.getElementById("consumedKcal").textContent = total + " kcal";
  document.getElementById("goalDisplay").textContent = "/ " + dailyGoal + " kcal";
  let fill = document.getElementById("progressFill");
  fill.style.width = pct + "%";
  fill.classList.toggle("over", total > dailyGoal);
  let runMin = Math.round(total / 8.5);
  document.getElementById("exerciseMinutes").textContent = runMin;
  let breakdownDiv = document.getElementById("mealBreakdown");
  let breakdownHtml = meals.map(m=>{
    let mkcal = getMealKcal(m.id);
    let items = plate.filter(i=>i.meal===m.id);
    return `<div class="meal-group">
      <div class="meal-label">${m.icon} ${m.label}</div>
      <div class="meal-kcal">${mkcal} kcal</div>
      <div class="meal-items">${items.map(i=>i.name).join("、")||"—"}</div>
      <div class="meal-count">${items.length} 种食物</div>
    </div>`;
  }).join("");
  breakdownDiv.innerHTML = breakdownHtml;
  let listDiv = document.getElementById("plateList");
  if(plate.length===0){
    listDiv.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🍽️</div>
        <p>点击食物卡片添加到今日餐盘</p>
      </div>`;
  } else {
    listDiv.innerHTML = plate.map((item,idx)=>{
      let mealInfo = meals.find(m=>m.id===item.meal);
      return `<div class="plate-item">
        <div class="item-info">
          <div class="item-name">${item.name} <span class="meal-tag">${mealInfo.icon} ${mealInfo.label}</span></div>
          <div class="item-meta">${item.grams}g · ${item.kcal100} kcal/100g</div>
        </div>
        <span class="item-kcal">${item.kcal} kcal</span>
        <button class="remove-btn" onclick="removeFromPlate(${idx})" title="移除">&times;</button>
      </div>`;
    }).join("");
  }
}
function removeFromPlate(idx){
  showToast("已移除 " + plate[idx].name);
  plate.splice(idx,1);
  savePlate();
  saveHistory(today,getTotalKcal());
  renderPlate();
  renderHistory();
}
function clearPlate(){
  if(plate.length===0 || !confirm("确定清空今日餐盘吗？")) return;
  plate = [];
  savePlate();
  saveHistory(today,0);
  renderPlate();
  renderHistory();
  showToast("已清空今日餐盘");
}
function renderHistory(){
  let hist = getHistory();
  let dates = Object.keys(hist).sort().reverse().filter(d=>d!==today);
  let panel = document.getElementById("historyPanel");
  let listDiv = document.getElementById("historyList");
  if(dates.length===0){
    panel.style.display = "none";
    return;
  }
  panel.style.display = "block";
  listDiv.innerHTML = dates.slice(0,14).map(d=>{
    let weekDays = ["日","一","二","三","四","五","六"];
    let dt = new Date(d);
    let wk = weekDays[dt.getDay()];
    return `<div class="history-item">
      <span class="hist-date">${d} (周${wk})</span>
      <span class="hist-kcal">${hist[d]} kcal</span>
      <button class="hist-load" onclick="loadHistoryDay('${d}')">加载</button>
    </div>`;
  }).join("");
}
function loadHistoryDay(date){
  let key = getStorageKey(date);
  let raw = localStorage.getItem(key);
  if(raw){
    today = date;
    plate = JSON.parse(raw);
    savePlate();
    renderPlate();
    renderHistory();
    showToast("已加载 " + date + " 的记录");
  }
}
function showToast(msg){
  let t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  t.classList.remove("vanish");
  clearTimeout(t._timeout);
  t._timeout = setTimeout(()=>{
    t.classList.add("vanish");
    setTimeout(()=>{t.style.display="none"},300);
  },1800);
}
</script>
<script src="../i18n.js" defer>
document.getElementById("searchInput").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();clearPlate();}});

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
