<script>
var data={
overview:{title:'中国刺绣总览',content:'<p>中国刺绣是中国优秀的民族传统工艺之一，至少有二三千年的历史。刺绣在中国文化中占有重要地位，是国家级非物质文化遗产。</p><h4 style="margin-top:16px">基本特点</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px"><div class="item" style="cursor:default"><h4>🧵 历史悠久</h4><p class="desc">刺绣起源可追溯到殷商时期，至今已有三千年历史。汉代已出现专业绣工，唐宋达到高峰。</p></div><div class="item" style="cursor:default"><h4>🎨 品种丰富</h4><p class="desc">中国有四大名绣、众多地方绣种，各具特色。包括苏绣、湘绣、蜀绣、粤绣等。</p></div><div class="item" style="cursor:default"><h4>✂️ 技法精湛</h4><p class="desc">针法多达数百种，有平绣、乱针绣、打籽绣、盘金绣等，技艺精湛。</p></div><div class="item" style="cursor:default"><h4>🏛️ 文化内涵</h4><p class="desc">刺绣图案蕴含吉祥寓意，如龙凤呈祥、花开富贵、福禄寿喜等。</p></div></div>'},
famous:{title:'四大名绣',items:[
{name:'苏绣',region:'江苏苏州',history:'起源于苏州，有2000多年历史',features:'以精细雅洁著称，图案秀丽，色彩明快。针法多达40余种，以乱针绣最为著名。双面绣是苏绣的代表技法。',representative:'《猫》《金鱼》《牡丹》',tags:['精细','双面绣','乱针绣']},
{name:'湘绣',region:'湖南长沙',history:'起源于湖南民间刺绣，有2000多年历史',features:'以写实风格著称，尤以狮虎题材最佳。使用鬅毛针表现动物皮毛质感，色彩鲜艳，形象逼真。',representative:'《狮》《虎》《芙蓉鲤鱼》',tags:['写实','鬅毛针','色彩鲜艳']},
{name:'蜀绣',region:'四川成都',history:'与蜀锦齐名，有3000多年历史',features:'以软缎和彩丝为主要原料，针法严谨，针脚平齐。以花卉、熊猫、锦鲤为特色题材。',representative:'《芙蓉鲤鱼》《熊猫》《牡丹》',tags:['软缎','平齐','精细']},
{name:'粤绣',region:'广东广州',history:'起源于唐代，有1000多年历史',features:'构图饱满，色彩浓艳，对比强烈。善于用金银线盘金刺绣，富丽堂皇。以龙凤、花鸟为主要题材。',representative:'《百鸟朝凤》《龙凤呈祥》',tags:['金银线','富丽','饱满']}
]},
others:{title:'其他绣种',items:[
{name:'京绣',region:'北京',desc:'宫廷绣，以皇家气派著称，用料奢华，色彩华丽。代表作品有龙袍、凤袍等宫廷服饰。',tags:['宫廷','奢华']},
{name:'汴绣',region:'河南开封',desc:'又名宋绣，源于北宋都城汴京。以仿古书画见长，针法细腻，古朴典雅。',tags:['仿古','典雅']},
{name:'瓯绣',region:'浙江温州',desc:'以构图精巧、色彩明丽著称。善于表现戏曲人物和花卉，有"画绣"之称。',tags:['画绣','明丽']},
{name:'杭绣',region:'浙江杭州',desc:'又名织锦，以金银线绣著称。图案富丽堂皇，常用于寺庙装饰和戏曲服装。',tags:['金银线','织锦']},
{name:'鲁绣',region:'山东',desc:'以粗犷豪放著称，用线较粗，色彩对比强烈。以民间吉祥图案为主。',tags:['粗犷','民间']},
{name:'苗绣',region:'贵州/湖南',desc:'苗族传统刺绣，色彩鲜艳，图案神秘，蕴含苗族的历史记忆和宗教信仰。',tags:['民族','神秘']}
]},
stitches:{title:'针法技艺',content:'<p>中国刺绣针法多达数百种，以下介绍主要针法：</p>',items:[
{name:'平绣',icon:'➖',desc:'最基本的针法，线条平行排列，适合大面积填色。要求针脚整齐，线面平滑。',tags:['基础']},
{name:'乱针绣',icon:'🔀',desc:'苏绣创新针法，由杨守玉创立。长短交叉的线条层层叠加，类似油画效果。',tags:['苏绣','创新']},
{name:'打籽绣',icon:'⭕',desc:'用线绕成小圈固定，形成颗粒状。常用于花蕊、动物眼睛等细节。',tags:['装饰']},
{name:'盘金绣',icon:'✨',desc:'用金银线盘旋钉缝，形成金色图案。常用于龙凤、云纹等宫廷图案。',tags:['金银线','宫廷']},
{name:'锁绣',icon:'🔗',desc:'针脚连锁排列，形成链条状。常用于轮廓勾勒和图案填充。',tags:['轮廓']},
{name:'施针绣',icon:'📐',desc:'分层施针，层层递进，适合表现渐变色彩和立体效果。',tags:['渐变','立体']},
{name:'戳纱绣',icon:'🔲',desc:'在纱网上绣制，图案通透。常用于扇面、屏风等装饰。',tags:['通透','装饰']},
{name:'双面绣',icon:'🪞',desc:'正反两面图案相同的高难度技法。苏绣的代表性技法。',tags:['高级','苏绣']}
]},
culture:{title:'文化价值',content:'<div class="item" style="cursor:default"><h4>📜 历史价值</h4><p class="desc">刺绣记录了中国服饰演变的历史，是研究古代社会生活的重要实物资料。出土的汉代刺绣、唐代刺绣等文物，展示了不同时代的审美风格。</p></div><div class="item" style="cursor:default"><h4>🎨 艺术价值</h4><p class="desc">刺绣是一门综合艺术，融合了绘画、设计、色彩学等知识。优秀刺绣作品本身就是艺术品，具有很高的收藏价值。</p></div><div class="item" style="cursor:default"><h4>🏫 教育价值</h4><p class="desc">刺绣被列入国家级非物质文化遗产，各地设立传习所培养传承人。刺绣也进入学校课程，培养学生的耐心和审美能力。</p></div><div class="item" style="cursor:default"><h4>🌍 国际影响</h4><p class="desc">中国刺绣在国际上享有盛誉，曾多次作为国礼赠送外国元首。苏绣双面绣《猫》曾获国际大奖，是中国文化的重要名片。</p></div>'},
quiz:{title:'中国刺绣知识测验',questions:[
{q:'以下哪个不属于四大名绣？',options:['苏绣','湘绣','汴绣','粤绣'],answer:2,explain:'四大名绣是苏绣、湘绣、蜀绣、粤绣。汴绣虽然也很著名，但不在四大名绣之列。'},
{q:'苏绣最著名的技法是？',options:['鬅毛针','乱针绣','打籽绣','盘金绣'],answer:1,explain:'乱针绣是苏绣最著名的创新技法，由杨守玉创立，类似油画效果。'},
{q:'以金银线绣著称的是？',options:['苏绣','湘绣','粤绣','蜀绣'],answer:2,explain:'粤绣以金银线盘金刺绣著称，构图饱满，色彩浓艳，富丽堂皇。'},
{q:'以表现动物皮毛著称的针法是？',options:['平绣','乱针绣','鬅毛针','锁绣'],answer:2,explain:'鬅毛针是湘绣的特色针法，专门用于表现动物皮毛的质感，尤以狮虎题材最佳。'},
{q:'双面绣是哪种绣的代表技法？',options:['苏绣','湘绣','蜀绣','粤绣'],answer:0,explain:'双面绣是苏绣的代表性技法，正反两面图案相同，难度极高。'}]}
};
function switchTab(name,el){
document.querySelectorAll('.tab-bar .tab').forEach(function(t){t.classList.remove('active')});
el.classList.add('active');
renderContent(name);
}
function renderContent(name){
var d=data[name];
var html='<div class="card"><h3>'+d.title+'</h3>';
if(d.content) html+=d.content;
if(d.items){
if(name==='famous'){
d.items.forEach(function(item){
html+='<div class="item"><h4>'+item.name+'</h4><div class="meta">'+item.region+' · '+item.history+'</div><div class="desc">'+item.features+'</div><div class="desc"><strong>代表作品：</strong>'+item.representative+'</div><div style="margin-top:8px">'+item.tags.map(function(t){return '<span class="tag" style="background:rgba(59,130,246,.15);color:var(--blue)">'+t+'</span>'}).join('')+'</div></div>';
});
}else if(name==='stitches'){
d.items.forEach(function(item){
html+='<div class="item"><div style="display:flex;align-items:center;gap:12px"><span style="font-size:2rem">'+item.icon+'</span><div><h4>'+item.name+'</h4><div class="desc">'+item.desc+'</div></div></div><div style="margin-top:8px">'+item.tags.map(function(t){return '<span class="tag" style="background:rgba(59,130,246,.15);color:var(--blue)">'+t+'</span>'}).join('')+'</div></div>';
});
}else{
d.items.forEach(function(item){
html+='<div class="item"><h4>'+item.name+'</h4><div class="meta">'+item.region+'</div><div class="desc">'+item.desc+'</div><div style="margin-top:8px">'+item.tags.map(function(t){return '<span class="tag" style="background:rgba(59,130,246,.15);color:var(--blue)">'+t+'</span>'}).join('')+'</div></div>';
});
}
}
if(d.questions){
d.questions.forEach(function(q,i){
html+='<div class="item" style="cursor:default" id="q'+i+'"><h4>'+q.q+'</h4>';
q.options.forEach(function(opt,j){
html+='<div class="quiz-option" onclick="checkAnswer('+i+','+j+','+q.answer+',this)" style="display:block;padding:10px;margin:6px 0;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer">'+String.fromCharCode(65+j)+'. '+opt+'</div>';
});
html+='<div class="explain" style="display:none;margin-top:8px;padding:8px;background:rgba(59,130,246,.1);border-radius:8px;font-size:.85rem">'+q.explain+'</div></div>';
});
}
html+='</div>';
document.getElementById('content').innerHTML=html;
}
function checkAnswer(qi,oi,correct,el){
var q=document.getElementById('q'+qi);
var opts=q.querySelectorAll('div[onclick]');
if(opts[0]&&opts[0].style.borderColor) return;
opts.forEach(function(o,i){
if(i===correct) o.style.borderColor='var(--green)';
else if(i===oi) o.style.borderColor='var(--red)';
});
q.querySelector('.explain').style.display='block';
}
renderContent('overview');
