<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 YouTube缩略图制作器</title>
<meta name="description" content="YouTube缩略图制作器，一键生成精美视频封面">
<style>
:root{--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tag-grid{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);cursor:pointer;font-size:13px;transition:all .2s;user-select:none}
.tag:hover{border-color:var(--accent);transform:translateY(-1px)}
.tag.active{background:var(--accent);color:var(--text);border-color:var(--accent);font-weight:600}
.input-group{margin-bottom:12px}
.input-group:last-child{margin-bottom:0}
.input-group label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px;font-weight:500}
.input-group input,.input-group textarea,.input-group select{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;outline:none;transition:border-color .2s;font-family:inherit}
.input-group input:focus,.input-group select:focus{border-color:var(--accent)}
.color-row{display:flex;gap:8px;align-items:center}
.color-swatch{width:36px;height:36px;border-radius:8px;border:2px solid var(--border);cursor:pointer;transition:all .2s}
.color-swatch:hover{transform:scale(1.1)}
.color-swatch.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.3)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.canvas-wrap{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#000;display:flex;justify-content:center}
.canvas-wrap canvas{width:100%;height:auto}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type="range"]{flex:1}
.slider-row span{font-size:13px;color:var(--text-secondary);min-width:36px;text-align:right}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🎬 YouTube缩略图制作器">
<meta property="og:description" content="YouTube缩略图制作器，一键生成精美视频封面">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/youtube-thumbnail-maker/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🎬 YouTube缩略图制作器</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">🎯 快速模板</div>
    <div class="tag-grid" id="templates">
      <div class="tag active" data-val="gaming">🎮 游戏</div>
      <div class="tag" data-val="tutorial">📚 教程</div>
      <div class="tag" data-val="vlog">🎥 Vlog</div>
      <div class="tag" data-val="tech">💻 科技</div>
      <div class="tag" data-val="food">🍜 美食</div>
      <div class="tag" data-val="travel">✈️ 旅行</div>
      <div class="tag" data-val="custom">🎨 自定义</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">✏️ 文字内容</div>
    <div class="input-group">
      <label>主标题</label>
      <input type="text" id="mainTitle" value="10个必学技巧" placeholder="输入主标题...">
    </div>
    <div class="input-group">
      <label>副标题</label>
      <input type="text" id="subTitle" value="改变你的一生" placeholder="输入副标题...">
    </div>
  </div>

  <div class="card">
    <div class="card-title">🎨 样式设置</div>
    <div class="input-group">
      <label>背景颜色</label>
      <div class="color-row" id="bgColors">
        <div class="color-swatch active" data-val="#ff4444" style="background:#ff4444"></div>
        <div class="color-swatch" data-val="#00aa55" style="background:#00aa55"></div>
        <div class="color-swatch" data-val="#4488ff" style="background:#4488ff"></div>
        <div class="color-swatch" data-val="#ff8800" style="background:#ff8800"></div>
        <div class="color-swatch" data-val="#aa44ff" style="background:#aa44ff"></div>
        <div class="color-swatch" data-val="#222222" style="background:#222222"></div>
        <div class="color-swatch" data-val="#1a1a2e" style="background:linear-gradient(135deg,#667eea,#764ba2)"></div>
        <div class="color-swatch" data-val="#0f3460" style="background:linear-gradient(135deg,#f093fb,#f5576c)"></div>
      </div>
    </div>
    <div class="input-group">
      <label>标题文字颜色</label>
      <div class="color-row" id="textColors">
        <div class="color-swatch active" data-val="#ffffff" style="background:#ffffff;border-color:#ccc"></div>
        <div class="color-swatch" data-val="#ffff00" style="background:#ffff00"></div>
        <div class="color-swatch" data-val="#00ffff" style="background:#00ffff"></div>
        <div class="color-swatch" data-val="#ff0000" style="background:#ff0000"></div>
      </div>
    </div>
    <div class="input-group">
      <label>标题大小</label>
      <div class="slider-row">
        <input type="range" id="fontSize" min="30" max="80" value="56">
        <span id="fontSizeVal">56px</span>
      </div>
    </div>
    <div class="input-group">
      <label>文字效果</label>
      <div class="tag-grid" id="effects">
        <div class="tag active" data-val="shadow">阴影</div>
        <div class="tag" data-val="stroke">描边</div>
        <div class="tag" data-val="neon">霓虹</div>
        <div class="tag" data-val="none">无效果</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🖼️ 预览 (1280×720)</div>
    <div class="canvas-wrap">
      <canvas id="thumb" width="1280" height="720"></canvas>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="downloadBtn">💾 下载PNG</button>
    <button class="btn btn-outline" id="refreshBtn">🔄 刷新</button>
  </div>

  <footer>© 2025 Gary's Tools | garyy.top</footer>
</div>
<div class="toast" id="toast"></div>

<script>
function toggleTheme(){var h=document.documentElement;var t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('garyy_theme',t)}
(function(){var s=localStorage.getItem('garyy_theme');if(s==='dark'){document.documentElement.setAttribute('data-theme','dark');document.querySelector('.theme-toggle').textContent='☀️'}})();

function initTags(id,cb){var c=document.getElementById(id);c.addEventListener('click',function(e){var t=e.target.closest('.tag');if(!t)return;c.querySelectorAll('.tag').forEach(function(x){x.classList.remove('active')});t.classList.add('active');if(cb)cb()})}
function initSwatches(id,cb){var c=document.getElementById(id);c.addEventListener('click',function(e){var t=e.target.closest('.color-swatch');if(!t)return;c.querySelectorAll('.color-swatch').forEach(function(x){x.classList.remove('active')});t.classList.add('active');if(cb)cb()})}

var presetBgs={
  gaming:'linear-gradient(135deg,#0f0c29,#302b63,#24243e)',
  tutorial:'linear-gradient(135deg,#667eea,#764ba2)',
  vlog:'linear-gradient(135deg,#f093fb,#f5576c)',
  tech:'linear-gradient(135deg,#0c3547,#11998e)',
  food:'linear-gradient(135deg,#f7971e,#ffd200)',
  travel:'linear-gradient(135deg,#1cb5e0,#000851)',
  custom:'#ff4444'
};
var presetTitleColors={gaming:'#00ffff',tutorial:'#ffffff',vlog:'#ffffff',tech:'#00ff88',food:'#ffffff',travel:'#ffffff',custom:'#ffffff'};
var presetTitles={gaming:'GAME ON!',tutorial:'10个必学技巧',vlog:'我的日常VLOG',tech:'科技改变生活',food:'美食探店',travel:'旅行日记',custom:'自定义标题'};
var presetSubs={gaming:'高能预警',tutorial:'改变你的一生',vlog:'快来跟我一起',tech:'最新科技评测',food:'这家店真的绝了',travel:'说走就走',custom:'副标题内容'};

var canvas=document.getElementById('thumb'),ctx=canvas.getContext('2d');

function render(){
  var template=document.querySelector('#templates .tag.active').dataset.val;
  var mainT=document.getElementById('mainTitle').value||'';
  var subT=document.getElementById('subTitle').value||'';
  var bgColor=document.querySelector('#bgColors .color-swatch.active').dataset.val;
  var txtColor=document.querySelector('#textColors .color-swatch.active').dataset.val;
  var fontSize=parseInt(document.getElementById('fontSize').value);
  var effect=document.querySelector('#effects .tag.active').dataset.val;

  if(template!=='custom'){
    bgColor=presetBgs[template]||bgColor;
    txtColor=presetTitleColors[template]||txtColor;
  }

  ctx.clearRect(0,0,1280,720);
  if(bgColor.includes('linear')){
    var g=ctx.createLinearGradient(0,0,1280,720);
    var stops=bgColor.match(/#[0-9a-f]{6}/gi);
    g.addColorStop(0,stops[0]);g.addColorStop(1,stops[1]);
    ctx.fillStyle=g;
  }else{
    ctx.fillStyle=bgColor;
  }
  ctx.fillRect(0,0,1280,720);

  ctx.textAlign='center';ctx.textBaseline='middle';
  var titleY=subT?300:360;

  if(effect==='neon'){
    ctx.shadowColor=txtColor;ctx.shadowBlur=30;
  }else if(effect==='shadow'){
    ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=10;ctx.shadowOffsetX=4;ctx.shadowOffsetY=4;
  }else{
    ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  }

  ctx.font='bold '+fontSize+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle=txtColor;
  if(effect==='stroke'){
    ctx.strokeStyle='#000';ctx.lineWidth=8;ctx.strokeText(mainT,640,titleY);
  }
  ctx.fillText(mainT,640,titleY);

  ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  if(subT){
    ctx.font='bold '+(fontSize*0.45)+'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle=txtColor;ctx.globalAlpha=0.9;
    ctx.fillText(subT,640,titleY+fontSize*0.8);
    ctx.globalAlpha=1;
  }

  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.beginPath();ctx.ellipse(900,100,300,200,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(200,600,250,180,0.5,0,Math.PI*2);ctx.fill();
}

initTags('templates',function(){
  var t=document.querySelector('#templates .tag.active').dataset.val;
  if(t!=='custom'){
    document.getElementById('mainTitle').value=presetTitles[t]||'';
    document.getElementById('subTitle').value=presetSubs[t]||'';
  }
  render();
});
initSwatches('bgColors',render);initSwatches('textColors',render);initTags('effects',render);
document.getElementById('fontSize').addEventListener('input',function(){document.getElementById('fontSizeVal').textContent=this.value+'px';render()});
document.getElementById('mainTitle').addEventListener('input',render);
document.getElementById('subTitle').addEventListener('input',render);
document.getElementById('refreshBtn').addEventListener('click',render);

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
document.getElementById('downloadBtn').addEventListener('click',function(){
  var link=document.createElement('a');link.download='youtube-thumbnail.png';link.href=canvas.toDataURL('image/png');link.click();
  showToast('✅ 已下载缩略图');
});

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:.8;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=.8">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
