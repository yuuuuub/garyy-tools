<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字测试</title>
<meta name="description" content="汉字读音、释义、写法在线测试工具">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.suc{background:var(--success)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.question-card{text-align:center;padding:30px;background:var(--bg);border-radius:var(--radius);border:2px solid var(--border);margin:12px 0}
.question-card .char{font-size:3.5rem;font-weight:700;margin-bottom:8px}
.question-card .hint{font-size:.9rem;color:var(--text2)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.option-btn{padding:14px;background:var(--bg);border:2px solid var(--border);border-radius:8px;cursor:pointer;font-size:1rem;text-align:center;transition:all .2s;color:var(--text)}
.option-btn:hover{border-color:var(--accent);background:rgba(59,130,246,.1)}
.option-btn.correct{border-color:var(--success);background:rgba(34,197,94,.15);color:var(--success)}
.option-btn.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:var(--danger)}
.option-btn.disabled{pointer-events:none;opacity:.7}
.progress-bar{height:6px;background:var(--bg);border-radius:3px;margin:12px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.result-card{text-align:center;padding:30px;background:var(--bg);border-radius:var(--radius);border:2px solid var(--accent)}
.result-card .score{font-size:3rem;font-weight:700;color:var(--accent)}
.result-card .label{font-size:.9rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="汉字测试">
<meta property="og:description" content="汉字读音、释义、写法在线测试">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📝 汉字测试</h1><p>测试你的汉字读音和释义知识</p></div>

<div id="configArea" class="cd"><h2>选择测试模式</h2>
<div class="bg" style="margin-top:0">
<button onclick="startTest('pinyin')">🔤 读音测试</button>
<button onclick="startTest('meaning')">📖 释义测试</button>
<button onclick="startTest('reverse')">🔄 看义选字</button>
</div>
<div style="margin-top:12px">
<label style="font-size:.85rem;color:var(--text2)">题目数量</label>
<select id="qCount" style="width:auto;margin-top:4px">
<option value="5">5题</option><option value="10" selected>10题</option><option value="20">20题</option>
</select>
</div></div>

<div id="testArea" class="hidden">
<div class="cd">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<span id="qNum" style="font-size:.9rem;color:var(--text2)"></span>
<span id="scoreDisplay" style="font-weight:700;color:var(--accent)"></span>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div id="questionArea"></div>
<div id="optionsArea" class="options"></div>
<div class="bg" style="justify-content:center;margin-top:16px">
<button id="nextBtn" class="hidden" onclick="nextQuestion()">下一题 →</button>
</div></div>
</div>

<div id="resultArea" class="hidden"></div>

<div class="cd"><h2>历史成绩</h2>
<div class="gr" id="historyStats"></div>
<div id="historyList"></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const quizDB=[
{ch:'一',py:'yī',m:'最小的正整数'},{ch:'二',py:'èr',m:'一加一的和'},{ch:'三',py:'sān',m:'二加一的和'},
{ch:'人',py:'rén',m:'能使用工具劳动的动物'},{ch:'大',py:'dà',m:'超过一般'},{ch:'小',py:'xiǎo',m:'体积数量不大'},
{ch:'中',py:'zhōng',m:'里面、中间'},{ch:'国',py:'guó',m:'国家'},{ch:'好',py:'hǎo',m:'优点多的'},
{ch:'明',py:'míng',m:'亮，与暗相对'},{ch:'林',py:'lín',m:'成片的树木'},{ch:'森',py:'sēn',m:'树木众多'},
{ch:'花',py:'huā',m:'植物的繁殖器官'},{ch:'草',py:'cǎo',m:'草本植物'},{ch:'想',py:'xiǎng',m:'思考、思索'},
{ch:'思',py:'sī',m:'考虑'},{ch:'问',py:'wèn',m:'请人解答'},{ch:'间',py:'jiān',m:'两者之间'},
{ch:'同',py:'tóng',m:'一样，无差异'},{ch:'龙',py:'lóng',m:'传说中的动物'},{ch:'凤',py:'fèng',m:'凤凰'},
{ch:'水',py:'shuǐ',m:'无色透明液体'},{ch:'火',py:'huǒ',m:'燃烧的光焰'},{ch:'山',py:'shān',m:'高耸的地面'},
{ch:'石',py:'shí',m:'矿物质硬块'},{ch:'田',py:'tián',m:'种植农作物的地'},{ch:'口',py:'kǒu',m:'嘴'},
{ch:'日',py:'rì',m:'太阳'},{ch:'月',py:'yuè',m:'月亮'},{ch:'木',py:'mù',m:'树木'},
{ch:'金',py:'jīn',m:'金属元素'},{ch:'马',py:'mǎ',m:'哺乳动物'},{ch:'鸟',py:'niǎo',m:'有羽毛能飞的动物'},
{ch:'鱼',py:'yú',m:'水生脊椎动物'},{ch:'牛',py:'niú',m:'哺乳动物'},{ch:'羊',py:'yáng',m:'哺乳动物'},
{ch:'爱',py:'ài',m:'深厚真挚的感情'},{ch:'学',py:'xué',m:'学习知识'},{ch:'天',py:'tiān',m:'高空'},
{ch:'地',py:'dì',m:'人类活动的所在'},{ch:'家',py:'jiā',m:'住所'},{ch:'树',py:'shù',m:'木本植物'},
{ch:'河',py:'hé',m:'水道通称'},{ch:'海',py:'hǎi',m:'近大陆的水域'},{ch:'红',py:'hóng',m:'鲜血的颜色'},
{ch:'绿',py:'lǜ',m:'蓝黄混合的颜色'},{ch:'风',py:'fēng',m:'空气流动'},{ch:'雨',py:'yǔ',m:'水蒸气凝结降落'},
{ch:'雪',py:'xuě',m:'白色结晶体'},{ch:'春',py:'chūn',m:'四季之首'},{ch:'夏',py:'xià',m:'四季之一'},
{ch:'秋',py:'qiū',m:'四季之一'},{ch:'冬',py:'dōng',m:'四季之一'},{ch:'东',py:'dōng',m:'方向名'},
{ch:'西',py:'xī',m:'方向名'},{ch:'南',py:'nán',m:'方向名'},{ch:'北',py:'běi',m:'方向名'},
{ch:'手',py:'shǒu',m:'人体上肢前端'},{ch:'足',py:'zú',m:'脚'},{ch:'目',py:'mù',m:'眼睛'},
{ch:'耳',py:'ěr',m:'听觉器官'},{ch:'心',py:'xīn',m:'心脏'},{ch:'书',py:'shū',m:'著作'},
{ch:'画',py:'huà',m:'图画'},{ch:'歌',py:'gē',m:'能唱的文词'},{ch:'文',py:'wén',m:'文字'},
{ch:'字',py:'zì',m:'文字的书写符号'},{ch:'男',py:'nán',m:'男性'},{ch:'女',py:'nǚ',m:'女性'},
{ch:'子',py:'zǐ',m:'儿女'},{ch:'父',py:'fù',m:'爸爸'},{ch:'母',py:'mǔ',m:'妈妈'},
{ch:'前',py:'qián',m:'方位词'},{ch:'后',py:'hòu',m:'方位词'},{ch:'左',py:'zuǒ',m:'方位词'},
{ch:'右',py:'yòu',m:'方位词'},{ch:'上',py:'shàng',m:'高处'},{ch:'下',py:'xià',m:'低处'},
{ch:'头',py:'tóu',m:'脑袋'},{ch:'面',py:'miàn',m:'脸'},{ch:'猫',py:'māo',m:'一种哺乳动物'},
{ch:'狗',py:'gǒu',m:'一种哺乳动物'},{ch:'云',py:'yún',m:'水汽在空中凝聚'},
];

let mode='pinyin';let questions=[];let current=0;let score=0;let answered=false;
let history=JSON.parse(localStorage.getItem('ct_history')||'[]');

function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function startTest(m){
  mode=m;const count=parseInt($('qCount').value);
  questions=shuffle(quizDB).slice(0,count);
  current=0;score=0;answered=false;
  $('configArea').classList.add('hidden');
  $('testArea').classList.remove('hidden');
  $('resultArea').classList.add('hidden');
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  const q=questions[current];
  $('qNum').textContent=`第 ${current+1}/${questions.length} 题`;
  $('scoreDisplay').textContent=`得分: ${score}`;
  $('progressFill').style.width=((current)/questions.length*100)+'%';
  $('nextBtn').classList.add('hidden');

  let qHTML='';
  if(mode==='pinyin'){
    qHTML=`<div class="question-card"><div class="char">${q.ch}</div><div class="hint">请选择正确的拼音</div></div>`;
  }else if(mode==='meaning'){
    qHTML=`<div class="question-card"><div class="char">${q.ch}</div><div class="hint">请选择正确的释义</div></div>`;
  }else{
    qHTML=`<div class="question-card"><div style="font-size:1.2rem;color:var(--text2);margin-bottom:8px">${q.m}</div><div class="hint">请选择对应的汉字</div></div>`;
  }
  $('questionArea').innerHTML=qHTML;

  let correct,opts;
  if(mode==='pinyin'){
    correct=q.py;
    const wrongs=shuffle(quizDB.filter(x=>x.py!==q.py)).slice(0,3).map(x=>x.py);
    opts=shuffle([correct,...wrongs]);
  }else if(mode==='meaning'){
    correct=q.m;
    const wrongs=shuffle(quizDB.filter(x=>x.m!==q.m)).slice(0,3).map(x=>x.m);
    opts=shuffle([correct,...wrongs]);
  }else{
    correct=q.ch;
    const wrongs=shuffle(quizDB.filter(x=>x.ch!==q.ch)).slice(0,3).map(x=>x.ch);
    opts=shuffle([correct,...wrongs]);
  }
  $('optionsArea').innerHTML=opts.map(o=>`<div class="option-btn" onclick="checkAnswer(this,'${o.replace(/'/g,"\\'")}','${correct.replace(/'/g,"\\'")}')">${o}</div>`).join('');
}

function checkAnswer(el,chosen,correct){
  if(answered)return;answered=true;
  document.querySelectorAll('.option-btn').forEach(b=>{b.classList.add('disabled');if(b.textContent===correct)b.classList.add('correct')});
  if(chosen===correct){score++;el.classList.add('correct')}else{el.classList.add('wrong')}
  $('scoreDisplay').textContent=`得分: ${score}`;
  $('nextBtn').classList.remove('hidden');
  if(current===questions.length-1)$('nextBtn').textContent='查看结果';
}

function nextQuestion(){
  current++;
  if(current>=questions.length){finishTest();return}
  $('nextBtn').textContent='下一题 →';
  renderQuestion();
}

function finishTest(){
  $('testArea').classList.add('hidden');
  $('resultArea').classList.remove('hidden');
  const pct=Math.round(score/questions.length*100);
  const modeNames={pinyin:'读音测试',meaning:'释义测试',reverse:'看义选字'};
  let grade=pct>=90?'🏆 优秀':pct>=70?'👍 良好':pct>=50?'📚 及格':'💪 继续努力';
  $('resultArea').innerHTML=`<div class="cd"><div class="result-card">
    <div class="score">${score}/${questions.length}</div>
    <div class="label">${grade}</div>
    <div style="font-size:.85rem;color:var(--text2);margin-top:8px">正确率 ${pct}% · ${modeNames[mode]}</div>
    <div class="bg" style="justify-content:center;margin-top:16px">
      <button onclick="startTest('${mode}')">🔄 再来一次</button>
      <button class="sec" onclick="backToConfig()">🏠 返回</button>
    </div>
  </div></div>`;
  history.push({date:new Date().toLocaleDateString(),mode:mode,score:score,total:questions.length,pct:pct});
  localStorage.setItem('ct_history',JSON.stringify(history.slice(-20)));
  renderHistory();
}

function backToConfig(){
  $('configArea').classList.remove('hidden');
  $('testArea').classList.add('hidden');
  $('resultArea').classList.add('hidden');
}

function renderHistory(){
  if(history.length===0){$('historyList').innerHTML='<div style="text-align:center;padding:16px;color:var(--text2)">暂无历史记录</div>';return}
  const avg=Math.round(history.reduce((s,h)=>s+h.pct,0)/history.length);
  const best=Math.max(...history.map(h=>h.pct));
  $('historyStats').innerHTML=`<div class="st"><div class="nm">${history.length}</div><div class="lb">测试次数</div></div><div class="st"><div class="nm">${avg}%</div><div class="lb">平均正确率</div></div><div class="st"><div class="nm">${best}%</div><div class="lb">最高正确率</div></div>`;
  $('historyList').innerHTML=history.slice(-5).reverse().map(h=>`<div style="padding:8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:.9rem"><span>${h.date}</span><span>${h.mode}</span><span style="color:${h.pct>=70?'var(--success)':'var(--danger)'}">${h.score}/${h.total} (${h.pct}%)</span></div>`).join('');
}
renderHistory();
</script>
</body>
</html>
