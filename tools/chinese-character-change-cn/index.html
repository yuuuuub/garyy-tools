<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字变形器</title><meta name="description" content="汉字变形器 - 将汉字变形为各种艺术效果，包括毛笔、印章、篆刻等风格"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select,.input-group textarea{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.preview{min-height:200px;display:flex;align-items:center;justify-content:center;border:2px dashed var(--border);border-radius:12px;margin-top:16px;background:var(--bg);font-size:5rem;padding:30px;text-align:center;word-break:break-all}
.brush{font-family:'楷体','KaiTi',serif;text-shadow:2px 2px 4px rgba(0,0,0,0.3)}
.seal{color:#8B0000;border:3px solid #8B0000;padding:8px 16px;display:inline-block;font-family:'篆书','STZhuan',serif;transform:rotate(-5deg)}
.carved{color:var(--bg);background:var(--text);padding:8px 20px;font-family:'黑体','SimHei',sans-serif;clip-path:polygon(5% 0%,95% 0%,100% 5%,100% 95%,95% 100%,5% 100%,0% 95%,0% 5%)}
.neon{color:#0ff;text-shadow:0 0 10px #0ff,0 0 20px #0ff,0 0 40px #0ff,0 0 80px #0ff}
.vintage{color:#8B4513;font-family:'宋体','SimSun',serif;opacity:0.9;text-shadow:1px 1px 2px rgba(139,69,19,0.5)}
.blood{color:#8B0000;font-family:'草书','STCaiyun',cursive;text-shadow:0 0 10px rgba(139,0,0,0.5)}
.gold{color:#FFD700;font-family:'楷体','KaiTi',serif;text-shadow:0 0 20px rgba(255,215,0,0.5)}
.ice{color:#ADD8E6;font-family:'黑体','SimHei',sans-serif;text-shadow:0 0 15px rgba(173,216,230,0.7)}
.fire{color:#FF4500;font-family:'楷体','KaiTi',serif;text-shadow:0 0 20px rgba(255,69,0,0.7)}
.pixel{color:#0f0;font-family:monospace;font-size:3rem;letter-spacing:4px}
.glow{color:#fff;text-shadow:0 0 20px var(--blue),0 0 40px var(--blue),0 0 60px var(--blue)}
.style-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.style-btn{padding:8px;border:2px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;background:var(--bg);color:var(--text);transition:all .2s}
.style-btn:hover,.style-btn.active{border-color:var(--blue)}
.style-btn .preview-mini{font-size:1.5rem;margin-bottom:4px}
</style><meta property="og:title" content="汉字变形器"><meta property="og:description" content="汉字变形器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎭 汉字变形器</h1><p class="sub">将汉字变形为各种艺术效果</p>
<div class="card">
<div class="input-group"><label>输入文字</label><input type="text" id="charInput" placeholder="输入要变形的文字" value="龙" maxlength="4"></div>
<div class="input-group"><label>选择变形风格</label>
<div class="style-grid" id="styleGrid">
<div class="style-btn active" data-style="brush" onclick="selectStyle(this)"><div class="preview-mini">笔</div>毛笔</div>
<div class="style-btn" data-style="seal" onclick="selectStyle(this)"><div class="preview-mini">印</div>印章</div>
<div class="style-btn" data-style="carved" onclick="selectStyle(this)"><div class="preview-mini">刻</div>篆刻</div>
<div class="style-btn" data-style="neon" onclick="selectStyle(this)"><div class="preview-mini">灯</div>霓虹</div>
<div class="style-btn" data-style="vintage" onclick="selectStyle(this)"><div class="preview-mini">古</div>复古</div>
<div class="style-btn" data-style="blood" onclick="selectStyle(this)"><div class="preview-mini">血</div>血书</div>
<div class="style-btn" data-style="gold" onclick="selectStyle(this)"><div class="preview-mini">金</div>金字</div>
<div class="style-btn" data-style="ice" onclick="selectStyle(this)"><div class="preview-mini">冰</div>冰冻</div>
<div class="style-btn" data-style="fire" onclick="selectStyle(this)"><div class="preview-mini">火</div>火焰</div>
<div class="style-btn" data-style="pixel" onclick="selectStyle(this)"><div class="preview-mini">点</div>像素</div>
<div class="style-btn" data-style="glow" onclick="selectStyle(this)"><div class="preview-mini">光</div>发光</div>
</div></div>
<button class="btn" onclick="applyStyle()">应用变形</button>
<button class="btn" onclick="randomChar()" style="background:var(--green)">随机文字</button>
</div>
<div class="preview" id="preview"><span class="brush">龙</span></div></div>
<script src="../i18n.js" defer></script>
<script>
var currentStyle='brush';
var randoms=['龙','凤','虎','福','寿','喜','财','旺','安','康','富','贵','祥','和','顺','春','夏','秋','冬','花','月','水','火','山','木'];
function selectStyle(el){document.querySelectorAll('.style-btn').forEach(function(e){e.classList.remove('active')});el.classList.add('active');currentStyle=el.dataset.style;applyStyle()}
function applyStyle(){
var text=document.getElementById('charInput').value||'龙';
document.getElementById('preview').innerHTML='<span class="'+currentStyle+'">'+text+'</span>';
}
function randomChar(){document.getElementById('charInput').value=randoms[Math.floor(Math.random()*randoms.length)];applyStyle()}
applyStyle();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
