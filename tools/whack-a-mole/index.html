<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>打地鼠</title>
<meta name="description" content="打地鼠游戏，快速点击冒出的地鼠得分">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;user-select:none}
h1{font-size:1.5rem;margin-bottom:10px;color:#3b82f6}
.hud{display:flex;gap:20px;margin-bottom:15px;font-size:1rem}
.hud span{background:#161b22;padding:6px 14px;border-radius:6px;border:1px solid #30363d}
.grid{display:grid;grid-template-columns:repeat(3,110px);gap:12px}
.hole{width:110px;height:110px;background:#161b22;border-radius:12px;border:2px solid #30363d;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.hole::after{content:'';position:absolute;bottom:0;left:0;right:0;height:20px;background:#854d0e;border-radius:0 0 10px 10px}
.mole{font-size:3rem;transition:transform .15s;transform:translateY(100%)}
.mole.up{transform:translateY(0)}
.mole.hit{animation:hit .3s}
@keyframes hit{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(0)}}
.controls{margin-top:15px}
button{padding:10px 24px;border:none;background:#3b82f6;color:#fff;border-radius:8px;cursor:pointer;font-size:1rem}
button:hover{background:#2563eb}
.message{margin-top:12px;font-size:1.1rem;min-height:1.5em}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="打地鼠">
  <meta property="og:description" content="打地鼠游戏，快速点击冒出的地鼠得分">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/whack-a-mole/">
</head>
<body>
<h1>🔨 打地鼠</h1>
<div class="hud"><span>⏱ <b id="time">30</b>秒</span><span>🏆 <b id="score">0</b>分</span><span>最高: <b id="best">0</b></span></div>
<div class="grid" id="grid"></div>
<div class="controls"><button id="startBtn" onclick="startGame()">开始游戏</button></div>
<div class="message" id="msg">点击开始，30秒内尽可能多地打地鼠！</div>
<script>
let score=0,running=false,timer=30,moles=[],holes=[],interval,moleTimer,best=0;

const el=document.getElementById('grid');
for(let i=0;i<9;i++){
  const h=document.createElement('div');h.className='hole';
  const m=document.createElement('div');m.className='mole';m.textContent='🐹';
  h.appendChild(m);h.onclick=()=>whack(i);el.appendChild(h);
  holes.push(h);moles.push({up:false,element:m});
}

function startGame(){
  if(running)return;
  score=0;timer=30;running=true;
  document.getElementById('score').textContent=0;
  document.getElementById('time').textContent=30;
  document.getElementById('msg').textContent='';
  document.getElementById('startBtn').textContent='游戏中...';
  moles.forEach(m=>{m.up=false;m.element.classList.remove('up','hit')});
  interval=setInterval(()=>{timer--;document.getElementById('time').textContent=timer;if(timer<=0)endGame()},1000);
  spawnMole();
}

function spawnMole(){
  if(!running)return;
  let idx;do{idx=Math.floor(Math.random()*9)}while(moles[idx].up);
  moles[idx].up=true;moles[idx].element.classList.add('up');
  const speed=Math.max(400,1200-score*20);
  moleTimer=setTimeout(()=>{if(moles[idx].up){moles[idx].up=false;moles[idx].element.classList.remove('up');spawnMole()}},speed);
}

function whack(i){
  if(!running||!moles[i].up)return;
  moles[i].up=false;
  moles[i].element.classList.remove('up');
  moles[i].element.classList.add('hit');
  setTimeout(()=>moles[i].element.classList.remove('hit'),300);
  score+=10;document.getElementById('score').textContent=score;
  clearTimeout(moleTimer);spawnMole();
}

function endGame(){
  running=false;clearInterval(interval);clearTimeout(moleTimer);
  moles.forEach(m=>{m.up=false;m.element.classList.remove('up')});
  best=Math.max(best,score);document.getElementById('best').textContent=best;
  document.getElementById('msg').textContent=`游戏结束！得分: ${score}`;
  document.getElementById('startBtn').textContent='再来一局';
}
</script>
<script src="../i18n.js"></script>
</body>
</html>
