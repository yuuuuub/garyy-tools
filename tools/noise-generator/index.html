<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔊 白噪音生成器</title>
<meta name="description" content="在线白噪音生成器 - 支持粉噪音、棕噪音、白噪音等多种环境音效，帮助睡眠和专注">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔊</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#3b82f6;--green:#238636;--red:#ef4444;--bg-primary:#f8fafc;--bg-card:#ffffff;--bg-input:#f1f5f9;--text-primary:#1e293b;--text-secondary:#64748b;--text-muted:#94a3b8;--border:#e2e8f0;--accent:#3b82f6;--accent-hover:#2563eb;--accent-light:#dbeafe;--danger:#ef4444;--success:#22c55e;--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1);--radius:12px;--radius-sm:8px;--transition:.2s ease}
[data-theme="dark"]{--bg-primary:#0f172a;--bg-card:#1e293b;--bg-input:#334155;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--border:#334155;--accent:#3b82f6;--accent-hover:#60a5fa;--danger:#f87171;--success:#4ade80}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.container{width:100%;max-width:480px;background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:24px 20px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:1.4rem;font-weight:700}
.theme-btn{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer;font-size:1.1rem}
.noise-types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.noise-btn{padding:14px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text-primary);font-size:.95rem;font-weight:600;cursor:pointer;transition:all var(--transition);text-align:center}
.noise-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.noise-btn:hover{border-color:var(--accent)}
.noise-btn .emoji{font-size:1.5rem;display:block;margin-bottom:4px}
.volume-section{margin:16px 0}
.volume-section label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--text-secondary);margin-bottom:6px}
input[type="range"]{width:100%;-webkit-appearance:none;height:8px;border-radius:4px;background:var(--bg-input);outline:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--bg-card);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.controls{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px;border:none;border-radius:var(--radius-sm);font-size:1rem;font-weight:600;cursor:pointer;transition:all var(--transition)}
.btn-play{background:var(--accent);color:#fff}
.btn-play:hover{background:var(--accent-hover)}
.btn-stop{background:var(--danger);color:#fff}
.btn-stop:hover{opacity:.9}
.timer-section{margin-top:16px;padding:12px;background:var(--bg-input);border-radius:var(--radius-sm)}
.timer-section label{font-size:.85rem;color:var(--text-secondary);display:block;margin-bottom:6px}
.timer-btns{display:flex;gap:6px;flex-wrap:wrap}
.timer-btn{padding:6px 12px;border:1px solid var(--border);border-radius:20px;background:var(--bg-card);color:var(--text-primary);font-size:.8rem;cursor:pointer;transition:all var(--transition)}
.timer-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.status{margin-top:12px;text-align:center;font-size:.9rem;color:var(--text-secondary);min-height:24px}
.visualizer{height:60px;margin-top:12px;display:flex;align-items:end;justify-content:center;gap:2px}
.bar{width:4px;background:var(--accent);border-radius:2px;transition:height .1s}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🔊 白噪音生成器</h1>
<button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
</header>

<div class="noise-types" id="noiseTypes">
<button class="noise-btn active" onclick="selectNoise('white',this)"><span class="emoji">📻</span>白噪音</button>
<button class="noise-btn" onclick="selectNoise('pink',this)"><span class="emoji">🌸</span>粉噪音</button>
<button class="noise-btn" onclick="selectNoise('brown',this)"><span class="emoji">🟤</span>棕噪音</button>
<button class="noise-btn" onclick="selectNoise('blue',this)"><span class="emoji">🔵</span>蓝噪音</button>
<button class="noise-btn" onclick="selectNoise('rain',this)"><span class="emoji">🌧️</span>雨声</button>
<button class="noise-btn" onclick="selectNoise('ocean',this)"><span class="emoji">🌊</span>海浪</button>
</div>

<div class="volume-section">
<label><span>音量</span><span id="volVal">50%</span></label>
<input type="range" id="volume" min="0" max="100" value="50" oninput="updateVolume(this.value)">
</div>

<div class="controls">
<button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶ 播放</button>
<button class="btn btn-stop" onclick="stopAll()">⏹ 停止</button>
</div>

<div class="timer-section">
<label>定时关闭</label>
<div class="timer-btns" id="timerBtns">
<button class="timer-btn" onclick="setTimer(0,this)">不限</button>
<button class="timer-btn" onclick="setTimer(5,this)">5分钟</button>
<button class="timer-btn" onclick="setTimer(15,this)">15分钟</button>
<button class="timer-btn" onclick="setTimer(30,this)">30分钟</button>
<button class="timer-btn" onclick="setTimer(60,this)">1小时</button>
</div>
</div>

<div class="visualizer" id="visualizer"></div>
<div class="status" id="status">选择噪音类型，点击播放</div>
</div>

<script src="../i18n.js" defer></script>
<script>
function toggleTheme(){
const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
document.documentElement.dataset.theme=t;
document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌙';
}

let audioCtx=null,sourceNode=null,gainNode=null,isPlaying=false;
let currentNoise='white',timerId=null,timerMinutes=0;
let animFrame=null;

function initAudio(){
if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}

function selectNoise(type,el){
currentNoise=type;
document.querySelectorAll('.noise-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
if(isPlaying){stopAll();togglePlay();}
}

function createNoiseBuffer(type){
const sampleRate=audioCtx.sampleRate;
const length=sampleRate*2;
const buffer=audioCtx.createBuffer(1,length,sampleRate);
const data=buffer.getChannelData(0);

if(type==='white'){
for(let i=0;i<length;i++)data[i]=(Math.random()*2-1);
}else if(type==='pink'){
let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
for(let i=0;i<length;i++){
const w=Math.random()*2-1;
b0=0.99886*b0+w*0.0555179;
b1=0.99332*b1+w*0.0750759;
b2=0.969*b2+w*0.153852;
b3=0.8665*b3+w*0.3104856;
b4=0.55*b4+w*0.5329522;
b5=-0.7616*b5-w*0.016898;
data[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
b6=w*0.115926;
}
}else if(type==='brown'){
let last=0;
for(let i=0;i<length;i++){
const w=Math.random()*2-1;
data[i]=(last+(0.02*w))/1.02;
last=data[i];
data[i]*=3.5;
}
}else if(type==='blue'){
let prev=0;
for(let i=0;i<length;i++){
const w=Math.random()*2-1;
data[i]=(w-prev)*0.5;
prev=w;
}
}else if(type==='rain'){
for(let i=0;i<length;i++){
const base=(Math.random()*2-1)*0.3;
const crackle=Math.random()>0.997?(Math.random()*2-1)*0.8:0;
data[i]=base+crackle;
}
}else if(type==='ocean'){
for(let i=0;i<length;i++){
const t=i/sampleRate;
const wave=Math.sin(t*0.3*Math.PI*2)*0.3;
const noise=(Math.random()*2-1)*0.2;
data[i]=(wave+noise)*Math.max(0,Math.sin(t*0.15*Math.PI*2));
}
}
return buffer;
}

function togglePlay(){
initAudio();
if(isPlaying)return;
isPlaying=true;

const buffer=createNoiseBuffer(currentNoise);
sourceNode=audioCtx.createBufferSource();
sourceNode.buffer=buffer;
sourceNode.loop=true;

gainNode=audioCtx.createGain();
gainNode.gain.value=parseInt(document.getElementById('volume').value)/100;

sourceNode.connect(gainNode);
gainNode.connect(audioCtx.destination);
sourceNode.start();

document.getElementById('playBtn').textContent='⏸ 暂停';
document.getElementById('playBtn').onclick=pausePlay;
document.getElementById('status').textContent='正在播放: '+{white:'白噪音',pink:'粉噪音',brown:'棕噪音',blue:'蓝噪音',rain:'雨声',ocean:'海浪'}[currentNoise];
startVisualizer();
}

function pausePlay(){
if(sourceNode){sourceNode.stop();sourceNode=null;}
isPlaying=false;
document.getElementById('playBtn').textContent='▶ 播放';
document.getElementById('playBtn').onclick=togglePlay;
document.getElementById('status').textContent='已暂停';
stopVisualizer();
}

function stopAll(){
if(sourceNode){try{sourceNode.stop();}catch(e){}sourceNode=null;}
isPlaying=false;
if(timerId){clearTimeout(timerId);timerId=null;}
document.getElementById('playBtn').textContent='▶ 播放';
document.getElementById('playBtn').onclick=togglePlay;
document.getElementById('status').textContent='已停止';
stopVisualizer();
document.querySelectorAll('.timer-btn').forEach(b=>b.classList.remove('active'));
}

function updateVolume(v){
document.getElementById('volVal').textContent=v+'%';
if(gainNode)gainNode.gain.value=v/100;
}

function setTimer(min,el){
timerMinutes=min;
document.querySelectorAll('.timer-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
if(timerId){clearTimeout(timerId);timerId=null;}
if(min>0&&isPlaying){
timerId=setTimeout(()=>{stopAll();document.getElementById('status').textContent='定时结束，已自动停止';},min*60*1000);
document.getElementById('status').textContent+=` (${min}分钟后自动停止)`;
}
}

function startVisualizer(){
const container=document.getElementById('visualizer');
container.innerHTML='';
for(let i=0;i<24;i++){
const bar=document.createElement('div');
bar.className='bar';
bar.style.height='4px';
container.appendChild(bar);
}
function animate(){
const bars=container.querySelectorAll('.bar');
bars.forEach(b=>{b.style.height=(4+Math.random()*52)+'px';});
animFrame=requestAnimationFrame(animate);
}
animate();
}

function stopVisualizer(){
cancelAnimationFrame(animFrame);
const bars=document.querySelectorAll('.bar');
bars.forEach(b=>{b.style.height='4px';});
}
</script>
</body>
</html>
