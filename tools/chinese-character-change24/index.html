<div class="container"><h1>🔄 汉字变化24</h1><p class="sub">在线查看汉字变化效果</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="化" oninput="showChange24()">
</div>
<button class="btn" onclick="showChange24()">显示变化</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var changeTypes24=['neon','vintage','retro','cyber','steampunk','fantasy','sci-fi','horror','romance','comedy'];
var currentChange24='neon';
function showChange24(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="change24-options">';
  changeTypes24.forEach(function(type){
    html+='<div class="change24-option '+(type===currentChange24?'active':'')+'" onclick="setChange24(\''+type+'\')">'+getChangeName24(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="change24-container">';
  html+='<div class="change24-char" style="'+getChangeCSS24(currentChange24)+'">'+char+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>📋 变化说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>变化类型：</strong>'+getChangeName24(currentChange24)+'</div>';
  html+='<div><strong>效果描述：</strong>'+getChangeDescription24(currentChange24)+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function setChange24(type){
  currentChange24=type;
  showChange24();
}
function getChangeName24(type){
  switch(type){
    case 'neon':return'霓虹';
    case 'vintage':return'复古';
    case 'retro':return'怀旧';
    case 'cyber':return'赛博';
    case 'steampunk':return'蒸汽朋克';
    case 'fantasy':return'奇幻';
    case 'sci-fi':return'科幻';
    case 'horror':return'恐怖';
    case 'romance':return'浪漫';
    case 'comedy':return'喜剧';
    default:return'未知';
  }
}
function getChangeDescription24(type){
  switch(type){
    case 'neon':return'霓虹灯效果，色彩鲜艳';
    case 'vintage':return'复古风格，怀旧色彩';
    case 'retro':return'怀旧风格，年代感';
    case 'cyber':return'赛博朋克风格，科技感';
    case 'steampunk':return'蒸汽朋克风格，机械感';
    case 'fantasy':return'奇幻风格，魔法感';
    case 'sci-fi':return'科幻风格，未来感';
    case 'horror':return'恐怖风格，阴森感';
    case 'romance':return'浪漫风格，温馨感';
    case 'comedy':return'喜剧风格，欢乐感';
    default:return'未知效果';
  }
}
function getChangeCSS24(type){
  switch(type){
    case 'neon':return'color:#fff;text-shadow:0 0 10px #fff,0 0 20px #fff,0 0 30px #fff,0 0 40px #ff00de,0 0 70px #ff00de,0 0 80px #ff00de,0 0 100px #ff00de';
    case 'vintage':return'color:#8b4513;text-shadow:2px 2px 4px rgba(139,69,19,0.5);font-family:serif';
    case 'retro':return'color:#ff6b6b;text-shadow:2px 2px 0 #ffd93d,4px 4px 0 #ff6b6b';
    case 'cyber':return'color:#00ffff;text-shadow:0 0 10px #00ffff,0 0 20px #00ffff,0 0 30px #00ffff;font-family:monospace';
    case 'steampunk':return'color:#b8860b;text-shadow:2px 2px 4px rgba(184,134,11,0.5);font-family:serif';
    case 'fantasy':return'color:#9370db;text-shadow:0 0 10px #9370db,0 0 20px #9370db,0 0 30px #9370db';
    case 'sci-fi':return'color:#00ff00;text-shadow:0 0 10px #00ff00,0 0 20px #00ff00;font-family:monospace';
    case 'horror':return'color:#8b0000;text-shadow:2px 2px 4px rgba(139,0,0,0.8)';
    case 'romance':return'color:#ff69b4;text-shadow:0 0 10px #ff69b4,0 0 20px #ff69b4';
    case 'comedy':return'color:#ffd700;text-shadow:2px 2px 0 #ff6b6b,4px 4px 0 #4ecdc4';
    default:return'color:var(--blue)';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showChange24();
}
showChange24();
