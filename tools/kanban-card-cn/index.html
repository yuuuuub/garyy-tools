<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗂️ 看板卡片</title>
<meta name="description" content="看板卡片工具，拖拽式任务管理">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:1000px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-height:400px}
.col{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px}
.col-header{font-weight:700;font-size:.95rem;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--accent);display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:grab;transition:all .2s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.card.dragging{opacity:.5;transform:rotate(2deg)}
.card .title{font-weight:600;font-size:.9rem;margin-bottom:4px}
.card .desc{font-size:.8rem;color:var(--text2);margin-bottom:6px}
.card .footer{display:flex;justify-content:space-between;align-items:center}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.tag-red{background:rgba(248,81,73,.2);color:var(--red)}
.tag-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.tag-green{background:rgba(63,185,80,.2);color:var(--green)}
.tag-blue{background:rgba(59,130,246,.2);color:var(--accent)}
.move-btns{display:flex;gap:4px}
.move-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 6px;cursor:pointer;font-size:.75rem;color:var(--text2)}
.move-btn:hover{background:var(--accent);color:#fff}
.remove-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:.85rem}
.hidden{display:none!important}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.85rem}
@media(max-width:700px){.board{grid-template-columns:1fr}body{padding:10px}.ctn{max-width:100%}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🗂️ 看板卡片">
<meta property="og:description" content="看板卡片工具，拖拽式任务管理">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/kanban-card-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='kanban_card';
let cols=JSON.parse(localStorage.getItem(STORE)||'[{"title":"待办","color":"var(--yellow)","items":[]},{"title":"进行中","color":"var(--accent)","items":[]},{"title":"已完成","color":"var(--green)","items":[]}]);
function save(){localStorage.setItem(STORE,JSON.stringify(cols))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
let dragCard=null,dragFromCol=-1;
function render(){
  let h=`<div class="hdr"><h1>🗂️ 看板卡片</h1><p>拖拽式任务管理</p></div>`;
  h+=`<div class="cd"><div class="flex"><input id="newTitle" placeholder="任务标题" style="flex:1;margin-bottom:0"><select id="newTag" style="width:auto;margin-bottom:0"><option value="blue">普通</option><option value="red">紧急</option><option value="yellow">重要</option><option value="green">轻松</option></select><select id="newCol" style="width:auto;margin-bottom:0"><option value="0">待办</option><option value="1">进行中</option><option value="2">已完成</option></select><button onclick="addCard()">添加</button></div></div>`;
  h+=`<div class="board">`;
  cols.forEach((col,ci)=>{
    h+=`<div class="col" ondragover="event.preventDefault()" ondrop="dropCard(${ci})">`;
    h+=`<div class="col-header" style="border-bottom-color:${col.color}">${col.title} <span style="font-size:.8rem;color:var(--text2)">${col.items.length}</span></div>`;
    if(!col.items.length)h+=`<p class="empty">拖拽卡片到此处</p>`;
    col.items.forEach((card,ii)=>{
      h+=`<div class="card" draggable="true" ondragstart="dragCard=${JSON.stringify(card).replace(/"/g,'&quot;')};dragFromCol=${ci}" ondragend="dragCard=null">`;
      h+=`<div class="flex-between"><span class="title">${card.title}</span><span class="tag tag-${card.tag}">${{red:'紧急',yellow:'重要',blue:'普通',green:'轻松'}[card.tag]}</span></div>`;
      if(card.desc)h+=`<div class="desc">${card.desc}</div>`;
      h+=`<div class="footer"><div class="move-btns">`;
      if(ci>0)h+=`<span class="move-btn" onclick="moveCard(${ci},${ii},-1)">◀</span>`;
      if(ci<cols.length-1)h+=`<span class="move-btn" onclick="moveCard(${ci},${ii},1)">▶</span>`;
      h+=`</div><button class="remove-btn" onclick="delCard(${ci},${ii})">✕</button></div></div>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`;$('app').innerHTML=h;
}
function addCard(){
  const title=$('newTitle').value.trim();if(!title)return;
  const ci=+$('newCol').value;
  cols[ci].items.push({id:uid(),title,desc:'',tag:$('newTag').value});
  $('newTitle').value='';save();render();
}
function delCard(ci,ii){cols[ci].items.splice(ii,1);save();render()}
function moveCard(ci,ii,dir){
  const card=cols[ci].items.splice(ii,1)[0];
  cols[ci+dir].items.push(card);save();render();
}
function dropCard(toCol){
  if(!dragCard||dragFromCol===toCol)return;
  const fromItems=cols[dragFromCol].items;
  const idx=fromItems.findIndex(c=>c.id===dragCard.id);
  if(idx>-1)fromItems.splice(idx,1);
  cols[toCol].items.push(dragCard);save();render();
}
render();
</script>
</body>
</html>
