<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026世界杯积分榜</title>
<meta name="description" content="2026年美加墨世界杯积分榜 - 实时数据由ESPN提供"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>"><meta name="robots" content="index, follow"><meta property="og:title" content="2026世界杯积分榜"><meta property="og:description" content="2026年美加墨世界杯积分榜 - 实时数据">
<style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d29922}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#9a6700}body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;line-height:1.6}.container{max-width:800px;margin:0 auto}h1{text-align:center;padding:20px 0 4px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}.loading{text-align:center;padding:40px;color:var(--text2)}.loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}table{width:100%;border-collapse:collapse;font-size:.88rem}th{padding:8px 6px;text-align:center;border-bottom:2px solid var(--border);color:var(--text2);font-size:.78rem;font-weight:500}td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--border)}tr:hover{background:var(--bg)}.rank{font-weight:700;color:var(--gold)}.pts{font-weight:700;color:var(--blue)}.group-title{padding:8px 12px;background:var(--bg);border-radius:6px;font-weight:600;font-size:.9rem;color:var(--gold);margin:8px 0}.qualify{color:var(--green)}.eliminate{color:var(--text2)}.source{text-align:center;font-size:.75rem;color:var(--text2);margin-top:12px}.tab-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.82rem;transition:all .2s}.tab.active{background:var(--gold);color:#000;border-color:var(--gold)}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}@media(max-width:480px){body{padding:12px}th,td{padding:6px 4px;font-size:.8rem}}</style></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🏆 2026世界杯积分榜</h1>
<p class="sub">实时数据 · 由ESPN API提供</p>
<div class="card">
<div class="tab-bar" id="groupTabs"></div>
<div id="tableContent"><div class="loading"><div class="spinner"></div><p style="margin-top:12px">加载积分榜数据...</p></div></div>
<div class="source">数据来源：ESPN · 自动刷新</div>
</div>
</div>
<script src="../i18n.js" defer></script>
<script>
var API_BASE='https://site.api.espn.com/apis/v2/sports/soccer/fifa.world';
var currentGroup='all';

function renderTabs(groups){
  var tabs=document.getElementById('groupTabs');
  var html='<div class="tab active" onclick="showGroup(\'all\',this)">全部</div>';
  groups.forEach(function(g){html+='<div class="tab" onclick="showGroup(\''+g.id+'\',this)">'+g.name+'</div>';});
  tabs.innerHTML=html;
}

function showGroup(g,el){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  if(el)el.classList.add('active');
  currentGroup=g;
  renderTable(window._cachedGroups);
}

function renderTable(groups){
  if(!groups)return;
  var content=document.getElementById('tableContent');
  var html='';
  groups.forEach(function(group){
    if(currentGroup!=='all'&&group.id!==currentGroup)return;
    var entries=group.entries||[];
    entries.sort(function(a,b){return(b.points||0)-(a.points||0)||(b.pointDifferential||0)-(a.pointDifferential||0);});
    html+='<div class="group-title">⚽ '+group.name+'</div>';
    html+='<table><tr><th>#</th><th style="text-align:left">球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进</th><th>失</th><th>净胜</th><th>积分</th></tr>';
    entries.forEach(function(t,i){
      var cls=i<2?'qualify':'eliminate';
      html+='<tr class="'+cls+'"><td class="rank">'+(i+1)+'</td><td style="text-align:left">'+t.team+'</td><td>'+t.played+'</td><td>'+t.wins+'</td><td>'+t.ties+'</td><td>'+t.losses+'</td><td>'+t.pointsFor+'</td><td>'+t.pointsAgainst+'</td><td>'+(t.pointDifferential>0?'+':'')+t.pointDifferential+'</td><td class="pts">'+t.points+'</td></tr>';
    });
    html+='</table>';
  });
  content.innerHTML=html||'<div style="text-align:center;padding:20px;color:var(--text2)">暂无数据</div>';
}

function fetchStandings(){
  fetch(API_BASE+'/standings')
    .then(function(r){return r.json()})
    .then(function(data){
      var groups=[];
      (data.children||[]).forEach(function(child){
        var entries=[];
        (child.standings?.entries||[]).forEach(function(entry){
          var stats={};
          (entry.stats||[]).forEach(function(s){stats[s.name]=s.value||0;});
          entries.push({
            team:entry.team?.displayName||entry.team?.abbreviation||'?',
            played:stats.gamesPlayed||0,wins:stats.wins||0,ties:stats.ties||0,losses:stats.losses||0,
            pointsFor:stats.pointsFor||0,pointsAgainst:stats.pointsAgainst||0,pointDifferential:stats.pointDifferential||0,
            points:stats.points||0
          });
        });
        groups.push({id:child.id||child.name,name:child.name||'?',entries:entries});
      });
      window._cachedGroups=groups;
      renderTabs(groups);
      renderTable(groups);
    })
    .catch(function(err){
      document.getElementById('tableContent').innerHTML='<div style="text-align:center;padding:20px;color:var(--red)">加载失败: '+err.message+'</div>';
    });
}

fetchStandings();
setInterval(fetchStandings,5*60*1000);
</script></body></html>
