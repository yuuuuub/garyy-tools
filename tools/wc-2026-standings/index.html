<style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d29922}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#9a6700}body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;line-height:1.6}.container{max-width:800px;margin:0 auto}h1{text-align:center;padding:20px 0 4px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}.tab-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.82rem;transition:all .2s}.tab.active{background:var(--gold);color:#000;border-color:var(--gold)}table{width:100%;border-collapse:collapse;font-size:.88rem}th{padding:8px 6px;text-align:center;border-bottom:2px solid var(--border);color:var(--text2);font-size:.78rem;font-weight:500}td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--border)}tr:hover{background:var(--bg)}.rank{font-weight:700;color:var(--gold)}.team-cell{text-align:left;display:flex;align-items:center;gap:4px}.pts{font-weight:700;color:var(--blue)}.group-title{padding:8px 12px;background:var(--bg);border-radius:6px;font-weight:600;font-size:.9rem;color:var(--gold);margin:8px 0}.qualify{color:var(--green);font-weight:600}.eliminate{color:var(--text2)}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}@media(max-width:480px){body{padding:12px}th,td{padding:6px 4px;font-size:.8rem}}</style></head><body>

<div class="container">
<h1>🏆 2026世界杯积分榜</h1>
<p class="sub">小组赛排名 · 前两名晋级淘汰赛</p>
<div class="card">
<div class="tab-bar" id="groupTabs"></div>

</div>
</div>
<script src="../i18n.js" defer></script>
<script>
var groups={
A:{name:'A组',teams:[{flag:'🇺🇸',name:'美国',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇲🇽',name:'墨西哥',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇨🇦',name:'加拿大',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇧🇷',name:'巴西',w:0,d:0,l:0,gf:0,ga:0}]},
B:{name:'B组',teams:[{flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',name:'英格兰',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇫🇷',name:'法国',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇩🇰',name:'丹麦',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇮🇷',name:'伊朗',w:0,d:0,l:0,gf:0,ga:0}]},
C:{name:'C组',teams:[{flag:'🇦🇷',name:'阿根廷',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇩🇪',name:'德国',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇦🇺',name:'澳大利亚',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇷🇸',name:'塞尔维亚',w:0,d:0,l:0,gf:0,ga:0}]},
D:{name:'D组',teams:[{flag:'🇪🇸',name:'西班牙',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇯🇵',name:'日本',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇰🇷',name:'韩国',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇨🇴',name:'哥伦比亚',w:0,d:0,l:0,gf:0,ga:0}]},
E:{name:'E组',teams:[{flag:'🇵🇹',name:'葡萄牙',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇳🇱',name:'荷兰',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇧🇪',name:'比利时',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇺🇾',name:'乌拉圭',w:0,d:0,l:0,gf:0,ga:0}]},
F:{name:'F组',teams:[{flag:'🇮🇹',name:'意大利',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇨🇭',name:'瑞士',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇵🇱',name:'波兰',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇸🇳',name:'塞内加尔',w:0,d:0,l:0,gf:0,ga:0}]},
G:{name:'G组',teams:[{flag:'🇧🇪',name:'比利时',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇨🇷',name:'哥斯达黎加',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇲🇦',name:'摩洛哥',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇹🇳',name:'突尼斯',w:0,d:0,l:0,gf:0,ga:0}]},
H:{name:'H组',teams:[{flag:'🇳🇬',name:'尼日利亚',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇨🇲',name:'喀麦隆',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇪🇨',name:'厄瓜多尔',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇵🇪',name:'秘鲁',w:0,d:0,l:0,gf:0,ga:0}]},
I:{name:'I组',teams:[{flag:'🇮🇹',name:'意大利',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇦🇹',name:'奥地利',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇹🇷',name:'土耳其',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇳🇿',name:'新西兰',w:0,d:0,l:0,gf:0,ga:0}]},
J:{name:'J组',teams:[{flag:'🇧🇷',name:'巴西',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇨🇱',name:'智利',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇵🇾',name:'巴拉圭',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇸🇦',name:'沙特',w:0,d:0,l:0,gf:0,ga:0}]},
K:{name:'K组',teams:[{flag:'🇭🇷',name:'克罗地亚',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇺🇦',name:'乌克兰',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇨🇿',name:'捷克',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇯🇲',name:'牙买加',w:0,d:0,l:0,gf:0,ga:0}]},
L:{name:'L组',teams:[{flag:'🇩🇪',name:'德国',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇮🇶',name:'伊拉克',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇮🇳',name:'印度',w:0,d:0,l:0,gf:0,ga:0},{flag:'🇵🇦',name:'巴拿马',w:0,d:0,l:0,gf:0,ga:0}]}
};

function calcPoints(t){return t.w*3+t.d}
function calcGD(t){return t.gf-t.ga}
function sortGroup(teams){
  return teams.slice().sort(function(a,b){
    var pa=calcPoints(a),pb=calcPoints(b);
    if(pa!==pb)return pb-pa;
    var gda=calcGD(a),gdb=calcGD(b);
    if(gda!==gdb)return gdb-gda;
    if(a.gf!==b.gf)return b.gf-a.gf;
    return a.name.localeCompare(b.name,'zh');
  });
}

var currentGroup='all';
function render(){
  var tabs=document.getElementById('groupTabs');
  var html='<div class="tab active" onclick="showGroup(\'all\',this)">全部</div>';
  Object.keys(groups).forEach(function(k){
    html+='<div class="tab" onclick="showGroup(\''+k+'\',this)">'+groups[k].name+'</div>';
  });
  tabs.innerHTML=html;
  showGroup('all',document.querySelector('.tab'));
}

function showGroup(g,el){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  currentGroup=g;
  var content=document.getElementById('tableContent');
  var html='';
  Object.keys(groups).forEach(function(k){
    if(g!=='all'&&k!==g)return;
    var grp=groups[k];
    var sorted=sortGroup(grp.teams);
    html+='<div class="group-title">⚽ '+grp.name+'</div>';
    html+='<table><tr><th>#</th><th style="text-align:left">球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进</th><th>失</th><th>净胜</th><th>积分</th></tr>';
    sorted.forEach(function(t,i){
      var pts=calcPoints(t);var gd=calcGD(t);var played=t.w+t.d+t.l;
      var cls=i<2?'qualify':'eliminate';
      html+='<tr class="'+cls+'"><td class="rank">'+(i+1)+'</td><td style="text-align:left"><span style="margin-right:4px">'+t.flag+'</span>'+t.name+'</td><td>'+played+'</td><td>'+t.w+'</td><td>'+t.d+'</td><td>'+t.l+'</td><td>'+t.gf+'</td><td>'+t.ga+'</td><td>'+(gd>0?'+':'')+gd+'</td><td class="pts">'+pts+'</td></tr>';
    });
    html+='</table>';
  });
  content.innerHTML=html||'<div style="text-align:center;padding:20px;color:var(--text2)">比赛尚未开始</div>';
}

render();
</script></body></html>
