<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>股票组件 - garyy-tools</title>
<meta name="description" content="模拟股票行情组件，支持实时报价和K线图显示">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;scroll-behavior:smooth}.container{max-width:600px;margin:auto;padding-bottom:50px}header{text-align:center;padding:28px 0 16px}h1{font-size:1.3rem;margin-bottom:4px}.sub{color:var(--text2);font-size:.85rem}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.9rem;width:100%;outline:none;margin-bottom:16px}select:focus{border-color:var(--blue)}.stock-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}.stock-name{font-size:1.2rem;font-weight:600}.stock-code{font-size:.8rem;color:var(--text2)}.stock-price{font-size:2rem;font-weight:700}.stock-change{font-size:1rem;font-weight:600}.stock-change.up{color:var(--red)}.stock-change.down{color:var(--green)}.stock-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.stock-grid .item{padding:10px;background:var(--bg);border-radius:8px}.stock-grid .item .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.stock-grid .item .val{font-size:1rem;font-weight:600}.chart{width:100%;height:200px;margin-top:16px;position:relative}.chart canvas{width:100%;height:100%}.stock-list{margin-top:12px}.stock-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.stock-row:last-child{border:none}.stock-row .name{font-weight:600}.stock-row .price{text-align:right}.stock-row .change{font-size:.85rem;font-weight:600}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="股票组件 - garyy-tools">
<meta property="og:description" content="模拟股票行情组件，支持实时报价和K线图显示">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>📈 股票组件</h1>
<div class="sub">模拟行情 · K线图 · 涨跌排行</div>
</header>
<div class="card">
<select id="stockSelect">
<option value="000001">上证指数 000001</option>
<option value="399001">深证成指 399001</option>
<option value="399006">创业板指 399006</option>
<option value="600519">贵州茅台 600519</option>
<option value="000858">五粮液 000858</option>
<option value="601318">中国平安 601318</option>
</select>
<div class="stock-header">
<div><div class="stock-name" id="sName">上证指数</div><div class="stock-code" id="sCode">000001.SH</div></div>
<div style="text-align:right"><div class="stock-price" id="sPrice">3,256.78</div><div class="stock-change up" id="sChange">+1.25%</div></div>
</div>
<div class="stock-grid">
<div class="item"><div class="label">开盘</div><div class="val" id="sOpen">3,240.12</div></div>
<div class="item"><div class="label">最高</div><div class="val" id="sHigh">3,268.45</div></div>
<div class="item"><div class="label">最低</div><div class="val" id="sLow">3,235.67</div></div>
<div class="item"><div class="label">成交量</div><div class="val" id="sVol">2,345亿</div></div>
</div>
<div class="chart"><canvas id="chartCanvas"></canvas></div>
</div>
<div class="card">
<div style="font-weight:600;margin-bottom:8px">自选股</div>
<div class="stock-list" id="stockList"></div>
</div>
</div>
<script>
(function(){
'use strict';
const stocks={
'000001':{name:'上证指数',code:'000001.SH',price:3256.78,change:1.25,open:3240.12,high:3268.45,low:3235.67,vol:'2,345亿'},
'399001':{name:'深证成指',code:'399001.SZ',price:10876.54,change:-0.68,open:10920.33,high:10935.21,low:10845.67,vol:'3,120亿'},
'399006':{name:'创业板指',code:'399006.SZ',price:2187.65,change:2.15,open:2150.88,high:2195.33,low:2148.76,vol:'1,567亿'},
'600519':{name:'贵州茅台',code:'600519.SH',price:1688.00,change:0.52,open:1679.50,high:1695.00,low:1672.30,vol:'3.2万手'},
'000858':{name:'五粮液',code:'000858.SZ',price:158.36,change:-1.23,open:160.28,high:161.50,low:157.80,vol:'8.5万手'},
'601318':{name:'中国平安',code:'601318.SH',price:52.80,change:0.86,open:52.35,high:53.12,low:52.10,vol:'15.6万手'}
};
let chartData=[];
function genChart(base){
chartData=[];let v=base;
for(let i=0;i<50;i++){v+=(Math.random()-0.48)*base*0.005;chartData.push(v);}
}
function drawChart(){
const c=document.getElementById('chartCanvas');
const ctx=c.getContext('2d');
const dpr=window.devicePixelRatio||1;
c.width=c.offsetWidth*dpr;c.height=c.offsetHeight*dpr;
ctx.scale(dpr,dpr);
const w=c.offsetWidth,h=c.offsetHeight;
ctx.clearRect(0,0,w,h);
if(!chartData.length)return;
const min=Math.min(...chartData),max=Math.max(...chartData);
const range=max-min||1;
const barW=w/chartData.length;
const isUp=chartData[chartData.length-1]>=chartData[0];
ctx.strokeStyle=isUp?'#ef4444':'#238636';ctx.lineWidth=1.5;ctx.beginPath();
chartData.forEach((v,i)=>{
const x=i*barW+barW/2;const y=h-((v-min)/range)*(h-20)-10;
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
});
ctx.stroke();
}
function renderDetail(key){
const s=stocks[key];
document.getElementById('sName').textContent=s.name;
document.getElementById('sCode').textContent=s.code;
document.getElementById('sPrice').textContent=s.price.toLocaleString('zh-CN',{minimumFractionDigits:2});
const cls=s.change>=0?'up':'down';
const chg=document.getElementById('sChange');
chg.textContent=(s.change>=0?'+':'')+s.change.toFixed(2)+'%';
chg.className='stock-change '+cls;
document.getElementById('sOpen').textContent=s.open.toLocaleString('zh-CN',{minimumFractionDigits:2});
document.getElementById('sHigh').textContent=s.high.toLocaleString('zh-CN',{minimumFractionDigits:2});
document.getElementById('sLow').textContent=s.low.toLocaleString('zh-CN',{minimumFractionDigits:2});
document.getElementById('sVol').textContent=s.vol;
genChart(s.price);drawChart();
}
function renderList(){
const sorted=Object.entries(stocks).sort((a,b)=>b[1].change-a[1].change);
document.getElementById('stockList').innerHTML=sorted.map(([k,v])=>{
const cls=v.change>=0?'up':'down';
return '<div class="stock-row"><div><div class="name">'+v.name+'</div><div style="font-size:.75rem;color:var(--text2)">'+v.code+'</div></div><div class="price"><div>'+v.price.toLocaleString('zh-CN',{minimumFractionDigits:2})+'</div><div class="change stock-change '+cls+'">'+(v.change>=0?'+':'')+v.change.toFixed(2)+'%</div></div></div>';
}).join('');
}
document.getElementById('stockSelect').onchange=function(){renderDetail(this.value);};
window.addEventListener('resize',()=>drawChart());
renderDetail('000001');renderList();
})();
</script>
</body>
</html>
