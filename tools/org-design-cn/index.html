<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>组织架构设计</title>
<meta property="og:title" content="组织架构设计">
<meta property="og:description" content="组织架构设计 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="组织架构设计工具 - 可视化设计和管理团队组织结构">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏗️</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a371f7;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:1100px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
input,textarea,select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
textarea{resize:vertical;min-height:60px}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.org-tree{overflow-x:auto;padding:20px 0}
.org-node{display:inline-flex;flex-direction:column;align-items:center;min-width:160px}
.org-card{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:12px 16px;text-align:center;cursor:pointer;transition:all .2s;min-width:140px}
.org-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.org-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.org-card.root{border-color:var(--accent);background:rgba(59,130,246,.1)}
.org-name{font-weight:700;font-size:.9rem;margin-bottom:2px}
.org-title{font-size:.8rem;color:var(--text2)}
.org-count{font-size:.75rem;color:var(--accent);margin-top:4px}
.org-children{display:flex;justify-content:center;gap:16px;margin-top:24px;position:relative}
.org-connector{position:absolute;top:-24px;left:50%;width:2px;height:24px;background:var(--border)}
.org-hline{position:absolute;top:-24px;height:2px;background:var(--border)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat-card{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.stat-num{font-size:2rem;font-weight:700}
.stat-label{font-size:.8rem;color:var(--text2);margin-top:4px}
.member-list{max-height:300px;overflow-y:auto}
.member-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px}
.member-info{display:flex;align-items:center;gap:8px}
.member-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;white-space:nowrap;color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){background:var(--border)}
@media(max-width:768px){h1{font-size:1.4rem}.org-children{flex-direction:column;align-items:center}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🏗️ 组织架构设计';
const APP=document.getElementById('app');
let data=JSON.parse(localStorage.getItem('od_data')||'{"root":{"id":"ceo","name":"CEO","title":"首席执行官","members":[{"name":"王总","role":"CEO"}],"children":[{"id":"cto","name":"CTO","title":"首席技术官","members":[{"name":"李总","role":"CTO"}],"children":[{"id":"dev","name":"研发部","title":"产品研发","members":[{"name":"张工","role":"前端"},{"name":"王工","role":"后端"},{"name":"赵工","role":"测试"}],"children":[]},{"id":"infra","name":"运维部","title":"基础架构","members":[{"name":"刘工","role":"运维"}],"children":[]}]}]},{"id":"cfo","name":"CFO","title":"首席财务官","members":[{"name":"陈总","role":"CFO"}],"children":[{"id":"fin","name":"财务部","title":"财务管理","members":[{"name":"孙会计","role":"会计"}],"children":[]}]}]}}');
let selectedNode=null;

function save(){localStorage.setItem('od_data',JSON.stringify(data))}

function countMembers(node){
  let count=node.members?node.members.length:0;
  if(node.children) node.children.forEach(c=>{count+=countMembers(c)});
  return count;
}
function countNodes(node){
  let count=1;
  if(node.children) node.children.forEach(c=>{count+=countNodes(c)});
  return count;
}
function findNode(id,node=data.root){if(node.id===id)return node;if(node.children){for(let c of node.children){const found=findNode(id,c);if(found)return found}}return null}

function renderNode(node){
  const count=countMembers(node);
  const isSelected=selectedNode===node.id;
  let h=`<div class="org-node"><div class="org-card ${isSelected?'selected':''} ${node.id===data.root.id?'root':''}" onclick="selectNode('${node.id}')"><div class="org-name">${node.name}</div><div class="org-title">${node.title}</div><div class="org-count">${count}人</div></div>`;
  if(node.children&&node.children.length){
    h+=`<div class="org-children"><div class="org-connector"></div>`;
    node.children.forEach(child=>{h+=renderNode(child)});
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}

function render(){
  let h=`<h1>🏗️ 组织架构设计</h1><p class="subtitle">可视化设计和管理组织结构</p>`;
  const totalMembers=countMembers(data.root);
  const totalNodes=countNodes(data.root);
  const maxDepth=(function depth(n){if(!n.children||!n.children.length)return 1;return 1+Math.max(...n.children.map(depth))})(data.root);

  h+=`<div class="stats-grid">`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--accent)">${totalNodes}</div><div class="stat-label">部门总数</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--green)">${totalMembers}</div><div class="stat-label">人员总数</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--yellow)">${maxDepth}</div><div class="stat-label">最大层级</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--purple)">${data.root.children?data.root.children.length:0}</div><div class="stat-label">直属下级</div></div>`;
  h+=`</div>`;

  h+=`<div class="card"><div class="flex-between"><b>⚙️ 操作</b><div class="flex"><button class="btn btn-sm" onclick="addChild()">+ 添加子部门</button><button class="btn btn-sm btn-outline" onclick="editNode()">编辑选中</button><button class="btn btn-sm btn-danger" onclick="delNode()">删除选中</button><button class="btn btn-sm btn-outline" onclick="addMember()">+ 添加成员</button></div></div></div>`;

  h+=`<div class="card" style="overflow-x:auto"><div class="org-tree">${renderNode(data.root)}</div></div>`;

  if(selectedNode){
    const node=findNode(selectedNode);
    if(node){
      h+=`<div class="card"><div class="flex-between"><b>👤 ${node.name} - 成员列表</b></div><div class="member-list">`;
      if(node.members&&node.members.length){
        node.members.forEach((m,mi)=>{
          h+=`<div class="member-item"><div class="member-info"><div class="member-avatar">${m.name[0]}</div><div><div style="font-weight:600;font-size:.9rem">${m.name}</div><div style="font-size:.8rem;color:var(--text2)">${m.role}</div></div></div><button class="btn btn-sm btn-danger" onclick="delMember('${node.id}',${mi})">✕</button></div>`;
        });
      } else h+=`<p style="color:var(--text2);font-size:.85rem;text-align:center;padding:20px">暂无成员</p>`;
      h+=`</div></div>`;
    }
  }

  h+=`<div class="card"><div class="flex-between"><b>📤 导出</b><div class="flex"><button class="btn btn-sm btn-outline" onclick="exportJSON()">JSON</button><button class="btn btn-sm btn-outline" onclick="resetOrg()">重置</button></div></div></div>`;
  APP.innerHTML=h;
}

function selectNode(id){selectedNode=id;render()}
function addChild(){
  if(!selectedNode){alert('请先选择一个部门');return}
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">添加子部门</h3>
    <label>部门名称</label><input id="on" placeholder="部门名称">
    <label>部门职能</label><input id="ot" placeholder="部门职能描述">
    <div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    <button class="btn btn-success" onclick="saveChild()">确定</button></div></div>`;
  document.body.appendChild(m);
}
function saveChild(){
  const n=document.getElementById('on').value.trim();if(!n)return;
  const node=findNode(selectedNode);
  if(!node.children)node.children=[];
  node.children.push({id:n.toLowerCase().replace(/\s+/g,'-'),name:n,title:document.getElementById('ot').value.trim(),members:[],children:[]});
  save();document.querySelector('.modal-overlay').remove();render();
}
function editNode(){
  if(!selectedNode){alert('请先选择一个部门');return}
  const node=findNode(selectedNode);
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">编辑部门</h3>
    <label>部门名称</label><input id="eon" value="${node.name}">
    <label>部门职能</label><input id="eot" value="${node.title}">
    <div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    <button class="btn btn-success" onclick="saveEdit()">保存</button></div></div>`;
  document.body.appendChild(m);
}
function saveEdit(){
  const node=findNode(selectedNode);
  node.name=document.getElementById('eon').value.trim()||node.name;
  node.title=document.getElementById('eot').value.trim();
  save();document.querySelector('.modal-overlay').remove();render();
}
function delNode(){
  if(!selectedNode||selectedNode===data.root.id){alert('不能删除根节点');return}
  if(!confirm('删除此部门？'))return;
  function removeChild(id,node){
    if(node.children){const idx=node.children.findIndex(c=>c.id===id);if(idx>=0){node.children.splice(idx,1);return true}for(let c of node.children){if(removeChild(id,c))return true}}return false;
  }
  removeChild(selectedNode,data.root);selectedNode=null;save();render();
}
function addMember(){
  if(!selectedNode){alert('请先选择一个部门');return}
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">添加成员</h3>
    <label>姓名</label><input id="mn" placeholder="成员姓名">
    <label>职位</label><input id="mr" placeholder="职位">
    <div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    <button class="btn btn-success" onclick="saveMember()">确定</button></div></div>`;
  document.body.appendChild(m);
}
function saveMember(){
  const n=document.getElementById('mn').value.trim();if(!n)return;
  const node=findNode(selectedNode);
  if(!node.members)node.members=[];
  node.members.push({name:n,role:document.getElementById('mr').value.trim()});
  save();document.querySelector('.modal-overlay').remove();render();
}
function delMember(nodeId,mi){if(confirm('删除成员？')){findNode(nodeId).members.splice(mi,1);save();render()}}
function exportJSON(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='org-structure.json';a.click()}
function resetOrg(){if(confirm('重置为默认组织架构？')){localStorage.removeItem('od_data');location.reload()}}
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
