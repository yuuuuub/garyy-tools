<script>
const MD5 = (() => {
  function rotateLeft(x, n) { return (x << n) | (x >>> (32 - n)); }
  function addUnsigned(lX, lY) {
    const lX8 = (lX & 0x80000000);
    const lY8 = (lY & 0x80000000);
    const lX4 = (lX & 0x40000000);
    const lY4 = (lY & 0x40000000);
    const lResult = (lX & 0x3FFFFFFF) + (lY & 0x3FFFFFFF);
    if (lX4 & lY4) return lResult ^ 0x80000000 ^ lX8 ^ lY8;
    if (lX4 | lY4) {
      if (lResult & 0x40000000) return lResult ^ 0xC0000000 ^ lX8 ^ lY8;
      else return lResult ^ 0x40000000 ^ lX8 ^ lY8;
    } else return lResult ^ lX8 ^ lY8;
  }
  function F(x, y, z) { return (x & y) | ((~x) & z); }
  function G(x, y, z) { return (x & z) | (y & (~z)); }
  function H(x, y, z) { return x ^ y ^ z; }
  function I(x, y, z) { return y ^ (x | (~z)); }
  function FF(a, b, c, d, x, s, ac) {
    a = addUnsigned(a, addUnsigned(addUnsigned(F(b, c, d), x), ac));
    return addUnsigned(rotateLeft(a, s), b);
  }
  function GG(a, b, c, d, x, s, ac) {
    a = addUnsigned(a, addUnsigned(addUnsigned(G(b, c, d), x), ac));
    return addUnsigned(rotateLeft(a, s), b);
  }
  function HH(a, b, c, d, x, s, ac) {
    a = addUnsigned(a, addUnsigned(addUnsigned(H(b, c, d), x), ac));
    return addUnsigned(rotateLeft(a, s), b);
  }
  function II(a, b, c, d, x, s, ac) {
    a = addUnsigned(a, addUnsigned(addUnsigned(I(b, c, d), x), ac));
    return addUnsigned(rotateLeft(a, s), b);
  }
  function convertToWordArray(str) {
    const msgLen = str.length;
    const wordCount = (((msgLen + 8) >>> 6) + 1) << 4;
    const wordArray = new Array(wordCount);
    for (let i = 0; i < msgLen; i++) {
      wordArray[i >>> 2] |= (str.charCodeAt(i) & 0xff) << ((i % 4) << 3);
    }
    wordArray[msgLen >>> 2] |= 0x80 << ((msgLen % 4) << 3);
    wordArray[wordCount - 2] = msgLen << 3;
    wordArray[wordCount - 1] = msgLen >>> 29;
    return wordArray;
  }
  function wordToHex(val) {
    let hex = '';
    for (let i = 0; i <= 3; i++) {
      const byte = (val >>> (i * 8)) & 0xFF;
      hex += ('0' + byte.toString(16)).slice(-2);
    }
    return hex;
  }
  function md5(str) {
    const x = convertToWordArray(str);
    let a = 0x67452301, b = 0xEFCDAB89, c = 0x98BADCFE, d = 0x10325476;
    for (let k = 0; k < x.length; k += 16) {
      const AA = a, BB = b, CC = c, DD = d;
      a = FF(a, b, c, d, x[k],     7,  0xD76AA478);
      d = FF(d, a, b, c, x[k+1],  12,  0xE8C7B756);
      c = FF(c, d, a, b, x[k+2],  17,  0x242070DB);
      b = FF(b, c, d, a, x[k+3],  22,  0xC1BDCEEE);
      a = FF(a, b, c, d, x[k+4],   7,  0xF57C0FAF);
      d = FF(d, a, b, c, x[k+5],  12,  0x4787C62A);
      c = FF(c, d, a, b, x[k+6],  17,  0xA8304613);
      b = FF(b, c, d, a, x[k+7],  22,  0xFD469501);
      a = FF(a, b, c, d, x[k+8],   7,  0x698098D8);
      d = FF(d, a, b, c, x[k+9],  12,  0x8B44F7AF);
      c = FF(c, d, a, b, x[k+10], 17,  0xFFFF5BB1);
      b = FF(b, c, d, a, x[k+11], 22,  0x895CD7BE);
      a = FF(a, b, c, d, x[k+12],  7,  0x6B901122);
      d = FF(d, a, b, c, x[k+13], 12,  0xFD987193);
      c = FF(c, d, a, b, x[k+14], 17,  0xA679438E);
      b = FF(b, c, d, a, x[k+15], 22,  0x49B40821);
      a = GG(a, b, c, d, x[k+1],   5,  0xF61E2562);
      d = GG(d, a, b, c, x[k+6],   9,  0xC040B340);
      c = GG(c, d, a, b, x[k+11], 14,  0x265E5A51);
      b = GG(b, c, d, a, x[k],    20,  0xE9B6C7AA);
      a = GG(a, b, c, d, x[k+5],   5,  0xD62F105D);
      d = GG(d, a, b, c, x[k+10],  9,  0x02441453);
      c = GG(c, d, a, b, x[k+15], 14,  0xD8A1E681);
      b = GG(b, c, d, a, x[k+4],  20,  0xE7D3FBC8);
      a = GG(a, b, c, d, x[k+9],   5,  0x21E1CDE6);
      d = GG(d, a, b, c, x[k+14],  9,  0xC33707D6);
      c = GG(c, d, a, b, x[k+3],  14,  0xF4D50D87);
      b = GG(b, c, d, a, x[k+8],  20,  0x455A14ED);

function bufferToHex(buffer) {
  const bytes = new Uint8Array(buffer);
  let hex = '';
  for (let i = 0; i < bytes.length; i++) {
    hex += bytes[i].toString(16).padStart(2, '0');
  }
  return hex.toLowerCase();
}
function formatFileSize(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}
function getEncoder() { return new TextEncoder(); }
async function computeHash(data, algo, hmacMode, key) {
  if (algo === 'MD5') {
    if (hmacMode && key) {
      return hmacMD5(data, key);
    }
    return MD5.md5(data);
  }
  const algoMap = { 'SHA-1': 'SHA-1', 'SHA-256': 'SHA-256', 'SHA-384': 'SHA-384', 'SHA-512': 'SHA-512' };
  const cryptoAlgo = algoMap[algo];
  if (!cryptoAlgo) return '';
  try {
    const encoder = getEncoder();
    const dataBuffer = typeof data === 'string' ? encoder.encode(data) : data;
    if (hmacMode && key) {
      const keyData = encoder.encode(key);
      const cryptoKey = await crypto.subtle.importKey(
        'raw', keyData, { name: 'HMAC', hash: cryptoAlgo }, false, ['sign']
      );
      const signature = await crypto.subtle.sign('HMAC', cryptoKey, dataBuffer);
      return bufferToHex(signature);
    } else {
      const hashBuffer = await crypto.subtle.digest(cryptoAlgo, dataBuffer);

function hmacMD5(data, key) {
  const encoder = getEncoder();
  let keyBytes = encoder.encode(key);
  const blockSize = 64;
  if (keyBytes.length > blockSize) {
    keyBytes = encoder.encode(MD5.md5(key));
  }
  const ipad = new Uint8Array(blockSize);
  const opad = new Uint8Array(blockSize);
  for (let i = 0; i < blockSize; i++) {
    ipad[i] = 0x36;
    opad[i] = 0x5c;
  }
  for (let i = 0; i < keyBytes.length; i++) {
    ipad[i] ^= keyBytes[i];
    opad[i] ^= keyBytes[i];
  }
  const inner = new TextDecoder().decode(ipad) + data;
  const innerHash = MD5.md5(inner);
  const outer = new TextDecoder().decode(opad) + innerHash;

}

async function processFile(file) {

  fileSize.textContent = formatFileSize(file.size);
  fileInfo.classList.remove('hidden');
  fileProgress.classList.remove('hidden');
  fileHashResult.classList.add('hidden');
  fileProgress.value = 0;
  const algo = algorithm.value;
  const reader = new FileReader();
  const CHUNK_SIZE = 256 * 1024;
  let processed = 0;
  try {
    if (algo !== 'MD5' && file.size > CHUNK_SIZE) {
      const fullBuffer = await file.arrayBuffer();
      fileProgress.value = 50;
      const hash = await computeHashBuffer(fullBuffer, algo);
      fileProgress.value = 100;
      displayFileHash(algo, hash);
    } else if (algo === 'MD5') {
      reader.onprogress = (e) => {
        if (e.lengthComputable) {
          fileProgress.value = Math.round((e.loaded / e.total) * 100);
        }
      };
      reader.onload = async (e) => {
        fileProgress.value = 100;
        const hash = await computeHash(e.target.result, 'MD5', false, '');
        displayFileHash('MD5', hash);
      };
      reader.onerror = () => {
        garyyToast('文件读取失败');
        fileProgress.classList.add('hidden');
      };
      reader.readAsBinaryString(file);
    } else {
      reader.onprogress = (e) => {
        if (e.lengthComputable) {
          fileProgress.value = Math.round((e.loaded / e.total) * 100);
        }
      };
      reader.onload = async (e) => {
        fileProgress.value = 100;
        const buffer = e.target.result;
        const hash = await computeHash(new Uint8Array(buffer), algo, false, '');
        displayFileHash(algo, hash);
      };
      reader.onerror = () => {
        garyyToast('文件读取失败');
        fileProgress.classList.add('hidden');
      };
      reader.readAsArrayBuffer(file);
    }
  } catch (e) {
    garyyToast('文件处理出错: ' + e.message);
    fileProgress.classList.add('hidden');
  }
}

const HISTORY_KEY = 'hash_generator_history';
const MAX_HISTORY = 20;
function getHistory() {
  try {
    return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
  } catch (e) {
    return [];
  }
}
function saveHistory(history) {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (e) {
  }
}
function addToHistoryIfValid(hash) {
  if (!hash || hash.length < 4) return;
  const algo = algorithm.value;
  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const entry = {
    algo: algo,
    hash: hash.toLowerCase(),
    time: timeStr,
    truncated: hash.length > 32 ? hash.substring(0, 32) + '...' : hash
  };
  let history = getHistory();
  history = history.filter(h => !(h.hash === entry.hash && h.algo === entry.algo));
  history.unshift(entry);
  if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
  saveHistory(history);
  renderHistory();
}
function renderHistory() {
  const history = getHistory();
  historyList.innerHTML = '';
  if (history.length === 0) {
    historyList.innerHTML = '<li style="text-align:center;color:var(--text-secondary);padding:20px;">暂无历史记录</li>';
    return;
  }
  history.forEach((entry, index) => {
    const li = document.createElement('li');
    li.className = 'history-item';
    li.innerHTML = `
      <span class="algo-tag">${entry.algo}</span>
      <span class="hash" title="${entry.hash}">${entry.truncated}</span>
      <span class="meta">${entry.time}</span>
    `;
    li.style.cursor = 'pointer';
    li.onclick = () => {
      hashOutput.value = entry.hash;
      document.getElementById('caseToggle').value = 'lower';
      updateOutputCase();
      runCompare();
    };
    historyList.appendChild(li);
  });
}
function clearHistory() {
  if (confirm('确定要清空所有历史记录吗？')) {
    localStorage.removeItem(HISTORY_KEY);

  }
}
function init() {

    handleInputChange();
  });
}
document.addEventListener('DOMContentLoaded', init);
