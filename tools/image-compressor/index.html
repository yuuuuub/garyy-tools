<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片压缩</title>
<meta name="description" content="图片压缩工具，减小图片文件大小保持画质">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--radius:12px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:700px;margin:0 auto}
h1{font-size:1.5rem;text-align:center;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:.2s}
.upload-area:hover,.upload-area.dragover{border-color:var(--accent);background:rgba(59,130,246,.05)}
.upload-area p{color:var(--muted);margin-top:8px;font-size:.9rem}
.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.preview-box{text-align:center}
.preview-box .label{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.preview-box img{width:100%;max-height:300px;object-fit:contain;border-radius:8px;border:1px solid var(--border);background:#000}
.slider-row{margin-bottom:12px}
.slider-row label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--border);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer}
.format-row{display:flex;gap:8px;margin-bottom:12px}
.format-btn{padding:8px 16px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text);cursor:pointer;font-size:.85rem;transition:.2s}
.format-btn.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.stats-row{display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:12px 0}
.stat-item{text-align:center}
.stat-val{font-size:1.2rem;font-weight:700;color:var(--accent)}
.stat-lbl{font-size:.75rem;color:var(--muted);margin-top:2px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}
.btn-primary{background:var(--accent);color:var(--text)}.btn-primary:hover{opacity:.9}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-group{display:flex;gap:8px;justify-content:center}
.hidden{display:none}
.gallery{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.gallery-item{position:relative;flex-shrink:0;width:80px;height:80px;border-radius:6px;overflow:hidden;border:1px solid var(--border);cursor:pointer}
.gallery-item img{width:100%;height:100%;object-fit:cover}
.gallery-item.active{border-color:var(--accent)}
.gallery-item .size-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);font-size:.6rem;text-align:center;padding:2px;color:var(--text)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="图片压缩">
  <meta property="og:description" content="图片压缩工具，减小图片文件大小保持画质">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/image-compressor/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🖼️ 图片压缩</h1>
<div class="card" id="uploadCard">
<div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
<p>📁 点击或拖拽图片上传<br><span style="font-size:.8rem">支持 JPG, PNG, WebP, BMP</span></p>
</div>
<input type="file" id="fileInput" accept="image/*" multiple class="hidden" onchange="handleFiles(event)">
</div>
<div class="card hidden" id="editCard">
<div class="gallery" id="gallery"></div>
<div class="preview-grid">
<div class="preview-box"><div class="label">原始图片</div><img id="origImg" loading="lazy"></div>
<div class="preview-box"><div class="label">压缩预览</div><img id="compImg" loading="lazy"></div>
</div>
<div class="slider-row"><label><span>压缩质量</span><span id="qualityText">80%</span></label><input type="range" min="1" max="100" value="80" id="qualitySlider" oninput="updateQuality()"></div>
<div class="format-row">
<button class="format-btn active" onclick="setFormat('image/jpeg',this)">JPEG</button>
<button class="format-btn" onclick="setFormat('image/png',this)">PNG</button>
<button class="format-btn" onclick="setFormat('image/webp',this)">WebP</button>
</div>
<div class="stats-row">
<div class="stat-item"><div class="stat-val" id="origSize">--</div><div class="stat-lbl">原始大小</div></div>
<div class="stat-item"><div class="stat-val" id="compSize">--</div><div class="stat-lbl">压缩后</div></div>
<div class="stat-item"><div class="stat-val" id="savingPercent">--</div><div class="stat-lbl">节省</div></div>
</div>
<div class="btn-group">
<button class="btn btn-primary" onclick="downloadAll()">下载全部</button>
<button class="btn btn-outline" onclick="resetAll()">重新上传</button>
</div>
</div>
</div>
<script>
let files = [], currentIndex = 0, quality = 0.8, format = 'image/jpeg';
const fileDataMap = [];

function handleFiles(e) {
  const newFiles = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
  if (!newFiles.length) return;
  newFiles.forEach(f => {
    const reader = new FileReader();
    reader.onload = ev => {
      files.push({ name: f.name, dataUrl: ev.target.result });
      compressAndPreview(files.length - 1);
    };
    reader.readAsDataURL(f);
  });
  e.target.value = '';
}

function compressAndPreview(idx) {
  const file = files[idx];
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    let w = img.width, h = img.height;
    if (w > 2000) { const ratio = 2000 / w; w = 2000; h = Math.round(h * ratio); }
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    const dataUrl = canvas.toDataURL(format, quality);
    fileDataMap[idx] = { width: w, height: h, dataUrl: dataUrl };
    if (files.length === 1 || idx === files.length - 1) showPreview(0);
  };
  img.src = file.dataUrl;
}

function showPreview(idx) {
  currentIndex = idx;
  document.getElementById('uploadCard').classList.add('hidden');
  document.getElementById('editCard').classList.remove('hidden');
  renderGallery();
  const file = files[idx];
  const comp = fileDataMap[idx];
  document.getElementById('origImg').src = file.dataUrl;
  document.getElementById('compImg').src = comp ? comp.dataUrl : file.dataUrl;
  updateStats(idx);
}

function renderGallery() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  files.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'gallery-item' + (i === currentIndex ? ' active' : '');
    const comp = fileDataMap[i];
    const sizeText = comp ? formatSize(dataUrlToSize(comp.dataUrl)) : '';
    item.innerHTML = `<img src="${f.dataUrl}" loading="lazy"><div class="size-label">${sizeText}</div>`;
    item.onclick = () => showPreview(i);
    gallery.appendChild(item);
  });
}

function updateQuality() {
  quality = parseInt(document.getElementById('qualitySlider').value) / 100;
  document.getElementById('qualityText').textContent = Math.round(quality * 100) + '%';
  compressAndPreview(currentIndex);
}

function setFormat(f, el) {
  format = f;
  document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  compressAndPreview(currentIndex);
}

function updateStats(idx) {
  const orig = files[idx].dataUrl;
  const comp = fileDataMap[idx] ? fileDataMap[idx].dataUrl : orig;
  const origBytes = dataUrlToSize(orig);
  const compBytes = dataUrlToSize(comp);
  const pct = origBytes > 0 ? Math.round((1 - compBytes / origBytes) * 100) : 0;
  document.getElementById('origSize').textContent = formatSize(origBytes);
  document.getElementById('compSize').textContent = formatSize(compBytes);
  document.getElementById('savingPercent').textContent = pct + '%';
  document.getElementById('savingPercent').style.color = pct > 0 ? 'var(--success)' : 'var(--muted)';
}

function dataUrlToSize(d) { return Math.round((d.length - 'data:application/octet-stream;base64,'.length) * 3 / 4); }
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function downloadAll() {
  files.forEach((f, i) => {
    const comp = fileDataMap[i];
    if (!comp) return;
    const a = document.createElement('a');
    a.href = comp.dataUrl;
    const ext = format === 'image/png' ? '.png' : format === 'image/webp' ? '.webp' : '.jpg';
    a.download = f.name.replace(/\.\w+$/, '') + '_compressed' + ext;
    a.click();
  });
}

function resetAll() {
  files = []; fileDataMap.length = 0;
  document.getElementById('uploadCard').classList.remove('hidden');
  document.getElementById('editCard').classList.add('hidden');
}

document.addEventListener('DOMContentLoaded', () => {
  const area = document.getElementById('uploadArea');
  area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
  area.addEventListener('dragleave', () => area.classList.remove('dragover'));
  area.addEventListener('drop', e => {
    e.preventDefault(); area.classList.remove('dragover');
    const fileList = { target: { files: e.dataTransfer.files, value: '' } };
    handleFiles(fileList);
  });
});
</script>
<script src="../i18n.js" defer>
document.getElementById("fileInput").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();downloadAll();}});
</script>
</body>
</html>
