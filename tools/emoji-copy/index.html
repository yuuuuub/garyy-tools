<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表情复制</title>
<meta name="description" content="Emoji表情复制工具，一键复制Emoji到剪贴板">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent-hover:#2563eb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8rem;margin:20px 0 8px}
.sub{color:#8b949e;margin-bottom:24px;font-size:0.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:800px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.emoji-btn{background:var(--bg);border:2px solid var(--border);border-radius:8px;font-size:1.6rem;padding:8px 0;cursor:pointer;transition:all .15s;text-align:center;user-select:none}
.emoji-btn:hover{border-color:var(--accent);transform:scale(1.1)}
.emoji-btn.selected{border-color:var(--accent);background:rgba(59,130,246,0.15)}
.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{padding:10px 20px;border:none;border-radius:8px;font-size:0.95rem;cursor:pointer;font-weight:500;transition:background .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--border);color:var(--text)}.btn-secondary:hover{background:#444c56}
.selected-bar{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px;align-items:center}
.selected-bar:empty::before{content:"已选表情将显示在这里";color:#484f58;font-size:0.9rem}
.sel-item{font-size:1.4rem;cursor:pointer;transition:transform .15s}
.sel-item:hover{transform:scale(1.3)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cat-btn{padding:5px 12px;border:1px solid var(--border);border-radius:16px;background:transparent;color:var(--text);cursor:pointer;font-size:0.8rem;transition:all .2s}
.cat-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.count-info{color:#8b949e;font-size:0.85rem;margin-bottom:10px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:10px 24px;border-radius:8px;font-size:0.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">

  <meta property="og:title" content="表情复制">
  <meta property="og:description" content="Emoji表情复制工具，一键复制Emoji到剪贴板">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/emoji-copy/">
</head>
<body>
<h1>表情复制</h1>
<p class="sub">点击单个复制，或勾选多个批量复制</p>
<div class="card">
<div class="cats" id="cats"></div>
<div class="count-info" id="countInfo"></div>
<div class="grid" id="grid"></div>
</div>
<div class="card">
<div style="font-size:0.95rem;font-weight:500;margin-bottom:6px">已选表情</div>
<div class="selected-bar" id="selectedBar"></div>
<div class="btn-row">
<button class="btn-primary" onclick="copySelected()">复制已选 (<span id="selCount">0</span>)</button>
<button class="btn-secondary" onclick="clearSelected()">清空选择</button>
</div>
</div>
<div class="toast" id="toast">已复制到剪贴板</div>

];
const cats=['全部',...new Set(ALL_EMOJIS.map(e=>e.c))];
let activeCat='全部';
let selected=new Set();
function init(){
document.getElementById('cats').innerHTML=cats.map(c=>
`<button class="cat-btn${c==='全部'?' active':''}" onclick="selectCat('${c}',this)">${c}</button>`
).join('');
render();
}
function selectCat(cat,el){
activeCat=cat;
document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
render();
}
function render(){
const list=activeCat==='全部'?ALL_EMOJIS:ALL_EMOJIS.filter(e=>e.c===activeCat);
document.getElementById('countInfo').textContent=`${activeCat} · ${list.length} 个表情`;
document.getElementById('grid').innerHTML=list.map(e=>
`<div class="emoji-btn${selected.has(e.e)?' selected':''}" onclick="toggleEmoji('${e.e}')" title="${e.n}">${e.e}</div>`
).join('');
}
function toggleEmoji(emoji){
if(selected.has(emoji)){
selected.delete(emoji);
navigator.clipboard.writeText(emoji).then(()=>showToast('已复制'));
}else{
selected.add(emoji);
}
updateSelectedBar();
render();
}
function updateSelectedBar(){
const bar=document.getElementById('selectedBar');
const arr=[...selected];
document.getElementById('selCount').textContent=arr.length;
if(arr.length===0){bar.innerHTML='';return;}
bar.innerHTML=arr.map(e=>`<span class="sel-item" onclick="removeSelected('${e}')" title="点击移除">${e}</span>`).join('');
}
function removeSelected(emoji){selected.delete(emoji);updateSelectedBar();render();}
function clearSelected(){selected.clear();updateSelectedBar();render();}
function copySelected(){
const arr=[...selected];
if(arr.length===0)return;
navigator.clipboard.writeText(arr.join('')).then(()=>showToast(`已复制 ${arr.length} 个表情`));
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}
init();
