<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="投资组合优化器 - 基于均值-方差模型的最优资产配置分析工具">
    <meta name="robots" content="index, follow">
    <title>投资组合优化器</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="i18n.js" defer></script>
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #6366f1; --secondary-color: #6b7280; --success-color: #10b981; --warning-color: #f59e0b; --danger-color: #ef4444; --border-color: #e5e7eb; --card-bg: #f9fafb; --accent: #818cf8; }
        [data-theme="dark"] { --bg-color: #111827; --text-color: #f9fafb; --primary-color: #818cf8; --secondary-color: #9ca3af; --success-color: #34d399; --warning-color: #fbbf24; --danger-color: #f87171; --border-color: #374151; --card-bg: #1f2937; --accent: #6366f1; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-top: 0; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 12px; background: var(--card-bg); margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); color: var(--text-color); font-size: 14px; }
        input:focus, select:focus { outline: 2px solid var(--primary-color); border-color: transparent; }
        button { background: var(--primary-color); color: #fff; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: opacity 0.2s; }
        button:hover { opacity: 0.85; }
        .btn-danger { background: var(--danger-color); }
        .btn-success { background: var(--success-color); }
        .btn-sm { padding: 5px 12px; font-size: 13px; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 14px; background: var(--secondary-color); color: #fff; border: none; border-radius: 8px; cursor: pointer; z-index: 100; }
        .asset-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; }
        .asset-row input { flex: 1; }
        .asset-row .remove { background: var(--danger-color); color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 16px; flex-shrink: 0; }
        .result-chart { width: 100%; height: 300px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; position: relative; overflow: hidden; }
        .chart-canvas { width: 100%; height: 100%; }
        .stat-row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
        .stat-box { flex: 1; min-width: 120px; text-align: center; padding: 16px 10px; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--border-color); }
        .stat-box .num { font-size: 24px; font-weight: 700; color: var(--primary-color); }
        .stat-box .lbl { font-size: 12px; color: var(--secondary-color); margin-top: 4px; }
        .weight-bar { height: 8px; background: var(--border-color); border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .weight-bar .fill { height: 100%; border-radius: 4px; }
        .weight-bar .fill.c1 { background: #6366f1; }
        .weight-bar .fill.c2 { background: #10b981; }
        .weight-bar .fill.c3 { background: #f59e0b; }
        .weight-bar .fill.c4 { background: #ef4444; }
        .weight-bar .fill.c5 { background: #8b5cf6; }
        .weight-bar .fill.c6 { background: #06b6d4; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { font-weight: 600; color: var(--secondary-color); }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .tag-low { background: #d1fae5; color: #065f46; }
        .tag-med { background: #fef3c7; color: #92400e; }
        .tag-high { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>📊 投资组合优化器</h1>
        <p style="color:var(--secondary-color)">基于马科维茨均值-方差模型，计算最优资产配置比例</p>

        <div class="card">
            <h3>添加资产</h3>
            <div id="assetsList"></div>
            <button onclick="addAsset()" style="margin-top:10px">+ 添加资产</button>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>优化参数</h3>
                <label>风险厌恶系数 (A)</label>
                <input type="number" id="riskAversion" value="3" min="0.1" max="20" step="0.1">
                <label style="margin-top:12px">目标年化收益率 (%)</label>
                <input type="number" id="targetReturn" value="10" min="0" max="50" step="0.5">
                <label style="margin-top:12px">无风险利率 (%)</label>
                <input type="number" id="riskFreeRate" value="2.5" min="0" max="10" step="0.1">
                <label style="margin-top:12px">优化目标</label>
                <select id="optGoal">
                    <option value="sharpe">最大夏普比率</option>
                    <option value="minvar">最小方差</option>
                    <option value="target">目标收益</option>
                </select>
                <button onclick="optimize()" style="margin-top:16px;width:100%">运行优化</button>
            </div>
            <div class="card">
                <h3>优化结果</h3>
                <div class="stat-row" id="resultStats"></div>
                <div id="weightsDisplay" style="margin-top:16px"></div>
            </div>
        </div>

        <div class="card">
            <h3>有效前沿</h3>
            <div class="result-chart">
                <canvas id="frontierCanvas" class="chart-canvas"></canvas>
            </div>
        </div>

        <div class="card">
            <h3>相关性矩阵</h3>
            <div id="corrMatrix"></div>
        </div>
    </div>

    <script>
        const COLORS = ['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16'];
        let assets = [
            { name: '沪深300', ret: 10, vol: 22, weight: 40 },
            { name: '中证500', ret: 12, vol: 28, weight: 20 },
            { name: '债券基金', ret: 4, vol: 5, weight: 30 },
            { name: '货币基金', ret: 2, vol: 0.5, weight: 10 }
        ];
        let corrMatrix = [];

        function init() {
            renderAssets();
            generateCorrelation();
        }

        function renderAssets() {
            const el = document.getElementById('assetsList');
            el.innerHTML = assets.map((a, i) => `
                <div class="asset-row">
                    <input value="${a.name}" placeholder="资产名称" onchange="assets[${i}].name=this.value">
                    <input type="number" value="${a.ret}" placeholder="年化收益%" step="0.1" onchange="assets[${i}].ret=+this.value" style="max-width:100px">
                    <input type="number" value="${a.vol}" placeholder="波动率%" step="0.1" onchange="assets[${i}].vol=+this.value" style="max-width:100px">
                    <button class="remove" onclick="removeAsset(${i})">×</button>
                </div>
            `).join('');
        }

        function addAsset() {
            assets.push({ name: '新资产', ret: 8, vol: 15, weight: 0 });
            renderAssets();
            generateCorrelation();
        }

        function removeAsset(i) {
            if (assets.length <= 2) return alert('至少保留2个资产');
            assets.splice(i, 1);
            renderAssets();
            generateCorrelation();
        }

        function generateCorrelation() {
            const n = assets.length;
            corrMatrix = [];
            for (let i = 0; i < n; i++) {
                corrMatrix[i] = [];
                for (let j = 0; j < n; j++) {
                    if (i === j) corrMatrix[i][j] = 1;
                    else if (j < i) corrMatrix[i][j] = corrMatrix[j][i];
                    else {
                        const base = 0.3 + Math.random() * 0.4;
                        const sameType = assets[i].vol < 10 && assets[j].vol < 10;
                        corrMatrix[i][j] = sameType ? 0.6 + Math.random() * 0.3 : base;
                    }
                }
            }
            renderCorrMatrix();
        }

        function renderCorrMatrix() {
            const n = assets.length;
            let html = '<table><tr><th></th>';
            assets.forEach(a => html += `<th style="text-align:center">${a.name}</th>`);
            html += '</tr>';
            for (let i = 0; i < n; i++) {
                html += `<tr><td style="font-weight:600">${assets[i].name}</td>`;
                for (let j = 0; j < n; j++) {
                    const v = corrMatrix[i][j];
                    const intensity = Math.round(v * 200);
                    const bg = v === 1 ? 'var(--primary-color)' : `rgba(99,102,241,${v * 0.3})`;
                    const tc = v === 1 ? '#fff' : 'var(--text-color)';
                    html += `<td style="text-align:center;background:${bg};color:${tc};border-radius:4px">${v.toFixed(2)}</td>`;
                }
                html += '</tr>';
            }
            html += '</table>';
            document.getElementById('corrMatrix').innerHTML = html;
        }

        function optimize() {
            if (assets.length < 2) return alert('请添加至少2个资产');
            const A = +document.getElementById('riskAversion').value;
            const rf = +document.getElementById('riskFreeRate').value / 100;
            const n = assets.length;
            const rets = assets.map(a => a.ret / 100);
            const vols = assets.map(a => a.vol / 100);

            const covMatrix = [];
            for (let i = 0; i < n; i++) {
                covMatrix[i] = [];
                for (let j = 0; j < n; j++) {
                    covMatrix[i][j] = corrMatrix[i][j] * vols[i] * vols[j];
                }
            }

            let weights;
            const goal = document.getElementById('optGoal').value;

            if (goal === 'minvar') {
                weights = solveMinVar(covMatrix, n);
            } else if (goal === 'sharpe') {
                weights = solveMaxSharpe(rets, covMatrix, rf, n);
            } else {
                const target = +document.getElementById('targetReturn').value / 100;
                weights = solveTargetReturn(rets, covMatrix, target, n);
            }

            assets.forEach((a, i) => a.weight = +(weights[i] * 100).toFixed(1));
            renderAssets();
            renderResults(weights, rets, covMatrix, rf, n);
            drawFrontier(rets, covMatrix, weights, rf, n);
        }

        function solveMinVar(cov, n) {
            const w = Array(n).fill(1 / n);
            for (let iter = 0; iter < 200; iter++) {
                const grad = w.map((_, i) => {
                    let g = 0;
                    for (let j = 0; j < n; j++) g += cov[i][j] * w[j];
                    return g;
                });
                let lr = 0.01;
                for (let i = 0; i < n; i++) w[i] -= lr * grad[i];
                const sum = w.reduce((a, b) => a + b, 0);
                for (let i = 0; i < n; i++) w[i] = Math.max(0.01, w[i] / sum);
            }
            return w;
        }

        function solveMaxSharpe(rets, cov, rf, n) {
            const w = Array(n).fill(1 / n);
            for (let iter = 0; iter < 300; iter++) {
                let portRet = 0, portVar = 0;
                for (let i = 0; i < n; i++) {
                    portRet += w[i] * rets[i];
                    for (let j = 0; j < n; j++) portVar += w[i] * w[j] * cov[i][j];
                }
                const portVol = Math.sqrt(portVar);
                const sharpe = (portRet - rf) / (portVol || 0.001);

                const grad = w.map((_, i) => {
                    let dVar = 0;
                    for (let j = 0; j < n; j++) dVar += 2 * w[j] * cov[i][j];
                    return (-(portRet - rf) * dVar / (2 * portVar) + rets[i]) / portVol;
                });
                let lr = 0.005;
                for (let i = 0; i < n; i++) w[i] += lr * grad[i];
                const sum = w.reduce((a, b) => a + b, 0);
                for (let i = 0; i < n; i++) w[i] = Math.max(0.001, w[i] / sum);
            }
            return w;
        }

        function solveTargetReturn(rets, cov, target, n) {
            const w = Array(n).fill(1 / n);
            for (let iter = 0; iter < 200; iter++) {
                let portRet = 0;
                for (let i = 0; i < n; i++) portRet += w[i] * rets[i];

                const grad = w.map((_, i) => {
                    let g = 0;
                    for (let j = 0; j < n; j++) g += 2 * cov[i][j] * w[j];
                    return g + 5 * (portRet - target) * rets[i];
                });
                let lr = 0.005;
                for (let i = 0; i < n; i++) w[i] -= lr * grad[i];
                const sum = w.reduce((a, b) => a + b, 0);
                for (let i = 0; i < n; i++) w[i] = Math.max(0.001, w[i] / sum);
            }
            return w;
        }

        function renderResults(w, rets, cov, rf, n) {
            let portRet = 0, portVar = 0;
            for (let i = 0; i < n; i++) {
                portRet += w[i] * rets[i];
                for (let j = 0; j < n; j++) portVar += w[i] * w[j] * cov[i][j];
            }
            const portVol = Math.sqrt(portVar);
            const sharpe = (portRet - rf) / (portVol || 0.001);

            document.getElementById('resultStats').innerHTML = `
                <div class="stat-box"><div class="num">${(portRet * 100).toFixed(2)}%</div><div class="lbl">预期年化收益</div></div>
                <div class="stat-box"><div class="num">${(portVol * 100).toFixed(2)}%</div><div class="lbl">预期波动率</div></div>
                <div class="stat-box"><div class="num">${sharpe.toFixed(2)}</div><div class="lbl">夏普比率</div></div>
                <div class="stat-box"><div class="num">${(portVol * 100 * 1.645).toFixed(2)}%</div><div class="lbl">VaR (95%)</div></div>
            `;

            let weightHtml = '<table><tr><th>资产</th><th>权重</th><th>分布</th><th>风险等级</th></tr>';
            assets.forEach((a, i) => {
                const tag = a.vol < 10 ? '<span class="tag tag-low">低风险</span>' :
                    a.vol < 20 ? '<span class="tag tag-med">中风险</span>' :
                        '<span class="tag tag-high">高风险</span>';
                weightHtml += `<tr><td>${a.name}</td><td>${a.weight.toFixed(1)}%</td>
                    <td><div class="weight-bar"><div class="fill c${(i % 6) + 1}" style="width:${a.weight}%"></div></div></td>
                    <td>${tag}</td></tr>`;
            });
            weightHtml += '</table>';
            document.getElementById('weightsDisplay').innerHTML = weightHtml;
        }

        function drawFrontier(rets, cov, optW, rf, n) {
            const canvas = document.getElementById('frontierCanvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.parentElement.clientWidth;
            const H = 300;
            canvas.width = W * 2;
            canvas.height = H * 2;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.scale(2, 2);

            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--card-bg').trim();
            ctx.fillRect(0, 0, W, H);

            const points = [];
            for (let t = 0; t < 2000; t++) {
                const w = Array(n).fill(0).map(() => Math.random());
                const sum = w.reduce((a, b) => a + b, 0);
                w.forEach((_, i) => w[i] /= sum);

                let pRet = 0, pVar = 0;
                for (let i = 0; i < n; i++) {
                    pRet += w[i] * rets[i];
                    for (let j = 0; j < n; j++) pVar += w[i] * w[j] * cov[i][j];
                }
                points.push({ x: Math.sqrt(pVar), y: pRet });
            }

            const xMin = 0, xMax = Math.max(...points.map(p => p.x)) * 1.1;
            const yMin = Math.min(...points.map(p => p.y)) * 0.9, yMax = Math.max(...points.map(p => p.y)) * 1.1;
            const pad = { l: 50, r: 20, t: 20, b: 40 };

            ctx.strokeStyle = '#555';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 5; i++) {
                const x = pad.l + (i / 5) * (W - pad.l - pad.r);
                ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, H - pad.b); ctx.stroke();
                ctx.fillStyle = '#999'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText((xMin + i / 5 * (xMax - xMin) * 100).toFixed(1) + '%', x, H - 10);
            }

            points.forEach(p => {
                const sx = pad.l + (p.x - xMin) / (xMax - xMin) * (W - pad.l - pad.r);
                const sy = H - pad.b - (p.y - yMin) / (yMax - yMin) * (H - pad.t - pad.b);
                ctx.fillStyle = 'rgba(99,102,241,0.15)';
                ctx.beginPath(); ctx.arc(sx, sy, 2, 0, Math.PI * 2); ctx.fill();
            });

            let optRet = 0, optVar = 0;
            for (let i = 0; i < n; i++) {
                optRet += optW[i] * rets[i];
                for (let j = 0; j < n; j++) optVar += optW[i] * optW[j] * cov[i][j];
            }
            const optX = pad.l + (Math.sqrt(optVar) - xMin) / (xMax - xMin) * (W - pad.l - pad.r);
            const optY = H - pad.b - (optRet - yMin) / (yMax - yMin) * (H - pad.t - pad.b);
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.arc(optX, optY, 6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ef4444'; ctx.font = 'bold 12px sans-serif';
            ctx.fillText('最优组合', optX + 10, optY - 8);

            ctx.fillStyle = '#999'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('波动率 (风险)', W / 2, H - 2);
            ctx.save(); ctx.translate(14, H / 2); ctx.rotate(-Math.PI / 2);
            ctx.fillText('预期收益率', 0, 0); ctx.restore();
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        init();
        window.addEventListener('resize', () => { if (assets.length >= 2) optimize(); });
    </script>
</body>
</html>
