<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酒店比价工具</title>
<meta property="og:title" content="酒店比价工具">
<meta property="og:description" content="比较不同酒店的价格和设施">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="酒店比价工具，比较不同酒店价格、设施和服务">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:16px;min-height:100vh;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.gr .st{text-align:center;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.gr .st .nm{font-size:1.3rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.75rem;color:var(--text2);margin-top:4px}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text);margin-right:4px;margin-bottom:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.hotel-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .15s}
.hotel-card:hover{transform:translateY(-2px)}
.hotel-card.fav{border-color:var(--warn)}
.hotel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.hotel-name{font-weight:600;font-size:1.05rem}
.hotel-price{font-size:1.2rem;font-weight:700;color:var(--warn);white-space:nowrap}
.hotel-stars{color:var(--warn);font-size:.9rem;margin-bottom:4px}
.hotel-loc{font-size:.85rem;color:var(--text2);margin-bottom:6px}
.hotel-amenities{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.amenity{font-size:.75rem;padding:2px 8px;border-radius:12px;background:var(--bg);color:var(--text2)}
.hotel-footer{display:flex;justify-content:space-between;align-items:center}
.chart-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chart-label{min-width:80px;font-size:.8rem;color:var(--text2);text-align:right}
.chart-fill{height:20px;border-radius:4px;transition:width .3s;min-width:2px}
.chart-val{font-size:.8rem;font-weight:600;min-width:50px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filter-row select{flex:1;min-width:120px}
.sort-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sort-btn{padding:4px 12px;border-radius:16px;font-size:.8rem;background:var(--bg);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s}
.sort-btn:hover,.sort-btn.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.amenity-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.am-btn{padding:4px 10px;border-radius:16px;font-size:.8rem;background:var(--bg);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s}
.am-btn:hover,.am-btn.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.total-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.es{text-align:center;padding:40px;color:var(--text2)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏨 酒店比价工具</h1><p>比较不同酒店价格和设施</p></div>

<div class="gr" id="stats"></div>

<div class="cd"><h2>🔍 搜索酒店</h2>
<div class="fr">
<div><label>城市</label><select id="searchCity"></select></div>
<div><label>入住日期</label><input type="date" id="checkin"></div>
</div>
<div class="fr" style="margin-top:8px">
<div><label>退房日期</label><input type="date" id="checkout"></div>
<div><label>排序方式</label><select id="sortBy"><option value="price">价格从低到高</option><option value="star">星级从高到低</option><option value="rating">评分从高到低</option></select></div>
</div>
<label>价格范围（¥/晚）</label>
<div class="fr">
<div><input type="number" id="minPrice" placeholder="最低价" value="0"></div>
<div><input type="number" id="maxPrice" placeholder="最高价" value="3000"></div>
</div>
<label>最低星级</label><select id="minStar"><option value="0">不限</option><option value="3">3星</option><option value="4">4星</option><option value="5">5星</option></select>
<label>必需设施</label>
<div class="amenity-filter" id="amenityFilter"></div>
<div class="bg"><button onclick="searchHotels()">🔍 搜索</button></div></div>

<div class="cd"><h2>📊 价格对比</h2><div id="priceChart"></div></div>

<div class="cd"><h2>🏨 酒店列表</h2><div id="hotelResults"><div class="es">请选择城市并搜索</div></div></div>
</div>

<script>
const AMENITIES=[
  {id:'wifi',icon:'📶',name:'WiFi'},{id:'breakfast',icon:'🍳',name:'早餐'},
  {id:'parking',icon:'🅿️',name:'停车场'},{id:'pool',icon:'🏊',name:'游泳池'},
  {id:'gym',icon:'💪',name:'健身房'},{id:'spa',icon:'🧖',name:'SPA'}
];
const HOTELS=[
  {name:'北京国贸大酒店',city:'北京',star:5,rating:4.8,price:880,amenities:['wifi','breakfast','parking','pool','gym','spa'],addr:'朝阳区建国门外大街1号'},
  {name:'北京如家快捷酒店',city:'北京',star:2,rating:4.2,price:220,amenities:['wifi'],addr:'东城区王府井大街'},
  {name:'北京希尔顿酒店',city:'北京',star:5,rating:4.7,price:950,amenities:['wifi','breakfast','pool','gym','spa'],addr:'朝阳区东三环北路'},
  {name:'北京全季酒店',city:'北京',star:3,rating:4.3,price:350,amenities:['wifi','breakfast'],addr:'海淀区中关村大街'},
  {name:'上海外滩华尔道夫',city:'上海',star:5,rating:4.9,price:1200,amenities:['wifi','breakfast','pool','gym','spa','parking'],addr:'黄浦区中山东一路2号'},
  {name:'上海锦江之星',city:'上海',star:2,rating:4.1,price:200,amenities:['wifi'],addr:'静安区南京西路'},
  {name:'上海浦东喜来登',city:'上海',star:5,rating:4.6,price:850,amenities:['wifi','breakfast','pool','gym','parking'],addr:'浦东新区陆家嘴'},
  {name:'成都太古里博舍酒店',city:'成都',star:5,rating:4.8,price:980,amenities:['wifi','breakfast','gym','spa'],addr:'锦江区中纱帽街'},
  {name:'成都如家酒店',city:'成都',star:2,rating:4.0,price:180,amenities:['wifi'],addr:'武侯区人民南路'},
  {name:'成都钓鱼台精品酒店',city:'成都',star:5,rating:4.7,price:780,amenities:['wifi','breakfast','pool','spa'],addr:'青羊区宽窄巷子'},
  {name:'杭州西湖国宾馆',city:'杭州',star:5,rating:4.8,price:1100,amenities:['wifi','breakfast','pool','gym','spa','parking'],addr:'西湖区杨公堤'},
  {name:'杭州汉庭酒店',city:'杭州',star:2,rating:4.1,price:190,amenities:['wifi'],addr:'上城区延安路'},
  {name:'杭州西溪喜来登',city:'杭州',star:5,rating:4.5,price:750,amenities:['wifi','breakfast','pool','gym'],addr:'西湖区紫金港路'},
  {name:'三亚亚特兰蒂斯',city:'三亚',star:5,rating:4.9,price:1500,amenities:['wifi','breakfast','pool','gym','spa','parking'],addr:'海棠区海棠北路'},
  {name:'三亚如家酒店',city:'三亚',star:2,rating:3.9,price:160,amenities:['wifi'],addr:'天涯区解放路'},
  {name:'三亚海棠湾红树林',city:'三亚',star:5,rating:4.6,price:880,amenities:['wifi','breakfast','pool','spa'],addr:'海棠区海棠北路'}
];
let favorites=JSON.parse(localStorage.getItem('hotel_favorites')||'[]');
let nights=1;
function $(id){return document.getElementById(id)}
function initCities(){
  const cities=[...new Set(HOTELS.map(h=>h.city))];
  $('searchCity').innerHTML=cities.map(c=>`<option value="${c}">${c}</option>`).join('');
}
function initAmenityFilter(){
  $('amenityFilter').innerHTML=AMENITIES.map(a=>`<button class="am-btn" data-id="${a.id}" onclick="this.classList.toggle('active')">${a.icon} ${a.name}</button>`).join('');
}
function getNights(){
  const ci=$('checkin').value,co=$('checkout').value;
  if(!ci||!co)return 1;
  const diff=Math.ceil((new Date(co)-new Date(ci))/(1000*60*60*24));
  return diff>0?diff:1;
}
function searchHotels(){
  const city=$('searchCity').value,sortBy=$('sortBy').value;
  const minP=parseInt($('minPrice').value)||0,maxP=parseInt($('maxPrice').value)||3000;
  const minS=parseInt($('minStar').value)||0;
  const requiredAmenities=[...document.querySelectorAll('.am-btn.active')].map(b=>b.dataset.id);
  nights=getNights();
  let filtered=HOTELS.filter(h=>{
    if(h.city!==city)return false;
    if(h.price<minP||h.price>maxP)return false;
    if(h.star<minS)return false;
    if(requiredAmenities.length&&!requiredAmenities.every(a=>h.amenities.includes(a)))return false;
    return true;
  });
  filtered.sort((a,b)=>{
    if(sortBy==='price')return a.price-b.price;
    if(sortBy==='star')return b.star-a.star;
    return b.rating-a.rating;
  });
  renderHotels(filtered);renderChart(filtered);
}
function renderHotels(hotels){
  if(!hotels.length){$('hotelResults').innerHTML='<div class="es">未找到符合条件的酒店</div>';updateStats(0);return;}
  $('hotelResults').innerHTML=hotels.map((h,i)=>{
    const isFav=favorites.includes(h.name);
    const total=h.price*nights;
    return `<div class="hotel-card ${isFav?'fav':''}">
      <div class="hotel-head">
        <div><span class="hotel-name">${h.name}</span><div class="hotel-stars">${'⭐'.repeat(h.star)} ${h.star}星</div></div>
        <span class="hotel-price">¥${h.price}<span style="font-size:.7rem;font-weight:400">/晚</span></span>
      </div>
      <div class="hotel-loc">📍 ${h.addr}</div>
      <div style="font-size:.85rem;margin-bottom:6px">评分 <span style="color:var(--warn);font-weight:600">${h.rating}</span>/5.0</div>
      <div class="hotel-amenities">${h.amenities.map(a=>{const am=AMENITIES.find(x=>x.id===a);return am?`<span class="amenity">${am.icon} ${am.name}</span>`:'';}).join('')}</div>
      <div class="hotel-footer">
        <div class="total-box" style="flex:1;margin-right:8px">
          <span style="font-size:.85rem">${nights}晚合计</span>
          <span style="font-weight:700;color:var(--warn)">¥${total}</span>
        </div>
        <button class="sec" style="padding:6px 12px;font-size:.85rem" onclick="toggleFav('${h.name}')">${isFav?'❤️':'🤍'}</button>
      </div>
    </div>`;
  }).join('');
  updateStats(hotels.length);
}
function renderChart(hotels){
  if(!hotels.length){$('priceChart').innerHTML='<div class="es">暂无数据</div>';return;}
  const maxPrice=Math.max(...hotels.map(h=>h.price));
  $('priceChart').innerHTML=hotels.map(h=>{
    const pct=Math.round(h.price/maxPrice*100);
    const isMin=h.price===Math.min(...hotels.map(x=>x.price));
    return `<div class="chart-bar">
      <span class="chart-label">${h.name.slice(0,6)}</span>
      <div class="chart-fill" style="width:${pct}%;background:${isMin?'var(--success)':'var(--accent)'}"></div>
      <span class="chart-val" style="color:${isMin?'var(--success)':'var(--text)'}">¥${h.price}</span>
    </div>`;
  }).join('');
}
function toggleFav(name){
  const idx=favorites.indexOf(name);
  if(idx>=0)favorites.splice(idx,1);else favorites.push(name);
  localStorage.setItem('hotel_favorites',JSON.stringify(favorites));searchHotels();
}
function updateStats(count){
  const city=$('searchCity').value;
  const cityHotels=HOTELS.filter(h=>h.city===city);
  const avgPrice=cityHotels.length?Math.round(cityHotels.reduce((s,h)=>s+h.price,0)/cityHotels.length):0;
  const minPrice=cityHotels.length?Math.min(...cityHotels.map(h=>h.price)):0;
  $('stats').innerHTML=`
    <div class="st"><div class="nm">${count}</div><div class="lb">搜索结果</div></div>
    <div class="st"><div class="nm">¥${avgPrice}</div><div class="lb">均价/晚</div></div>
    <div class="st"><div class="nm">¥${minPrice}</div><div class="lb">最低/晚</div></div>
    <div class="st"><div class="nm">${favorites.length}</div><div class="lb">收藏数</div></div>`;
}
const today=new Date().toISOString().slice(0,10);
const tomorrow=new Date(Date.now()+86400000).toISOString().slice(0,10);
$('checkin').value=today;$('checkout').value=tomorrow;
initCities();initAmenityFilter();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
