<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="品牌指南生成器 - 创建完整的品牌视觉规范文档">
    <meta name="robots" content="index, follow">
    <title>品牌指南生成器</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #007bff; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #0d6efd; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="color"], textarea, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        textarea { resize: vertical; min-height: 60px; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 8px; }
        button:hover { opacity: 0.9; }
        .btn-success { background-color: var(--success-color); }
        .btn-danger { background-color: var(--danger-color); }
        .btn-sm { padding: 4px 10px; font-size: 13px; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .output { white-space: pre-wrap; font-family: 'Courier New', monospace; line-height: 1.6; background: var(--bg-color); padding: 12px; border-radius: 4px; border: 1px solid var(--border-color); font-size: 13px; }
        .color-swatch { width: 60px; height: 60px; border-radius: 8px; border: 2px solid var(--border-color); cursor: pointer; display: inline-block; margin: 4px; position: relative; }
        .color-swatch .color-label { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; white-space: nowrap; }
        .font-preview { padding: 16px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; background: var(--card-bg); }
        .font-preview h4 { margin: 0 0 8px 0; color: var(--primary-color); }
        .font-preview .sample { font-size: 24px; margin-bottom: 4px; }
        .font-preview .detail { font-size: 13px; color: var(--secondary-color); }
        .tone-item { padding: 12px; border-left: 4px solid var(--primary-color); margin-bottom: 8px; border-radius: 0 4px 4px 0; background: var(--card-bg); }
        .do-dont-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .do-box { border: 2px solid var(--success-color); border-radius: 8px; padding: 16px; }
        .dont-box { border: 2px solid var(--danger-color); border-radius: 8px; padding: 16px; }
        .preview-section { margin-top: 20px; padding: 20px; border: 2px dashed var(--border-color); border-radius: 8px; }
        .logo-placeholder { width: 120px; height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>品牌指南生成器</h1>

        <div class="card">
            <h3>品牌基本信息</h3>
            <div class="grid-2">
                <div class="form-group"><label>品牌名称</label><input type="text" id="brandName" placeholder="品牌名称"></div>
                <div class="form-group"><label>品牌标语</label><input type="text" id="brandSlogan" placeholder="品牌Slogan"></div>
            </div>
            <div class="form-group"><label>品牌描述</label><textarea id="brandDesc" rows="2" placeholder="品牌的核心理念和价值主张..."></textarea></div>
            <div class="form-group"><label>品牌个性</label><input type="text" id="brandPersonality" placeholder="例如：专业、创新、亲和、可靠"></div>
        </div>

        <div class="card">
            <h3>品牌色彩</h3>
            <div class="grid-3">
                <div class="form-group"><label>主色</label><input type="color" id="primaryColor" value="#007bff" onchange="updateSwatches()"><div id="primaryHex" style="text-align:center;margin-top:4px;font-size:13px;">#007bff</div></div>
                <div class="form-group"><label>辅色</label><input type="color" id="secondaryColor" value="#6c757d" onchange="updateSwatches()"><div id="secondaryHex" style="text-align:center;margin-top:4px;font-size:13px;">#6c757d</div></div>
                <div class="form-group"><label>强调色</label><input type="color" id="accentColor" value="#28a745" onchange="updateSwatches()"><div id="accentHex" style="text-align:center;margin-top:4px;font-size:13px;">#28a745</div></div>
            </div>
            <div class="form-group"><label>背景色</label><input type="color" id="bgColor" value="#ffffff" onchange="updateSwatches()"></div>
            <div class="form-group"><label>文字色</label><input type="color" id="textColor" value="#333333" onchange="updateSwatches()"></div>
            <div id="colorSwatches" style="margin-top:16px;"></div>
        </div>

        <div class="card">
            <h3>字体规范</h3>
            <div id="fontsContainer">
                <div class="form-group grid-2">
                    <div><label>标题字体</label><select class="font-family" id="headingFont"><option value="Inter, sans-serif">Inter</option><option value="'Noto Sans SC', sans-serif">Noto Sans SC</option><option value="Georgia, serif">Georgia</option><option value="'Playfair Display', serif">Playfair Display</option><option value="system-ui">System UI</option></select></div>
                    <div><label>标题字重</label><select class="font-weight" id="headingWeight"><option value="400">Regular</option><option value="600">Semi Bold</option><option value="700" selected>Bold</option><option value="900">Black</option></select></div>
                </div>
                <div class="form-group grid-2">
                    <div><label>正文字体</label><select class="font-family" id="bodyFont"><option value="Inter, sans-serif" selected>Inter</option><option value="'Noto Sans SC', sans-serif">Noto Sans SC</option><option value="Georgia, serif">Georgia</option><option value="system-ui">System UI</option></select></div>
                    <div><label>正文字重</label><select class="font-weight" id="bodyWeight"><option value="300">Light</option><option value="400" selected>Regular</option><option value="500">Medium</option></select></div>
                </div>
            </div>
            <div id="fontPreviewArea"></div>
        </div>

        <div class="card">
            <h3>品牌语调</h3>
            <div id="toneContainer">
                <div class="tone-item"><input type="text" class="tone-input" value="专业 - 用准确的术语表达专业性" style="width:100%;"></div>
                <div class="tone-item"><input type="text" class="tone-input" value="亲和 - 使用通俗易懂的语言" style="width:100%;"></div>
            </div>
            <button class="btn-sm" onclick="addTone()" style="margin-top:8px;">+ 添加语调特征</button>
        </div>

        <div class="card">
            <h3>使用规范</h3>
            <div class="do-dont-grid">
                <div class="do-box"><h4 style="color:var(--success-color);">✅ 应该</h4><div class="form-group"><textarea id="doList" rows="4" placeholder="正确使用方式...">保持品牌色一致性&#10;使用规定字体&#10;保持充足的留白&#10;使用高清图片</textarea></div></div>
                <div class="dont-box"><h4 style="color:var(--danger-color);">❌ 不应该</h4><div class="form-group"><textarea id="dontList" rows="4" placeholder="错误使用方式...">随意更改品牌色&#10;拉伸或扭曲Logo&#10;使用低质量图片&#10;文字叠加在复杂背景上</textarea></div></div>
            </div>
        </div>

        <button onclick="generateGuide()" style="width:100%;margin-bottom:16px;">生成品牌指南文档</button>
        <button class="btn-success" onclick="exportGuide()" style="width:100%;margin-bottom:16px;">导出Markdown</button>

        <div class="card" id="previewCard" style="display:none;">
            <h3>品牌指南预览</h3>
            <div class="preview-section" id="guidePreview"></div>
        </div>

        <div class="card" id="outputCard" style="display:none;">
            <h3>生成的Markdown文档</h3>
            <pre class="output" id="markdownOutput"></pre>
            <button class="btn-success" onclick="copyMarkdown()" style="margin-top:10px;">复制Markdown</button>
        </div>
    </div>

    <script src="i18n.js" defer></script>
    <script>
        function toggleTheme() { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; }

        function updateSwatches() {
            const p = document.getElementById('primaryColor').value;
            const s = document.getElementById('secondaryColor').value;
            const a = document.getElementById('accentColor').value;
            document.getElementById('primaryHex').textContent = p;
            document.getElementById('secondaryHex').textContent = s;
            document.getElementById('accentHex').textContent = a;
            document.getElementById('colorSwatches').innerHTML = `
                <div class="color-swatch" style="background:${p};"><span class="color-label">主色</span></div>
                <div class="color-swatch" style="background:${s};"><span class="color-label">辅色</span></div>
                <div class="color-swatch" style="background:${a};"><span class="color-label">强调色</span></div>
                <div class="color-swatch" style="background:${document.getElementById('bgColor').value};border-color:#ccc;"><span class="color-label">背景</span></div>
                <div class="color-swatch" style="background:${document.getElementById('textColor').value};"><span class="color-label">文字</span></div>
            `;
            updateFontPreview();
        }

        function updateFontPreview() {
            const hFont = document.getElementById('headingFont').value;
            const hWeight = document.getElementById('headingWeight').value;
            const bFont = document.getElementById('bodyFont').value;
            const bWeight = document.getElementById('bodyWeight').value;
            document.getElementById('fontPreviewArea').innerHTML = `
                <div class="font-preview"><h4>标题字体预览</h4><div class="sample" style="font-family:${hFont};font-weight:${hWeight};">品牌标题示例 ABC</div><div class="detail">${hFont} | Weight: ${hWeight}</div></div>
                <div class="font-preview"><h4>正文字体预览</h4><div class="sample" style="font-family:${bFont};font-weight:${bWeight};">这是品牌正文字体的展示效果。品牌指南是确保品牌一致性的重要文档。</div><div class="detail">${bFont} | Weight: ${bWeight}</div></div>
            `;
        }

        function addTone() {
            const div = document.createElement('div');
            div.className = 'tone-item';
            div.innerHTML = '<input type="text" class="tone-input" placeholder="新的语调特征..." style="width:100%;">';
            document.getElementById('toneContainer').appendChild(div);
        }

        function generateGuide() {
            const name = document.getElementById('brandName').value.trim() || '我的品牌';
            const slogan = document.getElementById('brandSlogan').value.trim();
            const desc = document.getElementById('brandDesc').value.trim();
            const personality = document.getElementById('brandPersonality').value.trim();
            const pColor = document.getElementById('primaryColor').value;
            const sColor = document.getElementById('secondaryColor').value;
            const aColor = document.getElementById('accentColor').value;
            const hFont = document.getElementById('headingFont').value;
            const bFont = document.getElementById('bodyFont').value;
            const tones = Array.from(document.querySelectorAll('.tone-input')).map(t => t.value.trim()).filter(Boolean);
            const dos = document.getElementById('doList').value.split('\n').filter(Boolean);
            const donts = document.getElementById('dontList').value.split('\n').filter(Boolean);

            document.getElementById('guidePreview').innerHTML = `
                <div style="text-align:center;padding:30px;background:${pColor};color:white;border-radius:8px;margin-bottom:20px;">
                    <h2 style="margin:0;font-size:28px;">${name}</h2>
                    ${slogan ? `<p style="margin:8px 0 0;font-size:16px;opacity:0.9;">${slogan}</p>` : ''}
                </div>
                ${desc ? `<p style="margin-bottom:16px;line-height:1.6;">${desc}</p>` : ''}
                <h3 style="color:${pColor};">品牌色彩</h3>
                <div style="display:flex;gap:12px;margin:12px 0;"><div style="width:80px;height:80px;background:${pColor};border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;">主色</div><div style="width:80px;height:80px;background:${sColor};border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;">辅色</div><div style="width:80px;height:80px;background:${aColor};border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;">强调色</div></div>
                <h3 style="color:${pColor};">字体</h3>
                <p style="font-family:${hFont};font-size:20px;margin:4px 0;">标题: ${hFont}</p>
                <p style="font-family:${bFont};margin:4px 0;">正文: ${bFont}</p>
                ${personality ? `<h3 style="color:${pColor};">品牌个性</h3><p>${personality}</p>` : ''}
                ${tones.length ? `<h3 style="color:${pColor};">品牌语调</h3><ul>${tones.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}
            `;

            let md = `# ${name} 品牌指南\n\n`;
            if (slogan) md += `> ${slogan}\n\n`;
            if (desc) md += `## 品牌描述\n${desc}\n\n`;
            if (personality) md += `## 品牌个性\n${personality}\n\n`;
            md += `## 品牌色彩\n| 用途 | 色值 |\n|------|------|\n| 主色 | ${pColor} |\n| 辅色 | ${sColor} |\n| 强调色 | ${aColor} |\n| 背景色 | ${document.getElementById('bgColor').value} |\n| 文字色 | ${document.getElementById('textColor').value} |\n\n`;
            md += `## 字体规范\n- 标题字体: ${hFont} (Weight: ${document.getElementById('headingWeight').value})\n- 正文字体: ${bFont} (Weight: ${document.getElementById('bodyWeight').value})\n\n`;
            if (tones.length) { md += `## 品牌语调\n`; tones.forEach(t => md += `- ${t}\n`); md += '\n'; }
            if (dos.length) { md += `## 使用规范 - 应该\n`; dos.forEach(d => md += `- ✅ ${d}\n`); md += '\n'; }
            if (donts.length) { md += `## 使用规范 - 不应该\n`; donts.forEach(d => md += `- ❌ ${d}\n`); md += '\n'; }

            document.getElementById('markdownOutput').textContent = md;
            document.getElementById('previewCard').style.display = 'block';
            document.getElementById('outputCard').style.display = 'block';
            updateSwatches();
        }

        function copyMarkdown() { navigator.clipboard.writeText(document.getElementById('markdownOutput').textContent).then(() => alert('Markdown已复制')); }
        function exportGuide() {
            const blob = new Blob([document.getElementById('markdownOutput').textContent || '请先生成指南'], { type: 'text/markdown' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = (document.getElementById('brandName').value.trim() || 'brand') + '-guidelines.md';
            a.click();
        }

        updateSwatches();
    </script>
</body>
</html>
