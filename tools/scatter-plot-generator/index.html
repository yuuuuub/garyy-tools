<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>散点图生成器 - Scatter Plot Generator</title>
<meta name="description" content="在线散点图生成器，支持自定义数据和颜色，快速生成散点图和气泡图">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='6' cy='24' r='3' fill='%23e94560'/><circle cx='14' cy='14' r='3' fill='%230969da'/><circle cx='22' cy='8' r='3' fill='%231a7f37'/><circle cx='28' cy='20' r='3' fill='%23f5a623'/></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--text:#e0e0e0;--text2:#a0a0b0;--accent:#e94560;--accent2:#533483;--border:#2a2a4a;--shadow:0 4px 24px rgba(0,0,0,.4);--radius:10px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--surface:#fff;--surface2:#f0f3f6;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#8250df;--border:#d0d7de}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1{font-size:20px;font-weight:700;color:var(--accent);padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.container{display:flex;height:calc(100vh - 56px)}
.sidebar{width:340px;background:var(--surface);border-right:1px solid var(--border);padding:16px;overflow-y:auto;flex-shrink:0}
.main{flex:1;padding:16px;overflow:auto;display:flex;align-items:center;justify-content:center}
label{display:block;font-size:13px;color:var(--text2);margin:8px 0 4px}
input,textarea,select{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:13px;font-family:monospace}
textarea{resize:vertical;min-height:100px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;width:100%;margin-top:12px;transition:var(--transition)}
.btn:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);margin-top:8px}
.chart-wrap{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;width:680px;height:480px}
canvas{max-width:100%;max-height:100%}
.toggle-theme{position:fixed;top:16px;right:16px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;z-index:200}
</style>
</head>
<body>
<h1>⚬ 散点图生成器 Scatter Plot Generator</h1>
<button class="toggle-theme" onclick="toggleTheme()">🌙 / ☀️</button>
<div class="container">
<div class="sidebar">
<label>图表标题</label>
<input id="title" value="身高 vs 体重" placeholder="输入标题">
<label>X轴名称</label>
<input id="xLabel" value="身高 (cm)">
<label>Y轴名称</label>
<input id="yLabel" value="体重 (kg)">
<label>数据（每行：x,y 或 x,y,size）</label>
<textarea id="data" rows="10">160,55,8
165,60,10
170,65,12
175,70,14
168,58,9
172,68,11
180,75,15
163,52,7
178,72,13
185,80,16</textarea>
<label>点大小模式</label>
<select id="sizeMode"><option value="fixed">固定大小</option><option value="data">按数据</option></select>
<label>点颜色</label>
<select id="dotColor">
<option value="#e94560">红色</option>
<option value="#0969da">蓝色</option>
<option value="#1a7f37">绿色</option>
<option value="#8250df">紫色</option>
<option value="#f5a623">橙色</option>
</select>
<label>点大小</label>
<input id="dotSize" type="range" min="3" max="15" value="6">
<button class="btn" onclick="drawChart()">生成图表</button>
<button class="btn btn-outline" onclick="exportPNG()">导出 PNG</button>
</div>
<div class="main"><div class="chart-wrap"><canvas id="canvas"></canvas></div></div>
</div>
<script>
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'}
function parseData(){return document.getElementById('data').value.trim().split('\n').filter(Boolean).map(l=>{const p=l.split(/[,，]/).map(Number);return{x:p[0]||0,y:p[1]||0,size:p[2]||10}})}
function drawChart(){
const cv=document.getElementById('canvas'),ctx=cv.getContext('2d');
const wrap=cv.parentElement;
cv.width=wrap.clientWidth*2;cv.height=wrap.clientHeight*2;ctx.scale(2,2);
const W=wrap.clientWidth,H=wrap.clientHeight;
const data=parseData();if(!data.length)return;
const color=document.getElementById('dotColor').value;
const sizeMode=document.getElementById('sizeMode').value;
const baseR=+document.getElementById('dotSize').value;
const pad={top:50,right:30,bottom:60,left:65};
const cW=W-pad.left-pad.right,cH=H-pad.top-pad.bottom;
const xs=data.map(d=>d.x),ys=data.map(d=>d.y);
const xMin=Math.min(...xs),xMax=Math.max(...xs);
const yMin=Math.min(...ys),yMax=Math.max(...ys);
const xRange=xMax-xMin||1,yRange=yMax-yMin||1;
const xPad=xRange*0.05,yPad=yRange*0.05;
const xLo=xMin-xPad,xHi=xMax+xPad,yLo=Math.min(0,yMin-yPad),yHi=yMax+yPad;
const xR=xHi-xLo,yR=yHi-yLo;
ctx.clearRect(0,0,W,H);
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--surface').trim()||'#16213e';
ctx.fillRect(0,0,W,H);
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
ctx.font='bold 15px -apple-system,sans-serif';ctx.textAlign='center';
ctx.fillText(document.getElementById('title').value,W/2,28);
for(let i=0;i<=5;i++){
const y=pad.top+cH-cH*(i/5);
ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(W-pad.right,y);ctx.stroke();
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text2').trim();
ctx.font='11px sans-serif';ctx.textAlign='right';
ctx.fillText((yLo+yR*i/5).toFixed(1),pad.left-8,y+4);
const x=pad.left+cW*(i/5);
ctx.beginPath();ctx.moveTo(x,pad.top);ctx.lineTo(x,pad.top+cH);ctx.stroke();
ctx.textAlign='center';ctx.fillText((xLo+xR*i/5).toFixed(1),x,pad.top+cH+18);
}
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text2').trim();
ctx.font='12px sans-serif';
ctx.fillText(document.getElementById('xLabel').value,W/2,H-8);
ctx.save();ctx.translate(14,H/2);ctx.rotate(-Math.PI/2);ctx.fillText(document.getElementById('yLabel').value,0,0);ctx.restore();
const sizes=data.map(d=>d.size);
const sMin=Math.min(...sizes),sMax=Math.max(...sizes),sR=sMax-sMin||1;
data.forEach(d=>{
const px=pad.left+cW*((d.x-xLo)/xR);
const py=pad.top+cH*(1-(d.y-yLo)/yR);
const r=sizeMode==='data'?baseR*(0.5+1.5*((d.size-sMin)/sR)):baseR;
ctx.globalAlpha=0.75;
ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
ctx.globalAlpha=1;
ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--surface').trim();
ctx.lineWidth=1.5;ctx.stroke();
});
}
function exportPNG(){const cv=document.getElementById('canvas');const a=document.createElement('a');a.download='scatter-plot.png';a.href=cv.toDataURL('image/png');a.click()}
drawChart();window.addEventListener('resize',drawChart);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
