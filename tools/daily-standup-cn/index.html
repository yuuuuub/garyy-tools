<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 每日站会</title>
<meta name="description" content="每日站会记录工具，快速记录昨天、今天和阻塞问题">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:800px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.member-select{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.member-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:.85rem;transition:all .2s}
.member-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.section-block{margin-bottom:16px}
.section-block h3{font-size:.9rem;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.section-block textarea{width:100%;min-height:60px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;font-family:inherit;resize:vertical}
.section-block textarea:focus{outline:none;border-color:var(--accent)}
.blocker-tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.75rem;font-weight:600;margin-right:4px;margin-bottom:4px}
.blocker-tag.high{background:rgba(248,81,73,.15);color:var(--red)}
.blocker-tag.mid{background:rgba(210,153,34,.15);color:var(--yellow)}
.blocker-tag.low{background:rgba(63,185,80,.15);color:var(--green)}
.history-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.history-item .date{font-size:.8rem;color:var(--text2);margin-bottom:6px}
.history-item .member-name{font-weight:600;font-size:.9rem;color:var(--accent);margin-bottom:6px}
.history-item .section{margin-bottom:6px}
.history-item .section .lbl{font-size:.75rem;color:var(--text2);font-weight:600}
.history-item .section .val{font-size:.85rem}
.timer-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.timer-bar .time{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.timer-bar .limit{font-size:.85rem;color:var(--text2)}
.hidden{display:none}
@media(max-width:600px){body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📋 每日站会">
<meta property="og:description" content="每日站会记录工具，快速记录昨天、今天和阻塞问题">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='daily_standup';
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{
  members:['张三','李四','王五'],
  entries:{},
  timerLimit:15*60,timerRunning:false,timerEnd:0
};
let selectedMember='';
let timerInterval=null;
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function today(){return new Date().toISOString().slice(0,10)}
function getEntry(){if(!selectedMember)return null;const key=today()+'_'+selectedMember;if(!state.entries[key])state.entries[key]={yesterday:'',today:'',blockers:[],blockerText:''};return state.entries[key]}
function addMember(){const name=prompt('输入成员姓名:');if(name&&name.trim()){state.members.push(name.trim());save();render()}}
function removeMember(i){if(confirm('确定移除'+state.members[i]+'?')){state.members.splice(i,1);save();render()}}
function addBlocker(e){if(!e.blockerText||!e.blockerText.trim())return;e.blockers.push(e.blockerText.trim());e.blockerText='';save();render()}
function removeBlocker(e,i){e.blockers.splice(i,1);save();render()}
function toggleTimer(){if(state.timerRunning){clearInterval(timerInterval);state.timerRunning=false}else{state.timerRunning=true;state.timerEnd=Date.now()+state.timerLimit*1000}save();render()}
function resetTimer(){clearInterval(timerInterval);state.timerRunning=false;state.timerEnd=0;save();render()}
function tickTimer(){if(!state.timerRunning)return;const rem=Math.max(0,Math.round((state.timerEnd-Date.now())/1000));$('timerDisplay').textContent=formatTime(rem);if(rem<=0){clearInterval(timerInterval);state.timerRunning=false;save();try{new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH+JkI+Gd2BaaXN/g4ODe21lZm10gIaLjYl8cWdmbXR+').play().catch(()=>{})}catch(e){}}}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function exportData(){const entries=Object.entries(state.entries);let txt='每日站会记录\n'+'='.repeat(40)+'\n\n';entries.forEach(([k,v])=>{const[dt,name]=k.split('_');txt+=`${dt} - ${name}\n`;txt+=`  昨天: ${v.yesterday}\n  今天: ${v.today}\n  阻塞: ${v.blockers.length?v.blockers.join(', '):'无'}\n\n`});const blob=new Blob([txt],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='站会记录_'+today()+'.txt';a.click()}
function render(){
  let h=`<div class="hdr"><h1>📋 每日站会</h1><p>快速记录昨天做了什么、今天要做什么</p></div>`;
  h+=`<div class="cd"><div class="timer-bar"><div class="time" id="timerDisplay">${formatTime(state.timerRunning?Math.max(0,Math.round((state.timerEnd-Date.now())/1000)):state.timerLimit)}</div><div class="limit">站会计时 (${state.timerLimit/60}分钟)</div>`;
  h+=`<div class="bg" style="margin-left:auto;margin-top:0">${state.timerRunning?'<button style="padding:6px 14px" onclick="toggleTimer()">⏸</button>':'<button style="padding:6px 14px" onclick="toggleTimer()">▶</button>'}<button class="sec" style="padding:6px 14px" onclick="resetTimer()">↺</button></div></div></div>`;
  if(state.timerRunning)tickTimer();
  h+=`<div class="cd"><h2>👥 选择成员 <button class="sec" style="font-size:.75rem;padding:3px 10px;margin-left:6px" onclick="addMember()">+ 添加</button></h2>`;
  h+=`<div class="member-select">`;
  state.members.forEach((m,i)=>{h+=`<div class="member-btn${selectedMember===m?' active':''}" onclick="selectedMember='${m}';render()">${m} <span style="font-size:.7rem;opacity:.6" onclick="event.stopPropagation();removeMember(${i})">✕</span></div>`});
  h+=`</div></div>`;
  if(selectedMember){
    const e=getEntry();
    h+=`<div class="cd"><h2>📝 ${selectedMember} - ${today()}</h2>`;
    h+=`<div class="section-block"><h3>🟢 昨天完成了什么</h3><textarea oninput="getEntry().yesterday=this.value;save()" placeholder="描述昨天完成的工作...">${e.yesterday}</textarea></div>`;
    h+=`<div class="section-block"><h3>🔵 今天要做什么</h3><textarea oninput="getEntry().today=this.value;save()" placeholder="描述今天计划的工作...">${e.today}</textarea></div>`;
    h+=`<div class="section-block"><h3>🔴 有什么阻塞</h3>`;
    e.blockers.forEach((b,i)=>{h+=`<span class="blocker-tag high">${b} <span style="cursor:pointer;margin-left:4px" onclick="removeBlocker(getEntry(),${i})">✕</span></span>`});
    h+=`<div style="display:flex;gap:6px;margin-top:6px"><input type="text" placeholder="描述阻塞问题..." id="blockerInput" onkeydown="if(event.key==='Enter'){getEntry().blockerText=this.value;addBlocker(getEntry());this.value=''}" style="flex:1;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem">`;
    h+=`<button style="padding:6px 12px;font-size:.85rem" onclick="const inp=$('blockerInput');getEntry().blockerText=inp.value;addBlocker(getEntry());inp.value=''">添加</button></div></div></div>`;
  }
  h+=`<div class="cd"><h2>📄 历史记录 <button class="sec" style="font-size:.75rem;padding:3px 10px;margin-left:6px" onclick="exportData()">导出</button></h2>`;
  const entries=Object.entries(state.entries).sort((a,b)=>b[0].localeCompare(a[0]));
  if(entries.length===0)h+=`<p style="color:var(--text2);font-size:.9rem">暂无记录</p>`;
  entries.slice(0,30).forEach(([k,v])=>{const[dt,name]=k.split('_');
    h+=`<div class="history-item"><div class="date">${dt}</div><div class="member-name">${name}</div>`;
    if(v.yesterday)h+=`<div class="section"><span class="lbl">昨天:</span> <span class="val">${v.yesterday}</span></div>`;
    if(v.today)h+=`<div class="section"><span class="lbl">今天:</span> <span class="val">${v.today}</span></div>`;
    if(v.blockers.length)h+=`<div class="section"><span class="lbl">阻塞:</span> ${v.blockers.map(b=>'<span class="blocker-tag high">'+b+'</span>').join(' ')}</div>`;
    h+=`</div>`});
  h+=`</div>`;
  $('app').innerHTML=h;
}
render();
</script>
</body>
</html>
