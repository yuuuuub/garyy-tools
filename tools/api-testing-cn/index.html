<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 测试工具 | API Tester</title>
<meta name="description" content="在线API测试工具，支持GET/POST/PUT/DELETE等请求方法，快速调试API接口">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔌</text></svg>">
<script src="../i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;padding:16px}
.container{max-width:1200px;margin:0 auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{text-align:center;color:var(--text-secondary);font-size:.85rem;margin-bottom:20px}
.card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.url-bar{display:flex;gap:0;margin-bottom:12px}
.method-select{padding:8px 12px;border:1px solid var(--border);border-right:none;border-radius:var(--radius-sm) 0 0 var(--radius-sm);background:var(--bg-tertiary);color:var(--text);font-weight:600;font-size:.85rem;cursor:pointer;min-width:90px}
.url-input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:0 var(--radius-sm) var(--radius-sm) 0;background:var(--bg);color:var(--text);font-size:.85rem;font-family:monospace;outline:none}
.url-input:focus{border-color:var(--accent)}
.send-btn{padding:8px 20px;border:1px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;background:var(--accent);color:#fff;font-weight:600;font-size:.85rem;cursor:pointer;transition:var(--transition);margin-left:-1px}
.send-btn:hover{background:var(--accent-hover)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:12px;gap:0}
.tab{padding:8px 16px;font-size:.8rem;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;transition:var(--transition)}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}
textarea{width:100%;min-height:150px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-family:monospace;font-size:.82rem;resize:vertical;outline:none;line-height:1.6}
textarea:focus{border-color:var(--accent)}
.kv-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.kv-row input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.8rem;outline:none}
.kv-row input:focus{border-color:var(--accent)}
.kv-row .remove-btn{padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--red);cursor:pointer;font-size:.8rem}
.add-row-btn{padding:6px 12px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text-secondary);cursor:pointer;font-size:.8rem;width:100%;margin-top:4px}
.add-row-btn:hover{border-color:var(--accent);color:var(--accent)}
.response-status{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.status-badge{padding:4px 12px;border-radius:var(--radius-sm);font-weight:600;font-size:.8rem}
.status-2xx{background:var(--green-bg);color:var(--green)}
.status-3xx{background:rgba(210,153,29,.15);color:var(--orange)}
.status-4xx,.status-5xx{background:var(--red-bg);color:var(--red)}
.response-time{font-size:.8rem;color:var(--text-secondary)}
.response-body{padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:monospace;font-size:.8rem;line-height:1.6;overflow:auto;min-height:200px;white-space:pre-wrap;word-break:break-all}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:4px 10px;font-size:.75rem}
.empty-state{text-align:center;padding:40px;color:var(--text-secondary);font-size:.85rem}
.history-item{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:8px;align-items:center;font-size:.8rem;transition:var(--transition)}
.history-item:hover{background:var(--bg-tertiary)}
.history-method{font-weight:600;font-size:.75rem;padding:2px 6px;border-radius:3px;min-width:50px;text-align:center}
.method-GET{background:var(--green-bg);color:var(--green)}
.method-POST{background:rgba(57,210,192,.15);color:var(--cyan)}
.method-PUT{background:rgba(210,153,29,.15);color:var(--orange)}
.method-DELETE{background:var(--red-bg);color:var(--red)}
.method-PATCH{background:rgba(188,140,255,.15);color:var(--purple)}
.history-url{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-secondary)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:700px){.url-bar{flex-direction:column}.method-select{border-radius:var(--radius-sm);border-right:1px solid var(--border)}.url-input{border-radius:var(--radius-sm)}.send-btn{border-radius:var(--radius-sm);margin-left:0}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--bg-secondary);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🔌 API 测试工具</h1>
<p class="sub">支持 GET / POST / PUT / DELETE / PATCH 请求方法</p>

<div class="card">
<div class="url-bar">
<select class="method-select" id="method">
<option value="GET">GET</option>
<option value="POST">POST</option>
<option value="PUT">PUT</option>
<option value="DELETE">DELETE</option>
<option value="PATCH">PATCH</option>
</select>
<input class="url-input" id="url" placeholder="输入请求 URL，如 https://jsonplaceholder.typicode.com/posts" value="https://jsonplaceholder.typicode.com/posts/1">
<button class="send-btn" id="sendBtn" onclick="sendRequest()">发送</button>
</div>

<div class="tabs">
<div class="tab active" onclick="switchTab('headers')">请求头</div>
<div class="tab" onclick="switchTab('params')">参数</div>
<div class="tab" onclick="switchTab('body')">请求体</div>
</div>

<div id="tab-headers" class="tab-content active">
<div id="headersList"></div>
<button class="add-row-btn" onclick="addHeader()">+ 添加请求头</button>
</div>
<div id="tab-params" class="tab-content">
<div id="paramsList"></div>
<button class="add-row-btn" onclick="addParam()">+ 添加参数</button>
</div>
<div id="tab-body" class="tab-content">
<textarea id="bodyInput" placeholder='请求体 JSON，例如：
{
  "title": "测试标题",
  "body": "测试内容",
  "userId": 1
}'></textarea>
</div>
</div>

<div class="card" id="responseCard" style="display:none">
<div class="response-status">
<span class="status-badge" id="statusBadge"></span>
<span class="response-time" id="responseTime"></span>
<button class="btn btn-sm" onclick="copyResponse()">复制</button>
</div>
<div class="tabs">
<div class="tab active" onclick="switchRespTab('body')">响应体</div>
<div class="tab" onclick="switchRespTab('headers')">响应头</div>
</div>
<div id="resp-body" class="tab-content active">
<div class="response-body" id="responseBody"></div>
</div>
<div id="resp-headers" class="tab-content">
<div class="response-body" id="responseHeaders"></div>
</div>
</div>

<div class="card">
<h3 style="font-size:.85rem;color:var(--text-secondary);margin-bottom:8px">历史记录</h3>
<div id="historyList"><div class="empty-state">暂无请求历史</div></div>
</div>
</div>

<script>
var history=[];
function addHeader(){addKVRow('headersList','key','value','Header名','值')}
function addParam(){addKVRow('paramsList','key','value','参数名','参数值')}
function addKVRow(containerId,kPH,vPH,kName,vName){
var c=document.getElementById(containerId);
var d=document.createElement('div');d.className='kv-row';
d.innerHTML='<input placeholder="'+kPH+'" data-name="'+kName+'"><input placeholder="'+vPH+'" data-name="'+vName+'"><button class="remove-btn" onclick="this.parentElement.remove()">✕</button>';
c.appendChild(d);
}
addHeader();
function getKVs(containerId){
var rows=document.getElementById(containerId).querySelectorAll('.kv-row');
var obj={};
rows.forEach(function(r){
var inputs=r.querySelectorAll('input');
var k=inputs[0].value.trim(),v=inputs[1].value.trim();
if(k)obj[k]=v;
});
return obj;
}
function switchTab(name){
document.querySelectorAll('.tabs .tab').forEach(function(t,i){
if(i<3)t.classList.toggle('active',t.textContent.includes({headers:'请求头',params:'参数',body:'请求体'}[name]));
});
document.querySelectorAll('.tab-content').forEach(function(c,i){c.classList.remove('active')});
document.getElementById('tab-'+name).classList.add('active');
}
function switchRespTab(name){
var tabs=document.querySelectorAll('#responseCard .tabs .tab');
tabs.forEach(function(t){t.classList.remove('active')});
if(name==='body')tabs[0].classList.add('active');else tabs[1].classList.add('active');
document.getElementById('resp-body').classList.toggle('active',name==='body');
document.getElementById('resp-headers').classList.toggle('active',name==='headers');
}
function sendRequest(){
var method=document.getElementById('method').value;
var url=document.getElementById('url').value.trim();
if(!url){alert('请输入URL');return;}
var headers=getKVs('headersList');
var params=getKVs('paramsList');
var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');
if(qs)url+=(url.indexOf('?')>-1?'&':'?')+qs;
var opts={method:method,headers:headers};
if(method!=='GET'&&method!=='DELETE'){
var body=document.getElementById('bodyInput').value.trim();
if(body){opts.body=body;if(!headers['Content-Type'])opts.headers['Content-Type']='application/json';}
}
document.getElementById('sendBtn').disabled=true;
document.getElementById('sendBtn').textContent='发送中...';
var t0=performance.now();
fetch(url,opts).then(function(r){
var status=r.status;
var time=Math.round(performance.now()-t0);
var hds={};r.headers.forEach(function(v,k){hds[k]=v});
return r.text().then(function(body){
document.getElementById('responseCard').style.display='block';
var badge=document.getElementById('statusBadge');
badge.textContent=status+' '+r.statusText;
badge.className='status-badge '+(status<300?'status-2xx':status<400?'status-3xx':status<500?'status-4xx':'status-5xx');
document.getElementById('responseTime').textContent=time+'ms';
try{document.getElementById('responseBody').textContent=JSON.stringify(JSON.parse(body),null,2)}catch(e){document.getElementById('responseBody').textContent=body}
var hStr=Object.keys(hds).map(function(k){return k+': '+hds[k]}).join('\n');
document.getElementById('responseHeaders').textContent=hStr;
history.unshift({method:method,url:url.split('?')[0],status:status,time:time});
renderHistory();
document.getElementById('sendBtn').disabled=false;
document.getElementById('sendBtn').textContent='发送';
});
}).catch(function(e){
document.getElementById('responseCard').style.display='block';
document.getElementById('responseBody').textContent='请求失败: '+e.message;
document.getElementById('statusBadge').textContent='Error';
document.getElementById('statusBadge').className='status-badge status-5xx';
document.getElementById('sendBtn').disabled=false;
document.getElementById('sendBtn').textContent='发送';
});
}
function renderHistory(){
var c=document.getElementById('historyList');
if(!history.length){c.innerHTML='<div class="empty-state">暂无请求历史</div>';return;}
c.innerHTML=history.slice(0,20).map(function(h,i){
return '<div class="history-item" onclick="loadHistory('+i+')"><span class="history-method method-'+h.method+'">'+h.method+'</span><span class="history-url">'+h.url+'</span><span style="color:var(--green);font-weight:600;font-size:.8rem">'+h.status+'</span></div>';
}).join('');
}
function loadHistory(i){
var h=history[i];
document.getElementById('method').value=h.method;
document.getElementById('url').value=h.url;
}
function copyResponse(){
var t=document.getElementById('responseBody').textContent;
navigator.clipboard.writeText(t).then(function(){alert('已复制')});
}
addHeader();
</script>
</body>
</html>
