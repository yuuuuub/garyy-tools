<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wordle 猜单词</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
h1{font-size:1.5rem;margin-bottom:15px;color:#3b82f6}
.board{display:flex;flex-direction:column;gap:5px;margin-bottom:20px}
.row{display:flex;gap:5px}
.cell{width:52px;height:52px;border:2px solid #30363d;background:#161b22;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold;border-radius:4px;transition:all .3s}
.cell.correct{background:#22c55e;border-color:#22c55e;color:#fff}
.cell.present{background:#eab308;border-color:#eab308;color:#fff}
.cell.absent{background:#30363d;border-color:#30363d;color:#8b949e}
.cell.pop{animation:pop .2s}
@keyframes pop{50%{transform:scale(1.15)}}
.keyboard{display:flex;flex-direction:column;gap:5px;max-width:500px}
.kb-row{display:flex;gap:5px;justify-content:center}
.key{min-width:32px;height:46px;background:#30363d;border:none;border-radius:4px;color:#e6edf3;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:1;max-width:42px}
.key.correct{background:#22c55e}.key.present{background:#eab308}.key.absent{background:#1e293b;color:#64748b}
.status{margin-top:12px;font-size:1rem;min-height:1.5em}
button{padding:8px 20px;border:none;background:#3b82f6;color:#fff;border-radius:6px;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<h1>🔤 Wordle</h1>
<div class="board" id="board"></div>
<div class="keyboard" id="kb"></div>
<div class="status" id="status"></div>
<button onclick="newGame()">新游戏</button>
<script>
const words=['apple','grape','melon','peach','lemon','mango','berry','olive','melon','peach','plum','kiwi','fig','lime'];
let answer,currentRow=0,currentCol=0,board=Array(6).fill('').map(()=>Array(5).fill('')),gameOver=false;
const maxRows=6;

function newGame(){
  answer=words[Math.floor(Math.random()*words.length)].toUpperCase();
  currentRow=0;currentCol=0;board=Array(6).fill('').map(()=>Array(5).fill(''));
  gameOver=false;document.getElementById('status').textContent=`猜一个5字母单词 (${answer.length}个字母)`;
  render();initKB();
}

function render(){
  const el=document.getElementById('board');el.innerHTML='';
  for(let r=0;r<maxRows;r++){const row=document.createElement('div');row.className='row';
    for(let c=0;c<5;c++){const cell=document.createElement('div');cell.className='cell';
      cell.textContent=board[r][c];row.appendChild(cell);}
    el.appendChild(row);}
}

function initKB(){
  const el=document.getElementById('kb');el.innerHTML='';
  const rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  rows.forEach(r=>{const row=document.createElement('div');row.className='kb-row';
    r.split('').forEach(c=>{const k=document.createElement('button');k.className='key';k.textContent=c;
      k.onclick=()=>typeLetter(c);row.appendChild(k);});
    el.appendChild(row);});
  // backspace & enter
  const bRow=document.createElement('div');bRow.className='kb-row';
  const bs=document.createElement('button');bs.className='key';bs.textContent='⌫';bs.style.flex='1.5';bs.onclick=()=>backspace();bRow.appendChild(bs);
  const en=document.createElement('button');en.className='key';en.textContent='↵';en.style.flex='2';en.onclick=()=>enter();bRow.appendChild(en);
  el.appendChild(bRow);
}

function typeLetter(c){
  if(gameOver||currentCol>=5)return;
  board[currentRow][currentCol]=c;currentCol++;render();
}

function backspace(){
  if(gameOver||currentCol<=0)return;
  currentCol--;board[currentRow][currentCol]='';render();
}

function enter(){
  if(gameOver||currentCol<5)return;
  const guess=board[currentRow].join('');
  const answerArr=answer.split('');
  const result=Array(5).fill('absent');
  const used=Array(5).fill(false);

  // correct pass
  for(let i=0;i<5;i++){if(guess[i]===answerArr[i]){result[i]='correct';used[i]=true}}
  // present pass
  for(let i=0;i<5;i++){if(result[i]==='correct')continue;
    for(let j=0;j<5;j++){if(!used[j]&&guess[i]===answerArr[j]){result[i]='present';used[j]=true;break}}}

  // apply colors
  const cells=document.getElementById('board').children[currentRow].children;
  for(let i=0;i<5;i++){
    cells[i].classList.add(result[i]);
    // update keyboard
    const k=[...document.querySelectorAll('.key')].find(k=>k.textContent===guess[i]);
    if(k){if(result[i]==='correct')k.className='key correct';else if(result[i]==='present'&&k.className!=='key correct')k.className='key present';else if(k.className==='key')k.className='key absent'}
  }

  if(guess===answer){gameOver=true;document.getElementById('status').textContent='🎉 恭喜猜对！';return}
  currentRow++;currentCol=0;
  if(currentRow>=maxRows){gameOver=true;document.getElementById('status').textContent=`答案是: ${answer}`}
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter')enter();
  else if(e.key==='Backspace')backspace();
  else if(/^[a-zA-Z]$/.test(e.key))typeLetter(e.key.toUpperCase());
});

newGame();
</script>
</body>
</html>
