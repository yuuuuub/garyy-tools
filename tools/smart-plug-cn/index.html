<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔌 智能插座控制</title>
<meta name="description" content="智能插座远程控制与用电统计，支持定时开关与功率监控">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.plug-status{text-align:center;padding:30px;border-radius:var(--radius);background:var(--bg);margin-bottom:16px}
.plug-icon{font-size:4rem;margin-bottom:12px}
.plug-text{font-size:1.2rem;font-weight:600}
.plug-btn{margin-top:20px;padding:12px 24px;border-radius:8px;border:none;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
.plug-btn.on{background:var(--success);color:#fff}
.plug-btn.off{background:var(--danger);color:#fff}
.power-display{text-align:center;margin:20px 0}
.power-value{font-size:3rem;font-weight:700;color:var(--accent)}
.power-unit{font-size:1rem;color:var(--text2)}
.power-bar{height:12px;background:var(--border);border-radius:6px;overflow:hidden;margin:12px 0}
.power-fill{height:100%;background:linear-gradient(90deg,var(--success),var(--warn),var(--danger));transition:width .5s}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.stat-label{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.stat-value{font-size:1.5rem;font-weight:700;color:var(--accent)}
.timer-list{display:flex;flex-direction:column;gap:8px}
.timer-item{padding:12px;background:var(--bg);border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.timer-info{display:flex;align-items:center;gap:12px}
.timer-icon{font-size:1.5rem}
.timer-time{font-weight:600}
.timer-action{font-size:.85rem;color:var(--text2)}
.schedule-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.schedule-day{padding:8px;text-align:center;border-radius:4px;background:var(--bg);cursor:pointer;font-size:.8rem}
.schedule-day.active{background:var(--accent);color:#fff}
.schedule-time{display:flex;gap:8px;align-items:center}
.schedule-time input{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.settings-group{margin-bottom:16px}
.settings-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px}
.settings-group input[type=text],.settings-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
.toggle-group{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.toggle-group:last-child{border-bottom:none}
.toggle{width:50px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background .2s;cursor:pointer}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s}
.toggle.on::after{transform:translateX(24px)}
button{padding:8px 16px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔌</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔌 智能插座控制">
<meta property="og:description" content="智能插座远程控制与用电统计，支持定时开关与功率监控">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🔌 智能插座控制</h1><p>远程控制插座开关，监控用电情况</p></div>

<div class="cd">
<div class="plug-status" id="plugStatus">
<div class="plug-icon" id="plugIcon">🔌</div>
<div class="plug-text" id="plugText">插座已关闭</div>
<button class="plug-btn off" id="plugBtn" onclick="togglePlug()">开启</button>
</div>
</div>

<div class="cd">
<h2>实时功率</h2>
<div class="power-display">
<div class="power-value" id="powerValue">0.0</div>
<div class="power-unit">瓦特 (W)</div>
</div>
<div class="power-bar"><div class="power-fill" id="powerFill" style="width:0%"></div></div>
<div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2)"><span>0W</span><span>最大: 2500W</span></div>
</div>

<div class="cd">
<h2>用电统计</h2>
<div class="stats-grid">
<div class="stat-card">
<div class="stat-label">今日用电</div>
<div class="stat-value" id="todayUsage">0.00</div>
<div style="font-size:.8rem;color:var(--text2)">千瓦时</div>
</div>
<div class="stat-card">
<div class="stat-label">本月用电</div>
<div class="stat-value" id="monthUsage">0.00</div>
<div style="font-size:.8rem;color:var(--text2)">千瓦时</div>
</div>
<div class="stat-card">
<div class="stat-label">今日费用</div>
<div class="stat-value" id="todayCost">¥0.00</div>
</div>
<div class="stat-card">
<div class="stat-label">本月费用</div>
<div class="stat-value" id="monthCost">¥0.00</div>
</div>
</div>
</div>

<div class="cd">
<h2>定时任务</h2>
<div class="timer-list" id="timerList"></div>
<div style="margin-top:12px">
<button onclick="addTimer()">+ 添加定时</button>
</div>
</div>

<div class="cd">
<h2>周期计划</h2>
<div class="schedule-grid" id="scheduleDays"></div>
<div class="schedule-time">
<input type="time" id="scheduleOn" value="08:00">
<span>开启</span>
<input type="time" id="scheduleOff" value="22:00">
<span>关闭</span>
<button onclick="saveSchedule()">保存</button>
</div>
</div>

<div class="cd">
<h2>插座设置</h2>
<div class="settings-group">
<label>插座名称</label>
<input type="text" id="plugName" value="客厅插座" onchange="saveSettings()">
</div>
<div class="settings-group">
<label>电价 (元/千瓦时)</label>
<input type="text" id="electricPrice" value="0.56" onchange="saveSettings()">
</div>
<div class="toggle-group">
<span>过载保护</span>
<div class="toggle on" id="overloadToggle" onclick="toggleSetting('overload')"></div>
</div>
<div class="toggle-group">
<span>童锁功能</span>
<div class="toggle" id="childLockToggle" onclick="toggleSetting('childLock')"></div>
</div>
<div class="toggle-group">
<span>用电提醒</span>
<div class="toggle on" id="alertToggle" onclick="toggleSetting('alert')"></div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let isOn=JSON.parse(localStorage.getItem('sp_on')||'false');
let power=0;
let timers=JSON.parse(localStorage.getItem('sp_timers')||'[]');
let schedule=JSON.parse(localStorage.getItem('sp_schedule')||'{"days":[1,2,3,4,5],"on":"08:00","off":"22:00"}');
let settings=JSON.parse(localStorage.getItem('sp_settings')||'{"name":"客厅插座","price":"0.56","overload":true,"childLock":false,"alert":true}');
let usage=JSON.parse(localStorage.getItem('sp_usage')||'{"today":0,"month":0}');

function save(){localStorage.setItem('sp_on',JSON.stringify(isOn));}
function saveTimers(){localStorage.setItem('sp_timers',JSON.stringify(timers));}
function saveSchedule(){localStorage.setItem('sp_schedule',JSON.stringify(schedule));$('scheduleOn').value=schedule.on;$('scheduleOff').value=schedule.off;}
function saveSettings(){localStorage.setItem('sp_settings',JSON.stringify(settings));}
function saveUsage(){localStorage.setItem('sp_usage',JSON.stringify(usage));}

function updateUI(){
  $('plugIcon').textContent=isOn?'⚡':'🔌';
  $('plugText').textContent=isOn?'插座已开启':'插座已关闭';
  $('plugBtn').textContent=isOn?'关闭':'开启';
  $('plugBtn').className='plug-btn '+(isOn?'on':'off');
  $('plugName').value=settings.name;
  $('electricPrice').value=settings.price;
  ['overload','childLock','alert'].forEach(key=>{
    $(key+'Toggle').className='toggle '+(settings[key]?'on':'');
  });
  $('scheduleOn').value=schedule.on;
  $('scheduleOff').value=schedule.off;
}

function togglePlug(){
  isOn=!isOn;
  save();
  updateUI();
  if(!isOn)power=0;
}

function updatePower(){
  if(!isOn){
    power=0;
  }else{
    const base=150;
    const variation=(Math.random()-0.5)*100;
    power=Math.max(50,base+variation);
  }
  $('powerValue').textContent=power.toFixed(1);
  $('powerFill').style.width=(power/2500*100)+'%';
  
  if(isOn){
    const kwh=power/1000/3600*5;
    usage.today+=kwh;
    usage.month+=kwh;
    saveUsage();
    updateUsage();
  }
}

function updateUsage(){
  $('todayUsage').textContent=usage.today.toFixed(2);
  $('monthUsage').textContent=usage.month.toFixed(2);
  const price=parseFloat(settings.price);
  $('todayCost').textContent='¥'+(usage.today*price).toFixed(2);
  $('monthCost').textContent='¥'+(usage.month*price).toFixed(2);
}

function renderTimers(){
  $('timerList').innerHTML=timers.map((t,i)=>`
    <div class="timer-item">
      <div class="timer-info">
        <div class="timer-icon">${t.action==='on'?'🟢':'🔴'}</div>
        <div>
          <div class="timer-time">${t.time}</div>
          <div class="timer-action">${t.action==='on'?'开启':'关闭'}插座</div>
        </div>
      </div>
      <button onclick="removeTimer(${i})" style="background:var(--danger)">删除</button>
    </div>
  `).join('');
}

function addTimer(){
  const time=prompt('设置时间 (HH:MM):');
  const action=prompt('操作 (on/off):');
  if(time&&action){
    timers.push({time,action});
    saveTimers();
    renderTimers();
  }
}

function removeTimer(index){
  timers.splice(index,1);
  saveTimers();
  renderTimers();
}

function renderScheduleDays(){
  const days=['日','一','二','三','四','五','六'];
  $('scheduleDays').innerHTML=days.map((d,i)=>`
    <div class="schedule-day ${schedule.days.includes(i)?'active':''}" onclick="toggleDay(${i})">${d}</div>
  `).join('');
}

function toggleDay(day){
  const index=schedule.days.indexOf(day);
  if(index===-1){
    schedule.days.push(day);
  }else{
    schedule.days.splice(index,1);
  }
  saveSchedule();
  renderScheduleDays();
}

function toggleSetting(key){
  settings[key]=!settings[key];
  saveSettings();
  updateUI();
}

updateUI();
updateUsage();
renderTimers();
renderScheduleDays();
setInterval(updatePower,2000);
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
