<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🅿️ 智能停车管理</title>
<meta name="description" content="智能停车管理系统，车位查找、预约、导航、缴费一体化服务">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:1100px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.stat-card .icon{font-size:1.8rem;margin-bottom:4px}
.stat-card .val{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.8rem;color:var(--text2)}
.lot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.lot{padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.lot .name{font-weight:600;font-size:.95rem;margin-bottom:6px}
.lot .info{font-size:.8rem;color:var(--text2);margin-bottom:8px}
.lot .spots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.spot{width:24px;height:24px;border-radius:4px;font-size:.7rem;display:flex;align-items:center;justify-content:center;font-weight:600}
.spot.free{background:rgba(34,197,94,.2);color:var(--success);border:1px solid var(--success)}
.spot.occupied{background:rgba(239,68,68,.2);color:var(--danger);border:1px solid var(--danger)}
.spot.reserved{background:rgba(245,158,11,.2);color:var(--warn);border:1px solid var(--warn)}
.lot .bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px}
.lot .fill{height:100%;border-radius:3px}
.lot .btn-row{display:flex;gap:6px;margin-top:10px}
.btn{padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-size:.8rem}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:4px 10px;font-size:.75rem}
.btn-success{background:var(--success)}.btn-danger{background:var(--danger)}.btn-warn{background:var(--warn)}.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}
input[type=text]{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.85rem;margin-bottom:8px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.8rem;transition:all .2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.history-list{max-height:200px;overflow-y:auto}
.history-item{display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--border);font-size:.85rem}
.history-item:last-child{border-bottom:none}
.badge{padding:2px 8px;border-radius:10px;font-size:.75rem}
.badge-success{background:rgba(34,197,94,.15);color:var(--success)}
.badge-warn{background:rgba(245,158,11,.15);color:var(--warn)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🅿️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🅿️ 智能停车管理">
<meta property="og:description" content="智能停车管理系统，车位查找、预约、导航、缴费一体化服务">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🅿️ 智能停车管理</h1><p>车位查找、预约、导航、缴费一体化服务</p></div>

<div class="cd">
<h2>📊 停车数据概览</h2>
<div class="grid" id="stats"></div>
</div>

<div class="cd">
<h2>🔍 搜索附近停车场</h2>
<input type="text" id="searchInput" placeholder="输入停车场名称或地址...">
<div class="tabs" id="filterTabs"></div>
<div class="lot-grid" id="lotGrid"></div>
</div>

<div class="cd">
<h2>📋 我的停车记录</h2>
<div class="history-list" id="historyList"></div>
</div>

<div class="cd">
<h2>💰 费用计算</h2>
<div id="feeCalc"></div>
</div>
</div>

<script src="i18n.js" defer></script>
<script>
(function(){
var lots=[
  {name:'国贸中心停车场',addr:'朝阳区建国门外大街1号',total:500,rate:8,types:['室内','室外','充电桩']},
  {name:'中关村软件园停车场',addr:'海淀区中关村软件园二期',total:300,rate:6,types:['室内','室外']},
  {name:'西单大悦城停车场',addr:'西城区西单北大街131号',total:400,rate:10,types:['室内','充电桩']},
  {name:'望京SOHO停车场',addr:'朝阳区阜通东大街6号',total:350,rate:7,types:['室内','室外','充电桩']},
  {name:'北京南站停车场',addr:'丰台区永外大街车站路12号',total:600,rate:5,types:['室内','室外']},
  {name:'朝阳大悦城停车场',addr:'朝阳区朝阳北路101号',total:450,rate:8,types:['室内','室外']},
  {name:'三里屯太古里停车场',addr:'朝阳区三里屯路19号',total:280,rate:12,types:['室内']},
  {name:'五棵松体育馆停车场',addr:'海淀区复兴路69号',total:800,rate:6,types:['室外']},
  {name:'北京SKP停车场',addr:'朝阳区建国路87号',total:350,rate:10,types:['室内','充电桩']},
  {name:'颐和园停车场',addr:'海淀区新建宫门路19号',total:400,rate:4,types:['室外']}
];
var history=[
  {lot:'国贸中心停车场',plate:'京A·'+Random.int(10000,99999),entry:'08:30',exit:'10:15',fee:14,status:'已缴费'},
  {lot:'中关村软件园停车场',plate:'京A·'+Random.int(10000,99999),entry:'09:00',exit:'11:30',fee:15,status:'已缴费'},
  {lot:'西单大悦城停车场',plate:'京B·'+Random.int(10000,99999),entry:'14:00',exit:null,fee:0,status:'停放中'}
];
var currentFilter='全部';

function genSpots(total){
  var spots=[];
  for(var i=0;i<Math.min(total,20);i++){
    var r=Math.random();
    spots.push(r>.7?'free':r>.2?'occupied':'reserved');
  }
  return spots;
}

function renderStats(){
  var data=[
    {icon:'🅿️',val:Math.round(3000+Math.random()*1000),label:'总车位'},
    {icon:'✅',val:Math.round(800+Math.random()*400),label:'空闲车位'},
    {icon:'🚗',val:Math.round(1800+Math.random()*500),label:'已占用'},
    {icon:'📱',val:Math.round(200+Math.random()*100),label:'已预约'},
    {icon:'💰',val:'¥'+Math.round(5000+Math.random()*3000),label:'今日收入'},
    {icon:'⏱️',val:Math.round(2+Math.random()*3)+'h',label:'平均停放'}
  ];
  var h='';
  data.forEach(function(d){h+='<div class="stat-card"><div class="icon">'+d.icon+'</div><div class="val">'+d.val+'</div><div class="label">'+d.label+'</div></div>'});
  document.getElementById('stats').innerHTML=h;
}

function renderFilters(){
  var types=['全部','室内','室外','充电桩'];
  var h='';
  types.forEach(function(t){h+='<div class="tab'+(t===currentFilter?' active':'')+'" onclick="filterLots(\''+t+'\')">'+t+'</div>'});
  document.getElementById('filterTabs').innerHTML=h;
}

function filterLots(type){
  currentFilter=type;
  renderFilters();
  renderLots();
}

function renderLots(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=lots.filter(function(l){
    if(currentFilter!=='全部'&&l.types.indexOf(currentFilter)===-1) return false;
    if(search&&l.name.toLowerCase().indexOf(search)===-1&&l.addr.toLowerCase().indexOf(search)===-1) return false;
    return true;
  });
  var h='';
  filtered.forEach(function(l){
    var used=Math.round(l.total*(.4+Math.random()*.5));
    var free=l.total-used;
    var pct=Math.round(used/l.total*100);
    var color=pct>80?'var(--danger)':pct>50?'var(--warn)':'var(--success)';
    var spots=genSpots(l.total);
    var spotH='';
    spots.forEach(function(s){spotH+='<div class="spot '+s+'">'+(s==='free'?'空':s==='occupied'?'占':'约')+'</div>'});
    h+='<div class="lot"><div class="name">🅿️ '+l.name+'</div><div class="info">📍 '+l.addr+' · ¥'+l.rate+'/小时 · '+l.types.join(' · ')+'</div><div class="spots">'+spotH+'</div><div style="font-size:.8rem;color:var(--text2)">空闲 '+free+' / '+l.total+' 车位</div><div class="bar"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div><div class="btn-row"><button class="btn btn-sm btn-success" onclick="reserve(\''+l.name+'\')">预约车位</button><button class="btn btn-sm btn-outline" onclick="navigate(\''+l.name+'\')">导航前往</button></div></div>';
  });
  document.getElementById('lotGrid').innerHTML=h||'<div style="text-align:center;color:var(--text2);padding:20px">暂无匹配停车场</div>';
}

window.filterLots=filterLots;
window.reserve=function(name){garyyToast('已预约 '+name+' 车位','success')};
window.navigate=function(name){garyyToast('正在导航至 '+name,'info')};

function renderHistory(){
  var h='';
  history.forEach(function(r){
    var badge=r.status==='已缴费'?'badge-success':'badge-warn';
    h+='<div class="history-item"><span class="badge '+badge+'">'+r.status+'</span><span style="flex:1"><strong>'+r.lot+'</strong><br><span style="font-size:.8rem;color:var(--text2)">'+r.plate+' · '+r.entry+(r.exit?' → '+r.exit:' → 停放中')+'</span></span><span style="font-weight:600">'+(r.fee?'¥'+r.fee:'-')+'</span></div>';
  });
  document.getElementById('historyList').innerHTML=h;
}

function renderFeeCalc(){
  var h='<div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap"><div style="flex:1;min-width:150px"><label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:4px">停车场费率（元/小时）</label><input type="text" id="feeRate" value="8" onchange="calcFee()"></div><div style="flex:1;min-width:150px"><label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:4px">停放时长（小时）</label><input type="text" id="feeHours" value="3" onchange="calcFee()"></div><div style="text-align:center;min-width:120px"><div style="font-size:.8rem;color:var(--text2)">预估费用</div><div id="feeResult" style="font-size:1.5rem;font-weight:700;color:var(--accent)">¥24</div></div></div>';
  document.getElementById('feeCalc').innerHTML=h;
}

window.calcFee=function(){
  var rate=parseFloat(document.getElementById('feeRate').value)||0;
  var hours=parseFloat(document.getElementById('feeHours').value)||0;
  document.getElementById('feeResult').textContent='¥'+Math.round(rate*hours);
};

document.getElementById('searchInput').addEventListener('input',renderLots);
renderStats();renderFilters();renderLots();renderHistory();renderFeeCalc();
setInterval(renderStats,8000);
})();
</script>
</body>
</html>
