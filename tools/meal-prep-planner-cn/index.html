<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍱 备餐计划器</title>
<meta name="description" content="每周备餐计划器，提前规划一周健康饮食菜单和购物清单">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px;margin-bottom:2px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.day-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px}
.day-card h3{font-size:.95rem;margin-bottom:8px;color:var(--accent)}
.meal-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.meal-row:last-child{border-bottom:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍱</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🍱 备餐计划器">
<meta property="og:description" content="每周备餐计划器，提前规划一周健康饮食菜单和购物清单">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/meal-prep-planner-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🍱 备餐计划器</h1><p>规划一周饮食，健康备餐从计划开始</p></div>

<div class="cd"><h2>添加备餐</h2>
<div class="fr">
<div><label>星期</label>
<select id="daySelect"><option>周一</option><option>周二</option><option>周三</option><option>周四</option><option>周五</option><option>周六</option><option>周日</option></select></div>
<div><label>餐次</label>
<select id="mealSelect"><option value="早餐">🌅 早餐</option><option value="午餐">☀️ 午餐</option><option value="晚餐">🌙 晚餐</option><option value="加餐">🍪 加餐</option></select></div>
</div>
<label>菜品名称</label><input type="text" id="dishName" placeholder="如：番茄炒蛋、鸡胸肉沙拉">
<label>食材 (逗号分隔)</label><input type="text" id="ingredients" placeholder="如：番茄,鸡蛋,鸡胸肉">
<label>预估热量 (kcal，选填)</label><input type="number" id="dishCal" placeholder="选填">
<div class="bg"><button onclick="addMeal()">添加备餐</button></div></div>

<div class="cd"><h2>一周计划</h2><div id="weekPlan"></div>
<div class="bg"><button class="sec" onclick="clearWeek()">清空本周计划</button></div></div>

<div class="cd"><h2>🛒 购物清单</h2><div id="shoppingList" class="es">添加备餐后自动生成</div>
<div class="bg"><button class="sec" onclick="clearChecked()">清除已购</button></div></div>
</div>
<script>
(function(){
var DB='meal_prep_cn';
var plans=JSON.parse(localStorage.getItem(DB)||'[]');
var days=['周一','周二','周三','周四','周五','周六','周日'];
var checked=JSON.parse(localStorage.getItem(DB+'_ck')||'{}');

window.addMeal=function(){
var day=document.getElementById('daySelect').value;
var meal=document.getElementById('mealSelect').value;
var name=document.getElementById('dishName').value.trim();
var ing=document.getElementById('ingredients').value.trim();
var cal=parseInt(document.getElementById('dishCal').value)||0;
if(!name){alert('请输入菜品名称');return;}
plans.push({day:day,meal:meal,name:name,ingredients:ing,cal:cal,id:Date.now()});
localStorage.setItem(DB,JSON.stringify(plans));
document.getElementById('dishName').value='';document.getElementById('ingredients').value='';document.getElementById('dishCal').value='';
render();
};

window.delMeal=function(id){plans=plans.filter(function(p){return p.id!==id});localStorage.setItem(DB,JSON.stringify(plans));render();};
window.clearWeek=function(){plans=[];localStorage.setItem(DB,JSON.stringify(plans));render();};

window.toggleCheck=function(k){
checked[k]=!checked[k];
localStorage.setItem(DB+'_ck',JSON.stringify(checked));
render();
};
window.clearChecked=function(){checked={};localStorage.setItem(DB+'_ck',JSON.stringify(checked));render();};

function render(){
var el=document.getElementById('weekPlan');
var html='';
days.forEach(function(d){
var meals=plans.filter(function(p){return p.day===d});
if(!meals.length){html+='<div class="day-card"><h3>'+d+'</h3><div style="color:var(--text2);font-size:.85rem">暂无计划</div></div>';return;}
html+='<div class="day-card"><h3>'+d+'</h3>';
var ms=['早餐','午餐','晚餐','加餐'];
ms.forEach(function(m){
var items=meals.filter(function(p){return p.meal===m});
if(!items.length)return;
items.forEach(function(it){
html+='<div class="meal-row"><span><span class="tag'+(m==='早餐'?'':m==='午餐'?' s':m==='晚餐'?' w':' d')+'">'+m+'</span> '+it.name+(it.cal?' <span style="color:var(--text2);font-size:.8rem">'+it.cal+'kcal</span>':'')+'</span><button class="dng" style="padding:2px 8px;font-size:.75rem" onclick="delMeal('+it.id+')">✕</button></div>';
});
});
html+='</div>';
});
el.innerHTML=html;

var allIng={};
plans.forEach(function(p){
if(!p.ingredients)return;
p.ingredients.split(/[,，、]/).forEach(function(s){
var t=s.trim();
if(t){allIng[t]=(allIng[t]||0)+1;}
});
});
var sEl=document.getElementById('shoppingList');
var keys=Object.keys(allIng);
if(!keys.length){sEl.innerHTML='<div class="es">添加备餐后自动生成购物清单</div>';return;}
sEl.innerHTML=keys.map(function(k){
var ck=checked[k];
return '<div class="li" style="cursor:pointer" onclick="toggleCheck(\''+k+'\')"><span style="'+(ck?'text-decoration:line-through;opacity:.5':'')+'">'+k+(allIng[k]>1?' ×'+allIng[k]:'')+'</span><span>'+(ck?'✅':'⬜')+'</span></div>';
}).join('');
}
render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
