<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub仓库搜索</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;color:var(--text)}
.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.search-box{display:flex;gap:8px;max-width:500px;margin:16px auto 0}
.search-box input{flex:1;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.9rem;outline:none}
.search-box input:focus{border-color:var(--blue)}
.search-box button{padding:10px 20px;background:var(--blue);border:none;border-radius:var(--radius);color:#fff;cursor:pointer;font-size:.9rem}
.search-box button:hover{opacity:.9}
.loading{text-align:center;padding:60px 0}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:.85rem}
.error{text-align:center;padding:40px 0;color:var(--red);font-size:.9rem}
.retry-btn{margin-top:10px;padding:8px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.85rem}
.repo-list{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.repo-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:.2s}
.repo-item:hover{border-color:var(--blue)}
.repo-name{font-size:.95rem;font-weight:600;color:var(--blue)}
.repo-name:hover{text-decoration:underline}
.repo-desc{font-size:.82rem;color:var(--text2);margin-top:6px;line-height:1.4}
.repo-meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:.78rem;color:var(--text2)}
.repo-meta span{display:inline-flex;align-items:center;gap:4px}
.repo-lang{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:2px}
.repo-update{font-size:.75rem;color:var(--text2);margin-top:6px}
.result-count{text-align:center;padding:12px 0;color:var(--text2);font-size:.82rem}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🔍 GitHub仓库搜索</h1>
<p class="sub">GitHub API · 按星标排序</p>
</header>
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索仓库，如 react" onkeydown="if(event.key==='Enter')searchRepos()">
<button onclick="searchRepos()">搜索</button>
</div>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var input=document.getElementById('searchInput');
var langColors={
'JavaScript':'#f1e05a','Python':'#3572A5','TypeScript':'#3178c6','Java':'#b07219','Go':'#00ADD8','Rust':'#dea584','C++':'#f34b7d','C':'#555555','Ruby':'#701516','PHP':'#4F5D95','Swift':'#F05138','Kotlin':'#A97BFF','Dart':'#00B4AB','Shell':'#89e051','HTML':'#e34c26','CSS':'#563d7c','Vue':'#41b883','Scala':'#c22d40','Lua':'#000080','Elixir':'#6e4a7e'
};
var trendingLoaded = false;
var cnRegex = /[\u4e00-\u9fff]/;
function isCn(s){return cnRegex.test(s||'');}
window.loadTrending=function(){
  app.innerHTML='<div class="loading"><div class="spinner"></div><p>加载 trending...</p></div>';
  var d = new Date(); d.setDate(d.getDate()-7);
  var dateStr = d.toISOString().split('T')[0];
  fetch('https://api.github.com/search/repositories?q=created:>'+dateStr+'&sort=stars&order=desc&per_page=30')
  .then(function(r){
    if(r.status===403)throw new Error('API 限流');
    if(!r.ok)throw new Error('请求失败');
    return r.json();
  })
  .then(function(data){
    if(!data.items||!data.items.length){loadFallback();return;}
    trendingLoaded = true;
    var all=data.items;
    var cnItems=all.filter(function(x){return isCn(x.name)||isCn(x.description);});
    if(cnItems.length>=3){
      renderRepos(cnItems.slice(0,15), '🔥 中文热门项目');
      app.innerHTML+= '<div style="text-align:center;padding:8px 0;font-size:.75rem;color:var(--text2)">····· 以下为全部 Trending ·····</div>';
      renderRepos(all.slice(0,20), '🔥 近7天 Trending');
    } else {
      renderRepos(all.slice(0,15), '🔥 过去7天 Trending');
    }
  })
  .catch(function(){loadFallback();});
};
function loadFallback(){
  var d = new Date(); d.setDate(d.getDate()-30);
  var dateStr = d.toISOString().split('T')[0];
  fetch('https://api.github.com/search/repositories?q=created:>'+dateStr+'&sort=stars&order=desc&per_page=30')
  .then(function(r){if(!r.ok)return;return r.json();})
  .then(function(data){
    if(data&&data.items&&data.items.length){
      trendingLoaded = true;
      var all=data.items;
      var cnItems=all.filter(function(x){return isCn(x.name)||isCn(x.description);});
      if(cnItems.length>=3){
        renderRepos(cnItems.slice(0,15), '🔥 中文热门项目');
        app.innerHTML+= '<div style="text-align:center;padding:8px 0;font-size:.75rem;color:var(--text2)">····· 以下为全部 Trending ·····</div>';
        renderRepos(all.slice(0,20), '🔥 本月 Trending');
      } else {
        renderRepos(all.slice(0,15), '🔥 本月 Trending');
      }
    }
  })
  .catch(function(){});
};
window.searchRepos=function(){
var q=input.value.trim();
if(!q){app.innerHTML='<div class="error"><p>请输入搜索关键词</p></div>';return;}
app.innerHTML='<div class="loading"><div class="spinner"></div><p>搜索中...</p></div>';
var query=encodeURIComponent(q);
if(isCn(q)) query=encodeURIComponent(q+'+in:name,description,readme');
fetch('https://api.github.com/search/repositories?q='+query+'&sort=stars&order=desc')
.then(function(r){
if(r.status===403)throw new Error('API 限流，请稍后再试');
if(!r.ok)throw new Error('请求失败 ('+r.status+')');
return r.json();
})
.then(function(data){
if(!data.items||!data.items.length){
app.innerHTML='<div class="error"><p>未找到相关仓库</p></div>';return;
}
renderRepos(data.items, '搜索结果: "'+input.value.trim()+'"');
})
.catch(function(e){
app.innerHTML='<div class="error"><p>⚠️ '+e.message+'</p><button class="retry-btn" onclick="searchRepos()">重试</button></div>';
});
};
function renderRepos(items, title){
var countNote = title ? '<div class="result-count">'+title+'</div>' : '';
var html=countNote+'<div class="repo-list">';
items.slice(0,30).forEach(function(r){
var lang=r.language||'';
var color=langColors[lang]||'#8b949e';
var desc=r.description||'暂无描述';
if(desc.length>120)desc=desc.substring(0,120)+'...';
html+='<div class="repo-item">';
html+='<a class="repo-name" href="'+r.html_url+'" target="_blank">'+r.full_name+'</a>';
html+='<div class="repo-desc">'+desc+'</div>';
html+='<div class="repo-meta">';
if(lang)html+='<span><span class="repo-lang" style="background:'+color+'"></span>'+lang+'</span>';
html+='<span>⭐ '+formatNum(r.stargazers_count)+'</span>';
html+='<span>🍴 '+formatNum(r.forks_count)+'</span>';
html+='<span>🐛 '+formatNum(r.open_issues_count)+'</span>';
html+='</div>';
html+='<div class="repo-update">最后更新: '+timeAgo(r.updated_at)+'</div>';
html+='</div>';
});
html+='</div>';
app.innerHTML=html;
}
function formatNum(n){if(n>=1000)return (n/1000).toFixed(1)+'k';return n;}
function timeAgo(ts){
var seconds=Math.floor((Date.now()-new Date(ts).getTime())/1000);
if(seconds<60)return '刚刚';
var mins=Math.floor(seconds/60);
if(mins<60)return mins+'分钟前';
var hours=Math.floor(mins/60);
if(hours<24)return hours+'小时前';
var days=Math.floor(hours/24);
return days+'天前';
}
})();
window.loadTrending();
</script>
<script src="../i18n.js"></script>
</body>
</html>
