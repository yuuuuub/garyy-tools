<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥋 武术追踪</title>
<meta name="description" content="武术训练追踪器，记录太极、散打、柔道等训练，管理技术等级和训练历史">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.belt-display{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.belt{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff;border:2px solid var(--border)}
.skill-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.skill-bar .name{min-width:80px;font-size:.85rem}
.skill-bar .bar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.skill-bar .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--success))}
.skill-bar .dots{display:flex;gap:3px}
.skill-bar .dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--border);cursor:pointer}
.skill-bar .dot.filled{background:var(--warn);border-color:var(--warn)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥋</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🥋 武术追踪">
<meta property="og:description" content="武术训练追踪器，记录训练数据和技术等级">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/martial-arts-cn/">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🥋 武术追踪</h1><p>习武之道，始于记录</p></div>

<div class="cd">
<div class="gr">
<div class="st"><div class="nm" id="totalSessions">0</div><div class="lb">训练次数</div></div>
<div class="st"><div class="nm" id="totalHours" style="color:var(--success)">0</div><div class="lb">总时长(小时)</div></div>
<div class="st"><div class="nm" id="favArt" style="color:var(--warn)">-</div><div class="lb">最常练习</div></div>
<div class="st"><div class="nm" id="streak" style="color:var(--danger)">0</div><div class="lb">连续天数</div></div>
</div>
</div>

<div class="cd"><h2>记录训练</h2>
<div class="fr">
<div><label>武术类型</label><select id="mArt"><option>太极拳</option><option>咏春拳</option><option>散打</option><option>柔道</option><option>跆拳道</option><option>巴西柔术</option><option>拳击</option><option>综合格斗</option><option>形意拳</option><option>八卦掌</option><option>少林功夫</option><option>其他</option></select></div>
<div><label>时长(分钟)</label><input type="number" id="mDur" placeholder="60" min="1"></div>
</div>
<div class="fr">
<div><label>技术重点</label><input type="text" id="mFocus" placeholder="如：直拳、踢腿"></div>
<div><label>实战回合</label><input type="number" id="mSpar" value="0" min="0"></div>
</div>
<div><label>日期</label><input type="date" id="mDate"></div>
<div class="bg"><button onclick="addSession()">保存训练</button></div></div>

<div class="cd"><h2>技术等级</h2>
<div style="display:flex;gap:8px;margin-bottom:12px">
<select id="tArt" style="width:auto"><option>太极拳</option><option>散打</option><option>拳击</option><option>柔道</option><option>跆拳道</option></select>
<button class="sec" onclick="showAddTech()" style="font-size:.85rem;padding:6px 12px">+ 添加技术</button>
</div>
<div id="addTechForm" style="display:none">
<div class="fr">
<div><label>技术名称</label><input type="text" id="techName" placeholder="如：直拳"></div>
<div><label>类型</label><select id="techType"><option>进攻</option><option>防守</option><option>摔法</option><option>地面</option><option>步法</option></select></div>
</div>
<div><label>熟练度(1-5)</label><input type="number" id="techLevel" value="1" min="1" max="5"></div>
<div class="bg"><button onclick="saveTech()">保存</button><button class="sec" onclick="hideAddTech()">取消</button></div>
</div>
<div id="techList"></div></div>

<div class="cd"><h2>训练历史</h2><div id="sessionList" class="es">暂无记录</div>
<div class="bg"><button class="dng" onclick="clearSessions()">清空所有</button></div></div>
</div>
<script>
(function(){
var SESS_KEY='martial_arts_sessions';
var TECH_KEY='martial_arts_techs';
var sessions=JSON.parse(localStorage.getItem(SESS_KEY)||'[]');
var techs=JSON.parse(localStorage.getItem(TECH_KEY)||'[]');
var today=function(){return new Date().toISOString().slice(0,10)};

window.addSession=function(){
var art=document.getElementById('mArt').value;
var dur=parseInt(document.getElementById('mDur').value)||0;
if(!dur){alert('请填写训练时长');return;}
var focus=document.getElementById('mFocus').value.trim();
var spar=parseInt(document.getElementById('mSpar').value)||0;
var date=document.getElementById('mDate').value||today();
sessions.push({id:Date.now(),art:art,duration:dur,focus:focus,sparring:spar,date:date});
localStorage.setItem(SESS_KEY,JSON.stringify(sessions));
document.getElementById('mDur').value='';document.getElementById('mFocus').value='';document.getElementById('mSpar').value='0';
render();
};

window.delSession=function(id){sessions=sessions.filter(function(s){return s.id!==id});localStorage.setItem(SESS_KEY,JSON.stringify(sessions));render();};
window.clearSessions=function(){if(!confirm('确定清空所有？'))return;sessions=[];localStorage.setItem(SESS_KEY,JSON.stringify(sessions));render();};

function getStreak(){var streak=0;var d=new Date();while(true){var ds=d.toISOString().slice(0,10);if(sessions.some(function(s){return s.date===ds;})){streak++;d.setDate(d.getDate()-1);}else break;}return streak;}

window.showAddTech=function(){document.getElementById('addTechForm').style.display='block';};
window.hideAddTech=function(){document.getElementById('addTechForm').style.display='none';};
window.saveTech=function(){
var name=document.getElementById('techName').value.trim();
if(!name){alert('请输入技术名称');return;}
techs.push({id:Date.now(),name:name,art:document.getElementById('tArt').value,type:document.getElementById('techType').value,level:parseInt(document.getElementById('techLevel').value)||1});
localStorage.setItem(TECH_KEY,JSON.stringify(techs));
document.getElementById('techName').value='';document.getElementById('techLevel').value='1';hideAddTech();renderTechs();
};
window.delTech=function(id){techs=techs.filter(function(t){return t.id!==id});localStorage.setItem(TECH_KEY,JSON.stringify(techs));renderTechs();};
window.setLevel=function(id,level){var t=techs.find(function(x){return x.id===id;});if(t){t.level=level;localStorage.setItem(TECH_KEY,JSON.stringify(techs));renderTechs();}};

function renderTechs(){
var art=document.getElementById('tArt').value;
var filtered=techs.filter(function(t){return t.art===art;});
var el=document.getElementById('techList');
if(!filtered.length){el.innerHTML='<div class="es">暂无该类型技术</div>';return;}
el.innerHTML=filtered.map(function(t){
var pct=t.level/5*100;
var dots='';for(var i=1;i<=5;i++)dots+='<div class="dot '+(i<=t.level?'filled':'')+'" onclick="setLevel('+t.id+','+i+')"></div>';
return '<div class="skill-bar"><div class="name">'+t.name+'</div><div class="dots">'+dots+'</div><button class="dng" style="padding:2px 8px;font-size:.7rem;margin-left:8px" onclick="delTech('+t.id+')">✕</button></div>';
}).join('');
}
document.getElementById('tArt').addEventListener('change',renderTechs);

function render(){
document.getElementById('totalSessions').textContent=sessions.length;
var totalMin=0;sessions.forEach(function(s){totalMin+=s.duration;});
document.getElementById('totalHours').textContent=(totalMin/60).toFixed(1);
var artCounts={};sessions.forEach(function(s){artCounts[s.art]=(artCounts[s.art]||0)+1;});
var maxArt='-',maxCount=0;Object.keys(artCounts).forEach(function(k){if(artCounts[k]>maxCount){maxCount=artCounts[k];maxArt=k;}});
document.getElementById('favArt').textContent=maxArt;
document.getElementById('streak').textContent=getStreak();

var el=document.getElementById('sessionList');
if(!sessions.length){el.innerHTML='<div class="es">暂无记录</div>';return;}
el.innerHTML=sessions.slice().reverse().map(function(s){
return '<div class="li"><div style="flex:1"><strong>'+s.art+'</strong> <span class="tag">'+s.duration+'分钟</span><br><span style="font-size:.8rem;color:var(--text2)">'+s.focus+(s.sparring?' · 实战'+s.sparring+'回合':'')+' · '+s.date+'</span></div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="delSession('+s.id+')">✕</button></div>';
}).join('');

renderTechs();
}
document.getElementById('mDate').value=today();
render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
