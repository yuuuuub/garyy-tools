<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚖️ 理想体重计算器</title>
<meta property="og:title" content="⚖️ 理想体重计算器">
<meta property="og:description" content="⚖️ 理想体重计算器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线理想体重计算器，支持多种公式计算理想体重，包含BMI法、Broca法等">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.gender-tabs{display:flex;gap:8px;margin-bottom:12px}
.gender-tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:14px;cursor:pointer;text-align:center;transition:all .2s;font-weight:600}
.gender-tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-group label{font-size:12px;color:var(--text-secondary);font-weight:500}
.input-group input{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;transition:all .2s}
.input-group input:focus{outline:none;border-color:var(--accent)}
.calc-btn{width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.calc-btn:hover{background:var(--accent-hover)}
.result-card{background:var(--tag-bg);border-radius:12px;padding:20px;text-align:center;margin-top:12px}
.result-val{font-size:36px;font-weight:800;color:var(--accent)}
.result-range{font-size:16px;margin-top:4px;font-weight:600}
.result-diff{font-size:13px;margin-top:8px;color:var(--text-secondary)}
.weight-visual{margin-top:16px}
.weight-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.weight-bar-label{width:80px;font-size:12px;color:var(--text-secondary);text-align:right}
.weight-bar-track{flex:1;height:24px;background:var(--border);border-radius:12px;position:relative;overflow:visible}
.weight-bar-fill{height:100%;border-radius:12px;transition:width .5s}
.weight-bar-marker{position:absolute;top:-3px;width:4px;height:30px;background:var(--text);border-radius:2px;transition:left .5s}
.formula-card{border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.formula-name{font-size:13px;font-weight:600;margin-bottom:4px}
.formula-result{font-size:20px;font-weight:700;color:var(--accent)}
.formula-desc{font-size:11px;color:var(--text-secondary);margin-top:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>⚖️ 理想体重计算器</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">👤 基本信息</div>
<div class="gender-tabs">
<div class="gender-tab active" onclick="setGender('male',this)">👨 男性</div>
<div class="gender-tab" onclick="setGender('female',this)">👩 女性</div>
</div>
<div class="input-row">
<div class="input-group">
<label>身高 (cm)</label>
<input type="number" id="height" placeholder="170" min="100" max="220">
</div>
<div class="input-group">
<label>体重 (kg)</label>
<input type="number" id="weight" placeholder="65" min="20" max="250">
</div>
</div>
<div class="input-row">
<div class="input-group">
<label>年龄 (岁)</label>
<input type="number" id="age" placeholder="25" min="10" max="100">
</div>
<div class="input-group">
<label>骨架大小</label>
<select id="frame" style="padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px">
<option value="small">小骨架</option>
<option value="medium" selected>中等骨架</option>
<option value="large">大骨架</option>
</select>
</div>
</div>
<button class="calc-btn" onclick="calculate()">⚖️ 计算理想体重</button>
</div>
<div class="card" id="resultCard" style="display:none">
<div class="card-title">📊 计算结果</div>
<div class="result-card">
<div class="result-val" id="idealWeight">--</div>
<div class="result-range" id="idealRange">--</div>
<div class="result-diff" id="idealDiff"></div>
</div>
<div class="weight-visual" id="weightVisual"></div>
</div>
<div class="card">
<div class="card-title">📋 各公式计算</div>
<div id="formulaCards"></div>
</div>
<div class="footer">Gary's Tools · 理想体重仅供参考</div>
</div>
<script>
let currentGender='male';
function setGender(g,el){
currentGender=g;
document.querySelectorAll('.gender-tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
}
function calculate(){
const h=parseFloat(document.getElementById('height').value);
const w=parseFloat(document.getElementById('weight').value);
const age=parseFloat(document.getElementById('age').value)||25;
const frame=document.getElementById('frame').value;
if(!h||!w){alert('请输入身高和体重');return}
const broca=currentGender==='male'?h-105:h-110;
const bmiLow=Math.round(18.5*(h/100)**2*10)/10;
const bmiHigh=Math.round(23.9*(h/100)**2*10)/10;
const bmiIdeal=Math.round(22*(h/100)**2*10)/10;
let hamwi;
if(currentGender==='male'){hamwi=48.0+2.7*(h/2.54-60);}
else{hamwi=45.5+2.2*(h/2.54-60);}
hamwi=Math.round(hamwi*10)/10;
const devine=currentGender==='male'?50+2.3*(h/2.54-60):45.5+2.3*(h/2.54-60);
const miller=currentGender==='male'?56.2+1.41*(h/2.54-60):53.1+1.36*(h/2.54-60);
let frameMul=frame==='small'?0.9:frame==='large'?1.1:1.0;
const avg=(broca+bmiIdeal+hamwi+devine+miller)/5*frameMul;
const low=avg*0.9;
const high=avg*1.1;
document.getElementById('idealWeight').textContent=avg.toFixed(1)+' kg';
document.getElementById('idealRange').textContent=`${low.toFixed(1)} ~ ${high.toFixed(1)} kg`;
const diff=w-avg;
let diffText='';
if(Math.abs(diff)<1)diffText='✅ 您的体重在理想范围内！';
else if(diff>0)diffText=`超出理想体重 ${diff.toFixed(1)} kg`;
else diffText=`低于理想体重 ${Math.abs(diff).toFixed(1)} kg`;
document.getElementById('idealDiff').textContent=diffText;
const formulas=[
{name:'Broca公式',val:broca,desc:currentGender==='male'?'身高-105':'身高-110'},
{name:'BMI标准体重',val:bmiIdeal,desc:'BMI 22 对应体重'},
{name:'Hamwi公式',val:hamwi,desc:'基于身高经典公式'},
{name:'Devine公式',val:devine,desc:'医学常用公式'},
{name:'Miller公式',val:miller,desc:'基于身高和性别'}
];
let cardsHtml='';
formulas.forEach(f=>{
cardsHtml+=`<div class="formula-card"><div class="formula-name">${f.name}</div><div class="formula-result">${f.val.toFixed(1)} kg</div><div class="formula-desc">${f.desc}</div></div>`;
});
document.getElementById('formulaCards').innerHTML=cardsHtml;
const maxWeight=Math.max(w,high,120);
document.getElementById('weightVisual').innerHTML=`
<div class="weight-bar">
<div class="weight-bar-label">当前体重</div>
<div class="weight-bar-track">
<div class="weight-bar-fill" style="width:${(w/maxWeight)*100}%;background:${w>high?'var(--red)':w<low?'var(--blue)':'var(--green)'}"></div>
<div class="weight-bar-marker" style="left:calc(${(w/maxWeight)*100}% - 2px)"></div>
</div>
<div style="width:60px;font-size:12px;font-weight:600">${w} kg</div>
</div>
<div class="weight-bar">
<div class="weight-bar-label">理想范围</div>
<div class="weight-bar-track">
<div style="position:absolute;left:${(low/maxWeight)*100}%;width:${((high-low)/maxWeight)*100}%;height:100%;background:var(--green);opacity:.3;border-radius:12px"></div>
</div>
<div style="width:60px;font-size:12px;font-weight:600">${avg.toFixed(0)} kg</div>
</div>
`;
document.getElementById('resultCard').style.display='block';
}
function toggleTheme(){
const html=document.documentElement;
const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
html.setAttribute('data-theme',next);
document.querySelector('.theme-toggle').textContent=next==='dark'?'☀️':'🌙';
}
</script>
</body>
</html>
