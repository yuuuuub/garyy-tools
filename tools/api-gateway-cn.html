<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API网关管理工具</title>
    <meta name="description" content="用于管理API网关路由和配置的工具">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
    <meta name="robots" content="index, follow">
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #e6e6e6;
            --text-secondary: #a6a6a6;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --border: #2a2a4a;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        h1 { color: var(--accent); margin-bottom: 2rem; text-align: center; }
        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); }
        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 1rem;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover { background: var(--accent-hover); }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--bg-tertiary); color: var(--text-secondary); }
        .status { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
        .status-active { background: var(--success); color: white; }
        .status-inactive { background: var(--danger); color: white; }
    </style>
    <script src="i18n.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>API网关管理</h1>
        
        <div class="card">
            <h2>添加路由</h2>
            <form id="routeForm">
                <div class="form-group">
                    <label>路径</label>
                    <input type="text" id="path" placeholder="/api/v1/users" required>
                </div>
                <div class="form-group">
                    <label>目标服务</label>
                    <input type="text" id="target" placeholder="http://localhost:3000" required>
                </div>
                <div class="form-group">
                    <label>HTTP方法</label>
                    <select id="method">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                        <option value="*">所有方法</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select id="status">
                        <option value="active">启用</option>
                        <option value="inactive">禁用</option>
                    </select>
                </div>
                <button type="submit">添加路由</button>
            </form>
        </div>
        
        <div class="card">
            <h2>路由列表</h2>
            <table id="routesTable">
                <thead>
                    <tr>
                        <th>路径</th>
                        <th>目标服务</th>
                        <th>方法</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="routesBody">
                    <!-- 路由数据将在这里动态插入 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 初始化数据
        let routes = JSON.parse(localStorage.getItem('apiGatewayRoutes')) || [];
        
        // 渲染路由表格
        function renderRoutes() {
            const tbody = document.getElementById('routesBody');
            tbody.innerHTML = '';
            
            routes.forEach((route, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${route.path}</td>
                    <td>${route.target}</td>
                    <td>${route.method}</td>
                    <td><span class="status status-${route.status}">${route.status === 'active' ? '启用' : '禁用'}</span></td>
                    <td>
                        <button onclick="editRoute(${index})" style="margin-right: 0.5rem; padding: 0.5rem;">编辑</button>
                        <button onclick="deleteRoute(${index})" style="background: var(--danger);">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        // 添加路由
        document.getElementById('routeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newRoute = {
                path: document.getElementById('path').value,
                target: document.getElementById('target').value,
                method: document.getElementById('method').value,
                status: document.getElementById('status').value
            };
            routes.push(newRoute);
            localStorage.setItem('apiGatewayRoutes', JSON.stringify(routes));
            renderRoutes();
            this.reset();
        });
        
        // 编辑路由
        function editRoute(index) {
            const route = routes[index];
            document.getElementById('path').value = route.path;
            document.getElementById('target').value = route.target;
            document.getElementById('method').value = route.method;
            document.getElementById('status').value = route.status;
            routes.splice(index, 1);
            renderRoutes();
        }
        
        // 删除路由
        function deleteRoute(index) {
            if (confirm('确定要删除此路由吗？')) {
                routes.splice(index, 1);
                localStorage.setItem('apiGatewayRoutes', JSON.stringify(routes));
                renderRoutes();
            }
        }
        
        // 初始渲染
        renderRoutes();
    </script>
</body>
</html>
