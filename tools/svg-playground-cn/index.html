<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG游乐场 - 在线SVG编辑器</title>
<meta name="description" content="在线SVG编辑器，实时编写和预览SVG矢量图形">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;--muted:#8b949e}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warning:#9a6700;--error:#cf222e;--muted:#656d76}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
nav .logo{font-size:18px;font-weight:600;color:var(--accent2)}
nav a{color:var(--accent);text-decoration:none;font-size:14px}
.container{display:flex;flex-direction:column;height:calc(100vh - 52px)}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{opacity:.8}
.workspace{display:flex;flex:1;overflow:hidden}
.editor-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.preview-panel{flex:1;display:flex;flex-direction:column;background:var(--card)}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;font-size:13px;color:var(--accent2);font-weight:500}
.editor-wrapper{flex:1;position:relative}
#svgEditor{width:100%;height:100%;background:var(--bg);border:none;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:14px;padding:12px;resize:none;outline:none;line-height:1.6}
#previewArea{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:repeating-conic-gradient(#e5e7eb 0% 25%, transparent 0% 50%) 50% / 20px 20px;overflow:auto}
[data-theme="light"] #previewArea{background:repeating-conic-gradient(#e5e7eb 0% 25%, transparent 0% 50%) 50% / 20px 20px}
.templates{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.templates span{font-size:12px;color:var(--muted);margin-right:4px}
.template-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--accent2);cursor:pointer;transition:.2s}
.template-btn:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:768px){.workspace{flex-direction:column}.editor-panel{border-right:none;border-bottom:1px solid var(--border)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="SVG游乐场 - 在线SVG编辑器">
<meta property="og:description" content="在线SVG编辑器，实时编写和预览SVG矢量图形">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/svg-playground-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="/i18n.js" defer></script>
</head>
<body>
<h1>SVG游乐场 - 在线SVG编辑器</h1>
<nav>
<span class="logo">SVG游乐场</span>
<a href="/index.html">← 返回工具箱</a>
</nav>
<div class="container">
<div class="toolbar">
<button class="btn btn-primary" onclick="previewSVG()">▶ 预览</button>
<button class="btn btn-secondary" onclick="copySVG()">复制SVG</button>
<button class="btn btn-secondary" onclick="downloadSVG()">下载SVG</button>
<button class="btn btn-secondary" onclick="resetSVG()">重置</button>
</div>
<div class="templates">
<span>模板:</span>
<button class="template-btn" data-svg='<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">\n  <circle cx="100" cy="100" r="80" fill="#3b82f6" />\n  <circle cx="100" cy="100" r="50" fill="#58a6ff" />\n  <circle cx="100" cy="100" r="20" fill="#fff" />\n</svg>">圆形</button>
<button class="template-btn" data-svg='<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">\n  <rect x="20" y="20" width="160" height="160" rx="16" fill="#3b82f6" />\n  <rect x="40" y="40" width="120" height="120" rx="12" fill="#58a6ff" />\n  <rect x="60" y="60" width="80" height="80" rx="8" fill="#fff" />\n</svg>">矩形</button>
<button class="template-btn" data-svg='<svg width="300" height="100" xmlns="http://www.w3.org/2000/svg">\n  <defs>\n    <linearGradient id="grad" x1="0%" y1="0%" x2="100%">\n      <stop offset="0%" style="stop-color:#667eea" />\n      <stop offset="100%" style="stop-color:#764ba2" />\n    </linearGradient>\n  </defs>\n  <rect width="300" height="100" rx="16" fill="url(#grad)" />\n  <text x="150" y="58" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif">渐变效果</text>\n</svg>">渐变</button>
<button class="template-btn" data-svg='<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">\n  <style>\n    .spin { animation: rotate 3s linear infinite; transform-origin: 100px 100px; }\n    @keyframes rotate { to { transform: rotate(360deg); } }\n  </style>\n  <rect class="spin" x="50" y="50" width="100" height="100" rx="10" fill="#3b82f6" />\n  <circle cx="100" cy="100" r="20" fill="#fff" />\n</svg>">动画</button>
<button class="template-btn" data-svg='<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">\n  <path d="M50,150 Q100,50 150,100 T250,80" fill="none" stroke="#3b82f6" stroke-width="4" />\n  <path d="M50,180 C100,50 200,180 280,60" fill="none" stroke="#f85149" stroke-width="3" />\n  <circle cx="50" cy="150" r="5" fill="#3b82f6" />\n  <circle cx="250" cy="80" r="5" fill="#3b82f6" />\n</svg>">路径</button>
<button class="template-btn" data-svg='<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">\n  <rect width="200" height="200" rx="20" fill="#1a1a2e" />\n  <polygon points="100,30 170,170 30,170" fill="none" stroke="#3b82f6" stroke-width="3" />\n  <circle cx="100" cy="120" r="30" fill="none" stroke="#f85149" stroke-width="3" />\n  <line x1="100" y1="30" x2="100" y2="170" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,5" />\n</svg>">图标</button>
</div>
<div class="workspace">
<div class="editor-panel">
<div class="panel-header">SVG代码</div>
<div class="editor-wrapper">
<textarea id="svgEditor"><svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#667eea" />
      <stop offset="100%" style="stop-color:#764ba2" />
    </linearGradient>
  </defs>
  <rect width="300" height="200" rx="16" fill="url(#grad)" />
  <circle cx="80" cy="100" r="40" fill="rgba(255,255,255,0.2)" />
  <circle cx="220" cy="100" r="40" fill="rgba(255,255,255,0.2)" />
  <text x="150" y="108" text-anchor="middle" fill="white" font-size="24" font-family="sans-serif" font-weight="bold">SVG</text>
</svg></textarea>
</div>
</div>
<div class="preview-panel">
<div class="panel-header">预览</div>
<div id="previewArea"></div>
</div>
</div>
</div>
<script>
const svgEditor = document.getElementById('svgEditor');
const previewArea = document.getElementById('previewArea');

function previewSVG() {
  const svgCode = svgEditor.value;
  previewArea.innerHTML = svgCode;
  const svg = previewArea.querySelector('svg');
  if (svg) {
    svg.style.maxWidth = '100%';
    svg.style.maxHeight = '100%';
  }
}

function copySVG() {
  navigator.clipboard.writeText(svgEditor.value).then(() => alert('SVG已复制'));
}

function downloadSVG() {
  const blob = new Blob([svgEditor.value], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'image.svg';
  a.click();
  URL.revokeObjectURL(url);
}

function resetSVG() {
  svgEditor.value = '<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">\n  <circle cx="100" cy="100" r="80" fill="#3b82f6" />\n</svg>';
  previewSVG();
}

document.querySelectorAll('.template-btn').forEach(btn => {
  btn.onclick = () => { svgEditor.value = btn.dataset.svg; previewSVG(); };
});

let debounce;
svgEditor.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(previewSVG, 300);
});

previewSVG();
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
