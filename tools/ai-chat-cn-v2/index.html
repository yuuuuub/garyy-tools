<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 AI对话 V2</title>
<meta name="description" content="AI对话工具V2，与AI智能助手聊天，支持上下文多轮对话">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;line-height:1.6;min-height:100vh;scroll-behavior:smooth}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.8rem;font-weight:700;margin-bottom:4px}
header p{color:var(--text2);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.chat-box{height:420px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;background:rgba(13,17,23,.4)}
.chat-box::-webkit-scrollbar{width:6px}
.chat-box::-webkit-scrollbar-track{background:transparent}
.chat-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.msg{margin-bottom:14px;display:flex;gap:10px}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.msg-user .msg-avatar{background:var(--blue)}
.msg-bot .msg-avatar{background:var(--green)}
.msg-content{background:rgba(22,27,34,.8);border:1px solid var(--border);border-radius:8px;padding:10px 14px;max-width:80%;font-size:.88rem;line-height:1.7;white-space:pre-wrap}
.msg-user .msg-content{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.2)}
.msg-bot .msg-content{background:rgba(35,134,54,.1);border-color:rgba(35,134,54,.2)}
.msg-time{font-size:.65rem;color:var(--text2);margin-top:4px}
.input-row{display:flex;gap:8px}
.input-row textarea{flex:1;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:.9rem;font-family:inherit;outline:none;transition:border .2s;resize:none;min-height:42px;max-height:120px}
.input-row textarea:focus{border-color:var(--blue)}
.input-row button{padding:9px 20px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;font-family:inherit;transition:opacity .2s;white-space:nowrap}
.input-row button:hover{opacity:.9}
.input-row button:disabled{opacity:.5;cursor:not-allowed}
.error-msg{background:rgba(239,68,68,.1);border:1px solid var(--red);border-radius:6px;padding:10px;color:var(--red);font-size:.82rem;margin-top:10px;display:none}
.typing-indicator{display:flex;gap:4px;padding:4px 0}
.typing-indicator span{width:6px;height:6px;border-radius:50%;background:var(--text2);animation:typing 1s infinite}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{opacity:.3}30%{opacity:1}}
.model-select{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.85rem;font-family:inherit;outline:none;cursor:pointer}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="💬 AI对话 V2">
<meta property="og:description" content="AI对话工具V2，支持上下文多轮对话">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>💬 AI对话 V2</h1>
<p>SiliconFlow · 多模型 · 上下文对话</p>
<div style="margin-top:8px">
<div style="margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center">
<input type="password" id="apiKeyInput" placeholder="输入 SiliconFlow API Key..." style="padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.8rem;width:260px;outline:none;font-family:monospace" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
<button onclick="saveApiKey()" style="padding:5px 12px;background:var(--green);color:#fff;border:none;border-radius:6px;font-size:.78rem;cursor:pointer;white-space:nowrap">💾 保存</button>
<span id="keyStatus" style="font-size:.7rem;color:var(--text2)"></span>
</div>
<div style="margin-top:6px;text-align:center;font-size:.72rem;color:var(--text2)">免费注册获取：<a href="https://cloud.siliconflow.cn" target="_blank" style="color:var(--blue)">cloud.siliconflow.cn</a> · Key仅保存在本地浏览器</div>
</header>
<div class="card">
<div class="model-select">
<label style="font-size:.85rem;color:var(--text2)">模型：</label>
<select id="modelSelect">
<option value="Qwen/Qwen2.5-7B-Instruct">Qwen2.5-7B</option>
<option value="Qwen/Qwen2.5-14B-Instruct">Qwen2.5-14B</option>
<option value="deepseek-ai/DeepSeek-V2.5">DeepSeek-V2.5</option>
<option value="THUDM/glm-4-9b-chat">GLM-4-9B</option>
</select>
<label style="font-size:.85rem;color:var(--text2);margin-left:12px">温度：</label>
<select id="tempSelect">
<option value="0.3">0.3 精确</option>
<option value="0.7" selected>0.7 均衡</option>
<option value="1.0">1.0 创意</option>
</select>
<button onclick="clearChat()" style="padding:4px 12px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.8rem;border-radius:6px">🗑️ 清空</button>
</div>
<div class="chat-box" id="chatBox">
<div class="msg msg-bot">
<div class="msg-avatar">🤖</div>
<div class="msg-content">
<div>你好！我是AI助手V2，支持多模型切换和上下文对话，有什么可以帮你的吗？</div>
<div class="msg-time">现在</div>
</div>
</div>
</div>
<div id="errorMsg" class="error-msg"></div>
<div class="input-row">
<textarea id="msgInput" rows="1" placeholder="输入消息... Enter发送 / Shift+Enter换行" title="Enter键发送"></textarea>
<button id="sendBtn">发送</button>
</div>
</div>
</div>
<script>
(function(){
'use strict';
var chatBox=document.getElementById('chatBox');
var msgInput=document.getElementById('msgInput');
var sendBtn=document.getElementById('sendBtn');
var errorMsg=document.getElementById('errorMsg');
var modelSelect=document.getElementById('modelSelect');
var tempSelect=document.getElementById('tempSelect');
var API_URL='https://api.siliconflow.cn/v1/chat/completions';
var API_KEY=localStorage.getItem('sf_api_key')||'';
var isWaiting=false;
var chatHistory=[{role:'system',content:'你是一个有用的AI助手，请用中文回答问题。回答要简洁、准确、有帮助。'}];

msgInput.addEventListener('input',function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
});

msgInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
});

function addMessage(role,text){
  var div=document.createElement('div');
  div.className='msg msg-'+(role==='user'?'user':'bot');
  var avatar=role==='user'?'👤':'🤖';
  var now=new Date();
  var timeStr=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  div.innerHTML='<div class="msg-avatar">'+avatar+'</div><div class="msg-content"><div>'+text+'</div><div class="msg-time">'+timeStr+'</div></div>';
  chatBox.appendChild(div);
  chatBox.scrollTop=chatBox.scrollHeight;
}

function addTyping(){
  var div=document.createElement('div');
  div.className='msg msg-bot';
  div.id='typingMsg';
  div.innerHTML='<div class="msg-avatar">🤖</div><div class="msg-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  chatBox.appendChild(div);
  chatBox.scrollTop=chatBox.scrollHeight;
}

function removeTyping(){
  var el=document.getElementById('typingMsg');
  if(el)el.remove();
}

function sendMessage(){
  if(isWaiting)return;
  var text=msgInput.value.trim();
  if(!text){showError('请输入消息');return;}
  if(!API_KEY){showError('请先设置 API Key');return;}
  hideError();
  addMessage('user',escapeHtml(text));
  msgInput.value='';
  msgInput.style.height='auto';
  isWaiting=true;
  sendBtn.disabled=true;
  addTyping();
  var model=modelSelect.value;
  var temp=parseFloat(tempSelect.value);
  fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
    body:JSON.stringify({model:model,messages:chatHistory.concat([{role:'user',content:text}]),max_tokens:1024,temperature:temp})
  })
  .then(function(r){
    if(!r.ok)return r.json().then(function(d){throw new Error(d.error?.message||'请求失败 ('+r.status+')')});
    return r.json();
  })
  .then(function(data){
    removeTyping();
    isWaiting=false;
    sendBtn.disabled=false;
    var reply='';
    if(data&&data.choices&&data.choices[0]&&data.choices[0].message){
      reply=data.choices[0].message.content;
      chatHistory.push({role:'user',content:text});
      chatHistory.push({role:'assistant',content:reply});
      if(chatHistory.length>40)chatHistory=chatHistory.slice(-40);
    }else{
      reply='抱歉，我暂时无法回答这个问题。';
    }
    addMessage('bot',escapeHtml(reply));
  })
  .catch(function(err){
    removeTyping();
    isWaiting=false;
    sendBtn.disabled=false;
    showError(err.message||'请求失败，请稍后重试');
  });
}

function escapeHtml(str){
  var div=document.createElement('div');
  div.textContent=str;
  return div.innerHTML;
}
function showError(msg){errorMsg.textContent=msg;errorMsg.style.display='block';}
function hideError(){errorMsg.style.display='none';}

function saveApiKey(){
  var key=document.getElementById('apiKeyInput').value.trim();
  if(!key){showError('请输入 API Key');return;}
  API_KEY=key;
  localStorage.setItem('sf_api_key',API_KEY);
  updateKeyStatus();
}
}
function updateKeyStatus(){
  var el=document.getElementById('keyStatus');
  var inp=document.getElementById('apiKeyInput');
  if(API_KEY){el.textContent='✅ 已保存';el.style.color='var(--green)';if(inp)inp.placeholder='sk-...已保存';}
  else{el.textContent='❌ 未设置';el.style.color='var(--red)';}
}
}
updateKeyStatus();

sendBtn.addEventListener('click',sendMessage);

window.clearChat=function(){
  chatBox.innerHTML='<div class="msg msg-bot"><div class="msg-avatar">🤖</div><div class="msg-content"><div>对话已清空，开始新的对话吧！</div><div class="msg-time">现在</div></div></div>';
  chatHistory=[{role:'system',content:'你是一个有用的AI助手，请用中文回答问题。回答要简洁、准确、有帮助。'}];
  hideError();
};
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
