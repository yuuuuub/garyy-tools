<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏃 中医运动养生</title>
<meta property="og:title" content="🏃 中医运动养生">
<meta property="og:description" content="中医运动养生指南，八段锦、五禽戏、易筋经等传统功法 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="中医运动养生指南，八段锦、五禽戏、易筋经等传统功法">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.detail{display:none}.detail.active{display:block}
.step{padding:10px;border-left:3px solid var(--accent);margin-bottom:8px;background:var(--bg);border-radius:0 8px 8px 0}
.step-num{font-weight:700;color:var(--accent);margin-right:8px}
.timer{font-size:2rem;font-weight:700;text-align:center;color:var(--accent);margin:16px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{padding:12px;background:var(--bg);border-radius:8px}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border)}
.log-date{color:var(--text2);font-size:.85rem}
.flex{display:flex;gap:8px}.flex-1{flex:1}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div class="ctn">
<div class="hdr">
<h1>🏃 中医运动养生</h1>
<p>传统功法，强身健体</p>
</div>

<div class="tab-bar" id="tabs">
<div class="tab active" data-tab="list">功法列表</div>
<div class="tab" data-tab="log">锻炼记录</div>
<div class="tab" data-tab="stats">统计数据</div>
</div>

<div id="view-list" class="detail active">
<div class="cd">
<h2>📋 选择功法</h2>
<div id="exercise-list"></div>
</div>
<div class="cd" id="timer-card" style="display:none">
<h2>⏱️ 计时器</h2>
<div class="timer" id="timer">00:00</div>
<div style="text-align:center">
<button onclick="startTimer()" id="timer-btn">开始计时</button>
<button class="sec" onclick="resetTimer()" style="margin-left:8px">重置</button>
</div>
</div>
<div class="cd" id="detail-card" style="display:none">
<h2 id="detail-title">功法详情</h2>
<div id="detail-content"></div>
<div style="margin-top:12px">
<button onclick="completeExercise()">✅ 完成今日练习</button>
</div>
</div>
</div>

<div id="view-log" class="detail">
<div class="cd">
<h2>📅 本周锻炼记录</h2>
<div id="weekly-log"></div>
</div>
</div>

<div id="view-stats" class="detail">
<div class="cd">
<h2>📊 统计数据</h2>
<div class="stats">
<div class="stat"><div class="stat-num" id="total-sessions">0</div><div class="stat-label">总次数</div></div>
<div class="stat"><div class="stat-num" id="total-minutes">0</div><div class="stat-label">总分钟</div></div>
<div class="stat"><div class="stat-num" id="streak-days">0</div><div class="stat-label">连续天数</div></div>
</div>
</div>
</div>
</div>

<script>
const exercises = [
  {
    name: '八段锦',
    description: '八段锦是一套独立而完整的健身功法，起源于北宋，至今有八百多年历史。古人把这套动作比喻为"锦"，意为动作舒展优美，如锦缎般优美。',
    benefits: ['调理脾胃', '强腰固肾', '疏肝理气', '强筋壮骨', '调理三焦', '改善视力'],
    duration: '15-20分钟',
    steps: [
      '两手托天理三焦：两脚平行开立，与肩同宽。两臂徐徐自左右两侧上举过头，两手十指交叉，翻掌向上，如托天状',
      '左右开弓似射雕：两脚开立，成马步。右手向右推出，左手向左推出，如拉弓射箭状',
      '调理脾胃须单举：左手翻掌向上，右手下按，交替进行',
      '五劳七伤往后瞧：两脚不动，头缓缓向左后转动，目视左后方，再向右转',
      '摇头摆尾去心火：马步扎稳，头向左前方摇，尾向右后方摆',
      '两手攀足固肾肾：两腿直立，上体前屈，两手攀握足尖',
      '攒拳怒目增气力：两拳握紧，怒目圆睁，拳向前冲出',
      '背后七颠百病消：两脚跟并拢提起，头向上顶，然后脚跟落地'
    ]
  },
  {
    name: '五禽戏',
    description: '五禽戏是由东汉末年著名医学家华佗根据中医原理创编的，模仿虎、鹿、熊、猿、鸟五种动物的神态和动作。',
    benefits: ['疏肝理气', '健脾和胃', '强心肺功能', '灵活关节', '调节情志'],
    duration: '20-30分钟',
    steps: [
      '虎戏：虎举、虎扑，模仿老虎的威猛，锻炼筋骨',
      '鹿戏：鹿抵、鹿奔，模仿鹿的轻盈，舒展筋脉',
      '熊戏：熊运、熊晃，模仿熊的沉稳，调理脾胃',
      '猿戏：猿提、猿摘，模仿猿的灵活，活动关节',
      '鸟戏：鸟伸、鸟飞，模仿鸟的展翅，调理呼吸'
    ]
  },
  {
    name: '易筋经',
    description: '易筋经相传为达摩所创，是一套通过改变肌肉、筋骨来强身健体的功法。"易"为改变，"筋"为筋骨，"经"为方法。',
    benefits: ['强筋壮骨', '疏通经络', '调和气血', '增强体质', '改善循环'],
    duration: '20-30分钟',
    steps: [
      '韦驮献杵第一势：立身正直，两脚并拢，两手合掌当胸',
      '横胆降魔杵第二势：两脚开立，两手从两侧平举至肩高',
      '摘星换斗第三势：左手高举，右手背于腰后，头目上视',
      '出爪亮翅第四势：两手向前推出，掌心向前，指尖向上',
      '九鬼拔马刀第五势：两手交替抱头后，做拔刀状',
      '三盘落地第六势：马步下蹲，两手如按物状',
      '青龙探爪第七势：左手向左探出，如龙探爪',
      '卧虎扑食第八势：两手前伸扑地，如虎扑食',
      '打躬势第九势：上体前屈，两手抱头后',
      '工尾势第十势：两手着地，臀部高举，如牛摆尾'
    ]
  },
  {
    name: '六字诀',
    description: '六字诀是通过嘘、呵、呼、呬、吹、嘻六个字的发音来调理脏腑的养生功法。每个字对应一个脏腑。',
    benefits: ['调理脏腑', '平衡阴阳', '疏通经络', '调和气血', '增强免疫'],
    duration: '15-20分钟',
    steps: [
      '嘘字诀：发音"嘘"(xū)，两唇微合，有横绷之力，舌尖向前，肝属木',
      '呵字诀：发音"呵"(hē)，口半张，舌抵下腭，心属火',
      '呼字诀：发音"呼"(hū)，撮口如管状，舌向上微卷，脾属土',
      '呬字诀：发音"呬"(sī)，上下齿对合，舌体稍前伸，肺属金',
      '吹字诀：发音"吹"(chuī)，嘴角后引，舌体前伸，肾属水',
      '嘻字诀：发音"嘻"(xī)，嘴角后引，舌体后缩，三焦属火'
    ]
  },
  {
    name: '太极养生功',
    description: '太极拳是中华武术的瑰宝，融合了阴阳哲学、中医经络学说和导引术，是一种内外兼修的养生功法。',
    benefits: ['调和阴阳', '疏通经络', '强身健体', '调节情志', '延年益寿'],
    duration: '30-60分钟',
    steps: [
      '起势：两脚开立，与肩同宽，两臂慢慢前举至肩高',
      '左右野马分鬃：上体微右转，右手在胸前，左手向左下方划弧',
      '白鹤亮翅：上体后坐，重心后移，两手上下分开',
      '左右搂膝拗步：一手搂膝，一手推出，交替进行',
      '手挥琵琶：两手如抱琵琶状，重心后移',
      '左右倒卷肱：两手交替向后划弧，如卷物状',
      '收势：两臂慢慢下落，两脚并拢'
    ]
  },
  {
    name: '站桩功',
    description: '站桩功是太极拳的基本功，通过保持特定姿势来培养内气、增强下肢力量和身体稳定性。',
    benefits: ['培养内气', '增强下肢', '稳定身心', '疏通经络', '调和气血'],
    duration: '10-30分钟',
    steps: [
      '预备式：两脚平行站立，与肩同宽，全身放松',
      '起式：两臂缓缓前举至肩高，掌心向下',
      '浑圆桩：两臂环抱于胸前，如抱球状，膝盖微曲',
      '撑抱桩：两臂向前撑出，如推物状，掌心向前',
      '收功：两臂慢慢下落，深呼吸三次'
    ]
  }
];

let currentExercise = null;
let timerInterval = null;
let timerSeconds = 0;
let isTimerRunning = false;

function loadData() {
  const data = localStorage.getItem('exercise-data');
  return data ? JSON.parse(data) : { logs: [], completed: [] };
}

function saveData(data) {
  localStorage.setItem('exercise-data', JSON.stringify(data));
}

function renderExerciseList() {
  const container = document.getElementById('exercise-list');
  container.innerHTML = exercises.map((ex, i) => `
    <div class="li" onclick="showDetail(${i})">
      <div><strong>${ex.name}</strong><br><span style="color:var(--text2);font-size:.85rem">${ex.duration}</span></div>
      <span class="tag s">${ex.benefits.length}种功效</span>
    </div>
  `).join('');
}

function showDetail(index) {
  currentExercise = index;
  const ex = exercises[index];
  const card = document.getElementById('detail-card');
  const timerCard = document.getElementById('timer-card');
  card.style.display = 'block';
  timerCard.style.display = 'block';
  document.getElementById('detail-title').textContent = ex.name;
  document.getElementById('detail-content').innerHTML = `
    <p style="margin-bottom:12px;color:var(--text2)">${ex.description}</p>
    <div style="margin-bottom:12px">
      <strong>功效：</strong>
      ${ex.benefits.map(b => `<span class="tag s" style="margin:2px">${b}</span>`).join('')}
    </div>
    <div style="margin-bottom:12px">
      <strong>建议时长：</strong>${ex.duration}
    </div>
    <div>
      <strong>动作步骤：</strong>
      ${ex.steps.map((s, i) => `<div class="step"><span class="step-num">${i + 1}.</span>${s}</div>`).join('')}
    </div>
  `;
}

function startTimer() {
  const btn = document.getElementById('timer-btn');
  if (isTimerRunning) {
    clearInterval(timerInterval);
    btn.textContent = '继续计时';
    isTimerRunning = false;
  } else {
    timerInterval = setInterval(() => {
      timerSeconds++;
      updateTimerDisplay();
    }, 1000);
    btn.textContent = '暂停';
    isTimerRunning = true;
  }
}

function resetTimer() {
  clearInterval(timerInterval);
  timerSeconds = 0;
  isTimerRunning = false;
  document.getElementById('timer-btn').textContent = '开始计时';
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
  const secs = (timerSeconds % 60).toString().padStart(2, '0');
  document.getElementById('timer').textContent = `${mins}:${secs}`;
}

function completeExercise() {
  if (currentExercise === null) return;
  const data = loadData();
  const today = new Date().toISOString().split('T')[0];
  data.logs.push({
    date: today,
    exercise: exercises[currentExercise].name,
    duration: timerSeconds,
    timestamp: Date.now()
  });
  saveData(data);
  alert(`✅ 已记录今日练习：${exercises[currentExercise].name}，${Math.floor(timerSeconds / 60)}分钟`);
  resetTimer();
  renderStats();
}

function renderWeeklyLog() {
  const data = loadData();
  const container = document.getElementById('weekly-log');
  const now = new Date();
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - now.getDay());
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);
  
  const weekLogs = data.logs.filter(log => {
    const logDate = new Date(log.date);
    return logDate >= weekStart && logDate <= weekEnd;
  });
  
  if (weekLogs.length === 0) {
    container.innerHTML = '<div class="empty">本周暂无锻炼记录</div>';
    return;
  }
  
  container.innerHTML = weekLogs.map(log => `
    <div class="log-item">
      <div>
        <strong>${log.exercise}</strong><br>
        <span class="log-date">${log.date} · ${Math.floor(log.duration / 60)}分钟</span>
      </div>
      <span class="tag s">已完成</span>
    </div>
  `).join('');
}

function renderStats() {
  const data = loadData();
  document.getElementById('total-sessions').textContent = data.logs.length;
  const totalMinutes = data.logs.reduce((sum, log) => sum + log.duration, 0);
  document.getElementById('total-minutes').textContent = Math.floor(totalMinutes / 60);
  
  const dates = [...new Set(data.logs.map(log => log.date))].sort().reverse();
  let streak = 0;
  const today = new Date().toISOString().split('T')[0];
  let checkDate = new Date(today);
  
  while (true) {
    const dateStr = checkDate.toISOString().split('T')[0];
    if (dates.includes(dateStr)) {
      streak++;
      checkDate.setDate(checkDate.getDate() - 1);
    } else {
      break;
    }
  }
  document.getElementById('streak-days').textContent = streak;
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'log') renderWeeklyLog();
    if (tab.dataset.tab === 'stats') renderStats();
  });
});

renderExerciseList();
</script>
</body>
</html>
