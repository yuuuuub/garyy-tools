<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进度动画工具</title>
<meta name="description" content="进度动画工具，创建精美的进度条和环形进度动画">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
<meta name="robots" content="index, follow">
<script src="../i18n.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--pink:#ec4899;--cyan:#06b6d4;--orange:#f97316;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--green:#1a7f37;--red:#cf222e;--shadow:0 4px 24px rgba(0,0,0,.1)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.progress-bar{width:100%;height:12px;background:var(--border);border-radius:6px;overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:6px;transition:width 1.2s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.progress-fill::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer 2s infinite}
.progress-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:.85rem}
.progress-stripe{background-image:linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);background-size:20px 20px;animation:stripeMove 1s linear infinite}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{left:-100%}100%{left:200%}}
@keyframes stripeMove{0%{background-position:0 0}100%{background-position:20px 0}}
@keyframes bounce{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.5)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px currentColor)}50%{filter:drop-shadow(0 0 10px currentColor)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.grid-2,.grid-3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='⏳ 进度动画工具';
const $=id=>document.getElementById(id);
const APP=$('app');
const COLORS=['#3b82f6','#3fb950','#f85149','#d29922','#a855f7','#ec4899','#06b6d4','#f97316'];

let items=[
  {label:'项目规划',value:100,color:COLORS[1],style:'default'},
  {label:'UI设计',value:85,color:COLORS[0],style:'stripe'},
  {label:'前端开发',value:72,color:COLORS[4],style:'default'},
  {label:'后端开发',value:60,color:COLORS[3],style:'stripe'},
  {label:'测试',value:35,color:COLORS[2],style:'default'},
  {label:'部署上线',value:10,color:COLORS[5],style:'default'}
];

let ringItems=[
  {label:'CPU使用率',value:68,color:COLORS[0],size:120},
  {label:'内存使用',value:52,color:COLORS[1],size:120},
  {label:'磁盘空间',value:78,color:COLORS[3],size:120},
  {label:'网络带宽',value:45,color:COLORS[4],size:120}
];

let semicircleItems=[
  {label:'下载进度',value:82,color:COLORS[0]},
  {label:'上传进度',value:45,color:COLORS[1]},
  {label:'编译进度',value:95,color:COLORS[2]}
];

let curTab='linear';

function render(){
  let h=`<h1>⏳ 进度动画工具</h1><p class="subtitle">多种进度条动画效果</p>`;
  h+=`<div class="card"><div class="flex-between"><div class="flex">`;
  ['linear','ring','semicircle','steps','wave'].forEach(t=>{
    const names={linear:'📏 线性',ring:'⭕ 环形',semicircle:'🌙 半圆',steps:'📋 步骤',wave:'🌊 波浪'};
    h+=`<button class="btn btn-sm" style="background:${curTab===t?'var(--accent)':'var(--border)'}" onclick="curTab='${t}';render()">${names[t]}</button>`;
  });
  h+=`</div><div class="flex"><button class="btn btn-sm btn-green" onclick="randomize()">🎲 随机</button><button class="btn btn-sm btn-red" onclick="resetAll()">↺ 重置</button></div></div></div>`;

  if(curTab==='linear') h+=renderLinear();
  else if(curTab==='ring') h+=renderRing();
  else if(curTab==='semicircle') h+=renderSemicircle();
  else if(curTab==='steps') h+=renderSteps();
  else if(curTab==='wave') h+=renderWave();

  h+=`<div class="card"><h3 style="margin-bottom:12px">⚙️ 配置</h3>`;
  if(curTab==='linear'){
    items.forEach((item,i)=>{
      h+=`<div style="margin-bottom:12px"><div class="flex-between" style="margin-bottom:4px"><label style="margin:0">${item.label}</label><span style="font-size:.85rem;color:${item.color};font-weight:700">${item.value}%</span></div>`;
      h+=`<input type="range" min="0" max="100" value="${item.value}" style="margin:0" oninput="items[${i}].value=parseInt(this.value);render()"></div>`;
    });
  } else if(curTab==='ring'){
    ringItems.forEach((item,i)=>{
      h+=`<div style="margin-bottom:12px"><div class="flex-between" style="margin-bottom:4px"><label style="margin:0">${item.label}</label><span style="font-size:.85rem;color:${item.color};font-weight:700">${item.value}%</span></div>`;
      h+=`<input type="range" min="0" max="100" value="${item.value}" style="margin:0" oninput="ringItems[${i}].value=parseInt(this.value);render()"></div>`;
    });
  }
  h+=`</div>`;
  APP.innerHTML=h;
}

function renderLinear(){
  let h=`<div class="card"><h3 style="margin-bottom:16px">线性进度条</h3>`;
  items.forEach((item,i)=>{
    h+=`<div style="margin-bottom:16px;animation:fadeIn .5s ease-out forwards;opacity:0" data-delay="${i*0.1}">`;
    h+=`<div class="progress-label"><span style="font-weight:600">${item.label}</span><span style="color:${item.color};font-weight:700">${item.value}%</span></div>`;
    h+=`<div class="progress-bar"><div class="progress-fill ${item.style==='stripe'?'progress-stripe':''}" style="width:0%;background:${item.color}" data-width="${item.value}"></div></div>`;
    h+=`</div>`;
  });
  h+=`</div>`;

  h+=`<div class="grid grid-2">`;
  h+=`<div class="card"><h3 style="margin-bottom:16px">带标签进度条</h3>`;
  items.slice(0,4).forEach((item,i)=>{
    h+=`<div style="margin-bottom:14px"><div class="progress-bar" style="height:24px;border-radius:12px"><div class="progress-fill" style="width:0%;background:${item.color};border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75rem;font-weight:600;min-width:${item.value>5?'auto':'0'}" data-width="${item.value}" data-label="${item.value}%">${item.value>10?item.value+'%':''}</div></div></div>`;
  });
  h+=`</div>`;

  h+=`<div class="card"><h3 style="margin-bottom:16px">嵌套进度条</h3>`;
  h+=`<div style="margin-bottom:12px"><div style="font-size:.85rem;margin-bottom:6px;color:var(--text2)">总进度</div>`;
  h+=`<div class="progress-bar" style="height:20px;border-radius:10px"><div class="progress-fill" style="width:0%;background:linear-gradient(90deg,#3b82f6,#a855f7);border-radius:10px" data-width="${Math.round(items.reduce((a,b)=>a+b.value,0)/items.length)}"></div></div></div>`;
  items.forEach((item,i)=>{
    h+=`<div style="margin-bottom:8px;padding-left:12px;border-left:3px solid ${item.color}"><div style="font-size:.8rem;color:var(--text2)">${item.label}</div>`;
    h+=`<div class="progress-bar" style="height:6px;border-radius:3px"><div class="progress-fill" style="width:0%;background:${item.color};border-radius:3px" data-width="${item.value}"></div></div></div>`;
  });
  h+=`</div></div>`;
  return h;
}

function renderRing(){
  let h=`<div class="card"><h3 style="margin-bottom:16px">环形进度条</h3>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px">`;
  ringItems.forEach((item,i)=>{
    const r=50,cx=60,cy=60;
    const circ=2*Math.PI*r;
    const dashoffset=circ*(1-item.value/100);
    h+=`<div style="text-align:center;animation:fadeIn .5s ease-out forwards;opacity:0" data-delay="${i*0.15}">`;
    h+=`<svg viewBox="0 0 120 120" style="width:120px;height:120px">`;
    h+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="8" opacity=".3"/>`;
    h+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${item.color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)" data-offset="${dashoffset}"/>`;
    h+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="var(--text)" font-size="18" font-weight="700">${item.value}%</text>`;
    h+=`<text x="${cx}" y="${cy+12}" text-anchor="middle" fill="var(--text2)" font-size="8">${item.label}</text>`;
    h+=`</svg></div>`;
  });
  h+=`</div></div>`;

  h+=`<div class="card"><h3 style="margin-bottom:16px">多层环形图</h3>`;
  h+=`<div style="text-align:center"><svg viewBox="0 0 200 200" style="width:200px;height:200px">`;
  const layers=[{r:80,color:COLORS[0],value:85},{r:65,color:COLORS[1],value:72},{r:50,color:COLORS[4],value:60}];
  layers.forEach((l,i)=>{
    const circ=2*Math.PI*l.r;
    const dashoffset=circ*(1-l.value/100);
    h+=`<circle cx="100" cy="100" r="${l.r}" fill="none" stroke="var(--border)" stroke-width="10" opacity=".2"/>`;
    h+=`<circle cx="100" cy="100" r="${l.r}" fill="none" stroke="${l.color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" transform="rotate(-90 100 100)" style="transition:stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)" data-offset="${dashoffset}"/>`;
  });
  h+=`<text x="100" y="96" text-anchor="middle" fill="var(--text)" font-size="22" font-weight="700">72%</text>`;
  h+=`<text x="100" y="112" text-anchor="middle" fill="var(--text2)" font-size="10">综合评分</text>`;
  h+=`</svg></div></div>`;
  return h;
}

function renderSemicircle(){
  let h=`<div class="card"><h3 style="margin-bottom:16px">半圆进度条</h3>`;
  h+=`<div style="display:flex;justify-content:center;gap:30px;flex-wrap:wrap">`;
  semicircleItems.forEach((item,i)=>{
    const r=70,cx=80,cy=80;
    const circ=Math.PI*r;
    const dashoffset=circ*(1-item.value/100);
    h+=`<div style="text-align:center;animation:fadeIn .5s ease-out forwards;opacity:0" data-delay="${i*0.2}">`;
    h+=`<svg viewBox="0 0 160 100" style="width:160px;height:100px">`;
    h+=`<path d="M${cx-r},${cy} A${r},${r} 0 0,1 ${cx+r},${cy}" fill="none" stroke="var(--border)" stroke-width="12" stroke-linecap="round" opacity=".3"/>`;
    h+=`<path d="M${cx-r},${cy} A${r},${r} 0 0,1 ${cx+r},${cy}" fill="none" stroke="${item.color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="transition:stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)" data-offset="${dashoffset}"/>`;
    h+=`<text x="${cx}" y="${cy-10}" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="700">${item.value}%</text>`;
    h+=`<text x="${cx}" y="${cy+4}" text-anchor="middle" fill="var(--text2)" font-size="10">${item.label}</text>`;
    h+=`</svg></div>`;
  });
  h+=`</div></div>`;
  return h;
}

function renderSteps(){
  const steps=['需求分析','设计','开发','测试','部署','完成'];
  const currentStep=3;
  let h=`<div class="card"><h3 style="margin-bottom:16px">步骤进度</h3>`;
  h+=`<div style="display:flex;justify-content:space-between;position:relative;padding:0 20px">`;
  h+=`<div style="position:absolute;top:20px;left:40px;right:40px;height:3px;background:var(--border)"></div>`;
  h+=`<div style="position:absolute;top:20px;left:40px;width:0;height:3px;background:var(--accent);transition:width 1s ease" data-step-width="${currentStep/(steps.length-1)*100}"></div>`;
  steps.forEach((step,i)=>{
    const done=i<currentStep;
    const active=i===currentStep;
    h+=`<div style="text-align:center;position:relative;z-index:1;animation:fadeIn .3s ease-out forwards;opacity:0" data-delay="${i*0.15}">`;
    h+=`<div style="width:40px;height:40px;border-radius:50%;background:${done?'var(--accent)':active?'var(--accent)':'var(--border)'};display:flex;align-items:center;justify-content:center;margin:0 auto;color:${done||active?'#fff':'var(--text2)'};font-weight:700;font-size:.9rem;${active?'box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent);animation:glow 2s infinite':''}">${done?'✓':i+1}</div>`;
    h+=`<div style="font-size:.75rem;color:${done||active?'var(--text)':'var(--text2)'};margin-top:8px;font-weight:${active?'600':'400'}">${step}</div>`;
    h+=`</div>`;
  });
  h+=`</div></div>`;

  h+=`<div class="card"><h3 style="margin-bottom:16px">垂直步骤</h3>`;
  steps.forEach((step,i)=>{
    const done=i<currentStep;
    const active=i===currentStep;
    h+=`<div style="display:flex;gap:16px;${i<steps.length-1?'padding-bottom:20px':''}">`;
    h+=`<div style="display:flex;flex-direction:column;align-items:center">`;
    h+=`<div style="width:32px;height:32px;border-radius:50%;background:${done?'var(--accent)':active?'var(--accent)':'var(--border)'};display:flex;align-items:center;justify-content:center;color:${done||active?'#fff':'var(--text2)'};font-size:.8rem;font-weight:700;flex-shrink:0">${done?'✓':i+1}</div>`;
    if(i<steps.length-1) h+=`<div style="width:2px;flex:1;background:${done?'var(--accent)':'var(--border)'};margin-top:4px"></div>`;
    h+=`</div>`;
    h+=`<div style="padding-top:4px"><div style="font-weight:600;font-size:.95rem;color:${done||active?'var(--text)':'var(--text2)'}">${step}</div>`;
    h+=`<div style="font-size:.8rem;color:var(--text2);margin-top:2px">${done?'已完成':active?'进行中':'待开始'}</div></div></div>`;
  });
  h+=`</div>`;
  return h;
}

function renderWave(){
  let h=`<div class="card"><h3 style="margin-bottom:16px">波浪进度条</h3>`;
  [75,50,30].forEach((val,i)=>{
    const colors=[COLORS[0],COLORS[1],COLORS[4]];
    h+=`<div style="margin-bottom:20px;display:flex;align-items:center;gap:16px">`;
    h+=`<div style="width:60px;height:60px;border-radius:50%;background:${colors[i]}22;border:3px solid ${colors[i]};position:relative;overflow:hidden;flex-shrink:0">`;
    h+=`<div style="position:absolute;bottom:0;left:-50%;width:200%;background:${colors[i]};opacity:.6;animation:wave ${2+i*0.5}s ease-in-out infinite" data-wave-height="${val}%"></div>`;
    h+=`<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:700;font-size:1rem;z-index:1">${val}%</div></div>`;
    h+=`<div style="flex:1"><div class="progress-bar" style="height:20px;border-radius:10px;overflow:hidden;position:relative">`;
    h+=`<div class="progress-fill" style="width:0%;background:${colors[i]};border-radius:10px;position:relative;overflow:hidden" data-width="${val}">`;
    h+=`<div style="position:absolute;top:0;left:-100%;width:200%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);animation:shimmer 2s infinite"></div></div></div></div></div>`;
  });
  h+=`</div>`;
  return h;
}

function animateAll(){
  document.querySelectorAll('[data-delay]').forEach(el=>{
    setTimeout(()=>{el.style.opacity='1';},parseFloat(el.dataset.delay)*1000);
  });
  document.querySelectorAll('.progress-fill[data-width]').forEach((el,i)=>{
    setTimeout(()=>{el.style.width=el.dataset.width+'%';},i*100+200);
  });
  document.querySelectorAll('[data-offset]').forEach(el=>{
    setTimeout(()=>{el.style.strokeDashoffset=el.dataset.offset;},400);
  });
  document.querySelectorAll('[data-step-width]').forEach(el=>{
    setTimeout(()=>{el.style.width=el.dataset.stepWidth+'%';},500);
  });
  document.querySelectorAll('[data-wave-height]').forEach(el=>{
    el.parentElement.style.height=el.dataset.waveHeight;
  });
}

function randomize(){
  items.forEach(item=>{item.value=Math.floor(Math.random()*100);});
  ringItems.forEach(item=>{item.value=Math.floor(Math.random()*100);});
  semicircleItems.forEach(item=>{item.value=Math.floor(Math.random()*100);});
  render();
}
function resetAll(){
  items=[{label:'项目规划',value:100,color:COLORS[1],style:'default'},{label:'UI设计',value:85,color:COLORS[0],style:'stripe'},{label:'前端开发',value:72,color:COLORS[4],style:'default'},{label:'后端开发',value:60,color:COLORS[3],style:'stripe'},{label:'测试',value:35,color:COLORS[2],style:'default'},{label:'部署上线',value:10,color:COLORS[5],style:'default'}];
  ringItems=[{label:'CPU使用率',value:68,color:COLORS[0],size:120},{label:'内存使用',value:52,color:COLORS[1],size:120},{label:'磁盘空间',value:78,color:COLORS[3],size:120},{label:'网络带宽',value:45,color:COLORS[4],size:120}];
  semicircleItems=[{label:'下载进度',value:82,color:COLORS[0]},{label:'上传进度',value:45,color:COLORS[1]},{label:'编译进度',value:95,color:COLORS[2]}];
  render();
}
render();
setTimeout(animateAll,100);
</script>
</body>
</html>
