// ===== 初始化 =====
const editor = document.getElementById('svgEditor');
const previewWrap = document.getElementById('previewWrap');
const previewContainer = document.getElementById('previewContainer');
const errorBar = document.getElementById('errorBar');
const errorMsg = document.getElementById('errorMsg');
const statusDot = document.getElementById('statusDot');
const zoomIndicator = document.getElementById('zoomIndicator');
const cursorPosEl = document.getElementById('cursorPos');
const svgSizeInfo = document.getElementById('svgSizeInfo');

editor.value = DEFAULT_SVG;
updatePreview();

// ===== 预览更新 =====
function handleEditorInput() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(updatePreview, DEBOUNCE_MS);
  updateCursorPos();
}

function updatePreview() {
  const code = editor.value.trim();
  if (!code) {
    previewContainer.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px;">等待输入 SVG 代码...</div>';
    hideError();
    updateStatus('ok');
    svgSizeInfo.textContent = '';
    return;
  }

  // 验证 SVG
  const parser = new DOMParser();
  const doc = parser.parseFromString(code, 'image/svg+xml');
  const parseError = doc.querySelector('parsererror');

  if (parseError) {
    const errText = parseError.textContent.replace(/\s+/g, ' ').trim();
    showError('SVG 解析错误：' + errText.substring(0, 200));
    updateStatus('err');
    // 仍然尝试渲染到预览
    tryRender(code);
    return;
  }

  hideError();
  updateStatus('ok');
  tryRender(code);
}

function tryRender(code) {
  let finalCode = code;

  // Minify 模式
  if (minifyMode) {
    finalCode = minifySVG(code);
  }

  // 注入缩放样式
  if (zoomLevel !== 1) {
    finalCode = finalCode.replace(
      /<svg\b/i,
      `<svg style="transform:scale(${zoomLevel});transform-origin:top left;" `
    );
  }

  // 使用 blob URL 渲染避免 XSS 同时保证独立渲染
  const blob = new Blob([finalCode], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);

  previewContainer.innerHTML = `<img src="${url}" class="preview-svg" alt="SVG Preview" style="max-width:${100*zoomLevel}%;max-height:${100*zoomLevel}%;" / loading="lazy">`;

  // 更新尺寸信息
  const svgMatch = code.match(/<svg[^>]*>/i);
  if (svgMatch) {
    const w = (svgMatch[0].match(/width="([^"]+)"/) || [])[1] || '-';
    const h = (svgMatch[0].match(/height="([^"]+)"/) || [])[1] || '-';
    svgSizeInfo.textContent = w + ' x ' + h;
  }

  // Cleanup
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ===== 错误显示 =====
function showError(msg) {
  errorMsg.textContent = msg;
  errorBar.classList.add('show');
}

function hideError() {
  errorBar.classList.remove('show');
}

function updateStatus(status) {
  statusDot.className = 'panel-indicator ' + (status === 'ok' ? 'indicator-ok' : 'indicator-err');
}

// ===== 光标位置 =====
function updateCursorPos() {
  const pos = editor.selectionStart;
  const textBefore = editor.value.substring(0, pos);
  const lines = textBefore.split('\n');
  const line = lines.length;
  const col = lines[lines.length - 1].length + 1;
  cursorPosEl.textContent = '行 ' + line + ', 列 ' + col;
}

function handleKeyDown(e) {
  // Tab 键插入空格
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const val = editor.value;
    editor.value = val.substring(0, start) + '  ' + val.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    handleEditorInput();
  }
}

function syncScroll() {
  // 编辑器滚动同步（placeholder for line numbers if implemented）
}

// ===== 插入图形 =====
function insertShape(type) {
  let snippet = '';
  const indent = getCurrentIndent();

  switch (type) {
    case 'rect':
      snippet = `<rect x="10" y="10" width="100" height="60" rx="4" fill="#58a6ff" stroke="#79c0ff" stroke-width="2"/>`;
      break;
    case 'circle':
      snippet = `<circle cx="50" cy="50" r="40" fill="#58a6ff" stroke="#79c0ff" stroke-width="2"/>`;
      break;
    case 'ellipse':
      snippet = `<ellipse cx="60" cy="40" rx="50" ry="30" fill="#58a6ff" stroke="#79c0ff" stroke-width="2"/>`;
      break;
    case 'line':
      snippet = `<line x1="10" y1="10" x2="100" y2="80" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>`;
      break;
    case 'polygon':
      snippet = `<polygon points="50,10 90,80 10,80" fill="#58a6ff" stroke="#79c0ff" stroke-width="2"/>`;
      break;
    case 'polyline':
      snippet = `<polyline points="10,80 30,20 50,60 70,10 90,50" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>`;
      break;
    case 'path':
      snippet = `<path d="M 10 80 C 40 10, 65 10, 95 80 S 150 150, 180 80" fill="none" stroke="#ffffff" stroke-width="2"/>`;
      break;
    case 'text':
      snippet = `<text x="10" y="50" font-family="Arial" font-size="24" fill="#ffffff" font-weight="bold">Hello SVG</text>`;
      break;
  }

  if (snippet) {
    insertAtCursor(snippet);
  }
}

function getCurrentIndent() {
  const start = editor.selectionStart;
  const textBefore = editor.value.substring(0, start);
  const lastNewline = textBefore.lastIndexOf('\n');
  if (lastNewline >= 0) {
    const currentLine = textBefore.substring(lastNewline + 1);
    const match = currentLine.match(/^(\s*)/);
    return match ? match[1] : '';
  }
  return '';
}

function insertAtCursor(text) {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const val = editor.value;
  const newline = (start > 0 && val[start - 1] !== '\n') ? '\n' : '';
  const indent = getCurrentIndent();
  editor.value = val.substring(0, start) + newline + indent + text + val.substring(end);
  editor.selectionStart = editor.selectionEnd = start + newline.length + indent.length + text.length;
  editor.focus();
  handleEditorInput();
}

// ===== 属性应用 =====
function applyAttribute(attr, value) {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const selectedText = editor.value.substring(start, end);

  if (selectedText) {
    // 在选中文本所在标签上添加/修改属性
    const before = editor.value.substring(0, start);
    const after = editor.value.substring(end);

    // 查找选中文本所在的标签
    const tagStart = before.lastIndexOf('<');
    const tagEnd = after.indexOf('>');
    if (tagStart >= 0 && tagEnd >= 0) {
      const fullTag = before.substring(tagStart) + selectedText + after.substring(0, tagEnd + 1);
      const attrRegex = new RegExp(`\\b${attr}="[^"]*"`, 'i');

      let newTag;
      if (attrRegex.test(fullTag)) {
        newTag = fullTag.replace(attrRegex, `${attr}="${value}"`);
      } else {
        const insertPos = fullTag.indexOf(' ');
        if (insertPos > 0) {
          newTag = fullTag.substring(0, insertPos) + ` ${attr}="${value}"` + fullTag.substring(insertPos);
        } else {
          const bracketEnd = fullTag.indexOf('>');
          newTag = fullTag.substring(0, bracketEnd) + ` ${attr}="${value}"` + fullTag.substring(bracketEnd);
        }
      }

      editor.value = before.substring(0, tagStart) + newTag + after.substring(tagEnd + 1);
    }
  } else {
    // 没有选中文本，在整个 SVG 中应用（添加到光标位置提示）
    showToast('请先选中一个图形元素，再调整属性');
  }

  editor.focus();
  handleEditorInput();
}

// ===== 画布控制 =====
function updateViewBox() {
  const w = document.getElementById('svgWidth').value || 400;
  const h = document.getElementById('svgHeight').value || 300;
  let code = editor.value;
  code = code.replace(
    /(<svg[^>]*?)\s+(width|viewBox)="[^"]*"(?:\s+(height)="[^"]*")?/i,
    `$1 viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"`
  );
  if (!/viewBox/i.test(code)) {
    code = code.replace(/<svg\b/i, `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"`);
  }
  editor.value = code;
  handleEditorInput();
}

function zoomIn() {
  zoomLevel = Math.min(5, zoomLevel + 0.25);
  zoomLevel = Math.round(zoomLevel * 100) / 100;
  zoomIndicator.textContent = Math.round(zoomLevel * 100) + '%';
  updatePreview();
}

function zoomOut() {
  zoomLevel = Math.max(0.1, zoomLevel - 0.25);
  zoomLevel = Math.round(zoomLevel * 100) / 100;
  zoomIndicator.textContent = Math.round(zoomLevel * 100) + '%';
  updatePreview();
}

function zoomReset() {
  zoomLevel = 1;
  zoomIndicator.textContent = '100%';
  updatePreview();
}

function toggleGrid() {
  showGrid = !showGrid;
  if (showGrid) {
    previewWrap.classList.remove('no-grid');
    document.getElementById('gridToggle').textContent = '⊞ 网格';
  } else {
    previewWrap.classList.add('no-grid');
    document.getElementById('gridToggle').textContent = '⊞ 网格(关)';
  }
}

// ===== 输出 =====
function copySVG() {
  const code = minifyMode ? minifySVG(editor.value) : editor.value;
  navigator.clipboard.writeText(code).then(() => {
    showToast('✅ SVG 代码已复制到剪贴板');
  }).catch(() => {
    // Fallback
    editor.select();
    document.execCommand('copy');
    showToast('✅ SVG 代码已复制到剪贴板');
  });
}

function downloadSVG() {
  const code = minifyMode ? minifySVG(editor.value) : editor.value;
  const blob = new Blob([code], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'svg-editor-export.svg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('⬇ SVG 文件下载中...');
}

function minifyToggle() {
  minifyMode = !minifyMode;
  const btn = document.getElementById('minifyBtn');
  if (minifyMode) {
    btn.textContent = '🗜 压缩(开)';
    btn.style.background = 'var(--btn-active)';
  } else {
    btn.textContent = '🗜 压缩';
    btn.style.background = '';
  }
  updatePreview();
}

function minifySVG(code) {
  return code
    .replace(//g, '')
    .replace(/>\s+</g, '><')
    .replace(/\s+/g, ' ')
    .replace(/>\s/g, '>')
    .replace(/\s</g, '<')
    .trim();
}

function formatSVG() {
  try {
    let code = editor.value;
    // 简单格式化：在 >< 之间插入换行，保持缩进
    code = code
      .replace(//g, '')
      .replace(/>\s*</g, '>\n<');

    let indent = 0;
    const lines = code.split('\n');
    const formatted = lines.map(line => {
      line = line.trim();
      if (!line) return '';

      // 检查是否是闭合标签或自闭合标签
      const isClosing = /^<\/\w/.test(line);
      const isSelfClosing = /\/>$/.test(line);

      if (isClosing) {
        indent = Math.max(0, indent - 1);
      }

      const result = '  '.repeat(indent) + line;

      // 检查是否是开始标签（非自闭合）
      const tagMatch = line.match(/^<(\w+)[^>]*$/);
      if (tagMatch && !isSelfClosing && !isClosing) {
        const tagName = tagMatch[1];
        if (!['animate', 'set', 'animateMotion', 'animateTransform', 'stop', 'feOffset',
              'feBlend', 'feColorMatrix', 'feComponentTransfer', 'feComposite', 'feConvolveMatrix',
              'feDiffuseLighting', 'feDisplacementMap', 'feFlood', 'feGaussianBlur', 'feImage',
              'feMerge', 'feMorphology', 'feSpecularLighting', 'feTile', 'feTurbulence',
              'feDistantLight', 'fePointLight', 'feSpotLight', 'feFuncR', 'feFuncG', 'feFuncB', 'feFuncA']
              .includes(tagName)) {
          indent++;
        }
      }

      return result;
    });

    editor.value = formatted.filter(l => l !== undefined).join('\n');
    handleEditorInput();
    showToast('✨ SVG 代码已格式化');
  } catch (e) {
    showToast('⚠️ 格式化失败：' + e.message);
  }
}

// ===== 加载示例 =====
function loadSample(name) {
  if (SAMPLES[name]) {
    editor.value = SAMPLES[name];
    // 从示例中提取宽高
    const match = SAMPLES[name].match(/viewBox="0 0 (\d+) (\d+)"/);
    if (match) {
      document.getElementById('svgWidth').value = match[1];
      document.getElementById('svgHeight').value = match[2];
    }
    zoomReset();
    updatePreview();
    showToast('📦 已加载示例：' + name);
  }
}

// ===== Toast =====
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}

// ===== 移动端标签切换 =====
function switchTab(tab) {
  const editorPanel = document.getElementById('editorPanel');
  const previewPanel = document.getElementById('previewPanel');
  const tabs = document.querySelectorAll('.mobile-tab');

  tabs.forEach(t => t.classList.remove('active'));

  if (tab === 'editor') {
    editorPanel.classList.remove('hidden');
    previewPanel.classList.remove('active');
    tabs[0].classList.add('active');
  } else {
    editorPanel.classList.add('hidden');
    previewPanel.classList.add('active');
    previewPanel.style.display = 'flex';
    tabs[1].classList.add('active');
    updatePreview();
  }
}

// ===== 键盘快捷键 =====
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    downloadSVG();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
    e.preventDefault();
    formatSVG();
  }
});

// ===== 编辑器点击更新光标 =====
editor.addEventListener('click', updateCursorPos);
editor.addEventListener('keyup', updateCursorPos);

// ===== 初始加载 =====
document.getElementById('svgWidth').value = '400';
document.getElementById('svgHeight').value = '300';
updatePreview();
updateCursorPos();
