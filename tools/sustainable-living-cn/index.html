<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可持续生活指南 | Sustainable Living CN</title>
<meta name="description" content="可持续生活方式指南，践行环保理念">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<meta name="robots" content="index, follow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--input:#242836;--text:#e2e4e9;--text2:#8b8fa3;--green:#22c55e;--green2:#16a34a;--blue:#3b82f6;--purple:#8b5cf6;--warn:#f59e0b;--border:#2a2e3a;--radius:12px;--radius-sm:8px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--input:#f0f2f5;--text:#1f2328;--text2:#656d76;--green:#1a7f37;--blue:#0969da;--purple:#8250df;--warn:#bf8700;--border:#d0d7de}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;line-height:1.6;padding:20px}
.container{max-width:860px;margin:0 auto;padding:0 12px}
header{text-align:center;padding:40px 0 24px}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#22c55e,#10b981,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{color:var(--text2);font-size:.95rem}
.score-box{text-align:center;padding:30px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:24px}
.score-num{font-size:4rem;font-weight:800;background:linear-gradient(135deg,#22c55e,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.score-label{color:var(--text2);font-size:1rem;margin-top:8px}
.score-bar{width:100%;height:10px;background:#1e2230;border-radius:5px;overflow:hidden;margin-top:12px}
.score-fill{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e);border-radius:5px;transition:width .6s ease}
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.section h2{font-size:1.1rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.checklist{display:flex;flex-direction:column;gap:10px}
.check-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--input);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;border:2px solid transparent}
.check-item:hover{border-color:var(--green)}
.check-item.done{border-color:var(--green);background:rgba(34,197,94,.05)}
.check-item .check-box{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.check-item.done .check-box{background:var(--green);border-color:var(--green)}
.check-item .check-text{flex:1;font-size:.9rem}
.check-item.done .check-text{text-decoration:line-through;color:var(--text2)}
.check-item .check-points{font-size:.8rem;color:var(--green);font-weight:600;white-space:nowrap}
.tips-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.tips-grid{grid-template-columns:1fr}}
.tip-card{background:var(--input);border-radius:var(--radius-sm);padding:16px;border-left:3px solid var(--green)}
.tip-card .t-cat{font-size:.75rem;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.tip-card .t-title{font-weight:600;font-size:.9rem;margin-bottom:4px}
.tip-card .t-desc{font-size:.82rem;color:var(--text2);line-height:1.5}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.82rem}
</style>
</head>
<body>
<div class="container">
<header><h1>可持续生活指南</h1><p class="subtitle">每日打卡，养成环保好习惯</p></header>
<div class="score-box">
<div class="score-num" id="scoreNum">0</div>
<div class="score-label" id="scoreLabel">今日得分</div>
<div class="score-bar"><div class="score-fill" id="scoreFill" style="width:0%"></div></div>
<div style="margin-top:12px;font-size:.85rem;color:var(--text2)" id="scoreMsg">完成下面的环保打卡获取分数</div>
</div>
<div class="section">
<h2><span class="icon">✅</span> 每日环保打卡</h2>
<div class="checklist" id="checklist"></div>
</div>
<div class="section">
<h2><span class="icon">💡</span> 可持续生活建议</h2>
<div class="tips-grid" id="tips"></div>
</div>
<div class="section">
<h2><span class="icon">📊</span> 你的环保成就</h2>
<div id="achievements" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"></div>
</div>
<footer>可持续生活指南 · 为地球的明天行动</footer>
</div>
<script>
const TASKS=[
{id:1,text:'自带购物袋购物',pts:10,icon:'🛍️'},
{id:2,text:'选择公共交通出行',pts:15,icon:'🚌'},
{id:3,text:'自带水杯/咖啡杯',pts:8,icon:'☕'},
{id:4,text:'今天素食一餐',pts:12,icon:'🥗'},
{id:5,text:'随手关灯关电器',pts:10,icon:'💡'},
{id:6,text:'减少使用一次性餐具',pts:10,icon:'🥢'},
{id:7,text:'步行或骑车出行',pts:15,icon:'🚲'},
{id:8,text:'使用可重复使用物品',pts:8,icon:'♻️'},
{id:9,text:'今天没有网购',pts:10,icon:'📦'},
{id:10,text:'正确分类垃圾',pts:12,icon:'🗑️'}
];
const TIPS=[
{cat:'饮食',title:'选择本地食材',desc:'本地食材运输距离短，碳排放更低，且更新鲜'},
{cat:'出行',title:'绿色通勤',desc:'3公里内步行，5公里内骑行，10公里内公交'},
{cat:'家居',title:'节能改造',desc:'更换LED灯，使用智能插座，定期清洗空调滤网'},
{cat:'消费',title:'理性购物',desc:'买前三思：我真的需要吗？能用多久？'},
{cat:'垃圾',title:'减塑生活',desc:'自带购物袋、水杯、餐具，拒绝一次性用品'},
{cat:'能源',title:'清洁能源',desc:'有条件可安装太阳能板，支持绿色电力'}
];
const ACHIEVEMENTS=[
{icon:'🌱',name:'环保新手',desc:'首次完成打卡',req:1},
{icon:'🌿',name:'绿色达人',desc:'累计打卡5天',req:5},
{icon:'🌳',name:'环保先锋',desc:'累计打卡10天',req:10},
{icon:'💚',name:'地球卫士',desc:'累计打卡30天',req:30},
{icon:'🌍',name:'可持续大使',desc:'累计打卡100天',req:100},
{icon:'🏆',name:'满分达人',desc:'单日获得全部分数',req:0}
];
let done=new Set();
let streak=parseInt(localStorage.getItem('eco_streak')||'0');
let lastDate=localStorage.getItem('eco_last_date')||'';
const today=new Date().toISOString().slice(0,10);
if(lastDate!==today)streak=0;
function renderChecklist(){
let h='';
TASKS.forEach(t=>{
const isDone=done.has(t.id);
h+=`<div class="check-item ${isDone?'done':''}" onclick="toggleTask(${t.id})">
<div class="check-box">${isDone?'✓':''}</div>
<span class="check-text">${t.icon} ${t.text}</span>
<span class="check-points">+${t.pts}分</span>
</div>`;
});
document.getElementById('checklist').innerHTML=h;
}
function toggleTask(id){
if(done.has(id))done.delete(id);else done.add(id);
updateScore();renderChecklist();renderAchievements();
}
function updateScore(){
const pts=done.size>0?TASKS.filter(t=>done.has(t.id)).reduce((s,t)=>s+t.pts,0):0;
const maxPts=TASKS.reduce((s,t)=>s+t.pts,0);
const pct=maxPts>0?(pts/maxPts*100):0;
document.getElementById('scoreNum').textContent=pts;
document.getElementById('scoreFill').style.width=pct+'%';
let msg='';
if(pts>=80)msg='🏆 太棒了！你是满分环保达人！';
else if(pts>=50)msg='🌿 做得很好，继续保持！';
else if(pts>0)msg='🌱 不错的开始，再接再厉！';
else msg='完成下面的环保打卡获取分数';
document.getElementById('scoreMsg').textContent=msg;
if(pts>=maxPts&&lastDate!==today){streak++;lastDate=today;localStorage.setItem('eco_streak',streak);localStorage.setItem('eco_last_date',today)}
}
function renderTips(){
let h='';
TIPS.forEach(t=>{h+=`<div class="tip-card"><div class="t-cat">${t.cat}</div><div class="t-title">${t.title}</div><div class="t-desc">${t.desc}</div></div>`});
document.getElementById('tips').innerHTML=h;
}
function renderAchievements(){
let h='';
ACHIEVEMENTS.forEach(a=>{
let unlocked=false;
if(a.req===0)unlocked=done.size===TASKS.length;
else unlocked=streak>=a.req;
h+=`<div style="text-align:center;padding:16px;background:${unlocked?'rgba(34,197,94,.1)':'var(--input)'};border-radius:var(--radius-sm);border:1px solid ${unlocked?'var(--green)':'var(--border)'}">
<div style="font-size:2rem;${unlocked?'':'filter:grayscale(1);opacity:.5'}">${a.icon}</div>
<div style="font-size:.85rem;font-weight:600;margin-top:4px">${a.name}</div>
<div style="font-size:.75rem;color:var(--text2)">${a.desc}</div>
</div>`;
});
document.getElementById('achievements').innerHTML=h;
}
renderChecklist();renderTips();renderAchievements();updateScore();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
