<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可爱狗狗</title>
<meta name="description" content="可爱狗狗百科，了解各种犬种的特点和趣闻">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem}.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.dog-card{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;text-align:center}
.dog-img{width:100%;max-width:500px;height:350px;object-fit:cover;border-radius:10px;display:block;margin:0 auto;background:var(--bg)}
.dog-breed{font-size:.9rem;color:var(--text2);margin-top:12px}
.next-btn{display:block;margin:20px auto 0;padding:12px 32px;background:var(--blue);border:none;border-radius:10px;color:var(--text);cursor:pointer;font-size:.9rem;transition:.2s}
.next-btn:hover{opacity:.9}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="可爱狗狗">
  <meta property="og:description" content="可爱狗狗百科，了解各种犬种的特点和趣闻">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/dog-facts/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<header><h1>🐕 可爱狗狗</h1><p class="sub">Dog CEO API · 随机萌犬</p></header>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var cnBreeds={
'golden-retriever':'金毛寻回犬','labrador':'拉布拉多','german-shepherd':'德国牧羊犬',
'bulldog':'斗牛犬','poodle':'贵宾犬','husky':'哈士奇','corgi':'柯基',
'shiba-inu':'柴犬','chow-chow':'松狮犬','pomeranian':'博美犬',
'chihuahua':'吉娃娃','dachshund':'腊肠犬','beagle':'比格犬',
'boxer':'拳师犬','saint-bernard':'圣伯纳犬','border-collie':'边境牧羊犬',
'australian-shepherd':'澳大利亚牧羊犬','yorkshire-terrier':'约克夏梗',
'maltese':'马尔济斯','cocker-spaniel':'可卡犬','pug':'巴哥犬',
'italian-greyhound':'意大利灵缇','cavalier-king-charles-spaniel':'查理王小猎犬',
'french-bulldog':'法国斗牛犬','bichon-frise':'比熊犬','shih-tzu':'西施犬',
'miniature-schnauzer':'迷你雪纳瑞','havanese':'哈瓦那犬','japanese-chin':'日本狆',
'malinois':'马犬','doberman':'杜宾犬','rottweiler':'罗威纳犬',
'pit-bull':'比特犬','akita':'秋田犬','samoyed':'萨摩耶',
'great-dane':'大丹犬','bernese-mountain-dog':'伯恩山犬','english-setter':'英国塞特犬',
'golden-retriever':'金毛','labrador':'拉布拉多','german-shepherd':'德牧',
'bulldog':'斗牛犬','poodle':'贵宾','husky':'哈士奇','corgi':'柯基',
'shiba-inu':'柴犬','chow-chow':'松狮','pomeranian':'博美',
'chihuahua':'吉娃娃','dachshund':'腊肠','beagle':'比格',
'boxer':'拳师','border-collie':'边牧','maltese':'马尔济斯',
'mixed':'混血','unknown':'未知品种'
};
function loadDog(){
app.innerHTML='<div style="text-align:center;padding:60px 0;color:var(--text2)"><div class="spinner" style="width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px"></div><p>找狗狗中...</p></div>';
fetch('https://dog.ceo/api/breeds/image/random')
.then(function(r){if(!r.ok)throw new Error('请求失败 ('+r.status+')');return r.json();})
.then(function(data){
var imgUrl=data.message;
var breed='';
var match=imgUrl.match(/breeds\/([^\/]+)/);
if(match)breed=match[1].replace(/-/g,' ');
var cnBreed=cnBreeds[breed]||breed;
var html='<div class="dog-card">';
html+='<img class="dog-img" src="'+imgUrl+'" alt="可爱狗狗" loading="lazy">';
if(breed)html+='<div class="dog-breed">品种: '+cnBreed+' ('+breed+')</div>';
html+='</div>';
html+='<button class="next-btn" onclick="loadDog()">🔄 换一张</button>';
app.innerHTML=html;
})
.catch(function(e){
app.innerHTML='<div style="text-align:center;padding:40px 0;color:var(--text2)"><p>⚠️ '+e.message+'</p><button class="next-btn" onclick="loadDog()" style="background:var(--card);border:1px solid var(--border);color:var(--text)">重试</button></div>';
});
}
window.loadDog=loadDog;
loadDog();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
