<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可爱狗狗</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;color:var(--text)}
.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.loading{text-align:center;padding:60px 0}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:.85rem}
.error{text-align:center;padding:40px 0;color:var(--red);font-size:.9rem}
.retry-btn{margin-top:10px;padding:8px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.85rem}
.dog-card{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.dog-img{width:100%;max-width:500px;height:350px;object-fit:cover;border-radius:var(--radius);display:block;margin:0 auto;background:var(--bg)}
.dog-breed{font-size:.9rem;color:var(--text2);margin-top:12px;text-transform:capitalize}
.next-btn{display:block;margin:20px auto 0;padding:12px 32px;background:var(--blue);border:none;border-radius:var(--radius);color:#fff;cursor:pointer;font-size:.9rem;transition:.2s}
.next-btn:hover{opacity:.9}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🐕 可爱狗狗</h1>
<p class="sub">Dog CEO API · 随机萌犬</p>
</header>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
function loadDog(){
app.innerHTML='<div class="loading"><div class="spinner"></div><p>找狗狗中...</p></div>';
fetch('https://dog.ceo/api/breeds/image/random')
.then(function(r){if(!r.ok)throw new Error('请求失败 ('+r.status+')');return r.json();})
.then(function(data){
var imgUrl=data.message;
var breed='';
var match=imgUrl.match(/breeds\/([^\/]+)/);
if(match)breed=match[1].replace(/-/g,' ');
var html='<div class="dog-card">';
html+='<img class="dog-img" src="'+imgUrl+'" alt="可爱狗狗" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22500%22 height=%22350%22><rect fill=%22%23161b22%22 width=%22500%22 height=%22350%22/><text fill=%22%238b949e%22 font-size=%2220%22 x=%22180%22 y=%22185%22>加载失败</text></svg>\'">';
if(breed)html+='<div class="dog-breed">品种: '+breed+'</div>';
html+='</div>';
html+='<button class="next-btn" onclick="loadDog()">🔄 换一张</button>';
app.innerHTML=html;
})
.catch(function(e){
app.innerHTML='<div class="error"><p>⚠️ '+e.message+'</p><button class="retry-btn" onclick="loadDog()">重试</button></div>';
});
}
window.loadDog=loadDog;
loadDog();
})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
