<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风水查询</title><meta name="description" content="风水查询 - 在线查询风水知识"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.feng-shui-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;cursor:pointer;transition:transform .2s}.feng-shui-item:hover{transform:translateY(-2px)}.feng-shui-title{font-size:1.1rem;font-weight:600;color:var(--blue);margin-bottom:8px}.feng-shui-meaning{font-size:.9rem;color:var(--text);line-height:1.6}.feng-shui-category{font-size:.8rem;color:var(--green);margin-top:8px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.category-btn{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:6px;cursor:pointer;font-size:.85rem}.category-btn.active{background:var(--blue);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="风水查询"><meta property="og:description" content="风水查询 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🏠 风水查询</h1><p class="sub">在线查询风水知识</p>
<div class="card">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索风水知识..." oninput="filterFengShui()">
</div>
<div class="btn-group">
<button class="category-btn active" onclick="filterByCategory('all',this)">全部</button>
<button class="category-btn" onclick="filterByCategory('客厅',this)">客厅</button>
<button class="category-btn" onclick="filterByCategory('卧室',this)">卧室</button>
<button class="category-btn" onclick="filterByCategory('厨房',this)">厨房</button>
<button class="category-btn" onclick="filterByCategory('卫生间',this)">卫生间</button>
<button class="category-btn" onclick="filterByCategory('书房',this)">书房</button>
<button class="category-btn" onclick="filterByCategory('玄关',this)">玄关</button>
</div>
</div>
<div id="fengShuiList"></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var fengShui=[
  {title:'客厅沙发摆放',meaning:'沙发应靠实墙摆放，背后不宜有窗户或门。沙发宜呈U形或L形摆放，有利于聚财。沙发上方不宜有横梁，否则会有压迫感。',category:'客厅'},
  {title:'客厅电视摆放',meaning:'电视不宜正对大门，否则会影响家庭和睦。电视背景墙宜用柔和的颜色，不宜过于花哨。电视不宜过大，应与客厅大小相匹配。',category:'客厅'},
  {title:'客厅植物摆放',meaning:'客厅宜摆放常绿植物，如发财树、富贵竹等，有利于招财。不宜摆放带刺的植物，如仙人掌，否则会影响家庭和睦。',category:'客厅'},
  {title:'客厅鱼缸摆放',meaning:'鱼缸宜摆放在客厅的财位，一般在大门对角线的位置。鱼缸不宜过高，否则会有"淋头水"之嫌。鱼缸中的鱼数量以单数为佳。',category:'客厅'},
  {title:'卧室床的摆放',meaning:'床头应靠实墙，不宜靠窗或门。床不宜正对镜子，否则会影响睡眠。床头不宜有横梁，否则会有压迫感。',category:'卧室'},
  {title:'卧室颜色选择',meaning:'卧室宜用柔和的颜色，如浅粉色、浅蓝色等，有利于睡眠。不宜用过于鲜艳的颜色，如红色、橙色等，否则会影响睡眠质量。',category:'卧室'},
  {title:'卧室植物摆放',meaning:'卧室宜摆放少量植物，如绿萝、吊兰等，有利于净化空气。不宜摆放过多植物，否则会影响卧室的气场。',category:'卧室'},
  {title:'卧室镜子摆放',meaning:'卧室镜子不宜正对床，否则会影响睡眠。镜子宜摆放在衣柜门内侧，使用时打开，不用时关闭。',category:'卧室'},
  {title:'厨房灶台摆放',meaning:'灶台不宜正对大门或后门，否则会影响家庭财运。灶台不宜与水槽相邻，否则会有"水火相冲"之嫌。',category:'厨房'},
  {title:'厨房颜色选择',meaning:'厨房宜用白色或浅黄色，有利于保持清洁。不宜用红色或黑色，否则会影响食欲。',category:'厨房'},
  {title:'厨房植物摆放',meaning:'厨房宜摆放一些绿色植物，如薄荷、罗勒等，有利于净化空气。不宜摆放过多植物，否则会影响厨房的气场。',category:'厨房'},
  {title:'卫生间位置',meaning:'卫生间不宜位于房屋中央，否则会影响整个房屋的气场。卫生间不宜与卧室相邻，否则会影响睡眠质量。',category:'卫生间'},
  {title:'卫生间颜色选择',meaning:'卫生间宜用白色或浅蓝色，有利于保持清洁。不宜用红色或黑色，否则会影响卫生间气场。',category:'卫生间'},
  {title:'卫生间植物摆放',meaning:'卫生间宜摆放一些耐阴植物，如绿萝、吊兰等，有利于净化空气。不宜摆放过多植物，否则会影响卫生间气场。',category:'卫生间'},
  {title:'书房书桌摆放',meaning:'书桌应靠实墙摆放，背后不宜有窗户或门。书桌不宜正对窗户，否则会有"望空"之嫌。书桌上方不宜有横梁。',category:'书房'},
  {title:'书房颜色选择',meaning:'书房宜用淡雅的颜色，如浅绿色、浅蓝色等，有利于集中注意力。不宜用过于鲜艳的颜色，否则会影响学习效率。',category:'书房'},
  {title:'书房植物摆放',meaning:'书房宜摆放一些绿色植物，如文竹、富贵竹等，有利于集中注意力。不宜摆放过多植物，否则会影响书房气场。',category:'书房'},
  {title:'玄关设计',meaning:'玄关宜明亮整洁，不宜堆放杂物。玄关宜摆放一些绿色植物，有利于招财。玄关镜子不宜正对大门。',category:'玄关'},
  {title:'玄关颜色选择',meaning:'玄关宜用明亮的颜色，如白色、浅黄色等，有利于招财。不宜用过于暗淡的颜色，否则会影响玄关气场。',category:'玄关'},
  {title:'玄关植物摆放',meaning:'玄关宜摆放一些绿色植物，如发财树、富贵竹等，有利于招财。不宜摆放带刺的植物，否则会影响家庭和睦。',category:'玄关'}
];
var currentCategory='all';
function renderFengShui(fengShuiToShow){
  var list=document.getElementById('fengShuiList');
  var html='';
  fengShuiToShow.forEach(function(item){
    html+='<div class="feng-shui-item">';
    html+='<div class="feng-shui-title">'+item.title+'</div>';
    html+='<div class="feng-shui-meaning">'+item.meaning+'</div>';
    html+='<div class="feng-shui-category">分类：'+item.category+'</div>';
    html+='</div>';
  });
  list.innerHTML=html;
}
function filterFengShui(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=fengShui.filter(function(item){
    var matchSearch=item.title.toLowerCase().includes(search)||item.meaning.toLowerCase().includes(search);
    var matchCategory=currentCategory==='all'||item.category===currentCategory;
    return matchSearch&&matchCategory;
  });
  renderFengShui(filtered);
}
function filterByCategory(category,btn){
  currentCategory=category;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterFengShui();
}
renderFengShui(fengShui);

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
