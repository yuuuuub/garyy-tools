<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>进制转换器</title><meta name="description" content="进制转换器 - 在线数字进制转换工具"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.result-row{display:flex;justify-content:space-between;padding:8px;background:var(--bg);border-radius:6px;margin-bottom:8px}.result-label{color:var(--text2);font-size:.85rem}.result-value{font-family:monospace;font-weight:600;color:var(--blue)}</style><meta property="og:title" content="进制转换器"><meta property="og:description" content="进制转换器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔢 进制转换器</h1><p class="sub">在线数字进制转换工具</p>
<div class="card">
<div class="input-group">
<label>输入数字</label>
<input type="text" id="numberInput" placeholder="123" oninput="convertNumber()">
</div>
<div class="input-group">
<label>输入进制</label>
<select id="inputBase" onchange="convertNumber()">
<option value="10">十进制</option>
<option value="2">二进制</option>
<option value="8">八进制</option>
<option value="16">十六进制</option>
</select>
</div>
<button class="btn" onclick="convertNumber()">转换</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function convertNumber(){
  var input=document.getElementById('numberInput').value.trim();
  var base=parseInt(document.getElementById('inputBase').value);
  var r=document.getElementById('result');
  if(!input){r.innerHTML='';return;}
  try{
    var number=parseInt(input,base);
    if(isNaN(number)){r.innerHTML='<div class="card" style="color:var(--red)">无效的数字</div>';return;}
    var html='<div class="card"><div class="section"><h3>📋 转换结果</h3>';
    html+='<div class="result-row"><span class="result-label">二进制 (2):</span><span class="result-value">'+number.toString(2)+'</span></div>';
    html+='<div class="result-row"><span class="result-label">八进制 (8):</span><span class="result-value">'+number.toString(8)+'</span></div>';
    html+='<div class="result-row"><span class="result-label">十进制 (10):</span><span class="result-value">'+number.toString(10)+'</span></div>';
    html+='<div class="result-row"><span class="result-label">十六进制 (16):</span><span class="result-value">'+number.toString(16).toUpperCase()+'</span></div>';
    html+='<div class="result-row"><span class="result-label">三十二进制 (32):</span><span class="result-value">'+number.toString(32)+'</span></div>';
    html+='<div class="result-row"><span class="result-label">三十六进制 (36):</span><span class="result-value">'+number.toString(36)+'</span></div>';
    html+='</div><button class="copy-btn" onclick="copyAll()">复制所有</button></div>';
    r.innerHTML=html;
  }catch(e){
    r.innerHTML='<div class="card" style="color:var(--red)">转换失败: '+e.message+'</div>';
  }
}
function copyAll(){
  var text=document.querySelector('.result-block')?document.querySelector('.result-block').textContent:'';
  if(!text){
    var rows=document.querySelectorAll('.result-value');
    text=Array.from(rows).map(function(r){return r.textContent;}).join('\n');
  }
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
convertNumber();
</script></body></html>
