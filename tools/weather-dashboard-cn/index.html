<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌤 天气仪表板</title>
<meta name="description" content="天气仪表板 - 查看全球主要城市天气信息，包含温度、湿度、风速等数据可视化">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:1000px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text]{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;width:100%}
input:focus{border-color:var(--accent)}
select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.weather-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.weather-hero .icon{font-size:4rem}
.weather-hero .temp{font-size:3rem;font-weight:700}
.weather-hero .desc{font-size:1.1rem;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.3rem;font-weight:700;color:var(--accent)}
.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.forecast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.forecast-item{text-align:center;padding:12px 8px;background:var(--bg);border-radius:8px}
.forecast-item .day{font-size:.8rem;color:var(--text2);margin-bottom:4px}
.forecast-item .icon{font-size:1.5rem;margin:4px 0}
.forecast-item .temp{font-size:1rem;font-weight:600}
.forecast-item .low{font-size:.8rem;color:var(--text2)}
.city-card{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.city-card:hover{background:var(--bg)}
.city-card .emoji{font-size:1.5rem}
.city-card .info{flex:1}
.city-card .name{font-weight:600}
.city-card .temp{font-size:1.1rem;font-weight:700;color:var(--accent)}
.city-card .meta{font-size:.8rem;color:var(--text2)}
.wind-indicator{display:flex;align-items:center;gap:8px}
.wind-arrow{font-size:1.5rem;transition:transform .3s}
.humidity-bar{width:100%;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.humidity-bar .fill{height:100%;background:var(--accent);border-radius:3px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🌤 天气仪表板</h1><p>全球主要城市天气数据可视化</p></div>

<div class="cd">
<div class="bg">
<select id="citySelect" onchange="selectCity()" style="flex:1;min-width:200px"></select>
<button onclick="refreshWeather()">🔄 刷新数据</button>
</div>
</div>

<div id="mainWeather" class="cd">
<div class="weather-hero">
<span class="icon" id="wIcon">☀️</span>
<div>
<div class="temp" id="wTemp">28°C</div>
<div class="desc" id="wDesc">晴朗</div>
<div style="color:var(--text2);font-size:.85rem" id="wCity">北京</div>
</div>
</div>
<div class="gr" style="margin-top:16px">
<div class="st"><div class="nm" id="wFeels">30°</div><div class="lb">体感温度</div></div>
<div class="st"><div class="nm" id="wHumidity">45%</div><div class="lb">湿度</div></div>
<div class="st"><div class="nm" id="wWind">12 km/h</div><div class="lb">风速</div></div>
<div class="st"><div class="nm" id="wPressure">1013 hPa</div><div class="lb">气压</div></div>
<div class="st"><div class="nm" id="wUV">6</div><div class="lb">紫外线</div></div>
<div class="st"><div class="nm" id="wVisibility">10 km</div><div class="lb">能见度</div></div>
</div>
</div>

<div class="cd">
<h2>7天预报</h2>
<div class="forecast-grid" id="forecast"></div>
</div>

<div class="cd">
<h2>24小时逐时</h2>
<div style="overflow-x:auto" id="hourly"></div>
</div>

<div class="cd">
<h2>更多城市天气</h2>
<div id="cityList"></div>
</div>
</div>

<script>
const cityData=[
{name:'北京',country:'中国',lat:39.9,lng:116.4,timezone:'UTC+8'},
{name:'上海',country:'中国',lat:31.2,lng:121.5,timezone:'UTC+8'},
{name:'广州',country:'中国',lat:23.1,lng:113.3,timezone:'UTC+8'},
{name:'深圳',country:'中国',lat:22.5,lng:114.1,timezone:'UTC+8'},
{name:'成都',country:'中国',lat:30.6,lng:104.1,timezone:'UTC+8'},
{name:'杭州',country:'中国',lat:30.3,lng:120.2,timezone:'UTC+8'},
{name:'武汉',country:'中国',lat:30.6,lng:114.3,timezone:'UTC+8'},
{name:'西安',country:'中国',lat:34.3,lng:108.9,timezone:'UTC+8'},
{name:'东京',country:'日本',lat:35.7,lng:139.7,timezone:'UTC+9'},
{name:'首尔',country:'韩国',lat:37.6,lng:127,timezone:'UTC+9'},
{name:'新加坡',country:'新加坡',lat:1.35,lng:103.8,timezone:'UTC+8'},
{name:'曼谷',country:'泰国',lat:13.8,lng:100.5,timezone:'UTC+7'},
{name:'伦敦',country:'英国',lat:51.5,lng:-0.1,timezone:'UTC+0'},
{name:'巴黎',country:'法国',lat:48.9,lng:2.35,timezone:'UTC+1'},
{name:'柏林',country:'德国',lat:52.5,lng:13.4,timezone:'UTC+1'},
{name:'纽约',country:'美国',lat:40.7,lng:-74,timezone:'UTC-5'},
{name:'洛杉矶',country:'美国',lat:34,lng:-118.2,timezone:'UTC-8'},
{name:'悉尼',country:'澳大利亚',lat:-33.9,lng:151.2,timezone:'UTC+11'},
{name:'迪拜',country:'阿联酋',lat:25.2,lng:55.3,timezone:'UTC+4'},
{name:'莫斯科',country:'俄罗斯',lat:55.8,lng:37.6,timezone:'UTC+3'}
];

const weatherTypes=[
{sunny:true,icon:'☀️',desc:'晴',tempBase:28},
{sunny:true,icon:'⛅',desc:'多云',tempBase:24},
{icon:'☁️',desc:'阴天',tempBase:20},
{icon:'🌧',desc:'小雨',tempBase:18},
{icon:'⛈',desc:'雷阵雨',tempBase:22},
{icon:'🌨',desc:'小雪',tempBase:-2},
{icon:'🌫',desc:'雾',tempBase:15},
{sunny:true,icon:'🌤',desc:'晴间多云',tempBase:26}
];

const windDirs=['北','东北','东','东南','南','西南','西','西北'];
const windIcons=['↓','↘','→','↗','↑','↖','←','↙'];

function $(id){return document.getElementById(id)}
function seededRandom(seed){let x=Math.sin(seed)*10000;return x-Math.floor(x)}
function getWeatherForCity(city,idx){
  const seed=idx*1000+new Date().getDate()*7;
  const wIdx=Math.floor(seededRandom(seed)*weatherTypes.length);
  const w=weatherTypes[wIdx];
  const tempVariance=Math.sin(city.lat/50)*10;
  const temp=Math.round(w.tempBase+tempVariance+(seededRandom(seed+1)*6-3));
  const humidity=Math.round(40+seededRandom(seed+2)*50);
  const windSpeed=Math.round(5+seededRandom(seed+3)*30);
  const windDir=Math.floor(seededRandom(seed+4)*8);
  const pressure=Math.round(1005+seededRandom(seed+5)*20);
  const uv=Math.round(1+seededRandom(seed+6)*10);
  const visibility=Math.round(5+seededRandom(seed+7)*15);
  const feelsLike=Math.round(temp+(seededRandom(seed+8)*4-2));
  const forecast=[];
  for(let d=0;d<7;d++){
    const dSeed=seed+d*13;
    const dWIdx=Math.floor(seededRandom(dSeed)*weatherTypes.length);
    const dW=weatherTypes[dWIdx];
    const dTemp=Math.round(temp+(seededRandom(dSeed+1)*8-4));
    const days=['周日','周一','周二','周三','周四','周五','周六'];
    const date=new Date();date.setDate(date.getDate()+d);
    forecast.push({day:d===0?'今天':days[date.getDay()],icon:dW.icon,temp:dTemp,low:dTemp-Math.round(seededRandom(dSeed+2)*5+3),desc:dW.desc});
  }
  const hourly=[];
  for(let h=0;h<24;h++){
    const hSeed=seed+h*17;
    const hWIdx=Math.floor(seededRandom(hSeed)%3);
    const hIcon=['☀️','⛅','🌙'][hWIdx];
    const hTemp=Math.round(temp+Math.sin((h-14)/24*Math.PI*2)*5);
    hourly.push({hour:(new Date().getHours()+h)%24,icon:hIcon,temp:hTemp});
  }
  return{icon:w.icon,desc:w.desc,temp,humidity,windSpeed,windDir,pressure,uv,visibility,feelsLike,forecast,hourly};
}

let currentCityIdx=0,currentWeather;

function initSelect(){
  const s=$('citySelect');s.innerHTML='';
  cityData.forEach((c,i)=>{s.innerHTML+='<option value="'+i+'">'+c.name+' ('+c.country+')</option>'});
}

function selectCity(){currentCityIdx=parseInt($('citySelect').value);renderWeather()}
function refreshWeather(){renderWeather()}

function renderWeather(){
  const city=cityData[currentCityIdx];
  currentWeather=getWeatherForCity(city,currentCityIdx);
  const w=currentWeather;

  $('wIcon').textContent=w.icon;
  $('wTemp').textContent=w.temp+'°C';
  $('wDesc').textContent=w.desc;
  $('wCity').textContent=city.name+', '+city.country;
  $('wFeels').textContent=w.feelsLike+'°';
  $('wHumidity').textContent=w.humidity+'%';
  $('wWind').textContent=w.windSpeed+' km/h';
  $('wPressure').textContent=w.pressure+' hPa';
  $('wUV').textContent=w.uv;
  $('wVisibility').textContent=w.visibility+' km';

  $('forecast').innerHTML=w.forecast.map(f=>
    '<div class="forecast-item"><div class="day">'+f.day+'</div><div class="icon">'+f.icon+'</div><div class="temp">'+f.temp+'°</div><div class="low">'+f.low+'°</div><div style="font-size:.7rem;color:var(--text2)">'+f.desc+'</div></div>'
  ).join('');

  $('hourly').innerHTML='<div style="display:flex;gap:8px;min-width:max-content">'+w.hourly.map(h=>
    '<div style="text-align:center;min-width:60px;padding:8px;background:var(--bg);border-radius:8px"><div style="font-size:.75rem;color:var(--text2)">'+h.hour+':00</div><div style="font-size:1.2rem;margin:4px 0">'+h.icon+'</div><div style="font-weight:600">'+h.temp+'°</div></div>'
  ).join('')+'</div>';

  renderCityList();
}

function renderCityList(){
  $('cityList').innerHTML=cityData.map((c,i)=>{
    const w=getWeatherForCity(c,i);
    return '<div class="city-card" onclick="document.getElementById(\'citySelect\').value='+i+';selectCity()"><span class="emoji">'+w.icon+'</span><div class="info"><div class="name">'+c.name+'</div><div class="meta">'+w.desc+' · 湿度 '+w.humidity+'% · 风速 '+w.windSpeed+'km/h</div></div><div class="temp">'+w.temp+'°</div></div>';
  }).join('');
}

initSelect();renderWeather();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
