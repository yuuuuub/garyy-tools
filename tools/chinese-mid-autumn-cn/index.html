<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中秋节习俗与诗词大全</title>
<meta name="description" content="中秋节习俗与诗词大全 - 赏月、月饼、灯谜、桂花酒、经典诗词">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌕</text></svg>">
<meta name="robots" content="index,follow">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.hidden{display:none}
.moon-wrap{text-align:center;padding:20px 0}
.moon{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fef3c7,#fde68a,#fbbf24);margin:0 auto;box-shadow:0 0 60px rgba(251,191,36,.3),0 0 120px rgba(251,191,36,.1);animation:moonGlow 3s ease-in-out infinite}
@keyframes moonGlow{0%,100%{box-shadow:0 0 60px rgba(251,191,36,.3),0 0 120px rgba(251,191,36,.1)}50%{box-shadow:0 0 80px rgba(251,191,36,.5),0 0 160px rgba(251,191,36,.2)}}
.countdown-box{display:flex;gap:16px;justify-content:center;margin:16px 0}
.countdown-item{text-align:center}
.countdown-num{font-size:2rem;font-weight:700;color:var(--yellow);line-height:1}
.countdown-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.custom-list{display:flex;flex-direction:column;gap:10px}
.custom-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all var(--transition)}
.custom-item:hover{border-color:var(--yellow)}
.custom-header{display:flex;align-items:center;gap:10px}
.custom-icon{font-size:1.5rem}
.custom-name{font-weight:600}
.custom-desc{color:var(--text2);font-size:.85rem;margin-top:4px}
.custom-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--text2);font-size:.85rem;line-height:1.6;display:none}
.custom-detail.show{display:block}
.search-box{margin-bottom:16px}
.search-box input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
.search-box input:focus{outline:none;border-color:var(--blue)}
.mooncake-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mooncake-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;transition:all var(--transition)}
.mooncake-item:hover{border-color:var(--yellow);transform:translateY(-2px)}
.mooncake-emoji{font-size:2rem;display:block;margin-bottom:6px}
.mooncake-name{font-weight:600;font-size:.95rem}
.mooncake-origin{color:var(--text2);font-size:.8rem}
.poem-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px;transition:all var(--transition)}
.poem-card:hover{border-color:var(--blue)}
.poem-title{font-weight:700;font-size:1rem;margin-bottom:4px}
.poem-author{color:var(--blue);font-size:.85rem;margin-bottom:8px}
.poem-text{color:var(--text2);font-size:.9rem;line-height:1.8;white-space:pre-line}
.cat-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.cat-tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s}
.cat-tab.active{background:var(--yellow);color:#000;border-color:var(--yellow)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div style="position:fixed;top:8px;right:8px;z-index:9999"><button class="btn btn-secondary" onclick="toggleTheme()" style="font-size:.8rem;padding:4px 10px" id="themeBtn">🌙 暗色</button></div>
<div class="container">
<h1>🌕 中秋节习俗与诗词大全</h1>
<p class="sub">赏月 · 月饼 · 灯谜 · 桂花酒 · 经典诗词</p>

<div class="card">
<div class="moon-wrap"><div class="moon"></div></div>
<h2 style="text-align:center;margin-bottom:4px;font-size:1rem">距离中秋节</h2>
<div class="countdown-box" id="countdown"></div>
</div>

<div class="tabs">
<button class="btn btn-primary" onclick="showTab('customs')" id="tabCustoms">🎊 习俗</button>
<button class="btn btn-secondary" onclick="showTab('mooncakes')" id="tabMooncakes">🥮 月饼</button>
<button class="btn btn-secondary" onclick="showTab('poems')" id="tabPoems">📜 诗词</button>
</div>

<div id="customsView">
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索习俗..." oninput="filterCustoms()"></div>
<div class="cat-tabs" id="catTabs"></div>
<div class="custom-list" id="customList"></div>
</div>
<div id="mooncakesView" class="hidden"><div class="mooncake-grid" id="mooncakeGrid"></div></div>
<div id="poemsView" class="hidden"><div id="poemList"></div></div>
</div>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script src="../i18n.js" defer></script>
<script>
var customs=[
{name:'赏月',icon:'🌕',cat:'娱乐',desc:'中秋夜全家赏月，品尝月饼',detail:'中秋赏月始于唐代，到宋代成为全民活动。赏月时摆放月饼、柚子、桂花酒等。著名的赏月地有：杭州西湖三潭印月、南京莫愁湖、苏州石湖等。'},
{name:'吃月饼',icon:'🥮',cat:'饮食',desc:'中秋节必备食品，种类丰富口味各异',detail:'月饼种类繁多：广式月饼（皮薄馅多）、苏式月饼（酥皮）、京式月饼（自来红）、潮式月饼（朥饼）等。馅料有五仁、豆沙、蛋黄莲蓉、鲜肉等。月饼圆形象征团圆。'},
{name:'猜灯谜',icon:'🧩',cat:'娱乐',desc:'将谜语写在花灯上供人猜射',detail:'灯谜始于宋代，当时称"隐语"或"灯虎"。将谜面贴在花灯上，猜中者可获得奖品。灯谜类型有：会意法、拆字法、谐音法等。'},
{name:'赏桂花',icon:'🌸',cat:'娱乐',desc:'中秋前后桂花飘香，赏桂闻香',detail:'中秋节前后正是桂花盛开的季节。桂花象征崇高、美好、吉祥。赏桂花时还可以品桂花茶、饮桂花酒、吃桂花糕。'},
{name:'饮桂花酒',icon:'🍶',cat:'饮食',desc:'中秋饮用桂花酒，象征甜蜜团圆',detail:'桂花酒选用秋天盛开的桂花酿制，酒色金黄，清香扑鼻。古人认为月中有桂树，中秋饮桂花酒是与月中嫦娥同庆。桂花酒有温中散寒、暖胃止痛的功效。'},
{name:'燃灯',icon:'🏮',cat:'娱乐',desc:'中秋夜悬灯为月神庆生',detail:'中秋燃灯习俗由来已久，灯的形状各异，有柚皮灯、蛋壳灯、刨花灯等。广东地区有竖中秋的习俗，将灯笼挂于高处，照亮月光之路。'},
{name:'拜月',icon:'🙏',cat:'祭祀',desc:'女子中秋夜拜月祈福',detail:'古代有"男不拜月，女不祭灶"的说法。中秋夜女子在庭院摆上月饼、瓜果，焚香拜月，祈求嫦娥赐予美貌和智慧。这一习俗反映了古代女性对美好生活的向往。'},
{name:'吃柚子',icon:'🍊',cat:'饮食',desc:'中秋吃柚子，"柚"与"佑"谐音',detail:'柚子是中秋时令水果，"柚"与"佑"谐音，寓意保佑平安。柚子皮还可以制成柚皮灯，是孩子们中秋节最喜爱的玩具之一。'}
];
var mooncakes=[
{emoji:'🥮',name:'广式月饼',origin:'广东广州',desc:'皮薄馅多，造型精美，是最常见的月饼类型'},
{emoji:'🥮',name:'苏式月饼',origin:'江苏苏州',desc:'酥皮层次分明，口感酥松，传统手工制作'},
{emoji:'🥮',name:'京式月饼',origin:'北京',desc:'自来红、自来白，皮馅比例适中，甜度适中'},
{emoji:'🥮',name:'潮式月饼',origin:'广东潮汕',desc:'朥饼，用猪油起酥，口感独特'},
{emoji:'🥮',name:'滇式月饼',origin:'云南昆明',desc:'鲜花月饼为代表，用玫瑰花瓣入馅'},
{emoji:'🥮',name:'晋式月饼',origin:'山西',desc:'郭杜林月饼，以酥绵甘香著称'}
];
var poems=[
{title:'水调歌头·明月几时有',author:'苏轼（宋）',text:'明月几时有？把酒问青天。\n不知天上宫阙，今夕是何年。\n我欲乘风归去，又恐琼楼玉宇，\n高处不胜寒。\n起舞弄清影，何似在人间。\n\n转朱阁，低绮户，照无眠。\n不应有恨，何事长向别时圆？\n人有悲欢离合，月有阴晴圆缺，\n此事古难全。\n但愿人长久，千里共婵娟。'},
{title:'静夜思',author:'李白（唐）',text:'床前明月光，疑是地上霜。\n举头望明月，低头思故乡。'},
{title:'望月怀远',author:'张九龄（唐）',text:'海上生明月，天涯共此时。\n情人怨遥夜，竟夕起相思。\n灭烛怜光满，披衣觉露滋。\n不堪盈手赠，还寝梦佳期。'},
{title:'月夜忆舍弟',author:'杜甫（唐）',text:'戍鼓断人行，边秋一雁声。\n露从今夜白，月是故乡明。\n有弟皆分散，无家问死生。\n寄书长不达，况乃未休兵。'},
{title:'十五夜望月',author:'王建（唐）',text:'中庭地白树栖鸦，冷露无声湿桂花。\n今夜月明人尽望，不知秋思落谁家。'},
{title:'嫦娥',author:'李商隐（唐）',text:'云母屏风烛影深，长河渐落晓星沉。\n嫦娥应悔偷灵药，碧海青天夜夜心。'}
];
var currentCat='all',currentTab='customs';

function updateCountdown(){
  var now=new Date();
  var year=now.getFullYear();
  var mid=new Date(year,8,15);
  if(now>mid)mid=new Date(year+1,8,15);
  var diff=mid-now;
  var days=Math.floor(diff/864e5);
  var hours=Math.floor((diff%864e5)/36e5);
  document.getElementById('countdown').innerHTML=
    '<div class="countdown-item"><div class="countdown-num">'+days+'</div><div class="countdown-label">天</div></div>'+
    '<div class="countdown-item"><div class="countdown-num">'+(hours<10?'0':'')+hours+'</div><div class="countdown-label">时</div></div>';
}

function showTab(tab){
  currentTab=tab;
  ['customsView','mooncakesView','poemsView'].forEach(function(v){document.getElementById(v).classList.add('hidden')});
  document.getElementById(tab+'View').classList.remove('hidden');
  ['tabCustoms','tabMooncakes','tabPoems'].forEach(function(id){document.getElementById(id).className='btn btn-secondary'});
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).className='btn btn-primary';
}

function renderCatTabs(){
  var cats=['all','饮食','娱乐','祭祀'];
  var h='';
  cats.forEach(function(c){h+='<span class="cat-tab'+(c===currentCat?' active':'')+'" onclick="selectCat(this,\''+c+'\')">'+(c==='all'?'全部':c)+'</span>'});
  document.getElementById('catTabs').innerHTML=h;
}

function selectCat(el,cat){
  document.querySelectorAll('.cat-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');currentCat=cat;filterCustoms();
}

function filterCustoms(){
  var s=document.getElementById('searchInput').value.toLowerCase();
  var filtered=customs.filter(function(c){
    if(currentCat!=='all'&&c.cat!==currentCat)return false;
    if(s&&!c.name.toLowerCase().includes(s)&&!c.desc.toLowerCase().includes(s))return false;
    return true;
  });
  var h='';
  filtered.forEach(function(c,i){
    var idx=customs.indexOf(c);
    h+='<div class="custom-item" onclick="toggleDetail('+idx+')">';
    h+='<div class="custom-header"><span class="custom-icon">'+c.icon+'</span><div><div class="custom-name">'+c.name+'</div><div class="custom-desc">'+c.desc+'</div></div></div>';
    h+='<div class="custom-detail" id="cd-'+idx+'">'+c.detail+'</div></div>';
  });
  document.getElementById('customList').innerHTML=h||'<div class="card" style="text-align:center;color:var(--text2)">没有找到匹配的习俗</div>';
}

function toggleDetail(idx){
  var el=document.getElementById('cd-'+idx);
  if(el)el.classList.toggle('show');
}

function renderMooncakes(){
  var h='';
  mooncakes.forEach(function(m){
    h+='<div class="mooncake-item"><span class="mooncake-emoji">'+m.emoji+'</span><div class="mooncake-name">'+m.name+'</div><div class="mooncake-origin">'+m.origin+'</div><div style="margin-top:6px;color:var(--text2);font-size:.8rem">'+m.desc+'</div></div>';
  });
  document.getElementById('mooncakeGrid').innerHTML=h;
}

function renderPoems(){
  var h='';
  poems.forEach(function(p){
    h+='<div class="poem-card"><div class="poem-title">'+p.title+'</div><div class="poem-author">'+p.author+'</div><div class="poem-text">'+p.text+'</div></div>';
  });
  document.getElementById('poemList').innerHTML=h;
}

function toggleTheme(){
  var html=document.documentElement;
  var isLight=html.getAttribute('data-theme')==='light';
  html.setAttribute('data-theme',isLight?'dark':'light');
  document.getElementById('themeBtn').textContent=isLight?'☀️ 亮色':'🌙 暗色';
}

renderCatTabs();filterCustoms();renderMooncakes();renderPoems();updateCountdown();setInterval(updateCountdown,36e5);
window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});
</script>
</body>
</html>
