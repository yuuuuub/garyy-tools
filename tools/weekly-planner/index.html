<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周计划表</title>
<meta name="description" content="周计划表工具，合理安排每周时间和任务">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0f0f14;color:#d4d4d8;min-height:100vh}
header{background:#1a1a24;border-bottom:1px solid #2a2a3a;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100}
header h1{font-size:22px;font-weight:700;color:#f0f0f5;letter-spacing:1px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;gap:6px;color:#e0e0e8}
.btn-primary{background:#6366f1;color:#fff}.btn-primary:hover{background:#818cf8}
.btn-secondary{background:#2a2a3a;color:#c0c0d0}.btn-secondary:hover{background:#3a3a4a}
.btn-success{background:#10b981;color:#fff}.btn-success:hover{background:#34d399}
.btn-warning{background:#f59e0b;color:#1a1a24}.btn-warning:hover{background:#fbbf24}
.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#f87171}
.main-container{max-width:1400px;margin:0 auto;padding:20px 24px}
.stats-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:#1a1a24;border:1px solid #2a2a3a;border-radius:12px;padding:16px 20px;flex:1;min-width:140px}
.stat-card .stat-value{font-size:28px;font-weight:700;color:#f0f0f5}
.stat-card .stat-label{font-size:12px;color:#888;margin-top:4px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;min-height:500px}
@media(max-width:1200px){.week-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:768px){.week-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.week-grid{grid-template-columns:1fr}}
.day-column{background:#1a1a24;border:1px solid #2a2a3a;border-radius:12px;padding:12px;display:flex;flex-direction:column;min-height:400px;transition:border-color .2s}
.day-column.drag-over{border-color:#6366f1;background:#1e1e30}
.day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #2a2a3a}
.day-name{font-size:15px;font-weight:600;color:#c0c0d0}
.day-date{font-size:24px;font-weight:700;color:#f0f0f5}
.day-today .day-date{color:#6366f1}
.day-today{background:#1c1c30;border-color:#6366f1}
.day-tasks{flex:1;min-height:80px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.day-tasks:empty::after{content:"暂无任务";color:#555;font-size:12px;text-align:center;padding:20px 0}
.task-card{background:#252535;border:1px solid #333;border-radius:8px;padding:8px 10px;cursor:grab;transition:all .2s;position:relative;font-size:13px}
.task-card:hover{border-color:#555}
.task-card:active{cursor:grabbing}
.task-card.dragging{opacity:.5;transform:scale(.95)}
.task-card.completed{opacity:.6}
.task-card.completed .task-title{text-decoration:line-through}
.task-card.priority-high{border-left:3px solid #ef4444}
.task-card.priority-medium{border-left:3px solid #f59e0b}
.task-card.priority-low{border-left:3px solid #22c55e}
.task-header{display:flex;align-items:center;justify-content:space-between;gap:6px}
.task-title{font-weight:500;flex:1;word-break:break-word}
.task-time{font-size:11px;color:#888;white-space:nowrap}
.task-category{font-size:10px;padding:2px 6px;border-radius:12px;white-space:nowrap}
.cat-work{background:#6366f1;color:#fff}
.cat-personal{background:#a855f7;color:#fff}
.cat-health{background:#10b981;color:#fff}
.cat-study{background:#f59e0b;color:#1a1a24}
.cat-social{background:#ec4899;color:#fff}
.task-check{width:18px;height:18px;border-radius:50%;border:2px solid #555;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .2s}
.task-check:hover{border-color:#6366f1}
.task-check.checked{background:#6366f1;border-color:#6366f1;color:#fff}
.task-delete{background:none;border:none;color:#555;cursor:pointer;font-size:14px;padding:0 2px;line-height:1;transition:color .2s}
.task-delete:hover{color:#ef4444}
.add-task-btn{width:100%;padding:8px;background:transparent;border:1px dashed #3a3a4a;border-radius:8px;color:#666;cursor:pointer;font-size:12px;margin-top:8px;transition:all .2s}
.add-task-btn:hover{border-color:#6366f1;color:#818cf8}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:#1a1a24;border:1px solid #2a2a3a;border-radius:16px;padding:24px;width:90%;max-width:460px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:20px;color:#f0f0f5}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:#999;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;background:#0f0f14;border:1px solid #2a2a3a;border-radius:8px;color:#d4d4d8;font-size:14px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#6366f1}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.priority-dots{display:flex;gap:6px}
.priority-dot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s}
.priority-dot.active{border-color:#fff;transform:scale(1.15)}
.priority-dot[data-p="high"]{background:#ef4444}
.priority-dot[data-p="medium"]{background:#f59e0b}
.priority-dot[data-p="low"]{background:#22c55e}
.category-chips{display:flex;gap:6px;flex-wrap:wrap}
.category-chip{padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid transparent;transition:all .2s;opacity:.5}
.category-chip.active{opacity:1;border-color:#fff}
.week-nav{display:flex;align-items:center;gap:12px}
.week-nav .week-label{font-size:15px;color:#c0c0d0;min-width:160px;text-align:center}
.week-nav button{background:#2a2a3a;border:none;color:#c0c0d0;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.week-nav button:hover{background:#3a3a4a;color:#fff}
.template-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.template-btn{padding:6px 14px;border-radius:16px;border:1px solid #3a3a4a;background:#1a1a24;color:#999;cursor:pointer;font-size:12px;transition:all .2s}
.template-btn:hover{border-color:#6366f1;color:#c0c0d0}
.template-btn.active{border-color:#6366f1;color:#818cf8;background:#1c1c30}
.export-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid #2a2a3a}
.export-bar .btn{flex:1;justify-content:center}
.hidden{display:none!important}
@media print{
  body{background:#fff;color:#000}
  header,.stats-bar,.template-bar,.export-bar,.add-task-btn,.task-delete,.modal-overlay{display:none!important}
  .week-grid{grid-template-columns:repeat(7,1fr);gap:4px}
  .day-column{background:#fff;border:1px solid #ccc;min-height:auto;break-inside:avoid}
  .day-today{background:#fff;border-color:#333}
  .task-card{background:#f5f5f5;border:1px solid #ddd;break-inside:avoid}
  .task-check{display:none}
  .task-card.completed .task-title{text-decoration:line-through}
  .task-card.priority-high{border-left:3px solid #ef4444}
  .task-card.priority-medium{border-left:3px solid #f59e0b}
  .task-card.priority-low{border-left:3px solid #22c55e}
  @page{margin:10mm}
}
.tooltip{position:relative}
.tooltip::after{content:attr(data-tip);position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:11px;padding:4px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.tooltip:hover::after{opacity:1}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:300;animation:toastIn .3s ease,toastOut .3s ease 1.7s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
.progress-bar{height:6px;background:#2a2a3a;border-radius:3px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,#6366f1,#818cf8);border-radius:3px;transition:width .3s}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="周计划表">
  <meta property="og:description" content="周计划表工具，合理安排每周时间和任务">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/weekly-planner/">
</head>
<body>

<header>
<h1>周计划表</h1>
<div class="week-nav">
<button onclick="prevWeek()" title="上一周">&larr;</button>
<span class="week-label" id="weekLabel"></span>
<button onclick="nextWeek()" title="下一周">&rarr;</button>
<button onclick="goToday()" title="回到本周" style="font-size:12px;width:auto;padding:4px 10px;">今天</button>
</div>
<div class="header-actions">
<button class="btn btn-warning" onclick="showTemplates()">模板预设</button>
<button class="btn btn-secondary" onclick="exportImage()">导出图片</button>
<button class="btn btn-secondary" onclick="window.print()">打印</button>
</div>
</header>

<div class="main-container">
<div class="stats-bar" id="statsBar">
<div class="stat-card"><div class="stat-value" id="statTotal">0</div><div class="stat-label">总任务数</div></div>
<div class="stat-card"><div class="stat-value" id="statDone">0</div><div class="stat-label">已完成</div></div>
<div class="stat-card"><div class="stat-value" id="statRemain">0</div><div class="stat-label">待完成</div></div>
<div class="stat-card"><div class="stat-value" id="statPercent">0%</div><div class="stat-label">完成率</div></div>
<div class="stat-card"><div class="stat-value" id="statScore">0</div><div class="stat-label">生产力评分</div><div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0"></div></div></div>
</div>

<div class="template-bar" id="templateBar">
<span style="font-size:13px;color:#888;margin-right:8px;">快速模板：</span>
<button class="template-btn" onclick="applyTemplate('work')">工作日</button>
<button class="template-btn" onclick="applyTemplate('study')">学习周</button>
<button class="template-btn" onclick="applyTemplate('fitness')">健身周</button>
<button class="template-btn" onclick="applyTemplate('social')">社交周</button>
<button class="template-btn btn-danger" onclick="clearWeek()" style="margin-left:auto">清空本周</button>
</div>

<div class="week-grid" id="weekGrid"></div>

<div class="export-bar">
<button class="btn btn-secondary" onclick="exportJSON()">导出 JSON</button>
<button class="btn btn-secondary" onclick="importJSON()">导入 JSON</button>
</div>
</div>

<div class="modal-overlay hidden" id="taskModal">
<div class="modal">
<h2 id="modalTitle">添加任务</h2>

<div class="form-group">
<label>任务名称</label>
<input type="text" id="taskName" placeholder="输入任务名称...">
</div>

<div class="form-row">
<div class="form-group">
<label>时间</label>
<input type="time" id="taskTime">
</div>
<div class="form-group">
<label>日期</label>
<select id="taskDay"></select>
</div>
</div>

<div class="form-group">
<label>优先级</label>
<div class="priority-dots">
<span class="priority-dot active" data-p="high" onclick="setPriority('high',this)" title="高"></span>
<span class="priority-dot" data-p="medium" onclick="setPriority('medium',this)" title="中"></span>
<span class="priority-dot" data-p="low" onclick="setPriority('low',this)" title="低"></span>
</div>
</div>

<div class="form-group">
<label>分类</label>
<div class="category-chips">
<span class="category-chip cat-work active" onclick="selectCategory('work',this)">工作</span>
<span class="category-chip cat-personal" onclick="selectCategory('personal',this)">个人</span>
<span class="category-chip cat-health" onclick="selectCategory('health',this)">健康</span>
<span class="category-chip cat-study" onclick="selectCategory('study',this)">学习</span>
<span class="category-chip cat-social" onclick="selectCategory('social',this)">社交</span>
</div>
</div>

<div class="form-group">
<label>备注</label>
<textarea id="taskNote" placeholder="可选备注..."></textarea>
</div>

<div class="modal-actions">
<button class="btn btn-secondary" onclick="closeModal()">取消</button>
<button class="btn btn-primary" onclick="saveTask()">保存</button>
</div>
</div>
</div>

<script>
const DAY_NAMES = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const CATEGORIES = ['work', 'personal', 'health', 'study', 'social'];
const CAT_LABELS = { work: '工作', personal: '个人', health: '健康', study: '学习', social: '社交' };

let currentMonday = getMonday(new Date());
let selectedPriority = 'high';
let selectedCategory = 'work';
let editingTaskId = null;
let editingDayIndex = null;

function getMonday(d) {
const date = new Date(d);
const day = date.getDay();
const diff = day === 0 ? -6 : 1 - day;
date.setDate(date.getDate() + diff);
date.setHours(0, 0, 0, 0);
return date;
}

function getWeekKey() {
const d = new Date(currentMonday);
return d.getFullYear() + '-W' + getWeekNumber(d);
}

function getWeekNumber(d) {
const start = new Date(d.getFullYear(), 0, 1);
const diff = (d - start) / 86400000;
return Math.ceil((diff + start.getDay() + 1) / 7);
}

function getDayDate(offset) {
const d = new Date(currentMonday);
d.setDate(d.getDate() + offset);
return d;
}

function getDayKey(offset) {
const d = getDayDate(offset);
return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function loadData() {
try { return JSON.parse(localStorage.getItem('weekly_planner_data') || '{}'); }
catch(e) { return {}; }
}

function saveData(data) {
localStorage.setItem('weekly_planner_data', JSON.stringify(data));
}

function getTasks(dayIndex) {
const data = loadData();
const key = getDayKey(dayIndex);
return data[key] || [];
}

function setTasks(dayIndex, tasks) {
const data = loadData();
const key = getDayKey(dayIndex);
if (tasks.length === 0) {
delete data[key];
} else {
data[key] = tasks;
}
saveData(data);
}

function prevWeek() {
currentMonday.setDate(currentMonday.getDate() - 7);
renderAll();
}

function nextWeek() {
currentMonday.setDate(currentMonday.getDate() + 7);
renderAll();
}

function goToday() {
currentMonday = getMonday(new Date());
renderAll();
}

function renderAll() {
updateWeekLabel();
renderGrid();
updateStats();
}

function updateWeekLabel() {
const end = new Date(currentMonday);
end.setDate(end.getDate() + 6);
const fmt = d => d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate();
document.getElementById('weekLabel').textContent = fmt(new Date(currentMonday)) + ' - ' + fmt(end);
}

function renderGrid() {
const grid = document.getElementById('weekGrid');
const today = new Date();
today.setHours(0, 0, 0, 0);
let html = '';
for (let i = 0; i < 7; i++) {
const date = getDayDate(i);
const dayKey = getDayKey(i);
const isToday = date.getTime() === today.getTime();
const tasks = getTasks(i);
const dateStr = (date.getMonth()+1) + '/' + date.getDate();
html += '<div class="day-column' + (isToday ? ' day-today' : '') + '" data-day="' + i + '"';
html += ' ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">';
html += '<div class="day-header"><span class="day-name">' + DAY_NAMES[i] + '</span><span class="day-date">' + dateStr + '</span></div>';
html += '<div class="day-tasks" id="tasks-' + i + '">';
tasks.forEach((t, idx) => {
html += renderTaskCard(t, i, idx);
});
html += '</div>';
html += '<button class="add-task-btn" onclick="openTaskModal(' + i + ')">+ 添加任务</button>';
html += '</div>';
}
grid.innerHTML = html;
}

function renderTaskCard(task, dayIndex, taskIndex) {
const checked = task.completed ? ' checked' : '';
const catClass = 'cat-' + task.category;
const prioClass = task.priority ? 'priority-' + task.priority : '';
const timeHtml = task.time ? '<span class="task-time">' + task.time + '</span>' : '';
return '<div class="task-card ' + prioClass + (task.completed ? ' completed' : '') + '" ' +
'draggable="true" data-day="' + dayIndex + '" data-index="' + taskIndex + '" ' +
'data-id="' + (task.id || '') + '" ' +
'ondragstart="handleDragStart(event)" ondragend="handleDragEnd(event)">' +
'<div class="task-header">' +
'<div class="task-check' + checked + '" onclick="toggleTask(' + dayIndex + ',' + taskIndex + ')">' + (task.completed ? '✓' : '') + '</div>' +
'<span class="task-title">' + escapeHtml(task.title) + '</span>' +
timeHtml +
'<span class="task-category ' + catClass + '">' + (CAT_LABELS[task.category] || task.category) + '</span>' +
'<button class="task-delete" onclick="deleteTask(' + dayIndex + ',' + taskIndex + ')" title="删除">×</button>' +
'</div>' +
'</div>';
}

function escapeHtml(str) {
const d = document.createElement('div');
d.textContent = str;
return d.innerHTML;
}

function openTaskModal(dayIndex, taskIndex) {
editingDayIndex = dayIndex;
editingTaskId = null;
const tasks = getTasks(dayIndex);
if (taskIndex !== undefined && tasks[taskIndex]) {
editingTaskId = taskIndex;
document.getElementById('modalTitle').textContent = '编辑任务';
document.getElementById('taskName').value = tasks[taskIndex].title;
document.getElementById('taskTime').value = tasks[taskIndex].time || '';
document.getElementById('taskNote').value = tasks[taskIndex].note || '';
selectedPriority = tasks[taskIndex].priority || 'high';
selectedCategory = tasks[taskIndex].category || 'work';
} else {
document.getElementById('modalTitle').textContent = '添加任务';
document.getElementById('taskName').value = '';
document.getElementById('taskTime').value = '';
document.getElementById('taskNote').value = '';
selectedPriority = 'high';
selectedCategory = 'work';
}
document.querySelectorAll('.priority-dot').forEach(d => d.classList.toggle('active', d.dataset.p === selectedPriority));
document.querySelectorAll('.category-chip').forEach(c => c.classList.toggle('active', c.textContent === CAT_LABELS[selectedCategory]));
renderDaySelect(dayIndex);
document.getElementById('taskModal').classList.remove('hidden');
document.getElementById('taskName').focus();
}

function renderDaySelect(selectedDay) {
const sel = document.getElementById('taskDay');
sel.innerHTML = '';
for (let i = 0; i < 7; i++) {
const d = getDayDate(i);
const dateStr = (d.getMonth()+1) + '/' + d.getDate();
sel.innerHTML += '<option value="' + i + '"' + (i === selectedDay ? ' selected' : '') + '>' + DAY_NAMES[i] + ' ' + dateStr + '</option>';
}
}

function closeModal() {
document.getElementById('taskModal').classList.add('hidden');
editingDayIndex = null;
editingTaskId = null;
}

function setPriority(p, el) {
selectedPriority = p;
document.querySelectorAll('.priority-dot').forEach(d => d.classList.remove('active'));
el.classList.add('active');
}

function selectCategory(cat, el) {
selectedCategory = cat;
document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
el.classList.add('active');
}

function saveTask() {
const title = document.getElementById('taskName').value.trim();
if (!title) { showToast('请输入任务名称'); return; }
const time = document.getElementById('taskTime').value;
const note = document.getElementById('taskNote').value.trim();
const dayIdx = parseInt(document.getElementById('taskDay').value);
const task = {
id: Date.now().toString(),
title: title,
time: time || '',
note: note,
priority: selectedPriority,
category: selectedCategory,
completed: false
};
const tasks = getTasks(dayIdx);
if (editingTaskId !== null && editingDayIndex !== null && editingDayIndex === dayIdx) {
tasks[editingTaskId] = task;
} else if (editingTaskId !== null && editingDayIndex !== null && editingDayIndex !== dayIdx) {
const oldTasks = getTasks(editingDayIndex);
oldTasks.splice(editingTaskId, 1);
setTasks(editingDayIndex, oldTasks);
tasks.push(task);
} else {
tasks.push(task);
}
tasks.sort((a, b) => {
if (a.time && b.time) return a.time.localeCompare(b.time);
if (a.time) return -1;
if (b.time) return 1;
return 0;
});
setTasks(dayIdx, tasks);
closeModal();
renderAll();
showToast('任务已保存');
}

function toggleTask(dayIndex, taskIndex) {
const tasks = getTasks(dayIndex);
if (tasks[taskIndex]) {
tasks[taskIndex].completed = !tasks[taskIndex].completed;
setTasks(dayIndex, tasks);
renderAll();
}
}

function deleteTask(dayIndex, taskIndex) {
if (!confirm('确定删除此任务吗？')) return;
const tasks = getTasks(dayIndex);

let dragDay = null;
let dragIndex = null;
function handleDragStart(e) {
dragDay = parseInt(e.target.closest('.task-card').dataset.day);
dragIndex = parseInt(e.target.closest('.task-card').dataset.index);
e.target.closest('.task-card').classList.add('dragging');
e.dataTransfer.effectAllowed = 'move';
e.dataTransfer.setData('text/plain', dragDay + '|' + dragIndex);
}

function handleDragEnd(e) {
e.target.closest('.task-card').classList.remove('dragging');
document.querySelectorAll('.day-column').forEach(c => c.classList.remove('drag-over'));
dragDay = null;
dragIndex = null;
}

function handleDragOver(e) {
e.preventDefault();
e.dataTransfer.dropEffect = 'move';
e.currentTarget.classList.add('drag-over');
}

function handleDragLeave(e) {
e.currentTarget.classList.remove('drag-over');
}

function handleDrop(e) {
e.preventDefault();
e.currentTarget.classList.remove('drag-over');
const targetDay = parseInt(e.currentTarget.dataset.day);
const data = e.dataTransfer.getData('text/plain').split('|');
const srcDay = parseInt(data[0]);
const srcIndex = parseInt(data[1]);
if (srcDay === targetDay) return;
const srcTasks = getTasks(srcDay);
const task = srcTasks[srcIndex];
if (!task) return;
srcTasks.splice(srcIndex, 1);
setTasks(srcDay, srcTasks);
const targetTasks = getTasks(targetDay);
targetTasks.push(task);
setTasks(targetDay, targetTasks);
renderAll();
showToast('任务已移动到 ' + DAY_NAMES[targetDay]);
}

function updateStats() {
let total = 0, done = 0;
for (let i = 0; i < 7; i++) {
const tasks = getTasks(i);
total += tasks.length;
done += tasks.filter(t => t.completed).length;
}
const remain = total - done;
const pct = total > 0 ? Math.round(done / total * 100) : 0;
let score = 0;
if (total > 0) {
for (let i = 0; i < 7; i++) {
const tasks = getTasks(i);
tasks.forEach(t => {
let points = 5;
if (t.priority === 'high') points = 10;
else if (t.priority === 'medium') points = 7;
else points = 4;
if (t.completed) score += points;
});
}
score = Math.min(100, Math.round(score));
}
document.getElementById('statTotal').textContent = total;
document.getElementById('statDone').textContent = done;
document.getElementById('statRemain').textContent = remain;
document.getElementById('statPercent').textContent = pct + '%';
document.getElementById('statScore').textContent = score;
document.getElementById('progressFill').style.width = score + '%';
}

function downloadAsPNGSimple() {
const container = document.querySelector('.main-container');
const clone = container.cloneNode(true);
const w = 1200;
const scale = w / container.offsetWidth;
const style = document.createElement('style');
style.textContent = '*{color:#fff!important}body,.day-column,.stat-card,.task-card{background:#1a1a24!important}';
clone.prepend(style);
const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + Math.round(container.offsetHeight * scale) + '">' +
'<foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="transform:scale(' + scale + ');transform-origin:0 0;width:' + container.offsetWidth + 'px">' + clone.innerHTML + '</div></foreignObject></svg>';
const blob = new Blob([svg], { type: 'image/svg+xml' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = '周计划表.svg';
a.click();
URL.revokeObjectURL(url);
showToast('导出成功（SVG格式）');
}

function exportJSON() {

}
const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = '周计划表_' + getWeekKey() + '.json';
a.click();
URL.revokeObjectURL(url);
showToast('JSON 已导出');
}

function importJSON() {
const input = document.createElement('input');
input.type = 'file';
input.accept = '.json';
input.onchange = function() {
const file = this.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(e) {
try {
const imported = JSON.parse(e.target.result);
const data = loadData();
for (const key in imported) {
data[key] = imported[key];
}
saveData(data);
renderAll();
showToast('数据已导入');
} catch(err) {
showToast('导入失败：文件格式错误');
}
};
reader.readAsText(file);
};
input.click();
}

function showToast(msg) {
const existing = document.querySelector('.toast');
if (existing) existing.remove();
const toast = document.createElement('div');
toast.className = 'toast';
toast.textContent = msg;
document.body.appendChild(toast);
setTimeout(() => toast.remove(), 2000);
}
