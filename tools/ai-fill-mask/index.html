<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔤 填空补全 - Gary's Tools</title>
<meta name="description" content="文本填空补全工具，AI智能补全缺失的文字内容">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;line-height:1.6;min-height:100vh}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.8rem;font-weight:700;margin-bottom:4px}
header p{color:var(--text2);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.card-title{font-size:.95rem;font-weight:600;margin-bottom:10px;color:var(--text2)}
textarea{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;width:100%;font-size:.9rem;resize:vertical;font-family:inherit;outline:none;transition:border .2s}
textarea:focus{border-color:var(--blue)}
button{padding:9px 20px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;font-family:inherit;transition:opacity .2s}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;padding:4px 10px;border-radius:4px;font-size:.75rem;margin:2px;background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3)}
.result-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px;min-height:60px}
.result-box .label{color:var(--text2);font-size:.8rem;margin-bottom:6px}
.result-box .value{font-size:.95rem;line-height:1.7}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{background:rgba(239,68,68,.1);border:1px solid var(--red);border-radius:6px;padding:10px;color:var(--red);font-size:.82rem;margin-top:10px;display:none}
.waiting-msg{background:rgba(245,158,11,.1);border:1px solid var(--gold);border-radius:6px;padding:10px;color:var(--gold);font-size:.82rem;margin-top:10px;display:none}
.btn-group{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.prediction-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.prediction-item:last-child{border-bottom:none}
.prediction-item .rank{width:24px;height:24px;border-radius:50%;background:var(--blue);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;flex-shrink:0}
.prediction-item .token{font-weight:600;font-size:.9rem;flex:1}
.bar-wrap{background:var(--border);border-radius:4px;height:6px;overflow:hidden;flex:0 0 120px}
.bar-fill{height:100%;border-radius:4px;transition:width .5s ease;background:var(--blue)}
.prediction-item .score-text{font-size:.75rem;color:var(--text2);width:40px;text-align:right}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🔤 填空补全 - Gary's Tools">
  <meta property="og:description" content="文本填空补全工具，AI智能补全缺失的文字内容">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/ai-fill-mask/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>🔤 填空补全</h1>
<p>HuggingFace · BERT</p>
</header>
<div class="card">
<div class="card-title">输入含 [MASK] 的句子</div>
<textarea id="inputText" rows="4" placeholder="请输入包含[MASK]标记的英文句子...&#10;例如：The capital of France is [MASK]."></textarea>
<div class="btn-group">
<button id="predictBtn">🔍 预测</button>
<button id="clearBtn" style="border-color:var(--border);background:transparent;color:var(--text)">清空</button>
</div>
<div id="waitingMsg" class="waiting-msg">⏳ 模型加载中，请稍候...</div>
<div id="errorMsg" class="error-msg"></div>
<div id="resultArea" style="display:none">
<div class="result-box">
<div class="label">预测结果（Top 5）</div>
<div id="predictionsList"></div>
</div>
</div>
</div>
</div>
<script>
(function(){
'use strict';
var input=document.getElementById('inputText');
var predictBtn=document.getElementById('predictBtn');
var clearBtn=document.getElementById('clearBtn');
var resultArea=document.getElementById('resultArea');
var predictionsList=document.getElementById('predictionsList');
var errorMsg=document.getElementById('errorMsg');
var waitingMsg=document.getElementById('waitingMsg');
var API_URL='https://api.siliconflow.cn/v1/chat/completions';
var API_KEY=localStorage.getItem('sf_api_key')||'';
var MODEL='Qwen/Qwen2-7B-Instruct';

function predict(){
  var text=input.value.trim();
  if(!text){showError('请输入文本');return;}
  if(text.indexOf('[MASK]')===-1&&text.indexOf('___')===-1){showError('文本必须包含 [MASK] 或 ___ 标记');return;}
  if(!API_KEY){showError('请先设置 API Key');return;}
  setLoading(true);
  hideError();
  hideWaiting();
  resultArea.style.display='none';
  var prompt=text.replace(/\[MASK\]|___/g,'______');
  fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
    body:JSON.stringify({model:MODEL,messages:[{role:'system',content:'你是一个填空补全助手。请根据上下文，为文中的空格（______）提供5个最可能的填空答案，每个答案一行，格式为：答案 (概率%)。'},{role:'user',content:prompt}],max_tokens:200,temperature:0.3})
  })
  .then(function(r){
    if(!r.ok)return r.json().then(function(d){throw new Error(d.error?.message||'请求失败')});
    return r.json();
  })
  .then(function(data){
    setLoading(false);
    hideWaiting();
    if(data&&data.choices&&data.choices[0]&&data.choices[0].message){
      resultArea.style.display='block';
      var content=data.choices[0].message.content;
      var lines=content.split('\n').filter(function(l){return l.trim();});
      var html='';
      var idx=1;
      lines.forEach(function(line){
        var match=line.match(/^(.+?)\s*\((\d+)%\)/);
        if(match){
          html+='<div class="prediction-item"><div class="rank">'+idx+'</div><div class="token">'+match[1].trim()+'</div><div class="bar-wrap"><div class="bar-fill" style="width:'+match[2]+'%"></div></div><div class="score-text">'+match[2]+'%</div></div>';
          idx++;
        }else if(line.trim()){
          html+='<div class="prediction-item"><div class="rank">'+idx+'</div><div class="token">'+line.trim()+'</div><div class="bar-wrap"><div class="bar-fill" style="width:'+Math.max(80-idx*12,20)+'%"></div></div><div class="score-text">'+Math.max(80-idx*12,20)+'%</div></div>';
          idx++;
        }
      });
      if(!html)html='<div style="color:var(--text2);font-size:.85rem">'+content+'</div>';
      predictionsList.innerHTML=html;
    }else{
      showError('无法解析返回结果');
    }
  })
  .catch(function(err){
    setLoading(false);
    showError(err.message||'请求失败，请稍后重试');
  });
}

function setLoading(v){predictBtn.disabled=v;predictBtn.textContent=v?'⏳ 预测中...':'🔍 预测';}
function showError(msg){errorMsg.textContent=msg;errorMsg.style.display='block';}
function hideError(){errorMsg.style.display='none';}
function showWaiting(){waitingMsg.style.display='block';}
function hideWaiting(){waitingMsg.style.display='none';}

predictBtn.addEventListener('click',predict);
clearBtn.addEventListener('click',function(){
  input.value='';
  resultArea.style.display='none';
  hideError();
  hideWaiting();
});
input.addEventListener('keydown',function(e){
  if(e.key==='Enter' && e.ctrlKey)predict();
});
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
