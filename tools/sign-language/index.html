<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手语学习卡 - 中国手语学习</title>
<style>
:root {
  --bg: #0d1117;
  --card-bg: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --text-secondary: #8b949e;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --green: #3fb950;
  --red: #f85149;
  --orange: #d2991d;
  --purple: #a371f7;
  --radius: 12px;
  --transition: 0.25s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
.container { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }

/* Header */
.header { text-align: center; padding: 48px 0 32px; }
.header h1 { font-size: 2.2rem; color: #fff; margin-bottom: 8px; letter-spacing: 2px; }
.header .subtitle { color: var(--text-secondary); font-size: 1rem; }
.header .emoji { font-size: 2.8rem; display: block; margin-bottom: 8px; }

/* Navigation */
.nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 32px; }
.nav-btn {
  padding: 8px 18px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--card-bg);
  color: var(--text);
  cursor: pointer;
  font-size: 0.92rem;
  transition: all var(--transition);
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent-hover); }
.nav-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Mode tabs */
.mode-tabs { display: flex; gap: 8px; margin-bottom: 24px; justify-content: center; }
.mode-tab {
  padding: 10px 28px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card-bg);
  color: var(--text);
  cursor: pointer;
  font-size: 0.95rem;
  transition: all var(--transition);
}
.mode-tab:hover { border-color: var(--accent); }
.mode-tab.active { background: var(--purple); color: #fff; border-color: var(--purple); }

/* Cards Grid */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  min-height: 160px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(88,166,255,0.1); }
.card .card-title { font-size: 1.2rem; font-weight: 600; color: #fff; margin-bottom: 6px; }
.card .card-tag {
  display: inline-block;
  font-size: 0.75rem;
  padding: 2px 10px;
  border-radius: 10px;
  background: rgba(88,166,255,0.15);
  color: var(--accent);
  margin-bottom: 10px;
}
.card .card-desc {
  color: var(--text-secondary);
  font-size: 0.9rem;
  line-height: 1.5;
}
.card.flipped .card-front { display: none; }
.card.flipped .card-back { display: block; }
.card .card-front { display: block; }
.card .card-back { display: none; }
.card .card-back .answer {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--green);
  margin-bottom: 8px;
}
.card .flip-hint {
  position: absolute;
  top: 10px;
  right: 14px;
  font-size: 0.75rem;
  color: var(--text-secondary);
  opacity: 0.6;
}

/* Quiz */
.quiz-container { text-align: center; }
.quiz-score {
  font-size: 1.1rem;
  color: var(--text-secondary);
  margin-bottom: 20px;
}
.quiz-score span { color: var(--accent); font-weight: 700; }
.quiz-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 24px;
  margin-bottom: 20px;
  min-height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.quiz-card .desc { font-size: 1.1rem; color: var(--text); line-height: 1.7; }
.quiz-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  max-width: 500px;
  margin: 0 auto;
}
.quiz-option {
  padding: 14px 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card-bg);
  color: var(--text);
  cursor: pointer;
  font-size: 1rem;
  transition: all var(--transition);
}
.quiz-option:hover { border-color: var(--accent); background: rgba(88,166,255,0.08); }
.quiz-option.correct { background: rgba(63,185,80,0.2); border-color: var(--green); color: var(--green); }
.quiz-option.wrong { background: rgba(248,81,73,0.2); border-color: var(--red); color: var(--red); }
.quiz-feedback {
  margin-top: 16px;
  font-size: 1.1rem;
  min-height: 30px;
}

/* Alphabet Chart */
.alphabet-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.alpha-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.alpha-card .letter {
  font-size: 2rem;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 6px;
}
.alpha-card .hand-desc { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; }

/* Phrases */
.phrases-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}
.phrase-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}
.phrase-card .phrase-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: #fff;
  margin-bottom: 8px;
}
.phrase-card .phrase-desc { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.6; }

/* Tips */
.tips-list li {
  padding: 14px 18px;
  margin-bottom: 10px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  list-style: none;
  font-size: 0.95rem;
  color: var(--text-secondary);
  line-height: 1.7;
}
.tips-list li strong { color: var(--accent-hover); }
.tips-list li::before {
  content: "💡 ";
  margin-right: 6px;
}

/* Footer */
.footer {
  text-align: center;
  padding: 40px 0 20px;
  color: var(--text-secondary);
  font-size: 0.85rem;
}

/* Button */
.btn {
  padding: 12px 32px;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 1rem;
  transition: all var(--transition);
  background: var(--accent);
  color: #fff;
}
.btn:hover { background: var(--accent-hover); }
.btn-secondary {
  background: var(--card-bg);
  border: 1px solid var(--border);
  color: var(--text);
}
.btn-secondary:hover { border-color: var(--accent); }

/* Sections */
.section { display: none; }
.section.active { display: block; }

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 0.95rem;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

@media (max-width: 600px) {
  .header h1 { font-size: 1.6rem; }
  .quiz-options { grid-template-columns: 1fr; }
  .cards-grid { grid-template-columns: 1fr; }
  .phrases-list { grid-template-columns: 1fr; }
  .alphabet-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <span class="emoji">🤟</span>
    <h1>手语学习卡</h1>
    <p class="subtitle">中国手语 · 互动学习 · 翻转卡片 · 测验模式</p>
  </header>

</div>

      { title: '鱼', tag: '动物', desc: '右手平伸，手指并拢，在胸前做S形游动，模仿鱼在水中摆尾游动的姿态。' },
      { title: '兔子', tag: '动物', desc: '双手食指和中指向上伸直并拢（其余手指握拳），放在头顶两侧做耳朵状，向前摆动。' },
      { title: '老虎', tag: '动物', desc: '双手五指弯曲成爪状，在面部前方做扑抓动作，同时配合张嘴露齿的表"王"字。也可以先在前额画一个"王"字。' },
      { title: '马', tag: '动物', desc: '右手拇指与小指向上伸直（其余手指握拳），手背朝前，小指翘起模仿马耳朵，在胸前向前移动。' },
      { title: '鸡', tag: '动物', desc: '右手拇指与食指捏合在嘴前方，其余手指自然张开，模仿鸡的尖嘴，做啄食动作。' },
    ]
  },
  emotions: {
    title: '情绪',
    items: [
      { title: '开心', tag: '情绪', desc: '双手拇指竖起朝上，双手在胸前上下交替摆动，面带微笑，表示内心的愉悦。' },
      { title: '难过', tag: '情绪', desc: '双手中指和无名指弯曲，其余手指自然伸直，从眼角向下滑动，模仿泪水流下，表情悲伤。' },
      { title: '生气', tag: '情绪', desc: '双手握拳在胸前用力向外伸展或上下抖动，面部呈现愤怒表情，眼神凶一些。' },
      { title: '害怕', tag: '情绪', desc: '双手在胸前微屈手指，身体稍向后缩，双手微微颤抖，面部呈惊恐状。' },
      { title: '惊讶', tag: '情绪', desc: '双手在脸颊两侧突然张开，五指张开，嘴巴微微张开，瞪大眼睛，表现吃惊。' },
      { title: '爱', tag: '情绪', desc: '双手在胸前交叉，掌心贴在胸口，微微向怀中压，表示"爱在心中"。也可双手拇食指交叉成心形。' },
      { title: '紧张', tag: '情绪', desc: '双手握拳微微颤抖，肩膀耸起，面部肌肉紧绷，呼吸急促的表情配合。' },
      { title: '困', tag: '情绪', desc: '右手在嘴前方做打哈欠的动作，然后手在眼前由上往下弧线划过，表示眼皮沉重想睡。' },
    ]
  }
};

const categories = [
  { key: 'letters', label: '字母 A-Z' },
  { key: 'numbers', label: '数字 0-10' },
  { key: 'greetings', label: '日常问候' },
  { key: 'family', label: '家庭' },
  { key: 'food', label: '食物' },
  { key: 'animals', label: '动物' },
  { key: 'emotions', label: '情绪' },
];

let currentCategory = 'letters';
let currentMode = 'cards';
let quizItems = [];
let quizIndex = 0;
let quizScore = 0;
let quizTotal = 0;
let quizAnswered = false;

// Init nav
const navEl = document.getElementById('nav');
categories.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (cat.key === currentCategory ? ' active' : '');
  btn.textContent = cat.label;
  btn.addEventListener('click', () => {
    currentCategory = cat.key;
    updateNav();
    renderContent();
  });
  navEl.appendChild(btn);
});

// Mode tabs
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    currentMode = tab.dataset.mode;
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderContent();
  });
});

function updateNav() {
  document.querySelectorAll('.nav-btn').forEach((btn, i) => {
    btn.classList.toggle('active', categories[i].key === currentCategory);
  });
}

function renderContent() {
  const container = document.getElementById('content');
  const data = signData[currentCategory];

  if (currentMode === 'cards') {
    renderCards(container, data);
  } else if (currentMode === 'flip') {
    renderFlip(container, data);
  } else if (currentMode === 'quiz') {
    initQuiz(data);
    renderQuiz(container, data);
  }
}

function renderCards(container, data) {
  container.innerHTML = `<div class="cards-grid">${data.items.map(item => `
    <div class="card">
      <div class="card-tag">${item.tag}</div>
      <div class="card-title">${item.title}</div>
      <div class="card-desc">${item.desc}</div>
    </div>
  `).join('')}</div>`;
}

function renderFlip(container, data) {
  container.innerHTML = `<div class="cards-grid">${data.items.map((item, i) => `
    <div class="card flip-card" data-index="${i}" onclick="flipCard(this)">
      <span class="flip-hint">点击翻转</span>
      <div class="card-front">
        <div class="card-tag">${item.tag}</div>
        <div class="card-desc">${item.desc}</div>
        <div style="margin-top:8px; color:var(--text-secondary); font-size:0.8rem;">🤔 这是什么词？</div>
      </div>
      <div class="card-back">
        <div class="answer">${item.title}</div>
        <div class="card-desc" style="margin-top:6px;">${item.desc}</div>
      </div>
    </div>
  `).join('')}</div>`;
}

function flipCard(card) {
  card.classList.toggle('flipped');
}

// Quiz
function initQuiz(data) {
  quizItems = shuffleArray([...data.items]);
  quizIndex = 0;
  quizScore = 0;
  quizTotal = quizItems.length;
  quizAnswered = false;
}

function renderQuiz(container, data) {
  if (quizIndex >= quizItems.length) {
    container.innerHTML = `
      <div class="quiz-container">
        <h3 style="color:#fff;margin-bottom:16px;">🎉 测验完成！</h3>
        <p style="font-size:1.2rem;margin-bottom:24px;">你的得分：<span style="color:var(--accent);font-weight:700;">${quizScore}</span> / ${quizTotal}</p>
        <button class="btn" onclick="initQuiz(signData[currentCategory]);renderQuiz(document.getElementById('content'));">再来一次</button>
      </div>`;
    return;
  }

  const current = quizItems[quizIndex];
  const choices = generateChoices(current);

  container.innerHTML = `
    <div class="quiz-container">
      <div class="quiz-score">第 <span>${quizIndex + 1}</span> / ${quizTotal} 题 &nbsp;|&nbsp; 得分：<span>${quizScore}</span></div>
      <div class="quiz-card">
        <div class="desc">${current.desc}</div>
      </div>
      <div class="quiz-options" id="quizOptions">
        ${choices.map((c, i) => `<button class="quiz-option" data-answer="${c}" onclick="answerQuiz(this, '${current.title.replace(/'/g, "\\'")}')">${c}</button>`).join('')}
      </div>
      <div class="quiz-feedback" id="quizFeedback"></div>
    </div>`;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateChoices(correct) {
  const allItems = signData[currentCategory].items;
  const wrongs = allItems.filter(i => i.title !== correct.title).map(i => i.title);
  const picked = [correct.title];
  const shuffled = shuffleArray(wrongs);
  for (let i = 0; i < shuffled.length && picked.length < 4; i++) {
    if (!picked.includes(shuffled[i])) picked.push(shuffled[i]);
  }
  return shuffleArray(picked);
}

function answerQuiz(btn, correctAnswer) {
  if (quizAnswered) return;
  quizAnswered = true;

  const selected = btn.dataset.answer;
  const isCorrect = selected === correctAnswer;

  document.querySelectorAll('.quiz-option').forEach(opt => {
    opt.style.pointerEvents = 'none';
    if (opt.dataset.answer === correctAnswer) opt.classList.add('correct');
  });

  if (!isCorrect) btn.classList.add('wrong');

  const feedback = document.getElementById('quizFeedback');
  if (isCorrect) {
    quizScore++;
    feedback.innerHTML = '<span style="color:var(--green);">✅ 正确！' + correctAnswer + '</span>';
  } else {
    feedback.innerHTML = '<span style="color:var(--red);">❌ 错误！正确答案是：' + correctAnswer + '</span>';
  }

  setTimeout(() => {
    quizIndex++;
    quizAnswered = false;
    renderQuiz(document.getElementById('content'));
  }, 1800);
}

// Toast
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Init
renderContent();
</script>
</body>
</html>
