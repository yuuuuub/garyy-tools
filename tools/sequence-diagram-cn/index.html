<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔄 时序图 - Sequence Diagram</title>
<meta name="description" content="创建UML时序图，可视化对象间的消息交互流程">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔄 时序图 - Sequence Diagram">
<meta property="og:description" content="创建UML时序图，可视化对象间的消息交互流程">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/sequence-diagram-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;padding:16px}
.hdr{text-align:center;margin-bottom:20px}
.hdr h1{font-size:1.6rem;color:var(--accent)}
.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:1rem;color:var(--accent);margin-bottom:10px}
textarea{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;min-height:140px;outline:none}
textarea:focus{border-color:var(--accent)}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600}
button:hover{opacity:.9}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
#canvas{display:block;width:100%;border-radius:8px}
.help{font-size:.75rem;color:var(--text2);margin-top:8px;line-height:1.8}
.help code{background:var(--bg);padding:1px 6px;border-radius:4px;font-size:.75rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>

<div class="hdr"><h1>🔄 时序图</h1><p>UML时序图可视化</p></div>

<div class="card">
<h2>数据输入</h2>
<textarea id="dataInput">参与者: 用户
参与者: 前端
参与者: 服务器
参与者: 数据库

用户->>前端: 点击登录
前端->>服务器: POST /api/login
服务器->>数据库: 查询用户
数据库-->>服务器: 返回用户数据
服务器-->>前端: 返回JWT令牌
前端-->>用户: 跳转首页

opt 有未读消息
  服务器->>前端: 推送通知
  前端-->>用户: 显示通知
end</textarea>
<div class="help">
语法说明：<code>参与者: 名称</code> | <code>A->>B: 同步消息</code> | <code>A-->>B: 返回消息</code> | <code>opt 条件</code>/<code>alt 条件</code>/<code>loop 循环</code> ... <code>end</code>
</div>
<div class="btn-row">
<button onclick="generate()">生成时序图</button>
<button class="sec" onclick="loadSample()">加载示例</button>
<button class="sec" onclick="exportPNG()">💾 导出PNG</button>
</div>
</div>

<div class="card">
<h2>时序图预览</h2>
<canvas id="canvas" height="500"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = canvas.parentElement.clientWidth - 32;
}
resize();
window.addEventListener('resize', () => { resize(); generate(); });

function generate() {
  const lines = document.getElementById('dataInput').split('\n').map(l => l.trim()).filter(l => l);
  const participants = [];
  const messages = [];
  const fragments = [];
  let currentFrag = null;

  lines.forEach(line => {
    if(line.startsWith('参与者:') || line.startsWith('Actor:')) {
      participants.push(line.split(':')[1].trim());
    } else if(line === 'end' && currentFrag) {
      currentFrag = null;
    } else if(line.startsWith('opt ') || line.startsWith('alt ') || line.startsWith('loop ')) {
      const label = line.replace(/^(opt|alt|loop)\s+/, '');
      currentFrag = { type: line.split(' ')[0], label, messages: [] };
      fragments.push(currentFrag);
    } else if(line.includes('->>') || line.includes('-->>') || line.includes('->') || line.includes('-->')) {
      const sync = line.includes('->>');
      const ret = line.includes('-->');
      const sep = sync ? '-->>' : (ret ? '-->' : (line.includes('->>') ? '->>' : '->'));
      const parts = line.split(sep);
      if(parts.length >= 2) {
        const msg = { from: parts[0].trim(), to: parts[1].split(':')[0].trim(), label: parts[1].split(':').slice(1).join(':').trim(), type: ret ? 'return' : (sync ? 'sync' : 'async') };
        if(currentFrag) currentFrag.messages.push(msg);
        else messages.push(msg);
      }
    }
  });

  const partW = 120;
  const startX = 60;
  const msgH = 50;
  const headerH = 60;
  const actW = 16;
  const bottomPad = 40;

  const totalMsgs = [...messages, ...fragments.flatMap(f => f.messages)];
  const canvasH = headerH + totalMsgs.length * msgH + bottomPad + fragments.length * 30;
  canvas.height = Math.max(400, canvasH);

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Draw participant boxes and lifelines
  participants.forEach((p, i) => {
    const x = startX + i * partW + partW/2;

    // Box
    ctx.fillStyle = '#161b22';
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 2;
    roundRect(ctx, x - 45, 10, 90, 36, 6);

    ctx.fillStyle = '#e6edf3';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p, x, 28);

    // Lifeline
    ctx.beginPath();
    ctx.setLineDash([5,5]);
    ctx.moveTo(x, 46);
    ctx.lineTo(x, canvas.height - 20);
    ctx.strokeStyle = 'rgba(139,148,158,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Draw messages
  let msgY = headerH;
  const allMsgs = [...messages];

  allMsgs.forEach((msg, i) => {
    const fromIdx = participants.indexOf(msg.from);
    const toIdx = participants.indexOf(msg.to);
    if(fromIdx < 0 || toIdx < 0) return;

    const fromX = startX + fromIdx * partW + partW/2;
    const toX = startX + toIdx * partW + partW/2;

    // Activation bar
    const barX = toX - actW/2;
    ctx.fillStyle = 'rgba(59,130,246,0.2)';
    ctx.fillRect(barX, msgY - 5, actW, msgH - 10);
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, msgY - 5, actW, msgH - 10);

    // Arrow
    const isReturn = msg.type === 'return';
    ctx.beginPath();
    ctx.moveTo(fromX, msgY);
    ctx.lineTo(toX, msgY);
    ctx.strokeStyle = isReturn ? 'rgba(139,148,158,0.6)' : '#3b82f6';
    ctx.lineWidth = 2;
    if(isReturn) ctx.setLineDash([6,4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Arrowhead
    const dir = toX > fromX ? 1 : -1;
    if(!isReturn) {
      ctx.beginPath();
      ctx.moveTo(toX, msgY);
      ctx.lineTo(toX - dir*10, msgY - 5);
      ctx.lineTo(toX - dir*10, msgY + 5);
      ctx.closePath();
      ctx.fillStyle = '#3b82f6';
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(toX, msgY);
      ctx.lineTo(toX - dir*10, msgY - 5);
      ctx.stroke();
    }

    // Label
    ctx.fillStyle = '#e6edf3';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(msg.label, (fromX + toX)/2, msgY - 4);

    msgY += msgH;
  });

  // Draw fragments
  fragments.forEach(frag => {
    const fragX = startX - 10;
    const fragW = participants.length * partW + 20;
    const fragH = frag.messages.length * msgH + 30;

    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.strokeRect(fragX, msgY - 5, fragW, fragH);

    // Label tab
    ctx.fillStyle = '#f59e0b';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`[${frag.type.toUpperCase()}] ${frag.label}`, fragX + 4, msgY);

    msgY += 20;

    frag.messages.forEach(msg => {
      const fromIdx = participants.indexOf(msg.from);
      const toIdx = participants.indexOf(msg.to);
      if(fromIdx < 0 || toIdx < 0) return;

      const fromX = startX + fromIdx * partW + partW/2;
      const toX = startX + toIdx * partW + partW/2;

      ctx.beginPath();
      ctx.moveTo(fromX, msgY);
      ctx.lineTo(toX, msgY);
      ctx.strokeStyle = msg.type==='return' ? 'rgba(139,148,158,0.6)' : '#3b82f6';
      ctx.lineWidth = 2;
      if(msg.type==='return') ctx.setLineDash([6,4]);
      ctx.stroke();
      ctx.setLineDash([]);

      const dir = toX > fromX ? 1 : -1;
      if(msg.type !== 'return') {
        ctx.beginPath();
        ctx.moveTo(toX, msgY);
        ctx.lineTo(toX - dir*10, msgY - 5);
        ctx.lineTo(toX - dir*10, msgY + 5);
        ctx.closePath();
        ctx.fillStyle = '#3b82f6';
        ctx.fill();
      }

      ctx.fillStyle = '#e6edf3';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(msg.label, (fromX + toX)/2, msgY - 4);

      msgY += msgH;
    });
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

function loadSample() {
  document.getElementById('dataInput').value = `参与者: 用户
参与者: 浏览器
参与者: 网关
参与者: 用户服务
参与者: 数据库

用户->>浏览器: 输入账号密码
浏览器->>网关: POST /auth/login
网关->>用户服务: 验证凭证
用户服务->>数据库: SELECT * FROM users
数据库-->>用户服务: 返回用户记录
用户服务-->>网关: 返回JWT令牌
网关-->>浏览器: 200 OK + Token
浏览器-->>用户: 跳转首页

loop 每30秒
  浏览器->>网关: GET /api/profile
  网关->>用户服务: 查询用户信息
  用户服务-->>网关: 返回用户数据
  网关-->>浏览器: 200 OK
end

opt 密码错误
  用户服务-->>网关: 401 Unauthorized
  网关-->>浏览器: 401 错误
  浏览器-->>用户: 提示密码错误
end`;
  generate();
}

function exportPNG() {
  const link = document.createElement('a');
  link.download = 'sequence-diagram.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

generate();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
