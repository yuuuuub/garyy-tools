<div class="container"><h1>🖌️ 毛笔书法</h1><p class="sub">笔法技巧 · 书法流派 · 名家名作 · 书写工具</p>

<script>
var data=[
{title:'湖笔',era:'元代至今',cat:'工具',tags:['浙江','善琏','四德'],desc:'中国四大名笔之首，产于浙江湖州善琏镇，以"尖、齐、圆、健"四德著称。',detail:'湖笔选料精细，工艺复杂，需经128道工序。笔头分紫毫、兼毫、羊毫三大类，其中紫毫最为名贵。湖笔以"尖"（笔锋尖锐）、"齐"（笔毫齐整）、"圆"（笔头圆润）、"健"（弹性有力）为品质标准。',ref:'《湖笔志》'},
{title:'宣笔',era:'唐代至今',cat:'工具',tags:['安徽','宣城','改良'],desc:'产于安徽宣城，历史比湖笔更早，唐代曾为贡品。',detail:'宣笔以中山兔毫为上品，相传蒙恬改良毛笔即在宣城。宣笔笔锋劲健，适合书写楷书和行书。宣笔制作讲究"千万毛中拣一毫"，精选兔毛、羊毛等天然材料。',ref:'《宣州府志》'},
{title:'狼毫',era:'明代至今',cat:'工具',tags:['黄鼠狼','弹性','小楷'],desc:'以黄鼠狼尾毛制成，弹性强，适合小楷和行草。',detail:'狼毫笔头取自黄鼠狼尾巴毛，以东北产者为佳。狼毫弹性好，笔锋锐利，适合书写精致的小楷和流畅的行草。但狼毫较脆，不耐久用，通常作为"兼毫"的笔心。',ref:'《笔论》'},
{title:'羊毫',era:'宋代至今',cat:'工具',tags:['绵羊','柔软','大字'],desc:'以山羊毛制成，柔软吸墨，适合写大字和隶书。',detail:'羊毫取自湖州一带的山羊毛，以"细、圆、润、坚"为上品。羊毫柔软，蓄墨量大，适合书写大字和隶书。清代碑学兴起后，羊毫因便于书写粗犷的碑体而大受欢迎。',ref:'《湖笔谱》'},
{title:'中锋用笔',era:'秦汉至今',cat:'笔法',tags:['正锋','核心','力透纸背'],desc:'笔锋行于笔画中央，是书法最基本的用笔方法。',detail:'中锋用笔要求笔尖始终运行在笔画的中心线上，墨汁向两侧均匀渗透，笔画圆润饱满、力透纸背。"令笔心常在点画中行"是中锋的核心要领。中锋是书法一切笔法的基础。',ref:'蔡邕《九势》'},
{title:'侧锋用笔',era:'魏晋至今',cat:'笔法',tags:['偏锋','取势','变化'],desc:'笔锋偏向笔画一侧，产生一边光滑一边毛涩的效果。',detail:'侧锋是与中锋相对的用笔方法。运笔时笔锋偏向笔画一侧，使笔画呈现出一侧光润、一侧毛涩的特殊效果。王羲之行书中大量运用侧锋，增加了笔画的灵动感和变化。侧锋与中锋配合使用，能产生丰富的笔画变化。',ref:'《书谱》'},
{title:'藏锋',era:'秦汉至今',cat:'笔法',tags:['逆入','含蓄','蚕头燕尾'],desc:'起笔时笔锋先逆行再顺行，使笔锋藏于笔画之内。',detail:'藏锋是"欲右先左、欲下先上"的用笔技巧。起笔时笔锋逆向入纸，再转向行笔方向，使笔锋完全包裹在笔画之中。藏锋写出的笔画含蓄内敛、浑厚有力，是篆书和隶书的基本笔法。',ref:'蔡邕《九势》'},
{title:'露锋',era:'魏晋至今',cat:'笔法',tags:['尖起','锐利','行书草书'],desc:'起笔时笔锋直接入纸，笔画起始处尖锐外露。',detail:'露锋又称"出锋"，起笔时不加藏锋，笔锋尖端直接外露。露锋用笔给人以爽利、锐利的感觉，常用于行书和草书中，使笔画之间产生呼应和连贯。',ref:'《书谱》'},
{title:'回锋',era:'秦汉至今',cat:'笔法',tags:['收笔','完整','回护'],desc:'收笔时笔锋回转，使笔画末端圆满完整。',detail:'回锋是收笔时的重要技巧。行笔到末端后，笔锋略作停顿并向反方向回转，使笔画收尾处圆润饱满、不露锋芒。回锋使每一笔画都有完整的起承转合，是楷书的基本功。',ref:'《笔阵图》'},
{title:'篆书',era:'先秦至今',cat:'书体',tags:['古文字','对称','金石'],desc:'最古老的书体，笔画均匀对称，有大篆、小篆之分。',detail:'篆书起源于殷商甲骨文，经金文发展至秦代小篆统一文字。大篆（甲骨文、金文、石鼓文）笔画自由奔放；小篆笔画均匀圆润、结构对称。篆书以中锋运笔为主，笔笔中锋，线条如"锥画沙"。',ref:'许慎《说文解字》'},
{title:'隶书',era:'秦汉至今',cat:'书体',tags:['蚕头燕尾','波磔','汉碑'],desc:'由篆书演变而来，笔画有"蚕头燕尾"的特征。',detail:'隶书形成于秦代，成熟于汉代，是中国书法史上的重要转折。其最大特征是横画的"蚕头燕尾"——起笔如蚕头圆润，收笔如燕尾上翘。汉碑如《礼器碑》《曹全碑》《张迁碑》等是隶书学习的经典范本。',ref:'《汉书·艺文志》'},
{title:'楷书',era:'汉末至今',cat:'书体',tags:['正书','工整','法度'],desc:'最规范的书体，笔画分明、结构严谨，是学习书法的基础。',detail:'楷书由隶书演变而来，成熟于魏晋，鼎盛于唐代。其特点是横平竖直、结构方正、笔画分明。楷书四大家：欧阳询（欧体）、颜真卿（颜体）、柳公权（柳体）、赵孟頫（赵体），各有特色。',ref:'《唐书·百官志》'},
{title:'行书',era:'东汉至今',cat:'书体',tags:['流畅','半草','日常'],desc:'介于楷书和草书之间，流畅易识，是最实用的书体。',detail:'行书起源于东汉刘德升，发展于王羲之。其特点是笔画连带、书写流畅，既保持了楷书的基本结构，又增加了书写的便捷性。王羲之《兰亭集序》被誉为"天下第一行书"。行书是最常用的书体，兼具实用性和艺术性。',ref:'《书断》'},
{title:'草书',era:'汉代至今',cat:'书体',tags:['奔放','连笔','艺术'],desc:'笔画连绵不断、龙飞凤舞，是最具艺术表现力的书体。',detail:'草书从章草（隶书的草写）发展到今草（王羲之、王献之），再到狂草（张旭、怀素）。草书极度简化字形，笔画连绵不断，追求的是气韵和意境。张旭被称为"草圣"，其《古诗四帖》气势磅礴。',ref:'《书断》'},
{title:'王羲之',era:'东晋',cat:'名家',tags:['书圣','兰亭集序','行书'],desc:'被尊为"书圣"，其《兰亭集序》被誉为天下第一行书。',detail:'王羲之（303-361），字逸少，琅琊临沂人。官至右军将军，故又称"王右军"。他博采众长，融汇百家，将书法艺术推向高峰。《兰亭集序》写于永和九年（353年）兰亭雅集，全文324字，20多个"之"字各不相同，被誉为"天下第一行书"。',ref:'《晋书·王羲之传》'},
{title:'颜真卿',era:'唐代',cat:'名家',tags:['颜体','忠烈','祭侄文稿'],desc:'唐代书法大家，创立"颜体"，以雄浑大气著称。',detail:'颜真卿（709-784），字清臣，唐代著名书法家和政治家。其书法初学褚遂良，后师从张旭，创"颜体"——横轻竖重、结构宽博、气势雄浑。《祭侄文稿》被誉为天下第二行书，是颜真卿在安史之乱后悲愤之作。',ref:'《旧唐书·颜真卿传》'},
{title:'柳公权',era:'唐代',cat:'名家',tags:['柳体','瘦硬','心正笔正'],desc:'唐代书法家，创立"柳体"，以瘦硬挺拔著称。',detail:'柳公权（778-865），字诚悬，唐代著名书法家。其书法初学王羲之，后遍习唐代名家，创立"柳体"——骨力遒劲、结构严谨、笔画瘦硬。"颜筋柳骨"是对颜真卿和柳公权书法的精辟概括。柳公权有名言"心正则笔正"。',ref:'《旧唐书·柳公权传》'},
{title:'《兰亭集序》',era:'东晋',cat:'名作',tags:['天下第一行书','王羲之','28行'],desc:'王羲之的代表作，被誉为"天下第一行书"，原作已佚。',detail:'《兰亭集序》作于东晋永和九年（353年）三月三日，王羲之与友人在绍兴兰亭举行"修禊"雅集。全文共28行、324字，记录了兰亭聚会的盛况和对生死的感慨。原作据传随唐太宗入葬昭陵，现存最佳摹本为冯承素"神龙本"。',ref:'《兰亭集序》'},
{title:'《祭侄文稿》',era:'唐代',cat:'名作',tags:['天下第二行书','颜真卿','悲愤'],desc:'颜真卿悲愤之作，被誉为"天下第二行书"。',detail:'《祭侄文稿》作于唐乾元元年（758年），是颜真卿为祭奠在安史之乱中殉难的侄子颜季明而作。全篇笔墨枯润相间，涂抹修改处众多，真实记录了作者悲愤交加的情绪。被誉为"天下第二行书"，现藏于台北故宫博物院。',ref:'《颜鲁公集》'},
{title:'《自叙帖》',era:'唐代',cat:'名作',tags:['狂草','怀素','奔放'],desc:'怀素的狂草代表作，笔势纵横奔放，如暴风骤雨。',detail:'《自叙帖》作于唐大历十一年（776年），是怀素叙述自己学书经历的自传性作品。全帖126行，700余字，笔势纵横捭阖、变化莫测，被誉为"狂草"的最高成就。现藏于台北故宫博物院。',ref:'《怀素自叙帖》'},
{title:'文房四宝',era:'南唐至今',cat:'工具',tags:['笔墨纸砚','书写','传统'],desc:'笔、墨、纸、砚的合称，是中国传统书画的基本工具。',detail:'南唐后主李煜将笔、墨、纸、砚合称为"文房四宝"。笔以湖笔为佳，墨以徽墨为上，纸以宣纸为绝，砚以端砚为贵。这四件工具品质的优劣直接影响书画作品的质量。',ref:'《南唐书》'}
];
var currentCat='all';
function renderList(items){
  var el=document.getElementById('list');
  var s=document.getElementById('stats');
  s.textContent='共 '+items.length+' 条知识';
  el.innerHTML=items.map(function(d,i){
    return '<div class="item" onclick="this.classList.toggle(\'open\')">'+
    '<div class="item-title">'+d.title+'</div>'+
    '<div class="item-era">年代：'+d.era+'</div>'+
    '<div class="item-desc">'+d.desc+'</div>'+
    '<div class="item-detail"><h4>详细介绍</h4><p>'+d.detail+'</p>'+
    '<p style="margin-top:8px;color:var(--accent2)">参考：'+d.ref+'</p>'+
    '<div>'+d.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div></div>';
  }).join('');
}
function filterList(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=data.filter(function(d){
    var matchQ=d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q)||d.era.toLowerCase().includes(q);
    var matchC=currentCat==='all'||d.cat===currentCat;
    return matchQ&&matchC;
  });
  renderList(filtered);
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterList();
}
renderList(data);
</script></body></html>
