<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浏览器信息</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950;--red:#f85149}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;min-height:100vh}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.container{max-width:800px;margin:0 auto;padding:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row .label{color:var(--muted)}
.info-row .value{font-weight:500;text-align:right;max-width:60%;word-break:break-all}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.feature{padding:8px 12px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:8px}
.feature.supported{background:rgba(63,185,80,.1);color:var(--green)}
.feature.unsupported{background:rgba(248,81,73,.1);color:var(--red)}
.ua-box{background:#000;border-radius:8px;padding:12px;font-family:monospace;font-size:12px;word-break:break-all;line-height:1.6;margin-top:8px}
</style>
</head>
<body>
<div class="header">
<span style="font-size:28px">🌐</span>
<h1>浏览器信息</h1>
</div>
<div class="container">
<div class="card">
<h3>🔍 浏览器检测</h3>
<div id="browserInfo"></div>
</div>
<div class="card">
<h3>📋 UserAgent</h3>
<div class="ua-box" id="uaString"></div>
</div>
<div class="card">
<h3>⚡ API支持检测</h3>
<div class="feature-grid" id="features"></div>
</div>
<div class="card">
<h3>🧩 插件信息</h3>
<div id="pluginInfo"></div>
</div>
<div class="card">
<h3>🍪 存储支持</h3>
<div id="storageInfo"></div>
</div>
</div>
<script>
const ua=navigator.userAgent;
function detectBrowser(){
if(ua.includes('Edg/'))return{name:'Microsoft Edge',ver:ua.match(/Edg\/([\d.]+)/)?.[1]};
if(ua.includes('OPR/'))return{name:'Opera',ver:ua.match(/OPR\/([\d.]+)/)?.[1]};
if(ua.includes('Chrome/')&&ua.includes('Safari/'))return{name:'Google Chrome',ver:ua.match(/Chrome\/([\d.]+)/)?.[1]};
if(ua.includes('Firefox/'))return{name:'Mozilla Firefox',ver:ua.match(/Firefox\/([\d.]+)/)?.[1]};
if(ua.includes('Safari/')&&!ua.includes('Chrome'))return{name:'Apple Safari',ver:ua.match(/Version\/([\d.]+)/)?.[1]};
return{name:'未知浏览器',ver:'?'};
}
function detectOS(){
if(ua.includes('Windows'))return'Windows';if(ua.includes('Mac OS X'))return'macOS';
if(ua.includes('Android'))return'Android';if(ua.includes('iPhone')||ua.includes('iPad'))return'iOS';
if(ua.includes('Linux'))return'Linux';return'未知';
}
const browser=detectBrowser();
function ir(l,v){return `<div class="info-row"><span class="label">${l}</span><span class="value">${v}</span></div>`}
document.getElementById('browserInfo').innerHTML=[
ir('浏览器',browser.name),ir('版本',browser.ver),ir('操作系统',detectOS()),
ir('语言',navigator.language),ir('在线状态',navigator.onLine?'是':'否'),
ir('Cookie',navigator.cookieEnabled?'启用':'禁用'),ir('JavaScript','启用'),
ir('硬件并发',navigator.hardwareConcurrency+'核'),ir('设备内存',navigator.deviceMemory?navigator.deviceMemory+'GB':'N/A')
].join('');
document.getElementById('uaString').textContent=ua;
const features=[
['WebAssembly',typeof WebAssembly!=='undefined'],['Service Worker',!!navigator.serviceWorker],
['WebSocket',!!window.WebSocket'],['WebRTC',!!(window.RTCPeerConnection||window.webkitRTCPeerConnection)],
['Fetch API',!!window.fetch'],['AbortController',!!window.AbortController],
['BroadcastChannel',!!window.BroadcastChannel'],['SharedArrayBuffer',!!window.SharedArrayBuffer],
['Web Workers',!!window.Worker'],['IndexedDB',!!window.indexedDB],
['WebGL',!!document.createElement('canvas').getContext('webgl')],
['WebGL2',!!document.createElement('canvas').getContext('webgl2')],
['Web Audio',!!(window.AudioContext||window.webkitAudioContext)],
['Geolocation',!!navigator.geolocation],['Notifications',!!window.Notification],
['Push API',!!('PushManager' in window)],['Payment Request',!!window.PaymentRequest],
['Bluetooth',!!navigator.bluetooth],['USB',!!navigator.usb],['Gamepad',!!navigator.getGamepads],
['Clipboard API',!!navigator.clipboard],['Share API',!!navigator.share],
['Pointer Events',!!window.PointerEvent],['IntersectionObserver',!!window.IntersectionObserver],
['ResizeObserver',!!window.ResizeObserver],['MutationObserver',!!window.MutationObserver],
['requestIdleCallback',!!window.requestIdleCallback],['requestAnimationFrame',!!window.requestAnimationFrame]
];
document.getElementById('features').innerHTML=features.map(([n,s])=>`<div class="feature ${s?'supported':'unsupported'}">${s?'✅':'❌'} ${n}</div>`).join('');
const plugins=navigator.plugins;
document.getElementById('pluginInfo').innerHTML=plugins.length?Array.from(plugins).map(p=>ir(p.name,p.description||'-')).join(''):'<div style="color:var(--muted)">无法获取插件信息</div>';
document.getElementById('storageInfo').innerHTML=[
ir('localStorage',typeof localStorage!=='undefined'?'支持':'不支持'),
ir('sessionStorage',typeof sessionStorage!=='undefined'?'支持':'不支持'),
ir('IndexedDB',!!window.indexedDB?'支持':'不支持'),
ir('Cache API',!!window.caches?'支持':'不支持'),
ir('Web SQL',!!window.openDatabase?'支持':'不支持')
].join('');
</script>
</body>
</html>
