<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👔 父亲节礼物推荐 - Gary's Tools</title>
<meta name="description" content="2026父亲节(6月21日)礼物推荐：实用型、健康型、科技型、体验型礼物，按预算和老爸类型筛选">
<style>
:root{--bg:#fef7ed;--card:#fff;--text:#431407;--text2:#9a3412;--accent:#0369a1;--gold:#b45309;--border:#fed7aa;--radius:16px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
[data-theme="dark"]{--bg:#1c1008;--card:#2a1808;--text:#fed7aa;--text2:#9a3412;--border:#431407}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16pxscroll-behavior:smooth;}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#0369a1,#0284c7,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.countdown-banner{text-align:center;padding:16px;background:linear-gradient(135deg,#0369a1,#0284c7);border-radius:var(--radius);color:var(--text);margin-bottom:16px}
.cd-num{font-size:2.5rem;font-weight:900;display:block}
.cd-label{font-size:.8rem;opacity:.9}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.78rem;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s}
.tab.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.gift-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 12px rgba(0,0,0,.03)}
.gift-icon{font-size:2.2rem;width:50px;text-align:center;flex-shrink:0}
.gift-info{flex:1}
.gift-name{font-weight:800;font-size:.9rem;margin-bottom:2px}
.gift-desc{font-size:.75rem;color:var(--text2);line-height:1.4;margin-bottom:4px}
.gift-budget{font-size:.68rem;padding:2px 8px;border-radius:8px;font-weight:600;display:inline-block}
.budget-low{background:rgba(34,197,94,.1);color:#22c55e}
.budget-mid{background:rgba(3,105,161,.1);color:var(--accent)}
.budget-high{background:rgba(180,83,9,.1);color:var(--gold)}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="👔 父亲节礼物推荐 - Gary's Tools">
  <meta property="og:description" content="2026父亲节(6月21日)礼物推荐：实用型、健康型、科技型、体验型礼物，按预算和老爸类型筛选">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/fathers-day/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>👔 父亲节礼物推荐</h1><p>2026年6月21日 · 别只发红包</p></header>

<div class="countdown-banner">
<span class="cd-num" id="cdNum">--</span>
<span class="cd-label" id="cdLabel">距父亲节</span>
</div>

<div class="tabs" id="tabs">
<button class="tab active" data-c="all">全部</button>
<button class="tab" data-c="practical">🛠️ 实用</button>
<button class="tab" data-c="health">💊 健康</button>
<button class="tab" data-c="tech">📱 科技</button>
<button class="tab" data-c="exp">🎯 体验</button>
<button class="tab" data-c="low">💰 <200元</button>
</div>

<div id="giftList"></div>

<div class="card">
<h2>🎯 送老爸什么好？30秒小测试</h2>
<div id="quizArea">
<div id="qText" style="font-size:.85rem;margin-bottom:12px;line-height:1.5"></div>
<div id="qOptions" style="display:flex;flex-direction:column;gap:6px"></div>
<div style="text-align:center;margin-top:10px">
<button id="quizRestart" style="display:none;padding:8px 20px;border:none;background:var(--accent);color:var(--text);border-radius:20px;font-size:.8rem;cursor:pointer;font-family:inherit">🔄 重新测试</button>
</div>
</div>
</div>

<footer>最好的礼物是陪伴 ❤️</footer>
</div>

<script>
const now=new Date();
const fathersDay=new Date(2026,5,21);
const diff=Math.ceil((fathersDay-now)/(1000*60*60*24));
document.getElementById('cdNum').textContent=diff>0?diff+' 天':'就是今天！';
document.getElementById('cdLabel').textContent=diff>0?'距父亲节':diff===0?'父亲节快乐！':'已经过了';

const GIFTS=[
{name:'飞利浦电动剃须刀',icon:'🪒',cats:['practical','mid'],budget:'中档 ~300元',b:'mid',desc:'每天提醒老爸想起你。选3刀头水洗款，干湿两用更方便'},
{name:'小米智能手环8',icon:'⌚',cats:['tech','health','low'],budget:'实惠 ~150元',b:'low',desc:'监测心率/睡眠/血氧，老爸健康数据随时了解'},
{name:'足力健老人鞋',icon:'👟',cats:['practical','low'],budget:'实惠 ~200元',b:'low',desc:'防滑轻便，走路不累。大部分爸爸都嘴上说不要实际很开心'},
{name:'颈椎按摩仪',icon:'💆',cats:['health','mid'],budget:'中档 ~400元',b:'mid',desc:'SKG/倍轻松，老爸颈椎不舒服的时候就是你想他的时候'},
{name:'茶叶礼盒(龙井/普洱)',icon:'🍵',cats:['practical','mid'],budget:'中档 ~300元',b:'mid',desc:'了解老爸平时喝什么茶再买。配个保温杯效果翻倍'},
{name:'iPad或平板',icon:'📱',cats:['tech','high'],budget:'高档 ~2500元',b:'high',desc:'看新闻/视频/下棋，字体调大。教他用的时候多耐心'},
{name:'血压计(欧姆龙)',icon:'🩺',cats:['health','mid'],budget:'中档 ~350元',b:'mid',desc:'臂式比腕式更准。高血压是老年常见问题，健康关注最重要'},
{name:'带爸妈去体检',icon:'🏥',cats:['health','exp','high'],budget:'高档 ~1000元',b:'high',desc:'很多老爸从不去体检。选个周末预约全套体检，比什么礼物都实用'},
{name:'运动鞋(亚瑟士/Nike)',icon:'👟',cats:['practical','mid'],budget:'中档 ~500元',b:'mid',desc:'减震舒适适合散步跑步，带他去店里试穿比网上买更适合'},
{name:'降噪耳机/老花镜',icon:'🎧',cats:['tech','practical','mid'],budget:'中档 ~400元',b:'mid',desc:'降噪耳机看短视频不打扰老妈，老花镜选渐进多焦点的'},
{name:'带爸爸吃顿好的',icon:'🍽️',cats:['exp','low'],budget:'实惠 ~200元',b:'low',desc:'预定他最喜欢的菜系，聊聊天不刷手机。最朴实也最有效'},
{name:'写一封信',icon:'✉️',cats:['exp','low'],budget:'0元',b:'low',desc:'手写！不是微信。很多人可能这辈子没给老爸写过信。效果远超预期'},
{name:'筋膜枪',icon:'🔫',cats:['health','mid'],budget:'中档 ~300元',b:'mid',desc:'运动或久坐后放松肌肉，帮老爸缓解腰酸背痛'},
];

let activeCat='all';

function render(){
const filtered=activeCat==='all'?GIFTS:GIFTS.filter(g=>g.cats.includes(activeCat));
document.getElementById('giftList').innerHTML=filtered.map(g=>`
<div class="gift-card">
<div class="gift-icon">${g.icon}</div>
<div class="gift-info">
<div class="gift-name">${g.name}</div>
<div class="gift-desc">${g.desc}</div>
<span class="gift-budget budget-${g.b}">${g.budget}</span>
</div>
</div>`).join('');
}

document.getElementById('tabs').addEventListener('click',e=>{
if(!e.target.classList.contains('tab'))return;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
e.target.classList.add('active');
activeCat=e.target.dataset.c;
render();
});

render();

// 🎯 父亲节礼物小测试
const quiz=[{q:'老爸平时最大的爱好是什么？',o:[{t:'喝茶/下棋/看新闻',g:'practical'},{t:'刷短视频/看剧',g:'tech'},{t:'出去散步/运动',g:'health'},{t:'没什么特别的爱好',g:'exp'}]},
{q:'老爸最常用的电子设备是什么？',o:[{t:'只会用老人机',g:'practical'},{t:'智能手机只打电话',g:'low'},{t:'会用微信/抖音',g:'tech'},{t:'比我还会玩数码',g:'tech'}]},
{q:'老爸的身体状况怎么样？',o:[{t:'很健康，天天锻炼',g:'exp'},{t:'有点高血压/颈椎问题',g:'health'},{t:'不爱运动但没啥大病',g:'practical'},{t:'最近说腰酸背痛',g:'health'}]},
{q:'你和老爸的相处模式是？',o:[{t:'经常聊天，像朋友',g:'exp'},{t:'话不多但心里有对方',g:'low'},{t:'他话少我主动',g:'practical'},{t:'异地/见面少',g:'tech'}]}];
let quizStep=0,quizScores={};

function startQuiz(){
  quizStep=0;quizScores={};showQuizQ();
}
function showQuizQ(){
  if(quizStep>=quiz.length){showQuizResult();return;}
  const q=quiz[quizStep];
  document.getElementById('qText').innerHTML='<b>第'+(quizStep+1)+'/4题</b> '+q.q;
  document.getElementById('qOptions').innerHTML=q.o.map((o,i)=>'<button class="tab" data-g="'+o.g+'" style="display:block;width:100%;text-align:left;padding:10px 14px;font-size:.82rem">'+o.t+'</button>').join('');
  document.getElementById('quizRestart').style.display='none';
}
function showQuizResult(){
  const cats=Object.keys(quizScores);
  const best=cats.reduce((a,b)=>quizScores[a]>quizScores[b]?a:b);
  const map={'tech':'📱 科技型 — 老爸适合最新数码产品','health':'💊 健康型 — 送健康最贴心','practical':'🛠️ 实用型 — 日常实用不会闲置','exp':'🎯 体验型 — 陪伴和体验最珍贵','low':'💰 实惠型 — 心意到了就好'};
  const matches=GIFTS.filter(g=>g.cats.includes(best)).slice(0,3);
  document.getElementById('qText').innerHTML='<div style="text-align:center;padding:8px 0"><div style="font-size:1.3rem;font-weight:800;color:var(--accent);margin-bottom:4px">🎉 推荐结果</div><div style="font-size:.82rem;color:var(--text2);margin-bottom:8px">'+map[best]+'</div></div>';
  document.getElementById('qOptions').innerHTML=matches.map(g=>'<div class="gift-card" style="cursor:default"><div class="gift-icon">'+g.icon+'</div><div class="gift-info"><div class="gift-name">'+g.name+'</div><div class="gift-desc">'+g.desc+'</div><span class="gift-budget budget-'+g.b+'">'+g.budget+'</span></div></div>').join('');
  document.getElementById('quizRestart').style.display='inline-block';
}
document.getElementById('qOptions').addEventListener('click',function(e){
  if(!e.target.classList.contains('tab'))return;
  const cat=e.target.dataset.g;
  quizScores[cat]=(quizScores[cat]||0)+1;
  quizStep++;showQuizQ();
});
document.getElementById('quizRestart').addEventListener('click',startQuiz);
startQuiz();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
