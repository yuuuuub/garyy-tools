<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Siri AI 常用指令 - Gary's Tools</title>
<meta name="description" content="iOS 27 Siri AI 实用指令大全，涵盖工作、生活、学习、出行各场景，让你的iPhone变身AI助手">
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--text2:#86868b;--accent:#0071e3;--purple:#af52de;--green:#34c759;--orange:#ff9500;--border:#e5e5ea;--radius:14px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--text2:#98989d;--border:#38383a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16pxscroll-behavior:smooth;}
.container{max-width:560px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font-size:.82rem;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s}
.tab.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.cmd-list{display:flex;flex-direction:column;gap:8px}
.cmd-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:transform .2s}
.cmd-item:hover{transform:translateY(-1px)}
.cmd-text{font-size:.95rem;font-weight:600;margin-bottom:6px;color:var(--accent);cursor:pointer}
.cmd-desc{font-size:.8rem;color:var(--text2);line-height:1.5}
.cmd-copy{font-size:.7rem;color:var(--accent);float:right;cursor:pointer;padding:2px 8px;border-radius:10px;background:rgba(0,113,227,.1);margin-top:-4px}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🧠 Siri AI 常用指令 - Gary's Tools">
  <meta property="og:description" content="iOS 27 Siri AI 实用指令大全，涵盖工作、生活、学习、出行各场景，让你的iPhone变身AI助手">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/siri-commands/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>🧠 Siri AI 常用指令大全</h1>
<p>iOS 27 · 让Siri成为你的AI助手</p>
</header>
<div style="margin-bottom:12px"><input type="text" id="cmdSearch" placeholder="🔍 搜索指令关键词..." title="Enter键搜索" style="width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:.9rem;background:var(--bg);color:var(--text);outline:none;font-family:inherit;transition:border-color .2s"></div>
<div class="tabs" id="tabs"></div>
<div class="cmd-list" id="cmdList"></div>
<footer>基于WWDC 2026 Siri AI功能整理</footer>
</div>

<script>
const COMMANDS={
'💼 工作效率':[
{t:'帮我把今天的会议记录整理成要点',d:'Siri自动读取日历+备忘录，生成会议纪要'},
{t:'用中文总结这个网页的核心内容',d:'Safari中直接让Siri阅读并总结网页'},
{t:'把昨天拍的所有照片发到我的电脑上',d:'跨设备操作，自动识别文件并传输'},
{t:'帮我起草一封回复邮件给[联系人]',d:'根据对话上下文智能生成邮件回复'},
{t:'提醒我明天下午3点前完成PPT',d:'智能创建带优先级的提醒事项'},
{t:'把这段语音转成文字并翻译成英文',d:'语音→文字→翻译一气呵成'},
{t:'生成这个Excel表格的关键数据图表',d:'数据可视化，自动生成柱状图/折线图'},
{t:'帮我找到上周三和设计部的会议录音',d:'语义搜索，不记文件名也能找到'},
],
'🏠 日常生活':[
{t:'帮我把明早8点的闹钟设成周杰伦的歌',d:'智能设置闹钟+搜索音乐'},
{t:'今晚有什么好看的电影推荐？',d:'根据你的观影历史智能推荐'},
{t:'帮我在美团订一杯拿铁送到公司',d:'跨App操作，自动完成外卖下单'},
{t:'翻译这页菜单上的所有菜名',d:'相机取景框中实时翻译'},
{t:'我冰箱里还有鸡蛋、番茄、牛肉，能做什么菜？',d:'根据现有食材推荐菜谱'},
{t:'帮我找一张和这张图风格相似的壁纸',d:'以图搜图，AI理解图片风格'},
{t:'每天下午提醒我站起来活动5分钟',d:'智能健康提醒，自动创建快捷指令'},
],
'📚 学习助手':[
{t:'用小学生能理解的方式解释量子力学',d:'自适应难度解释复杂概念'},
{t:'把这篇英文文章翻译成中文并做摘要',d:'翻译+摘要一步完成'},
{t:'帮我制定一个30天学会Python的学习计划',d:'生成系统化的学习路径'},
{t:'这道数学题怎么做？逐步讲解',d:'拍照识别题目并逐步讲解思路'},
{t:'总结这本书的核心观点',d:'Apple Books中当前书籍的内容总结'},
{t:'帮我把笔记整理成思维导图',d:'备忘录内容自动结构化'},
],
'🚗 出行 & 健康':[
{t:'规划一条去故宫的最佳路线，避开拥堵',d:'实时路况+公共交通+步行综合规划'},
{t:'帮我在日历上安排一次年度体检',d:'推荐附近体检中心并预约'},
{t:'我这周的运动量达标了吗？',d:'读取健康App数据并给出分析'},
{t:'前方有什么好的咖啡馆？',d:'地图中按评分和距离推荐'},
{t:'帮我计算这顿饭的热量',d:'拍照识别食物并估算卡路里'},
],
};

let activeCat='💼 工作效率';

function render(){
const cats=Object.keys(COMMANDS);
document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="tab${c===activeCat?' active':''}" onclick="switchCat('${c}')">${c}</button>`).join('');

document.getElementById('cmdList').innerHTML=COMMANDS[activeCat].map(c=>
`<div class="cmd-item">
<div class="cmd-text" onclick="navigator.clipboard.writeText('${c.t.replace(/'/g,"\\'")}');this.style.color='var(--green)';setTimeout(()=>this.style.color='var(--accent)',1500)">💬 ${c.t}<span class="cmd-copy">📋 复制</span></div>
<div class="cmd-desc">${c.d}</div>
</div>`).join('');
}

function switchCat(c){activeCat=c;document.getElementById('cmdSearch').value='';render();}

// 🔍 指令搜索功能
function searchCommands(){
  const q=document.getElementById('cmdSearch').value.trim().toLowerCase();
  const allCmds=Object.values(COMMANDS).flat();
  if(!q){render();return;}
  const filtered=allCmds.filter(c=>c.t.includes(q)||c.d.includes(q));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const container=document.getElementById('cmdList');
  if(filtered.length===0){container.innerHTML='<div style="text-align:center;padding:30px;color:var(--text2);font-size:.85rem">😕 未找到匹配的指令，试试其他关键词</div>';return;}
  container.innerHTML=filtered.map(c=>'<div class="cmd-item"><div class="cmd-text">💬 '+c.t+'<span class="cmd-copy" onclick="event.stopPropagation();navigator.clipboard.writeText(\''+c.t.replace(/'/g,"\\'")+'\');this.textContent=\'✅ 已复制\';setTimeout(()=>this.textContent=\'📋 复制\',1500)">📋 复制</span></div><div class="cmd-desc">'+c.d+'</div></div>').join('');
}

document.getElementById('cmdSearch').addEventListener('input',searchCommands);

render();
</script>
<script src="../i18n.js" defer>
document.getElementById("cmdSearch").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();switchCat();}});
</script>
</body>
</html>
