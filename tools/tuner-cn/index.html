<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎸 音调调音器</title>
<meta property="og:title" content="🎸 音调调音器">
<meta property="og:description" content="🎸 音调调音器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线调音器，支持吉他、贝斯、尤克里里等乐器调音，实时音高检测">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:420px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.instrument-tabs{display:flex;gap:6px;margin-bottom:16px}
.inst-tab{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s}
.inst-tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.note-display{text-align:center;padding:30px 0}
.note-name{font-size:80px;font-weight:800;line-height:1;font-family:monospace}
.note-octave{font-size:24px;color:var(--text-secondary);vertical-align:super}
.note-freq{font-size:16px;color:var(--text-secondary);margin-top:8px}
.tuner-meter{position:relative;height:60px;margin:20px 0;overflow:hidden}
.meter-bg{width:100%;height:4px;background:var(--border);border-radius:2px;position:absolute;top:50%;transform:translateY(-50%)}
.meter-center{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--green);transform:translateX(-50%);z-index:2}
.meter-needle{width:3px;height:40px;background:var(--accent);border-radius:2px;position:absolute;top:10px;left:50%;transform-origin:bottom center;transition:left .1s;z-index:3}
.meter-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text-secondary)}
.cents-display{text-align:center;font-size:18px;font-weight:700;margin:10px 0}
.cents-display.in-tune{color:var(--green)}
.cents-display.flat{color:var(--red)}
.cents-display.sharp{color:var(--blue)}
.status-text{text-align:center;font-size:14px;color:var(--text-secondary);margin:10px 0}
.string-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.string-item{padding:12px;border-radius:10px;border:1px solid var(--border);text-align:center;cursor:pointer;transition:all .2s}
.string-item:hover{border-color:var(--accent)}
.string-item.active{border-color:var(--accent);background:var(--tag-bg)}
.string-item.in-tune{border-color:var(--green);background:rgba(35,134,54,.1)}
.string-item .sname{font-size:18px;font-weight:700}
.string-item .sfreq{font-size:11px;color:var(--text-secondary)}
.play-btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:12px}
.play-btn-primary{background:var(--accent);color:#fff}
.play-btn-primary:hover{background:var(--accent-hover)}
.footer{text-align:center;padding:20px 0;font-size:12px;color:var(--text-secondary)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🎸 音调调音器</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">🎵 选择乐器</div>
<div class="instrument-tabs" id="instTabs">
<button class="inst-tab active" onclick="setInstrument('guitar',this)">🎸 吉他</button>
<button class="inst-tab" onclick="setInstrument('bass',this)">🎸 贝斯</button>
<button class="inst-tab" onclick="setInstrument('ukulele',this)">🎵 尤克里里</button>
<button class="inst-tab" onclick="setInstrument('violin',this)">🎻 小提琴</button>
</div>
</div>
<div class="card">
<div class="note-display">
<div class="note-name" id="noteName">--</div>
<div class="note-freq" id="noteFreq">等待输入...</div>
</div>
<div class="tuner-meter">
<div class="meter-bg"></div>
<div class="meter-center"></div>
<div class="meter-needle" id="needle"></div>
</div>
<div class="meter-labels"><span>-50</span><span>-25</span><span>0</span><span>+25</span><span>+50</span></div>
<div class="cents-display" id="centsDisplay">-- cents</div>
<div class="status-text" id="statusText">请允许麦克风权限并开始调音</div>
</div>
<div class="card">
<div class="card-title">🎶 参考音</div>
<div class="string-list" id="stringList"></div>
<button class="play-btn play-btn-primary" id="listenBtn" onclick="toggleListen()">🎤 开始监听</button>
</div>
<div class="footer">调音器 - 基于 Web Audio API</div>
</div>
<script>
let audioCtx,analyser,mediaStream,isListening=false,animFrame,sourceNode;
const INSTRUMENTS={
guitar:{name:'吉他',strings:[{name:'E2',note:40,freq:82.41},{name:'A2',note:45,freq:110},{name:'D3',note:50,freq:146.83},{name:'G3',note:55,freq:196},{name:'B3',note:59,freq:246.94},{name:'E4',note:64,freq:329.63}]},
bass:{name:'贝斯',strings:[{name:'E1',note:28,freq:41.2},{name:'A1',note:33,freq:55},{name:'D2',note:38,freq:73.42},{name:'G2',note:43,freq:98}]},
ukulele:{name:'尤克里里',strings:[{name:'G4',note:67,freq:392},{name:'C4',note:60,freq:261.63},{name:'E4',note:64,freq:329.63},{name:'A4',note:69,freq:440}]},
violin:{name:'小提琴',strings:[{name:'G3',note:55,freq:196},{name:'D4',note:62,freq:293.66},{name:'A4',note:69,freq:440},{name:'E5',note:76,freq:659.26}]}
};
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let currentInstrument='guitar';
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
function setInstrument(inst,el){currentInstrument=inst;document.querySelectorAll('.inst-tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderStrings()}
function renderStrings(){const el=document.getElementById('stringList');const strings=INSTRUMENTS[currentInstrument].strings;el.innerHTML=strings.map((s,i)=>`<div class="string-item" onclick="playReference(${i})" id="string${i}"><div class="sname">${s.name}</div><div class="sfreq">${s.freq.toFixed(1)} Hz</div></div>`).join('')}
function playReference(idx){initAudio();const strings=INSTRUMENTS[currentInstrument].strings;const s=strings[idx];const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type='sine';osc.frequency.value=s.freq;g.gain.setValueAtTime(0.5,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1);osc.connect(g);g.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+1)}
async function toggleListen(){if(isListening){stopListen();return}try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=4096;sourceNode=audioCtx.createMediaStreamSource(mediaStream);sourceNode.connect(analyser);isListening=true;document.getElementById('listenBtn').textContent='⏹️ 停止监听';detectPitch()}catch(e){alert('请允许麦克风权限')}}
function stopListen(){isListening=false;if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close();cancelAnimationFrame(animFrame);document.getElementById('listenBtn').textContent='🎤 开始监听';document.getElementById('noteName').textContent='--';document.getElementById('noteFreq').textContent='等待输入...';document.getElementById('centsDisplay').textContent='-- cents';document.getElementById('statusText').textContent='请允许麦克风权限并开始调音';document.getElementById('needle').style.left='50%';document.querySelectorAll('.string-item').forEach(s=>s.classList.remove('in-tune','active'))}
function detectPitch(){if(!isListening)return;const buf=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(buf);const freq=autoCorrelate(buf,audioCtx.sampleRate);if(freq>0){const midiNote=Math.round(12*Math.log2(freq/440)+69);const noteName=NOTE_NAMES[midiNote%12]+(Math.floor(midiNote/12)-1);const noteFreq=440*Math.pow(2,(midiNote-69)/12);const cents=Math.round(1200*Math.log2(freq/noteFreq));document.getElementById('noteName').innerHTML=NOTE_NAMES[midiNote%12]+`<span class="note-octave">${Math.floor(midiNote/12)-1}</span>`;document.getElementById('noteFreq').textContent=freq.toFixed(1)+' Hz';document.getElementById('centsDisplay').textContent=cents+' cents';const clampedCents=Math.max(-50,Math.min(50,cents));const needlePos=50+clampedCents;document.getElementById('needle').style.left=needlePos+'%';const cd=document.getElementById('centsDisplay');const st=document.getElementById('statusText');if(Math.abs(cents)<=5){cd.className='cents-display in-tune';st.textContent='准！';highlightString(noteName,true)}else if(cents<0){cd.className='cents-display flat';st.textContent='偏低'+Math.abs(cents)+' cents';highlightString(noteName,false)}else{cd.className='cents-display sharp';st.textContent='偏高'+cents+' cents';highlightString(noteName,false)}}else{document.getElementById('noteName').textContent='--';document.getElementById('noteFreq').textContent='无法识别音高';document.getElementById('centsDisplay').textContent='-- cents';document.getElementById('statusText').textContent='请对着麦克风弹奏乐器'}animFrame=requestAnimationFrame(detectPitch)}
function highlightString(noteName,inTune){const strings=INSTRUMENTS[currentInstrument].strings;document.querySelectorAll('.string-item').forEach((el,i)=>{el.classList.remove('in-tune','active');if(strings[i].name.replace(/\d/,'')===noteName.replace(/\d/,'')){el.classList.add('active');if(inTune)el.classList.add('in-tune')}})}
function autoCorrelate(buf,sampleRate){let SIZE=buf.length;let rms=0;for(let i=0;i<SIZE;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/SIZE);if(rms<0.01)return-1;let r1=0,r2=SIZE-1,thres=0.2;for(let i=0;i<SIZE/2;i++)if(Math.abs(buf[i])<thres){r1=i;break}for(let i=1;i<SIZE/2;i++)if(Math.abs(buf[SIZE-i])<thres){r2=SIZE-i;break}buf=buf.slice(r1,r2);SIZE=buf.length;const c=new Array(SIZE).fill(0);for(let i=0;i<SIZE;i++)for(let j=0;j<SIZE-i;j++)c[i]=c[i]+buf[j]*buf[j+i];let d=0;while(c[d]>c[d+1])d++;let maxval=-1,maxpos=-1;for(let i=d;i<SIZE;i++){if(c[i]>maxval){maxval=c[i];maxpos=i}}let T0=maxpos;return sampleRate/T0}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
renderStrings();
</script>
</body>
</html>
