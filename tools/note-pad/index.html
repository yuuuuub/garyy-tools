<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记事本 - garyy-tools</title>
<meta name="description" content="在线记事本，快速记录文字笔记和想法">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;margin-bottom:4px}
.sub{color:var(--text2);font-size:.85rem}
button{padding:9px 20px;border-radius:6px;border:none;background:var(--blue);color:#fff;font-size:.85rem;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.85}
input,textarea,select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.9rem;width:100%;outline:none;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-gold{background:var(--gold);color:#000}
textarea{width:100%;min-height:300px;resize:vertical;font-size:.95rem;line-height:1.6;font-family:inherit;padding:14px}
.info-bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px}
.info-item{font-size:.82rem;color:var(--text2)}
.save-status{font-size:.82rem;color:var(--green);transition:opacity .3s}
.save-status.saving{color:var(--gold)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div class="container">
<header>
<h1>📓 记事本</h1>
<div class="sub">浏览器本地记事</div>
</header>

<div class="card">
<textarea id="noteContent" placeholder="开始写点什么..." maxlength="100000"></textarea>

<div class="info-bar">
<div>
<span class="info-item">字符: <span id="charCount">0</span></span>
<span class="info-item" style="margin-left:16px">已保存: <span id="saveStatus">自动保存</span></span>
</div>
<div>
<button class="btn-gold" id="btnSave">手动保存</button>
<button class="btn-red" id="btnClear">清空</button>
</div>
</div>

<div class="info-bar" style="margin-top:6px">
<span class="info-item">最后保存: <span id="lastSaveTime">-</span></span>
</div>
</div>
</div>

<script src="../i18n.js"></script>
<script>
(function(){
'use strict';
const STORAGE_KEY='garyy_note';
const TIME_KEY='garyy_note_time';
const noteContent=document.getElementById('noteContent');
const charCount=document.getElementById('charCount');
const saveStatus=document.getElementById('saveStatus');
const lastSaveTime=document.getElementById('lastSaveTime');
const btnSave=document.getElementById('btnSave');
const btnClear=document.getElementById('btnClear');

let saveTimer=null;

function load(){
const content=localStorage.getItem(STORAGE_KEY)||'';
const time=localStorage.getItem(TIME_KEY)||'';
noteContent.value=content;
charCount.textContent=content.length;
lastSaveTime.textContent=time||'-';
}

function save(){
const content=noteContent.value;
localStorage.setItem(STORAGE_KEY,content);
localStorage.setItem(TIME_KEY,new Date().toLocaleString('zh-CN'));
lastSaveTime.textContent=new Date().toLocaleString('zh-CN');
charCount.textContent=content.length;
saveStatus.textContent='已保存';
saveStatus.className='save-status';
}

function autoSave(){
clearTimeout(saveTimer);
saveTimer=setTimeout(function(){
save();
},500);
saveStatus.textContent='保存中...';
saveStatus.className='save-status saving';
}

function clearNote(){
if(!noteContent.value.trim())return;
if(confirm('确定清空记事本内容吗？此操作不可撤销。')){
noteContent.value='';
save();
}
}

noteContent.addEventListener('input',function(){
charCount.textContent=this.value.length;
autoSave();
});

btnSave.addEventListener('click',save);
btnClear.addEventListener('click',clearNote);

load();
})();
</script>
</body>
</html>
