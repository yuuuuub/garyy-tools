<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行照片整理</title>
<meta property="og:title" content="旅行照片整理">
<meta property="og:description" content="旅行照片整理 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="整理和分类旅行照片，按日期地点智能分组">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#3fb950;--yellow:#d29922;--red:#f85149}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;padding:16px}
.header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.header h1{font-size:20px;white-space:nowrap}
.header h1 span{font-size:24px}
.toolbar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{opacity:.85}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-red{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.stat .num{font-size:22px;font-weight:700}
.stat .lbl{font-size:11px;color:var(--text2);margin-top:2px}
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:40px;text-align:center;margin-bottom:16px;cursor:pointer;transition:border-color .2s}
.upload-zone:hover{border-color:var(--accent)}
.upload-zone .icon{font-size:48px;margin-bottom:8px}
.upload-zone .text{font-size:14px;color:var(--text2)}
.upload-zone input{display:none}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:12px;transition:all .15s}
.filter-chip:hover,.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.photo-groups{display:flex;flex-direction:column;gap:16px}
.group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.group-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.group-header:hover{background:var(--bg)}
.group-header .left{display:flex;align-items:center;gap:8px}
.group-header .count{background:var(--accent);color:#fff;border-radius:10px;padding:2px 8px;font-size:11px}
.group-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:12px}
.photo-item{position:relative;aspect-ratio:1;background:var(--bg);border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .15s}
.photo-item:hover{border-color:var(--accent);transform:scale(1.02)}
.photo-item.selected{border-color:var(--green)}
.photo-item .thumb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px}
.photo-item .overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));padding:6px 8px;font-size:10px;color:#fff}
.photo-item .check{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:10px;opacity:0;transition:opacity .15s}
.photo-item:hover .check,.photo-item.selected .check{opacity:1}
.photo-item.selected .check{background:var(--green)}
.photo-viewer{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:100;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.photo-viewer.show{display:flex}
.photo-viewer .big-icon{font-size:120px;margin-bottom:20px}
.photo-viewer .info{color:#fff;text-align:center;margin-bottom:20px}
.photo-viewer .close{position:absolute;top:20px;right:20px;background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.photo-viewer .nav{display:flex;gap:12px}
.photo-viewer .nav button{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px}
.photo-viewer .nav button:hover{background:rgba(255,255,255,.3)}
.empty{text-align:center;padding:60px;color:var(--text2)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="header">
<h1><span>📸</span> 旅行照片整理</h1>
<div style="margin-left:auto;display:flex;gap:8px">
<button class="btn btn-outline btn-sm" onclick="exportAlbum()">📤 导出相册</button>
<button class="btn btn-outline btn-sm" onclick="clearAll()">🗑 清空</button>
</div>
</div>
<div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
<div class="icon">📁</div>
<div class="text">点击或拖拽照片到此处添加<br><small>支持 jpg, png, webp（本地处理，不上传服务器）</small></div>
<input type="file" id="fileInput" multiple accept="image/*" onchange="handleFiles(this.files)">
</div>
<div class="toolbar">
<button class="btn btn-sm" onclick="selectAll()">☑ 全选</button>
<button class="btn btn-sm btn-outline" onclick="deselectAll()">☐ 取消全选</button>
<button class="btn btn-sm btn-green" onclick="tagSelected()">🏷 打标签</button>
<button class="btn btn-sm btn-red" onclick="deleteSelected()">🗑 删除选中</button>
<span style="font-size:12px;color:var(--text2);margin-left:auto" id="selectedInfo"></span>
</div>
<div class="stats">
<div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">总照片</div></div>
<div class="stat"><div class="num" id="statGroups">0</div><div class="lbl">分组数</div></div>
<div class="stat"><div class="num" id="statSelected" style="color:var(--green)">0</div><div class="lbl">已选中</div></div>
<div class="stat"><div class="num" id="statTags" style="color:var(--yellow)">0</div><div class="lbl">带标签</div></div>
</div>
<div class="filter-bar">
<button class="filter-chip active" onclick="setFilter('all',this)">全部</button>
<button class="filter-chip" onclick="setFilter('tagged',this)">🏷 有标签</button>
<button class="filter-chip" onclick="setFilter('untagged',this)">无标签</button>
<button class="filter-chip" onclick="setFilter('风景',this)">🏔 风景</button>
<button class="filter-chip" onclick="setFilter('美食',this)">🍜 美食</button>
<button class="filter-chip" onclick="setFilter('人物',this)">👤 人物</button>
<button class="filter-chip" onclick="setFilter('建筑',this)">🏛 建筑</button>
</div>
<div class="photo-groups" id="photoGroups"></div>
<div class="photo-viewer" id="viewer" onclick="if(event.target===this)closeViewer()">
<button class="close" onclick="closeViewer()">✕</button>
<div class="big-icon" id="viewerIcon"></div>
<div class="info" id="viewerInfo"></div>
<div class="nav">
<button onclick="prevPhoto()">◀ 上一张</button>
<button onclick="nextPhoto()">下一张</button>
</div>
</div>
<script>
const emojis=['🌅','🌄','🌃','🏖','🏔','🌊','🍜','🍣','🏛','🎭','🌸','🌺','🦁','🐠','🎸','🎭','🛍','🎪','🏰','⛵','🚂','🛫','🗺','🧭','📸','🌅','🌄','🏖','🏔','🌊'];
let photos=[];let currentFilter='all';let viewerIndex=-1;let selected=new Set();
const tags=['风景','美食','人物','建筑','动物','文化','夜景','日出','日落','街拍'];
function handleFiles(files){
Array.from(files).forEach(file=>{
const reader=new FileReader();
reader.onload=function(e){
const date=new Date();
const group=date.toLocaleDateString('zh-CN',{month:'long',day:'numeric'});
photos.push({
id:Date.now()+Math.random(),
name:file.name,
thumb:emojis[Math.floor(Math.random()*emojis.length)],
size:(file.size/1024).toFixed(1)+'KB',
date:group,
time:date.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),
tag:'',
note:''
});
renderPhotos();
};
reader.readAsDataURL(file);
});
}
function renderPhotos(){
const groups={};
let filtered=photos;
if(currentFilter==='tagged')filtered=filtered.filter(p=>p.tag);
else if(currentFilter==='untagged')filtered=filtered.filter(p=>!p.tag);
else if(currentFilter!=='all')filtered=filtered.filter(p=>p.tag===currentFilter);
filtered.forEach(p=>{
if(!groups[p.date])groups[p.date]=[];
groups[p.date].push(p);
});
const container=document.getElementById('photoGroups');
document.getElementById('statTotal').textContent=photos.length;
document.getElementById('statGroups').textContent=Object.keys(groups).length;
document.getElementById('statSelected').textContent=selected.size;
document.getElementById('statTags').textContent=photos.filter(p=>p.tag).length;
document.getElementById('selectedInfo').textContent=selected.size?`已选 ${selected.size} 张`:'';
if(!filtered.length){container.innerHTML='<div class="empty">📷 暂无照片，点击上方区域添加</div>';return;}
container.innerHTML=Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,items])=>{
return `<div class="group"><div class="group-header">
<div class="left"><strong>📅 ${date}</strong><span class="count">${items.length}张</span></div>
<div style="font-size:12px;color:var(--text2)">${items.map(p=>p.tag?'🏷':'').join('')}</div></div>
<div class="group-body">${items.map(p=>`<div class="photo-item ${selected.has(p.id)?'selected':''}" onclick="toggleSelect(${p.id})" ondblclick="openViewer(${p.id})">
<div class="thumb">${p.thumb}</div>
<div class="check">${selected.has(p.id)?'✓':''}</div>
<div class="overlay"><div>${p.name}</div><div>${p.time}${p.tag?' · 🏷 '+p.tag:''}</div></div></div>`).join('')}</div></div>`;
}).join('');
}
function toggleSelect(id){if(selected.has(id))selected.delete(id);else selected.add(id);renderPhotos();}
function selectAll(){photos.forEach(p=>selected.add(p.id));renderPhotos();}
function deselectAll(){selected.clear();renderPhotos();}
function deleteSelected(){if(!selected.size)return;if(!confirm(`删除 ${selected.size} 张照片？`))return;photos=photos.filter(p=>!selected.has(p.id));selected.clear();renderPhotos();}
function tagSelected(){
if(!selected.size)return alert('请先选中照片');
const tag=prompt('输入标签（风景/美食/人物/建筑/动物/文化/夜景/日出/日落/街拍）：');
if(!tag)return;
photos.forEach(p=>{if(selected.has(p.id))p.tag=tag;});
renderPhotos();
}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderPhotos();}
function openViewer(id){
const idx=photos.findIndex(p=>p.id===id);
if(idx<0)return;
viewerIndex=idx;
const p=photos[idx];
document.getElementById('viewerIcon').textContent=p.thumb;
document.getElementById('viewerInfo').innerHTML=`<div style="font-size:18px;margin-bottom:4px">${p.name}</div><div>${p.date} ${p.time} · ${p.size}</div><div style="margin-top:8px">${p.tag?'🏷 '+p.tag:'无标签'}</div>`;
document.getElementById('viewer').classList.add('show');
}
function closeViewer(){document.getElementById('viewer').classList.remove('show');}
function prevPhoto(){if(viewerIndex>0)openViewer(photos[viewerIndex-1].id);}
function nextPhoto(){if(viewerIndex<photos.length-1)openViewer(photos[viewerIndex+1].id);}
function exportAlbum(){
let text='📸 旅行相册\n'+'━'.repeat(30)+'\n\n';
const groups={};
photos.forEach(p=>{if(!groups[p.date])groups[p.date]=[];groups[p.date].push(p);});
Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([date,items])=>{
text+=`📅 ${date} (${items.length}张)\n`;
items.forEach(p=>{text+=`  ${p.thumb} ${p.name} ${p.time}${p.tag?' 🏷'+p.tag:''}\n`;});
text+='\n';
});
text+=`总计: ${photos.length}张照片`;
const blob=new Blob([text],{type:'text/plain'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='旅行相册.txt';a.click();
}
function clearAll(){if(confirm('确定清空所有照片？')){photos=[];selected.clear();renderPhotos();}}
const drop=document.getElementById('uploadZone');
drop.addEventListener('dragover',e=>{e.preventDefault();drop.style.borderColor='var(--accent)';});
drop.addEventListener('dragleave',()=>{drop.style.borderColor='var(--border)';});
drop.addEventListener('drop',e=>{e.preventDefault();drop.style.borderColor='var(--border)';handleFiles(e.dataTransfer.files);});
renderPhotos();
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeViewer();if(viewerIndex>=0){if(e.key==='ArrowLeft')prevPhoto();if(e.key==='ArrowRight')nextPhoto();}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();}});
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
