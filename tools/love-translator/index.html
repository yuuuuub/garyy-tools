    { lang: "马耳他语", script: "Malti", translation: "Inħobbok", pronunciation: "因霍伯克", region: "马耳他", category: "欧洲" },
    { lang: "卢森堡语", script: "Lëtzebuergesch", translation: "Ech hunn dech gär", pronunciation: "艾希 混 迪希 盖尔", region: "卢森堡", category: "欧洲" },
    { lang: "亚美尼亚语", script: "Հայերեն", translation: "Ես քեզ սիրում եմ", pronunciation: "耶斯 凯兹 西鲁姆 耶姆", region: "亚美尼亚", category: "亚洲" },
    { lang: "格鲁吉亚语", script: "ქართული", translation: "მე შენ მიყვარხარ", pronunciation: "梅 申 米克瓦哈尔", region: "格鲁吉亚", category: "其他" },
    { lang: "哈萨克语", script: "Қазақша", translation: "Мен сені жақсы көремін", pronunciation: "门 塞尼 贾克西 科雷明", region: "哈萨克斯坦", category: "亚洲" },
    { lang: "蒙古语", script: "Монгол", translation: "Би чамд хайртай", pronunciation: "比 查姆德 海尔泰", region: "蒙古", category: "亚洲" },
    { lang: "尼泊尔语", script: "नेपाली", translation: "म तिमीलाई माया गर्छु", pronunciation: "马 提米莱 马亚 加尔楚", region: "尼泊尔", category: "亚洲" },
    { lang: "僧伽罗语", script: "සිංහල", translation: "මම ඔබට ආදරෙයි", pronunciation: "马马 奥巴塔 阿达雷伊", region: "斯里兰卡", category: "亚洲" },
    { lang: "高棉语", script: "ភាសាខ្មែរ", translation: "ខ្ញុំស្រឡាញ់អ្នក", pronunciation: "克宁 斯罗兰 内克", region: "柬埔寨", category: "亚洲" },
    { lang: "老挝语", script: "ລາວ", translation: "ຂ້ອຍຮັກເຈົ້າ", pronunciation: "考伊 哈克 昭", region: "老挝", category: "亚洲" }
  ];
  let activeTag = 'all';
  let searchQuery = '';
  const cardsGrid = document.getElementById('cardsGrid');
  const searchInput = document.getElementById('searchInput');
  const countInfo = document.getElementById('countInfo');
  const tagButtons = document.querySelectorAll('.tag-btn');
  function renderCards() {
    let filtered = languages;
    if (activeTag !== 'all') {
      filtered = filtered.filter(l => l.category === activeTag);
    }
    if (searchQuery.trim()) {
      const q = searchQuery.trim().toLowerCase();
      filtered = filtered.filter(l =>
        l.lang.toLowerCase().includes(q) ||
        l.script.toLowerCase().includes(q) ||
        l.pronunciation.toLowerCase().includes(q)
      );
    }
    countInfo.innerHTML = `共 <strong>${filtered.length}</strong> 种语言`;
    cardsGrid.innerHTML = filtered.map((l, i) => `
      <div class="card-container" data-index="${i}">
        <div class="card-inner">
          <div class="card-front">
            <div class="card-language">
              <span>${l.script} (${l.lang})</span>
              <span class="card-category">${l.category}</span>
            </div>
            <div class="card-translation">${l.translation}</div>
            <div class="card-pronunciation">🔊 ${l.pronunciation}</div>
            <div class="card-actions">
              <button class="copy-btn" onclick="event.stopPropagation(); copyTranslation('${l.translation.replace(/'/g, "\\'")}', this)" title="复制翻译">📋 复制</button>
            </div>
            <div class="flip-hint">点击翻转查看详情 →</div>
          </div>
          <div class="card-back">
            <div class="card-back-inner">
              <div class="card-back-title">🌍 ${l.lang} 使用国家/地区：</div>
              <div class="card-back-regions">
                ${l.region.split('、').map(r => `<span class="card-back-country">${r}</span>`).join('')}
              </div>
              <div class="flip-hint">← 点击翻转返回</div>
            </div>
          </div>
        </div>
      </div>
    `).join('');
    document.querySelectorAll('.card-container').forEach(el => {
      el.addEventListener('click', function(e) {
        if (e.target.closest('.copy-btn')) return;
        this.classList.toggle('flipped');
      });
    });
  }
  function copyTranslation(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✅ 已复制';
      btn.classList.add('copied');
      showToast('已复制到剪贴板！');
      setTimeout(() => {
        btn.textContent = '📋 复制';
        btn.classList.remove('copied');
      }, 1500);
    }).catch(() => {
      showToast('复制失败，请手动复制');
    });
  }
  function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }
  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderCards();
  });
  tagButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tagButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTag = btn.dataset.tag;
      renderCards();
    });
  });
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'pink' ? 'dark' : 'pink';
    html.setAttribute('data-theme', next);
    themeToggle.textContent = next === 'dark' ? '💗' : '🌓';
    localStorage.setItem('love-theme', next);
  });
  const savedTheme = localStorage.getItem('love-theme');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeToggle.textContent = savedTheme === 'dark' ? '💗' : '🌓';
  }
  function createHearts() {
    const bg = document.getElementById('heartsBg');
    const hearts = ['💕', '💗', '💖', '❤️', '💝', '💘', '💓'];
    for (let i = 0; i < 20; i++) {
      const span = document.createElement('span');
      span.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      span.style.left = Math.random() * 100 + '%';
      span.style.top = Math.random() * 100 + '%';
      span.style.animationDelay = Math.random() * 4 + 's';
      span.style.animationDuration = (3 + Math.random() * 4) + 's';
      span.style.fontSize = (1.2 + Math.random() * 2.5) + 'rem';
      bg.appendChild(span);
    }
  }
  createHearts();
  renderCards();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
