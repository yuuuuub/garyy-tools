<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盒子阴影生成器</title>
<meta name="description" content="CSS盒子阴影生成器，可视化调试阴影参数">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh}
.container{max-width:800px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card h3{font-size:.85rem;color:var(--text2);margin-bottom:12px}
.preview-box{width:100%;height:240px;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;transition:box-shadow .15s}
.preview-inner{width:120px;height:120px;background:var(--blue);border-radius:8px;transition:box-shadow .1s,width .1s,height .1s,border-radius .1s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75rem;text-align:center}
.control-group{margin-bottom:10px}
.control-group label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.control-group label span{color:var(--text);font-family:monospace}
input[type="range"]{width:100%;accent-color:var(--blue);background:transparent}
.control-row{display:flex;gap:10px;align-items:center}
.control-row input[type="range"]{flex:1}
.css-output{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-family:monospace;font-size:.82rem;color:var(--text);white-space:pre-wrap;word-break:break-all;margin-bottom:10px;min-height:40px}
.btn{padding:8px 20px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.82rem;background:var(--blue);color:#fff;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.green{background:var(--green)}
.color-picker-wrap{display:flex;gap:8px;align-items:center;margin-top:4px}
.color-picker-wrap input[type="color"]{width:36px;height:30px;border:none;padding:0;cursor:pointer;background:transparent}
.color-picker-wrap span{font-size:.8rem;font-family:monospace;color:var(--text)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 20px;border-radius:var(--radius);font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:.8rem;color:var(--text2)}
.checkbox-row input{accent-color:var(--blue)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="盒子阴影生成器">
  <meta property="og:description" content="CSS盒子阴影生成器，可视化调试阴影参数">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/box-shadow-gen/">
</head>
<body>
<div class="container">
<header><h1>盒子阴影生成器</h1><p>CSS Box Shadow可视化</p></header>
<div class="card" style="margin-bottom:16px">
<div class="preview-box" id="preview-box"><div class="preview-inner" id="preview-inner">预览</div></div>
</div>
<div class="layout">
<div class="card">
<h2>阴影参数</h2>
<div class="control-group"><label>X 偏移 <span id="x-val">4</span></label><input type="range" id="x-slider" min="-50" max="50" value="4"></div>
<div class="control-group"><label>Y 偏移 <span id="y-val">4</span></label><input type="range" id="y-slider" min="-50" max="50" value="4"></div>
<div class="control-group"><label>模糊 <span id="blur-val">10</span></label><input type="range" id="blur-slider" min="0" max="100" value="10"></div>
<div class="control-group"><label>扩散 <span id="spread-val">0</span></label><input type="range" id="spread-slider" min="-30" max="50" value="0"></div>
<div class="control-group"><label>不透明度 <span id="opacity-val">40</span></label><input type="range" id="opacity-slider" min="0" max="100" value="40"></div>
<div class="control-group">
<label>阴影颜色</label>
<div class="color-picker-wrap">
<input type="color" id="shadow-color" value="#000000">
<span id="shadow-color-val">#000000</span>
</div>
</div>
<div class="checkbox-row"><input type="checkbox" id="inset"><label for="inset">内阴影 (inset)</label></div>
</div>
<div class="card">
<h2>CSS代码</h2>
<div class="css-output" id="css-output"></div>
<button class="btn green" id="copy-btn">复制CSS</button>
</div>
</div>
</div>
<div class="toast" id="toast">已复制到剪贴板</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const previewInner = $('preview-inner');
const cssOutput = $('css-output');
const toast = $('toast');
let toastTimer = null;

function showToast(msg) {
  toast.textContent = msg || '已复制';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
}

function getBoxShadowCSS() {
  const x = parseInt($('x-slider').value);
  const y = parseInt($('y-slider').value);
  const blur = parseInt($('blur-slider').value);
  const spread = parseInt($('spread-slider').value);
  const opacity = parseInt($('opacity-slider').value) / 100;
  const color = $('shadow-color').value;
  const inset = $('inset').checked ? 'inset ' : '';

  // Convert hex to rgba
  const r = parseInt(color.slice(1,3), 16);
  const g = parseInt(color.slice(3,5), 16);
  const b = parseInt(color.slice(5,7), 16);

  const shadow = `${inset}${x}px ${y}px ${blur}px ${spread}px rgba(${r},${g},${b},${opacity})`;
  return `box-shadow: ${shadow};`;
}

function updatePreview() {
  const css = getBoxShadowCSS();
  const shadowValue = css.replace('box-shadow: ', '').replace(';', '');
  previewInner.style.boxShadow = shadowValue;
  cssOutput.textContent = css;
}

// Slider bindings
const sliders = ['x-slider','y-slider','blur-slider','spread-slider','opacity-slider'];
sliders.forEach(id => {
  const el = $(id);
  el.addEventListener('input', function() {
    const valId = id.replace('-slider', '-val');
    $(valId).textContent = this.value;
    updatePreview();
  });
});

$('shadow-color').addEventListener('input', function() {
  $('shadow-color-val').textContent = this.value;
  updatePreview();
});

$('inset').addEventListener('change', updatePreview);

$('copy-btn').addEventListener('click', function() {
  const css = cssOutput.textContent;
  navigator.clipboard.writeText(css).then(() => {
    showToast('CSS已复制到剪贴板');
  }).catch(() => {
    showToast('复制失败');
  });
});

// Init
updatePreview();

})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
