<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>时钟组件 - garyy-tools</title>
<meta name="description" content="实时时钟组件，支持模拟表盘和数字时钟双模式">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;scroll-behavior:smooth}.container{max-width:500px;margin:auto;padding-bottom:50px}header{text-align:center;padding:28px 0 16px}h1{font-size:1.3rem;margin-bottom:4px}.sub{color:var(--text2);font-size:.85rem}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;text-align:center}.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--bg);border-radius:6px;padding:4px}.tab{flex:1;text-align:center;padding:7px 0;border-radius:4px;cursor:pointer;font-size:.85rem;color:var(--text2);transition:all .2s}.tab.active{background:var(--blue);color:var(--text)}.clock-face{position:relative;width:240px;height:240px;border-radius:50%;border:3px solid var(--border);margin:0 auto 16px}.clock-face .num{position:absolute;font-size:.8rem;font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center}.clock-face .hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:4px}.hour-hand{width:5px;height:60px;background:var(--text);margin-left:-2.5px}.minute-hand{width:3px;height:80px;background:var(--blue);margin-left:-1.5px}.second-hand{width:2px;height:90px;background:var(--red);margin-left:-1px}.center-dot{position:absolute;top:50%;left:50%;width:10px;height:10px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);z-index:2}.digital-clock{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:2px}.digital-seconds{font-size:1.5rem;color:var(--text2);vertical-align:top}.date-info{font-size:.85rem;color:var(--text2);margin-top:8px}.tz-list{margin-top:16px;text-align:left}.tz-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem}.tz-item:last-child{border:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕐</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="时钟组件 - garyy-tools">
<meta property="og:description" content="实时时钟组件，支持模拟表盘和数字时钟双模式">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>🕐 时钟组件</h1>
<div class="sub">模拟表盘 · 数字时钟 · 多时区</div>
</header>
<div class="card">
<div class="tabs">
<div class="tab active" data-mode="analog">模拟表盘</div>
<div class="tab" data-mode="digital">数字时钟</div>
</div>
<div id="analogView">
<div class="clock-face" id="clockFace">
<div class="hand hour-hand" id="hourHand"></div>
<div class="hand minute-hand" id="minuteHand"></div>
<div class="hand second-hand" id="secondHand"></div>
<div class="center-dot"></div>
</div>
</div>
<div id="digitalView" style="display:none">
<div class="digital-clock" id="digitalClock"></div>
</div>
<div class="date-info" id="dateInfo"></div>
</div>
<div class="card">
<div class="tz-list" id="tzList"></div>
</div>
</div>
<script>
(function(){
'use strict';
const now=()=>new Date();
let mode='analog';
const tzs=[
{label:'北京时间',tz:'Asia/Shanghai'},
{label:'东京时间',tz:'Asia/Tokyo'},
{label:'纽约时间',tz:'America/New_York'},
{label:'伦敦时间',tz:'Europe/London'},
{label:'巴黎时间',tz:'Europe/Paris'}
];
function pad(n){return n<10?'0'+n:n;}
function setupAnalog(){
const face=document.getElementById('clockFace');
face.querySelectorAll('.num').forEach(n=>n.remove());
for(let i=1;i<=12;i++){
const el=document.createElement('div');el.className='num';
const angle=(i*30-90)*Math.PI/180;
const r=95;const x=120+r*Math.cos(angle)-12;const y=120+r*Math.sin(angle)-12;
el.style.left=x+'px';el.style.top=y+'px';el.textContent=i;face.appendChild(el);
}
}
function tick(){
const d=now();
const h=d.getHours()%12,m=d.getMinutes(),s=d.getSeconds(),ms=d.getMilliseconds();
const hDeg=(h+m/60)*30;const mDeg=(m+s/60)*6;const sDeg=(s+ms/1000)*6;
document.getElementById('hourHand').style.transform='rotate('+hDeg+'deg)';
document.getElementById('minuteHand').style.transform='rotate('+mDeg+'deg)';
document.getElementById('secondHand').style.transform='rotate('+sDeg+'deg)';
const dd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
document.getElementById('dateInfo').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+dd[d.getDay()];
document.getElementById('digitalClock').innerHTML=pad(d.getHours())+':'+pad(m)+'<span class="digital-seconds">:'+pad(s)+'</span>';
const tzHtml=tzs.map(t=>{
const opts={timeZone:t.tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false};
return '<div class="tz-item"><span>'+t.label+'</span><span>'+new Intl.DateTimeFormat('zh-CN',opts).format(d)+'</span></div>';
}).join('');
document.getElementById('tzList').innerHTML=tzHtml;
requestAnimationFrame(tick);
}
document.querySelectorAll('.tab').forEach(tab=>{
tab.onclick=()=>{
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');
mode=tab.dataset.mode;
document.getElementById('analogView').style.display=mode==='analog'?'block':'none';
document.getElementById('digitalView').style.display=mode==='digital'?'block':'none';
};
});
setupAnalog();tick();
})();
</script>
</body>
</html>
