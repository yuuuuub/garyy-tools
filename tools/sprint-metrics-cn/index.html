<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏃 Sprint指标</title>
<meta name="description" content="Sprint冲刺指标工具，追踪迭代进度和团队速率">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--purple:#7c3aed}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
input[type=text],input[type=number],input[type=date]{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
input:focus{outline:none;border-color:var(--accent)}
select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;width:100%}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{text-align:center;padding:14px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-card .num{font-size:1.5rem;font-weight:700}
.stat-card .lbl{font-size:.75rem;color:var(--text2);margin-top:2px}
.story-row{display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.story-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--green)}
.story-row .story-title{flex:1;font-size:.9rem}
.story-row .story-title input{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:.9rem;width:100%}
.story-row .story-points{width:50px;text-align:center}
.story-row .story-points select{width:55px;margin:0;padding:4px;font-size:.8rem}
.story-row .story-assignee{width:80px}
.story-row .story-assignee select{width:85px;margin:0;padding:4px;font-size:.8rem}
.story-row .story-status{width:70px}
.story-row .story-status select{width:75px;margin:0;padding:4px;font-size:.8rem}
.story-row .story-delete{padding:2px 6px;font-size:.75rem}
.burndown{position:relative;height:200px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg)}
.burndown canvas{width:100%;height:100%}
.sprint-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.sprint-form label{font-size:.85rem;color:var(--text2);display:block;margin-bottom:4px}
.hidden{display:none}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr)}.story-row{flex-wrap:wrap}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🏃 Sprint指标">
<meta property="og:description" content="Sprint冲刺指标工具，追踪迭代进度和团队速率">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='sprint_metrics';
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{
  sprints:[
    {name:'Sprint 1',start:'2025-05-01',end:'2025-05-14',goal:'完成用户模块',stories:[
      {title:'用户注册',points:3,assignee:'张三',status:'done'},
      {title:'用户登录',points:2,assignee:'李四',status:'done'},
      {title:'个人信息',points:3,assignee:'王五',status:'done'},
      {title:'忘记密码',points:1,assignee:'张三',status:'done'}
    ],burndown:[100,80,60,40,20,5,0]},
    {name:'Sprint 2',start:'2025-05-15',end:'2025-05-28',goal:'完成商品模块',stories:[
      {title:'商品列表',points:5,assignee:'李四',status:'done'},
      {title:'商品详情',points:3,assignee:'王五',status:'done'},
      {title:'商品搜索',points:5,assignee:'张三',status:'progress'},
      {title:'商品分类',points:2,assignee:'李四',status:'progress'},
      {title:'商品收藏',points:3,assignee:'王五',status:'todo'}
    ],burndown:[100,85,70,55,42,30,20,12]},
    {name:'Sprint 3',start:'2025-05-29',end:'2025-06-11',goal:'完成订单模块',stories:[
      {title:'购物车',points:5,assignee:'张三',status:'progress'},
      {title:'下单支付',points:8,assignee:'李四',status:'progress'},
      {title:'订单列表',points:3,assignee:'王五',status:'todo'},
      {title:'订单详情',points:2,assignee:'张三',status:'todo'}
    ],burndown:[100,92,80]}
  ],
  currentSprint:2,
  members:['张三','李四','王五']
};
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function getSprint(){return state.sprints[state.currentSprint]}
function addSprint(){const n=prompt('Sprint名称:');const g=prompt('Sprint目标:');if(n&&n.trim()){state.sprints.push({name:n.trim(),start:new Date().toISOString().slice(0,10),end:new Date(Date.now()+14*86400000).toISOString().slice(0,10),goal:g||'',stories:[],burndown:[100]});state.currentSprint=state.sprints.length-1;save();render()}}
function removeSprint(){if(state.sprints.length<=1)return;if(!confirm('确定删除?'))return;state.sprints.splice(state.currentSprint,1);state.currentSprint=Math.min(state.currentSprint,state.sprints.length-1);save();render()}
function addStory(){getSprint().stories.push({title:'新故事',points:3,assignee:state.members[0]||'',status:'todo'});save();render()}
function removeStory(i){getSprint().stories.splice(i,1);save();render()}
function addMember(){const name=prompt('成员姓名:');if(name&&name.trim()){state.members.push(name.trim());save();render()}}
function getTotalPoints(){return getSprint().stories.reduce((s,st)=>s+st.points,0)}
function getDonePoints(){return getSprint().stories.filter(st=>st.status==='done').reduce((s,st)=>s+st.points,0)}
function getCompletion(){const tp=getTotalPoints();return tp?Math.round(getDonePoints()/tp*100):0}
function getAvgVelocity(){const doneSprints=state.sprints.filter(s=>s.stories.some(st=>st.status==='done'));if(!doneSprints.length)return 0;return Math.round(doneSprints.reduce((s,sp)=>s+sp.stories.filter(st=>st.status==='done').reduce((ss,st)=>ss+st.points,0),0)/doneSprints.length)}
function exportData(){const sp=getSprint();let txt=`${sp.name} 指标报告\n`+'='.repeat(40)+`\n目标: ${sp.goal}\n周期: ${sp.start} ~ ${sp.end}\n\n`;txt+=`完成率: ${getCompletion()}%\n总故事点: ${getTotalPoints()}\n已完成: ${getDonePoints()}\n\n故事列表:\n`;sp.stories.forEach(st=>{txt+=`  ${st.status==='done'?'✓':st.status==='progress'?'◐':'○'} ${st.title} | ${st.points}SP | ${st.assignee}\n`});const blob=new Blob([txt],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${sp.name}_指标.txt`;a.click()}
function render(){
  const sp=getSprint();
  const completion=getCompletion();
  const tp=getTotalPoints();
  const dp=getDonePoints();
  const vel=getAvgVelocity();
  let h=`<div class="hdr"><h1>🏃 Sprint指标</h1><p>迭代进度与速率追踪</p></div>`;
  h+=`<div class="cd"><div class="stats-grid">`;
  h+=`<div class="stat-card"><div class="num" style="color:${completion>=80?'var(--green)':completion>=50?'var(--yellow)':'var(--red)'}">${completion}%</div><div class="lbl">完成率</div></div>`;
  h+=`<div class="stat-card"><div class="num" style="color:var(--accent)">${dp}/${tp}SP</div><div class="lbl">故事点</div></div>`;
  h+=`<div class="stat-card"><div class="num" style="color:var(--purple)">${sp.stories.length}</div><div class="lbl">故事数</div></div>`;
  h+=`<div class="stat-card"><div class="num" style="color:var(--yellow)">${vel}SP</div><div class="lbl">平均速率</div></div></div></div>`;
  h+=`<div class="cd"><div class="sprint-form"><div><label>Sprint名称</label><input value="${sp.name}" onchange="getSprint().name=this.value;save()"></div>`;
  h+=`<div><label>目标</label><input value="${sp.goal}" onchange="getSprint().goal=this.value;save()"></div>`;
  h+=`<div><label>开始日期</label><input type="date" value="${sp.start}" onchange="getSprint().start=this.value;save()"></div>`;
  h+=`<div><label>结束日期</label><input type="date" value="${sp.end}" onchange="getSprint().end=this.value;save()"></div></div>`;
  h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">`;
  state.sprints.forEach((s,i)=>{h+=`<div style="padding:4px 12px;border-radius:16px;border:1px solid var(--border);cursor:pointer;font-size:.8rem;background:${state.currentSprint===i?'var(--accent)':'var(--bg)'};color:${state.currentSprint===i?'#fff':'var(--text)'}" onclick="state.currentSprint=${i};save();render()">${s.name}</div>`});
  h+=`<button class="sec" style="font-size:.8rem;padding:4px 12px" onclick="addSprint()">+ Sprint</button>`;
  h+=`<button class="sec dng" style="font-size:.8rem;padding:4px 12px" onclick="removeSprint()">删除</button>`;
  h+=`<button class="sec" style="font-size:.8rem;padding:4px 12px;margin-left:auto" onclick="addMember()">+ 成员</button>`;
  h+=`<button class="sec" style="font-size:.8rem;padding:4px 12px" onclick="exportData()">导出</button></div></div>`;
  h+=`<div class="cd"><h2>📝 故事列表 <button class="sec" style="font-size:.75rem;padding:3px 10px;margin-left:6px" onclick="addStory()">+ 故事</button></h2>`;
  sp.stories.forEach((st,i)=>{const statusColors={done:'var(--green)',progress:'var(--accent)',todo:'var(--text2)'};
    h+=`<div class="story-row"><input type="checkbox"${st.status==='done'?' checked':''} onchange="getSprint().stories[${i}].status=this.checked?'done':'todo';save();render()">`;
    h+=`<div class="story-title"><input value="${st.title}" onchange="getSprint().stories[${i}].title=this.value;save()"></div>`;
    h+=`<div class="story-points"><select onchange="getSprint().stories[${i}].points=+this.value;save();render()">${[1,2,3,5,8,13].map(p=>`<option${st.points===p?' selected':''}>${p}</option>`).join('')}</select></div>`;
    h+=`<div class="story-assignee"><select onchange="getSprint().stories[${i}].assignee=this.value;save()">${state.members.map(m=>`<option${st.assignee===m?' selected':''}>${m}</option>`).join('')}</select></div>`;
    h+=`<div class="story-status"><select onchange="getSprint().stories[${i}].status=this.value;save();render()" style="color:${statusColors[st.status]}"><option value="todo"${st.status==='todo'?' selected':''}>待办</option><option value="progress"${st.status==='progress'?' selected':''}>进行中</option><option value="done"${st.status==='done'?' selected':''}>完成</option></select></div>`;
    h+=`<button class="sec story-delete" onclick="removeStory(${i})">✕</button></div>`});
  h+=`</div>`;
  h+=`<div class="cd"><h2>📉 燃尽图</h2><div class="burndown"><canvas id="burndownCanvas"></canvas></div></div>`;
  h+=`<div class="cd"><h2>📊 历史速率</h2><div style="display:flex;align-items:flex-end;gap:12px;height:100px;padding:0 10px">`;
  state.sprints.forEach((s,i)=>{const donePts=s.stories.filter(st=>st.status==='done').reduce((ss,st)=>ss+st.points,0);const maxPts=Math.max(...state.sprints.map(sp=>sp.stories.filter(st=>st.status==='done').reduce((ss,st)=>ss+st.points,0)),1);const barH=Math.max(10,(donePts/maxPts)*80);
    h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center"><div style="font-size:.75rem;font-weight:600;color:var(--accent);margin-bottom:4px">${donePts}SP</div><div style="width:100%;height:${barH}px;background:${state.currentSprint===i?'var(--accent)':'var(--border)'};border-radius:4px 4px 0 0;transition:height .3s"></div><div style="font-size:.65rem;color:var(--text2);margin-top:4px">${s.name}</div></div>`});
  h+=`</div></div>`;
  $('app').innerHTML=h;
  setTimeout(drawBurndown,100);
}
function drawBurndown(){
  const canvas=$('burndownCanvas');
  if(!canvas)return;
  const sp=getSprint();
  const data=sp.burndown;
  if(!data||!data.length)return;
  const ctx=canvas.getContext('2d');
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width;canvas.height=rect.height;
  const w=canvas.width,h=canvas.height;
  const pad={top:20,right:20,bottom:30,left:40};
  const plotW=w-pad.left-pad.right;const plotH=h-pad.top-pad.bottom;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#30363d';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad.left,pad.top);ctx.lineTo(pad.left,h-pad.bottom);ctx.lineTo(w-pad.right,h-pad.bottom);ctx.stroke();
  ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';
  for(let i=0;i<=4;i++){const y=pad.top+plotH*(i/4);const val=Math.round(100-i*25);ctx.fillText(val+'SP',pad.left-35,y+4)}
  const ideal=[];for(let i=0;i<data.length;i++)ideal.push(100-i*(100/(data.length-1)));
  ctx.strokeStyle='rgba(139,148,158,0.4)';ctx.setLineDash([4,4]);ctx.beginPath();
  ideal.forEach((v,i)=>{const x=pad.left+i*(plotW/(data.length-1));const y=pad.top+plotH*(1-v/100);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();ctx.setLineDash([]);
  const grad=ctx.createLinearGradient(0,pad.top,0,h-pad.bottom);grad.addColorStop(0,'rgba(59,130,246,0.3)');grad.addColorStop(1,'rgba(59,130,246,0.05)');
  ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(pad.left,h-pad.bottom);
  data.forEach((v,i)=>{const x=pad.left+i*(plotW/(data.length-1));const y=pad.top+plotH*(1-v/100);ctx.lineTo(x,y)});
  ctx.lineTo(pad.left+(data.length-1)*(plotW/(data.length-1)),h-pad.bottom);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.beginPath();
  data.forEach((v,i)=>{const x=pad.left+i*(plotW/(data.length-1));const y=pad.top+plotH*(1-v/100);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();
  data.forEach((v,i)=>{const x=pad.left+i*(plotW/(data.length-1));const y=pad.top+plotH*(1-v/100);ctx.fillStyle='#3b82f6';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()});
}
render();
</script>
</body>
</html>
