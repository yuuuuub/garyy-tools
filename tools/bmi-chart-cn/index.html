<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 BMI指数计算器</title>
<meta property="og:title" content="📊 BMI指数计算器">
<meta property="og:description" content="📊 BMI指数计算器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线BMI体质指数计算器，附带中国标准BMI等级划分和可视化图表">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-group label{font-size:12px;color:var(--text-secondary);font-weight:500}
.input-group input{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;transition:all .2s}
.input-group input:focus{outline:none;border-color:var(--accent)}
.calc-btn{width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.calc-btn:hover{background:var(--accent-hover)}
.result-card{background:var(--tag-bg);border-radius:12px;padding:20px;text-align:center;margin-top:12px}
.result-val{font-size:56px;font-weight:800;color:var(--accent)}
.result-level{font-size:18px;margin-top:4px;font-weight:600}
.bmi-bar{position:relative;height:30px;border-radius:15px;margin:16px 0;overflow:visible}
.bmi-track{display:flex;height:100%;border-radius:15px;overflow:hidden}
.bmi-seg{height:100%;transition:width .3s}
.bmi-marker{position:absolute;top:-4px;width:4px;height:38px;background:var(--text);border-radius:2px;transition:left .5s ease;z-index:2}
.bmi-labels{display:flex;font-size:10px;color:var(--text-secondary);margin-top:4px}
.bmi-labels span{flex:1;text-align:center}
.level-table{width:100%;border-collapse:collapse;font-size:13px}
.level-table th{background:var(--accent);color:#fff;padding:10px;text-align:center;font-weight:600}
.level-table td{padding:10px;text-align:center;border-bottom:1px solid var(--border)}
.level-table tr.current{background:var(--tag-bg);font-weight:600}
.weight-range{font-size:13px;color:var(--text-secondary);margin-top:8px;line-height:1.8}
.weight-range b{color:var(--accent)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📊 BMI指数计算器</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">📏 输入数据</div>
<div class="input-row">
<div class="input-group">
<label>身高 (cm)</label>
<input type="number" id="height" placeholder="170" min="100" max="220">
</div>
<div class="input-group">
<label>体重 (kg)</label>
<input type="number" id="weight" placeholder="65" min="20" max="250">
</div>
</div>
<button class="calc-btn" onclick="calcBMI()">📊 计算BMI</button>
</div>
<div class="card" id="resultCard" style="display:none">
<div class="card-title">📈 BMI结果</div>
<div class="result-card">
<div class="result-val" id="bmiVal">--</div>
<div class="result-level" id="bmiLevel">--</div>
</div>
<div class="bmi-bar">
<div class="bmi-track">
<div class="bmi-seg" style="width:20%;background:#3b82f6"></div>
<div class="bmi-seg" style="width:20%;background:#22c55e"></div>
<div class="bmi-seg" style="width:20%;background:#eab308"></div>
<div class="bmi-seg" style="width:20%;background:#f97316"></div>
<div class="bmi-seg" style="width:20%;background:#ef4444"></div>
</div>
<div class="bmi-marker" id="bmiMarker"></div>
<div class="bmi-labels"><span>偏瘦</span><span>正常</span><span>偏胖</span><span>肥胖</span><span>重度肥胖</span></div>
</div>
<div class="weight-range" id="weightRange"></div>
</div>
<div class="card">
<div class="card-title">📋 中国BMI标准</div>
<table class="level-table" id="levelTable">
<tr><th>BMI范围</th><th>等级</th><th>建议</th></tr>
<tr><td>&lt;18.5</td><td style="color:#3b82f6">偏瘦</td><td>适当增重</td></tr>
<tr><td>18.5-23.9</td><td style="color:#22c55e">正常</td><td>保持良好习惯</td></tr>
<tr><td>24.0-27.9</td><td style="color:#eab308">偏胖</td><td>控制饮食，增加运动</td></tr>
<tr><td>28.0-31.9</td><td style="color:#f97316">肥胖</td><td>建议就医咨询</td></tr>
<tr><td>≥32.0</td><td style="color:#ef4444">重度肥胖</td><td>需专业医疗干预</td></tr>
</table>
</div>
<div class="footer">Gary's Tools · BMI仅供参考，不区分肌肉与脂肪</div>
</div>
<script>
function calcBMI(){
const h=parseFloat(document.getElementById('height').value);
const w=parseFloat(document.getElementById('weight').value);
if(!h||!w){alert('请输入身高和体重');return}
const bmi=w/((h/100)**2);
document.getElementById('bmiVal').textContent=bmi.toFixed(1);
let level,color;
if(bmi<18.5){level='偏瘦';color='#3b82f6';}
else if(bmi<24){level='正常';color='#22c55e';}
else if(bmi<28){level='偏胖';color='#eab308';}
else if(bmi<32){level='肥胖';color='#f97316';}
else{level='重度肥胖';color='#ef4444';}
const lvlEl=document.getElementById('bmiLevel');
lvlEl.textContent=level;
lvlEl.style.color=color;
const markerPos=Math.min(100,Math.max(0,((bmi-14)/26)*100));
document.getElementById('bmiMarker').style.left=`calc(${markerPos}% - 2px)`;
const low=Math.round(18.5*(h/100)**2*10)/10;
const high=Math.round(23.9*(h/100)**2*10)/10;
document.getElementById('weightRange').innerHTML=`
正常体重范围：<b>${low}</b> ~ <b>${high}</b> kg<br>
当前体重 <b>${w}</b> kg，${w<low?'需增重'+(low-w).toFixed(1)+'kg':w>high?'需减重'+(w-high).toFixed(1)+'kg':'在正常范围内'}✓
`;
document.getElementById('resultCard').style.display='block';
}
function toggleTheme(){
const html=document.documentElement;
const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
html.setAttribute('data-theme',next);
document.querySelector('.theme-toggle').textContent=next==='dark'?'☀️':'🌙';
}
</script>
</body>
</html>
