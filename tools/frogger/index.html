<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>过马路</title>
<meta name="description" content="过马路游戏，控制小青蛙安全穿过车流">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;touch-action:none}
#header{display:flex;gap:20px;padding:8px 16px;font-size:14px;width:100%;max-width:500px;justify-content:space-between}
#header span{color:var(--accent)}
canvas{display:block}
#touchControls{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10}
.dpad{display:grid;grid-template-columns:60px 60px 60px;grid-template-rows:60px 60px 60px;gap:4px}
.dpad button{background:var(--card);border:2px solid var(--border);color:var(--text);border-radius:8px;font-size:20px;touch-action:none}
.dpad button:active{background:var(--accent)}
.dpad .empty{background:transparent;border:none}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,17,23,0.95);z-index:20}
.screen h1{font-size:36px;color:var(--accent);margin-bottom:20px}
.screen p{font-size:16px;margin:8px 0}
.btn{background:var(--accent);color:#fff;border:none;padding:12px 32px;font-size:18px;border-radius:8px;cursor:pointer;margin-top:16px}
@media(max-width:600px){#touchControls{display:block}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div id="header">
<div>分数: <span id="score">0</span></div>
<div>关卡: <span id="level">1</span></div>
<div>生命: <span id="lives">♥♥♥</span></div>
<div>时间: <span id="timer">60</span></div>
</div>
<canvas id="game"></canvas>
<div id="touchControls">
<div class="dpad">
<div class="empty"></div><button id="btnUp">▲</button><div class="empty"></div>
<button id="btnLeft">◀</button><div class="empty"></div><button id="btnRight">▶</button>
<div class="empty"></div><button id="btnDown">▼</button><div class="empty"></div>
</div>
</div>
<div class="screen" id="startScreen">
<h1>🐸 过马路</h1>
<p>帮助青蛙安全过马路和过河！</p>
<p>躲避车辆，踩在木头上过河</p>
<button class="btn" onclick="startGame()">开始游戏</button>
</div>
<div class="screen" id="gameOverScreen" style="display:none">
<h1>游戏结束</h1>
<p>分数: <span id="finalScore">0</span></p>
<button class="btn" onclick="startGame()">重新开始</button>
</div>
<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=400,H=560,TILE=40;
C.width=W;C.height=H;
const ROWS=H/TILE;
let frog,cars,logs,lilyPads,score,lives,level,gameState,timer,timerInterval,maxFrogs;
const WATER_ROWS=[3,4,5,6];
const ROAD_ROWS=[7,8,9,10];
const SAFE_ROWS=[0,2,11];
const GOAL_ROW=1;
function initLevel(){
frog={x:W/2-TILE/2,y:(ROWS-1)*TILE,dir:0,anim:0};
maxFrogs=5;
cars=[];
const speeds=[1.5,2,2.5,3,3.5];
const dirs=[1,-1,1,-1,1];
for(let i=0;i<ROAD_ROWS.length;i++){
const row=ROAD_ROWS[i];
const numCars=2+Math.floor(Math.random()*2);
const spd=(speeds[i%5]+level*0.3)*(dirs[i]);
for(let j=0;j<numCars;j++){
cars.push({x:j*(W/numCars)+Math.random()*60-30,y:row*TILE,w:30+Math.random()*20,h:TILE-4,spd:spd,color:['#f44','#f90','#ff0','#0f0','#0af'][Math.floor(Math.random()*5)]});
}
}
logs=[];
for(let i=0;i<WATER_ROWS.length;i++){
const row=WATER_ROWS[i];
const numLogs=2+Math.floor(Math.random()*2);
const logW=60+Math.random()*40;
const spd=(1+i*0.3+level*0.2)*(i%2===0?1:-1);
for(let j=0;j<numLogs;j++){
logs.push({x:j*(W/numLogs),y:row*TILE,w:logW,h:TILE-8,spd:spd});
}
if(Math.random()>0.5){
const lx=Math.random()*(W-30);
lilyPads.push({x:lx,y:row*TILE+5,w:25,h:25,spd:spd*0.5});
}
}
timer=60+level*5;
}
function initGame(){
score=0;lives=3;level=1;
lilyPads=[];
initLevel();
}
function drawBackground(){
X.fillStyle='#111';X.fillRect(0,0,W,H);
for(const r of SAFE_ROWS){X.fillStyle='#2a2a2a';X.fillRect(0,r*TILE,W,TILE);}
X.fillStyle='#1a1a3a';X.fillRect(0,GOAL_ROW*TILE,W,TILE);
for(let i=0;i<4;i++){
X.fillStyle='#0d0d2d';
X.fillRect(0,(GOAL_ROW)*TILE+5,8+i*20,15);
}
X.fillStyle='#333';
for(const r of ROAD_ROWS){X.fillRect(0,r*TILE,W,2);
const dashes=5;
for(let d=0;d<dashes;d++){
X.fillStyle='#666';X.fillRect(d*(W/dashes)+20,r*TILE+TILE/2-1,W/dashes-40,2);
X.fillStyle='#333';
}}
for(const r of WATER_ROWS){X.fillStyle='#0a2a4a';X.fillRect(0,r*TILE,W,TILE);}
}
function drawFrog(){
const x=frog.x,y=frog.y;
X.fillStyle='#4a4';
const angles=[0,Math.PI/2,Math.PI,-Math.PI/2];
X.save();X.translate(x+TILE/2,y+TILE/2);X.rotate(angles[frog.dir]);
X.beginPath();
X.ellipse(0,-4,8,6,0,0,Math.PI*2);X.fill();
X.fillStyle='#6c6';
X.beginPath();X.arc(-5,-8,3,0,Math.PI*2);X.fill();
X.beginPath();X.arc(5,-8,3,0,Math.PI*2);X.fill();
X.fillStyle='#fff';
X.beginPath();X.arc(-5,-8,1.5,0,Math.PI*2);X.fill();
X.beginPath();X.arc(5,-8,1.5,0,Math.PI*2);X.fill();
X.fillStyle='#4a4';
X.fillRect(-10,2,5,10);X.fillRect(5,2,5,10);
X.fillRect(-12,-2,4,8);X.fillRect(8,-2,4,8);
X.restore();
}
function drawCars(){
for(const c of cars){
X.fillStyle=c.color;
const r=4;
X.beginPath();X.moveTo(c.x+r,c.y);X.lineTo(c.x+c.w-r,c.y);X.quadraticCurveTo(c.x+c.w,c.y,c.x+c.w,c.y+r);
X.lineTo(c.x+c.w,c.y+c.h-r);X.quadraticCurveTo(c.x+c.w,c.y+c.h,c.x+c.w-r,c.y+c.h);
X.lineTo(c.x+r,c.y+c.h);X.quadraticCurveTo(c.x,c.y+c.h,c.x,c.y+c.h-r);
X.lineTo(c.x,c.y+r);X.quadraticCurveTo(c.x,c.y,c.x+r,c.y);X.fill();
X.fillStyle='#333';X.fillRect(c.x+3,c.y+3,c.w-6,c.h-6);
X.fillStyle='#ff0';X.fillRect(c.x+c.w-6,c.y+4,4,4);
X.fillStyle='#f00';X.fillRect(c.x+2,c.y+4,4,4);
}
}
function drawLogs(){
for(const l of logs){
X.fillStyle='#5a3a1a';
X.fillRect(l.x,l.y,l.w,l.h);
X.fillStyle='#4a2a10';
X.fillRect(l.x,l.y,l.w,3);
X.fillRect(l.x,l.y+l.h-3,l.w,3);
X.fillStyle='#6a4a2a';
for(let i=0;i<l.w;i+=15){X.fillRect(l.x+i,l.y+5,8,l.h-10);}
}
for(const p of lilyPads){
X.fillStyle='#2a8a2a';
X.beginPath();X.arc(p.x+p.w/2,p.y+p.h/2,p.w/2,0,Math.PI*2);X.fill();
X.fillStyle='#1a6a1a';
X.beginPath();X.moveTo(p.x+p.w/2,p.y+p.h/2);X.lineTo(p.x+p.w/2,p.y);X.stroke();
}
}
function updateCars(){
for(const c of cars){c.x+=c.spd;if(c.spd>0&&c.x>W)c.x=-c.w;if(c.spd<0&&c.x<-c.w)c.x=W;}
}
function updateLogs(){
for(const l of logs){
l.x+=l.spd;
if(l.spd>0&&l.x>W)l.x=-l.w;
if(l.spd<0&&l.x<-l.w)l.x=W;
}
for(const p of lilyPads){p.x+=p.spd;if(p.spd>0&&p.x>W)p.x=-p.w;if(p.spd<0&&p.x<-p.w)p.x=W;}
}
function checkCarCollision(){
const fr={x:frog.x+4,y:frog.y+4,w:TILE-8,h:TILE-8};
for(const c of cars){
if(fr.x<c.x+c.w&&fr.x+fr.w>c.x&&fr.y<c.y+c.h&&fr.y+fr.h>c.y)return true;
}
return false;
}
function checkLogRide(){
const frogCX=frog.x+TILE/2,frogCY=frog.y+TILE/2;
for(const r of WATER_ROWS){
if(frog.y===r*TILE){
for(const l of logs){
if(frogCX>l.x&&frogCX<l.x+l.w&&frogCY>l.y&&frogCY<l.y+l.h){return l;}
}
for(const p of lilyPads){
if(frogCX>p.x&&frogCX<p.x+p.w&&frogCY>p.y&&frogCY<p.y+p.h){return null;}
}
return'water';
}
}
return null;
}
function moveFrog(dx,dy){
frog.x+=dx*TILE;frog.y+=dy*TILE;
if(dx===1)frog.dir=1;else if(dx===-1)frog.dir=3;
else if(dy===-1)frog.dir=0;else if(dy===1)frog.dir=2;
if(frog.x<0)frog.x=0;if(frog.x>W-TILE)frog.x=W-TILE;
if(frog.y<0)frog.y=0;if(frog.y>H-TILE)frog.y=H-TILE;
for(const s of SAFE_ROWS){
if(frog.y===s*TILE){score+=10;return;}
}
}
function update(){
if(gameState!=='playing')return;
updateCars();updateLogs();
const ride=checkLogRide();
if(ride==='water'){
lives--;
if(lives<=0){gameState='over';showGameOver();return;}
frog.y=(ROWS-1)*TILE;frog.x=W/2-TILE/2;
}else if(ride&&ride.spd){frog.x+=ride.spd;if(frog.x<0)frog.x=0;if(frog.x>W-TILE)frog.x=W-TILE;}
if(checkCarCollision()){
lives--;
if(lives<=0){gameState='over';showGameOver();return;}
frog.y=(ROWS-1)*TILE;frog.x=W/2-TILE/2;
}
if(frog.y<=TILE){
score+=100+timer*5;
level++;
lilyPads=[];
initLevel();
}
updateUI();
}
function render(){
drawBackground();drawLogs();drawCars();drawFrog();
}
function gameLoop(){update();render();if(gameState==='playing')requestAnimationFrame(gameLoop);}
function updateUI(){
document.getElementById('score').textContent=score;
document.getElementById('level').textContent=level;
document.getElementById('lives').textContent='♥'.repeat(Math.max(0,lives));
document.getElementById('timer').textContent=timer;
}
function showGameOver(){
document.getElementById('gameOverScreen').style.display='flex';
document.getElementById('finalScore').textContent=score;
}
function startGame(){
document.getElementById('startScreen').style.display='none';
document.getElementById('gameOverScreen').style.display='none';
gameState='playing';
initGame();updateUI();gameLoop();
if(timerInterval)clearInterval(timerInterval);
timerInterval=setInterval(()=>{
if(timer>0){timer--;updateUI();}
else{gameState='over';showGameOver();}
},1000);
}
document.addEventListener('keydown',e=>{
if(gameState!=='playing')return;
switch(e.key){
case'ArrowUp':case'w':moveFrog(0,-1);break;
case'ArrowDown':case's':moveFrog(0,1);break;
case'ArrowLeft':case'a':moveFrog(-1,0);break;
case'ArrowRight':case'd':moveFrog(1,0);break;
}
});
const btnMap={btnUp:[0,-1],btnDown:[0,1],btnLeft:[-1,0],btnRight:[1,0]};
for(const[id,d]of Object.entries(btnMap)){
document.getElementById(id).addEventListener('touchstart',e=>{e.preventDefault();moveFrog(d[0],d[1]);});
}
let tx,ty;
C.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;});
C.addEventListener('touchend',e=>{
const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
if(Math.abs(dx)>Math.abs(dy)){moveFrog(dx>0?1:-1,0);}
else{moveFrog(0,dy>0?1:-1);}
});
</script>
<script src="../i18n.js"></script>
</body>
</html>
