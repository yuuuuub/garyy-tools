<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔬 粒子物理</title>
<meta property="og:title" content="🔬 粒子物理">
<meta property="og:description" content="🔬 粒子物理 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="粒子物理 - 模拟粒子加速器与碰撞实验">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>">
<script src="i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.hdr{text-align:center;margin-bottom:16px}.hdr h1{font-size:1.6rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.canvas-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
canvas{display:block;width:100%}
.controls{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.controls .row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.controls label{font-size:.8rem;color:var(--text2);min-width:70px}
.controls input[type=range]{flex:1;accent-color:var(--accent)}
.controls .val{font-size:.8rem;color:var(--accent);min-width:50px;text-align:right}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.85}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.8rem;transition:all .2s}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.info-bar{display:flex;gap:16px;justify-content:center;color:var(--text2);font-size:.8rem;padding:8px 0;flex-wrap:wrap}
.info-bar span{color:var(--accent);font-weight:600}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="hdr"><h1>🔬 粒子物理</h1><p>模拟粒子加速器与碰撞实验</p></div>

<div class="tabs" id="expTabs">
<button class="active" data-exp="accelerator">加速器</button>
<button data-exp="collision">碰撞</button>
<button data-exp="decay">衰变</button>
<button data-exp="field">力场</button>
</div>

<div class="canvas-wrap"><canvas id="c" width="800" height="500"></canvas></div>

<div class="info-bar">
<span>粒子: <b id="pCount">0</b></span>
<span>碰撞: <b id="collCount">0</b></span>
<span>能量: <b id="totalE">0</b> MeV</span>
<span>平均寿命: <b id="avgLife">∞</b></span>
</div>

<div class="btn-row">
<button class="btn btn-primary" id="btnFire">🔥 发射粒子</button>
<button class="btn btn-success" id="btnCollision">💥 碰撞</button>
<button class="btn btn-danger" id="btnClear">🗑 清除</button>
<button class="btn btn-outline" id="btnAuto">⚡ 自动模式</button>
</div>

<div class="controls">
<div class="row"><label>能量</label><input type="range" id="energy" min="1" max="100" value="50"><span class="val" id="energyVal">50 MeV</span></div>
<div class="row"><label>磁场</label><input type="range" id="mfield" min="0" max="100" value="30"><span class="val" id="mfVal">30 T</span></div>
<div class="row"><label>寿命</label><input type="range" id="lifetime" min="1" max="200" value="100"><span class="val" id="lifeVal">100</span></div>
<div class="row"><label>质量</label><input type="range" id="mass" min="1" max="50" value="5"><span class="val" id="massVal">5</span></div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=canvas.width,H=canvas.height,exp='accelerator',running=true,autoMode=false;
let particles=[],trails=[],collCount=0;
let eEnergy=50,mField=30,lifeSpan=100,mass=5;

const pColors=['#3b82f6','#22c55e','#ef4444','#f59e0b','#a855f7','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6'];
const pNames=['电子','质子','中子','π介子','K介子','μ子','τ子','光子','胶子','W玻色子'];

class Particle{
constructor(x,y,vx,vy,type){
this.x=x;this.y=y;this.vx=vx;this.vy=vy;
this.type=type||Math.floor(Math.random()*pColors.length);
this.color=pColors[this.type];this.name=pNames[this.type];
this.r=3+this.mass*.3;this.life=lifeSpan;this.age=0;this.mass=mass;
this.trail=[];this.charge=Math.random()>.5?1:-1;this.spin=Math.floor(Math.random()*3);
}
update(){
this.age++;
if(exp==='field'){
const cx=W/2,cy=H/2;
const dx=cx-this.x,dy=cy-this.y;
const dist=Math.sqrt(dx*dx+dy*dy)+1;
const force=mField*.5*this.charge/(dist*dist);
this.vx+=dx/dist*force*.1;this.vy+=dy/dist*force*.1;
}
if(exp==='accelerator'){
const cx=W/2,cy=H/2;
const dx=this.x-cx,dy=this.y-cy;
const dist=Math.sqrt(dx*dx+dy*dy);
const force=mField*.02/(dist*.01+1);
this.vx+=-dy/dist*force;this.vy+=dx/dist*force;
}
this.x+=this.vx;this.y+=this.vy;
this.vx*=.999;this.vy*=.999;
this.trail.push({x:this.x,y:this.y,a:1});
if(this.trail.length>20)this.trail.shift();
return this.age<this.life&&this.x>-50&&this.x<W+50&&this.y>-50&&this.y<H+50;
}
draw(){
this.trail.forEach((t,i)=>{
const a=i/this.trail.length*.5;
ctx.beginPath();ctx.arc(t.x,t.y,this.r*.5,0,Math.PI*2);
ctx.fillStyle=this.color+Math.floor(a*255).toString(16).padStart(2,'0');ctx.fill();
});
const alpha=1-this.age/this.life;
ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
ctx.fillStyle=this.color+Math.floor(alpha*255).toString(16).padStart(2,'0');ctx.fill();
ctx.beginPath();ctx.arc(this.x,this.y,this.r+3,0,Math.PI*2);
ctx.strokeStyle=this.color+'40';ctx.stroke();
}
}

function fireParticle(){
const angle=Math.random()*Math.PI*2;
const speed=eEnergy*.1;
const x=exp==='accelerator'?W/2+Math.cos(angle)*150:50+Math.random()*(W-100);
const y=exp==='accelerator'?H/2+Math.sin(angle)*150:50+Math.random()*(H-100);
particles.push(new Particle(x,y,Math.cos(angle)*speed,Math.sin(angle)*speed));
}

function triggerCollision(){
const cx=W/2,cy=H/2;
const count=10+Math.floor(eEnergy*.5);
for(let i=0;i<count;i++){
const a=i/count*Math.PI*2;
const speed=1+Math.random()*eEnergy*.15;
particles.push(new Particle(cx,cy,Math.cos(a)*speed,Math.sin(a)*speed));
}
collCount++;
}

function decay(p){
if(Math.random()<.02&&particles.length<500){
const a=Math.random()*Math.PI*2;
const s=p.vx*.5;
particles.push(new Particle(p.x,p.y,Math.cos(a)*s,Math.sin(a)*s));
}
}

function checkDecay(){
if(exp==='decay'){
particles.forEach(p=>{if(Math.random()<.005)decay(p);});
}
}

function draw(){
ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#161b22';ctx.lineWidth=.5;
for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
for(let i=0;i<H;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}
if(exp==='accelerator'){
ctx.beginPath();ctx.arc(W/2,H/2,150,0,Math.PI*2);ctx.strokeStyle='#30363d';ctx.lineWidth=4;ctx.stroke();
ctx.beginPath();ctx.arc(W/2,H/2,5,0,Math.PI*2);ctx.fillStyle='#f59e0b';ctx.fill();
}
if(exp==='field'){
const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,200);
grad.addColorStop(0,'#f59e0b20');grad.addColorStop(1,'transparent');
ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
}
particles.forEach(p=>p.draw());
document.getElementById('pCount').textContent=particles.length;
document.getElementById('collCount').textContent=collCount;
const totalE=particles.reduce((s,p)=>s+Math.sqrt(p.vx*p.vx+p.vy*p.vy)*p.mass,0);
document.getElementById('totalE').textContent=totalE.toFixed(0);
const avgAge=particles.length>0?particles.reduce((s,p)=>s+p.age,0)/particles.length:0;
document.getElementById('avgLife').textContent=avgAge.toFixed(0);
}

function loop(){
if(!running)return requestAnimationFrame(loop);
particles=particles.filter(p=>p.update());
checkDecay();
if(autoMode&&Math.random()<.05)fireParticle();
draw();requestAnimationFrame(loop);
}

canvas.addEventListener('click',e=>{
const rect=canvas.getBoundingClientRect();
const x=(e.clientX-rect.left)*W/rect.width;
const y=(e.clientY-rect.top)*H/rect.height;
const a=Math.atan2(y-H/2,x-W/2);
const s=eEnergy*.1;
particles.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s));
});

document.getElementById('btnFire').onclick=fireParticle;
document.getElementById('btnCollision').onclick=triggerCollision;
document.getElementById('btnClear').onclick=()=>{particles=[];collCount=0;};
document.getElementById('btnAuto').onclick=function(){autoMode=!autoMode;this.textContent=autoMode?'🛑 停止自动':'⚡ 自动模式';};

document.getElementById('expTabs').onclick=e=>{
const btn=e.target.closest('button');if(!btn)return;
document.querySelectorAll('#expTabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');exp=btn.dataset.exp;particles=[];collCount=0;
};

document.getElementById('energy').oninput=function(){eEnergy=+this.value;document.getElementById('energyVal').textContent=this.value+' MeV';};
document.getElementById('mfield').oninput=function(){mField=+this.value;document.getElementById('mfVal').textContent=this.value+' T';};
document.getElementById('lifetime').oninput=function(){lifeSpan=+this.value;document.getElementById('lifeVal').textContent=this.value;};
document.getElementById('mass').oninput=function(){mass=+this.value;document.getElementById('massVal').textContent=this.value;};

loop();
</script>
</body>
</html>
