<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字互动</title><meta name="description" content="汉字互动 - 在线互动学习汉字"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.interactive-area{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.interactive-char{font-size:8rem;font-weight:700;color:var(--blue);cursor:pointer;transition:all .2s;user-select:none}.interactive-char:hover{transform:scale(1.1)}.interactive-char:active{transform:scale(0.95)}.interactive-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.interactive-option{padding:12px 24px;background:var(--card);border:2px solid var(--border);border-radius:8px;cursor:pointer;font-size:1rem;transition:all .2s}.interactive-option:hover{border-color:var(--blue)}.interactive-option.correct{border-color:var(--green);background:rgba(35,134,54,.1)}.interactive-option.wrong{border-color:var(--red);background:rgba(239,68,68,.1)}.score-display{font-size:1.2rem;margin:16px 0}.timer{font-size:2rem;font-weight:700;color:var(--blue);margin:16px 0}</style><meta property="og:title" content="汉字互动"><meta property="og:description" content="汉字互动 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"></head><body>
<div class="container"><h1>🎮 汉字互动</h1><p class="sub">在线互动学习汉字</p>
<div class="card">
<div class="btn-group">
<button class="btn" onclick="startInteractive()">开始互动</button>
<button class="btn" onclick="nextQuestion()">下一题</button>
<button class="btn" onclick="showAnswer()">查看答案</button>
</div>
<div class="score-display" id="scoreDisplay"></div>
<div class="timer" id="timer"></div>
</div>
<div id="result"></div>
<div class="card" id="historyCard" style="display:none">
<h3 style="margin-bottom:16px">互动记录</h3>
<div id="history" style="padding:12px;background:var(--bg);border-radius:8px"></div>
</div></div>
<script src="../i18n.js" defer></script>
<script>
var characters=[
  {char:'一',pinyin:'yī',meaning:'一，第一'},
  {char:'二',pinyin:'èr',meaning:'二，第二'},
  {char:'三',pinyin:'sān',meaning:'三，第三'},
  {char:'四',pinyin:'sì',meaning:'四，第四'},
  {char:'五',pinyin:'wǔ',meaning:'五，第五'},
  {char:'六',pinyin:'liù',meaning:'六，第六'},
  {char:'七',pinyin:'qī',meaning:'七，第七'},
  {char:'八',pinyin:'bā',meaning:'八，第八'},
  {char:'九',pinyin:'jiǔ',meaning:'九，第九'},
  {char:'十',pinyin:'shí',meaning:'十，第十'},
  {char:'大',pinyin:'dà',meaning:'大的，巨大'},
  {char:'小',pinyin:'xiǎo',meaning:'小的，微小'},
  {char:'多',pinyin:'duō',meaning:'多的，很多'},
  {char:'少',pinyin:'shǎo',meaning:'少的，很少'},
  {char:'上',pinyin:'shàng',meaning:'上面，上方'},
  {char:'下',pinyin:'xià',meaning:'下面，下方'}
];
var currentQuestion=null;
var score=0;
var total=0;
var history=[];
var timer=null;
var timeLeft=10;
var questionType='pinyin';
function startInteractive(){
  score=0;
  total=0;
  history=[];
  nextQuestion();
}
function nextQuestion(){
  clearInterval(timer);
  timeLeft=10;
  updateTimer();
  timer=setInterval(function(){
    timeLeft--;
    updateTimer();
    if(timeLeft<=0){
      clearInterval(timer);
      showAnswer();
    }
  },1000);
  var randomIndex=Math.floor(Math.random()*characters.length);
  currentQuestion=characters[randomIndex];
  questionType=Math.random()>0.5?'pinyin':'meaning';
  var options=[currentQuestion];
  while(options.length<4){
    var randomOption=characters[Math.floor(Math.random()*characters.length)];
    if(!options.some(function(o){return o.char===randomOption.char;})){
      options.push(randomOption);
    }
  }
  options=shuffleArray(options);
  var html='<div class="card">';
  html+='<div class="interactive-area">';
  html+='<div class="interactive-char" onclick="speakChar()">'+currentQuestion.char+'</div>';
  html+='<div style="font-size:1.1rem;color:var(--text2);margin-top:16px">';
  html+=questionType==='pinyin'?'这个字的拼音是什么？':'这个字的含义是什么？';
  html+='</div></div>';
  html+='<div class="interactive-options">';
  options.forEach(function(option){
    var displayText=questionType==='pinyin'?option.pinyin:option.meaning;
    html+='<div class="interactive-option" onclick="checkAnswer(this,\''+displayText+'\')">'+displayText+'</div>';
  });
  html+='</div></div>';
  document.getElementById('result').innerHTML=html;
}
function checkAnswer(element,answer){
  if(!currentQuestion)return;
  total++;
  clearInterval(timer);
  var buttons=document.querySelectorAll('.interactive-option');
  buttons.forEach(function(btn){btn.style.pointerEvents='none';});
  var correctAnswer=questionType==='pinyin'?currentQuestion.pinyin:currentQuestion.meaning;
  if(answer===correctAnswer){
    element.classList.add('correct');
    score+=timeLeft;
    history.push({char:currentQuestion.char,correct:true,time:10-timeLeft});
  }else{
    element.classList.add('wrong');
    history.push({char:currentQuestion.char,correct:false,time:10-timeLeft});
    buttons.forEach(function(btn){
      if(btn.textContent===correctAnswer)btn.classList.add('correct');
    });
  }
  updateScore();
  updateHistory();
}
function showAnswer(){
  if(!currentQuestion)return;
  total++;
  clearInterval(timer);
  var correctAnswer=questionType==='pinyin'?currentQuestion.pinyin:currentQuestion.meaning;
  var buttons=document.querySelectorAll('.interactive-option');
  buttons.forEach(function(btn){
    btn.style.pointerEvents='none';
    if(btn.textContent===correctAnswer)btn.classList.add('correct');
  });
  history.push({char:currentQuestion.char,correct:false,time:10});
  updateScore();
  updateHistory();
}
function speakChar(){
  if(!currentQuestion)return;
  var utterance=new SpeechSynthesisUtterance(currentQuestion.char);
  utterance.lang='zh-CN';
  speechSynthesis.speak(utterance);
}
function updateTimer(){
  document.getElementById('timer').textContent=timeLeft+'秒';
  var timerElement=document.getElementById('timer');
  if(timeLeft<=3)timerElement.style.color='var(--red)';
  else if(timeLeft<=5)timerElement.style.color='var(--blue)';
  else timerElement.style.color='var(--green)';
}
function updateScore(){
  var correctCount=history.filter(function(h){return h.correct;}).length;
  var percentage=Math.round(correctCount/total*100);
  document.getElementById('scoreDisplay').innerHTML='得分：'+score+'分 | 正确：'+correctCount+'/'+total+' ('+percentage+'%)';
}
function updateHistory(){
  if(history.length===0){
    document.getElementById('historyCard').style.display='none';
    return;
  }
  document.getElementById('historyCard').style.display='block';
  var html='';
  history.forEach(function(item){
    html+='<div style="padding:8px;margin-bottom:4px;background:'+(item.correct?'rgba(35,134,54,.1)':'rgba(239,68,68,.1)')+';border-radius:4px">';
    html+='<strong>'+item.char+'</strong> - '+(item.correct?'正确':'错误')+' | 用时：'+item.time+'秒';
    html+='</div>';
  });
  document.getElementById('history').innerHTML=html;
}
function shuffleArray(array){
  for(var i=array.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var temp=array[i];
    array[i]=array[j];
    array[j]=temp;
  }
  return array;
}
startInteractive();
</script></body></html>
