<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浇水计划器</title>
<meta name="description" content="智能浇水计划，根据植物需求制定个性化浇水时间表">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0757b5;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=time],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
button.suc{background:var(--success)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;margin-right:4px}
.tag.g{background:var(--accent);color:#fff}.tag.w{background:var(--warn);color:#fff}.tag.r{background:var(--danger);color:#fff}.tag.s{background:var(--success);color:#fff}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.week-cell{text-align:center;padding:8px 4px;border-radius:8px;font-size:.8rem;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:var(--bg)}
.week-cell.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.week-cell.has-task{border-color:var(--success)}
.week-cell .day-name{font-size:.7rem;color:var(--text2)}
.week-cell.active .day-name{color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:12px}
.stat-item{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.stat-item .num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-item .label{font-size:.8rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
.timeline{position:relative;padding-left:20px;margin-top:12px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;padding:12px 0 12px 16px;border-bottom:1px solid var(--border)}
.timeline-item::before{content:'';position:absolute;left:-16px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.timeline-item.done::before{background:var(--success)}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>💧 浇水计划器</h1><p>智能浇水提醒 · 个性化时间表</p></div>

<div class="cd">
<h2>添加植物</h2>
<div class="fr">
<div><label>植物名称</label><input type="text" id="wName" placeholder="如：绿萝"></div>
<div><label>浇水频率</label><select id="wFreq"><option value="1">每天</option><option value="2">每2天</option><option value="3" selected>每3天</option><option value="5">每5天</option><option value="7">每周</option><option value="14">每两周</option></select></div>
</div>
<div class="fr">
<div><label>浇水时间</label><input type="time" id="wTime" value="07:00"></div>
<div><label>浇水量</label><select id="wAmount"><option>少量(喷雾)</option><option>适量(湿润)</option><option>大量(浇透)</option></select></div>
</div>
<label>每周浇水日</label>
<div class="week-grid" id="weekGrid"></div>
<div class="bg"><button onclick="addSchedule()">添加计划</button></div>
</div>

<div class="cd">
<h2>今日浇水</h2>
<div id="todayList" class="es">今天无需浇水</div>
</div>

<div class="cd">
<h2>本周计划</h2>
<div id="weekView"></div>
</div>

<div class="cd">
<h2>所有计划</h2>
<div id="scheduleList" class="es">暂无计划</div>
</div>

<div class="cd">
<h2>浇水统计</h2>
<div class="stats-grid" id="statsGrid"></div>
</div>

<div class="cd">
<h2>浇水历史</h2>
<div id="historyTimeline" class="es">暂无记录</div>
</div>
</div>

<script>
const DB='watering_scheduler_db';
const HIST_DB='watering_history_db';
let schedules=JSON.parse(localStorage.getItem(DB)||'[]');
let history=JSON.parse(localStorage.getItem(HIST_DB)||'[]');
let selectedDays=[0,1,2,3,4,5,6];

const DAY_NAMES=['日','一','二','三','四','五','六'];

function initWeekGrid(){
  const el=document.getElementById('weekGrid');
  el.innerHTML=DAY_NAMES.map((d,i)=>`<div class="week-cell active" onclick="toggleDay(${i},this)" data-day="${i}"><div class="day-name">周${d}</div><div>🌱</div></div>`).join('');
}

function toggleDay(i,el){
  if(selectedDays.includes(i)){selectedDays=selectedDays.filter(d=>d!==i);el.classList.remove('active')}
  else{selectedDays.push(i);el.classList.add('active')}
}

function addSchedule(){
  const name=document.getElementById('wName').value.trim();
  if(!name)return alert('请输入植物名称');
  const freq=+document.getElementById('wFreq').value;
  const time=document.getElementById('wTime').value;
  const amount=document.getElementById('wAmount').value;
  schedules.push({id:Date.now(),name,freq,time,amount,days:[...selectedDays],lastWater:new Date().toISOString()});
  localStorage.setItem(DB,JSON.stringify(schedules));
  document.getElementById('wName').value='';
  renderAll();
}

function renderAll(){renderToday();renderWeek();renderSchedules();renderStats();renderHistory()}

function renderToday(){
  const el=document.getElementById('todayList');
  const today=new Date();
  const todayDay=today.getDay();
  const due=schedules.filter(s=>s.days.includes(todayDay));
  if(!due.length){el.innerHTML='<div class="es">今天无需浇水 💤</div>';return}
  el.innerHTML=due.map(s=>{
    const last=new Date(s.lastWater);
    const daysSince=Math.floor((today-last)/(86400000));
    const overdue=daysSince>=s.freq;
    return`<div class="li">
      <div><strong>${s.name}</strong> <span class="tag ${overdue?'r':'g'}">${overdue?'逾期'+daysSince+'天':'正常'}</span></div>
      <div class="bg">
        <button class="suc" style="padding:4px 12px;font-size:.8rem" onclick="waterNow(${s.id})">✓ 已浇水</button>
      </div>
    </div>`}).join('');
}

function renderWeek(){
  const el=document.getElementById('weekView');
  const today=new Date();
  const startOfWeek=new Date(today);startOfWeek.setDate(today.getDate()-today.getDay());
  let html='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">';
  for(let i=0;i<7;i++){
    const d=new Date(startOfWeek);d.setDate(startOfWeek.getDate()+i);
    const day=d.getDay();
    const isToday=d.toDateString()===today.toDateString();
    const tasks=schedules.filter(s=>s.days.includes(day));
    html+=`<div style="padding:8px;background:var(--bg);border-radius:8px;${isToday?'border:2px solid var(--accent)':''}">
      <div style="text-align:center;font-size:.8rem;color:var(--text2);margin-bottom:4px">${DAY_NAMES[day]}</div>
      <div style="text-align:center;font-size:.9rem;font-weight:600;margin-bottom:4px">${d.getDate()}</div>
      ${tasks.map(t=>`<div style="font-size:.75rem;text-align:center;padding:2px 0">💧${t.name}</div>`).join('')}
    </div>`}
  html+='</div>';
  el.innerHTML=html;
}

function renderSchedules(){
  const el=document.getElementById('scheduleList');
  if(!schedules.length){el.innerHTML='<div class="es">暂无计划</div>';return}
  el.innerHTML=schedules.map((s,i)=>{
    const daysStr=s.days.map(d=>'周'+DAY_NAMES[d]).join('、');
    return`<div class="li" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><strong>${s.name}</strong> <span class="tag g">${s.time}</span> <span class="tag w">每${s.freq}天</span></div>
      </div>
      <div style="font-size:.85rem;color:var(--text2);margin-top:4px">浇水量：${s.amount} | 周期：${daysStr}</div>
      <div class="bg">
        <button class="suc" style="padding:4px 12px;font-size:.8rem" onclick="waterNow(${s.id})">✓ 浇水</button>
        <button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="schedules.splice(${i},1);localStorage.setItem('${DB}',JSON.stringify(schedules));renderAll()">删除</button>
      </div>
    </div>`}).reverse().join('');
}

function waterNow(id){
  const s=schedules.find(x=>x.id===id);if(!s)return;
  s.lastWater=new Date().toISOString();
  history.push({plant:s.name,date:new Date().toISOString(),amount:s.amount,time:s.time});
  localStorage.setItem(DB,JSON.stringify(schedules));
  localStorage.setItem(HIST_DB,JSON.stringify(history));
  renderAll();
}

function renderStats(){
  const el=document.getElementById('statsGrid');
  const totalPlants=schedules.length;
  const totalToday=schedules.filter(s=>s.days.includes(new Date().getDay())).length;
  const totalWatered=history.length;
  const avgFreq=schedules.length?(schedules.reduce((s,x)=>s+x.freq,0)/schedules.length).toFixed(1):0;
  el.innerHTML=`
    <div class="stat-item"><div class="num">${totalPlants}</div><div class="label">植物总数</div></div>
    <div class="stat-item"><div class="num">${totalToday}</div><div class="label">今日待浇</div></div>
    <div class="stat-item"><div class="num">${totalWatered}</div><div class="label">累计浇水</div></div>
    <div class="stat-item"><div class="num">${avgFreq}天</div><div class="label">平均周期</div></div>`;
}

function renderHistory(){
  const el=document.getElementById('historyTimeline');
  const recent=history.slice(-20).reverse();
  if(!recent.length){el.innerHTML='<div class="es">暂无记录</div>';return}
  el.innerHTML='<div class="timeline">'+recent.map(h=>{
    const d=new Date(h.date);
    return`<div class="timeline-item done">
      <div style="font-weight:600">${h.plant}</div>
      <div style="font-size:.85rem;color:var(--text2)">${d.toLocaleDateString()} ${d.toLocaleTimeString().slice(0,5)} · ${h.amount}</div>
    </div>`}).join('')+'</div>';
}

initWeekGrid();renderAll();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
