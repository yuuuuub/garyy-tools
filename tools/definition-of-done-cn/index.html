<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✅ 完成定义</title>
<meta name="description" content="完成定义(DoD)工具，定义工作项的完成标准">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.checklist{list-style:none;padding:0}
.checklist li{padding:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:.9rem;cursor:pointer;transition:background .2s}
.checklist li:hover{background:rgba(59,130,246,.05)}
.checklist li:last-child{border-bottom:none}
.check-icon{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.checklist li.checked .check-icon{background:var(--green);border-color:var(--green);color:#fff}
.checklist li.checked .check-text{text-decoration:line-through;color:var(--text2)}
.check-text{flex:1}
.remove-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:.85rem}
.add-row{display:flex;gap:6px;margin-top:8px}
.add-row input{margin-bottom:0;flex:1}
.category{margin-bottom:16px}
.category h3{font-size:.9rem;color:var(--text2);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.stat{font-size:.85rem;color:var(--text2);text-align:right}
@media(max-width:600px){body{padding:10px}.ctn{max-width:100%}.cd{padding:14px}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="✅ 完成定义">
<meta property="og:description" content="完成定义(DoD)工具，定义工作项的完成标准">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/definition-of-done-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='dod_data';
let dod=JSON.parse(localStorage.getItem(STORE)||'{"categories":[{"name":"代码质量","items":[{"text":"代码已通过Code Review","done":false},{"text":"单元测试覆盖新增代码","done":false},{"text":"无已知Bug","done":false}]},{"name":"文档","items":[{"text":"README已更新","done":false},{"text":"API文档已更新","done":false}]},{"name":"测试","items":[{"text":"所有测试通过","done":false},{"text":"集成测试通过","done":false}]},{"name":"部署","items":[{"text":"已部署到测试环境","done":false},{"text":"已通知相关人员","done":false}]}]}');
function save(){localStorage.setItem(STORE,JSON.stringify(dod))}
function render(){
  let h=`<div class="hdr"><h1>✅ 完成定义</h1><p>定义工作项的完成标准(Definition of Done)</p></div>`;
  let total=0,done=0;
  dod.categories.forEach(c=>{c.items.forEach(i=>{total++;if(i.done)done++})});
  const pct=total?Math.round(done/total*100):0;
  h+=`<div class="cd"><div class="flex-between"><h2>总进度</h2><span class="stat">${done}/${total} (${pct}%)</span></div>`;
  h+=`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
  dod.categories.forEach((cat,ci)=>{
    h+=`<div class="cd"><div class="flex-between"><h2>${cat.name}</h2><div><button style="padding:4px 10px;font-size:.8rem" onclick="editCategory(${ci})">编辑</button> <button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="delCategory(${ci})">删除</button></div></div>`;
    h+=`<ul class="checklist">`;
    cat.items.forEach((item,ii)=>{
      h+=`<li class="${item.done?'checked':''}" onclick="toggleItem(${ci},${ii})"><span class="check-icon">${item.done?'✓':''}</span><span class="check-text">${item.text}</span><button class="remove-btn" onclick="event.stopPropagation();delItem(${ci},${ii})">✕</button></li>`;
    });
    h+=`</ul>`;
    h+=`<div class="add-row"><input id="add_${ci}" placeholder="添加完成标准..." onkeydown="if(event.key==='Enter')addItem(${ci})"><button style="padding:6px 12px" onclick="addItem(${ci})">+</button></div>`;
    h+=`</div>`;
  });
  h+=`<div class="cd"><h2>添加类别</h2><div class="flex"><input id="newCat" placeholder="类别名称" style="flex:1;margin-bottom:0"><button onclick="addCategory()">添加</button></div></div>`;
  $('app').innerHTML=h;
}
function toggleItem(ci,ii){dod.categories[ci].items[ii].done=!dod.categories[ci].items[ii].done;save();render()}
function delItem(ci,ii){dod.categories[ci].items.splice(ii,1);save();render()}
function addItem(ci){
  const input=$('add_'+ci);const val=input.value.trim();if(!val)return;
  dod.categories[ci].items.push({text:val,done:false});save();input.value='';render();
}
function addCategory(){
  const name=$('newCat').value.trim();if(!name)return;
  dod.categories.push({name,items:[]});save();$('newCat').value='';render();
}
function editCategory(ci){
  const name=prompt('类别名称：',dod.categories[ci].name);
  if(name!==null&&name.trim()){dod.categories[ci].name=name.trim();save();render()}
}
function delCategory(ci){if(!confirm('确定删除此类别?'))return;dod.categories.splice(ci,1);save();render()}
render();
</script>
</body>
</html>
