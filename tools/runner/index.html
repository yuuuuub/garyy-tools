<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏃 跑酷</title>
<meta name="description" content="跑酷游戏，控制角色在城市中奔跑跳跃">
<style>
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;flex-direction:columnscroll-behavior:smooth;}
h1{font-size:1.3rem;margin-bottom:4px}
.info{font-size:.9rem;color:#8b949e;margin-bottom:8px}
canvas{border:2px solid var(--border);border-radius:4px;touch-action:none}
.hint{font-size:.8rem;color:#8b949e;margin-top:8px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🏃 跑酷">
  <meta property="og:description" content="跑酷游戏，控制角色在城市中奔跑跳跃">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/runner/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>🏃 跑酷</h1>
<div class="info">距离 <b id="dist">0</b>m | 金币 <b id="coins">0</b> | 最远 <b id="best">0</b>m</div>
<canvas id="game" width="400" height="250"></canvas>
<div class="hint">点击/空格 跳跃 | 双击 二段跳</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=400,H=250,GROUND=H-40;
let player,obstacles,coinItems,dist,coins,best,gameOver,started,speed;
function init(){
player={x:60,y:GROUND-30,w:24,h:30,vy:0,jumps:2,grounded:true};
obstacles=[];coinItems=[];dist=0;coins=0;gameOver=false;started=false;speed=4;
}
function jump(){
if(player.jumps>0){player.vy=-8;player.jumps--;player.grounded=false}
}
function spawnObstacle(){
const types=['small','tall','double'];
const type=types[Math.floor(Math.random()*3)];
if(type==='small')obstacles.push({x:W+20,y:GROUND-20,w:20,h:20,type});
else if(type==='tall')obstacles.push({x:W+20,y:GROUND-40,w:20,h:40,type});
else{obstacles.push({x:W+20,y:GROUND-20,w:20,h:20,type});obstacles.push({x:W+50,y:GROUND-20,w:20,h:20,type})}
if(Math.random()<0.5)coinItems.push({x:W+100,y:GROUND-80-Math.random()*60,w:16,h:16,collected:false});
}
function update(){
if(gameOver||!started)return;
speed=4+dist/200;
obstacles.forEach(o=>o.x-=speed);
coinItems.forEach(c=>c.x-=speed);
obstacles=obstacles.filter(o=>o.x>-50);
coinItems=coinItems.filter(c=>c.x>-50);
player.vy+=0.5;
player.y+=player.vy;
if(player.y+player.h>=GROUND){player.y=GROUND-player.h;player.vy=0;player.grounded=true;player.jumps=2}
dist+=speed*0.1;
document.getElementById('dist').textContent=Math.floor(dist);
if(Math.random()<0.02+dist/5000)spawnObstacle();
obstacles.forEach(o=>{
if(player.x+player.w>o.x&&player.x<o.x+o.w&&player.y+player.h>o.y&&player.y<o.y+o.h){
gameOver=true;best=Math.max(best,Math.floor(dist));document.getElementById('best').textContent=best;
}});
coinItems.forEach(c=>{
if(!c.collected&&player.x+player.w>c.x&&player.x<c.x+c.w&&player.y+player.h>c.y&&player.y<c.y+c.h){
c.collected=true;coins++;document.getElementById('coins').textContent=coins;
}});
}
function draw(){
ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
for(let i=0;i<5;i++){
const cx=(i*120-dist*0.5)%W;
ctx.fillStyle='rgba(255,255,255,0.1)';
ctx.beginPath();ctx.arc(cx,40+i*15,20,0,Math.PI*2);ctx.arc(cx+15,35+i*15,15,0,Math.PI*2);ctx.fill();
}
ctx.fillStyle='#2d5016';ctx.fillRect(0,GROUND,W,40);
ctx.fillStyle='#3a6b1e';ctx.fillRect(0,GROUND,W,3);
obstacles.forEach(o=>{
ctx.fillStyle='#e74c3c';
if(o.type==='double'){ctx.fillStyle='#c0392b'}
ctx.fillRect(o.x,o.y,o.w,o.h);
ctx.strokeStyle='#a93226';ctx.lineWidth=1;ctx.strokeRect(o.x,o.y,o.w,o.h);
});
coinItems.forEach(c=>{
if(c.collected)return;
ctx.fillStyle='#ffd700';
ctx.beginPath();ctx.arc(c.x+8,c.y+8,8,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#f39c12';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('$',c.x+8,c.y+12);
});
const px=player.x,py=player.y;
ctx.fillStyle='#3498db';
ctx.fillRect(px+2,py+10,20,20);
ctx.fillStyle='#f39c12';
ctx.beginPath();ctx.arc(px+12,py+6,8,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#2c3e50';
const legOffset=player.grounded?Math.sin(Date.now()/100)*4:0;
ctx.fillRect(px+4,py+30,5,6+legOffset);
ctx.fillRect(px+15,py+30,5,6-legOffset);
if(!started){
ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
ctx.fillText('🏃 跑酷',W/2,H/2-20);ctx.font='14px sans-serif';
ctx.fillText('点击开始 | 点击跳跃',W/2,H/2+15);
}
if(gameOver){
ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
ctx.fillText('游戏结束',W/2,H/2-25);
ctx.font='16px sans-serif';ctx.fillText('距离: '+Math.floor(dist)+'m  金币: '+coins,W/2,H/2+10);
ctx.fillText('点击重新开始',W/2,H/2+35);
}
}
function gameLoop(){update();draw();requestAnimationFrame(gameLoop)}
canvas.addEventListener('mousedown',()=>{if(!started)started=true;if(!gameOver)jump()});
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(!started)started=true;if(!gameOver)jump()});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!started)started=true;if(!gameOver)jump()}});
canvas.addEventListener('click',()=>{if(gameOver)init()});
init();gameLoop();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
