<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>太空侵略者</title>
<meta property="og:title" content="太空侵略者">
<meta property="og:description" content="太空侵略者 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="经典太空侵略者游戏，消灭入侵的外星人保卫地球">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none;padding:10px;scroll-behavior:smoothpadding:16px;}
h1{font-size:1.3rem;margin-bottom:8px;color:#3b82f6;text-shadow:0 0 10px #3b82f644}
canvas{background:var(--bg);border:2px solid var(--border);border-radius:8px;touch-action:none}
.hud{display:flex;gap:20px;margin:8px 0;font-size:0.9rem;color:#8b949e}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>🚀 太空侵略者</h1>
<canvas id="game" width="480" height="400"></canvas>
<div class="hud"><span>分数: <b id="score">0</b></span><span>关卡: <b id="level">1</b></span><span>生命: <b id="lives">❤️❤️❤️</b></span></div>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
let player={x:W/2,y:H-40,w:30,h:20};
let bullets=[],eBullets=[],aliens=[],stars=[];
let score=0,lives=3,level=1,alienDir=1,alienSpeed=0.5,frame=0,gameState='start';
let keys={},alienShootTimer=0,particles=[];

function createStars(){stars=[];for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.5})}

function createAliens(){
aliens=[];
for(let r=0;r<4+Math.min(level-1,2);r++)for(let c=0;c<8;c++){
aliens.push({x:40+c*50,y:40+r*35,w:24,h:20,alive:true,type:r<2?2:1})
}
}

function reset(){score=0;lives=3;level=1;player.x=W/2;bullets=[];eBullets=[];particles=[];createAliens();createStars()}
function nextLevel(){level++;bullets=[];eBullets=[];createAliens();alienDir=1}

function addExplosion(x,y,color){
for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:20,color})
}

document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&gameState==='start')startGame()});
document.addEventListener('keyup',e=>{keys[e.code]=false});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(gameState==='start')startGame();else if(gameState==='playing')shoot();else if(gameState==='over')reset(),gameState='playing'});
canvas.addEventListener('pointermove',e=>{
if(gameState!=='playing')return;
const rect=canvas.getBoundingClientRect();
player.x=((e.clientX-rect.left)/rect.width)*W;
player.x=Math.max(15,Math.min(W-15,player.x));
});

function startGame(){reset();gameState='playing'}
function shoot(){if(bullets.length<3)bullets.push({x:player.x,y:player.y-10,vy:-6})}

function draw(){
ctx.fillStyle='#0a0e1a';ctx.fillRect(0,0,W,H);
stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${0.3+s.s*0.2})`;ctx.fillRect(s.x,s.y,s.s,s.s)});
particles.forEach(p=>{ctx.fillStyle=p.color;ctx.globalAlpha=p.life/20;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;

if(gameState==='start'){
ctx.fillStyle='#e6edf3';ctx.font='bold 26px system-ui';ctx.textAlign='center';
ctx.fillText('🚀 太空侵略者',W/2,150);
ctx.font='16px system-ui';ctx.fillStyle='#8b949e';
ctx.fillText('← → 或触摸移动，空格/点击射击',W/2,200);
ctx.fillText('点击/空格开始',W/2,240);return;
}

ctx.fillStyle='#3b82f6';ctx.beginPath();
ctx.moveTo(player.x,player.y-15);ctx.lineTo(player.x-15,player.y+10);ctx.lineTo(player.x+15,player.y+10);ctx.closePath();ctx.fill();
ctx.fillStyle='#60a5fa';ctx.fillRect(player.x-3,player.y+10,6,8);
ctx.fillStyle='#22c55e';bullets.forEach(b=>{ctx.fillRect(b.x-1.5,b.y,3,10)});
ctx.fillStyle='#ef4444';eBullets.forEach(b=>{ctx.fillRect(b.x-1.5,b.y,3,10)});
aliens.forEach(a=>{
if(!a.alive)return;
ctx.fillStyle=a.type===2?'#ef4444':'#eab308';
ctx.beginPath();ctx.arc(a.x,a.y,a.w/2,0,Math.PI*2);ctx.fill();
ctx.fillStyle=a.type===2?'#fca5a5':'#fde68a';
ctx.fillRect(a.x-8,a.y-4,4,4);ctx.fillRect(a.x+4,a.y-4,4,4);
});

document.getElementById('score').textContent=score;
document.getElementById('level').textContent=level;
document.getElementById('lives').textContent='❤️'.repeat(lives);

if(gameState==='over'){
ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ef4444';ctx.font='bold 30px system-ui';ctx.textAlign='center';
ctx.fillText('游戏结束',W/2,180);
ctx.fillStyle='#e6edf3';ctx.font='20px system-ui';ctx.fillText('分数: '+score+'  关卡: '+level,W/2,220);
ctx.fillStyle='#8b949e';ctx.font='16px system-ui';ctx.fillText('点击重新开始',W/2,270);
}
}

function update(){
if(gameState!=='playing')return;
frame++;
if(keys.ArrowLeft||keys.KeyA)player.x-=5;
if(keys.ArrowRight||keys.KeyD)player.x+=5;
player.x=Math.max(15,Math.min(W-15,player.x));
bullets.forEach(b=>b.y+=b.vy);bullets=bullets.filter(b=>b.y>-10);
let hitEdge=false;
aliens.forEach(a=>{if(a.alive){a.x+=alienDir*alienSpeed;if(a.x+12>W-5||a.x-12<5)hitEdge=true}});
if(hitEdge){alienDir*=-1;aliens.forEach(a=>{if(a.alive)a.y+=10})}
alienShootTimer++;
if(alienShootTimer>60-Math.min(level*5,30)){
const living=aliens.filter(a=>a.alive);
if(living.length){const a=living[Math.floor(Math.random()*living.length)];eBullets.push({x:a.x,y:a.y+10,vy:3+level*0.3})}
alienShootTimer=0;
}
eBullets.forEach(b=>b.y+=b.vy);eBullets=eBullets.filter(b=>b.y<H+10);
bullets.forEach(b=>{aliens.forEach(a=>{
if(!a.alive)return;
if(Math.abs(b.x-a.x)<a.w/2+3&&Math.abs(b.y-a.y)<a.h/2+5){
a.alive=false;b.y=-100;score+=a.type===2?20:10;
addExplosion(a.x,a.y,a.type===2?'#ef4444':'#eab308');
}
})});
eBullets.forEach(b=>{
if(Math.abs(b.x-player.x)<15&&Math.abs(b.y-player.y)<15){
lives--;b.y=H+100;addExplosion(player.x,player.y,'#3b82f6');if(lives<=0)gameState='over'
}
});
if(aliens.some(a=>a.alive&&a.y+a.h/2>player.y-20))gameState='over';
if(aliens.every(a=>!a.alive))nextLevel();
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});
particles=particles.filter(p=>p.life>0);
}

function loop(){draw();update();requestAnimationFrame(loop)}
createStars();createAliens();loop();
</script>
</body>
</html>
