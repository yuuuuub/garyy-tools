<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字配对</title><meta name="description" content="汉字配对 - 汉字与拼音、含义配对记忆游戏"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#f59e0b;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin:4px}.btn:hover{opacity:.85}.btn-green{background:var(--green)}.score-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.9rem}.score-bar .score{font-size:1.3rem;font-weight:700;color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.tile{padding:16px 8px;background:var(--bg);border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .3s;font-size:1.1rem;min-height:60px;display:flex;align-items:center;justify-content:center}.tile:hover{border-color:var(--blue);transform:scale(1.04)}.tile.selected{border-color:var(--blue);background:rgba(59,130,246,.1)}.tile.matched{background:rgba(35,134,54,.15);border-color:var(--green);color:var(--green);pointer-events:none}.tile.wrong{border-color:var(--red);animation:shake .4s}.tile .char{font-size:1.8rem;font-weight:700}.tile .text{font-size:.85rem;color:var(--text2)}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.timer{font-size:1rem;color:var(--text2)}.mode-select{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.mode-card{padding:20px;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:center;transition:var(--transition)}.mode-card:hover{border-color:var(--blue)}.mode-card.active{border-color:var(--blue);background:rgba(59,130,246,.1)}.win-screen{text-align:center;padding:30px}.win-screen .big{font-size:3rem;font-weight:700;color:var(--green)}.progress{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:12px}.progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字配对"><meta property="og:description" content="汉字配对 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🧩 汉字配对</h1><p class="sub">将汉字与对应的拼音或含义配对</p>
<div id="menu" class="card">
<div class="mode-select">
<div class="mode-card active" onclick="selectMode('pinyin',this)"><h3>🔤 拼音配对</h3><p>汉字 ↔ 拼音</p></div>
<div class="mode-card" onclick="selectMode('meaning',this)"><h3>📖 含义配对</h3><p>汉字 ↔ 释义</p></div>
<div class="mode-card" onclick="selectMode('radical',this)"><h3>🔍 部首配对</h3><p>汉字 ↔ 部首</p></div>
<div class="mode-card" onclick="selectMode('structure',this)"><h3>🏗️ 结构配对</h3><p>汉字 ↔ 结构</p></div>
</div>
<button class="btn btn-green" onclick="startGame()" style="margin-top:12px">开始游戏</button>
</div>
<div id="game" style="display:none">
<div class="score-bar"><div>配对：<span id="matchedCount">0</span>/<span id="totalPairs">0</span></div><div class="timer" id="timerDisplay">⏱ 0s</div><div class="score">尝试：<span id="attempts">0</span></div></div>
<div class="progress"><div class="progress-fill" id="progressFill"></div></div>
<div class="grid" id="gameGrid"></div>
</div>
<div id="winScreen" style="display:none" class="card">
<div class="win-screen"><div style="font-size:2rem;margin-bottom:8px">🎉 恭喜完成！</div><div class="big" id="winScore"></div><p style="color:var(--text2);margin:12px 0" id="winMsg"></p><button class="btn btn-green" onclick="resetGame()">再来一局</button><button class="btn" onclick="showMenu()">返回菜单</button></div>
</div>
</div>
<script src="../i18n.js" defer></script>
<script>
var gameMode='pinyin';var tiles=[];var selected=null;var matchedPairs=0;var totalPairs=0;var attempts=0;var timer=0;var timerInterval=null;var locked=false;
var pool=[
{c:'龙',p:'lóng',m:'传说中的神兽',r:'龙',st:'独体'},
{c:'凤',p:'fèng',m:'传说中的神鸟',r:'几',st:'半包围'},
{c:'虎',p:'hǔ',m:'猛兽之王',r:'虍',st:'半包围'},
{c:'福',p:'fú',m:'幸福福气',r:'礻',st:'左右'},
{c:'喜',p:'xǐ',m:'快乐高兴',r:'口',st:'上下'},
{c:'安',p:'ān',m:'平安安定',r:'宀',st:'上下'},
{c:'康',p:'kāng',m:'健康康复',r:'广',st:'半包围'},
{c:'富',p:'fù',m:'富裕丰富',r:'宀',st:'上下'},
{c:'贵',p:'guì',m:'珍贵高贵',r:'贝',st:'上下'},
{c:'祥',p:'xiáng',m:'吉祥祥瑞',r:'礻',st:'左右'},
{c:'和',p:'hé',m:'和平和谐',r:'口',st:'左右'},
{c:'明',p:'míng',m:'明亮明白',r:'日',st:'左右'},
{c:'山',p:'shān',m:'高山山脉',r:'山',st:'独体'},
{c:'水',p:'shuǐ',m:'流水水源',r:'水',st:'独体'},
{c:'火',p:'huǒ',m:'火焰火光',r:'火',st:'独体'},
{c:'木',p:'mù',m:'树木木材',r:'木',st:'独体'},
{c:'花',p:'huā',m:'花朵花卉',r:'艹',st:'上下'},
{c:'春',p:'chūn',m:'春天春季',r:'日',st:'上下'},
{c:'风',p:'fēng',m:'风力风向',r:'风',st:'半包围'},
{c:'雨',p:'yǔ',m:'雨水下雨',r:'雨',st:'独体'}
];
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function selectMode(m,el){gameMode=m;document.querySelectorAll('.mode-card').forEach(function(c){c.classList.remove('active')});el.classList.add('active');}
function startGame(){
matchedPairs=0;attempts=0;timer=0;selected=null;locked=false;
var picked=shuffle([].concat(pool)).slice(0,6);totalPairs=picked.length;
tiles=[];
picked.forEach(function(item,idx){
var leftText=item.c;var leftType='char';var rightText;
if(gameMode==='pinyin')rightText=item.p;
else if(gameMode==='meaning')rightText=item.m;
else if(gameMode==='radical')rightText='部首：'+item.r;
else rightText=item.st;
tiles.push({id:idx,text:leftText,type:'left',matched:false,pairId:idx});
tiles.push({id:idx+100,text:rightText,type:'right',matched:false,pairId:idx});});
shuffle(tiles);
document.getElementById('menu').style.display='none';document.getElementById('winScreen').style.display='none';
document.getElementById('game').style.display='block';
document.getElementById('totalPairs').textContent=totalPairs;
timerInterval=setInterval(function(){timer++;document.getElementById('timerDisplay').textContent='⏱ '+timer+'s';},1000);
renderTiles();}
function renderTiles(){
var html='';tiles.forEach(function(t,i){
var cls='tile';if(t.matched)cls+=' matched';if(selected===i)cls+=' selected';
var content=t.type==='left'?'<div class="char">'+t.text+'</div>':'<div class="text">'+t.text+'</div>';
html+='<div class="'+cls+'" onclick="clickTile('+i+')">'+content+'</div>';});
document.getElementById('gameGrid').innerHTML=html;
document.getElementById('matchedCount').textContent=matchedPairs;
document.getElementById('progressFill').style.width=(totalPairs?matchedPairs/totalPairs*100:0)+'%';}
function clickTile(i){
if(locked||tiles[i].matched)return;
if(selected===null){selected=i;renderTiles();return;}
if(selected===i){selected=null;renderTiles();return;}
locked=true;attempts++;document.getElementById('attempts').textContent=attempts;
var t1=tiles[selected],t2=tiles[i];
if(t1.pairId===t2.pairId&&t1.type!==t2.type){
t1.matched=true;t2.matched=true;matchedPairs++;
selected=null;locked=false;renderTiles();
if(matchedPairs===totalPairs)setTimeout(showWin,500);}
else{renderTiles();var els=document.querySelectorAll('.tile');
if(els[selected])els[selected].classList.add('wrong');els[i].classList.add('wrong');
setTimeout(function(){selected=null;locked=false;renderTiles();},600);}}
function showWin(){
clearInterval(timerInterval);document.getElementById('game').style.display='none';document.getElementById('winScreen').style.display='block';
document.getElementById('winScore').textContent=attempts+'次尝试 | '+timer+'秒';
var pct=Math.round(totalPairs/attempts*100);
document.getElementById('winMsg').textContent=pct>=80?'🏆 太厉害了！配对达人！':pct>=50?'👍 很不错！继续加油！':'💪 多练习就会更快的！';}
function resetGame(){startGame();}
function showMenu(){clearInterval(timerInterval);document.getElementById('menu').style.display='block';document.getElementById('game').style.display='none';document.getElementById('winScreen').style.display='none';}
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
