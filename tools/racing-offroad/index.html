<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>越野赛</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #3b82f6;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            color: #3b82f6;
        }
        .controls {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 18px;
        }
        canvas {
            border: 2px solid var(--border);
            border-radius: 8px;
            background: #1a1e24;
            max-width: 100%;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .message {
            margin-top: 15px;
            font-size: 16px;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <h1>🚙 越野赛</h1>
    <div class="controls">
        <div class="info">
            <span>距离: <span id="distance">0</span>m</span>
            <span>速度: <span id="speed">0</span>km/h</span>
            <span>生命: <span id="health">100</span>%</span>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div style="margin-top: 10px;">
            <button class="btn" onclick="startGame()">开始越野</button>
            <button class="btn" onclick="resetGame()">重新开始</button>
        </div>
        <div class="message">方向键/WASD控制，空格键跳跃，穿越崎岖地形！</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const distanceEl = document.getElementById('distance');
        const speedEl = document.getElementById('speed');
        const healthEl = document.getElementById('health');
        
        let gameRunning = false;
        let distance = 0;
        let health = 100;
        let lastTime = 0;
        let car = { x: 400, y: 500, angle: 0, speed: 0, width: 25, height: 35, onGround: true, jumpVelocity: 0 };
        let keys = {};
        let terrain = [];
        let obstacles = [];
        let trees = [];
        
        // 初始化地形
        function initTerrain() {
            terrain = [];
            for (let i = 0; i < 30; i++) {
                terrain.push({
                    x: i * 50,
                    y: 400 + Math.sin(i * 0.3) * 150 + Math.cos(i * 0.7) * 50,
                    width: 50,
                    height: 200,
                    type: ['flat', 'hill', 'valley', 'bump'][Math.floor(Math.random() * 4)]
                });
            }
            
            // 初始化障碍物
            obstacles = [];
            for (let i = 0; i < 15; i++) {
                obstacles.push({
                    x: 100 + i * 100,
                    y: 380 + Math.sin(i * 0.3) * 150 + Math.cos(i * 0.7) * 50,
                    width: 20 + Math.random() * 20,
                    height: 20 + Math.random() * 20,
                    type: Math.random() < 0.5 ? 'rock' : 'log'
                });
            }
            
            // 初始化树木
            trees = [];
            for (let i = 0; i < 20; i++) {
                trees.push({
                    x: Math.random() * 1500,
                    y: 350 + Math.sin(i * 0.3) * 150 + Math.cos(i * 0.7) * 50,
                    height: 40 + Math.random() * 30
                });
            }
        }
        
        function drawTerrain() {
            // 地面
            ctx.fillStyle = '#5d4e37';
            terrain.forEach(segment => {
                ctx.fillRect(segment.x, segment.y, segment.width, segment.height);
                
                // 地形纹理
                ctx.fillStyle = '#6b5b45';
                for (let i = 0; i < 3; i++) {
                    const x = segment.x + Math.random() * segment.width;
                    const y = segment.y + Math.random() * 30;
                    ctx.fillRect(x, y, 3, 3);
                }
                ctx.fillStyle = '#5d4e37';
            });
            
            // 山坡和沟壑
            ctx.fillStyle = '#4a3f2f';
            terrain.forEach(segment => {
                if (segment.type === 'hill') {
                    ctx.beginPath();
                    ctx.moveTo(segment.x, segment.y);
                    ctx.lineTo(segment.x + segment.width/2, segment.y - 40);
                    ctx.lineTo(segment.x + segment.width, segment.y);
                    ctx.fill();
                } else if (segment.type === 'valley') {
                    ctx.beginPath();
                    ctx.moveTo(segment.x, segment.y);
                    ctx.lineTo(segment.x + segment.width/2, segment.y + 30);
                    ctx.lineTo(segment.x + segment.width, segment.y);
                    ctx.fill();
                }
            });
        }
        
        function drawObstacles() {
            obstacles.forEach(obs => {
                if (obs.type === 'rock') {
                    ctx.fillStyle = '#666666';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.width/2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(obs.x - obs.width/2, obs.y - 5, obs.width, 10);
                }
            });
        }
        
        function drawTrees() {
            trees.forEach(tree => {
                // 树干
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(tree.x - 5, tree.y - tree.height, 10, tree.height);
                
                // 树冠
                ctx.fillStyle = '#228b22';
                ctx.beginPath();
                ctx.arc(tree.x, tree.y - tree.height - 15, 20, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // 越野车
            ctx.fillStyle = #3b82f6;
            ctx.fillRect(-car.width/2, -car.height/2, car.width, car.height);
            
            // 车窗
            ctx.fillStyle = '#1a1e24';
            ctx.fillRect(-car.width/2 + 3, -car.height/2 + 3, car.width - 6, car.height/3);
            
            // 大轮胎
            ctx.fillStyle = '#333333';
            ctx.fillRect(-car.width/2 - 5, -car.height/2 + 5, 5, 12);
            ctx.fillRect(car.width/2, -car.height/2 + 5, 5, 12);
            ctx.fillRect(-car.width/2 - 5, car.height/2 - 17, 5, 12);
            ctx.fillRect(car.width/2, car.height/2 - 17, 5, 12);
            
            ctx.restore();
        }
        
        function updateCar(deltaTime) {
            // 重力
            if (!car.onGround) {
                car.jumpVelocity += 0.5;
                car.y += car.jumpVelocity;
            }
            
            // 跳跃
            if (keys[' '] && car.onGround) {
                car.jumpVelocity = -10;
                car.onGround = false;
            }
            
            // 加速/减速
            if (keys['ArrowUp'] || keys['w']) {
                car.speed = Math.min(car.speed + 0.15, 10);
            } else if (keys['ArrowDown'] || keys['s']) {
                car.speed = Math.max(car.speed - 0.2, -3);
            } else {
                car.speed *= 0.98;
            }
            
            // 转向
            if (keys['ArrowLeft'] || keys['a']) {
                car.angle -= 0.05 * car.speed;
            }
            if (keys['ArrowRight'] || keys['d']) {
                car.angle += 0.05 * car.speed;
            }
            
            // 更新位置
            car.x += Math.sin(car.angle) * car.speed;
            car.y -= Math.cos(car.angle) * car.speed;
            
            // 地形碰撞检测
            car.onGround = false;
            terrain.forEach(segment => {
                if (car.x > segment.x && car.x < segment.x + segment.width) {
                    let groundY = segment.y;
                    
                    // 根据地形类型调整地面高度
                    if (segment.type === 'hill') {
                        groundY -= 20;
                    } else if (segment.type === 'valley') {
                        groundY += 15;
                    }
                    
                    if (car.y > groundY - 20) {
                        car.y = groundY - 20;
                        car.onGround = true;
                        car.jumpVelocity = 0;
                    }
                }
            });
            
            // 障碍物碰撞
            obstacles.forEach(obs => {
                const dx = car.x - obs.x;
                const dy = car.y - obs.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 30) {
                    car.speed *= 0.3;
                    health -= 5;
                    healthEl.textContent = Math.max(0, health);
                    
                    if (health <= 0) {
                        gameOver();
                    }
                }
            });
            
            // 更新距离
            distance += car.speed * 0.1;
            distanceEl.textContent = Math.round(distance);
            speedEl.textContent = Math.abs(Math.round(car.speed * 20));
            
            // 边界检查
            car.x = Math.max(20, Math.min(canvas.width - 20, car.x));
            car.y = Math.max(20, Math.min(canvas.height - 20, car.y));
            
            // 自动前进（滚动地形）
            if (car.x > canvas.width * 0.7) {
                const scrollAmount = car.x - canvas.width * 0.7;
                terrain.forEach(segment => segment.x -= scrollAmount);
                obstacles.forEach(obs => obs.x -= scrollAmount);
                trees.forEach(tree => tree.x -= scrollAmount);
                car.x = canvas.width * 0.7;
            }
        }
        
        function updateGame(timestamp) {
            if (!gameRunning) return;
            
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            
            updateCar(deltaTime);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTerrain();
            drawObstacles();
            drawTrees();
            drawCar();
            
            requestAnimationFrame(updateGame);
        }
        
        function gameOver() {
            gameRunning = false;
            alert('游戏结束！距离: ' + Math.round(distance) + 'm');
        }
        
        function startGame() {
            if (gameRunning) return;
            
            car = { x: 400, y: 500, angle: 0, speed: 0, width: 25, height: 35, onGround: true, jumpVelocity: 0 };
            distance = 0;
            health = 100;
            
            initTerrain();
            
            distanceEl.textContent = '0';
            speedEl.textContent = '0';
            healthEl.textContent = '100';
            
            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(updateGame);
        }
        
        function resetGame() {
            gameRunning = false;
            car = { x: 400, y: 500, angle: 0, speed: 0, width: 25, height: 35, onGround: true, jumpVelocity: 0 };
            distance = 0;
            health = 100;
            
            initTerrain();
            
            distanceEl.textContent = '0';
            speedEl.textContent = '0';
            healthEl.textContent = '100';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTerrain();
            drawCar();
        }
        
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // 初始绘制
        initTerrain();
        drawTerrain();
        drawCar();
    </script>
</body>
</html>
