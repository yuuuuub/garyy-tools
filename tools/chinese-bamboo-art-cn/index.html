<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国竹编 - 竹艺生辉 | Gary's Tools</title>

<meta property="og:image" content="https://garyy.top/og-image.png"><meta name="description" content="中国竹编艺术百科 - 竹编历史、编织技法、地方流派、代表作品全解"><meta name="robots" content="index,follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎋</text></svg>"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#d4a574;--accent2:#8b6914}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#8b5e3c;--accent2:#6b4226}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;transition:background var(--transition),color var(--transition)}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.category-btn{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all var(--transition)}.category-btn.active{background:var(--accent);color:#fff}.category-btn:hover{opacity:.85}.item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all var(--transition)}.item:hover{transform:translateY(-2px);border-color:var(--accent)}.item-title{font-size:1.05rem;font-weight:600;margin-bottom:4px}.item-era{color:var(--accent);font-size:.8rem;margin-bottom:6px}.item-desc{color:var(--text2);font-size:.9rem;line-height:1.5}.item-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.9rem;line-height:1.7;color:var(--text)}.item.open .item-detail{display:block}.tag{display:inline-block;padding:2px 8px;margin:4px 4px 0;background:var(--border);border-radius:12px;font-size:.75rem;color:var(--text2)}

<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎋 中国竹编</h1><p class="sub">竹编历史 · 编织技法 · 地方流派 · 代表作品</p>
<div class="card">
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索竹编知识..." oninput="filterList()"></div>
<div class="btn-group">
<button class="category-btn active" onclick="filterCat('all',this)">全部</button>
<button class="category-btn" onclick="filterCat('历史',this)">历史</button>
<button class="category-btn" onclick="filterCat('技法',this)">技法</button>
<button class="category-btn" onclick="filterCat('流派',this)">流派</button>
<button class="category-btn" onclick="filterCat('竹材',this)">竹材</button>
<button class="category-btn" onclick="filterCat('作品',this)">作品</button>
</div></div>
<div id="stats"></div>
<div id="list"></div></div>
<script src="../i18n.js" defer></script>
<script>
var data=[
{title:'竹编起源',era:'新石器时代',cat:'历史',tags:['河姆渡','竹器','最早'],desc:'竹编起源于新石器时代，河姆渡遗址出土了最早的竹编实物。',detail:'竹编起源于新石器时代。河姆渡遗址出土了竹编残片，距今约7000年。殷商时期竹编已相当成熟，甲骨文中已有"竹"字部首的大量文字。竹编是中国最古老的手工艺之一，与人们的日常生活密切相关。',ref:'《中国竹编》'},
{title:'唐宋发展',era:'唐宋',cat:'历史',tags:['唐代','宋代','竹丝扣瓷'],desc:'唐代竹编技艺精进，宋代出现了竹丝扣瓷等高级工艺。',detail:'唐代竹编技艺进一步精进，出现了各种精美的竹编器具。宋代竹编工艺达到新高度，出现了"竹丝扣瓷"——用极细的竹丝编织包裹瓷器的高级工艺。竹丝扣瓷要求竹丝细如发丝，编织紧密无隙，是竹编工艺的极致。',ref:'《杭州府志》'},
{title:'明清成熟',era:'明清',cat:'历史',tags:['鼎盛','生活用具','工艺品'],desc:'明清是竹编的成熟期，形成了众多地方流派。',detail:'明清时期竹编技艺达到成熟。各地形成了鲜明的地方特色：四川竹编以瓷胎竹盖闻名，浙江竹编以精致细腻著称，福建竹编以实用耐久见长。竹编产品从日用器具到艺术品，种类繁多。',ref:'《中国竹编艺术》'},
{title:'平面编织',era:'历代',cat:'技法',tags:['基础','经纬','基本'],desc:'最基本的竹编技法，竹篾按经纬方向交叉编织。',detail:'平面编织是最基本的竹编技法。将竹篾按经线和纬线方向交叉编织，形成平面的竹编作品。常见的平面编织有十字编、人字编、六角编等。平面编织是竹编的基础，几乎所有复杂的竹编技法都是在平面编织基础上发展而来的。',ref:'《竹编技法》'},
{title:'立体编织',era:'历代',cat:'技法',tags:['三维','成型','器物'],desc:'将竹篾编织成立体形状，用于制作各种容器和器物。',detail:'立体编织是在平面编织基础上发展而来的高级技法。通过收口、放口等技巧，将竹篾编织成立体的形状，用于制作篮、筐、盘、罐等各种器物。立体编织要求编织者具备良好的空间想象力和手感控制能力。',ref:'《竹编工艺》'},
{title:'竹丝编',era:'宋代至今',cat:'技法',tags:['极细','竹丝','精密'],desc:'将竹子劈成极细的竹丝进行编织，是最精细的竹编技法。',detail:'竹丝编是将竹子劈成极细的竹丝（直径约0.5毫米）进行编织的高级技法。竹丝编作品精细如绸缎、轻薄如蝉翼，是竹编工艺的极致。四川瓷胎竹盖和浙江竹丝扣瓷都是竹丝编的代表作品。',ref:'《竹丝编工艺》'},
{title:'四川竹编',era:'清代至今',cat:'流派',tags:['成都','瓷胎竹盖','精细'],desc:'四川成都的传统竹编，以瓷胎竹盖和竹丝编著称。',detail:'四川竹编以成都为中心，以瓷胎竹盖和竹丝编最为著名。瓷胎竹盖是以瓷器为胎体，用极细的竹丝编织包裹而成。四川竹编工艺精湛、造型优美，是国家级非物质文化遗产。成都竹编以"薄如纸、细如丝、编如锦"著称。',ref:'《成都竹编》'},
{title:'浙江竹编',era:'清代至今',cat:'流派',tags:['嵊州','竹编动物','生动'],desc:'浙江嵊州的传统竹编，以竹编动物和人物造型生动著称。',detail:'浙江竹编以嵊州最为著名。嵊州竹编以编织动物和人物造型著称，作品造型生动、神态逼真。嵊州竹编艺人能够用竹篾编织出各种动物形象，如龙、凤、熊猫等，栩栩如生。嵊州竹编是国家级非物质文化遗产。',ref:'《嵊州竹编》'},
{title:'福建竹编',era:'清代至今',cat:'流派',tags:['安溪','实用','耐久'],desc:'福建安溪的传统竹编，以实用耐久的竹编家具和日用品著称。',detail:'福建竹编以安溪最为著名。安溪竹编以实用耐久著称，产品包括竹编家具、竹编日用品等。安溪竹编竹篾处理精细、编织紧密结实，使用寿命长。安溪竹编是福建传统工艺的重要组成部分。',ref:'《安溪竹编》'},
{title:'毛竹',era:'历代',cat:'竹材',tags:['最常用','粗壮','耐用'],desc:'竹编最常用的竹材，质地坚韧、弹性好，适合各种竹编产品。',detail:'毛竹（楠竹）是中国竹编最常用的竹材。毛竹竹壁厚实、质地坚韧、弹性好，适合编织各种日用品和工艺品。毛竹分布广泛，产量大，是中国竹编产业的主要原料。毛竹竹编产品耐用结实，经久耐用。',ref:'《竹材学》'},
{title:'慈竹',era:'历代',cat:'竹材',tags:['四川','柔软','精细'],desc:'四川特产的竹材，质地柔软细腻，适合精细竹编。',detail:'慈竹是四川特产的竹材，竹壁薄而柔软，纤维细密，适合劈成极细的竹丝进行编织。慈竹是制作瓷胎竹盖和竹丝编的理想材料。四川竹编之所以精美绝伦，与慈竹优良的材质特性密不可分。',ref:'《四川竹类志》'},
{title:'竹丝扣瓷',era:'宋代至今',cat:'作品',tags:['竹丝','瓷器','结合'],desc:'以极细的竹丝编织包裹瓷器，是竹编工艺的极致。',detail:'竹丝扣瓷是将极细的竹丝编织包裹在瓷器表面的高级工艺。竹丝细如发丝，编织紧密无隙，与瓷器浑然一体。竹丝扣瓷要求竹丝直径不超过0.5毫米，每平方厘米编织上百根竹丝。这一工艺在宋代已经出现，至今仍是竹编工艺的最高境界。',ref:'《竹丝扣瓷》'},
{title:'竹编龙',era:'当代',cat:'作品',tags:['龙','大型','精品'],desc:'以竹编技艺编织的大型龙造型，是当代竹编的精品之作。',detail:'竹编龙是当代竹编艺人创作的大型竹编作品。竹编龙造型生动、气势恢宏，鳞片、龙须等细节栩栩如生。制作一条大型竹编龙需要数月甚至数年时间，是竹编技艺的集中展示。嵊州竹编龙曾在国际博览会上获得金奖。',ref:'《嵊州竹编》'},
{title:'竹与文人',era:'先秦至今',cat:'历史',tags:['竹文化','文人','精神'],desc:'竹子象征高洁品格，与梅兰菊并称"四君子"，深受文人喜爱。',detail:'竹子在中国文化中象征高洁、虚心、有节的品格。苏轼"宁可食无肉，不可居无竹"道出了文人对竹子的喜爱。竹子与梅、兰、菊并称"四君子"，是中国文人精神的重要象征。竹编艺术也因此被赋予了深厚的文化内涵。',ref:'《竹谱》'},
{title:'竹编与生活',era:'历代',cat:'历史',tags:['日用品','竹篮','竹席'],desc:'竹编产品广泛应用于日常生活，是传统社会不可或缺的生活用品。',detail:'竹编产品在传统社会中无处不在：竹篮、竹筐、竹席、竹扇、竹帘、竹筷等。竹编器具轻便耐用、透气防潮，是理想的生活用品。虽然现代塑料制品替代了许多竹编产品，但竹编器具因其环保和文化价值而重新受到重视。',ref:'《中国民俗》'}
];
var currentCat='all';
function renderList(items){
  var el=document.getElementById('list');
  var s=document.getElementById('stats');
  s.textContent='共 '+items.length+' 条知识';
  el.innerHTML=items.map(function(d,i){
    return '<div class="item" onclick="this.classList.toggle(\'open\')">'+
    '<div class="item-title">'+d.title+'</div>'+
    '<div class="item-era">年代：'+d.era+'</div>'+
    '<div class="item-desc">'+d.desc+'</div>'+
    '<div class="item-detail"><h4>详细介绍</h4><p>'+d.detail+'</p>'+
    '<p style="margin-top:8px;color:var(--accent2)">参考：'+d.ref+'</p>'+
    '<div>'+d.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div></div>';
  }).join('');
}
function filterList(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=data.filter(function(d){
    var matchQ=d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q)||d.era.toLowerCase().includes(q);
    var matchC=currentCat==='all'||d.cat===currentCat;
    return matchQ&&matchC;
  });
  renderList(filtered);
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterList();
}
renderList(data);
</script></body></html>
