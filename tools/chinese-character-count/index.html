<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字统计</title><meta name="description" content="汉字统计 - 在线统计汉字"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:150px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}.stat-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}.stat-value{font-size:1.5rem;font-weight:700;color:var(--blue)}.stat-label{font-size:.8rem;color:var(--text2);margin-top:4px}.char-list{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.char-tag{padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:.85rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字统计"><meta property="og:description" content="汉字统计 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📊 汉字统计</h1><p class="sub">在线统计汉字</p>
<div class="card">
<div class="label">输入文本</div>
<textarea id="textInput" placeholder="输入要统计的文本...">床前明月光，疑是地上霜。举头望明月，低头思故乡。</textarea>
<button class="btn" onclick="countCharacters()">统计</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function countCharacters(){
  var text=document.getElementById('textInput').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var chineseChars=text.match(/[\u4e00-\u9fa5]/g)||[];
  var totalChars=text.length;
  var chineseCount=chineseChars.length;
  var letterCount=(text.match(/[a-zA-Z]/g)||[]).length;
  var digitCount=(text.match(/[0-9]/g)||[]).length;
  var punctuationCount=(text.match(/[^\w\s\u4e00-\u9fa5]/g)||[]).length;
  var spaceCount=(text.match(/\s/g)||[]).length;
  var uniqueChars=[...new Set(chineseChars)];
  var charFrequency={};
  chineseChars.forEach(function(char){
    charFrequency[char]=(charFrequency[char]||0)+1;
  });
  var sortedFrequency=Object.entries(charFrequency).sort(function(a,b){return b[1]-a[1];});
  var html='<div class="card">';
  html+='<div class="section"><h3>📊 统计结果</h3>';
  html+='<div class="stats-grid">';
  html+='<div class="stat-item"><div class="stat-value">'+totalChars+'</div><div class="stat-label">总字符数</div></div>';
  html+='<div class="stat-item"><div class="stat-value">'+chineseCount+'</div><div class="stat-label">汉字数</div></div>';
  html+='<div class="stat-item"><div class="stat-value">'+uniqueChars.length+'</div><div class="stat-label">不同汉字</div></div>';
  html+='<div class="stat-item"><div class="stat-value">'+letterCount+'</div><div class="stat-label">字母数</div></div>';
  html+='<div class="stat-item"><div class="stat-value">'+digitCount+'</div><div class="stat-label">数字数</div></div>';
  html+='<div class="stat-item"><div class="stat-value">'+punctuationCount+'</div><div class="stat-label">标点数</div></div>';
  html+='</div></div>';
  html+='<div class="section"><h3>🔤 汉字频率</h3>';
  html+='<div class="char-list">';
  sortedFrequency.forEach(function(item){
    html+='<div class="char-tag">'+item[0]+' ('+item[1]+')</div>';
  });
  html+='</div></div>';
  html+='<div class="section"><h3>📋 详细信息</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>汉字列表：</strong>'+uniqueChars.join('、')+'</div>';
  html+='<div><strong>出现最多的字：</strong>'+sortedFrequency[0][0]+' ('+sortedFrequency[0][1]+'次)</div>';
  html+='<div><strong>汉字占比：</strong>'+Math.round(chineseCount/totalChars*100)+'%</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
countCharacters();
</script></body></html>
