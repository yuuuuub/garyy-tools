<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丢包测试</title>
<meta name="description" content="网络丢包测试工具，检测网络连接丢包率">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#238636;--red:#da3633;--yellow:#9e6a03;--dim:#8b949e}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:20px}
.container{max-width:700px;margin:0 auto;text-align:center}
h1{font-size:1.8rem;margin-bottom:8px}
.subtitle{color:var(--dim);margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;margin-bottom:16px}
.loss-display{font-size:4rem;font-weight:700;margin:12px 0}
.loss-label{font-size:1rem;color:var(--dim);margin-bottom:16px}
.reliability{font-size:1.2rem;font-weight:600;margin-bottom:16px}
button{background:var(--accent);color:var(--text);border:none;border-radius:6px;padding:12px 32px;font-size:15px;cursor:pointer;font-weight:600;transition:opacity .2s}
button:hover{opacity:.85}
button:disabled{opacity:.5;cursor:not-allowed}
.progress{width:100%;height:6px;background:var(--border);border-radius:3px;margin:16px 0;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;width:0%;transition:width .3s}
.target-select{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.target-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer;transition:all .2s}
.target-btn:hover{border-color:var(--accent)}
.target-btn.active{background:var(--accent);border-color:var(--accent);color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;text-align:left}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px 8px}
.stat-label{font-size:11px;color:var(--dim);text-transform:uppercase}
.stat-value{font-size:1.3rem;font-weight:700;margin-top:4px}
.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}
.packets{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:16px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px}
.packet{width:20px;height:20px;border-radius:3px;transition:all .2s}
.packet-success{background:var(--green)}
.packet-fail{background:var(--red)}
.packet-pending{background:var(--border)}
.chart{width:100%;height:120px;background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.chart canvas{width:100%;height:100%}
.timeline{margin-top:16px;text-align:left}
.timeline-item{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12px;font-family:monospace}
.timeline-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status{color:var(--dim);font-size:13px;margin-top:8px}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.loss-display{font-size:3rem}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="丢包测试">
  <meta property="og:description" content="网络丢包测试工具，检测网络连接丢包率">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/packet-loss-tester/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>📦 丢包测试</h1>
<p class="subtitle">通过多次请求测试网络可靠性</p>

<div class="card">
<div class="target-select">
<button class="target-btn active" onclick="setTarget(this,'https://api.ip.sb/ip')">IP.SB</button>
<button class="target-btn" onclick="setTarget(this,'https://ipwho.is/')">IPWho.is</button>
<button class="target-btn" onclick="setTarget(this,'https://api.github.com')">GitHub API</button>
</div>
<div style="margin-bottom:12px">
<label style="color:var(--dim);font-size:13px">请求次数: </label>
<select id="countSelect" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:13px">
<option value="20">20次</option>
<option value="50" selected>50次</option>
<option value="100">100次</option>
</select>
</div>
<div class="loss-display" id="lossDisplay">--</div>
<div class="loss-label">丢包率</div>
<div class="reliability" id="reliability"></div>
<button id="startBtn" onclick="startTest()">开始测试</button>
<div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="status" id="status"></div>
</div>

<div class="packets" id="packets"></div>

<div class="stats" id="stats" style="display:none">
<div class="stat"><div class="stat-label">总请求</div><div class="stat-value" id="totalReqs">-</div></div>
<div class="stat"><div class="stat-label">成功</div><div class="stat-value good" id="successReqs">-</div></div>
<div class="stat"><div class="stat-label">失败</div><div class="stat-value bad" id="failReqs">-</div></div>
<div class="stat"><div class="stat-label">平均延迟</div><div class="stat-value" id="avgLatency">-</div></div>
</div>

<div class="card" id="chartCard" style="display:none">
<h2 style="margin-bottom:8px;font-size:14px">延迟分布</h2>
<div class="chart"><canvas id="chart"></canvas></div>
</div>

<div class="card" id="timelineCard" style="display:none">
<h2 style="margin-bottom:8px;font-size:14px">请求时间线</h2>
<div class="timeline" id="timeline"></div>
</div>
</div>

<script>
let targetUrl='https://api.ip.sb/ip';
let testing=false;
function setTarget(btn,url){
document.querySelectorAll('.target-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
targetUrl=url;
}
async function startTest(){
if(testing)return;
testing=true;
const btn=document.getElementById('startBtn');
btn.disabled=true;
btn.textContent='测试中...';
document.getElementById('progress').style.display='block';
document.getElementById('stats').style.display='grid';
document.getElementById('chartCard').style.display='block';
document.getElementById('timelineCard').style.display='block';
const totalPackets=parseInt(document.getElementById('countSelect').value);
const packetsEl=document.getElementById('packets');
packetsEl.innerHTML='';
for(let i=0;i<totalPackets;i++){
packetsEl.innerHTML+=`<div class="packet packet-pending" id="pkt${i}"></div>`;
}
const results=[];
let successCount=0;
let failCount=0;
let totalLatency=0;
for(let i=0;i<totalPackets;i++){
document.getElementById('progressBar').width=((i+1)/totalPackets*100)+'%';
document.getElementById('status').textContent=`请求 ${i+1}/${totalPackets}...`;
const pkt=document.getElementById('pkt'+i);
try{
const start=performance.now();
const resp=await fetch(targetUrl+'?_='+Date.now()+'&i='+i,{cache:'no-store',signal:AbortSignal.timeout(5000)});
const latency=performance.now()-start;
if(resp.ok){
successCount++;
pkt.className='packet packet-success';
results.push({success:true,latency:Math.round(latency),index:i});
totalLatency+=latency;
}else{
failCount++;
pkt.className='packet packet-fail';
results.push({success:false,latency:Math.round(latency),index:i});
}
}catch(e){
failCount++;
pkt.className='packet packet-fail';
results.push({success:false,latency:0,index:i,error:e.message});
}
await new Promise(r=>setTimeout(r,100));
}
const lossRate=failCount/totalPackets*100;
const avgLat=successCount>0?(totalLatency/successCount):0;
let lossColor='good';
if(lossRate>5)lossColor='warn';
if(lossRate>15)lossColor='bad';
document.getElementById('lossDisplay').textContent=lossRate.toFixed(1)+'%';
document.getElementById('lossDisplay').className='loss-display '+lossColor;
let reliabilityText='';
let relColor='';
if(lossRate===0){reliabilityText='🏅 完美 - 网络极其可靠';relColor='good';}
else if(lossRate<1){reliabilityText='✅ 优秀 - 网络非常可靠';relColor='good';}
else if(lossRate<5){reliabilityText='✅ 良好 - 网络基本可靠';relColor='good';}
else if(lossRate<15){reliabilityText='⚠️ 一般 - 存在明显丢包';relColor='warn';}
else{reliabilityText='❌ 较差 - 网络不稳定';relColor='bad';}
document.getElementById('reliability').textContent=reliabilityText;
document.getElementById('reliability').className='reliability '+relColor;
document.getElementById('totalReqs').textContent=totalPackets;
document.getElementById('successReqs').textContent=successCount;
document.getElementById('failReqs').textContent=failCount;
document.getElementById('avgLatency').textContent=avgLat.toFixed(0)+' ms';
document.getElementById('avgLatency').className='stat-value '+(avgLat<100?'good':avgLat<300?'warn':'bad');
drawChart(results);
let timelineHtml='';
results.forEach(r=>{
const dotColor=r.success?'var(--green)':'var(--red)';
const text=r.success?`#${r.index+1} 成功 (${r.latency}ms)`:`#${r.index+1} 失败${r.error?' ('+r.error+')':''}`;
timelineHtml+=`<div class="timeline-item"><div class="timeline-dot" style="background:${dotColor}"></div><span>${text}</span></div>`;
});
document.getElementById('timeline').innerHTML=timelineHtml;
document.getElementById('progressBar').width='100%';
document.getElementById('status').textContent='测试完成！';
btn.disabled=false;
btn.textContent='重新测试';
testing=false;
}
function drawChart(results){
const canvas=document.getElementById('chart');
const ctx=canvas.getContext('2d');
const rect=canvas.parentElement.getBoundingClientRect();
canvas.width=rect.width*2;
canvas.height=rect.height*2;
ctx.scale(2,2);
const w=rect.width;
const h=rect.height;
const pad=30;
const valid=results.filter(r=>r.success);
if(valid.length===0)return;
const maxLat=Math.max(...valid.map(r=>r.latency))*1.2||100;
const barW=Math.max((w-pad*2)/results.length-1,2);
ctx.clearRect(0,0,w,h);
ctx.strokeStyle='#30363d';ctx.lineWidth=0.5;
for(let i=0;i<=3;i++){
const y=pad+((h-pad*2)/3)*i;
ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();
ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';ctx.textAlign='right';
ctx.fillText(Math.round(maxLat-(maxLat/3)*i)+'ms',pad-4,y+4);
}
results.forEach((r,i)=>{
const x=pad+i*(w-pad*2)/results.length;
const barH=r.success?(r.latency/maxLat)*(h-pad*2):h-pad*2;
const y=h-pad-barH;
ctx.fillStyle=r.success?'rgba(34,197,94,0.6)':'rgba(218,54,51,0.6)';
ctx.fillRect(x,y,barW,barH);
});
}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
