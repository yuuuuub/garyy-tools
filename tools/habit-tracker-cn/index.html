<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 习惯打卡</title>
<meta name="description" content="每日习惯打卡追踪器，养成好习惯，坚持每一天">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:20pxpadding:16px;}
.ctn{max-width:600px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.li{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:none}
.li.done{opacity:.6}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text)}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}
.es{text-align:center;padding:40px;color:var(--text2)}
.streak{font-size:1.5rem;font-weight:700;color:var(--warn)}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.day-cell{aspect-ratio:1;border-radius:4px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--text2)}
.day-cell.checked{background:var(--success);color:var(--text)}
.day-cell.today{border:2px solid var(--accent)}
.empty{color:var(--text2);text-align:center;padding:20px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📋 习惯打卡">
<meta property="og:description" content="每日习惯打卡追踪器，养成好习惯，坚持每一天">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📋 习惯打卡</h1><p>每天坚持，养成好习惯</p></div>

<div class="cd"><h2>添加习惯</h2>
<div class="fr">
<div><label>习惯名称</label><input type="text" id="hN" placeholder="如：早起、运动、阅读"></div>
<div><label>类别</label><select id="hC"><option>健康</option><option>学习</option><option>工作</option><option>生活</option><option>其他</option></select></div>
</div>
<div class="bg"><button onclick="addHabit()">添加习惯</button></div></div>

<div class="cd"><h2>今日打卡</h2><div id="todayDate" style="font-size:.85rem;color:var(--text2);margin-bottom:12px"></div><div id="todayList" class="empty">暂无习惯</div></div>

<div class="cd"><h2>习惯概览</h2><div id="overview" class="empty">暂无数据</div></div>

<div class="cd"><h2>习惯详情</h2><div id="detailList" class="empty">点击习惯查看详情</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let habits = JSON.parse(localStorage.getItem('ht_habits') || '[]');
const today = () => new Date().toISOString().slice(0, 10);

function save() { localStorage.setItem('ht_habits', JSON.stringify(habits)); }

function addHabit() {
  const name = $('hN').value.trim();
  if (!name) { alert('请输入习惯名称'); return; }
  habits.push({ id: Date.now(), name, category: $('hC').value, created: today(), checkins: {} });
  save(); render(); $('hN').value = '';
}

function toggleCheckin(id) {
  const h = habits.find(x => x.id === id);
  if (!h) return;
  const d = today();
  h.checkins[d] = !h.checkins[d];
  if (!h.checkins[d]) delete h.checkins[d];
  save(); render();
}

function deleteHabit(id) {
  if (!confirm('确定删除此习惯？')) return;
  habits = habits.filter(x => x.id !== id);
  save(); render();
}

function getStreak(h) {
  let streak = 0, d = new Date();
  while (true) {
    const ds = d.toISOString().slice(0, 10);
    if (h.checkins[ds]) { streak++; d.setDate(d.getDate() - 1); } else break;
  }
  return streak;
}

function render() {
  const d = today();
  $('todayDate').textContent = `📅 ${d}`;

  const todayCheckins = habits.map(h => {
    const checked = h.checkins[d];
    return `<div class="li ${checked ? 'done' : ''}">
      <div><strong>${h.name}</strong><br><span style="font-size:.8rem;color:var(--text2)">${h.category} · 连续${getStreak(h)}天</span></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button style="padding:6px 14px;${checked ? 'background:var(--success)' : ''}" onclick="toggleCheckin(${h.id})">${checked ? '✓ 已打卡' : '打卡'}</button>
        <button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="deleteHabit(${h.id})">删</button>
      </div>
    </div>`;
  });
  $('todayList').innerHTML = todayCheckins.length ? todayCheckins.join('') : '<div class="empty">暂无习惯，请先添加</div>';

  const total = habits.length;
  const doneToday = habits.filter(h => h.checkins[d]).length;
  const totalDays = habits.reduce((s, h) => s + Object.keys(h.checkins).length, 0);
  const bestStreak = habits.reduce((s, h) => Math.max(s, getStreak(h)), 0);
  $('overview').innerHTML = `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center">
    <div style="padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${total}</div><div style="font-size:.75rem;color:var(--text2)">总习惯</div></div>
    <div style="padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:1.5rem;font-weight:700;color:var(--success)">${doneToday}</div><div style="font-size:.75rem;color:var(--text2)">今日完成</div></div>
    <div style="padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:1.5rem;font-weight:700;color:var(--warn)">${bestStreak}</div><div style="font-size:.75rem;color:var(--text2)">最佳连续</div></div>
    <div style="padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${totalDays}</div><div style="font-size:.75rem;color:var(--text2)">总打卡天</div></div>
  </div>`;

  const detailHtml = habits.map(h => {
    const streak = getStreak(h);
    const days = Object.keys(h.checkins).length;
    const rate = days > 0 ? Math.round(days / Math.max(1, (Date.now() - new Date(h.created).getTime()) / 86400000) * 100) : 0;
    const last7 = [];
    const nd = new Date();
    for (let i = 6; i >= 0; i--) {
      const dd = new Date(nd); dd.setDate(dd.getDate() - i);
      const ds = dd.toISOString().slice(0, 10);
      last7.push({ date: ds.slice(5), checked: !!h.checkins[ds] });
    }
    return `<div style="padding:12px;border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center"><strong>${h.name}</strong><span class="tag ${streak >= 7 ? 's' : ''}">${streak}天连续</span></div>
      <div style="font-size:.8rem;color:var(--text2);margin-top:4px">类别: ${h.category} · 创建: ${h.created} · 总打卡: ${days}天 · 完成率: ${rate}%</div>
      <div class="day-grid" style="margin-top:8px">${last7.map(d => `<div class="day-cell ${d.checked ? 'checked' : ''}">${d.date}</div>`).join('')}</div>
    </div>`;
  });
  $('detailList').innerHTML = detailHtml.length ? detailHtml.join('') : '<div class="empty">暂无数据</div>';
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
