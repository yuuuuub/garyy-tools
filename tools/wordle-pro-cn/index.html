<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>专业中文Wordle</title><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#8b5cf6;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8em;margin-bottom:8px;text-align:center}
.subtitle{color:#8b949e;margin-bottom:20px;text-align:center;font-size:.9em}
.game-area{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:100%;margin-bottom:16px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:1em;transition:all .2s}
.btn:hover{opacity:.9;transform:scale(1.02)}
.btn:active{transform:scale(.98)}
.btn-sm{padding:6px 14px;font-size:.85em}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-yellow{background:var(--yellow);color:#000}.btn-orange{background:var(--orange)}
.flex{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;gap:4px}
.info{text-align:center;color:#8b949e;margin:12px 0;font-size:.95em}
.result{text-align:center;font-size:1.2em;margin:16px 0;padding:16px;border-radius:8px;background:var(--bg);min-height:40px}
.token{display:inline-block;padding:4px 10px;margin:3px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.token:hover{border-color:var(--accent)}
.token.active{background:var(--accent);border-color:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media(max-width:480px){body{padding:12px}.game-area{padding:16px}h1{font-size:1.4em}}
</style></head><body>
<h1>专业中文Wordle</h1><p class="subtitle">猜中文词</p>
<div class="game-area"><div id="wb" class="grid" style="grid-template-columns:repeat(5,44px);gap:4px;margin:0 auto;width:fit-content"></div>
<div id="kb" style="margin-top:16px"></div>
<div class="result" id="result"></div>
<script>
const words=["苹果","大海","天空","星星","月亮","太阳","彩虹","森林","草原","山川","河流","湖泊","白云","清风","春天","夏天","秋天","冬天","快乐","幸福","梦想","希望","勇气","智慧","爱情","友情","家庭","工作","学习","旅行"];
let target,guesses=[],current="",maxG=6;
function newW(){target=words[Math.floor(Math.random()*words.length)];guesses=[];current="";renderBoard();renderKB();}
function renderBoard(){const b=document.getElementById('wb');b.innerHTML='';
for(let i=0;i<maxG;i++){const row=guesses[i]||"";for(let j=0;j<5;j++){const d=document.createElement('div');
d.style.cssText='width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:2px solid var(--border);border-radius:6px;font-size:1.2em;font-weight:bold;transition:all .3s';
if(row&&j<row.length){d.textContent=row[j];if(row[j]===target[j])d.style.background='#10b981';else if(target.includes(row[j]))d.style.background='#f59e0b';else d.style.background='#374151';}
else if(i===guesses.length&&j<current.length){d.textContent=current[j];d.style.borderColor='var(--accent)';}
b.appendChild(d);}}}}}
function renderKB(){const keys='QWERTYUIOPASDFGHJKLZXCVBNM'.split('');
document.getElementById('kb').innerHTML=keys.map(k=>'<span onclick="addK(\''+k+'\')" class="token" style="cursor:pointer;min-width:30px;text-align:center">'+k+'</span>').join('')+
'<div style="width:100%"></div><button class="btn btn-sm" onclick="submitG()">确认</button><button class="btn btn-sm btn-red" onclick="delK()">删除</button>';}
function addK(k){if(current.length<5)current+=k;renderBoard();}
function delK(){current=current.slice(0,-1);renderBoard();}
function submitG(){if(current.length<5)return;guesses.push(current);current='';
if(guesses[guesses.length-1]===target)document.getElementById('result').innerHTML='🎉 猜对了! 答案: '+target;
else if(guesses.length>=maxG)document.getElementById('result').innerHTML='游戏结束! 答案: '+target;renderBoard();}
document.addEventListener('keydown',e=>{if(e.key==='Enter')submitG();else if(e.key==='Backspace')delK();
else if(e.key.length===1&&e.key>='\u4e00'&&e.key<='\u9fa5'&&current.length<5){current+=e.key;renderBoard();}});
newW();</script>
</div></body></html>
