<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时差计算器</title>
<meta property="og:title" content="时差计算器">
<meta property="og:description" content="时差计算器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="计算目的地时差，提供时差调整建议，帮助缓解 jet lag">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#3fb950;--yellow:#d29922;--red:#f85149}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;padding:16px}
.header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.header h1{font-size:20px;white-space:nowrap}
.header h1 span{font-size:24px}
.main{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h2{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:600}
.field select,.field input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px 20px;cursor:pointer;font-size:14px;font-weight:600;width:100%;margin-top:8px}
.btn:hover{opacity:.85}
.time-display{text-align:center;padding:20px}
.time-big{font-size:48px;font-weight:700;color:var(--accent);font-family:monospace}
.time-zone{font-size:14px;color:var(--text2);margin-top:4px}
.time-now-row{display:flex;gap:16px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.time-box{background:var(--bg);border-radius:8px;padding:12px 20px;text-align:center;min-width:120px}
.time-box .tz{font-size:12px;color:var(--text2)}
.time-box .tm{font-size:20px;font-weight:700;font-family:monospace}
.diff-result{text-align:center;padding:20px;background:var(--bg);border-radius:var(--radius);margin-top:12px}
.diff-result .big{font-size:28px;font-weight:700;color:var(--accent)}
.diff-result .label{font-size:13px;color:var(--text2);margin-top:4px}
.timeline{position:relative;margin-top:12px}
.timeline-title{font-size:13px;color:var(--text2);margin-bottom:8px}
.hour-bar{display:flex;height:40px;border-radius:6px;overflow:hidden}
.hour-bar .h{flex:1;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.8);transition:all .2s;cursor:default;position:relative}
.hour-bar .h:hover{opacity:.8}
.hour-bar .h.day{background:var(--yellow)}
.hour-bar .h.night{background:#1e3a5f}
.hour-bar .h.sleep{background:var(--red)}
.hour-bar .h.awake{background:var(--green)}
.hour-labels{display:flex;font-size:10px;color:var(--text2);margin-top:2px}
.hour-labels span{flex:1;text-align:center}
.tips{margin-top:16px}
.tip-item{display:flex;gap:10px;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:8px;font-size:13px;line-height:1.6}
.tip-item .tip-icon{font-size:20px;flex-shrink:0}
.adjust-schedule{margin-top:16px}
.schedule-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.schedule-row .day-label{font-weight:600;min-width:60px;color:var(--accent)}
.schedule-row .sleep-time{flex:1}
.schedule-row .badge{padding:2px 8px;border-radius:10px;font-size:11px}
.badge.easy{background:rgba(63,185,80,.15);color:var(--green)}
.badge.hard{background:rgba(248,81,73,.15);color:var(--red)}
.badge.medium{background:rgba(210,153,34,.15);color:var(--yellow)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="header">
<h1><span>⏰</span> 时差计算器</h1>
</div>
<div class="main">
<div>
<div class="card">
<h2>🌍 航班信息</h2>
<div class="field">
<label>出发城市</label>
<select id="fromCity"></select>
</div>
<div class="field">
<label>到达城市</label>
<select id="toCity"></select>
</div>
<div class="field">
<label>出发时间</label>
<input type="datetime-local" id="depTime">
</div>
<div class="field">
<label>飞行时长 (小时)</label>
<input type="number" id="flightHours" value="12" min="0" max="24" step="0.5">
</div>
<button class="btn" onclick="calculate()">⏰ 计算时差</button>
</div>
<div class="card" style="margin-top:16px">
<h2>📊 当地时间</h2>
<div class="time-now-row" id="timeNowRow">
<div class="time-box"><div class="tz">北京时间</div><div class="tm" id="homeTime">--:--</div></div>
<div class="time-box"><div class="tz" id="destTzLabel">目的地时间</div><div class="tm" id="destTime">--:--</div></div>
</div>
</div>
<div class="card" style="margin-top:16px">
<h2>🎯 调整建议</h2>
<div class="diff-result" id="diffResult">
<div class="big">请先选择城市并计算</div>
</div>
<div class="tips" id="tips"></div>
</div>
</div>
<div>
<div class="card">
<h2>📅 逐步调整计划</h2>
<div class="adjust-schedule" id="adjustSchedule">
<div style="color:var(--text2);font-size:13px;text-align:center;padding:20px">计算时差后显示调整计划</div>
</div>
</div>
<div class="card" style="margin-top:16px">
<h2>🌙 睡眠时间线</h2>
<div class="timeline-title">目标时区24小时分布</div>
<div class="hour-bar" id="hourBar"></div>
<div class="hour-labels"><span>0:00</span><span>6:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
<div style="margin-top:12px;display:flex;gap:12px;font-size:11px;color:var(--text2);flex-wrap:wrap">
<span>🟨 白天</span><span>🟦 夜晚</span><span>🟥 建议睡眠</span><span>🟩 建议清醒</span>
</div>
<div class="tips" id="sleepTips" style="margin-top:12px"></div>
</div>
</div>
</div>
<script>
const timezones=[
{name:'北京/上海/香港',tz:'Asia/Shanghai',offset:8},
{name:'东京',tz:'Asia/Tokyo',offset:9},
{name:'首尔',tz:'Asia/Seoul',offset:9},
{name:'新加坡',tz:'Asia/Singapore',offset:8},
{name:'曼谷',tz:'Asia/Bangkok',offset:7},
{name:'迪拜',tz:'Asia/Dubai',offset:4},
{name:'莫斯科',tz:'Europe/Moscow',offset:3},
{name:'伊斯坦布尔',tz:'Europe/Istanbul',offset:3},
{name:'开罗',tz:'Africa/Cairo',offset:2},
{name:'柏林/巴黎/罗马',tz:'Europe/Berlin',offset:1},
{name:'伦敦',tz:'Europe/London',offset:0},
{name:'纽约',tz:'America/New_York',offset:-5},
{name:'芝加哥',tz:'America/Chicago',offset:-6},
{name:'丹佛',tz:'America/Denver',offset:-7},
{name:'洛杉矶',tz:'America/Los_Angeles',offset:-8},
{name:'温哥华',tz:'America/Vancouver',offset:-8},
{name:'悉尼',tz:'Australia/Sydney',offset:10},
{name:'墨尔本',tz:'Australia/Melbourne',offset:10},
{name:'奥克兰',tz:'Pacific/Auckland',offset:12},
{name:'檀香山',tz:'Pacific/Honolulu',offset:-10}
];
function initSelects(){
const from=document.getElementById('fromCity');
const to=document.getElementById('toCity');
timezones.forEach((tz,i)=>{
from.innerHTML+=`<option value="${i}">${tz.name} (UTC${tz.offset>=0?'+':''}${tz.offset})</option>`;
to.innerHTML+=`<option value="${i}">${tz.name} (UTC${tz.offset>=0?'+':''}${tz.offset})</option>`;
});
from.value=0;to.value=1;
const now=new Date();
document.getElementById('depTime').value=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,16);
}
function calculate(){
const fromIdx=parseInt(document.getElementById('fromCity').value);
const toIdx=parseInt(document.getElementById('toCity').value);
const depTime=new Date(document.getElementById('depTime').value);
const flightHours=parseFloat(document.getElementById('flightHours').value)||0;
const diff=timezones[toIdx].offset-timezones[fromIdx].offset;
const absDiff=Math.abs(diff);
document.getElementById('destTzLabel').textContent=timezones[toIdx].name+'时间';
const resultEl=document.getElementById('diffResult');
let diffText='';
if(diff>0)diffText=`比北京时间快 ${absDiff} 小时 ⏩`;
else if(diff<0)diffText=`比北京时间慢 ${absDiff} 小时 ⏪`;
else diffText=`与北京时间相同 ⏰`;
const severity=absDiff<=2?'easy':absDiff<=6?'medium':'hard';
const severityText=absDiff<=2?'轻微':absDiff<=6?'中等':'严重';
resultEl.innerHTML=`<div class="big">${diff>0?'+':''}${diff}小时</div>
<div class="label">${diffText}</div>
<div style="margin-top:8px"><span class="badge ${severity}">${severityText}时差</span></div>
<div style="margin-top:12px;font-size:13px;color:var(--text2)">
到达当地时间: ${new Date(depTime.getTime()+flightHours*3600000+diff*3600000).toLocaleString('zh-CN',{timeZone:timezones[toIdx].tz})}
</div>`;
generateAdjustPlan(diff,absDiff,severity);
generateHourBar(diff);
generateTips(diff,absDiff,severity);
updateClocks(toIdx);
}
function generateAdjustPlan(diff,absDiff,severity){
const el=document.getElementById('adjustSchedule');
const days=Math.ceil(absDiff/3)+2;
const isEast=diff>0;
let rows='';
for(let d=0;d<=days;d++){
const label=d===0?'出发日':`Day ${d}`;
const step=d===0?0:Math.round((d/days)*absDiff);
const adjHours=isEast?-step:step;
const sleepHour=(23+adjHours)%24;
const wakeHour=(7+adjHours+24)%24;
const badgeClass=step<=2?'easy':step<=absDiff/2?'medium':'hard';
const badgeText=step===0?'基准':`调${Math.abs(adjHours)}h`;
rows+=`<div class="schedule-row"><div class="day-label">${label}</div>
<div class="sleep-time">💤 ${sleepHour}:00 睡 → ⏰ ${wakeHour}:00 起</div>
<div class="badge ${badgeClass}">${badgeText}</div></div>`;
}
el.innerHTML=rows;
}
function generateHourBar(diff){
const bar=document.getElementById('hourBar');
let html='';
for(let h=0;h<24;h++){
const adjH=(h+diff+24)%24;
let cls,tip;
if(adjH>=6&&adjH<22){cls='awake';tip=`${h}:00 → 目标${adjH}:00 建议清醒`;}
else{cls='sleep';tip=`${h}:00 → 目标${adjH}:00 建议睡眠`;}
html+=`<div class="${cls}" title="${tip}">${h}</div>`;
}
bar.innerHTML=html;
}
function generateTips(diff,absDiff,severity){
const tipsEl=document.getElementById('tips');
const sleepTips=document.getElementById('sleepTips');
const tips=[];
const sleepAdvice=[];
if(absDiff>=6){
tips.push({icon:'💊',text:'可在到达前1-2天开始调整作息，每天提前/推后1小时睡觉'});
tips.push({icon:'🌞',text:'到达后尽量在当地时间白天保持清醒，接触自然光'});
tips.push({icon:'☕',text:'避免下午3点后摄入咖啡因'});
tips.push({icon:'💤',text:'前3天可使用褪黑素辅助调整（建议睡前30分钟服用）'});
tips.push({icon:'🏃',text:'适当运动有助于调整生物钟，但避免睡前剧烈运动'});
}
else if(absDiff>=3){
tips.push({icon:'🌞',text:'到达后白天多晒太阳，帮助身体快速适应'});
tips.push({icon:'😴',text:'到达当天避免午睡，坚持到当地晚上再睡'});
tips.push({icon:'💧',text:'多喝水，避免酒精和过量咖啡因'});
}
else{
tips.push({icon:'✅',text:'时差较小，通常1天内可适应'});
tips.push({icon:'😴',text:'到达后按当地时间作息即可'});
}
tipsEl.innerHTML=tips.map(t=>`<div class="tip-item"><span class="tip-icon">${t.icon}</span><span>${t.text}</span></div>`).join('');
if(absDiff>=4){
const isEast=diff>0;
const phase=absDiff>=8?'到达前3天':'到达前2天';
sleepAdvice.push(`<div style="font-size:13px;line-height:1.8">
<div style="margin-bottom:8px"><strong>📋 ${phase}开始调整：</strong></div>
<div>• ${isEast?'每晚提前':'每晚推迟'}1小时睡觉</div>
<div>• 调整用餐时间向目标时区靠拢</div>
<div>• 到达后第1-2天可能最不适应</div>
<div>• 完全适应通常需要${Math.ceil(absDiff/2)}-${Math.ceil(absDiff)}天</div>
</div>`);
}
else{
sleepAdvice.push('<div style="font-size:13px;color:var(--text2)">时差较小，通常1天即可适应，无需特别调整。</div>');
}
sleepTips.innerHTML=sleepAdvice.join('');
}
function updateClocks(toIdx){
const homeEl=document.getElementById('homeTime');
const destEl=document.getElementById('destTime');
function tick(){
const now=new Date();
homeEl.textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
const destTz=timezones[toIdx].tz;
destEl.textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:destTz});
}
tick();setInterval(tick,1000);
}
initSelects();calculate();
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();}if(e.key==='Escape'){}});
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
