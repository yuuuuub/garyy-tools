<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROI计算器</title>
<meta name="description" content="ROI投资回报率计算器，评估投资收益">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vhscroll-behavior:smooth;padding:16px;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.result-big{text-align:center;padding:18px}
.result-big .label{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.result-big .value{font-size:2rem;font-weight:700}
.result-big .value.red{color:var(--red)}
.result-big .value.gold{color:var(--gold)}
.result-big .value.green{color:var(--green)}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.stat-card{text-align:center;padding:14px;background:var(--bg);border-radius:var(--radius)}
.stat-card .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:1.1rem;font-weight:700}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.breakdown-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.breakdown-item:last-child{border-bottom:none}
.breakdown-item .bl{color:var(--text2)}
.breakdown-item .br{font-weight:600}
.chart-bar-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.chart-bar-row .label{min-width:70px;font-size:.75rem;color:var(--text2)}
.chart-bar-row .bar-track{flex:1;height:16px;background:var(--bg);border-radius:4px;overflow:hidden}
.chart-bar-row .bar-fill{height:100%;border-radius:4px;transition:width .5s}
.chart-bar-row .val{min-width:60px;text-align:right;font-size:.75rem;font-weight:600}
.preset-group{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.preset-btn{padding:4px 12px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;background:var(--card);color:var(--text);cursor:pointer;transition:all .2s}
.preset-btn:hover{border-color:var(--blue);color:var(--blue)}
.scenario-box{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.scenario-box h3{font-size:.9rem;margin-bottom:10px;color:var(--gold)}
.remove-scenario{float:right;background:var(--red);color:#fff;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:.75rem}
.compare-bar{display:flex;align-items:center;gap:8px;margin:8px 0}
.compare-bar .name{min-width:80px;font-size:.8rem;font-weight:600}
.compare-bar .bar-track{flex:1;height:24px;background:var(--bg);border-radius:4px;overflow:hidden;position:relative}
.compare-bar .bar-fill{height:100%;border-radius:4px;transition:width .5s;display:flex;align-items:center;padding-left:8px;font-size:.7rem;font-weight:600;color:#fff}
@media(max-width:640px){.form-row{flex-direction:column}.grid-3{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="ROI计算器">
<meta property="og:description" content="ROI投资回报率计算器，评估投资收益">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/roi-calculator/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📈 ROI计算器</h1>
    <p>投资回报率分析与对比</p>
  </header>

  <div class="card">
    <div class="section-title">添加投资场景</div>
    <div class="form-row">
      <div class="group"><label>场景名称</label><input type="text" id="scenarioName" value="投资方案A"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>初始投资 (元)</label><input type="number" id="initInvest" value="100000" min="0" step="any"></div>
      <div class="group"><label>附加成本 (元)</label><input type="number" id="addCost" value="10000" min="0" step="any"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>预期总收益 (元)</label><input type="number" id="returnAmt" value="150000" min="0" step="any"></div>
      <div class="group"><label>投资周期 (月)</label><input type="number" id="period" value="12" min="1" step="1"></div>
    </div>
    <button class="btn" onclick="addScenario()" style="margin-top:4px">+ 添加场景</button>
    <div class="preset-group" style="margin-top:10px" id="presets"></div>
  </div>

  <div id="scenarios"></div>

  <div class="card" id="compareCard" style="display:none">
    <div class="section-title">📊 场景对比</div>
    <div id="compareBars"></div>
    <div id="compareTable"></div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});

let scenarios=[];
let nextId=1;

const presets=[
  {name:'房产投资',initInvest:2000000,addCost:100000,returnAmt:2500000,period:24},
  {name:'股票基金',initInvest:50000,addCost:0,returnAmt:65000,period:12},
  {name:'创业项目',initInvest:300000,addCost:50000,returnAmt:600000,period:18},
  {name:'定期存款',initInvest:100000,addCost:0,returnAmt:103500,period:12}
];

$('presets').innerHTML=presets.map(p=>`<button class="preset-btn" onclick="applyPreset(${JSON.stringify(p).replace(/"/g,'&quot;')})">${p.name}</button>`).join('');

window.applyPreset=function(p){
  $('scenarioName').value=p.name;
  $('initInvest').value=p.initInvest;
  $('addCost').value=p.addCost;
  $('returnAmt').value=p.returnAmt;
  $('period').value=p.period;
};

function calcROI(s){
  const totalCost=s.initInvest+s.addCost;
  const netReturn=s.returnAmt-s.initInvest;
  const roi=totalCost>0?(netReturn/totalCost*100):0;
  const monthlyROI=s.period>0?(roi/s.period):0;
  const annualROI=s.period>0?(roi/s.period*12):0;
  const payback=s.period>0?(totalCost/s.returnAmt*s.period):Infinity;
  return{...s,totalCost,netReturn,roi,monthlyROI,annualROI,payback};
}

function addScenario(){
  const s={
    id:nextId++,
    name:$('scenarioName').value||('场景'+nextId),
    initInvest:+$('initInvest').value||0,
    addCost:+$('addCost').value||0,
    returnAmt:+$('returnAmt').value||0,
    period:+$('period').value||1
  };
  scenarios.push(s);
  render();
}

window.removeScenario=function(id){
  scenarios=scenarios.filter(s=>s.id!==id);
  render();
};

function render(){
  if(scenarios.length===0){$('scenarios').innerHTML='';$('compareCard').style.display='none';return;}

  const results=scenarios.map(calcROI);
  const maxROI=Math.max(...results.map(r=>Math.abs(r.roi)),1);

  let html='';
  results.forEach(r=>{
    const roiClass=r.roi>=0?'green':'red';
    html+=`<div class="card">
      <button class="remove-scenario" onclick="removeScenario(${r.id})">删除</button>
      <div class="section-title">${r.name}</div>
      <div class="result-big"><div class="label">ROI</div><div class="value ${roiClass}">${r.roi.toFixed(1)}%</div></div>
      <div class="grid-3">
        <div class="stat-card"><div class="label">净收益</div><div class="value" style="color:${r.netReturn>=0?'var(--green)':'var(--red)'}">¥${fmt(r.netReturn)}</div></div>
        <div class="stat-card"><div class="label">月均回报</div><div class="value" style="color:var(--blue)">¥${fmt(r.netReturn/r.period)}</div></div>
        <div class="stat-card"><div class="label">年化ROI</div><div class="value" style="color:var(--gold)">${r.annualROI.toFixed(1)}%</div></div>
      </div>
      <div class="breakdown-item" style="margin-top:8px"><span class="bl">总投入</span><span class="br">¥${fmt(r.totalCost)}</span></div>
      <div class="breakdown-item"><span class="bl">预期总收益</span><span class="br">¥${fmt(r.returnAmt)}</span></div>
      <div class="breakdown-item"><span class="bl">投资周期</span><span class="br">${r.period} 个月</span></div>
    </div>`;
  });
  $('scenarios').innerHTML=html;

  if(results.length>=2){
    $('compareCard').style.display='';
    const colors=['var(--blue)','var(--green)','var(--gold)','var(--red)'];
    let barsHtml=results.map((r,i)=>{
      const pct=Math.max(0,r.roi/maxROI*100);
      return `<div class="compare-bar"><div class="name">${r.name}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${colors[i%colors.length]}">${r.roi.toFixed(1)}%</div></div></div>`;
    }).join('');
    $('compareBars').innerHTML=barsHtml;

    let tHead=`<table class="detail-table" style="margin-top:12px"><tr><th>场景</th><th>ROI</th><th>净收益</th><th>年化ROI</th><th>回收期</th></tr>`;
    let tRows=results.sort((a,b)=>b.roi-a.roi).map(r=>`<tr><td style="text-align:left;font-weight:600">${r.name}</td><td style="color:${r.roi>=0?'var(--green)':'var(--red)'}">${r.roi.toFixed(1)}%</td><td>¥${fmt(r.netReturn)}</td><td>${r.annualROI.toFixed(1)}%</td><td>${r.payback.toFixed(1)}月</td></tr>`).join('');
    $('compareTable').innerHTML=tHead+tRows+'</table>';
  }else{
    $('compareCard').style.display='none';
  }
}

render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
