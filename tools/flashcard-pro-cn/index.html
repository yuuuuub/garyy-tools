<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🃏 中文闪卡专业版</title>
<meta name="description" content="专业闪卡学习工具，支持间隔重复SM-2算法、牌组管理、学习进度追踪">
<meta name="robots" content="index, follow">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:800px;margin:0 auto}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
button.grn{background:var(--green)}
button.ylw{background:var(--yellow);color:#000}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
label{display:block;font-size:.85rem;color:var(--text2);margin:8px 0 4px}
.hidden{display:none}
.card-flip{perspective:1000px;height:300px;cursor:pointer;margin:20px 0}
.card-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card-flip.flipped .card-inner{transform:rotateY(180deg)}
.card-front,.card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:32px;border-radius:var(--radius);border:2px solid var(--border);font-size:1.3rem;text-align:center;line-height:1.6;overflow-y:auto}
.card-front{background:var(--card)}
.card-back{background:var(--accent);color:#fff;transform:rotateY(180deg)}
.progress-bar{width:100%;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center;margin:16px 0}
.stat-box{padding:14px;background:var(--bg);border-radius:8px}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.table{width:100%;border-collapse:collapse;margin-top:8px}
.table th,.table td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:.9rem}
.table th{color:var(--text2);font-weight:600}
.table tr:hover{background:rgba(59,130,246,.05)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.badge-new{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-learn{background:rgba(210,153,34,.2);color:var(--yellow)}
.badge-review{background:rgba(63,185,80,.2);color:var(--green)}
.badge-mastered{background:rgba(63,185,80,.4);color:var(--green)}
.empty{text-align:center;padding:40px;color:var(--text2)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1 style="position:fixed;top:6px;left:80px;z-index:999;font-size:1rem;pointer-events:none">🃏 中文闪卡专业版</h1>

<div class="ctn" style="padding-top:40px">
<div class="bg" style="justify-content:center;margin-bottom:20px">
<button onclick="showView('decks')" id="btn-decks">📚 牌组管理</button>
<button onclick="showView('study')" id="btn-study">📖 开始学习</button>
<button onclick="showView('stats')" id="btn-stats">📊 统计</button>
<button onclick="exportAll()">💾 导出</button>
<button class="sec" onclick="importData()">📥 导入</button>
</div>

<div id="view-decks">
<div class="bg"><button onclick="createDeck()">+ 新建牌组</button><button class="sec" onclick="loadDemoDeck()">📖 加载示例</button></div>
<div id="deck-list"></div>
</div>

<div id="view-study" class="hidden">
<div id="study-empty" class="empty">选择一个牌组开始学习</div>
<div id="study-area" class="hidden">
<div class="cd">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<span id="study-deck-name" style="font-weight:600"></span>
<span id="study-progress-text" style="font-size:.85rem;color:var(--text2)"></span>
</div>
<div class="progress-bar"><div id="study-progress" class="progress-fill" style="background:var(--accent);width:0%"></div></div>
</div>
<div class="card-flip" id="card-flip" onclick="flipCard()">
<div class="card-inner">
<div class="card-front" id="card-front">点击翻转</div>
<div class="card-back" id="card-back">背面内容</div>
</div>
</div>
<div id="answer-btns" class="bg" style="justify-content:center">
<button class="dng" onclick="answerCard(0)">❌ 不会</button>
<button class="ylw" onclick="answerCard(1)">🤔 模糊</button>
<button class="sec" onclick="answerCard(2)">👍 记得</button>
<button class="grn" onclick="answerCard(3)">✅ 简单</button>
</div>
</div>
</div>

<div id="view-stats" class="hidden"><div id="stats-content"></div></div>
</div>

<div class="modal-overlay hidden" id="deck-modal">
<div class="modal">
<h2 id="deck-modal-title">新建牌组</h2>
<label>牌组名称</label><input type="text" id="deck-name" placeholder="输入牌组名称">
<div class="bg"><button onclick="saveDeckModal()">保存</button><button class="sec" onclick="closeModal('deck-modal')">取消</button></div>
</div>
</div>
<div class="modal-overlay hidden" id="card-modal">
<div class="modal">
<h2>编辑闪卡</h2>
<label>正面（问题）</label><textarea id="card-front-input" rows="3"></textarea>
<label>背面（答案）</label><textarea id="card-back-input" rows="3"></textarea>
<label>类型</label><select id="card-type"><option value="basic">基础卡</option><option value="cloze">填空卡</option></select>
<div class="bg"><button onclick="saveCard()">保存</button><button class="sec" onclick="closeModal('card-modal')">取消</button></div>
</div>
</div>

<input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
const STORAGE_KEY='flashcard_pro_data';
let data={decks:[],currentDeck:null};
let study={cards:[],index:0,correct:0,total:0,sessionStart:0};
let editingDeckId=null,editingCardIdx=-1;

function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY));if(d)data={...data,...d}}catch(e){}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}

function showView(v){
['decks','study','stats'].forEach(id=>{
document.getElementById('view-'+id).classList.toggle('hidden',id!==v);
document.getElementById('btn-'+id)?.classList.toggle('active',id===v);
});
if(v==='study')initStudy();
if(v==='stats')renderStats();
}

function renderDeckList(){
const el=document.getElementById('deck-list');
if(!data.decks.length){el.innerHTML='<div class="empty">暂无牌组，点击"+ 新建牌组"开始</div>';return}
el.innerHTML=data.decks.map(d=>{
const total=d.cards.length;
const due=d.cards.filter(c=>!c.nextReview||new Date(c.nextReview)<=new Date()).length;
const mastered=d.cards.filter(c=>(c.repetitions||0)>=5).length;
return`<div class="cd"><div style="display:flex;justify-content:space-between;align-items:center"><div><strong style="font-size:1.1rem">${d.name}</strong><div style="font-size:.8rem;color:var(--text2);margin-top:4px">${total} 张卡片 · ${due} 待复习 · ${mastered} 已掌握</div></div><div class="bg"><button onclick="startStudyDeck('${d.id}')" class="grn">学习</button><button onclick="editDeckCards('${d.id}')">编辑</button><button class="dng" onclick="deleteDeck('${d.id}')">删除</button></div></div></div>`;
}).join('');
}

function createDeck(){editingDeckId=null;document.getElementById('deck-modal-title').textContent='新建牌组';document.getElementById('deck-name').value='';document.getElementById('deck-modal').classList.remove('hidden')}
function saveDeckModal(){
const name=document.getElementById('deck-name').value.trim();
if(!name)return;
if(editingDeckId){const d=data.decks.find(x=>x.id===editingDeckId);if(d)d.name=name}
else{data.decks.push({id:Date.now().toString(),name,cards:[]})}
save();closeModal('deck-modal');renderDeckList();
}
function deleteDeck(id){if(!confirm('确定删除此牌组？'))return;data.decks=data.decks.filter(d=>d.id!==id);save();renderDeckList()}

function editDeckCards(deckId){
data.currentDeck=deckId;
const deck=data.decks.find(d=>d.id===deckId);
if(!deck)return;
showView('study');
document.getElementById('study-empty').innerHTML=`
<h2 style="margin-bottom:16px">📝 编辑: ${deck.name}</h2>
<div class="bg"><button onclick="addCard('${deckId}')">+ 添加卡片</button></div>
<div style="margin-top:16px">${deck.cards.length?`<table class="table"><thead><tr><th>正面</th><th>背面</th><th>操作</th></tr></thead><tbody>${deck.cards.map((c,i)=>`<tr><td>${c.front.substring(0,30)}</td><td>${c.back.substring(0,30)}</td><td><button onclick="editCard('${deckId}',${i})" class="sec" style="padding:4px 8px;font-size:.75rem">编辑</button> <button onclick="removeCard('${deckId}',${i})" class="dng" style="padding:4px 8px;font-size:.75rem">删除</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无卡片</div>'}</div>`;
document.getElementById('study-empty').classList.remove('hidden');
document.getElementById('study-area').classList.add('hidden');
}

function addCard(deckId){
const deck=data.decks.find(d=>d.id===deckId);
if(!deck)return;
document.getElementById('card-front-input').value='';
document.getElementById('card-back-input').value='';
editingDeckId=deckId;editingCardIdx=-1;
document.getElementById('card-modal').classList.remove('hidden');
}
function editCard(deckId,idx){
const deck=data.decks.find(d=>d.id===deckId);
if(!deck)return;
editingDeckId=deckId;editingCardIdx=idx;
document.getElementById('card-front-input').value=deck.cards[idx].front;
document.getElementById('card-back-input').value=deck.cards[idx].back;
document.getElementById('card-type').value=deck.cards[idx].type||'basic';
document.getElementById('card-modal').classList.remove('hidden');
}
function removeCard(deckId,idx){
const deck=data.decks.find(d=>d.id===deckId);
if(!deck)return;
deck.cards.splice(idx,1);save();
if(data.currentDeck)editDeckCards(data.currentDeck);
}
function saveCard(){
const front=document.getElementById('card-front-input').value.trim();
const back=document.getElementById('card-back-input').value.trim();
if(!front||!back)return;
const deck=data.decks.find(d=>d.id===editingDeckId);
if(!deck)return;
const card={front,back,type:document.getElementById('card-type').value,repetitions:0,easeFactor:2.5,interval:0,nextReview:null,lastReview:null};
if(editingCardIdx>=0)deck.cards[editingCardIdx]={...deck.cards[editingCardIdx],front,back,type:card.type};
else deck.cards.push(card);
save();closeModal('card-modal');
if(data.currentDeck)editDeckCards(data.currentDeck);
else renderDeckList();
}

function startStudyDeck(deckId){
data.currentDeck=deckId;initStudy();
}
function initStudy(){
const deck=data.decks.find(d=>d.id===data.currentDeck);
if(!deck||!deck.cards.length){document.getElementById('study-empty').classList.remove('hidden');document.getElementById('study-empty').innerHTML='<div class="empty">此牌组暂无卡片</div>';document.getElementById('study-area').classList.add('hidden');return}
const now=new Date();
let due=deck.cards.filter(c=>!c.nextReview||new Date(c.nextReview)<=now);
if(!due.length)due=deck.cards.slice();
due.sort(()=>Math.random()-.5);
study={cards:due,index:0,correct:0,total:due.length,sessionStart:Date.now()};
document.getElementById('study-empty').classList.add('hidden');
document.getElementById('study-area').classList.remove('hidden');
document.getElementById('study-deck-name').textContent=deck.name;
showStudyCard();
}

function showStudyCard(){
if(study.index>=study.cards.length){finishStudy();return}
const card=study.cards[study.index];
document.getElementById('card-front').textContent=card.front;
document.getElementById('card-back').textContent=card.back;
document.getElementById('card-flip').classList.remove('flipped');
document.getElementById('answer-btns').style.opacity='.3';document.getElementById('answer-btns').style.pointerEvents='none';
const pct=Math.floor(study.index/study.total*100);
document.getElementById('study-progress').style.width=pct+'%';
document.getElementById('study-progress-text').textContent=`${study.index+1} / ${study.total}`;
}

function flipCard(){
document.getElementById('card-flip').classList.toggle('flipped');
if(document.getElementById('card-flip').classList.contains('flipped')){
document.getElementById('answer-btns').style.opacity='1';document.getElementById('answer-btns').style.pointerEvents='auto';
}
}

function answerCard(quality){
const card=study.cards[study.index];
const deck=data.decks.find(d=>d.id===data.currentDeck);
if(quality>=2)study.correct++;
// SM-2 algorithm
if(quality<2){card.repetitions=0;card.interval=1}
else{
if(card.repetitions===0)card.interval=1;
else if(card.repetitions===1)card.interval=6;
else card.interval=Math.round(card.interval*card.easeFactor);
card.repetitions=(card.repetitions||0)+1;
}
card.easeFactor=Math.max(1.3,(card.easeFactor||2.5)+(0.1-(3-quality)*(0.08+(3-quality)*0.02)));
const next=new Date();next.setDate(next.getDate()+card.interval);
card.nextReview=next.toISOString();card.lastReview=new Date().toISOString();
// Update card in deck
if(deck){const idx=deck.cards.findIndex(c=>c.front===card.front&&c.back===card.back);if(idx>=0)deck.cards[idx]={...deck.cards[idx],...card}}
save();
study.index++;showStudyCard();
}

function finishStudy(){
const elapsed=Math.floor((Date.now()-study.sessionStart)/1000);
const mins=Math.floor(elapsed/60);const secs=elapsed%60;
document.getElementById('study-area').innerHTML=`
<div class="cd" style="text-align:center"><h2>🎉 学习完成！</h2>
<div class="stat-grid"><div class="stat-box"><div class="stat-num">${study.total}</div><div class="stat-label">总卡片</div></div>
<div class="stat-box"><div class="stat-num" style="color:var(--green)">${study.correct}</div><div class="stat-label">答对</div></div>
<div class="stat-box"><div class="stat-num" style="color:var(--red)">${study.total-study.correct}</div><div class="stat-label">待加强</div></div>
<div class="stat-box"><div class="stat-num">${mins}:${secs.toString().padStart(2,'0')}</div><div class="stat-label">用时</div></div></div>
<div style="margin-top:16px;color:var(--text2)">正确率: ${study.total?Math.floor(study.correct/study.total*100):0}%</div>
<div class="bg" style="justify-content:center;margin-top:16px"><button onclick="initStudy()">再学一轮</button><button class="sec" onclick="showView('decks')">返回</button></div></div>`;
}

function renderStats(){
const el=document.getElementById('stats-content');
let totalCards=0,totalDue=0,totalMastered=0;
data.decks.forEach(d=>{totalCards+=d.cards.length;totalDue+=d.cards.filter(c=>!c.nextReview||new Date(c.nextReview)<=new Date()).length;totalMastered+=d.cards.filter(c=>(c.repetitions||0)>=5).length});
el.innerHTML=`<div class="cd"><h2 style="margin-bottom:16px">📊 学习统计</h2>
<div class="stat-grid"><div class="stat-box"><div class="stat-num">${data.decks.length}</div><div class="stat-label">牌组数</div></div>
<div class="stat-box"><div class="stat-num">${totalCards}</div><div class="stat-label">总卡片</div></div>
<div class="stat-box"><div class="stat-num">${totalDue}</div><div class="stat-label">待复习</div></div>
<div class="stat-box"><div class="stat-num">${totalMastered}</div><div class="stat-label">已掌握</div></div></div>
${data.decks.length?`<h3 style="margin-top:20px;margin-bottom:8px">各牌组详情</h3><table class="table"><thead><tr><th>牌组</th><th>卡片</th><th>待复习</th><th>已掌握</th></tr></thead><tbody>${data.decks.map(d=>{const due=d.cards.filter(c=>!c.nextReview||new Date(c.nextReview)<=new Date()).length;const mastered=d.cards.filter(c=>(c.repetitions||0)>=5).length;return`<tr><td>${d.name}</td><td>${d.cards.length}</td><td>${due}</td><td>${mastered}</td></tr>`}).join('')}</tbody></table>`:''}</div>`;
}

function loadDemoDeck(){
const demo={id:'demo'+Date.now(),name:'英语词汇示例',cards:[
{front:'Hello',back:'你好',type:'basic',repetitions:0,easeFactor:2.5,interval:0,nextReview:null,lastReview:null},
{front:'Goodbye',back:'再见',type:'basic',repetitions:0,easeFactor:2.5,interval:0,nextReview:null,lastReview:null},
{front:'Thank you',back:'谢谢',type:'basic',repetitions:0,easeFactor:2.5,interval:0,nextReview:null,lastReview:null},
{front:'Please',back:'请',type:'basic',repetitions:0,easeFactor:2.5,interval:0,nextReview:null,lastReview:null},
{front:'Excuse me',back:'打扰一下',type:'basic',repetitions:0,easeFactor:2.5,interval:0,nextReview:null,lastReview:null},
{front:'Sorry',back:'对不起',type:'basic',repetitions:0,easeFactor:2.5,interval:0,nextReview:null,lastReview:null},
{front:'Good morning',back:'早上好',type:'basic',repetitions:0,easeFactor:2.5,interval:0,nextReview:null,lastReview:null},
{front:'How are you?',back:'你好吗？',type:'basic',repetitions:0,easeFactor:2.5,interval:0,nextReview:null,lastReview:null}
]};
data.decks.push(demo);save();renderDeckList();
}

function exportAll(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='flashcards_backup.json';a.click()}
function importData(){document.getElementById('import-file').click()}
function handleImport(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){try{data=JSON.parse(ev.target.result);save();renderDeckList()}catch(e){alert('导入失败')}};r.readAsText(f)}

function closeModal(id){document.getElementById(id).classList.add('hidden')}

load();renderDeckList();showView('decks');
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
