<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥾 徒步追踪</title>
<meta name="description" content="徒步旅行追踪器，记录路线、距离、海拔，管理徒步心愿单">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.stars{color:var(--warn);cursor:pointer;font-size:1.2rem}
.elev-bar{height:8px;background:var(--bg);border-radius:4px;margin-top:6px;overflow:hidden}
.elev-fill{height:100%;background:linear-gradient(90deg,var(--success),var(--accent));border-radius:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥾</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🥾 徒步追踪">
<meta property="og:description" content="徒步旅行追踪器，记录路线、距离、海拔">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/hiking-tracker-cn/">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🥾 徒步追踪</h1><p>记录每一次探险，丈量山川湖海</p></div>

<div class="cd">
<div class="gr">
<div class="st"><div class="nm" id="totalTrails">0</div><div class="lb">总路线数</div></div>
<div class="st"><div class="nm" id="totalDist" style="color:var(--success)">0</div><div class="lb">总距离(km)</div></div>
<div class="st"><div class="nm" id="totalElev" style="color:var(--warn)">0</div><div class="lb">总海拔(m)</div></div>
<div class="st"><div class="nm" id="avgDiff" style="color:var(--danger)">-</div><div class="lb">平均难度</div></div>
</div>
</div>

<div class="cd"><h2>记录徒步</h2>
<div><label>路线名称</label><input type="text" id="hTrail" placeholder="如：黄山光明顶"></div>
<div class="fr">
<div><label>距离(km)</label><input type="number" id="hDist" placeholder="12.5" step="0.1" min="0.1"></div>
<div><label>用时(小时:分钟)</label><input type="text" id="hTime" placeholder="4:30"></div>
</div>
<div class="fr">
<div><label>海拔爬升(m)</label><input type="number" id="hElev" placeholder="800" min="0"></div>
<div><label>难度</label><select id="hDiff"><option>简单</option><option>中等</option><option>困难</option><option>极难</option></select></div>
</div>
<div class="fr">
<div><label>地形</label><select id="hTerrain"><option>山地</option><option>森林</option><option>海岸</option><option>沙漠</option><option>雪地</option><option>草原</option></select></div>
<div><label>评分</label><div class="stars" id="hStars" data-val="3">★★★☆☆</div></div>
</div>
<div><label>日期</label><input type="date" id="hDate"></div>
<div class="bg"><button onclick="addHike()">保存徒步</button></div></div>

<div class="cd"><h2>海拔概览</h2><div id="elevProfile"></div></div>

<div class="cd"><h2>徒步记录</h2><div id="hikeList" class="es">暂无记录</div>
<div class="bg"><button class="dng" onclick="clearHikes()">清空所有</button></div></div>

<div class="cd"><h2>心愿清单</h2>
<div style="display:flex;gap:8px"><input type="text" id="wishTrail" placeholder="想去的路线" style="flex:1"><button onclick="addWish()">添加</button></div>
<div id="wishList" style="margin-top:12px"></div></div>
</div>
<script>
(function(){
var DB_KEY='hiking_tracker_cn';
var WISH_KEY='hiking_wishlist';
var hikes=JSON.parse(localStorage.getItem(DB_KEY)||'[]');
var wishes=JSON.parse(localStorage.getItem(WISH_KEY)||'[]');
var today=function(){return new Date().toISOString().slice(0,10)};
var starVal=3;

document.getElementById('hStars').onclick=function(e){
var chars=this.textContent.split('');
var clicked=0;
for(var i=0;i<chars.length;i++){if(e.target===this.childNodes[i*2]||e.target===this){clicked=Math.floor(i/2)+1;break;}}
if(!clicked){var rect=this.getBoundingClientRect();clicked=Math.ceil((e.clientX-rect.left)/rect.width*5);}
starVal=Math.max(1,Math.min(5,clicked));
updateStars();
};
function updateStars(){var s='';for(var i=1;i<=5;i++)s+=i<=starVal?'★':'☆';document.getElementById('hStars').textContent=s;document.getElementById('hStars').dataset.val=starVal;}

window.addHike=function(){
var trail=document.getElementById('hTrail').value.trim();
var dist=parseFloat(document.getElementById('hDist').value)||0;
if(!trail||!dist){alert('请输入路线名称和距离');return;}
var time=document.getElementById('hTime').value;
var elev=parseInt(document.getElementById('hElev').value)||0;
var diff=document.getElementById('hDiff').value;
var terrain=document.getElementById('hTerrain').value;
var date=document.getElementById('hDate').value||today();
hikes.push({id:Date.now(),trail:trail,distance:dist,time:time,elevation:elev,difficulty:diff,terrain:terrain,rating:starVal,date:date});
localStorage.setItem(DB_KEY,JSON.stringify(hikes));
document.getElementById('hTrail').value='';document.getElementById('hDist').value='';document.getElementById('hTime').value='';document.getElementById('hElev').value='';
starVal=3;updateStars();render();
};

window.delHike=function(id){hikes=hikes.filter(function(h){return h.id!==id});localStorage.setItem(DB_KEY,JSON.stringify(hikes));render();};
window.clearHikes=function(){if(!confirm('确定清空所有？'))return;hikes=[];localStorage.setItem(DB_KEY,JSON.stringify(hikes));render();};

window.addWish=function(){
var name=document.getElementById('wishTrail').value.trim();
if(!name)return;
wishes.push({id:Date.now(),name:name,done:false});
localStorage.setItem(WISH_KEY,JSON.stringify(wishes));
document.getElementById('wishTrail').value='';renderWishes();
};
window.delWish=function(id){wishes=wishes.filter(function(w){return w.id!==id});localStorage.setItem(WISH_KEY,JSON.stringify(wishes));renderWishes();};
window.toggleWish=function(id){var w=wishes.find(function(x){return x.id===id});if(w){w.done=!w.done;localStorage.setItem(WISH_KEY,JSON.stringify(wishes));renderWishes();}};

function renderWishes(){
var el=document.getElementById('wishList');
if(!wishes.length){el.innerHTML='';return;}
el.innerHTML=wishes.map(function(w){
return '<div class="li" style="padding:8px"><div style="flex:1;'+(w.done?'text-decoration:line-through;opacity:.5':'')+'">'+w.name+'</div><div style="display:flex;gap:6px"><button style="padding:2px 8px;font-size:.75rem;background:'+(w.done?'var(--success)':'var(--bg)')+'" onclick="toggleWish('+w.id+')">'+(w.done?'✓':'○')+'</button><button class="dng" style="padding:2px 8px;font-size:.75rem" onclick="delWish('+w.id+')">✕</button></div></div>';
}).join('');
}

function render(){
document.getElementById('totalTrails').textContent=hikes.length;
var totalD=0,totalE=0;
var diffMap={简单:1,中等:2,困难:3,极难:4};var diffSum=0;
hikes.forEach(function(h){totalD+=h.distance;totalE+=h.elevation;diffSum+=diffMap[h.difficulty]||1;});
document.getElementById('totalDist').textContent=totalD.toFixed(1);
document.getElementById('totalElev').textContent=totalE;
var avgD=hikes.length?diffSum/hikes.length:0;
var avgLabels=['-','简单','中等','困难','极难'];
document.getElementById('avgDiff').textContent=avgLabels[Math.round(avgD)]||'-';

var maxElev=Math.max.apply(null,hikes.map(function(h){return h.elevation;}));
var el=document.getElementById('elevProfile');
if(!hikes.length){el.innerHTML='<div class="es">暂无数据</div>';return;}
el.innerHTML=hikes.slice().reverse().slice(0,10).map(function(h){
var pct=maxElev>0?Math.round(h.elevation/maxElev*100):0;
return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:.85rem"><span>'+h.trail+'</span><span style="color:var(--accent)">'+h.elevation+'m</span></div><div class="elev-bar"><div class="elev-fill" style="width:'+pct+'%"></div></div></div>';
}).join('');

var hEl=document.getElementById('hikeList');
if(!hikes.length){hEl.innerHTML='<div class="es">暂无记录</div>';return;}
hEl.innerHTML=hikes.slice().reverse().map(function(h){
var dc=h.difficulty==='极难'?'d':h.difficulty==='困难'?'w':'s';
var stars='';for(var i=1;i<=5;i++)stars+=i<=h.rating?'★':'☆';
return '<div class="li"><div style="flex:1"><strong>'+h.trail+'</strong> <span class="tag '+dc+'">'+h.difficulty+'</span><span class="tag">'+h.terrain+'</span><br><span style="font-size:.8rem;color:var(--text2)">'+h.distance+'km · '+h.time+' · '+h.elevation+'m爬升 · '+h.date+'</span><div style="font-size:.75rem;color:var(--warn)">'+stars+'</div></div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="delHike('+h.id+')">✕</button></div>';
}).join('');

renderWishes();
}
document.getElementById('hDate').value=today();
updateStars();render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
