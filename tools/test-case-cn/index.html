<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试用例生成器</title>
<meta name="description" content="在线生成和管理软件测试用例，支持多种测试类型">
<script defer src="../i18n.js"></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth;padding:16px}
.container{max-width:960px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button,textarea{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:60px}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s;display:inline-block;text-align:center}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:4px 12px;font-size:.8rem}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:var(--radius);cursor:pointer;font-size:.82rem;background:var(--card);border:1px solid var(--border);color:var(--text2);transition:all .2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tc-table{width:100%;border-collapse:collapse;font-size:.82rem}
.tc-table th,.tc-table td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.tc-table th{background:var(--bg);color:var(--text2);font-weight:500;white-space:nowrap}
.tc-table tr:hover{background:var(--bg)}
.tc-table .tc-id{color:var(--text2);font-family:monospace;white-space:nowrap}
.priority{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.7rem;font-weight:600}
.priority-P0{background:var(--red);color:#fff}
.priority-P1{background:var(--gold);color:#000}
.priority-P2{background:var(--green);color:#fff}
.priority-P3{background:var(--text2);color:#fff}
.type-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.7rem;background:var(--blue);color:#fff}
.tc-actions{white-space:nowrap}
.tc-actions button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:.75rem;margin-right:4px}
.tc-actions button:hover{color:var(--blue)}
.preview-box{background:#fff;color:#333;padding:24px;border-radius:var(--radius);border:1px solid #ddd;font-size:.82rem;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.output-area{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px;display:none}
.stats-bar{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.stat-item{font-size:.8rem;color:var(--text2)}
.stat-item span{color:var(--text);font-weight:600}
@media(max-width:640px){.form-row{flex-direction:column}.tc-table{font-size:.75rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="测试用例生成器">
<meta property="og:description" content="在线生成和管理软件测试用例">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🧪 测试用例生成器</h1>
    <p>创建和管理软件测试用例</p>
  </header>

  <div class="card">
    <div class="section-title">项目信息</div>
    <div class="form-row">
      <div class="group"><label>项目名称</label><input type="text" id="projectName" value="用户管理系统"></div>
      <div class="group"><label>模块名称</label><input type="text" id="moduleName" value="登录模块"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">测试用例列表</div>
    <div class="stats-bar" id="statsBar"></div>
    <div style="overflow-x:auto">
      <table class="tc-table" id="tcTable">
        <thead>
          <tr>
            <th>编号</th>
            <th>用例名称</th>
            <th>类型</th>
            <th>优先级</th>
            <th>前置条件</th>
            <th>测试步骤</th>
            <th>预期结果</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tcBody"></tbody>
      </table>
    </div>
    <button class="btn btn-outline btn-sm" onclick="showAddForm()" style="margin-top:12px">+ 添加用例</button>
  </div>

  <div class="card" id="addFormCard" style="display:none">
    <div class="section-title">添加测试用例</div>
    <input type="hidden" id="editIndex" value="-1">
    <div class="form-row">
      <div class="group"><label>用例名称</label><input type="text" id="tcName" placeholder="验证正常登录流程"></div>
      <div class="group"><label>类型</label>
        <select id="tcType">
          <option value="功能测试">功能测试</option>
          <option value="边界测试">边界测试</option>
          <option value="异常测试">异常测试</option>
          <option value="安全测试">安全测试</option>
          <option value="性能测试">性能测试</option>
          <option value="兼容测试">兼容测试</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="group"><label>优先级</label>
        <select id="tcPriority">
          <option value="P0">P0 - 冒烟</option>
          <option value="P1">P1 - 核心</option>
          <option value="P2" selected>P2 - 重要</option>
          <option value="P3">P3 - 一般</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="group"><label>前置条件</label><textarea id="tcPrecondition" rows="2" placeholder="用户已注册账号"></textarea></div>
    </div>
    <div class="form-row">
      <div class="group"><label>测试步骤</label><textarea id="tcSteps" rows="3" placeholder="1. 打开登录页面&#10;2. 输入用户名和密码&#10;3. 点击登录按钮"></textarea></div>
    </div>
    <div class="form-row">
      <div class="group"><label>预期结果</label><textarea id="tcExpected" rows="2" placeholder="成功登录，跳转到首页"></textarea></div>
    </div>
    <div class="btn-group">
      <button class="btn btn-sm" onclick="saveTestCase()">保存</button>
      <button class="btn btn-sm btn-outline" onclick="hideAddForm()">取消</button>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" onclick="generateTemplate()">生成测试模板</button>
    <button class="btn btn-green" onclick="exportCSV()">导出 CSV</button>
    <button class="btn btn-outline" onclick="exportMarkdown()">导出 Markdown</button>
  </div>

  <div class="output-area" id="outputArea">
    <div class="section-title">导出预览</div>
    <div class="preview-box" id="preview"></div>
    <div class="btn-group">
      <button class="btn btn-sm btn-green" onclick="copyOutput()">复制</button>
    </div>
  </div>
</div>

<script>
var testCases = [
  {name:'验证正常登录', type:'功能测试', priority:'P0', precondition:'用户已注册', steps:'1. 打开登录页\n2. 输入正确用户名密码\n3. 点击登录', expected:'登录成功，跳转首页'},
  {name:'验证空用户名登录', type:'边界测试', priority:'P1', precondition:'无', steps:'1. 打开登录页\n2. 不输入用户名\n3. 输入密码\n4. 点击登录', expected:'提示"请输入用户名"'},
  {name:'验证错误密码登录', type:'异常测试', priority:'P0', precondition:'用户已注册', steps:'1. 打开登录页\n2. 输入正确用户名\n3. 输入错误密码\n4. 点击登录', expected:'提示"密码错误"'},
  {name:'验证密码连续错误锁定', type:'安全测试', priority:'P1', precondition:'用户已注册', steps:'1. 连续5次输入错误密码\n2. 第6次尝试登录', expected:'账号被锁定，提示"账号已锁定"'},
  {name:'验证记住密码功能', type:'功能测试', priority:'P2', precondition:'用户已注册', steps:'1. 打开登录页\n2. 勾选"记住密码"\n3. 输入账号密码\n4. 登录后退出\n5. 重新打开登录页', expected:'自动填充上次的账号密码'},
  {name:'验证SQL注入防护', type:'安全测试', priority:'P1', precondition:'无', steps:'1. 在用户名输入框输入: \' OR 1=1 --\n2. 点击登录', expected:'登录失败，不执行SQL注入'}
];

function renderTable() {
  var body = document.getElementById('tcBody');
  body.innerHTML = '';
  testCases.forEach(function(tc, i) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td class="tc-id">TC-' + String(i+1).padStart(3,'0') + '</td>' +
      '<td>' + tc.name + '</td>' +
      '<td><span class="type-tag">' + tc.type + '</span></td>' +
      '<td><span class="priority priority-' + tc.priority + '">' + tc.priority + '</span></td>' +
      '<td>' + tc.precondition + '</td>' +
      '<td style="white-space:pre-line">' + tc.steps + '</td>' +
      '<td>' + tc.expected + '</td>' +
      '<td class="tc-actions"><button onclick="editTC(' + i + ')">编辑</button><button onclick="deleteTC(' + i + ')">删除</button></td>';
    body.appendChild(tr);
  });
  updateStats();
}

function updateStats() {
  var total = testCases.length;
  var byType = {};
  var byPri = {};
  testCases.forEach(function(tc) {
    byType[tc.type] = (byType[tc.type] || 0) + 1;
    byPri[tc.priority] = (byPri[tc.priority] || 0) + 1;
  });
  var html = '<span class="stat-item">共 <span>' + total + '</span> 条</span>';
  Object.keys(byPri).sort().forEach(function(p) {
    html += '<span class="stat-item">' + p + ': <span>' + byPri[p] + '</span></span>';
  });
  document.getElementById('statsBar').innerHTML = html;
}

function showAddForm() {
  document.getElementById('addFormCard').style.display = 'block';
  document.getElementById('editIndex').value = -1;
  document.getElementById('tcName').value = '';
  document.getElementById('tcPrecondition').value = '';
  document.getElementById('tcSteps').value = '';
  document.getElementById('tcExpected').value = '';
  document.getElementById('addFormCard').scrollIntoView({ behavior: 'smooth' });
}

function hideAddForm() {
  document.getElementById('addFormCard').style.display = 'none';
}

function editTC(i) {
  var tc = testCases[i];
  document.getElementById('editIndex').value = i;
  document.getElementById('tcName').value = tc.name;
  document.getElementById('tcType').value = tc.type;
  document.getElementById('tcPriority').value = tc.priority;
  document.getElementById('tcPrecondition').value = tc.precondition;
  document.getElementById('tcSteps').value = tc.steps;
  document.getElementById('tcExpected').value = tc.expected;
  document.getElementById('addFormCard').style.display = 'block';
  document.getElementById('addFormCard').scrollIntoView({ behavior: 'smooth' });
}

function deleteTC(i) {
  if (!confirm('删除此测试用例？')) return;
  testCases.splice(i, 1);
  renderTable();
}

function saveTestCase() {
  var name = document.getElementById('tcName').value.trim();
  if (!name) { alert('请输入用例名称'); return; }
  var tc = {
    name: name,
    type: document.getElementById('tcType').value,
    priority: document.getElementById('tcPriority').value,
    precondition: document.getElementById('tcPrecondition').value,
    steps: document.getElementById('tcSteps').value,
    expected: document.getElementById('tcExpected').value
  };
  var idx = Number(document.getElementById('editIndex').value);
  if (idx >= 0) {
    testCases[idx] = tc;
  } else {
    testCases.push(tc);
  }
  hideAddForm();
  renderTable();
}

function generateTemplate() {
  var proj = document.getElementById('projectName').value;
  var mod = document.getElementById('moduleName').value;
  var template = '// 测试用例模板 - ' + proj + ' / ' + mod + '\n';
  template += '// 生成时间: ' + new Date().toLocaleString('zh-CN') + '\n\n';
  template += 'describe("' + mod + '", () => {\n';
  testCases.forEach(function(tc, i) {
    template += '  it("' + tc.name + '", () => {\n';
    template += '    // 前置条件: ' + tc.precondition + '\n';
    template += '    // 步骤: ' + tc.steps.replace(/\n/g, '\n    //        ') + '\n';
    template += '    // 预期: ' + tc.expected + '\n';
    template += '    expect(true).toBe(true);\n';
    template += '  });\n\n';
  });
  template += '});\n';

  document.getElementById('preview').textContent = template;
  document.getElementById('outputArea').style.display = 'block';
  document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
}

function exportCSV() {
  var csv = '编号,用例名称,类型,优先级,前置条件,测试步骤,预期结果\n';
  testCases.forEach(function(tc, i) {
    csv += 'TC-' + String(i+1).padStart(3,'0') + ',' +
      '"' + tc.name + '",' +
      tc.type + ',' +
      tc.priority + ',' +
      '"' + tc.precondition.replace(/"/g,'""') + '",' +
      '"' + tc.steps.replace(/"/g,'""') + '",' +
      '"' + tc.expected.replace(/"/g,'""') + '"\n';
  });

  document.getElementById('preview').textContent = csv;
  document.getElementById('outputArea').style.display = 'block';
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'test-cases.csv';
  a.click();
}

function exportMarkdown() {
  var proj = document.getElementById('projectName').value;
  var mod = document.getElementById('moduleName').value;
  var md = '# ' + proj + ' - ' + mod + ' 测试用例\n\n';
  md += '生成时间: ' + new Date().toLocaleString('zh-CN') + '\n';
  md += '共 ' + testCases.length + ' 条测试用例\n\n';
  md += '| 编号 | 用例名称 | 类型 | 优先级 | 前置条件 | 测试步骤 | 预期结果 |\n';
  md += '|------|---------|------|--------|---------|---------|----------|\n';
  testCases.forEach(function(tc, i) {
    md += '| TC-' + String(i+1).padStart(3,'0') + ' | ' + tc.name + ' | ' + tc.type + ' | ' + tc.priority + ' | ' + tc.precondition + ' | ' + tc.steps.replace(/\n/g, '<br>') + ' | ' + tc.expected + ' |\n';
  });

  document.getElementById('preview').textContent = md;
  document.getElementById('outputArea').style.display = 'block';
  var blob = new Blob([md], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'test-cases.md';
  a.click();
}

function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('preview').textContent).then(function() {
    alert('已复制到剪贴板');
  });
}

renderTable();
</script>
</body>
</html>
