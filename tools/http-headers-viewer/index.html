<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTTP Headers 查看器 | HTTP Headers Viewer</title>
<meta property="og:title" content="HTTP Headers 查看器 | HTTP Headers Viewer">
<meta property="og:description" content="在线查看网站HTTP响应头，分析安全配置">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线HTTP响应头查看器，分析网站安全配置和缓存策略">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<script src="i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.main{max-width:1000px;margin:0 auto;padding:20px 24px}
.card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:1rem;margin-bottom:12px;color:var(--text)}
.input-bar{display:flex;gap:8px}
.input-bar input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.9rem;outline:none;font-family:'Fira Code',Consolas,monospace}
.input-bar input:focus{border-color:var(--accent)}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.quick-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.header-table{width:100%;border-collapse:collapse;font-size:.8rem}
.header-table th{text-align:left;padding:10px 14px;color:var(--text-secondary);font-weight:500;border-bottom:2px solid var(--border);position:sticky;top:0;background:var(--bg-secondary)}
.header-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
.header-table tr:hover td{background:var(--bg-tertiary)}
.header-name{font-family:'Fira Code',Consolas,monospace;font-weight:600;color:var(--cyan);white-space:nowrap}
.header-value{font-family:'Fira Code',Consolas,monospace;word-break:break-all;color:var(--text)}
.security-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:600;margin-right:4px}
.secure{background:var(--green-bg);color:var(--green)}
.warning{background:rgba(210,153,29,.15);color:var(--orange)}
.danger{background:var(--red-bg);color:var(--red)}
.info{background:rgba(88,166,255,.15);color:var(--blue)}
.analysis{margin-top:16px;padding:16px;background:var(--bg);border-radius:var(--radius-sm)}
.analysis h3{font-size:.9rem;margin-bottom:10px;color:var(--text)}
.analysis-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)}
.analysis-item:last-child{border-bottom:none}
.empty-state{text-align:center;padding:40px;color:var(--text-secondary);font-size:.85rem}
.copy-btn{padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg-tertiary);color:var(--text-secondary);cursor:pointer;font-size:.75rem}
.copy-btn:hover{color:var(--accent);border-color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<header class="app-header">
<div>
<h1>📡 HTTP Headers 查看器</h1>
<span class="subtitle">查看网站 HTTP 响应头和安全配置</span>
</div>
<button class="btn" onclick="copyAll()">📋 复制全部</button>
</header>
<div class="main">
<div class="card">
<h2>输入 URL</h2>
<div class="input-bar">
<input id="url" placeholder="https://example.com" onkeydown="if(event.key==='Enter')fetchHeaders()">
<button class="btn btn-primary" id="fetchBtn" onclick="fetchHeaders()">获取</button>
</div>
<div class="quick-links">
<span style="font-size:.8rem;color:var(--text-secondary)">快速查询:</span>
<button class="btn" onclick="quickFetch('https://github.com')">GitHub</button>
<button class="btn" onclick="quickFetch('https://cloudflare.com')">Cloudflare</button>
<button class="btn" onclick="quickFetch('https://google.com')">Google</button>
<button class="btn" onclick="quickFetch('https://httpbin.org/get')">httpbin</button>
</div>
</div>
<div class="card" id="resultCard" style="display:none">
<h2>响应头 <span id="headerCount" style="font-weight:400;font-size:.8rem;color:var(--text-secondary)"></span></h2>
<div style="overflow-x:auto">
<table class="header-table" id="headerTable">
<thead><tr><th>Header</th><th>Value</th></tr></thead>
<tbody id="headerBody"></tbody>
</table>
</div>
<div class="analysis" id="analysis"></div>
</div>
<div class="empty-state" id="emptyState">输入 URL 并点击获取</div>
</div>

<script>
function quickFetch(url){
  document.getElementById('url').value=url;
  fetchHeaders();
}

async function fetchHeaders(){
  const url=document.getElementById('url').value.trim();
  if(!url){showToast('请输入 URL','error');return}

  const btn=document.getElementById('fetchBtn');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>获取中...';

  try{
    const resp=await fetch(url,{mode:'cors',cache:'no-store'});
    const headers={};
    resp.headers.forEach((v,k)=>{headers[k]=v});

    const headerCount=Object.keys(headers).length;
    document.getElementById('headerCount').textContent=`(${headerCount} 个)`;

    const tbody=document.getElementById('headerBody');
    tbody.innerHTML=Object.entries(headers).map(([k,v])=>`
      <tr>
        <td class="header-name">${esc(k)}</td>
        <td class="header-value">${esc(v)}</td>
      </tr>`).join('');

    document.getElementById('resultCard').style.display='block';
    document.getElementById('emptyState').style.display='none';

    analyzeHeaders(headers);
    showToast('获取成功','success');
  }catch(err){
    document.getElementById('headerCount').textContent='';
    document.getElementById('headerBody').innerHTML=`
      <tr><td colspan="2" style="color:var(--red);text-align:center;padding:20px">
        获取失败: ${esc(err.message)}<br>
        <span style="font-size:.75rem;color:var(--text-secondary)">可能存在 CORS 限制，建议使用浏览器开发者工具查看完整 Headers</span>
      </td></tr>`;
    document.getElementById('resultCard').style.display='block';
    document.getElementById('emptyState').style.display='none';
    document.getElementById('analysis').innerHTML='';
  }finally{
    btn.disabled=false;
    btn.innerHTML='获取';
  }
}

function analyzeHeaders(headers){
  const el=document.getElementById('analysis');
  const checks=[];

  const securityHeaders=[
    {name:'strict-transport-security',label:'HSTS',desc:'强制 HTTPS',good:true},
    {name:'x-content-type-options',label:'X-Content-Type-Options',desc:'防止 MIME 类型嗅探',good:true,expected:'nosniff'},
    {name:'x-frame-options',label:'X-Frame-Options',desc:'防止点击劫持',good:true},
    {name:'x-xss-protection',label:'X-XSS-Protection',desc:'XSS 过滤器',good:true},
    {name:'content-security-policy',label:'CSP',desc:'内容安全策略',good:true},
    {name:'referrer-policy',label:'Referrer-Policy',desc:'引用策略',good:true},
    {name:'permissions-policy',label:'Permissions-Policy',desc:'权限策略',good:true},
  ];

  securityHeaders.forEach(h=>{
    const val=Object.entries(headers).find(([k])=>k.toLowerCase()===h.name);
    if(val){
      checks.push(`<div class="analysis-item">
        <span class="security-badge secure">✓</span>
        <div><strong>${h.label}</strong>: ${esc(val[1])}<br><span style="font-size:.75rem;color:var(--text-secondary)">${h.desc}</span></div>
      </div>`);
    }else{
      checks.push(`<div class="analysis-item">
        <span class="security-badge danger">✗</span>
        <div><strong>${h.label}</strong>: 未设置<br><span style="font-size:.75rem;color:var(--text-secondary)">${h.desc} - 建议添加</span></div>
      </div>`);
    }
  });

  const cacheHeader=Object.entries(headers).find(([k])=>k.toLowerCase()==='cache-control');
  if(cacheHeader){
    checks.push(`<div class="analysis-item">
      <span class="security-badge info">ℹ</span>
      <div><strong>Cache-Control</strong>: ${esc(cacheHeader[1])}</div>
    </div>`);
  }

  const serverHeader=Object.entries(headers).find(([k])=>k.toLowerCase()==='server');
  if(serverHeader){
    checks.push(`<div class="analysis-item">
      <span class="security-badge warning">⚠</span>
      <div><strong>Server</strong>: ${esc(serverHeader[1])}<br><span style="font-size:.75rem;color:var(--text-secondary)">建议移除 Server 头以减少信息泄露</span></div>
    </div>`);
  }

  el.innerHTML=`<h3>安全分析</h3>${checks.join('')}`;
}

function copyAll(){
  const rows=document.querySelectorAll('#headerBody tr');
  let text='';
  rows.forEach(row=>{
    const cells=row.querySelectorAll('td');
    if(cells.length>=2) text+=cells[0].textContent+': '+cells[1].textContent+'\n';
  });
  navigator.clipboard.writeText(text).then(()=>showToast('已复制','success'));
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function showToast(msg,type='success'){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:.85rem;font-weight:500;z-index:99999;transition:opacity .3s;background:var(--green);color:#fff';
  if(type==='error')t.style.background='var(--red)';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2000);
}
</script>
</body>
</html>
