<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
header{background:linear-gradient(135deg,#1a0a00,#2a1505,#3d200a);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3010;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1200px;margin:0 auto;padding:20px}
.stats-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;justify-content:center}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;text-align:center}
.stat .num{font-size:1.3em;font-weight:bold;color:var(--accent)}
.stat .lbl{font-size:.72em;color:var(--text2)}
.tab-bar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.tab-btn{padding:8px 18px;border-radius:10px;border:2px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.88em;transition:all .2s;font-weight:500}
.tab-btn:hover,.tab-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,168,124,.1)}
.content-area{min-height:200px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.culture-card{background:var(--card);border-radius:14px;padding:20px;border:1px solid var(--border);transition:all .3s;cursor:pointer;position:relative;overflow:hidden}
.culture-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.culture-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.culture-card .c-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.culture-card .c-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4em;background:rgba(232,168,124,.15);flex-shrink:0}
.culture-card .c-name{font-size:1.15em;font-weight:bold}
.culture-card .c-sub{font-size:.75em;color:var(--text2)}
.culture-card .c-desc{font-size:.82em;color:var(--text2);line-height:1.6;margin-bottom:8px}
.culture-card .c-foods{display:flex;flex-wrap:wrap;gap:5px}
.culture-card .c-food{font-size:.72em;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text2)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:14px;padding:26px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;border:1px solid var(--border)}
.modal h2{font-size:1.4em;margin-bottom:10px}
.modal .close-btn{float:right;background:none;border:none;color:var(--text2);font-size:1.4em;cursor:pointer}
.modal p{font-size:.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.modal ul{list-style:none;padding:0}
.modal ul li{padding:5px 0;font-size:.83em;color:var(--text2);border-bottom:1px solid var(--border)}
.modal ul li::before{content:'• ';color:var(--accent)}
.quote-box{background:var(--card);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:16px 20px;margin-bottom:20px}
.quote-box .quote{font-size:1em;font-style:italic;color:var(--text);margin-bottom:4px}
.quote-box .author{font-size:.8em;color:var(--text2)}
footer{text-align:center;padding:30px;color:var(--text2);font-size:.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.card-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

<script>
const TABS=[
{name:"节日食俗",icon:"🎊",data:[
{name:"春节",en:"Spring Festival",icon:"🧧",desc:"春节是中国最重要的传统节日。年夜饭是一年中最重要的一餐，菜品讲究'年年有余'等吉祥寓意。",foods:["饺子（招财进宝）","年糕（年年高升）","鱼（年年有余）","春卷（黄金万两）","汤圆（团团圆圆）"],customs:["北方吃饺子，南方吃年糕","除夕夜要剩鱼，象征'年年有余'","正月初一不扫地，不倒垃圾","拜年要带伴手礼"],history:"春节饮食文化源远流长。饺子源于东汉张仲景的'娇耳'，年糕寓意'年年高升'。"},
{name:"元宵节",en:"Lantern Festival",icon:"🏮",desc:"正月十五元宵节，吃汤圆（南方）或元宵（北方），象征团团圆圆。赏花灯、猜灯谜是主要活动。",foods:["汤圆","元宵","灯笼糕","糖瓜"],customs:["吃汤圆象征团圆","赏花灯","猜灯谜","舞龙舞狮"],history:"元宵节吃汤圆的习俗始于宋代。汤圆和元宵的区别在于制作方法——汤圆是包的，元宵是滚的。"},
{name:"清明节",en:"Qingming Festival",icon:"🌿",desc:"清明节既是节气也是节日。扫墓祭祖、踏青郊游。饮食以清淡为主，吃青团、馓子等。",foods:["青团","馓子","清明果","茶叶蛋"],customs:["扫墓祭祖","踏青郊游","插柳戴柳","放风筝"],history:"清明节饮食源于寒食节。春秋时期介子推被烧死在绵山，晋文公下令禁火寒食以纪念。"},
{name:"端午节",en:"Dragon Boat Festival",icon:"🐉",desc:"五月初五端午节，吃粽子、赛龙舟。粽子有甜咸之分，是端午节最具代表性的食物。",foods:["粽子","雄黄酒","五黄","绿豆糕"],customs:["赛龙舟","吃粽子","挂艾草","佩香囊","饮雄黄酒"],history:"端午节源于纪念屈原。传说屈原投汨罗江后，人们用竹筒装米投入江中，后演变为吃粽子。"},
{name:"中秋节",en:"Mid-Autumn Festival",icon:"🥮",desc:"八月十五中秋节，吃月饼、赏月亮。月饼象征团圆，是中秋节最重要的节令食品。",foods:["月饼","桂花酒","芋头","田螺","柚子"],customs:["赏月","吃月饼","提灯笼","赏桂花","饮桂花酒"],history:"中秋节起源于唐代，盛行于宋代。月饼最早叫'胡饼'，唐玄宗与杨贵妃赏月时改名'月饼'。"},
{name:"冬至",en:"Winter Solstice",icon:"🥟",desc:"冬至是二十四节气之一，也是重要节日。北方吃饺子，南方吃汤圆，有'冬至大如年'的说法。",foods:["饺子","汤圆","羊肉汤","赤豆糯米饭"],customs:["北方吃饺子","南方吃汤圆","祭祖","数九"],history:"冬至吃饺子源于东汉医圣张仲景。他用面皮包裹驱寒药材和羊肉做成'娇耳'给穷人吃。"}
]},
{name:"饮食礼仪",icon:"🎎",data:[
{name:"座次礼仪",en:"Seating Protocol",icon:"💺",desc:"中餐宴请讲究座次。主座面向门口，主宾在主人右手边。座次体现对客人的尊重和主客关系。",foods:["主座面向门口","主宾在主人右手边","陪客依次排列","晚辈不坐主座"],customs:["主人先请客人入座","主人坐在背对门的位置","长辈先动筷","主人要照顾好每位客人"],history:"座次礼仪源于古代的礼制文化。'面门为尊'是中餐座次的基本原则。"},
{name:"敬酒礼仪",en:"Toasting Protocol",icon:"🥂",desc:"中餐宴请中敬酒是重要环节。晚辈敬长辈要双手举杯，杯沿要低于长辈。敬酒时要说祝福语。",foods:["晚辈杯沿低于长辈","敬酒要站起来","先敬主宾","酒量要适度"],customs:["敬酒要双手举杯","酒杯要低于对方","敬酒要说祝福语","不要强行劝酒"],history:"敬酒文化源于古代的祭祀仪式。'酒逢知己千杯少'体现了酒在中国社交中的重要地位。"},
{name:"筷子礼仪",en:"Chopstick Etiquette",icon:"🥢",desc:"筷子是中餐最独特的餐具。使用筷子有很多禁忌：不能插在饭里、不能敲碗、不能用筷子指人。",foods:["不能将筷子插在饭中","不能用筷子敲碗","不能用筷子指人","不能将筷子含在嘴里"],customs:["筷子要成双使用","夹菜时不要翻拣","不要将筷子竖插在饭里","不要用筷子指人"],history:"筷子已有3000多年历史。'箸'是筷子的古称。明代因避讳改为'筷'，取'快'谐音。"},
{name:"上菜顺序",en:"Serving Order",icon:"🍽️",desc:"中餐宴请的上菜顺序有讲究：先凉后热，先菜后汤，最后上主食和甜品。",foods:["先上凉菜","再上热菜","然后上汤","最后上主食和甜品"],customs:["凉菜先上，可边吃边聊","热菜按顺序依次上","汤在主菜之后","主食和甜品最后上"],history:"上菜顺序体现了中餐的'序'文化。先冷后热、先咸后甜的顺序符合味觉规律。"}
]},
{name:"饮食哲学",icon:"☯️",data:[
{name:"五味调和",en:"Five Flavors Harmony",icon:"👅",desc:"中餐讲究'五味调和'——酸、甜、苦、辣、咸五味平衡。不是单一味道突出，而是各种味道和谐统一。",foods:["酸：开胃消食","甜：提鲜增色","苦：清热解毒","辣：发汗驱寒","咸：定味提鲜"],customs:["味道要平衡","不能一味突出","讲究'和'的境界","因人因地调味"],history:"五味调和源于中国传统哲学中的'和'思想。《黄帝内经》将五味与五脏对应。"},
{name:"不时不食",en:"Eat Seasonally",icon:"🌸",desc:"孔子说'不时不食'——不吃不合时令的食物。中餐讲究顺时而食，吃当季最新鲜的食材。",foods:["春吃芽（香椿、豆苗）","夏吃瓜（西瓜、苦瓜）","秋吃果（栗子、柿子）","冬吃根（萝卜、山药）"],customs:["吃当季食材","不食反季节食物","注重时令变化","顺应自然规律"],history:"不时不食是儒家饮食思想的重要内容。二十四节气指导着中国人的饮食生活。"},
{name:"药食同源",en:"Food as Medicine",icon:"💊",desc:"中医认为食物和药物同源。许多食材既是食物也是药材。食疗是中国独特的养生方式。",foods:["生姜：温中散寒","红枣：补气养血","枸杞：明目养肝","山药：健脾益胃","莲子：养心安神"],customs:["日常饮食注意养生","不同体质吃不同食物","药膳结合","食疗优于药疗"],history:"药食同源思想源于《黄帝内经》。'药补不如食补'是中国人普遍的养生观念。"},
{name:"色香味形",en:"Color Aroma Taste Form",icon:"🎨",desc:"中餐讲究'色香味形'俱全。好的菜肴要做到色泽诱人、香气扑鼻、味道鲜美、造型美观。",foods:["色：色泽搭配","香：香气扑鼻","味：味道鲜美","形：造型美观"],customs:["菜品要色香味形俱全","摆盘要美观","讲究视觉享受","美食也要好看"],history:"色香味形是中餐审美的最高标准。宋代开始，中餐就非常注重菜品的外观呈现。"},
{name:"医食同源",en:"Medicine Food Unity",icon:"🏥",desc:"中医认为'药食同源'，食物可以防病治病。'药补不如食补'是中国人普遍的养生观念。",foods:["生姜：温中散寒","红枣：补气养血","枸杞：明目养肝","山药：健脾益胃","莲子：养心安神"],customs:["日常饮食注意养生","不同体质吃不同食物","药膳结合","食疗优于药疗"],history:"药食同源思想源于《黄帝内经》。'上医治未病'的理念深入人心。"}
]},
{name:"地域饮食",icon:"🗺️",data:[
{name:"四川饮食",en:"Sichuan Cuisine Culture",icon:"🌶️",desc:"四川人爱吃辣，'四川人不怕辣'。川菜以麻辣著称，火锅文化深入人心。成都被联合国教科文组织评为'美食之都'。",foods:["火锅","串串香","冒菜","兔头","钵钵鸡"],customs:["无辣不欢","火锅社交文化","喝茶文化","夜宵文化"],history:"四川饮食文化源远流长。'天府之国'物产丰富，为川菜的发展提供了物质基础。"},
{name:"广东饮食",en:"Cantonese Food Culture",icon:"🦐",desc:"广东人'什么都吃'，'食在广州'名不虚传。粤菜讲究清淡鲜美，早茶文化独具特色。",foods:["早茶","烧味","老火汤","煲仔饭","糖水"],customs:["喝早茶","煲汤文化","宵夜文化","讲究食材新鲜"],history:"广州是海上丝绸之路的起点，对外交流频繁，粤菜吸收了大量外来烹饪技法。"},
{name:"江浙饮食",en:"Jiangsu-Zhejiang Cuisine",icon:"🍜",desc:"江浙菜精致典雅，讲究刀工和火候。'上有天堂，下有苏杭'，江浙饮食文化细腻温婉。",foods:["东坡肉","西湖醋鱼","龙井虾仁","蟹粉小笼"],customs:["讲究时令","注重刀工","文人菜","品茶文化"],history:"江浙地区经济文化发达，文人雅士众多，饮食文化深受文人审美影响。"},
{name:"西北饮食",en:"Northwest Food Culture",icon:"🐑",desc:"西北地区以牛羊肉为主，面食种类丰富。'羊肉泡馍''兰州拉面'是西北饮食的代表。",foods:["羊肉泡馍","兰州拉面","大盘鸡","手抓羊肉"],customs:["面食文化","清真饮食","游牧文化","豪放饮食"],history:"西北地区是古丝绸之路的重要通道，饮食文化融合了中原和西域的特色。"}
]}
];
let currentTab=0;
function renderTabs(){
  document.getElementById('tabBar').innerHTML=TABS.map((t,i)=>`
    <button class="tab-btn ${i===currentTab?'active':''}" onclick="switchTab(${i})">${t.icon} ${t.name}</button>`).join('');
}
function renderContent(){
  const tab=TABS[currentTab];
  document.getElementById('contentArea').innerHTML=`
    <div class="card-grid">${tab.data.map((item,i)=>`
      <div class="culture-card" onclick="showDetail(${currentTab},${i})">
        <div class="c-head"><div class="c-icon">${item.icon}</div><div><div class="c-name">${item.name}</div><div class="c-sub">${item.en}</div></div></div>
        <div class="c-desc">${item.desc.substring(0,60)}...</div>
        <div class="c-foods">${item.foods.slice(0,3).map(f=>`<span class="c-food">${f.split('（')[0]}</span>`).join('')}</div>
      </div>`).join('')}</div>`;
}
function showDetail(tabIdx,itemIdx){
  const item=TABS[tabIdx].data[itemIdx];
  document.getElementById('modalContent').innerHTML=`
    <h2>${item.icon} ${item.name} <span style="font-size:.5em;color:var(--text2)">${item.en}</span></h2>
    <p>${item.desc}</p>
    <p><strong>相关食物/元素：</strong></p><ul>${item.foods.map(f=>`<li>${f}</li>`).join('')}</ul>
    <p><strong>习俗/特点：</strong></p><ul>${item.customs.map(c=>`<li>${c}</li>`).join('')}</ul>
    <p><strong>📖 历史渊源：</strong>${item.history}</p>`;
  document.getElementById('modal').classList.add('show');
}
function switchTab(idx){currentTab=idx;renderTabs();renderContent()}
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('show')};
renderTabs();renderContent();
</script>
</body>
</html>
