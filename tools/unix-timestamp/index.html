<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unix时间戳转换</title><meta name="description" content="Unix时间戳转换 - 时间戳与日期互转"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏰</text></svg>"><meta name="robots" content="index, follow"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:700px;margin:auto}h1{text-align:center;padding:20px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}input[type=text]{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:monospace;font-size:1.1rem;outline:none;text-align:center}input:focus{border-color:var(--blue)}.now-ts{text-align:center;font-size:2rem;font-weight:700;color:var(--blue);margin:12px 0;font-family:monospace}.result{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px}.result-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem}.result-row:last-child{border-bottom:none}.result-row .label{color:var(--text2)}.result-row .value{font-weight:500;font-family:monospace;cursor:pointer}.result-row .value:hover{color:var(--blue)}.btn{display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.btn-row{display:flex;gap:8px;flex-wrap:wrap}.tab-row{display:flex;gap:4px;margin-bottom:16px}.tab{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.85rem}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style>
<meta property="og:title" content="Unix时间戳转换">
<meta property="og:description" content="Unix时间戳转换 - 时间戳与日期互转">
<meta property="og:image" content="/og-default.png">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>⏰ Unix时间戳转换</h1><p class="sub">时间戳 ↔ 日期时间互转</p>
<div class="tab-row"><div class="tab active" onclick="switchTab(0)">当前时间戳</div><div class="tab" onclick="switchTab(1)">时间戳→日期</div><div class="tab" onclick="switchTab(2)">日期→时间戳</div></div>
<div id="tab0" class="card"><div class="label" style="text-align:center;color:var(--text2);font-size:.85rem">当前 Unix 时间戳</div><div class="now-ts" id="nowTs"></div><div style="text-align:center;color:var(--text2);font-size:.8rem" id="nowDate"></div><div class="btn-row" style="justify-content:center;margin-top:12px"><button class="btn" onclick="copyTs()">📋 复制</button></div></div>
<div id="tab1" class="card" style="display:none"><input type="text" id="tsInput" placeholder="输入Unix时间戳 (秒或毫秒)" oninput="tsToDate()"><div class="btn-row"><button class="btn" onclick="document.getElementById('tsInput').value=Math.floor(Date.now()/1000);tsToDate()">当前时间戳</button><button class="btn" onclick="document.getElementById('tsInput').value=Date.now();tsToDate()">当前毫秒</button></div><div id="tsResult"></div></div>
<div id="tab2" class="card" style="display:none"><input type="text" id="dateInput" placeholder="输入日期 如 2024-01-15 12:00:00" oninput="dateToTs()"><div class="btn-row"><button class="btn" onclick="document.getElementById('dateInput').value=new Date().toLocaleString('sv-SE');dateToTs()">当前时间</button></div><div id="dateResult"></div></div></div>
<script src="../i18n.js" defer></script>
<script>
function switchTab(i){document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('active',j===i)});[0,1,2].forEach(function(j){document.getElementById('tab'+j).style.display=j===i?'block':'none'});}
function updateNow(){var ts=Math.floor(Date.now()/1000);document.getElementById('nowTs').textContent=ts;document.getElementById('nowDate').textContent=new Date().toLocaleString('zh-CN');}
function copyTs(){navigator.clipboard.writeText(document.getElementById('nowTs').textContent).then(function(){garyyToast('已复制','success')}).catch(function(){});}
function tsToDate(){var v=document.getElementById('tsInput').value.trim();if(!v||isNaN(v)){document.getElementById('tsResult').innerHTML='';return;}var ts=parseInt(v);if(ts<1e12)ts*=1000;var d=new Date(ts);if(isNaN(d.getTime())){document.getElementById('tsResult').innerHTML='<div style="color:var(--red);margin-top:12px">无效时间戳</div>';return;}var r=document.getElementById('tsResult');r.innerHTML='<div class="result"><div class="result-row"><span class="label">本地时间</span><span class="value" onclick="copy(\''+d.toLocaleString('zh-CN')+'\')">'+d.toLocaleString('zh-CN')+'</span></div><div class="result-row"><span class="label">ISO 8601</span><span class="value" onclick="copy(\''+d.toISOString()+'\')">'+d.toISOString()+'</span></div><div class="result-row"><span class="label">UTC</span><span class="value" onclick="copy(\''+d.toUTCString()+'\')">'+d.toUTCString()+'</span></div><div class="result-row"><span class="label">秒级时间戳</span><span class="value" onclick="copy(\''+Math.floor(ts/1000)+'\')">'+Math.floor(ts/1000)+'</span></div><div class="result-row"><span class="label">毫秒时间戳</span><span class="value" onclick="copy(\''+ts+'\')">'+ts+'</span></div></div>';}
function dateToTs(){var v=document.getElementById('dateInput').value.trim();if(!v){document.getElementById('dateResult').innerHTML='';return;}var d=new Date(v);if(isNaN(d.getTime())){document.getElementById('dateResult').innerHTML='<div style="color:var(--red);margin-top:12px">无效日期格式</div>';return;}var ts=Math.floor(d.getTime()/1000);var r=document.getElementById('dateResult');r.innerHTML='<div class="result"><div class="result-row"><span class="label">秒级时间戳</span><span class="value" onclick="copy(\''+ts+'\')">'+ts+'</span></div><div class="result-row"><span class="label">毫秒时间戳</span><span class="value" onclick="copy(\''+d.getTime()+'\')">'+d.getTime()+'</span></div><div class="result-row"><span class="label">ISO 8601</span><span class="value" onclick="copy(\''+d.toISOString()+'\')">'+d.toISOString()+'</span></div><div class="result-row"><span class="label">星期</span><span class="value">星期'+['日','一','二','三','四','五','六'][d.getDay()]+'</span></div></div>';}
function copy(s){navigator.clipboard.writeText(s).then(function(){garyyToast('已复制: '+s.substring(0,30),'success')}).catch(function(){});}
setInterval(updateNow,1000);updateNow();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
