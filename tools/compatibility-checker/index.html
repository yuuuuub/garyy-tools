<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兼容性检查 - 兼容性检查器</title>
<meta name="description" content="配对兼容性检查工具，分析两个人的性格匹配度">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#238636;--red:#da3633;--yellow:#9e6a03;--dim:#8b949e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--dim);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
.input-group{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
input,select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:14px;flex:1;min-width:200px}
textarea{width:100%;min-height:80px;resize:vertical;font-family:monospace}
button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px 20px;font-size:14px;cursor:pointer;font-weight:600;transition:opacity .2s}
button:hover{opacity:.85}
select{cursor:pointer;min-width:150px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase}
.support-full{color:var(--green)}
.support-partial{color:var(--yellow)}
.support-none{color:var(--red)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-full{background:#23863633;color:var(--green)}
.badge-partial{background:#9e6a0333;color:var(--yellow)}
.badge-none{background:#da363333;color:var(--red)}
.results{display:none}
.no-result{text-align:center;color:var(--dim);padding:20px}
.feature-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.feature-tag{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:12px;cursor:pointer;transition:border-color .2s}
.feature-tag:hover{border-color:var(--accent)}
.feature-tag.active{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:600px){.input-group{flex-direction:column}th,td{padding:8px 6px;font-size:12px}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div class="container">
<h1>🔍 兼容性检查器</h1>
<p class="subtitle">检查 CSS/JS 特性在各浏览器中的支持情况</p>

<div class="card">
<h2 style="margin-bottom:12px">查询模式</h2>
<div class="input-group">
<select id="mode">
<option value="css">CSS 属性</option>
<option value="js">JavaScript API</option>
</select>
</div>
<h3 style="margin-bottom:8px;color:var(--dim)">快速选择</h3>
<div class="feature-list" id="quickList"></div>
</div>

<div class="card">
<h2 style="margin-bottom:12px">自定义输入</h2>
<div class="input-group">
<input type="text" id="featureInput" placeholder="输入特性名称，如: container-query, async-await, grid, AbortController">
<button onclick="checkFeature()">检查</button>
</div>
</div>

<div class="results" id="results">
<div class="card">
<h2 id="resultTitle" style="margin-bottom:4px"></h2>
<p id="resultDesc" style="color:var(--dim);font-size:13px;margin-bottom:12px"></p>
<table>
<thead><tr><th>浏览器</th><th>版本</th><th>支持情况</th><th>前缀</th><th>备注</th></tr></thead>
<tbody id="compatTable"></tbody>
</table>
</div>
</div>

<div class="no-result" id="noResult">选择或输入一个特性开始检查</div>
</div>

<script>
const cssFeatures={
'container-query':{name:'容器查询',desc:'根据父容器尺寸响应式布局',chrome:{ver:'105',s:1,prefix:'',note:'基本支持'},firefox:{ver:'110',s:1,prefix:'',note:''},safari:{ver:'16',s:1,prefix:'',note:''},edge:{ver:'105',s:1,prefix:'',note:''}},
'grid':{name:'CSS Grid 布局',desc:'二维布局系统',chrome:{ver:'57',s:1,prefix:'',note:''},firefox:{ver:'52',s:1,prefix:'',note:''},safari:{ver:'10.1',s:1,prefix:'',note:''},edge:{ver:'16',s:1,prefix:'',note:''}},
'flexbox':{name:'Flexbox 布局',desc:'弹性盒布局模型',chrome:{ver:'29',s:1,prefix:'',note:''},firefox:{ver:'28',s:1,prefix:'',note:''},safari:{ver:'9',s:1,prefix:'-webkit-',note:''},edge:{ver:'12',s:1,prefix:'',note:''}},
'has-selector':{name:':has() 选择器',desc:'父元素选择器',chrome:{ver:'105',s:1,prefix:'',note:''},firefox:{ver:'121',s:1,prefix:'',note:''},safari:{ver:'15.4',s:1,prefix:'',note:''},edge:{ver:'105',s:1,prefix:'',note:''}},
'view-transitions':{name:'视图过渡',desc:'页面间平滑过渡动画',chrome:{ver:'111',s:1,prefix:'',note:''},firefox:{ver:'N/A',s:0,prefix:'',note:'不支持'},safari:{ver:'18',s:0.5,prefix:'',note:'部分支持'},edge:{ver:'111',s:1,prefix:'',note:''}},
'anchor-positioning':{name:'锚点定位',desc:'基于锚点元素定位',chrome:{ver:'125',s:1,prefix:'',note:''},firefox:{ver:'N/A',s:0,prefix:'',note:'不支持'},safari:{ver:'N/A',s:0,prefix:'',note:'不支持'},edge:{ver:'125',s:1,prefix:'',note:''}},
'scroll-driven-animations':{name:'滚动驱动动画',desc:'基于滚动位置的动画',chrome:{ver:'115',s:1,prefix:'',note:''},firefox:{ver:'N/A',s:0,prefix:'',note:'不支持'},safari:{ver:'N/A',s:0,prefix:'',note:'不支持'},edge:{ver:'115',s:1,prefix:'',note:''}},
'nesting':{name:'CSS 嵌套',desc:'原生 CSS 嵌套语法',chrome:{ver:'120',s:1,prefix:'',note:''},firefox:{ver:'117',s:1,prefix:'',note:''},safari:{ver:'17.2',s:1,prefix:'',note:''},edge:{ver:'120',s:1,prefix:'',note:''}},
'color-mix':{name:'color-mix()',desc:'颜色混合函数',chrome:{ver:'111',s:1,prefix:'',note:''},firefox:{ver:'113',s:1,prefix:'',note:''},safari:{ver:'16.2',s:1,prefix:'',note:''},edge:{ver:'111',s:1,prefix:'',note:''}},
'@layer':{name:'@layer 规则',desc:'CSS 层叠层控制',chrome:{ver:'99',s:1,prefix:'',note:''},firefox:{ver:'97',s:1,prefix:'',note:''},safari:{ver:'15.4',s:1,prefix:'',note:''},edge:{ver:'99',s:1,prefix:'',note:''}},
'text-wrap-balance':{name:'text-wrap: balance',desc:'标题文本平衡换行',chrome:{ver:'114',s:1,prefix:'',note:''},firefox:{ver:'N/A',s:0,prefix:'',note:'不支持'},safari:{ver:'17.5',s:1,prefix:'',note:''},edge:{ver:'114',s:1,prefix:'',note:''}},
'subgrid':{name:'CSS Subgrid',desc:'子网格对齐',chrome:{ver:'117',s:1,prefix:'',note:''},firefox:{ver:'71',s:1,prefix:'',note:'最早支持'},safari:{ver:'N/A',s:0,prefix:'',note:'不支持'},edge:{ver:'117',s:1,prefix:'',note:''}}
};
const jsFeatures={
'async-await':{name:'async/await',desc:'异步函数语法',chrome:{ver:'55',s:1,prefix:'',note:''},firefox:{ver:'52',s:1,prefix:'',note:''},safari:{ver:'10.1',s:1,prefix:'',note:''},edge:{ver:'15',s:1,prefix:'',note:''}},
'abort-controller':{name:'AbortController',desc:'取消 fetch 请求',chrome:{ver:'66',s:1,prefix:'',note:''},firefox:{ver:'57',s:1,prefix:'',note:''},safari:{ver:'12.1',s:1,prefix:'',note:''},edge:{ver:'16',s:1,prefix:'',note:''}},
'intersection-observer':{name:'IntersectionObserver',desc:'元素可见性检测',chrome:{ver:'51',s:1,prefix:'',note:''},firefox:{ver:'55',s:1,prefix:'',note:''},safari:{ver:'12.1',s:1,prefix:'',note:''},edge:{ver:'15',s:1,prefix:'',note:''}},
'web-workers':{name:'Web Workers',desc:'后台线程执行',chrome:{ver:'4',s:1,prefix:'',note:''},firefox:{ver:'3.5',s:1,prefix:'',note:''},safari:{ver:'4',s:1,prefix:'',note:''},edge:{ver:'12',s:1,prefix:'',note:''}},
'shared-memory':{name:'SharedArrayBuffer',desc:'多线程共享内存',chrome:{ver:'68',s:1,prefix:'',note:'需要COOP/COEP头'},firefox:{ver:'79',s:1,prefix:'',note:'需要COOP/COEP头'},safari:{ver:'15.2',s:1,prefix:'',note:''},edge:{ver:'79',s:1,prefix:'',note:''}},
'optional-chaining':{name:'可选链 ?.',desc:'安全访问嵌套属性',chrome:{ver:'80',s:1,prefix:'',note:''},firefox:{ver:'72',s:1,prefix:'',note:''},safari:{ver:'13.1',s:1,prefix:'',note:''},edge:{ver:'80',s:1,prefix:'',note:''}},
'nullish-coalescing':{name:'空值合并 ??',desc:'null/undefined 默认值',chrome:{ver:'80',s:1,prefix:'',note:''},firefox:{ver:'72',s:1,prefix:'',note:''},safari:{ver:'13.1',s:1,prefix:'',note:''},edge:{ver:'80',s:1,prefix:'',note:''}},
'top-level-await':{name:'顶层 await',desc:'模块顶层直接使用 await',chrome:{ver:'89',s:1,prefix:'',note:''},firefox:{ver:'89',s:1,prefix:'',note:''},safari:{ver:'15',s:1,prefix:'',note:''},edge:{ver:'89',s:1,prefix:'',note:''}},
'structured-clone':{name:'structuredClone()',desc:'深拷贝结构化可克隆对象',chrome:{ver:'98',s:1,prefix:'',note:''},firefox:{ver:'94',s:1,prefix:'',note:''},safari:{ver:'15.4',s:1,prefix:'',note:''},edge:{ver:'98',s:1,prefix:'',note:''}},
'import-maps':{name:'Import Maps',desc:'ES模块导入路径映射',chrome:{ver:'89',s:1,prefix:'',note:''},firefox:{ver:'108',s:1,prefix:'',note:''},safari:{ver:'16.4',s:1,prefix:'',note:''},edge:{ver:'89',s:1,prefix:'',note:''}},
'view-transitions-api':{name:'View Transitions API',desc:'视图过渡动画 API',chrome:{ver:'111',s:1,prefix:'',note:''},firefox:{ver:'N/A',s:0,prefix:'',note:'不支持'},safari:{ver:'18',s:0.5,prefix:'',note:'部分支持'},edge:{ver:'111',s:1,prefix:''}},
'navigation-api':{name:'Navigation API',desc:'现代页面导航管理',chrome:{ver:'102',s:1,prefix:'',note:''},firefox:{ver:'N/A',s:0,prefix:'',note:'不支持'},safari:{ver:'N/A',s:0,prefix:'',note:'不支持'},edge:{ver:'102',s:1,prefix:''}}
};
let currentMode='css';
const modeSelect=document.getElementById('mode');
const featureInput=document.getElementById('featureInput');
const quickList=document.getElementById('quickList');
function renderQuickList(){
const features=currentMode==='css'?cssFeatures:jsFeatures;
quickList.innerHTML='';
Object.keys(features).forEach(key=>{
const f=features[key];
const tag=document.createElement('span');
tag.className='feature-tag';
tag.textContent=f.name;
tag.onclick=()=>{featureInput.value=key;checkFeature();};
quickList.appendChild(tag);
});
}
modeSelect.onchange=()=>{currentMode=modeSelect.value;renderQuickList();document.getElementById('results').style.display='none';document.getElementById('noResult').style.display='block';};
function supportText(s){
if(s>=1)return['完全支持','badge-full'];
if(s>=0.5)return['部分支持','badge-partial'];
return['不支持','badge-none'];
}
function checkFeature(){
const key=featureInput.value.trim().toLowerCase().replace(/\s+/g,'-');
const features=currentMode==='css'?cssFeatures:jsFeatures;
const feat=features[key];
if(!feat){
alert('未找到该特性，试试快速选择中的选项，或检查输入。');
return;
}
document.getElementById('noResult').style.display='none';
document.getElementById('results').style.display='block';
document.getElementById('resultTitle').textContent=`${feat.name} — 浏览器兼容性`;
document.getElementById('resultDesc').textContent=feat.desc;
const browsers=['chrome','firefox','safari','edge'];
const names={chrome:'Chrome',firefox:'Firefox',safari:'Safari',edge:'Edge'};
let html='';
browsers.forEach(b=>{
const d=feat[b];
const[st,bc]=supportText(d.s);
const cl=d.s>=1?'support-full':d.s>=0.5?'support-support-partial':'support-none';
html+=`<tr><td><strong>${names[b]}</strong></td><td>${d.ver}</td><td><span class="badge ${bc}">${st}</span></td><td>${d.prefix||'—'}</td><td>${d.note||''}</td></tr>`;
});
document.getElementById('compatTable').innerHTML=html;
}
renderQuickList();
</script>
<script src="../i18n.js"></script>
</body>
</html>
