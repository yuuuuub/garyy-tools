<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 每日总消耗计算器 (TDEE)</title>
<meta property="og:title" content="🔥 每日总消耗计算器 (TDEE)">
<meta property="og:description" content="🔥 每日总消耗计算器 (TDEE) - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线TDEE每日总能量消耗计算器，计算维持、增肌、减脂所需热量">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.gender-tabs{display:flex;gap:8px;margin-bottom:12px}
.gender-tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:14px;cursor:pointer;text-align:center;transition:all .2s;font-weight:600}
.gender-tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-group label{font-size:12px;color:var(--text-secondary);font-weight:500}
.input-group input,.input-group select{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;transition:all .2s}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--accent)}
.calc-btn{width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.calc-btn:hover{background:var(--accent-hover)}
.result-main{background:var(--tag-bg);border-radius:12px;padding:20px;text-align:center;margin-top:12px}
.result-val{font-size:48px;font-weight:800;color:var(--accent)}
.result-unit{font-size:14px;color:var(--text-secondary)}
.goal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.goal-item{background:var(--card-bg);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--border);transition:all .2s}
.goal-item:hover{border-color:var(--accent)}
.goal-item .emoji{font-size:24px;margin-bottom:4px}
.goal-item .label{font-size:12px;color:var(--text-secondary)}
.goal-item .val{font-size:18px;font-weight:700;color:var(--accent);margin-top:2px}
.goal-item .diff{font-size:11px;color:var(--text-secondary)}
.macro-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.macro-table th{background:var(--accent);color:#fff;padding:10px;text-align:center;font-weight:600}
.macro-table td{padding:10px;text-align:center;border-bottom:1px solid var(--border)}
.macro-table tr.highlight{background:var(--tag-bg);font-weight:600}
.tip{font-size:12px;color:var(--text-secondary);margin-top:12px;line-height:1.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🔥 每日总消耗 (TDEE)</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">👤 基本信息</div>
<div class="gender-tabs">
<div class="gender-tab active" onclick="setGender('male',this)">👨 男性</div>
<div class="gender-tab" onclick="setGender('female',this)">👩 女性</div>
</div>
<div class="input-row">
<div class="input-group">
<label>年龄（岁）</label>
<input type="number" id="age" placeholder="25" min="10" max="100">
</div>
<div class="input-group">
<label>身高（cm）</label>
<input type="number" id="height" placeholder="170" min="100" max="220">
</div>
</div>
<div class="input-row">
<div class="input-group">
<label>体重（kg）</label>
<input type="number" id="weight" placeholder="65" min="20" max="250">
</div>
<div class="input-group">
<label>活动水平</label>
<select id="activity">
<option value="1.2">久坐不动 (办公室)</option>
<option value="1.375">轻度运动 (1-3天/周)</option>
<option value="1.55" selected>中度运动 (3-5天/周)</option>
<option value="1.725">重度运动 (6-7天/周)</option>
<option value="1.9">专业运动员</option>
</select>
</div>
</div>
<button class="calc-btn" onclick="calculate()">🔥 计算TDEE</button>
</div>
<div class="card" id="resultCard" style="display:none">
<div class="card-title">📊 TDEE结果</div>
<div class="result-main">
<div class="result-val" id="tdeeVal">--</div>
<div class="result-unit">每日总消耗 (千卡/天)</div>
</div>
<div class="goal-grid" id="goalGrid"></div>
</div>
<div class="card" id="macroCard" style="display:none">
<div class="card-title">🍽️ 宏量营养素分配参考</div>
<table class="macro-table" id="macroTable"></table>
</div>
<div class="card">
<div class="card-title">ℹ️ 说明</div>
<div class="tip">
• TDEE = BMR × 活动系数<br>
• 减脂：每日减少 300-500 千卡，每周减重 0.3-0.5kg<br>
• 增肌：每日增加 200-300 千卡，配合力量训练<br>
• 宏量营养素比例仅为一般建议，个体差异较大
</div>
</div>
<div class="footer">Gary's Tools · TDEE仅供参考</div>
</div>
<script>
let currentGender='male';
function setGender(g,el){
currentGender=g;
document.querySelectorAll('.gender-tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
}
function calculate(){
const age=parseFloat(document.getElementById('age').value);
const h=parseFloat(document.getElementById('height').value);
const w=parseFloat(document.getElementById('weight').value);
const act=parseFloat(document.getElementById('activity').value);
if(!age||!h||!w){alert('请填写完整信息');return}
let bmr;
if(currentGender==='male'){bmr=10*w+6.25*h-5*age+5;}
else{bmr=10*w+6.25*h-5*age-161;}
const tdee=Math.round(bmr*act);
document.getElementById('tdeeVal').textContent=tdee;
const maintain=tdee;
const mildLoss=tdee-250;
const loss=tdee-500;
const mildGain=tdee+200;
const gain=tdee+350;
document.getElementById('goalGrid').innerHTML=`
<div class="goal-item"><div class="emoji">📉</div><div class="label">快速减脂</div><div class="val">${loss}</div><div class="diff">-500 千卡</div></div>
<div class="goal-item"><div class="emoji">⚖️</div><div class="label">温和减脂</div><div class="val">${mildLoss}</div><div class="diff">-250 千卡</div></div>
<div class="goal-item"><div class="emoji">维持</div><div class="label">维持体重</div><div class="val">${maintain}</div><div class="diff">当前TDEE</div></div>
<div class="goal-item"><div class="emoji">📈</div><div class="label">温和增肌</div><div class="val">${mildGain}</div><div class="diff">+200 千卡</div></div>
<div class="goal-item"><div class="emoji">💪</div><div class="label">快速增肌</div><div class="val">${gain}</div><div class="diff">+350 千卡</div></div>
`;
const macros=[
{label:'减脂',cal:loss,protein:Math.round(w*2.2),fat:Math.round(loss*0.25/9),carb:Math.round((loss-loss*0.25-w*2.2*4)/4)},
{label:'维持',cal:maintain,protein:Math.round(w*1.6),fat:Math.round(maintain*0.3/9),carb:Math.round((maintain-maintain*0.3-w*1.6*4)/4)},
{label:'增肌',cal:gain,protein:Math.round(w*2),fat:Math.round(gain*0.3/9),carb:Math.round((gain-gain*0.3-w*2*4)/4)}
];
let macroHtml='<tr><th>目标</th><th>热量</th><th>蛋白质</th><th>脂肪</th><th>碳水</th></tr>';
macros.forEach((m,i)=>{
macroHtml+=`<tr class="${i===1?'highlight':''}"><td>${m.label}</td><td>${m.cal} 千卡</td><td>${m.protein}g</td><td>${m.fat}g</td><td>${m.carb}g</td></tr>`;
});
document.getElementById('macroTable').innerHTML=macroHtml;
document.getElementById('resultCard').style.display='block';
document.getElementById('macroCard').style.display='block';
}
function toggleTheme(){
const html=document.documentElement;
const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
html.setAttribute('data-theme',next);
document.querySelector('.theme-toggle').textContent=next==='dark'?'☀️':'🌙';
}
</script>
</body>
</html>
