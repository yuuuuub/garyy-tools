<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😊 心情日记</title>
<meta name="description" content="记录每日心情和感受，了解自己的情绪变化">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:20px}
.ctn{max-width:600px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mood-selector{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mood-btn{width:56px;height:56px;border-radius:50%;border:3px solid var(--border);background:var(--bg);font-size:1.8rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.mood-btn:hover{transform:scale(1.1)}
.mood-btn.selected{border-color:var(--accent);box-shadow:0 0 12px rgba(59,130,246,.3);transform:scale(1.15)}
.st{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.st>div{text-align:center;padding:10px 4px;background:var(--bg);border-radius:8px}
.st .nm{font-size:1.2rem;font-weight:700}
.st .lb{font-size:.65rem;color:var(--text2);margin-top:2px}
.li{padding:14px;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:none}
.li .date{font-size:.8rem;color:var(--text2)}
.li .mood-emoji{font-size:1.5rem;margin-right:8px}
.li .note{font-size:.9rem;margin-top:6px;color:var(--text2);white-space:pre-wrap}
.li .tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.li .tag{padding:2px 8px;border-radius:12px;font-size:.7rem;background:var(--accent)}
.empty{color:var(--text2);text-align:center;padding:20px}
.chart{display:flex;gap:3px;align-items:flex-end;height:80px;padding:0 4px;margin-top:8px}
.chart-bar{flex:1;border-radius:3px 3px 0 0;transition:height .3s;position:relative}
.chart-bar::after{content:attr(data-label);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--text2);white-space:nowrap}
.week-grid{display:flex;gap:4px;justify-content:center;margin-top:8px}
.week-cell{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="😊 心情日记">
<meta property="og:description" content="记录每日心情和感受，了解自己的情绪变化">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>😊 心情日记</h1><p>记录心情，了解自己</p></div>

<div class="cd" id="statsCard"></div>

<div class="cd"><h2>记录心情</h2>
<div class="mood-selector" id="moodSel">
  <button class="mood-btn" data-mood="5" onclick="selectMood(5,this)">😄</button>
  <button class="mood-btn" data-mood="4" onclick="selectMood(4,this)">😊</button>
  <button class="mood-btn" data-mood="3" onclick="selectMood(3,this)">😐</button>
  <button class="mood-btn" data-mood="2" onclick="selectMood(2,this)">😢</button>
  <button class="mood-btn" data-mood="1" onclick="selectMood(1,this)">😡</button>
</div>
<label>今日感想</label><textarea id="mNote" placeholder="今天发生了什么？心情如何？"></textarea>
<label>标签 (逗号分隔)</label><input type="text" id="mTags" placeholder="如：工作, 运动, 朋友">
<label>日期</label><input type="date" id="mDate">
<div class="bg"><button onclick="addEntry()">保存心情</button></div></div>

<div class="cd"><h2>最近心情曲线</h2><div class="chart" id="moodChart"></div><div class="week-grid" id="weekGrid"></div></div>

<div class="cd"><h2>心情记录</h2><div id="entryList" class="empty">暂无记录</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let entries = JSON.parse(localStorage.getItem('mj_entries') || '[]');
let selectedMood = 0;
const moodEmoji = { 5: '😄', 4: '😊', 3: '😐', 2: '😢', 1: '😡' };
const moodLabel = { 5: '开心', 4: '愉快', 3: '平静', 2: '难过', 1: '生气' };
const moodColor = { 5: '#22c55e', 4: '#3b82f6', 3: '#f59e0b', 2: '#8b5cf6', 1: '#ef4444' };

function save() { localStorage.setItem('mj_entries', JSON.stringify(entries)); }

function selectMood(m, el) {
  selectedMood = m;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

function addEntry() {
  if (!selectedMood) { alert('请选择心情'); return; }
  entries.push({
    id: Date.now(), mood: selectedMood,
    note: $('mNote').value.trim(),
    tags: $('mTags').value.split(',').map(t => t.trim()).filter(Boolean),
    date: $('mDate').value || new Date().toISOString().slice(0, 10)
  });
  save(); render(); selectedMood = 0;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  $('mNote').value = ''; $('mTags').value = '';
}

function deleteEntry(id) {
  entries = entries.filter(x => x.id !== id);
  save(); render();
}

function render() {
  const moodCounts = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
  entries.forEach(e => moodCounts[e.mood]++);
  const total = entries.length;
  const avgMood = total > 0 ? (entries.reduce((s, e) => s + e.mood, 0) / total).toFixed(1) : '-';
  const mostCommon = total > 0 ? Object.entries(moodCounts).sort((a, b) => b[1] - a[1])[0] : [0, 0];
  const last7 = entries.slice(-7);
  const weekAvg = last7.length > 0 ? (last7.reduce((s, e) => s + e.mood, 0) / last7.length).toFixed(1) : '-';

  $('statsCard').innerHTML = `<h2>心情统计</h2><div class="st">
    <div><div class="nm" style="color:var(--accent)">${total}</div><div class="lb">总记录</div></div>
    <div><div class="nm" style="color:var(--warn)">${avgMood}</div><div class="lb">平均心情</div></div>
    <div><div class="nm" style="color:var(--success)">${mostCommon[1]}</div><div class="lb">${moodEmoji[mostCommon[0]] || '-'} 最常</div></div>
    <div><div class="nm" style="color:var(--accent)">${weekAvg}</div><div class="lb">近7天</div></div>
    <div><div class="nm" style="color:var(--success)">${entries.filter(e => e.mood >= 4).length}</div><div class="lb">好心情</div></div>
  </div>`;

  const recent = entries.slice(-14);
  if (recent.length) {
    $('moodChart').innerHTML = recent.map(e => {
      const h = e.mood * 16;
      return `<div class="chart-bar" style="height:${h}px;background:${moodColor[e.mood]}" data-label="${moodEmoji[e.mood]}"></div>`;
    }).join('');
  } else {
    $('moodChart').innerHTML = '<div class="empty" style="width:100%">暂无数据</div>';
  }

  const today = new Date();
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - today.getDay());
  const weekHtml = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart); d.setDate(weekStart.getDate() + i);
    const ds = d.toISOString().slice(0, 10);
    const entry = entries.find(e => e.date === ds);
    weekHtml.push(`<div class="week-cell" style="background:${entry ? moodColor[entry.mood] : 'var(--bg)'}">${entry ? moodEmoji[entry.mood] : d.getDate()}</div>`);
  }
  $('weekGrid').innerHTML = weekHtml.join('');

  const sorted = [...entries].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  $('entryList').innerHTML = sorted.length ? sorted.map(e =>
    `<div class="li"><div style="display:flex;justify-content:space-between;align-items:center"><div><span class="mood-emoji">${moodEmoji[e.mood]}</span><strong>${moodLabel[e.mood]}</strong></div><div><span class="date">${e.date}</span><button class="dng" style="padding:2px 8px;font-size:.75rem;margin-left:8px" onclick="deleteEntry(${e.id})">删</button></div></div>${e.note ? `<div class="note">${e.note}</div>` : ''}${e.tags.length ? `<div class="tags">${e.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}</div>`
  ).join('') : '<div class="empty">暂无记录</div>';

  $('mDate').value = new Date().toISOString().slice(0, 10);
}

render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
