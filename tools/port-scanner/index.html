<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>端口扫描</title>
<meta name="description" content="端口扫描 - 检测目标主机开放端口">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950;--red:#f85149;--yellow:#d29922}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vhpadding:16px;scroll-behavior:smooth;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.container{max-width:800px;margin:0 auto;padding:24px}
.input-row{display:flex;gap:8px;margin-bottom:12px}
.input-row input{flex:1;padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;outline:none}
.input-row input:focus{border-color:var(--accent)}
.btn{padding:12px 24px;border-radius:8px;border:none;background:var(--accent);color:var(--text);cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{opacity:.9}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.preset-btn{padding:5px 10px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:12px}
.preset-btn:hover{border-color:var(--accent)}
.progress{height:4px;background:var(--border);border-radius:2px;margin:16px 0;display:none}
.progress-bar{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:16px}
.port-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;font-size:12px;transition:all .3s}
.port-card.open{border-color:var(--green);background:rgba(63,185,80,.1)}
.port-card.closed{border-color:var(--border);opacity:.5}
.port-num{font-size:16px;font-weight:600}
.port-name{color:var(--muted);margin-top:2px;font-size:11px}
.summary{margin-top:16px;padding:12px;background:var(--card);border-radius:8px;border:1px solid var(--border);font-size:14px;display:none}
@media(max-width:600px){.container{padding:16px}.results-grid{grid-template-columns:repeat(3,1fr)}}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="端口扫描">
  <meta property="og:description" content="端口扫描 - 检测目标主机开放端口">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/port-scanner/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="header">
<span style="font-size:28px">🔌</span>
<h1>端口扫描</h1>
</div>
<div class="container">
<div class="input-row">
<input type="text" id="host" placeholder="输入IP或域名" title="Enter键搜索" onkeydown="if(event.key==='Enter')startScan()">
<button class="btn" id="scanBtn" onclick="startScan()">扫描</button>
</div>
<div class="presets">
<button class="preset-btn" onclick="scanPreset('common')">常用端口(20)</button>
<button class="preset-btn" onclick="scanPreset('web')">Web端口</button>
<button class="preset-btn" onclick="scanPreset('db')">数据库</button>
<button class="preset-btn" onclick="scanPreset('mail')">邮件</button>
<button class="preset-btn" onclick="scanPreset('all')">全端口</button>
</div>
<div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="results-grid" id="results"></div>
<div class="summary" id="summary"></div>
</div>
<script>
const portNames={21:'FTP',22:'SSH',23:'Telnet',25:'SMTP',53:'DNS',80:'HTTP',110:'POP3',111:'RPC',135:'RPC',139:'NetBIOS',143:'IMAP',443:'HTTPS',445:'SMB',993:'IMAPS',995:'POP3S',1433:'MSSQL',1521:'Oracle',3306:'MySQL',3389:'RDP',5432:'PostgreSQL',5900:'VNC',6379:'Redis',8080:'HTTP-Alt',8443:'HTTPS-Alt',9200:'Elasticsearch',27017:'MongoDB'};
const presets={
common:[21,22,23,25,53,80,110,135,139,143,443,445,993,995,1433,3306,3389,5432,6379,8080],
web:[80,443,8080,8443,3000,5000,8000,8888,9000],
db:[1433,1521,3306,5432,6379,9200,27017,11211],
mail:[25,110,143,465,587,993,995],
all:[21,22,23,25,53,80,110,111,135,139,143,443,445,993,995,1433,1521,3306,3389,5432,5900,6379,8080,8443,9200,27017]
};
let scanning=false;
function scanPreset(name){startScan(presets[name])}
async function startScan(ports){
const host=document.getElementById('host').value.trim();
if(!host)return;
if(scanning)return;
scanning=true;
ports=ports||presets.common;
document.getElementById('results').innerHTML='';
document.getElementById('summary').style.display='none';
document.getElementById('progress').style.display='block';
document.getElementById('progressBar').style.width='0%';
let openPorts=[];
for(let i=0;i<ports.length;i++){
const p=ports[i];
document.getElementById('progressBar').style.width=((i+1)/ports.length*100)+'%';
try{
await scanPort(host,p);
openPorts.push(p);
document.getElementById('results').innerHTML+=`<div class="port-card open"><div class="port-num">${p}</div><div class="port-name">${portNames[p]||''}</div></div>`;
}catch(e){
document.getElementById('results').innerHTML+=`<div class="port-card closed"><div class="port-num">${p}</div><div class="port-name">${portNames[p]||''}</div></div>`;
}
}
document.getElementById('progress').style.display='none';
const summary=document.getElementById('summary');
summary.style.display='block';
summary.innerHTML=`扫描完成: ${ports.length}个端口, <span style="color:var(--green)">${openPorts.length}个开放</span>, ${ports.length-openPorts.length}个关闭`;
scanning=false;
}
function scanPort(host,port){
return new Promise((resolve,reject)=>{
const ws=new WebSocket(`wss://${host}:${port}`);
const t=setTimeout(()=>{ws.close();reject()},2000);
ws.onopen=()=>{clearTimeout(t);ws.close();resolve()};
ws.onerror=()=>{clearTimeout(t);reject()};
});
}
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
