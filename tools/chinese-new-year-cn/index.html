<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国新年倒计时与习俗</title>
<meta property="og:title" content="中国新年倒计时与习俗">
<meta property="og:description" content="中国新年倒计时与习俗 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="中国新年倒计时与习俗 - 春节传统习俗大全、十二生肖、新年祝福语">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧧</text></svg>">
<meta name="robots" content="index,follow">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.hidden{display:none}
.countdown-box{display:flex;gap:16px;justify-content:center;margin:20px 0}
.countdown-item{text-align:center}
.countdown-num{font-size:2.5rem;font-weight:700;color:var(--red);line-height:1}
.countdown-label{font-size:.8rem;color:var(--text2);margin-top:4px}
.zodiac-card{text-align:center;padding:30px}
.zodiac-emoji{font-size:4rem;display:block;margin-bottom:8px}
.zodiac-name{font-size:1.4rem;font-weight:700}
.zodiac-year{color:var(--text2);font-size:.9rem}
.zodiac-desc{margin-top:12px;color:var(--text2);font-size:.85rem;line-height:1.6}
.custom-list{display:flex;flex-direction:column;gap:10px}
.custom-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all var(--transition)}
.custom-item:hover{border-color:var(--blue)}
.custom-header{display:flex;align-items:center;gap:10px}
.custom-icon{font-size:1.5rem}
.custom-name{font-weight:600;font-size:1rem}
.custom-desc{color:var(--text2);font-size:.85rem;margin-top:6px}
.custom-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--text2);font-size:.85rem;line-height:1.6;display:none}
.custom-detail.show{display:block}
.search-box{margin-bottom:16px}
.search-box input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
.search-box input:focus{outline:none;border-color:var(--blue)}
.cat-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.cat-tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s}
.cat-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.wish-card{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:12px}
.wish-text{font-size:1.2rem;font-weight:600;margin-bottom:8px}
.wish-sub{font-size:.85rem;opacity:.8}
.greetings{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.greeting-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:all var(--transition);font-size:.9rem}
.greeting-item:hover{border-color:var(--yellow);transform:translateY(-2px)}
.greeting-item.copied{border-color:var(--green);background:var(--green);color:#fff}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div style="position:fixed;top:8px;right:8px;z-index:9999"><button class="btn btn-secondary" onclick="toggleTheme()" style="font-size:.8rem;padding:4px 10px" id="themeBtn">🌙 暗色</button></div>
<div class="container">
<h1>🧧 中国新年倒计时与习俗</h1>
<p class="sub">春节传统习俗大全 · 十二生肖 · 新年祝福</p>

<div class="card zodiac-card" id="zodiacCard"></div>

<div class="card">
<h2 style="text-align:center;margin-bottom:10px;font-size:1.1rem">⏰ 距离下一个春节</h2>
<div class="countdown-box" id="countdown"></div>
</div>

<div class="card">
<h2 style="margin-bottom:12px;font-size:1.1rem">🎊 春节习俗</h2>
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索习俗..." oninput="filterCustoms()"></div>
<div class="cat-tabs" id="catTabs"></div>
<div class="custom-list" id="customList"></div>
</div>

<div class="card">
<h2 style="margin-bottom:12px;font-size:1.1rem">🧧 新年祝福语</h2>
<p style="color:var(--text2);font-size:.85rem;margin-bottom:12px">点击复制祝福语</p>
<div class="greetings" id="greetings"></div>
</div>

<div class="card">
<h2 style="margin-bottom:12px;font-size:1.1rem">🏮 新年愿望</h2>
<div class="wish-card">
<div class="wish-text" id="wishText">万事如意</div>
<div class="wish-sub">点击下方按钮获取随机祝福</div>
</div>
<button class="btn btn-primary" onclick="randomWish()" style="width:100%">🎋 许个新年愿望</button>
</div>
</div>

<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script src="../i18n.js" defer></script>
<script>
var zodiacs=[
{emoji:'🐀',name:'鼠',years:'2020,2008,1996,1984,1972',desc:'聪明灵活，机智过人，善于应变'},
{emoji:'🐂',name:'牛',years:'2021,2009,1997,1985,1973',desc:'勤劳踏实，坚韧不拔，任劳任怨'},
{emoji:'🐅',name:'虎',years:'2022,2010,1998,1986,1974',desc:'勇敢自信，热情大方，正义感强'},
{emoji:'🐇',name:'兔',years:'2023,2011,1999,1987,1975',desc:'温柔善良，心思细腻，和平主义者'},
{emoji:'🐉',name:'龙',years:'2024,2012,2000,1988,1976',desc:'雄心勃勃，才华横溢，充满活力'},
{emoji:'🐍',name:'蛇',years:'2025,2013,2001,1989,1977',desc:'神秘优雅，深思熟虑，直觉敏锐'},
{emoji:'🐴',name:'马',years:'2026,2014,2002,1990,1978',desc:'热情奔放，追求自由，积极向上'},
{emoji:'🐑',name:'羊',years:'2027,2015,2003,1991,1979',desc:'温和善良，富有同情心，艺术气质'},
{emoji:'🐒',name:'猴',years:'2028,2016,2004,1992,1980',desc:'聪明机智，活泼好动，创造力强'},
{emoji:'🐔',name:'鸡',years:'2029,2017,2005,1993,1981',desc:'勤奋认真，守时守信，观察力强'},
{emoji:'🐕',name:'狗',years:'2030,2018,2006,1994,1982',desc:'忠诚可靠，诚实正直，重情重义'},
{emoji:'🐷',name:'猪',years:'2031,2019,2007,1995,1983',desc:'憨厚善良，乐观开朗，福气满满'}
];
var customs=[
{name:'贴春联',icon:'📝',cat:'装饰',desc:'在门框上贴红纸对联，表达对新年的美好祝愿',detail:'春联源于古代的"桃符"，五代后蜀开始在桃木板上题写吉祥语。明代朱元璋大力推广贴春联，从此成为春节最重要的装饰习俗。贴春联有讲究：上联贴右，下联贴左，横批从左到右。'},
{name:'放鞭炮',icon:'🧨',cat:'娱乐',desc:'燃放爆竹烟花，驱邪迎新，营造节日气氛',detail:'放鞭炮的习俗源于先秦时期的"庭燎"和"爆祭"。传说"年"兽怕红色和响声，人们用爆竹驱赶。现代城市出于环保和安全考虑，很多地方已禁止燃放。'},
{name:'拜年',icon:'🙏',cat:'社交',desc:'正月初一至十五走亲访友，互致新年祝福',detail:'拜年是春节期间最重要的社交活动。传统拜年顺序：初一拜本家，初二拜岳家，初三拜姑母。晚辈向长辈磕头或鞠躬，长辈给晚辈压岁钱。'},
{name:'吃年夜饭',icon:'🍽️',cat:'饮食',desc:'除夕全家团聚吃丰盛晚餐，是一年中最重要的一顿饭',detail:'年夜饭又称"团圆饭"，是除夕最重要的习俗。北方必有饺子（形如元宝），南方必有鱼（年年有余），还有年糕（年年高升）、鸡（大吉大利）等寓意菜。'},
{name:'守岁',icon:'⏰',cat:'娱乐',desc:'除夕夜全家围坐不睡，等待新年钟声',detail:'守岁又称"熬年"，从除夕夜到新年天亮不睡觉。古代守岁有两层含义：对老人是"辞旧岁"，珍惜时光；对年轻人是为父母延年益寿。'},
{name:'发红包',icon:'🧧',cat:'社交',desc:'长辈给晚辈压岁钱，装在红色信封中',detail:'红包又称"压岁钱"，据说可以压住"祟"（一种小妖），保佑孩子平安。红包金额通常为偶数，寓意好事成双。现代也流行微信红包，成为新年新习俗。'},
{name:'舞龙舞狮',icon:'🐉',cat:'娱乐',desc:'春节期间的民间表演，祈求风调雨顺',detail:'舞龙起源于汉代的"鱼龙曼衍"之戏。龙是中华民族的图腾，舞龙寓意祈求风调雨顺、五谷丰登。舞狮分南狮和北狮：南狮造型威猛，动作夸张；北狮形象逼真，动作细腻。'},
{name:'吃饺子',icon:'🥟',cat:'饮食',desc:'北方除夕和初一必吃的传统食品',detail:'饺子形状像元宝，寓意"招财进宝"。除夕包饺子时会在其中一枚放入硬币，吃到的人新年会有好运。饺子馅有多种：猪肉白菜、韭菜鸡蛋、三鲜等。'},
{name:'逛庙会',icon:'🎪',cat:'娱乐',desc:'春节期间的民俗集市，品尝小吃观看表演',detail:'庙会是春节期间最热闹的民俗活动。有各种传统小吃、手工艺品、民间表演（杂耍、戏曲、皮影等）。著名的庙会有北京地坛庙会、南京夫子庙灯会等。'},
{name:'挂灯笼',icon:'🏮',cat:'装饰',desc:'在家门口挂红灯笼，增添节日喜庆气氛',detail:'灯笼象征着阖家团圆、红红火火。大红灯笼高高挂起，不仅增添了节日气氛，也寓意前途光明。元宵节后灯笼会一直挂到正月十五。'}
];
var greetings=['新年快乐，万事如意！','恭喜发财，红包拿来！','岁岁平安，阖家幸福！','龙马精神，大吉大利！','福如东海，寿比南山！','新春大吉，财源广进！','吉祥如意，步步高升！','五福临门，心想事成！','平安喜乐，诸事顺遂！','年年有余，幸福安康！','瑞雪兆丰年，好运连连！','辞旧迎新，前程似锦！','金玉满堂，富贵吉祥！','鹏程万里，大展宏图！','花开富贵，竹报平安！','家庭和睦，事业有成！'];
var wishes=['万事如意','心想事成','龙马精神','财源广进','平安喜乐','岁岁年年','前程似锦','步步高升','大吉大利','福星高照','阖家幸福','五福临门','吉祥如意','花开富贵','金玉满堂','竹报平安','瑞气盈门','喜气洋洋'];
var currentCat='all';

function getZodiac(){
  var year=new Date().getFullYear();
  var idx=(year-4)%12;
  var z=zodiacs[idx];
  document.getElementById('zodiacCard').innerHTML='<span class="zodiac-emoji">'+z.emoji+'</span><div class="zodiac-name">'+z.name+'年 ('+year+')</div><div class="zodiac-desc">'+z.desc+'</div>';
}

function updateCountdown(){
  var now=new Date();
  var year=now.getFullYear();
  var cnyDate=calcCNY(year);
  if(now>cnyDate)cnyDate=calcCNY(year+1);
  var diff=cnyDate-now;
  var days=Math.floor(diff/864e5);
  var hours=Math.floor((diff%864e5)/36e5);
  var mins=Math.floor((diff%36e5)/6e4);
  var secs=Math.floor((diff%6e4)/1e3);
  document.getElementById('countdown').innerHTML=
    '<div class="countdown-item"><div class="countdown-num">'+days+'</div><div class="countdown-label">天</div></div>'+
    '<div class="countdown-item"><div class="countdown-num">'+pad(hours)+'</div><div class="countdown-label">时</div></div>'+
    '<div class="countdown-item"><div class="countdown-num">'+pad(mins)+'</div><div class="countdown-label">分</div></div>'+
    '<div class="countdown-item"><div class="countdown-num">'+pad(secs)+'</div><div class="countdown-label">秒</div></div>';
}

function pad(n){return n<10?'0'+n:''+n}

function calcCNY(year){
  var dates=[new Date(year,0,28),new Date(year,0,29),new Date(year,1,1),new Date(year,1,2),new Date(year,1,3),new Date(year,1,4),new Date(year,1,5),new Date(year,1,6),new Date(year,1,7),new Date(year,1,8),new Date(year,1,9),new Date(year,1,10)];
  for(var i=0;i<dates.length;i++){if(dates[i].getDay()===1&&dates[i].getMonth()===1)return dates[i]}
  return new Date(year,1,1);
}

function renderCatTabs(){
  var cats=['all','装饰','饮食','娱乐','社交'];
  var labels={all:'全部',decor:'🎨 装饰',food:'🍽️ 饮食',fun:'🎮 娱乐',social:'👥 社交'};
  var icons={all:'全部',装饰:'🎨 装饰',饮食:'🍽️ 饮食',娱乐:'🎮 娱乐',社交:'👥 社交'};
  var h='';
  cats.forEach(function(c){h+='<span class="cat-tab'+(c===currentCat?' active':'')+'" onclick="selectCat(this,\''+c+'\')">'+icons[c]+'</span>'});
  document.getElementById('catTabs').innerHTML=h;
}

function selectCat(el,cat){
  document.querySelectorAll('.cat-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  currentCat=cat;
  filterCustoms();
}

function filterCustoms(){
  var s=document.getElementById('searchInput').value.toLowerCase();
  var filtered=customs.filter(function(c){
    if(currentCat!=='all'&&c.cat!==currentCat)return false;
    if(s&&!c.name.toLowerCase().includes(s)&&!c.desc.toLowerCase().includes(s))return false;
    return true;
  });
  renderCustoms(filtered);
}

function renderCustoms(items){
  var h='';
  items.forEach(function(c,i){
    var idx=customs.indexOf(c);
    h+='<div class="custom-item" onclick="toggleDetail('+idx+')">';
    h+='<div class="custom-header"><span class="custom-icon">'+c.icon+'</span><div><div class="custom-name">'+c.name+'</div><div class="custom-desc">'+c.desc+'</div></div></div>';
    h+='<div class="custom-detail" id="cd-'+idx+'">'+c.detail+'</div>';
    h+='</div>';
  });
  document.getElementById('customList').innerHTML=h||'<div class="card" style="text-align:center;color:var(--text2)">没有找到匹配的习俗</div>';
}

function toggleDetail(idx){
  var el=document.getElementById('cd-'+idx);
  if(el)el.classList.toggle('show');
}

function renderGreetings(){
  var h='';
  greetings.forEach(function(g,i){
    h+='<div class="greeting-item" onclick="copyGreeting(this,\''+g+'\')">'+g+'</div>';
  });
  document.getElementById('greetings').innerHTML=h;
}

function copyGreeting(el,text){
  navigator.clipboard.writeText(text).then(function(){
    el.classList.add('copied');
    el.textContent='✓ 已复制';
    setTimeout(function(){el.classList.remove('copied');el.textContent=text},1500);
  });
}

function randomWish(){
  var w=wishes[Math.floor(Math.random()*wishes.length)];
  document.getElementById('wishText').textContent=w;
  document.getElementById('wishText').style.animation='none';
  void document.getElementById('wishText').offsetWidth;
}

function toggleTheme(){
  var html=document.documentElement;
  var isLight=html.getAttribute('data-theme')==='light';
  html.setAttribute('data-theme',isLight?'dark':'light');
  document.getElementById('themeBtn').textContent=isLight?'☀️ 亮色':'🌙 暗色';
}

getZodiac();
renderCatTabs();
filterCustoms();
renderGreetings();
updateCountdown();
setInterval(updateCountdown,1000);
window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input');if(inp)inp.focus()}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur()}});
</script>
</body>
</html>
