<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>垃圾分类指南 | Recycling Guide CN</title>
<meta property="og:title" content="垃圾分类指南 | Recycling Guide CN">
<meta property="og:description" content="垃圾分类指南 | Recycling Guide CN - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="垃圾分类指南，查询各类垃圾的分类方法和投放要求">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
<meta name="robots" content="index, follow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--input:#242836;--text:#e2e4e9;--text2:#8b8fa3;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--warn:#f59e0b;--border:#2a2e3a;--radius:12px;--radius-sm:8px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--input:#f0f2f5;--text:#1f2328;--text2:#656d76;--green:#1a7f37;--danger:#cf222e;--blue:#0969da;--warn:#bf8700;--border:#d0d7de}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;line-height:1.6;padding:20px}
.container{max-width:860px;margin:0 auto;padding:0 12px}
header{text-align:center;padding:40px 0 24px}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#22c55e,#3b82f6,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{color:var(--text2);font-size:.95rem}
.search-box{display:flex;gap:12px;margin-bottom:24px}
.search-box input{flex:1;background:var(--input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;color:var(--text);font-size:1rem;outline:none}
.search-box input:focus{border-color:var(--green)}
.search-box button{background:var(--green);color:#000;border:none;border-radius:var(--radius-sm);padding:12px 24px;font-size:1rem;font-weight:600;cursor:pointer}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
@media(max-width:600px){.categories{grid-template-columns:repeat(2,1fr)}}
.cat-btn{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;transition:all .2s}
.cat-btn:hover,.cat-btn.active{border-color:var(--green);background:rgba(34,197,94,.05)}
.cat-btn .cat-icon{font-size:2rem;margin-bottom:8px}
.cat-btn .cat-name{font-size:.9rem;font-weight:600}
.cat-btn .cat-color{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.waste-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:500px){.waste-list{grid-template-columns:1fr}}
.waste-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;display:flex;align-items:center;gap:12px;transition:all .2s;cursor:pointer}
.waste-item:hover{border-color:var(--green)}
.waste-item .w-icon{font-size:1.5rem}
.waste-item .w-info{flex:1}
.waste-item .w-name{font-weight:600;font-size:.95rem}
.waste-item .w-desc{font-size:.82rem;color:var(--text2)}
.waste-item .w-tag{font-size:.72rem;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.w-tag.hazardous{background:rgba(239,68,68,.15);color:#ef4444}
.w-tag.recyclable{background:rgba(59,130,246,.15);color:#3b82f6}
.w-tag.kitchen{background:rgba(34,197,94,.15);color:#22c55e}
.w-tag.residual{background:rgba(139,143,163,.15);color:#8b8fa3}
.tips-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px}
.tips-card h2{font-size:1.15rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.tip-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.tip-row:last-child{border-bottom:none}
.tip-row .t-icon{font-size:1.2rem}
.tip-row .t-text{flex:1}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.82rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header><h1>垃圾分类指南</h1><p class="subtitle">查询垃圾分类方法，助力环保生活</p></header>
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索物品名称，如：电池、塑料瓶..." oninput="filterWaste()">
<button onclick="filterWaste()">搜索</button>
</div>
<div class="categories" id="catBtns"></div>
<div class="waste-list" id="wasteList"></div>
<div class="tips-card" style="margin-top:24px">
<h2><span class="icon">📌</span> 分类小贴士</h2>
<div class="tip-row"><span class="t-icon">🗑️</span><span class="t-text"><strong>四分法</strong>：可回收物（蓝色）、有害垃圾（红色）、厨余垃圾（绿色）、其他垃圾（灰色）</span></div>
<div class="tip-row"><span class="t-icon">💧</span><span class="t-text"><strong>清洗干净</strong>：可回收物需清洁干燥，牛奶盒、外卖盒请清洗后再投放</span></div>
<div class="tip-row"><span class="t-icon">⚠️</span><span class="t-text"><strong>避免污染</strong>：厨余垃圾沥干水分，不混入塑料袋</span></div>
<div class="tip-row"><span class="t-icon">🔋</span><span class="t-text"><strong>有害垃圾</strong>：电池、灯管、药品等需单独投放，不要随意丢弃</span></div>
</div>
<footer>垃圾分类指南 · 数据参考国家标准GB/T 19095-2019</footer>
</div>
<script>
const CATEGORIES=[
{id:'all',name:'全部',icon:'📋',color:'#8b8fa3'},
{id:'recyclable',name:'可回收物',icon:'♻️',color:'#3b82f6'},
{id:'hazardous',name:'有害垃圾',icon:'⚠️',color:'#ef4444'},
{id:'kitchen',name:'厨余垃圾',icon:'🥬',color:'#22c55e'},
{id:'residual',name:'其他垃圾',icon:'🗑️',color:'#8b8fa3'}
];
const WASTES=[
{name:'塑料瓶',icon:'🧴',cat:'recyclable',desc:'清洗干净，压扁后投放'},
{name:'废纸',icon:'📄',cat:'recyclable',desc:'干燥整洁，不含食物残渣'},
{name:'玻璃瓶',icon:'🍾',cat:'recyclable',desc:'轻放，避免破碎'},
{name:'金属罐',icon:'🥫',cat:'recyclable',desc:'压扁后投放，节约空间'},
{name:'旧衣物',icon:'👕',cat:'recyclable',desc:'清洗干净，打包投放'},
{name:'废电池',icon:'🔋',cat:'hazardous',desc:'含重金属，需专门回收'},
{name:'过期药品',icon:'💊',cat:'hazardous',desc:'连带包装一起投放有害垃圾桶'},
{name:'废灯管',icon:'💡',cat:'hazardous',desc:'含汞，轻放避免破碎'},
{name:'油漆桶',icon:'🎨',cat:'hazardous',desc:'含化学物质，不可随意丢弃'},
{name:'剩菜剩饭',icon:'🍚',cat:'kitchen',desc:'沥干水分，去除塑料袋'},
{name:'果皮菜叶',icon:'🍊',cat:'kitchen',desc:'可堆肥处理，转化为有机肥'},
{name:'蛋壳茶渣',icon:'🥚',cat:'kitchen',desc:'沥干后投放厨余垃圾桶'},
{name:'骨头鱼刺',icon:'🐟',cat:'kitchen',desc:'大骨棒属其他垃圾，小骨可厨余'},
{name:'外卖盒',icon:'📦',cat:'residual',desc:'有食物残渣属其他垃圾'},
{name:'用过的纸巾',icon:'🧻',cat:'residual',desc:'已污染不可回收'},
{name:'陶瓷碎片',icon:'🏺',cat:'residual',desc:'不可回收，小心投放'},
{name:'烟蒂',icon:'🚬',cat:'residual',desc:'熄灭后投放其他垃圾桶'},
{name:'尿不湿',icon:'👶',cat:'residual',desc:'属其他垃圾，不可回收'}
];
let activeCat='all';
function renderCats(){
let h='';
CATEGORIES.forEach(c=>{
h+=`<div class="cat-btn ${activeCat===c.id?'active':''}" onclick="setCat('${c.id}')"><div class="cat-icon">${c.icon}</div><div><span class="cat-color" style="background:${c.color}"></span>${c.name}</div></div>`;
});
document.getElementById('catBtns').innerHTML=h;
}
function renderList(query=''){
let filtered=WASTES;
if(activeCat!=='all')filtered=filtered.filter(w=>w.cat===activeCat);
if(query)filtered=filtered.filter(w=>w.name.includes(query)||w.desc.includes(query));
let h='';
filtered.forEach(w=>{
const tagClass=w.cat==='hazardous'?'hazardous':w.cat==='recyclable'?'recyclable':w.cat==='kitchen'?'kitchen':'residual';
const tagText=w.cat==='hazardous'?'有害':w.cat==='recyclable'?'可回收':w.cat==='kitchen'?'厨余':'其他';
h+=`<div class="waste-item"><span class="w-icon">${w.icon}</span><div class="w-info"><div class="w-name">${w.name}</div><div class="w-desc">${w.desc}</div></div><span class="w-tag ${tagClass}">${tagText}</span></div>`;
});
if(!filtered.length)h='<div style="text-align:center;padding:40px;color:var(--text2);grid-column:1/-1">未找到相关物品，请换个关键词试试</div>';
document.getElementById('wasteList').innerHTML=h;
}
function setCat(id){activeCat=id;renderCats();renderList(document.getElementById('searchInput').value)}
function filterWaste(){renderList(document.getElementById('searchInput').value)}
renderCats();renderList();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
