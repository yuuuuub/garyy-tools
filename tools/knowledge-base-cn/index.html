<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库管理器</title>
<meta name="description" content="在线创建和管理个人知识库，支持分类、搜索和导出">
<script defer src="../i18n.js"></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth;padding:16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button,textarea{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:100px}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s;display:inline-block;text-align:center}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:4px 12px;font-size:.8rem}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{flex:1}
.category-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat-tag{padding:4px 12px;border-radius:var(--radius);font-size:.8rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.cat-tag.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.kb-list{list-style:none}
.kb-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.kb-item:hover{border-color:var(--blue)}
.kb-item .kb-title{font-weight:600;margin-bottom:4px}
.kb-item .kb-meta{font-size:.75rem;color:var(--text2)}
.kb-item .kb-cat{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.7rem;background:var(--blue);color:#fff;margin-left:8px}
.kb-item .kb-del{float:right;background:none;border:none;color:var(--text2);cursor:pointer}
.kb-item .kb-del:hover{color:var(--red)}
.kb-detail{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.kb-detail h3{margin-bottom:8px}
.kb-detail .content{font-size:.85rem;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.kb-detail .tags{margin-top:12px;display:flex;gap:4px;flex-wrap:wrap}
.kb-detail .tag{padding:2px 8px;border-radius:4px;font-size:.7rem;background:var(--gold);color:#000}
.preview-box{background:#fff;color:#333;padding:24px;border-radius:var(--radius);border:1px solid #ddd;font-size:.82rem;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.output-area{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px;display:none}
@media(max-width:640px){.form-row{flex-direction:column}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="知识库管理器">
<meta property="og:description" content="在线创建和管理个人知识库">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📚 知识库管理器</h1>
    <p>创建和管理你的个人知识库</p>
  </header>

  <div class="card">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="搜索知识条目..." oninput="filterList()">
      <button class="btn" onclick="showForm()">+ 新建</button>
    </div>
    <div class="category-tags" id="catTags"></div>
  </div>

  <div class="card" id="formCard" style="display:none">
    <div class="section-title" id="formTitle">新建知识条目</div>
    <input type="hidden" id="editId">
    <div class="form-row">
      <div class="group"><label>标题</label><input type="text" id="kbTitle" placeholder="知识条目标题"></div>
      <div class="group"><label>分类</label>
        <select id="kbCategory">
          <option value="技术">技术</option>
          <option value="产品">产品</option>
          <option value="设计">设计</option>
          <option value="运营">运营</option>
          <option value="管理">管理</option>
          <option value="其他">其他</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="group"><label>标签（逗号分隔）</label><input type="text" id="kbTags" placeholder="标签1, 标签2"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>内容</label><textarea id="kbContent" rows="8" placeholder="在此输入知识内容..."></textarea></div>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="saveEntry()">保存</button>
      <button class="btn btn-outline" onclick="hideForm()">取消</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">知识条目 (<span id="count">0</span>)</div>
    <ul class="kb-list" id="kbList"></ul>
  </div>

  <div class="card" id="detailCard" style="display:none">
    <div class="section-title">查看详情</div>
    <div class="kb-detail" id="kbDetail"></div>
    <div class="btn-group">
      <button class="btn btn-sm" onclick="exportEntry()">导出 TXT</button>
      <button class="btn btn-sm btn-outline" onclick="document.getElementById('detailCard').style.display='none'">关闭</button>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn btn-green" onclick="exportAll()">导出全部</button>
    <button class="btn btn-outline" onclick="importData()">导入数据</button>
  </div>

  <div class="output-area" id="outputArea">
    <div class="section-title">导出预览</div>
    <div class="preview-box" id="preview"></div>
  </div>
</div>

<script>
var entries = [
  {id:1, title:'Vue3 组合式API最佳实践', category:'技术', tags:['Vue3','Composition API'], content:'1. 使用 setup() 替代 options API\n2. 响应式数据用 ref/reactive\n3. 计算属性用 computed\n4. 副作用用 onMounted/onUnmounted\n5. 组件通信用 provide/inject', date:'2025-01-15'},
  {id:2, title:'用户增长模型AARRR', category:'产品', tags:['增长','用户运营'], content:'Acquisition - 获取用户\nActivation - 激活用户\nRetention - 留存用户\nRevenue - 收入变现\nReferral - 推荐传播', date:'2025-01-20'},
  {id:3, title:'设计系统色彩规范', category:'设计', tags:['设计系统','色彩'], content:'主色: #3b82f6\n成功: #238636\n警告: #f59e0b\n错误: #ef4444\n文字: #e6edf3\n次要文字: #8b949e\n背景: #0d1117\n卡片: #161b22', date:'2025-02-01'}
];
var nextId = 4;
var currentCat = 'all';
var currentEntry = null;

var categories = ['all','技术','产品','设计','运营','管理','其他'];

function renderCatTags() {
  var html = '';
  categories.forEach(function(c) {
    html += '<span class="cat-tag' + (currentCat === c ? ' active' : '') + '" onclick="selectCat(\'' + c + '\')">' + (c === 'all' ? '全部' : c) + '</span>';
  });
  document.getElementById('catTags').innerHTML = html;
}

function selectCat(c) {
  currentCat = c;
  renderCatTags();
  filterList();
}

function filterList() {
  var q = document.getElementById('searchInput').value.toLowerCase();
  var filtered = entries.filter(function(e) {
    var matchCat = currentCat === 'all' || e.category === currentCat;
    var matchQ = !q || e.title.toLowerCase().indexOf(q) >= 0 || e.content.toLowerCase().indexOf(q) >= 0 || e.tags.join(',').toLowerCase().indexOf(q) >= 0;
    return matchCat && matchQ;
  });
  renderList(filtered);
}

function renderList(list) {
  list = list || entries;
  var html = '';
  list.forEach(function(e) {
    html += '<li class="kb-item" onclick="showDetail(' + e.id + ')">' +
      '<button class="kb-del" onclick="event.stopPropagation();deleteEntry(' + e.id + ')">×</button>' +
      '<div class="kb-title">' + e.title + '<span class="kb-cat">' + e.category + '</span></div>' +
      '<div class="kb-meta">' + e.date + ' | ' + e.tags.join(', ') + '</div></li>';
  });
  document.getElementById('kbList').innerHTML = html || '<li style="padding:20px;text-align:center;color:var(--text2)">暂无条目</li>';
  document.getElementById('count').textContent = list.length;
}

function showForm(id) {
  document.getElementById('formCard').style.display = 'block';
  if (id) {
    var e = entries.find(function(x){ return x.id === id; });
    document.getElementById('editId').value = id;
    document.getElementById('kbTitle').value = e.title;
    document.getElementById('kbCategory').value = e.category;
    document.getElementById('kbTags').value = e.tags.join(', ');
    document.getElementById('kbContent').value = e.content;
    document.getElementById('formTitle').textContent = '编辑知识条目';
  } else {
    document.getElementById('editId').value = '';
    document.getElementById('kbTitle').value = '';
    document.getElementById('kbTags').value = '';
    document.getElementById('kbContent').value = '';
    document.getElementById('formTitle').textContent = '新建知识条目';
  }
  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
}

function hideForm() {
  document.getElementById('formCard').style.display = 'none';
}

function saveEntry() {
  var title = document.getElementById('kbTitle').value.trim();
  var content = document.getElementById('kbContent').value.trim();
  if (!title || !content) { alert('请填写标题和内容'); return; }
  var editId = document.getElementById('editId').value;
  var tags = document.getElementById('kbTags').value.split(',').map(function(t){ return t.trim(); }).filter(Boolean);
  var cat = document.getElementById('kbCategory').value;
  var today = new Date().toISOString().split('T')[0];

  if (editId) {
    var e = entries.find(function(x){ return x.id === Number(editId); });
    e.title = title;
    e.category = cat;
    e.tags = tags;
    e.content = content;
    e.date = today;
  } else {
    entries.push({ id: nextId++, title: title, category: cat, tags: tags, content: content, date: today });
  }
  hideForm();
  filterList();
}

function deleteEntry(id) {
  if (!confirm('确定删除？')) return;
  entries = entries.filter(function(e){ return e.id !== id; });
  filterList();
}

function showDetail(id) {
  var e = entries.find(function(x){ return x.id === id; });
  currentEntry = e;
  var tagsHtml = e.tags.map(function(t){ return '<span class="tag">' + t + '</span>'; }).join('');
  document.getElementById('kbDetail').innerHTML = '<h3>' + e.title + '</h3>' +
    '<div class="kb-meta" style="margin-bottom:12px">分类: ' + e.category + ' | 日期: ' + e.date + '</div>' +
    '<div class="content">' + e.content + '</div>' +
    '<div class="tags">' + tagsHtml + '</div>' +
    '<div class="btn-group"><button class="btn btn-sm" onclick="showForm(' + e.id + ')">编辑</button></div>';
  document.getElementById('detailCard').style.display = 'block';
  document.getElementById('detailCard').scrollIntoView({ behavior: 'smooth' });
}

function exportEntry() {
  if (!currentEntry) return;
  var e = currentEntry;
  var p = e.title + '\n分类: ' + e.category + '\n标签: ' + e.tags.join(', ') + '\n日期: ' + e.date + '\n\n' + e.content;
  document.getElementById('preview').textContent = p;
  document.getElementById('outputArea').style.display = 'block';
  var blob = new Blob([p], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = e.title + '.txt';
  a.click();
}

function exportAll() {
  var p = '知识库导出\n导出时间: ' + new Date().toLocaleString('zh-CN') + '\n共 ' + entries.length + ' 条\n\n';
  p += '════════════════════════════════════════\n\n';
  entries.forEach(function(e) {
    p += '【' + e.category + '】' + e.title + '\n';
    p += '标签: ' + e.tags.join(', ') + '\n';
    p += '日期: ' + e.date + '\n\n';
    p += e.content + '\n\n';
    p += '──────────────────────────────────────\n\n';
  });
  document.getElementById('preview').textContent = p;
  document.getElementById('outputArea').style.display = 'block';
  var blob = new Blob([p], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'knowledge-base-export.txt';
  a.click();
}

function importData() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (Array.isArray(data)) {
          entries = data;
          nextId = Math.max.apply(null, entries.map(function(e){ return e.id; })) + 1;
          filterList();
          alert('导入成功');
        }
      } catch(err) { alert('JSON格式错误'); }
    };
    reader.readAsText(e.target.files[0]);
  };
  input.click();
}

renderCatTags();
filterList();
</script>
</body>
</html>
