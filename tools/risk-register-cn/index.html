<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚠️ 风险登记册</title>
<meta name="description" content="项目风险登记工具，识别、评估和跟踪项目风险，制定应对策略">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:1000px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:14px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-num{font-size:1.5rem;font-weight:700}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:2px}
.risk-table{width:100%;border-collapse:collapse;font-size:.85rem}
.risk-table th{text-align:left;padding:10px;border-bottom:2px solid var(--border);font-weight:600;font-size:.8rem;color:var(--text2)}
.risk-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
.risk-table tr:hover{background:var(--bg)}
.risk-id{font-weight:700;color:var(--accent)}
.risk-level{padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600;white-space:nowrap}
.risk-critical{background:rgba(248,81,73,.2);color:var(--red)}
.risk-high{background:rgba(248,81,73,.1);color:var(--red)}
.risk-medium{background:rgba(210,153,34,.15);color:var(--yellow)}
.risk-low{background:rgba(63,185,80,.15);color:var(--green)}
.risk-status{padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600}
.status-open{background:rgba(248,81,73,.1);color:var(--red)}
.status-mitigating{background:rgba(210,153,34,.15);color:var(--yellow)}
.status-closed{background:rgba(63,185,80,.15);color:var(--green)}
.risk-matrix{display:grid;grid-template-columns:40px repeat(5,1fr);grid-template-rows:repeat(5,40px) 30px;gap:2px;max-width:400px;margin:16px auto}
.matrix-cell{border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:600;cursor:pointer;transition:all .15s}
.matrix-cell:hover{transform:scale(1.05)}
.matrix-label{font-size:.65rem;color:var(--text2);display:flex;align-items:center;justify-content:center}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:550px;max-height:85vh;overflow-y:auto}
.empty{color:var(--text2);text-align:center;padding:30px}
@media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}.risk-table{font-size:.75rem}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚠️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="⚠️ 风险登记册">
<meta property="og:description" content="项目风险登记工具，识别、评估和跟踪项目风险，制定应对策略">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/risk-register-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='riskreg_data';
let state=JSON.parse(localStorage.getItem(STORE)||'{"risks":[]}');
if(!state.risks.length){
  state.risks=[
    {id:'R001',title:'核心开发人员离职',category:'人员',likelihood:3,impact:4,status:'mitigating',owner:'项目经理',description:'关键技术岗位人员可能离职导致项目延期',strategy:'知识共享、交叉培训、文档完善',contingency:'外部招聘+内部调岗',identified:'2025-06-01'},
    {id:'R002',title:'第三方API不稳定',category:'技术',likelihood:4,impact:3,status:'open',owner:'技术负责人',description:'支付接口频繁超时影响用户体验',strategy:'降级方案、重试机制、多供应商备选',contingency:'切换到备用支付通道',identified:'2025-06-05'},
    {id:'R003',title:'需求频繁变更',category:'管理',likelihood:4,impact:3,status:'open',owner:'产品经理',description:'业务方需求不断调整影响迭代节奏',strategy:'需求冻结期、变更评审流程',contingency:'延长迭代周期',identified:'2025-06-10'},
    {id:'R004',title:'服务器容量不足',category:'技术',likelihood:2,impact:5,status:'mitigating',owner:'运维团队',description:'大促期间流量激增可能超出系统承载',strategy:'弹性扩容、CDN加速、缓存优化',contingency:'紧急扩容+限流',identified:'2025-05-20'}
  ];
}
let showModal=false,editingRisk=null,viewMode='table';

function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function genId(){const n=state.risks.length+1;return'R'+String(n).padStart(3,'0')}
function getScore(r){return r.likelihood*r.impact}
function getLevel(r){const s=getScore(r);if(s>=15)return'critical';if(s>=10)return'high';if(s>=5)return'medium';return'low'}
function getLevelText(r){const l=getLevel(r);return{critical:'🔴 严重',high:'🟠 高',medium:'🟡 中',low:'🟢 低'}[l]}

function render(){
  let h=`<div class="hdr"><h1>⚠️ 风险登记册</h1><p>识别、评估和追踪项目风险</p></div>`;
  const risks=state.risks;
  const critical=risks.filter(r=>getLevel(r)==='critical').length;
  const high=risks.filter(r=>getLevel(r)==='high').length;
  const open=risks.filter(r=>r.status==='open').length;
  const mitigating=risks.filter(r=>r.status==='mitigating').length;

  h+=`<div class="stats-grid"><div class="stat"><div class="stat-num" style="color:var(--red)">${critical}</div><div class="stat-label">严重风险</div></div><div class="stat"><div class="stat-num" style="color:var(--yellow)">${high+risks.filter(r=>getLevel(r)==='medium').length}</div><div class="stat-label">中高风险</div></div><div class="stat"><div class="stat-num" style="color:var(--accent)">${open}</div><div class="stat-label">待处理</div></div><div class="stat"><div class="stat-num" style="color:var(--green)">${mitigating}</div><div class="stat-label">缓解中</div></div></div>`;

  h+=`<div class="cd"><div class="flex-between"><h2 style="margin:0">📊 风险矩阵</h2><div class="flex"><button onclick="viewMode='table';render()" style="padding:6px 12px;font-size:.8rem;${viewMode==='table'?'':'opacity:.5'}">📋 列表</button><button onclick="viewMode='matrix';render()" style="padding:6px 12px;font-size:.8rem;${viewMode==='matrix'?'':'opacity:.5'}">🗺️ 矩阵</button></div></div>`;
  if(viewMode==='matrix'){
    h+=renderMatrix();
  } else {
    h+=renderTable();
  }
  h+=`</div>`;

  h+=`<div class="cd"><div class="flex-between"><h2 style="margin:0">📝 风险登记</h2><button onclick="openNew()">+ 新风险</button></div></div>`;

  if(showModal)h+=renderModal();
  $('app').innerHTML=h;
}

function renderTable(){
  let h=`<div style="overflow-x:auto"><table class="risk-table"><thead><tr><th>编号</th><th>风险描述</th><th>类别</th><th>概率</th><th>影响</th><th>等级</th><th>状态</th><th>负责人</th><th>操作</th></tr></thead><tbody>`;
  state.risks.sort((a,b)=>getScore(b)-getScore(a)).forEach(r=>{
    h+=`<tr><td><span class="risk-id">${r.id}</span></td><td style="max-width:200px"><strong>${r.title}</strong><div style="font-size:.75rem;color:var(--text2);margin-top:2px">${r.description?.slice(0,60)||''}</div></td><td>${r.category}</td><td style="text-align:center">${r.likelihood}/5</td><td style="text-align:center">${r.impact}/5</td><td><span class="risk-level risk-${getLevel(r)}">${getLevelText(r)} ${getScore(r)}</span></td><td><span class="risk-status status-${r.status}">${{open:'待处理',mitigating:'缓解中',closed:'已关闭'}[r.status]}</span></td><td style="font-size:.8rem">${r.owner}</td><td><div class="flex" style="gap:4px"><button class="sec" onclick="editRisk('${r.id}')" style="padding:3px 8px;font-size:.75rem">✏️</button><button class="dng" onclick="deleteRisk('${r.id}')" style="padding:3px 8px;font-size:.75rem">🗑️</button></div></td></tr>`;
  });
  h+=`</tbody></table></div>`;
  return h;
}

function renderMatrix(){
  const colors={1:'rgba(63,185,80,.2)',2:'rgba(210,153,34,.15)',3:'rgba(210,153,34,.3)',4:'rgba(248,81,73,.15)',5:'rgba(248,81,73,.3)'};
  let h=`<div style="text-align:center;font-size:.85rem;color:var(--text2);margin-bottom:8px">概率 ↑ · 影响 →</div><div class="risk-matrix">`;
  for(let row=5;row>=1;row--){
    h+=`<div class="matrix-label">${row}</div>`;
    for(let col=1;col<=5;col++){
      const score=row*col;
      const bg=score>=15?'rgba(248,81,73,.4)':score>=10?'rgba(248,81,73,.2)':score>=5?'rgba(210,153,34,.25)':'rgba(63,185,80,.2)';
      const risksHere=state.risks.filter(r=>r.likelihood===row&&r.impact===col);
      h+=`<div class="matrix-cell" style="background:${bg}" title="概率${row}×影响${col}=${score}: ${risksHere.map(r=>r.title).join(', ')||'无'}">${risksHere.length||''}</div>`;
    }
  }
  h+=`<div></div>`;for(let i=1;i<=5;i++)h+=`<div class="matrix-label">${i}</div>`;
  h+=`</div><div style="display:flex;gap:12px;justify-content:center;font-size:.75rem;color:var(--text2);margin-top:8px"><span style="color:var(--green)">🟢 低(1-4)</span><span style="color:var(--yellow)">🟡 中(5-9)</span><span style="color:var(--red)">🟠 高(10-14)</span><span style="color:var(--red)">🔴 严重(15+)</span></div>`;
  return h;
}

function renderModal(){
  const isEdit=!!editingRisk?.id;
  const r=editingRisk||{};
  let h=`<div class="modal-overlay" onclick="showModal=false;editingRisk=null;render()"><div class="modal" onclick="event.stopPropagation()">`;
  h+=`<h2 style="margin-bottom:16px">${isEdit?'✏️ 编辑风险':'📝 登记风险'}</h2>`;
  h+=`<label>风险标题</label><input id="mTitle" value="${r.title||''}" placeholder="例：核心开发人员离职">`;
  h+=`<label>描述</label><textarea id="mDesc" placeholder="风险的详细说明">${r.description||''}</textarea>`;
  h+=`<label>类别</label><select id="mCat"><option value="技术" ${r.category==='技术'?'selected':''}>技术</option><option value="人员" ${r.category==='人员'?'selected':''}>人员</option><option value="管理" ${r.category==='管理'?'selected':''}>管理</option><option value="业务" ${r.category==='业务'?'selected':''}>业务</option><option value="外部" ${r.category==='外部'?'selected':''}>外部</option></select>`;
  h+=`<div style="display:flex;gap:12px"><div style="flex:1"><label>概率 (1-5)</label><select id="mProb"><option value="1" ${r.likelihood===1?'selected':''}>1-极低</option><option value="2" ${r.likelihood===2?'selected':''}>2-低</option><option value="3" ${r.likelihood===3?'selected':''}>3-中</option><option value="4" ${r.likelihood===4?'selected':''}>4-高</option><option value="5" ${r.likelihood===5?'selected':''}>5-极高</option></select></div><div style="flex:1"><label>影响 (1-5)</label><select id="mImpact"><option value="1" ${r.impact===1?'selected':''}>1-极低</option><option value="2" ${r.impact===2?'selected':''}>2-低</option><option value="3" ${r.impact===3?'selected':''}>3-中</option><option value="4" ${r.impact===4?'selected':''}>4-高</option><option value="5" ${r.impact===5?'selected':''}>5-极高</option></select></div></div>`;
  h+=`<label>状态</label><select id="mStatus"><option value="open" ${r.status==='open'?'selected':''}>待处理</option><option value="mitigating" ${r.status==='mitigating'?'selected':''}>缓解中</option><option value="closed" ${r.status==='closed'?'selected':''}>已关闭</option></select>`;
  h+=`<label>负责人</label><input id="mOwner" value="${r.owner||''}" placeholder="风险负责人">`;
  h+=`<label>应对策略</label><textarea id="mStrategy" placeholder="如何降低风险发生概率或影响">${r.strategy||''}</textarea>`;
  h+=`<label>应急方案</label><textarea id="mContingency" placeholder="风险发生后如何应对">${r.contingency||''}</textarea>`;
  h+=`<div class="flex" style="margin-top:16px;justify-content:flex-end"><button class="sec" onclick="showModal=false;editingRisk=null;render()">取消</button><button onclick="saveRisk()">${isEdit?'保存':'登记'}</button></div>`;
  h+=`</div></div>`;
  return h;
}

function openNew(){editingRisk={likelihood:3,impact:3,status:'open',category:'技术'};showModal=true;render()}
function editRisk(id){const r=state.risks.find(x=>x.id===id);editingRisk={...r};showModal=true;render()}
function saveRisk(){
  const title=$('mTitle').value.trim();
  if(!title){alert('请输入风险标题');return}
  const risk={
    id:editingRisk?.id||genId(),title,description:$('mDesc').value.trim(),
    category:$('mCat').value,likelihood:parseInt($('mProb').value),impact:parseInt($('mImpact').value),
    status:$('mStatus').value,owner:$('mOwner').value.trim(),
    strategy:$('mStrategy').value.trim(),contingency:$('mContingency').value.trim(),
    identified:editingRisk?.identified||new Date().toISOString().slice(0,10)
  };
  const idx=state.risks.findIndex(x=>x.id===risk.id);
  if(idx>=0)state.risks[idx]=risk;else state.risks.push(risk);
  save();showModal=false;editingRisk=null;render();
}
function deleteRisk(id){if(!confirm('确定删除此风险？'))return;state.risks=state.risks.filter(r=>r.id!==id);save();render()}
render();
</script>
</body>
</html>
