<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文时间追踪器</title>
<meta name="description" content="中文时间追踪器，帮你分析时间都花在哪里了">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-warning{background:var(--yellow);color:#000}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.stat{text-align:center;padding:12px}
.stat-num{font-size:2rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.8rem;color:var(--text2)}
.tag{display:inline-block;padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:.8rem;margin:2px}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.table th{color:var(--text2);font-size:.85rem;font-weight:600}
.table tr:hover{background:rgba(59,130,246,.05)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.hidden{display:none!important}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;white-space:nowrap;color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){background:var(--border)}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="中文时间追踪器">
  <meta property="og:description" content="中文时间追踪器，帮你分析时间都花在哪里了">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/time-tracker-cn/">
</head>
<body>
<div class="container" id="app"></div>
<script>
document.title='⏱️ 中文时间追踪器';

const APP=document.getElementById('app');
let trackers=JSON.parse(localStorage.getItem('tt_data')||'[]');
let running=null, elapsed=0, interval=null;

function save(){localStorage.setItem('tt_data',JSON.stringify(trackers))}
function startTimer(name){
  if(running!==null)return;
  running=name;elapsed=0;
  interval=setInterval(()=>{
    elapsed++;
    document.getElementById('timer-display')&&(document.getElementById('timer-display').textContent=formatTime(elapsed));
  },1000);
  render();
}
function stopTimer(){
  if(running===null)return;
  clearInterval(interval);interval=null;
  let t=trackers.find(x=>x.name===running);
  if(t)t.total+=elapsed;
  else trackers.push({name:running,total:elapsed});
  running=null;elapsed=0;save();render();
}
function formatTime(s){let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function render(){
  let h=`<h1>⏱️ 中文时间追踪器</h1><p class="subtitle">追踪时间分配</p>`;
  if(running!==null){
    h+=`<div class="card" style="text-align:center;border:2px solid var(--accent)"><p style="color:var(--accent)">正在追踪：${running}</p><div id="timer-display" style="font-size:3rem;font-weight:700;margin:12px 0">${formatTime(elapsed)}</div><button class="btn btn-danger" onclick="stopTimer()">停止</button></div>`;
  }
  h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">追踪记录</span><button class="btn btn-sm" onclick="newTracker()">+ 新建追踪</button></div></div>`;
  trackers.forEach((t,i)=>{
    h+=`<div class="card"><div class="flex-between"><b>${t.name}</b><div class="flex"><span style="color:var(--accent);font-weight:700">${formatTime(t.total)}</span><button class="btn btn-sm" onclick="running===null&&startTimer('${t.name}')">▶</button><button class="btn btn-sm btn-danger" onclick="delTracker(${i})">删除</button></div></div></div>`;
  });
  if(!trackers.length&&!running) h+=`<div class="empty">暂无追踪记录</div>`;
  APP.innerHTML=h;
}
function newTracker(){let n=prompt('追踪名称：');if(n){trackers.push({name:n,total:0});save();render()}}
function delTracker(i){if(confirm('删除？')){trackers.splice(i,1);save();render()}}
render();

</script>
<script src="../i18n.js" defer></script>
</body>
</html>
