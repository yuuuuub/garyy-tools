<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商业提案生成器</title>
<meta name="description" content="在线生成专业商业提案文档，支持自定义模板和导出">
<script defer src="../i18n.js"></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth;padding:16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button,textarea{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:80px}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s;display:inline-block;text-align:center}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.preview-box{background:#fff;color:#333;padding:24px;border-radius:var(--radius);border:1px solid #ddd;font-size:.85rem;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.preview-box h3{margin:16px 0 8px;font-size:1rem;border-bottom:1px solid #ddd;padding-bottom:4px}
.output-area{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
@media(max-width:640px){.form-row{flex-direction:column}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="商业提案生成器">
<meta property="og:description" content="在线生成专业商业提案文档">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📋 商业提案生成器</h1>
    <p>快速生成结构化的专业商业提案</p>
  </header>

  <div class="card">
    <div class="section-title">基本信息</div>
    <div class="form-row">
      <div class="group"><label>提案标题</label><input type="text" id="title" value="智能办公平台解决方案"></div>
      <div class="group"><label>提案日期</label><input type="date" id="proposalDate"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>提案方</label><input type="text" id="company" value="示例科技有限公司"></div>
      <div class="group"><label>接收方</label><input type="text" id="client" value="目标企业"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>提案人</label><input type="text" id="author" value="张三"></div>
      <div class="group"><label>有效期（天）</label><input type="number" id="validDays" value="30"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">项目概述</div>
    <div class="form-row">
      <div class="group"><label>背景描述</label><textarea id="background" rows="3">随着企业数字化转型的加速，传统的办公方式已无法满足现代企业高效协作的需求。本提案旨在为贵公司提供一套完整的智能办公解决方案。</textarea></div>
    </div>
    <div class="form-row">
      <div class="group"><label>核心目标</label><textarea id="objectives" rows="3">1. 提升团队协作效率30%以上
2. 降低沟通成本，减少50%的重复沟通
3. 实现文档的智能化管理</textarea></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">解决方案</div>
    <div class="form-row">
      <div class="group"><label>方案描述</label><textarea id="solution" rows="4">我们推荐采用模块化部署方案，包含：
• 智能文档管理模块
• 实时协作办公模块
• AI辅助决策模块
• 数据安全防护模块</textarea></div>
    </div>
    <div class="form-row">
      <div class="group"><label>技术优势</label><textarea id="advantages" rows="3">• 基于云原生架构，支持弹性扩展
• AI驱动的智能分析与推荐
• 端到端数据加密，保障信息安全</textarea></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">报价与周期</div>
    <div class="form-row">
      <div class="group"><label>项目总价（元）</label><input type="number" id="price" value="150000"></div>
      <div class="group"><label>交付周期（天）</label><input type="number" id="duration" value="60"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>付款方式</label>
        <select id="payment">
          <option value="3-3-4">3-3-4分期付款</option>
          <option value="5-5">5-5分期付款</option>
          <option value="全款">全款预付</option>
          <option value="验收后">验收后付款</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="group"><label>服务保障</label><textarea id="warranty" rows="2">• 1年免费维护期
• 7×24小时技术支持
• 定期系统巡检与优化</textarea></div>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" onclick="generate()">生成提案</button>
    <button class="btn btn-green" onclick="copyProposal()">复制</button>
    <button class="btn btn-outline" onclick="downloadProposal()">下载 TXT</button>
  </div>

  <div class="output-area" id="outputArea" style="display:none">
    <div class="section-title">提案预览</div>
    <div class="preview-box" id="preview"></div>
  </div>
</div>

<script>
document.getElementById('proposalDate').value = new Date().toISOString().split('T')[0];

function generate() {
  var d = {
    title: document.getElementById('title').value,
    date: document.getElementById('proposalDate').value,
    company: document.getElementById('company').value,
    client: document.getElementById('client').value,
    author: document.getElementById('author').value,
    validDays: document.getElementById('validDays').value,
    background: document.getElementById('background').value,
    objectives: document.getElementById('objectives').value,
    solution: document.getElementById('solution').value,
    advantages: document.getElementById('advantages').value,
    price: document.getElementById('price').value,
    duration: document.getElementById('duration').value,
    payment: document.getElementById('payment').value,
    warranty: document.getElementById('warranty').value
  };

  var p = '════════════════════════════════════════\n';
  p += '              ' + d.title + '\n';
  p += '════════════════════════════════════════\n\n';
  p += '提案编号: PR-' + Date.now().toString(36).toUpperCase() + '\n';
  p += '提案日期: ' + d.date + '\n';
  p += '提案方: ' + d.company + '\n';
  p += '接收方: ' + d.client + '\n';
  p += '提案人: ' + d.author + '\n';
  p += '有效期: ' + d.date + ' 至 ' + new Date(Date.now() + d.validDays * 86400000).toISOString().split('T')[0] + '\n';
  p += '\n──────────────────────────────────────\n';
  p += '一、项目背景\n──────────────────────────────────────\n\n';
  p += d.background + '\n\n';
  p += '──────────────────────────────────────\n';
  p += '二、核心目标\n──────────────────────────────────────\n\n';
  p += d.objectives + '\n\n';
  p += '──────────────────────────────────────\n';
  p += '三、解决方案\n──────────────────────────────────────\n\n';
  p += d.solution + '\n\n';
  p += '──────────────────────────────────────\n';
  p += '四、技术优势\n──────────────────────────────────────\n\n';
  p += d.advantages + '\n\n';
  p += '──────────────────────────────────────\n';
  p += '五、报价与交付\n──────────────────────────────────────\n\n';
  p += '项目总价: ¥' + Number(d.price).toLocaleString() + '\n';
  p += '交付周期: ' + d.duration + ' 天\n';
  p += '付款方式: ' + d.payment + '\n\n';
  p += '──────────────────────────────────────\n';
  p += '六、服务保障\n──────────────────────────────────────\n\n';
  p += d.warranty + '\n\n';
  p += '════════════════════════════════════════\n';
  p += '提案方签章: ________________\n';
  p += '日期: ' + d.date + '\n';
  p += '════════════════════════════════════════';

  document.getElementById('preview').textContent = p;
  document.getElementById('outputArea').style.display = 'block';
  document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
}

function copyProposal() {
  generate();
  navigator.clipboard.writeText(document.getElementById('preview').textContent).then(function() {
    alert('已复制到剪贴板');
  });
}

function downloadProposal() {
  generate();
  var blob = new Blob([document.getElementById('preview').textContent], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'proposal-' + document.getElementById('title').value + '.txt';
  a.click();
}
</script>
</body>
</html>
