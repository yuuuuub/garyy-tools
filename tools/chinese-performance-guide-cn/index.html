<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国表演艺术指南 - Chinese Performance Art Guide</title>
<meta name="description" content="中国表演艺术指南，涵盖戏曲表演、话剧表演、曲艺表演等各类舞台艺术的技法与鉴赏">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国表演艺术指南 - Chinese Performance Art Guide">
<meta property="og:description" content="中国表演艺术指南，涵盖戏曲表演、话剧表演、曲艺表演等各类舞台艺术的技法与鉴赏">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-performance-guide-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#f87171;--accent2:#ef4444}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#dc2626;--accent2:#b91c1c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0505 0%,#2a0a0a 50%,#3d1010 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a1a1a;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#f87171,#fca5a5,#ef4444,#dc2626);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.perf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.perf-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.perf-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.perf-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.perf-card .pf-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.perf-card .pf-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(248,113,113,0.15);color:var(--accent)}
.perf-card .pf-name{font-size:1.3em;font-weight:bold}
.perf-card .pf-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.perf-card .pf-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.perf-card .pf-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.perf-card .pf-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.perf-card .pf-detail strong{color:var(--text)}
.perf-card .pf-skills{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.perf-card .pf-skills .sk-label{font-size:0.8em;color:var(--accent);margin-bottom:6px}
.perf-card .pf-skills .sk-list{display:flex;flex-wrap:wrap;gap:6px}
.perf-card .pf-skills .sk-tag{font-size:0.75em;padding:3px 10px;border-radius:10px;background:rgba(248,113,113,0.08);color:var(--accent);border:1px solid rgba(248,113,113,0.2)}
.perf-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.perf-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🎭 中国表演艺术指南</h1>
<p>Chinese Performance Art Guide — 探索戏曲、话剧、曲艺等舞台表演艺术的魅力</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索表演类型、技法或流派...（如"唱念做打""体验派""相声"）" title="Enter键搜索">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="戏曲表演">戏曲表演</button>
<button class="filter-btn" data-filter="话剧表演">话剧表演</button>
<button class="filter-btn" data-filter="曲艺表演">曲艺表演</button>
<button class="filter-btn" data-filter="舞台技术">舞台技术</button>
<button class="filter-btn" data-filter="表演理论">表演理论</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="perf-grid" id="perfGrid"></div>
</div>
<footer>中国表演艺术指南 — 粉墨登场 · 舞台人生 · garyy.top</footer>
<script>
const perfData=[
{name:"唱念做打",category:"戏曲表演",icon:"🎭",subtitle:"四功五法",description:"唱念做打是戏曲表演的四种基本功法。唱指歌唱，念指念白，做指身段动作，打指武打技艺。四功配合五法（手眼身法步），构成完整的戏曲表演体系。",skills:["唱功训练","念白技巧","身段表演","武打技艺"]},
{name:"手眼身法步",category:"戏曲表演",icon:"🤲",subtitle:"五法要义",description:"手眼身法步是戏曲表演的五种技法。手指手势，眼指眼神，身指身段，法指法则（即技巧规律），步指步法。五法是戏曲表演的基本功。",skills:["手势表演","眼神运用","身段控制","步法训练"]},
{name:"体验派表演",category:"表演理论",icon:"🎭",subtitle:"斯坦尼斯拉夫斯基体系",description:"体验派强调演员要\"化身\"为角色，通过内心体验来塑造人物。斯坦尼斯拉夫斯基体系是体验派的代表理论，对中国话剧表演影响深远。",skills:["情感记忆","角色分析","情境想象","内心独白"]},
{name:"表现派表演",category:"表演理论",icon:"🎨",subtitle:"布莱希特体系",description:"表现派强调演员与角色保持一定距离，通过外部技巧来表现人物。布莱希特的\"间离效果\"理论是表现派的重要代表。",skills:["间离效果","史诗剧场","社会姿态","陌生化技巧"]},
{name:"相声",category:"曲艺表演",icon:"😂",subtitle:"说学逗唱",description:"相声是中国最具代表性的曲艺形式，以\"说学逗唱\"四门功课为核心。表演形式有单口、对口、群口三种。相声讲究\"包袱\"的设置与抖响。",skills:["说功","学功","逗功","唱功"]},
{name:"评书",category:"曲艺表演",icon:"📖",subtitle:"一人一台戏",description:"评书是北方流行的说唱艺术，表演者一人一台戏，通过说、演、评来讲述历史故事或民间传说。评书讲究\"扣子\"的设置，吸引听众。",skills:["说口","演口","评口","扣子技巧"]},
{name:"京剧武生表演",category:"戏曲表演",icon:"⚔️",subtitle:"靠把武生",description:"京剧武生分为长靠武生和短打武生。长靠武生扎靠持兵器，表现大将风度；短打武生着紧身衣，表现江湖侠客。武生要求唱念做打俱佳。",skills:["扎靠功夫","把子功","毯子功","翻扑技巧"]},
{name:"话剧台词功底",category:"话剧表演",icon:"🎤",subtitle:"声音塑造",description:"话剧演员的台词功底至关重要。包括气息控制、吐字归音、声调运用、情感表达等。好的台词功底能让观众\"听得清、听得懂、听得美\"。",skills:["气息训练","吐字归音","声调控制","情感表达"]},
{name:"丑角表演",category:"戏曲表演",icon:"🤡",subtitle:"插科打诨",description:"丑角是戏曲中的喜剧角色，在鼻梁处画白色豆腐块。丑角表演讲究\"冷幽默\"，通过插科打诨活跃舞台气氛，是戏曲中不可或缺的角色。",skills:["矮子功","扇子功","念白技巧","喜剧节奏"]},
{name:"皮影戏表演",category:"曲艺表演",icon:"🏮",subtitle:"一口道尽千古事",description:"皮影戏是中国古老的民间表演艺术，表演者操纵皮影人物，在幕布后一边操纵一边演唱。\"一口道尽千古事，双手对舞百万兵\"是其生动写照。",skills:["操纵技巧","唱腔表演","灯光控制","人物塑造"]},
{name:"舞台灯光设计",category:"舞台技术",icon:"💡",subtitle:"光影艺术",description:"舞台灯光是现代舞台表演的重要组成部分。通过灯光的明暗、色彩、方向变化，营造舞台氛围，突出表演重点，引导观众视线。",skills:["灯光设计","色彩运用","明暗控制","氛围营造"]},
{name:"舞台化妆技术",category:"舞台技术",icon:"🎨",subtitle:"角色塑造",description:"舞台化妆是表演艺术的重要辅助手段。通过化妆改变演员的面貌特征，塑造角色形象。包括戏曲脸谱、话剧写实化妆、影视特效化妆等。",skills:["基础化妆","角色分析","色彩运用","特殊效果"]},
{name:"昆曲水袖功",category:"戏曲表演",icon:"👔",subtitle:"袖舞翩翩",description:"水袖是昆曲和京剧旦角的重要表演技法。通过水袖的甩、抖、抛、搭等动作，表现人物的内心情感。水袖功要求\"以袖传情，以袖达意\"。",skills:["抖袖","甩袖","抛袖","搭袖"]},
{name:"戏曲毯子功",category:"戏曲表演",icon:"🤸",subtitle:"翻扑跌滚",description:"毯子功是戏曲演员的基本功之一，包括各种翻腾扑跌技巧。如虎跳、前扑、旋子、吊毛等。毯子功是武戏演员的必修课。",skills:["虎跳","前扑","旋子","吊毛"]},
{name:"戏剧导演艺术",category:"表演理论",icon:"🎬",subtitle:"二度创作",description:"导演是戏剧的二度创作者，负责将剧本转化为舞台演出。导演需要处理剧本分析、演员指导、舞台调度、舞美设计等多方面工作。",skills:["剧本分析","演员指导","舞台调度","整体把控"]}
];
function getStats(data){const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});return cats}
function renderStats(data){const stats=getStats(data);document.getElementById('statsOverview').innerHTML=`<div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">表演条目</div></div>`+Object.entries(stats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}
function renderCards(data){document.getElementById('perfGrid').innerHTML=data.map(m=>`<div class="perf-card" data-category="${m.category}"><div class="pf-header"><div class="pf-icon">${m.icon}</div><div><div class="pf-name">${m.name}</div><div class="pf-sub">${m.subtitle}</div></div></div><div class="pf-meta"><span>${m.category}</span></div><div class="pf-detail">${m.description}</div><div class="pf-skills"><div class="sk-label">🎭 核心技能</div><div class="sk-list">${m.skills.map(s=>`<span class="sk-tag">${s}</span>`).join('')}</div></div></div>`).join('')}
function filterCards(){const q=document.getElementById('searchInput').value.toLowerCase();const f=document.querySelector('.filter-btn.active').dataset.filter;const filtered=perfData.filter(m=>{const matchF=f==='all'||m.category===f;const matchQ=!q||m.name.toLowerCase().includes(q)||m.description.toLowerCase().includes(q)||m.subtitle.toLowerCase().includes(q);return matchF&&matchQ});renderCards(filtered);renderStats(filtered)}
document.getElementById('searchInput').addEventListener('input',filterCards);
document.getElementById('filterRow').addEventListener('click',e=>{if(e.target.classList.contains('filter-btn')){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');filterCards()}});
renderCards(perfData);renderStats(perfData);
</script>
</body>
</html>
