<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识问答</title>
<meta name="description" content="知识问答游戏，测试你的百科知识水平">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:15px}
h1{font-size:1.5rem;margin-bottom:15px;color:#3b82f6}
.hud{display:flex;gap:15px;margin-bottom:15px;font-size:0.95rem;flex-wrap:wrap;justify-content:center}
.hud span{background:var(--bg);padding:6px 14px;border-radius:6px;border:1px solid #30363d}
.category{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;justify-content:center}
.category button{padding:6px 14px;border:1px solid #30363d;background:var(--bg);color:var(--text);border-radius:6px;cursor:pointer;font-size:0.85rem}
.category button.active{background:#3b82f6;border-color:#3b82f6}
.question-card{background:var(--bg);border:2px solid #30363d;border-radius:12px;padding:25px;max-width:550px;width:100%;text-align:center;margin-bottom:15px}
.q-num{color:#8b949e;font-size:0.9rem;margin-bottom:8px}
.q-text{font-size:1.2rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:8px;max-width:550px;width:100%}
.opt{padding:14px 18px;background:var(--bg);border:2px solid #30363d;border-radius:8px;cursor:pointer;text-align:left;font-size:1rem;transition:all .2s}
.opt:hover{border-color:#3b82f6}
.opt.correct{background:#166534;border-color:#22c55e}
.opt.wrong{background:#7f1d1d;border-color:#ef4444}
.opt:disabled{cursor:default}
.status{margin-top:12px;font-size:1.05rem;min-height:1.5em}
button.start{padding:10px 28px;border:none;background:#3b82f6;color:var(--text);border-radius:8px;cursor:pointer;font-size:1rem;margin-top:10px}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="知识问答">
  <meta property="og:description" content="知识问答游戏，测试你的百科知识水平">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/trivia-quiz/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<h1>❓ 知识问答</h1>
<div class="category">
<button class="active" onclick="setCat('all',this)">全部</button>
<button onclick="setCat('science',this)">科学</button>
<button onclick="setCat('history',this)">历史</button>
<button onclick="setCat('culture',this)">文化</button>
<button onclick="setCat('nature',this)">自然</button>
</div>
<div class="hud"><span>题目: <b id="qNum">0</b>/10</span><span>得分: <b id="score">0</b></span></div>
<div id="area"></div>
<div class="status" id="status">选择分类开始问答</div>
<button class="start" onclick="start()">开始答题</button>
<script>
const questions=[
  {q:'光在真空中的速度约为多少？',opts:['30万公里/秒','15万公里/秒','50万公里/秒','10万公里/秒'],ans:0,cat:'science'},
  {q:'地球上最大的海洋是？',opts:['大西洋','印度洋','太平洋','北冰洋'],ans:2,cat:'nature'},
  {q:'中国历史上的第一个统一王朝是？',opts:['商朝','周朝','秦朝','汉朝'],ans:2,cat:'history'},
  {q:'水的化学式是？',opts:['CO2','H2O','NaCl','O2'],ans:1,cat:'science'},
  {q:'一年有多少个节气？',opts:['12','24','36','48'],ans:1,cat:'culture'},
  {q:'光合作用主要发生在植物的哪个部位？',opts:['根','茎','叶','花'],ans:2,cat:'nature'},
  {q:'中国最长的河流是？',opts:['黄河','珠江','长江','淮河'],ans:2,cat:'nature'},
  {q:'四大发明不包括以下哪一项？',opts:['造纸术','火药','指南针','望远镜'],ans:3,cat:'history'},
  {q:'人体最大的器官是？',opts:['心脏','肝脏','皮肤','大脑'],ans:2,cat:'science'},
  {q:'端午节是为了纪念谁？',opts:['孔子','屈原','李白','杜甫'],ans:1,cat:'culture'},
  {q:'太阳系中最大的行星是？',opts:['土星','木星','天王星','海王星'],ans:1,cat:'science'},
  {q:'中国象棋棋盘上有多少个交叉点？',opts:['81','90','100','121'],ans:1,cat:'culture'},
  {q:'地球上最深的海沟是？',opts:['马里亚纳海沟','汤加海沟','日本海沟','菲律宾海沟'],ans:0,cat:'nature'},
  {q:'造纸术是谁改进的？',opts:['张衡','蔡伦','毕昇','祖冲之'],ans:1,cat:'history'},
  {q:'人类血液中的红细胞主要功能是？',opts:['杀菌','运输氧气','凝血','免疫'],ans:1,cat:'science'},
  {q:'京剧中的四大行当是？',opts:['唱念做打','生旦净末','吹拉弹唱','琴棋书画'],ans:1,cat:'culture'},
  {q:'世界上最长的城墙是？',opts:['万里长城','柏林墙','哈德良长城','哭墙'],ans:0,cat:'history'},
  {q:'植物进行呼吸作用主要在哪个时段？',opts:['白天','夜晚','白天和夜晚','只有中午'],ans:2,cat:'nature'},
  {q:'DNA的中文全称是？',opts:['脱氧核糖核酸','核糖核酸','氨基酸','脂肪酸'],ans:0,cat:'science'},
  {q:'春节贴春联的习俗起源于？',opts:['唐朝','宋朝','五代十国','明朝'],ans:2,cat:'culture'},
];
let cat='all',currentQ=0,questionsList=[],score=0,answered=false;

function setCat(c,btn){
  cat=c;document.querySelectorAll('.category button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function start(){
  let pool=cat==='all'?[...questions]:questions.filter(q=>q.cat===cat);
  pool.sort(()=>Math.random()-0.5);
  questionsList=pool.slice(0,Math.min(10,pool.length));
  currentQ=0;score=0;answered=false;
  document.getElementById('score').textContent=0;document.getElementById('status').textContent='';
  showQuestion();
}

function showQuestion(){
  if(currentQ>=questionsList.length){
    document.getElementById('area').innerHTML='';
    document.getElementById('qNum').textContent=questionsList.length;
    document.getElementById('status').textContent=`🎉 答题结束！得分: ${score}/${questionsList.length}`;
    return;
  }
  answered=false;
  const q=questionsList[currentQ];
  document.getElementById('qNum').textContent=`${currentQ+1}`;
  const area=document.getElementById('area');
  area.innerHTML=`
    <div class="question-card"><div class="q-num">第 ${currentQ+1}/${questionsList.length} 题</div><div class="q-text">${q.q}</div></div>
    <div class="options" id="opts"></div>`;
  const opts=document.getElementById('opts');
  q.opts.forEach((o,i)=>{
    const btn=document.createElement('button');btn.className='opt';btn.textContent=`${String.fromCharCode(65+i)}. ${o}`;
    btn.onclick=()=>selectAnswer(i,btn);opts.appendChild(btn);
  });
}

function selectAnswer(i,btn){
  if(answered)return;answered=true;
  const q=questionsList[currentQ];
  const btns=document.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  btns[q.ans].classList.add('correct');
  if(i===q.ans){score++;document.getElementById('score').textContent=score}
  else{btn.classList.add('wrong')}
  setTimeout(()=>{currentQ++;showQuestion()},1200);
}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
