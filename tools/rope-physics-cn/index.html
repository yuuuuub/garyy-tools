<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪢 绳索物理</title>
<meta name="description" content="绳索物理 - 实时绳索和链条物理模拟，支持交互拖拽">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪢</text></svg>">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.hdr{text-align:center;margin-bottom:16px}.hdr h1{font-size:1.6rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.canvas-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
canvas{display:block;width:100%;cursor:crosshair}
.controls{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.controls .row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.controls label{font-size:.8rem;color:var(--text2);min-width:80px}
.controls input[type=range]{flex:1;accent-color:var(--accent)}
.controls .val{font-size:.8rem;color:var(--accent);min-width:50px;text-align:right}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.85}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{opacity:.85}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.85}
.btn-warn{background:var(--warn);color:#fff}.btn-warn:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.info-bar{display:flex;gap:16px;justify-content:center;color:var(--text2);font-size:.8rem;padding:8px 0}
.info-bar span{color:var(--accent);font-weight:600}
.hint{color:var(--text2);text-align:center;font-size:.8rem;margin-bottom:8px}</style>
</head>
<body>
<div class="hdr"><h1>🪢 绳索物理</h1><p>实时绳索和链条物理模拟</p></div>

<div class="hint">拖拽任意节点 | 点击空白创建新绳索 | 按住Alt点击节点固定/释放</div>
<div class="canvas-wrap"><canvas id="rope"></canvas></div>

<div class="controls">
<div class="row"><label>节点数量</label><input type="range" min="5" max="60" step="1" value="25" id="nodes"><span class="val">25</span></div>
<div class="row"><label>重力</label><input type="range" min="0" max="2" step="0.05" value="0.5" id="gravity"><span class="val">0.5</span></div>
<div class="row"><label>阻尼</label><input type="range" min="0.9" max="1" step="0.005" value="0.98" id="damping"><span class="val">0.98</span></div>
<div class="row"><label>刚度</label><input type="range" min="0.1" max="1" step="0.05" value="0.8" id="stiffness"><span class="val">0.8</span></div>
<div class="row"><label>线宽</label><input type="range" min="1" max="8" step="1" value="3" id="lineW"><span class="val">3</span></div>
</div>

<div class="btn-row">
<button class="btn btn-primary" onclick="togglePlay()">▶ 播放/暂停</button>
<button class="btn btn-success" onclick="addRope()">➕ 添加绳索</button>
<button class="btn btn-warn" onclick="addChain()">⛓ 添加链条</button>
<button class="btn btn-danger" onclick="clearAll()">🗑 清空</button>
<button class="btn btn-outline" onclick="screenshot()">📷 截图</button>
</div>

<div class="info-bar">FPS: <span id="fps">0</span> | 绳索数: <span id="ropeCount">0</span> | 节点: <span id="nodeCount">0</span></div>

<script>
const canvas=document.getElementById('rope'),ctx=canvas.getContext('2d');
let W,H,playing=true,grav=0.5,damp=0.98,stiff=0.8,lineWidth=3,nodeCount=25;
let ropes=[],dragNode=null,animId,lastTime=0,fpsCount=0,fpsTime=0;

function resize(){const r=canvas.parentElement.getBoundingClientRect();W=canvas.width=r.width;H=canvas.height=Math.min(500,r.width*0.6)}

class Node{
constructor(x,y,fixed=false){this.x=x;this.y=y;this.ox=x;this.oy=y;this.fixed=fixed;this.pinned=fixed}
update(){
if(this.fixed||this.pinned)return;
const vx=(this.x-this.ox)*damp;const vy=(this.y-this.oy)*damp;
this.ox=this.x;this.oy=this.y;
this.x+=vx;this.y+=vy+grav;
if(this.y>H-5){this.y=H-5;this.oy=this.y+vy*0.3}
if(this.x<5){this.x=5;this.ox=5}
if(this.x>W-5){this.x=W-5;this.ox=W-5}
if(this.y<5){this.y=5;this.oy=5}
}
}

class Rope{
constructor(x,y,count,color){
this.nodes=[];this.color=color;this.isChain=false;
for(let i=0;i<count;i++){this.nodes.push(new Node(x,y+i*12,i===0))}
}
addNode(x,y){this.nodes.push(new Node(x,y,false))}
}

class Chain extends Rope{
constructor(x,y,count,color){super(x,y,count,color);this.isChain=true}
}

let colorIdx=0;
const colors=['#3b82f6','#22c55e','#ef4444','#f59e0b','#a855f7','#ec4899','#06b6d4','#f97316'];

function addRope(){
const x=W*0.2+Math.random()*W*0.6;const y=30+Math.random()*100;
ropes.push(new Rope(x,y,nodeCount,colors[colorIdx%colors.length]));colorIdx++;
}
function addChain(){
const x=W*0.2+Math.random()*W*0.6;const y=30+Math.random()*100;
const r=new Chain(x,y,nodeCount,colors[colorIdx%colors.length]);colorIdx++;
ropes.push(r);
}

function clearAll(){ropes=[];colorIdx=0}

function constrain(r){
for(let iter=0;iter<5;iter++){
for(let i=0;i<r.nodes.length-1;i++){
const a=r.nodes[i],b=r.nodes[i+1];
const dx=b.x-a.x,dy=b.y-a.y;
const dist=Math.sqrt(dx*dx+dy*dy);
const target=r.isChain?16:12;
const diff=(dist-target)/dist*stiff;
const ox=dx*diff*0.5,oy=dy*diff*0.5;
if(!a.pinned&&!a.fixed){a.x+=ox;a.y+=oy}
if(!b.pinned&&!b.fixed){b.x-=ox;b.y-=oy}
}
}
if(r.isChain){
for(let i=0;i<r.nodes.length-1;i++){
const a=r.nodes[i],b=r.nodes[i+1];
const dx=b.x-a.x,dy=b.y-a.y;
const dist=Math.sqrt(dx*dx+dy*dy);
const target=16;
if(dist>target){const ratio=target/dist;b.x=a.x+dx*ratio;b.y=a.y+dy*ratio}
}
}
}

function drawRope(r){
ctx.beginPath();ctx.strokeStyle=r.color;ctx.lineWidth=lineWidth;ctx.lineCap='round';ctx.lineJoin='round';
if(r.isChain){
r.nodes.forEach((n,i)=>{
ctx.fillStyle=n.pinned?'#ff0':r.color;
ctx.beginPath();ctx.arc(n.x,n.y,5,0,Math.PI*2);ctx.fill();
if(i>0){ctx.beginPath();ctx.strokeStyle=r.color;ctx.lineWidth=lineWidth-1;ctx.moveTo(r.nodes[i-1].x,r.nodes[i-1].y);ctx.lineTo(n.x,n.y);ctx.stroke()}
});
}else{
if(r.nodes.length<2)return;
ctx.beginPath();ctx.moveTo(r.nodes[0].x,r.nodes[0].y);
for(let i=1;i<r.nodes.length;i++){
const prev=r.nodes[i-1],curr=r.nodes[i];
const mx=(prev.x+curr.x)/2,my=(prev.y+curr.y)/2;
ctx.quadraticCurveTo(prev.x,prev.y,mx,my);
}
ctx.lineTo(r.nodes[r.nodes.length-1].x,r.nodes[r.nodes.length-1].y);
ctx.stroke();
r.nodes.forEach((n,i)=>{
ctx.fillStyle=n.pinned?'#ff0':i===0?'#fff':r.color;
ctx.beginPath();ctx.arc(n.x,n.y,i===0?4:2.5,0,Math.PI*2);ctx.fill();
});
}
}

function animate(t){
if(!playing){animId=requestAnimationFrame(animate);return}
fpsCount++;if(t-fpsTime>1000){document.getElementById('fps').textContent=fpsCount;fpsCount=0;fpsTime=t}

ctx.fillStyle='rgba(10,10,15,0.3)';ctx.fillRect(0,0,W,H);
let totalNodes=0;
ropes.forEach(r=>{
r.nodes.forEach(n=>n.update());
constrain(r);drawRope(r);totalNodes+=r.nodes.length;
});
document.getElementById('ropeCount').textContent=ropes.length;
document.getElementById('nodeCount').textContent=totalNodes;
animId=requestAnimationFrame(animate);
}

function togglePlay(){playing=!playing}

canvas.addEventListener('mousedown',e=>{
const rect=canvas.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
if(e.altKey){
let closest=null,minD=20;
ropes.forEach(r=>r.nodes.forEach(n=>{const d=Math.hypot(n.x-mx,n.y-my);if(d<minD){minD=d;closest=n}}));
if(closest){closest.pinned=!closest.pinned;return}
}
let closest=null,minD=20;
ropes.forEach(r=>r.nodes.forEach(n=>{const d=Math.hypot(n.x-mx,n.y-my);if(d<minD){minD=d;closest=n}}));
if(closest)dragNode=closest;
else{ropes.push(new Rope(mx,my,nodeCount,colors[colorIdx%colors.length]));colorIdx++}
});

canvas.addEventListener('mousemove',e=>{
if(!dragNode)return;
const rect=canvas.getBoundingClientRect();
dragNode.x=e.clientX-rect.left;dragNode.y=e.clientY-rect.top;
dragNode.ox=dragNode.x;dragNode.oy=dragNode.y;
});
canvas.addEventListener('mouseup',()=>dragNode=null);
canvas.addEventListener('mouseleave',()=>dragNode=null);

canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const rect=canvas.getBoundingClientRect();
let closest=null,minD=30;
ropes.forEach(r=>r.nodes.forEach(n=>{const d=Math.hypot(n.x-(t.clientX-rect.left),n.y-(t.clientY-rect.top));if(d<minD){minD=d;closest=n}}));
if(closest)dragNode=closest},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!dragNode)return;const t=e.touches[0];const rect=canvas.getBoundingClientRect();
dragNode.x=t.clientX-rect.left;dragNode.y=t.clientY-rect.top;dragNode.ox=dragNode.x;dragNode.oy=dragNode.y},{passive:false});
canvas.addEventListener('touchend',()=>dragNode=null);

document.getElementById('nodes').oninput=function(){nodeCount=+this.value;this.nextElementSibling.textContent=nodeCount};
document.getElementById('gravity').oninput=function(){grav=+this.value;this.nextElementSibling.textContent=grav};
document.getElementById('damping').oninput=function(){damp=+this.value;this.nextElementSibling.textContent=damp};
document.getElementById('stiffness').oninput=function(){stiff=+this.value;this.nextElementSibling.textContent=stiff};
document.getElementById('lineW').oninput=function(){lineWidth=+this.value;this.nextElementSibling.textContent=lineWidth};

resize();addRope();requestAnimationFrame(animate);
window.addEventListener('resize',resize);
</script>
</body></html>
