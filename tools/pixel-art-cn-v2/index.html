<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:960px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.canvas-wrap{display:flex;justify-content:center;overflow:auto;padding:10px 0;max-height:500px}
canvas#pixelCanvas{image-rendering:pixelated;cursor:crosshair;border:1px solid var(--border);border-radius:8px;background:repeating-conic-gradient(#e0e0e0 0% 25%,#fff 0% 50%) 0 0/20px 20px}
.tool-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tool-btn{padding:8px 12px;border-radius:10px;border:2px solid var(--border);background:var(--card-bg);font-size:13px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.tool-btn:hover{border-color:var(--accent)}
.tool-btn.active{border-color:var(--accent);background:var(--tag-bg);box-shadow:0 0 0 2px var(--accent)}
.palette{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.color-cell{width:26px;height:26px;border-radius:4px;border:2px solid transparent;cursor:pointer;transition:all .15s;image-rendering:pixelated}
.color-cell:hover{transform:scale(1.2)}
.color-cell.active{border-color:var(--text);box-shadow:0 0 0 2px var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
.frames-row{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.frame-thumb{width:64px;height:64px;border:2px solid var(--border);border-radius:8px;cursor:pointer;image-rendering:pixelated;background:var(--input-bg);flex-shrink:0}
.frame-thumb.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.frame-thumb:hover{border-color:var(--accent)}
.frame-btns{display:flex;gap:4px;margin-top:8px}
.frame-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--card-bg);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.frame-btn:hover{border-color:var(--accent)}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.slider-row label{font-size:13px;color:var(--text-secondary);min-width:60px}
.slider-row input[type="range"]{flex:1;accent-color:var(--accent)}
.slider-row span{font-size:13px;color:var(--text-secondary);min-width:30px;text-align:right}
.preview-canvas{image-rendering:pixelated;border:1px solid var(--border);border-radius:8px}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🟦</text></svg>">

<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🟦 像素画编辑器 v2</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">🖼️ 画布</div>
    <div class="canvas-wrap"><canvas id="pixelCanvas" width="480" height="480"></canvas></div>
  </div>

  <div class="card">
    <div class="card-title">🔧 工具</div>
    <div class="tool-bar" id="toolBar"></div>
    <div class="slider-row"><label>网格大小</label><input type="range" min="4" max="32" value="16" id="gridSize" oninput="setGridSize(this.value)"><span id="gridVal">16</span></div>
    <div class="slider-row"><label>画笔大小</label><input type="range" min="1" max="4" value="1" id="pxBrush" oninput="document.getElementById('pxBrushVal').textContent=this.value"><span id="pxBrushVal">1</span></div>
  </div>

  <div class="card">
    <div class="card-title">🎨 调色板</div>
    <div class="palette" id="palette"></div>
  </div>

  <div class="card">
    <div class="card-title">🎬 动画帧</div>
    <div class="frames-row" id="framesRow"></div>
    <div class="frame-btns">
      <button class="frame-btn" onclick="addFrame()" title="添加帧">+</button>
      <button class="frame-btn" onclick="dupFrame()" title="复制帧">📋</button>
      <button class="frame-btn" onclick="delFrame()" title="删除帧">✕</button>
      <button class="frame-btn" onclick="playAnimation()" title="播放" id="playBtn">▶️</button>
      <button class="frame-btn" onclick="stopAnimation()" title="停止">⏹️</button>
    </div>
    <div class="slider-row" style="margin-top:8px"><label>帧速(ms)</label><input type="range" min="50" max="500" value="200" id="frameDelay" oninput="document.getElementById('frameDelayVal').textContent=this.value"><span id="frameDelayVal">200</span></div>
  </div>

  <div class="card">
    <div class="card-title">⚡ 操作</div>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="undo()">↩️ 撤销</button>
      <button class="btn btn-outline" onclick="redo()">↪️ 重做</button>
      <button class="btn btn-outline" onclick="clearFrame()">🗑️ 清空</button>
      <button class="btn btn-outline" onclick="mirrorH()">↔️ 水平翻转</button>
      <button class="btn btn-outline" onclick="mirrorV()">↕️ 垂直翻转</button>
      <button class="btn btn-primary" onclick="exportPNG()">💾 导出PNG</button>
      <button class="btn btn-primary" onclick="exportAllFrames()">🎞️ 导出全部</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🔍 预览</div>
    <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
      <div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">4x 缩放</div><canvas id="preview1x" class="preview-canvas" width="64" height="64"></canvas></div>
      <div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">8x 缩放</div><canvas id="preview2x" class="preview-canvas" width="128" height="128"></canvas></div>
      <div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">原始尺寸</div><canvas id="previewOrig" class="preview-canvas" width="16" height="16"></canvas></div>
    </div>
  </div>

  <footer>🟦 像素画编辑器 v2 - 创造像素艺术</footer>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/i18n-js@3/dist/i18n.min.js" defer></script>
<script>
const C=document.getElementById('pixelCanvas'),ctx=C.getContext('2d');
let grid=16,pixelSize=C.width/grid;
let currentTool='pencil',currentColor='#000000',pxBrush=1;
let frames=[createEmptyFrame()],currentFrame=0;
let history=[],histIdx=-1,maxHist=50;
let isDrawing=false,playing=false,playTimer=null;

const palette=['#000000','#ffffff','#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#3b82f6','#6366f1','#a855f7','#ec4899','#f43f5e','#6b7280','#374151','#1e293b','#fbbf24','#34d399','#60a5fa','#818cf8','#c084fc','#fb7185','#84cc16','#06b6d4','#8b5cf6','#d946ef','#78350f','#166534','#1e3a5f','#581c87','#831843'];
const tools=['pencil','eraser','fill','line','rect','circle','eyedropper','move'];
const toolNames={pencil:'✏️ 铅笔',eraser:'🧽 橡皮',fill:'🪣 填充',line:'📏 直线',rect:'⬜ 矩形',circle:'⭕ 圆形',eyedropper:'💉 吸色',move:'✋ 移动'};

function createEmptyFrame(){const c=document.createElement('canvas');c.width=grid;c.height=grid;return c;}

function init(){
  renderPalette();renderToolBar();renderFrames();saveHist();
  C.addEventListener('mousedown',down);
  C.addEventListener('mousemove',move);
  C.addEventListener('mouseup',up);
  C.addEventListener('mouseleave',up);
  C.addEventListener('touchstart',e=>{e.preventDefault();down({offsetX:Math.floor(e.touches[0].clientX-C.getBoundingClientRect().left/pixelSize),offsetY:Math.floor(e.touches[0].clientY-C.getBoundingClientRect().top/pixelSize),buttons:1})},{passive:false});
  C.addEventListener('touchmove',e=>{e.preventDefault();move({offsetX:Math.floor((e.touches[0].clientX-C.getBoundingClientRect().left)/pixelSize),offsetY:Math.floor((e.touches[0].clientY-C.getBoundingClientRect().top)/pixelSize),buttons:1})},{passive:false});
  C.addEventListener('touchend',()=>up());
  renderCanvas();
}

function renderCanvas(){
  ctx.clearRect(0,0,C.width,C.height);
  const fc=frames[currentFrame].getContext('2d');
  const imgData=fc.getImageData(0,0,grid,grid);
  for(let y=0;y<grid;y++)for(let x=0;x<grid;x++){
    const i=(y*grid+x)*4;
    const[r,g,b,a]=imgData.data.slice(i,i+4);
    if(a===0)continue;
    ctx.fillStyle=`rgba(${r},${g},${b},${a/255})`;
    ctx.fillRect(x*pixelSize,y*pixelSize,pixelSize,pixelSize);
  }
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1;
  for(let x=0;x<=grid;x++){ctx.beginPath();ctx.moveTo(x*pixelSize,0);ctx.lineTo(x*pixelSize,C.height);ctx.stroke();}
  for(let y=0;y<=grid;y++){ctx.beginPath();ctx.moveTo(0,y*pixelSize);ctx.lineTo(C.width,y*pixelSize);ctx.stroke();}
  updatePreview();
}

function renderPalette(){
  const pal=document.getElementById('palette');pal.innerHTML='';
  palette.forEach(c=>{
    const d=document.createElement('div');
    d.className='color-cell'+(currentColor===c?' active':'');
    d.style.background=c;
    d.onclick=()=>{currentColor=c;renderPalette()};
    pal.appendChild(d);
  });
}

function renderToolBar(){
  const bar=document.getElementById('toolBar');bar.innerHTML='';
  tools.forEach(t=>{
    const b=document.createElement('button');
    b.className='tool-btn'+(currentTool===t?' active':'');
    b.textContent=toolNames[t];
    b.onclick=()=>{currentTool=t;renderToolBar()};
    bar.appendChild(b);
  });
}

function renderFrames(){
  const row=document.getElementById('framesRow');row.innerHTML='';
  frames.forEach((f,i)=>{
    const thumb=document.createElement('canvas');
    thumb.className='frame-thumb'+(i===currentFrame?' active':'');
    thumb.width=64;thumb.height=64;
    const tctx=thumb.getContext('2d');
    tctx.imageSmoothingEnabled=false;
    tctx.drawImage(f,0,0,64,64);
    thumb.onclick=()=>{currentFrame=i;renderFrames();renderCanvas()};
    row.appendChild(thumb);
  });
}

function getGridXY(e){
  const rect=C.getBoundingClientRect();
  const cx=e.offsetX!==undefined?e.offsetX:(e.clientX-rect.left);
  const cy=e.offsetY!==undefined?e.offsetY:(e.clientY-rect.top);
  return[Math.floor(cx/pixelSize),Math.floor(cy/pixelSize)];
}

function getPixelData(){return frames[currentFrame].getContext('2d').getImageData(0,0,grid,grid);}
function setPixelData(d){frames[currentFrame].getContext('2d').putImageData(d,0,0);}

function setPixel(x,y,color,erase){
  if(x<0||x>=grid||y<0||y>=grid)return;
  const d=getPixelData();const i=(y*grid+x)*4;
  if(erase){d.data[i+3]=0;}
  else{const c=hexToRgb(color);d.data[i]=c.r;d.data[i+1]=c.g;d.data[i+2]=c.b;d.data[i+3]=255;}
  setPixelData(d);
}

function hexToRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}

let lastPx=0,lastPy=0,startPx=0,startPy=0;
function down(e){
  if(e.buttons!==1)return;
  isDrawing=true;
  const[x,y]=getGridXY(e);lastPx=x;lastPy=y;startPx=x;startPy=y;
  if(currentTool==='pencil'){
    for(let dx=0;dx<pxBrush;dx++)for(let dy=0;dy<pxBrush;dy++)setPixel(x+dx,y+dy,currentColor);
    renderCanvas();
  }else if(currentTool==='eraser'){
    for(let dx=0;dx<pxBrush;dx++)for(let dy=0;dy<pxBrush;dy++)setPixel(x+dx,y+dy,null,true);
    renderCanvas();
  }else if(currentTool==='fill'){
    floodFillGrid(x,y,currentColor);renderCanvas();saveHist();
  }else if(currentTool==='eyedropper'){
    const d=getPixelData();const i=(y*grid+x)*4;
    if(d.data[i+3]>0){const hex='#'+[d.data[i],d.data[i+1],d.data[i+2]].map(v=>v.toString(16).padStart(2,'0')).join('');currentColor=hex;renderPalette();showToast('取色: '+hex);}
    isDrawing=false;
  }
}

function move(e){
  if(!isDrawing)return;
  const[x,y]=getGridXY(e);
  if(currentTool==='pencil'){
    bresenhamLine(lastPx,lastPy,x,y,(px,py)=>{for(let dx=0;dx<pxBrush;dx++)for(let dy=0;dy<pxBrush;dy++)setPixel(px+dx,py+dy,currentColor);});
    renderCanvas();
  }else if(currentTool==='eraser'){
    bresenhamLine(lastPx,lastPy,x,y,(px,py)=>{for(let dx=0;dx<pxBrush;dx++)for(let dy=0;dy<pxBrush;dy++)setPixel(px+dx,py+dy,null,true);});
    renderCanvas();
  }
  lastPx=x;lastPy=y;
}

function up(){
  if(!isDrawing)return;isDrawing=false;saveHist();
}

function bresenhamLine(x0,y0,x1,y1,cb){
  const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0);
  const sx=x0<x1?1:-1,sy=y0<y1?1:-1;
  let err=dx-dy;
  while(true){
    cb(x0,y0);
    if(x0===x1&&y0===y1)break;
    const e2=2*err;
    if(e2>-dy){err-=dy;x0+=sx;}
    if(e2<dx){err+=dx;y0+=sy;}
  }
}

function floodFillGrid(sx,sy,fillColor){
  const d=getPixelData();const fc=hexToRgb(fillColor);
  const idx=(y,x)=>(y*grid+x)*4;
  const sr=d[idx(sy,sx)],sg=d[idx(sy,sx)+1],sb=d[idx(sy,sx)+2],sa=d[idx(sy,sx)+3];
  if(sr===fc.r&&sg===fc.g&&sb===fc.b&&sa===255)return;
  const stack=[[sx,sy]],visited=new Set();
  while(stack.length){
    const[cx,cy]=stack.pop();
    if(cx<0||cx>=grid||cy<0||cy>=grid)continue;
    const key=cy*grid+cx;if(visited.has(key))continue;visited.add(key);
    const i=idx(cy,cx);
    if(Math.abs(d[i]-sr)>2||Math.abs(d[i+1]-sg)>2||Math.abs(d[i+2]-sb)>2||Math.abs(d[i+3]-sa)>2)continue;
    d[i]=fc.r;d[i+1]=fc.g;d[i+2]=fc.b;d[i+3]=255;
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  setPixelData(d);
}

function bresenhamLineShape(x0,y0,x1,y1,cb){
  const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0);
  const sx=x0<x1?1:-1,sy=y0<y1?1:-1;
  let err=dx-dy;
  while(true){cb(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>-dy){err-=dy;x0+=sx;}if(e2<dx){err+=dx;y0+=sy;}}
}

function setGridSize(v){
  grid=parseInt(v);pixelSize=C.width/grid;document.getElementById('gridVal').textContent=v;
  frames=[createEmptyFrame()];currentFrame=0;history=[];histIdx=-1;
  renderCanvas();renderFrames();saveHist();showToast('网格: '+grid+'x'+grid);
}

function addFrame(){frames.push(createEmptyFrame());currentFrame=frames.length-1;renderFrames();renderCanvas();}
function dupFrame(){const c=document.createElement('canvas');c.width=grid;c.height=grid;c.getContext('2d').drawImage(frames[currentFrame],0,0);frames.splice(currentFrame+1,0,c);currentFrame++;renderFrames();renderCanvas();}
function delFrame(){if(frames.length>1){frames.splice(currentFrame,1);if(currentFrame>=frames.length)currentFrame=frames.length-1;renderFrames();renderCanvas();}}

function clearFrame(){
  const fc=frames[currentFrame].getContext('2d');
  fc.clearRect(0,0,grid,grid);renderCanvas();saveHist();showToast('已清空');
}

function mirrorH(){
  const fc=frames[currentFrame].getContext('2d');
  const d=fc.getImageData(0,0,grid,grid);
  const nd=fc.createImageData(grid,grid);
  for(let y=0;y<grid;y++)for(let x=0;x<grid;x++){
    const si=(y*grid+x)*4,di=(y*grid+(grid-1-x))*4;
    nd.data[di]=d.data[si];nd.data[di+1]=d.data[si+1];nd.data[di+2]=d.data[si+2];nd.data[di+3]=d.data[si+3];
  }
  fc.putImageData(nd,0,0);renderCanvas();saveHist();
}

function mirrorV(){
  const fc=frames[currentFrame].getContext('2d');
  const d=fc.getImageData(0,0,grid,grid);
  const nd=fc.createImageData(grid,grid);
  for(let y=0;y<grid;y++)for(let x=0;x<grid;x++){
    const si=(y*grid+x)*4,di=((grid-1-y)*grid+x)*4;
    nd.data[di]=d.data[si];nd.data[di+1]=d.data[si+1];nd.data[di+2]=d.data[si+2];nd.data[di+3]=d.data[si+3];
  }
  fc.putImageData(nd,0,0);renderCanvas();saveHist();
}

function saveHist(){
  const state=frames.map(f=>f.toDataURL());
  history=history.slice(0,histIdx+1);
  history.push({data:state,frame:currentFrame});
  if(history.length>maxHist)history.shift();
  histIdx=history.length-1;
}

function undo(){if(histIdx<=0)return;histIdx--;restoreHist(history[histIdx]);}
function redo(){if(histIdx>=history.length-1)return;histIdx++;restoreHist(history[histIdx]);}

function restoreHist(state){
  frames=state.data.map(d=>{const c=document.createElement('canvas');c.width=grid;c.height=grid;const img=new Image();img.src=d;const tctx=c.getContext('2d');img.onload=()=>{tctx.drawImage(img,0,0);};return c;});
  currentFrame=state.frame;
  setTimeout(()=>{renderFrames();renderCanvas();},100);
}

function updatePreview(){
  [{id:'preview1x',s:4},{id:'preview2x',s:8},{id:'previewOrig',s:1}].forEach(({id,s})=>{
    const pc=document.getElementById(id);
    const pctx=pc.getContext('2d');
    pctx.imageSmoothingEnabled=false;
    pctx.clearRect(0,0,pc.width,pc.height);
    pctx.drawImage(frames[currentFrame],0,0,grid*s,grid*s);
  });
}

function playAnimation(){
  if(playing)return;playing=true;
  const delay=parseInt(document.getElementById('frameDelay').value);
  playTimer=setInterval(()=>{
    currentFrame=(currentFrame+1)%frames.length;
    renderFrames();renderCanvas();
  },delay);
  document.getElementById('playBtn').textContent='⏸️';
}
function stopAnimation(){playing=false;clearInterval(playTimer);document.getElementById('playBtn').textContent='▶️';}

function exportPNG(){
  const pc=document.createElement('canvas');pc.width=grid;pc.height=grid;
  pc.getContext('2d').drawImage(frames[currentFrame],0,0);
  const link=document.createElement('a');link.download='像素画_'+grid+'x'+grid+'_'+Date.now()+'.png';link.href=pc.toDataURL('image/png');link.click();
  showToast('已导出PNG');
}

function exportAllFrames(){
  frames.forEach((f,i)=>{
    const pc=document.createElement('canvas');pc.width=grid;pc.height=grid;
    pc.getContext('2d').drawImage(f,0,0);
    const link=document.createElement('a');link.download='像素画_帧'+(i+1)+'_'+Date.now()+'.png';link.href=pc.toDataURL('image/png');link.click();
  });
  showToast('已导出 '+frames.length+' 帧');
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

function toggleTheme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';document.querySelector('.theme-toggle').textContent=d.dataset.theme==='dark'?'☀️':'🌙';}

document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey){if(e.key==='z'){e.preventDefault();undo();}if(e.key==='y'){e.preventDefault();redo();}if(e.key==='s'){e.preventDefault();exportPNG();}}
  if(!e.ctrlKey&&!e.metaKey){
    const m={p:'pencil',e:'eraser',g:'fill',l:'line',r:'rect',c:'circle',i:'eyedropper'};
    if(m[e.key]){currentTool=m[e.key];renderToolBar();}
  }
});

init();
</script>
</body>
</html>
