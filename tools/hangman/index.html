<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>猜单词</title>
<meta name="description" content="猜单词游戏Hangman，逐个猜字母避免小人被吊">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vhpadding:16px;scroll-behavior:smooth;}
h1{font-size:1.5rem;margin-bottom:10px;color:#3b82f6}
.hangman{margin-bottom:15px}
.hangman svg{width:160px;height:160px}
.word{font-size:2rem;letter-spacing:8px;margin-bottom:15px;font-family:monospace;min-height:2.5rem}
.hint{color:#8b949e;margin-bottom:12px;font-size:0.95rem}
.keyboard{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:500px;margin-bottom:15px}
.key{width:38px;height:38px;background:var(--bg);border:1px solid #30363d;border-radius:6px;color:var(--text);cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center}
.key:hover{border-color:#3b82f6}.key:disabled{opacity:0.3;cursor:default}
.key.correct{background:#166534;border-color:#22c55e}
.key.wrong{background:#7f1d1d;border-color:#ef4444}
.status{font-size:1rem;min-height:1.5em;margin-top:8px}
button{padding:10px 24px;border:none;background:#3b82f6;color:var(--text);border-radius:8px;cursor:pointer;font-size:1rem;margin-top:8px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="猜单词">
  <meta property="og:description" content="猜单词游戏Hangman，逐个猜字母避免小人被吊">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/hangman/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>📝 猜单词</h1>
<div class="hangman" id="hangman"></div>
<div class="word" id="word"></div>
<div class="hint" id="hint"></div>
<div class="keyboard" id="kb"></div>
<div class="status" id="status"></div>
<button onclick="newGame()">新游戏</button>
<script>
const words=[
  {word:'太阳',pinyin:'TAIYANG',hint:'恒星，给我们光和热'},
  {word:'月亮',pinyin:'YUELIANG',hint:'夜空中最亮的天体'},
  {word:'星星',pinyin:'XINGXING',hint:'夜晚闪烁的光点'},
  {word:'海洋',pinyin:'HAIYANG',hint:'地球表面的蓝色区域'},
  {word:'高山',pinyin:'GAOSHAN',hint:'比丘陵更高的地形'},
  {word:'小鸟',pinyin:'XIAONIAO',hint:'会飞的动物'},
  {word:'花朵',pinyin:'HUADUO',hint:'植物的美丽部分'},
  {word:'大树',pinyin:'DASHU',hint:'高大的木本植物'},
  {word:'河流',pinyin:'HELIU',hint:'流动的淡水'},
  {word:'蝴蝶',pinyin:'HUDIE',hint:'彩色翅膀的昆虫'},
  {word:'彩虹',pinyin:'CAIHONG',hint:'雨后的七彩桥梁'},
  {word:'雪花',pinyin:'XUEHUA',hint:'冬天飘落的冰晶'},
  {word:'熊猫',pinyin:'XIONGMAO',hint:'中国的国宝'},
  {word:'老虎',pinyin:'LAOHU',hint:'森林之王'},
  {word:'蜜蜂',pinyin:'MIFENG',hint:'酿蜜的昆虫'},
];
let current,guessed=[],wrong=0,maxWrong=6;

function newGame(){
  const w=words[Math.floor(Math.random()*words.length)];
  current=w;guessed=[];wrong=0;
  drawHangman();renderWord();renderKB();
  document.getElementById('hint').textContent=`提示: ${w.hint}`;
  document.getElementById('status').textContent='';
}

function renderWord(){
  const el=document.getElementById('word');
  el.textContent=current.pinyin.split('').map(c=>guessed.includes(c)?c:'_').join(' ');
}

function renderKB(){
  const el=document.getElementById('kb');el.innerHTML='';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(c=>{
    const b=document.createElement('button');b.className='key';b.textContent=c;
    b.onclick=()=>guess(c);el.appendChild(b);
  });
}

function guess(c){
  if(guessed.includes(c)||wrong>=maxWrong)return;
  guessed.push(c);
  const btn=[...document.querySelectorAll('.key')].find(b=>b.textContent===c);
  if(current.pinyin.includes(c)){btn?.classList.add('correct')}
  else{wrong++;btn?.classList.add('wrong')}
  drawHangman();renderWord();checkEnd();
}

function checkEnd(){
  if(current.pinyin.split('').every(c=>guessed.includes(c))){
    document.getElementById('status').innerHTML=`🎉 正确！答案是 <b>${current.word}</b> (${current.pinyin})`;
    document.querySelectorAll('.key').forEach(b=>b.disabled=true);
  }else if(wrong>=maxWrong){
    document.getElementById('status').innerHTML=`💀 答案是 <b>${current.word}</b> (${current.pinyin})`;
    document.querySelectorAll('.key').forEach(b=>b.disabled=true);
  }
}

function drawHangman(){
  const el=document.getElementById('hangman');
  const parts=['<line x1="20" y1="140" x2="80" y2="140" stroke="#30363d" stroke-width="3"/>',
    '<line x1="50" y1="140" x2="50" y2="30" stroke="#30363d" stroke-width="3"/>',
    '<line x1="50" y1="30" x2="110" y2="30" stroke="#30363d" stroke-width="3"/>',
    '<line x1="110" y1="30" x2="110" y2="50" stroke="#30363d" stroke-width="3"/>',
    '<circle cx="110" cy="60" r="10" stroke="#e6edf3" stroke-width="2" fill="none"/>',
    '<line x1="110" y1="70" x2="110" y2="100" stroke="#e6edf3" stroke-width="2"/>',
    '<line x1="110" y1="80" x2="95" y2="90" stroke="#e6edf3" stroke-width="2"/>',
    '<line x1="110" y1="80" x2="125" y2="90" stroke="#e6edf3" stroke-width="2"/>',
    '<line x1="110" y1="100" x2="100" y2="120" stroke="#e6edf3" stroke-width="2"/>',
    '<line x1="110" y1="100" x2="120" y2="120" stroke="#e6edf3" stroke-width="2"/>'];
  el.innerHTML=`<svg viewBox="0 0 160 150">${parts.slice(0,wrong).join('')}</svg>`;
}

newGame();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
