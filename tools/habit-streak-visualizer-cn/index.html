<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 习惯连续可视化</title>
<meta name="description" content="习惯连续可视化工具，追踪习惯连续天数，激发坚持动力">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,button{font-family:inherit;font-size:.95rem}
input[type=text]{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.es{text-align:center;padding:40px;color:var(--text2)}
.habit-card{padding:16px;border-bottom:1px solid var(--border)}
.habit-card:last-child{border-bottom:none}
.habit-header{display:flex;justify-content:space-between;align-items:center}
.habit-header .name{font-weight:700;font-size:1.1rem}
.habit-header .streak{font-size:1.5rem;font-weight:700;color:var(--warn)}
.habit-meta{font-size:.8rem;color:var(--text2);margin-top:4px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal-day{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--text2);cursor:pointer;transition:all .2s}
.cal-day:hover{transform:scale(1.1)}
.cal-day.done{background:var(--success);color:#fff}
.cal-day.miss{background:var(--danger);opacity:.2}
.cal-day.future{background:var(--bg)}
.cal-day.today{border:2px solid var(--accent)}
.cal-day.l1{background:rgba(34,197,94,.2)}.cal-day.l2{background:rgba(34,197,94,.4)}.cal-day.l3{background:rgba(34,197,94,.6)}.cal-day.l4{background:var(--success);color:#fff}
.fire{font-size:2rem;text-align:center;margin:12px 0}
.fire .num{font-size:3rem;font-weight:700;color:var(--warn)}
.legend{display:flex;gap:12px;font-size:.75rem;color:var(--text2);margin-top:8px;justify-content:center}
.legend span{display:flex;align-items:center;gap:4px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}.fire .num{animation:pulse 2s infinite}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔥 习惯连续可视化">
<meta property="og:description" content="习惯连续可视化工具，追踪习惯连续天数">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🔥 习惯连续可视化</h1><p>追踪习惯连续天数，激发坚持动力</p></div>

<div class="cd"><h2>添加习惯</h2>
<input type="text" id="habitInput" placeholder="如：早起、健身、阅读" onkeydown="if(event.key==='Enter')addHabit()">
<div class="bg"><button onclick="addHabit()">添加习惯</button></div></div>

<div class="cd" id="bestCard"><h2>🏆 最佳连续</h2>
<div id="bestStreak" class="fire"></div></div>

<div class="cd"><h2>今日打卡</h2><div id="todayList"></div></div>

<div class="cd"><h2>连续记录</h2><div id="streakList"></div>
<div class="legend">
  <span><span style="width:10px;height:10px;border-radius:2px;display:inline-block;background:rgba(34,197,94,.2)"></span>1-7天</span>
  <span><span style="width:10px;height:10px;border-radius:2px;display:inline-block;background:rgba(34,197,94,.4)"></span>8-30天</span>
  <span><span style="width:10px;height:10px;border-radius:2px;display:inline-block;background:rgba(34,197,94,.6)"></span>31-99天</span>
  <span><span style="width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--success)"></span>100+天</span>
</div></div>

<div class="cd"><h2>统计</h2><div class="gr" id="stats"></div>
<div class="bg"><button class="sec" onclick="clearAll()">清空全部</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let habits=JSON.parse(localStorage.getItem('hsv_habits')||'[]');
const today=()=>new Date().toISOString().slice(0,10);

function save(){localStorage.setItem('hsv_habits',JSON.stringify(habits));}

function addHabit(){
  const name=$('habitInput').value.trim();
  if(!name){alert('请输入习惯名称');return;}
  habits.push({id:Date.now(),name,created:today(),checkins:{}});
  save();render();$('habitInput').value='';
}

function toggleCheckin(id){
  const h=habits.find(x=>x.id===id);
  if(!h)return;
  const d=today();
  h.checkins[d]=!h.checkins[d];
  if(!h.checkins[d])delete h.checkins[d];
  save();render();
}

function deleteHabit(id){habits=habits.filter(x=>x.id!==id);save();render();}
function clearAll(){habits=[];save();render();}

function getStreak(h){
  let streak=0,d=new Date();
  while(true){
    const ds=d.toISOString().slice(0,10);
    if(h.checkins[ds]){streak++;d.setDate(d.getDate()-1);}else break;
  }
  return streak;
}

function getBestStreak(h){
  const dates=Object.keys(h.checkins).sort();
  if(!dates.length)return 0;
  let best=1,current=1;
  for(let i=1;i<dates.length;i++){
    const prev=new Date(dates[i-1]),curr=new Date(dates[i]);
    if((curr-prev)/86400000===1){current++;best=Math.max(best,current);}else current=1;
  }
  return best;
}

function getTotal(h){return Object.keys(h.checkins).length;}

function getLevel(streak){
  if(streak>=100)return 4;if(streak>=31)return 3;if(streak>=8)return 2;if(streak>=1)return 1;return 0;
}

function render(){
  const d=today();
  const bestHabit=habits.reduce((best,h)=>!best||getStreak(h)>getStreak(best)?h:best,null);
  const overallBest=habits.reduce((s,h)=>Math.max(s,getBestStreak(h)),0);
  
  $('bestStreak').innerHTML=bestHabit&&getStreak(bestHabit)>0
    ?`<div>🔥</div><div class="num">${getStreak(bestHabit)}</div><div style="color:var(--text2)">${bestHabit.name}</div>`
    :`<div style="color:var(--text2)">开始打卡，创造连续记录！</div><div class="num" style="color:var(--text2)">0</div>`;
  
  $('todayList').innerHTML=habits.length?habits.map(h=>{
    const checked=h.checkins[d];
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border)">
      <div><strong>${h.name}</strong><div style="font-size:.8rem;color:var(--text2)">连续 ${getStreak(h)} 天</div></div>
      <div style="display:flex;gap:6px">
        <button style="${checked?'background:var(--success)':''}" onclick="toggleCheckin(${h.id})">${checked?'✓':'打卡'}</button>
        <button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="deleteHabit(${h.id})">删</button>
      </div>
    </div>`;
  }).join(''):'<div class="es">请先添加习惯</div>';
  
  $('streakList').innerHTML=habits.length?habits.map(h=>{
    const streak=getStreak(h);
    const last30=[];
    const nd=new Date();
    for(let i=29;i>=0;i--){
      const dd=new Date(nd);dd.setDate(dd.getDate()-i);
      const ds=dd.toISOString().slice(0,10);
      last30.push({date:ds.slice(5),done:!!h.checkins[ds],today:ds===d,level:getLevel(streak)});
    }
    return`<div class="habit-card">
      <div class="habit-header">
        <span class="name">${h.name}</span>
        <span class="streak">🔥 ${streak}</span>
      </div>
      <div class="habit-meta">历史最佳: ${getBestStreak(h)}天 · 总计: ${getTotal(h)}天</div>
      <div class="calendar">${last30.map(day=>
        `<div class="cal-day ${day.done?'done l'+day.level:day.today?'today':'future'}" title="${day.date}">${day.date.split('-')[1]+'/'+day.date.split('-')[0]}</div>`
      ).join('')}</div>
    </div>`;
  }).join(''):'<div class="es">暂无数据</div>';
  
  const total=habits.length,totalCheckins=habits.reduce((s,h)=>s+getTotal(h),0);
  const avgStreak=habits.length?Math.round(habits.reduce((s,h)=>s+getStreak(h),0)/habits.length):0;
  $('stats').innerHTML=`
    <div class="st"><div class="nm">${total}</div><div class="lb">习惯数</div></div>
    <div class="st"><div class="nm" style="color:var(--success)">${totalCheckins}</div><div class="lb">总打卡</div></div>
    <div class="st"><div class="nm" style="color:var(--warn)">${overallBest}</div><div class="lb">最佳连续</div></div>
    <div class="st"><div class="nm" style="color:var(--accent)">${avgStreak}</div><div class="lb">平均连续</div></div>`;
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
