<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线框图构建器</title>
<meta name="description" content="快速创建UI线框图和页面原型，拖拽式操作">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0;line-height:1.6}
#sidebar{position:fixed;top:0;left:0;width:200px;height:100vh;background:var(--card);border-right:1px solid var(--border);padding:16px;overflow-y:auto;z-index:100}
#sidebar h3{font-size:.85rem;color:var(--text2);margin:16px 0 8px;text-transform:uppercase;letter-spacing:1px}
#sidebar .widget{padding:10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;cursor:grab;font-size:.85rem;transition:all .2s;display:flex;align-items:center;gap:8px}
#sidebar .widget:hover{border-color:var(--accent);background:rgba(59,130,246,.1)}
#sidebar .widget .icon{width:28px;height:28px;background:var(--bg);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px}
#toolbar-top{position:fixed;top:0;left:200px;right:0;height:48px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px;z-index:100}
#toolbar-top button{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;transition:var(--transition)}
#toolbar-top button:hover{border-color:var(--accent);color:var(--accent)}
#toolbar-top button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#toolbar-top .sep{width:1px;height:24px;background:var(--border)}
#canvas{position:fixed;top:48px;left:200px;right:0;bottom:0;background:var(--bg);overflow:auto}
#artboard{width:375px;min-height:812px;margin:40px auto;background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.3);position:relative;overflow:hidden}
.wf-el{position:absolute;cursor:move;border:2px dashed transparent;transition:border-color .15s;user-select:none}
.wf-el:hover{border-color:var(--accent)}
.wf-el.selected{border-color:var(--accent);box-shadow:0 0 8px rgba(59,130,246,.3)}
.wf-el .resize{position:absolute;bottom:-4px;right:-4px;width:10px;height:10px;background:var(--accent);border-radius:2px;cursor:se-resize;display:none}
.wf-el.selected .resize{display:block}
.wf-text{padding:8px;font-size:14px;color:#333;font-family:inherit;white-space:pre-wrap;min-width:60px;min-height:30px}
.wf-rect{background:#e5e7eb;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#666;font-size:13px}
.wf-btn{background:var(--accent);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.wf-img{background:#e5e7eb;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#999;font-size:24px}
.wf-input{background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:8px 12px;color:#333;font-size:13px}
.wf-nav{background:#1f2937;color:#fff;border-radius:0;padding:12px 16px;font-size:14px;font-weight:600}
.wf-status{background:#000;color:#fff;border-radius:16px;padding:4px 12px;font-size:11px;display:inline-flex;align-items:center;gap:4px}
#props{position:fixed;right:0;top:48px;width:220px;height:calc(100vh - 48px);background:var(--card);border-left:1px solid var(--border);padding:16px;overflow-y:auto;z-index:100}
#props h3{font-size:.85rem;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
#props label{display:block;font-size:.8rem;color:var(--text2);margin:8px 0 4px}
#props input,#props select{width:100%;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85rem}
#props input:focus,#props select:focus{outline:none;border-color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="线框图构建器">
<meta property="og:description" content="快速创建UI线框图和页面原型">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:208px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div id="sidebar">
  <h3>组件</h3>
  <div class="widget" draggable="true" data-type="text"><div class="icon">T</div>文本</div>
  <div class="widget" draggable="true" data-type="rect"><div class="icon">▢</div>矩形</div>
  <div class="widget" draggable="true" data-type="btn"><div class="icon">▣</div>按钮</div>
  <div class="widget" draggable="true" data-type="img"><div class="icon">🖼</div>图片占位</div>
  <div class="widget" draggable="true" data-type="input"><div class="icon">▭</div>输入框</div>
  <div class="widget" draggable="true" data-type="nav"><div class="icon">☰</div>导航栏</div>
  <div class="widget" draggable="true" data-type="status"><div class="icon">●</div>状态栏</div>
  <h3>模板</h3>
  <div class="widget" onclick="loadTemplate('login')" style="cursor:pointer"><div class="icon">📄</div>登录页</div>
  <div class="widget" onclick="loadTemplate('profile')" style="cursor:pointer"><div class="icon">📄</div>个人中心</div>
  <div class="widget" onclick="loadTemplate('list')" style="cursor:pointer"><div class="icon">📄</div>列表页</div>
</div>
<div id="toolbar-top">
  <b>📐 线框图</b>
  <div class="sep"></div>
  <button onclick="undo()" title="撤销">↩ 撤销</button>
  <button onclick="redo()" title="重做">↪ 重做</button>
  <div class="sep"></div>
  <button onclick="deleteSelected()" title="删除">🗑 删除</button>
  <button onclick="duplicateSelected()" title="复制">📋 复制</button>
  <div class="sep"></div>
  <button onclick="exportPNG()">导出PNG</button>
  <button onclick="exportJSON()">导出JSON</button>
  <button onclick="importJSON()">导入JSON</button>
</div>
<div id="canvas"><div id="artboard"></div></div>
<div id="props"><h3>属性</h3><div id="props-content"><p style="color:var(--text2);font-size:.85rem">选择一个元素编辑属性</p></div></div>

<script>
document.title='📐 线框图构建器';
const artboard=document.getElementById('artboard');
const propsContent=document.getElementById('props-content');
let elements=[];
let selected=null;
let history=[];
let historyIdx=-1;
let dragType=null;
let dragging=false,dragOff={x:0,y:0};
let resizing=false;

function saveState(){history=history.slice(0,historyIdx+1);history.push(JSON.parse(JSON.stringify(elements)));historyIdx++;if(history.length>50){history.shift();historyIdx--}}
function undo(){if(historyIdx>0){historyIdx--;elements=JSON.parse(JSON.stringify(history[historyIdx]));selected=null;render();updateProps()}}
function redo(){if(historyIdx<history.length-1){historyIdx++;elements=JSON.parse(JSON.stringify(history[historyIdx]));selected=null;render();updateProps()}}

function render(){
  artboard.innerHTML='';
  elements.forEach((el,i)=>{
    let div=document.createElement('div');
    div.className='wf-el'+(selected===i?' selected':'');
    div.style.left=el.x+'px';div.style.top=el.y+'px';
    div.style.width=el.w+'px';div.style.height=el.h+'px';
    if(el.type==='text'){
      div.innerHTML=`<div class="wf-text" contenteditable="true" style="width:100%;height:100%;outline:none">${el.text||'文本内容'}</div>`;
      div.querySelector('[contenteditable]').addEventListener('blur',e=>{elements[i].text=e.target.innerText;saveState()});
    } else if(el.type==='rect'){
      div.innerHTML=`<div class="wf-rect" style="width:100%;height:100%">${el.text||'矩形'}</div>`;
    } else if(el.type==='btn'){
      div.innerHTML=`<div class="wf-btn" style="width:100%;height:100%">${el.text||'按钮'}</div>`;
    } else if(el.type==='img'){
      div.innerHTML=`<div class="wf-img" style="width:100%;height:100%">🖼</div>`;
    } else if(el.type==='input'){
      div.innerHTML=`<div class="wf-input" style="width:100%;height:100%">${el.placeholder||'请输入...'}</div>`;
    } else if(el.type==='nav'){
      div.innerHTML=`<div class="wf-nav" style="width:100%;height:100%">${el.text||'导航栏'}</div>`;
    } else if(el.type==='status'){
      div.innerHTML=`<div class="wf-status" style="width:100%;height:100%;justify-content:center">${el.text||'9:41'}</div>`;
    }
    let resize=document.createElement('div');
    resize.className='resize';
    div.appendChild(resize);
    div.addEventListener('mousedown',e=>{
      if(e.target.className==='resize'){resizing=true;selected=i;render();updateProps();return}
      e.stopPropagation();
      selected=i;dragging=true;
      dragOff={x:e.clientX-el.x,y:e.clientY-el.y};
      render();updateProps();
    });
    resize.addEventListener('mousedown',e=>{
      e.stopPropagation();resizing=true;selected=i;
      let startX=e.clientX,startY=e.clientY,startW=el.w,startH=el.h;
      const onMove=ev=>{el.w=Math.max(40,startW+ev.clientX-startX);el.h=Math.max(20,startH+ev.clientY-startY);render()};
      const onUp=()=>{resizing=false;saveState();document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp)};
      document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    });
    artboard.appendChild(div);
  });
}

function updateProps(){
  if(selected===null||selected>=elements.length){propsContent.innerHTML='<p style="color:var(--text2);font-size:.85rem">选择一个元素编辑属性</p>';return}
  let el=elements[selected];
  propsContent.innerHTML=`
    <label>类型</label><input value="${el.type}" disabled>
    <label>X</label><input type="number" value="${el.x}" onchange="elements[${selected}].x=+this.value;saveState();render()">
    <label>Y</label><input type="number" value="${el.y}" onchange="elements[${selected}].y=+this.value;saveState();render()">
    <label>宽度</label><input type="number" value="${el.w}" onchange="elements[${selected}].w=+this.value;saveState();render()">
    <label>高度</label><input type="number" value="${el.h}" onchange="elements[${selected}].h=+this.value;saveState();render()">
    <label>文字</label><input value="${el.text||''}" onchange="elements[${selected}].text=this.value;saveState();render()">
    <button onclick="deleteSelected()" style="margin-top:12px;width:100%;padding:8px;background:var(--red);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.85rem">删除</button>
  `;
}

function deleteSelected(){if(selected!==null){elements.splice(selected,1);selected=null;saveState();render();updateProps()}}
function duplicateSelected(){if(selected!==null){let el=JSON.parse(JSON.stringify(elements[selected]));el.x+=20;el.y+=20;elements.push(el);selected=elements.length-1;saveState();render();updateProps()}}

document.querySelectorAll('.widget[draggable]').forEach(w=>{
  w.addEventListener('dragstart',e=>{dragType=e.target.dataset.type;e.dataTransfer.effectAllowed='copy'});
});

artboard.addEventListener('dragover',e=>e.preventDefault());
artboard.addEventListener('drop',e=>{
  e.preventDefault();
  if(!dragType)return;
  let rect=artboard.getBoundingClientRect();
  let x=e.clientX-rect.left+artboard.parentElement.scrollLeft;
  let y=e.clientY-rect.top+artboard.parentElement.scrollTop;
  let defaults={text:{w:200,h:40,text:'文本内容'},rect:{w:200,h:100,text:'矩形'},btn:{w:120,h:40,text:'按钮'},img:{w:200,h:150},input:{w:200,h:40,placeholder:'请输入...'},nav:{w:375,h:50,text:'导航栏'},status:{w:375,h:44,text:'9:41'}};
  let d=defaults[dragType]||{w:100,h:50};
  elements.push({type:dragType,x,y,...d});
  selected=elements.length-1;dragType=null;saveState();render();updateProps();
});

artboard.addEventListener('click',e=>{if(e.target===artboard){selected=null;render();updateProps()}});

function loadTemplate(name){
  elements=[];
  if(name==='login'){
    elements=[{type:'status',x:0,y:0,w:375,h:44,text:'9:41'},{type:'text',x:100,y:200,w:175,h:40,text:'欢迎登录'},{type:'input',x:50,y:280,w:275,h:44,placeholder:'请输入手机号'},{type:'input',x:50,y:340,w:275,h:44,placeholder:'请输入密码'},{type:'btn',x:50,y:410,w:275,h:48,text:'登录'},{type:'text',x:100,y:480,w:175,h:30,text:'忘记密码？'}];
  } else if(name==='profile'){
    elements=[{type:'status',x:0,y:0,w:375,h:44,text:'9:41'},{type:'nav',x:0,y:44,w:375,h:50,text:'个人中心'},{type:'img',x:137,y:120,w:100,h:100},{type:'text',x:100,y:240,w:175,h:30,text:'用户名'},{type:'text',x:50,y:300,w:275,h:30,text:'编辑资料'},{type:'rect',x:50,y:360,w:275,h:60,text:'我的订单'},{type:'rect',x:50,y:430,w:275,h:60,text:'设置'}];
  } else if(name==='list'){
    elements=[{type:'status',x:0,y:0,w:375,h:44,text:'9:41'},{type:'nav',x:0,y:44,w:375,h:50,text:'列表'},{type:'rect',x:16,y:110,w:343,h:80,text:'列表项 1'},{type:'rect',x:16,y:200,w:343,h:80,text:'列表项 2'},{type:'rect',x:16,y:290,w:343,h:80,text:'列表项 3'},{type:'rect',x:16,y:380,w:343,h:80,text:'列表项 4'}];
  }
  selected=null;saveState();render();updateProps();
}

function exportPNG(){
  let canvas=document.createElement('canvas');
  canvas.width=750;canvas.height=1624;
  let ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,750,1624);
  ctx.scale(2,2);
  elements.forEach(el=>{
    ctx.fillStyle=el.type==='nav'?'#1f2937':el.type==='btn'?'#3b82f6':el.type==='status'?'#000':'#e5e7eb';
    ctx.fillRect(el.x,el.y,el.w,el.h);
    ctx.fillStyle='#333';ctx.font='13px sans-serif';
    if(el.text)ctx.fillText(el.text,el.x+8,el.y+el.h/2+4);
  });
  canvas.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wireframe.png';a.click()});
}

function exportJSON(){
  let blob=new Blob([JSON.stringify(elements,null,2)],{type:'application/json'});
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wireframe.json';a.click();
}

function importJSON(){
  let input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{let r=new FileReader();r.onload=ev=>{elements=JSON.parse(ev.target.result);selected=null;saveState();render();updateProps()};r.readAsText(e.target.files[0])};
  input.click();
}

document.addEventListener('keydown',e=>{
  if(e.key==='Delete'||e.key==='Backspace')deleteSelected();
  if(e.ctrlKey&&e.key==='z'){e.preventDefault();undo()}
  if(e.ctrlKey&&e.key==='y'){e.preventDefault();redo()}
  if(e.ctrlKey&&e.key==='d'){e.preventDefault();duplicateSelected()}
});

saveState();render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
