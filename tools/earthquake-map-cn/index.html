<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 全球地震地图</title>
<meta property="og:title" content="🌍 全球地震地图">
<meta property="og:description" content="🌍 全球地震地图 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="全球地震地图 - 实时地震数据可视化、震级筛选、历史地震统计">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;line-height:1.4}
.hdr{text-align:center;margin-bottom:16px}.hdr h1{font-size:1.6rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.controls{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.controls select{padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.8rem;outline:none}
.btn{padding:6px 14px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.map-container{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
canvas{display:block;width:100%;cursor:crosshair}
.legend{position:absolute;bottom:8px;right:8px;background:rgba(22,27,34,0.9);border-radius:8px;padding:8px 12px;font-size:.7rem}
.legend-item{display:flex;align-items:center;gap:6px;margin:3px 0}
.legend-dot{width:10px;height:10px;border-radius:50%}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.stat-card .num{font-size:1.3rem;font-weight:700}
.stat-card .label{font-size:.75rem;color:var(--text2);margin-top:4px}
.eq-list{margin-top:16px;max-height:400px;overflow-y:auto}
.eq-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.eq-item:hover{border-color:var(--accent)}
.eq-item .mag{font-size:1.2rem;font-weight:700;float:right}
.eq-item .place{font-size:.9rem;font-weight:600}
.eq-item .time{font-size:.75rem;color:var(--text2);margin-top:4px}
.eq-item .depth{font-size:.75rem;color:var(--text2)}
.mag-low{color:var(--success)}.mag-mid{color:var(--warn)}.mag-high{color:var(--danger)}
.tooltip{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.8rem;pointer-events:none;display:none;z-index:100;max-width:250px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="hdr"><h1>🌍 全球地震地图</h1><p>USGS实时地震数据可视化</p></div>
<div class="controls">
<select id="magFilter" onchange="filterQuakes()">
<option value="0">所有震级</option>
<option value="2.5" selected>≥2.5 有感地震</option>
<option value="4.5">≥4.5 中强震</option>
<option value="6">≥6.0 强震</option>
</select>
<select id="timeFilter" onchange="loadData()">
<option value="day">过去24小时</option>
<option value="week" selected>过去7天</option>
<option value="month">过去30天</option>
</select>
<button class="btn btn-primary" onclick="loadData()">刷新数据</button>
</div>
<div class="stats-grid" id="statsGrid"></div>
<div class="map-container">
<canvas id="mapCanvas"></canvas>
<div class="legend">
<div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div> &lt;3.0</div>
<div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> 3.0-5.0</div>
<div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> &gt;5.0</div>
</div>
<div class="tooltip" id="tooltip"></div>
</div>
<div class="eq-list" id="eqList"></div>

<script>
let canvas,ctx,quakes=[],filteredQuakes=[];
let W,H;

const demoQuakes=[
{mag:6.2,place:'日本本州东部海域',time:Date.now()-3600000,lat:36.5,lon:140.5,depth:35},
{mag:5.1,place:'智利中部海岸',time:Date.now()-7200000,lat:-33.1,lon:-71.6,depth:28},
{mag:4.8,place:'印度尼西亚苏门答腊',time:Date.now()-10800000,lat:-0.5,lon:100.4,depth:42},
{mag:3.2,place:'美国加利福尼亚',time:Date.now()-14400000,lat:34.1,lon:-118.2,depth:12},
{mag:2.7,place:'冰岛雷克雅未克',time:Date.now()-18000000,lat:64.1,lon:-21.9,depth:8},
{mag:7.1,place:'墨西哥瓦哈卡州',time:Date.now()-21600000,lat:16.5,lon:-96.3,depth:55},
{mag:4.3,place:'新西兰北岛',time:Date.now()-25200000,lat:-38.5,lon:176.3,depth:30},
{mag:3.8,place:'土耳其安塔利亚',time:Date.now()-28800000,lat:36.9,lon:30.7,depth:15},
{mag:5.5,place:'菲律宾棉兰老岛',time:Date.now()-32400000,lat:7.1,lon:126.3,depth:60},
{mag:2.9,place:'中国四川省',time:Date.now()-36000000,lat:30.5,lon:103.4,depth:18},
{mag:4.1,place:'秘鲁利马',time:Date.now()-39600000,lat:-12.0,lon:-77.0,depth:25},
{mag:6.8,place:'巴布亚新几内亚',time:Date.now()-43200000,lat:-5.8,lon:148.2,depth:48},
{mag:3.5,place:'意大利那不勒斯',time:Date.now()-46800000,lat:40.8,lon:14.3,depth:10},
{mag:5.3,place:'伊朗南部',time:Date.now()-50400000,lat:27.2,lon:54.3,depth:38},
{mag:2.5,place:'美国阿拉斯加',time:Date.now()-54000000,lat:61.2,lon:-149.9,depth:20},
{mag:4.6,place:'台湾花莲',time:Date.now()-57600000,lat:23.9,lon:121.6,depth:15},
{mag:3.1,place:'希腊克里特岛',time:Date.now()-61200000,lat:35.2,lon:24.9,depth:22},
{mag:5.8,place:'印度尼西亚爪哇',time:Date.now()-64800000,lat:-7.5,lon:110.4,depth:30},
{mag:2.8,place:'美国德克萨斯',time:Date.now()-68400000,lat:31.5,lon:-100.4,depth:5},
{mag:4.0,place:'哥伦比亚波哥大',time:Date.now()-72000000,lat:4.6,lon:-74.1,depth:28}
];

const continents=[
[[168,72],[180,72],[180,18],[168,18]],[[352,72],[380,72],[380,56],[352,56]],
[[10,68],[40,68],[52,45],[42,36],[28,36],[15,55],[10,68]],[[42,36],[52,45],[55,45],[65,25],[48,12],[42,36]],
[[65,25],[100,40],[140,40],[145,35],[130,20],[100,10],[65,25]],[[145,55],[180,55],[180,33],[145,33]],
[[-170,65],[-140,65],[-130,55],[-125,50],[-120,35],[-105,25],[-100,18],[-85,8],[-80,8],[-78,18],[-75,10],[-80,5],[-100,18],[-105,25],[-120,35],[-125,50],[-140,55],[-165,55],[-170,65]],
[[-82,10],[-60,12],[-35,-5],[-40,-22],[-55,-35],[-70,-55],[-75,-45],[-70,-18],[-82,10]]
];

function initCanvas(){
canvas=document.getElementById('mapCanvas');
ctx=canvas.getContext('2d');
const dpr=window.devicePixelRatio||1;
W=canvas.parentElement.offsetWidth;
H=Math.min(400,window.innerHeight*0.4);
canvas.width=W*dpr;canvas.height=H*dpr;
canvas.style.height=H+'px';
ctx.scale(dpr,dpr);
canvas.addEventListener('mousemove',handleHover);
canvas.addEventListener('mouseleave',()=>document.getElementById('tooltip').style.display='none');
}

function drawMap(){
ctx.fillStyle='#0a1628';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=0.5;
for(let lon=-180;lon<=180;lon+=30){const x=(lon+180)/360*W;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
for(let lat=-90;lat<=90;lat+=30){const y=(90-lat)/180*H;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.lineWidth=1;ctx.fillStyle='rgba(255,255,255,0.03)';ctx.strokeStyle='rgba(255,255,255,0.15)';
continents.forEach(c=>{ctx.beginPath();c.forEach((p,i)=>{const x=(p[0]%360+360)%360/360*W;const y=(90-p[1])/180*H;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.closePath();ctx.fill();ctx.stroke()});
filteredQuakes.forEach((q,i)=>{
const x=(q.lon+180)/360*W;const y=(90-q.lat)/180*H;
const r=Math.max(3,q.mag*2.5);
const pulse=Math.sin(Date.now()/300+i)*0.3+0.7;
let color;if(q.mag<3)color='#22c55e';else if(q.mag<5)color='#f59e0b';else color='#ef4444';
ctx.beginPath();ctx.arc(x,y,r*1.5,0,Math.PI*2);ctx.fillStyle=color+'22';ctx.fill();
ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color+'88';ctx.fill();
ctx.beginPath();ctx.arc(x,y,r*0.5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
});
}

function handleHover(e){
const rect=canvas.getBoundingClientRect();
const mx=e.clientX-rect.left;const my=e.clientY-rect.top;
let found=null,minDist=20;
filteredQuakes.forEach(q=>{
const x=(q.lon+180)/360*W;const y=(90-q.lat)/180*H;
const d=Math.sqrt((mx-x)**2+(my-y)**2);
if(d<minDist){minDist=d;found=q}
});
const tip=document.getElementById('tooltip');
if(found){
const ago=timeAgo(found.time);
tip.innerHTML=`<div style="font-weight:700;margin-bottom:4px">M${found.mag} ${found.place}</div><div style="color:var(--text2);font-size:.75rem">深度: ${found.depth}km · ${ago}<br>坐标: ${found.lat.toFixed(2)}°, ${found.lon.toFixed(2)}°</div>`;
tip.style.display='block';tip.style.left=Math.min(mx+10,W-200)+'px';tip.style.top=(my-60)+'px';
}else{tip.style.display='none'}
}

function timeAgo(ts){
const d=Date.now()-ts;const h=Math.floor(d/3600000);const m=Math.floor(d/60000);
if(h>24)return Math.floor(h/24)+'天前';if(h>0)return h+'小时前';return m+'分钟前';
}

function loadData(){
const period=document.getElementById('timeFilter').value;
let url='';
if(period==='day')url='https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson';
else if(period==='week')url='https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_week.geojson';
else url='https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson';
fetch(url).then(r=>r.json()).then(data=>{
quakes=data.features.map(f=>({mag:f.properties.mag,place:f.properties.place,time:f.properties.time,lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],depth:f.geometry.coordinates[2]}));
filterQuakes();
}).catch(()=>{quakes=demoQuakes;filterQuakes()});
}

function filterQuakes(){
const minMag=parseFloat(document.getElementById('magFilter').value);
filteredQuakes=quakes.filter(q=>q&&q.mag>=minMag);
updateStats();drawMap();renderList();
}

function updateStats(){
const total=filteredQuakes.length;
const maxMag=filteredQuakes.length?Math.max(...filteredQuakes.map(q=>q.mag)):0;
const avgMag=filteredQuakes.length?(filteredQuakes.reduce((s,q)=>s+q.mag,0)/total).toFixed(1):0;
const avgDepth=filteredQuakes.length?(filteredQuakes.reduce((s,q)=>s+q.depth,0)/total).toFixed(1):0;
document.getElementById('statsGrid').innerHTML=`
<div class="stat-card"><div class="num" style="color:var(--accent)">${total}</div><div class="label">地震总数</div></div>
<div class="stat-card"><div class="num" style="color:var(--danger)">${maxMag.toFixed(1)}</div><div class="label">最大震级</div></div>
<div class="stat-card"><div class="num" style="color:var(--warn)">${avgMag}</div><div class="label">平均震级</div></div>
<div class="stat-card"><div class="num">${avgDepth}km</div><div class="label">平均深度</div></div>`;
}

function renderList(){
const sorted=[...filteredQuakes].sort((a,b)=>b.time-a.time).slice(0,50);
document.getElementById('eqList').innerHTML=sorted.map(q=>{
let mc='mag-low';if(q.mag>=5)mc='mag-high';else if(q.mag>=3)mc='mag-mid';
return`<div class="eq-item"><span class="mag ${mc}">M${q.mag}</span><div class="place">${q.place}</div><div class="time">${timeAgo(q.time)}</div><div class="depth">深度: ${q.depth}km · ${q.lat.toFixed(2)}°, ${q.lon.toFixed(2)}°</div></div>`;
}).join('');
}

initCanvas();loadData();
setInterval(drawMap,500);
window.addEventListener('resize',()=>{initCanvas();drawMap()});
</script>
</body>
</html>
