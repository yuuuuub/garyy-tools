<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🔫 坦克大战</title>
<meta name="description" content="经典坦克大战游戏，驾驶坦克保卫基地">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;flex-direction:column}
h1{font-size:1.3rem;margin-bottom:4px}
.info{font-size:.9rem;color:#8b949e;margin-bottom:8px}
canvas{border:2px solid var(--border);border-radius:4px;max-width:100%;touch-action:none}
.controls{display:flex;gap:6px;margin-top:10px}
.btn{width:44px;height:44px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none}
.btn.fire{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:active{opacity:.7}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🔫 坦克大战">
  <meta property="og:description" content="经典坦克大战游戏，驾驶坦克保卫基地">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/tank-battle/">
</head>
<body>
<h1>🔫 坦克大战</h1>
<div class="info" id="info">关卡 <span id="level">1</span> | 生命 <span id="lives">❤️❤️❤️</span> | 分数 <span id="score">0</span></div>
<canvas id="game" width="400" height="400"></canvas>
<div class="controls">
<div class="btn" onmousedown="keys['w']=true" onmouseup="keys['w']=false" ontouchstart="keys['w']=true" ontouchend="keys['w']=false">▲</div>
<div>
<div class="btn" onmousedown="keys['a']=true" onmouseup="keys['a']=false" ontouchstart="keys['a']=true" ontouchend="keys['a']=false">◀</div>
</div>
<div class="btn" onmousedown="keys['s']=true" onmouseup="keys['s']=false" ontouchstart="keys['s']=true" ontouchend="keys['s']=false">▼</div>
<div>
<div class="btn" onmousedown="keys['d']=true" onmouseup="keys['d']=false" ontouchstart="keys['d']=true" ontouchend="keys['d']=false">▶</div>
</div>
<div class="btn fire" onclick="shoot()">🔥</div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=400,H=400,G=20,GS=W/G;
const WALL=1,BRICK=2,STEEL=3,BASE=4;
let keys={},player={x:16,y:360,dir:0,speed:2},bullets=[],enemies=[],walls=[],baseX=190,baseY=380;
let score=0,lives=3,level=1,gameRunning=false,enTimer=0;

function initLevel(){
walls=[];bullets=[];enemies=[];enTimer=0;
// borders
for(let i=0;i<GS;i++){walls.push({x:i*G,y:0,t:WALL});walls.push({x:i*G,y:H-G,t:WALL});if(i>0&&i<GS-1){walls.push({x:0,y:i*G,t:WALL});walls.push({x:W-G,y:i*G,t:WALL})}}
// obstacles
const patterns=[
[[8,8,1,1],[10,8,1,1],[8,10,1,1],[10,10,1,1]],
[[6,6,2,2],[12,6,2,2],[6,12,2,2],[12,12,2,2]],
[[4,4,1,3],[14,4,1,3],[4,14,1,1],[14,14,1,1]],
[[5,5,1,2],[13,5,1,2],[9,10,2,2]],
];
const pat=patterns[(level-1)%patterns.length];
pat.forEach(p=>{
for(let r=0;r<p[3];r++)for(let c=0;c<p[2];c++){
const wx=(p[0]+c)*G,wy=(p[1]+r)*G;
if(!walls.find(w=>w.x===wx&&w.y===wy))walls.push({x:wx,y:wy,t:p[2]>1?STEEL:BRICK});
}});
// base
walls.push({x:baseX,y:baseY,t:BASE});
// spawn enemies
for(let i=0;i<3+level;i++)spawnEnemy();
player={x:180,y:360,dir:0,speed:2};
}

function spawnEnemy(){
const ex=[80,180,280];
enemies.push({x:ex[Math.floor(Math.random()*3)],y:20,dir:2,speed:1+level*0.2,hp:1+Math.floor(level/3),timer:0});
}

function shoot(){
if(!gameRunning)return;
bullets.push({x:player.x+8,y:player.y+8,dir:player.dir,speed:5,friendly:true});
}

function draw(){
ctx.fillStyle='#1a2a1a';ctx.fillRect(0,0,W,H);
walls.forEach(w=>{
if(w.t===WALL){ctx.fillStyle='#8B7355';ctx.fillRect(w.x,w.y,G,G);ctx.strokeStyle='#6B5335';ctx.lineWidth=1;ctx.strokeRect(w.x,w.y,G,G)}
else if(w.t===BRICK){ctx.fillStyle='#A0522D';ctx.fillRect(w.x,w.y,G,G)}
else if(w.t===STEEL){ctx.fillStyle='#888';ctx.fillRect(w.x,w.y,G,G)}
else if(w.t===BASE){ctx.fillStyle='#FFD700';ctx.fillRect(w.x,w.y,G,G);ctx.fillStyle='#000';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('★',w.x+10,w.y+15)}
});
// player
ctx.fillStyle='#4CAF50';
const px=player.x,py=player.y;
ctx.fillRect(px,py,G,G);
ctx.fillStyle='#2E7D32';
if(player.dir===0)ctx.fillRect(px+4,py-4,G-8,8);
else if(player.dir===1)ctx.fillRect(px+4,py+G-4,G-8,8);
else if(player.dir===2)ctx.fillRect(px-4,py+4,8,G-8);
else ctx.fillRect(px+G-4,py+4,8,G-8);
// enemies
enemies.forEach(e=>{
ctx.fillStyle='#f44336';ctx.fillRect(e.x,e.y,G,G);
ctx.fillStyle='#b71c1c';
if(e.dir===0)ctx.fillRect(e.x+4,e.y-4,G-8,8);
else if(e.dir===1)ctx.fillRect(e.x+4,e.y+G-4,G-8,8);
else if(e.dir===2)ctx.fillRect(e.x-4,e.y+4,8,G-8);
else ctx.fillRect(e.x+G-4,e.y+4,8,G-8);
if(e.hp>1){ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(e.hp,e.x+10,e.y+14)}
});
// bullets
bullets.forEach(b=>{
ctx.fillStyle=b.friendly?'#FFEB3B':'#FF5722';
ctx.fillRect(b.x-2,b.y-2,4,4);
});
}

function collides(ax,ay,bx,by,s){return ax<bx+s&&ax+s>bx&&ay<by+s&&ay+s>by}

function update(){
if(!gameRunning)return;
if(keys['w']||keys['ArrowUp']){player.dir=0;player.y=Math.max(G,player.y-player.speed)}
if(keys['s']||keys['ArrowDown']){player.dir=1;player.y=Math.min(H-G-player.speed,player.y+player.speed)}
if(keys['a']||keys['ArrowLeft']){player.dir=2;player.x=Math.max(G,player.x-player.speed)}
if(keys['d']||keys['ArrowRight']){player.dir=3;player.x=Math.min(W-G-player.speed,player.x+player.speed)}
walls.forEach(w=>{if(w.t!==BASE&&collides(player.x,player.y,w.x,w.y,G)){
if(player.dir===0)player.y=w.y+G;if(player.dir===1)player.y=w.y-G;
if(player.dir===2)player.x=w.x+G;if(player.dir===3)player.x=w.x-G;
}});
bullets.forEach(b=>{
b.x+=[0,0,-b.speed,b.speed][b.dir];b.y+=[-b.speed,b.speed,0,0][b.dir];
if(b.x<0||b.x>W||b.y<0||b.y>H)b.remove=true;
walls.forEach((w,i)=>{
if(collides(b.x-2,b.y-2,w.x,w.y,G)){
if(b.friendly&&w.t===BRICK){w.remove=true;b.remove=true}
else if(b.friendly&&w.t===BASE){w.remove=true;lives=0;gameRunning=false}
else if(w.t!==BASE){b.remove=true}
}});
if(!b.friendly&&collides(b.x-2,b.y-2,player.x,player.y,G)){
b.remove=true;lives--;
if(lives<=0){gameRunning=false;document.getElementById('info').innerHTML='游戏结束！'}
player={x:180,y:360,dir:0,speed:2};
}
if(b.friendly){
enemies.forEach((e,i)=>{
if(collides(b.x-2,b.y-2,e.x,e.y,G)){
b.remove=true;e.hp--;
if(e.hp<=0){e.remove=true;score+=100;document.getElementById('score').textContent=score}
}});
}
});
bullets=bullets.filter(b=>!b.remove);
enemies=enemies.filter(e=>!e.remove);
// enemy movement
enemies.forEach(e=>{
e.timer++;if(e.timer>30){e.timer=0;e.dir=Math.floor(Math.random()*4)}
const dx=[0,0,-1,1][e.dir]*e.speed,dy=[-1,1,0,0][e.dir]*e.speed;
const nx=e.x+dx,ny=e.y+dy;
if(nx<G||nx>W-G||ny<G||ny>H-G||walls.some(w=>collides(nx,ny,w.x,w.y,G))){e.dir=Math.floor(Math.random()*4)}
else{e.x=nx;e.y=ny}
if(Math.random()<0.01+level*0.005)bullets.push({x:e.x+8,y:e.y+8,dir:e.dir,speed:3,friendly:false});
});
// spawn more enemies
if(enemies.length<3+level&&enTimer++>60){enTimer=0;spawnEnemy()}
if(enemies.length===0&&enTimer>120){level++;initLevel();document.getElementById('level').textContent=level}
document.getElementById('lives').textContent='❤️'.repeat(Math.max(0,lives));
}

function gameLoop(){draw();update();requestAnimationFrame(gameLoop)}

document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();shoot()}});
document.addEventListener('keyup',e=>{keys[e.key]=false});
gameRunning=true;initLevel();gameLoop();
</script>
</body>
</html>
