<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 习惯日历</title>
<meta name="description" content="习惯日历追踪器，可视化每日习惯完成情况">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select{font-family:inherit;font-size:.95rem}
input[type=text],input[type=color],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-nav button{padding:6px 14px;font-size:.85rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-head{text-align:center;font-size:.75rem;color:var(--text2);padding:6px 0;font-weight:600}
.cal-day{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.8rem;cursor:pointer;transition:all .15s;border:2px solid transparent;position:relative}
.cal-day:hover{background:rgba(59,130,246,.1)}
.cal-day.today{border-color:var(--accent)}
.cal-day.empty{cursor:default}
.cal-day.empty:hover{background:transparent}
.cal-day .day-num{font-size:.75rem}
.cal-day .dots{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap;justify-content:center}
.cal-day .dot{width:6px;height:6px;border-radius:50%}
.habit-list{display:flex;flex-direction:column;gap:8px}
.habit-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.habit-item .name{display:flex;align-items:center;gap:8px;font-weight:600}
.habit-item .color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.habit-item .actions{display:flex;gap:6px}
.habit-item .actions button{padding:4px 10px;font-size:.8rem}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{text-align:center;padding:16px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-num{font-size:1.8rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.8rem;color:var(--text2);margin-top:4px}
.empty{text-align:center;color:var(--text2);padding:30px;font-size:.9rem}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:400px}
.hidden{display:none!important}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;color:#fff;font-weight:600}
@media(max-width:600px){body{padding:10px}.ctn{max-width:100%}.cd{padding:14px}h1{font-size:1.4rem}.stats-grid{grid-template-columns:repeat(3,1fr);gap:6px}.stat-num{font-size:1.3rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📅 习惯日历">
<meta property="og:description" content="习惯日历追踪器，可视化每日习惯完成情况">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/habit-calendar-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE_KEY='hcal_data';
const COLORS=['#3b82f6','#ef4444','#22c55e','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#f97316','#14b8a6','#e11d48'];
let habits=JSON.parse(localStorage.getItem(STORE_KEY+'_h')||'[]');
let checks=JSON.parse(localStorage.getItem(STORE_KEY+'_c')||'{}');
let curYear,curMonth;
const now=new Date();
curYear=now.getFullYear();curMonth=now.getMonth();
function saveH(){localStorage.setItem(STORE_KEY+'_h',JSON.stringify(habits))}
function saveC(){localStorage.setItem(STORE_KEY+'_c',JSON.stringify(checks))}
function today(){return new Date().toISOString().slice(0,10)}
function dateKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function firstDayOfWeek(y,m){let d=new Date(y,m,1).getDay();return d===0?6:d-1}
function getHabitColor(id){const i=habits.findIndex(h=>h.id===id);return COLORS[i%COLORS.length]}
function render(){
  let h=`<div class="hdr"><h1>📅 习惯日历</h1><p>可视化追踪每日习惯完成情况</p></div>`;
  h+=`<div class="cd"><h2>添加习惯</h2><div class="flex"><input type="text" id="hName" placeholder="习惯名称" style="flex:1;min-width:150px"><button onclick="addHabit()">添加</button></div></div>`;
  h+=`<div class="cd"><h2>习惯列表</h2><div class="habit-list" id="habitList">`;
  if(habits.length===0)h+=`<div class="empty">暂无习惯，请添加</div>`;
  else habits.forEach((hab,i)=>{
    h+=`<div class="habit-item"><div class="name"><span class="color-dot" style="background:${COLORS[i%COLORS.length]}"></span>${hab.name}</div><div class="actions"><button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="delHabit(${i})">删除</button></div></div>`;
  });
  h+=`</div></div>`;
  h+=`<div class="cd"><h2>${curYear}年${curMonth+1}月</h2>`;
  h+=`<div class="cal-nav"><button onclick="changeMonth(-1)">← 上月</button><button onclick="changeMonth(0)">今天</button><button onclick="changeMonth(1)">下月 →</button></div>`;
  h+=`<div class="cal-grid">`;
  ['一','二','三','四','五','六','日'].forEach(d=>h+=`<div class="cal-head">${d}</div>`);
  const fDay=firstDayOfWeek(curYear,curMonth);
  const total=daysInMonth(curYear,curMonth);
  for(let i=0;i<fDay;i++)h+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=total;d++){
    const dk=dateKey(curYear,curMonth,d);
    const isToday=dk===today();
    h+=`<div class="cal-day${isToday?' today':''}" onclick="toggleDay('${dk}')">`;
    h+=`<span class="day-num">${d}</span>`;
    if(checks[dk]&&checks[dk].length>0){
      h+=`<div class="dots">`;
      checks[dk].forEach(id=>{const ci=habits.findIndex(ha=>ha.id===id);if(ci>=0)h+=`<span class="dot" style="background:${COLORS[ci%COLORS.length]}"></span>`;});
      h+=`</div>`;
    }
    h+=`</div>`;
  }
  h+=`</div></div>`;
  const tk=today();
  const todayChecks=checks[tk]||[];
  h+=`<div class="cd"><h2>今日打卡 (${todayChecks.length}/${habits.length})</h2>`;
  if(habits.length===0)h+=`<div class="empty">请先添加习惯</div>`;
  else{
    habits.forEach((hab,i)=>{
      const done=todayChecks.includes(hab.id);
      h+=`<div class="habit-item"><div class="name"><span class="color-dot" style="background:${COLORS[i%COLORS.length]}"></span>${hab.name}</div>`;
      h+=`<button style="padding:6px 14px;font-size:.85rem;${done?'background:var(--green)':''}" onclick="toggleHabitToday('${hab.id}')">${done?'✓ 已完成':'打卡'}</button></div>`;
    });
  }
  h+=`</div>`;
  const streaks=calcStats();
  h+=`<div class="cd"><h2>统计概览</h2><div class="stats-grid">`;
  h+=`<div class="stat"><div class="stat-num">${streaks.totalDays}</div><div class="stat-label">总打卡天数</div></div>`;
  h+=`<div class="stat"><div class="stat-num">${streaks.curStreak}</div><div class="stat-label">当前连续</div></div>`;
  h+=`<div class="stat"><div class="stat-num">${streaks.bestStreak}</div><div class="stat-label">最佳连续</div></div>`;
  h+=`</div></div>`;
  $('app').innerHTML=h;
}
function calcStats(){
  const keys=Object.keys(checks).filter(k=>checks[k].length>0).sort();
  const totalDays=keys.length;
  let curStreak=0,bestStreak=0,streak=0;
  const td=today();
  let d=new Date(td);
  while(true){
    const dk=dateKey(d.getFullYear(),d.getMonth(),d.getDate());
    if(checks[dk]&&checks[dk].length>0){streak++;if(d<=new Date(td))curStreak=streak;}
    else{bestStreak=Math.max(bestStreak,streak);streak=0;}
    if(d<new Date('2020-01-01'))break;
    d.setDate(d.getDate()-1);
  }
  bestStreak=Math.max(bestStreak,streak);
  return{totalDays,curStreak,bestStreak};
}
function addHabit(){
  const name=$('hName').value.trim();
  if(!name){alert('请输入习惯名称');return;}
  habits.push({id:'h'+Date.now(),name});
  saveH();render();
}
function delHabit(i){
  if(!confirm('确定删除此习惯？'))return;
  habits.splice(i,1);saveH();render();
}
function toggleHabitToday(id){
  const tk=today();
  if(!checks[tk])checks[tk]=[];
  const idx=checks[tk].indexOf(id);
  if(idx>=0)checks[tk].splice(idx,1);else checks[tk].push(id);
  saveC();render();
}
function toggleDay(dk){
  if(habits.length===0){alert('请先添加习惯');return;}
  let picked=prompt('选择打卡习惯（输入序号，多个用逗号分隔）：\n'+habits.map((h,i)=>`${i+1}. ${h.name}`).join('\n'));
  if(!picked)return;
  const ids=picked.split(',').map(s=>parseInt(s.trim())).filter(n=>n>=1&&n<=habits.length).map(n=>habits[n-1].id);
  if(ids.length===0)return;
  if(!checks[dk])checks[dk]=[];
  ids.forEach(id=>{const idx=checks[dk].indexOf(id);if(idx>=0)checks[dk].splice(idx,1);else checks[dk].push(id);});
  saveC();render();
}
function changeMonth(dir){
  if(dir===0){curYear=now.getFullYear();curMonth=now.getMonth();}
  else{curMonth+=dir;if(curMonth>11){curMonth=0;curYear++;}else if(curMonth<0){curMonth=11;curYear--;}}
  render();
}
render();
</script>
</body>
</html>
