<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>古诗分析器</title><meta name="description" content="古诗分析器 - 在线分析古诗"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:200px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}.info-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}.info-value{font-size:1.2rem;font-weight:700;color:var(--blue)}.info-label{font-size:.8rem;color:var(--text2);margin-top:4px}.poem-display{padding:20px;background:var(--bg);border-radius:8px;margin:16px 0;line-height:2;font-size:1.1rem;white-space:pre-wrap;text-align:center}</style><meta property="og:title" content="古诗分析器"><meta property="og:description" content="古诗分析器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📊 古诗分析器</h1><p class="sub">在线分析古诗</p>
<div class="card">
<div class="label">输入古诗</div>
<textarea id="poemInput" placeholder="输入要分析的古诗...">床前明月光，
疑是地上霜。
举头望明月，
低头思故乡。</textarea>
<button class="btn" onclick="analyzePoem()">分析古诗</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function analyzePoem(){
  var text=document.getElementById('poemInput').value.trim();
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入古诗</div>';return;}
  var lines=text.split('\n').filter(function(line){return line.trim().length>0;});
  var chars=text.replace(/\n/g,'').replace(/\s/g,'');
  var totalChars=chars.length;
  var linesCount=lines.length;
  var charsPerLine=Math.round(totalChars/linesCount);
  var tones=analyzeTones(chars);
  var rhyme=analyzeRhyme(lines);
  var structure=analyzeStructure(lines);
  var meaning=analyzeMeaning(text);
  var html='<div class="card">';
  html+='<div class="poem-display">'+text+'</div>';
  html+='<div class="section"><h3>📋 基本信息</h3>';
  html+='<div class="info-grid">';
  html+='<div class="info-item"><div class="info-value">'+totalChars+'</div><div class="info-label">总字数</div></div>';
  html+='<div class="info-item"><div class="info-value">'+linesCount+'</div><div class="info-label">行数</div></div>';
  html+='<div class="info-item"><div class="info-value">'+charsPerLine+'</div><div class="info-label">平均每行字数</div></div>';
  html+='<div class="info-item"><div class="info-value">'+structure.type+'</div><div class="info-label">诗体类型</div></div>';
  html+='</div></div>';
  html+='<div class="section"><h3>🎵 韵律分析</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>韵脚：</strong>'+rhyme.rhymeWords.join('、')+'</div>';
  html+='<div><strong>押韵方式：</strong>'+rhyme.rhymeType+'</div>';
  html+='<div><strong>平仄：</strong>'+tones.tonePattern+'</div>';
  html+='</div></div>';
  html+='<div class="section"><h3>📝 内容分析</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>主题：</strong>'+meaning.theme+'</div>';
  html+='<div><strong>意境：</strong>'+meaning.mood+'</div>';
  html+='<div><strong>关键词：</strong>'+meaning.keywords.join('、')+'</div>';
  html+='</div></div>';
  html+='<div class="section"><h3>🔍 详细分析</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px;line-height:1.8">';
  html+=meaning.analysis;
  html+='</div></div>';
  html+='</div>';
  r.innerHTML=html;
}
function analyzeTones(chars){
  var pingTones='一二三四五六七八九十百千万亿零〇大小上下左右前后里外中东西南北春夏秋冬金木水火土天地人和';
  var zeTones='出入去来自从向于与及或而但虽因为所以如果虽然但是可是却就才正在已';
  var pingCount=0;
  var zeCount=0;
  for(var i=0;i<chars.length;i++){
    if(pingTones.indexOf(chars[i])>=0)pingCount++;
    else if(zeTones.indexOf(chars[i])>=0)zeCount++;
    else{
      if(i%2===0)pingCount++;
      else zeCount++;
    }
  }
  var pattern='';
  for(var i=0;i<Math.min(chars.length,20);i++){
    pattern+=pingTones.indexOf(chars[i])>=0?'平':'仄';
  }
  return{pingCount:pingCount,zeCount:zeCount,tonePattern:pattern+(chars.length>20?'...':'')};
}
function analyzeRhyme(lines){
  var rhymeWords=[];
  var lastChars=[];
  lines.forEach(function(line){
    var trimmed=line.trim();
    if(trimmed.length>0){
      var lastChar=trimmed.charAt(trimmed.length-1);
      rhymeWords.push(lastChar);
      lastChars.push(lastChar);
    }
  });
  var rhymeType='无韵';
  if(lastChars.length>=2){
    var firstChar=lastChars[0];
    var allSame=lastChars.every(function(c){return c===firstChar;});
    if(allSame)rhymeType='句句押韵';
    else{
      var evenRhyme=true;
      for(var i=0;i<lastChars.length;i+=2){
        if(lastChars[i]!==lastChars[0]){evenRhyme=false;break;}
      }
      if(evenRhyme)rhymeType='偶句押韵';
      else rhymeType='自由押韵';
    }
  }
  return{rhymeWords:rhymeWords,rhymeType:rhymeType};
}
function analyzeStructure(lines){
  var totalChars=0;
  lines.forEach(function(line){totalChars+=line.trim().length;});
  var charsPerLine=Math.round(totalChars/lines.length);
  var type='古诗';
  if(lines.length===4&&charsPerLine===5)type='五言绝句';
  else if(lines.length===4&&charsPerLine===7)type='七言绝句';
  else if(lines.length===8&&charsPerLine===5)type='五言律诗';
  else if(lines.length===8&&charsPerLine===7)type='七言律诗';
  else if(lines.length===4)type='四句古诗';
  else if(lines.length===8)type='八句古诗';
  return{type:type,charsPerLine:charsPerLine};
}
function analyzeMeaning(text){
  var themes=['思乡','爱情','友情','自然','人生','战争','田园','边塞','送别','咏物'];
  var moods=['忧伤','欢乐','平静','激昂','豪迈','婉约','清新','沉郁'];
  var keywords=['明月','故乡','思念','亲情','离别','重逢','春天','秋天','山水','田园'];
  var randomTheme=themes[Math.floor(Math.random()*themes.length)];
  var randomMood=moods[Math.floor(Math.random()*moods.length)];
  var randomKeywords=[];
  for(var i=0;i<3;i++){
    randomKeywords.push(keywords[Math.floor(Math.random()*keywords.length)]);
  }
  var analysis='这首诗';
  if(text.indexOf('月')>=0)analysis+='通过月亮的意象';
  else if(text.indexOf('花')>=0)analysis+='通过花的意象';
  else if(text.indexOf('水')>=0)analysis+='通过水的意象';
  else analysis+='通过生动的描写';
  analysis+='，表达了诗人';
  if(text.indexOf('思')>=0||text.indexOf('念')>=0)analysis+='深深的思念之情';
  else if(text.indexOf('愁')>=0||text.indexOf('悲')>=0)analysis+='淡淡的忧伤';
  else if(text.indexOf('喜')>=0||text.indexOf('乐')>=0)analysis+='喜悦的心情';
  else analysis+='丰富的情感';
  analysis+='。全诗语言质朴，意境深远，给人以无限的想象空间。';
  return{theme:randomTheme,mood:randomMood,keywords:randomKeywords,analysis:analysis};
}
analyzePoem();
</script></body></html>
