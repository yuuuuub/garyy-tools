const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
const infoPanel = document.getElementById('info-panel');
const hint = document.getElementById('hint');
const seasonLabel = document.getElementById('season-label');
let w, h, cx, cy, scale;
let seasonFilter = 'all';
let activeConstellation = null;
let twinklingStars = [];
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  cx = w / 2;
  cy = h / 2;
  scale = Math.min(w, h) * 0.46;
  initTwinkleStars();
}
function initTwinkleStars() {
  twinklingStars = [];
  for (let i = 0; i < 300; i++) {
    twinklingStars.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.5 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005,
      alpha: Math.random() * 0.6 + 0.2
    });
  }
}
window.addEventListener('resize', resize);
resize();
function starPos(c, si) {
  const star = constellations[c].stars[si];
  return {
    x: cx + (star[0] - 0.5) * scale * 1.8,
    y: cy + (star[1] - 0.5) * scale * 1.8
  };
}
const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', () => {
  const query = searchInput.value.trim().toLowerCase();
  if (!query) {
    activeConstellation = null;
    hideInfo();
    draw();
    return;
  }
  let found = null;
  for (let i = 0; i < constellations.length; i++) {
    const c = constellations[i];
    if (c.cn.includes(query) || c.en.toLowerCase().includes(query)) {
      found = i;
      break;
    }
  }
  if (found !== null) {
    activeConstellation = found;
    showInfo(found);
  } else {
    activeConstellation = null;
    hideInfo();
  }
  draw();
});
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let closest = -1;
  let minDist = 60;
  for (let i = 0; i < constellations.length; i++) {
    if (seasonFilter !== 'all' && constellations[i].season !== seasonFilter) continue;
    const c = constellations[i];
    for (let j = 0; j < c.stars.length; j++) {
      const p = starPos(i, j);
      const dist = Math.hypot(mx - p.x, my - p.y);
      if (dist < minDist) {
        minDist = dist;
        closest = i;
      }
    }
  }
  if (closest >= 0) {
    activeConstellation = closest;
    showInfo(closest);
  } else {
    activeConstellation = null;
    hideInfo();
  }
  draw();
});
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let hovering = false;
  for (let i = 0; i < constellations.length; i++) {
    if (seasonFilter !== 'all' && constellations[i].season !== seasonFilter) continue;
    for (let j = 0; j < constellations[i].stars.length; j++) {
      const p = starPos(i, j);
      if (Math.hypot(mx - p.x, my - p.y) < 30) {
        hovering = true;
        break;
      }
    }
    if (hovering) break;
  }
  canvas.style.cursor = hovering ? 'pointer' : 'default';
});
function showInfo(idx) {
  const c = constellations[idx];
  hint.style.opacity = '0';
  document.getElementById('info-title').innerHTML =
    c.cn + (c.zodiac ? ' <span class="zodiac-badge">黄道星座</span>' : '');
  document.getElementById('info-en').textContent = c.en;
  document.getElementById('info-detail').innerHTML =
    `<span>最亮星：</span>${c.brightest}<br><span>最佳观测季节：</span>${seasonName(c.season)}`;
  document.getElementById('info-story').textContent = c.story;
  infoPanel.style.display = 'block';
}
function hideInfo() {
  infoPanel.style.display = 'none';
  hint.style.opacity = '1';
}
function seasonName(s) {
  const map = { spring: '春季 (3-5月)', summer: '夏季 (6-8月)', autumn: '秋季 (9-11月)', winter: '冬季 (12-2月)', all: '全年可见' };
  return map[s] || s;
}
document.querySelectorAll('#controls button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    seasonFilter = btn.dataset.season;
    activeConstellation = null;
    hideInfo();
    seasonLabel.textContent = seasonFilter === 'all'
      ? '' : `当前筛选：${seasonName(seasonFilter)} · 可见 ${visibilityCount()} 个星座`;
    draw();
  });
});
function visibilityCount() {
  if (seasonFilter === 'all') return constellations.length;
  return constellations.filter(c => c.season === seasonFilter).length;
}
function draw(timestamp) {
  ctx.clearRect(0, 0, w, h);
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h));
  bg.addColorStop(0, '#0d0d2a');
  bg.addColorStop(0.5, '#08081c');
  bg.addColorStop(1, '#040410');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.beginPath();
  ctx.moveTo(-100, h * 0.4);
  ctx.quadraticCurveTo(cx * 0.3, cy * 0.6, cx, cy * 0.8);
  ctx.quadraticCurveTo(cx * 1.7, cy * 1.0, w + 100, h * 0.5);
  ctx.lineWidth = 200;
  ctx.strokeStyle = '#8899cc';
  ctx.stroke();
  ctx.restore();
  const t = timestamp || 0;
  for (const s of twinklingStars) {
    const flicker = 0.4 + 0.6 * Math.abs(Math.sin(t * s.speed + s.phase));
    ctx.fillStyle = `rgba(200, 210, 255, ${s.alpha * flicker})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * (0.8 + 0.2 * flicker), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.save();
  ctx.strokeStyle = 'rgba(40, 50, 80, 0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, scale * 0.82, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, scale * 0.44, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx, cy - scale * 0.82);
  ctx.lineTo(cx, cy + scale * 0.82);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - scale * 0.82, cy);
  ctx.lineTo(cx + scale * 0.82, cy);
  ctx.stroke();
  ctx.restore();
  const polarisX = cx + (0.13 - 0.5) * scale * 1.8;
  const polarisY = cy + (0.06 - 0.5) * scale * 1.8;
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);
  ctx.beginPath();
  ctx.arc(polarisX, polarisY, 14, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.font = '11px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('北极星 Polaris', polarisX, polarisY - 18);
  ctx.restore();
  for (let i = 0; i < constellations.length; i++) {
    if (seasonFilter !== 'all' && constellations[i].season !== seasonFilter) continue;
    const c = constellations[i];
    const isActive = i === activeConstellation;
    ctx.save();
    ctx.strokeStyle = c.zodiac
      ? (isActive ? 'rgba(255, 210, 60, 0.9)' : 'rgba(255, 200, 60, 0.45)')
      : (isActive ? 'rgba(140, 170, 255, 0.9)' : 'rgba(100, 130, 220, 0.25)');
    ctx.lineWidth = isActive ? 2.5 : 0.8;
    if (isActive) {
      ctx.shadowColor = c.zodiac ? 'rgba(255, 200, 60, 0.6)' : 'rgba(120, 160, 255, 0.5)';
      ctx.shadowBlur = 10;
    }
    ctx.beginPath();
    for (const line of c.lines) {
      const p1 = starPos(i, line[0]);
      const p2 = starPos(i, line[1]);
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
    }
    ctx.stroke();
    ctx.restore();
  }
  for (let i = 0; i < constellations.length; i++) {
    if (seasonFilter !== 'all' && constellations[i].season !== seasonFilter) continue;
    const c = constellations[i];
    const isActive = i === activeConstellation;
    for (let j = 0; j < c.stars.length; j++) {
      const p = starPos(i, j);
      const brightness = 0.3 + Math.random() * 0.1;
      const baseR = 1.5 + brightness * 5;
      const r = isActive ? baseR * 1.5 : baseR;
      const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3);
      if (c.zodiac) {
        glow.addColorStop(0, 'rgba(255, 220, 80, 0.5)');
        glow.addColorStop(1, 'rgba(255, 180, 40, 0)');
      } else if (isActive) {
        glow.addColorStop(0, 'rgba(180, 200, 255, 0.5)');
        glow.addColorStop(1, 'rgba(100, 140, 240, 0)');
      } else {
        glow.addColorStop(0, 'rgba(140, 170, 240, 0.3)');
        glow.addColorStop(1, 'rgba(80, 120, 200, 0)');
      }
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = c.zodiac ? '#ffe890' : '#d0e0ff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  for (let i = 0; i < constellations.length; i++) {
    if (seasonFilter !== 'all' && constellations[i].season !== seasonFilter) continue;
    const c = constellations[i];
    const isActive = i === activeConstellation;
    const center = getCenter(i);
    ctx.save();
    ctx.font = (isActive ? 'bold ' : '') + (isActive ? 15 : 12) + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    const alpha = isActive ? 1 : 0.75;
    ctx.fillStyle = c.zodiac
      ? `rgba(255, 210, 80, ${alpha})`
      : `rgba(180, 200, 240, ${alpha})`;
    if (isActive) {
      ctx.shadowColor = c.zodiac ? 'rgba(255, 200, 60, 0.6)' : 'rgba(140, 180, 255, 0.5)';
      ctx.shadowBlur = 8;
    }
    ctx.fillText(c.cn, center.x, center.y);
    ctx.fillStyle = c.zodiac
      ? `rgba(255, 200, 80, ${alpha * 0.5})`
      : `rgba(150, 170, 220, ${alpha * 0.5})`;
    ctx.font = `${isActive ? 10 : 9}px "PingFang SC", "Microsoft YaHei", sans-serif`;
    ctx.fillText(c.en, center.x, center.y + (isActive ? 18 : 15));
    ctx.restore();
  }
  requestAnimationFrame(draw);
}
function getCenter(idx) {
  const c = constellations[idx];
  let sx = 0, sy = 0;
  for (let i = 0; i < c.stars.length; i++) {
    const p = starPos(idx, i);
    sx += p.x;
    sy += p.y;
  }
  return { x: sx / c.stars.length, y: sy / c.stars.length - 18 };
}
draw();
</script>
<script src="../i18n.js" defer>
document.getElementById("search-input").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();hideInfo();}});
</script>
