<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五消游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.container{text-align:center;padding:20px;max-width:500px;width:100%}
h1{font-size:28px;margin-bottom:10px;color:var(--accent)}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:15px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 20px;min-width:100px}
.stat-label{font-size:12px;color:#8b949e;text-transform:uppercase}
.stat-value{font-size:24px;font-weight:bold;color:var(--accent)}
.board{display:grid;gap:4px;max-width:420px;margin:0 auto;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:10px}
.cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;cursor:pointer;transition:all .2s;user-select:none;position:relative}
.cell:hover{transform:scale(1.1);z-index:1}
.cell.selected{box-shadow:0 0 0 3px var(--accent);transform:scale(1.15)}
.cell.matched{animation:pop .4s ease-out}
.cell.falling{animation:fall .3s ease-in}
@keyframes pop{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.5}100%{transform:scale(0);opacity:0}}
@keyframes fall{0%{transform:translateY(-60px);opacity:0}100%{transform:translateY(0);opacity:1}}
.c0{background:linear-gradient(135deg,#ff6b6b,#ee5a24)}
.c1{background:linear-gradient(135deg,#feca57,#ff9f43)}
.c2{background:linear-gradient(135deg,#48dbfb,#0abde3)}
.c3{background:linear-gradient(135deg,#ff9ff3,#f368e0)}
.c4{background:linear-gradient(135deg,#55efc4,#00b894)}
.c5{background:linear-gradient(135deg,#a29bfe,#6c5ce7)}
.combo-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;color:var(--accent);pointer-events:none;animation:comboAnim .8s ease-out forwards;z-index:100}
@keyframes comboAnim{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.btn{background:var(--accent);color:#fff;border:none;padding:12px 30px;border-radius:8px;font-size:16px;cursor:pointer;margin-top:15px;font-weight:bold}
.btn:hover{opacity:.9}
.special-indicator{position:absolute;top:2px;right:5px;font-size:10px}
.combo-display{position:fixed;top:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 15px;z-index:50}
.combo-display .val{font-size:20px;color:#feca57;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>⭐ 五消游戏</h1>
<div class="stats">
<div class="stat"><div class="stat-label">分数</div><div class="stat-value" id="score">0</div></div>
<div class="stat"><div class="stat-label">步数</div><div class="stat-value" id="moves">0</div></div>
<div class="stat"><div class="stat-label">最高连击</div><div class="stat-value" id="maxCombo">0</div></div>
</div>
<div class="board" id="board"></div>
<button class="btn" onclick="restartGame()">重新开始</button>
</div>
<script>
const ROWS=8,COLS=8,COLORS=6;
let grid=[],selected=null,score=0,moves=0,combo=0,maxCombo=0;
const board=document.getElementById('board');

function init(){
    grid=[];
    for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++)grid[r][c]=Math.floor(Math.random()*COLORS);}
    while(findMatches().length>0)grid[ROWS-1][COLS-1]=(grid[ROWS-1][COLS-1]+1)%COLORS;
    render();
}

function render(){
    board.style.gridTemplateColumns=`repeat(${COLS},1fr)`;
    board.innerHTML='';
    for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
            const cell=document.createElement('div');
            cell.className=`cell c${grid[r][c]}`;
            if(selected&&selected.r===r&&selected.c===c)cell.classList.add('selected');
            if(grid[r][c]===-1)cell.style.visibility='hidden';
            cell.dataset.r=r;cell.dataset.c=c;
            cell.addEventListener('click',()=>onClick(r,c));
            board.appendChild(cell);
        }
    }
}

function onClick(r,c){
    if(grid[r][c]===-1)return;
    if(!selected){selected={r,c};render();return;}
    if(selected.r===r&&selected.c===c){selected=null;render();return;}
    const dr=Math.abs(selected.r-r),dc=Math.abs(selected.c-c);
    if((dr===1&&dc===0)||(dr===0&&dc===1)){
        swap(selected.r,selected.c,r,c);
        const matches=findMatches();
        if(matches.length>0){
            moves++;combo=0;
            processMatches();
        }else{
            swap(selected.r,selected.c,r,c);
        }
    }
    selected=null;
    render();
}

function swap(r1,c1,r2,c2){
    const t=grid[r1][c1];grid[r1][c1]=grid[r2][c2];grid[r2][c2]=t;
}

function findMatches(){
    const matched=new Set();
    for(let r=0;r<ROWS;r++){
        for(let c=0;c<=COLS-5;c++){
            const v=grid[r][c];
            if(v===-1)continue;
            let count=1;
            while(c+count<COLS&&grid[r][c+count]===v)count++;
            if(count>=5){for(let i=0;i<count;i++)matched.add(`${r},${c+i}`);}
        }
    }
    for(let c=0;c<COLS;c++){
        for(let r=0;r<=ROWS-5;r++){
            const v=grid[r][c];
            if(v===-1)continue;
            let count=1;
            while(r+count<ROWS&&grid[r+count][c]===v)count++;
            if(count>=5){for(let i=0;i<count;i++)matched.add(`${r+i},${c}`);}
        }
    }
    return[...matched].map(s=>{const[r,c]=s.split(',').map(Number);return{r,c};});
}

function processMatches(){
    const matches=findMatches();
    if(matches.length===0){combo=0;updateStats();return;}
    combo++;
    if(combo>maxCombo)maxCombo=combo;
    const pts=matches.length*10*combo;
    score+=pts;
    showCombo(combo,pts);
    matches.forEach(({r,c})=>{grid[r][c]=-1;});
    render();
    setTimeout(()=>{
        dropPieces();
        fillEmpty();
        render();
        setTimeout(()=>processMatches(),150);
    },250);
}

function dropPieces(){
    for(let c=0;c<COLS;c++){
        let empty=ROWS-1;
        for(let r=ROWS-1;r>=0;r--){
            if(grid[r][c]!==-1){grid[empty][c]=grid[r][c];if(empty!==r)grid[r][c]=-1;empty--;}
        }
        for(let r=empty;r>=0;r--)grid[r][c]=-1;
    }
}

function fillEmpty(){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]===-1)grid[r][c]=Math.floor(Math.random()*COLORS);
}

function showCombo(c,p){
    const el=document.createElement('div');
    el.className='combo-text';
    el.textContent=c>1?`${c}连击! +${p}`:`+${p}`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),800);
}

function updateStats(){
    document.getElementById('score').textContent=score;
    document.getElementById('moves').textContent=moves;
    document.getElementById('maxCombo').textContent=maxCombo;
}

function restartGame(){score=0;moves=0;combo=0;maxCombo=0;selected=null;init();updateStats();}

init();updateStats();
</script>
</body>
</html>
