<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌧️ 暴雨安全指南 - Gary's Tools</title>
<meta name="description" content="夏季暴雨安全指南：预警级别解读、居家防御准备、外出避险要点、车辆涉水急救、灾后防疫知识">
<style>
:root{--bg:#f0f4f8;--card:#fff;--text:#1e293b;--text2:#64748b;--blue:#2563eb;--red:#dc2626;--orange:#ea580c;--yellow:#ca8a04;--green:#16a34a;--border:#e2e8f0;--radius:14px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--border:#334155}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16pxscroll-behavior:smooth;}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#2563eb,#0891b2,#1e40af);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.alert-card{padding:16px;border-radius:var(--radius);margin-bottom:14px;text-align:center;color:var(--text)}
.alert-card .level{font-size:2rem;font-weight:900}
.alert-card .desc{font-size:.82rem;margin-top:4px;opacity:.9}
.level-blue{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.level-yellow{background:linear-gradient(135deg,#eab308,#ca8a04)}
.level-orange{background:linear-gradient(135deg,#f97316,#ea580c)}
.level-red{background:linear-gradient(135deg,#ef4444,#dc2626)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.03)}
.card h3{font-size:1rem;font-weight:700;margin-bottom:12px}
.checklist{display:flex;flex-direction:column;gap:8px}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.82rem;line-height:1.5}
.check-item input{display:none}
.check-item .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.check-item .box.checked{background:var(--green);border-color:var(--green)}
.check-item .box.checked::after{content:'✓';color:var(--text);font-size:.7rem;font-weight:900}
.danger-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.danger-item{padding:12px;border-radius:10px;font-size:.78rem;line-height:1.5}
.danger-item .d-icon{font-size:1.5rem;display:block;margin-bottom:4px}
.dg-red{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15)}
.dg-orange{background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.15)}
.car-guide{display:flex;flex-direction:column;gap:8px}
.car-step{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.8rem;line-height:1.5}
.car-step .num{width:24px;height:24px;border-radius:50%;background:var(--blue);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;flex-shrink:0}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);outline:none}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🌧️ 暴雨安全指南 - Gary's Tools">
  <meta property="og:description" content="夏季暴雨安全指南：预警级别解读、居家防御准备、外出避险要点、车辆涉水急救、灾后防疫知识">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/rain-safety/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>🌧️ 暴雨安全指南</h1><p>夏季汛期 · 防范未然 · 安全第一</p></header>

<div class="alert-card level-red"><div class="level">⚠️ 红色预警</div><div class="desc">3小时内降雨量≥100毫米，或已达且将持续</div></div>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
<div class="alert-card level-blue"><div class="level" style="font-size:1.3rem">🔵 蓝色</div><div class="desc">12h内≥50mm</div></div>
<div class="alert-card level-yellow"><div class="level" style="font-size:1.3rem">🟡 黄色</div><div class="desc">6h内≥50mm</div></div>
<div class="alert-card level-orange"><div class="level" style="font-size:1.3rem">🟠 橙色</div><div class="desc">3h内≥50mm</div></div>
</div>

<div class="card">
<h2>🏠 居家防御清单</h2>
<div class="checklist" id="homeList"></div>
</div>

<div class="card">
<h2>🚫 暴雨天危险区域</h2>
<div class="danger-grid" id="dangerList"></div>
</div>

<div class="card">
<h2>🚗 车辆涉水急救</h2>
<div class="car-guide" id="carList"></div>
</div>

<div class="card">
<h2>🆘 洪水逃生口诀</h2>
<div style="font-size:.85rem;line-height:2;text-align:center;font-weight:700;color:var(--blue)">
向高处跑 · 不涉水行<br>
远离电线 · 不躲树下<br>
抓住漂浮 · 等待救援<br>
关电源闸 · 不走桥面<br>
遇险打110/119/120
</div>
</div>

<footer>生命至上 · 安全第一 🌈</footer>
</div>

<script>
const homeChecklist=[
'收听天气预报和预警信息','检查阳台排水口是否畅通',
'关好门窗，固定好室外物品','家里备好手电筒、蜡烛、充电宝',
'备足饮用水和方便食品','一楼住户提前转移贵重物品到高处',
'拔掉不必要的电器插头','准备好救生衣或游泳圈（极端情况）',
];

document.getElementById('homeList').innerHTML=homeChecklist.map((t,i)=>`
<div class="check-item" onclick="this.querySelector('.box').classList.toggle('checked')">
<span class="box"></span><span>${t}</span>
</div>`).join('');

const dangers=[
{i:'🌊',t:'积水路段',d:'看不清水下情况，可能有塌陷、井盖缺失、带电电线',c:'dg-red'},
{i:'⚡',t:'电线杆/变压器',d:'漏电风险极高！远离至少10米，不要蹚水靠近',c:'dg-red'},
{i:'🏗️',t:'工地/围墙',d:'暴雨冲刷可能倒塌，不要在这些地方避雨',c:'dg-orange'},
{i:'🌳',t:'大树下',d:'雷雨天大树易被劈中或倒塌，勿停留',c:'dg-orange'},
{i:'🌉',t:'立交桥下/地道',d:'低洼地带雨水汇集快，极易淹没车辆',c:'dg-red'},
{i:'⛰️',t:'山坡/河道边',d:'山区暴雨易引发山洪泥石流，立即撤离',c:'dg-red'},
];

document.getElementById('dangerList').innerHTML=dangers.map(d=>`
<div class="danger-item ${d.c}"><span class="d-icon">${d.i}</span><b>${d.t}</b><br>${d.d}</div>`).join('');

const carSteps=[
'🚗 积水深度超过半个车轮（约30cm）立即停车熄火，不要强行通过',
'🔑 熄火后切勿再次启动发动机！二次启动保险不赔',
'🪟 水位快速上涨时，立即解开安全带，尝试打开车门或降下车窗逃生',
'🔨 车门打不开时，用安全锤敲击侧窗四角（不是中间），或用座椅头枕金属杆撬',
'📱 逃出后立即撤离到高处，拨打122/119，不要返回车内取物品',
];

document.getElementById('carList').innerHTML=carSteps.map((s,i)=>`
<div class="car-step"><span class="num">${i+1}</span><span>${s}</span></div>`).join('');
</script>
<script>
(function(){
var key = 'checklist_' + document.title;
var items = [
  '收听天气预报和预警信息',
  '检查阳台排水口是否畅通',
  '关好门窗并固定室外物品',
  '备好手电筒、蜡烛和充电宝',
  '备足饮用水和方便食品',
  '拔掉不必要的电器插头',
  '将车辆停在地势高处',
  '暴雨天减少不必要外出',
  '远离电线杆和积水路段',
  '记住应急电话110/119/120'
];

function render() {
  var saved = JSON.parse(localStorage.getItem(key) || '[]');
  var list = document.createElement('div');
  list.style.cssText = 'max-width:600px;margin:30px auto;padding:16px;background:var(--card,#fff);border:1px solid var(--border,#e2e8f0);border-radius:10px';
  list.innerHTML = '<h3 style="margin:0 0 12px;font-size:1rem;color:var(--text,#1e293b)">📋 暴雨安全清单</h3>';
  items.forEach(function(text,i){
    var checked = saved.includes(i);
    list.innerHTML += '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;font-size:.85rem;color:var(--text,#1e293b)"><input type="checkbox" ' + (checked?'checked':'') + ' data-idx="'+i+'" style="width:16px;height:16px;accent-color:#2563eb">' + (checked?'<s>':'') + text + (checked?'</s>':'') + '</label>';
  });
  list.innerHTML += '<button id="resetChecklist" style="margin-top:10px;padding:6px 14px;border:1px solid var(--border,#e2e8f0);border-radius:6px;background:transparent;color:var(--text2,#64748b);font-size:.78rem;cursor:pointer">重置</button></div>';

  var existing = document.getElementById('checklist_' + key);
  if (existing) existing.replaceWith(list);
  else document.body.appendChild(list);
  list.id = 'checklist_' + key;

  list.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.addEventListener('change',function(){
      var arr = JSON.parse(localStorage.getItem(key) || '[]');
      var idx = parseInt(this.dataset.idx);
      if (this.checked) { if (!arr.includes(idx)) arr.push(idx); }
      else { arr = arr.filter(function(v){ return v !== idx; }); }
      localStorage.setItem(key, JSON.stringify(arr));
      render();
    });
  });
  list.querySelector('#resetChecklist').addEventListener('click',function(){
    localStorage.removeItem(key);
    render();
  });
}
render();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
