<div class="container"><h1>👹 中国傩面具</h1><p class="sub">傩戏历史 · 面具类型 · 制作工艺 · 文化内涵</p>

<button class="category-btn" onclick="filterCat('类型',this)">类型</button>

<script>
var data=[
{title:'傩的起源',era:'远古',cat:'历史',tags:['驱鬼','祭祀','图腾'],desc:'傩起源于远古时期的驱鬼逐疫仪式，是中国最古老的祭祀形式之一。',detail:'"傩"是中国最古老的祭祀形式之一，起源于远古时期的驱鬼逐疫仪式。《周礼》记载："方相氏掌蒙熊皮，黄金四目，执戈扬盾，帅百隶而时傩。"这说明早在周代，傩已是一种制度化的祭祀活动。傩的核心是戴着面具驱鬼逐疫、祈福纳吉。',ref:'《周礼·夏官》'},
{title:'宫廷傩',era:'周代至宋代',cat:'历史',tags:['皇家','大傩','仪式'],desc:'宫廷傩是皇家举行的大型傩祭仪式，规模宏大、等级森严。',detail:'宫廷傩是皇家举行的大型傩祭仪式。周代的"大傩"由方相氏主持，规模宏大。汉代宫廷傩更加隆重，有"十二兽"舞蹈驱鬼。唐代宫廷傩吸收了佛教和道教元素。宋代以后，宫廷傩逐渐衰落，民间傩戏兴起。',ref:'《后汉书·礼仪志》'},
{title:'民间傩',era:'汉代至今',cat:'历史',tags:['民间','傩戏','娱乐'],desc:'民间傩由祭祀仪式发展为傩戏表演，兼具祭祀和娱乐功能。',detail:'民间傩由宫廷傩演变而来，最初是民间驱鬼逐疫的祭祀活动。随着社会发展，民间傩逐渐融入戏剧元素，发展为傩戏表演。傩戏兼具祭祀和娱乐双重功能，至今在贵州、江西、湖南等地仍有流传。',ref:'《中国傩戏史》'},
{title:'正神面具',era:'历代',cat:'类型',tags:['关公','文昌','正义'],desc:'代表正义善良的神灵，面容端庄祥和，色彩以红、金色为主。',detail:'正神面具代表正义善良的神灵，如关公、文昌帝君、土地公等。正神面具面容端庄祥和，眉目慈祥，色彩以红、金、黄等暖色调为主。正神面具象征光明和正义，在傩戏中代表驱邪除魔的正面力量。',ref:'《中国傩面具》'},
{title:'凶神面具',era:'历代',cat:'类型',tags:['开山','灵官','威慑'],desc:'面目狰狞、獠牙外露的面具，用以威慑鬼怪、驱除邪恶。',detail:'凶神面具是傩面具中最具特色的类型。其特点是面目狰狞、獠牙外露、眼睛突出，以青、蓝、黑等冷色调为主。代表人物有开山将军、王灵官、钟馗等。凶神面具"以恶制恶"——用更凶恶的面目来威慑和驱赶邪魔鬼怪。',ref:'《傩文化研究》'},
{title:'世俗人物面具',era:'历代',cat:'类型',tags:['生旦净丑','戏曲','生活'],desc:'代表现实生活中的各种人物，与戏曲脸谱有密切关系。',detail:'世俗人物面具代表现实生活中的各种人物，包括书生、小姐、媒婆、乞丐等。这类面具与戏曲脸谱有密切关系，造型写实、表情生动。世俗人物面具在傩戏中承担着叙事和娱乐功能，使傩戏具有了戏剧性。',ref:'《中国傩面具艺术》'},
{title:'木雕面具',era:'历代',cat:'工艺',tags:['木雕','彩绘','传统'],desc:'用整块木头雕刻而成，是最传统的傩面具制作方法。',detail:'木雕面具是最传统的傩面具制作方法。选用柳木、白杨木或樟木等整块木头，经粗雕、细雕、打磨、上漆、彩绘等工序制成。木雕面具轻便结实、色彩鲜艳，是傩戏表演的主要面具类型。贵州德江木雕面具技艺被列入国家级非物质文化遗产。',ref:'《德江傩面具》'},
{title:'纸浆面具',era:'清代至今',cat:'工艺',tags:['纸浆','轻便','经济'],desc:'用纸浆塑形制成，成本低、重量轻，适合大规模制作。',detail:'纸浆面具是用纸浆在模具上塑形制成的。其优点是成本低、重量轻，适合大规模制作和民间使用。纸浆面具虽然不如木雕面具精致，但在色彩和造型上同样丰富多彩，是民间傩戏的常用面具。',ref:'《民间面具艺术》'},
{title:'贵州傩面具',era:'明代至今',cat:'地域',tags:['贵州','德江','多样'],desc:'贵州是中国傩面具最丰富的地区，面具种类多样、风格独特。',detail:'贵州是中国傩面具文化最丰富的省份。德江、思南、道真等地的傩戏面具各具特色。贵州傩面具种类繁多，有24个角色行当、数百种面具造型。德江傩面具以木雕为主，造型古朴、色彩鲜艳，被誉为"中国傩面具之乡"。',ref:'《贵州傩戏》'},
{title:'江西傩面具',era:'宋代至今',cat:'地域',tags:['江西','南丰','古老'],desc:'江西南丰傩舞是古老的傩文化遗存，面具造型古朴原始。',detail:'江西南丰傩舞是中国最古老的傩文化遗存之一。南丰傩面具造型古朴原始，保留了远古傩文化的特征。南丰傩面具以木雕为主，有"开山""关公""土地"等角色。南丰傩舞被称为"中国舞蹈的活化石"。',ref:'《南丰傩舞》'},
{title:'湖南傩面具',era:'明代至今',cat:'地域',tags:['湖南','湘西','苗族'],desc:'湘西苗族的傩面具融合了苗族文化，风格粗犷有力。',detail:'湖南湘西的傩面具融合了苗族文化特色，风格粗犷有力、色彩浓烈。湘西傩面具以"仡佬傩"和"苗傩"为代表，面具造型夸张大胆，具有浓郁的民族特色。湘西傩戏与苗族的祭祀活动密切相关。',ref:'《湘西傩文化》'},
{title:'驱鬼逐疫',era:'远古至今',cat:'文化',tags:['驱邪','防疫','祈福'],desc:'傩面具最原始的功能是驱鬼逐疫，保护人们免受邪恶侵害。',detail:'驱鬼逐疫是傩面具最原始的功能。古人认为疾病和灾难是鬼怪作祟，通过戴上凶恶的面具、跳傩舞可以驱赶鬼怪、消除疫病。傩面具"以恶制恶"的原理是：用比鬼怪更凶恶的面目来威慑和驱赶它们。这一功能至今在一些地区仍有保留。',ref:'《周礼》'},
{title:'祈求丰收',era:'远古至今',cat:'文化',tags:['农业','丰收','祭祀'],desc:'傩面具也是祈求农业丰收的重要祭祀道具。',detail:'傩面具在古代农业社会中还承担着祈求丰收的功能。在春耕前或秋收后，人们戴上傩面具举行傩祭，祈求五谷丰登、六畜兴旺。傩面具中的土地神、五谷神等角色就是农业祭祀的体现。',ref:'《中国农业文明史》'},
{title:'傩面具与戏曲',era:'宋代至今',cat:'文化',tags:['脸谱','戏曲','影响'],desc:'傩面具对中国戏曲脸谱的形成有重要影响。',detail:'傩面具被认为是中国戏曲脸谱的重要源头之一。傩面具的色彩象征体系（红色代表忠义、白色代表奸诈、黑色代表刚直等）被戏曲脸谱继承发展。戏曲脸谱在傩面具的基础上更加规范化和艺术化，形成了完整的脸谱体系。',ref:'《中国戏曲脸谱》'},
{title:'傩面具与佛教道教',era:'汉代至今',cat:'文化',tags:['佛教','道教','融合'],desc:'傩面具在发展过程中融合了佛教和道教的神灵形象。',detail:'傩面具在发展过程中不断吸收佛教和道教元素。佛教的韦陀、四大天王，道教的真武大帝、太上老君等形象都被纳入傩面具的角色体系。这种儒释道三教合一的特点，是中国傩面具文化的重要特征。',ref:'《中国宗教文化》'}
];
var currentCat='all';
function renderList(items){
  var el=document.getElementById('list');
  var s=document.getElementById('stats');
  s.textContent='共 '+items.length+' 条知识';
  el.innerHTML=items.map(function(d,i){
    return '<div class="item" onclick="this.classList.toggle(\'open\')">'+
    '<div class="item-title">'+d.title+'</div>'+
    '<div class="item-era">年代：'+d.era+'</div>'+
    '<div class="item-desc">'+d.desc+'</div>'+
    '<div class="item-detail"><h4>详细介绍</h4><p>'+d.detail+'</p>'+
    '<p style="margin-top:8px;color:var(--accent2)">参考：'+d.ref+'</p>'+
    '<div>'+d.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div></div>';
  }).join('');
}
function filterList(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=data.filter(function(d){
    var matchQ=d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q)||d.era.toLowerCase().includes(q);
    var matchC=currentCat==='all'||d.cat===currentCat;
    return matchQ&&matchC;
  });
  renderList(filtered);
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterList();
}
renderList(data);
</script></body></html>
