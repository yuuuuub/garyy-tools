<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国传统音乐百科 - Chinese Traditional Music Encyclopedia</title>
<meta name="description" content="中国传统音乐百科，涵盖民乐、戏曲音乐、宫廷音乐、民间音乐的历史与特色">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国传统音乐百科 - Chinese Traditional Music Encyclopedia">
<meta property="og:description" content="中国传统音乐百科，涵盖民乐、戏曲音乐、宫廷音乐、民间音乐的历史与特色">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-music-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#9bbf8a;--accent2:#7a9e6a}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#238636;--accent2:#1a7f37}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#0a1a0a 0%,#142a14 50%,#1a3a1a 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #2a5a2a;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#9bbf8a,#7a9e6a,#6b9e5a,#5a8a4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.music-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.music-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.music-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.music-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.music-card .music-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.music-card .music-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(155,191,138,0.15);color:var(--accent)}
.music-card .music-name{font-size:1.3em;font-weight:bold}
.music-card .music-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.music-card .music-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.music-card .music-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.music-card .music-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.music-card .music-detail strong{color:var(--text)}
.music-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.music-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🎵 中国传统音乐百科</h1>
<p>Chinese Traditional Music Encyclopedia — 探索中国民乐、宫廷音乐与民间音乐的魅力</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索音乐类型、曲目或特色...（如"古琴""十面埋伏""琵琶语"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部音乐</button>
<button class="filter-btn" data-filter="宫廷音乐">👑 宫廷音乐</button>
<button class="filter-btn" data-filter="文人音乐">📖 文人音乐</button>
<button class="filter-btn" data-filter="民间音乐">🎪 民间音乐</button>
<button class="filter-btn" data-filter="宗教音乐">🙏 宗教音乐</button>
<button class="filter-btn" data-filter="少数民族音乐">🏔️ 少数民族音乐</button>
<button class="filter-btn" data-filter="现代民乐">🎻 现代民乐</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="music-grid" id="musicGrid"></div>
<footer><p>🎵 中国传统音乐百科 — 弦歌不辍，古韵悠扬</p></footer>
</div>
<script>
const MUSIC_DATA=[
  {id:1,name:"古琴音乐",en:"Guqin Music",category:"文人音乐",icon:"🎸",origin:"中原",dynasty:"先秦",features:"清微淡远、中正平和",history:"古琴是中国最古老的弹拨乐器之一，有三千多年历史。古琴音乐是中国文人音乐的代表，强调意境和修身养性。2003年被联合国教科文组织列为'人类口头和非物质遗产代表作'。",masterpieces:["高山流水","广陵散","梅花三弄","阳关三叠","潇湘水云","醉渔唱晚","平沙落雁","流水"],culture:"古琴讲究'大音希声'，追求意境深远、含蓄内敛的艺术风格，是中国文人精神的重要载体。"},
  {id:2,name:"琵琶音乐",en:"Pipa Music",category:"民间音乐",icon:"🪕",origin:"西域传入",dynasty:"南北朝",features:"武曲雄壮、文曲细腻",history:"琵琶自西域传入中国后，经过千年发展成为中国最重要的弹拨乐器之一。琵琶音乐风格多样，既有金戈铁马的武曲，也有柔情似水的文曲。",masterpieces:["十面埋伏","霸王卸甲","春江花月夜","阳春白雪","大浪淘沙","彝族舞曲","草原小姐妹","昭君出塞"],culture:"琵琶被誉为'民乐之王'，其丰富的表现力使其能驾驭各种题材和情感。"},
  {id:3,name:"笛箫音乐",en:"Flute & Xiao Music",category:"民间音乐",icon:"🎶",origin:"全国各地",dynasty:"新石器时代",features:"悠扬婉转、清新脱俗",history:"笛子和箫是中国最具代表性的吹管乐器。笛子明亮清脆，箫则低沉悠远，两者常常合奏，形成独特的音乐效果。",masterpieces:["姑苏行","牧民新歌","幽兰逢春","梅花三弄","秋湖月夜","早晨","荫中鸟","扬鞭催马运粮忙"],culture:"笛箫音乐常与山水自然联系在一起，是中国传统审美中'天人合一'思想的音乐体现。"},
  {id:4,name:"二胡音乐",en:"Erhu Music",category:"民间音乐",icon:"🎻",origin:"唐朝",dynasty:"唐代",features:"如泣如诉、深情动人",history:"二胡是中国最具代表性的拉弦乐器，音色柔美细腻，善于表达深沉的感情。近现代以来，二胡音乐得到了极大的发展。",masterpieces:["二泉映月","赛马","江河水","空山鸟语","光明行","良宵","寒春风曲","病中吟"],culture:"阿炳的《二泉映月》被誉为'中国人的月光'，是二胡音乐的巅峰之作。"},
  {id:5,name:"宫廷雅乐",en:"Court Music",category:"宫廷音乐",icon:"👑",origin:"京城",dynasty:"历代王朝",features:"庄严肃穆、气势恢宏",history:"宫廷雅乐是中国古代宫廷中使用的正统音乐，用于祭祀、朝会等重大场合。其风格庄严肃穆，体现了皇权的威严。",masterpieces:["雅颂","诗经乐","乐记","韶乐","大武","咸池","六代乐舞","大唐雅乐"],culture:"宫廷雅乐是礼乐制度的重要组成部分，体现了中国古代'礼乐治国'的政治理念。"},
  {id:6,name:"江南丝竹",en:"Jiangnan Sizhu",category:"民间音乐",icon:"🏮",origin:"江浙沪",dynasty:"明清",features:"清新流畅、优雅细腻",history:"江南丝竹是中国传统器乐丝竹乐的一种，流行于江浙沪地区。以笛、箫、笙、二胡、琵琶、扬琴等乐器合奏。",masterpieces:["欢乐歌","行街","三六","慢三六","云庆","花六","四合","中花六"],culture:"江南丝竹体现了江南水乡的文化特色，以其清新典雅的风格著称。"},
  {id:7,name:"广东音乐",en:"Guangdong Music",category:"民间音乐",icon:"🏮",origin:"广东",dynasty:"清末民初",features:"轻快活泼、色彩明亮",history:"广东音乐是流行于广东珠江三角洲一带的民间器乐曲，以高胡、扬琴、椰胡、洞箫等为主要乐器。",masterpieces:["步步高","雨打芭蕉","平湖秋月","旱天雷","娱乐升平","赛龙夺锦","孔雀开屏","禅院钟声"],culture:"广东音乐以其轻快活泼的节奏和明亮的音色著称，反映了岭南地区的文化特色。"},
  {id:8,name:"佛教音乐",en:"Buddhist Music",category:"宗教音乐",icon:"🙏",origin:"寺庙",dynasty:"东汉",features:"庄严清净、慈悲祥和",history:"佛教音乐随佛教传入中国，经过中国化改造，形成了独特的中国佛教音乐体系。主要用于诵经、法会等宗教活动。",masterpieces:["梵呗","大悲咒","心经","楞严咒","普庵咒","六字真言","药师咒","阿弥陀经"],culture:"佛教音乐以其庄严清净的特质，对人心有安抚和净化的作用。"},
  {id:9,name:"蒙古长调",en:"Mongolian Long Song",category:"少数民族音乐",icon:"🏇",origin:"蒙古草原",dynasty:"古代",features:"悠长高亢、草原风情",history:"蒙古长调是蒙古族最具代表性的音乐形式，2005年被联合国教科文组织列为'人类口头和非物质遗产代表作'。",masterpieces:["辽阔的草原","牧歌","走马","小黄马","嘎达梅林","诺恩吉雅","森吉德玛","鸿雁"],culture:"蒙古长调是草原文化的精髓，表达了蒙古族对草原的深厚感情和自由奔放的精神。"},
  {id:10,name:"维吾尔木卡姆",en:"Uyghur Muqam",category:"少数民族音乐",icon:"🎶",origin:"新疆",dynasty:"古代",features:"旋律丰富、节奏多变",history:"维吾尔木卡姆是维吾尔族的大型综合艺术形式，集歌、舞、乐于一体。2005年被联合国教科文组织列为'人类口头和非物质遗产代表作'。",masterpieces:["十二木卡姆","刀郎木卡姆","哈密木卡姆","吐鲁番木卡姆","拉克","且比亚特","木夏维热克","乌孜哈勒"],culture:"维吾尔木卡姆是维吾尔族文化的瑰宝，体现了丝绸之路上多元文化的交融。"},
  {id:11,name:"古筝音乐",en:"Guzheng Music",category:"民间音乐",icon:"🎵",origin:"战国时期",dynasty:"战国",features:"音色清越、表现力强",history:"古筝是中国最古老的弹拨乐器之一，有两千多年历史。其音色清越明亮，表现力极为丰富。",masterpieces:["渔舟唱晚","战台风","高山流水","寒鸦戏水","出水莲","云裳诉","临安遗恨","林冲夜奔"],culture:"古筝被誉为'东方钢琴'，是中国最受欢迎的民族乐器之一。"},
  {id:12,name:"苗族飞歌",en:"Miao Feige",category:"少数民族音乐",icon:"🏔️",origin:"贵州",dynasty:"古代",features:"高亢嘹亮、自由奔放",history:"飞歌是苗族最具代表性的民歌形式，因演唱时声音高亢嘹亮、能传很远而得名。",masterpieces:["苗族飞歌","游方歌","酒歌","丧歌","婚嫁歌","节日歌","劳动歌","历史歌"],culture:"飞歌是苗族文化的活化石，记录了苗族的历史、文化和生活。"}
];
function renderCards(data){
  document.getElementById('musicGrid').innerHTML=data.map(m=>`
    <div class="music-card" data-category="${m.category}">
      <div class="music-header"><div class="music-icon">${m.icon}</div><div><div class="music-name">${m.name}</div><div class="music-sub">${m.en} · ${m.origin}</div></div></div>
      <div class="music-meta"><span>${m.dynasty}</span><span>${m.features}</span></div>
      <div class="music-detail"><strong>历史：</strong>${m.history}</div>
      <div class="music-detail"><strong>代表曲目：</strong>${m.masterpieces.join('、')}</div>
      <div class="music-detail"><strong>文化特色：</strong>${m.culture}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">音乐类型</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.music-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.music-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(MUSIC_DATA);renderStats(MUSIC_DATA);
</script>
</body>
</html>
