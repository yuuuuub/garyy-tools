<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏃 减肥热量计算器 - Gary's Tools</title>
<meta name="description" content="科学减肥热量计算器：计算每日消耗、设定减重目标、食物热量速查、运动消耗估算，夏天减肥必备">
<style>
:root{--bg:#fefce8;--card:#fff;--text:#422006;--text2:#a16207;--accent:#f97316;--green:#22c55e;--red:#ef4444;--border:#fef08a;--radius:16px}
[data-theme="dark"]{--bg:#1c1408;--card:#281e0c;--text:#fde68a;--text2:#a16207;--border:#422006}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#f97316,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.03)}
.card h3{font-size:1rem;font-weight:700;margin-bottom:14px}
.form-row{display:flex;gap:10px;margin-bottom:12px}
.form-group{flex:1;display:flex;flex-direction:column}
.form-group label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:.9rem;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
.form-group input:focus{border-color:var(--accent)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.result-item{text-align:center;padding:12px 8px;background:var(--bg);border-radius:10px}
.result-val{font-size:1.3rem;font-weight:900;color:var(--accent)}
.result-lab{font-size:.68rem;color:var(--text2)}
.food-list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.food-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.82rem}
.food-cal{font-weight:700;color:var(--red);font-size:.75rem}
.exercise-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.ex-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.8rem}
.ex-cal{font-weight:700;color:var(--green);font-size:.75rem}
.tip{background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.2);border-radius:10px;padding:12px;font-size:.78rem;line-height:1.6}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
</head>
<body>
<div class="container">
<header><h1>🏃 减肥热量计算器</h1><p>夏天到了 · 科学减脂不反弹</p></header>

<div class="card">
<h3>📊 个人数据</h3>
<div class="form-row">
<div class="form-group"><label>性别</label><select id="gender"><option value="male">男</option><option value="female">女</option></select></div>
<div class="form-group"><label>年龄</label><input type="number" id="age" value="25" min="10" max="80"></div>
</div>
<div class="form-row">
<div class="form-group"><label>身高 cm</label><input type="number" id="height" value="170" min="100" max="220"></div>
<div class="form-group"><label>体重 kg</label><input type="number" id="weight" value="70" min="30" max="200"></div>
</div>
<div class="form-group" style="margin-bottom:12px"><label>活动水平</label>
<select id="activity">
<option value="1.2" selected>久坐（几乎不运动）</option>
<option value="1.375">轻度（每周1-3次运动）</option>
<option value="1.55">中度（每周3-5次运动）</option>
<option value="1.725">活跃（每周6-7次运动）</option>
<option value="1.9">高强度（体力劳动+每天运动）</option>
</select></div>
<button class="btn" onclick="calculate()">📐 计算我的热量消耗</button>
<div id="resultArea" style="display:none;margin-top:12px">
<div class="result-grid">
<div class="result-item"><div class="result-val" id="bmrVal">--</div><div class="result-lab">基础代谢/天</div></div>
<div class="result-item"><div class="result-val" id="tdeeVal">--</div><div class="result-lab">总消耗/天</div></div>
<div class="result-item"><div class="result-val" id="bmiVal">--</div><div class="result-lab">BMI指数</div></div>
</div>
</div>
</div>

<div class="card">
<h3>🎯 减重目标计算</h3>
<div class="form-row">
<div class="form-group"><label>目标体重 kg</label><input type="number" id="targetW" value="65"></div>
<div class="form-group"><label>每周减重 kg</label>
<select id="pace"><option value="0.5" selected>0.5kg/周（健康）</option>
<option value="0.25">0.25kg/周（温和）</option><option value="0.75">0.75kg/周（较快）</option>
<option value="1">1kg/周（激进）</option></select></div>
</div>
<button class="btn" style="background:linear-gradient(135deg,#22c55e,#16a34a)" onclick="calcTarget()">🎯 计算减重计划</button>
<div id="targetArea" style="display:none;margin-top:12px">
<div class="result-grid">
<div class="result-item"><div class="result-val" id="dailyLimit">--</div><div class="result-lab">每日摄入上限</div></div>
<div class="result-item"><div class="result-val" id="deficit">--</div><div class="result-lab">每日热量缺口</div></div>
<div class="result-item"><div class="result-val" id="daysToGoal">--</div><div class="result-lab">预计达成天数</div></div>
</div>
</div>
</div>

<div class="card">
<h3>🍔 常见食物热量速查</h3>
<div class="food-list" id="foodList"></div>
</div>

<div class="card">
<h3>🏃 运动消耗速查 (60kg/30分钟)</h3>
<div class="exercise-grid" id="exList"></div>
</div>

<div class="tip">💡 <b>减脂小知识：</b>1kg脂肪≈7700kcal，每日300-500kcal赤字最健康。不要低于基础代谢！蛋白质摄入1.2-2.0g/kg体重。多喝水，保证睡眠。</div>
<footer>数据仅供参考 · 健康第一 💪</footer>
</div>

<script>
let lastTdee=2000,lastBmr=1600;

function calculate(){
const g=document.getElementById('gender').value;
const a=parseInt(document.getElementById('age').value);
const h=parseInt(document.getElementById('height').value);
const w=parseInt(document.getElementById('weight').value);
const act=parseFloat(document.getElementById('activity').value);

const bmr=g==='male'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161;
const tdee=Math.round(bmr*act);
const bmi=(w/((h/100)*(h/100))).toFixed(1);

lastBmr=Math.round(bmr);lastTdee=tdee;
let bmiText='';let bmiColor='';
if(bmi<18.5){bmiText='偏瘦';bmiColor='#f97316'}
else if(bmi<24){bmiText='正常';bmiColor='#22c55e'}
else if(bmi<28){bmiText='超重';bmiColor='#f97316'}
else{bmiText='肥胖';bmiColor='#ef4444'}

document.getElementById('bmrVal').textContent=Math.round(bmr)+' kcal';
document.getElementById('tdeeVal').textContent=tdee+' kcal';
document.getElementById('bmiVal').textContent=bmi+' ('+bmiText+')';
document.getElementById('bmiVal').style.color=bmiColor;
document.getElementById('resultArea').style.display='block';
}

function calcTarget(){
const tw=parseInt(document.getElementById('targetW').value);
const cw=parseInt(document.getElementById('weight').value);
const pace=parseFloat(document.getElementById('pace').value);
if(tw>=cw){alert('目标体重需低于当前体重');return;}
const deficit=Math.round(pace*7700/7);
const dailyLimit=Math.round(lastTdee-deficit);
const days=Math.round((cw-tw)/pace*7);

document.getElementById('dailyLimit').textContent=dailyLimit+' kcal';
document.getElementById('deficit').textContent=deficit+' kcal';
document.getElementById('daysToGoal').textContent=days+' 天';
document.getElementById('targetArea').style.display='block';
}

const foods=[
{n:'米饭(1碗150g)',cal:'174'},{n:'馒头(1个100g)',cal:'223'},{n:'面条(1碗200g)',cal:'220'},
{n:'面包(2片)',cal:'156'},{n:'鸡蛋(1个)',cal:'78'},{n:'鸡胸肉(100g)',cal:'133'},
{n:'牛肉(100g)',cal:'125'},{n:'猪肉(瘦100g)',cal:'143'},{n:'三文鱼(100g)',cal:'208'},
{n:'牛奶(250ml)',cal:'155'},{n:'苹果(1个)',cal:'95'},{n:'香蕉(1根)',cal:'105'},
{n:'西瓜(200g)',cal:'62'},{n:'奶茶(中杯)',cal:'350'},{n:'可乐(330ml)',cal:'140'},
{n:'炸鸡腿(1个)',cal:'250'},{n:'薯条(中份)',cal:'310'},{n:'冰淇淋(1球)',cal:'180'},
{n:'沙拉(不加酱)',cal:'50'},{n:'火锅(一顿)',cal:'1500'},
];

document.getElementById('foodList').innerHTML=foods.map(f=>`<div class="food-item"><span>${f.n}</span><span class="food-cal">🔥 ${f.cal}kcal</span></div>`).join('');

const exs=[
{n:'快走',cal:'150'},{n:'慢跑',cal:'250'},{n:'跳绳',cal:'350'},{n:'游泳',cal:'300'},
{n:'骑行',cal:'220'},{n:'爬楼梯',cal:'400'},{n:'瑜伽',cal:'120'},{n:'跳操',cal:'280'},
{n:'打羽毛球',cal:'200'},{n:'HIIT',cal:'400'},{n:'平板支撑',cal:'100'},{n:'深蹲(100个)',cal:'80'},
];

document.getElementById('exList').innerHTML=exs.map(e=>`<div class="ex-item"><span>${e.n}</span><span class="ex-cal">🏃 ${e.cal}kcal</span></div>`).join('');

calculate();
</script>
<script src="../i18n.js"></script>
</body>
</html>
