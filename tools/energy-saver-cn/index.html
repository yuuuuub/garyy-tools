<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭节电计算器 | Energy Saver CN</title>
<meta name="description" content="家庭节电计算器，估算各电器耗电量，制定省电方案">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<meta name="robots" content="index, follow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--input:#242836;--text:#e2e4e9;--text2:#8b8fa3;--accent:#f59e0b;--accent2:#d97706;--green:#22c55e;--danger:#ef4444;--blue:#3b82f6;--border:#2a2e3a;--radius:12px;--radius-sm:8px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--input:#f0f2f5;--text:#1f2328;--text2:#656d76;--accent:#bf8700;--accent2:#9a6700;--green:#1a7f37;--danger:#cf222e;--blue:#0969da;--border:#d0d7de}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;line-height:1.6;padding:20px}
.container{max-width:860px;margin:0 auto;padding:0 12px}
header{text-align:center;padding:40px 0 24px}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#f59e0b,#eab308,#facc15);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{color:var(--text2);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px;transition:border-color .2s}
.card:hover{border-color:#3a3f50}
.card h2{font-size:1.15rem;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 32px;border-radius:var(--radius-sm);font-size:1rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:all .2s;width:100%}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-secondary{background:var(--input);color:var(--text);border:1px solid var(--border);margin-top:10px}
.result-hidden{display:none}
.result-visible{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.appliance-row{display:grid;grid-template-columns:180px 100px 80px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
@media(max-width:600px){.appliance-row{grid-template-columns:1fr 1fr;gap:8px}}
.appliance-row:last-child{border-bottom:none}
.appliance-name{font-size:.9rem;font-weight:500}
.appliance-row input{background:var(--input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:.9rem;width:100%;outline:none}
.appliance-row input:focus{border-color:var(--accent)}
.appliance-row .daily-kwh{font-size:.85rem;color:var(--text2);text-align:right}
.total-row{display:flex;justify-content:space-between;padding:16px 0;font-size:1.1rem;font-weight:700;border-top:2px solid var(--border);margin-top:8px}
.saving-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:500px){.saving-grid{grid-template-columns:1fr}}
.saving-card{background:var(--input);border-radius:var(--radius-sm);padding:16px;border-left:3px solid var(--green)}
.saving-card .s-cat{font-size:.75rem;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.saving-card .s-val{font-size:1.3rem;font-weight:700;color:var(--green)}
.saving-card .s-text{font-size:.85rem;color:var(--text2);margin-top:4px}
.chart-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chart-bar .c-name{min-width:60px;font-size:.85rem}
.chart-bar .c-track{flex:1;height:20px;background:#1e2230;border-radius:4px;overflow:hidden}
.chart-bar .c-fill{height:100%;border-radius:4px;transition:width .6s ease;display:flex;align-items:center;padding-right:8px;font-size:.72rem;font-weight:600;color:#fff}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.82rem}
</style>
</head>
<body>
<div class="container">
<header><h1>家庭节电计算器</h1><p class="subtitle">统计家中各电器耗电，找到省电方案</p></header>
<div class="card" id="inputCard">
<h2><span class="icon">⚡</span> 输入电器功率与使用时间</h2>
<div id="appliances"></div>
<div class="total-row"><span>每日总耗电</span><span id="dailyTotal">0 kWh</span></div>
<button class="btn btn-primary" onclick="calcSaving()">📊 计算省电方案</button>
</div>
<div id="result" class="result-hidden">
<div class="card">
<h2><span class="icon">📊</span> 用电占比分析</h2>
<div id="chart"></div>
</div>
<div class="card">
<h2><span class="icon">💡</span> 省电建议</h2>
<div class="saving-grid" id="savings"></div>
</div>
<div class="card">
<h2><span class="icon">💰</span> 费用估算</h2>
<div id="costInfo" style="font-size:.95rem;line-height:1.8"></div>
</div>
<button class="btn btn-secondary" onclick="resetAll()">🔄 重新输入</button>
</div>
<footer>家庭节电计算器 · 月电费参考阶梯电价约0.5-0.8元/kWh</footer>
</div>
<script>
const APPLIANCES=[
{name:'空调',watt:1200,hours:6,icon:'❄️'},
{name:'冰箱',watt:150,hours:24,icon:'🧊'},
{name:'洗衣机',watt:500,hours:1,icon:'👕'},
{name:'热水器',watt:2000,hours:1,icon:'🚿'},
{name:'电视机',watt:120,hours:5,icon:'📺'},
{name:'电脑',watt:250,hours:8,icon:'💻'},
{name:'照明',watt:100,hours:6,icon:'💡'},
{name:'电饭煲',watt:800,hours:0.5,icon:'🍚'}
];
let appData=[];
function init(){
appData=APPLIANCES.map(a=>({...a}));
render();
}
function render(){
let h='';
appData.forEach((a,i)=>{
const daily=(a.watt*a.hours/1000).toFixed(2);
h+=`<div class="appliance-row">
<div class="appliance-name">${a.icon} ${a.name}</div>
<div><input type="number" value="${a.watt}" min="0" max="10000" placeholder="功率(W)" onchange="appData[${i}].watt=+this.value;render()"></div>
<div><input type="number" value="${a.hours}" min="0" max="24" step="0.5" placeholder="小时/天" onchange="appData[${i}].hours=+this.value;render()"></div>
<div class="daily-kwh">${daily} kWh</div>
</div>`;
});
document.getElementById('appliances').innerHTML=h;
const total=appData.reduce((s,a)=>s+a.watt*a.hours/1000,0);
document.getElementById('dailyTotal').textContent=total.toFixed(2)+' kWh';
}
function calcSaving(){
const total=appData.reduce((s,a)=>s+a.watt*a.hours/1000,0);
const sorted=[...appData].sort((a,b)=>(b.watt*b.hours)-(a.watt*a.hours));
const maxV=sorted[0]?.watt*sorted[0]?.hours||1;
const colors=['#f87171','#fb923c','#fbbf24','#a3e635','#34d399','#22d3ee','#818cf8','#c084fc'];
let ch='';
sorted.forEach((a,i)=>{
const daily=(a.watt*a.hours/1000);
const pct=total>0?(daily/total*100):0;
ch+=`<div class="chart-bar"><span class="c-name">${a.icon} ${a.name}</span><div class="c-track"><div class="c-fill" style="width:${pct}%;background:${colors[i%8]}">${daily.toFixed(2)}kWh</div></div><span style="min-width:40px;text-align:right;font-size:.85rem">${pct.toFixed(1)}%</span></div>`;
});
document.getElementById('chart').innerHTML=ch;
const tips=[];
sorted.forEach(a=>{
const daily=a.watt*a.hours/1000;
const pct=total>0?(daily/total*100):0;
if(pct>25&&a.name==='空调')tips.push({cat:'空调',val:'省30%+',text:'设定26°C+配合风扇，可节省大量电'});
if(a.name==='冰箱')tips.push({cat:'冰箱',val:'省15%',text:'不要频繁开关门，留出散热空间'});
if(a.name==='热水器')tips.push({cat:'热水器',val:'省25%',text:'设定40-50°C，使用前1小时开启'});
if(a.name==='照明')tips.push({cat:'照明',val:'省60%',text:'更换LED灯泡，比白炽灯省电80%'});
if(a.name==='电脑')tips.push({cat:'电脑',val:'省20%',text:'设置自动休眠，关闭不必要的后台程序'});
});
if(tips.length===0)tips.push({cat:'通用',val:'省10%',text:'养成随手关灯关电器的好习惯'});
let sh='';
tips.forEach(t=>{
sh+=`<div class="saving-card"><div class="s-cat">${t.cat}</div><div class="s-val">${t.val}</div><div class="s-text">${t.text}</div></div>`;
});
document.getElementById('savings').innerHTML=sh;
const monthlyKwh=total*30;
const cost1=monthlyKwh*0.5;
const cost2=monthlyKwh*0.8;
const saved=monthlyKwh*0.15*0.65;
document.getElementById('costInfo').innerHTML=`
<p>月用电量：<strong>${monthlyKwh.toFixed(0)} kWh</strong></p>
<p>按阶梯电价估算月电费：<strong>¥${cost1.toFixed(0)} ~ ¥${cost2.toFixed(0)}</strong></p>
<p>采用建议后预计每月可省：<strong style="color:var(--green)">¥${saved.toFixed(0)}</strong></p>
<p>年度预计节省：<strong style="color:var(--green)">¥${(saved*12).toFixed(0)}</strong></p>
`;
document.getElementById('result').className='result-visible';
document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
function resetAll(){document.getElementById('result').className='result-hidden';document.getElementById('inputCard').scrollIntoView({behavior:'smooth'})}
init();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
