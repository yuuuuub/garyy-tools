<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 2026世界杯实时积分榜 - 小组赛排名 | Gary's Tools</title>
<meta name="description" content="2026美加墨世界杯48支球队12个小组实时积分排名，实时数据源自SportScore API，小组前两名晋级淘汰赛阶段。">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--green-bg:rgba(35,134,54,0.15);--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 16px;-webkit-font-smoothing:antialiased}
.container{max-width:820px;margin:0 auto;padding-bottom:40px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.6rem;font-weight:800;background:linear-gradient(135deg,#f59e0b,#ef4444,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.82rem;margin-top:4px}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.toolbar .groups-scroll{display:flex;gap:4px;overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:4px;flex:1;scrollbar-width:none;-ms-overflow-style:none}
.toolbar .groups-scroll::-webkit-scrollbar{display:none}
.tab-btn{padding:7px 14px;border-radius:6px;border:none;background:transparent;color:var(--text2);font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.tab-btn:hover{color:var(--text);background:rgba(255,255,255,.05)}
.tab-btn.active{background:var(--gold);color:#000}
.tab-btn.knockout{margin-left:2px}
.refresh-btn{padding:7px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.8rem;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.refresh-btn:hover{color:var(--text);border-color:var(--text2)}
.refresh-btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.card h3{font-size:.95rem;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px}
.loading .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:.9rem}
.error-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:14px;text-align:center}
.error-state .err-icon{font-size:2.4rem}
.error-state p{color:var(--text2);font-size:.9rem}
.error-state .retry-btn{padding:9px 24px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s}
.error-state .retry-btn:hover{background:rgba(245,158,11,.12)}
.standings-table{width:100%;border-collapse:collapse;font-size:.82rem}
.standings-table thead th{color:var(--text2);font-size:.7rem;text-align:center;padding:8px 4px;font-weight:500;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.3px}
.standings-table thead th:first-child{text-align:center;width:32px}
.standings-table thead th:nth-child(2){text-align:left}
.standings-table tbody td{text-align:center;padding:10px 4px;border-bottom:1px solid rgba(48,54,61,.5);vertical-align:middle;font-size:.8rem}
.standings-table tbody td:first-child{text-align:center;font-weight:600;font-size:.75rem}
.standings-table tbody td:nth-child(2){text-align:left}
.standings-table tbody tr:last-child td{border-bottom:none}
.standings-table tbody tr.advancing{background:var(--green-bg)}
.standings-table tbody tr.advancing td:first-child{color:var(--green)}
.standings-table tbody tr.eliminated{opacity:.55}
.team-cell{display:flex;align-items:center;gap:8px}
.team-cell .logo{width:22px;height:22px;border-radius:4px;object-fit:contain;flex-shrink:0}
.team-cell .logo-fallback{width:22px;height:22px;border-radius:4px;background:var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0}
.team-cell .name{font-weight:500;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.pts-cell{font-weight:700;color:var(--gold);font-size:.85rem}
.promo-badge{display:inline-block;font-size:.62rem;padding:2px 6px;border-radius:4px;font-weight:500;margin-top:2px}
.promo-badge.adv{background:rgba(35,134,54,.2);color:#3fb950}
.group-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.group-header h3{margin-bottom:0}
.group-info{font-size:.72rem;color:var(--text2)}
.bracket-container{overflow-x:auto;padding:4px 0}
.bracket-section{margin-bottom:20px}
.bracket-section:last-child{margin-bottom:0}
.bracket-section h4{font-size:.82rem;color:var(--text2);margin-bottom:10px;font-weight:500}
.bracket-match{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:6px;gap:10px}
.bracket-match .b-team{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:500}
.bracket-match .b-team img{width:18px;height:18px;border-radius:3px;object-fit:contain}
.bracket-match .b-score{font-weight:700;font-size:.85rem;color:var(--gold)}
.bracket-match .b-vs{color:var(--text2);font-size:.75rem}
.bracket-match .b-status{font-size:.68rem;color:var(--text2)}
.knockout-tree{display:flex;flex-direction:column;gap:6px;align-items:center}
.footer{text-align:center;padding:32px 0 16px;color:var(--text2);font-size:.7rem}
.footer a{color:var(--text2);text-decoration:none}
.footer a:hover{color:var(--text);text-decoration:underline}
.auto-refresh-note{text-align:center;font-size:.68rem;color:var(--text2);margin-bottom:8px;opacity:.7}
@media(max-width:600px){
  header h1{font-size:1.25rem}
  .toolbar{flex-direction:column;align-items:stretch}
  .standings-table{font-size:.75rem}
  .standings-table tbody td{padding:8px 3px;font-size:.73rem}
  .team-cell .name{max-width:80px;font-size:.75rem}
  .team-cell .logo{width:18px;height:18px}
  .card{padding:12px}
  .bracket-match{padding:8px 10px;flex-wrap:wrap}
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🏆 2026世界杯实时积分榜 - 小组赛排名 | Gary's Tools">
  <meta property="og:description" content="2026美加墨世界杯48支球队12个小组实时积分排名，实时数据源自SportScore API，小组前两名晋级淘汰赛阶段。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/world-cup-standings/">
</head>
<body>
<div class="container">
<header>
<h1>🏆 2026世界杯积分榜</h1>
<p>48支球队 · 12个小组 · 实时数据</p>
</header>

<div class="toolbar">
  <div class="groups-scroll" id="tabBar"></div>
  <button class="refresh-btn" id="refreshBtn" title="刷新数据">⟳ 刷新</button>
</div>

<div id="content">
  <div class="loading">
    <div class="spinner"></div>
    <p>正在加载实时数据...</p>
  </div>
</div>

<div class="auto-refresh-note" id="refreshNote"></div>

<footer class="footer">
  Powered by <a href="https://sportscore.com" target="_blank" rel="noopener">SportScore</a>
</footer>
</div>

<script>
(function(){
'use strict';

const BASE = 'https://sportscore.com/api/widget';

// ---- State ----
let standingsData = null;
let bracketData = null;
let activeTab = null;
let refreshTimer = null;
let isFetching = false;

// ---- DOM refs ----
const $ = id => document.getElementById(id);
const contentEl = $('content');
const tabBarEl = $('tabBar');
const refreshBtn = $('refreshBtn');
const refreshNote = $('refreshNote');

// ---- Helpers ----
var cache={};
function apiUrl(endpoint) {
  return `${BASE}/${endpoint}/?sport=football&slug=fifa-world-cup&_=${Math.floor(Date.now()/60000)}`;
}

// ---- Fetch with caching ----
async function fetchWithCache(url, cacheKey, ttl){
  var now=Date.now();
  if(cache[cacheKey] && now-cache[cacheKey].time<ttl) return cache[cacheKey].data;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  cache[cacheKey]={data:data,time:now};
  return data;
}

async function fetchStandings() {
  const url = apiUrl('standings');
  return fetchWithCache(url, 'standings', 60000);
}

async function fetchBracket() {
  const url = apiUrl('bracket');
  return fetchWithCache(url, 'bracket', 60000);
}

// ---- Render standings table ----
function renderGroupTable(groupName, rows) {
  if (!rows || rows.length === 0) {
    return '<div class="card"><p style="color:var(--text2);text-align:center;padding:20px 0">暂无数据</p></div>';
  }

  const sorted = [...rows].sort((a, b) => {
    if (b.pts !== a.pts) return b.pts - a.pts;
    if (b.gd !== a.gd) return b.gd - a.gd;
    if (b.gf !== a.gf) return b.gf - a.gf;
    return 0;
  });

  const advancingCount = 2; // top 2 advance

  let html = `<div class="card"><div class="group-header">
    <h3>${groupName}</h3>
    <span class="group-info">${advancingCount}支球队晋级淘汰赛</span>
  </div>
  <table class="standings-table">
    <thead><tr>
      <th>#</th>
      <th>球队</th>
      <th>赛</th>
      <th>胜</th>
      <th>平</th>
      <th>负</th>
      <th>进</th>
      <th>失</th>
      <th>净</th>
      <th>分</th>
    </tr></thead>
    <tbody>`;

  sorted.forEach((row, idx) => {
    const isAdvancing = idx < advancingCount;
    const logoHtml = row.team_logo
      ? `<img class="logo" src="${row.team_logo}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : `<span class="logo-fallback">?</span>`;

    html += `<tr class="${isAdvancing ? 'advancing' : 'eliminated'}">
      <td>${row.pos}</td>
      <td>
        <div class="team-cell">
          ${logoHtml}
          <span class="name">${row.team}</span>
        </div>
        ${isAdvancing ? '<div class="promo-badge adv">已晋级</div>' : ''}
      </td>
      <td>${row.p}</td>
      <td>${row.w}</td>
      <td>${row.d}</td>
      <td>${row.l}</td>
      <td>${row.gf}</td>
      <td>${row.ga}</td>
      <td>${row.gd > 0 ? '+' : ''}${row.gd}</td>
      <td class="pts-cell">${row.pts}</td>
    </tr>`;
  });

  html += '</tbody></table></div>';
  return html;
}

// ---- Render all groups (standings) ----
function renderStandings(data) {
  const tables = data.tables;
  if (!tables || tables.length === 0) {
    return '<div class="card"><p style="color:var(--text2);text-align:center;padding:20px 0">暂无小组数据</p></div>';
  }

  // Build tabs dynamically
  let tabHtml = '';
  tables.forEach((t) => {
    const label = t.group || 'Group';
    const isActive = activeTab === label;
    tabHtml += `<button class="tab-btn${isActive ? ' active' : ''}" data-tab="${label}">${label}</button>`;
  });
  tabHtml += `<button class="tab-btn knockout${activeTab === '__bracket__' ? ' active' : ''}" data-tab="__bracket__">🏆 淘汰赛</button>`;
  tabBarEl.innerHTML = tabHtml;

  // Show active group
  if (activeTab === '__bracket__') {
    renderBracketTab();
    return;
  }

  const table = tables.find(t => t.group === activeTab);
  if (!table) {
    // fallback to first group
    const firstTable = tables[0];
    activeTab = firstTable.group;
    tabBarEl.innerHTML = ''; // force re-render tabs
    renderStandings(data);
    return;
  }

  contentEl.innerHTML = renderGroupTable(table.group, table.rows);
  refreshNote.textContent = `数据每60秒自动刷新 · 上次更新: ${new Date().toLocaleTimeString('zh-CN')}`;
}

// ---- Render bracket ----
function renderBracketTab() {
  if (bracketData) {
    contentEl.innerHTML = renderBracket(bracketData);
    refreshNote.textContent = `数据每60秒自动刷新 · 上次更新: ${new Date().toLocaleTimeString('zh-CN')}`;
    return;
  }

  // Show loading then fetch
  contentEl.innerHTML = `<div class="loading"><div class="spinner"></div><p>正在加载淘汰赛数据...</p></div>`;

  fetchBracketData().then(() => {
    if (bracketData) {
      contentEl.innerHTML = renderBracket(bracketData);
      refreshNote.textContent = `数据每60秒自动刷新 · 上次更新: ${new Date().toLocaleTimeString('zh-CN')}`;
    } else {
      showError('淘汰赛数据加载失败');
    }
  }).catch((err) => {
    showError(`淘汰赛数据加载失败: ${err.message}`);
  });
}

function renderBracket(data) {
  // The bracket API may return various structures.
  // We try to handle: rounds array, stages array, or a bracket object.
  let html = '<div class="card"><h3>🏆 淘汰赛对阵</h3><div class="bracket-container">';

  if (data.rounds && Array.isArray(data.rounds)) {
    data.rounds.forEach((round) => {
      const roundName = round.name || round.round || '轮次';
      html += `<div class="bracket-section"><h4>${roundName}</h4>`;
      if (round.matchups && Array.isArray(round.matchups)) {
        round.matchups.forEach(m => html += renderMatch(m));
      } else if (Array.isArray(round)) {
        round.forEach(m => html += renderMatch(m));
      }
      html += '</div>';
    });
  } else if (data.matches && Array.isArray(data.matches)) {
    html += renderMatchList(data.matches);
  } else if (data.stages && Array.isArray(data.stages)) {
    data.stages.forEach((stage) => {
      const name = stage.name || stage.stage || '阶段';
      html += `<div class="bracket-section"><h4>${name}</h4>`;
      if (stage.matches) html += renderMatchList(stage.matches);
      html += '</div>';
    });
  } else if (data.groups && Array.isArray(data.groups)) {
    data.groups.forEach((g) => {
      html += `<div class="bracket-section"><h4>${g.name || g.group || '组'}</h4>`;
      if (g.matches) html += renderMatchList(g.matches);
      html += '</div>';
    });
  } else {
    // Try to find any array of matches
    const matches = findMatches(data);
    if (matches && matches.length > 0) {
      html += renderMatchList(matches);
    } else {
      html += '<p style="color:var(--text2);text-align:center;padding:20px 0">淘汰赛数据暂未发布</p>';
    }
  }

  html += '</div></div>';
  return html;
}

function findMatches(obj, depth = 0) {
  if (depth > 3) return null;
  if (Array.isArray(obj)) {
    if (obj.length > 0 && (obj[0].home || obj[0].home_team) && (obj[0].away || obj[0].away_team)) return obj;
    for (const item of obj) {
      const result = findMatches(item, depth + 1);
      if (result) return result;
    }
    return null;
  }
  if (obj && typeof obj === 'object') {
    for (const key of Object.keys(obj)) {
      const val = obj[key];
      if (Array.isArray(val)) {
        const result = findMatches(val, depth + 1);
        if (result) return result;
      }
    }
    return null;
  }
  return null;
}

function renderMatchList(matches) {
  let h = '';
  matches.forEach(m => h += renderMatch(m));
  return h;
}

function renderMatch(m) {
  const homeName = (typeof m.home === 'string') ? m.home : (m.home_team ? (m.home_team.name || m.home_team.team || '?') : '?');
  const awayName = (typeof m.away === 'string') ? m.away : (m.away_team ? (m.away_team.name || m.away_team.team || '?') : '?');
  const homeLogo = m.home_logo || (m.home_team ? (m.home_team.logo || m.home_team.team_logo || '') : '') || '';
  const awayLogo = m.away_logo || (m.away_team ? (m.away_team.logo || m.away_team.team_logo || '') : '') || '';
  const homeScore = m.home_score !== undefined ? m.home_score : (m.score1 !== undefined ? m.score1 : null);
  const awayScore = m.away_score !== undefined ? m.away_score : (m.score2 !== undefined ? m.score2 : null);
  const status = m.status || m.state || m.match_status || '';
  const date = m.date || m.start_date || m.start_time || '';
  const venue = m.venue || m.location || '';

  const logo = (n, l) => l ? `<img src="${l}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';

  let scoreHtml;
  if (homeScore !== null && awayScore !== null) {
    scoreHtml = `<span class="b-score">${homeScore} - ${awayScore}</span>`;
  } else {
    scoreHtml = '<span class="b-vs">vs</span>';
  }

  let infoParts = [];
  if (status) infoParts.push(status);
  if (date) infoParts.push(new Date(date).toLocaleDateString('zh-CN', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}));
  if (venue) infoParts.push(venue);

  return `<div class="bracket-match">
    <div class="b-team">${logo('home', homeLogo)}${homeName}</div>
    ${scoreHtml}
    <div class="b-team">${awayName}${logo('away', awayLogo)}</div>
    ${infoParts.length ? `<span class="b-status">${infoParts.join(' · ')}</span>` : ''}
  </div>`;
}

// ---- Error ----
function showError(msg) {
  contentEl.innerHTML = `<div class="error-state">
    <div class="err-icon">⚠️</div>
    <p>${msg}</p>
    <button class="retry-btn" id="retryBtn">重新加载</button>
  </div>`;
  const retryBtn = document.getElementById('retryBtn');
  if (retryBtn) retryBtn.addEventListener('click', () => { loadAll(); });
  refreshNote.textContent = '加载失败，请重试';
}

// ---- Fetch bracket data ----
async function fetchBracketData() {
  try {
    const data = await fetchBracket();
    bracketData = data;
    return data;
  } catch (err) {
    bracketData = null;
    throw err;
  }
}

// ---- Load all ----
async function loadAll() {
  if (isFetching) return;
  isFetching = true;
  refreshBtn.disabled = true;

  try {
    const data = await fetchStandings();
    standingsData = data;

    if (!activeTab) {
      activeTab = data.tables[0]?.group || data.tables[0]?.name || 'Group 1';
    }

    // Update tab bar
    let tabHtml = '';
    data.tables.forEach((t) => {
      const label = t.group || t.name || 'Group';
      const isActive = activeTab === label;
      tabHtml += `<button class="tab-btn${isActive ? ' active' : ''}" data-tab="${label}">${label}</button>`;
    });
    const isBracketActive = activeTab === '__bracket__';
    tabHtml += `<button class="tab-btn knockout${isBracketActive ? ' active' : ''}" data-tab="__bracket__">🏆 淘汰赛</button>`;
    tabBarEl.innerHTML = tabHtml;

    if (activeTab === '__bracket__') {
      renderBracketTab();
    } else {
      const table = data.tables.find(t => (t.group || t.name) === activeTab);
      if (table) {
        contentEl.innerHTML = renderGroupTable(table.group || table.name, table.rows);
      } else {
        // fallback
        activeTab = data.tables[0].group || data.tables[0].name;
        contentEl.innerHTML = renderGroupTable(activeTab, data.tables[0].rows);
        // re-render tabs to match
        loadAll();
        return;
      }
      refreshNote.textContent = `数据每60秒自动刷新 · 上次更新: ${new Date().toLocaleTimeString('zh-CN')}`;
    }
  } catch (err) {
    showError(`数据加载失败: ${err.message}`);
  } finally {
    isFetching = false;
    refreshBtn.disabled = false;
  }
}

// ---- Tab switching ----
tabBarEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  if (isFetching) return;

  const tab = btn.dataset.tab;
  if (tab === activeTab) return;
  activeTab = tab;

  // Update active state
  tabBarEl.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  if (tab === '__bracket__') {
    renderBracketTab();
  } else if (standingsData) {
    const table = standingsData.tables.find(t => (t.group || t.name) === tab);
    if (table) {
      contentEl.innerHTML = renderGroupTable(table.group || table.name, table.rows);
      refreshNote.textContent = `数据每60秒自动刷新 · 上次更新: ${new Date().toLocaleTimeString('zh-CN')}`;
    }
  } else {
    loadAll();
  }
});

// ---- Refresh button ----
refreshBtn.addEventListener('click', () => {
  // Clear cached bracket when refreshing
  bracketData = null;
  loadAll();
});

// ---- Auto-refresh ----
function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    bracketData = null;
    loadAll();
  }, 60000);
}

// ---- Init ----
loadAll().then(() => {
  startAutoRefresh();
}).catch(() => {
  startAutoRefresh(); // still start timer so it retries
});

})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
