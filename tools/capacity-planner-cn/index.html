<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团队产能规划</title>
<meta property="og:title" content="团队产能规划">
<meta property="og:description" content="团队产能规划 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="团队产能管理工具，分配资源、平衡工作量、避免过度承诺">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:4px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.9rem;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.member-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.member-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.member-name{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px}
.member-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.capacity-bar{height:12px;background:var(--border);border-radius:6px;overflow:hidden;margin:8px 0}
.capacity-fill{height:100%;border-radius:6px;transition:width .3s}
.capacity-info{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2)}
.task-alloc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.alloc-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:.8rem;cursor:pointer;transition:all .2s}
.alloc-tag:hover{opacity:.8}
.alloc-delete{font-size:.7rem;opacity:.6;transition:opacity .2s}
.alloc-delete:hover{opacity:1}
.add-task-form{display:flex;gap:8px;margin-top:8px}
.add-task-form input,.add-task-form select{margin:0;padding:6px 10px;font-size:.8rem}
.add-task-form select{width:100px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:12px}
.stat-num{font-size:1.8rem;font-weight:700}
.stat-label{font-size:.8rem;color:var(--text2)}
.progress-bar{height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin:16px 0}
.progress-fill{height:100%;border-radius:5px;transition:width .3s}
.alert{padding:12px;border-radius:8px;margin-bottom:16px;font-size:.9rem;display:flex;align-items:center;gap:8px}
.alert-warning{background:rgba(210,153,34,.15);border:1px solid rgba(210,153,34,.3);color:var(--yellow)}
.alert-danger{background:rgba(248,81,73,.15);border:1px solid rgba(248,81,73,.3);color:var(--red)}
.alert-success{background:rgba(63,185,80,.15);border:1px solid rgba(63,185,80,.3);color:var(--green)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px}
.hidden{display:none!important}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.85rem}
.chart-bar{display:flex;align-items:end;gap:4px;height:120px;padding:8px 0}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-fill{width:100%;border-radius:4px 4px 0 0;transition:height .3s}
.chart-label{font-size:.7rem;color:var(--text2);text-align:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.member-card{animation:fadeIn .3s ease-out}
@media(max-width:600px){body{padding:10px}h1{font-size:1.4rem}.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>📊 团队产能</h1>
<p class="subtitle">资源分配与工作量平衡</p>

<div class="stats-grid" id="statsGrid"></div>

<div id="alerts"></div>

<div class="progress-bar" id="teamProgress"></div>
<div style="text-align:center;font-size:.85rem;color:var(--text2);margin-bottom:16px" id="teamProgressText"></div>

<div class="card">
  <div class="flex-between">
    <b>团队产能分布</b>
    <div class="flex">
      <button class="btn btn-sm" onclick="showMemberModal()">+ 添加成员</button>
      <button class="btn btn-sm btn-danger" onclick="resetAll()">重置</button>
    </div>
  </div>
  <div class="chart-bar" id="chartBar" style="margin-top:12px"></div>
</div>

<div id="memberList"></div>
</div>

<div class="modal-overlay hidden" id="memberModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 style="margin-bottom:16px">添加成员</h3>
    <label>姓名</label><input type="text" id="mName" placeholder="例：张三">
    <label>角色</label><input type="text" id="mRole" placeholder="例：前端开发">
    <label>每周可用时间 (小时)</label><input type="number" id="mCapacity" min="1" max="60" value="40">
    <label>颜色</label><input type="color" id="mColor" value="#3b82f6">
    <div class="flex" style="margin-top:16px;justify-content:flex-end">
      <button class="btn btn-danger btn-sm" onclick="closeModal()">取消</button>
      <button class="btn" onclick="saveMember()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="taskModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 style="margin-bottom:16px">添加任务分配</h3>
    <label>任务名称</label><input type="text" id="aName" placeholder="例：用户模块开发">
    <label>预估工时 (小时)</label><input type="number" id="aHours" min="1" max="100" value="8">
    <label>截止日期</label><input type="date" id="aDeadline">
    <div class="flex" style="margin-top:16px;justify-content:flex-end">
      <button class="btn btn-danger btn-sm" onclick="closeModal()">取消</button>
      <button class="btn" onclick="saveAllocation()">保存</button>
    </div>
  </div>
</div>

<script>
document.title='📊 团队产能规划';
const COLORS=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#f97316'];
let team=JSON.parse(localStorage.getItem('capacity_planner_cn')||'null')||{
  members:[
    {id:1,name:'张三',role:'前端开发',capacity:40,color:'#3b82f6',tasks:[{id:1,name:'用户模块',hours:16,deadline:'2025-01-15'},{id:2,name:'首页重构',hours:12,deadline:'2025-01-20'}]},
    {id:2,name:'李四',role:'后端开发',capacity:40,color:'#10b981',tasks:[{id:3,name:'API开发',hours:20,deadline:'2025-01-18'},{id:4,name:'数据库优化',hours:8,deadline:'2025-01-22'}]},
    {id:3,name:'王五',role:'UI设计',capacity:35,color:'#f59e0b',tasks:[{id:5,name:'新版设计稿',hours:10,deadline:'2025-01-12'}]},
    {id:4,name:'赵六',role:'测试',capacity:40,color:'#ef4444',tasks:[{id:6,name:'回归测试',hours:24,deadline:'2025-01-19'}]}
  ]
};
let editingMemberId=null;
let addingTaskTo=null;

function save(){localStorage.setItem('capacity_planner_cn',JSON.stringify(team))}

function showMemberModal(){document.getElementById('mName').value='';document.getElementById('mRole').value='';document.getElementById('mCapacity').value=40;document.getElementById('mColor').value=COLORS[team.members.length%COLORS.length];document.getElementById('memberModal').classList.remove('hidden')}
function closeModal(){document.getElementById('memberModal').classList.add('hidden');document.getElementById('taskModal').classList.add('hidden')}

function saveMember(){
  const name=document.getElementById('mName').value.trim();if(!name)return;
  const role=document.getElementById('mRole').value.trim();
  const capacity=Math.max(1,+document.getElementById('mCapacity').value||40);
  const color=document.getElementById('mColor').value;
  team.members.push({id:Date.now(),name,role,capacity,color,tasks:[]});
  save();render();closeModal();
}
function deleteMember(id){team.members=team.members.filter(m=>m.id!==id);save();render()}
function resetAll(){if(!confirm('确定重置？'))return;team={members:[]};save();render()}

function showTaskModal(memberId){addingTaskTo=memberId;document.getElementById('aName').value='';document.getElementById('aHours').value=8;document.getElementById('aDeadline').value='';document.getElementById('taskModal').classList.remove('hidden')}
function saveAllocation(){
  const name=document.getElementById('aName').value.trim();if(!name)return;
  const hours=Math.max(1,+document.getElementById('aHours').value||8);
  const deadline=document.getElementById('aDeadline').value;
  const member=team.members.find(m=>m.id===addingTaskTo);
  if(member){member.tasks.push({id:Date.now(),name,hours,deadline});save();render()}
  closeModal();
}
function deleteAllocation(memberId,taskId){
  const member=team.members.find(m=>m.id===memberId);
  if(member){member.tasks=member.tasks.filter(t=>t.id!==taskId);save();render()}
}

function render(){
  const totalCapacity=team.members.reduce((s,m)=>s+m.capacity,0);
  const totalAllocated=team.members.reduce((s,m)=>s+m.tasks.reduce((ts,t)=>ts+t.hours,0),0);
  const avgUtil=totalCapacity?Math.round(totalAllocated/totalCapacity*100):0;
  const overloaded=team.members.filter(m=>{const used=m.tasks.reduce((s,t)=>s+t.hours,0);return used>m.capacity}).length;
  const underused=team.members.filter(m=>{const used=m.tasks.reduce((s,t)=>s+t.hours,0);return used<m.capacity*0.5}).length;
  
  document.getElementById('statsGrid').innerHTML=`
    <div class="card stat"><div class="stat-num" style="color:var(--text)">${team.members.length}</div><div class="stat-label">团队成员</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--accent)">${totalCapacity}h</div><div class="stat-label">总产能</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--green)">${avgUtil}%</div><div class="stat-label">平均利用率</div></div>
    <div class="card stat"><div class="stat-num" style="color:${overloaded?'var(--red)':'var(--green)'}">${overloaded}</div><div class="stat-label">超负荷</div></div>`;
  
  let alertHtml='';
  if(overloaded>0)alertHtml+=`<div class="alert alert-danger">⚠️ ${overloaded} 名成员超负荷工作，请调整任务分配</div>`;
  if(underused>0)alertHtml+=`<div class="alert alert-warning">💡 ${underused} 名成员利用率偏低，可分配更多任务</div>`;
  if(avgUtil>=80&&avgUtil<=100)alertHtml+=`<div class="alert alert-success">✅ 团队产能利用率健康（${avgUtil}%）</div>`;
  document.getElementById('alerts').innerHTML=alertHtml;
  
  document.getElementById('teamProgress').innerHTML=`<div class="progress-fill" style="width:${Math.min(100,avgUtil)}%;background:${avgUtil>100?'var(--red)':avgUtil>80?'var(--yellow)':'var(--green)'}"></div>`;
  document.getElementById('teamProgressText').textContent=`团队总利用率：${totalAllocated}/${totalCapacity} 小时（${avgUtil}%）`;
  
  let chartHtml='';
  team.members.forEach(m=>{
    const used=m.tasks.reduce((s,t)=>s+t.hours,0);
    const pct=Math.min(100,used/m.capacity*100);
    chartHtml+=`<div class="chart-col">
      <div style="font-size:.7rem;font-weight:600;color:${pct>100?'var(--red)':pct>80?'var(--yellow)':'var(--green)'}">${Math.round(pct)}%</div>
      <div class="chart-fill" style="height:${pct}%;background:${m.color};min-height:4px"></div>
      <div class="chart-label">${m.name}</div>
    </div>`;
  });
  document.getElementById('chartBar').innerHTML=chartHtml;
  
  let listHtml='';
  team.members.forEach(m=>{
    const used=m.tasks.reduce((s,t)=>s+t.hours,0);
    const pct=Math.min(100,used/m.capacity*100);
    const overUsed=used>m.capacity;
    
    listHtml+=`<div class="card member-card">
      <div class="member-header">
        <div class="member-name"><div class="member-avatar" style="background:${m.color}">${m.name[0]}</div>${m.name} <span style="font-weight:400;font-size:.85rem;color:var(--text2)">${m.role}</span></div>
        <div class="flex" style="gap:4px">
          <button class="btn btn-sm" onclick="showTaskModal(${m.id})" style="background:transparent;border:1px solid var(--border);color:var(--text)">+ 分配</button>
          <button class="btn btn-sm btn-danger" onclick="deleteMember(${m.id})">✕</button>
        </div>
      </div>
      <div class="capacity-bar"><div class="capacity-fill" style="width:${pct}%;background:${overUsed?'var(--red)':pct>80?'var(--yellow)':'var(--green)'}"></div></div>
      <div class="capacity-info"><span>${used}h / ${m.capacity}h 已分配</span><span style="font-weight:600;color:${overUsed?'var(--red)':'var(--text)'}">${Math.round(pct)}%</span></div>
      <div class="task-alloc">
        ${m.tasks.map(t=>`<div class="alloc-tag" style="background:${m.color}22;color:${m.color};border:1px solid ${m.color}44">
          <span>${t.name} (${t.hours}h)</span>
          ${t.deadline?`<span style="font-size:.7rem;color:var(--text2)">${t.deadline}</span>`:''}
          <span class="alloc-delete" onclick="deleteAllocation(${m.id},${t.id})">✕</span>
        </div>`).join('')}
        ${m.tasks.length===0?'<span style="font-size:.8rem;color:var(--text2)">暂无分配</span>':''}
      </div>
    </div>`;
  });
  document.getElementById('memberList').innerHTML=listHtml;
}

render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
