var selectedZodiacs=[];
function renderZodiacs(){
  var grid=document.getElementById('zodiacGrid');
  var html='';
  zodiacs.forEach(function(zodiac,index){
    var isSelected=selectedZodiacs.includes(index);
    html+='<div class="zodiac-item '+(isSelected?'selected':'')+'" onclick="selectZodiac('+index+')">';
    html+='<div class="zodiac-icon">'+zodiac.icon+'</div>';
    html+='<div class="zodiac-name">'+zodiac.name+'</div>';
    html+='</div>';
  });
  grid.innerHTML=html;
}
function selectZodiac(index){
  if(selectedZodiacs.includes(index)){
    selectedZodiacs=selectedZodiacs.filter(function(i){return i!==index;});
  }else if(selectedZodiacs.length<2){
    selectedZodiacs.push(index);
  }else{
    selectedZodiacs=[index];
  }
  renderZodiacs();
}
function clearSelection(){
  selectedZodiacs=[];
  renderZodiacs();
  document.getElementById('result').innerHTML='';
}
function checkCompatibility(){
  if(selectedZodiacs.length!==2){
    alert('请选择两个生肖');
    return;
  }
  var zodiac1=zodiacs[selectedZodiacs[0]];
  var zodiac2=zodiacs[selectedZodiacs[1]];
  var key1=zodiac1.name+'-'+zodiac2.name;
  var key2=zodiac2.name+'-'+zodiac1.name;
  var data=compatibilityData[key1]||compatibilityData[key2];
  if(!data){
    data={score:70,description:'相处融洽，需要互相理解'};
  }
  var scoreColor=data.score>=80?'var(--green)':data.score>=60?'var(--blue)':'var(--red)';
  var scoreLabel=data.score>=80?'非常相配':data.score>=60?'比较相配':'需要努力';
  var html='<div class="card">';
  html+='<div class="result-section">';
  html+='<div class="compatibility-score" style="color:'+scoreColor+'">'+data.score+'分</div>';

  html+='<div style="text-align:center;font-size:1.5rem;margin:20px 0">';
