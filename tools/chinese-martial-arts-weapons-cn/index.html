<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国武术兵器大全 - Chinese Martial Arts Weapons</title>
<meta name="description" content="中国武术兵器大全，涵盖十八般兵器及各类冷兵器详细介绍">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国武术兵器大全 - Chinese Martial Arts Weapons">
<meta property="og:description" content="中国武术兵器大全，涵盖十八般兵器及各类冷兵器详细介绍">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-martial-arts-weapons-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a05 0%,#2a1510 50%,#3d2015 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a,#b06a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.weapon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.weapon-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.weapon-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.weapon-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.weapon-card .w-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.weapon-card .w-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(232,168,124,0.15);color:var(--accent)}
.weapon-card .w-name{font-size:1.3em;font-weight:bold}
.weapon-card .w-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.weapon-card .w-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.weapon-card .w-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.weapon-card .w-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.weapon-card .w-detail strong{color:var(--text)}
.weapon-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.weapon-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>⚔️ 中国武术兵器大全</h1>
<p>Chinese Martial Arts Weapons — 十八般兵器与各类冷兵器详解</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索兵器名称或类型...">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部兵器</button>
<button class="filter-btn" data-filter="长兵器">🏹 长兵器</button>
<button class="filter-btn" data-filter="短兵器">🗡️ 短兵器</button>
<button class="filter-btn" data-filter="双兵器">⚔️ 双兵器</button>
<button class="filter-btn" data-filter="软兵器">🔗 软兵器</button>
<button class="filter-btn" data-filter="暗器">🎯 暗器</button>
<button class="filter-btn" data-filter="奇门兵器">🌀 奇门兵器</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="weapon-grid" id="weaponGrid"></div>
<footer><p>⚔️ 中国武术兵器大全 — 百兵之君，各有所长</p></footer>
</div>
<script>
const WEAPON_DATA=[
  {id:1,name:"刀",en:"Broadsword",category:"短兵器",icon:"🗡️",length:"约1米",weight:"约1.5公斤",origin:"商周",description:"刀是中国武术中最常见的短兵器，单面开刃，有'百兵之胆'之称。刀法以劈、砍、撩、挂为主，动作刚猛有力。",techniques:["劈","砍","撩","挂","抹","斩","扎","扫"],styles:["单刀","双刀","柳叶刀","雁翎刀","苗刀","朴刀"],famousQuote:"刀如猛虎，百兵之胆",notableUse:"军队主战兵器，江湖防身利器"},
  {id:2,name:"剑",en:"Straight Sword",category:"短兵器",icon:"⚔️",length:"约0.8米",weight:"约1公斤",origin:"商周",description:"剑是中国武术中最优雅的兵器，双面开刃，有'百兵之君'之称。剑法轻灵飘逸，讲究'人剑合一'。",techniques:["刺","劈","撩","点","崩","截","抹","洗"],styles:["武当剑","太极剑","昆吾剑","青萍剑","三才剑"],famousQuote:"剑如飞凤，百兵之君",notableUse:"文人佩剑，侠客标配"},
  {id:3,name:"枪",en:"Spear",category:"长兵器",icon:"🏹",length:"约2-4米",weight:"约2-3公斤",origin:"商周",description:"枪是中国武术中最常用的长兵器，有'百兵之王'之称。枪法以扎、拦、拿为主，讲究'枪扎一条线'。",techniques:["扎","拦","拿","劈","崩","点","穿","缠"],styles:["杨家枪","梨花枪","六合枪","峨眉枪","六合大枪"],famousQuote:"枪如游龙，百兵之王",notableUse:"古代战场主战兵器"},
  {id:4,name:"棍",en:"Staff",category:"长兵器",icon:"🪵",length:"约1.8-2米",weight:"约1-2公斤",origin:"远古",description:"棍是中国武术中最古老的兵器，有'百兵之祖'之称。棍法以劈、扫、撩、绞为主，动作大开大合。",techniques:["劈","扫","撩","绞","点","崩","挑","戳"],styles:["少林棍","疯魔棍","灰棍","盘龙棍"],famousQuote:"棍打一大片，百兵之祖",notableUse:"少林寺代表性兵器"},
  {id:5,name:"戟",en:"Halberd",category:"长兵器",icon:"🔱",length:"约2-3米",weight:"约3-4公斤",origin:"商周",description:"戟是戈和矛的结合体，既能刺又能砍，是古代战场的重型兵器。有'百兵之魁'之称。",techniques:["刺","砍","钩","啄","撩","剁","绞","缠"],styles:["方天画戟","青龙戟","蛇矛戟"],famousQuote:"戟之为器，刺砍并用",notableUse:"吕布的标志性兵器"},
  {id:6,name:"斧",en:"Axe",category:"短兵器",icon:"🪓",length:"约0.6-1米",weight:"约2-3公斤",origin:"远古",description:"斧是最古老的兵器之一，以砍劈为主，威力巨大。有'百兵之威'之称。",techniques:["劈","砍","剁","削","拍","撩","截","扫"],styles:["开山斧","双板斧","宣花斧"],famousQuote:"斧之为器，威猛无匹",notableUse:"程咬金的标志性兵器"},
  {id:7,name:"锤",en:"Hammer",category:"短兵器",icon:"🔨",length:"约0.5-1米",weight:"约3-5公斤",origin:"商周",description:"锤是以重量取胜的重型兵器，有'百兵之霸'之称。锤法以砸、砸、扫为主，威力惊人。",techniques:["砸","扫","砸","崩","点","挂","撩","挡"],styles:["流星锤","卧瓜锤","立瓜锤","西瓜锤"],famousQuote:"锤之为器，势大力沉",notableUse:"秦琼的标志性兵器"},
  {id:8,name:"鞭",en:"Whip",category:"软兵器",icon:"🔗",length:"约1-1.5米",weight:"约1-2公斤",origin:"商周",description:"鞭分硬鞭和软鞭两种。硬鞭短小精悍，软鞭灵活多变。有'百兵之灵'之称。",techniques:["抽","扫","缠","绕","点","崩","撩","挂"],styles:["九节鞭","十三节鞭","牧羊鞭","硬鞭"],famousQuote:"鞭之为器，灵动如蛇",notableUse:"江湖常用软兵器"},
  {id:9,name:"锏",en:"Mace",category:"短兵器",icon:"⚔️",length:"约0.8米",weight:"约2-3公斤",origin:"商周",description:"锏是无刃的重型兵器，以砸击为主。锏法沉稳有力，适合近身格斗。",techniques:["砸","扫","崩","点","截","撩","格","架"],styles:["双锏","单锏","虎尾锏"],famousQuote:"锏之为器，刚猛无匹",notableUse:"秦琼的标志性兵器"},
  {id:10,name:"叉",en:"Trident",category:"长兵器",icon:"🔱",length:"约2-3米",weight:"约2-3公斤",origin:"商周",description:"叉是多齿的长兵器，既能刺又能叉，实用性很强。叉法以刺、叉、挡、拨为主。",techniques:["刺","叉","挡","拨","撩","扫","劈","绞"],styles:["牛头叉","马叉","飞叉"],famousQuote:"叉之为器，攻守兼备",notableUse:"渔猎和武术兼用"},
  {id:11,name:"拐",en:"Crutch",category:"奇门兵器",icon:"🦯",length:"约0.8米",weight:"约1-2公斤",origin:"宋代",description:"拐是一种奇特的兵器，形似拐杖，可以藏于日常用品中。拐法以击、打、扫、格为主。",techniques:["击","打","扫","格","撩","点","崩","截"],styles:["长拐","短拐","双拐","丁字拐"],famousQuote:"拐之为器，出其不意",notableUse:"暗藏兵器，出其不意"},
  {id:12,name:"判官笔",en:"Judgment Pen",category:"暗器",icon:"🖊️",length:"约0.3米",weight:"约0.5公斤",origin:"明代",description:"判官笔是一种小型暗器，形似毛笔，可以藏于袖中。以点穴为主，精准致命。",techniques:["点","刺","扎","戳","挑","崩","截","撩"],styles:["单笔","双笔","判官笔"],famousQuote:"判官笔下，生死立判",notableUse:"暗器中的点穴利器"},
  {id:13,name:"飞刀",en:"Flying Dagger",category:"暗器",icon:"🗡️",length:"约0.2米",weight:"约0.2公斤",origin:"商周",description:"飞刀是一种远程投掷暗器，以精准致命著称。飞刀术讲究'百步穿杨'的精准度。",techniques:["直飞","旋飞","回旋飞","反弹飞"],styles:["柳叶飞刀","蝴蝶飞刀","三棱飞刀"],famousQuote:"飞刀一出，例不虚发",notableUse:"远程暗杀利器"},
  {id:14,name:"飞镖",en:"Flying Dart",category:"暗器",icon:"🎯",length:"约0.15米",weight:"约0.1公斤",origin:"商周",description:"飞镖是最常见的暗器之一，体积小，易于携带。飞镖术讲究'快、准、狠'。",techniques:["直射","旋转射","连射","散射"],styles:["金钱镖","梅花镖","毒镖","袖箭"],famousQuote:"飞镖出手，见血封喉",notableUse:"江湖暗器首选"},
  {id:15,name:"峨眉刺",en:"Emei Needle",category:"奇门兵器",icon:"📌",length:"约0.3米",weight:"约0.3公斤",origin:"明代",description:"峨眉刺是峨眉派的代表性兵器，形似绣花针，可以藏于发髻中。以点穴和刺杀为主。",techniques:["点","刺","扎","戳","挑","崩","截","撩"],styles:["单刺","双刺","三棱刺"],famousQuote:"峨眉刺出，防不胜防",notableUse:"峨眉派独门兵器"},
  {id:16,name:"铁扇",en:"Iron Fan",category:"奇门兵器",icon:"🪭",length:"约0.4米",weight:"约1公斤",origin:"明代",description:"铁扇既是文人雅物，又是武术兵器。铁扇术以扇骨击打和扇面遮挡为主，攻防兼备。",techniques:["击","打","扫","格","撩","点","崩","截"],styles:["铁骨折扇","铁骨扇","铁扇功"],famousQuote:"铁扇轻摇，攻守兼备",notableUse:"文武双全的象征"},
  {id:17,name:"绳镖",en:"Rope Dart",category:"软兵器",icon:"🔗",length:"约3-5米",weight:"约0.5公斤",origin:"宋代",description:"绳镖是软兵器的代表，以绳索连接镖头，可以远距离攻击。绳镖术讲究'软中带硬，刚柔并济'。",techniques:["甩","缠","绕","点","崩","撩","扫","挂"],styles:["长绳镖","短绳镖","流星锤"],famousQuote:"绳镖一出，远近皆宜",notableUse:"软兵器中的远程攻击利器"},
  {id:18,name:"流星锤",en:"Meteor Hammer",category:"软兵器",icon:"☄️",length:"约3-5米",weight:"约1-2公斤",origin:"商周",description:"流星锤是软兵器中最重的，以锤头的重量和速度取胜。流星锤术讲究'收放自如，快慢随心'。",techniques:["甩","缠","绕","砸","扫","崩","撩","挂"],styles:["单流星","双流星"],famousQuote:"流星赶月，势不可挡",notableUse:"软兵器中的重型攻击武器"},
  {id:19,name:"藤牌",en:"Rattan Shield",category:"奇门兵器",icon:"🛡️",length:"约0.6米",weight:"约1-2公斤",origin:"明代",description:"藤牌是防御性兵器，以藤条编制，轻便灵活。藤牌术以防守反击为主，是戚继光抗倭的利器。",techniques:["挡","格","撩","扫","劈","砍","扎","戳"],styles:["藤牌","团牌","挨牌"],famousQuote:"藤牌在手，攻守兼备",notableUse:"戚继光抗倭的标志性兵器"},
  {id:20,name:"鸳鸯钺",en:"Mandarin Duck Axe",category:"双兵器",icon:"⚔️",length:"约0.4米",weight:"约0.5公斤",origin:"清代",description:"鸳鸯钺是八卦掌的代表性兵器，成对使用，形似月牙。鸳鸯钺术以勾、挂、撩、刺为主，攻防一体。",techniques:["勾","挂","撩","刺","劈","砍","削","抹"],styles:["子午鸳鸯钺","牛角钺"],famousQuote:"鸳鸯钺出，攻守一体",notableUse:"八卦掌独门双兵器"}
];
function renderCards(data){
  document.getElementById('weaponGrid').innerHTML=data.map(m=>`
    <div class="weapon-card" data-category="${m.category}">
      <div class="w-header"><div class="w-icon">${m.icon}</div><div><div class="w-name">${m.name}</div><div class="w-sub">${m.en} · ${m.origin}</div></div></div>
      <div class="w-meta"><span>长度：${m.length}</span><span>重量：${m.weight}</span></div>
      <div class="w-detail"><strong>简介：</strong>${m.description}</div>
      <div class="w-detail"><strong>技法：</strong>${m.techniques.join('、')}</div>
      <div class="w-detail"><strong>种类：</strong>${m.styles.join('、')}</div>
      <div class="w-detail"><strong>名言：</strong>${m.famousQuote}</div>
      <div class="w-detail"><strong>用途：</strong>${m.notableUse}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">兵器种类</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.weapon-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.weapon-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(WEAPON_DATA);renderStats(WEAPON_DATA);
</script>
</body>
</html>
