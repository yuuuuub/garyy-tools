<!DOCTYPE html>

<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📜 汉字演变</h1><p class="sub">在线查看汉字演变过程</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="showEvolution()">
</div>
<button class="btn" onclick="showEvolution()">查看演变</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var evolutionData={
  '日':{oracle:'☉',bronze:'⊙',seal:'⊙',official:'日',regular:'日',meaning:'太阳'},
  '月':{oracle:'☽',bronze:'☽',seal:'☽',official:'月',regular:'月',meaning:'月亮'},
  '水':{oracle:'〰',bronze:'〜',seal:'〜',official:'水',regular:'水',meaning:'水'},
  '火':{oracle:'🔥',bronze:'🔥',seal:'🔥',official:'火',regular:'火',meaning:'火'},
  '木':{oracle:'🌳',bronze:'🌳',seal:'🌳',official:'木',regular:'木',meaning:'树木'},
  '金':{oracle:'⚜',bronze:'⚜',seal:'⚜',official:'金',regular:'金',meaning:'金属'},
  '土':{oracle:'土',bronze:'土',seal:'土',official:'土',regular:'土',meaning:'土壤'},
  '山':{oracle:'⛰',bronze:'⛰',seal:'⛰',official:'山',regular:'山',meaning:'山'},
  '石':{oracle:'🪨',bronze:'🪨',seal:'🪨',official:'石',regular:'石',meaning:'石头'},
  '田':{oracle:'⊞',bronze:'⊞',seal:'⊞',official:'田',regular:'田',meaning:'田地'},
  '心':{oracle:'♥',bronze:'♥',seal:'♥',official:'心',regular:'心',meaning:'心脏'},
  '手':{oracle:'✋',bronze:'✋',seal:'✋',official:'手',regular:'手',meaning:'手'},
  '目':{oracle:'👁',bronze:'👁',seal:'👁',official:'目',regular:'目',meaning:'眼睛'},
  '口':{oracle:'□',bronze:'□',seal:'□',official:'口',regular:'口',meaning:'嘴'},
  '人':{oracle:'👤',bronze:'👤',seal:'👤',official:'人',regular:'人',meaning:'人类'},
  '大':{oracle:'大',bronze:'大',seal:'大',official:'大',regular:'大',meaning:'大的'},
  '小':{oracle:'小',bronze:'小',seal:'小',official:'小',regular:'小',meaning:'小的'},
  '上':{oracle:'上',bronze:'上',seal:'上',official:'上',regular:'上',meaning:'上面'},
  '下':{oracle:'下',bronze:'下',seal:'下',official:'下',regular:'下',meaning:'下面'},
  '天':{oracle:'天',bronze:'天',seal:'天',official:'天',regular:'天',meaning:'天空'},
  '地':{oracle:'地',bronze:'地',seal:'地',official:'地',regular:'地',meaning:'地面'},
  '年':{oracle:'年',bronze:'年',seal:'年',official:'年',regular:'年',meaning:'年份'},
  '中':{oracle:'中',bronze:'中',seal:'中',official:'中',regular:'中',meaning:'中间'},
  '国':{oracle:'國',bronze:'國',seal:'國',official:'国',regular:'国',meaning:'国家'},
  '龙':{oracle:'龍',bronze:'龍',seal:'龍',official:'龙',regular:'龙',meaning:'龙'},
  '凤':{oracle:'鳳',bronze:'鳳',seal:'鳳',official:'凤',regular:'凤',meaning:'凤凰'},
  '马':{oracle:'馬',bronze:'馬',seal:'馬',official:'马',regular:'马',meaning:'马'},
  '牛':{oracle:'牛',bronze:'牛',seal:'牛',official:'牛',regular:'牛',meaning:'牛'},
  '羊':{oracle:'羊',bronze:'羊',seal:'羊',official:'羊',regular:'羊',meaning:'羊'},
  '鸟':{oracle:'鳥',bronze:'鳥',seal:'鳥',official:'鸟',regular:'鸟',meaning:'鸟'},
  '鱼':{oracle:'魚',bronze:'魚',seal:'魚',official:'鱼',regular:'鱼',meaning:'鱼'},
  '虫':{oracle:'蟲',bronze:'蟲',seal:'蟲',official:'虫',regular:'虫',meaning:'昆虫'},
  '花':{oracle:'花',bronze:'花',seal:'花',official:'花',regular:'花',meaning:'花'},
  '草':{oracle:'草',bronze:'草',seal:'草',official:'草',regular:'草',meaning:'草'},
  '树':{oracle:'樹',bronze:'樹',seal:'樹',official:'树',regular:'树',meaning:'树'},
  '雨':{oracle:'雨',bronze:'雨',seal:'雨',official:'雨',regular:'雨',meaning:'雨'},
  '雪':{oracle:'雪',bronze:'雪',seal:'雪',official:'雪',regular:'雪',meaning:'雪'},
  '风':{oracle:'風',bronze:'風',seal:'風',official:'风',regular:'风',meaning:'风'},
  '云':{oracle:'雲',bronze:'雲',seal:'雲',official:'云',regular:'云',meaning:'云'}
};
function showEvolution(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=evolutionData[char];
  if(!data){
    data={oracle:char,bronze:char,seal:char,official:char,regular:char,meaning:'暂无信息'};
  }
  var html='<div class="card">';
  html+='<div style="text-align:center;padding:20px">';
  html+='<div style="font-size:4rem;font-weight:700;color:var(--blue)">'+char+'</div>';
  html+='<div style="font-size:1.1rem;margin-top:8px">含义：'+data.meaning+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>演变过程</h3>';
  html+='<div class="evolution-timeline">';
  html+='<div class="evolution-item"><div class="evolution-char">'+data.oracle+'</div><div class="evolution-era">商代</div><div class="evolution-name">甲骨文</div></div>';
  html+='<div class="evolution-item"><div class="evolution-char">'+data.bronze+'</div><div class="evolution-era">周代</div><div class="evolution-name">金文</div></div>';
  html+='<div class="evolution-item"><div class="evolution-char">'+data.seal+'</div><div class="evolution-era">秦代</div><div class="evolution-name">小篆</div></div>';
  html+='<div class="evolution-item"><div class="evolution-char">'+data.official+'</div><div class="evolution-era">汉代</div><div class="evolution-name">隶书</div></div>';
  html+='<div class="evolution-item"><div class="evolution-char">'+data.regular+'</div><div class="evolution-era">现代</div><div class="evolution-name">楷书</div></div>';
  html+='</div></div>';
  html+='<div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>Unicode：</strong>U+'+char.charCodeAt(0).toString(16).toUpperCase().padStart(4,'0')+'</div>';
  html+='<div><strong>演变说明：</strong>汉字从甲骨文到现代楷书，经历了数千年的演变过程。</div>';
  html+='</div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(evolutionData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showEvolution();
}
showEvolution();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
