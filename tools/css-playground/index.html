<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS游乐场 - 在线CSS编辑器</title>
<meta name="description" content="CSS在线编辑器，实时编写和预览CSS样式效果">
<style>
:root {
--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
nav .logo{font-size:18px;font-weight:600;color:var(--accent2);}
nav a{color:var(--accent);text-decoration:none;font-size:14px;}
nav a:hover{color:var(--accent2);}
.container{display:flex;flex-direction:column;height:calc(100vh - 52px);}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent2);}
.btn-secondary{background:var(--border);color:var(--text);}
.btn-secondary:hover{background:#3d444d;}
.workspace{display:flex;flex:1;overflow:hidden;}
.editor-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);}
.preview-panel{flex:1;display:flex;flex-direction:column;}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;font-size:13px;color:var(--accent2);font-weight:500;}
.editor-wrapper{flex:1;position:relative;}
#cssEditor{width:100%;height:100%;background:var(--bg);border:none;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:14px;padding:12px;resize:none;outline:none;line-height:1.6;}
.preview-frame{flex:1;border:none;background:#fff;}
.templates{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;}
.templates span{font-size:12px;color:#8b949e;margin-right:8px;}
.template-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--accent2);cursor:pointer;margin-right:6px;margin-bottom:4px;}
.template-btn:hover{border-color:var(--accent);color:var(--accent);}
@media(max-width:768px){
.workspace{flex-direction:column;}
.editor-panel{border-right:none;border-bottom:1px solid var(--border);}
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="CSS游乐场 - 在线CSS编辑器">
  <meta property="og:description" content="CSS在线编辑器，实时编写和预览CSS样式效果">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/css-playground/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<nav>
<span class="logo">CSS游乐场</span>
<a href="/index.html">← 返回工具箱</a>
</nav>
<div class="container">
<div class="toolbar">
<button class="btn btn-primary" onclick="applyCSS()">应用样式</button>
<button class="btn btn-secondary" onclick="formatCSS()">格式化</button>
<button class="btn btn-secondary" onclick="copyCSS()">复制CSS</button>
<button class="btn btn-secondary" onclick="resetCSS()">重置</button>
</div>
<div class="templates">
<span>模板:</span>
<button class="template-btn" data-css=".box{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:20px;border-radius:12px;text-align:center;font-size:24px;box-shadow:0 10px 30px rgba(0,0,0,0.3);}">渐变卡片</button>
<button class="template-btn" data-css=".box{display:flex;gap:10px;flex-wrap:wrap;}.item{background:var(--accent);color:white;padding:15px 20px;border-radius:8px;flex:1;min-width:80px;text-align:center;transition:transform 0.3s;}.item:hover{transform:scale(1.05);}">Flex布局</button>
<button class="template-btn" data-css=".box{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}.item{background:var(--card);border:1px solid var(--border);padding:20px;border-radius:8px;text-align:center;}.item:nth-child(odd){background:var(--accent);color:white;border-color:var(--accent);}">Grid网格</button>
<button class="template-btn" data-css=".box{position:relative;width:200px;height:200px;margin:20px auto;}.circle{width:100%;height:100%;background:conic-gradient(#f85149,#d29922,#3fb950,#3b82f6,#f85149);border-radius:50%;animation:spin 3s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}">动画圆</button>
<button class="template-btn" data-css=".box{text-align:center;padding:20px;}.glitch{font-size:48px;font-weight:bold;color:white;text-shadow:2px 0 #f85149,-2px 0 #3b82f6;animation:glitch 0.5s infinite;}@keyframes glitch{0%,100%{text-shadow:2px 0 #f85149,-2px 0 #3b82f6;}50%{text-shadow:-2px 0 #f85149,2px 0 #3b82f6;}}">故障效果</button>
<button class="template-btn" data-css=".box{display:flex;justify-content:center;align-items:center;height:200px;background:#1a1a2e;}.neon{font-size:36px;color:#fff;text-shadow:0 0 10px #fff,0 0 20px #fff,0 0 40px #3b82f6,0 0 80px #3b82f6;}">霓虹灯</button>
</div>
<div class="workspace">
<div class="editor-panel">
<div class="panel-header">CSS代码</div>
<div class="editor-wrapper">
<textarea id="cssEditor">.box {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 30px;
  border-radius: 16px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
  transition: transform 0.3s, box-shadow 0.3s;
}

.box:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 50px rgba(102, 126, 234, 0.5);
}

.item {
  margin: 10px;
  padding: 10px 20px;
  background: rgba(255,255,255,0.2);
  border-radius: 8px;
  display: inline-block;
}</textarea>
</div>
</div>
<div class="preview-panel">
<div class="panel-header">实时预览</div>
<div id="previewContainer" style="flex:1;padding:20px;overflow:auto;background:#ffffff;">
<div class="box">
CSS样式预览
<div class="item">元素1</div>
<div class="item">元素2</div>
<div class="item">元素3</div>
</div>
</div>
</div>
</div>
</div>
<style id="userStyle"></style>
<script>
const cssEditor=document.getElementById('cssEditor');
const userStyle=document.getElementById('userStyle');
const previewContainer=document.getElementById('previewContainer');

function applyCSS(){
userStyle.textContent=cssEditor.value;
}

function formatCSS(){
let css=cssEditor.value;
css=css.replace(/\s*{\s*/g,' {\n  ');
css=css.replace(/\s*}\s*/g,'\n}\n');
css=css.replace(/;\s*/g,';\n  ');
css=css.replace(/\n  \n/g,'\n');
cssEditor.value=css.trim();
}

function copyCSS(){
navigator.clipboard.writeText(cssEditor.value).then(()=>garyyToast('CSS已复制到剪贴板'));
}

function resetCSS(){
cssEditor.value='.box {\n  background: linear-gradient(135deg, #667eea, #764ba2);\n  color: white;\n  padding: 30px;\n  border-radius: 16px;\n  text-align: center;\n  font-size: 20px;\n  font-weight: bold;\n}';
applyCSS();
}

document.querySelectorAll('.template-btn').forEach(btn=>{
btn.onclick=()=>{
cssEditor.value=btn.dataset.css;
applyCSS();
};
});

cssEditor.addEventListener('input',applyCSS);
applyCSS();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
