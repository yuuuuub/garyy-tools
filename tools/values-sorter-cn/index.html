<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚖️ 价值观排序</title>
<meta name="description" content="价值观排序工具，帮你找到最重要的核心价值观，指导人生决策">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.compare-box{text-align:center;padding:30px}
.compare-label{font-size:.9rem;color:var(--text2);margin-bottom:16px}
.compare-options{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.compare-btn{padding:16px 24px;border:2px solid var(--border);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-size:1.1rem;font-weight:600;color:var(--text);transition:all .2s;min-width:120px}
.compare-btn:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 12px rgba(59,130,246,.2)}
.compare-progress{text-align:center;font-size:.85rem;color:var(--text2);margin-top:12px}
.rank-list{counter-reset:rank}
.rank-item{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border);counter-increment:rank}
.rank-item:last-child{border-bottom:none}
.rank-num{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
.rank-item:nth-child(1) .rank-num{background:#f59e0b}
.rank-item:nth-child(2) .rank-num{background:#94a3b8}
.rank-item:nth-child(3) .rank-num{background:#cd7f32}
.rank-name{font-weight:600;flex:1}
.rank-bar{height:6px;border-radius:3px;background:var(--border);flex:2}
.rank-bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
.rank-score{font-size:.85rem;color:var(--text2);width:50px;text-align:right}
.preset-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.preset-chip{padding:6px 12px;border-radius:16px;font-size:.8rem;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text2);transition:all .2s}
.preset-chip:hover{border-color:var(--accent);color:var(--accent)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="⚖️ 价值观排序">
<meta property="og:description" content="价值观排序工具，找到最重要的核心价值观">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>⚖️ 价值观排序</h1><p>通过两两对比，找到你内心最重要的价值观</p></div>

<div class="cd"><h2>📌 预设价值观</h2>
<div class="preset-chips" id="presetChips"></div></div>

<div class="cd"><h2>➕ 自定义价值观</h2>
<label>价值观名称</label><input type="text" id="valInput" placeholder="如：自由、家庭、成就、健康">
<div class="bg"><button onclick="addValue()">添加价值观</button><button class="sec" onclick="startSort()">开始排序</button></div></div>

<div class="cd" id="sortCard" style="display:none"><h2>⚖️ 两两对比</h2>
<div class="compare-box">
<div class="compare-label" id="compareLabel"></div>
<div class="compare-options" id="compareOptions"></div>
<div class="compare-progress" id="compareProgress"></div>
</div></div>

<div class="cd"><h2>🏆 价值观排名</h2><div id="rankList" class="es">点击"开始排序"进行价值观排序</div></div>

<div class="cd"><h2>📊 统计</h2><div id="stats" class="es">暂无数据</div>
<div class="bg"><button class="sec" onclick="clearAll()">清空全部</button></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let values=JSON.parse(localStorage.getItem('vs_values')||'[]');
let scores={};
let pairs=[],pairIdx=0;

const presets=['自由','家庭','健康','爱情','友谊','事业','财富','成长','创造','冒险','稳定','尊重','公正','知识','快乐','贡献','独立','信仰','美丽','智慧'];

function save(){localStorage.setItem('vs_values',JSON.stringify(values))}

function renderPresets(){
  $('presetChips').innerHTML=presets.map(v=>`<span class="preset-chip" onclick="addPreset('${v}')">${v}</span>`).join('');
}

function addPreset(v){
  if(values.includes(v))return;values.push(v);save();renderValues();
}

function addValue(){
  const v=$('valInput').value.trim();
  if(!v){alert('请输入价值观');return}
  if(values.includes(v)){alert('该价值观已存在');return}
  values.push(v);save();$('valInput').value='';renderValues();
}

function removeValue(idx){values.splice(idx,1);save();renderValues()}

function renderValues(){
  if(!values.length){$('stats').innerHTML='暂无数据';return}
  $('stats').innerHTML=`<div style="text-align:center"><div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${values.length}</div><div style="font-size:.85rem;color:var(--text2)">已添加价值观</div></div>`;
}

function startSort(){
  if(values.length<2){alert('至少需要2个价值观');return}
  scores={};values.forEach(v=>scores[v]=0);
  pairs=[];
  for(let i=0;i<values.length;i++)for(let j=i+1;j<values.length;j++)pairs.push([values[i],values[j]]);
  shuffle(pairs);pairIdx=0;
  $('sortCard').style.display='';
  showPair();
}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}

function showPair(){
  if(pairIdx>=pairs.length){finishSort();return}
  const[a,b]=pairs[pairIdx];
  $('compareLabel').textContent='哪个对你更重要？';
  $('compareOptions').innerHTML=`<div class="compare-btn" onclick="choose('${a}','${b}')">${a}</div><div class="compare-btn" onclick="choose('${b}','${a}')">${b}</div>`;
  $('compareProgress').textContent=`第 ${pairIdx+1} / ${pairs.length} 题`;
}

function choose(winner,loser){scores[winner]++;pairIdx++;showPair()}

function finishSort(){
  $('sortCard').style.display='none';
  const sorted=values.slice().sort((a,b)=>scores[b]-scores[a]);
  const maxScore=Math.max(...Object.values(scores),1);
  $('rankList').innerHTML=`<div class="rank-list">${sorted.map((v,i)=>`<div class="rank-item"><div class="rank-num">${i+1}</div><div class="rank-name">${v}</div><div class="rank-bar"><div class="rank-bar-fill" style="width:${(scores[v]/maxScore)*100}%"></div></div><div class="rank-score">${scores[v]}分</div></div>`).join('')}</div>`;
}

function clearAll(){if(!confirm('确定清空全部数据？'))return;values=[];scores={};pairs=[];save();renderValues();$('rankList').innerHTML='<div class="es">点击"开始排序"进行价值观排序</div>';$('sortCard').style.display='none'}
renderPresets();renderValues();
</script>
</body>
</html>
