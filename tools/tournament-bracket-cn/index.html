<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>锦标赛对阵表</title>
<meta name="description" content="锦标赛对阵表 - 生成和管理单淘汰制锦标赛对阵">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏅</text></svg>">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--gold:#f0b429;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--gold:#d4a017}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-purple{background:#a371f7}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
input{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem;width:100%}
label{display:block;color:var(--text2);font-size:.85rem;margin-bottom:4px}
.form-group{margin-bottom:12px}
textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem;min-height:80px;resize:vertical}
.bracket{display:flex;gap:20px;overflow-x:auto;padding:20px 0}
.round{display:flex;flex-direction:column;justify-content:space-around;min-width:180px}
.round-title{text-align:center;font-weight:700;color:var(--accent);margin-bottom:16px;font-size:.9rem}
.match{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0;margin:8px 0;overflow:hidden}
.match-team{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.match-team:last-child{border-bottom:none}
.match-team:hover{background:rgba(59,130,246,.1)}
.match-team.winner{background:rgba(63,185,80,.15);font-weight:600}
.match-team .score{font-weight:700;color:var(--accent)}
.champion{text-align:center;padding:30px}
.champion-title{font-size:2rem;margin-bottom:8px}
.champion-name{font-size:1.5rem;font-weight:700;color:var(--gold)}
.empty{text-align:center;color:var(--text2);padding:40px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.round{min-width:140px}}
</style>
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🏅 锦标赛对阵表';
const APP=document.getElementById('app');
let participants=[];
let bracket=[];

function render(){
  const hasBracket=bracket.length>0;
  let champion=null;
  if(hasBracket&&bracket[0].length===1) champion=bracket[0][0].winner;
  APP.innerHTML=`
    <h1>🏅 锦标赛对阵表</h1>
    <p class="subtitle">生成和管理单淘汰制锦标赛对阵</p>
    <div class="card">
      <div class="form-group">
        <label>输入参赛选手（每行一个）</label>
        <textarea id="players" placeholder="选手1&#10;选手2&#10;选手3&#10;选手4">${participants.join('\n')}</textarea>
      </div>
      <div class="flex">
        <button class="btn" onclick="loadPlayers()">加载选手</button>
        <button class="btn btn-success" onclick="startTournament()">🏆 开始锦标赛</button>
        <button class="btn btn-sm btn-danger" onclick="reset()">重置</button>
        <span style="color:var(--text2);font-size:.85rem">${participants.length} 名选手</span>
      </div>
    </div>
    ${hasBracket?`
      <div class="card">
        <div class="bracket">
          ${bracket.slice().reverse().map((round,ri)=>`
            <div class="round">
              <div class="round-title">${bracket.length-ri===bracket.length?'第一轮':bracket.length-ri===1?'决赛':'第'+getRoundName(bracket.length-ri)+'轮'}</div>
              ${round.map((m,mi)=>{
                const rIdx=bracket.length-1-ri;
                return `<div class="match">
                  <div class="match-team ${m.winner===m.p1?'winner':''}" onclick="setWinner(${rIdx},${mi},0)">
                    <span>${m.p1||'待定'}</span><span class="score">${m.s1||0}</span>
                  </div>
                  <div class="match-team ${m.winner===m.p2?'winner':''}" onclick="setWinner(${rIdx},${mi},1)">
                    <span>${m.p2||'待定'}</span><span class="score">${m.s2||0}</span>
                  </div>
                </div>`;
              }).join('')}
            </div>
          `).join('')}
        </div>
      </div>
      ${champion?`<div class="card champion"><div class="champion-title">🏆</div><div class="champion-name">${champion}</div><div style="color:var(--text2);margin-top:8px">冠军!</div></div>`:''}
    `:''}
  `;
}

function getRoundName(n){
  const names=['','一','二','三','四','五','六','七','八'];
  return names[n]||n;
}

function loadPlayers(){
  const text=document.getElementById('players').value.trim();
  participants=text.split('\n').map(s=>s.trim()).filter(Boolean);
  save();render();
}

function startTournament(){
  loadPlayers();
  if(participants.length<2){alert('至少需要2名选手');return}
  const size=Math.pow(2,Math.ceil(Math.log2(participants.length)));
  const seeds=[...participants];
  while(seeds.length<size) seeds.push('轮空');
  bracket=[];
  const firstRound=[];
  for(let i=0;i<seeds.length;i+=2){
    firstRound.push({p1:seeds[i],p2:seeds[i+1],s1:0,s2:0,winner:seeds[i+1]==='轮空'?seeds[i]:null});
  }
  bracket.push(firstRound);
  propagate();save();render();
}

function setWinner(rIdx,mIdx,team){
  const m=bracket[rIdx][mIdx];
  const winner=team===0?m.p1:m.p2;
  if(!winner)return;
  m.winner=winner;
  m.s1=team===0?1:0;
  m.s2=team===1?1:0;
  propagate();save();render();
}

function propagate(){
  for(let r=0;r<bracket.length-1;r++){
    const next=bracket[r+1];
    for(let m=0;m<next.length;m++){
      const w1=bracket[r][m*2]?bracket[r][m*2].winner:null;
      const w2=bracket[r][m*2+1]?bracket[r][m*2+1].winner:null;
      next[m].p1=w1||'待定';
      next[m].p2=w2||'待定';
      if(!w1||!w2)next[m].winner=null;
    }
  }
}

function reset(){
  participants=[];bracket=[];save();render();
}

function save(){localStorage.setItem('tb_data',JSON.stringify({participants,bracket}))}
function load(){
  const d=JSON.parse(localStorage.getItem('tb_data')||'null');
  if(d){participants=d.participants||[];bracket=d.bracket||[]}
}
load();render();
</script>
</body>
</html>
