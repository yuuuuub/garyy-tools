<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思维导图 - Mind Map</title>
<meta name="description" content="思维导图工具，可视化展示思路和知识结构">
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --text: #e0e0e0;
    --text2: #a0a0b0;
    --accent: #e94560;
    --accent2: #533483;
    --border: #2a2a4a;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    --radius: 10px;
    --transition: 0.2s ease;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }
  /* ========== 顶部工具栏 ========== */
  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  #toolbar .brand {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    margin-right: 16px;
    letter-spacing: 1px;
  }
  #toolbar button, #toolbar select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: var(--transition);
    white-space: nowrap;
  }
  #toolbar button:hover { background: var(--accent2); border-color: var(--accent); }
  #toolbar button.active { background: var(--accent); border-color: var(--accent); }
  #toolbar .sep { width: 1px; height: 26px; background: var(--border); margin: 0 4px; }
  #toolbar select { cursor: pointer; }
  /* ========== 画布容器 ========== */
  #canvas-wrap {
    position: fixed;
    top: 52px; left: 0; right: 0; bottom: 0;
    cursor: grab;
    overflow: hidden;
  }
  #canvas-wrap:active { cursor: grabbing; }
  #canvas-wrap.dragging-node { cursor: grabbing; }
  svg { width: 100%; height: 100%; }
  /* ========== 节点样式 ========== */
  .node-group { cursor: pointer; }
  .node-rect {
    fill: var(--surface2);
    stroke: var(--border);
    stroke-width: 2;
    rx: 12;
    ry: 12;
    transition: fill 0.15s;
  }
  .node-group.selected .node-rect { stroke: var(--accent); stroke-width: 2.5; filter: drop-shadow(0 0 8px rgba(233, 69, 96, 0.4)); }
  .node-group:hover .node-rect { stroke: var(--accent2); }
  .node-text {
    fill: var(--text);
    font-size: 14px;
    font-family: inherit;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
  .node-root .node-text { font-size: 18px; font-weight: 700; }
  .node-line {
    fill: none;
    stroke: var(--border);
    stroke-width: 2;
    stroke-linecap: round;
  }
  .collapse-btn { fill: var(--surface2); stroke: var(--border); stroke-width: 1.5; cursor: pointer; }
  .collapse-btn text { fill: var(--text); font-size: 12px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  /* ========== 编辑输入框 ========== */
  .inline-editor {
    position: absolute;
    background: var(--surface2);
    border: 2px solid var(--accent);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    padding: 4px 10px;
    border-radius: 6px;
    outline: none;
    text-align: center;
    z-index: 200;
    min-width: 80px;
  }
  /* ========== 底部提示栏 ========== */
  #hint-bar {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 18px;
    font-size: 12px;
    color: var(--text2);
    z-index: 100;
    pointer-events: none;
    box-shadow: var(--shadow);
  }
  /* ========== 模板选择弹窗 ========== */
  #template-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 300;
    align-items: center;
    justify-content: center;
  }
  #template-modal.show { display: flex; }
  #template-modal .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    max-width: 520px;
    width: 90%;
    box-shadow: var(--shadow);
  }
  #template-modal h2 {
    font-size: 20px;
    margin-bottom: 6px;
    color: var(--accent);
  }
  #template-modal .sub { font-size: 13px; color: var(--text2); margin-bottom: 18px; }
  #template-modal .tpl-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  #template-modal .tpl-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    cursor: pointer;
    transition: var(--transition);
  }
  #template-modal .tpl-card:hover { border-color: var(--accent); background: #1a2848; }
  #template-modal .tpl-card h3 { font-size: 15px; margin-bottom: 4px; }
  #template-modal .tpl-card p { font-size: 12px; color: var(--text2); line-height: 1.5; }
  #template-modal .btn-close {
    margin-top: 16px;
    background: var(--accent2);
    color: var(--text);
    border: none;
    padding: 8px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    width: 100%;
  }
  #template-modal .btn-close:hover { background: var(--accent); }
  /* ========== 主题颜色选择 ========== */
  .color-dot {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    margin: 0 2px;
    cursor: pointer;
    border: 2px solid transparent;
    vertical-align: middle;
  }
  .color-dot.active { border-color: #fff; }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="思维导图 - Mind Map">
  <meta property="og:description" content="思维导图工具，可视化展示思路和知识结构">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/mind-map/">
</head>
<body>

<!-- 顶部工具栏 -->
<div id="toolbar">
  <span class="brand">思维导图</span>
  <button onclick="addChildNode()" title="Tab">添加子节点</button>
  <button onclick="addSiblingNode()" title="Enter">添加同级节点</button>
  <button onclick="deleteNode()" title="Delete">删除节点</button>
  <span class="sep"></span>
  <button onclick="undoAction()" title="Ctrl+Z">↩ 撤销</button>
  <button onclick="redoAction()" title="Ctrl+Y">↪ 重做</button>
  <span class="sep"></span>
  <button onclick="autoLayout()">自动布局</button>
  <button onclick="zoomIn()">+</button>
  <button onclick="zoomOut()">−</button>
  <button onclick="resetZoom()">适应</button>
  <span class="sep"></span>
  <select id="themeSelect" onchange="changeTheme(this.value)">
    <option value="">节点主题色</option>
    <option value="#e94560">红色</option>
    <option value="#f39c12">橙色</option>
    <option value="#f1c40f">黄色</option>
    <option value="#2ecc71">绿色</option>
    <option value="#3498db">蓝色</option>
    <option value="#9b59b6">紫色</option>
    <option value="#1abc9c">青色</option>
    <option value="#e74c3c">深红</option>
  </select>
  <button onclick="showTemplates()">模板</button>
  <span class="sep"></span>
  <button onclick="exportPNG()">导出 PNG</button>
  <button onclick="exportSVG()">导出 SVG</button>
  <button onclick="clearAll()" style="color:#e94560;">清空</button>
</div>

<!-- 画布 -->
<div id="canvas-wrap">
  <svg id="svg-canvas"></svg>
</div>

<!-- 底部提示 -->
<div id="hint-bar">
  Tab 添加子节点 | Enter 添加同级 | Delete 删除 | 双击编辑 | 拖拽移动 | 滚轮缩放 | 拖拽空白平移 | Ctrl+Z 撤销
</div>

<!-- 模板选择弹窗 -->
<div id="template-modal">
  <div class="modal-box">
    <h2>选择模板</h2>
    <p class="sub">选择一个预设模板开始，将替换当前内容</p>
    <div class="tpl-grid">
      <div class="tpl-card" onclick="loadTemplate('project')">
        <h3>📋 项目规划</h3>
        <p>需求分析、技术选型、开发排期、测试上线</p>
      </div>
      <div class="tpl-card" onclick="loadTemplate('brainstorm')">
        <h3>💡 头脑风暴</h3>
        <p>创意发散、方案列举、可行性评估、优先级排序</p>
      </div>
      <div class="tpl-card" onclick="loadTemplate('book')">
        <h3>📖 读书笔记</h3>
        <p>核心观点、章节概要、金句摘录、个人感悟</p>
      </div>
      <div class="tpl-card" onclick="loadTemplate('learning')">
        <h3>📚 学习笔记</h3>
        <p>知识点拆解、关联概念、例题练习、总结归纳</p>
      </div>
    </div>
    <button class="btn-close" onclick="closeTemplates()">关闭</button>
  </div>
</div>

<script>
/* ================================================================
   思维导图 - Mind Map (Canvas/SVG 渲染)
   ================================================================ */

// ==================== 核心数据结构 ====================
let nodeIdCounter = 0;
const nodesMap = new Map();  // id -> node

function createNode(text, parentId = null, color = null) {
  const id = ++nodeIdCounter;
  const node = {
    id,
    text,
    parentId,
    children: [],
    collapsed: false,
    color: color || null,
    // 布局坐标（自动计算）
    x: 0, y: 0,
    // 手动偏移（拖拽产生的偏移量，自动布局会重置）
    offsetX: 0, offsetY: 0,
  };
  nodesMap.set(id, node);
  if (parentId !== null) {
    const parent = nodesMap.get(parentId);
    if (parent) parent.children.push(id);
  }
  return node;
}

function getRoot() {
  // 第一个没有 parent 的节点就是根节点
  for (const [, node] of nodesMap) {
    if (node.parentId === null) return node;
  }
  return null;
}

function deleteNodeById(id) {
  const node = nodesMap.get(id);
  if (!node) return;
  // 递归删除子节点
  for (const childId of [...node.children]) {
    deleteNodeById(childId);
  }
  // 从父节点的 children 列表中移除
  if (node.parentId !== null) {
    const parent = nodesMap.get(node.parentId);
    if (parent) {
      parent.children = parent.children.filter(cid => cid !== id);
    }
  }
  nodesMap.delete(id);
}

function isDescendantOf(nodeId, ancestorId) {
  let current = nodeId;
  while (current !== null) {
    const node = nodesMap.get(current);
    if (!node) return false;
    if (node.parentId === ancestorId) return true;
    current = node.parentId;
  }
  return false;
}

// ==================== 颜色主题 ====================
const nodeThemes = [
  '#e94560', '#f39c12', '#f1c40f', '#2ecc71',
  '#3498db', '#9b59b6', '#1abc9c', '#e74c3c',
  '#e67e22', '#2980b9', '#27ae60', '#8e44ad'
];

function getNodeColor(node) {
  if (node.color) return node.color;
  // 根据层级自动分配颜色
  const depth = getDepth(node);
  return nodeThemes[depth % nodeThemes.length];
}

function getDepth(node) {
  let depth = 0;
  let current = node;
  while (current.parentId !== null) {
    depth++;
    current = nodesMap.get(current.parentId);
    if (!current) break;
  }
  return depth;
}

// ==================== SVG 渲染 ====================
const svgEl = document.getElementById('svg-canvas');
const svgNS = 'http://www.w3.org/2000/svg';

// 视图变换
let viewScale = 1;
let viewTranslateX = 0;
let viewTranslateY = 0;

let svgRootGroup; // 根 <g> 元素用于整体变换

function initSvg() {
  svgEl.innerHTML = '';
  svgRootGroup = document.createElementNS(svgNS, 'g');
  svgEl.appendChild(svgRootGroup);
  updateSvgTransform();
}

function updateSvgTransform() {
  if (!svgRootGroup) return;
  svgRootGroup.setAttribute('transform',
    `translate(${viewTranslateX}, ${viewTranslateY}) scale(${viewScale})`
  );
}

// 节点渲染尺寸
const NODE_WIDTH = 120;
const NODE_HEIGHT = 40;
const NODE_RX = 12;
const COLLAPSE_RADIUS = 10;

function renderAll() {
  const root = getRoot();
  if (!root) return;

  // 清除旧内容
  while (svgRootGroup.firstChild) {
    svgRootGroup.removeChild(svgRootGroup.firstChild);
  }

  // 先画连线，再画节点（节点在上层便于点击）
  const linesGroup = document.createElementNS(svgNS, 'g');
  const nodesGroup = document.createElementNS(svgNS, 'g');
  svgRootGroup.appendChild(linesGroup);
  svgRootGroup.appendChild(nodesGroup);

  function renderNode(node, parentNode) {
    const color = getNodeColor(node);
    const hasChildren = node.children.length > 0;

    // 节点坐标 = 自动布局坐标 + 手动偏移
    const nx = (node.x || 0) + (node.offsetX || 0);
    const ny = (node.y || 0) + (node.offsetY || 0);

    // 画连线到父节点
    if (parentNode) {
      const px = (parentNode.x || 0) + (parentNode.offsetX || 0);
      const py = (parentNode.y || 0) + (parentNode.offsetY || 0);
      const line = document.createElementNS(svgNS, 'path');
      const midY = (py + ny) / 2;
      const d = `M ${px} ${py} C ${px} ${midY}, ${nx} ${midY}, ${nx} ${ny}`;
      line.setAttribute('d', d);
      line.setAttribute('class', 'node-line');
      line.setAttribute('stroke', color);
      line.setAttribute('opacity', '0.5');
      linesGroup.appendChild(line);
    }

    // 画节点组
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'node-group');
    if (node.parentId === null) g.classList.add('node-root');
    g.setAttribute('data-id', node.id);
    g.setAttribute('transform', `translate(${nx - NODE_WIDTH/2}, ${ny - NODE_HEIGHT/2})`);
    g.style.cursor = 'pointer';

    // 节点背景
    const rect = document.createElementNS(svgNS, 'rect');
    rect.setAttribute('class', 'node-rect');
    rect.setAttribute('width', NODE_WIDTH);
    rect.setAttribute('height', NODE_HEIGHT);
    rect.setAttribute('fill', color);
    rect.setAttribute('fill-opacity', '0.25');
    rect.setAttribute('stroke', color);
    g.appendChild(rect);

    // 节点文字
    const text = document.createElementNS(svgNS, 'text');
    text.setAttribute('class', 'node-text');
    text.setAttribute('x', NODE_WIDTH / 2);
    text.setAttribute('y', NODE_HEIGHT / 2);
    const displayText = node.text.length > 10 ? node.text.substring(0, 10) + '…' : node.text;
    text.textContent = displayText;
    g.appendChild(text);

    // 折叠/展开按钮（有子节点时显示）
    if (hasChildren) {
      const cg = document.createElementNS(svgNS, 'g');
      cg.setAttribute('class', 'collapse-btn');
      cg.setAttribute('transform', `translate(${NODE_WIDTH + 2}, ${NODE_HEIGHT / 2})`);
      const circle = document.createElementNS(svgNS, 'circle');
      circle.setAttribute('r', COLLAPSE_RADIUS);
      cg.appendChild(circle);
      const ct = document.createElementNS(svgNS, 'text');
      ct.textContent = node.collapsed ? '+' : '−';
      cg.appendChild(ct);
      cg.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCollapse(node.id);
      });
      g.appendChild(cg);
    }

    // 节点点击事件
    g.addEventListener('click', (e) => selectNode(node.id));
    g.addEventListener('dblclick', (e) => startInlineEdit(node.id, e));
    g.addEventListener('mousedown', (e) => startNodeDrag(node.id, e));

    nodesGroup.appendChild(g);

    // 递归渲染子节点（未折叠状态）
    if (!node.collapsed) {
      for (const childId of node.children) {
        const child = nodesMap.get(childId);
        if (child) renderNode(child, node);
      }
    }
  }

  renderNode(root, null);
}

// ==================== 自动布局（径向树） ====================
function autoLayout() {
  const root = getRoot();
  if (!root) return;

  // 重置所有手动偏移
  for (const [, node] of nodesMap) {
    node.offsetX = 0;
    node.offsetY = 0;
  }

  // 径向布局参数
  const RADIUS_STEP = 140;
  const ROOT_X = svgEl.clientWidth / 2;
  const ROOT_Y = svgEl.clientHeight / 2;

  root.x = ROOT_X;
  root.y = ROOT_Y;

  function layoutSubtree(nodeId, depth) {
    const node = nodesMap.get(nodeId);
    if (!node || node.collapsed) return;

    const children = node.children.map(cid => nodesMap.get(cid)).filter(Boolean);
    if (children.length === 0) return;

    const radius = RADIUS_STEP * depth;
    const angleStep = (2 * Math.PI) / children.length;

    // 按顺序均匀分布
    children.forEach((child, i) => {
      const angle = angleStep * i - Math.PI / 2; // 从顶部开始
      child.x = node.x + radius * Math.cos(angle);
      child.y = node.y + radius * Math.sin(angle);
      layoutSubtree(child.id, depth + 1);
    });
  }

  layoutSubtree(root.id, 1);
  renderAll();
}

// ==================== 折叠/展开 ====================
function toggleCollapse(nodeId) {
  pushUndo();
  const node = nodesMap.get(nodeId);
  if (!node) return;
  node.collapsed = !node.collapsed;
  renderAll();
}

// ==================== 选中状态 ====================
let selectedNodeId = null;

function selectNode(nodeId) {
  selectedNodeId = nodeId;
  renderAll();
  // 重新标记选中
  markSelected();
}

function markSelected() {
  if (selectedNodeId === null) return;
  const allGroups = svgRootGroup.querySelectorAll('.node-group');
  allGroups.forEach(g => {
    const nid = parseInt(g.getAttribute('data-id'));
    if (nid === selectedNodeId) {
      g.classList.add('selected');
    } else {
      g.classList.remove('selected');
    }
  });
}

// ==================== 节点操作 ====================
function addChildNode() {
  if (selectedNodeId === null) {
    // 没有选中节点时，创建根节点
    pushUndo();
    createNode('中心主题');
    selectedNodeId = nodeIdCounter;
    autoLayout();
    return;
  }
  pushUndo();
  const newNode = createNode('新节点', selectedNodeId);
  selectedNodeId = newNode.id;
  autoLayout();
}

function addSiblingNode() {
  const root = getRoot();
  if (!root) {
    pushUndo();
    createNode('中心主题');
    selectedNodeId = nodeIdCounter;
    autoLayout();
    return;
  }
  if (selectedNodeId === null || selectedNodeId === root.id) {
    // 根节点没有同级，给它加子节点
    addChildNode();
    return;
  }
  pushUndo();
  const selectedNode = nodesMap.get(selectedNodeId);
  if (selectedNode && selectedNode.parentId !== null) {
    const newNode = createNode('新节点', selectedNode.parentId);
    selectedNodeId = newNode.id;
    autoLayout();
  }
}

function deleteNode() {
  if (selectedNodeId === null) return;
  const node = nodesMap.get(selectedNodeId);
  if (!node) return;
  if (node.parentId === null) {
    // 删除根节点则清空全部
    clearAll();
    return;
  }
  pushUndo();
  const parentId = node.parentId;
  deleteNodeById(selectedNodeId);
  selectedNodeId = parentId;
  autoLayout();
}

function clearAll() {
  if (nodesMap.size === 0) return;
  pushUndo();
  nodesMap.clear();
  nodeIdCounter = 0;
  selectedNodeId = null;
  svgRootGroup.innerHTML = '';
}

// ==================== 撤销/重做 ====================
const undoStack = [];
const redoStack = [];
const MAX_UNDO = 50;

function pushUndo() {
  const snapshot = serializeState();
  undoStack.push(snapshot);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
}

function serializeState() {
  const data = [];
  for (const [, node] of nodesMap) {
    data.push({
      id: node.id,
      text: node.text,
      parentId: node.parentId,
      children: [...node.children],
      collapsed: node.collapsed,
      color: node.color,
      x: node.x,
      y: node.y,
      offsetX: node.offsetX,
      offsetY: node.offsetY,
    });
  }
  return JSON.stringify({ nodes: data, nodeIdCounter, selectedNodeId });
}

function restoreState(json) {
  const state = JSON.parse(json);
  nodesMap.clear();
  nodeIdCounter = state.nodeIdCounter;
  selectedNodeId = state.selectedNodeId;
  for (const nd of state.nodes) {
    const node = {
      id: nd.id,
      text: nd.text,
      parentId: nd.parentId,
      children: nd.children,
      collapsed: nd.collapsed,
      color: nd.color,
      x: nd.x,
      y: nd.y,
      offsetX: nd.offsetX,
      offsetY: nd.offsetY,
    };
    nodesMap.set(node.id, node);
  }
  renderAll();
  markSelected();
}

function undoAction() {
  if (undoStack.length === 0) return;
  redoStack.push(serializeState());
  const snapshot = undoStack.pop();
  restoreState(snapshot);
}

function redoAction() {
  if (redoStack.length === 0) return;
  undoStack.push(serializeState());
  const snapshot = redoStack.pop();
  restoreState(snapshot);
}

// ==================== 行内编辑 ====================
function startInlineEdit(nodeId, event) {
  const node = nodesMap.get(nodeId);
  if (!node) return;

  const nx = (node.x || 0) + (node.offsetX || 0);
  const ny = (node.y || 0) + (node.offsetY || 0);

  // 转换为屏幕坐标
  const screenX = nx * viewScale + viewTranslateX;
  const screenY = ny * viewScale + viewTranslateY;

  // 移除已有编辑器
  removeInlineEditor();

  const input = document.createElement('input');
  input.className = 'inline-editor';
  input.value = node.text;
  input.style.left = (screenX - 60) + 'px';
  input.style.top = (screenY - 12) + 'px';

  input.addEventListener('blur', () => finishInlineEdit(nodeId, input));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finishInlineEdit(nodeId, input); }
    if (e.key === 'Escape') { removeInlineEditor(); }
    e.stopPropagation();
  });

  document.body.appendChild(input);
  input.focus();
  input.select();
}

function finishInlineEdit(nodeId, input) {
  const newText = input.value.trim();
  removeInlineEditor();
  if (newText) {
    const node = nodesMap.get(nodeId);
    if (node && node.text !== newText) {
      pushUndo();
      node.text = newText;
      renderAll();
      markSelected();
    }
  }
}

function removeInlineEditor() {
  const existing = document.querySelector('.inline-editor');
  if (existing) existing.remove();
}

// ==================== 节点拖拽 ====================
let isDraggingNode = false;
let dragNodeId = null;
let dragStartX, dragStartY;
let dragOrigOffsetX, dragOrigOffsetY;

function startNodeDrag(nodeId, event) {
  if (event.button !== 0) return;
  event.preventDefault();
  event.stopPropagation();

  isDraggingNode = true;
  dragNodeId = nodeId;
  const node = nodesMap.get(nodeId);
  dragOrigOffsetX = node.offsetX;
  dragOrigOffsetY = node.offsetY;
  dragStartX = event.clientX;
  dragStartY = event.clientY;

  document.getElementById('canvas-wrap').classList.add('dragging-node');
}

// ==================== 画布平移与缩放 ====================
const canvasWrap = document.getElementById('canvas-wrap');
let isPanning = false;
let panStartX, panStartY;
let panOrigTX, panOrigTY;

canvasWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.max(0.2, Math.min(3, viewScale * delta));

  // 以鼠标位置为中心缩放
  const rect = canvasWrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  viewTranslateX = mx - (mx - viewTranslateX) * (newScale / viewScale);
  viewTranslateY = my - (my - viewTranslateY) * (newScale / viewScale);
  viewScale = newScale;

  updateSvgTransform();
}, { passive: false });

canvasWrap.addEventListener('mousedown', (e) => {
  if (e.target === canvasWrap || e.target === svgEl) {
    isPanning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    panOrigTX = viewTranslateX;
    panOrigTY = viewTranslateY;
  }
});

window.addEventListener('mousemove', (e) => {
  if (isDraggingNode) {
    const dx = (e.clientX - dragStartX) / viewScale;
    const dy = (e.clientY - dragStartY) / viewScale;
    const node = nodesMap.get(dragNodeId);
    if (node) {
      node.offsetX = dragOrigOffsetX + dx;
      node.offsetY = dragOrigOffsetY + dy;
      renderAll();
      markSelected();
    }
  } else if (isPanning) {
    viewTranslateX = panOrigTX + (e.clientX - panStartX);
    viewTranslateY = panOrigTY + (e.clientY - panStartY);
    updateSvgTransform();
  }
});

window.addEventListener('mouseup', () => {
  if (isDraggingNode) {
    document.getElementById('canvas-wrap').classList.remove('dragging-node');
    isDraggingNode = false;
    dragNodeId = null;
  }
  if (isPanning) {
    isPanning = false;
  }
});

// ==================== 缩放按钮 ====================
function zoomIn() {
  viewScale = Math.min(3, viewScale * 1.2);
  updateSvgTransform();
}

function zoomOut() {
  viewScale = Math.max(0.2, viewScale * 0.8);
  updateSvgTransform();
}

function resetZoom() {
  viewScale = 1;
  viewTranslateX = 0;
  viewTranslateY = 0;
  updateSvgTransform();
}

// ==================== 全局键盘快捷键 ====================
window.addEventListener('keydown', (e) => {
  // 在输入框中不处理快捷键
  if (document.querySelector('.inline-editor')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key === 'Tab') {
    e.preventDefault();
    addChildNode();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    addSiblingNode();
  } else if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    deleteNode();
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    if (e.shiftKey) {
      redoAction();
    } else {
      undoAction();
    }
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
    e.preventDefault();
    redoAction();
  } else if (e.key === 'F2') {
    e.preventDefault();
    if (selectedNodeId !== null) {
      startInlineEdit(selectedNodeId, {});
    }
  } else if (e.key === 'Escape') {
    removeInlineEditor();
  }
});

// ==================== 导出功能 ====================
function exportPNG() {
  const svgClone = svgEl.cloneNode(true);
  // 获取完整 SVG 的边界
  const allNodes = Array.from(nodesMap.values());
  if (allNodes.length === 0) return;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  allNodes.forEach(node => {
    const nx = (node.x || 0) + (node.offsetX || 0);
    const ny = (node.y || 0) + (node.offsetY || 0);
    minX = Math.min(minX, nx - NODE_WIDTH);
    minY = Math.min(minY, ny - NODE_HEIGHT);
    maxX = Math.max(maxX, nx + NODE_WIDTH + 40);
    maxY = Math.max(maxY, ny + NODE_HEIGHT + 40);
  });

  const w = maxX - minX + 80;
  const h = maxY - minY + 80;

  const svgData = new XMLSerializer().serializeToString(svgEl);
  const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);

  const canvas = document.createElement('canvas');
  canvas.width = w * 2;
  canvas.height = h * 2;
  const ctx = canvas.getContext('2d');
  ctx.scale(2, 2);

  const img = new Image();
  img.onload = () => {
    // 绘制深色背景
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, -minX + 40, -minY + 40, img.width, img.height);
    URL.revokeObjectURL(url);

    const link = document.createElement('a');
    link.download = '思维导图_' + new Date().toISOString().slice(0, 10) + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  };
  img.src = url;
}

function exportSVG() {
  const svgData = new XMLSerializer().serializeToString(svgEl);
  const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.download = '思维导图_' + new Date().toISOString().slice(0, 10) + '.svg';
  link.href = url;
  link.click();
  URL.revokeObjectURL(url);
}

// ==================== 节点主题色 ====================
function changeTheme(color) {
  if (!color || selectedNodeId === null) return;
  pushUndo();
  const node = nodesMap.get(selectedNodeId);
  if (node) {
    node.color = color;
    // 递归给选中节点的子树都设置这个颜色
    function applyColor(nId) {
      const n = nodesMap.get(nId);
      if (!n) return;
      n.color = color;
      for (const cid of n.children) applyColor(cid);
    }
    applyColor(node.id);
    renderAll();
    markSelected();
  }
}

  const child3 = createNode('分支三', root.id);
  createNode('叶子 5', child3.id);
  createNode('叶子 6', child3.id);

  selectedNodeId = root.id;
  autoLayout();

  // 窗口大小变化时重新布局
  window.addEventListener('resize', () => {
    autoLayout();
  });

  // 点击弹窗背景关闭
  document.getElementById('template-modal').addEventListener('click', function(e) {
    if (e.target === this) closeTemplates();
  });
}
