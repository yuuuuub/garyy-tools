function getCharacterInfo(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var info=characters[char];
  if(!info){
    info={pinyin:'未知',strokes:char.length*2,radical:'未知',meaning:'暂无信息',components:'未知'};
  }
  var html='<div class="card">';
  html+='<div class="character-display">';
  html+='<div class="character-main">'+char+'</div>';
  html+='</div>';
  html+='<div class="character-info">';
  html+='<div class="info-item"><div class="info-value">'+info.pinyin+'</div><div class="info-label">拼音</div></div>';
  html+='<div class="info-item"><div class="info-value">'+info.strokes+'</div><div class="info-label">笔画数</div></div>';
  html+='<div class="info-item"><div class="info-value">'+info.radical+'</div><div class="info-label">部首</div></div>';
  html+='<div class="info-item"><div class="info-value">'+info.meaning+'</div><div class="info-label">含义</div></div>';
  html+='</div>';
  html+='<div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px">';

  html+='<div><strong>Unicode：</strong>U+'+char.charCodeAt(0).toString(16).toUpperCase().padStart(4,'0')+'</div>';
  html+='<div><strong>五笔编码：</strong>暂无</div>';
  html+='</div></div>';
  r.innerHTML=html;
}
