<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线白板工具</title>
<meta name="description" content="在线白板工具，支持自由绘画、添加便签、形状和文字，协作头脑风暴">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}
#toolbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:6px;z-index:100;overflow-x:auto}
#toolbar button,#toolbar select{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;transition:var(--transition);white-space:nowrap}
#toolbar button:hover,#toolbar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#toolbar .sep{width:1px;height:26px;background:var(--border);margin:0 4px;flex-shrink:0}
#toolbar .brand{font-weight:700;color:var(--accent);margin-right:12px;white-space:nowrap}
#toolbar input[type="color"]{width:32px;height:32px;border:none;border-radius:6px;cursor:pointer;background:none;padding:0}
#toolbar input[type="range"]{width:60px;accent-color:var(--accent)}
#canvas-wrap{position:fixed;top:52px;left:0;right:0;bottom:0;overflow:hidden}
canvas{position:absolute;top:0;left:0;cursor:crosshair}
.sticky-note{position:absolute;width:180px;min-height:120px;padding:12px;border-radius:8px;font-size:14px;line-height:1.4;cursor:move;box-shadow:var(--shadow);z-index:10;resize:both;overflow:auto;border:2px solid transparent;transition:border-color .2s}
.sticky-note:hover{border-color:var(--accent)}
.sticky-note textarea{width:100%;height:calc(100% - 24px);border:none;background:transparent;color:#1f2328;font-size:14px;line-height:1.4;resize:none;outline:none}
.sticky-note .close{position:absolute;top:4px;right:8px;cursor:pointer;font-size:16px;color:#666;transition:color .2s}
.sticky-note .close:hover{color:var(--red)}
.text-block{position:absolute;padding:8px 12px;border:2px dashed var(--accent);border-radius:6px;background:transparent;cursor:move;z-index:10;font-size:16px;min-width:100px;min-height:32px;color:var(--text)}
.text-block:focus{outline:none;border-style:solid}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div id="toolbar">
  <span class="brand">🎨 白板</span>
  <button id="btn-draw" class="active" onclick="setTool('draw')">✏️ 画笔</button>
  <button id="btn-eraser" onclick="setTool('eraser')">🧹 橡皮</button>
  <button id="btn-select" onclick="setTool('select')">👆 选择</button>
  <div class="sep"></div>
  <button onclick="addSticky()">📝 便签</button>
  <button onclick="addText()">T 文字</button>
  <div class="sep"></div>
  <input type="color" id="colorPicker" value="#3b82f6" onchange="setColor(this.value)">
  <input type="range" id="lineWidth" min="1" max="20" value="3" onchange="setLineWidth(this.value)">
  <div class="sep"></div>
  <button onclick="clearCanvas()">🗑️ 清空</button>
  <button onclick="exportImage()">💾 导出</button>
  <button onclick="undo()">↩️ 撤销</button>
</div>
<div id="canvas-wrap"></div>
<script>
document.title='🎨 在线白板工具';
const wrap=document.getElementById('canvas-wrap');
let canvas,ctx;
let tool='draw',color='#3b82f6',lineWidth=3;
let isDrawing=false,lastX=0,lastY=0;
let history=[];
let elements=[];

function init(){
  canvas=document.createElement('canvas');
  canvas.width=wrap.clientWidth;
  canvas.height=wrap.clientHeight;
  wrap.appendChild(canvas);
  ctx=canvas.getContext('2d');
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  ctx.fillRect(0,0,canvas.width,canvas.height);
  saveState();
  canvas.addEventListener('mousedown',onDown);
  canvas.addEventListener('mousemove',onMove);
  canvas.addEventListener('mouseup',onUp);
  canvas.addEventListener('mouseleave',onUp);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();onDown(touchToMouse(e))},{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();onMove(touchToMouse(e))},{passive:false});
  canvas.addEventListener('touchend',e=>{e.preventDefault();onUp(touchToMouse(e))},{passive:false});
}

function touchToMouse(e){
  const t=e.touches[0]||e.changedTouches[0];
  return{offsetX:t.clientX-wrap.getBoundingClientRect().left,offsetY:t.clientY-wrap.getBoundingClientRect().top};
}

function setTool(t){
  tool=t;
  document.querySelectorAll('#toolbar button').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+t).classList.add('active');
  canvas.style.cursor=t==='eraser'?'cell':t==='select'?'default':'crosshair';
}

function setColor(c){color=c}
function setLineWidth(w){lineWidth=parseInt(w)}

function onDown(e){
  if(tool==='draw'||tool==='eraser'){
    isDrawing=true;
    lastX=e.offsetX;
    lastY=e.offsetY;
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.strokeStyle=tool==='eraser'?getComputedStyle(document.documentElement).getPropertyValue('--bg').trim():color;
    ctx.lineWidth=tool==='eraser'?lineWidth*3:lineWidth;
    ctx.lineCap='round';
    ctx.lineJoin='round';
  }
}

function onMove(e){
  if(!isDrawing)return;
  ctx.lineTo(e.offsetX,e.offsetY);
  ctx.stroke();
  lastX=e.offsetX;
  lastY=e.offsetY;
}

function onUp(){
  if(isDrawing){isDrawing=false;saveState()}
}

function saveState(){
  history.push(canvas.toDataURL());
  if(history.length>30)history.shift();
}

function undo(){
  if(history.length<=1)return;
  history.pop();
  const img=new Image();
  img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0)};
  img.src=history[history.length-1];
}

function clearCanvas(){
  if(!confirm('确定清空白板？'))return;
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  ctx.fillRect(0,0,canvas.width,canvas.height);
  elements=[];history=[];
  document.querySelectorAll('.sticky-note,.text-block').forEach(el=>el.remove());
  saveState();
}

function addSticky(){
  const colors=['#fff740','#ff7eb9','#7afcff','#98fb98','#ffa07a'];
  const note=document.createElement('div');
  note.className='sticky-note';
  note.style.cssText=`left:${100+Math.random()*300}px;top:${80+Math.random()*200}px;background:${colors[Math.floor(Math.random()*colors.length)]}`;
  note.innerHTML=`<span class="close" onclick="this.parentElement.remove()">✕</span><textarea placeholder="输入内容..."></textarea>`;
  makeDraggable(note);
  wrap.appendChild(note);
}

function addText(){
  const el=document.createElement('div');
  el.className='text-block';
  el.contentEditable=true;
  el.style.cssText=`left:${100+Math.random()*300}px;top:${80+Math.random()*200}px`;
  el.textContent='双击编辑文字';
  makeDraggable(el);
  wrap.appendChild(el);
}

function makeDraggable(el){
  let offsetX,offsetY,dragging=false;
  el.addEventListener('mousedown',e=>{
    if(e.target.tagName==='TEXTAREA'||e.target.tagName==='SPAN'||el.contentEditable==='true'&&document.activeElement===el)return;
    dragging=true;
    offsetX=e.clientX-el.offsetLeft;
    offsetY=e.clientY-el.offsetTop;
    el.style.zIndex=20;
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging)return;
    el.style.left=(e.clientX-offsetX)+'px';
    el.style.top=(e.clientY-offsetY)+'px';
  });
  document.addEventListener('mouseup',()=>{dragging=false;if(el)el.style.zIndex=10});
}

function exportImage(){
  const link=document.createElement('a');
  link.download='whiteboard.png';
  link.href=canvas.toDataURL();
  link.click();
}

window.addEventListener('resize',()=>{
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);
  canvas.width=wrap.clientWidth;
  canvas.height=wrap.clientHeight;
  ctx.putImageData(img,0,0);
});

init();
</script>
</body>
</html>
