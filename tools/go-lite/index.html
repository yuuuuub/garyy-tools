<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>围棋lite</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px}
h1{font-size:1.5rem;margin-bottom:8px;color:var(--accent)}
.info-bar{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.info-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:0.85rem}
.info-item span{color:var(--accent);font-weight:bold}
canvas{border-radius:8px;cursor:pointer;max-width:100%}
.msg{font-size:0.9rem;padding:6px;text-align:center;min-height:30px;color:var(--accent)}
.btn-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:0.9rem;cursor:pointer;font-family:inherit}
button:hover{opacity:0.85}
button.sec{background:var(--card);border:1px solid var(--border);color:var(--text)}
</style>
</head>
<body>
<h1>⚫ 围棋lite</h1>
<div class="info-bar">
  <div class="info-item">⚫ 黑: <span id="blackScore">0</span></div>
  <div class="info-item">⚪ 白: <span id="whiteScore">0</span></div>
  <div class="info-item">🎯 手数: <span id="moveNum">0</span></div>
</div>
<div id="msg" class="msg">⚫ 黑方落子</div>
<canvas id="board"></canvas>
<div class="btn-row">
  <button onclick="passMove()">⏭ 虚着(停一手)</button>
  <button onclick="newGame()">🔄 新局</button>
</div>
<script>
const SIZE=9,CELL=42,PAD=24,CANVAS=SIZE*CELL+PAD*2;
let grid,turn,moves,history,passCount;

function newGame(){
  grid=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
  turn=1;moves=0;passCount=0;history=[];
  document.getElementById('moveNum').textContent=0;
  document.getElementById('msg').textContent='⚫ 黑方落子';
  render();
}

function getGroups(board){
  const visited=Array.from({length:SIZE},()=>Array(SIZE).fill(false));
  const groups=[];
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(board[r][c]!==0&&!visited[r][c]){
      const group=[];const color=board[r][c];
      const queue=[[r,c]];visited[r][c]=true;
      while(queue.length){
        const[cr,cc]=queue.shift();
        group.push({r:cr,c:cc});
        [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>{
          const nr=cr+dr,nc=cc+dc;
          if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&!visited[nr][nc]&&board[nr][nc]===color){
            visited[nr][nc]=true;queue.push([nr,nc]);
          }
        });
      }
      groups.push({color,members:group});
    }
  }
  return groups;
}

function countLiberties(board,group){
  const liberties=new Set();
  group.forEach(({r,c})=>{
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>{
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&board[nr][nc]===0)liberties.add(nr+','+nc);
    });
  });
  return liberties.size;
}

function playMove(r,c){
  if(grid[r][c]!==0)return false;
  const newGrid=grid.map(row=>[...row]);
  newGrid[r][c]=turn;
  // Remove captured groups
  const opp=turn===1?2:1;
  const groups=getGroups(newGrid);
  let captured=false;
  groups.forEach(g=>{
    if(g.color===opp&&countLiberties(newGrid,g.members)===0){
      g.members.forEach(({r:gr,c:gc})=>newGrid[gr][gc]=0);captured=true;
    }
  });
  // Check suicide
  const myGroup=getGroups(newGrid).find(g=>g.members.some(m=>m.r===r&&m.c===c));
  if(myGroup&&countLiberties(newGrid,myGroup.members)===0&&!captured)return false;
  // Ko check
  const key=newGrid.map(row=>row.join('')).join('|');
  if(history.length>0&&history[history.length-1]===key)return false;
  history.push(key);
  grid=newGrid;
  turn=turn===1?2:1;moves++;
  document.getElementById('moveNum').textContent=moves;
  document.getElementById('msg').textContent=turn===1?'⚫ 黑方落子':'⚪ 白方落子';
  render();return true;
}

function passMove(){
  passCount++;
  if(passCount>=2){endGame();return}
  turn=turn===1?2:1;
  document.getElementById('msg').textContent=(turn===1?'⚫ 黑':'⚪ 白')+'方虚着，'+(turn===1?'白':'黑')+'方落子';
  render();
}

function endGame(){
  const groups=getGroups(grid);
  let blackTerr=0,whiteTerr=0;
  // Simple territory counting
  const visited=Array.from({length:SIZE},()=>Array(SIZE).fill(false));
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(grid[r][c]===0&&!visited[r][c]){
      const queue=[[r,c]];visited[r][c]=true;const region=[];let border=[];
      while(queue.length){
        const[cr,cc]=queue.shift();region.push({r:cr,c:cc});
        [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>{
          const nr=cr+dr,nc=cc+dc;
          if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE){
            if(grid[nr][nc]===0&&!visited[nr][nc]){visited[nr][nc]=true;queue.push([nr,nc])}
            else if(grid[nr][nc]!==0)border.push(grid[nr][nc]);
          }
        });
      }
      const bC=new Set(border.filter(v=>v===1)).size;
      const wC=new Set(border.filter(v=>v===2)).size;
      if(bC>0&&wC===0)blackTerr+=region.length;
      else if(wC>0&&bC===0)whiteTerr+=region.length;
    }
  }
  // Count stones
  let bStones=0,wStones=0;
  grid.forEach(row=>row.forEach(v=>{if(v===1)bStones++;else if(v===2)wStones++}));
  document.getElementById('blackScore').textContent=bStones+blackTerr;
  document.getElementById('whiteScore').textContent=wStones+whiteTerr;
  document.getElementById('msg').textContent=`终局！黑方 ${bStones+blackTerr} 目 vs 白方 ${wStones+whiteTerr} 目`;
}

function render(){
  const canvas=document.getElementById('board');
  canvas.width=CANVAS;canvas.height=CANVAS;
  const ctx=canvas.getContext('2d');
  // Board background
  ctx.fillStyle='#C8A86E';
  ctx.fillRect(0,0,CANVAS,CANVAS);
  // Grid lines
  ctx.strokeStyle='#8B7355';ctx.lineWidth=1;
  for(let i=0;i<SIZE;i++){
    ctx.beginPath();ctx.moveTo(PAD+i*CELL,PAD);ctx.lineTo(PAD+i*CELL,PAD+(SIZE-1)*CELL);ctx.stroke();
    ctx.beginPath();ctx.moveTo(PAD,PAD+i*CELL);ctx.lineTo(PAD+(SIZE-1)*CELL,PAD+i*CELL);ctx.stroke();
  }
  // Star points
  const stars=[2,4,6];
  ctx.fillStyle='#8B7355';
  stars.forEach(r=>stars.forEach(c=>{
    ctx.beginPath();ctx.arc(PAD+c*CELL,PAD+r*CELL,3,0,Math.PI*2);ctx.fill();
  }));
  // Stones
  grid.forEach((row,r)=>{
    row.forEach((v,c)=>{
      if(v===0)return;
      const x=PAD+c*CELL,y=PAD+r*CELL;
      ctx.beginPath();ctx.arc(x,y,CELL*0.42,0,Math.PI*2);
      const grad=ctx.createRadialGradient(x-3,y-3,2,x,y,CELL*0.42);
      if(v===1){grad.addColorStop(0,'#555');grad.addColorStop(1,'#111')}
      else{grad.addColorStop(0,'#fff');grad.addColorStop(1,'#ccc')}
      ctx.fillStyle=grad;ctx.fill();
    });
  });
}

document.getElementById('board').addEventListener('click',e=>{
  const rect=e.target.getBoundingClientRect();
  const scale=CANVAS/rect.width;
  const mx=(e.clientX-rect.left)*scale;
  const my=(e.clientY-rect.top)*scale;
  const c=Math.round((mx-PAD)/CELL);
  const r=Math.round((my-PAD)/CELL);
  if(r>=0&&r<SIZE&&c>=0&&c<SIZE){
    if(!playMove(r,c)){
      document.getElementById('msg').textContent='⚠️ 无效位置';
    }
  }
});

newGame();
</script>
</body>
</html>
