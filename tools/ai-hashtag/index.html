<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#️⃣ 标签生成器 - Gary's Tools</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;line-height:1.6;min-height:100vh}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.8rem;font-weight:700;margin-bottom:4px}
header p{color:var(--text2);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.card-title{font-size:.95rem;font-weight:600;margin-bottom:10px;color:var(--text2)}
textarea{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;width:100%;font-size:.9rem;resize:vertical;font-family:inherit;outline:none;transition:border .2s}
textarea:focus{border-color:var(--blue)}
button{padding:9px 20px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:#fff;font-size:.85rem;cursor:pointer;font-family:inherit;transition:opacity .2s}
button:hover{opacity:.9}
.tag{display:inline-block;padding:6px 12px;border-radius:20px;font-size:.8rem;margin:4px;cursor:pointer;background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.25);transition:all .2s;user-select:none}
.tag:hover{background:rgba(59,130,246,.25);transform:translateY(-1px)}
.tag.copied{background:rgba(35,134,54,.2);color:var(--green);border-color:var(--green)}
.btn-group{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.result-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px;min-height:60px}
.tag-list{display:flex;flex-wrap:wrap;gap:0;margin-top:8px}
.copy-all-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:.78rem;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:10px}
.copy-all-btn:hover{background:rgba(35,134,54,.15)}
.error-msg{background:rgba(239,68,68,.1);border:1px solid var(--red);border-radius:6px;padding:10px;color:var(--red);font-size:.82rem;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="container">
<header>
<h1>#️⃣ 标签生成器</h1>
<p>社交媒体标签推荐</p>
</header>
<div class="card">
<div class="card-title">输入关键词/主题</div>
<textarea id="inputText" rows="3" placeholder="输入关键词或主题，例如：旅行、美食、摄影、科技..."></textarea>
<div class="btn-group">
<button id="genBtn">#️⃣ 生成标签</button>
<button id="clearBtn" style="border-color:var(--border);background:transparent;color:var(--text)">清空</button>
</div>
<div id="errorMsg" class="error-msg"></div>
<div id="resultArea" style="display:none">
<div class="result-box">
<div class="card-title">推荐标签（点击复制）</div>
<div id="tagList" class="tag-list"></div>
<button id="copyAllBtn" class="copy-all-btn">📋 复制全部</button>
</div>
</div>
</div>
</div>
<script>
(function(){
'use strict';
var input=document.getElementById('inputText');
var genBtn=document.getElementById('genBtn');
var clearBtn=document.getElementById('clearBtn');
var copyAllBtn=document.getElementById('copyAllBtn');
var resultArea=document.getElementById('resultArea');
var tagList=document.getElementById('tagList');
var errorMsg=document.getElementById('errorMsg');

var TAG_POOL={
  travel:['travel','wanderlust','adventure','explore','vacation','holiday','trip','journey','roadtrip','backpacker','nature','landscape','sunset','beach','mountains','passionpassport','roamtheplanet','travelgram','travelphotography','globetrotter','wanderer','bucketlist','aroundtheworld','travelawesome','neverstopexploring'],
  food:['food','foodie','foodporn','delicious','yummy','instafood','foodphotography','homemade','cooking','baking','tasty','breakfast','lunch','dinner','dessert','healthyfood','organic','vegetarian','chef','restaurant','streetfood','gourmet','foodblogger','taste','flavor'],
  photo:['photography','photooftheday','photo','picture','photographer','photoshoot','picoftheday','instaphoto','shots','capture','moment','focus','lens','camera','shot','image','composition','lighting','beautiful','art','creative','capturethemoment','instagood','photographyeveryday','visual'],
  tech:['tech','technology','digital','innovation','coding','programming','developer','software','hardware','AI','cybersecurity','data','startup','gadget','app','future','science','engineering','computer','design','productivity','smartphone','IoT','blockchain','cloud'],
  music:['music','musician','song','singer','concert','band','guitar','piano','artist','album','melody','rhythm','live','performance','spotify','playlist','rock','pop','hiphop','jazz','classical','indie','festival','vocal','instrument'],
  fitness:['fitness','workout','gym','health','exercise','training','bodybuilding','yoga','cardio','running','strength','motivation','fit','healthylifestyle','wellness','abs','muscle','weightloss','nutrition','sport','active','fitfam','gains','transformation','personaltrainer'],
  fashion:['fashion','style','outfit','ootd','fashionista','trendy','vintage','streetwear','luxury','beauty','makeup','model','designer','clothing','accessories','shoes','bag','jewelry','couture','chic','elegant','classy','fashionblogger','styleinspo','dapper'],
  art:['art','artist','painting','drawing','sketch','illustration','creative','design','gallery','exhibition','abstract','modernart','impressionism','sculpture','watercolor','digitalart','canvas','artwork','inspiration','masterpiece','artistic','creative','artoftheday','contemporary','visualart'],
  nature:['nature','landscape','wildlife','forest','ocean','mountain','river','sky','flower','tree','sunset','sunrise','green','earth','planet','conservation','environment','wild','beauty','peace','serenity','outdoor','hiking','camping','ecofriendly'],
  love:['love','romance','relationship','couple','together','forever','heart','sweet','cute','affection','devotion','passion','soulmate','happiness','cherish','valentine','wedding','engagement','anniversary','crush','dating','lovestory','lovelife','trueLove','romantic']
};

function generateTags(){
  var text=input.value.trim();
  if(!text){showError('请输入关键词');return;}
  hideError();
  var tags=[];
  var lowerText=text.toLowerCase();
  for(var key in TAG_POOL){
    if(lowerText.indexOf(key)>=0 || key.indexOf(lowerText)>=0){
      tags=tags.concat(TAG_POOL[key]);
    }
  }
  var commonTags=['trending','viral','instagood','follow','like','share','explorepage','popular','best','daily','happy','fun','cool','amazing','nice','instadaily','followme','photography','style','life'];
  tags=tags.concat(commonTags);
  tags=shuffle(tags);
  tags=Array.from(new Set(tags)).slice(0,30);
  resultArea.style.display='block';
  tagList.innerHTML=tags.map(function(t,i){
    return '<span class="tag" data-index="'+i+'">#'+t+'</span>';
  }).join('');
}

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
  }
  return arr;
}

function showError(msg){errorMsg.textContent=msg;errorMsg.style.display='block';}
function hideError(){errorMsg.style.display='none';}

tagList.addEventListener('click',function(e){
  var el=e.target.closest('.tag');
  if(!el)return;
  var text=el.textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){
      el.classList.add('copied');
      el.textContent='已复制!';
      setTimeout(function(){el.classList.remove('copied');el.textContent=text;},1200);
    });
  }
});

copyAllBtn.addEventListener('click',function(){
  var tags=tagList.querySelectorAll('.tag');
  var text=Array.from(tags).map(function(t){return t.textContent}).join(' ');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){
      var orig=copyAllBtn.textContent;
      copyAllBtn.textContent='✅ 已复制!';
      setTimeout(function(){copyAllBtn.textContent=orig;},1500);
    });
  }
});

genBtn.addEventListener('click',generateTags);
clearBtn.addEventListener('click',function(){
  input.value='';
  resultArea.style.display='none';
  hideError();
});
})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
