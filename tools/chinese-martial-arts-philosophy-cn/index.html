<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国武术哲学 - Chinese Martial Arts Philosophy</title>
<meta name="description" content="中国武术哲学，涵盖武德、阴阳、五行、道家、佛家等武术思想">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国武术哲学 - Chinese Martial Arts Philosophy">
<meta property="og:description" content="中国武术哲学，涵盖武德、阴阳、五行、道家、佛家等武术思想">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-martial-arts-philosophy-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☯️</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a05 0%,#2a1510 50%,#3d2015 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a,#b06a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.philosophy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px}
.philosophy-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.philosophy-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.philosophy-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.philosophy-card .p-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.philosophy-card .p-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(232,168,124,0.15);color:var(--accent)}
.philosophy-card .p-name{font-size:1.3em;font-weight:bold}
.philosophy-card .p-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.philosophy-card .p-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.philosophy-card .p-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.philosophy-card .p-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.philosophy-card .p-detail strong{color:var(--text)}
.philosophy-card .p-quote{font-style:italic;color:var(--accent);margin-top:8px;padding:8px 12px;background:rgba(232,168,124,0.1);border-radius:8px;font-size:0.9em}
.philosophy-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.philosophy-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>☯️ 中国武术哲学</h1>
<p>Chinese Martial Arts Philosophy — 武以载道，以武悟道</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索哲学思想或概念...">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部思想</button>
<button class="filter-btn" data-filter="武德修养">🙏 武德修养</button>
<button class="filter-btn" data-filter="阴阳哲学">☯️ 阴阳哲学</button>
<button class="filter-btn" data-filter="五行理论">🌿 五行理论</button>
<button class="filter-btn" data-filter="道家思想">🏔️ 道家思想</button>
<button class="filter-btn" data-filter="佛家思想">☸️ 佛家思想</button>
<button class="filter-btn" data-filter="兵法谋略">📖 兵法谋略</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="philosophy-grid" id="philosophyGrid"></div>
<footer><p>☯️ 中国武术哲学 — 武以载道，以武悟道，武道合一</p></footer>
</div>
<script>
const PHILOSOPHY_DATA=[
  {id:1,name:"武德",en:"Martial Virtue",category:"武德修养",icon:"🙏",source:"先秦",description:"武德是武术的灵魂，包括'仁、义、礼、信、勇'五个方面。武德修养是武术训练的首要任务，'未曾学艺先学礼，未曾习武先修德'。",coreValues:["仁：仁者爱人","义：见义勇为","礼：以礼待人","信：言而有信","勇：见义勇为"],quote:"未曾学艺先学礼，未曾习武先修德"},
  {id:2,name:"以柔克刚",en:"Softness Overcomes Hardness",category:"阴阳哲学",icon:"☯️",source:"《道德经》",description:"以柔克刚是太极拳的核心哲学，'天下之至柔，驰骋天下之至坚'。通过柔化对方的力量，达到四两拨千斤的效果。",coreValues:["柔中带刚","刚柔相济","以静制动","后发先至"],quote:"天下之至柔，驰骋天下之至坚"},
  {id:3,name:"阴阳相济",en:"Yin-Yang Harmony",category:"阴阳哲学",icon:"☯️",source:"《易经》",description:"阴阳相济是武术的根本法则，'一阴一阳之谓道'。在武术中表现为虚实、刚柔、快慢、进退的对立统一。",coreValues:["虚实变化","刚柔相济","快慢相间","进退有度"],quote:"一阴一阳之谓道"},
  {id:4,name:"五行拳法",en:"Five Elements Fist",category:"五行理论",icon:"🌿",source:"形意拳",description:"五行拳是形意拳的核心，以金、木、水、火、土五行对应劈、崩、钻、炮、横五种拳法，体现了五行相生相克的原理。",coreValues:["金→劈拳","木→崩拳","水→钻拳","火→炮拳","土→横拳"],quote:"五行相生相克，拳法变化无穷"},
  {id:5,name:"道法自然",en:"Tao Follows Nature",category:"道家思想",icon:"🏔️",source:"《道德经》",description:"道法自然强调顺应自然规律，不强求，不逆势。在武术中表现为'以静制动'、'后发先至'的技击理念。",coreValues:["无为而治","道法自然","清静无为","返璞归真"],quote:"人法地，地法天，天法道，道法自然"},
  {id:6,name:"禅武合一",en:"Zen and Martial Arts Unity",category:"佛家思想",icon:"☸️",source:"少林寺",description:"禅武合一是少林功夫的核心理念，'禅心武意，禅武不二'。通过武术修炼达到禅定的境界，通过禅修提高武术的境界。",coreValues:["禅心武意","以武悟禅","禅武不二","明心见性"],quote:"禅心武意，禅武不二"},
  {id:7,name:"知彼知己",en:"Know Yourself and Your Enemy",category:"兵法谋略",icon:"📖",source:"《孙子兵法》",description:"知彼知己是武术实战的重要原则，'知彼知己，百战不殆'。了解对手的特点和弱点，发挥自己的优势。",coreValues:["知彼知己","百战不殆","以逸待劳","避实击虚"],quote:"知彼知己，百战不殆"},
  {id:8,name:"后发先至",en:"Strike First by Striking Last",category:"道家思想",icon:"🏔️",source:"《道德经》",description:"后发先至是武术的高级技击理念，'不敢为主而为客'。等待对手先出手，然后后发制人，以静制动。",coreValues:["以静制动","后发先至","以逸待劳","借力打力"],quote:"不敢为主而为客"},
  {id:9,name:"拳禅一体",en:"Fist and Zen as One",category:"佛家思想",icon:"☸️",source:"少林寺",description:"拳禅一体强调武术修炼与禅修的统一，'拳无禅意不高，禅无拳法不显'。通过武术修炼达到禅定的境界。",coreValues:["拳禅一体","以武悟禅","禅拳归一","明心见性"],quote:"拳无禅意不高，禅无拳法不显"},
  {id:10,name:"四两拨千斤",en:"Four Ounces Move a Thousand",category:"阴阳哲学",icon:"☯️",source:"太极拳",description:"四两拨千斤是太极拳的高级技法，通过巧妙的力量运用，以小力胜大力。体现了阴阳转化的哲学思想。",coreValues:["以小胜大","以弱胜强","借力打力","四两拨千斤"],quote:"四两拨千斤，以弱胜强"},
  {id:11,name:"内外兼修",en:"Internal and External Cultivation",category:"武德修养",icon:"🙏",source:"传统武术",description:"内外兼修强调武术不仅是外在的技击，更是内在的修养。'外练筋骨皮，内练一口气'，内外合一才能达到武术的最高境界。",coreValues:["外练筋骨皮","内练一口气","内外合一","形神兼备"],quote:"外练筋骨皮，内练一口气"},
  {id:12,name:"以武会友",en:"Make Friends Through Martial Arts",category:"武德修养",icon:"🙏",source:"传统武术",description:"以武会友强调武术的社交功能，通过武术交流结交朋友，切磋技艺，共同提高。'以武会友，以友辅仁'。",coreValues:["以武会友","以友辅仁","切磋技艺","共同提高"],quote:"以武会友，以友辅仁"},
  {id:13,name:"形意合一",en:"Form and Intent as One",category:"道家思想",icon:"🏔️",source:"形意拳",description:"形意合一强调形与意的统一，'形为意之体，意为形之帅'。外在的形体动作要由内在的意念来引导。",coreValues:["形为意体","意为形帅","形意合一","意在形先"],quote:"形为意之体，意为形之帅"},
  {id:14,name:"虚实变化",en:"Void and Solid Changes",category:"兵法谋略",icon:"📖",source:"《孙子兵法》",description:"虚实变化是武术技击的重要原则，'兵无常势，水无常形'。通过虚实变化迷惑对手，创造进攻机会。",coreValues:["兵无常势","水无常形","虚虚实实","变化无穷"],quote:"兵无常势，水无常形"},
  {id:15,name:"天人合一",en:"Unity of Heaven and Man",category:"道家思想",icon:"🏔️",source:"《道德经》",description:"天人合一强调人与自然的和谐统一，在武术中表现为顺应自然规律，达到人与自然的和谐。",coreValues:["天人合一","道法自然","顺应自然","和谐统一"],quote:"天人合一，道法自然"},
  {id:16,name:"以德服人",en:"Win People by Virtue",category:"武德修养",icon:"🙏",source:"儒家思想",description:"以德服人强调武术家应该以道德修养来服人，而不是以武力压人。'以力服人者，非心服也'。",coreValues:["以德服人","以力服人非心服","德高望重","武德双馨"],quote:"以力服人者，非心服也"}
];
function renderCards(data){
  document.getElementById('philosophyGrid').innerHTML=data.map(m=>`
    <div class="philosophy-card" data-category="${m.category}">
      <div class="p-header"><div class="p-icon">${m.icon}</div><div><div class="p-name">${m.name}</div><div class="p-sub">${m.en} · ${m.source}</div></div></div>
      <div class="p-meta"><span>${m.category}</span></div>
      <div class="p-detail"><strong>阐释：</strong>${m.description}</div>
      <div class="p-detail"><strong>核心：</strong>${m.coreValues.join('、')}</div>
      <div class="p-quote">"${m.quote}"</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">哲学思想</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.philosophy-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.philosophy-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(PHILOSOPHY_DATA);renderStats(PHILOSOPHY_DATA);
</script>
</body>
</html>
