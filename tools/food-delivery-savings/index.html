<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🍜 外卖省钱计算器</title>
  <meta name="description" content="外卖省钱计算器，比较各平台外卖价格找到最划算方案">
  <style>
:root {--bg: #1a1a2e;
--card-bg: rgba(30, 30, 50, 0.85);
--text: #f0e6d8;
--text-secondary: #b8a99a;
--border: rgba(255, 140, 50, 0.2);
--accent: #ff6b35;
--accent2: #f7931e;
--input-bg: rgba(255, 255, 255, 0.06);
--input-border: rgba(255, 140, 50, 0.3);
--delivery: #ff6b35;
--cook: #4caf50;
--dinein: #448aff;
--radius: 16px;
--shadow: 0 4px 30px rgba(255, 107, 53, 0.15);
--warning: #ff9800;
--save: #4caf50}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
overflow-x: hidden;
padding: 16px}
.bg-pattern {position: fixed; top: 0; left: 0; width: 100%; height: 100%;
pointer-events: none; z-index: 0;
background:
radial-gradient(circle at 20% 50%, rgba(255, 107, 53, 0.06) 0%, transparent 50%),
radial-gradient(circle at 80% 80%, rgba(76, 175, 80, 0.04) 0%, transparent 50%),
radial-gradient(circle at 50% 20%, rgba(247, 147, 30, 0.04) 0%, transparent 50%)}
.container {position: relative; z-index: 1;
width: 100%; max-width: 520px;
margin: 0 auto}
h1 {text-align: center;
font-size: 1.8rem;
margin-bottom: 6px;
background: linear-gradient(135deg, #ff6b35, #f7931e, #ffab40);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text}
.subtitle {text-align: center;
font-size: 13px;
color: var(--text-secondary);
margin-bottom: 24px}
.input-card {background: var(--card-bg);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 24px 20px;
box-shadow: var(--shadow);
margin-bottom: 20px}
.input-row {display: flex;
align-items: center;
justify-content: space-between;
padding: 10px 0;
border-bottom: 1px solid rgba(255,255,255,0.04)}
.input-row:last-of-type { border-bottom: none; }
.input-label {font-size: 14px;
color: var(--text-secondary);
min-width: 110px}
.input-field {display: flex;
align-items: center;
gap: 6px}
.input-field span {font-size: 14px;
color: var(--text-secondary)}
.input-field input {width: 80px;
padding: 8px 10px;
border-radius: 10px;
border: 1px solid var(--input-border);
background: var(--input-bg);
color: var(--text);
font-size: 15px;
text-align: center;
outline: none;
transition: border-color 0.3s}
.input-field input:focus {border-color: var(--accent);
box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.15)}
.input-field input::placeholder { color: rgba(184, 169, 154, 0.5); }
.btn-row {display: flex;
gap: 10px;
margin-top: 16px}
.btn {flex: 1;
padding: 12px 20px;
border-radius: 12px;
border: none;
cursor: pointer;
font-size: 15px;
font-weight: 600;
transition: all 0.3s;
white-space: nowrap}
.btn-calc {background: linear-gradient(135deg, #ff6b35, #f7931e);
color: var(--text);
box-shadow: 0 4px 20px rgba(255, 107, 53, 0.3)}
.btn-calc:hover {transform: translateY(-1px);
box-shadow: 0 6px 25px rgba(255, 107, 53, 0.45)}
.btn-calc:active { transform: translateY(0); }
.btn-reset {background: rgba(255,255,255,0.06);
color: var(--text-secondary);
border: 1px solid var(--border)}
.btn-reset:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.result-card {background: var(--card-bg);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 24px 20px;
box-shadow: var(--shadow);
margin-bottom: 20px;
display: none}
.result-card.visible { display: block; }
.section-title {font-size: 16px;
font-weight: 700;
margin-bottom: 16px;
color: var(--accent2);
display: flex;
align-items: center;
gap: 8px}
.section-title::after {content: '';
flex: 1;
height: 1px;
background: var(--border)}
.chart-area {margin-bottom: 20px}
.bar-group {margin-bottom: 14px}
.bar-label {display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 6px;
font-size: 14px}
.bar-label .name { font-weight: 600; }
.bar-label .amount { color: var(--text-secondary); font-size: 13px; }
.bar-track {height: 28px;
border-radius: 8px;
background: rgba(255,255,255,0.05);
overflow: hidden;
position: relative}
.bar-fill {height: 100%;
border-radius: 8px;
transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
display: flex;
align-items: center;
justify-content: flex-end;
padding-right: 10px;
font-size: 12px;
font-weight: 700;
color: var(--text);
min-width: 0;
position: relative}
.bar-fill.delivery { background: linear-gradient(90deg, #ff6b35, #f7931e); }
.bar-fill.cook { background: linear-gradient(90deg, #2e7d32, #4caf50); }
.bar-fill.dinein { background: linear-gradient(90deg, #1565c0, #448aff); }
.bar-fill .bar-text {white-space: nowrap;
text-shadow: 0 1px 3px rgba(0,0,0,0.3)}
.legend {display: flex;
gap: 16px;
margin-bottom: 12px;
flex-wrap: wrap}
.legend-item {display: flex;
align-items: center;
gap: 6px;
font-size: 12px;
color: var(--text-secondary)}
.legend-dot {width: 10px;
height: 10px;
border-radius: 3px}
.legend-dot.delivery { background: var(--delivery); }
.legend-dot.cook { background: var(--cook); }
.legend-dot.dinein { background: var(--dinein); }
.summary-grid {display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-bottom: 20px}
.summary-item {background: rgba(255,255,255,0.04);
border-radius: 12px;
padding: 14px;
text-align: center;
border: 1px solid rgba(255,255,255,0.06)}
.summary-item .val {font-size: 22px;
font-weight: 800;
margin-bottom: 4px}
.summary-item .lbl {font-size: 12px;
color: var(--text-secondary)}
.summary-item.highlight {border-color: var(--accent);
background: rgba(255, 107, 53, 0.08)}
.summary-item.highlight .val { color: var(--accent); }
.summary-item.save {border-color: var(--save);
background: rgba(76, 175, 80, 0.06)}
.summary-item.save .val { color: var(--save); }
.fun-section {margin-top: 20px;
padding-top: 16px;
border-top: 1px solid var(--border)}
.fun-item {display: flex;
align-items: center;
gap: 10px;
padding: 10px 0;
font-size: 14px;
border-bottom: 1px solid rgba(255,255,255,0.03)}
.fun-item:last-child { border-bottom: none; }
.fun-emoji { font-size: 22px; }
.fun-text { flex: 1; line-height: 1.5; }
.fun-highlight { color: var(--accent2); font-weight: 700; }
.delivery-warning {margin-top: 16px;
padding: 14px 16px;
background: rgba(255, 152, 0, 0.08);
border: 1px solid rgba(255, 152, 0, 0.2);
border-radius: 12px;
font-size: 14px;
text-align: center;
line-height: 1.6}
.delivery-warning .big-num {font-size: 20px;
font-weight: 800;
color: var(--warning)}
.empty-state {display: none;
text-align: center;
padding: 40px 20px;
color: var(--text-secondary);
font-size: 15px;
line-height: 1.8}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; display: block; }
@media (max-width: 380px) {h1 { font-size: 1.5rem; }
.input-label { min-width: 90px; font-size: 13px; }
.input-field input { width: 64px; font-size: 14px; }
.summary-grid { grid-template-columns: 1fr; }
.container { padding: 0; }}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🍜 外卖省钱计算器">
  <meta property="og:description" content="外卖省钱计算器，比较各平台外卖价格找到最划算方案">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/food-delivery-savings/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>

<div class="bg-pattern"></div>

<div class="container">
  <h1>🍜 外卖省钱计算器</h1>
  <p class="subtitle">算算你每月在外卖上花了多少钱</p>

  <div class="input-card">
    <div class="input-row">
      <span class="input-label">📦 每周点外卖</span>
      <div class="input-field">
        <input type="number" id="weekCount" placeholder="0" min="0" max="50" value="5"/>
        <span>次</span>
      </div>
    </div>
    <div class="input-row">
      <span class="input-label">💰 平均每单金额</span>
      <div class="input-field">
        <input type="number" id="avgPrice" placeholder="0" min="0" max="500" value="35" step="0.1"/>
        <span>元</span>
      </div>
    </div>
    <div class="input-row">
      <span class="input-label">🛵 平均配送费</span>
      <div class="input-field">
        <input type="number" id="deliveryFee" placeholder="0" min="0" max="50" value="4" step="0.1"/>
        <span>元</span>
      </div>
    </div>
    <div class="input-row">
      <span class="input-label">📋 平均打包费</span>
      <div class="input-field">
        <input type="number" id="packFee" placeholder="0" min="0" max="20" value="2" step="0.1"/>
        <span>元</span>
      </div>
    </div>
    <div class="input-row">
      <span class="input-label">🎫 月均优惠券</span>
      <div class="input-field">
        <input type="number" id="coupon" placeholder="0" min="0" max="500" value="30" step="0.1"/>
        <span>元</span>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-calc" onclick="calculate()">📊 计算对比</button>
      <button class="btn btn-reset" onclick="resetAll()">重置</button>
    </div>
  </div>

  <div class="result-card" id="resultCard">

    <div class="section-title">📊 每月花费对比</div>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot delivery"></span> 点外卖</div>
      <div class="legend-item"><span class="legend-dot cook"></span> 自己做饭</div>
      <div class="legend-item"><span class="legend-dot dinein"></span> 去店里吃</div>
    </div>
    <div class="chart-area" id="chartArea"></div>

    <div class="section-title">💡 省钱明细</div>
    <div class="summary-grid" id="summaryGrid"></div>

    <div class="section-title">🎯 趣味换算</div>
    <div class="fun-section" id="funSection"></div>

    <div class="delivery-warning" id="deliveryWarning"></div>
  </div>

  <div class="empty-state" id="emptyState">
    <span class="icon">🍱</span>
    输入你的外卖习惯<br>看看能省下多少钱
  </div>
</div>

<script>
const SWITCH_PRICE = 2100;
const ESCAPE_ROOM_PRICE = 128;
const MOVIE_PRICE = 45;
function getVal(id) {
  return parseFloat(document.getElementById(id).value) || 0;
}
function calculate() {
  const weekCount = getVal('weekCount');
  const avgPrice = getVal('avgPrice');
  const deliveryFee = getVal('deliveryFee');
  const packFee = getVal('packFee');
  const coupon = getVal('coupon');
  if (weekCount === 0 && avgPrice === 0) {
    document.getElementById('resultCard').classList.remove('visible');
    return;
  }
  const monthsPerYear = 12;
  const weeksPerMonth = 4.3;
  const monthlyOrders = weekCount * weeksPerMonth;
  const monthlyTotal = (avgPrice + deliveryFee + packFee) * monthlyOrders - coupon;
  const cookIngredientPerMeal = avgPrice * 0.4;
  const monthlyCook = cookIngredientPerMeal * monthlyOrders;
  const monthlyDineIn = avgPrice * monthlyOrders;
  const saveByCook = monthlyTotal - monthlyCook;
  const saveByDineIn = monthlyTotal - monthlyDineIn;
  const annualDeliveryPack = (deliveryFee + packFee) * monthlyOrders * monthsPerYear;
  const maxVal = Math.max(monthlyTotal, monthlyCook, monthlyDineIn, 1);
  const chartArea = document.getElementById('chartArea');
  chartArea.innerHTML = `
    <div class="bar-group">
      <div class="bar-label">
        <span class="name" style="color:var(--delivery)">🛵 点外卖</span>
        <span class="amount">¥${monthlyTotal.toFixed(0)}/月</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill delivery" style="width:0%" data-width="${((monthlyTotal/maxVal)*100).toFixed(1)}%">
          <span class="bar-text">¥${monthlyTotal.toFixed(0)}</span>
        </div>
      </div>
    </div>
    <div class="bar-group">
      <div class="bar-label">
        <span class="name" style="color:var(--cook)">🍳 自己做饭</span>
        <span class="amount">¥${monthlyCook.toFixed(0)}/月</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill cook" style="width:0%" data-width="${((monthlyCook/maxVal)*100).toFixed(1)}%">
          <span class="bar-text">¥${monthlyCook.toFixed(0)}</span>
        </div>
      </div>
    </div>
    <div class="bar-group">
      <div class="bar-label">
        <span class="name" style="color:var(--dinein)">🍽️ 去店里吃</span>
        <span class="amount">¥${monthlyDineIn.toFixed(0)}/月</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill dinein" style="width:0%" data-width="${((monthlyDineIn/maxVal)*100).toFixed(1)}%">
          <span class="bar-text">¥${monthlyDineIn.toFixed(0)}</span>
        </div>
      </div>
    </div>
  `;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.querySelectorAll('.bar-fill').forEach(bar => {
        bar.style.width = bar.getAttribute('data-width');
      });
    });
  });
  const summaryGrid = document.getElementById('summaryGrid');
  summaryGrid.innerHTML = `
    <div class="summary-item highlight">
      <div class="val">¥${monthlyTotal.toFixed(0)}</div>
      <div class="lbl">每月外卖总花费</div>
    </div>
    <div class="summary-item save">
      <div class="val">¥${saveByCook.toFixed(0)}</div>
      <div class="lbl">做饭月省</div>
    </div>
    <div class="summary-item">
      <div class="val">¥${monthlyCook.toFixed(0)}</div>
      <div class="lbl">自己做饭月花</div>
    </div>
    <div class="summary-item">
      <div class="val">¥${saveByDineIn.toFixed(0)}</div>
      <div class="lbl">去店里吃月省</div>
    </div>
  `;
  const annualSaveCook = saveByCook * monthsPerYear;
  const switchCount = Math.floor(annualSaveCook / SWITCH_PRICE);
  const escapeCount = Math.floor(annualSaveCook / ESCAPE_ROOM_PRICE);
  const movieCount = Math.floor(annualSaveCook / MOVIE_PRICE);
  const funSection = document.getElementById('funSection');
  funSection.innerHTML = `
    <div class="fun-item">
      <span class="fun-emoji">🎮</span>
      <span class="fun-text">省下来的钱够买 <span class="fun-highlight">${switchCount}</span> 台 Nintendo Switch</span>
    </div>
    <div class="fun-item">
      <span class="fun-emoji">🔍</span>
      <span class="fun-text">够去 <span class="fun-highlight">${escapeCount}</span> 次密室逃脱</span>
    </div>
    <div class="fun-item">
      <span class="fun-emoji">🎬</span>
      <span class="fun-text">够看 <span class="fun-highlight">${movieCount}</span> 场电影</span>
    </div>
  `;
  const deliveryWarning = document.getElementById('deliveryWarning');
  deliveryWarning.innerHTML = `
    ⚠️ 你一年给外卖平台贡献了<br>
    <span class="big-num">¥${annualDeliveryPack.toFixed(0)}</span> 的配送费+打包费
  `;
  document.getElementById('resultCard').classList.add('visible');
}
function resetAll() {
  document.getElementById('weekCount').value = 5;
  document.getElementById('avgPrice').value = 35;
  document.getElementById('deliveryFee').value = 4;
  document.getElementById('packFee').value = 2;
  document.getElementById('coupon').value = 30;
  document.getElementById('resultCard').classList.remove('visible');
}
document.querySelectorAll('input').forEach(input => {
  input.addEventListener('input', () => {
    calculate();
  });
});
calculate();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
