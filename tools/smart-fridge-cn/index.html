<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧊 智能冰箱监控</title>
<meta name="description" content="智能冰箱温度监控、食材管理与过期提醒">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.temp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.temp-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.temp-label{font-size:.85rem;color:var(--text2);margin-bottom:8px}
.temp-value{font-size:2rem;font-weight:700}
.temp-value.cool{color:var(--accent)}
.temp-value.fridge{color:var(--success)}
.temp-value.freeze{color:var(--warn)}
.temp-target{font-size:.8rem;color:var(--text2);margin-top:4px}
.food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.food-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:all .2s}
.food-item:hover{border-color:var(--accent)}
.food-item.expiring{border-color:var(--warn)}
.food-item.expired{border-color:var(--danger)}
.food-icon{font-size:2rem;margin-bottom:8px}
.food-name{font-size:.9rem;font-weight:600}
.food-expiry{font-size:.8rem;color:var(--text2);margin-top:4px}
.food-quantity{font-size:.8rem;color:var(--accent);margin-top:2px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.stat-label{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.stat-value{font-size:1.5rem;font-weight:700;color:var(--accent)}
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-item{padding:12px;background:var(--bg);border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.alert-item.warning{border-left:4px solid var(--warn)}
.alert-item.danger{border-left:4px solid var(--danger)}
.alert-info{display:flex;align-items:center;gap:12px}
.alert-icon{font-size:1.5rem}
.alert-text{font-weight:600}
.alert-time{font-size:.8rem;color:var(--text2)}
.recipe-list{display:flex;flex-direction:column;gap:8px}
.recipe-item{padding:12px;background:var(--bg);border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.recipe-info{display:flex;align-items:center;gap:12px}
.recipe-icon{font-size:1.5rem}
.recipe-name{font-weight:600}
.recipe-time{font-size:.85rem;color:var(--text2)}
.settings-group{margin-bottom:16px}
.settings-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px}
.settings-group input[type=text],.settings-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
.toggle-group{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.toggle-group:last-child{border-bottom:none}
.toggle{width:50px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background .2s;cursor:pointer}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s}
.toggle.on::after{transform:translateX(24px)}
button{padding:8px 16px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🧊 智能冰箱监控">
<meta property="og:description" content="智能冰箱温度监控、食材管理与过期提醒">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🧊 智能冰箱监控</h1><p>温度监控，食材管理，过期提醒</p></div>

<div class="cd">
<h2>温度监控</h2>
<div class="temp-grid" id="tempGrid"></div>
</div>

<div class="cd">
<h2>食材库存</h2>
<div class="food-grid" id="foodGrid"></div>
<div style="margin-top:12px">
<button onclick="addFood()">+ 添加食材</button>
</div>
</div>

<div class="cd">
<h2>过期提醒</h2>
<div class="alert-list" id="alertList"></div>
</div>

<div class="cd">
<h2>使用统计</h2>
<div class="stats-grid">
<div class="stat-card">
<div class="stat-label">今日开门</div>
<div class="stat-value" id="doorCount">12</div>
</div>
<div class="stat-card">
<div class="stat-label">本月能耗</div>
<div class="stat-value" id="monthEnergy">45</div>
<div style="font-size:.8rem;color:var(--text2)">千瓦时</div>
</div>
<div class="stat-card">
<div class="stat-label">食材总量</div>
<div class="stat-value" id="foodTotal">28</div>
</div>
<div class="stat-card">
<div class="stat-label">即将过期</div>
<div class="stat-value" id="expiringCount">3</div>
</div>
</div>
</div>

<div class="cd">
<h2>推荐菜谱</h2>
<div class="recipe-list" id="recipeList"></div>
</div>

<div class="cd">
<h2>冰箱设置</h2>
<div class="settings-group">
<label>冰箱名称</label>
<input type="text" id="fridgeName" value="智能冰箱" onchange="saveSettings()">
</div>
<div class="settings-group">
<label>制冷模式</label>
<select id="coolingMode" onchange="saveSettings()">
<option value="auto" selected>自动</option>
<option value="soft">软冷冻</option>
<option value="quick">速冻</option>
<option value="holiday">假日模式</option>
</select>
</div>
<div class="toggle-group">
<span>开门提醒</span>
<div class="toggle on" id="doorAlertToggle" onclick="toggleSetting('doorAlert')"></div>
</div>
<div class="toggle-group">
<span>温度报警</span>
<div class="toggle on" id="tempAlertToggle" onclick="toggleSetting('tempAlert')"></div>
</div>
<div class="toggle-group">
<span>节能模式</span>
<div class="toggle" id="ecoToggle" onclick="toggleSetting('eco')"></div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let foods=JSON.parse(localStorage.getItem('sf_foods')||'[]');
let alerts=JSON.parse(localStorage.getItem('sf_alerts')||'[]');
let settings=JSON.parse(localStorage.getItem('sf_settings')||'{"name":"智能冰箱","mode":"auto","doorAlert":true,"tempAlert":true,"eco":false}');
const temps=[
  {id:'冷藏',value:4,target:'0-10°C',class:'fridge'},
  {id:'冷冻',value:-18,target:'-18°C',class:'freeze'},
  {id:'变温',value:0,target:'-20~10°C',class:'cool'}
];
const recipes=[
  {name:'番茄炒蛋',icon:'🍳',time:'15分钟',ingredients:['番茄','鸡蛋']},
  {name:'清炒时蔬',icon:'🥬',time:'10分钟',ingredients:['青菜','蒜']},
  {name:'红烧肉',icon:'🥩',time:'60分钟',ingredients:['五花肉','酱油','糖']}
];

function saveFoods(){localStorage.setItem('sf_foods',JSON.stringify(foods));}
function saveAlerts(){localStorage.setItem('sf_alerts',JSON.stringify(alerts.slice(-20)));}
function saveSettings(){localStorage.setItem('sf_settings',JSON.stringify(settings));}

function updateUI(){
  $('fridgeName').value=settings.name;
  $('coolingMode').value=settings.mode;
  ['doorAlert','tempAlert','eco'].forEach(key=>{
    $(key+'Toggle').className='toggle '+(settings[key]?'on':'');
  });
  $('foodTotal').textContent=foods.length;
  $('expiringCount').textContent=foods.filter(f=>isExpiring(f.expiry)).length;
}

function renderTemps(){
  $('tempGrid').innerHTML=temps.map(t=>`
    <div class="temp-card">
      <div class="temp-label">${t.id}</div>
      <div class="temp-value ${t.class}">${t.value}°C</div>
      <div class="temp-target">目标: ${t.target}</div>
    </div>
  `).join('');
}

function renderFoods(){
  $('foodGrid').innerHTML=foods.map((f,i)=>`
    <div class="food-item ${isExpiring(f.expiry)?'expiring':isExpired(f.expiry)?'expired':''}" onclick="editFood(${i})">
      <div class="food-icon">${f.icon}</div>
      <div class="food-name">${f.name}</div>
      <div class="food-expiry">${f.expiry}</div>
      <div class="food-quantity">${f.quantity}</div>
    </div>
  `).join('');
}

function isExpiring(dateStr){
  const expiry=new Date(dateStr);
  const now=new Date();
  const diff=(expiry-now)/(1000*60*60*24);
  return diff>0&&diff<=3;
}

function isExpired(dateStr){
  return new Date(dateStr)<new Date();
}

function addFood(){
  const name=prompt('食材名称:');
  const icon=prompt('图标 (emoji):');
  const expiry=prompt('过期日期 (YYYY-MM-DD):');
  const quantity=prompt('数量:');
  if(name&&icon&&expiry&&quantity){
    foods.push({name,icon,expiry,quantity});
    saveFoods();
    renderFoods();
    updateUI();
  }
}

function editFood(index){
  const action=prompt('操作 (delete/edit):');
  if(action==='delete'){
    foods.splice(index,1);
    saveFoods();
    renderFoods();
    updateUI();
  }
}

function renderAlerts(){
  const now=new Date();
  const expiringAlerts=foods.filter(f=>isExpiring(f.expiry)).map(f=>({
    type:'warning',
    icon:'⚠️',
    text:f.name+'即将过期',
    time:f.expiry
  }));
  const expiredAlerts=foods.filter(f=>isExpired(f.expiry)).map(f=>({
    type:'danger',
    icon:'❌',
    text:f.name+'已过期',
    time:f.expiry
  }));
  alerts=[...expiredAlerts,...expiringAlerts,...alerts].slice(0,20);
  saveAlerts();
  
  $('alertList').innerHTML=alerts.map(a=>`
    <div class="alert-item ${a.type}">
      <div class="alert-info">
        <div class="alert-icon">${a.icon}</div>
        <div>
          <div class="alert-text">${a.text}</div>
          <div class="alert-time">${a.time}</div>
        </div>
      </div>
    </div>
  `).join('');
}

function renderRecipes(){
  $('recipeList').innerHTML=recipes.map(r=>`
    <div class="recipe-item">
      <div class="recipe-info">
        <div class="recipe-icon">${r.icon}</div>
        <div>
          <div class="recipe-name">${r.name}</div>
          <div class="recipe-time">${r.time} | ${r.ingredients.join(', ')}</div>
        </div>
      </div>
      <button onclick="alert('开始制作 ${r.name}')">制作</button>
    </div>
  `).join('');
}

function toggleSetting(key){
  settings[key]=!settings[key];
  saveSettings();
  updateUI();
}

function updateTemps(){
  temps.forEach(t=>{
    t.value+=(Math.random()-0.5)*0.5;
    t.value=parseFloat(t.value.toFixed(1));
  });
  renderTemps();
}

// Initialize with sample data
if(foods.length===0){
  foods=[
    {name:'牛奶',icon:'🥛',expiry:'2024-12-20',quantity:'1盒'},
    {name:'鸡蛋',icon:'🥚',expiry:'2024-12-25',quantity:'10个'},
    {name:'苹果',icon:'🍎',expiry:'2024-12-28',quantity:'5个'},
    {name:'牛肉',icon:'🥩',expiry:'2024-12-22',quantity:'500g'},
    {name:'豆腐',icon:'🧈',expiry:'2024-12-19',quantity:'1块'}
  ];
  saveFoods();
}

updateUI();
renderTemps();
renderFoods();
renderAlerts();
renderRecipes();
setInterval(updateTemps,10000);
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
