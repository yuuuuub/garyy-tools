<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⌨️ 键盘声</title>
<meta property="og:title" content="⌨️ 键盘声">
<meta property="og:description" content="⌨️ 键盘声 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线机械键盘声模拟器，多种轴体音效，白噪音打字声">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⌨️</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#14b8a6;--accent2:#0d9488;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0d9488;--accent2:#0f766e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.ctn{width:100%;max-width:500px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow)}
header{text-align:center;margin-bottom:24px}h1{font-size:1.5rem;font-weight:700}.sub{color:var(--text2);font-size:.85rem;margin-top:4px}
.section{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}.section h2{font-size:1rem;margin-bottom:12px;color:var(--accent)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{padding:14px 8px;border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;transition:all .2s;background:var(--card)}.mode:hover{border-color:var(--accent)}.mode.active{border-color:var(--accent);background:rgba(20,184,166,.1)}
.mode .icon{font-size:1.6rem;display:block;margin-bottom:4px}.mode .name{font-size:.8rem;color:var(--text2)}.mode.active .name{color:var(--accent);font-weight:600}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}.slider-row label{font-size:.85rem;color:var(--text2);min-width:60px}
.slider-row input[type="range"]{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--border);outline:none}
.slider-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--card)}
.slider-row span{font-size:.85rem;min-width:36px;text-align:right}
.speed-btns{display:flex;gap:6px;margin-top:8px}
.sbtn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text);font-size:.8rem;cursor:pointer;transition:all .2s}.sbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.timer-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tbtn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text);font-size:.8rem;cursor:pointer;transition:all .2s}.tbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ctrls{display:flex;gap:10px;margin-top:14px}.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}.btn-play{background:var(--accent);color:#fff}.btn-play:hover{background:var(--accent2)}.btn-play.playing{background:#ef4444}.btn-stop{background:var(--border);color:var(--text)}
.status{text-align:center;margin-top:12px;font-size:.85rem;color:var(--text2);min-height:20px}
.viz{display:flex;align-items:end;justify-content:center;gap:2px;height:50px;margin-top:12px}.bar{width:3px;background:var(--accent);border-radius:2px;transition:height .1s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.ctn{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="ctn">
<header><h1>⌨️ 键盘声</h1><p class="sub">模拟机械键盘打字声，专注工作</p></header>

<div class="section"><h2>🎵 轴体类型</h2>
<div class="modes" id="modes"></div></div>

<div class="section">
<div class="slider-row"><label>音量</label><input type="range" id="vol" min="0" max="100" value="50" oninput="setVol(this.value)"><span id="volV">50%</span></div>
<div class="slider-row"><label>回声</label><input type="range" id="echo" min="0" max="100" value="20" oninput="setEcho(this.value)"><span id="echoV">20%</span></div>
<div class="slider-row"><label>底噪</label><input type="range" id="ambient" min="0" max="100" value="10" oninput="setAmbient(this.value)"><span id="ambientV">10%</span></div>
</div>

<div class="section"><h2>⚡ 打字速度</h2>
<div class="speed-btns" id="speedBtns">
<button class="sbtn" onclick="setSpeed(80,this)">慢速</button>
<button class="sbtn active" onclick="setSpeed(40,this)">中速</button>
<button class="sbtn" onclick="setSpeed(20,this)">快速</button>
<button class="sbtn" onclick="setSpeed(10,this)">极快</button>
</div></div>

<div class="section"><h2>⏱ 定时</h2>
<div class="timer-btns">
<button class="tbtn active" onclick="setTimer(0,this)">不限</button>
<button class="tbtn" onclick="setTimer(15,this)">15分钟</button>
<button class="tbtn" onclick="setTimer(30,this)">30分钟</button>
<button class="tbtn" onclick="setTimer(60,this)">1小时</button>
</div></div>

<div class="ctrls">
<button class="btn btn-play" id="playBtn" onclick="toggle()">▶ 播放</button>
<button class="btn btn-stop" onclick="stop()">⏹ 停止</button>
</div>
<div class="viz" id="viz"></div>
<div class="status" id="status">选择轴体，点击播放</div>
</div>

<script src="../i18n.js" defer></script>
<script>
const switchTypes=[
  {id:'blue',icon:'🔵',name:'青轴',desc:'清脆段落'},
  {id:'red',icon:'🔴',name:'红轴',desc:'线性直上'},
  {id:'brown',icon:'🟤',name:'茶轴',desc:'微段落'},
  {id:'black',icon:'⚫',name:'黑轴',desc:'重压力'},
  {id:'silver',icon:'⚪',name:'银轴',desc:'极速触发'},
  {id:'typewriter',icon:'📜',name:'打字机',desc:'复古机械'}
];

let actx=null,gain=null,playing=false,current='blue',timerId=null,timerMin=0;
let keyTimer=null,ambientNode=null,speedMs=40;

function $(id){return document.getElementById(id);}

function initModes(){const g=$('modes');switchTypes.forEach((m,i)=>{const d=document.createElement('div');d.className='mode'+(i===0?' active':'');d.innerHTML=`<span class="icon">${m.icon}</span><span class="name">${m.name}</span>`;d.onclick=()=>{current=m.id;g.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));d.classList.add('active');if(playing){stop();toggle();}};g.appendChild(d);});}
function initViz(){const v=$('viz');for(let i=0;i<32;i++){const b=document.createElement('div');b.className='bar';b.style.height='2px';v.appendChild(b);}}
function setVol(v){$('volV').textContent=v+'%';if(gain)gain.gain.value=v/100;}
function setEcho(v){$('echoV').textContent=v+'%';}
function setAmbient(v){$('ambientV').textContent=v+'%';if(ambientNode)ambientNode.gain.value=v/100*0.05;}
function setSpeed(ms,t){speedMs=ms;document.querySelectorAll('.sbtn').forEach(x=>x.classList.remove('active'));t.classList.add('active');}
function setTimer(m,t){timerMin=m;document.querySelectorAll('.tbtn').forEach(x=>x.classList.remove('active'));t.classList.add('active');}

function createNoise(ctx,len){const buf=ctx.createBuffer(1,len||ctx.sampleRate*2,ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;return s;}

function keyPress(){
  if(!actx||!playing)return;
  const now=actx.currentTime;
  const echoLevel=$('echo').value/100;

  const freqMap={
    blue:{base:3000,mod:1500,noise:4000},
    red:{base:2000,mod:1000,noise:3000},
    brown:{base:2500,mod:1200,noise:3500},
    black:{base:1800,mod:900,noise:2500},
    silver:{base:3500,mod:1800,noise:5000},
    typewriter:{base:1500,mod:800,noise:2000}
  };
  const f=freqMap[current];

  const osc=actx.createOscillator();osc.type='square';
  osc.frequency.value=f.base+Math.random()*500;
  const g=actx.createGain();
  g.gain.setValueAtTime(0,now);
  g.gain.linearRampToValueAtTime(0.06,now+0.001);
  g.gain.exponentialRampToValueAtTime(0.001,now+0.03);
  osc.connect(g);g.connect(gain);
  osc.start(now);osc.stop(now+0.04);

  const nBuf=actx.createBuffer(1,actx.sampleRate*0.02,actx.sampleRate);
  const nd=nBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const nSrc=actx.createBufferSource();nSrc.buffer=nBuf;
  const ng=actx.createGain();
  ng.gain.setValueAtTime(0,now);
  ng.gain.linearRampToValueAtTime(0.04,now+0.001);
  ng.gain.exponentialRampToValueAtTime(0.001,now+0.025);
  const nf=actx.createBiquadFilter();nf.type='highpass';nf.frequency.value=f.noise;
  nSrc.connect(nf);nf.connect(ng);ng.connect(gain);
  nSrc.start(now);nSrc.stop(now+0.03);

  if(current==='typewriter'&&Math.random()<0.3){
    const ding=actx.createOscillator();ding.type='sine';ding.frequency.value=1200;
    const dg=actx.createGain();
    dg.gain.setValueAtTime(0.03,now+0.01);
    dg.gain.exponentialRampToValueAtTime(0.001,now+0.3);
    ding.connect(dg);dg.connect(gain);
    ding.start(now+0.01);ding.stop(now+0.35);
  }

  if(echoLevel>0.1){
    const delay=actx.createDelay();delay.delayTime.value=0.05;
    const fb=actx.createGain();fb.gain.value=echoLevel*0.3;
    g.connect(delay);delay.connect(fb);fb.connect(delay);delay.connect(gain);
  }
}

function setupAudio(){
  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  gain=actx.createGain();gain.gain.value=$('vol').value/100;gain.connect(actx.destination);

  const ambientVal=$('ambient').value/100;
  if(ambientVal>0){
    const ambNoise=createNoise(actx);
    const ambLp=actx.createBiquadFilter();ambLp.type='lowpass';ambLp.frequency.value=300;
    ambientNode=actx.createGain();ambientNode.gain.value=ambientVal*0.05;
    ambNoise.connect(ambLp);ambLp.connect(ambientNode);ambientNode.connect(gain);
    ambNoise.start();
  }

  function typeLoop(){
    if(!playing)return;
    keyPress();
    const pause=Math.random()<0.15?(speedMs*3+Math.random()*200):0;
    keyTimer=setTimeout(typeLoop,speedMs+Math.random()*speedMs+pause);
  }
  typeLoop();
}

function toggle(){if(playing){stop();return;}setupAudio();playing=true;$('playBtn').textContent='⏸ 暂停';$('playBtn').classList.add('playing');$('status').textContent='正在播放：'+switchTypes.find(s=>s.id===current).name;animateViz();if(timerMin>0)timerId=setTimeout(()=>{stop();$('status').textContent='定时结束';},timerMin*60000);}

function stop(){if(!playing)return;if(keyTimer){clearTimeout(keyTimer);keyTimer=null;}if(gain){gain.disconnect();gain=null;}ambientNode=null;playing=false;$('playBtn').textContent='▶ 播放';$('playBtn').classList.remove('playing');$('status').textContent='已停止';if(timerId){clearTimeout(timerId);timerId=null;}document.querySelectorAll('.bar').forEach(b=>b.style.height='2px');}

function animateViz(){if(!playing)return;document.querySelectorAll('.bar').forEach(b=>{b.style.height=(Math.random()*30+4)+'px';});requestAnimationFrame(()=>setTimeout(animateViz,80));}

initModes();initViz();
</script>
</body>
</html>
