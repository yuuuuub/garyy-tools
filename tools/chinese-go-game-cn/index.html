<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国围棋</title><meta name="description" content="中国围棋 - 双人对弈围棋游戏"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#d29922;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin:4px}.btn:hover{opacity:.85}.btn-group{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}.board-wrap{text-align:center;overflow-x:auto;padding:10px}.board{display:inline-grid;gap:0;background:#dcb35c;padding:20px;border-radius:8px;position:relative}.cell{width:32px;height:32px;position:relative;cursor:pointer}.cell::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:#8b6914}.cell::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:#8b6914}.stone{width:28px;height:28px;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;box-shadow:1px 1px 3px rgba(0,0,0,.4)}.stone.black{background:radial-gradient(circle at 35% 35%,#555,#111)}.stone.white{background:radial-gradient(circle at 35% 35%,#fff,#ccc)}.cell.last-move .stone::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:var(--red)}.score-panel{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:8px;margin:12px 0}.player{display:flex;align-items:center;gap:8px}.player-stone{width:24px;height:24px;border-radius:50%}.player-stone.black{background:radial-gradient(circle at 35% 35%,#555,#111)}.player-stone.white{background:radial-gradient(circle at 35% 35%,#fff,#ccc)}.player-name{font-weight:600}.player-score{font-size:1.2rem;font-weight:700;color:var(--blue)}.turn-indicator{font-size:1rem;padding:6px 16px;border-radius:20px;font-weight:600}.turn-indicator.black-turn{background:rgba(0,0,0,.2);color:#fff}.turn-indicator.white-turn{background:rgba(200,200,200,.3);color:#333}.mode-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}.mode-tab{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text2);font-size:.85rem}.mode-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.history-log{max-height:200px;overflow-y:auto;font-size:.8rem;color:var(--text2);padding:8px;background:var(--bg);border-radius:8px;margin-top:8px}</style><meta property="og:title" content="中国围棋"><meta property="og:description" content="中国围棋 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚫</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>⚫ 中国围棋</h1><p class="sub">双人对弈围棋游戏</p>
<div class="card">
<div class="mode-tabs">
<div class="mode-tab active" onclick="setSize(9,this)">9路</div>
<div class="mode-tab" onclick="setSize(13,this)">13路</div>
<div class="mode-tab" onclick="setSize(19,this)">19路</div>
</div>
<div class="btn-group">
<button class="btn" onclick="newGame()">新游戏</button>
<button class="btn" onclick="passMove()">虚手</button>
<button class="btn" onclick="undoMove()">悔棋</button>
<button class="btn" onclick="endGame()">终局计分</button>
</div>
<div class="score-panel">
<div class="player"><div class="player-stone black"></div><div><div class="player-name">黑棋</div><div class="player-score" id="blackScore">0</div></div></div>
<div class="turn-indicator black-turn" id="turnIndicator">⚫ 黑棋落子</div>
<div class="player"><div class="player-stone white"></div><div><div class="player-name">白棋</div><div class="player-score" id="whiteScore">0</div></div></div>
</div>
</div>
<div class="card">
<div class="board-wrap"><div class="board" id="board"></div></div>
</div>
<div class="card">
<h3 style="margin-bottom:8px">棋谱记录</h3>
<div class="history-log" id="historyLog">暂无记录</div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var boardSize=9,board=[],currentPlayer='black',moveHistory=[],lastMove=null,gameActive=true;
function newGame(){
board=[];currentPlayer='black';moveHistory=[];lastMove=null;gameActive=true;
for(var r=0;r<boardSize;r++){board[r]=[];for(var c=0;c<boardSize;c++){board[r][c]='empty';}}
renderBoard();updateTurn();document.getElementById('historyLog').textContent='新游戏开始';
}
function setSize(s,el){
boardSize=s;document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');newGame();
}
function renderBoard(){
var b=document.getElementById('board');
b.style.gridTemplateColumns='repeat('+boardSize+',32px)';
var html='';
for(var r=0;r<boardSize;r++){
for(var c=0;c<boardSize;c++){
var cls=board[r][c];
var lastCls=(lastMove&&lastMove[0]===r&&lastMove[1]===c)?' last-move':'';
html+='<div class="cell'+lastCls+'" onclick="placeStone('+r+','+c+')">';
if(cls!=='empty')html+='<div class="stone '+cls+'"></div>';
html+='</div>';
}
}
b.innerHTML=html;
}
function placeStone(r,c){
if(!gameActive||board[r][c]!=='empty')return;
board[r][c]=currentPlayer;
if(checkCapture(r,c, currentPlayer)){
removeCaptured(r,c, currentPlayer==='black'?'white':'black');
}
moveHistory.push({player:currentPlayer,row:r,col:c});
lastMove=[r,c];
currentPlayer=currentPlayer==='black'?'white':'black';
renderBoard();updateTurn();updateScores();updateLog();
}
function getGroup(r,c,color){
var visited={};var group=[];var queue=[[r,c]];
while(queue.length>0){
var p=queue.shift();var key=p[0]+','+p[1];
if(visited[key])continue;visited[key]=true;
if(p[0]<0||p[0]>=boardSize||p[1]<0||p[1]>=boardSize)continue;
if(board[p[0]][p[1]]!==color)continue;
group.push(p);
queue.push([p[0]-1,p[1]],[p[0]+1,p[1]],[p[0],p[1]-1],[p[0],p[1]+1]);
}
return group;
}
function hasLiberty(r,c,color){
var group=getGroup(r,c,color);
for(var i=0;i<group.length;i++){
var neighbors=[[group[i][0]-1,group[i][1]],[group[i][0]+1,group[i][1]],[group[i][0],group[i][1]-1],[group[i][0],group[i][1]+1]];
for(var j=0;j<neighbors.length;j++){
var nr=neighbors[j][0],nc=neighbors[j][1];
if(nr>=0&&nr<boardSize&&nc>=0&&nc<boardSize&&board[nr][nc]==='empty')return true;
}
}
return false;
}
function checkCapture(r,c,myColor){
var oppColor=myColor==='black'?'white':'var(--black)';
var neighbors=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
var captured=false;
for(var i=0;i<neighbors.length;i++){
var nr=neighbors[i][0],nc=neighbors[i][1];
if(nr>=0&&nr<boardSize&&nc>=0&&nc<boardSize){
var opp=nr+','+nc;
if(board[nr][nc]!=='empty'&&board[nr][nc]!==myColor){
if(!hasLiberty(nr,nc,board[nr][nc]))return true;
}
}
}
return false;
}
function removeCaptured(r,c,oppColor){
var neighbors=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
var visited={};
for(var i=0;i<neighbors.length;i++){
var nr=neighbors[i][0],nc=neighbors[i][1];
if(nr>=0&&nr<boardSize&&nc>=0&&nc<boardSize&&board[nr][nc]===oppColor){
if(!hasLiberty(nr,nc,oppColor)){
var group=getGroup(nr,nc,oppColor);
for(var j=0;j<group.length;j++){board[group[j][0]][group[j][1]]='empty';}
}
}
}
}
function passMove(){
if(!gameActive)return;
moveHistory.push({player:currentPlayer,row:-1,col:-1});
currentPlayer=currentPlayer==='black'?'white':'black';
updateTurn();updateLog();
}
function undoMove(){
if(moveHistory.length===0)return;
var last=moveHistory.pop();
if(last.row>=0)board[last.row][last.col]='empty';
currentPlayer=last.player;
lastMove=moveHistory.length>0?[moveHistory[moveHistory.length-1].row,moveHistory[moveHistory.length-1].col]:null;
if(lastMove&&lastMove[0]<0)lastMove=null;
renderBoard();updateTurn();updateScores();updateLog();
}
function updateTurn(){
var ti=document.getElementById('turnIndicator');
if(currentPlayer==='black'){ti.className='turn-indicator black-turn';ti.textContent='⚫ 黑棋落子';}
else{ti.className='turn-indicator white-turn';ti.textContent='⚪ 白棋落子';}
}
function updateScores(){
var black=0,white=0;
for(var r=0;r<boardSize;r++){for(var c=0;c<boardSize;c++){
if(board[r][c]==='black')black++;else if(board[r][c]==='white')white++;
}}
document.getElementById('blackScore').textContent=black;
document.getElementById('whiteScore').textContent=white;
}
function updateLog(){
var log='';moveHistory.forEach(function(m,i){
var colLetter=String.fromCharCode(65+m.col);
if(m.row<0){log+=(i+1)+'. '+m.player+' 虚手\n';}
else{log+=(i+1)+'. '+m.player+' '+colLetter+(m.row+1)+'\n';}
});
document.getElementById('historyLog').textContent=log||'暂无记录';
document.getElementById('historyLog').scrollTop=99999;
}
function endGame(){
gameActive=false;
var black=0,white=0;
for(var r=0;r<boardSize;r++){for(var c=0;c<boardSize;c++){
if(board[r][c]==='black')black++;else if(board[r][c]==='white')white++;
}}
var result='终局结果：\n黑棋 '+black+' 子\n白棋 '+white+' 子\n\n';
if(black>white)result+='黑棋胜！胜 '+Math.floor((black-white)/2)+' 子';
else if(white>black)result+='白棋胜！胜 '+Math.floor((white-black)/2)+' 子';
else result+='平局！';
alert(result);
}
newGame();
</script></body></html>
