<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>万能单位换算器</title>
  <meta name="description" content="万能单位换算器，支持长度重量温度等单位转换">
  <style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
background: var(--bg); color: var(--text); min-height: 100vh;
display: flex; justify-content: center; padding: 16px;
touch-action: manipulation}
.container {width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px;
padding-top: 10px; padding-bottom: 32px}
h1 {text-align: center; font-size: 1.5rem; font-weight: 700;
color: #f1f5f9; letter-spacing: 0.02em}
.tabs {display: flex; flex-wrap: wrap; gap: 6px; justify-content: center}
.tab {padding: 6px 14px; border-radius: 20px; border: 1px solid #30363d;
background: var(--bg); color: var(--text2); cursor: pointer; font-size: 0.85rem;
transition: all 0.2s; user-select: none; white-space: nowrap}
.tab:hover { border-color: #3b82f6; color: #3b82f6; }
.tab.active { background: #3b82f6; color: var(--text); border-color: #3b82f6; }
.input-group {background: var(--bg); border-radius: 12px; padding: 16px;
border: 1px solid #30363d}
.input-group label {display: block; font-size: 0.75rem; color: #94a3b8;
margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em}
.input-row {display: flex; gap: 8px; align-items: stretch}
.input-row input {flex: 1; padding: 10px 14px; border-radius: 8px; border: 2px solid #30363d;
background: var(--bg); color: var(--text); font-size: 1.1rem; outline: none;
transition: border-color 0.2s}
.input-row input:focus { border-color: #3b82f6; }
.input-row select {padding: 10px 8px; border-radius: 8px; border: 2px solid #30363d;
background: var(--bg); color: var(--text); font-size: 0.9rem; outline: none;
cursor: pointer; min-width: 100px}
.input-row select:focus { border-color: #3b82f6; }
.results {display: flex; flex-direction: column; gap: 8px}
.result-item {background: var(--bg); border-radius: 10px; padding: 12px 16px;
border: 1px solid #30363d; display: flex; justify-content: space-between;
align-items: center; transition: background 0.15s}
.result-item:hover { background: #1c2333; }
.result-unit {font-size: 0.8rem; color: var(--text2); text-transform: uppercase;
letter-spacing: 0.03em}
.result-value {font-size: 1.05rem; font-weight: 600; color: #3b82f6;
font-variant-numeric: tabular-nums}
.swap-btn {align-self: center; background: #30363d; border: none; color: var(--text2);
width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
font-size: 1rem; display: flex; align-items: center; justify-content: center;
transition: all 0.2s; margin: 4px 0}
.swap-btn:hover { background: #3b82f6; color: var(--text); }
@media (max-width: 360px) {.container { padding: 8px; gap: 14px; }
h1 { font-size: 1.25rem; }
.tab { padding: 5px 10px; font-size: 0.78rem; }}

/* === Smooth Animations === */
@keyframes animFadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes animScaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
body, .container, main, .container-fluid, .wrapper {
  animation: animFadeIn .45s ease-out both;
}
.weather-card, .word-card, .result-card, .output-card, .info-card,
.card, [class*="card"], [class*="panel"], [class*="result"], [class*="output"],
[class*="detail"], [class*="item"], [class*="section"]:not(header):not(nav),
[class*="box"]:not(.search-box) {
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.weather-card:hover, .word-card:hover, .result-card:hover, .output-card:hover,
.info-card:hover, .card:hover, [class*="card"]:hover, [class*="panel"]:hover,
[class*="result"]:hover, [class*="output"]:hover, [class*="detail"]:hover,
[class*="item"]:hover, [class*="box"]:not(.search-box):hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(0,0,0,.12);
}
button, input[type="submit"], .btn, [class*="btn"], .search-box button,
.filter-btn, .refresh-btn, .retry-btn {
  transition: transform .12s ease, opacity .2s ease, background .2s ease, box-shadow .2s ease;
}
button:active, input[type="submit"]:active, .btn:active, [class*="btn"]:active,
.search-box button:active, .filter-btn:active, .refresh-btn:active, .retry-btn:active {
  transform: scale(.96);
  opacity: .88;
}
button:hover, .btn:hover, [class*="btn"]:hover {
  box-shadow: 0 2px 8px rgba(59,130,246,.18);
}
html { scroll-behavior: smooth; }
.coin-item { transition: transform .2s ease, box-shadow .2s ease; }
.coin-item:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.city-item { transition: transform .2s ease, background .2s ease, border-color .2s ease; }
.city-item:hover { transform: translateX(4px); }
input[type="text"], input[type="number"], textarea, select {
  transition: border-color .2s ease, box-shadow .2s ease;
}
input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}
/* end animations */

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="万能单位换算器">
  <meta property="og:description" content="万能单位换算器，支持长度重量温度等单位转换">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/unit-converter/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
  <div class="container">
    <h1>万能单位换算器</h1>

    <div class="tabs" id="tabs"></div>

    <div class="input-group">
      <label>输入数值进行换算</label>
      <div class="input-row">
        <input type="number" id="inputValue" value="1" step="any" placeholder="输入数值...">
        <select id="inputUnit"></select>
      </div>
    </div>

    <button class="swap-btn" id="swapBtn" title="交换单位">&#8645;</button>

    <div class="results" id="results"></div>
  </div>

  <script>
    const categories = {
      length: {
        name: '长度',
        units: {
          mm: { name: '毫米', toBase: v => v / 1000, fromBase: v => v * 1000 },
          cm: { name: '厘米', toBase: v => v / 100, fromBase: v => v * 100 },
          m: { name: '米', toBase: v => v, fromBase: v => v },
          km: { name: '千米', toBase: v => v * 1000, fromBase: v => v / 1000 },
          inch: { name: '英寸', toBase: v => v * 0.0254, fromBase: v => v / 0.0254 },
          ft: { name: '英尺', toBase: v => v * 0.3048, fromBase: v => v / 0.3048 },
          yard: { name: '码', toBase: v => v * 0.9144, fromBase: v => v / 0.9144 },
          mile: { name: '英里', toBase: v => v * 1609.344, fromBase: v => v / 1609.344 },
        }
      },
      weight: {
        name: '重量',
        units: {
          mg: { name: '毫克', toBase: v => v / 1000000, fromBase: v => v * 1000000 },
          g: { name: '克', toBase: v => v / 1000, fromBase: v => v * 1000 },
          kg: { name: '千克', toBase: v => v, fromBase: v => v },
          ton: { name: '吨', toBase: v => v * 1000, fromBase: v => v / 1000 },
          oz: { name: '盎司', toBase: v => v * 0.0283495, fromBase: v => v / 0.0283495 },
          lb: { name: '磅', toBase: v => v * 0.453592, fromBase: v => v / 0.453592 },
        }
      },
      temperature: {
        name: '温度',
        units: {
          celsius: { name: '摄氏度', toBase: v => v, fromBase: v => v },
          fahrenheit: { name: '华氏度', toBase: v => (v - 32) * 5/9, fromBase: v => v * 9/5 + 32 },
          kelvin: { name: '开尔文', toBase: v => v - 273.15, fromBase: v => v + 273.15 },
        }
      },
      area: {
        name: '面积',
        units: {
          m2: { name: '平方米', toBase: v => v, fromBase: v => v },
          km2: { name: '平方公里', toBase: v => v * 1000000, fromBase: v => v / 1000000 },
          hectare: { name: '公顷', toBase: v => v * 10000, fromBase: v => v / 10000 },
          mu: { name: '亩', toBase: v => v * 666.6667, fromBase: v => v / 666.6667 },
          ft2: { name: '平方英尺', toBase: v => v * 0.092903, fromBase: v => v / 0.092903 },
          acre: { name: '英亩', toBase: v => v * 4046.856, fromBase: v => v / 4046.856 },
        }
      },
      volume: {
        name: '体积',
        units: {
          ml: { name: '毫升', toBase: v => v / 1000, fromBase: v => v * 1000 },
          l: { name: '升', toBase: v => v, fromBase: v => v },
          m3: { name: '立方米', toBase: v => v * 1000, fromBase: v => v / 1000 },
          gallon: { name: '加仑', toBase: v => v * 3.78541, fromBase: v => v / 3.78541 },
          pint: { name: '品脱', toBase: v => v * 0.473176, fromBase: v => v / 0.473176 },
        }
      },
      speed: {
        name: '速度',
        units: {
          ms: { name: '米/秒', toBase: v => v, fromBase: v => v },
          kmh: { name: '千米/时', toBase: v => v / 3.6, fromBase: v => v * 3.6 },
          mph: { name: '英里/时', toBase: v => v * 0.44704, fromBase: v => v / 0.44704 },
          knot: { name: '节', toBase: v => v * 0.514444, fromBase: v => v / 0.514444 },
        }
      },
      data: {
        name: '数据存储',
        units: {
          B: { name: '字节', toBase: v => v, fromBase: v => v },
          KB: { name: 'KB', toBase: v => v * 1024, fromBase: v => v / 1024 },
          MB: { name: 'MB', toBase: v => v * 1048576, fromBase: v => v / 1048576 },
          GB: { name: 'GB', toBase: v => v * 1073741824, fromBase: v => v / 1073741824 },
          TB: { name: 'TB', toBase: v => v * 1099511627776, fromBase: v => v / 1099511627776 },
        }
      },
      time: {
        name: '时间',
        units: {
          sec: { name: '秒', toBase: v => v, fromBase: v => v },
          min: { name: '分', toBase: v => v * 60, fromBase: v => v / 60 },
          hour: { name: '时', toBase: v => v * 3600, fromBase: v => v / 3600 },
          day: { name: '天', toBase: v => v * 86400, fromBase: v => v / 86400 },
          week: { name: '周', toBase: v => v * 604800, fromBase: v => v / 604800 },
          month: { name: '月', toBase: v => v * 2629800, fromBase: v => v / 2629800 },
          year: { name: '年', toBase: v => v * 31557600, fromBase: v => v / 31557600 },
        }
      },
    };

    const categoryKeys = Object.keys(categories);
    let currentCategory = 'length';
    let inputUnit = 'm';

    const tabsEl = document.getElementById('tabs');
    const inputValueEl = document.getElementById('inputValue');
    const inputUnitEl = document.getElementById('inputUnit');
    const resultsEl = document.getElementById('results');
    const swapBtn = document.getElementById('swapBtn');

    function renderTabs() {
      tabsEl.innerHTML = categoryKeys.map(k => {
        const activeClass = k === currentCategory ? ' active' : '';
        return `<span class="tab${activeClass}" data-cat="${k}">${categories[k].name}</span>`;
      }).join('');
    }

    function renderUnitSelect() {
      const units = categories[currentCategory].units;
      inputUnitEl.innerHTML = Object.entries(units).map(([key, u]) =>
        `<option value="${key}"${key === inputUnit ? ' selected' : ''}>${u.name}</option>`
      ).join('');
    }

    function safeNum(v) {
      if (!isFinite(v) || isNaN(v)) return '—';
      if (Math.abs(v) < 1e-10 && v !== 0) return v.toExponential(4);
      return parseFloat(v.toPrecision(10)).toString();
    }

    function convert() {
      const rawVal = parseFloat(inputValueEl.value);
      const val = isNaN(rawVal) ? 0 : rawVal;
      const units = categories[currentCategory].units;
      const baseVal = units[inputUnit].toBase(val);
      const entries = Object.entries(units);

      resultsEl.innerHTML = entries.map(([key, u]) => {
        const result = u.fromBase(baseVal);
        return `<div class="result-item">
          <span class="result-unit">${u.name}</span>
          <span class="result-value">${safeNum(result)}</span>
        </div>`;
      }).join('');
    }

    function switchCategory(cat) {
      if (currentCategory === cat) return;
      currentCategory = cat;
      inputUnit = Object.keys(categories[cat].units)[0];
      renderTabs();
      renderUnitSelect();
      convert();
    }

    tabsEl.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      switchCategory(tab.dataset.cat);
    });

    inputUnitEl.addEventListener('change', () => {
      inputUnit = inputUnitEl.value;
      convert();
    });

    inputValueEl.addEventListener('input', convert);

    swapBtn.addEventListener('click', () => {
      const units = categories[currentCategory].units;
      const unitKeys = Object.keys(units);
      const idx = unitKeys.indexOf(inputUnit);
      const nextIdx = (idx + 1) % unitKeys.length;
      inputUnit = unitKeys[nextIdx];
      renderUnitSelect();
      convert();
    });

    // Init
    renderTabs();
    renderUnitSelect();
    convert();
  </script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
