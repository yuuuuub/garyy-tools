<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👕 中国服装尺码换算</title>
<meta property="og:title" content="👕 中国服装尺码换算">
<meta property="og:description" content="👕 中国服装尺码换算 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="中国服装尺码在线换算工具，支持男女装尺码对照，身高体重推荐">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👕</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.gender-tabs{display:flex;gap:8px;margin-bottom:12px}
.gender-tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:14px;cursor:pointer;text-align:center;transition:all .2s;font-weight:600}
.gender-tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-group label{font-size:12px;color:var(--text-secondary);font-weight:500}
.input-group input{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;transition:all .2s}
.input-group input:focus{outline:none;border-color:var(--accent)}
.calc-btn{width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.calc-btn:hover{background:var(--accent-hover)}
.result-card{background:var(--tag-bg);border-radius:12px;padding:16px;margin-top:12px}
.result-size{font-size:36px;font-weight:800;color:var(--accent);text-align:center}
.result-label{text-align:center;font-size:13px;color:var(--text-secondary);margin-top:4px}
.size-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.size-table th{background:var(--accent);color:#fff;padding:8px 6px;text-align:center;font-weight:600}
.size-table td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--border)}
.size-table tr.highlight{background:var(--tag-bg);font-weight:600}
.tip{font-size:12px;color:var(--text-secondary);margin-top:8px;line-height:1.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>👕 中国服装尺码换算</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">👤 性别</div>
<div class="gender-tabs">
<div class="gender-tab active" onclick="setGender('male',this)">👨 男装</div>
<div class="gender-tab" onclick="setGender('female',this)">👩 女装</div>
</div>
</div>
<div class="card">
<div class="card-title">📏 输入数据</div>
<div class="input-row">
<div class="input-group">
<label>身高 (cm)</label>
<input type="number" id="height" placeholder="170" min="100" max="220">
</div>
<div class="input-group">
<label>体重 (kg)</label>
<input type="number" id="weight" placeholder="65" min="30" max="200">
</div>
</div>
<button class="calc-btn" onclick="calcSize()">🔍 查询尺码</button>
</div>
<div class="card" id="resultCard" style="display:none">
<div class="card-title">📊 推荐尺码</div>
<div class="result-card">
<div class="result-size" id="resultSize">--</div>
<div class="result-label" id="resultLabel">请输入身高体重</div>
</div>
<div class="tip" id="resultTip"></div>
</div>
<div class="card">
<div class="card-title">📋 尺码对照表</div>
<div style="overflow-x:auto">
<table class="size-table" id="sizeTable"></table>
</div>
</div>
<div class="footer">Gary's Tools · 中国服装尺码参考</div>
</div>
<script>
let currentGender='male';
const maleSizes=[
{size:'XS',label:'165/84A',chest:[79,83],height:[163,167]},
{size:'S',label:'170/88A',chest:[83,87],height:[168,172]},
{size:'M',label:'175/92A',chest:[87,91],height:[173,177]},
{size:'L',label:'180/96A',chest:[91,95],height:[178,182]},
{size:'XL',label:'185/100A',chest:[95,99],height:[183,187]},
{size:'XXL',label:'190/104A',chest:[99,103],height:[188,192]},
{size:'XXXL',label:'195/108A',chest:[103,107],height:[193,197]}
];
const femaleSizes=[
{size:'XS',label:'155/80A',chest:[75,79],height:[153,157]},
{size:'S',label:'160/84A',chest:[79,83],height:[158,162]},
{size:'M',label:'165/88A',chest:[83,87],height:[163,167]},
{size:'L',label:'170/92A',chest:[87,91],height:[168,172]},
{size:'XL',label:'175/96A',chest:[91,95],height:[173,177]},
{size:'XXL',label:'180/100A',chest:[95,99],height:[178,182]}
];
function setGender(g,el){
currentGender=g;
document.querySelectorAll('.gender-tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
renderTable();
}
function renderTable(){
const sizes=currentGender==='male'?maleSizes:femaleSizes;
const table=document.getElementById('sizeTable');
table.innerHTML='<tr><th>尺码</th><th>号型</th><th>胸围(cm)</th><th>身高(cm)</th></tr>'+
sizes.map(s=>`<tr><td><b>${s.size}</b></td><td>${s.label}</td><td>${s.chest[0]}-${s.chest[1]}</td><td>${s.height[0]}-${s.height[1]}</td></tr>`).join('');
}
function calcSize(){
const h=parseFloat(document.getElementById('height').value);
const w=parseFloat(document.getElementById('weight').value);
if(!h||!w){alert('请输入身高和体重');return}
const sizes=currentGender==='male'?maleSizes:femaleSizes;
const bmi=w/((h/100)**2);
let matched=null;
for(const s of sizes){
if(h>=s.height[0]&&h<=s.height[1]){matched=s;break}
}
if(!matched){
matched=sizes.reduce((best,s)=>{
const dist=Math.abs(h-(s.height[0]+s.height[1])/2);
const bestDist=Math.abs(h-(best.height[0]+best.height[1])/2);
return dist<bestDist?s:best;
});
}
document.getElementById('resultSize').textContent=matched.size;
document.getElementById('resultLabel').textContent=`${currentGender==='male'?'男':'女'}装 ${matched.label}`;
let tip=`建议尺码 <b>${matched.size}</b>（${matched.label}）\n`;
tip+=`BMI: ${bmi.toFixed(1)} `;
if(bmi<18.5)tip+='偏瘦';
else if(bmi<24)tip+='正常';
else if(bmi<28)tip+='偏胖';
else tip+='肥胖';
tip+='\n⚠️ 实际尺码以商品详情页为准，不同品牌尺码可能有差异';
document.getElementById('resultTip').innerHTML=tip;
document.getElementById('resultCard').style.display='block';
}
function toggleTheme(){
const html=document.documentElement;
const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
html.setAttribute('data-theme',next);
document.querySelector('.theme-toggle').textContent=next==='dark'?'☀️':'🌙';
}
renderTable();
</script>
</body>
</html>
