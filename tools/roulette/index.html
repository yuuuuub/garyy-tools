<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎡 轮盘赌</title>
<meta name="description" content="轮盘赌游戏，在线体验经典赌场轮盘玩法">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--red:#dc2626;--green:#16a34a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;min-height:100vh;padding:16px}
.container{width:100%;max-width:500px;display:flex;flex-direction:column;gap:12px;align-items:center}
h1{font-size:1.5rem}
.balance{text-align:center;font-size:1rem;color:#8b949e}.balance b{color:var(--accent)}
.wheel-wrap{position:relative;width:280px;height:280px;margin:16px auto}
.wheel{width:100%;height:100%;border-radius:50%;border:4px solid #fff;position:relative;transition:transform 4s cubic-bezier(.17,.67,.12,.99)}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:20px solid #fff;z-index:2}
.result{font-size:1.4rem;font-weight:700;min-height:36px;text-align:center}
.bet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%}
.bet-btn{padding:10px 4px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer;font-size:.8rem;text-align:center;transition:.2s}
.bet-btn:hover{border-color:var(--accent)}
.bet-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.bet-btn.r{border-color:var(--red);color:var(--red)}
.bet-btn.g{border-color:var(--green);color:var(--green)}
.bet-area{display:flex;gap:8px;align-items:center;width:100%;justify-content:center}
.bet-area input{width:80px;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);text-align:center;font-size:1rem}
.controls{display:flex;gap:8px;width:100%}
button{padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:.9rem;flex:1}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.history{font-size:.8rem;color:#8b949e;max-height:60px;overflow-y:auto;width:100%;padding:6px;background:var(--card);border-radius:6px;border:1px solid var(--border)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🎡 轮盘赌">
  <meta property="og:description" content="轮盘赌游戏，在线体验经典赌场轮盘玩法">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/roulette/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<h1>🎡 轮盘赌</h1>
<div class="balance">余额: <b id="balance">1000</b> 💰</div>
<div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="280" height="280"></canvas></div>
<div class="result" id="result"></div>
<div class="bet-area"><span>下注:</span><input type="number" id="betAmount" value="100" min="10"></div>
<div class="bet-grid" id="betGrid"></div>
<div class="controls">
<button class="primary" onclick="spin()" id="spinBtn">旋转轮盘</button>
</div>
<div class="history" id="history"></div>
</div>
<script>
const NUMS=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const REDS=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
let balance=1000,currentBet=null,bets={},spinning=false;

function getColor(n){if(n===0)return 'green';return REDS.has(n)?'red':'black'}
function drawWheel(){
const cv=document.getElementById('wheel'),ctx=cv.getContext('2d');
const cx=140,cy=140,r=130;
const seg=Math.PI*2/NUMS.length;
ctx.clearRect(0,0,280,280);
NUMS.forEach((n,i)=>{
const a1=i*seg-Math.PI/2,a2=a1+seg;
ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a1,a2);ctx.closePath();
const color=getColor(n);ctx.fillStyle=color==='red'?'#c0392b':color==='green'?'#27ae60':'#2c3e50';ctx.fill();
ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();
ctx.save();ctx.translate(cx,cy);ctx.rotate(a1+seg/2);ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(n,r-15,4);ctx.restore();
});
}

function buildBetGrid(){
const grid=document.getElementById('betGrid');grid.innerHTML='';
const bets_def=[
{label:'红色',key:'red'},{label:'黑色',key:'black'},{label:'绿色',key:'green',cls:'g'},
{label:'1-12',key:'1st12'},{label:'13-24',key:'2nd12'},{label:'25-36',key:'3rd12'},
{label:'奇数',key:'odd'},{label:'偶数',key:'even'},{label:'1-18',key:'low'},{label:'19-36',key:'high'}
];
bets_def.forEach(b=>{
const btn=document.createElement('button');
btn.className='bet-btn'+(b.cls?' '+b.cls:'');
btn.textContent=b.label;
btn.onclick=()=>{
const amt=parseInt(document.getElementById('betAmount').value)||100;
Object.keys(bets).forEach(k=>bets[k]=0);
bets[b.key]=amt;
document.querySelectorAll('.bet-btn').forEach(x=>x.classList.remove('active'));
btn.classList.add('active');
};
grid.appendChild(btn);
});
for(let i=0;i<=36;i++){
const btn=document.createElement('button');
btn.className='bet-btn'+(i===0?' g':'');
btn.textContent=i;
btn.onclick=()=>{
const amt=parseInt(document.getElementById('betAmount').value)||100;
bets={};bets['n'+i]=amt;
document.querySelectorAll('.bet-btn').forEach(x=>x.classList.remove('active'));
btn.classList.add('active');
};
grid.appendChild(btn);
}
}

function spin(){
if(spinning)return;
const totalBet=Object.values(bets).reduce((a,b)=>a+b,0);
if(totalBet<=0||totalBet>balance)return;
balance-=totalBet;document.getElementById('balance').textContent=balance;
spinning=true;document.getElementById('spinBtn').disabled=true;
const result=NUMS[Math.floor(Math.random()*NUMS.length)];
const idx=NUMS.indexOf(result);
const seg=Math.PI*2/NUMS.length;
const targetAngle=360-(idx*seg*180/Math.PI+seg*180/Math.PI/2)%360;
const spins=5+Math.floor(Math.random()*3);
const wheel=document.getElementById('wheel');
const current=parseFloat(wheel.style.transform?.match(/rotate\((.+)deg\)/)?.[1]||0);
const total=current+spins*360+targetAngle-(current%360);
wheel.style.transition='transform 4s cubic-bezier(.17,.67,.12,.99)';
wheel.style.transform=`rotate(${total}deg)`;
setTimeout(()=>{
spinning=false;document.getElementById('spinBtn').disabled=false;
const color=getColor(result);
let winAmount=0;
Object.entries(bets).forEach(([k,v])=>{
let won=false;
if(k==='red'&&color==='red')won=true;
if(k==='black'&&color==='black')won=true;
if(k==='green'&&color==='green')won=true;
if(k==='odd'&&result%2===1&&result!==0)won=true;
if(k==='even'&&result%2===0&&result!==0)won=true;
if(k==='low'&&result>=1&&result<=18)won=true;
if(k==='high'&&result>=19&&result<=36)won=true;
if(k==='1st12'&&result>=1&&result<=12)won=true;
if(k==='2nd12'&&result>=13&&result<=24)won=true;
if(k==='3rd12'&&result>=25&&result<=36)won=true;
if(k==='n'+result)won=true;
if(won){
const mult=k.startsWith('n')?36:2;
winAmount+=v*mult;
}});
if(winAmount>0){balance+=winAmount;document.getElementById('result').textContent=`🎉 ${result} ${color==='red'?'🔴':color==='green'?'🟢':'⚫'} 赢得 ${winAmount}`}
else{document.getElementById('result').textContent=`${result} ${color==='red'?'🔴':color==='green'?'🟢':'⚫'} 未中奖`}
document.getElementById('balance').textContent=balance;
document.getElementById('history').innerHTML=`<div>${result} ${color==='red'?'🔴':'⚫'} ${winAmount>0?'+'+winAmount:'-'+totalBet}</div>`+document.getElementById('history').innerHTML;
bets={};document.querySelectorAll('.bet-btn').forEach(x=>x.classList.remove('active'));
if(balance<=0){balance=1000;document.getElementById('balance').textContent=1000}
},4200);
}

drawWheel();buildBetGrid();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
