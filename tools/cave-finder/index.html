<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洞穴查找</title>
<meta name="description" content="洞穴查找工具，探索附近的天然洞穴和溶洞">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--purple:#a855f7;--cyan:#06b6d4;--amber:#f59e0b;--muted:#8b949e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:1200px;margin:0 auto}
h1{text-align:center;font-size:1.8rem;margin-bottom:6px}
.subtitle{text-align:center;color:var(--muted);margin-bottom:24px;font-size:.9rem}
.controls{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.search-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;outline:none}
.search-input:focus{border-color:var(--accent)}
.filter-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-group label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.filter-group select{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;font-size:.85rem;outline:none;min-width:120px}
.sort-btns{display:flex;gap:6px;flex-wrap:wrap}
.sort-btn{padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:.8rem;cursor:pointer;transition:all .2s}
.sort-btn.active,.sort-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.results-info{margin-bottom:16px;color:var(--muted);font-size:.85rem}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-name{font-size:1.15rem;font-weight:600}
.card-type-badge{padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:600;background:rgba(168,85,247,.2);color:var(--purple);border:1px solid rgba(168,85,247,.4)}
.card-location{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.card-desc{color:var(--muted);font-size:.88rem;line-height:1.5;margin-bottom:12px}
.card-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.meta-tag{padding:4px 10px;border-radius:6px;font-size:.75rem}
.tag-temp{background:rgba(6,182,212,.15);border:1px solid rgba(6,182,212,.3);color:var(--cyan)}
.tag-diff{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:var(--amber)}
.tag-feature{background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.3);color:var(--purple)}
.card-features{list-style:none;padding:0}
.card-features li{padding:3px 0;font-size:.83rem;color:var(--muted)}
.card-features li::before{content:"• ";color:var(--accent)}
.no-results{text-align:center;color:var(--muted);padding:60px 20px;font-size:1.1rem}
@media(max-width:600px){.results{grid-template-columns:1fr}.search-row{flex-direction:column}.filter-row{flex-direction:column;align-items:stretch}.filter-group select{min-width:auto;width:100%}h1{font-size:1.4rem}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="洞穴查找">
  <meta property="og:description" content="洞穴查找工具，探索附近的天然洞穴和溶洞">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/cave-finder/">
</head>
<body>
<div class="container">
<h1>🕳️ 洞穴查找</h1>
<p class="subtitle">探索地下世界的奇妙景观</p>
<div class="controls">
<div class="search-row"><input type="text" class="search-input" id="searchInput" placeholder="搜索洞穴名称或国家..."></div>
<div class="filter-row">
<div class="filter-group"><label>类型</label><select id="typeFilter"><option value="">全部</option><option value="石灰岩洞">石灰岩洞</option><option value="熔岩洞">熔岩洞</option><option value="冰洞">冰洞</option><option value="海蚀洞">海蚀洞</option><option value="水晶洞">水晶洞</option></select></div>
<div class="filter-group"><label>导览</label><select id="tourFilter"><option value="">全部</option><option value="有">有导览</option><option value="无">无导览</option></select></div>
<div class="filter-group"><label>排序</label>
<div class="sort-btns"><button class="sort-btn active" data-sort="rating">评分 ↓</button><button class="sort-btn" data-sort="temp">温度 ↓</button><button class="sort-btn" data-sort="name">名称</button></div>
</div></div></div>
<div class="results-info" id="resultsInfo"></div>
<div class="results" id="results"></div>
</div>
<script>
const caves=[
{id:1,name:"猛犸洞穴",country:"美国肯塔基",type:"石灰岩洞",temp:12,features:["钟乳石","石笋","地下河","荧光鱼"],difficulty:"简单",tour:"有",rating:4.8,length:"650公里",desc:"世界最长洞穴系统，已探明超过650公里，联合国世界遗产。"},
{id:2,name:"卢森堡洞",country:"中国贵州",type:"石灰岩洞",temp:16,features:["钟乳石","石笋","石柱","地下瀑布"],difficulty:"中等",tour:"有",rating:4.6,length:"12公里",desc:"中国最大的石灰岩溶洞之一，洞内石笋林立如仙境。"},
{id:3,name:"斯特拉西洞",country:"冰岛",type:"熔岩洞",temp:4,features:["熔岩管","冰层","极光观赏点","地热蒸汽"],difficulty:"中等",tour:"有",rating:4.7,length:"1.5公里",desc:"冰岛最著名的熔岩洞穴，由火山活动形成，冬季可在此观赏极光。"},
{id:4,name:"卡尔斯巴德洞穴",country:"美国新墨西哥",type:"石灰岩洞",temp:13,features:["巨型钟乳石","石笋","蝙蝠群","地下湖"],difficulty:"简单",tour:"有",rating:4.8,length:"30公里",desc:"以壮观的石灰岩洞室和傍晚蝙蝠出洞奇观闻名。"},
{id:5,name:"威蒂莫洞穴",country:"新西兰",type:"石灰岩洞",temp:12,features:["萤火虫","地下河","钟乳石","萤光虫"],difficulty:"简单",tour:"有",rating:4.9,length:"4公里",desc:"世界著名的萤火虫洞穴，洞顶数千萤火虫如繁星般闪烁。"},
{id:6,name:"冰洞",country:"冰岛瓦特纳",type:"冰洞",temp:-2,features:["蓝冰","冰柱","冰川裂缝","透光冰层"],difficulty:"困难",tour:"有",rating:4.7,length:"0.5公里",desc:"瓦特纳冰川内的蓝色冰洞，每年形态都不同，需冬季限定访问。"},
{id=7,name:"克里米亚洞穴修道院",country:"乌克兰",type:"石灰岩洞",temp:14,features:["修道院","壁画","地下教堂","石刻"],difficulty:"简单",tour:"有",rating:4.5,length:"2公里",desc:"建于岩石中的洞穴修道院，地下教堂保存着中世纪壁画。"},
{id=8,name:"海蚀洞",country:"葡萄牙阿尔加维",type:"海蚀洞",temp:18,features:["海蚀拱","天然泳池","海蚀柱","悬崖"],difficulty:"中等",tour:"有",rating:4.6,length:"0.3公里",desc:"阿尔加维海岸的海蚀洞穴，乘船进入可看到震撼的天然拱门。"},
{id=9,name:"巨人洞穴",country:"马来西亚沙巴",type:"石灰岩洞",temp:25,features:["巨型石笋","洞穴花园","蝙蝠","犀鸟"],difficulty:"中等",tour:"有",rating:4.4,length:"3公里",desc:"婆罗洲丛林中的巨大石灰岩洞穴，洞内有石笋花园和犀鸟栖息。"},
{id:10,name:"奈卡水晶洞",country:"墨西哥奇瓦瓦",type:"水晶洞",temp:58,features:["巨型石膏晶体","地下湖","极端温度","科考通道"],difficulty:"专业",tour:"无",rating:4.8,length:"0.3公里",desc:"世界上最大的天然水晶洞穴，巨大石膏晶体长达12米，需穿冷却服进入。"}
];
let currentSort="rating";
let filtered=[...caves];
function render(){
const s=document.getElementById("searchInput").value.toLowerCase();
const type=document.getElementById("typeFilter").value;
const tour=document.getElementById("tourFilter").value;
filtered=caves.filter(c=>{
if(s&&!c.name.includes(s)&&!c.country.includes(s))return false;
if(type&&c.type!==type)return false;
if(tour&&c.tour!==tour)return false;
return true;
});
if(currentSort==="rating")filtered.sort((a,b)=>b.rating-a.rating);
else if(currentSort==="temp")filtered.sort((a,b)=>b.temp-a.temp);
else if(currentSort==="name")filtered.sort((a,b)=>a.name.localeCompare(b.name,"zh"));
document.getElementById("resultsInfo").textContent=`找到 ${filtered.length} 个洞穴`;
const c=document.getElementById("results");
if(!filtered.length){c.innerHTML='<div class="no-results">没有找到匹配的洞穴</div>';return;}
c.innerHTML=filtered.map(c=>`<div class="card">
<div class="card-header"><span class="card-name">🕳️ ${c.name}</span><span class="card-type-badge">${c.type}</span></div>
<div class="card-location">📍 ${c.country} · ⭐ ${c.rating} · 长度: ${c.length}</div>
<div class="card-desc">${c.desc}</div>
<div class="card-meta">
<span class="meta-tag tag-temp">🌡️ 洞内温度: ${c.temp}°C</span>
<span class="meta-tag tag-diff">🥾 难度: ${c.difficulty}</span>
<span class="meta-tag tag-feature">${c.tour==="有"?"🎫 有导览":"🚫 无导览"}</span>
</div>
<ul class="card-features">${c.features.map(f=>`<li>${f}</li>`).join("")}</ul>
</div>`).join("");
}
document.querySelectorAll(".sort-btn").forEach(b=>{b.addEventListener("click",()=>{document.querySelectorAll(".sort-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentSort=b.dataset.sort;render();})});
document.getElementById("searchInput").addEventListener("input",render);
document.getElementById("typeFilter").addEventListener("change",render);
document.getElementById("tourFilter").addEventListener("change",render);
render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
