<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦟 驱蚊防虫指南 - Gary's Tools</title>
<meta name="description" content="夏季驱蚊全攻略：驱蚊产品成分解析、止痒方法、防蚊植物推荐、蚊虫叮咬应急处理，科学防蚊不踩坑">
<style>
:root{--bg:#f0fdf4;--card:#fff;--text:#14532d;--text2:#16a34a;--accent:#22c55e;--red:#ef4444;--orange:#f97316;--border:#bbf7d0;--radius:16px}
[data-theme="dark"]{--bg:#0a1a10;--card:#122018;--text:#bbf7d0;--text2:#4ade80;--border:#14532d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#22c55e,#16a34a,#15803d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.03)}
.card h3{font-size:1rem;font-weight:700;margin-bottom:12px}
.compare-table{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:2px;font-size:.72rem}
.compare-table .th{font-weight:700;background:var(--bg);padding:8px 4px;text-align:center;border-radius:6px}
.compare-table .td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--border)}
.compare-table .td:first-child{text-align:left;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:2px;font-size:.65rem;padding:2px 8px;border-radius:8px}
.tag-s{background:rgba(34,197,94,.1);color:#22c55e}
.tag-a{background:rgba(249,115,22,.1);color:#f97316}
.tag-b{background:rgba(239,68,68,.1);color:#ef4444}
.tip-list{display:flex;flex-direction:column;gap:10px}
.tip-item{display:flex;align-items:flex-start;gap:10px;padding:12px;background:var(--bg);border-radius:10px;font-size:.82rem;line-height:1.5}
.tip-item .emoji{font-size:1.3rem;flex-shrink:0}
.plant-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.plant-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:10px;font-size:.82rem}
.plant-icon{font-size:1.8rem;flex-shrink:0}
.myth-card{background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.15);border-radius:10px;padding:12px;font-size:.78rem;line-height:1.6;margin-bottom:8px}
.myth-card .myth-title{font-weight:700;color:var(--red);margin-bottom:4px}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div class="container">
<header><h1>🦟 驱蚊防虫指南</h1><p>科学防蚊 · 舒爽一夏</p></header>

<div class="card">
<h2>🧪 驱蚊产品成分解析</h2>
<div class="compare-table">
<div class="th">成分</div><div class="th">有效时长</div><div class="th">安全性</div><div class="th">适用人群</div>
<div class="td">避蚊胺<br>DEET</div><div class="td">4-6小时</div><div class="td"><span class="tag tag-a">⚠️ 刺激</span></div><div class="td">成人</div>
<div class="td">派卡瑞丁</div><div class="td">6-8小时</div><div class="td"><span class="tag tag-s">✅ 安全</span></div><div class="td">6月龄+</div>
<div class="td">驱蚊酯<br>IR3535</div><div class="td">4-6小时</div><div class="td"><span class="tag tag-s">✅ 温和</span></div><div class="td">2月龄+</div>
<div class="td">柠檬桉叶油</div><div class="td">2-4小时</div><div class="td"><span class="tag tag-b">❌ 刺激</span></div><div class="td">3岁+</div>
<div class="td">香茅油</div><div class="td">0.5-2小时</div><div class="td"><span class="tag tag-s">✅ 天然</span></div><div class="td">成人</div>
</div>
</div>

<div class="card">
<h2>🛡️ 不同场景防蚊建议</h2>
<div class="tip-list" id="sceneList"></div>
</div>

<div class="card">
<h2>🌿 驱蚊植物推荐</h2>
<div class="plant-grid" id="plantList"></div>
</div>

<div class="card">
<h2>🆘 叮咬后止痒方法（按效果排序）</h2>
<div class="tip-list" id="itchList"></div>
</div>

<div class="card">
<h2>❌ 这些"常识"其实是错的</h2>
<div id="mythList"></div>
</div>

<div class="card">
<h2>🕐 蚊子活动风险实时预测</h2>
<div id="riskDisplay" style="text-align:center;padding:12px 0">
<div id="riskTime" style="font-size:.85rem;color:var(--text2);margin-bottom:6px"></div>
<div id="riskLevel" style="font-size:2rem;font-weight:900;margin:8px 0"></div>
<div id="riskDesc" style="font-size:.78rem;color:var(--text2);line-height:1.4"></div>
</div>
<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px">
<button class="riskEnv" data-e="park" style="padding:6px 12px;border:1px solid var(--border);border-radius:16px;background:var(--bg);font-size:.72rem;cursor:pointer;font-family:inherit">🌳 公园/草丛</button>
<button class="riskEnv" data-e="water" style="padding:6px 12px;border:1px solid var(--border);border-radius:16px;background:var(--bg);font-size:.72rem;cursor:pointer;font-family:inherit">💧 水边/湿地</button>
<button class="riskEnv active" data-e="indoor" style="padding:6px 12px;border:2px solid var(--accent);border-radius:16px;background:rgba(34,197,94,.08);font-size:.72rem;cursor:pointer;font-family:inherit;font-weight:600">🏠 室内</button>
<button class="riskEnv" data-e="night" style="padding:6px 12px;border:1px solid var(--border);border-radius:16px;background:var(--bg);font-size:.72rem;cursor:pointer;font-family:inherit">🌙 夜间户外</button>
</div>
</div>

<footer>被蚊子咬不是你的错 · 但可以不被咬 🦟</footer>
</div>

<script>
const scenes=[
{e:'🏠',t:'居家',d:'纱窗+蚊帐是最安全有效的物理防护。电蚊香液选含氯氟醚菊酯成分，无香型更优。避免积水和潮湿角落。'},
{e:'🏕️',t:'户外露营',d:'穿浅色长袖长裤，裸露皮肤涂抹含派卡瑞丁的驱蚊液。帐篷周围喷洒氯菊酯。避免黄昏和黎明外出。'},
{e:'🏃',t:'运动跑步',d:'运动时出汗多更招蚊子！运动前用驱蚊湿巾擦拭裸露部位。避开草丛和水边路线。'},
{e:'👶',t:'婴幼儿',d:'2月龄以下：只用物理防护(蚊帐/长袖)。2月龄+：可选含驱蚊酯产品(浓度<10%)。3岁+：可选派卡瑞丁。不用避蚊胺！'},
{e:'🌴',t:'热带旅行',d:'登革热/疟疾风险区：必用含DEET 20-30%驱蚊液。睡在蚊帐内。穿经过氯菊酯处理的衣物。'},
];

document.getElementById('sceneList').innerHTML=scenes.map(s=>`<div class="tip-item"><span class="emoji">${s.e}</span><div><b>${s.t}：</b>${s.d}</div></div>`).join('');

const plants=[
{i:'🌿',n:'薄荷',d:'清凉香气驱蚊，可泡水喝'},
{i:'🌱',n:'薰衣草',d:'香气驱蚊还能助眠'},
{i:'🌸',n:'万寿菊',d:'含除虫菊酯，天然驱蚊'},
{i:'🍃',n:'香茅草',d:'柠檬香气，蚊虫最怕'},
{i:'🌺',n:'天竺葵',d:'驱蚊草，阳台必备'},
{i:'🍋',n:'柠檬草',d:'东南亚常用天然驱蚊'},
];

document.getElementById('plantList').innerHTML=plants.map(p=>`<div class="plant-item"><span class="plant-icon">${p.i}</span><div><b>${p.n}</b><div style="font-size:.72rem;color:var(--text2)">${p.d}</div></div></div>`).join('');

const itch=[
{e:'🧊',t:'冰敷',d:'最安全有效！用冰袋或冷毛巾敷15分钟，收缩血管减少肿胀和瘙痒。⭐⭐⭐⭐⭐'},
{e:'💊',t:'炉甘石洗剂',d:'药房几块钱一瓶，止痒神器！摇匀后涂抹，干了会有一层白粉。⭐⭐⭐⭐⭐'},
{e:'💧',t:'弱效激素软膏',d:'如丁酸氢化可的松，红肿严重时用。连续用不超过3天。⭐⭐⭐⭐'},
{e:'🧴',t:'芦荟胶',d:'天然镇静消炎，放冰箱冷藏后使用效果更好。⭐⭐⭐'},
{e:'🧂',t:'小苏打糊',d:'小苏打+水调成糊敷在蚊子包上，中和蚁酸。⭐⭐⭐'},
];

document.getElementById('itchList').innerHTML=itch.map(i=>`<div class="tip-item"><span class="emoji">${i.e}</span><div><b>${i.t}：</b>${i.d}</div></div>`).join('');

const myths=[
{m:'O型血更招蚊子？',t:'错！蚊子不挑血型，它们靠二氧化碳、体温、汗液中的乳酸和氨来定位目标。新陈代谢快的人（运动后/孕妇/胖）更招蚊子。'},
{m:'维生素B1能驱蚊？',t:'错！没有任何科学证据支持。美国CDC和WHO都不推荐。吃多了还可能副作用。'},
{m:'被咬后划十字能止痒？',t:'只是心理作用。指甲划伤皮肤反而可能感染。用冰敷或炉甘石洗剂才是正经方法。'},
{m:'超声波驱蚊器有用？',t:'大量研究证明没用！蚊子的听觉系统和人类不同，超声波对它们无效。别再交智商税了。'},
];

document.getElementById('mythList').innerHTML=myths.map(m=>`<div class="myth-card"><div class="myth-title">${m.m}</div><span style="color:var(--green)">✅ 真相：</span>${m.t}</div>`).join('');

// 🕐 蚊子活动风险预测
const riskEnvs={park:{base:6,label:'公园/草丛'},water:{base:8,label:'水边/湿地'},indoor:{base:3,label:'室内'},night:{base:7,label:'夜间户外'}};
let currentEnv='indoor';

function calcRisk(){
  const now=new Date();
  const h=now.getHours();
  const m=now.getMinutes();
  const timeStr=h.toString().padStart(2,'0')+':'+m.toString().padStart(2,'0');
  document.getElementById('riskTime').innerHTML='当前时间：'+timeStr+' · 环境：'+riskEnvs[currentEnv].label;

  // 蚊子在黄昏(17-20点)和清晨(5-7点)最活跃
  let timeFactor=0;
  if(h>=5&&h<7)timeFactor=8;
  else if(h>=17&&h<20)timeFactor=9;
  else if(h>=20&&h<23)timeFactor=6;
  else if(h>=7&&h<17)timeFactor=3;
  else timeFactor=2;

  const totalRisk=Math.min(10,timeFactor+riskEnvs[currentEnv].base);
  const envBonus=currentEnv==='water'?2:(currentEnv==='park'?1:0);

  let level,color,desc;
  if(totalRisk>=8){level='🔴 高风险';color='var(--red)';desc='蚊子非常活跃！'+((currentEnv==='indoor')?'建议使用电蚊香或蚊帐':'出门务必涂抹驱蚊液，穿长袖长裤');}
  else if(totalRisk>=5){level='🟡 中等风险';color='var(--orange)';desc='蚊子有一定活动量。'+(currentEnv==='indoor'?'注意关好纱窗':'建议随身携带驱蚊液'+(currentEnv==='water'?'，水边是蚊子孳生地':''));}
  else{level='🟢 低风险';color='var(--green)';desc='当前蚊子活动较少。'+(currentEnv==='indoor'?'可以安心休息':'但仍建议做好基本防护');}

  document.getElementById('riskLevel').textContent=level;
  document.getElementById('riskLevel').style.color=color;
  document.getElementById('riskDesc').textContent=desc;

  // 建议
  const tipEl=document.getElementById('riskDesc');
  if(!document.getElementById('riskTip')){
    const tip=document.createElement('div');tip.id='riskTip';
    document.getElementById('riskDisplay').appendChild(tip);
  }
}

document.querySelectorAll('.riskEnv').forEach(btn=>{
  btn.addEventListener('click',function(){
    document.querySelectorAll('.riskEnv').forEach(b=>{b.style.border='1px solid var(--border)';b.style.background='var(--bg)';b.style.fontWeight='400';});
    this.style.border='2px solid var(--accent)';this.style.background='rgba(34,197,94,.08)';this.style.fontWeight='600';
    currentEnv=this.dataset.e;
    calcRisk();
  });
});
calcRisk();
setInterval(calcRisk,60000);
</script>
<script src="../i18n.js"></script>
</body>
</html>
