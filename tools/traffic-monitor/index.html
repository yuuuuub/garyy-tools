<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交通监控</title>
<meta name="description" content="交通路况监控，查看实时交通拥堵情况">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#3fb950;--yellow:#d29922;--orange:#db6d28;--red:#f85149}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-seriffont-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;padding:16px;scroll-behavior:smooth;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:20px}.header h1 span{font-size:24px}
.header .live-dot{display:inline-block;width:8px;height:8px;background:var(--red);border-radius:50%;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls input,.controls select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px}
.main{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 64px)}
.map-area{background:#0a0e14;position:relative;display:flex;align-items:center;justify-content:center}
.traffic-map{width:90%;height:80%;position:relative}
.road-segment{position:absolute;height:6px;border-radius:3px;cursor:pointer;transition:opacity .2s}
.road-segment:hover{opacity:.8;transform:scaleY(1.5)}
.road-segment .road-tooltip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;white-space:nowrap;z-index:10}
.road-segment:hover .road-tooltip{display:block}
.sidebar{background:var(--card);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.overview{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px;border-bottom:1px solid var(--border)}
.overview .stat{padding:10px;background:var(--bg);border-radius:8px;text-align:center}
.overview .stat .val{font-size:22px;font-weight:700}
.overview .stat .lbl{font-size:11px;color:#8b949e;margin-top:2px}
.road-list{flex:1;overflow-y:auto;padding:8px}
.road-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.road-card:hover{border-color:var(--accent)}
.road-card .road-name{font-weight:700;font-size:14px;margin-bottom:4px}
.road-card .road-info{display:flex;gap:12px;font-size:12px;color:#8b949e}
.road-card .congestion-bar{margin-top:8px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.road-card .congestion-bar .fill{height:100%;border-radius:3px;transition:width .5s}
.road-card .speed{margin-top:6px;font-size:13px}
.legend{position:absolute;bottom:12px;left:12px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:11px;z-index:10}
.legend div{display:flex;align-items:center;gap:6px;margin:4px 0}
.legend .dot{width:12px;height:12px;border-radius:3px}
@media(max-width:768px){.main{grid-template-columns:1fr;grid-template-rows:40vh 1fr}.sidebar{border-left:none;border-top:1px solid var(--border)}}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);outline:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="交通监控">
  <meta property="og:description" content="交通路况监控，查看实时交通拥堵情况">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/traffic-monitor/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="header">
<h1><span class="live-dot"></span> 交通监控</h1>
<div class="controls">
<input type="text" id="searchInput" placeholder="搜索路段..." oninput="renderRoads()">
<select id="congestionFilter" onchange="renderRoads()">
<option value="all">所有路况</option>
<option value="smooth">畅通</option>
<option value="slow">缓行</option>
<option value="congested">拥堵</option>
<option value="blocked">严重拥堵</option>
</select>
<select id="areaFilter" onchange="renderRoads()">
<option value="all">全部区域</option>
<option value="东城">东城区</option>
<option value="西城">西城区</option>
<option value="朝阳">朝阳区</option>
<option value="海淀">海淀区</option>
<option value="丰台">丰台区</option>
</select>
</div>
</div>
<div class="main">
<div class="map-area">
<div class="traffic-map" id="trafficMap"></div>
<div class="legend">
<div><div class="dot" style="background:var(--green)"></div>畅通 >40km/h</div>
<div><div class="dot" style="background:var(--yellow)"></div>缓行 20-40km/h</div>
<div><div class="dot" style="background:var(--orange)"></div>拥堵 10-20km/h</div>
<div><div class="dot" style="background:var(--red)"></div>严重拥堵 <10km/h</div>
</div>
</div>
<div class="sidebar">
<div class="overview">
<div class="stat"><div class="val" style="color:var(--green)" id="smoothCount">0</div><div class="lbl">畅通路段</div></div>
<div class="stat"><div class="val" style="color:var(--yellow)" id="slowCount">0</div><div class="lbl">缓行路段</div></div>
<div class="stat"><div class="val" style="color:var(--orange)" id="congestedCount">0</div><div class="lbl">拥堵路段</div></div>
<div class="stat"><div class="val" style="color:var(--red)" id="blockedCount">0</div><div class="lbl">严重拥堵</div></div>
</div>
<div id="roadList" class="road-list"></div>
</div>
</div>
<script>
const roads=[
{name:'二环路',area:'东城',congestion:0.75,speed:12,length:32.7,lanes:3,incidents:2,startX:35,startY:30,endX:65,endY:30},
{name:'三环路',area:'朝阳',congestion:0.85,speed:8,length:48.3,lanes:3,incidents:3,startX:25,startY:20,endX:75,endY:50},
{name:'四环路',area:'朝阳',congestion:0.6,speed:25,length:65.3,lanes:4,incidents:1,startX:20,startY:15,endX:80,endY:55},
{name:'五环路',area:'海淀',congestion:0.45,speed:35,length:98.6,lanes:3,incidents:0,startX:15,startY:10,endX:85,endY:60},
{name:'京藏高速',area:'海淀',congestion:0.9,speed:6,length:68.2,lanes:3,incidents:4,startX:50,startY:5,endX:50,endY:65},
{name:'京港澳高速',area:'丰台',congestion:0.55,speed:30,length:52.8,lanes:3,incidents:1,startX:45,startY:35,endX:25,endY:75},
{name:'京开高速',area:'西城',congestion:0.7,speed:18,length:45.1,lanes:3,incidents:2,startX:50,startY:35,endX:55,endY:80},
{name:'京通快速',area:'朝阳',congestion:0.95,speed:5,length:18.5,lanes:3,incidents:5,startX:55,startY:30,endX:85,endY:30},
{name:'机场高速',area:'朝阳',congestion:0.3,speed:55,length:23.4,lanes:3,incidents:0,startX:60,startY:25,endX:80,endY:10},
{name:'长安街',area:'西城',congestion:0.65,speed:22,length:13.4,lanes:8,incidents:1,startX:30,startY:40,endX:70,endY:40},
{name:'建国门外大街',area:'朝阳',congestion:0.5,speed:32,length:6.2,lanes:6,incidents:0,startX:55,startY:40,endX:75,endY:40},
{name:'复兴门内大街',area:'西城',congestion:0.4,speed:42,length:3.5,lanes:6,incidents:0,startX:30,startY:40,endX:45,endY:40},
{name:'阜成门内大街',area:'西城',congestion:0.35,speed:45,length:2.8,lanes:4,incidents:0,startX:28,startY:35,endX:42,endY:35},
{name:'中关村大街',area:'海淀',congestion:0.72,speed:15,length:5.6,lanes:4,incidents:2,startX:35,startY:20,endX:35,endY:35},
{name:'望京西路',area:'朝阳',congestion:0.8,speed:10,length:4.2,lanes:3,incidents:3,startX:72,startY:15,endX:80,endY:25},
{name:'国贸桥',area:'朝阳',congestion:0.88,speed:7,length:1.2,lanes:4,incidents:4,startX:68,startY:38,endX:72,endY:42},
{name:'西直门桥',area:'西城',congestion:0.92,speed:5,length:0.8,lanes:3,incidents:5,startX:35,startY:28,endX:38,endY:30},
{name:'东直门桥',area:'东城',congestion:0.58,speed:28,length:0.9,lanes:3,incidents:1,startX:62,startY:28,endX:65,endY:30},
{name:'北四环中路',area:'海淀',congestion:0.42,speed:38,length:8.5,lanes:4,incidents:0,startX:30,startY:18,endX:55,endY:18},
{name:'南四环东路',area:'丰台',congestion:0.38,speed:40,length:7.2,lanes:4,incidents:0,startX:40,startY:55,endX:65,endY:55}
];
function getCongestionStatus(c){
if(c>=0.8)return{label:'严重拥堵',color:'var(--red)',level:'blocked'};
if(c>=0.6)return{label:'拥堵',color:'var(--orange)',level:'congested'};
if(c>=0.35)return{label:'缓行',color:'var(--yellow)',level:'slow'};
return{label:'畅通',color:'var(--green)',level:'smooth'};
}
function renderRoads(){
const search=document.getElementById('searchInput').value.toLowerCase();
const congF=document.getElementById('congestionFilter').value;
const areaF=document.getElementById('areaFilter').value;
let list=roads.filter(r=>{
if(areaF!=='all'&&r.area!==areaF)return false;
const s=getCongestionStatus(r.congestion);
if(congF!=='all'&&s.level!==congF)return false;
if(search&&!r.name.includes(search))return false;
return true;
});
document.getElementById('smoothCount').textContent=roads.filter(r=>getCongestionStatus(r.congestion).level==='smooth').length;
document.getElementById('slowCount').textContent=roads.filter(r=>getCongestionStatus(r.congestion).level==='slow').length;
document.getElementById('congestedCount').textContent=roads.filter(r=>getCongestionStatus(r.congestion).level==='congested').length;
document.getElementById('blockedCount').textContent=roads.filter(r=>getCongestionStatus(r.congestion).level==='blocked').length;
document.getElementById('roadList').innerHTML=list.map(r=>{
const s=getCongestionStatus(r.congestion);
return`<div class="road-card">
<div class="road-name">${r.name}</div>
<div class="road-info"><span>📍 ${r.area}</span><span>📏 ${r.length}km</span><span>🚗 ${r.lanes}车道</span>${r.incidents>0?`<span style="color:var(--red)">⚠️ ${r.incidents}起事故</span>`:''}</div>
<div class="congestion-bar"><div class="fill" style="width:${r.congestion*100}%;background:${s.color}"></div></div>
<div class="speed" style="color:${s.color}">${s.label} · ${r.speed}km/h · 拥堵指数 ${Math.round(r.congestion*100)}%</div>
</div>`;
}).join('');
renderMap();
}
function renderMap(){
const map=document.getElementById('trafficMap');
let html='<svg viewBox="0 0 100 70" width="100%" height="100%" style="opacity:.15">';
for(let y=0;y<70;y+=5){html+=`<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="#1a2332" stroke-width="0.1"/>`;}
for(let x=0;x<100;x+=5){html+=`<line x1="${x}" y1="0" x2="${x}" y2="70" stroke="#1a2332" stroke-width="0.1"/>`;}
html+='</svg>';
roads.forEach(r=>{
const s=getCongestionStatus(r.congestion);
const dx=r.endX-r.startX,dy=r.endY-r.startY;
const len=Math.sqrt(dx*dx+dy*dy);
const angle=Math.atan2(dy,dx)*180/Math.PI;
html+=`<div class="road-segment" style="left:${r.startX}%;top:${r.startY}%;width:${len}%;background:${s.color};transform:rotate(${angle}deg);transform-origin:left center">
<div class="road-tooltip"><strong>${r.name}</strong><br>${s.label} · ${r.speed}km/h<br>拥堵指数 ${Math.round(r.congestion*100)}%</div>
</div>`;
});
const points={天安门:{x:50,y:38},国贸:{x:70,y:40},西直门:{x:35,y:28},中关村:{x:38,y:22},望京:{x:75,y:18},丰台:{x:30,y:55}};
Object.entries(points).forEach(([name,pos])=>{
html+=`<div style="position:absolute;left:${pos.x}%;top:${pos.y}%;transform:translate(-50%,-50%);font-size:10px;color:#8b949e;text-align:center"><div style="width:6px;height:6px;background:var(--accent);border-radius:50%;margin:0 auto"></div>${name}</div>`;
});
map.innerHTML=html;
}
renderRoads();
setInterval(()=>{roads.forEach(r=>{r.congestion=Math.max(0.1,Math.min(0.95,r.congestion+(Math.random()-0.5)*0.05));r.speed=Math.max(3,Math.min(60,Math.round((1-r.congestion)*60)));});renderRoads();},5000);
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
