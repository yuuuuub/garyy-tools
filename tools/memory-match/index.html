<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧠 记忆配对</title>
<meta name="description" content="记忆配对游戏，翻开卡牌找到匹配的对子">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;touch-action:manipulationpadding:16px;scroll-behavior:smooth;}
h1{font-size:1.5rem;margin-bottom:10px;color:#3b82f6}
.hud{display:flex;gap:20px;margin-bottom:15px;font-size:1rem}
.board{display:grid;grid-template-columns:repeat(4,80px);gap:8px}
.card{width:80px;height:80px;background:var(--bg);border:2px solid #30363d;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:2rem;transition:all .3s;transform-style:preserve-3d}
.card.flipped,.card.matched{background:#1e3a5f;border-color:#3b82f6}
.card.matched{background:#166534;border-color:#22c55e}
.card:not(.flipped):not(.matched):hover{border-color:#475569}
.status{margin-top:15px;font-size:1rem;min-height:1.5em}
button{padding:10px 24px;border:none;background:#3b82f6;color:var(--text);border-radius:8px;cursor:pointer;font-size:1rem;margin-top:10px}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🧠 记忆配对">
  <meta property="og:description" content="记忆配对游戏，翻开卡牌找到匹配的对子">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/memory-match/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>🧠 记忆配对</h1>
<div class="hud"><span>⏱ <b id="time">0</b>秒</span><span>步数: <b id="moves">0</b></span><span>配对: <b id="pairs">0</b>/8</span></div>
<div class="board" id="board"></div>
<div class="status" id="status">翻开两张牌寻找配对</div>
<button onclick="newGame()">新游戏</button>
<script>
const emojis=['🍎','🍊','🍋','🍇','🌟','🎀','🐱','🐶'];
let cards=[],flipped=[],matched=0,moves=0,timer=0,timerId=null,locked=false;

function newGame(){
  const deck=[...emojis,...emojis].sort(()=>Math.random()-0.5);
  cards=deck.map((e,i)=>({id:i,emoji:e,flipped:false,matched:false}));
  flipped=[];matched=0;moves=0;timer=0;
  if(timerId)clearInterval(timerId);timerId=null;
  document.getElementById('moves').textContent=0;
  document.getElementById('pairs').textContent=0;
  document.getElementById('time').textContent=0;
  document.getElementById('status').textContent='翻开两张牌寻找配对';
  render();
}

function render(){
  const el=document.getElementById('board');el.innerHTML='';
  cards.forEach((c,i)=>{
    const d=document.createElement('div');d.className='card';
    if(c.flipped||c.matched){d.textContent=c.emoji;d.classList.add(c.matched?'matched':'flipped')}
    d.onclick=()=>flipCard(i);el.appendChild(d);
  });
}

function flipCard(i){
  if(locked||cards[i].flipped||cards[i].matched||flipped.length>=2)return;
  if(!timerId){timerId=setInterval(()=>{timer++;document.getElementById('time').textContent=timer},1000)}
  cards[i].flipped=true;flipped.push(i);render();
  if(flipped.length===2){
    moves++;document.getElementById('moves').textContent=moves;
    const[a,b]=flipped;
    if(cards[a].emoji===cards[b].emoji){
      cards[a].matched=cards[b].matched=true;matched++;flipped=[];
      document.getElementById('pairs').textContent=matched;
      render();
      if(matched===emojis.length){
        clearInterval(timerId);
        document.getElementById('status').textContent=`🎉 全部配对成功！用时${timer}秒，${moves}步`;
      }
    }else{
      locked=true;
      setTimeout(()=>{cards[a].flipped=cards[b].flipped=false;flipped=[];locked=false;render()},800);
    }
  }
}

newGame();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
