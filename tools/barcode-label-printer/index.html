<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>条形码标签打印器</title>
<meta name="description" content="在线条形码标签打印器，支持自定义标签布局和批量打印">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;min-height:100vh;scroll-behavior:smooth}
.container{max-width:800px;margin:auto;padding-bottom:50px;text-align:center}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.input-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.input-group{flex:1;min-width:200px;text-align:left}
.input-group label{display:block;font-size:.82rem;color:var(--text2);margin-bottom:6px}
.input-group input,.input-group select,.input-group textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85rem;outline:none}
.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--blue)}
.input-group textarea{font-family:monospace;min-height:80px;resize:vertical}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.btn{padding:10px 24px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.85rem;background:var(--blue);color:#fff;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.green{background:var(--green)}
.btn.gold{background:var(--gold);color:#000}
.label-preview-area{background:#f5f5f5;border:2px dashed #ccc;border-radius:12px;padding:20px;min-height:200px}
.label-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.label-item{background:#fff;border:1px solid #ddd;border-radius:4px;padding:8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.label-item canvas{display:block;margin:0 auto 4px}
.label-item .text{font-size:9px;color:#333;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.print-actions{display:flex;gap:8px;justify-content:center;margin-top:12px}
@media print{
  body{background:#fff!important;padding:0!important}
  .card,.container>header,.btn-row,.input-row,.print-actions{display:none!important}
  .label-preview-area{border:none!important;background:none!important;padding:0!important}
  .label-grid{gap:4px}
  .label-item{break-inside:avoid;border:1px solid #000}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖨️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="条形码标签打印器">
<meta property="og:description" content="在线条形码标签打印器，自定义标签布局">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/barcode-label-printer/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>条形码标签打印器</h1><p>自定义标签内容，支持批量打印</p></header>
<div class="card">
<div class="input-row">
<div class="input-group">
<label>标签内容（每行一个）</label>
<textarea id="label-input" placeholder="每行一个条形码内容...">SKU-001
SKU-002
SKU-003
SKU-004</textarea>
</div>
</div>
<div class="input-row">
<div class="input-group">
<label>显示文字</label>
<select id="show-text-select">
<option value="below">条码下方</option>
<option value="above">条码上方</option>
<option value="none">不显示</option>
</select>
</div>
<div class="input-group">
<label>标签尺寸</label>
<select id="size-select">
<option value="small">小 (60x40mm)</option>
<option value="medium" selected>中 (80x50mm)</option>
<option value="large">大 (100x60mm)</option>
</select>
</div>
<div class="input-group">
<label>每行排列</label>
<select id="cols-select">
<option value="2">2列</option>
<option value="3" selected>3列</option>
<option value="4">4列</option>
</select>
</div>
</div>
<div class="btn-row">
<button class="btn green" id="preview-btn">预览标签</button>
<button class="btn gold" id="print-btn">打印标签</button>
</div>
</div>
<div class="card">
<div class="label-preview-area">
<div class="label-grid" id="label-grid"></div>
</div>
</div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const input=$('label-input');
const grid=$('label-grid');

const PATTERNS_B={' ':[2,1,2,2,2,2],'!':[2,2,2,1,2,2],'"':[2,2,2,2,2,1],'#':[1,2,1,2,2,3],'$':[1,2,1,3,2,2],'%':[1,3,1,2,2,2],'&':[1,2,2,2,1,3],"'":[1,2,2,3,1,2],'(':[1,3,2,2,1,2],')':[2,2,1,2,1,3],'*':[2,2,1,3,1,2],'+':[2,3,1,2,1,2],',':[1,1,2,2,3,2],'-':[1,2,2,1,3,2],'.':[1,2,2,2,3,1],'/':[1,1,3,2,2,2],'0':[1,2,3,1,2,2],'1':[2,2,3,1,1,2],'2':[2,2,1,1,3,2],'3':[2,2,1,2,3,1],'4':[1,3,2,1,2,2],'5':[2,3,1,1,2,2],'6':[2,3,1,2,2,1],'7':[1,1,2,3,2,2],'8':[1,2,2,3,1,2],'9':[1,2,2,3,2,1],':':[2,2,1,1,2,3],';':[2,2,1,2,2,1],'<':[2,1,2,1,2,3],'=':[2,1,2,3,2,1],'>':[2,3,2,1,2,1],'?':[1,1,1,3,2,2],'@':[1,3,1,1,2,2],'A':[1,3,1,2,2,1],'B':[1,1,2,3,1,2],'C':[1,2,2,1,3,1],'D':[1,2,2,2,1,3],'E':[1,1,3,2,1,2],'F':[1,3,3,1,1,2],'G':[1,3,3,2,1,1],'H':[1,1,2,1,3,2],'I':[1,2,2,1,1,3],'J':[1,2,2,2,1,1],'K':[2,3,1,1,1,2],'L':[2,3,1,2,1,1],'M':[2,1,3,1,1,2],'N':[2,1,3,2,1,1],'O':[2,1,1,3,1,2],'P':[2,1,1,2,1,3],'Q':[2,1,1,2,3,1],'R':[1,3,1,1,1,2],'S':[3,1,1,1,1,2],'T':[1,1,3,1,1,2],'U':[1,1,3,2,1,1],'V':[1,1,1,2,3,2],'W':[1,1,2,2,1,3],'X':[1,1,2,3,1,1],'Y':[1,3,2,1,1,1],'Z':[3,1,2,1,1,1],'a':[3,1,1,1,2,1],'b':[2,1,1,1,1,3],'c':[2,1,1,3,1,1],'d':[2,3,1,1,1,1],'e':[1,1,1,2,1,3],'f':[1,1,1,3,1,2],'g':[1,3,1,1,1,2],'h':[1,1,2,1,1,3],'i':[1,1,3,1,1,2],'j':[3,1,2,1,1,1],'k':[2,1,1,1,2,1],'l':[3,1,1,1,2,1],'m':[1,2,1,1,1,3],'n':[1,3,1,1,1,2],'o':[1,1,1,2,2,1],'p':[1,1,2,2,1,1],'q':[1,1,1,3,2,1],'r':[1,3,2,1,1,1],'s':[1,2,1,1,3,1],'t':[3,2,1,1,1,1],'u':[2,1,2,1,1,1],'v':[2,3,2,1,1,1],'w':[2,1,1,1,2,1],'x':[2,1,1,3,2,1],'y':[2,1,1,1,1,3],'z':[1,1,3,2,1,1]};
const START_B=[2,1,1,2,3,2],STOP=[2,3,3,1,1,1,2];

function encodeBarcode(text){
  const vals=[104];
  for(const ch of text){if(ch in PATTERNS_B)vals.push(ch.charCodeAt(0)-32);}
  let sum=vals[0];for(let i=1;i<vals.length;i++)sum+=i*vals[i];
  vals.push(sum%103);vals.push(106);
  const bars=[...START_B];
  for(let i=1;i<vals.length-1;i++){const p=PATTERNS_B[String.fromCharCode(vals[i]+32)];if(p)bars.push(...p);}
  bars.push(...STOP);
  return bars;
}

function drawBarcodeToCanvas(canvas,text){
  const ctx=canvas.getContext('2d');
  const bars=encodeBarcode(text);
  const bw=Math.max(1,canvas.width*0.85/bars.length);
  const bh=canvas.height*0.5;
  const by=canvas.height*0.1;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  let x=(canvas.width-bars.length*bw)/2;
  for(let i=0;i<bars.length;i++){if(i%2===0){ctx.fillStyle='#000';ctx.fillRect(Math.round(x),by,Math.ceil(bw),bh);}x+=bw;}
}

function generate(){
  const lines=input.value.split('\n').map(l=>l.trim()).filter(l=>l);
  const showText=$('show-text-select').value;
  const size=$('size-select').value;
  const cols=parseInt($('cols-select').value);
  const sizes={small:{w:180,h:120},medium:{w:240,h:150},large:{w:300,h:180}};
  const s=sizes[size];

  grid.innerHTML='';
  grid.style.gridTemplateColumns='repeat('+cols+',1fr)';

  lines.forEach(function(text){
    const item=document.createElement('div');item.className='label-item';
    item.style.width=s.w+'px';
    const canvas=document.createElement('canvas');canvas.width=s.w-16;canvas.height=s.h-30;
    drawBarcodeToCanvas(canvas,text);
    item.appendChild(canvas);
    if(showText!=='none'){
      const label=document.createElement('div');label.className='text';
      label.textContent=text;label.title=text;
      if(showText==='above')item.insertBefore(label,canvas);
      else item.appendChild(label);
    }
    grid.appendChild(item);
  });
}

$('preview-btn').addEventListener('click',generate);
$('print-btn').addEventListener('click',function(){window.print();});
input.addEventListener('input',generate);

generate();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
