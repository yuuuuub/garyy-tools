<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成语大全 - Chinese Idiom Dictionary</title>
<meta name="description" content="成语大全 - 中华成语数据库，支持搜索和分类浏览">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f14;--bg2:#1a1a24;--bg3:#252535;--border:#2a2a3a;
--text:#e0e0e0;--text2:#a0a0b0;--accent:#f0a040;--accent2:#60c0f0;
--success:#50d890;--danger:#ff6b6b;--card:#1c1c2e;
--tag-animal:#ff9f43;--tag-number:#54a0ff;--tag-color:#ff6b6b;
--tag-nature:#5fdd9d;--tag-people:#a29bfe;--tag-emotion:#fd79a8;
--tag-inspire:#fdcb6e;--tag-negative:#636e72}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6padding:16px;scroll-behavior:smooth;}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 0;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.logo{font-size:1.6rem;font-weight:700;color:var(--accent)}
.logo span{color:var(--accent2)}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:0.9rem;transition:.2s}
nav button:hover,nav button.active{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
.search-section{padding:30px 0 20px}
.search-box{display:flex;gap:10px;margin-bottom:16px}
.search-box input{flex:1;padding:12px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:1.05rem;outline:none;transition:.2s}
.search-box input:focus{border-color:var(--accent)}
.search-box button{background:var(--accent);color:#1a1a1a;border:none;padding:12px 24px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:.2s}
.search-box button:hover{opacity:.9}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cat-tag{background:var(--bg3);color:var(--text2);border:1px solid var(--border);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:0.85rem;transition:.2s}
.cat-tag:hover,.cat-tag.active{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
.stats-bar{display:flex;gap:16px;color:var(--text2);font-size:0.85rem;align-items:center;flex-wrap:wrap}
.stats-bar .count{color:var(--accent);font-weight:600}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:10px 0 40px}
.idiom-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;cursor:pointer;transition:.25s;position:relative}
.idiom-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.4);border-color:var(--accent)}
.idiom-card .idiom-text{font-size:1.5rem;font-weight:700;color:var(--accent);margin-bottom:4px}
.idiom-card .pinyin{font-size:0.85rem;color:var(--text2);margin-bottom:10px;font-style:italic}
.idiom-card .meaning{font-size:0.92rem;color:var(--text);margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idiom-card .card-tags{display:flex;gap:6px;flex-wrap:wrap}
.idiom-card .card-tag{font-size:0.72rem;padding:3px 10px;border-radius:12px;font-weight:500}
.card-fav{position:absolute;top:12px;right:12px;font-size:1.2rem;cursor:pointer;transition:.2s;opacity:.5}
.card-fav:hover,.card-fav.faved{opacity:1}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;padding:30px;position:relative}
.modal-close{position:absolute;top:16px;right:16px;background:var(--bg3);border:none;color:var(--text);width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer;transition:.2s}
.modal-close:hover{background:var(--danger);color:var(--text)}
.modal .m-idiom{font-size:2.2rem;font-weight:700;color:var(--accent);margin-bottom:6px}
.modal .m-pinyin{font-size:1rem;color:var(--text2);margin-bottom:16px;font-style:italic}
.modal .m-field{margin-bottom:14px}
.modal .m-label{font-size:0.8rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.modal .m-value{font-size:0.95rem;color:var(--text);line-height:1.7}
.modal .m-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.modal .m-tag{font-size:0.78rem;padding:4px 12px;border-radius:14px}
.modal .m-fav-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:10px;cursor:pointer;font-size:0.9rem;margin-top:10px;transition:.2s}
.modal .m-fav-btn:hover{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
.daily-section{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:20px;padding:30px;margin:0 0 30px;text-align:center}
.daily-label{font-size:0.85rem;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.daily-idiom{font-size:2.8rem;font-weight:700;color:var(--accent);margin-bottom:6px}
.daily-pinyin{font-size:1rem;color:var(--text2);margin-bottom:12px;font-style:italic}
.daily-meaning{font-size:1rem;color:var(--text);max-width:500px;margin:0 auto;line-height:1.7}
.game-section{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:30px;margin:0 0 30px}
.game-title{font-size:1.3rem;font-weight:700;margin-bottom:16px;color:var(--accent2)}
.chain-display{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;min-height:40px;align-items:center}
.chain-item{background:var(--bg3);border:1px solid var(--border);padding:8px 16px;border-radius:10px;font-size:1rem;color:var(--accent);font-weight:600}
.chain-arrow{color:var(--text2);font-size:1.2rem}
.chain-input-row{display:flex;gap:10px;margin-bottom:8px}
.chain-input-row input{flex:1;padding:10px 16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;outline:none}
.chain-input-row input:focus{border-color:var(--accent2)}
.chain-input-row button{background:var(--accent2);color:#1a1a1a;border:none;padding:10px 20px;border-radius:10px;font-weight:600;cursor:pointer;transition:.2s}
.chain-input-row button:hover{opacity:.9}
.chain-hints{display:flex;gap:8px;flex-wrap:wrap}
.chain-hint{padding:4px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:16px;font-size:0.82rem;color:var(--text2);cursor:pointer;transition:.2s}
.chain-hint:hover{background:var(--accent2);color:#1a1a1a;border-color:var(--accent2)}
.chain-score{color:var(--accent);font-weight:600;margin-top:8px}
.quiz-section{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:30px;margin:0 0 30px}
.quiz-question{font-size:1.15rem;margin-bottom:20px;line-height:1.7}
.quiz-input-row{display:flex;gap:10px;margin-bottom:8px}
.quiz-input-row input{flex:1;padding:10px 16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;outline:none}
.quiz-input-row input:focus{border-color:var(--accent)}
.quiz-input-row button{background:var(--accent);color:#1a1a1a;border:none;padding:10px 20px;border-radius:10px;font-weight:600;cursor:pointer}
.quiz-feedback{min-height:24px;margin-top:8px;font-weight:600}
.quiz-feedback.correct{color:var(--success)}
.quiz-feedback.wrong{color:var(--danger)}
.quiz-next{margin-top:10px;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;display:none}
.fav-section{display:none}
.fav-section.show{display:block}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state .icon{font-size:3rem;margin-bottom:16px}
.empty-state p{font-size:1rem}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:12px 24px;border-radius:10px;z-index:300;font-size:0.9rem;animation:fadeIn .3s;box-shadow:0 4px 20px rgba(0,0,0,.4)}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.tab-content{display:none}
.tab-content.active{display:block}
footer{text-align:center;padding:30px 20px;color:var(--text2);font-size:0.85rem;border-top:1px solid var(--border);margin-top:20px}
@media(max-width:600px){.card-grid{grid-template-columns:1fr}
.header-inner{justify-content:center}
.daily-idiom{font-size:2rem}
.modal{padding:20px}}
</style>

<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>

<header>
<h1 style="text-align:center;padding:20px 0;font-size:1.5rem">成语大全 - Chinese Idiom Dictionary</h1>
  <div class="container header-inner">
    <div class="logo">成语<span>大全</span></div>
    <nav>
      <button class="active" data-tab="browse">浏览</button>
      <button data-tab="daily">每日成语</button>
      <button data-tab="chain">成语接龙</button>
      <button data-tab="quiz">猜成语</button>
      <button data-tab="fav">收藏夹</button>
    </nav>
  </div>
</header>

<div class="container">

<div class="tab-content active" id="tab-browse">
  <div class="search-section">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索成语、拼音或含义..." title="Enter键搜索">
      <button onclick="doSearch()">搜索</button>
    </div>
    <div class="categories" id="categories"></div>
    <div class="stats-bar">
      <span>共 <span class="count" id="totalCount">0</span> 个成语</span>
      <span id="showing">全部显示</span>
    </div>
  </div>
  <div class="card-grid" id="cardGrid"></div>
</div>

<div class="tab-content" id="tab-daily">
  <div class="daily-section">
    <div class="daily-label">今日成语</div>
    <div class="daily-idiom" id="dailyIdiom"></div>
    <div class="daily-pinyin" id="dailyPinyin"></div>
    <div class="daily-meaning" id="dailyMeaning"></div>
    <div style="margin-top:16px" id="dailyExtra"></div>
  </div>
</div>

<div class="tab-content" id="tab-chain">
  <div class="game-section">
    <div class="game-title">成语接龙</div>
    <p style="color:var(--text2);margin-bottom:12px">输入一个成语，找出以下一个字开头的成语进行接龙。</p>
    <div class="chain-display" id="chainDisplay"></div>
    <div class="chain-input-row">
      <input type="text" id="chainInput" placeholder="输入成语..." title="Enter键搜索" onkeydown="if(event.key==='Enter')doChain(event)">
      <button onclick="doChain()">接龙</button>
    </div>
    <div class="chain-hints" id="chainHints"></div>
    <div class="chain-score" id="chainScore"></div>
    <button style="background:var(--danger);color:var(--text);border:none;padding:8px 16px;border-radius:8px;cursor:pointer;margin-top:10px;display:none" id="chainReset" onclick="resetChain()">重新开始</button>
  </div>
</div>

<div class="tab-content" id="tab-quiz">
  <div class="quiz-section">
    <div class="game-title">猜成语</div>
    <p style="color:var(--text2);margin-bottom:12px">根据释义猜出对应的成语</p>
    <div class="quiz-question" id="quizQuestion"></div>
    <div class="quiz-input-row">
      <input type="text" id="quizInput" placeholder="请输入成语..." title="Enter键搜索" onkeydown="if(event.key==='Enter')checkQuiz()">
      <button onclick="checkQuiz()">提交</button>
    </div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <button class="quiz-next" id="quizNext" onclick="nextQuiz()">下一题</button>
    <div style="margin-top:12px;color:var(--text2);font-size:0.85rem">
      得分: <span style="color:var(--accent);font-weight:600" id="quizScore">0</span>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-fav">
  <div class="search-section">
    <div class="stats-bar"><span>收藏了 <span class="count" id="favCount">0</span> 个成语</span></div>
  </div>
  <div class="card-grid" id="favGrid"></div>
  <div class="empty-state" id="favEmpty" style="display:none">
    <div class="icon">📚</div>
    <p>还没有收藏成语，去浏览页面添加吧！</p>
  </div>
</div>

</div>

<script>
const idioms = [
  {idiom:"马到成功",pinyin:"mǎ dào chéng gōng",meaning:"形容事情顺利，一开始就取得成功。",source:"元·郑廷玉《楚昭公》",example:"祝您新年快乐，马到成功！",similar:["旗开得胜","一帆风顺"],opposite:["出师不利"],category:["动物"]},
  {idiom:"狐假虎威",pinyin:"hú jiǎ hǔ wēi",meaning:"比喻依仗别人的势力来欺压人。",source:"《战国策·楚策一》",example:"他不过是狐假虎威，没什么真本事。",similar:["狗仗人势","仗势欺人"],opposite:["独步天下"],category:["动物"]},
  {idiom:"画蛇添足",pinyin:"huà shé tiān zú",meaning:"比喻做了多余的事，反而不好。",source:"《战国策·齐策二》",example:"文章已经写得很好了，再加这一段就是画蛇添足。",similar:["多此一举","弄巧成拙"],opposite:["恰到好处"],category:["动物"]},
  {idiom:"叶公好龙",pinyin:"yè gōng hào lóng",meaning:"比喻表面上爱好某事物，实际上并不真爱好。",source:"汉·刘向《新序》",example:"他常说喜欢读书，可一本书都不买，真是叶公好龙。",similar:["表里不一","口是心非"],opposite:["真心实意"],category:["动物"]},
  {idiom:"守株待兔",pinyin:"shǒu zhū dài tù",meaning:"比喻不主动努力，心存侥幸，希望得到意外的收获。",source:"《韩非子·五蠹》",example:"我们不能守株待兔，要主动寻找机会。",similar:["刻舟求剑","坐享其成"],opposite:["主动出击"],category:["动物"]},
  {idiom:"龙飞凤舞",pinyin:"lóng fēi fèng wǔ",meaning:"形容书法笔势有力，灵活舒展。也形容气势奔放。",source:"宋·苏轼《表忠观碑》",example:"他的字龙飞凤舞，气势磅礴。",similar:["笔走龙蛇","行云流水"],opposite:["一笔一划"],category:["动物"]},
  {idiom:"鸡犬升天",pinyin:"jī quǎn shēng tiān",meaning:"比喻一个人得势，和他有关的人也跟着得势。",source:"汉·王充《论衡》",example:"他当了官，连亲戚都跟着鸡犬升天了。",similar:["一人得道"],opposite:[],category:["动物"]},
  {idiom:"对牛弹琴",pinyin:"duì niú tán qín",meaning:"比喻对不懂事理的人讲道理，白费口舌。",source:"汉·牟融《理惑论》",example:"跟他讲这些高深的理论，简直是对牛弹琴。",similar:["白费口舌"],opposite:["有的放矢"],category:["动物"]},
  {idiom:"鸟语花香",pinyin:"niǎo yǔ huā xiāng",meaning:"形容春天的美好景象。",source:"宋·吕本中《庵居》",example:"春天来了，公园里鸟语花香，让人心情舒畅。",similar:["春光明媚","莺歌燕舞"],opposite:["冰天雪地"],category:["动物","自然"]},
  {idiom:"鹤立鸡群",pinyin:"hè lì jī qún",meaning:"比喻一个人的仪表或才能在周围一群人里显得很突出。",source:"晋·戴逵《竹林七贤论》",example:"他在团队中鹤立鸡群，能力远超其他人。",similar:["出类拔萃","卓尔不群"],opposite:["泯然众人"],category:["动物"]},
  {idiom:"鼠目寸光",pinyin:"shǔ mù cùn guāng",meaning:"比喻目光短浅，缺乏远见。",source:"清·蒋士铨《桂林霜》",example:"这种鼠目寸光的决策，必然会导致失败。",similar:["目光如豆"],opposite:["高瞻远瞩"],category:["动物","贬义"]},
  {idiom:"亡羊补牢",pinyin:"wáng yáng bǔ láo",meaning:"比喻出了问题以后想办法补救，免得继续受损失。",source:"《战国策·楚策四》",example:"虽然出了错，但亡羊补牢，为时未晚。",similar:["见兔顾犬","知错就改"],opposite:["执迷不悟"],category:["动物"]},
  {idiom:"一马当先",pinyin:"yī mǎ dāng xiān",meaning:"形容领先，也比喻工作走在群众前面，积极带头。",source:"明·施耐庵《水浒传》",example:"在困难面前，他总是身先士卒，处处走在前头。",similar:["遥遥领先","身先士卒"],opposite:["甘居人后"],category:["动物","励志"]},
  {idiom:"虎头蛇尾",pinyin:"hǔ tóu shé wěi",meaning:"比喻开始时声势很大，到后来劲头很小，有始无终。",source:"元·康进之《李逵负荆》",example:"做事不能虎头蛇尾，要有始有终。",similar:["有始无终"],opposite:["善始善终"],category:["动物","贬义"]},
  {idiom:"如鱼得水",pinyin:"rú yú dé shuǐ",meaning:"比喻得到跟自己十分投合的人或对自己很适合的环境。",source:"《三国志·蜀书·诸葛亮传》",example:"他调到新部门后如鱼得水，工作效率大增。",similar:["得其所哉"],opposite:["格格不入"],category:["动物"]},
  {idiom:"一心一意",pinyin:"yī xīn yī yì",meaning:"形容心思专一，没有别的想法。",source:"《三国志·魏志》",example:"他专心学习，对知识有着执着的追求。",similar:["专心致志","心无旁骛"],opposite:["三心二意"],category:["数字","励志"]},

  {idiom:"目不转睛",pinyin:"mù bù zhuǎn jīng",meaning:"不转眼珠地（看）。形容注意力集中。",source:"晋·杨泉《物理论》",example:"他目不转睛地盯着屏幕，生怕错过任何一个画面。",similar:["聚精会神"],opposite:["左顾右盼"],category:["人物"]},
  {idiom:"名列前茅",pinyin:"míng liè qián máo",meaning:"比喻名次列在前面。",source:"《左传·宣公十二年》",example:"他的成绩一直名列前茅。",similar:["首屈一指"],opposite:["名落孙山"],category:["励志"]},
  {idiom:"水到渠成",pinyin:"shuǐ dào qú chéng",meaning:"水流到的地方自然形成一条水道。比喻条件成熟，事情自然会成功。",source:"宋·释道原《景德传灯录》",example:"基础打好了，成功自然水到渠成。",similar:["瓜熟蒂落"],opposite:["拔苗助长"],category:["自然","励志"]},
  {idiom:"功亏一篑",pinyin:"gōng kuī yī kuì",meaning:"堆九仞高的山，只缺一筐土而不能完成。比喻做事情只差最后一点没能完成。",source:"《尚书·旅獒》",example:"坚持了99步，最后一步放弃了，真是功亏一篑。",similar:["前功尽弃"],opposite:["善始善终"],category:["贬义","数字"]},
];
let currentTab = 'browse';
let activeCategory = null;
let searchQuery = '';
let favorites = JSON.parse(localStorage.getItem('chineseIdiomFavs') || '[]');
let chainHistory = [];
let chainScore = 0;
let currentQuiz = null;
let quizScore = 0;
const categories = ['全部','动物','数字','颜色','自然','人物','情感','励志','贬义'];
function getCategoryColor(cat){
  const map={动物:'var(--tag-animal)',数字:'var(--tag-number)',颜色:'var(--tag-color)',自然:'var(--tag-nature)',人物:'var(--tag-people)',情感:'var(--tag-emotion)',励志:'var(--tag-inspire)',贬义:'var(--tag-negative)'};
  return map[cat]||'var(--tag-animal)';
}
function renderCategories(){
  const el = document.getElementById('categories');
  el.innerHTML = categories.map(c=>{
    const active = (c==='全部'&&!activeCategory) || c===activeCategory;
    return `<span class="cat-tag${active?' active':''}" onclick="filterByCategory('${c==='全部'?'':c}')">${c}</span>`;
  }).join('');
}
function getFilteredIdioms(){
  let list = [...idioms];
  if(activeCategory) list = list.filter(i=>i.category.includes(activeCategory));
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    list = list.filter(i=>i.idiom.includes(q)||i.pinyin.toLowerCase().includes(q)||i.meaning.includes(q));
  }
  return list;
}
function renderCards(){
  const list = getFilteredIdioms();
  const grid = document.getElementById('cardGrid');
  document.getElementById('totalCount').textContent = list.length;
  const sh = document.getElementById('showing');
  if(activeCategory) sh.textContent = `分类: ${activeCategory}`;
  else if(searchQuery) sh.textContent = `搜索: "${searchQuery}"`;
  else sh.textContent = '全部显示';
  if(list.length===0){
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">🔍</div><p>没有找到匹配的成语</p></div>';
    return;
  }
  grid.innerHTML = list.map(i=>{
    const isFav = favorites.includes(i.idiom);
    const tags = i.category.map(c=>`<span class="card-tag" style="background:${getCategoryColor(c)}20;color:${getCategoryColor(c)};border:1px solid ${getCategoryColor(c)}40">${c}</span>`).join('');
    return `
    <div class="idiom-card" onclick="showDetail('${i.idiom}')">
      <div class="card-fav ${isFav?'faved':''}" onclick="event.stopPropagation();toggleFav('${i.idiom}')">${isFav?'★':'☆'}</div>
      <div class="idiom-text">${i.idiom}</div>
      <div class="pinyin">${i.pinyin}</div>
      <div class="meaning">${i.meaning}</div>
      <div class="card-tags">${tags}</div>
    </div>`;
  }).join('');
}
function showDetail(idiomText){
  const i = idioms.find(x=>x.idiom===idiomText);
  if(!i) return;
  const isFav = favorites.includes(i.idiom);
  const tags = i.category.map(c=>`<span class="m-tag" style="background:${getCategoryColor(c)}20;color:${getCategoryColor(c)};border:1px solid ${getCategoryColor(c)}40">${c}</span>`).join('');
  const sim = i.similar.length ? i.similar.join('、') : '无';
  const opp = i.opposite.length ? i.opposite.join('、') : '无';
  document.getElementById('modalContent').innerHTML = `
    <div class="m-idiom">${i.idiom}</div>
    <div class="m-pinyin">${i.pinyin}</div>
    <div class="m-field"><div class="m-label">释义</div><div class="m-value">${i.meaning}</div></div>
    <div class="m-field"><div class="m-label">出处</div><div class="m-value">${i.source}</div></div>
    <div class="m-field"><div class="m-label">例句</div><div class="m-value">${i.example}</div></div>
    <div class="m-field"><div class="m-label">近义词</div><div class="m-value">${sim}</div></div>
    <div class="m-field"><div class="m-label">反义词</div><div class="m-value">${opp}</div></div>
    <div class="m-tags">${tags}</div>
    <button class="m-fav-btn" onclick="toggleFav('${i.idiom}');showDetail('${i.idiom}')">${isFav?'★ 取消收藏':'☆ 加入收藏'}</button>
  `;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
}
function toggleFav(idiomText){
  const idx = favorites.indexOf(idiomText);
  if(idx>=0) favorites.splice(idx,1);
  else favorites.push(idiomText);
  localStorage.setItem('chineseIdiomFavs',JSON.stringify(favorites));
  if(currentTab==='fav') renderFavs();
  else renderCards();
  showToast(idx>=0?'已取消收藏':'已加入收藏');
}
function renderFavs(){
  const list = idioms.filter(i=>favorites.includes(i.idiom));
  document.getElementById('favCount').textContent = list.length;
  const grid = document.getElementById('favGrid');
  const empty = document.getElementById('favEmpty');
  if(list.length===0){
    grid.innerHTML='';
    empty.style.display='block';
    return;
  }
  empty.style.display='none';
  grid.innerHTML = list.map(i=>{
    const tags = i.category.map(c=>`<span class="card-tag" style="background:${getCategoryColor(c)}20;color:${getCategoryColor(c)};border:1px solid ${getCategoryColor(c)}40">${c}</span>`).join('');
    return `
    <div class="idiom-card" onclick="showDetail('${i.idiom}')">
      <div class="card-fav faved" onclick="event.stopPropagation();toggleFav('${i.idiom}')">★</div>
      <div class="idiom-text">${i.idiom}</div>
      <div class="pinyin">${i.pinyin}</div>
      <div class="meaning">${i.meaning}</div>
      <div class="card-tags">${tags}</div>
    </div>`;
  }).join('');
}
function doSearch(){
  searchQuery = document.getElementById('searchInput').value.trim();
  renderCards();
}
function filterByCategory(cat){
  activeCategory = cat||null;
  renderCategories();
  renderCards();
}
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelector(`nav button[data-tab="${tab}"]`).classList.add('active');
  if(tab==='fav') renderFavs();
  if(tab==='daily') showDaily();
  if(tab==='chain') resetChain();
  if(tab==='quiz') nextQuiz();
}
function getDailyIdiom(){
  const today = new Date().toDateString();
  const stored = localStorage.getItem('dailyIdiom');
  if(stored){
    const data = JSON.parse(stored);
    if(data.date===today) return idioms.find(i=>i.idiom===data.idiom);
  }
  const idx = Math.floor(Math.random()*idioms.length);
  localStorage.setItem('dailyIdiom',JSON.stringify({date:today,idiom:idioms[idx].idiom}));
  return idioms[idx];
}
function showDaily(){
  const i = getDailyIdiom();
  document.getElementById('dailyIdiom').textContent = i.idiom;
  document.getElementById('dailyPinyin').textContent = i.pinyin;
  document.getElementById('dailyMeaning').textContent = i.meaning;
  document.getElementById('dailyExtra').innerHTML = `
    <p style="color:var(--text2);font-size:0.9rem;margin-top:8px"><strong>出处：</strong>${i.source}</p>
    <p style="color:var(--text2);font-size:0.9rem"><strong>例句：</strong>${i.example}</p>
    <button style="background:var(--accent);color:#1a1a1a;border:none;padding:10px 20px;border-radius:10px;cursor:pointer;margin-top:12px;font-weight:600" onclick="switchTab('browse');filterByCategory(i.category[0]);showDetail('${i.idiom}')">查看详情</button>
  `;
}
function resetChain(){
  chainHistory = [];
  chainScore = 0;
  document.getElementById('chainDisplay').innerHTML = '';
  document.getElementById('chainHints').innerHTML = '';
  document.getElementById('chainScore').textContent = '';
  document.getElementById('chainInput').value = '';
  document.getElementById('chainReset').style.display = 'none';
}
function doChain(event){
  if(event) event.preventDefault();
  const input = document.getElementById('chainInput').value.trim();
  if(!input) return;
  const found = idioms.find(i=>i.idiom===input);
  if(!found){
    showToast('该成语不在词库中，请换一个试试');
    return;
  }
  if(chainHistory.length>0){
    const lastChar = chainHistory[chainHistory.length-1].slice(-1);
    if(input[0]!==lastChar){
      showToast(`成语必须以"${lastChar}"开头`);
      return;
    }
  }
  if(chainHistory.includes(input)){
    showToast('该成语已经用过，请换一个');
    return;
  }
  chainHistory.push(input);
  chainScore += input.length;
  document.getElementById('chainInput').value = '';
  document.getElementById('chainReset').style.display = 'inline-block';
  document.getElementById('chainScore').textContent = `已接 ${chainHistory.length} 个成语 | 得分: ${chainScore}`;
  const disp = document.getElementById('chainDisplay');
  const items = chainHistory.map((c,i)=>{
    const arrow = i<chainHistory.length-1?'<span class="chain-arrow">→</span>':'';
    return `<span class="chain-item">${c}</span>${arrow}`;
  }).join('');
  disp.innerHTML = items;
  const lastChar = chainHistory[chainHistory.length-1].slice(-1);
  const hints = idioms.filter(i=>i.idiom[0]===lastChar&&!chainHistory.includes(i.idiom)).slice(0,8);
  const hintsEl = document.getElementById('chainHints');
  if(hints.length>0){
    hintsEl.innerHTML = `<span style="color:var(--text2);font-size:0.82rem">可接的成语：</span>` + hints.map(h=>`<span class="chain-hint" onclick="chainClick('${h.idiom}')">${h.idiom}</span>`).join('');
  } else {
    hintsEl.innerHTML = '<span style="color:var(--danger);font-size:0.82rem">词库中没有可接的成语了，你很厉害！</span>';
  }
}
function chainClick(idiomText){
  document.getElementById('chainInput').value = idiomText;
  doChain();
}
function nextQuiz(){
  const available = idioms.filter(i=>i.meaning.length>8);
  currentQuiz = available[Math.floor(Math.random()*available.length)];
  document.getElementById('quizQuestion').textContent = `❓ "${currentQuiz.meaning}"`;
  document.getElementById('quizInput').value = '';
  document.getElementById('quizFeedback').textContent = '';
  document.getElementById('quizFeedback').className = 'quiz-feedback';
  document.getElementById('quizNext').style.display = 'none';
}
function checkQuiz(){
  const input = document.getElementById('quizInput').value.trim();
  if(!input) return;
  const fb = document.getElementById('quizFeedback');
  const cleanMeaning = currentQuiz.meaning.replace(/[^\u4e00-\u9fa5]/g,'');
  if(input===currentQuiz.idiom){
    fb.textContent = '✓ 回答正确！太棒了！';
    fb.className = 'quiz-feedback correct';
    quizScore += 10;
    document.getElementById('quizScore').textContent = quizScore;
    document.getElementById('quizNext').style.display = 'inline-block';
  } else {
    fb.textContent = `✗ 不对哦，正确答案是「${currentQuiz.idiom}」，再试一题吧`;
    fb.className = 'quiz-feedback wrong';
    showToast(`答案是：${currentQuiz.idiom} (${currentQuiz.pinyin})`);
    setTimeout(()=>nextQuiz(), 1500);
  }
}
function showToast(msg){
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2000);
}
document.getElementById('modal').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click',()=>switchTab(b.dataset.tab));
});
document.getElementById('searchInput').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});
renderCategories();
renderCards();
</script>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
