<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>哲学时间线</title>
<meta name="description" content="哲学历史时间线，展示哲学思想的重要发展"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#10b981;--accent3:#f59e0b;--danger:#ef4444;--success:#22c55e;--radius:12px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:20pxscroll-behavior:smooth;}
.container{max-width:800px;margin:0 auto}
h1{text-align:center;font-size:1.8em;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:#8b949e;margin-bottom:24px;font-size:.95em}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 24px;border:none;border-radius:8px;font-size:1em;cursor:pointer;transition:all .2s;font-weight:600}
.btn-primary{background:var(--accent);color:var(--text)}.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-success{background:var(--accent2);color:var(--text)}.btn-success:hover{opacity:.9}
.btn-danger{background:var(--danger);color:var(--text)}.btn-danger:hover{opacity:.9}
.btn-outline{background:transparent;color:var(--accent);border:2px solid var(--accent)}.btn-outline:hover{background:var(--accent);color:var(--text)}
.score{text-align:center;font-size:1.3em;margin:16px 0;color:var(--accent3);font-weight:700}
.progress-bar{width:100%;height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;border-radius:4px}
.options{display:grid;gap:10px;margin:16px 0}
.option{background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:14px 18px;cursor:pointer;transition:all .2s;text-align:left;font-size:1em;color:var(--text)}
.option:hover{border-color:var(--accent);background:#1a2332}
.option.correct{border-color:var(--success);background:rgba(34,197,94,.1);color:var(--success)}
.option.wrong{border-color:var(--danger);background:rgba(239,68,68,.1);color:var(--danger)}
.option.disabled{pointer-events:none;opacity:.7}
.result{text-align:center;padding:32px}.result h2{font-size:1.5em;margin-bottom:12px}
.hidden{display:none}
.timeline{position:relative;padding-left:40px;margin:20px 0}
.timeline::before{content:'';position:absolute;left:15px;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.timeline-item{position:relative;margin-bottom:24px;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius)}
.timeline-item::before{content:'';position:absolute;left:-33px;top:20px;width:12px;height:12px;background:var(--accent);border-radius:50%;border:3px solid var(--bg)}
.timeline-year{font-weight:700;color:var(--accent);font-size:1.1em}
.timeline-text{color:#8b949e;margin-top:4px;font-size:.95em}
.input{width:100%;padding:12px 16px;background:var(--bg);border:2px solid var(--border);border-radius:8px;color:var(--text);font-size:1em;margin:8px 0}
.input:focus{outline:none;border-color:var(--accent)}
.quiz-card{margin-bottom:12px;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s}
.quiz-card:hover{border-color:var(--accent)}
.quiz-card.correct{border-color:var(--success);background:rgba(34,197,94,.1)}
.quiz-card.wrong{border-color:var(--danger);background:rgba(239,68,68,.1)}
.year-label{font-weight:700;color:var(--accent);margin-bottom:4px}
.event-text{color:#8b949e;font-size:.95em}
.order-num{display:inline-block;width:28px;height:28px;background:var(--accent);color:var(--text);border-radius:50%;text-align:center;line-height:28px;font-size:.85em;margin-right:8px}
.grid-cn{display:grid;gap:2px;margin:16px 0}
.cell-cn{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:clamp(10px,2.5vw,16px);cursor:pointer;transition:all .2s;user-select:none}
.cell-cn:hover{border-color:var(--accent)}
.cell-cn.sel{background:rgba(59,130,246,.2);border-color:var(--accent)}
.cell-cn.found{background:rgba(34,197,94,.2);border-color:var(--success);color:var(--success)}
.word-tag{display:inline-block;padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:20px;font-size:.9em;margin:4px}
.word-tag.found{background:rgba(34,197,94,.15);border-color:var(--success);color:var(--success);text-decoration:line-through}
.scrambled{font-size:2em;text-align:center;letter-spacing:8px;margin:20px 0;color:var(--accent);font-weight:700}
.input-row{display:flex;gap:8px;justify-content:center;margin:16px 0}
.puzzle-chars{display:flex;gap:8px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.puzzle-char{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:2px solid var(--border);border-radius:8px;font-size:1.3em;cursor:pointer;transition:all .2s;user-select:none}
.puzzle-char:hover{border-color:var(--accent)}
.puzzle-char.placed{background:rgba(59,130,246,.15);border-color:var(--accent)}
.answer-slots{display:flex;gap:8px;justify-content:center;margin:16px 0}
.answer-slot{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:2px dashed var(--border);border-radius:8px;font-size:1.3em;cursor:pointer}
.answer-slot.filled{border-style:solid;border-color:var(--accent)}
@media(max-width:600px){h1{font-size:1.4em}.card{padding:16px}.option{padding:12px}.scrambled{font-size:1.4em;letter-spacing:4px}.puzzle-char{width:40px;height:40px;font-size:1.1em}.answer-slot{width:40px;height:40px}.timeline{padding-left:30px}}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">

</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div><div class="container"><h1>哲学时间线</h1><p class="subtitle">哲学发展的重要时刻</p><div class="card" id="game"><div class="score" id="score">已排对: 0 / 0</div><p style="text-align:center;color:#8b949e;margin:8px 0">将事件按时间顺序排列，点击正确的下一个事件</p><div id="events"></div><div style="text-align:center;margin-top:12px"><button class="btn btn-outline" onclick="showAnswer()">显示答案</button></div></div><div class="card hidden" id="result"><div class="result"><h2 id="resultTitle"></h2><p id="resultText" style="margin:12px 0;color:#8b949e"></p><div id="answerList"></div><br><button class="btn btn-primary" onclick="restart()">重新开始</button></div></div></div><script>const E=[{"year": "约公元前600年", "text": "古希腊哲学开始"}, {"year": "约公元前500年", "text": "孔子、老子时代"}, {"year": "约公元前387年", "text": "柏拉图学院"}, {"year": "约公元前335年", "text": "亚里士多德学院"}, {"year": "1637年", "text": "笛卡尔《方法论》"}, {"year": "1689年", "text": "洛克《政府论》"}, {"year": "1781年", "text": "康德《纯粹理性批判》"}, {"year": "1818年", "text": "叔本华《意志与表象》"}, {"year": "1883年", "text": "尼采《查拉图斯特拉》"}, {"year": "1927年", "text": "海德格尔《存在与时间》"}];let cur=0,correct=0,sh=[];function shuffle(){sh=E.map((e,i)=>({...e,idx:i}));for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]]}}function show(){const rem=sh.filter(e=>!e.done);document.getElementById('events').innerHTML=rem.map(e=>`<div class="quiz-card" onclick="pick(${e.idx})" id="card-${e.idx}"><span class="order-num">${e.idx+1}</span><span class="year-label">${e.year}</span><div class="event-text">${e.text}</div></div>`).join('');document.getElementById('score').textContent='已排对: '+correct+' / '+E.length}function pick(idx){if(idx===cur){correct++;const c=document.getElementById('card-'+idx);if(c){c.classList.add('correct');c.style.pointerEvents='none'}cur++;document.getElementById('score').textContent='已排对: '+correct+' / '+E.length;if(correct===E.length)setTimeout(finish,500)}else{const c=document.getElementById('card-'+idx);if(c){c.classList.add('wrong');setTimeout(()=>c.classList.remove('wrong'),800)}}function showAnswer(){document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('resultTitle').textContent='完整时间线';document.getElementById('answerList').innerHTML='<div class="timeline">'+E.map(e=>`<div class="timeline-item"><div class="timeline-year">${e.year}</div><div class="timeline-text">${e.text}</div></div>`).join('')+'</div>'}function finish(){document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('resultTitle').textContent='排序完成！';document.getElementById('resultText').textContent='全部事件已按正确顺序排列';document.getElementById('answerList').innerHTML='<div class="timeline">'+E.map(e=>`<div class="timeline-item"><div class="timeline-year">${e.year}</div><div class="timeline-text">${e.text}</div></div>`).join('')+'</div>'}function restart(){cur=0;correct=0;shuffle();document.getElementById('game').classList.remove('hidden');document.getElementById('result').classList.add('hidden');show()}shuffle();show();
}</script><script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
