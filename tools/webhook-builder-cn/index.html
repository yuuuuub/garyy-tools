<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪝 Webhook构建器</title>
<meta name="description" content="Webhook构建器，创建和测试Webhook回调配置">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🪝 Webhook构建器">
<meta property="og:description" content="Webhook构建器 - Gary's Tools">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪝</text></svg>">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;transition:background .3s,color .3s}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.3rem;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:80px;font-family:'SF Mono',Menlo,monospace;font-size:.82rem}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-orange{background:var(--orange)}.btn-purple{background:var(--purple)}.btn-sm{padding:4px 10px;font-size:.8rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px}
.theme-toggle{position:fixed;top:12px;right:12px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:8px;cursor:pointer;z-index:100}
.method-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:700;color:#fff}
.method-POST{background:var(--blue)}.method-GET{background:var(--green)}.method-PUT{background:var(--orange);color:#000}
.webhook-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px}
.webhook-item .wh-url{font-family:monospace;font-size:.82rem;color:var(--blue);word-break:break-all}
.webhook-item .wh-meta{font-size:.75rem;color:var(--text2);margin-top:4px}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.status-active{background:var(--green)}.status-inactive{background:var(--text2)}.status-error{background:var(--red)}
.preview-box{background:#1a1a2e;color:#e6e6e6;padding:16px;border-radius:8px;border:1px solid var(--border);font-family:'SF Mono',Menlo,monospace;font-size:.8rem;line-height:1.6;white-space:pre-wrap;word-break:break-all;overflow:auto;max-height:400px}
.header-row{display:flex;gap:8px;margin-bottom:6px}
.header-row input{flex:1}
.header-row button{flex-shrink:0;padding:4px 8px;font-size:.75rem}
.tab-bar{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab-bar button{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.tab-bar button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>🪝 Webhook构建器</h1>

<div class="tab-bar">
<button class="active" onclick="switchTab('create')">创建Webhook</button>
<button onclick="switchTab('list')">Webhook列表</button>
<button onclick="switchTab('tester')">测试工具</button>
<button onclick="switchTab('templates')">模板</button>
</div>

<div id="tab-create" class="card">
<div class="section-title">配置Webhook</div>
<div style="margin-bottom:12px"><label>Webhook名称</label><input type="text" id="whName" placeholder="例：订单通知Webhook"></div>
<div class="form-row">
<div><label>请求方法</label><select id="whMethod"><option value="POST">POST</option><option value="GET">GET</option><option value="PUT">PUT</option></select></div>
<div><label>状态</label><select id="whStatus"><option value="active">启用</option><option value="inactive">停用</option></select></div>
</div>
<div style="margin-bottom:12px"><label>URL</label><input type="url" id="whUrl" placeholder="https://your-server.com/webhook"></div>
<div style="margin-bottom:12px"><label>Secret (签名密钥)</label><input type="text" id="whSecret" placeholder="whsec_xxxxxxxxxxxx"></div>
<div style="margin-bottom:12px">
<label>请求头</label>
<div id="headerList">
<div class="header-row"><input type="text" placeholder="Key" class="h-key" value="Content-Type"><input type="text" placeholder="Value" class="h-val" value="application/json"><button class="btn-sm btn-red" onclick="removeHeader(this)">×</button></div>
</div>
<button class="btn-sm" onclick="addHeader()" style="margin-top:4px">+ 添加请求头</button>
</div>
<div style="margin-bottom:12px"><label>请求体 (JSON)</label><textarea id="whBody" rows="6" placeholder='{"event":"order.created","data":{}}'>{"event":"order.created","data":{"order_id":"12345","amount":99.00,"customer":"张三"}}</textarea></div>
<div style="margin-bottom:12px"><label>重试次数</label><select id="whRetry"><option value="0">不重试</option><option value="3" selected>3次</option><option value="5">5次</option><option value="10">10次</option></select></div>
<div style="margin-bottom:12px"><label>超时时间(秒)</label><input type="number" id="whTimeout" value="30" min="5" max="120"></div>
<div style="display:flex;gap:8px">
<button onclick="saveWebhook()">💾 保存</button>
<button class="btn-green" onclick="testWebhook()">🚀 测试发送</button>
<button class="btn-purple" onclick="genCurl()">📋 生成cURL</button>
</div>
</div>

<div id="tab-list" class="card" style="display:none">
<div class="section-title">已保存的Webhook</div>
<div id="webhookList"></div>
</div>

<div id="tab-tester" class="card" style="display:none">
<div class="section-title">Webhook测试工具</div>
<div style="margin-bottom:12px"><label>目标URL</label><input type="url" id="testUrl" placeholder="https://your-server.com/webhook"></div>
<div class="form-row">
<div><label>方法</label><select id="testMethod"><option value="POST">POST</option><option value="GET">GET</option><option value="PUT">PUT</option></select></div>
<div><label>延迟(秒)</label><input type="number" id="testDelay" value="0" min="0" max="60"></div>
</div>
<div style="margin-bottom:12px"><label>请求体</label><textarea id="testBody" rows="4">{"test":true,"timestamp":"2024-01-01T00:00:00Z"}</textarea></div>
<button onclick="simulateTest()">🧪 模拟测试</button>
<div id="testResult" style="margin-top:12px;display:none">
<div class="section-title" style="font-size:.85rem">测试结果</div>
<div class="preview-box" id="testOutput"></div>
</div>
</div>

<div id="tab-templates" class="card" style="display:none">
<div class="section-title">Webhook模板</div>
<div id="templateList"></div>
</div>

<div class="card" id="curlCard" style="display:none">
<div class="section-title">cURL命令</div>
<div class="preview-box" id="curlOutput"></div>
<div style="margin-top:8px"><button class="btn-sm btn-green" onclick="copyCurl()">📋 复制</button></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var webhooks = JSON.parse(localStorage.getItem('webhooks') || '[]');
var idCounter = webhooks.length ? Math.max(...webhooks.map(w=>w.id)) + 1 : 1;

var tplList = [
  {name:'订单创建通知',method:'POST',url:'https://api.example.com/webhooks/orders',body:'{"event":"order.created","data":{"order_id":"12345","amount":99.00,"customer":"张三","items":[{"name":"商品A","qty":2}]}}'},
  {name:'支付回调',method:'POST',url:'https://api.example.com/webhooks/payments',body:'{"event":"payment.completed","data":{"payment_id":"pay_001","order_id":"12345","amount":99.00,"method":"wechat"}}'},
  {name:'用户注册',method:'POST',url:'https://api.example.com/webhooks/users',body:'{"event":"user.registered","data":{"user_id":"u_001","name":"李四","email":"test@example.com"}}'},
  {name:'库存告警',method:'POST',url:'https://hooks.slack.com/services/xxx',body:'{"text":"⚠️ 库存告警","blocks":[{"type":"section","text":{"type":"mrkdwn","text":"*商品A* 库存不足\\n当前库存: 5件\\n请及时补货"}}]}'}
];

function switchTab(tab){
  document.querySelectorAll('.tab-bar button').forEach(function(b){b.classList.remove('active');});
  event.target.classList.add('active');
  ['create','list','tester','templates'].forEach(function(t){
    var el=document.getElementById('tab-'+t);
    if(el)el.style.display=t===tab?'block':'none';
  });
  if(tab==='list')renderList();
  if(tab==='templates')renderTemplates();
}

function addHeader(){
  var el=document.getElementById('headerList');
  var div=document.createElement('div');
  div.className='header-row';
  div.innerHTML='<input type="text" placeholder="Key" class="h-key"><input type="text" placeholder="Value" class="h-val"><button class="btn-sm btn-red" onclick="removeHeader(this)">×</button>';
  el.appendChild(div);
}
function removeHeader(btn){btn.parentElement.remove();}

function getHeaders(){
  var headers={};
  document.querySelectorAll('.header-row').forEach(function(row){
    var k=row.querySelector('.h-key').value.trim();
    var v=row.querySelector('.h-val').value.trim();
    if(k)headers[k]=v;
  });
  return headers;
}

function saveWebhook(){
  var name=document.getElementById('whName').value.trim();
  var url=document.getElementById('whUrl').value.trim();
  if(!name||!url){alert('请填写名称和URL');return;}
  webhooks.unshift({
    id:idCounter++,name:name,method:document.getElementById('whMethod').value,
    url:url,secret:document.getElementById('whSecret').value,
    headers:getHeaders(),body:document.getElementById('whBody').value,
    status:document.getElementById('whStatus').value,
    retry:document.getElementById('whRetry').value,
    timeout:document.getElementById('whTimeout').value,
    created:new Date().toLocaleDateString('zh-CN'),
    lastTriggered:null,triggerCount:0
  });
  localStorage.setItem('webhooks',JSON.stringify(webhooks));
  renderList();
  alert('Webhook保存成功！');
}

function renderList(){
  var el=document.getElementById('webhookList');
  if(!webhooks.length){el.innerHTML='<p style="color:var(--text2);text-align:center;padding:16px">暂无Webhook</p>';return;}
  el.innerHTML=webhooks.map(function(w,i){
    var statusClass=w.status==='active'?'status-active':'status-inactive';
    return '<div class="webhook-item"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><span class="method-badge method-'+w.method+'">'+w.method+'</span> <span class="status-dot '+statusClass+'"></span><span class="wh-url">'+w.url+'</span></div><div><button class="btn-sm btn-orange" onclick="editWebhook('+i+')">编辑</button> <button class="btn-sm btn-red" onclick="deleteWebhook('+i+')">删除</button></div></div><div class="wh-meta">'+w.name+' · 触发'+w.triggerCount+'次 · '+w.created+'</div></div>';
  }).join('');
}

function editWebhook(i){
  var w=webhooks[i];
  document.getElementById('whName').value=w.name;
  document.getElementById('whMethod').value=w.method;
  document.getElementById('whUrl').value=w.url;
  document.getElementById('whSecret').value=w.secret||'';
  document.getElementById('whBody').value=w.body;
  document.getElementById('whStatus').value=w.status;
  document.getElementById('whRetry').value=w.retry;
  document.getElementById('whTimeout').value=w.timeout;
  switchTab('create');
  document.querySelector('.tab-bar button').click();
}

function deleteWebhook(i){webhooks.splice(i,1);localStorage.setItem('webhooks',JSON.stringify(webhooks));renderList();}

function testWebhook(){
  var url=document.getElementById('whUrl').value;
  var method=document.getElementById('whMethod').value;
  var body=document.getElementById('whBody').value;
  if(!url){alert('请填写URL');return;}
  simulateRequest(url,method,body);
}

function simulateRequest(url,method,body){
  var start=Date.now();
  var status=Math.random()>0.2?200:(Math.random()>0.5?400:500);
  var latency=Math.round(Math.random()*500+100);
  setTimeout(function(){
    var result={
      timestamp:new Date().toISOString(),
      method:method,
      url:url,
      status:status,
      statusText:status===200?'OK':status===400?'Bad Request':'Internal Server Error',
      latency:latency+'ms',
      request_headers:{"Content-Type":"application/json","User-Agent":"WebhookBuilder/1.0","X-Webhook-Signature":"sha256="+Array(64).fill(0).map(function(){return '0123456789abcdef'[Math.floor(Math.random()*16)];}).join('')},
      response_body:status===200?{success:true,message:"Webhook received"}:{error:true,message:"Processing failed"}
    };
    alert('测试完成！状态码: '+status+' 耗时: '+latency+'ms');
  },latency);
}

function simulateTest(){
  var url=document.getElementById('testUrl').value||'https://example.com/webhook';
  var method=document.getElementById('testMethod').value;
  var body=document.getElementById('testBody').value;
  var delay=parseInt(document.getElementById('testDelay').value)||0;
  var el=document.getElementById('testResult');
  el.style.display='block';
  document.getElementById('testOutput').textContent='发送中...';
  setTimeout(function(){
    var status=Math.random()>0.15?200:500;
    var result='→ '+method+' '+url+'\n\nRequest Headers:\nContent-Type: application/json\nX-Request-Id: req_'+Math.random().toString(36).substr(2,12)+'\nX-Timestamp: '+new Date().toISOString()+'\n\nRequest Body:\n'+body+'\n\n← Response: '+status+' '+(status===200?'OK':'Error')+'\n\nResponse Body:\n'+JSON.stringify(status===200?{success:true}:{error:"Internal Server Error"},null,2)+'\n\nLatency: '+Math.round(Math.random()*800+50)+'ms';
    document.getElementById('testOutput').textContent=result;
  },delay*1000+500);
}

function genCurl(){
  var method=document.getElementById('whMethod').value;
  var url=document.getElementById('whUrl').value;
  var headers=getHeaders();
  var body=document.getElementById('whBody').value;
  var cmd='curl -X '+method+' "'+url+'"';
  Object.keys(headers).forEach(function(k){cmd+=' \\\n  -H "'+k+': '+headers[k]+'"';});
  if(method!=='GET'&&body)cmd+=' \\\n  -d \''+body+'\'';
  document.getElementById('curlOutput').textContent=cmd;
  document.getElementById('curlCard').style.display='block';
  document.getElementById('curlCard').scrollIntoView({behavior:'smooth'});
}
function copyCurl(){navigator.clipboard.writeText(document.getElementById('curlOutput').textContent).then(function(){alert('已复制');});}

function renderTemplates(){
  document.getElementById('templateList').innerHTML=tplList.map(function(t,i){
    return '<div class="webhook-item"><div style="display:flex;justify-content:space-between;align-items:center"><div><strong>'+t.name+'</strong> <span class="method-badge method-'+t.method+'">'+t.method+'</span></div><button class="btn-sm" onclick="useTemplate('+i+')">使用</button></div><div class="wh-url" style="margin-top:4px">'+t.url+'</div></div>';
  }).join('');
}

function useTemplate(i){
  var t=tplList[i];
  document.getElementById('whName').value=t.name;
  document.getElementById('whMethod').value=t.method;
  document.getElementById('whUrl').value=t.url;
  document.getElementById('whBody').value=t.body;
  switchTab('create');
  document.querySelector('.tab-bar button').click();
}

function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
</script>
</body>
</html>
