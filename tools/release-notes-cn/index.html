<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 发布说明</title>
<meta name="description" content="发布说明(Release Notes)生成工具，快速编写版本更新说明">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.release-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px;cursor:pointer;transition:all .2s}
.release-card:hover{box-shadow:var(--shadow)}
.release-card h3{font-size:1rem;margin-bottom:4px}
.release-date{font-size:.8rem;color:var(--text2)}
.section-block{margin-bottom:12px}
.section-block h3{font-size:.9rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.change-item{display:flex;align-items:flex-start;gap:8px;padding:8px;border-bottom:1px solid var(--border);font-size:.9rem}
.change-item:last-child{border-bottom:none}
.change-type{padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600;flex-shrink:0}
.type-feat{background:rgba(63,185,80,.2);color:var(--green)}
.type-fix{background:rgba(248,81,73,.2);color:var(--red)}
.type-improve{background:rgba(59,130,246,.2);color:var(--accent)}
.type-docs{background:rgba(210,153,34,.2);color:var(--yellow)}
.remove-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:.85rem;flex-shrink:0}
.add-row{display:flex;gap:6px;margin-top:8px}
.add-row input,.add-row select{margin-bottom:0;flex:1}
.add-row select{width:auto;min-width:90px}
.preview{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;font-family:monospace;font-size:.85rem;white-space:pre-wrap;line-height:1.8}
.copy-btn{position:relative}
.copy-btn.copied::after{content:'已复制';position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:2px 8px;border-radius:4px;font-size:.7rem;white-space:nowrap}
.empty{text-align:center;color:var(--text2);padding:40px}
@media(max-width:600px){body{padding:10px}.ctn{max-width:100%}.cd{padding:14px}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📦 发布说明">
<meta property="og:description" content="发布说明(Release Notes)生成工具">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/release-notes-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='release_notes';
let releases=JSON.parse(localStorage.getItem(STORE)||'[]');
let curView='list',curId=null;
function save(){localStorage.setItem(STORE,JSON.stringify(releases))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function render(){
  let h=`<div class="hdr"><h1>📦 发布说明</h1><p>快速编写版本更新说明</p></div>`;
  h+=`<div class="flex" style="justify-content:center;margin-bottom:16px"><button onclick="showNew()">新建发布</button><button class="sec" onclick="curView='list';render()">全部发布</button></div>`;
  h+=`<div id="viewNew" class="${curView==='new'?'':'hidden'}"></div>`;
  h+=`<div id="viewList" class="${curView==='list'?'':'hidden'}"></div>`;
  h+=`<div id="viewDetail" class="${curView==='detail'?'':'hidden'}"></div>`;
  $('app').innerHTML=h;
  if(curView==='new')renderNew();else if(curView==='list')renderList();else renderDetail();
}
function renderNew(){
  let h=`<div class="cd"><h2>新建发布说明</h2>`;
  h+=`<label>版本号</label><input id="rVersion" placeholder="例如：v1.2.0">`;
  h+=`<label>发布日期</label><input type="date" id="rDate">`;
  h+=`<label>发布标题</label><input id="rTitle" placeholder="简短描述本次更新">`;
  h+=`<div class="bg"><button onclick="saveRelease()">创建</button><button class="sec" onclick="curView='list';render()">取消</button></div></div>`;
  $('viewNew').innerHTML=h;
}
function saveRelease(){
  const version=$('rVersion').value.trim();if(!version){alert('请输入版本号');return}
  releases.push({id:uid(),version,date:$('rDate').value,title:$('rTitle').value,changes:{feat:[],fix:[],improve:[],docs:[]},createdAt:new Date().toISOString()});
  save();curId=releases[releases.length-1].id;curView='detail';render();
}
function renderList(){
  let h=`<div class="cd">`;
  if(!releases.length){h+=`<p class="empty">暂无发布说明</p>`}
  releases.slice().reverse().forEach(r=>{
    const total=(r.changes.feat||[]).length+(r.changes.fix||[]).length+(r.changes.improve||[]).length+(r.changes.docs||[]).length;
    h+=`<div class="release-card" onclick="viewRelease('${r.id}')">`;
    h+=`<div class="flex-between"><h3>${r.version}</h3><span class="release-date">${r.date||'未定'}</span></div>`;
    if(r.title)h+=`<div style="font-size:.9rem;color:var(--text2)">${r.title}</div>`;
    h+=`<div style="font-size:.8rem;color:var(--text2);margin-top:4px">${total}项变更</div></div>`;
  });
  h+=`</div>`;$('viewList').innerHTML=h;
}
function viewRelease(id){curId=id;curView='detail';render()}
function delRelease(id){if(!confirm('确定删除?'))return;releases=releases.filter(r=>r.id!==id);save();curView='list';render()}
function renderDetail(){
  const r=releases.find(x=>x.id===curId);if(!r){curView='list';render();return}
  const sections=[
    {key:'feat',icon:'✨',label:'新功能',cls:'type-feat'},
    {key:'fix',icon:'🐛',label:'Bug修复',cls:'type-fix'},
    {key:'improve',icon:'📈',label:'改进',cls:'type-improve'},
    {key:'docs',icon:'📝',label:'文档',cls:'type-docs'}
  ];
  let h=`<div class="cd"><div class="flex-between"><h2>${r.version}</h2><span class="release-date">${r.date||''}</span></div>`;
  if(r.title)h+=`<p style="color:var(--text2);margin-bottom:12px">${r.title}</p>`;
  sections.forEach(sec=>{
    h+=`<div class="section-block"><h3>${sec.icon} ${sec.label} (${(r.changes[sec.key]||[]).length})</h3>`;
    (r.changes[sec.key]||[]).forEach((item,ii)=>{
      h+=`<div class="change-item"><span class="change-type ${sec.cls}">${sec.label}</span><span style="flex:1">${item}</span><button class="remove-btn" onclick="removeChange('${r.id}','${sec.key}',${ii})">✕</button></div>`;
    });
    h+=`<div class="add-row"><input id="add_${sec.key}" placeholder="添加${sec.label}..." onkeydown="if(event.key==='Enter')addChange('${r.id}','${sec.key}')"><button style="padding:6px 12px" onclick="addChange('${r.id}','${sec.key}')">+</button></div></div>`;
  });
  h+=`<h2 style="margin-top:16px">预览</h2>`;
  h+=`<div class="preview">${generateMarkdown(r)}</div>`;
  h+=`<div class="bg"><button class="sec copy-btn" onclick="copyMd(this)">复制Markdown</button><button class="sec" onclick="curView='list';render()">返回</button><button class="dng" onclick="delRelease('${r.id}')">删除</button></div></div>`;
  $('viewDetail').innerHTML=h;
}
function addChange(id,key){
  const r=releases.find(x=>x.id===id);if(!r)return;
  const input=$('add_'+key);const val=input.value.trim();if(!val)return;
  r.changes[key]=r.changes[key]||[];r.changes[key].push(val);save();input.value='';renderDetail();
}
function removeChange(id,key,idx){
  const r=releases.find(x=>x.id===id);if(!r)return;
  r.changes[key].splice(idx,1);save();renderDetail();
}
function generateMarkdown(r){
  let md=`# ${r.version}\n\n`;
  if(r.title)md+=`${r.title}\n\n`;
  if(r.date)md+=`📅 ${r.date}\n\n`;
  const sections=[{key:'feat',label:'✨ 新功能'},{key:'fix',label:'🐛 Bug修复'},{key:'improve',label:'📈 改进'},{key:'docs',label:'📝 文档'}];
  sections.forEach(sec=>{
    if(r.changes[sec.key]&&r.changes[sec.key].length){
      md+=`## ${sec.label}\n\n`;
      r.changes[sec.key].forEach(item=>{md+=`- ${item}\n`});
      md+=`\n`;
    }
  });
  return md;
}
function copyMd(btn){
  const r=releases.find(x=>x.id===curId);if(!r)return;
  navigator.clipboard.writeText(generateMarkdown(r));
  btn.classList.add('copied');setTimeout(()=>btn.classList.remove('copied'),1500);
}
function showNew(){curView='new';render()}
render();
</script>
</body>
</html>
