<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ 世界杯球队档案 - Gary's Tools</title>
<meta name="description" content="2026世界杯热门球队深度档案：阵容实力、历史战绩、核心球员、晋级前景分析">
<style>
:root{--bg:#0a0f1a;--card:#111827;--text:#e5e7eb;--text2:#9ca3af;--accent:#f59e0b;--green:#22c55e;--blue:#3b82f6;--red:#ef4444;--border:#1f2937;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:560px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#f59e0b,#ef4444,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.78rem;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s}
.tab.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
.team-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.team-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%}
.team-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.team-flag{font-size:2.2rem;width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0}
.team-name{font-size:1.1rem;font-weight:800}
.team-rank{font-size:.7rem;color:var(--text2)}
.stats-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.stat-chip{font-size:.7rem;padding:4px 10px;border-radius:8px;font-weight:600}
.stat-champion{background:rgba(245,158,11,.15);color:var(--accent)}
.stat-strong{background:rgba(34,197,94,.1);color:var(--green)}
.stat-mid{background:rgba(59,130,246,.1);color:var(--blue)}
.stat-weak{background:rgba(239,68,68,.1);color:var(--red)}
.team-stars{font-size:.78rem;color:var(--text2);line-height:1.6;margin-bottom:8px}
.team-strength{display:flex;gap:4px;margin-top:8px}
.strength-bar{height:6px;border-radius:3px;flex:1}
.sb-attack{background:var(--red)}
.sb-mid{background:var(--accent)}
.sb-def{background:var(--blue)}
.sb-overall{background:var(--green)}
.strength-label{font-size:.6rem;color:var(--text2);margin-top:2px}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="⚽ 世界杯球队档案 - Gary's Tools">
  <meta property="og:description" content="2026世界杯热门球队深度档案：阵容实力、历史战绩、核心球员、晋级前景分析">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/wc-team-profiles/">
</head>
<body>
<div class="container">
<header><h1>⚽ 世界杯球队档案</h1><p>2026美加墨 · 热门球队深度解析</p></header>

<div class="tabs" id="tabs">
<button class="tab active" data-c="all">全部</button>
<button class="tab" data-c="champion">🏆 争冠热门</button>
<button class="tab" data-c="strong">⚡ 劲旅</button>
<button class="tab" data-c="dark">🐴 黑马</button>
<button class="tab" data-c="asia">🌏 亚洲</button>
</div>

<div id="teamList"></div>
<footer>⚽ 数据截至2026年6月 · 仅供参考</footer>
</div>

<script>
const TEAMS=[
{//0
name:'阿根廷',flag:'🇦🇷',rank:'FIFA #1',cats:['champion'],stars:'梅西(最后一次世界杯⚡)、劳塔罗、恩佐·费尔南德斯、阿尔瓦雷斯',strength:{a:4.5,m:4,s:3.5,o:4},
history:'卫冕冠军(2022)🏆 · 3次世界杯冠军',color:'#75aadb',sc:'champion',desc:'梅西最后一舞，卫冕冠军带着美洲杯+世界杯双冠光环出征'},
{//1
name:'法国',flag:'🇫🇷',rank:'FIFA #2',cats:['champion'],stars:'姆巴佩、楚阿梅尼、格列兹曼(可能)、萨利巴',strength:{a:5,m:4,s:3.5,o:4.5},
history:'2022亚军 · 2次世界杯冠军(1998/2018)',color:'#002395',sc:'champion',desc:'姆巴佩正值巅峰，法国人才储备让所有对手羡慕'},
{//2
name:'巴西',flag:'🇧🇷',rank:'FIFA #3',cats:['champion'],stars:'维尼修斯、罗德里戈、恩德里克、米利唐',strength:{a:5,m:4,s:3.5,o:4},
history:'5次冠军(最多)🏆 · 1958/1962/1970/1994/2002',color:'#009c3b',sc:'champion',desc:'桑巴军团重新崛起，新一代天才球员担纲，冲击六星'},
{//3
name:'英格兰',flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',rank:'FIFA #4',cats:['champion'],stars:'贝林厄姆、凯恩(可能)、福登、萨卡',strength:{a:4.5,m:4,s:4,o:4.5},
history:'1次冠军(1966) · 2020欧洲杯亚军',color:'#cf081f',sc:'champion',desc:'黄金一代最均衡阵容，贝林厄姆已成世界级巨星'},
{//4
name:'西班牙',flag:'🇪🇸',rank:'FIFA #5',cats:['strong'],stars:'佩德里、加维、亚马尔、罗德里',strength:{a:3.5,m:5,s:4,o:4},
history:'1次冠军(2010)🏆 · 2024欧洲杯表现亮眼',color:'#aa151b',sc:'strong',desc:'年轻中场天才扎堆，传控足球回归，巴萨皇马合体'},
{//5
name:'德国',flag:'🇩🇪',rank:'FIFA #6',cats:['strong'],stars:'穆西亚拉、维尔茨、哈弗茨、基米希',strength:{a:4,m:4.5,s:3.5,o:4},
history:'4次冠军🏆 · 2014/1990/1974/1954',color:'#000',sc:'strong',desc:'年轻一代复兴，穆西亚拉+维尔茨组合领衔新战车'},
{//6
name:'葡萄牙',flag:'🇵🇹',rank:'FIFA #7',cats:['strong'],stars:'B费、莱奥、B席、鲁本·迪亚斯',strength:{a:4,m:4,s:3.5,o:3.5},
history:'最佳成绩：季军(1966) · 2016欧洲杯冠军',color:'#006600',sc:'strong',desc:'C罗时代落幕，新生代接棒，实力不可小觑'},
{//7
name:'荷兰',flag:'🇳🇱',rank:'FIFA #8',cats:['strong'],stars:'加克波、德容、范迪克、西蒙斯',strength:{a:3.5,m:4,s:4,o:3.5},
history:'3次亚军🥈 · 无冕之王',color:'#f36c21',sc:'strong',desc:'攻守平衡的无冕之王，范迪克领衔铁血防线'},
{//8
name:'美国',flag:'🇺🇸',rank:'FIFA #12',cats:['dark'],stars:'普利西奇、雷纳、麦肯尼、巴洛贡',strength:{a:3,m:3.5,s:3,o:3},
history:'最佳成绩：季军(1930) · 2026东道主',color:'#b31942',sc:'dark',desc:'东道主之一，主场优势+年轻阵容，黑马潜力十足'},
{//9
name:'摩洛哥',flag:'🇲🇦',rank:'FIFA #13',cats:['dark'],stars:'哈基米、恩内斯里、阿姆拉巴特、布努',strength:{a:3,m:3.5,s:4,o:3.5},
history:'2022年第四名🏆 · 非洲首支进四强',color:'#c1272d',sc:'dark',desc:'上届惊喜之师，防守反击+铁血纪律能否再创奇迹？'},
{//10
name:'克罗地亚',flag:'🇭🇷',rank:'FIFA #10',cats:['dark'],stars:'格瓦迪奥尔、莫德里奇(可能)、科瓦契奇',strength:{a:3,m:4,s:3.5,o:3},
history:'2018亚军🥈 · 2022季军🥉',color:'#e60000',sc:'dark',desc:'格子军团铁血精神，莫德里奇的谢幕演出'},
{//11
name:'日本',flag:'🇯🇵',rank:'FIFA #15',cats:['asia'],stars:'三笘薫、久保建英、富安健洋、堂安律',strength:{a:3,m:3.5,s:3,o:3},
history:'4次16强 · 2022击败德国西班牙',color:'#bc002d',sc:'mid',desc:'蓝武士技术细腻，2022年震惊世界，能否突破十六强魔咒？'},
{//12
name:'韩国',flag:'🇰🇷',rank:'FIFA #22',cats:['asia'],stars:'孙兴慜(最后机会)、李刚仁、金玟哉',strength:{a:3,m:3,s:2.5,o:2.5},
history:'2002年四强 · 连续10届参赛',color:'#cd2e3a',sc:'mid',desc:'孙兴慜最后一届世界杯，太极虎韧劲十足'},
];

let activeCat='all';

function render(){
const filtered=activeCat==='all'?TEAMS:TEAMS.filter(t=>t.cats.includes(activeCat));
const labels={champion:'🏆 争冠热门',strong:'⚡ 劲旅',dark:'🐴 黑马',mid:'📊 中游',asia:'🌏 亚洲'};
const progressLabels={a:'进攻',m:'中场',d:'防守',o:'综合'};

document.getElementById('teamList').innerHTML=filtered.map(t=>`
<div class="team-card" style="border-left-color:${t.color}">
<div style="position:absolute;top:12px;right:14px;font-size:.65rem;padding:3px 8px;border-radius:8px;background:rgba(245,158,11,.1);color:var(--accent)">${t.rank}</div>
<div class="team-header">
<div class="team-flag" style="background:${t.color}15">${t.flag}</div>
<div><div class="team-name">${t.name}</div><div class="team-rank">${t.desc}</div></div>
</div>
<div class="stats-row">
<span class="stat-chip stat-${t.sc}">${labels[t.sc]||t.sc}</span>
<span class="stat-chip" style="background:rgba(156,163,175,.1);color:var(--text2)">${t.history}</span>
</div>
<div class="team-stars">⭐ <b>核心球员：</b>${t.stars}</div>
<div style="display:flex;flex-direction:column;gap:4px;margin-top:8px">
${Object.entries(t.strength).map(([k,v])=>`
<div style="display:flex;align-items:center;gap:8px">
<span style="font-size:.65rem;color:var(--text2);width:24px">${progressLabels[k]}</span>
<div style="flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden">
<div style="width:${v/5*100}%;height:100%;border-radius:3px;background:${k==='a'?'var(--red)':k==='m'?'var(--accent)':k==='d'?'var(--blue)':'var(--green)'}"></div>
</div>
<span style="font-size:.65rem;color:var(--text2)">${v}/5</span>
</div>`).join('')}
</div>
</div>`).join('');
}

document.getElementById('tabs').addEventListener('click',e=>{
if(!e.target.classList.contains('tab'))return;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
e.target.classList.add('active');
activeCat=e.target.dataset.c;
render();
});

render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
