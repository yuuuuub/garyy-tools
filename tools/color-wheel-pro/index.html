<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色轮Pro - Color Wheel Pro</title>
<meta name="description" content="专业色轮配色工具，支持多种配色模式选择">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{text-align:center;padding:2rem 1rem;border-bottom:1px solid var(--border)}
.header h1{font-size:1.8rem;margin-bottom:.3rem}
.header p{color:#8b949e;font-size:.9rem}
.container{max-width:1000px;margin:0 auto;padding:1.5rem}
.main-layout{display:flex;gap:2rem;flex-wrap:wrap;justify-content:center}
.wheel-col{flex-shrink:0}
.wheel-wrap{position:relative;width:340px;height:340px}
#colorWheel{width:340px;height:340px;border-radius:50%;cursor:crosshair}
.center-dot{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;border:3px solid #fff;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 6px rgba(0,0,0,.5)}
.controls-col{flex:1;min-width:280px}
.slider-group{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem;margin-bottom:1rem}
.slider-group h3{margin-bottom:1rem;font-size:1rem}
.slider-row{margin-bottom:1rem}
.slider-row label{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.3rem;color:#8b949e}
.slider-row input[type="range"]{width:100%;accent-color:var(--accent)}
.color-values{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem;margin-bottom:1rem}
.color-values h3{margin-bottom:.8rem;font-size:1rem}
.val-row{display:flex;align-items:center;gap:.8rem;margin-bottom:.6rem}
.val-row label{min-width:45px;font-size:.8rem;color:#8b949e}
.val-row input[type="text"]{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.4rem .6rem;color:var(--text);font-family:monospace;font-size:.85rem}
.val-row .copy-btn{background:var(--accent);border:none;color:var(--text);padding:.35rem .6rem;border-radius:6px;cursor:pointer;font-size:.75rem}
.related-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem;margin-bottom:1rem}
.related-section h3{margin-bottom:.8rem;font-size:1rem}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:.6rem}
.related-item{text-align:center;cursor:pointer;transition:transform .2s}
.related-item:hover{transform:scale(1.05)}
.related-swatch{width:100%;aspect-ratio:1;border-radius:8px;border:2px solid var(--border)}
.related-item span{font-size:.65rem;color:#8b949e;margin-top:.2rem;display:block;font-family:monospace}
.palette-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem}
.palette-section h3{margin-bottom:.8rem;font-size:1rem}
.palette-bar{display:flex;border-radius:8px;overflow:hidden;height:48px;margin-bottom:.8rem}
.palette-bar div{flex:1;cursor:pointer;position:relative}
.palette-bar div:hover::after{content:attr(data-hex);position:absolute;bottom:4px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:.1rem .4rem;border-radius:3px;font-size:.6rem;font-family:monospace;white-space:nowrap}
.export-btns{display:flex;gap:.5rem;flex-wrap:wrap}
.export-btn{padding:.4rem .8rem;border-radius:6px;background:var(--bg);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s}
.export-btn:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:700px){.wheel-wrap{width:260px;height:260px}#colorWheel{width:260px;height:260px}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="色轮Pro - Color Wheel Pro">
  <meta property="og:description" content="专业色轮配色工具，支持多种配色模式选择">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/color-wheel-pro/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="header">
<h1>🎨 色轮Pro</h1>
<p>交互式色轮取色器</p>
</div>
<div class="container">
<div class="main-layout">
<div class="wheel-col">
<div class="wheel-wrap">
<canvas id="colorWheel" width="340" height="340"></canvas>
<div class="center-dot" id="centerDot"></div>
</div>
</div>
<div class="controls-col">
<div class="slider-group">
<h2>HSL 调节</h2>
<div class="slider-row"><label>色相 (H) <span id="hVal">217</span>°</label><input type="range" id="hSlider" min="0" max="360" value="217"></div>
<div class="slider-row"><label>饱和度 (S) <span id="sVal">84</span>%</label><input type="range" id="sSlider" min="0" max="100" value="84"></div>
<div class="slider-row"><label>亮度 (L) <span id="lVal">60</span>%</label><input type="range" id="lSlider" min="0" max="100" value="60"></div>
</div>
<div class="color-values">
<h2>颜色值</h2>
<div class="val-row"><label>HEX</label><input type="text" id="hexVal" value="#3B82F6"><button class="copy-btn" onclick="copyVal('hexVal')">复制</button></div>
<div class="val-row"><label>RGB</label><input type="text" id="rgbVal" value="rgb(59, 130, 246)"><button class="copy-btn" onclick="copyVal('rgbVal')">复制</button></div>
<div class="val-row"><label>HSL</label><input type="text" id="hslVal" value="hsl(217, 84%, 60%)"><button class="copy-btn" onclick="copyVal('hslVal')">复制</button></div>
</div>
<div class="related-section">
<h2>关联颜色</h2>
<div class="related-grid" id="relatedGrid"></div>
</div>
<div class="palette-section">
<h2>导出调色板</h2>
<div class="palette-bar" id="paletteBar"></div>
<div class="export-btns">
<button class="export-btn" onclick="exportCSS()">导出 CSS</button>
<button class="export-btn" onclick="exportJSON()">导出 JSON</button>
<button class="export-btn" onclick="exportSCSS()">导出 SCSS</button>
</div>
</div>
</div>
</div>
</div>

<script>
let H=217,S=84,L=60;
const canvas=document.getElementById('colorWheel');
const ctx=canvas.getContext('2d');
const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,r=w/2-8;

function hslToRgb(h,s,l){h/=360;s/=100;l/=100;let r,g,b;if(s===0){r=g=b=l}else{const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;const f=t=>{if(t<0)t+=1;if(t>1)t-=1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p};r=f(h+1/3);g=f(h);b=f(h-1/3)}return[Math.round(r*255),Math.round(g*255),Math.round(b*255)]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()}
function hslToHex(h,s,l){return rgbToHex(...hslToRgb(h,s,l))}

function drawWheel(){
const imgData=ctx.createImageData(w,h);
for(let y=0;y<h;y++){for(let x=0;x<w;x++){
const dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy);
if(dist<=r){
const angle=Math.atan2(dy,dx)*180/Math.PI;const hue=(angle+360)%360;
const sat=Math.min(100,(dist/r)*100);
const rgb=hslToRgb(hue,sat,50);const i=(y*w+x)*4;
imgData.data[i]=rgb[0];imgData.data[i+1]=rgb[1];imgData.data[i+2]=rgb[2];imgData.data[i+3]=255;
}
}}
ctx.putImageData(imgData,0,0);
// Labels
const labels=[{t:'0°',a:0},{t:'60°',a:60},{t:'120°',a:120},{t:'180°',a:180},{t:'240°',a:240},{t:'300°',a:300}];
ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
labels.forEach(l=>{const rad=l.a*Math.PI/180;ctx.fillText(l.t,cx+Math.cos(rad)*(r+16),cy+Math.sin(rad)*(r+16))});
}

function updateDot(){
const rad=H*Math.PI/180;
const dist=(S/100)*r;
const x=cx+Math.cos(rad)*dist;
const y=cy+Math.sin(rad)*dist;
const dot=document.getElementById('centerDot');
dot.style.left=x+'px';dot.style.top=y+'px';
dot.style.background=hslToHex(H,S,L);
}

function updateAll(){
const hex=hslToHex(H,S,L);
const rgb=hslToRgb(H,S,L);
document.getElementById('hVal').textContent=Math.round(H);
document.getElementById('sVal').textContent=Math.round(S);
document.getElementById('lVal').textContent=Math.round(L);
document.getElementById('hexVal').value=hex;
document.getElementById('rgbVal').value=`rgb(${rgb.join(', ')})`;
document.getElementById('hslVal').value=`hsl(${Math.round(H)}, ${Math.round(S)}%, ${Math.round(L)}%)`;
updateDot();
updateRelated();
updatePalette();
}

function updateRelated(){
const grid=document.getElementById('relatedGrid');
const related=[
{h:H,s:S,l:L,name:'当前'},
{h:(H+30)%360,s:S,l:L,name:'+30°'},
{h:(H+60)%360,s:S,l:L,name:'+60°'},
{h:(H+90)%360,s:S,l:L,name:'+90°'},
{h:(H+120)%360,s:S,l:L,name:'+120°'},
{h:(H+180)%360,s:S,l:L,name:'互补'},
{h:H,s:Math.max(0,S-30),l:L,name:'低饱和'},
{h:H,s:Math.min(100,S+30),l:L,name:'高饱和'},
{h:H,s:S,l:Math.max(0,L-20),name:'暗'},
{h:H,s:S,l:Math.min(100,L+20),name:'亮'}
];
grid.innerHTML=related.map(c=>{
const hex=hslToHex(c.h,c.s,c.l);
return`<div class="related-item" onclick="setHSL(${c.h},${c.s},${c.l})"><div class="related-swatch" style="background:${hex}"></div><span>${hex}</span></div>`;
}).join('');
}

function updatePalette(){
const bar=document.getElementById('paletteBar');
const colors=[];
for(let i=0;i<5;i++){
const h=(H+i*72)%360;
colors.push(hslToHex(h,S,L));
}
bar.innerHTML=colors.map(c=>`<div style="background:${c}" data-hex="${c}" onclick="navigator.clipboard.writeText('${c}')"></div>`).join('');
}

function setHSL(h,s,l){H=h;S=s;L=l;document.getElementById('hSlider').value=h;document.getElementById('sSlider').value=s;document.getElementById('lSlider').value=l;updateAll()}

function copyVal(id){navigator.clipboard.writeText(document.getElementById(id).value)}

function exportCSS(){
const colors=[];
for(let i=0;i<5;i++){const h=(H+i*72)%360;colors.push(hslToHex(h,S,L))}
const css=`:root {\n${colors.map((c,i)=>`  --color-${i+1}: ${c};`).join('\n')}\n}`;
navigator.clipboard.writeText(css);showToast('CSS 已复制');
}
function exportJSON(){
const colors=[];
for(let i=0;i<5;i++){const h=(H+i*72)%360;colors.push({hex:hslToHex(h,S,L),hsl:`hsl(${Math.round(h)},${Math.round(S)}%,${Math.round(L)}%)`})}
navigator.clipboard.writeText(JSON.stringify(colors,null,2));showToast('JSON 已复制');
}
function exportSCSS(){
const colors=[];
for(let i=0;i<5;i++){const h=(H+i*72)%360;colors.push(hslToHex(h,S,L))}
const scss=colors.map((c,i)=>`$color-${i+1}: ${c};`).join('\n');
navigator.clipboard.writeText(scss);showToast('SCSS 已复制');
}

function showToast(msg){const n=document.createElement('div');n.textContent=msg;n.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--text);padding:.5rem 1rem;border-radius:8px;font-size:.85rem;z-index:999';document.body.appendChild(n);setTimeout(()=>n.remove(),1500)}

canvas.addEventListener('click',e=>{
const rect=canvas.getBoundingClientRect();
const x=(e.clientX-rect.left)*(w/rect.width),y=(e.clientY-rect.top)*(h/rect.height);
const dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy);
if(dist>r)return;
const angle=Math.atan2(dy,dx)*180/Math.PI;
H=(angle+360)%360;S=Math.min(100,(dist/r)*100);
document.getElementById('hSlider').value=H;
document.getElementById('sSlider').value=S;
updateAll();
});

document.getElementById('hSlider').addEventListener('input',e=>{H=+e.target.value;updateAll()});
document.getElementById('sSlider').addEventListener('input',e=>{S=+e.target.value;updateAll()});
document.getElementById('lSlider').addEventListener('input',e=>{L=+e.target.value;updateAll()});

drawWheel();updateAll();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
