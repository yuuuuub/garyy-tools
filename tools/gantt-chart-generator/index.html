<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>甘特图生成器 - Gantt Chart Generator</title>
<meta name="description" content="在线甘特图生成器，支持任务依赖和进度，快速创建项目甘特图">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='4' width='18' height='5' rx='1' fill='%23e94560'/><rect x='2' y='13' width='12' height='5' rx='1' fill='%230969da'/><rect x='2' y='22' width='22' height='5' rx='1' fill='%231a7f37'/></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--text:#e0e0e0;--text2:#a0a0b0;--accent:#e94560;--accent2:#533483;--border:#2a2a4a;--radius:10px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--surface:#fff;--surface2:#f0f3f6;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#8250df;--border:#d0d7de}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1{font-size:20px;font-weight:700;color:var(--accent);padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.container{display:flex;height:calc(100vh - 56px)}
.sidebar{width:340px;background:var(--surface);border-right:1px solid var(--border);padding:16px;overflow-y:auto;flex-shrink:0}
.main{flex:1;padding:16px;overflow:auto}
label{display:block;font-size:13px;color:var(--text2);margin:8px 0 4px}
input,textarea,select{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:13px;font-family:monospace}
textarea{resize:vertical;min-height:140px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;width:100%;margin-top:12px;transition:var(--transition)}
.btn:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);margin-top:8px}
.btn-outline:hover{background:var(--surface2)}
.toggle-theme{position:fixed;top:16px;right:16px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;z-index:200}
.gantt{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.gantt-header{display:flex;border-bottom:1px solid var(--border);background:var(--surface2);font-size:12px;font-weight:600;position:sticky;top:0;z-index:2}
.gantt-label-col{width:200px;min-width:200px;padding:10px 12px;border-right:1px solid var(--border);color:var(--text2)}
.gantt-chart-col{flex:1;position:relative;overflow-x:auto}
.gantt-days{display:flex;height:32px}
.gantt-day{min-width:40px;text-align:center;padding:8px 0;border-right:1px solid var(--border);font-size:11px;color:var(--text2)}
.gantt-row{display:flex;border-bottom:1px solid var(--border);min-height:40px}
.gantt-row:hover{background:rgba(255,255,255,0.02)}
.gantt-row-label{width:200px;min-width:200px;padding:8px 12px;border-right:1px solid var(--border);font-size:13px;display:flex;align-items:center;gap:6px}
.gantt-row-bars{flex:1;position:relative;height:40px}
.gantt-bar{position:absolute;top:8px;height:24px;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:11px;color:#fff;font-weight:500;cursor:pointer;transition:opacity .2s}
.gantt-bar:hover{opacity:.8}
.gantt-progress{height:100%;border-radius:4px;background:rgba(255,255,255,0.3)}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:1}
</style>
</head>
<body>
<h1>📊 甘特图生成器 Gantt Chart Generator</h1>
<button class="toggle-theme" onclick="toggleTheme()">🌙 / ☀️</button>
<div class="container">
<div class="sidebar">
<label>项目开始日期</label>
<input id="startDate" type="date" value="2025-01-06">
<label>配色方案</label>
<select id="colorScheme">
<option value="rainbow">彩虹色</option>
<option value="warm">暖色系</option>
<option value="cool">冷色系</option>
</select>
<label>任务数据（每行：名称,开始天数,持续天数,进度%,颜色可选）</label>
<textarea id="tasks" rows="10">需求分析,1,5,100,#e94560
UI设计,3,8,80,#0969da
前端开发,8,15,50,#1a7f37
后端开发,8,18,40,#f5a623
接口联调,20,7,20,#8250df
测试,25,8,0,#cf222e
部署上线,30,3,0,#bf8700</textarea>
<button class="btn" onclick="renderGantt()">生成甘特图</button>
<button class="btn btn-outline" onclick="exportPNG()">导出 PNG</button>
</div>
<div class="main" id="ganttMain"></div>
</div>
<script>
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'}
const palettes={rainbow:['#e94560','#0969da','#1a7f37','#f5a623','#8250df','#cf222e','#bf8700','#533483'],warm:['#e94560','#f5a623','#cf222e','#ea6045'],cool:['#0969da','#533483','#1f6feb','#8250df']};
function renderGantt(){
const startStr=document.getElementById('startDate').value;
const startDate=new Date(startStr);
const cs=document.getElementById('colorScheme').value;
const pal=palettes[cs];
const tasks=document.getElementById('tasks').value.trim().split('\n').filter(Boolean).map((l,i)=>{
const p=l.split(/[,，]/);
return{name:p[0]?.trim(),start:+p[1]||1,duration:+p[2]||1,progress:Math.min(100,Math.max(0,+p[3]||0)),color:p[4]?.trim()||pal[i%pal.length]};
});
const maxEnd=Math.max(...tasks.map(t=>t.start+t.duration));
const dayW=40;
let html=`<div class="gantt"><div class="gantt-header"><div class="gantt-label-col">任务名称</div><div class="gantt-chart-col"><div class="gantt-days">`;
for(let d=0;d<maxEnd;d++){
const dt=new Date(startDate);dt.setDate(dt.getDate()+d);
const day=dt.getDate();const month=dt.getMonth()+1;
html+=`<div class="gantt-day">${month}/${day}</div>`;
}
html+=`</div></div></div>`;
tasks.forEach((t,i)=>{
const left=(t.start-1)*dayW;const width=t.duration*dayW;
html+=`<div class="gantt-row"><div class="gantt-row-label"><span style="width:8px;height:8px;border-radius:50%;background:${t.color};flex-shrink:0"></span>${t.name}</div>`;
html+=`<div class="gantt-row-bars"><div class="gantt-bar" style="left:${left}px;width:${width}px;background:${t.color}" title="${t.name}: ${t.progress}%">`;
html+=`<div class="gantt-progress" style="width:${t.progress}%"></div>`;
if(width>40)html+=`<span style="position:relative;z-index:1">${t.progress}%</span>`;
html+=`</div></div></div>`;
});
html+=`</div>`;
document.getElementById('ganttMain').innerHTML=html;
}
function exportPNG(){
const el=document.querySelector('.gantt');
if(typeof html2canvas!=='undefined'){html2canvas(el).then(c=>{const a=document.createElement('a');a.download='gantt-chart.png';a.href=c.toDataURL('image/png');a.click()})}
else{alert('导出需要 html2canvas 库，请按 Ctrl+P 打印为 PDF')}
}
renderGantt();
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
