<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国戏曲经典剧目 - Chinese Opera Classic Stories</title>
<meta name="description" content="中国戏曲经典剧目大全，收录京剧、昆曲、越剧等各大剧种的代表作品与剧情赏析">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国戏曲经典剧目 - Chinese Opera Classic Stories">
<meta property="og:description" content="中国戏曲经典剧目大全，收录京剧、昆曲、越剧等各大剧种的代表作品与剧情赏析">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-opera-stories-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#f59e0b;--accent2:#d97706}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#b45309;--accent2:#92400e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a1000 0%,#2a1a00 50%,#3d2800 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a4000;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#f59e0b,#fbbf24,#d97706,#b45309);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.story-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.story-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.story-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.story-card .st-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.story-card .st-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(245,158,11,0.15);color:var(--accent)}
.story-card .st-name{font-size:1.3em;font-weight:bold}
.story-card .st-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.story-card .st-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.story-card .st-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.story-card .st-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.story-card .st-detail strong{color:var(--text)}
.story-card .st-quote{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;font-size:0.85em;color:var(--accent);font-style:italic}
.story-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.story-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>📖 中国戏曲经典剧目</h1>
<p>Chinese Opera Classic Stories — 品味京剧、昆曲、越剧等各大剧种的传世名作</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索剧目、剧种或人物...（如"霸王别姬""窦娥冤""红楼梦"）" title="Enter键搜索">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="京剧">京剧</button>
<button class="filter-btn" data-filter="昆曲">昆曲</button>
<button class="filter-btn" data-filter="越剧">越剧</button>
<button class="filter-btn" data-filter="黄梅戏">黄梅戏</button>
<button class="filter-btn" data-filter="豫剧">豫剧</button>
<button class="filter-btn" data-filter="川剧">川剧</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="story-grid" id="storyGrid"></div>
</div>
<footer>中国戏曲经典剧目 — 梨园春秋 · 传世名篇 · garyy.top</footer>
<script>
const storyData=[
{name:"霸王别姬",category:"京剧",icon:"⚔️",subtitle:"英雄末路·美人殉情",dynasty:"秦末",author:"梅兰芳代表作",characters:"项羽·虞姬",description:"楚汉争霸末期，项羽被困垓下，四面楚歌。虞姬为项羽舞剑后自刎，项羽突围至乌江自刎。表现英雄末路的悲壮与忠贞爱情。",quote:"「汉兵已略地，四面楚歌声。大王意气尽，贱妾何聊生。」"},
{name:"贵妃醉酒",category:"京剧",icon:"🍷",subtitle:"宫怨深似海",dynasty:"唐代",author:"梅兰芳代表作",characters:"杨玉环·高力士",description:"唐玄宗约杨贵妃百花亭饮宴，却转驾西宫。杨贵妃独酌醉酒，顾影自怜。表现宫廷女子的寂寞与哀怨。",quote:"「海岛冰轮初转腾，见玉兔，玉兔又早东升。」"},
{name:"牡丹亭",category:"昆曲",icon:"🌸",subtitle:"情不知所起",dynasty:"明代",author:"汤显祖",characters:"杜丽娘·柳梦梅",description:"杜丽娘游园后梦中与书生柳梦梅相恋，因情而死，又因情复生。汤显祖以「情」贯穿全剧，被誉为东方《罗密欧与朱丽叶》。",quote:"「情不知所起，一往而深。生者可以死，死可以生。」"},
{name:"窦娥冤",category:"昆曲",icon:"😢",subtitle:"感天动地",dynasty:"元代",author:"关汉卿",characters:"窦娥·张驴儿",description:"窦娥被冤枉杀人，临刑前发三桩誓愿：血溅白练、六月飞雪、亢旱三年。全部应验，昭示冤情。中国古典悲剧的巅峰之作。",quote:"「地也，你不分好歹何为地？天也，你错勘贤愚枉做天！」"},
{name:"红楼梦",category:"越剧",icon:"💔",subtitle:"木石前盟",dynasty:"清代",author:"曹雪芹原著",characters:"贾宝玉·林黛玉",description:"贾宝玉与林黛玉的爱情悲剧，宝黛二人青梅竹马，情投意合，却因家族利益被拆散。黛玉焚稿断痴情，宝玉出家为僧。",quote:"「侬今葬花人笑痴，他年葬侬知是谁？」"},
{name:"天仙配",category:"黄梅戏",icon:"💑",subtitle:"槐荫树下配成双",dynasty:"民间传说",author:"严凤英代表作",characters:"七仙女·董永",description:"七仙女下凡与孝子董永结为夫妻，男耕女织，恩爱有加。后被玉帝拆散，夫妻含恨分离。歌颂忠贞爱情与反抗封建礼教。",quote:"「树上的鸟儿成双对，绿水青山带笑颜。」"},
{name:"女驸马",category:"黄梅戏",icon:"👸",subtitle:"为救李郎离家园",dynasty:"清代",author:"严凤英代表作",characters:"冯素珍·李兆廷",description:"冯素珍为救未婚夫李兆廷，女扮男装进京赶考，高中状元后被招为驸马。最终真相大白，有情人终成眷属。",quote:"「为救李郎离家园，谁料皇榜中状元。」"},
{name:"穆桂英挂帅",category:"京剧",icon:"⚔️",subtitle:"巾帼不让须眉",dynasty:"北宋",author:"梅兰芳代表作",characters:"穆桂英·佘太君",description:"杨门女将穆桂英五十岁挂帅出征，率杨家将奋勇杀敌。表现巾帼英雄的豪迈气概和保家卫国的精神。",quote:"「猛听得金鼓响画角声震，唤起我破天门壮志凌云。」"},
{name:"白蛇传",category:"京剧",icon:"🐍",subtitle:"千年等一回",dynasty:"民间传说",author:"传统剧目",characters:"白素贞·许仙·法海",description:"白蛇精白素贞化为人形与许仙结为夫妻，法海和尚从中作阻，水漫金山后白素贞被压雷峰塔。表现爱情与自由的抗争。",quote:"「西湖山水还依旧，憔悴难对满眼秋。」"},
{name:"梁山伯与祝英台",category:"越剧",icon:"🦋",subtitle:"化蝶双飞",dynasty:"民间传说",author:"袁雪芬代表作",characters:"梁山伯·祝英台",description:"祝英台女扮男装求学，与梁山伯同窗三载。山伯得知真相后提亲已迟，祝英台被迫嫁人。山伯忧郁而死，英台跳坟，二人化蝶双飞。",quote:"「碧草青青花盛开，彩蝶双双久徘徊。」"},
{name:"铡美案",category:"豫剧",icon:"⚖️",subtitle:"包公怒铡陈世美",dynasty:"宋代",author:"传统剧目",characters:"包拯·陈世美·秦香莲",description:"陈世美中状元后抛妻弃子，被招为驸马。秦香莲携子女进京告状，包拯不畏权贵，怒铡陈世美。歌颂正义与清廉。",quote:"「王朝马汉一声喊，包龙图打坐在开封府。」"},
{name:"变脸",category:"川剧",icon:"🎭",subtitle:"瞬息万变",dynasty:"清代",author:"川剧绝活",characters:"各类角色",description:"变脸是川剧独特的表演技艺，演员能在瞬间变换多张脸谱。技法包括扯脸、吹粉、抹脸等，是国家级非物质文化遗产。",quote:"「台上一分钟，台下十年功。」"},
{name:"西厢记",category:"昆曲",icon:"💌",subtitle:"愿天下有情人终成眷属",dynasty:"元代",author:"王实甫",characters:"崔莺莺·张生",description:"崔莺莺与张生在普救寺一见钟情，经过重重阻碍，最终在红娘的帮助下喜结良缘。歌颂自由恋爱，反对封建包办。",quote:"「愿天下有情人终成眷属。」"}
];
function getStats(data){const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});return cats}
function renderStats(data){const stats=getStats(data);document.getElementById('statsOverview').innerHTML=`<div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">经典剧目</div></div>`+Object.entries(stats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}
function renderCards(data){document.getElementById('storyGrid').innerHTML=data.map(m=>`<div class="story-card" data-category="${m.category}"><div class="st-header"><div class="st-icon">${m.icon}</div><div><div class="st-name">${m.name}</div><div class="st-sub">${m.subtitle}</div></div></div><div class="st-meta"><span>${m.category}</span><span>${m.dynasty}</span><span>角色：${m.characters}</span></div><div class="st-detail"><strong>作者/版本：</strong>${m.author}<br><strong>剧情：</strong>${m.description}</div><div class="st-quote">${m.quote}</div></div>`).join('')}
function filterCards(){const q=document.getElementById('searchInput').value.toLowerCase();const f=document.querySelector('.filter-btn.active').dataset.filter;const filtered=storyData.filter(m=>{const matchF=f==='all'||m.category===f;const matchQ=!q||m.name.toLowerCase().includes(q)||m.description.toLowerCase().includes(q)||m.characters.toLowerCase().includes(q);return matchF&&matchQ});renderCards(filtered);renderStats(filtered)}
document.getElementById('searchInput').addEventListener('input',filterCards);
document.getElementById('filterRow').addEventListener('click',e=>{if(e.target.classList.contains('filter-btn')){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');filterCards()}});
renderCards(storyData);renderStats(storyData);
</script>
</body>
</html>
