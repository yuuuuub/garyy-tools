<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国书法练习</title><meta name="description" content="中国书法练习 - 在线练习毛笔书法，多种字体可选"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#d29922;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin:4px}.btn:hover{opacity:.85}.btn.active{background:var(--green)}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.practice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.practice-cell{aspect-ratio:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:3rem;cursor:pointer;transition:all .2s;position:relative}.practice-cell:hover{border-color:var(--blue);transform:scale(1.05)}.practice-cell .pinyin{position:absolute;bottom:4px;font-size:.6rem;color:var(--text2)}.practice-cell .stroke-guide{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.1;font-size:3rem;color:var(--text2)}.font-sample{padding:16px;background:var(--bg);border-radius:8px;text-align:center;margin:8px 0}.font-sample .char{font-size:4rem;line-height:1.2}.font-sample .name{font-size:.85rem;color:var(--text2);margin-top:8px}.strokes-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat-item{background:var(--bg);border-radius:8px;padding:12px;text-align:center}.stat-item .val{font-size:1.5rem;font-weight:700;color:var(--blue)}.stat-item .lbl{font-size:.75rem;color:var(--text2);margin-top:4px}.history-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .2s}.history-item:hover{border-color:var(--blue)}.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center}.modal.show{display:flex}.modal-content{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:400px;width:90%;text-align:center}.modal-content .big-char{font-size:8rem;line-height:1.2;margin:16px 0}.modal-content .detail{color:var(--text2);font-size:.9rem;line-height:1.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="中国书法练习"><meta property="og:description" content="中国书法练习 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖌️</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🖌️ 中国书法练习</h1><p class="sub">在线练习毛笔书法，多种字体可选</p>
<div class="card">
<div class="input-group">
<label>输入练习文字</label>
<input type="text" id="textInput" placeholder="输入要练习的文字..." value="永和九年岁在癸丑">
</div>
<div class="input-group">
<label>选择字体</label>
<select id="fontSelect" onchange="changeFont()">
<option value="serif">宋体（楷书风格）</option>
<option value="kai">楷体</option>
<option value="song">宋体</option>
<option value="hei">黑体</option>
<option value="fangzheng">仿宋</option>
</select>
</div>
<div class="btn-group">
<button class="btn" onclick="generatePractice()">生成练习格</button>
<button class="btn" onclick="randomText()">经典字帖</button>
<button class="btn" onclick="clearAll()">清空</button>
<button class="btn" onclick="showStrokeGuide()">笔画指南</button>
<button class="btn" onclick="printPractice()">打印练习</button>
</div>
</div>
<div class="card">
<h3 style="margin-bottom:12px">练习格</h3>
<div class="practice-grid" id="practiceGrid"></div>
</div>
<div class="card" id="statsCard" style="display:none">
<h3 style="margin-bottom:12px">练习统计</h3>
<div class="strokes-info">
<div class="stat-item"><div class="val" id="totalChars">0</div><div class="lbl">已练习字数</div></div>
<div class="stat-item"><div class="val" id="totalStrokes">0</div><div class="lbl">总笔画数</div></div>
<div class="stat-item"><div class="val" id="uniqueChars">0</div><div class="lbl">不重复字数</div></div>
</div>
</div>
<div id="result"></div>
<div class="modal" id="detailModal" onclick="closeModal()">
<div class="modal-content" onclick="event.stopPropagation()">
<div class="big-char" id="modalChar"></div>
<div class="detail" id="modalDetail"></div>
<button class="btn" onclick="closeModal()" style="margin-top:16px">关闭</button>
</div>
</div></div>
<script src="../i18n.js" defer></script>
<script>
var practiceChars='永和九年岁在癸丑暮春之初会于会稽山阴之兰亭修禊事也群贤毕至少长咸集此地有崇山峻岭茂林修竹又有清流激湍映带左右引以为流觞曲水列坐其次虽无丝竹管弦之盛一觞一咏亦足以畅叙幽情';
var fontStyles={serif:'serif',kai:'"KaiTi","STKaiti","楷体",serif',song:'"SimSun","STSong","宋体",serif',hei:'"SimHei","STHeiti","黑体",sans-serif',fangzheng:'"FangSong","STFangsong","仿宋",serif'};
var currentFont='serif';
var practiceResults=[];
function generatePractice(){
var text=document.getElementById('textInput').value.trim();
if(!text)text=practiceChars.slice(0,16);
var chars=text.split('');
var grid=document.getElementById('practiceGrid');
var html='';
chars.slice(0,16).forEach(function(ch,i){
html+='<div class="practice-cell" onclick="showDetail(\''+ch+'\')" style="font-family:'+fontStyles[currentFont]+'">'+ch+'<span class="stroke-guide">'+ch+'</span></div>';
});
if(chars.length<16){for(var i=chars.length;i<16;i++){html+='<div class="practice-cell" onclick="showDetail(\''+practiceChars[i%practiceChars.length]+'\')" style="font-family:'+fontStyles[currentFont]+'">'+practiceChars[i%practiceChars.length]+'<span class="stroke-guide">'+practiceChars[i%practiceChars.length]+'</span></div>';}
}
grid.innerHTML=html;
updateStats(text);
}
function randomText(){
var texts=['学而时习之不亦说乎','温故而知新可以为师矣','三人行必有我师焉','天行健君子以自强不息','地势坤君子以厚德载物','上善若水水善利万物而不争','知者不惑仁者不忧勇者不惧','路漫漫其修远兮吾将上下而求索','不积跬步无以至千里','博学之审问之慎思之明辨之笃行之'];
var text=texts[Math.floor(Math.random()*texts.length)];
document.getElementById('textInput').value=text;
generatePractice();
}
function changeFont(){currentFont=document.getElementById('fontSelect').value;generatePractice();}
function clearAll(){document.getElementById('practiceGrid').innerHTML='';document.getElementById('statsCard').style.display='none';practiceResults=[];}
function showStrokeGuide(){
var guide='笔画顺序指南：\n横（一）：从左到右\n竖（丨）：从上到下\n撇（丿）：从右上到左下\n捺（㇏）：从左上到右下\n点（丶）：轻按即提\n折（㇕）：横折、竖折等';
alert(guide);
}
function printPractice(){window.print();}
function showDetail(ch){
var strokeCount={'一':1,'二':2,'三':3,'十':2,'人':2,'大':3,'小':3,'上':3,'下':3,'中':4,'日':4,'月':4,'水':4,'火':4,'木':4,'金':8,'土':3,'山':3,'石':5,'田':5,'口':3,'目':5,'耳':6,'手':4,'足':7,'心':4,'天':4,'地':6,'人':2,'日':4,'月':4,'年':6,'在':6,'有':6,'我':7,'他':5,'你':7,'这':7,'那':6,'是':9,'不':4,'的':8,'了':2,'和':8,'与':3,'之':3,'也':3,'矣':7,'乎':5,'者':9,'所':8,'以':4,'其':8,'而':6,'如':6,'若':8,'则':6,'故':9,'因':6,'为':4,'能':10,'得':11,'道':12,'德':15,'仁':4,'义':3,'礼':5,'智':12,'信':9,'学':8,'文':4,'书':4,'画':8,'诗':8,'词':7,'歌':10,'舞':14,'龙':5,'凤':4,'虎':8,'鹤':15};
document.getElementById('modalChar').textContent=ch;
var sc=strokeCount[ch]||Math.floor(Math.random()*8+2);
document.getElementById('modalDetail').innerHTML='<b>'+ch+'</b><br>笔画数：'+sc+'画<br><br>书法要点：<br>1. 注意起笔和收笔<br>2. 笔画要有力有韵<br>3. 结构要匀称<br>4. 多加练习才能写好';
document.getElementById('detailModal').classList.add('show');
}
function closeModal(){document.getElementById('detailModal').classList.remove('show');}
function updateStats(text){
var chars=text.split('');
document.getElementById('totalChars').textContent=chars.length;
var total=0;chars.forEach(function(c){total+=(strokeCountMap[c]||6);});
document.getElementById('totalStrokes').textContent=total;
var unique=[];chars.forEach(function(c){if(unique.indexOf(c)===-1)unique.push(c);});
document.getElementById('uniqueChars').textContent=unique.length;
document.getElementById('statsCard').style.display='block';
}
var strokeCountMap={'一':1,'二':2,'三':3,'十':2,'人':2,'大':3,'小':3,'上':3,'下':3,'中':4,'日':4,'月':4,'水':4,'火':4,'木':4,'金':8,'土':3,'山':3,'石':5,'口':3,'目':5,'耳':6,'手':4,'足':7,'心':4,'天':4,'年':6,'在':6,'有':6,'我':7,'他':5,'不':4,'的':8,'了':2,'和':8,'之':3,'永':5,'岁':6,'癸':9,'丑':4,'暮':15,'春':9,'初':7,'会':6,'于':3,'稽':15,'阴':6,'兰':5,'亭':9,'修':9,'禊':14,'事':8,'也':3,'群':13,'贤':8,'毕':6,'至':6,'少':4,'咸':9,'集':12,'此':6,'地':6,'崇':11,'岭':8,'茂':8,'竹':6,'又':2,'清':11,'流':10,'激':16,'湍':12,'映':9,'带':9,'左':5,'右':5,'引':4,'为':4,'觞':12,'曲':6,'水':4,'列':6,'坐':7,'次':6,'虽':9,'无':4,'丝':5,'竹':6,'管':14,'弦':8,'盛':11,'一':1,'咏':8,'亦':6,'足':7,'畅':14,'叙':9,'幽':9,'情':11,'是':9};
generatePractice();
</script></body></html>
