<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧘 冥想音乐</title>
<meta property="og:title" content="🧘 冥想音乐">
<meta property="og:description" content="🧘 冥想音乐 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线冥想音乐生成器，支持多种冥想背景音，帮助放松和冥想">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧘</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#3b82f6;--green:#238636;--red:#ef4444;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#8b5cf6;--accent2:#7c3aed;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#7c3aed;--accent2:#6d28d9}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.ctn{width:100%;max-width:500px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow)}
header{text-align:center;margin-bottom:24px}
h1{font-size:1.5rem;font-weight:700}
.sub{color:var(--text2);font-size:.85rem;margin-top:4px}
.section{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.section h2{font-size:1rem;margin-bottom:12px;color:var(--accent)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{padding:14px 8px;border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;transition:all .2s;background:var(--card)}
.mode:hover{border-color:var(--accent)}
.mode.active{border-color:var(--accent);background:rgba(139,92,246,.1)}
.mode .icon{font-size:1.6rem;display:block;margin-bottom:4px}
.mode .name{font-size:.8rem;color:var(--text2)}
.mode.active .name{color:var(--accent);font-weight:600}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.slider-row label{font-size:.85rem;color:var(--text2);min-width:60px}
.slider-row input[type="range"]{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--border);outline:none}
.slider-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.slider-row span{font-size:.85rem;color:var(--text);min-width:36px;text-align:right}
.timer-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tbtn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text);font-size:.8rem;cursor:pointer;transition:all .2s}
.tbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ctrls{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-play{background:var(--accent);color:#fff}
.btn-play:hover{background:var(--accent2)}
.btn-play.playing{background:var(--red)}
.btn-stop{background:var(--border);color:var(--text)}
.status{text-align:center;margin-top:12px;font-size:.85rem;color:var(--text2);min-height:20px}
.viz{display:flex;align-items:end;justify-content:center;gap:2px;height:50px;margin-top:12px}
.bar{width:3px;background:var(--accent);border-radius:2px;transition:height .1s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="ctn">
<header><h1>🧘 冥想音乐</h1><p class="sub">选择冥想模式，沉浸式放松</p></header>

<div class="section"><h2>🎵 冥想模式</h2>
<div class="modes" id="modes"></div></div>

<div class="section">
<div class="slider-row"><label>音量</label><input type="range" id="vol" min="0" max="100" value="50" oninput="setVol(this.value)"><span id="volV">50%</span></div>
<div class="slider-row"><label>频率</label><input type="range" id="freq" min="100" max="800" value="432" oninput="setFreq(this.value)"><span id="freqV">432Hz</span></div>
<div class="slider-row"><label>深度</label><input type="range" id="depth" min="0" max="100" value="60" oninput="setDepth(this.value)"><span id="depthV">60%</span></div>
</div>

<div class="section"><h2>⏱ 定时</h2>
<div class="timer-btns" id="timerBtns">
<button class="tbtn active" onclick="setTimer(0,this)">不限</button>
<button class="tbtn" onclick="setTimer(5,this)">5分钟</button>
<button class="tbtn" onclick="setTimer(15,this)">15分钟</button>
<button class="tbtn" onclick="setTimer(30,this)">30分钟</button>
<button class="tbtn" onclick="setTimer(60,this)">1小时</button>
</div></div>

<div class="ctrls">
<button class="btn btn-play" id="playBtn" onclick="toggle()">▶ 播放</button>
<button class="btn btn-stop" onclick="stop()">⏹ 停止</button>
</div>
<div class="viz" id="viz"></div>
<div class="status" id="status">选择模式，点击播放</div>
</div>

<script src="../i18n.js" defer></script>
<script>
const modes=[
  {id:'deep',icon:'🧘',name:'深度冥想',desc:'低频脉冲'},
  {id:'om',icon:'🕉️',name:'Om共鸣',desc:'432Hz'},
  {id:'theta',icon:'🌀',name:'Theta波',desc:'4-8Hz'},
  {id:'alpha',icon:'🌤️',name:'Alpha波',desc:'8-13Hz'},
  {id:'calm',icon:'🌸',name:'平静湖面',desc:'柔和泛音'},
  {id:'tibetan',icon:'🔔',name:'西藏颂钵',desc:'金属共鸣'},
  {id:'rain',icon:'🌧️',name:'雨声冥想',desc:'白噪雨声'},
  {id:'space',icon:'🌌',name:'太空冥想',desc:'深空回响'},
  {id:'forest',icon:'🌲',name:'森林冥想',desc:'自然环境'}
];

let actx=null,gain=null,playing=false,current='deep',timerId=null,timerMin=0;
let oscillators=[],noiseNode=null;

const $=id=>document.getElementById(id);

function initModes(){
  const g=$('modes');
  modes.forEach((m,i)=>{
    const d=document.createElement('div');
    d.className='mode'+(i===0?' active':'');
    d.innerHTML=`<span class="icon">${m.icon}</span><span class="name">${m.name}</span>`;
    d.onclick=()=>{current=m.id;g.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));d.classList.add('active');if(playing){stop();toggle();}};
    g.appendChild(d);
  });
}

function initViz(){const v=$('viz');for(let i=0;i<32;i++){const b=document.createElement('div');b.className='bar';b.style.height='2px';v.appendChild(b);}}

function setVol(v){$('volV').textContent=v+'%';if(gain)gain.gain.value=v/100;}
function setFreq(v){$('freqV').textContent=v+'Hz';}
function setDepth(v){$('depthV').textContent=v+'%';}
function setTimer(m,t){timerMin=m;document.querySelectorAll('.tbtn').forEach(x=>x.classList.remove('active'));t.classList.add('active');}

function createNoise(ctx){
  const len=ctx.sampleRate*2;
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
  const src=ctx.createBufferSource();
  src.buffer=buf;src.loop=true;
  return src;
}

function setupAudio(){
  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  gain=actx.createGain();
  gain.gain.value=$('vol').value/100;
  gain.connect(actx.destination);
  const depth=$('depth').value/100;
  const freq=+$('freq').value;

  switch(current){
    case'deep':{
      const o1=actx.createOscillator();o1.type='sine';o1.frequency.value=freq/4;
      const o2=actx.createOscillator();o2.type='sine';o2.frequency.value=freq/4+4;
      const lfo=actx.createOscillator();lfo.type='sine';lfo.frequency.value=0.1*depth;
      const lfoG=actx.createGain();lfoG.gain.value=20;
      lfo.connect(lfoG);lfoG.connect(o1.frequency);
      o1.connect(gain);o2.connect(gain);
      oscillators=[o1,o2,lfo];
      break;
    }
    case'om':{
      const o=actx.createOscillator();o.type='sine';o.frequency.value=freq;
      const o2=actx.createOscillator();o2.type='sine';o2.frequency.value=freq*2;
      const g2=actx.createGain();g2.gain.value=0.3;
      o.connect(gain);o2.connect(g2);g2.connect(gain);
      oscillators=[o,o2];
      break;
    }
    case'theta':{
      const o=actx.createOscillator();o.type='sine';o.frequency.value=200;
      const lfo=actx.createOscillator();lfo.type='sine';lfo.frequency.value=6*depth;
      const lfoG=actx.createGain();lfoG.gain.value=80;
      lfo.connect(lfoG);lfoG.connect(o.frequency);
      o.connect(gain);
      oscillators=[o,lfo];
      break;
    }
    case'alpha':{
      const o=actx.createOscillator();o.type='sine';o.frequency.value=300;
      const lfo=actx.createOscillator();lfo.type='sine';lfo.frequency.value=10*depth;
      const lfoG=actx.createGain();lfoG.gain.value=100;
      lfo.connect(lfoG);lfoG.connect(o.frequency);
      o.connect(gain);
      oscillators=[o,lfo];
      break;
    }
    case'calm':{
      for(let i=0;i<5;i++){
        const o=actx.createOscillator();o.type='sine';
        o.frequency.value=freq*(1+i*0.5);
        const g=actx.createGain();g.gain.value=0.15/(i+1);
        o.connect(g);g.connect(gain);
        oscillators.push(o);
      }
      break;
    }
    case'tibetan':{
      [196,261.63,329.63,392].forEach((f,i)=>{
        const o=actx.createOscillator();o.type='sine';o.frequency.value=f;
        const g=actx.createGain();g.gain.value=0.2;
        o.connect(g);g.connect(gain);
        oscillators.push(o);
      });
      break;
    }
    case'rain':{
      noiseNode=createNoise(actx);
      const flt=actx.createBiquadFilter();flt.type='lowpass';flt.frequency.value=2000*depth;
      noiseNode.connect(flt);flt.connect(gain);
      break;
    }
    case'space':{
      const o=actx.createOscillator();o.type='sine';o.frequency.value=80;
      const lfo=actx.createOscillator();lfo.type='sine';lfo.frequency.value=0.05;
      const lfoG=actx.createGain();lfoG.gain.value=30;
      lfo.connect(lfoG);lfoG.connect(o.frequency);
      o.connect(gain);
      oscillators=[o,lfo];
      break;
    }
    case'forest':{
      noiseNode=createNoise(actx);
      const flt=actx.createBiquadFilter();flt.type='bandpass';flt.frequency.value=3000;flt.Q.value=0.5;
      noiseNode.connect(flt);flt.connect(gain);
      const o=actx.createOscillator();o.type='sine';o.frequency.value=2000;
      const lfo=actx.createOscillator();lfo.type='sine';lfo.frequency.value=3*depth;
      const lfoG=actx.createGain();lfoG.gain.value=500;
      lfo.connect(lfoG);lfoG.connect(o.frequency);
      const g2=actx.createGain();g2.gain.value=0.05;
      o.connect(g2);g2.connect(gain);
      oscillators=[o,lfo];
      break;
    }
  }
  oscillators.forEach(o=>{try{o.start();}catch(e){}});
  if(noiseNode)try{noiseNode.start();}catch(e){}
}

function toggle(){
  if(playing){stop();return;}
  setupAudio();playing=true;
  $('playBtn').textContent='⏸ 暂停';$('playBtn').classList.add('playing');
  $('status').textContent='正在播放：'+modes.find(m=>m.id===current).name;
  animateViz();
  if(timerMin>0){timerId=setTimeout(()=>{stop();$('status').textContent='定时结束';},timerMin*60000);}
}

function stop(){
  if(!playing)return;
  oscillators.forEach(o=>{try{o.stop();}catch(e){}});
  oscillators=[];
  if(noiseNode){try{noiseNode.stop();}catch(e){}noiseNode=null;}
  if(gain){gain.disconnect();gain=null;}
  playing=false;
  $('playBtn').textContent='▶ 播放';$('playBtn').classList.remove('playing');
  $('status').textContent='已停止';
  if(timerId){clearTimeout(timerId);timerId=null;}
  document.querySelectorAll('.bar').forEach(b=>b.style.height='2px');
}

function animateViz(){
  if(!playing)return;
  const bars=document.querySelectorAll('.bar');
  bars.forEach(b=>{b.style.height=(Math.random()*40+4)+'px';});
  requestAnimationFrame(()=>setTimeout(animateViz,100));
}

initModes();initViz();
</script>
</body>
</html>
