<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕐 时间块规划</title>
<meta name="description" content="时间块规划器，将一天划分为专注时间段，提升工作效率">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=time],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}
select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.timeline{position:relative;padding-left:30px}
.timeline::before{content:'';position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--border)}
.tb{position:relative;margin-bottom:12px;padding:12px 16px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);transition:all .2s}
.tb::before{content:'';position:absolute;left:-22px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tb.active::before{background:var(--success);box-shadow:0 0 8px var(--success)}
.tb.done{opacity:.5}
.tb .time{font-size:.8rem;color:var(--accent);font-weight:600}
.tb .task{font-weight:600;margin:4px 0}
.tb .cat{font-size:.75rem;padding:2px 8px;border-radius:12px;display:inline-block}
.tb .actions{display:flex;gap:6px;margin-top:8px}
.tb .actions button{padding:4px 10px;font-size:.75rem}
.cat-work{background:rgba(59,130,246,.15);color:var(--accent)}
.cat-study{background:rgba(139,92,246,.15);color:#8b5cf6}
.cat-exercise{background:rgba(34,197,94,.15);color:var(--success)}
.cat-rest{background:rgba(245,158,11,.15);color:var(--warn)}
.cat-other{background:rgba(107,114,128,.15);color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕐</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🕐 时间块规划">
<meta property="og:description" content="时间块规划器，将一天划分为专注时间段">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🕐 时间块规划</h1><p>将一天划分为专注时间段，提升效率</p></div>

<div class="cd"><h2>添加时间块</h2>
<input type="text" id="taskInput" placeholder="任务名称" onkeydown="if(event.key==='Enter')addBlock()">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<div><label>开始时间</label><input type="time" id="startTime" value="09:00"></div>
<div><label>结束时间</label><input type="time" id="endTime" value="10:00"></div>
</div>
<label>分类</label>
<select id="category">
<option value="work">💼 工作</option>
<option value="study">📚 学习</option>
<option value="exercise">🏃 运动</option>
<option value="rest">☕ 休息</option>
<option value="other">📌 其他</option>
</select>
<div class="bg"><button onclick="addBlock()">添加时间块</button><button class="sec" onclick="loadTemplate()">加载模板</button></div></div>

<div class="cd"><h2>今日时间线</h2>
<div id="timeline" class="timeline"></div></div>

<div class="cd"><h2>统计</h2>
<div class="gr" id="stats"></div>
<div class="bg"><button class="sec" onclick="clearAll()">清空全部</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let blocks=JSON.parse(localStorage.getItem('tb_blocks')||'[]');

function addBlock(){
  const text=$('taskInput').value.trim();
  const start=$('startTime').value;
  const end=$('endTime').value;
  const cat=$('category').value;
  if(!text||!start||!end){alert('请填写完整信息');return;}
  blocks.push({id:Date.now(),text,start,end,cat,done:false});
  blocks.sort((a,b)=>a.start.localeCompare(b.start));
  save();render();$('taskInput').value='';
}

function toggleDone(id){const b=blocks.find(x=>x.id===id);if(b){b.done=!b.done;save();render();}}
function deleteBlock(id){blocks=blocks.filter(x=>x.id!==id);save();render();}
function clearAll(){blocks=[];save();render();}
function save(){localStorage.setItem('tb_blocks',JSON.stringify(blocks));}

function loadTemplate(){
  blocks=[
    {id:1,text:'早起准备',start:'07:00',end:'07:30',cat:'other',done:false},
    {id:2,text:'晨间运动',start:'07:30',end:'08:00',cat:'exercise',done:false},
    {id:3,text:'深度工作',start:'09:00',end:'11:30',cat:'work',done:false},
    {id:4,text:'午餐休息',start:'12:00',end:'13:00',cat:'rest',done:false},
    {id:5,text:'学习提升',start:'14:00',end:'16:00',cat:'study',done:false},
    {id:6,text:'协作沟通',start:'16:00',end:'17:30',cat:'work',done:false},
    {id:7,text:'复盘总结',start:'18:00',end:'18:30',cat:'other',done:false},
  ];
  save();render();
}

function getCatLabel(cat){return{work:'💼 工作',study:'📚 学习',exercise:'🏃 运动',rest:'☕ 休息',other:'📌 其他'}[cat]||cat;}
function getCatClass(cat){return'cat-'+cat;}

function isCurrentBlock(b){
  const now=new Date();
  const hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  return hm>=b.start&&hm<b.end&&!b.done;
}

function render(){
  if(!blocks.length){$('timeline').innerHTML='<div class="es">暂无时间块，点击"加载模板"快速开始</div>';renderStats();return;}
  $('timeline').innerHTML=blocks.map(b=>{
    const active=isCurrentBlock(b);
    return`<div class="tb ${b.done?'done':''} ${active?'active':''}">
      <div class="time">${b.start} - ${b.end}</div>
      <div class="task">${b.done?'<s>':' '}${b.text}${b.done?'</s>':' '}</div>
      <span class="cat ${getCatClass(b.cat)}">${getCatLabel(b.cat)}</span>
      <div class="actions">
        <button onclick="toggleDone(${b.id})">${b.done?'撤销':'完成'}</button>
        <button class="dng" onclick="deleteBlock(${b.id})">删除</button>
      </div>
    </div>`;
  }).join('');
  renderStats();
}

function renderStats(){
  const total=blocks.length,done=blocks.filter(b=>b.done).length;
  const minutes=blocks.reduce((s,b)=>{
    const [sh,sm]=b.start.split(':').map(Number);
    const [eh,em]=b.end.split(':').map(Number);
    return s+(eh*60+em-sh*60-sm);
  },0);
  const cats={};
  blocks.forEach(b=>{cats[b.cat]=(cats[b.cat]||0)+1;});
  $('stats').innerHTML=`
    <div class="st"><div class="nm">${total}</div><div class="lb">总时间块</div></div>
    <div class="st"><div class="nm" style="color:var(--success)">${done}</div><div class="lb">已完成</div></div>
    <div class="st"><div class="nm" style="color:var(--warn)">${Math.floor(minutes/60)}h${minutes%60}m</div><div class="lb">总时长</div></div>
    <div class="st"><div class="nm" style="color:var(--accent)">${total-done}</div><div class="lb">待完成</div></div>`;
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
