(function(){
const themeToggle = document.getElementById('themeToggle');
const saved = localStorage.getItem('todo-in-history-theme');
if (saved === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  themeToggle.textContent = '☀️';
}
themeToggle.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = '🌙';
    localStorage.setItem('todo-in-history-theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeToggle.textContent = '☀️';
    localStorage.setItem('todo-in-history-theme', 'dark');
  }
});
function getToday() {
  const now = new Date();
  return { month: now.getMonth() + 1, day: now.getDate() };
}
function formatDate(m, d) {
  const mStr = String(m).padStart(2, '0');
  const dStr = String(d).padStart(2, '0');
  return { key: mStr + '-' + dStr, display: m + '月' + d + '日' };
}
let currentFilter = 'all';
let currentDate = getToday();
const eventMap = {};
EVENTS.forEach(e => {
  if (!eventMap[e[0]]) eventMap[e[0]] = [];
  eventMap[e[0]].push({ title: e[1], category: e[2] });
});
function render() {
  const fd = formatDate(currentDate.month, currentDate.day);
  document.getElementById('dateDisplay').textContent = fd.display + ' 的历史';
  const datePicker = document.getElementById('datePicker');
  const year = new Date().getFullYear();
  datePicker.value = year + '-' + fd.key;
  const events = eventMap[fd.key] || [];
  const filtered = currentFilter === 'all'
    ? events
    : events.filter(e => e.category === currentFilter);
  const container = document.getElementById('eventList');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📖</div><p>暂无该日期的历史记录</p></div>';
    return;
  }
  const catIcons = { '事件': '📰', '名人诞辰': '🎂', '名人逝世': '🕊️' };
  const tagClass = { '事件': 'tag-event', '名人诞辰': 'tag-birth', '名人逝世': 'tag-death' };
  let html = '<div class="stats">共 ' + filtered.length + ' 条记录</div>';
  filtered.forEach(e => {
    html += '<div class="event-card ' + tagClass[e.category] + '">';
    html += '<div class="card-header">';
    html += '<span class="card-title">' + catIcons[e.category] + ' ' + e.title + '</span>';
    html += '<span class="card-tag ' + tagClass[e.category] + '">' + e.category + '</span>';
    html += '</div></div>';
  });
  container.innerHTML = html;
}
document.getElementById('datePicker').addEventListener('change', function(e) {
  if (!e.target.value) return;
  const parts = e.target.value.split('-');
  currentDate = { month: parseInt(parts[1], 10), day: parseInt(parts[2], 10) };
  render();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  currentDate = getToday();
  render();
});
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    render();
  });
});
render();
})();
</script>
