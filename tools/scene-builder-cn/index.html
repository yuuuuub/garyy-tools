<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏞️ 场景搭建工具</title>
<meta property="og:title" content="🏞️ 场景搭建工具">
<meta property="og:description" content="🏞️ 场景搭建工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
    <meta name="description" content="创建和编辑场景的可视化搭建工具">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏞️</text></svg>">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #334155;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #8b5cf6;
            --border: #475569;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --radius: 12px;
            --transition: 0.25s ease;
        }
        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --text: #1e293b;
            --text-secondary: #64748b;
            --accent: #8b5cf6;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif,'PingFang SC','Noto Sans SC',sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 { font-size: 1.5rem; }
        .theme-toggle {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text);
        }
        .section { margin-bottom: 16px; }
        .section-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        .btn:hover { opacity: 0.85; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-danger { background: #ef4444; }
        .btn-small { padding: 4px 8px; font-size: 0.75rem; }
        .bg-presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .bg-preset {
            padding: 6px 12px;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 0.8rem;
            background: var(--surface-2);
            color: var(--text);
            transition: var(--transition);
        }
        .bg-preset.active { border-color: var(--accent); }
        .elements-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .element-btn {
            width: 48px;
            height: 48px;
            font-size: 1.5rem;
            border-radius: 8px;
            border: 2px solid var(--border);
            background: var(--surface-2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .element-btn:hover { border-color: var(--accent); }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: crosshair;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .controls-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .slider-group label { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; }
        input[type="range"] {
            -webkit-appearance: none;
            background: var(--surface-2);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }
        .weather-btns {
            display: flex;
            gap: 6px;
        }
        .weather-btn {
            width: 36px;
            height: 36px;
            font-size: 1.1rem;
            border-radius: 6px;
            border: 2px solid var(--border);
            background: var(--surface-2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .weather-btn.active { border-color: var(--accent); background: var(--accent); }
        .layers-panel {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-2);
        }
        .layer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }
        .layer-item:last-child { border-bottom: none; }
        .layer-item .emoji { font-size: 1.2rem; }
        .layer-item .name { flex: 1; }
        .layer-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 2px;
            color: var(--text-secondary);
        }
        .layer-btn:hover { color: var(--text); }
        .action-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
    
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>🏞️ 场景搭建工具</h1>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <div class="section">
        <div class="section-title">背景预设</div>
        <div class="bg-presets" id="bgPresets"></div>
    </div>

    <div class="section">
        <div class="section-title">添加元素</div>
        <div class="elements-grid" id="elementsGrid"></div>
    </div>

    <div class="section">
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="sceneCanvas"></canvas>
        </div>
    </div>

    <div class="controls-row">
        <div class="slider-group">
            <label>时间</label>
            <input type="range" id="timeSlider" min="0" max="100" value="50">
        </div>
        <div class="slider-group">
            <label>天气</label>
            <div class="weather-btns" id="weatherBtns"></div>
        </div>
    </div>

    <div class="controls-row">
        <div class="slider-group">
            <label>大小</label>
            <select id="sizeSelect" style="background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;">
                <option value="small">小 (S)</option>
                <option value="medium" selected>中 (M)</option>
                <option value="large">大 (L)</option>
            </select>
        </div>
    </div>

    <div class="section">
        <div class="section-title">图层管理</div>
        <div class="layers-panel" id="layersPanel"></div>
    </div>

    <div class="action-bar">
        <button class="btn btn-outline" onclick="undo()">↩️ 撤销</button>
        <button class="btn btn-outline" onclick="clearScene()">🗑️ 清空</button>
        <button class="btn" onclick="exportPNG()">📸 导出PNG</button>
        <button class="btn btn-outline" onclick="exportJSON()">💾 导出JSON</button>
        <button class="btn btn-outline" onclick="importJSON()">📂 导入JSON</button>
    </div>
</div>

<script>
const canvas = document.getElementById('sceneCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvasWrapper');

const backgrounds = [
    { name: '天空渐变', type: 'sky' },
    { name: '星空', type: 'stars' },
    { name: '日落', type: 'sunset' },
    { name: '森林', type: 'forest' },
    { name: '城市', type: 'city' },
    { name: '海洋', type: 'ocean' },
    { name: '沙漠', type: 'desert' }
];

const elementTypes = [
    { emoji: '🌲', name: '松树' },
    { emoji: '🌳', name: '大树' },
    { emoji: '🏠', name: '房子' },
    { emoji: '🏔️', name: '山' },
    { emoji: '☁️', name: '云' },
    { emoji: '🌙', name: '月亮' },
    { emoji: '⭐', name: '星星' },
    { emoji: '🌅', name: '日出' },
    { emoji: '🌊', name: '海浪' }
];

const weatherTypes = [
    { emoji: '☀️', name: '晴' },
    { emoji: '🌤️', name: '多云' },
    { emoji: '⛅', name: '阴' },
    { emoji: '🌧️', name: '雨' },
    { emoji: '❄️', name: '雪' }
];

let state = {
    bg: 'sky',
    time: 50,
    weather: 'sunny',
    elements: [],
    selectedId: null,
    history: []
};

let drag = { active: false, offsetX: 0, offsetY: 0, id: null };
let particles = [];

function init() {
    resizeCanvas();
    renderBgPresets();
    renderElements();
    renderWeatherBtns();
    renderLayers();
    draw();
    requestAnimationFrame(animateParticles);
}

function resizeCanvas() {
    const w = wrapper.clientWidth;
    const h = Math.round(w * 9 / 16);
    canvas.width = w * 2;
    canvas.height = h * 2;
    canvas.style.height = h + 'px';
}

function renderBgPresets() {
    const el = document.getElementById('bgPresets');
    el.innerHTML = backgrounds.map(b =>
        `<button class="bg-preset ${state.bg === b.type ? 'active' : ''}" onclick="setBg('${b.type}')">${b.name}</button>`
    ).join('');
}

function renderElements() {
    const el = document.getElementById('elementsGrid');
    el.innerHTML = elementTypes.map(e =>
        `<button class="element-btn" title="${e.name}" onclick="addElement('${e.emoji}')">${e.emoji}</button>`
    ).join('');
}

function renderWeatherBtns() {
    const el = document.getElementById('weatherBtns');
    el.innerHTML = weatherTypes.map(w =>
        `<button class="weather-btn ${state.weather === w.type ? 'active' : ''}" onclick="setWeather('${w.type}')" title="${w.name}">${w.emoji}</button>`
    ).join('');
}

function renderLayers() {
    const el = document.getElementById('layersPanel');
    if (state.elements.length === 0) {
        el.innerHTML = '<div style="padding:12px;text-align:center;color:var(--text-secondary);font-size:0.8rem;">暂无元素</div>';
        return;
    }
    el.innerHTML = state.elements.map((e, i) => `
        <div class="layer-item" style="${state.selectedId === e.id ? 'background:var(--accent);color:white;' : ''}">
            <span class="emoji">${e.emoji}</span>
            <span class="name">${e.name}</span>
            <button class="layer-btn" onclick="toggleVisibility(${i})" title="可见性">${e.visible ? '👁️' : '🚫'}</button>
            <button class="layer-btn" onclick="moveLayer(${i}, -1)" title="上移">⬆️</button>
            <button class="layer-btn" onclick="moveLayer(${i}, 1)" title="下移">⬇️</button>
            <button class="layer-btn" onclick="removeElement(${i})" title="删除">❌</button>
        </div>
    `).join('');
}

function saveState() {
    state.history.push(JSON.stringify(state.elements));
    if (state.history.length > 50) state.history.shift();
}

function setBg(type) {
    state.bg = type;
    renderBgPresets();
    draw();
}

function setWeather(type) {
    state.weather = type;
    particles = [];
    renderWeatherBtns();
    draw();
}

function addElement(emoji) {
    saveState();
    const sizeMap = { small: 24, medium: 40, large: 64 };
    const size = sizeMap[document.getElementById('sizeSelect').value];
    const nameMap = {};
    elementTypes.forEach(e => nameMap[e.emoji] = e.name);
    state.elements.push({
        id: Date.now(),
        emoji,
        name: nameMap[emoji] || '元素',
        x: canvas.width / 4,
        y: canvas.height / 2,
        size,
        visible: true
    });
    state.selectedId = state.elements[state.elements.length - 1].id;
    renderLayers();
    draw();
}

function removeElement(index) {
    saveState();
    state.elements.splice(index, 1);
    state.selectedId = null;
    renderLayers();
    draw();
}

function toggleVisibility(index) {
    state.elements[index].visible = !state.elements[index].visible;
    renderLayers();
    draw();
}

function moveLayer(index, dir) {
    const newIndex = index + dir;
    if (newIndex < 0 || newIndex >= state.elements.length) return;
    saveState();
    const temp = state.elements[index];
    state.elements[index] = state.elements[newIndex];
    state.elements[newIndex] = temp;
    renderLayers();
    draw();
}

function undo() {
    if (state.history.length === 0) return;
    state.elements = JSON.parse(state.history.pop());
    state.selectedId = null;
    renderLayers();
    draw();
}

function clearScene() {
    saveState();
    state.elements = [];
    state.selectedId = null;
    particles = [];
    renderLayers();
    draw();
}

function exportPNG() {
    const link = document.createElement('a');
    link.download = '场景.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

function exportJSON() {
    const data = JSON.stringify({ bg: state.bg, time: state.time, weather: state.weather, elements: state.elements }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const link = document.createElement('a');
    link.download = '场景.json';
    link.href = URL.createObjectURL(blob);
    link.click();
}

function importJSON() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const data = JSON.parse(ev.target.result);
                saveState();
                state.bg = data.bg || 'sky';
                state.time = data.time || 50;
                state.weather = data.weather || 'sunny';
                state.elements = data.elements || [];
                document.getElementById('timeSlider').value = state.time;
                renderBgPresets();
                renderWeatherBtns();
                renderLayers();
                draw();
            } catch (err) { alert('文件格式错误'); }
        };
        reader.readAsText(e.target.files[0]);
    };
    input.click();
}

function drawBackground() {
    const time = state.time / 100;
    const w = canvas.width;
    const h = canvas.height;

    if (state.bg === 'sky' || state.bg === 'stars') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        if (time < 0.3) {
            grad.addColorStop(0, '#0a1628');
            grad.addColorStop(1, '#1a365d');
        } else if (time < 0.5) {
            grad.addColorStop(0, '#1e3a5f');
            grad.addColorStop(1, '#87ceeb');
        } else {
            grad.addColorStop(0, '#4a90d9');
            grad.addColorStop(1, '#87ceeb');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        if (state.bg === 'stars' && time < 0.5) {
            for (let i = 0; i < 150; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h * 0.6;
                const r = Math.random() * 2;
                ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.7})`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    } else if (state.bg === 'sunset') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#1a0533');
        grad.addColorStop(0.4, '#c0392b');
        grad.addColorStop(0.6, '#e67e22');
        grad.addColorStop(1, '#f39c12');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
    } else if (state.bg === 'forest') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#1a365d');
        grad.addColorStop(0.5, '#2d5016');
        grad.addColorStop(1, '#1a4001');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 20; i++) {
            const x = Math.random() * w;
            const th = 100 + Math.random() * 200;
            ctx.fillStyle = '#0d2800';
            ctx.beginPath();
            ctx.moveTo(x, h);
            ctx.lineTo(x - th * 0.3, h - th);
            ctx.lineTo(x + th * 0.3, h - th);
            ctx.fill();
        }
    } else if (state.bg === 'city') {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, w, h);
        const grad = ctx.createLinearGradient(0, h * 0.3, 0, h);
        grad.addColorStop(0, '#16213e');
        grad.addColorStop(1, '#0f3460');
        ctx.fillStyle = grad;
        ctx.fillRect(0, h * 0.3, w, h * 0.7);
        for (let i = 0; i < 30; i++) {
            const bw = 20 + Math.random() * 40;
            const bh = 80 + Math.random() * 200;
            const bx = Math.random() * w;
            const by = h - bh;
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(bx, by, bw, bh);
            for (let r = 0; r < bh / 15; r++) {
                for (let c = 0; c < bw / 10; c++) {
                    if (Math.random() > 0.4) {
                        ctx.fillStyle = `rgba(255,255,150,${0.3 + Math.random() * 0.7})`;
                        ctx.fillRect(bx + 4 + c * 10, by + 4 + r * 15, 6, 8);
                    }
                }
            }
        }
    } else if (state.bg === 'ocean') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#1e3a5f');
        grad.addColorStop(0.5, '#2980b9');
        grad.addColorStop(1, '#1a5276');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 8; i++) {
            const y = h * 0.3 + i * (h * 0.09);
            ctx.strokeStyle = `rgba(255,255,255,${0.1 + i * 0.03})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = 0; x < w; x += 4) {
                ctx.lineTo(x, y + Math.sin(x * 0.02 + i * 0.5 + Date.now() * 0.001) * 10);
            }
            ctx.stroke();
        }
    } else if (state.bg === 'desert') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#f0c27f');
        grad.addColorStop(0.6, '#d4a653');
        grad.addColorStop(1, '#c2956b');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#b8860b';
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.moveTo(i * w / 5, h);
            ctx.quadraticCurveTo(i * w / 5 + w / 10, h - 60 - Math.random() * 40, (i + 1) * w / 5, h);
            ctx.fill();
        }
    }
}

function generateParticles() {
    if (state.weather === 'sunny' || state.weather === 'partly_cloudy') return;
    const w = canvas.width;
    const h = canvas.height;
    for (let i = 0; i < 3; i++) {
        if (particles.length < 200) {
            particles.push({
                x: Math.random() * w,
                y: -10,
                speed: state.weather === 'snow' ? 1 + Math.random() * 2 : 4 + Math.random() * 4,
                size: state.weather === 'snow' ? 2 + Math.random() * 4 : 1 + Math.random() * 2,
                drift: (Math.random() - 0.5) * 2
            });
        }
    }
}

function animateParticles() {
    if (state.weather === 'rain' || state.weather === 'snow') {
        generateParticles();
        const w = canvas.width;
        const h = canvas.height;
        ctx.fillStyle = state.weather === 'snow' ? 'rgba(255,255,255,0.8)' : 'rgba(150,200,255,0.6)';
        particles = particles.filter(p => p.y < h + 10);
        particles.forEach(p => {
            p.y += p.speed;
            p.x += p.drift;
            ctx.beginPath();
            if (state.weather === 'snow') {
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            } else {
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - 1, p.y + p.size * 3);
            }
            ctx.fill();
        });
    }
    draw();
    requestAnimationFrame(animateParticles);
}

function draw() {
    const w = canvas.width;
    const h = canvas.height;
    drawBackground();

    state.elements.forEach(el => {
        if (!el.visible) return;
        ctx.font = `${el.size}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(el.emoji, el.x, el.y);

        if (state.selectedId === el.id) {
            ctx.strokeStyle = var_accent();
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 4]);
            const pad = el.size * 0.3;
            ctx.strokeRect(el.x - el.size / 2 - pad, el.y - el.size / 2 - pad, el.size + pad * 2, el.size + pad * 2);
            ctx.setLineDash([]);
        }
    });

    if (state.weather === 'cloudy') {
        for (let i = 0; i < 5; i++) {
            ctx.fillStyle = 'rgba(200,200,220,0.3)';
            ctx.beginPath();
            ctx.ellipse(w * 0.2 + i * w * 0.15, h * 0.15 + Math.sin(i) * 30, 60, 30, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function var_accent() {
    return document.documentElement.dataset.theme === 'dark' ? '#8b5cf6' : '#8b5cf6';
}

canvas.addEventListener('mousedown', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    for (let i = state.elements.length - 1; i >= 0; i--) {
        const el = state.elements[i];
        if (!el.visible) continue;
        const pad = el.size * 0.3;
        if (mx > el.x - el.size / 2 - pad && mx < el.x + el.size / 2 + pad &&
            my > el.y - el.size / 2 - pad && my < el.y + el.size / 2 + pad) {
            drag.active = true;
            drag.id = el.id;
            drag.offsetX = mx - el.x;
            drag.offsetY = my - el.y;
            state.selectedId = el.id;
            renderLayers();
            draw();
            return;
        }
    }
    state.selectedId = null;
    renderLayers();
    draw();
});

canvas.addEventListener('mousemove', e => {
    if (!drag.active) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    const el = state.elements.find(el => el.id === drag.id);
    if (el) {
        el.x = mx - drag.offsetX;
        el.y = my - drag.offsetY;
        draw();
    }
});

canvas.addEventListener('mouseup', () => { drag.active = false; });
canvas.addEventListener('mouseleave', () => { drag.active = false; });

document.getElementById('timeSlider').addEventListener('input', e => {
    state.time = parseInt(e.target.value);
    draw();
});

function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.dataset.theme === 'dark';
    html.dataset.theme = isDark ? 'light' : 'dark';
    document.querySelector('.theme-toggle').textContent = isDark ? '🌙' : '☀️';
    draw();
}

window.addEventListener('resize', () => { resizeCanvas(); draw(); });
init();
</script>
