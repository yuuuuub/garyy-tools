<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反应速度</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--success:#22c55e;--error:#ef4444;--wait:#22c55e;--go:#ef4444;--result:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{font-size:1.8rem;margin-bottom:10px;color:var(--accent)}
.area{width:100%;max-width:500px;height:300px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:background 0.2s;user-select:none;margin-bottom:20px;border:2px solid var(--border)}
.area.wait{background:#0d2818;border-color:var(--success)}
.area.ready{background:#2d1515;border-color:var(--error)}
.area.result{background:var(--card);border-color:var(--accent)}
.area .big{font-size:3rem;font-weight:bold}
.area .hint{font-size:1.1rem;margin-top:10px;opacity:0.8}
.info-bar{display:flex;gap:12px;margin-bottom:15px;flex-wrap:wrap;justify-content:center}
.info-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:0.9rem}
.info-item span{color:var(--accent);font-weight:bold}
.history{width:100%;max-width:500px;margin-top:10px}
.history h3{font-size:1rem;color:var(--accent);margin-bottom:8px}
.history-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;margin-bottom:4px;font-size:0.85rem;display:flex;justify-content:space-between}
.btn-row{display:flex;gap:10px;margin-top:10px}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:1rem;cursor:pointer;font-family:inherit}
button:hover{opacity:0.85}
</style>
</head>
<body>
<h1>⚡ 反应速度</h1>
<div class="info-bar">
  <div class="info-item">🏆 最佳: <span id="best">-</span>ms</div>
  <div class="info-item">📊 平均: <span id="avg">-</span>ms</div>
  <div class="info-item">🔄 第 <span id="round">0</span>/5 轮</div>
</div>
<div class="area wait" id="area" onclick="onClick()">
  <div class="big" id="bigText">点击开始</div>
  <div class="hint" id="hintText">测试你的反应速度</div>
</div>
<div class="btn-row">
  <button onclick="resetTest()">🔄 重置</button>
</div>
<script>
let state='idle',times=[],waiting=false,startTime=0,timeouts=[];
const bestKey='rs_best';
let bestTime=parseInt(localStorage.getItem(bestKey)||'0');
if(bestTime)document.getElementById('best').textContent=bestTime;

function clearAll(){timeouts.forEach(t=>clearTimeout(t));timeouts=[];waiting=false}

function onClick(){
  if(state==='idle'||state==='done'){
    startRound();return;
  }
  if(state==='wait'){
    // Clicked too early
    clearAll();state='idle';
    document.getElementById('bigText').textContent='❌ 太早了！';
    document.getElementById('hintText').textContent='点击重试';
    document.getElementById('area').className='area result';
    return;
  }
  if(state==='ready'){
    clearAll();
    const elapsed=Date.now()-startTime;
    times.push(elapsed);
    document.getElementById('bigText').textContent=elapsed+'ms';
    document.getElementById('hintText').textContent=elapsed<200?'🚀 极快!':elapsed<300?'👍 不错!':elapsed<500?'😊 一般':'🐢 加油!';
    document.getElementById('area').className='area result';
    state='done';
    updateStats();
    if(times.length<5){
      timeouts.push(setTimeout(startRound,1500));
    } else {
      document.getElementById('hintText').textContent='完成！点击重新开始';
      state='done';
    }
  }
}

function startRound(){
  state='wait';
  document.getElementById('bigText').textContent='⏳ 等待...';
  document.getElementById('hintText').textContent='当屏幕变红时立即点击！';
  document.getElementById('area').className='area wait';
  document.getElementById('round').textContent=times.length+1;
  const delay=1500+Math.random()*3000;
  timeouts.push(setTimeout(()=>{
    state='ready';
    startTime=Date.now();
    document.getElementById('bigText').textContent='🔴 点击！';
    document.getElementById('hintText').textContent='';
    document.getElementById('area').className='area ready';
  },delay));
}

function updateStats(){
  if(times.length===0)return;
  const best=Math.min(...times);
  const avg=Math.round(times.reduce((a,b)=>a+b,0)/times.length);
  if(!bestTime||best<bestTime){bestTime=best;localStorage.setItem(bestKey,best)}
  document.getElementById('best').textContent=bestTime;
  document.getElementById('avg').textContent=avg;
  renderHistory();
}

function renderHistory(){
  let h=document.querySelector('.history');
  if(!h){h=document.createElement('div');h.className='history';h.innerHTML='<h3>📝 记录</h3><div id="historyList"></div>';document.body.appendChild(h)}
  const el=document.getElementById('historyList')||h.querySelector('div');
  el.innerHTML=times.map((t,i)=>{
    const cls=t<200?'color:var(--success)':t<300?'color:var(--accent)':'color:var(--text)';
    return `<div class="history-item"><span>第${i+1}轮</span><span style="${cls}">${t}ms</span></div>`;
  }).join('');
}

function resetTest(){
  clearAll();times=[];state='idle';
  document.getElementById('bigText').textContent='点击开始';
  document.getElementById('hintText').textContent='测试你的反应速度';
  document.getElementById('area').className='area wait';
  document.getElementById('round').textContent='0';
  document.getElementById('avg').textContent='-';
  const h=document.querySelector('.history');if(h)h.remove();
}
</script>
</body>
</html>
