<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国旅行天气指南 - Chinese Travel Weather Guide</title>
<meta name="description" content="中国旅行天气指南，各大城市四季气候与穿衣建议，选择最佳旅行时间">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国旅行天气指南 - Chinese Travel Weather Guide">
<meta property="og:description" content="中国旅行天气指南，各大城市四季气候与穿衣建议">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#2563eb;--accent2:#1d4ed8}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#2563eb;--accent2:#1d4ed8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#050d1a 0%,#0a1a30 50%,#0f2744 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #1e40af;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#2563eb,#60a5fa,#3b82f6,#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.month-selector{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:24px}
.month-btn{width:60px;height:40px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.month-btn:hover,.month-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(37,99,235,0.08)}
.weather-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.weather-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.weather-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.weather-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.weather-card .w-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.weather-card .w-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(37,99,235,0.15);color:var(--accent)}
.weather-card .w-name{font-size:1.2em;font-weight:bold}
.weather-card .w-region{font-size:0.8em;color:var(--text2);margin-top:2px}
.weather-card .w-temp{display:flex;gap:16px;margin:12px 0;padding:12px;background:var(--bg);border-radius:10px}
.weather-card .w-temp-item{text-align:center;flex:1}
.weather-card .w-temp-item .temp{font-size:1.3em;font-weight:700}
.weather-card .w-temp-item .label{font-size:0.7em;color:var(--text2)}
.weather-card .w-clothing{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.weather-card .w-clothing strong{color:var(--text)}
.weather-card .w-tip{font-size:0.8em;color:var(--accent);margin-top:8px;padding:8px 12px;background:rgba(37,99,235,0.05);border-radius:8px}
.weather-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.weather-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🌤️ 中国旅行天气指南</h1>
<p>Chinese Travel Weather Guide — 知天时，行天下</p>
</header>
<div class="container">
<div class="month-selector" id="monthSelector"></div>
<div class="weather-grid" id="weatherGrid"></div>
<footer><p>🌤️ 中国旅行天气指南 — 随时掌握天气，出行更从容</p></footer>
</div>
<script>
const MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const WEATHER_DATA=[
{id:1,name:"北京",region:"华北",icon:"🏛️",temps:[[-7,2],[-3,6],[5,14],[13,22],[18,29],[23,32],[26,35],[24,33],[18,28],[10,21],[1,10],[-5,4]],clothing:["冬季穿厚羽绒服，室内有暖气","春季早晚温差大，带外套","夏季炎热多雨，防晒防暑","秋季最宜旅行，薄外套即可"],tip:"最佳旅行季节：9-10月秋高气爽"},
{id:2,name:"上海",region:"华东",icon:"🌃",temps:[[1,7],[3,9],[7,14],[12,20],[17,26],[22,29],[26,34],[26,33],[22,29],[16,23],[9,16],[3,9]],clothing:["冬季湿冷，保暖内衣+外套","春季温和，薄毛衣即可","夏季闷热潮湿，注意防暑","秋季凉爽宜人，单层长袖"],tip:"最佳旅行季节：3-5月和9-11月"},
{id:3,name:"广州",region:"华南",icon:"🌺",temps:[[10,18],[12,20],[16,24],[20,27],[24,30],[26,32],[28,34],[28,34],[25,31],[21,27],[15,22],[11,19]],clothing:["冬季轻薄外套即可","春季潮湿多雨，带伞","夏季高温多雨，轻薄透气","秋季温暖舒适，短袖长裤"],tip:"最佳旅行季节：10-12月秋冬干燥"},
{id:4,name:"成都",region:"西南",icon:"🐼",temps:[[3,9],[5,12],[9,17],[14,22],[18,26],[22,28],[24,30],[24,30],[20,26],[15,20],[9,14],[4,10]],clothing:["冬季阴冷潮湿，保暖外套","春季多雾，薄外套+雨具","夏季湿热，注意防暑","秋季天高气爽，最宜出行"],tip:"最佳旅行季节：3-6月和9-11月"},
{id:5,name:"西安",region:"西北",icon:"🏯",temps:[[-4,5],[-1,8],[5,15],[11,21],[16,27],[21,31],[24,33],[23,32],[17,27],[11,20],[4,12],[-2,6]],clothing:["冬季干冷，厚羽绒服","春季风沙较多，带口罩","夏季炎热，注意防晒","秋季凉爽，最佳旅行季"],tip:"最佳旅行季节：3-5月和9-11月"},
{id:6,name:"杭州",region:"华东",icon:"🌅",temps:[[1,8],[3,10],[7,15],[13,21],[18,27],[22,30],[26,34],[26,34],[22,29],[16,23],[9,16],[3,10]],clothing:["冬季湿冷，保暖外套","春季多雨，带伞出行","夏季炎热多梅雨","秋季桂花飘香，最宜游"],tip:"最佳旅行季节：3-5月和9-11月"},
{id:7,name:"拉萨",region:"西藏",icon:"🛕",temps:[[-8,7],[-5,10],[1,14],[5,17],[9,21],[13,24],[15,24],[14,23],[12,21],[6,16],[-1,10],[-6,7]],clothing:["冬季极寒，需专业保暖","春季紫外线强，防晒必备","夏季凉爽，昼夜温差大","秋季干燥，保湿+防晒"],tip:"最佳旅行季节：6-9月，雨季但凉爽"},
{id:8,name:"哈尔滨",region:"东北",icon:"❄️",temps:[[-24,-13],[-20,-8],[-10,2],[1,13],[9,21],[16,26],[20,28],[18,27],[10,21],[1,12],[-10,-1],[-20,-9]],clothing:["冬季极寒！专业羽绒服+暖贴","春季短暂，5月回暖","夏季凉爽宜人，避暑胜地","秋季短暂，9月转凉"],tip:"最佳旅行季节：1-2月冰雪节，7-8月避暑"},
{id:9,name:"昆明",region:"西南",icon:"🌸",temps:[[2,15],[4,18],[8,22],[12,25],[16,27],[18,27],[19,27],[19,27],[17,25],[13,21],[7,17],[3,16]],clothing:["冬季白天温暖，早晚凉","春季百花盛开，薄外套","夏季凉爽如春，无需空调","秋季温和舒适，四季如春"],tip:"最佳旅行季节：四季皆宜，3-10月最佳"},
{id:10,name:"三亚",region:"华南",icon:"🏖️",temps:[[18,26],[19,27],[22,29],[25,31],[27,33],[28,33],[28,33],[28,33],[27,32],[25,30],[22,27],[19,26]],clothing:["冬季短袖+薄外套，避寒圣地","春季温暖宜人，下海游泳","夏季炎热，注意防晒","秋季温暖，台风季需注意"],tip:"最佳旅行季节：11-3月，北方冬季避寒"},
{id:11,name:"丽江",region:"西南",icon:"🏘️",temps:[[0,15],[2,17],[7,20],[10,23],[14,26],[17,27],[18,26],[17,25],[15,23],[10,20],[5,16],[1,15]],clothing:["冬季昼夜温差大，厚外套","春季百花齐放，薄毛衣","夏季凉爽，带件薄外套","秋季色彩斑斓，最宜出行"],tip:"最佳旅行季节：4-5月和9-10月"},
{id:12,name:"青岛",region:"华东",icon:"🌊",temps:[[-2,3],[0,6],[4,11],[9,16],[14,22],[19,25],[23,28],[24,28],[20,25],[14,20],[7,12],[1,6]],clothing:["冬季海风大，保暖外套","春季樱花季，薄外套","夏季凉爽海滨，防晒","秋季金色银杏，最宜游"],tip:"最佳旅行季节：7-9月海滨度假"}
];
let currentMonth=new Date().getMonth();
function renderMonths(){
const el=document.getElementById('monthSelector');
el.innerHTML=MONTHS.map((m,i)=>`<button class="month-btn${i===currentMonth?' active':''}" onclick="setMonth(${i})">${m}</button>`).join('');
}
function setMonth(m){currentMonth=m;renderMonths();render()}
function render(){
const grid=document.getElementById('weatherGrid');
grid.innerHTML='';
WEATHER_DATA.forEach(d=>{
const[low,high]=d.temps[currentMonth];
const seasonIcon=low<-5?'❄️':low<5?'🧥':low<15?'🌸':low<25?'☀️':'🔥';
grid.innerHTML+=`<div class="weather-card"><div class="w-header"><div class="w-icon">${d.icon}</div><div><div class="w-name">${d.name}</div><div class="w-region">${d.region}</div></div></div><div class="w-temp"><div class="w-temp-item"><div class="temp" style="color:var(--accent)">${high}°</div><div class="label">最高温</div></div><div class="w-temp-item"><div class="temp" style="color:var(--text2)">${low}°</div><div class="label">最低温</div></div><div class="w-temp-item"><div class="temp">${seasonIcon}</div><div class="label">穿衣</div></div></div><div class="w-clothing"><strong>穿衣建议：</strong>${d.clothing[currentMonth]}</div><div class="w-tip">${d.tip}</div></div>`;
});
}
renderMonths();
render();
</script>
</body>
</html>
