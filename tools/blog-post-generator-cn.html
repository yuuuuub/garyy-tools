<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="博客文章生成器 - AI辅助生成高质量中文博客内容">
    <meta name="robots" content="index, follow">
    <title>博客文章生成器</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #dee2e6;
            --card-bg: #f8f9fa;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #444444;
            --card-bg: #2d2d2d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 900px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        textarea, input[type="text"], select {
            width: 100%; padding: 10px; border: 1px solid var(--border-color);
            border-radius: 4px; background-color: var(--card-bg); color: var(--text-color);
            font-family: inherit; box-sizing: border-box;
        }
        textarea { resize: vertical; min-height: 80px; }
        button {
            background-color: var(--primary-color); color: white; padding: 10px 20px;
            border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 8px;
        }
        button:hover { opacity: 0.9; }
        .btn-success { background-color: var(--success-color); }
        .btn-danger { background-color: var(--danger-color); }
        .card {
            padding: 20px; border: 1px solid var(--border-color);
            border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px;
        }
        .output { white-space: pre-wrap; font-family: 'Courier New', monospace; line-height: 1.6; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .tag {
            background-color: var(--primary-color); color: white; padding: 4px 12px;
            border-radius: 16px; font-size: 13px; cursor: pointer;
        }
        .tag:hover { opacity: 0.8; }
        .stats { display: flex; gap: 20px; margin-top: 10px; font-size: 14px; color: var(--secondary-color); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .theme-toggle {
            position: fixed; top: 20px; right: 20px; padding: 8px 12px;
            background-color: var(--secondary-color); color: white; border: none;
            border-radius: 4px; cursor: pointer; z-index: 100;
        }
        .copy-btn { background-color: var(--secondary-color); font-size: 14px; padding: 6px 14px; }
        .outline-item { padding: 8px 12px; border-left: 3px solid var(--primary-color); margin-bottom: 8px; background: var(--card-bg); border-radius: 0 4px 4px 0; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>博客文章生成器</h1>
        <div class="card">
            <div class="grid-2">
                <div class="form-group">
                    <label>文章主题</label>
                    <input type="text" id="topic" placeholder="例如：如何提高工作效率">
                </div>
                <div class="form-group">
                    <label>文章类型</label>
                    <select id="postType">
                        <option value="tutorial">教程指南</option>
                        <option value="opinion">观点评论</option>
                        <option value="listicle">清单列表</option>
                        <option value="case-study">案例分析</option>
                        <option value="howto">操作指南</option>
                        <option value="review">产品评测</option>
                    </select>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>目标受众</label>
                    <input type="text" id="audience" placeholder="例如：初级开发者">
                </div>
                <div class="form-group">
                    <label>文章字数</label>
                    <select id="wordCount">
                        <option value="800">800字（短文）</option>
                        <option value="1500" selected>1500字（标准）</option>
                        <option value="2500">2500字（深度）</option>
                        <option value="4000">4000字（长文）</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>核心要点（每行一个）</label>
                <textarea id="keyPoints" rows="4" placeholder="要点1&#10;要点2&#10;要点3"></textarea>
            </div>
            <div class="form-group">
                <label>SEO关键词（逗号分隔）</label>
                <input type="text" id="keywords" placeholder="关键词1, 关键词2, 关键词3">
            </div>
            <button onclick="generatePost()">生成文章</button>
            <button onclick="generateOutline()">仅生成大纲</button>
            <button onclick="generateMeta()">生成SEO摘要</button>
        </div>

        <div id="outlineResult" class="card" style="display:none;">
            <h2>文章大纲</h2>
            <div id="outlineContent" class="output"></div>
            <button class="copy-btn" onclick="copyText('outlineContent')">复制大纲</button>
        </div>

        <div id="postResult" class="card" style="display:none;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <h2>生成的文章</h2>
                <div>
                    <button class="copy-btn" onclick="copyText('postContent')">复制全文</button>
                    <button class="btn-success copy-btn" onclick="downloadPost()">下载Markdown</button>
                </div>
            </div>
            <div class="stats" id="postStats"></div>
            <div id="postContent" class="output" style="margin-top:15px;"></div>
            <div id="suggestedTags" class="tag-list"></div>
        </div>

        <div id="metaResult" class="card" style="display:none;">
            <h2>SEO元数据</h2>
            <div class="form-group">
                <label>Title标签</label>
                <div id="metaTitle" class="output" style="padding:10px;background:var(--bg-color);border-radius:4px;"></div>
            </div>
            <div class="form-group">
                <label>Meta Description</label>
                <div id="metaDesc" class="output" style="padding:10px;background:var(--bg-color);border-radius:4px;"></div>
            </div>
            <div class="form-group">
                <label>OG标签</label>
                <div id="metaOg" class="output" style="padding:10px;background:var(--bg-color);border-radius:4px;"></div>
            </div>
            <button class="copy-btn" onclick="copyMeta()">复制全部</button>
        </div>
    </div>

    <script src="i18n.js" defer></script>
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
        }

        const postTemplates = {
            tutorial: {
                sections: ['引言', '前置准备', '核心概念', '详细步骤', '常见问题', '总结与展望'],
                tone: '专业且友好'
            },
            opinion: {
                sections: ['背景介绍', '核心观点', '论据支撑', '反面分析', '个人观点', '结语'],
                tone: '有理有据'
            },
            listicle: {
                sections: ['引言', '项目列表', '详细说明', '总结推荐'],
                tone: '简洁明了'
            },
            'case-study': {
                sections: ['项目背景', '面临挑战', '解决方案', '实施过程', '成果展示', '经验总结'],
                tone: '数据驱动'
            },
            howto: {
                sections: ['为什么需要', '准备工作', '操作步骤', '进阶技巧', '注意事项', '小结'],
                tone: '手把手教学'
            },
            review: {
                sections: ['产品概述', '功能特点', '使用体验', '优缺点分析', '适用人群', '最终评价'],
                tone: '客观公正'
            }
        };

        function generateOutline() {
            const topic = document.getElementById('topic').value.trim();
            const type = document.getElementById('postType').value;
            if (!topic) { alert('请输入文章主题'); return; }
            const template = postTemplates[type];
            let outline = `📋 文章大纲：${topic}\n\n`;
            outline += `📌 类型：${document.getElementById('postType').selectedOptions[0].text}\n`;
            outline += `🎯 受众：${document.getElementById('audience').value || '通用读者'}\n`;
            outline += `📝 目标字数：${document.getElementById('wordCount').value}字\n`;
            outline += `🎭 语气：${template.tone}\n\n`;
            outline += `--- 大纲结构 ---\n\n`;
            template.sections.forEach((s, i) => {
                outline += `## ${i + 1}. ${s}\n`;
                outline += `   └─ ${getSectionDesc(type, i, topic)}\n\n`;
            });
            document.getElementById('outlineContent').textContent = outline;
            document.getElementById('outlineResult').style.display = 'block';
        }

        function getSectionDesc(type, index, topic) {
            const descs = {
                tutorial: ['引入话题，说明文章价值', '列出所需的工具、知识储备', '解释核心原理和术语', `分步骤讲解如何完成${topic}`, '解答读者可能遇到的问题', '回顾要点，展望未来方向'],
                opinion: ['交代讨论背景', '明确提出核心论点', '用数据或事实支撑观点', '公正分析反对意见', '阐述个人立场和理由', '总结并呼吁行动'],
                listicle: ['引出话题，说明盘点目的', '列出所有推荐项', '逐项详细介绍亮点', '总结推荐理由'],
                'case-study': ['介绍项目和相关方', '描述遇到的具体困难', '阐述采用的解决策略', '详述执行的具体过程', '用数据展示项目成果', '提炼可复用的经验'],
                howto: ['说明学习这个技能的意义', '列出必备条件和工具', '按顺序展示操作流程', '分享进阶提升方法', '提醒容易犯的错误', '鼓励读者动手尝试'],
                review: ['介绍产品基本信息', '列举主要功能和规格', '分享真实使用感受', '客观列出优缺点', '说明适合哪些人使用', '给出最终评分和建议']
            };
            return descs[type]?.[index] || '';
        }

        function generatePost() {
            const topic = document.getElementById('topic').value.trim();
            const type = document.getElementById('postType').value;
            const audience = document.getElementById('audience').value.trim() || '广大读者';
            const wordCount = parseInt(document.getElementById('wordCount').value);
            const keyPoints = document.getElementById('keyPoints').value.split('\n').filter(s => s.trim());
            const keywords = document.getElementById('keywords').value.split(',').map(s => s.trim()).filter(Boolean);

            if (!topic) { alert('请输入文章主题'); return; }
            const template = postTemplates[type];
            let post = `# ${topic}\n\n`;
            post += `> 适合${audience}阅读 | ${template.tone}\n\n`;

            template.sections.forEach((section, i) => {
                post += `## ${section}\n\n`;
                const sectionContent = generateSection(type, i, topic, audience, keyPoints, keywords);
                post += sectionContent + '\n\n';
            });

            if (keywords.length > 0) {
                post += `---\n\n**相关关键词：** ${keywords.join('、')}\n\n`;
            }
            post += `*本文由博客文章生成器辅助创建，仅供参考和启发。*\n`;

            document.getElementById('postContent').textContent = post;
            document.getElementById('postResult').style.display = 'block';
            updateStats(post);

            if (keywords.length > 0) {
                const tagsDiv = document.getElementById('suggestedTags');
                tagsDiv.innerHTML = keywords.map(k => `<span class="tag">${k}</span>`).join('');
            }
            document.getElementById('postResult').scrollIntoView({ behavior: 'smooth' });
        }

        function generateSection(type, index, topic, audience, keyPoints, keywords) {
            const sections = {
                tutorial: [
                    `在当今快速发展的技术环境中，掌握${topic}已经成为许多${audience}的必备技能。无论你是刚刚入门的新手，还是有一定经验的从业者，本文都将为你提供实用的指导和建议。\n\n通过阅读本文，你将了解到：\n${keyPoints.length ? keyPoints.map(p => `- ${p}`).join('\n') : `- ${topic}的核心概念\n- 实际操作的最佳实践\n- 避免常见错误的技巧`}`,
                    `在开始之前，请确保你已经准备好以下内容：\n\n**环境要求：**\n- 基础的计算机操作能力\n- 相关的软件或工具已安装\n- 稳定的网络连接\n\n**建议的前置知识：**\n- 对基本概念有初步了解\n- 有过相关的实践经验（可选但推荐）`,
                    `${topic}的核心在于理解其底层原理和设计思想。下面我们将从几个关键维度来剖析：\n\n**核心概念一：** 基础框架和理论支撑，这是理解整个知识体系的基石。\n\n**核心概念二：** 实际应用场景和最佳实践，理论与实践相结合才能真正掌握。\n\n**核心概念三：** 性能优化和扩展性考虑，这是进阶提升的关键。`,
                    `接下来是具体的操作步骤，每一步都配有详细的说明：\n\n**步骤一：初始化配置**\n首先需要完成基础环境的搭建。这一步非常关键，确保每个参数都按照要求设置。\n\n**步骤二：核心实现**\n在配置完成后，开始核心功能的实现。注意按照最佳实践来组织代码结构。\n\n**步骤三：测试验证**\n完成实现后，务必进行全面的测试验证。建议从单元测试开始，逐步扩展到集成测试。\n\n**步骤四：优化完善**\n根据测试结果进行优化调整，确保最终效果达到预期。`,
                    `在学习和实践过程中，以下是一些常见问题及解决方案：\n\n**Q: 为什么我的配置没有生效？**\nA: 请检查配置文件路径和格式是否正确，确保没有遗漏必要的参数。\n\n**Q: 如何处理性能瓶颈？**\nA: 建议先使用性能分析工具定位瓶颈，然后有针对性地进行优化。\n\n**Q: 有哪些推荐的学习资源？**\nA: 官方文档是最好的起点，社区论坛和开源项目也是非常好的学习渠道。`,
                    `通过本文的学习，你应该已经对${topic}有了系统的认识和实践能力。以下是一些后续建议：\n\n- 持续关注行业动态和最新技术\n- 积极参与社区交流和开源项目\n- 将所学应用到实际项目中\n- 定期回顾和总结经验\n\n希望本文对你有所帮助，欢迎在评论区分享你的学习心得！`
                ],
                opinion: [
                    `近年来，${topic}一直是行业内热议的话题。随着技术的进步和市场的变化，不同的声音和观点层出不穷。本文将从多个角度来分析这一话题，希望能为${audience}提供有价值的参考。\n\n在讨论之前，让我们先了解一下当前的行业背景和基本现状。`,
                    `在深入分析之前，我想先明确提出本文的核心观点：\n\n**关于${topic}，我认为最重要的是要保持理性和全面的视角。**\n\n这个观点基于以下几个方面的考量：\n${keyPoints.length ? keyPoints.map(p => `- ${p}`).join('\n') : '- 事实和数据的支撑\n- 行业趋势的分析\n- 实际案例的验证'}`,
                    `支撑上述观点的论据主要包括以下几个方面：\n\n**论据一：数据说话**\n相关研究表明，在过去几年中，${topic}相关的数据呈现出明显的增长趋势。\n\n**论据二：专家共识**\n行业内多位资深专家对此持相似看法，这在一定程度上验证了观点的可靠性。\n\n**论据三：案例验证**\n多个成功案例表明，按照这一思路执行能够取得显著效果。`,
                    `当然，任何观点都不可能是绝对正确的。我们也需要关注一些不同的声音：\n\n**反对意见一：** 有人认为当前的判断可能过于乐观，忽略了潜在的风险因素。\n\n**反对意见二：** 不同的市场环境和发展阶段可能导致结论有所差异。\n\n这些反对意见同样值得重视，它们提醒我们在执行过程中需要保持灵活性和应变能力。`,
                    `综合以上分析，我的个人看法是：\n\n对于${topic}，我们需要在保持开放心态的同时，坚持用数据和事实来指导决策。既不应该盲目跟风，也不应该固步自封。\n\n最重要的是，每个人和每个组织都需要根据自身的实际情况来做出最适合自己的选择。`,
                    `${topic}是一个持续演变的话题，今天的分析只是基于当前信息的一个切面。希望本文能够激发你的思考，欢迎留言交流不同的看法。\n\n让我们一起关注这个领域的未来发展，共同见证更多的可能性。`
                ],
                listicle: [
                    `${topic}一直是${audience}关注的热点。为了帮助大家更好地了解和选择，我们精心整理了这份清单，涵盖了最新的趋势和最佳实践。\n\n本文将从实用性、创新性和用户体验等多个维度进行评估和推荐。`,
                    `以下是经过我们筛选和评估的精选项目：\n\n${keyPoints.length ? keyPoints.map((p, i) => `### ${i + 1}. ${p}\n\n这是${topic}领域中备受关注的一个方向，具有独特的价值和优势。`).join('\n\n') : '### 1. 经典方案\n\n这是经过时间验证的成熟方案，稳定可靠。\n\n### 2. 创新方案\n\n这是近年来兴起的新方案，具有前瞻性。\n\n### 3. 综合方案\n\n这是兼顾各方面因素的平衡方案。'}`,
                    `每个方案都有其独特的特点：\n\n**方案一亮点：** 经过实践验证，具有很高的可靠性和稳定性，适合对稳定性要求高的场景。\n\n**方案二亮点：** 技术前沿，创新性强，适合追求最新技术的团队。\n\n**方案三亮点：** 综合表现均衡，性价比高，适合大多数场景。`,
                    `总的来说，选择最适合自己的方案需要综合考虑多方面因素。希望这份清单能帮助${audience}做出明智的选择。如果你有更好的推荐，欢迎在评论区分享！`
                ],
                'case-study': [
                    `本文将深入分析一个关于${topic}的典型案例，展示从问题发现到解决方案落地的完整过程。\n\n**项目信息：**\n- 参与方：某知名企业/团队\n- 项目周期：3-6个月\n- 涉及领域：${topic}`,
                    `在项目启动初期，团队面临以下核心挑战：\n\n**挑战一：** 现有方案无法满足快速增长的业务需求，性能瓶颈日益明显。\n\n**挑战二：** 技术债务积累严重，维护成本居高不下。\n\n**挑战三：** 团队对新技术的掌握程度不足，需要快速提升能力。\n\n这些问题相互关联，形成了一个复杂的系统性难题。`,
                    `针对上述挑战，团队制定了以下解决策略：\n\n**策略一：渐进式重构**\n不采用激进的重写方案，而是通过模块化拆分逐步优化。\n\n**策略二：引入最佳实践**\n借鉴行业成功经验，建立标准化的开发流程。\n\n**策略三：能力建设**\n通过培训和结对编程，快速提升团队整体技术水平。`,
                    `实施过程分为三个阶段：\n\n**第一阶段（1-2月）：** 完成基础设施搭建和核心模块重构。\n\n**第二阶段（3-4月）：** 实现主要功能迁移和性能优化。\n\n**第三阶段（5-6月）：** 全面测试、上线和稳定性保障。\n\n每个阶段都设有明确的里程碑和质量检查点。`,
                    `项目完成后，取得了显著的成果：\n\n**性能提升：** 核心指标提升50%以上\n**成本降低：** 运维成本减少30%\n**效率提高：** 开发效率提升40%\n**质量改善：** 线上问题减少60%\n\n这些数据充分证明了方案的有效性。`,
                    `从这个案例中，我们可以提炼出以下可复用的经验：\n\n1. 渐进式改进往往比激进变革更可靠\n2. 数据驱动的决策能够减少主观偏差\n3. 团队能力建设是长期成功的关键\n4. 良好的沟通和协作是项目成功的保障\n\n希望这些经验能为你的项目提供参考。`
                ],
                howto: [
                    `你是否也在寻找${topic}的方法？作为${audience}，掌握这项技能将大大提升你的工作效率和专业能力。\n\n本文将提供一套完整的操作指南，即使你是零基础也能跟着做。`,
                    `在开始之前，请确保准备好以下内容：\n\n**必备条件：**\n${keyPoints.length ? keyPoints.map(p => `- ${p}`).join('\n') : '- 一台联网的电脑\n- 相关软件或工具\n- 约1-2小时的专注时间'}`,
                    `现在开始正式操作，请按照以下步骤逐一执行：\n\n**第1步：环境搭建**\n安装必要的工具和依赖，配置好工作环境。这一步非常重要，直接影响后续操作。\n\n**第2步：基础操作**\n学习和掌握基本操作方法，先从简单的示例开始。\n\n**第3步：进阶应用**\n在掌握基础后，尝试更复杂的应用场景。\n\n**第4步：检查完善**\n对照清单逐项检查，确保每一步都正确完成。`,
                    `当基础操作熟练后，以下技巧可以帮助你更进一步：\n\n- 使用快捷键提高操作效率\n- 批量处理相似任务\n- 自动化重复性工作\n- 利用社区资源解决问题`,
                    `在操作过程中，请注意以下几点：\n\n⚠️ **备份重要数据** - 操作前务必备份\n⚠️ **仔细阅读提示** - 不要跳过确认步骤\n⚠️ **遇到问题先搜索** - 社区通常有解决方案\n⚠️ **保持耐心** - 熟能生巧需要时间`,
                    `恭喜你完成了全部操作！建议你：\n\n1. 立即将所学应用到实际项目中\n2. 记录学习过程中的心得和问题\n3. 分享给同样需要的朋友\n4. 持续关注相关的更新和技巧\n\n实践是最好的老师，祝你学有所成！`
                ],
                review: [
                    `作为${audience}，选择合适的${topic}相关产品/工具至关重要。本文将从多个维度进行全面评测，帮助你做出最佳选择。\n\n**评测声明：** 本评测基于实际使用体验，力求客观公正。`,
                    `首先让我们了解被评测对象的基本信息：\n\n**基本信息：**\n- 名称：${topic}相关产品\n- 版本：最新版\n- 价格：多种方案可选\n- 平台：全平台支持\n\n**主要功能：**\n${keyPoints.length ? keyPoints.map(p => `- ${p}`).join('\n') : '- 核心功能A：满足基础需求\n- 核心功能B：提供高级选项\n- 核心功能C：支持扩展集成'}`,
                    `经过一段时间的深度使用，以下是我的使用体验：\n\n**优点：**\n- 界面设计直观，上手容易\n- 性能表现稳定，响应迅速\n- 文档完善，社区活跃\n- 更新频率高，持续改进\n\n**缺点：**\n- 部分高级功能学习曲线较陡\n- 价格对个人用户偏高\n- 移动端体验有待优化`,
                    `综合来看，该产品在${topic}领域具有较强的竞争力。如果你是追求稳定和专业性的用户，这是一个值得考虑的选择。\n\n**评分：** ⭐⭐⭐⭐ (4/5)\n\n希望这份评测对你有所帮助，欢迎在评论区讨论你的使用体验！`
                ]
            };
            return sections[type]?.[index] || `这里是${section}的具体内容，将根据主题"${topic}"和受众"${audience}"进行详细展开。\n\n本部分内容涵盖了核心要点，旨在为读者提供全面而实用的信息。`;
        }

        function generateMeta() {
            const topic = document.getElementById('topic').value.trim();
            const keywords = document.getElementById('keywords').value.split(',').map(s => s.trim()).filter(Boolean);
            if (!topic) { alert('请输入文章主题'); return; }
            const slug = topic.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '-').toLowerCase();
            document.getElementById('metaTitle').textContent = `${topic} - 完整指南与实践 | 我的博客`;
            document.getElementById('metaDesc').textContent = `深入了解${topic}的核心概念、最佳实践和常见问题解决方案。适合${document.getElementById('audience').value || '广大读者'}的全面指南。`;
            document.getElementById('metaOg').textContent = `<meta property="og:title" content="${topic} - 完整指南">\n<meta property="og:description" content="深入了解${topic}的核心概念和最佳实践">\n<meta property="og:type" content="article">\n<meta property="og:url" content="https://example.com/blog/${slug}">\n${keywords.length ? `<meta property="og:tag" content="${keywords[0]}">` : ''}`;
            document.getElementById('metaResult').style.display = 'block';
            document.getElementById('metaResult').scrollIntoView({ behavior: 'smooth' });
        }

        function updateStats(text) {
            const chars = text.length;
            const words = text.replace(/[\u4e00-\u9fa5]/g, '').split(/\s+/).filter(Boolean).length + (text.match(/[\u4e00-\u9fa5]/g) || []).length;
            const readTime = Math.ceil(words / 300);
            document.getElementById('postStats').innerHTML = `
                <span>📊 总字符: ${chars}</span>
                <span>📝 约 ${words} 字</span>
                <span>⏱️ 预计阅读: ${readTime} 分钟</span>
                <span>📑 段落数: ${text.split('\n\n').filter(Boolean).length}</span>
            `;
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => alert('已复制到剪贴板'));
        }

        function copyMeta() {
            const text = `Title: ${document.getElementById('metaTitle').textContent}\nDescription: ${document.getElementById('metaDesc').textContent}\n\nOG Tags:\n${document.getElementById('metaOg').textContent}`;
            navigator.clipboard.writeText(text).then(() => alert('SEO元数据已复制'));
        }

        function downloadPost() {
            const text = document.getElementById('postContent').textContent;
            const blob = new Blob([text], { type: 'text/markdown' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${document.getElementById('topic').value.trim() || 'blog-post'}.md`;
            a.click();
        }
    </script>
</body>
</html>
