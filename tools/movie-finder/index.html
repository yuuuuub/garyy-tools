<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电影查询工具 - 暑期档评分查询</title>
<style>
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: #1a1a28;
    --bg-card-hover: #222236;
    --text-primary: #e8e8f0;
    --text-secondary: #9a9ab8;
    --text-muted: #6a6a88;
    --accent: #e63946;
    --accent-glow: rgba(230, 57, 70, 0.3);
    --gold: #f4a261;
    --border: #2a2a3e;
    --border-light: #353552;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* Background atmosphere */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(230, 57, 70, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(244, 162, 97, 0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 10, 15, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 16px 0;
  }

  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    white-space: nowrap;
  }

  .search-box {
    flex: 1;
    max-width: 480px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 12px 48px 12px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 24px;
    color: var(--text-primary);
    font-size: 15px;
    outline: none;
    transition: all 0.3s;
  }

  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .search-box input::placeholder { color: var(--text-muted); }

  .search-icon {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 18px;
    pointer-events: none;
  }

  .header-actions { display: flex; gap: 8px; }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
  }

  .btn-random {
    background: linear-gradient(135deg, #e63946, #c1272d);
    color: #fff;
  }

  .btn-random:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px var(--accent-glow);
  }

  .btn-fav {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }

  .btn-fav:hover { border-color: var(--accent); color: var(--accent); }

  /* Filters */
  .filters {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }

  .filter-tag {
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    transition: all 0.2s;
  }

  .filter-tag:hover { border-color: var(--accent); color: var(--accent); }
  .filter-tag.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .sort-select {
    padding: 8px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-primary);
    font-size: 13px;
    cursor: pointer;
    margin-left: auto;
    outline: none;
  }

  .sort-select option { background: var(--bg-card); }

  /* Stats bar */
  .stats-bar {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  .result-count { font-weight: 500; }
  .result-count span { color: var(--accent); font-weight: 700; }

  /* Movie Grid */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px 60px;
    position: relative;
    z-index: 1;
  }

  .section-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::before {
    content: '';
    width: 4px;
    height: 24px;
    background: var(--accent);
    border-radius: 2px;
  }

  .movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }

  /* Movie Card */
  .movie-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }

  .movie-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 8px 32px rgba(230, 57, 70, 0.15);
  }

  .card-poster {
    width: 100%;
    height: 180px;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    position: relative;
    overflow: hidden;
  }

  .card-poster::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: linear-gradient(transparent, var(--bg-card));
  }

  .card-rating {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(0,0,0,0.75);
    color: var(--gold);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    z-index: 2;
    backdrop-filter: blur(4px);
  }

  .card-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    z-index: 2;
    backdrop-filter: blur(4px);
  }

  .badge-upcoming { background: rgba(244,162,97,0.25); color: var(--gold); }
  .badge-hot { background: rgba(230,57,70,0.25); color: var(--accent); }
  .badge-classic { background: rgba(100,149,237,0.25); color: #6495ed; }

  .card-body { padding: 14px 16px 16px; }

  .card-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-meta {
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    gap: 12px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .card-meta span { display: flex; align-items: center; gap: 4px; }

  .card-genres {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .genre-tag {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    background: rgba(255,255,255,0.05);
    color: var(--text-secondary);
  }

  .card-desc {
    font-size: 12px;
    color: var(--text-muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.5;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .btn-wish {
    flex: 1;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
  }

  .btn-wish:hover { border-color: var(--accent); color: var(--accent); }
  .btn-wish.wished { background: rgba(230,57,70,0.12); color: var(--accent); border-color: var(--accent); }

  .btn-detail {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.05);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-detail:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }

  /* Countdown */
  .countdown {
    font-size: 12px;
    color: var(--gold);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .countdown-icon { font-size: 14px; }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text-secondary); }

  /* Modal */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(4px);
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 640px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.08);
    color: var(--text-primary);
    font-size: 18px;
    cursor: pointer;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .modal-close:hover { background: rgba(255,255,255,0.15); }

  .modal-poster {
    width: 100%;
    height: 220px;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    position: relative;
  }

  .modal-poster::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: 40px;
    background: linear-gradient(transparent, var(--bg-secondary));
  }

  .modal-body { padding: 24px; }

  .modal-title {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 12px;
  }

  .modal-info {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 16px;
    font-size: 14px;
  }

  .modal-info-item { color: var(--text-secondary); }
  .modal-info-item strong { color: var(--text-primary); display: block; margin-bottom: 2px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

  .modal-rating-big {
    font-size: 42px;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .modal-rating-big small { font-size: 16px; font-weight: 400; color: var(--text-muted); }

  .modal-synopsis {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text-secondary);
    margin-bottom: 20px;
    padding: 16px;
    background: var(--bg-card);
    border-radius: var(--radius-sm);
  }

  .modal-actions {
    display: flex;
    gap: 12px;
  }

  .modal-actions .btn {
    flex: 1;
    padding: 12px 20px;
    font-size: 15px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-card);
    color: var(--text-primary);
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    z-index: 300;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    animation: slideUp 0.3s ease;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .header-inner { flex-direction: column; gap: 12px; }
    .search-box { max-width: 100%; }
    .movie-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .modal-info { grid-template-columns: 1fr; }
    .modal-poster { height: 160px; }
    .filters { flex-direction: column; align-items: flex-start; }
    .sort-select { margin-left: 0; }
  }
</style>
</head>

    <div class="search-box">

    <div class="header-actions">

  </div>
</header>

<!-- Filters -->
<div class="filters">

    <span class="filter-tag" onclick="setGenre('悬疑', this)">悬疑</span>
    <span class="filter-tag" onclick="setGenre('爱情', this)">爱情</span>
    <span class="filter-tag" onclick="setGenre('剧情', this)">剧情</span>
    <span class="filter-tag" onclick="setGenre('纪录片', this)">纪录片</span>
  </div>
  <select class="sort-select" id="sortSelect" onchange="filterMovies()">
    <option value="rating">评分最高</option>
    <option value="date">最新上映</option>
    <option value="hot">最热门</option>
  </select>
</div>

<!-- Stats -->
<div class="stats-bar">
  <div class="result-count">共找到 <span id="resultCount">0</span> 部电影</div>
</div>

<!-- Movie Grid -->
<div class="container">
  <div class="movie-grid" id="movieGrid"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)">
  <div class="modal" id="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-poster" id="modalPoster"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

// ===================== 状态管理 =====================
let currentGenre = '全部';
let wishlist = JSON.parse(localStorage.getItem('movieWishlist') || '[]');

function saveWishlist() {
  localStorage.setItem('movieWishlist', JSON.stringify(wishlist));
}

function isWished(movieId) {
  return wishlist.includes(movieId);
}

function toggleWish(movieId) {
  if (isWished(movieId)) {
    wishlist = wishlist.filter(id => id !== movieId);
  } else {
    wishlist.push(movieId);
  }
  saveWishlist();
  renderMovies();
}

// ===================== 排序与筛选 =====================
function getFilteredMovies() {
  let result = [...movies];
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

  // 搜索过滤
  if (searchTerm) {
    result = result.filter(m => {
      return m.title.toLowerCase().includes(searchTerm) ||
             m.director.toLowerCase().includes(searchTerm) ||
             m.cast.some(c => c.toLowerCase().includes(searchTerm)) ||
             m.genres.some(g => g.toLowerCase().includes(searchTerm));
    });
  }

  // 分类过滤
  if (currentGenre !== '全部') {
    result = result.filter(m => m.genres.includes(currentGenre));
  }

  // 排序
  const sortBy = document.getElementById('sortSelect').value;
  if (sortBy === 'rating') {
    result.sort((a, b) => b.rating - a.rating);
  } else if (sortBy === 'date') {
    result.sort((a, b) => new Date(b.releaseDate) - new Date(a.releaseDate));
  } else if (sortBy === 'hot') {
    result.sort((a, b) => b.hot - a.hot);
  }

  return result;
}

// ===================== 渲染 =====================
function getDaysUntil(dateStr) {
  const now = new Date();
  const target = new Date(dateStr);
  const diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
  return diff;
}

function getBadge(movie) {
  const days = getDaysUntil(movie.releaseDate);
  if (days > 0 && days <= 60) return { text: `${days}天后上映`, cls: 'badge-upcoming', icon: '⏰' };
  if (days > 0 && days <= 180) return { text: '即将上映', cls: 'badge-upcoming', icon: '📅' };
  if (days < 0 && days > -365) return { text: '新片', cls: 'badge-hot', icon: '🔥' };
  if (movie.rating >= 9.3) return { text: '经典', cls: 'badge-classic', icon: '⭐' };
  return null;
}

function renderMovies() {
  const filtered = getFilteredMovies();
  const grid = document.getElementById('movieGrid');
  document.getElementById('resultCount').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🎬</div>
      <h3>没有找到相关电影</h3>
      <p>尝试换个关键词搜索吧</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(m => {
    const inWishlist = isWished(m.id);
    const badge = getBadge(m);
    const days = getDaysUntil(m.releaseDate);
    const showCountdown = days > 0 && days <= 90;
    const ratingDisplay = m.rating > 0 ? m.rating.toFixed(1) : '待定';

    return `
      <div class="movie-card" onclick="showDetail(${m.id})">
        <div class="card-poster">
          ${m.poster}
          <span class="card-rating">${m.rating > 0 ? '⭐ ' + ratingDisplay : '📋 ' + ratingDisplay}</span>
          ${badge ? `<span class="card-badge ${badge.cls}">${badge.icon} ${badge.text}</span>` : ''}
        </div>
        <div class="card-body">
          <div class="card-title">${m.title}</div>
          <div class="card-meta">
            <span>📅 ${m.releaseDate}</span>
            <span>✍️ ${m.director}</span>
          </div>
          <div class="card-genres">${m.genres.map(g => `<span class="genre-tag">${g}</span>`).join('')}</div>
          <div class="card-desc">${m.synopsis}</div>
          ${showCountdown ? `<div class="countdown"><span class="countdown-icon">⏰</span>距离上映还有 <strong>${days}</strong> 天</div>` : ''}
          <div class="card-actions" onclick="event.stopPropagation()">
            <button class="btn-wish ${inWishlist ? 'wished' : ''}" onclick="toggleWish(${m.id})">
              ${inWishlist ? '❤️ 已想看' : '🤍 想看'}
            </button>
            <button class="btn-detail" onclick="showDetail(${m.id})">详情</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ===================== 弹窗详情 =====================
function showDetail(movieId) {
  const movie = movies.find(m => m.id === movieId);
  if (!movie) return;

  const inWishlist = isWished(movieId);
  const days = getDaysUntil(movie.releaseDate);
  const ratingDisplay = movie.rating > 0 ? movie.rating.toFixed(1) : '暂无评分';

  document.getElementById('modalPoster').textContent = movie.poster;
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-title">${movie.title}</div>

    ${movie.rating > 0 ? `<div class="modal-rating-big">⭐ ${ratingDisplay} <small>/ 10</small></div>` : `<div class="modal-rating-big" style="color: var(--text-muted);">📋 待评分 <small>即将上映</small></div>`}

    <div class="modal-info">
      <div class="modal-info-item">
        <strong>上映日期</strong>
        ${movie.releaseDate}
        ${days > 0 && days <= 90 ? `<div style="color: var(--gold); margin-top: 4px;">⏰ 距离上映还有 ${days} 天</div>` : ''}
      </div>
      <div class="modal-info-item"><strong>导演</strong>${movie.director}</div>
      <div class="modal-info-item"><strong>类型</strong>${movie.genres.join(' / ')}</div>
      <div class="modal-info-item"><strong>主演</strong>${movie.cast.join(' / ')}</div>
      <div class="modal-info-item"><strong>热度</strong>🔥 ${movie.hot}</div>
    </div>

    <div class="modal-synopsis">
      <strong style="color: var(--text-primary);">剧情简介</strong><br><br>
      ${movie.synopsis}
    </div>

    <div class="modal-actions">
      <button class="btn btn-random" style="flex:2;" onclick="toggleWish(${movieId}); closeModal();">
        ${inWishlist ? '❤️ 取消想看' : '🤍 加入想看'}
      </button>
      <button class="btn btn-fav" onclick="closeModal()">关闭</button>
    </div>
  `;

  document.getElementById('modalOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return false;
  document.getElementById('modalOverlay').style.display = 'none';
  document.body.style.overflow = '';
  renderMovies();
}

// ===================== 交互 =====================
function setGenre(genre, el) {
  currentGenre = genre;
  document.querySelectorAll('#genreFilters .filter-tag').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderMovies();
}

function filterMovies() {
  renderMovies();
}

function randomMovie() {
  const filtered = getFilteredMovies();
  if (filtered.length === 0) return;
  const random = filtered[Math.floor(Math.random() * filtered.length)];
  showDetail(random.id);
}

function showFavorites() {
  if (wishlist.length === 0) {
    showToast('还没有收藏任何电影哦~');
    return;
  }
  currentGenre = '全部';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('#genreFilters .filter-tag').forEach(t => t.classList.remove('active'));
  document.querySelector('#genreFilters .filter-tag').classList.add('active');
  // 覆盖过滤：只显示收藏的电影
  const allFiltered = movies.filter(m => wishlist.includes(m.id));
  const grid = document.getElementById('movieGrid');
  document.getElementById('resultCount').textContent = allFiltered.length;

  if (allFiltered.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">❤️</div>
      <h3>想看列表为空</h3>
      <p>浏览电影并点击"想看"按钮来添加</p>
    </div>`;
    return;
  }

  // 临时渲染收藏列表
  grid.innerHTML = allFiltered.map(m => {
    const inWishlist = true;
    const badge = getBadge(m);
    const days = getDaysUntil(m.releaseDate);
    const showCountdown = days > 0 && days <= 90;
    const ratingDisplay = m.rating > 0 ? m.rating.toFixed(1) : '待定';

    return `
      <div class="movie-card" onclick="showDetail(${m.id})">
        <div class="card-poster">
          ${m.poster}
          <span class="card-rating">${m.rating > 0 ? '⭐ ' + ratingDisplay : '📋 ' + ratingDisplay}</span>
          ${badge ? `<span class="card-badge ${badge.cls}">${badge.icon} ${badge.text}</span>` : ''}
        </div>
        <div class="card-body">
          <div class="card-title">${m.title}</div>
          <div class="card-meta">
            <span>📅 ${m.releaseDate}</span>
            <span>✍️ ${m.director}</span>
          </div>
          <div class="card-genres">${m.genres.map(g => `<span class="genre-tag">${g}</span>`).join('')}</div>
          <div class="card-desc">${m.synopsis}</div>
          ${showCountdown ? `<div class="countdown"><span class="countdown-icon">⏰</span>距离上映还有 <strong>${days}</strong> 天</div>` : ''}
          <div class="card-actions" onclick="event.stopPropagation()">
            <button class="btn-wish wished" onclick="toggleWish(${m.id}); renderMovies();">
              ❤️ 已想看
            </button>
            <button class="btn-detail" onclick="showDetail(${m.id})">详情</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

// ===================== 键盘快捷键 =====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModal();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

// ===================== 初始化 =====================
renderMovies();
</script>
