gin-top:8px}.transform4-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.transform4-char{font-size:6rem;font-weight:700;color:var(--blue);display:inline-block}.transform4-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.transform4-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.transform4-option:hover{border-color:var(--blue)}.transform4-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}

<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔄 汉字变形5</h1><p class="sub">在线查看汉字变形效果</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="变" oninput="showTransform4()">
</div>
<button class="btn" onclick="showTransform4()">显示变形</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var transformTypes4=['matrix','glitch','pixel','ascii','wave','ripple','explode','implode','melt','shatter'];
var currentTransform4='matrix';
function showTransform4(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="transform4-options">';
  transformTypes4.forEach(function(type){
    html+='<div class="transform4-option '+(type===currentTransform4?'active':'')+'" onclick="setTransform4(\''+type+'\')">'+getTransformName4(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="transform4-container">';
  html+='<div class="transform4-char" style="animation:'+getTransformCSS4(currentTransform4)+'">'+char+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>📋 变形说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>变形类型：</strong>'+getTransformName4(currentTransform4)+'</div>';
  html+='<div><strong>效果描述：</strong>'+getTransformDescription4(currentTransform4)+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function setTransform4(type){
  currentTransform4=type;
  showTransform4();
}
function getTransformName4(type){
  switch(type){
    case 'matrix':return'矩阵';
    case 'glitch':return'故障';
    case 'pixel':return'像素';
    case 'ascii':return'ASCII';
    case 'wave':return'波浪';
    case 'ripple':return'涟漪';
    case 'explode':return'爆炸';
    case 'implode':return'内爆';
    case 'melt':return'融化';
    case 'shatter':return'碎裂';
    default:return'未知';
  }
}
function getTransformDescription4(type){
  switch(type){
    case 'matrix':return'数字雨效果，矩阵风格';
    case 'glitch':return'故障艺术效果，数字干扰';
    case 'pixel':return'像素化效果，复古游戏风格';
    case 'ascii':return'ASCII艺术效果，字符画';
    case 'wave':return'波浪扭曲效果，水面波纹';
    case 'ripple':return'涟漪扩散效果，水滴涟漪';
    case 'explode':return'爆炸分散效果，碎片飞散';
    case 'implode':return'内爆收缩效果，向中心收缩';
    case 'melt':return'融化流淌效果，液体融化';
    case 'shatter':return'碎裂效果，玻璃破碎';
    default:return'未知效果';
  }
}
function getTransformCSS4(type){
  switch(type){
    case 'matrix':return'matrix4 3s linear infinite';
    case 'glitch':return'glitch4 0.5s infinite';
    case 'pixel':return'pixel4 1s infinite';
    case 'ascii':return'ascii4 2s infinite';
    case 'wave':return'wave4 2s infinite';
    case 'ripple':return'ripple4 1.5s infinite';
    case 'explode':return'explode4 1s infinite';
    case 'implode':return'implode4 1s infinite';
    case 'melt':return'melt4 2s infinite';
    case 'shatter':return'shatter4 1s infinite';
    default:return'none';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showTransform4();
}
showTransform4();
</script>
<style>
@keyframes matrix4{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:0.5;transform:translateY(-10px)}}
@keyframes glitch4{0%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(-2px,-2px)}60%{transform:translate(2px,2px)}80%{transform:translate(2px,-2px)}100%{transform:translate(0)}}
@keyframes pixel4{0%,100%{filter:blur(0px)}50%{filter:blur(3px)}}
@keyframes ascii4{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes wave4{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-10px) rotate(2deg)}50%{transform:translateY(0) rotate(0deg)}75%{transform:translateY(10px) rotate(-2deg)}}
@keyframes ripple4{0%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:0.7}100%{transform:scale(1);opacity:1}}
@keyframes explode4{0%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:0.5}100%{transform:scale(1);opacity:1}}
@keyframes implode4{0%{transform:scale(1);opacity:1}50%{transform:scale(0.5);opacity:0.5}100%{transform:scale(1);opacity:1}}
@keyframes melt4{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.3);transform-origin:bottom}}
@keyframes shatter4{0%,100%{transform:scale(1) rotate(0deg);opacity:1}50%{transform:scale(1.2) rotate(5deg);opacity:0.8}}
</style><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
