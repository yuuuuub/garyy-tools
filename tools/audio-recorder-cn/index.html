<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎙️ 录音机</title>
<meta name="description" content="在线录音机，支持实时波形显示、录音回放、导出WAV格式">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.recorder-center{display:flex;flex-direction:column;align-items:center;padding:30px 0}
.rec-btn{width:100px;height:100px;border-radius:50%;border:none;font-size:40px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.3)}
.rec-btn:hover{transform:scale(1.05)}
.rec-btn:active{transform:scale(.95)}
.rec-btn.recording{background:#ef4444;animation:pulse 1s infinite}
.rec-btn.paused{background:#f59e0b}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 20px rgba(239,68,68,0)}}
.timer{font-size:36px;font-weight:700;font-family:monospace;margin:16px 0;color:var(--text)}
.waveform-wrap{width:100%;height:100px;border-radius:12px;background:var(--preview-bg);overflow:hidden;margin:12px 0}
canvas#waveform{width:100%;height:100%}
.level-bar{width:100%;height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin:8px 0}
.level-fill{height:100%;background:linear-gradient(90deg,#10b981,#f59e0b,#ef4444);border-radius:4px;transition:width .1s}
.control-row{display:flex;gap:10px;margin-top:16px;justify-content:center}
.ctrl-btn{width:48px;height:48px;border-radius:50%;border:2px solid var(--border);background:var(--card-bg);font-size:20px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.ctrl-btn:hover{border-color:var(--accent);transform:scale(1.1)}
.ctrl-btn:active{transform:scale(.95)}
.ctrl-btn.active{border-color:var(--accent);background:var(--tag-bg)}
.recordings{margin-top:12px}
.recording-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--preview-bg);margin-bottom:8px}
.recording-item .info{flex:1}
.recording-item .name{font-size:14px;font-weight:600}
.recording-item .meta{font-size:12px;color:var(--text-secondary)}
.recording-item .actions{display:flex;gap:6px}
.recording-item .act-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.recording-item .act-btn:hover{border-color:var(--accent)}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slider-row label{font-size:13px;color:var(--text-secondary);min-width:60px}
.slider-row input[type="range"]{flex:1}
.slider-row span{font-size:13px;color:var(--text-secondary);min-width:36px;text-align:right}
.btn{padding:10px 20px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn:active{transform:scale(.97)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

@media(max-width:600px){
  body{padding:12px!important}
  .container{max-width:100%!important;padding:0!important}
  h1{font-size:1.3rem!important}
  .card{padding:14px!important;margin-bottom:10px!important}
  .btn{padding:8px 16px!important;font-size:.85rem!important}
  textarea,.input-group input,.input-group select{font-size:16px!important}
  .tools-grid,.grid,.result-grid{grid-template-columns:1fr!important}
  table{font-size:.78rem!important}
  th,td{padding:5px 4px!important}
  .tab-bar{gap:4px!important}
  .tab{padding:6px 10px!important;font-size:.75rem!important}
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🎙️ 录音机">
<meta property="og:description" content="在线录音机，支持实时波形显示和WAV导出">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/audio-recorder-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🎙️ 录音机</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">🎛️ 录音控制</div>
    <div class="recorder-center">
      <div class="waveform-wrap"><canvas id="waveform"></canvas></div>
      <div class="level-bar"><div class="level-fill" id="levelFill" style="width:0%"></div></div>
      <div class="timer" id="timer">00:00:00</div>
      <button class="rec-btn" id="recBtn" onclick="toggleRec()">🎙️</button>
      <div class="control-row">
        <button class="ctrl-btn" id="pauseBtn" onclick="togglePause()" disabled>⏸️</button>
        <button class="ctrl-btn" id="stopBtn" onclick="stopRec()" disabled>⏹️</button>
        <button class="ctrl-btn" onclick="toggleMeter()">📊</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">⚙️ 设置</div>
    <div class="slider-row"><label>增益</label><input type="range" min="0" max="3" step="0.1" value="1" id="gainSlider" oninput="document.getElementById('gainVal').textContent=this.value+'x'"><span id="gainVal">1x</span></div>
    <div class="slider-row"><label>采样率</label><input type="range" min="1" max="3" value="2" id="sampleRate" oninput="updateSampleRate()"><span id="sampleRateVal">44100</span></div>
  </div>

  <div class="card">
    <div class="card-title">📁 录音列表</div>
    <div class="recordings" id="recordings">
      <div style="text-align:center;color:var(--text-secondary);font-size:13px;padding:10px">暂无录音</div>
    </div>
  </div>

  <footer>录音机 · 所有录音本地处理，不上传服务器</footer>
</div>
<div class="toast" id="toast"></div>
<script src="../i18n.js" defer></script>
<script>
let mediaRecorder = null, audioContext = null, analyser = null, source = null;
let chunks = [], recordings = [], isRecording = false, isPaused = false;
let timerInterval = null, elapsed = 0, meterVisible = true;
let animFrame = null;

const sampleRates = [22050, 44100, 48000];

function init() {
  drawWaveformIdle();
}

function drawWaveformIdle() {
  const c = document.getElementById('waveform');
  const ctx = c.getContext('2d');
  c.width = c.offsetWidth * 2; c.height = c.offsetHeight * 2;
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--preview-bg').trim() || '#fafafa';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.strokeStyle = 'rgba(99,102,241,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, c.height / 2);
  ctx.lineTo(c.width, c.height / 2);
  ctx.stroke();
}

async function toggleRec() {
  if (isRecording) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    source = audioContext.createMediaStreamSource(stream);
    source.connect(analyser);

    const gainNode = audioContext.createGain();
    gainNode.gain.value = +document.getElementById('gainSlider').value;
    source.connect(gainNode);

    mediaRecorder = new MediaRecorder(stream);
    chunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => saveRecording(stream);

    mediaRecorder.start(100);
    isRecording = true;
    elapsed = 0;
    document.getElementById('recBtn').classList.add('recording');
    document.getElementById('pauseBtn').disabled = false;
    document.getElementById('stopBtn').disabled = false;
    timerInterval = setInterval(updateTimer, 1000);
    drawWaveform();
    showToast('开始录音...');
  } catch (err) {
    showToast('无法访问麦克风: ' + err.message);
  }
}

function togglePause() {
  if (!isRecording) return;
  if (isPaused) {
    mediaRecorder.resume();
    isPaused = false;
    document.getElementById('recBtn').classList.add('recording');
    document.getElementById('recBtn').classList.remove('paused');
    timerInterval = setInterval(updateTimer, 1000);
  } else {
    mediaRecorder.pause();
    isPaused = true;
    document.getElementById('recBtn').classList.remove('recording');
    document.getElementById('recBtn').classList.add('paused');
    clearInterval(timerInterval);
  }
}

function stopRec() {
  if (!isRecording) return;
  mediaRecorder.stop();
  isRecording = false; isPaused = false;
  clearInterval(timerInterval);
  cancelAnimationFrame(animFrame);
  document.getElementById('recBtn').classList.remove('recording', 'paused');
  document.getElementById('pauseBtn').disabled = true;
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('levelFill').style.width = '0%';
  drawWaveformIdle();
  showToast('录音已停止');
}

function saveRecording(stream) {
  stream.getTracks().forEach(t => t.stop());
  const blob = new Blob(chunks, { type: 'audio/webm' });
  const name = `录音 ${recordings.length + 1}`;
  const duration = formatTime(elapsed);
  recordings.push({ name, blob, duration, time: new Date().toLocaleTimeString() });
  renderRecordings();
}

function renderRecordings() {
  const el = document.getElementById('recordings');
  if (recordings.length === 0) { el.innerHTML = '<div style="text-align:center;color:var(--text-secondary);font-size:13px;padding:10px">暂无录音</div>'; return; }
  el.innerHTML = recordings.map((r, i) => `
    <div class="recording-item">
      <div class="info"><div class="name">${r.name}</div><div class="meta">${r.duration} · ${r.time}</div></div>
      <div class="actions">
        <button class="act-btn" onclick="playRec(${i})">▶️</button>
        <button class="act-btn" onclick="downloadRec(${i})">💾</button>
        <button class="act-btn" onclick="deleteRec(${i})">🗑️</button>
      </div>
    </div>
  `).join('');
}

function playRec(i) {
  const a = new Audio(URL.createObjectURL(recordings[i].blob));
  a.play();
  showToast('播放中...');
}

function downloadRec(i) {
  const a = document.createElement('a');
  a.download = `${recordings[i].name}.webm`;
  a.href = URL.createObjectURL(recordings[i].blob);
  a.click();
  showToast('已下载！');
}

function deleteRec(i) {
  recordings.splice(i, 1);
  renderRecordings();
  showToast('已删除');
}

function updateTimer() {
  elapsed++;
  document.getElementById('timer').textContent = formatTime(elapsed);
}

function formatTime(s) {
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${sec}`;
}

function updateSampleRate() {
  document.getElementById('sampleRateVal').textContent = sampleRates[+document.getElementById('sampleRate').value - 1];
}

function toggleMeter() {
  meterVisible = !meterVisible;
  showToast(meterVisible ? '波形已开启' : '波形已关闭');
}

function drawWaveform() {
  if (!isRecording || isPaused) return;
  const c = document.getElementById('waveform');
  const ctx = c.getContext('2d');
  c.width = c.offsetWidth * 2; c.height = c.offsetHeight * 2;

  const bufLen = analyser.frequencyBinCount;
  const data = new Uint8Array(bufLen);
  analyser.getByteTimeDomainData(data);

  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--preview-bg').trim() || '#fafafa';
  ctx.fillRect(0, 0, c.width, c.height);

  if (meterVisible) {
    ctx.lineWidth = 2;
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6366f1';
    ctx.beginPath();
    const sliceWidth = c.width / bufLen;
    let x = 0;
    for (let i = 0; i < bufLen; i++) {
      const v = data[i] / 128.0;
      const y = v * c.height / 2;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      x += sliceWidth;
    }
    ctx.lineTo(c.width, c.height / 2);
    ctx.stroke();
  }

  // level meter
  let sum = 0;
  for (let i = 0; i < bufLen; i++) sum += Math.abs(data[i] - 128);
  const avg = sum / bufLen;
  document.getElementById('levelFill').style.width = Math.min(100, avg * 2) + '%';

  animFrame = requestAnimationFrame(drawWaveform);
}

function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
  if (!isRecording) drawWaveformIdle();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

init();
</script>
</body>
</html>
