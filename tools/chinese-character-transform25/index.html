<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字变形47</title><meta name="description" content="汉字变形47 - 在线查看汉字变形效果"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.transform25-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.transform25-char{font-size:6rem;font-weight:700;color:var(--blue);display:inline-block}.transform25-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.transform25-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.transform25-option:hover{border-color:var(--blue)}.transform25-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}</style><meta property="og:title" content="汉字变形47"><meta property="og:description" content="汉字变形47 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"></head><body>
<div class="container"><h1>🔄 汉字变形47</h1><p class="sub">在线查看汉字变形效果</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="变" oninput="showTransform25()">
</div>
<button class="btn" onclick="showTransform25()">显示变形</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var transformTypes25=['3d','cube','sphere','cylinder','cone','pyramid','torus','knot','helix','spiral'];
var currentTransform25='3d';
function showTransform25(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="transform25-options">';
  transformTypes25.forEach(function(type){
    html+='<div class="transform25-option '+(type===currentTransform25?'active':'')+'" onclick="setTransform25(\''+type+'\')">'+getTransformName25(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="transform25-container">';
  html+='<div class="transform25-char" style="animation:'+getTransformCSS25(currentTransform25)+'">'+char+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>📋 变形说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>变形类型：</strong>'+getTransformName25(currentTransform25)+'</div>';
  html+='<div><strong>效果描述：</strong>'+getTransformDescription25(currentTransform25)+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function setTransform25(type){
  currentTransform25=type;
  showTransform25();
}
function getTransformName25(type){
  switch(type){
    case '3d':return'3D旋转';
    case 'cube':return'立方体';
    case 'sphere':return'球体';
    case 'cylinder':return'圆柱体';
    case 'cone':return'圆锥体';
    case 'pyramid':return'金字塔';
    case 'torus':return'环面';
    case 'knot':return'纽结';
    case 'helix':return'螺旋';
    case 'spiral':return'漩涡';
    default:return'未知';
  }
}
function getTransformDescription25(type){
  switch(type){
    case '3d':return'3D空间中的旋转效果';
    case 'cube':return'立方体旋转效果';
    case 'sphere':return'球体旋转效果';
    case 'cylinder':return'圆柱体旋转效果';
    case 'cone':return'圆锥体旋转效果';
    case 'pyramid':return'金字塔旋转效果';
    case 'torus':return'环面旋转效果';
    case 'knot':return'纽结旋转效果';
    case 'helix':return'螺旋旋转效果';
    case 'spiral':return'漩涡旋转效果';
    default:return'未知效果';
  }
}
function getTransformCSS25(type){
  switch(type){
    case '3d':return'rotate3d25 3s linear infinite';
    case 'cube':return'cube25 4s linear infinite';
    case 'sphere':return'sphere25 3s linear infinite';
    case 'cylinder':return'cylinder25 3s linear infinite';
    case 'cone':return'cone25 3s linear infinite';
    case 'pyramid':return'pyramid25 4s linear infinite';
    case 'torus':return'torus25 3s linear infinite';
    case 'knot':return'knot25 4s linear infinite';
    case 'helix':return'helix25 3s linear infinite';
    case 'spiral':return'spiral25 3s linear infinite';
    default:return'none';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showTransform25();
}
showTransform25();
</script>
<style>
@keyframes rotate3d25{0%{transform:rotateX(0) rotateY(0)}100%{transform:rotateX(360deg) rotateY(360deg)}}
@keyframes cube25{0%{transform:rotateX(0) rotateY(0)}25%{transform:rotateX(90deg) rotateY(90deg)}50%{transform:rotateX(180deg) rotateY(180deg)}75%{transform:rotateX(270deg) rotateY(270deg)}100%{transform:rotateX(360deg) rotateY(360deg)}}
@keyframes sphere25{0%,100%{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(0.8)}}
@keyframes cylinder25{0%,100%{transform:rotateY(0) scaleY(1)}50%{transform:rotateY(180deg) scaleY(0.5)}}
@keyframes cone25{0%,100%{transform:rotateY(0) scaleX(1)}50%{transform:rotateY(180deg) scaleX(0.3)}}
@keyframes pyramid25{0%,100%{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(0.7)}}
@keyframes torus25{0%{transform:rotateX(0) rotateY(0)}100%{transform:rotateX(360deg) rotateY(360deg)}}
@keyframes knot25{0%{transform:rotateX(0) rotateY(0) rotateZ(0)}100%{transform:rotateX(360deg) rotateY(360deg) rotateZ(360deg)}}
@keyframes helix25{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(180deg) translateY(-20px)}100%{transform:rotateY(360deg) translateY(0)}}
@keyframes spiral25{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(0.5)}100%{transform:rotate(360deg) scale(1)}}
</style></body></html>
