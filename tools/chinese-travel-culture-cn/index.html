<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国旅行文化礼仪指南 - Chinese Travel Culture Guide</title>
<meta name="description" content="中国旅行文化礼仪指南，了解各地风俗禁忌与社交礼仪，做文明旅行者">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国旅行文化礼仪指南 - Chinese Travel Culture Guide">
<meta property="og:description" content="中国旅行文化礼仪指南，了解各地风俗禁忌与社交礼仪">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏮</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#9333ea;--accent2:#7e22ce}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#9333ea;--accent2:#7e22ce}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#0f0520 0%,#1a0a30 50%,#200d3d 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #581c87;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#9333ea,#c084fc,#a855f7,#d8b4fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.culture-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px}
.culture-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.culture-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.culture-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.culture-card .c-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.culture-card .c-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(147,51,234,0.15);color:var(--accent)}
.culture-card .c-name{font-size:1.2em;font-weight:bold}
.culture-card .c-region{font-size:0.8em;color:var(--text2);margin-top:2px}
.culture-card .c-content{font-size:0.85em;color:var(--text2);line-height:1.8;margin-bottom:8px}
.culture-card .c-content strong{color:var(--text)}
.culture-card .c-tip{background:rgba(147,51,234,0.08);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;font-size:0.8em;color:var(--text2);margin-top:8px}
.culture-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.culture-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🏮 中国旅行文化礼仪指南</h1>
<p>Chinese Travel Culture Guide — 入乡随俗，尊重每一种文化</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索文化礼仪...（如"寺庙""敬酒""回族"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="社交礼仪">🤝 社交礼仪</button>
<button class="filter-btn" data-filter="饮食文化">🍽️ 饮食文化</button>
<button class="filter-btn" data-filter="宗教场所">🛕 宗教场所</button>
<button class="filter-btn" data-filter="少数民族">🎎 少数民族</button>
<button class="filter-btn" data-filter="禁忌须知">⚠️ 禁忌须知</button>
</div>
<div class="culture-grid" id="cultureGrid"></div>
<footer><p>🏮 中国旅行文化礼仪指南 — 入乡随俗，以礼相待</p></footer>
</div>
<script>
const CULTURE_DATA=[
{id:1,name:"餐桌礼仪",en:"Dining Etiquette",region:"全国",category:"饮食文化",icon:"🍽️",content:"中国人吃饭用<strong>筷子</strong>，不可将筷子竖插在饭碗中（像祭祀香）。主人会不断给客人夹菜表示热情，接受即可。敬酒时<strong>杯沿低于长辈</strong>表示尊敬。",tip:"长辈先动筷，晚辈再开始吃"},
{id:2,name:"春节礼仪",en:"Spring Festival Customs",region:"全国",category:"社交礼仪",icon:"🧧",content:"春节期间<strong>说吉祥话</strong>，忌说"死""破""没"等不吉利的字。收到红包不要当面打开。拜年时<strong>晚辈向长辈鞠躬</strong>。初一不扫地、不倒垃圾。",tip:"红色代表好运，穿红色衣物参加年庆"},
{id:3,name:"寺庙参拜",en:"Temple Visiting",region:"全国",category:"宗教场所",icon:"🛕",content:"进入寺庙<strong>不可踩门槛</strong>，衣着端庄勿穿短裤吊带。烧香一般<strong>三支为宜</strong>，表示敬佛、敬法、敬僧。拍照前注意是否允许，佛像前禁止合影。",tip:"双手合十，顺时针绕行"},
{id:4,name:"藏族礼仪",en:"Tibetan Customs",region:"西藏/青海/四川",category:"少数民族",icon:"🏔️",content:"接受哈达时<strong>双手接过</strong>，不可单手。转经筒要<strong>顺时针</strong>转动。进入藏民帐篷不可踩门槛。拍照需征得同意，尤其对僧侣和老人。",tip:"献哈达是最高礼节，表示祝福"},
{id:5,name:"回族饮食禁忌",en:"Halal Customs",region:"宁夏/甘肃/新疆",category:"禁忌须知",icon:"☪️",content:"回族信仰伊斯兰教，<strong>不食猪肉</strong>，不饮酒。进入清真餐厅不要带含猪肉食品。<strong>不主动询问</strong>对方饮食禁忌，尊重为先。",tip:"用餐前可用"清真"标识辨别餐厅"},
{id:6,name:"商务送礼",en:"Business Gift Giving",region:"全国",category:"社交礼仪",icon:"🎁",content:"商务场合送礼<strong>忌送钟（送终）</strong>、伞（散）、梨（离）。礼物用双手递上，对方可能<strong>客气推辞</strong>三次后才接受。红包金额避免带4。",tip:"茶叶、工艺品是安全的商务礼品"},
{id:7,name:"苗族节日",en:"Miao Festivals",region:"贵州/湖南/云南",category:"少数民族",icon:"💃",content:"苗族<strong>苗年</strong>和<strong>姊妹节</strong>是最盛大的节日。姑娘们穿戴银饰盛装，跳芦笙舞。客人受邀参加需尊重当地习俗，<strong>饮拦门酒</strong>表示欢迎。",tip:"银饰越多代表越富有和美丽"},
{id:8,name:"南方饮茶",en:"Tea Culture in South China",region:"广东/福建",category:"饮食文化",icon:"🫖",content:"广东人饮早茶讲究"叩手礼"——别人倒茶时<strong>手指弯曲叩桌面</strong>表示感谢。福建功夫茶品茶要<strong>先闻后品</strong>，不可一饮而尽。",tip:"叩手礼源于乾隆微服出巡的典故"},
{id:9,name:"数字禁忌",en:"Number Taboos",region:"全国",category:"禁忌须知",icon:"🔢",content:"<strong>4</strong>谐音"死"，尽量避免（楼层、房间号、电话）。<strong>8</strong>谐音"发"最受欢迎。<strong>6</strong>代表顺利。送礼数量选双数，葬礼相关选单数。",tip:"酒店通常跳过4楼和14楼"},
{id:10,name:"拍照礼仪",en:"Photography Etiquette",region:"全国",category:"社交礼仪",icon:"📷",content:"拍摄<strong>当地人</strong>尤其是少数民族居民前务必征得同意。军事设施、政府机关<strong>禁止拍照</strong>。寺院内注意标识是否允许拍照。",tip:"拍完给人看看照片是友好的表示"},
{id:11,name:"伊斯兰教禁忌",en:"Islamic Customs",region:"新疆",category:"宗教场所",icon:"🕌",content:"进入清真寺需<strong>脱鞋</strong>，女性建议戴头巾。斋月期间在公共场合<strong>避免进食</strong>。不要谈论敏感话题，尊重当地宗教信仰。",tip:"古尔邦节和肉孜节是重要节日"},
{id:12,name:"北方酒桌文化",en:"Northern Drinking Culture",region:"东北/山东",category:"饮食文化",icon:"🍺",content:"北方酒桌讲究<strong>"感情深一口闷"</strong>，但量力而行不必勉强。主人先敬酒，客人回敬。<strong>不要空杯</strong>，杯中留少许表示还有酒意。",tip:"以茶代酒也是可接受的替代方式"}
];
const grid=document.getElementById('cultureGrid');
const search=document.getElementById('searchInput');
const filterRow=document.getElementById('filterRow');
let currentFilter='all';
function render(){
const q=search.value.toLowerCase();
grid.innerHTML='';
CULTURE_DATA.filter(d=>{
const matchFilter=currentFilter==='all'||d.category===currentFilter;
const matchSearch=!q||d.name.toLowerCase().includes(q)||d.en.toLowerCase().includes(q)||d.region.includes(q)||d.content.includes(q);
return matchFilter&&matchSearch;
}).forEach(d=>{
grid.innerHTML+=`<div class="culture-card"><div class="c-header"><div class="c-icon">${d.icon}</div><div><div class="c-name">${d.name}</div><div class="c-region">${d.region} · ${d.en}</div></div></div><div class="c-content">${d.content}</div><div class="c-tip">💡 ${d.tip}</div></div>`;
});
}
filterRow.addEventListener('click',e=>{
if(e.target.classList.contains('filter-btn')){
filterRow.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
currentFilter=e.target.dataset.filter;
render();
}
});
search.addEventListener('input',render);
render();
</script>
</body>
</html>
