<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中文词语搜索</title><meta name="description" content="中文词语搜索 - 在汉字网格中找出隐藏的词语"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#d29922;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin:4px}.btn:hover{opacity:.85}.btn-group{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}.word-grid{display:inline-grid;gap:3px;margin:16px auto;background:var(--border);padding:3px;border-radius:8px}.grid-cell{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;background:var(--card);border-radius:4px;cursor:pointer;transition:all .15s;user-select:none}.grid-cell:hover{background:rgba(59,130,246,.15)}.grid-cell.selected{background:rgba(59,130,246,.3);color:var(--blue)}.grid-cell.found{background:rgba(35,134,54,.3);color:var(--green)}.word-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.word-item{padding:10px;background:var(--bg);border-radius:8px;text-align:center;font-size:.95rem;transition:all .2s}.word-item.found{background:rgba(35,134,54,.2);color:var(--green);text-decoration:line-through}.stats{display:flex;gap:16px;justify-content:center;margin:12px 0}.stat{text-align:center}.stat .num{font-size:1.3rem;font-weight:700;color:var(--blue)}.stat .lbl{font-size:.7rem;color:var(--text2)}.timer{font-size:1.1rem;color:var(--yellow);text-align:center;margin:8px 0}.hint-box{background:var(--bg);border-radius:8px;padding:12px;margin-top:12px;color:var(--text2);font-size:.85rem;text-align:center;display:none}.hint-box.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="中文词语搜索"><meta property="og:description" content="中文词语搜索 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔍 中文词语搜索</h1><p class="sub">在汉字网格中找出隐藏的词语</p>
<div class="card">
<div class="btn-group">
<button class="btn" onclick="newGame()">新游戏</button>
<button class="btn" onclick="showHint()">提示</button>
<button class="btn" onclick="revealWord()">揭示词语</button>
</div>
<div class="timer">⏱ <span id="timer">00:00</span></div>
<div class="stats">
<div class="stat"><div class="num" id="foundCount">0</div><div class="lbl">已找到</div></div>
<div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">总词语</div></div>
<div class="stat"><div class="num" id="hintsUsed">0</div><div class="lbl">使用提示</div></div>
</div>
<div style="text-align:center;overflow-x:auto;padding:10px">
<div class="word-grid" id="grid"></div>
</div>
<div class="word-list" id="wordList"></div>
<div class="hint-box" id="hintBox"></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var wordSets=[
{theme:'自然',words:['春风','夏雨','秋月','冬雪','山川','河流','森林','海洋','草原','沙漠']},
{theme:'动物',words:['龙凤','虎豹','鹤鹿','龟蛇','鱼虾','蝴蝶','蜜蜂','蜻蜓','蜘蛛','蚂蚁']},
{theme:'美食',words:['饺子','面条','包子','烧麦','月饼','粽子','汤圆','豆腐','茶叶','美酒']},
{theme:'文具',words:['毛笔','砚台','宣纸','墨汁','书签','铅笔','橡皮','剪刀','胶水','尺子']},
{theme:'节日',words:['春节','中秋','端午','清明','重阳','元宵','七夕','除夕','冬至','腊八']},
{theme:'颜色',words:['朱红','翠绿','金黄','靛蓝','紫罗','墨黑','雪白','杏粉','琥珀','珊瑚']},
{theme:'数字',words:['一心','二意','三思','四方','五彩','六艺','七星','八卦','九州','十年']},
{theme:'乐器',words:['琵琶','二胡','古筝','笛子','萧管','编钟','笙簧','琴瑟','鼓乐','唢呐']}
];
var size=12,grid=[],wordPositions=[],foundWords=[],selectedCells=[],timerInterval=null,elapsed=0,hintsUsed=0;
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function newGame(){
clearInterval(timerInterval);elapsed=0;hintsUsed=0;foundWords=[];selectedCells=[];wordPositions=[];
var set=wordSets[Math.floor(Math.random()*wordSets.length)];
var words=shuffle(set.words).slice(0,8);
grid=[];for(var r=0;r<size;r++){grid[r]=[];for(var c=0;c<size;c++){grid[r][c]='';}}
var dirs=[[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1],[1,-1],[-1,1]];
words.forEach(function(word){
var placed=false;var attempts=0;
while(!placed&&attempts<200){
var dir=dirs[Math.floor(Math.random()*dirs.length)];
var r=Math.floor(Math.random()*size);var c=Math.floor(Math.random()*size);
var canPlace=true;var positions=[];
for(var i=0;i<word.length;i++){
var nr=r+dir[0]*i;var nc=c+dir[1]*i;
if(nr<0||nr>=size||nc<0||nc>=size){canPlace=false;break;}
if(grid[nr][nc]!==''){canPlace=false;break;}
positions.push([nr,nc]);
}
if(canPlace){
for(var i=0;i<word.length;i++){grid[positions[i][0]][positions[i][1]]=word[i];}
wordPositions.push({word:word,positions:positions,found:false});
placed=true;
}
attempts++;
}
});
for(var r=0;r<size;r++){for(var c=0;c<size;c++){
if(grid[r][c]===''){var chars='春夏秋冬山水木石金土人口目手心天地日月水火花鸟鱼虫龙虎马牛羊';grid[r][c]=chars[Math.floor(Math.random()*chars.length)];}
}}
renderGrid();renderWordList();
document.getElementById('foundCount').textContent='0';
document.getElementById('totalCount').textContent=wordPositions.length;
document.getElementById('hintsUsed').textContent='0';
document.getElementById('hintBox').className='hint-box';
startTimer();
}
function renderGrid(){
var g=document.getElementById('grid');
g.style.gridTemplateColumns='repeat('+size+',40px)';
var html='';
for(var r=0;r<size;r++){
for(var c=0;c<size;c++){
html+='<div class="grid-cell" data-row="'+r+'" data-col="'+c+'" onclick="clickCell('+r+','+c+')">'+grid[r][c]+'</div>';
}
}
g.innerHTML=html;
}
function renderWordList(){
var html='';wordPositions.forEach(function(wp,i){
html+='<div class="word-item" id="word-'+i+'">'+wp.word+'</div>';
});
document.getElementById('wordList').innerHTML=html;
}
function clickCell(r,c){
var idx=selectedCells.findIndex(function(sc){return sc[0]===r&&sc[1]===c;});
if(idx>=0){selectedCells.splice(idx,1);document.querySelector('[data-row="'+r+'"][data-col="'+c+'"]').classList.remove('selected');}
else{selectedCells.push([r,c]);document.querySelector('[data-row="'+r+'"][data-col="'+c+'"]').classList.add('selected');}
checkSelection();
}
function checkSelection(){
if(selectedCells.length<2)return;
var selectedChars=selectedCells.map(function(sc){return grid[sc[0]][sc[1]];}).join('');
wordPositions.forEach(function(wp,i){
if(wp.found)return;
if(selectedChars===wp.word||selectedChars.split('').reverse().join('')===wp.word){
wp.found=true;foundWords.push(wp.word);
wp.positions.forEach(function(p){
var cell=document.querySelector('[data-row="'+p[0]+'"][data-col="'+p[1]+'"]');
cell.classList.remove('selected');cell.classList.add('found');
});
document.getElementById('word-'+i).classList.add('found');
document.getElementById('foundCount').textContent=foundWords.length;
selectedCells=[];
if(foundWords.length===wordPositions.length){
clearInterval(timerInterval);
alert('🎉 恭喜！全部找到！用时 '+formatTime(elapsed));
}
}
});
}
function showHint(){
var unfound=wordPositions.filter(function(wp){return !wp.found;});
if(unfound.length===0)return;
var wp=unfound[Math.floor(Math.random()*unfound.length)];
var cell=document.querySelector('[data-row="'+wp.positions[0][0]+'"][data-col="'+wp.positions[0][1]+'"]');
cell.style.background='rgba(210,153,34,.3)';setTimeout(function(){cell.style.background='';},2000);
document.getElementById('hintBox').textContent='💡 提示：第一个字是「'+wp.word[0]+'」';
document.getElementById('hintBox').className='hint-box show';
hintsUsed++;document.getElementById('hintsUsed').textContent=hintsUsed;
}
function revealWord(){
var unfound=wordPositions.filter(function(wp){return !wp.found;});
if(unfound.length===0)return;
var wp=unfound[0];
wp.found=true;foundWords.push(wp.word);
wp.positions.forEach(function(p){
var cell=document.querySelector('[data-row="'+p[0]+'"][data-col="'+p[1]+'"]');
cell.classList.add('found');
});
var wordIdx=wordPositions.indexOf(wp);
document.getElementById('word-'+wordIdx).classList.add('found');
document.getElementById('foundCount').textContent=foundWords.length;
}
function startTimer(){
timerInterval=setInterval(function(){elapsed++;document.getElementById('timer').textContent=formatTime(elapsed);},1000);
}
function formatTime(s){var m=Math.floor(s/60);var sec=s%60;return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;}
newGame();
</script></body></html>
