<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇道具</title>
<meta name="description" content="贪吃蛇道具版，吃道具获得特殊能力">
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --accent:#3b82f6; }[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px; }
h1 { color:var(--accent); margin-bottom:8px; font-size:1.5rem; }
.hud { display:flex; gap:12px; margin:10px 0; flex-wrap:wrap; justify-content:center; }
.hud span { background:var(--card); border:1px solid var(--border); padding:6px 14px; border-radius:8px; font-size:0.9rem; }
.buffs { display:flex; gap:8px; margin:6px 0; flex-wrap:wrap; justify-content:center; }
.buff { padding:4px 10px; border-radius:12px; font-size:0.8rem; color:var(--text); }
canvas { border:2px solid var(--accent); border-radius:4px; display:block; margin:10px 0; }
.controls { display:flex; gap:10px; margin-top:8px; }
button { background:var(--accent); color:var(--text); border:none; padding:8px 20px; border-radius:6px; cursor:pointer; font-size:1rem; }
button:hover { opacity:0.85; }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="贪吃蛇道具">
  <meta property="og:description" content="贪吃蛇道具版，吃道具获得特殊能力">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/snake-powerup/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>⚡ 贪吃蛇道具</h1>
<div class="hud">
<span id="score">得分: 0</span>
<span id="length">长度: 3</span>
<span id="time">时间: 0s</span>
</div>
<div class="buffs" id="buffs"></div>
<canvas id="game" width="400" height="400"></canvas>
<div class="controls">
<button onclick="startGame()">开始游戏</button>
<button onclick="pauseGame()">暂停</button>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const G=20,C=20,R=20;
let snake,dir,nextDir,food,powerups,score,alive,paused,startTime,tick,gameLoop;
const PT=[
  {type:'speed',color:'#eab308',icon:'⚡',name:'加速',dur:200},
  {type:'phase',color:'#a855f7',icon:'🌀',name:'穿墙',dur:300},
  {type:'shield',color:'#06b6d4',icon:'🛡',name:'护盾',dur:250},
  {type:'magnet',color:'#f472b6',icon:'🧲',name:'磁铁',dur:200},
  {type:'slow',color:'#84cc16',icon:'🐌',name:'减速',dur:180},
  {type:'bonus',color:'#f97316',icon:'⭐',name:'双倍分',dur:250},
];
function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};score=0;alive=true;paused=false;tick=0;startTime=Date.now();
  powerups=[];activeBuffs={};
  spawnFood();spawnPowerup();spawnPowerup();updateHUD();
}
let activeBuffs={};
function spawnFood(){
  do{food={x:Math.floor(Math.random()*C),y:Math.floor(Math.random()*R)};}
  while(snake.some(s=>s.x===food.x&&s.y===food.y)||powerups.some(p=>p.x===food.x&&p.y===food.y));
}
function spawnPowerup(){
  if(powerups.length>=4)return;
  const t=PT[Math.floor(Math.random()*PT.length)];
  let p;do{p={x:Math.floor(Math.random()*C),y:Math.floor(Math.random()*R),...t};}
  while(snake.some(s=>s.x===p.x&&s.y===p.y)||(p.x===food.x&&p.y===food.y));
  powerups.push(p);
}
function activateBuff(type){
  const t=PT.find(p=>p.type===type);
  activeBuffs[type]=t.dur;
}
function updateHUD(){
  document.getElementById('score').textContent='得分: '+score;
  document.getElementById('length').textContent='长度: '+snake.length;
  const el=document.getElementById('buffs');
  el.innerHTML='';
  for(const[k,v]of Object.entries(activeBuffs)){
    const t=PT.find(p=>p.type===k);
    if(t&&v>0){
      const d=document.createElement('div');d.className='buff';
      d.style.background=t.color;d.textContent=t.icon+' '+t.name+' '+Math.ceil(v/10)+'s';
      el.appendChild(d);
    }
  }
}
function step(){
  if(!alive||paused)return;
  tick++;
  if(tick%10===0){document.getElementById('time').textContent='时间: '+Math.floor(tick/10)+'s';}
  dir={...nextDir};
  let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(activeBuffs.phase>0){head.x=(head.x+C)%C;head.y=(head.y+R)%R;}
  else if(head.x<0||head.x>=C||head.y<0||head.y>=R){alive=false;draw();return garyyToast('游戏结束！得分: '+score);}
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){
    if(activeBuffs.shield>0){activeBuffs.shield=0;}
    else{alive=false;draw();return garyyToast('游戏结束！得分: '+score);}
  }
  snake.unshift(head);let ate=false;
  if(activeBuffs.magnet>0){
    const dx=snake[0].x-food.x,dy=snake[0].y-food.y;
    if(Math.abs(dx)+Math.abs(dy)<=3){
    }
  }
  if(head.x===food.x&&head.y===food.y){
    const mult=activeBuffs.bonus>0?2:1;
    score+=10*mult;ate=true;spawnFood();spawnPowerup();
  }
  const pi=powerups.findIndex(p=>p.x===head.x&&p.y===head.y);
  if(pi!==-1){activateBuff(powerups[pi].type);powerups.splice(pi,1);}
  if(!ate)snake.pop();
  for(const k in activeBuffs){if(activeBuffs[k]>0)activeBuffs[k]--;}
  draw();updateHUD();
}
function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#1a2030';ctx.lineWidth=0.5;
  for(let x=0;x<=C;x++){ctx.beginPath();ctx.moveTo(x*G,0);ctx.lineTo(x*G,canvas.height);ctx.stroke();}
  for(let y=0;y<=R;y++){ctx.beginPath();ctx.moveTo(0,y*G);ctx.lineTo(canvas.width,y*G);ctx.stroke();}
  ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(food.x*G+G/2,food.y*G+G/2,G/2-2,0,Math.PI*2);ctx.fill();
  powerups.forEach(p=>{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x*G+G/2,p.y*G+G/2,G/2-1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(p.icon,p.x*G+G/2,p.y*G+G/2+4);});
  snake.forEach((s,i)=>{
    if(activeBuffs.shield>0)ctx.fillStyle=i===0?'#06b6d4':'#0891b2';
    else if(activeBuffs.phase>0)ctx.fillStyle=i===0?'#a855f7':'#7c3aed';
    else if(activeBuffs.speed>0)ctx.fillStyle=i===0?'#eab308':'#ca8a04';
    else ctx.fillStyle=i===0?'#22c55e':'#16a34a';
    ctx.fillRect(s.x*G+1,s.y*G+1,G-2,G-2);
  });
  if(!alive){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#ef4444';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
    ctx.fillText('游戏结束',canvas.width/2,canvas.height/2-10);
    ctx.fillStyle='#e6edf3';ctx.font='18px sans-serif';
    ctx.fillText('得分: '+score,canvas.width/2,canvas.height/2+20);
  }
}
function startGame(){clearInterval(gameLoop);init();draw();gameLoop=setInterval(step,100);}
function pauseGame(){paused=!paused;}
document.addEventListener('keydown',e=>{
  const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
  const nd=m[e.key];if(nd&&(nd.x+dir.x!==0||nd.y+dir.y!==0)){nextDir=nd;e.preventDefault();}
});
let tx,ty;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  let nd;if(Math.abs(dx)>Math.abs(dy))nd={x:dx>0?1:-1,y:0};else nd={x:0,y:dy>0?1:-1};
  if(nd.x+dir.x!==0||nd.y+dir.y!==0)nextDir=nd;
});
init();draw();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
