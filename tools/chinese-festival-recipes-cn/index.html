<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国节日美食大全</title><meta name="description" content="中国节日美食大全 - 传统节日应节食品指南"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{opacity:.85}.btn-secondary{background:var(--border);color:var(--text)}.btn-success{background:var(--green);color:#fff}.hidden{display:none}.cat-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.cat-tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s}.cat-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.food-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}.food-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;transition:all .2s;cursor:pointer}.food-card:hover{border-color:var(--blue);transform:translateY(-2px)}.food-icon{font-size:2rem;margin-bottom:8px}.food-name{font-size:1.05rem;font-weight:600;margin-bottom:4px}.food-festival{font-size:.8rem;color:var(--blue);margin-bottom:6px}.food-desc{font-size:.85rem;color:var(--text2);line-height:1.5;margin-bottom:8px}.food-meta{display:flex;gap:6px;flex-wrap:wrap}.food-tag{padding:2px 8px;border-radius:10px;font-size:.7rem;background:rgba(59,130,246,.1);color:var(--blue)}.food-detail{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;animation:fadeIn .3s ease}.food-detail h3{margin-bottom:12px}.food-detail .section{margin-bottom:12px}.food-detail .section-title{font-size:.85rem;color:var(--blue);font-weight:600;margin-bottom:6px}.food-detail .section ul{margin:0;padding-left:20px}.food-detail .section li{font-size:.9rem;line-height:1.7;color:var(--text2)}.random-box{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(35,134,54,.1));border:2px solid var(--blue);border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:16px}.random-box .food-emoji{font-size:3rem;margin:10px 0}.random-box .food-suggest{font-size:1.1rem;font-weight:600}.random-box .food-suggest-desc{font-size:.9rem;color:var(--text2);margin-top:6px}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.shop-list{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px}.shop-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}.shop-item:last-child{border:none}.shop-item label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.9rem}.shop-item .del{color:var(--red);cursor:pointer;font-size:.8rem}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}</style><meta property="og:title" content="中国节日美食大全"><meta property="og:description" content="中国节日美食大全 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥟</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🥟 中国节日美食大全</h1><p class="sub">传统节日应节食品指南</p>
<div class="random-box"><div class="food-emoji" id="randomEmoji">🍲</div><div class="food-suggest" id="randomName">点击下方按钮获取推荐</div><div class="food-suggest-desc" id="randomDesc"></div><button class="btn btn-primary" onclick="randomFood()" style="margin-top:12px">🎲 今天吃什么</button></div>
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索美食..." oninput="filterFoods()"></div>
<div class="cat-tabs" id="catTabs"><span class="cat-tab active" onclick="selectCat(this,'all')">全部节日</span><span class="cat-tab" onclick="selectCat(this,'春节')">🧧 春节</span><span class="cat-tab" onclick="selectCat(this,'元宵节')">🏮 元宵</span><span class="cat-tab" onclick="selectCat(this,'端午节')">🐲 端午</span><span class="cat-tab" onclick="selectCat(this,'中秋节')">🌕 中秋</span><span class="cat-tab" onclick="selectCat(this,'清明节')">🌿 清明</span><span class="cat-tab" onclick="selectCat(this,'腊八节')">🥣 腊八</span><span class="cat-tab" onclick="selectCat(this,'除夕')">🎆 除夕</span></div>
<div id="foodList"></div>
<div id="foodDetail" class="hidden"></div>
<div class="card"><h3 style="margin-bottom:8px">🛒 购物清单</h3><div id="shopList"><p style="color:var(--text2);font-size:.85rem">点击食物卡片上的"加入清单"添加食材</p></div><button class="btn btn-secondary" onclick="clearShop()" style="margin-top:8px;font-size:.8rem">清空清单</button></div></div>
<script src="../i18n.js" defer></script>
<script>
var foods=[
{name:'饺子',icon:'🥟',festival:'春节',desc:'北方春节必备，形如元宝寓意招财进宝',ingredients:['面粉','猪肉','白菜/韭菜','葱姜','酱油','香油'],steps:['面粉加水揉成面团，醒面30分钟','肉馅加调料搅拌上劲','蔬菜切碎拌入肉馅','擀皮包饺子，捏出褶子','水开下饺子，煮至浮起再煮2分钟'],difficulty:'中等',tags:['北方','主食']},
{name:'年糕',icon:'🍰',festival:'春节',desc:'寓意"年年高升"，南方春节传统食品',ingredients:['糯米粉','糖','红枣','桂花'],steps:['糯米粉加糖和水搅拌','倒入模具撒上红枣','大火蒸30分钟','出锅撒桂花即可'],difficulty:'简单',tags:['南方','甜食']},
{name:'汤圆',icon:'🥣',festival:'元宵节',desc:'象征团圆美满，正月十五必吃',ingredients:['糯米粉','黑芝麻','白糖','猪油'],steps:['黑芝麻炒熟碾碎','加糖和猪油拌成馅','糯米粉揉成面团','包入馅料搓圆','水开下汤圆煮至浮起'],difficulty:'中等',tags:['甜食','团圆']},
{name:'粽子',icon:'🫔',festival:'端午节',desc:'纪念屈原，用竹叶包裹糯米蒸制',ingredients:['糯米','竹叶/粽叶','红枣/豆沙/肉','棉线'],steps:['糯米浸泡4小时以上','粽叶洗净煮软','折成漏斗状填入米和馅','包裹扎紧','大火煮2-3小时'],difficulty:'困难',tags:['蒸制','糯米']},
{name:'月饼',icon:'🥮',festival:'中秋节',desc:'中秋必备，象征团圆，种类繁多',ingredients:['面粉','转化糖浆','枧水','花生油','豆沙/蛋黄'],steps:['糖浆加枧水和油搅拌均匀','筛入面粉揉成面团','分剂子包入馅料','模具压出花纹','烤箱180度烤15分钟'],difficulty:'困难',tags:['烘焙','甜食']},
{name:'青团',icon:'🟢',festival:'清明节',desc:'清明时令小吃，用艾草汁和糯米粉制成',ingredients:['糯米粉','艾草汁','豆沙','白糖'],steps:['艾草焯水打成汁','糯米粉加艾草汁揉成团','分成小份包入豆沙','搓圆后蒸10分钟','出锅刷一层油防粘'],difficulty:'中等',tags:['时令','绿色']},
{name:'腊八粥',icon:'🥣',festival:'腊八节',desc:'多种谷物熬制，寓意五谷丰登',ingredients:['大米','红豆','绿豆','花生','红枣','桂圆','莲子','百合'],steps:['所有豆类提前浸泡一晚','大火煮开转小火慢熬','不时搅拌防止糊底','熬至粘稠加糖调味'],difficulty:'简单',tags:['养生','杂粮']},
{name:'年夜饭鱼',icon:'🐟',festival:'除夕',desc:'寓意"年年有余"，整鱼上桌不可翻面',ingredients:['鱼','葱姜','料酒','酱油','醋','糖'],steps:['鱼处理干净划花刀','两面煎至金黄','加调料和水烧开','小火收汁装盘','上桌时鱼头朝尊位'],difficulty:'中等',tags:['寓意','硬菜']},
{name:'春卷',icon:'🌯',festival:'春节',desc:'寓意迎接新春，金黄酥脆',ingredients:['春卷皮','猪肉','豆芽','韭菜','香菇'],steps:['肉丝和蔬菜炒熟调味','春卷皮摊开放馅','卷起两边折好封口','油炸至金黄'],difficulty:'中等',tags:['油炸','小吃']},
{name:'汤面',icon:'🍜',festival:'元宵节',desc:'北方元宵节吃面条，寓意长命百岁',ingredients:['面条','鸡蛋','青菜','葱花','高汤'],steps:['高汤煮开下面条','打荷包蛋','加青菜烫熟','撒葱花出锅'],difficulty:'简单',tags:['面食','简单']},
{name:'桂花酒',icon:'🍶',festival:'中秋节',desc:'中秋赏月必备饮品，清香馥郁',ingredients:['桂花','白酒/米酒','冰糖'],steps:['桂花洗净晾干','瓶中放桂花和冰糖','倒入白酒密封','浸泡3个月以上'],difficulty:'中等',tags:['饮品','自制']},
{name:'糖瓜',icon:'🍬',festival:'小年',desc:'祭灶神的甜食，让灶王嘴甜上天言好事',ingredients:['麦芽糖','芝麻'],steps:['麦芽糖加热软化','拉成条状','切小块沾芝麻','冷却变硬即可'],difficulty:'简单',tags:['甜食','祭灶']},
{name:'重阳糕',icon:'🍰',festival:'重阳节',desc:'寓意"步步高升"，重阳节必备',ingredients:['糯米粉','粳米粉','糖','红枣','桂花'],steps:['两种米粉加糖混合','加水搅拌至松散','过筛入模撒红枣','大火蒸20分钟'],difficulty:'中等',tags:['蒸制','糕点']},
{name:'巧果',icon:'⭐',festival:'七夕节',desc:'七夕乞巧食品，油炸面食小点心',ingredients:['面粉','糖','芝麻','油'],steps:['面粉加糖和油揉团','用模具压出花样','油炸至金黄','撒芝麻装饰'],difficulty:'简单',tags:['油炸','小食']},
{name:'屠苏酒',icon:'🍶',festival:'春节',desc:'古代春节饮屠苏酒，从小到大依次饮用',ingredients:['大黄','白术','桂枝','防风','花椒'],steps:['药材装入纱布袋','浸入白酒中','密封浸泡数日','春节取出温饮'],difficulty:'困难',tags:['药酒','古代']},
{name:'胶牙饧',icon:'🍬',festival:'春节',desc:'古代春节糖果，粘住牙齿寓意留住好运',ingredients:['麦芽糖','糯米'],steps:['糯米蒸熟','加入麦芽发酵','过滤熬煮','拉丝成糖'],difficulty:'困难',tags:['古代','糖果']}
];

var currentCat='all',shopItems=JSON.parse(localStorage.getItem('festivalShop')||'[]');

function selectCat(el,cat){
  document.querySelectorAll('.cat-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');currentCat=cat;filterFoods();
}

function filterFoods(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=foods.filter(function(f){
    if(currentCat!=='all'&&f.festival!==currentCat)return false;
    if(search&&!f.name.toLowerCase().includes(search)&&!f.desc.toLowerCase().includes(search)&&!f.tags.join('').toLowerCase().includes(search))return false;
    return true;
  });
  renderFoods(filtered);
}

function renderFoods(items){
  var h='<div class="food-grid">';
  items.forEach(function(f,i){
    h+='<div class="food-card" onclick="showDetail('+foods.indexOf(f)+')">';
    h+='<div class="food-icon">'+f.icon+'</div>';
    h+='<div class="food-name">'+f.name+'</div>';
    h+='<div class="food-festival">📅 '+f.festival+'</div>';
    h+='<div class="food-desc">'+f.desc+'</div>';
    h+='<div class="food-meta">'+f.tags.map(function(t){return '<span class="food-tag">'+t+'</span>'}).join('')+'</div>';
    h+='<button class="btn btn-secondary" onclick="event.stopPropagation();addShop('+foods.indexOf(f)+')" style="margin-top:10px;font-size:.8rem;padding:6px 12px">🛒 加入清单</button>';
    h+='</div>';
  });
  h+='</div>';
  document.getElementById('foodList').innerHTML=h;
  document.getElementById('foodDetail').classList.add('hidden');
}

function showDetail(idx){
  var f=foods[idx];
  var h='<div class="food-detail">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  h+='<h3>'+f.icon+' '+f.name+'</h3>';
  h+='<button class="btn btn-secondary" onclick="filterFoods()" style="font-size:.8rem">← 返回</button></div>';
  h+='<p style="color:var(--text2);margin-bottom:12px">'+f.desc+'</p>';
  h+='<div class="section"><div class="section-title">📋 所需食材</div><ul>'+f.ingredients.map(function(i){return '<li>'+i+'</li>'}).join('')+'</ul></div>';
  h+='<div class="section"><div class="section-title">👨‍🍳 制作步骤</div><ol style="padding-left:20px">'+f.steps.map(function(s){return '<li style="font-size:.9rem;line-height:1.8;color:var(--text2)">'+s+'</li>'}).join('')+'</ol></div>';
  h+='<div class="section"><div class="section-title">📊 难度: '+f.difficulty+'</div></div>';
  h+='<button class="btn btn-success" onclick="addShop('+idx+')" style="width:100%">🛒 将食材加入购物清单</button></div>';
  document.getElementById('foodDetail').innerHTML=h;
  document.getElementById('foodDetail').classList.remove('hidden');
  document.getElementById('foodList').innerHTML='';
}

function addShop(idx){
  var f=foods[idx];
  f.ingredients.forEach(function(ing){
    if(shopItems.indexOf(f.name+' - '+ing)===-1)shopItems.push(f.name+' - '+ing);
  });
  localStorage.setItem('festivalShop',JSON.stringify(shopItems));
  renderShop();
}

function renderShop(){
  var el=document.getElementById('shopList');
  if(!shopItems.length){el.innerHTML='<p style="color:var(--text2);font-size:.85rem">购物清单为空</p>';return}
  var h='';
  shopItems.forEach(function(item,i){
    h+='<div class="shop-item"><label><input type="checkbox"> '+item+'</label><span class="del" onclick="removeShop('+i+')">✕</span></div>';
  });
  el.innerHTML=h;
}

function removeShop(idx){shopItems.splice(idx,1);localStorage.setItem('festivalShop',JSON.stringify(shopItems));renderShop()}
function clearShop(){shopItems=[];localStorage.setItem('festivalShop',JSON.stringify(shopItems));renderShop()}

function randomFood(){
  var f=foods[Math.floor(Math.random()*foods.length)];
  document.getElementById('randomEmoji').textContent=f.icon;
  document.getElementById('randomName').textContent=f.name+' - '+f.festival;
  document.getElementById('randomDesc').textContent=f.desc;
}

filterFoods();renderShop();
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input');if(inp)inp.focus()}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur()}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0})</script>
</body></html>
