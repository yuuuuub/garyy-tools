<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>障碍赛道</title>
<meta name="description" content="障碍赛跑游戏，躲避障碍冲向终点">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:centerpadding:16px;scroll-behavior:smooth;}
canvas{border:2px solid var(--border);border-radius:8px;display:block}
.ui{display:flex;gap:16px;margin-bottom:12px;font-size:14px}
.ui span{background:var(--card);padding:6px 14px;border-radius:6px;border:1px solid var(--border)}
.btn{background:var(--accent);color:var(--text);border:none;padding:10px 24px;border-radius:6px;font-size:16px;cursor:pointer;margin-top:12px}
.btn:hover{opacity:.85}
#overlay{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,17,23,.9);border-radius:12px;padding:32px;text-align:center}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="障碍赛道">
  <meta property="og:description" content="障碍赛跑游戏，躲避障碍冲向终点">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/obstacle-course/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1 style="text-align:center;padding:20px 0;font-size:1.5rem">障碍赛道</h1>
<div class="ui">
<span id="levelText">关卡: 1</span>
<span id="timeText">时间: 0.0s</span>
<span id="deathText">死亡: 0</span>
</div>
<div style="position:relative">
<canvas id="c" width="600" height="400"></canvas>
<div id="overlay">
<h2 id="overlayTitle">障碍赛道</h2>
<p id="overlayDesc" style="margin:10px 0;color:#8b949e">跳跃翻越尖刺、移动平台、旋转障碍，到达终点！</p>
<button class="btn" id="overlayBtn" onclick="startGame()">开始游戏</button>
<p style="margin-top:8px;font-size:12px;color:#8b949e">方向键/WASD 移动 | 空格/↑ 跳跃</p>
</div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=600,H=400,GRAVITY=0.6,JUMP=-12,MOVE=4;
let player,platforms,spikes,rotors,goal,keys={},level=1,deaths=0,startTime=0,gameState='idle',animFrame;
const overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlayTitle'),overlayDesc=document.getElementById('overlayDesc'),overlayBtn=document.getElementById('overlayBtn');
function createLevel(lv){
  platforms=[{x:0,y:H-40,w:W,h:40}];
  spikes=[];rotors=[];
  if(lv===1){
    platforms.push({x:120,y:280,w:100,h:20},{x:280,y:220,w:100,h:20},{x:420,y:160,w:120,h:20});
    spikes.push({x:200,y:H-60,w:40,h:20},{x:350,y:H-60,w:40,h:20});
    rotors.push({x:500,y:200,r:30,speed:0.02});
    goal={x:570,y:130,w:20,h:30};
  }else if(lv===2){
    platforms.push({x:80,y:300,w:80,h:18},{x:200,y:250,w:100,h:18},{x:350,y:200,w:80,h:18},{x:460,y:260,w:100,h:18},{x:540,y:150,w:60,h:18});
    spikes.push({x:160,y:H-60,w:60,h:20},{x:300,y:H-60,w:40,h:20},{x:420,y:H-60,w:60,h:20});
    rotors.push({x:280,y:180,r:35,speed:0.03},{x:500,y:120,r:25,speed:-0.04});
    goal={x:570,y:120,w:20,h:30};
  }else{
    const pw=80+Math.random()*40;
    for(let i=0;i<6+lv;i++){
      platforms.push({x:60+i*90,y:200+Math.random()*140,w:pw,h:16});
    }
    for(let i=0;i<2+lv;i++){
      spikes.push({x:80+i*120,y:H-60,w:30+Math.random()*30,h:20});
    }
    for(let i=0;i<lv;i++){
      rotors.push({x:150+i*130,y:150+Math.random()*100,r:25+Math.random()*15,speed:0.02*(i%2?1:-1)});
    }
    goal={x:560,y:100,w:20,h:30};
  }
}
function resetPlayer(){
  player={x:30,y:H-80,w:24,h:36,vx:0,vy:0,onGround:false,facing:1};
}
function startGame(){
  level=1;deaths=0;gameState='playing';startTime=Date.now();
  createLevel(level);resetPlayer();
  overlay.style.display='none';
  if(animFrame)cancelAnimationFrame(animFrame);
  loop();
}
function nextLevel(){
  level++;
  createLevel(level);resetPlayer();
}
function die(){
  deaths++;
  resetPlayer();
}
function update(){
  const p=player;
  p.vx=0;
  if(keys['ArrowLeft']||keys['KeyA']){p.vx=-MOVE;p.facing=-1}
  if(keys['ArrowRight']||keys['KeyD']){p.vx=MOVE;p.facing=1}
  if((keys['Space']||keys['ArrowUp']||keys['KeyW'])&&p.onGround){p.vy=JUMP;p.onGround=false}
  p.vy+=GRAVITY;p.x+=p.vx;p.y+=p.vy;
  p.onGround=false;
  for(const pl of platforms){
    if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>pl.y&&p.y+p.h<pl.y+pl.h+12&&p.vy>=0){
      p.y=pl.y-p.h;p.vy=0;p.onGround=true;
    }
  }
  if(p.x<0)p.x=0;if(p.x+p.w>W)p.x=W-p.w;
  if(p.y>H){die();return}
  for(const s of spikes){
    if(p.x+p.w>s.x+5&&p.x<s.x+s.w-5&&p.y+p.h>s.y){die();return}
  }
  for(const r of rotors){
    r.angle=(r.angle||0)+r.speed;
    const rx=r.x+Math.cos(r.angle)*r.r*0.5,ry=r.y+Math.sin(r.angle)*r.r*0.5;
    if(Math.hypot(p.x+p.w/2-rx,p.y+p.h/2-ry)<r.r*0.6){die();return}
  }
  if(goal&&p.x+p.w>goal.x&&p.x<goal.x+goal.w&&p.y+p.h>goal.y&&p.y<goal.y+goal.h){
    nextLevel();
  }
}
function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#161b22';ctx.lineWidth=1;
  for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}
  for(let i=0;i<H;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke()}
  ctx.fillStyle='#21262d';
  for(const p of platforms){
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle='#30363d';ctx.fillRect(p.x,p.y,p.w,2);ctx.fillStyle='#21262d';
  }
  ctx.fillStyle='#f85149';
  for(const s of spikes){
    ctx.beginPath();
    const n=Math.floor(s.w/15);
    for(let i=0;i<n;i++){
      ctx.moveTo(s.x+i*(s.w/n),s.y+s.h);
      ctx.lineTo(s.x+i*(s.w/n)+s.w/n/2,s.y);
      ctx.lineTo(s.x+(i+1)*(s.w/n),s.y+s.h);
    }
    ctx.fill();
  }
  for(const r of rotors){
    r.angle=(r.angle||0)+r.speed;
    ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.angle);
    ctx.fillStyle='#f0883e';ctx.fillRect(-r.r,-4,r.r*2,8);
    ctx.fillRect(-4,-r.r,8,r.r*2);
    ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  if(goal){
    ctx.fillStyle='#3fb950';ctx.fillRect(goal.x,goal.y,goal.w,goal.h);
    ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.fillText('🏁',goal.x+2,goal.y+22);
  }
  const p=player;
  ctx.fillStyle=var_accent;ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='#fff';ctx.fillRect(p.x+6,p.y+6,5,5);ctx.fillRect(p.x+14,p.y+6,5,5);
  document.getElementById('levelText').textContent='关卡: '+level;
  document.getElementById('timeText').textContent='时间: '+((Date.now()-startTime)/1000).toFixed(1)+'s';
  document.getElementById('deathText').textContent='死亡: '+deaths;
}
const var_accent='#3b82f6';
function loop(){
  if(gameState!=='playing')return;
  update();draw();
  animFrame=requestAnimationFrame(loop);
}
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
document.addEventListener('keyup',e=>{keys[e.code]=false});
let touchStartX=0,touchStartY=0;
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();const t=e.touches[0];touchStartX=t.clientX;touchStartY=t.clientY;
  if(gameState==='playing'){keys['Space']=true;setTimeout(()=>keys['Space']=false,150)}
});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();const t=e.touches[0];
  const dx=t.clientX-touchStartX;
  if(Math.abs(dx)>20){keys['ArrowLeft']=dx<0;keys['ArrowRight']=dx>0}
});
canvas.addEventListener('touchend',()=>{keys['ArrowLeft']=false;keys['ArrowRight']=false});
createLevel(1);resetPlayer();draw();
overlay.style.display='flex';
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
