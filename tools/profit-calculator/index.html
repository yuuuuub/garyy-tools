<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>利润计算器</title>
<meta name="description" content="利润计算器，快速计算营业利润、净利润和利润率">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vhscroll-behavior:smooth;padding:16px;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.result-big{text-align:center;padding:18px}
.result-big .label{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.result-big .value{font-size:2rem;font-weight:700}
.result-big .value.red{color:var(--red)}
.result-big .value.gold{color:var(--gold)}
.result-big .value.green{color:var(--green)}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.stat-card{text-align:center;padding:14px;background:var(--bg);border-radius:var(--radius)}
.stat-card .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:1.1rem;font-weight:700}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.breakdown-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.breakdown-item:last-child{border-bottom:none}
.breakdown-item .bl{color:var(--text2)}
.breakdown-item .br{font-weight:600}
.chart-bar-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.chart-bar-row .label{min-width:70px;font-size:.75rem;color:var(--text2)}
.chart-bar-row .bar-track{flex:1;height:16px;background:var(--bg);border-radius:4px;overflow:hidden}
.chart-bar-row .bar-fill{height:100%;border-radius:4px;transition:width .5s}
.chart-bar-row .val{min-width:60px;text-align:right;font-size:.75rem;font-weight:600}
.preset-group{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.preset-btn{padding:4px 12px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;background:var(--card);color:var(--text);cursor:pointer;transition:all .2s}
.preset-btn:hover{border-color:var(--blue);color:var(--blue)}
@media(max-width:640px){.form-row{flex-direction:column}.grid-3{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="利润计算器">
<meta property="og:description" content="利润计算器，快速计算营业利润、净利润和利润率">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/profit-calculator/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>💰 利润计算器</h1>
    <p>计算营业利润、净利润和利润率</p>
  </header>

  <div class="card">
    <div class="form-row">
      <div class="group">
        <label>总营收 (元)</label>
        <input type="number" id="revenue" value="500000" min="0" step="any">
      </div>
      <div class="group">
        <label>产品/服务成本 (元)</label>
        <input type="number" id="cogs" value="200000" min="0" step="any">
      </div>
    </div>
    <div class="form-row">
      <div class="group">
        <label>运营费用 (元)</label>
        <input type="number" id="opex" value="120000" min="0" step="any">
      </div>
      <div class="group">
        <label>其他费用 (元)</label>
        <input type="number" id="other" value="30000" min="0" step="any">
      </div>
    </div>
    <div class="form-row">
      <div class="group">
        <label>税率 (%)</label>
        <input type="number" id="taxRate" value="25" min="0" max="100" step="any">
      </div>
    </div>
    <div class="preset-group" id="presets"></div>
  </div>

  <div class="card">
    <div class="section-title">📊 计算结果</div>
    <div class="result-big" id="mainResult"></div>
    <div class="grid-3" id="statGrid"></div>
  </div>

  <div class="card">
    <div class="section-title">📊 利润构成</div>
    <div id="bars"></div>
  </div>

  <div class="card">
    <div class="section-title">📋 详细明细</div>
    <div id="details"></div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtInt=n=>n.toLocaleString('zh-CN');

const presets=[
  {name:'小企业',revenue:200000,cogs:80000,opex:60000,other:10000,taxRate:5},
  {name:'中型企业',revenue:2000000,cogs:800000,opex:500000,other:100000,taxRate:25},
  {name:'电商',revenue:1000000,cogs:600000,opex:200000,other:50000,taxRate:25},
  {name:'服务业',revenue:500000,cogs:150000,opex:150000,other:20000,taxRate:6}
];

function renderPresets(container,items){
  container.innerHTML=items.map(p=>`<button class="preset-btn" onclick="applyPreset(${JSON.stringify(p).replace(/"/g,'&quot;')})">${p.name}</button>`).join('');
}

window.applyPreset=function(p){
  $('revenue').value=p.revenue;
  $('cogs').value=p.cogs;
  $('opex').value=p.opex;
  $('other').value=p.other;
  $('taxRate').value=p.taxRate;
  calc();
};

function calc(){
  const revenue=+$('revenue').value||0;
  const cogs=+$('cogs').value||0;
  const opex=+$('opex').value||0;
  const other=+$('other').value||0;
  const taxRate=+$('taxRate').value||0;

  const grossProfit=revenue-cogs;
  const operatingProfit=revenue-cogs-opex-other;
  const pretaxProfit=operatingProfit;
  const taxAmount=Math.max(0,pretaxProfit*taxRate/100);
  const netProfit=pretaxProfit-taxAmount;
  const grossMargin=revenue>0?(grossProfit/revenue*100):0;
  const netMargin=revenue>0?(netProfit/revenue*100):0;
  const opMargin=revenue>0?(operatingProfit/revenue*100):0;

  const profitClass=netProfit>=0?'green':'red';
  const profitLabel=netProfit>=0?'净利润':'净亏损';

  $('mainResult').innerHTML=`
    <div class="label">${profitLabel}</div>
    <div class="value ${profitClass}">¥${fmt(netProfit)}</div>
  `;
  $('statGrid').innerHTML=`
    <div class="stat-card"><div class="label">毛利润</div><div class="value" style="color:var(--blue)">¥${fmt(grossProfit)}</div></div>
    <div class="stat-card"><div class="label">营业利润</div><div class="value" style="color:var(--gold)">¥${fmt(operatingProfit)}</div></div>
    <div class="stat-card"><div class="label">毛利率</div><div class="value" style="color:var(--green)">${grossMargin.toFixed(1)}%</div></div>
  `;
  const maxVal=Math.max(revenue,grossProfit,operatingProfit,netProfit,1);
  $('bars').innerHTML=`
    <div class="chart-bar-row"><div class="label">总营收</div><div class="bar-track"><div class="bar-fill" style="width:${revenue/maxVal*100}%;background:var(--blue)"></div></div><div class="val" style="color:var(--blue)">¥${fmtInt(revenue)}</div></div>
    <div class="chart-bar-row"><div class="label">毛利润</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,grossProfit)/maxVal*100}%;background:var(--green)"></div></div><div class="val" style="color:var(--green)">¥${fmtInt(grossProfit)}</div></div>
    <div class="chart-bar-row"><div class="label">营业利润</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,operatingProfit)/maxVal*100}%;background:var(--gold)"></div></div><div class="val" style="color:var(--gold)">¥${fmtInt(operatingProfit)}</div></div>
    <div class="chart-bar-row"><div class="label">${profitLabel}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,netProfit)/maxVal*100}%;background:${netProfit>=0?'var(--green)':'var(--red)'}"></div></div><div class="val" style="color:${netProfit>=0?'var(--green)':'var(--red)'}">¥${fmtInt(netProfit)}</div></div>
    <div style="text-align:center;font-size:.75rem;color:var(--text2);margin-top:8px">净利润率 ${netMargin.toFixed(2)}% | 营业利润率 ${opMargin.toFixed(2)}% | 有效税率 ${revenue>0?(taxAmount/revenue*100).toFixed(2):0}%</div>
  `;
  $('details').innerHTML=`
    <div class="breakdown-item"><span class="bl">总营收</span><span class="br">¥${fmt(revenue)}</span></div>
    <div class="breakdown-item"><span class="bl">产品/服务成本</span><span class="br" style="color:var(--red)">-¥${fmt(cogs)}</span></div>
    <div class="breakdown-item"><span class="bl">毛利润</span><span class="br" style="color:var(--green)">¥${fmt(grossProfit)}</span></div>
    <div class="breakdown-item"><span class="bl">运营费用</span><span class="br" style="color:var(--red)">-¥${fmt(opex)}</span></div>
    <div class="breakdown-item"><span class="bl">其他费用</span><span class="br" style="color:var(--red)">-¥${fmt(other)}</span></div>
    <div class="breakdown-item"><span class="bl">税前利润</span><span class="br">¥${fmt(pretaxProfit)}</span></div>
    <div class="breakdown-item"><span class="bl">税费 (${taxRate}%)</span><span class="br" style="color:var(--red)">-¥${fmt(taxAmount)}</span></div>
    <div class="breakdown-item"><span class="bl"><b>净利润</b></span><span class="br" style="color:${netProfit>=0?'var(--green)':'var(--red)'}"><b>¥${fmt(netProfit)}</b></span></div>
  `;
}
renderPresets($('presets'),presets);
[$('revenue'),$('cogs'),$('opex'),$('other'),$('taxRate')].forEach(el=>{el.addEventListener('input',calc);el.addEventListener('change',calc)});
calc();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
