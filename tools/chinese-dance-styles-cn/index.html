<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国舞蹈大全 - Chinese Dance Styles Encyclopedia</title>
<meta name="description" content="中国舞蹈大全，涵盖古典舞、民族舞、民间舞、现代舞等各类舞蹈的风格特点与代表作品">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国舞蹈大全 - Chinese Dance Styles Encyclopedia">
<meta property="og:description" content="中国舞蹈大全，涵盖古典舞、民族舞、民间舞、现代舞等各类舞蹈的风格特点与代表作品">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-dance-styles-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💃</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#fb923c;--accent2:#f97316}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#ea580c;--accent2:#c2410c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a00 0%,#2a1500 50%,#3d2200 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3a00;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#fb923c,#fdba74,#f97316,#ea580c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.dance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.dance-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.dance-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.dance-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.dance-card .dc-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dance-card .dc-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(251,146,60,0.15);color:var(--accent)}
.dance-card .dc-name{font-size:1.3em;font-weight:bold}
.dance-card .dc-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.dance-card .dc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.dance-card .dc-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.dance-card .dc-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.dance-card .dc-detail strong{color:var(--text)}
.dance-card .dc-works{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.dance-card .dc-works .wk-label{font-size:0.8em;color:var(--accent);margin-bottom:6px}
.dance-card .dc-works .wk-list{display:flex;flex-wrap:wrap;gap:6px}
.dance-card .dc-works .wk-tag{font-size:0.75em;padding:3px 10px;border-radius:10px;background:rgba(251,146,60,0.08);color:var(--accent);border:1px solid rgba(251,146,60,0.2)}
.dance-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.dance-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>💃 中国舞蹈大全</h1>
<p>Chinese Dance Styles Encyclopedia — 探索古典舞、民族舞、民间舞的韵律之美</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索舞蹈、民族或流派...（如"古典舞""孔雀舞""秧歌"）" title="Enter键搜索">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="古典舞">古典舞</button>
<button class="filter-btn" data-filter="民族舞">民族舞</button>
<button class="filter-btn" data-filter="民间舞">民间舞</button>
<button class="filter-btn" data-filter="现代舞">现代舞</button>
<button class="filter-btn" data-filter="宫廷舞">宫廷舞</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="dance-grid" id="danceGrid"></div>
</div>
<footer>中国舞蹈大全 — 翩翩起舞 · 韵律之美 · garyy.top</footer>
<script>
const danceData=[
{name:"中国古典舞",category:"古典舞",icon:"💃",subtitle:"身韵为魂",region:"全国",ethnicity:"汉族",description:"中国古典舞是以中国传统美学为基础的舞蹈体系，强调\"身韵\"——即身法与韵律的统一。动作讲究圆润流畅、刚柔并济。",works:["扇舞丹青","秦俑魂","踏歌","黄河"]},
{name:"敦煌舞",category:"古典舞",icon:"🏜️",subtitle:"飞天再现",region:"甘肃",ethnicity:"汉族",description:"敦煌舞以敦煌壁画中的舞姿为原型，重现了唐代飞天的优美舞姿。动作以\"S\"形曲线为特征，手势丰富多变。",works:["丝路花雨","飞天","千手观音","反弹琵琶"]},
{name:"傣族孔雀舞",category:"民族舞",icon:"🦚",subtitle:"孔雀公主",region:"云南",ethnicity:"傣族",description:"孔雀舞是傣族最具代表性的舞蹈，模仿孔雀的行走、飞翔、开屏等动作。杨丽萍的《雀之灵》将孔雀舞推向艺术巅峰。",works:["雀之灵","两棵树","月光","雀之恋"]},
{name:"蒙古族舞",category:"民族舞",icon:"🐎",subtitle:"草原雄风",region:"内蒙古",ethnicity:"蒙古族",description:"蒙古族舞以模仿骏马奔驰、雄鹰翱翔为特征，动作豪迈奔放。抖肩、揉臂、马步是其标志性动作。",works:["奔腾","鸿雁","蒙古人","盅碗舞"]},
{name:"藏族舞",category:"民族舞",icon:"🏔️",subtitle:"雪域高原",region:"西藏/青海",ethnicity:"藏族",description:"藏族舞分为\"锅庄\"\"弦子\"\"踢踏\"三大类。锅庄粗犷豪放，弦子优美抒情，踢踏节奏明快。",works:["洗衣歌","翻身农奴把歌唱","珠穆朗玛","弦歌悠悠"]},
{name:"维吾尔族舞",category:"民族舞",icon:"💃",subtitle:"天山风情",region:"新疆",ethnicity:"维吾尔族",description:"维吾尔族舞以旋转和头部动作著称，节奏明快活泼。移颈、翻腕、旋转是其标志性动作，充满热情与活力。",works:["掀起你的盖头来","新疆好","达坂城的姑娘","阿拉木汗"]},
{name:"秧歌",category:"民间舞",icon:"🎉",subtitle:"北方狂欢",region:"北方各地",ethnicity:"汉族",description:"秧歌是北方汉族最普及的民间舞蹈，逢年过节、庆典庙会必有秧歌表演。分为东北秧歌、河北秧歌、山东秧歌等。",works:["东北大秧歌","山东鼓子秧歌","河北地秧歌","陕北秧歌"]},
{name:"龙舞",category:"民间舞",icon:"🐉",subtitle:"龙腾四海",region:"全国",ethnicity:"汉族",description:"龙舞是中国最具代表性的民间舞蹈，多人执龙具舞动，表现龙的翻腾盘旋。有火龙、布龙、草龙等多种形式。",works:["火龙舞","布龙舞","板凳龙","百叶龙"]},
{name:"狮舞",category:"民间舞",icon:"🦁",subtitle:"醒狮精神",region:"广东/北方",ethnicity:"汉族",description:"狮舞分为南狮和北狮。南狮（醒狮）重意，造型威猛；北狮重技，动作逼真。是春节和庆典的传统表演项目。",works:["醒狮","高桩狮","北狮","火狮子"]},
{name:"现代舞·风之语",category:"现代舞",icon:"🌬️",subtitle:"当代探索",region:"全国",ethnicity:"各民族",description:"中国现代舞融合了西方现代舞技法和中国传统美学，探索新的舞蹈语言。代表团体有广东现代舞团、北京现代舞团等。",works:["雷和雨","水·问","半梦","红扇"]},
{name:"宫廷乐舞·霓裳羽衣",category:"宫廷舞",icon:"👑",subtitle:"盛唐风华",region:"西安",ethnicity:"汉族",description:"霓裳羽衣舞是唐代宫廷乐舞的巅峰之作，相传由唐玄宗创作。舞者身着霓裳羽衣，舞姿飘逸若仙，再现盛唐风华。",works:["霓裳羽衣曲","春莺啭","秦王破阵乐","踏摇娘"]},
{name:"花鼓灯",category:"民间舞",icon:"🪘",subtitle:"淮河风情",region:"安徽/河南",ethnicity:"汉族",description:"花鼓灯是淮河流域的民间舞蹈，融合舞蹈、歌唱、锣鼓于一体。表演热烈奔放，被誉为\"东方芭蕾\"。",works:["花鼓灯","兰花鼓","鼓架子","小花场"]},
{name:"摆手舞",category:"民间舞",icon:"🙌",subtitle:"土家风情",region:"湖南/湖北",ethnicity:"土家族",description:"摆手舞是土家族的传统舞蹈，在摆手堂前集体表演。动作以摆手为主，粗犷质朴，是土家族最重要的文化活动。",works:["大摆手","小摆手","茅古斯","跳丧舞"]},
{name:"锅庄",category:"民族舞",icon:"⭕",subtitle:"藏族集体舞",region:"西藏/四川",ethnicity:"藏族",description:"锅庄是藏族的集体舞蹈，男女围成圆圈，随歌声和脚步声起舞。动作刚健有力，节奏鲜明，是藏族最重要的社交舞蹈。",works:["弦子锅庄","踢踏锅庄","热巴锅庄","康巴锅庄"]},
{name:"扇子舞",category:"古典舞",icon:"🪭",subtitle:"扇韵飘逸",region:"全国",ethnicity:"汉族",description:"扇子舞以扇子为道具，通过扇子的开合、翻转、抖动等动作，表现舞者的内心情感。是古典舞中最具代表性的道具舞蹈。",works:["扇舞丹青","扇魂","春江花月夜","梁祝"]}
];
function getStats(data){const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});return cats}
function renderStats(data){const stats=getStats(data);document.getElementById('statsOverview').innerHTML=`<div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">舞蹈类型</div></div>`+Object.entries(stats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}
function renderCards(data){document.getElementById('danceGrid').innerHTML=data.map(m=>`<div class="dance-card" data-category="${m.category}"><div class="dc-header"><div class="dc-icon">${m.icon}</div><div><div class="dc-name">${m.name}</div><div class="dc-sub">${m.subtitle}</div></div></div><div class="dc-meta"><span>${m.category}</span><span>${m.region}</span><span>${m.ethnicity}</span></div><div class="dc-detail">${m.description}</div><div class="dc-works"><div class="wk-label">🎭 代表作品</div><div class="wk-list">${m.works.map(w=>`<span class="wk-tag">${w}</span>`).join('')}</div></div></div>`).join('')}
function filterCards(){const q=document.getElementById('searchInput').value.toLowerCase();const f=document.querySelector('.filter-btn.active').dataset.filter;const filtered=danceData.filter(m=>{const matchF=f==='all'||m.category===f;const matchQ=!q||m.name.toLowerCase().includes(q)||m.description.toLowerCase().includes(q)||m.region.toLowerCase().includes(q)||m.ethnicity.toLowerCase().includes(q);return matchF&&matchQ});renderCards(filtered);renderStats(filtered)}
document.getElementById('searchInput').addEventListener('input',filterCards);
document.getElementById('filterRow').addEventListener('click',e=>{if(e.target.classList.contains('filter-btn')){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');filterCards()}});
renderCards(danceData);renderStats(danceData);
</script>
</body>
</html>
