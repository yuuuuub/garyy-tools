<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行打包清单</title>
<meta property="og:title" content="旅行打包清单">
<meta property="og:description" content="旅行打包物品清单，确保出行不遗漏">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="旅行打包物品清单，确保出行不遗漏">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧳</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:16px;min-height:100vh;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.gr .st{text-align:center;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.gr .st .nm{font-size:1.4rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.75rem;color:var(--text2);margin-top:4px}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text);margin-right:4px;margin-bottom:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .3s;background:var(--accent)}
.progress-text{display:flex;justify-content:space-between;font-size:12px;color:var(--text2)}
.pct-text{text-align:center;font-size:1.2rem;font-weight:700;color:var(--accent);margin:4px 0}
.cat-group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.cat-header{padding:12px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:1px solid var(--border)}
.cat-header:hover{background:var(--bg)}
.cat-header .icon{font-size:1.2rem}
.cat-header .title{flex:1;font-weight:600;font-size:.95rem}
.cat-header .badge{padding:2px 8px;border-radius:10px;font-size:.75rem;background:var(--bg);color:var(--text2)}
.cat-header .badge.done{background:rgba(34,197,94,.15);color:var(--success)}
.cat-body{display:none;padding:8px 12px}
.cat-body.open{display:block}
.check-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;transition:background .15s}
.check-item:hover{background:var(--bg)}
.check-item input[type="checkbox"]{width:18px;height:18px;accent-color:var(--success);cursor:pointer;flex-shrink:0}
.check-item .name{flex:1;font-size:.9rem}
.check-item .name.done{text-decoration:line-through;color:var(--text2)}
.check-item .qty{font-size:.8rem;color:var(--text2);min-width:30px;text-align:center}
.check-item .dng{padding:2px 6px;font-size:.7rem}
.tpl-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .15s;text-align:center}
.tpl-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.tpl-card .tpl-icon{font-size:1.5rem;margin-bottom:4px}
.tpl-card .tpl-name{font-size:.85rem;font-weight:600}
.tpl-card .tpl-desc{font-size:.7rem;color:var(--text2);margin-top:2px}
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:16px}
.list-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.list-btn{padding:6px 14px;border-radius:8px;font-size:.85rem;background:var(--bg);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all .15s}
.list-btn:hover,.list-btn.active{background:var(--accent);color:var(--text);border-color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🧳 旅行打包清单</h1><p>确保出行不遗漏</p></div>

<div class="gr" id="stats"></div>

<div class="cd"><h2>📦 快速模板</h2>
<div class="template-grid" id="templates"></div></div>

<div class="cd"><h2>✈️ 创建清单</h2>
<label>清单名称</label><input type="text" id="listName" placeholder="如：日本7日游">
<div class="bg"><button onclick="createList()">➕ 创建新清单</button></div></div>

<div class="cd">
<h2>📋 我的清单</h2>
<div class="list-select" id="listTabs"></div>

<div id="listArea">
<div id="progressArea" class="hidden">
<div class="pct-text" id="pctText">0%</div>
<div class="progress-text"><span>打包进度</span><span id="progressLabel">0 / 0</span></div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<div id="addItemBar" class="hidden" style="margin-bottom:12px">
<div class="fr">
<div><label>物品名称</label><input type="text" id="itemName" placeholder="物品名称"></div>
<div><label>分类</label><select id="itemCat"></select></div>
</div>
<div class="fr" style="margin-top:8px">
<div><label>数量</label><input type="number" id="itemQty" value="1" min="1"></div>
<div style="display:flex;align-items:flex-end;gap:8px">
<button onclick="addItem()" style="flex:1">➕ 添加</button>
<button class="sec" onclick="exportList()" style="flex:1">📤 导出</button>
</div>
</div></div>

<div id="checklistArea"></div>
</div>
</div>

<div class="cd"><h2>🗑️ 数据管理</h2>
<div class="bg">
<button class="sec" onclick="exportAll()">📥 导出全部</button>
<button class="dng" onclick="clearAll()">🗑️ 清空全部</button>
</div></div>
</div>

<script>
const CATEGORIES=[
  {id:'docs',icon:'📄',name:'证件文件'},
  {id:'clothes',icon:'👕',name:'衣物'},
  {id:'electronics',icon:'📱',name:'电子产品'},
  {id:'toiletries',icon:'🧴',name:'洗漱用品'},
  {id:'medicine',icon:'💊',name:'药品'},
  {id:'food',icon:'🍖',name:'食品'},
  {id:'other',icon:'📋',name:'其他'}
];
const TEMPLATES=[
  {name:'短途旅行(3天)',icon:'🎒',desc:'周末短途',items:[
    {name:'身份证',cat:'docs',qty:1},{name:'手机充电器',cat:'electronics',qty:1},{name:'换洗内衣',cat:'clothes',qty:3},
    {name:'牙刷牙膏',cat:'toiletries',qty:1},{name:'洗面奶',cat:'toiletries',qty:1},{name:'创可贴',cat:'medicine',qty:1}
  ]},
  {name:'长途旅行(7天)',icon:'✈️',desc:'一周长途',items:[
    {name:'护照',cat:'docs',qty:1},{name:'身份证',cat:'docs',qty:1},{name:'手机充电器',cat:'electronics',qty:1},
    {name:'充电宝',cat:'electronics',qty:1},{name:'换洗内衣',cat:'clothes',qty:7},{name:'外套',cat:'clothes',qty:1},
    {name:'牙刷牙膏',cat:'toiletries',qty:1},{name:'洗面奶',cat:'toiletries',qty:1},{name:'毛巾',cat:'toiletries',qty:1},
    {name:'感冒药',cat:'medicine',qty:1},{name:'止泻药',cat:'medicine',qty:1},{name:'防晒霜',cat:'toiletries',qty:1}
  ]},
  {name:'商务出差',icon:'💼',desc:'出差必备',items:[
    {name:'身份证',cat:'docs',qty:1},{name:'名片',cat:'docs',qty:1},{name:'笔记本电脑',cat:'electronics',qty:1},
    {name:'文件资料',cat:'docs',qty:1},{name:'正装',cat:'clothes',qty:1},{name:'领带',cat:'clothes',qty:1},
    {name:'皮鞋',cat:'clothes',qty:1},{name:'剃须刀',cat:'toiletries',qty:1}
  ]},
  {name:'海边度假',icon:'🏖️',desc:'海岛出游',items:[
    {name:'身份证',cat:'docs',qty:1},{name:'泳衣',cat:'clothes',qty:2},{name:'沙滩裤',cat:'clothes',qty:1},
    {name:'防晒霜',cat:'toiletries',qty:1},{name:'墨镜',cat:'other',qty:1},{name:'遮阳帽',cat:'clothes',qty:1},
    {name:'拖鞋',cat:'clothes',qty:1},{name:'防水手机袋',cat:'electronics',qty:1}
  ]}
];
let lists=JSON.parse(localStorage.getItem('packing_lists')||'[]');
let activeList=null;
function $(id){return document.getElementById(id)}
function renderCats(){
  $('itemCat').innerHTML=CATEGORIES.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
}
function createList(){
  const name=$('listName').value.trim();if(!name){alert('请输入清单名称');return;}
  lists.push({name,items:[],createdAt:new Date().toISOString()});
  localStorage.setItem('packing_lists',JSON.stringify(lists));
  $('listName').value='';activeList=lists.length-1;renderAll();
}
function selectList(i){activeList=i;renderAll();}
function deleteList(i){if(confirm('确定删除此清单？')){lists.splice(i,1);if(activeList>=lists.length)activeList=lists.length-1;localStorage.setItem('packing_lists',JSON.stringify(lists));renderAll();}}
function applyTemplate(tpl){
  if(!lists.length){lists.push({name:tpl.name,items:[],createdAt:new Date().toISOString()});activeList=0;}
  tpl.items.forEach(item=>{
    if(!lists[activeList].items.find(x=>x.name===item.name)){
      lists[activeList].items.push({...item,packed:false});
    }
  });
  localStorage.setItem('packing_lists',JSON.stringify(lists));renderAll();
}
function addItem(){
  const name=$('itemName').value.trim(),cat=$('itemCat').value,qty=parseInt($('itemQty').value)||1;
  if(!name||activeList===null){alert('请输入物品名称');return;}
  lists[activeList].items.push({name,cat,qty,packed:false});
  localStorage.setItem('packing_lists',JSON.stringify(lists));
  $('itemName').value='';$('itemQty').value='1';renderAll();
}
function toggleItem(i,j){lists[i].items[j].packed=!lists[i].items[j].packed;localStorage.setItem('packing_lists',JSON.stringify(lists));renderAll();}
function deleteItem(i,j){lists[i].items.splice(j,1);localStorage.setItem('packing_lists',JSON.stringify(lists));renderAll();}
function renderAll(){
  renderStats();renderTabs();renderChecklist();
}
function renderStats(){
  const totalLists=lists.length;
  const totalItems=lists.reduce((s,l)=>s+l.items.length,0);
  const packedItems=lists.reduce((s,l)=>s+l.items.filter(x=>x.packed).length,0);
  $('stats').innerHTML=`
    <div class="st"><div class="nm">${totalLists}</div><div class="lb">清单数</div></div>
    <div class="st"><div class="nm">${totalItems}</div><div class="lb">总物品</div></div>
    <div class="st"><div class="nm">${packedItems}</div><div class="lb">已打包</div></div>`;
}
function renderTabs(){
  if(!lists.length){$('listTabs').innerHTML='';return;}
  $('listTabs').innerHTML=lists.map((l,i)=>`<button class="list-btn ${activeList===i?'active':''}" onclick="selectList(${i})">${l.name} <span onclick="event.stopPropagation();deleteList(${i})" style="margin-left:4px;cursor:pointer">✕</span></button>`).join('');
}
function renderChecklist(){
  if(activeList===null||!lists.length){
    $('progressArea').className='hidden';$('addItemBar').className='hidden';
    $('checklistArea').innerHTML='<div class="es">请选择或创建一个清单</div>';return;
  }
  const list=lists[activeList];
  const total=list.items.length,packed=list.items.filter(x=>x.packed).length;
  const pct=total?Math.round(packed/total*100):0;
  $('progressArea').className='';
  $('pctText').textContent=pct+'%';$('pctText').style.color=pct>=80?'var(--success)':pct>=50?'var(--warn)':'var(--accent)';
  $('progressLabel').textContent=`${packed} / ${total}`;
  $('progressFill').style.width=pct+'%';
  $('addItemBar').className='';
  const grouped={};
  CATEGORIES.forEach(c=>{grouped[c.id]={...c,items:[]};});
  list.items.forEach((item,i)=>{if(grouped[item.cat])grouped[item.cat].items.push({...item,idx:i});});
  $('checklistArea').innerHTML=Object.values(grouped).filter(g=>g.items.length).map(g=>{
    const doneCount=g.items.filter(x=>x.packed).length;
    return `<div class="cat-group">
      <div class="cat-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <span class="icon">${g.icon}</span><span class="title">${g.name}</span>
        <span class="badge ${doneCount===g.items.length?'done':''}">${doneCount}/${g.items.length}</span>
        <span style="font-size:12px;color:var(--text2)">▶</span>
      </div>
      <div class="cat-body">${g.items.map(item=>`<div class="check-item">
        <input type="checkbox" ${item.packed?'checked':''} onchange="toggleItem(${activeList},${item.idx})">
        <span class="name ${item.packed?'done':''}">${item.name}</span>
        <span class="qty">×${item.qty}</span>
        <button class="dng" onclick="deleteItem(${activeList},${item.idx})">✕</button>
      </div>`).join('')}</div></div>`;
  }).join('');
}
function exportList(){
  if(activeList===null)return;const list=lists[activeList];
  let text=`🧳 ${list.name}\n${'━'.repeat(25)}\n\n`;
  CATEGORIES.forEach(c=>{
    const items=list.items.filter(x=>x.cat===c.id);
    if(!items.length)return;
    text+=`${c.icon} ${c.name}\n`;
    items.forEach(item=>{text+=`  ${item.packed?'☑':'☐'} ${item.name} ×${item.qty}\n`;});
    text+='\n';
  });
  const blob=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=list.name+'.txt';a.click();
}
function exportAll(){
  const blob=new Blob([JSON.stringify(lists,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='打包清单.json';a.click();
}
function clearAll(){if(confirm('确定清空所有清单？')){lists=[];activeList=null;localStorage.removeItem('packing_lists');renderAll();}}
$('templates').innerHTML=TEMPLATES.map(t=>`<div class="tpl-card" onclick="applyTemplate(TEMPLATES[${TEMPLATES.indexOf(t)}])">
  <div class="tpl-icon">${t.icon}</div><div class="tpl-name">${t.name}</div><div class="tpl-desc">${t.desc}</div>
</div>`).join('');
renderCats();renderAll();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
