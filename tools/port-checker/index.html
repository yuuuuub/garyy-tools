<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>端口扫描器 | Port Checker</title>
<meta property="og:title" content="端口扫描器 | Port Checker">
<meta property="og:description" content="在线端口扫描工具，检测目标主机端口开放状态">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线端口扫描器，快速检测目标主机端口开放状态">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<script src="i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.main{max-width:900px;margin:0 auto;padding:20px 24px}
.card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:1rem;margin-bottom:12px;color:var(--text)}
.form-row{display:flex;gap:12px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.form-row label{font-size:.85rem;color:var(--text-secondary);min-width:60px}
.form-row input,.form-row select{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.85rem;outline:none;min-width:150px}
.form-row input:focus{border-color:var(--accent)}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.port-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:12px}
.port-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);transition:var(--transition)}
.port-item:hover{border-color:var(--accent)}
.port-num{font-family:'Fira Code',Consolas,monospace;font-weight:600;min-width:50px;color:var(--accent)}
.port-desc{flex:1;font-size:.8rem;color:var(--text-secondary)}
.port-status{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:4px}
.port-open{background:var(--green-bg);color:var(--green)}
.port-closed{background:var(--red-bg);color:var(--red)}
.port-unknown{background:rgba(139,148,158,.15);color:var(--text-secondary)}
.progress-bar{width:100%;height:4px;background:var(--bg-tertiary);border-radius:2px;margin-top:12px;overflow:hidden;display:none}
.progress-bar.show{display:block}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;width:0}
.stat-bar{display:flex;gap:16px;font-size:.8rem;color:var(--text-secondary);margin-top:12px;flex-wrap:wrap}
.empty-state{text-align:center;padding:40px;color:var(--text-secondary);font-size:.85rem}
.info-box{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-size:.8rem;color:var(--text-secondary);line-height:1.6}
.info-box code{background:var(--bg);padding:2px 6px;border-radius:3px;font-family:'Fira Code',Consolas,monospace;font-size:.8rem}

/* === Smooth Animations === */
@keyframes animFadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes animScaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
body, .container, main, .container-fluid, .wrapper {
  animation: animFadeIn .45s ease-out both;
}
.weather-card, .word-card, .result-card, .output-card, .info-card,
.card, [class*="card"], [class*="panel"], [class*="result"], [class*="output"],
[class*="detail"], [class*="item"], [class*="section"]:not(header):not(nav),
[class*="box"]:not(.search-box) {
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.weather-card:hover, .word-card:hover, .result-card:hover, .output-card:hover,
.info-card:hover, .card:hover, [class*="card"]:hover, [class*="panel"]:hover,
[class*="result"]:hover, [class*="output"]:hover, [class*="detail"]:hover,
[class*="item"]:hover, [class*="box"]:not(.search-box):hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(0,0,0,.12);
}
button, input[type="submit"], .btn, [class*="btn"], .search-box button,
.filter-btn, .refresh-btn, .retry-btn {
  transition: transform .12s ease, opacity .2s ease, background .2s ease, box-shadow .2s ease;
}
button:active, input[type="submit"]:active, .btn:active, [class*="btn"]:active,
.search-box button:active, .filter-btn:active, .refresh-btn:active, .retry-btn:active {
  transform: scale(.96);
  opacity: .88;
}
button:hover, .btn:hover, [class*="btn"]:hover {
  box-shadow: 0 2px 8px rgba(59,130,246,.18);
}
html { scroll-behavior: smooth; }
.coin-item { transition: transform .2s ease, box-shadow .2s ease; }
.coin-item:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.city-item { transition: transform .2s ease, background .2s ease, border-color .2s ease; }
.city-item:hover { transform: translateX(4px); }
input[type="text"], input[type="number"], textarea, select {
  transition: border-color .2s ease, box-shadow .2s ease;
}
input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}
/* end animations */

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<header class="app-header">
<div>
<h1>🔍 端口扫描器</h1>
<span class="subtitle">检测目标主机端口开放状态</span>
</div>
<button class="btn" onclick="clearResults()">清空结果</button>
</header>
<div class="main">
<div class="card">
<h2>扫描配置</h2>
<div class="form-row">
<label>目标</label>
<input id="host" placeholder="example.com 或 IP 地址">
</div>
<div class="form-row">
<label>端口</label>
<input id="ports" placeholder="80,443,22 或 1-1024" value="22,80,443,3306,5432,6379,8080,8443">
</div>
<div class="presets">
<button class="btn" onclick="setPorts('22,80,443,3306,5432,6379,8080')">常用端口</button>
<button class="btn" onclick="setPorts('21,22,23,25,53,80,110,143,443,993,995,3389')">Web/邮件</button>
<button class="btn" onclick="setPorts('3306,5432,1433,27017,6379,9200,11211')">数据库</button>
<button class="btn" onclick="setPorts('25565,27015,3478,1935,51820')">游戏/流媒体</button>
<button class="btn" onclick="setPorts('1-1024')">全端口 (1-1024)</button>
</div>
<div class="info-box">
<strong>注意:</strong> 此工具使用浏览器 WebSocket API 进行端口检测，结果可能受浏览器安全策略限制。推荐命令行使用 <code>nmap -p {ports} {host}</code> 进行精确扫描。
</div>
</div>
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<button class="btn btn-primary" id="scanBtn" onclick="startScan()">开始扫描</button>
<div id="scanStats" class="stat-bar"></div>
</div>
<div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
<div class="port-grid" id="portGrid"><div class="empty-state">配置参数后点击"开始扫描"</div></div>
</div>
</div>

<script>
const COMMON_PORTS={
  21:'FTP',22:'SSH',23:'Telnet',25:'SMTP',53:'DNS',80:'HTTP',
  110:'POP3',143:'IMAP',443:'HTTPS',993:'IMAPS',995:'POP3S',
  1433:'MSSQL',3306:'MySQL',3389:'RDP',5432:'PostgreSQL',
  5900:'VNC',6379:'Redis',8080:'HTTP-Alt',8443:'HTTPS-Alt',
  9200:'Elasticsearch',11211:'Memcached',27017:'MongoDB',
  25565:'Minecraft',27015:'Source Engine',3478:'STUN',51820:'WireGuard'
};

function setPorts(ports){
  document.getElementById('ports').value=ports;
}

function parsePorts(str){
  const ports=[];
  str.split(',').forEach(part=>{
    part=part.trim();
    if(part.includes('-')){
      const [start,end]=part.split('-').map(Number);
      for(let i=start;i<=end&&i<=65535;i++) ports.push(i);
    }else{
      const p=parseInt(part);
      if(p&&p>=1&&p<=65535) ports.push(p);
    }
  });
  return[...new Set(ports)].sort((a,b)=>a-b);
}

async function checkPort(host,port,timeout=3000){
  try{
    const start=Date.now();
    const url=`https://${host}:${port}`;
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),timeout);

    await fetch(url,{
      mode:'no-cors',
      signal:controller.signal,
      cache:'no-store'
    });
    clearTimeout(timer);
    return{port,status:'open',time:Date.now()-start};
  }catch(e){
    if(e.name==='AbortError'){
      return{port,status:'timeout',time:timeout};
    }
    return{port,status:'closed',time:0};
  }
}

async function startScan(){
  const host=document.getElementById('host').value.trim();
  const portsStr=document.getElementById('ports').value.trim();
  if(!host){showToast('请输入目标主机','error');return}
  if(!portsStr){showToast('请输入端口','error');return}

  const ports=parsePorts(portsStr);
  if(!ports.length){showToast('无有效端口','error');return}
  if(ports.length>500){showToast('端口数量不能超过500','error');return}

  const btn=document.getElementById('scanBtn');
  const grid=document.getElementById('portGrid');
  const progressBar=document.getElementById('progressBar');
  const progressFill=document.getElementById('progressFill');

  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>扫描中...';
  progressBar.classList.add('show');
  progressFill.style.width='0%';
  grid.innerHTML='';
  currentResults=[];

  let done=0;
  const total=ports.length;

  const CONCURRENCY=20;
  const queue=[...ports];
  const workers=[];

  for(let i=0;i<CONCURRENCY;i++){
    workers.push((async()=>{
      while(queue.length){
        const port=queue.shift();
        const result=await checkPort(host,port);
        currentResults.push(result);
        done++;
        progressFill.style.width=((done/total)*100)+'%';
        renderPort(result);
        updateStats();
      }
    })());
  }

  await Promise.all(workers);
  btn.disabled=false;
  btn.innerHTML='开始扫描';
  progressBar.classList.remove('show');
  showToast(`扫描完成: ${ports.length} 个端口`,'success');
}

let currentResults=[];

function renderPort(result){
  const grid=document.getElementById('portGrid');
  const desc=COMMON_PORTS[result.port]||'未知服务';
  const statusClass=result.status==='open'?'port-open':result.status==='timeout'?'port-unknown':'port-closed';
  const statusText=result.status==='open'?'开放':result.status==='timeout'?'超时':'关闭';

  const item=document.createElement('div');
  item.className='port-item';
  item.innerHTML=`
    <span class="port-num">${result.port}</span>
    <span class="port-desc">${desc}</span>
    <span class="port-status ${statusClass}">${statusText}</span>`;
  grid.appendChild(item);
}

function updateStats(){
  const open=currentResults.filter(r=>r.status==='open').length;
  const closed=currentResults.filter(r=>r.status==='closed').length;
  const timeout=currentResults.filter(r=>r.status==='timeout').length;
  document.getElementById('scanStats').innerHTML=`
    <span style="color:var(--green)">开放: ${open}</span>
    <span style="color:var(--red)">关闭: ${closed}</span>
    <span style="color:var(--text-secondary)">超时: ${timeout}</span>
    <span>总计: ${currentResults.length}</span>`;
}

function clearResults(){
  document.getElementById('portGrid').innerHTML='<div class="empty-state">配置参数后点击"开始扫描"</div>';
  document.getElementById('scanStats').innerHTML='';
  document.getElementById('progressBar').classList.remove('show');
  currentResults=[];
}

function showToast(msg,type='success'){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:.85rem;font-weight:500;z-index:99999;transition:opacity .3s;background:var(--green);color:#fff';
  if(type==='error')t.style.background='var(--red)';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2000);
}
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
