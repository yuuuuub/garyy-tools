<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏕️ 夏日露营指南 - Gary's Tools</title>
<meta name="description" content="夏季露营全攻略：装备清单、营位选择、防虫防晒、篝火安全、露营地推荐，新手也能安心出发">
<style>
:root{--bg:#f5f0e8;--card:#fff;--text:#3d2c1e;--text2:#8b7355;--accent:#e07b39;--green:#5da04e;--brown:#8b6914;--border:#e8dcc8;--radius:14px}
[data-theme="dark"]{--bg:#1a1510;--card:#2a1e15;--text:#e8d8c0;--text2:#9a8060;--border:#3d2a18}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#5da04e,#e07b39,#8b6914);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.03)}
.card h3{font-size:1rem;font-weight:700;margin-bottom:12px}
.checklist{display:flex;flex-direction:column;gap:6px}
.check-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:8px;font-size:.8rem;cursor:pointer}
.check-item .box{width:18px;height:18px;border:2px solid var(--border);border-radius:4px;flex-shrink:0;transition:all .2s}
.check-item .box.checked{background:var(--green);border-color:var(--green)}
.check-item .box.checked::after{content:'✓';color:var(--text);font-size:.65rem;display:block;text-align:center;font-weight:900;line-height:18px}
.tip-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tip-item{padding:12px;border-radius:10px;font-size:.78rem;line-height:1.5;background:var(--bg)}
.tip-item .t-emoji{font-size:1.5rem;display:block;margin-bottom:4px}
.spot-list{display:flex;flex-direction:column;gap:8px}
.spot-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:10px;font-size:.82rem}
.spot-icon{font-size:1.8rem;flex-shrink:0}
.steps{display:flex;flex-direction:column;gap:8px}
.step-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.8rem;line-height:1.5}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;flex-shrink:0}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🏕️ 夏日露营指南 - Gary's Tools">
  <meta property="og:description" content="夏季露营全攻略：装备清单、营位选择、防虫防晒、篝火安全、露营地推荐，新手也能安心出发">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/camping-guide/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<header><h1>🏕️ 夏日露营指南</h1><p>逃离城市 · 星空篝火 · 新手也能去</p></header>

<div class="card">
<h2>🎒 必备装备清单</h2>
<div style="font-size:.78rem;color:var(--text2);margin-bottom:10px">逐项检查，打勾确认：</div>
<div class="checklist" id="gearList"></div>
</div>

<div class="card">
<h2>🏕️ 营地选择技巧</h2>
<div class="tip-grid" id="campTips"></div>
</div>

<div class="card">
<h2>🔥 篝火安全指南</h2>
<div class="steps" id="fireSteps"></div>
</div>

<div class="card">
<h2>📍 国内热门露营地推荐</h2>
<div class="spot-list" id="spotList"></div>
</div>

<footer>无痕露营 · 带走120%的垃圾 🌿</footer>
</div>

<script>
const gear=[
{c:'🏕️ 庇护所',i:['帐篷(含地钉/防风绳)','防潮垫/充气垫','睡袋(夏季选15°C舒适温标)','天幕(遮阳必备)','折叠桌椅','吊床(可选)']},
{c:'🍳 炊具',i:['便携炉头+气罐','套锅/煎锅','餐具(碗/筷/杯)','保温箱/冰袋','打火机/防水火柴','折叠水桶']},
{c:'💡 照明',i:['头灯/手电筒','营地灯/氛围灯串','备用电池/充电宝']},
{c:'🛡️ 防护',i:['驱蚊液/蚊香','防晒霜','急救包','雨衣/冲锋衣','备用衣物']},
{c:'🎮 娱乐',i:['蓝牙音箱','飞盘/羽毛球','扑克牌/桌游','相机','望远镜看星星']},
];

document.getElementById('gearList').innerHTML=gear.map(g=>`
<div style="font-weight:700;font-size:.82rem;margin-bottom:2px;margin-top:8px;color:var(--accent)">${g.c}</div>
${g.i.map(it=>`<div class="check-item" onclick="this.querySelector('.box').classList.toggle('checked')"><span class="box"></span>${it}</div>`).join('')}
`).join('');

const tips=[
{e:'🏔️',t:'选地势',d:'选平坦高地，避开洼地(积水)和悬崖边(落石)和安全区域'},
{e:'🌳',t:'看风向',d:'帐篷门背对风向，减少灌风。夏季选树荫下但要避开枯枝'},
{e:'💧',t:'近水源',d:'距水源50-100米最佳，太近蚊虫多且潮湿，太远不方便'},
{e:'🌊',t:'远离河道',d:'夏季暴雨多发，绝不在干涸河道和溪边扎营，山洪瞬间就到'},
];

document.getElementById('campTips').innerHTML=tips.map(t=>`
<div class="tip-item"><span class="t-emoji">${t.e}</span><b>${t.t}：</b>${t.d}</div>`).join('');

const fire=[
{n:'1',t:'确认营地允许生火！很多地方禁止明火，提前查询'},
{n:'2',t:'用石头围成火圈，清理周围1米内的枯叶枯草'},
{n:'3',t:'先放火绒(干草/松针)，再架细枝，最后放大块木柴——金字塔结构'},
{n:'4',t:'篝火旁备一桶水或沙子，随时可以灭火'},
{n:'5',t:'离开时用水完全浇灭，搅拌灰烬确认无火星再走'},
];

document.getElementById('fireSteps').innerHTML=fire.map(f=>`
<div class="step-item"><span class="step-num">${f.n}</span><span>${f.t}</span></div>`).join('');

const spots=[
{i:'🏔️',n:'浙江安吉',d:'竹海星空 · 云上草原 · 配套成熟'},
{i:'🌊',n:'惠州黑排角',d:'海边露营 · 礁石日出 · 免费野地'},
{i:'🌿',n:'川西塔公草原',d:'雪山草原 · 雅拉神山 · 花海7月'},
{i:'🏝️',n:'福建霞浦',d:'滩涂日出 · 海岛帐篷 · 摄影天堂'},
{i:'⛰️',n:'武功山',d:'高山草甸 · 云海星空 · 经典徒步线'},
{i:'🌲',n:'莫干山',d:'精致露营 · 配套好 · 适合家庭'},
];

document.getElementById('spotList').innerHTML=spots.map(s=>`
<div class="spot-item"><span class="spot-icon">${s.i}</span><div><b>${s.n}</b><div style="font-size:.72rem;color:var(--text2)">${s.d}</div></div></div>`).join('');
</script>
<script>
(function(){
var key = 'checklist_' + document.title;
var items = [
  '检查帐篷及配件（地钉/防风绳）是否齐全',
  '准备防潮垫和夏季睡袋',
  '带足饮用水（每人至少2L）',
  '准备头灯/手电筒和备用电池',
  '携带急救包和常用药品',
  '查看目的地天气预报',
  '下载离线地图和轨迹',
  '告知家人或朋友行程计划',
  '准备驱蚊液和防晒霜',
  '践行无痕露营带走所有垃圾'
];

function render() {
  var saved = JSON.parse(localStorage.getItem(key) || '[]');
  var list = document.createElement('div');
  list.style.cssText = 'max-width:600px;margin:30px auto;padding:16px;background:var(--card,#fff);border:1px solid var(--border,#e8dcc8);border-radius:10px';
  list.innerHTML = '<h3 style="margin:0 0 12px;font-size:1rem;color:var(--text,#3d2c1e)">📋 露营清单</h3>';
  items.forEach(function(text,i){
    var checked = saved.includes(i);
    list.innerHTML += '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;font-size:.85rem;color:var(--text,#3d2c1e)"><input type="checkbox" ' + (checked?'checked':'') + ' data-idx="'+i+'" style="width:16px;height:16px;accent-color:#5da04e">' + (checked?'<s>':'') + text + (checked?'</s>':'') + '</label>';
  });
  list.innerHTML += '<button id="resetChecklist" style="margin-top:10px;padding:6px 14px;border:1px solid var(--border,#e8dcc8);border-radius:6px;background:transparent;color:var(--text2,#8b7355);font-size:.78rem;cursor:pointer">重置</button></div>';

  var existing = document.getElementById('checklist_' + key);
  if (existing) existing.replaceWith(list);
  else document.body.appendChild(list);
  list.id = 'checklist_' + key;

  list.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.addEventListener('change',function(){
      var arr = JSON.parse(localStorage.getItem(key) || '[]');
      var idx = parseInt(this.dataset.idx);
      if (this.checked) { if (!arr.includes(idx)) arr.push(idx); }
      else { arr = arr.filter(function(v){ return v !== idx; }); }
      localStorage.setItem(key, JSON.stringify(arr));
      render();
    });
  });
  list.querySelector('#resetChecklist').addEventListener('click',function(){
    localStorage.removeItem(key);
    render();
  });
}
render();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
