<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;--muted:#8b949e}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warning:#9a6700;--error:#cf222e;--muted:#656d76}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
nav .logo{font-size:18px;font-weight:600;color:var(--accent2)}
nav a{color:var(--accent);text-decoration:none;font-size:14px}
.container{display:flex;flex-direction:column;height:calc(100vh - 52px)}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{opacity:.8}
.workspace{display:flex;flex:1;overflow:hidden}
.editor-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.preview-panel{flex:1;display:flex;flex-direction:column}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;font-size:13px;color:var(--accent2);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.editor-wrapper{flex:1;position:relative}
#htmlEditor{width:100%;height:100%;background:var(--bg);border:none;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:14px;padding:12px;resize:none;outline:none;line-height:1.6}
.preview-frame{flex:1;border:none;background:#fff}
.tabs{display:flex;gap:0;background:var(--card);border-bottom:1px solid var(--border)}
.tab{padding:8px 16px;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;transition:.2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
.templates{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.templates span{font-size:12px;color:var(--muted);margin-right:4px}
.template-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--accent2);cursor:pointer;transition:.2s}
.template-btn:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:768px){.workspace{flex-direction:column}.editor-panel{border-right:none;border-bottom:1px solid var(--border)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style>

<button class="template-btn" data-html="<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { font-family: sans-serif; padding: 20px; }\n    .container { display: flex; gap: 10px; flex-wrap: wrap; }\n    .box { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 120px; text-align: center; }\n  </style>\n</head>\n<body>\n  <h2>Flex布局</h2>\n  <div class=\"container\">\n    <div class=\"box\">盒子1</div>\n    <div class=\"box\">盒子2</div>\n    <div class=\"box\">盒子3</div>\n  </div>\n</body>\n</html>">Flex布局</button>

<button class="template-btn" data-html="<!DOCTYPE html>\n<html>\n<head>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <style>\n    * { box-sizing: border-box; margin: 0; padding: 0; }\n    body { font-family: sans-serif; }\n    .hero { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 60px 20px; text-align: center; }\n    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; padding: 20px; }\n    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; }\n    @media (max-width: 600px) { .hero { padding: 30px 10px; } }\n  </style>\n</head>\n<body>\n  <div class=\"hero\"><h1>响应式页面</h1><p>自适应不同屏幕尺寸</p></div>\n  <div class=\"grid\">\n    <div class=\"card\"><h3>卡片1</h3><p>内容描述</p></div>\n    <div class=\"card\"><h3>卡片2</h3><p>内容描述</p></div>\n    <div class=\"card\"><h3>卡片3</h3><p>内容描述</p></div>\n  </div>\n</body>\n</html>">响应式布局</button>

<div class="workspace">

<textarea id="htmlEditor"><!DOCTYPE html>
<html>

  <style>
    body { font-family: sans-serif; padding: 20px; }

    .card {
      background: linear-gradient(135deg, #667eea, #764ba2);

<script>
const htmlEditor = document.getElementById('htmlEditor');
const previewFrame = document.getElementById('previewFrame');

function runCode() {
  const doc = previewFrame.contentDocument;
  doc.open();
  doc.write(htmlEditor.value);
  doc.close();
}

function copyCode() {
  navigator.clipboard.writeText(htmlEditor.value).then(() => alert('代码已复制'));
}

function resetCode() {
  htmlEditor.value = '<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { font-family: sans-serif; padding: 20px; }\n    h1 { color: #3b82f6; }\n  </style>\n</head>\n<body>\n  <h1>Hello World</h1>\n  <p>编辑HTML代码并点击运行预览</p>\n</body>\n</html>';
  runCode();
}

let debounceTimer;
htmlEditor.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(runCode, 500);
});

document.querySelectorAll('.template-btn').forEach(btn => {
  btn.onclick = () => { htmlEditor.value = btn.dataset.html; runCode(); };
});

runCode();
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
