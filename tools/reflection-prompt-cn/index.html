<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪞 反思提示</title>
<meta name="description" content="反思提示工具，通过深度问题引导自我反思和成长">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:100px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.prompt-display{text-align:center;padding:30px;background:var(--bg);border-radius:var(--radius);margin-bottom:16px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.prompt-emoji{font-size:2.5rem;margin-bottom:8px}
.prompt-text{font-size:1.2rem;font-weight:600;line-height:1.5}
.prompt-category{font-size:.8rem;color:var(--text2);margin-top:8px}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat-tab{padding:6px 14px;border-radius:16px;font-size:.8rem;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text2);transition:all .2s}
.cat-tab:hover{border-color:var(--accent)}
.cat-tab.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.reflection-entry{padding:16px;border-bottom:1px solid var(--border)}.reflection-entry:last-child{border-bottom:none}
.reflection-entry .date{font-size:.8rem;color:var(--accent);font-weight:600}
.reflection-entry .question{font-weight:600;margin-top:6px;color:var(--warn)}
.reflection-entry .answer{margin-top:6px;font-size:.9rem;white-space:pre-wrap}
.reflection-entry .del{float:right;cursor:pointer;color:var(--danger)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪞</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🪞 反思提示">
<meta property="og:description" content="反思提示工具，通过深度问题引导自我反思和成长">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🪞 反思提示</h1><p>通过深度问题，更好地了解自己</p></div>

<div class="cd"><h2>🔍 今日反思</h2>
<div class="cat-tabs" id="catTabs"></div>
<div class="prompt-display" id="promptDisplay"></div>
<div class="bg"><button onclick="newPrompt()">🔄 换一个</button>
<select id="catFilter" onchange="filterPrompts()" style="max-width:150px">
<option value="all">全部类别</option><option value="self">自我认知</option><option value="relation">人际关系</option><option value="work">工作成长</option><option value="life">人生思考</option><option value="emotion">情绪管理</option><option value="future">未来规划</option>
</select></div></div>

<div class="cd"><h2>✏️ 写反思</h2>
<label>日期</label><input type="text" id="rDate" readonly>
<label>你的回答</label><textarea id="rAnswer" placeholder="认真思考并写下你的答案..."></textarea>
<div class="bg"><button onclick="saveReflection()">保存反思</button></div></div>

<div class="cd"><h2>📖 反思记录</h2><div id="reflectionList"></div></div>

<div class="cd"><h2>📊 统计</h2><div id="stats"></div>
<div class="bg"><button class="sec" onclick="clearAll()">清空全部</button></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let reflections=JSON.parse(localStorage.getItem('rp_reflections')||'[]');
let currentPrompt=null,currentCat='all';

const prompts=[
  {q:'今天让你感到最骄傲的事情是什么？',cat:'self',emoji:'🏆'},
  {q:'如果可以重新来过，今天你会做什么不同的决定？',cat:'self',emoji:'🔄'},
  {q:'今天谁帮助了你？你打算如何感谢他们？',cat:'relation',emoji:'🤝'},
  {q:'今天你和谁产生了冲突？如何更好地处理？',cat:'relation',emoji:'💬'},
  {q:'今天学到了什么新知识或技能？',cat:'work',emoji:'📚'},
  {q:'你在工作中最有成就感的时刻是什么？',cat:'work',emoji:'✨'},
  {q:'如果你只剩一年时间，你会如何度过？',cat:'life',emoji:'⏳'},
  {q:'什么事情是你一直想做但还没开始的？',cat:'life',emoji:'🎯'},
  {q:'今天什么让你感到焦虑？你能控制什么？',cat:'emotion',emoji:'😰'},
  {q:'如何让自己在压力下保持平静？',cat:'emotion',emoji:'🧘'},
  {q:'5年后你希望自己在哪里？在做什么？',cat:'future',emoji:'🔮'},
  {q:'为了实现目标，明天最重要的一件事是什么？',cat:'future',emoji:'📋'},
  {q:'你最近一次感到真正快乐是什么时候？',cat:'self',emoji:'😊'},
  {q:'什么习惯是你最想培养的？为什么？',cat:'self',emoji:'🌱'},
  {q:'你最感激的人是谁？为什么？',cat:'relation',emoji:'❤️'},
  {q:'如果你有一个超能力，你希望是什么？',cat:'life',emoji:'🦸'},
  {q:'今天有什么让你生气的事情？背后的原因是什么？',cat:'emotion',emoji:'😤'},
  {q:'你最大的恐惧是什么？它如何影响你的决定？',cat:'self',emoji:'😱'},
  {q:'你在逃避什么？为什么？',cat:'self',emoji:'🏃'},
  {q:'如何让今天比昨天进步1%？',cat:'work',emoji:'📈'},
  {q:'如果你不用担心金钱，你会做什么？',cat:'life',emoji:'💭'},
  {q:'今天有什么小事让你感到幸福？',cat:'emotion',emoji:'🌸'},
  {q:'你希望别人如何记住你？',cat:'life',emoji:'📖'},
  {q:'什么阻碍了你成为更好的自己？',cat:'self',emoji:'🚧'},
  {q:'今天你对自己的表现打几分？为什么？',cat:'work',emoji:'⭐'},
  {q:'如何更好地照顾自己的身心健康？',cat:'emotion',emoji:'💚'},
  {q:'你最敬佩的人身上有什么品质是你想学习的？',cat:'relation',emoji:'🌟'},
  {q:'什么让你感到生活有意义？',cat:'life',emoji:'✨'},
  {q:'明天最重要的三个目标是什么？',cat:'future',emoji:'🎯'},
  {q:'你今天为别人做了什么好事？',cat:'relation',emoji:'🤲'},
];

const catNames={self:'自我认知',relation:'人际关系',work:'工作成长',life:'人生思考',emotion:'情绪管理',future:'未来规划'};

function save(){localStorage.setItem('rp_reflections',JSON.stringify(reflections))}

function newPrompt(){
  const filtered=currentCat==='all'?prompts:prompts.filter(p=>p.cat===currentCat);
  let p;do{p=filtered[Math.floor(Math.random()*filtered.length)]}while(p===currentPrompt&&filtered.length>1);
  currentPrompt=p;
  $('promptDisplay').innerHTML=`<div class="prompt-emoji">${p.emoji}</div><div class="prompt-text">${p.q}</div><div class="prompt-category">${catNames[p.cat]}</div>`;
}

function filterPrompts(){currentCat=$('catFilter').value;newPrompt()}

function saveReflection(){
  if(!currentPrompt){alert('请先选择一个反思问题');return}
  const answer=$('rAnswer').value.trim();
  if(!answer){alert('请输入你的回答');return}
  reflections.push({id:Date.now(),date:$('rDate').value,question:currentPrompt.q,category:currentPrompt.cat,emoji:currentPrompt.emoji,answer});
  save();$('rAnswer').value='';renderReflections();renderStats();
}

function renderReflections(){
  if(!reflections.length){$('reflectionList').innerHTML='<div class="es">暂无反思记录</div>';return}
  $('reflectionList').innerHTML=reflections.slice().reverse().map(r=>`<div class="reflection-entry"><span class="del" onclick="delReflection(${r.id})">✕</span><div class="date">${r.date} ${r.emoji} ${catNames[r.category]||''}</div><div class="question">💡 ${r.question}</div><div class="answer">${r.answer}</div></div>`).join('');
}

function delReflection(id){reflections=reflections.filter(r=>r.id!==id);save();renderReflections();renderStats()}

function renderStats(){
  const total=reflections.length;
  const thisWeek=reflections.filter(r=>{const d=new Date(r.date);const now=new Date();return(now-d)/(7*86400000)<1}).length;
  const cats=[...new Set(reflections.map(r=>r.category))].length;
  $('stats').innerHTML=`<div class="gr"><div class="st"><div class="nm">${total}</div><div class="lb">反思总数</div></div><div class="st"><div class="nm">${thisWeek}</div><div class="lb">本周反思</div></div><div class="st"><div class="nm">${cats}</div><div class="lb">涉及类别</div></div></div>`;
}

function clearAll(){if(!confirm('确定清空全部反思记录？'))return;reflections=[];save();renderReflections();renderStats()}

$('rDate').value=new Date().toISOString().slice(0,10);
newPrompt();renderReflections();renderStats();
</script>
</body>
</html>
