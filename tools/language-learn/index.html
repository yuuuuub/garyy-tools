<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多语言学习卡 - Language Learn</title>
<meta name="description" content="多语言学习卡片，闪卡式记忆常用外语词汇">
<style>
:root {--bg: #0f0f1a;
--surface: #1a1a2e;
--surface2: #222240;
--accent: #6c63ff;
--accent2: #4ecdc4;
--gold: #ffd93d;
--green: #6bcb77;
--red: #ff6b6b;
--text: #e0e0e0;
--text2: #a0a0b8;
--text3: #6a6a88;
--radius: 16px;
--radius-sm: 10px;
--shadow: 0 4px 24px rgba(0,0,0,.3)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
overflow-x: hidden}
.bg-particles {position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.3}
.bg-particles span {position: absolute; display: block; width: 4px; height: 4px;
background: var(--accent); border-radius: 50%;
animation: float 8s infinite ease-in-out}
@keyframes float {0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
50% { transform: translateY(-40px) scale(1.8); opacity: 0.7; }}
.container { max-width: 860px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
header {display: flex; align-items: center; justify-content: space-between;
padding: 16px 20px; background: var(--surface); border-radius: var(--radius);
margin-bottom: 20px; box-shadow: var(--shadow)}
header .logo { font-size: 1.3rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
header .stats {display: flex; gap: 20px; font-size: 0.85rem; color: var(--text2)}
header .stats .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
header .stats .stat .val { font-size: 1.2rem; font-weight: 700; color: var(--text); }
header .stats .streak .val { color: var(--gold); }
header .stats .daily .val { color: var(--accent2); }
.panel {background: var(--surface); border-radius: var(--radius);
padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow)}
.panel h3 { font-size: 1rem; color: var(--text2); margin-bottom: 16px; font-weight: 500; }
.lang-tabs, .cat-tabs {display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px}
.lang-tab, .cat-tab {padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--surface2);
background: transparent; color: var(--text2); cursor: pointer;
font-size: 0.85rem; transition: all .2s; user-select: none}
.lang-tab:hover, .cat-tab:hover { border-color: var(--accent); color: var(--text); }
.lang-tab.active, .cat-tab.active {background: var(--accent); border-color: var(--accent); color: var(--text)}
.flashcard-wrap {display: flex; flex-direction: column; align-items: center; gap: 20px}
.flashcard {width: 100%; max-width: 400px; height: 240px;
perspective: 800px; cursor: pointer}
.flashcard-inner {width: 100%; height: 100%; position: relative;
transition: transform .5s; transform-style: preserve-3d}
.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
.flashcard-face {position: absolute; inset: 0;
display: flex; flex-direction: column; align-items: center; justify-content: center;
backface-visibility: hidden; border-radius: var(--radius);
padding: 20px; text-align: center}
.flashcard-front {background: linear-gradient(135deg, var(--surface2), #2a2a50);
border: 1.5px solid var(--accent)}
.flashcard-back {background: linear-gradient(135deg, #2a2a50, var(--surface2));
border: 1.5px solid var(--accent2);
transform: rotateY(180deg)}
.flashcard-word { font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; }
.flashcard-pron { font-size: 1rem; color: var(--accent2); margin-bottom: 6px; }
.flashcard-trans { font-size: 1.5rem; font-weight: 600; margin-bottom: 6px; color: var(--gold); }
.flashcard-hint {font-size: 0.85rem; color: var(--text3); margin-top: 20px}
.flashcard-cat-badge {font-size: 0.75rem; color: var(--text3); position: absolute; top: 14px;
background: rgba(108,99,255,.15); padding: 4px 12px; border-radius: 12px}
.card-controls {display: flex; gap: 12px; flex-wrap: wrap; justify-content: center}
.btn {padding: 10px 22px; border-radius: 24px; border: none; cursor: pointer;
font-size: 0.9rem; font-weight: 600; transition: all .2s;
display: flex; align-items: center; gap: 6px}
.btn-primary { background: var(--accent); color: var(--text); }
.btn-primary:hover { background: #7b74ff; transform: translateY(-1px); }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--surface2); }
.btn-secondary:hover { border-color: var(--accent); }
.btn-outline { background: transparent; color: var(--accent2); border: 1.5px solid var(--accent2); }
.btn-outline:hover { background: rgba(78,205,196,.1); }
.btn-sm { padding: 6px 14px; font-size: 0.8rem; }
.btn-know { background: var(--green); color: var(--text); }
.btn-review { background: var(--gold); color: #1a1a2e; }
.btn-hint { background: var(--accent2); color: #1a1a2e; }
.quiz-options {display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 500px; margin: 0 auto}
.quiz-opt {padding: 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--surface2);
background: var(--surface2); color: var(--text); cursor: pointer;
font-size: 0.95rem; text-align: center; transition: all .2s}
.quiz-opt:hover { border-color: var(--accent); background: #2a2a50; }
.quiz-opt.correct { border-color: var(--green); background: rgba(107,203,119,.15); color: var(--green); }
.quiz-opt.wrong { border-color: var(--red); background: rgba(255,107,107,.15); color: var(--red); }
.quiz-opt:disabled { pointer-events: none; }
.quiz-score { text-align: center; font-size: 1.1rem; margin-bottom: 16px; }
.quiz-score span { color: var(--green); font-weight: 700; }
.progress-section { margin-bottom: 16px; }
.progress-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; }
.progress-header .cat-name { color: var(--text2); }
.progress-header .cat-pct { color: var(--accent); font-weight: 600; }
.progress-bar {height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden}
.progress-bar .fill {height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s}
.progress-bar .fill.gold { background: var(--gold); }
.progress-bar .fill.green { background: var(--green); }
.daily-goal { margin-top: 12px; }
.daily-goal .goal-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.daily-goal .goal-info span { font-size: 0.85rem; color: var(--text2); }
.daily-goal .goal-val { font-size: 0.85rem; color: var(--accent2); font-weight: 600; }
.add-word-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.add-word-form input, .add-word-form select {padding: 10px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--surface2);
background: var(--surface2); color: var(--text); font-size: 0.85rem; outline: none;
transition: border-color .2s}
.add-word-form input:focus, .add-word-form select:focus { border-color: var(--accent); }
.add-word-form input { flex: 1; min-width: 150px; }
.add-word-form input::placeholder { color: var(--text3); }
.modal-overlay {position: fixed; inset: 0; background: rgba(0,0,0,.6);
display: flex; align-items: center; justify-content: center; z-index: 100}
.modal {background: var(--surface); border-radius: var(--radius); padding: 30px;
max-width: 420px; width: 90%; box-shadow: 0 8px 40px rgba(0,0,0,.5)}
.modal h3 { margin-bottom: 16px; color: var(--text); }
.modal p { color: var(--text2); font-size: 0.9rem; line-height: 1.6; margin-bottom: 12px; }
.modal .confetti { font-size: 2rem; text-align: center; margin-bottom: 12px; }
@media(max-width:600px){.container { padding: 12px; }
.flashcard { height: 200px; }
.flashcard-word { font-size: 1.6rem; }
.flashcard-trans { font-size: 1.2rem; }
.quiz-options { grid-template-columns: 1fr; }
header { flex-direction: column; gap: 12px; }}
</style>

<body>
<div class="bg-particles" id="particles"></div>
<div class="container">
  <header>
<h1 style="text-align:center;padding:20px 0;font-size:1.5rem">多语言学习卡 - Language Learn</h1>
    <div class="logo">🌐 多语言学习卡</div>
    <div class="stats">
      <div class="stat streak" title="连续学习天数">
        <span class="val" id="streakCount">0</span><span>🔥 连续</span>
      </div>
      <div class="stat daily" title="今日已学">
        <span class="val"><span id="todayLearned">0</span>/<span id="dailyGoal">8</span></span><span>🎯 今日</span>
      </div>
      <div class="stat">
        <span class="val" id="totalLearned">0</span><span>✅ 已掌握</span>
      </div>
    </div>
  </header>

  <div class="panel">
    <h2>🌍 选择语言</h2>
    <div class="lang-tabs" id="langTabs"></div>
  </div>

  <div class="panel">
    <h2>📂 词汇分类</h2>
    <div class="cat-tabs" id="catTabs"></div>
  </div>

  <div class="panel">
    <h2 id="cardPanelTitle">🃏 学习卡片</h2>
    <div class="flashcard-wrap">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="flashcard-inner">
          <div class="flashcard-face flashcard-front">
            <div class="flashcard-cat-badge" id="catBadge">问候</div>
            <div class="flashcard-word" id="cardWord">Hello</div>
            <div class="flashcard-pron" id="cardPron">/hə-LOH/</div>
            <div class="flashcard-hint">👆 点击翻转查看翻译</div>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="flashcard-trans" id="cardTrans">你好</div>
            <div class="flashcard-pron" id="cardPronBack">/hə-LOH/</div>
            <div class="flashcard-hint">⏱ 间隔复习提示</div>
          </div>
        </div>
      </div>
      <div class="card-controls">
        <button class="btn btn-sm btn-know" onclick="markKnown()">✅ 我记住了</button>
        <button class="btn btn-sm btn-review" onclick="markReview()">🔄 再复习</button>
        <button class="btn btn-sm btn-outline" onclick="nextCard()">⏭ 下一个</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>🧠 测验模式</h2>
    <div class="quiz-score" id="quizScoreDisplay">
      得分: <span id="quizScore">0</span> / <span id="quizTotal">0</span>
    </div>
    <div style="text-align:center;margin-bottom:16px;">
      <span id="quizWord" style="font-size:1.5rem;font-weight:700;"></span>
    </div>
    <div class="quiz-options" id="quizOptions"></div>
    <div style="text-align:center;margin-top:16px;">
      <button class="btn btn-primary" onclick="startQuiz()" id="btnStartQuiz">🎮 开始测验</button>
    </div>
  </div>

  <div class="panel">
    <h2>📝 添加自定义单词</h2>
    <div class="add-word-form">
      <input type="text" id="customWord" placeholder="目标语言单词">
      <input type="text" id="customTrans" placeholder="中文翻译">
      <input type="text" id="customPron" placeholder="发音 (可选)">
      <select id="customLang"></select>
      <select id="customCat"></select>
      <button class="btn btn-primary btn-sm" onclick="addCustomWord()">➕ 添加</button>
    </div>
    <div id="customWordList" style="margin-top:12px;font-size:0.85rem;color:var(--text3);"></div>
  </div>

  <div class="panel">
    <h2>📊 分类学习进度</h2>
    <div id="progressBars"></div>
    <div class="daily-goal">
      <div class="goal-info">
        <span>🎯 每日目标</span>
        <span class="goal-val" id="dailyGoalText">0 / 8</span>
      </div>
      <div class="progress-bar">
        <div class="fill green" id="dailyGoalBar" style="width:0%"></div>
      </div>
    </div>
    <div style="text-align:center;margin-top:12px;">
      <button class="btn btn-sm btn-outline" onclick="setDailyGoal()">⚙️ 设置每日目标</button>
      <button class="btn btn-sm btn-secondary" onclick="resetStats()" style="margin-left:8px;">🔄 重置统计</button>
    </div>
  </div>

  <div class="modal-overlay" id="modal" style="display:none;" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="confetti">🎉</div>
      <h2 id="modalTitle">太棒了！</h2>
      <p id="modalMsg"></p>
      <button class="btn btn-primary" onclick="closeModal()" style="margin-top:8px;">关闭</button>
    </div>
  </div>
</div>

const defaultCats = ['问候', '数字', '颜色', '食物', '交通', '日常'];
let currentLang = 'en';
let currentCat = '问候';
let cardIndex = 0;
let isFlipped = false;
let quizState = null;
let customWords = {};
let learnedWords = {};
let reviewWords = {};
let todayLearned = 0;
let dailyGoalVal = 8;
let streakCount = 0;
let lastVisitDate = '';
let totalLearnedAll = 0;
let quizScore = 0;
let quizTotal = 0;
function save() {
  const data = {
    customWords, learnedWords, reviewWords,
    todayLearned, dailyGoalVal, streakCount, lastVisitDate,
    currentLang, currentCat, cardIndex, totalLearnedAll,
    quizScore, quizTotal
  };
  localStorage.setItem('language-learn-state', JSON.stringify(data));
}
function load() {
  const raw = localStorage.getItem('language-learn-state');
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    customWords = d.customWords || {};
    learnedWords = d.learnedWords || {};
    reviewWords = d.reviewWords || {};
    todayLearned = d.todayLearned || 0;
    dailyGoalVal = d.dailyGoalVal || 8;
    streakCount = d.streakCount || 0;
    lastVisitDate = d.lastVisitDate || '';
    currentLang = d.currentLang || 'en';
    currentCat = d.currentCat || '问候';
    cardIndex = d.cardIndex || 0;
    totalLearnedAll = d.totalLearnedAll || 0;
    quizScore = d.quizScore || 0;
    quizTotal = d.quizTotal || 0;
  } catch(e) {}
}
function updateStreak() {
  const today = new Date().toISOString().split('T')[0];
  if (lastVisitDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  if (lastVisitDate === yesterday) {
    streakCount++;
  } else if (lastVisitDate !== today) {
    streakCount = 1;
  }
  lastVisitDate = today;
  todayLearned = 0;
  save();
}
function getWords(lang, cat) {
  const base = (vocabData[lang] && vocabData[lang].categories[cat]) ? vocabData[lang].categories[cat] : [];
  const custom = (customWords[lang] && customWords[lang][cat]) ? customWords[lang][cat] : [];
  return [...base, ...custom];
}
function getReviewWordList() {
  const words = [];
  for (const key in reviewWords) {
    if (!reviewWords[key]) continue;
    const [lang, cat, w] = key.split('___');
    words.push({ lang, cat, w });
  }
  return words;
}
function renderLangTabs() {
  const container = document.getElementById('langTabs');
  container.innerHTML = '';
  for (const [code, info] of Object.entries(vocabData)) {
    const el = document.createElement('span');
    el.className = 'lang-tab' + (code === currentLang ? ' active' : '');
    el.textContent = info.name;
    el.onclick = () => { currentLang = code; cardIndex = 0; currentCat = defaultCats[0]; quizState = null; isFlipped = false; save(); renderAll(); };
    container.appendChild(el);
  }
}
function renderCatTabs() {
  const container = document.getElementById('catTabs');
  container.innerHTML = '';
  const info = vocabData[currentLang];
  if (!info) return;
  const revEl = document.createElement('span');
  revEl.className = 'cat-tab' + (currentCat === '__review__' ? ' active' : '');
  revEl.textContent = '🔄 待复习';
  revEl.onclick = () => { currentCat = '__review__'; cardIndex = 0; isFlipped = false; save(); renderCard(); renderProgress(); };
  container.appendChild(revEl);
  for (const cat of defaultCats) {
    const el = document.createElement('span');
    el.className = 'cat-tab' + (cat === currentCat ? ' active' : '');
    el.textContent = cat;
    el.onclick = () => { currentCat = cat; cardIndex = 0; isFlipped = false; save(); renderCard(); renderProgress(); };
    container.appendChild(el);
  }
}
function renderCard() {
  const words = currentCat === '__review__' ? getReviewWordList() : getWords(currentLang, currentCat);
  if (currentCat === '__review__') {
    if (words.length === 0) {
      document.getElementById('cardWord').textContent = '🎉 暂无待复习单词';
      document.getElementById('cardPron').textContent = '';
      document.getElementById('cardTrans').textContent = '';
      document.getElementById('cardPronBack').textContent = '';
      document.getElementById('catBadge').textContent = '复习';
      document.getElementById('flashcard').classList.remove('flipped');
      isFlipped = false;
      return;
    }
    const rw = words[Math.min(cardIndex, words.length - 1)];
    const baseWords = vocabData[rw.lang]?.categories[rw.cat] || [];
    const customWs = customWords[rw.lang]?.[rw.cat] || [];
    const allWs = [...baseWords, ...customWs];
    const word = allWs.find(x => x.w === rw.w);
    if (word) {
      document.getElementById('cardWord').textContent = word.w;
      document.getElementById('cardPron').textContent = word.p || '';
      document.getElementById('cardTrans').textContent = word.t;
      document.getElementById('cardPronBack').textContent = word.p || '';
      document.getElementById('catBadge').textContent = rw.cat + ' (' + vocabData[rw.lang].name + ')';
    }
    document.getElementById('flashcard').classList.remove('flipped');
    isFlipped = false;
    return;
  }
  if (words.length === 0) {
    document.getElementById('cardWord').textContent = '暂无单词';
    document.getElementById('cardPron').textContent = '';
    document.getElementById('cardTrans').textContent = '';
    document.getElementById('cardPronBack').textContent = '';
    document.getElementById('catBadge').textContent = currentCat;
    document.getElementById('flashcard').classList.remove('flipped');
    isFlipped = false;
    return;
  }
  const idx = cardIndex % words.length;
  const word = words[idx];
  document.getElementById('cardWord').textContent = word.w || word;
  document.getElementById('cardPron').textContent = word.p || '';
  document.getElementById('cardTrans').textContent = word.t || '';
  document.getElementById('cardPronBack').textContent = word.p || '';
  document.getElementById('catBadge').textContent = currentCat;
  document.getElementById('flashcard').classList.remove('flipped');
  isFlipped = false;
  const key = currentLang + '___' + currentCat + '___' + (word.w || word);
  if (learnedWords[key]) {
    document.getElementById('cardWord').style.color = 'var(--green)';
  } else if (reviewWords[key]) {
    document.getElementById('cardWord').style.color = 'var(--gold)';
  } else {
    document.getElementById('cardWord').style.color = 'var(--text)';
  }
}
function flipCard() {
  const flashcard = document.getElementById('flashcard');
  flashcard.classList.toggle('flipped');
  isFlipped = !isFlipped;
}
function markKnown() {
  const words = currentCat === '__review__' ? getReviewWordList() : getWords(currentLang, currentCat);
  if (words.length === 0) return;
  if (currentCat === '__review__') {
    const rw = words[Math.min(cardIndex, words.length - 1)];
    const key = rw.lang + '___' + rw.cat + '___' + rw.w;
    learnedWords[key] = true;
    delete reviewWords[key];
  } else {
    const idx = cardIndex % words.length;
    const word = words[idx];
    const key = currentLang + '___' + currentCat + '___' + (word.w || word);
    learnedWords[key] = true;
    delete reviewWords[key];
  }
  todayLearned++;
  totalLearnedAll++;
  save();
  updateHeaderStats();
  nextCard();
  renderProgress();
}
function markReview() {
  const words = currentCat === '__review__' ? getReviewWordList() : getWords(currentLang, currentCat);
  if (words.length === 0) return;
  if (currentCat === '__review__') {
    const rw = words[Math.min(cardIndex, words.length - 1)];
    cardIndex = (cardIndex + 1) % words.length;
    save();
    renderCard();
    return;
  }
  const idx = cardIndex % words.length;
  const word = words[idx];
  const key = currentLang + '___' + currentCat + '___' + (word.w || word);
  reviewWords[key] = true;
  delete learnedWords[key];
  save();
  nextCard();
}
function nextCard() {
  const words = currentCat === '__review__' ? getReviewWordList() : getWords(currentLang, currentCat);
  if (words.length === 0) return;
  cardIndex = (cardIndex + 1) % words.length;
  save();
  renderCard();
}
function startQuiz() {
  const words = getWords(currentLang, currentCat);
  if (words.length < 4) {
    document.getElementById('quizWord').textContent = '⚠️ 该分类至少需要 4 个单词才能测验';
    document.getElementById('quizOptions').innerHTML = '';
    return;
  }
  const pool = [...words].sort(() => Math.random() - 0.5).slice(0, Math.min(10, words.length));
  quizState = { words: pool, current: 0, score: 0, answered: false };
  document.getElementById('btnStartQuiz').style.display = 'none';
  renderQuizQuestion();
}
function renderQuizQuestion() {
  if (!quizState || quizState.current >= quizState.words.length) {
    const s = quizState.score;
    const t = quizState.words.length;
    document.getElementById('quizWord').textContent = '🎉 测验结束！';
    document.getElementById('quizOptions').innerHTML = `<div style="grid-column:1/-1;text-align:center;font-size:1.2rem;">你的得分: <span style="color:var(--green);font-weight:700;">${s}</span> / ${t}</div>`;
    document.getElementById('btnStartQuiz').style.display = 'inline-block';
    document.getElementById('btnStartQuiz').textContent = '🔄 再来一次';
    quizScore += s;
    quizTotal += t;
    updateHeaderStats();
    save();
    quizState = null;
    return;
  }
  const currentWord = quizState.words[quizState.current];
  document.getElementById('quizWord').textContent = currentWord.w;
  quizState.answered = false;
  const allLangWords = [];
  for (const cat of defaultCats) {
    const ws = getWords(currentLang, cat);
    for (const w of ws) {
      if (w.w !== currentWord.w) allLangWords.push(w);
    }
  }
  const distractors = [...allLangWords].sort(() => Math.random() - 0.5).slice(0, 3);
  const options = [currentWord, ...distractors].sort(() => Math.random() - 0.5);
  const optsDiv = document.getElementById('quizOptions');
  optsDiv.innerHTML = '';
  for (const opt of options) {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.textContent = opt.t;
    btn.onclick = () => answerQuiz(opt === currentWord, btn);
    optsDiv.appendChild(btn);
  }
}
function answerQuiz(isCorrect, btn) {
  if (!quizState || quizState.answered) return;
  quizState.answered = true;
  if (isCorrect) {
    quizState.score++;
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    const opts = document.getElementById('quizOptions').children;
    const currentWord = quizState.words[quizState.current];
    for (const opt of opts) {
      if (opt.textContent === currentWord.t) opt.classList.add('correct');
    }
  }
  const opts = document.getElementById('quizOptions').children;
  for (const opt of opts) opt.disabled = true;
  setTimeout(() => {
    quizState.current++;
    renderQuizQuestion();
  }, 1200);
}
function populateCustomSelects() {
  const langSel = document.getElementById('customLang');
  const catSel = document.getElementById('customCat');
  langSel.innerHTML = '';
  for (const [code, info] of Object.entries(vocabData)) {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = info.name;
    if (code === currentLang) opt.selected = true;
    langSel.appendChild(opt);
  }
  catSel.innerHTML = '';
  for (const cat of defaultCats) {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    if (cat === currentCat) opt.selected = true;
    catSel.appendChild(opt);
  }
  renderCustomWordList();
}
function addCustomWord() {
  const w = document.getElementById('customWord').value.trim();
  const t = document.getElementById('customTrans').value.trim();
  const p = document.getElementById('customPron').value.trim();
  const lang = document.getElementById('customLang').value;
  const cat = document.getElementById('customCat').value;
  if (!w || !t) { garyyToast('请填写目标语言单词和中文翻译'); return; }
  if (!customWords[lang]) customWords[lang] = {};
  if (!customWords[lang][cat]) customWords[lang][cat] = [];
  customWords[lang][cat].push({ w, t, p });
  document.getElementById('customWord').value = '';
  document.getElementById('customTrans').value = '';
  document.getElementById('customPron').value = '';
  save();
  renderCustomWordList();
  if (currentLang === lang && currentCat === cat) renderCard();
  renderProgress();
}
function renderCustomWordList() {
  const div = document.getElementById('customWordList');
  const lang = document.getElementById('customLang').value;
  const cat = document.getElementById('customCat').value;
  const words = (customWords[lang] && customWords[lang][cat]) ? customWords[lang][cat] : [];
  if (words.length === 0) {
    div.innerHTML = '<span style="color:var(--text3)">暂无自定义单词</span>';
  } else {
    div.innerHTML = words.map((w, i) =>
      `<span style="display:inline-block;background:var(--surface2);padding:4px 10px;border-radius:12px;margin:4px;font-size:0.8rem;">${w.w} = ${w.t}
      <span style="color:var(--red);cursor:pointer;margin-left:4px;" onclick="removeCustomWord('${lang}','${cat}',${i})">&times;</span></span>`
    ).join('');
  }
}
function removeCustomWord(lang, cat, idx) {
  if (customWords[lang] && customWords[lang][cat]) {
    customWords[lang][cat].splice(idx, 1);
    if (customWords[lang][cat].length === 0) delete customWords[lang][cat];
    save();
    renderCustomWordList();
    if (currentLang === lang && currentCat === cat) renderCard();
    renderProgress();
  }
}
function renderProgress() {
  const div = document.getElementById('progressBars');
  div.innerHTML = '';
  const info = vocabData[currentLang];
  if (!info) return;
  for (const cat of defaultCats) {
    const base = (info.categories[cat] || []).length;
    const custom = (customWords[currentLang] && customWords[currentLang][cat]) ? customWords[currentLang][cat].length : 0;
    const total = base + custom;
    if (total === 0) continue;
    let learned = 0;
    const words = getWords(currentLang, cat);
    for (const w of words) {
      const key = currentLang + '___' + cat + '___' + (w.w || w);
      if (learnedWords[key]) learned++;
    }
    const pct = Math.round((learned / total) * 100);
    div.innerHTML += `
      <div class="progress-section">
        <div class="progress-header">
          <span class="cat-name">${cat}</span>
          <span class="cat-pct">${learned}/${total} (${pct}%)</span>
        </div>
        <div class="progress-bar">
          <div class="fill" style="width:${pct}%"></div>
        </div>
      </div>`;
  }
  const reviewCount = Object.keys(reviewWords).length;
  if (reviewCount > 0) {
    div.innerHTML += `<div style="margin-top:8px;color:var(--gold);font-size:0.85rem;">📝 待复习单词: ${reviewCount} 个</div>`;
  }
  document.getElementById('dailyGoalText').textContent = `${todayLearned} / ${dailyGoalVal}`;
  const goalPct = Math.min(100, Math.round((todayLearned / dailyGoalVal) * 100));
  document.getElementById('dailyGoalBar').style.width = goalPct + '%';
  if (todayLearned >= dailyGoalVal && todayLearned - 1 < dailyGoalVal) {
    showModal('🎯 每日目标达成！', `太棒了！你今天已经学习了 ${todayLearned} 个单词，成功达成了每日目标 ${dailyGoalVal} 个单词！`);
  }
}
function setDailyGoal() {
  const val = prompt(`请输入每日目标单词数（当前: ${dailyGoalVal}）`, dailyGoalVal);
  if (val && !isNaN(val) && parseInt(val) > 0) {
    dailyGoalVal = parseInt(val);
    document.getElementById('dailyGoal').textContent = dailyGoalVal;
    save();
    renderProgress();
  }
}
function resetStats() {
  if (confirm('确定要重置所有学习统计吗？此操作不可恢复！')) {
    customWords = {};
    learnedWords = {};
    reviewWords = {};
    todayLearned = 0;
    streakCount = 0;
    lastVisitDate = '';
    totalLearnedAll = 0;
    quizScore = 0;
    quizTotal = 0;
    cardIndex = 0;
    save();
    renderAll();
  }
}
function showModal(title, msg) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMsg').textContent = msg;
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
function updateHeaderStats() {
  document.getElementById('streakCount').textContent = streakCount;
  document.getElementById('todayLearned').textContent = todayLearned;
  document.getElementById('dailyGoal').textContent = dailyGoalVal;
  document.getElementById('totalLearned').textContent = totalLearnedAll;
}
function renderAll() {
  renderLangTabs();
  renderCatTabs();
  renderCard();
  renderProgress();
  populateCustomSelects();
  updateHeaderStats();
}
function initParticles() {
  const container = document.getElementById('particles');
  container.innerHTML = '';
  for (let i = 0; i < 30; i++) {
    const span = document.createElement('span');
    span.style.left = Math.random() * 100 + '%';
    span.style.top = Math.random() * 100 + '%';
    span.style.animationDelay = Math.random() * 8 + 's';
    span.style.animationDuration = (6 + Math.random() * 10) + 's';
    container.appendChild(span);
  }
}
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Space') {
    e.preventDefault();
    flipCard();
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    nextCard();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    const words = currentCat === '__review__' ? getReviewWordList() : getWords(currentLang, currentCat);
    if (words.length === 0) return;
    cardIndex = (cardIndex - 1 + words.length) % words.length;
    save();
    renderCard();
  } else if (e.key === 'k' || e.key === 'K') {
    markKnown();
  } else if (e.key === 'r' || e.key === 'R') {
    markReview();
  }
});
load();
updateStreak();
renderAll();
initParticles();
}
</script>
<script src="../i18n.js" defer></script>
