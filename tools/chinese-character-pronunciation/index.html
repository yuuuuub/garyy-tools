<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字读音</title><meta name="description" content="汉字读音 - 在线查询汉字读音"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.character-display{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.character-main{font-size:6rem;font-weight:700;color:var(--blue)}.pinyin-display{font-size:2rem;color:var(--green);margin-top:8px}.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}.info-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}.info-value{font-size:1.2rem;font-weight:600;color:var(--blue)}.info-label{font-size:.8rem;color:var(--text2);margin-top:4px}</style><meta property="og:title" content="汉字读音"><meta property="og:description" content="汉字读音 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div class="container"><h1>🔊 汉字读音</h1><p class="sub">在线查询汉字读音</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="getPronunciation()">
</div>
<button class="btn" onclick="getPronunciation()">查询</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var pronunciationData={
  '中':{pinyin:'zhōng',tone:1,initial:'zh',final:'ong',meaning:'中间，中心'},
  '国':{pinyin:'guó',tone:2,initial:'g',final:'uo',meaning:'国家，国土'},
  '人':{pinyin:'rén',tone:2,initial:'r',final:'en',meaning:'人类，人们'},
  '大':{pinyin:'dà',tone:4,initial:'d',final:'a',meaning:'大的，巨大'},
  '小':{pinyin:'xiǎo',tone:3,initial:'x',final:'iao',meaning:'小的，微小'},
  '上':{pinyin:'shàng',tone:4,initial:'sh',final:'ang',meaning:'上面，上方'},
  '下':{pinyin:'xià',tone:4,initial:'x',final:'ia',meaning:'下面，下方'},
  '天':{pinyin:'tiān',tone:1,initial:'t',final:'ian',meaning:'天空，一天'},
  '地':{pinyin:'dì',tone:4,initial:'d',final:'i',meaning:'地面，土地'},
  '年':{pinyin:'nián',tone:2,initial:'n',final:'ian',meaning:'年份，年龄'},
  '月':{pinyin:'yuè',tone:4,initial:'y',final:'ue',meaning:'月亮，月份'},
  '日':{pinyin:'rì',tone:4,initial:'r',final:'i',meaning:'太阳，日子'},
  '水':{pinyin:'shuǐ',tone:3,initial:'sh',final:'ui',meaning:'水，液体'},
  '火':{pinyin:'huǒ',tone:3,initial:'h',final:'uo',meaning:'火，火焰'},
  '木':{pinyin:'mù',tone:4,initial:'m',final:'u',meaning:'木头，树木'},
  '金':{pinyin:'jīn',tone:1,initial:'j',final:'in',meaning:'金属，黄金'},
  '土':{pinyin:'tǔ',tone:3,initial:'t',final:'u',meaning:'土壤，土地'},
  '山':{pinyin:'shān',tone:1,initial:'sh',final:'an',meaning:'山，山脉'},
  '石':{pinyin:'shí',tone:2,initial:'sh',final:'i',meaning:'石头，岩石'},
  '田':{pinyin:'tián',tone:2,initial:'t',final:'ian',meaning:'田地，农田'},
  '心':{pinyin:'xīn',tone:1,initial:'x',final:'in',meaning:'心脏，心思'},
  '手':{pinyin:'shǒu',tone:3,initial:'sh',final:'ou',meaning:'手，手掌'},
  '目':{pinyin:'mù',tone:4,initial:'m',final:'u',meaning:'眼睛，目光'},
  '口':{pinyin:'kǒu',tone:3,initial:'k',final:'ou',meaning:'嘴，口'},
  '耳':{pinyin:'ěr',tone:3,initial:'',final:'er',meaning:'耳朵，听力'},
  '鼻':{pinyin:' bí',tone:2,initial:'b',final:'i',meaning:'鼻子，嗅觉'},
  '舌':{pinyin:'shé',tone:2,initial:'sh',final:'e',meaning:'舌头，味觉'},
  '牙':{pinyin:'yá',tone:2,initial:'y',final:'a',meaning:'牙齿，咀嚼'},
  '发':{pinyin:'fā',tone:1,initial:'f',final:'a',meaning:'头发，发送'},
  '皮':{pinyin:'pí',tone:2,initial:'p',final:'i',meaning:'皮肤，表面'},
  '骨':{pinyin:'gǔ',tone:3,initial:'g',final:'u',meaning:'骨头，骨骼'},
  '肉':{pinyin:'ròu',tone:4,initial:'r',final:'ou',meaning:'肉，肌肉'},
  '血':{pinyin:'xuè',tone:4,initial:'x',final:'ue',meaning:'血液，血统'},
  '泪':{pinyin:'lèi',tone:4,initial:'l',final:'ei',meaning:'眼泪，泪水'},
  '汗':{pinyin:'hàn',tone:4,initial:'h',final:'an',meaning:'汗水，出汗'},
  '雨':{pinyin:'yǔ',tone:3,initial:'y',final:'u',meaning:'雨，雨水'},
  '雪':{pinyin:'xuě',tone:3,initial:'x',final:'ue',meaning:'雪，下雪'},
  '风':{pinyin:'fēng',tone:1,initial:'f',final:'eng',meaning:'风，风气'},
  '云':{pinyin:'yún',tone:2,initial:'y',final:'un',meaning:'云，云彩'},
  '花':{pinyin:'huā',tone:1,initial:'h',final:'ua',meaning:'花，花朵'},
  '草':{pinyin:'cǎo',tone:3,initial:'c',final:'ao',meaning:'草，草地'},
  '树':{pinyin:'shù',tone:4,initial:'sh',final:'u',meaning:'树，树木'},
  '鸟':{pinyin:'niǎo',tone:3,initial:'n',final:'iao',meaning:'鸟，鸟类'},
  '鱼':{pinyin:'yú',tone:2,initial:'y',final:'u',meaning:'鱼，鱼类'},
  '虫':{pinyin:'chóng',tone:2,initial:'ch',final:'ong',meaning:'虫，昆虫'},
  '马':{pinyin:'mǎ',tone:3,initial:'m',final:'a',meaning:'马，马匹'},
  '牛':{pinyin:'niú',tone:2,initial:'n',final:'iu',meaning:'牛，牛类'},
  '羊':{pinyin:'yáng',tone:2,initial:'y',final:'ang',meaning:'羊，羊类'},
  '虎':{pinyin:'hǔ',tone:3,initial:'h',final:'u',meaning:'虎，老虎'},
  '兔':{pinyin:'tù',tone:4,initial:'t',final:'u',meaning:'兔，兔子'},
  '龙':{pinyin:'lóng',tone:2,initial:'l',final:'ong',meaning:'龙，龙族'},
  '蛇':{pinyin:'shé',tone:2,initial:'sh',final:'e',meaning:'蛇，蛇类'},
  '猪':{pinyin:'zhū',tone:1,initial:'zh',final:'u',meaning:'猪，猪类'},
  '狗':{pinyin:'gǒu',tone:3,initial:'g',final:'ou',meaning:'狗，犬类'},
  '猫':{pinyin:'māo',tone:1,initial:'m',final:'ao',meaning:'猫，猫类'},
  '鸡':{pinyin:'jī',tone:1,initial:'j',final:'i',meaning:'鸡，家禽'},
  '鸭':{pinyin:'yā',tone:1,initial:'y',final:'a',meaning:'鸭，家禽'},
  '鹅':{pinyin:'é',tone:2,initial:'',final:'e',meaning:'鹅，家禽'}
};
function getPronunciation(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=pronunciationData[char];
  if(!data){
    data={pinyin:'未知',tone:0,initial:'未知',final:'未知',meaning:'暂无信息'};
  }
  var toneNames=['轻声','第一声（阴平）','第二声（阳平）','第三声（上声）','第四声（去声）','第五声（入声）'];
  var toneSymbols=['','āáǎà','ēéěè','īíǐì','ōóǒò','ūúǔù','ǖǘǚǜ'];
  var html='<div class="card">';
  html+='<div class="character-display">';
  html+='<div class="character-main">'+char+'</div>';
  html+='<div class="pinyin-display">'+data.pinyin+'</div>';
  html+='</div>';
  html+='<div class="info-grid">';
  html+='<div class="info-item"><div class="info-value">'+data.pinyin+'</div><div class="info-label">拼音</div></div>';
  html+='<div class="info-item"><div class="info-value">'+toneNames[data.tone]+'</div><div class="info-label">声调</div></div>';
  html+='<div class="info-item"><div class="info-value">'+data.initial+'</div><div class="info-label">声母</div></div>';
  html+='<div class="info-item"><div class="info-value">'+data.final+'</div><div class="info-label">韵母</div></div>';
  html+='</div>';
  html+='<div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>含义：</strong>'+data.meaning+'</div>';
  html+='<div><strong>声调符号：</strong>'+(data.tone>0?toneSymbols[data.tone-1]:'无')+'</div>';
  html+='<div><strong>拼音输入法：</strong>'+data.pinyin.replace(/ū/g,'u').replace(/ǖ/g,'v')+'</div>';
  html+='</div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(pronunciationData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  getPronunciation();
}
getPronunciation();
</script></body></html>
