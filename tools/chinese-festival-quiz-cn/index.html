<div class="container"><h1>❓ 中国节日知识问答</h1><p class="sub">测试你对中国传统节日的了解</p>
<div id="menuScreen">
<div class="card"><h3 style="margin-bottom:12px">选择难度</h3>
<div class="diff-tabs"><div class="diff-tab active" onclick="selectDiff(this,'easy')">🌱 简单</div><div class="diff-tab" onclick="selectDiff(this,'medium')">🌿 中等</div><div class="diff-tab" onclick="selectDiff(this,'hard')">🌳 困难</div></div></div>
<div class="card"><h3 style="margin-bottom:12px">选择分类（可选）</h3>
<div class="cat-tabs" id="catTabs"><span class="cat-tab active" onclick="selectCat(this,'all')">全部</span><span class="cat-tab" onclick="selectCat(this,'春节')">春节</span><span class="cat-tab" onclick="selectCat(this,'端午')">端午</span><span class="cat-tab" onclick="selectCat(this,'中秋')">中秋</span><span class="cat-tab" onclick="selectCat(this,'清明')">清明</span><span class="cat-tab" onclick="selectCat(this,'元宵')">元宵</span><span class="cat-tab" onclick="selectCat(this,'其他')">其他</span></div></div>
<div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="startQuiz(10)" style="flex:1">随机10题</button><button class="btn btn-primary" onclick="startQuiz(20)" style="flex:1">全部题目</button></div></div>

<script>
var allQuestions=[
{q:'春节贴春联的习俗起源于哪个朝代？',cat:'春节',diff:'medium',opts:['秦朝','汉朝','五代后蜀','宋朝'],ans:2,exp:'春联起源于五代后蜀，孟昶题写"新年纳余庆，嘉节号长春"被视为最早的春联。'},
{q:'以下哪个不是春节的传统食物？',cat:'春节',diff:'easy',opts:['饺子','年糕','粽子','汤圆'],ans:2,exp:'粽子是端午节的传统食物，不是春节的。'},
{q:'元宵节的"元宵"最初叫什么？',cat:'元宵',diff:'hard',opts:['浮元子','汤团','粉果','圆子'],ans:0,exp:'元宵最初被称为"浮元子"，后来才有了元宵、汤圆等名称。'},
{q:'端午节纪念的历史人物是谁？',cat:'端午',diff:'easy',opts:['伍子胥','屈原','曹娥','介子推'],ans:1,exp:'端午节最广泛的说法是纪念爱国诗人屈原。'},
{q:'中秋节吃月饼的习俗从哪个朝代开始流行？',cat:'中秋',diff:'medium',opts:['唐朝','宋朝','元朝','明朝'],ans:3,exp:'月饼作为中秋节的应节食品在明朝开始广泛流行。'},
{q:'清明节又称什么节？',cat:'清明',diff:'easy',opts:['寒食节','踏青节','上巳节','祭祖节'],ans:1,exp:'清明节又称踏青节，人们在这天踏青郊游。寒食节在清明前一两天。'},
{q:'重阳节的"重阳"指的是什么？',cat:'其他',diff:'medium',opts:['两个太阳','九月九日','重阳之气','高处的意思'],ans:1,exp:'重阳节在农历九月初九，"九"为阳数，两九相重故称"重阳"。'},
{q:'腊八节喝腊八粥的习俗与哪个宗教有关？',cat:'其他',diff:'medium',opts:['道教','佛教','儒教','伊斯兰教'],ans:1,exp:'腊八粥与佛教有关，相传佛祖释迦牟尼在腊月初八悟道成佛。'},
{q:'七夕节又被称为什么节？',cat:'其他',diff:'easy',opts:['女儿节','中元节','寒食节','花朝节'],ans:0,exp:'七夕节又被称为"女儿节"，古代女子在这天乞巧。'},
{q:'以下哪个节日有放鞭炮的习俗？',cat:'春节',diff:'easy',opts:['元宵节','清明节','端午节','重阳节'],ans:0,exp:'元宵节和春节都有放鞭炮的习俗，主要是为了驱邪祈福。'},
{q:'春节"守岁"的习俗寓意什么？',cat:'春节',diff:'medium',opts:['等待财神','珍惜光阴、祈福长寿','驱赶年兽','迎接春天'],ans:1,exp:'守岁寓意珍惜光阴，为长辈祈福长寿。'},
{q:'端午节赛龙舟与什么传说有关？',cat:'端午',diff:'easy',opts:['纪念屈原','纪念伍子胥','祭龙仪式','纪念曹娥'],ans:0,exp:'赛龙舟相传是人们划船寻找屈原遗体的演变。'},
{q:'中秋节赏月的习俗始于哪个朝代？',cat:'中秋',diff:'hard',opts:['魏晋','唐朝','宋朝','元朝'],ans:1,exp:'中秋赏月的习俗始于唐朝，到宋朝更加盛行。'},
{q:'寒食节与哪位历史人物有关？',cat:'其他',diff:'medium',opts:['屈原','介子推','伍子胥','岳飞'],ans:1,exp:'寒食节与介子推有关，传说他被烧死在绵山，人们禁火纪念。'},
{q:'春节拜年时长辈给晚辈的钱称为什么？',cat:'春节',diff:'easy',opts:['红包','压岁钱','赏钱','利是'],ans:1,exp:'严格来说"压岁钱"是正式名称，"红包"是包装形式。在广东也叫"利是"。'},
{q:'以下哪种花是重阳节的代表花？',cat:'其他',diff:'medium',opts:['桃花','菊花','梅花','荷花'],ans:1,exp:'菊花是重阳节的代表花，人们在这天赏菊、饮菊花酒。'},
{q:'元宵节猜灯谜的习俗始于哪个朝代？',cat:'元宵',diff:'hard',opts:['宋朝','唐朝','明朝','汉朝'],ans:0,exp:'灯谜始于宋朝，当时称为"隐语"或"灯虎"。'},
{q:'清明节扫墓的习俗与哪个节融合？',cat:'清明',diff:'medium',opts:['上巳节','寒食节','中元节','寒衣节'],ans:1,exp:'清明节与寒食节在时间上相近，后来逐渐融合。'},
{q:'春节贴"福"字倒着贴寓意什么？',cat:'春节',diff:'easy',opts:['福到了','福走了','福满了','福来了'],ans:0,exp:'"福"倒贴谐音"福到了"，寓意福气来到。'},
{q:'以下哪个不是中秋节的传统食物？',cat:'中秋',diff:'easy',opts:['月饼','桂花酒','粽子','柚子'],ans:2,exp:'粽子是端午节食物，中秋节吃月饼、饮桂花酒、吃柚子。'},
{q:'腊八节在农历哪一天？',cat:'其他',diff:'easy',opts:['腊月初一','腊月初八','腊月十五','腊月二十三'],ans:1,exp:'腊八节在每年农历腊月初八。'},
{q:'七夕节牛郎织女相会的桥是什么？',cat:'其他',diff:'easy',opts:['石桥','鹊桥','仙桥','彩虹桥'],ans:1,exp:'传说每年七月初七，喜鹊搭成"鹊桥"让牛郎织女相会。'},
{q:'春节"年"的传说中"年"是什么？',cat:'春节',diff:'easy',opts:['时间单位','怪兽','神仙','动物'],ans:1,exp:'传说"年"是一种怪兽，怕红色、怕火光、怕响声。'},
{q:'端午节挂艾草的作用是什么？',cat:'端午',diff:'medium',opts:['装饰美观','驱邪避瘟','祈求丰收','纪念先人'],ans:1,exp:'艾草有特殊香气，挂艾草是为了驱邪避瘟、防蚊虫。'},
{q:'中秋节"嫦娥奔月"的传说最早记载于？',cat:'中秋',diff:'hard',opts:['《山海经》','《淮南子》','《搜神记》','《西游记》'],ans:1,exp:'嫦娥奔月的传说最早完整记载于西汉《淮南子·览冥训》。'},
{q:'以下哪个节日有吃汤圆的习俗？',cat:'元宵',diff:'easy',opts:['春节','元宵节','端午节','七夕节'],ans:1,exp:'元宵节吃汤圆/元宵是最重要的节日食俗之一。'},
{q:'清明节又叫什么？',cat:'清明',diff:'easy',opts:['寒食节','踏青节','鬼节','团圆节'],ans:1,exp:'清明节又叫踏青节，人们在这天扫墓兼踏青。'},
{q:'春节放鞭炮的最初目的是什么？',cat:'春节',diff:'medium',opts:['庆祝新年','驱赶"年"兽','增加气氛','祭祀祖先'],ans:1,exp:'最初放鞭炮是为了驱赶名为"年"的怪兽。'},
{q:'以下哪个节日被列入联合国假日？',cat:'其他',diff:'medium',opts:['元宵节','中秋节','春节','端午节'],ans:2,exp:'春节（农历新年）于2023年被联合国列为联合国假日。'},
{q:'重阳节登高的习俗与什么传说有关？',cat:'其他',diff:'hard',opts:['嫦娥奔月','桓景避灾','牛郎织女','白蛇传'],ans:1,exp:'传说东汉桓景听从仙人指点，九月九日携家人登高避灾。'}
];

var currentDiff='easy',currentCat='all',quizState={questions:[],current:0,score:0,timer:0,timerInterval:null,answers:[]};

function selectDiff(el,diff){
  document.querySelectorAll('.diff-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');currentDiff=diff;
}
function selectCat(el,cat){
  document.querySelectorAll('.cat-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');currentCat=cat;
}

function startQuiz(count){
  var pool=allQuestions.filter(function(q){
    if(currentCat!=='all'&&q.cat!==currentCat)return false;
    if(currentDiff==='easy'&&q.diff!=='easy')return false;
    if(currentDiff==='medium'&&q.diff==='hard')return false;
    return true;
  });
  pool.sort(function(){return Math.random()-.5});
  quizState={questions:pool.slice(0,count),current:0,score:0,timer:0,timerInterval:null,answers:[]};
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion(){
  var qs=document.getElementById('quizScreen');
  if(quizState.current>=quizState.questions.length){renderResult();return}
  var q=quizState.questions[quizState.current];
  var timeLimit=currentDiff==='easy'?30:currentDiff==='medium'?20:15;
  quizState.timer=timeLimit;
  clearInterval(quizState.timerInterval);
  var h='<div class="progress-bar"><div class="progress-fill" style="width:'+((quizState.current/quizState.questions.length)*100)+'%"></div></div>';
  h+='<div class="question-card"><div class="q-header"><span class="q-num">第 '+(quizState.current+1)+' / '+quizState.questions.length+' 题</span><span class="q-timer" id="qTimer">⏱ '+timeLimit+'s</span></div>';
  h+='<div class="q-text">'+q.q+'</div><div class="options" id="quizOptions">';
  q.opts.forEach(function(o,i){h+='<button class="option-btn" onclick="answerQuiz('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>'});
  h+='</div><div id="explanationBox"></div></div>';
  h+='<button class="btn btn-secondary" onclick="quitQuiz()" style="width:100%">退出答题</button>';
  qs.innerHTML=h;
  quizState.timerInterval=setInterval(function(){
    quizState.timer--;
    var te=document.getElementById('qTimer');
    if(te)te.textContent='⏱ '+quizState.timer+'s';
    if(quizState.timer<=0){clearInterval(quizState.timerInterval);answerQuiz(-1)}
  },1000);
}

function answerQuiz(idx){
  clearInterval(quizState.timerInterval);
  var q=quizState.questions[quizState.current];
  var correct=idx===q.ans;
  if(correct)quizState.score++;
  var btns=document.querySelectorAll('#quizOptions .option-btn');
  btns.forEach(function(b,i){
    b.onclick=null;
    if(i===q.ans)b.classList.add('correct');
    if(i===idx&&!correct)b.classList.add('wrong');
    b.style.cursor='default';
  });
  var expHtml='<div class="explanation">'+(correct?'✅ 回答正确！':'❌ 回答错误。正确答案: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans])+'<br><br>'+q.exp+'</div>';
  document.getElementById('explanationBox').innerHTML=expHtml;
  quizState.answers.push({q:q.q,yourAnswer:idx>=0?q.opts[idx]:'超时',correct:correct});
  setTimeout(function(){quizState.current++;renderQuestion()},2500);
}

function quitQuiz(){
  clearInterval(quizState.timerInterval);
  if(confirm('确定要退出答题吗？'))renderResult();
}

function renderResult(){
  clearInterval(quizState.timerInterval);
  var qs=document.getElementById('quizScreen');
  var total=quizState.questions.length;
  var pct=Math.round(quizState.score/total*100);
  var grade=pct>=90?'🏆 节日大师':pct>=70?'🌟 知识达人':pct>=50?'📖 还需努力':'💪 继续加油';
  var h='<div class="result-card"><h2>'+grade+'</h2>';
  h+='<div class="big-score">'+quizState.score+' / '+total+'</div>';
  h+='<div class="stats-grid"><div class="stat-item"><div class="val">'+pct+'%</div><div class="label">正确率</div></div>';
  h+='<div class="stat-item"><div class="val">'+quizState.score+'</div><div class="label">答对</div></div>';
  h+='<div class="stat-item"><div class="val">'+(total-quizState.score)+'</div><div class="label">答错</div></div></div>';
  h+='<div class="card" style="text-align:left;max-height:400px;overflow-y:auto"><h3 style="margin-bottom:10px">📋 答题详情</h3>';
  quizState.answers.forEach(function(a,i){
    h+='<div style="padding:8px 0;border-bottom:1px solid var(--border)">';
    h+='<span style="color:'+(a.correct?'var(--green)':'var(--red)')+'">'+(a.correct?'✅':'❌')+'</span> '+(i+1)+'. '+a.q.substring(0,30)+'... → <b>'+a.yourAnswer+'</b></div>';
  });
  h+='</div><div style="margin-top:16px;display:flex;gap:8px;justify-content:center"><button class="btn btn-primary" onclick="restartQuiz()">再来一局</button><button class="btn btn-secondary" onclick="backToMenu()">返回菜单</button></div></div>';
  qs.innerHTML=h;
}

function restartQuiz(){startQuiz(quizState.questions.length)}
function backToMenu(){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('menuScreen').classList.remove('hidden');
}
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input');if(inp)inp.focus()}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur()}});
</script>
