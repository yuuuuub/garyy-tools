<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛒 智慧零售</title>
<meta name="description" content="智慧零售管理系统，商品管理、库存监控、销售分析、会员营销">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:1100px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.stat-card .icon{font-size:1.8rem;margin-bottom:4px}
.stat-card .val{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.8rem;color:var(--text2)}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.product{padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;transition:all .2s}
.product:hover{border-color:var(--accent)}
.product .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.product .name{font-weight:600;font-size:.9rem}
.product .price{color:var(--danger);font-weight:700;font-size:1.1rem}
.product .info{font-size:.8rem;color:var(--text2);margin-bottom:4px}
.product .stock{display:flex;align-items:center;gap:6px;font-size:.8rem}
.product .stock .bar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.product .stock .fill{height:100%;border-radius:3px}
.product .actions{display:flex;gap:6px;margin-top:8px}
.btn{padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-size:.8rem}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:4px 10px;font-size:.75rem}
.btn-success{background:var(--success)}.btn-warn{background:var(--warn)}.btn-danger{background:var(--danger)}.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.8rem;transition:all .2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text]{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.85rem;margin-bottom:8px}
.member-list{max-height:250px;overflow-y:auto}
.member-item{display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--border);font-size:.85rem}
.member-item:last-child{border-bottom:none}
.badge{padding:2px 8px;border-radius:10px;font-size:.75rem}
.badge-gold{background:rgba(245,158,11,.15);color:var(--warn)}
.badge-silver{background:rgba(156,163,175,.15);color:#9ca3af}
.badge-normal{background:rgba(59,130,246,.15);color:var(--accent)}
.sale-list{max-height:200px;overflow-y:auto}
.sale-item{display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--border);font-size:.85rem}
.sale-item:last-child{border-bottom:none}
.chart-area{height:150px;background:var(--bg);border:1px solid var(--border);border-radius:8px;display:flex;align-items:flex-end;gap:4px;padding:10px}
.chart-bar{flex:1;border-radius:3px 3px 0 0;background:var(--accent);transition:height .5s;min-width:8px}
.promo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.promo{padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;border-left:4px solid var(--accent)}
.promo .name{font-weight:600;font-size:.9rem;margin-bottom:4px}
.promo .detail{font-size:.8rem;color:var(--text2);margin-bottom:6px}
.promo .time{font-size:.75rem;color:var(--warn)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🛒 智慧零售">
<meta property="og:description" content="智慧零售管理系统，商品管理、库存监控、销售分析、会员营销">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🛒 智慧零售</h1><p>商品管理、库存监控、销售分析、会员营销</p></div>

<div class="cd">
<h2>📊 经营数据</h2>
<div class="grid" id="stats"></div>
</div>

<div class="cd">
<h2>📦 商品管理</h2>
<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
<input type="text" id="searchInput" placeholder="搜索商品名称..." style="flex:1;margin-bottom:0">
<button class="btn btn-success" onclick="addProduct()">+ 新增商品</button>
</div>
<div class="tabs" id="productTabs"></div>
<div class="product-grid" id="productGrid"></div>
</div>

<div class="cd">
<h2>📈 7日销售趋势</h2>
<div class="chart-area" id="saleChart"></div>
</div>

<div class="cd">
<h2>💰 实时交易</h2>
<div class="sale-list" id="saleList"></div>
</div>

<div class="cd">
<h2>👥 会员管理</h2>
<div class="member-list" id="memberList"></div>
</div>

<div class="cd">
<h2>🎉 促销活动</h2>
<div class="promo-grid" id="promoGrid"></div>
</div>
</div>

<script src="i18n.js" defer></script>
<script>
(function(){
var products=[
  {name:'有机苹果',price:12.9,stock:150,max:200,cat:'水果',sales:89},
  {name:'进口牛奶',price:29.9,stock:80,max:120,cat:'饮品',sales:156},
  {name:'全麦面包',price:8.5,stock:45,max:100,cat:'烘焙',sales:234},
  {name:'鲜鸡蛋',price:15.8,stock:200,max:300,cat:'生鲜',sales:312},
  {name:'矿泉水',price:2.0,stock:500,max:600,cat:'饮品',sales:567},
  {name:'洗衣液',price:35.9,stock:60,max:80,cat:'日用',sales:78},
  {name:'巧克力',price:22.5,stock:35,max:100,cat:'零食',sales:145},
  {name:'速冻水饺',price:18.9,stock:90,max:150,cat:'速食',sales:198},
  {name:'酸奶',price:6.5,stock:180,max:250,cat:'饮品',sales:423},
  {name:'橙汁',price:9.9,stock:120,max:150,cat:'饮品',sales:267}
];
var members=[
  {name:'张三',level:'gold',points:12500,spend:15800,avatar:'👨'},
  {name:'李四',level:'gold',points:10200,spend:12300,avatar:'👩'},
  {name:'王五',level:'silver',points:5600,spend:7800,avatar:'👨'},
  {name:'赵六',level:'silver',points:4200,spend:5200,avatar:'👩'},
  {name:'钱七',level:'normal',points:1800,spend:2100,avatar:'👨'},
  {name:'孙八',level:'normal',points:950,spend:1200,avatar:'👩'}
];
var promos=[
  {name:'新会员专享',detail:'注册即送50元优惠券',time:'长期有效'},
  {name:'满减活动',detail:'满100减20，满200减50',time:'截止 2025-03-31'},
  {name:'会员日折扣',detail:'每周二会员全场8折',time:'每周二'},
  {name:'积分翻倍',detail:'购物积分双倍返还',time:'截止 2025-02-28'}
];
var currentCatTab='全部';
var saleData=[];

function renderStats(){
  var data=[
    {icon:'💰',val:'¥'+Math.round(15000+Math.random()*5000),label:'今日销售额'},
    {icon:'🛒',val:Math.round(300+Math.random()*100),label:'今日订单'},
    {icon:'👥',val:Math.round(1000+Math.random()*200),label:'今日客流'},
    {icon:'📦',val:products.length,label:'在售商品'},
    {icon:'⭐',val:Math.round(4.5+Math.random()*0.4).toFixed(1),label:'好评率'},
    {icon:'🔄',val:Math.round(25+Math.random()*15)+'%',label:'复购率'}
  ];
  var h='';
  data.forEach(function(d){h+='<div class="stat-card"><div class="icon">'+d.icon+'</div><div class="val">'+d.val+'</div><div class="label">'+d.label+'</div></div>'});
  document.getElementById('stats').innerHTML=h;
}

function renderProductTabs(){
  var cats=['全部','水果','饮品','生鲜','烘焙','零食','速食','日用'];
  var h='';
  cats.forEach(function(c){h+='<div class="tab'+(c===currentCatTab?' active':'')+'" onclick="filterProducts(\''+c+'\')">'+c+'</div>'});
  document.getElementById('productTabs').innerHTML=h;
}

window.filterProducts=function(c){currentCatTab=c;renderProductTabs();renderProducts()};

function renderProducts(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=products.filter(function(p){
    if(currentCatTab!=='全部'&&p.cat!==currentCatTab) return false;
    if(search&&p.name.toLowerCase().indexOf(search)===-1) return false;
    return true;
  });
  var h='';
  filtered.forEach(function(p,i){
    var pct=Math.round(p.stock/p.max*100);
    var color=pct>60?'var(--success)':pct>30?'var(--warn)':'var(--danger)';
    h+='<div class="product"><div class="top"><span class="name">'+p.name+'</span><span class="price">¥'+p.price+'</span></div><div class="info">📦 '+p.cat+' · 月销 '+p.sales+'</div><div class="stock"><span>库存 '+p.stock+'</span><div class="bar"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div><span>'+pct+'%</span></div><div class="actions"><button class="btn btn-sm btn-outline" onclick="editProduct('+i+')">编辑</button><button class="btn btn-sm btn-warn" onclick="restock('+i+')">补货</button></div></div>';
  });
  document.getElementById('productGrid').innerHTML=h||'<div style="text-align:center;color:var(--text2);padding:20px">暂无匹配商品</div>';
}

window.addProduct=function(){garyyToast('打开新增商品表单','info')};
window.editProduct=function(i){garyyToast('编辑商品：'+products[i].name,'info')};
window.restock=function(i){products[i].stock=Math.min(products[i].max,products[i].stock+50);renderProducts();garyyToast('已补货：'+products[i].name,'success')};

function renderSaleChart(){
  var h='';
  for(var i=0;i<7;i++){
    var v=30+Math.random()*70;
    h+='<div class="chart-bar" style="height:'+v+'%"></div>';
  }
  document.getElementById('saleChart').innerHTML=h;
}

function renderSales(){
  var items=['有机苹果x3','矿泉水x2','进口牛奶x1','全麦面包x2','鲜鸡蛋x1','酸奶x4','巧克力x1','速冻水饺x2'];
  var h='';
  for(var i=0;i<8;i++){
    var amount=(5+Math.random()*80).toFixed(1);
    h+='<div class="sale-item"><span style="margin-right:8px">🛒</span><span style="flex:1">'+Random.pick(items)+'</span><span style="color:var(--danger);font-weight:600">¥'+amount+'</span><span style="color:var(--text2);font-size:.8rem;margin-left:8px">'+Random.time(24)+':'+Random.int(0,59).toString().padStart(2,'0')+'</span></div>';
  }
  document.getElementById('saleList').innerHTML=h;
}

function renderMembers(){
  var h='';
  members.forEach(function(m){
    var badge=m.level==='gold'?'badge-gold':m.level==='silver'?'badge-silver':'badge-normal';
    var label=m.level==='gold'?'金牌':m.level==='silver'?'银牌':'普通';
    h+='<div class="member-item"><span class="badge '+badge+'">'+label+'</span><span style="margin-right:8px">'+m.avatar+'</span><span style="flex:1"><strong>'+m.name+'</strong><br><span style="font-size:.8rem;color:var(--text2)">积分 '+m.points+' · 累计消费 ¥'+m.spend+'</span></span><button class="btn btn-sm btn-outline">详情</button></div>';
  });
  document.getElementById('memberList').innerHTML=h;
}

function renderPromos(){
  var h='';
  promos.forEach(function(p){
    h+='<div class="promo"><div class="name">🎉 '+p.name+'</div><div class="detail">'+p.detail+'</div><div class="time">⏰ '+p.time+'</div></div>';
  });
  document.getElementById('promoGrid').innerHTML=h;
}

document.getElementById('searchInput').addEventListener('input',renderProducts);
renderStats();renderProductTabs();renderProducts();renderSaleChart();renderSales();renderMembers();renderPromos();
setInterval(function(){renderStats();renderSales()},8000);
})();
</script>
</body>
</html>
