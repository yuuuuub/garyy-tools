<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目时间线</title>
<meta property="og:title" content="项目时间线">
<meta property="og:description" content="项目时间线 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="项目时间线工具，可视化项目进度与里程碑，支持甘特图展示">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:1100px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:4px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.9rem;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.gantt{overflow-x:auto;margin:16px 0;padding-bottom:8px}
.gantt-row{display:flex;align-items:center;margin-bottom:8px;min-height:40px}
.gantt-label{width:140px;flex-shrink:0;font-size:.85rem;padding-right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-bar-wrap{flex:1;position:relative;height:28px;background:var(--bg);border-radius:6px;overflow:hidden}
.gantt-bar{position:absolute;height:100%;border-radius:6px;cursor:pointer;transition:all .2s;display:flex;align-items:center;padding:0 8px;font-size:.75rem;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;min-width:20px}
.gantt-bar:hover{opacity:.85;transform:scaleY(1.1)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.milestone{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--border);transition:background .2s}
.milestone:hover{background:rgba(59,130,246,.05)}
.milestone-diamond{width:12px;height:12px;transform:rotate(45deg);flex-shrink:0}
.milestone-info{flex:1}
.milestone-date{font-size:.8rem;color:var(--text2)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:12px}
.stat-num{font-size:1.8rem;font-weight:700}
.stat-label{font-size:.8rem;color:var(--text2)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.hidden{display:none!important}
.empty{text-align:center;color:var(--text2);padding:30px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}h1{font-size:1.4rem}.stats-grid{grid-template-columns:repeat(2,1fr)}.gantt-label{width:100px;font-size:.8rem}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>📅 项目时间线</h1>
<p class="subtitle">可视化项目进度与里程碑</p>

<div class="stats-grid" id="statsGrid"></div>

<div class="card">
  <div class="flex-between">
    <b>项目设置</b>
    <div class="flex">
      <button class="btn btn-sm" onclick="showTaskModal()">+ 添加任务</button>
      <button class="btn btn-sm" onclick="showMilestoneModal()">+ 添加里程碑</button>
      <button class="btn btn-sm btn-danger" onclick="resetAll()">重置</button>
    </div>
  </div>
  <div style="margin-top:12px">
    <label>项目名称</label>
    <input type="text" id="projectName" placeholder="例：Q2 产品上线" oninput="saveData()">
  </div>
</div>

<div class="card">
  <div class="flex-between"><b>甘特图</b><span style="font-size:.8rem;color:var(--text2)" id="dateRange"></span></div>
  <div class="gantt" id="ganttChart"></div>
</div>

<div class="card">
  <b style="display:block;margin-bottom:8px">里程碑</b>
  <div id="milestoneList"></div>
</div>
</div>

<div class="modal-overlay hidden" id="taskModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 style="margin-bottom:16px" id="taskModalTitle">添加任务</h3>
    <label>任务名称</label><input type="text" id="taskName" placeholder="例：需求评审">
    <label>开始日期</label><input type="date" id="taskStart">
    <label>结束日期</label><input type="date" id="taskEnd">
    <label>进度 (%)</label><input type="number" id="taskProgress" min="0" max="100" value="0">
    <label>负责人</label><input type="text" id="taskOwner" placeholder="选填">
    <div class="flex" style="margin-top:16px;justify-content:flex-end">
      <button class="btn btn-danger btn-sm" onclick="closeModal()">取消</button>
      <button class="btn" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="milestoneModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 style="margin-bottom:16px">添加里程碑</h3>
    <label>里程碑名称</label><input type="text" id="msName" placeholder="例：产品发布">
    <label>日期</label><input type="date" id="msDate">
    <label>描述</label><input type="text" id="msDesc" placeholder="选填">
    <div class="flex" style="margin-top:16px;justify-content:flex-end">
      <button class="btn btn-danger btn-sm" onclick="closeModal()">取消</button>
      <button class="btn" onclick="saveMilestone()">保存</button>
    </div>
  </div>
</div>

<script>
document.title='📅 项目时间线';
let project=JSON.parse(localStorage.getItem('project_timeline_cn')||'null')||{
  name:'',tasks:[
    {id:1,name:'需求分析',start:'2025-01-06',end:'2025-01-10',progress:100,owner:'张三'},
    {id:2,name:'原型设计',start:'2025-01-10',end:'2025-01-15',progress:80,owner:'李四'},
    {id:3,name:'前端开发',start:'2025-01-13',end:'2025-01-25',progress:40,owner:'王五'},
    {id:4,name:'后端开发',start:'2025-01-15',end:'2025-01-28',progress:30,owner:'赵六'},
    {id:5,name:'测试上线',start:'2025-01-25',end:'2025-01-31',progress:0,owner:'全员'}
  ],milestones:[
    {id:1,name:'需求冻结',date:'2025-01-10',desc:'需求评审完成'},
    {id:2,name:'产品发布',date:'2025-01-31',desc:'正式上线'}
  ]
};
let editingTaskId=null;
const COLORS=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#f97316'];

function save(){localStorage.setItem('project_timeline_cn',JSON.stringify(project))}
function saveData(){project.name=document.getElementById('projectName').value;save()}

function showTaskModal(id){
  editingTaskId=id||null;
  document.getElementById('taskModalTitle').textContent=id?'编辑任务':'添加任务';
  if(id){const t=project.tasks.find(x=>x.id===id);document.getElementById('taskName').value=t.name;document.getElementById('taskStart').value=t.start;document.getElementById('taskEnd').value=t.end;document.getElementById('taskProgress').value=t.progress;document.getElementById('taskOwner').value=t.owner||''}
  else{document.getElementById('taskName').value='';document.getElementById('taskStart').value='';document.getElementById('taskEnd').value='';document.getElementById('taskProgress').value=0;document.getElementById('taskOwner').value=''}
  document.getElementById('taskModal').classList.remove('hidden');
}
function showMilestoneModal(){document.getElementById('msName').value='';document.getElementById('msDate').value='';document.getElementById('msDesc').value='';document.getElementById('milestoneModal').classList.remove('hidden')}
function closeModal(){document.getElementById('taskModal').classList.add('hidden');document.getElementById('milestoneModal').classList.add('hidden')}

function saveTask(){
  const name=document.getElementById('taskName').value.trim();if(!name)return;
  const start=document.getElementById('taskStart').value;const end=document.getElementById('taskEnd').value;
  const progress=Math.min(100,Math.max(0,+document.getElementById('taskProgress').value||0));
  const owner=document.getElementById('taskOwner').value.trim();
  if(editingTaskId){const t=project.tasks.find(x=>x.id===editingTaskId);if(t){t.name=name;t.start=start;t.end=end;t.progress=progress;t.owner=owner}}
  else project.tasks.push({id:Date.now(),name,start,end,progress,owner});
  save();render();closeModal();
}
function saveMilestone(){
  const name=document.getElementById('msName').value.trim();const date=document.getElementById('msDate').value;const desc=document.getElementById('msDesc').value.trim();
  if(!name||!date)return;
  project.milestones.push({id:Date.now(),name,date,desc});save();render();closeModal();
}
function deleteTask(id){project.tasks=project.tasks.filter(t=>t.id!==id);save();render()}
function deleteMilestone(id){project.milestones=project.milestones.filter(m=>m.id!==id);save();render()}
function resetAll(){if(!confirm('确定重置？'))return;project={name:'',tasks:[],milestones:[]};save();render()}

function render(){
  document.getElementById('projectName').value=project.name||'';
  const allDates=project.tasks.flatMap(t=>[t.start,t.end].filter(Boolean)).concat(project.milestones.map(m=>m.date));
  const total=project.tasks.length;
  const completed=project.tasks.filter(t=>t.progress===100).length;
  const avgProgress=total?Math.round(project.tasks.reduce((s,t)=>s+t.progress,0)/total):0;
  const milestoneCount=project.milestones.length;
  document.getElementById('statsGrid').innerHTML=`
    <div class="card stat"><div class="stat-num" style="color:var(--accent)">${total}</div><div class="stat-label">总任务</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--green)">${completed}</div><div class="stat-label">已完成</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--yellow)">${avgProgress}%</div><div class="stat-label">平均进度</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--text)">${milestoneCount}</div><div class="stat-label">里程碑</div></div>`;
  
  if(allDates.length>0){
    const sorted=allDates.sort();
    document.getElementById('dateRange').textContent=`${sorted[0]} → ${sorted[sorted.length-1]}`;
  }
  
  if(project.tasks.length===0){document.getElementById('ganttChart').innerHTML='<div class="empty">暂无任务</div>';renderMilestones();return}
  
  const sortedTasks=[...project.tasks].sort((a,b)=>a.start.localeCompare(b.start));
  const allStarts=sortedTasks.map(t=>t.start);
  const allEnds=sortedTasks.map(t=>t.end);
  const minDate=Math.min(...allStarts.map(d=>new Date(d)));
  const maxDate=Math.max(...allEnds.map(d=>new Date(d)));
  const totalDays=(maxDate-minDate)/(1000*60*60*24)||1;
  
  let ganttHtml='';
  sortedTasks.forEach((t,i)=>{
    const color=COLORS[i%COLORS.length];
    const startOffset=(new Date(t.start)-minDate)/(1000*60*60*24);
    const duration=(new Date(t.end)-new Date(t.start))/(1000*60*60*24)+1;
    const left=(startOffset/totalDays*100);
    const width=(duration/totalDays*100);
    ganttHtml+=`<div class="gantt-row">
      <div class="gantt-label" title="${t.name}">${t.name}${t.owner?' · '+t.owner:''}</div>
      <div class="gantt-bar-wrap">
        <div class="gantt-bar" style="left:${left}%;width:${width}%;background:${color}" title="${t.name}: ${t.progress}%">${t.progress}%</div>
        <div class="gantt-bar" style="left:${left}%;width:${width*t.progress/100}%;background:${color};opacity:.4;height:100%;border-radius:6px"></div>
      </div>
      <div style="width:80px;display:flex;gap:4px;justify-content:flex-end;padding-left:8px">
        <button class="btn btn-sm" onclick="showTaskModal(${t.id})" style="background:transparent;border:1px solid var(--border);color:var(--text);padding:2px 6px;font-size:.7rem">✎</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTask(${t.id})" style="padding:2px 6px;font-size:.7rem">✕</button>
      </div>
    </div>`;
  });
  document.getElementById('ganttChart').innerHTML=ganttHtml;
  renderMilestones();
}

function renderMilestones(){
  const sorted=[...project.milestones].sort((a,b)=>a.date.localeCompare(b.date));
  let h='';
  if(sorted.length===0)h='<div class="empty">暂无里程碑</div>';
  sorted.forEach(m=>{
    h+=`<div class="milestone"><div class="milestone-diamond" style="background:var(--accent)"></div>
      <div class="milestone-info"><div style="font-weight:600">${m.name}</div><div class="milestone-date">${m.date}${m.desc?' · '+m.desc:''}</div></div>
      <button class="btn btn-sm btn-danger" onclick="deleteMilestone(${m.id})" style="padding:2px 8px;font-size:.75rem">✕</button></div>`;
  });
  document.getElementById('milestoneList').innerHTML=h;
}

render();
</script>
</body>
</html>
