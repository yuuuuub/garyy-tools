<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 物候日历</title>
<meta name="description" content="中国传统物候日历，七十二候，花信风，自然节律">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.current-phenology{text-align:center;padding:30px;background:var(--bg);border-radius:12px;margin-bottom:16px}
.current-icon{font-size:4rem;margin-bottom:12px}
.current-name{font-size:1.5rem;font-weight:700;color:var(--accent)}
.current-desc{margin-top:8px;color:var(--text2);font-size:.95rem}
.current-date{margin-top:8px;font-size:.85rem;color:var(--text2)}
.season-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.season-tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.85rem;transition:all .2s}
.season-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.season-tab.spring{border-color:#22c55e}.season-tab.spring.active{background:#22c55e}
.season-tab.summer{border-color:#f59e0b}.season-tab.summer.active{background:#f59e0b}
.season-tab.autumn{border-color:#ef4444}.season-tab.autumn.active{background:#ef4444}
.season-tab.winter{border-color:#3b82f6}.season-tab.winter.active{background:#3b82f6}
.phenology-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.phenology-card{background:var(--bg);border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid transparent}
.phenology-card:hover{transform:translateY(-2px)}
.phenology-card.current{border-color:var(--accent);background:rgba(59,130,246,.1)}
.phenology-card .icon{font-size:2rem;margin-bottom:6px}
.phenology-card .name{font-weight:600;font-size:.9rem}
.phenology-card .date{font-size:.75rem;color:var(--text2);margin-top:2px}
.phenology-card .desc{font-size:.75rem;color:var(--text2);margin-top:4px}
.flower-wind{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.flower-item{flex-shrink:0;width:100px;text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.flower-item .icon{font-size:1.5rem}
.flower-item .name{font-size:.8rem;margin-top:4px;font-weight:600}
.flower-item .date{font-size:.7rem;color:var(--text2);margin-top:2px}
.phenology-detail{background:var(--bg);border-radius:8px;padding:16px;margin-top:12px}
.phenology-detail .title{font-size:1.1rem;font-weight:600;margin-bottom:8px}
.phenology-detail .content{font-size:.9rem;color:var(--text2);line-height:1.8}
.phenology-detail .poem{font-style:italic;margin-top:12px;padding:12px;background:var(--card);border-radius:8px;border-left:3px solid var(--accent)}
.month-timeline{position:relative;padding-left:20px}
.month-timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.month-item{position:relative;margin-bottom:20px;padding-left:20px}
.month-item::before{content:'';position:absolute;left:-16px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.month-item .month-name{font-weight:600;font-size:1rem;margin-bottom:4px}
.month-item .phenology-list{font-size:.85rem;color:var(--text2)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.sway{animation:sway 3s ease-in-out infinite;display:inline-block}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🌿 物候日历">
<meta property="og:description" content="中国传统物候日历，七十二候，花信风">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1 class="sway">🌿 物候日历</h1><p>感知自然节律，传承古人智慧</p></div>

<div class="cd">
<div class="current-phenology" id="currentPhenology"></div>
</div>

<div class="cd">
<h2>季节选择</h2>
<div class="season-tabs" id="seasonTabs"></div>
</div>

<div class="cd">
<h2>物候列表</h2>
<div class="phenology-grid" id="phenologyGrid"></div>
</div>

<div class="cd">
<h2>花信风</h2>
<div class="flower-wind" id="flowerWind"></div>
</div>

<div class="cd">
<h2>物候详解</h2>
<div class="phenology-detail" id="phenologyDetail"></div>
</div>

<div class="cd">
<h2>十二月物候</h2>
<div class="month-timeline" id="monthTimeline"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const seasons=[
  {name:'春',icon:'🌸',class:'spring',phenologies:[
    {name:'东风解冻',icon:'🌬️',date:'2月4日',desc:'春风送暖，冰雪消融'},
    {name:'蛰虫始振',icon:'🐛',date:'2月19日',desc:'冬眠动物开始苏醒'},
    {name:'鱼陟负冰',icon:'🐟',date:'3月6日',desc:'鱼儿浮上水面，背上似负冰'},
    {name:'桃始华',icon:'🌸',date:'3月21日',desc:'桃花开始绽放'},
    {name:'仓庚鸣',icon:'🐦',date:'4月5日',desc:'黄鹂鸟开始鸣叫'},
    {name:'鹰化为鸠',icon:'🕊️',date:'4月20日',desc:'鹰隐鸠现，春意盎然'},
    {name:'桐始华',icon:'🌳',date:'5月6日',desc:'梧桐树开始开花'},
    {name:'田鼠化为鴽',icon:'🐭',date:'5月21日',desc:'田鼠躲藏，鹌鹑活跃'},
    {name:'虹始见',icon:'🌈',date:'6月6日',desc:'雨后彩虹开始出现'},
    {name:'萍始生',icon:'🌿',date:'6月21日',desc:'水面浮萍开始生长'},
    {name:'鸣鸠拂其羽',icon:'🕊️',date:'7月7日',desc:'斑鸠拍打翅膀鸣叫'},
    {name:'戴胜降于桑',icon:'🐦',date:'7月23日',desc:'戴胜鸟飞临桑树'}
  ]},
  {name:'夏',icon:'☀️',class:'summer',phenologies:[
    {name:'蝼蝈鸣',icon:'🦗',date:'5月6日',desc:'蝼蛄开始鸣叫'},
    {name:'蚯蚓出',icon:'🪱',date:'5月21日',desc:'蚯蚓出土活动'},
    {name:'王瓜生',icon:'🍈',date:'6月6日',desc:'王瓜开始生长'},
    {name:'苦菜秀',icon:'🥬',date:'6月21日',desc:'苦菜开花'},
    {name:'靡草死',icon:'🌾',date:'7月7日',desc:'喜阴草木枯萎'},
    {name:'麦秋至',icon:'🌾',date:'7月23日',desc:'麦子成熟收获'},
    {name:'温风至',icon:'🌡️',date:'8月7日',desc:'热风开始吹拂'},
    {name:'蟋蟀居壁',icon:'🦗',date:'8月23日',desc:'蟋蟀躲进墙壁'},
    {name:'鹰始挚',icon:'🦅',date:'9月7日',desc:'猛禽开始捕猎'}
  ]},
  {name:'秋',icon:'🍂',class:'autumn',phenologies:[
    {name:'凉风至',icon:'🌬️',date:'8月7日',desc:'凉爽秋风到来'},
    {name:'白露降',icon:'💧',date:'9月7日',desc:'清晨露水凝结'},
    {name:'寒蝉鸣',icon:'🦗',date:'9月23日',desc:'蝉鸣渐渐凄切'},
    {name:'鸿雁来',icon:' goose',date:'10月8日',desc:'大雁南飞'},
    {name:'玄鸟归',icon:'🐦',date:'10月23日',desc:'燕子飞回南方'},
    {name:'群鸟养羞',icon:'🐦',date:'11月7日',desc:'鸟类储藏食物'},
    {name:'水始冰',icon:'❄️',date:'11月22日',desc:'水面开始结冰'},
    {name:'地始冻',icon:'🌍',date:'12月7日',desc:'土地开始冻结'},
    {name:'雉入大水为蜃',icon:'🦢',date:'12月22日',desc:'野鸟躲藏不见'}
  ]},
  {name:'冬',icon:'❄️',class:'winter',phenologies:[
    {name:'水始冰',icon:'❄️',date:'11月7日',desc:'水面开始结冰'},
    {name:'地始冻',icon:'🌍',date:'11月22日',desc:'土地开始冻结'},
    {name:'雉入大水为蜃',icon:'🦢',date:'12月7日',desc:'野鸟躲藏不见'},
    {name:'雁北乡',icon:' goose',date:'12月22日',desc:'大雁开始北归'},
    {name:'鹊始巢',icon:'🐦',date:'1月5日',desc:'喜鹊开始筑巢'},
    {name:'雉始雊',icon:'🦚',date:'1月20日',desc:'野鸡开始鸣叫'},
    {name:'东风解冻',icon:'🌬️',date:'2月4日',desc:'春风送暖，冰雪消融'},
    {name:'蛰虫始振',icon:'🐛',date:'2月19日',desc:'冬眠动物苏醒'},
    {name:'鱼陟负冰',icon:'🐟',date:'3月6日',desc:'鱼儿浮上水面'}
  ]}
];
const flowerWinds=[
  {name:'梅花',icon:'🌺',date:'小寒'},
  {name:'山茶',icon:'🌸',date:'大寒'},
  {name:'水仙',icon:'🌷',date:'立春'},
  {name:'瑞香',icon:'🌼',date:'雨水'},
  {name:'兰花',icon:'🌿',date:'惊蛰'},
  {name:'山矾',icon:'🌸',date:'春分'},
  {name:'牡丹',icon:'🌺',date:'清明'},
  {name:'酴醾',icon:'🌼',date:'谷雨'}
];
const months=[
  {name:'正月',phenologies:'东风解冻、蛰虫始振、鱼陟负冰'},
  {name:'二月',phenologies:'桃始华、仓庚鸣、鹰化为鸠'},
  {name:'三月',phenologies:'桐始华、田鼠化为鴽、虹始见'},
  {name:'四月',phenologies:'萍始生、鸣鸠拂其羽、戴胜降于桑'},
  {name:'五月',phenologies:'蝼蝈鸣、蚯蚓出、王瓜生'},
  {name:'六月',phenologies:'温风至、蟋蟀居壁、鹰始挚'},
  {name:'七月',phenologies:'凉风至、白露降、寒蝉鸣'},
  {name:'八月',phenologies:'鸿雁来、玄鸟归、群鸟养羞'},
  {name:'九月',phenologies:'水始冰、地始冻、雉入大水为蜃'},
  {name:'十月',phenologies:'水始冰、地始冻、雉入大水为蜃'},
  {name:'冬月',phenologies:'雁北乡、鹊始巢、雉始雊'},
  {name:'腊月',phenologies:'东风解冻、蛰虫始振、鱼陟负冰'}
];

let currentSeason=0;

function getCurrentPhenology(){
  const now=new Date();
  const month=now.getMonth()+1;
  const day=now.getDate();
  
  for(const season of seasons){
    for(const p of season.phenologies){
      const [pMonth,pDay]=p.date.split('月').map(s=>parseInt(s));
      if(month===pMonth&&day>=parseInt(pDay)){
        return p;
      }
    }
  }
  return seasons[0].phenologies[0];
}

function renderCurrentPhenology(){
  const phenology=getCurrentPhenology();
  $('currentPhenology').innerHTML=`
    <div class="current-icon">${phenology.icon}</div>
    <div class="current-name">${phenology.name}</div>
    <div class="current-desc">${phenology.desc}</div>
    <div class="current-date">${phenology.date}</div>
  `;
}

function renderSeasons(){
  $('seasonTabs').innerHTML=seasons.map((s,i)=>`<div class="season-tab ${s.class} ${i===currentSeason?'active':''}" onclick="selectSeason(${i})">${s.icon} ${s.name}</div>`).join('');
}

function selectSeason(index){
  currentSeason=index;
  renderSeasons();
  renderPhenologies();
}

function renderPhenologies(){
  const phenologies=seasons[currentSeason].phenologies;
  $('phenologyGrid').innerHTML=phenologies.map((p,i)=>`<div class="phenology-card ${i===0?'current':''}" onclick="showDetail(${currentSeason},${i})">
    <div class="icon">${p.icon}</div>
    <div class="name">${p.name}</div>
    <div class="date">${p.date}</div>
    <div class="desc">${p.desc}</div>
  </div>`).join('');
}

function showDetail(seasonIndex,phenologyIndex){
  const phenology=seasons[seasonIndex].phenologies[phenologyIndex];
  $('phenologyDetail').innerHTML=`
    <div class="title">${phenology.icon} ${phenology.name}</div>
    <div class="content">
      <p><strong>时间：</strong>${phenology.date}</p>
      <p><strong>含义：</strong>${phenology.desc}</p>
      <p style="margin-top:12px">古人通过观察自然界动植物的变化，总结出七十二候，用以指导农业生产和日常生活。每个物候都反映了特定时节的自然特征，体现了人与自然和谐共处的智慧。</p>
    </div>
    <div class="poem">
      <p>"春雨惊春清谷天，夏满芒夏暑相连。秋处露秋寒霜降，冬雪雪冬小大寒。"</p>
      <p style="text-align:right;font-size:.85rem;color:var(--text2);margin-top:8px">—— 二十四节气歌</p>
    </div>
  `;
}

function renderFlowerWind(){
  $('flowerWind').innerHTML=flowerWinds.map(f=>`<div class="flower-item">
    <div class="icon">${f.icon}</div>
    <div class="name">${f.name}</div>
    <div class="date">${f.date}</div>
  </div>`).join('');
}

function renderMonthTimeline(){
  $('monthTimeline').innerHTML=months.map(m=>`<div class="month-item">
    <div class="month-name">${m.name}</div>
    <div class="phenology-list">${m.phenologies}</div>
  </div>`).join('');
}

renderCurrentPhenology();
renderSeasons();
renderPhenologies();
renderFlowerWind();
renderMonthTimeline();
showDetail(0,0);
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
