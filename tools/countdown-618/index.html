<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛍️ 618大促倒计时 - Gary's Tools</title>
<meta name="description" content="2026年618年中大促实时倒计时，淘宝天猫/京东/拼多多各阶段时间节点，预售/开门红/高潮期一目了然">
<style>
:root{--bg:#fff1f0;--card:#fff;--text:#1a1a2e;--text2:#8c8c8c;--red:#ff4d4f;--gold:#faad14;--blue:#1890ff;--green:#52c41a;--border:#ffccc7;--radius:14px;--shadow:0 2px 16px rgba(0,0,0,.06)}
[data-theme="dark"]{--bg:#1a1010;--card:#2a1818;--text:#f0e0e0;--text2:#a09090;--border:#4a2020}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;-webkit-font-smoothing:antialiased}
.container{max-width:500px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#ff4d4f,#faad14);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.hero{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 20px;margin-bottom:16px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ff4d4f,#faad14,#ff4d4f)}
.hero-label{font-size:.85rem;color:var(--text2);margin-bottom:8px}
.countdown-big{display:flex;justify-content:center;gap:10px;margin:8px 0}
.cd-block{text-align:center;min-width:60px}
.cd-num{font-size:2.5rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;background:linear-gradient(180deg,#ff4d4f,#cf1322);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.cd-label{font-size:.7rem;color:var(--text2);margin-top:4px}
.phase-label{font-size:.95rem;font-weight:700;color:var(--red);margin-top:10px}
.phase-desc{font-size:.78rem;color:var(--text2)}
.timeline{display:flex;flex-direction:column;gap:0;margin-top:8px}
.tl-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;position:relative}
.tl-item::before{content:'';position:absolute;left:11px;top:34px;bottom:-14px;width:2px;background:var(--border)}
.tl-item:last-child::before{display:none}
.tl-dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;font-size:.75rem}
.tl-dot.active{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,79,.4)}50%{box-shadow:0 0 0 8px rgba(255,77,79,0)}}
.tl-content{flex:1}
.tl-date{font-size:.75rem;color:var(--text2);margin-bottom:2px}
.tl-name{font-size:.9rem;font-weight:700}
.tl-desc{font-size:.75rem;color:var(--text2);line-height:1.5}
.tl-status{font-size:.7rem;padding:2px 8px;border-radius:10px;display:inline-block;margin-top:4px}
.ts-active{background:rgba(255,77,79,.1);color:var(--red)}
.ts-upcoming{background:rgba(24,144,255,.1);color:var(--blue)}
.ts-done{background:rgba(140,140,140,.1);color:var(--text2)}
.platform-tips{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tip-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:10px;font-size:.82rem}
.tip-item .tip-icon{font-size:1.3rem;flex-shrink:0}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🛍️ 618大促倒计时</h1>
<p>2026年618年中大促 · 各阶段时间节点</p>
</header>

<div class="hero">
<div class="hero-label" id="heroLabel">距离618高潮期还有</div>
<div class="countdown-big">
<div class="cd-block"><div class="cd-num" id="cd-d">00</div><div class="cd-label">天</div></div>
<div class="cd-block"><div class="cd-num" id="cd-h">00</div><div class="cd-label">时</div></div>
<div class="cd-block"><div class="cd-num" id="cd-m">00</div><div class="cd-label">分</div></div>
<div class="cd-block"><div class="cd-num" id="cd-s">00</div><div class="cd-label">秒</div></div>
</div>
<div class="phase-label" id="phaseLabel">--</div>
<div class="phase-desc" id="phaseDesc">--</div>
</div>

<div class="card">
<h3 style="font-size:1rem;font-weight:700;margin-bottom:14px">📅 大促时间线</h3>
<div class="timeline" id="timeline"></div>
</div>

<div class="card">
<h3 style="font-size:1rem;font-weight:700;margin-bottom:14px">💡 满减攻略</h3>
<div class="platform-tips">
<div class="tip-item"><span class="tip-icon">🐱</span><span><strong>淘宝/天猫：</strong>跨店每满300减50，88VIP额外95折</span></div>
<div class="tip-item"><span class="tip-icon">🐶</span><span><strong>京东：</strong>每满299减50，PLUS会员专享价</span></div>
<div class="tip-item"><span class="tip-icon">🔺</span><span><strong>拼多多：</strong>百亿补贴直降，无套路满减</span></div>
<div class="tip-item"><span class="tip-icon">🎯</span><span><strong>抖音：</strong>直播间专属价，限时秒杀</span></div>
</div>
</div>
<footer>以各平台实际活动规则为准 🛒</footer>
</div>

<script>
const NOW=new Date();
const PHASES=[
{name:'预售期',start:new Date('2026-05-26T20:00:00+08:00'),end:new Date('2026-05-31T19:59:59+08:00'),desc:'付定金锁定好价',color:'#faad14'},
{name:'开门红',start:new Date('2026-05-31T20:00:00+08:00'),end:new Date('2026-06-03T23:59:59+08:00'),desc:'付尾款+现货开卖',color:'#ff4d4f'},
{name:'品类日',start:new Date('2026-06-04T00:00:00+08:00'),end:new Date('2026-06-15T19:59:59+08:00'),desc:'各品类轮番促销',color:'#1890ff'},
{name:'高潮期',start:new Date('2026-06-15T20:00:00+08:00'),end:new Date('2026-06-18T23:59:59+08:00'),desc:'618正日子，全年最低价',color:'#cf1322'},
{name:'返场期',start:new Date('2026-06-19T00:00:00+08:00'),end:new Date('2026-06-21T23:59:59+08:00'),desc:'最后捡漏机会',color:'#52c41a'},
];

function pad(n){return String(Math.floor(n)).padStart(2,'0')}

function getStatus(phase){
const n=Date.now();
if(n<phase.start)return'upcoming';
if(n<=phase.end)return'active';
return'done';
}

function update(){
const n=Date.now();
let target=null;

// Find current or next phase
for(const p of PHASES){
const s=getStatus(p);
if(s==='active'){target=p;break;}
if(s==='upcoming'&&!target){target=p;break;}
}
if(!target)target=PHASES[PHASES.length-1];

const diff=(target.start-n);
const isActive=getStatus(target)==='active';
const absDiff=Math.abs(diff);
const days=Math.floor(absDiff/86400000);
const hours=Math.floor((absDiff%86400000)/3600000);
const mins=Math.floor((absDiff%3600000)/60000);
const secs=Math.floor((absDiff%60000)/1000);

$('cd-d').textContent=pad(days);
$('cd-h').textContent=pad(hours);
$('cd-m').textContent=pad(mins);
$('cd-s').textContent=pad(secs);

if(isActive){
$('heroLabel').textContent=target.name+'进行中，距结束还有';
$('phaseLabel').textContent='🔥 '+target.name+'🔥';
}else{
$('heroLabel').textContent='距离'+target.name+'还有';
$('phaseLabel').textContent='⏰ '+target.name+'即将开始';
}
$('phaseDesc').textContent=target.desc;

// Timeline
$('timeline').innerHTML=PHASES.map((p,i)=>{
const s=getStatus(p);
const cls=s==='active'?'tl-dot active':(s==='done'?'tl-dot':'tl-dot');
const bg=s==='active'?p.color:(s==='done'?'#d9d9d9':p.color);
const statusCls=s==='active'?'ts-active':(s==='done'?'ts-done':'ts-upcoming');
const statusText=s==='active'?'进行中':(s==='done'?'已结束':'即将开始');
return `<div class="tl-item">
<div class="${cls}" style="background:${bg};color:#fff">${i+1}</div>
<div class="tl-content">
<div class="tl-date">${p.start.getMonth()+1}月${p.start.getDate()}日 - ${p.end.getMonth()+1}月${p.end.getDate()}日</div>
<div class="tl-name">${p.name}</div>
<div class="tl-desc">${p.desc}</div>
<span class="tl-status ${statusCls}">${statusText}</span>
</div>
</div>`;
}).join('');
}

function $(id){return document.getElementById(id)}

update();setInterval(update,1000);
</script>
<script src="../i18n.js"></script>
</body>
</html>
