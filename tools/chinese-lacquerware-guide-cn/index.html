<html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国漆器指南</title><meta name="description" content="中国漆器指南 - 了解中国漆器的历史工艺、流派特色和鉴赏知识"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.card h3{margin-bottom:12px;color:var(--blue)}.tab-bar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:8px}.tab{padding:8px 16px;cursor:pointer;border-radius:8px;white-space:nowrap;color:var(--text2);transition:var(--transition);border:1px solid var(--border);font-size:.9rem}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.tab:hover:not(.active){background:var(--bg)}.item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;transition:var(--transition)}.item h4{margin-bottom:6px}.item .meta{color:var(--text2);font-size:.85rem}.item .desc{margin-top:8px;line-height:1.8;color:var(--text2)}.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;margin:2px}.process-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}.process-step{background:var(--bg);border:1px solid var(--border);border-radius <div class="container"><h1>🏺 中国漆器指南</h1><p class="sub">了解中国漆器的历史工艺、流派特色和鉴赏知识</p>

<div class="tab" onclick="switchTab('crafts',this)">工艺技法</div>

</div>

<script src="../i18n.js" defer></script>
<script>
var data={
overview:{title:'中国漆器总览',content:'<p>中国是世界上最早使用天然漆的国家，漆器制作历史可追溯到七千年前。漆器是中国传统工艺品中的瑰宝，集实用与艺术于一体。</p><h4 style="margin-top:16px">基本特点</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px"><div class="item" style="cursor:default"><h4>🌳 天然大漆</h4><p class="desc">以天然漆树汁液为原料，经过加工精制而成。大漆具有防腐、耐酸、耐碱、绝缘等特性。</p></div><div class="item" style="cursor:default"><h4>🎨 色彩丰富</h4><p class="desc">漆器色彩以黑、红为主，也有黄、绿、蓝、金等色。经过打磨抛光，光彩照人。</p></div><div class="item" style="cursor:default"><h4>🔧 工艺复杂</h4><p class="desc">一件漆器需经过数十道工序，从制胎到完工往往需要数月甚至数年时间。</p></div><div class="item" style="cursor:default"><h4>✨ 经久耐用</h4><p class="desc">漆器耐高温、耐腐蚀、防水防潮，保存得当可使用数百年甚至更久。</p></div></div>'},
history:{title:'历史发展',items:[
{name:'新石器时代',era:'约7000年前',desc:'浙江河姆渡遗址出土了最早的漆器——朱漆碗，证明中国漆器历史至少有七千年。',tags:['起源','河姆渡']},
{name:'商周时期',era:'约3600年前',desc:'漆器制作已有相当水平，出现了镶嵌绿松石的漆器。商代已有专门的漆工。',tags:['发展','镶嵌']},
{name:'春秋战国',era:'约2500年前',desc:'漆器工艺迅速发展，品种增多。曾侯乙墓出土的漆器精美绝伦，展现了高超技艺。',tags:['高峰','曾侯乙']},
{name:'秦汉时期',era:'约2200年前',desc:'漆器进入鼎盛时期，出现了"夹纻胎""木胎"等多种胎体。马王堆汉墓出土漆器数量众多。',tags:['鼎盛','马王堆']},
{name:'唐宋时期',era:'约1000年前',desc:'漆器工艺更加精湛，出现了雕漆、螺钿、金银平脱等高级技法。漆器成为重要的出口商品。',tags:['精致','出口']},
{name:'明清时期',era:'约500年前',desc:'漆器工艺达到巅峰，出现了北京雕漆、扬州螺钿、福州脱胎漆器等著名品种。',tags:['巅峰','流派']},
{name:'近现代',era:'近代至今',desc:'漆器被列入国家级非物质文化遗产，各地设立传习所。现代漆器在继承传统的基础上不断创新。',tags:['传承','创新']}
]},
schools:{title:'地方流派',items:[
{name:'北京雕漆',region:'北京',desc:'以雕刻见长，在厚厚的漆层上雕刻出精美图案。色彩以剔红（红色）为主，也有剔黑、剔彩等。作品立体感强，气势恢宏。',tags:['雕刻','剔红','宫廷']},
{name:'扬州漆器',region:'江苏扬州',desc:'以螺钿镶嵌和百宝嵌闻名。将贝壳、玉石、象牙等材料镶嵌于漆面，光彩夺目。点螺工艺尤为精湛。',tags:['螺钿','镶嵌','精致']},
{name:'福州脱胎漆器',region:'福建福州',desc:'以脱胎工艺著称，胎体轻薄如纸。与北京景泰蓝、景德镇瓷器并称中国传统工艺"三宝"。',tags:['脱胎','轻薄','三宝']},
{name:'平遥推光漆器',region:'山西平遥',desc:'以手掌推光闻名，漆面光亮如镜。结合描金彩绘，色彩华丽。是山西传统工艺的代表。',tags:['推光','描金','光亮']},
{name:'大方漆器',region:'贵州大方',desc:'以皮胎漆器和隐花装饰著称。造型古朴，色彩深沉，具有浓郁的民族特色。',tags:['皮胎','民族','古朴']},
{name:'阳江漆器',region:'广东阳江',desc:'以皮胎漆器闻名，漆皮箱、漆皮枕是传统名产。色彩鲜艳，经久耐用。',tags:['皮胎','实用','鲜艳']}
]},
crafts:{title:'工艺技法',content:'<p>漆器制作工艺复杂，主要包括以下几大类：</p>',
items:[
{name:'制胎',desc:'漆器的胎体是基础，主要有木胎、竹胎、夹纻胎（麻布胎）、脱胎（无胎）等。不同胎体适合不同器型。',tags:['基础']},
{name:'髹漆',desc:'在胎体上反复涂刷漆液，每涂一层需阴干数日。精品漆器需涂数十遍甚至上百遍。',tags:['核心','反复']},
{name:'雕刻',desc:'在厚漆层上雕刻图案，包括剔红、剔黑、剔彩等。需要极高的手工技艺和耐心。',tags:['高级','雕刻']},
{name:'镶嵌',desc:'将螺钿、金银、玉石、象牙等材料镶嵌于漆面。包括螺钿镶嵌、百宝嵌、金银平脱等。',tags:['华丽','镶嵌']},
{name:'描饰',desc:'在漆面上描绘图案，包括描金、彩绘、戗金等。色彩丰富，表现力强。',tags:['绘画','色彩']},
{name:'打磨',desc:'最后的工序，用砂纸、木炭等反复打磨，使漆面光亮如镜。推光漆器需要用手掌反复推磨。',tags:['抛光','光泽']}
]},
culture:{title:'文化价值',content:'<div class="item" style="cursor:default"><h4>📜 历史价值</h4><p class="desc">漆器是研究中国古代社会生活、审美观念、工艺技术的重要实物资料。出土漆器的保存状况往往优于其他材质文物。</p></div><div class="item" style="cursor:default"><h4>🎨 艺术价值</h4><p class="desc">漆器工艺精湛，造型优美，是实用与艺术的完美结合。许多漆器本身就是艺术品，具有极高的收藏价值。</p></div><div class="item" style="cursor:default"><h4>🌍 国际影响</h4><p class="desc">中国漆器对日本、朝鲜等东亚国家的漆器工艺产生了深远影响。"China"一词本身与漆器（Chinese lacquer）有着密切关系。</p></div><div class="item" style="cursor:default"><h4>🏛️ 非遗保护</h4><p class="desc">北京雕漆、扬州漆器、福州脱胎漆器等均被列入国家级非物质文化遗产名录，得到系统性保护和传承。</p></div>'}
};
function switchTab(name,el){
document.querySelectorAll('.tab-bar .tab').forEach(function(t){t.classList.remove('active')});
el.classList.add('active');
renderContent(name);
}
function renderContent(name){
var d=data[name];
var html='<div class="card"><h3>'+d.title+'</h3>';
if(d.content) html+=d.content;
if(d.items){
d.items.forEach(function(item){
html+='<div class="item"><h4>'+item.name+'</h4>';
if(item.era) html+='<div class="meta">'+item.era+'</div>';
if(item.region) html+='<div class="meta">'+item.region+'</div>';
html+='<div class="desc">'+item.desc+'</div>';
if(item.tags) html+='<div style="margin-top:8px">'+item.tags.map(function(t){return '<span class="tag" style="background:rgba(59,130,246,.15);color:var(--blue)">'+t+'</span>'}).join('')+'</div>';
html+='</div>';
});
}
html+='</div>';
document.getElementById('content').innerHTML=html;
}
renderContent('overview');
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
