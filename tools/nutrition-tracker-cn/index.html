<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥗 营养追踪器</title>
<meta name="description" content="记录每日饮食营养摄入，追踪蛋白质、碳水、脂肪等宏量营养素">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px;margin-bottom:2px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.pb{width:100%;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px}.pb .fl{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥗</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🥗 营养追踪器">
<meta property="og:description" content="记录每日饮食营养摄入，追踪蛋白质、碳水、脂肪等宏量营养素">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/nutrition-tracker-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🥗 营养追踪器</h1><p>记录每日营养摄入，追踪宏量营养素</p></div>

<div class="gr" id="summary">
<div class="st"><div class="nm" id="totalCal">0</div><div class="lb">总热量 (kcal)</div></div>
<div class="st"><div class="nm" id="totalProtein" style="color:var(--success)">0</div><div class="lb">蛋白质 (g)</div></div>
<div class="st"><div class="nm" id="totalCarb" style="color:var(--warn)">0</div><div class="lb">碳水 (g)</div></div>
<div class="st"><div class="nm" id="totalFat" style="color:var(--danger)">0</div><div class="lb">脂肪 (g)</div></div>
</div>

<div class="cd"><h2>添加食物</h2>
<div class="fr">
<div><label>食物名称</label><input type="text" id="foodName" placeholder="如：鸡胸肉"></div>
<div><label>数量 (份)</label><input type="number" id="foodQty" placeholder="1" min="0.5" step="0.5" value="1"></div>
</div>
<div class="fr">
<div><label>热量 (kcal)</label><input type="number" id="foodCal" placeholder="每份热量"></div>
<div><label>蛋白质 (g)</label><input type="number" id="foodProtein" placeholder="蛋白质含量"></div>
</div>
<div class="fr">
<div><label>碳水化合物 (g)</label><input type="number" id="foodCarb" placeholder="碳水含量"></div>
<div><label>脂肪 (g)</label><input type="number" id="foodFat" placeholder="脂肪含量"></div>
</div>
<label>餐次</label>
<select id="mealType"><option value="早餐">🌅 早餐</option><option value="午餐">☀️ 午餐</option><option value="晚餐">🌙 晚餐</option><option value="加餐">🍪 加餐</option></select>
<div class="bg"><button onclick="addFood()">添加食物</button></div></div>

<div class="cd"><h2>快捷添加</h2>
<div class="bg" id="quickFoods"></div></div>

<div class="cd"><h2>今日记录</h2><div id="recordList" class="es">暂无记录</div>
<div class="bg"><button class="dng" onclick="clearToday()">清空今日记录</button></div></div>
</div>
<script>
(function(){
var DB_KEY='nutrition_tracker_cn';
var records=JSON.parse(localStorage.getItem(DB_KEY)||'[]');
var QUICK=[{n:'米饭(碗)',c:230,p:4.6,c2:50.8,f:0.6},{n:'鸡胸肉(100g)',c:165,p:31,c2:0,f:3.6},{n:'鸡蛋(1个)',c:72,p:6.3,c2:0.6,f:5},{n:'苹果(1个)',c:95,p:0.5,c2:25,f:0.3},{n:'全麦面包(片)',c:75,p:4,c:13,f:1},{n:'牛奶(250ml)',c:160,p:8,c2:12,f:8},{n:'西兰花(100g)',c:34,p:2.8,c2:7,f:0.4},{n:'牛肉(100g)',c:250,p:26,c2:0,f:15},{n:'酸奶(200ml)',c:160,p:10,c2:12,f:5},{n:'红薯(1个)',c:115,p:2,c2:27,f:0.1}];

function renderQuick(){
var el=document.getElementById('quickFoods');
el.innerHTML=QUICK.map(function(q,i){
return '<button onclick="addQuick('+i+')" style="font-size:.8rem;padding:6px 12px">'+q.n+'<br><span style="font-size:.7rem;opacity:.7">'+q.c+'kcal</span></button>';
}).join('');
}
window.addQuick=function(i){
var q=QUICK[i];
document.getElementById('foodName').value=q.n;
document.getElementById('foodCal').value=q.c;
document.getElementById('foodProtein').value=q.p;
document.getElementById('foodCarb').value=q.c2;
document.getElementById('foodFat').value=q.f;
};

window.addFood=function(){
var name=document.getElementById('foodName').value.trim();
var qty=parseFloat(document.getElementById('foodQty').value)||1;
var cal=parseFloat(document.getElementById('foodCal').value)||0;
var protein=parseFloat(document.getElementById('foodProtein').value)||0;
var carb=parseFloat(document.getElementById('foodCarb').value)||0;
var fat=parseFloat(document.getElementById('foodFat').value)||0;
var meal=document.getElementById('mealType').value;
if(!name){alert('请输入食物名称');return;}
records.push({name:name,qty:qty,cal:cal,protein:protein,carb:carb,fat:fat,meal:meal,date:new Date().toLocaleDateString(),id:Date.now()});
localStorage.setItem(DB_KEY,JSON.stringify(records));
document.getElementById('foodName').value='';
document.getElementById('foodQty').value='1';
document.getElementById('foodCal').value='';
document.getElementById('foodProtein').value='';
document.getElementById('foodCarb').value='';
document.getElementById('foodFat').value='';
render();
};

window.delRecord=function(id){
records=records.filter(function(r){return r.id!==id});
localStorage.setItem(DB_KEY,JSON.stringify(records));
render();
};

window.clearToday=function(){
var today=new Date().toLocaleDateString();
records=records.filter(function(r){return r.date!==today});
localStorage.setItem(DB_KEY,JSON.stringify(records));
render();
};

function render(){
var today=new Date().toLocaleDateString();
var todayR=records.filter(function(r){return r.date===today});
var tc=0,tp=0,tca=0,tf=0;
todayR.forEach(function(r){tc+=r.cal*r.qty;tp+=r.protein*r.qty;tca+=r.carb*r.qty;tf+=r.fat*r.qty;});
document.getElementById('totalCal').textContent=Math.round(tc);
document.getElementById('totalProtein').textContent=Math.round(tp);
document.getElementById('totalCarb').textContent=Math.round(tca);
document.getElementById('totalFat').textContent=Math.round(tf);

var el=document.getElementById('recordList');
if(!todayR.length){el.innerHTML='<div class="es">暂无记录</div>';return;}
var mealOrder=['早餐','午餐','晚餐','加餐'];
var grouped={};
todayR.forEach(function(r){if(!grouped[r.meal])grouped[r.meal]=[];grouped[r.meal].push(r);});
var html='';
mealOrder.forEach(function(m){
if(!grouped[m])return;
html+='<div style="margin-bottom:8px"><span style="font-weight:600;font-size:.9rem;color:var(--accent)">'+m+'</span></div>';
grouped[m].forEach(function(r){
html+='<div class="li"><div style="flex:1"><strong>'+r.name+'</strong> ×'+r.qty+'份 <span style="color:var(--text2);font-size:.8rem">('+r.cal+'kcal P:'+r.protein+'g C:'+r.carb+'g F:'+r.fat+'g)</span></div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="delRecord('+r.id+')">删除</button></div>';
});
});
el.innerHTML=html;
}
renderQuick();
render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
