<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国旅行目的地指南 - Chinese Travel Destinations</title>
<meta name="description" content="中国旅行目的地指南，精选热门景点、小众秘境与四季推荐，助你规划完美旅程">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国旅行目的地指南 - Chinese Travel Destinations">
<meta property="og:description" content="中国旅行目的地指南，精选热门景点、小众秘境与四季推荐">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#d97706;--accent2:#b45309}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#d97706;--accent2:#b45309}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a1505 0%,#2d2008 50%,#3d2a0a 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #8b6914;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#d97706,#fbbf24,#f59e0b,#eab308);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.dest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.dest-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.dest-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.dest-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.dest-card .d-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dest-card .d-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(217,119,6,0.15);color:var(--accent)}
.dest-card .d-name{font-size:1.3em;font-weight:bold}
.dest-card .d-province{font-size:0.8em;color:var(--text2);margin-top:2px}
.dest-card .d-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.dest-card .d-tags span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.dest-card .d-desc{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.dest-card .d-desc strong{color:var(--text)}
.dest-card .d-meta{display:flex;justify-content:space-between;font-size:0.75em;color:var(--text2);border-top:1px solid var(--border);padding-top:8px;margin-top:8px}
.dest-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.dest-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🗺️ 中国旅行目的地指南</h1>
<p>Chinese Travel Destinations — 探索华夏大地的壮丽山河与人文古迹</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索目的地...（如"故宫""九寨沟""丽江"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="热门">🔥 热门</button>
<button class="filter-btn" data-filter="自然风光">🏔️ 自然风光</button>
<button class="filter-btn" data-filter="历史文化">🏛️ 历史文化</button>
<button class="filter-btn" data-filter="小众秘境">✨ 小众秘境</button>
<button class="filter-btn" data-filter="海滨度假">🏖️ 海滨度假</button>
<button class="filter-btn" data-filter="古城古镇">🏘️ 古城古镇</button>
</div>
<div class="dest-grid" id="destGrid"></div>
<footer><p>🗺️ 中国旅行目的地指南 — 读万卷书，行万里路</p></footer>
</div>
<script>
const DEST_DATA=[
{id:1,name:"故宫博物院",en:"The Forbidden City",province:"北京",category:"历史文化",icon:"🏯",season:"四季皆宜",duration:"半天至一天",budget:"中等",desc:"明清两代皇宫，世界上现存规模最大、保存最完整的木质结构古建筑群，藏品超过186万件。"},
{id:2,name:"九寨沟",en:"Jiuzhaigou Valley",province:"四川",category:"自然风光",icon:"🏞️",season:"秋季最佳",duration:"2-3天",budget:"中高",desc:"以翠海、叠瀑、彩林、雪峰、藏情、蓝冰"六绝"闻名，被誉为"童话世界"。"},
{id:3,name:"张家界国家森林公园",en:"Zhangjiajie",province:"湖南",category:"自然风光",icon:"⛰️",season:"春秋最佳",duration:"2-3天",budget:"中等",desc:"以奇特的石英砂岩峰林地貌著称，电影《阿凡达》取景地，天门山玻璃栈道惊险刺激。"},
{id:4,name:"丽江古城",en:"Lijiang Old Town",province:"云南",category:"古城古镇",icon:"🏘️",season:"四季皆宜",duration:"3-5天",budget:"中等",desc:"世界文化遗产，纳西族古城，小桥流水、石板街道，兼具民族风情与文艺气息。"},
{id:5,name:"桂林漓江",en:"Li River, Guilin",province:"广西",category:"自然风光",icon:"🛶",season:"春夏最佳",duration:"2天",budget:"中等",desc:""桂林山水甲天下"，漓江风光是喀斯特地貌的典型代表，乘竹筏赏两岸美景。"},
{id:6,name:"西湖",en:"West Lake",province:"浙江杭州",category:"历史文化",icon:"🌅",season:"四季皆宜",duration:"1天",budget:"低",desc:"世界文化遗产，"上有天堂，下有苏杭"，断桥残雪、雷峰夕照等十景名扬天下。"},
{id:7,name:"布达拉宫",en:"Potala Palace",province:"西藏拉萨",category:"历史文化",icon:"🛕",season:"夏秋最佳",duration:"1-2天",budget:"中等",desc:"世界海拔最高的宏伟建筑群，藏传佛教圣地，松赞干布为文成公主所建。"},
{id:8,name:"鼓浪屿",en:"Gulangyu Island",province:"福建厦门",category:"海滨度假",icon:"🏝️",season:"春秋最佳",duration:"1-2天",budget:"中等",desc:"世界文化遗产，"海上花园"，万国建筑博物馆，钢琴之岛，文艺清新。"},
{id:9,name:"稻城亚丁",en:"Daocheng Yading",province:"四川",category:"小众秘境",icon:"🏔️",season:"秋季最佳",duration:"3-5天",budget:"中高",desc:""从你的全世界路过"取景地，三座神山环绕，被誉为"水蓝色星球上的最后一片净土"。"},
{id:10,name:"凤凰古城",en:"Fenghuang Ancient Town",province:"湖南湘西",category:"古城古镇",icon:"🏮",season:"四季皆宜",duration:"2天",budget:"低",desc:"沈从文笔下的边城，沱江泛舟、吊脚楼群，苗族风情浓郁的湘西明珠。"},
{id:11,name:"敦煌莫高窟",en:"Mogao Caves",province:"甘肃",category:"历史文化",icon:"🎨",season:"春夏秋",duration:"2天",budget:"中等",desc:"世界文化遗产，"东方艺术宝库"，壁画与彩塑艺术冠绝天下，丝绸之路明珠。"},
{id:12,name:"三亚亚龙湾",en:"Yalong Bay, Sanya",province:"海南",category:"海滨度假",icon:"🐚",season:"冬春最佳",duration:"3-5天",budget:"中高",desc:""东方夏威夷"，碧海蓝天、白沙细浪，中国最优质的热带海滨度假胜地。"},
{id:13,name:"额济纳旗胡杨林",en:"Ejina Populus Forest",province:"内蒙古",category:"小众秘境",icon:"🍂",season:"秋季",duration:"3天",budget:"中等",desc:"每年仅有21天的金色盛宴，三千年胡杨"生而不死、死而不倒、倒而不朽"。"},
{id:14,name:"黄山",en:"Mount Huangshan",province:"安徽",category:"自然风光",icon:"🌄",season:"四季皆宜",duration:"2天",budget:"中等",desc:""五岳归来不看山，黄山归来不看岳"，奇松、怪石、云海、温泉四绝闻名。"},
{id:15,name:"平遥古城",en:"Pingyao Ancient City",province:"山西",category:"古城古镇",icon:"🏛️",season:"春秋最佳",duration:"1-2天",budget:"低",desc:"世界文化遗产，中国保存最完整的明清古县城，票号文化发源地。"},
{id:16,name:"呼伦贝尔大草原",en:"Hulunbuir Grassland",province:"内蒙古",category:"自然风光",icon:"🌾",season:"夏秋最佳",duration:"3-5天",budget:"中等",desc:"中国最美草原，"绿色净土"，骑马驰骋、星空露营，感受游牧民族的辽阔。"}
];
const grid=document.getElementById('destGrid');
const search=document.getElementById('searchInput');
const filterRow=document.getElementById('filterRow');
let currentFilter='all';
function render(){
const q=search.value.toLowerCase();
grid.innerHTML='';
DEST_DATA.filter(d=>{
const matchFilter=currentFilter==='all'||d.category===currentFilter;
const matchSearch=!q||d.name.toLowerCase().includes(q)||d.en.toLowerCase().includes(q)||d.province.includes(q)||d.desc.includes(q);
return matchFilter&&matchSearch;
}).forEach(d=>{
grid.innerHTML+=`<div class="dest-card"><div class="d-header"><div class="d-icon">${d.icon}</div><div><div class="d-name">${d.name}</div><div class="d-province">${d.province} · ${d.en}</div></div></div><div class="d-tags"><span>${d.category}</span><span>📅 ${d.season}</span><span>⏱ ${d.duration}</span><span>💰 ${d.budget}</span></div><div class="d-desc">${d.desc}</div><div class="d-meta"><span>📍 ${d.province}</span><span>🏷️ ${d.category}</span></div></div>`;
});
}
filterRow.addEventListener('click',e=>{
if(e.target.classList.contains('filter-btn')){
filterRow.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
currentFilter=e.target.dataset.filter;
render();
}
});
search.addEventListener('input',render);
render();
</script>
</body>
</html>
