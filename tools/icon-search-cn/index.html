var currentCategory='all',currentPage=0,perPage=32;

function searchIcons(query,category){
  query=(query||'').toLowerCase();
  return iconDB.filter(function(icon){
    var catMatch=category==='all'||icon.c===category;
    if(!catMatch)return false;
    if(!query)return true;
    return icon.n.toLowerCase().indexOf(query)>=0||icon.k.toLowerCase().indexOf(query)>=0||icon.e.indexOf(query)>=0;
  });
}

function render(){
  var query=document.getElementById('searchInput').value;
  var icons=searchIcons(query,currentCategory);
  var grid=document.getElementById('iconGrid');grid.innerHTML='';
  var show=icons.slice(0,(currentPage+1)*perPage);
  show.forEach(function(icon){
    var el=document.createElement('div');el.className='icon-item';
    el.innerHTML='<span class="emoji">'+icon.e+'</span><span class="name">'+icon.n+'</span><span class="copy-hint">点击查看</span>';
    el.addEventListener('click',function(){showDetail(icon)});
    grid.appendChild(el);
  });
  document.getElementById('resultCount').textContent='共 '+icons.length+' 个图标';
  document.getElementById('loadMoreBtn').style.display=show.length>=icons.length?'none':'flex';
}

function showDetail(icon){
  document.getElementById('detailEmoji').textContent=icon.e;
  document.getElementById('detailName').textContent=icon.n;
  document.getElementById('detailModal').classList.add('show');
  document.getElementById('copyEmoji').onclick=function(){navigator.clipboard.writeText(icon.e).then(function(){showToast('✅ 已复制')})};
  document.getElementById('copyHtml').onclick=function(){navigator.clipboard.writeText('&#'+icon.e.codePointAt(0)+';').then(function(){showToast('✅ 已复制HTML实体')})};
  document.getElementById('copyEntity').onclick=function(){var cp=icon.e.codePointAt(0).toString(16);navigator.clipboard.writeText('\\u{'+cp+'}').then(function(){showToast('✅ 已复制Unicode')})};
  document.getElementById('copyName').onclick=function(){navigator.clipboard.writeText(icon.n).then(function(){showToast('✅ 已复制名称')})};
}
document.getElementById('detailClose').addEventListener('click',function(){document.getElementById('detailModal').classList.remove('show')});
document.getElementById('detailModal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});

initTags('catGrid',function(){currentCategory=document.querySelector('#catGrid .tag.active').dataset.val;currentPage=0;render()});
document.getElementById('searchBtn').addEventListener('click',function(){currentPage=0;render()});
document.getElementById('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter'){currentPage=0;render()}});
document.getElementById('loadMoreBtn').addEventListener('click',function(){currentPage++;render()});
render();
</script>
