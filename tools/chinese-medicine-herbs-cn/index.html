<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 中草药图鉴</title>
<meta property="og:title" content="🌿 中草药图鉴">
<meta property="og:description" content="中草药百科大全，药材分类、性味归经、功效详解 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="中草药百科大全，药材分类、性味归经、功效详解">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<meta name="robots" content="index, follow">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}.tag.b{background:rgba(59,130,246,.15);color:var(--blue)}.tag.p{background:rgba(168,85,247,.15);color:#a855f7}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.detail{display:none}.detail.active{display:block}
.step{padding:10px;border-left:3px solid var(--accent);margin-bottom:8px;background:var(--bg);border-radius:0 8px 8px 0}
.step-num{font-weight:700;color:var(--accent);margin-right:8px}
.herb-info{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.9rem;margin:12px 0}
.herb-info dt{color:var(--text2);font-weight:600}
.herb-info dd{color:var(--text)}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare-col{padding:12px;background:var(--bg);border-radius:8px}
</style>
</head>
<body>
<div class="ctn">
<div class="hdr">
<h1>🌿 中草药图鉴</h1>
<p>本草纲目，济世良方</p>
</div>

<div class="tab-bar" id="tabs">
<div class="tab active" data-tab="category">药材分类</div>
<div class="tab" data-tab="search">药材搜索</div>
<div class="tab" data-tab="compare">药材对照</div>
<div class="tab" data-tab="favorites">我的收藏</div>
</div>

<div id="view-category" class="detail active">
<div class="cd">
<h2>📋 选择分类</h2>
<div id="cat-tabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
<div id="herb-list"></div>
</div>
<div class="cd" id="herb-detail" style="display:none">
<h2 id="hd-title">药材详情</h2>
<div id="hd-content"></div>
<div style="margin-top:12px;display:flex;gap:8px">
<button onclick="toggleFavorite()" id="fav-btn">⭐ 收藏</button>
<button class="sec" onclick="addToCompare()">⚖️ 加入对照</button>
</div>
</div>
</div>

<div id="view-search" class="detail">
<div class="cd">
<h2>🔍 搜索药材</h2>
<input type="text" id="search-input" placeholder="输入药材名、拼音或功效...">
<div id="search-filters" style="display:flex;gap:6px;margin:8px 0;flex-wrap:wrap"></div>
<div id="search-results"></div>
</div>
</div>

<div id="view-compare" class="detail">
<div class="cd">
<h2>⚖️ 药材对照</h2>
<div id="compare-content"><div class="empty">请在药材分类中点击"加入对照"添加药材</div></div>
</div>
</div>

<div id="view-favorites" class="detail">
<div class="cd">
<h2>⭐ 我的收藏</h2>
<div id="fav-list"></div>
</div>
</div>
</div>

<script>
const herbs = [
  {name:'人参',pinyin:'rén shēn',nature:'温',meridian:'脾、肺、心经',category:'补益药',effects:'大补元气，复脉固脱，补脾益肺，生津养血，安神益智',usage:'另煎兑服，3-9g',caution:'实证、热证忌服',desc:'人参为补气第一要药，能回阳救逆，为治虚劳内伤第一要药。'},
  {name:'黄芪',pinyin:'huáng qí',nature:'温',meridian:'脾、肺经',category:'补益药',effects:'补气升阳，固表止汗，利水消肿，生津养血，行滞通痹',usage:'9-30g',caution:'表实邪盛、气滞湿阻等不宜',desc:'黄芪为补气固表之要药，被誉为"补药之长"。'},
  {name:'当归',pinyin:'dāng guī',nature:'温',meridian:'肝、心、脾经',category:'补益药',effects:'补血活血，调经止痛，润肠通便',usage:'6-12g',caution:'湿盛中满、大便溏泄者忌服',desc:'当归为补血要药，被誉为"血中之圣药"。'},
  {name:'枸杞',pinyin:'gǒu qǐ',nature:'平',meridian:'肝、肾经',category:'补益药',effects:'滋补肝肾，益精明目',usage:'6-12g',caution:'脾虚有湿及泄泻者忌服',desc:'枸杞为平补肝肾之品，药食两用，老少皆宜。'},
  {name:'白术',pinyin:'bái zhú',nature:'温',meridian:'脾、胃经',category:'补益药',effects:'健脾益气，燥湿利水，止汗，安胎',usage:'6-12g',caution:'阴虚燥渴、气滞胀闷者忌服',desc:'白术为健脾第一要药，补气健脾常与人参、茯苓同用。'},
  {name:'菊花',pinyin:'jú huā',nature:'微寒',meridian:'肺、肝经',category:'清热药',effects:'散风清热，平肝明目，清热解毒',usage:'5-10g',caution:'气虚胃寒、食少泄泻者慎用',desc:'菊花为清肝明目要药，有黄菊、白菊、野菊之分。'},
  {name:'金银花',pinyin:'jīn yín huā',nature:'寒',meridian:'肺、心、胃经',category:'清热药',effects:'清热解毒，疏散风热',usage:'6-15g',caution:'脾胃虚寒及气虚疮疡脓清者忌用',desc:'金银花为清热解毒要药，善治外感风热及痈肿疔疮。'},
  {name:'黄连',pinyin:'huáng lián',nature:'寒',meridian:'心、脾、胃、肝、胆、大肠经',category:'清热药',effects:'清热燥湿，泻火解毒',usage:'2-5g',caution:'脾胃虚寒者忌用',desc:'黄连为苦寒清热燥湿要药，善清心胃之火。'},
  {name:'甘草',pinyin:'gān cǎo',nature:'平',meridian:'心、肺、脾、胃经',category:'补益药',effects:'补脾益气，清热解毒，祛痰止咳，缓急止痛，调和诸药',usage:'2-10g',caution:'不宜与海藻、大戟、甘遂、芫花同用',desc:'甘草有"国老"之称，能调和诸药，应用极为广泛。'},
  {name:'茯苓',pinyin:'fú líng',nature:'平',meridian:'心、肺、脾、肾经',category:'祛湿药',effects:'利水渗湿，健脾，宁心',usage:'10-15g',caution:'虚寒精滑或气虚下陷者忌服',desc:'茯苓为利水渗湿要药，药性平和，补而不峻。'},
  {name:'川芎',pinyin:'chuān xiōng',nature:'温',meridian:'肝、胆、心包经',category:'活血药',effects:'活血行气，祛风止痛',usage:'3-10g',caution:'阴虚火旺、多汗者慎用',desc:'川芎为血中之气药，上行头目，下行血海。'},
  {name:'红花',pinyin:'hóng huā',nature:'温',meridian:'心、肝经',category:'活血药',effects:'活血通经，祛瘀止痛',usage:'3-10g',caution:'孕妇忌用，有出血倾向者慎用',desc:'红花为活血化瘀要药，善治经闭、跌打损伤。'},
  {name:'陈皮',pinyin:'chén pí',nature:'温',meridian:'脾、肺经',category:'理气药',effects:'理气健脾，燥湿化痰',usage:'3-10g',caution:'气虚体燥、阴虚燥咳者慎用',desc:'陈皮为理气健脾要药，有"一两陈皮一两金"之说。'},
  {name:'半夏',pinyin:'bàn xià',nature:'温',meridian:'脾、胃、肺经',category:'化痰药',effects:'燥湿化痰，降逆止呕，消痞散结',usage:'3-9g',caution:'孕妇慎用，不宜与乌头同用',desc:'半夏为治湿痰要药，生用有毒，须炮制后使用。'},
  {name:'柴胡',pinyin:'chái hú',nature:'微寒',meridian:'肝、胆、肺经',category:'解表药',effects:'和解表里，疏肝升阳',usage:'3-10g',caution:'肝风内动、阴虚火旺者忌用',desc:'柴胡为和解少阳要药，善疏肝解郁、升举阳气。'},
  {name:'芍药',pinyin:'sháo yào',nature:'微寒',meridian:'肝、脾经',category:'补益药',effects:'养血调经，敛阴止汗，柔肝止痛，平抑肝阳',usage:'6-15g',caution:'不宜与藜芦同用',desc:'芍药分白芍和赤芍，白芍养血敛阴，赤芍清热凉血。'},
  {name:'熟地黄',pinyin:'shú dì huáng',nature:'微温',meridian:'肝、肾经',category:'补益药',effects:'补血滋阴，益精填髓',usage:'9-15g',caution:'脾胃虚弱、气滞痰多者慎用',desc:'熟地黄为补血滋阴要药，为四物汤主药之一。'},
  {name:'麦冬',pinyin:'mài dōng',nature:'微寒',meridian:'心、肺、胃经',category:'补益药',effects:'养阴润肺，益胃生津，清心除烦',usage:'6-12g',caution:'脾胃虚寒泄泻者忌服',desc:'麦冬为养阴润肺要药，善治肺胃阴虚之证。'},
  {name:'天冬',pinyin:'tiān dōng',nature:'寒',meridian:'肺、肾经',category:'补益药',effects:'养阴润燥，清肺生津',usage:'6-12g',caution:'脾虚便溏者不宜',desc:'天冬与麦冬功效相似，但清火润燥之力更强。'},
  {name:'丹参',pinyin:'dān shēn',nature:'微寒',meridian:'心、肝经',category:'活血药',effects:'活血祛瘀，通经止痛，凉血消痈，除烦安神',usage:'10-15g',caution:'反藜芦，孕妇慎用',desc:'丹参有"一味丹参，功同四物"之说，为活血要药。'}
];

let activeCategory = '补益药';
let currentHerb = null;
let compareList = [];
let favorites = JSON.parse(localStorage.getItem('herb-favorites') || '[]');
const categories = [...new Set(herbs.map(h => h.category))];

function loadData() { return JSON.parse(localStorage.getItem('herb-compare') || '[]'); }
function saveData(d) { localStorage.setItem('herb-compare', JSON.stringify(d)); }
function saveFavs() { localStorage.setItem('herb-favorites', JSON.stringify(favorites)); }

function renderCatTabs() {
  document.getElementById('cat-tabs').innerHTML = categories.map(c =>
    `<div class="tab ${c === activeCategory ? 'active' : ''}" onclick="switchCategory('${c}')" style="padding:6px 12px;font-size:.8rem">${c}</div>`
  ).join('');
}

function switchCategory(cat) {
  activeCategory = cat;
  renderCatTabs();
  renderHerbList();
}

function renderHerbList() {
  const filtered = herbs.filter(h => h.category === activeCategory);
  document.getElementById('herb-list').innerHTML = filtered.map((h, i) => {
    const idx = herbs.indexOf(h);
    const isFav = favorites.includes(h.name);
    return `<div class="li" onclick="showHerb(${idx})">
      <div><strong>${h.name}</strong> ${isFav ? '⭐' : ''}<br><span style="color:var(--text2);font-size:.85rem">${h.pinyin} · ${h.nature} · ${h.meridian}</span></div>
      <span class="tag ${h.nature === '寒' ? 'd' : h.nature === '温' ? 'w' : 's'}">${h.nature}</span>
    </div>`;
  }).join('');
}

function showHerb(i) {
  currentHerb = i;
  const h = herbs[i];
  document.getElementById('herb-detail').style.display = 'block';
  document.getElementById('hd-title').textContent = h.name;
  const isFav = favorites.includes(h.name);
  document.getElementById('fav-btn').textContent = isFav ? '取消收藏' : '⭐ 收藏';
  document.getElementById('hd-content').innerHTML = `
    <p style="margin-bottom:12px;color:var(--text2)">${h.desc}</p>
    <dl class="herb-info">
      <dt>拼音</dt><dd>${h.pinyin}</dd>
      <dt>性味</dt><dd><span class="tag ${h.nature === '寒' ? 'd' : h.nature === '温' ? 'w' : 's'}">${h.nature}</span></dd>
      <dt>归经</dt><dd>${h.meridian}</dd>
      <dt>分类</dt><dd><span class="tag b">${h.category}</span></dd>
      <dt>功效</dt><dd>${h.effects}</dd>
      <dt>用法</dt><dd>${h.usage}</dd>
      <dt>注意</dt><dd style="color:var(--danger)">${h.caution}</dd>
    </dl>`;
}

function toggleFavorite() {
  if (currentHerb === null) return;
  const name = herbs[currentHerb].name;
  const idx = favorites.indexOf(name);
  if (idx > -1) favorites.splice(idx, 1); else favorites.push(name);
  saveFavs();
  document.getElementById('fav-btn').textContent = favorites.includes(name) ? '取消收藏' : '⭐ 收藏';
  renderHerbList();
}

function addToCompare() {
  if (currentHerb === null) return;
  if (compareList.length >= 2) compareList.shift();
  if (!compareList.includes(currentHerb)) compareList.push(currentHerb);
  saveData(compareList);
  alert(`已加入对照：${herbs[currentHerb].name}（${compareList.length}/2）`);
}

function renderCompare() {
  if (compareList.length < 2) {
    document.getElementById('compare-content').innerHTML = '<div class="empty">请在药材分类中点击"加入对照"添加2种药材</div>';
    return;
  }
  const [a, b] = compareList.map(i => herbs[i]);
  const fields = [['拼音','pinyin'],['性味','nature'],['归经','meridian'],['功效','effects'],['用法','usage'],['注意','caution']];
  document.getElementById('compare-content').innerHTML = `
    <div class="compare-grid">
      <div class="compare-col"><h3 style="margin-bottom:8px">${a.name}</h3>${fields.map(([l,k]) => `<div style="margin-bottom:6px"><small style="color:var(--text2)">${l}</small><br>${a[k]}</div>`).join('')}</div>
      <div class="compare-col"><h3 style="margin-bottom:8px">${b.name}</h3>${fields.map(([l,k]) => `<div style="margin-bottom:6px"><small style="color:var(--text2)">${l}</small><br>${b[k]}</div>`).join('')}</div>
    </div>
    <button class="sec" onclick="compareList=[];saveData(compareList);renderCompare()" style="margin-top:12px;width:100%">清空对照</button>`;
}

// Search
const natures = [...new Set(herbs.map(h => h.nature))];
document.getElementById('search-filters').innerHTML = natures.map(n =>
  `<div class="tab nature-filter" data-nature="${n}" onclick="filterNature('${n}')" style="padding:5px 10px;font-size:.75rem">${n}</div>`
).join('') + `<div class="tab nature-filter active" data-nature="all" onclick="filterNature('all')" style="padding:5px 10px;font-size:.75rem">全部</div>`;
let activeNature = 'all';

function filterNature(n) {
  activeNature = n;
  document.querySelectorAll('.nature-filter').forEach(f => f.classList.toggle('active', f.dataset.nature === n));
  doSearch();
}

document.getElementById('search-input').addEventListener('input', doSearch);

function doSearch() {
  const q = document.getElementById('search-input').value.toLowerCase();
  let results = herbs.filter(h => {
    const matchQ = !q || h.name.includes(q) || h.pinyin.includes(q) || h.effects.includes(q);
    const matchN = activeNature === 'all' || h.nature === activeNature;
    return matchQ && matchN;
  });
  document.getElementById('search-results').innerHTML = results.length ? results.map(h => {
    const idx = herbs.indexOf(h);
    return `<div class="li" onclick="showHerb(${idx})">
      <div><strong>${h.name}</strong> ${h.pinyin}<br><span style="color:var(--text2);font-size:.85rem">${h.effects.substring(0, 20)}...</span></div>
      <span class="tag ${h.nature === '寒' ? 'd' : h.nature === '温' ? 'w' : 's'}">${h.nature}</span>
    </div>`;
  }).join('') : '<div class="empty">未找到匹配药材</div>';
}

function renderFavorites() {
  const favHerbs = herbs.filter(h => favorites.includes(h.name));
  document.getElementById('fav-list').innerHTML = favHerbs.length ? favHerbs.map(h => {
    const idx = herbs.indexOf(h);
    return `<div class="li" onclick="showHerb(${idx})">
      <div><strong>${h.name}</strong> ${h.pinyin}<br><span style="color:var(--text2);font-size:.85rem">${h.effects.substring(0, 25)}...</span></div>
      <span class="tag s">已收藏</span>
    </div>`;
  }).join('') : '<div class="empty">暂无收藏</div>';
}

// Tabs
document.querySelectorAll('#tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'compare') renderCompare();
    if (tab.dataset.tab === 'favorites') renderFavorites();
  });
});

compareList = loadData();
renderCatTabs();
renderHerbList();
doSearch();
</script>
</body>
</html>
