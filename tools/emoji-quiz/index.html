<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>😄 表情猜词</title>
<meta name="description" content="Emoji表情猜词游戏，根据表情符号猜出对应成语或词语">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--correct:#2ea043;--wrong:#f85149}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;min-height:100vh;padding:16px}
.container{width:100%;max-width:500px;display:flex;flex-direction:column;gap:16px}
.header{text-align:center;padding:16px 0}
.header h1{font-size:1.8rem;margin-bottom:8px}
.stats{display:flex;justify-content:center;gap:24px;font-size:.9rem;color:#8b949e}
.stats span{display:flex;flex-direction:column;align-items:center;gap:4px}
.stats .num{font-size:1.4rem;font-weight:700;color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px}
.emoji-display{text-align:center;font-size:4rem;padding:30px 0;letter-spacing:8px;min-height:100px;line-height:1.5}
.hint-text{color:#8b949e;font-size:.9rem;text-align:center;margin:8px 0}
.input-area{display:flex;gap:8px}
.input-area input{flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:1rem;outline:none}
.input-area input:focus{border-color:var(--accent)}
.input-area button{padding:12px 20px;border:none;border-radius:10px;background:var(--accent);color:var(--text);cursor:pointer;font-size:1rem}
.feedback{text-align:center;font-size:1.1rem;font-weight:600;padding:12px 0;min-height:44px}
.hint-btn{display:inline-block;padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:transparent;color:#8b949e;cursor:pointer;font-size:.85rem;margin-top:8px}
.hint-btn:hover{border-color:var(--accent);color:var(--accent)}
.start-btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;background:var(--accent);color:var(--text);font-size:1.1rem;cursor:pointer}
.category{font-size:.85rem;color:#8b949e;text-align:center;margin-bottom:8px}
.game-over{text-align:center;padding:30px 0}
.game-over h2{font-size:1.6rem;margin-bottom:16px}
.game-over .final-score{font-size:3rem;font-weight:700;color:var(--accent)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="😄 表情猜词">
  <meta property="og:description" content="Emoji表情猜词游戏，根据表情符号猜出对应成语或词语">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/emoji-quiz/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<div class="header"><h1>😄 表情猜词</h1>
<div class="stats"><span>得分<span class="num" id="score">0</span></span><span>连对<span class="num" id="streak">0</span></span><span>正确率<span class="num" id="acc">0%</span></span></div></div>
<div class="card" id="startScreen"><p style="text-align:center;margin-bottom:16px;font-size:1.1rem">根据表情组合猜出对应的词语</p><button class="start-btn" onclick="startGame()">开始游戏</button></div>
<div class="card" id="gameArea" style="display:none">
<div class="category" id="category"></div>
<div class="emoji-display" id="emojis"></div>
<div class="hint-text" id="hintText"></div>
<div class="feedback" id="feedback"></div>
<div class="input-area"><input id="answer" placeholder="输入你的答案..." onkeydown="if(event.key==='Enter')submit()"><button onclick="submit()">确定</button></div>
<div style="text-align:center;margin-top:10px"><button class="hint-btn" onclick="showHint()">💡 提示</button> <button class="hint-btn" onclick="skip()">⏭ 跳过</button></div>
</div>
<div class="card game-over" id="endScreen" style="display:none"><h2>🎉 游戏结束</h2><div class="final-score" id="finalScore">0</div><p style="margin:12px 0">答对 <span id="c">0</span>/<span id="t">0</span></p><button class="start-btn" onclick="startGame()">再来一局</button></div>
</div>
<script>
const PUZZLES=[
{emojis:'🐉🐴',answer:'龙马精神',category:'成语',hint:'比喻精力旺盛'},
{emojis:'🐂🌙',answer:'牛郎织女',category:'成语',hint:'神话故事中的人物'},
{emojis:'🌸❄️',answer:'花好月圆',category:'成语',hint:'美好的景象'},
{emojis:'🐔🐶',answer:'鸡飞狗跳',category:'成语',hint:'形容混乱'},
{emojis:'🐟🌊',answer:'如鱼得水',category:'成语',hint:'形容很自在'},
{emojis:'🦊🐯',answer:'狐假虎威',category:'成语',hint:'借别人的势力欺人'},
{emojis:'🎬⭐',answer:'星光大道',category:'娱乐',hint:'著名节目'},
{emojis:'🎵🎤',answer:'中国好声音',category:'娱乐',hint:'音乐节目'},
{emojis:'📺📖',answer:'百家讲坛',category:'娱乐',hint:'文化类节目'},
{emojis:'🍎🍊',answer:'水果',category:'食物',hint:'都是吃的'},
{emojis:'🍕🍔',answer:'快餐',category:'食物',hint:'西式食品'},
{emojis:'🍜🥟',answer:'中餐',category:'食物',hint:'中国传统'},
{emojis:'🏀⚽',answer:'体育',category:'运动',hint:'都跟球有关'},
{emojis:'🏊🏃',answer:'运动',category:'运动',hint:'锻炼身体'},
{emojis:'🎯🏹',answer:'射箭',category:'运动',hint:'瞄准目标'},
{emojis:'🐱🐟',answer:'猫吃鱼',category:'动物',hint:'猫最爱吃'},
{emojis:'🐶🦴',answer:'狗啃骨头',category:'动物',hint:'狗的最爱'},
{emojis:'🐰🥕',answer:'兔子吃萝卜',category:'动物',hint:'经典搭配'},
{emojis:'📱💻',answer:'电子产品',category:'科技',hint:'现代设备'},
{emojis:'🔧🔨',answer:'工具',category:'生活',hint:'干活用的'},
{emojis:'✈️🗼',answer:'巴黎旅行',category:'旅游',hint:'法国首都'},
{emojis:'🌙⭐',answer:'夜空',category:'自然',hint:'晚上能看到'},
{emojis:'🌊🏖️',answer:'海边度假',category:'旅游',hint:'阳光沙滩'},
{emojis:'🎤🎵',answer:'唱歌',category:'娱乐',hint:'用嗓子'},
{emojis:'🎨🖼️',answer:'画画',category:'艺术',hint:'用画笔'},
{emojis:'⚽🏆',answer:'世界杯',category:'体育',hint:'足球盛事'},
{emojis:'🎂🎁',answer:'生日',category:'节日',hint:'每年一次'},
{emojis:'🎄🎁',answer:'圣诞节',category:'节日',hint:'西方节日'},
{emojis:'🧧🧧',answer:'春节',category:'节日',hint:'中国新年'},
{emojis:'🐉🏮',answer:'元宵节',category:'节日',hint:'正月十五'},
{emojis:'🌙🥮',answer:'中秋节',category:'节日',hint:'八月十五'},
{emojis:'🚢🧊',answer:'泰坦尼克号',category:'电影',hint:'经典爱情片'},
{emojis:'🦁👑',answer:'狮子王',category:'电影',hint:'迪士尼动画'},
{emojis:'🕷️🕸️',answer:'蜘蛛侠',category:'电影',hint:'超级英雄'},
{emojis:'🧙‍♂️⚡',answer:'哈利波特',category:'电影',hint:'魔法世界'},
{emojis:'🏎️💥',answer:'速度与激情',category:'电影',hint:'飙车系列'},
{emojis:'🌍✈️',answer:'环游世界',category:'旅游',hint:'八十天'},
{emojis:'👨‍🍳🍕',answer:'披萨',category:'食物',hint:'意大利名菜'},
{emojis:'🎵🎹',answer:'弹钢琴',category:'艺术',hint:'乐器之王'},
{emojis:'📚✏️',answer:'学习',category:'生活',hint:'学生日常'}
];
let puzzles=[],current=null,idx=0,score=0,streak=0,correct=0,hints=0;
function startGame(){
puzzles=[...PUZZLES].sort(()=>Math.random()-.5).slice(0,15);
idx=0;score=0;streak=0;correct=0;
document.getElementById('startScreen').style.display='none';
document.getElementById('endScreen').style.display='none';
document.getElementById('gameArea').style.display='block';
updateStats();showPuzzle();
}
function showPuzzle(){
if(idx>=puzzles.length){endGame();return}
current=puzzles[idx];hints=0;
document.getElementById('category').textContent='📂 '+current.category;
document.getElementById('emojis').textContent=current.emojis;
document.getElementById('hintText').textContent='';
document.getElementById('feedback').textContent='';
document.getElementById('feedback').style.color='';
document.getElementById('answer').value='';
document.getElementById('answer').focus();
}
function submit(){
const v=document.getElementById('answer').value.trim();
if(!v)return;
if(v===current.answer){
score+=Math.max(10-hints*5,0)*10+streak*5;streak++;correct++;
document.getElementById('feedback').textContent='✅ 正确！'+current.answer;
document.getElementById('feedback').style.color='var(--correct)';
}else{
streak=0;
document.getElementById('feedback').textContent='❌ 答案是：'+current.answer;
document.getElementById('feedback').style.color='var(--wrong)';
}
updateStats();idx++;setTimeout(showPuzzle,1500);
}
function showHint(){
if(hints>=3)return;hints++;
const a=current.answer;
if(hints===1)document.getElementById('hintText').textContent='💡 提示：'+a[0]+'_'+a.slice(2);
else if(hints===2)document.getElementById('hintText').textContent='💡 '+a[0]+'_'+a.slice(2)+'_';
else document.getElementById('hintText').textContent='💡 '+current.hint;
}
function skip(){streak=0;idx++;showPuzzle()}
function updateStats(){
document.getElementById('score').textContent=score;
document.getElementById('streak').textContent=streak;
document.getElementById('acc').textContent=idx>0?Math.round(correct/idx*100)+'%':'0%';
}
function endGame(){
document.getElementById('gameArea').style.display='none';
document.getElementById('endScreen').style.display='block';
document.getElementById('finalScore').textContent=score;
document.getElementById('c').textContent=correct;
document.getElementById('t').textContent=puzzles.length;
}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
