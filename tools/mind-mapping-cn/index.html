<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 中文思维导图</title>
<meta name="description" content="在线思维导图工具，创建和编辑思维导图，支持导出PNG和本地保存">
<meta name="robots" content="index, follow">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden;line-height:1.6}
#toolbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px;z-index:100}
#toolbar .brand{font-size:18px;font-weight:700;color:var(--accent);margin-right:16px}
#toolbar button{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;transition:var(--transition);white-space:nowrap}
#toolbar button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
#toolbar .sep{width:1px;height:26px;background:var(--border);margin:0 4px}
#canvas-wrap{position:fixed;top:52px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
#canvas-wrap:active{cursor:grabbing}
svg{width:100%;height:100%}
.mm-node{cursor:pointer}
.mm-rect{rx:12;ry:12;transition:fill .15s}
.mm-text{fill:var(--text);font-size:14px;font-family:inherit;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mm-root .mm-text{font-size:18px;font-weight:700}
.mm-link{stroke:var(--border);stroke-width:2;fill:none}
.mm-line{stroke:var(--accent);stroke-width:2;fill:none}
.mm-btn{fill:var(--accent);cursor:pointer;transition:fill .15s}
.mm-btn:hover{fill:var(--red)}
#context-menu{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 0;z-index:200;box-shadow:var(--shadow);min-width:140px}
#context-menu div{padding:8px 16px;cursor:pointer;font-size:13px;transition:background .15s}
#context-menu div:hover{background:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1 style="position:fixed;top:6px;left:80px;z-index:999;font-size:1rem;pointer-events:none">🧠 中文思维导图</h1>
<div id="toolbar">
<span class="brand">🧠 思维导图</span>
<button onclick="addChild()">+ 子节点</button>
<button onclick="addSibling()">+ 同级节点</button>
<button onclick="deleteNode()">删除</button>
<div class="sep"></div>
<button onclick="expandAll()">展开全部</button>
<button onclick="collapseAll()">折叠全部</button>
<div class="sep"></div>
<button onclick="exportPNG()">导出PNG</button>
<button onclick="loadDemo()">示例</button>
</div>
<div id="canvas-wrap"></div>
<div id="context-menu" class="hidden"></div>

<script>
document.title='🧠 中文思维导图';
const SVG_NS='http://www.w3.org/2000/svg';
const wrap=document.getElementById('canvas-wrap');
const ctxMenu=document.getElementById('context-menu');
let data=JSON.parse(localStorage.getItem('mm_cn_data')||'null');
if(!data) data={text:'中心主题',children:[],collapsed:false};
let selected=null;
let viewBox={x:-400,y:-200,w:1200,h:800};
let isPanning=false,panStart={x:0,y:0};

function save(){localStorage.setItem('mm_cn_data',JSON.stringify(data))}

function getLayout(node,depth=0,x=0){
let result=[];
let colors=['#3b82f6','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#06b6d4','#f97316'];
let color=colors[depth%colors.length];
let childH=node.children&&!node.collapsed?node.children.reduce((s,c)=>s+getLayout(c,depth+1,0).length*50,0):0;
childH=Math.max(childH,50);
result.push({node,x,y:0,depth,color,w:120,h:Math.min(childH,400)});
if(node.children&&!node.collapsed){
let cy=-(childH/2);
node.children.forEach(c=>{
let cl=getLayout(c,depth+1,x+180);
let ch=cl.filter(l=>l.depth===depth+1).reduce((s,l)=>Math.max(s,l.h),0)||50;
cl.forEach(l=>{l.y+=cy+ch/2});
cy+=ch+10;
result.push(...cl);
});
}
return result;
}

function render(){
let svg=document.createElementNS(SVG_NS,'svg');
svg.setAttribute('viewBox',`${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
svg.style.background='var(--bg)';
let layout=getLayout(data);
layout.forEach(item=>{
let g=document.createElementNS(SVG_NS,'g');
g.setAttribute('transform',`translate(${item.x},${item.y})`);
g.classList.add('mm-node');
if(item.depth===0)g.classList.add('mm-root');

let rect=document.createElementNS(SVG_NS,'rect');
rect.setAttribute('width',item.w);
rect.setAttribute('height',40);
rect.setAttribute('x',-item.w/2);
rect.setAttribute('y',-20);
rect.setAttribute('fill',item.color+'22');
rect.setAttribute('stroke',item.color);
rect.classList.add('mm-rect');
g.appendChild(rect);

let text=document.createElementNS(SVG_NS,'text');
text.textContent=item.node.text;
text.classList.add('mm-text');
g.appendChild(text);

if(item.node.children&&item.node.children.length){
let btn=document.createElementNS(SVG_NS,'text');
btn.textContent=item.node.collapsed?`+${item.node.children.length}`:'−';
btn.setAttribute('x',item.w/2+10);
btn.setAttribute('y',0);
btn.setAttribute('fill',item.color);
btn.setAttribute('font-size','14');
btn.setAttribute('dominant-baseline','central');
btn.classList.add('mm-btn');
btn.onclick=(e)=>{e.stopPropagation();item.node.collapsed=!item.node.collapsed;save();render()};
g.appendChild(btn);
}

g.onclick=()=>{selected=item.node;render()};
g.oncontextmenu=(e)=>{e.preventDefault();selected=item.node;showContextMenu(e.clientX,e.clientY)};
svg.appendChild(g);

// Draw links to children
if(item.node.children&&!item.node.collapsed){
let childrenLayout=layout.filter(l=>l.depth===item.depth+1);
let parentBottom=item.y+20;
childrenLayout.forEach(cl=>{
let link=document.createElementNS(SVG_NS,'path');
let midX=(item.x+cl.x)/2;
link.setAttribute('d',`M${item.x+item.w/2},${parentBottom} C${midX},${parentBottom} ${midX},${cl.y-20} ${cl.x-cl.w/2},${cl.y-20}`);
link.classList.add('mm-link');
link.setAttribute('stroke',cl.color);
svg.appendChild(link);
});
}
});

wrap.innerHTML='';
wrap.appendChild(svg);
}

function showContextMenu(x,y){
ctxMenu.style.left=x+'px';
ctxMenu.style.top=y+'px';
ctxMenu.classList.remove('hidden');
ctxMenu.innerHTML=`
<div onclick="addChild();closeCtx()">添加子节点</div>
<div onclick="addSibling();closeCtx()">添加同级节点</div>
<div onclick="editNodeText();closeCtx()">编辑文本</div>
<div onclick="deleteNode();closeCtx()">删除节点</div>
`;
}
function closeCtx(){ctxMenu.classList.add('hidden')}

function addChild(){
if(!selected)selected=data;
if(!selected.children)selected.children=[];
let child={text:'新节点',children:[],collapsed:false};
selected.children.push(child);
selected.collapsed=false;
selected=child;
save();render();
}

function addSibling(){
if(!selected||selected===data)return;
let parent=findParent(data,selected);
if(!parent||!parent.children)return;
let idx=parent.children.indexOf(selected);
let sibling={text:'新节点',children:[],collapsed:false};
parent.children.splice(idx+1,0,sibling);
selected=sibling;
save();render();
}

function deleteNode(){
if(!selected||selected===data)return;
let parent=findParent(data,selected);
if(!parent||!parent.children)return;
parent.children=parent.children.filter(c=>c!==selected);
selected=parent;
save();render();
}

function editNodeText(){
if(!selected)return;
let text=prompt('编辑节点文本:',selected.text);
if(text!==null&&text.trim()){selected.text=text.trim();save();render()}
}

function findParent(root,target){
if(root.children){
for(let c of root.children){
if(c===target)return root;
let found=findParent(c,target);
if(found)return found;
}
}
return null;
}

function expandAll(){
function expand(node){node.collapsed=false;if(node.children)node.children.forEach(expand)}
expand(data);save();render();
}

function collapseAll(){
function collapse(node){if(node.children&&node.children.length){node.collapsed=true;node.children.forEach(c=>collapse(c))}}
data.children?.forEach(c=>collapse(c));
save();render();
}

function exportPNG(){
let svgEl=wrap.querySelector('svg');
let serializer=new XMLSerializer();
let source=serializer.serializeToString(svgEl);
let canvas=document.createElement('canvas');
canvas.width=1600;canvas.height=1000;
let ctx=canvas.getContext('2d');
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#0d1117';
ctx.fillRect(0,0,1600,1000);
let img=new Image();
img.onload=function(){ctx.drawImage(img,0,0);let a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='思维导图.png';a.click()};
img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(source)));
}

function loadDemo(){
data={text:'学习计划',children:[
{text:'数学',children:[{text:'微积分',children:[]},{text:'线性代数',children:[]}]},
{text:'英语',children:[{text:'词汇',children:[]},{text:'阅读',children:[]},{text:'写作',children:[]}]},
{text:'编程',children:[{text:'JavaScript',children:[]},{text:'Python',children:[]}]},
{text:'物理',children:[{text:'力学',children:[]},{text:'电磁学',children:[]}]}
],collapsed:false};
save();render();
}

// Pan
wrap.addEventListener('mousedown',e=>{if(e.target===wrap||e.target.tagName==='svg'){isPanning=true;panStart={x:e.clientX-viewBox.x,y:e.clientY-viewBox.y}}});
wrap.addEventListener('mousemove',e=>{if(isPanning){viewBox.x=e.clientX-panStart.x;viewBox.y=e.clientY-panStart.y;render()}});
wrap.addEventListener('mouseup',()=>{isPanning=false});
wrap.addEventListener('mouseleave',()=>{isPanning=false});

// Zoom
wrap.addEventListener('wheel',e=>{
e.preventDefault();
let factor=e.deltaY>0?1.1:0.9;
let mx=e.clientX,my=e.clientY-52;
viewBox.x=mx-(mx-viewBox.x)*factor;
viewBox.y=my-(my-viewBox.y)*factor;
viewBox.w*=factor;viewBox.h*=factor;
render();
});

document.addEventListener('click',e=>{if(!ctxMenu.contains(e.target))closeCtx()});

render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
