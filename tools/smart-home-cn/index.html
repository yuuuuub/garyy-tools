<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 智能家居控制</title>
<meta name="description" content="智能家居设备控制面板，管理灯光、温度、安防等设备">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.device-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.device{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:all .2s}
.device:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.device.on{border-color:var(--accent);background:rgba(59,130,246,.1)}
.device .icon{font-size:2rem;margin-bottom:8px}
.device .name{font-size:.9rem;font-weight:600}
.device .status{font-size:.8rem;color:var(--text2);margin-top:4px}
.device .toggle{margin-top:10px;width:50px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background .2s;cursor:pointer}
.device .toggle.on{background:var(--accent)}
.device .toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s}
.device .toggle.on::after{transform:translateX(24px)}
.room-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.room-tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.85rem;transition:all .2s}
.room-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.scene-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.scene{padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--border);text-align:center;cursor:pointer;transition:all .2s}
.scene:hover{border-color:var(--accent)}
.scene.active{background:var(--accent);color:#fff}
.scene .emoji{font-size:1.5rem}
.scene .label{font-size:.8rem;margin-top:4px}
.energy-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:8px}
.energy-fill{height:100%;background:var(--success);transition:width .5s}
.slider-group{margin-top:12px}
.slider-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px}
.slider-group input[type=range]{width:100%;accent-color:var(--accent)}
.slider-value{text-align:right;font-size:.85rem;color:var(--accent);font-weight:600}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.stat-label{color:var(--text2)}
.stat-value{font-weight:600}
button{padding:8px 16px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🏠 智能家居控制">
<meta property="og:description" content="智能家居设备控制面板，管理灯光、温度、安防等设备">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏠 智能家居控制</h1><p>管理您的智能设备，创造舒适生活环境</p></div>

<div class="cd">
<h2>场景模式</h2>
<div class="scene-grid" id="scenes"></div>
</div>

<div class="cd">
<h2>房间选择</h2>
<div class="room-tabs" id="roomTabs"></div>
</div>

<div class="cd">
<h2>设备列表</h2>
<div class="device-grid" id="deviceGrid"></div>
</div>

<div class="cd">
<h2>灯光控制</h2>
<div class="slider-group">
<label>亮度</label>
<input type="range" id="brightness" min="0" max="100" value="80" oninput="updateBrightness()">
<div class="slider-value" id="brightnessVal">80%</div>
</div>
<div class="slider-group">
<label>色温</label>
<input type="range" id="colorTemp" min="2700" max="6500" value="4000" oninput="updateColorTemp()">
<div class="slider-value" id="colorTempVal">4000K</div>
</div>
</div>

<div class="cd">
<h2>能源统计</h2>
<div class="stat-row"><span class="stat-label">今日用电</span><span class="stat-value" id="todayUsage">12.5 kWh</span></div>
<div class="stat-row"><span class="stat-label">本月用电</span><span class="stat-value" id="monthUsage">356.2 kWh</span></div>
<div class="stat-row"><span class="stat-label">实时功率</span><span class="stat-value" id="realtimePower">1.2 kW</span></div>
<div class="energy-bar"><div class="energy-fill" id="energyFill" style="width:65%"></div></div>
<div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2);margin-top:4px"><span>0%</span><span>节能目标: 80%</span><span>100%</span></div>
</div>

<div class="cd">
<h2>安防状态</h2>
<div class="stat-row"><span class="stat-label">门锁</span><span class="stat-value" style="color:var(--success)" id="doorLock">已锁定</span></div>
<div class="stat-row"><span class="stat-label">摄像头</span><span class="stat-value" style="color:var(--success)" id="camera">运行中</span></div>
<div class="stat-row"><span class="stat-label">门窗传感器</span><span class="stat-value" style="color:var(--success)" id="doorSensor">正常</span></div>
<div class="stat-row"><span class="stat-label">运动检测</span><span class="stat-value" style="color:var(--warn)" id="motionDetect">待机中</span></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let devices=JSON.parse(localStorage.getItem('sh_devices')||'null')||[
  {id:1,name:'客厅主灯',icon:'💡',type:'light',room:'客厅',on:true},
  {id:2,name:'卧室灯',icon:'🛏️',type:'light',room:'卧室',on:false},
  {id:3,name:'空调',icon:'❄️',type:'ac',room:'客厅',on:true},
  {id:4,name:'电视',icon:'📺',type:'tv',room:'客厅',on:false},
  {id:5,name:'扫地机器人',icon:'🤖',type:'robot',room:'客厅',on:false},
  {id:6,name:'智能窗帘',icon:'🪟',type:'curtain',room:'卧室',on:true},
  {id:7,name:'加湿器',icon:'💨',type:'humidifier',room:'卧室',on:true},
  {id:8,name:'门锁',icon:'🔐',type:'lock',room:'门口',on:true},
  {id:9,name:'摄像头',icon:'📷',type:'camera',room:'客厅',on:true},
  {id:10,name:'热水器',icon:'🚿',type:'water',room:'卫生间',on:false}
];
const rooms=['全部','客厅','卧室','厨房','卫生间','门口'];
const scenes=[
  {name:'回家模式',icon:'🏠',active:false},
  {name:'离家模式',icon:'👋',active:false},
  {name:'睡眠模式',icon:'🌙',active:true},
  {name:'影院模式',icon:'🎬',active:false},
  {name:'阅读模式',icon:'📖',active:false},
  {name:'聚会模式',icon:'🎉',active:false}
];
let currentRoom='全部';

function save(){localStorage.setItem('sh_devices',JSON.stringify(devices));}

function renderScenes(){
  $('scenes').innerHTML=scenes.map((s,i)=>`<div class="scene ${s.active?'active':''}" onclick="toggleScene(${i})"><div class="emoji">${s.icon}</div><div class="label">${s.name}</div></div>`).join('');
}

function toggleScene(i){
  scenes.forEach((s,j)=>s.active=j===i?!s.active:false);
  renderScenes();
}

function renderRooms(){
  $('roomTabs').innerHTML=rooms.map(r=>`<div class="room-tab ${r===currentRoom?'active':''}" onclick="selectRoom('${r}')">${r}</div>`).join('');
}

function selectRoom(room){
  currentRoom=room;
  renderRooms();
  renderDevices();
}

function renderDevices(){
  const filtered=currentRoom==='全部'?devices:devices.filter(d=>d.room===currentRoom);
  $('deviceGrid').innerHTML=filtered.map(d=>`<div class="device ${d.on?'on':''}" onclick="toggleDevice(${d.id})">
    <div class="icon">${d.icon}</div>
    <div class="name">${d.name}</div>
    <div class="status">${d.on?'开启':'关闭'}</div>
    <div class="toggle ${d.on?'on':''}"></div>
  </div>`).join('');
}

function toggleDevice(id){
  const d=devices.find(x=>x.id===id);
  if(d){d.on=!d.on;save();renderDevices();}
}

function updateBrightness(){
  $('brightnessVal').textContent=$('brightness').value+'%';
}

function updateColorTemp(){
  $('colorTempVal').textContent=$('colorTemp').value+'K';
}

function simulateEnergy(){
  const base=1.2;
  const variation=(Math.random()-0.5)*0.4;
  const power=Math.max(0.5,base+variation);
  $('realtimePower').textContent=power.toFixed(1)+' kW';
  const usage=parseFloat($('todayUsage').textContent)+(power*0.001);
  $('todayUsage').textContent=usage.toFixed(1)+' kWh';
}

renderScenes();
renderRooms();
renderDevices();
setInterval(simulateEnergy,5000);
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
