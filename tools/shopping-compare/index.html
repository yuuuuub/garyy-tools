<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛒 618双平台比价 - Gary's Tools</title>
<meta name="description" content="618电商比价工具，支持淘宝天猫/京东/拼多多满减对比，找出最优购买方案">
<style>
:root{--bg:#fff5f5;--card:#fff;--text:#1a1a2e;--text2:#6b7280;--taobao:#ff5000;--jd:#e4393c;--pdd:#e02e24;--green:#059669;--border:#fecaca;--radius:14px;--shadow:0 2px 16px rgba(0,0,0,.06)}
[data-theme="dark"]{--bg:#1a1015;--card:#2a1a20;--text:#f0e0e0;--text2:#9ca3af;--border:#4a2030}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;-webkit-font-smoothing:antialiased}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#ff5000,#e4393c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:1rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.input-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.input-row label{font-size:.85rem;color:var(--text2);min-width:70px;font-weight:500}
.input-row input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:1rem;background:var(--bg);color:var(--text);outline:none;text-align:center;font-weight:600;transition:border-color .2s}
.input-row input:focus{border-color:var(--taobao)}
.input-row .unit{font-size:.8rem;color:var(--text2);min-width:24px}
.platforms{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.plat{padding:10px 6px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s;background:var(--bg)}
.plat.selected{border-color:var(--accent);background:rgba(255,80,0,.05)}
.plat .plat-name{font-size:.9rem}
.plat .plat-disc{font-size:.7rem;color:var(--text2);margin-top:2px}
.result-card{display:flex;justify-content:space-between;align-items:center;padding:16px;background:var(--bg);border-radius:10px;margin-bottom:8px}
.result-card.best{border:2px solid var(--green);background:rgba(5,150,105,.05)}
.result-card .plat-name{font-weight:700;font-size:.9rem}
.result-card .plat-logo{font-size:1.3rem}
.result-card .final-price{font-size:1.3rem;font-weight:800}
.result-card .save{font-size:.75rem;color:var(--green)}
.best-badge{display:inline-block;padding:2px 8px;background:var(--green);color:#fff;border-radius:10px;font-size:.65rem;font-weight:700;margin-left:4px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.preset{padding:6px 12px;border:1px solid var(--border);border-radius:16px;background:var(--bg);color:var(--text2);font-size:.78rem;cursor:pointer;transition:all .2s}
.preset:hover{background:rgba(255,80,0,.1);border-color:var(--taobao)}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🛒 618多平台比价</h1>
<p>对比淘宝/京东/拼多多满减规则 · 找到最低价</p>
</header>

<div class="card">
<h3>💰 商品信息</h3>
<div class="input-row">
<label>商品原价</label>
<input type="number" id="price" placeholder="例如：499" min="0" step="1" value="499">
<span class="unit">元</span>
</div>
<div class="presets">
<button class="preset" data-p="199">¥199</button>
<button class="preset" data-p="299">¥299</button>
<button class="preset" data-p="499">¥499</button>
<button class="preset" data-p="899">¥899</button>
<button class="preset" data-p="1599">¥1599</button>
<button class="preset" data-p="2999">¥2999</button>
</div>
</div>

<div class="card" id="resultArea">
<h3>🏷️ 平台比价结果</h3>
<div id="results"></div>
<div style="margin-top:12px;padding:10px;background:rgba(5,150,105,.05);border-radius:8px;font-size:.8rem;color:var(--text2)">
💡 <strong>提示：</strong>绿色框为最优方案，已包含跨店满减、品类券、红包等优惠估算
</div>
</div>

<div class="card">
<h3>⚖️ 单价比价（算清每克/毫升多少钱）</h3>
<div id="unitCompare">
<div class="input-row"><label>商品1</label><input type="text" id="item1Name" placeholder="名称" style="flex:0.6" value="洗衣液"><input type="number" id="item1Price" placeholder="总价" min="0" step="0.1" style="flex:0.5" value="39.9"><span class="unit">元/</span><input type="number" id="item1Qty" placeholder="容量" min="0" step="1" style="flex:0.5" value="2000"><span class="unit">ml</span></div>
<div class="input-row"><label>商品2</label><input type="text" id="item2Name" placeholder="名称" style="flex:0.6" value="洗衣凝珠"><input type="number" id="item2Price" placeholder="总价" min="0" step="0.1" style="flex:0.5" value="29.9"><span class="unit">元/</span><input type="number" id="item2Qty" placeholder="颗数" min="0" step="1" style="flex:0.5" value="50"><span class="unit">颗</span></div>
<div class="input-row"><label>商品3</label><input type="text" id="item3Name" placeholder="名称(可留空)" style="flex:0.6"><input type="number" id="item3Price" placeholder="总价" min="0" step="0.1" style="flex:0.5"><span class="unit">元/</span><input type="number" id="item3Qty" placeholder="容量" min="0" step="1" style="flex:0.5"><span class="unit">单位</span></div>
<div id="unitResults" style="margin-top:10px"></div>
</div>
</div>

<footer>价格仅供参考 · 以各平台实际结算为准 🛒</footer>
</div>

<script>
// 618 平台优惠规则（2026年典型规则）
const PLATFORMS=[
{name:'淘宝/天猫',key:'tb',color:'#ff5000',icon:'🐱',
disc:function(p){
// 跨店满减：每满300减50
const cross=Math.floor(p/300)*50;
// 品类券：满500减30
const cat=p>=500?30:0;
// 官方立减：约10%
const direct=Math.floor(p*0.1);
return cross+cat+direct;
}},
{name:'京东',key:'jd',color:'#e4393c',icon:'🐶',
disc:function(p){
// 跨店满减：每满299减50
const cross=Math.floor(p/299)*50;
// PLUS会员95折
const plus=Math.floor(p*0.05);
// 品类券随机
const cat=p>=300?Math.floor(p*0.03):0;
return cross+plus+cat;
}},
{name:'拼多多',key:'pdd',color:'#e02e24',icon:'🔺',
disc:function(p){
// 百亿补贴：直降
const subsidy=p>=100?Math.floor(p*0.15):0;
// 满减券包：满200减20
const coupon=p>=200?20+Math.floor((p-200)/200)*10:0;
return subsidy+coupon;
}},
];

function calc(){
const price=parseInt(document.getElementById('price').value)||0;
if(price<=0){document.getElementById('results').innerHTML='<p style="text-align:center;color:var(--text2)">请输入商品原价</p>';return;}

const results=PLATFORMS.map(p=>{
const disc=p.disc(price);
const final=Math.max(0,price-disc);
return{name:p.name,icon:p.icon,color:p.color,key:p.key,discount:disc,final};
});

const best=results.reduce((a,b)=>a.final<b.final?a:b);

document.getElementById('results').innerHTML=results.map(r=>`<div class="result-card${r.key===best.key?' best':''}">
<div>
<div class="plat-logo">${r.icon} <span class="plat-name" style="color:${r.color}">${r.name}</span>${r.key===best.key?'<span class="best-badge">最优</span>':''}</div>
<div style="font-size:.75rem;color:var(--text2)">优惠 ¥${r.discount}</div>
</div>
<div>
<div class="final-price" style="color:${r.key===best.key?'var(--green)':'var(--text)'}">¥${r.final}</div>
<div class="save">省 ${r.discount} 元</div>
</div></div>`).join('');
}

document.getElementById('price').addEventListener('input',calc);

document.querySelector('.presets').addEventListener('click',e=>{
if(!e.target.classList.contains('preset'))return;
document.getElementById('price').value=e.target.dataset.p;
calc();
});

calc();

// ⚖️ 单价比价功能
function calcUnit(){
  const items=[];
  const names=['item1Name','item2Name','item3Name'];
  const prices=['item1Price','item2Price','item3Price'];
  const qtys=['item1Qty','item2Qty','item3Qty'];
  for(let i=0;i<3;i++){
    const n=document.getElementById(names[i]).value.trim();
    const p=parseFloat(document.getElementById(prices[i]).value);
    const q=parseFloat(document.getElementById(qtys[i]).value);
    if(n&&p>0&&q>0) items.push({name:n,price:p,qty:q,unitPrice:(p/q)});
  }
  if(items.length<2){document.getElementById('unitResults').innerHTML='<p style="text-align:center;color:var(--text2);font-size:.8rem">请至少完整填写2件商品的信息</p>';return;}
  items.sort((a,b)=>a.unitPrice-b.unitPrice);
  const best=items[0];
  document.getElementById('unitResults').innerHTML='<div style="display:flex;flex-direction:column;gap:6px">'+
    items.map((item,i)=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--bg);border-radius:8px;'+(i===0?'border:2px solid var(--green);background:rgba(5,150,105,.05)':'')+'">'+
      '<div><span style="font-weight:700;font-size:.85rem">'+item.name+'</span>'+(i===0?' <span style="font-size:.65rem;padding:2px 6px;background:var(--green);color:#fff;border-radius:6px">最划算</span>':'')+
      '<div style="font-size:.7rem;color:var(--text2)">￥'+item.price+' / '+item.qty+'单位</div></div>'+
      '<div style="text-align:right"><div style="font-weight:800;font-size:1.1rem;color:'+(i===0?'var(--green)':'var(--text)')+'">￥'+item.unitPrice.toFixed(4)+'</div><div style="font-size:.65rem;color:var(--text2)">每单位</div></div></div>').join('')+
    '</div><div style="font-size:.72rem;color:var(--text2);text-align:center;margin-top:6px">✅ '+best.name+' 每单位单价最低，最划算！</div>';
}
['item1Name','item1Price','item1Qty','item2Name','item2Price','item2Qty','item3Name','item3Price','item3Qty'].forEach(id=>{
  document.getElementById(id).addEventListener('input',calcUnit);
});
calcUnit();
</script>
<script src="../i18n.js"></script>
</body>
</html>
