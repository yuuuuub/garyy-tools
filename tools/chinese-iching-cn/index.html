<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>周易六十四卦 | Chinese I Ching</title>
<meta name="description" content="周易六十四卦完整查询：上下卦组合、卦名卦辞、五行属性、随机起卦。专业的易经文化工具。">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☯</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a843;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.8rem;color:var(--gold)}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
.tab{padding:8px 18px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.85rem;transition:.2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}
.btn:hover{opacity:.85}
.btn-gold{background:var(--gold);color:var(--bg)}
.trigram-select{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.trigram-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.trigram-btn{padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:.85rem;transition:.2s;min-width:60px;text-align:center}
.trigram-btn:hover{border-color:var(--gold)}
.trigram-btn.selected{border-color:var(--blue);background:rgba(59,130,246,.1);color:var(--blue)}
.hex-display{display:flex;flex-direction:column;align-items:center;gap:4px;margin:16px 0}
.hex-line{display:flex;gap:12px;align-items:center}
.line-seg{height:6px;background:var(--gold);border-radius:3px}
.line-seg.yang{width:50px}
.line-seg.yin{width:20px}
.result-area{margin-top:16px;display:none}
.result-area.show{display:block}
.search-input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;margin-bottom:12px}
.search-input:focus{border-color:var(--blue);outline:none}
.hex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0}
.hex-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;cursor:pointer;transition:.2s}
.hex-item:hover{border-color:var(--gold)}
.hex-item .h-num{font-size:.75rem;color:var(--text2)}
.hex-item .h-name{color:var(--gold);font-weight:600;font-size:.9rem}
.hex-item .h-lines{margin:4px 0;font-size:.7rem}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78rem;margin:2px}
.tag.good{background:rgba(35,134,54,.15);color:var(--green);border:1px solid rgba(35,134,54,.3)}
#themeBtn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer;font-size:.8rem}
</style>
</head>
<body>
<button id="themeBtn" onclick="toggleTheme()">🌓 主题</button>
<div class="container">
<h1>☯ 周易六十四卦</h1>
<p class="sub">上下卦组合 · 卦名卦辞 · 五行属性 · 随机起卦</p>

<div class="tabs">
<button class="tab active" onclick="switchTab('combo')">🔤 组合起卦</button>
<button class="tab" onclick="switchTab('random')">🎲 随机起卦</button>
<button class="tab" onclick="switchTab('search')">🔍 搜索查询</button>
<button class="tab" onclick="switchTab('all')">📖 六十四卦</button>
</div>

<div class="card" id="comboPanel">
<p style="color:var(--text2);margin-bottom:12px">选择上卦和下卦</p>
<div class="trigram-select">
<div><label style="font-size:.85rem;color:var(--text2)">上卦（外卦）</label>
<div class="trigram-row" id="upperTrigrams"></div></div>
<div><label style="font-size:.85rem;color:var(--text2)">下卦（内卦）</label>
<div class="trigram-row" id="lowerTrigrams"></div></div>
</div>
<div id="comboDisplay" style="text-align:center"></div>
<button class="btn" onclick="showComboHex()" style="display:block;margin:12px auto">查看卦象</button>
<div class="result-area" id="comboResult"></div>
</div>

<div class="card" id="randomPanel" style="display:none">
<button class="btn btn-gold" onclick="randomHex()" style="display:block;margin:0 auto">🎲 随机起卦</button>
<div class="result-area" id="randomResult"></div>
</div>

<div class="card" id="searchPanel" style="display:none">
<input type="text" class="search-input" id="searchInput" placeholder="输入卦名搜索..." oninput="searchHex()">
<div id="searchResults"></div>
<div class="result-area" id="searchResult"></div>
</div>

<div class="card" id="allPanel" style="display:none">
<div class="hex-grid" id="hexGrid"></div>
<div class="result-area" id="allResult"></div>
</div>
</div>

<script src="../i18n.js" defer></script>

{n:33,name:'天山遁',upper:0,lower:6,judgement:'亨小利贞',desc:'退避隐遁，保存实力。适时退守之卦。'},
{n:34,name:'雷天大壮',upper:3,lower:0,judgement:'利贞',desc:'力量强大，但需节制。壮大力量之卦。'},
{n:35,name:'火地晋',upper:2,lower:7,judgement:'康侯用锡马蕃庶',desc:'晋升进步，日新月异。步步高升之卦。'},

{n:46,name:'地风升',upper:7,lower:4,judgement:'元亨用见大人',desc:'逐步上升，循序渐进。步步高升之卦。'},

{n:48,name:'水风井',upper:5,lower:4,judgement:'改邑不改井',desc:'井水不竭，养人不倦。源源不断之卦。'},

{n:50,name:'火风鼎',upper:2,lower:4,judgement:'元吉亨',desc:'鼎新之象，革故鼎新。建功立业之卦。'},

{n:55,name:'雷火丰',upper:3,lower:2,judgement:'亨王假之',desc:'丰盛隆盛，盛极必衰。丰亨豫大之卦。'},

{n:64,name:'火水未济',upper:2,lower:5,judgement:'亨小狐汔济濡其尾',desc:'尚未完成，继续努力。未济待成之卦。'}
];

var selectedUpper=-1,selectedLower=-1;

function init(){
renderTrigrams('upperTrigrams',true);
renderTrigrams('lowerTrigrams',false);
renderAllHex();
}

function switchTab(tab){
document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
event.target.classList.add('active');
['comboPanel','randomPanel','searchPanel','allPanel'].forEach(function(id){document.getElementById(id).style.display='none'});
var map={combo:'comboPanel',random:'randomPanel',search:'searchPanel',all:'allPanel'};
document.getElementById(map[tab]).style.display='block';
}

function renderTrigrams(containerId,isUpper){
var c=document.getElementById(containerId);
c.innerHTML='';
trigrams.forEach(function(t,i){
var btn=document.createElement('div');
btn.className='trigram-btn';
btn.textContent=t.symbol+' '+t.name;
btn.onclick=function(){
c.querySelectorAll('.trigram-btn').forEach(function(b){b.classList.remove('selected')});
btn.classList.add('selected');
if(isUpper)selectedUpper=i;else selectedLower=i;
updateComboDisplay();
};
c.appendChild(btn);
});
}

function updateComboDisplay(){
if(selectedUpper>=0&&selectedLower>=0){
var h=hexagrams.find(function(h){return h.upper===selectedUpper&&h.lower===selectedLower});
if(h){
document.getElementById('comboDisplay').innerHTML='<div style="font-size:1.2rem;color:var(--gold);margin:8px 0">'+trigrams[selectedUpper].symbol+' 叠 '+trigrams[selectedLower].symbol+' → '+h.name+'</div>';
}
}
}

function showComboHex(){
if(selectedUpper<0||selectedLower<0){alert('请选择上下卦');return}
var h=hexagrams.find(function(h){return h.upper===selectedUpper&&h.lower===selectedLower});
if(h)showHexDetail(h,'comboResult');
}

function randomHex(){
var h=hexagrams[Math.floor(Math.random()*hexagrams.length)];
showHexDetail(h,'randomResult');
}

function searchHex(){
var q=document.getElementById('searchInput').value.trim().toLowerCase();
var d=document.getElementById('searchResults');
if(!q){d.innerHTML='';return}
var results=hexagrams.filter(function(h){return h.name.indexOf(q)>=0||String(h.n)===q});
d.innerHTML=results.slice(0,10).map(function(h){
return '<div class="hex-item" onclick="showHexDetail('+JSON.stringify(h).replace(/"/g,'&quot;')+',\'searchResult\')">'+
'<div class="h-num">第'+h.n+'卦</div><div class="h-name">'+h.name+'</div></div>';
}).join('');
}

function renderAllHex(){
var g=document.getElementById('hexGrid');
g.innerHTML=hexagrams.map(function(h){
return '<div class="hex-item" onclick="showHexDetail('+JSON.stringify(h).replace(/"/g,'&quot;')+',\'allResult\')">'+
'<div class="h-num">第'+h.n+'卦</div><div class="h-name">'+h.name+'</div></div>';
}).join('');
}

function showHexDetail(h,resultId){
var r=document.getElementById(resultId);
r.className='result-area show';
var upper=trigrams[h.upper],lower=trigrams[h.lower];
var lines=lower.lines.concat(upper.lines);
var html='<div style="text-align:center;margin-bottom:12px">';
html+='<div style="font-size:1.3rem;color:var(--gold)">第'+h.n+'卦 · '+h.name+'</div>';
html+='<div style="font-size:.9rem;color:var(--text2);margin-top:4px">'+upper.symbol+' '+upper.name+'(上) 叠 '+lower.symbol+' '+lower.name+'(下)</div></div>';

html+='<div class="hex-display">';
var labels=['上爻','五爻','四爻','三爻','二爻','初爻'];
for(var i=5;i>=0;i--){
html+='<div class="hex-line"><span style="font-size:.7rem;color:var(--text2);width:30px">'+labels[i]+'</span>';
if(lines[i]===1)html+='<div class="line-seg yang"></div>';
else html+='<div class="line-seg yin"></div><div class="line-seg yin"></div>';
html+='</div>';
}
html+='</div>';

html+='<div style="padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border);margin-top:12px">';
html+='<div><strong>卦辞：</strong>'+h.judgement+'</div>';
html+='<div style="margin-top:6px"><strong>象曰：</strong>'+h.desc+'</div>';
html+='<div style="margin-top:6px"><strong>上卦：</strong>'+upper.name+' · '+upper.nature+' · '+upper.wx+' · '+upper.desc+'</div>';
html+='<div><strong>下卦：</strong>'+lower.name+' · '+lower.nature+' · '+lower.wx+' · '+lower.desc+'</div>';
html+='</div>';
r.innerHTML=html;
}

function toggleTheme(){
var t=document.documentElement;
t.setAttribute('data-theme',t.getAttribute('data-theme')==='light'?'dark':'light');
}

init();
</script>
