<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团队健康检查</title>
<meta property="og:title" content="团队健康检查">
<meta property="og:description" content="团队健康检查 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="团队健康检查工具 - 定期评估团队协作、沟通和技术健康状况">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💚</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a371f7;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
input,textarea,select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
textarea{resize:vertical;min-height:60px}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.health-grid{display:grid;grid-template-columns:1fr;gap:12px}
.health-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.health-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.health-name{font-weight:700;font-size:1rem}
.score-badge{padding:4px 12px;border-radius:20px;font-size:.85rem;font-weight:700}
.score-excellent{background:rgba(63,185,80,.2);color:var(--green)}
.score-good{background:rgba(59,130,246,.2);color:var(--accent)}
.score-warning{background:rgba(210,153,34,.2);color:var(--yellow)}
.score-danger{background:rgba(248,81,73,.2);color:var(--red)}
.rating-row{display:flex;gap:4px;margin:8px 0}
.rating-btn{width:36px;height:36px;border:2px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.rating-btn:hover{border-color:var(--accent)}
.rating-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.comment-box{margin-top:8px}
.comment-box textarea{min-height:50px;font-size:.85rem}
.progress-ring{display:flex;justify-content:center;margin:20px 0}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.summary-card{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.summary-num{font-size:2rem;font-weight:700}
.summary-label{font-size:.8rem;color:var(--text2);margin-top:4px}
.history-item{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
@media(max-width:600px){h1{font-size:1.4rem}.summary-grid{grid-template-columns:repeat(2,1fr)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='💚 团队健康检查';
const APP=document.getElementById('app');
const DIMENSIONS=[
  {id:'delivery',name:'交付能力',icon:'🚀',desc:'按时交付高质量产品的能力'},
  {id:'quality',name:'代码质量',icon:'✨',desc:'代码质量、测试覆盖和技术债务'},
  {id:'speed',name:'响应速度',icon:'⚡',desc:'对需求变化和bug修复的响应速度'},
  {id:'collab',name:'团队协作',icon:'🤝',desc:'团队成员之间的沟通和协作'},
  {id:'fun',name:'工作乐趣',icon:'🎉',desc:'工作的乐趣程度和团队氛围'},
  {id:'support',name:'互相支持',icon:'💪',desc:'团队成员之间的互助和支持'},
  {id:'learning',name:'学习成长',icon:'📚',desc:'学习新技能和知识的机会'},
  {id:'direction',name:'方向明确',icon:'🧭',desc:'对团队目标和方向的清晰度'}
];
let data=JSON.parse(localStorage.getItem('thc_data')||'{"ratings":{},"comments":{},"history":[]}');

function save(){localStorage.setItem('thc_data',JSON.stringify(data))}

function getScore(id){return data.ratings[id]||0}
function getScoreLabel(s){return s>=9?'excellent':s>=7?'good':s>=5?'warning':'danger'}
function getScoreText(s){return s>=9?'优秀':s>=7?'良好':s>=5?'需改进':'危险'}
function getOverall(){const scores=DIMENSIONS.map(d=>getScore(d.id));return scores.reduce((a,b)=>a+b,0)/scores.length}

function render(){
  let h=`<h1>💚 团队健康检查</h1><p class="subtitle">评估团队各维度健康状况</p>`;
  const overall=getOverall();
  const rated=DIMENSIONS.filter(d=>getScore(d.id)>0).length;

  h+=`<div class="summary-grid">`;
  h+=`<div class="summary-card"><div class="summary-num" style="color:${overall>=7?'var(--green)':overall>=5?'var(--yellow)':'var(--red)'}">${overall.toFixed(1)}</div><div class="summary-label">综合评分</div></div>`;
  h+=`<div class="summary-card"><div class="summary-num" style="color:var(--accent)">${rated}/${DIMENSIONS.length}</div><div class="summary-label">已评估</div></div>`;
  DIMENSIONS.slice(0,2).forEach(d=>{
    const s=getScore(d.id);
    h+=`<div class="summary-card"><div class="summary-num" style="color:${s>=7?'var(--green)':s>=5?'var(--yellow)':'var(--red)'}">${s||'-'}</div><div class="summary-label">${d.icon} ${d.name}</div></div>`;
  });
  h+=`</div>`;

  h+=`<div class="health-grid">`;
  DIMENSIONS.forEach(d=>{
    const s=getScore(d.id);
    h+=`<div class="health-item"><div class="health-header"><div><span class="health-name">${d.icon} ${d.name}</span><div style="font-size:.8rem;color:var(--text2)">${d.desc}</div></div>`;
    if(s>0) h+=`<span class="score-badge score-${getScoreLabel(s)}">${s}/10 ${getScoreText(s)}</span>`;
    h+=`</div><div class="rating-row">`;
    for(let i=1;i<=10;i++){
      h+=`<button class="rating-btn ${s===i?'active':''}" onclick="rate('${d.id}',${i})">${i}</button>`;
    }
    h+=`</div>`;
    if(!data.comments[d.id]) data.comments[d.id]='';
    h+=`<div class="comment-box"><textarea placeholder="备注（可选）" onchange="setComment('${d.id}',this.value)">${data.comments[d.id]}</textarea></div>`;
    h+=`</div>`;
  });
  h+=`</div>`;

  h+=`<div class="card"><div class="flex-between"><b>📤 操作</b><div class="flex"><button class="btn btn-sm btn-success" onclick="submitCheck()">提交检查</button><button class="btn btn-sm btn-outline" onclick="exportMD()">导出</button><button class="btn btn-sm btn-danger" onclick="clearAll()">清空</button></div></div></div>`;

  if(data.history.length){
    h+=`<div class="card"><b>📜 历史记录</b>`;
    data.history.slice(-5).reverse().forEach((rec,i)=>{
      h+=`<div class="history-item"><span>${rec.date}</span><span class="score-badge score-${getScoreLabel(rec.overall)}">${rec.overall.toFixed(1)}</span></div>`;
    });
    h+=`</div>`;
  }
  APP.innerHTML=h;
}

function rate(id,val){data.ratings[id]=val;save();render()}
function setComment(id,val){data.comments[id]=val;save()}
function submitCheck(){
  const overall=getOverall();
  const rated=DIMENSIONS.filter(d=>getScore(d.id)>0).length;
  if(rated===0){alert('请至少评估一个维度');return}
  data.history.push({date:new Date().toLocaleDateString('zh-CN'),overall,ratings:{...data.ratings},comments:{...data.comments}});
  save();alert('检查已提交！');
}
function clearAll(){if(confirm('清空所有数据？')){data={ratings:{},comments:{},history:data.history};save();render()}}
function exportMD(){
  let md=`# 团队健康检查报告\n\n日期：${new Date().toLocaleDateString('zh-CN')}\n\n## 评分\n`;
  DIMENSIONS.forEach(d=>{md+=`- ${d.icon} ${d.name}: ${getScore(d.id)}/10\n`;if(data.comments[d.id])md+=`  备注：${data.comments[d.id]}\n`});
  md+=`\n**综合评分：${getOverall().toFixed(1)}/10**\n`;
  const blob=new Blob([md],{type:'text/markdown'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='team-health-check.md';a.click();
}
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
