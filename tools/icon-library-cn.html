<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="图标库工具 - 浏览、搜索和导出SVG图标">
    <meta name="robots" content="index, follow">
    <title>图标库工具</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #f43f5e; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #fb7185; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 8px; }
        button:hover { opacity: 0.9; }
        .btn-sm { padding: 4px 10px; font-size: 13px; }
        .btn-outline { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        .icon-item { display: flex; flex-direction: column; align-items: center; padding: 16px 8px; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .icon-item:hover { border-color: var(--primary-color); background: var(--card-bg); }
        .icon-item.selected { border-color: var(--primary-color); background: rgba(244,63,94,0.1); }
        .icon-item svg { width: 32px; height: 32px; margin-bottom: 6px; }
        .icon-item .icon-name { font-size: 11px; text-align: center; word-break: break-all; }
        .category-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .cat-tab { padding: 6px 14px; border: 1px solid var(--border-color); border-radius: 20px; background: var(--card-bg); cursor: pointer; font-size: 13px; }
        .cat-tab:hover, .cat-tab.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .icon-detail { display: flex; gap: 24px; padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; }
        .icon-preview { width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color); }
        .icon-preview svg { width: 80px; height: 80px; }
        .size-btn { display: inline-block; padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 4px; }
        .size-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .code-block { white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 12px; background: var(--bg-color); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); max-height: 160px; overflow-y: auto; margin-top: 8px; }
        .color-picker-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
        .color-swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border-color); cursor: pointer; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>图标库工具</h1>

        <div class="card">
            <h3>搜索与筛选</h3>
            <div style="display:flex;gap:12px;align-items:flex-end;">
                <div class="form-group" style="flex:1;">
                    <label>搜索图标</label>
                    <input type="text" id="searchInput" placeholder="输入关键词..." oninput="filterIcons()">
                </div>
                <div class="form-group" style="width:150px;">
                    <label>大小</label>
                    <select id="sizeSelect" onchange="updatePreviewSize()">
                        <option value="24">24px</option>
                        <option value="32">32px</option>
                        <option value="48">48px</option>
                        <option value="64">64px</option>
                        <option value="96">96px</option>
                    </select>
                </div>
            </div>
            <div class="category-tabs" id="catTabs"></div>
        </div>

        <div class="card">
            <h3>图标列表 <span id="iconCount" style="font-size:14px;color:var(--secondary-color);"></span></h3>
            <div class="icon-grid" id="iconGrid"></div>
        </div>

        <div class="card" id="detailPanel" style="display:none;">
            <h3>图标详情</h3>
            <div class="icon-detail">
                <div class="icon-preview" id="detailPreview"></div>
                <div style="flex:1;">
                    <h3 id="detailName" style="margin:0 0 10px 0;"></h3>
                    <p id="detailCategory" style="color:var(--secondary-color);margin:0 0 10px 0;"></p>
                    <div style="margin-bottom:12px;">
                        <label>颜色</label>
                        <div class="color-picker-row" id="colorPickers"></div>
                    </div>
                    <div style="margin-bottom:12px;">
                        <label>大小</label>
                        <span class="size-btn active" onclick="setDetailSize(16,this)">16</span>
                        <span class="size-btn" onclick="setDetailSize(20,this)">20</span>
                        <span class="size-btn" onclick="setDetailSize(24,this)">24</span>
                        <span class="size-btn" onclick="setDetailSize(32,this)">32</span>
                        <span class="size-btn" onclick="setDetailSize(48,this)">48</span>
                    </div>
                    <div>
                        <label>操作</label>
                        <button class="btn-sm" onclick="copySVG()">复制SVG</button>
                        <button class="btn-sm btn-outline" onclick="downloadSVG()">下载SVG</button>
                        <button class="btn-sm btn-outline" onclick="copyCSS()">复制CSS</button>
                    </div>
                    <div class="code-block" id="detailCode"></div>
                </div>
            </div>
        </div>
    </div>

    <script defer src="i18n.js"></script>
    <script>
        const iconLibrary = [

            { name: 'user', category: '常用', svg: '<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },
            { name: 'search', category: '常用', svg: '<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },
            { name: 'settings', category: '常用', svg: '<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },

            { name: 'chat', category: '通信', svg: '<path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },
            { name: 'bell', category: '界面', svg: '<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },

            { name: 'trash', category: '操作', svg: '<path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },

            { name: 'download', category: '操作', svg: '<path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },
            { name: 'upload', category: '操作', svg: '<path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },
            { name: 'refresh', category: '操作', svg: '<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },
            { name: 'arrow-left', category: '导航', svg: '<path d="M10 19l-7-7m0 0l7-7m-7 7h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },
            { name: 'arrow-right', category: '导航', svg: '<path d="M14 5l7 7m0 0l-7 7m7-7H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },
            { name: 'menu', category: '导航', svg: '<path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },
            { name: 'x', category: '导航', svg: '<path d="M6 18L18 6M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },
            { name: 'filter', category: '操作', svg: '<path d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },
            { name: 'calendar', category: '界面', svg: '<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },

            { name: 'chart-pie', category: '数据', svg: '<path d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' },
            { name: 'clipboard', category: '操作', svg: '<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' }
        ];

        const iconColors = ['#333333','#f43f5e','#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899'];
        let currentCategory = '全部';
        let currentColor = '#333333';
        let currentSize = 24;
        let selectedIcon = null;

        function init() {
            renderCategories();
            renderIcons();
            renderColorPickers();
        }

        function renderCategories() {
            const cats = ['全部', ...new Set(iconLibrary.map(i => i.category))];
            document.getElementById('catTabs').innerHTML = cats.map(c =>
                `<span class="cat-tab ${c===currentCategory?'active':''}" onclick="setCategory('${c}')">${c}</span>`
            ).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderCategories();
            filterIcons();
        }

        function filterIcons() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = iconLibrary.filter(i => {
                const matchCat = currentCategory === '全部' || i.category === currentCategory;
                const matchSearch = i.name.includes(q) || i.category.includes(q);
                return matchCat && matchSearch;
            });
            renderIcons(filtered);
        }

        function renderIcons(list) {
            list = list || iconLibrary.filter(i => currentCategory === '全部' || i.category === currentCategory);
            document.getElementById('iconCount').textContent = `(${list.length})`;
            document.getElementById('iconGrid').innerHTML = list.map(icon => `
                <div class="icon-item ${selectedIcon?.name===icon.name?'selected':''}" onclick="selectIcon('${icon.name}')">
                    <svg viewBox="0 0 24 24" style="color:${currentColor};width:${currentSize}px;height:${currentSize}px;">${icon.svg}</svg>
                    <div class="icon-name">${icon.name}</div>
                </div>
            `).join('');
        }

        function selectIcon(name) {
            selectedIcon = iconLibrary.find(i => i.name === name);
            renderIcons();
            renderDetail();
            document.getElementById('detailPanel').style.display = 'block';
            document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth' });
        }

        function renderDetail() {
            if (!selectedIcon) return;
            document.getElementById('detailName').textContent = selectedIcon.name;
            document.getElementById('detailCategory').textContent = `分类: ${selectedIcon.category}`;
            document.getElementById('detailPreview').innerHTML = `<svg viewBox="0 0 24 24" style="color:${currentColor};width:80px;height:80px;">${selectedIcon.svg}</svg>`;
            updateDetailCode();
        }

        function updateDetailCode() {
            if (!selectedIcon) return;
            document.getElementById('detailCode').innerHTML = `&lt;svg viewBox="0 0 24 24" width="${currentSize}" height="${currentSize}" style="color:${currentColor};"&gt;\n  ${selectedIcon.svg}\n&lt;/svg&gt;`;
        }

        function renderColorPickers() {
            document.getElementById('colorPickers').innerHTML = iconColors.map(c =>
                `<div class="color-swatch" style="background:${c};${c===currentColor?'box-shadow:0 0 0 3px var(--primary-color);':''}" onclick="setColor('${c}')"></div>`
            ).join('') + `<input type="color" value="${currentColor}" onchange="setColor(this.value)" style="width:32px;height:32px;border:none;cursor:pointer;">`;
        }

        function setColor(c) { currentColor = c; renderColorPickers(); renderIcons(); if (selectedIcon) renderDetail(); }
        function setDetailSize(s) { currentSize = s; document.querySelectorAll('.size-btn').forEach(b => b.textContent==s ? b.classList.add('active') : b.classList.remove('active')); if (selectedIcon) renderDetail(); renderIcons(); }
        function updatePreviewSize() { currentSize = +document.getElementById('sizeSelect').value; renderIcons(); if (selectedIcon) renderDetail(); }

        function copySVG() {
            if (!selectedIcon) return;
            const svg = `<svg viewBox="0 0 24 24" width="${currentSize}" height="${currentSize}" style="color:${currentColor};">${selectedIcon.svg}</svg>`;
            navigator.clipboard.writeText(svg).then(() => alert('SVG已复制'));
        }

        function downloadSVG() {
            if (!selectedIcon) return;
            const svg = `<svg viewBox="0 0 24 24" width="${currentSize}" height="${currentSize}" style="color:${currentColor};" xmlns="http://www.w3.org/2000/svg">${selectedIcon.svg}</svg>`;
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${selectedIcon.name}.svg`;
            a.click();
        }

        function copyCSS() {
            if (!selectedIcon) return;
            const css = `.icon-${selectedIcon.name} {\n  display: inline-block;\n  width: ${currentSize}px;\n  height: ${currentSize}px;\n  color: ${currentColor};\n}`;
            navigator.clipboard.writeText(css).then(() => alert('CSS已复制'));
        }

        function toggleTheme() {
            const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
        }

        init();
    </script>
</body>
</html>
