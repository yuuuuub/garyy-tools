<style>*{margin:0;padding:0;box-sizing:border-box}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.suc{background:var(--success)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.canvas-wrap{position:relative;width:100%;aspect-ratio:1;max-width:300px;margin:12px auto;background:var(--bg);border:2px solid var(--border);border-radius:8px;overflow:hidden}
canvas{width:100%;height:100%;cursor:crosshair}
.grid-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.stroke-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stroke-item{padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:.85rem;cursor:pointer;transition:all .2s}
.stroke-item:hover,.stroke-item.active{border-color:var(--accent);color:var(--accent)}
.stroke-item.done{border-color:var(--success);color:var(--success)}
.char-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.char-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;background:var(--bg);border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s}
.char-btn:hover{border-color:var(--accent);transform:scale(1.05)}
.char-btn.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

'后':{strokes:['撇','撇','竖','横折','横'],radical:'口',paths:[[180,30,100,100],[180,80,100,160],[100,160,100,230],[100,230,240,230],[240,160,240,230]]},
'男':{strokes:['竖','横折','横','竖','横','横折钩','竖'],radical:'田',paths:[[100,20,100,110],[100,20,260,20],[100,110,260,110],[260,20,260,110],[180,20,180,110],[100,65,260,65],[180,130,180,220],[100,180,180,180]]},
'女':{strokes:['撇点','撇','横'],radical:'女',paths:[[180,40,120,120],[120,120,180,180],[60,140,300,140]]},
'子':{strokes:['横撇','竖弯钩','横'],radical:'子',paths:[[140,40,100,100],[100,100,200,140],[200,140,100,220],[80,140,320,140]]},
'父':{strokes:['撇','点','撇','捺'],radical:'父',paths:[[180,30,100,100],[220,30,300,100],[180,100,100,220],[180,100,280,220]]},
'母':{strokes:['竖折','横折钩','点','横','点'],radical:'母',paths:[[100,40,100,220],[100,220,300,220],[300,40,300,220],[100,40,300,40],[180,120,170,140],[220,180,210,200]]},
'前':{strokes:['点','撇','横','竖','横折钩','横','横','竖'],radical:'刂',paths:[[140,20,130,50],[260,20,270,50],[100,60,300,60],[160,60,160,160],[160,60,260,60],[260,60,260,160],[160,110,260,110],[160,160,260,160]]},
'后':{strokes:['撇','撇','竖','横折','横'],radical:'口',paths:[[180,30,100,100],[180,80,100,160],[100,160,100,230],[100,230,240,230],[240,160,240,230]]},
};

function init(){
  const all=[...new Set([...practiceChars,...customChars])];
  $('charGrid').innerHTML=all.map(c=>`<div class="char-btn" onclick="selectChar('${c}',this)">${c}</div>`).join('');
}

function selectChar(ch,el){
  if(!strokeData[ch]){alert('暂无「'+ch+'」的笔画数据');return}
  currentChar=ch;currentStroke=0;animating=false;practiceMode=false;
  document.querySelectorAll('.char-btn').forEach(b=>b.classList.remove('active'));
  if(el)el.classList.add('active');
  $('currentCharTitle').textContent='「'+ch+'」笔画顺序';
  $('strokeInfo').classList.remove('hidden');
  const d=strokeData[ch];
  $('strokeCount').textContent='笔画数：'+d.strokes.length;
  $('radicalInfo').textContent='部首：'+d.radical;
  renderStrokeList();
  drawGrid();
  drawStrokes(0);
}

function renderStrokeList(){
  const d=strokeData[currentChar];
  $('strokeList').innerHTML=d.strokes.map((s,i)=>`<div class="stroke-item ${i<currentStroke?'done':''} ${i===currentStroke?'active':''}" onclick="goToStroke(${i})">${i+1}. ${s}</div>`).join('');
}

function drawGrid(){
  const canvas=$('strokeCanvas');
  const ctx=canvas.getContext('2d');
  const size=400;canvas.width=size;canvas.height=size;
  ctx.clearRect(0,0,size,size);
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--border').trim()||'#30363d';
  ctx.lineWidth=1;ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(size/2,0);ctx.lineTo(size/2,size);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,size/2);ctx.lineTo(size,size/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(size,size);ctx.stroke();
  ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(0,size);ctx.stroke();
  ctx.setLineDash([]);
}

function drawStrokes(upTo){
  const canvas=$('strokeCanvas');
  const ctx=canvas.getContext('2d');
  const d=strokeData[currentChar];
  const size=400;const scale=size/400;
  drawGrid();
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=0;i<Math.min(upTo,d.paths.length);i++){
    const[x1,y1,x2,y2]=d.paths[i];
    ctx.strokeStyle=i===upTo-1?'var(--accent)':'var(--text)';
    ctx.lineWidth=i===upTo-1?4*scale:3*scale;
    ctx.beginPath();ctx.moveTo(x1*scale,y1*scale);ctx.lineTo(x2*scale,y2*scale);ctx.stroke();
  }
  if(upTo<d.paths.length){
    const[x1,y1]=d.paths[upTo];
    ctx.fillStyle='var(--danger)';
    ctx.beginPath();ctx.arc(x1*scale,y1*scale,5*scale,0,Math.PI*2);ctx.fill();
  }
}

function goToStroke(i){
  currentStroke=i;drawStrokes(i);renderStrokeList();
}

function playAnimation(){
  if(animating)return;animating=true;currentStroke=0;
  const d=strokeData[currentChar];
  function animate(){
    if(currentStroke>=d.paths.length){animating=false;return}
    drawStrokes(currentStroke+1);renderStrokeList();currentStroke++;
    setTimeout(animate,600);
  }
  animate();
}

function stepStroke(){
  const d=strokeData[currentChar];
  if(currentStroke>=d.paths.length){currentStroke=0}
  currentStroke++;drawStrokes(currentStroke);renderStrokeList();
}

function resetAnimation(){currentStroke=0;drawStrokes(0);renderStrokeList()}

function togglePractice(){
  practiceMode=!practiceMode;
  $('practiceCanvas').classList.toggle('hidden',!practiceMode);
  $('practiceTools').classList.toggle('hidden',!practiceMode);
  $('strokeCanvas').classList.toggle('hidden',practiceMode);
  if(practiceMode)initPractice();
}

function initPractice(){
  const canvas=$('practiceCanvas');
  const size=400;canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');
  drawPracticeGrid(ctx,size);
  let drawing=false;
  canvas.onmousedown=e=>{drawing=true;ctx.beginPath();const r=canvas.getBoundingClientRect();ctx.moveTo((e.clientX-r.left)*(size/r.width),(e.clientY-r.top)*(size/r.height))};
  canvas.onmousemove=e=>{if(!drawing)return;const r=canvas.getBoundingClientRect();ctx.lineTo((e.clientX-r.left)*(size/r.width),(e.clientY-r.top)*(size/r.height));ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke()};
  canvas.onmouseup=()=>drawing=false;
  canvas.onmouseleave=()=>drawing=false;
}

function drawPracticeGrid(ctx,size){
  ctx.clearRect(0,0,size,size);
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  ctx.fillRect(0,0,size,size);
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
  ctx.lineWidth=1;ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(size/2,0);ctx.lineTo(size/2,size);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,size/2);ctx.lineTo(size,size/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(size,size);ctx.stroke();
  ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(0,size);ctx.stroke();
  ctx.setLineDash([]);
}

function clearPractice(){
  const canvas=$('practiceCanvas');
  const ctx=canvas.getContext('2d');
  drawPracticeGrid(ctx,400);
}

function addCustomChar(){
  const ch=$('charInput').value.trim();
  if(!ch)return;
  if(!customChars.includes(ch)){customChars.push(ch);localStorage.setItem('cw_custom',JSON.stringify(customChars))}
  $('charInput').value='';init();
}

init();
</script>
