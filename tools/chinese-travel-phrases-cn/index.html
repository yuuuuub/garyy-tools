<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国旅行常用短语 - Chinese Travel Phrases</title>
<meta name="description" content="中国旅行常用中英文短语大全，涵盖问路、点餐、购物、紧急等场景">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国旅行常用短语 - Chinese Travel Phrases">
<meta property="og:description" content="中国旅行常用中英文短语大全，涵盖问路、点餐、购物、紧急等场景">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗣️</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#0891b2;--accent2:#0e7490}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#0891b2;--accent2:#0e7490}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#021520 0%,#042838 50%,#063850 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #155e75;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#0891b2,#22d3ee,#06b6d4,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.phrase-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.phrase-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.phrase-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.phrase-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.phrase-card .p-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.phrase-card .p-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(8,145,178,0.15);color:var(--accent)}
.phrase-card .p-name{font-size:1.1em;font-weight:bold}
.phrase-card .p-category{font-size:0.8em;color:var(--text2);margin-top:2px}
.phrase-card .p-pairs{margin-top:12px}
.phrase-pair{background:var(--bg);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:all 0.2s;border:1px solid transparent}
.phrase-pair:hover{border-color:var(--accent);background:rgba(8,145,178,0.05)}
.phrase-pair .zh{font-size:1em;font-weight:600;margin-bottom:4px}
.phrase-pair .en{font-size:0.85em;color:var(--text2)}
.phrase-pair .pinyin{font-size:0.75em;color:var(--accent);margin-top:2px}
.phrase-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.phrase-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🗣️ 中国旅行常用短语</h1>
<p>Chinese Travel Phrases — 中英文对照，让你的旅行畅通无阻</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索短语...（如"多少钱""洗手间""帮助"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="基本问候">👋 基本问候</button>
<button class="filter-btn" data-filter="问路导航">🧭 问路导航</button>
<button class="filter-btn" data-filter="餐厅点餐">🍜 餐厅点餐</button>
<button class="filter-btn" data-filter="购物消费">🛍️ 购物消费</button>
<button class="filter-btn" data-filter="交通出行">🚌 交通出行</button>
<button class="filter-btn" data-filter="紧急求助">🆘 紧急求助</button>
</div>
<div class="phrase-grid" id="phraseGrid"></div>
<footer><p>🗣️ 中国旅行常用短语 — 语言是旅行的第一把钥匙</p></footer>
</div>
<script>
const PHRASE_DATA=[
{id:1,name:"基本问候",en:"Basic Greetings",category:"基本问候",icon:"👋",pairs:[
{zh:"你好",en:"Hello",pinyin:"Nǐ hǎo"},
{zh:"谢谢",en:"Thank you",pinyin:"Xièxie"},
{zh:"不客气",en:"You're welcome",pinyin:"Bù kèqì"},
{zh:"对不起",en:"I'm sorry",pinyin:"Duìbùqǐ"},
{zh:"没关系",en:"It's okay",pinyin:"Méi guānxì"},
{zh:"请问",en:"Excuse me",pinyin:"Qǐng wèn"}
]},
{id:2,name:"问路导航",en:"Asking for Directions",category:"问路导航",icon:"🧭",pairs:[
{zh:"请问洗手间在哪里？",en:"Where is the restroom?",pinyin:"Qǐng wèn xǐshǒujiān zài nǎlǐ?"},
{zh:"请带我去这个地方",en:"Please take me to this place",pinyin:"Qǐng dài wǒ qù zhège dìfāng"},
{zh:"附近有地铁站吗？",en:"Is there a subway station nearby?",pinyin:"Fùjìn yǒu dìtiězhàn ma?"},
{zh:"这条路怎么走？",en:"How do I get to this road?",pinyin:"Zhè tiáo lù zěnme zǒu?"},
{zh:"离这里多远？",en:"How far is it from here?",pinyin:"Lí zhèlǐ duō yuǎn?"}
]},
{id:3,name:"餐厅点餐",en:"Ordering Food",category:"餐厅点餐",icon:"🍜",pairs:[
{zh:"菜单",en:"Menu",pinyin:"Càidān"},
{zh:"这个推荐吗？",en:"Do you recommend this?",pinyin:"Zhège tuījiàn ma?"},
{zh:"不要辣",en:"No spicy please",pinyin:"Bùyào là"},
{zh:"买单",en:"Check, please",pinyin:"Mǎidān"},
{zh:"好吃！",en:"Delicious!",pinyin:"Hǎochī!"},
{zh:"再来一份",en:"One more please",pinyin:"Zài lái yí fèn"}
]},
{id:4,name:"购物消费",en:"Shopping",category:"购物消费",icon:"🛍️",pairs:[
{zh:"多少钱？",en:"How much?",pinyin:"Duōshǎo qián?"},
{zh:"太贵了",en:"Too expensive",pinyin:"Tài guì le"},
{zh:"可以便宜一点吗？",en:"Can you make it cheaper?",pinyin:"Kěyǐ piányi yìdiǎn ma?"},
{zh:"我要这个",en:"I want this one",pinyin:"Wǒ yào zhège"},
{zh:"可以刷卡吗？",en:"Can I pay by card?",pinyin:"Kěyǐ shuākǎ ma?"},
{zh:"有收据吗？",en:"Is there a receipt?",pinyin:"Yǒu shōujù ma?"}
]},
{id:5,name:"交通出行",en:"Transportation",category:"交通出行",icon:"🚌",pairs:[
{zh:"去机场",en:"To the airport",pinyin:"Qù jīchǎng"},
{zh:"请打表",en:"Please use the meter",pinyin:"Qǐng dǎbiǎo"},
{zh:"下一班几点？",en:"When is the next one?",pinyin:"Xià yì bān jǐ diǎn?"},
{zh:"在哪里坐车？",en:"Where do I catch the bus?",pinyin:"Zài nǎlǐ zuò chē?"},
{zh:"到站请提醒我",en:"Please remind me when we arrive",pinyin:"Dào zhàn qǐng tíxǐng wǒ"}
]},
{id:6,name:"紧急求助",en:"Emergency Help",category:"紧急求助",icon:"🆘",pairs:[
{zh:"救命！",en:"Help!",pinyin:"Jiùmìng!"},
{zh:"请叫警察",en:"Please call the police",pinyin:"Qǐng jiào jǐngchá"},
{zh:"请叫救护车",en:"Please call an ambulance",pinyin:"Qǐng jiào jiùhùchē"},
{zh:"我迷路了",en:"I'm lost",pinyin:"Wǒ mílù le"},
{zh:"我的东西被偷了",en:"My things were stolen",pinyin:"Wǒ de dōngxī bèi tōu le"},
{zh:"中国报警电话110",en:"China police: 110",pinyin:"Zhōngguó bàojǐng diànhuà: yāo yāo líng"}
]}
];
const grid=document.getElementById('phraseGrid');
const search=document.getElementById('searchInput');
const filterRow=document.getElementById('filterRow');
let currentFilter='all';
function render(){
const q=search.value.toLowerCase();
grid.innerHTML='';
PHRASE_DATA.filter(d=>{
const matchFilter=currentFilter==='all'||d.category===currentFilter;
const matchSearch=!q||d.name.toLowerCase().includes(q)||d.en.toLowerCase().includes(q)||d.pairs.some(p=>p.zh.includes(q)||p.en.toLowerCase().includes(q));
return matchFilter&&matchSearch;
}).forEach(d=>{
const pairsHTML=d.pairs.map(p=>`<div class="phrase-pair" onclick="this.querySelector('.pinyin').style.display=this.querySelector('.pinyin').style.display==='none'?'block':'none'"><div class="zh">${p.zh}</div><div class="en">${p.en}</div><div class="pinyin" style="display:none">${p.pinyin}</div></div>`).join('');
grid.innerHTML+=`<div class="phrase-card"><div class="p-header"><div class="p-icon">${d.icon}</div><div><div class="p-name">${d.name}</div><div class="p-category">${d.category} · ${d.en}</div></div></div><div class="p-pairs">${pairsHTML}</div></div>`;
});
}
filterRow.addEventListener('click',e=>{
if(e.target.classList.contains('filter-btn')){
filterRow.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
currentFilter=e.target.dataset.filter;
render();
}
});
search.addEventListener('input',render);
render();
</script>
</body>
</html>
