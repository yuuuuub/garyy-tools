<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国中医药文化百科 - Chinese Medicine Culture Encyclopedia</title>
<meta name="description" content="中国中医药文化百科，涵盖中医基础理论、诊断方法、养生之道与经典方剂">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国中医药文化百科 - Chinese Medicine Culture Encyclopedia">
<meta property="og:description" content="中国中医药文化百科，涵盖中医基础理论、诊断方法、养生之道与经典方剂">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-medicine-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#5b8c5a;--accent2:#4a7a4a}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#238636;--accent2:#1a7f37}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#0a1510 0%,#142818 50%,#1a3a20 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #2a5a30;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#5b8c5a,#8fc98a,#7a9e6a,#6b9e5a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.med-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.med-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.med-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.med-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.med-card .m-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.med-card .m-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(91,140,90,0.15);color:var(--accent)}
.med-card .m-name{font-size:1.3em;font-weight:bold}
.med-card .m-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.med-card .m-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.med-card .m-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.med-card .m-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.med-card .m-detail strong{color:var(--text)}
.med-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.med-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🏥 中国中医药文化百科</h1>
<p>Chinese Medicine Culture Encyclopedia — 探索中医基础理论、诊断方法与养生之道</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索中医理论、诊断方法或养生...（如"阴阳""经络""望闻问切"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部内容</button>
<button class="filter-btn" data-filter="基础理论">📖 基础理论</button>
<button class="filter-btn" data-filter="诊断方法">🔍 诊断方法</button>
<button class="filter-btn" data-filter="经络穴位">🗺️ 经络穴位</button>
<button class="filter-btn" data-filter="养生之道">🧘 养生之道</button>
<button class="filter-btn" data-filter="经典方剂">📜 经典方剂</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="med-grid" id="medGrid"></div>
<footer><p>🏥 中国中医药文化百科 — 上医治未病，中医治欲病</p></footer>
</div>
<script>
const MED_DATA=[
  {id:1,name:"阴阳学说",en:"Yin-Yang Theory",category:"基础理论",icon:"☯️",features:"对立统一、动态平衡",history:"阴阳学说是中医理论的基础，源于《易经》。认为宇宙万物都由阴阳两种对立统一的力量构成。",content:"阴阳相互对立、相互依存、相互转化。人体健康在于阴阳平衡，疾病则是阴阳失调的表现。治疗的原则就是调整阴阳，使之恢复平衡。",application:"诊断疾病性质（寒热虚实）、指导用药（寒者热之、热者寒之）、养生保健（阴阳调和）",culture:"阴阳学说体现了中国传统哲学的核心思想，是中医理论的哲学基础。"},
  {id:2,name:"五行学说",en:"Five Elements Theory",category:"基础理论",icon:"🌿",features:"相生相克、整体观念",history:"五行学说认为宇宙万物由木、火、土、金、水五种基本元素构成，它们之间存在相生相克的关系。",content:"五行相生：木生火、火生土、土生金、金生水、水生木。五行相克：木克土、土克水、水克火、火克金、金克木。五行与人体脏腑相对应：肝木、心火、脾土、肺金、肾水。",application:"指导诊断（面色、脉象）、用药（补泻原则）、养生（四季调养）",culture:"五行学说是中医理论的重要组成部分，体现了中医整体观念的特点。"},
  {id:3,name:"望诊",en:"Inspection",category:"诊断方法",icon:"👀",features:"观面色、察舌苔",history:"望诊是中医四诊之首，通过观察患者的神色形态来判断病情。包括望神、望色、望形、望态等。",content:"望神：观察精神状态、眼神、面色。望色：青、赤、黄、白、黑五色对应不同脏腑病变。望舌：舌质、舌苔、舌形、舌态。望形：体型、姿态、步态。",application:"判断疾病性质、病位深浅、预后好坏",culture:"望诊是中医最具特色的诊断方法之一，体现了中医'司外揣内'的诊断思路。"},
  {id:4,name:"闻诊",en:"Auscultation & Olfaction",category:"诊断方法",icon:"👂",features:"听声音、嗅气味",history:"闻诊是中医四诊之一，通过听患者的声音和嗅其气味来判断病情。",content:"听声音：语声、呼吸、咳嗽、呃逆、嗳气等。嗅气味：口气、体味、分泌物气味等。声音高亢有力为实证，低微无力为虚证。",application:"判断疾病虚实、寒热性质",culture:"闻诊体现了中医'以声察病'的诊断智慧。"},
  {id:5,name:"问诊",en:"Inquiry",category:"诊断方法",icon:"💬",features:"问寒热、问二便",history:"问诊是中医四诊之一，通过询问患者或其家属来了解病情。明代张景岳总结了'十问歌'。",content:"十问歌：一问寒热二问汗，三问头身四问便，五问饮食六问胸，七聋八渴俱当辨，九问旧病十问因，再兼服药参机变。",application:"全面了解病情、病史、用药情况",culture:"问诊是中医诊断的重要组成部分，体现了中医'治病求本'的诊疗理念。"},
  {id:6,name:"切诊",en:"Palpation",category:"诊断方法",icon:"🤲",features:"脉诊、按诊",history:"切诊是中医四诊之一，通过触摸患者的脉搏和身体来判断病情。脉诊是中医最具特色的诊断方法。",content:"脉诊：寸关尺三部对应不同脏腑。常见脉象有浮、沉、迟、数、虚、实等28种。按诊：按腹部、按穴位、按皮肤等。",application:"判断疾病性质、病位、病势",culture:"脉诊是中医诊断学的精华，体现了中医'以脉测病'的独特智慧。"},
  {id:7,name:"十二正经",en:"Twelve Meridians",category:"经络穴位",icon:"🗺️",features:"气血运行通道",history:"十二正经是人体气血运行的主要通道，连接脏腑与体表，是经络系统的核心组成部分。",content:"手三阴经：肺经、心包经、心经。手三阳经：大肠经、三焦经、小肠经。足三阴经：脾经、肝经、肾经。足三阳经：胃经、胆经、膀胱经。",application:"针灸治疗、推拿按摩、养生保健",culture:"经络学说是中医理论的重要组成部分，体现了中医'整体观念'的特点。"},
  {id:8,name:"足三里穴",en:"Zusanli Point",category:"经络穴位",icon:"📍",features:"强壮要穴、保健第一穴",history:"足三里是胃经合穴，位于小腿外侧，是中医最重要的保健穴位之一。'常按足三里，胜吃老母鸡'。",content:"位置：犊鼻下3寸，胫骨前嵴外一横指处。功效：健脾和胃、扶正培元、通经活络、升降气机。主治：胃痛、呕吐、腹胀、泄泻、便秘、虚劳等。",application:"日常保健、治疗消化系统疾病、增强免疫力",culture:"足三里是中国民间最常用的保健穴位，体现了中医'治未病'的养生理念。"},
  {id:9,name:"四季养生",en:"Seasonal Health",category:"养生之道",icon:"🌸",features:"顺应自然、因时制宜",history:"四季养生是中医养生的重要原则，强调人应顺应自然规律，根据四季变化调整生活起居。",content:"春养肝：早睡早起，舒展身体。夏养心：晚睡早起，避暑降温。秋养肺：早睡早起，收敛神气。冬养肾：早睡晚起，保暖避寒。",application:"指导日常起居、饮食调养、运动锻炼",culture:"四季养生体现了中医'天人合一'的养生理念，是中医养生学的核心内容。"},
  {id:10,name:"食疗养生",en:"Food Therapy",category:"养生之道",icon:"🥗",features:"药食同源、以食代药",history:"食疗养生是中医养生的重要方法，强调'药食同源'，通过饮食调理来预防和治疗疾病。",content:"食物四气：寒、热、温、凉。食物五味：酸、苦、甘、辛、咸。食物归经：不同食物归入不同经络脏腑。例如：生姜温中散寒，绿豆清热解毒。",application:"日常饮食调理、辅助治疗、预防疾病",culture:"食疗养生体现了中医'上医治未病'的预防思想，是中国传统养生文化的精华。"},
  {id:11,name:"六味地黄丸",en:"Liuwei Dihuang Wan",category:"经典方剂",icon:"💊",features:"滋阴补肾经典方",history:"六味地黄丸出自宋代钱乙《小儿药证直诀》，是滋阴补肾的经典方剂。由熟地黄、山茱萸、山药、泽泻、茯苓、牡丹皮六味药组成。",content:"组成：熟地黄、山茱萸、山药、泽泻、茯苓、牡丹皮。功效：滋阴补肾。主治：肾阴虚证，症见腰膝酸软、头晕耳鸣、盗汗遗精、骨蒸潮热等。",application:"治疗肾阴虚、更年期综合征、糖尿病等",culture:"六味地黄丸是中国最著名的中药方剂之一，体现了中医'异病同治'的治疗原则。"},
  {id:12,name:"四君子汤",en:"Sijunzi Tang",category:"经典方剂",icon:"💊",features:"补气健脾基础方",history:"四君子汤出自宋代《太平惠民和剂局方》，是补气健脾的基础方剂。由人参、白术、茯苓、甘草四味药组成。",content:"组成：人参、白术、茯苓、甘草。功效：益气健脾。主治：脾胃气虚证，症见面色萎白、语声低微、气短乏力、食少便溏等。",application:"治疗脾胃虚弱、慢性胃炎、消化不良等",culture:"四君子汤是中医补益剂的基础方，体现了中医'培土生金'的治疗思路。"}
];
function renderCards(data){
  document.getElementById('medGrid').innerHTML=data.map(m=>`
    <div class="med-card" data-category="${m.category}">
      <div class="m-header"><div class="m-icon">${m.icon}</div><div><div class="m-name">${m.name}</div><div class="m-sub">${m.en}</div></div></div>
      <div class="m-meta"><span>${m.features}</span></div>
      <div class="m-detail"><strong>历史：</strong>${m.history}</div>
      <div class="m-detail"><strong>内容：</strong>${m.content}</div>
      <div class="m-detail"><strong>应用：</strong>${m.application}</div>
      <div class="m-detail"><strong>文化：</strong>${m.culture}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">知识点</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.med-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.med-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(MED_DATA);renderStats(MED_DATA);
</script>
</body>
</html>
