<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国占卜 | Chinese Divination</title>
<meta property="og:title" content="中国占卜 | Chinese Divination">
<meta property="og:description" content="中国占卜 | Chinese Divination - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="中国占卜工具：铜钱摇卦、梅花易数、抽签占卜、奇门遁甲。体验传统中国占卜文化。">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a843;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:800px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.8rem;color:var(--gold)}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
.tab{padding:8px 18px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.85rem;transition:.2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}
.input-group input:focus{border-color:var(--blue);outline:none}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}
.btn:hover{opacity:.85}
.btn-red{background:var(--red)}
.btn-gold{background:var(--gold);color:var(--bg)}
.result-area{margin-top:16px;display:none}
.result-area.show{display:block}
.coin-area{display:flex;justify-content:center;gap:20px;margin:20px 0;flex-wrap:wrap}
.coin{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;transition:transform .3s;cursor:pointer;border:3px solid var(--gold)}
.coin.heads{background:linear-gradient(135deg,#ffd700,#b8860b);color:#333}
.coin.tails{background:linear-gradient(135deg,#555,#333);color:#ffd700}
.coin.shaking{animation:shake .3s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.lines-display{display:flex;flex-direction:column-reverse;align-items:center;gap:6px;margin:16px 0}
.hex-line{display:flex;gap:12px;align-items:center}
.line-seg{height:8px;background:var(--gold);border-radius:4px}
.line-seg.yang{width:60px}
.line-seg.yin{width:24px}
.line-label{font-size:.75rem;color:var(--text2);width:30px}
.qian-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.qian-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:.2s}
.qian-item:hover{border-color:var(--gold)}
.qian-item.selected{border-color:var(--blue);background:rgba(59,130,246,.1)}
.qian-item .q-num{font-size:1.4rem;color:var(--gold);font-weight:700}
.qian-item .q-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.history-list{margin-top:16px}
.history-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin:8px 0}
.history-item .h-time{font-size:.75rem;color:var(--text2)}
.history-item .h-type{color:var(--blue);font-weight:600}
.history-item .h-result{color:var(--gold);margin-top:4px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78rem;margin:2px}
.tag.good{background:rgba(35,134,54,.15);color:var(--green);border:1px solid rgba(35,134,54,.3)}
.tag.bad{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.tag.neutral{background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.25)}
#themeBtn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer;font-size:.8rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button id="themeBtn" onclick="toggleTheme()">🌓 主题</button>
<div class="container">
<h1>🎰 中国占卜</h1>
<p class="sub">铜钱摇卦 · 梅花易数 · 抽签占卜 · 奇门遁甲</p>

<div class="tabs">
<button class="tab active" onclick="switchTab('coin')">🪙 铜钱摇卦</button>
<button class="tab" onclick="switchTab('meihua')">🌸 梅花易数</button>
<button class="tab" onclick="switchTab('qian')">🎋 抽签占卜</button>
<button class="tab" onclick="switchTab('qimen')">🚪 奇门遁甲</button>
</div>

<div class="card" id="coinPanel">
<p style="text-align:center;color:var(--text2);margin-bottom:12px">点击铜钱摇卦，共摇6次生成卦象</p>
<div class="coin-area" id="coinArea">
<div class="coin heads" onclick="shakeCoin(0)" id="c0">字</div>
<div class="coin heads" onclick="shakeCoin(1)" id="c1">字</div>
<div class="coin heads" onclick="shakeCoin(2)" id="c2">字</div>
</div>
<div style="text-align:center;color:var(--text2);font-size:.85rem">已摇 <span id="shakeCount">0</span>/6 次</div>
<div class="lines-display" id="linesDisplay"></div>
<button class="btn btn-gold" onclick="resetCoins()" style="display:block;margin:12px auto">重新开始</button>
<div class="result-area" id="coinResult"></div>
</div>

<div class="card" id="meihuaPanel" style="display:none">
<div class="input-group"><label>输入任意数字或文字（用于起卦）</label><input type="text" id="mhInput" placeholder="如：37 或 出生日期"></div>
<button class="btn" onclick="calcMeihua()">起卦</button>
<div class="result-area" id="mhResult"></div>
</div>

<div class="card" id="qianPanel" style="display:none">
<p style="color:var(--text2);margin-bottom:12px">心中默念所求之事，点击抽取签文</p>
<button class="btn btn-gold" onclick="drawQian()" style="display:block;margin:0 auto">🙏 抽签</button>
<div class="result-area" id="qianResult"></div>
</div>

<div class="card" id="qimenPanel" style="display:none">
<button class="btn" onclick="calcQimen()">排盘</button>
<div class="result-area" id="qimenResult"></div>
</div>

<div class="card">
<h3 style="color:var(--blue);margin-bottom:8px">📜 占卜记录</h3>
<div class="history-list" id="historyList"><div style="color:var(--text2);font-size:.85rem">暂无记录</div></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var shakeCount=0;
var lines=[];
var trigrams=['乾☰','兑☱','离☲','震☳','巽☴','坎☵','艮☶','坤☷'];
var trigramNames=['乾','兑','离','震','巽','坎','艮','坤'];
var trigramWx=['金','金','火','木','木','水','土','土'];

var qianData=[
{num:1,type:'上上',title:'乾为天',poem:'天行健，君子以自强不息',fortune:'大吉大利，万事如意，事业有成，前程似锦。'},
{num:2,type:'上上',title:'坤为地',poem:'地势坤，君子以厚德载物',fortune:'厚积薄发，贵人相助，运势上升。'},
{num:3,type:'上上',title:'水雷屯',poem:'云雷屯，君子以经纶',fortune:'创业维艰，但终有成就，坚持即胜。'},
{num:4,type:'上签',title:'山水蒙',poem:'山下出泉，蒙',fortune:'启蒙之象，学业进步，虚心受教。'},
{num:5,type:'上签',title:'水天需',poem:'云上于天，需',fortune:'等待时机，蓄势待发，耐心为上。'},
{num:6,type:'上签',title:'天水讼',poem:'天与水违行，讼',fortune:'避免争执，和为贵，退一步海阔天空。'},
{num:7,type:'中签',title:'地水师',poem:'地中有水，师',fortune:'宜蓄力不宜冒进，团结协作可成事。'},
{num:8,type:'中签',title:'水地比',poem:'地上有水，比',fortune:'人际关系良好，合作共赢。'},
{num:9,type:'中签',title:'风天小畜',poem:'风行天上，小畜',fortune:'小事可成，大事需等待，积少成多。'},
{num:10,type:'中签',title:'天泽履',poem:'上天下泽，履',fortune:'小心谨慎，按部就班，步步为营。'},
{num:11,type:'中签',title:'地天泰',poem:'天地交泰',fortune:'否极泰来，运势好转，把握机会。'},
{num:12,type:'中签',title:'天地否',poem:'天地不交，否',fortune:'暂时困顿，但终会转运，保持信心。'},
{num:13,type:'下签',title:'天火同人',poem:'天与火，同人',fortune:'合作有隙，需谨慎选择伙伴。'},
{num:14,type:'下签',title:'火天大有',poem:'火在天上，大有',fortune:'盛极必衰，居安思危，不可骄纵。'},
{num:15,type:'下签',title:'地山谦',poem:'地中有山，谦',fortune:'谦虚使人进步，低调行事为宜。'},
{num:16,type:'下签',title:'雷地豫',poem:'雷出地奋，豫',fortune:'不可安逸，需积极进取。'},
{num:17,type:'下下',title:'泽雷随',poem:'泽中有雷，随',fortune:'随遇而安，顺势而为，不可强求。'},
{num:18,type:'下下',title:'山风蛊',poem:'山下有风，蛊',fortune:'需要整顿，去除旧弊，方可新生。'},
{num:19,type:'上签',title:'地泽临',poem:'泽上有地，临',fortune:'居高临下，把握主动，运势上升。'},
{num:20,type:'上签',title:'风地观',poem:'风行地上，观',fortune:'观察形势，审时度势，谋定后动。'}
];

var history=JSON.parse(localStorage.getItem('divination_history')||'[]');

function init(){
renderHistory();
}

function switchTab(tab){
document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
event.target.classList.add('active');
['coinPanel','meihuaPanel','qianPanel','qimenPanel'].forEach(function(id){document.getElementById(id).style.display='none'});
var map={coin:'coinPanel',meihua:'meihuaPanel',qian:'qianPanel',qimen:'qimenPanel'};
document.getElementById(map[tab]).style.display='block';
}

function shakeCoin(i){
if(shakeCount>=6)return;
var coin=document.getElementById('c'+i);
coin.classList.add('shaking');
setTimeout(function(){coin.classList.remove('shaking')},300);
var isHeads=Math.random()>0.5;
coin.className='coin '+(isHeads?'heads':'tails');
coin.textContent=isHeads?'字':'花';
var val=isHeads?0:1;
lines.push(val);
document.getElementById('shakeCount').textContent=lines.length;
renderLines();
if(lines.length===6){
showCoinResult();
}
}

function renderLines(){
var d=document.getElementById('linesDisplay');
var html='';
var lineLabels=['初爻','二爻','三爻','四爻','五爻','上爻'];
for(var i=0;i<lines.length;i++){
var isYang=lines[i]===0;
html+='<div class="hex-line"><span class="line-label">'+lineLabels[i]+'</span>';
if(isYang){html+='<div class="line-seg yang"></div>'}
else{html+='<div class="line-seg yin"></div><div class="line-seg yin"></div>'}
html+='</div>';
}
d.innerHTML=html;
}

function showCoinResult(){
var lower=[0,0,0];var upper=[0,0,0];
for(var i=0;i<3;i++)lower[i]=lines[i];
for(var i=0;i<3;i++)upper[i]=lines[i+3];
var lowerIdx=lower[0]+lower[1]*2+lower[2]*4;
var upperIdx=upper[0]+upper[1]*2+upper[2]*4;
var hexIdx=upperIdx*8+lowerIdx%8;

var upperTrigram=trigramNames[upperIdx];
var lowerTrigram=trigramNames[lowerIdx];

var hexNames=['乾为天','兑为泽','离为火','震为雷','巽为风','坎为水','艮为山','坤为地'];
var hexDescs=['刚健中正','和悦亨通','光明照耀','奋发有为','柔顺渗透','智慧通达','稳重止步','包容万物'];

var r=document.getElementById('coinResult');
r.className='result-area show';
var html='<div style="text-align:center"><div style="font-size:1.3rem;color:var(--gold);margin-bottom:8px">'+upperTrigram+' 叠 '+lowerTrigram+'</div>';
html+='<div style="font-size:1.1rem;margin-bottom:8px">'+hexDescs[lowerIdx]+'</div></div>';
html+='<div style="padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border);margin-top:12px">';
html+='<div><strong>上卦：</strong>'+upperTrigram+' ('+trigramWx[upperIdx]+')</div>';
html+='<div><strong>下卦：</strong>'+lowerTrigram+' ('+trigramWx[lowerIdx]+')</div>';
html+='<div style="margin-top:8px"><strong>卦象解读：</strong>'+hexDescs[lowerIdx]+'。上卦'+upperTrigram+'代表外在环境，下卦'+lowerTrigram+'代表内在状态。两者结合，提示当前形势下宜'+(lowerIdx>3?'守静待变':'积极进取')+'。</div></div>';
r.innerHTML=html;
saveHistory('铜钱摇卦',upperTrigram+'叠'+lowerTrigram,hexDescs[lowerIdx]);
}

function resetCoins(){
shakeCount=0;lines=[];
for(var i=0;i<3;i++){
var c=document.getElementById('c'+i);
c.className='coin heads';c.textContent='字';
}
document.getElementById('shakeCount').textContent='0';
document.getElementById('linesDisplay').innerHTML='';
document.getElementById('coinResult').className='result-area';
document.getElementById('coinResult').innerHTML='';
}

function calcMeihua(){
var input=document.getElementById('mhInput').value.trim();
if(!input){alert('请输入数字或文字');return}
var num1=0,num2=0;
if(/^\d+$/.test(input)){
var digits=input.split('');
num1=parseInt(digits[0])||1;
num2=parseInt(digits[1])||1;
if(digits.length>2)for(var i=2;i<digits.length;i++)num2+=parseInt(digits[i]);
}else{
for(var i=0;i<input.length;i++){
if(i%2===0)num1+=input.charCodeAt(i);
else num2+=input.charCodeAt(i);
}
}
var upperIdx=num1%8;var lowerIdx=num2%8;
var lineIdx=(num1+num2)%6;

var upperTrigram=trigramNames[upperIdx];
var lowerTrigram=trigramNames[lowerIdx];

var r=document.getElementById('mhResult');
r.className='result-area show';
var html='<div style="text-align:center;margin-bottom:12px">';
html+='<div style="font-size:1.1rem;color:var(--gold)">'+upperTrigram+' 叠 '+lowerTrigram+'</div>';
html+='<div style="margin-top:8px"><span class="tag neutral">动爻：第'+(lineIdx+1)+'爻</span></div></div>';
html+='<div style="padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">';
html+='<div><strong>上卦：</strong>'+upperTrigram+' ('+trigramWx[upperIdx]+')</div>';
html+='<div><strong>下卦：</strong>'+lowerTrigram+' ('+trigramWx[lowerIdx]+')</div>';
html+='<div style="margin-top:8px"><strong>互卦：</strong>'+trigramNames[(upperIdx*2+lowerIdx)%8]+'叠'+trigramNames[(lowerIdx+upperIdx)%8]+'</div>';
html+='<div style="margin-top:8px"><strong>体用关系：</strong>'+
(trigramWx[lowerIdx]===trigramWx[upperIdx]?'体用比和，运势平稳。':
trigramWx[lowerIdx]==='金'?'体克用，有利但需谨慎。':
trigramWx[lowerIdx]==='木'?'用克体，需防小人。':'体用相生，运势良好。')+'</div></div>';
r.innerHTML=html;
saveHistory('梅花易数',upperTrigram+'叠'+lowerTrigram,'动爻第'+(lineIdx+1)+'爻');
}

function drawQian(){
var q=qianData[Math.floor(Math.random()*qianData.length)];
var r=document.getElementById('qianResult');
r.className='result-area show';
var html='<div style="text-align:center">';
html+='<div style="font-size:2.5rem;color:var(--gold);margin-bottom:8px">签 '+q.num+'</div>';
html+='<div style="margin-bottom:8px"><span class="tag '+(q.type==='上上'||q.type==='上签'?'good':q.type==='下签'||q.type==='下下'?'bad':'neutral')+'">'+q.type+'</span></div>';
html+='<div style="font-size:1.3rem;color:var(--gold);margin:8px 0">'+q.title+'</div>';
html+='<div style="color:var(--text2);font-style:italic;margin:8px 0">「'+q.poem+'」</div>';
html+='</div>';
html+='<div style="padding:16px;background:var(--bg);border-radius:8px;border:1px solid var(--border);margin-top:16px">';
html+='<div style="color:var(--gold);font-weight:600;margin-bottom:8px">📜 签文解读</div>';
html+='<div style="line-height:1.8">'+q.fortune+'</div></div>';
r.innerHTML=html;
saveHistory('抽签占卜',q.title+' ('+q.type+')',q.fortune);
}

function calcQimen(){
var now=new Date();
var y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate(),h=now.getHours();
var ju=y%12;
var doors=['休门','生门','伤门','杜门','景门','死门','惊门','开门'];
var stars=['天蓬','天芮','天冲','天辅','天禽','天心','天柱','天任','天英'];
var deities=['值符','螣蛇','太阴','六合','白虎','玄武','九地','九天'];

var r=document.getElementById('qimenResult');
r.className='result-area show';
var html='<div style="text-align:center;color:var(--text2);margin-bottom:12px">';
html+=y+'年'+m+'月'+d+'日 '+h+'时 奇门遁甲排盘</div>';
html+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0">';
for(var i=0;i<9;i++){
var door=doors[(h+i)%8];
var star=stars[(y+i)%9];
var deity=deities[(m+i)%8];
var dir=['北','东北','东','东南','南','西南','西','西北','中'][i];
html+='<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center">';
html+='<div style="font-size:.7rem;color:var(--text2)">'+dir+'</div>';
html+='<div style="color:var(--gold);font-size:.85rem;font-weight:600">'+star+'</div>';
html+='<div style="font-size:.8rem;color:var(--text)">'+door+'</div>';
html+='<div style="font-size:.7rem;color:var(--text2)">'+deity+'</div></div>';
}
html+='</div>';
var luckyDoor=doors[(h+7)%8];
var luckyStar=stars[(y+4)%9];
html+='<div style="padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">';
html+='<div><strong>吉门：</strong>'+luckyDoor+'</div>';
html+='<div><strong>吉星：</strong>'+luckyStar+'</div>';
html+='<div style="margin-top:8px"><strong>建议：</strong>当前时辰宜'+(h>=6&&h<18?'积极行动':'静心思考')+'，朝'+(['北','东北','东','东南','南','西南','西','西北'][h%8])+'方行事为吉。</div></div>';
r.innerHTML=html;
saveHistory('奇门遁甲',luckyDoor+' '+luckyStar,(h>=6&&h<18?'宜动':'宜静'));
}

function saveHistory(type,result,detail){
var now=new Date();
var time=now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0')+'-'+now.getDate().toString().padStart(2,'0')+' '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
history.unshift({time:type,time:time,type:type,result:result,detail:detail});
if(history.length>20)history=history.slice(0,20);
localStorage.setItem('divination_history',JSON.stringify(history));
renderHistory();
}

function renderHistory(){
var d=document.getElementById('historyList');
if(history.length===0){d.innerHTML='<div style="color:var(--text2);font-size:.85rem">暂无记录</div>';return}
var html='';
history.forEach(function(h){
html+='<div class="history-item"><div class="h-time">'+h.time+'</div>';
html+='<div class="h-type">'+h.type+'</div>';
