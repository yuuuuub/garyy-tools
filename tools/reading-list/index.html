<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读书单 - garyy-tools</title>
<meta name="description" content="阅读书单管理工具，记录和追踪阅读计划">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;margin-bottom:4px}
.sub{color:var(--text2);font-size:.85rem}
button{padding:9px 20px;border-radius:6px;border:none;background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.85}
input,textarea,select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.9rem;width:100%;outline:none;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-gold{background:var(--gold);color:#000}
.form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.form-row .field{flex:1;min-width:120px}
.form-row label{display:block;font-size:.78rem;color:var(--text2);margin-bottom:4px}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--bg);border-radius:6px;padding:4px}
.tab{flex:1;text-align:center;padding:7px 0;border-radius:4px;cursor:pointer;font-size:.85rem;color:var(--text2);transition:all .2s}
.tab.active{background:var(--blue);color:var(--text)}
.book-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.book-header{display:flex;justify-content:space-between;align-items:flex-start}
.book-info{flex:1}
.book-title{font-size:.95rem;font-weight:500;margin-bottom:2px}
.book-author{font-size:.8rem;color:var(--text2);margin-bottom:4px}
.book-meta{display:flex;gap:8px;font-size:.78rem;flex-wrap:wrap}
.status-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.72rem}
.status-wish{background:rgba(59,130,246,.15);color:var(--blue)}
.status-reading{background:rgba(245,158,11,.15);color:var(--gold)}
.status-done{background:rgba(34,197,94,.15);color:var(--green)}
.book-rating{color:var(--gold);font-size:.85rem}
.book-actions{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.book-actions button{font-size:.75rem;padding:4px 10px}
.del-btn{border:none;background:none;color:var(--red);cursor:pointer;font-size:1rem;padding:4px 8px;border-radius:4px}
.del-btn:hover{background:rgba(239,68,68,.15)}
.empty-text{text-align:center;color:var(--text2);padding:30px 0;font-size:.9rem}
select{appearance:auto}
.stars{display:flex;gap:2px;margin-top:4px}
.star{cursor:pointer;font-size:1.2rem;color:var(--border);transition:color .15s}
.star.active{color:var(--gold)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="阅读书单 - garyy-tools">
  <meta property="og:description" content="阅读书单管理工具，记录和追踪阅读计划">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/reading-list/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<header>
<h1>📚 阅读书单</h1>
<div class="sub">管理你的阅读</div>
</header>

<div class="card">
<h2 style="font-size:.95rem;margin-bottom:12px">添加书籍</h2>
<div class="form-row">
<div class="field">
<label>书名</label>
<input type="text" id="inputTitle" placeholder="书名" maxlength="100">
</div>
<div class="field">
<label>作者</label>
<input type="text" id="inputAuthor" placeholder="作者" maxlength="50">
</div>
</div>
<div class="form-row">
<div class="field">
<label>状态</label>
<select id="inputStatus">
<option value="想读">想读</option>
<option value="在读">在读</option>
<option value="已读">已读</option>
</select>
</div>
<div class="field">
<label>评分</label>
<div class="stars" id="starPicker">
<span class="star" data-rating="1">☆</span>
<span class="star" data-rating="2">☆</span>
<span class="star" data-rating="3">☆</span>
<span class="star" data-rating="4">☆</span>
<span class="star" data-rating="5">☆</span>
</div>
</div>
</div>
<button class="btn-green" id="btnAdd">添加书籍</button>
</div>

<div class="card">
<div class="tabs">
<div class="tab active" data-filter="all">全部</div>
<div class="tab" data-filter="想读">想读</div>
<div class="tab" data-filter="在读">在读</div>
<div class="tab" data-filter="已读">已读</div>
</div>
<div id="bookList"></div>
</div>
</div>

<script>
(function(){
'use strict';
let books=JSON.parse(localStorage.getItem('garyy_books')||'[]');
let filter='all';
let selectedRating=0;

function save(){
localStorage.setItem('garyy_books',JSON.stringify(books));
render();
}

function escHtml(s){
return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderStars(picker,rating){
picker.querySelectorAll('.star').forEach(function(s){
const val=parseInt(s.dataset.rating);
s.classList.toggle('active',val<=rating);
});
}

function initStarPicker(){
const picker=document.getElementById('starPicker');
renderStars(picker,0);
picker.querySelectorAll('.star').forEach(function(s){
s.addEventListener('click',function(){
const val=parseInt(this.dataset.rating);
selectedRating=(selectedRating===val)?0:val;
renderStars(picker,selectedRating);
});
});
}

function renderBooks(){
const el=document.getElementById('bookList');
const filtered=books.filter(function(b){
if(filter==='all')return true;
return b.status===filter;
});

if(filtered.length===0){
el.innerHTML='<div class="empty-text">暂无书籍</div>';
return;
}

let html='';
filtered.forEach(function(b,idx){
const realIdx=books.indexOf(b);
const stars='★'.repeat(b.rating)+'☆'.repeat(5-b.rating);
const statusClass=b.status==='想读'?'status-wish':b.status==='在读'?'status-reading':'status-done';
html+='<div class="book-item">'+
'<div class="book-header">'+
'<div class="book-info">'+
'<div class="book-title">'+escHtml(b.title)+'</div>'+
'<div class="book-author">'+escHtml(b.author||'未知作者')+'</div>'+
'<div class="book-meta">'+
'<span class="status-badge '+statusClass+'">'+escHtml(b.status)+'</span>'+
'<span class="book-rating">'+stars+'</span>'+
'</div>'+
'</div>'+
'<button class="del-btn" data-idx="'+realIdx+'">✕</button>'+
'</div>'+
'<div class="book-actions">'+
'<button class="'+(b.status==='想读'?'btn-gold':'')+'" data-idx="'+realIdx+'" data-status="想读">想读</button>'+
'<button class="'+(b.status==='在读'?'btn-gold':'')+'" data-idx="'+realIdx+'" data-status="在读">在读</button>'+
'<button class="'+(b.status==='已读'?'btn-gold':'')+'" data-idx="'+realIdx+'" data-status="已读">已读</button>'+
'</div>'+
'</div>';
});
el.innerHTML=html;

el.querySelectorAll('.del-btn').forEach(function(btn){
btn.addEventListener('click',function(){
const idx=parseInt(this.dataset.idx);
if(confirm('删除《'+books[idx].title+'》？')){
books.splice(idx,1);
save();
}
});
});
el.querySelectorAll('.book-actions button').forEach(function(btn){
btn.addEventListener('click',function(){
const idx=parseInt(this.dataset.idx);
books[idx].status=this.dataset.status;
save();
});
});
}

const tabs=document.querySelectorAll('.tab');
tabs.forEach(function(tab){
tab.addEventListener('click',function(){
tabs.forEach(function(t){t.classList.remove('active');});
this.classList.add('active');
filter=this.dataset.filter;
render();
});
});

document.getElementById('btnAdd').addEventListener('click',function(){
const title=document.getElementById('inputTitle').value.trim();
const author=document.getElementById('inputAuthor').value.trim();
const status=document.getElementById('inputStatus').value;
if(!title){garyyToast('请输入书名');return;}
books.push({title:title,author:author,status:status,rating:selectedRating,id:Date.now()});
document.getElementById('inputTitle').value='';
document.getElementById('inputAuthor').value='';
selectedRating=0;
renderStars(document.getElementById('starPicker'),0);
save();
});

initStarPicker();
renderBooks();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
