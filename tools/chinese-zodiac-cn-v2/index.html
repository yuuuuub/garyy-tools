var key1=a.name+'-'+b.name,key2=b.name+'-'+a.name;
var c=compatData[key1]||compatData[key2]||{score:60,desc:'一般配对，需要互相理解'};
var r=document.getElementById('compatResult');
r.className='result-area show';
r.innerHTML='<div class="compat-result">'+
'<div style="font-size:2rem">'+a.emoji+' ❤️ '+b.emoji+'</div>'+
'<div style="font-size:1.1rem;color:var(--gold);margin:8px 0">'+a.name+' + '+b.name+'</div>'+
'<div class="compat-score">'+c.score+'分</div>'+
'<div class="compat-bar"><div class="compat-fill" style="width:'+c.score+'%"></div></div>'+
'<div style="color:var(--text2);margin:12px 0">'+c.desc+'</div>'+
'<div><strong>配对建议：</strong>'+
(c.score>=80?'这对组合非常和谐，可以大胆发展！':
c.score>=60?'有一定默契，需要互相包容和理解。':
'性格差异较大，需要更多耐心和沟通。')+'</div></div>';
}

function showFortune(){
var name=document.getElementById('fortuneZodiac').value;
var z=zodiacs.find(function(z){return z.name===name});
var f=fortunes2026[name];
var r=document.getElementById('fortuneResult');
r.className='result-area show';
var stars=function(n){return '★'.repeat(n)+'☆'.repeat(5-n)};
r.innerHTML='<div class="fortune-card"><div class="f-title">'+z.emoji+' '+z.name+' 2026马年运势</div>'+
'<div class="f-row"><span>健康运</span><span class="stars">'+stars(f.health)+'</span></div>'+
'<div class="f-row"><span>财运</span><span class="stars">'+stars(f.wealth)+'</span></div>'+
'<div class="f-row"><span>事业运</span><span class="stars">'+stars(f.career)+'</span></div>'+
'<div class="f-row"><span>感情运</span><span class="stars">'+stars(f.love)+'</span></div>'+
'</div>'+
'<div style="margin-top:12px;padding:12px;background:var(--card);border-radius:8px;border:1px solid var(--border)">'+
'<strong>总评：</strong>'+f.overall+'</div>'+
'<div style="margin-top:12px;padding:12px;background:var(--card);border-radius:8px;border:1px solid var(--border)">'+
'<strong>化解建议：</strong>'+
(name==='马'?'本命年犯太岁，建议佩戴红色饰品，多行善事化解。'):
(name==='蛇'?'刑太岁之年，注意人际关系，避免冲动决策。'):
('与太岁马形成'+({鼠:'相冲',牛:'相害',虎:'半合',兔:'破',龙:'相生',羊:'六合',猴:'相克',鸡:'相克',狗:'三合',猪:'暗合'}[name]||'普通')+'关系，注意调节。')+'</div>';
}

function renderElements(){
var els=[
{name:'木',color:'#4caf50',animals:['虎','兔'],desc:'仁慈正直，生长向上'},
{name:'火',color:'#f44336',animals:['蛇','马'],desc:'热情奔放，光明照耀'},
{name:'土',color:'#ff9800',animals:['牛','龙','羊','狗'],desc:'厚德载物，包容万物'},
{name:'金',color:'#ffd700',animals:['猴','鸡'],desc:'刚毅果断，锐利锋芒'},
{name:'水',color:'#2196f3',animals:['鼠','猪'],desc:'智慧灵活，润物无声'}
];
var h='<div style="display:grid;gap:12px">';
els.forEach(function(el){
h+='<div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;border-left:4px solid '+el.color+'">'+
'<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:1.3rem;color:'+el.color+';font-weight:700">'+el.name+'</span>'+
'<span style="color:var(--text2);font-size:.85rem">'+el.desc+'</span></div>'+
'<div style="margin-top:8px">'+el.animals.map(function(a){var z=zodiacs.find(function(zz){return zz.name===a});return '<span class="tag neutral">'+z.emoji+' '+a+'</span>'}).join('')+'</div></div>';
});
h+='</div>';
document.getElementById('elementsDisplay').innerHTML=h;
}

function renderAll(){
var h='<div class="zodiac-grid">';
zodiacs.forEach(function(z){
h+='<div class="z-card"><div class="emoji">'+z.emoji+'</div><div class="name">'+z.name+'</div>'+
'<div class="branch">'+z.branch+'年 · '+z.element+'</div>'+
'<div style="font-size:.8rem;color:var(--text2);margin-top:6px">'+z.personality+'</div>'+
'<div style="margin-top:6px">'+z.luckyColors.map(function(c){return '<span class="tag neutral">'+c+'</span>'}).join('')+'</div></div>';
});
h+='</div>';
document.getElementById('allZodiacs').innerHTML=h;
}

function toggleTheme(){
var t=document.documentElement;
t.setAttribute('data-theme',t.getAttribute('data-theme')==='light'?'dark':'light');
}

init();
</script>
</body>
</html>
