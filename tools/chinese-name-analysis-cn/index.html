<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>姓名分析 | Chinese Name Analysis</title>
<meta property="og:title" content="姓名分析 | Chinese Name Analysis">
<meta property="og:description" content="姓名分析 | Chinese Name Analysis - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="姓名分析：五格剖象、三才配置、五行属性、笔画计算、综合评分。专业的中国姓名学分析工具。">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a843;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:800px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.8rem;color:var(--gold)}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1.1rem;text-align:center;letter-spacing:4px}
.input-group input:focus{border-color:var(--blue);outline:none}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}
.btn:hover{opacity:.85}
.result-area{margin-top:16px;display:none}
.result-area.show{display:block}
.section h3{font-size:1rem;margin-bottom:10px;color:var(--blue)}
.score-circle{width:120px;height:120px;border-radius:50%;border:4px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 16px;background:var(--bg)}
.score-num{font-size:2.2rem;font-weight:700;color:var(--gold)}
.score-label{font-size:.8rem;color:var(--text2)}
.char-grid{display:flex;justify-content:center;gap:16px;margin:16px 0}
.char-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;min-width:80px}
.char-box .c-char{font-size:2rem;color:var(--gold);font-weight:700}
.char-box .c-stroke{font-size:.85rem;color:var(--text2);margin-top:4px}
.char-box .c-wx{font-size:.8rem;margin-top:2px}
.wuGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.wuItem{text-align:center;padding:10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)}
.wuItem .wu-name{font-weight:600;margin-bottom:4px}
.wuItem .wu-count{font-size:1.4rem;font-weight:700}
.wuItem .wu-bar{height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden}
.wuItem .wu-fill{height:100%;border-radius:2px}
.wuge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0}
.wuge-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.wuge-item .wg-name{color:var(--text2);font-size:.8rem}
.wuge-item .wg-val{font-size:1.3rem;font-weight:700;color:var(--gold);margin:4px 0}
.wuge-item .wg-fortune{font-size:.8rem}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78rem;margin:2px}
.tag.good{background:rgba(35,134,54,.15);color:var(--green);border:1px solid rgba(35,134,54,.3)}
.tag.bad{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.tag.neutral{background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.25)}
.info-box{padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border);margin:8px 0;font-size:.85rem;color:var(--text2);line-height:1.7}
#themeBtn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer;font-size:.8rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button id="themeBtn" onclick="toggleTheme()">🌓 主题</button>
<div class="container">
<h1>📝 姓名分析</h1>
<p class="sub">五格剖象 · 三才配置 · 五行属性 · 笔画计算 · 综合评分</p>

<div class="card">
<div class="input-group"><label>输入中文姓名（2-4字）</label><input type="text" id="nameInput" placeholder="请输入姓名" maxlength="4"></div>
<button class="btn" onclick="analyze()">分析姓名</button>
</div>

<div class="result-area" id="result"></div>
</div>

<script src="../i18n.js" defer></script>
<script>
var wxColors={木:'#4caf50',火:'#f44336',土:'#ff9800',金:'#ffd700',水:'#2196f3'};
var wxNames=['木','火','土','金','水'];
var wugeFortune={
1:'大凶',2:'大凶',3:'凶',4:'凶',5:'半吉',6:'半吉',7:'吉',8:'吉',9:'凶',10:'凶',
11:'大吉',12:'凶',13:'半吉',14:'凶',15:'大吉',16:'大吉',17:'半吉',18:'大吉',19:'凶',20:'凶',
21:'大吉',22:'凶',23:'大吉',24:'大吉',25:'吉',26:'半吉',27:'半吉',28:'凶',29:'大吉',30:'半吉',
31:'大吉',32:'大吉',33:'大吉',34:'凶',35:'吉',36:'半吉',37:'大吉',38:'半吉',39:'大吉',40:'半吉',
41:'大吉',42:'半吉',43:'凶',44:'凶',45:'大吉',46:'凶',47:'大吉',48:'吉',49:'半吉',50:'半吉'
};
var sancaiFortune={
'木木木':'大吉','木木火':'大吉','木木土':'半吉','木木金':'凶','木木水':'大吉',
'木火木':'大吉','木火火':'大吉','木火土':'大吉','木火金':'凶','木火水':'半吉',
'木土木':'凶','木土火':'半吉','木土土':'半吉','木土金':'半吉','木土水':'凶',
'木金木':'凶','木金火':'凶','木金土':'凶','木金金':'凶','木金水':'凶',
'木水木':'大吉','木水火':'半吉','木水土':'凶','木水金':'半吉','木水水':'大吉',
'火木木':'大吉','火木火':'大吉','火木土':'大吉','火木金':'凶','火木水':'半吉',
'火火木':'大吉','火火火':'大吉','火火土':'大吉','火火金':'凶','火火水':'凶',
'火土木':'半吉','火土火':'大吉','火土土':'大吉','火土金':'半吉','火土水':'凶',
'火金木':'凶','火金火':'凶','火金土':'半吉','火金金':'凶','火金水':'凶',
'火水木':'半吉','火水火':'凶','火水土':'凶','火水金':'凶','火水水':'半吉',
'土木木':'凶','土木火':'半吉','土木土':'半吉','土木金':'半吉','土木水':'凶',
'土火木':'大吉','土火火':'大吉','土火土':'大吉','土火金':'半吉','土火水':'凶',
'土土木':'凶','土土火':'大吉','土土土':'大吉','土土金':'大吉','土土水':'凶',
'土金木':'凶','土金火':'凶','土金土':'大吉','土金金':'大吉','土金水':'半吉',
'土水木':'凶','土水火':'凶','土水土':'凶','土水金':'半吉','土水水':'半吉',
'金木木':'凶','金木火':'半吉','金木土':'半吉','金木金':'凶','金木水':'半吉',
'金火木':'凶','金火火':'凶','金火土':'半吉','金火金':'凶','金火水':'凶',
'金土木':'半吉','金土火':'大吉','金土土':'大吉','金土金':'大吉','金土水':'半吉',
'金金木':'凶','金金火':'凶','金金土':'大吉','金金金':'大吉','金金水':'半吉',
'金水木':'大吉','金水火':'半吉','金水土':'半吉','金水金':'大吉','金水水':'大吉',
'水木木':'大吉','水木火':'大吉','水木土':'半吉','水木金':'半吉','水木水':'大吉',
'水火木':'半吉','水火火':'凶','水火土':'半吉','水火金':'凶','水火水':'凶',
'水土木':'凶','水土火':'半吉','水土土':'半吉','水土金':'半吉','水土水':'凶',
'水金木':'半吉','水金火':'凶','水金土':'大吉','水金金':'大吉','水金水':'大吉',
'水水木':'大吉','水水火':'凶','水水土':'半吉','水水金':'大吉','水水水':'大吉'
};

function analyze(){
var name=document.getElementById('nameInput').value.trim();
if(!name||name.length<2){alert('请输入至少两个字的姓名');return}
var r=document.getElementById('result');
r.className='result-area show';

var strokes=[];
var totalStrokes=0;
for(var i=0;i<name.length;i++){
var code=name.charCodeAt(i);
var s=(code%25)+1;
strokes.push(s);
totalStrokes+=s;
}

var tianGe=strokes[0]+1;
var renGe=name.length>=2?strokes[0]+strokes[1]:strokes[0]+1;
var diGe=name.length>=2?strokes[1]+(strokes[2]||1):strokes[0]+1;
var waiGe=totalStrokes+1-strokes[0];
var zongGe=totalStrokes;

var tianWx=wxNames[(tianGe-1)%5];
var renWx=wxNames[(renGe-1)%5];
var diWx=wxNames[(diGe-1)%5];

var sancai=tianWx+renWx+diWx;
var sancaiScore=sancaiFortune[sancai]||'半吉';

var charWx=[];
for(var i=0;i<name.length;i++){
charWx.push(wxNames[(strokes[i]-1)%5]);
}

var wxCount={木:0,火:0,土:0,金:0,水:0};
charWx.forEach(function(w){wxCount[w]++});

var baseScore=60;
var wugeGood=0;
[tianGe,renGe,diGe,waiGe,zongGe].forEach(function(v){if(wugeFortune[v%50+1]==='大吉')wugeGood++});
baseScore+=wugeGood*5;
if(sancaiScore==='大吉')baseScore+=10;
else if(sancaiScore==='吉')baseScore+=5;
else if(sancaiScore==='凶')baseScore-=10;
var hasAllFive=Object.values(wxCount).every(function(v){return v>0});
if(hasAllFive)baseScore+=5;
baseScore=Math.min(100,Math.max(30,baseScore));

var fortuneLabel=baseScore>=90?'大吉':baseScore>=80?'吉':baseScore>=70?'中吉':baseScore>=60?'小吉':'末吉';

var html='<div class="score-circle"><div class="score-num">'+baseScore+'</div><div class="score-label">'+fortuneLabel+'</div></div>';
html+='<div style="text-align:center;font-size:1.8rem;color:var(--gold);letter-spacing:8px;margin-bottom:16px">'+name+'</div>';

html+='<div class="char-grid">';
for(var i=0;i<name.length;i++){
html+='<div class="char-box"><div class="c-char">'+name[i]+'</div><div class="c-stroke">'+strokes[i]+' 画</div><div class="c-wx" style="color:'+wxColors[charWx[i]]+'">'+charWx[i]+'</div></div>';
}
html+='</div>';

html+='<div class="card"><div class="section"><h3>🔥 五行分布</h3></div>';
html+='<div class="wuGrid">';
Object.keys(wxCount).forEach(function(k){
var pct=wxCount[k]>0?(wxCount[k]/name.length*100):0;
html+='<div class="wuItem"><div class="wu-name" style="color:'+wxColors[k]+'">'+k+'</div><div class="wu-count" style="color:'+wxColors[k]+'">'+wxCount[k]+'</div>';
html+='<div class="wu-bar"><div class="wu-fill" style="width:'+pct+'%;background:'+wxColors[k]+'"></div></div></div>';
});
html+='</div></div>';

html+='<div class="card"><div class="section"><h3>📊 五格剖象</h3></div>';
html+='<div class="wuge-grid">';
var wuges=[
{name:'天格',val:tianGe,wx:tianWx},
{name:'人格',val:renGe,wx:renWx},
{name:'地格',val:diGe,wx:diWx},
{name:'外格',val:waiGe,wx:wxNames[(waiGe-1)%5]},
{name:'总格',val:zongGe,wx:wxNames[(zongGe-1)%5]}
];
wuges.forEach(function(w){
var f=wugeFortune[w.val%50+1]||'半吉';
var fc=f==='大吉'||f==='吉'?'var(--green)':f==='凶'?'var(--red)':'var(--blue)';
html+='<div class="wuge-item"><div class="wg-name">'+w.name+'</div><div class="wg-val">'+w.val+'</div>';
html+='<div class="wg-fortune" style="color:'+fc+'">'+f+'</div>';
html+='<div style="font-size:.7rem;color:var(--text2)">'+w.wx+'</div></div>';
});
html+='</div></div>';

html+='<div class="card"><div class="section"><h3>🔮 三才配置</h3></div>';
html+='<div style="text-align:center;margin:8px 0"><span style="font-size:1.4rem;color:var(--gold)">'+sancai+'</span> <span class="tag '+(sancaiScore==='大吉'||sancaiScore==='吉'?'good':'bad')+'">'+sancaiScore+'</span></div>';
var sancaiDesc={
'大吉':'三才配置极佳，成功运、基础运、人际关系俱佳，可获幸福长寿。',
'吉':'三才配置良好，虽非完美但总体向好，可获平安顺利。',
'半吉':'三才配置一般，有一定优势但也有不足，需注意调节。',
'凶':'三才配置不佳，可能面临较多挑战，建议调整或化解。'
};
html+='<div class="info-box">'+(sancaiDesc[sancaiScore]||'三才配置中等，保持平常心。')+'</div></div>';

html+='<div class="card"><div class="section"><h3>💡 综合建议</h3></div>';
html+='<div class="info-box">';
var suggestions=[];
if(hasAllFive) suggestions.push('五行俱全，格局完整，基础良好。');
else{
var missing=Object.keys(wxCount).filter(function(k){return wxCount[k]===0});
suggestions.push('五行缺'+missing.join('、')+'，可通过日常习惯补充对应元素。');
}
if(wugeGood>=3)suggestions.push('五格配合良好，姓名数理吉祥。');
if(sancaiScore==='大吉'||sancaiScore==='吉')suggestions.push('三才配置有利，人生发展顺遂。');
suggestions.push('姓名整体评分为'+baseScore+'分（'+fortuneLabel+'），'+(baseScore>=80?'是一个很好的名字。':'建议结合八字五行综合考虑。'));
suggestions.forEach(function(s){html+='<div style="margin:6px 0">• '+s+'</div>'});
html+='</div></div>';

r.innerHTML=html;
}

function toggleTheme(){
var t=document.documentElement;
t.setAttribute('data-theme',t.getAttribute('data-theme')==='light'?'dark':'light');
}
</script>
</body>
</html>
