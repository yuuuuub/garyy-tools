<style>
  :root {

    --text: #2c2416;

    --accent: #c13333;
    --gold: #c8a14b;
    --gold-bg: #fdf6e3;
    --border: #e8dcc8;
    --bar-bg: #ece3d5;
    --tag-bg: #f7f0e1;
    --tag-text: #8b7355;
    --red: #d4423a;
    --green: #4a8c5e;
    --shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  [data-theme="dark"] {
    --bg: #1a1814;
    --card: #24211a;
    --text: #e8ddcc;
    --sub: #a89a7e;
    --accent: #e05551;
    --gold: #d4ae5e;
    --gold-bg: #2c2618;
    --border: #3d3526;
    --bar-bg: #302a1e;
    --tag-bg: #2c2618;
    --tag-text: #a89a7e;
    --shadow: 0 2px 12px rgba(0,0,0,.3);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  .container { width: 100%; max-width: 480px; }

  /* Header */
  header {
    text-align: center;
    padding: 24px 0 12px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--red), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .disclaimer {
    font-size: 12px;
    color: var(--sub);
    margin-bottom: 8px;
    padding: 8px 14px;
    background: var(--tag-bg);
    border-radius: 8px;
    display: inline-block;
  }

  /* Controls */
  .controls {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 8px;
  }
  .theme-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    transition: .2s;
  }
  .theme-btn:hover { opacity: .8; }

  /* Input Card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .input-wrap {
    display: flex;
    gap: 10px;
  }
  input[type="text"] {
    flex: 1;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
    font-size: 18px;
    font-weight: 500;
    outline: none;
    transition: .2s;
    font-family: inherit;
    letter-spacing: 4px;
  }
  input[type="text"]:focus {
    border-color: var(--gold);
  }
  .btn {
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--red), #b83230);
    color: #fff;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(193,51,51,.3); }

  /* Total Score */
  .score-circle-wrap {
    text-align: center;
    padding: 24px 0 12px;
  }
  .score-big {
    font-size: 72px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -2px;
  }
  .score-label {
    font-size: 14px;
    color: var(--sub);
    margin: 4px 0;
  }
  .score-grade {
    display: inline-block;
    padding: 4px 16px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
    margin: 8px 0;
  }
  .grade-S { background: #fff0e6; color: #d4423a; }
  .grade-A { background: #fff8e1; color: #c8a14b; }
  .grade-B { background: #e8f5e9; color: #4a8c5e; }
  .grade-C { background: #e3f2fd; color: #1565c0; }
  .grade-D { background: #f3e5f5; color: #7b1fa2; }

  [data-theme="dark"] .grade-S { background: #3d2020; color: #e05551; }
  [data-theme="dark"] .grade-A { background: #3d3520; color: #d4ae5e; }
  [data-theme="dark"] .grade-B { background: #203d20; color: #4a8c5e; }
  [data-theme="dark"] .grade-C { background: #202840; color: #64b5f6; }
  [data-theme="dark"] .grade-D { background: #30203d; color: #ce93d8; }

  /* Dimension Bars */
  .dim-item {
    margin-bottom: 14px;
  }
  .dim-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .dim-name {
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dim-score {
    font-weight: 700;
    font-size: 14px;
  }
  .dim-max {
    font-size: 12px;
    color: var(--sub);
    font-weight: 400;
  }
  .bar-track {
    height: 8px;
    background: var(--bar-bg);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width .8s ease;
  }
  .bar-yq { background: linear-gradient(90deg, #e05551, #d4423a); }
  .bar-yy { background: linear-gradient(90deg, #4a8c5e, #3c754e); }
  .bar-zx { background: linear-gradient(90deg, #c8a14b, #b89138); }
  .bar-wx { background: linear-gradient(90deg, #569cd6, #4a86b8); }
  .bar-ld { background: linear-gradient(90deg, #c586c0, #b076a8); }

  .dim-comment {
    font-size: 12px;
    color: var(--sub);
    margin-top: 4px;
  }

  /* Char Analysis */
  .char-list {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .char-card {
    flex: 1;
    min-width: 100px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .char-big {
    font-size: 40px;
    line-height: 1.2;
  }
  .char-info {
    font-size: 11px;
    color: var(--sub);
    margin-top: 6px;
    line-height: 1.6;
  }
  .char-info span {
    display: block;
  }

  /* Wuge Grid */
  .wuge-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
  }
  .wuge-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
  }
  .wuge-label {
    font-size: 11px;
    color: var(--sub);
    margin-bottom: 2px;
  }
  .wuge-val {
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
  }
  .wuge-num {
    font-size: 13px;
    color: var(--text);
  }

  /* Overall comment */
  .comment-box {
    background: var(--gold-bg);
    border-radius: 12px;
    padding: 16px;
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
  }
  .comment-box::before {
    content: "📝 ";
    font-size: 16px;
  }

  /* Result visibility */
  #result { display: none; }
  #result.show { display: block; }

  /* Footer */
  footer {
    text-align: center;
    padding: 24px 0;
    font-size: 12px;
    color: var(--sub);
  }

  /* Responsive */
  @media (max-width: 380px) {
    h1 { font-size: 24px; }
    .score-big { font-size: 56px; }
    .char-big { font-size: 32px; }
    input[type="text"] { font-size: 16px; padding: 12px 14px; }
  }
</style>

</div>

function getCharInfo(ch) {
  return charDB[ch] || null;
}

function getWuxing(chars) {
  return chars.map(ch => {
    const info = getCharInfo(ch);
    return info ? info[1] : null;
  }).filter(Boolean);
}

function calcWuxingScore(wuxings) {
  if (wuxings.length < 2) return Math.floor(Math.random() * 3) + 8;
  let score = 7;
  for (let i = 0; i < wuxings.length - 1; i++) {
    const a = wuxings[i], b = wuxings[i+1];
    if (a === b) { score += 2; } // Same element is stable
    else if (wxGen[a] === b) { score += 4; } // Generation cycle
    else if (wxKe[a] === b) { score -= 3; } // Restriction cycle
    else { score += 1; }
  }
  return Math.max(3, Math.min(15, score));
}

function calcYunyinScore(name) {
  // Simplified tone analysis
  const tones = [];
  for (const ch of name) {
    const code = ch.charCodeAt(0);
    // Estimate tone based on Unicode range (very rough)
    tones.push(code);
  }
  // Use character data for a more meaningful score
  let score = 12;
  const len = name.length;
  if (len === 2) score += 4;
  else if (len === 3) score += 6;
  else if (len === 4) score += 3;

  // Check if characters have varied stroke counts (for rhythm)
  const strokes = [];
  for (const ch of name) {
    const info = getCharInfo(ch);
    if (info) strokes.push(info[0]);
  }
  if (strokes.length >= 2) {
    const diffs = [];
    for (let i = 1; i < strokes.length; i++) {
      diffs.push(Math.abs(strokes[i] - strokes[i-1]));
    }
    const avgDiff = diffs.reduce((a,b)=>a+b,0) / diffs.length;
    if (avgDiff > 5) score += 3;
    else if (avgDiff > 3) score += 2;
    else score += 1;
  }
  return Math.max(8, Math.min(25, score));
}

function calcZixingScore(name) {
  let score = 10;
  for (const ch of name) {
    const info = getCharInfo(ch);
    if (!info) { score += 1; continue; }
    const strokes = info[0];
    // Balanced stroke count (5-15 is ideal)
    if (strokes >= 5 && strokes <= 15) score += 2;
    else if (strokes >= 3 && strokes <= 18) score += 1;
    // Simplicity bonus
    if (strokes <= 8) score += 1;
  }
  return Math.max(6, Math.min(20, score));
}

function calcYuyiScore(name) {
  let score = 14;
  const meanings = [];
  for (const ch of name) {
    const info = getCharInfo(ch);
    if (info) {
      const comment = info[3];
      meanings.push(comment);
      // Positive meanings get higher scores
      if (/尊贵|王者|吉祥|富贵|美德|光明|智慧|卓越|杰出|美好|幸福|才华/.test(comment)) score += 3;
      else if (/正直|坚强|优雅|深厚|远大|宁静/.test(comment)) score += 2;
      else score += 1;
    } else {
      score += 1;
    }
  }
  return Math.max(10, Math.min(30, score));
}

function calcLiuxingScore(name) {
  let score = 5;
  const chars = [...name];
  let knownCount = 0;
  for (const ch of chars) {
    if (getCharInfo(ch)) knownCount++;
  }
  score += knownCount * 2; // Common chars in DB
  if (name.length === 2) score -= 1; // 2-char more common
  if (name.length === 4) score += 2; // 4-char less common
  return Math.max(2, Math.min(10, score));
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function getGrade(total) {
  if (total >= 90) return 'S';
  if (total >= 80) return 'A';
  if (total >= 65) return 'B';
  if (total >= 50) return 'C';
  return 'D';
}

function calcWuge(nameChars) {
  const strokes = nameChars.map(ch => {
    const info = getCharInfo(ch);
    return info ? info[0] : ch.charCodeAt(0) % 20 + 1; // fallback
  });

  let tiange, renge, dige, waige, zongge;

  if (strokes.length === 2) {
    // Single surname + single given name
    tiange = strokes[0] + 1;
    renge = strokes[0] + strokes[1];
    dige = strokes[1] + 1;
    zongge = strokes[0] + strokes[1];
    waige = 2;
  } else if (strokes.length === 3) {
    // Single surname + double given name
    tiange = strokes[0] + 1;
    renge = strokes[0] + strokes[1];
    dige = strokes[1] + strokes[2];
    zongge = strokes[0] + strokes[1] + strokes[2];
    waige = zongge - renge + 1;
  } else if (strokes.length === 4) {
    // Double surname + double given name
    tiange = strokes[0] + strokes[1];
    renge = strokes[1] + strokes[2];
    dige = strokes[2] + strokes[3];
    zongge = strokes[0] + strokes[1] + strokes[2] + strokes[3];
    waige = zongge - renge + 1;
  } else {
    tiange = strokes[0] + 1;
    renge = strokes[0];
    dige = 1;
    zongge = strokes[0];
    waige = 1;
  }

  // Wuge 1-81 good/bad evaluation
  const wugeLuck = {
    1: '大吉',2: '凶',3: '大吉',4: '凶',5: '大吉',6: '大吉',7: '大吉',8: '大吉',9: '凶',
    10:'凶',11:'大吉',12:'凶',13:'大吉',14:'凶',15:'大吉',16:'大吉',17:'大吉',18:'大吉',
    19:'凶',20:'凶',21:'大吉',22:'凶',23:'大吉',24:'大吉',25:'大吉',26:'凶',27:'凶',
    28:'凶',29:'大吉',30:'凶',31:'大吉',32:'大吉',33:'大吉',34:'凶',35:'大吉',36:'凶',
    37:'大吉',38:'凶',39:'大吉',40:'凶',41:'大吉',42:'凶',43:'凶',44:'凶',45:'大吉',
    46:'凶',47:'大吉',48:'大吉',49:'凶',50:'凶',51:'凶',52:'大吉',53:'凶',54:'凶',
    55:'凶',56:'凶',57:'凶',58:'凶',59:'凶',60:'凶',61:'凶',62:'凶',63:'大吉',64:'凶',
    65:'大吉',66:'凶',67:'大吉',68:'大吉',69:'凶',70:'凶',71:'凶',72:'凶',73:'凶',
    74:'凶',75:'凶',76:'凶',77:'凶',78:'凶',79:'凶',80:'凶',81:'大吉'
  };

  function getWugeDesc(n) {
    if (n < 1) n = 1;
    if (n > 81) n = ((n - 1) % 81) + 1;
    return `${n} (${wugeLuck[n] || '-'})`;
  }

  return { tiange, renge, dige, waige, zongge, getWugeDesc };
}

// Main scoring function
function scoreName() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();

  if (!name) {
    alert('请输入姓名！');
    return;
  }

  // Validate Chinese characters
  if (!/^[\u4e00-\u9fff]{2,4}$/.test(name)) {
    alert('请输入2-4个中文汉字！');
    return;
  }

  const chars = [...name];

  // Calculate scores (use a seed based on name for consistency)
  const seed = chars.reduce((s, ch) => s + ch.charCodeAt(0), 0);
  const pseudoRand = (function(s) {
    return function() {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  })(seed + 42);

  // Skip first random value
  pseudoRand();

  const yuyiScore = calcYuyiScore(name);
  const yunyinScore = calcYunyinScore(name);
  const zixingScore = calcZixingScore(name);
  const wuxings = getWuxing(chars);
  const wuxingScore = calcWuxingScore(wuxings);
  const liuxingScore = calcLiuxingScore(name);

  const total = yuyiScore + yunyinScore + zixingScore + wuxingScore + liuxingScore;
  const grade = getGrade(total);

  // Show result

  result.classList.add('show');

  const wugeItems = [
    { label:'天格', value:wuge.tiange },
    { label:'人格', value:wuge.renge },
    { label:'地格', value:wuge.dige },
    { label:'外格', value:wuge.waige },
    { label:'总格', value:wuge.zongge },
    { label:'三才', value:`${wuxings[0]||'?'}·${wuxings[1]||wuxings[0]||'?'}·${wuxings[2]||wuxings[1]||wuxings[0]||'?'}` }
  ];
  const wugeHtml = wugeItems.map(w => `
    <div class="wuge-item">
      <div class="wuge-label">${w.label}</div>
      <div class="wuge-val">${w.label==='三才' ? w.value : wuge.getWugeDesc(w.value)}</div>
    </div>
  `).join('');
  document.getElementById('wugeGrid').innerHTML = wugeHtml;

  // Scroll to result
  result.scrollIntoView({ behavior:'smooth', block:'start' });
}

// Theme toggle
(function() {
  const btn = document.getElementById('themeToggle');
  const html = document.documentElement;
  const saved = localStorage.getItem('name-score-theme');
  if (saved === 'dark') {
    html.setAttribute('data-theme', 'dark');
    btn.innerHTML = '☀️ 亮色模式';
  }
  btn.addEventListener('click', () => {
    const current = html.getAttribute('data-theme');
    if (current === 'dark') {
      html.removeAttribute('data-theme');
      btn.innerHTML = '🌙 暗色模式';
      localStorage.setItem('name-score-theme', 'light');
    } else {
      html.setAttribute('data-theme', 'dark');
      btn.innerHTML = '☀️ 亮色模式';
      localStorage.setItem('name-score-theme', 'dark');
    }
  });
})();

// Event listeners
document.getElementById('scoreBtn').addEventListener('click', scoreName);
document.getElementById('nameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') scoreName();
});

})();
</script>
