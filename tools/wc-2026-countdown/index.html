<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026世界杯倒计时</title>
<meta name="description" content="2026年美加墨世界杯倒计时 - 距离开幕还有多少天"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>"><meta name="robots" content="index, follow"><meta property="og:title" content="2026世界杯倒计时"><meta property="og:description" content="2026年美加墨世界杯倒计时">
<style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--gold:#d29922}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--gold:#9a6700}body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;line-height:1.6;display:flex;align-items:center;justify-content:center}.container{max-width:600px;margin:0 auto;text-align:center}h1{font-size:1.8rem;margin-bottom:8px}.sub{color:var(--text2);font-size:.9rem;margin-bottom:30px}.countdown{display:flex;justify-content:center;gap:16px;margin:30px 0;flex-wrap:wrap}.cd-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;min-width:80px}.cd-num{font-size:2.5rem;font-weight:800;color:var(--gold);line-height:1}.cd-label{font-size:.8rem;color:var(--text2);margin-top:4px}.info-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-top:24px;text-align:left}.info-card h3{font-size:1rem;color:var(--gold);margin-bottom:12px;text-align:center}.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem}.info-row:last-child{border-bottom:none}.progress-wrap{margin-top:20px}.progress-bar{width:100%;height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:8px}.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--blue));border-radius:4px;transition:width .5s}.progress-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2)}@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.container{animation:fadeIn .6s ease-out}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}.cd-num{animation:pulse 2s infinite}</style></head><body>
<div class="container">
<h1>⏳ 2026世界杯倒计时</h1>
<p class="sub">美加墨世界杯 · 2026年6月11日开幕</p>
<div class="countdown" id="countdown"></div>
<div class="progress-wrap">
<div class="progress-label"><span>申办成功</span><span>开幕日</span></div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>
<div class="info-card">
<h3>📋 赛事信息</h3>
<div class="info-row"><span>举办时间</span><span>2026年6月11日 - 7月19日</span></div>
<div class="info-row"><span>举办国家</span><span>🇺🇸 美国 · 🇲🇽 墨西哥 · 🇨🇦 加拿大</span></div>
<div class="info-row"><span>参赛球队</span><span>48支（首次扩军）</span></div>
<div class="info-row"><span>比赛场次</span><span>104场</span></div>
<div class="info-row"><span>决赛场馆</span><span>新泽西大都会球场</span></div>
<div class="info-row"><span>吉祥物</span><span>待公布</span></div>
<div class="info-row"><span>预计观众</span><span>500万+</span></div>
</div>
</div>
<script>
function updateCountdown(){
  var target=new Date('2026-06-11T16:00:00-04:00');
  var now=new Date();
  var diff=target-now;
  if(diff<=0){
    document.getElementById('countdown').innerHTML='<div class="cd-item"><div class="cd-num" style="font-size:1.5rem;color:var(--green)">🎉 比赛进行中！</div></div>';
    return;
  }
  var days=Math.floor(diff/(1000*60*60*24));
  var hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
  var mins=Math.floor((diff%(1000*60*60))/(1000*60));
  var secs=Math.floor((diff%(1000*60))/1000);
  document.getElementById('countdown').innerHTML=
    '<div class="cd-item"><div class="cd-num">'+days+'</div><div class="cd-label">天</div></div>'+
    '<div class="cd-item"><div class="cd-num">'+String(hours).padStart(2,'0')+'</div><div class="cd-label">时</div></div>'+
    '<div class="cd-item"><div class="cd-num">'+String(mins).padStart(2,'0')+'</div><div class="cd-label">分</div></div>'+
    '<div class="cd-item"><div class="cd-num">'+String(secs).padStart(2,'0')+'</div><div class="cd-label">秒</div></div>';
  // Progress
  var announce=new Date('2022-06-16').getTime();
  var open=new Date('2026-06-11T16:00:00-04:00').getTime();
  var now2=now.getTime();
  var pct=Math.min(100,Math.max(0,((now2-announce)/(open-announce))*100));
  document.getElementById('progressFill').style.width=pct+'%';
}
updateCountdown();
setInterval(updateCountdown,1000);
</script></body></html>
