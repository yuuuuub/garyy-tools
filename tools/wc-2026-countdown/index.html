<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026世界杯倒计时</title>
<meta name="description" content="2026年美加墨世界杯倒计时"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>"><meta name="robots" content="index, follow"><meta property="og:title" content="2026世界杯倒计时"><meta property="og:description" content="2026年美加墨世界杯倒计时">
<style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--gold:#d29922;--green:#238636}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--gold:#9a6700;--green:#1a7f37}body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;line-height:1.6;display:flex;align-items:center;justify-content:center}.container{max-width:600px;margin:0 auto;text-align:center}h1{font-size:1.8rem;margin-bottom:8px}.sub{color:var(--text2);font-size:.9rem;margin-bottom:30px}.countdown{display:flex;justify-content:center;gap:16px;margin:30px 0;flex-wrap:wrap}.cd-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;min-width:80px}.cd-num{font-size:2.5rem;font-weight:800;color:var(--gold);line-height:1}.cd-label{font-size:.8rem;color:var(--text2);margin-top:4px}.live-banner{background:linear-gradient(135deg,rgba(35,134,54,.2),rgba(210,153,34,.2));border:1px solid var(--green);border-radius:12px;padding:20px;margin:20px 0}.live-banner h2{color:var(--green);font-size:1.2rem;margin-bottom:8px}.progress-wrap{margin-top:20px}.progress-bar{width:100%;height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:8px}.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--blue));border-radius:4px;transition:width .5s}.progress-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2)}.info-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-top:24px;text-align:left}.info-card h3{font-size:1rem;color:var(--gold);margin-bottom:12px;text-align:center}.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem}.info-row:last-child{border-bottom:none}.loading{text-align:center;padding:20px;color:var(--text2)}.source{text-align:center;font-size:.75rem;color:var(--text2);margin-top:12px}@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.container{animation:fadeIn .6s ease-out}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}.cd-num{animation:pulse 2s infinite}
@media(max-width:600px){
  body{padding:12px!important}
  .container{max-width:100%!important;padding:0!important}
  h1{font-size:1.3rem!important}
  .card{padding:14px!important;margin-bottom:10px!important}
  .btn{padding:8px 16px!important;font-size:.85rem!important}
  textarea,.input-group input,.input-group select{font-size:16px!important}
  .tools-grid,.grid,.result-grid{grid-template-columns:1fr!important}
  table{font-size:.78rem!important}
  th,td{padding:5px 4px!important}
  .tab-bar{gap:4px!important}
  .tab{padding:6px 10px!important;font-size:.75rem!important}
}
</style></head><body>
<div class="container">
<h1>⏳ 2026世界杯倒计时</h1>
<p class="sub">美加墨世界杯 · 2026年6月11日 - 7月19日</p>
<div id="statusBanner"></div>
<div class="countdown" id="countdown"></div>
<div class="progress-wrap">
<div class="progress-label"><span>申办成功</span><span>闭幕日</span></div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>
<div class="info-card">
<h3>📋 赛事信息</h3>
<div class="info-row"><span>举办时间</span><span>2026年6月11日 - 7月19日</span></div>
<div class="info-row"><span>举办国家</span><span>🇺🇸 美国 · 🇲🇽 墨西哥 · 🇨🇦 加拿大</span></div>
<div class="info-row"><span>参赛球队</span><span>48支（首次扩军）</span></div>
<div class="info-row"><span>比赛场次</span><span>104场</span></div>
<div class="info-row"><span>决赛场馆</span><span>新泽西大都会球场</span></div>
</div>
<div id="liveMatches" style="margin-top:20px"></div>
<div class="source">比分数据：ESPN</div>
</div>
<script>
var API_BASE='https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world';

function updateCountdown(){
  var target=new Date('2026-06-11T16:00:00-04:00');
  var closing=new Date('2026-07-20T04:00:00+00:00');
  var now=new Date();
  
  var banner=document.getElementById('statusBanner');
  if(now>=target&&now<=closing){
    var dayNum=Math.floor((now-target)/(1000*60*60*24))+1;
    banner.innerHTML='<div class="live-banner"><h2>🟢 世界杯进行中 · 第'+dayNum+'天</h2><p style="color:var(--text2)">已进行'+dayNum+'/39天</p></div>';
    var cd=document.getElementById('countdown');
    var diff=closing-now;
    var days=Math.floor(diff/(1000*60*60*24));
    var hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    var mins=Math.floor((diff%(1000*60*60))/(1000*60));
    var secs=Math.floor((diff%(1000*60))/1000);
    cd.innerHTML='<div class="cd-item"><div class="cd-num">'+days+'</div><div class="cd-label">天</div></div><div class="cd-item"><div class="cd-num">'+String(hours).padStart(2,'0')+'</div><div class="cd-label">时</div></div><div class="cd-item"><div class="cd-num">'+String(mins).padStart(2,'0')+'</div><div class="cd-label">分</div></div><div class="cd-item"><div class="cd-num">'+String(secs).padStart(2,'0')+'</div><div class="cd-label">秒</div></div>';
    var pct=Math.min(100,(dayNum/39)*100);
    document.getElementById('progressFill').style.width=pct+'%';
  }else if(now<target){
    banner.innerHTML='';
    var diff=target-now;
    var days=Math.floor(diff/(1000*60*60*24));
    var hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    var mins=Math.floor((diff%(1000*60*60))/(1000*60));
    var secs=Math.floor((diff%(1000*60))/1000);
    document.getElementById('countdown').innerHTML='<div class="cd-item"><div class="cd-num">'+days+'</div><div class="cd-label">天</div></div><div class="cd-item"><div class="cd-num">'+String(hours).padStart(2,'0')+'</div><div class="cd-label">时</div></div><div class="cd-item"><div class="cd-num">'+String(mins).padStart(2,'0')+'</div><div class="cd-label">分</div></div><div class="cd-item"><div class="cd-num">'+String(secs).padStart(2,'0')+'</div><div class="cd-label">秒</div></div>';
    var announce=new Date('2022-06-16').getTime();
    var pct=Math.min(100,Math.max(0,((now.getTime()-announce)/(target.getTime()-announce))*100));
    document.getElementById('progressFill').style.width=pct+'%';
  }else{
    banner.innerHTML='<div class="live-banner"><h2>🏆 世界杯已闭幕</h2><p style="color:var(--text2)">下一届：2030年</p></div>';
    document.getElementById('countdown').innerHTML='';
    document.getElementById('progressFill').style.width='100%';
  }
}

function fetchLiveMatches(){
  var now=new Date();
  var dateStr=now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate();
  fetch(API_BASE+'/scoreboard?dates='+dateStr)
    .then(function(r){return r.json()})
    .then(function(data){
      var events=data.events||[];
      if(!events.length){document.getElementById('liveMatches').innerHTML='';return;}
      var html='<div class="card"><h3 style="text-align:center;color:var(--gold);margin-bottom:12px">⚽ 今日比赛</h3>';
      events.forEach(function(ev){
        var comp=(ev.competitions||[])[0];if(!comp)return;
        var competitors=comp.competitors||[];
        var home=competitors.find(function(c){return c.homeAway==='home';});
        var away=competitors.find(function(c){return c.homeAway==='away';});
        if(!home||!away)return;
        var status=comp.status?.type?.name||'';
        var isLive=status==='STATUS_IN_PROGRESS'||status==='STATUS_HALFTIME';
        html+='<div style="display:flex;align-items:center;justify-content:center;gap:12px;padding:8px;border-bottom:1px solid var(--border)">';
        html+='<span style="font-weight:600">'+(home.team?.abbreviation||'?')+'</span>';
        if(isLive){
          html+='<span style="color:var(--green);font-weight:700">'+(home.score||'0')+' - '+(away.score||'0')+'</span>';
          html+='<span style="font-size:.7rem;color:var(--red);animation:pulse 1.5s infinite">🔴 LIVE</span>';
        }else if(status==='STATUS_FULL_TIME'){
          html+='<span style="font-weight:700">'+(home.score||'0')+' - '+(away.score||'0')+'</span>';
          html+='<span style="font-size:.7rem;color:var(--green)">FT</span>';
        }else{
          html+='<span style="color:var(--text2);font-size:.85rem">'+comp.status?.type?.shortDetail||'vs'+'</span>';
        }
        html+='<span style="font-weight:600">'+(away.team?.abbreviation||'?')+'</span>';
        html+='</div>';
      });
      html+='</div>';
      document.getElementById('liveMatches').innerHTML=html;
    })
    .catch(function(){});
}

updateCountdown();
setInterval(updateCountdown,1000);
fetchLiveMatches();
setInterval(fetchLiveMatches,60*1000);
</script>
<script src="../i18n.js" defer></script>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
</body></html>
