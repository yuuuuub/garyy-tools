<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍵 中医饮食养生</title>
<meta property="og:title" content="🍵 中医饮食养生">
<meta property="og:description" content="中医食疗养生，体质辨识、四季食疗、药膳食谱 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">

<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.detail{display:none}.detail.active{display:block}
.recipe-card{padding:16px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px}
.recipe-card h3{color:var(--accent);margin-bottom:8px}
.recipe-card .tag{margin:2px}
.ingredient{display:inline-block;padding:4px 8px;background:var(--bg);border-radius:4px;margin:2px;font-size:.85rem}
.method{padding:10px;background:var(--bg);border-radius:8px;margin-top:8px;font-size:.9rem;line-height:1.6}
.shop-list{list-style:none}
.shop-list li{padding:8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍵</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div class="ctn">
<div class="hdr">
<h1>🍵 中医饮食养生</h1>
<p>食疗养生，药食同源</p>
</div>

<div class="tab-bar" id="tabs">
<div class="tab active" data-tab="constitution">体质辨识</div>
<div class="tab" data-tab="season">四季食疗</div>
<div class="tab" data-tab="recipes">药膳食谱</div>
<div class="tab" data-tab="favorites">收藏夹</div>
<div class="tab" data-tab="shopping">购物清单</div>
</div>

<div id="view-constitution" class="detail active">
<div class="cd">
<h2>🧬 选择你的体质</h2>
<select id="constitution-select" onchange="showConstitution()">
<option value="">-- 请选择体质类型 --</option>
<option value="pinghe">平和质</option>
<option value="qixu">气虚质</option>
<option value="yangxu">阳虚质</option>
<option value="yinxu">阴虚质</option>
<option value="tanshi">痰湿质</option>
<option value="shire">湿热质</option>
<option value="xueyu">血瘀质</option>
<option value="qiyu">气郁质</option>
<option value="tebing">特禀质</option>
</select>
</div>
<div class="cd" id="constitution-detail" style="display:none">
<h2 id="constitution-name">体质详情</h2>
<div id="constitution-content"></div>
</div>
</div>

<div id="view-season" class="detail">
<div class="cd">
<h2>🌸 四季食疗推荐</h2>
<div id="season-list"></div>
</div>
</div>

<div id="view-recipes" class="detail">
<div class="cd">
<h2>📖 药膳食谱</h2>
<div id="recipe-list"></div>
</div>
</div>

<div id="view-favorites" class="detail">
<div class="cd">
<h2>❤️ 收藏的食谱</h2>
<div id="favorites-list"></div>
</div>
</div>

<div id="view-shopping" class="detail">
<div class="cd">
<h2>🛒 购物清单</h2>
<div id="shopping-list"></div>
<button onclick="clearShopping()" class="sec" style="margin-top:12px">清空清单</button>
</div>
</div>
</div>

<script>
const constitutions = {

    goodFoods: ['谷类', '蔬菜', '水果', '鱼类', '豆类'],

  },
  qixu: {
    name: '气虚质',
    desc: '元气不足，常感疲劳，气短懒言，容易感冒。',

    tips: ['多食温阳食物', '避免生冷寒凉', '注意保暖', '适当运动'],
    goodFoods: ['羊肉', '韭菜', '核桃', '桂圆', '生姜', '大枣'],
    badFoods: ['西瓜', '梨', '螃蟹', '绿豆', '苦瓜']
  },
  yinxu: {
    name: '阴虚质',
    desc: '阴液亏少，口燥咽干，手足心热，易口渴。',
    tips: ['多食滋阴食物', '避免辛辣燥热', '保持情绪稳定', '避免熬夜'],
    goodFoods: ['银耳', '百合', '枸杞', '鸭肉', '甲鱼', '牛奶', '蜂蜜'],

  },
  tanshi: {

    desc: '痰湿凝聚，体形肥胖，腹部肥满，口黏苔腻。',
    tips: ['多食健脾祛湿食物', '控制食量', '适当运动', '避免甜腻'],
    goodFoods: ['薏米', '红豆', '冬瓜', '荷叶', '山楂', '陈皮'],
    badFoods: ['甜食', '油腻食物', '酒类', '糯米']

    tips: ['多食清热利湿食物', '避免辛辣油腻', '保持皮肤清洁', '适当出汗'],
    goodFoods: ['绿豆', '苦瓜', '黄瓜', '西瓜', '薏米', '冬瓜'],
    badFoods: ['辣椒', '羊肉', '韭菜', '油炸食物', '酒类']
  },
  xueyu: {
    name: '血瘀质',
    desc: '血行不畅，肤色晦暗，易有瘀斑，口唇暗淡。',
    tips: ['多食活血化瘀食物', '避免寒凉', '适当运动', '保持情绪舒畅'],
    goodFoods: ['山楂', '红糖', '醋', '玫瑰花', '桃仁', '黑木耳'],
    badFoods: ['寒凉食物', '肥肉', '高脂肪食物']
  },
  qiyu: {
    name: '气郁质',
    desc: '气机郁滞，情志抑郁，忧虑脆弱，胸胁胀满。',
    tips: ['多食疏肝理气食物', '保持心情愉悦', '多参加社交活动', '适当运动'],
    goodFoods: ['玫瑰花', '佛手', '陈皮', '金橘', '山楂', '萝卜'],
    badFoods: ['收敛酸涩食物', '咖啡', '浓茶']
  },
  tebing: {
    name: '特禀质',
    desc: '先天禀赋不足，易过敏，如哮喘、荨麻疹等。',
    tips: ['避免过敏原', '多食益气固表食物', '饮食清淡', '避免辛辣刺激'],
    goodFoods: ['黄芪', '山药', '大枣', '糯米', '蜂蜜'],
    badFoods: ['海鲜', '辛辣食物', '酒类', '羊肉']
  }
};

const seasons = {
  spring: {
    name: '春季养生',
    icon: '🌸',
    desc: '春季阳气生发，宜养肝疏肝，多食绿色蔬菜。',
    foods: ['菠菜', '荠菜', '韭菜', '香椿', '豆芽', '芹菜'],
    tips: ['多吃绿色蔬菜', '少吃酸味食物', '适当食用辛甘发散之品']
  },
  summer: {
    name: '夏季养生',
    icon: '☀️',
    desc: '夏季炎热，宜清热解暑，养心安神。',
    foods: ['西瓜', '绿豆', '苦瓜', '黄瓜', '冬瓜', '荷叶'],
    tips: ['多喝水', '适当食用苦味食物', '避免过度贪凉']
  },
  autumn: {
    name: '秋季养生',
    icon: '🍂',
    desc: '秋季干燥，宜滋阴润燥，养肺生津。',
    foods: ['梨', '银耳', '百合', '蜂蜜', '芝麻', '藕'],
    tips: ['多吃润燥食物', '少吃辛辣', '适当食用酸味食物']
  },
  winter: {
    name: '冬季养生',
    icon: '❄️',
    desc: '冬季寒冷，宜温阳补肾，藏精养精。',
    foods: ['羊肉', '牛肉', '核桃', '桂圆', '黑豆', '枸杞'],
    tips: ['多吃温热食物', '适当进补', '避免生冷寒凉']
  }
};

const recipes = [
  {
    name: '黄芪炖鸡汤',
    category: '补气',
    constitution: 'qixu',
    season: 'winter',
    ingredients: ['黄芪30g', '母鸡1只', '大枣5枚', '枸杞10g', '生姜3片'],
    method: '将母鸡洗净，与黄芪、大枣、生姜一同放入砂锅，加水适量，大火煮沸后转小火炖2小时，最后加入枸杞再炖10分钟。',
    effect: '补气健脾，增强免疫力'
  },
  {
    name: '银耳莲子羹',
    category: '滋阴',
    constitution: 'yinxu',
    season: 'autumn',
    ingredients: ['银耳15g', '莲子30g', '枸杞10g', '冰糖适量'],
    method: '银耳泡发撕碎，莲子去芯，加水炖煮1小时至软糯，加入枸杞和冰糖调味。',
    effect: '滋阴润肺，养心安神'
  },
  {
    name: '薏米红豆粥',
    category: '祛湿',
    constitution: 'tanshi',
    season: 'summer',
    ingredients: ['薏米50g', '红豆50g', '冰糖适量'],
    method: '薏米和红豆提前浸泡4小时，加水煮至软烂，加入冰糖调味。',
    effect: '健脾祛湿，消肿利水'
  },
  {
    name: '姜枣茶',
    category: '温阳',
    constitution: 'yangxu',
    season: 'winter',
    ingredients: ['生姜5片', '大枣5枚', '红糖适量'],
    method: '生姜切片，大枣去核，加水煮沸后小火煮10分钟，加入红糖。',
    effect: '温中散寒，补气养血'
  },
  {
    name: '绿豆汤',
    category: '清热',
    constitution: 'shire',
    season: 'summer',
    ingredients: ['绿豆100g', '冰糖适量'],
    method: '绿豆洗净，加水大火煮沸后转小火煮至开花，加入冰糖调味。',
    effect: '清热解毒，消暑利水'
  },
  {
    name: '玫瑰花茶',
    category: '理气',
    constitution: 'qiyu',
    season: 'spring',
    ingredients: ['玫瑰花5朵', '冰糖适量'],
    method: '玫瑰花用沸水冲泡，焖5分钟后饮用，可加冰糖调味。',
    effect: '疏肝理气，活血化瘀'
  },
  {
    name: '山楂红糖水',
    category: '活血',
    constitution: 'xueyu',
    season: 'winter',
    ingredients: ['山楂15g', '红糖适量'],
    method: '山楂洗净切片，加水煮沸后小火煮10分钟，加入红糖调味。',
    effect: '活血化瘀，消食化积'
  },
  {
    name: '百合雪梨汤',
    category: '润肺',
    constitution: 'yinxu',
    season: 'autumn',
    ingredients: ['百合20g', '雪梨1个', '冰糖适量'],
    method: '百合泡发，雪梨去皮切块，加水煮沸后小火煮30分钟，加入冰糖。',
    effect: '滋阴润肺，清热化痰'
  }
];

let favorites = JSON.parse(localStorage.getItem('diet-favorites') || '[]');
let shoppingList = JSON.parse(localStorage.getItem('diet-shopping') || '[]');

function saveFavorites() { localStorage.setItem('diet-favorites', JSON.stringify(favorites)); }
function saveShopping() { localStorage.setItem('diet-shopping', JSON.stringify(shoppingList)); }

function showConstitution() {
  const key = document.getElementById('constitution-select').value;
  const card = document.getElementById('constitution-detail');
  if (!key) { card.style.display = 'none'; return; }
  const c = constitutions[key];
  card.style.display = 'block';
  document.getElementById('constitution-name').textContent = c.name;
  document.getElementById('constitution-content').innerHTML = `
    <p style="margin-bottom:12px;color:var(--text2)">${c.desc}</p>
    <div style="margin-bottom:12px"><strong>调养建议：</strong>
      ${c.tips.map(t => `<div style="padding:6px 0;border-bottom:1px solid var(--border)">• ${t}</div>`).join('')}
    </div>
    <div style="margin-bottom:12px"><strong>推荐食物：</strong>
      ${c.goodFoods.map(f => `<span class="tag s" style="margin:2px">${f}</span>`).join('')}
    </div>
    <div><strong>忌食食物：</strong>
      ${c.badFoods.map(f => `<span class="tag d" style="margin:2px">${f}</span>`).join('')}
    </div>
  `;
}

function renderSeasons() {
  const container = document.getElementById('season-list');
  container.innerHTML = Object.entries(seasons).map(([key, s]) => `
    <div class="li" onclick="showSeason('${key}')">
      <div><strong>${s.icon} ${s.name}</strong></div>
      <span class="tag w">${s.foods.length}种食物</span>
    </div>
  `).join('');
}

function showSeason(key) {
  const s = seasons[key];
  const container = document.getElementById('season-list');
  container.innerHTML = `
    <div class="recipe-card">
      <h3>${s.icon} ${s.name}</h3>
      <p style="color:var(--text2);margin-bottom:12px">${s.desc}</p>
      <div style="margin-bottom:12px"><strong>推荐食物：</strong>
        ${s.foods.map(f => `<span class="tag s" style="margin:2px">${f}</span>`).join('')}
      </div>
      <div><strong>养生要点：</strong>
        ${s.tips.map(t => `<div style="padding:6px 0;border-bottom:1px solid var(--border)">• ${t}</div>`).join('')}
      </div>
      <button class="sec" onclick="renderSeasons()" style="margin-top:12px">返回列表</button>
    </div>
  `;
}

function renderRecipes() {
  const container = document.getElementById('recipe-list');
  container.innerHTML = recipes.map((r, i) => `
    <div class="recipe-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3>${r.name}</h3>
        <span class="tag w">${r.category}</span>
      </div>
      <p style="color:var(--text2);margin:8px 0;font-size:.85rem">${r.effect}</p>
      <div style="margin-bottom:8px"><strong>食材：</strong>${r.ingredients.map(ig => `<span class="ingredient">${ig}</span>`).join('')}</div>
      <div class="method">${r.method}</div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="sec" onclick="toggleFavorite(${i})">${favorites.includes(i) ? '❤️ 已收藏' : '🤍 收藏'}</button>
        <button class="sec" onclick="addToShopping(${i})">🛒 加入购物清单</button>
      </div>
    </div>
  `).join('');
}

function toggleFavorite(index) {
  if (favorites.includes(index)) {
    favorites = favorites.filter(i => i !== index);
  } else {
    favorites.push(index);
  }
  saveFavorites();
  renderRecipes();
  renderFavorites();
}

function renderFavorites() {
  const container = document.getElementById('favorites-list');
  if (favorites.length === 0) {
    container.innerHTML = '<div class="empty">暂无收藏的食谱</div>';
    return;
  }
  container.innerHTML = favorites.map(i => {
    const r = recipes[i];
    return `
      <div class="recipe-card">
        <h3>${r.name}</h3>
        <p style="color:var(--text2);margin:8px 0;font-size:.85rem">${r.effect}</p>
        <button class="sec" onclick="toggleFavorite(${i})">取消收藏</button>
      </div>
    `;
  }).join('');
}

function addToShopping(index) {
  const r = recipes[index];
  r.ingredients.forEach(ig => {
    if (!shoppingList.find(s => s.name === ig)) {
      shoppingList.push({ name: ig, checked: false });
    }
  });
  saveShopping();
  renderShopping();
  alert(`✅ 已将 ${r.name} 的食材加入购物清单`);
}

function renderShopping() {
  const container = document.getElementById('shopping-list');
  if (shoppingList.length === 0) {
    container.innerHTML = '<div class="empty">购物清单为空</div>';
    return;
  }
  container.innerHTML = `
    <ul class="shop-list">
      ${shoppingList.map((s, i) => `
        <li>
          <span style="${s.checked ? 'text-decoration:line-through;color:var(--text2)' : ''}">${s.name}</span>
          <button onclick="toggleShopItem(${i})" style="padding:4px 8px;font-size:.8rem">${s.checked ? '撤销' : '✓'}</button>
        </li>
      `).join('')}
    </ul>
  `;
}

function toggleShopItem(index) {
  shoppingList[index].checked = !shoppingList[index].checked;
  saveShopping();
  renderShopping();
}

function clearShopping() {
  shoppingList = [];
  saveShopping();
  renderShopping();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
  });
});

renderSeasons();
renderRecipes();
renderFavorites();
renderShopping();
</script>
</body>
</html>
