gin-top:8px}.morph4-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.morph4-char{font-size:6rem;font-weight:700;color:var(--blue);display:inline-block}.morph4-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.morph4-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.morph4-option:hover{border-color:var(--blue)}.morph4-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}

<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔄 汉字变形6</h1><p class="sub">在线查看汉字变形效果</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="变" oninput="showMorph4()">
</div>
<button class="btn" onclick="showMorph4()">显示变形</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var morphTypes4=['galaxy','nebula','aurora','firework','sparkle','shimmer','glitter','glow','pulse','wave'];
var currentMorph4='galaxy';
function showMorph4(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="morph4-options">';
  morphTypes4.forEach(function(type){
    html+='<div class="morph4-option '+(type===currentMorph4?'active':'')+'" onclick="setMorph4(\''+type+'\')">'+getMorphName4(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="morph4-container">';
  html+='<div class="morph4-char" style="animation:'+getMorphCSS4(currentMorph4)+'">'+char+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>📋 变形说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>变形类型：</strong>'+getMorphName4(currentMorph4)+'</div>';
  html+='<div><strong>效果描述：</strong>'+getMorphDescription4(currentMorph4)+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function setMorph4(type){
  currentMorph4=type;
  showMorph4();
}
function getMorphName4(type){
  switch(type){
    case 'galaxy':return'银河';
    case 'nebula':return'星云';
    case 'aurora':return'极光';
    case 'firework':return'烟花';
    case 'sparkle':return'闪耀';
    case 'shimmer':return'闪烁';
    case 'glitter':return'闪光';
    case 'glow':return'发光';
    case 'pulse':return'脉冲';
    case 'wave':return'波浪';
    default:return'未知';
  }
}
function getMorphDescription4(type){
  switch(type){
    case 'galaxy':return'银河旋转效果，星空闪烁';
    case 'nebula':return'星云飘动效果，色彩斑斓';
    case 'aurora':return'极光流动效果，梦幻光彩';
    case 'firework':return'烟花绽放效果，绚烂多彩';
    case 'sparkle':return'闪耀闪烁效果，星光闪闪';
    case 'shimmer':return'闪烁波动效果，波光粼粼';
    case 'glitter':return'闪光点缀效果，闪闪发光';
    case 'glow':return'发光扩散效果，光芒四射';
    case 'pulse':return'脉冲跳动效果，节奏感强';
    case 'wave':return'波浪起伏效果，连绵不断';
    default:return'未知效果';
  }
}
function getMorphCSS4(type){
  switch(type){
    case 'galaxy':return'galaxy4 5s linear infinite';
    case 'nebula':return'nebula4 4s ease-in-out infinite';
    case 'aurora':return'aurora4 3s ease-in-out infinite';
    case 'firework':return'firework4 1.5s ease-out infinite';
    case 'sparkle':return'sparkle4 1s ease-in-out infinite';
    case 'shimmer':return'shimmer4 2s ease-in-out infinite';
    case 'glitter':return'glitter4 0.5s ease-in-out infinite';
    case 'glow':return'glow4 2s ease-in-out infinite';
    case 'pulse':return'pulse5 1.5s ease-in-out infinite';
    case 'wave':return'wave5 2s ease-in-out infinite';
    default:return'none';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showMorph4();
}
showMorph4();
</script>
<style>
@keyframes galaxy4{0%{transform:rotate(0deg);text-shadow:0 0 20px #fff,0 0 40px #fff,0 0 60px #fff,0 0 80px #00ffff,0 0 100px #00ffff}100%{transform:rotate(360deg);text-shadow:0 0 20px #fff,0 0 40px #fff,0 0 60px #fff,0 0 80px #00ffff,0 0 100px #00ffff}}
@keyframes nebula4{0%,100%{filter:hue-rotate(0deg) brightness(1)}50%{filter:hue-rotate(180deg) brightness(1.2)}}
@keyframes aurora4{0%,100%{filter:hue-rotate(0deg);opacity:1}50%{filter:hue-rotate(120deg);opacity:0.8}}
@keyframes firework4{0%{transform:scale(0);opacity:0}50%{transform:scale(1.5);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes sparkle4{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.2)}}
@keyframes shimmer4{0%,100%{opacity:1}50%{opacity:0.7}}
@keyframes glitter4{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.8)}}
@keyframes glow4{0%,100%{text-shadow:0 0 10px var(--blue)}50%{text-shadow:0 0 30px var(--blue),0 0 50px var(--blue),0 0 70px var(--blue)}}
@keyframes pulse5{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes wave5{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-10px) rotate(2deg)}50%{transform:translateY(0) rotate(0deg)}75%{transform:translateY(10px) rotate(-2deg)}}
</style><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
