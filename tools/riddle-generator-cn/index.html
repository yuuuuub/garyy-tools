<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>谜语生成器</title><meta name="description" content="随机生成中文谜语，挑战你的智慧"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#8b5cf6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:20px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.options{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.options select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem}.btn{display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.btn:hover{opacity:.85}.btn-secondary{background:var(--border);color:var(--text)}.actions{display:flex;gap:8px;justify-content:center;margin-top:16px}.riddle-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-top:16px}.riddle-icon{font-size:2.5rem;text-align:center;margin-bottom:12px}.riddle-question{font-size:1.15rem;line-height:1.8;color:var(--text);text-align:center;margin-bottom:16px;white-space:pre-wrap}.riddle-hint{font-size:.85rem;color:var(--text2);text-align:center;margin-bottom:12px}.riddle-answer{font-size:1.3rem;font-weight:700;color:var(--accent);text-align:center;display:none}.riddle-card.revealed .riddle-answer{display:block}.reveal-btn{display:block;margin:0 auto;padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.reveal-btn:hover{opacity:.85}.riddle-card.revealed .reveal-btn{display:none}.riddle-tags{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}.riddle-tag{padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:.75rem;color:var(--text2)}.counter{font-size:.8rem;color:var(--text2);margin-top:8px;text-align:center}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}</style><meta name="robots" content="index, follow"><meta property="og:title" content="谜语生成器"><meta property="og:description" content="随机生成中文谜语"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔮 谜语生成器</h1><p class="sub">随机生成中文谜语，挑战你的智慧</p>
<div class="card">
<div class="options">
<select id="category"><option value="all">全部</option><option value="object">物品</option><option value="animal">动物</option><option value="food">食物</option><option value="character">汉字</option><option value="nature">自然</option></select>
</div>
<div class="actions"><button class="btn" onclick="generate()">🎲 生成谜语</button></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
(function(){
var riddles=[
{c:'object',q:'麻屋子，红帐子，里面住着白胖子。',a:'花生',h:'想想花生的结构'},
{c:'object',q:'兄弟七八个，围着柱子坐，大家一分手，衣服就扯破。',a:'蒜',h:'想想大蒜的结构'},
{c:'object',q:'红口袋，绿口袋，有人怕，有人爱。',a:'辣椒',h:'想想辣椒的特点'},
{c:'object',q:'千条线，万条线，掉到水里看不见。',a:'雨',h:'从天而落到水里'},
{c:'object',q:'有头没有颈，身上冷冰冰，有翅不能飞，无脚也能行。',a:'鱼',h:'水中的生物'},
{c:'object',q:'一物生得奇，耳朵比身大，鼻子比腿长，鼻子能打鼓。',a:'大象',h:'体型最大的陆地动物'},
{c:'object',q:'身穿绿衣裳，肚里水汪汪，生的子儿多，个个黑脸膛。',a:'西瓜',h:'夏天常见的水果'},
{c:'object',q:'白天一起玩，夜里一起眠，到老不分散，人夸好姻缘。',a:'筷子',h:'吃饭时使用的工具'},
{c:'animal',q:'头戴红帽子，身披五彩衣，从来不唱戏，喜欢吊嗓子。',a:'公鸡',h:'家禽的一种'},
{c:'animal',q:'名字叫小花，喜欢摇尾巴，夜晚睡门口，小偷最怕它。',a:'狗',h:'人类的好朋友'},
{c:'animal',q:'身穿白袍子，头戴红帽子，走路摆架子，说话伸脖子。',a:'鹅',h:'水禽的一种'},
{c:'animal',q:'年纪不算大，胡子一大把，不管见到谁，总爱叫妈妈。',a:'山羊',h:'家畜的一种'},
{c:'animal',q:'嘴像小铲子，脚像小扇子，走路左右摆，不是摆架子。',a:'鸭子',h:'水禽的一种'},
{c:'animal',q:'小小年纪胡子翘，看见小鱼喵喵叫，爱洗脸爱理毛，老鼠看见连忙逃。',a:'猫',h:'会抓老鼠的宠物'},
{c:'food',q:'兄弟几个人，各进各的门，谁要走错了，出来笑死人。',a:'纽扣',h:'衣服上的装饰'},
{c:'food',q:'身穿红衣裳，常年把哨放，遇紧急事情，把信来传唱。',a:'信鸽',h:'古代用来传递信息的鸟'},
{c:'food',q:'一物不才，请客不来，主人不在，它在门外。',a:'扫帚',h:'打扫卫生的工具'},
{c:'food',q:'生在山中，颜色相同，来到世上，有绿有红。',a:'茶叶',h:'可以泡水喝的东西'},
{c:'character',q:'一口咬掉牛尾巴。',a:'告',h:'牛字去掉下面一竖'},
{c:'character',q:'二人土上坐。',a:'坐',h:'两个人坐在土上'},
{c:'character',q:'一月一日非今天。',a:'明',h:'日和月在一起'},
{c:'character',q:'七十二小时。',a:'晶',h:'三个日'},
{c:'character',q:'需要一半，留下一半。',a:'雷',h:'雨字头加田'},
{c:'character',q:'一加一不是二。',a:'王',h:'一+一=王'},
{c:'character',q:'人不在其位。',a:'立',h:'位字去掉人'},
{c:'character',q:'二小姐。',a:'姿',h:'次女'},
{c:'nature',q:'有脚不会走，有嘴不开口，脸儿洗不净，四季不离手。',a:'脸盆',h:'每天都要用的东西'},
{c:'nature',q:'一个小姑娘，生在水中央，身穿粉红衫，坐在绿船上。',a:'荷花',h:'夏天的花'},
{c:'nature',q:'红口袋，绿口袋，有人怕，有人爱。',a:'辣椒',h:'可以吃的东西'},
{c:'nature',q:'兄弟七八个，围着柱子坐，大家一分手，衣服就扯破。',a:'蒜',h:'厨房里的调味品'},
{c:'nature',q:'身体白又胖，常在泥中藏，浑身是蜂窝，生熟都能尝。',a:'藕',h:'荷花的根'}
];
var count=0;
function generate(){
var cat=document.getElementById('category').value;
var filtered=cat==='all'?riddles:riddles.filter(function(r){return r.c===cat});
var riddle=filtered[Math.floor(Math.random()*filtered.length)];
count++;
var catNames={object:'物品',animal:'动物',food:'食物',character:'汉字',nature:'自然'};
document.getElementById('result').innerHTML='<div class="riddle-card" id="riddleCard"><div class="riddle-icon">🔮</div><div class="riddle-question">'+riddle.q+'</div><div class="riddle-hint">💡 提示：'+riddle.h+'</div><div class="riddle-answer">答案：'+riddle.a+'</div><button class="reveal-btn" onclick="document.getElementById(\'riddleCard\').classList.add(\'revealed\')">揭晓答案</button><div class="riddle-tags"><span class="riddle-tag">'+catNames[riddle.c]+'</span></div><div class="counter">已生成 '+count+' 个谜语</div></div>';
}
})();
</script></body></html>
