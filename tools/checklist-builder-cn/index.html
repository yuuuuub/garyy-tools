<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清单生成器</title>
<meta name="description" content="在线创建各类待办清单，支持分类、优先级和导出">
<script defer src="../i18n.js"></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth;padding:16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button,textarea{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:60px;width:100%}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s;display:inline-block;text-align:center}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:4px 12px;font-size:.8rem}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:var(--radius);cursor:pointer;font-size:.82rem;background:var(--card);border:1px solid var(--border);color:var(--text2);transition:all .2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.checklist{list-style:none}
.checklist li{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);transition:background .2s}
.checklist li:hover{background:var(--bg)}
.checklist li.done .item-text{text-decoration:line-through;color:var(--text2)}
.checklist input[type="checkbox"]{width:18px;height:18px;accent-color:var(--green)}
.item-text{flex:1;font-size:.9rem}
.item-priority{font-size:.7rem;padding:2px 6px;border-radius:4px;font-weight:600}
.priority-high{background:var(--red);color:#fff}
.priority-mid{background:var(--gold);color:#000}
.priority-low{background:var(--green);color:#fff}
.item-del{background:none;border:none;color:var(--text2);cursor:pointer;font-size:.8rem}
.item-del:hover{color:var(--red)}
.add-row{display:flex;gap:8px;margin-top:12px}
.add-row input{flex:1}
.preview-box{background:#fff;color:#333;padding:24px;border-radius:var(--radius);border:1px solid #ddd;font-size:.82rem;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.output-area{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
.progress-bar{height:6px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.stats{font-size:.8rem;color:var(--text2);margin-bottom:8px}
@media(max-width:640px){.form-row{flex-direction:column}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="清单生成器">
<meta property="og:description" content="在线创建各类待办清单">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>✅ 清单生成器</h1>
    <p>快速创建结构化待办清单</p>
  </header>

  <div class="card">
    <div class="section-title">选择模板</div>
    <div class="tabs" id="templateTabs">
      <div class="tab active" data-tpl="blank">空白清单</div>
      <div class="tab" data-tpl="project">项目发布</div>
      <div class="tab" data-tpl="travel">出差准备</div>
      <div class="tab" data-tpl="meeting">会议准备</div>
      <div class="tab" data-tpl="review">Code Review</div>
      <div class="tab" data-tpl="deploy">上线部署</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">清单标题</div>
    <div class="form-row">
      <div class="group"><input type="text" id="listTitle" value="我的待办清单"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">待办事项</div>
    <div class="stats" id="stats">共 0 项，已完成 0 项</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <ul class="checklist" id="checklist"></ul>
    <div class="add-row">
      <input type="text" id="newItem" placeholder="添加新项目..." onkeydown="if(event.key==='Enter')addItem()">
      <select id="newPriority" style="width:auto">
        <option value="low">低</option>
        <option value="mid" selected>中</option>
        <option value="high">高</option>
      </select>
      <button class="btn btn-sm" onclick="addItem()">添加</button>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn btn-green" onclick="exportText()">导出 TXT</button>
    <button class="btn btn-outline" onclick="clearAll()">清空清单</button>
  </div>

  <div class="output-area" id="outputArea" style="display:none">
    <div class="section-title">导出预览</div>
    <div class="preview-box" id="preview"></div>
  </div>
</div>

<script>
var templates = {
  blank: [],
  project: [
    {text:'需求评审通过', priority:'high', done:false},
    {text:'UI设计稿确认', priority:'high', done:false},
    {text:'技术方案评审', priority:'mid', done:false},
    {text:'开发环境搭建', priority:'mid', done:false},
    {text:'核心功能开发', priority:'high', done:false},
    {text:'单元测试编写', priority:'mid', done:false},
    {text:'集成测试', priority:'mid', done:false},
    {text:'性能优化', priority:'low', done:false},
    {text:'上线部署', priority:'high', done:false}
  ],
  travel: [
    {text:'预订机票/车票', priority:'high', done:false},
    {text:'预订酒店', priority:'high', done:false},
    {text:'准备身份证/护照', priority:'high', done:false},
    {text:'准备换洗衣物', priority:'mid', done:false},
    {text:'充电器/移动电源', priority:'mid', done:false},
    {text:'准备文件资料', priority:'mid', done:false},
    {text:'通知同事行程', priority:'low', done:false}
  ],
  meeting: [
    {text:'确认参会人员', priority:'high', done:false},
    {text:'准备会议议程', priority:'high', done:false},
    {text:'准备演示材料', priority:'high', done:false},
    {text:'预订会议室', priority:'mid', done:false},
    {text:'发送会议邀请', priority:'mid', done:false},
    {text:'准备会议纪要模板', priority:'low', done:false}
  ],
  review: [
    {text:'代码风格检查', priority:'mid', done:false},
    {text:'功能完整性验证', priority:'high', done:false},
    {text:'边界条件测试', priority:'high', done:false},
    {text:'安全性检查', priority:'high', done:false},
    {text:'性能影响评估', priority:'mid', done:false},
    {text:'文档更新', priority:'low', done:false},
    {text:'提交Review意见', priority:'mid', done:false}
  ],
  deploy: [
    {text:'代码合并到main', priority:'high', done:false},
    {text:'运行完整测试套件', priority:'high', done:false},
    {text:'更新版本号', priority:'mid', done:false},
    {text:'更新CHANGELOG', priority:'mid', done:false},
    {text:'数据库迁移执行', priority:'high', done:false},
    {text:'部署到预发布环境', priority:'high', done:false},
    {text:'预发布验证', priority:'high', done:false},
    {text:'部署到生产环境', priority:'high', done:false},
    {text:'线上验证', priority:'high', done:false},
    {text:'通知相关人员', priority:'low', done:false}
  ]
};

var items = [];

document.getElementById('templateTabs').addEventListener('click', function(e) {
  if (e.target.classList.contains('tab')) {
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    e.target.classList.add('active');
    var tpl = e.target.dataset.tpl;
    items = JSON.parse(JSON.stringify(templates[tpl]));
    renderChecklist();
  }
});

function renderChecklist() {
  var list = document.getElementById('checklist');
  list.innerHTML = '';
  items.forEach(function(item, i) {
    var li = document.createElement('li');
    li.className = item.done ? 'done' : '';
    li.innerHTML = '<input type="checkbox"' + (item.done ? ' checked' : '') + ' onchange="toggleItem(' + i + ')">' +
      '<span class="item-text">' + item.text + '</span>' +
      '<span class="item-priority priority-' + item.priority + '">' + ({high:'高',mid:'中',low:'低'})[item.priority] + '</span>' +
      '<button class="item-del" onclick="removeItem(' + i + ')">×</button>';
    list.appendChild(li);
  });
  updateStats();
}

function toggleItem(i) {
  items[i].done = !items[i].done;
  renderChecklist();
}

function removeItem(i) {
  items.splice(i, 1);
  renderChecklist();
}

function addItem() {
  var input = document.getElementById('newItem');
  var text = input.value.trim();
  if (!text) return;
  items.push({text: text, priority: document.getElementById('newPriority').value, done: false});
  input.value = '';
  renderChecklist();
}

function updateStats() {
  var total = items.length;
  var done = items.filter(function(i){ return i.done; }).length;
  document.getElementById('stats').textContent = '共 ' + total + ' 项，已完成 ' + done + ' 项';
  document.getElementById('progressFill').style.width = total ? Math.round(done/total*100) + '%' : '0%';
}

function exportText() {
  var title = document.getElementById('listTitle').value || '清单';
  var p = title + '\n';
  p += '创建时间: ' + new Date().toLocaleString('zh-CN') + '\n';
  p += '完成进度: ' + items.filter(function(i){return i.done}).length + '/' + items.length + '\n';
  p += '────────────────────────────────\n';
  items.forEach(function(item, i) {
    var check = item.done ? '[✓]' : '[ ]';
    var pri = {high:'[高]',mid:'[中]',low:'[低]'}[item.priority];
    p += check + ' ' + (i+1) + '. ' + item.text + ' ' + pri + '\n';
  });
  p += '────────────────────────────────\n';
  p += '共 ' + items.length + ' 项';

  document.getElementById('preview').textContent = p;
  document.getElementById('outputArea').style.display = 'block';
  document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });

  var blob = new Blob([p], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = title + '.txt';
  a.click();
}

function clearAll() {
  if (confirm('确定要清空所有清单项吗？')) {
    items = [];
    renderChecklist();
  }
}

renderChecklist();
</script>
</body>
</html>
