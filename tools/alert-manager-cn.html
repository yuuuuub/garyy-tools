<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告警管理工具</title>
    <meta name="description" content="用于创建和管理系统告警的工具">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
    <meta name="robots" content="index, follow">
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #e6e6e6;
            --text-secondary: #a6a6a6;
            --accent: #f44336;
            --accent-hover: #ef5350;
            --border: #2a2a4a;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        h1 { color: var(--accent); margin-bottom: 2rem; text-align: center; }
        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); }
        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 1rem;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover { background: var(--accent-hover); }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--bg-tertiary); color: var(--text-secondary); }
        .alert-card { border-left: 4px solid var(--danger); padding: 1rem; margin: 0.5rem 0; }
        .alert-critical { border-left-color: var(--danger); }
        .alert-warning { border-left-color: var(--warning); }
        .alert-info { border-left-color: var(--accent); }
    </style>
    <script src="i18n.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>告警管理</h1>
        
        <div class="card">
            <h2>创建告警规则</h2>
            <form id="alertForm">
                <div class="form-group">
                    <label>告警名称</label>
                    <input type="text" id="alertName" placeholder="CPU使用率告警" required>
                </div>
                <div class="form-group">
                    <label>条件</label>
                    <select id="condition">
                        <option value="cpu">CPU使用率 > 80%</option>
                        <option value="memory">内存使用率 > 90%</option>
                        <option value="disk">磁盘空间 < 10%</option>
                        <option value="response">响应时间 > 1000ms</option>
                        <option value="error">错误率 > 5%</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>严重程度</label>
                    <select id="severity">
                        <option value="critical">严重</option>
                        <option value="warning">警告</option>
                        <option value="info">信息</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>通知方式</label>
                    <select id="notification">
                        <option value="email">邮件</option>
                        <option value="sms">短信</option>
                        <option value="webhook">Webhook</option>
                        <option value="none">无</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="description" placeholder="告警规则描述"></textarea>
                </div>
                <button type="submit">创建告警规则</button>
            </form>
        </div>
        
        <div class="card">
            <h2>活跃告警</h2>
            <div id="activeAlerts">
                <!-- 活跃告警将在这里显示 -->
            </div>
        </div>
        
        <div class="card">
            <h2>告警历史</h2>
            <table id="alertHistoryTable">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>名称</th>
                        <th>条件</th>
                        <th>严重程度</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="alertHistoryBody">
                    <!-- 告警历史将在这里显示 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 初始化数据
        let alertRules = JSON.parse(localStorage.getItem('alertRules')) || [];
        let activeAlerts = JSON.parse(localStorage.getItem('activeAlerts')) || [];
        let alertHistory = JSON.parse(localStorage.getItem('alertHistory')) || [];
        
        // 渲染告警规则表格（未显示，但存储在localStorage）
        function renderAlertRules() {
            // 本示例中未显示告警规则表格，但规则存储在localStorage
        }
        
        // 渲染活跃告警
        function renderActiveAlerts() {
            const container = document.getElementById('activeAlerts');
            container.innerHTML = '';
            
            if (activeAlerts.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 2rem;">没有活跃告警</p>';
                return;
            }
            
            activeAlerts.forEach((alert, index) => {
                const div = document.createElement('div');
                div.className = `alert-card alert-${alert.severity}`;
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong>${alert.name}</strong>
                            <div style="color: var(--text-secondary); margin-top: 0.5rem;">
                                ${alert.condition} | ${alert.severity === 'critical' ? '严重' : alert.severity === 'warning' ? '警告' : '信息'}
                            </div>
                            <div style="margin-top: 0.5rem; font-size: 0.9rem;">触发时间：${alert.triggeredAt}</div>
                        </div>
                        <div>
                            <button onclick="resolveAlert(${index})" style="margin-right: 0.5rem; padding: 0.5rem;">解决</button>
                            <button onclick="snoozeAlert(${index})" style="background: var(--warning); padding: 0.5rem;">暂不处理</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        // 渲染告警历史
        function renderAlertHistory() {
            const tbody = document.getElementById('alertHistoryBody');
            tbody.innerHTML = '';
            
            alertHistory.slice().reverse().forEach(alert => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${alert.time}</td>
                    <td>${alert.name}</td>
                    <td>${alert.condition}</td>
                    <td>${alert.severity === 'critical' ? '严重' : alert.severity === 'warning' ? '警告' : '信息'}</td>
                    <td>${alert.status}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        // 创建告警规则
        document.getElementById('alertForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newRule = {
                name: document.getElementById('alertName').value,
                condition: document.getElementById('condition').value,
                severity: document.getElementById('severity').value,
                notification: document.getElementById('notification').value,
                description: document.getElementById('description').value,
                enabled: true
            };
            alertRules.push(newRule);
            localStorage.setItem('alertRules', JSON.stringify(alertRules));
            
            // 模拟触发告警
            simulateAlert(newRule);
            
            this.reset();
        });
        
        // 模拟触发告警
        function simulateAlert(rule) {
            const conditionText = document.getElementById('condition').options[document.getElementById('condition').selectedIndex].text;
            const newAlert = {
                name: rule.name,
                condition: conditionText,
                severity: rule.severity,
                triggeredAt: new Date().toLocaleString(),
                status: '触发中'
            };
            
            activeAlerts.push(newAlert);
            localStorage.setItem('activeAlerts', JSON.stringify(activeAlerts));
            
            // 添加到历史
            alertHistory.push({
                ...newAlert,
                time: new Date().toLocaleString(),
                status: '已触发'
            });
            localStorage.setItem('alertHistory', JSON.stringify(alertHistory));
            
            renderActiveAlerts();
            renderAlertHistory();
        }
        
        // 解决告警
        function resolveAlert(index) {
            const alert = activeAlerts[index];
            alert.status = '已解决';
            alertHistory.push({
                ...alert,
                time: new Date().toLocaleString(),
                status: '已解决'
            });
            localStorage.setItem('alertHistory', JSON.stringify(alertHistory));
            
            activeAlerts.splice(index, 1);
            localStorage.setItem('activeAlerts', JSON.stringify(activeAlerts));
            
            renderActiveAlerts();
            renderAlertHistory();
        }
        
        // 暂不处理告警
        function snoozeAlert(index) {
            alert('告警已暂不处理15分钟');
            // 在实际应用中，这里会设置定时器
        }
        
        // 初始渲染
        renderActiveAlerts();
        renderAlertHistory();
        
        // 模拟一些初始告警
        if (activeAlerts.length === 0) {
            simulateAlert({
                name: '示例告警',
                condition: 'cpu',
                severity: 'critical',
                notification: 'email',
                description: '示例告警规则'
            });
        }
    </script>
</body>
</html>
