<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>书法生成器</title><meta name="description" content="书法生成器 - 在线生成书法作品"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select,.input-group textarea{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--blue);outline:none}.input-group textarea{min-height:80px;font-family:monospace;font-size:.85rem;resize:vertical}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.calligraphy-display{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0;line-height:1.5;font-size:3rem;white-space:pre-wrap}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}.style-option{display:flex;align-items:center;gap:8px;margin:8px 0}.style-option label{display:flex;align-items:center;gap:6px;cursor:pointer}</style><meta property="og:title" content="书法生成器"><meta property="og:description" content="书法生成器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🖌️ 书法生成器</h1><p class="sub">在线生成书法作品</p>
<div class="card">
<div class="input-group">
<label>输入文字</label>
<textarea id="textInput" placeholder="输入要生成书法的文字..."></textarea>
</div>
<div class="input-group">
<label>选择书体</label>
<select id="styleSelect">
<option value="kaishu">楷书</option>
<option value="xingshu">行书</option>
<option value="caoshu">草书</option>
<option value="lishu">隶书</option>
<option value="zhuanshu">篆书</option>
</select>
</div>
<div class="input-group">
<label>字体大小</label>
<select id="sizeSelect">
<option value="small">小号</option>
<option value="medium" selected>中号</option>
<option value="large">大号</option>
<option value="xlarge">特大号</option>
</select>
</div>
<div class="input-group">
<label>文字颜色</label>
<select id="colorSelect">
<option value="#000000">黑色</option>
<option value="#8B0000">朱砂红</option>
<option value="#006400">墨绿</option>
<option value="#00008B">靛蓝</option>
<option value="#4B0082">紫色</option>
</select>
</div>
<div class="style-option">
<label><input type="checkbox" id="verticalLayout"> 竖排布局</label>
<label><input type="checkbox" id="sealStamp" checked> 添加印章</label>
</div>
<button class="btn" onclick="generateCalligraphy()">生成书法</button>
<button class="btn" onclick="randomText()">随机文字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var styleFonts={
  kaishu:'"楷体","KaiTi","STKaiti",serif',
  xingshu:'"行楷","STXingkai","华文行楷",cursive',
  caoshu:'"草书","STCaiyun","华文草书",cursive',
  lishu:'"隶书","LiSu","STLiti",serif',
  zhuanshu:'"篆书","STZhuan","方正小篆体",serif'
};
var styleNames={
  kaishu:'楷书',
  xingshu:'行书',
  caoshu:'草书',
  lishu:'隶书',
  zhuanshu:'篆书'
};
var sizeMap={
  small:'2rem',
  medium:'3rem',
  large:'4rem',
  xlarge:'5rem'
};
var randomTexts=['宁静致远','厚德载物','自强不息','上善若水','天道酬勤','海纳百川','有容乃大','大道至简','知行合一','止于至善','心如止水','虚怀若竹','临危不惧','从容不迫','宠辱不惊','去留无意','春华秋实','云淡风轻','风清云淡','淡泊明志'];
function generateCalligraphy(){
  var text=document.getElementById('textInput').value.trim();
  if(!text){
    alert('请输入文字');
    return;
  }
  var style=document.getElementById('styleSelect').value;
  var size=document.getElementById('sizeSelect').value;
  var color=document.getElementById('colorSelect').value;
  var vertical=document.getElementById('verticalLayout').checked;
  var seal=document.getElementById('sealStamp').checked;
  var displayText=vertical?text.split('').join('\n'):text;
  var html='<div class="card">';
  html+='<div class="calligraphy-display" style="font-family:'+styleFonts[style]+';font-size:'+sizeMap[size]+';color:'+color+';writing-mode:'+(vertical?'vertical-rl':'horizontal-tb')+'">'+displayText+'</div>';
  if(seal){
    html+='<div style="text-align:center;margin-top:16px">';
    html+='<div style="display:inline-block;width:60px;height:60px;border:2px solid #8B0000;border-radius:4px;padding:8px;color:#8B0000;font-size:1rem;line-height:1.2;text-align:center">印</div>';
    html+='</div>';
  }
  html+='<div style="text-align:center;margin-top:16px;color:var(--text2);font-size:.9rem">';
  html+='书体：'+styleNames[style]+' | 字数：'+text.length+'字';
  html+='</div>';
  html+='<div class="btn-group" style="margin-top:16px">';
  html+='<button class="btn" onclick="downloadCalligraphy()">下载图片</button>';
  html+='<button class="btn" onclick="copyText()">复制文字</button>';
  html+='</div></div>';
  document.getElementById('result').innerHTML=html;
}
function randomText(){
  var randomIndex=Math.floor(Math.random()*randomTexts.length);
  document.getElementById('textInput').value=randomTexts[randomIndex];
  generateCalligraphy();
}
function downloadCalligraphy(){
  var display=document.querySelector('.calligraphy-display');
  if(!display)return;
  var canvas=document.createElement('canvas');
  var ctx=canvas.getContext('2d');
  canvas.width=800;
  canvas.height=600;
  ctx.fillStyle='#f5f5f0';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle=display.style.color||'#000000';
  ctx.font=display.style.fontSize+' '+display.style.fontFamily;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  var text=document.getElementById('textInput').value;
  ctx.fillText(text,canvas.width/2,canvas.height/2);
  var link=document.createElement('a');
  link.download='calligraphy.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
}
function copyText(){
  var text=document.getElementById('textInput').value;
  if(!text)return;
  navigator.clipboard.writeText(text).then(function(){alert('已复制文字');}).catch(function(){alert('复制失败');});
}
generateCalligraphy();
</script></body></html>
