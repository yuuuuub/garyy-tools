<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌾 智慧农业</title>
<meta name="description" content="智慧农业管理系统，农田监控、作物管理、灌溉控制、产量预测">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:1100px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.stat-card .icon{font-size:1.8rem;margin-bottom:4px}
.stat-card .val{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.8rem;color:var(--text2)}
.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.field{padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.field .name{font-weight:600;font-size:.95rem;margin-bottom:6px}
.field .info{font-size:.8rem;color:var(--text2);margin-bottom:8px}
.field .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field .metric{padding:8px;background:var(--card);border-radius:6px;text-align:center}
.field .metric .val{font-size:1.1rem;font-weight:700}
.field .metric .label{font-size:.7rem;color:var(--text2)}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.fill{height:100%;border-radius:3px}
.btn{padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-size:.8rem}
.btn:hover{background:var(--accent2)}
.btn-success{background:var(--success)}.btn-warn{background:var(--warn)}.btn-danger{background:var(--danger)}.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.8rem;transition:all .2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.soil-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.soil-item{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;text-align:center;font-size:.85rem}
.soil-item .emoji{font-size:1.2rem;margin-bottom:4px}
.sensor-list{max-height:200px;overflow-y:auto}
.sensor-item{display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--border);font-size:.85rem}
.sensor-item:last-child{border-bottom:none}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:3px;transition:width .5s}
.chart-area{height:120px;background:var(--bg);border:1px solid var(--border);border-radius:8px;display:flex;align-items:flex-end;gap:3px;padding:10px}
.chart-bar{flex:1;border-radius:3px 3px 0 0;background:var(--accent);transition:height .5s;min-width:6px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🌾 智慧农业">
<meta property="og:description" content="智慧农业管理系统，农田监控、作物管理、灌溉控制、产量预测">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🌾 智慧农业</h1><p>农田监控、作物管理、灌溉控制、产量预测</p></div>

<div class="cd">
<h2>📊 环境数据</h2>
<div class="grid" id="envStats"></div>
</div>

<div class="cd">
<h2>🚜 农田管理</h2>
<div class="tabs" id="fieldTabs"></div>
<div class="field-grid" id="fieldGrid"></div>
</div>

<div class="cd">
<h2>💧 灌溉控制</h2>
<div id="irrigationPanel"></div>
</div>

<div class="cd">
<h2>🌡️ 土壤监测</h2>
<div class="soil-grid" id="soilGrid"></div>
</div>

<div class="cd">
<h2>📈 产量趋势</h2>
<div class="chart-area" id="yieldChart"></div>
</div>

<div class="cd">
<h2>📡 设备状态</h2>
<div class="sensor-list" id="sensorList"></div>
</div>
</div>

<script src="i18n.js" defer></script>
<script>
(function(){
var fields=[
  {name:'小麦田A区',crop:'小麦',area:50,stage:'灌浆期',health:85},
  {name:'水稻田B区',crop:'水稻',area:30,stage:'分蘖期',health:92},
  {name:'玉米地C区',crop:'玉米',area:40,stage:'拔节期',health:78},
  {name:'蔬菜大棚D区',crop:'蔬菜',area:5,stage:'采收期',health:95},
  {name:'果园E区',crop:'苹果',area:20,stage:'开花期',health:88},
  {name:'大豆田F区',crop:'大豆',area:25,stage:'结荚期',health:82}
];
var sensors=[
  {name:'温湿度传感器-01',type:'温湿度',value:'26.5°C / 65%',status:'正常'},
  {name:'土壤湿度传感器-01',type:'土壤湿度',value:'42%',status:'正常'},
  {name:'光照传感器-01',type:'光照强度',value:'45000 lux',status:'正常'},
  {name:'风速传感器-01',type:'风速风向',value:'3.2 m/s 东南',status:'正常'},
  {name:'雨量传感器-01',type:'降雨量',value:'0 mm',status:'正常'},
  {name:'CO2传感器-01',type:'CO2浓度',value:'420 ppm',status:'正常'},
  {name:'虫情测报灯-01',type:'虫情监测',value:'检测到蚜虫',status:'预警'},
  {name:'摄像头-01',type:'视频监控',value:'运行中',status:'正常'}
];
var currentFieldTab='全部';

function renderEnvStats(){
  var data=[
    {icon:'🌡️',val:(20+Math.random()*15).toFixed(1)+'°C',label:'平均气温'},
    {icon:'💧',val:Math.round(40+Math.random()*40)+'%',label:'平均湿度'},
    {icon:'☀️',val:Math.round(30000+Math.random()*30000)+' lux',label:'光照强度'},
    {icon:'🌬️',val:(1+Math.random()*5).toFixed(1)+' m/s',label:'风速'},
    {icon:'🌧️',val:Math.round(Math.random()*5)+' mm',label:'今日降雨'},
    {icon:'🌡️',val:(15+Math.random()*10).toFixed(1)+'°C',label:'土壤温度'}
  ];
  var h='';
  data.forEach(function(d){h+='<div class="stat-card"><div class="icon">'+d.icon+'</div><div class="val">'+d.val+'</div><div class="label">'+d.label+'</div></div>'});
  document.getElementById('envStats').innerHTML=h;
}

function renderFieldTabs(){
  var tabs=['全部','小麦','水稻','玉米','蔬菜','苹果','大豆'];
  var h='';
  tabs.forEach(function(t){h+='<div class="tab'+(t===currentFieldTab?' active':'')+'" onclick="filterField(\''+t+'\')">'+t+'</div>'});
  document.getElementById('fieldTabs').innerHTML=h;
}

window.filterField=function(t){currentFieldTab=t;renderFieldTabs();renderFields()};

function renderFields(){
  var filtered=fields.filter(function(f){return currentFieldTab==='全部'||f.crop===currentFieldTab});
  var h='';
  filtered.forEach(function(f){
    var hColor=f.health>85?'var(--success)':f.health>70?'var(--warn)':'var(--danger)';
    h+='<div class="field"><div class="name">🌾 '+f.name+'</div><div class="info">'+f.crop+' · '+f.area+'亩 · '+f.stage+'</div><div class="metrics"><div class="metric"><div class="val" style="color:'+hColor+'">'+f.health+'%</div><div class="label">健康度</div></div><div class="metric"><div class="val">'+f.area+'亩</div><div class="label">种植面积</div></div></div><div class="bar-row"><div class="bar"><div class="fill" style="width:'+f.health+'%;background:'+hColor+'"></div></div></div><div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-success" onclick="irrigate(\''+f.name+'\')">灌溉</button><button class="btn btn-warn" onclick="fertilize(\''+f.name+'\')">施肥</button><button class="btn btn-outline" onclick="detail(\''+f.name+'\')">详情</button></div></div>';
  });
  document.getElementById('fieldGrid').innerHTML=h;
}

window.irrigate=function(n){garyyToast('正在启动 '+n+' 灌溉系统','success')};
window.fertilize=function(n){garyyToast('已发送 '+n+' 施肥指令','info')};
window.detail=function(n){garyyToast('查看 '+n+' 详情','info')};

function renderIrrigation(){
  var zones=['A区灌溉','B区灌溉','C区灌溉','D区大棚','E区灌溉'];
  var h='<div class="grid">';
  zones.forEach(function(z){
    var on=Math.random()>.5;
    var soil=Math.round(30+Math.random()*40);
    h+='<div class="stat-card"><div style="font-size:1.5rem">'+(on?'💧':'⏸️')+'</div><div class="val" style="font-size:1rem">'+z+'</div><div class="label">土壤湿度 '+soil+'%</div><div style="margin-top:8px"><button class="btn '+(on?'btn-danger':'btn-success')+'" style="font-size:.75rem;padding:4px 10px" onclick="toggleIrrigation(this)">'+(on?'停止':'开启')+'</button></div></div>';
  });
  h+='</div>';
  document.getElementById('irrigationPanel').innerHTML=h;
}

window.toggleIrrigation=function(btn){
  var on=btn.textContent==='开启';
  btn.textContent=on?'停止':'开启';
  btn.className='btn '+(on?'btn-danger':'btn-success');
  garyyToast(on?'灌溉已启动':'灌溉已停止','info');
};

function renderSoil(){
  var data=[
    {emoji:'🌡️',name:'土壤温度',val:(18+Math.random()*8).toFixed(1)+'°C',pct:Math.round(50+Math.random()*30)},
    {emoji:'💧',name:'土壤湿度',val:Math.round(30+Math.random()*40)+'%',pct:Math.round(30+Math.random()*40)},
    {emoji:'⚗️',name:'pH值',val:(5.5+Math.random()*2).toFixed(1),pct:Math.round(60+Math.random()*20)},
    {emoji:'🧪',name:'氮含量',val:Math.round(20+Math.random()*30)+'mg/kg',pct:Math.round(40+Math.random()*30)},
    {emoji:'🧪',name:'磷含量',val:Math.round(10+Math.random()*20)+'mg/kg',pct:Math.round(30+Math.random()*30)},
    {emoji:'🧪',name:'钾含量',val:Math.round(30+Math.random()*40)+'mg/kg',pct:Math.round(50+Math.random()*30)}
  ];
  var h='';
  data.forEach(function(d){
    var color=d.pct>70?'var(--success)':d.pct>40?'var(--warn)':'var(--danger)';
    h+='<div class="soil-item"><div class="emoji">'+d.emoji+'</div><div style="font-weight:600">'+d.name+'</div><div style="font-size:1.1rem;font-weight:700;color:var(--accent);margin:4px 0">'+d.val+'</div><div class="progress-bar"><div class="progress-fill" style="width:'+d.pct+'%;background:'+color+'"></div></div></div>';
  });
  document.getElementById('soilGrid').innerHTML=h;
}

function renderYieldChart(){
  var h='';
  for(var i=0;i<12;i++){
    var v=30+Math.random()*70;
    h+='<div class="chart-bar" style="height:'+v+'%"></div>';
  }
  document.getElementById('yieldChart').innerHTML=h;
}

function renderSensors(){
  var h='';
  sensors.forEach(function(s){
    var badge=s.status==='正常'?'badge-success':'badge-warn';
    h+='<div class="sensor-item"><span class="badge '+(s.status==='正常'?'badge-success':'badge-warn')+'">'+s.status+'</span><span style="flex:1"><strong>'+s.name+'</strong><br><span style="font-size:.8rem;color:var(--text2)">'+s.type+' · '+s.value+'</span></span></div>';
  });
  document.getElementById('sensorList').innerHTML=h;
}

renderEnvStats();renderFieldTabs();renderFields();renderIrrigation();renderSoil();renderYieldChart();renderSensors();
setInterval(renderEnvStats,10000);
})();
</script>
</body>
</html>
