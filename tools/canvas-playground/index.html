<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas游乐场 - 在线Canvas编辑器</title>
<meta name="description" content="Canvas在线编辑器，实时编写和预览Canvas绘图代码">
<style>
:root {
--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;
}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth;}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
nav .logo{font-size:18px;font-weight:600;color:var(--accent2);}
nav a{color:var(--accent);text-decoration:none;font-size:14px;}
nav a:hover{color:var(--accent2);}
.container{display:flex;flex-direction:column;height:calc(100vh - 52px);}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s;}
.btn-primary{background:var(--success);color:var(--text);}
.btn-primary:hover{background:#46c45a;}
.btn-secondary{background:var(--border);color:var(--text);}
.btn-secondary:hover{background:#3d444d;}
.workspace{display:flex;flex:1;overflow:hidden;}
.editor-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);}
.canvas-panel{flex:1;display:flex;flex-direction:column;}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;font-size:13px;color:var(--accent2);font-weight:500;}
.editor-wrapper{flex:1;position:relative;}
#canvasEditor{width:100%;height:100%;background:var(--bg);border:none;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:13px;padding:12px;resize:none;outline:none;line-height:1.6;}
.canvas-area{flex:1;display:flex;justify-content:center;align-items:center;background:#000;padding:20px;overflow:auto;}
#canvas{background:var(--bg);border-radius:8px;}
.templates{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;}
.templates span{font-size:12px;color:#8b949e;margin-right:8px;}
.template-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--accent2);cursor:pointer;margin-right:6px;margin-bottom:4px;}
.template-btn:hover{border-color:var(--accent);color:var(--accent);}
@media(max-width:768px){
.workspace{flex-direction:column;}
.editor-panel{border-right:none;border-bottom:1px solid var(--border);}
}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Canvas游乐场 - 在线Canvas编辑器">
  <meta property="og:description" content="Canvas在线编辑器，实时编写和预览Canvas绘图代码">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/canvas-playground/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<h1 style="text-align:center;padding:20px 0;font-size:1.5rem">Canvas游乐场 - 在线Canvas编辑器</h1>
<nav>
<span class="logo">Canvas游乐场</span>
<a href="/index.html">← 返回工具箱</a>
</nav>
<div class="container">
<div class="toolbar">
<button class="btn btn-primary" onclick="runCode()">▶ 运行</button>
<button class="btn btn-secondary" onclick="downloadCanvas()">下载图片</button>
<button class="btn btn-secondary" onclick="copyCode()">复制代码</button>
<button class="btn btn-secondary" onclick="resetCode()">重置</button>
</div>
<div class="templates">
<span>模板:</span>
<button class="template-btn" data-code="// 绘制渐变矩形\nconst gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);\ngradient.addColorStop(0, '#3b82f6');\ngradient.addColorStop(1, '#8b5cf6');\nctx.fillStyle = gradient;\nctx.fillRect(50, 50, 300, 200);">渐变矩形</button>
<button class="template-btn" data-code="// 绘制粒子效果\nconst particles = [];\nfor (let i = 0; i < 100; i++) {\n  particles.push({\n    x: Math.random() * canvas.width,\n    y: Math.random() * canvas.height,\n    r: Math.random() * 5 + 1,\n    vx: (Math.random() - 0.5) * 2,\n    vy: (Math.random() - 0.5) * 2,\n    color: `hsl(${Math.random() * 360}, 70%, 60%)`\n  });\n}\n\nfunction animate() {\n  ctx.fillStyle = 'rgba(0,0,0,0.1)';\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n  particles.forEach(p => {\n    ctx.beginPath();\n    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);\n    ctx.fillStyle = p.color;\n    ctx.fill();\n    p.x += p.vx;\n    p.y += p.vy;\n    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;\n    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;\n  });\n  requestAnimationFrame(animate);\n}\nanimate();">粒子动画</button>
<button class="template-btn" data-code="// 绘制几何图形组合\nctx.strokeStyle = '#3b82f6';\nctx.lineWidth = 2;\n\n// 圆形\nctx.beginPath();\nctx.arc(100, 100, 50, 0, Math.PI * 2);\nctx.stroke();\n\n// 三角形\nctx.beginPath();\nctx.moveTo(250, 50);\nctx.lineTo(200, 150);\nctx.lineTo(300, 150);\nctx.closePath();\nctx.stroke();\n\n// 矩形\nctx.strokeRect(350, 50, 100, 100);">几何图形</button>
<button class="template-btn" data-code="// 绘制时钟\nfunction drawClock() {\n  const now = new Date();\n  const hours = now.getHours() % 12;\n  const minutes = now.getMinutes();\n  const seconds = now.getSeconds();\n  \n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n  \n  // 表盘\n  ctx.beginPath();\n  ctx.arc(200, 200, 150, 0, Math.PI * 2);\n  ctx.strokeStyle = '#3b82f6';\n  ctx.lineWidth = 3;\n  ctx.stroke();\n  \n  // 时针\n  const hourAngle = (hours + minutes / 60) * Math.PI / 6 - Math.PI / 2;\n  ctx.beginPath();\n  ctx.moveTo(200, 200);\n  ctx.lineTo(200 + Math.cos(hourAngle) * 80, 200 + Math.sin(hourAngle) * 80);\n  ctx.strokeStyle = '#e6edf3';\n  ctx.lineWidth = 4;\n  ctx.stroke();\n  \n  // 分针\n  const minAngle = (minutes + seconds / 60) * Math.PI / 30 - Math.PI / 2;\n  ctx.beginPath();\n  ctx.moveTo(200, 200);\n  ctx.lineTo(200 + Math.cos(minAngle) * 120, 200 + Math.sin(minAngle) * 120);\n  ctx.strokeStyle = '#e6edf3';\n  ctx.lineWidth = 2;\n  ctx.stroke();\n  \n  // 秒针\n  const secAngle = seconds * Math.PI / 30 - Math.PI / 2;\n  ctx.beginPath();\n  ctx.moveTo(200, 200);\n  ctx.lineTo(200 + Math.cos(secAngle) * 140, 200 + Math.sin(secAngle) * 140);\n  ctx.strokeStyle = '#f85149';\n  ctx.lineWidth = 1;\n  ctx.stroke();\n  \n  requestAnimationFrame(drawClock);\n}\ndrawClock();">时钟动画</button>
</div>
<div class="workspace">
<div class="editor-panel">
<div class="panel-header">Canvas代码</div>
<div class="editor-wrapper">
<textarea id="canvasEditor">// 获取canvas和ctx
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// 设置canvas大小
canvas.width = 400;
canvas.height = 400;

// 清空画布
ctx.clearRect(0, 0, canvas.width, canvas.height);

// 绘制渐变背景
const gradient = ctx.createRadialGradient(200, 200, 0, 200, 200, 200);
gradient.addColorStop(0, '#3b82f6');
gradient.addColorStop(1, '#1e40af');
ctx.fillStyle = gradient;
ctx.fillRect(0, 0, canvas.width, canvas.height);

// 绘制文字
ctx.fillStyle = '#ffffff';
ctx.font = 'bold 48px Arial';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('Canvas', 200, 180);

// 绘制装饰圆
ctx.beginPath();
ctx.arc(200, 260, 40, 0, Math.PI * 2);
ctx.fillStyle = 'rgba(255,255,255,0.3)';
ctx.fill();</textarea>
</div>
</div>
<div class="canvas-panel">
<div class="panel-header">画布预览</div>
<div class="canvas-area">
<canvas id="canvas" width="400" height="400"></canvas>
</div>
</div>
</div>
</div>
<script>
const canvasEditor=document.getElementById('canvasEditor');
const canvas=document.getElementById('canvas');
function runCode(){
try{
(new Function(canvasEditor.value))();
}catch(e){
garyyToast('代码错误: '+e.message);
}
}
function downloadCanvas(){
const link=document.createElement('a');
link.download='canvas.png';
link.href=canvas.toDataURL();
link.click();
}
function copyCode(){
navigator.clipboard.writeText(canvasEditor.value).then(()=>garyyToast('代码已复制到剪贴板'));
}
function resetCode(){
canvasEditor.value='
runCode();
}
document.querySelectorAll('.template-btn').forEach(btn=>{
btn.onclick=()=>{
canvasEditor.value=btn.dataset.code;
runCode();
};
});
runCode();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
