<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖼️ 水印去除工具</title>
<meta name="description" content="水印去除工具，智能去除图片水印，还你纯净图片">
<style>
:root{--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s}
.upload-area:hover{border-color:var(--accent);background:var(--tag-bg)}
.upload-area.dragover{border-color:var(--accent);background:var(--tag-bg)}
.upload-icon{font-size:48px;margin-bottom:8px}
.upload-text{font-size:14px;color:var(--text-secondary)}
.upload-hint{font-size:12px;color:var(--text-secondary);margin-top:4px}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px;font-weight:500}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type="range"]{flex:1}
.slider-row span{font-size:13px;color:var(--text-secondary);min-width:36px;text-align:right}
.canvas-wrap{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#000;display:flex;justify-content:center;position:relative;cursor:crosshair}
.canvas-wrap canvas{width:100%;height:auto}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
.info-bar{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-top:8px}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🖼️ 水印去除工具">
<meta property="og:description" content="水印去除工具，智能去除图片水印，还你纯净图片">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/watermark-remover-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🖼️ 水印去除工具</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card" id="uploadCard">
    <div class="card-title">📤 上传图片</div>
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📁</div>
      <div class="upload-text">点击或拖拽上传图片</div>
      <div class="upload-hint">支持 JPG、PNG、WebP 格式</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="card hidden" id="editorCard">
    <div class="card-title">🖌️ 涂抹水印区域</div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="editor" width="800" height="600"></canvas>
    </div>
    <div class="info-bar">
      <span id="imgInfo">图片信息</span>
      <span id="modeInfo">涂抹模式</span>
    </div>
    <div class="input-group" style="margin-top:12px">
      <label>画笔大小</label>
      <div class="slider-row">
        <input type="range" id="brushSize" min="5" max="100" value="30">
        <span id="brushSizeVal">30px</span>
      </div>
    </div>
    <div class="input-group">
      <label>修复强度</label>
      <div class="slider-row">
        <input type="range" id="strength" min="1" max="10" value="5">
        <span id="strengthVal">5</span>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="removeBtn">✨ 去除水印</button>
      <button class="btn btn-outline" id="undoBtn">↩️ 撤销</button>
      <button class="btn btn-danger" id="resetBtn">🗑️ 重置</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="downloadBtn">💾 下载图片</button>
    </div>
  </div>

  <footer>© 2025 Gary's Tools | garyy.top</footer>
</div>
<div class="toast" id="toast"></div>

<script>
function toggleTheme(){var h=document.documentElement;var t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('garyy_theme',t)}
(function(){var s=localStorage.getItem('garyy_theme');if(s==='dark'){document.documentElement.setAttribute('data-theme','dark');document.querySelector('.theme-toggle').textContent='☀️'}})();

var canvas=document.getElementById('editor'),ctx=canvas.getContext('2d');
var origImg=null,history=[],isDrawing=false,maskData=null;

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

document.getElementById('uploadArea').addEventListener('click',function(){document.getElementById('fileInput').click()});
document.getElementById('uploadArea').addEventListener('dragover',function(e){e.preventDefault();this.classList.add('dragover')});
document.getElementById('uploadArea').addEventListener('dragleave',function(){this.classList.remove('dragover')});
document.getElementById('uploadArea').addEventListener('drop',function(e){e.preventDefault();this.classList.remove('dragover');if(e.dataTransfer.files.length)loadFile(e.dataTransfer.files[0])});
document.getElementById('fileInput').addEventListener('change',function(){if(this.files.length)loadFile(this.files[0])});

function loadFile(file){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      origImg=img;
      var maxW=800,ratio=1;
      if(img.width>maxW)ratio=maxW/img.width;
      canvas.width=Math.floor(img.width*ratio);
      canvas.height=Math.floor(img.height*ratio);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      maskData=ctx.createImageData(canvas.width,canvas.height);
      history=[];
      saveHistory();
      document.getElementById('uploadCard').classList.add('hidden');
      document.getElementById('editorCard').classList.remove('hidden');
      document.getElementById('imgInfo').textContent=img.width+'×'+img.height+' → '+canvas.width+'×'+canvas.height;
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveHistory(){history.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(history.length>20)history.shift()}

function getCanvasPos(e){
  var r=canvas.getBoundingClientRect();
  var scaleX=canvas.width/r.width,scaleY=canvas.height/r.height;
  var clientX=e.touches?e.touches[0].clientX:e.clientX;
  var clientY=e.touches?e.touches[0].clientY:e.clientY;
  return{x:(clientX-r.left)*scaleX,y:(clientY-r.top)*scaleY};
}

canvas.addEventListener('mousedown',startDraw);canvas.addEventListener('mousemove',draw);canvas.addEventListener('mouseup',endDraw);
canvas.addEventListener('touchstart',function(e){e.preventDefault();startDraw(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();draw(e)},{passive:false});
canvas.addEventListener('touchend',endDraw);

function startDraw(e){isDrawing=true;draw(e)}
function draw(e){
  if(!isDrawing)return;
  var pos=getCanvasPos(e),size=parseInt(document.getElementById('brushSize').value);
  ctx.fillStyle='rgba(255,0,0,0.4)';
  ctx.beginPath();ctx.arc(pos.x,pos.y,size/2,0,Math.PI*2);ctx.fill();
}
function endDraw(){isDrawing=false}

document.getElementById('brushSize').addEventListener('input',function(){document.getElementById('brushSizeVal').textContent=this.value+'px'});
document.getElementById('strength').addEventListener('input',function(){document.getElementById('strengthVal').textContent=this.value});

document.getElementById('removeBtn').addEventListener('click',function(){
  var strength=parseInt(document.getElementById('strength').value);
  var imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
  var d=imgData.data;
  var maskCanvas=document.createElement('canvas');
  maskCanvas.width=canvas.width;maskCanvas.height=canvas.height;
  var maskCtx=maskCanvas.getContext('2d');
  maskCtx.drawImage(canvas,0,0);
  var maskD=maskCtx.getImageData(0,0,canvas.width,canvas.height).data;
  var w=canvas.width,h=canvas.height;
  for(var y=0;y<h;y++){
    for(var x=0;x<w;x++){
      var i=(y*w+x)*4;
      if(maskD[i]>150&&maskD[i+1]<100&&maskD[i+2]<100){
        var rSum=0,gSum=0,bSum=0,count=0;
        for(var dy=-strength;dy<=strength;dy++){
          for(var dx=-strength;dx<=strength;dx++){
            var nx=x+dx,ny=y+dy;
            if(nx>=0&&nx<w&&ny>=0&&ny<h){
              var ni=(ny*w+nx)*4;
              if(!(maskD[ni]>150&&maskD[ni+1]<100&&maskD[ni+2]<100)){
                rSum+=d[ni];gSum+=d[ni+1];bSum+=d[ni+2];count++;
              }
            }
          }
        }
        if(count>0){
          d[i]=rSum/count;d[i+1]=gSum/count;d[i+2]=bSum/count;
        }
      }
    }
  }
  ctx.putImageData(imgData,0,0);
  saveHistory();
  showToast('✅ 水印已去除');
});

document.getElementById('undoBtn').addEventListener('click',function(){
  if(history.length>1){history.pop();ctx.putImageData(history[history.length-1],0,0);showToast('↩️ 已撤销')}
  else{showToast('没有更多撤销步骤')}
});

document.getElementById('resetBtn').addEventListener('click',function(){
  if(origImg){ctx.drawImage(origImg,0,0,canvas.width,canvas.height);history=[];saveHistory();showToast('🗑️ 已重置')}
});

document.getElementById('downloadBtn').addEventListener('click',function(){
  var link=document.createElement('a');link.download='removed-watermark-'+Date.now()+'.png';link.href=canvas.toDataURL('image/png');link.click();
  showToast('✅ 已下载图片');
});
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:.8;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=.8">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
