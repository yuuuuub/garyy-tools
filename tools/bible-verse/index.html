<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圣经金句</title>
<meta name="description" content="圣经金句每日精选，阅读激励人心的圣经经文">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16pxscroll-behavior:smooth;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem}.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.verse-card{margin-top:30px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:40px 32px;text-align:center}
.cross-icon{font-size:2.5rem;margin-bottom:12px}
.verse-text{font-size:1.2rem;line-height:1.8;color:var(--text);font-style:italic;margin-bottom:16px}
.verse-ref{font-size:.9rem;color:var(--gold);font-weight:600}
.next-btn{display:block;margin:24px auto 0;padding:12px 32px;background:var(--blue);border:none;border-radius:10px;color:var(--text);cursor:pointer;font-size:.9rem;transition:.2s}
.next-btn:hover{opacity:.9}
.filter-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.filter-btn{padding:6px 14px;background:var(--card);border:1px solid var(--border);border-radius:16px;color:var(--text2);cursor:pointer;font-size:.8rem;transition:.2s}
.filter-btn.active{background:var(--blue);color:var(--text);border-color:var(--blue)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="圣经金句">
  <meta property="og:description" content="圣经金句每日精选，阅读激励人心的圣经经文">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/bible-verse/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>✝️ 圣经金句</h1><p class="sub">经典经文 · 每日灵修</p></header>
<div class="filter-bar" id="filterBar"></div>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var verses=[
{t:'神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，反得永生。',r:'约翰福音 3:16',b:'新约'},
{t:'你要专心仰赖耶和华，不可倚靠自己的聪明。',r:'箴言 3:5',b:'旧约'},
{t:'我靠着那加给我力量的，凡事都能做。',r:'腓立比书 4:13',b:'新约'},
{t:'耶和华是我的牧者，我必不至缺乏。',r:'诗篇 23:1',b:'旧约'},
{t:'你们要将一切的忧虑卸给神，因为他顾念你们。',r:'彼得前书 5:7',b:'新约'},
{t:'应当一无挂虑，只要凡事借着祷告、祈求和感谢，将你们所要的告诉神。',r:'腓立比书 4:6',b:'新约'},
{t:'我留下平安给你们，我将我的平安赐给你们。',r:'约翰福音 14:27',b:'新约'},
{t:'神是我们的避难所，是我们的力量，是我们在患难中随时的帮助。',r:'诗篇 46:1',b:'旧约'},
{t:'耶和华必在你前面行，他必与你同在，必不撇下你，也不丢弃你。',r:'申命记 31:8',b:'旧约'},
{t:'不要惧怕，因为我与你同在。',r:'以赛亚书 41:10',b:'旧约'},
{t:'万事都互相效力，叫爱神的人得益处。',r:'罗马书 8:28',b:'新约'},
{t:'你们祈求，就给你们；寻找，就寻见；叩门，就给你们开门。',r:'马太福音 7:7',b:'新约'},
{t:'爱是恒久忍耐，又有恩慈。',r:'哥林多前书 13:4',b:'新约'},
{t:'如今常存的有信，有望，有爱，这三样，其中最大的是爱。',r:'哥林多前书 13:13',b:'新约'},
{t:'你的话是我脚前的灯，是我路上的光。',r:'诗篇 119:105',b:'旧约'},
{t:'喜乐的心乃是良药；忧伤的灵使骨枯干。',r:'箴言 17:22',b:'旧约'},
{t:'Fear not, for I am with you.',r:'Isaiah 41:10',b:'旧约'},
{t:'The Lord is my shepherd; I shall not want.',r:'Psalm 23:1',b:'旧约'},
{t:'For God so loved the world...',r:'John 3:16',b:'新约'},
{t:'I can do all things through Christ who strengthens me.',r:'Philippians 4:13',b:'新约'},
{t:'Trust in the Lord with all your heart.',r:'Proverbs 3:5',b:'旧约'},
{t:'Be anxious for nothing.',r:'Philippians 4:6',b:'新约'},
{t:'The Lord is my light and my salvation.',r:'Psalm 27:1',b:'旧约'},
{t:'He who began a good work in you will carry it on to completion.',r:'Philippians 1:6',b:'新约'},
{t:'The joy of the Lord is your strength.',r:'Nehemiah 8:10',b:'旧约'},
{t:'Come to me, all you who are weary and burdened.',r:'Matthew 11:28',b:'新约'},
{t:'Be strong and courageous.',r:'Joshua 1:9',b:'旧约'},
{t:'And we know that in all things God works for the good.',r:'Romans 8:28',b:'新约'},
{t:'The peace of God, which transcends all understanding.',r:'Philippians 4:7',b:'新约'},
{t:'Your word is a lamp for my feet.',r:'Psalm 119:105',b:'旧约'}
];
var categories=['全部','新约','旧约'];
var currentCat='全部';
function renderFilter(){
var html='';
categories.forEach(function(c){
html+='<button class="filter-btn'+(c===currentCat?' active':'')+'" onclick="filterVerse(\''+c+'\')">'+c+'</button>';
});
document.getElementById('filterBar').innerHTML=html;
}
window.filterVerse=function(cat){currentCat=cat;renderFilter();loadVerse();};
function loadVerse(){
var filtered=verses.filter(function(v){return currentCat==='全部'||v.b===currentCat;});
var data=filtered[Math.floor(Math.random()*filtered.length)];
var html='<div class="verse-card">';
html+='<div class="cross-icon">✝️</div>';
html+='<div class="verse-text">"'+data.t+'"</div>';
html+='<div class="verse-ref">— '+data.r+'</div>';
html+='</div>';
html+='<button class="next-btn" onclick="loadVerse()">🔄 换一节</button>';
document.getElementById('app').innerHTML=html;
}
window.loadVerse=loadVerse;
renderFilter();
loadVerse();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
