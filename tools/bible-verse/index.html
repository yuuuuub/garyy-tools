<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圣经金句</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;color:var(--text)}
.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.loading{text-align:center;padding:60px 0}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:.85rem}
.error{text-align:center;padding:40px 0;color:var(--red);font-size:.9rem}
.retry-btn{margin-top:10px;padding:8px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.85rem}
.verse-card{margin-top:30px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:40px 32px;text-align:center;position:relative}
.cross-icon{font-size:2.5rem;margin-bottom:12px}
.verse-text{font-size:1.2rem;line-height:1.8;color:var(--text);font-style:italic;margin-bottom:16px}
.verse-ref{font-size:.9rem;color:var(--gold);font-weight:600}
.verse-translation{font-size:.78rem;color:var(--text2);margin-top:6px}
.next-btn{display:block;margin:24px auto 0;padding:12px 32px;background:var(--blue);border:none;border-radius:var(--radius);color:#fff;cursor:pointer;font-size:.9rem;transition:.2s}
.next-btn:hover{opacity:.9}
</style>
</head>
<body>
<div class="container">
<header>
<h1>✝️ 圣经金句</h1>
<p class="sub">Bible API · 随机经文</p>
</header>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
function loadVerse(){
app.innerHTML='<div class="loading"><div class="spinner"></div><p>获取经文...</p></div>';
fetch('https://bible-api.com/?random=verse')
.then(function(r){if(!r.ok)throw new Error('请求失败 ('+r.status+')');return r.json();})
.then(function(data){
var text=data.text||'';
var ref=data.reference||'';
var translation=data.translation_name||data.translation||'';
var html='<div class="verse-card">';
html+='<div class="cross-icon">✝️</div>';
html+='<div class="verse-text">"'+text+'"</div>';
html+='<div class="verse-ref">— '+ref+'</div>';
if(translation)html+='<div class="verse-translation">'+translation+'</div>';
html+='</div>';
html+='<button class="next-btn" onclick="loadVerse()">🔄 换一节</button>';
app.innerHTML=html;
})
.catch(function(e){
app.innerHTML='<div class="error"><p>⚠️ '+e.message+'</p><button class="retry-btn" onclick="loadVerse()">重试</button></div>';
});
}
window.loadVerse=loadVerse;
loadVerse();
})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
