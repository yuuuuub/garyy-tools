<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宠物名字生成器</title><meta name="description" content="为你的宠物生成可爱又好听的中文名字"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#f59e0b}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:20px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.btn:hover{opacity:.85}.btn-secondary{background:var(--border);color:var(--text)}.options{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.options label{display:flex;align-items:center;gap:4px;font-size:.85rem;color:var(--text2);cursor:pointer}.options select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem}.result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center;margin-top:16px}.name-display{font-size:2rem;font-weight:700;color:var(--accent);margin:12px 0}.name-meaning{color:var(--text2);font-size:.9rem;line-height:1.6}.name-tags{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}.name-tag{padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:.75rem;color:var(--text2)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:16px}.grid-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:transform .2s}.grid-item:hover{transform:translateY(-2px)}.grid-name{font-size:1.3rem;font-weight:700;color:var(--accent)}.grid-meaning{font-size:.8rem;color:var(--text2);margin-top:4px}.actions{display:flex;gap:8px;justify-content:center;margin-top:16px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}</style><meta name="robots" content="index, follow"><meta property="og:title" content="宠物名字生成器"><meta property="og:description" content="为你的宠物生成可爱又好听的中文名字"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🐾 宠物名字生成器</h1><p class="sub">为你的爱宠取一个好听的名字</p>
<div class="card">
<div class="options">
<select id="petType"><option value="cat">🐱 猫咪</option><option value="dog">🐶 狗狗</option><option value="rabbit">🐰 兔子</option><option value="fish">🐟 鱼</option><option value="bird">🐦 鸟</option><option value="hamster">🐹 仓鼠</option></select>
<select id="gender"><option value="male">♂ 公</option><option value="female">♀ 母</option><option value="any">不限</option></select>
<select id="style"><option value="cute">可爱</option><option value="cool">帅气</option><option value="funny">搞笑</option><option value="elegant">优雅</option><option value="lucky">吉祥</option></select>
</div>
<div class="actions">
<button class="btn" onclick="generate()">🎲 生成名字</button>
<button class="btn btn-secondary" onclick="generateBatch()">📋 批量生成</button>
</div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
(function(){
var data={
cat:{cute:['咪咪','豆豆','团子','糯米','布丁','雪球','棉花','汤圆','奶茶','麻薯','包子','柚子','芒果','丸子','花卷'],cool:['黑豹','影子','闪电','酷酷','大侠','将军','忍者','暗夜','风速','流星'],funny:['二哈','肥肥','懒懒','憨憨','胖虎','猪猪','咕噜','嘎嘎','墩墩','嘎嘣'],elegant:['白雪','月光','玉珠','珍珠','琥珀','翡翠','锦绣','紫檀','墨玉','琉璃'],lucky:['福福','旺旺','来福','吉祥','如意','元宝','锦鲤','大吉','旺仔','金宝']},
dog:{cute:['旺财','豆豆','球球','毛毛','乐乐','欢欢','来福','小白','大黄','花花','糖糖','跳跳','贝贝','妞妞','圆圆'],cool:['黑旋风','雷霆','猎豹','闪电','战神','大将军','猛虎','飓风','钢炮','铁锤'],funny:['二狗子','铁蛋','翠花','狗蛋','大聪明','憨憨','铁柱','二愣子','笨笨','哈士奇'],elegant:['白雪','王子','伯爵','公主','爵士','贵族','珍珠','优雅','淑女','绅士'],lucky:['旺旺','来福','福星','招财','进宝','金旺','鸿运','大吉','利利','鑫鑫']},
rabbit:{cute:['团子','雪球','棉花','汤圆','布丁','白兔','乖乖','蹦蹦','跳跳','萌萌','圆圆','泡泡','珍珠','露露','棉花糖'],cool:['闪电','旋风','小白龙','雪豹','银狐','闪电侠','飞毛腿','风驰','流星','子弹'],funny:['兔八哥','蹦蹦跳','胡萝卜','小短腿','弹弹','嘟嘟','哈哈','嘎嘎','咕咕','哒哒'],elegant:['月光','雪绒','银丝','白露','霜降','玉兔','冰晶','银河','星光','珍珠'],lucky:['福兔','瑞兔','玉兔','吉祥','如意','元宝','旺财','来福','金兔','锦鲤']},
fish:{cute:['泡泡','小金','豆豆','球球','花花','星星','亮亮','彩虹','果果','嘟嘟','珍珠','糖糖','圆圆','月月','晶晶'],cool:['龙王','风暴','闪电','旋风','勇士','战神','黑曜','银刃','暗影','烈焰'],funny:['鱼摸摸','水泡泡','咕噜噜','嘟嘟鱼','翻翻','摇摇','晃晃','躺躺','摸鱼','咸鱼'],elegant:['锦鲤','金鳞','玉龙','碧波','清涟','月影','星河','翡翠','白玉','墨龙'],lucky:['锦鲤','旺财','来福','金玉','元宝','福星','鸿运','大吉','招财','如意']},
bird:{cute:['叽叽','喳喳','啾啾','小黄','豆豆','毛毛','乐乐','圆圆','花花','球球','甜甜','乖乖','跳跳','飞飞','嘟嘟'],cool:['雄鹰','猎隼','风暴','雷电','苍穹','天狼','星辰','飞羽','银翼','苍鹰'],funny:['八哥','话唠','学舌','嘎嘎','哈哈','嘻嘻','叨叨','碎碎','皮皮','闹闹'],elegant:['翠羽','金翅','白鹭','仙鹤','云雀','画眉','夜莺','紫燕','青鸾','凤凰'],lucky:['喜鹊','锦凤','金雀','祥鸟','瑞鸟','福燕','吉祥','如意','鸿运','百灵']},
hamster:{cute:['仓仓','布丁','棉花','豆豆','球球','奶茶','麻薯','团子','花卷','小圆','嘟嘟','泡泡','露露','糖糖','芒果'],cool:['忍者','大侠','闪电','旋风','勇士','铠甲','钢牙','铁锤','黑风','猛将'],funny:['仓鼠侠','嘟嘟嘴','小胖墩','圆滚滚','毛球球','憨憨','咕噜','嘎嘎','墩墩','哈哈'],elegant:['雪绒','银丝','月光','珍珠','琥珀','翡翠','白玉','冰晶','星光','琉璃'],lucky:['福福','旺旺','来福','元宝','金宝','锦鲤','大吉','如意','吉祥','鸿运']}
};
function generate(){
var type=document.getElementById('petType').value;
var gender=document.getElementById('gender').value;
var style=document.getElementById('style').value;
var names=data[type][style];
var name=names[Math.floor(Math.random()*names.length)];
var meanings={cute:'可爱温馨，适合软萌的小宝贝',cool:'帅气拉风，彰显个性',funny:'搞笑有趣，让人捧腹',elegant:'优雅高贵，气质出众',lucky:'吉祥如意，带来好运'};
var tags=['cat','dog','rabbit','fish','bird','hamster'].includes(type)?
['🐱猫','🐶狗','🐰兔','🐟鱼','🐦鸟','🐹仓鼠'][['cat','dog','rabbit','fish','bird','hamster'].indexOf(type)]:type;
document.getElementById('result').innerHTML='<div class="result-card"><div class="name-display">'+name+'</div><div class="name-meaning">'+meanings[style]+'</div><div class="name-tags"><span class="name-tag">'+tags+'</span><span class="name-tag">'+style+'</span><span class="name-tag">'+(gender==='male'?'♂公':gender==='female'?'♀母':'不限')+'</span></div></div>';
}
function generateBatch(){
var type=document.getElementById('petType').value;
var style=document.getElementById('style').value;
var names=data[type][style];
var shuffled=names.slice().sort(function(){return Math.random()-0.5}).slice(0,6);
var html='<div class="grid">';
shuffled.forEach(function(name){
html+='<div class="grid-item" onclick="selectName(this,\''+name+'\')"><div class="grid-name">'+name+'</div></div>';
});
html+='</div>';
document.getElementById('result').innerHTML=html;
}
window.selectName=function(el,name){
document.getElementById('result').innerHTML='<div class="result-card"><div class="name-display">'+name+'</div><div class="name-meaning">已选择此名字！复制给你的爱宠吧 ❤️</div></div>';
};
})();
</script></body></html>
