<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 目标追踪专业版</title>
<meta property="og:title" content="🏆 目标追踪专业版">
<meta property="og:description" content="🏆 目标追踪专业版 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="专业目标追踪器，支持目标分解、里程碑、进度可视化、数据分析">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px}
.ctn{max-width:700px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.li{padding:14px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text)}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.empty{text-align:center;padding:40px;color:var(--text2)}
.progress-bar{height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin-top:8px}.progress-fill{height:100%;border-radius:5px;transition:width .5s}
.milestone{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--bg);margin-top:6px;font-size:.85rem}
.milestone .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}.milestone.done .dot{background:var(--success);border-color:var(--success)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}.stat-card .num{font-size:1.8rem;font-weight:700;color:var(--accent)}.stat-card .lbl{font-size:.8rem;color:var(--text2);margin-top:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏆 目标追踪专业版</h1><p>设定目标，分解任务，逐步达成</p></div>

<div class="cd"><h2>创建目标</h2>
<label>目标名称</label><input type="text" id="gN" placeholder="如：减肥10斤、读完12本书">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label>类别</label><select id="gC"><option>健康</option><option>学习</option><option>工作</option><option>财务</option><option>生活</option><option>其他</option></select></div>
<div><label>优先级</label><select id="gP"><option>高</option><option>中</option><option>低</option></select></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label>开始日期</label><input type="date" id="gS"></div>
<div><label>截止日期</label><input type="date" id="gE"></div>
</div>
<label>目标描述</label><textarea id="gD" rows="2" placeholder="详细描述你的目标"></textarea>
<label>里程碑（每行一个）</label><textarea id="gM" rows="3" placeholder="第一周：制定计划&#10;第一个月：完成50%&#10;第三个月：全部完成"></textarea>
<div class="bg"><button onclick="addGoal()">创建目标</button></div></div>

<div class="cd"><h2>📊 概览</h2><div class="stats-grid" id="overview"></div></div>

<div class="cd"><h2>🎯 进行中的目标</h2><div id="activeGoals" class="empty">暂无目标</div></div>
<div class="cd"><h2>✅ 已完成的目标</h2><div id="doneGoals" class="empty">暂无已完成目标</div></div>
</div>

<div style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;justify-content:center;align-items:center" id="detailModal">
<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto" id="detailContent"></div>
</div>

<script>
const $=id=>document.getElementById(id);
let goals=JSON.parse(localStorage.getItem('gtp_goals')||'[]');
const today=()=>new Date().toISOString().slice(0,10);
const save=()=>localStorage.setItem('gtp_goals',JSON.stringify(goals));
$('gS').value=today();

function addGoal(){
  const n=$('gN').value.trim();if(!n){alert('请输入目标名称');return}
  const ms=$('gM').value.trim().split('\n').filter(Boolean).map(m=>({text:m.trim(),done:false}));
  goals.push({name:n,cat:$('gC').value,priority:$('gP').value,start:$('gS').value,end:$('gE').value,desc:$('gD').value,milestones:ms,progress:0,done:false,created:today()});
  save();$('gN').value='';$('gD').value='';$('gM').value='';render();
}

function render(){
  const active=goals.filter(g=>!g.done);const done=goals.filter(g=>g.done);
  const totalGoals=goals.length;const doneCount=done.length;const avgProgress=active.length?Math.round(active.reduce((s,g)=>s+g.progress,0)/active.length):0;
  $('overview').innerHTML=`
    <div class="stat-card"><div class="num">${totalGoals}</div><div class="lbl">总目标</div></div>
    <div class="stat-card"><div class="num">${active.length}</div><div class="lbl">进行中</div></div>
    <div class="stat-card"><div class="num">${doneCount}</div><div class="lbl">已完成</div></div>
    <div class="stat-card"><div class="num">${avgProgress}%</div><div class="lbl">平均进度</div></div>`;

  let aHtml='';active.forEach((g,i)=>{
    const pri=g.priority==='高'?'d':g.priority==='中'?'w':'s';
    const msDone=g.milestones?g.milestones.filter(m=>m.done).length:0;const msTotal=g.milestones?g.milestones.length:0;
    const daysLeft=g.end?Math.max(0,Math.ceil((new Date(g.end)-new Date())/(86400000))):null;
    aHtml+=`<div class="li" style="cursor:pointer" onclick="showDetail(${goals.indexOf(g)})">
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div><div style="font-weight:600;font-size:1.05rem">${g.name}</div>
        <div style="font-size:.8rem;color:var(--text2);margin-top:2px"><span class="tag ${pri}">${g.priority}</span> ${g.cat} ${daysLeft!==null?`· 剩余${daysLeft}天`:''}</div></div>
        <span style="font-weight:700;color:var(--accent)">${g.progress}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${g.progress}%;background:${g.progress>=100?'var(--success)':'var(--accent)'}"></div></div>
      ${msTotal?`<div style="font-size:.8rem;color:var(--text2);margin-top:6px">里程碑 ${msDone}/${msTotal}</div>`:''}
    </div>`;
  });$('activeGoals').innerHTML=aHtml||'<div class="empty">暂无进行中的目标</div>';

  let dHtml='';done.forEach((g,i)=>{
    dHtml+=`<div class="li"><div style="font-weight:600;text-decoration:line-through;opacity:.6">${g.name}</div>
    <div style="font-size:.8rem;color:var(--text2)">${g.cat} · 完成于 ${g.doneDate||'未知'}</div></div>`;
  });$('doneGoals').innerHTML=dHtml||'<div class="empty">暂无已完成目标</div>';
}

function showDetail(i){
  const g=goals[i];let msHtml='';
  if(g.milestones&&g.milestones.length){
    g.milestones.forEach((m,mi)=>{
      msHtml+=`<div class="milestone ${m.done?'done':''}" onclick="toggleMs(${i},${mi})" style="cursor:pointer">
        <div class="dot"></div><span>${m.text}</span></div>`;
    });
  }
  $('detailContent').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:start">
      <h3 style="font-size:1.2rem">${g.name}</h3>
      <button class="sec" onclick="closeDetail()" style="padding:4px 8px;font-size:.8rem">✕</button>
    </div>
    <div style="margin-top:8px;font-size:.9rem;color:var(--text2)">${g.desc||'无描述'}</div>
    <div style="margin-top:8px"><span class="tag ${g.priority==='高'?'d':g.priority==='中'?'w':'s'}">${g.priority}</span> ${g.cat}</div>
    <div style="margin-top:12px"><label>进度 (${g.progress}%)</label><input type="range" min="0" max="100" value="${g.progress}" onchange="setProgress(${i},this.value)" style="width:100%"></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${g.progress}%;background:${g.progress>=100?'var(--success)':'var(--accent)'}"></div></div>
    ${g.milestones&&g.milestones.length?`<div style="margin-top:16px"><strong>里程碑</strong>${msHtml}</div>`:''}
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
      ${g.progress>=100||g.done?'':`<button class="suc" onclick="completeGoal(${i})">标记完成</button>`}
      <button class="dng" onclick="deleteGoal(${i})">删除</button>
    </div>`;
  $('detailModal').style.display='flex';
}

function closeDetail(){$('detailModal').style.display='none'}
function setProgress(i,v){goals[i].progress=parseInt(v);save();render();showDetail(i)}
function toggleMs(gi,mi){goals[gi].milestones[mi].done=!goals[gi].milestones[mi].done;
  const g=goals[gi];g.progress=Math.round(g.milestones.filter(m=>m.done).length/g.milestones.length*100);
  save();render();showDetail(gi)}
function completeGoal(i){goals[i].done=true;goals[i].progress=100;goals[i].doneDate=today();save();render();closeDetail()}
function deleteGoal(i){if(!confirm('确定删除此目标？'))return;goals.splice(i,1);save();render();closeDetail()}

render();
</script>
</body>
</html>
