<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>充电站查找</title>
<meta name="description" content="电动车充电站查找工具，定位附近的充电桩">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#3fb950;--yellow:#d29922;--red:#f85149;--cyan:#39d2c0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 20px}
.header h1{font-size:20px;margin-bottom:12px}.header h1 span{font-size:24px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls input,.controls select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px}
.main{display:grid;grid-template-columns:1fr 380px;height:calc(100vh - 110px)}
.map-area{background:#0a0e14;position:relative;display:flex;align-items:center;justify-content:center}
.charger-map{width:90%;height:80%;position:relative}
.charge-dot{position:absolute;cursor:pointer;z-index:5;text-align:center}
.charge-dot .icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;margin:0 auto}
.charge-dot .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:11px;white-space:nowrap;z-index:10}
.charge-dot:hover .tip{display:block}
.sidebar{background:var(--card);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.filter-tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.filter-tab{padding:5px 10px;border-radius:14px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:transparent;color:#8b949e}
.filter-tab.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.sort-bar{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;font-size:12px}
.sort-bar select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:12px}
.charge-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;margin:8px;cursor:pointer;transition:border-color .2s}
.charge-card:hover{border-color:var(--cyan)}
.charge-card .name{font-size:16px;font-weight:700;color:var(--cyan)}
.charge-card .brand{font-size:12px;color:#8b949e;margin-top:2px}
.charge-card .addr{font-size:12px;color:#8b949e;margin:6px 0}
.charge-card .connectors{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.charge-card .conn{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600}
.charge-card .conn.fast{background:rgba(248,81,73,.15);color:var(--red)}
.charge-card .conn.slow{background:rgba(63,185,80,.15);color:var(--green)}
.charge-card .conn.super{background:rgba(217,119,6,.15);color:var(--yellow)}
.charge-card .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.charge-card .grid .item{text-align:center;padding:6px;background:var(--card);border-radius:6px}
.charge-card .grid .item .val{font-size:14px;font-weight:700}
.charge-card .grid .item .lbl{font-size:10px;color:#8b949e}
.charge-card .avail{margin-top:8px;font-size:13px}
.charge-card .avail .free{color:var(--green);font-weight:700}
.charge-card .avail .busy{color:var(--red);font-weight:700}
.charge-card .price{margin-top:6px;font-size:13px;color:var(--accent)}
.no-result{text-align:center;padding:40px;color:#8b949e}
@media(max-width:768px){.main{grid-template-columns:1fr;grid-template-rows:40vh 1fr}.sidebar{border-left:none;border-top:1px solid var(--border)}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="充电站查找">
  <meta property="og:description" content="电动车充电站查找工具，定位附近的充电桩">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/charging-station/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="header">
<h1><span>⚡</span> 充电站查找</h1>
<div class="controls">
<input type="text" id="searchInput" placeholder="搜索充电站..." title="Enter键搜索" oninput="renderStations()">
<select id="typeFilter" onchange="renderStations()">
<option value="all">所有类型</option>
<option value="fast">快充</option>
<option value="slow">慢充</option>
<option value="super">超充</option>
</select>
<select id="sortSelect" onchange="renderStations()">
<option value="distance">距离最近</option>
<option value="price-asc">价格最低</option>
<option value="available">空位最多</option>
<option value="power">功率最高</option>
</select>
</div>
</div>
<div class="main">
<div class="map-area"><div class="charger-map" id="chargerMap"></div></div>
<div class="sidebar">
<div class="filter-tabs">
<button class="filter-tab active" onclick="filterBrand('all',this)">全部</button>
<button class="filter-tab" onclick="filterBrand('特来电',this)">特来电</button>
<button class="filter-tab" onclick="filterBrand('星星充电',this)">星星充电</button>
<button class="filter-tab" onclick="filterBrand('国家电网',this)">国网</button>
<button class="filter-tab" onclick="filterBrand('小桔充电',this)">小桔</button>
<button class="filter-tab" onclick="filterBrand('特斯拉',this)">特斯拉</button>
</div>
<div id="stationList" style="flex:1;overflow-y:auto"></div>
</div>
</div>
<script>
let brandFilter='all';
const stations=[
{name:'国贸超级充电站',brand:'特斯拉',addr:'朝阳区建国门外大街1号B2层',distance:0.5,lat:39.908,lon:116.46,total:40,fast:20,slow:10,super:10,available:15,busy:25,price:{fast:1.2,slow:0.8,super:1.8},maxPower:250,rating:4.7,connectorTypes:['国标2015','特斯拉NCSS'],openHours:'00:00-24:00',features:['24小时','免费停车2小时','WiFi']},
{name:'望京智慧充电站',brand:'特来电',addr:'朝阳区望京街9号地下一层',distance:3.8,lat:39.994,lon:116.48,total:60,fast:30,slow:25,super:5,available:28,busy:32,price:{fast:1.0,slow:0.6,super:1.5},maxPower:180,rating:4.5,connectorTypes:['国标2015','CCS','CHAdeMO'],openHours:'00:00-24:00',features:['24小时','自助洗车','便利店']},
{name:'中关村科技充电站',brand:'国家电网',addr:'海淀区中关村大街15号',distance:3.5,lat:39.981,lon:116.32,total:30,fast:15,slow:15,super:0,available:8,busy:22,price:{fast:0.9,slow:0.5,super:0},maxPower:120,rating:4.3,connectorTypes:['国标2015','CCS'],openHours:'06:00-22:00',features:['国网认证','快速结算']},
{name:'三里屯潮流充电站',brand:'星星充电',addr:'朝阳区三里屯路19号',distance:1.5,lat:39.933,lon:116.45,total:24,fast:12,slow:10,super:2,available:5,busy:19,price:{fast:1.3,slow:0.7,super:2.0},maxPower:360,rating:4.8,connectorTypes:['国标2015','CCS','特斯拉NCSS'],openHours:'00:00-24:00',features:['超充VIP','免费咖啡','代客充电']},
{name:'西单商圈充电站',brand:'小桔充电',addr:'西城区西单北大街131号B3',distance:2.0,lat:39.912,lon:116.37,total:48,fast:28,slow:18,super:2,available:20,busy:28,price:{fast:1.1,slow:0.6,super:1.6},maxPower:200,rating:4.4,connectorTypes:['国标2015','CCS'],openHours:'07:00-23:00',features:['滴滴会员优惠','免费停车']},
{name:'丰台体育中心充电站',brand:'特来电',addr:'丰台区丰台体育路',distance:5.2,lat:39.862,lon:116.28,total:36,fast:20,slow:16,super:0,available:18,busy:18,price:{fast:0.95,slow:0.55,super:0},maxPower:120,rating:4.2,connectorTypes:['国标2015'],openHours:'06:00-23:00',features:['体育赛事优惠','快速充电']},
{name:'亦庄经开区充电站',brand:'国家电网',addr:'大兴区亦庄经济开发区',distance:15,lat:39.795,lon:116.50,total:50,fast:25,slow:20,super:5,available:35,busy:15,price:{fast:0.85,slow:0.45,super:1.3},maxPower:150,rating:4.1,connectorTypes:['国标2015','CCS','CHAdeMO'],openHours:'00:00-24:00',features:['工业区专用','大功率充电']},
{name:'通州万达充电站',brand:'星星充电',addr:'通州区新华西街58号',distance:12,lat:39.902,lon:116.66,total:42,fast:22,slow:16,super:4,available:25,busy:17,price:{fast:1.0,slow:0.6,super:1.5},maxPower:200,rating:4.3,connectorTypes:['国标2015','CCS'],openHours:'07:00-22:00',features:['万达会员积分','免费WiFi']},
{name:'天通苑社区充电站',brand:'小桔充电',addr:'昌平区天通苑北一区',distance:10,lat:40.077,lon:116.42,total:20,fast:10,slow:10,super:0,available:12,busy:8,price:{fast:0.9,slow:0.5,super:0},maxPower:90,rating:4.0,connectorTypes:['国标2015'],openHours:'00:00-24:00',features:['社区专属','夜间谷电优惠']},
{name:'首都机场充电站',brand:'特斯拉',addr:'顺义区首都机场T3航站楼',distance:22,lat:40.080,lon:116.60,total:30,fast:15,slow:10,super:5,available:10,busy:20,price:{fast:1.5,slow:1.0,super:2.2},maxPower:250,rating:4.6,connectorTypes:['国标2015','特斯拉NCSS','CCS'],openHours:'00:00-24:00',features:['机场接送优惠','超充网络']}
];
function renderStations(){
const search=document.getElementById('searchInput').value.toLowerCase();
const typeF=document.getElementById('typeFilter').value;
const sortF=document.getElementById('sortSelect').value;
let list=stations.filter(s=>{
if(brandFilter!=='all'&&s.brand!==brandFilter)return false;
if(typeF==='fast'&&s.fast===0)return false;
if(typeF==='slow'&&s.slow===0)return false;
if(typeF==='super'&&s.super===0)return false;
if(search&&!s.name.includes(search)&&!s.addr.includes(search))return false;
return true;
});
if(sortF==='distance')list.sort((a,b)=>a.distance-b.distance);
else if(sortF==='price-asc')list.sort((a,b)=>a.price.fast-b.price.fast);
else if(sortF==='available')list.sort((a,b)=>b.available-a.available);
else if(sortF==='power')list.sort((a,b)=>b.maxPower-a.maxPower);
document.getElementById('stationList').innerHTML=list.length===0?'<div class="no-result">没有匹配的充电站</div>':list.map(s=>{
const stars='★'.repeat(Math.floor(s.rating))+'☆'.repeat(5-Math.floor(s.rating));
return`<div class="charge-card">
<div class="name">${s.name}</div>
<div class="brand">${s.brand} · 📏 ${s.distance}km · <span style="color:var(--yellow)">${stars}</span> ${s.rating}</div>
<div class="addr">📍 ${s.addr}</div>
<div class="connectors">${s.connectorTypes.map(t=>`<span class="conn ${t.includes('NCSS')?'super':t.includes('CHAdeMO')?'fast':'slow'}">${t}</span>`).join('')}</div>
<div class="grid">
<div class="item"><div class="val">${s.total}</div><div class="lbl">总枪数</div></div>
<div class="item"><div class="val" style="color:var(--green)">${s.fast}</div><div class="lbl">快充</div></div>
<div class="item"><div class="val" style="color:var(--cyan)">${s.super}</div><div class="lbl">超充</div></div>
<div class="item"><div class="val" style="color:var(--yellow)">${s.slow}</div><div class="lbl">慢充</div></div>
</div>
<div class="avail">空闲 <span class="free">${s.available}个</span> · 使用中 <span class="busy">${s.busy}个</span> · 最大功率 ${s.maxPower}kW</div>
<div class="price">快充 ¥${s.price.fast}/度 · 慢充 ¥${s.price.slow}/度${s.price.super?` · 超充 ¥${s.price.super}/度`:''}</div>
<div style="margin-top:6px;font-size:11px;color:#8b949e">🕐 ${s.openHours} · ${s.features.join(' · ')}</div>
</div>`;
}).join('');
renderMap();
}
function renderMap(){
const map=document.getElementById('chargerMap');
let html='<svg viewBox="0 0 100 70" width="100%" height="100%" style="opacity:.15">';
for(let y=0;y<70;y+=5){html+=`<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="#1a2332" stroke-width="0.1"/>`;}
for(let x=0;x<100;x+=5){html+=`<line x1="${x}" y1="0" x2="${x}" y2="70" stroke="#1a2332" stroke-width="0.1"/>`;}
html+='</svg>';
const brandColors={特来电:'#00b050',星星充电:'#ff6600',国家电网:'#0066cc',小桔充电:'#ff9900',特斯拉:'#cc0000'};
stations.forEach(s=>{
const x=(s.lon-116.2)/0.6*80+5;
const y=(40.1-s.lat)/0.3*60+5;
const color=brandColors[s.brand]||'var(--accent)';
html+=`<div class="charge-dot" style="left:${x}%;top:${y}%"><div class="icon" style="background:${color};color:var(--text)">⚡</div><div class="tip">${s.name}<br>${s.available}空闲/${s.total}总<br>${s.brand}</div></div>`;
});
map.innerHTML=html;
}
function filterBrand(b,btn){brandFilter=b;document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');renderStations();}
renderStations();
</script>
<script src="../i18n.js" defer>
document.getElementById("searchInput").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();filterBrand();}});
</script>
</body>
</html>
