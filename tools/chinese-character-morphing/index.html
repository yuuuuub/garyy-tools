<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字变形游戏</title><meta name="description" content="汉字变形游戏 - 在线玩汉字变形游戏"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.morph-game{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.morph-current{font-size:8rem;font-weight:700;color:var(--blue);margin:20px 0;transition:all 0.5s}.morph-target{font-size:2rem;color:var(--green);margin:10px 0}.morph-options{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0}.morph-option{width:80px;height:80px;background:var(--card);border:2px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transition:all .2s}.morph-option:hover{border-color:var(--blue);transform:scale(1.1)}.morph-option.correct{border-color:var(--green);background:rgba(35,134,54,.1)}.morph-option.wrong{border-color:var(--red);background:rgba(239,68,68,.1)}.score-display{font-size:1.2rem;margin:16px 0}.timer{font-size:2rem;font-weight:700;color:var(--blue);margin:16px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字变形游戏"><meta property="og:description" content="汉字变形游戏 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎮 汉字变形游戏</h1><p class="sub">在线玩汉字变形游戏</p>
<div class="card">
<div class="btn-group">
<button class="btn" onclick="startGame()">开始游戏</button>
<button class="btn" onclick="nextLevel()">下一关</button>
<button class="btn" onclick="showHint()">提示</button>
</div>
<div class="score-display" id="scoreDisplay"></div>
<div class="timer" id="timer"></div>
</div>
<div id="result"></div>
<div class="card" id="historyCard" style="display:none">
<h3 style="margin-bottom:16px">游戏记录</h3>
<div id="history" style="padding:12px;background:var(--bg);border-radius:8px"></div>
</div></div>
<script src="../i18n.js" defer></script>
<script>
var characters=[
  {char:'一',pinyin:'yī',strokes:1},
  {char:'二',pinyin:'èr',strokes:2},
  {char:'三',pinyin:'sān',strokes:3},
  {char:'四',pinyin:'sì',strokes:5},
  {char:'五',pinyin:'wǔ',strokes:4},
  {char:'六',pinyin:'liù',strokes:4},
  {char:'七',pinyin:'qī',strokes:2},
  {char:'八',pinyin:'bā',strokes:2},
  {char:'九',pinyin:'jiǔ',strokes:2},
  {char:'十',pinyin:'shí',strokes:2},
  {char:'大',pinyin:'dà',strokes:3},
  {char:'小',pinyin:'xiǎo',strokes:3},
  {char:'多',pinyin:'duō',strokes:6},
  {char:'少',pinyin:'shǎo',strokes:4},
  {char:'上',pinyin:'shàng',strokes:3},
  {char:'下',pinyin:'xià',strokes:3}
];
var currentChar=null;
var targetChar=null;
var score=0;
var level=1;
var timer=null;
var timeLeft=30;
var history=[];
function startGame(){
  score=0;
  level=1;
  history=[];
  nextLevel();
}
function nextLevel(){
  clearInterval(timer);
  timeLeft=Math.max(10,30-level*2);
  updateTimer();
  timer=setInterval(function(){
    timeLeft--;
    updateTimer();
    if(timeLeft<=0){
      clearInterval(timer);
      alert('⏰ 时间到！');
    }
  },1000);
  var randomIndex=Math.floor(Math.random()*characters.length);
  currentChar=characters[randomIndex];
  var options=[currentChar];
  while(options.length<4){
    var randomOption=characters[Math.floor(Math.random()*characters.length)];
    if(!options.some(function(o){return o.char===randomOption.char;})){
      options.push(randomOption);
    }
  }
  options=shuffleArray(options);
  var html='<div class="card">';
  html+='<div class="morph-game">';
  html+='<div style="font-size:1.1rem;color:var(--text2)">第 '+level+' 关</div>';
  html+='<div class="morph-current" id="morphCurrent">'+currentChar.char+'</div>';
  html+='<div class="morph-target">找到拼音为 <strong>'+currentChar.pinyin+'</strong> 的汉字</div>';
  html+='<div class="morph-options">';
  options.forEach(function(option){
    html+='<div class="morph-option" onclick="checkAnswer(this,\''+option.char+'\')">'+option.char+'</div>';
  });
  html+='</div></div></div>';
  document.getElementById('result').innerHTML=html;
}
function checkAnswer(element,char){
  if(!currentChar)return;
  clearInterval(timer);
  var buttons=document.querySelectorAll('.morph-option');
  buttons.forEach(function(btn){btn.style.pointerEvents='none';});
  if(char===currentChar.char){
    element.classList.add('correct');
    score+=timeLeft*level;
    level++;
    history.push({char:currentChar.char,pinyin:currentChar.pinyin,correct:true,time:30-level*2-timeLeft});
    setTimeout(function(){
      nextLevel();
    },1000);
  }else{
    element.classList.add('wrong');
    history.push({char:currentChar.char,pinyin:currentChar.pinyin,correct:false,time:30-level*2-timeLeft});
    buttons.forEach(function(btn){
      if(btn.textContent===currentChar.char)btn.classList.add('correct');
    });
    setTimeout(function(){
      level=Math.max(1,level-1);
      nextLevel();
    },2000);
  }
  updateScore();
  updateHistory();
}
function showHint(){
  alert('提示：这个字的拼音是 '+currentChar.pinyin+'，有 '+currentChar.strokes+' 画');
}
function updateTimer(){
  document.getElementById('timer').textContent=timeLeft+'秒';
  var timerElement=document.getElementById('timer');
  if(timeLeft<=5)timerElement.style.color='var(--red)';
  else if(timeLeft<=10)timerElement.style.color='var(--blue)';
  else timerElement.style.color='var(--green)';
}
function updateScore(){
  document.getElementById('scoreDisplay').innerHTML='得分：'+score+'分 | 关卡：'+level;
}
function updateHistory(){
  if(history.length===0){
    document.getElementById('historyCard').style.display='none';
    return;
  }
  document.getElementById('historyCard').style.display='block';
  var html='';
  history.forEach(function(item){
    html+='<div style="padding:8px;margin-bottom:4px;background:'+(item.correct?'rgba(35,134,54,.1)':'rgba(239,68,68,.1)')+';border-radius:4px">';
    html+='<strong>'+item.char+'</strong> ('+item.pinyin+') - '+(item.correct?'正确':'错误')+' | 用时：'+item.time+'秒';
    html+='</div>';
  });
  document.getElementById('history').innerHTML=html;
}
function shuffleArray(array){
  for(var i=array.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var temp=array[i];
    array[i]=array[j];
    array[j]=temp;
  }
  return array;
}
startGame();
</script></body></html>
