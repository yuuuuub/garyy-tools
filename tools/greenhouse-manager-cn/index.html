<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>温室管理器</title>
<meta name="description" content="温室环境监控与管理，温度、湿度、通风、光照全方位管控">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏡</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#f59e0b;--accent2:#d97706;--success:#22c55e;--warn:#3b82f6;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#9a6700;--accent2:#7c5e00;--success:#1a7f37;--warn:#0969da;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
button.suc{background:var(--success)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;margin-right:4px}
.tag.g{background:var(--accent);color:#fff}.tag.w{background:var(--warn);color:#fff}.tag.r{background:var(--danger);color:#fff}
.li{padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.env-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.env-card{padding:20px;background:var(--bg);border-radius:var(--radius);text-align:center;position:relative;overflow:hidden}
.env-card .icon{font-size:2rem;margin-bottom:8px}
.env-card .value{font-size:2rem;font-weight:700;color:var(--accent)}
.env-card .unit{font-size:.85rem;color:var(--text2)}
.env-card .name{font-size:.85rem;color:var(--text2);margin-top:4px}
.env-card .status{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%}
.env-card .status.ok{background:var(--success)}
.env-card .status.warn{background:var(--warn)}
.env-card .status.danger{background:var(--danger)}
.gauge-ring{width:80px;height:80px;border-radius:50%;border:6px solid var(--border);position:relative;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}
.gauge-ring svg{position:absolute;inset:-6px;transform:rotate(-90deg)}
.gauge-ring circle{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s}
.alert-item{padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:8px;border-left:3px solid var(--warn);font-size:.85rem}
.chart-bar{display:flex;align-items:end;gap:4px;height:100px;margin-top:12px;padding:0 8px}
.chart-bar .bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;transition:height .3s;min-width:8px;position:relative}
.chart-bar .bar:hover::after{content:attr(data-val);position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:.7rem;background:var(--card);padding:2px 6px;border-radius:4px;white-space:nowrap}
.hidden{display:none}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏡 温室管理器</h1><p>环境监控 · 智能提醒 · 作物管理</p></div>

<div class="cd">
<h2>当前环境</h2>
<div class="env-grid" id="envGrid"></div>
<button onclick="refreshEnv()" class="sec" style="margin-top:8px">🔄 刷新数据</button>
<button onclick="recordSnapshot()" style="margin-top:8px">📸 记录快照</button>
</div>

<div class="cd">
<h2>环境设置</h2>
<div class="fr">
<div><label>温室名称</label><input type="text" id="ghName" placeholder="如：1号温室"></div>
<div><label>温室类型</label><select id="ghType"><option>日光温室</option><option>塑料大棚</option><option>玻璃温室</option><option>连栋温室</option></select></div>
</div>
<div class="fr">
<div><label>面积(㎡)</label><input type="number" id="ghArea" placeholder="面积"></div>
<div><label>作物类型</label><select id="ghCrop"><option>蔬菜</option><option>花卉</option><option>水果</option><option>育苗</option></select></div>
</div>
<h2 style="margin-top:16px">报警阈值</h2>
<div class="fr">
<div><label>最低温度(℃)</label><input type="number" id="minTemp" value="10"></div>
<div><label>最高温度(℃)</label><input type="number" id="maxTemp" value="35"></div>
</div>
<div class="fr">
<div><label>最低湿度(%)</label><input type="number" id="minHumid" value="40"></div>
<div><label>最高湿度(%)</label><input type="number" id="maxHumid" value="85"></div>
</div>
<div class="bg"><button onclick="saveSettings()">保存设置</button></div>
</div>

<div class="cd">
<h2>操作日志</h2>
<div class="fr">
<div><label>操作类型</label><select id="opType"><option>通风</option><option>浇水</option><option>施肥</option><option>喷药</option><option>揭膜</option><option>盖膜</option><option>其他</option></select></div>
<div><label>详情</label><input type="text" id="opDetail" placeholder="操作详情"></div>
</div>
<div class="bg"><button onclick="addOp()">记录操作</button></div>
<div id="opList" class="es" style="margin-top:12px">暂无记录</div>
</div>

<div class="cd">
<h2>温度趋势(最近24小时)</h2>
<div class="chart-bar" id="tempChart"></div>
<div style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--text2);margin-top:4px;padding:0 8px"><span>24h前</span><span>现在</span></div>
</div>

<div class="cd">
<h2>报警记录</h2>
<div id="alertList" class="es">暂无报警</div>
</div>
</div>

<script>
const DB='greenhouse_manager_db';
const OP_DB='greenhouse_ops_db';
const ALERT_DB='greenhouse_alerts_db';
const TEMP_DB='greenhouse_temps_db';
let settings=JSON.parse(localStorage.getItem(DB)||'{}');
let ops=JSON.parse(localStorage.getItem(OP_DB)||'[]');
let alerts=JSON.parse(localStorage.getItem(ALERT_DB)||'[]');
let temps=JSON.parse(localStorage.getItem(TEMP_DB)||'[]');

let env={temp:22,humid:65,light:12000,co2:450,soil:18};

function refreshEnv(){
  env.temp=+(15+Math.random()*20).toFixed(1);
  env.humid=+(40+Math.random()*45).toFixed(0);
  env.light=Math.round(5000+Math.random()*20000);
  env.co2=Math.round(300+Math.random()*400);
  env.soil=+(12+Math.random()*15).toFixed(1);
  renderEnv();checkAlerts();renderTempChart();
}

function renderEnv(){
  const minT=+document.getElementById('minTemp').value||10;
  const maxT=+document.getElementById('maxTemp').value||35;
  const minH=+document.getElementById('minHumid').value||40;
  const maxH=+document.getElementById('maxHumid').value||85;
  const tempOk=env.temp>=minT&&env.temp<=maxT;
  const humidOk=env.humid>=minH&&env.humid<=maxH;

  const items=[
    {icon:'🌡️',name:'温度',value:env.temp,unit:'℃',ok:tempOk,warn:env.temp>maxT-3&&env.temp<=maxT||env.temp<minT+3&&env.temp>=minT},
    {icon:'💧',name:'湿度',value:env.humid,unit:'%',ok:humidOk,warn:env.humid>maxH-5&&env.humid<=maxH||env.humid<minH+5&&env.humid>=minH},
    {icon:'☀️',name:'光照',value:env.light,unit:'lux',ok:env.light>3000&&env.light<50000,warn:false},
    {icon:'🫧',name:'CO₂',value:env.co2,unit:'ppm',ok:env.co2>300&&env.co2<1000,warn:false},
    {icon:'🌱',name:'土壤温度',value:env.soil,unit:'℃',ok:env.soil>10&&env.soil<30,warn:false},
  ];
  document.getElementById('envGrid').innerHTML=items.map(it=>`
    <div class="env-card">
      <div class="status ${it.ok?'ok':it.warn?'warn':'danger'}"></div>
      <div class="icon">${it.icon}</div>
      <div class="value" style="color:${it.ok?'var(--accent)':it.warn?'var(--warn)':'var(--danger)'}">${it.value}</div>
      <div class="unit">${it.unit}</div>
      <div class="name">${it.name}</div>
    </div>`).join('');
}

function checkAlerts(){
  const minT=+document.getElementById('minTemp').value||10;
  const maxT=+document.getElementById('maxTemp').value||35;
  const minH=+document.getElementById('minHumid').value||40;
  const maxH=+document.getElementById('maxHumid').value||85;
  const newAlerts=[];
  if(env.temp>maxT)newAlerts.push({msg:`温度过高：${env.temp}℃ > ${maxT}℃`,type:'danger'});
  if(env.temp<minT)newAlerts.push({msg:`温度过低：${env.temp}℃ < ${minT}℃`,type:'danger'});
  if(env.humid>maxH)newAlerts.push({msg:`湿度过高：${env.humid}% > ${maxH}%`,type:'warn'});
  if(env.humid<minH)newAlerts.push({msg:`湿度过低：${env.humid}% < ${minH}%`,type:'warn'});
  if(env.co2>800)newAlerts.push({msg:`CO₂浓度偏高：${env.co2}ppm`,type:'warn'});
  if(newAlerts.length){
    newAlerts.forEach(a=>alerts.push({...a,date:new Date().toLocaleString(),id:Date.now()+Math.random()}));
    localStorage.setItem(ALERT_DB,JSON.stringify(alerts));
    renderAlerts();
  }
}

function renderAlerts(){
  const el=document.getElementById('alertList');
  const recent=alerts.slice(-10).reverse();
  if(!recent.length){el.innerHTML='<div class="es">暂无报警 ✅</div>';return}
  el.innerHTML=recent.map(a=>`<div class="alert-item" style="border-color:var(--${a.type})">${a.msg}<div style="font-size:.75rem;color:var(--text2);margin-top:2px">${a.date}</div></div>`).join('');
}

function renderTempChart(){
  const el=document.getElementById('tempChart');
  const last24=temps.slice(-24);
  if(!last24.length){el.innerHTML='<div style="text-align:center;color:var(--text2);font-size:.85rem;width:100%">暂无数据，点击"记录快照"开始采集</div>';return}
  const max=Math.max(...last24.map(t=>t.temp));
  const min=Math.min(...last24.map(t=>t.temp));
  const range=max-min||1;
  el.innerHTML=last24.map(t=>{
    const h=((t.temp-min)/range*80+20);
    return`<div class="bar" style="height:${h}%" data-val="${t.temp}℃"></div>`;
  }).join('');
}

function recordSnapshot(){
  temps.push({temp:env.temp,humid:env.humid,date:new Date().toISOString()});
  if(temps.length>168)temps=temps.slice(-168);
  localStorage.setItem(TEMP_DB,JSON.stringify(temps));
  renderTempChart();
}

function saveSettings(){
  settings={name:document.getElementById('ghName').value,type:document.getElementById('ghType').value,area:document.getElementById('ghArea').value,crop:document.getElementById('ghCrop').value,minT:document.getElementById('minTemp').value,maxT:document.getElementById('maxTemp').value,minH:document.getElementById('minHumid').value,maxH:document.getElementById('maxHumid').value};
  localStorage.setItem(DB,JSON.stringify(settings));
  renderEnv();alert('设置已保存');
}

function addOp(){
  const type=document.getElementById('opType').value;
  const detail=document.getElementById('opDetail').value.trim();
  ops.push({type,detail,date:new Date().toLocaleString(),id:Date.now()});
  localStorage.setItem(OP_DB,JSON.stringify(ops));
  document.getElementById('opDetail').value='';
  renderOps();
}

function renderOps(){
  const el=document.getElementById('opList');
  const recent=ops.slice(-20).reverse();
  if(!recent.length){el.innerHTML='<div class="es">暂无记录</div>';return}
  el.innerHTML=recent.map((o,i)=>`<div class="li" style="display:flex;justify-content:space-between;align-items:center">
    <div><span class="tag g">${o.type}</span> ${o.detail||'无详情'}<div style="font-size:.8rem;color:var(--text2)">${o.date}</div></div>
    <button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="ops.splice(${ops.indexOf(o)},1);localStorage.setItem('${OP_DB}',JSON.stringify(ops));renderOps()">删除</button>
  </div>`).join('');
}

// Init
if(settings.name)document.getElementById('ghName').value=settings.name;
if(settings.minT)document.getElementById('minTemp').value=settings.minT;
if(settings.maxT)document.getElementById('maxTemp').value=settings.maxT;
if(settings.minH)document.getElementById('minHumid').value=settings.minH;
if(settings.maxH)document.getElementById('maxHumid').value=settings.maxH;

refreshEnv();renderOps();renderAlerts();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
