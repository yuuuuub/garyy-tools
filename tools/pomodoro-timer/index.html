<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 番茄钟</title>
<meta name="description" content="番茄钟工作法计时器，提升专注力和工作效率">
<style>
:root {--bg: #0d1117;
--surface: #161b22;
--surface-hover: #1c2333;
--text: #e6edf3;
--text-muted: #8b949e;
--accent: #3b82f6;
--accent-glow: rgba(59,130,246,0.3);
--rest-accent: #22c55e;
--rest-glow: rgba(34,197,94,0.3);
--border: #30363d;
--ring-bg: #161b22;
--ring-track: #21262d;
--focus: #3b82f6;
--short-break: #22c55e;
--long-break: #3b82f6;
--radius: 12px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100dvh;
display: flex;
align-items: center;
justify-content: center;
user-select: none;
-webkit-tap-highlight-color: transparent}
.container {width: 100%;
max-width: 400px;
padding: 24px 20px;
display: flex;
flex-direction: column;
align-items: center;
gap: 24px}
h1 {font-size: 1.5rem;
font-weight: 700;
letter-spacing: -0.01em;
color: var(--text)}
.timer-ring-wrap {position: relative;
width: min(280px, 70vw);
aspect-ratio: 1}
.timer-ring-wrap svg {width: 100%;
height: 100%;
transform: rotate(-90deg)}
.ring-bg {fill: none;
stroke: var(--ring-track);
stroke-width: 8}
.ring-fg {fill: none;
stroke: var(--accent);
stroke-width: 8;
stroke-linecap: round;
transition: stroke-dashoffset 0.35s linear, stroke 0.3s}
.timer-display {position: absolute;
inset: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
pointer-events: none}
.time {font-size: 3.2rem;
font-weight: 700;
font-variant-numeric: tabular-nums;
letter-spacing: 0.02em;
line-height: 1}
.time-label {font-size: 0.85rem;
color: var(--text-muted);
margin-top: 6px}
.rest-tip {font-size: 0.95rem;
color: var(--rest-accent);
text-align: center;
min-height: 1.4em;
transition: opacity 0.3s}
.btn-group {display: flex;
gap: 12px}
.btn {padding: 12px 28px;
border: none;
border-radius: 50px;
font-size: 1rem;
font-weight: 600;
cursor: pointer;
transition: all 0.15s ease;
font-family: inherit}
.btn:active { transform: scale(0.96); }
.btn-primary {background: var(--accent);
color: var(--text);
min-width: 110px}
.btn-primary:hover { box-shadow: 0 0 20px var(--accent-glow); }
.btn-primary.running { background: #ffa726; }
.btn-secondary {background: var(--surface);
color: var(--text);
border: 1px solid var(--border)}
.btn-secondary:hover { background: var(--surface-hover); }
.mode-selector {display: flex;
gap: 8px;
background: var(--surface);
border-radius: 50px;
padding: 4px}
.mode-btn {padding: 8px 16px;
border: none;
border-radius: 50px;
font-size: 0.85rem;
font-weight: 500;
cursor: pointer;
background: transparent;
color: var(--text-muted);
transition: all 0.15s;
font-family: inherit}
.mode-btn.active {background: var(--accent);
color: var(--text)}
.custom-inputs {display: flex;
gap: 16px;
align-items: center;
transition: all 0.25s;
overflow: hidden}
.custom-inputs.hidden {max-height: 0;
opacity: 0;
margin: 0}
.custom-inputs:not(.hidden) {max-height: 80px;
opacity: 1;
margin-top: 4px}
.custom-field {display: flex;
flex-direction: column;
align-items: center;
gap: 4px}
.custom-field label {font-size: 0.75rem;
color: var(--text-muted)}
.custom-field input {width: 64px;
padding: 6px 8px;
border: 1px solid var(--border);
border-radius: 8px;
background: var(--surface);
color: var(--text);
text-align: center;
font-size: 0.9rem;
font-family: inherit}
.custom-field input:focus { outline: none; border-color: var(--accent); }
.stats {display: flex;
gap: 4px;
align-items: center;
font-size: 0.9rem;
color: var(--text-muted)}
.stats strong { color: var(--text); }
@media (max-width: 360px) {.time { font-size: 2.6rem; }
.btn { padding: 10px 20px; font-size: 0.9rem; }
.mode-btn { padding: 6px 12px; font-size: 0.78rem; }}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🍅 番茄钟">
  <meta property="og:description" content="番茄钟工作法计时器，提升专注力和工作效率">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/pomodoro-timer/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <h1>🍅 番茄钟</h1>

  <div class="timer-ring-wrap">
    <svg viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="92"/>
      <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="92"
              stroke-dasharray="578.053"
              stroke-dashoffset="0"/>
    </svg>
    <div class="timer-display">
      <span class="time" id="timeDisplay">25:00</span>
      <span class="time-label" id="timeLabel">专注</span>
    </div>
  </div>

  <div class="rest-tip" id="restTip"></div>

  <div class="btn-group">
    <button class="btn btn-primary" id="btnToggle">开始</button>
    <button class="btn btn-secondary" id="btnReset">重置</button>
  </div>

  <div class="mode-selector">
    <button class="mode-btn active" data-mode="pomodoro">番茄</button>
    <button class="mode-btn" data-mode="long">长专注</button>
    <button class="mode-btn" data-mode="custom">自定义</button>
  </div>

  <div class="custom-inputs hidden" id="customInputs">
    <div class="custom-field">
      <label>专注</label>
      <input type="number" id="customFocus" value="25" min="1" max="120">
    </div>
    <span style="color:var(--text-muted)">+</span>
    <div class="custom-field">
      <label>休息</label>
      <input type="number" id="customBreak" value="5" min="1" max="60">
    </div>
    <span style="font-size:0.75rem;color:var(--text-muted)">分钟</span>
  </div>

  <div class="stats">
    已完成 <strong id="pomoCount">0</strong> 个番茄
  </div>
</div>

<script>
const CIRCUMFERENCE = 2 * Math.PI * 92;
const MODES = {
  pomodoro:  { focus: 25, break: 5  },
  long:      { focus: 50, break: 10 },
};
const REST_TIPS = [
  '闭上眼睛，深呼吸',
  '站起来走动一下',
  '喝杯水，补充水分',
  '眺望窗外，放松眼睛',
  '伸展一下身体',
  '听一首舒缓的音乐',
  '闭上眼睛冥想片刻',
  '揉揉肩膀和脖子',
  '做几个深呼吸',
  '给自己一个微笑',
];
let state = {
  mode:        'pomodoro',
  focusMin:    25,
  breakMin:    5,
  isFocus:     true,
  running:     false,
  remaining:   25 * 60,
  total:       25 * 60,
  pomoCount:   0,
  timerId:     null,
};
const ringFg       = document.getElementById('ringFg');
const timeDisplay  = document.getElementById('timeDisplay');
const timeLabel    = document.getElementById('timeLabel');
const btnToggle    = document.getElementById('btnToggle');
const btnReset     = document.getElementById('btnReset');
const restTip      = document.getElementById('restTip');
const pomoCountEl  = document.getElementById('pomoCount');
const customInputs = document.getElementById('customInputs');
const customFocus  = document.getElementById('customFocus');
const customBreak  = document.getElementById('customBreak');
ringFg.style.strokeDasharray  = CIRCUMFERENCE;
ringFg.style.strokeDashoffset = '0';
function fmtTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function updateDisplay() {
  const t = fmtTime(state.remaining);
  timeDisplay.textContent = t;
  document.title = state.running
    ? `${t} - ${state.isFocus ? '专注' : '休息'} | 🍅 番茄钟`
    : '🍅 番茄钟';
  const pct = state.total > 0 ? state.remaining / state.total : 0;
  ringFg.style.strokeDashoffset = CIRCUMFERENCE * (1 - pct);
  timeLabel.textContent = state.isFocus ? '专注' : '休息';
  btnToggle.textContent = state.running ? '暂停' : '开始';
  btnToggle.classList.toggle('running', state.running);
  ringFg.style.stroke = state.isFocus
    ? 'var(--accent)'
    : 'var(--rest-accent)';
  restTip.textContent = (!state.isFocus && state.running)
    ? REST_TIPS[Math.floor(Math.random() * REST_TIPS.length)]
    : '';
}
function stopTimer() {
  if (state.timerId) {
    clearInterval(state.timerId);
    state.timerId = null;
  }
}
function playBeep(freq = 800, duration = 0.15, type = 'sine') {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
    setTimeout(() => { ctx.close(); }, duration + 100);
  } catch (_) {
  }
}
function playFinishSound() {
  playBeep(523.25, 0.12);
  setTimeout(() => playBeep(659.25, 0.12), 120);
  setTimeout(() => playBeep(783.99, 0.25), 240);
}
function switchPhase() {
  stopTimer();
  state.isFocus  = !state.isFocus;
  state.running  = false;
  if (state.isFocus) {
    state.total = state.focusMin * 60;
    restTip.textContent = '';
  } else {
    state.total = state.breakMin * 60;
    updateDisplay();
  }
  state.remaining = state.total;
  updateDisplay();
  saveSettings();
}
function finishPhase() {
  stopTimer();
  state.running = false;
  if (state.isFocus) {
    state.pomoCount++;
    pomoCountEl.textContent = state.pomoCount;
    localStorage.setItem('pomo_count', state.pomoCount);
  }
  playFinishSound();
  switchPhase();
  if (Notification.permission === 'granted') {
    new Notification(state.isFocus ? '休息时间到了！' : '专注时间到！', {
      body: state.isFocus ? '准备好开始新的番茄吧' : '休息一下，放松身心',
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🍅</text></svg>',
    });
  }
}
function tick() {
  if (!state.running) return;
  if (state.remaining <= 0) {
    finishPhase();
    return;
  }
  state.remaining--;
  updateDisplay();
}
function toggleRunning() {
  if (state.running) {
    stopTimer();
    state.running = false;
    updateDisplay();
  } else {
    state.running = true;
    state.timerId = setInterval(tick, 1000);
    restTip.textContent = '';
    updateDisplay();
  }
}
function reset() {
  stopTimer();
  state.running  = false;
  state.isFocus  = true;
  state.total    = state.focusMin * 60;
  state.remaining = state.total;
  restTip.textContent = '';
  updateDisplay();
}
function setMode(mode) {
  stopTimer();
  state.running = false;
  state.mode    = mode;
  if (mode === 'custom') {
    state.focusMin = parseInt(customFocus.value) || 25;
    state.breakMin = parseInt(customBreak.value) || 5;
  } else {
    state.focusMin = MODES[mode].focus;
    state.breakMin = MODES[mode].break;
  }
  state.isFocus    = true;
  state.total      = state.focusMin * 60;
  state.remaining  = state.total;
  restTip.textContent = '';
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  customInputs.classList.toggle('hidden', mode !== 'custom');
  updateDisplay();
  saveSettings();
}
function onCustomChange() {
  if (state.mode !== 'custom') return;
  state.focusMin = parseInt(customFocus.value) || 25;
  state.breakMin = parseInt(customBreak.value) || 5;
  reset();
  saveSettings();
}
function saveSettings() {
  localStorage.setItem('pomo_mode', state.mode);
  localStorage.setItem('pomo_focusMin', state.focusMin);
  localStorage.setItem('pomo_breakMin', state.breakMin);
  localStorage.setItem('pomo_count', state.pomoCount);
}
function loadSettings() {
  const mode = localStorage.getItem('pomo_mode');
  if (mode) state.mode = mode;
  const fMin = localStorage.getItem('pomo_focusMin');
  if (fMin) state.focusMin = parseInt(fMin) || 25;
  const bMin = localStorage.getItem('pomo_breakMin');
  if (bMin) state.breakMin = parseInt(bMin) || 5;
  const count = localStorage.getItem('pomo_count');
  if (count) state.pomoCount = parseInt(count) || 0;
  if (state.mode === 'custom') {
    customFocus.value = state.focusMin;
    customBreak.value = state.breakMin;
  }
}
function init() {
  loadSettings();
  state.isFocus    = true;
  state.total      = state.focusMin * 60;
  state.remaining  = state.total;
  pomoCountEl.textContent = state.pomoCount;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === state.mode);
  });
  customInputs.classList.toggle('hidden', state.mode !== 'custom');
  if (state.mode === 'custom') {
    customFocus.value = state.focusMin;
    customBreak.value = state.breakMin;
  }
  updateDisplay();
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}
btnToggle.addEventListener('click', toggleRunning);
btnReset.addEventListener('click', reset);
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
});
customFocus.addEventListener('input', () => {
  if (state.mode === 'custom') {
    state.focusMin = parseInt(customFocus.value) || 25;
    if (!state.running) {
      state.total = state.focusMin * 60;
      state.remaining = state.total;
      updateDisplay();
    }
  }
});
customBreak.addEventListener('input', () => {
  if (state.mode === 'custom') {
    state.breakMin = parseInt(customBreak.value) || 5;
  }
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    toggleRunning();
  }
  if (e.code === 'KeyR') {
    reset();
  }
});
init();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
