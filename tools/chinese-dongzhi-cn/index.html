<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冬至 - 数九消寒</title>
<meta name="description" content="冬至数九消寒 - 冬至习俗、饺子汤圆、九九消寒图、养生指南">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
<meta name="robots" content="index,follow">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.hidden{display:none}
.countdown-box{display:flex;gap:16px;justify-content:center;margin:16px 0}
.countdown-item{text-align:center}
.countdown-num{font-size:2rem;font-weight:700;color:var(--blue);line-height:1}
.countdown-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.snow{position:relative;text-align:center;padding:20px 0}
.snowflake{position:absolute;font-size:1rem;opacity:.6;animation:snowfall 4s linear infinite}
@keyframes snowfall{0%{transform:translateY(-20px) rotate(0deg);opacity:.6}100%{transform:translateY(200px) rotate(360deg);opacity:0}}
.jiujiu-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:16px 0}
.jiujiu-cell{aspect-ratio:1;border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.7rem;cursor:pointer;transition:all .2s;color:var(--text2);user-select:none}
.jiujiu-cell.filled{background:var(--blue);color:#fff;border-color:var(--blue)}
.jiujiu-cell:hover{border-color:var(--blue)}
.jiujiu-progress{text-align:center;margin-bottom:8px;font-size:.9rem;color:var(--text2)}
.jiujiu-phrase{text-align:center;font-size:.85rem;color:var(--text2);margin-top:8px;font-style:italic}
.region-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.region-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.region-title{font-weight:600;margin-bottom:8px}
.region-emoji{font-size:2rem;display:block;margin-bottom:4px}
.region-desc{color:var(--text2);font-size:.85rem;line-height:1.6}
.custom-list{display:flex;flex-direction:column;gap:10px}
.custom-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all var(--transition)}
.custom-item:hover{border-color:var(--blue)}
.custom-header{display:flex;align-items:center;gap:10px}
.custom-icon{font-size:1.5rem}
.custom-name{font-weight:600}
.custom-desc{color:var(--text2);font-size:.85rem;margin-top:4px}
.custom-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--text2);font-size:.85rem;line-height:1.6;display:none}
.custom-detail.show{display:block}
.health-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.health-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px}
.health-title{font-weight:600;margin-bottom:6px}
.health-desc{color:var(--text2);font-size:.85rem;line-height:1.6}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div style="position:fixed;top:8px;right:8px;z-index:9999"><button class="btn btn-secondary" onclick="toggleTheme()" style="font-size:.8rem;padding:4px 10px" id="themeBtn">🌙 暗色</button></div>
<div class="container">
<h1>❄️ 冬至 - 数九消寒</h1>
<p class="sub">饺子汤圆 · 九九消寒 · 养生指南 · 冬至文化</p>

<div class="card">
<div class="snow" id="snowArea" style="height:60px"></div>
<h3 style="text-align:center;margin-bottom:4px">❄️ 距离冬至</h3>
<div class="countdown-box" id="countdown"></div>
</div>

<div class="tabs">
<button class="btn btn-primary" onclick="showTab('jiujiu')" id="tabJiujiu">📊 九九消寒图</button>
<button class="btn btn-secondary" onclick="showTab('customs')" id="tabCustoms">🎊 习俗</button>
<button class="btn btn-secondary" onclick="showTab('region')" id="tabRegion">🗺️ 南北差异</button>
<button class="btn btn-secondary" onclick="showTab('health')" id="tabHealth">💚 养生</button>
</div>

<div id="jiujiuView">
<div class="jiujiu-progress" id="jjProgress"></div>
<div class="jiujiu-grid" id="jjGrid"></div>
<div class="jiujiu-phrase" id="jjPhrase"></div>
<div style="text-align:center;margin-top:12px"><button class="btn btn-primary" onclick="resetJiujiu()">🔄 重置消寒图</button></div>
</div>
<div id="customsView" class="hidden"><div class="custom-list" id="customList"></div></div>
<div id="regionView" class="hidden"><div class="region-compare" id="regionCompare"></div></div>
<div id="healthView" class="hidden"><div class="health-grid" id="healthGrid"></div></div>
</div>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script src="../i18n.js" defer></script>
<script>
var phrases=['一九二九不出手','三九四九冰上走','五九六九沿河看柳','七九河开八九雁来','九九加一九耕牛遍地走'];
var customs=[
{name:'吃饺子',icon:'🥟',desc:'北方冬至必吃饺子，纪念张仲景',detail:'饺子是医圣张仲景发明的"祛寒娇耳汤"。冬至吃饺子寓意不冻耳朵。民间有"冬至不端饺子碗，冻掉耳朵没人管"的谚语。'},
{name:'吃汤圆',icon:'🥣',desc:'南方冬至吃汤圆，象征团圆',detail:'汤圆用糯米粉制成，圆形象征团圆。冬至吃汤圆又叫"添岁"，表示长了一岁。有些地方会在汤圆里包入不同馅料，吃到特定馅料有特殊含义。'},
{name:'祭祖',icon:'🙏',desc:'冬至祭祀祖先，表达感恩',detail:'冬至祭祖是重要的传统习俗。人们会准备丰盛的供品，祭拜祖先，表达感恩和思念。冬至在古代是重要的节日，有"冬至大如年"的说法。'},
{name:'数九',icon:'🔢',desc:'从冬至起每九天为一"九"，共九九八十一天',detail:'数九是从冬至日起算的传统计时方式。每九天为一个"九"，共九九八十一天。通过背诵"九九歌"来记录冬去春来的过程。'}
];
var regions=[
{name:'北方',emoji:'🥟',desc:'吃饺子\n寓意不冻耳朵\n"冬至不端饺子碗，冻掉耳朵没人管"'},
{name:'南方',emoji:'🥣',desc:'吃汤圆\n象征团圆美满\n"冬至大如年"'}
];
var healthTips=[
{title:'保暖防寒',icon:'🧣',desc:'冬至后天气寒冷，要注意头部、背部、脚部保暖。外出戴帽子、围巾，睡前用温水泡脚。'},
{title:'早睡晚起',icon:'😴',desc:'冬季宜早睡晚起，保证充足睡眠。最好在晚上10点前入睡，早上太阳升起后再起床。'},
{title:'温补饮食',icon:'🍲',desc:'多吃温热食物：羊肉、牛肉、生姜、红枣。少吃寒凉食物。适当食用黑色食物：黑豆、黑芝麻、黑木耳。'},
{title:'适度运动',icon:'🏃',desc:'冬季运动不宜过于剧烈，以免出汗受寒。建议散步、太极拳、八段锦等温和运动。'},
{title:'调节情绪',icon:'😊',desc:'冬季日照短，容易情绪低落。要保持乐观心态，多晒太阳，多与家人朋友交流。'},
{title:'艾灸养生',icon:'🔥',desc:'冬至前后艾灸关元、气海等穴位，可以温阳补肾，增强体质。建议在专业人士指导下进行。'}
];
var filled=JSON.parse(localStorage.getItem('jiujiu_filled')||'[]');

function initSnow(){
  var h='';var emojis=['❄️','❅','❆','✧'];
  for(var i=0;i<8;i++){
    var x=Math.random()*90;var delay=Math.random()*4;var emoji=emojis[i%emojis.length];
    h+='<span class="snowflake" style="left:'+x+'%;animation-delay:'+delay+'s">'+emoji+'</span>';
  }
  document.getElementById('snowArea').innerHTML=h;
}

function updateCountdown(){
  var now=new Date();var year=now.getFullYear();
  var dz=new Date(year,11,22);
  if(now>dz)dz=new Date(year+1,11,22);
  var diff=dz-now;var d=Math.floor(diff/864e5);
  document.getElementById('countdown').innerHTML='<div class="countdown-item"><div class="countdown-num">'+d+'</div><div class="countdown-label">天</div></div>';
}

function showTab(tab){
  ['jiujiuView','customsView','regionView','healthView'].forEach(function(v){document.getElementById(v).classList.add('hidden')});
  document.getElementById(tab+'View').classList.remove('hidden');
  ['tabJiujiu','tabCustoms','tabRegion','tabHealth'].forEach(function(id){document.getElementById(id).className='btn btn-secondary'});
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).className='btn btn-primary';
}

function renderJiujiu(){
  var h='';var phraseIdx=0;
  for(var i=0;i<81;i++){
    var cls=filled.includes(i)?'jiujiu-cell filled':'jiujiu-cell';
    h+='<div class="'+cls+'" onclick="toggleJiujiu('+i+')">'+(i+1)+'</div>';
  }
  document.getElementById('jjGrid').innerHTML=h;
  var filledCount=filled.length;
  document.getElementById('jjProgress').textContent='已完成 '+filledCount+'/81 天';
  phraseIdx=Math.min(Math.floor(filledCount/9),4);
  document.getElementById('jjPhrase').textContent='📜 '+phrases[phraseIdx];
}

function toggleJiujiu(i){
  var idx=filled.indexOf(i);
  if(idx>=0)filled.splice(idx,1);else filled.push(i);
  localStorage.setItem('jiujiu_filled',JSON.stringify(filled));
  renderJiujiu();
}

function resetJiujiu(){
  filled=[];localStorage.setItem('jiujiu_filled','[]');renderJiujiu();
}

function renderCustoms(){
  var h='';
  customs.forEach(function(c,i){
    h+='<div class="custom-item" onclick="toggleDetail('+i+')">';
    h+='<div class="custom-header"><span class="custom-icon">'+c.icon+'</span><div><div class="custom-name">'+c.name+'</div><div class="custom-desc">'+c.desc+'</div></div></div>';
    h+='<div class="custom-detail" id="cd-'+i+'">'+c.detail+'</div></div>';
  });
  document.getElementById('customList').innerHTML=h;
}

function toggleDetail(idx){var el=document.getElementById('cd-'+idx);if(el)el.classList.toggle('show')}

function renderRegion(){
  var h='';regions.forEach(function(r){
    h+='<div class="region-card"><span class="region-emoji">'+r.emoji+'</span><div class="region-title">'+r.name+'</div><div class="region-desc">'+r.desc.replace(/\n/g,'<br>')+'</div></div>';
  });document.getElementById('regionCompare').innerHTML=h;
}

function renderHealth(){
  var h='';healthTips.forEach(function(t){
    h+='<div class="health-item"><div class="health-title">'+t.icon+' '+t.title+'</div><div class="health-desc">'+t.desc+'</div></div>';
  });document.getElementById('healthGrid').innerHTML=h;
}

function toggleTheme(){
  var html=document.documentElement;var isLight=html.getAttribute('data-theme')==='light';
  html.setAttribute('data-theme',isLight?'dark':'light');
  document.getElementById('themeBtn').textContent=isLight?'☀️ 亮色':'🌙 暗色';
}

initSnow();renderJiujiu();renderCustoms();renderRegion();renderHealth();updateCountdown();setInterval(updateCountdown,36e5);
window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});
</script>
</body>
</html>
