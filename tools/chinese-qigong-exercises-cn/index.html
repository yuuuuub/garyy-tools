<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}.tag.b{background:rgba(59,130,246,.15);color:var(--blue)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.detail{display:none}.detail.active{display:block}
.step{padding:10px;border-left:3px solid var(--accent);margin-bottom:8px;background:var(--bg);border-radius:0 8px 8px 0}
.step-num{font-weight:700;color:var(--accent);margin-right:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{padding:12px;background:var(--bg);border-radius:8px}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border)}
.log-date{color:var(--text2);font-size:.85rem}
.plan-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.plan-day{padding:8px 4px;text-align:center;border:1px solid var(--border);border-radius:8px;font-size:.7rem;cursor:pointer}
.plan-day.filled{background:rgba(59,130,246,.1);border-color:var(--accent)}
.plan-day .day-name{font-weight:600;margin-bottom:2px}
.plan-day .day-exercise{color:var(--accent);font-size:.6rem}
</style>
</head>

<div class="ctn">
<div class="hdr">
<h1>💨 气功功法大全</h1>
<p>导引吐纳，修炼内气</p>
</div>

<div class="tab-bar" id="tabs">
<div class="tab active" data-tab="list">功法列表</div>
<div class="tab" data-tab="detail">功法详解</div>
<div class="tab" data-tab="plan">练习计划</div>
<div class="tab" data-tab="record">健康记录</div>
</div>

<div id="view-list" class="detail active">
<div class="cd">
<h2>📋 功法分类</h2>
<div id="cat-tabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
<div id="qigong-list"></div>
</div>
</div>

<div id="view-detail" class="detail">
<div class="cd" id="detail-card" style="display:none">
<h2 id="qd-title">功法详情</h2>
<div id="qd-content"></div>
</div>
<div class="cd" id="detail-empty"><div class="empty">请从功法列表中选择一项</div></div>
</div>

<div id="view-plan" class="detail">
<div class="cd">
<h2>📅 每周练习计划</h2>
<div class="plan-grid" id="plan-grid"></div>
<div id="plan-detail" style="margin-top:12px"></div>
</div>
<div class="cd">
<h2>➕ 添加练习</h2>
<label>选择功法</label>
<select id="plan-exercise"></select>
<label>选择星期</label>
<select id="plan-day"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="0">周日</option></select>
<label>时长（分钟）</label>
<input type="number" id="plan-duration" value="20" min="5" max="120">
<button onclick="savePlan()" style="width:100%;margin-top:8px">添加到计划</button>
</div>
</div>

<div id="view-record" class="detail">
<div class="cd">
<h2>📊 练习统计</h2>
<div class="stats">
<div class="stat"><div class="stat-num" id="total-sessions">0</div><div class="stat-label">总次数</div></div>
<div class="stat"><div class="stat-num" id="total-hours">0</div><div class="stat-label">总小时</div></div>
<div class="stat"><div class="stat-num" id="streak-days">0</div><div class="stat-label">连续天数</div></div>
</div>
</div>
<div class="cd">
<h2>📝 记录练习</h2>
<label>功法名称</label>
<select id="log-exercise"></select>
<label>时长（分钟）</label>
<input type="number" id="log-duration" value="20" min="5" max="180">
<label>感受</label>
<select id="log-feeling"><option>很好</option><option>一般</option><option>疲惫</option></select>
<label>备注</label>
<textarea id="log-note" rows="2" placeholder="可选"></textarea>
<button onclick="saveLog()" style="width:100%;margin-top:8px">保存记录</button>
</div>
<div class="cd">
<h2>📅 近期记录</h2>
<div id="recent-logs"></div>
</div>
</div>
</div>

  {name:'养生功',origin:'综合创编',category:'保健气功',difficulty:'简单',duration:'15-20分钟',desc:'综合多种养生方法的气功，适合日常保健。',breathing:'自然腹式呼吸',benefits:['日常保健','调理脏腑','增强免疫','简单易学'],steps:['全身放松站立','头部运动','肩部运动','腰部运动','膝部运动','整理收功']}

let activeCategory = '养生气功';
let currentQigong = null;
let plan = JSON.parse(localStorage.getItem('qigong-plan') || '{}');
const categories = [...new Set(qigong.map(q => q.category))];
const dayNames = ['周日','周一','周二','周三','周四','周五','周六'];

function loadData() { return JSON.parse(localStorage.getItem('qigong-data') || '{"records":[]}'); }
function saveData(d) { localStorage.setItem('qigong-data', JSON.stringify(d)); }
function savePlanData() { localStorage.setItem('qigong-plan', JSON.stringify(plan)); }

function renderCatTabs() {
  document.getElementById('cat-tabs').innerHTML = categories.map(c =>
    `<div class="tab ${c === activeCategory ? 'active' : ''}" onclick="switchCategory('${c}')" style="padding:6px 12px;font-size:.8rem">${c}</div>`
  ).join('');
}

function switchCategory(c) { activeCategory = c; renderCatTabs(); renderList(); }

function renderList() {
  const filtered = qigong.filter(q => q.category === activeCategory);
  document.getElementById('qigong-list').innerHTML = filtered.map(q => {
    const idx = qigong.indexOf(q);
    return `<div class="li" onclick="showDetail(${idx})">
      <div><strong>${q.name}</strong><br><span style="color:var(--text2);font-size:.85rem">${q.origin} · ${q.difficulty} · ${q.duration}</span></div>
      <span class="tag s">${q.benefits.length}种功效</span>
    </div>`;
  }).join('');
}

function showDetail(i) {
  currentQigong = i;
  const q = qigong[i];
  document.getElementById('detail-card').style.display = 'block';
  document.getElementById('detail-empty').style.display = 'none';
  document.getElementById('qd-title').textContent = q.name;
  document.getElementById('qd-content').innerHTML = `
    <p style="margin-bottom:12px;color:var(--text2)">${q.desc}</p>
    <div style="margin-bottom:8px"><span class="tag s">${q.difficulty}</span> <span class="tag w" style="margin-left:4px">${q.duration}</span> <span class="tag b" style="margin-left:4px">${q.origin}</span></div>
    <div style="margin-bottom:8px"><strong>呼吸方法：</strong><span class="tag w">${q.breathing}</span></div>
    <div style="margin-bottom:12px"><strong>功效：</strong>${q.benefits.map(b => `<span class="tag s" style="margin:2px">${b}</span>`).join('')}</div>
    <div><strong>功法步骤：</strong>${q.steps.map((s, j) => `<div class="step"><span class="step-num">${j+1}.</span>${s}</div>`).join('')}</div>`;
}

// Plan
function renderPlan() {
  const grid = document.getElementById('plan-grid');
  grid.innerHTML = [1,2,3,4,5,6,0].map(d => {
    const items = plan[d] || [];
    return `<div class="plan-day ${items.length ? 'filled' : ''}" onclick="showPlanDay(${d})">
      <div class="day-name">${dayNames[d]}</div>
      <div class="day-exercise">${items.length ? items.length + '项' : '空'}</div>
    </div>`;
  }).join('');

  const sel = document.getElementById('plan-exercise');
  sel.innerHTML = qigong.map((q, i) => `<option value="${i}">${q.name}</option>`).join('');
}

function showPlanDay(d) {
  const items = plan[d] || [];
  document.getElementById('plan-detail').innerHTML = items.length ? items.map((item, i) => `
    <div class="log-item">
      <div><strong>${qigong[item.exercise].name}</strong><br><span class="log-date">${item.duration}分钟</span></div>
      <button class="sec" onclick="removePlanItem(${d},${i})" style="padding:4px 8px;font-size:.75rem">删除</button>
    </div>
  `).join('') : `<div class="empty">${dayNames[d]}暂无练习计划</div>`;
}

function savePlan() {
  const exercise = parseInt(document.getElementById('plan-exercise').value);
  const day = document.getElementById('plan-day').value;
  const duration = parseInt(document.getElementById('plan-duration').value);
  if (!plan[day]) plan[day] = [];
  plan[day].push({exercise, duration});
  savePlanData();
  renderPlan();
  alert('✅ 已添加到计划');
}

function removePlanItem(day, idx) {
  plan[day].splice(idx, 1);
  savePlanData();
  renderPlan();
  showPlanDay(day);
}

// Record
function populateSelects() {
  const html = qigong.map((q, i) => `<option value="${i}">${q.name}</option>`).join('');
  document.getElementById('log-exercise').innerHTML = html;
}

function saveLog() {
  const exercise = parseInt(document.getElementById('log-exercise').value);
  const duration = parseInt(document.getElementById('log-duration').value);
  const feeling = document.getElementById('log-feeling').value;
  const note = document.getElementById('log-note').value;
  const data = loadData();
  data.records.push({
    date: new Date().toISOString().split('T')[0],
    exercise: qigong[exercise].name, duration, feeling, note, timestamp: Date.now()
  });
  saveData(data);
  alert('✅ 已记录');
  renderRecordStats();
}

function renderRecordStats() {
  const data = loadData();
  const records = data.records;
  document.getElementById('total-sessions').textContent = records.length;
  document.getElementById('total-hours').textContent = (records.reduce((s, r) => s + r.duration, 0) / 60).toFixed(1);
  const dates = [...new Set(records.map(r => r.date))].sort().reverse();
  let streak = 0, checkDate = new Date();
  while (dates.includes(checkDate.toISOString().split('T')[0])) { streak++; checkDate.setDate(checkDate.getDate() - 1); }
  document.getElementById('streak-days').textContent = streak;
  const recent = records.slice(-7).reverse();
  document.getElementById('recent-logs').innerHTML = recent.length ? recent.map(r => `
    <div class="log-item">
      <div><strong>${r.exercise}</strong><br><span class="log-date">${r.date} · ${r.duration}分钟 · ${r.feeling}</span></div>
      <span class="tag s">✓</span>
    </div>
  `).join('') : '<div class="empty">暂无记录</div>';
}

// Tabs
document.querySelectorAll('#tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'plan') renderPlan();
    if (tab.dataset.tab === 'record') renderRecordStats();
  });
});

renderCatTabs();
renderList();
populateSelects();
</script>
</body>
</html>
