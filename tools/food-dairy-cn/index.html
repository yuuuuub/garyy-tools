<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📔 饮食日记</title>
<meta name="description" content="记录每日饮食日记，追踪饮食习惯和营养摄入">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px;margin-bottom:2px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.diary-entry{padding:12px;border-bottom:1px solid var(--border)}.diary-entry:last-child{border-bottom:none}
.diary-date{font-weight:600;color:var(--accent);font-size:.9rem;margin-bottom:4px}
.diary-food{color:var(--text);font-size:.9rem}.diary-note{color:var(--text2);font-size:.8rem;margin-top:4px;font-style:italic}
.diary-mood{display:inline-block;margin-left:8px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📔</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📔 饮食日记">
<meta property="og:description" content="记录每日饮食日记，追踪饮食习惯和营养摄入">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/food-dairy-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📔 饮食日记</h1><p>记录每一餐，了解自己的饮食习惯</p></div>

<div class="cd"><h2>记录饮食</h2>
<label>日期</label><input type="date" id="entryDate">
<label>今日吃了什么？</label><textarea id="foodContent" placeholder="如：早上吃了豆浆油条，中午吃的食堂快餐..."></textarea>
<label>感受 / 备注</label><textarea id="foodNote" placeholder="如：今天吃得很满足，晚上有点吃撑了" style="min-height:50px"></textarea>
<label>饮食心情</label>
<div class="bg" id="moodBtns" style="margin-top:4px"></div>
<div class="bg"><button onclick="addEntry()">📝 记录今日饮食</button></div></div>

<div class="cd"><h2>饮食日记</h2>
<div class="fr" style="margin-bottom:12px">
<div><input type="text" id="searchEntry" placeholder="搜索日记..." oninput="renderEntries()"></div>
<div><select id="filterMonth" onchange="renderEntries()"><option value="">全部月份</option></select></div>
</div>
<div id="entryList"></div></div>

<div class="cd"><h2>📊 饮食统计</h2><div id="statsArea"></div></div>
</div>
<script>
(function(){
var DB='food_diary_cn';
var entries=JSON.parse(localStorage.getItem(DB)||'[]');
var moods=['😊','😐','😟','🤢','🤤'];
var selectedMood='';

(function initDate(){
var d=new Date();
document.getElementById('entryDate').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
})();

function renderMoodBtns(){
document.getElementById('moodBtns').innerHTML=moods.map(function(m){
return '<button onclick="pickMood(\''+m+'\')" style="font-size:1.3rem;padding:6px 12px;'+(selectedMood===m?'border:2px solid var(--accent);background:rgba(59,130,246,.15)':'background:var(--bg);border:1px solid var(--border)')+'">'+m+'</button>';
}).join('');
}
window.pickMood=function(m){selectedMood=m;renderMoodBtns();};

window.addEntry=function(){
var date=document.getElementById('entryDate').value;
var food=document.getElementById('foodContent').value.trim();
var note=document.getElementById('foodNote').value.trim();
if(!food){alert('请输入今天吃了什么');return;}
entries.push({date:date,food:food,note:note,mood:selectedMood,id:Date.now()});
localStorage.setItem(DB,JSON.stringify(entries));
document.getElementById('foodContent').value='';document.getElementById('foodNote').value='';selectedMood='';renderMoodBtns();
renderEntries();renderStats();
};

window.delEntry=function(id){entries=entries.filter(function(e){return e.id!==id});localStorage.setItem(DB,JSON.stringify(entries));renderEntries();renderStats();};

function renderEntries(){
var search=(document.getElementById('searchEntry').value||'').toLowerCase();
var monthFilter=document.getElementById('filterMonth').value;
var filtered=entries.filter(function(e){
if(search&&e.food.toLowerCase().indexOf(search)===-1&&e.note.toLowerCase().indexOf(search)===-1)return false;
if(monthFilter&&e.date.indexOf(monthFilter)!==0)return false;
return true;
}).sort(function(a,b){return b.date.localeCompare(a.date)||b.id-a.id});

var months=new Set(entries.map(function(e){return e.date.slice(0,7)}));
var sel=document.getElementById('filterMonth');
var curVal=sel.value;
sel.innerHTML='<option value="">全部月份</option>';
Array.from(months).sort().reverse().forEach(function(m){sel.innerHTML+='<option value="'+m+'"'+(m===curVal?' selected':'')+'>'+m+'</option>';});

var el=document.getElementById('entryList');
if(!filtered.length){el.innerHTML='<div class="es">暂无日记记录</div>';return;}
el.innerHTML=filtered.map(function(e){
return '<div class="diary-entry"><div class="diary-date">'+e.date+(e.mood?'<span class="diary-mood">'+e.mood+'</span>':'')+'</div><div class="diary-food">'+escHtml(e.food)+'</div>'+(e.note?'<div class="diary-note">💬 '+escHtml(e.note)+'</div>':'')+'<div style="margin-top:8px"><button class="dng" style="padding:2px 10px;font-size:.75rem" onclick="delEntry('+e.id+')">删除</button></div></div>';
}).join('');
}

function renderStats(){
var total=entries.length;
var moodsCount={};entries.forEach(function(e){if(e.mood)moodsCount[e.mood]=(moodsCount[e.mood]||0)+1});
var el=document.getElementById('statsArea');
if(!total){el.innerHTML='<div class="es">暂无统计数据</div>';return;}
var topMood='';var topCount=0;
Object.keys(moodsCount).forEach(function(m){if(moodsCount[m]>topCount){topCount=moodsCount[m];topMood=m;}});
var avgLen=Math.round(entries.reduce(function(s,e){return s+e.food.length},0)/total);
el.innerHTML='<div class="li"><span>总日记数</span><strong>'+total+' 篇</strong></div>'+
'<div class="li"><span>平均每次记录字数</span><strong>'+avgLen+' 字</strong></div>'+
'<div class="li"><span>最常出现的心情</span><strong>'+(topMood||'未记录')+' ('+topCount+'次)</strong></div>'+
'<div class="li"><span>记录天数</span><strong>'+new Set(entries.map(function(e){return e.date})).size+' 天</strong></div>';
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
renderMoodBtns();renderEntries();renderStats();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
