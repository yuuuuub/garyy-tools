<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎡 幸运大转盘</title>
  <meta name="description" content="幸运大转盘抽奖，转盘随机抽取奖品和结果">
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-card: #16213e;
      --text: #e0e0e0;
      --accent: #e94560;
      --gold: #ffd700;
      --accent-glow: rgba(233, 69, 96, 0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(233, 69, 96, 0.15) 0%, transparent 70%),
        radial-gradient(ellipse at 80% 100%, rgba(255, 215, 0, 0.08) 0%, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      text-shadow: none;
      animation: titleShine 3s ease-in-out infinite;
    }
    @keyframes titleShine {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
    }

    /* Wheel Area */
    .wheel-wrapper {
      position: relative;
      width: min(320px, 80vw);
      height: min(320px, 80vw);
    }
    .pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid #ffd700;
      filter: drop-shadow(0 2px 6px rgba(255, 215, 0, 0.7))
              drop-shadow(0 0 12px rgba(255, 215, 0, 0.3));
      animation: pointerPulse 1.5s ease-in-out infinite;
    }
    @keyframes pointerPulse {
      0%, 100% { filter: drop-shadow(0 2px 6px rgba(255, 215, 0, 0.7)) drop-shadow(0 0 12px rgba(255, 215, 0, 0.3)); }
      50% { filter: drop-shadow(0 2px 8px rgba(255, 215, 0, 1)) drop-shadow(0 0 20px rgba(255, 215, 0, 0.5)); }
    }
    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow:
        0 0 30px rgba(233, 69, 96, 0.3),
        0 0 60px rgba(255, 215, 0, 0.15),
        inset 0 0 20px rgba(0, 0, 0, 0.3);
    }

    /* Result */
    .result-area {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .result-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
      padding: 8px 20px;
      border-radius: 20px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .result-text.show {
      opacity: 1;
      transform: translateY(0);
    }
    .result-text.win {
      background: rgba(233, 69, 96, 0.2);
      border-color: rgba(233, 69, 96, 0.5);
      color: #ff6b6b;
      animation: winGlow 0.6s ease-in-out;
    }
    @keyframes winGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(233, 69, 96, 0.3); }
      50% { box-shadow: 0 0 30px rgba(233, 69, 96, 0.6); }
    }

    /* Button */
    .btn-spin {
      width: 180px;
      height: 52px;
      border: none;
      border-radius: 26px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      background: linear-gradient(135deg, #e94560, #c0392b);
      box-shadow: 0 4px 20px var(--accent-glow);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .btn-spin:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(233, 69, 96, 0.5);
    }
    .btn-spin:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-spin:disabled {
      background: #555;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .btn-spin::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.2) 50%, transparent 60%);
      animation: btnShimmer 3s infinite;
    }
    @keyframes btnShimmer {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }

    /* Info */
    .info {
      font-size: 13px;
      color: #888;
      text-align: center;
    }
    .info .count {
      color: var(--gold);
      font-weight: 700;
    }
    .btn-reset {
      background: none;
      border: none;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 4px;
      padding: 4px 8px;
    }
    .btn-reset:hover { color: var(--text); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      max-width: 300px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .modal-overlay.show .modal {
      transform: scale(1);
    }
    .modal-icon {
      font-size: 56px;
      margin-bottom: 12px;
      animation: modalBounce 0.6s ease-in-out;
    }
    @keyframes modalBounce {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      70% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .modal-prize {
      font-size: 24px;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .modal-desc {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 20px;
    }
    .btn-close {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 10px 32px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-close:hover { opacity: 0.9; transform: scale(1.05); }

    /* Settings Toggle */
    .settings-toggle {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #888;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .settings-toggle:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
    .settings-panel {
      width: 100%;
      background: var(--bg-card);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .settings-panel.open { display: flex; }
    .settings-title {
      font-size: 14px;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 4px;
    }
    .prize-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .prize-row .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .prize-row input[type="text"] {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      min-width: 0;
    }
    .prize-row input[type="number"] {
      width: 48px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      padding: 6px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
    }
    .prize-row input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .prize-row .weight-label {
      color: #888;
      font-size: 11px;
      width: 20px;
      text-align: center;
    }
    .btn-apply {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 8px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
      transition: opacity 0.2s;
    }
    .btn-apply:hover { opacity: 0.85; }

    /* Confetti */
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200;
    }
    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: confettiFall 2s ease-out forwards;
    }
    @keyframes confettiFall {
      0% {
        transform: translateY(-100px) rotate(0deg) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(720deg) scale(0.3);
        opacity: 0;
      }
    }
  </style>

<body>
  <div class="container">
    <h1>🎡 幸运大转盘</h1>

    <div class="wheel-wrapper" id="wheelWrapper">
      <div class="pointer" id="pointer"></div>
      <canvas id="wheelCanvas"></canvas>
    </div>

    <div class="result-area">
      <div class="result-text" id="resultText"></div>
    </div>

    <button class="btn-spin" id="spinBtn" onclick="spin()">🎰 开始抽奖</button>

    <div class="info">
      <span>今日剩余次数：<span class="count" id="remainCount">3</span> / 3</span>
      <br>
      <button class="btn-reset" onclick="resetDaily()">重置今日次数（调试）</button>
    </div>

    <button class="settings-toggle" onclick="toggleSettings()">
      ⚙️ 自定义奖品与概率
    </button>

    <div class="settings-panel" id="settingsPanel">
      <div class="settings-title">奖品名称 & 权重（数值越大中奖概率越高）</div>
      <div id="prizeEditor"></div>
      <button class="btn-apply" onclick="applySettings()">✅ 应用设置</button>
    </div>
  </div>

  <!-- Result Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-icon" id="modalIcon">🎉</div>
      <div class="modal-prize" id="modalPrize"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <button class="btn-close" onclick="closeModal()">知道了</button>
    </div>
  </div>

  <!-- Confetti Container -->
  <div class="confetti-container" id="confettiContainer"></div>

  <script>
    // ============ 数据定义 ============
    const STORAGE_KEY = 'lucky_wheel_data';
    const SEGMENT_COLORS = [
      '#FF477E', '#FFD166', '#06D6A0', '#118AB2',
      '#EF476F', '#F4A261', '#9B5DE5', '#00D2D3'
    ];

    let prizes = [
      { name: '谢谢参与', weight: 50 },
      { name: '再来一次', weight: 20 },
      { name: '奶茶一杯', weight: 10 },
      { name: '电影票', weight: 5 },
      { name: '豪华大餐', weight: 5 },
      { name: '现金红包', weight: 5 },
      { name: '年假一天', weight: 4 },
      { name: '超级大奖', weight: 1 },
    ];

    // ============ Canvas 绘制 ============
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('wheelWrapper');

    let rotation = 0;
    let isSpinning = false;
    let animationId = null;

    function resizeCanvas() {
      const size = wrapper.clientWidth;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      drawWheel();
    }

    function drawWheel() {
      const size = canvas.width / (window.devicePixelRatio || 1);
      const cx = size / 2;
      const cy = size / 2;
      const radius = size / 2 - 16;
      const n = prizes.length;
      const segAngle = (2 * Math.PI) / n;

      ctx.clearRect(0, 0, size, size);

      // 外圈光晕
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 8, 0, 2 * Math.PI);
      const glowGrad = ctx.createRadialGradient(cx, cy, radius - 4, cx, cy, radius + 10);
      glowGrad.addColorStop(0, 'transparent');
      glowGrad.addColorStop(0.5, 'rgba(255,215,0,0.08)');
      glowGrad.addColorStop(1, 'rgba(233,69,96,0.15)');
      ctx.fillStyle = glowGrad;
      ctx.fill();
      ctx.restore();

      // 绘制扇形
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      for (let i = 0; i < n; i++) {
        const startAngle = -Math.PI / 2 + i * segAngle;
        const endAngle = startAngle + segAngle;

        // 扇形填充
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle);
        ctx.closePath();

        const color = SEGMENT_COLORS[i % SEGMENT_COLORS.length];
        const grad = ctx.createRadialGradient(0, 0, radius * 0.2, 0, 0, radius);
        grad.addColorStop(0, lightenColor(color, 30));
        grad.addColorStop(0.6, color);
        grad.addColorStop(1, darkenColor(color, 20));
        ctx.fillStyle = grad;
        ctx.fill();

        // 扇形边框
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 文字
        ctx.save();
        const midAngle = startAngle + segAngle / 2;
        ctx.rotate(midAngle);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(12, radius * 0.12)}px "PingFang SC","Microsoft YaHei",sans-serif`;
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 3;
        const textRadius = radius * 0.72;
        ctx.fillText(prizes[i].name, textRadius, 5);
        ctx.restore();
      }

      // 中心圆
      const centerGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius * 0.18);
      centerGrad.addColorStop(0, '#fff');
      centerGrad.addColorStop(0.6, '#e0e0e0');
      centerGrad.addColorStop(1, '#999');
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.16, 0, 2 * Math.PI);
      ctx.fillStyle = centerGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 中心点
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, 2 * Math.PI);
      ctx.fillStyle = '#333';
      ctx.fill();

      ctx.restore();

      // 外边框（静止）
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
      ctx.strokeStyle = 'rgba(255,215,0,0.4)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 装饰小圆点
      const dotCount = 24;
      for (let i = 0; i < dotCount; i++) {
        const angle = (i / dotCount) * 2 * Math.PI;
        const dx = cx + Math.cos(angle) * (radius + 6);
        const dy = cy + Math.sin(angle) * (radius + 6);
        ctx.beginPath();
        ctx.arc(dx, dy, 2.5, 0, 2 * Math.PI);
        ctx.fillStyle = i % 2 === 0 ? '#ffd700' : '#ff6b6b';
        ctx.fill();
      }
      ctx.restore();
    }

    function lightenColor(hex, percent) {
      const num = parseInt(hex.replace('#', ''), 16);
      const r = Math.min(255, (num >> 16) + Math.round(2.55 * percent));
      const g = Math.min(255, ((num >> 8) & 0x00FF) + Math.round(2.55 * percent));
      const b = Math.min(255, (num & 0x0000FF) + Math.round(2.55 * percent));
      return `rgb(${r},${g},${b})`;
    }

    function darkenColor(hex, percent) {
      const num = parseInt(hex.replace('#', ''), 16);
      const r = Math.max(0, (num >> 16) - Math.round(2.55 * percent));
      const g = Math.max(0, ((num >> 8) & 0x00FF) - Math.round(2.55 * percent));
      const b = Math.max(0, (num & 0x0000FF) - Math.round(2.55 * percent));
      return `rgb(${r},${g},${b})`;
    }

    // ============ 旋转逻辑 ============
    function getResultIndex() {
      const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
      if (totalWeight <= 0) return 0;
      let rand = Math.random() * totalWeight;
      for (let i = 0; i < prizes.length; i++) {
        rand -= prizes[i].weight;
        if (rand <= 0) return i;
      }
      return prizes.length - 1;
    }

    function getTargetAngle(targetIndex) {
      const n = prizes.length;
      const segAngle = (2 * Math.PI) / n;
      // 扇区 i 的绘制角度范围: [-PI/2 + i*segAngle, -PI/2 + (i+1)*segAngle]
      // 指针在顶部 (-PI/2)，所以指针指向扇区中心时:
      //   需要 rotation + (-PI/2 + (i+0.5)*segAngle) = -PI/2
      //   需要 rotation + (i+0.5)*segAngle = 0
      //   rotation = -(i+0.5)*segAngle
      let baseAngle = -(targetIndex + 0.5) * segAngle;
      // 归一化到 [0, 2PI)
      baseAngle = ((baseAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      // 扇区内随机偏移（±40% 扇区宽度）
      const jitter = (Math.random() - 0.5) * segAngle * 0.8;
      // 加 5-8 圈
      const fullSpins = (5 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
      return fullSpins + baseAngle + jitter;
    }

    function spin() {
      if (isSpinning) return;

      const daily = getDailyData();
      if (daily.count >= 3) {
        showResultModal(-1);
        return;
      }

      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('resultText').classList.remove('show', 'win');

      const resultIndex = getResultIndex();
      const targetAngle = getTargetAngle(resultIndex);
      const startAngle = rotation;
      const duration = 4000 + Math.random() * 1000; // 4-5 秒
      const startTime = performance.now();

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        // easeOutCubic
        const eased = 1 - Math.pow(1 - progress, 3);
        rotation = startAngle + (targetAngle - startAngle) * eased;
        drawWheel();

        if (progress < 1) {
          animationId = requestAnimationFrame(animate);
        } else {
          rotation = startAngle + targetAngle;
          drawWheel();
          isSpinning = false;
          animationId = null;

          // 记录次数
          daily.count++;
          saveDailyData(daily);
          updateRemainCount();

          // 显示结果
          showResult(resultIndex);
          document.getElementById('spinBtn').disabled = daily.count >= 3;
        }
      }

      animationId = requestAnimationFrame(animate);
    }

    function showResult(index) {
      const resultEl = document.getElementById('resultText');
      const prize = prizes[index];
      resultEl.textContent = `🎯 ${prize.name}`;
      resultEl.classList.add('show');
      const isWin = index > 1; // 谢谢参与和再来一次不算中奖
      if (isWin) resultEl.classList.add('win');
      else resultEl.classList.remove('win');

      if (isWin) showConfetti();

      setTimeout(() => showResultModal(index), 600);
    }

    // ============ 弹窗 ============
    function showResultModal(index) {
      const overlay = document.getElementById('modalOverlay');
      const icon = document.getElementById('modalIcon');
      const prizeEl = document.getElementById('modalPrize');
      const descEl = document.getElementById('modalDesc');

      if (index === -1) {
        // 次数用完
        icon.textContent = '😢';
        prizeEl.textContent = '今日次数已用完';
        descEl.textContent = '明天再来试试手气吧！';
        overlay.classList.add('show');
        return;
      }

      const prize = prizes[index];
      if (index <= 1) {
        icon.textContent = index === 0 ? '😅' : '🔄';
        prizeEl.textContent = prize.name;
        descEl.textContent = index === 0 ? '别灰心，下次一定中！' : '再转一次试试运气！';
      } else {
        const icons = ['🧋', '🎬', '🍽️', '🧧', '🏖️', '🏆'];
        icon.textContent = icons[index - 2] || '🎉';
        prizeEl.textContent = `恭喜获得：${prize.name}`;
        descEl.textContent = '太棒了！快去兑奖吧~';
        prizeEl.style.color = SEGMENT_COLORS[index % SEGMENT_COLORS.length];
      }
      overlay.classList.add('show');
    }

    function closeModal(event) {
      if (event && event.target !== document.getElementById('modalOverlay')) {
        // 点击非 overlay 背景不关闭
      }
      document.getElementById('modalOverlay').classList.remove('show');
    }

    // ============ 彩纸效果 ============
    function showConfetti() {
      const container = document.getElementById('confettiContainer');
      const colors = ['#FF477E', '#FFD166', '#06D6A0', '#118AB2', '#EF476F', '#F4A261', '#9B5DE5', '#00D2D3', '#ffd700'];
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < 60; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = -(Math.random() * 20 + 5) + 'px';
        piece.style.width = (Math.random() * 8 + 6) + 'px';
        piece.style.height = (Math.random() * 8 + 6) + 'px';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
        piece.style.animationDelay = Math.random() * 0.5 + 's';
        fragment.appendChild(piece);
      }
      container.appendChild(fragment);

      setTimeout(() => {
        container.innerHTML = '';
      }, 3000);
    }

    // ============ 每日次数管理 ============
    function getDailyData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { date: '', count: 0 };
        const data = JSON.parse(raw);
        const today = new Date().toDateString();
        if (data.date !== today) return { date: today, count: 0 };
        return data;
      } catch (e) {
        return { date: '', count: 0 };
      }
    }

    function saveDailyData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) { /* ignore */ }
    }

    function updateRemainCount() {
      const daily = getDailyData();
      const remain = Math.max(0, 3 - daily.count);
      document.getElementById('remainCount').textContent = remain;
      document.getElementById('spinBtn').disabled = remain <= 0 || isSpinning;
    }

    function resetDaily() {
      localStorage.removeItem(STORAGE_KEY);
      updateRemainCount();
      document.getElementById('resultText').classList.remove('show', 'win');
      document.getElementById('resultText').textContent = '';
    }

    // ============ 设置面板 ============
    function toggleSettings() {
      document.getElementById('settingsPanel').classList.toggle('open');
      if (document.getElementById('settingsPanel').classList.contains('open')) {
        renderPrizeEditor();
      }
    }

    function renderPrizeEditor() {
      const container = document.getElementById('prizeEditor');
      container.innerHTML = prizes.map((p, i) => `
        <div class="prize-row">
          <span class="color-dot" style="background:${SEGMENT_COLORS[i % SEGMENT_COLORS.length]}"></span>
          <input type="text" value="${escapeHtml(p.name)}" data-index="${i}" data-field="name" maxlength="6">
          <span class="weight-label">权重</span>
          <input type="number" value="${p.weight}" data-index="${i}" data-field="weight" min="0" max="100">
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function applySettings() {
      const rows = document.querySelectorAll('#prizeEditor .prize-row');
      rows.forEach(row => {
        const nameInput = row.querySelector('[data-field="name"]');
        const weightInput = row.querySelector('[data-field="weight"]');
        const idx = parseInt(nameInput.dataset.index);
        prizes[idx].name = nameInput.value.trim() || prizes[idx].name;
        prizes[idx].weight = Math.max(0, parseInt(weightInput.value) || 0);
      });

      // 确保至少有一个 prize 有权重
      const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
      if (totalWeight === 0) {
        prizes.forEach(p => p.weight = 1);
        renderPrizeEditor();
      }

      document.getElementById('settingsPanel').classList.remove('open');
      drawWheel();
      document.getElementById('resultText').classList.remove('show', 'win');
      document.getElementById('resultText').textContent = '';
    }

    // ============ 初始化 ============
    function init() {
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      updateRemainCount();
    }

    init();
  </script>
</body>
</html>
