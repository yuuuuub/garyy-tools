<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>折旧计算器</title>
<meta name="description" content="固定资产折旧计算器，支持直线法和加速折旧">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vhscroll-behavior:smooth;padding:16px;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.result-big{text-align:center;padding:18px}
.result-big .label{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.result-big .value{font-size:2rem;font-weight:700}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.stat-card{text-align:center;padding:14px;background:var(--bg);border-radius:var(--radius)}
.stat-card .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:1.1rem;font-weight:700}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.detail-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
.detail-table th,.detail-table td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}
.detail-table th{color:var(--text2);font-weight:500;background:var(--bg)}
.detail-table td:first-child,.detail-table th:first-child{text-align:left}
.detail-table tr:last-child td{border-bottom:none}
.table-wrap{max-height:350px;overflow-y:auto}
.table-wrap::-webkit-scrollbar{width:4px}
.table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.chart-bar-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.chart-bar-row .label{min-width:50px;font-size:.75rem;color:var(--text2)}
.chart-bar-row .bar-track{flex:1;height:16px;background:var(--bg);border-radius:4px;overflow:hidden}
.chart-bar-row .bar-fill{height:100%;border-radius:4px;transition:width .5s}
.chart-bar-row .val{min-width:60px;text-align:right;font-size:.75rem;font-weight:600}
.preset-group{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.preset-btn{padding:4px 12px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;background:var(--card);color:var(--text);cursor:pointer;transition:all .2s}
.preset-btn:hover{border-color:var(--blue);color:var(--blue)}
@media(max-width:640px){.form-row{flex-direction:column}.grid-3{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📉</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="折旧计算器">
<meta property="og:description" content="固定资产折旧计算器，支持直线法和加速折旧">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/depreciation-calculator/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📉 折旧计算器</h1>
    <p>固定资产折旧计算与明细</p>
  </header>

  <div class="card">
    <div class="form-row">
      <div class="group"><label>资产原值 (元)</label><input type="number" id="originalValue" value="500000" min="0" step="any"></div>
      <div class="group"><label>残值率 (%)</label><input type="number" id="residualRate" value="5" min="0" max="100" step="any"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>使用年限 (年)</label><input type="number" id="usefulLife" value="5" min="1" max="50" step="1"></div>
      <div class="group"><label>折旧方法</label>
        <select id="method"><option value="straight">年限平均法 (直线法)</option><option value="ddb">双倍余额递减法</option><option value="syd">年数总和法</option></select>
      </div>
    </div>
    <div class="preset-group" id="presets"></div>
  </div>

  <div class="card">
    <div class="section-title">📊 折旧概要</div>
    <div class="result-big"><div class="label">年折旧额</div><div class="value" style="color:var(--blue)" id="yearlyDep">¥0</div></div>
    <div class="grid-3" id="statGrid"></div>
  </div>

  <div class="card">
    <div class="section-title">📊 年度折旧构成</div>
    <div id="bars"></div>
  </div>

  <div class="card">
    <div class="section-title">📋 折旧明细表</div>
    <div class="table-wrap"><table class="detail-table" id="depTable"></table></div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});

const presets=[
  {name:'电脑设备(3年)',originalValue:10000,residualRate:5,usefulLife:3},
  {name:'办公家具(5年)',originalValue:50000,residualRate:5,usefulLife:5},
  {name:'机器设备(10年)',originalValue:500000,residualRate:5,usefulLife:10},
  {name:'房屋建筑(20年)',originalValue:5000000,residualRate:5,usefulLife:20},
  {name:'车辆(4年)',originalValue:200000,residualRate:5,usefulLife:4}
];

$('presets').innerHTML=presets.map(p=>`<button class="preset-btn" onclick="applyPreset(${JSON.stringify(p).replace(/"/g,'&quot;')})">${p.name}</button>`).join('');

window.applyPreset=function(p){
  $('originalValue').value=p.originalValue;
  $('residualRate').value=p.residualRate;
  $('usefulLife').value=p.usefulLife;
  calc();
};

function calc(){
  const original=+$('originalValue').value||0;
  const residualPct=+$('residualRate').value||0;
  const life=+$('usefulLife').value||5;
  const method=$('method').value;
  const residual=original*residualPct/100;
  const depreciable=original-residual;
  let schedule=[];

  if(method==='straight'){
    const annualDep=depreciable/life;
    for(let y=1;y<=life;y++){
      const begin=y===1?original:schedule[y-2].end;
      const dep=annualDep;
      const accum=y*annualDep;
      const end=original-accum;
      schedule.push({year:y,begin,dep,accum,end});
    }
  }else if(method==='ddb'){
    const rate=2/life;
    let accum=0;
    for(let y=1;y<=life;y++){
      const begin=y===1?original:schedule[y-2].end;
      let dep;
      if(y<=life-2){
        dep=begin*rate;
      }else{
        dep=(begin-residual)/(life-y+1);
      }
      dep=Math.min(dep,begin-residual);
      if(dep<0)dep=0;
      accum+=dep;
      const end=original-accum;
      schedule.push({year:y,begin,dep,accum,end});
    }
  }else{
    const sumYears=life*(life+1)/2;
    for(let y=1;y<=life;y++){
      const begin=y===1?original:schedule[y-2].end;
      const dep=depreciable*(life-y+1)/sumYears;
      const accum=(y===1?0:schedule[y-2].accum)+dep;
      const end=original-accum;
      schedule.push({year:y,begin,dep,accum,end});
    }
  }

  const firstYearDep=schedule[0]?.dep||0;
  const monthlyDep=firstYearDep/12;
  const depRate=original>0?(firstYearDep/original*100):0;

  $('yearlyDep').textContent='¥'+fmt(firstYearDep);
  $('statGrid').innerHTML=`
    <div class="stat-card"><div class="label">月折旧额</div><div class="value" style="color:var(--green)">¥${fmt(monthlyDep)}</div></div>
    <div class="stat-card"><div class="label">折旧率</div><div class="value" style="color:var(--gold)">${depRate.toFixed(2)}%</div></div>
    <div class="stat-card"><div class="label">残值</div><div class="value" style="color:var(--text2)">¥${fmt(residual)}</div></div>
  `;

  const maxDep=Math.max(...schedule.map(s=>s.dep),1);
  $('bars').innerHTML=schedule.map(s=>{
    const pct=s.dep/maxDep*100;
    const hue=120-(s.year/life*120);
    return `<div class="chart-bar-row"><div class="label">第${s.year}年</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:hsl(${hue},70%,50%)"></div></div><div class="val">¥${fmt(s.dep)}</div></div>`;
  }).join('');

  let tHead=`<thead><tr><th>年份</th><th>期初价值</th><th>折旧额</th><th>累计折旧</th><th>期末净值</th></tr></thead>`;
  let tRows=schedule.map(s=>`<tr><td>第${s.year}年</td><td>¥${fmt(s.begin)}</td><td style="color:var(--blue)">¥${fmt(s.dep)}</td><td>¥${fmt(s.accum)}</td><td style="color:${s.end>0?'var(--green)':'var(--text2)'}">¥${fmt(s.end)}</td></tr>`).join('');
  $('depTable').innerHTML=tHead+'<tbody>'+tRows+'</tbody>';
}

calc();
[$('originalValue'),$('residualRate'),$('usefulLife'),$('method')].forEach(el=>{el.addEventListener('input',calc);el.addEventListener('change',calc)});
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
