<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📸 截图工具</title>
<meta name="description" content="截图工具，在线网页截图与屏幕区域捕获工具">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s}
.upload-area:hover{border-color:var(--accent);background:var(--tag-bg)}
.upload-icon{font-size:48px;margin-bottom:8px}
.upload-text{font-size:14px;color:var(--text-secondary)}
.upload-hint{font-size:12px;color:var(--text-secondary);margin-top:4px}
.tag-grid{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);cursor:pointer;font-size:13px;transition:all .2s;user-select:none}
.tag:hover{border-color:var(--accent);transform:translateY(-1px)}
.tag.active{background:var(--accent);color:var(--text);border-color:var(--accent);font-weight:600}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px;font-weight:500}
.input-group input,.input-group select{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;outline:none}
.canvas-wrap{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#000;display:flex;justify-content:center;position:relative}
.canvas-wrap canvas{width:100%;height:auto}
.annotation-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.anno-btn{padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--card-bg);cursor:pointer;font-size:12px;transition:all .2s}
.anno-btn:hover{border-color:var(--accent)}
.anno-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.hidden{display:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📸 截图工具">
<meta property="og:description" content="截图工具，在线网页截图与屏幕区域捕获工具">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/screenshot-tool-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📸 截图工具</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">🎯 截图方式</div>
    <div class="tag-grid" id="captureMode">
      <div class="tag active" data-val="upload">📤 上传图片</div>
      <div class="tag" data-val="url">🌐 网页截图</div>
      <div class="tag" data-val="paste">📋 粘贴截图</div>
    </div>
  </div>

  <div class="card" id="uploadMode">
    <div class="card-title">📤 上传图片</div>
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📁</div>
      <div class="upload-text">点击或拖拽上传图片</div>
      <div class="upload-hint">支持 JPG、PNG、WebP 格式</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="card hidden" id="urlMode">
    <div class="card-title">🌐 网页截图</div>
    <div class="input-group">
      <label>输入网址</label>
      <input type="url" id="urlInput" placeholder="https://example.com">
    </div>
    <div class="input-group">
      <label>视口宽度</label>
      <div class="tag-grid" id="viewports">
        <div class="tag" data-val="375">📱 375</div>
        <div class="tag active" data-val="768">📱 768</div>
        <div class="tag" data-val="1024">💻 1024</div>
        <div class="tag" data-val="1440">🖥️ 1440</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="captureUrlBtn">📸 截图</button>
    </div>
  </div>

  <div class="card hidden" id="editorCard">
    <div class="card-title">🖼️ 编辑截图</div>
    <div class="canvas-wrap">
      <canvas id="editor" width="800" height="600"></canvas>
    </div>
    <div class="annotation-bar">
      <div class="anno-btn active" data-tool="none">🔧 选择</div>
      <div class="anno-btn" data-tool="rect">⬜ 矩形</div>
      <div class="anno-btn" data-tool="arrow">➡️ 箭头</div>
      <div class="anno-btn" data-tool="text">📝 文字</div>
      <div class="anno-btn" data-tool="blur">🌫️ 模糊</div>
      <div class="anno-btn" data-tool="draw">✏️ 画笔</div>
    </div>
    <div class="input-group" style="margin-top:12px">
      <label>标注颜色</label>
      <div class="tag-grid" id="annoColors">
        <div class="tag active" data-val="#ff4444">🔴 红</div>
        <div class="tag" data-val="#ffff00">🟡 黄</div>
        <div class="tag" data-val="#44ff44">🟢 绿</div>
        <div class="tag" data-val="#4488ff">🔵 蓝</div>
        <div class="tag" data-val="#ffffff">⚪ 白</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" id="undoBtn">↩️ 撤销</button>
      <button class="btn btn-outline" id="clearBtn">🗑️ 清除标注</button>
      <button class="btn btn-primary" id="downloadBtn">💾 下载</button>
    </div>
  </div>

  <footer>© 2025 Gary's Tools | garyy.top</footer>
</div>
<div class="toast" id="toast"></div>

<script>
function toggleTheme(){var h=document.documentElement;var t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('garyy_theme',t)}
(function(){var s=localStorage.getItem('garyy_theme');if(s==='dark'){document.documentElement.setAttribute('data-theme','dark');document.querySelector('.theme-toggle').textContent='☀️'}})();

function initTags(id,cb){var c=document.getElementById(id);c.addEventListener('click',function(e){var t=e.target.closest('.tag');if(!t)return;c.querySelectorAll('.tag').forEach(function(x){x.classList.remove('active')});t.classList.add('active');if(cb)cb()})}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

var canvas=document.getElementById('editor'),ctx=canvas.getContext('2d');
var origImg=null,history=[],currentTool='none',annoColor='#ff4444',drawing=false,startX=0,startY=0;

initTags('captureMode',function(){
  var mode=document.querySelector('#captureMode .tag.active').dataset.val;
  document.getElementById('uploadMode').classList.toggle('hidden',mode!=='upload');
  document.getElementById('urlMode').classList.toggle('hidden',mode!=='url');
});
initTags('viewports');

document.getElementById('uploadArea').addEventListener('click',function(){document.getElementById('fileInput').click()});
document.getElementById('uploadArea').addEventListener('dragover',function(e){e.preventDefault();this.classList.add('dragover')});
document.getElementById('uploadArea').addEventListener('dragleave',function(){this.classList.remove('dragover')});
document.getElementById('uploadArea').addEventListener('drop',function(e){e.preventDefault();this.classList.remove('dragover');if(e.dataTransfer.files.length)loadImage(e.dataTransfer.files[0])});
document.getElementById('fileInput').addEventListener('change',function(){if(this.files.length)loadImage(this.files[0])});

document.addEventListener('paste',function(e){
  var items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(var i=0;i<items.length;i++){
    if(items[i].type.indexOf('image')>=0){
      loadImage(items[i].getAsFile());showToast('📋 已粘贴截图');break;
    }
  }
});

function loadImage(file){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      origImg=img;
      var maxW=800,ratio=1;
      if(img.width>maxW)ratio=maxW/img.width;
      canvas.width=Math.floor(img.width*ratio);
      canvas.height=Math.floor(img.height*ratio);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      history=[];saveHistory();
      document.getElementById('editorCard').classList.remove('hidden');
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

document.getElementById('captureUrlBtn').addEventListener('click',function(){
  showToast('⚠️ 网页截图需要浏览器截图API支持，建议使用上传模式或按Ctrl+Shift+S使用浏览器自带截图');
});

function saveHistory(){history.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(history.length>20)history.shift()}

function getPos(e){var r=canvas.getBoundingClientRect();var sx=canvas.width/r.width,sy=canvas.height/r.height;var cx=e.touches?e.touches[0].clientX:e.clientX;var cy=e.touches?e.touches[0].clientY:e.clientY;return{x:(cx-r.left)*sx,y:(cy-r.top)*sy}}

document.querySelectorAll('.anno-btn').forEach(function(b){
  b.addEventListener('click',function(){document.querySelectorAll('.anno-btn').forEach(function(x){x.classList.remove('active')});b.classList.add('active');currentTool=b.dataset.tool});
});
initTags('annoColors',function(){annoColor=document.querySelector('#annoColors .tag.active').dataset.val});

canvas.addEventListener('mousedown',onDown);canvas.addEventListener('mousemove',onMove);canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();onDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();onMove(e)},{passive:false});
canvas.addEventListener('touchend',onUp);

var tempCanvas=document.createElement('canvas'),tempCtx=tempCanvas.getContext('2d');
function onDown(e){
  var p=getPos(e);drawing=true;startX=p.x;startY=p.y;
  if(currentTool==='rect'||currentTool==='blur'){
    tempCanvas.width=canvas.width;tempCanvas.height=canvas.height;
    tempCtx.clearRect(0,0,tempCanvas.width,tempCanvas.height);
    tempCtx.drawImage(canvas,0,0);
  }
  if(currentTool==='draw'){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.strokeStyle=annoColor;ctx.lineWidth=3;ctx.lineCap='round'}
  if(currentTool==='text'){
    var txt=prompt('输入标注文字:','');if(txt){
      ctx.font='bold 20px "PingFang SC",sans-serif';ctx.fillStyle=annoColor;ctx.fillText(txt,p.x,p.y);
      saveHistory();drawing=false;
    }
  }
}
function onMove(e){
  if(!drawing)return;var p=getPos(e);
  if(currentTool==='rect'){
    ctx.putImageData(tempCtx.getImageData(0,0,tempCanvas.width,tempCanvas.height),0,0);
    ctx.strokeStyle=annoColor;ctx.lineWidth=3;ctx.strokeRect(startX,startY,p.x-startX,p.y-startY);
  }else if(currentTool==='draw'){
    ctx.lineTo(p.x,p.y);ctx.stroke();
  }else if(currentTool==='blur'){
    ctx.putImageData(tempCtx.getImageData(0,0,tempCanvas.width,tempCanvas.height),0,0);
    var bx=Math.min(startX,p.x),by=Math.min(startY,p.y),bw=Math.abs(p.x-startX),bh=Math.abs(p.y-startY);
    if(bw>2&&bh>2){ctx.filter='blur(8px)';ctx.drawImage(canvas,bx,by,bw,bh,bx,by,bw,bh);ctx.filter='none'}
  }
}
function onUp(e){
  if(!drawing)return;drawing=false;
  if(currentTool==='arrow'){
    var p=getPos(e.changedTouches?e.changedTouches[0]:e);
    ctx.strokeStyle=annoColor;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(p.x,p.y);ctx.stroke();
    var angle=Math.atan2(p.y-startY,p.x-startX);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-15*Math.cos(angle-0.4),p.y-15*Math.sin(angle-0.4));ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-15*Math.cos(angle+0.4),p.y-15*Math.sin(angle+0.4));ctx.stroke();
  }
  if(currentTool!=='none')saveHistory();
}

document.getElementById('undoBtn').addEventListener('click',function(){if(history.length>1){history.pop();ctx.putImageData(history[history.length-1],0,0);showToast('↩️ 已撤销')}});
document.getElementById('clearBtn').addEventListener('click',function(){if(origImg){ctx.drawImage(origImg,0,0,canvas.width,canvas.height);history=[];saveHistory();showToast('🗑️ 已清除标注')}});
document.getElementById('downloadBtn').addEventListener('click',function(){var link=document.createElement('a');link.download='screenshot-'+Date.now()+'.png';link.href=canvas.toDataURL('image/png');link.click();showToast('✅ 已下载')});
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:.8;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=.8">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
