<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行预算规划器</title>
<meta name="description" content="全面的旅行预算规划工具，帮你精打细算每一次旅行">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#3fb950;--yellow:#d29922;--red:#f85149}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;padding:16px}
.header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.header h1{font-size:20px;white-space:nowrap}
.header h1 span{font-size:24px}
.top-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--text2);font-weight:600}
.field input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px;width:140px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{opacity:.85}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-red{background:var(--red)}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.overview-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.overview-card .val{font-size:28px;font-weight:700}
.overview-card .lbl{font-size:12px;color:var(--text2);margin-top:4px}
.main-grid{display:grid;grid-template-columns:1fr 300px;gap:16px}
@media(max-width:768px){.main-grid{grid-template-columns:1fr}}
.add-form{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.add-form .field input,.add-form .field select{width:auto;min-width:100px}
.expense-list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.expense-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600}
.expense-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);transition:background .15s}
.expense-item:hover{background:var(--bg)}
.expense-item .cat-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.expense-item .info{flex:1}
.expense-item .info .name{font-size:14px;font-weight:500}
.expense-item .info .meta{font-size:12px;color:var(--text2)}
.expense-item .amount{font-size:16px;font-weight:600;color:var(--accent)}
.expense-item .del{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:4px}
.expense-item .del:hover{color:var(--red)}
.chart-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.chart-panel h3{font-size:14px;margin-bottom:12px}
.pie-chart{width:180px;height:180px;border-radius:50%;margin:0 auto 16px}
.cat-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cat-bar .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-bar .name{font-size:13px;flex:1}
.cat-bar .bar-wrap{flex:2;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.cat-bar .bar-fill{height:100%;border-radius:4px;transition:width .3s}
.cat-bar .pct{font-size:12px;color:var(--text2);width:40px;text-align:right}
.cat-bar .amt{font-size:13px;font-weight:600;width:80px;text-align:right}
.empty-msg{text-align:center;padding:40px;color:var(--text2);font-size:14px}
.btn-group{display:flex;gap:8px;margin-top:12px}
</style>
</head>
<body>
<div class="header">
<h1><span>💰</span> 旅行预算规划器</h1>
<div style="margin-left:auto;display:flex;gap:8px">
<button class="btn btn-outline btn-sm" onclick="exportBudget()">📤 导出</button>
<button class="btn btn-outline btn-sm" onclick="clearBudget()">🗑 清空</button>
</div>
</div>
<div class="top-bar">
<div class="field">
<label>总预算 (¥)</label>
<input type="number" id="totalBudget" value="10000" min="0" oninput="render()">
</div>
<div class="field">
<label>旅行目的地</label>
<input type="text" id="dest" placeholder="如：东京">
</div>
<div class="field">
<label>旅行天数</label>
<input type="number" id="days" value="5" min="1" style="width:80px">
</div>
<button class="btn" onclick="saveBudget()">💾 保存预算</button>
<button class="btn btn-outline" onclick="loadBudget()">📂 加载</button>
</div>
<div class="overview">
<div class="overview-card"><div class="val" id="ovBudget">¥10,000</div><div class="lbl">总预算</div></div>
<div class="overview-card"><div class="val" id="ovSpent" style="color:var(--red)">¥0</div><div class="lbl">已花费</div></div>
<div class="overview-card"><div class="val" id="ovRemain" style="color:var(--green)">¥10,000</div><div class="lbl">剩余</div></div>
<div class="overview-card"><div class="val" id="ovDaily" style="color:var(--yellow)">¥0</div><div class="lbl">日均消费</div></div>
</div>
<div class="add-form">
<div class="field">
<label>消费类别</label>
<select id="expCat">
<option value="transport">✈️ 机票/交通</option>
<option value="hotel">🏨 住宿</option>
<option value="food">🍜 餐饮</option>
<option value="ticket">🎫 门票/景点</option>
<option value="shopping">🛍 购物</option>
<option value="other">📦 其他</option>
</select>
</div>
<div class="field">
<label>项目名称</label>
<input type="text" id="expName" placeholder="如：机票">
</div>
<div class="field">
<label>金额 (¥)</label>
<input type="number" id="expAmount" min="0" placeholder="0">
</div>
<div class="field">
<label>备注</label>
<input type="text" id="expNote" placeholder="可选">
</div>
<button class="btn" onclick="addExpense()">➕ 添加</button>
</div>
<div class="main-grid">
<div>
<div class="expense-list">
<div class="expense-header"><span>消费记录</span><span id="expCount">0条</span></div>
<div id="expenseItems"><div class="empty-msg">暂无消费记录，开始添加吧</div></div>
</div>
</div>
<div>
<div class="chart-panel">
<h3>消费分布</h3>
<div class="pie-chart" id="pieChart"></div>
<div id="catBars"></div>
</div>
<div class="chart-panel" style="margin-top:12px">
<h3>💡 省钱建议</h3>
<div id="tips" style="font-size:13px;line-height:1.8;color:var(--text2)"></div>
</div>
</div>
</div>
<script>
const catConfig={transport:{label:'机票/交通',color:'var(--accent)',emoji:'✈️'},hotel:{label:'住宿',color:'var(--green)',emoji:'🏨'},food:{label:'餐饮',color:'var(--yellow)',emoji:'🍜'},ticket:{label:'门票/景点',color:'#a371f7',emoji:'🎫'},shopping:{label:'购物',color:'#f778ba',emoji:'🛍'},other:{label:'其他',color:'var(--text2)',emoji:'📦'}};
let expenses=JSON.parse(localStorage.getItem('travelBudget')||'[]');
function addExpense(){
const cat=document.getElementById('expCat').value;
const name=document.getElementById('expName').value.trim();
const amount=parseFloat(document.getElementById('expAmount').value)||0;
const note=document.getElementById('expNote').value.trim();
if(!name||amount<=0)return alert('请填写名称和金额');
expenses.push({id:Date.now(),cat,name,amount,note,date:new Date().toLocaleDateString()});
document.getElementById('expName').value='';
document.getElementById('expAmount').value='';
document.getElementById('expNote').value='';
render();
}
function removeExpense(id){expenses=expenses.filter(e=>e.id!==id);render();}
function render(){
const budget=parseFloat(document.getElementById('totalBudget').value)||0;
const days=parseInt(document.getElementById('days').value)||1;
const spent=expenses.reduce((s,e)=>s+e.amount,0);
const remain=budget-spent;
const daily=spent/days;
document.getElementById('ovBudget').textContent='¥'+budget.toLocaleString();
document.getElementById('ovSpent').textContent='¥'+spent.toLocaleString();
document.getElementById('ovRemain').textContent='¥'+remain.toLocaleString();
document.getElementById('ovRemain').style.color=remain>=0?'var(--green)':'var(--red)';
document.getElementById('ovDaily').textContent='¥'+Math.round(daily).toLocaleString();
const container=document.getElementById('expenseItems');
if(!expenses.length){container.innerHTML='<div class="empty-msg">暂无消费记录，开始添加吧</div>';renderChart(budget);return;}
container.innerHTML=expenses.map(e=>{
const cc=catConfig[e.cat];
return `<div class="expense-item"><div class="cat-dot" style="background:${cc.color}"></div>
<div class="info"><div class="name">${cc.emoji} ${e.name}</div><div class="meta">${e.note?e.note+' · ':''}${e.date}</div></div>
<div class="amount">¥${e.amount.toLocaleString()}</div>
<button class="del" onclick="removeExpense(${e.id})">✕</button></div>`;
}).join('');
document.getElementById('expCount').textContent=expenses.length+'条';
renderChart(budget);
}
function renderChart(budget){
const catTotals={};
expenses.forEach(e=>{catTotals[e.cat]=(catTotals[e.cat]||0)+e.amount;});
const total=Object.values(catTotals).reduce((a,b)=>a+b,0);
let gradientParts=[];let offset=0;
const catEntries=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
catEntries.forEach(([cat,amt])=>{
const pct=total?amt/total*100:0;
gradientParts.push(`${catConfig[cat].color} ${offset}% ${offset+pct}%`);
offset+=pct;
});
document.getElementById('pieChart').style.background=gradientParts.length?`conic-gradient(${gradientParts.join(',')})`:'var(--border)';
document.getElementById('catBars').innerHTML=catEntries.map(([cat,amt])=>{
const pct=total?Math.round(amt/total*100):0;
return `<div class="cat-bar"><div class="dot" style="background:${catConfig[cat].color}"></div>
<div class="name">${catConfig[cat].emoji} ${catConfig[cat].label}</div>
<div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${catConfig[cat].color}"></div></div>
<div class="pct">${pct}%</div><div class="amt">¥${amt.toLocaleString()}</div></div>`;
}).join('');
const tips=[];
const hotelPct=catTotals.hotel?catTotals.hotel/total*100:0;
const foodPct=catTotals.food?catTotals.food/total*100:0;
if(hotelPct>30)tips.push('🏨 住宿占比偏高，可考虑民宿或青旅');
if(foodPct>25)tips.push('🍜 餐饮占比偏高，可多尝试当地小吃');
const remain=budget-total;
if(remain<0)tips.push('⚠️ 已超出预算 ¥'+Math.abs(remain).toLocaleString());
if(remain>budget*0.3)tips.push('✅ 预算控制良好，还有余量');
if(expenses.length===0)tips.push('📝 添加消费记录开始追踪');
document.getElementById('tips').innerHTML=tips.length?tips.map(t=>'<div style="margin-bottom:4px">'+t+'</div>').join(''):'<div>📊 添加更多记录后将给出建议</div>';
}
function exportBudget(){
let text='💰 旅行预算报告\n'+'━'.repeat(30)+'\n\n';
text+=`总预算: ¥${document.getElementById('totalBudget').value}\n`;
text+=`目的地: ${document.getElementById('dest').value||'未设置'}\n`;
text+=`旅行天数: ${document.getElementById('days').value}天\n\n`;
const catTotals={};
expenses.forEach(e=>{catTotals[e.cat]=(catTotals[e.cat]||0)+e.amount;});
Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).forEach(([cat,amt])=>{
text+=`${catConfig[cat].emoji} ${catConfig[cat].label}: ¥${amt.toLocaleString()}\n`;
});
text+=`\n消费明细:\n`;
expenses.forEach(e=>{text+=`  ${catConfig[e.cat].emoji} ${e.name} - ¥${e.amount} (${e.date})\n`;});
const spent=expenses.reduce((s,e)=>s+e.amount,0);
text+=`\n总计: ¥${spent.toLocaleString()} / ¥${document.getElementById('totalBudget').value}`;
const blob=new Blob([text],{type:'text/plain'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='旅行预算.txt';a.click();
}
function saveBudget(){localStorage.setItem('travelBudget',JSON.stringify(expenses));alert('已保存！');}
function loadBudget(){const s=localStorage.getItem('travelBudget');if(s){expenses=JSON.parse(s);render();alert('已加载！');}}
function clearBudget(){if(confirm('确定清空所有记录？')){expenses=[];render();}}
render();
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text]');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
