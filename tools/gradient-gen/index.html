<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS渐变生成器</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh}
.container{max-width:720px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.preview-box{width:100%;height:220px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:20px;transition:background .3s}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card h3{font-size:.85rem;color:var(--text2);margin-bottom:12px}
.color-inputs{display:flex;gap:10px;margin-bottom:12px}
.color-inputs .color-item{flex:1;text-align:center}
.color-inputs .color-item input[type="color"]{width:100%;height:40px;border:none;padding:0;cursor:pointer;background:transparent;border-radius:6px}
.color-inputs .color-item .label{font-size:.75rem;color:var(--text2);margin-top:4px}
.dir-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.dir-btn{padding:10px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text2);cursor:pointer;font-size:.8rem;text-align:center;transition:all .15s}
.dir-btn:hover{border-color:var(--text2)}
.dir-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(59,130,246,.1)}
.css-output{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-family:monospace;font-size:.82rem;color:var(--text);white-space:pre-wrap;word-break:break-all;margin-bottom:10px;min-height:50px}
.btn{padding:10px 20px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.85rem;background:var(--blue);color:#fff;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.green{background:var(--green)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 20px;border-radius:var(--radius);font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="container">
<header><h1>CSS渐变生成器</h1><p>可视化渐变工具</p></header>
<div class="preview-box" id="preview"></div>
<div class="layout">
<div class="card">
<h3>颜色选择</h3>
<div class="color-inputs">
<div class="color-item"><input type="color" id="color1" value="#3b82f6"><div class="label">颜色1</div></div>
<div class="color-item"><input type="color" id="color2" value="#f59e0b"><div class="label">颜色2</div></div>
</div>
<h3>渐变方向</h3>
<div class="dir-grid" id="dir-grid">
<div class="dir-btn" data-dir="to top">↑ 上</div>
<div class="dir-btn active" data-dir="to right">→ 右</div>
<div class="dir-btn" data-dir="to bottom">↓ 下</div>
<div class="dir-btn" data-dir="to left">← 左</div>
<div class="dir-btn" data-dir="to top right">↗ 右上</div>
<div class="dir-btn" data-dir="to top left">↖ 左上</div>
<div class="dir-btn" data-dir="to bottom right">↘ 右下</div>
<div class="dir-btn" data-dir="to bottom left">↙ 左下</div>
<div class="dir-btn" data-dir="45deg">45°</div>
</div>
</div>
<div class="card">
<h3>CSS代码</h3>
<div class="css-output" id="css-output">background: linear-gradient(to right, #3b82f6, #f59e0b);</div>
<button class="btn green" id="copy-btn">复制CSS</button>
</div>
</div>
</div>
<div class="toast" id="toast">已复制到剪贴板</div>

<script>
(function(){
'use strict';

let dir = 'to right';
let color1 = '#3b82f6';
let color2 = '#f59e0b';

const $ = id => document.getElementById(id);
const preview = $('preview');
const cssOutput = $('css-output');
const toast = $('toast');
let toastTimer = null;

function showToast(msg) {
  toast.textContent = msg || '已复制';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
}

function getGradientCSS() {
  return `background: linear-gradient(${dir}, ${color1}, ${color2});`;
}

function updatePreview() {
  const css = getGradientCSS();
  preview.style.background = css.replace('background: ', '');
  cssOutput.textContent = css;
}

// Color inputs
document.getElementById('color1').addEventListener('input', function() {
  color1 = this.value;
  updatePreview();
});

document.getElementById('color2').addEventListener('input', function() {
  color2 = this.value;
  updatePreview();
});

// Direction buttons
document.querySelectorAll('.dir-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    dir = this.dataset.dir;
    updatePreview();
  });
});

// Copy
document.getElementById('copy-btn').addEventListener('click', function() {
  const css = getGradientCSS();
  navigator.clipboard.writeText(css).then(() => {
    showToast('CSS已复制到剪贴板');
  }).catch(() => {
    showToast('复制失败');
  });
});

// Init
updatePreview();

})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
