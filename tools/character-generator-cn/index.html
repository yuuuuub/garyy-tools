<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色生成器</title><meta name="description" content="随机生成小说、剧本角色，包含姓名、性格、背景故事"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#06b6d4}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:20px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.options{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.options select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem}.btn{display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.btn:hover{opacity:.85}.actions{display:flex;gap:8px;justify-content:center;margin-top:16px}.char-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-top:16px}.char-header{display:flex;align-items:center;gap:16px;margin-bottom:16px}.char-avatar{width:64px;height:64px;border-radius:50%;background:var(--bg);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:2rem}.char-name{font-size:1.5rem;font-weight:700;color:var(--accent)}.char-title{font-size:.9rem;color:var(--text2)}.char-section{margin-bottom:16px}.char-label{font-size:.8rem;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}.char-value{font-size:.95rem;line-height:1.6;color:var(--text)}.char-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.char-tag{padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:.75rem;color:var(--text2)}.char-traits{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}.trait{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;text-align:center}.trait-label{font-size:.7rem;color:var(--text2)}.trait-value{font-size:.85rem;font-weight:600;color:var(--accent);margin-top:2px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}</style><meta name="robots" content="index, follow"><meta property="og:title" content="角色生成器"><meta property="og:description" content="随机生成小说剧本角色"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>"></head><body>

<div class="container"><h1>🎭 角色生成器</h1><p class="sub">一键生成小说、剧本中的角色</p>
<div class="card">

<select id="gender"><option value="male">男</option><option value="female">女</option><option value="any">不限</option></select>
<select id="role"><option value="protagonist">主角</option><option value="antagonist">反派</option><option value="support">配角</option><option value="mentor">导师</option></select>

</div>

<script src="../i18n.js" defer></script>
<script>

modern:{surnames:['陈','李','张','王','刘','赵','周','吴','郑','冯','林','黄','杨','朱','马','胡','郭','何'],male:['子轩','浩然','宇航','俊杰','志远','天宇','明轩','博文','子豪','嘉诚'],female:['子涵','雨萱','梦琪','思涵','欣怡','诗涵','佳怡','语嫣','可馨','雨彤'],traits:{personality:['开朗','内向','热情','冷漠','幽默','严肃','温柔','暴躁','聪明','憨厚'],weapon:['格斗','枪械','黑客技术','谈判','法律','金融','医学','工程','心理','情报'],goal:['升职加薪','创业成功','找到真爱','复仇','揭露真相','保护家人','改变世界','出人头地','自我实现','寻找幸福'],weakness:['社恐','加班成瘾','感情用事','完美主义','缺乏自信','工作狂','失眠','焦虑','拖延','害怕失败']}},
historical:{surnames:['李','王','张','刘','陈','杨','赵','黄','周','吴','徐','孙','胡','朱','高','林','何','郭','马','罗'],male:['子龙','玄德','奉先','云长','孟德','仲谋','孔明','公瑾','伯符','翼德'],female:['貂蝉','大乔','小乔','甄宓','蔡琰','甘夫人','孙夫人','祝英台','穆桂英','花木兰'],traits:{personality:['忠义','奸诈','仁慈','残暴','智勇','鲁莽','谨慎','多疑','豪迈','阴柔'],weapon:['长枪','方天画戟','青龙偃月刀','丈八蛇矛','双股剑','弓箭','弩','戈','矛','戟'],goal:['建功立业','匡扶汉室','统一天下','报仇雪恨','守护疆土','光复旧国','争夺皇位','名垂青史','保护百姓','成就霸业'],weakness:['骄傲','多疑','重情','冲动','固执','多疑','贪婪','好色','酗酒','猜忌']}},

};
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function generate(){
var genre=document.getElementById('genre').value;
var gender=document.getElementById('gender').value;
var role=document.getElementById('role').value;
var d=data[genre];
var g=gender==='any'?(Math.random()>.5?'male':'female'):gender;
var surname=pick(d.surnames);
var name=pick(d[g==='male'?g:g]);
var fullName=surname+name;
var traits=d.traits;
var personality=pick(traits.personality);
var weapon=pick(traits.weapon);
var goal=pick(traits.goal);
var weakness=pick(traits.weakness);
var age=Math.floor(Math.random()*50)+15;
var roleNames={protagonist:'主角',antagonist:'反派',support:'配角',mentor:'导师'};
var genreNames={fantasy:'玄幻',scifi:'科幻',wuxia:'武侠',modern:'现代',historical:'古代',horror:'悬疑'};
var backstories={
protagonist:'出身平凡却身怀绝技，因一场变故踏上征途。一路上结识伙伴，经历磨难，最终成长为一代传奇。',
antagonist:'曾经也是正义之士，却因命运的捉弄走上歧途。内心深处仍有一丝良知在挣扎，亦正亦邪。',
support:'看似普通却不可或缺的存在，在关键时刻总能给予主角最重要的帮助。忠诚可靠，深藏不露。',
mentor:'历经沧桑的前辈高人，洞察世事却选择隐居。在主角迷茫时给予指引，传授毕生所学。'
};
document.getElementById('result').innerHTML='<div class="char-card"><div class="char-header"><div class="char-avatar">'+(g==='male'?'👨':'👩')+'</div><div><div class="char-name">'+fullName+'</div><div class="char-title">'+roleNames[role]+' · '+genreNames[genre]+'世界 · '+age+'岁</div></div></div><div class="char-section"><div class="char-label">背景故事</div><div class="char-value">'+backstories[role]+'</div></div><div class="char-traits"><div class="trait"><div class="trait-label">性格</div><div class="trait-value">'+personality+'</div></div><div class="trait"><div class="trait-label">武器</div><div class="trait-value">'+weapon+'</div></div><div class="trait"><div class="trait-label">目标</div><div class="trait-value">'+goal+'</div></div><div class="trait"><div class="trait-label">弱点</div><div class="trait-value">'+weakness+'</div></div></div><div class="char-tags"><span class="char-tag">'+genreNames[genre]+'</span><span class="char-tag">'+roleNames[role]+'</span><span class="char-tag">'+age+'岁</span></div></div>';
}
})();
</script></body></html>
