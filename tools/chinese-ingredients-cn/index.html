<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中式食材大全 - Chinese Ingredients Encyclopedia</title>
<meta name="description" content="中式食材百科，涵盖肉类、蔬菜、调味品、干货等中式烹饪常用食材">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中式食材大全 - Chinese Ingredients Encyclopedia">
<meta property="og:description" content="涵盖肉类、蔬菜、调味品、干货等中式烹饪常用食材">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-ingredients-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥬</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
header{background:linear-gradient(135deg,#1a0a00,#2a1505,#3d200a);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3010;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1200px;margin:0 auto;padding:20px}
.search-box{margin-bottom:16px}
.search-box input{width:100%;padding:12px 16px;border-radius:10px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none}
.search-box input:focus{border-color:var(--accent)}
.filter-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.filter-btn{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.82em;transition:all .2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;justify-content:center}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 14px;text-align:center}
.stat .num{font-size:1.2em;font-weight:bold;color:var(--accent)}
.stat .lbl{font-size:.7em;color:var(--text2)}
.ingredient-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ing-card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);transition:all .3s}
.ing-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.ing-card .i-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ing-card .i-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3em;background:rgba(232,168,124,.15);flex-shrink:0}
.ing-card .i-name{font-size:1.05em;font-weight:bold}
.ing-card .i-en{font-size:.72em;color:var(--text2)}
.ing-card .i-meta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.ing-card .i-meta span{font-size:.7em;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text2)}
.ing-card .i-desc{font-size:.8em;color:var(--text2);line-height:1.5}
.ing-card .i-usage{font-size:.75em;color:var(--accent);margin-top:6px}
.ing-card.hidden{display:none}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:14px;padding:24px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;border:1px solid var(--border)}
.modal h2{font-size:1.3em;margin-bottom:10px}
.modal .close-btn{float:right;background:none;border:none;color:var(--text2);font-size:1.4em;cursor:pointer}
.modal p{font-size:.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
footer{text-align:center;padding:30px;color:var(--text2);font-size:.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.ingredient-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🥬 中式食材大全</h1>
<p>Chinese Ingredients Encyclopedia — 中式烹饪常用食材百科</p>
</header>
<div class="container">
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索食材名称..."></div>
<div class="filter-btns" id="filterBtns">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="肉类">🥩 肉类</button>
<button class="filter-btn" data-filter="海鲜">🦐 海鲜</button>
<button class="filter-btn" data-filter="蔬菜">🥬 蔬菜</button>
<button class="filter-btn" data-filter="豆制品">🫘 豆制品</button>
<button class="filter-btn" data-filter="调味品">🧂 调味品</button>
<button class="filter-btn" data-filter="干货">🍄 干货</button>
<button class="filter-btn" data-filter="主食">🍚 主食</button>
</div>
<div class="stats-bar" id="statsBar"></div>
<div class="ingredient-grid" id="ingGrid"></div>
<footer><p>🥬 中式食材大全 — 巧妇难为无米之炊</p></footer>
</div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="close-btn" id="closeModal">×</button><div id="modalContent"></div></div></div>
<script>
const INGREDIENTS=[
{name:"猪肉",en:"Pork",icon:"🥩",category:"肉类",season:"四季",desc:"中国最重要的肉类食材。五花肉肥瘦相间，适合红烧；里脊肉嫩滑，适合炒制；排骨适合炖汤。",usage:"红烧肉、回锅肉、糖醋排骨、饺子馅",nutrition:"蛋白质20g/100g，脂肪30g/100g，富含B族维生素"},
{name:"鸡肉",en:"Chicken",icon:"🍗",category:"肉类",season:"四季",desc:"用途最广的禽肉。鸡胸肉低脂高蛋白，鸡腿肉嫩滑多汁，整鸡适合蒸煮。",usage:"白切鸡、宫保鸡丁、鸡汤、叫化鸡",nutrition:"蛋白质24g/100g，脂肪较低，易消化吸收"},
{name:"牛肉",en:"Beef",icon:"🥩",category:"肉类",season:"四季",desc:"高蛋白低脂肪的红肉。牛腩适合炖煮，牛柳适合快炒，牛腱适合卤制。",usage:"水煮牛肉、红烧牛腩、卤牛腱、牛肉面",nutrition:"蛋白质26g/100g，富含铁和锌"},
{name:"羊肉",en:"Mutton",icon:"🐑",category:"肉类",season:"冬",desc:"性温热，冬季食用最佳。羊肉膻味需要去腥处理。涮羊肉、烤全羊是经典做法。",usage:"涮羊肉、烤全羊、葱爆羊肉、羊肉汤",nutrition:"蛋白质20g/100g，富含左旋肉碱"},
{name:"草鱼",en:"Grass Carp",icon:"🐟",category:"海鲜",season:"四季",desc:"中国四大家鱼之一，肉质紧实，价格实惠。适合红烧、水煮、清蒸。",usage:"水煮鱼、西湖醋鱼、红烧鱼、鱼丸",nutrition:"蛋白质18g/100g，低脂肪，富含DHA"},
{name:"鲈鱼",en:"Sea Bass",icon:"🐟",category:"海鲜",season:"四季",desc:"肉质细嫩，刺少，是清蒸的最佳选择。"清蒸鲈鱼"是粤菜经典。",usage:"清蒸鲈鱼、红烧鲈鱼、煎鲈鱼",nutrition:"蛋白质20g/100g，富含EPA和DHA"},
{name:"虾",en:"Shrimp",icon:"🦐",category:"海鲜",season:"四季",desc:"高蛋白低脂肪的海鲜。基围虾、对虾、河虾各有特色。",usage:"白灼虾、龙井虾仁、油焖大虾、虾饺",nutrition:"蛋白质24g/100g，几乎零脂肪"},
{name:"豆腐",en:"Tofu",icon:"🫘",category:"豆制品",season:"四季",desc:"中国最伟大的食材发明之一。嫩豆腐适合做汤，老豆腐适合煎炸，内酯豆腐适合凉拌。",usage:"麻婆豆腐、家常豆腐、豆腐脑、臭豆腐",nutrition:"蛋白质8g/100g，富含钙和异黄酮"},
{name:"白菜",en:"Chinese Cabbage",icon:"🥬",category:"蔬菜",season:"冬",desc:"北方冬季的当家菜。大白菜耐储存，口感清甜。醋溜白菜是经典做法。",usage:"醋溜白菜、白菜炖豆腐、辣白菜、饺子",nutrition:"热量极低，富含维生素C和膳食纤维"},
{name:"青椒",en:"Green Pepper",icon:"🫑",category:"蔬菜",season:"夏秋",desc:"提味增色的常用蔬菜。辣度因品种而异。青椒肉丝是最家常的菜式。",usage:"青椒肉丝、虎皮青椒、青椒炒蛋",nutrition:"富含维生素C，热量极低"},
{name:"豆瓣酱",en:"Doubanjiang",icon:"🫘",category:"调味品",season:"四季",desc:"川菜之魂。以蚕豆和辣椒发酵制成，郫县豆瓣酱最为正宗。",usage:"麻婆豆腐、回锅肉、水煮鱼",nutrition:"含有发酵产生的氨基酸和益生菌"},
{name:"酱油",en:"Soy Sauce",icon:"🧂",category:"调味品",season:"四季",desc:"中国最古老的调味品之一。生抽调味，老抽上色。分为酿造和配制两种。",usage:"几乎所有中式菜肴",nutrition:"含有氨基酸和微量元素，注意钠含量"},
{name:"花椒",en:"Sichuan Pepper",icon:"🌶️",category:"调味品",season:"四季",desc:"川菜标志性调料，产生独特的麻味。青花椒麻味更清新，红花椒香味更浓郁。",usage:"水煮鱼、麻婆豆腐、椒麻鸡",nutrition:"含有挥发油，有温中散寒的功效"},
{name:"香菇",en:"Shiitake Mushroom",icon:"🍄",category:"干货",season:"四季",desc:"中国最重要的食用菌。干香菇香味更浓，泡香菇的水是天然增鲜剂。",usage:"香菇鸡汤、香菇青菜、香菇酱",nutrition:"富含多糖和氨基酸，有增强免疫力作用"},
{name:"木耳",en:"Wood Ear",icon:"🍄",category:"干货",season:"四季",desc:"黑木耳口感脆嫩，富含胶质。泡发后可炒、凉拌、做汤。",usage:"木耳炒肉、凉拌木耳、木须肉",nutrition:"富含铁和膳食纤维，有清肺功效"},
{name:"米饭",en:"Rice",icon:"🍚",category:"主食",season:"四季",desc:"中国南方的主食之王。粳米适合煮饭，籼米适合炒饭，糯米适合做点心。",usage:"蛋炒饭、煲仔饭、粽子、汤圆",nutrition:"碳水化合物为主，提供能量"},
{name:"面条",en:"Noodles",icon:"🍜",category:"主食",season:"四季",desc:"中国北方的主食代表。手擀面、拉面、刀削面、挂面各有特色。",usage:"炸酱面、牛肉面、担担面、热干面",nutrition:"碳水化合物为主，含有少量蛋白质"}
];
let currentFilter='all';
function render(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const grid=document.getElementById('ingGrid');
  const filtered=INGREDIENTS.filter(i=>{
    if(q&&!i.name.includes(q)&&!i.en.toLowerCase().includes(q))return false;
    if(currentFilter!=='all'&&i.category!==currentFilter)return false;
    return true;
  });
  const cats={};INGREDIENTS.forEach(i=>{cats[i.category]=(cats[i.category]||0)+1});
  document.getElementById('statsBar').innerHTML=`
    <div class="stat"><div class="num">${INGREDIENTS.length}</div><div class="lbl">总食材</div></div>
    <div class="stat"><div class="num">${filtered.length}</div><div class="lbl">匹配</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat"><div class="num">${v}</div><div class="lbl">${k}</div></div>`).join('')}`;
  if(!filtered.length){grid.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2);grid-column:1/-1">未找到匹配的食材</div>';return}
  grid.innerHTML=filtered.map(i=>`
    <div class="ing-card" onclick="showDetail('${i.name}')">
      <div class="i-head"><div class="i-icon">${i.icon}</div><div><div class="i-name">${i.name}</div><div class="i-en">${i.en}</div></div></div>
      <div class="i-meta"><span>${i.category}</span><span>🗓️ ${i.season}季</span></div>
      <div class="i-desc">${i.desc.substring(0,50)}...</div>
      <div class="i-usage">🍳 ${i.usage.split('、').slice(0,2).join('、')}</div>
    </div>`).join('');
}
function showDetail(name){
  const i=INGREDIENTS.find(x=>x.name===name);if(!i)return;
  document.getElementById('modalContent').innerHTML=`
    <h2>${i.icon} ${i.name} <span style="font-size:.5em;color:var(--text2)">${i.en}</span></h2>
    <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap"><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">${i.category}</span><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">🗓️ ${i.season}季</span></div>
    <p><strong>简介：</strong>${i.desc}</p>
    <p><strong>常见做法：</strong>${i.usage}</p>
    <p><strong>营养成分：</strong>${i.nutrition}</p>`;
  document.getElementById('modal').classList.add('show');
}
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('show')};
document.getElementById('searchInput').addEventListener('input',render);
document.getElementById('filterBtns').addEventListener('click',e=>{
  if(!e.target.classList.contains('filter-btn'))return;
  e.target.parentElement.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter=e.target.dataset.filter;
  render();
});
render();
</script>
</body>
</html>
