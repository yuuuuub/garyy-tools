<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字变换</title><meta name="description" content="汉字变换 - 在线查看汉字变换效果"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.transform-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.transform-char{font-size:6rem;font-weight:700;color:var(--blue);display:inline-block}.transform-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.transform-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.transform-option:hover{border-color:var(--blue)}.transform-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}

</style><meta property="og:title" content="汉字变换"><meta property="og:description" content="汉字变换 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔄 汉字变换</h1><p class="sub">在线查看汉字变换效果</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="换" oninput="showTransform2()">
</div>
<button class="btn" onclick="showTransform2()">显示变换</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var transformTypes2=['mirror','flip','distort','pixelate','ascii','wave','ripple','explode','implode','melt'];
var currentTransform2='mirror';
function showTransform2(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="transform-options">';
  transformTypes2.forEach(function(type){
    html+='<div class="transform-option '+(type===currentTransform2?'active':'')+'" onclick="setTransform2(\''+type+'\')">'+getTransformName2(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="transform-container">';
  html+='<div class="transform-char" style="'+getTransformCSS2(currentTransform2)+'">'+char+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>📋 变换说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>变换类型：</strong>'+getTransformName2(currentTransform2)+'</div>';
  html+='<div><strong>效果描述：</strong>'+getTransformDescription2(currentTransform2)+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function setTransform2(type){
  currentTransform2=type;
  showTransform2();
}
function getTransformName2(type){
  switch(type){
    case 'mirror':return'镜像';
    case 'flip':return'翻转';
    case 'distort':return'扭曲';
    case 'pixelate':return'像素化';
    case 'ascii':return'ASCII';
    case 'wave':return'波浪';
    case 'ripple':return'涟漪';
    case 'explode':return'爆炸';
    case 'implode':return'内爆';
    case 'melt':return'融化';
    default:return'未知';
  }
}
function getTransformDescription2(type){
  switch(type){
    case 'mirror':return'水平镜像翻转';
    case 'flip':return'垂直翻转';
    case 'distort':return'扭曲变形效果';
    case 'pixelate':return'像素化效果';
    case 'ascii':return'ASCII艺术效果';
    case 'wave':return'波浪扭曲效果';
    case 'ripple':return'涟漪扩散效果';
    case 'explode':return'爆炸分散效果';
    case 'implode':return'内爆收缩效果';
    case 'melt':return'融化流淌效果';
    default:return'未知效果';
  }
}
function getTransformCSS2(type){
  switch(type){
    case 'mirror':return'transform:scaleX(-1)';
    case 'flip':return'transform:scaleY(-1)';
    case 'distort':return'animation:distort 2s infinite';
    case 'pixelate':return'filter:blur(2px);animation:pixelate 1s infinite';
    case 'ascii':return'font-family:monospace;font-size:4rem;color:var(--green)';
    case 'wave':return'animation:wave2 2s infinite';
    case 'ripple':return'animation:ripple 1.5s infinite';
    case 'explode':return'animation:explode 1s infinite';
    case 'implode':return'animation:implode 1s infinite';
    case 'melt':return'animation:melt 2s infinite';
    default:return'none';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showTransform2();
}
showTransform2();
</script>
<style>
@keyframes distort{0%,100%{transform:skew(0deg)}25%{transform:skew(5deg)}50%{transform:skew(-5deg)}75%{transform:skew(3deg)}}
@keyframes pixelate{0%,100%{filter:blur(0px)}50%{filter:blur(3px)}}
@keyframes wave2{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-10px) rotate(2deg)}50%{transform:translateY(0) rotate(0deg)}75%{transform:translateY(10px) rotate(-2deg)}}
@keyframes ripple{0%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:0.7}100%{transform:scale(1);opacity:1}}
@keyframes explode{0%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:0.5}100%{transform:scale(1);opacity:1}}
@keyframes implode{0%{transform:scale(1);opacity:1}50%{transform:scale(0.5);opacity:0.5}100%{transform:scale(1);opacity:1}}
@keyframes melt{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.3);transform-origin:bottom}}
</style><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
