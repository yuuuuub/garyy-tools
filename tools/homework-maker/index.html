<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 作业制作器</title>
<meta name="description" content="作业生成器，快速创建练习题和作业试卷">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=color],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text);margin-right:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.pb{width:100%;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px}
.pb .fl{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}
.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:.9rem}
th{color:var(--text2);font-weight:600}
.hidden{display:none}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="📚 作业制作器">
  <meta property="og:description" content="作业生成器，快速创建练习题和作业试卷">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/homework-maker/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="ctn">
<div class="hdr"><h1>📚 作业制作器</h1><p>布置和管理作业</p></div>
<div class="cd"><h2>创建作业</h2>
<label>科目</label><input type="text" id="hwS" placeholder="数学">
<label>作业内容</label><textarea id="hwC" placeholder="作业内容描述"></textarea>
<label>截止日期</label><input type="date" id="hwD">
<label>优先级</label><select id="hwP"><option value="high">高</option><option value="mid">中</option><option value="low">低</option></select>
<div class="bg"><button onclick="addHW()">添加作业</button></div>
<div id="hwMsg" style="display:none;text-align:center;padding:8px;border-radius:8px;margin-top:8px;font-size:.85rem"></div></div>
<div class="cd"><h2>作业列表</h2><div id="hwL" class="es">暂无作业</div></div>
</div>
<script>let HW=JSON.parse(localStorage.getItem('hwList')||'[]');function rHW(){$('hwL').innerHTML=HW.length?HW.map((h,i)=>'<div class="li" style="flex-direction:column;align-items:stretch"><div style="display:flex;justify-content:space-between"><span style="font-weight:600">'+h.subject+'</span><span class="tag '+(h.priority==='high'?'d':h.priority==='mid'?'w':'s')+'">'+{high:'高',mid:'中',low:'低'}[h.priority]+'</span></div><p style="color:var(--text2);font-size:.9rem;margin:4px 0">'+h.content+'</p><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.8rem;color:var(--text2)">截止: '+h.deadline+'</span><div><button class="sec" style="padding:4px 12px;font-size:.8rem;margin-right:4px" onclick="HW['+i+'].done=!HW['+i+'].done;localStorage.setItem(\'hwList\',JSON.stringify(HW));rHW()">'+(h.done?'✓ 已完成':'标记完成')+'</button><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="HW.splice('+i+',1);localStorage.setItem(\'hwList\',JSON.stringify(HW));rHW()">删除</button></div></div></div>').join(''):'<div class="es">暂无作业</div>'}
function showHwMsg(msg){const el=document.getElementById('hwMsg');el.textContent=msg;el.style.display='block';el.style.background='rgba(239,68,68,.15)';el.style.color='var(--danger)';setTimeout(()=>el.style.display='none',3000)}
function addHW(){const s=$('hwS').value.trim(),c=$('hwC').value.trim(),d=$('hwD').value,p=$('hwP').value;if(!s||!c){showHwMsg('请填写科目和内容');return}HW.unshift({subject:s,content:c,deadline:d||'无',priority:p,done:false});localStorage.setItem('hwList',JSON.stringify(HW));rHW();$('hwS').value='';$('hwC').value='';$('hwD').value=''}
function $(id){return document.getElementById(id)}rHW()</script>
<script src="../i18n.js" defer></script>
</body>
</html>
