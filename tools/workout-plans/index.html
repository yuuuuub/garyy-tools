<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Plans | 健身计划生成器</title>
<meta name="description" content="健身计划生成器，根据目标定制健身训练方案">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d0d0d;
  --bg2: #1a1a1a;
  --bg3: #252525;
  --fg: #e0e0e0;
  --fg2: #a0a0a0;
  --accent: #ff4d2e;
  --accent2: #ff8c00;
  --green: #00e676;
  --blue: #448aff;
  --purple: #b388ff;
  --card: #1e1e1e;
  --border: #333333;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.5);
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  min-height: 100vh;
  line-height: 1.6;
}
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
header {
  text-align: center;
  padding: 40px 0 30px;
  background: linear-gradient(135deg, #1a0a0a 0%, #0d0d0d 50%, #0a0a1a 100%);
  border-bottom: 2px solid var(--accent);
}
header h1 {
  font-size: 2.4rem;
  font-weight: 800;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 2px;
}
header p { color: var(--fg2); margin-top: 8px; font-size: 1rem; }
nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
nav button {
  background: var(--bg3);
  color: var(--fg);
  border: 1px solid var(--border);
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
}
nav button:hover { border-color: var(--accent); color: var(--accent); }
nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.section { display: none; }
.section.active { display: block; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.card h2 {
  font-size: 1.3rem;
  margin-bottom: 16px;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 10px;
}
.card h3 {
  font-size: 1.1rem;
  margin: 16px 0 10px;
  color: var(--fg);
}
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  margin-bottom: 6px;
  color: var(--fg2);
  font-size: 0.9rem;
}
select, input[type="number"], input[type="date"], input[type="text"] {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--fg);
  border-radius: 8px;
  font-size: 0.95rem;
  font-family: inherit;
}
select:focus, input:focus { outline: none; border-color: var(--accent); }
.btn {
  display: inline-block;
  padding: 12px 28px;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #e0442a; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(255,77,46,0.3); }
.btn-secondary { background: var(--bg3); color: var(--fg); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-green { background: var(--green); color: #000; }
.btn-green:hover { opacity: 0.9; }
.btn-sm { padding: 8px 16px; font-size: 0.85rem; }
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.filter-btn {
  padding: 6px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--fg2);
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.exercise-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 14px;
}
.exercise-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  transition: all 0.2s;
}
.exercise-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.exercise-card .muscle-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  margin-right: 4px;
  margin-bottom: 4px;
}
.muscle-chest { background: rgba(255,77,46,0.2); color: var(--accent); }
.muscle-back { background: rgba(68,138,255,0.2); color: var(--blue); }
.muscle-legs { background: rgba(0,230,118,0.2); color: var(--green); }
.muscle-shoulders { background: rgba(255,140,0,0.2); color: var(--accent2); }
.muscle-arms { background: rgba(179,136,255,0.2); color: var(--purple); }
.muscle-core { background: rgba(255,235,59,0.15); color: #ffeb3b; }
.exercise-card h4 { font-size: 1.05rem; margin-bottom: 6px; }
.exercise-card p { color: var(--fg2); font-size: 0.82rem; line-height: 1.5; }
.exercise-card .exercise-desc { margin-top: 4px; font-size: 0.78rem; color: #888; }
.plan-day {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 16px;
}
.plan-day h3 {
  color: var(--accent);
  font-size: 1.15rem;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.plan-exercise {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.plan-exercise .ex-name { font-weight: 600; min-width: 120px; }
.plan-exercise .ex-params { color: var(--fg2); font-size: 0.85rem; }
.plan-exercise .ex-muscle { font-size: 0.75rem; color: var(--accent2); }
.timer-display {
  font-size: 5rem;
  font-weight: 800;
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  color: var(--accent);
  margin: 20px 0;
}
.timer-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.preset-btns {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.stat-row .stat-val { font-weight: 700; color: var(--accent); font-size: 1.1rem; }
.weight-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.weight-table th, .weight-table td {
  text-align: left;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.weight-table th { color: var(--fg2); font-size: 0.85rem; font-weight: 500; }
.weight-log-form {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.weight-log-form .form-group { flex: 1; min-width: 140px; margin-bottom: 0; }
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: #000;
  padding: 12px 28px;
  border-radius: 8px;
  font-weight: 600;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
footer {
  text-align: center;
  padding: 30px 0;
  color: var(--fg2);
  font-size: 0.85rem;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}
.counter-badge {
  background: var(--accent);
  color: #fff;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: 600;
}
@media (max-width: 600px) {
  .container { padding: 12px; }
  header h1 { font-size: 1.8rem; }
  .timer-display { font-size: 3rem; }
  .exercise-grid { grid-template-columns: 1fr; }
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Workout Plans | 健身计划生成器">
  <meta property="og:description" content="健身计划生成器，根据目标定制健身训练方案">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/workout-plans/">
</head>
<body>
<div class="toast" id="toast"></div>
<header>
  <h1>健身计划</h1>
  <p>个性化健身计划生成器 · 科学训练 · 持之以恒</p>
</header>
<nav>
  <button class="active" data-section="generator">计划生成</button>
  <button data-section="library">动作库</button>
  <button data-section="timer">训练计时</button>
  <button data-section="progress">进度追踪</button>
  <button data-section="weightlog">体重记录</button>
</nav>
<div class="container">

<!-- 计划生成器 -->
<section id="generator" class="section active">
  <div class="card">
    <h2>生成你的健身计划</h2>
    <div class="form-group">
      <label>训练目标</label>
      <select id="goal">
        <option value="减脂">减脂</option>
        <option value="增肌">增肌</option>
        <option value="塑形">塑形</option>
        <option value="力量">力量</option>
        <option value="耐力">耐力</option>
      </select>
    </div>
    <div class="form-group">
      <label>训练水平</label>
      <select id="level">
        <option value="新手">新手</option>
        <option value="中级">中级</option>
        <option value="高级">高级</option>
      </select>
    </div>
    <div class="form-group">
      <label>可用器械</label>
      <select id="equipment">
        <option value="徒手">徒手</option>
        <option value="哑铃">哑铃</option>
        <option value="健身房">健身房</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="generatePlan()" style="width:100%;margin-top:8px;">生成一周训练计划</button>
  </div>
  <div id="planResult"></div>
</section>

<!-- 动作库 -->
<section id="library" class="section">
  <div class="card">
    <h2>动作库 <span class="counter-badge" id="exerciseCount">40+</span></h2>
    <div class="filter-bar" id="muscleFilters">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="胸部">胸部</button>
      <button class="filter-btn" data-filter="背部">背部</button>
      <button class="filter-btn" data-filter="腿部">腿部</button>
      <button class="filter-btn" data-filter="肩部">肩部</button>
      <button class="filter-btn" data-filter="手臂">手臂</button>
      <button class="filter-btn" data-filter="核心">核心</button>
    </div>
    <div class="exercise-grid" id="exerciseGrid"></div>
  </div>
</section>

<!-- 训练计时器 -->
<section id="timer" class="section">
  <div class="card">
    <h2>训练计时器</h2>
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="timer-controls">
      <button class="btn btn-primary" id="timerStart">开始</button>
      <button class="btn btn-secondary" id="timerPause">暂停</button>
      <button class="btn btn-secondary" id="timerReset">重置</button>
    </div>
    <h3 style="text-align:center;color:var(--fg2);font-size:0.95rem;">间歇休息预设</h3>
    <div class="preset-btns">
      <button class="btn btn-secondary btn-sm" onclick="setTimer(30)">30秒</button>
      <button class="btn btn-secondary btn-sm" onclick="setTimer(45)">45秒</button>
      <button class="btn btn-secondary btn-sm" onclick="setTimer(60)">60秒</button>
      <button class="btn btn-secondary btn-sm" onclick="setTimer(90)">90秒</button>
      <button class="btn btn-secondary btn-sm" onclick="setTimer(120)">120秒</button>
      <button class="btn btn-secondary btn-sm" onclick="setTimer(180)">180秒</button>
      <button class="btn btn-secondary btn-sm" onclick="setTimer(300)">5分钟</button>
    </div>
  </div>
</section>

<!-- 进度追踪 -->
<section id="progress" class="section">
  <div class="card">
    <h2>训练进度追踪</h2>
    <div class="stat-row"><span>本周完成训练数</span><span class="stat-val" id="weekWorkouts">0</span></div>
    <div class="stat-row"><span>本月完成训练数</span><span class="stat-val" id="monthWorkouts">0</span></div>
    <div class="stat-row"><span>总完成训练数</span><span class="stat-val" id="totalWorkouts">0</span></div>
    <div class="stat-row"><span>连续训练天数</span><span class="stat-val" id="streak">0</span></div>
    <div class="stat-row"><span>当前体重 (kg)</span><span class="stat-val" id="currentWeight">--</span></div>
  </div>
  <div class="card">
    <h3 style="margin-top:0;">快速打卡</h3>
    <p style="color:var(--fg2);margin-bottom:12px;">记录今天的训练完成情况</p>
    <button class="btn btn-primary" onclick="checkIn()">今日训练打卡</button>
  </div>
</section>

<!-- 体重记录 -->
<section id="weightlog" class="section">
  <div class="card">
    <h2>体重记录</h2>
    <div class="weight-log-form">
      <div class="form-group"><label>日期</label><input type="date" id="weightDate"></div>
      <div class="form-group"><label>体重 (kg)</label><input type="number" id="weightValue" step="0.1" min="30" max="300" placeholder="例: 70.5"></div>
      <div class="form-group" style="flex:0 0 auto;"><label>&nbsp;</label><button class="btn btn-primary" onclick="logWeight()">记录</button></div>
    </div>
  </div>
  <div class="card">
    <h3>体重历史记录</h3>
    <table class="weight-table" id="weightTableBody">
      <thead><tr><th>日期</th><th>体重 (kg)</th><th>变化</th><th>操作</th></tr></thead>
      <tbody id="weightTbody"></tbody>
    </table>
    <p id="noWeightData" style="color:var(--fg2);text-align:center;padding:20px;">暂无体重记录，开始记录你的第一笔数据吧</p>
  </div>
</section>

</div>
<footer>
  <p>Workout Plans · 个性化健身计划生成器</p>
  <p style="margin-top:4px;">坚持训练，遇见更好的自己</p>
</footer>

<script>
// ==================== 动作库 (40+ 个动作) ====================
const exerciseLibrary = [
  { name: "标准俯卧撑", muscle: "胸部", desc: "双手与肩同宽，身体保持平直，屈臂下落至胸部接近地面，再推起。注意收紧核心，身体不塌腰。", video: "手放于肩正下方，身体呈平板状，缓慢下落，肘部与身体呈45度角" },
  { name: "钻石俯卧撑", muscle: "手臂", desc: "双手拇指与食指相触形成钻石形，置于胸下。身体保持平直，屈肘下落。重点刺激肱三头肌。", video: "两手并拢成钻石状置于胸下，身体保持一条直线" },
  { name: "宽距俯卧撑", muscle: "胸部", desc: "双手间距宽于肩约1.5倍，下落时肘部向外扩展。重点刺激胸大肌外侧。", video: "双手宽于肩放置，下落时肘部向外张开，胸部尽量贴近地面" },
  { name: "上斜俯卧撑", muscle: "胸部", desc: "双手撑在椅子或台阶边缘，身体倾斜。适合新手入门，降低难度。", video: "双手撑于高处，身体倾斜，屈肘下落，胸部靠近支撑面" },
  { name: "下斜俯卧撑", muscle: "肩部", desc: "双脚抬高置于椅子或台阶上，双手撑地。增加上胸和肩部刺激。", video: "双脚放在高处，双手撑地，身体倾斜头低脚高，做俯卧撑动作" },
  { name: "引体向上", muscle: "背部", desc: "正手握杠，宽于肩。拉起身体至下巴越过单杠。背部王牌动作。需单杠。", video: "正手宽握单杠，身体悬垂，背部发力拉至下巴过杠，控制下落" },
  { name: "反握引体向上", muscle: "手臂", desc: "反手握杠，与肩同宽。拉起身体至下巴越过单杠。更多肱二头肌参与。", video: "反手窄握单杠，掌心朝自己，肱二头肌和背部协同发力上拉" },
  { name: "澳式引体", muscle: "背部", desc: "身体倾斜，脚跟着地，正手握低杠。适合新手，引体向上的降级版本。", video: "低杠或桌子边缘，身体倾斜脚跟着地，正手握住横杠，拉胸靠近杠" },
  { name: "哑铃卧推", muscle: "胸部", desc: "仰卧在平凳上，双手各持哑铃在胸两侧，向上推起至手臂伸直。需哑铃和长凳。", video: "仰卧平躺，双哑铃放于胸侧，推至手臂伸直，控制下落至胸部两侧" },
  { name: "哑铃飞鸟", muscle: "胸部", desc: "仰卧在平凳上，双臂微屈打开至身体两侧，像扇动翅膀一样合拢。需哑铃和长凳。", video: "仰卧，双臂微屈由两侧向胸前合拢，感受胸部拉伸与收缩" },
  { name: "哑铃划船", muscle: "背部", desc: "单手撑凳，另一手持哑铃。将哑铃从低位沿身体拉至腰部。需哑铃。", video: "单膝跪凳，一手撑凳，另一手持哑铃由下垂位沿体侧拉至腰间" },

  { name: "哑铃侧平举", muscle: "肩部", desc: "站姿，双臂微屈，将哑铃从体侧平举至肩高。重点刺激三角肌中束。需哑铃。", video: "站直，手持哑铃从体侧平举至与肩同高，微屈肘，缓慢放下" },
  { name: "哑铃前平举", muscle: "肩部", desc: "站姿，交替或同时将哑铃从体前举起至肩高。刺激三角肌前束。需哑铃。", video: "站姿手持哑铃从大腿前方向上抬至肩高，交替或同时进行" },

  { name: "锤式弯举", muscle: "手臂", desc: "掌心相对的握法，像握锤子一样。弯举至肩部。锻炼肱肌和肱二头肌。需哑铃。", video: "掌心相对持哑铃如握锤，上臂固定，弯举至肩，侧重肱肌" },

// ==================== 计划生成 ====================
function generatePlan() {
  const goal = document.getElementById('goal').value;
  const level = document.getElementById('level').value;
  const equipment = document.getElementById('equipment').value;

  const daysOfWeek = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
  const dayTypes = getDayTypes(goal);
  const plan = [];

  for (let i = 0; i < 7; i++) {
    const dayName = daysOfWeek[i];
    const type = dayTypes[i];
    const exercises = pickExercises(type, level, equipment, goal);
    plan.push({ day: dayName, type, exercises });
  }

  renderPlan(plan, goal, level, equipment);
}

function getDayTypes(goal) {
  const plans = {
    "减脂": ["全身燃脂", "下肢+有氧", "上肢+核心", "全身燃脂", "下肢+有氧", "上肢+核心", "休息日"],
    "增肌": ["胸部+肱三头肌", "背部+肱二头肌", "肩部+腿部", "胸部+肱三头肌", "背部+肱二头肌", "肩部+腿部", "休息日"],
    "塑形": ["全身训练", "下肢+核心", "上肢", "全身训练", "下肢+核心", "上肢", "休息日"],
    "力量": ["胸部+肩部", "背部", "腿部", "胸部+肩部", "背部+手臂", "腿部", "休息日"],
    "耐力": ["耐力训练", "核心稳定", "上肢耐力", "下肢耐力", "核心稳定", "全身耐力", "休息日"]
  };
  return plans[goal] || plans["增肌"];
}

function pickExercises(type, level, equipment, goal) {
  if (type === "休息日") return [];

  const muscleMap = {
    "全身燃脂": ["腿部", "核心", "腿部", "胸部", "核心", "腿部"],
    "全身训练": ["腿部", "胸部", "背部", "核心", "腿部", "肩部"],
    "下肢+有氧": ["腿部", "腿部", "核心", "腿部", "腿部"],
    "上肢+核心": ["胸部", "背部", "肩部", "核心", "手臂"],
    "上肢": ["胸部", "背部", "肩部", "手臂"],
    "下肢+核心": ["腿部", "腿部", "核心", "腿部"],
    "胸部+肱三头肌": ["胸部", "胸部", "手臂", "手臂", "胸部"],
    "背部+肱二头肌": ["背部", "背部", "手臂", "手臂", "背部"],
    "肩部+腿部": ["肩部", "腿部", "腿部", "肩部", "腿部"],
    "胸部+肩部": ["胸部", "肩部", "胸部", "肩部"],
    "背部": ["背部", "背部", "背部", "背部", "手臂"],
    "腿部": ["腿部", "腿部", "腿部", "腿部", "核心"],
    "背部+手臂": ["背部", "手臂", "手臂", "背部"],
    "耐力训练": ["腿部", "核心", "腿部", "腿部", "核心"],
    "核心稳定": ["核心", "核心", "核心", "背部", "核心"],
    "上肢耐力": ["胸部", "肩部", "手臂", "背部", "胸部"],
    "下肢耐力": ["腿部", "腿部", "腿部", "核心", "腿部"],
    "全身耐力": ["腿部", "胸部", "背部", "核心", "腿部"]
  };

  const targets = muscleMap[type] || ["腿部", "胸部", "核心"];
  const result = [];

  const levelReps = { "新手": [10, 12], "中级": [8, 12], "高级": [6, 10] };
  const levelSets = { "新手": [3, 3], "中级": [3, 4], "高级": [4, 5] };
  const levelRest = { "新手": [60, 90], "中级": [45, 60], "高级": [30, 45] };

  for (const muscle of targets) {
    const pool = exerciseLibrary.filter(ex => {
      if (equipment === "徒手") return ex.muscle === muscle && ex.desc.indexOf("需哑铃") === -1 && ex.desc.indexOf("需单杠") === -1 && ex.desc.indexOf("需健身房") === -1 && ex.desc.indexOf("需椅子") === -1;
      if (equipment === "哑铃") {
        const needsGym = ex.desc.indexOf("需健身房") !== -1;
        const needsBar = ex.desc.indexOf("需单杠") !== -1 && ex.desc.indexOf("需健身房") === -1;
        return ex.muscle === muscle && !needsGym && !needsBar;
      }
      return ex.muscle === muscle;
    });
    if (pool.length > 0) {
      const ex = pool[Math.floor(Math.random() * pool.length)];
      const sets = levelSets[level][0] + Math.floor(Math.random() * (levelSets[level][1] - levelSets[level][0] + 1));
      const reps = levelReps[level][0] + Math.floor(Math.random() * (levelReps[level][1] - levelReps[level][0] + 1));
      const rest = levelRest[level][0] + Math.floor(Math.random() * (levelRest[level][1] - levelRest[level][0] + 1));
      // avoid duplicates
      if (!result.find(r => r.name === ex.name)) {
        result.push({ ...ex, sets, reps, rest });
      }
    }
  }

  // Fill if not enough
  while (result.length < Math.min(targets.length, 5)) {
    const extra = exerciseLibrary.filter(ex => {
      if (equipment === "徒手") return ex.desc.indexOf("需哑铃") === -1 && ex.desc.indexOf("需单杠") === -1 && ex.desc.indexOf("需健身房") === -1 && ex.desc.indexOf("需椅子") === -1;
      if (equipment === "哑铃") return ex.desc.indexOf("需健身房") === -1 && ex.desc.indexOf("需单杠") === -1;
      return true;
    });
    const pick = extra[Math.floor(Math.random() * extra.length)];
    if (!result.find(r => r.name === pick.name)) {
      const levelRepsArr = levelReps[level];
      const levelSetsArr = levelSets[level];
      const levelRestArr = levelRest[level];
      result.push({
        ...pick,
        sets: levelSetsArr[0] + Math.floor(Math.random() * (levelSetsArr[1] - levelSetsArr[0] + 1)),
        reps: levelRepsArr[0] + Math.floor(Math.random() * (levelRepsArr[1] - levelRepsArr[0] + 1)),
        rest: levelRestArr[0] + Math.floor(Math.random() * (levelRestArr[1] - levelRestArr[0] + 1))
      });
    }
  }

  return result;
}

function renderPlan(plan, goal, level, equipment) {
  const container = document.getElementById('planResult');
  let html = `<div class="card"><h2>你的训练计划</h2><p style="color:var(--fg2);margin-bottom:12px;">目标: ${goal} | 水平: ${level} | 器械: ${equipment}</p>`;

  for (const day of plan) {
    html += `<div class="plan-day"><h3>${day.day} — ${day.type}</h3>`;
    if (day.exercises.length === 0) {
      html += '<p style="color:var(--green);">休息恢复日 —— 适当拉伸，充足睡眠</p>';
    } else {
      for (const ex of day.exercises) {
        const tagCls = getMuscleClass(ex.muscle);
        html += `<div class="plan-exercise">
          <span class="ex-name">${ex.name}</span>
          <span class="ex-params">${ex.sets}组 × ${ex.reps}次 | 休息${ex.rest}秒</span>
          <span class="ex-muscle ${tagCls}">${ex.muscle}</span>
        </div>`;
      }
    }
    html += '</div>';
  }

  html += `<div style="text-align:center;margin-top:16px;"><button class="btn btn-primary" onclick="generatePlan()">重新生成</button></div></div>`;
  container.innerHTML = html;
  container.scrollIntoView({ behavior: 'smooth' });
}

function getMuscleClass(muscle) {
  const map = { "胸部":"muscle-chest", "背部":"muscle-back", "腿部":"muscle-legs", "肩部":"muscle-shoulders", "手臂":"muscle-arms", "核心":"muscle-core" };
  return map[muscle] || "";
}

// ==================== 动作库 ====================
function renderLibrary(filter = "all") {
  const grid = document.getElementById('exerciseGrid');
  const filtered = filter === "all" ? exerciseLibrary : exerciseLibrary.filter(ex => ex.muscle === filter);
  document.getElementById('exerciseCount').textContent = filtered.length;

  let html = '';
  for (const ex of filtered) {
    const tagCls = getMuscleClass(ex.muscle);
    html += `<div class="exercise-card">
      <h4>${ex.name}</h4>
      <span class="muscle-tag ${tagCls}">${ex.muscle}</span>
      <p class="exercise-desc">${ex.desc}</p>
      <p style="margin-top:6px;font-size:0.78rem;color:var(--accent2);"><strong>动作要领:</strong> ${ex.video}</p>
    </div>`;
  }
  grid.innerHTML = html;
}

// ==================== 计时器 ====================
let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;

function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  document.getElementById('timerDisplay').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function setTimer(seconds) {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = seconds;
  updateTimerDisplay();
  document.getElementById('timerStart').textContent = '开始';
  document.getElementById('timerDisplay').style.color = 'var(--accent)';
}

function startTimer() {
  if (timerRunning) return;
  if (timerSeconds <= 0) {
    showToast('请先设置计时时间');
    return;
  }
  timerRunning = true;
  document.getElementById('timerStart').textContent = '运行中...';
  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 5 && timerSeconds > 0) {
      document.getElementById('timerDisplay').style.color = 'var(--accent2)';
    }
    if (timerSeconds === 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('timerStart').textContent = '开始';
      document.getElementById('timerDisplay').style.color = 'var(--green)';
      showToast('时间到！开始下一组训练');

function pauseTimer() {
  clearInterval(timerInterval);

}

function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  updateTimerDisplay();
  document.getElementById('timerStart').textContent = '开始';
  document.getElementById('timerDisplay').style.color = 'var(--accent)';
}

// ==================== 数据持久化 ====================
function getStorage(key, defaultValue) {
  try { const v = localStorage.getItem('workout_' + key); return v ? JSON.parse(v) : defaultValue; } catch(e) { return defaultValue; }
}
function setStorage(key, value) {
  try { localStorage.setItem('workout_' + key, JSON.stringify(value)); } catch(e) {}
}

// ==================== 打卡 ====================
function checkIn() {
  const today = new Date().toISOString().split('T')[0];
  const checkins = getStorage('checkins', []);
  if (checkins.includes(today)) {
    showToast('今天已经打过卡了！');
    return;
  }
  checkins.push(today);
  setStorage('checkins', checkins);
  showToast('打卡成功！今日训练完成');
  updateStats();
}

// ==================== 体重记录 ====================
function logWeight() {
  const date = document.getElementById('weightDate').value;
  const weight = parseFloat(document.getElementById('weightValue').value);
  if (!date || isNaN(weight) || weight <= 0) {
    showToast('请填写正确的日期和体重');
    return;
  }
  const weights = getStorage('weights', []);
  // Update or add
  const idx = weights.findIndex(w => w.date === date);
  if (idx >= 0) weights[idx].weight = weight;
  else weights.push({ date, weight });
  weights.sort((a, b) => b.date.localeCompare(a.date));
  setStorage('weights', weights);
  document.getElementById('weightValue').value = '';
  renderWeightLog();
  updateStats();
  showToast('体重记录已保存');
}

function renderWeightLog() {
  const weights = getStorage('weights', []);
  const tbody = document.getElementById('weightTbody');
  const noData = document.getElementById('noWeightData');
  if (weights.length === 0) {
    tbody.innerHTML = '';
    noData.style.display = 'block';
    return;
  }
  noData.style.display = 'none';
  let html = '';
  for (let i = 0; i < weights.length; i++) {
    const w = weights[i];
    let change = '';
    if (i < weights.length - 1) {
      const diff = (w.weight - weights[i + 1].weight).toFixed(1);
      const sign = diff > 0 ? '+' : '';
      const color = diff < 0 ? 'var(--green)' : diff > 0 ? 'var(--accent)' : 'var(--fg2)';
      change = `<span style="color:${color}">${sign}${diff}</span>`;
    } else {
      change = '<span style="color:var(--fg2)">--</span>';
    }
    html += `<tr>
      <td>${w.date}</td>
      <td>${w.weight.toFixed(1)} kg</td>
      <td>${change}</td>
      <td><button class="btn btn-sm btn-secondary" onclick="deleteWeight('${w.date}')">删除</button></td>
    </tr>`;
  }
  tbody.innerHTML = html;
}

function deleteWeight(date) {
  let weights = getStorage('weights', []);
  weights = weights.filter(w => w.date !== date);
  setStorage('weights', weights);
  renderWeightLog();
  updateStats();
  showToast('记录已删除');
}

// ==================== 统计更新 ====================
function updateStats() {
  const checkins = getStorage('checkins', []);
  const weights = getStorage('weights', []);
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];

  // Week workouts
  const dayOfWeek = today.getDay();
  const mondayOffset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  const monday = new Date(today);
  monday.setDate(today.getDate() - mondayOffset);
  const mondayStr = monday.toISOString().split('T')[0];
  const weekCount = checkins.filter(d => d >= mondayStr).length;

  // Month workouts
  const monthStr = todayStr.substring(0, 7);
  const monthCount = checkins.filter(d => d.startsWith(monthStr)).length;

  // Total
  const totalCount = checkins.length;

  // Streak
  let streak = 0;
  const sorted = checkins.slice().sort().reverse();
  const dateSet = new Set(sorted);
  let checkDate = new Date(today);
  // Check if today is checked in, otherwise check yesterday
  if (!dateSet.has(todayStr)) {
    checkDate.setDate(checkDate.getDate() - 1);
  }
  while (dateSet.has(checkDate.toISOString().split('T')[0])) {
    streak++;
    checkDate.setDate(checkDate.getDate() - 1);
  }

  document.getElementById('weekWorkouts').textContent = weekCount;
  document.getElementById('monthWorkouts').textContent = monthCount;
  document.getElementById('totalWorkouts').textContent = totalCount;
  document.getElementById('streak').textContent = streak;
  document.getElementById('currentWeight').textContent = weights.length > 0 ? weights[0].weight.toFixed(1) + ' kg' : '--';
}

// ==================== Toast ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ==================== 导航 ====================
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(btn.dataset.section).classList.add('active');
    if (btn.dataset.section === 'library') renderLibrary();
    if (btn.dataset.section === 'progress') updateStats();
    if (btn.dataset.section === 'weightlog') renderWeightLog();
    if (btn.dataset.section === 'timer') {
      if (!timerRunning && timerSeconds === 0) setTimer(60);
    }
  });
});

// ==================== 动作库筛选 ====================
document.querySelectorAll('#muscleFilters .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#muscleFilters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderLibrary(btn.dataset.filter);
  });
});

document.getElementById('timerStart').addEventListener('click', startTimer);
document.getElementById('timerPause').addEventListener('click', pauseTimer);
document.getElementById('timerReset').addEventListener('click', resetTimer);

// ==================== 初始化 ====================
(function init() {
  // Set default timer
  setTimer(60);
  // Set today date for weight log
  document.getElementById('weightDate').value = new Date().toISOString().split('T')[0];
  // Init library
  renderLibrary();
  // Init stats
  updateStats();
  // Init weight log
  renderWeightLog();
  // Generate initial plan
  generatePlan();
})();
