        updateStats();
        window.scrollTo({ top: outputEl.offsetTop - 100, behavior: 'smooth' });

      state.uiLang = state.uiLang === 'zh' ? 'en' : 'zh';
      const lang = state.uiLang;
      const strings = UI_STRINGS[lang];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.dataset.key;
        if (strings[key]) {
          el.textContent = strings[key];
        }
      });
      if (strings.placeholder) {
        outputEl.placeholder = strings.placeholder;
      }
      $('langIcon').innerHTML = lang === 'zh' ? '&#x1F1FA;&#x1F1F8;' : '&#x1F1E8;&#x1F1F3;';

        : (lang === 'zh' ? '按单词' : 'By Words');
