<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👥 团队KPI</title>
<meta name="description" content="团队KPI管理工具，设定团队目标，追踪成员贡献">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--purple:#7c3aed}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:1000px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
input[type=text],input[type=number]{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
input:focus{outline:none;border-color:var(--accent)}
.team-header{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.team-name{font-size:1.3rem;font-weight:700}
.team-count{font-size:.85rem;color:var(--text2);padding:4px 12px;background:var(--bg);border-radius:20px;border:1px solid var(--border)}
.member-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.member-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;transition:all .2s}
.member-card:hover{border-color:var(--accent)}
.member-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.member-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;color:#fff}
.member-name{font-weight:600;font-size:1rem}
.member-role{font-size:.8rem;color:var(--text2)}
.member-score{font-size:1.4rem;font-weight:700;margin-left:auto}
.member-metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.metric-item{display:flex;justify-content:space-between;font-size:.8rem;padding:4px 0;border-bottom:1px solid var(--border)}
.metric-item:last-child{border:none}
.metric-item .lbl{color:var(--text2)}
.metric-item .val{font-weight:600}
.progress-ring{width:48px;height:48px;position:relative}
.progress-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.progress-ring .bg{fill:none;stroke:var(--border);stroke-width:6}
.progress-ring .fg{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s}
.progress-ring .val{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.7rem;font-weight:700}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:.75rem;font-weight:700}
.rank-1{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff}
.rank-2{background:linear-gradient(135deg,#94a3b8,#cbd5e1);color:#334155}
.rank-3{background:linear-gradient(135deg,#b45309,#92400e);color:#fef3c7}
.rank-other{background:var(--border);color:var(--text2)}
.form-row{display:flex;gap:8px}
.form-row input,.form-row select{flex:1}
.hidden{display:none}
@media(max-width:600px){.member-list{grid-template-columns:1fr}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👥</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="👥 团队KPI">
<meta property="og:description" content="团队KPI管理工具，设定团队目标，追踪成员贡献">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='team_kpi';
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{
  teamName:'研发团队',
  kpiNames:['代码产出','Bug修复','文档编写','代码评审','技术分享'],
  members:[
    {name:'张三',role:'高级工程师',color:'#3b82f6',scores:[92,85,78,88,80]},
    {name:'李四',role:'前端工程师',color:'#8b5cf6',scores:[88,90,82,75,85]},
    {name:'王五',role:'后端工程师',color:'#22c55e',scores:[85,82,90,85,92]},
    {name:'赵六',role:'全栈工程师',color:'#f59e0b',scores:[90,88,85,90,78]}
  ]
};
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function getMemberAvg(m){return Math.round(m.scores.reduce((a,b)=>a+b,0)/m.scores.length)}
function getRank(i){const avgs=state.members.map(m=>getMemberAvg(m)).sort((a,b)=>b-a);const myAvg=getMemberAvg(state.members[i]);return avgs.indexOf(myAvg)+1}
function getKpiAvg(i){return state.members.length?Math.round(state.members.reduce((s,m)=>s+m.scores[i],0)/state.members.length):0}
function addMember(){const name=prompt('输入姓名:');if(!name||!name.trim())return;const role=prompt('输入角色:')||'成员';const colors=['#3b82f6','#8b5cf6','#22c55e','#f59e0b','#ef4444','#ec4899','#14b8a6'];state.members.push({name:name.trim(),role:role.trim(),color:colors[state.members.length%colors.length],scores:state.kpiNames.map(()=>60)});save();render()}
function removeMember(i){if(confirm('确定删除?')){state.members.splice(i,1);save();render()}}
function addKPI(){const name=prompt('输入KPI名称:');if(name&&name.trim()){state.kpiNames.push(name.trim());state.members.forEach(m=>m.scores.push(60));save();render()}}
function removeKPI(i){if(confirm('确定删除?')){state.kpiNames.splice(i,1);state.members.forEach(m=>m.scores.splice(i,1));save();render()}}
function exportData(){let txt=`${state.teamName} KPI报告\n`+'='.repeat(40)+'\n\n';const sorted=[...state.members].sort((a,b)=>getMemberAvg(b)-getMemberAvg(a));sorted.forEach((m,i)=>{txt+=`#${i+1} ${m.name} (${m.role}) - 平均${getMemberAvg(m)}分\n`;state.kpiNames.forEach((k,ki)=>{txt+=`  ${k}: ${m.scores[ki]}\n`});txt+='\n'});const blob=new Blob([txt],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='团队KPI报告.txt';a.click()}
function render(){
  const sorted=state.members.map((m,i)=>({...m,avg:getMemberAvg(m),idx:i})).sort((a,b)=>b.avg-a.avg);
  const teamAvg=state.members.length?Math.round(state.members.reduce((s,m)=>s+getMemberAvg(m),0)/state.members.length):0;
  let h=`<div class="hdr"><h1>👥 团队KPI</h1><p>团队绩效管理与排名</p></div>`;
  h+=`<div class="cd"><div class="team-header"><div class="team-name"><input value="${state.teamName}" onchange="state.teamName=this.value;save()" style="background:transparent;border:none;font-size:1.3rem;font-weight:700;color:var(--text);width:200px"></div><div class="team-count">${state.members.length} 人</div><div style="margin-left:auto;font-size:1.2rem;font-weight:700;color:${teamAvg>=80?'var(--green)':teamAvg>=60?'var(--yellow)':'var(--red)'}">团队均分: ${teamAvg}</div>`;
  h+=`<button onclick="addMember()" style="font-size:.85rem;padding:6px 14px">+ 成员</button><button class="sec" onclick="exportData()" style="font-size:.85rem;padding:6px 14px">导出</button></div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(${state.kpiNames.length},1fr);gap:8px;margin-bottom:12px">`;
  state.kpiNames.forEach((k,i)=>{const avg=getKpiAvg(i);h+=`<div style="text-align:center;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--border)"><div style="font-size:.8rem;color:var(--text2)">${k} <span style="cursor:pointer;color:var(--red);font-size:.7rem" onclick="removeKPI(${i})">✕</span></div><div style="font-size:1.2rem;font-weight:700;color:${avg>=80?'var(--green)':avg>=60?'var(--yellow)':'var(--red)'}">${avg}</div></div>`});
  h+=`<div style="text-align:center;padding:10px;background:var(--bg);border-radius:8px;border:1px dashed var(--border);cursor:pointer;font-size:.8rem;color:var(--text2)" onclick="addKPI()">+ 添加KPI</div></div></div>`;
  h+=`<div class="cd"><h2>🏆 排行榜</h2>`;
  h+=`<div class="member-list">`;
  sorted.forEach((m,rank)=>{
    const rankClass=rank<3?`rank-${rank+1}`:'rank-other';
    h+=`<div class="member-card"><div class="member-top"><span class="rank-badge ${rankClass}">${rank+1}</span>`;
    h+=`<div class="member-avatar" style="background:${m.color}">${m.name[0]}</div>`;
    h+=`<div><div class="member-name"><input value="${m.name}" onchange="state.members[${m.idx}].name=this.value;save()" style="background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-weight:600;width:80px"></div>`;
    h+=`<div class="member-role"><input value="${m.role}" onchange="state.members[${m.idx}].role=this.value;save()" style="background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text2);font-size:.8rem;width:100px"></div></div>`;
    h+=`<div class="member-score" style="color:${m.avg>=80?'var(--green)':m.avg>=60?'var(--yellow)':'var(--red)'};margin-left:auto">${m.avg}</div></div>`;
    h+=`<div class="member-metrics">`;
    state.kpiNames.forEach((k,ki)=>{const s=m.scores[ki];
      h+=`<div class="metric-item"><span class="lbl">${k}</span><span class="val"><input type="range" min="0" max="100" value="${s}" oninput="state.members[${m.idx}].scores[${ki}]=+this.value;this.nextElementSibling.textContent=this.value;save()" style="width:50px" onclick="event.stopPropagation()"><span style="font-size:.8rem;min-width:25px;display:inline-block;text-align:right;color:${s>=80?'var(--green)':s>=60?'var(--yellow)':'var(--red)'}">${s}</span></span></div>`});
    h+=`</div><div style="text-align:right;margin-top:8px"><button class="sec dng" style="padding:2px 8px;font-size:.75rem" onclick="removeMember(${m.idx})">删除</button></div></div>`});
  h+=`</div></div>`;
  $('app').innerHTML=h;
}
render();
</script>
</body>
</html>
