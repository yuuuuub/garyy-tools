<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>选手数据统计</title>
<meta name="description" content="选手数据统计 - 记录和分析选手比赛数据">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a371f7;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--purple:#8250df}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:700px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
input,select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem;width:100%}
label{display:block;color:var(--text2);font-size:.85rem;margin-bottom:4px}
.form-group{margin-bottom:12px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-box{text-align:center;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.stat-value{font-size:1.8rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.8rem;color:var(--text2);margin-top:4px}
.player-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;cursor:pointer;transition:all .2s}
.player-card:hover{border-color:var(--accent)}
.player-card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.3)}
.player-name{font-weight:700;font-size:1.1rem}
.player-tag{font-size:.8rem;color:var(--text2)}
.match-log{font-size:.85rem;padding:8px 0;border-bottom:1px solid var(--border)}
.win{color:var(--green)}
.lose{color:var(--red)}
.draw{color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px}
.bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:4px;transition:width .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.stat-grid{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📊 选手数据统计';
const APP=document.getElementById('app');
let players=JSON.parse(localStorage.getItem('ps_players')||'[]');
let matches=JSON.parse(localStorage.getItem('ps_matches')||'[]');
let selectedPlayer=null;

function save(){localStorage.setItem('ps_players',JSON.stringify(players));localStorage.setItem('ps_matches',JSON.stringify(matches))}

function render(){
  const sp=selectedPlayer?players.find(p=>p.id===selectedPlayer):null;
  const spMatches=sp?matches.filter(m=>m.p1===sp.name||m.p2===sp.name):[];
  const wins=sp?spMatches.filter(m=>m.winner===sp.name).length:0;
  const losses=sp?spMatches.filter(m=>m.winner&&m.winner!==sp.name).length:0;
  const draws=sp?spMatches.filter(m=>!m.winner).length:0;
  const total=sp?spMatches.length:0;
  const winRate=total>0?Math.round(wins/total*100):0;
  APP.innerHTML=`
    <h1>📊 选手数据统计</h1>
    <p class="subtitle">记录和分析选手比赛数据</p>
    <div class="card">
      <div class="form-group">
        <label>添加选手</label>
        <div class="flex">
          <input id="pname" placeholder="选手名称" style="flex:1">
          <input id="ptag" placeholder="标签 (可选)" style="width:120px">
          <button class="btn" onclick="addPlayer()">添加</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="form-group">
        <label>记录比赛</label>
        <div class="flex">
          <select id="mp1" style="flex:1">${players.map(p=>`<option>${p.name}</option>`).join('')}</select>
          <span style="color:var(--text2)">VS</span>
          <select id="mp2" style="flex:1">${players.map(p=>`<option>${p.name}</option>`).join('')}</select>
          <select id="mresult" style="width:100px">
            <option value="p1">左边赢</option>
            <option value="draw">平局</option>
            <option value="p2">右边赢</option>
          </select>
          <button class="btn btn-success" onclick="addMatch()">记录</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h2 style="font-size:1.2rem;margin-bottom:12px">选手列表</h2>
      ${players.length===0?'<div class="empty">添加选手开始统计</div>':''}
      ${players.map(p=>{
        const pm=matches.filter(m=>m.p1===p.name||m.p2===p.name);
        const w=pm.filter(m=>m.winner===p.name).length;
        const l=pm.filter(m=>m.winner&&m.winner!==p.name).length;
        const wr=pm.length>0?Math.round(w/pm.length*100):0;
        return `<div class="player-card ${selectedPlayer===p.id?'active':''}" onclick="selectPlayer('${p.id}')">
          <div class="flex-between">
            <div><div class="player-name">${p.name}</div><div class="player-tag">${p.tag||''} | ${pm.length}场 ${w}胜 ${l}负</div></div>
            <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();removePlayer('${p.id}')">✕</button>
          </div>
          <div class="bar"><div class="bar-fill" style="width:${wr}%;background:${wr>=60?'var(--green)':wr>=40?'var(--yellow)':'var(--red)'}"></div></div>
          <div style="font-size:.75rem;color:var(--text2);margin-top:4px">胜率 ${wr}%</div>
        </div>`;
      }).join('')}
    </div>
    ${sp?`<div class="card">
      <h2 style="font-size:1.2rem;margin-bottom:12px">${sp.name} 详细数据</h2>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-value">${total}</div><div class="stat-label">总场次</div></div>
        <div class="stat-box"><div class="stat-value" style="color:var(--green)">${wins}</div><div class="stat-label">胜</div></div>
        <div class="stat-box"><div class="stat-value" style="color:var(--red)">${losses}</div><div class="stat-label">负</div></div>
        <div class="stat-box"><div class="stat-value" style="color:var(--yellow)">${draws}</div><div class="stat-label">平</div></div>
        <div class="stat-box"><div class="stat-value">${winRate}%</div><div class="stat-label">胜率</div></div>
        <div class="stat-box"><div class="stat-value">${wins>0?Math.round(total/wins*10)/10:0}</div><div class="stat-label">K/D比</div></div>
      </div>
      <h3 style="font-size:1rem;margin:16px 0 8px">比赛记录</h3>
      ${spMatches.slice(-10).reverse().map(m=>{
        const isP1=m.p1===sp.name;
        const won=m.winner===sp.name;
        const draw=!m.winner;
        const cls=draw?'draw':(won?'win':'lose');
        const opp=isP1?m.p2:m.p1;
        return `<div class="match-log ${cls}">${draw?'平':(won?'胜':'负')} vs ${opp} ${m.date||''}</div>`;
      }).join('')}
    </div>`:''}
  `;
}

function addPlayer(){
  const name=document.getElementById('pname').value.trim();
  const tag=document.getElementById('ptag').value.trim();
  if(!name)return;
  if(players.find(p=>p.name===name)){alert('选手已存在');return}
  players.push({id:Date.now().toString(),name,tag});
  document.getElementById('pname').value='';document.getElementById('ptag').value='';
  save();render();
}

function removePlayer(id){
  if(!confirm('确定移除?'))return;
  const p=players.find(x=>x.id===id);
  if(p)matches=matches.filter(m=>m.p1!==p.name&&m.p2!==p.name);
  players=players.filter(x=>x.id!==id);
  if(selectedPlayer===id)selectedPlayer=null;
  save();render();
}

function selectPlayer(id){selectedPlayer=id;render()}

function addMatch(){
  const p1=document.getElementById('mp1').value;
  const p2=document.getElementById('mp2').value;
  const result=document.getElementById('mresult').value;
  if(p1===p2){alert('请选择不同选手');return}
  const winner=result==='draw'?null:result==='p1'?p1:p2;
  matches.push({p1,p2,winner,date:new Date().toLocaleDateString('zh-CN')});
  save();render();
}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement.id==='pname')addPlayer()});
render();
</script>
</body>
</html>
