<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷Pro</title>
<meta name="description" content="专业扫雷游戏，高难度高级扫雷挑战">
<style>
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--success:#22c55e;--error:#ef4444;--n1:#3b82f6;--n2:#22c55e;--n3:#ef4444;--n4:#8b5cf6;--n5:#f59e0b;--n6:#06b6d4;--n7:#e11d48;--n8:#6b7280}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15pxscroll-behavior:smooth;padding:16px;}
h1{font-size:1.5rem;margin-bottom:10px;color:var(--accent)}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.toolbar button,.toolbar select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:0.85rem;cursor:pointer;font-family:inherit}
.toolbar button:hover,.toolbar button.active{border-color:var(--accent);background:var(--accent);color:var(--text)}
.info-bar{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.info-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:0.85rem}
.info-item span{color:var(--accent);font-weight:bold}
.board{display:inline-grid;gap:1px;background:var(--border);border-radius:8px;overflow:hidden;padding:1px;margin-bottom:10px}
.cell{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:bold;cursor:pointer;user-select:none;background:var(--card);transition:all 0.15s;border-radius:2px}
.cell:hover{background:#1e2d3d}
.cell.revealed{background:var(--bg);cursor:default}
.cell.mine{background:var(--error);color:var(--text)}
.cell.flagged{background:var(--card)}
.cell.flagged::after{content:'🚩';font-size:0.9rem}
.cell .n1{color:var(--n1)}.cell .n2{color:var(--n2)}.cell .n3{color:var(--n3)}.cell .n4{color:var(--n4)}
.cell .n5{color:var(--n5)}.cell .n6{color:var(--n6)}.cell .n7{color:var(--n7)}.cell .n8{color:var(--n8)}
.btn-row{display:flex;gap:8px;margin-top:5px}
.btn-row button{background:var(--accent);color:var(--text);border:none;border-radius:8px;padding:8px 16px;font-size:0.9rem;cursor:pointer;font-family:inherit}
.btn-row button:hover{opacity:0.85}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:100}
.overlay .box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px;text-align:center}
.overlay h2{margin-bottom:15px;font-size:1.5rem}
.hidden{display:none!important}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="扫雷Pro">
  <meta property="og:description" content="专业扫雷游戏，高难度高级扫雷挑战">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/minesweeper-pro/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>💣 扫雷Pro</h1>
<div class="toolbar">
  <button onclick="setDiff('easy')" id="easy" class="active">初级 9×9</button>
  <button onclick="setDiff('medium')" id="medium">中级 16×16</button>
  <button onclick="setDiff('hard')" id="hard">高级 16×30</button>
</div>
<div class="info-bar">
  <div class="info-item">💣 <span id="mines">10</span></div>
  <div class="info-item">🚩 <span id="flags">0</span></div>
  <div class="info-item">⏱ <span id="timer">0</span></div>
</div>
<div class="board" id="board"></div>
<div class="btn-row">
  <button onclick="newGame()">🔄 重新开始</button>
</div>
<div class="overlay hidden" id="overlay">
  <div class="box">
    <h2 id="overlayTitle"></h2>
    <p id="overlayMsg"></p>
    <button onclick="newGame();document.getElementById('overlay').classList.add('hidden')">再来一局</button>
  </div>
</div>
<script>
let rows,cols,mineCount,grid,revealed,flagged,gameOver,firstClick,timer,timerInterval;
const DIFFS={easy:{r:9,c:9,m:10},medium:{r:16,c:16,m:40},hard:{r:16,c:30,m:99}};
let currentDiff='easy';

function setDiff(d){
  currentDiff=d;
  document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
  document.getElementById(d).classList.add('active');
  newGame();
}

function newGame(){
  const{r,c,m}=DIFFS[currentDiff];
  rows=r;cols=c;mineCount=m;
  grid=Array.from({length:rows},()=>Array(cols).fill(0));
  revealed=Array.from({length:rows},()=>Array(cols).fill(false));
  flagged=Array.from({length:rows},()=>Array(cols).fill(false));
  gameOver=false;firstClick=true;timer=0;
  document.getElementById('mines').textContent=mineCount;
  document.getElementById('flags').textContent=0;
  document.getElementById('timer').textContent=0;
  clearInterval(timerInterval);
  render();
}

function placeMines(sr,sc){
  let placed=0;
  while(placed<mineCount){
    const r=Math.floor(Math.random()*rows),c=Math.floor(Math.random()*cols);
    if(grid[r][c]===-1)continue;
    if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;
    grid[r][c]=-1;placed++;
  }
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(grid[r][c]===-1)continue;
    let count=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&grid[nr][nc]===-1)count++;
    }
    grid[r][c]=count;
  }
}

function reveal(r,c){
  if(r<0||r>=rows||c<0||c>=cols||revealed[r][c]||flagged[r][c])return;
  revealed[r][c]=true;
  if(grid[r][c]===0){
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)reveal(r+dr,c+dc);
  }
}

function chord(r,c){
  if(grid[r][c]<=0)return;
  let fCount=0;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&flagged[nr][nc])fCount++;
  }
  if(fCount===grid[r][c]){
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&!flagged[nr][nc]){
        if(grid[nr][nc]===-1){gameOver=true;endGame(false);return}
        reveal(nr,nc);
      }
    }
    checkWin();
  }
}

function handleClick(r,c){
  if(gameOver||flagged[r][c]||revealed[r][c])return;
  if(firstClick){
    firstClick=false;
    placeMines(r,c);
    timerInterval=setInterval(()=>{timer++;document.getElementById('timer').textContent=timer},1000);
  }
  if(grid[r][c]===-1){
    revealed[r][c]=true;gameOver=true;
    for(let i=0;i<rows;i++)for(let j=0;j<cols;j++)if(grid[i][j]===-1)revealed[i][j]=true;
    endGame(false);return;
  }
  reveal(r,c);checkWin();render();
}

function handleRight(e,r,c){
  e.preventDefault();
  if(gameOver||revealed[r][c])return;
  flagged[r][c]=!flagged[r][c];
  const fc=flagged.flat().filter(Boolean).length;
  document.getElementById('flags').textContent=fc;
  render();
}

function handleDblClick(r,c){if(revealed[r][c])chord(r,c)}

function checkWin(){
  let unrevealed=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(!revealed[r][c])unrevealed++;
  if(unrevealed===mineCount)endGame(true);
}

function endGame(win){
  clearInterval(timerInterval);gameOver=true;
  document.getElementById('overlayTitle').textContent=win?'🎉 恭喜通关!':'💥 游戏结束!';
  document.getElementById('overlayTitle').style.color=win?'var(--success)':'var(--error)';
  document.getElementById('overlayMsg').textContent='用时: '+timer+'秒';
  setTimeout(()=>document.getElementById('overlay').classList.remove('hidden'),500);
  render();
}

function render(){
  const board=document.getElementById('board');
  board.style.gridTemplateColumns=`repeat(${cols},32px)`;
  board.innerHTML='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const cell=document.createElement('div');
    cell.className='cell';
    if(revealed[r][c]){
      cell.classList.add('revealed');
      if(grid[r][c]===-1)cell.classList.add('mine'),cell.textContent='💣';
      else if(grid[r][c]>0){
        const span=document.createElement('span');
        span.className='n'+grid[r][c];
        span.textContent=grid[r][c];
        cell.appendChild(span);
      }
    } else if(flagged[r][c]){
      cell.classList.add('flagged');
    }
    cell.onclick=()=>handleClick(r,c);
    cell.oncontextmenu=(e)=>handleRight(e,r,c);
    cell.ondblclick=()=>handleDblClick(r,c);
    // Long press for mobile flagging
    let longPress;
    cell.addEventListener('touchstart',()=>{longPress=setTimeout(()=>handleRight({prevent(){}},r,c),500)});
    cell.addEventListener('touchend',()=>clearTimeout(longPress));
    board.appendChild(cell);
  }
}
newGame();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
