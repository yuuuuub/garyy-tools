<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎭 Emoji混合制作器</title>
<meta name="description" content="Emoji混合制作器，将两个Emoji混合创造全新表情">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.mixer-area{display:flex;align-items:center;justify-content:center;gap:16px;padding:20px 0}
.mixer-slot{width:100px;height:100px;border-radius:16px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:48px;cursor:pointer;transition:all .2s;background:var(--preview-bg);position:relative}
.mixer-slot:hover{border-color:var(--accent);transform:scale(1.05)}
.mixer-slot.filled{border-style:solid;border-color:var(--accent)}
.mixer-plus{font-size:32px;color:var(--accent);font-weight:700}
.mixer-equals{font-size:32px;color:var(--accent);font-weight:700}
.mixer-result{width:100px;height:100px;border-radius:16px;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:48px;background:var(--tag-bg);position:relative;overflow:hidden}
.mixer-result canvas{position:absolute;inset:0;width:100%;height:100%}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:200px;overflow-y:auto;padding:4px}
.emoji-grid::-webkit-scrollbar{width:4px}
.emoji-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.emoji-item{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px;border-radius:8px;cursor:pointer;transition:all .2s;border:1.5px solid transparent}
.emoji-item:hover{background:var(--tag-bg);border-color:var(--accent);transform:scale(1.15)}
.emoji-item.selected{background:var(--accent);border-color:var(--accent)}
.category-tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:4px}
.category-tabs::-webkit-scrollbar{display:none}
.cat-tab{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);cursor:pointer;font-size:12px;white-space:nowrap;transition:all .2s}
.cat-tab:hover{border-color:var(--accent)}
.cat-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.history-grid{display:flex;flex-wrap:wrap;gap:8px}
.history-item{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:8px;background:var(--preview-bg);border:1px solid var(--border);cursor:pointer;transition:all .2s;font-size:18px}
.history-item:hover{border-color:var(--accent)}
.history-item span{font-size:12px;color:var(--text-secondary)}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.mixing{animation:pulse .5s ease-in-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🎭 Emoji混合制作器">
<meta property="og:description" content="Emoji混合制作器，将两个Emoji混合创造全新表情">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/emoji-mix-maker/">

</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🎭 Emoji混合制作器</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">🎨 混合区域</div>
    <div class="mixer-area">
      <div class="mixer-slot" id="slotA" title="选择第一个Emoji">❓</div>
      <div class="mixer-plus">+</div>
      <div class="mixer-slot" id="slotB" title="选择第二个Emoji">❓</div>
      <div class="mixer-equals">=</div>
      <div class="mixer-result" id="mixResult">
        <canvas id="mixCanvas" width="200" height="200"></canvas>
        <span id="mixEmoji" style="position:relative;z-index:1">✨</span>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="mixBtn">✨ 开始混合</button>
      <button class="btn btn-outline" id="randomBtn">🎲 随机混合</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📋 选择Emoji</div>
    <div class="category-tabs" id="catTabs"></div>
    <div class="emoji-grid" id="emojiGrid"></div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:8px;text-align:center" id="selectHint">请选择一个Emoji作为混合元素</div>
  </div>

  <div class="card" id="historyCard" style="display:none">
    <div class="card-title">📜 混合历史</div>
    <div class="history-grid" id="historyGrid"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-outline" id="copyBtn">📋 复制结果</button>
    <button class="btn btn-outline" id="downloadBtn">💾 下载图片</button>
  </div>

  <footer>© 2025 Gary's Tools | garyy.top</footer>
</div>
<div class="toast" id="toast"></div>

<script>
function toggleTheme(){var h=document.documentElement;var t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('garyy_theme',t)}
(function(){var s=localStorage.getItem('garyy_theme');if(s==='dark'){document.documentElement.setAttribute('data-theme','dark');document.querySelector('.theme-toggle').textContent='☀️'}})();

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

var emojiData={
  '面部':['😀','😃','😄','😁','😆','😅','🤣','😂','🙂','🙃','😉','😊','😇','🥰','😍','🤩','😘','😗','😚','😙','🥲','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🫢','🤫','🤔','🫡','🤐','🤨','😐','😑','😶','🫥','😏','😒','🙄','😬','🤥','😌','😔','😪','🤤','😴','😷','🤒','🤕','🤢','🤮','🥵','🥶','🥴','😵','🤯','🤠','🥳','🥸','😎','🤓','🧐'],
  '手势':['👋','🤚','🖐️','✋','🖖','🫱','🫲','🫳','🫴','👌','🤌','🤏','✌️','🤞','🫰','🤟','🤘','🤙','👈','👉','👆','🖕','👇','☝️','🫵','👍','👎','✊','👊','🤛','🤜','👏','🙌','🫶','👐','🤲','🤝','🙏'],
  '人物':['👶','🧒','👦','👧','🧑','👱','👨','🧔','👩','🧓','👴','👵','🙍','🙎','🙅','🙆','💁','🙋','🧏','🙇','🤦','🤷','👮','🕵️','💂','🥷','👷','🫅','🤴','👸','👳','👲','🧕','🤵','👰','🤰','🫃','🤱','👼','🎅','🤶','🦸','🦹','🧙','🧚','🧛','🧜','🧝','🧞','🧟','🧌'],
  '动物':['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐻‍❄️','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🙈','🙉','🙊','🐒','🐔','🐧','🐦','🐤','🐣','🐥','🦆','🦅','🦉','🦇','🐺','🐗','🐴','🦄','🐝','🪱','🐛','🦋','🐌','🐞','🐜','🪰','🪲','🪳','🦟','🦗','🕷️','🦂','🐢','🐍','🦎','🦖','🦕','🐙','🦑','🦐','🦞','🦀','🐡','🐠','🐟','🐬','🐳','🐋','🦈','🦭','🐊'],
  '食物':['🍏','🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🫐','🍈','🍒','🍑','🥭','🍍','🥥','🥝','🍅','🥑','🍆','🥔','🥕','🌽','🌶️','🫑','🥒','🥬','🥦','🧄','🧅','🍄','🥜','🫘','🌰','🍞','🥐','🥖','🫓','🥨','🥯','🥞','🧇','🧀','🍖','🍗','🥩','🥓','🍔','🍟','🍕','🌭','🥪','🌮','🌯','🫔','🥙','🧆','🥚','🍳','🥘','🍲','🫕','🥣','🥗','🍿','🧈','🧂','🥫','🍱','🍘','🍙','🍚','🍛','🍜','🦪','🍝','🍠','🍢','🍣','🍤','🍥','🥮','🍡','🥟','🥠','🥡','🦀','🦞','🦐','🦑','🦦','🦤','🍦','🍧','🍨','🍩','🍪','🎂','🍰','🧁','🥧','🍫','🍬','🍭','🍮','🍯'],
  '物品':['⌚','📱','📲','💻','⌨️','🖥️','🖨️','🖱️','🖲️','💽','💾','💿','📀','📼','📷','📸','📹','🎥','📽️','🎞️','📞','☎️','📟','📠','📺','📻','🎙️','🎚️','🎛️','🧭','⏱️','⏲️','⏰','🕰️','📡','🔋','🔌','💡','🔦','🕯️','🪔','🧯','🛢️','💸','💵','💴','💶','💷','🪙','💰','💳','💎','⚖️','🪜','🧰','🪛','🔧','🔨','⚒️','🛠️','⛏️','🪚','🔩','⚙️','🪤','🧱','⛓️','🧲','🔫','💣','🧨','🪓','🔪','🗡️','⚔️','🛡️','🚬','⚰️','🪦','⚱️','🏺','🔮','📿','🧿','🪬','💈','⚗️','🔭','🔬','🕳️','🩹','🩺','💊','💉','🩸','🧬','🦠','🧫','🧪','🌡️'],
  '自然':['🌍','🌎','🌏','🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘','🌙','🌚','🌛','🌜','☀️','🌝','🌞','⭐','🌟','💫','✨','⚡','☄️','💥','🔥','🌪️','🌈','☀️','🌤️','⛅','🌦️','🌧️','⛈️','🌩️','🌨️','❄️','☃️','⛄','🌬️','💨','💧','💦','🫧','☔','☂️','🌊','🌫️','🍏','🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🫐'],
  '符号':['❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❤️‍🔥','❤️‍🩹','❣️','💕','💞','💓','💗','💖','💘','💝','💟','☮️','✝️','☪️','🕉️','☸️','✡️','🔯','🕎','☯️','☦️','🛐','⛎','♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓','🆔','⚛️','🉑','☢️','☣️','📴','📳','🈶','🈚','🈸','🈺','🈷️','✴️','🆚','💮','🉐','㊙️','㊗️','🈴','🈵','🈹','🈲','🅰️','🅱️','🆎','🆑','🅾️','🆘','❌','⭕','🛑','⛔','📛','🚫','💯','💢','♨️','🚷','🚯','🚳','🚱','🔞','📵','🚭']
};

var slotA=null,slotB=null,selectTarget='A',history=[];
var canvas=document.getElementById('mixCanvas'),ctx=canvas.getContext('2d');

function renderCatTabs(){
  var tabs=document.getElementById('catTabs');tabs.innerHTML='';
  Object.keys(emojiData).forEach(function(cat,i){
    var tab=document.createElement('div');tab.className='cat-tab'+(i===0?' active':'');
    tab.textContent=cat;tab.dataset.val=cat;
    tab.addEventListener('click',function(){tabs.querySelectorAll('.cat-tab').forEach(function(t){t.classList.remove('active')});tab.classList.add('active');renderGrid(cat)});
    tabs.appendChild(tab);
  });
  renderGrid(Object.keys(emojiData)[0]);
}

function renderGrid(cat){
  var grid=document.getElementById('emojiGrid');grid.innerHTML='';
  (emojiData[cat]||[]).forEach(function(emoji){
    var el=document.createElement('div');el.className='emoji-item';
    el.textContent=emoji;
    el.addEventListener('click',function(){
      if(selectTarget==='A'){slotA=emoji;document.getElementById('slotA').textContent=emoji;document.getElementById('slotA').classList.add('filled');selectTarget='B';document.getElementById('selectHint').textContent='✅ 第一个已选: '+emoji+' → 请选择第二个Emoji'}
      else{slotB=emoji;document.getElementById('slotB').textContent=emoji;document.getElementById('slotB').classList.add('filled');selectTarget='A';document.getElementById('selectHint').textContent='✅ 两个都已选择，点击"开始混合"！'}
    });
    grid.appendChild(el);
  });
}

function mixEmojis(){
  if(!slotA||!slotB){showToast('请先选择两个Emoji');return}
  var result=document.getElementById('mixResult');
  result.classList.add('mixing');
  setTimeout(function(){result.classList.remove('mixing')},500);

  var combined=slotA+slotB;
  var codes=[];for(var i=0;i<combined.length;i++){var cp=combined.codePointAt(i);if(cp>65535){codes.push(cp);i++}else{codes.push(cp)}}

  ctx.clearRect(0,0,200,200);
  var grad=ctx.createLinearGradient(0,0,200,200);
  grad.addColorStop(0,'rgba(99,102,241,0.15)');grad.addColorStop(1,'rgba(139,92,246,0.15)');
  ctx.fillStyle=grad;ctx.beginPath();ctx.arc(100,100,90,0,Math.PI*2);ctx.fill();

  ctx.font='72px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.globalAlpha=0.5;ctx.fillText(slotA,70,100);ctx.fillText(slotB,130,100);
  ctx.globalAlpha=1;

  var mixEmoji=document.getElementById('mixEmoji');
  var fakeResult=generateMixEmoji(slotA,slotB);
  mixEmoji.textContent=fakeResult;

  history.unshift({a:slotA,b:slotB,result:fakeResult});
  if(history.length>20)history.pop();
  renderHistory();
  showToast('✨ 混合完成！');
}

function generateMixEmoji(a,b){
  var combos=[
    a.slice(0,1)+b.slice(0,1),
    a+b[0],
    b+a[0],
    ['🎭','✨','🌟','💫','🔮','🎨','🎪','🌈','🎆','🎇'][Math.floor(Math.random()*10)]
  ];
  return combos[Math.floor(Math.random()*combos.length)];
}

function renderHistory(){
  if(history.length===0){document.getElementById('historyCard').style.display='none';return}
  document.getElementById('historyCard').style.display='block';
  var grid=document.getElementById('historyGrid');grid.innerHTML='';
  history.forEach(function(h){
    var el=document.createElement('div');el.className='history-item';
    el.innerHTML='<span>'+h.a+'</span><span>+</span><span>'+h.b+'</span><span>=</span><span>'+h.result+'</span>';
    el.addEventListener('click',function(){navigator.clipboard.writeText(h.result).then(function(){showToast('✅ 已复制 '+h.result)})});
    grid.appendChild(el);
  });
}

document.getElementById('mixBtn').addEventListener('click',mixEmojis);
document.getElementById('randomBtn').addEventListener('click',function(){
  var cats=Object.keys(emojiData);
  var cat1=cats[Math.floor(Math.random()*cats.length)];
  var cat2=cats[Math.floor(Math.random()*cats.length)];
  var list1=emojiData[cat1],list2=emojiData[cat2];
  slotA=list1[Math.floor(Math.random()*list1.length)];
  slotB=list2[Math.floor(Math.random()*list2.length)];
  document.getElementById('slotA').textContent=slotA;document.getElementById('slotA').classList.add('filled');
  document.getElementById('slotB').textContent=slotB;document.getElementById('slotB').classList.add('filled');
  selectTarget='A';
  document.getElementById('selectHint').textContent='🎲 随机选择了: '+slotA+' + '+slotB;
  mixEmojis();
});

document.getElementById('copyBtn').addEventListener('click',function(){
  var result=document.getElementById('mixEmoji').textContent;
  if(result==='✨'){showToast('请先混合Emoji');return}
  navigator.clipboard.writeText(result).then(function(){showToast('✅ 已复制混合结果')}).catch(function(){showToast('❌ 复制失败')});
});

document.getElementById('downloadBtn').addEventListener('click',function(){
  var link=document.createElement('a');link.download='emoji-mix-'+Date.now()+'.png';link.href=canvas.toDataURL('image/png');link.click();
  showToast('✅ 已下载图片');
});

document.getElementById('slotA').addEventListener('click',function(){selectTarget='A';document.getElementById('selectHint').textContent='请点击下方选择第一个Emoji'});
document.getElementById('slotB').addEventListener('click',function(){selectTarget='B';document.getElementById('selectHint').textContent='请点击下方选择第二个Emoji'});

renderCatTabs();renderHistory();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:.8;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=.8">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
