<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📘 运维手册</title>
<meta name="description" content="运维手册构建器，创建和管理标准运维操作手册">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📘 运维手册">
<meta property="og:description" content="运维手册构建器 - Gary's Tools">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;transition:background .3s,color .3s}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.3rem;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:60px;font-family:'SF Mono',Menlo,monospace;font-size:.82rem}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-orange{background:var(--orange)}.btn-purple{background:var(--purple)}.btn-sm{padding:4px 10px;font-size:.8rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px}
.theme-toggle{position:fixed;top:12px;right:12px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:8px;cursor:pointer;z-index:100}
.runbook-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.runbook-item:hover{border-color:var(--blue)}
.runbook-item .rb-title{font-weight:600;font-size:.9rem}
.runbook-item .rb-meta{font-size:.75rem;color:var(--text2);margin-top:2px}
.tag{display:inline-block;padding:1px 8px;border-radius:12px;font-size:.7rem;background:var(--bg);border:1px solid var(--border);color:var(--text2);margin:2px}
.step-list{counter-reset:step}
.step-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);position:relative}
.step-item:last-child{border-bottom:none}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.step-content{flex:1}
.step-content .step-title{font-weight:600;font-size:.9rem;margin-bottom:4px}
.step-content .step-desc{font-size:.82rem;color:var(--text2);line-height:1.5}
.step-content .step-cmd{background:#1a1a2e;color:#e6e6e6;padding:8px 12px;border-radius:6px;font-family:'SF Mono',Menlo,monospace;font-size:.8rem;margin-top:6px;white-space:pre-wrap}
.step-content .step-warn{background:#fef3c7;color:#92400e;padding:6px 10px;border-radius:6px;font-size:.8rem;margin-top:6px;border-left:3px solid #d97706}
.step-actions{display:flex;gap:4px;margin-top:6px}
.step-actions button{padding:2px 8px;font-size:.7rem}
.rendered-runbook{line-height:1.7}
.rendered-runbook h2{font-size:1.1rem;margin:16px 0 8px;color:var(--blue)}
.rendered-runbook h3{font-size:.95rem;margin:12px 0 6px}
.rendered-runbook code{background:var(--bg);padding:1px 4px;border-radius:3px;font-size:.85rem}
.rendered-runbook pre{background:#1a1a2e;color:#e6e6e6;padding:12px;border-radius:8px;font-family:'SF Mono',Menlo,monospace;font-size:.8rem;overflow-x:auto;margin:8px 0}
.preview-box{background:#1a1a2e;color:#e6e6e6;padding:16px;border-radius:8px;border:1px solid var(--border);font-family:'SF Mono',Menlo,monospace;font-size:.8rem;line-height:1.6;white-space:pre-wrap;overflow:auto;max-height:400px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>📘 运维手册</h1>

<div class="card">
<div class="section-title">快速创建</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn-sm" onclick="quickCreate('deploy')">🚀 部署流程</button>
<button class="btn-sm btn-orange" onclick="quickCreate('rollback')">⏪ 回滚流程</button>
<button class="btn-sm btn-red" onclick="quickCreate('incident')">🚨 故障处理</button>
<button class="btn-sm btn-green" onclick="quickCreate('monitor')">📊 监控告警</button>
<button class="btn-sm btn-purple" onclick="quickCreate('backup')">💾 备份恢复</button>
</div>
</div>

<div class="card">
<div class="section-title">手册编辑</div>
<div style="margin-bottom:12px"><label>手册标题</label><input type="text" id="rbTitle" placeholder="例：Nginx部署手册"></div>
<div class="form-row">
<div><label>分类</label><select id="rbCategory"><option value="deploy">部署发布</option><option value="ops">日常运维</option><option value="incident">故障处理</option><option value="backup">备份恢复</option><option value="security">安全操作</option><option value="monitor">监控告警</option></select></div>
<div><label>适用环境</label><select id="rbEnv"><option value="production">生产环境</option><option value="staging">预发布环境</option><option value="dev">开发环境</option><option value="all">全部环境</option></select></div>
</div>
<div style="margin-bottom:12px"><label>标签 (逗号分隔)</label><input type="text" id="rbTags" placeholder="nginx,部署,linux"></div>
<div style="margin-bottom:12px">
<label>操作步骤</label>
<div id="stepsContainer"></div>
<button class="btn-sm" onclick="addStep()" style="margin-top:8px">+ 添加步骤</button>
</div>
<div style="margin-bottom:12px"><label>注意事项</label><textarea id="rbNotes" rows="3" placeholder="重要的注意事项和警告"></textarea></div>
<div style="margin-bottom:12px"><label>回滚方案</label><textarea id="rbRollback" rows="3" placeholder="如果操作失败，如何回滚"></textarea></div>
<div style="display:flex;gap:8px">
<button onclick="saveRunbook()">💾 保存手册</button>
<button class="btn-green" onclick="previewRunbook()">👁 预览</button>
<button class="btn-purple" onclick="exportMD()">📤 导出Markdown</button>
</div>
</div>

<div class="card">
<div class="section-title">手册列表 <span id="rbCount" style="font-size:.8rem;color:var(--text2)">(0)</span></div>
<div id="runbookList"></div>
</div>

<div class="card" id="previewCard" style="display:none">
<div class="section-title">手册预览</div>
<div class="rendered-runbook" id="rbPreview"></div>
</div>

<div class="card" id="exportCard" style="display:none">
<div class="section-title">Markdown输出</div>
<div class="preview-box" id="mdOutput"></div>
<div style="margin-top:8px"><button class="btn-sm btn-green" onclick="copyMD()">📋 复制</button></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var runbooks = JSON.parse(localStorage.getItem('runbooks') || '[]');
var idCounter = runbooks.length ? Math.max(...runbooks.map(r=>r.id)) + 1 : 1;
var steps = [];
var stepIdCounter = 0;

var quickTemplates = {
  deploy:{title:'应用部署流程',steps:[
    {title:'拉取最新代码',desc:'从Git仓库拉取最新发布分支代码',cmd:'git pull origin release/v1.0.0',warn:''},
    {title:'安装依赖',desc:'安装或更新项目依赖包',cmd:'npm install --production',warn:''},
    {title:'运行测试',desc:'执行冒烟测试确保基本功能正常',cmd:'npm run test:smoke',warn:'如果测试失败，不要继续部署'},
    {title:'构建项目',desc:'编译构建生产环境代码',cmd:'npm run build',warn:''},
    {title:'重启服务',desc:'使用PM2重启应用服务',cmd:'pm2 restart app --update-env',warn:''},
    {title:'验证服务',desc:'检查服务是否正常启动',cmd:'curl -f http://localhost:3000/health',warn:'如果健康检查失败，执行回滚'}
  ]},
  rollback:{title:'应用回滚流程',steps:[
    {title:'确认回滚版本',desc:'确认要回滚到的目标版本号',cmd:'git log --oneline -5',warn:''},
    {title:'停止当前服务',desc:'停止正在运行的应用服务',cmd:'pm2 stop app',warn:''},
    {title:'切换代码版本',desc:'切换到目标版本的代码',cmd:'git checkout v0.9.0',warn:''},
    {title:'重新安装依赖',desc:'安装目标版本对应的依赖',cmd:'npm install --production',warn:''},
    {title:'构建并重启',desc:'构建并重启服务',cmd:'npm run build && pm2 start app',warn:''},
    {title:'验证回滚',desc:'确认服务正常运行且功能正常',cmd:'curl -f http://localhost:3000/health',warn:''}
  ]},
  incident:{title:'故障应急处理手册',steps:[
    {title:'确认故障范围',desc:'通过监控和告警确认故障影响范围',cmd:'kubectl get pods -n production',warn:''},
    {title:'初步诊断',desc:'查看服务日志和监控指标',cmd:'kubectl logs -f deployment/app --tail=100',warn:''},
    {title:'通知相关人员',desc:'通过企业微信/钉钉通知团队成员',cmd:'',warn:'确保5分钟内通知到负责人'},
    {title:'尝试恢复',desc:'根据故障类型尝试重启或扩容',cmd:'kubectl rollout restart deployment/app',warn:''},
    {title:'持续监控',desc:'观察恢复情况，确认服务恢复正常',cmd:'watch -n 5 kubectl get pods',warn:''},
    {title:'事后复盘',desc:'记录故障时间线和根因分析',cmd:'',warn:'24小时内完成事故复盘报告'}
  ]},
  monitor:{title:'监控告警处理手册',steps:[
    {title:'确认告警',desc:'登录监控平台确认告警详情',cmd:'',warn:''},
    {title:'评估严重程度',desc:'判断告警是否需要立即处理',cmd:'',warn:'P0/P1告警必须5分钟内响应'},
    {title:'查看相关指标',desc:'查看CPU、内存、磁盘、网络等指标',cmd:'top -bn1 | head -20',warn:''},
    {title:'分析日志',desc:'查看应用和系统日志定位问题',cmd:'tail -100 /var/log/app/error.log',warn:''},
    {title:'采取措施',desc:'根据分析结果采取相应措施',cmd:'',warn:''},
    {title:'记录处理过程',desc:'记录告警处理的全过程',cmd:'',warn:''}
  ]},
  backup:{title:'数据备份与恢复手册',steps:[
    {title:'确认备份策略',desc:'确认备份频率、保留周期和存储位置',cmd:'cat /etc/cron.d/backup',warn:''},
    {title:'执行手动备份',desc:'立即执行一次手动备份',cmd:'pg_dump -U postgres mydb > /backup/mydb_$(date +%Y%m%d).sql',warn:''},
    {title:'验证备份文件',desc:'检查备份文件完整性和大小',cmd:'ls -lh /backup/mydb_*.sql',warn:''},
    {title:'上传到远端存储',desc:'将备份文件上传到S3或其他远端存储',cmd:'aws s3 cp /backup/mydb_20240101.sql s3://my-backups/',warn:''},
    {title:'恢复测试(可选)',desc:'在测试环境验证备份可恢复',cmd:'pg_restore -U postgres -d mydb_test /backup/mydb_20240101.sql',warn:'仅在测试环境执行'}
  ]}
};

function quickCreate(type){
  var t=quickTemplates[type];
  document.getElementById('rbTitle').value=t.title;
  steps=[];
  stepIdCounter=0;
  t.steps.forEach(function(s){addStepWithData(s);});
  renderSteps();
}

function addStep(){
  addStepWithData({title:'',desc:'',cmd:'',warn:''});
  renderSteps();
}

function addStepWithData(data){
  steps.push({id:stepIdCounter++,title:data.title,desc:data.desc,cmd:data.cmd,warn:data.warn});
}

function renderSteps(){
  var el=document.getElementById('stepsContainer');
  if(!steps.length){el.innerHTML='<p style="color:var(--text2);font-size:.82rem">点击"添加步骤"或使用快速模板</p>';return;}
  el.innerHTML=steps.map(function(s,i){
    return '<div class="step-item"><div class="step-num">'+(i+1)+'</div><div class="step-content" style="flex:1"><div class="form-row" style="margin-bottom:6px"><div><label>步骤标题</label><input type="text" value="'+s.title+'" onchange="updateStep('+s.id+',\'title\',this.value)" placeholder="步骤标题"></div></div><div style="margin-bottom:6px"><label>描述</label><textarea rows="2" onchange="updateStep('+s.id+',\'desc\',this.value)" placeholder="操作描述">'+s.desc+'</textarea></div><div style="margin-bottom:6px"><label>命令</label><textarea rows="2" onchange="updateStep('+s.id+',\'cmd\',this.value)" placeholder="执行命令">'+s.cmd+'</textarea></div><div style="margin-bottom:6px"><label>警告</label><input type="text" value="'+s.warn+'" onchange="updateStep('+s.id+',\'warn\',this.value)" placeholder="注意事项"></div><button class="btn-sm btn-red" onclick="removeStep('+s.id+')">删除步骤</button></div></div>';
  }).join('');
}

function updateStep(id,key,val){
  var s=steps.find(function(x){return x.id===id;});
  if(s)s[key]=val;
}

function removeStep(id){
  steps=steps.filter(function(s){return s.id!==id;});
  renderSteps();
}

function saveRunbook(){
  var title=document.getElementById('rbTitle').value.trim();
  if(!title){alert('请输入手册标题');return;}
  runbooks.unshift({
    id:idCounter++,title:title,
    category:document.getElementById('rbCategory').value,
    env:document.getElementById('rbEnv').value,
    tags:document.getElementById('rbTags').value,
    steps:JSON.parse(JSON.stringify(steps)),
    notes:document.getElementById('rbNotes').value,
    rollback:document.getElementById('rbRollback').value,
    created:new Date().toLocaleDateString('zh-CN')
  });
  localStorage.setItem('runbooks',JSON.stringify(runbooks));
  renderList();
  alert('手册保存成功！');
}

function renderList(){
  var el=document.getElementById('runbookList');
  document.getElementById('rbCount').textContent='('+runbooks.length+')';
  if(!runbooks.length){el.innerHTML='<p style="color:var(--text2);text-align:center;padding:20px">暂无手册</p>';return;}
  var catLabels={deploy:'部署发布',ops:'日常运维',incident:'故障处理',backup:'备份恢复',security:'安全操作',monitor:'监控告警'};
  el.innerHTML=runbooks.map(function(r){
    var tags=r.tags?r.tags.split(',').map(function(t){return '<span class="tag">'+t.trim()+'</span>';}).join(''):'';
    return '<div class="runbook-item" onclick="loadRunbook('+r.id+')"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="rb-title">'+r.title+'</div><div class="rb-meta">'+(catLabels[r.category]||r.category)+' · '+r.env+' · '+r.steps.length+'个步骤 · '+r.created+'</div><div style="margin-top:4px">'+tags+'</div></div><button class="btn-sm btn-red" onclick="event.stopPropagation();deleteRunbook('+r.id+')">删除</button></div></div>';
  }).join('');
}

function loadRunbook(id){
  var r=runbooks.find(function(x){return x.id===id;});
  if(!r)return;
  document.getElementById('rbTitle').value=r.title;
  document.getElementById('rbCategory').value=r.category;
  document.getElementById('rbEnv').value=r.env;
  document.getElementById('rbTags').value=r.tags||'';
  steps=r.steps.map(function(s){return Object.assign({},s,{id:stepIdCounter++});});
  document.getElementById('rbNotes').value=r.notes||'';
  document.getElementById('rbRollback').value=r.rollback||'';
  renderSteps();
  window.scrollTo({top:0,behavior:'smooth'});
}

function deleteRunbook(id){
  runbooks=runbooks.filter(function(r){return r.id!==id;});
  localStorage.setItem('runbooks',JSON.stringify(runbooks));
  renderList();
}

function previewRunbook(){
  var title=document.getElementById('rbTitle').value||'手册标题';
  var env={production:'生产环境',staging:'预发布环境',dev:'开发环境',all:'全部环境'}[document.getElementById('rbEnv').value];
  var catLabels={deploy:'部署发布',ops:'日常运维',incident:'故障处理',backup:'备份恢复',security:'安全操作',monitor:'监控告警'};
  var html='<h2>'+title+'</h2><p style="color:var(--text2);font-size:.85rem">分类: '+(catLabels[document.getElementById('rbCategory').value]||'')+' | 环境: '+env+' | 更新: '+new Date().toLocaleDateString('zh-CN')+'</p>';
  html+='<h3>操作步骤</h3>';
  steps.forEach(function(s,i){
    html+='<div class="step-item"><div class="step-num">'+(i+1)+'</div><div class="step-content"><div class="step-title">'+s.title+'</div><div class="step-desc">'+s.desc+'</div>';
    if(s.cmd)html+='<pre>'+s.cmd+'</pre>';
    if(s.warn)html+='<div style="background:#fef3c7;color:#92400e;padding:6px 10px;border-radius:6px;font-size:.8rem;margin-top:6px;border-left:3px solid #d97706">⚠️ '+s.warn+'</div>';
    html+='</div></div>';
  });
  var notes=document.getElementById('rbNotes').value;
  if(notes){html+='<h3>注意事项</h3><div style="background:var(--bg);padding:12px;border-radius:8px;font-size:.85rem;line-height:1.6">'+notes.replace(/\n/g,'<br>')+'</div>';}
  var rollback=document.getElementById('rbRollback').value;
  if(rollback){html+='<h3>回滚方案</h3><div style="background:#fee2e2;padding:12px;border-radius:8px;font-size:.85rem;line-height:1.6;color:#991b1b">'+rollback.replace(/\n/g,'<br>')+'</div>';}
  document.getElementById('rbPreview').innerHTML=html;
  document.getElementById('previewCard').style.display='block';
  document.getElementById('previewCard').scrollIntoView({behavior:'smooth'});
}

function exportMD(){
  var title=document.getElementById('rbTitle').value||'手册标题';
  var env={production:'生产环境',staging:'预发布环境',dev:'开发环境',all:'全部环境'}[document.getElementById('rbEnv').value];
  var md='# '+title+'\n\n**环境**: '+env+' | **更新**: '+new Date().toLocaleDateString('zh-CN')+'\n\n## 操作步骤\n\n';
  steps.forEach(function(s,i){
    md+='### Step '+(i+1)+': '+s.title+'\n\n'+s.desc+'\n\n';
    if(s.cmd)md+='```bash\n'+s.cmd+'\n```\n\n';
    if(s.warn)md+='> ⚠️ '+s.warn+'\n\n';
  });
  var notes=document.getElementById('rbNotes').value;
  if(notes)md+='## 注意事项\n\n'+notes+'\n\n';
  var rollback=document.getElementById('rbRollback').value;
  if(rollback)md+='## 回滚方案\n\n'+rollback+'\n\n';
  document.getElementById('mdOutput').textContent=md;
  document.getElementById('exportCard').style.display='block';
  document.getElementById('exportCard').scrollIntoView({behavior:'smooth'});
}

function copyMD(){navigator.clipboard.writeText(document.getElementById('mdOutput').textContent).then(function(){alert('已复制');});}
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
renderList();
</script>
</body>
</html>
