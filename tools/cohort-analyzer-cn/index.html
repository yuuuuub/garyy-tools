<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👥 群组分析器</title>
<meta name="description" content="用户群组分析工具，按注册时间/首次行为分组追踪留存和LTV">
<meta name="robots" content="index, follow">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:20px}
.container{max-width:1100px;margin:0 auto}
h1{color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
label{display:block;font-weight:600;margin-bottom:4px;font-size:13px;color:var(--text2)}
input,select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-orange{background:var(--orange)}
.theme-toggle{position:fixed;top:20px;right:20px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:6px;cursor:pointer;z-index:100}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-box{text-align:center;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.stat-box .num{font-size:22px;font-weight:700;color:var(--blue)}
.stat-box .label{font-size:11px;color:var(--text2);margin-top:4px}
.table-wrap{overflow-x:auto}
.cohort-table{width:100%;border-collapse:collapse;font-size:12px}
.cohort-table th,.cohort-table td{padding:6px 8px;text-align:center;border:1px solid var(--border)}
.cohort-table th{background:var(--bg);font-weight:600;color:var(--text2);position:sticky;top:0}
.cohort-table td{min-width:50px}
.heat-1{background:rgba(9,105,218,.1);color:var(--blue)}
.heat-2{background:rgba(9,105,218,.2)}
.heat-3{background:rgba(9,105,218,.3)}
.heat-4{background:rgba(9,105,218,.4)}
.heat-5{background:rgba(9,105,218,.5);color:#fff}
.heat-6{background:rgba(9,105,218,.65);color:#fff}
.heat-7{background:rgba(9,105,218,.8);color:#fff}
.cohort-label{font-weight:600;text-align:left!important;white-space:nowrap}
.chart-line{position:relative;height:200px;border-left:1px solid var(--border);border-bottom:1px solid var(--border);margin:16px 0}
.chart-line canvas{width:100%;height:100%}
.insight-box{padding:12px;border-radius:6px;margin-top:8px;font-size:13px}
.insight-good{background:rgba(26,127,55,.1);border:1px solid var(--green);color:var(--green)}
.insight-warn{background:rgba(188,76,0,.1);border:1px solid var(--orange);color:var(--orange)}
.insight-bad{background:rgba(207,34,46,.1);border:1px solid var(--red);color:var(--red)}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>👥 群组分析器</h1>

<div class="card">
<h3 style="margin-bottom:12px">配置群组</h3>
<div class="grid-3">
<div><label>分组方式</label><select id="cohortType"><option value="weekly">按周分组</option><option value="monthly">按月分组</option><option value="daily">按天分组</option></select></div>
<div><label>分析指标</label><select id="metricType"><option value="retention">留存率</option><option value="revenue">累计收入</option><option value="orders">累计订单</option></select></div>
<div><label>时间窗口</label><select id="window"><option value="4">4期</option><option value="6" selected>6期</option><option value="8">8期</option><option value="12">12期</option></select></div>
</div>
<div style="margin-top:12px;display:flex;gap:8px">
<button onclick="generateCohort()">📊 生成分析</button>
<button class="btn-green" onclick="loadSampleData()">📋 加载示例数据</button>
<button class="btn-orange" onclick="exportCSV()">📥 导出CSV</button>
</div>
</div>

<div id="statsArea" class="stat-row"></div>

<div class="card">
<h3 style="margin-bottom:12px">群组留存表</h3>
<div class="table-wrap" id="cohortTable"></div>
</div>

<div class="card" id="chartCard" style="display:none">
<h3 style="margin-bottom:12px">留存曲线</h3>
<canvas id="retentionChart"></canvas>
</div>

<div class="card" id="insightCard" style="display:none">
<h3 style="margin-bottom:12px">分析洞察</h3>
<div id="insights"></div>
</div>

<div class="card" id="compareCard" style="display:none">
<h3 style="margin-bottom:12px">群组对比</h3>
<div class="grid-2">
<div><label>对比群组A</label><select id="compareA"></select></div>
<div><label>对比群组B</label><select id="compareB"></select></div>
</div>
<div style="margin-top:8px"><button class="btn-sm" onclick="compareGroups()">对比分析</button></div>
<div id="compareResult" style="margin-top:12px"></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var cohortData=[];var currentData=null;

function generateSampleData(){
  var groups=[];var labels=[];
  var type=document.getElementById('cohortType').value;
  var periods=parseInt(document.getElementById('window').value);
  var numGroups=type==='monthly'?6:type==='weekly'?8:10;

  for(var i=0;i<numGroups;i++){
    var label;
    if(type==='monthly'){
      var d=new Date();d.setMonth(d.getMonth()-numGroups+i);
      label=d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0');
    }else if(type==='weekly'){
      var d=new Date();d.setDate(d.getDate()-(numGroups-i)*7);
      label='W'+(d.getMonth()+1)+'/'+d.getDate();
    }else{
      var d=new Date();d.setDate(d.getDate()-(numGroups-i));
      label=(d.getMonth()+1)+'/'+d.getDate();
    }
    labels.push(label);

    var baseSize=Math.floor(800+Math.random()*1200);
    var retentionRates=[];var baseRetention=0.35+Math.random()*0.2;
    for(var j=0;j<=periods;j++){
      var rate=j===0?1:baseRetention*Math.pow(0.7+Math.random()*0.2,j);
      retentionRates.push(Math.min(1,Math.max(0.01,rate)));
    }
    groups.push({label:label,size:baseSize,retention:retentionRates,cohortIndex:i});
  }
  return{groups:groups,labels:labels,periods:periods};
}

function loadSampleData(){
  currentData=generateSampleData();
  renderAll();
}

function generateCohort(){
  currentData=generateSampleData();
  renderAll();
}

function renderAll(){
  if(!currentData)return;
  renderStats();renderTable();renderChart();renderInsights();renderCompareSelects();
  document.getElementById('chartCard').style.display='block';
  document.getElementById('insightCard').style.display='block';
  document.getElementById('compareCard').style.display='block';
}

function renderStats(){
  var groups=currentData.groups;
  var avgRet1=groups.reduce((s,g)=>s+(g.retention[1]||0),0)/groups.length*100;
  var avgRet3=groups.reduce((s,g)=>s+(g.retention[Math.min(3,groups[0].retention.length-1)]||0),0)/groups.length*100;
  var avgSize=Math.round(groups.reduce((s,g)=>s+g.size,0)/groups.length);
  var bestGroup=groups.reduce((best,g)=>(g.retention[1]||0)>(best.retention[1]||0)?g:best,groups[0]);
  document.getElementById('statsArea').innerHTML='<div class="stat-box"><div class="num">'+groups.length+'</div><div class="label">群组数量</div></div><div class="stat-box"><div class="num" style="color:var(--green)">'+avgRet1.toFixed(1)+'%</div><div class="label">平均次期留存</div></div><div class="stat-box"><div class="num" style="color:var(--blue)">'+avgRet3.toFixed(1)+'%</div><div class="label">平均3期留存</div></div><div class="stat-box"><div class="num" style="color:var(--purple)">'+bestGroup.label+'</div><div class="label">最佳群组</div></div>';
}

function renderTable(){
  var groups=currentData.groups;var periods=currentData.periods;
  var metric=document.getElementById('metricType').value;
  var html='<table class="cohort-table"><thead><tr><th>群组</th><th>用户数</th>';
  for(var j=0;j<=periods;j++)html+='<th>第'+j+'期</th>';
  html+='</tr></thead><tbody>';
  groups.forEach(function(g){
    html+='<tr><td class="cohort-label">'+g.label+'</td><td>'+g.size.toLocaleString()+'</td>';
    for(var j=0;j<=periods;j++){
      var val=g.retention[j]||0;
      var display=metric==='retention'?(val*100).toFixed(1)+'%':metric==='revenue'?'¥'+Math.round(val*g.size*50).toLocaleString():Math.round(val*g.size*2).toLocaleString();
      var heatLevel=Math.min(7,Math.floor(val*8));
      html+='<td class="heat-'+heatLevel+'">'+display+'</td>';
    }
    html+='</tr>';
  });
  html+='</tbody></table>';
  document.getElementById('cohortTable').innerHTML=html;
}

function renderChart(){
  var canvas=document.getElementById('retentionChart');
  var ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth;canvas.height=200;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  var groups=currentData.groups;var periods=currentData.periods;
  var colors=['#0969da','#1a7f37','#8250df','#bc4c00','#cf222e','#d29922','#0969da','#1a7f37'];
  var w=canvas.width,h=canvas.height,pad=40;

  ctx.strokeStyle='#d0d7de';ctx.lineWidth=1;
  for(var i=0;i<=4;i++){
    var y=pad+(h-2*pad)*i/4;
    ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-10,y);ctx.stroke();
    ctx.fillStyle='#656d76';ctx.font='11px sans-serif';ctx.textAlign='right';
    ctx.fillText((100-i*25)+'%',pad-6,y+4);
  }

  groups.forEach(function(g,gi){
    ctx.strokeStyle=colors[gi%colors.length];ctx.lineWidth=2;ctx.beginPath();
    for(var j=0;j<=periods;j++){
      var x=pad+j*(w-pad-10)/periods;
      var y=pad+(1-(g.retention[j]||0))*(h-2*pad);
      if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.fillStyle=colors[gi%colors.length];ctx.font='11px sans-serif';ctx.textAlign='left';
    ctx.fillText(g.label,w-60,16+gi*14);
  });

  ctx.fillStyle='#656d76';ctx.font='11px sans-serif';ctx.textAlign='center';
  for(var j=0;j<=periods;j++){
    ctx.fillText('第'+j+'期',pad+j*(w-pad-10)/periods,h-6);
  }
}

function renderInsights(){
  var groups=currentData.groups;var periods=currentData.periods;
  var avgRetentions=[];
  for(var j=0;j<=periods;j++){
    avgRetentions.push(groups.reduce((s,g)=>s+(g.retention[j]||0),0)/groups.length);
  }

  var html='';
  var bestJ1=groups.reduce((best,g)=>(g.retention[1]||0)>(best.retention[1]||0)?g:best,groups[0]);
  var worstJ1=groups.reduce((worst,g)=>(g.retention[1]||0)<(worst.retention[1]||0)?g:worst,groups[0]);

  html+='<div class="insight-good">✅ <strong>最佳群组：</strong>'+bestJ1.label+' 首期留存 '+((bestJ1.retention[1]||0)*100).toFixed(1)+'%（'+bestJ1.size+'用户）</div>';
  html+='<div class="insight-warn" style="margin-top:8px">⚠️ <strong>最低群组：</strong>'+worstJ1.label+' 首期留存 '+((worstJ1.retention[1]||0)*100).toFixed(1)+'%（'+worstJ1.size+'用户）</div>';

  var dropRate=avgRetentions[0]>0?(1-(avgRetentions[Math.min(3,periods)]||0)/avgRetentions[0])*100:0;
  if(dropRate>70)html+='<div class="insight-bad" style="margin-top:8px">🔴 3期累计流失 '+dropRate.toFixed(1)+'%，留存衰减严重，建议优化用户激活流程</div>';
  else if(dropRate>50)html+='<div class="insight-warn" style="margin-top:8px">🟡 3期累计流失 '+dropRate.toFixed(1)+'%，留存衰减中等，可关注关键节点体验</div>';
  else html+='<div class="insight-good" style="margin-top:8px">🟢 3期累计流失 '+dropRate.toFixed(1)+'%，留存表现良好</div>';

  var trend=avgRetentions.length>2?(avgRetentions[avgRetentions.length-1]-avgRetentions[1]):0;
  if(trend>0)html+='<div class="insight-good" style="margin-top:8px">📈 留存呈上升趋势，新用户质量在改善</div>';
  else if(trend<-0.05)html+='<div class="insight-bad" style="margin-top:8px">📉 留存呈下降趋势，需关注近期用户获取质量</div>';

  document.getElementById('insights').innerHTML=html;
}

function renderCompareSelects(){
  var groups=currentData.groups;
  var html=groups.map(function(g,i){return '<option value="'+i+'">'+g.label+' ('+g.size+'用户)</option>';}).join('');
  document.getElementById('compareA').innerHTML=html;
  document.getElementById('compareB').innerHTML=html;
  if(groups.length>1)document.getElementById('compareB').selectedIndex=1;
}

function compareGroups(){
  var i=parseInt(document.getElementById('compareA').value);
  var j=parseInt(document.getElementById('compareB').value);
  var gA=currentData.groups[i],gB=currentData.groups[j];
  var periods=currentData.periods;

  var html='<div class="grid-2">';
  html+='<div><h4 style="color:var(--blue)">'+gA.label+'</h4>';
  html+='<p>用户数: '+gA.size+'</p>';
  for(var k=0;k<=Math.min(3,periods);k++)html+='<p>第'+k+'期: '+((gA.retention[k]||0)*100).toFixed(1)+'%</p>';
  html+='</div><div><h4 style="color:var(--green)">'+gB.label+'</h4>';
  html+='<p>用户数: '+gB.size+'</p>';
  for(var k=0;k<=Math.min(3,periods);k++)html+='<p>第'+k+'期: '+((gB.retention[k]||0)*100).toFixed(1)+'%</p>';
  html+='</div></div>';

  var diff=((gB.retention[1]||0)-(gA.retention[1]||0))*100;
  html+='<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:6px">';
  html+='<strong>差异分析：</strong>';
  if(Math.abs(diff)<2)html+='两个群组表现接近，首期留存差异仅 '+Math.abs(diff).toFixed(1)+'%';
  else if(diff>0)html+=gB.label+' 首期留存比 '+gA.label+' 高 '+diff.toFixed(1)+'%，用户质量更优';
  else html+=gA.label+' 首期留存比 '+gB.label+' 高 '+Math.abs(diff).toFixed(1)+'%，用户质量更优';
  html+='</div>';
  document.getElementById('compareResult').innerHTML=html;
}

function exportCSV(){
  if(!currentData){alert('请先生成分析');return;}
  var groups=currentData.groups;var periods=currentData.periods;
  var csv='群组,用户数,';
  for(var j=0;j<=periods;j++)csv+='第'+j+'期,';
  csv+='\n';
  groups.forEach(function(g){
    csv+=g.label+','+g.size+',';
    for(var j=0;j<=periods;j++)csv+=(g.retention[j]||0).toFixed(4)+',';
    csv+='\n';
  });
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cohort-analysis.csv';a.click();
}

function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
</script>
</body>
</html>
