<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色彩心理学 - Color Psychology</title>

<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vhpadding:16px;scroll-behavior:smooth;}
.header{text-align:center;padding:2rem 1rem;border-bottom:1px solid var(--border)}
.header h1{font-size:1.8rem;margin-bottom:.3rem}
.header p{color:#8b949e;font-size:.9rem}
.container{max-width:900px;margin:0 auto;padding:1.5rem}
.picker-section{display:flex;gap:1.5rem;flex-wrap:wrap;margin:1.5rem 0}
.picker-left{flex:1;min-width:280px}
.picker-right{flex:1;min-width:280px}
.color-picker-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem}
.color-preview{width:100%;height:120px;border-radius:10px;border:2px solid var(--border);margin-bottom:1rem;transition:background .3s}
.picker-controls{display:flex;flex-direction:column;gap:.8rem}
.picker-controls label{font-size:.85rem;color:#8b949e}
.picker-controls input[type="range"]{width:100%;accent-color:var(--accent)}
.picker-controls input[type="color"]{width:60px;height:36px;border:none;border-radius:6px;cursor:pointer}
.hex-input{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.5rem;color:var(--text);font-family:monospace;width:120px}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-top:1rem}
.result-card h3{margin-bottom:1rem;color:var(--accent)}
.emotion-tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.emotion-tag{padding:.3rem .8rem;border-radius:20px;font-size:.8rem;border:1px solid var(--border)}
.industry-list{display:flex;flex-direction:column;gap:.6rem}
.industry-item{display:flex;align-items:center;gap:.8rem;padding:.6rem;background:var(--bg);border-radius:8px}
.industry-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.industry-item span{font-size:.85rem}
.predefined-section{margin-top:2rem}
.predefined-section h2{margin-bottom:1rem;font-size:1.2rem}
.color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}
.predefined-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .2s}
.predefined-card:hover{transform:translateY(-2px)}
.predefined-swatch{height:60px}
.predefined-info{padding:.8rem}
.predefined-info h4{font-size:.9rem;margin-bottom:.2rem}
.predefined-info p{font-size:.75rem;color:#8b949e}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);outline:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

</div>

<h4 style="margin:.8rem 0 .5rem;font-size:.95rem">情感含义</h4>

</div>
</div>

<div class="color-grid" id="colorGrid"></div>
</div>

</div>

<script>
const colorData={

desc:'绿色是自然的颜色，代表生长、和谐和新鲜。它对眼睛最舒适，能降低压力和焦虑。在许多文化中，绿色代表财富和繁荣。',
industry:['环保行业：自然与可持续','健康医疗：健康与治愈','金融行业：财富与增长','农业食品：新鲜与有机'],
marketing:'绿色适合用于表达健康、环保和成长的品牌。有机食品和健康产品常用绿色作为主色调。'},

industry:['奢侈品：高端与优雅','美容行业：精致与创意','教育行业：智慧与创意','灵性产品：神秘与深度'],

industry:['女性产品：温柔与美丽','儿童产品：可爱与关怀','餐饮甜品：甜美与享受','医疗护理：关怀与温暖'],
marketing:'粉色适合面向女性和年轻群体的品牌。深粉色更有活力，浅粉色更温柔浪漫。'},

desc:'黑色代表力量、优雅和正式。它是所有颜色中最强烈的，常用于奢侈品和时尚品牌。黑色能营造高端感和权威感。',
industry:['时尚行业：高级与潮流','奢侈品：奢华与精致','科技行业：高端与现代','金融服务：专业与权威'],
marketing:'黑色适合高端品牌和需要传达专业感的场景。黑色背景上的白色文字对比度最高，阅读体验好。'},

desc:'白色代表纯洁、简洁和空间。它是所有颜色中最中性的，在设计中留白能提高可读性和视觉舒适度。在东方文化中白色也代表哀悼。',
industry:['科技行业：简约与创新','医疗行业：清洁与专业','极简设计：简约与现代','婚礼行业：纯洁与浪漫'],
marketing:'白色适合极简主义品牌和需要营造空间感的设计。大量留白能突出核心内容，提高信息传达效率。'}
};

function updateFromHSL(){
const h=+document.getElementById('hueRange').value;
const s=+document.getElementById('satRange').value;
const l=+document.getElementById('ligRange').value;
const hex=hslToHex(h,s,l);
document.getElementById('hexInput').value=hex.toUpperCase();
document.getElementById('colorPicker').value=hex;
document.getElementById('colorPreview').style.background=hex;
document.getElementById('hueVal').textContent=h;
document.getElementById('satVal').textContent=s;
document.getElementById('ligVal').textContent=l;
updateResult(h,s,l,hex);
}

function hslToHex(h,s,l){
s/=100;l/=100;
const a=s*Math.min(l,1-l);
const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0')};
return`#${f(0)}${f(8)}${f(4)}`;
}

function hexToHSL(hex){
let r=parseInt(hex.slice(1,3),16)/255;
let g=parseInt(hex.slice(3,5),16)/255;
let b=parseInt(hex.slice(5,7),16)/255;
const max=Math.max(r,g,b),min=Math.min(r,g,b);
let h,s,l=(max+min)/2;
if(max===min){h=s=0}else{
const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);
switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break}
}
return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];
}

function updateResult(h,s,l,hex){
const closest=getClosestColor(h,s,l);
document.getElementById('colorNameDisplay').textContent=`${closest.name} — ${hex.toUpperCase()}`;
const et=document.getElementById('emotionTags');
et.innerHTML='';
closest.emotions.forEach(e=>{
const tag=document.createElement('div');
tag.className='emotion-tag';
tag.style.background=hex+'33';
tag.style.borderColor=hex;
tag.textContent=e;
et.appendChild(tag);
});
document.getElementById('emotionDesc').textContent=closest.desc;
const il=document.getElementById('industryList');
il.innerHTML='';
closest.industry.forEach(item=>{
const parts=item.split('：');
il.innerHTML+=`<div class="industry-item"><div class="industry-dot" style="background:${hex}"></div><span><strong>${parts[0]}</strong>：${parts[1]||''}</span></div>`;
});
document.getElementById('marketingAdvice').textContent=closest.marketing;
}

function getClosestColor(h,s,l){
const colors=['red','orange','yellow','green','blue','purple','pink','black','white'];
const hslMap={red:[0,70,50],orange:[25,90,50],yellow:[50,95,55],green:[140,60,45],blue:[210,85,55],purple:[270,50,50],pink:[330,80,65],black:[0,0,15],white:[0,0,95]};
let best='blue',bestDist=Infinity;
colors.forEach(c=>{
const[ch,cs,cl]=hslMap[c];
const dist=Math.sqrt((h-ch)**2+(s-cs)**2+(l-cl)**2);
if(dist<bestDist){bestDist=dist;best=c}
});
return colorData[best];
}

document.getElementById('hueRange').addEventListener('input',updateFromHSL);
document.getElementById('satRange').addEventListener('input',updateFromHSL);
document.getElementById('ligRange').addEventListener('input',updateFromHSL);
document.getElementById('colorPicker').addEventListener('input',e=>{
const hsl=hexToHSL(e.target.value);
document.getElementById('hueRange').value=hsl[0];
document.getElementById('satRange').value=hsl[1];
document.getElementById('ligRange').value=hsl[2];
updateFromHSL();
});
document.getElementById('hexInput').addEventListener('input',e=>{
const v=e.target.value.trim();
if(/^#[0-9a-fA-F]{6}$/.test(v)){
const hsl=hexToHSL(v);
document.getElementById('hueRange').value=hsl[0];
document.getElementById('satRange').value=hsl[1];
document.getElementById('ligRange').value=hsl[2];
updateFromHSL();
}
});

// Predefined grid
const grid=document.getElementById('colorGrid');
Object.values(colorData).forEach(c=>{
grid.innerHTML+=`<div class="predefined-card" onclick="selectPredefined('${c.hex}')">
<div class="predefined-swatch" style="background:${c.hex}"></div>
<div class="predefined-info"><h4>${c.name}</h4><p>${c.emotions.slice(0,3).join('、')}</p></div>
</div>`;
});

function selectPredefined(hex){
const hsl=hexToHSL(hex);
document.getElementById('hueRange').value=hsl[0];
document.getElementById('satRange').value=hsl[1];
document.getElementById('ligRange').value=hsl[2];
updateFromHSL();
window.scrollTo({top:0,behavior:'smooth'});
}
</script>
<script src="../i18n.js" defer>
document.getElementById("hexInput").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();selectPredefined();}});

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
