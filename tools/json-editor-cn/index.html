<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文JSON编辑器</title>
<meta name="description" content="中文JSON编辑器，在线编辑和验证JSON文件">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px}
nav a{color:var(--accent2);text-decoration:none;font-size:14px}
nav h1{font-size:18px;font-weight:600}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar button{background:var(--border);color:var(--text);border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .2s}
.toolbar button:hover{background:var(--accent)}
.toolbar button.success{background:var(--success)}
.toolbar button.danger{background:var(--error)}
.toolbar select{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:6px;font-size:13px;outline:none}
.toolbar .spacer{flex:1}
.status-bar{background:var(--card);border-bottom:1px solid var(--border);padding:8px 20px;font-size:13px;display:flex;gap:16px;align-items:center}
.status-bar .valid{color:var(--success)}
.status-bar .invalid{color:var(--error)}
.panels{display:flex;flex:1;overflow:hidden}
.panel{flex:1;display:flex;flex-direction:column}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 16px;font-size:13px;color:#8b949e}
#editor{flex:1;width:100%;background:var(--bg);color:var(--text);border:none;padding:16px;font-size:14px;line-height:1.6;font-family:"SF Mono",Monaco,Consolas,monospace;resize:none;outline:none;tab-size:2}
#treeView{flex:1;background:var(--bg);padding:16px;font-size:14px;line-height:1.8;overflow:auto;font-family:"SF Mono",Monaco,Consolas,monospace}
.tree-key{color:var(--accent2)}
.tree-string{color:var(--success)}
.tree-number{color:var(--warning)}
.tree-bool{color:var(--error)}
.tree-null{color:#8b949e}
.tree-toggle{cursor:pointer;user-select:none}
.tree-toggle::before{content:"▼ ";font-size:10px}
.tree-toggle.collapsed::before{content:"▶ "}
.tree-children{padding-left:20px}
.tree-children.hidden{display:none}
.divider{width:4px;background:var(--border);cursor:col-resize;flex-shrink:0}
.toast{position:fixed;bottom:20px;right:20px;background:var(--success);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
@media(max-width:768px){.panels{flex-direction:column}.divider{width:100%;height:4px;cursor:row-resize}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="中文JSON编辑器">
  <meta property="og:description" content="中文JSON编辑器，在线编辑和验证JSON文件">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/json-editor-cn/">
</head>
<body>
<nav>
  <a href="/index.html">← 返回</a>
  <h1>中文JSON编辑器</h1>
</nav>
<div class="toolbar">
  <button onclick="formatJSON()" title="格式化">🔧 格式化</button>
  <button onclick="compressJSON()" title="压缩">📦 压缩</button>
  <button onclick="validateJSON()" title="校验">✅ 校验</button>
  <select id="indentSelect" onchange="formatJSON()">
    <option value="2">2 空格缩进</option>
    <option value="4">4 空格缩进</option>
  </select>
  <button onclick="copyResult()">📋 复制结果</button>
  <button onclick="loadDemo()">📄 加载示例</button>
  <span class="spacer"></span>
  <span class="valid" id="status">● 有效 JSON</span>
</div>
<div class="panels">
  <div class="panel">
    <div class="panel-header"><span>JSON 输入</span></div>
    <textarea id="editor" spellcheck="false" placeholder="在这里粘贴或输入JSON..."></textarea>
  </div>
  <div class="divider" id="divider"></div>
  <div class="panel">
    <div class="panel-header"><span>树形视图</span></div>
    <div id="treeView"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const editor = document.getElementById('editor');
const treeView = document.getElementById('treeView');
const status = document.getElementById('status');

function validateJSON() {
  try {
    JSON.parse(editor.value);
    status.textContent = '● 有效 JSON';
    status.className = 'valid';
    return true;
  } catch (e) {
    status.textContent = '● ' + e.message;
    status.className = 'invalid';
    return false;
  }
}

function formatJSON() {
  if (!validateJSON()) return;
  const indent = parseInt(document.getElementById('indentSelect').value);
  const formatted = JSON.stringify(JSON.parse(editor.value), null, indent);
  editor.value = formatted;
  renderTree();
  showToast('JSON 已格式化');
}

function compressJSON() {
  if (!validateJSON()) return;
  editor.value = JSON.stringify(JSON.parse(editor.value));
  renderTree();
  showToast('JSON 已压缩');
}

function renderTree() {
  try {
    const data = JSON.parse(editor.value);
    treeView.innerHTML = buildTree(data);
  } catch {
    treeView.innerHTML = '<span style="color:var(--error)">无效JSON，无法渲染树形视图</span>';
  }
}

function buildTree(obj, depth = 0) {
  if (obj === null) return '<span class="tree-null">null</span>';
  if (typeof obj === 'string') return `<span class="tree-string">"${escapeHtml(obj)}"</span>`;
  if (typeof obj === 'number') return `<span class="tree-number">${obj}</span>`;
  if (typeof obj === 'boolean') return `<span class="tree-bool">${obj}</span>`;
  if (Array.isArray(obj)) {
    if (obj.length === 0) return '[]';
    const id = 'n' + Math.random().toString(36).slice(2);
    let html = `<span class="tree-toggle" onclick="toggleNode('${id}')"></span>[`;
    html += `<div class="tree-children" id="${id}">`;
    obj.forEach((item, i) => {
      html += `<div>${buildTree(item, depth + 1)}${i < obj.length - 1 ? ',' : ''}</div>`;
    });
    html += `</div>]`;
    return html;
  }
  if (typeof obj === 'object') {
    const keys = Object.keys(obj);
    if (keys.length === 0) return '{}';
    const id = 'n' + Math.random().toString(36).slice(2);
    let html = `<span class="tree-toggle" onclick="toggleNode('${id}')"></span>{`;
    html += `<div class="tree-children" id="${id}">`;
    keys.forEach((key, i) => {
      html += `<div><span class="tree-key">"${escapeHtml(key)}"</span>: ${buildTree(obj[key], depth + 1)}${i < keys.length - 1 ? ',' : ''}</div>`;
    });
    html += `</div>}`;
    return html;
  }
  return String(obj);
}

function toggleNode(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('hidden');
  const toggle = el?.previousElementSibling;
  if (toggle) toggle.classList.toggle('collapsed');
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyResult() {
  navigator.clipboard.writeText(editor.value).then(() => showToast('已复制到剪贴板'));
}

function loadDemo() {
  editor.value = JSON.stringify({
    "name": "张三",
    "age": 28,
    "email": "zhangsan@example.com",
    "isActive": true,
    "address": {
      "city": "北京",
      "district": "朝阳区",
      "street": "建国路88号"
    },
    "hobbies": ["编程", "阅读", "游泳"],
    "education": [
      { "school": "清华大学", "degree": "硕士", "year": 2018 },
      { "school": "北京大学", "degree": "学士", "year": 2015 }
    ],
    "projects": null
  }, null, 2);
  validateJSON();
  renderTree();
}

editor.addEventListener('input', () => { validateJSON(); renderTree(); });

// Resizable divider
const divider = document.getElementById('divider');
let isDragging = false;
divider.addEventListener('mousedown', (e) => { isDragging = true; e.preventDefault(); });
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const panels = document.querySelector('.panels');
  const rect = panels.getBoundingClientRect();
  const pct = ((e.clientX - rect.left) / rect.width) * 100;
  const clamped = Math.min(Math.max(pct, 20), 80);
  panels.children[0].style.flex = 'none';
  panels.children[0].style.width = clamped + '%';
  panels.children[2].style.flex = '1';
});
document.addEventListener('mouseup', () => { isDragging = false; });

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

loadDemo();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
