<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 书架追踪器</title>
<meta name="description" content="追踪你的阅读进度，管理个人书架，记录读书笔记">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1}.ctn{padding:0}}
.li{padding:12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;color:#fff;margin-right:4px}
.tag.read{background:var(--success)}.tag.reading{background:var(--accent)}.tag.toread{background:var(--warn)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.gr .st{text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}
.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
.note{font-size:.85rem;color:var(--text2);margin-top:4px}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.btn-row button{padding:4px 12px;font-size:.8rem}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar button{padding:6px 14px;font-size:.85rem;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:20px;cursor:pointer;transition:all .2s}
.filter-bar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📚 书架追踪器</h1><p>追踪阅读进度，管理个人书架</p></div>

<div class="gr" id="stats">
<div class="st"><div class="nm" id="statTotal">0</div><div class="lb">总藏书</div></div>
<div class="st"><div class="nm" id="statReading">0</div><div class="lb">在读</div></div>
<div class="st"><div class="nm" id="statRead">0</div><div class="lb">已读</div></div>
<div class="st"><div class="nm" id="statPages">0</div><div class="lb">总页数</div></div>
</div>

<div class="cd" style="margin-top:16px"><h2>添加书籍</h2>
<div class="fr">
<div><label>书名</label><input type="text" id="bTitle" placeholder="书名"></div>
<div><label>作者</label><input type="text" id="bAuthor" placeholder="作者"></div>
</div>
<div class="fr">
<div><label>总页数</label><input type="number" id="bPages" placeholder="页数" min="1"></div>
<div><label>状态</label><select id="bStatus"><option value="toread">想读</option><option value="reading">在读</option><option value="read">已读</option></select></div>
</div>
<label>分类</label><input type="text" id="bCategory" placeholder="如：小说、科技、历史">
<label>笔记</label><textarea id="bNote" placeholder="读书笔记..."></textarea>
<div class="bg"><button onclick="addBook()">添加书籍</button></div>
<div id="bMsg" style="display:none;text-align:center;padding:8px;border-radius:8px;margin-top:8px;font-size:.85rem"></div></div>

<div class="cd"><h2>我的书架</h2>
<div class="filter-bar">
<button class="active" onclick="setFilter('all',this)">全部</button>
<button onclick="setFilter('toread',this)">想读</button>
<button onclick="setFilter('reading',this)">在读</button>
<button onclick="setFilter('read',this)">已读</button>
</div>
<div id="bookList" class="es">暂无书籍</div>
</div>

<div class="cd hidden" id="editPanel"><h2>编辑书籍</h2>
<input type="hidden" id="eIdx">
<div class="fr">
<div><label>书名</label><input type="text" id="eTitle"></div>
<div><label>作者</label><input type="text" id="eAuthor"></div>
</div>
<div class="fr">
<div><label>已读页数</label><input type="number" id="eReadPages" min="0"></div>
<div><label>状态</label><select id="eStatus"><option value="toread">想读</option><option value="reading">在读</option><option value="read">已读</option></select></div>
</div>
<label>笔记</label><textarea id="eNote"></textarea>
<div class="bg"><button onclick="saveEdit()">保存</button><button class="sec" onclick="cancelEdit()">取消</button></div>
</div>
</div>

<script>
let books=JSON.parse(localStorage.getItem('bookshelf')||'[]');
let filter='all';
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function save(){localStorage.setItem('bookshelf',JSON.stringify(books))}
function showMsg(m,t){const e=$('bMsg');e.textContent=m;e.style.display='block';e.style.background=t==='error'?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)';e.style.color=t==='error'?'var(--danger)':'var(--success)';setTimeout(()=>e.style.display='none',2000)}
function addBook(){const title=$('bTitle').value.trim(),author=$('bAuthor').value.trim(),pages=parseInt($('bPages').value)||0,status=$('bStatus').value,category=$('bCategory').value.trim(),note=$('bNote').value.trim();if(!title){showMsg('请填写书名','error');return}books.push({title,author,pages,status,category,note,readPages:0,addedAt:Date.now()});save();render();showMsg('书籍已添加','success');['bTitle','bAuthor','bPages','bCategory','bNote'].forEach(id=>$(id).value='')}
function setFilter(f,el){filter=f;document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function render(){const list=filter==='all'?books:books.filter(b=>b.status===filter);$('statTotal').textContent=books.length;$('statReading').textContent=books.filter(b=>b.status==='reading').length;$('statRead').textContent=books.filter(b=>b.status==='read').length;$('statPages').textContent=books.reduce((s,b)=>s+(b.readPages||0),0);$('bookList').innerHTML=list.length?list.map((b,i)=>{const realIdx=books.indexOf(b);const pct=b.pages?Math.min(100,Math.round((b.readPages||0)/b.pages*100)):0;const statusMap={toread:'想读',reading:'在读',read:'已读'};return '<div class="li"><div style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-weight:600">'+esc(b.title)+'</span>'+(b.author?' <span style="color:var(--text2)">· '+esc(b.author)+'</span>':'')+'<br><span class="tag '+b.status+'">'+statusMap[b.status]+'</span>'+(b.category?'<span class="tag" style="background:var(--text2);margin-left:4px">'+esc(b.category)+'</span>':'')+'</div></div>'+(b.status==='reading'&&b.pages?'<div class="pb" style="width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0"><div style="height:100%;background:var(--accent);border-radius:3px;width:'+pct+'%"></div><div style="font-size:.75rem;color:var(--text2);margin-top:2px">'+b.readPages+'/'+b.pages+'页 ('+pct+'%)</div></div>':'')+(b.note?'<div class="note" style="white-space:pre-wrap">'+esc(b.note)+'</div>':'')+'<div class="btn-row" style="margin-top:6px"><button class="sec" onclick="editBook('+realIdx+')">编辑</button><button class="sec" onclick="quickProgress('+realIdx+')">更新进度</button><button class="dng" onclick="removeBook('+realIdx+')">删除</button></div></div>'}).join(''):'<div class="es">暂无书籍</div>'}
function removeBook(i){if(!confirm('确认删除？'))return;books.splice(i,1);save();render()}
function editBook(i){const b=books[i];$('eIdx').value=i;$('eTitle').value=b.title;$('eAuthor').value=b.author;$('eReadPages').value=b.readPages||0;$('eStatus').value=b.status;$('eNote').value=b.note||'';$('editPanel').classList.remove('hidden')}
function saveEdit(){const i=parseInt($('eIdx').value);books[i].title=$('eTitle').value.trim()||books[i].title;books[i].author=$('eAuthor').value.trim();books[i].readPages=parseInt($('eReadPages').value)||0;books[i].status=$('eStatus').value;books[i].note=$('eNote').value.trim();if(books[i].readPages>=books[i].pages&&books[i].pages>0)books[i].status='read';save();render();cancelEdit()}
function cancelEdit(){$('editPanel').classList.add('hidden')}
function quickProgress(i){const b=books[i];const val=prompt('当前已读页数：',b.readPages||0);if(val===null)return;b.readPages=Math.max(0,Math.min(b.pages||9999,parseInt(val)||0));if(b.readPages>=b.pages&&b.pages>0)b.status='read';save();render()}
render()
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
