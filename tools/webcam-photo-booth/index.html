<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📸 网页拍照亭</title>
<meta name="description" content="在线网页拍照亭 - 使用摄像头拍照，支持滤镜、贴纸、定时拍摄和拼图，无需安装">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg-primary:#f8fafc;--bg-card:#ffffff;--bg-input:#f1f5f9;--text-primary:#1e293b;--text-secondary:#64748b;--text-muted:#94a3b8;--border:#e2e8f0;--accent:#3b82f6;--accent-hover:#2563eb;--accent-light:#dbeafe;--danger:#ef4444;--success:#22c55e;--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1);--radius:12px;--radius-sm:8px;--transition:.2s ease}
[data-theme="dark"]{--bg-primary:#0f172a;--bg-card:#1e293b;--bg-input:#334155;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--border:#334155;--accent:#3b82f6;--accent-hover:#60a5fa;--danger:#f87171;--success:#4ade80}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.container{width:100%;max-width:560px;background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:24px 20px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:1.4rem;font-weight:700}
.theme-btn{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer;font-size:1.1rem}
.camera-view{width:100%;aspect-ratio:4/3;background:#0f172a;border-radius:var(--radius-sm);overflow:hidden;position:relative;margin-bottom:12px}
.camera-view video,.camera-view canvas{width:100%;height:100%;object-fit:cover}
.camera-view .no-cam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#64748b;font-size:.9rem}
.camera-view .no-cam .emoji{font-size:3rem;margin-bottom:8px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-btn{padding:6px 12px;border:2px solid var(--border);border-radius:20px;background:var(--bg-input);color:var(--text-primary);font-size:.8rem;font-weight:600;cursor:pointer;transition:all var(--transition)}
.filter-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.stickers{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sticker-btn{padding:6px 10px;border:2px solid var(--border);border-radius:20px;background:var(--bg-input);font-size:1.2rem;cursor:pointer;transition:all var(--transition)}
.sticker-btn.active{border-color:var(--accent);background:var(--accent-light)}
.timer-row{display:flex;gap:6px;margin-bottom:12px}
.timer-btn{flex:1;padding:8px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text-primary);font-size:.85rem;font-weight:600;cursor:pointer;text-align:center;transition:all var(--transition)}
.timer-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.controls{display:flex;gap:8px;margin-bottom:12px}
.btn{flex:1;padding:12px;border:none;border-radius:var(--radius-sm);font-size:1rem;font-weight:600;cursor:pointer;transition:all var(--transition);text-align:center}
.btn-shoot{background:var(--danger);color:#fff;font-size:1.2rem}
.btn-shoot:hover{opacity:.9}
.btn-download{background:var(--success);color:#fff}
.btn-primary{background:var(--accent);color:#fff}
.btn-outline{background:var(--bg-input);color:var(--text-primary);border:2px solid var(--border)}
.countdown{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;font-size:8rem;color:#fff;z-index:999;font-weight:700}
.gallery{margin-top:16px}
.gallery h3{font-size:.9rem;color:var(--text-secondary);margin-bottom:8px}
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gallery-item{aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;position:relative;border:2px solid transparent;transition:border-color .2s}
.gallery-item:hover{border-color:var(--accent)}
.gallery-item img{width:100%;height:100%;object-fit:cover}
.gallery-item .del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;border:none;font-size:.7rem;cursor:pointer;display:none;align-items:center;justify-content:center}
.gallery-item:hover .del{display:flex}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📸 网页拍照亭</h1>
<button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
</header>

<div class="camera-view" id="cameraView">
<video id="video" autoplay playsinline muted></video>
<canvas id="overlay" style="position:absolute;inset:0;pointer-events:none"></canvas>
<div class="no-cam" id="noCam">
<div class="emoji">📷</div>
<p>点击下方"开启摄像头"</p>
</div>
</div>

<div class="filters" id="filters">
<button class="filter-btn active" onclick="setFilter('none',this)">无滤镜</button>
<button class="filter-btn" onclick="setFilter('grayscale',this)">黑白</button>
<button class="filter-btn" onclick="setFilter('sepia',this)">复古</button>
<button class="filter-btn" onclick="setFilter('contrast',this)">高对比</button>
<button class="filter-btn" onclick="setFilter('brightness',this)">高亮</button>
<button class="filter-btn" onclick="setFilter('saturate',this)">高饱和</button>
<button class="filter-btn" onclick="setFilter('hue-rotate',this)">色相旋转</button>
<button class="filter-btn" onclick="setFilter('invert',this)">反色</button>
</div>

<div class="stickers" id="stickers">
<button class="sticker-btn" onclick="setSticker('😊',this)">😊</button>
<button class="sticker-btn" onclick="setSticker('❤️',this)">❤️</button>
<button class="sticker-btn" onclick="setSticker('🌟',this)">🌟</button>
<button class="sticker-btn" onclick="setSticker('🎉',this)">🎉</button>
<button class="sticker-btn" onclick="setSticker('😎',this)">😎</button>
<button class="sticker-btn" onclick="setSticker('🐱',this)">🐱</button>
<button class="sticker-btn" onclick="setSticker('🔥',this)">🔥</button>
<button class="sticker-btn" onclick="setSticker('🌈',this)">🌈</button>
<button class="sticker-btn" onclick="setSticker('❄️',this)">❄️</button>
<button class="sticker-btn" onclick="setSticker('🎵',this)">🎵</button>
</div>

<div class="timer-row">
<button class="timer-btn active" onclick="setTimer(0,this)">无延迟</button>
<button class="timer-btn" onclick="setTimer(3,this)">3秒</button>
<button class="timer-btn" onclick="setTimer(5,this)">5秒</button>
<button class="timer-btn" onclick="setTimer(10,this)">10秒</button>
</div>

<div class="controls">
<button class="btn btn-primary" onclick="startCamera()">📷 开启摄像头</button>
<button class="btn btn-shoot" onclick="takePhoto()">📸 拍照</button>
</div>
<div class="controls">
<button class="btn btn-download" onclick="downloadAll()">💾 下载全部</button>
<button class="btn btn-outline" onclick="clearGallery()">🗑️ 清空相册</button>
</div>

<div class="gallery" id="gallerySection" style="display:none">
<h3>📷 相册 (<span id="photoCount">0</span>张)</h3>
<div class="gallery-grid" id="galleryGrid"></div>
</div>
</div>

<div class="countdown hidden" id="countdown"></div>

<script src="../i18n.js" defer></script>
<script>
function toggleTheme(){
const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
document.documentElement.dataset.theme=t;
document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌙';
}

let video=null,stream=null;
let currentFilter='none';
let currentSticker='';
let timerDelay=0;
let photos=[];

const filterMap={
'none':'none','grayscale':'grayscale(100%)','sepia':'sepia(100%)',
'contrast':'contrast(150%)','brightness':'brightness(1.5)',
'saturate':'saturate(200%)','hue-rotate':'hue-rotate(180deg)','invert':'invert(100%)'
};

function setFilter(f,el){
currentFilter=f;
document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
if(video)video.style.filter=filterMap[f];
}

function setSticker(s,el){
currentSticker=currentSticker===s?'':s;
document.querySelectorAll('.sticker-btn').forEach(b=>b.classList.remove('active'));
if(currentSticker)el.classList.add('active');
}

function setTimer(sec,el){
timerDelay=sec;
document.querySelectorAll('.timer-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
}

async function startCamera(){
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
video=document.getElementById('video');
video.srcObject=stream;
video.style.filter=filterMap[currentFilter];
document.getElementById('noCam').style.display='none';
}catch(e){
alert('无法访问摄像头: '+e.message);
}
}

function takePhoto(){
if(!stream){alert('请先开启摄像头');return;}

if(timerDelay>0){
const cd=document.getElementById('countdown');
cd.classList.remove('hidden');
let count=timerDelay;
cd.textContent=count;
const iv=setInterval(()=>{
count--;
if(count<=0){clearInterval(iv);cd.classList.add('hidden');capture();}
else cd.textContent=count;
},1000);
}else{
capture();
}
}

function capture(){
const canvas=document.createElement('canvas');
const vw=video.videoWidth||640;
const vh=video.videoHeight||480;
canvas.width=vw;canvas.height=vh;
const ctx=canvas.getContext('2d');

// Apply filter
ctx.filter=filterMap[currentFilter];
ctx.drawImage(video,0,0,vw,vh);
ctx.filter='none';

// Draw sticker
if(currentSticker){
ctx.font='64px serif';
ctx.textAlign='center';
ctx.fillText(currentSticker,vw/2,vh-40);
}

// Add timestamp
ctx.fillStyle='rgba(0,0,0,0.5)';
ctx.fillRect(0,vh-30,vw,30);
ctx.fillStyle='#fff';
ctx.font='14px sans-serif';
ctx.textAlign='right';
const now=new Date();
ctx.fillText(now.toLocaleString('zh-CN'),vw-10,vh-10);

const dataUrl=canvas.toDataURL('image/png');
photos.push({data:dataUrl,time:now});
updateGallery();

// Flash effect
const view=document.getElementById('cameraView');
view.style.opacity='0.3';
setTimeout(()=>{view.style.opacity='1';},150);
}

function updateGallery(){
const section=document.getElementById('gallerySection');
const grid=document.getElementById('galleryGrid');
document.getElementById('photoCount').textContent=photos.length;

if(photos.length===0){section.style.display='none';return;}
section.style.display='block';

grid.innerHTML='';
photos.forEach((p,i)=>{
const item=document.createElement('div');
item.className='gallery-item';
item.innerHTML=`<img src="${p.data}" alt="photo-${i}"><button class="del" onclick="deletePhoto(${i})">✕</button>`;
item.onclick=(e)=>{if(!e.target.classList.contains('del'))downloadSingle(i);};
grid.appendChild(item);
});
}

function deletePhoto(i){
photos.splice(i,1);
updateGallery();
}

function downloadSingle(i){
const a=document.createElement('a');
a.href=photos[i].data;
a.download=`photo-${i+1}.png`;
a.click();
}

function downloadAll(){
photos.forEach((p,i)=>{
setTimeout(()=>{
const a=document.createElement('a');
a.href=p.data;
a.download=`photo-${i+1}.png`;
a.click();
},i*200);
});
}

function clearGallery(){
if(photos.length&&!confirm('确定清空相册？'))return;
photos=[];
updateGallery();
}
</script>
</body>
</html>
