<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>石头剪刀布</title>
<meta name="description" content="石头剪刀布游戏，和电脑对战经典猜拳">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
h1{font-size:1.5rem;margin-bottom:20px;color:#3b82f6}
.arena{display:flex;align-items:center;gap:30px;margin-bottom:30px}
.player{text-align:center}
.player .label{font-size:0.9rem;color:#8b949e;margin-bottom:8px}
.player .choice{font-size:4rem;min-height:80px;display:flex;align-items:center;justify-content:center;transition:transform .3s}
.player .choice.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(0.5)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.vs{font-size:2rem;color:#8b949e}
.choices{display:flex;gap:15px;margin-bottom:25px}
.choice-btn{width:80px;height:80px;background:var(--bg);border:2px solid #30363d;border-radius:12px;font-size:2.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.choice-btn:hover{border-color:#3b82f6;transform:scale(1.1)}
.choice-btn:active{transform:scale(0.95)}
.scores{display:flex;gap:25px;font-size:1.1rem;margin-top:10px}
.result{font-size:1.3rem;margin-top:15px;min-height:1.5em;font-weight:bold}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="石头剪刀布">
  <meta property="og:description" content="石头剪刀布游戏，和电脑对战经典猜拳">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/rock-paper-scissors/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>✊✌️🖐️ 石头剪刀布</h1>
<div class="arena">
<div class="player"><div class="label">你</div><div class="choice" id="pChoice">❓</div></div>
<div class="vs">VS</div>
<div class="player"><div class="label">电脑</div><div class="choice" id="cChoice">❓</div></div>
</div>
<div class="choices">
<div class="choice-btn" onclick="play('rock')">✊</div>
<div class="choice-btn" onclick="play('scissors')">✌️</div>
<div class="choice-btn" onclick="play('paper')">🖐️</div>
</div>
<div class="scores">
<span>你: <b id="w">0</b></span>
<span>电脑: <b id="l">0</b></span>
<span>平: <b id="d">0</b></span>
</div>
<div class="result" id="result"></div>
<script>
const emoji={rock:'✊',scissors:'✌️',paper:'🖐️'};
let scores={w:0,l:0,d:0};
let cooldown=false;

function play(p){
  if(cooldown)return;cooldown=true;
  const choices=['rock','scissors','paper'];
  const c=choices[Math.floor(Math.random()*3)];
  document.getElementById('pChoice').textContent=emoji[p];
  document.getElementById('pChoice').classList.remove('pop');void document.getElementById('pChoice').offsetWidth;
  document.getElementById('pChoice').classList.add('pop');
  document.getElementById('cChoice').textContent=emoji[c];
  document.getElementById('cChoice').classList.remove('pop');void document.getElementById('cChoice').offsetWidth;
  document.getElementById('cChoice').classList.add('pop');

  let result='';
  if(p===c){scores.d++;result='平局！🤝'}
  else if((p==='rock'&&c==='scissors')||(p==='scissors'&&c==='paper')||(p==='paper'&&c==='rock')){scores.w++;result='你赢了！🎉'}
  else{scores.l++;result='你输了！😅'}

  document.getElementById('w').textContent=scores.w;
  document.getElementById('l').textContent=scores.l;
  document.getElementById('d').textContent=scores.d;
  document.getElementById('result').textContent=result;
  setTimeout(()=>cooldown=false,500);
}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
