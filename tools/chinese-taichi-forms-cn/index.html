<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}.tag.b{background:rgba(59,130,246,.15);color:var(--blue)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.detail{display:none}.detail.active{display:block}
.step{padding:10px;border-left:3px solid var(--accent);margin-bottom:8px;background:var(--bg);border-radius:0 8px 8px 0}
.step-num{font-weight:700;color:var(--accent);margin-right:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{padding:12px;background:var(--bg);border-radius:8px}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border)}
.log-date{color:var(--text2);font-size:.85rem}
.timer{font-size:2rem;font-weight:700;text-align:center;color:var(--accent);margin:16px 0}
</style>
</head>
<body>
<div class="ctn">
<div class="hdr">
<h1>☯️ 太极拳招式大全</h1>
<p>以柔克刚，动静结合</p>
</div>

<div class="tab-bar" id="tabs">
<div class="tab active" data-tab="forms">招式列表</div>
<div class="tab" data-tab="detail">招式详解</div>

<div id="view-forms" class="detail active">
<div class="cd">
<h2>📋 选择流派</h2>
<div id="style-tabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
<div id="form-list"></div>
</div>
</div>

<div id="view-detail" class="detail">
<div class="cd" id="form-detail-card" style="display:none">
<h2 id="fd-title">招式详情</h2>
<div id="fd-content"></div>
</div>

</div>

<div id="view-practice" class="detail">

<h2>📝 记录练习</h2>
<label>太极流派</label>
<select id="log-style"><option>杨式太极拳24式</option><option>陈式太极拳</option><option>吴式太极拳</option><option>武式太极拳</option><option>孙式太极拳</option></select>
<label>练习时长（分钟）</label>
<input type="number" id="log-duration" value="30" min="5" max="180">
<label>练习招式（可选）</label>
<textarea id="log-forms" rows="2" placeholder="如：起势、野马分鬃、白鹤亮翅"></textarea>
<label>备注</label>
<textarea id="log-note" rows="2" placeholder="如：感觉很好、膝盖有点累等"></textarea>
<button onclick="savePracticeLog()" style="width:100%;margin-top:8px">保存记录</button>
</div>
<div class="cd">
<h2>📊 练习统计</h2>
<div class="stats">
<div class="stat"><div class="stat-num" id="total-sessions">0</div><div class="stat-label">总次数</div></div>
<div class="stat"><div class="stat-num" id="total-hours">0</div><div class="stat-label">总小时</div></div>
<div class="stat"><div class="stat-num" id="streak-days">0</div><div class="stat-label">连续天数</div></div>
</div>
</div>
<div class="cd">
<h2>📅 近期记录</h2>
<div id="recent-logs"></div>
</div>
</div>

<div id="view-knowledge" class="detail">
<div class="cd">
<h2>📖 太极拳历史</h2>
<div id="history-content"></div>
</div>
<div class="cd">
<h2>☯️ 太极哲学</h2>
<div id="philosophy-content"></div>
</div>
<div class="cd">
<h2>💪 健康功效</h2>
<div id="benefits-content"></div>
</div>
</div>
</div>

    {name:'左右搂膝拗步',num:4,desc:'一手搂膝，一手推出，交替进行。搂膝手从耳旁向前推出，另一手搂过膝盖。',breathing:'退吸进呼',keyPoints:['手脚协调','以腰带手','步法稳健'],mistakes:['身体前倾','手脚不同步','推手过高']},
    {name:'手挥琵琶',num:5,desc:'两手如抱琵琶状，重心后移，左脚虚点地面。',breathing:'合吸开呼',keyPoints:['虚实分明','沉肩坠肘','含胸拔背'],mistakes:['重心不稳','身体后仰']},

    {name:'单鞭',num:9,desc:'左手勾手，右手从左向右划弧推出，如甩鞭状。',breathing:'开吸合呼',keyPoints:['勾手到位','推掌有力','步法稳健'],mistakes:['勾手松散','推掌无力']},

    {name:'闪通臂',num:20,desc:'两手前后分开，如闪开通臂。',breathing:'开吸合呼',keyPoints:['虚实分明','以腰带手'],mistakes:['身体僵硬','动作断续']},
    {name:'转身搬拦捶',num:21,desc:'转身，搬、拦、捶三个动作连贯完成。',breathing:'转吸搬呼拦吸捶呼',keyPoints:['三个动作连贯','以腰为轴'],mistakes:['动作分解','发力不整']},
    {name:'如封似闭',num:22,desc:'两手向前按出，如封闭状。',breathing:'进吸退呼',keyPoints:['含胸拔背','沉肩坠肘'],mistakes:['挺胸','用力过猛']},
    {name:'十字手',num:23,desc:'两手交叉于胸前，如十字形。',breathing:'合吸开呼',keyPoints:['两手交叉','全身放松'],mistakes:['耸肩','身体僵硬']},
    {name:'收势',num:24,desc:'两臂慢慢下落，两脚并拢，恢复预备姿势。',breathing:'自然呼吸',keyPoints:['全身放松','气归丹田'],mistakes:['动作过快','心不静']}
  ],
  '陈式太极拳':[

    {name:'懒扎衣',num:2,desc:'右手向右划弧展开，左手护于胸前，如整理衣衫。',breathing:'开吸合呼',keyPoints:['缠丝劲','以腰为轴'],mistakes:['手臂僵硬','动作不到位']},
    {name:'六封四闭',num:3,desc:'两手向前按出，包含封和闭的动作。',breathing:'进吸退呼',keyPoints:['含胸拔背','气沉丹田'],mistakes:['挺胸','用力过猛']},
    {name:'单鞭',num:4,desc:'同杨式单鞭但带有缠丝劲。',breathing:'开吸合呼',keyPoints:['勾手到位','缠丝劲'],mistakes:['勾手松散']},
    {name:'金刚捣碓',num:5,desc:'重复起势动作。',breathing:'开吸合呼',keyPoints:['与起势相同'],mistakes:['与起势相同']}
  ],
  '吴式太极拳':[
    {name:'起势',num:1,desc:'吴式太极起势动作柔和缓慢。',breathing:'自然呼吸',keyPoints:['柔和缓慢','斜中寓正'],mistakes:['动作过大']},
    {name:'揽雀尾',num:2,desc:'吴式揽雀尾动作细腻，注重化劲。',breathing:'开吸合呼',keyPoints:['化劲为主','粘连黏随'],mistakes:['用力过猛']},
    {name:'单鞭',num:3,desc:'吴式单鞭身形略斜。',breathing:'开吸合呼',keyPoints:['斜中寓正'],mistakes:['身体过于倾斜']}
  ],
  '武式太极拳':[
    {name:'起势',num:1,desc:'武式太极起势紧凑，步法灵活。',breathing:'自然呼吸',keyPoints:['紧凑灵活','步法清晰'],mistakes:['动作松散']},
    {name:'搂膝拗步',num:2,desc:'武式搂膝拗步步法转换明显。',breathing:'退吸进呼',keyPoints:['步法清晰','虚实分明'],mistakes:['步法凌乱']}

const knowledge = {
  history:'太极拳起源于明末清初，传由陈王廷创编。后经杨露禅、武禹襄、吴鉴泉、孙禄堂等名家发展，形成杨式、吴式、武式、孙式等主要流派。2020年，太极拳被列入联合国教科文组织人类非物质文化遗产代表作名录。',
  philosophy:'太极拳以《易经》阴阳哲学为理论基础。"太极"意为阴阳未分之混沌状态，太极生两仪（阴阳），两仪生四象，四象生八卦。太极拳讲究动静结合、虚实转换、刚柔相济，体现了中国传统哲学中"天人合一"的思想。',
  benefits:'太极拳的健康功效包括：增强心肺功能、改善平衡能力、缓解关节疼痛、降低血压、减轻压力和焦虑、改善睡眠质量、增强免疫力、延缓衰老。长期练习可强身健体、延年益寿。'
};

let activeStyle = '杨式太极拳24式';
let currentForm = null;

function loadData() { return JSON.parse(localStorage.getItem('taichi-data') || '{"records":[]}'); }
function saveData(d) { localStorage.setItem('taichi-data', JSON.stringify(d)); }

function renderStyleTabs() {
  document.getElementById('style-tabs').innerHTML = Object.keys(styles).map(s =>
    `<div class="tab ${s === activeStyle ? 'active' : ''}" onclick="switchStyle('${s}')" style="padding:6px 12px;font-size:.75rem">${s.replace(/太极拳/,'')}</div>`
  ).join('');
}

function switchStyle(s) {
  activeStyle = s;
  renderStyleTabs();
  renderFormList();
}

function renderFormList() {
  const forms = styles[activeStyle] || [];
  document.getElementById('form-list').innerHTML = forms.map(f => `
    <div class="li" onclick="showForm('${activeStyle}',${f.num - 1})">
      <div><strong>${f.num}. ${f.name}</strong><br><span style="color:var(--text2);font-size:.85rem">${f.breathing}</span></div>
      <span class="tag b">${activeStyle.replace(/太极拳.*/,'')}</span>
    </div>
  `).join('');
}

function showForm(style, idx) {
  currentForm = {style, idx};
  const f = styles[style][idx];
  document.getElementById('form-detail-card').style.display = 'block';
  document.getElementById('detail-empty').style.display = 'none';
  document.getElementById('fd-title').textContent = `${f.num}. ${f.name}`;
  document.getElementById('fd-content').innerHTML = `
    <p style="margin-bottom:12px;color:var(--text2)">${f.desc}</p>
    <div style="margin-bottom:8px"><strong>呼吸配合：</strong><span class="tag w">${f.breathing}</span></div>
    <div style="margin-bottom:12px"><strong>要领：</strong>${f.keyPoints.map(p => `<span class="tag s" style="margin:2px">${p}</span>`).join('')}</div>
    <div><strong>常见错误：</strong>${f.mistakes.map(m => `<span class="tag d" style="margin:2px">${m}</span>`).join('')}</div>
    <div style="margin-top:12px;display:flex;gap:8px">
      ${idx > 0 ? `<button class="sec" onclick="showForm('${style}',${idx - 1})">← 上一式</button>` : ''}
      ${idx < styles[style].length - 1 ? `<button onclick="showForm('${style}',${idx + 1})">下一式 →</button>` : ''}
    </div>`;
}

function savePracticeLog() {
  const style = document.getElementById('log-style').value;
  const duration = parseInt(document.getElementById('log-duration').value);
  const forms = document.getElementById('log-forms').value;
  const note = document.getElementById('log-note').value;
  if (!duration) return alert('请填写练习时长');

  const data = loadData();
  data.records.push({
    date: new Date().toISOString().split('T')[0],
    style, duration, forms, note, timestamp: Date.now()
  });
  saveData(data);
  alert(`✅ 已记录：${style}，${duration}分钟`);
  renderPracticeStats();
}

function renderPracticeStats() {
  const data = loadData();
  const records = data.records;
  document.getElementById('total-sessions').textContent = records.length;
  document.getElementById('total-hours').textContent = (records.reduce((s, r) => s + r.duration, 0) / 60).toFixed(1);

  const dates = [...new Set(records.map(r => r.date))].sort().reverse();
  let streak = 0;
  let checkDate = new Date();
  while (dates.includes(checkDate.toISOString().split('T')[0])) {
    streak++;
    checkDate.setDate(checkDate.getDate() - 1);
  }
  document.getElementById('streak-days').textContent = streak;

  const recent = records.slice(-7).reverse();
  document.getElementById('recent-logs').innerHTML = recent.length ? recent.map(r => `
    <div class="log-item">
      <div><strong>${r.style}</strong><br><span class="log-date">${r.date} · ${r.duration}分钟${r.note ? ' · ' + r.note : ''}</span></div>
      <span class="tag s">✓</span>
    </div>
  `).join('') : '<div class="empty">暂无记录</div>';
}

function renderKnowledge() {
  document.getElementById('history-content').innerHTML = `<p style="color:var(--text2);font-size:.9rem;line-height:1.6">${knowledge.history}</p>`;
  document.getElementById('philosophy-content').innerHTML = `<p style="color:var(--text2);font-size:.9rem;line-height:1.6">${knowledge.philosophy}</p>`;
  document.getElementById('benefits-content').innerHTML = `<p style="color:var(--text2);font-size:.9rem;line-height:1.6">${knowledge.benefits}</p>`;
}

// Tabs
document.querySelectorAll('#tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'practice') renderPracticeStats();
  });
});

renderStyleTabs();
renderFormList();
renderKnowledge();
</script>
</body>
</html>
