<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文图表制作器</title>
<meta name="description" content="中文图表制作器，支持柱状图、折线图、饼图、散点图等多种可视化图表">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6scroll-behavior:smooth;}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:var(--text);font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px;font-family:monospace}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.hidden{display:none!important}
.chart-canvas{background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中文图表制作器">
<meta property="og:description" content="中文图表制作器，支持柱状图、折线图、饼图、散点图等多种可视化图表">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chart-maker-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📈 中文图表制作器';
const APP=document.getElementById('app');
let charts=JSON.parse(localStorage.getItem('cm_charts')||'[]');
let curChart=null;
const COLORS=['#3b82f6','#3fb950','#f85149','#d29922','#a855f7','#ec4899','#06b6d4','#f97316'];

function save(){localStorage.setItem('cm_charts',JSON.stringify(charts))}

function render(){
  let h=`<h1>📈 中文图表制作器</h1><p class="subtitle">创建自定义数据可视化图表</p>`;
  if(curChart!==null){
    let c=charts[curChart];
    h+=`<div class="card"><div class="flex-between"><button class="btn btn-sm" onclick="curChart=null;render()">← 返回</button><b>${c.title}</b></div></div>`;
    h+=`<div class="card"><div class="grid" style="grid-template-columns:1fr 1fr 1fr">`;
    h+=`<div><label>图表类型</label><select id="cType" onchange="charts[${curChart}].type=this.value;save();render()"><option value="bar" ${c.type==='bar'?'selected':''}>柱状图</option><option value="line" ${c.type==='line'?'selected':''}>折线图</option><option value="pie" ${c.type==='pie'?'selected':''}>饼图</option><option value="area" ${c.type==='area'?'selected':''}>面积图</option><option value="scatter" ${c.type==='scatter'?'selected':''}>散点图</option><option value="horizontalBar" ${c.type==='horizontalBar'?'selected':''}>水平柱状图</option></select></div>`;
    h+=`<div><label>X轴标签</label><input id="xLabel" value="${c.xLabel||''}" onchange="charts[${curChart}].xLabel=this.value;save()"></div>`;
    h+=`<div><label>Y轴标签</label><input id="yLabel" value="${c.yLabel||''}" onchange="charts[${curChart}].yLabel=this.value;save()"></div>`;
    h+=`</div></div>`;
    h+=renderChart(c);
    h+=`<div class="card"><div class="flex-between" style="margin-bottom:12px"><b style="font-size:.9rem">数据点</b><button class="btn btn-sm" onclick="addPoint()">+ 添加</button></div>`;
    if(c.points.length){
      h+=`<table class="table"><tr><th>X</th><th>Y</th><th>操作</th></tr>`;
      c.points.forEach((p,i)=>{
        h+=`<tr><td>${p.x}</td><td>${p.y}</td><td><button class="btn btn-sm" onclick="editPoint(${i})">编辑</button> <button class="btn btn-sm btn-danger" onclick="delPoint(${i})">×</button></td></tr>`;
      });
      h+=`</table>`;
    } else {
      h+=`<div class="empty" style="padding:20px">暂无数据点</div>`;
    }
    h+=`</div>`;
  } else {
    h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">图表列表</span><button class="btn btn-sm" onclick="newChart()">+ 新建</button></div></div>`;
    charts.forEach((c,i)=>{
      let types={bar:'柱状图',line:'折线图',pie:'饼图',area:'面积图',scatter:'散点图',horizontalBar:'水平柱状图'};
      h+=`<div class="card"><div class="flex-between"><b>${c.title}</b><div class="flex"><span class="badge badge-blue">${types[c.type]||c.type}</span><span class="badge badge-green">${c.points.length} 点</span><button class="btn btn-sm" onclick="openChart(${i})">编辑</button><button class="btn btn-sm btn-danger" onclick="delChart(${i})">×</button></div></div></div>`;
    });
    if(!charts.length) h+=`<div class="empty">暂无图表</div>`;
  }
  APP.innerHTML=h;
}

function renderChart(c){
  if(!c.points.length) return `<div class="card"><div class="empty" style="padding:30px">添加数据点后显示图表</div></div>`;
  let w=Math.min(600,window.innerWidth-80),ht=320;
  let svg=`<div class="card chart-canvas" style="padding:16px"><svg width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}" style="display:block;margin:0 auto">`;
  let pad={l:50,r:20,t:20,b:40};
  let cw=w-pad.l-pad.r,ch=ht-pad.t-pad.b;
  svg+=`<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${ht-pad.b}" stroke="var(--border)" stroke-width="1"/>`;
  svg+=`<line x1="${pad.l}" y1="${ht-pad.b}" x2="${w-pad.r}" y2="${ht-pad.b}" stroke="var(--border)" stroke-width="1"/>`;
  if(c.xLabel) svg+=`<text x="${w/2}" y="${ht-4}" fill="var(--text2)" font-size="11" text-anchor="middle">${c.xLabel}</text>`;
  if(c.yLabel) svg+=`<text x="12" y="${ht/2}" fill="var(--text2)" font-size="11" text-anchor="middle" transform="rotate(-90,12,${ht/2})">${c.yLabel}</text>`;

  if(c.type==='pie'){
    let total=c.points.reduce((s,p)=>s+Math.abs(p.y),0);
    if(total===0) return '';
    let cx=w/2,cy=ht/2,r=Math.min(cw,ch)/2-10,angle=-Math.PI/2;
    c.points.forEach((p,i)=>{
      let sweep=Math.abs(p.y)/total*Math.PI*2;
      let x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
      angle+=sweep;
      let x2=cx+r*Math.cos(angle),y2=cy+r*Math.sin(angle);
      let large=sweep>Math.PI?1:0;
      svg+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${COLORS[i%COLORS.length]}" opacity="0.85"/>`;
      if(sweep>0.25){
        let mid=angle-sweep/2;
        let tx=cx+(r*0.6)*Math.cos(mid),ty=cy+(r*0.6)*Math.sin(mid);
        svg+=`<text x="${tx}" y="${ty}" fill="#fff" font-size="11" text-anchor="middle" dominant-baseline="middle">${p.x}</text>`;
      }
    });
    svg+=`</svg></div>`;
    return svg;
  }

  let maxY=Math.max(...c.points.map(p=>p.y),1);
  let minY=Math.min(...c.points.map(p=>p.y),0);
  let range=maxY-minY||1;
  for(let i=0;i<=4;i++){
    let y=pad.t+ch*(1-i/4);
    svg+=`<text x="${pad.l-8}" y="${y+4}" fill="var(--text2)" font-size="10" text-anchor="end">${Math.round(minY+range*i/4)}</text>`;
    svg+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4"/>`;
  }

  if(c.type==='scatter'){
    c.points.forEach((p,i)=>{
      let x=pad.l+(i/(c.points.length-1||1))*cw;
      let y=pad.t+ch*(1-(p.y-minY)/range);
      svg+=`<circle cx="${x}" cy="${y}" r="5" fill="${COLORS[i%COLORS.length]}" opacity="0.85"/>`;
      svg+=`<text x="${x}" y="${y-10}" fill="var(--text2)" font-size="10" text-anchor="middle">${p.x}</text>`;
    });
  } else if(c.type==='horizontalBar'){
    let bh=Math.min(30,ch/c.points.length-6);
    c.points.forEach((p,i)=>{
      let bw=Math.abs(p.y)/maxY*cw;
      let y=pad.t+i*(ch/c.points.length)+3;
      svg+=`<rect x="${pad.l}" y="${y}" width="${bw}" height="${bh}" fill="${COLORS[i%COLORS.length]}" rx="4" opacity="0.85"/>`;
      svg+=`<text x="${pad.l-8}" y="${y+bh/2+4}" fill="var(--text2)" font-size="10" text-anchor="end">${p.x}</text>`;
      svg+=`<text x="${pad.l+bw+6}" y="${y+bh/2+4}" fill="var(--text)" font-size="10">${p.y}</text>`;
    });
  } else {
    let n=c.points.length;
    let step=cw/(n||1);
    if(c.type==='area'){
      let pts=c.points.map((p,i)=>`${pad.l+i*step},${pad.t+ch*(1-(p.y-minY)/range)}`).join(' ');
      svg+=`<polygon points="${pad.l},${pad.t+ch} ${pts} ${pad.l+(n-1)*step},${pad.t+ch}" fill="${COLORS[0]}" opacity="0.2"/>`;
    }
    if(c.type==='line'||c.type==='area'){
      let pts=c.points.map((p,i)=>`${pad.l+i*step},${pad.t+ch*(1-(p.y-minY)/range)}`).join(' ');
      svg+=`<polyline points="${pts}" fill="none" stroke="${COLORS[0]}" stroke-width="2.5" stroke-linecap="round"/>`;
      c.points.forEach((p,i)=>{
        let x=pad.l+i*step,y=pad.t+ch*(1-(p.y-minY)/range);
        svg+=`<circle cx="${x}" cy="${y}" r="4" fill="${COLORS[0]}"/>`;
        svg+=`<text x="${x}" y="${y-10}" fill="var(--text)" font-size="10" text-anchor="middle">${p.y}</text>`;
      });
    } else {
      let bw=Math.max(16,step*0.6);
      c.points.forEach((p,i)=>{
        let x=pad.l+i*step+step/2-bw/2;
        let bh=Math.abs(p.y)/maxY*ch;
        let y=pad.t+ch-bh;
        svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${COLORS[i%COLORS.length]}" rx="4" opacity="0.85"/>`;
        svg+=`<text x="${x+bw/2}" y="${y-6}" fill="var(--text)" font-size="10" text-anchor="middle">${p.y}</text>`;
      });
    }
    c.points.forEach((p,i)=>{
      svg+=`<text x="${pad.l+i*step+step/2}" y="${ht-pad.b+16}" fill="var(--text2)" font-size="10" text-anchor="middle">${p.x}</text>`;
    });
  }
  svg+=`</svg></div>`;
  return svg;
}

function newChart(){let t=prompt('图表标题：');if(t){charts.push({title:t,type:'bar',points:[],xLabel:'',yLabel:''});save();render()}}
function openChart(i){curChart=i;render()}
function delChart(i){if(confirm('删除？')){charts.splice(i,1);curChart=null;save();render()}}
function addPoint(){let x=prompt('X值（标签）：');if(x===null)return;let y=parseFloat(prompt('Y值（数字）：'));if(isNaN(y))return;charts[curChart].points.push({x,y});save();render()}
function editPoint(i){let p=charts[curChart].points[i];let x=prompt('X值：',p.x);if(x===null)return;let y=parseFloat(prompt('Y值：',p.y));if(isNaN(y))return;charts[curChart].points[i]={x,y};save();render()}
function delPoint(i){charts[curChart].points.splice(i,1);save();render()}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
