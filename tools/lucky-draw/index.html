<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥢 在线抽签</title>
<style>
  :root {
    --bg: #fdf6f0;
    --card-bg: #fff;
    --primary: #c53030;
    --primary-hover: #9b2c2c;
    --text: #2d1a1a;
    --text-secondary: #6b4e4e;
    --border: #e8d5c4;
    --accent: #d4a574;
    --gold: #c9973a;
    --shadow: rgba(197, 48, 48, 0.12);
  }
  .dark {
    --bg: #1a1212;
    --card-bg: #2a1f1f;
    --primary: #e53e3e;
    --primary-hover: #fc8181;
    --text: #f0e6d3;
    --text-secondary: #b8a89a;
    --border: #4a3a3a;
    --accent: #c9973a;
    --gold: #e5b94e;
    --shadow: rgba(229, 62, 62, 0.18);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background .3s, color .3s;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 480px;
    padding: 16px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 24px 0 12px;
    position: relative;
  }
  .header h1 {
    font-size: 2rem;
    letter-spacing: .08em;
    color: var(--primary);
  }
  .header .subtitle {
    font-size: .88rem;
    color: var(--text-secondary);
    margin-top: 4px;
    letter-spacing: .12em;
  }

  /* Theme toggle */
  .theme-toggle {
    position: absolute;
    top: 28px;
    right: 0;
    background: none;
    border: 2px solid var(--border);
    border-radius: 24px;
    padding: 6px 12px;
    font-size: .88rem;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all .2s;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

  /* Tube selector */
  .tubes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .tube-btn {
    position: relative;
    padding: 14px 6px;
    border: 2px solid var(--border);
    border-radius: 16px;
    background: var(--card-bg);
    cursor: pointer;
    text-align: center;
    transition: all .25s;
    font-size: .9rem;
    color: var(--text);
    font-weight: 500;
    overflow: hidden;
  }
  .tube-btn .emoji { font-size: 1.5rem; display: block; margin-bottom: 4px; }
  .tube-btn.active {
    border-color: var(--primary);
    background: #fee2e2;
    box-shadow: 0 0 0 3px var(--shadow);
  }
  .dark .tube-btn.active { background: #3a2020; }

  /* Main draw area */
  .draw-area {
    position: relative;
    min-height: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  /* Tube visual */
  .tube-visual {
    position: relative;
    width: 120px;
    height: 180px;
    margin: 0 auto 20px;
  }
  .tube-body {
    position: absolute;
    bottom: 0;
    left: 14px;
    width: 92px;
    height: 160px;
    background: linear-gradient(180deg, #c53030 0%, #8b1a1a 50%, #5c1010 100%);
    border-radius: 18px 18px 24px 24px;
    border: 3px solid #5c1010;
    box-shadow: inset 0 -8px 20px rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.2);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow: hidden;
  }
  .tube-rim {
    position: absolute;
    top: 18px;
    left: 6px;
    width: 108px;
    height: 14px;
    background: linear-gradient(180deg, #f6d365, #c9973a);
    border-radius: 50%;
    border: 3px solid #8b6914;
    z-index: 2;
  }
  .tube-stick {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    background: linear-gradient(90deg, #f5e6c8, #e8d5a3, #f5e6c8);
    border-radius: 3px 3px 4px 4px;
    border: 1px solid #c4a86c;
    z-index: 1;
    height: 80px;
    transition: transform .1s;
  }

  .tube-visual.shaking .tube-body { animation: tubeShake .15s ease-in-out infinite alternate; }
  .tube-visual.shaking .tube-stick {
    animation: stickBounce .15s ease-in-out infinite alternate;
  }
  @keyframes tubeShake {
    0% { transform: translateY(0) rotate(-2deg); }
    100% { transform: translateY(-6px) rotate(2deg); }
  }
  @keyframes stickBounce {
    0% { transform: translateX(-50%) translateY(2px); }
    40% { transform: translateX(-50%) translateY(-48px); }
    60% { transform: translateX(-50%) translateY(-52px); }
    80% { transform: translateX(-50%) translateY(-4px); }
    100% { transform: translateX(-50%) translateY(0px); opacity: 0.3; }
  }

  /* Flying stick effect */
  .flying-stick {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 80px;
    background: linear-gradient(90deg, #f5e6c8, #e8d5a3, #f5e6c8);
    border-radius: 3px 3px 4px 4px;
    border: 1px solid #c4a86c;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
  }
  .flying-stick.animate {
    animation: flyUp .5s ease-out forwards;
  }
  @keyframes flyUp {
    0% { opacity: 1; transform: translateX(-50%) translateY(0) rotate(0deg); }
    40% { opacity: 1; transform: translateX(-50%) translateY(-80px) rotate(-5deg); }
    70% { opacity: 1; transform: translateX(-50%) translateY(-140px) rotate(8deg); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-200px) rotate(360deg); }
  }

  /* Result */
  .result-card {
    width: 100%;
    max-width: 400px;
    padding: 28px 20px;
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 30px var(--shadow);
    opacity: 0;
    transform: translateY(20px) scale(.9);
    transition: all .4s cubic-bezier(.34,1.56,.64,1);
  }
  .result-card.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .result-card .label {
    font-size: .82rem;
    color: var(--text-secondary);
    letter-spacing: .1em;
    margin-bottom: 8px;
  }
  .result-card .content {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.6;
    padding: 8px 0;
  }
  .result-card .content.small { font-size: 1.1rem; }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 18px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: .04em;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, #c53030, #9b2c2c);
    color: #fff;
    box-shadow: 0 4px 14px rgba(197, 48, 48, .35);
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, #e53e3e, #c53030);
    transform: translateY(-1px);
  }
  .btn-secondary {
    background: var(--card-bg);
    color: var(--text);
    border: 2px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* name input for 谁请客 */
  .name-input-area {
    display: none;
    margin-bottom: 16px;
  }
  .name-input-area.show { display: block; }
  .name-input-area textarea {
    width: 100%;
    height: 80px;
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: 14px;
    font-size: .95rem;
    font-family: inherit;
    background: var(--card-bg);
    color: var(--text);
    resize: vertical;
    outline: none;
    transition: border-color .2s;
  }
  .name-input-area textarea:focus { border-color: var(--primary); }
  .name-input-area .hint {
    font-size: .78rem;
    color: var(--text-secondary);
    margin-top: 6px;
    padding-left: 4px;
  }

  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🥢 在线抽签</h1>
    <p class="subtitle">CHINESE LUCKY DRAW</p>
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙 暗色</button>
  </div>

  <!-- 签筒选择 -->
  <div class="tubes">
    <button class="tube-btn active" data-tube="fortune">
      <span class="emoji">🏮</span>今日运势签
    </button>
    <button class="tube-btn" data-tube="decision">
      <span class="emoji">🎯</span>决策签
    </button>
    <button class="tube-btn" data-tube="food">
      <span class="emoji">🍜</span>吃什么签
    </button>
    <button class="tube-btn" data-tube="game">
      <span class="emoji">🎭</span>真心话大冒险
    </button>
    <button class="tube-btn" data-tube="payer">
      <span class="emoji">💸</span>谁请客
    </button>
  </div>

  <!-- 谁请客名字输入 -->
  <div class="name-input-area" id="nameArea">
    <textarea id="nameInput" placeholder="请输入名字，用逗号或换行分隔&#10;例如：张三, 李四, 王五"></textarea>
    <p class="hint">至少输入 2 个名字</p>
  </div>

  <!-- 抽签区域 -->
  <div class="draw-area">
    <div class="tube-visual" id="tubeVisual">
      <div class="flying-stick" id="flyingStick"></div>
      <div class="tube-stick"></div>
      <div class="tube-rim"></div>
      <div class="tube-body"></div>
    </div>
    <div class="result-card" id="resultCard">
      <div class="label" id="resultLabel"></div>
      <div class="content" id="resultContent"></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="drawBtn" onclick="doDraw()">🎋 抽一签</button>
    <button class="btn btn-secondary" id="resetBtn" onclick="doReset()">🔄 重置</button>
  </div>
</div>

<script>
// ============ 签文数据 ============
const data = {
  fortune: [
    "大吉 · 紫气东来，诸事顺遂", "吉 · 风和日暖，宜出行会友",
    "中吉 · 稳中求进，守得云开", "小吉 · 贵人相助，柳暗花明",
    "末吉 · 需耐心等待良机", "大吉 · 福星高照，财源广进",
    "吉 · 春风得意马蹄疾", "中吉 · 凡事预则立",
    "小吉 · 今日宜静不宜动", "末吉 · 莫急勿躁，自有安排",
    "大吉 · 万象更新，好运连连", "吉 · 喜从天降，友人齐聚",
    "中吉 · 平常心，平常事", "小吉 · 适合整理思绪",
    "末吉 · 不如饮杯茶慢慢来", "大吉 · 桃花运势极佳",
    "吉 · 得道多助，失道寡助", "中吉 · 付出终有回报",
    "小吉 · 今日小确幸满满", "末吉 · 关关难过关关过",
    "大吉 · 鸿运当头不可挡", "吉 · 宜分享快乐",
  ],
  decision: [
    "果断做！再犹豫就晚了", "不妨一试，结果不坏",
    "暂缓，时机尚未成熟", "先问问朋友的意见",
    "直觉告诉你的是对的", "再等三天会有更好的选择",
    "行动吧，别给自己留遗憾", "建议先做个小实验试探",
    "放手一搏，天助自助者", "今天不适合做重大决定",
    "换个角度思考会有答案", "答案其实在你心中",
    "睡一觉明天再想", "不如抛个硬币看看",
    "值得冒险，收益可观", "这件事需要更多信息",
    "相信自己的第一感觉", "退一步海阔天空",
    "不妨先把利弊写下来", "给自己设一个 deadline",
    "这可能是最好的时机", "别人的建议仅供参考",
    "清单列出来，一目了然", "选择让你更快乐的那个",
  ],
  food: [
    "🍲 火锅", "🍣 日料", "🍗 炸鸡", "🍜 麻辣烫",
    "🍝 意面", "🍕 披萨", "🌮 塔可", "🥟 饺子",
    "🍱 便当", "🍔 汉堡", "🥘 螺蛳粉", "🍛 咖喱饭",
    "🥗 沙拉", "🍖 烤肉", "🥪 三明治", "🍜 兰州拉面",
    "🍤 天妇罗", "🥘 煲仔饭", "🍝 炸酱面", "🍙 饭团",
    "🥘 黄焖鸡", "🍲 冒菜", "🍜 酸辣粉", "🥘 石锅拌饭",
    "🍛 蛋包饭", "🍕 新疆炒米粉", "🥟 生煎包", "🍜 过桥米线",
  ],
  game: [
    { q: "真心话：你最近一次说谎是什么时候？", type: "truth" },
    { q: "大冒险：模仿一位在场的人30秒", type: "dare" },
    { q: "真心话：你做过最尴尬的事情是什么？", type: "truth" },
    { q: "大冒险：原地转10圈然后走直线", type: "dare" },
    { q: "真心话：你上一次哭是因为什么？", type: "truth" },
    { q: "大冒险：用方言唱一首歌", type: "dare" },
    { q: "真心话：你有没有偷偷喜欢过在场的人？", type: "truth" },
    { q: "大冒险：向窗外大喊三声", type: "dare" },
    { q: "真心话：你收到过最特别的礼物是什么？", type: "truth" },
    { q: "大冒险：学动物叫声直到有人猜对", type: "dare" },
    { q: "真心话：你最大的恐惧是什么？", type: "truth" },
    { q: "大冒险：闭眼画出在座某位的肖像", type: "dare" },
    { q: "真心话：你对一见钟情的看法？", type: "truth" },
    { q: "大冒险：用嘴巴叼着纸杯传水", type: "dare" },
    { q: "真心话：你是否曾经有过超自然经历？", type: "truth" },
    { q: "大冒险：单脚站立背一首古诗", type: "dare" },
    { q: "真心话：如果明天是世界末日，你今天会做什么？", type: "truth" },
    { q: "大冒险：对陌生人说我爱你", type: "dare" },
    { q: "真心话：你最想拥有的超能力是什么？", type: "truth" },
    { q: "大冒险：用筷子夹起10个黄豆", type: "dare" },
    { q: "真心话：你觉得自己最大的优点是什么？", type: "truth" },
    { q: "大冒险：倒立10秒或者做10个俯卧撑", type: "dare" },
    { q: "真心话：你暗恋过几个人的名字首字母？", type: "truth" },
    { q: "大冒险：壁咚离你最近的那位", type: "dare" },
  ],
};

let currentTube = "fortune";
let isDrawing = false;
let drawnItems = [];

// ============ 初始化 ============
document.querySelectorAll(".tube-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tube-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentTube = btn.dataset.tube;
    doReset();
    const nameArea = document.getElementById("nameArea");
    if (currentTube === "payer") {
      nameArea.classList.add("show");
    } else {
      nameArea.classList.remove("show");
    }
  });
});

// ============ 主题切换 ============
function toggleTheme() {
  const isDark = document.documentElement.classList.toggle("dark");
  document.getElementById("themeBtn").textContent = isDark ? "☀️ 亮色" : "🌙 暗色";
}

// ============ 抽签核心 ============
function doDraw() {
  if (isDrawing) return;
  isDrawing = true;

  const drawBtn = document.getElementById("drawBtn");
  drawBtn.disabled = true;

  // 谁请客模式：检查名字列表
  if (currentTube === "payer") {
    const raw = document.getElementById("nameInput").value.trim();
    if (!raw) {
      alert("请先输入名字列表！");
      isDrawing = false;
      drawBtn.disabled = false;
      return;
    }
    const names = raw.split(/[,，\n]+/).map(n => n.trim()).filter(Boolean);
    if (names.length < 2) {
      alert("至少需要输入 2 个名字！");
      isDrawing = false;
      drawBtn.disabled = false;
      return;
    }
  }

  // 检查是否所有签都抽过了
  let items;
  if (currentTube === "payer") {
    const raw = document.getElementById("nameInput").value.trim();
    items = raw.split(/[,，\n]+/).map(n => n.trim()).filter(Boolean);
  } else if (currentTube === "game") {
    items = data.game.map(g => g.q);
  } else {
    items = data[currentTube];
  }
  if (drawnItems.length >= items.length) {
    alert("所有签都已抽过，请按重置按钮重新开始！");
    isDrawing = false;
    drawBtn.disabled = false;
    return;
  }

  hideResult();
  const tubeVisual = document.getElementById("tubeVisual");
  const flyingStick = document.getElementById("flyingStick");

  // 开始摇晃动画
  tubeVisual.classList.add("shaking");

  const shakeDuration = 800 + Math.random() * 600;

  setTimeout(() => {
    tubeVisual.classList.remove("shaking");

    // 签条飞出动画
    flyingStick.classList.add("animate");
    flyingStick.addEventListener("animationend", function handler() {
      flyingStick.removeEventListener("animationend", handler);
      flyingStick.classList.remove("animate");
    }, { once: true });

    // 延迟显示结果
    setTimeout(() => {
      // 随机选一个未抽过的
      const remaining = items.filter((_, i) => !drawnItems.includes(i));
      const availables = remaining.map((item, idx) => {
        const origIdx = items.indexOf(item);
        return { item, origIdx };
      }).filter(entry => !drawnItems.includes(entry.origIdx));

      // 唯一处理：确保不重复
      const uniqueAvailables = [];
      const seenIdx = new Set();
      for (const entry of availables) {
        if (!seenIdx.has(entry.origIdx)) {
          seenIdx.add(entry.origIdx);
          uniqueAvailables.push(entry);
        }
      }

      const picked = uniqueAvailables[Math.floor(Math.random() * uniqueAvailables.length)];
      drawnItems.push(picked.origIdx);

      showResult(picked.item);
      isDrawing = false;
      drawBtn.disabled = false;
    }, 250);
  }, shakeDuration);
}

// ============ 显示结果 ============
function showResult(item) {
  const label = document.getElementById("resultLabel");
  const content = document.getElementById("resultContent");
  const card = document.getElementById("resultCard");

  if (currentTube === "game") {
    const gameItem = data.game.find(g => g.q === item);
    label.textContent = gameItem.type === "truth" ? "🔵 真心话" : "🔴 大冒险";
    content.classList.remove("small");
  } else if (currentTube === "food") {
    label.textContent = "今日推荐美食";
    content.classList.remove("small");
  } else if (currentTube === "payer") {
    label.textContent = "💸 今日买单王";
    content.classList.add("small");
  } else if (currentTube === "fortune") {
    label.textContent = "🏮 今日运势";
    content.classList.remove("small");
  } else {
    label.textContent = "🎯 决策建议";
    content.classList.remove("small");
  }
  content.textContent = item;

  requestAnimationFrame(() => {
    card.classList.add("show");
  });
}

// ============ 隐藏结果 ============
function hideResult() {
  document.getElementById("resultCard").classList.remove("show");
}

// ============ 重置 ============
function doReset() {
  drawnItems = [];
  hideResult();
  document.getElementById("drawBtn").disabled = false;
  isDrawing = false;
}

</script>
<script src="../i18n.js"></script>
</body>
</html>
