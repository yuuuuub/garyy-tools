<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字拼图游戏 - 在线汉字拼图挑战</title>
<meta name="description" content="汉字拼图游戏 - 通过拼图游戏学习汉字结构，支持多种难度级别">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --blue: #3b82f6;
  --green: #238636;
  --red: #ef4444;
  --radius: 10px;
  --transition: 0.2s ease;
}
[data-theme="light"] {
  --bg: #f6f8fa;
  --card: #fff;
  --border: #d0d7de;
  --text: #1f2328;
  --text2: #656d76;
  --blue: #0969da;
  --green: #1a7f37;
  --red: #cf222e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  padding: 16px;
}
.container { max-width: 800px; margin: auto; }
h1 { text-align: center; padding: 24px 0 8px; font-size: 1.5rem; }
.sub { text-align: center; color: var(--text2); font-size: .85rem; margin-bottom: 20px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.btn {
  display: inline-block;
  padding: 10px 24px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: .9rem;
  margin-top: 12px;
  transition: var(--transition);
}
.btn:hover { opacity: .85; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.btn-secondary { background: var(--border); color: var(--text); }
.puzzle-container {
  display: flex;
  gap: 20px;
  margin: 16px 0;
  flex-wrap: wrap;
  justify-content: center;
}
.puzzle-board {
  width: 300px;
  height: 300px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  display: grid;
  gap: 2px;
  padding: 10px;
}
.puzzle-board.grid-3 { grid-template-columns: repeat(3, 1fr); }
.puzzle-board.grid-4 { grid-template-columns: repeat(4, 1fr); }
.puzzle-board.grid-5 { grid-template-columns: repeat(5, 1fr); }
.puzzle-piece {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  cursor: pointer;
  transition: var(--transition);
  user-select: none;
}
.puzzle-piece:hover {
  border-color: var(--blue);
  background: rgba(59,130,246,0.1);
}
.puzzle-piece.correct {
  background: rgba(35,134,54,0.2);
  border-color: var(--green);
}
.puzzle-piece.empty {
  background: transparent;
  border-color: transparent;
  cursor: default;
}
.puzzle-reference {
  width: 150px;
  height: 150px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 5rem;
}
.pieces-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0;
  justify-content: center;
}
.pool-piece {
  width: 60px;
  height: 60px;
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  cursor: pointer;
  transition: var(--transition);
}
.pool-piece:hover {
  border-color: var(--blue);
  transform: scale(1.05);
}
.pool-piece.selected {
  border-color: var(--blue);
  background: rgba(59,130,246,0.1);
}
.difficulty-select {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
.difficulty-btn {
  padding: 8px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: .85rem;
  transition: var(--transition);
}
.difficulty-btn:hover {
  border-color: var(--blue);
}
.difficulty-btn.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.stats {
  display: flex;
  justify-content: space-around;
  margin: 16px 0;
  font-size: .9rem;
}
.stat { text-align: center; }
.stat-value { font-size: 1.2rem; font-weight: bold; color: var(--blue); }
.hint-area {
  text-align: center;
  margin: 16px 0;
  padding: 16px;
  background: var(--bg);
  border-radius: 8px;
}
.hint-text {
  font-size: 1.1rem;
  margin-bottom: 8px;
}
.hint-pinyin {
  font-size: .9rem;
  color: var(--blue);
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 16px 0;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--green);
  transition: width 0.3s;
  border-radius: 2px;
}
.char-list {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  margin: 16px 0;
}
.char-item {
  padding: 8px;
  text-align: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: var(--transition);
  font-size: 1.2rem;
}
.char-item:hover {
  border-color: var(--blue);
  background: var(--card);
}
.char-item.active {
  border-color: var(--blue);
  background: rgba(59,130,246,0.1);
}
.history {
  margin-top: 16px;
}
.history-item {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  font-size: .85rem;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
body, .container { animation: fadeIn .4s ease-out; }
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>🧩 汉字拼图游戏</h1>
  <p class="sub">通过拼图游戏学习汉字结构</p>

  <div class="card">
    <div class="difficulty-select">
      <button class="difficulty-btn" onclick="setDifficulty(2)">2×2</button>
      <button class="difficulty-btn active" onclick="setDifficulty(3)">3×3</button>
      <button class="difficulty-btn" onclick="setDifficulty(4)">4×4</button>
      <button class="difficulty-btn" onclick="setDifficulty(5)">5×5</button>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="startPuzzle()">开始游戏</button>
      <button class="btn btn-secondary" onclick="shufflePuzzle()">打乱拼图</button>
      <button class="btn btn-secondary" onclick="showHint()">提示</button>
      <button class="btn btn-secondary" onclick="toggleTheme()">🌓 切换主题</button>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="stat-value" id="moves">0</div><div>步数</div></div>
      <div class="stat"><div class="stat-value" id="time">00:00</div><div>时间</div></div>
      <div class="stat"><div class="stat-value" id="progress">0%</div><div>完成度</div></div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressBar" style="width:0%"></div>
    </div>
  </div>

  <div class="card">
    <div class="puzzle-container">
      <div>
        <div style="text-align:center;font-size:.85rem;color:var(--text2);margin-bottom:8px">参考字</div>
        <div class="puzzle-reference" id="puzzleReference">龙</div>
      </div>
      <div>
        <div style="text-align:center;font-size:.85rem;color:var(--text2);margin-bottom:8px">拼图区</div>
        <div class="puzzle-board grid-3" id="puzzleBoard"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">拼图片段</h3>
    <div class="pieces-pool" id="piecesPool"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">选择汉字</h3>
    <div class="char-list" id="charList"></div>
  </div>

  <div class="card history" id="historyCard" style="display:none">
    <h3 style="margin-bottom:12px">游戏记录</h3>
    <div id="history"></div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var characters = [
  {char:'龙',pinyin:'lóng',meaning:'龙'},
  {char:'凤',pinyin:'fèng',meaning:'凤凰'},
  {char:'福',pinyin:'fú',meaning:'福气'},
  {char:'禄',pinyin:'lù',meaning:'俸禄'},
  {char:'寿',pinyin:'shòu',meaning:'长寿'},
  {char:'喜',pinyin:'xǐ',meaning:'喜悦'},
  {char:'财',pinyin:'cái',meaning:'财富'},
  {char:'吉',pinyin:'jí',meaning:'吉祥'},
  {char:'祥',pinyin:'xiáng',meaning:'祥瑞'},
  {char:'如',pinyin:'rú',meaning:'如同'},
  {char:'意',pinyin:'yì',meaning:'意思'},
  {char:'平',pinyin:'píng',meaning:'平安'},
  {char:'安',pinyin:'ān',meaning:'安全'},
  {char:'康',pinyin:'kāng',meaning:'健康'},
  {char:'宁',pinyin:'níng',meaning:'宁静'},
  {char:'乐',pinyin:'lè',meaning:'快乐'},
  {char:'大',pinyin:'dà',meaning:'大的'},
  {char:'小',pinyin:'xiǎo',meaning:'小的'},
  {char:'人',pinyin:'rén',meaning:'人类'},
  {char:'口',pinyin:'kǒu',meaning:'嘴巴'},
  {char:'日',pinyin:'rì',meaning:'太阳'},
  {char:'月',pinyin:'yuè',meaning:'月亮'},
  {char:'水',pinyin:'shuǐ',meaning:'水'},
  {char:'火',pinyin:'huǒ',meaning:'火'},
  {char:'木',pinyin:'mù',meaning:'树木'},
  {char:'金',pinyin:'jīn',meaning:'金属'},
  {char:'土',pinyin:'tǔ',meaning:'泥土'},
  {char:'山',pinyin:'shān',meaning:'山'},
  {char:'石',pinyin:'shí',meaning:'石头'},
  {char:'田',pinyin:'tián',meaning:'田地'},
  {char:'王',pinyin:'wáng',meaning:'国王'},
  {char:'马',pinyin:'mǎ',meaning:'马'}
];

var gridSize = 3;
var currentChar = '龙';
var puzzle = [];
var moves = 0;
var seconds = 0;
var timer = null;
var gameActive = false;
var history = [];

function init() {
  renderCharList();
  startPuzzle();
}

function setDifficulty(size) {
  gridSize = size;
  document.querySelectorAll('.difficulty-btn').forEach(function(btn, i) {
    btn.classList.toggle('active', [2,3,4,5][i] === size);
  });
  document.getElementById('puzzleBoard').className = 'puzzle-board grid-' + size;
  startPuzzle();
}

function renderCharList() {
  var html = '';
  characters.forEach(function(c) {
    var cls = 'char-item' + (c.char === currentChar ? ' active' : '');
    html += '<div class="' + cls + '" onclick="selectChar(\'' + c.char + '\')">' + c.char + '</div>';
  });
  document.getElementById('charList').innerHTML = html;
}

function selectChar(ch) {
  currentChar = ch;
  document.getElementById('puzzleReference').textContent = ch;
  renderCharList();
  startPuzzle();
}

function startPuzzle() {
  puzzle = [];
  for(var i = 0; i < gridSize * gridSize; i++) {
    puzzle.push(i);
  }
  moves = 0;
  seconds = 0;
  gameActive = true;
  if(timer) clearInterval(timer);
  timer = setInterval(function() {
    seconds++;
    document.getElementById('time').textContent = formatTime(seconds);
  }, 1000);
  shufflePuzzle();
}

function shufflePuzzle() {
  var emptyIndex = puzzle.length - 1;
  for(var i = 0; i < 100; i++) {
    var neighbors = getNeighbors(emptyIndex);
    var randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
    swap(emptyIndex, randomNeighbor);
    emptyIndex = randomNeighbor;
  }
  renderPuzzle();
}

function getNeighbors(index) {
  var neighbors = [];
  var row = Math.floor(index / gridSize);
  var col = index % gridSize;
  if(row > 0) neighbors.push(index - gridSize);
  if(row < gridSize - 1) neighbors.push(index + gridSize);
  if(col > 0) neighbors.push(index - 1);
  if(col < gridSize - 1) neighbors.push(index + 1);
  return neighbors;
}

function swap(i, j) {
  var temp = puzzle[i];
  puzzle[i] = puzzle[j];
  puzzle[j] = temp;
}

function renderPuzzle() {
  var html = '';
  puzzle.forEach(function(value, index) {
    var isCorrect = value === index;
    var isEmpty = value === gridSize * gridSize - 1;
    var cls = 'puzzle-piece';
    if(isCorrect) cls += ' correct';
    if(isEmpty) cls += ' empty';
    html += '<div class="' + cls + '" onclick="movePiece(' + index + ')">';
    if(!isEmpty) {
      var row = Math.floor(value / gridSize);
      var col = value % gridSize;
      html += (row * gridSize + col + 1);
    }
    html += '</div>';
  });
  document.getElementById('puzzleBoard').innerHTML = html;
  updateStats();
}

function movePiece(index) {
  if(!gameActive) return;
  var emptyIndex = puzzle.indexOf(gridSize * gridSize - 1);
  var neighbors = getNeighbors(emptyIndex);
  if(neighbors.includes(index)) {
    swap(emptyIndex, index);
    moves++;
    renderPuzzle();
    if(isSolved()) {
      gameComplete();
    }
  }
}

function isSolved() {
  for(var i = 0; i < puzzle.length; i++) {
    if(puzzle[i] !== i) return false;
  }
  return true;
}

function gameComplete() {
  clearInterval(timer);
  gameActive = false;
  addToHistory();
}

function updateStats() {
  document.getElementById('moves').textContent = moves;
  var correct = 0;
  puzzle.forEach(function(value, index) {
    if(value === index) correct++;
  });
  var percent = Math.round((correct / puzzle.length) * 100);
  document.getElementById('progress').textContent = percent + '%';
  document.getElementById('progressBar').style.width = percent + '%';
}

function showHint() {
  var charData = characters.find(function(c) { return c.char === currentChar; });
  if(charData) {
    alert('提示: ' + currentChar + ' (' + charData.pinyin + ') - ' + charData.meaning);
  }
}

function addToHistory() {
  var charData = characters.find(function(c) { return c.char === currentChar; });
  history.unshift({
    char: currentChar,
    pinyin: charData ? charData.pinyin : '',
    moves: moves,
    time: formatTime(seconds),
    grid: gridSize + '×' + gridSize,
    date: new Date().toLocaleString()
  });
  if(history.length > 10) history.pop();
  renderHistory();
}

function renderHistory() {
  if(history.length === 0) {
    document.getElementById('historyCard').style.display = 'none';
    return;
  }
  document.getElementById('historyCard').style.display = 'block';
  var html = '';
  history.forEach(function(h) {
    html += '<div class="history-item">';
    html += '<span>' + h.char + ' ' + h.pinyin + ' ' + h.grid + '</span>';
    html += '<span>' + h.moves + '步 ' + h.time + '</span>';
    html += '<span style="color:var(--text2)">' + h.date + '</span>';
    html += '</div>';
  });
  document.getElementById('history').innerHTML = html;
}

function formatTime(s) {
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
}

function toggleTheme() {
  var html = document.documentElement;
  var current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
}

init();
</script>
</body>
</html>
