var currentCategory='all';
function renderDreams(dreamsToShow){
  var list=document.getElementById('dreamList');
  var html='';
  dreamsToShow.forEach(function(dream){
    html+='<div class="dream-item">';
    html+='<div class="dream-title">'+dream.title+'</div>';
    html+='<div class="dream-meaning">'+dream.meaning+'</div>';
    html+='<div class="dream-category">分类：'+dream.category+'</div>';
    html+='</div>';
  });
  list.innerHTML=html;
}
function filterDreams(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=dreams.filter(function(dream){
    var matchSearch=dream.title.toLowerCase().includes(search)||dream.meaning.toLowerCase().includes(search);
    var matchCategory=currentCategory==='all'||dream.category===currentCategory;
    return matchSearch&&matchCategory;
  });
  renderDreams(filtered);
}
function filterByCategory(category,btn){
  currentCategory=category;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterDreams();
}
renderDreams(dreams);
</script></body></html>
