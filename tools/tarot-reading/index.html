<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>塔罗牌占卜</title>
<meta name="description" content="塔罗牌占卜工具，抽取牌阵解读命运指引">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}

  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);
    color:#e6e6e6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden
  }
  .container{width:100%;max-width:800px;padding:20px;text-align:center}

  header{margin:30px 0 20px;position:relative}
  h1{
    font-size:2rem;
    background:linear-gradient(135deg,#c084fc,#7c3aed,#a855f7);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    letter-spacing:4px;
    text-shadow:none;
    position:relative
  }
  h1::after{
    content:'✦';
    position:absolute;
    right:-30px;
    top:-5px;
    font-size:1.2rem;
    -webkit-text-fill-color:initial;
    color:#a855f7;
    animation:twinkle 2s ease-in-out infinite
  }
  .subtitle{color:#8b949e;font-size:.85rem;margin-top:6px;letter-spacing:2px}
  .divider{
    width:60px;height:2px;
    background:linear-gradient(90deg,transparent,#7c3aed,transparent);
    margin:15px auto;
    border-radius:2px
  }

  @keyframes twinkle{
    0%,100%{opacity:.4;transform:scale(1)}
    50%{opacity:1;transform:scale(1.3)}
  }
  @keyframes floatGlow{
    0%,100%{box-shadow:0 0 20px rgba(124,58,237,.15)}
    50%{box-shadow:0 0 35px rgba(124,58,237,.3)}
  }
  @keyframes shimmer{
    0%{background-position:-200% center}
    100%{background-position:200% center}
  }
  @keyframes cardAppear{
    0%{opacity:0;transform:translateY(30px) scale(.8)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes flipIn{
    0%{transform:rotateY(180deg) scale(.6);opacity:0}
    60%{transform:rotateY(220deg) scale(1.05);opacity:1}
    100%{transform:rotateY(360deg) scale(1);opacity:1}
  }
  @keyframes sparkle{
    0%,100%{opacity:0;transform:scale(0) rotate(0)}
    50%{opacity:1;transform:scale(1) rotate(180deg)}
  }
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 0 15px rgba(124,58,237,.2)}
    50%{box-shadow:0 0 30px rgba(124,58,237,.5)}
  }
  @keyframes fadeInUp{
    0%{opacity:0;transform:translateY(20px)}
    100%{opacity:1;transform:translateY(0)}
  }

  .selection-area{
    background:#161b22;
    border:1px solid #21262d;
    border-radius:16px;
    padding:30px 20px;
    margin:20px 0;
    position:relative;
    overflow:hidden
  }
  .selection-area::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,#7c3aed,#c084fc,transparent)
  }
  .selection-title{font-size:1.1rem;color:#c9d1d9;margin-bottom:18px;letter-spacing:2px}
  .btn-group{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn-draw{
    background:#21262d;
    color:#c9d1d9;
    border:1px solid #30363d;
    padding:12px 28px;
    border-radius:10px;
    font-size:1rem;
    cursor:pointer;
    transition:all .3s;
    min-width:80px;
    letter-spacing:1px
  }
  .btn-draw:hover{
    border-color:#7c3aed;
    color:#c084fc;
    background:#1c1f2b;
    transform:translateY(-2px);
    box-shadow:0 4px 15px rgba(124,58,237,.2)
  }
  .btn-draw:active{transform:translateY(0)}

  .spread-info{
    margin-top:16px;
    min-height:22px;
    font-size:.85rem;
    color:#8b949e;
    transition:all .3s
  }

  .card-area{
    display:none;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
    margin:25px 0;
    perspective:1200px;
    min-height:380px;
    padding:10px 0
  }
  .card-area.active{display:flex}

  .card-slot{
    width:180px;
    cursor:default;
    position:relative;
    animation:cardAppear .6s ease-out both
  }
  .card-inner{
    position:relative;
    width:100%;
    height:300px;
    transition:transform .8s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
    border-radius:12px
  }
  .card-slot.flipped .card-inner{transform:rotateY(180deg)}
  .card-face{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
    border-radius:12px;
    overflow:hidden
  }
  .card-back{
    background:linear-gradient(135deg,#1a1a2e,#16213e,#1a1a2e);
    border:2px solid #7c3aed;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 20px rgba(124,58,237,.15);
    animation:floatGlow 3s ease-in-out infinite
  }
  .card-back-pattern{
    font-size:3rem;
    opacity:.6;
    text-shadow:0 0 20px rgba(124,58,237,.5);
    animation:pulseGlow 2s ease-in-out infinite;
    user-select:none
  }
  .card-front{
    background:linear-gradient(145deg,#1e1b2b,#2a1f3d);
    border:2px solid #7c3aed;
    transform:rotateY(180deg);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 12px;
    box-shadow:0 4px 25px rgba(124,58,237,.2);
    overflow-y:auto
  }
  .card-front::-webkit-scrollbar{width:3px}
  .card-front::-webkit-scrollbar-thumb{background:#7c3aed;border-radius:3px}
  .card-front::-webkit-scrollbar-track{background:transparent}

  .card-emoji{font-size:2.5rem;margin:8px 0 4px;line-height:1.2}
  .card-number{
    font-size:.7rem;
    color:#8b949e;
    margin-bottom:2px;
    letter-spacing:1px
  }
  .card-name{
    font-size:.95rem;
    font-weight:700;
    color:#c084fc;
    margin-bottom:2px;
    text-align:center;
    line-height:1.3
  }
  .card-en-name{
    font-size:.6rem;
    color:#6b7280;
    margin-bottom:6px;
    text-align:center
  }
  .card-orientation{
    font-size:.7rem;
    padding:2px 10px;
    border-radius:10px;
    margin-bottom:6px;
    letter-spacing:1px;
    font-weight:600
  }
  .card-orientation.upright{
    background:rgba(52,211,153,.15);
    color:#34d399
  }
  .card-orientation.reversed{
    background:rgba(251,191,36,.15);
    color:#fbbf24
  }
  .card-meaning{
    font-size:.72rem;
    color:#d1d5db;
    line-height:1.5;
    text-align:center;
    flex:1;
    display:flex;
    align-items:center;
    padding:0 2px
  }

  .card-position{
    position:absolute;
    bottom:-28px;
    left:50%;
    transform:translateX(-50%);
    font-size:.7rem;
    color:#a855f7;
    white-space:nowrap;
    letter-spacing:1px;
    opacity:.8;
    font-weight:500
  }

  .card-slot:nth-child(1){animation-delay:0s}
  .card-slot:nth-child(2){animation-delay:.15s}
  .card-slot:nth-child(3){animation-delay:.3s}
  .card-slot:nth-child(4){animation-delay:.45s}
  .card-slot:nth-child(5){animation-delay:.6s}

  .card-slot.reversed .card-front{
    border-color:#fbbf24
  }
  .card-slot.reversed .card-front .card-name{
    color:#fbbf24
  }

  .reading-area{
    display:none;
    background:#161b22;
    border:1px solid #21262d;
    border-radius:16px;
    padding:24px 20px;
    margin:40px 0 20px;
    text-align:left;
    position:relative;
    overflow:hidden;
    animation:fadeInUp .6s ease-out
  }
  .reading-area::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,#7c3aed,#c084fc,transparent)
  }
  .reading-area.active{display:block}
  .reading-title{
    color:#c084fc;
    font-size:1.1rem;
    letter-spacing:2px;
    margin-bottom:15px;
    text-align:center
  }
  .reading-item{
    padding:12px 0;
    border-bottom:1px solid #21262d;
    animation:fadeInUp .4s ease-out both
  }
  .reading-item:last-child{border-bottom:none}
  .reading-item:nth-child(1){animation-delay:0s}
  .reading-item:nth-child(2){animation-delay:.15s}
  .reading-item:nth-child(3){animation-delay:.3s}
  .reading-item:nth-child(4){animation-delay:.45s}
  .reading-item:nth-child(5){animation-delay:.6s}
  .reading-pos{font-size:.8rem;color:#a855f7;font-weight:600}
  .reading-card-name{font-size:.9rem;color:#e6e6e6;margin:2px 0}
  .reading-meaning{font-size:.8rem;color:#8b949e;line-height:1.6;margin-top:4px}
  .reading-meaning em{color:#c084fc;font-style:normal}

  .reset-btn{
    display:none;
    margin:20px auto 30px;
    background:transparent;
    color:#7c3aed;
    border:1px solid #7c3aed;
    padding:10px 30px;
    border-radius:10px;
    font-size:.9rem;
    cursor:pointer;
    transition:all .3s;
    letter-spacing:2px
  }
  .reset-btn:hover{
    background:rgba(124,58,237,.1);
    box-shadow:0 0 20px rgba(124,58,237,.15)
  }
  .reset-btn.active{display:inline-block}

  .sparkle-container{
    position:fixed;
    top:0;left:0;width:100%;height:100%;
    pointer-events:none;
    z-index:0;
    overflow:hidden
  }
  .sparkle{
    position:absolute;
    width:4px;height:4px;
    background:#7c3aed;
    border-radius:50%;
    animation:sparkle 3s ease-in-out infinite
  }

  footer{
    margin:30px 0 20px;
    font-size:.75rem;
    color:#484f58;
    letter-spacing:1px
  }

  @media(max-width:640px){
    .container{padding:12px}
    h1{font-size:1.6rem}
    h1::after{right:-24px;font-size:1rem}
    .card-slot{width:150px}
    .card-inner{height:250px}
    .card-emoji{font-size:2rem}
    .card-name{font-size:.85rem}
    .card-meaning{font-size:.65rem}
    .btn-draw{padding:10px 20px;font-size:.9rem;min-width:70px}
    .card-area{gap:12px}
    .reading-area{padding:18px 14px}
    .selection-area{padding:20px 14px}
  }
  @media(max-width:480px){
    .card-slot{width:130px}
    .card-inner{height:220px}
    .card-emoji{font-size:1.6rem}
    .card-name{font-size:.8rem}
    .card-meaning{font-size:.6rem}
    .card-number{font-size:.6rem}
    .card-en-name{font-size:.55rem}
    .card-front{padding:12px 8px}
    .btn-group{gap:8px}
    .btn-draw{padding:8px 14px;font-size:.8rem;min-width:60px}
    .card-position{font-size:.6rem;bottom:-24px}
  }
</style>

<div class="sparkle-container" id="sparkleContainer"></div>

<div class="container">

    reversed:'叛逆、打破常规、过度保守、需要独立思考'
  },
  {
    num:'VI', name:'恋人', en:'The Lovers', emoji:'\u{2764}\uFE0F',
    upright:'爱情、和谐、选择、价值观、结合、吸引力',
    reversed:'关系破裂、价值观冲突、分离、优柔寡断'
  },
  {
    num:'VII', name:'战车', en:'The Chariot', emoji:'\u{1F3CE}\uFE0F',
    upright:'胜利、意志力、决心、征服、自信、突破',
    reversed:'失控、缺乏方向、阻力、攻击性、挫败'
  },
  {
    num:'VIII', name:'力量', en:'Strength', emoji:'\u{1F4AA}',
    upright:'勇气、内在力量、毅力、耐心、慈悲、韧性',
    reversed:'软弱、自我怀疑、缺乏自信、冲动、屈服'
  },
  {
    num:'IX', name:'隐士', en:'The Hermit', emoji:'\u{1F3DE}\uFE0F',
    upright:'内省、独处、寻找真理、导师、沉思、智慧',
    reversed:'孤立、孤独、迷失方向、逃避、拒绝帮助'
  },
  {
    num:'X', name:'命运之轮', en:'Wheel of Fortune', emoji:'\u{1F300}',

  },

    upright:'牺牲、放下、新视角、等待、修行、转折',
    reversed:'拖延、抗拒放下、无谓牺牲、停滞不前'

  {

    reversed:'避免灾难、抗拒改变、危机来临前的预感'

  {

    upright:'潜意识、幻觉、恐惧、未知、迷茫、梦境',
    reversed:'看清真相、克服恐惧、幻觉破灭、释放'
  },
  {

    reversed:'暂时的阴霾、热情消退、小挫折、乐观不足'

    upright:'觉醒、重生、评价、召唤、反省、因缘成熟',
    reversed:'自我怀疑、拒绝觉醒、后悔、恐惧审判'
  },
  {
    num:'XXI', name:'世界', en:'The World', emoji:'\u{1F30D}',
    upright:'完成、达成、圆满、成就、旅程终点、整合',
    reversed:'未完成、延迟、追求完美、停滞、不完整'
  }
];

// ===== 牌阵定义 =====
const SPREADS = {
  1: { label:'单张占卜', positions:['今日指引'] },
  3: { label:'三张牌阵', positions:['过去','现在','未来'] },
  5: { label:'五张牌阵(简化凯尔特十字)', positions:['当下核心','挑战与阻碍','过去基础','未来可能','最终结果'] }
};

// ===== 工具函数 =====
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pickRandomCard(){
  const card={...MAJOR_ARCANA[Math.floor(Math.random()*MAJOR_ARCANA.length)]};
  card.isReversed=Math.random()<.3;
  return card;
}

// ===== 核心逻辑 =====
function drawCards(count){
  const cardArea=document.getElementById('cardArea');
  const readingArea=document.getElementById('readingArea');
  const readingContent=document.getElementById('readingContent');
  const spreadInfo=document.getElementById('spreadInfo');
  const resetBtn=document.getElementById('resetBtn');

  const spread=SPREADS[count];
  spreadInfo.textContent=`${spread.label} · ${spread.positions.join(' · ')}`;

  const cards=[];
  for(let i=0;i<count;i++){
    cards.push(pickRandomCard());
  }

  // 渲染卡片
  cardArea.innerHTML='';
  cardArea.className='card-area active';

  cards.forEach((card,i)=>{
    const slot=document.createElement('div');
    slot.className='card-slot'+(card.isReversed?' reversed':'');
    slot.style.animationDelay=`${i*.15}s`;
    slot.innerHTML=`
      <div class="card-inner">
        <div class="card-face card-back">
          <div class="card-back-pattern">\u{1F90D}</div>
        </div>
        <div class="card-face card-front">
          <div class="card-number">${card.num}</div>
          <div class="card-emoji">${card.emoji}</div>
          <div class="card-name">${card.name}</div>
          <div class="card-en-name">${card.en}</div>
          <div class="card-orientation ${card.isReversed?'reversed':'upright'}">${card.isReversed?'\u25B3 逆位':'\u25B2 正位'}</div>
          <div class="card-meaning">${card.isReversed?card.reversed:card.upright}</div>
        </div>
      </div>
      <div class="card-position">${spread.positions[i]}</div>
    `;
    cardArea.appendChild(slot);
  });

  // 延迟翻转动画
  cards.forEach((_,i)=>{
    setTimeout(()=>{
      const slots=cardArea.querySelectorAll('.card-slot');
      if(slots[i]) slots[i].classList.add('flipped');
    },400+i*300);
  });

  // 解读区域
  setTimeout(()=>{
    readingContent.innerHTML=cards.map((card,i)=>`
      <div class="reading-item">
        <div class="reading-pos">${spread.positions[i]}</div>
        <div class="reading-card-name">${card.emoji} ${card.name} · ${card.isReversed?'逆位':'正位'}${card.isReversed?' \u25B3':' \u25B2'}</div>
        <div class="reading-meaning">${card.isReversed?card.reversed:card.upright}</div>
      </div>
    `).join('');
    readingArea.className='reading-area active';
    readingArea.style.display='block';
    resetBtn.className='reset-btn active';
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  },600+count*300);

  // 生成闪烁粒子
  createSparkles(count);
}

function resetReading(){
  document.getElementById('cardArea').className='card-area';
  document.getElementById('cardArea').innerHTML='';
  document.getElementById('readingArea').className='reading-area';
  document.getElementById('readingArea').style.display='none';
  document.getElementById('readingContent').innerHTML='';
  document.getElementById('resetBtn').className='reset-btn';
  document.getElementById('spreadInfo').textContent='点击上方按钮，开启塔罗之旅';
  window.scrollTo({top:0,behavior:'smooth'});
}

// ===== 氛围粒子 =====
function createSparkles(count){
  const container=document.getElementById('sparkleContainer');
  for(let i=0;i<count*6;i++){
    const el=document.createElement('div');
    el.className='sparkle';
    el.style.left=Math.random()*100+'%';
    el.style.top=Math.random()*100+'%';
    el.style.animationDelay=Math.random()*3+'s';
    el.style.animationDuration=(2+Math.random()*3)+'s';
    el.style.width=(2+Math.random()*4)+'px';
    el.style.height=el.style.width;
    el.style.opacity=0;
    container.appendChild(el);
    setTimeout(()=>{el.style.opacity=(.3+Math.random()*.4).toFixed(2)},i*50);
    setTimeout(()=>{if(el.parentNode)el.remove()},5000);
  }
}

// 背景常驻星尘
(function initStars(){
  const c=document.getElementById('sparkleContainer');
  for(let i=0;i<25;i++){
    const el=document.createElement('div');
    el.className='sparkle';
    el.style.left=Math.random()*100+'%';
    el.style.top=Math.random()*100+'%';
    el.style.animationDelay=Math.random()*5+'s';
    el.style.animationDuration=(3+Math.random()*4)+'s';
    el.style.width='2px';el.style.height='2px';
    el.style.opacity=(.1+Math.random()*.3).toFixed(2);
    c.appendChild(el);
  }
})();
</script>
