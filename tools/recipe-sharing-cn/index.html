<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔗 食谱分享</title>
<meta property="og:title" content="🔗 食谱分享">
<meta property="og:description" content="🔗 食谱分享 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="创建和分享精美食谱卡片，支持生成分享链接和导出图片">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#f43f5e;--accent2:#e11d48;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#e11d48;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--blue:#0969da;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:800px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button,textarea{font-family:inherit;font-size:.95rem}
input[type=text],textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;width:100%}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.ing-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.ing-row:last-child{border-bottom:none}
.ing-row input[type=text]{flex:2}
.ing-row input[type=number]{flex:1}
.ing-row select{flex:1}
.ing-row button{padding:4px 8px;font-size:.75rem}
.step-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--border)}
.step-row:last-child{border-bottom:none}
.step-row textarea{flex:1;min-height:40px;padding:8px}
.step-row .num{min-width:28px;height:28px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;margin-top:6px}
.step-row button{margin-top:6px}
.preview-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:16px;padding:24px;color:#fff;max-width:400px;margin:12px auto;box-shadow:0 8px 32px rgba(0,0,0,.3);position:relative;overflow:hidden}
.preview-card::before{content:'';position:absolute;top:-50%;right:-50%;width:100%;height:100%;background:radial-gradient(circle,rgba(244,63,94,.1),transparent 70%)}
.preview-card .emoji{font-size:3rem;margin-bottom:8px}
.preview-card h3{font-size:1.3rem;margin-bottom:8px}
.preview-card .meta{display:flex;gap:12px;font-size:.8rem;color:rgba(255,255,255,.6);margin-bottom:12px}
.preview-card .ings{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.preview-card .ing-tag{background:rgba(255,255,255,.1);padding:3px 10px;border-radius:12px;font-size:.75rem}
.preview-card .steps-preview{font-size:.85rem;color:rgba(255,255,255,.8);line-height:1.8}
.preview-card .author{position:absolute;bottom:12px;right:16px;font-size:.7rem;color:rgba(255,255,255,.4)}
.share-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0}
.share-btn{padding:12px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s}
.share-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.share-btn .icon{font-size:1.5rem;margin-bottom:4px}
.share-btn .name{font-size:.8rem}
.my-recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
.my-recipe{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s}
.my-recipe:hover{border-color:var(--accent);transform:translateY(-2px)}
.my-recipe .emoji{font-size:1.5rem;margin-bottom:6px}
.my-recipe .name{font-weight:600;font-size:.9rem}
.my-recipe .meta{font-size:.75rem;color:var(--text2)}
.empty{text-align:center;padding:30px;color:var(--text2);font-size:.9rem}
.emoji-picker{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.emoji-picker span{font-size:1.5rem;cursor:pointer;padding:4px;border-radius:6px;transition:all .2s}
.emoji-picker span:hover{background:var(--bg);transform:scale(1.2)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🔗 食谱分享</h1><p>创建精美食谱卡片，一键分享给朋友</p></div>

<div class="cd"><h2>📝 创建食谱</h2>
<label>选择图标</label>
<div class="emoji-picker" id="emojiPicker"></div>
<input type="hidden" id="selectedEmoji" value="🍳">
<div class="fr">
<div><label>食谱名称 *</label><input type="text" id="recipeName" placeholder="如：红烧肉"></div>
<div><label>分类</label><select id="recipeCat"><option>家常菜</option><option>川菜</option><option>粤菜</option><option>烘焙</option><option>汤羹</option><option>凉菜</option><option>快手菜</option><option>其他</option></select></div>
</div>
<div class="fr">
<div><label>烹饪时间(分钟)</label><input type="number" id="recipeTime" value="30" min="1"></div>
<div><label>难度</label><select id="recipeDiff"><option>简单</option><option>中等</option><option>较难</option></select></div>
</div>
<label>简介</label><input type="text" id="recipeDesc" placeholder="一句话描述这道菜">
<h3 style="color:var(--accent);margin:16px 0 8px">🥗 食材清单</h3>
<div id="ingList"></div>
<div class="bg"><button onclick="addIngRow()">＋ 添加食材</button></div>
<h3 style="color:var(--accent);margin:16px 0 8px">👨‍🍳 烹饪步骤</h3>
<div id="stepList"></div>
<div class="bg"><button onclick="addStepRow()">＋ 添加步骤</button></div>
<label>小贴士</label><textarea id="recipeTip" placeholder="分享你的烹饪秘诀..."></textarea>
<label>作者</label><input type="text" id="recipeAuthor" placeholder="你的名字">
<div class="bg"><button onclick="generateCard()">🎨 生成卡片</button><button class="sec" onclick="saveRecipe()">💾 保存</button></div></div>

<div class="cd" id="previewCard" style="display:none"><h2>📋 预览卡片</h2>
<div id="cardPreview"></div>
<div class="share-options" id="shareOptions"></div></div>

<div class="cd"><h2>📚 我的食谱</h2><div class="my-recipes" id="myRecipes"></div></div>
</div>
<script>
var DB='recipe_sharing_cn',recipes=JSON.parse(localStorage.getItem(DB)||'[]');
var EMOJIS=['🍳','🥩','🍗','🐟','🦐','🥦','🍚','🍜','🍲','🥗','🍰','🍞','🍕','🌮','🌯','🥟','🍝','🧀','🍎','🍌'];
var curEmoji='🍳';

function selectEmoji(e){curEmoji=e;document.getElementById('selectedEmoji').value=e;document.querySelectorAll('.emoji-picker span').forEach(function(s){s.style.background=s.textContent===e?'var(--accent)':'transparent'})}
function addIngRow(name,amount,unit){
var div=document.getElementById('ingList');
var row=document.createElement('div');row.className='ing-row';
row.innerHTML='<input type="text" value="'+(name||'')+'" placeholder="食材名" class="ing-name"><input type="number" value="'+(amount||100)+'" min="0" class="ing-amt" placeholder="量"><select class="ing-unit"><option value="g">克</option><option value="ml">毫升</option><option value="勺">勺</option><option value="个">个</option><option value="碗">碗</option><option value="根">根</option></select><button class="dng" style="background:var(--red)" onclick="this.parentElement.remove()">✕</button>';
div.appendChild(row);
}
function addStepRow(text){
var div=document.getElementById('stepList');
var num=div.children.length+1;
var row=document.createElement('div');row.className='step-row';
row.innerHTML='<div class="num">'+num+'</div><textarea class="step-text" placeholder="步骤'+num+'...">'+(text||'')+'</textarea><button class="dng" style="padding:4px 8px;font-size:.75rem" onclick="removeStep(this)">✕</button>';
div.appendChild(row);
}
function removeStep(btn){btn.parentElement.remove();reNumSteps();}
function reNumSteps(){document.querySelectorAll('.step-row .num').forEach(function(n,i){n.textContent=i+1})}
function gatherRecipe(){
var name=document.getElementById('recipeName').value.trim();if(!name){alert('请输入食谱名称');return null;}
var ings=[];document.querySelectorAll('.ing-row').forEach(function(r){
var n=r.querySelector('.ing-name').value.trim();if(n)ings.push({name:n,amount:r.querySelector('.ing-amt').value,unit:r.querySelector('.ing-unit').value});
});
var steps=[];document.querySelectorAll('.step-text').forEach(function(t){var v=t.value.trim();if(v)steps.push(v);});
return{emoji:curEmoji,name:name,cat:document.getElementById('recipeCat').value,time:parseInt(document.getElementById('recipeTime').value)||30,diff:document.getElementById('recipeDiff').value,desc:document.getElementById('recipeDesc').value.trim(),ings:ings,steps:steps,tip:document.getElementById('recipeTip').value.trim(),author:document.getElementById('recipeAuthor').value.trim()||'匿名',time:createAt:new Date().toLocaleString()};
}
function generateCard(){
var r=gatherRecipe();if(!r)return;
document.getElementById('previewCard').style.display='block';
document.getElementById('cardPreview').innerHTML='<div class="preview-card"><div class="emoji">'+r.emoji+'</div><h3>'+r.name+'</h3><div class="meta"><span>⏱ '+r.time+'分钟</span><span>📊 '+r.diff+'</span><span>📂 '+r.cat+'</span></div>'+
(r.desc?'<p style="font-size:.85rem;color:rgba(255,255,255,.7);margin-bottom:12px">'+r.desc+'</p>':'')+
'<div class="ings">'+r.ings.map(function(i){return '<span class="ing-tag">'+i.name+' '+i.amount+i.unit+'</span>'}).join('')+'</div>'+
(r.steps.length?'<div class="steps-preview">'+r.steps.slice(0,3).map(function(s,i){return (i+1)+'. '+s}).join('<br>')+(r.steps.length>3?'<br>...共'+r.steps.length+'步':'')+'</div>':'')+
'<div class="author">by '+r.author+'</div></div>';
document.getElementById('shareOptions').innerHTML=[
{icon:'📋',name:'复制文本',action:'shareText'},
{icon:'💾',name:'保存食谱',action:'saveRecipe'},
{icon:'📱',name:'微信分享',action:'shareWX'},
{icon:'🔗',name:'复制链接',action:'shareLink'}
].map(function(s){return '<div class="share-btn" onclick="'+s.action+'()"><div class="icon">'+s.icon+'</div><div class="name">'+s.name+'</div></div>'}).join('');
document.getElementById('previewCard').scrollIntoView({behavior:'smooth'});
}
function shareText(){
var r=gatherRecipe();if(!r)return;
var text='【'+r.emoji+' '+r.name+'】\n⏱'+r.time+'分钟 · '+r.diff+' · '+r.cat+'\n\n🥗 食材：\n'+r.ings.map(function(i){return '• '+i.name+' '+i.amount+i.unit}).join('\n')+'\n\n👨‍🍳 步骤：\n'+r.steps.map(function(s,i){return (i+1)+'. '+s}).join('\n')+'\n\n💡 '+r.tip+'\n—— '+r.author;
navigator.clipboard.writeText(text);alert('已复制到剪贴板');
}
function saveRecipe(){
var r=gatherRecipe();if(!r)return;
recipes.unshift(r);recipes=recipes.slice(0,50);localStorage.setItem(DB,JSON.stringify(recipes));renderMyRecipes();alert('已保存');
}
function shareWX(){shareText();alert('已复制，请打开微信粘贴发送');}
function shareLink(){var r=gatherRecipe();if(!r)return;var data=btoa(encodeURIComponent(JSON.stringify({n:r.name,e:r.emoji})));var link=location.origin+location.pathname+'?r='+data;navigator.clipboard.writeText(link);alert('链接已复制(演示链接)');}
function renderMyRecipes(){
var el=document.getElementById('myRecipes');
if(!recipes.length){el.innerHTML='<div class="empty">暂无保存的食谱</div>';return;}
el.innerHTML=recipes.map(function(r,i){
return '<div class="my-recipe" onclick="loadRecipe('+i+')"><div class="emoji">'+r.emoji+'</div><div class="name">'+r.name+'</div><div class="meta">⏱'+r.time+'分钟 · '+r.cat+'</div></div>';
}).join('');
}
function loadRecipe(i){
var r=recipes[i];if(!r)return;
document.getElementById('selectedEmoji').value=r.emoji;curEmoji=r.emoji;selectEmoji(r.emoji);
document.getElementById('recipeName').value=r.name;document.getElementById('recipeCat').value=r.cat;
document.getElementById('recipeTime').value=r.time;document.getElementById('recipeDiff').value=r.diff;
document.getElementById('recipeDesc').value=r.desc||'';document.getElementById('recipeTip').value=r.tip||'';
document.getElementById('recipeAuthor').value=r.author||'';
document.getElementById('ingList').innerHTML='';(r.ings||[]).forEach(function(i){addIngRow(i.name,i.amount,i.unit)});
document.getElementById('stepList').innerHTML='';(r.steps||[]).forEach(function(s){addStepRow(s)});
generateCard();
}
function renderEmojiPicker(){
document.getElementById('emojiPicker').innerHTML=EMOJIS.map(function(e){
return '<span onclick="selectEmoji(\''+e+'\')" style="'+(e===curEmoji?'background:var(--accent)':'')+'">'+e+'</span>';
}).join('');
}
renderEmojiPicker();addIngRow('鸡蛋',3,'个');addIngRow('番茄',2,'个');addIngRow('糖',1,'勺');
addStepRow('番茄切块');addStepRow('鸡蛋打散炒熟');addStepRow('炒番茄出汁后加入鸡蛋翻炒');
renderMyRecipes();
</script>
</body>
</html>
