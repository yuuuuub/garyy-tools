<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>日历组件 - garyy-tools</title>
<meta name="description" content="交互式日历组件，支持月份切换、日期选择、节假日标记">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;scroll-behavior:smooth}.container{max-width:500px;margin:auto;padding-bottom:50px}header{text-align:center;padding:28px 0 16px}h1{font-size:1.3rem;margin-bottom:4px}.sub{color:var(--text2);font-size:.85rem}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.cal-nav button{background:var(--blue);border:none;color:var(--text);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.85rem}.cal-nav button:hover{opacity:.85}.cal-nav .month{font-size:1.1rem;font-weight:600}.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px;text-align:center}.cal-weekdays span{font-size:.75rem;color:var(--text2);padding:4px 0}.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .2s;border:1px solid transparent}.cal-day:hover{background:rgba(59,130,246,.15)}.cal-day.today{background:var(--blue);color:#fff;font-weight:600}.cal-day.selected{border-color:var(--gold);background:rgba(245,158,11,.15)}.cal-day.other{color:var(--text2);opacity:.4}.cal-day.holiday{position:relative}.cal-day.holiday::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--red);position:absolute;bottom:2px}.info{margin-top:16px;font-size:.85rem;color:var(--text2);text-align:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="日历组件 - garyy-tools">
<meta property="og:description" content="交互式日历组件，支持月份切换、日期选择、节假日标记">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>📅 日历组件</h1>
<div class="sub">月份切换 · 日期选择 · 节假日标记</div>
</header>
<div class="card">
<div class="cal-nav">
<button id="prevMonth">◀ 上月</button>
<div class="month" id="monthLabel"></div>
<button id="nextMonth">下月 ▶</button>
</div>
<div class="cal-weekdays">
<span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
</div>
<div class="cal-days" id="calDays"></div>
<div class="info" id="selectedInfo">点击日期查看详情</div>
</div>
</div>
<script>
(function(){
'use strict';
const today=new Date();
let curYear=today.getFullYear(),curMonth=today.getMonth(),selDate=null;
const holidays={
'1-1':'元旦','2-14':'情人节','3-8':'妇女节','4-1':'愚人节','5-1':'劳动节',
'5-4':'青年节','6-1':'儿童节','7-1':'建党节','8-1':'建军节','9-10':'教师节',
'10-1':'国庆节','12-25':'圣诞节','1-28':'除夕','1-29':'春节','4-5':'清明节',
'6-22':'端午节','9-29':'中秋节','农历正月初一':'春节','农历五月初五':'端午',
'农历八月十五':'中秋','农历腊月三十':'除夕'
};
function render(){
const first=new Date(curYear,curMonth,1);
const last=new Date(curYear,curMonth+1,0);
const startDay=first.getDay();
const totalDays=last.getDate();
const prevLast=new Date(curYear,curMonth,0).getDate();
document.getElementById('monthLabel').textContent=curYear+'年'+(curMonth+1)+'月';
const el=document.getElementById('calDays');
el.innerHTML='';
const weekdays=['日','一','二','三','四','五','六'];
for(let i=0;i<startDay;i++){
const d=document.createElement('div');d.className='cal-day other';d.textContent=prevLast-startDay+i+1;el.appendChild(d);
}
for(let d=1;d<=totalDays;d++){
const div=document.createElement('div');div.className='cal-day';div.textContent=d;
const key=(curMonth+1)+'-'+d;
if(curYear===today.getFullYear()&&curMonth===today.getMonth()&&d===today.getDate())div.classList.add('today');
if(selDate&&selDate.year===curYear&&selDate.month===curMonth&&selDate.day===d)div.classList.add('selected');
if(holidays[key])div.classList.add('holiday');
div.onclick=()=>{selDate={year:curYear,month:curMonth,day:d};const dow=weekdays[new Date(curYear,curMonth,d).getDay()];const h=holidays[key]?' · '+holidays[key]:'';document.getElementById('selectedInfo').textContent=curYear+'年'+(curMonth+1)+'月'+d+'日 星期'+dow+h;render();};
el.appendChild(div);
}
const remain=7-((startDay+totalDays)%7);
if(remain<7){for(let i=1;i<=remain;i++){const d=document.createElement('div');d.className='cal-day other';d.textContent=i;el.appendChild(d);}}
}
document.getElementById('prevMonth').onclick=()=>{curMonth--;if(curMonth<0){curMonth=11;curYear--;}selDate=null;render();};
document.getElementById('nextMonth').onclick=()=>{curMonth++;if(curMonth>11){curMonth=0;curYear++;}selDate=null;render();};
render();
})();
</script>
</body>
</html>
