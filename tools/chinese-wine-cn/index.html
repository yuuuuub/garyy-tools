<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国酒文化百科 - Chinese Wine Culture Encyclopedia</title>
<meta name="description" content="中国酒文化百科，涵盖白酒、黄酒、米酒、药酒等各类酒品的历史与品鉴">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国酒文化百科 - Chinese Wine Culture Encyclopedia">
<meta property="og:description" content="中国酒文化百科，涵盖白酒、黄酒、米酒、药酒等各类酒品的历史与品鉴">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-wine-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍶</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a05 0%,#2a1508 50%,#3d2010 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3015;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a,#b06a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.wine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.wine-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.wine-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.wine-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.wine-card .w-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.wine-card .w-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(232,168,124,0.15);color:var(--accent)}
.wine-card .w-name{font-size:1.3em;font-weight:bold}
.wine-card .w-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.wine-card .w-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.wine-card .w-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.wine-card .w-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.wine-card .w-detail strong{color:var(--text)}
.wine-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.wine-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🍶 中国酒文化百科</h1>
<p>Chinese Wine Culture Encyclopedia — 探索白酒、黄酒、米酒等各类酒品的历史与品鉴</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索酒类、名酒或酒文化...（如"茅台""五粮液""女儿红"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部酒类</button>
<button class="filter-btn" data-filter="白酒">🍶 白酒</button>
<button class="filter-btn" data-filter="黄酒">🫖 黄酒</button>
<button class="filter-btn" data-filter="米酒">🍚 米酒</button>
<button class="filter-btn" data-filter="药酒">🌿 药酒</button>
<button class="filter-btn" data-filter="酒文化">🎎 酒文化</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="wine-grid" id="wineGrid"></div>
<footer><p>🍶 中国酒文化百科 — 酒逢知己千杯少</p></footer>
</div>
<script>
const WINE_DATA=[
  {id:1,name:"茅台酒",en:"Moutai",category:"白酒",icon:"🍶",origin:"贵州茅台镇",features:"酱香突出、回味悠长",history:"茅台酒产于贵州茅台镇，是中国最著名的白酒。1915年获巴拿马万国博览会金奖，被誉为'国酒'。",brewing:"大曲酱香型，12987工艺",alcohol:"53%vol",taste:"酱香突出、回味悠长、空杯留香",culture:"茅台酒是中国国宴的指定用酒，象征着中国白酒的最高品质。"},
  {id:2,name:"五粮液",en:"Wuliangye",category:"白酒",icon:"🍶",origin:"四川宜宾",features:"窖香浓郁、入口绵甜",history:"五粮液产于四川宜宾，以五种粮食（高粱、大米、糯米、小麦、玉米）酿造，故名五粮液。",brewing:"浓香型，老窖发酵",alcohol:"52%vol",taste:"窖香浓郁、入口绵甜、回味悠长",culture:"五粮液是中国浓香型白酒的代表，以其'香气悠久、味醇厚'著称。"},
  {id:3,name:"泸州老窖",en:"Luzhou Laojiao",category:"白酒",icon:"🍶",origin:"四川泸州",features:"浓香鼻祖、酒中泰斗",history:"泸州老窖产于四川泸州，有四百多年历史。其1573国宝窖池群是全国重点文物保护单位。",brewing:"浓香型，国宝窖池",alcohol:"52%vol",taste:"窖香优雅、绵甜爽净、回味悠长",culture:"泸州老窖是中国浓香型白酒的发源地，被誉为'浓香鼻祖'。"},
  {id:4,name:"汾酒",en:"Fenjiu",category:"白酒",icon:"🍶",origin:"山西汾阳",features:"清香纯正、绵甜爽净",history:"汾酒产于山西汾阳杏花村，有一千多年历史。'借问酒家何处有，牧童遥指杏花村'指的就是汾酒。",brewing:"清香型，地缸发酵",alcohol:"53%vol",taste:"清香纯正、绵甜爽净、余味悠长",culture:"汾酒是中国清香型白酒的代表，有'中国酒魂'之称。"},
  {id:5,name:"剑南春",en:"Jiannanchun",category:"白酒",icon:"🍶",origin:"四川绵竹",features:"芳香浓郁、醇和回甜",history:"剑南春产于四川绵竹，有一千多年历史。唐代曾是宫廷御酒。",brewing:"浓香型，老窖发酵",alcohol:"52%vol",taste:"芳香浓郁、醇和回甜、清冽净爽",culture:"剑南春的名字来源于唐代'剑南道'，是中国最古老的名酒之一。"},
  {id:6,name:"女儿红",en:"Nü'er Hong",category:"黄酒",icon:"🫖",origin:"浙江绍兴",features:"琥珀色、甘甜醇厚",history:"女儿红是绍兴黄酒的代表，有千年历史。传统上在女儿出生时酿酒，待出嫁时开坛饮用。",brewing:"糯米酿造，发酵法",alcohol:"14-17%vol",taste:"琥珀色、甘甜醇厚、香气馥郁",culture:"女儿红寄托了父母对女儿的美好祝愿，是中国酒文化的浪漫体现。"},
  {id:7,name:"绍兴黄酒",en:"Shaoxing Rice Wine",category:"黄酒",icon:"🫖",origin:"浙江绍兴",features:"琥珀清亮、馥郁芬芳",history:"绍兴黄酒是中国黄酒的代表，有两千五百多年历史。以糯米酿造，琥珀清亮。",brewing:"糯米酿造，传统工艺",alcohol:"14-18%vol",taste:"琥珀清亮、馥郁芬芳、醇厚甘鲜",culture:"绍兴黄酒是绍兴的文化符号，与鲁迅笔下的咸亨酒店紧密相连。"},
  {id:8,name:"糯米酒",en:"Glutinous Rice Wine",category:"米酒",icon:"🍚",origin:"全国各地",features:"甘甜可口、营养丰富",history:"糯米酒是中国最古老的酒类之一，有数千年历史。以糯米酿造，甘甜可口。",brewing:"糯米酿造，自然发酵",alcohol:"5-12%vol",taste:"甘甜可口、营养丰富、微醺怡人",culture:"糯米酒是民间最常见的酒类，常用于坐月子、驱寒暖身。"},
  {id:9,name:"酒酿",en:"Sweet Fermented Rice",category:"米酒",icon:"🍚",origin:"全国各地",features:"酸甜可口、开胃消食",history:"酒酿又称醪糟、甜酒，是中国传统的发酵食品。以糯米酿造，酸甜可口。",brewing:"糯米酿造，酒曲发酵",alcohol:"2-5%vol",taste:"酸甜可口、开胃消食、营养丰富",culture:"酒酿是中国民间最常见的甜品原料，酒酿圆子、酒酿蛋等都是经典美食。"},
  {id:10,name:"虎骨酒",en:"Tiger Bone Wine",category:"药酒",icon:"🌿",origin:"传统",features:"祛风除湿、强筋壮骨",history:"虎骨酒是中国传统的药酒，有数百年历史。因涉及野生动物保护，现已禁止生产。",brewing:"白酒浸泡药材",alcohol:"35-45%vol",taste:"药香浓郁、微苦回甘",culture:"虎骨酒体现了中国传统'药食同源'的理念，现已被其他药材替代。"},
  {id:11,name:"酒桌文化",en:"Drinking Culture",category:"酒文化",icon:"🎎",origin:"全国各地",features:"敬酒、干杯、酒令",history:"中国酒桌文化源远流长，有独特的礼仪和规矩。'无酒不成席'是中国人的待客之道。",alcohol:"—",taste:"—",culture:"中国酒桌文化体现了中国人的社交礼仪，'感情深一口闷'是酒桌上的经典话语。"},
  {id:12,name:"酒令",en:"Drinking Games",category:"酒文化",icon:"🎎",origin:"古代",features:"行酒令、猜拳、诗词",history:"酒令是中国传统的饮酒游戏，有数千年历史。从简单的猜拳到复杂的诗词酒令，形式多样。",alcohol:"—",taste:"—",culture:"酒令是中国文人雅士饮酒时的娱乐方式，体现了中国文化的博大精深。"}
];
function renderCards(data){
  document.getElementById('wineGrid').innerHTML=data.map(w=>`
    <div class="wine-card" data-category="${w.category}">
      <div class="w-header"><div class="w-icon">${w.icon}</div><div><div class="w-name">${w.name}</div><div class="w-sub">${w.en} · ${w.origin}</div></div></div>
      <div class="w-meta"><span>${w.features}</span>${w.alcohol&&w.alcohol!=='—'?`<span>酒精度: ${w.alcohol}</span>`:''}</div>
      <div class="w-detail"><strong>历史：</strong>${w.history}</div>
      ${w.brewing?`<div class="w-detail"><strong>酿造：</strong>${w.brewing}</div>`:''}
      ${w.taste&&w.taste!=='—'?`<div class="w-detail"><strong>口感：</strong>${w.taste}</div>`:''}
      <div class="w-detail"><strong>文化：</strong>${w.culture}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(w=>{cats[w.category]=(cats[w.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">酒类/文化</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.wine-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.wine-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(WINE_DATA);renderStats(WINE_DATA);
</script>
</body>
</html>
