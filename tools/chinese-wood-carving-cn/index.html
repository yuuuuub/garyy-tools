<meta property="og:image" content="https://garyy.top/og-image.png"><meta name="description" content="中国木雕艺术百科 - 木雕流派、技法分类、代表作品、文化内涵全解"><meta name="robots" content="index,follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪵</text></svg>"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#d4a574;--accent2:#8b6914}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#8b5e3c;--accent2:#6b4226}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;transition:background var(--transition),color var(--transition)}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.category-btn{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all var(--transition)}.category-btn.active{background:var(--accent);color:#fff}.category-btn:hover{opacity:.85}.item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all var(--transition)}.item:hover{transform:translateY(-2px);border-color:var(--accent)}.item-title{font-size:1.05rem;font-weight:600;margin-bottom:4px}.item-era{color:var(--accent);font-size:.8rem;margin-bottom:6px}.item-desc{color:var(--text2);font-size:.9rem;line-height:1.5}.item-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.9rem;line-height:1.7;color:var(--text)}.item.open .item-detail{display:block}.tag{display:inline-block;padding:2px 8px;margin:4px 4px 0;background:var(--border);border-radius:12px;font-size:.75rem;color:var(--text2)}

<div class="container"><h1>🪵 中国木雕</h1><p class="sub">木雕流派 · 技法分类 · 代表作品 · 文化内涵</p>
<div class="card">
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索木雕知识..." oninput="filterList()"></div>
<div class="btn-group">
<button class="category-btn active" onclick="filterCat('all',this)">全部</button>
<button class="category-btn" onclick="filterCat('历史',this)">历史</button>
<button class="category-btn" onclick="filterCat('技法',this)">技法</button>
<button class="category-btn" onclick="filterCat('流派',this)">流派</button>
<button class="category-btn" onclick="filterCat('木材',this)">木材</button>

</div></div>

<script>
var data=[
{title:'木雕起源',era:'新石器时代',cat:'历史',tags:['河姆渡','象牙雕','最早'],desc:'中国木雕起源于新石器时代，河姆渡遗址出土了最早的木雕实物。',detail:'中国木雕历史悠久，河姆渡遗址出土的木雕鱼和木雕蝶形器是已知最早的木雕实物，距今约7000年。商周时期木雕已相当成熟，主要用于建筑装饰和陪葬俑。秦汉以后，木雕艺术不断发展，形成了多种流派和技法。',ref:'《中国木雕艺术》'},
{title:'唐宋繁荣',era:'唐宋',cat:'历史',tags:['唐代','宋代','佛像'],desc:'唐代木雕佛像达到高峰，宋代木雕向世俗化发展。',detail:'唐代木雕以佛像雕刻最为著名，龙门石窟、云冈石窟中的木雕佛像造型优美、气韵生动。宋代木雕向世俗化发展，出现了大量的木雕玩具、装饰品和生活用品。《营造法式》详细记载了木雕的技法和规范。',ref:'《营造法式》'},
{title:'明清鼎盛',era:'明清',cat:'历史',tags:['鼎盛','家具','建筑装饰'],desc:'明清是木雕的鼎盛期，木雕家具和建筑装饰达到极高水平。',detail:'明清是木雕艺术的鼎盛期。明式家具以简洁典雅著称，清式家具以繁复华丽见长。建筑装饰木雕如门窗、梁枋、牛腿等精美绝伦。东阳木雕、潮州木雕、龙眼木雕、黄杨木雕等流派在此时期形成或成熟。',ref:'《明式家具研究》'},
{title:'浮雕',era:'历代',cat:'技法',tags:['平面','凸起','建筑'],desc:'在木材表面雕刻出凸起的图案，是最常用的木雕技法。',detail:'浮雕是在木材平面背景上雕刻出凸起图案的技法。根据凸起程度分为浅浮雕和高浮雕。浅浮雕图案凸起较少，适合大面积装饰；高浮雕图案凸起较高，立体感强。浮雕广泛应用于建筑装饰、家具装饰和工艺品。',ref:'《木雕技法》'},
{title:'圆雕',era:'历代',cat:'技法',tags:['立体','全方位','佛像'],desc:'立体雕刻，可以从各个角度观赏，是最具立体感的木雕技法。',detail:'圆雕又称"立体雕"，是从各个角度都可以观赏的立体雕刻。圆雕要求雕刻者具备极强的空间想象力和造型能力。佛像雕刻是圆雕最重要的应用，要求人物比例准确、神态传神。圆雕作品可以360度观赏，是最具艺术表现力的木雕形式。',ref:'《中国雕塑史》'},
{title:'镂空雕',era:'历代',cat:'技法',tags:['透雕','玲珑','精细'],desc:'将背景部分完全镂空，使图案玲珑剔透、层次丰富。',detail:'镂空雕又称"透雕"，是在浮雕基础上将背景部分完全镂空的技法。镂空雕作品玲珑剔透、层次丰富，具有极强的装饰效果。潮州木雕以镂空雕最为著名，其多层镂空技艺令人叹为观止。镂空雕对木材的质地和雕刻者的技术要求极高。',ref:'《潮州木雕》'},
{title:'东阳木雕',era:'唐代至今',cat:'流派',tags:['浙江','白木雕','浮雕'],desc:'浙江东阳的传统木雕，以白木浮雕著称，被誉为"木雕之乡"。',detail:'东阳木雕产于浙江东阳，始于唐代，明清时期达到鼎盛。东阳木雕以"白木雕"（不施彩绘）为主，擅长浮雕，题材以人物故事和山水风景为主。东阳木雕风格清秀典雅、层次分明，2006年被列入国家级非物质文化遗产。',ref:'《东阳木雕志》'},
{title:'潮州木雕',era:'明代至今',cat:'流派',tags:['广东','金漆','镂空'],desc:'广东潮州的传统木雕，以金漆木雕和多层镂空技艺著称。',detail:'潮州木雕产于广东潮州，以金漆木雕和多层镂空技艺著称。潮州木雕在完成雕刻后贴上金箔，金碧辉煌、富丽堂皇。其多层镂空技艺可达到五层以上，令人叹为观止。潮州木雕广泛应用于祠堂、寺庙建筑和家具装饰。',ref:'《潮州木雕》'},
{title:'龙眼木雕',era:'清代至今',cat:'流派',tags:['福建','圆雕','人物'],desc:'福建福州的传统木雕，以龙眼木为材料，擅长人物圆雕。',detail:'龙眼木雕产于福建福州，以龙眼木（桂圆树）为材料。龙眼木质地坚韧、色泽深沉，适合雕刻人物。龙眼木雕以圆雕人物著称，尤其擅长雕刻古代人物和仙佛造像。其风格古朴典雅、造型生动，是福建传统工艺的代表。',ref:'《福州木雕》'},
{title:'黄杨木雕',era:'清代至今',cat:'流派',tags:['浙江','小件','精细'],desc:'浙江乐清的传统木雕，以黄杨木为材料，擅长精细小件。',detail:'黄杨木雕产于浙江乐清，以黄杨木为材料。黄杨木质地细密、色泽温润，随时间推移颜色逐渐变深，有"千年难长黄杨木"之说。黄杨木雕以小型圆雕为主，擅长雕刻人物、花鸟等精细小件，工艺精湛、玲珑可爱。',ref:'《乐清黄杨木雕》'},
{title:'紫檀',era:'历代',cat:'木材',tags:['檀香紫檀','最贵','宫廷'],desc:'最珍贵的木雕材料，质地坚硬细密，色泽深沉，自古为宫廷专用。',detail:'紫檀（檀香紫檀）是世界上最珍贵的木材之一。紫檀质地坚硬细密、色泽深沉如漆、纹理细密如牛毛。紫檀生长极慢，"千年成材"，故极为珍贵。明清时期紫檀为宫廷专用，用于制作家具和工艺品。紫檀木雕色泽深沉、质感高贵。',ref:'《紫檀家具》'},
{title:'黄花梨',era:'明代至今',cat:'木材',tags:['降香黄檀','明式家具','纹理'],desc:'最名贵的家具用材，纹理如行云流水，是明式家具的首选材料。',detail:'黄花梨（降香黄檀）是制作明式家具的首选材料。黄花梨纹理如行云流水、变化万千，有"鬼脸纹"等独特纹理。其质地坚硬细密、色泽金黄温润，香气清幽。明式家具以黄花梨制作的最为珍贵，一件明式黄花梨家具价值连城。',ref:'《明式家具研究》'},
{title:'《清明上河图》木雕',era:'当代',cat:'作品',tags:['东阳木雕','巨作','张作五金'],desc:'当代木雕巨作，以木雕形式再现张择端《清明上河图》的盛景。',detail:'《清明上河图》木雕是以东阳木雕技法创作的当代巨作。木雕艺人以精湛的技艺，将北宋张择端的《清明上河图》用木雕形式再现，人物、建筑、船只等栩栩如生。此类大型木雕作品展现了当代木雕艺人高超的技艺水平。',ref:'《东阳木雕》'},
{title:'圆明园木雕',era:'清代',cat:'作品',tags:['圆明园','西洋楼','巴洛克'],desc:'圆明园西洋楼的木雕装饰融合了中西风格，精美绝伦。',detail:'圆明园西洋楼是清代乾隆年间修建的中西合璧建筑群。其木雕装饰融合了中国传统木雕和欧洲巴洛克风格，精美绝伦。1860年英法联军焚毁圆明园后，大量精美的木雕构件散落海外，成为中华民族永远的痛。',ref:'《圆明园》'},
{title:'木雕与佛教',era:'汉代至今',cat:'历史',tags:['佛像','造像','信仰'],desc:'木雕佛像是中国木雕艺术的重要门类，承载着深厚的宗教文化。',detail:'木雕佛像是中国木雕艺术的重要门类。从汉代佛教传入中国开始，木雕佛像就成为重要的宗教艺术品。唐代木雕佛像达到艺术高峰，造型优美、神态安详。山西、福建、浙江等地保存了大量精美的古代木雕佛像。',ref:'《中国佛教艺术》'},
{title:'木雕与建筑',era:'先秦至今',cat:'历史',tags:['建筑装饰','门窗','梁枋'],desc:'木雕广泛应用于中国传统建筑，是建筑装饰的重要组成部分。',detail:'木雕在中国传统建筑中有着广泛应用。门窗格扇、梁枋牛腿、雀替挂落等建筑构件上都有精美的木雕装饰。这些建筑木雕不仅具有装饰功能，还承载着吉祥寓意和文化内涵。徽派建筑、闽南建筑、潮汕建筑中的木雕装饰尤为精美。',ref:'《中国古建筑装饰》'}
];
var currentCat='all';
function renderList(items){
  var el=document.getElementById('list');
  var s=document.getElementById('stats');
  s.textContent='共 '+items.length+' 条知识';
  el.innerHTML=items.map(function(d,i){
    return '<div class="item" onclick="this.classList.toggle(\'open\')">'+
    '<div class="item-title">'+d.title+'</div>'+
    '<div class="item-era">年代：'+d.era+'</div>'+
    '<div class="item-desc">'+d.desc+'</div>'+
    '<div class="item-detail"><h4>详细介绍</h4><p>'+d.detail+'</p>'+
    '<p style="margin-top:8px;color:var(--accent2)">参考：'+d.ref+'</p>'+
    '<div>'+d.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div></div>';
  }).join('');
}
function filterList(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=data.filter(function(d){
    var matchQ=d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q)||d.era.toLowerCase().includes(q);
    var matchC=currentCat==='all'||d.cat===currentCat;
    return matchQ&&matchC;
  });
  renderList(filtered);
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterList();
}
renderList(data);
</script></body></html>
