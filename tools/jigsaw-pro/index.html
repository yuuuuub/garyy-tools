<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼图Pro</title>
<meta name="description" content="专业拼图游戏，支持自定义图片和难度选择">
<style>
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--success:#22c55e}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15pxscroll-behavior:smooth;}
h1{font-size:1.5rem;margin-bottom:10px;color:var(--accent)}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.toolbar button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:0.85rem;cursor:pointer;font-family:inherit}
.toolbar button.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.info-bar{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.info-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:0.85rem}
.info-item span{color:var(--accent);font-weight:bold}
.canvas-wrap{position:relative;margin-bottom:12px;border:2px solid var(--border);border-radius:8px;overflow:hidden}
canvas{display:block;cursor:pointer}
.preview-canvas{position:absolute;top:10px;right:10px;border:2px solid var(--accent);border-radius:8px;opacity:0.85;z-index:5}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{background:var(--accent);color:var(--text);border:none;border-radius:8px;padding:8px 16px;font-size:0.9rem;cursor:pointer;font-family:inherit}
button:hover{opacity:0.85}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:100}
.overlay .box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px;text-align:center}
.hidden{display:none!important}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="拼图Pro">
  <meta property="og:description" content="专业拼图游戏，支持自定义图片和难度选择">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/jigsaw-pro/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>🧩 拼图Pro</h1>
<div class="toolbar">
  <button onclick="setDiff(3)" id="d3" class="active">3×3</button>
  <button onclick="setDiff(4)" id="d4">4×4</button>
  <button onclick="setDiff(5)" id="d5">5×5</button>
</div>
<div class="info-bar">
  <div class="info-item">🔄 步数: <span id="moves">0</span></div>
  <div class="info-item">⏱ <span id="timer">0</span>秒</div>
</div>
<div class="canvas-wrap">
  <canvas id="canvas"></canvas>
  <canvas id="preview" class="preview-canvas"></canvas>
</div>
<div class="btn-row">
  <button onclick="newPuzzle()">🔄 新拼图</button>
  <button onclick="togglePreview()">👁 预览</button>
  <button onclick="solvePuzzle()">✨ 自动完成</button>
</div>
<div class="overlay hidden" id="winOverlay">
  <div class="box">
    <h2 style="color:var(--success);font-size:1.5rem;margin-bottom:15px">🎉 拼图完成!</h2>
    <p>步数: <span id="winMoves">0</span> | 用时: <span id="winTime">0</span>秒</p>
    <button onclick="newPuzzle();document.getElementById('winOverlay').classList.add('hidden')">再来一局</button>
  </div>
</div>
<script>
let grid,gridSize=3,tileSize,moves=0,timer=0,timerInterval=null,showPreview=true,selectedIdx=null;
const SIZE=400;
function setDiff(s){
  gridSize=s;
  document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
  document.getElementById('d'+s).classList.add('active');
  newPuzzle();
}
function newPuzzle(){
  clearInterval(timerInterval);timer=0;moves=0;selectedIdx=null;
  document.getElementById('moves').textContent=0;
  document.getElementById('timer').textContent=0;
  document.getElementById('winOverlay').classList.add('hidden');
  const total=gridSize*gridSize;
  grid=Array.from({length:total},(_,i)=>i);
  for(let i=total-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [grid[i],grid[j]]=[grid[j],grid[i]];
  }
  tileSize=SIZE/gridSize;
  const canvas=document.getElementById('canvas');
  canvas.width=SIZE;canvas.height=SIZE;
  render();
  renderPreview();
  timerInterval=setInterval(()=>{timer++;document.getElementById('timer').textContent=timer},1000);
}
function drawPattern(ctx,tileIdx,x,y,w,h){
  const row=Math.floor(tileIdx/gridSize),col=tileIdx%gridSize;
  const hue=((row*70+col*120)%360);
  const grad=ctx.createLinearGradient(x,y,x+w,y+h);
  grad.addColorStop(0,`hsl(${hue},60%,35%)`);
  grad.addColorStop(1,`hsl(${(hue+60)%360},50%,25%)`);
  ctx.fillStyle=grad;
  ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.font=`bold ${w*0.35}px sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(tileIdx+1,x+w/2,y+h/2);
  ctx.strokeStyle='rgba(255,255,255,0.2)';
  ctx.lineWidth=2;
  ctx.strokeRect(x+2,y+2,w-4,h-4);
}
function render(){
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,SIZE,SIZE);
  ctx.fillStyle='#0d1117';
  ctx.fillRect(0,0,SIZE,SIZE);
  grid.forEach((tileIdx,pos)=>{
    const row=Math.floor(pos/gridSize),col=pos%gridSize;
    const x=col*tileSize,y=row*tileSize;
    if(selectedIdx===pos){
      ctx.strokeStyle='#3b82f6';ctx.lineWidth=3;
      ctx.strokeRect(x,y,tileSize,tileSize);
    }
    drawPattern(ctx,tileIdx,x+2,y+2,tileSize-4,tileSize-4);
  });
}
function renderPreview(){
  const c=document.getElementById('preview');
  const s=100;c.width=s;c.height=s;
  const ctx=c.getContext('2d');
  const t=s/gridSize;
  for(let i=0;i<gridSize*gridSize;i++){
    const row=Math.floor(i/gridSize),col=i%gridSize;
    drawPattern(ctx,i,col*t,row*t,t,t);
  }
  c.style.display=showPreview?'block':'none';
}
function togglePreview(){
  showPreview=!showPreview;
  document.getElementById('preview').style.display=showPreview?'block':'none';
}
document.getElementById('canvas').addEventListener('click',e=>{
  const rect=e.target.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  const col=Math.floor(x/tileSize),row=Math.floor(y/tileSize);
  const pos=row*gridSize+col;
  if(selectedIdx===null){
    selectedIdx=pos;render();
  } else {
    const sr=Math.floor(selectedIdx/gridSize),sc=selectedIdx%gridSize;
    if((sr===row&&Math.abs(sc-col)===1)||(sc===col&&Math.abs(sr-row)===1)){
      [grid[selectedIdx],grid[pos]]=[grid[pos],grid[selectedIdx]];
      moves++;document.getElementById('moves').textContent=moves;
      selectedIdx=null;render();checkWin();
    } else {
      selectedIdx=pos;render();
    }
  }
});
function checkWin(){
  for(let i=0;i<grid.length;i++)if(grid[i]!==i)return;
  clearInterval(timerInterval);
  document.getElementById('winMoves').textContent=moves;
  document.getElementById('winTime').textContent=timer;
  document.getElementById('winOverlay').classList.remove('hidden');
}
function solvePuzzle(){
  clearInterval(timerInterval);
  grid=Array.from({length:gridSize*gridSize},(_,i)=>i);
  moves=0;document.getElementById('moves').textContent=0;
  render();checkWin();
}
newPuzzle();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
