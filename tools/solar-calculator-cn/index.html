<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光伏发电计算器 | Solar Calculator CN</title>
<meta property="og:title" content="光伏发电计算器 | Solar Calculator CN">
<meta property="og:description" content="光伏发电计算器 | Solar Calculator CN - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="光伏发电收益计算器，评估家庭太阳能投资回报">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☀️</text></svg>">
<meta name="robots" content="index, follow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--input:#242836;--text:#e2e4e9;--text2:#8b8fa3;--orange:#f59e0b;--orange2:#d97706;--green:#22c55e;--blue:#3b82f6;--border:#2a2e3a;--radius:12px;--radius-sm:8px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--input:#f0f2f5;--text:#1f2328;--text2:#656d76;--orange:#bf8700;--green:#1a7f37;--blue:#0969da;--border:#d0d7de}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;line-height:1.6;padding:20px}
.container{max-width:860px;margin:0 auto;padding:0 12px}
header{text-align:center;padding:40px 0 24px}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#f59e0b,#eab308,#facc15);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{color:var(--text2);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px}
.card h2{font-size:1.15rem;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:.88rem;font-weight:500;color:var(--text2)}
.form-group input{background:var(--input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-size:.93rem;font-family:inherit;outline:none;width:100%}
.form-group input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(245,158,11,.12)}
.form-group select{background:var(--input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-size:.93rem;font-family:inherit;outline:none;width:100%;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 32px;border-radius:var(--radius-sm);font-size:1rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:all .2s;width:100%}
.btn-primary{background:var(--orange);color:#000}
.btn-primary:hover{background:var(--orange2);transform:translateY(-1px)}
.btn-secondary{background:var(--input);color:var(--text);border:1px solid var(--border);margin-top:10px}
.result-hidden{display:none}
.result-visible{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
@media(max-width:500px){.stats-grid{grid-template-columns:1fr}}
.stat-card{background:var(--input);border-radius:var(--radius-sm);padding:16px;text-align:center;border-top:3px solid var(--orange)}
.stat-card .s-val{font-size:1.5rem;font-weight:800;color:var(--orange)}
.stat-card .s-label{font-size:.82rem;color:var(--text2);margin-top:4px}
.timeline{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.timeline-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--input);border-radius:var(--radius-sm)}
.timeline-item .t-year{min-width:50px;font-weight:700;color:var(--orange)}
.timeline-item .t-bar{flex:1;height:20px;background:#1e2230;border-radius:4px;overflow:hidden}
.timeline-item .t-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--orange),#facc15);transition:width .6s ease}
.timeline-item .t-val{min-width:80px;text-align:right;font-size:.88rem;font-weight:600}
.tips-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:500px){.tips-grid{grid-template-columns:1fr}}
.tip{background:var(--input);border-radius:var(--radius-sm);padding:14px;font-size:.88rem;border-left:3px solid var(--orange)}
.tip .tip-cat{font-size:.75rem;color:var(--text2);margin-bottom:4px}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.82rem}
</style>
</head>
<body>
<div class="container">
<header><h1>光伏发电计算器</h1><p class="subtitle">评估家庭太阳能系统的投资回报</p></header>
<div class="card" id="inputCard">
<h2><span class="icon">☀️</span> 光伏系统参数</h2>
<div class="form-grid">
<div class="form-group"><label>系统容量（kW）</label><input type="number" id="capacity" value="5" min="0.5" max="100" step="0.5"></div>
<div class="form-group"><label>所在地区日照等级</label><select id="sunZone"><option value="4.5">☀️ 一类（西北）- 4.5h/天</option><option value="3.8" selected>🌤 二类（华北）- 3.8h/天</option><option value="3.2">⛅ 三类（华中）- 3.2h/天</option><option value="2.8">🌥 四类（华南）- 2.8h/天</option></select></div>
<div class="form-group"><label>电价（元/kWh）</label><input type="number" id="elecPrice" value="0.6" min="0" max="2" step="0.01"></div>
<div class="form-group"><label>系统单价（元/W）</label><input type="number" id="unitPrice" value="3.5" min="1" max="10" step="0.1"></div>
<div class="form-group"><label>年衰减率（%）</label><input type="number" id="degrade" value="0.5" min="0" max="3" step="0.1"></div>
<div class="form-group"><label>使用寿命（年）</label><input type="number" id="lifespan" value="25" min="5" max="40"></div>
</div>
<button class="btn btn-primary" onclick="calc()">☀️ 计算收益</button>
</div>
<div id="result" class="result-hidden">
<div class="card">
<div class="stats-grid">
<div class="stat-card"><div class="s-val" id="totalInvest">¥0</div><div class="s-label">初始投资</div></div>
<div class="stat-card"><div class="s-val" id="yearIncome">¥0</div><div class="s-label">年发电收益</div></div>
<div class="stat-card"><div class="s-val" id="paybackYear">0年</div><div class="s-label">回本周期</div></div>
</div>
</div>
<div class="card">
<h2><span class="icon">📊</span> 25年收益预测</h2>
<div class="timeline" id="timeline"></div>
</div>
<div class="card">
<h2><span class="icon">💡</span> 安装建议</h2>
<div class="tips-grid" id="tips"></div>
</div>
<button class="btn btn-secondary" onclick="resetForm()">🔄 重新计算</button>
</div>
<footer>光伏发电计算器 · 数据仅供参考，实际收益受天气、遮挡等因素影响</footer>
</div>
<script>
function calc(){
const cap=parseFloat(document.getElementById('capacity').value)||5;
const sunH=parseFloat(document.getElementById('sunZone').value)||3.8;
const ep=parseFloat(document.getElementById('elecPrice').value)||0.6;
const up=parseFloat(document.getElementById('unitPrice').value)||3.5;
const deg=parseFloat(document.getElementById('degrade').value)||0.5;
const life=parseInt(document.getElementById('lifespan').value)||25;
const invest=cap*1000*up;
const dayGen=cap*sunH;
const yearGen=dayGen*365;
const yearIncome=yearGen*ep;
const payback=yearIncome>0?invest/yearIncome:99;
document.getElementById('totalInvest').textContent='¥'+invest.toFixed(0);
document.getElementById('yearIncome').textContent='¥'+yearIncome.toFixed(0);
document.getElementById('paybackYear').textContent=(payback<life?payback.toFixed(1):'>25')+'年';
let th='';
const milestones=[1,3,5,10,15,20,25];
milestones.forEach(y=>{
let cumIncome=0;
for(let i=1;i<=y;i++){cumIncome+=yearIncome*Math.pow(1-deg/100,i-1)}
const net=cumIncome-invest;
const pct=Math.min(net/invest*100+50,100);
th+=`<div class="timeline-item"><span class="t-year">第${y}年</span><div class="t-bar"><div class="t-fill" style="width:${pct}%"></div></div><span class="t-val" style="color:${net>=0?'var(--green)':'var(--text2)'}">${net>=0?'+':''}¥${net.toFixed(0)}</span></div>`;
});
document.getElementById('timeline').innerHTML=th;
const allTips=[
{cat:'选购',text:'选择一线品牌组件，质保25年更有保障'},
{cat:'安装',text:'朝南安装最佳，倾角约等于当地纬度'},
{cat:'维护',text:'定期清洗面板，灰尘可降低发电效率5-15%'},
{cat:'收益',text:'余电上网可获得额外收益，关注当地并网政策'},
{cat:'补贴',text:'了解当地光伏发电补贴政策，降低投资成本'},
{cat:'选型',text:'根据屋顶面积选择合适的系统容量'}
];
let tipH='';
allTips.forEach(t=>{tipH+=`<div class="tip"><div class="tip-cat">${t.cat}</div>${t.text}</div>`});
document.getElementById('tips').innerHTML=tipH;
document.getElementById('result').className='result-visible';
document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
function resetForm(){document.getElementById('result').className='result-hidden';document.getElementById('inputCard').scrollIntoView({behavior:'smooth'})}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
