<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 地震监测</title>
<meta name="description" content="全球地震实时监测，地震预警信息，历史地震数据查询">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.earthquake-list{max-height:400px;overflow-y:auto}
.earthquake-item{display:flex;align-items:center;padding:12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.earthquake-item:hover{background:var(--bg)}
.earthquake-item:last-child{border-bottom:none}
.magnitude{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;color:#fff;flex-shrink:0}
.magnitude.low{background:#22c55e}.magnitude.mid{background:#f59e0b}.magnitude.high{background:#ef4444}.magnitude.very-high{background:#7e0023}
.earthquake-info{flex:1;margin-left:12px}
.earthquake-location{font-weight:600;font-size:.95rem}
.earthquake-meta{font-size:.8rem;color:var(--text2);margin-top:2px}
.earthquake-time{font-size:.8rem;color:var(--text2);text-align:right}
.earthquake-depth{font-size:.75rem;color:var(--text2)}
.world-map{height:300px;background:var(--bg);border-radius:8px;position:relative;overflow:hidden}
.map-overlay{position:absolute;top:10px;right:10px;background:var(--card);padding:8px 12px;border-radius:6px;font-size:.8rem;border:1px solid var(--border)}
.earthquake-dot{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;transition:all .2s}
.earthquake-dot:hover{transform:translate(-50%,-50%) scale(2)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.stat{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
.stat .value{font-size:1.4rem;font-weight:700;color:var(--accent)}
.stat .label{font-size:.8rem;color:var(--text2);margin-top:4px}
.filter-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-tab{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.8rem}
.filter-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:16px;padding-left:20px}
.timeline-item::before{content:'';position:absolute;left:-16px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.timeline-item .time{font-size:.8rem;color:var(--text2)}
.timeline-item .content{font-size:.9rem;margin-top:2px}
.magnitude-scale{display:flex;gap:4px;margin-top:12px}
.magnitude-scale-item{flex:1;text-align:center;padding:8px;border-radius:4px;font-size:.75rem}
.magnitude-scale-item.low{background:rgba(34,197,94,.2);color:#22c55e}
.magnitude-scale-item.mid{background:rgba(245,158,11,.2);color:#f59e0b}
.magnitude-scale-item.high{background:rgba(239,68,68,.2);color:#ef4444}
.magnitude-scale-item.very-high{background:rgba(126,0,35,.2);color:#7e0023}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes ripple{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}
.earthquake-dot.ripple{animation:ripple 1s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🌍 地震监测">
<meta property="og:description" content="全球地震实时监测，地震预警信息">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🌍 地震监测</h1><p>全球地震实时监测，掌握地震动态</p></div>

<div class="cd">
<h2>监测概览</h2>
<div class="stat-grid">
<div class="stat"><div class="value" id="todayCount">12</div><div class="label">今日地震</div></div>
<div class="stat"><div class="value" style="color:var(--danger)" id="maxMagnitude">6.2</div><div class="label">最大震级</div></div>
<div class="stat"><div class="value" id="weekCount">86</div><div class="label">本周地震</div></div>
<div class="stat"><div class="value" id="monthCount">342</div><div class="label">本月地震</div></div>
</div>
</div>

<div class="cd">
<h2>地震分布图</h2>
<div class="world-map" id="worldMap">
<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--text2)">
<div style="font-size:3rem">🗺️</div>
<div>全球地震分布</div>
</div>
</div>
<div class="magnitude-scale">
<div class="magnitude-scale-item low"><3级</div>
<div class="magnitude-scale-item mid">3-5级</div>
<div class="magnitude-scale-item high">5-7级</div>
<div class="magnitude-scale-item very-high">>7级</div>
</div>
</div>

<div class="cd">
<h2>最近地震</h2>
<div class="filter-tabs">
<div class="filter-tab active" onclick="filterEarthquakes('all')">全部</div>
<div class="filter-tab" onclick="filterEarthquakes('significant')">显著</div>
<div class="filter-tab" onclick="filterEarthquakes('local')">本地区</div>
<div class="filter-tab" onclick="filterEarthquakes('recent')">最近24h</div>
</div>
<div class="earthquake-list" id="earthquakeList"></div>
</div>

<div class="cd">
<h2>地震预警时间线</h2>
<div class="timeline" id="timeline"></div>
</div>

<div class="cd">
<h2>地震知识</h2>
<div id="knowledge"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const earthquakes=[
  {id:1,mag:6.2,location:'日本本州东海岸',depth:35,time:'2024-01-15 14:23',lat:36.5,lng:142.0},
  {id:2,mag:5.8,location:'智利北部海岸',depth:45,time:'2024-01-15 12:15',lat:-23.5,lng:-70.5},
  {id:3,mag:4.5,location:'中国四川省',depth:15,time:'2024-01-15 10:30',lat:30.5,lng:103.5},
  {id:4,mag:3.2,location:'美国加利福尼亚',depth:8,time:'2024-01-15 08:45',lat:34.0,lng:-118.0},
  {id:5,mag:5.1,location:'印尼苏门答腊',depth:25,time:'2024-01-14 22:10',lat:-2.5,lng:101.5},
  {id:6,mag:4.8,location:'土耳其东部',depth:20,time:'2024-01-14 18:30',lat:39.5,lng:41.5},
  {id:7,mag:3.9,location:'新西兰北岛',depth:12,time:'2024-01-14 15:20',lat:-37.5,lng:176.5},
  {id:8,mag:2.8,location:'中国台湾花莲',depth:5,time:'2024-01-14 12:00',lat:24.0,lng:121.5}
];
let currentFilter='all';

function getMagnitudeClass(mag){
  if(mag<3)return'low';
  if(mag<5)return'mid';
  if(mag<7)return'high';
  return'very-high';
}

function renderEarthquakes(){
  let filtered=earthquakes;
  if(currentFilter==='significant')filtered=earthquakes.filter(e=>e.mag>=5);
  else if(currentFilter==='local')filtered=earthquakes.filter(e=>e.location.includes('中国'));
  else if(currentFilter==='recent')filtered=earthquakes.slice(0,5);
  
  $('earthquakeList').innerHTML=filtered.map(e=>`<div class="earthquake-item">
    <div class="magnitude ${getMagnitudeClass(e.mag)}">${e.mag}</div>
    <div class="earthquake-info">
      <div class="earthquake-location">${e.location}</div>
      <div class="earthquake-meta">深度: ${e.depth}km · 纬度: ${e.lat}° · 经度: ${e.lng}°</div>
    </div>
    <div class="earthquake-time">${e.time.split(' ')[1]}</div>
  </div>`).join('');
}

function filterEarthquakes(filter){
  currentFilter=filter;
  document.querySelectorAll('.filter-tab').forEach((t,i)=>t.classList.toggle('active',['all','significant','local','recent'][i]===filter));
  renderEarthquakes();
}

function renderMapDots(){
  const mapWidth=900;
  const mapHeight=300;
  const dots=earthquakes.map(e=>{
    const x=((e.lng+180)/360)*mapWidth;
    const y=((90-e.lat)/180)*mapHeight;
    return`<div class="earthquake-dot ${getMagnitudeClass(e.mag)}" style="left:${x}px;top:${y}px;background:${e.mag>=5?'#ef4444':e.mag>=3?'#f59e0b':'#22c55e'}" title="${e.location} M${e.mag}"></div>`;
  }).join('');
  $('worldMap').insertAdjacentHTML('beforeend',dots);
}

function renderTimeline(){
  const timeline=[
    {time:'14:23',content:'日本本州东海岸发生6.2级地震'},
    {time:'12:15',content:'智利北部海岸发生5.8级地震'},
    {time:'10:30',content:'中国四川省发生4.5级地震'},
    {time:'08:45',content:'美国加利福尼亚发生3.2级地震'},
    {time:'昨日 22:10',content:'印尼苏门答腊发生5.1级地震'}
  ];
  $('timeline').innerHTML=timeline.map(t=>`<div class="timeline-item"><div class="time">${t.time}</div><div class="content">${t.content}</div></div>`).join('');
}

function renderKnowledge(){
  const knowledge=[
    {icon:'📏',title:'震级划分',content:'微震(<3级)、有感地震(3-4.5级)、中强震(4.5-6级)、强震(6-7级)、巨大地震(>7级)'},
    {icon:'⏱️',title:'预警时间',content:'地震预警系统可在地震波到达前数秒至数十秒发出警报，为避险争取宝贵时间'},
    {icon:'🏗️',title:'避险要点',content:'就近避险，保护头部，远离窗户和重物，震后迅速撤离到空旷地带'},
    {icon:'📱',title:'预警接收',content:'关注当地地震预警信息渠道，安装地震预警APP，及时获取预警信息'}
  ];
  $('knowledge').innerHTML=knowledge.map(k=>`<div class="earthquake-item" style="cursor:default">
    <div style="font-size:2rem;margin-right:12px">${k.icon}</div>
    <div class="earthquake-info">
      <div class="earthquake-location">${k.title}</div>
      <div class="earthquake-meta">${k.content}</div>
    </div>
  </div>`).join('');
}

renderEarthquakes();
renderMapDots();
renderTimeline();
renderKnowledge();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
