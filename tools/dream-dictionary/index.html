<script>
const dreams = [
  { kw:"水", cat:"自然", interp:"梦见水通常象征情感和潜意识。清澈的水代表心灵纯净、情绪稳定，事业生活将有好的转机；浑浊的水暗示内心困惑或即将面临麻烦；大水泛滥预示情绪失控或生活将有大变动。梦见在水中游泳，主近期运势上升，有贵人相助。", auspice:"平", related:["河流","海洋","雨","洪水"] },
  { kw:"河流", cat:"自然", interp:"梦见河流象征生命之流。河水清澈平稳，主运势亨通、事业顺遂；河水湍急浑浊，则提醒你近期需小心行事，谨防口舌是非。梦见渡过河流，预示即将克服困难，迎来新的阶段。若梦见河水泛滥成灾，提示情感方面可能出现波折。", auspice:"吉", related:["水","海洋","桥","洪水"] },
  { kw:"海洋", cat:"自然", interp:"梦见大海象征广阔的前景和未知的可能性。风平浪静的大海预示事业将一帆风顺；波涛汹涌则暗示前方有挑战需要面对。梦见在海边漫步，主心情舒畅，近期有好事临门。梦见沉入海底，则提醒你注意健康问题，尤其是呼吸系统。", auspice:"平", related:["水","河流","船","鱼"] },
  { kw:"雨", cat:"自然", interp:"梦见下雨是吉兆。细雨绵绵，主财运将至，有意外之财；大雨滂沱，主事业将有大发展，但需防小人暗算。梦见撑着伞在雨中行走，提示有贵人暗中相助。若梦见被雨淋湿，近期需注意身体健康，预防感冒风寒。", auspice:"吉", related:["水","闪电","雷","风"] },
  { kw:"闪电", cat:"自然", interp:"梦见闪电代表突然的启示或变故。一道闪电划破夜空，预示你将获得灵感或重要消息，事业上可能有突破性进展。若梦见被闪电击中，反而大吉，主将有意外收获或升迁之喜。梦见雷电交加，提示近期注意情绪管理。", auspice:"吉", related:["雷","雨","火","风暴"] },
  { kw:"雷", cat:"自然", interp:"梦见打雷是吉兆，象征威严和力量。雷声滚滚，主事业上将有重大突破，声名远扬。若梦见被雷惊吓，提示近期需谨言慎行，避免与人发生冲突。梦见雷击中房屋或其他物体，提醒注意家中安全隐患。", auspice:"吉", related:["闪电","风暴","雨","天"] },
  { kw:"风", cat:"自然", interp:"梦见刮风象征变化即将到来。春风和煦，主运势向好，万事顺意；狂风暴风，则提醒近期有变动或波折，需做好准备。梦见逆风而行，预示你将凭借毅力克服困难。梦见微风吹拂，主心情愉悦，人际关系和谐。", auspice:"平", related:["风暴","雨","云","天"] },
  { kw:"山", cat:"自然", interp:"梦见高山象征目标和理想。登高望远，主事业步步高升，前程远大；望山兴叹，则暗示目标过于遥远，需脚踏实地。梦见从山上跌下，提醒做事需谨慎，切忌好高骛远。梦见山清水秀，主吉。", auspice:"吉", related:["攀登","悬崖","路","土地"] },
  { kw:"月亮", cat:"自然", interp:"梦见月亮象征温柔、思念与女性缘。满月当空，主家庭和睦、感情圆满；新月如钩，主新的开始，单身者有望遇到心仪之人。梦见水中映月，提示美好的事物可能只是幻影，需脚踏实地。梦见月光皎洁，主心情宁静。", auspice:"吉", related:["星星","夜晚","太阳","光"] },
  { kw:"太阳", cat:"自然", interp:"梦见太阳是大吉之兆。旭日东升，主事业蒸蒸日上，前程一片光明；阳光普照，主好运连连，万事如意。梦见烈日炎炎，提醒注意身体健康，切勿过度劳累。梦见日落西山，提示需珍惜当下，把握时机。", auspice:"吉", related:["月亮","光","天","火"] },
  { kw:"星星", cat:"自然", interp:"梦见满天星辰，主希望和好运。星光灿烂，预示你的努力即将得到回报，愿望将会实现。梦见流星划过，是许愿的好时机，心中所想之事有望成真。梦见星星坠落，提示可能会有小的遗憾或失落，但不必过于担心。", auspice:"吉", related:["月亮","夜晚","天","光"] },
  { kw:"火", cat:"自然", interp:"梦见火具有双重含义。温和的火焰代表热情和创造力，主事业兴旺；熊熊大火则警示情绪过激或可能与人发生激烈冲突。梦见房屋着火，提醒注意家庭关系；梦见灭火成功，主能化险为夷。", auspice:"平", related:["烟","火山","蜡烛","光"] },
  { kw:"蛇", cat:"动物", interp:"梦见蛇是最常见的梦境之一。蛇象征智慧、转变与潜在的威胁。被蛇追赶，提示你正在逃避某个问题或内心有未解决的压力；梦见白蛇为吉兆，主财运亨通；梦见打死蛇，主能克服困难战胜对手；梦见蛇缠身，需注意健康或小人。", auspice:"凶", related:["龙","虫","爬行动物","恐惧"] },
  { kw:"龙", cat:"动物", interp:"梦见龙是大吉之梦。龙在中华文化中象征权威、力量和好运。梦见飞龙在天，主事业将飞黄腾达，前程无限；梦见乘龙飞翔，主将有贵人提携，平步青云；孕妇梦见龙，预示将生贵子。此梦大吉。", auspice:"吉", related:["蛇","凤凰","天","飞行"] },
  { kw:"鱼", cat:"动物", interp:"梦见鱼是吉兆，象征财富和机遇。鱼在水中游，主财运旺盛，有意外之财；梦见抓到大鱼，主事业上将有重大收获；梦见鱼跃龙门，主地位提升，将有升职之喜。梦见死鱼则需注意理财，防止破财。", auspice:"吉", related:["水","海洋","渔网","河"] },
  { kw:"狗", cat:"动物", interp:"梦见狗象征忠诚和友情。友善的狗向你摇尾巴，主有贵人相助，朋友可靠；梦见被狗追咬，提示小心身边的人，可能有口舌之争；梦见和狗玩耍，主人际关系和谐。梦见黑狗，提醒注意防范小人。", auspice:"平", related:["猫","宠物","狼","守护"] },
  { kw:"猫", cat:"动物", interp:"梦见猫含义多变。温顺的猫象征女性的直觉和独立；梦见猫抓老鼠，主能识破小人诡计；梦见黑猫，传统认为需小心行事，可能有人背后议论；梦见猫叫春，提示注意情感纠葛。猫也有招财之意。", auspice:"平", related:["狗","老虎","宠物","老鼠"] },
  { kw:"老虎", cat:"动物", interp:"梦见老虎象征权威和挑战。老虎威风凛凛，主事业上遇到强劲对手，但只要勇敢面对便能克服；梦见骑虎难下，提示你可能陷入进退两难的境地；梦见虎啸山林，主声名远扬。梦见被虎追，需注意职场竞争。", auspice:"凶", related:["狮子","狼","豹","猫"] },
  { kw:"马", cat:"动物", interp:"梦见马象征活力与自由。骏马奔腾，主事业顺利，精力充沛；梦见骑马驰骋，主将有远行或事业上大展宏图；梦见白马尤为吉利，主贵人相助；梦见马受伤，提醒注意身体健康和出行安全。", auspice:"吉", related:["牛","羊","奔跑","草原"] },
  { kw:"鸟", cat:"动物", interp:"梦见鸟儿象征自由和希望。鸟儿高飞，主志向高远，前途光明；梦见笼中鸟，提示你可能感觉受到束缚，渴望自由；梦见鸟语花香，主生活美满，心情愉悦。群鸟飞翔，主有好消息将至。", auspice:"吉", related:["鹰","凤凰","飞行","翅膀"] },
  { kw:"蜘蛛", cat:"动物", interp:"梦见蜘蛛象征耐心和创造力。蜘蛛织网，主你正在为自己的目标稳步努力，好事多磨，终将成功；梦见蜘蛛从网上垂下，在传统文化中主"喜从天降"，有意外之喜；梦见被蜘蛛咬，提示小心身边的小人。", auspice:"平", related:["虫子","网","蚂蚁","昆虫"] },
  { kw:"老鼠", cat:"动物", interp:"梦见老鼠需多加留意。老鼠象征小偷、小人和琐碎的烦恼。梦见老鼠偷吃东西，提示可能有财产损失或被人占便宜；梦见打老鼠，主能识破并解决身边的小麻烦；梦见白鼠，则主有小财运。", auspice:"凶", related:["猫","蛇","虫子","偷窃"] },
  { kw:"死亡", cat:"人物", interp:"梦见死亡不必恐惧，在解梦学中死亡往往象征新生和转变。梦见自己死亡，主即将迎来人生的新阶段，旧的烦恼将会过去；梦见亲人去世，反而代表你与亲人关系将更加亲密，或该亲人将长寿；梦见陌生人死亡，主近期烦恼将消散。", auspice:"吉", related:["鬼","丧事","重生","结束"] },
  { kw:"鬼", cat:"人物", interp:"梦见鬼魂通常反映内心的恐惧和未解决的心理问题。被鬼追逐，提示你正在逃避现实中的压力；梦见与鬼交谈，主将获得重要的启示或消息；梦见驱鬼成功，主能克服心理障碍，战胜困难。鬼梦多与心理压力有关。", auspice:"凶", related:["死亡","恐惧","黑暗","阴影"] },
  { kw:"婴儿", cat:"人物", interp:"梦见婴儿是吉兆，象征新的开始和希望。梦见可爱的婴儿，主将有喜事临门，项目或计划将有好的开端；梦见自己抱着婴儿，主责任感增强，将有好的收获；梦见婴儿哭泣，提醒关注身边需要帮助的人。孕妇梦婴儿，最为吉利。", auspice:"吉", related:["孩子","怀孕","出生","母亲"] },
  { kw:"结婚", cat:"人物", interp:"梦见结婚含义丰富。未婚者梦见结婚，主将有好的姻缘或喜事将近；已婚者梦见再次结婚，主婚姻美满，感情升温；梦见参加他人婚礼，主将分享他人的喜悦，有好事接连发生。梦见婚礼混乱，则需注意沟通。", auspice:"吉", related:["新娘","新郎","婚礼","爱情"] },
  { kw:"吵架", cat:"人物", interp:"梦见与人吵架，在解梦学中反而是吉兆，主矛盾即将化解。梦境中的争吵代表着内心压力的释放。梦见与家人吵架，提示家庭关系需要更多沟通；梦见与陌生人争吵，主将遇到贵人，不打不相识。", auspice:"平", related:["打架","冲突","和解","生气"] },
  { kw:"老师", cat:"人物", interp:"梦见老师象征指导和智慧。梦见以前的老师，主将获得重要的建议或启示，近期会遇到贵人指点；梦见被老师批评，提示自我反省，某些方面需要改进；梦见自己成为老师，主你的能力得到认可，将有领导或教导他人的机会。", auspice:"吉", related:["学校","考试","学习","知识"] },
  { kw:"医生", cat:"人物", interp:"梦见医生与健康和治愈有关。梦见看病，提示你需要关注自己的身体健康或心理状态；梦见自己是医生，主你有能力帮助他人，也将获得他人帮助；梦见手术，主旧的问题将被彻底解决。梦见医院，注意休息。", auspice:"平", related:["医院","药物","生病","健康"] },
  { kw:"朋友", cat:"人物", interp:"梦见朋友代表你的人际关系和社会支持。与老朋友相聚，主近期将有好消息或故人重逢；梦见朋友哭泣，提示朋友可能需要你的帮助；梦见与朋友争吵，人际关系方面需要注意沟通；梦见结交新朋友，主社交圈将扩大。", auspice:"吉", related:["聚会","同学","社交","聊天"] },
  { kw:"名人", cat:"人物", interp:"梦见名人或明星，反映你对成功和被认可的渴望。与名人交谈，主你内心有未被开发的潜力；梦见成为名人，主自信心提升，事业有望获得成就。此梦提醒你相信自己，每个人都有闪光点。", auspice:"平", related:["明星","偶像","成功","追星"] },
  { kw:"牙齿", cat:"身体", interp:"梦见牙齿脱落是最常见的梦境之一。传统解梦认为，牙齿掉落可能代表对衰老或失去某种能力的焦虑；上牙掉落提示可能担心长辈健康；下牙掉落可能担心晚辈。梦见牙齿松动，主近期压力较大；补牙则主问题将得到解决。", auspice:"凶", related:["嘴巴","疼痛","脱落","出血"] },
  { kw:"头发", cat:"身体", interp:"梦见头发象征力量和生命力。头发浓密乌黑，主精力充沛，运势旺盛；梦见掉头发，提示近期压力过大，需注意休息和健康；梦见剪头发，主将斩断烦恼，重新开始；梦见白发，如果是长者则主长寿，年轻人则提醒注意劳逸结合。", auspice:"平", related:["牙齿","脱落","美容","变化"] },
  { kw:"飞", cat:"身体", interp:"梦见自己会飞，是极为常见的梦境之一，象征对自由的渴望和超越现实的能力。飞翔中感觉愉快，主你对生活充满信心，事业将有突破；飞行中感到恐惧或无法控制方向，提示你可能对未来感到迷茫。梦见翅膀，主获得新的能力或机会。", auspice:"吉", related:["鸟","天空","翅膀","坠落"] },
  { kw:"坠落", cat:"身体", interp:"梦见从高处坠落是非常普遍的梦境。通常发生在入睡阶段，是身体放松的正常反应。心理上，坠落梦暗示你对某事感到失控或缺乏安全感。梦见坠落但安全着陆，提示你终将化险为夷；梦见不断下坠，近期需注意决策。", auspice:"凶", related:["飞","高","悬崖","恐惧"] },
  { kw:"裸体", cat:"身体", interp:"梦见自己裸体出现在公共场合，并非表面含义。这通常反映内心的脆弱感或害怕暴露自己的弱点。如果在梦中感到坦然，说明你足够自信；若感到羞耻，则提示你近期对某些事情过于敏感。此梦也象征真实和坦诚。", auspice:"平", related:["衣服","羞耻","暴露","身体"] },
  { kw:"伤口", cat:"身体", interp:"梦见身体受伤或流血，在解梦学中有时是吉兆。梦见流血，主烦恼将随血流出而消散，运势将好转；梦见伤口愈合，主旧的创伤将被修复；梦见他人受伤，提示关心身边人的状况。但若反复梦见受伤，需注意身体健康。", auspice:"平", related:["血液","疼痛","医院","愈合"] },
  { kw:"眼睛", cat:"身体", interp:"梦见眼睛象征洞察力和直觉。眼睛明亮有神，主你将看清事物的本质，做出正确判断；梦见眼睛模糊或失明，提示可能忽略了一些重要细节，需保持警惕；梦见第三只眼，主直觉能力提升。", auspice:"平", related:["视力","失明","观察","表情"] },
  { kw:"钱", cat:"物品", interp:"梦见钱与自我价值和财富有关。梦见捡到钱，主近期将有意外之财运或获得认可；梦见数钱，主财富积累；梦见丢钱，提示注意理财，但不必过度担忧；梦见给别人钱，主你将收获人情和福报。梦见假币，提醒辨别真假。", auspice:"吉", related:["金子","财富","硬币","银行"] },
  { kw:"金子", cat:"物品", interp:"梦见金子是大吉之兆。黄金象征财富、尊贵和成功。梦见捡到金子，主将有意外之财或事业上获得重要机会；梦见拥有很多金子，主富贵之象，前程远大；梦见丢失金子，提醒珍惜眼前的机会和财富。", auspice:"吉", related:["钱","珠宝","财富","银"] },
  { kw:"手机", cat:"物品", interp:"梦见手机象征沟通和社交。梦见手机丢失或损坏，提示你担心与外界失去联系，或现实中社交关系需要维护；梦见接到重要电话，主将有重要消息传来；梦见手机无法使用，提醒你适当放下手机，关注现实交流。", auspice:"平", related:["电脑","网络","通讯","丢失"] },
  { kw:"车", cat:"物品", interp:"梦见车象征人生方向和掌控力。自己开车行驶平稳，主你对自己的人生有把握，事业顺利；梦见车失控，提示你可能对生活缺乏掌控，需要注意决策；梦见新车，主新的机遇或阶段即将到来；梦见车祸，提醒出行注意安全。", auspice:"平", related:["路","驾驶","旅行","速度"] },
  { kw:"钥匙", cat:"物品", interp:"梦见钥匙是吉兆，象征机会和解法。找到钥匙，主困扰已久的问题将找到解决方法；梦见丢失钥匙，提示可能错过了重要机会；梦见很多钥匙，主你将面临多种选择。钥匙也代表开启新生活的大门。", auspice:"吉", related:["锁","门","机会","开启"] },
  { kw:"书", cat:"物品", interp:"梦见书象征知识和智慧。读一本好书，主你将获得有价值的见解或信息；梦见图书馆或书店，主求学之路顺畅，考试顺利；梦见合上书本，提示学以致用的时候到了；梦见书破损，提醒不要荒废学业。", auspice:"吉", related:["学习","考试","知识","图书馆"] },
  { kw:"衣服", cat:"物品", interp:"梦见衣服象征身份和外在形象。穿新衣，主新的开始，社会地位可能提升；梦见衣服破旧或脏污，提示注意自己的形象和声誉；梦见找不到合适的衣服，可能暗示你在某方面缺乏自信。换装代表角色的转变。", auspice:"平", related:["裸体","美容","形象","变化"] },
  { kw:"镜子", cat:"物品", interp:"梦见镜子象征自我认识和反思。镜中影像清晰美丽，主你对自己有清醒的认识和自信；镜子破裂，传统认为可能有不吉之事，实际更多提示需要修复自我认知；梦见照镜子，提醒自我反省和内省。", auspice:"平", related:["玻璃","破碎","自我","映像"] },
  { kw:"桥", cat:"物品", interp:"梦见桥象征转变和过渡。走过一座稳固的桥，主你将顺利度过人生的转折期；梦见桥断裂或摇晃，提示前方的路可能有阻碍，需谨慎前行；梦见修建桥梁，主你将自己创造机会和条件。", auspice:"平", related:["路","河","过渡","连接"] },
  { kw:"食物", cat:"物品", interp:"梦见食物象征滋养和满足。享用美味食物，主生活富足，物质和精神上都能得到满足；梦见食物变质或不够吃，提示可能有匮乏感或对现状不满足；梦见分享食物，主人际关系和谐，福报将至。", auspice:"吉", related:["水果","饥饿","做饭","宴会"] },
  { kw:"刀", cat:"物品", interp:"梦见刀具有双重含义。刀可伤人也可自卫。梦见持刀，主你拥有保护自己的力量；梦见被刀伤，提示注意人际关系中的伤害；梦见刀折断，主矛盾即将化解；梦见磨刀，主你在准备面对挑战。", auspice:"凶", related:["剑","武器","伤害","锋利"] },
  { kw:"考试", cat:"场景", interp:"梦见考试是最常见的焦虑梦之一。即使离开学校多年，人们仍会梦见考试。裸考或准备不足，反映现实中的压力和对某个挑战的焦虑；梦见考试迟到，提示你担心错失机会；梦见考试得高分，主你实际能力足以应对挑战。", auspice:"平", related:["学校","学习","迟到","焦虑"] },
  { kw:"学校", cat:"场景", interp:"梦见回到学校象征学习和成长。在学校上课，主你即将面临新的学习或考验；梦见找不到教室或课表，提示当下有些迷茫；梦见毕业，主一个阶段即将圆满结束，新的旅程即将开始。", auspice:"平", related:["考试","老师","教室","学习"] },
  { kw:"家", cat:"场景", interp:"梦见家是最温馨的梦。梦见回到童年时的家，主你怀念过去，内心渴望安全感；梦见家被破坏或房子有问题，提示关注家庭关系或居住环境；梦见搬家或新房，主生活将有新的变化，多是向好的一面发展。", auspice:"吉", related:["房子","家人","安全","归属"] },
  { kw:"路", cat:"场景", interp:"梦见路象征人生道路。宽阔平坦的大路，主前程顺利，前途光明；曲折狭窄的小路，提示前路可能有困难，需坚持；岔路口，主你正面临重要选择，需慎重决策；梦见迷路，提示近期可能有些迷茫。", auspice:"平", related:["桥","旅行","地图","车"] },
  { kw:"厕所", cat:"场景", interp:"梦见找厕所是非常普遍的梦境，通常与生理需求相关。梦见找不到厕所或厕所太脏，反映你可能在某些方面感到不便或需要释放压力；梦见干净的厕所，主烦恼将被清理；梦见随地大小便，提示压抑的情感需要表达。", auspice:"平", related:["排泄","清洁","寻找","麻烦"] },
  { kw:"电梯", cat:"场景", interp:"梦见电梯象征地位的升降和情绪的起伏。电梯上升，主事业攀升，心情愉悦；电梯急速下降，提示你担心地位下降或情绪低落；电梯故障或卡住，主你可能在某个困境中感到进退两难。走走楼梯也许更稳妥。", auspice:"平", related:["楼梯","楼","上升","坠落"] },

(function createStars() {
  const container = document.getElementById('starsContainer');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 120; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 3 + 1;
    star.style.cssText = [
      `left:${Math.random()*100}%`,
      `top:${Math.random()*100}%`,
      `width:${size}px`,
      `height:${size}px`,
      `--dur:${Math.random()*3+2}s`,
      `animation-delay:${Math.random()*5}s`
    ].join(';');
    frag.appendChild(star);
  }
  container.appendChild(frag);
})();
const categories = ["全部","自然","动物","人物","身体","物品","场景","情感","事件"];
let activeCategory = "全部";
let lastSearchResult = null;
let lastInterpret = "";
(function renderTabs() {
  const container = document.getElementById('categoryTabs');
  container.innerHTML = categories.map(cat =>
    `<span class="tab${cat===activeCategory?' active':''}" data-cat="${cat}" onclick="selectCategory('${cat}')">${cat}</span>`
  ).join('');
})();
function selectCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
  filterDreams();
}
function filterDreams() {
  const keyword = (document.getElementById('searchInput')?.value || '').trim();
  let filtered = dreams;
  if (activeCategory !== '全部') {
    filtered = filtered.filter(d => d.cat === activeCategory);
  }
  if (keyword) {
    const kw = keyword.toLowerCase();
    filtered = filtered.filter(d => d.kw.includes(kw) || d.interp.includes(kw) || d.cat.includes(kw));
  }
  return filtered;
}
function renderDreams(dreamList) {
  const container = document.getElementById('resultsContainer');
  if (!dreamList || dreamList.length === 0) {
    container.innerHTML = `<div class="no-results"><span class="icon">&#128564;</span><p>未找到相关梦境解析，换个关键词试试吧~</p></div>`;
    return;
  }
  container.innerHTML = dreamList.map(d => {
    const auspiceClass = `badge-${d.auspice}`;
    const catEmoji = {
      '自然':'&#127758;', '动物':'&#128062;', '人物':'&#128101;', '身体':'&#129504;',
      '物品':'&#128230;', '场景':'&#127963;', '情感':'&#128150;', '事件':'&#128073;'
    };
    return `
    <div class="card" id="dream-${d.kw}">
      <div class="card-header">
        <span class="card-keyword">${catEmoji[d.cat] || ''} ${d.kw}</span>
        <span class="badge ${auspiceClass}">${d.auspice==='吉'?'&#9989; 吉':d.auspice==='凶'?'&#9888; 凶':'&#9644; 平'}</span>
      </div>
      <div class="card-interpretation">${d.interp}</div>
      <div class="card-category">分类：${d.cat}</div>
      ${d.related && d.related.length > 0 ? `
      <div class="related-dreams">
        <div class="related-label">&#128279; 相关梦境：</div>
        <div class="related-tags">
          ${d.related.map(r => `<span class="related-tag" onclick="searchRelated('${r}')">${r}</span>`).join('')}
        </div>
      </div>` : ''}
    </div>`;
  }).join('');
  if (dreamList.length === 1) {
    lastInterpret = dreamList[0].kw;
  }
}
function handleSearch() {
  const filtered = filterDreams();
  lastSearchResult = filtered;
  renderDreams(filtered);
}
function searchRelated(keyword) {
  document.getElementById('searchInput').value = keyword;
  activeCategory = '全部';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === '全部'));
  handleSearch();
  document.getElementById('resultsContainer').scrollIntoView({ behavior: 'smooth' });
}
function shareInterpretation() {
  const kw = document.getElementById('searchInput').value.trim();
  if (!kw && !lastInterpret) {
    showToast('请先搜索一个梦境关键词再分享');
    return;
  }
  const shareKW = kw || lastInterpret;
  const shareText = `我在「周公解梦」上查了"${shareKW}"的梦境解析，来看看你的梦代表什么吧！`;
  if (navigator.share) {
    navigator.share({ title: '周公解梦', text: shareText, url: window.location.href })
      .catch(() => copyShareLink(shareText));
  } else {
    copyShareLink(shareText);
  }
}
function copyShareLink(text) {
  navigator.clipboard.writeText(text + ' ' + window.location.href).then(() => {
    const el = document.getElementById('shareToast');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  });
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
function saveDream() {
  const note = document.getElementById('journalNote').value.trim();
  if (!note) { showToast('请先写下你的梦境内容'); return; }
  const journal = JSON.parse(localStorage.getItem('dreamJournal') || '[]');
  journal.unshift({ date: new Date().toISOString().slice(0, 16).replace('T', ' '), note, id: Date.now() });
  localStorage.setItem('dreamJournal', JSON.stringify(journal));
  document.getElementById('journalNote').value = '';
  renderJournal();
  renderStats();
  showToast('梦境已保存 &#127769;');
}
function deleteDreamEntry(id) {
  let journal = JSON.parse(localStorage.getItem('dreamJournal') || '[]');
  journal = journal.filter(e => e.id !== id);
  localStorage.setItem('dreamJournal', JSON.stringify(journal));
  renderJournal();
  renderStats();
  showToast('记录已删除');
}
function clearJournal() {
  if (confirm('确定要清空所有梦境记录吗？此操作不可撤销。')) {
    localStorage.removeItem('dreamJournal');
    renderJournal();
    renderStats();
    showToast('所有记录已清空');
  }
}
function renderJournal() {
  const journal = JSON.parse(localStorage.getItem('dreamJournal') || '[]');
  const container = document.getElementById('journalEntries');
  if (journal.length === 0) {
    container.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem;text-align:center;padding:10px;">还没有记录，写下你的第一个梦吧~</p>';
    return;
  }
  container.innerHTML = journal.slice(0, 30).map(e => `
    <div class="journal-entry">
      <div class="entry-date">&#128197; ${e.date}</div>
      <div class="entry-note">${escapeHtml(e.note)}</div>
      <div class="entry-actions">
        <button onclick="deleteDreamEntry(${e.id})">&#10060; 删除</button>
      </div>
    </div>
  `).join('');
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function renderStats() {
  const journal = JSON.parse(localStorage.getItem('dreamJournal') || '[]');
  const container = document.getElementById('statBars');
  if (journal.length === 0) {
    container.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem;">保存一些梦境后，这里会显示统计信息</p>';
    return;
  }
  const counts = {};
  dreams.forEach(d => { counts[d.kw] = 0; });
  journal.forEach(entry => {
    dreams.forEach(d => {
      if (entry.note.includes(d.kw)) counts[d.kw]++;
    });
  });
  const catCounts = {};
  categories.filter(c => c !== '全部').forEach(c => { catCounts[c] = 0; });
  journal.forEach(entry => {
    dreams.forEach(d => {
      if (entry.note.includes(d.kw)) catCounts[d.cat] = (catCounts[d.cat] || 0) + 1;
    });
  });
  const topKeywords = Object.entries(counts)
    .filter(([,v]) => v > 0)
    .sort(([,a], [,b]) => b - a)
    .slice(0, 8);
  const topCategories = Object.entries(catCounts)
    .filter(([,v]) => v > 0)
    .sort(([,a], [,b]) => b - a)
    .slice(0, 5);
  if (topKeywords.length === 0 && topCategories.length === 0) {
    container.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem;">继续记录梦境，这里会出现你最常梦到的主题</p>';
    return;
  }
  const maxKw = topKeywords[0]?.[1] || 1;
  const maxCat = topCategories[0]?.[1] || 1;
  let html = '';
  if (topKeywords.length > 0) {
    html += '<p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:10px;">最常见的关键词</p>';
    html += topKeywords.map(([kw, cnt]) => {
      const pct = Math.round((cnt / maxKw) * 100);
      const colors = ['#7c6ff7','#a78bfa','#c4b5fd','#8b5cf6','#6366f1','#818cf8','#a5b4fc','#c7d2fe'];
      const color = colors[topKeywords.indexOf([kw, cnt]) % colors.length];
      return `<div class="stat-bar-item">
        <span class="stat-bar-label">${kw}</span>
        <span class="stat-bar-track"><span class="stat-bar-fill" style="width:${pct}%;background:${color};"></span></span>
        <span class="stat-bar-count">${cnt}</span>
      </div>`;
    }).join('');
  }
  html += '<div style="margin-top:16px;"></div>';
  if (topCategories.length > 0) {
    html += '<p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:10px;">最常见的分类</p>';
    html += topCategories.map(([cat, cnt]) => {
      const pct = Math.round((cnt / maxCat) * 100);
      return `<div class="stat-bar-item">
        <span class="stat-bar-label">${cat}</span>
        <span class="stat-bar-track"><span class="stat-bar-fill" style="width:${pct}%;background:var(--gold);"></span></span>
        <span class="stat-bar-count">${cnt}</span>
      </div>`;
    }).join('');
  }
  container.innerHTML = html;
}
function showRandomInsight() {
  const randomDream = dreams[Math.floor(Math.random() * dreams.length)];
  const auspiceEmoji = randomDream.auspice === '吉' ? '&#128522;' : randomDream.auspice === '凶' ? '&#128560;' : '&#128528;';
  const el = document.getElementById('randomInsight');
  const catEmoji = {
    '自然':'&#127758;', '动物':'&#128062;', '人物':'&#128101;', '身体':'&#129504;',
    '物品':'&#128230;', '场景':'&#127963;', '情感':'&#128150;', '事件':'&#128073;'
  };
  el.innerHTML = `
    <p style="font-size:2rem;margin-bottom:8px;">${catEmoji[randomDream.cat] || ''}</p>
    <p class="insight-kw" style="font-size:1.3rem;">${randomDream.kw}</p>
    <p style="margin-top:8px;line-height:1.8;">${randomDream.interp}</p>
    <p style="margin-top:8px;font-size:0.85rem;color:var(--text-muted);">${auspiceEmoji} 吉凶：${randomDream.auspice} | 分类：${randomDream.cat}</p>
  `;
  lastInterpret = randomDream.kw;
}
handleSearch();
renderJournal();
renderStats();
showRandomInsight();
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleSearch();
});
</script>
