<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文表情问答</title>
<meta name="description" content="中文Emoji表情问答，用表情符号猜中文词语">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent-hover:#2563eb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8rem;margin:20px 0 8px}
.sub{color:#8b949e;margin-bottom:24px;font-size:0.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:640px;margin-bottom:16px}
.score-bar{display:flex;justify-content:space-around;text-align:center;margin-bottom:20px}
.score-item .num{font-size:1.8rem;font-weight:bold}
.score-item .label{font-size:0.8rem;color:#8b949e}
.quiz-emoji{font-size:4rem;text-align:center;margin:20px 0;letter-spacing:8px;line-height:1.4}
.options{display:flex;flex-direction:column;gap:10px}
.option-btn{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 18px;font-size:1rem;color:var(--text);cursor:pointer;text-align:left;transition:all .2s}
.option-btn:hover:not(.disabled){border-color:var(--accent);background:rgba(59,130,246,0.1)}
.option-btn.correct{border-color:#238636;background:rgba(35,134,54,0.15);color:#3fb950}
.option-btn.wrong{border-color:#da3633;background:rgba(218,54,51,0.15);color:#f85149}
.option-btn.disabled{cursor:default;opacity:0.7}
.feedback{margin-top:16px;padding:14px;border-radius:8px;font-size:0.95rem;display:none}
.feedback.show{display:block}
.feedback.correct-fb{background:rgba(35,134,54,0.1);border:1px solid #238636;color:#3fb950}
.feedback.wrong-fb{background:rgba(218,54,51,0.1);border:1px solid #da3633;color:#f85149}
.btn-row{display:flex;gap:10px;margin-top:14px;justify-content:center}
button{padding:10px 20px;border:none;border-radius:8px;font-size:0.95rem;cursor:pointer;font-weight:500;transition:background .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--border);color:var(--text)}.btn-secondary:hover{background:#444c56}
.progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:20px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);transition:width .3s;border-radius:2px}
.start-screen{text-align:center;padding:40px 20px}
.start-screen h2{font-size:1.4rem;margin-bottom:10px}
.start-screen p{color:#8b949e;margin-bottom:20px;line-height:1.6}
.result-screen{text-align:center;padding:30px 20px}
.result-screen .big-score{font-size:3rem;font-weight:bold;margin:10px 0}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:10px 24px;border-radius:8px;font-size:0.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<h1>中文表情问答</h1>
<p class="sub">看表情猜成语/短语</p>
<div class="card" id="startCard">
<div class="start-screen">
<h2>🧩 表情猜成语</h2>
<p>看一组表情，猜猜对应的成语或短语是什么。<br>每题4个选项，答对加分，答错扣分。<br>总共10题，看看你能拿多少分！</p>
<button class="btn-primary" onclick="startQuiz()">开始挑战</button>
</div>
</div>
<div class="card" id="quizCard" style="display:none">
<div class="score-bar">
<div class="score-item"><div class="num" id="scoreNum">0</div><div class="label">得分</div></div>
<div class="score-item"><div class="num" id="questionNum">1/10</div><div class="label">进度</div></div>
<div class="score-item"><div class="num" id="comboNum">0</div><div class="label">连对</div></div>
</div>
<div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
<div class="quiz-emoji" id="quizEmoji"></div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<div class="btn-row" id="nextBtnRow" style="display:none">
<button class="btn-primary" onclick="nextQuestion()">下一题</button>
</div>
</div>
<div class="card" id="resultCard" style="display:none">
<div class="result-screen">
<h2>🎉 挑战完成！</h2>
<div class="big-score" id="finalScore">0</div>
<div style="color:#8b949e;margin-bottom:10px" id="finalMsg"></div>
<div style="margin-bottom:20px">
<span style="font-size:1.2rem" id="starDisplay"></span>
</div>
<button class="btn-primary" onclick="startQuiz()">再来一局</button>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const QUIZZES=[
{emoji:'🐴➡️🎊',answer:'马到成功',options:['马到成功','龙马精神','一马当先','万马奔腾']},
{emoji:'🐟💧',answer:'如鱼得水',options:['浑水摸鱼','如鱼得水','水到渠成','鱼目混珠']},
{emoji:'🐂🌸🌙',answer:'牛郎织女',options:['对牛弹琴','牛郎织女','九牛一毛','庖丁解牛']},
{emoji:'🐔🌅舞',answer:'闻鸡起舞',options:['鸡飞狗跳','闻鸡起舞','鹤立鸡群','杀鸡儆猴']},
{emoji:'🐉🏊',answer:'龙腾四海',options:['龙飞凤舞','龙腾四海','画龙点睛','叶公好龙']},
{emoji:'🐰🏔️',answer:'动如脱兔',options:['兔死狐悲','动如脱兔','守株待兔','狡兔三窟']},
{emoji:'🌸❄️🌙',answer:'花好月圆',options:['花前月下','花好月圆','春暖花开','走马观花']},
{emoji:'🐺心💔',answer:'狼心狗肺',options:['狼狈为奸','狼心狗肺','引狼入室','杯盘狼藉']},
{emoji:'🐷🍺',answer:'猪狗不如',options:['猪狗不如','猪朋狗友','猪突豨勇','牧猪奴戏']},
{emoji:'🐯📦',answer:'狐假虎威',options:['虎头蛇尾','狐假虎威','如虎添翼','三人成虎']},
{emoji:'🐵👀',answer:'猴年马月',options:['猴年马月','心猿意马','杀鸡儆猴','朝三暮四']},
{emoji:'🐔💎',answer:'鹤立鸡群',options:['鸡飞蛋打','鹤立鸡群','鸡鸣狗盗','闻鸡起舞']},
{emoji:'🐟📚',answer:'临渊羡鱼',options:['如鱼得水','临渊羡鱼','缘木求鱼','浑水摸鱼']},
{emoji:'🐎🌅',answer:'白驹过隙',options:['马到成功','白驹过隙','天马行空','悬崖勒马']},
{emoji:'🦁🧘',answer:'狮子搏兔',options:['狮子搏兔','河东狮吼','狮虎争霸','群雄逐鹿']},
{emoji:'🐼🌸',answer:'憨态可掬',options:['憨态可掬','黑白分明','竹报平安','国色天香']},
{emoji:'🐉⚡',answer:'龙飞凤舞',options:['龙腾虎跃','龙飞凤舞','龙凤呈祥','生龙活虎']},
{emoji:'🐟💧🌙',answer:'沉鱼落雁',options:['沉鱼落雁','如鱼得水','鱼跃龙门','水落石出']},
{emoji:'🐴🎵',answer:'对牛弹琴',options:['马到成功','对牛弹琴','鸡同鸭讲','牛头马面']},
{emoji:'🐍👣',answer:'画蛇添足',options:['画蛇添足','杯弓蛇影','打草惊蛇','虎头蛇尾']},
{emoji:'🐑🌙',answer:'亡羊补牢',options:['亡羊补牢','顺手牵羊','羊入虎口','歧路亡羊']},
{emoji:'🐔🌅',answer:'闻鸡起舞',options:['鸡鸣狗盗','闻鸡起舞','雄鸡报晓','金鸡独立']},
{emoji:'🐟🚀',answer:'鱼跃龙门',options:['如鱼得水','鱼跃龙门','沉鱼落雁','浑水摸鱼']},
{emoji:'🐶🌸',answer:'狗尾续貂',options:['狗尾续貂','鸡飞狗跳','狼心狗肺','狐朋狗友']},
{emoji:'🐷☀️',answer:'猪狗不如',options:['猪朋狗友','猪狗不如','猪突豨勇','牧猪奴戏']},
{emoji:'🐴🏔️',answer:'马到成功',options:['马到成功','龙马精神','一马当先','千军万马']},
{emoji:'🐍🌸',answer:'杯弓蛇影',options:['杯弓蛇影','画蛇添足','打草惊蛇','蛇蝎心肠']},
{emoji:'🐟🌸',answer:'沉鱼落雁',options:['沉鱼落雁','如鱼得水','鱼目混珠','缘木求鱼']},
{emoji:'🐂🌙',answer:'九牛一毛',options:['九牛一毛','对牛弹琴','牛郎织女','气壮如牛']},
{emoji:'🐉🌸',answer:'龙凤呈祥',options:['龙凤呈祥','龙飞凤舞','画龙点睛','攀龙附凤']}
];
let currentQuiz=0;
let score=0;
let combo=0;
let maxCombo=0;
let answered=false;
let shuffledQuizzes=[];
function shuffle(arr){
const a=[...arr];
for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
return a;
}
function startQuiz(){
currentQuiz=0;score=0;combo=0;maxCombo=0;answered=false;
shuffledQuizzes=shuffle(QUIZZES).slice(0,10);
document.getElementById('startCard').style.display='none';
document.getElementById('resultCard').style.display='none';
document.getElementById('quizCard').style.display='block';
showQuestion();
}
function showQuestion(){
answered=false;
const q=shuffledQuizzes[currentQuiz];
document.getElementById('quizEmoji').textContent=q.emoji;
document.getElementById('scoreNum').textContent=score;
document.getElementById('questionNum').textContent=`${currentQuiz+1}/10`;
document.getElementById('comboNum').textContent=combo;
document.getElementById('progressBar').style.width=`${(currentQuiz/10)*100}%`;
document.getElementById('feedback').className='feedback';
document.getElementById('feedback').textContent='';
document.getElementById('nextBtnRow').style.display='none';
const opts=shuffle(q.options);
document.getElementById('options').innerHTML=opts.map(o=>
`<button class="option-btn" onclick="checkAnswer('${o}',this)">${o}</button>`
).join('');
}
function checkAnswer(answer,btn){
if(answered)return;
answered=true;
const q=shuffledQuizzes[currentQuiz];
const isCorrect=answer===q.answer;
document.querySelectorAll('.option-btn').forEach(b=>{
b.classList.add('disabled');
if(b.textContent===q.answer)b.classList.add('correct');
});
if(isCorrect){
btn.classList.add('correct');
combo++;
if(combo>maxCombo)maxCombo=combo;
const bonus=combo>=3?5:0;
score+=10+bonus;
showFeedback(true,`正确！${bonus>0?`连对${combo}题，额外+${bonus}分！`:''}`);
}else{
btn.classList.add('wrong');
combo=0;
showFeedback(false,`答案是：${q.answer}`);
}
document.getElementById('scoreNum').textContent=score;
document.getElementById('comboNum').textContent=combo;
document.getElementById('nextBtnRow').style.display='flex';
}
function showFeedback(correct,msg){
const fb=document.getElementById('feedback');
fb.className=`feedback show ${correct?'correct-fb':'wrong-fb'}`;
fb.textContent=msg;
}
function nextQuestion(){
currentQuiz++;
if(currentQuiz>=10){
showResult();
}else{
showQuestion();
}
}
function showResult(){
document.getElementById('quizCard').style.display='none';
document.getElementById('resultCard').style.display='block';
document.getElementById('finalScore').textContent=score;
const stars=score>=90?'⭐⭐⭐⭐⭐':score>=70?'⭐⭐⭐⭐':score>=50?'⭐⭐⭐':score>=30?'⭐⭐':'⭐';
document.getElementById('starDisplay').textContent=stars;
const msgs={
5:'完美！你是成语大师！🏆',
4:'非常棒！再接再厉！',
3:'不错！还有进步空间！',
2:'加油！多练习就会了！',
1:'继续努力！你可以的！'
};
const starCount=(stars.match(/⭐/g)||[]).length;
document.getElementById('finalMsg').textContent=msgs[starCount]||msgs[1];
}
</script>
<script src="../i18n.js"></script>
</body>
</html>
