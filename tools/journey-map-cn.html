<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="用户旅程地图 - 可视化用户与产品交互的完整体验旅程，识别痛点和机会">
    <meta name="robots" content="index, follow">
    <title>用户旅程地图</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="i18n.js" defer></script>
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #2563eb; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; --hover-color: #f1f3f5; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #60a5fa; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; --hover-color: #3a3a3a; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1300px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        textarea { resize: vertical; min-height: 60px; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 8px; margin-bottom: 8px; }
        button:hover { opacity: 0.9; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-danger { background-color: var(--danger-color); }
        .btn-success { background-color: var(--success-color); }
        .btn-secondary { background-color: var(--secondary-color); }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .grid-2 { display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
        @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
        .journey-map { overflow-x: auto; }
        .journey-table { width: 100%; border-collapse: collapse; min-width: 800px; }
        .journey-table th, .journey-table td { padding: 12px; text-align: center; border: 1px solid var(--border-color); vertical-align: top; }
        .journey-table th { background: var(--card-bg); font-weight: bold; position: sticky; top: 0; }
        .journey-table .row-label { background: var(--card-bg); font-weight: bold; text-align: left; min-width: 120px; }
        .journey-table .phase-header { background: color-mix(in srgb, var(--primary-color) 10%, var(--card-bg)); color: var(--primary-color); font-size: 15px; }
        .journey-cell { min-height: 60px; font-size: 13px; text-align: left; }
        .journey-cell .cell-item { padding: 4px 8px; margin-bottom: 4px; background: var(--bg-color); border-radius: 4px; border: 1px solid var(--border-color); }
        .emotion-curve { position: relative; height: 60px; }
        .emotion-bar { position: absolute; bottom: 0; width: 100%; }
        .touchpoint-list { list-style: none; padding: 0; text-align: left; }
        .touchpoint-list li { padding: 3px 0; font-size: 13px; }
        .phase-list { list-style: none; padding: 0; }
        .phase-item { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 8px; background: var(--bg-color); }
        .phase-item .phase-num { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; flex-shrink: 0; }
        .phase-item .phase-info { flex: 1; }
        .phase-item .phase-info h4 { margin: 0; font-size: 14px; }
        .phase-item .phase-info p { margin: 2px 0 0; font-size: 12px; color: var(--secondary-color); }
        .emotion-select { display: flex; gap: 4px; justify-content: center; }
        .emotion-select span { font-size: 18px; cursor: pointer; opacity: 0.3; transition: 0.2s; }
        .emotion-select span:hover, .emotion-select span.active { opacity: 1; transform: scale(1.3); }
        .journey-list-item { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 8px; background: var(--bg-color); cursor: pointer; }
        .journey-list-item:hover, .journey-list-item.active { border-color: var(--primary-color); }
        .insight-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin: 2px; }
        .insight-tag.pain { background: #fecaca; color: #dc2626; }
        .insight-tag.opportunity { background: #bbf7d0; color: #16a34a; }
        .insight-tag.touchpoint { background: #dbeafe; color: #2563eb; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>用户旅程地图</h1>

        <div class="grid-2">
            <div>
                <div class="card">
                    <h3>操作</h3>
                    <button onclick="createMap()" style="width:100%;">新建旅程地图</button>
                    <button onclick="loadDemo()" class="btn-secondary" style="width:100%;">加载示例</button>
                    <button onclick="exportMap()" class="btn-success btn-sm" style="width:100%;">导出JSON</button>
                </div>

                <div class="card">
                    <h3>地图列表 <span id="mapCount" style="color:var(--secondary-color)">(0)</span></h3>
                    <div id="mapList"></div>
                </div>

                <div class="card" id="phaseEditor" style="display:none;">
                    <h3>阶段管理</h3>
                    <div class="form-group"><label>阶段名称</label><input type="text" id="phaseName" placeholder="如：发现"></div>
                    <div class="form-group"><label>阶段描述</label><input type="text" id="phaseDesc" placeholder="简短描述"></div>
                    <button onclick="addPhase()">+ 添加阶段</button>
                    <div id="phaseList" style="margin-top:12px;"></div>
                </div>
            </div>

            <div>
                <div class="card" id="mapTitle" style="display:none;">
                    <input type="text" id="currentMapName" style="font-size:18px;font-weight:bold;border:none;border-bottom:2px solid var(--primary-color);background:transparent;color:var(--text-color);" oninput="updateMapTitle()">
                    <div id="mapMeta" style="font-size:13px;color:var(--secondary-color);margin-top:4px;"></div>
                </div>

                <div class="card journey-map" id="journeyCanvas" style="display:none;">
                    <table class="journey-table" id="journeyTable"></table>
                </div>

                <div id="emptyState" class="card" style="text-align:center;color:var(--secondary-color);padding:60px;">
                    <p style="font-size:48px;">🗺️</p>
                    <p>选择或创建一个旅程地图</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let journeyMaps = [];
        let activeIdx = -1;

        function toggleTheme() {
            const html = document.documentElement;
            html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
        }

        function createMap() {
            journeyMaps.push({
                name: '新旅程地图',
                phases: ['发现', '考虑', '购买', '使用', '推荐'],
                rows: {
                    actions: ['浏览产品', '对比方案', '下单支付', '使用体验', '分享评价'],
                    thoughts: ['有什么好产品？', '值不值得买？', '支付方便吗？', '好不好用？', '推荐给朋友'],
                    emotions: [3, 3, 2, 4, 5],
                    painpoints: ['找不到', '信息不足', '流程复杂', '操作困难', '不知如何'],
                    opportunities: ['精准推荐', '透明信息', '简化流程', '优化体验', '激励分享'],
                    touchpoints: ['网站/广告', '产品页', '结算页', '产品/App', '社交平台']
                },
                id: Date.now()
            });
            renderMapList();
            selectMap(journeyMaps.length - 1);
        }

        function renderMapList() {
            const el = document.getElementById('mapList');
            document.getElementById('mapCount').textContent = '(' + journeyMaps.length + ')';
            el.innerHTML = journeyMaps.map((m, i) => `
                <div class="journey-list-item ${i===activeIdx?'active':''}" onclick="selectMap(${i})">
                    <div style="flex:1;"><strong style="font-size:14px;">${esc(m.name)}</strong></div>
                    <button class="btn-sm btn-danger" onclick="event.stopPropagation();journeyMaps.splice(${i},1);if(activeIdx===i){activeIdx=-1;hideAll();}renderMapList()">×</button>
                </div>
            `).join('') || '<div style="color:var(--secondary-color);text-align:center;padding:20px;">暂无地图</div>';
        }

        function selectMap(i) {
            activeIdx = i;
            const m = journeyMaps[i];
            document.getElementById('currentMapName').value = m.name;
            document.getElementById('mapMeta').textContent = m.phases.length + ' 个阶段';
            document.getElementById('mapTitle').style.display = 'block';
            document.getElementById('phaseEditor').style.display = 'block';
            document.getElementById('journeyCanvas').style.display = 'block';
            document.getElementById('emptyState').style.display = 'none';
            renderPhaseList();
            renderJourneyTable();
            renderMapList();
        }

        function hideAll() {
            ['mapTitle','phaseEditor','journeyCanvas'].forEach(id => document.getElementById(id).style.display = 'none');
            document.getElementById('emptyState').style.display = 'block';
        }

        function updateMapTitle() {
            if (activeIdx >= 0) {
                journeyMaps[activeIdx].name = document.getElementById('currentMapName').value;
                renderMapList();
            }
        }

        function addPhase() {
            const name = document.getElementById('phaseName').value.trim();
            if (activeIdx < 0 || !name) return;
            const m = journeyMaps[activeIdx];
            m.phases.push(name);
            const keys = ['actions','thoughts','emotions','painpoints','opportunities','touchpoints'];
            keys.forEach(k => {
                if (k === 'emotions') m.rows[k].push(3);
                else m.rows[k].push('');
            });
            document.getElementById('phaseName').value = '';
            document.getElementById('phaseDesc').value = '';
            document.getElementById('mapMeta').textContent = m.phases.length + ' 个阶段';
            renderPhaseList();
            renderJourneyTable();
        }

        function removePhase(i) {
            if (activeIdx < 0) return;
            const m = journeyMaps[activeIdx];
            if (m.phases.length <= 1) { alert('至少需要一个阶段'); return; }
            m.phases.splice(i, 1);
            ['actions','thoughts','emotions','painpoints','opportunities','touchpoints'].forEach(k => m.rows[k].splice(i, 1));
            document.getElementById('mapMeta').textContent = m.phases.length + ' 个阶段';
            renderPhaseList();
            renderJourneyTable();
        }

        function renderPhaseList() {
            if (activeIdx < 0) return;
            const m = journeyMaps[activeIdx];
            document.getElementById('phaseList').innerHTML = m.phases.map((p, i) => `
                <div class="phase-item">
                    <div class="phase-num">${i+1}</div>
                    <div class="phase-info"><h4>${esc(p)}</h4></div>
                    <button class="btn-sm btn-danger" onclick="removePhase(${i})">×</button>
                </div>
            `).join('');
        }

        function renderJourneyTable() {
            if (activeIdx < 0) return;
            const m = journeyMaps[activeIdx];
            const rowLabels = {
                actions: '用户行为', thoughts: '用户想法', emotions: '情绪',
                painpoints: '痛点', opportunities: '机会', touchpoints: '触点'
            };
            const emotionEmoji = ['😢','😟','😐','🙂','😍'];

            let html = '<thead><tr><th></th>';
            m.phases.forEach((p, i) => { html += `<th class="phase-header">${i+1}. ${esc(p)}</th>`; });
            html += '</tr></thead><tbody>';

            Object.entries(rowLabels).forEach(([key, label]) => {
                html += `<tr><td class="row-label">${label}</td>`;
                m.phases.forEach((_, i) => {
                    html += '<td class="journey-cell">';
                    if (key === 'emotions') {
                        html += '<div class="emotion-select">';
                        emotionEmoji.forEach((e, j) => {
                            html += `<span class="${m.rows.emotions[i]===j?'active':''}" onclick="setEmotion(${i},${j})">${e}</span>`;
                        });
                        html += '</div>';
                    } else {
                        html += `<div class="cell-item" contenteditable="true" onblur="updateCell('${key}',${i},this.textContent)">${esc(m.rows[key][i] || '点击编辑...')}</div>`;
                    }
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody>';
            document.getElementById('journeyTable').innerHTML = html;
        }

        function setEmotion(phaseIdx, emotion) {
            if (activeIdx < 0) return;
            journeyMaps[activeIdx].rows.emotions[phaseIdx] = emotion;
            renderJourneyTable();
        }

        function updateCell(key, phaseIdx, value) {
            if (activeIdx < 0) return;
            journeyMaps[activeIdx].rows[key][phaseIdx] = value;
        }

        function exportMap() {
            if (activeIdx < 0) return;
            const blob = new Blob([JSON.stringify(journeyMaps[activeIdx], null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = journeyMaps[activeIdx].name + '.json'; a.click();
            URL.revokeObjectURL(url);
        }

        function loadDemo() {
            journeyMaps = [{
                name: '电商App购物旅程',
                phases: ['认知', '兴趣', '考虑', '购买', '使用', '推荐'],
                rows: {
                    actions: ['看到广告', '下载App', '浏览商品', '加入购物车', '下单支付', '收货使用'],
                    thoughts: ['这个App是什么？', '有什么商品？', '性价比如何？', '要不要买？', '什么时候到？', '值得推荐吗？'],
                    emotions: [2, 3, 3, 4, 2, 4],
                    painpoints: ['广告太泛滥', '搜索不精准', '评价真假难辨', '支付流程长', '物流不透明', '客服响应慢'],
                    opportunities: ['精准投放', '智能推荐', '可信评价体系', '一键下单', '实时物流', 'AI客服'],
                    touchpoints: ['社交媒体', '应用商店', '搜索/推荐', '购物车', '支付页', '物流通知']
                },
                id: 1
            }];
            renderMapList();
            selectMap(0);
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        renderMapList();
    </script>
</body>
</html>
