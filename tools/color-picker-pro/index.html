<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取色器Pro</title>
<meta name="description" content="专业取色器工具，精确拾取屏幕颜色并转换格式">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:600px;margin:0 auto}
h1{font-size:1.5rem;text-align:center;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.picker-area{position:relative;width:100%;aspect-ratio:1.5;border-radius:8px;overflow:hidden;cursor:crosshair;margin-bottom:12px}
.picker-area canvas{width:100%;height:100%}
.preview-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.color-preview{width:60px;height:60px;border-radius:8px;border:2px solid var(--border);flex-shrink:0}
.color-values{flex:1}
.color-value{display:flex;justify-content:space-between;padding:4px 0;font-size:.85rem;font-family:monospace;border-bottom:1px solid var(--border)}
.color-value:last-child{border:none}
.color-value span:first-child{color:var(--muted)}
.copy-btn{padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text);cursor:pointer;font-size:.7rem}
.copy-btn:hover{border-color:var(--accent)}
.slider-group{margin-bottom:12px}
.slider-group label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:4px}
input[type=range]{width:100%;-webkit-appearance:none;height:8px;border-radius:4px;background:var(--border);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #fff}
.history-grid{display:flex;flex-wrap:wrap;gap:6px}
.history-color{width:32px;height:32px;border-radius:6px;border:2px solid var(--border);cursor:pointer;transition:.2s}
.history-color:hover{border-color:var(--accent);transform:scale(1.1)}
.palette-row{display:flex;gap:6px;margin-top:8px}
.palette-swatch{flex:1;height:40px;border-radius:6px;border:1px solid var(--border);cursor:pointer}
.gradient-bar{height:40px;border-radius:8px;margin:8px 0}
.contrast-result{text-align:center;font-size:.85rem;padding:8px;border-radius:6px;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--text);padding:8px 16px;border-radius:8px;font-size:.85rem;opacity:0;transition:.3s;z-index:100}
.toast.show{opacity:1}
.hidden{display:none}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="取色器Pro">
  <meta property="og:description" content="专业取色器工具，精确拾取屏幕颜色并转换格式">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/color-picker-pro/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<h1>🎨 取色器Pro</h1>
<div class="card">
<div class="picker-area" id="pickerArea"><canvas id="pickerCanvas"></canvas></div>
<div class="preview-row">
<div class="color-preview" id="colorPreview"></div>
<div class="color-values">
<div class="color-value"><span>HEX</span><span id="hexVal">#000000</span><button class="copy-btn" onclick="copy('hexVal')">复制</button></div>
<div class="color-value"><span>RGB</span><span id="rgbVal">rgb(0,0,0)</span><button class="copy-btn" onclick="copy('rgbVal')">复制</button></div>
<div class="color-value"><span>HSL</span><span id="hslVal">hsl(0,0%,0%)</span><button class="copy-btn" onclick="copy('hslVal')">复制</button></div>
</div>
</div>
<div class="slider-group"><label><span>色相 H</span><span id="hText">0</span></label><input type="range" min="0" max="360" value="0" id="hSlider" oninput="updateFromSlider()"></div>
<div class="slider-group"><label><span>饱和度 S</span><span id="sText">100%</span></label><input type="range" min="0" max="100" value="100" id="sSlider" oninput="updateFromSlider()"></div>
<div class="slider-group"><label><span>亮度 L</span><span id="lText">50%</span></label><input type="range" min="0" max="100" value="50" id="lSlider" oninput="updateFromSlider()"></div>
</div>
<div class="card">
<h2 style="font-size:.95rem;margin-bottom:8px">配色方案</h2>
<div class="section-label" style="font-size:.8rem;color:var(--muted);margin-bottom:4px">互补色</div>
<div class="palette-row" id="compPalette"></div>
<div class="section-label" style="font-size:.8rem;color:var(--muted);margin-bottom:4px;margin-top:8px">类似色</div>
<div class="palette-row" id="analogPalette"></div>
<div class="section-label" style="font-size:.8rem;color:var(--muted);margin-bottom:4px;margin-top:8px">三色组</div>
<div class="palette-row" id="triadPalette"></div>
</div>
<div class="card">
<h2 style="font-size:.95rem;margin-bottom:8px">渐变生成</h2>
<div class="gradient-bar" id="gradientBar"></div>
<div style="display:flex;gap:8px;margin-bottom:8px">
<button class="copy-btn" style="padding:6px 12px;font-size:.8rem" onclick="copyGradient()">复制 CSS</button>
</div>
</div>
<div class="card">
<h2 style="font-size:.95rem;margin-bottom:8px">对比度检测 (WCAG)</h2>
<div class="contrast-result" id="contrastResult"></div>
</div>
<div class="card">
<h2 style="font-size:.95rem;margin-bottom:8px">颜色历史</h2>
<div class="history-grid" id="historyGrid"></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
let currentH = 0, currentS = 100, currentL = 50;
let history = JSON.parse(localStorage.getItem('color_history') || '[]');
const canvas = document.getElementById('pickerCanvas');
const ctx = canvas.getContext('2d');

function initPicker() {
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  drawSatLight();
  updateColor();
  canvas.addEventListener('mousedown', startPick);
  canvas.addEventListener('mousemove', movePick);
  canvas.addEventListener('mouseup', endPick);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); startPick(e.touches[0]); });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); movePick(e.touches[0]); });
  canvas.addEventListener('touchend', endPick);
}

let picking = false;
function startPick(e) { picking = true; pickColor(e); }
function movePick(e) { if (picking) pickColor(e); }
function endPick() { picking = false; }

function pickColor(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  currentS = Math.round(x * 100);
  currentL = Math.round((1 - y) * 100);
  document.getElementById('sSlider').value = currentS;
  document.getElementById('lSlider').value = currentL;
  updateColor();
}

function drawSatLight() {
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) {
      const s = (x / w) * 100;
      const l = (1 - y / h) * 100;
      ctx.fillStyle = `hsl(${currentH},${s}%,${l}%)`;
      ctx.fillRect(x, y, 1, 1);
    }
  }
}

function hslToRgb(h, s, l) {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}

function rgbToHex(r, g, b) { return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join(''); }

function updateFromSlider() {
  currentH = parseInt(document.getElementById('hSlider').value);
  currentS = parseInt(document.getElementById('sSlider').value);
  currentL = parseInt(document.getElementById('lSlider').value);
  drawSatLight();
  updateColor();
}

function updateColor() {
  const [r, g, b] = hslToRgb(currentH, currentS, currentL);
  const hex = rgbToHex(r, g, b);
  document.getElementById('colorPreview').style.background = hex;
  document.getElementById('hexVal').textContent = hex;
  document.getElementById('rgbVal').textContent = `rgb(${r},${g},${b})`;
  document.getElementById('hslVal').textContent = `hsl(${currentH},${currentS}%,${currentL}%)`;
  document.getElementById('hText').textContent = currentH;
  document.getElementById('sText').textContent = currentS + '%';
  document.getElementById('lText').textContent = currentL + '%';
  updatePalettes();
  updateGradient();
  updateContrast();
  addHistory(hex);
}

function updatePalettes() {
  renderPalette('compPalette', [currentH, (currentH + 180) % 360]);
  renderPalette('analogPalette', [(currentH - 30 + 360) % 360, currentH, (currentH + 30) % 360]);
  renderPalette('triadPalette', [currentH, (currentH + 120) % 360, (currentH + 240) % 360]);
}

function renderPalette(id, hues) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  hues.forEach(h => {
    const [r, g, b] = hslToRgb(h, currentS, currentL);
    const hex = rgbToHex(r, g, b);
    const swatch = document.createElement('div');
    swatch.className = 'palette-swatch';
    swatch.style.background = hex;
    swatch.title = hex;
    swatch.onclick = () => { navigator.clipboard.writeText(hex); showToast('已复制 ' + hex); };
    el.appendChild(swatch);
  });
}

function updateGradient() {
  const [r1, g1, b1] = hslToRgb(currentH, currentS, currentL);
  const h2 = (currentH + 60) % 360;
  const [r2, g2, b2] = hslToRgb(h2, currentS, currentL);
  document.getElementById('gradientBar').style.background = `linear-gradient(90deg, rgb(${r1},${g1},${b1}), rgb(${r2},${g2},${b2}))`;
}

function copyGradient() {
  const h2 = (currentH + 60) % 360;
  const [r1, g1, b1] = hslToRgb(currentH, currentS, currentL);
  const [r2, g2, b2] = hslToRgb(h2, currentS, currentL);
  navigator.clipboard.writeText(`linear-gradient(90deg, rgb(${r1},${g1},${b1}), rgb(${r2},${g2},${b2}))`).then(() => showToast('已复制'));
}

function updateContrast() {
  const [r, g, b] = hslToRgb(currentH, currentS, currentL);
  const luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  const whiteRatio = (1.05) / (luma + 0.05);
  const blackRatio = (luma + 0.05) / 0.05;
  const el = document.getElementById('contrastResult');
  const hex = rgbToHex(r, g, b);
  if (blackRatio >= 7) el.innerHTML = `与白色对比: ${whiteRatio.toFixed(1)}:1 | 与黑色对比: ${blackRatio.toFixed(1)}:1<br><strong style="color:var(--success)">AAA 级别</strong>`;
  else if (blackRatio >= 4.5) el.innerHTML = `与白色对比: ${whiteRatio.toFixed(1)}:1 | 与黑色对比: ${blackRatio.toFixed(1)}:1<br><strong style="color:var(--warning)">AA 级别</strong>`;
  else el.innerHTML = `与白色对比: ${whiteRatio.toFixed(1)}:1 | 与黑色对比: ${blackRatio.toFixed(1)}:1<br><strong style="color:var(--danger)">不达标</strong>`;
}

function addHistory(hex) {
  if (history[0] === hex) return;
  history.unshift(hex);
  if (history.length > 20) history.pop();
  localStorage.setItem('color_history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const grid = document.getElementById('historyGrid');
  grid.innerHTML = '';
  history.forEach(hex => {
    const el = document.createElement('div');
    el.className = 'history-color';
    el.style.background = hex;
    el.title = hex;
    el.onclick = () => { navigator.clipboard.writeText(hex); showToast('已复制 ' + hex); };
    grid.appendChild(el);
  });
}

function copy(id) {
  const text = document.getElementById(id).textContent;
  navigator.clipboard.writeText(text).then(() => showToast('已复制'));
}

function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

renderHistory();
setTimeout(initPicker, 100);
window.addEventListener('resize', () => { canvas.width = 0; initPicker(); });
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
