<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表情组合</title>
<meta name="description" content="Emoji表情组合推荐，发现有趣的Emoji搭配">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent-hover:#2563eb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8rem;margin:20px 0 8px}
.sub{color:#8b949e;margin-bottom:24px;font-size:0.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:640px;margin-bottom:16px}
.preview{font-size:2.5rem;min-height:60px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;word-break:break-all;min-height:80px}
.preview:empty::before{content:"组合预览将显示在这里";color:#484f58;font-size:0.95rem}
.picker-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.picker-btn{background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:1.4rem;padding:6px 8px;cursor:pointer;transition:border-color .15s}
.picker-btn:hover{border-color:var(--accent)}
.input-row{display:flex;gap:10px;margin-top:12px}
.input-row input{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:1rem}
.input-row input:focus{outline:none;border-color:var(--accent)}
.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{padding:10px 20px;border:none;border-radius:8px;font-size:0.95rem;cursor:pointer;font-weight:500;transition:background .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--border);color:var(--text)}.btn-secondary:hover{background:#444c56}
.btn-danger{background:#da3633;color:#fff}.btn-danger:hover{background:#b62324}
.favorites{display:flex;flex-direction:column;gap:8px}
.fav-item{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.fav-emoji{font-size:1.8rem;flex:1;word-break:break-all}
.fav-actions{display:flex;gap:6px}
.fav-actions button{padding:6px 12px;font-size:0.8rem}
.empty-hint{color:#484f58;font-size:0.9rem;text-align:center;padding:20px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:10px 24px;border-radius:8px;font-size:0.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="表情组合">
  <meta property="og:description" content="Emoji表情组合推荐，发现有趣的Emoji搭配">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/emoji-combos/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<h1>表情组合</h1>
<p class="sub">自由组合多个表情，创建有趣的表情序列</p>
<div class="card">
<div style="font-weight:500;margin-bottom:8px">组合预览</div>
<div class="preview" id="preview"></div>
<div class="input-row">
<input type="text" id="comboInput" placeholder="或直接输入表情文本..." title="Enter键搜索" oninput="updateFromInput()">
<button class="btn-secondary" onclick="clearCombo()">清空</button>
</div>
<div class="btn-row">
<button class="btn-primary" onclick="copyCombo()">复制组合</button>
<button class="btn-secondary" onclick="saveFavorite()">收藏</button>
<button class="btn-secondary" onclick="undoLast()">撤销</button>
</div>
</div>
<div class="card">
<div style="font-weight:500;margin-bottom:4px">选择表情</div>
<div style="color:#8b949e;font-size:0.85rem;margin-bottom:8px">点击添加到组合</div>
<div class="picker-grid" id="picker"></div>
</div>
<div class="card">
<div style="font-weight:500;margin-bottom:10px">我的收藏</div>
<div class="favorites" id="favorites">
<div class="empty-hint">还没有收藏，组合后点击"收藏"按钮保存</div>
</div>
</div>
<div class="toast" id="toast">已复制到剪贴板</div>
<script>
const EMOJIS=['😀','😃','😄','😁','😆','😅','🤣','😂','🙂','😉','😊','😇','🥰','😍','🤩','😘','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔','😐','😑','😏','😒','🙄','😬','😌','😔','😪','😴','😷','🤒','🤕','🤢','🤮','🥵','🥶','🥴','😵','🤯','🤠','🥳','😎','🤓','😕','😟','😮','😲','😳','🥺','😦','😧','😨','😰','😥','😢','😭','😱','😖','😣','😞','😓','😩','😫','😤','😡','😠','🤬','💀','💩','🤡','👻','👽','🤖','❤️','🧡','💛','💚','💙','💜','🖤','🤍','💔','💕','💞','💓','💗','💖','💘','💝','👍','👎','👌','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','👇','☝️','✋','🤚','🖐️','💪','🙏','🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦆','🦄','🐝','🐛','🦋','🐢','🐍','🐙','🦑','🦐','🦀','🐟','🐬','🐳','🐋','🦈','🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🫐','🍒','🍑','🥭','🍍','🍅','🥑','🍆','🥕','🌽','🌶️','🍄','🍞','🥐','🧀','🍖','🍗','🥩','🍔','🍟','🍕','🌮','🥚','🍳','🍜','🍝','🍣','🥟','🍦','🍩','🍪','🎂','🍰','☕','🍵','🍷','🍸','🍹','✈️','🚀','⛵','🚂','🚗','🚕','🚌','🏎️','🚓','🚑','🚒','🏍️','🚲','🚁','🏠','🏡','🏢','🏨','🏪','🏫','🏰','🗼','🗽','⛲','⛰️','🏔️','🌋','🏖️','🌅','🌌','⭐','🌟','✨','⚡','🔥','💥','☀️','🌈','❄️','💧','🌊','✅','❌','⭕','❓','❗','💯','🔴','🟡','🟢','🔵','💜','⬛','⬜','🕐','🕑','🕒','⏰','📱','💻','⌨️','🖥️','📷','📹','🎥','📺','📻','💡','🔧','🔨','🎁','🎈','🎉','🧧','✉️','📝','✂️','💎','⚖️'];
let combo=[];
let favorites=JSON.parse(localStorage.getItem('emojiCombos_favs')||'[]');
function init(){
document.getElementById('picker').innerHTML=EMOJIS.map(e=>
`<div class="picker-btn" onclick="addEmoji('${e}')">${e}</div>`
).join('');
renderPreview();
renderFavorites();
}
function addEmoji(emoji){combo.push(emoji);renderPreview();}
function clearCombo(){combo=[];renderPreview();}
function undoLast(){combo.pop();renderPreview();}
function renderPreview(){
const el=document.getElementById('preview');
el.innerHTML=combo.length?combo.map(e=>`<span>${e}</span>`).join(''):'';
document.getElementById('comboInput').value=combo.join('');
}
function updateFromInput(){
const val=document.getElementById('comboInput').value;
combo=[...val];
renderPreview();
}
function copyCombo(){
const text=combo.join('');
if(!text)return;
navigator.clipboard.writeText(text).then(()=>showToast('已复制'));
}
function saveFavorite(){
const text=combo.join('');
if(!text)return;
if(!favorites.includes(text)){
favorites.push(text);
localStorage.setItem('emojiCombos_favs',JSON.stringify(favorites));
renderFavorites();
showToast('已收藏');
}
}
function removeFav(idx){
favorites.splice(idx,1);
localStorage.setItem('emojiCombos_favs',JSON.stringify(favorites));
renderFavorites();
}
function copyFav(text){navigator.clipboard.writeText(text).then(()=>showToast('已复制'));}
function loadFav(text){combo=[...text];renderPreview();showToast('已加载到组合');}
function renderFavorites(){
const el=document.getElementById('favorites');
if(!favorites.length){el.innerHTML='<div class="empty-hint">还没有收藏，组合后点击"收藏"按钮保存</div>';return;}
el.innerHTML=favorites.map((f,i)=>
`<div class="fav-item">
<span class="fav-emoji">${f}</span>
<div class="fav-actions">
<button class="btn-secondary" onclick="copyFav('${f.replace(/'/g,"\\'")}')">复制</button>
<button class="btn-secondary" onclick="loadFav('${f.replace(/'/g,"\\'")}')">加载</button>
<button class="btn-danger" onclick="removeFav(${i})">删除</button>
</div>
</div>`
).join('');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}
init();
</script>
<script src="../i18n.js" defer>
document.getElementById("comboInput").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();clearCombo();}});
</script>
</body>
</html>
