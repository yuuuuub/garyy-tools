<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体育场馆查找 - Sports Finder</title>
    <meta name="description" content="体育场馆查找工具，定位附近的运动场馆">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;
            --secondary: #8b949e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: var(--secondary);
            font-size: 1.1rem;
        }
        
        .search-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
        }
        
        .search-row {
            display: grid;
            grid-template-columns: 1fr 200px 150px;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        @media (max-width: 768px) {
            .search-row {
                grid-template-columns: 1fr;
            }
        }
        
        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        
        .filter-label {
            color: var(--secondary);
            font-size: 0.9rem;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }
        
        .results-count {
            color: var(--secondary);
        }
        
        .sort-select {
            padding: 8px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .results-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .venue-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .venue-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        
        .venue-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .venue-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
        }
        
        .venue-category {
            padding: 4px 10px;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .venue-location {
            color: var(--secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .venue-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }
        
        .stars {
            color: var(--warning);
            letter-spacing: 2px;
        }
        
        .rating-value {
            font-weight: 600;
        }
        
        .rating-count {
            color: var(--secondary);
            font-size: 0.85rem;
        }
        
        .venue-description {
            color: var(--secondary);
            margin-bottom: 16px;
            line-height: 1.5;
        }
        
        .venue-features {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .feature-tag {
            padding: 4px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--secondary);
        }
        
        .venue-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        
        .info-item {
            font-size: 0.9rem;
        }
        
        .info-label {
            color: var(--secondary);
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
        
        .info-value {
            font-weight: 500;
        }
        
        .book-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 16px;
        }
        
        .book-btn:hover {
            background: var(--accent-hover);
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--secondary);
        }
        
        .no-results-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        
        footer {
            text-align: center;
            padding: 40px 0;
            margin-top: 40px;
            border-top: 1px solid var(--border);
            color: var(--secondary);
            font-size: 0.9rem;
        }
    </style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="体育场馆查找 - Sports Finder">
  <meta property="og:description" content="体育场馆查找工具，定位附近的运动场馆">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/sports-finder/">
</head>
<body>
    <div class="container">
        <header>
            <h1>体育场馆查找</h1>
            <p class="subtitle">发现您附近的优质运动场馆，立即预订开始运动</p>
        </header>

        <div class="search-section">
            <div class="search-row">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索场馆名称或位置...">
                <select class="sort-select" id="sortSelect">
                    <option value="rating">按评分排序</option>
                    <option value="price-low">价格从低到高</option>
                    <option value="price-high">价格从高到低</option>
                    <option value="name">按名称排序</option>
                </select>
            </div>
            <div class="filter-section">
                <span class="filter-label">类型：</span>
                <button class="filter-btn active" data-category="all">全部</button>
                <button class="filter-btn" data-category="basketball">篮球</button>
                <button class="filter-btn" data-category="football">足球</button>
                <button class="filter-btn" data-category="swimming">游泳</button>
                <button class="filter-btn" data-category="tennis">网球</button>
                <button class="filter-btn" data-category="track">田径</button>
            </div>
        </div>

        <div class="results-header">
            <span class="results-count" id="resultsCount">找到 10 个场馆</span>
        </div>

        <div class="results-grid" id="resultsGrid">
            <!-- Cards will be injected here -->
        </div>

        <div class="no-results" id="noResults" style="display: none;">
            <div class="no-results-icon">🏟️</div>
            <h2>未找到匹配的场馆</h2>
            <p>请尝试调整搜索条件或筛选项</p>
        </div>

        <footer>
            <p>© 2026 体育场馆查找 - 帮助您找到最佳运动场所</p>
        </footer>
    </div>

    <script>
        const venues = [
            {
                name: "奥林匹克体育中心",
                category: "track",
                categoryLabel: "田径",
                location: "北京市朝阳区",
                rating: 4.8,
                reviews: 2340,
                description: "国家级综合性体育场馆，拥有标准400米跑道和多种田径设施，适合专业训练和业余健身。",
                features: ["标准跑道", "跳远沙坑", "投掷区", "观众席", "停车场"],
                price: 50,
                booking: "需提前预约",
                facilities: "淋浴、更衣室、医疗室"
            },
            {
                name: "水立方游泳馆",
                category: "swimming",
                categoryLabel: "游泳",
                location: "北京市朝阳区",
                rating: 4.9,
                reviews: 3120,
                description: "奥运场馆改建，拥有50米标准泳池和儿童戏水区，水质清澈，设施一流。",
                features: ["50米泳池", "儿童池", "跳水台", "恒温系统", "专业教练"],
                price: 80,
                booking: "在线预约",
                facilities: "桑拿、按摩、餐饮"
            },
            {
                name: "五棵松篮球馆",
                category: "basketball",
                categoryLabel: "篮球",
                location: "北京市海淀区",
                rating: 4.7,
                reviews: 1890,
                description: "NBA级别篮球场馆，可举办大型赛事，日常开放业余篮球爱好者使用。",
                features: ["NBA标准场地", "专业灯光", "计分系统", "观众席", "VIP包厢"],
                price: 120,
                booking: "电话预约",
                facilities: "更衣室、淋浴、商店"
            },
            {
                name: "国家网球中心",
                category: "tennis",
                categoryLabel: "网球",
                location: "北京市朝阳区",
                rating: 4.6,
                reviews: 1560,
                description: "专业网球训练基地，拥有室内室外多个球场，适合各水平球员。",
                features: ["硬地球场", "红土球场", "室内球场", "练习墙", "教练团队"],
                price: 100,
                booking: "在线预约",
                facilities: "商店、咖啡厅、健身房"
            },
            {
                name: "工人体育场足球场",
                category: "football",
                categoryLabel: "足球",
                location: "北京市朝阳区",
                rating: 4.5,
                reviews: 2100,
                description: "北京国安主场，专业足球场地，可承接各类足球赛事和活动。",
                features: ["天然草皮", "专业灯光", "更衣室", "媒体中心", "停车场"],
                price: 200,
                booking: "团体预约",
                facilities: "餐饮、商店、医疗"
            },
            {
                name: "海淀游泳馆",
                category: "swimming",
                categoryLabel: "游泳",
                location: "北京市海淀区",
                rating: 4.4,
                reviews: 980,
                description: "社区级游泳馆，价格实惠，适合家庭健身和儿童游泳学习。",
                features: ["25米泳池", "儿童教学池", "救生员", "初学者课程"],
                price: 40,
                booking: "现场购票",
                facilities: "更衣室、淋浴"
            },
            {
                name: "朝阳公园篮球场",
                category: "basketball",
                categoryLabel: "篮球",
                location: "北京市朝阳区",
                rating: 4.3,
                reviews: 750,
                description: "公园内露天篮球场，环境优美，适合休闲运动和朋友聚会。",
                features: ["室外场地", "免费开放", "灯光照明", "休息区"],
                price: 0,
                booking: "无需预约",
                facilities: "公共卫生间、小卖部"
            },
            {
                name: "奥体中心网球场",
                category: "tennis",
                categoryLabel: "网球",
                location: "北京市朝阳区",
                rating: 4.6,
                reviews: 1120,
                description: "奥体中心附属网球场，设施完善，适合周末休闲和训练。",
                features: ["塑胶球场", "夜间照明", "休息区", "器材租赁"],
                price: 80,
                booking: "在线预约",
                facilities: "商店、淋浴"
            },
            {
                name: "丰台体育中心",
                category: "track",
                categoryLabel: "田径",
                location: "北京市丰台区",
                rating: 4.2,
                reviews: 650,
                description: "综合性体育中心，田径设施齐全，适合业余训练和学校活动。",
                features: ["400米跑道", "足球场", "跳远区", "铅球区"],
                price: 30,
                booking: "电话预约",
                facilities: "更衣室、卫生间"
            },
            {
                name: "回龙观足球场",
                category: "football",
                categoryLabel: "足球",
                location: "北京市昌平区",
                rating: 4.4,
                reviews: 890,
                description: "社区足球场，人工草皮，适合业余球队训练和比赛。",
                features: ["人工草皮", "5人制场地", "7人制场地", "灯光", "更衣室"],
                price: 150,
                booking: "在线预约",
                facilities: "停车场、小卖部"
            }
        ];

        let currentCategory = 'all';
        let currentSort = 'rating';
        let searchQuery = '';

        function createStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 >= 0.5;
            let stars = '';
            for (let i = 0; i < fullStars; i++) {
                stars += '★';
            }
            if (hasHalf) {
                stars += '☆';
            }
            return stars;
        }

        function createVenueCard(venue) {
            return `
                <div class="venue-card">
                    <div class="venue-header">
                        <h3 class="venue-name">${venue.name}</h3>
                        <span class="venue-category">${venue.categoryLabel}</span>
                    </div>
                    <div class="venue-location">📍 ${venue.location}</div>
                    <div class="venue-rating">
                        <span class="stars">${createStars(venue.rating)}</span>
                        <span class="rating-value">${venue.rating}</span>
                        <span class="rating-count">(${venue.reviews}条评价)</span>
                    </div>
                    <p class="venue-description">${venue.description}</p>
                    <div class="venue-features">
                        ${venue.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
                    </div>
                    <div class="venue-info">
                        <div class="info-item">
                            <div class="info-label">价格</div>
                            <div class="info-value">${venue.price === 0 ? '免费' : '¥' + venue.price + '/小时'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">预订方式</div>
                            <div class="info-value">${venue.booking}</div>
                        </div>
                    </div>
                    <button class="book-btn">立即预订</button>
                </div>
            `;
        }

        function filterAndSort() {
            let filtered = venues;
            
            if (currentCategory !== 'all') {
                filtered = filtered.filter(v => v.category === currentCategory);
            }
            
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(v => 
                    v.name.toLowerCase().includes(query) || 
                    v.location.toLowerCase().includes(query)
                );
            }
            
            switch (currentSort) {
                case 'rating':
                    filtered.sort((a, b) => b.rating - a.rating);
                    break;
                case 'price-low':
                    filtered.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    filtered.sort((a, b) => b.price - a.price);
                    break;
                case 'name':
                    filtered.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
                    break;
            }
            
            return filtered;
        }

        function renderResults() {
            const filtered = filterAndSort();
            const grid = document.getElementById('resultsGrid');
            const noResults = document.getElementById('noResults');
            const count = document.getElementById('resultsCount');
            
            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                count.textContent = '找到 0 个场馆';
            } else {
                noResults.style.display = 'none';
                grid.innerHTML = filtered.map(createVenueCard).join('');
                count.textContent = `找到 ${filtered.length} 个场馆`;
            }
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                renderResults();
            });
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderResults();
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderResults();
        });

        renderResults();
    </script>
</body>
</html>
