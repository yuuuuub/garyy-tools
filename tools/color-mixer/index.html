<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调色板混合 - Color Mixer</title>
<meta name="description" content="调色板混合工具，混合不同颜色查看混合效果">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{text-align:center;padding:2rem 1rem;border-bottom:1px solid var(--border)}
.header h1{font-size:1.8rem;margin-bottom:.3rem}
.header p{color:#8b949e;font-size:.9rem}
.container{max-width:800px;margin:0 auto;padding:1.5rem}
.mode-toggle{display:flex;justify-content:center;gap:.5rem;margin:1.5rem 0}
.mode-btn{padding:.5rem 1.2rem;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:.9rem;transition:all .2s}
.mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.mix-section{display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center;margin:2rem 0}
.color-input-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem;min-width:200px;flex:1}
.color-input-card h3{margin-bottom:.8rem;font-size:1rem}
.color-preview{width:100%;height:80px;border-radius:10px;border:2px solid var(--border);margin-bottom:.8rem;transition:background .3s}
.color-input-card input[type="color"]{width:100%;height:40px;border:none;border-radius:8px;cursor:pointer;margin-bottom:.5rem}
.color-input-card input[type="range"]{width:100%;accent-color:var(--accent)}
.color-input-card label{font-size:.8rem;color:#8b949e;display:flex;justify-content:space-between}
.color-input-card .hex-display{font-family:monospace;font-size:.85rem;text-align:center;margin-top:.3rem}
.mix-arrow{display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--accent)}
.result-section{margin:2rem 0}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;text-align:center}
.result-swatch{width:100%;height:120px;border-radius:10px;border:2px solid var(--border);margin-bottom:1rem;transition:background .3s}
.result-values{display:flex;justify-content:center;gap:2rem;flex-wrap:wrap;margin:1rem 0}
.result-val{text-align:center}
.result-val label{font-size:.75rem;color:#8b949e;display:block;margin-bottom:.2rem}
.result-val span{font-family:monospace;font-size:.9rem}
.add-color-btn{background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:1rem;cursor:pointer;color:#8b949e;font-size:.85rem;transition:all .2s;text-align:center}
.add-color-btn:hover{border-color:var(--accent);color:var(--accent)}
.color-slots{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin:1.5rem 0}
.color-slot{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem;text-align:center;min-width:140px}
.color-slot input[type="color"]{width:100%;height:50px;border:none;border-radius:8px;cursor:pointer}
.color-slot .weight-row{margin-top:.5rem}
.color-slot .weight-row input{width:100%;accent-color:var(--accent)}
.color-slot .weight-row label{font-size:.75rem;color:#8b949e}
.remove-btn{background:none;border:none;color:#e74c3c;cursor:pointer;font-size:.8rem;margin-top:.3rem}
.palette-output{margin:2rem 0}
.palette-output h2{margin-bottom:1rem;font-size:1.2rem}
.palette-bar{display:flex;border-radius:10px;overflow:hidden;height:60px;margin-bottom:1rem}
.palette-bar div{flex:1}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="调色板混合 - Color Mixer">
  <meta property="og:description" content="调色板混合工具，混合不同颜色查看混合效果">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/color-mixer/">
</head>
<body>
<div class="header">
<h1>🧪 调色板混合</h1>
<p>混合两种或多种颜色</p>
</div>
<div class="container">
<div class="mode-toggle">
<div class="mode-btn active" data-mode="rgb">RGB 混合</div>
<div class="mode-btn" data-mode="paint">颜料混合</div>
<div class="mode-btn" data-mode="light">光线混合</div>
</div>
<div class="mode-desc" style="text-align:center;color:#8b949e;font-size:.85rem;margin-bottom:1rem" id="modeDesc">RGB 混合：线性插值混合，适合数字设计</div>

<div class="color-slots" id="colorSlots"></div>
<div style="text-align:center"><div class="add-color-btn" onclick="addColorSlot()" style="display:inline-block;width:140px">+ 添加颜色</div></div>

<div class="result-section">
<div class="result-card">
<div class="result-swatch" id="resultSwatch" style="background:#7b5fbf"></div>
<h3>混合结果</h3>
<div class="result-values">
<div class="result-val"><label>HEX</label><span id="resultHex">#7B5FBF</span></div>
<div class="result-val"><label>RGB</label><span id="resultRgb">rgb(123, 95, 191)</span></div>
<div class="result-val"><label>HSL</label><span id="resultHsl">hsl(257, 42%, 56%)</span></div>
</div>
</div>
</div>

<div class="palette-output">
<h2>混合历史</h2>
<div class="palette-bar" id="historyBar"></div>
</div>
</div>

<script>
let colors=['#e74c3c','#3498db'];
let weights=[50,50];
let mode='rgb';
let history=['#7b5fbf'];

const modeDescs={rgb:'RGB 混合：线性插值混合，适合数字设计',paint:'颜料混合：减色法混合，模拟真实颜料调色（结果偏暗）',light:'光线混合：加色法混合，模拟光的叠加（结果偏亮）'};

function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase()}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0}else{const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break}}return[Math.round(h*360),Math.round(s*100),Math.round(l*100)]}

function renderSlots(){
const container=document.getElementById('colorSlots');
container.innerHTML='';
colors.forEach((c,i)=>{
const div=document.createElement('div');div.className='color-slot';
div.innerHTML=`
<input type="color" value="${c}" onchange="colors[${i}]=this.value;mixColors()">
<div style="font-family:monospace;font-size:.8rem;margin-top:.3rem">${c}</div>
<div class="weight-row">
<label>权重: <span id="w${i}">${weights[i]}</span>%</label>
<input type="range" min="0" max="100" value="${weights[i]}" oninput="weights[${i}]=+this.value;document.getElementById('w${i}').textContent=this.value;mixColors()">
</div>
${colors.length>2?`<button class="remove-btn" onclick="removeColor(${i})">✕ 移除</button>`:''}
`;
container.appendChild(div);
});
}

function addColorSlot(){colors.push('#2ecc71');weights.push(50);renderSlots();mixColors()}
function removeColor(i){colors.splice(i,1);weights.splice(i,1);renderSlots();mixColors()}

function mixColors(){
const totalWeight=weights.reduce((a,b)=>a+b,0);
if(totalWeight===0)return;
let r=0,g=0,b=0;
colors.forEach((c,i)=>{
const rgb=hexToRgb(c);
const w=weights[i]/totalWeight;
if(mode==='paint'){
r+=Math.pow(rgb[0]/255,2.2)*w;
g+=Math.pow(rgb[1]/255,2.2)*w;
b+=Math.pow(rgb[2]/255,2.2)*w;
}else if(mode==='light'){
r+=rgb[0]/255*w;
g+=rgb[1]/255*w;
b+=rgb[2]/255*w;
}else{
r+=rgb[0]*w;g+=rgb[1]*w;b+=rgb[2]*w;
}
});
if(mode==='paint'){
r=Math.pow(r,1/2.2)*255;g=Math.pow(g,1/2.2)*255;b=Math.pow(b,1/2.2)*255;
}
const fr=Math.max(0,Math.min(255,Math.round(r)));
const fg=Math.max(0,Math.min(255,Math.round(g)));
const fb=Math.max(0,Math.min(255,Math.round(b)));
const hex=rgbToHex(fr,fg,fb);
const hsl=rgbToHsl(fr,fg,fb);
document.getElementById('resultSwatch').style.background=hex;
document.getElementById('resultHex').textContent=hex;
document.getElementById('resultRgb').textContent=`rgb(${fr}, ${fg}, ${fb})`;
document.getElementById('resultHsl').textContent=`hsl(${hsl[0]}, ${hsl[1]}%, ${hsl[2]}%)`;
if(!history.includes(hex)){history.push(hex);if(history.length>12)history.shift();updateHistory()}
}

function updateHistory(){
const bar=document.getElementById('historyBar');
bar.innerHTML=history.map(c=>`<div style="background:${c}" title="${c}" onclick="navigator.clipboard.writeText('${c}')"></div>`).join('');
}

document.querySelectorAll('.mode-btn').forEach(btn=>{
btn.addEventListener('click',()=>{
document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');mode=btn.dataset.mode;
document.getElementById('modeDesc').textContent=modeDescs[mode];
mixColors();
});
});

renderSlots();mixColors();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
