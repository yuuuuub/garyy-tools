<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💃 舞蹈追踪</title>
<meta name="description" content="舞蹈练习追踪器，记录舞蹈类型、编舞、歌曲，查看练习统计">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:10px 0;margin-top:8px}
.bar-chart .bar{flex:1;background:linear-gradient(180deg,var(--danger),var(--accent));border-radius:4px 4px 0 0;position:relative;min-width:20px;transition:height .3s}
.bar-chart .bar .val{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--text2)}
.bar-chart .bar .lbl{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--text2);white-space:nowrap}
.mastered{background:var(--success)!important;color:#fff!important;border:none!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💃</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="💃 舞蹈追踪">
<meta property="og:description" content="舞蹈练习追踪器，记录舞蹈类型、编舞、歌曲">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/dance-tracker-cn/">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>💃 舞蹈追踪</h1><p>用身体书写旋律，用数据记录成长</p></div>

<div class="cd">
<div class="gr">
<div class="st"><div class="nm" id="totalHours">0</div><div class="lb">总时长(小时)</div></div>
<div class="st"><div class="nm" id="weekSessions" style="color:var(--success)">0</div><div class="lb">本周练习</div></div>
<div class="st"><div class="nm" id="stylesCount" style="color:var(--warn)">0</div><div class="lb">舞种数量</div></div>
<div class="st"><div class="nm" id="streak" style="color:var(--danger)">0</div><div class="lb">连续天数</div></div>
</div>
</div>

<div class="cd"><h2>记录练习</h2>
<div class="fr">
<div><label>舞蹈类型</label><select id="dStyle"><option>街舞</option><option>中国舞</option><option>拉丁</option><option>芭蕾</option><option>现代舞</option><option>爵士</option><option>民族舞</option><option>肚皮舞</option><option>华尔兹</option><option>其他</option></select></div>
<div><label>时长(分钟)</label><input type="number" id="dDur" placeholder="60" min="1"></div>
</div>
<div class="fr">
<div><label>编舞数量</label><input type="number" id="dChoreo" value="0" min="0"></div>
<div><label>练习歌曲数</label><input type="number" id="dSongs" value="0" min="0"></div>
</div>
<div class="fr">
<div><label>难度</label><select id="dDiff"><option>初级</option><option>中级</option><option>高级</option></select></div>
<div><label>日期</label><input type="date" id="dDate"></div>
</div>
<div class="bg"><button onclick="addSession()">保存练习</button></div></div>

<div class="cd"><h2>本周练习趋势</h2><div class="bar-chart" id="weekChart"></div></div>

<div class="cd"><h2>歌曲列表</h2>
<div class="fr">
<div><input type="text" id="songName" placeholder="歌曲名"></div>
<div><select id="songStyle"><option>街舞</option><option>中国舞</option><option>拉丁</option><option>芭蕾</option><option>现代舞</option><option>爵士</option><option>民族舞</option><option>其他</option></select></div>
</div>
<div class="bg"><button onclick="addSong()">添加歌曲</button></div>
<div id="songList" style="margin-top:12px"></div></div>

<div class="cd"><h2>练习历史</h2><div id="sessionList" class="es">暂无记录</div>
<div class="bg"><button class="dng" onclick="clearSessions()">清空所有</button></div></div>
</div>
<script>
(function(){
var SESS_KEY='dance_tracker_sessions';
var SONG_KEY='dance_tracker_songs';
var sessions=JSON.parse(localStorage.getItem(SESS_KEY)||'[]');
var songs=JSON.parse(localStorage.getItem(SONG_KEY)||'[]');
var today=function(){return new Date().toISOString().slice(0,10)};

window.addSession=function(){
var style=document.getElementById('dStyle').value;
var dur=parseInt(document.getElementById('dDur').value)||0;
if(!dur){alert('请填写练习时长');return;}
var choreo=parseInt(document.getElementById('dChoreo').value)||0;
var songCount=parseInt(document.getElementById('dSongs').value)||0;
var diff=document.getElementById('dDiff').value;
var date=document.getElementById('dDate').value||today();
sessions.push({id:Date.now(),style:style,duration:dur,choreos:choreo,songs:songCount,difficulty:diff,date:date});
localStorage.setItem(SESS_KEY,JSON.stringify(sessions));
document.getElementById('dDur').value='';document.getElementById('dChoreo').value='0';document.getElementById('dSongs').value='0';
render();
};

window.delSession=function(id){sessions=sessions.filter(function(s){return s.id!==id});localStorage.setItem(SESS_KEY,JSON.stringify(sessions));render();};
window.clearSessions=function(){if(!confirm('确定清空所有？'))return;sessions=[];localStorage.setItem(SESS_KEY,JSON.stringify(sessions));render();};

function getStreak(){var streak=0;var d=new Date();while(true){var ds=d.toISOString().slice(0,10);if(sessions.some(function(s){return s.date===ds;})){streak++;d.setDate(d.getDate()-1);}else break;}return streak;}

window.addSong=function(){
var name=document.getElementById('songName').value.trim();
if(!name){alert('请输入歌曲名');return;}
songs.push({id:Date.now(),name:name,style:document.getElementById('songStyle').value,mastered:false});
localStorage.setItem(SONG_KEY,JSON.stringify(songs));
document.getElementById('songName').value='';renderSongs();
};
window.delSong=function(id){songs=songs.filter(function(s){return s.id!==id});localStorage.setItem(SONG_KEY,JSON.stringify(songs));renderSongs();};
window.toggleMastered=function(id){var s=songs.find(function(x){return x.id===id;});if(s){s.mastered=!s.mastered;localStorage.setItem(SONG_KEY,JSON.stringify(songs));renderSongs();}};

function renderSongs(){
var el=document.getElementById('songList');
if(!songs.length){el.innerHTML='';return;}
el.innerHTML=songs.map(function(s){
return '<div class="li" style="padding:8px"><div style="flex:1"><strong style="'+(s.mastered?'text-decoration:line-through;opacity:.6':'')+'">'+s.name+'</strong> <span class="tag" style="font-size:.65rem">'+s.style+'</span></div><div style="display:flex;gap:6px"><button style="padding:2px 8px;font-size:.75rem;'+(s.mastered?'background:var(--success)':'')+'" onclick="toggleMastered('+s.id+')">'+(s.mastered?'已掌握':'标记掌握')+'</button><button class="dng" style="padding:2px 8px;font-size:.75rem" onclick="delSong('+s.id+')">✕</button></div></div>';
}).join('');
}

function render(){
var totalMin=0;sessions.forEach(function(s){totalMin+=s.duration;});
document.getElementById('totalHours').textContent=(totalMin/60).toFixed(1);
var now=new Date();var dow=now.getDay()||7;
var ws=new Date(now);ws.setDate(now.getDate()-dow+1);ws.setHours(0,0,0,0);
var weekCount=sessions.filter(function(s){return new Date(s.date)>=ws;}).length;
document.getElementById('weekSessions').textContent=weekCount;
var styles={};sessions.forEach(function(s){styles[s.style]=true;});
document.getElementById('stylesCount').textContent=Object.keys(styles).length;
document.getElementById('streak').textContent=getStreak();

var daily={};for(var i=0;i<7;i++){var d=new Date(ws);d.setDate(ws.getDate()+i);daily[d.toISOString().slice(0,10)]=0;}
sessions.forEach(function(s){if(daily[s.date]!==undefined)daily[s.date]+=s.duration;});
var maxMin=Math.max.apply(null,Object.values(daily).concat([1]));
var dayN=['一','二','三','四','五','六','日'];
var chartH=Object.keys(daily).map(function(k,i){
var h=Math.round(daily[k]/maxMin*100);
return '<div class="bar" style="height:'+Math.max(h,3)+'%"><div class="val">'+daily[k]+'</div><div class="lbl">周'+dayN[i]+'</div></div>';
}).join('');
document.getElementById('weekChart').innerHTML=chartH;

var el=document.getElementById('sessionList');
if(!sessions.length){el.innerHTML='<div class="es">暂无记录</div>';return;}
el.innerHTML=sessions.slice().reverse().map(function(s){
var dc=s.difficulty==='高级'?'d':s.difficulty==='中级'?'w':'s';
return '<div class="li"><div style="flex:1"><strong>'+s.style+'</strong> <span class="tag '+dc+'">'+s.difficulty+'</span><br><span style="font-size:.8rem;color:var(--text2)">'+s.duration+'分钟 · 编舞'+s.choreos+'个 · 歌曲'+s.songs+'首 · '+s.date+'</span></div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="delSession('+s.id+')">✕</button></div>';
}).join('');

renderSongs();
}
document.getElementById('dDate').value=today();
render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
