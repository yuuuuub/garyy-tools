<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID生成器</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh}
.container{max-width:720px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{font-size:.85rem;color:var(--text2);margin-bottom:10px}
.uuid-display{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-family:monospace;font-size:1.2rem;word-break:break-all;text-align:center;margin-bottom:16px;color:var(--gold);letter-spacing:1px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.btn{padding:8px 20px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.82rem;background:var(--blue);color:#fff;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.green{background:var(--green)}
.btn.gold{background:var(--gold);color:#000}
.batch-btns{display:flex;gap:6px;flex-wrap:wrap}
.batch-btns .btn{font-size:.78rem;padding:6px 14px}
.option-row{display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.option-row label{font-size:.8rem;color:var(--text2);display:flex;align-items:center;gap:6px;cursor:pointer}
.option-row input[type="checkbox"]{accent-color:var(--blue)}
.option-row select{padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.8rem;outline:none}
.uuid-list{max-height:400px;overflow-y:auto}
.uuid-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-family:monospace;font-size:.82rem;cursor:pointer;transition:background .15s}
.uuid-item:hover{background:rgba(59,130,246,.08)}
.uuid-item .uuid-text{color:var(--text);flex:1;word-break:break-all;margin-right:10px}
.uuid-item .copy-hint{color:var(--text2);font-size:.7rem;opacity:0;transition:opacity .2s}
.uuid-item:hover .copy-hint{opacity:1}
.empty-state{text-align:center;padding:30px;color:var(--text2);font-size:.85rem}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 20px;border-radius:var(--radius);font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="container">
<header><h1>UUID生成器</h1><p>批量生成UUID v4</p></header>
<div class="card">
<div class="uuid-display" id="current-uuid">00000000-0000-0000-0000-000000000000</div>
<div class="controls">
<button class="btn green" id="gen-btn">生成</button>
<button class="btn" id="copy-current">复制</button>
<button class="btn gold" id="copy-all-btn">复制全部</button>
</div>
<div class="option-row">
<label><input type="checkbox" id="no-dash"> 无横线格式</label>
<label>批量数量:
<select id="batch-count">
<option value="1">1</option>
<option value="5">5</option>
<option value="10" selected>10</option>
<option value="50">50</option>
</select>
</label>
</div>
<div class="batch-btns">
<button class="btn" data-count="1">生成 1 个</button>
<button class="btn" data-count="5">5 个</button>
<button class="btn" data-count="10">10 个</button>
<button class="btn" data-count="50">50 个</button>
</div>
</div>
<div class="card">
<h3>生成的UUID</h3>
<div class="uuid-list" id="uuid-list">
<div class="empty-state">点击"生成"按钮生成 UUID</div>
</div>
</div>
</div>
<div class="toast" id="toast">已复制到剪贴板</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const toast = $('toast');
let generatedUuids = [];
let toastTimer = null;

function showToast(msg) {
  toast.textContent = msg || '已复制到剪贴板';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1500);
}

function generateUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function formatUUID(uuid, noDash) {
  return noDash ? uuid.replace(/-/g, '') : uuid;
}

function getNoDash() {
  return $('no-dash').checked;
}

function renderUUIDs() {
  const list = $('uuid-list');
  if(generatedUuids.length === 0) {
    list.innerHTML = '<div class="empty-state">点击"生成"按钮生成 UUID</div>';
    return;
  }
  list.innerHTML = generatedUuids.map(function(uuid, i) {
    return '<div class="uuid-item" data-index="' + i + '"><span class="uuid-text">' + escapeHtml(uuid) + '</span><span class="copy-hint">点击复制</span></div>';
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function generate(count) {
  const noDash = getNoDash();
  const uuids = [];
  for(let i=0; i<count; i++) {
    uuids.push(formatUUID(generateUUID(), noDash));
  }
  generatedUuids = uuids;
  // Update current display
  $('current-uuid').textContent = uuids[0] || '---';
  renderUUIDs();
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(function() {
    showToast('已复制到剪贴板');
  });
}

// Events
$('gen-btn').addEventListener('click', function() {
  const count = parseInt($('batch-count').value);
  generate(count);
});

$('copy-current').addEventListener('click', function() {
  if($('current-uuid').textContent && $('current-uuid').textContent !== '---') {
    copyText($('current-uuid').textContent);
  }
});

$('copy-all-btn').addEventListener('click', function() {
  if(generatedUuids.length === 0) return;
  copyText(generatedUuids.join('\n'));
});

$('no-dash').addEventListener('change', function() {
  if(generatedUuids.length > 0) {
    const noDash = this.checked;
    generatedUuids = generatedUuids.map(function(u) {
      return noDash ? u.replace(/-/g, '') : (u.length === 32 ? u.replace(/(.{8})(.{4})(.{4})(.{4})(.{12})/, '$1-$2-$3-$4-$5') : u);
    });
    $('current-uuid').textContent = generatedUuids[0];
    renderUUIDs();
  }
});

document.querySelectorAll('.batch-btns .btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    const count = parseInt(this.dataset.count);
    generate(count);
  });
});

// Click on uuid item to copy
document.getElementById('uuid-list').addEventListener('click', function(e) {
  const item = e.target.closest('.uuid-item');
  if(item) {
    const text = item.querySelector('.uuid-text').textContent;
    copyText(text);
  }
});

// Init
generate(1);

})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
