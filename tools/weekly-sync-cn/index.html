<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 周同步会</title>
<meta name="description" content="周同步会议记录工具，汇总本周进展和下周计划">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--purple:#7c3aed}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:800px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
textarea{width:100%;min-height:80px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;font-family:inherit;resize:vertical;margin-bottom:10px}
textarea:focus{outline:none;border-color:var(--accent)}
input[type=text],input[type=date]{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
input:focus{outline:none;border-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
.week-nav{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:16px}
.week-nav .week-label{font-weight:600;font-size:1rem;min-width:200px;text-align:center}
.progress-item{margin-bottom:10px}
.progress-item .title{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.9rem}
.progress-item .bar{width:100%;height:8px;background:var(--border);border-radius:4px;margin-top:6px;overflow:hidden}
.progress-item .fill{height:100%;border-radius:4px;transition:width .3s}
.status-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:600}
.status-badge.done{background:rgba(63,185,80,.15);color:var(--green)}
.status-badge.progress{background:rgba(59,130,246,.15);color:var(--accent)}
.status-badge.blocked{background:rgba(248,81,73,.15);color:var(--red)}
.plan-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.9rem}
.plan-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.plan-item.done{text-decoration:line-through;color:var(--text2)}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.summary-stat{text-align:center;padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.summary-stat .num{font-size:1.4rem;font-weight:700;color:var(--accent)}
.summary-stat .lbl{font-size:.75rem;color:var(--text2);margin-top:2px}
.risk-tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;font-weight:600;margin-right:4px;margin-bottom:4px}
.risk-tag.high{background:rgba(248,81,73,.15);color:var(--red)}
.risk-tag.mid{background:rgba(210,153,34,.15);color:var(--yellow)}
.risk-tag.low{background:rgba(63,185,80,.15);color:var(--green)}
.history-entry{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.history-entry:hover{border-color:var(--accent)}
.hidden{display:none}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}.summary-grid{grid-template-columns:repeat(2,1fr)}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📅 周同步会">
<meta property="og:description" content="周同步会议记录工具，汇总本周进展和下周计划">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='weekly_sync';
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{weeks:{}};
let currentWeek=getWeekKey(new Date());
function getWeekKey(d){const date=new Date(d);const day=date.getDay()||7;date.setDate(date.getDate()-day+1);return date.toISOString().slice(0,10)}
function getWeekData(){if(!state.weeks[currentWeek])state.weeks[currentWeek]={progress:[],nextPlan:[],risks:[],notes:'',highlights:'',lessons:''};return state.weeks[currentWeek]}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function prevWeek(){const d=new Date(currentWeek);d.setDate(d.getDate()-7);currentWeek=getWeekKey(d);save();render()}
function nextWeek(){const d=new Date(currentWeek);d.setDate(d.getDate()+7);currentWeek=getWeekKey(d);save();render()}
function goThisWeek(){currentWeek=getWeekKey(new Date());save();render()}
function addProgress(){const w=getWeekData();w.progress.push({title:'新任务',percent:0,status:'progress'});save();render()}
function removeProgress(i){getWeekData().progress.splice(i,1);save();render()}
function addPlan(){getWeekData().nextPlan.push({text:'',done:false});save();render()}
function removePlan(i){getWeekData().nextPlan.splice(i,1);save();render()}
function togglePlan(i){getWeekData().nextPlan[i].done=!getWeekData().nextPlan[i].done;save();render()}
function addRisk(){getWeekData().risks.push({text:'',level:'mid'});save();render()}
function removeRisk(i){getWeekData().risks.splice(i,1);save();render()}
function exportWeek(){const w=getWeekData();let txt=`周同步报告 - ${currentWeek}\n`+'='.repeat(40)+'\n\n';txt+=`本周进展:\n`;w.progress.forEach(p=>{txt+=`  [${p.status}] ${p.title} - ${p.percent}%\n`});txt+=`\n下周计划:\n`;w.nextPlan.forEach(p=>{txt+=`  ${p.done?'✓':'○'} ${p.text}\n`});txt+=`\n风险项:\n`;w.risks.forEach(r=>{txt+=`  [${r.level}] ${r.text}\n`});txt+=`\n亮点: ${w.highlights}\n经验教训: ${w.lessons}\n备注: ${w.notes}`;const blob=new Blob([txt],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`周报_${currentWeek}.txt`;a.click()}
function render(){
  const w=getWeekData();
  const doneCount=w.progress.filter(p=>p.status==='done').length;
  const avgPercent=w.progress.length?Math.round(w.progress.reduce((s,p)=>s+p.percent,0)/w.progress.length):0;
  let h=`<div class="hdr"><h1>📅 周同步会</h1><p>汇总本周进展，规划下周方向</p></div>`;
  h+=`<div class="cd"><div class="week-nav"><button class="sec" onclick="prevWeek()">◀</button><div class="week-label">${currentWeek} 周</div><button class="sec" onclick="nextWeek()">▶</button><button class="sec" onclick="goThisWeek()">本周</button><button onclick="exportWeek()" style="font-size:.85rem;padding:6px 14px">导出</button></div>`;
  h+=`<div class="summary-grid"><div class="summary-stat"><div class="num">${w.progress.length}</div><div class="lbl">任务总数</div></div>`;
  h+=`<div class="summary-stat"><div class="num">${doneCount}</div><div class="lbl">已完成</div></div>`;
  h+=`<div class="summary-stat"><div class="num">${avgPercent}%</div><div class="lbl">平均进度</div></div>`;
  h+=`<div class="summary-stat"><div class="num">${w.risks.length}</div><div class="lbl">风险项</div></div></div></div>`;
  h+=`<div class="cd"><h2>📊 本周进展 <button class="sec" style="font-size:.75rem;padding:3px 10px;margin-left:6px" onclick="addProgress()">+ 添加</button></h2>`;
  w.progress.forEach((p,i)=>{const colors={done:'var(--green)',progress:'var(--accent)',blocked:'var(--red)'};
    h+=`<div class="progress-item"><div class="title"><span><input type="text" value="${p.title}" onchange="getWeekData().progress[${i}].title=this.value;save()" style="background:transparent;border:none;color:var(--text);font-weight:600;width:200px">`;
    h+=`<select onchange="getWeekData().progress[${i}].status=this.value;save();render()" style="background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.8rem;padding:2px 6px"><option value="progress"${p.status==='progress'?' selected':''}>进行中</option><option value="done"${p.status==='done'?' selected':''}>已完成</option><option value="blocked"${p.status==='blocked'?' selected':''}>阻塞</option></select></span>`;
    h+=`<span style="display:flex;align-items:center;gap:6px"><input type="range" min="0" max="100" value="${p.percent}" oninput="getWeekData().progress[${i}].percent=+this.value;save();this.nextElementSibling.textContent=this.value+'%';this.previousElementSibling.parentElement.querySelector('.fill').style.width=this.value+'%'" style="width:100px"><span style="font-size:.85rem;color:var(--text2);min-width:35px">${p.percent}%</span>`;
    h+=`<button class="sec" style="padding:2px 6px;font-size:.75rem" onclick="removeProgress(${i})">✕</button></span></div>`;
    h+=`<div class="bar"><div class="fill" style="width:${p.percent}%;background:${colors[p.status]}"></div></div></div>`});
  h+=`</div>`;
  h+=`<div class="cd"><h2>📝 下周计划 <button class="sec" style="font-size:.75rem;padding:3px 10px;margin-left:6px" onclick="addPlan()">+ 添加</button></h2>`;
  w.nextPlan.forEach((p,i)=>{h+=`<div class="plan-item${p.done?' done':''}"><input type="checkbox"${p.done?' checked':''} onchange="togglePlan(${i})"><input type="text" value="${p.text}" onchange="getWeekData().nextPlan[${i}].text=this.value;save()" placeholder="计划内容..." style="flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);padding:4px 0"><button class="sec" style="padding:2px 6px;font-size:.75rem" onclick="removePlan(${i})">✕</button></div>`});
  h+=`</div>`;
  h+=`<div class="cd"><h2>⚠️ 风险项 <button class="sec" style="font-size:.75rem;padding:3px 10px;margin-left:6px" onclick="addRisk()">+ 添加</button></h2>`;
  w.risks.forEach((r,i)=>{h+=`<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><select onchange="getWeekData().risks[${i}].level=this.value;save();render()" style="background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.8rem;padding:4px 6px"><option value="low"${r.level==='low'?' selected':''}>低</option><option value="mid"${r.level==='mid'?' selected':''}>中</option><option value="high"${r.level==='high'?' selected':''}>高</option></select>`;
    h+=`<input type="text" value="${r.text}" onchange="getWeekData().risks[${i}].text=this.value;save()" placeholder="风险描述..." style="flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);padding:4px 0"><button class="sec" style="padding:2px 6px;font-size:.75rem" onclick="removeRisk(${i})">✕</button></div>`});
  h+=`</div>`;
  h+=`<div class="cd"><h2>💡 总结</h2>`;
  h+=`<label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:4px">本周亮点</label><textarea oninput="getWeekData().highlights=this.value;save()" placeholder="本周最大的成就或亮点...">${w.highlights}</textarea>`;
  h+=`<label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:4px">经验教训</label><textarea oninput="getWeekData().lessons=this.value;save()" placeholder="从本周工作中学到的经验...">${w.lessons}</textarea>`;
  h+=`<label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:4px">备注</label><textarea oninput="getWeekData().notes=this.value;save()" placeholder="其他需要记录的内容...">${w.notes}</textarea></div>`;
  $('app').innerHTML=h;
}
render();
</script>
</body>
</html>
