<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌐 翻译工具 - Gary's Tools</title>
<meta name="description" content="AI翻译工具，支持多语言智能互译">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;line-height:1.6;min-height:100vh}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.8rem;font-weight:700;margin-bottom:4px}
header p{color:var(--text2);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.card-title{font-size:.95rem;font-weight:600;margin-bottom:10px;color:var(--text2)}
textarea{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;width:100%;font-size:.9rem;resize:vertical;font-family:inherit;outline:none;transition:border .2s}
textarea:focus{border-color:var(--blue)}
select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.85rem;font-family:inherit;outline:none;cursor:pointer;min-width:120px}
select:focus{border-color:var(--blue)}
button{padding:9px 20px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;font-family:inherit;transition:opacity .2s}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.result-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px;min-height:60px}
.result-box .label{color:var(--text2);font-size:.8rem;margin-bottom:6px}
.result-box .value{font-size:.95rem;line-height:1.7}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{background:rgba(239,68,68,.1);border:1px solid var(--red);border-radius:6px;padding:10px;color:var(--red);font-size:.82rem;margin-top:10px;display:none}
.waiting-msg{background:rgba(245,158,11,.1);border:1px solid var(--gold);border-radius:6px;padding:10px;color:var(--gold);font-size:.82rem;margin-top:10px;display:none}
.btn-group{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.translate-config{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🌐 翻译工具 - Gary's Tools">
  <meta property="og:description" content="AI翻译工具，支持多语言智能互译">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/ai-translate/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<header>
<h1>🌐 翻译工具</h1>
<p>HuggingFace · 多语言翻译</p>
</header>
<div class="card">
<div class="card-title">翻译设置</div>
<div class="translate-config">
<select id="targetLang">
<option value="en">英语 (English)</option>
<option value="zh">中文 (Chinese)</option>
<option value="ja">日语 (Japanese)</option>
<option value="fr">法语 (French)</option>
<option value="de">德语 (German)</option>
<option value="es">西班牙语 (Spanish)</option>
</select>
</div>
<div class="card-title">输入文本</div>
<textarea id="inputText" rows="5" placeholder="请输入要翻译的文本..."></textarea>
<div class="btn-group">
<button id="translateBtn">🌍 翻译</button>
<button id="clearBtn" style="border-color:var(--border);background:transparent;color:var(--text)">清空</button>
</div>
<div id="waitingMsg" class="waiting-msg">⏳ 模型加载中，请稍候...</div>
<div id="errorMsg" class="error-msg"></div>
<div id="resultArea" style="display:none">
<div class="result-box">
<div class="label">翻译结果</div>
<div id="translationText" class="value"></div>
</div>
</div>
</div>
</div>
<script>
(function(){
'use strict';
var input=document.getElementById('inputText');
var targetLang=document.getElementById('targetLang');
var translateBtn=document.getElementById('translateBtn');
var clearBtn=document.getElementById('clearBtn');
var resultArea=document.getElementById('resultArea');
var translationText=document.getElementById('translationText');
var errorMsg=document.getElementById('errorMsg');
var waitingMsg=document.getElementById('waitingMsg');
var API_URL='https://api.siliconflow.cn/v1/chat/completions';
var API_KEY=localStorage.getItem('sf_api_key')||'';
var MODEL='Qwen/Qwen2-7B-Instruct';

var LANG_MAP={
  en:'English',zh:'Chinese',ja:'Japanese',fr:'French',de:'German',es:'Spanish'
};

function translate(){
  var text=input.value.trim();
  if(!text){showError('请输入要翻译的文本');return;}
  if(!API_KEY){showError('请先设置 API Key');return;}
  setLoading(true);
  hideError();
  hideWaiting();
  resultArea.style.display='none';
  var target=LANG_MAP[targetLang.value]||'English';
  fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
    body:JSON.stringify({model:MODEL,messages:[{role:'system',content:'你是一个翻译助手，请将用户输入的文本翻译成'+target+'，只输出翻译结果，不要解释。'},{role:'user',content:text}],max_tokens:500,temperature:0.3})
  })
  .then(function(r){
    if(!r.ok)return r.json().then(function(d){throw new Error(d.error?.message||'请求失败')});
    return r.json();
  })
  .then(function(data){
    setLoading(false);
    hideWaiting();
    if(data&&data.choices&&data.choices[0]&&data.choices[0].message){
      resultArea.style.display='block';
      translationText.textContent=data.choices[0].message.content;
    }else{
      showError('无法解析返回结果');
    }
  })
  .catch(function(err){
    setLoading(false);
    showError(err.message||'请求失败，请稍后重试');
  });
}

function escapeHtml(str){
    if(!r.ok)return r.json().then(function(d){throw new Error(d.error||'请求失败')});
    return r.json();
  })
  .then(function(data){
    setLoading(false);
    hideWaiting();
    if(data && data[0] && data[0].translation_text){
      resultArea.style.display='block';
      translationText.textContent=data[0].translation_text;
    }else if(data && Array.isArray(data)){
      resultArea.style.display='block';
      translationText.textContent=data.map(function(d){return d.translation_text||d}).join('\n');
    }else{
      var text=JSON.stringify(data);
      if(text && text!=='[]'){resultArea.style.display='block';translationText.textContent=text;}
      else showError('无法解析返回结果');
    }
  })
  .catch(function(err){
    setLoading(false);
    if(err.message==='模型加载中')return;
    showError(err.message||'请求失败，请稍后重试');
  });
}

function setLoading(v){translateBtn.disabled=v;translateBtn.textContent=v?'⏳ 翻译中...':'🌍 翻译';}
function showError(msg){errorMsg.textContent=msg;errorMsg.style.display='block';}
function hideError(){errorMsg.style.display='none';}
function showWaiting(){waitingMsg.style.display='block';}
function hideWaiting(){waitingMsg.style.display='none';}

translateBtn.addEventListener('click',translate);
clearBtn.addEventListener('click',function(){
  input.value='';
  resultArea.style.display='none';
  hideError();
  hideWaiting();
});
input.addEventListener('keydown',function(e){
  if(e.key==='Enter' && e.ctrlKey)translate();
});
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
