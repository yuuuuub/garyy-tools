<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="性能审计工具 - 分析网页性能指标">
    <meta name="robots" content="index, follow">
    <title>性能审计工具</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #dee2e6;
            --card-bg: #f8f9fa;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #444444;
            --card-bg: #2d2d2d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-family: monospace;
            resize: vertical;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
        }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .metric:last-child {
            border-bottom: none;
        }
        .metric-value {
            font-weight: bold;
        }
        .metric-value.good {
            color: var(--success-color);
        }
        .metric-value.average {
            color: var(--warning-color);
        }
        .metric-value.poor {
            color: var(--danger-color);
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .score {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }
        .score.good {
            color: var(--success-color);
        }
        .score.average {
            color: var(--warning-color);
        }
        .score.poor {
            color: var(--danger-color);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>性能审计工具</h1>
        <p>输入HTML代码分析性能指标</p>
        
        <div class="form-group">
            <label for="htmlInput">HTML代码:</label>
            <textarea id="htmlInput" rows="10" placeholder="粘贴HTML代码..."></textarea>
        </div>
        
        <button onclick="runAudit()">开始审计</button>
        
        <div id="result" class="result" style="display: none;">
            <h2>性能审计结果</h2>
            <div id="score" class="score"></div>
            <div id="metrics"></div>
        </div>
    </div>

    <script src="i18n.js" defer></script>
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            html.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
        }

        function runAudit() {
            const htmlInput = document.getElementById('htmlInput').value;
            
            if (!htmlInput) {
                alert('请输入HTML代码');
                return;
            }
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlInput, 'text/html');
            
            const metrics = [];
            let score = 100;
            
            // 检查图片大小
            const images = doc.querySelectorAll('img');
            let largeImages = 0;
            images.forEach(img => {
                const width = parseInt(img.getAttribute('width')) || 0;
                const height = parseInt(img.getAttribute('height')) || 0;
                if (width > 1000 || height > 1000) {
                    largeImages++;
                }
            });
            if (largeImages > 0) {
                score -= largeImages * 5;
                metrics.push({
                    name: '大尺寸图片',
                    value: `${largeImages} 张`,
                    status: 'poor'
                });
            }
            
            // 检查脚本数量
            const scripts = doc.querySelectorAll('script');
            if (scripts.length > 5) {
                score -= (scripts.length - 5) * 3;
                metrics.push({
                    name: '脚本数量',
                    value: `${scripts.length} 个`,
                    status: scripts.length > 10 ? 'poor' : 'average'
                });
            }
            
            // 检查样式表数量
            const stylesheets = doc.querySelectorAll('link[rel="stylesheet"]');
            if (stylesheets.length > 3) {
                score -= (stylesheets.length - 3) * 2;
                metrics.push({
                    name: '样式表数量',
                    value: `${stylesheets.length} 个`,
                    status: stylesheets.length > 5 ? 'poor' : 'average'
                });
            }
            
            // 检查DOM深度
            const allElements = doc.querySelectorAll('*');
            if (allElements.length > 1500) {
                score -= 10;
                metrics.push({
                    name: 'DOM节点数量',
                    value: `${allElements.length} 个`,
                    status: 'poor'
                });
            }
            
            // 检查内联样式
            const inlineStyles = doc.querySelectorAll('[style]');
            if (inlineStyles.length > 10) {
                score -= (inlineStyles.length - 10) * 2;
                metrics.push({
                    name: '内联样式',
                    value: `${inlineStyles.length} 个`,
                    status: 'average'
                });
            }
            
            // 检查meta viewport
            const viewport = doc.querySelector('meta[name="viewport"]');
            if (!viewport) {
                score -= 5;
                metrics.push({
                    name: 'Viewport设置',
                    value: '缺失',
                    status: 'poor'
                });
            }
            
            // 检查文档类型
            const doctype = htmlInput.toLowerCase().includes('<!doctype html>');
            if (!doctype) {
                score -= 5;
                metrics.push({
                    name: '文档类型',
                    value: '缺失',
                    status: 'average'
                });
            }
            
            // 计算最终分数
            score = Math.max(0, Math.min(100, score));
            
            // 显示结果
            const scoreDiv = document.getElementById('score');
            const metricsDiv = document.getElementById('metrics');
            
            scoreDiv.textContent = `${score}分`;
            scoreDiv.className = `score ${score >= 80 ? 'good' : score >= 60 ? 'average' : 'poor'}`;
            
            if (metrics.length === 0) {
                metricsDiv.innerHTML = '<div class="metric"><span>未发现性能问题</span></div>';
            } else {
                metricsDiv.innerHTML = metrics.map(metric => 
                    `<div class="metric">
                        <span>${metric.name}</span>
                        <span class="metric-value ${metric.status}">${metric.value}</span>
                    </div>`
                ).join('');
            }
            
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
