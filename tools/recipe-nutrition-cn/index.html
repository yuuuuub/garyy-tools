<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ 菜谱营养分析</title>
<meta property="og:title" content="🍽️ 菜谱营养分析">
<meta property="og:description" content="🍽️ 菜谱营养分析 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="输入菜谱食材用量，自动计算完整营养成分分析">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#10b981;--accent2:#059669;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#059669;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--blue:#0969da;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:800px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number]{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus{border-color:var(--accent)}
select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.ing-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.ing-row:last-child{border-bottom:none}
.ing-row input[type=text]{flex:2}
.ing-row input[type=number]{flex:1}
.ing-row select{flex:1}
.ing-row button{padding:6px 10px;font-size:.8rem}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0}
.result-item{text-align:center;padding:14px 10px;background:var(--bg);border-radius:10px}
.result-item .val{font-size:1.4rem;font-weight:700;color:var(--accent)}
.result-item .lbl{font-size:.75rem;color:var(--text2);margin-top:4px}
.pie-wrap{display:flex;align-items:center;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap}
.pie-canvas{width:160px;height:160px}
.pie-legend{display:flex;flex-direction:column;gap:6px}
.pie-legend-item{display:flex;align-items:center;gap:8px;font-size:.85rem}
.pie-legend-item .dot{width:12px;height:12px;border-radius:3px}
.bar-wrap{background:var(--bg);border-radius:8px;padding:10px;margin:6px 0}
.bar-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2);margin-bottom:3px}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.empty{text-align:center;padding:30px;color:var(--text2);font-size:.9rem}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;background:var(--accent);color:#fff;margin:2px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🍽️ 菜谱营养分析</h1><p>添加食材和用量，自动计算整道菜的营养成分</p></div>

<div class="cd"><h2>📝 添加食材</h2>
<div style="margin-bottom:12px"><label>快速添加</label>
<div class="bg" id="quickAdd"></div></div>
<div id="ingList"></div>
<div class="bg"><button onclick="addIngRow()">＋ 添加食材</button><button class="sec" onclick="analyze()">📊 分析营养</button></div></div>

<div class="cd" id="resultCard" style="display:none"><h2>📊 营养分析结果</h2>
<div class="result-grid" id="summaryGrid"></div>
<div class="pie-wrap"><canvas id="pieCanvas" class="pie-canvas" width="160" height="160"></canvas><div class="pie-legend" id="pieLegend"></div></div>
<div id="barsSection"></div>
<div class="bg"><button onclick="saveDish()">💾 保存菜谱</button><button class="sec" onclick="exportResult()">📋 复制结果</button></div></div>

<div class="cd"><h2>💾 历史菜谱</h2><div id="historyList" class="empty">暂无保存的菜谱</div></div>
</div>
<script>
var DB='recipe_nutrition_cn',history=JSON.parse(localStorage.getItem(DB)||'[]');
var DB_MAP={
'鸡胸肉':{cal:165,p:31,c:0,f:3.6},'猪肉':{cal:143,p:21,c:0,f:6.1},'牛肉':{cal:250,p:26,c:0,f:15},
'鸡蛋':{cal:144,p:13.3,c:1.5,f:9.5},'虾':{cal:99,p:20.4,c:0.2,f:1.7},'豆腐':{cal:76,p:8.1,c:1.9,f:3.7},
'米饭':{cal:116,p:2.6,c:25.9,f:0.3},'面条':{cal:138,p:4.5,c:25.2,f:1.6},'土豆':{cal:77,p:2,c:17.5,f:0.1},
'番茄':{cal:18,p:0.9,c:3.9,f:0.2},'鸡蛋':{cal:144,p:13.3,c:1.5,f:9.5},'青椒':{cal:20,p:0.9,c:4.6,f:0.2},
'洋葱':{cal:40,p:1.1,c:9.3,f:0.1},'胡萝卜':{cal:41,p:0.9,c:9.6,f:0.2},'白菜':{cal:13,p:1.5,c:2.2,f:0.2},
'菜籽油':{cal:884,p:0,c:0,f:100},'花生油':{cal:884,p:0,c:0,f:100},'酱油':{cal:53,p:5.6,c:5.4,f:0.1},
'盐':{cal:0,p:0,c:0,f:0},'糖':{cal:387,p:0,c:100,f:0},'醋':{cal:18,p:0.4,c:3.6,f:0},
'大蒜':{cal:149,p:6.4,c:33.1,f:0.5},'生姜':{cal:80,p:1.8,c:17.8,f:0.8},'料酒':{cal:62,p:1.1,c:5,f:0},
'蚝油':{cal:130,p:4.5,c:25,f:0},'淀粉':{cal:381,p:0.1,c:91.3,f:0},'面粉':{cal:364,p:10.3,c:76.3,f:1},
'牛奶':{cal:61,p:3.2,c:4.8,f:3.3},'酸奶':{cal:97,p:3.5,c:12,f:3.3},'芝士':{cal:350,p:25,c:1.3,f:27},
'苹果':{cal:52,p:0.3,c:13.8,f:0.2},'香蕉':{cal:89,p:1.1,c:22.8,f:0.3},'蜂蜜':{cal:304,p:0.3,c:82.4,f:0}
};
var quickItems=['鸡胸肉','猪肉','牛肉','鸡蛋','米饭','番茄','土豆','青椒','洋葱','豆腐','菜籽油','酱油','盐','糖'];

function addIngRow(name,amount,unit){
var div=document.getElementById('ingList');
var row=document.createElement('div');row.className='ing-row';
row.innerHTML='<input type="text" value="'+(name||'')+'" placeholder="食材名称" class="ing-name" list="foodList">'+
'<input type="number" value="'+(amount||100)+'" min="1" class="ing-amount" placeholder="克">'+
'<select class="ing-unit"><option value="g">克</option><option value="ml">毫升</option><option value="勺">勺</option><option value="个">个</option></select>'+
'<button class="dng" onclick="this.parentElement.remove()">✕</button>';
div.appendChild(row);
}
function analyze(){
var rows=document.querySelectorAll('.ing-row');if(!rows.length){alert('请先添加食材');return;}
var total={cal:0,p:0,c:0,f:0},items=[];
rows.forEach(function(r){
var name=r.querySelector('.ing-name').value.trim();
var amt=parseFloat(r.querySelector('.ing-amount').value)||100;
var info=DB_MAP[name];if(!info)return;
var mul=amt/100;
total.cal+=info.cal*mul;total.p+=info.p*mul;total.c+=info.c*mul;total.f+=info.f*mul;
items.push({name:name,amount:amt,cal:Math.round(info.cal*mul),p:info.p*mul,c:info.c*mul,f:info.f*mul});
});
if(!items.length){alert('未识别到已知食材，请检查输入');return;}
document.getElementById('resultCard').style.display='block';
document.getElementById('summaryGrid').innerHTML=[
{v:Math.round(total.cal),l:'总热量(千卡)'},{v:total.p.toFixed(1)+'g',l:'蛋白质'},
{v:total.c.toFixed(1)+'g',l:'碳水化合物'},{v:total.f.toFixed(1)+'g',l:'脂肪'}
].map(function(i){return '<div class="result-item"><div class="val">'+i.v+'</div><div class="lbl">'+i.l+'</div></div>'}).join('');
var pcts=[{name:'蛋白质',val:total.p*4,color:'#22c55e'},{name:'碳水',val:total.c*4,color:'#3b82f6'},{name:'脂肪',val:total.f*9,color:'#eab308'}];
var totalCal=pcts.reduce(function(a,b){return a+b.val},0);
drawPie(pcts.map(function(p){return{color:p.color,pct:totalCal?p.val/totalCal*100:0}}));
document.getElementById('pieLegend').innerHTML=pcts.map(function(p){var pct=totalCal?(p.val/totalCal*100).toFixed(1):0;return '<div class="pie-legend-item"><div class="dot" style="background:'+p.color+'"></div><span>'+p.name+' '+pct+'%</span></div>'}).join('');
var dris=[{name:'蛋白质',val:total.p,max:65,unit:'g',color:'var(--green)'},{name:'碳水',val:total.c,max:300,unit:'g',color:'var(--blue)'},{name:'脂肪',val:total.f,max:60,unit:'g',color:'var(--yellow)'}];
document.getElementById('barsSection').innerHTML='<h3 style="margin:16px 0 8px;color:var(--accent)">每日推荐比例</h3>'+dris.map(function(d){
var pct=Math.min(100,d.val/d.max*100);
return '<div class="bar-wrap"><div class="bar-label"><span>'+d.name+'</span><span>'+d.val.toFixed(1)+d.unit+' / '+d.max+d.unit+' ('+pct.toFixed(1)+'%)</span></div><div class="bar"><div class="bar-fill" style="width:'+pct+'%;background:'+d.color+'"></div></div></div>';
}).join('');
}
function drawPie(segs){
var cv=document.getElementById('pieCanvas'),ctx=cv.getContext('2d'),cx=80,cy=80,r=70,start=-Math.PI/2;
ctx.clearRect(0,0,160,160);
segs.forEach(function(s){
var angle=s.pct/100*Math.PI*2;
ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,start+angle);ctx.closePath();
ctx.fillStyle=s.color;ctx.fill();start+=angle;
});
ctx.beginPath();ctx.arc(cx,cy,35,0,Math.PI*2);ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg');ctx.fill();
}
function saveDish(){
var name=prompt('请输入菜谱名称:');if(!name)return;
var rows=document.querySelectorAll('.ing-row');
var ings=[];
rows.forEach(function(r){ings.push(r.querySelector('.ing-name').value+' '+r.querySelector('.ing-amount').value+'g');});
history.unshift({name:name,ings:ings,time:new Date().toLocaleString()});
history=history.slice(0,20);localStorage.setItem(DB,JSON.stringify(history));renderHistory();
}
function exportResult(){
var el=document.getElementById('summaryGrid');var text='菜谱营养分析结果\n';
document.querySelectorAll('.result-item').forEach(function(i){text+=i.querySelector('.lbl').textContent+': '+i.querySelector('.val').textContent+'\n';});
navigator.clipboard.writeText(text);alert('已复制到剪贴板');
}
function renderHistory(){
if(!history.length){document.getElementById('historyList').innerHTML='<div class="empty">暂无保存的菜谱</div>';return;}
document.getElementById('historyList').innerHTML=history.map(function(h,i){
return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)"><div><b>'+h.name+'</b><div style="font-size:.8rem;color:var(--text2)">'+h.ings.join('、')+'</div><div style="font-size:.75rem;color:var(--text2)">'+h.time+'</div></div><button class="dng" style="padding:4px 10px;font-size:.75rem" onclick="history.splice('+i+',1);localStorage.setItem(DB,JSON.stringify(history));renderHistory()">删除</button></div>';
}).join('');
}
quickItems.forEach(function(n){
var btn=document.createElement('button');btn.className='sec';btn.textContent=n;btn.style.padding='4px 10px';btn.style.fontSize='.8rem';
btn.onclick=function(){addIngRow(n,100,'g')};
document.getElementById('quickAdd').appendChild(btn);
});
addIngRow('鸡胸肉',200);addIngRow('酱油',15);addIngRow('菜籽油',10);
renderHistory();
</script>
</body>
</html>
