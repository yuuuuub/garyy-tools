<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚖️ 决策日志</title>
<meta name="description" content="决策记录工具，追踪团队关键决策、备选方案和决策依据">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.decision-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;transition:all .2s}
.decision-card:hover{border-color:var(--accent)}
.decision-card .dheader{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.decision-card .dtitle{font-weight:700;font-size:1.05rem}
.decision-card .ddate{font-size:.8rem;color:var(--text2);margin-top:2px}
.status-badge{padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:600}
.status-pending{background:rgba(210,153,34,.15);color:var(--yellow)}
.status-approved{background:rgba(63,185,80,.15);color:var(--green)}
.status-rejected{background:rgba(248,81,73,.15);color:var(--red)}
.status-review{background:rgba(168,85,247,.15);color:var(--purple)}
.options-list{margin-top:12px}
.option{padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.option.selected{border-color:var(--green);background:rgba(63,185,80,.05)}
.option .opro{font-weight:600;font-size:.9rem}
.option .ocon{font-size:.8rem;color:var(--text2)}
.option .ocheck{color:var(--green);font-size:1.1rem}
.section-label{font-size:.85rem;font-weight:600;color:var(--text2);margin-top:14px;margin-bottom:6px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:20px;font-size:.8rem;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text2);transition:all .2s}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{color:var(--text2);text-align:center;padding:30px;font-size:.9rem}
@media(max-width:768px){body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="⚖️ 决策日志">
<meta property="og:description" content="决策记录工具，追踪团队关键决策、备选方案和决策依据">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/decision-log-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='dlog_data';
let state=JSON.parse(localStorage.getItem(STORE)||'{"decisions":[]}');
if(!state.decisions.length){
  state.decisions=[{id:'d1',title:'采用React还是Vue',date:new Date().toISOString().slice(0,10),context:'新项目前端框架选型',status:'approved',
    options:[{name:'React',pros:'生态丰富、人才多',cons:'学习曲线陡',selected:true},{name:'Vue',pros:'上手简单、文档好',cons:'大型项目生态略弱',selected:false}],
    rationale:'团队React经验较多，生态组件库更丰富',
    decision:'采用React + TypeScript',
    owner:'技术负责人',
    reviewDate:'2025-07-01'},
    {id:'d2',title:'数据库选型：MySQL vs PostgreSQL',date:new Date().toISOString().slice(0,10),context:'后端服务数据库选择',status:'review',
      options:[{name:'MySQL',pros:'广泛使用、运维成熟',cons:'高级特性较少',selected:false},{name:'PostgreSQL',pros:'功能强大、扩展好',cons:'运维复杂度高',selected:false}],
      rationale:'',decision:'',owner:'后端团队',reviewDate:''}
  ];
}
let currentFilter='all',showModal=false,editingDecision=null;

function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function genId(){return'id'+Date.now()+Math.random().toString(36).slice(2,6)}

function render(){
  let h=`<div class="hdr"><h1>⚖️ 决策日志</h1><p>记录和追踪关键决策</p></div>`;
  h+=`<div class="cd"><div class="flex-between"><h2 style="margin:0">决策记录</h2><button onclick="openNew()">+ 新决策</button></div>`;
  h+=`<div class="filter-bar">`;
  ['all','pending','review','approved','rejected'].forEach(f=>{
    const labels={all:'全部',pending:'待定',review:'评审中',approved:'已批准',rejected:'已否决'};
    const count=f==='all'?state.decisions.length:state.decisions.filter(d=>d.status===f).length;
    h+=`<div class="filter-btn ${currentFilter===f?'active':''}" onclick="currentFilter='${f}';render()">${labels[f]} (${count})</div>`;
  });
  h+=`</div></div>`;

  const filtered=currentFilter==='all'?state.decisions:state.decisions.filter(d=>d.status===currentFilter);
  if(!filtered.length)h+=`<div class="cd"><p class="empty">暂无${currentFilter==='all'?'':('状态为'+currentFilter+'的')}决策记录</p></div>`;
  filtered.forEach(d=>{
    h+=`<div class="decision-card"><div class="dheader"><div><div class="dtitle">${d.title}</div><div class="ddate">📅 ${d.date} · 🧑‍💼 ${d.owner||'未指派'} ${d.reviewDate?'· 🔄 评审日：'+d.reviewDate:''}</div></div><span class="status-badge status-${d.status}">${{pending:'⏳ 待定',review:'🔍 评审中',approved:'✅ 已批准',rejected:'❌ 已否决'}[d.status]}</span></div>`;
    h+=`<div class="section-label">📌 背景</div><p style="font-size:.9rem;color:var(--text2)">${d.context}</p>`;
    if(d.options.length){
      h+=`<div class="section-label">🔀 备选方案</div><div class="options-list">`;
      d.options.forEach(o=>{
        h+=`<div class="option ${o.selected?'selected':''}"><div><div class="opro">${o.selected?'✅ ':''} ${o.name}</div><div class="ocon">优势：${o.pros} | 劣势：${o.cons}</div></div></div>`;
      });
      h+=`</div>`;
    }
    if(d.rationale)h+=`<div class="section-label">💡 决策依据</div><p style="font-size:.9rem">${d.rationale}</p>`;
    if(d.decision)h+=`<div class="section-label">🎯 最终决策</div><p style="font-size:.9rem;font-weight:600;color:var(--green)">${d.decision}</p>`;
    h+=`<div class="flex" style="margin-top:12px"><button class="sec" onclick="editDecision('${d.id}')" style="padding:6px 12px;font-size:.8rem">✏️ 编辑</button><button class="dng" onclick="deleteDecision('${d.id}')" style="padding:6px 12px;font-size:.8rem">🗑️ 删除</button></div></div>`;
  });

  if(showModal)h+=renderModal();
  $('app').innerHTML=h;
}

function renderModal(){
  const isEdit=!!editingDecision?.id;
  const d=editingDecision||{};
  let opts=editingDecision?.options||[{name:'',pros:'',cons:'',selected:false}];
  let h=`<div class="modal-overlay" onclick="showModal=false;editingDecision=null;render()"><div class="modal" onclick="event.stopPropagation()">`;
  h+=`<h2 style="margin-bottom:16px">${isEdit?'✏️ 编辑决策':'📝 新决策'}</h2>`;
  h+=`<label>决策标题</label><input id="mTitle" value="${d.title||''}" placeholder="例：采用React还是Vue">`;
  h+=`<label>背景说明</label><textarea id="mContext" placeholder="为什么需要做这个决策？">${d.context||''}</textarea>`;
  h+=`<label>负责人</label><input id="mOwner" value="${d.owner||''}" placeholder="决策负责人">`;
  h+=`<label>状态</label><select id="mStatus"><option value="pending" ${d.status==='pending'?'selected':''}>待定</option><option value="review" ${d.status==='review'?'selected':''}>评审中</option><option value="approved" ${d.status==='approved'?'selected':''}>已批准</option><option value="rejected" ${d.status==='rejected'?'selected':''}>已否决</option></select>`;
  h+=`<label>评审日期</label><input type="date" id="mReview" value="${d.reviewDate||''}">`;
  h+=`<div class="section-label">🔀 备选方案</div><div id="mOptions">`;
  opts.forEach((o,i)=>{
    h+=`<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px"><div class="flex" style="justify-content:space-between"><input id="mOptName${i}" value="${o.name}" placeholder="方案名称" style="flex:1;margin:0"><input id="mOptPros${i}" value="${o.pros}" placeholder="优势" style="flex:1;margin:0"><input id="mOptCons${i}" value="${o.cons}" placeholder="劣势" style="flex:1;margin:0"><label style="margin:0;display:flex;align-items:center;gap:4px"><input type="checkbox" id="mOptSel${i}" ${o.selected?'checked':''}> 选中</label></div></div>`;
  });
  h+=`</div>`;
  h+=`<label>决策依据</label><textarea id="mRationale" placeholder="为什么选择这个方案？">${d.rationale||''}</textarea>`;
  h+=`<label>最终决策</label><input id="mDecision" value="${d.decision||''}" placeholder="最终决定">`;
  h+=`<div class="flex" style="margin-top:16px;justify-content:flex-end"><button class="sec" onclick="showModal=false;editingDecision=null;render()">取消</button><button onclick="saveDecision()">${isEdit?'保存':'创建'}</button></div>`;
  h+=`</div></div>`;
  return h;
}

function openNew(){editingDecision={options:[{name:'',pros:'',cons:'',selected:false}]};showModal=true;render()}
function editDecision(id){
  const d=state.decisions.find(x=>x.id===id);
  editingDecision={...d,options:d.options.map(o=>({...o}))};showModal=true;render();
}
function saveDecision(){
  const title=$('mTitle').value.trim();
  if(!title){alert('请输入标题');return}
  const d={
    id:editingDecision?.id||genId(),title,date:editingDecision?.date||new Date().toISOString().slice(0,10),
    context:$('mContext').value.trim(),owner:$('mOwner').value.trim(),
    status:$('mStatus').value,reviewDate:$('mReview').value,
    options:[{name:$('mOptName0')?.value||'',pros:$('mOptPros0')?.value||'',cons:$('mOptCons0')?.value||'',selected:$('mOptSel0')?.checked||false}],
    rationale:$('mRationale').value.trim(),decision:$('mDecision').value.trim()
  };
  const idx=state.decisions.findIndex(x=>x.id===d.id);
  if(idx>=0)state.decisions[idx]=d;else state.decisions.unshift(d);
  save();showModal=false;editingDecision=null;render();
}
function deleteDecision(id){if(!confirm('确定删除？'))return;state.decisions=state.decisions.filter(d=>d.id!==id);save();render()}
render();
</script>
</body>
</html>
