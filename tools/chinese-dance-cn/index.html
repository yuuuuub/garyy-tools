<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国传统舞蹈百科 - Chinese Traditional Dance Encyclopedia</title>
<meta name="description" content="中国传统舞蹈百科，涵盖古典舞、民族舞、民间舞、宫廷舞等各类舞蹈的历史与特色">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国传统舞蹈百科 - Chinese Traditional Dance Encyclopedia">
<meta property="og:description" content="中国传统舞蹈百科，涵盖古典舞、民族舞、民间舞、宫廷舞等各类舞蹈的历史与特色">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-dance-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💃</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#c9a0dc;--accent2:#a080b9}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#8250df;--accent2:#6639ba}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#150a20 0%,#201030 50%,#2a1a40 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #4a2a6a;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#c9a0dc,#a080b9,#8a60a9,#7a50a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.dance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.dance-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.dance-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.dance-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.dance-card .dance-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dance-card .dance-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(201,160,220,0.15);color:var(--accent)}
.dance-card .dance-name{font-size:1.3em;font-weight:bold}
.dance-card .dance-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.dance-card .dance-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.dance-card .dance-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.dance-card .dance-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.dance-card .dance-detail strong{color:var(--text)}
.dance-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.dance-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>💃 中国传统舞蹈百科</h1>
<p>Chinese Traditional Dance Encyclopedia — 探索古典舞、民族舞、民间舞的艺术魅力</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索舞蹈类型、特色或代表作品...（如"古典舞""孔雀舞""秧歌"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部舞蹈</button>
<button class="filter-btn" data-filter="古典舞">🩰 古典舞</button>
<button class="filter-btn" data-filter="民族舞">🏔️ 民族舞</button>
<button class="filter-btn" data-filter="民间舞">🎪 民间舞</button>
<button class="filter-btn" data-filter="宫廷舞">👑 宫廷舞</button>
<button class="filter-btn" data-filter="宗教舞">🙏 宗教舞</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="dance-grid" id="danceGrid"></div>
<footer><p>💃 中国传统舞蹈百科 — 长袖善舞，翩若惊鸿</p></footer>
</div>
<script>
const DANCE_DATA=[
  {id:1,name:"中国古典舞",en:"Chinese Classical Dance",category:"古典舞",icon:"🩰",origin:"北京",dynasty:"新中国",features:"身韵、技术技巧",history:"中国古典舞是新中国成立后在传统戏曲舞蹈基础上发展起来的舞蹈体系，融合了戏曲、武术、芭蕾等多种元素。",elements:["身韵","技术技巧","身法","步法","手位","眼法","扇子功","水袖功"],masterpieces:["飞天","黄河","丝路花雨","扇舞丹青","爱莲说","秦俑魂","踏歌","粉墨登场"],culture:"中国古典舞以'圆'为核心审美，讲究'形神兼备、内外统一'，体现了中国传统文化的精髓。"},
  {id:2,name:"傣族孔雀舞",en:"Dai Peacock Dance",category:"民族舞",icon:"🦚",origin:"云南",dynasty:"古代",features:"模仿孔雀、柔美灵动",history:"孔雀舞是傣族最具代表性的舞蹈，模仿孔雀的动作和神态，表现孔雀的美丽和善良。杨丽萍的《雀之灵》使孔雀舞走向世界。",elements:["手形","眼神","身体曲线","脚步","呼吸","头饰","服饰","音乐"],masterpieces:["雀之灵","雨林","月光","两棵树","雀之恋","竹影","水之灵","自然"],culture:"孔雀在傣族文化中是吉祥、美丽、善良的象征，孔雀舞寄托了傣族人民对美好生活的向往。"},
  {id:3,name:"藏族锅庄舞",en:"Tibetan Guozhuang Dance",category:"民族舞",icon:"🏔️",origin:"西藏",dynasty:"古代",features:"圆圈舞、豪放热烈",history:"锅庄舞是藏族三大民间舞蹈之一，藏语意为'圆圈舞'。舞者围成圆圈，边歌边舞，气氛热烈。",elements:["甩袖","踏步","旋转","弯腰","甩头","顿足","跳跃","对歌"],masterpieces:["翻身农奴把歌唱","洗衣歌","弓箭舞","弦子舞","踢踏舞","锅庄","热巴","卓舞"],culture:"锅庄舞是藏族人民生活中不可或缺的一部分，节日、庆典、聚会时都要跳锅庄舞。"},
  {id:4,name:"蒙古族安代舞",en:"Mongolian Andai Dance",category:"民族舞",icon:"🏇",origin:"内蒙古",dynasty:"清代",features:"甩巾、节奏明快",history:"安代舞是蒙古族最具代表性的舞蹈之一，起源于清代，最初是萨满巫师治病的一种仪式，后发展为群众性舞蹈。",elements:["甩巾","踏步","旋转","弯腰","跳跃","抖肩","顿足","挥手"],masterpieces:["安代舞","筷子舞","顶碗舞","盅碗舞","牧马舞","雁舞","鄂尔多斯舞","筷子"],culture:"安代舞以其热情奔放的风格著称，是蒙古族人民表达喜悦和祝福的重要方式。"},
  {id:5,name:"秧歌",en:"Yangge Dance",category:"民间舞",icon:"🎪",origin:"北方各地",dynasty:"宋代",features:"扭、唱、扮、舞",history:"秧歌是中国北方最具代表性的民间舞蹈，起源于农业生产劳动，已有千年历史。分为东北秧歌、陕北秧歌、山东秧歌等。",elements:["扭","唱","扮","舞","扇子","手绢","绸带","锣鼓"],masterpieces:["东北大秧歌","陕北秧歌","山东鼓子秧歌","河北地秧歌","海阳秧歌","鼓子秧歌","胶州秧歌","胶南秧歌"],culture:"秧歌是中国农耕文化的体现，反映了劳动人民的喜悦和对美好生活的向往。"},
  {id:6,name:"敦煌飞天舞",en:"Dunhuang Flying Apsara Dance",category:"古典舞",icon:"🧚",origin:"甘肃",dynasty:"唐代",features:"飘逸灵动、壁画复原",history:"敦煌飞天舞根据敦煌壁画中的飞天形象创作，再现了唐代飞天的优美姿态。《丝路花雨》是其代表作品。",elements:["手位","身韵","呼吸","眼神","水袖","飘带","旋转","腾跳"],masterpieces:["丝路花雨","飞天","反弹琵琶","千手观音","敦煌乐舞","天宫伎乐","伎乐天","飞天仙女"],culture:"飞天是敦煌艺术的标志性形象，代表了中国古代对自由和美好的追求。"},
  {id:7,name:"朝鲜族长鼓舞",en:"Korean Long Drum Dance",category:"民族舞",icon:"🥁",origin:"东北",dynasty:"古代",features:"击鼓旋转、轻盈飘逸",history:"长鼓舞是朝鲜族最具代表性的舞蹈之一，舞者身挎长鼓，边击鼓边舞蹈，节奏明快，动作优美。",elements:["击鼓","旋转","跳跃","跪地","翻身","抖肩","碎步","摆裙"],masterpieces:["长鼓舞","象帽舞","扇子舞","顶水舞","农乐舞","假面舞","杖鼓舞","沙漏舞"],culture:"长鼓舞体现了朝鲜族人民乐观向上的精神风貌和对生活的热爱。"},
  {id:8,name:"维吾尔族赛乃姆",en:"Uyghur Sanam Dance",category:"民族舞",icon:"🎶",origin:"新疆",dynasty:"古代",features:"旋转灵活、热情奔放",history:"赛乃姆是维吾尔族最具代表性的民间舞蹈，以其灵活的旋转和热情奔放的风格著称。",elements:["旋转","扭腰","耸肩","手腕","眼神","移颈","点步","滑步"],masterpieces:["赛乃姆","刀郎舞","萨玛舞","纳孜尔库姆","盘子舞","手鼓舞","夏地亚纳","多朗舞"],culture:"赛乃姆是维吾尔族文化的重要组成部分，体现了丝绸之路上多元文化的交融。"},
  {id:9,name:"苗族芦笙舞",en:"Miao Lusheng Dance",category:"民族舞",icon:"🎶",origin:"贵州",dynasty:"古代",features:"吹芦笙、舞步丰富",history:"芦笙舞是苗族最具代表性的舞蹈，舞者边吹芦笙边跳舞，舞步丰富多样，气氛热烈。",elements:["吹笙","旋转","跳跃","踏步","弯腰","摆手","顿足","对舞"],masterpieces:["芦笙舞","锦鸡舞","板凳舞","铜鼓舞","木鼓舞","古瓢舞","踩鼓舞","花鼓舞"],culture:"芦笙舞是苗族节日庆典中不可或缺的活动，体现了苗族人民对自然和祖先的崇拜。"},
  {id:10,name:"宫廷乐舞",en:"Court Dance",category:"宫廷舞",icon:"👑",origin:"京城",dynasty:"唐代",features:"华丽壮观、礼仪规范",history:"宫廷乐舞是中国古代宫廷中使用的舞蹈，用于祭祀、朝会、宴飨等场合。唐代是宫廷乐舞的鼎盛时期。",elements:["队列","服饰","道具","音乐","礼仪","队形","步伐","手势"],masterpieces:["霓裳羽衣曲","秦王破阵乐","春莺啭","踏摇娘","兰陵王","大面","泼头","代面"],culture:"宫廷乐舞体现了中国古代礼乐制度和皇权威严，是国家文化软实力的重要体现。"}
];
function renderCards(data){
  document.getElementById('danceGrid').innerHTML=data.map(d=>`
    <div class="dance-card" data-category="${d.category}">
      <div class="dance-header"><div class="dance-icon">${d.icon}</div><div><div class="dance-name">${d.name}</div><div class="dance-sub">${d.en} · ${d.origin}</div></div></div>
      <div class="dance-meta"><span>${d.dynasty}</span><span>${d.features}</span></div>
      <div class="dance-detail"><strong>历史：</strong>${d.history}</div>
      <div class="dance-detail"><strong>舞蹈元素：</strong>${d.elements.join('、')}</div>
      <div class="dance-detail"><strong>代表作品：</strong>${d.masterpieces.join('、')}</div>
      <div class="dance-detail"><strong>文化内涵：</strong>${d.culture}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(d=>{cats[d.category]=(cats[d.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">舞蹈类型</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.dance-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.dance-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(DANCE_DATA);renderStats(DANCE_DATA);
</script>
</body>
</html>
