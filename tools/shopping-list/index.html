<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>购物清单 - garyy-tools</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;margin-bottom:4px}
.sub{color:var(--text2);font-size:.85rem}
button{padding:9px 20px;border-radius:6px;border:none;background:var(--blue);color:#fff;font-size:.85rem;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.85}
input,textarea,select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.9rem;width:100%;outline:none;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-gold{background:var(--gold);color:#000}
.input-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.input-row input[type="text"]{flex:1;min-width:150px}
.input-row input[type="number"]{width:80px;flex-shrink:0}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:none}
.item .ck{width:18px;height:18px;cursor:pointer;accent-color:var(--green);flex-shrink:0}
.item .name{flex:1;font-size:.9rem;word-break:break-all}
.item .name.done{text-decoration:line-through;color:var(--text2)}
.item .qty{color:var(--text2);font-size:.82rem;flex-shrink:0;min-width:40px;text-align:right}
.item .del-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:.9rem;padding:4px 8px;border-radius:4px;flex-shrink:0}
.item .del-btn:hover{background:rgba(239,68,68,.15)}
.action-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.action-bar button{font-size:.8rem;padding:6px 14px}
.count-info{text-align:center;color:var(--text2);font-size:.82rem;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🛒 购物清单</h1>
<div class="sub">买菜购物必备</div>
</header>

<div class="card">
<div class="input-row">
<input type="text" id="inputName" placeholder="商品名称" maxlength="50">
<input type="number" id="inputQty" value="1" min="1" max="999">
<button class="btn-green" id="btnAdd">添加</button>
</div>

<div id="listContent"></div>

<div class="action-bar">
<button class="btn-gold" id="btnClearBought">清空已购</button>
<button class="btn-red" id="btnClearAll">清空全部</button>
</div>
</div>
</div>

<script src="../i18n.js"></script>
<script>
(function(){
'use strict';
let items=JSON.parse(localStorage.getItem('garyy_shopping')||'[]');

function save(){
localStorage.setItem('garyy_shopping',JSON.stringify(items));
render();
}

function escHtml(s){
return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
const el=document.getElementById('listContent');
const total=items.length;
const bought=items.filter(function(i){return i.done;}).length;

if(total===0){
el.innerHTML='<div style="text-align:center;color:var(--text2);padding:30px 0;font-size:.9rem">购物清单为空</div>';
return;
}

let html='';
items.forEach(function(item,idx){
html+='<div class="item">'+
'<input type="checkbox" class="ck" data-idx="'+idx+'"'+(item.done?' checked':'')+'>'+
'<span class="name'+(item.done?' done':'')+'">'+escHtml(item.name)+'</span>'+
'<span class="qty">x'+item.qty+'</span>'+
'<button class="del-btn" data-idx="'+idx+'">✕</button>'+
'</div>';
});
el.innerHTML=html;

el.querySelectorAll('.ck').forEach(function(cb){
cb.addEventListener('change',function(){
const idx=parseInt(this.dataset.idx);
items[idx].done=this.checked;
save();
});
});
el.querySelectorAll('.del-btn').forEach(function(btn){
btn.addEventListener('click',function(){
const idx=parseInt(this.dataset.idx);
items.splice(idx,1);
save();
});
});
}

document.getElementById('btnAdd').addEventListener('click',function(){
const name=document.getElementById('inputName').value.trim();
const qty=parseInt(document.getElementById('inputQty').value)||1;
if(!name)return;
items.push({name:name,qty:qty,done:false});
document.getElementById('inputName').value='';
save();
});

document.getElementById('inputName').addEventListener('keydown',function(e){
if(e.key==='Enter')document.getElementById('btnAdd').click();
});

document.getElementById('btnClearBought').addEventListener('click',function(){
if(!items.some(function(i){return i.done;}))return;
if(confirm('确定清空所有已购商品？')){
items=items.filter(function(i){return !i.done;});
save();
}
});

document.getElementById('btnClearAll').addEventListener('click',function(){
if(items.length===0)return;
if(confirm('确定清空整个购物清单？')){
items=[];
save();
}
});

render();
})();
</script>
</body>
</html>
