<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酒店比价工具</title>
<meta property="og:title" content="酒店比价工具">
<meta property="og:description" content="酒店比价工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="比较不同平台酒店价格，帮你找到最划算的住宿方案">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#3fb950;--yellow:#d29922;--red:#f85149}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;padding:16px}
.header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.header h1{font-size:20px;white-space:nowrap}
.header h1 span{font-size:24px}
.search-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--text2);font-weight:600}
.field select,.field input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{opacity:.85}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.summary-card .val{font-size:22px;font-weight:700}
.summary-card .lbl{font-size:11px;color:var(--text2);margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:12px;transition:all .15s}
.filter-chip:hover,.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.hotels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.hotel-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .2s}
.hotel-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.hotel-img{height:160px;background:linear-gradient(135deg,var(--accent),#6366f1);display:flex;align-items:center;justify-content:center;font-size:64px;position:relative}
.hotel-img .rating{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.hotel-img .best-price{position:absolute;top:8px;left:8px;background:var(--green);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.hotel-info{padding:16px}
.hotel-info h3{font-size:16px;margin-bottom:4px}
.hotel-info .location{font-size:12px;color:var(--text2);margin-bottom:8px}
.hotel-info .amenities{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.hotel-info .amenity{background:var(--bg);border-radius:4px;padding:2px 6px;font-size:10px;color:var(--text2)}
.hotel-info .price-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:12px}
.hotel-info .price-row .price{font-size:20px;font-weight:700;color:var(--accent)}
.hotel-info .price-row .price small{font-size:12px;font-weight:400;color:var(--text2)}
.hotel-info .price-row .compare{font-size:11px;color:var(--green)}
.price-platforms{padding:0 16px 16px;display:flex;gap:8px;flex-wrap:wrap}
.platform-price{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:11px;display:flex;align-items:center;gap:4px}
.platform-price .p-name{color:var(--text2)}
.platform-price .p-price{font-weight:600;color:var(--accent)}
.platform-price.lowest{border-color:var(--green);background:rgba(63,185,80,.05)}
.empty{text-align:center;padding:60px;color:var(--text2);grid-column:1/-1}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="header">
<h1><span>🏨</span> 酒店比价工具</h1>
<div style="margin-left:auto;font-size:13px;color:var(--text2)" id="resultInfo"></div>
</div>
<div class="search-bar">
<div class="field">
<label>城市</label>
<select id="city">
<option value="上海">上海</option><option value="北京">北京</option><option value="广州">广州</option>
<option value="深圳">深圳</option><option value="杭州">杭州</option><option value="成都">成都</option>
<option value="西安">西安</option><option value="重庆">重庆</option><option value="南京">南京</option>
<option value="三亚">三亚</option>
</select>
</div>
<div class="field">
<label>入住日期</label>
<input type="date" id="checkin">
</div>
<div class="field">
<label>退房日期</label>
<input type="date" id="checkout">
</div>
<div class="field">
<label>房间数</label>
<select id="rooms"><option>1间</option><option>2间</option><option>3间</option></select>
</div>
<div class="field">
<label>价格范围</label>
<select id="priceRange">
<option value="all">不限</option>
<option value="0-300">¥300以下</option>
<option value="300-600">¥300-600</option>
<option value="600-1000">¥600-1000</option>
<option value="1000+">¥1000以上</option>
</select>
</div>
<button class="btn" onclick="searchHotels()">🔍 搜索</button>
</div>
<div class="summary">
<div class="summary-card"><div class="val" id="sumTotal">0</div><div class="lbl">搜索结果</div></div>
<div class="summary-card"><div class="val" id="sumMin" style="color:var(--green)">--</div><div class="lbl">最低价/晚</div></div>
<div class="summary-card"><div class="val" id="sumAvg" style="color:var(--accent)">--</div><div class="lbl">平均价/晚</div></div>
<div class="summary-card"><div class="val" id="sumSaved" style="color:var(--yellow)">--</div><div class="lbl">可节省</div></div>
</div>
<div class="filters">
<button class="filter-chip active" onclick="setStar(0,this)">全部星级</button>
<button class="filter-chip" onclick="setStar(5,this)">⭐⭐⭐⭐⭐</button>
<button class="filter-chip" onclick="setStar(4,this)">⭐⭐⭐⭐</button>
<button class="filter-chip" onclick="setStar(3,this)">⭐⭐⭐</button>
<button class="filter-chip" onclick="setStar(2,this)">⭐⭐</button>
</div>
<div class="hotels-grid" id="hotelsGrid"></div>
<script>
const platforms=[{name:'携程',color:'#2577e3'},{name:'美团',color:'#ffc300'},{name:'飞猪',color:'#ff6a00'},{name:'Booking',color:'#003580'},{name:'同程',color:'#00a0e9'}];
const hotelTypes=['商务酒店','精品酒店','度假酒店','民宿','青旅','公寓','客栈','温泉酒店','海景酒店'];
const amenitiesList=['WiFi','早餐','停车场','泳池','健身房','洗衣','接机','会议室','儿童乐园','温泉'];
let allHotels=[];let currentStar=0;
function genHotels(){
const hotels=[];
const city=document.getElementById('city').value;
for(let i=0;i<24;i++){
const star=Math.random()>0.4?4:Math.random()>0.5?5:Math.random()>0.5?3:2;
const type=hotelTypes[Math.floor(Math.random()*hotelTypes.length)];
const basePrice=star===5?800+Math.floor(Math.random()*1200):star===4?400+Math.floor(Math.random()*600):200+Math.floor(Math.random()*300);
const platformPrices=platforms.map(p=>{
const variation=Math.floor(Math.random()*200)-100;
return{...p,price:Math.max(99,basePrice+variation)};
});
const lowest=Math.min(...platformPrices.map(p=>p.price));
const highest=Math.max(...platformPrices.map(p=>p.price));
const rating=(3.5+Math.random()*1.5).toFixed(1);
const amenities=amenitiesList.filter(()=>Math.random()>0.5).slice(0,5);
hotels.push({id:i,name:`${city}${type}(${['旗舰店','中心店','景区店','机场店','高铁店'][Math.floor(Math.random()*5)]})`,city,star,type,rating:parseFloat(rating),platformPrices,lowest,highest,amenities,saved:highest-lowest});
}
return hotels;
}
function searchHotels(){
allHotels=genHotels();renderHotels();
}
function setStar(s,btn){
currentStar=s;
document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
renderHotels();
}
function renderHotels(){
let filtered=[...allHotels];
if(currentStar>0)filtered=filtered.filter(h=>h.star===currentStar);
const range=document.getElementById('priceRange').value;
if(range!=='all'){
const [min,max]=range.split('-').map(Number);
if(max)filtered=filtered.filter(h=>h.lowest>=min&&h.lowest<=max);
else filtered=filtered.filter(h=>h.lowest>=1000);
}
const nights=2;
filtered.forEach(h=>{h.totalLowest=h.lowest*nights;h.totalHighest=h.highest*nights;});
document.getElementById('sumTotal').textContent=filtered.length;
if(filtered.length){
const prices=filtered.map(h=>h.lowest);
document.getElementById('sumMin').textContent='¥'+Math.min(...prices);
document.getElementById('sumAvg').textContent='¥'+Math.round(prices.reduce((a,b)=>a+b)/prices.length);
document.getElementById('sumSaved').textContent='¥'+Math.round(filtered.reduce((s,h)=>s+h.saved,0)/filtered.length);
}
document.getElementById('resultInfo').textContent=`共 ${filtered.length} 家酒店`;
const grid=document.getElementById('hotelsGrid');
if(!filtered.length){grid.innerHTML='<div class="empty">未找到符合条件的酒店</div>';return;}
const emojis=['🏢','🏬','🏰','🏡','🏠','🌆','🏖','⛷','🌴','🎣'];
grid.innerHTML=filtered.map(h=>{
const emoji=emojis[h.id%emojis.length];
const bestPlatform=h.platformPrices.find(p=>p.price===h.lowest);
return `<div class="hotel-card">
<div class="hotel-img">${emoji}<span class="rating">★ ${h.rating} · ${h.star}星</span>
${h.saved>100?'<span class="best-price">省¥'+h.saved+'</span>':''}</div>
<div class="hotel-info"><h3>${h.name}</h3>
<div class="location">📍 ${h.city} · ${h.type}</div>
<div class="amenities">${h.amenities.map(a=>'<span class="amenity">'+a+'</span>').join('')}</div>
<div class="price-row"><div class="price">¥${h.lowest}<small>/晚</small></div>
<div class="compare">比最高价省 ¥${h.saved}</div></div></div>
<div class="price-platforms">${h.platformPrices.sort((a,b)=>a.price-b.price).map(p=>
`<div class="platform-price ${p.price===h.lowest?'lowest':''}">
<span class="p-name">${p.name}</span><span class="p-price">¥${p.price}</span></div>`
).join('')}</div></div>`;
}).join('');
}
function initDates(){
const today=new Date();
const tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);
const dayAfter=new Date(today);dayAfter.setDate(today.getDate()+2);
document.getElementById('checkin').value=tomorrow.toISOString().slice(0,10);
document.getElementById('checkout').value=dayAfter.toISOString().slice(0,10);
}
initDates();searchHotels();
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();}if(e.key==='Escape'){}});
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
