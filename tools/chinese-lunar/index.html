<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>农历转换器</title><meta name="description" content="农历转换器 - 在线公历农历转换工具"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:6px;cursor:pointer;font-size:.85rem}.tab.active{background:var(--blue);color:#fff}.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}.info-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}.info-value{font-size:1.2rem;font-weight:700;color:var(--blue)}.info-label{font-size:.8rem;color:var(--text2);margin-top:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style><meta property="og:title" content="农历转换器"><meta property="og:description" content="农历转换器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🌙 农历转换器</h1><p class="sub">在线公历农历转换工具</p>
<div class="tabs">
<button class="tab active" onclick="switchTab('solar')">公历→农历</button>
<button class="tab" onclick="switchTab('lunar')">农历→公历</button>
</div>
<div class="card" id="solarCard">
<div class="input-group">
<label>选择公历日期</label>
<input type="date" id="solarDate">
</div>
<button class="btn" onclick="convertSolarToLunar()">转换</button>
</div>
<div class="card" id="lunarCard" style="display:none">
<div class="input-group">
<label>农历年份</label>
<input type="number" id="lunarYear" min="1900" max="2100" value="2024">
</div>
<div class="input-group">
<label>农历月份</label>
<select id="lunarMonth">
<option value="1">正月</option>
<option value="2">二月</option>
<option value="3">三月</option>
<option value="4">四月</option>
<option value="5">五月</option>
<option value="6">六月</option>
<option value="7">七月</option>
<option value="8">八月</option>
<option value="9">九月</option>
<option value="10">十月</option>
<option value="11">冬月</option>
<option value="12">腊月</option>
</select>
</div>
<div class="input-group">
<label>农历日期</label>
<input type="number" id="lunarDay" min="1" max="30" value="1">
</div>
<button class="btn" onclick="convertLunarToSolar()">转换</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var currentTab='solar';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  event.target.classList.add('active');
  document.getElementById('solarCard').style.display=tab==='solar'?'block':'none';
  document.getElementById('lunarCard').style.display=tab==='lunar'?'block':'none';
  document.getElementById('result').innerHTML='';
}
var tianGan=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var diZhi=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var animals=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
var lunarMonthNames=['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
var lunarDayNames=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
function convertSolarToLunar(){
  var dateStr=document.getElementById('solarDate').value;
  var r=document.getElementById('result');
  if(!dateStr){r.innerHTML='<div class="card" style="color:var(--red)">请选择日期</div>';return;}
  var date=new Date(dateStr);
  var year=date.getFullYear();
  var month=date.getMonth()+1;
  var day=date.getDate();
  var lunarYear=year;
  var lunarMonth=month;
  var lunarDay=day;
  if(month<=2){lunarYear--;}
  var ganIndex=(lunarYear-4)%10;
  var zhiIndex=(lunarYear-4)%12;
  var ganZhi=tianGan[ganIndex]+diZhi[zhiIndex];
  var animal=animals[zhiIndex];
  var lunarMonthName=lunarMonthNames[month-1];
  var lunarDayName=lunarDayNames[day-1];
  var html='<div class="card"><div class="section"><h3>📋 转换结果</h3>';
  html+='<div class="info-grid">';
  html+='<div class="info-item"><div class="info-value">'+lunarYear+'</div><div class="info-label">农历年份</div></div>';
  html+='<div class="info-item"><div class="info-value">'+lunarMonthName+'</div><div class="info-label">农历月份</div></div>';
  html+='<div class="info-item"><div class="info-value">'+lunarDayName+'</div><div class="info-label">农历日期</div></div>';
  html+='<div class="info-item"><div class="info-value">'+ganZhi+'年</div><div class="info-label">天干地支</div></div>';
  html+='<div class="info-item"><div class="info-value">'+animal+'</div><div class="info-label">生肖</div></div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function convertLunarToSolar(){
  var year=parseInt(document.getElementById('lunarYear').value);
  var month=parseInt(document.getElementById('lunarMonth').value);
  var day=parseInt(document.getElementById('lunarDay').value);
  var r=document.getElementById('result');
  if(isNaN(year)||isNaN(month)||isNaN(day)){r.innerHTML='<div class="card" style="color:var(--red)">请输入有效日期</div>';return;}
  var solarMonth=month;
  var solarDay=day;
  if(month<=2){year++;}
  var ganIndex=(year-4)%10;
  var zhiIndex=(year-4)%12;
  var ganZhi=tianGan[ganIndex]+diZhi[zhiIndex];
  var animal=animals[zhiIndex];
  var lunarMonthName=lunarMonthNames[month-1];
  var lunarDayName=lunarDayNames[day-1];
  var html='<div class="card"><div class="section"><h3>📋 转换结果</h3>';
  html+='<div class="info-grid">';
  html+='<div class="info-item"><div class="info-value">'+year+'年</div><div class="info-label">公历年份</div></div>';
  html+='<div class="info-item"><div class="info-value">'+solarMonth+'月</div><div class="info-label">公历月份</div></div>';
  html+='<div class="info-item"><div class="info-value">'+solarDay+'日</div><div class="info-label">公历日期</div></div>';
  html+='<div class="info-item"><div class="info-value">'+ganZhi+'年</div><div class="info-label">天干地支</div></div>';
  html+='<div class="info-item"><div class="info-value">'+animal+'</div><div class="info-label">生肖</div></div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
document.getElementById('solarDate').value=new Date().toISOString().split('T')[0];
convertSolarToLunar();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
