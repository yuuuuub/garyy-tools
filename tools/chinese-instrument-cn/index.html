<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国传统乐器大全 - Chinese Traditional Musical Instruments</title>
<meta name="description" content="中国传统乐器大全，涵盖弹拨、拉弦、吹管、打击四大类乐器的历史与演奏技巧">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国传统乐器大全 - Chinese Traditional Musical Instruments">
<meta property="og:description" content="中国传统乐器大全，涵盖弹拨、拉弦、吹管、打击四大类乐器的历史与演奏技巧">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-instrument-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪕</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#8aadc9;--accent2:#6a8da9}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#0969da;--accent2:#0550ae}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#0a1520 0%,#0d2030 50%,#102a40 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #1a4a6a;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#8aadc9,#6a8da9,#4a8ab5,#3a7aa5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.instrument-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.inst-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.inst-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.inst-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.inst-card .inst-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.inst-card .inst-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(138,173,201,0.15);color:var(--accent)}
.inst-card .inst-name{font-size:1.3em;font-weight:bold}
.inst-card .inst-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.inst-card .inst-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.inst-card .inst-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.inst-card .inst-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.inst-card .inst-detail strong{color:var(--text)}
.inst-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.instrument-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🪕 中国传统乐器大全</h1>
<p>Chinese Traditional Musical Instruments — 探索弹拨、拉弦、吹管、打击四大类民族乐器</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索乐器名称、类别或特色...（如"古筝""琵琶""唢呐"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部乐器</button>
<button class="filter-btn" data-filter="弹拨乐器">🎸 弹拨乐器</button>
<button class="filter-btn" data-filter="拉弦乐器">🎻 拉弦乐器</button>
<button class="filter-btn" data-filter="吹管乐器">🎶 吹管乐器</button>
<button class="filter-btn" data-filter="打击乐器">🥁 打击乐器</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="instrument-grid" id="instGrid"></div>
<footer><p>🪕 中国传统乐器大全 — 丝竹管弦，各有千秋</p></footer>
</div>
<script>
const INST_DATA=[
  {id:1,name:"古筝",en:"Guzheng",category:"弹拨乐器",icon:"🎵",origin:"战国",dynasty:"战国时期",strings:"21弦",difficulty:"中等",history:"古筝是中国最古老的弹拨乐器之一，有两千五百多年历史。因其音色清越明亮，表现力丰富，被誉为'东方钢琴'。",techniques:["摇指","琶音","刮奏","按音","滑音","颤音","泛音","撮弦"],masters:"王中山、项斯华、林玲、袁莎",culture:"古筝在中国文化中具有重要地位，常出现在诗词歌赋中，是文人雅士修身养性的乐器。"},
  {id:2,name:"琵琶",en:"Pipa",category:"弹拨乐器",icon:"🪕",origin:"西域传入",dynasty:"南北朝",strings:"4弦",difficulty:"较高",history:"琵琶自西域传入中国后，经过千年发展成为最重要的弹拨乐器之一。被称为'民乐之王'。",techniques:["弹挑","轮指","扫弦","摭分","摭扫","摭轮","长轮","绞弦"],masters:"刘德海、吴玉霞、张强、章红艳",culture:"琵琶表现力极强，既能演奏金戈铁马的武曲，也能演绎柔情似水的文曲。"},
  {id:3,name:"二胡",en:"Erhu",category:"拉弦乐器",icon:"🎻",origin:"唐朝",dynasty:"唐代",strings:"2弦",difficulty:"中等",history:"二胡是中国最具代表性的拉弦乐器，音色柔美细腻，善于表达深沉的感情。近现代发展迅速。",techniques:["揉弦","滑音","拨弦","颤弓","顿弓","跳弓","抛弓","泛音"],masters:"华彦钧(阿炳)、刘天华、闵惠芬、宋飞",culture:"二胡音乐以其如泣如诉的特质著称，阿炳的《二泉映月》被誉为'中国人的月光'。"},
  {id:4,name:"笛子",en:"Dizi",category:"吹管乐器",icon:"🎶",origin:"新石器时代",dynasty:"新石器时代",strings:"—",difficulty:"中等",history:"笛子是中国最古老的吹管乐器之一，有八千多年历史。分为梆笛和曲笛两大类。",techniques:["吐音","花舌","颤音","滑音","垛音","剁音","循环换气","喉音"],masters:"陆春龄、赵松庭、刘管乐、俞逊发",culture:"笛子常与山水自然联系在一起，是中国传统审美中'天人合一'思想的音乐体现。"},
  {id:5,name:"古琴",en:"Guqin",category:"弹拨乐器",icon:"🎸",origin:"先秦",dynasty:"先秦时期",strings:"7弦",difficulty:"极高",history:"古琴有三千多年历史，是中国文人音乐的代表。2003年被联合国教科文组织列为'人类口头和非物质遗产代表作'。",techniques:["散音","按音","泛音","吟","猱","绰","注","撞"],masters:"管平湖、吴景略、张子盛、李祥霆",culture:"古琴讲究'大音希声'，追求意境深远、含蓄内敛的艺术风格，是中国文人精神的重要载体。"},
  {id:6,name:"唢呐",en:"Suona",category:"吹管乐器",icon:"🎺",origin:"波斯传入",dynasty:"明代",strings:"—",difficulty:"中等",history:"唢呐自波斯传入中国后，成为中国民间最重要的吹管乐器。音色高亢明亮，穿透力极强。",techniques:["循环换气","花舌","滑音","颤音","打音","吐音","喉音","气冲音"],mins:"任同祥、刘英、郭雅志",culture:"唢呐在中国民间红白喜事中不可或缺，被称为'乐器界的霸王'。"},
  {id:7,name:"扬琴",en:"Yangqin",category:"弹拨乐器",icon:"🎵",origin:"波斯传入",dynasty:"明代",strings:"多弦",difficulty:"中等",history:"扬琴自波斯传入中国后，成为中国民族管弦乐队中重要的击弦乐器。音色清脆明亮。",techniques:["轮音","弹轮","颤竹","拨弦","揉弦","滑音","泛音","双音"],masters:"项祖华、黄河、桂习礼、刘寒力",culture:"扬琴在江南丝竹等民间音乐中占有重要地位，是合奏中的'万能乐器'。"},
  {id:8,name:"笙",en:"Sheng",category:"吹管乐器",icon:"🎶",origin:"商代",dynasty:"商代",strings:"—",difficulty:"较高",history:"笙是中国最古老的和声乐器，有三千多年历史。是世界上最早使用自由簧的乐器。",techniques:["呼吸法","打音","颤音","花舌","滑音","呼舌","揉音","喉音"],masters:"胡天泉、阎海登、文佳良、杨守义",culture:"笙是中国传统乐器中唯一能演奏和声的乐器，对西方口琴、手风琴的发明产生了影响。"},
  {id:9,name:"阮",en:"Ruan",category:"弹拨乐器",icon:"🪕",origin:"秦代",dynasty:"秦代",strings:"4弦",difficulty:"中等",history:"阮是中国传统的弹拨乐器，有两千多年历史。分为大阮、中阮、小阮等。",techniques:["弹挑","轮指","扫弦","摭分","琶音","泛音","滑音","颤音"],masters:"林吉宝、宁勇、徐阳、冯满天",culture:"阮以竹林七贤之一的阮咸命名，是文人雅士喜爱的乐器。"},
  {id:10,name:"编钟",en:"Bianzhong",category:"打击乐器",icon:"🔔",origin:"商代",dynasty:"商周",strings:"—",difficulty:"极高",history:"编钟是中国古代重要的打击乐器，盛行于商周时期。曾侯乙编钟是迄今发现的最大编钟。",techniques:["敲击","摩擦","摇晃","双击","滚奏"],masters:"考古复原演奏家",culture:"编钟是礼乐制度的重要载体，代表了中国古代青铜铸造技术的最高成就。"},
  {id:11,name:"箫",en:"Xiao",category:"吹管乐器",icon:"🎶",origin:"汉代",dynasty:"汉代",strings:"—",difficulty:"较高",history:"箫是中国传统的直吹管乐器，音色低沉悠远，常与古琴合奏。",techniques:["气颤","指颤","滑音","打音","叠音","吐音","循环换音","虚吹"],masters:"张维良、戴树红、谭谓裕",culture:"箫以其低沉悠远的音色著称，常被用于表现孤独、思乡等情感。"},
  {id:12,name:"鼓",en:"Gu",category:"打击乐器",icon:"🥁",origin:"远古",dynasty:"远古时期",strings:"—",difficulty:"中等",history:"鼓是中国最古老的乐器之一，在军事、宗教、民间活动中都有重要应用。",techniques:["击打","滚奏","闷击","边击","指击","掌击","槌击","摩擦"],masters:"李真贵、王建华、安志顺",culture:"鼓在中国文化中具有特殊地位，'鼓'与'古'谐音，象征着源远流长的历史。"}
];
function renderCards(data){
  document.getElementById('instGrid').innerHTML=data.map(i=>`
    <div class="inst-card" data-category="${i.category}">
      <div class="inst-header"><div class="inst-icon">${i.icon}</div><div><div class="inst-name">${i.name}</div><div class="inst-sub">${i.en} · ${i.category}</div></div></div>
      <div class="inst-meta"><span>${i.dynasty}</span><span>弦数: ${i.strings}</span><span>难度: ${i.difficulty}</span></div>
      <div class="inst-detail"><strong>历史：</strong>${i.history}</div>
      <div class="inst-detail"><strong>演奏技巧：</strong>${i.techniques.join('、')}</div>
      <div class="inst-detail"><strong>代表演奏家：</strong>${i.masters}</div>
      <div class="inst-detail"><strong>文化意义：</strong>${i.culture}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(i=>{cats[i.category]=(cats[i.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">乐器总数</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.inst-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.inst-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(INST_DATA);renderStats(INST_DATA);
</script>
</body>
</html>
