<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>腊八节 - 腊八粥文化</title>
<meta name="description" content="腊八节腊八粥文化 - 腊八粥配方、传统习俗、营养指南">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥣</text></svg>">
<meta name="robots" content="index,follow">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.hidden{display:none}
.ingredient-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.ingredient-item{background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:all .2s;user-select:none}
.ingredient-item.selected{border-color:var(--green);background:rgba(35,134,54,.1)}
.ingredient-emoji{font-size:1.5rem;display:block;margin-bottom:4px}
.ingredient-name{font-size:.85rem;font-weight:600}
.ingredient-cal{font-size:.75rem;color:var(--text2)}
.recipe-result{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px}
.nutrition-bar{height:8px;background:var(--border);border-radius:4px;margin-top:4px;overflow:hidden}
.nutrition-fill{height:100%;border-radius:4px;transition:width .3s}
.custom-list{display:flex;flex-direction:column;gap:10px}
.custom-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all var(--transition)}
.custom-item:hover{border-color:var(--blue)}
.custom-header{display:flex;align-items:center;gap:10px}
.custom-icon{font-size:1.5rem}
.custom-name{font-weight:600}
.custom-desc{color:var(--text2);font-size:.85rem;margin-top:4px}
.custom-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--text2);font-size:.85rem;line-height:1.6;display:none}
.custom-detail.show{display:block}
.region-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.region-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px}
.region-title{font-weight:600;margin-bottom:8px;text-align:center}
.region-items{color:var(--text2);font-size:.85rem;line-height:1.6}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.countdown-box{display:flex;gap:16px;justify-content:center;margin:16px 0}
.countdown-item{text-align:center}
.countdown-num{font-size:2rem;font-weight:700;color:var(--blue);line-height:1}
.countdown-label{font-size:.75rem;color:var(--text2);margin-top:4px}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div style="position:fixed;top:8px;right:8px;z-index:9999"><button class="btn btn-secondary" onclick="toggleTheme()" style="font-size:.8rem;padding:4px 10px" id="themeBtn">🌙 暗色</button></div>
<div class="container">
<h1>🥣 腊八节 - 腊八粥文化</h1>
<p class="sub">腊八粥配方 · 传统习俗 · 营养指南 · 南北差异</p>

<div class="card" style="text-align:center">
<h3 style="margin-bottom:8px">🥣 距离腊八节</h3>
<div class="countdown-box" id="countdown"></div>
</div>

<div class="tabs">
<button class="btn btn-primary" onclick="showTab('recipe')" id="tabRecipe">🥣 粥方配置</button>
<button class="btn btn-secondary" onclick="showTab('customs')" id="tabCustoms">🎊 习俗</button>
<button class="btn btn-secondary" onclick="showTab('region')" id="tabRegion">🗺️ 南北差异</button>
</div>

<div id="recipeView">
<p style="color:var(--text2);font-size:.85rem;margin-bottom:12px">点击选择食材，自动生成配方和营养信息</p>
<div class="ingredient-grid" id="ingredientGrid"></div>
<div class="recipe-result" id="recipeResult" style="display:none"></div>
</div>
<div id="customsView" class="hidden"><div class="custom-list" id="customList"></div></div>
<div id="regionView" class="hidden"><div class="region-compare" id="regionCompare"></div></div>
</div>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script src="../i18n.js" defer></script>
<script>
var ingredients=[
{emoji:'🍚',name:'大米',cal:116,fiber:0.3,protein:2.6,color:'#fef3c7'},
{emoji:'红豆',name:'红豆',cal:329,fiber:12.7,protein:20.2,color:'#dc2626'},
{emoji:'🫘',name:'绿豆',cal:316,fiber:16.3,protein:23.9,color:'#16a34a'},
{emoji:'🥜',name:'花生',cal:567,fiber:8.5,protein:25.8,color:'#a16207'},
{emoji:'🫒',name:'红枣',cal:287,fiber:6.2,protein:3.7,color:'#b91c1c'},
{emoji:'🥥',name:'桂圆',cal:283,fiber:1.1,protein:5.1,color:'#92400e'},
{emoji:'🪷',name:'莲子',cal:341,fiber:5.4,protein:17.2,color:'#f5f5f4'},
{emoji:'💜',name:'百合',cal:166,fiber:1.7,protein:3.9,color:'#e9d5ff'},
{emoji:'🫘',name:'薏米',cal:357,fiber:2.7,protein:12.8,color:'#f5f5f4'},
{emoji:'🥜',name:'核桃',cal:654,fiber:6.7,protein:15.2,color:'#78350f'},
{emoji:'🫘',name:'黑豆',cal:341,fiber:10.2,protein:36,color:'#1f2937'},
{emoji:'🌾',name:'燕麦',cal:389,fiber:10.6,protein:16.9,color:'#d4a574'},
{emoji:'🍚',name:'糯米',cal:344,fiber:1.9,protein:6.7,color:'#fef3c7'},
{emoji:'🍠',name:'红薯',cal:86,fiber:3,protein:1.6,color:'#ea580c'}
];
var customs=[
{name:'喝腊八粥',icon:'🥣',desc:'腊月初八喝腊八粥，拉开春节序幕',detail:'腊八粥用多种谷物和干果熬制。传说与佛教有关，释迦牟尼在腊月初八悟道成佛。喝腊八粥寓意五谷丰登、温暖祥和。'},
{name:'泡腊八蒜',icon:'🧄',desc:'用醋泡蒜，蒜瓣变成翠绿色',detail:'腊八蒜是北方地区的传统习俗。将蒜瓣放入醋中浸泡，到除夕时蒜瓣变成翠绿色，口感酸辣。腊八蒜是饺子的最佳搭配。'},
{name:'祭祀祖先',icon:'🙏',desc:'祭祀祖先和神灵，祈求来年丰收',detail:'腊八节祭祀是古代农耕文明的重要仪式。人们用腊八粥供奉祖先和神灵，感谢过去一年的庇佑，祈求来年风调雨顺、五谷丰登。'},
{name:'吃腊八面',icon:'🍜',desc:'陕西等地腊八节吃腊八面',detail:'在陕西关中地区，腊八节不吃粥而是吃腊八面。用红豆、黄豆等做臊子，浇在面条上。腊八面讲究面条要擀得又薄又细，体现手艺。'}
];
var regions=[
{name:'北方',items:'大米、红豆、花生、红枣、莲子、桂圆\n特点：口味偏甜，常加红糖\n讲究：粥要熬得浓稠，食材丰富'},
{name:'南方',items:'糯米、绿豆、薏米、百合、红薯\n特点：口味清淡，注重养生\n讲究：粥要熬得稀薄，突出清甜'}
];
var selected=new Set();

function updateCountdown(){
  var now=new Date();var year=now.getFullYear();
  var laba=new Date(year,11,8);
  if(now>laba)laba=new Date(year+1,11,8);
  var diff=laba-now;var d=Math.floor(diff/864e5);
  document.getElementById('countdown').innerHTML='<div class="countdown-item"><div class="countdown-num">'+d+'</div><div class="countdown-label">天</div></div>';
}

function showTab(tab){
  ['recipeView','customsView','regionView'].forEach(function(v){document.getElementById(v).classList.add('hidden')});
  document.getElementById(tab+'View').classList.remove('hidden');
  ['tabRecipe','tabCustoms','tabRegion'].forEach(function(id){document.getElementById(id).className='btn btn-secondary'});
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).className='btn btn-primary';
}

function renderIngredients(){
  var h='';
  ingredients.forEach(function(ing,i){
    h+='<div class="ingredient-item'+(selected.has(i)?' selected':'')+'" onclick="toggleIngredient('+i+')">';
    h+='<span class="ingredient-emoji">'+ing.emoji+'</span><div class="ingredient-name">'+ing.name+'</div>';
    h+='<div class="ingredient-cal">'+ing.cal+'kcal/100g</div></div>';
  });
  document.getElementById('ingredientGrid').innerHTML=h;
}

function toggleIngredient(i){
  if(selected.has(i))selected.delete(i);else selected.add(i);
  renderIngredients();updateRecipe();
}

function updateRecipe(){
  if(selected.size===0){document.getElementById('recipeResult').style.display='none';return}
  var totalCal=0,totalFiber=0,totalProtein=0;
  var items=[];
  selected.forEach(function(i){
    var ing=ingredients[i];
    totalCal+=ing.cal;totalFiber+=ing.fiber;totalProtein+=ing.protein;
    items.push(ing.emoji+' '+ing.name);
  });
  var avgCal=Math.round(totalCal/selected.size);
  var h='<h3 style="margin-bottom:8px">🥣 我的腊八粥配方</h3>';
  h+='<p style="margin-bottom:8px"><strong>食材：</strong>'+items.join('、')+'</p>';
  h+='<p style="margin-bottom:4px;color:var(--text2);font-size:.85rem">平均营养 (每100g)</p>';
  h+='<div style="margin-bottom:8px"><span style="font-size:.85rem">热量 '+avgCal+' kcal</span><div class="nutrition-bar"><div class="nutrition-fill" style="width:'+Math.min(avgCal/7,100)+'%;background:var(--yellow)"></div></div></div>';
  h+='<div style="margin-bottom:8px"><span style="font-size:.85rem">膳食纤维 '+totalFiber.toFixed(1)+' g</span><div class="nutrition-bar"><div class="nutrition-fill" style="width:'+Math.min(totalFiber*5,100)+'%;background:var(--green)"></div></div></div>';
  h+='<div><span style="font-size:.85rem">蛋白质 '+totalProtein.toFixed(1)+' g</span><div class="nutrition-bar"><div class="nutrition-fill" style="width:'+Math.min(totalProtein*2,100)+'%;background:var(--blue)"></div></div></div>';
  document.getElementById('recipeResult').innerHTML=h;
  document.getElementById('recipeResult').style.display='block';
}

function renderCustoms(){
  var h='';
  customs.forEach(function(c,i){
    h+='<div class="custom-item" onclick="toggleDetail('+i+')">';
    h+='<div class="custom-header"><span class="custom-icon">'+c.icon+'</span><div><div class="custom-name">'+c.name+'</div><div class="custom-desc">'+c.desc+'</div></div></div>';
    h+='<div class="custom-detail" id="cd-'+i+'">'+c.detail+'</div></div>';
  });
  document.getElementById('customList').innerHTML=h;
}

function toggleDetail(idx){var el=document.getElementById('cd-'+idx);if(el)el.classList.toggle('show')}

function renderRegion(){
  var h='';
  regions.forEach(function(r){
    h+='<div class="region-card"><div class="region-title">'+r.name+'</div><div class="region-items">'+r.items.replace(/\n/g,'<br>')+'</div></div>';
  });
  document.getElementById('regionCompare').innerHTML=h;
}

function toggleTheme(){
  var html=document.documentElement;var isLight=html.getAttribute('data-theme')==='light';
  html.setAttribute('data-theme',isLight?'dark':'light');
  document.getElementById('themeBtn').textContent=isLight?'☀️ 亮色':'🌙 暗色';
}

renderIngredients();renderCustoms();renderRegion();updateCountdown();setInterval(updateCountdown,36e5);
window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});
</script>
</body>
</html>
