<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 目标设定</title>
<meta name="description" content="SMART目标设定工具，科学制定和追踪目标，实现人生规划">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.goal-card{padding:16px;border-bottom:1px solid var(--border)}.goal-card:last-child{border-bottom:none}
.goal-header{display:flex;justify-content:space-between;align-items:flex-start}
.goal-header .title{font-weight:700;font-size:1.05rem}.goal-header .badge{padding:2px 8px;border-radius:12px;font-size:.7rem}
.badge.active{background:var(--accent);color:#fff}.badge.done{background:var(--success);color:#fff}.badge.overdue{background:var(--danger);color:#fff}
.goal-meta{font-size:.8rem;color:var(--text2);margin-top:6px}
.pb{width:100%;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:8px}.pb .fl{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.pb .fl.done{background:var(--success)}.pb .fl.overdue{background:var(--danger)}
.progress-row{display:flex;justify-content:space-between;font-size:.8rem;margin-top:4px}
.smart-tip{font-size:.8rem;color:var(--text2);background:var(--bg);padding:12px;border-radius:8px;margin-top:12px;line-height:1.8}
.smart-tip strong{color:var(--accent)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🎯 目标设定">
<meta property="og:description" content="SMART目标设定工具，科学制定和追踪目标">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🎯 目标设定</h1><p>SMART目标设定，科学制定和追踪目标</p></div>

<div class="cd"><h2>SMART原则</h2>
<div class="smart-tip">
<strong>S</strong>pecific（具体的）· <strong>M</strong>easurable（可衡量的）· <strong>A</strong>chievable（可实现的）· <strong>R</strong>elevant（相关的）· <strong>T</strong>ime-bound（有时限的）
</div></div>

<div class="cd"><h2>添加目标</h2>
<input type="text" id="goalName" placeholder="目标名称（具体明确）">
<label>目标描述</label><textarea id="goalDesc" placeholder="如何衡量达成？为什么重要？"></textarea>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div><label>截止日期</label><input type="date" id="goalDeadline"></div>
<div><label>类别</label><select id="goalCategory"><option value="career">💼 事业</option><option value="health">💪 健康</option><option value="finance">💰 财务</option><option value="study">📚 学习</option><option value="life">🏠 生活</option><option value="social">👥 社交</option></select></div>
</div>
<label>目标进度（%）</label><input type="text" id="goalProgress" value="0" oninput="this.value=Math.min(100,Math.max(0,this.value))">
<div class="bg"><button onclick="addGoal()">添加目标</button></div></div>

<div class="cd"><h2>目标列表</h2><div id="goalList"></div></div>

<div class="cd"><h2>统计</h2><div class="gr" id="stats"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let goals=JSON.parse(localStorage.getItem('gs_goals')||'[]');
const today=()=>new Date().toISOString().slice(0,10);

function save(){localStorage.setItem('gs_goals',JSON.stringify(goals));}

function getCatLabel(c){return{career:'💼 事业',health:'💪 健康',finance:'💰 财务',study:'📚 学习',life:'🏠 生活',social:'👥 社交'}[c]||c;}

function addGoal(){
  const name=$('goalName').value.trim();
  const desc=$('goalDesc').value.trim();
  const deadline=$('goalDeadline').value;
  const category=$('goalCategory').value;
  const progress=parseInt($('goalProgress').value)||0;
  if(!name){alert('请输入目标名称');return;}
  goals.push({id:Date.now(),name,desc,deadline,category,progress,done:progress>=100,created:today()});
  save();render();$('goalName').value='';$('goalDesc').value='';$('goalProgress').value='0';
}

function updateProgress(id,val){
  const g=goals.find(x=>x.id===id);
  if(g){g.progress=Math.min(100,Math.max(0,parseInt(val)||0));g.done=g.progress>=100;save();render();}
}

function deleteGoal(id){goals=goals.filter(x=>x.id!==id);save();render();}

function getStatus(g){
  if(g.done)return'done';
  if(g.deadline&&g.deadline<today())return'overdue';
  return'active';
}

function render(){
  if(!goals.length){$('goalList').innerHTML='<div class="es">暂无目标，开始设定吧！</div>';renderStats();return;}
  $('goalList').innerHTML=goals.map(g=>{
    const status=getStatus(g);
    const badge={active:'进行中',done:'已完成',overdue:'已逾期'}[status];
    const daysLeft=g.deadline?Math.ceil((new Date(g.deadline)-new Date())/(86400000)):null;
    return`<div class="goal-card">
      <div class="goal-header">
        <span class="title">${g.done?'✅ ':' '}${g.name}</span>
        <span class="badge ${status}">${badge}</span>
      </div>
      <div class="goal-meta">${getCatLabel(g.category)} · ${g.deadline?'截止: '+g.deadline+(daysLeft!==null?(daysLeft>0?' (剩余'+daysLeft+'天)':' (已逾期)'):''):''}</div>
      ${g.desc?`<div style="font-size:.85rem;color:var(--text2);margin-top:6px">${g.desc}</div>`:''}
      <div class="pb"><div class="fl ${status}" style="width:${g.progress}%"></div></div>
      <div class="progress-row"><span>${g.progress}%</span><span>${g.done?'🎉 完成':g.progress+'%'}</span></div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button onclick="updateProgress(${g.id},${Math.min(100,g.progress+10)})" ${g.done?'disabled':''}>+10%</button>
        <button onclick="updateProgress(${g.id},${Math.max(0,g.progress-10)})" ${g.progress===0?'disabled':''}>-10%</button>
        <button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="deleteGoal(${g.id})">删除</button>
      </div>
    </div>`;
  }).join('');
  renderStats();
}

function renderStats(){
  const total=goals.length,done=goals.filter(g=>g.done).length;
  const active=goals.filter(g=>getStatus(g)==='active').length;
  const overdue=goals.filter(g=>getStatus(g)==='overdue').length;
  const avgProgress=total?Math.round(goals.reduce((s,g)=>s+g.progress,0)/total):0;
  $('stats').innerHTML=`
    <div class="st"><div class="nm">${total}</div><div class="lb">总目标</div></div>
    <div class="st"><div class="nm" style="color:var(--success)">${done}</div><div class="lb">已完成</div></div>
    <div class="st"><div class="nm" style="color:var(--warn)">${active}</div><div class="lb">进行中</div></div>
    <div class="st"><div class="nm" style="color:var(--danger)">${overdue}</div><div class="lb">已逾期</div></div>`;
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
