<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📱 短信构建器</title>
<meta name="description" content="短信模板构建器，创建和管理营销短信、通知短信模板">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📱 短信构建器">
<meta property="og:description" content="短信模板构建器 - Gary's Tools">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;transition:background .3s,color .3s}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.3rem;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:100px;font-family:'SF Mono',Menlo,monospace}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-orange{background:var(--orange)}.btn-sm{padding:4px 10px;font-size:.8rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px}
.theme-toggle{position:fixed;top:12px;right:12px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:8px;cursor:pointer;z-index:100}
.phone-frame{width:320px;margin:0 auto;background:#1a1a2e;border-radius:24px;padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.phone-screen{background:#0f0f1a;border-radius:16px;padding:12px;min-height:400px;max-height:500px;overflow-y:auto}
.phone-header{text-align:center;color:#8b949e;font-size:.75rem;margin-bottom:8px;padding:8px 0;border-bottom:1px solid #333}
.sms-bubble{background:#0969da;color:#fff;padding:10px 14px;border-radius:16px 16px 4px 16px;margin-bottom:8px;max-width:85%;font-size:.85rem;line-height:1.5;word-break:break-word}
.sms-bubble.right{margin-left:auto;border-radius:16px 16px 16px 4px;background:#3fb950}
.sms-time{font-size:.65rem;color:#666;text-align:center;margin-bottom:12px}
.sms-list{list-style:none}
.sms-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.sms-item:hover{border-color:var(--blue)}
.sms-item .sms-title{font-weight:600;font-size:.9rem;margin-bottom:4px}
.sms-item .sms-preview{font-size:.8rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sms-item .sms-chars{font-size:.7rem;color:var(--text2);margin-top:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;color:#fff}
.badge-sms70{background:var(--green)}.badge-sms140{background:var(--orange)}.badge-long{background:var(--red)}
.var-tag{display:inline-block;background:var(--purple);color:#fff;padding:1px 6px;border-radius:4px;font-size:.7rem;margin:2px;cursor:pointer}
.char-count{font-size:.8rem;color:var(--text2);margin-top:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>📱 短信构建器</h1>

<div class="card">
<div class="section-title">快速模板</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn-sm" onclick="useQuickTemplate('verify')">验证码</button>
<button class="btn-sm btn-green" onclick="useQuickTemplate('promo')">促销推广</button>
<button class="btn-sm btn-orange" onclick="useQuickTemplate('reminder')">提醒通知</button>
<button class="btn-sm" style="background:var(--purple)" onclick="useQuickTemplate('shipping')">物流通知</button>
<button class="btn-sm btn-red" onclick="useQuickTemplate('alert')">紧急告警</button>
</div>
</div>

<div class="form-row">
<div class="card">
<div class="section-title">短信编辑</div>
<div style="margin-bottom:12px"><label>短信名称</label><input type="text" id="smsName" placeholder="例：618促销短信"></div>
<div style="margin-bottom:12px"><label>短信内容</label><textarea id="smsContent" rows="6" oninput="updatePreview()" placeholder="输入短信内容，支持变量: {{name}} {{code}} {{date}}"></textarea></div>
<div class="char-count" id="charCount">0 字符 / 1条短信 (≤70字)</div>
<div style="margin-top:8px"><label>可用变量</label><div style="margin-top:4px"><span class="var-tag" onclick="insertVar('name')">{{name}}</span><span class="var-tag" onclick="insertVar('code')">{{code}}</span><span class="var-tag" onclick="insertVar('date')">{{date}}</span><span class="var-tag" onclick="insertVar('amount')">{{amount}}</span><span class="var-tag" onclick="insertVar('order')">{{order}}</span><span class="var-tag" onclick="insertVar('link')">{{link}}</span></div></div>
<div style="margin-top:12px;display:flex;gap:8px">
<button onclick="saveSMS()">💾 保存</button>
<button class="btn-green" onclick="previewSMS()">👁 预览</button>
<button class="btn-orange" onclick="copySMS()">📋 复制</button>
</div>
</div>
<div class="card">
<div class="section-title">手机预览</div>
<div class="phone-frame"><div class="phone-screen">
<div class="phone-header">短信</div>
<div id="phonePreview">
<div class="sms-time">现在</div>
<div class="sms-bubble" id="smsBubble">点击左侧编辑短信内容</div>
</div>
</div></div>
<div style="margin-top:12px">
<div class="section-title" style="font-size:.85rem">短信费用估算</div>
<div id="costEstimate" style="font-size:.85rem;color:var(--text2)">
<p>单条 ≤70字: ¥0.05</p>
<p>长短信(>70字): 按每67字拆分计费</p>
<p style="font-weight:600;color:var(--text);margin-top:8px">预估费用: <span id="costResult">¥0.05 / 条</span></p>
</div>
</div>
</div>
</div>

<div class="card">
<div class="section-title">短信模板库</div>
<ul class="sms-list" id="smsList"></ul>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var smsTemplates = JSON.parse(localStorage.getItem('sms_templates') || '[]');
var idCounter = smsTemplates.length ? Math.max(...smsTemplates.map(t=>t.id)) + 1 : 1;

var quickTemplates = {
  verify: {name:'验证码',content:'【您的品牌】验证码：{{code}}，5分钟内有效，请勿泄露给他人。'},
  promo: {name:'促销推广',content:'【您的品牌】尊敬的{{name}}，限时特惠！全场低至5折，点击领取优惠券：{{link}} 退订回T'},
  reminder: {name:'提醒通知',content:'【您的品牌】{{name}}您好，您预约的{{date}}服务即将开始，请准时到场。'},
  shipping: {name:'物流通知',content:'【您的品牌】您的订单{{order}}已发货，快递单号{{code}}，预计{{date}}送达。点击查看：{{link}}'},
  alert: {name:'紧急告警',content:'【您的品牌】告警：{{name}}服务异常，请立即处理！详情：{{link}}'}
};

function updatePreview(){
  var content=document.getElementById('smsContent').value;
  var len=content.length;
  var smsCount=len<=70?1:Math.ceil(len/67);
  var charBadge=len<=70?'badge-sms70':len<=140?'badge-sms140':'badge-long';
  document.getElementById('charCount').innerHTML=len+' 字符 / <span class="badge '+charBadge+'">'+smsCount+'条短信</span> (每条≤70字，长短信按67字拆分)';
  var cost=(smsCount*0.05).toFixed(2);
  document.getElementById('costResult').textContent='¥'+cost+' / 条';
  var display=content||'点击左侧编辑短信内容';
  document.getElementById('smsBubble').textContent=display;
}

function insertVar(name){
  var ta=document.getElementById('smsContent');
  var pos=ta.selectionStart;
  var text=ta.value;
  ta.value=text.substring(0,pos)+'{{'+name+'}}'+text.substring(pos);
  ta.focus();
  updatePreview();
}

function useQuickTemplate(type){
  var t=quickTemplates[type];
  document.getElementById('smsName').value=t.name;
  document.getElementById('smsContent').value=t.content;
  updatePreview();
}

function saveSMS(){
  var name=document.getElementById('smsName').value.trim();
  var content=document.getElementById('smsContent').value.trim();
  if(!name||!content){alert('请填写短信名称和内容');return;}
  var len=content.length;
  var smsCount=len<=70?1:Math.ceil(len/67);
  smsTemplates.unshift({id:idCounter++,name:name,content:content,chars:len,smsCount:smsCount,created:new Date().toLocaleDateString('zh-CN')});
  localStorage.setItem('sms_templates',JSON.stringify(smsTemplates));
  renderList();
  alert('保存成功！');
}

function previewSMS(){updatePreview();}
function copySMS(){navigator.clipboard.writeText(document.getElementById('smsContent').value).then(function(){alert('已复制到剪贴板');});}

function renderList(){
  var el=document.getElementById('smsList');
  if(!smsTemplates.length){el.innerHTML='<li style="color:var(--text2);padding:12px;text-align:center">暂无保存的模板</li>';return;}
  el.innerHTML=smsTemplates.map(function(t,i){
    var badge=t.smsCount<=1?'badge-sms70':t.smsCount<=2?'badge-sms140':'badge-long';
    return '<li class="sms-item" onclick="loadTemplate('+i+')"><div style="display:flex;justify-content:space-between;align-items:center"><div class="sms-title">'+t.name+'</div><div><span class="badge '+badge+'">'+t.smsCount+'条</span> <button class="btn-sm btn-red" onclick="event.stopPropagation();deleteTemplate('+i+')" style="margin-left:4px">删除</button></div></div><div class="sms-preview">'+t.content+'</div><div class="sms-chars">'+t.chars+'字符 · '+t.created+'</div></li>';
  }).join('');
}

function loadTemplate(i){
  var t=smsTemplates[i];
  document.getElementById('smsName').value=t.name;
  document.getElementById('smsContent').value=t.content;
  updatePreview();
}

function deleteTemplate(i){
  if(!confirm('确定删除此模板？'))return;
  smsTemplates.splice(i,1);
  localStorage.setItem('sms_templates',JSON.stringify(smsTemplates));
  renderList();
}

function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
renderList();updatePreview();
</script>
</body>
</html>
