<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔍 SWOT分析</title>
<meta name="description" content="SWOT分析工具，全面分析优势劣势机会威胁">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:50px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swot-q{border-radius:var(--radius);padding:16px;min-height:180px}
.swot-q h3{font-size:1rem;margin-bottom:4px;color:#fff}
.swot-q .sub{font-size:.75rem;color:rgba(255,255,255,.7);margin-bottom:10px}
.q-s{background:linear-gradient(135deg,#065f46,#047857)}.q-w{background:linear-gradient(135deg,#7f1d1d,#991b1b)}.q-o{background:linear-gradient(135deg,#1e3a5f,#2563eb)}.q-t{background:linear-gradient(135deg,#7c2d12,#c2410c)}
.item-entry{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.item-entry input,.item-entry select{margin-bottom:0;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2);color:#fff;font-size:.85rem;padding:6px 10px}
.item-entry input::placeholder{color:rgba(255,255,255,.5)}
.item-entry select{width:auto;min-width:70px}
.item-entry button{padding:4px 8px;font-size:.75rem;background:rgba(255,255,255,.2);color:#fff;border:none}
.item-entry button:hover{background:rgba(255,255,255,.3)}
.item-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(255,255,255,.15);border-radius:16px;font-size:.8rem;color:#fff;margin:2px}
.item-tag button{background:none;color:rgba(255,255,255,.7);padding:0 2px;font-size:.9rem}
.tows-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tows-cell{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px}
.tows-cell h4{font-size:.9rem;color:var(--accent);margin-bottom:8px}
.tows-cell textarea{min-height:60px;background:var(--card);font-size:.85rem}
.summary-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.summary-item{flex:1;min-width:100px;text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.summary-item .num{font-size:1.5rem;font-weight:700}
.summary-item .lbl{font-size:.75rem;color:var(--text2)}
.hidden{display:none!important}
@media(max-width:600px){.swot-grid,.tows-grid{grid-template-columns:1fr}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔍 SWOT分析">
<meta property="og:description" content="SWOT分析工具，全面分析优势劣势机会威胁">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/swot-analysis-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='swot_data';
let analyses=JSON.parse(localStorage.getItem(STORE)||'[]');
let curIdx=-1;
function save(){localStorage.setItem(STORE,JSON.stringify(analyses))}
function render(){
  let h=`<div class="hdr"><h1>🔍 SWOT分析</h1><p>全面分析优势、劣势、机会、威胁</p></div>`;
  h+=`<div class="flex" style="justify-content:center;margin-bottom:16px"><button onclick="newAnalysis()">+ 新建分析</button>`;
  if(analyses.length>0)h+=`<select onchange="curIdx=parseInt(this.value);render()" style="min-width:150px"><option value="-1">选择分析</option>${analyses.map((a,i)=>`<option value="${i}"${i===curIdx?' selected':''}>${a.name}</option>`).join('')}</select>`;
  h+=`</div>`;
  if(curIdx>=0&&curIdx<analyses.length){
    const a=analyses[curIdx];
    h+=`<div class="cd"><div class="flex-between"><input type="text" value="${a.name}" onchange="analyses[${curIdx}].name=this.value;save()" style="width:300px;margin-bottom:0;font-size:1.1rem;font-weight:700" placeholder="分析名称"><div class="flex"><button class="sec" style="padding:6px 12px;font-size:.8rem" onclick="exportReport()">导出报告</button><button class="dng" style="padding:6px 12px;font-size:.8rem" onclick="delAnalysis()">删除</button></div></div></div>`;
    h+=`<div class="swot-grid">`;
    [{k:'S',cls:'q-s',label:'优势 Strengths',icon:'💪'},{k:'W',cls:'q-w',label:'劣势 Weaknesses',icon:'⚠️'},{k:'O',cls:'q-o',label:'机会 Opportunities',icon:'🌟'},{k:'T',cls:'q-t',label:'威胁 Threats',icon:'⚡'}].forEach(q=>{
      h+=`<div class="swot-q ${q.cls}"><h3>${q.icon} ${q.label}</h3><div class="sub">${a[q.k].length} 项</div>`;
      h+=`<div class="item-entry"><input type="text" id="add_${q.k}" placeholder="添加${q.label.split(' ')[0]}..." onkeydown="if(event.key==='Enter')addItem('${q.k}')"><select id="imp_${q.k}"><option value="高">高</option><option value="中" selected>中</option><option value="低">低</option></select><button onclick="addItem('${q.k}')">+</button></div>`;
      a[q.k].forEach((item,ii)=>{
        h+=`<span class="item-tag">${item.text} <small>(${item.impact})</small><button onclick="removeItem('${q.k}',${ii})">✕</button></span>`;
      });
      h+=`</div>`;
    });
    h+=`</div>`;
    const s=a.S.length,w=a.W.length,o=a.O.length,t=a.T.length;
    h+=`<div class="cd"><div class="summary-row"><div class="summary-item"><div class="num" style="color:#34d399">${s}</div><div class="lbl">优势</div></div><div class="summary-item"><div class="num" style="color:#f87171">${w}</div><div class="lbl">劣势</div></div><div class="summary-item"><div class="num" style="color:#60a5fa">${o}</div><div class="lbl">机会</div></div><div class="summary-item"><div class="num" style="color:#fb923c">${t}</div><div class="lbl">威胁</div></div></div></div>`;
    h+=`<div class="cd"><h2>TOWS 策略矩阵</h2><div class="tows-grid">`;
    [{k:'SO',label:'SO策略（利用优势抓机会）',cls:''},{k:'ST',label:'ST策略（利用优势应对威胁）',cls:''},{k:'WO',label:'WO策略（克服劣势抓机会）',cls:''},{k:'WT',label:'WT策略（减少劣势回避威胁）',cls:''}].forEach(tw=>{
      h+=`<div class="tows-cell"><h4>${tw.label}</h4><textarea placeholder="输入策略..." onchange="analyses[${curIdx}].tows['${tw.k}']=this.value;save()">${a.tows[tw.k]||''}</textarea></div>`;
    });
    h+=`</div></div>`;
  }
  $('app').innerHTML=h;
}
function newAnalysis(){
  const name=prompt('请输入分析名称：','新SWOT分析');
  if(!name)return;
  analyses.push({name,S:[],W:[],O:[],T:[],tows:{SO:'',ST:'',WO:'',WT:''}});curIdx=analyses.length-1;save();render();
}
function delAnalysis(){if(!confirm('确定删除？'))return;analyses.splice(curIdx,1);curIdx=analyses.length>0?0:-1;save();render()}
function addItem(k){
  const input=$('add_'+k),imp=$('imp_'+k);
  const text=input.value.trim();if(!text)return;
  analyses[curIdx][k].push({text,impact:imp.value});save();input.value='';render();
}
function removeItem(k,i){analyses[curIdx][k].splice(i,1);save();render()}
function exportReport(){
  const a=analyses[curIdx];
  let txt=`SWOT分析报告: ${a.name}\n${'═'.repeat(40)}\n\n`;
  txt+=`【优势 Strengths】\n`;a.S.forEach(i=>txt+=`  - ${i.text} (影响: ${i.impact})\n`);
  txt+=`\n【劣势 Weaknesses】\n`;a.W.forEach(i=>txt+=`  - ${i.text} (影响: ${i.impact})\n`);
  txt+=`\n【机会 Opportunities】\n`;a.O.forEach(i=>txt+=`  - ${i.text} (影响: ${i.impact})\n`);
  txt+=`\n【威胁 Threats】\n`;a.T.forEach(i=>txt+=`  - ${i.text} (影响: ${i.impact})\n`);
  txt+=`\n${'─'.repeat(40)}\nTOWS策略\n${'─'.repeat(40)}\n`;
  txt+=`\nSO策略: ${a.tows.SO||'（未填写）'}\nST策略: ${a.tows.ST||'（未填写）'}\nWO策略: ${a.tows.WO||'（未填写）'}\nWT策略: ${a.tows.WT||'（未填写）'}\n`;
  navigator.clipboard.writeText(txt).then(()=>alert('已复制到剪贴板！')).catch(()=>alert('复制失败'));
}
render();
</script>
</body>
</html>
