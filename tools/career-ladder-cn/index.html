<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职业晋升阶梯</title>
<meta name="description" content="职业晋升阶梯工具 - 可视化职业发展路径，追踪晋升准备进度">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪜</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a371f7;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
input,textarea,select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
textarea{resize:vertical;min-height:60px}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.ladder{position:relative;padding-left:30px}
.ladder-line{position:absolute;left:14px;top:0;bottom:0;width:3px;background:var(--border);border-radius:2px}
.level-card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;transition:all .2s}
.level-card:hover{border-color:var(--accent)}
.level-dot{position:absolute;left:-24px;top:20px;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg)}
.level-dot.current{background:var(--accent);border-color:var(--accent)}
.level-dot.completed{background:var(--green);border-color:var(--green)}
.level-dot.future{background:var(--border);border-color:var(--border)}
.level-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.level-title{font-weight:700;font-size:1.1rem}
.level-subtitle{font-size:.85rem;color:var(--text2)}
.level-badge{padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:600}
.badge-current{background:rgba(59,130,246,.2);color:var(--accent)}
.badge-completed{background:rgba(63,185,80,.2);color:var(--green)}
.badge-future{background:rgba(139,148,158,.2);color:var(--text2)}
.req-item{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg);border-radius:6px;margin-bottom:4px;font-size:.85rem}
.req-check{color:var(--green);font-size:1rem}
.req-pending{color:var(--text2);font-size:1rem}
.skill-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.75rem;margin:2px}
.skill-mastered{background:rgba(63,185,80,.2);color:var(--green)}
.skill-learning{background:rgba(210,153,34,.2);color:var(--yellow)}
.skill-planned{background:rgba(139,148,158,.2);color:var(--text2)}
.progress-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .5s}
.timeline-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.info-card{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.info-num{font-size:1.8rem;font-weight:700}
.info-label{font-size:.8rem;color:var(--text2);margin-top:4px}
@media(max-width:600px){h1{font-size:1.4rem}.ladder{padding-left:24px}.level-dot{left:-18px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🪜 职业晋升阶梯';
const APP=document.getElementById('app');
let data=JSON.parse(localStorage.getItem('cl_data')||'{"currentLevel":1,"levels":[{"title":"初级工程师","subtitle":"P4 · 入门阶段","requirements":[{"text":"完成入职培训","done":true},{"text":"独立完成简单任务","done":true},{"text":"掌握基础技术栈","done":true}]},{"title":"中级工程师","subtitle":"P5 · 独立贡献者","requirements":[{"text":"独立负责模块开发","done":true},{"text":"代码评审能力","done":false},{"text":"技术文档编写","done":false},{"text":"指导新人","done":false}]},{"title":"高级工程师","subtitle":"P6 · 技术骨干","requirements":[{"text":"架构设计能力","done":false},{"text":"跨团队协作","done":false},{"text":"技术难题攻关","done":false},{"text":"技术分享与培训","done":false}]},{"title":"资深工程师","subtitle":"P7 · 技术专家","requirements":[{"text":"技术方案评审","done":false},{"text":"技术影响力","done":false},{"text":"团队技术规划","done":false},{"text":"行业技术洞察","done":false}]},{"title":"技术专家","subtitle":"P8 · 领域专家","requirements":[{"text":"技术战略制定","done":false},{"text":"跨部门影响力","done":false},{"text":"技术人才培养","done":false},{"text":"行业技术引领","done":false}]}]}');

function save(){localStorage.setItem('cl_data',JSON.stringify(data))}

function getProgress(level){
  const reqs=level.requirements;
  return reqs.length?Math.round(reqs.filter(r=>r.done).length/reqs.length*100):0;
}

function render(){
  let h=`<h1>🪜 职业晋升阶梯</h1><p class="subtitle">可视化职业发展路径</p>`;
  const completed=data.levels.filter((l,i)=>i<data.currentLevel).length;
  const currentPct=getProgress(data.levels[data.currentLevel]||data.levels[0]);

  h+=`<div class="timeline-info">`;
  h+=`<div class="info-card"><div class="info-num" style="color:var(--accent)">${data.currentLevel+1}</div><div class="info-label">当前等级</div></div>`;
  h+=`<div class="info-card"><div class="info-num" style="color:var(--green)">${completed}</div><div class="info-label">已完成等级</div></div>`;
  h+=`<div class="info-card"><div class="info-num" style="color:var(--yellow)">${currentPct}%</div><div class="info-label">当前进度</div></div>`;
  h+=`<div class="info-card"><div class="info-num" style="color:var(--purple)">${data.levels.length}</div><div class="info-label">总等级数</div></div>`;
  h+=`</div>`;

  h+=`<div class="card"><div class="flex-between"><b>⚙️ 设置</b><div class="flex"><button class="btn btn-sm btn-outline" onclick="addLevel()">+ 添加等级</button><button class="btn btn-sm btn-outline" onclick="editCurrent()">切换当前等级</button></div></div></div>`;

  h+=`<div class="ladder"><div class="ladder-line"></div>`;
  data.levels.forEach((level,i)=>{
    const pct=getProgress(level);
    const status=i<data.currentLevel?'completed':i===data.currentLevel?'current':'future';
    const dotClass=status==='completed'?'completed':status==='current'?'current':'future';
    h+=`<div class="level-card"><div class="level-dot ${dotClass}"></div>`;
    h+=`<div class="level-header"><div><div class="level-title">${level.title}</div><div class="level-subtitle">${level.subtitle}</div></div>`;
    h+=`<span class="level-badge badge-${status}">${status==='completed'?'✅ 已完成':status==='current'?'📍 当前':'🔮 未来'}</span></div>`;
    h+=`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${pct===100?'var(--green)':'var(--accent)'}"></div></div>`;
    h+=`<div style="font-size:.8rem;color:var(--text2);margin-bottom:8px">${pct}% 完成</div>`;
    level.requirements.forEach((r,ri)=>{
      h+=`<div class="req-item"><span>${r.text}</span><span class="req-${r.done?'check':'pending'}" onclick="toggleReq(${i},${ri})" style="cursor:pointer">${r.done?'✅':'⬜'}</span></div>`;
    });
    h+=`<button class="btn btn-sm btn-outline" style="margin-top:8px" onclick="addReq(${i})">+ 添加要求</button>`;
    h+=`</div>`;
  });
  h+=`</div>`;
  APP.innerHTML=h;
}

function toggleReq(li,ri){data.levels[li].requirements[ri].done=!data.levels[li].requirements[ri].done;save();render()}
function addReq(li){const t=prompt('新要求：');if(t){data.levels[li].requirements.push({text:t,done:false});save();render()}}
function addLevel(){
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">添加等级</h3>
    <label>等级名称</label><input id="lt" placeholder="如：技术总监">
    <label>等级描述</label><input id="ls" placeholder="如：P9 · 技术领袖">
    <div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    <button class="btn btn-success" onclick="saveLevel()">确定</button></div></div>`;
  document.body.appendChild(m);
}
function saveLevel(){
  const t=document.getElementById('lt').value.trim();if(!t)return;
  const s=document.getElementById('ls').value.trim();
  data.levels.push({title:t,subtitle:s,requirements:[]});
  save();document.querySelector('.modal-overlay').remove();render();
}
function editCurrent(){
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">选择当前等级</h3>
    ${data.levels.map((l,i)=>`<div class="req-item" style="cursor:pointer;${i===data.currentLevel?'border:2px solid var(--accent)':''}" onclick="setCurrent(${i})"><span>${l.title}</span><span style="font-size:.8rem;color:var(--text2)">${l.subtitle}</span></div>`).join('')}
    <div style="margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">关闭</button></div></div>`;
  document.body.appendChild(m);
}
function setCurrent(i){data.currentLevel=i;save();document.querySelector('.modal-overlay').remove();render()}
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
