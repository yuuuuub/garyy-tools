<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交互式报告工具</title>
<meta property="og:title" content="交互式报告工具">
<meta property="og:description" content="交互式报告工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="交互式报告工具，创建可交互的数据分析报告">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<meta name="robots" content="index, follow">
<script src="../i18n.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--pink:#ec4899;--cyan:#06b6d4;--orange:#f97316;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--green:#1a7f37;--red:#cf222e;--shadow:0 4px 24px rgba(0,0,0,.1)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;white-space:nowrap;color:var(--text2);background:transparent;border:none;transition:all .2s}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){background:var(--border)}
.stat-card{text-align:center;padding:20px;background:var(--bg);border-radius:var(--radius)}
.stat-num{font-size:2rem;font-weight:700}
.stat-label{font-size:.8rem;color:var(--text2);margin-top:4px}
.stat-change{font-size:.8rem;margin-top:4px}
.tooltip{position:relative}
.tooltip:hover::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:.75rem;white-space:nowrap;z-index:10}
.filter-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.8rem;cursor:pointer;transition:all .2s}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-btn:hover:not(.active){border-color:var(--accent)}
.table{width:100%;border-collapse:collapse;font-size:.85rem}
.table th{text-align:left;padding:10px;color:var(--text2);font-weight:600;border-bottom:2px solid var(--border)}
.table td{padding:10px;border-bottom:1px solid var(--border)}
.table tr:hover{background:rgba(59,130,246,.05)}
.table tr{cursor:pointer;transition:background .2s}
.table tr.selected{background:rgba(59,130,246,.1)}
.bar-inline{height:6px;border-radius:3px;background:var(--border);overflow:hidden;min-width:80px}
.bar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.hidden{display:none!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.grid-2,.grid-3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📋 交互式报告工具';
const $=id=>document.getElementById(id);
const APP=$('app');
const COLORS=['#3b82f6','#3fb950','#f85149','#d29922','#a855f7','#ec4899','#06b6d4','#f97316'];

let reportData={
  title:'月度业务分析报告',
  period:'2025年1月',
  sections:[
    {id:'overview',title:'概览',type:'stats',data:[
      {label:'总营收',value:'¥1,280,000',change:'+12.5%',positive:true,icon:'💰'},
      {label:'活跃用户',value:'45,600',change:'+8.3%',positive:true,icon:'👥'},
      {label:'转化率',value:'3.2%',change:'+0.5%',positive:true,icon:'📈'},
      {label:'客户满意度',value:'4.7/5',change:'-0.1',positive:false,icon:'⭐'}
    ]},
    {id:'channels',title:'渠道分析',type:'table',headers:['渠道','访客','转化','营收','占比'],
      rows:[
        ['搜索引擎',12500,'4.2%','¥520,000',40],
        ['社交媒体',8300,'2.8%','¥280,000',22],
        ['直接访问',6200,'3.5%','¥240,000',19],
        ['邮件营销',4100,'5.1%','¥160,000',12],
        ['广告投放',3200,'1.9%','¥80,000',7]
      ]},
    {id:'products',title:'产品表现',type:'chart',chartType:'bar',
      data:{labels:['产品A','产品B','产品C','产品D','产品E'],values:[320,280,210,180,120],colors:COLORS.slice(0,5)}},
    {id:'trend',title:'趋势分析',type:'chart',chartType:'line',
      data:{labels:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],values:[80,95,88,110,125,118,140,155,148,168,182,200]}},
    {id:'regions',title:'地区分布',type:'chart',chartType:'pie',
      data:{labels:['华东','华南','华北','华中','西南','其他'],values:[35,25,20,10,7,3],colors:COLORS.slice(0,6)}}
  ]
};

let filters={channel:'all',region:'all'};
let expandedSection=null;
let selectedRow=null;

function render(){
  let h=`<h1>📋 交互式报告工具</h1><p class="subtitle">${reportData.title} - ${reportData.period}</p>`;

  h+=`<div class="card"><div class="flex-between"><div class="flex">`;
  h+=`<span style="font-size:.85rem;color:var(--text2)">渠道:</span>`;
  ['all','搜索引擎','社交媒体','直接访问','邮件营销'].forEach(ch=>{
    h+=`<button class="filter-btn ${filters.channel===ch?'active':''}" onclick="filters.channel='${ch}';render()">${ch==='all'?'全部':ch}</button>`;
  });
  h+=`</div><button class="btn btn-sm btn-green" onclick="exportReport()">📤 导出</button></div></div>`;

  reportData.sections.forEach((sec,si)=>{
    const isExpanded=expandedSection===sec.id;
    h+=`<div class="card" style="cursor:pointer" onclick="toggleSection('${sec.id}')">`;
    h+=`<div class="flex-between"><h3 style="font-size:1.1rem">${sec.title}</h3><span style="color:var(--text2);font-size:.8rem">${isExpanded?'▼ 展开':'▶ 收起'}</span></div>`;
    if(isExpanded){
      if(sec.type==='stats') h+=renderStats(sec);
      else if(sec.type==='table') h+=renderTable(sec);
      else if(sec.type==='chart') h+=renderChart(sec);
    }
    h+=`</div>`;
  });

  h+=`<div class="card"><h3 style="margin-bottom:12px">📊 报告摘要</h3>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">`;
  const overview=reportData.sections[0];
  overview.data.forEach(d=>{
    h+=`<div style="padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:1.2rem">${d.icon}</div><div style="font-size:1.1rem;font-weight:700;margin:4px 0">${d.value}</div><div style="font-size:.8rem;color:var(--text2)">${d.label}</div><div style="font-size:.8rem;color:${d.positive?'var(--green)':'var(--red)'}">${d.change}</div></div>`;
  });
  h+=`</div></div>`;
  APP.innerHTML=h;
  animateBars();
}

function renderStats(sec){
  let h=`<div class="grid grid-4" style="margin-top:16px">`;
  sec.data.forEach(d=>{
    h+=`<div class="stat-card"><div style="font-size:1.5rem">${d.icon}</div><div class="stat-num" style="color:${d.positive?'var(--green)':'var(--red)'}">${d.value}</div><div class="stat-label">${d.label}</div><div class="stat-change" style="color:${d.positive?'var(--green)':'var(--red)'}">${d.change}</div></div>`;
  });
  h+=`</div>`;
  return h;
}

function renderTable(sec){
  let h=`<table class="table" style="margin-top:16px"><thead><tr>`;
  sec.headers.forEach(header=>{h+=`<th>${header}</th>`;});
  h+=`</tr></thead><tbody>`;
  sec.rows.forEach((row,ri)=>{
    h+=`<tr class="${selectedRow===ri?'selected':''}" onclick="selectedRow=${selectedRow===ri?null:ri};render()">`;
    row.forEach((cell,ci)=>{
      if(ci===row.length-1&&typeof cell==='number'){
        h+=`<td><div style="display:flex;align-items:center;gap:8px"><div class="bar-inline" style="flex:1"><div class="bar-fill" style="width:${cell}%;background:${COLORS[ri%COLORS.length]}"></div></div><span>${cell}%</span></div></td>`;
      } else {
        h+=`<td>${cell}</td>`;
      }
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table>`;
  return h;
}

function renderChart(sec){
  const d=sec.data;
  const max=Math.max(...d.values)*1.15||1;
  if(sec.chartType==='bar'){
    const w=800,h=250,pad=50;
    const gap=(w-pad*2)/d.labels.length;
    const bw=gap*.6;
    let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:250px;margin-top:16px">`;
    s+=`<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--border)"/>`;
    d.labels.forEach((l,i)=>{
      const bh=(d.values[i]/max)*(h-pad*2);
      const x=pad+gap*i+gap/2;
      s+=`<rect x="${x-bw/2}" y="${h-pad}" width="${bw}" rx="4" fill="${(d.colors||COLORS)[i%COLORS.length]}" opacity=".85"><animate attributeName="height" from="0" to="${bh}" dur=".8s" fill="freeze" begin="${i*0.08}s" calcMode="spline" keySplines="0.4 0 0.2 1"/><animate attributeName="y" from="${h-pad}" to="${h-pad-bh}" dur=".8s" fill="freeze" begin="${i*0.08}s" calcMode="spline" keySplines="0.4 0 0.2 1"/></rect>`;
      s+=`<text x="${x}" y="${h-pad-bh-8}" text-anchor="middle" fill="var(--text)" font-size="11" font-weight="600" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".3s" fill="freeze" begin="${i*0.08+0.5}s"/>${d.values[i]}</text>`;
      s+=`<text x="${x}" y="${h-pad+16}" text-anchor="middle" fill="var(--text2)" font-size="10">${l}</text>`;
    });
    s+=`</svg>`;
    return s;
  }
  if(sec.chartType==='line'){
    const w=800,h=250,pad=50;
    const gap=(w-pad*2)/(d.labels.length-1||1);
    let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:250px;margin-top:16px">`;
    const pts=d.values.map((v,i)=>`${pad+gap*i},${h-pad-(v/max)*(h-pad*2)}`).join(' ');
    let areaPath=`M${pad},${h-pad} `;
    d.values.forEach((v,i)=>{areaPath+=`L${pad+gap*i},${h-pad-(v/max)*(h-pad*2)} `;});
    areaPath+=`L${pad+gap*(d.values.length-1)},${h-pad} Z`;
    s+=`<path d="${areaPath}" fill="var(--accent)" fill-opacity=".1"/>`;
    s+=`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1500" stroke-dashoffset="1500"><animate attributeName="stroke-dashoffset" from="1500" to="0" dur="1.5s" fill="freeze"/></polyline>`;
    d.values.forEach((v,i)=>{
      const cx=pad+gap*i,cy=h-pad-(v/max)*(h-pad*2);
      s+=`<circle cx="${cx}" cy="${cy}" r="0" fill="var(--accent)"><animate attributeName="r" from="0" to="4" dur=".3s" fill="freeze" begin="${0.3+i*0.1}s"/></circle>`;
      s+=`<text x="${cx}" y="${cy-10}" text-anchor="middle" fill="var(--text)" font-size="10" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".3s" fill="freeze" begin="${0.3+i*0.1+0.3}s"/>${v}</text>`;
    });
    d.labels.forEach((l,i)=>{s+=`<text x="${pad+gap*i}" y="${h-pad+16}" text-anchor="middle" fill="var(--text2)" font-size="10">${l}</text>`;});
    s+=`</svg>`;
    return s;
  }
  if(sec.chartType==='pie'){
    const w=500,h=350,cx=w/2,cy=170,r=120;
    const total=d.values.reduce((a,b)=>a+b,0)||1;
    let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:500px;height:350px;margin:16px auto 0;display:block">`;
    let cum=0;
    d.labels.forEach((l,i)=>{
      const pct=d.values[i]/total;
      const start=cum*Math.PI*2-Math.PI/2;
      cum+=pct;
      const end=cum*Math.PI*2-Math.PI/2;
      const x1=cx+r*Math.cos(start),y1=cy+r*Math.sin(start);
      const x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end);
      const large=pct>.5?1:0;
      const midAngle=(start+end)/2;
      const tx=cx+(r+25)*Math.cos(midAngle),ty=cy+(r+25)*Math.sin(midAngle);
      s+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${(d.colors||COLORS)[i%COLORS.length]}" opacity="0"><animate attributeName="opacity" from="0" to=".85" dur=".5s" fill="freeze" begin="${i*0.12}s"/></path>`;
      s+=`<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" fill="var(--text)" font-size="11" font-weight="600" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".3s" fill="freeze" begin="${i*0.12+0.3}s"/>${l} ${Math.round(pct*100)}%</text>`;
    });
    s+=`</svg>`;
    return s;
  }
  return '';
}

function toggleSection(id){expandedSection=expandedSection===id?null:id;render();}
function animateBars(){
  setTimeout(()=>{
    document.querySelectorAll('.bar-fill').forEach(el=>{
      const w=el.style.width;el.style.width='0%';
      setTimeout(()=>{el.style.width=w;},50);
    });
  },100);
}
function exportReport(){
  const text=reportData.sections.map(s=>{
    let t=`\n## ${s.title}\n`;
    if(s.type==='stats') s.data.forEach(d=>{t+=`- ${d.label}: ${d.value} (${d.change})\n`;});
    if(s.type==='table') t+=s.headers.join(' | ')+'\n'+s.rows.map(r=>r.join(' | ')).join('\n')+'\n';
    if(s.type==='chart') t+=s.data.labels.map((l,i)=>`- ${l}: ${s.data.values[i]}`).join('\n')+'\n';
    return t;
  }).join('');
  const blob=new Blob([`# ${reportData.title}\n## ${reportData.period}\n${text}`],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='report.md';a.click();
}
expandedSection='overview';
render();
</script>
</body>
</html>
