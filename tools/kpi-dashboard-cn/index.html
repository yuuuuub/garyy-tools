<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 KPI仪表盘</title>
<meta name="description" content="KPI关键绩效指标仪表盘，可视化展示各项指标完成情况">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--purple:#7c3aed}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:1000px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
input[type=text],input[type=number]{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
input:focus{outline:none;border-color:var(--accent)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.kpi-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;transition:all .2s;position:relative}
.kpi-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.kpi-card .kpi-icon{font-size:1.5rem;margin-bottom:6px}
.kpi-card .kpi-name{font-size:.85rem;color:var(--text2);margin-bottom:8px}
.kpi-card .kpi-value{font-size:2rem;font-weight:700}
.kpi-card .kpi-target{font-size:.8rem;color:var(--text2);margin-top:2px}
.kpi-card .kpi-trend{font-size:.85rem;margin-top:6px;font-weight:600}
.kpi-card .kpi-trend.up{color:var(--green)}
.kpi-card .kpi-trend.down{color:var(--red)}
.kpi-card .kpi-trend.flat{color:var(--yellow)}
.kpi-card .kpi-bar{width:100%;height:6px;background:var(--border);border-radius:3px;margin-top:10px;overflow:hidden}
.kpi-card .kpi-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.kpi-card .delete-btn{position:absolute;top:6px;right:6px;background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:.8rem;padding:2px 6px;border-radius:4px;opacity:0;transition:opacity .2s}
.kpi-card:hover .delete-btn{opacity:1}
.kpi-card .delete-btn:hover{color:var(--red)}
.form-row{display:flex;gap:8px;margin-bottom:8px}
.form-row input{flex:1;margin:0}
.form-row select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem}
.summary-bar{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.summary-item{text-align:center;padding:12px 20px;background:var(--bg);border-radius:8px;border:1px solid var(--border);min-width:100px}
.summary-item .val{font-size:1.3rem;font-weight:700}
.summary-item .lbl{font-size:.75rem;color:var(--text2);margin-top:2px}
.chart-container{position:relative;height:200px;margin-top:12px}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:100%;padding:0 10px}
.bar-chart .bar{flex:1;border-radius:4px 4px 0 0;position:relative;transition:height .5s;min-width:30px}
.bar-chart .bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--text2);white-space:nowrap}
.bar-chart .bar-value{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:600}
.hidden{display:none}
@media(max-width:600px){.kpi-grid{grid-template-columns:1fr 1fr}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📊 KPI仪表盘">
<meta property="og:description" content="KPI关键绩效指标仪表盘，可视化展示各项指标完成情况">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='kpi_dashboard';
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{
  kpis:[
    {id:1,name:'月收入',icon:'💰',value:85000,target:100000,trend:'up',trendVal:'+12%'},
    {id:2,name:'客户满意度',icon:'⭐',value:4.6,target:4.8,trend:'up',trendVal:'+0.2'},
    {id:3,name:'新客户数',icon:'👥',value:32,target:40,trend:'down',trendVal:'-5'},
    {id:4,name:'转化率',icon:'📈',value:18,target:25,trend:'flat',trendVal:'0%'}
  ]
};
let nextId=state.kpis.length?Math.max(...state.kpis.map(k=>k.id))+1:1;
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function addKPI(){state.kpis.push({id:nextId,name:'新指标',icon:'📋',value:0,target:100,trend:'flat',trendVal:'0%'});nextId++;save();render()}
function removeKPI(id){state.kpis=state.kpis.filter(k=>k.id!==id);save();render()}
function updateKPI(id,field,val){const k=state.kpis.find(k=>k.id===id);if(k){k[field]=field==='trend'?val:field==='name'||field==='icon'?val:+val;if(field==='value'||field==='target'){const pct=Math.round((k.value/k.target)*100);if(pct>=100)k.trendVal='达标';else k.trendVal=pct+'%'}save();render()}}
function getScore(k){return Math.min(100,Math.round((k.value/k.target)*100))}
function getColor(score){return score>=80?'var(--green)':score>=50?'var(--yellow)':'var(--red)'}
function exportData(){let txt='KPI仪表盘报告\n'+'='.repeat(40)+'\n\n';state.kpis.forEach(k=>{txt+=`${k.icon} ${k.name}: ${k.value}/${k.target} (${getScore(k)}%)\n`});const blob=new Blob([txt],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='KPI报告.txt';a.click()}
function render(){
  const avgScore=state.kpis.length?Math.round(state.kpis.reduce((s,k)=>s+getScore(k),0)/state.kpis.length):0;
  const metCount=state.kpis.filter(k=>getScore(k)>=100).length;
  let h=`<div class="hdr"><h1>📊 KPI仪表盘</h1><p>关键绩效指标追踪</p></div>`;
  h+=`<div class="cd"><div class="summary-bar">`;
  h+=`<div class="summary-item"><div class="val" style="color:var(--accent)">${state.kpis.length}</div><div class="lbl">指标总数</div></div>`;
  h+=`<div class="summary-item"><div class="val" style="color:${getColor(avgScore)}">${avgScore}%</div><div class="lbl">平均达成率</div></div>`;
  h+=`<div class="summary-item"><div class="val" style="color:var(--green)">${metCount}</div><div class="lbl">已达标</div></div>`;
  h+=`<div class="summary-item"><div class="val" style="color:var(--red)">${state.kpis.length-metCount}</div><div class="lbl">未达标</div></div></div></div>`;
  h+=`<div class="cd"><div class="chart-container"><div class="bar-chart">`;
  const maxVal=Math.max(...state.kpis.map(k=>k.target),1);
  state.kpis.forEach(k=>{const score=getScore(k);const h=Math.max(10,(k.value/maxVal)*180);const th=Math.max(10,(k.target/maxVal)*180);
    h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;position:relative;height:100%"><div style="position:relative;width:100%;height:100%;display:flex;align-items:flex-end"><div class="bar" style="width:100%;height:${th}px;background:${getColor(score)};opacity:.3;position:absolute;bottom:0"></div><div class="bar" style="width:100%;height:${h}px;background:${getColor(score)};position:relative;z-index:1"><div class="bar-value" style="color:${getColor(score)}">${score}%</div></div></div><div style="font-size:.65rem;color:var(--text2);margin-top:auto;text-align:center;padding-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px">${k.icon}${k.name}</div></div>`});
  h+=`</div></div></div>`;
  h+=`<div class="cd"><h2>📋 指标详情 <button class="sec" style="font-size:.75rem;padding:3px 10px;margin-left:6px" onclick="addKPI()">+ 添加</button><button class="sec" style="font-size:.75rem;padding:3px 10px;margin-left:4px" onclick="exportData()">导出</button></h2>`;
  h+=`<div class="kpi-grid">`;
  state.kpis.forEach(k=>{const score=getScore(k);
    h+=`<div class="kpi-card"><button class="delete-btn" onclick="removeKPI(${k.id})">✕</button>`;
    h+=`<div class="kpi-icon"><input value="${k.icon}" onchange="updateKPI(${k.id},'icon',this.value)" style="text-align:center;background:transparent;border:none;font-size:1.5rem;width:40px"></div>`;
    h+=`<div class="kpi-name"><input value="${k.name}" onchange="updateKPI(${k.id},'name',this.value)" style="text-align:center;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text2);font-size:.85rem;width:120px"></div>`;
    h+=`<div class="kpi-value" style="color:${getColor(score)}"><input type="number" value="${k.value}" onchange="updateKPI(${k.id},'value',this.value)" style="text-align:center;background:transparent;border:none;font-size:2rem;font-weight:700;width:100px;color:inherit"></div>`;
    h+=`<div class="kpi-target">目标: <input type="number" value="${k.target}" onchange="updateKPI(${k.id},'target',this.value)" style="background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text2);font-size:.8rem;width:60px;text-align:center"> | <select onchange="updateKPI(${k.id},'trend',this.value)" style="background:transparent;border:none;color:var(--text);font-size:.8rem"><option value="up"${k.trend==='up'?' selected':''}>↑</option><option value="flat"${k.trend==='flat'?' selected':''}>→</option><option value="down"${k.trend==='down'?' selected':''}>↓</option></select></div>`;
    h+=`<div class="kpi-bar"><div class="kpi-bar-fill" style="width:${score}%;background:${getColor(score)}"></div></div></div>`});
  h+=`</div></div>`;
  $('app').innerHTML=h;
}
render();
</script>
</body>
</html>
