<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>迷宫贪吃蛇</title>
<meta name="description" content="迷宫贪吃蛇，在迷宫中边吃食物边找出口">
<style>
:root {--game-select:none; --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --accent:#3b82f6; }[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px; scroll-behavior:smooth;padding:16px;}
h1 { color:var(--accent); margin-bottom:8px; font-size:1.5rem; }
.hud { display:flex; gap:12px; margin:10px 0; flex-wrap:wrap; justify-content:center; }
.hud span { background:var(--card); border:1px solid var(--border); padding:6px 14px; border-radius:8px; }
canvas { border:2px solid var(--accent); border-radius:4px; display:block; margin:10px 0; }
.controls { display:flex; gap:10px; margin-top:8px; }
button { background:var(--accent); color:var(--text); border:none; padding:8px 20px; border-radius:6px; cursor:pointer; font-size:1rem; }
button:hover { opacity:0.85; }

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="迷宫贪吃蛇">
  <meta property="og:description" content="迷宫贪吃蛇，在迷宫中边吃食物边找出口">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/snake-maze/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>🏰 迷宫贪吃蛇</h1>
<div class="hud">
<span id="score">得分: 0</span>
<span id="length">长度: 3</span>
<span id="level">关卡: 1</span>
</div>
<canvas id="game" width="420" height="420"></canvas>
<div class="controls">
<button onclick="startGame()">开始游戏</button>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const G=21,C=20,R=20;
let snake,dir,nextDir,food,maze,score,alive,level,gameLoop;
function generateMaze(rows,cols){
  const grid=Array.from({length:rows},()=>Array(cols).fill(1));
  const visited=Array.from({length:rows},()=>Array(cols).fill(false));
  const stack=[];
  function carve(r,c){
    visited[r][c]=true;grid[r][c]=0;
    const dirs=[[0,2],[0,-2],[2,0],[-2,0]].sort(()=>Math.random()-0.5);
    for(const[dr,dc]of dirs){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&!visited[nr][nc]){
        grid[r+dr/2][c+dc/2]=0;
        carve(nr,nc);
      }
    }
  }
  carve(1,1);
  grid[1][1]=0;grid[1][2]=0;grid[2][1]=0;grid[1][3]=0;grid[3][1]=0;
  return grid;
}
function init(){
  level=1;score=0;alive=true;
  snake=[{x:2,y:2},{x:1,y:2},{x:0,y:2}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  maze=generateMaze(R,C);
  spawnFood();
  updateHUD();
}
function spawnFood(){
  const empty=[];
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    if(maze[r][c]===0&&!snake.some(s=>s.x===c&&s.y===r))empty.push({x:c,y:r});
  }
  if(empty.length>0)food=empty[Math.floor(Math.random()*empty.length)];
}
function updateHUD(){
  document.getElementById('score').textContent='得分: '+score;
  document.getElementById('length').textContent='长度: '+snake.length;
  document.getElementById('level').textContent='关卡: '+level;
}
function step(){
  if(!alive)return;
  dir={...nextDir};
  let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=C||head.y<0||head.y>=R){alive=false;end();return;}
  if(maze[head.y][head.x]===1){alive=false;end();return;}
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){alive=false;end();return;}
  snake.unshift(head);let ate=false;
  if(food&&head.x===food.x&&head.y===food.y){
    score+=10;ate=true;
    if(snake.length%5===0){level++;maze=generateMaze(R,C);snake=[{x:2,y:2},{x:1,y:2},{x:0,y:2}];dir={x:1,y:0};nextDir={x:1,y:0};}
    spawnFood();
  }
  if(!ate)snake.pop();
  draw();updateHUD();
}
function end(){
  draw();
  setTimeout(()=>garyyToast('游戏结束！得分: '+score),50);
}
function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    if(maze[r][c]===1){ctx.fillStyle='#30363d';ctx.fillRect(c*G,r*G,G,G);}
    else{ctx.fillStyle='#0d1117';ctx.fillRect(c*G,r*G,G,G);}
  }
  ctx.strokeStyle='#1a2030';ctx.lineWidth=0.3;
  for(let x=0;x<=C;x++){ctx.beginPath();ctx.moveTo(x*G,0);ctx.lineTo(x*G,canvas.height);ctx.stroke();}
  for(let y=0;y<=R;y++){ctx.beginPath();ctx.moveTo(0,y*G);ctx.lineTo(canvas.width,y*G);ctx.stroke();}
  if(food){ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(food.x*G+G/2,food.y*G+G/2,G/2-2,0,Math.PI*2);ctx.fill();}
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?'#22c55e':'#16a34a';
    ctx.fillRect(s.x*G+1,s.y*G+1,G-2,G-2);
  });
  if(!alive){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#ef4444';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
    ctx.fillText('游戏结束',canvas.width/2,canvas.height/2);
  }
}
function startGame(){clearInterval(gameLoop);init();draw();gameLoop=setInterval(step,120);}
document.addEventListener('keydown',e=>{
  const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
  const nd=m[e.key];if(nd&&(nd.x+dir.x!==0||nd.y+dir.y!==0)){nextDir=nd;e.preventDefault();}
});
let tx,ty;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  let nd;if(Math.abs(dx)>Math.abs(dy))nd={x:dx>0?1:-1,y:0};else nd={x:0,y:dy>0?1:-1};
  if(nd.x+dir.x!==0||nd.y+dir.y!==0)nextDir=nd;
});
init();draw();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
