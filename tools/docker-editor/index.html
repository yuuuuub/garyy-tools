<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docker配置编辑器</title>
<meta name="description" content="Docker配置文件在线编辑器，编写docker-compose配置">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950;--red:#f85149}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;min-height:100vh}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.header .icon{font-size:28px}
.tabs{display:flex;gap:0;background:var(--card);border-bottom:1px solid var(--border);padding:0 24px}
.tab{padding:12px 20px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-size:14px;transition:all .2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--border)}
.btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.editor-wrap{display:flex;flex:1;overflow:hidden;height:calc(100vh - 160px)}
.line-numbers{background:var(--card);border-right:1px solid var(--border);padding:12px 8px;text-align:right;color:var(--muted);font-family:'SF Mono',Monaco,Consolas,monospace;font-size:14px;line-height:1.6;user-select:none;overflow:hidden;min-width:40px}
.editor{flex:1;width:100%;background:var(--bg);color:var(--text);border:none;outline:none;resize:none;padding:12px 16px;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:14px;line-height:1.6;tab-size:4}
.templates-panel{display:none;padding:16px 24px;background:var(--card);border-top:1px solid var(--border);max-height:300px;overflow-y:auto}
.templates-panel.show{display:block}
.template-card{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.template-card:hover{border-color:var(--accent)}
.template-card h3{font-size:14px;margin-bottom:4px}
.template-card p{font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;z-index:100}
.toast.show{opacity:1}
@media(max-width:768px){.header{padding:12px 16px}.header h1{font-size:16px}.toolbar{padding:8px 16px}.editor-wrap{height:calc(100vh - 200px)}.tabs{padding:0 16px}.tab{padding:10px 14px;font-size:13px}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Docker配置编辑器">
  <meta property="og:description" content="Docker配置文件在线编辑器，编写docker-compose配置">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/docker-editor/">
</head>
<body>
<div class="header">
<span class="icon">🐳</span>
<h1>Docker配置编辑器</h1>
</div>
<div class="tabs">
<div class="tab active" data-tab="dockerfile">Dockerfile</div>
<div class="tab" data-tab="compose">docker-compose.yml</div>
</div>
<div class="toolbar">
<button class="btn" onclick="loadTemplate('dockerfile-basic')">基础Dockerfile</button>
<button class="btn" onclick="loadTemplate('dockerfile-node')">Node.js</button>
<button class="btn" onclick="loadTemplate('dockerfile-python')">Python</button>
<button class="btn" onclick="loadTemplate('compose-basic')">基础Compose</button>
<button class="btn" onclick="loadTemplate('compose-full')">完整Compose</button>
<button class="btn btn-primary" onclick="copyToClipboard()">📋 复制</button>
<button class="btn" onclick="downloadFile()">⬇️ 下载</button>
</div>
<div class="editor-wrap">
<div class="line-numbers" id="lineNums">1</div>
<textarea class="editor" id="editor" spellcheck="false" placeholder="在此输入Docker配置..."></textarea>
</div>
<div class="toast" id="toast"></div>
<script>
const templates={
'dockerfile-basic':`# 基础Dockerfile
FROM ubuntu:22.04
LABEL maintainer="your-name"
WORKDIR /app
COPY . .
RUN apt-get update && apt-get install -y \\
    curl \\
    wget
EXPOSE 8080
CMD ["./start.sh"]`,
'dockerfile-node':`# Node.js Dockerfile
FROM node:18-alpine
WORKDIR /app
COPY package*.json ./
RUN npm ci --only=production
COPY . .
EXPOSE 3000
ENV NODE_ENV=production
CMD ["node", "server.js"]`,
'dockerfile-python':`# Python Dockerfile
FROM python:3.11-slim
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY . .
EXPOSE 8000
CMD ["python", "app.py"]`,
'compose-basic':`# 基础docker-compose
version: '3.8'
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production`,
'compose-full':`# 完整docker-compose
version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
      - redis
    restart: unless-stopped
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:`
};
let currentTab='dockerfile';
const editor=document.getElementById('editor');
const lineNums=document.getElementById('lineNums');
function updateLineNumbers(){
const lines=editor.value.split('\n').length;
lineNums.innerHTML=Array.from({length:lines},(_,i)=>`<div>${i+1}</div>`).join('');
}
editor.addEventListener('input',updateLineNumbers);
editor.addEventListener('scroll',()=>{lineNums.scrollTop=editor.scrollTop});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',function(){
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
this.classList.add('active');
currentTab=this.dataset.tab;
}));
function loadTemplate(key){editor.value=templates[key]||'';updateLineNumbers()}
function copyToClipboard(){
navigator.clipboard.writeText(editor.value).then(()=>showToast('已复制到剪贴板'));
}
function downloadFile(){
const name=currentTab==='dockerfile'?'Dockerfile':'docker-compose.yml';
const blob=new Blob([editor.value],{type:'text/plain'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);a.download=name;a.click();
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
loadTemplate('dockerfile-basic');
</script>
</body>
</html>
