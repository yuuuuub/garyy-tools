.timeline-track{position:relative;overflow-x:auto;padding:10px 0 30px}

// DOM
const brandGrid = document.getElementById('brandGrid');
const stats = document.getElementById('stats');
const searchInput = document.getElementById('searchInput');
let currentFilter = 'all';
let currentCat = 'all';

// Render
function getCategoryClass(cat){return cat==='luxury'?'cat-luxury':cat==='ev'?'cat-ev':'cat-mainstream';}
function getCategoryLabel(cat){return cat==='luxury'?'豪华品牌':cat==='ev'?'新能源品牌':'主流品牌';}

function renderBrands(){
  const searchTerm = searchInput.value.toLowerCase();
  let filtered = brands;
  if(currentFilter!=='all') filtered = filtered.filter(b=>b.country===currentFilter);
  if(currentCat!=='all') filtered = filtered.filter(b=>b.category===currentCat);
  if(searchTerm){
    filtered = filtered.filter(b=>
      b.nameZh.includes(searchTerm) ||
      b.nameEn.toLowerCase().includes(searchTerm) ||
      b.headquarters.includes(searchTerm) ||
      b.models.some(m=>m.toLowerCase().includes(searchTerm))
    );
  }
  stats.textContent = `共 ${filtered.length} 个品牌`;
  brandGrid.innerHTML = filtered.map(b=>{
    const initials = b.nameEn.charAt(0).toUpperCase();
    return `
    <div class="brand-card ${getCategoryClass(b.category)}" data-country="${b.country}">
      <div class="brand-header">
        <div class="brand-icon">${initials}</div>
        <div>
          <div class="brand-name-zh">${b.nameZh}</div>
          <div class="brand-name-en">${b.nameEn}</div>
        </div>
      </div>
      <div class="brand-meta">
        <span>${b.country}</span>
        <span>${b.founded}年</span>
        <span>${b.headquarters}</span>
        <span>${getCategoryLabel(b.category)}</span>
      </div>
      <div class="brand-desc"><strong>标志解读：</strong>${b.logo}</div>
      <div class="brand-story"><strong>品牌故事：</strong>${b.story}</div>
      <div class="popular-models">
        <span>热门车型：</span>
        ${b.models.map(m=>`<span>${m}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
}

// Navigation
document.getElementById('countryNav').addEventListener('click',e=>{
  if(e.target.tagName==='BUTTON'){
    document.querySelectorAll('#countryNav button').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    renderBrands();
  }
});

// Category filter
document.getElementById('filterRow').addEventListener('click',e=>{
  if(e.target.classList.contains('filter-btn')){
    document.querySelectorAll('#filterRow .filter-btn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    currentCat = e.target.dataset.cat;
    renderBrands();
  }
});

// Search
searchInput.addEventListener('input', renderBrands);

// Quiz
let quizBrand = null;
function getRandomBrand(){
  return brands[Math.floor(Math.random()*brands.length)];
}
function nextQuiz(){
  quizBrand = getRandomBrand();
  document.getElementById('quizQuestion').innerHTML = `<strong>猜猜这是哪个品牌？</strong><br><br>🖼️ <em>${quizBrand.logo}</em><br><br>📅 成立年份：${quizBrand.founded}年<br>🏭 总部：${quizBrand.headquarters}<br>🌍 国家/地区：${quizBrand.country}<br>📂 分类：${getCategoryLabel(quizBrand.category)}<br>🚗 热门车型：${quizBrand.models.join('、')}`;
  document.getElementById('quizAnswer').value='';
  document.getElementById('quizFeedback').textContent='';
  document.getElementById('quizAnswer').focus();
}
function checkQuizAnswer(){
  if(!quizBrand){nextQuiz();return;}
  const answer = document.getElementById('quizAnswer').value.trim();
  const fb = document.getElementById('quizFeedback');
  if(!answer){fb.textContent='请输入你的答案';fb.style.color='#ff6b6b';return;}
  const correct = answer===quizBrand.nameZh || answer.toLowerCase()===quizBrand.nameEn.toLowerCase();
  if(correct){
    fb.innerHTML = `✅ 正确！这就是<strong>${quizBrand.nameZh}（${quizBrand.nameEn}）</strong>！<br>${quizBrand.story}`;
    fb.style.color='#6bcb77';
  }else{
    fb.innerHTML = `❌ 不对哦，答案是<strong>${quizBrand.nameZh}（${quizBrand.nameEn}）</strong><br>${quizBrand.story}`;
    fb.style.color='#ff6b6b';
  }
}
document.getElementById('quizAnswer').addEventListener('keydown',e=>{if(e.key==='Enter')checkQuizAnswer();});
nextQuiz();

// Timeline
function renderTimeline(){
  const sorted = [...brands].sort((a,b)=>a.founded-b.founded);
  const tl = document.getElementById('timelineLine');
  tl.innerHTML = sorted.map(b=>`
    <div class="timeline-item" title="${b.nameZh} (${b.nameEn}) — ${b.founded}年">
      <div class="year">${b.founded}</div>
      <div class="dot"></div>
      <div class="tname">${b.nameZh}</div>
    </div>
  `).join('');
}
renderTimeline();

// Country stats
function updateCountryStats(){
  const counts = {};
  brands.forEach(b=>{counts[b.country]=(counts[b.country]||0)+1;});
  document.getElementById('statChina').textContent=counts['中国']||0;
  document.getElementById('statJapan').textContent=counts['日本']||0;
  document.getElementById('statGermany').textContent=counts['德国']||0;
  document.getElementById('statUSA').textContent=counts['美国']||0;
  document.getElementById('statKorea').textContent=counts['韩国']||0;
  document.getElementById('statUK').textContent=counts['英国']||0;
  document.getElementById('statItaly').textContent=counts['意大利']||0;
  document.getElementById('statFrance').textContent=counts['法国']||0;
  document.getElementById('statOther').textContent=counts['其他']||0;
}

// Category stats
(function updateCategoryStats(){
  const luxuryCount=brands.filter(b=>b.category==='luxury').length;
  const mainstreamCount=brands.filter(b=>b.category==='mainstream').length;
  const evCount=brands.filter(b=>b.category==='ev').length;
  document.getElementById('filterRow').querySelector('[data-cat="luxury"]').textContent=
    `💎 豪华品牌 (${luxuryCount})`;
  document.getElementById('filterRow').querySelector('[data-cat="mainstream"]').textContent=
    `🚗 主流品牌 (${mainstreamCount})`;
  document.getElementById('filterRow').querySelector('[data-cat="ev"]').textContent=
    `⚡ 新能源品牌 (${evCount})`;
})();

// Init
updateCountryStats();
renderBrands();
