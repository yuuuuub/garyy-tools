<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍳 智能菜谱搜索 v2</title>
<meta name="description" content="根据食材、口味、烹饪方式智能推荐菜谱，支持收藏和历史记录">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#f97316;--accent2:#ea580c;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#ea580c;--accent2:#c2410c;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--blue:#0969da;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}
select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin:2px 4px 2px 0}
.tag.green{background:var(--green)}.tag.yellow{background:var(--yellow)}.tag.red{background:var(--red)}.tag.blue{background:var(--blue)}
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:12px}
.recipe-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .2s}
.recipe-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.recipe-card h3{font-size:1rem;margin-bottom:6px}
.recipe-card .meta{font-size:.8rem;color:var(--text2);margin-bottom:8px}
.recipe-card .tags{display:flex;flex-wrap:wrap;gap:4px}
.detail-panel{display:none}.detail-panel.show{display:block}
.detail-panel .back{margin-bottom:12px}
.detail-panel .steps{counter-reset:step}
.detail-panel .steps li{list-style:none;padding:10px 0;border-bottom:1px solid var(--border);counter-increment:step;position:relative;padding-left:36px}
.detail-panel .steps li::before{content:counter(step);position:absolute;left:0;top:10px;width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.detail-panel .ing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.detail-panel .ing-item{background:var(--bg);padding:8px 12px;border-radius:8px;font-size:.85rem}
.detail-panel .ing-item b{color:var(--accent)}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.stat-box{text-align:center;padding:12px 8px;background:var(--bg);border-radius:8px}
.stat-box .num{font-size:1.2rem;font-weight:700;color:var(--accent)}
.stat-box .lbl{font-size:.75rem;color:var(--text2);margin-top:2px}
.diff-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.7rem;font-weight:600}
.diff-easy{background:rgba(34,197,94,.15);color:var(--green)}
.diff-medium{background:rgba(234,179,8,.15);color:var(--yellow)}
.diff-hard{background:rgba(239,68,68,.15);color:var(--red)}
.empty{text-align:center;padding:30px;color:var(--text2);font-size:.9rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🍳 智能菜谱搜索 v2">
<meta property="og:description" content="根据食材、口味、烹饪方式智能推荐菜谱">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🍳 智能菜谱搜索 v2</h1><p>输入食材或菜名，智能推荐匹配菜谱</p></div>

<div class="cd" id="searchCard">
<h2>搜索菜谱</h2>
<div class="fr">
<div><label>关键词</label><input type="text" id="keyword" placeholder="菜名或食材，如：鸡胸肉、红烧肉" onkeydown="if(event.key==='Enter')search()"></div>
<div><label>分类</label><select id="category">
<option value="">全部分类</option>
<option value="家常菜">家常菜</option>
<option value="川菜">川菜</option>
<option value="粤菜">粤菜</option>
<option value="烘焙">烘焙</option>
<option value="汤羹">汤羹</option>
<option value="凉菜">凉菜</option>
<option value="快手菜">快手菜</option>
</select></div>
</div>
<div class="fr" style="margin-top:8px">
<div><label>难度</label><select id="difficulty">
<option value="">不限</option>
<option value="简单">简单</option>
<option value="中等">中等</option>
<option value="较难">较难</option>
</select></div>
<div><label>烹饪时间</label><select id="timeLimit">
<option value="">不限</option>
<option value="15">15分钟内</option>
<option value="30">30分钟内</option>
<option value="60">1小时内</option>
</select></div>
</div>
<div class="bg">
<button onclick="search()">🔍 搜索</button>
<button class="sec" onclick="showRandom()">🎲 随机推荐</button>
<button class="sec" onclick="showFavorites()">❤️ 我的收藏</button>
</div>
</div>

<div id="listView">
<div class="cd"><h2 id="listTitle">推荐菜谱</h2><div class="recipe-grid" id="recipeGrid"></div></div>
</div>

<div class="cd detail-panel" id="detailView">
<button class="sec back" onclick="backToList()">← 返回列表</button>
<h2 id="detailTitle"></h2>
<div class="stats-row" id="detailStats"></div>
<div id="detailTags" style="margin-bottom:12px"></div>
<h3 style="color:var(--accent);margin:16px 0 8px">🥗 食材</h3>
<div class="ing-grid" id="detailIng"></div>
<h3 style="color:var(--accent);margin:16px 0 8px">👨‍🍳 步骤</h3>
<ol class="steps" id="detailSteps"></ol>
<div class="bg" style="margin-top:16px">
<button onclick="toggleFav()" id="favBtn">❤️ 收藏</button>
<button class="sec" onclick="shareRecipe()">📤 分享</button>
</div>
</div>

<div class="cd"><h2>📜 历史记录</h2><div id="historyList" class="empty">暂无搜索历史</div></div>
</div>
<script>
var DB='recipe_finder_v2',hist=JSON.parse(localStorage.getItem(DB+'_hist')||'[]'),favs=JSON.parse(localStorage.getItem(DB+'_favs')||'[]'),curRecipe=null,viewMode='list';
var RECIPES=[
{id:1,name:'红烧肉',emoji:'🥩',cat:'家常菜',diff:'中等',time:90,cal:480,protein:22,carb:8,fat:40,ing:{五花肉:'500g',冰糖:'30g',酱油:'3勺',料酒:'2勺',葱:'2根',姜:'5片',八角:'2个',桂皮:'1小块'},steps:['五花肉切块焯水去血沫','锅中放少许油炒化冰糖至焦糖色','放入肉块翻炒上色','加葱姜八角桂皮炒香','加酱油料酒和没过肉的水','大火烧开转小火炖60分钟','大火收汁即可'],tags:['下饭','经典']},
{id:2,name:'宫保鸡丁',emoji:'🍗',cat:'川菜',diff:'中等',time:25,cal:230,protein:18,carb:12,fat:13,ing:{鸡胸肉:'250g',花生米:'50g',干辣椒:'10个',花椒:'1小勺',葱:'2根',蒜:'3瓣',姜:'3片'},steps:['鸡胸肉切丁加料酒淀粉腌10分钟','调碗汁：酱油2勺醋1勺糖1勺淀粉1勺水2勺','花生米小火炒熟备用','热油爆香干辣椒花椒','下鸡丁炒至变色','倒入碗汁翻炒均匀','加入花生米出锅'],tags:['快手','下饭']},
{id:3,name:'番茄炒蛋',emoji:'🍅',cat:'家常菜',diff:'简单',time:10,cal:180,protein:10,carb:8,fat:12,ing:{鸡蛋:'3个',番茄:'2个',葱:'1根',糖:'1小勺',盐:'适量'},steps:['番茄切块鸡蛋打散加少许盐','热锅多油炒鸡蛋盛出','锅留底油炒番茄至出汁','加糖盐调味','倒回鸡蛋翻炒均匀出锅'],tags:['快手','家常']},
{id:4,name:'麻婆豆腐',emoji:'🫕',cat:'川菜',diff:'中等',time:15,cal:200,protein:12,carb:6,fat:15,ing:{嫩豆腐:'1盒',猪肉末:'100g',豆瓣酱:'1勺',花椒粉:'适量',葱花:'适量',蒜末:'适量'},steps:['豆腐切小块焯水沥干','热油炒肉末至变色','加豆瓣酱蒜末炒出红油','加少许水烧开放入豆腐','小火煮3分钟入味','水淀粉勾芡撒花椒粉葱花'],tags:['下饭','快手']},
{id:5,name:'清蒸鲈鱼',emoji:'🐟',cat:'粤菜',diff:'中等',time:25,cal:150,protein:28,carb:2,fat:4,ing:{鲈鱼:'1条',葱:'3根',姜:'1块',蒸鱼豉油:'2勺',料酒:'1勺'},steps:['鱼处理干净两面划刀','抹料酒姜片腌10分钟','水烧开后大火蒸8分钟','倒掉蒸出的汤汁','铺葱丝淋热油','最后淋蒸鱼豉油'],tags:['清淡','高蛋白']},
{id:6,name:'蒜蓉西兰花',emoji:'🥦',cat:'快手菜',diff:'简单',time:8,cal:80,protein:5,carb:6,fat:4,ing:{西兰花:'1棵',蒜:'5瓣',盐:'适量',蚝油:'1勺'},steps:['西兰花掰小朵盐水泡10分钟','烧水加少许油盐焯西兰花1分钟捞出','热油爆香蒜末','下西兰花翻炒','加蚝油盐调味出锅'],tags:['低脂','健康']},
{id:7,name:'蛋炒饭',emoji:'🍚',cat:'快手菜',diff:'简单',time:8,cal:350,protein:10,carb:50,fat:12,ing:{隔夜饭:'1碗',鸡蛋:'2个',葱:'1根',盐:'适量',酱油:'少许'},steps:['鸡蛋打散葱切花','热锅多油下蛋液','半凝固时加米饭','大火翻炒至粒粒分明','加盐少许酱油调色调味','撒葱花出锅'],tags:['快手','主食']},
{id:8,name:'可乐鸡翅',emoji:'🍗',cat:'家常菜',diff:'简单',time:30,cal:280,protein:16,carb:20,fat:14,ing:{鸡翅中:'8个',可乐:'1罐',酱油:'2勺',姜:'3片',料酒:'1勺'},steps:['鸡翅划刀冷水焯水捞出','热油煎鸡翅至两面金黄','加姜片料酒酱油翻炒','倒入可乐没过鸡翅','大火烧开转中火煮15分钟','大火收汁'],tags:['甜口','简单']},
{id:9,name:'蒜蓉粉丝蒸虾',emoji:'🦐',cat:'粤菜',diff:'中等',time:20,cal:120,protein:20,carb:8,fat:2,ing:{大虾:'8只',粉丝:'1把',蒜:'1头',葱:'1根',蒸鱼豉油:'2勺'},steps:['粉丝泡软铺盘底','虾开背去虾线摆在粉丝上','蒜末用热油泼香','将蒜蓉淋在虾上','水开后大火蒸8分钟','淋蒸鱼豉油撒葱花'],tags:['鲜美','宴客']},
{id:10,name:'水煮牛肉',emoji:'🥩',cat:'川菜',diff:'较难',time:40,cal:320,protein:25,carb:8,fat:22,ing:{牛肉:'300g',豆芽:'200g',豆瓣酱:'2勺',花椒:'1勺',干辣椒:'10个',蒜:'5瓣'},steps:['牛肉切片加蛋清淀粉料酒腌15分钟','豆芽焯水铺碗底','热油炒豆瓣酱出红油','加水烧开下牛肉片煮至变色','连汤倒入碗中','另起油锅炸花椒干辣椒浇在牛肉上'],tags:['麻辣','经典']},{id:11,name:'葱油拌面',emoji:'🍜',cat:'家常菜',diff:'简单',time:15,cal:380,protein:10,carb:58,fat:12,ing:{面条:'200g',小葱:'1大把',酱油:'3勺',糖:'1勺',油:'适量'},steps:['小葱切段','宽油小火炸葱至焦黄捞出','葱油加酱油糖煮开成酱汁','面条煮熟捞出','浇上葱油酱汁拌匀'],tags:['快手','主食']},{id:12,name:'酸辣土豆丝',emoji:'🥔',cat:'家常菜',diff:'简单',time:10,cal:120,protein:3,carb:20,fat:4,ing:{土豆:'2个',干辣椒:'5个',醋:'2勺',蒜:'3瓣',葱:'1根'},steps:['土豆去皮切丝泡水去淀粉','热油爆香干辣椒蒜末','下土豆丝大火翻炒','沿锅边淋醋','加盐调味撒葱花出锅'],tags:['快手','素菜']}];

function search(){
var kw=document.getElementById('keyword').value.trim().toLowerCase();
var cat=document.getElementById('category').value;
var diff=document.getElementById('difficulty').value;
var tMax=parseInt(document.getElementById('timeLimit').value)||Infinity;
var results=RECIPES.filter(function(r){
if(kw&&!r.name.toLowerCase().includes(kw)&&!Object.keys(r.ing).join('').toLowerCase().includes(kw))return false;
if(cat&&r.cat!==cat)return false;
if(diff&&r.diff!==diff)return false;
if(r.time>tMax)return false;
return true;
});
showList(results,'搜索结果');
if(kw){hist.unshift(kw);hist=[...new Set(hist)].slice(0,20);localStorage.setItem(DB+'_hist',JSON.stringify(hist));renderHistory();}
}
function showRandom(){var r=RECIPES[Math.floor(Math.random()*RECIPES.length)];showDetail(r);}
function showFavorites(){var list=RECIPES.filter(function(r){return favs.includes(r.id)});showList(list.length?list:RECIPES,'我的收藏');}
function showList(list,title){
document.getElementById('listTitle').textContent=title||'推荐菜谱';
document.getElementById('listView').style.display='block';
document.getElementById('detailView').classList.remove('show');
var g=document.getElementById('recipeGrid');
if(!list.length){g.innerHTML='<div class="empty">没有找到匹配的菜谱</div>';return;}
g.innerHTML=list.map(function(r){var dc=r.diff==='简单'?'diff-easy':r.diff==='中等'?'diff-medium':'diff-hard';
return '<div class="recipe-card" onclick="showDetail(RECIPES.find(function(x){return x.id==='+r.id+'}))">'+r.emoji+'<h3>'+r.name+'</h3><div class="meta">⏱ '+r.time+'分钟 · <span class="diff-badge '+dc+'">'+r.diff+'</span> · '+r.cat+'</div><div class="tags">'+r.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div>'}).join('');
}
function showDetail(r){
curRecipe=r;
document.getElementById('listView').style.display='none';
var d=document.getElementById('detailView');d.classList.add('show');
document.getElementById('detailTitle').textContent=r.emoji+' '+r.name;
document.getElementById('detailStats').innerHTML='<div class="stat-box"><div class="num">'+r.cal+'</div><div class="lbl">千卡</div></div><div class="stat-box"><div class="num">'+r.protein+'g</div><div class="lbl">蛋白质</div></div><div class="stat-box"><div class="num">'+r.carb+'g</div><div class="lbl">碳水</div></div><div class="stat-box"><div class="num">'+r.fat+'g</div><div class="lbl">脂肪</div></div>';
document.getElementById('detailTags').innerHTML='<span class="tag blue">'+r.cat+'</span><span class="tag">'+r.diff+'</span><span class="tag green">⏱ '+r.time+'分钟</span>'+r.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('');
document.getElementById('detailIng').innerHTML=Object.entries(r.ing).map(function(e){return '<div class="ing-item">'+e[0]+': <b>'+e[1]+'</b></div>'}).join('');
document.getElementById('detailSteps').innerHTML=r.steps.map(function(s){return '<li>'+s+'</li>'}).join('');
updateFavBtn();
}
function backToList(){document.getElementById('detailView').classList.remove('show');document.getElementById('listView').style.display='block';}
function toggleFav(){if(!curRecipe)return;var idx=favs.indexOf(curRecipe.id);if(idx>-1)favs.splice(idx,1);else favs.push(curRecipe.id);localStorage.setItem(DB+'_favs',JSON.stringify(favs));updateFavBtn();}
function updateFavBtn(){if(!curRecipe)return;var b=document.getElementById('favBtn');b.textContent=favs.includes(curRecipe.id)?'💔 取消收藏':'❤️ 收藏';}
function shareRecipe(){if(!curRecipe)return;var text='【'+curRecipe.name+'】\n食材：'+Object.entries(curRecipe.ing).map(function(e){return e[0]+e[1]}).join('、')+'\n步骤：'+curRecipe.steps.join('\n');if(navigator.share){navigator.share({title:curRecipe.name,text:text});}else{navigator.clipboard.writeText(text);alert('已复制到剪贴板');}}
function renderHistory(){var h=document.getElementById('historyList');if(!hist.length){h.innerHTML='<div class="empty">暂无搜索历史</div>';return;}h.innerHTML=hist.map(function(k){return '<span class="tag" style="cursor:pointer" onclick="document.getElementById(\'keyword\').value=\''+k+'\';search()">'+k+'</span>'}).join('');}
showList(RECIPES);renderHistory();
</script>
</body>
</html>
