<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✂️ 视频裁剪器</title>
<meta name="description" content="在线视频裁剪器，设置起止时间裁剪视频片段，支持预览和导出">
<style>
:root{--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s}
.upload-area:hover{border-color:var(--accent);background:var(--tag-bg)}
.upload-icon{font-size:48px;margin-bottom:8px}
.upload-text{font-size:14px;color:var(--text-secondary)}
.video-wrap{display:flex;justify-content:center;border-radius:12px;overflow:hidden;background:#000}
video{width:100%;max-height:300px;display:block}
.timeline{position:relative;height:40px;background:var(--preview-bg);border-radius:8px;margin:12px 0;overflow:hidden}
.timeline-bar{position:absolute;top:0;height:100%;background:rgba(99,102,241,.3);border:2px solid var(--accent);border-radius:6px}
.timeline-handle{position:absolute;top:-4px;width:16px;height:48px;background:var(--accent);border-radius:4px;cursor:ew-resize;z-index:2}
.timeline-handle.start{left:0;border-radius:4px 0 0 4px}
.timeline-handle.end{right:0;border-radius:0 4px 4px 0}
.timeline-cursor{position:absolute;top:0;width:2px;height:100%;background:#ef4444;z-index:1}
.time-inputs{display:flex;gap:12px;margin-top:8px}
.time-input{flex:1}
.time-input label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.time-input input{width:100%;padding:8px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;font-family:monospace;text-align:center;outline:none}
.time-input input:focus{border-color:var(--accent)}
.info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.info-item{background:var(--preview-bg);border-radius:10px;padding:10px;text-align:center}
.info-item .val{font-size:16px;font-weight:700;color:var(--accent)}
.info-item .lbl{font-size:11px;color:var(--text-secondary);margin-top:2px}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.hidden{display:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✂️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="✂️ 视频裁剪器">
<meta property="og:description" content="在线视频裁剪器，设置起止时间裁剪视频片段">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/video-trim-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>✂️ 视频裁剪器</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card" id="uploadCard">
    <div class="card-title">📤 上传视频</div>
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">🎬</div>
      <div class="upload-text">点击或拖拽上传视频</div>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">支持 MP4 / WebM / MOV</div>
    </div>
    <input type="file" id="fileInput" accept="video/*" style="display:none">
  </div>

  <div class="card hidden" id="videoCard">
    <div class="card-title">🎬 预览</div>
    <div class="video-wrap"><video id="videoPlayer" controls></video></div>
  </div>

  <div class="card hidden" id="timelineCard">
    <div class="card-title">⏱️ 时间轴</div>
    <div class="timeline" id="timeline">
      <div class="timeline-bar" id="timelineBar"></div>
      <div class="timeline-handle start" id="handleStart"></div>
      <div class="timeline-handle end" id="handleEnd"></div>
      <div class="timeline-cursor" id="timelineCursor"></div>
    </div>
    <div class="time-inputs">
      <div class="time-input"><label>开始时间</label><input id="startTime" value="00:00:00" onchange="updateFromInput()"></div>
      <div class="time-input"><label>结束时间</label><input id="endTime" value="00:00:00" onchange="updateFromInput()"></div>
    </div>
    <div class="info-grid">
      <div class="info-item"><div class="val" id="infoTotal">0s</div><div class="lbl">总时长</div></div>
      <div class="info-item"><div class="val" id="infoTrim">0s</div><div class="lbl">裁剪时长</div></div>
      <div class="info-item"><div class="val" id="infoSize">-</div><div class="lbl">文件大小</div></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="setStart()">📍 设为开始</button>
      <button class="btn btn-outline" onclick="setEnd()">📍 设为结束</button>
    </div>
  </div>

  <div class="btn-row hidden" id="btnRow">
    <button class="btn btn-primary" onclick="trimVideo()">✂️ 裁剪导出</button>
    <button class="btn btn-outline" onclick="resetAll()">🔄 重置</button>
  </div>

  <footer>视频裁剪器 · 所有处理在浏览器本地完成</footer>
</div>
<div class="toast" id="toast"></div>
<script src="../i18n.js" defer></script>
<script>
let videoEl = null, videoDuration = 0, trimStart = 0, trimEnd = 0, videoBlob = null;
let dragging = null;

function init() {
  const ua = document.getElementById('uploadArea');
  const fi = document.getElementById('fileInput');
  ua.addEventListener('click', () => fi.click());
  ua.addEventListener('dragover', e => { e.preventDefault(); ua.classList.add('dragover'); });
  ua.addEventListener('dragleave', () => ua.classList.remove('dragover'));
  ua.addEventListener('drop', e => { e.preventDefault(); ua.classList.remove('dragover'); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
  fi.addEventListener('change', e => { if(e.target.files[0]) loadFile(e.target.files[0]); });

  // Timeline dragging
  const tl = document.getElementById('timeline');
  const hs = document.getElementById('handleStart');
  const he = document.getElementById('handleEnd');
  hs.addEventListener('mousedown', () => dragging = 'start');
  he.addEventListener('mousedown', () => dragging = 'end');
  tl.addEventListener('click', e => {
    if (dragging) return;
    const rect = tl.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    videoEl.currentTime = pct * videoDuration;
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const rect = tl.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    if (dragging === 'start') { trimStart = pct * videoDuration; if (trimStart >= trimEnd) trimStart = trimEnd - 0.1; }
    else { trimEnd = pct * videoDuration; if (trimEnd <= trimStart) trimEnd = trimStart + 0.1; }
    updateTimeline();
  });
  document.addEventListener('mouseup', () => { dragging = null; });

  // Video time update
  const vp = document.getElementById('videoPlayer');
  vp.addEventListener('timeupdate', () => {
    if (!dragging) {
      const pct = vp.currentTime / videoDuration;
      document.getElementById('timelineCursor').style.left = (pct * 100) + '%';
    }
  });
}

function loadFile(f) {
  videoBlob = f;
  const url = URL.createObjectURL(f);
  videoEl = document.getElementById('videoPlayer');
  videoEl.src = url;
  videoEl.onloadedmetadata = () => {
    videoDuration = videoEl.duration;
    trimStart = 0; trimEnd = videoDuration;
    document.getElementById('uploadCard').classList.add('hidden');
    ['videoCard','timelineCard','btnRow'].forEach(id => document.getElementById(id).classList.remove('hidden'));
    updateTimeline();
    document.getElementById('infoSize').textContent = (f.size / 1024 / 1024).toFixed(1) + 'MB';
  };
}

function updateTimeline() {
  const tl = document.getElementById('timeline');
  const bar = document.getElementById('timelineBar');
  const hs = document.getElementById('handleStart');
  const he = document.getElementById('handleEnd');
  const startPct = (trimStart / videoDuration) * 100;
  const endPct = (trimEnd / videoDuration) * 100;

  bar.style.left = startPct + '%';
  bar.style.width = (endPct - startPct) + '%';
  hs.style.left = startPct + '%';
  he.style.left = (endPct - 1.6) + '%';

  document.getElementById('startTime').value = formatTime(trimStart);
  document.getElementById('endTime').value = formatTime(trimEnd);
  document.getElementById('infoTotal').textContent = videoDuration.toFixed(1) + 's';
  document.getElementById('infoTrim').textContent = (trimEnd - trimStart).toFixed(1) + 's';
}

function formatTime(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = (s % 60).toFixed(2);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${sec.padStart(5,'0')}`;
}

function parseTime(str) {
  const [h, m, s] = str.split(':').map(Number);
  return h * 3600 + m * 60 + s;
}

function updateFromInput() {
  trimStart = parseTime(document.getElementById('startTime').value);
  trimEnd = parseTime(document.getElementById('endTime').value);
  if (trimStart >= trimEnd) { trimEnd = trimStart + 0.1; }
  if (trimEnd > videoDuration) trimEnd = videoDuration;
  updateTimeline();
}

function setStart() { trimStart = videoEl.currentTime; if (trimStart >= trimEnd) trimEnd = trimStart + 0.1; updateTimeline(); showToast(`开始: ${formatTime(trimStart)}`); }
function setEnd() { trimEnd = videoEl.currentTime; if (trimEnd <= trimStart) trimStart = trimEnd - 0.1; updateTimeline(); showToast(`结束: ${formatTime(trimEnd)}`); }

async function trimVideo() {
  if (!videoBlob) return;
  showToast('正在裁剪...');

  try {
    // Use MediaRecorder to capture the trimmed segment
    const canvas = document.createElement('canvas');
    canvas.width = videoEl.videoWidth;
    canvas.height = videoEl.videoHeight;
    const ctx = canvas.getContext('2d');

    const stream = canvas.captureStream(30);
    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
    const chunks = [];

    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const a = document.createElement('a');
      a.download = 'trimmed-video.webm';
      a.href = URL.createObjectURL(blob);
      a.click();
      showToast('裁剪完成！已下载 WebM 格式');
    };

    videoEl.currentTime = trimStart;
    videoEl.muted = true;
    await new Promise(r => { videoEl.onseeked = r; });

    recorder.start();
    videoEl.play();

    const drawFrame = () => {
      if (videoEl.currentTime >= trimEnd || videoEl.paused) {
        recorder.stop();
        videoEl.pause();
        return;
      }
      ctx.drawImage(videoEl, 0, 0);
      requestAnimationFrame(drawFrame);
    };
    drawFrame();
  } catch (err) {
    showToast('裁剪失败: ' + err.message);
  }
}

function resetAll() {
  videoEl = null; videoDuration = 0; trimStart = 0; trimEnd = 0; videoBlob = null;
  document.getElementById('uploadCard').classList.remove('hidden');
  ['videoCard','timelineCard','btnRow'].forEach(id => document.getElementById(id).classList.add('hidden'));
}

function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

init();
</script>
</body>
</html>
