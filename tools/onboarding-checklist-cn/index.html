<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>入职清单</title>
<meta name="description" content="入职清单工具 - 新员工入职流程管理，确保顺利融入团队">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a371f7;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
input,textarea,select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
textarea{resize:vertical;min-height:60px}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.progress-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:var(--green);border-radius:4px;transition:width .5s}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat-card{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.stat-num{font-size:2rem;font-weight:700}
.stat-label{font-size:.8rem;color:var(--text2);margin-top:4px}
.phase-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.phase-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;cursor:pointer}
.phase-title{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.phase-count{font-size:.8rem;color:var(--text2)}
.check-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .2s}
.check-item:hover{background:var(--border)}
.check-box{width:20px;height:20px;border:2px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.check-box.checked{background:var(--green);border-color:var(--green);color:#fff}
.check-text{font-size:.9rem;flex:1}
.check-text.done{text-decoration:line-through;color:var(--text2)}
.check-owner{font-size:.75rem;color:var(--text2);background:var(--bg);padding:2px 8px;border-radius:10px}
.new-hire-card{background:var(--bg);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.new-hire-info{display:flex;align-items:center;gap:10px}
.new-hire-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.progress-text{font-size:.8rem;color:var(--text2);margin-top:2px}
@media(max-width:600px){h1{font-size:1.4rem}.stats-grid{grid-template-columns:repeat(2,1fr)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📋 入职清单';
const APP=document.getElementById('app');
const DEFAULT_PHASES=[
  {name:'🏢 入职前准备',items:[
    {text:'发送offer和入职指南',done:false,owner:'HR'},
    {text:'准备工位和设备',done:false,owner:'IT'},
    {text:'创建公司账号和邮箱',done:false,owner:'IT'},
    {text:'分配入职导师',done:false,owner:'主管'},
    {text:'发送团队介绍邮件',done:false,owner:'HR'}
  ]},
  {name:'📅 第一天',items:[
    {text:'迎接新员工',done:false,owner:'HR'},
    {text:'公司文化介绍',done:false,owner:'HR'},
    {text:'团队成员介绍',done:false,owner:'主管'},
    {text:'办公环境导览',done:false,owner:'导师'},
    {text:'领取办公用品',done:false,owner:'IT'}
  ]},
  {name:'📚 第一周',items:[
    {text:'完成入职培训',done:false,owner:'HR'},
    {text:'了解团队项目',done:false,owner:'导师'},
    {text:'配置开发环境',done:false,owner:'导师'},
    {text:'阅读技术文档',done:false,owner:'新员工'},
    {text:'与关键同事1:1',done:false,owner:'主管'}
  ]},
  {name:'🚀 第一个月',items:[
    {text:'完成首个小任务',done:false,owner:'新员工'},
    {text:'参与团队会议',done:false,owner:'新员工'},
    {text:'了解工作流程',done:false,owner:'导师'},
    {text:'30天回顾面谈',done:false,owner:'主管'},
    {text:'设定试用期目标',done:false,owner:'主管'}
  ]},
  {name:'🎯 试用期',items:[
    {text:'定期1:1反馈',done:false,owner:'主管'},
    {text:'完成试用期项目',done:false,owner:'新员工'},
    {text:'试用期评估',done:false,owner:'HR'},
    {text:'转正决策',done:false,owner:'主管'}
  ]}
];
let data=JSON.parse(localStorage.getItem('oc_data')||'null')||{newHires:[{name:'新员工',startDate:new Date().toISOString().split('T')[0],phases:JSON.parse(JSON.stringify(DEFAULT_PHASES))}]};
let selectedHire=0;

function save(){localStorage.setItem('oc_data',JSON.stringify(data))}

function getPhaseProgress(phase){
  const total=phase.items.length;
  const done=phase.items.filter(i=>i.done).length;
  return total?Math.round(done/total*100):0;
}
function getTotalProgress(hire){
  const all=hire.phases.reduce((s,p)=>s+p.items.length,0);
  const done=hire.phases.reduce((s,p)=>s+p.items.filter(i=>i.done).length,0);
  return all?Math.round(done/all*100):0;
}

function render(){
  let h=`<h1>📋 入职清单</h1><p class="subtitle">新员工入职流程管理</p>`;
  const hire=data.newHires[selectedHire];
  const totalPct=getTotalProgress(hire);
  const totalItems=hire.phases.reduce((s,p)=>s+p.items.length,0);
  const doneItems=hire.phases.reduce((s,p)=>s+p.items.filter(i=>i.done).length,0);

  h+=`<div class="stats-grid">`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--accent)">${data.newHires.length}</div><div class="stat-label">新员工数</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--green)">${totalPct}%</div><div class="stat-label">完成进度</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--yellow)">${doneItems}/${totalItems}</div><div class="stat-label">完成项目</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--purple)">${hire.phases.length}</div><div class="stat-label">入职阶段</div></div>`;
  h+=`</div>`;

  h+=`<div class="card"><div class="flex-between"><b>👥 新员工列表</b><button class="btn btn-sm" onclick="addHire()">+ 添加</button></div>`;
  data.newHires.forEach((nh,i)=>{
    const pct=getTotalProgress(nh);
    h+=`<div class="new-hire-card" style="${i===selectedHire?'border:2px solid var(--accent)':''}" onclick="selectHire(${i})"><div class="new-hire-info"><div class="new-hire-avatar">${nh.name[0]}</div><div><div style="font-weight:600">${nh.name}</div><div class="progress-text">${nh.startDate} · ${pct}% 完成</div></div></div></div>`;
  });
  h+=`<div class="progress-bar"><div class="progress-fill" style="width:${totalPct}%"></div></div></div>`;

  hire.phases.forEach((phase,pi)=>{
    const pct=getPhaseProgress(phase);
    const done=phase.items.filter(i=>i.done).length;
    h+=`<div class="phase-card"><div class="phase-header"><div class="phase-title">${phase.name}<span class="phase-count">${done}/${phase.items.length} · ${pct}%</span></div>`;
    h+=`<button class="btn btn-sm btn-outline" onclick="addItem(${pi})">+ 添加</button></div>`;
    phase.items.forEach((item,ii)=>{
      h+=`<div class="check-item" onclick="toggleItem(${pi},${ii})"><div class="check-box ${item.done?'checked':''}">${item.done?'✓':''}</div><span class="check-text ${item.done?'done':''}">${item.text}</span>`;
      if(item.owner) h+=`<span class="check-owner">${item.owner}</span>`;
      h+=`<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();delItem(${pi},${ii})">✕</button></div>`;
    });
    h+=`</div>`;
  });

  h+=`<div class="card"><div class="flex-between"><b>⚙️ 管理</b><div class="flex"><button class="btn btn-sm btn-outline" onclick="addPhase()">+ 添加阶段</button><button class="btn btn-sm btn-outline" onclick="resetPhases()">重置为默认</button><button class="btn btn-sm btn-danger" onclick="delHire()">删除员工</button></div></div></div>`;
  APP.innerHTML=h;
}

function selectHire(i){selectedHire=i;render()}
function addHire(){
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">添加新员工</h3>
    <label>姓名</label><input id="hn" placeholder="员工姓名">
    <label>入职日期</label><input id="hd" type="date" value="${new Date().toISOString().split('T')[0]}">
    <div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    <button class="btn btn-success" onclick="saveHire()">确定</button></div></div>`;
  document.body.appendChild(m);
}
function saveHire(){
  const n=document.getElementById('hn').value.trim();if(!n)return;
  data.newHires.push({name:n,startDate:document.getElementById('hd').value,phases:JSON.parse(JSON.stringify(DEFAULT_PHASES))});
  save();document.querySelector('.modal-overlay').remove();render();
}
function delHire(){if(data.newHires.length<=1){alert('至少保留一个员工');return}if(confirm('删除此员工？')){data.newHires.splice(selectedHire,1);selectedHire=0;save();render()}}
function toggleItem(pi,ii){data.newHires[selectedHire].phases[pi].items[ii].done=!data.newHires[selectedHire].phases[pi].items[ii].done;save();render()}
function addItem(pi){
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">添加事项</h3>
    <label>内容</label><input id="it" placeholder="事项内容">
    <label>负责人</label><input id="io" placeholder="负责人（可选）">
    <div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    <button class="btn btn-success" onclick="saveItem(${pi})">确定</button></div></div>`;
  document.body.appendChild(m);
}
function saveItem(pi){
  const t=document.getElementById('it').value.trim();if(!t)return;
  data.newHires[selectedHire].phases[pi].items.push({text:t,done:false,owner:document.getElementById('io').value.trim()});
  save();document.querySelector('.modal-overlay').remove();render();
}
function delItem(pi,ii){if(confirm('删除？')){data.newHires[selectedHire].phases[pi].items.splice(ii,1);save();render()}}
function addPhase(){const n=prompt('阶段名称：');if(n){data.newHires[selectedHire].phases.push({name:n,items:[]});save();render()}}
function resetPhases(){if(confirm('重置为默认阶段？')){data.newHires[selectedHire].phases=JSON.parse(JSON.stringify(DEFAULT_PHASES));save();render()}}
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
