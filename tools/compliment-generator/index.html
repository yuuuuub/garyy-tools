// ======================== 辅助函数 ========================
function randomItem(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 生成不重复的彩虹屁
let usedCombos = [];
function generateCompliment() {
  const bank = wordBank[currentMode];
  const name = nameInput.value.trim();
  const prefix = name ? `${name}，` : '';

  // 尝试生成不重复的组合
  let tries = 0;
  let adjective, metaphor, exclamation, comboKey;
  do {
    adjective = randomItem(bank.adjectives);
    metaphor = randomItem(bank.metaphors);
    exclamation = randomItem(bank.exclamations);
    comboKey = `${adjective}|${metaphor}|${exclamation}`;
    tries++;
    if (tries > 50) break; // 防止无限循环
  } while (usedCombos.includes(comboKey) && usedCombos.length < bank.adjectives.length * bank.metaphors.length * bank.exclamations.length);

  // 如果所有组合都用过了，重置
  if (usedCombos.length >= bank.adjectives.length * bank.metaphors.length * bank.exclamations.length) {
    usedCombos = [];
  }
  usedCombos.push(comboKey);

  return `${prefix}你简直<strong>${adjective}</strong>，${metaphor}！<br>${exclamation}`;
}

  btnCopy.disabled = false;
  btnCopy.classList.remove('copied');
  btnCopy.textContent = '📋 复制';
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
}

function copyToClipboard() {
  if (!currentResult) return;
  navigator.clipboard.writeText(currentResult).then(() => {
    btnCopy.classList.add('copied');
    btnCopy.textContent = '✅ 已复制';
    showToast('彩虹屁已复制到剪贴板！');
    setTimeout(() => {
      btnCopy.classList.remove('copied');
      btnCopy.textContent = '📋 复制';
    }, 2000);
  }).catch(() => {
    showToast('复制失败，请手动复制');
  });
}

// ======================== 事件监听 ========================
modeContainer.addEventListener('click', (e) => {
  const btn = e.target.closest('.mode-btn');
  if (!btn) return;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = btn.dataset.mode;
  usedCombos = []; // 切换模式时重置
});

btnGenerate.addEventListener('click', () => {
  const result = generateCompliment();
  showResult(result);
});

btnCopy.addEventListener('click', copyToClipboard);

// 回车键也能生成
nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    btnGenerate.click();
  }
});

// ======================== 初始化：自动生成一条 ========================
(function init() {
  const result = generateCompliment();
  showResult(result);
})();
</script>

<script src="../i18n.js" defer>
// Auto-generate on load for non-blank experience
generateCompliment();
</script>
</body>
</html>
