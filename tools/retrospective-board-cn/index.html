<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目回顾板</title>
<meta property="og:title" content="项目回顾板">
<meta property="og:description" content="项目回顾板 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="敏捷回顾工具，收集做得好/待改进/行动项，驱动持续改进">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:1100px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:4px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.9rem;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
input,textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.column{border-radius:var(--radius);padding:16px;border:2px solid}
.col-good{background:rgba(63,185,80,.05);border-color:rgba(63,185,80,.3)}
.col-improve{background:rgba(210,153,34,.05);border-color:rgba(210,153,34,.3)}
.col-action{background:rgba(59,130,246,.05);border-color:rgba(59,130,246,.3)}
.col-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.col-title{font-weight:700;font-size:1.1rem}
.col-count{font-size:.8rem;color:var(--text2);background:var(--bg);padding:2px 8px;border-radius:10px}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;transition:all .2s}
.item-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.item-text{font-size:.9rem;line-height:1.5;margin-bottom:6px}
.item-meta{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--text2)}
.item-delete{cursor:pointer;color:var(--text2);transition:color .2s}
.item-delete:hover{color:var(--red)}
.add-form{display:flex;gap:8px;margin-top:8px}
.add-form input{margin:0;flex:1;padding:8px 12px;font-size:.85rem}
.add-form button{padding:8px 16px;margin:0}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:12px}
.stat-num{font-size:1.8rem;font-weight:700}
.stat-label{font-size:.8rem;color:var(--text2)}
.vote-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:.7rem;background:var(--bg);cursor:pointer;transition:all .2s}
.vote-badge:hover{background:var(--accent);color:#fff}
.history-item{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.history-date{font-weight:600}
.history-summary{font-size:.85rem;color:var(--text2)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.85rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.item-card{animation:fadeIn .3s ease-out}
@media(max-width:600px){body{padding:10px}h1{font-size:1.4rem}.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🔄 项目回顾</h1>
<p class="subtitle">做得好 · 待改进 · 行动项</p>

<div class="stats-grid" id="statsGrid"></div>

<div class="card">
  <div class="flex-between">
    <b>回顾设置</b>
    <div class="flex">
      <button class="btn btn-sm" onclick="saveSession()">💾 保存回顾</button>
      <button class="btn btn-sm btn-danger" onclick="resetCurrent()">重置当前</button>
    </div>
  </div>
  <div style="margin-top:12px">
    <label>回顾主题</label>
    <input type="text" id="topicInput" placeholder="例：Sprint 12 回顾" oninput="saveData()" style="max-width:400px">
  </div>
</div>

<div class="board" id="board">
  <div class="column col-good">
    <div class="col-header">
      <span class="col-title" style="color:var(--green)">😊 做得好</span>
      <span class="col-count" id="goodCount">0</span>
    </div>
    <div id="goodList"></div>
    <div class="add-form"><input type="text" id="goodInput" placeholder="添加做得好的事" onkeydown="if(event.key==='Enter')addItem('good')"><button class="btn btn-sm btn-success" onclick="addItem('good')">+</button></div>
  </div>
  <div class="column col-improve">
    <div class="col-header">
      <span class="col-title" style="color:var(--yellow)">🤔 待改进</span>
      <span class="col-count" id="improveCount">0</span>
    </div>
    <div id="improveList"></div>
    <div class="add-form"><input type="text" id="improveInput" placeholder="添加待改进的事" onkeydown="if(event.key==='Enter')addItem('improve')"><button class="btn btn-sm" style="background:var(--yellow);color:#000" onclick="addItem('improve')">+</button></div>
  </div>
  <div class="column col-action">
    <div class="col-header">
      <span class="col-title" style="color:var(--accent)">🎯 行动项</span>
      <span class="col-count" id="actionCount">0</span>
    </div>
    <div id="actionList"></div>
    <div class="add-form"><input type="text" id="actionInput" placeholder="添加行动计划" onkeydown="if(event.key==='Enter')addItem('action')"><button class="btn btn-sm" onclick="addItem('action')">+</button></div>
  </div>
</div>

<div class="card">
  <b style="display:block;margin-bottom:8px">历史回顾</b>
  <div id="historyList"></div>
</div>
</div>

<script>
document.title='🔄 项目回顾板';
let data=JSON.parse(localStorage.getItem('retro_cn')||'null')||{
  topic:'Sprint 回顾',
  good:[{id:1,text:'团队协作默契，沟通高效',votes:5},{id:2,text:'按时完成所有Sprint目标',votes:3}],
  improve:[{id:3,text:'代码评审流程需优化',votes:4},{id:4,text:'技术债务需要偿还',votes:2}],
  action:[{id:5,text:'引入自动化代码评审工具',votes:6},{id:6,text:'每周安排2小时处理技术债务',votes:3}],
  history:[]
};
let nextId=100;

function save(){localStorage.setItem('retro_cn',JSON.stringify(data))}
function saveData(){data.topic=document.getElementById('topicInput').value;save()}

function addItem(type){
  const input=document.getElementById(type+'Input');
  const text=input.value.trim();if(!text)return;
  data[type].push({id:nextId++,text,votes:0});
  input.value='';save();render();
}
function deleteItem(type,id){data[type]=data[type].filter(i=>i.id!==id);save();render()}
function voteItem(type,id){const item=data[type].find(i=>i.id===id);if(item){item.votes++;save();render()}}
function resetCurrent(){if(!confirm('确定重置？'))return;data.good=[];data.improve=[];data.action=[];save();render()}

function saveSession(){
  const session={date:new Date().toISOString(),topic:data.topic,goodCount:data.good.length,improveCount:data.improve.length,actionCount:data.action.length};
  data.history.unshift(session);if(data.history.length>20)data.history.pop();save();render();
}

function render(){
  document.getElementById('topicInput').value=data.topic||'';
  
  const totalItems=data.good.length+data.improve.length+data.action.length;
  const totalVotes=[...data.good,...data.improve,...data.action].reduce((s,i)=>s+i.votes,0);
  document.getElementById('statsGrid').innerHTML=`
    <div class="card stat"><div class="stat-num" style="color:var(--green)">${data.good.length}</div><div class="stat-label">做得好</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--yellow)">${data.improve.length}</div><div class="stat-label">待改进</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--accent)">${data.action.length}</div><div class="stat-label">行动项</div></div>`;
  
  const renderList=(items,type,listId)=>{
    document.getElementById(type+'Count').textContent=items.length;
    let h='';
    if(items.length===0)h='<div class="empty">暂无内容</div>';
    items.sort((a,b)=>b.votes-a.votes).forEach(item=>{
      h+=`<div class="item-card"><div class="item-text">${item.text}</div>
        <div class="item-meta"><span class="vote-badge" onclick="voteItem('${type}',${item.id})">👍 ${item.votes}</span>
        <span class="item-delete" onclick="deleteItem('${type}',${item.id})">✕</span></div></div>`;
    });
    document.getElementById(listId).innerHTML=h;
  };
  
  renderList(data.good,'good','goodList');
  renderList(data.improve,'improve','improveList');
  renderList(data.action,'action','actionList');
  
  let hHtml='';
  if(data.history.length===0)hHtml='<div class="empty">暂无历史记录</div>';
  data.history.forEach(h=>{
    const d=new Date(h.date).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
    hHtml+=`<div class="history-item"><div><div class="history-date">${d}</div><div class="history-summary">${h.topic} · 好:${h.goodCount} 改:${h.improveCount} 行:${h.actionCount}</div></div></div>`;
  });
  document.getElementById('historyList').innerHTML=hHtml;
}

render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
