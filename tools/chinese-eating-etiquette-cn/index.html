<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国餐桌礼仪 - Chinese Table Manners</title>
<meta name="description" content="中国餐桌礼仪大全，座次安排、筷子礼仪、上菜顺序、敬酒规则、宴席规矩">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国餐桌礼仪 - Chinese Table Manners">
<meta property="og:description" content="中国餐桌礼仪大全，座次安排、筷子礼仪、上菜顺序、敬酒规则、宴席规矩">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-eating-etiquette-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪑</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e67e22;--accent2:#d35400}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#bc4c00;--accent2:#9a3412}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a1005 0%,#2a1a0a 50%,#3a2510 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3a18;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e67e22,#d35400,#f39c12,#e67e22);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.tea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.tea-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.tea-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.tea-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.tea-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tea-card .t-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(230,126,34,0.15);color:var(--accent)}
.tea-card .t-name{font-size:1.3em;font-weight:bold}
.tea-card .t-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.tea-card .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tea-card .t-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.tea-card .t-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.tea-card .t-detail strong{color:var(--text)}
.tea-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.tea-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🪑 中国餐桌礼仪</h1>
<p>Chinese Table Manners — 食不言寝不语，礼在杯盏间</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索餐桌礼仪...（如"座次""筷子""敬酒"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="座次礼仪">💺 座次礼仪</button>
<button class="filter-btn" data-filter="用筷礼仪">🥢 用筷礼仪</button>
<button class="filter-btn" data-filter="敬酒礼仪">🍷 敬酒礼仪</button>
<button class="filter-btn" data-filter="上菜规矩">🍽️ 上菜规矩</button>
<button class="filter-btn" data-filter="用餐举止">🧍 用餐举止</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="tea-grid" id="teaGrid"></div>
<footer><p>🪑 中国餐桌礼仪 — 食不言寝不语，礼在杯盏间</p></footer>
</div>
<script>
const TEA_DATA=[
  {id:1,name:"面门为尊",en:"Face the Door = Honor Seat",category:"座次礼仪",icon:"💺",summary:"主人与客人的座位",detail:"中国宴席以圆桌为主，面对门口的座位最尊贵，留给最重要的客人。主人坐在门口一侧，方便招呼和服务。左为上，右为下，按辈分和职位依次入座。",origin:"周礼传统",usage:"正式宴席和商务宴请的座次安排"},
  {id:2,name:"主陪与副陪",en:"Main and Vice Host",category:"座次礼仪",icon:"👥",summary:"主人方的座位安排",detail:"主陪面对门口坐正中，副陪坐在主陪对面（门口位置）。主陪负责主要的敬酒和话题引导，副陪负责协助照顾客人、活跃气氛。主宾坐在主陪右侧。",origin:"现代宴请传统",usage:"商务宴请和正式聚会的标准座位"},
  {id:3,name:"先请后坐",en:"Elders Sit First",category:"座次礼仪",icon:"🧓",summary:"入座的礼节",detail:"进入餐厅后，主人应引导客人就座。晚辈或下属应等待长辈或上级先坐。入座时从椅子左侧进入，坐下后不要随意移动椅子。女主人或女士优先入座。",origin:"传统礼仪",usage:"家庭聚餐和正式宴席的入座规矩"},
  {id:4,name:"筷子不插饭",en:"Don't Stick Chopsticks in Rice",category:"用筷礼仪",icon:"🥢",summary:"最严重的筷子禁忌",detail:"绝对不能把筷子竖直插在饭碗里，因为这像祭祀死者时的香烛，是大忌。如果筷子掉了，要说'快乐'（筷落=快乐），不能说'掉了'。",origin:"祭祀文化",usage:"用餐中最需要避免的筷子禁忌"},
  {id:5,name:"不敲碗不舔筷",en:"Don't Tap or Lick Chopsticks",category:"用筷礼仪",icon:"🍽️",summary:"用筷的基本规矩",detail:"不能用筷子敲碗（乞丐行为），不能舔筷子（不雅），不能用筷子指人（不敬），不能在菜盘里翻来翻去挑菜（自私），不能用筷子当叉子扎食物。",origin:"民间传统",usage:"日常用餐的基本筷子礼仪"},
  {id:6,name:"筷子摆放规矩",en:"Proper Chopstick Placement",category:"用筷礼仪",icon:"📏",summary:"筷子的放置方式",detail:"用餐中途筷子要平行放在筷架上，不能交叉放（表示否定），不能放在碗上（不吉利），不能一头在碗里一头在外面。用餐结束将筷子整齐放在碗右侧。",origin:"传统规矩",usage:"正式用餐时的筷子摆放规范"},
  {id:7,name:"先干为敬",en:"Drain Glass as Respect",category:"敬酒礼仪",icon:"🥂",summary:"敬酒的基本方式",detail:"敬酒时自己先干为敬，然后看对方喝。碰杯时自己的杯沿要低于对方（表示尊敬）。晚辈敬长辈、下级敬上级必须站起来，双手举杯。",origin:"传统酒礼",usage:"商务和社交场合的敬酒标准"},
  {id:8,name:"酒不过三杯",en:"No More Than Three Rounds",category:"敬酒礼仪",icon:"🍷",summary:"敬酒的次数控制",detail:"一般敬酒不超过三轮，每轮三杯。第一杯敬大家，第二杯单独敬，第三杯收尾。不能强迫不能喝酒的人饮酒，可以用茶代替。饮酒要适量，保持清醒。",origin:"现代酒桌文化",usage:"商务宴请的敬酒节奏控制"},
  {id:9,name:"斟酒不满杯",en:"Don't Fill Wine to the Brim",category:"敬酒礼仪",icon:"🍷",summary:"倒酒的讲究",detail:"白酒可以倒满（酒满敬人），红酒倒三分之一，啤酒倒八分满（留泡沫）。给别人倒酒时要双手持瓶，瓶口不能对着客人。倒完酒瓶要转一下瓶口朝内。",origin:"传统倒酒礼仪",usage:"宴席中倒酒的标准操作"},
  {id:10,name:"上菜先冷后热",en:"Cold Dishes First, Then Hot",category:"上菜规矩",icon:"🥗",summary:"上菜的顺序",detail:"中餐上菜顺序：凉菜→热菜→汤→主食→水果。凉菜在客人到齐前上好，热菜按顺序逐道上。第一道热菜通常是最拿手的主菜。鱼通常在最后或倒数第二道上。",origin:"传统宴席规矩",usage:"正式中餐宴席的上菜标准"},
  {id:11,name:"鱼不翻身",en:"Don't Flip the Fish",category:"上菜规矩",icon:"🐟",summary:"鱼的上菜规矩",detail:"鱼头朝向主宾或长辈。吃鱼时不能翻面（渔民忌讳'翻船'），要将鱼骨剔出。鱼不能吃完（年年有余）。上鱼时要说吉利话如'年年有余'。",origin:"渔民文化与谐音传统",usage:"宴席中鱼菜的特殊规矩"},
  {id:12,name:"公筷公勺",en:"Serving Chopsticks and Spoons",category:"用餐举止",icon:"🥄",summary:"卫生用餐",detail:"正式宴席应使用公筷公勺夹菜，不用自己的筷子直接从公共盘中取菜。夹菜时从盘边取，不翻拣。嘴里有食物时不说话。喝汤不出声。",origin:"现代卫生观念",usage:"正式用餐和个人卫生的基本要求"},
  {id:13,name:"不吧唧嘴",en:"Don't Smack Lips",category:"用餐举止",icon:"👄",summary:"吃相的讲究",detail:"吃饭时不能吧唧嘴发出声音（不雅），不能端起盘子扒饭（不礼貌），不能在盘中挑来挑去（自私）。吃面条不出声（西方礼仪不同，中国传统可以适当出声表示好吃）。",origin:"传统教养",usage:"体现个人教养的用餐举止"},
  {id:14,name:"不剩饭不贪杯",en:"Don't Waste Food or Overdrink",category:"用餐举止",icon:"🍚",summary:"适度饮食",detail:"传统讲究'食不过饱'，不暴饮暴食。夹菜要适量，不能一次夹太多。碗里的饭要吃干净，体现珍惜粮食的美德。喝酒要适度，不能喝醉失态。",origin:"传统美德",usage:"用餐时的基本教养和品德体现"},
  {id:15,name:"等菜齐再动筷",en:"Wait Until All Dishes Arrive",category:"用餐举止",icon:"⏰",summary:"动筷的时机",detail:"主人宣布开菜前不能先动筷。等主人或长辈先夹第一口菜后，其他人才能开始吃。如果是随意的家宴，主人招呼后即可开始。",origin:"传统规矩",usage:"正式宴席的开餐时机把握"},
  {id:16,name:"转盘礼仪",en:"Lazy Susan Etiquette",category:"用餐举止",icon:"🔄",summary:"使用转盘的规矩",detail:"使用转盘时顺时针缓慢转动，别人正在取菜时不要转动。转盘上靠近自己的菜不要夹太多，要留一些给别人。最后一道菜通常留给长辈。",origin:"现代宴席传统",usage:"中式圆桌宴席的用餐规范"},
  {id:17,name:"端碗吃饭",en:"Hold Bowl while Eating",category:"用餐举止",icon:"🍚",summary:"碗的使用",detail:"吃饭时应该端起碗（不是捧着碗到处走），低头就碗吃。不端碗趴在桌上吃（不雅），也不把碗放在桌上低头去够（不礼貌）。碗底不要剩饭粒。",origin:"传统食礼",usage:"家庭和正式用餐的基本规矩"},
  {id:18,name:"送客礼节",en:"Seeing Off Guests",category:"座次礼仪",icon:"👋",summary:"宴席结束的礼节",detail:"宴席结束时主人要送客人到门口或车上。客人要表示感谢和客气。主人不能在客人离开前收拾桌子。如果是正式宴请，主人应提前买单，不在客人面前结账。",origin:"传统待客之道",usage:"宴请结束后的送客礼节"},
  {id:19,name:"餐巾使用",en:"Napkin Usage",category:"用餐举止",icon:"🧻",summary:"中餐餐巾规矩",detail:"中餐用餐巾轻轻擦拭嘴角，不要大力擤鼻子。用餐巾盖住嘴巴咳嗽或吐骨。餐巾放在大腿上，不要塞在领口（那是西餐婴儿的做法）。中途离席放在椅面上。",origin:"现代中餐礼仪",usage:"正式用餐时餐巾的正确使用"},
  {id:20,name:"筷子掉了说快乐",en:"Say 'Happy' When Chopsticks Fall",category:"用筷礼仪",icon:"😊",summary:"筷子掉落的忌讳",detail:"筷子掉在地上是不吉利的，要说'筷落'谐音'快乐'来化解。不能说'掉了'或'落了'。捡起筷子后最好换一双新的。这是中国餐桌上的语言禁忌艺术。",origin:"谐音文化传统",usage:"用餐时应对小意外的智慧"}
];
function renderCards(data){
  document.getElementById('teaGrid').innerHTML=data.map(t=>`
    <div class="tea-card" data-category="${t.category}">
      <div class="t-header"><div class="t-icon">${t.icon}</div><div><div class="t-name">${t.name}</div><div class="t-sub">${t.en}</div></div></div>
      <div class="t-meta"><span>${t.summary}</span><span>${t.category}</span></div>
      <div class="t-detail">${t.detail}</div>
      <div class="t-detail"><strong>来源：</strong>${t.origin}</div>
      <div class="t-detail"><strong>应用：</strong>${t.usage}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(t=>{cats[t.category]=(cats[t.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">餐桌礼仪</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(TEA_DATA);renderStats(TEA_DATA);
</script>
</body>
</html>
