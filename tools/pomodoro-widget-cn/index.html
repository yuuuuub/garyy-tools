<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>番茄钟组件 - garyy-tools</title>
<meta name="description" content="番茄钟工作法组件，支持专注计时、休息提醒和统计">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;scroll-behavior:smooth}.container{max-width:500px;margin:auto;padding-bottom:50px}header{text-align:center;padding:28px 0 16px}h1{font-size:1.3rem;margin-bottom:4px}.sub{color:var(--text2);font-size:.85rem}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;text-align:center}button{padding:9px 20px;border-radius:6px;border:none;background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;transition:opacity .2s}button:hover{opacity:.85}.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-gold{background:var(--gold)}.timer-display{font-size:4.5rem;font-weight:700;font-variant-numeric:tabular-nums;margin:20px 0;letter-spacing:2px}.mode-tabs{display:flex;gap:4px;background:var(--bg);border-radius:6px;padding:4px;margin-bottom:16px}.mode-tab{flex:1;text-align:center;padding:7px 0;border-radius:4px;cursor:pointer;font-size:.85rem;color:var(--text2);transition:all .2s}.mode-tab.active{background:var(--blue);color:var(--text)}.progress-bar{width:100%;height:8px;background:var(--bg);border-radius:4px;margin:12px 0;overflow:hidden}.progress-fill{height:100%;background:var(--blue);border-radius:4px;transition:width .5s linear}.btn-row{display:flex;gap:8px;justify-content:center;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat-item{text-align:center;padding:12px;background:var(--bg);border-radius:8px}.stat-item .num{font-size:1.5rem;font-weight:700}.stat-item .label{font-size:.75rem;color:var(--text2);margin-top:4px}.settings{margin-top:12px}.settings .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}.settings .row:last-child{border:none}.settings input[type=number]{width:60px;text-align:center;padding:4px;font-size:.85rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="番茄钟组件 - garyy-tools">
<meta property="og:description" content="番茄钟工作法组件，支持专注计时、休息提醒和统计">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>🍅 番茄钟组件</h1>
<div class="sub">专注工作法 · 计时提醒 · 统计</div>
</header>
<div class="card">
<div class="mode-tabs">
<div class="mode-tab active" data-mode="focus">专注</div>
<div class="mode-tab" data-mode="short">短休</div>
<div class="mode-tab" data-mode="long">长休</div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="timer-display" id="display">25:00</div>
<div class="btn-row">
<button class="btn-green" id="btnStart">▶ 开始</button>
<button id="btnPause" style="display:none">⏸ 暂停</button>
<button class="btn-red" id="btnReset">↺ 重置</button>
</div>
</div>
<div class="card">
<div style="font-weight:600;margin-bottom:8px">今日统计</div>
<div class="stats">
<div class="stat-item"><div class="num" id="statFocus">0</div><div class="label">专注次数</div></div>
<div class="stat-item"><div class="num" id="statMin">0</div><div class="label">专注分钟</div></div>
<div class="stat-item"><div class="num" id="statTotal">0</div><div class="label">总番茄数</div></div>
</div>
</div>
<div class="card">
<div style="font-weight:600;margin-bottom:8px">设置</div>
<div class="settings">
<div class="row"><span>专注时长（分钟）</span><input type="number" id="setFocus" value="25" min="1" max="120"></div>
<div class="row"><span>短休时长（分钟）</span><input type="number" id="setShort" value="5" min="1" max="30"></div>
<div class="row"><span>长休时长（分钟）</span><input type="number" id="setLong" value="15" min="1" max="60"></div>
</div>
</div>
</div>
<script>
(function(){
'use strict';
let mode='focus',running=false,interval=null;
let focusMin=25,shortMin=5,longMin=15;
let remain=25*60,totalTime=25*60;
let stats=JSON.parse(localStorage.getItem('pomodoro-stats')||'{"focus":0,"min":0,"total":0}');
const display=document.getElementById('display');
const progressFill=document.getElementById('progressFill');
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function render(){display.textContent=fmt(remain);progressFill.style.width=((totalTime-remain)/totalTime*100)+'%';}
function updateStats(){
document.getElementById('statFocus').textContent=stats.focus;
document.getElementById('statMin').textContent=stats.min;
document.getElementById('statTotal').textContent=stats.total;
localStorage.setItem('pomodoro-stats',JSON.stringify(stats));
}
function switchMode(m){
running=false;clearInterval(interval);
mode=m;
document.getElementById('btnStart').style.display='inline-block';
document.getElementById('btnPause').style.display='none';
if(m==='focus'){totalTime=focusMin*60;}
else if(m==='short'){totalTime=shortMin*60;}
else{totalTime=longMin*60;}
remain=totalTime;render();
}
document.querySelectorAll('.mode-tab').forEach(tab=>{
tab.onclick=()=>{document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');switchMode(tab.dataset.mode);};
});
document.getElementById('btnStart').onclick=()=>{
if(running)return;running=true;
document.getElementById('btnStart').style.display='none';
document.getElementById('btnPause').style.display='inline-block';
interval=setInterval(()=>{
remain--;render();
if(remain<=0){
clearInterval(interval);running=false;
if(mode==='focus'){stats.focus++;stats.min+=focusMin;stats.total++;updateStats();alert('专注完成！休息一下吧 🎉');switchMode('short');}
else{alert('休息结束，开始专注！💪');switchMode('focus');}
document.getElementById('btnStart').style.display='inline-block';
document.getElementById('btnPause').style.display='none';
}
},1000);
};
document.getElementById('btnPause').onclick=()=>{
clearInterval(interval);running=false;
document.getElementById('btnStart').style.display='inline-block';
document.getElementById('btnPause').style.display='none';
};
document.getElementById('btnReset').onclick=()=>{
clearInterval(interval);running=false;
switchMode(mode);
};
document.getElementById('setFocus').onchange=function(){focusMin=Math.max(1,Math.min(120,+this.value||25));if(mode==='focus')switchMode('focus');};
document.getElementById('setShort').onchange=function(){shortMin=Math.max(1,Math.min(30,+this.value||5));if(mode==='short')switchMode('short');};
document.getElementById('setLong').onchange=function(){longMin=Math.max(1,Math.min(60,+this.value||15));if(mode==='long')switchMode('long');};
render();updateStats();
})();
</script>
</body>
</html>
