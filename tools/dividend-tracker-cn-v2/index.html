<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股息追踪器 V2</title>
<meta name="description" content="股息收入追踪与分析，记录分红、计算年化收益、生成报告">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#f59e0b;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
.container{max-width:800px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-val{font-size:1.4rem;font-weight:700}
.stat-label{font-size:.78rem;color:var(--text2);margin-top:4px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:.82rem;color:var(--text2);margin-bottom:3px;display:block}
input,select{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.88rem}
input:focus{outline:none;border-color:var(--blue)}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius);cursor:pointer;font-size:.88rem;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-sm{background:var(--card);border:1px solid var(--border);color:var(--text);padding:3px 8px;font-size:.75rem}
.btn-sm:hover{border-color:var(--red);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--border)}
th{color:var(--text2);font-weight:500;background:var(--bg)}
td:first-child,th:first-child{text-align:left}
.up{color:var(--green)}.down{color:var(--red)}
.chart-area{position:relative;height:200px;margin-top:10px}
.chart-area canvas{width:100%;height:100%}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="股息追踪器 V2">
<meta property="og:description" content="股息收入追踪与分析工具">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>💰 股息追踪器 V2</h1>
    <p>记录分红收入，分析投资回报</p>
  </header>
  <div class="stats-grid" id="statsArea"></div>
  <div class="card">
    <b>添加分红记录</b>
    <div class="form-grid" style="margin-top:10px">
      <div><label>股票代码</label><input type="text" id="fCode" placeholder="600519"></div>
      <div><label>股票名称</label><input type="text" id="fName" placeholder="贵州茅台"></div>
      <div><label>持仓成本 (元)</label><input type="number" id="fCost" value="150000" step="0.01"></div>
      <div><label>每股分红 (元)</label><input type="number" id="fDivPerShare" value="30.88" step="0.01"></div>
      <div><label>持股数量</label><input type="number" id="fShares" value="100" step="1"></div>
      <div><label>分红日期</label><input type="date" id="fDate"></div>
      <div><label>频率</label><select id="fFreq"><option value="annual">年度</option><option value="semi">半年度</option><option value="quarterly">季度</option></select></div>
      <div><label>税率 (%)</label><input type="number" id="fTax" value="10" step="0.1"></div>
    </div>
    <button class="btn" id="addBtn" style="margin-top:10px">添加记录</button>
  </div>
  <div class="card">
    <b>分红记录</b>
    <div id="tableArea"></div>
  </div>
  <div class="card">
    <b>月度收入趋势</b>
    <div class="chart-area"><canvas id="barChart"></canvas></div>
  </div>
  <div class="card">
    <b>按股票汇总</b>
    <div id="summaryArea"></div>
  </div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const freqMul={annual:1,semi:2,quarterly:4};
let records=[
  {code:'600519',name:'贵州茅台',cost:150000,divPerShare:30.88,shares:100,date:'2024-07-12',freq:'annual',tax:10},
  {code:'000333',name:'美的集团',cost:62800,divPerShare:3.0,shares:1000,date:'2024-06-28',freq:'annual',tax:10},
  {code:'600036',name:'招商银行',cost:35600,divPerShare:1.738,shares:1000,date:'2024-07-05',freq:'annual',tax:10},
  {code:'000001',name:'平安银行',cost:11850,divPerShare:0.246,shares:500,date:'2024-07-15',freq:'annual',tax:10}
];
$('fDate').value=new Date().toISOString().slice(0,10);
function calc(){
  const totalDiv=records.reduce((s,r)=>{const net=r.divPerShare*r.shares*(1-r.tax/100);return s+net;},0);
  const totalCost=records.reduce((s,r)=>s+r.cost,0);
  const annualDiv=records.reduce((s,r)=>s+r.divPerShare*r.shares*freqMul[r.freq]*(1-r.tax/100),0);
  const yieldPct=totalCost>0?(annualDiv/totalCost*100).toFixed(2):'0.00';
  const monthlyDiv=annualDiv/12;
  let statsH='';
  const stats=[
    ['总分红(税后)','¥'+totalDiv.toFixed(2),'var(--green)'],
    ['年化分红','¥'+annualDiv.toFixed(2),'var(--blue)'],
    ['持仓成本','¥'+totalCost.toLocaleString(),'var(--text)'],
    ['股息率',yieldPct+'%','var(--gold)'],
    ['月均分红','¥'+monthlyDiv.toFixed(2),'var(--purple)'],
    ['记录数',records.length+'条','var(--text2)']
  ];
  stats.forEach(([l,v,c])=>{statsH+=`<div class="stat-card"><div class="stat-val" style="color:${c}">${v}</div><div class="stat-label">${l}</div></div>`;});
  $('statsArea').innerHTML=statsH;
  // Table
  let th='<table><thead><tr><th>代码</th><th>名称</th><th>每股分红</th><th>持股</th><th>税后收入</th><th>日期</th><th>操作</th></tr></thead><tbody>';
  records.forEach((r,i)=>{
    const net=r.divPerShare*r.shares*(1-r.tax/100);
    th+=`<tr><td>${r.code}</td><td>${r.name}</td><td>¥${r.divPerShare}</td><td>${r.shares}</td><td class="up">¥${net.toFixed(2)}</td><td>${r.date}</td><td><button class="btn-sm" onclick="records.splice(${i},1);calc()">删</button></td></tr>`;
  });
  th+='</tbody></table>';
  $('tableArea').innerHTML=th;
  // Monthly bar chart
  const months=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0'));
  const monthDiv=months.map(m=>records.filter(r=>r.date.slice(5,7)===m).reduce((s,r)=>s+r.divPerShare*r.shares*(1-r.tax/100),0));
  const maxDiv=Math.max(...monthDiv,1);
  const canvas=$('barChart');
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=(rect.width)*dpr;canvas.height=200*dpr;
  canvas.style.width=rect.width+'px';canvas.style.height='200px';
  ctx.scale(dpr,dpr);
  const w=rect.width,h=200,pad={t:10,r:10,b:25,l:50};
  const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='var(--border)';ctx.lineWidth=0.5;
  for(let i=0;i<=4;i++){
    const y=pad.t+ph*i/4;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();
    ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';ctx.textAlign='right';
    ctx.fillText((maxDiv*(4-i)/4).toFixed(0),pad.l-4,y+4);
  }
  const bw=pw/12*0.6;
  monthDiv.forEach((v,i)=>{
    const x=pad.l+i*pw/12+pw/24-bw/2;
    const bh=v/maxDiv*ph;
    ctx.fillStyle=v>0?'#3b82f6':'#30363d';
    ctx.fillRect(x,pad.t+ph-bh,bw,bh);
    ctx.fillStyle='#8b949e';ctx.font='9px sans-serif';ctx.textAlign='center';
    ctx.fillText(months[i]+'月',x+bw/2,h-6);
  });
  // Summary by stock
  const grouped={};
  records.forEach(r=>{
    if(!grouped[r.code])grouped[r.code]={name:r.name,totalDiv:0,cost:r.cost};
    grouped[r.code].totalDiv+=r.divPerShare*r.shares*(1-r.tax/100);
  });
  let sh='<table><thead><tr><th>股票</th><th>总分红(税后)</th><th>持仓成本</th><th>股息率</th></tr></thead><tbody>';
  Object.values(grouped).forEach(g=>{
    const y=g.cost>0?(g.totalDiv/g.cost*100).toFixed(2):'0.00';
    sh+=`<tr><td>${g.name}</td><td class="up">¥${g.totalDiv.toFixed(2)}</td><td>¥${g.cost.toLocaleString()}</td><td>${y}%</td></tr>`;
  });
  sh+='</tbody></table>';
  $('summaryArea').innerHTML=sh;
}
$('addBtn').onclick=()=>{
  const r={code:$('fCode').value.trim(),name:$('fName').value.trim(),cost:+$('fCost').value,divPerShare:+$('fDivPerShare').value,shares:+$('fShares').value,date:$('fDate').value,freq:$('fFreq').value,tax:+$('fTax').value};
  if(!r.code||!r.name){alert('请填写股票代码和名称');return;}
  records.push(r);calc();
};
calc();
})();
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
