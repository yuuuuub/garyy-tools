<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国武术宗师大全 - Chinese Martial Arts Masters</title>
<meta name="description" content="中国武术宗师大全，涵盖历代武术名家的生平事迹与武学成就">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国武术宗师大全 - Chinese Martial Arts Masters">
<meta property="og:description" content="中国武术宗师大全，涵盖历代武术名家的生平事迹与武学成就">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-martial-arts-masters-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👴</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a05 0%,#2a1510 50%,#3d2015 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a,#b06a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.master-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px}
.master-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.master-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.master-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.master-card .m-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.master-card .m-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(232,168,124,0.15);color:var(--accent)}
.master-card .m-name{font-size:1.3em;font-weight:bold}
.master-card .m-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.master-card .m-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.master-card .m-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.master-card .m-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.master-card .m-detail strong{color:var(--text)}
.master-card .m-achievements{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.master-card .m-achievements span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:rgba(232,168,124,0.1);color:var(--accent)}
.master-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.master-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>👴 中国武术宗师大全</h1>
<p>Chinese Martial Arts Masters — 历代武术名家的传奇人生</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索宗师姓名或门派...">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部宗师</button>
<button class="filter-btn" data-filter="少林">🥊 少林</button>
<button class="filter-btn" data-filter="武当">☯️ 武当</button>
<button class="filter-btn" data-filter="太极">☯️ 太极</button>
<button class="filter-btn" data-filter="形意">🐉 形意</button>
<button class="filter-btn" data-filter="八卦">🔄 八卦</button>
<button class="filter-btn" data-filter="南拳">🏯 南拳</button>
<button class="filter-btn" data-filter="综合">🥋 综合</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="master-grid" id="masterGrid"></div>
<footer><p>👴 中国武术宗师大全 — 武学宗师，德艺双馨</p></footer>
</div>
<script>
const MASTER_DATA=[
  {id:1,name:"张三丰",en:"Zhang Sanfeng",category:"武当",icon:"☯️",era:"元末明初",lifespan:"1247-?",origin:"武当山",description:"张三丰是武当派的创始人，太极拳的祖师。相传他在武当山修炼时，观察蛇鹤相斗而悟出太极拳法。",achievements:["创立武当派","太极拳祖师","内家拳创始人","道家武术代表"],famousQuote:"以静制动，以柔克刚",disciples:["张松溪","张翠山","殷梨亭"],martialArts:["太极拳","武当剑","武当功"]},
  {id:2,name:"杨露禅",en:"Yang Luchan",category:"太极",icon:"☯️",era:"清代",lifespan:"1799-1872",origin:"河北永年",description:"杨露禅是杨式太极拳的创始人，从陈家沟学习太极拳后，根据北京人的特点改良，创立了杨式太极拳。",achievements:["杨式太极拳创始人","太极拳进北京第一人","太极拳推广先驱"],famousQuote:"拳无拳，意无意，无意之中是真意",disciples:["杨班侯","杨健侯","杨澄甫"],martialArts:["杨式太极拳","杨式太极剑","杨式太极刀"]},
  {id:3,name:"霍元甲",en:"Huo Yuanjia",category:"综合",icon:"🥊",era:"清末民初",lifespan:"1868-1910",origin:"天津静海",description:"霍元甲是清末民初的武术家，迷踪拳高手。他在上海创办精武体育会，致力于武术的普及和推广。",achievements:["精武体育会创始人","迷踪拳高手","武术普及先驱","民族英雄"],famousQuote："习武先修德，练功先练心",disciples:["刘振声","陈公哲","陈其美"],martialArts:["迷踪拳","霍家拳","十路弹腿"]},
  {id:4,name:"叶问",en:"Ip Man",category:"南拳",icon:"🥊",era:"清末民初",lifespan:"1893-1972",origin:"广东佛山",description:"叶问是咏春拳的一代宗师，李小龙的师父。他将咏春拳发扬光大，使咏春拳成为世界上最流行的中国武术之一。",achievements:["咏春拳宗师","李小龙师父","咏春拳推广先驱","国际影响力"],famousQuote："以最短距离、最快速度攻击对手",disciples:["李小龙","梁绍鸿","黄淳梁"],martialArts:["咏春拳","小念头","寻桥","标指"]},
  {id:5,name:"陈王廷",en:"Chen Wangting",category:"太极",icon:"☯️",era:"明末清初",lifespan:"1580-1660",origin:"河南温县陈家沟",description:"陈王廷是陈式太极拳的创始人，他融合了戚继光的拳法、导引术和中医经络学说，创立了太极拳。",achievements:["陈式太极拳创始人","太极拳创始人","太极拳理论奠基人"],famousQuote："太极拳者，以柔克刚，以静制动",disciples:["陈汝信","陈大兴","陈敬柏"],martialArts:["陈式太极拳","陈式太极剑","陈式太极刀"]},
  {id:6,name:"董海川",en:"Dong Haichuan",category:"八卦",icon:"🔄",era:"清代",lifespan:"1797-1882",origin:"北京",description:"董海川是八卦掌的创始人，以'游龙八卦'闻名。他将八卦掌发展成一套完整的内家拳体系。",achievements:["八卦掌创始人","内家拳宗师","八卦掌理论奠基人"],famousQuote："走转掌法，变化无穷",disciples:["程廷华","尹福","马维棋"],martialArts:["八卦掌","八卦刀","八卦剑"]},
  {id:7,name:"郭云深",en:"Guo Yunshen",category:"形意",icon:"🐉",era:"清代",lifespan:"1829-1900",origin:"河北深县",description:"郭云深是形意拳的一代宗师，有'半步崩拳打天下'之称。他的崩拳威力巨大，被称为'神拳'。",achievements:["形意拳宗师","半步崩拳","形意拳理论家"],famousQuote："打人如亲嘴，硬打硬进无遮拦",disciples:["孙禄堂","尚云祥","李存义"],martialArts:["形意拳","崩拳","五行拳"]},
  {id:8,name:"孙禄堂",en:"Sun Lutang",category:"综合",icon:"🥋",era:"清末民初",lifespan:"1860-1933",origin:"河北完县",description:"孙禄堂是近代武术大家，精通形意、八卦、太极拳，被称为'天下第一手'。他创立了孙式太极拳。",achievements:["孙式太极拳创始人","天下第一手","三拳合一","武术理论家"],famousQuote："拳无拳，意无意，无意之中是真意",disciples:["孙存周","孙绍周","齐公博"],martialArts:["孙式太极拳","形意拳","八卦掌"]},
  {id:9,name:"黄飞鸿",en:"Wong Fei-hung",category:"南拳",icon:"🏯",era:"清末民初",lifespan:"1847-1925",origin:"广东佛山",description:"黄飞鸿是南拳的一代宗师，精通洪拳、铁线拳。他是武术家、医生、舞狮高手，是南派武术的代表人物。",achievements:["南拳宗师","洪拳高手","铁线拳传人","舞狮高手"],famousQuote："习武先修德，医武双修",disciples:["林世荣","梁宽","陆阿采"],martialArts:["洪拳","铁线拳","工字伏虎","虎鹤双形"]},
  {id:10,name:"李小龙",en:"Bruce Lee",category:"综合",icon:"🥊",era:"现代",lifespan:"1940-1973",origin:"美国旧金山",description:"李小龙是截拳道的创始人，将中国武术推向世界。他的功夫电影震惊世界，被誉为'功夫之王'。",achievements:["截拳道创始人","功夫之王","武术电影先驱","武术哲学家"],famousQuote："以无法为有法，以无限为有限",disciples:["木村武之","严镜海","伊诺山度"],martialArts:["截拳道","咏春拳","寸拳","双节棍"]},
  {id:11,name:"王子平",en:"Wang Ziping",category:"综合",icon:"🥋",era:"清末民初",lifespan:"1881-1973",origin:"河北沧州",description:"王子平是近代武术大家，精通查拳、弹腿，有'千斤王'之称。他曾多次与外国力士比武，为国争光。",achievements:["查拳大师","千斤王","武术外交家","武术教育家"],famousQuote："习武先修德，爱国为先",disciples:["张文广","马振邦","李天骥"],martialArts:["查拳","弹腿","十路弹腿"]},
  {id:12,name:"杨澄甫",en:"Yang Chengfu",category:"太极",icon:"☯️",era:"清末民初",lifespan:"1883-1936",origin:"河北永年",description:"杨澄甫是杨式太极拳的定型人，他将杨式太极拳发展成现在的样子，是太极拳普及的重要人物。",achievements:["杨式太极拳定型人","太极拳普及先驱","太极拳理论家"],famousQuote："太极拳以柔克刚，以静制动",disciples:["傅钟文","牛春明","李雅轩"],martialArts:["杨式太极拳","杨式太极剑","杨式太极刀"]},
  {id:13,name:"陈发科",en:"Chen Fake",category:"太极",icon:"☯️",era:"清末民初",lifespan:"1887-1957",origin:"河南温县陈家沟",description:"陈发科是陈式太极拳的代表人物，他将陈式太极拳带到北京，使陈式太极拳在全国传播。",achievements:["陈式太极拳宗师","太极拳北传先驱","太极拳实战家"],famousQuote："太极拳是缠法，无处不缠",disciples:["陈照丕","陈照奎","洪均生"],martialArts:["陈式太极拳","陈式太极剑","陈式太极推手"]},
  {id:14,name:"顾汝章",en:"Gu Ruzhang",category:"南拳",icon:"🏯",era:"清末民初",lifespan:"1894-1952",origin:"广东",description:"顾汝章是广东精武会的创办人之一，精通少林拳、铁砂掌。他是南派武术的代表人物。",achievements:["广东精武会创办人","少林拳高手","铁砂掌传人"],famousQuote："习武先修德，以武报国",disciples:["邵汉生","林荫堂","钟南山"],martialArts:["少林拳","铁砂掌","洪拳"]},
  {id:15,name:"蔡龙云",en:"Cai Longyun",category:"综合",icon:"🥋",era:"现代",lifespan:"1928-2015",origin:"山东济宁",description:"蔡龙云是当代武术大家，精通华拳、长拳，是武术竞赛规则的制定者之一。",achievements:["华拳大师","武术竞赛规则制定者","武术教育家","武术理论家"],famousQuote："武术是国粹，要发扬光大",disciples:["众多武术运动员"],martialArts:["华拳","长拳","武术套路"]},
  {id:16,name:"陈正雷",en:"Chen Zhengei",category:"太极",icon:"☯️",era:"现代",lifespan:"1949-至今",origin:"河南温县陈家沟",description:"陈正雷是陈式太极拳的代表人物，是陈式太极拳第十一代传人，致力于太极拳的国际推广。",achievements:["陈式太极拳第十一代传人","太极拳国际推广先驱","太极拳理论家"],famousQuote："太极拳是中华民族的瑰宝",disciples:["众多国内外弟子"],martialArts:["陈式太极拳","陈式太极剑","陈式太极推手"]}
];
function renderCards(data){
  document.getElementById('masterGrid').innerHTML=data.map(m=>`
    <div class="master-card" data-category="${m.category}">
      <div class="m-header"><div class="m-icon">${m.icon}</div><div><div class="m-name">${m.name}</div><div class="m-sub">${m.en} · ${m.era}</div></div></div>
      <div class="m-meta"><span>${m.category}</span><span>生卒：${m.lifespan}</span><span>籍贯：${m.origin}</span></div>
      <div class="m-detail"><strong>简介：</strong>${m.description}</div>
      <div class="m-detail"><strong>名言：</strong>${m.famousQuote}</div>
      <div class="m-detail"><strong>弟子：</strong>${m.disciples.join('、')}</div>
      <div class="m-achievements">${m.achievements.map(a=>`<span>${a}</span>`).join('')}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">武术宗师</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.master-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.master-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(MASTER_DATA);renderStats(MASTER_DATA);
</script>
</body>
</html>
