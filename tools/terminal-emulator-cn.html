<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终端模拟器</title>
    <meta name="description" content="在线终端模拟器，支持多种内置命令、Tab补全、命令历史">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
    <meta name="robots" content="index, follow">
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #e6e6e6;
            --text-secondary: #a6a6a6;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --border: #2a2a4a;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; height: 100vh; display: flex; flex-direction: column; }
        .header { padding: 0.75rem 1.5rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
        h1 { color: var(--accent); font-size: 1.1rem; }
        .header-btns { margin-left: auto; display: flex; gap: 0.5rem; }
        button {
            background: var(--accent); color: white; border: none; padding: 0.4rem 0.8rem;
            border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.3s; font-size: 0.8rem;
        }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: var(--bg-tertiary); color: var(--text-primary); }
        button.secondary:hover { background: var(--border); }
        .terminal {
            flex: 1; background: #0d1117; padding: 1rem; overflow-y: auto; font-family: 'Courier New', monospace;
            font-size: 0.9rem; line-height: 1.5;
        }
        .terminal-line { margin-bottom: 0.2rem; white-space: pre-wrap; word-break: break-all; }
        .prompt { color: var(--success); }
        .prompt .user { color: #58a6ff; }
        .prompt .at { color: var(--text-secondary); }
        .prompt .host { color: #d2a8ff; }
        .prompt .path { color: #79c0ff; }
        .prompt .symbol { color: var(--success); }
        .cmd-text { color: #e6edf3; }
        .output-text { color: #8b949e; }
        .error-text { color: #f85149; }
        .success-text { color: #3fb950; }
        .warning-text { color: #d29922; }
        .info-text { color: #58a6ff; }
        .highlight-text { color: #d2a8ff; }
        .input-line { display: flex; align-items: center; }
        .input-line input {
            flex: 1; background: transparent; border: none; color: #e6edf3;
            font-family: 'Courier New', monospace; font-size: 0.9rem; outline: none;
            caret-color: var(--success);
        }
        .ascii-art { color: var(--success); font-size: 0.8rem; line-height: 1.2; }
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        .file-item { display: inline-block; margin-right: 1.5rem; }
        .dir { color: #58a6ff; font-weight: bold; }
        .file { color: #e6edf3; }
        .exe { color: var(--success); }
        .hidden { color: var(--text-secondary); }
    </style>
    <script src="i18n.js" defer></script>
</head>
<body>
    <div class="header">
        <h1>💻 终端模拟器</h1>
        <div class="header-btns">
            <button class="secondary" onclick="clearTerminal()">清屏</button>
        </div>
    </div>
    <div class="terminal" id="terminal" onclick="focusInput()">
        <div id="output"></div>
        <div class="input-line" id="inputLine">
            <span class="prompt"><span class="user">user</span><span class="at">@</span><span class="host">terminal</span>:<span class="path">~</span><span class="symbol">$ </span></span>
            <input type="text" id="cmdInput" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
const COMMANDS = ['help', 'clear', 'echo', 'date', 'whoami', 'pwd', 'ls', 'cat', 'mkdir', 'rm', 'history', 'calc', 'color', 'fortune', 'weather', 'neofetch', 'tree', 'grep', 'wc', 'head', 'tail', 'sort', 'uniq', 'env', 'uname', 'uptime', 'df', 'du', 'ps', 'top', 'kill', 'chmod', 'touch', 'cp', 'mv'];
let cmdHistory = [];
let historyIdx = -1;
let cwd = '~';

const files = {
    '~': {
        'Documents': { type: 'dir', children: { 'notes.txt': { type: 'file', content: '这是一份学习笔记\n今天学习了CSS Grid布局\n明天计划学习React Hooks' }, 'todo.md': { type: 'file', content: '# 待办事项\n- [x] 完成项目设计\n- [ ] 编写单元测试\n- [ ] 部署到生产环境' } } },
        'Downloads': { type: 'dir', children: { 'image.png': { type: 'file', content: '[binary data]' }, 'data.json': { type: 'file', content: '{"name":"张三","age":28,"city":"北京"}' } } },
        'Desktop': { type: 'dir', children: {} },
        'readme.txt': { type: 'file', content: '欢迎使用终端模拟器！\n输入 help 查看可用命令。' },
        '.bashrc': { type: 'file', content: '# .bashrc\nexport PATH=$PATH:/usr/local/bin\nalias ll="ls -la"\nalias cls="clear"' },
        'script.sh': { type: 'file', content: '#!/bin/bash\necho "Hello World"\nfor i in 1 2 3 4 5; do\n  echo "Count: $i"\ndone' }
    }
};

function resolvePath(path) {
    if (path === '~' || path === '') return '~';
    if (path.startsWith('~/')) path = path;
    else if (!path.startsWith('~')) path = cwd === '~' ? '~/' + path : cwd + '/' + path;
    return path.replace(/\/+/g, '/').replace(/\/$/, '') || '~';
}

function getNode(path) {
    const parts = path.split('/').filter(Boolean);
    let node = files['~'];
    if (parts[0] === '~') parts.shift();
    for (const p of parts) {
        if (!node.children || !node.children[p]) return null;
        node = node.children[p];
    }
    return node;
}

function getParentAndName(path) {
    const parts = path.split('/').filter(Boolean);
    const name = parts.pop();
    const parentPath = parts.length ? parts.join('/') : '~';
    return { parent: getNode(parentPath), name };
}

const fortunes = [
    '今天是美好的一天，去写代码吧！',
    '代码如诗，用心去写每一行。',
    'Bug是成长的阶梯，每次修复都让你更强。',
    '好的代码是最好的文档。',
    '保持好奇心，学习永无止境。',
    '简单是终极的复杂。——达芬奇',
    '先让代码跑起来，再让代码跑得快。',
    '不要重复自己（DRY原则）。'
];

const weathers = [
    '☀️  晴 28°C  湿度45%  东风3级',
    '⛅ 多云 22°C  湿度60%  北风2级',
    '🌧️  小雨 18°C  湿度85%  南风1级',
    '❄️  小雪 -2°C  湿度70%  西北风4级',
    '🌫️  雾 15°C  湿度90%  微风'
];

function addOutput(html, className = 'output-text') {
    const div = document.createElement('div');
    div.className = 'terminal-line ' + className;
    div.innerHTML = html;
    document.getElementById('output').appendChild(div);
}

function addPromptLine(cmd) {
    addOutput(`<span class="prompt"><span class="user">user</span><span class="at">@</span><span class="host">terminal</span>:<span class="path">${cwd}</span><span class="symbol">$ </span></span><span class="cmd-text">${escapeHtml(cmd)}</span>`);
}

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function execute(cmd) {
    const parts = cmd.trim().split(/\s+/);
    const command = parts[0];
    const args = parts.slice(1);

    addPromptLine(cmd);

    if (!command) return;

    switch (command) {
        case 'help':
            addOutput('<span class="info-text">可用命令:</span>');
            addOutput('  <span class="success-text">help</span>      显示帮助信息');
            addOutput('  <span class="success-text">clear</span>      清屏');
            addOutput('  <span class="success-text">echo</span>       输出文本');
            addOutput('  <span class="success-text">date</span>       显示当前日期时间');
            addOutput('  <span class="success-text">whoami</span>     显示当前用户');
            addOutput('  <span class="success-text">pwd</span>        显示当前目录');
            addOutput('  <span class="success-text">ls</span>         列出目录内容');
            addOutput('  <span class="success-text">cat</span>        显示文件内容');
            addOutput('  <span class="success-text">mkdir</span>      创建目录');
            addOutput('  <span class="success-text">rm</span>         删除文件');
            addOutput('  <span class="success-text">touch</span>      创建空文件');
            addOutput('  <span class="success-text">tree</span>       显示目录树');
            addOutput('  <span class="success-text">history</span>    命令历史');
            addOutput('  <span class="success-text">calc</span>       数学计算器');
            addOutput('  <span class="success-text">fortune</span>    随机名言');
            addOutput('  <span class="success-text">weather</span>    天气预报');
            addOutput('  <span class="success-text">neofetch</span>   系统信息');
            addOutput('  <span class="success-text">env</span>        环境变量');
            addOutput('  <span class="success-text">uname</span>      系统信息');
            addOutput('  <span class="success-text">uptime</span>     运行时间');
            addOutput('  <span class="success-text">grep</span>       搜索文本');
            addOutput('  <span class="success-text">wc</span>         统计字数');
            addOutput('  <span class="success-text">head</span>       显示前N行');
            break;

        case 'clear': document.getElementById('output').innerHTML = ''; break;

        case 'echo': addOutput(escapeHtml(args.join(' '))); break;

        case 'date': addOutput(new Date().toLocaleString('zh-CN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' })); break;

        case 'whoami': addOutput('user'); break;

        case 'pwd': addOutput(cwd.replace('~', '/home/user')); break;

        case 'ls': {
            const target = args[0] ? resolvePath(args[0]) : cwd;
            const node = getNode(target);
            if (!node || node.type !== 'dir') { addOutput(`<span class="error-text">ls: 无法访问 '${args[0] || target}': 没有那个文件或目录</span>`); break; }
            const entries = Object.entries(node.children);
            if (entries.length === 0) { addOutput('<span class="output-text">(空目录)</span>'); break; }
            const showAll = args.includes('-a') || args.includes('-la') || args.includes('-al');
            let items = entries.map(([name, info]) => {
                if (name.startsWith('.') && !showAll) return null;
                const cls = info.type === 'dir' ? 'dir' : name.endsWith('.sh') || name.endsWith('.exe') ? 'exe' : name.startsWith('.') ? 'hidden' : 'file';
                return `<span class="file-item ${cls}">${info.type === 'dir' ? name + '/' : name}</span>`;
            }).filter(Boolean);
            addOutput(items.join(''));
            break;
        }

        case 'cat': {
            if (!args[0]) { addOutput('<span class="error-text">cat: 缺少文件参数</span>'); break; }
            const path = resolvePath(args[0]);
            const node = getNode(path);
            if (!node) { addOutput(`<span class="error-text">cat: ${args[0]}: 没有那个文件或目录</span>`); break; }
            if (node.type === 'dir') { addOutput(`<span class="error-text">cat: ${args[0]}: 是一个目录</span>`); break; }
            addOutput(escapeHtml(node.content));
            break;
        }

        case 'mkdir': {
            if (!args[0]) { addOutput('<span class="error-text">mkdir: 缺少目录名</span>'); break; }
            const parent = getNode(cwd);
            if (parent && parent.children) {
                if (parent.children[args[0]]) { addOutput(`<span class="error-text">mkdir: 无法创建目录 '${args[0]}': 文件已存在</span>`); }
                else { parent.children[args[0]] = { type: 'dir', children: {} }; addOutput(`<span class="success-text">已创建目录: ${args[0]}</span>`); }
            }
            break;
        }

        case 'rm': {
            if (!args[0]) { addOutput('<span class="error-text">rm: 缺少文件名</span>'); break; }
            const { parent, name } = getParentAndName(resolvePath(args[0]));
            if (parent && parent.children && parent.children[name]) {
                delete parent.children[name];
                addOutput(`<span class="success-text">已删除: ${name}</span>`);
            } else { addOutput(`<span class="error-text">rm: ${args[0]}: 没有那个文件或目录</span>`); }
            break;
        }

        case 'touch': {
            if (!args[0]) { addOutput('<span class="error-text">touch: 缺少文件名</span>'); break; }
            const parent = getNode(cwd);
            if (parent && parent.children && !parent.children[args[0]]) {
                parent.children[args[0]] = { type: 'file', content: '' };
                addOutput(`<span class="success-text">已创建文件: ${args[0]}</span>`);
            }
            break;
        }

        case 'tree': {
            const target = args[0] ? resolvePath(args[0]) : cwd;
            const node = getNode(target);
            if (!node || node.type !== 'dir') { addOutput(`<span class="error-text">tree: '${target}' 不是目录</span>`); break; }
            function drawTree(n, prefix = '') {
                const entries = Object.entries(n.children || {});
                entries.forEach(([name, info], i) => {
                    const isLast = i === entries.length - 1;
                    const connector = isLast ? '└── ' : '├── ';
                    const cls = info.type === 'dir' ? 'dir' : 'file';
                    addOutput(`${prefix}${connector}<span class="${cls}">${name}</span>`);
                    if (info.type === 'dir') drawTree(info, prefix + (isLast ? '    ' : '│   '));
                });
            }
            addOutput(`<span class="dir">${target}</span>`);
            drawTree(node);
            break;
        }

        case 'history':
            cmdHistory.forEach((c, i) => addOutput(`  <span class="output-text">${i + 1}  ${escapeHtml(c)}</span>`));
            break;

        case 'calc': {
            if (!args.length) { addOutput('<span class="error-text">calc: 请提供表达式，例如: calc 2 + 3</span>'); break; }
            try {
                const expr = args.join('');
                if (/^[0-9+\-*/().%\s]+$/.test(expr)) {
                    const result = Function('"use strict"; return (' + expr + ')')();
                    addOutput(`<span class="success-text">${expr} = ${result}</span>`);
                } else { addOutput('<span class="error-text">calc: 无效表达式</span>'); }
            } catch { addOutput('<span class="error-text">calc: 计算错误</span>'); }
            break;
        }

        case 'fortune':
            addOutput(`<span class="highlight-text">🔮 ${fortunes[Math.floor(Math.random() * fortunes.length)]}</span>`);
            break;

        case 'weather':
            addOutput(`<span class="info-text">${weathers[Math.floor(Math.random() * weathers.length)]}</span>`);
            break;

        case 'neofetch':
            addOutput(`<span class="ascii-art">
    <span class="success-text">       _nnnn_</span>        <span class="info-text">user</span>@<span class="highlight-text">terminal</span>
    <span class="success-text">      dGGGGMMb</span>       ──────────────
    <span class="success-text">     @p~qp~~qMb</span>      <span class="info-text">系统:</span> Web Terminal v1.0
    <span class="success-text">     M|@||@) M|</span>      <span class="info-text">主机:</span> Browser OS
    <span class="success-text">     @,----.JM|</span>      <span class="info-text">内核:</span> JavaScript ES2024
    <span class="success-text">    JS^\\__/  qKL</span>     <span class="info-text">终端:</span> Web Console
    <span class="success-text">   dZP        qKRb</span>   <span class="info-text">浏览器:</span> ${navigator.userAgent.split(' ').pop()}
    <span class="success-text">  dZP          qKKb</span>  <span class="info-text">分辨率:</span> ${window.innerWidth}x${window.innerHeight}
    <span class="success-text"> fZP            SMMb</span> <span class="info-text">主题:</span> Dark Theme
    <span class="success-text"> HZM            MMMM</span> <span class="info-text">内存:</span> ${navigator.deviceMemory || '未知'} GB
    <span class="success-text"> FqM            MMMM</span> <span class="info-text">CPU核心:</span> ${navigator.hardwareConcurrency || '未知'}
    <span class="success-text"> __| ".        |\\dS"qML</span>
    <span class="success-text"> |    \`.       | '  \\Zq</span>
    <span class="success-text">_)      \\.___.,|     .'</span>
    <span class="success-text">\\____   )MMMMMP|   .'</span>
    <span class="success-text">     '-'       '--'</span>
</span>`);
            break;

        case 'env':
            addOutput('SHELL=/bin/bash');
            addOutput('USER=user');
            addOutput('HOME=/home/user');
            addOutput('PATH=/usr/local/bin:/usr/bin:/bin');
            addOutput('LANG=zh_CN.UTF-8');
            addOutput('TERM=xterm-256color');
            addOutput('EDITOR=vim');
            break;

        case 'uname':
            addOutput(args.includes('-a') ? 'WebOS terminal 1.0.0 ' + navigator.userAgent.split(' ').slice(-1)[0] + ' JavaScript ES2024' : 'WebOS');
            break;

        case 'uptime': {
            const seconds = Math.floor((Date.now() - performance.timeOrigin) / 1000);
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            addOutput(` ${new Date().toLocaleTimeString()} up ${h}h ${m}m, 1 user`);
            break;
        }

        case 'grep': {
            if (args.length < 2) { addOutput('<span class="error-text">用法: grep 模式 文件</span>'); break; }
            const pattern = args[0];
            const path = resolvePath(args[1]);
            const node = getNode(path);
            if (!node || node.type === 'dir') { addOutput(`<span class="error-text">grep: ${args[1]}: 没有那个文件或目录</span>`); break; }
            const lines = node.content.split('\n');
            const regex = new RegExp(pattern, 'gi');
            const matches = lines.filter(l => regex.test(l));
            if (matches.length) matches.forEach(l => addOutput(escapeHtml(l)));
            else addOutput('<span class="output-text">(无匹配)</span>');
            break;
        }

        case 'wc': {
            if (!args[0]) { addOutput('<span class="error-text">wc: 缺少文件参数</span>'); break; }
            const path = resolvePath(args[0]);
            const node = getNode(path);
            if (!node || node.type === 'dir') { addOutput(`<span class="error-text">wc: ${args[0]}: 没有那个文件</span>`); break; }
            const lines = node.content.split('\n').length;
            const words = node.content.split(/\s+/).filter(Boolean).length;
            const chars = node.content.length;
            addOutput(`  ${lines}  ${words}  ${chars} ${args[0]}`);
            break;
        }

        case 'head': {
            const n = args.includes('-n') ? parseInt(args[args.indexOf('-n') + 1]) || 10 : 10;
            const file = args.find(a => !a.startsWith('-') && a !== String(n));
            if (!file) { addOutput('<span class="error-text">head: 缺少文件参数</span>'); break; }
            const path = resolvePath(file);
            const node = getNode(path);
            if (!node || node.type === 'dir') { addOutput(`<span class="error-text">head: ${file}: 没有那个文件</span>`); break; }
            addOutput(escapeHtml(node.content.split('\n').slice(0, n).join('\n')));
            break;
        }

        case 'ps':
            addOutput('  PID TTY          TIME CMD');
            addOutput('    1 pts/0    00:00:00 bash');
            addOutput('  128 pts/0    00:00:00 terminal');
            addOutput('  256 pts/0    00:00:00 ps');
            break;

        case 'df':
            addOutput('Filesystem     1K-blocks    Used Available Use% Mounted on');
            addOutput('/dev/sda1       51200000 12800000  38400000  26% /');
            addOutput('tmpfs            2048000        0   2048000   0% /dev/shm');
            break;

        case 'du':
            addOutput('4.0K\t./Documents');
            addOutput('4.0K\t./Downloads');
            addOutput('4.0K\t./Desktop');
            addOutput('4.0K\t.');
            break;

        case 'top':
            addOutput('<span class="info-text">top - Web Terminal</span>');
            addOutput('Tasks: 3 total, 1 running');
            addOutput('%Cpu(s): 2.1 us, 0.3 sy, 0.0 ni, 97.4 id');
            addOutput('');
            addOutput('  PID USER      PR  NI    VIRT    RES    SHR S  %CPU %MEM     TIME+ COMMAND');
            addOutput('    1 user      20   0   16384   8192   4096 S   0.0  0.4   0:00.01 bash');
            addOutput('  128 user      20   0   32768  16384   8192 R   1.2  0.8   0:00.15 terminal');
            break;

        case 'uname':
            addOutput(args.includes('-a') ? 'WebOS terminal 1.0.0 JavaScript' : 'WebOS');
            break;

        default:
            addOutput(`<span class="error-text">bash: ${command}: 未找到命令。输入 'help' 查看可用命令。</span>`);
    }

    window.scrollTo(0, document.body.scrollHeight);
}

const input = document.getElementById('cmdInput');

input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        const cmd = input.value;
        if (cmd.trim()) { cmdHistory.push(cmd); historyIdx = cmdHistory.length; }
        execute(cmd);
        input.value = '';
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (historyIdx > 0) { historyIdx--; input.value = cmdHistory[historyIdx]; }
    } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (historyIdx < cmdHistory.length - 1) { historyIdx++; input.value = cmdHistory[historyIdx]; }
        else { historyIdx = cmdHistory.length; input.value = ''; }
    } else if (e.key === 'Tab') {
        e.preventDefault();
        const val = input.value;
        const matches = COMMANDS.filter(c => c.startsWith(val));
        if (matches.length === 1) input.value = matches[0];
        else if (matches.length > 1) addOutput(matches.join('  '));
    } else if (e.key === 'l' && e.ctrlKey) {
        e.preventDefault();
        document.getElementById('output').innerHTML = '';
    }
});

function focusInput() { input.focus(); }

function clearTerminal() {
    document.getElementById('output').innerHTML = '';
    addOutput('<span class="success-text">终端已清屏。</span>');
}

// Welcome message
