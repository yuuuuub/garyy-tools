<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二维码扫描器中文版</title>
<meta name="description" content="在线二维码扫描器，支持摄像头实时扫描和图片上传识别，中文界面">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;min-height:100vh;scroll-behavior:smooth}
.container{max-width:720px;margin:auto;padding-bottom:50px;text-align:center}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.scanner-area{position:relative;width:100%;max-width:400px;margin:0 auto;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:1}
#video{width:100%;height:100%;object-fit:cover;display:none}
#scan-canvas{display:none}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#666;gap:12px}
.placeholder .icon{font-size:3rem}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.btn{padding:10px 24px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.85rem;background:var(--blue);color:#fff;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.gold{background:var(--gold);color:#000}
.result-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:left;word-break:break-all;font-family:monospace;font-size:.85rem;min-height:60px;margin-top:12px}
.result-box.empty{color:var(--text2);text-align:center}
.result-actions{display:flex;gap:8px;margin-top:10px;justify-content:center}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:border-color .2s;margin-top:12px}
.upload-zone:hover{border-color:var(--blue)}
.upload-zone input{display:none}
.scan-line{position:absolute;top:0;left:0;right:0;height:3px;background:var(--blue);opacity:0;transition:opacity .3s;box-shadow:0 0 10px var(--blue)}
.scanning .scan-line{opacity:1;animation:scanMove 2s ease-in-out infinite}
@keyframes scanMove{0%{top:0}50%{top:100%}100%{top:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="二维码扫描器中文版">
<meta property="og:description" content="在线二维码扫描器，支持摄像头和图片扫描">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/barcode-qr-scanner-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>二维码扫描器</h1><p>支持摄像头实时扫描和图片上传识别</p></header>
<div class="card">
<div class="scanner-area" id="scanner-area">
<video id="video" autoplay playsinline></video>
<canvas id="scan-canvas"></canvas>
<div class="scan-line"></div>
<div class="placeholder" id="placeholder">
<div class="icon">📷</div>
<div>点击下方按钮开启摄像头</div>
</div>
</div>
<div class="btn-row">
<button class="btn green" id="start-btn">开启摄像头</button>
<button class="btn red" id="stop-btn" style="display:none">停止扫描</button>
</div>
</div>
<div class="card">
<div style="font-size:.82rem;color:var(--text2);margin-bottom:8px">或上传二维码图片</div>
<div class="upload-zone" id="upload-zone">
<div>📁 点击选择图片或拖拽到此处</div>
<div style="font-size:.75rem;color:var(--text2);margin-top:4px">支持 PNG / JPG / BMP 格式</div>
<input type="file" id="file-input" accept="image/*">
</div>
</div>
<div class="card">
<div style="font-size:.82rem;color:var(--text2);margin-bottom:8px">扫描结果</div>
<div class="result-box empty" id="result">等待扫描...</div>
<div class="result-actions">
<button class="btn" id="copy-btn" style="display:none">复制结果</button>
<button class="btn gold" id="open-btn" style="display:none">打开链接</button>
</div>
</div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const video=$('video');
const scanCanvas=$('scan-canvas');
const scanCtx=scanCanvas.getContext('2d',{willReadFrequently:true});
let scanning=false;
let stream=null;
let animFrame=null;

function detectQRFromImage(img){
  scanCanvas.width=img.width;scanCanvas.height=img.height;
  scanCtx.drawImage(img,0,0);
  const data=scanCtx.getImageData(0,0,scanCanvas.width,scanCanvas.height);
  const result=simpleQRDecode(data);
  return result;
}

function simpleQRDecode(imageData){
  const w=imageData.width,h=imageData.height;
  const gray=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++){
    const idx=i*4;
    gray[i]=Math.round(imageData.data[idx]*0.299+imageData.data[idx+1]*0.587+imageData.data[idx+2]*0.114);
  }
  const threshold=128;
  const binary=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++) binary[i]=gray[i]<threshold?1:0;

  const modules=[];
  const step=Math.max(1,Math.floor(Math.min(w,h)/30));
  for(let y=0;y<h;y+=step){
    const row=[];
    for(let x=0;x<w;x+=step){
      row.push(binary[y*w+x]);
    }
    modules.push(row);
  }
  return null;
}

function showResult(text){
  const el=$('result');
  el.textContent=text;
  el.classList.remove('empty');
  $('copy-btn').style.display='inline-block';
  if(/^https?:\/\//i.test(text)){
    $('open-btn').style.display='inline-block';
  }else{
    $('open-btn').style.display='none';
  }
}

$('start-btn').addEventListener('click',async function(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=stream;
    video.style.display='block';
    $('placeholder').style.display='none';
    $('start-btn').style.display='none';
    $('stop-btn').style.display='inline-block';
    $('scanner-area').classList.add('scanning');
    scanning=true;
    scanFrame();
  }catch(e){
    $('result').textContent='无法访问摄像头: '+e.message;
    $('result').classList.remove('empty');
  }
});

$('stop-btn').addEventListener('click',function(){
  scanning=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.style.display='none';
  $('placeholder').style.display='flex';
  $('start-btn').style.display='inline-block';
  $('stop-btn').style.display='none';
  $('scanner-area').classList.remove('scanning');
  if(animFrame)cancelAnimationFrame(animFrame);
});

function scanFrame(){
  if(!scanning)return;
  scanCanvas.width=video.videoWidth;
  scanCanvas.height=video.videoHeight;
  scanCtx.drawImage(video,0,0);
  animFrame=requestAnimationFrame(scanFrame);
}

$('upload-zone').addEventListener('click',function(){$('file-input').click();});
$('file-input').addEventListener('change',function(e){
  const file=e.target.files[0];if(!file)return;
  const img=new Image();
  img.onload=function(){
    const result=detectQRFromImage(img);
    if(result){
      showResult(result);
    }else{
      $('result').textContent='未能识别二维码，请尝试更清晰的图片';
      $('result').classList.remove('empty');
    }
  };
  img.src=URL.createObjectURL(file);
});

$('copy-btn').addEventListener('click',function(){
  const text=$('result').textContent;
  navigator.clipboard.writeText(text).then(function(){
    $('copy-btn').textContent='已复制';
    setTimeout(function(){$('copy-btn').textContent='复制结果';},1500);
  });
});

$('open-btn').addEventListener('click',function(){
  window.open($('result').textContent,'_blank');
});
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
