<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纵向射击</title>
    <meta name="description" content="纵向射击游戏，驾驶飞机消灭空中敌人">
    <style>
:root {--bg: #0d1117;
--card: #161b22;
--border: #30363d;
--text: #e6edf3;
--accent: #3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {background: var(--bg);
color: var(--text);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
padding: 20px}
h1 { margin-bottom: 10px; }
.stats {display: flex;
gap: 20px;
margin-bottom: 10px;
font-size: 1rem;
flex-wrap: wrap;
justify-content: center}
.stats span { color: var(--accent); font-weight: bold; }
#gameCanvas {border: 2px solid var(--border);
border-radius: 8px;
max-width: 100%}
.info { margin-top: 10px; color: #8b949e; text-align: center; }
.mobile-controls {display: none;
margin-top: 15px}
.mobile-btn {width: 50px; height: 50px;
background: var(--card);
border: 1px solid var(--border);
border-radius: 8px;
color: var(--text);
font-size: 1rem;
cursor: pointer}
@media (max-width: 600px) {.mobile-controls { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="纵向射击">
  <meta property="og:description" content="纵向射击游戏，驾驶飞机消灭空中敌人">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/vertical-shooter/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
    <h1>✈️ 纵向射击</h1>
    <div class="stats">
        分数：<span id="score">0</span>
        火力：<span id="power">1</span>
        生命：<span id="lives">3</span>
        关卡：<span id="level">1</span>
    </div>
    <canvas id="gameCanvas" width="500" height="700"></canvas>
    <div class="info">方向键移动 | 自动射击 | 收集power-up增强火力</div>
    <div class="mobile-controls">
        <button class="mobile-btn" id="bl">←</button>
        <button class="mobile-btn" id="bu">↑</button>
        <button class="mobile-btn" id="bd">↓</button>
        <button class="mobile-btn" id="br">→</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 500, H = 700;

        let player, bullets, enemies, particles, powerups, stars;
        let score, level, power, keys = {};

        function init() {
            player = {x:W/2, y:H-70, w:28, h:32, lives:3, inv:0};
            bullets = [];
            enemies = [];
            particles = [];
            powerups = [];
            stars = Array.from({length:80}, () => ({x:Math.random()*W, y:Math.random()*H, s:Math.random()*2+0.5, v:Math.random()*2+1}));
            score = 0;
            level = 1;
            power = 1;
            spawnQueue = 0;
        }

        document.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault(); });
        document.addEventListener('keyup', e => keys[e.key] = false);

        const mb = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', () => keys[key] = false);
        };
        mb('bl','ArrowLeft'); mb('bu','ArrowUp'); mb('bd','ArrowDown'); mb('br','ArrowRight');

        let spawnQueue = 0, shootTimer = 0, waveTimer = 0;

        function update() {
            const spd = 5;
            if (keys['ArrowLeft'] || keys['a']) player.x -= spd;
            if (keys['ArrowRight'] || keys['d']) player.x += spd;
            if (keys['ArrowUp'] || keys['w']) player.y -= spd;
            if (keys['ArrowDown'] || keys['s']) player.y += spd;
            player.x = Math.max(14, Math.min(W-14, player.x));
            player.y = Math.max(16, Math.min(H-16, player.y));
            if (player.inv > 0) player.inv--;

            shootTimer++;
            if (shootTimer % 8 === 0) {
                if (power >= 1) bullets.push({x:player.x, y:player.y-16, vy:-10, vx:0, r:3});
                if (power >= 2) {
                    bullets.push({x:player.x-10, y:player.y-10, vy:-9, vx:-1, r:2});
                    bullets.push({x:player.x+10, y:player.y-10, vy:-9, vx:1, r:2});
                }
                if (power >= 3) {
                    bullets.push({x:player.x-18, y:player.y-5, vy:-8, vx:-2, r:2});
                    bullets.push({x:player.x+18, y:player.y-5, vy:-8, vx:2, r:2});
                }
            }

            bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
            bullets = bullets.filter(b => b.y > -10 && b.x > -10 && b.x < W+10);

            waveTimer++;
            if (waveTimer > 120) {
                spawnQueue = Math.min(spawnQueue + 1, 8 + level * 2);
            }

            if (spawnQueue > 0 && waveTimer % Math.max(10, 40 - level * 2) === 0) {
                const type = Math.random();
                let e;
                if (type < 0.6) {
                    e = {x:30+Math.random()*(W-60), y:-20, w:22, h:22, vx:0, vy:1.5+level*0.15, hp:1, pts:10, color:'#ef4444'};
                } else if (type < 0.85) {
                    e = {x:30+Math.random()*(W-60), y:-20, w:28, h:28, vx:Math.random()<0.5?1:-1, vy:1+level*0.1, hp:3, pts:25, color:'#f97316'};
                } else {
                    e = {x:W/2, y:-30, w:40, h:40, vx:Math.sin(0)*2, vy:0.8, hp:8+level*2, pts:100, color:'#a855f7', boss:true, t:0};
                }
                enemies.push(e);
                spawnQueue--;
            }

            enemies.forEach(e => {
                if (e.boss) {
                    e.t++;
                    e.x = W/2 + Math.sin(e.t * 0.02) * (W/2 - 40);
                    e.y = Math.min(e.y + e.vy, 80);
                } else {
                    e.x += e.vx;
                    e.y += e.vy;
                    if (e.x < 10 || e.x > W-10) e.vx *= -1;
                }
            });
            enemies = enemies.filter(e => e.y < H + 50);

            bullets.forEach(b => {
                enemies.forEach(e => {
                    if (e.hp > 0 && Math.abs(b.x-e.x) < e.w/2+b.r && Math.abs(b.y-e.y) < e.h/2+b.r) {
                        e.hp--;
                        b.y = -100;
                        if (e.hp <= 0) {
                            score += e.pts;
                            for (let i = 0; i < 8; i++) {
                                particles.push({x:e.x, y:e.y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, life:20, color:e.color});
                            }
                            if (Math.random() < 0.2) {
                                const pType = Math.random() < 0.6 ? 'power' : 'health';
                                powerups.push({x:e.x, y:e.y, vy:2, type:pType});
                            }
                        }
                    }
                });
            });

            if (player.inv <= 0) {
                enemies.forEach(e => {
                    if (e.hp > 0 && Math.abs(player.x-e.x) < (player.w+e.w)/2 && Math.abs(player.y-e.y) < (player.h+e.h)/2) {
                        player.lives--;
                        player.inv = 90;
                        e.hp = 0;
                        if (player.lives <= 0) {
                            init();
                        }
                    }
                });
            }

            powerups.forEach(p => p.y += p.vy);
            powerups = powerups.filter(p => p.y < H + 20);
            powerups.forEach(p => {
                if (Math.abs(p.x-player.x) < 25 && Math.abs(p.y-player.y) < 25) {
                    p.y = H+100;
                    if (p.type === 'power') power = Math.min(3, power + 1);
                    else player.lives = Math.min(5, player.lives + 1);
                }
            });

            enemies = enemies.filter(e => e.hp > 0);
            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
            particles = particles.filter(p => p.life > 0);

            stars.forEach(s => { s.y += s.v; if(s.y>H){s.y=0; s.x=Math.random()*W;} });

            if (spawnQueue <= 0 && enemies.length === 0 && waveTimer > 180) {
                level++;
                waveTimer = 0;
                spawnQueue = 5 + level * 3;
            }

            document.getElementById('score').textContent = score;
            document.getElementById('power').textContent = power;
            document.getElementById('lives').textContent = player.lives;
            document.getElementById('level').textContent = level;
        }

        function draw() {
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, W, H);

            stars.forEach(s => {
                ctx.fillStyle = `rgba(255,255,255,${s.s*0.3})`;
                ctx.fillRect(s.x, s.y, s.s, s.s);
            });

            particles.forEach(p => {
                ctx.globalAlpha = p.life/20;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            bullets.forEach(b => {
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(b.x-1.5, b.y-5, 3, 10);
            });

            powerups.forEach(p => {
                ctx.fillStyle = p.type === 'power' ? '#3b82f6' : '#22c55e';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 10, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText(p.type === 'power' ? 'P' : '+', p.x-5, p.y+5);
            });

            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                if (e.boss) {
                    ctx.beginPath();
                    ctx.moveTo(e.x, e.y - e.h/2);
                    ctx.lineTo(e.x - e.w/2, e.y + e.h/2);
                    ctx.lineTo(e.x + e.w/2, e.y + e.h/2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.fillRect(e.x-e.w/2, e.y+e.h/2-5, e.w*(e.hp/(8+level*2)), 5);
                } else {
                    ctx.fillRect(e.x-e.w/2, e.y-e.h/2, e.w, e.h);
                }
            });

            const alpha = player.inv > 0 ? (Math.floor(player.inv/3)%2===0 ? 1 : 0.3) : 1;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.h/2);
            ctx.lineTo(player.x - player.w/2, player.y + player.h/2);
            ctx.lineTo(player.x, player.y + player.h/4);
            ctx.lineTo(player.x + player.w/2, player.y + player.h/2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        init();
        gameLoop();
    </script>
<script src="../i18n.js" defer></script>
</body>
</html>
