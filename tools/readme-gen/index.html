<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>README生成器</title>
<meta name="description" content="README文档生成器，自动生成项目说明文档">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950;--red:#f85149}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;min-height:100vh}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.container{max-width:1000px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.form-panel{display:flex;flex-direction:column;gap:16px}
.form-group{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.form-group h3{font-size:14px;margin-bottom:10px;color:var(--accent)}
.form-label{font-size:12px;color:var(--muted);margin-bottom:4px;display:block}
.form-input{width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;font-family:inherit}
.form-input:focus{border-color:var(--accent)}
textarea.form-input{resize:vertical;min-height:60px;font-family:monospace;font-size:13px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px}
.checkbox-item{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px;transition:all .2s}
.checkbox-item:hover{border-color:var(--accent)}
.checkbox-item.checked{background:var(--accent);border-color:var(--accent);color:#fff}
.checkbox-item input{display:none}
.preview-panel{position:sticky;top:24px}
.preview-box{background:#0d1117;border:1px solid var(--border);border-radius:12px;padding:20px;font-family:monospace;font-size:13px;line-height:1.7;max-height:calc(100vh - 180px);overflow-y:auto;white-space:pre-wrap}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.btn{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;z-index:100}
.toast.show{opacity:1}
@media(max-width:768px){.container{grid-template-columns:1fr}.preview-panel{position:static}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div class="header">
<span style="font-size:28px">📖</span>
<h1>README生成器</h1>
</div>
<div class="container">
<div class="form-panel">
<div class="form-group">
<h2>📋 基本信息</h2>
<label class="form-label">项目名称 *</label>
<input class="form-input" id="projName" placeholder="my-awesome-project" oninput="generate()">
<label class="form-label" style="margin-top:8px">一句话描述</label>
<input class="form-input" id="projDesc" placeholder="一个超棒的项目" oninput="generate()">
<label class="form-label" style="margin-top:8px">版本号</label>
<input class="form-input" id="projVersion" placeholder="v1.0.0" value="v1.0.0" oninput="generate()">
<label class="form-label" style="margin-top:8px">作者</label>
<input class="form-input" id="projAuthor" placeholder="Your Name" oninput="generate()">
</div>
<div class="form-group">
<h2>🔧 项目配置</h2>
<label class="form-label">技术栈</label>
<input class="form-input" id="techStack" placeholder="JavaScript, React, Node.js" oninput="generate()">
<label class="form-label" style="margin-top:8px">许可证</label>
<select class="form-input" id="license" onchange="generate()">
<option value="MIT">MIT</option><option value="Apache-2.0">Apache 2.0</option>
<option value="GPL-3.0">GPL 3.0</option><option value="BSD-3-Clause">BSD 3-Clause</option>
<option value="ISC">ISC</option><option value="Unlicense">Unlicense</option>
<option value="">无</option>
</select>
<label class="form-label" style="margin-top:8px">安装命令</label>
<input class="form-input" id="installCmd" placeholder="npm install" value="npm install" oninput="generate()">
<label class="form-label" style="margin-top:8px">运行命令</label>
<input class="form-input" id="runCmd" placeholder="npm start" value="npm start" oninput="generate()">
</div>
<div class="form-group">
<h2>📦 包含章节</h2>
<div class="checkbox-group" id="sections">
<label class="checkbox-item checked"><input type="checkbox" value="features" checked onchange="generate()">✨ 特性</label>
<label class="checkbox-item checked"><input type="checkbox" value="install" checked onchange="generate()">📥 安装</label>
<label class="checkbox-item checked"><input type="checkbox" value="usage" checked onchange="generate()">🚀 使用</label>
<label class="checkbox-item checked"><input type="checkbox" value="contributing" checked onchange="generate()">🤝 贡献</label>
<label class="checkbox-item checked"><input type="checkbox" value="license" checked onchange="generate()">📄 许可证</label>
<label class="checkbox-item"><input type="checkbox" value="screenshots" onchange="generate()">🖼️ 截图</label>
<label class="checkbox-item"><input type="checkbox" value="roadmap" onchange="generate()">🗺️ 路线图</label>
<label class="checkbox-item"><input type="checkbox" value="faq" onchange="generate()">❓ FAQ</label>
<label class="checkbox-item"><input type="checkbox" value="changelog" onchange="generate()">📝 更新日志</label>
</div>
</div>
<div class="form-group">
<h2>🔗 链接</h2>
<label class="form-label">GitHub仓库</label>
<input class="form-input" id="repoUrl" placeholder="https://github.com/user/repo" oninput="generate()">
<label class="form-label" style="margin-top:8px">演示地址</label>
<input class="form-input" id="demoUrl" placeholder="https://example.com" oninput="generate()">
</div>
</div>
<div class="preview-panel">
<div class="toolbar">
<button class="btn btn-primary" onclick="copyMd()">📋 复制</button>
<button class="btn" onclick="downloadMd()">⬇️ 下载</button>
</div>
<div class="preview-box" id="preview"># my-awesome-project

一个超棒的项目

## ✨ 特性

- Feature 1
- Feature 2
- Feature 3

## 📥 安装

```bash
npm install
```

## 🚀 使用

```bash
npm start
```

## 🤝 贡献

欢迎贡献！请阅读 CONTRIBUTING.md 了解详情。

## 📄 许可证

MIT License
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
document.querySelectorAll('.checkbox-item').forEach(item=>{
item.addEventListener('click',e=>{
if(e.target.tagName==='INPUT')return;
const cb=item.querySelector('input');
cb.checked=!cb.checked;
item.classList.toggle('checked',cb.checked);
generate();
});
});
function generate(){
const name=document.getElementById('projName').value.trim()||'my-project';
const desc=document.getElementById('projDesc').value.trim();
const ver=document.getElementById('projVersion').value.trim();
const author=document.getElementById('projAuthor').value.trim();
const tech=document.getElementById('techStack').value.trim();
const license=document.getElementById('license').value;
const install=document.getElementById('installCmd').value.trim();
const run=document.getElementById('runCmd').value.trim();
const repo=document.getElementById('repoUrl').value.trim();
const demo=document.getElementById('demoUrl').value.trim();
const sections=Array.from(document.querySelectorAll('#sections input:checked')).map(i=>i.value);
let md=`# ${name}\n\n`;
if(desc)md+=`${desc}\n\n`;
if(ver)md+=`**版本**: ${ver}\n\n`;
if(author)md+=`**作者**: ${author}\n\n`;
if(tech)md+=`**技术栈**: ${tech}\n\n`;
if(repo)md+=`[![GitHub](${repo.replace('github.com','raw.githubusercontent.com').replace('/user/repo','/user/repo/main')}/badge.svg)](${repo})\n\n`;
if(demo)md+=`🔗 [在线演示](${demo})\n\n`;
md+=`---\n\n`;
if(sections.includes('features')){
md+=`## ✨ 特性\n\n- Feature 1\n- Feature 2\n- Feature 3\n\n`;
}
if(sections.includes('install')){
md+=`## 📥 安装\n\n\`\`\`bash\n${install}\n\`\`\`\n\n`;
}
if(sections.includes('usage')){
md+=`## 🚀 使用\n\n\`\`\`bash\n${run}\n\`\`\`\n\n`;
if(tech){
const stackList=tech.split(',').map(t=>t.trim());
md+=`### 环境要求\n\n`;
stackList.forEach(s=>{md+=`- ${s}\n`});
md+=`\n`;
}
}
if(sections.includes('screenshots')){
md+=`## 🖼️ 截图\n\n<!-- 截图占位 -->\n\n![Screenshot](screenshot.png)\n\n`;
}
if(sections.includes('roadmap')){
md+=`## 🗺️ 路线图\n\n- [x] 核心功能\n- [ ] 高级功能\n- [ ] 文档完善\n\n`;
}
if(sections.includes('faq')){
md+=`## ❓ FAQ\n\n**Q: 常见问题？**\n\nA: 这是一个答案。\n\n`;
}
if(sections.includes('changelog')){
md+=`## 📝 更新日志\n\n### ${ver||'v1.0.0'}\n\n- 初始发布\n\n`;
}
if(sections.includes('contributing')){
md+=`## 🤝 贡献\n\n欢迎贡献！请阅读 [CONTRIBUTING.md](CONTRIBUTING.md) 了解详情。\n\n`;
}
if(license){
md+=`## 📄 许可证\n\n本项目使用 [${license}](LICENSE) 许可证。\n\n`;
}
if(repo){
md+=`## 🔗 链接\n\n- [GitHub](${repo})\n`;
if(demo)md+=`- [演示](${demo})\n`;
md+=`\n`;
}
document.getElementById('preview').textContent=md.trim();
}
document.querySelectorAll('.checkbox-item.checked input').forEach(cb=>{cb.checked=true;cb.closest('.checkbox-item').classList.add('checked')});
function copyMd(){navigator.clipboard.writeText(document.getElementById('preview').textContent).then(()=>showToast('已复制到剪贴板'))}
function downloadMd(){const b=new Blob([document.getElementById('preview').textContent],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='README.md';a.click()}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
generate();
</script>
<script src="../i18n.js"></script>
</body>
</html>
