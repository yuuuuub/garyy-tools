<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发票生成器</title>
<meta name="description" content="中文发票生成器，快速生成专业发票">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vhscroll-behavior:smooth;padding:16px;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button,textarea{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;width:100%}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
table th,table td{padding:6px 8px;border-bottom:1px solid var(--border)}
table th{color:var(--text2);font-weight:500;background:var(--bg);text-align:left}
table input{width:100%;padding:4px 8px;font-size:.82rem}
table td{vertical-align:middle}
.remove-btn{background:var(--red);color:#fff;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:.75rem}
.invoice-preview{background:#fff;color:#333;padding:30px;border-radius:var(--radius);border:1px solid #ddd}
.invoice-preview h2{text-align:center;margin-bottom:20px;font-size:1.1rem;color:#333}
.invoice-preview .inv-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:.85rem}
.invoice-preview table{margin-top:12px}
.invoice-preview table th{background:#f5f5f5;color:#333;border-bottom:2px solid #333}
.invoice-preview table td{color:#333;padding:8px}
.invoice-preview .total{text-align:right;font-weight:700;font-size:1.1rem;margin-top:12px;color:#333}
.invoice-preview .tax-line{text-align:right;font-size:.9rem;color:#666;margin-top:4px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:640px){.form-row{flex-direction:column}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="发票生成器">
<meta property="og:description" content="中文发票生成器，快速生成专业发票">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/invoice-generator-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🧾 发票生成器</h1>
    <p>生成专业中文发票</p>
  </header>

  <div class="card">
    <div class="section-title">销售方信息</div>
    <div class="form-row">
      <div class="group"><label>公司名称</label><input type="text" id="sellerName" value="示例科技有限公司"></div>
      <div class="group"><label>纳税人识别号</label><input type="text" id="sellerTaxId" value="91110108MA01XXXX"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>地址</label><input type="text" id="sellerAddr" value="北京市海淀区中关村"></div>
      <div class="group"><label>电话</label><input type="text" id="sellerPhone" value="010-12345678"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">购买方信息</div>
    <div class="form-row">
      <div class="group"><label>公司名称</label><input type="text" id="buyerName" value="客户公司名称"></div>
      <div class="group"><label>纳税人识别号</label><input type="text" id="buyerTaxId" value="91310115MA02YYYY"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">发票信息</div>
    <div class="form-row">
      <div class="group"><label>发票号码</label><input type="text" id="invNo" value="No.12345678"></div>
      <div class="group"><label>开票日期</label><input type="date" id="invDate"></div>
      <div class="group"><label>税率 (%)</label>
        <select id="taxRate"><option value="13">13%</option><option value="9">9%</option><option value="6">6%</option><option value="3">3%</option><option value="0">0%</option></select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">发票项目 <button class="btn" style="padding:4px 12px;font-size:.8rem;margin-left:8px" onclick="addItem()">+ 添加</button></div>
    <table id="itemsTable">
      <thead><tr><th style="width:35%">品名</th><th style="width:15%">数量</th><th style="width:20%">单价</th><th style="width:20%">金额</th><th style="width:10%">操作</th></tr></thead>
      <tbody id="itemsBody"></tbody>
    </table>
    <div style="margin-top:8px;font-size:.8rem;color:var(--text2)">小计: <span id="subtotal">¥0.00</span> | 税额: <span id="taxAmt">¥0.00</span> | <b>合计: <span id="totalAmt">¥0.00</span></b></div>
  </div>

  <div class="card">
    <div class="section-title">发票预览</div>
    <div class="invoice-preview" id="preview"></div>
    <div class="btn-group">
      <button class="btn btn-green" onclick="window.print()">🖨️ 打印</button>
      <button class="btn" onclick="copyText()">📋 复制文本</button>
      <button class="btn btn-outline" onclick="downloadJSON()">💾 下载JSON</button>
    </div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});

$('invDate').value=new Date().toISOString().slice(0,10);

let items=[{desc:'软件开发服务',qty:1,price:50000}];

function addItem(){items.push({desc:'',qty:1,price:0});renderItems();}
function removeItem(i){items.splice(i,1);renderItems();}

function renderItems(){
  const rate=+$('taxRate').value/100;
  let subtotal=0;
  items.forEach((item,idx)=>{
    item.qty=+$('qty'+idx).value||0;
    item.price=+$('price'+idx).value||0;
    item.amount=item.qty*item.price;
    subtotal+=item.amount;
  });
  const tax=subtotal*rate;
  const total=subtotal+tax;
  $('subtotal').textContent='¥'+fmt(subtotal);
  $('taxAmt').textContent='¥'+fmt(tax);
  $('totalAmt').textContent='¥'+fmt(total);
  renderPreview(subtotal,tax,total);
}

function renderItems(){
  let html='';
  let subtotal=0;
  items.forEach((item,i)=>{
    const amt=item.qty*item.price;
    subtotal+=amt;
    html+=`<tr>
      <td><input type="text" value="${item.desc}" onchange="updateItem(${i},'desc',this.value)"></td>
      <td><input type="number" value="${item.qty}" min="0" onchange="updateItem(${i},'qty',this.value)"></td>
      <td><input type="number" value="${item.price}" min="0" onchange="updateItem(${i},'price',this.value)"></td>
      <td style="text-align:right;padding:8px">¥${fmt(amt)}</td>
      <td><button class="remove-btn" onclick="removeItem(${i})">删除</button></td>
    </tr>`;
  });
  $('itemsBody').innerHTML=html;
  const rate=+$('taxRate').value/100;
  const tax=subtotal*rate;
  const total=subtotal+tax;
  $('subtotal').textContent='¥'+fmt(subtotal);
  $('taxAmt').textContent='¥'+fmt(tax);
  $('totalAmt').textContent='¥'+fmt(total);
  renderPreview(subtotal,tax,total);
}

window.updateItem=function(i,key,val){
  if(key==='desc')items[i].desc=val;
  else items[i][key]=+val||0;
  renderItems();
};
window.removeItem=function(i){items.splice(i,1);renderItems();};
window.addItem=function(){items.push({desc:'新项目',qty:1,price:0});renderItems();};

function renderPreview(subtotal,tax,total){
  const itemsHtml=items.map((item,i)=>{
    const amt=item.qty*item.price;
    return `<tr><td>${i+1}</td><td>${item.desc}</td><td>${item.qty}</td><td>¥${fmt(item.price)}</td><td style="text-align:right">¥${fmt(amt)}</td></tr>`;
  }).join('');

  $('preview').innerHTML=`
    <h2>增值税普通发票</h2>
    <div class="inv-row"><span>发票号码: ${$('invNo').value}</span><span>开票日期: ${$('invDate').value}</span></div>
    <div class="inv-row"><span>销售方: ${$('sellerName').value}</span><span>税号: ${$('sellerTaxId').value}</span></div>
    <div class="inv-row"><span>购买方: ${$('buyerName').value}</span><span>税号: ${$('buyerTaxId').value}</span></div>
    <table style="width:100%;margin-top:12px;border-collapse:collapse">
      <thead><tr style="background:#f5f5f5"><th style="padding:6px;border-bottom:2px solid #333">#</th><th style="padding:6px;border-bottom:2px solid #333;text-align:left">品名</th><th style="padding:6px;border-bottom:2px solid #333">数量</th><th style="padding:6px;border-bottom:2px solid #333">单价</th><th style="padding:6px;border-bottom:2px solid #333;text-align:right">金额</th></tr></thead>
      <tbody>${itemsHtml}</tbody>
    </table>
    <div class="tax-line">不含税金额: ¥${fmt(subtotal)} | 税率: ${$('taxRate').value}% | 税额: ¥${fmt(tax)}</div>
    <div class="total">价税合计: ¥${fmt(total)}</div>
  `;
}

window.copyText=function(){
  let text=`发票号码: ${$('invNo').value}\n开票日期: ${$('invDate').value}\n\n`;
  text+=`销售方: ${$('sellerName').value}\n税号: ${$('sellerTaxId').value}\n地址: ${$('sellerAddr').value}\n电话: ${$('sellerPhone').value}\n\n`;
  text+=`购买方: ${$('buyerName').value}\n税号: ${$('buyerTaxId').value}\n\n`;
  text+=`序号 | 品名 | 数量 | 单价 | 金额\n`;
  text+=`-----|------|------|------|------\n`;
  let subtotal=0;
  items.forEach((item,i)=>{
    const amt=item.qty*item.price;
    subtotal+=amt;
    text+=`${i+1} | ${item.desc} | ${item.qty} | ¥${fmt(item.price)} | ¥${fmt(amt)}\n`;
  });
  const rate=+$('taxRate').value/100;
  const tax=subtotal*rate;
  text+=`\n不含税金额: ¥${fmt(subtotal)}\n税额: ¥${fmt(tax)}\n价税合计: ¥${fmt(subtotal+tax)}`;
  navigator.clipboard.writeText(text).then(()=>alert('已复制到剪贴板'));
};

window.downloadJSON=function(){
  const rate=+$('taxRate').value/100;
  let subtotal=0;
  items.forEach(item=>{subtotal+=item.qty*item.price;});
  const data={invoiceNo:$('invNo').value,date:$('invDate').value,seller:{name:$('sellerName').value,taxId:$('sellerTaxId').value,address:$('sellerAddr').value,phone:$('sellerPhone').value},buyer:{name:$('buyerName').value,taxId:$('buyerTaxId').value},items:items,taxRate:rate,subtotal,tax:subtotal*rate,total:subtotal*(1+rate)};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='invoice.json';a.click();
};

renderItems();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
