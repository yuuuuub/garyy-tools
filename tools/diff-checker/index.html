<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本对比</title>
<meta name="description" content="文本差异对比 - 对比两段文本的差异">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh}
.container{max-width:1000px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.compare-layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.compare-layout{grid-template-columns:1fr}}
.compare-pane{display:flex;flex-direction:column}
.compare-pane label{font-size:.8rem;color:var(--text2);margin-bottom:6px}
.compare-pane textarea{width:100%;min-height:260px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;color:var(--text);font-family:monospace;font-size:.82rem;resize:vertical;outline:none;line-height:1.6}
.compare-pane textarea:focus{border-color:var(--blue)}
.btn-row{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.btn{padding:8px 20px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.82rem;background:var(--blue);color:#fff;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.green{background:var(--green)}
.btn.gold{background:var(--gold);color:#000}
.btn.red{background:var(--red)}
.result-stats{display:flex;gap:12px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.result-stats .stat{padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:.78rem;color:var(--text2)}
.result-stats .stat strong{margin-left:4px}
.result-stats .stat .added{color:var(--green)}
.result-stats .stat .removed{color:var(--red)}
.result-stats .stat .changed{color:var(--gold)}
.diff-output{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:0;max-height:500px;overflow-y:auto;font-family:monospace;font-size:.82rem;line-height:1.7}
.diff-line{display:flex;padding:2px 12px;border-bottom:1px solid rgba(48,54,61,.3)}
.diff-line:last-child{border-bottom:none}
.diff-line .ln{color:var(--text2);min-width:40px;text-align:right;padding-right:12px;user-select:none;opacity:.6;font-size:.75rem}
.diff-line .content{flex:1;white-space:pre-wrap;word-break:break-all;padding-left:4px}
.diff-line.add{background:rgba(35,134,54,.15)}
.diff-line.add .content{color:var(--green)}
.diff-line.remove{background:rgba(239,68,68,.12)}
.diff-line.remove .content{color:var(--red)}
.diff-line.modify{background:rgba(245,158,11,.12)}
.diff-line.modify .content{color:var(--gold)}
.diff-line.same .content{color:var(--text)}
.empty-state{text-align:center;padding:40px;color:var(--text2);font-size:.85rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="文本对比">
  <meta property="og:description" content="文本差异对比 - 对比两段文本的差异">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/diff-checker/">
</head>
<body>
<div class="container">
<header><h1>文本对比</h1><p>差异比较工具</p></header>
<div class="card">
<div class="compare-layout">
<div class="compare-pane">
<label>原始文本 (A)</label>
<textarea id="text-a" placeholder="输入原始文本...">苹果
香蕉
橙子
葡萄
西瓜
桃子</textarea>
</div>
<div class="compare-pane">
<label>修改文本 (B)</label>
<textarea id="text-b" placeholder="输入修改后的文本...">苹果
香蕉
草莓
葡萄
哈密瓜
桃子
荔枝</textarea>
</div>
</div>
<div class="btn-row">
<button class="btn green" id="diff-btn">对比差异</button>
<button class="btn" id="swap-btn">交换 A/B</button>
<button class="btn red" id="clear-btn">清空</button>
</div>
<div class="result-stats" id="result-stats" style="display:none"></div>
</div>
<div class="card">
<h2 style="font-size:.85rem;color:var(--text2);margin-bottom:8px">对比结果</h2>
<div class="diff-output" id="diff-output">
<div class="empty-state">点击"对比差异"查看结果</div>
</div>
</div>
</div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const textA = $('text-a');
const textB = $('text-b');
const diffOutput = $('diff-output');
const resultStats = $('result-stats');
function computeDiff(linesA, linesB) {
  const n = linesA.length;
  const m = linesB.length;
  const dp = [];
  for(let i=0; i<=n; i++) {
    dp[i] = [];
    for(let j=0; j<=m; j++) {
      dp[i][j] = 0;
    }
  }
  for(let i=1; i<=n; i++) {
    for(let j=1; j<=m; j++) {
      if(linesA[i-1] === linesB[j-1]) {
        dp[i][j] = dp[i-1][j-1] + 1;
      } else {
        dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
      }
    }
  }
  const result = [];
  let i = n, j = m;
  const temp = [];
  while(i > 0 || j > 0) {
    if(i > 0 && j > 0 && linesA[i-1] === linesB[j-1]) {
      temp.push({ type: 'same', text: linesA[i-1], lineA: i, lineB: j });
      i--; j--;
    } else if(j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
      temp.push({ type: 'add', text: linesB[j-1], lineA: '-', lineB: j });
      j--;
    } else if(i > 0) {
      temp.push({ type: 'remove', text: linesA[i-1], lineA: i, lineB: '-' });
      i--;
    }
  }
  for(let k=temp.length-1; k>=0; k--) {
    result.push(temp[k]);
  }
  return result;
}
function runDiff() {
  const linesA = textA.value.split('\n');
  const linesB = textB.value.split('\n');
  if(textA.value === textB.value) {
    diffOutput.innerHTML = '<div style="text-align:center;padding:30px;color:var(--green);font-size:.9rem">两段文本完全相同，无差异</div>';
    resultStats.style.display = 'none';
    return;
  }
  const diff = computeDiff(linesA, linesB);
  let html = '';
  let addCount = 0, removeCount = 0, sameCount = 0;
  diff.forEach(function(d) {
    let cls = 'same';
    let prefix = ' ';
    if(d.type === 'add') { cls = 'add'; prefix = '+'; addCount++; }
    else if(d.type === 'remove') { cls = 'remove'; prefix = '-'; removeCount++; }
    else { sameCount++; }
    const lineNum = d.type === 'add' ? d.lineB : d.lineA;
    html += '<div class="diff-line ' + cls + '">';
    html += '<span class="ln">' + lineNum + '</span>';
    html += '<span class="content">' + escapeHtml(prefix + ' ' + d.text) + '</span>';
    html += '</div>';
  });
  diffOutput.innerHTML = html;
  resultStats.style.display = 'flex';
  resultStats.innerHTML = '' +
    '<span class="stat">总计: <strong>' + diff.length + '</strong> 行</span>' +
    '<span class="stat">相同: <strong class="added">' + sameCount + '</strong></span>' +
    '<span class="stat">新增: <strong class="added">' + addCount + '</strong></span>' +
    '<span class="stat">删除: <strong class="removed">' + removeCount + '</strong></span>';
}
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
$('diff-btn').addEventListener('click', runDiff);
$('swap-btn').addEventListener('click', function() {
  const tmp = textA.value;
  textA.value = textB.value;
  textB.value = tmp;
  runDiff();
});
$('clear-btn').addEventListener('click', function() {
  textA.value = '';
  textB.value = '';
  diffOutput.innerHTML = '<div class="empty-state">清空完毕</div>';
  resultStats.style.display = 'none';
});
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
