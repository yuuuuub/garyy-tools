<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>战术板</title>
<meta property="og:title" content="战术板">
<meta property="og:description" content="战术板 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="战术板 - 可视化战术布置和阵型设计">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--field:#238636;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--field:#2da44e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:700px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
input,select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem}
label{display:block;color:var(--text2);font-size:.85rem;margin-bottom:4px}
.form-group{margin-bottom:12px}
.board-container{position:relative;width:100%;padding-bottom:130%;background:var(--field);border-radius:var(--radius);overflow:hidden;cursor:crosshair;border:2px solid var(--border)}
.board-container canvas{position:absolute;top:0;left:0;width:100%;height:100%}
.player-dot{position:absolute;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff;cursor:grab;transform:translate(-50%,-50%);z-index:10;transition:box-shadow .2s;user-select:none;-webkit-user-select:none}
.player-dot:hover{box-shadow:0 0 12px rgba(255,255,255,.5)}
.player-dot.team-a{background:#3b82f6}
.player-dot.team-b{background:#f85149}
.player-dot.ball{background:#d29922;width:20px;height:20px}
.arrow-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
.empty{text-align:center;color:var(--text2);padding:40px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.player-dot{width:28px;height:28px;font-size:.6rem}}
</style>
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📋 战术板';
const APP=document.getElementById('app');
let players=JSON.parse(localStorage.getItem('sb_players')||'[]');
let arrows=JSON.parse(localStorage.getItem('sb_arrows')||'[]');
let activeTool='move';

function save(){localStorage.setItem('sb_players',JSON.stringify(players));localStorage.setItem('sb_arrows',JSON.stringify(arrows))}

const FORMATIONS={
  '4-4-2':[{x:.5,y:.9},{x:.15,y:.65},{x:.38,y:.7},{x:.62,y:.7},{x:.85,y:.65},{x:.15,y:.4},{x:.38,y:.45},{x:.62,y:.45},{x:.85,y:.4},{x:.35,y:.2},{x:.65,y:.2}],
  '4-3-3':[{x:.5,y:.9},{x:.15,y:.65},{x:.38,y:.7},{x:.62,y:.7},{x:.85,y:.65},{x:.3,y:.45},{x:.5,y:.5},{x:.7,y:.45},{x:.2,y:.2},{x:.5,y:.15},{x:.8,y:.2}],
  '3-5-2':[{x:.5,y:.9},{x:.25,y:.7},{x:.5,y:.72},{x:.75,y:.7},{x:.1,y:.4},{x:.3,y:.45},{x:.5,y:.5},{x:.7,y:.45},{x:.9,y:.4},{x:.35,y:.2},{x:.65,y:.2}],
  '5-3-2':[{x:.5,y:.9},{x:.1,y:.65},{x:.3,y:.68},{x:.5,y:.7},{x:.7,y:.68},{x:.9,y:.65},{x:.3,y:.4},{x:.5,y:.45},{x:.7,y:.4},{x:.35,y:.18},{x:.65,y:.18}]
};

function loadFormation(name){
  const f=FORMATIONS[name];
  players=f.map((p,i)=>({...p,id:Date.now()+i,num:i+1,team:'a',isBall:false}));
  arrows=[];save();render();
}

function render(){
  APP.innerHTML=`
    <h1>📋 战术板</h1>
    <p class="subtitle">可视化战术布置和阵型设计</p>
    <div class="card">
      <div class="flex" style="margin-bottom:12px">
        <select id="formation" style="flex:1">
          ${Object.keys(FORMATIONS).map(n=>`<option value="${n}">${n}</option>`).join('')}
        </select>
        <button class="btn" onclick="loadFormation(document.getElementById('formation').value)">加载阵型</button>
      </div>
      <div class="flex">
        <button class="btn btn-sm" onclick="addPlayerDot('a')" style="background:#3b82f6">+ 蓝队</button>
        <button class="btn btn-sm" onclick="addPlayerDot('b')" style="background:#f85149">+ 红队</button>
        <button class="btn btn-sm" onclick="addBall()">+ 球</button>
        <button class="btn btn-sm btn-danger" onclick="clearBoard()">清空</button>
      </div>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="board-container" id="board">
        <canvas id="arrowCanvas"></canvas>
      </div>
    </div>
    <div class="card">
      <div style="font-size:.85rem;color:var(--text2)">拖拽球员移动位置 | 点击"球"可设置传球路线</div>
      <div class="flex" style="margin-top:8px">
        <button class="btn btn-sm btn-success" onclick="exportBoard()">📷 导出图片</button>
        <button class="btn btn-sm" onclick="arrows=[];save();render()">清除箭头</button>
      </div>
    </div>
  `;
  renderDots();
  renderArrows();
}

function renderDots(){
  const board=document.getElementById('board');
  board.querySelectorAll('.player-dot').forEach(d=>d.remove());
  players.forEach(p=>{
    const dot=document.createElement('div');
    dot.className=`player-dot ${p.isBall?'ball':'team-'+p.team}`;
    dot.textContent=p.isBall?'⚽':p.num;
    dot.style.left=p.x*100+'%';
    dot.style.top=p.y*100+'%';
    dot.addEventListener('pointerdown',e=>startDrag(e,p));
    board.appendChild(dot);
  });
}

let dragging=null;
function startDrag(e,player){
  e.preventDefault();
  dragging=player;
  const onMove=ev=>{
    const board=document.getElementById('board');
    const rect=board.getBoundingClientRect();
    player.x=Math.max(0,Math.min(1,(ev.clientX-rect.left)/rect.width));
    player.y=Math.max(0,Math.min(1,(ev.clientY-rect.top)/rect.height));
    renderDots();
  };
  const onUp=()=>{dragging=null;save();document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp)};
  document.addEventListener('pointermove',onMove);
  document.addEventListener('pointerup',onUp);
}

function renderArrows(){
  const canvas=document.getElementById('arrowCanvas');
  const board=document.getElementById('board');
  canvas.width=board.offsetWidth;
  canvas.height=board.offsetHeight;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  arrows.forEach(a=>{
    const from=players.find(p=>p.id===a.from);
    const to=players.find(p=>p.id===a.to);
    if(!from||!to)return;
    ctx.beginPath();
    ctx.moveTo(from.x*canvas.width,from.y*canvas.height);
    ctx.lineTo(to.x*canvas.width,to.y*canvas.height);
    ctx.strokeStyle='#f0b429';
    ctx.lineWidth=2;
    ctx.setLineDash([6,4]);
    ctx.stroke();
    ctx.setLineDash([]);
    // Arrowhead
    const angle=Math.atan2(to.y-from.y,to.x-from.x);
    const len=12;
    ctx.beginPath();
    ctx.moveTo(to.x*canvas.width,to.y*canvas.height);
    ctx.lineTo(to.x*canvas.width-len*Math.cos(angle-Math.PI/6),to.y*canvas.height-len*Math.sin(angle-Math.PI/6));
    ctx.moveTo(to.x*canvas.width,to.y*canvas.height);
    ctx.lineTo(to.x*canvas.width-len*Math.cos(angle+Math.PI/6),to.y*canvas.height-len*Math.sin(angle+Math.PI/6));
    ctx.stroke();
  });
}

function addPlayerDot(team){
  const num=players.filter(p=>p.team===team&&!p.isBall).length+1;
  players.push({id:Date.now(),x:.5,y:.5,num,team,isBall:false});save();render();
}

function addBall(){
  players.push({id:Date.now(),x:.5,y:.5,num:0,team:'a',isBall:true});save();render();
}

function clearBoard(){players=[];arrows=[];save();render()}

function exportBoard(){
  const board=document.getElementById('board');
  const canvas=document.createElement('canvas');
  canvas.width=board.offsetWidth*2;
  canvas.height=board.offsetHeight*2;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#238636';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='rgba(255,255,255,.3)';
  ctx.lineWidth=2;
  ctx.strokeRect(20,20,canvas.width-40,canvas.height-40);
  ctx.beginPath();ctx.moveTo(canvas.width/2,20);ctx.lineTo(canvas.width/2,canvas.height-20);ctx.stroke();
  ctx.beginPath();ctx.arc(canvas.width/2,canvas.height/2,80,0,Math.PI*2);ctx.stroke();
  players.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x*canvas.width,p.y*canvas.height,p.isBall?16:24,0,Math.PI*2);
    ctx.fillStyle=p.isBall?'#d29922':p.team==='a'?'#3b82f6':'#f85149';
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 16px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p.isBall?'⚽':p.num,p.x*canvas.width,p.y*canvas.height);
  });
  const link=document.createElement('a');
  link.download='tactic-board.png';
  link.href=canvas.toDataURL();link.click();
}

window.addEventListener('resize',()=>{if(players.length>0)renderArrows()});
render();
</script>
</body>
</html>
