<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📔 每日日记</title>
<meta property="og:title" content="📔 每日日记">
<meta property="og:description" content="📔 每日日记 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="每日日记工具，记录心情、事件、感恩，养成每日记录的好习惯">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px}
.ctn{max-width:700px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.li{padding:14px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text)}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}
.empty{text-align:center;padding:40px;color:var(--text2)}
.mood-selector{display:flex;gap:8px;margin-top:8px}.mood-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.3rem;transition:all .2s}.mood-btn.active{border-color:var(--accent);background:rgba(59,130,246,.15);transform:scale(1.15)}
.entry-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .2s}.entry-card:hover{border-color:var(--accent)}
.entry-card .date{font-size:.8rem;color:var(--text2)}.entry-card .mood-icon{font-size:1.5rem;float:right}
.entry-card .preview{font-size:.9rem;margin-top:6px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.cal-day{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.7rem;cursor:pointer;transition:all .2s}.cal-day.has-entry{background:var(--accent);color:var(--text)}.cal-day.today{border:2px solid var(--warn)}.cal-day.empty{background:var(--bg)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📔</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📔 每日日记</h1><p>记录生活，感悟每一天</p></div>

<div class="cd"><h2>📅 <span id="curDate"></span></h2>
<label>今天的心情</label>
<div class="mood-selector" id="moodSel"></div>
<label>今天发生了什么？</label><textarea id="events" rows="3" placeholder="记录今天的重要事件..."></textarea>
<label>今日感悟</label><textarea id="thoughts" rows="3" placeholder="今天有什么想法或感悟？"></textarea>
<label>感恩的事</label><textarea id="grateful" rows="2" placeholder="今天感恩什么？"></textarea>
<label>明天的计划</label><textarea id="plan" rows="2" placeholder="明天想做什么？"></textarea>
<label>关键词（用逗号分隔）</label><input type="text" id="tags" placeholder="如：工作,学习,运动">
<div class="bg"><button onclick="saveEntry()">💾 保存日记</button><button class="sec" onclick="exportEntry()">📄 导出</button></div></div>

<div class="cd"><h2>📊 本月概览</h2><div class="calendar" id="calendar"></div>
<div style="display:flex;gap:16px;margin-top:12px;font-size:.85rem;color:var(--text2)">
<span>本月记录: <strong id="monthCount">0</strong> 天</span>
<span>连续记录: <strong id="streakCount">0</strong> 天</span>
</div></div>

<div class="cd"><h2>📋 历史日记</h2><div id="historyList" class="empty">暂无日记</div></div>
</div>

<div style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;justify-content:center;align-items:center" id="viewModal">
<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:600px;max-height:80vh;overflow-y:auto" id="viewContent"></div>
</div>

<script>
const $=id=>document.getElementById(id);
let entries=JSON.parse(localStorage.getItem('dj_entries')||'[]');
const moods=['😊','😌','😐','😔','😢','😡','🤩','😴','🥰','💪'];
let selectedMood='';
const today=()=>new Date().toISOString().slice(0,10);
const save=()=>localStorage.setItem('dj_entries',JSON.stringify(entries));

function init(){
  $('curDate').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  let moodHtml='';moods.forEach(m=>{
    moodHtml+=`<div class="mood-btn" onclick="selectMood('${m}')">${m}</div>`;
  });$('moodSel').innerHTML=moodHtml;
  loadEntry();renderCalendar();renderHistory();
}

function selectMood(m){
  selectedMood=m;document.querySelectorAll('.mood-btn').forEach(el=>{el.classList.toggle('active',el.textContent===m)});
}

function loadEntry(){
  const e=entries.find(e=>e.date===today());
  if(e){selectedMood=e.mood;selectMood(e.mood);$('events').value=e.events||'';$('thoughts').value=e.thoughts||'';$('grateful').value=e.grateful||'';$('plan').value=e.plan||'';$('tags').value=(e.tags||[]).join(',')}
  else{$('events').value='';$('thoughts').value='';$('grateful').value='';$('plan').value='';$('tags').value=''}
}

function saveEntry(){
  const data={date:today(),mood:selectedMood,events:$('events').value,thoughts:$('thoughts').value,grateful:$('grateful').value,plan:$('plan').value,tags:$('tags').value.split(',').map(t=>t.trim()).filter(Boolean),savedAt:new Date().toISOString()};
  const idx=entries.findIndex(e=>e.date===today());
  if(idx>=0)entries[idx]=data;else entries.push(data);
  save();renderCalendar();renderHistory();alert('保存成功！');
}

function exportEntry(){
  const e=entries.find(e=>e.date===today());if(!e){alert('请先保存日记');return}
  let text=`日记 ${e.date}\n${'='.repeat(30)}\n\n心情: ${e.mood||'未记录'}\n\n事件:\n${e.events||'无'}\n\n感悟:\n${e.thoughts||'无'}\n\n感恩:\n${e.grateful||'无'}\n\n计划:\n${e.plan||'无'}`;
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`日记_${e.date}.txt`;a.click();
}

function renderCalendar(){
  const now=new Date();const year=now.getFullYear();const month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay();const daysInMonth=new Date(year,month+1,0).getDate();
  let html='';for(let i=0;i<firstDay;i++)html+=`<div class="cal-day empty"></div>`;
  let monthCount=0;for(let d=1;d<=daysInMonth;d++){
    const k=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=entries.some(e=>e.date===k);if(has)monthCount++;
    const isToday=k===today();
    html+=`<div class="cal-day ${has?'has-entry':''} ${isToday?'today':''}" onclick="viewEntry('${k}')">${d}</div>`;
  }
  $('calendar').innerHTML=html;$('monthCount').textContent=monthCount;
  let streak=0;const d=new Date();for(let i=0;i<365;i++){
    const k=d.toISOString().slice(0,10);if(entries.some(e=>e.date===k))streak++;else break;d.setDate(d.getDate()-1);
  }$('streakCount').textContent=streak;
}

function renderHistory(){
  const sorted=[...entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
  let html='';sorted.forEach(e=>{
    html+=`<div class="entry-card" onclick="viewEntry('${e.date}')">
      <div class="mood-icon">${e.mood||'📝'}</div>
      <div class="date">${e.date}</div>
      <div class="preview">${e.events||e.thoughts||'无内容'}</div></div>`;
  });$('historyList').innerHTML=html||'<div class="empty">暂无日记</div>';
}

function viewEntry(date){
  const e=entries.find(e=>e.date===date);if(!e){alert('该日无日记');return}
  $('viewContent').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center"><h3>${e.mood||'📝'} ${e.date}</h3>
    <button class="sec" onclick="$('viewModal').style.display='none'" style="padding:4px 8px;font-size:.8rem">✕</button></div>
    <div style="margin-top:16px;font-size:.9rem;line-height:1.8">
    <strong>事件</strong><br>${(e.events||'无').replace(/\n/g,'<br>')}<br><br>
    <strong>感悟</strong><br>${(e.thoughts||'无').replace(/\n/g,'<br>')}<br><br>
    <strong>感恩</strong><br>${(e.grateful||'无').replace(/\n/g,'<br>')}<br><br>
    <strong>计划</strong><br>${(e.plan||'无').replace(/\n/g,'<br>')}
    ${e.tags&&e.tags.length?`<br><br><strong>标签</strong><br>${e.tags.map(t=>`<span class="tag">${t}</span> `).join('')}`:''}
    </div>`;
  $('viewModal').style.display='flex';
}

init();
</script>
</body>
</html>
