<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字动态效果 - 在线汉字动画展示</title>
<meta property="og:title" content="汉字动态效果 - 在线汉字动画展示">
<meta property="og:description" content="汉字动态效果 - 在线汉字动画展示 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="汉字动态效果 - 为汉字添加各种动态动画效果，如弹跳、旋转、闪烁等">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💫</text></svg>">
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --blue: #3b82f6;
  --green: #238636;
  --red: #ef4444;
  --radius: 10px;
  --transition: 0.2s ease;
}
[data-theme="light"] {
  --bg: #f6f8fa;
  --card: #fff;
  --border: #d0d7de;
  --text: #1f2328;
  --text2: #656d76;
  --blue: #0969da;
  --green: #1a7f37;
  --red: #cf222e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  padding: 16px;
}
.container { max-width: 800px; margin: auto; }
h1 { text-align: center; padding: 24px 0 8px; font-size: 1.5rem; }
.sub { text-align: center; color: var(--text2); font-size: .85rem; margin-bottom: 20px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.btn {
  display: inline-block;
  padding: 10px 24px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: .9rem;
  margin-top: 12px;
  transition: var(--transition);
}
.btn:hover { opacity: .85; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.btn-secondary { background: var(--border); color: var(--text); }
.motion-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 250px;
  background: var(--bg);
  border-radius: var(--radius);
  margin: 16px 0;
  position: relative;
  overflow: hidden;
}
.motion-char {
  font-size: 8rem;
  display: inline-block;
  transition: all 0.3s;
}
.effect-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 16px 0;
}
.effect-btn {
  padding: 12px 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: .85rem;
  text-align: center;
  transition: var(--transition);
}
.effect-btn:hover {
  border-color: var(--blue);
  background: var(--card);
}
.effect-btn.active {
  border-color: var(--blue);
  background: rgba(59,130,246,0.1);
}
.char-input {
  width: 100%;
  padding: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 1.2rem;
  text-align: center;
  color: var(--text);
  margin-bottom: 16px;
}
.char-input:focus {
  outline: none;
  border-color: var(--blue);
}
.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 16px 0;
}
.custom-effect {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 16px 0;
}
.custom-effect label {
  font-size: .85rem;
  color: var(--text2);
}
.custom-effect input, .custom-effect select {
  width: 100%;
  padding: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: .85rem;
}
.animation-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}
.animation-tag {
  padding: 4px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: .8rem;
  cursor: pointer;
  transition: var(--transition);
}
.animation-tag:hover {
  border-color: var(--blue);
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-30px); }
}
@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}
@keyframes flip {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(180deg); }
}
@keyframes swing {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(15deg); }
  75% { transform: rotate(-15deg); }
}
@keyframes fadeInOut {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
@keyframes slideIn {
  from { transform: translateX(-100px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes slideInRight {
  from { transform: translateX(100px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes slideInUp {
  from { transform: translateY(100px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes slideInDown {
  from { transform: translateY(-100px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes zoomIn {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes zoomOut {
  from { transform: scale(2); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes rubberBand {
  0% { transform: scaleX(1) scaleY(1); }
  30% { transform: scaleX(1.25) scaleY(0.75); }
  40% { transform: scaleX(0.75) scaleY(1.25); }
  50% { transform: scaleX(1.15) scaleY(0.85); }
  65% { transform: scaleX(0.95) scaleY(1.05); }
  75% { transform: scaleX(1.05) scaleY(0.95); }
  100% { transform: scaleX(1) scaleY(1); }
}
@keyframes jelly {
  0% { transform: scaleX(1) scaleY(1); }
  21% { transform: scaleX(1.25) scaleY(0.75); }
  40% { transform: scaleX(0.75) scaleY(1.25); }
  50% { transform: scaleX(1.15) scaleY(0.85); }
  65% { transform: scaleX(0.95) scaleY(1.05); }
  75% { transform: scaleX(1.05) scaleY(0.95); }
  100% { transform: scaleX(1) scaleY(1); }
}
@keyframes tada {
  0% { transform: scale(1) rotate(0deg); }
  10%, 20% { transform: scale(0.9) rotate(-3deg); }
  30%, 50%, 70%, 90% { transform: scale(1.1) rotate(3deg); }
  40%, 60%, 80% { transform: scale(1.1) rotate(-3deg); }
  100% { transform: scale(1) rotate(0deg); }
}
@keyframes wobble {
  0% { transform: translateX(0); }
  15% { transform: translateX(-25px) rotate(-5deg); }
  30% { transform: translateX(20px) rotate(3deg); }
  45% { transform: translateX(-15px) rotate(-3deg); }
  60% { transform: translateX(10px) rotate(2deg); }
  75% { transform: translateX(-5px) rotate(-1deg); }
  100% { transform: translateX(0); }
}
@keyframes heartBeat {
  0% { transform: scale(1); }
  14% { transform: scale(1.3); }
  28% { transform: scale(1); }
  42% { transform: scale(1.3); }
  70% { transform: scale(1); }
}
@keyframes jackInTheBox {
  0% { transform: scale(0.1) rotate(-30deg); opacity: 0; }
  50% { transform: rotate(10deg); }
  70% { transform: rotate(-10deg); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.effect-bounce { animation: bounce 0.6s infinite; }
.effect-rotate { animation: rotate 2s linear infinite; }
.effect-pulse { animation: pulse 1s infinite; }
.effect-shake { animation: shake 0.5s infinite; }
.effect-flip { animation: flip 1s infinite; }
.effect-swing { animation: swing 1s infinite; }
.effect-fade { animation: fadeInOut 2s infinite; }
.effect-slideIn { animation: slideIn 0.5s; }
.effect-slideInRight { animation: slideInRight 0.5s; }
.effect-slideInUp { animation: slideInUp 0.5s; }
.effect-slideInDown { animation: slideInDown 0.5s; }
.effect-zoomIn { animation: zoomIn 0.5s; }
.effect-zoomOut { animation: zoomOut 0.5s; }
.effect-rubberBand { animation: rubberBand 1s; }
.effect-jelly { animation: jelly 1s; }
.effect-tada { animation: tada 1s; }
.effect-wobble { animation: wobble 1s; }
.effect-heartBeat { animation: heartBeat 1.3s infinite; }
.effect-jackInTheBox { animation: jackInTheBox 0.5s; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
body, .container { animation: fadeIn .4s ease-out; }
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>💫 汉字动态效果</h1>
  <p class="sub">为汉字添加各种动态动画效果</p>

  <div class="card">
    <input type="text" class="char-input" id="charInput" value="龙" maxlength="1" placeholder="输入汉字">
    <div class="btn-group">
      <button class="btn" onclick="applyEffect()">应用效果</button>
      <button class="btn btn-secondary" onclick="clearEffect()">清除效果</button>
      <button class="btn btn-secondary" onclick="randomChar()">随机汉字</button>
      <button class="btn btn-secondary" onclick="toggleTheme()">🌓 切换主题</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">动画效果</h3>
    <div class="effect-grid" id="effectGrid"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">预览</h3>
    <div class="motion-stage">
      <div class="motion-char" id="motionChar">龙</div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">自定义动画</h3>
    <div class="custom-effect">
      <div>
        <label>时长 (秒)</label>
        <input type="number" id="duration" value="1" min="0.1" max="10" step="0.1">
      </div>
      <div>
        <label>延迟 (秒)</label>
        <input type="number" id="delay" value="0" min="0" max="5" step="0.1">
      </div>
      <div>
        <label>重复次数</label>
        <select id="iteration">
          <option value="1">1次</option>
          <option value="2">2次</option>
          <option value="3">3次</option>
          <option value="infinite" selected>无限</option>
        </select>
      </div>
      <div>
        <label>缓动函数</label>
        <select id="easing">
          <option value="ease">ease</option>
          <option value="linear">linear</option>
          <option value="ease-in">ease-in</option>
          <option value="ease-out">ease-out</option>
          <option value="ease-in-out">ease-in-out</option>
        </select>
      </div>
    </div>
    <button class="btn" onclick="applyCustom()">应用自定义</button>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">常用汉字</h3>
    <div class="animation-list" id="commonChars"></div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var effects = [
  {name:'弹跳',id:'bounce'},
  {name:'旋转',id:'rotate'},
  {name:'脉冲',id:'pulse'},
  {name:'抖动',id:'shake'},
  {name:'翻转',id:'flip'},
  {name:'摇摆',id:'swing'},
  {name:'闪烁',id:'fade'},
  {name:'滑入',id:'slideIn'},
  {name:'右滑入',id:'slideInRight'},
  {name:'上滑入',id:'slideInUp'},
  {name:'下滑入',id:'slideInDown'},
  {name:'放大入',id:'zoomIn'},
  {name:'缩小入',id:'zoomOut'},
  {name:'橡皮筋',id:'rubberBand'},
  {name:'果冻',id:'jelly'},
  {name:'嗒嗒',id:'tada'},
  {name:'摇晃',id:'wobble'},
  {name:'心跳',id:'heartBeat'},
  {name:'跳出',id:'jackInTheBox'}
];

var currentEffect = '';
var commonChars = ['龙','凤','福','禄','寿','喜','财','吉','祥','如','意','平','安','康','宁','乐'];

function init() {
  renderEffects();
  renderCommonChars();
  document.getElementById('charInput').addEventListener('input', function() {
    document.getElementById('motionChar').textContent = this.value || '龙';
  });
}

function renderEffects() {
  var html = '';
  effects.forEach(function(e) {
    html += '<div class="effect-btn" onclick="selectEffect(\'' + e.id + '\')">' + e.name + '</div>';
  });
  document.getElementById('effectGrid').innerHTML = html;
}

function renderCommonChars() {
  var html = '';
  commonChars.forEach(function(c) {
    html += '<div class="animation-tag" onclick="setChar(\'' + c + '\')">' + c + '</div>';
  });
  document.getElementById('commonChars').innerHTML = html;
}

function setChar(ch) {
  document.getElementById('charInput').value = ch;
  document.getElementById('motionChar').textContent = ch;
}

function selectEffect(effectId) {
  currentEffect = effectId;
  document.querySelectorAll('.effect-btn').forEach(function(btn, i) {
    btn.classList.toggle('active', effects[i].id === effectId);
  });
}

function applyEffect() {
  var char = document.getElementById('charInput').value || '龙';
  var el = document.getElementById('motionChar');
  el.textContent = char;
  el.className = 'motion-char';
  if(currentEffect) {
    void el.offsetWidth;
    el.classList.add('effect-' + currentEffect);
  }
}

function clearEffect() {
  document.getElementById('motionChar').className = 'motion-char';
}

function randomChar() {
  var chars = '一二三四五六七八九十大小多少上下人口日月水火山石田王马鸟鱼牛羊竹米麦豆车门人木禾本末未天夫太大犬火土干工又寸力刀';
  var ch = chars[Math.floor(Math.random() * chars.length)];
  setChar(ch);
}

function applyCustom() {
  var char = document.getElementById('charInput').value || '龙';
  var duration = document.getElementById('duration').value;
  var delay = document.getElementById('delay').value;
  var iteration = document.getElementById('iteration').value;
  var easing = document.getElementById('easing').value;
  var el = document.getElementById('motionChar');
  el.textContent = char;
  el.style.animation = '';
  void el.offsetWidth;
  if(currentEffect) {
    el.style.animation = 'effect-' + currentEffect + ' ' + duration + 's ' + easing + ' ' + delay + 's ' + iteration;
  }
}

function toggleTheme() {
  var html = document.documentElement;
  var current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
}

init();
</script>
</body>
</html>
