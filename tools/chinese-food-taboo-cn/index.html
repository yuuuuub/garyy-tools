<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国饮食禁忌 - Chinese Food Taboos</title>
<meta name="description" content="中国饮食禁忌大全，节日饮食禁忌、地域饮食禁忌、孕期饮食禁忌、宗教饮食规则">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国饮食禁忌 - Chinese Food Taboos">
<meta property="og:description" content="中国饮食禁忌大全，节日饮食禁忌、地域饮食禁忌、孕期饮食禁忌、宗教饮食规则">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-food-taboo-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚫</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e74c3c;--accent2:#c0392b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#cf222e;--accent2:#a40e26}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a0a 0%,#2a1010 50%,#3a1515 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a2020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e74c3c,#c0392b,#a93226,#922);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.tea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.tea-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.tea-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.tea-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.tea-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tea-card .t-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(231,76,60,0.15);color:var(--accent)}
.tea-card .t-name{font-size:1.3em;font-weight:bold}
.tea-card .t-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.tea-card .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tea-card .t-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.tea-card .t-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.tea-card .t-detail strong{color:var(--text)}
.tea-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.tea-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🚫 中国饮食禁忌</h1>
<p>Chinese Food Taboos — 入乡随俗，食有讲究</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索饮食禁忌...（如"筷子""孕妇""春节"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="节日禁忌">🎊 节日禁忌</button>
<button class="filter-btn" data-filter="日常禁忌">⚠️ 日常禁忌</button>
<button class="filter-btn" data-filter="地域禁忌">🗺️ 地域禁忌</button>
<button class="filter-btn" data-filter="孕期禁忌">🤰 孕期禁忌</button>
<button class="filter-btn" data-filter="宗教饮食">🙏 宗教饮食</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="tea-grid" id="teaGrid"></div>
<footer><p>🚫 中国饮食禁忌 — 入乡随俗，食有讲究</p></footer>
</div>
<script>
const TEA_DATA=[
  {id:1,name:"春节不扫地",en:"No Sweeping on New Year",category:"节日禁忌",icon:"🎊",summary:"春节的饮食讲究",detail:"大年初一不能扫地倒垃圾，认为会扫走财气。不能吃稀饭，认为吃稀饭会穷一年。不能吃药，认为初一吃药会一年体弱。年夜饭必须有鱼（余），但不能吃完。",origin:"民间传统",usage:"春节期间必须遵守的饮食习俗"},
  {id:2,name:"年夜饭留鱼",en:"Leave Fish on New Year's Eve",category:"节日禁忌",icon:"🐟",summary:"年年有余",detail:"年夜饭上的鱼不能吃完，要留一部分到第二天，寓意'年年有余'。鱼头要朝向长辈或贵客，表示尊敬。有些地方吃鱼不能翻身，忌讳'翻船'。",origin:"谐音文化传统",usage:"全国性的春节饮食习俗"},
  {id:3,name:"饺子不全吃",en:"Don't Finish All Dumplings",category:"节日禁忌",icon:"🥟",summary:"除夕饺子讲究",detail:"除夕包饺子有时会在某个饺子里放硬币或红枣，吃到的人有福气。煮饺子如果破了不能说'破了'要说'挣了'。饺子不能摆成一圈，像'受困'。",origin:"北方年俗",usage:"除夕夜的重要饮食仪式"},
  {id:4,name:"筷子禁忌",en:"Chopstick Taboos",category:"日常禁忌",icon:"🥢",summary:"餐桌上的筷子规矩",detail:"不能把筷子插在饭碗里（像上香，祭祀死者用）。不能用筷子敲碗（乞丐行为）。不能用筷子指人（不礼貌）。不能把筷子交叉放（表示否定）。",origin:"传统餐桌礼仪",usage:"日常用餐必须遵守的筷子规矩"},
  {id:5,name:"不翻鱼身",en:"Don't Flip the Fish",category:"日常禁忌",icon:"🐟",summary:"吃鱼不能翻身",detail:"沿海地区和渔民尤其忌讳吃鱼时翻面，因为'翻'与'翻船'谐音，对航海者不吉利。正确的做法是将鱼骨挑出，而不是翻转整条鱼。",origin:"渔民文化",usage:"沿海地区和船上的饮食禁忌"},
  {id:6,name:"不把碗端空",en:"Don't Hold an Empty Bowl",category:"日常禁忌",icon:"🍚",summary:"端碗的规矩",detail:"吃饭时不能把碗端起来吃（只有乞丐才端碗要饭）。应该把碗放在桌上，低头就碗吃。夹菜时不能越过盘子去够远处的菜。",origin:"传统餐桌礼仪",usage:"正式用餐时的基本规矩"},
  {id:7,name:"四川忌说翻",en:"Sichuan: Don't Say 'Flip'",category:"地域禁忌",icon:"🌶️",summary:"四川的饮食讲究",detail:"四川人吃火锅时不能说'翻'（翻滚的意思），因为会联想到翻船。点菜不能点单数，要双数寓意好事成双。鱼不能吃完，同全国传统。",origin:"巴蜀文化",usage:"四川地区用餐的特殊禁忌"},
  {id:8,name:"广东忌食猫",en:"Guangdong: Cat is Taboo",category:"地域禁忌",icon:"🐱",summary:"广东的动物禁忌",detail:"广东部分地区忌食猫肉，认为猫有灵性，吃了会招灾。有些地方也不吃牛肉，因为牛是勤劳的象征。潮汕地区吃鱼头要留给家里最年长的人。",origin:"岭南文化",usage:"广东地区的特殊饮食禁忌"},
  {id:9,name:"回族清真饮食",en:"Halal Dietary Rules",category:"宗教饮食",icon:"☪️",summary:"伊斯兰教饮食规范",detail:"回族信仰伊斯兰教，严格遵守清真饮食。不吃猪肉及其制品，不饮酒，不吃自死物和血液。宰牲必须按伊斯兰教规进行，念'奉真主之名'。",origin:"伊斯兰教义",usage:"回族穆斯林的饮食铁律"},
  {id:10,name:"佛教素食",en:"Buddhist Vegetarian Diet",category:"宗教饮食",icon:"🙏",summary:"佛门饮食戒律",detail:"佛教徒持素食，不吃荤腥。'荤'指五辛（葱、蒜、韭、薤、兴渠），'腥'指肉类。初一十五吃素是信佛者的常见做法。寺院斋饭讲究'过午不食'。",origin:"佛教戒律",usage:"佛教徒和寺院的饮食规范"},
  {id:11,name:"道教饮食",en:"Taoist Dietary Rules",category:"宗教饮食",icon:"☯️",summary:"道家养生饮食",detail:"道教讲究'辟谷'和养生饮食。不吃牛肉（牛有功德），不吃大雁（忠贞的象征）。道教全真派持素食，正一派可以吃荤但忌五荤。注重时令饮食。",origin:"道教养生传统",usage:"道教修行者的饮食规范"},
  {id:12,name:"孕期忌食蟹",en:"Pregnancy: Avoid Crab",category:"孕期禁忌",icon:"🤰",summary:"孕期饮食注意",detail:"传统认为孕妇不能吃螃蟹，因为螃蟹是横着走的，可能导致胎儿横位。不能吃兔肉，怕胎儿兔唇。不能吃薏米，认为有滑胎作用。现代医学认为部分确需注意。",origin:"民间经验",usage:"孕妇饮食的传统禁忌参考"},
  {id:13,name:"孕期忌生冷",en:"Pregnancy: Avoid Raw Cold Food",category:"孕期禁忌",icon:"🧊",summary:"孕期食物温度",detail:"传统认为孕妇不能吃生冷食物，会伤及胎儿。不能吃太多水果（太凉），不能喝冰水。要多吃温热的食物如鸡汤、红枣。这一禁忌在现代仍有广泛影响。",origin:"中医养生理念",usage:"孕期饮食保养的传统智慧"},
  {id:14,name:"病人忌发物",en:"Sick: Avoid 'Trigger Foods'",category:"日常禁忌",icon:"🏥",summary:"中医发物概念",detail:"中医认为某些食物是'发物'，会诱发或加重疾病。如海鲜是发物（过敏），公鸡是发物（动风），韭菜是发物（助火）。生病期间要忌口发物。",origin:"中医理论",usage:"疾病期间的饮食禁忌原则"},
  {id:15,name:"丧事忌荤",en:"Funeral: Avoid Meat",category:"节日禁忌",icon:"⚫",summary:"丧事饮食规矩",detail:"家中有人去世后，丧期内要吃素或清淡饮食，不办酒席不请客。头七、五七、百日等时间节点有特定的饮食规矩。服丧期间不参加他人宴席。",origin:"传统丧葬礼仪",usage:"丧事期间的饮食与社交禁忌"},
  {id:16,name:"结婚忌送伞",en:"Wedding: Don't Give Umbrellas",category:"节日禁忌",icon:"☂️",summary:"婚宴饮食禁忌",detail:"婚礼宴席上不能有梨（'梨'谐音'离'），汤圆不能是单数。喜宴菜品数量要双数。新郎新娘不能吃同一道菜的最后一块。婚宴后要打包剩余食物。",origin:"谐音文化",usage:"婚礼宴席的饮食禁忌"},
  {id:17,name:"生日面不切断",en:"Birthday: Don't Cut Noodles",category:"节日禁忌",icon:"🍜",summary:"寿面的讲究",detail:"过生日吃长寿面，面条不能切断，一根面要一口气吃完，寓意长命百岁。不能把面条从中间咬断。面条要整碗端起吃完，不能剩下。",origin:"传统寿诞习俗",usage:"生日宴席的核心饮食仪式"},
  {id:18,name:"中元节不乱吃",en:"Ghost Festival: Careful Eating",category:"节日禁忌",icon:"👻",summary:"鬼节饮食注意",detail:"农历七月十五中元节（鬼节），晚上不宜外出吃东西。不在路边捡食物。不把食物放在门口或窗台。有些地方中元节不吃鸭子，因为'鸭'谐音'压'。",origin:"民间信仰",usage:"中元节期间的饮食安全禁忌"},
  {id:19,name:"藏族饮食禁忌",en:"Tibetan Dietary Taboos",category:"地域禁忌",icon:"🏔️",summary:"藏区饮食规矩",detail:"藏族不吃驴肉和马肉，因为这些是交通工具。吃肉时不能刀尖对着人。主人倒酥油茶不能一次喝完，要留一点在碗里表示礼貌。鱼在部分地区也不吃。",origin:"藏族传统",usage:"藏区做客时的饮食注意事项"},
  {id:20,name:"满族禁食狗肉",en:"Manchu: Don't Eat Dog Meat",category:"地域禁忌",icon:"🐕",summary:"满族的动物禁忌",detail:"满族严禁食用狗肉，因为传说狗救过满族祖先的命。也不吃乌鸦肉，乌鸦在满族神话中有重要地位。这些禁忌在东北满族聚居区至今遵守。",origin:"满族神话传说",usage:"满族和东北地区的饮食禁忌"},
  {id:21,name:"孩子忌吃鸡爪",en:"Children: Avoid Chicken Feet",category:"日常禁忌",icon:"🐤",summary:"儿童饮食禁忌",detail:"传统认为小孩子不能吃鸡爪，吃了写字手会抖。不能吃鱼籽，吃了会变笨。不能吃猪脑，吃了会胆小。这些禁忌多出于对孩子的保护心理。",origin:"民间育儿经验",usage:"儿童饮食的传统禁忌"}
];
function renderCards(data){
  document.getElementById('teaGrid').innerHTML=data.map(t=>`
    <div class="tea-card" data-category="${t.category}">
      <div class="t-header"><div class="t-icon">${t.icon}</div><div><div class="t-name">${t.name}</div><div class="t-sub">${t.en}</div></div></div>
      <div class="t-meta"><span>${t.summary}</span><span>${t.category}</span></div>
      <div class="t-detail">${t.detail}</div>
      <div class="t-detail"><strong>来源：</strong>${t.origin}</div>
      <div class="t-detail"><strong>场景：</strong>${t.usage}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(t=>{cats[t.category]=(cats[t.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">饮食禁忌</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(TEA_DATA);renderStats(TEA_DATA);
</script>
</body>
</html>
