<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>折线图生成器 - Line Chart Generator</title>
<meta property="og:title" content="折线图生成器 - Line Chart Generator">
<meta property="og:description" content="折线图生成器 - Line Chart Generator - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线折线图生成器，支持多数据系列、自定义颜色，快速生成趋势图">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polyline points='2,28 8,18 14,22 20,10 28,6' fill='none' stroke='%23e94560' stroke-width='3' stroke-linecap='round'/><circle cx='8' cy='18' r='2' fill='%23e94560'/><circle cx='14' cy='22' r='2' fill='%23e94560'/><circle cx='20' cy='10' r='2' fill='%23e94560'/><circle cx='28' cy='6' r='2' fill='%23e94560'/></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--text:#e0e0e0;--text2:#a0a0b0;--accent:#e94560;--accent2:#533483;--border:#2a2a4a;--shadow:0 4px 24px rgba(0,0,0,.4);--radius:10px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--surface:#fff;--surface2:#f0f3f6;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#8250df;--border:#d0d7de}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vhpadding:16px;}
h1{font-size:20px;font-weight:700;color:var(--accent);padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.container{display:flex;height:calc(100vh - 56px)}
.sidebar{width:340px;background:var(--surface);border-right:1px solid var(--border);padding:16px;overflow-y:auto;flex-shrink:0}
.main{flex:1;padding:16px;overflow:auto;display:flex;align-items:center;justify-content:center}
label{display:block;font-size:13px;color:var(--text2);margin:8px 0 4px}
input,textarea,select{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:13px;font-family:monospace}
textarea{resize:vertical;min-height:100px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;width:100%;margin-top:12px;transition:var(--transition)}
.btn:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);margin-top:8px}
.btn-outline:hover{background:var(--surface2)}
.chart-wrap{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;width:700px;height:460px}
canvas{max-width:100%;max-height:100%}
.toggle-theme{position:fixed;top:16px;right:16px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;z-index:200}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<h1>📈 折线图生成器 Line Chart Generator</h1>
<button class="toggle-theme" onclick="toggleTheme()">🌙 / ☀️</button>
<div class="container">
<div class="sidebar">
<label>图表标题</label>
<input id="title" value="年度趋势分析" placeholder="输入标题">
<label>X轴标签（逗号分隔）</label>
<input id="xLabels" value="1月,2月,3月,4月,5月,6月">
<label>数据系列（每行：名称,值1,值2,...）</label>
<textarea id="data" rows="6">销售,120,200,150,280,220,310
利润,80,140,110,200,180,260</textarea>
<label>线条颜色</label>
<select id="colorScheme">
<option value="auto">自动配色</option>
<option value="warm">暖色系</option>
<option value="cool">冷色系</option>
</select>
<label>线条宽度</label>
<input id="lineWidth" type="range" min="1" max="5" value="2">
<label>显示数据点</label>
<select id="showDots"><option value="yes">显示</option><option value="no">隐藏</option></select>
<label>填充区域</label>
<select id="fillArea"><option value="no">不填充</option><option value="yes">填充</option></select>
<button class="btn" onclick="drawChart()">生成图表</button>
<button class="btn btn-outline" onclick="exportPNG()">导出 PNG</button>
</div>
<div class="main"><div class="chart-wrap"><canvas id="canvas"></canvas></div></div>
</div>
<script>
const colors={auto:['#e94560','#0969da','#1a7f37','#f5a623','#8250df','#cf222e'],warm:['#e94560','#f5a623','#cf222e','#ea6045'],cool:['#0969da','#533483','#1f6feb','#8250df']};
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'}
function parseData(){
const xLabels=document.getElementById('xLabels').value.split(',').map(s=>s.trim());
const series=document.getElementById('data').value.trim().split('\n').filter(Boolean).map(line=>{
const parts=line.split(/[,，]/);
return{name:parts[0].trim(),values:parts.slice(1).map(Number)};
});
return{xLabels,series};
}
function drawChart(){
const cv=document.getElementById('canvas'),ctx=cv.getContext('2d');
const wrap=cv.parentElement;
cv.width=wrap.clientWidth*2;cv.height=wrap.clientHeight*2;ctx.scale(2,2);
const W=wrap.clientWidth,H=wrap.clientHeight;
const{xLabels,series}=parseData();if(!series.length)return;
const pal=colors[document.getElementById('colorScheme').value];
const lw=+document.getElementById('lineWidth').value;
const showDots=document.getElementById('showDots').value==='yes';
const fillArea=document.getElementById('fillArea').value==='yes';
const allVals=series.flatMap(s=>s.values);
const maxV=Math.max(...allVals,1),minV=Math.min(0,Math.min(...allVals));
const pad={top:50,right:30,bottom:50,left:55};
const cW=W-pad.left-pad.right,cH=H-pad.top-pad.bottom;
ctx.clearRect(0,0,W,H);
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--surface').trim()||'#16213e';
ctx.fillRect(0,0,W,H);
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
ctx.font='bold 15px -apple-system,sans-serif';ctx.textAlign='center';
ctx.fillText(document.getElementById('title').value,W/2,28);
for(let i=0;i<=4;i++){
const y=pad.top+cH-cH*(i/4);
ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(W-pad.right,y);ctx.stroke();
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text2').trim();
ctx.font='11px sans-serif';ctx.textAlign='right';
ctx.fillText(Math.round(minV+(maxV-minV)*i/4),pad.left-8,y+4);
}
const n=xLabels.length;
xLabels.forEach((l,i)=>{
const x=pad.left+i*(cW/(n-1||1));
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text2').trim();
ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(l,x,H-pad.bottom+20);
});
series.forEach((s,si)=>{
const color=pal[si%pal.length];
const pts=s.values.map((v,i)=>({
x:pad.left+i*(cW/(n-1||1)),
y:pad.top+cH-cH*((v-minV)/(maxV-minV||1))
}));
if(fillArea){
ctx.beginPath();ctx.moveTo(pts[0].x,pad.top+cH);
pts.forEach(p=>ctx.lineTo(p.x,p.y));
ctx.lineTo(pts[pts.length-1].x,pad.top+cH);ctx.closePath();
ctx.fillStyle=color+'20';ctx.fill();
}
ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
if(showDots)pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--surface').trim();ctx.lineWidth=2;ctx.stroke()});
});
let ly=pad.top;
series.forEach((s,si)=>{
const color=pal[si%pal.length];
ctx.fillStyle=color;ctx.fillRect(W-pad.right-90,ly,12,12);
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text2').trim();
ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText(s.name,W-pad.right-74,ly+10);ly+=18;
});
}
function exportPNG(){const cv=document.getElementById('canvas');const a=document.createElement('a');a.download='line-chart.png';a.href=cv.toDataURL('image/png');a.click()}
drawChart();window.addEventListener('resize',drawChart);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
</body>
</html>
