<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字互动学习</title><meta name="description" content="汉字互动学习 - 点击汉字查看拼音、部首、笔顺等互动信息"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#f59e0b;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin:4px}.btn:hover{opacity:.85}.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;margin-top:12px}.char-cell{padding:16px 8px;background:var(--bg);border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:var(--transition)}.char-cell:hover{border-color:var(--blue);transform:scale(1.08)}.char-cell.active{border-color:var(--blue);background:rgba(59,130,246,.1)}.char-cell .big{font-size:2.2rem;font-weight:700}.char-cell .sm{font-size:.75rem;color:var(--text2);margin-top:4px}.detail-panel{margin-top:16px;animation:fadeIn .3s}.detail-top{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}.detail-char{font-size:6rem;font-weight:700;line-height:1;text-align:center;min-width:100px}.detail-info{flex:1;min-width:200px}.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem}.detail-row .label{color:var(--text2)}.stroke-box{width:200px;height:200px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin:16px auto;position:relative;overflow:hidden}.stroke-box canvas{display:block}.related{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.related-chip{padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.9rem}.related-chip:hover{border-color:var(--blue)}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style><meta property="og:title" content="汉字互动学习"><meta property="og:description" content="汉字互动学习 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎯 汉字互动学习</h1><p class="sub">点击任意汉字查看详细信息</p>
<div class="card">
<div class="input-group"><label>搜索汉字</label><input type="text" id="searchInput" placeholder="输入汉字搜索..." oninput="filterChars()"></div>
</div>
<div class="char-grid" id="charGrid"></div>
<div id="detailPanel"></div></div>
<script src="../i18n.js" defer></script>
<script>
var selectedChar=null;
var chars=[
{c:'龙',p:'lóng',r:'龙',s:5,st:'独体',m:'传说中的神兽，象征权力和尊贵',t:'lóng',gr:'一级',freq:'常用'},
{c:'凤',p:'fèng',r:'几',s:4,st:'半包围',m:'传说中的神鸟，百鸟之王',t:'fèng',gr:'一级',freq:'常用'},
{c:'虎',p:'hǔ',r:'虍',s:8,st:'半包围',m:'猛兽之王，象征勇猛',t:'hǔ',gr:'一级',freq:'常用'},
{c:'福',p:'fú',r:'礻',s:15,st:'左右',m:'幸福、福气、好运',t:'fú',gr:'一级',freq:'常用'},
{c:'喜',p:'xǐ',r:'口',s:12,st:'上下',m:'快乐、高兴、喜庆',t:'xǐ',gr:'一级',freq:'常用'},
{c:'安',p:'ān',r:'宀',s:6,st:'上下',m:'平安、安定、安宁',t:'ān',gr:'一级',freq:'常用'},
{c:'康',p:'kāng',r:'广',s:11,st:'半包围',m:'健康、康复、安康',t:'kāng',gr:'一级',freq:'常用'},
{c:'富',p:'fù',r:'宀',s:12,st:'上下',m:'富裕、丰富、富贵',t:'fù',gr:'一级',freq:'常用'},
{c:'贵',p:'guì',r:'贝',s:9,st:'上下',m:'珍贵、高贵、宝贵',t:'guì',gr:'一级',freq:'常用'},
{c:'祥',p:'xiáng',r:'礻',s:10,st:'左右',m:'吉祥、祥瑞、祥和',t:'xiáng',gr:'一级',freq:'常用'},
{c:'和',p:'hé',r:'口',s:8,st:'左右',m:'和平、和谐、和睦',t:'hé',gr:'一级',freq:'常用'},
{c:'明',p:'míng',r:'日',s:8,st:'左右',m:'明亮、明白、聪明',t:'míng',gr:'一级',freq:'常用'},
{c:'山',p:'shān',r:'山',s:3,st:'独体',m:'高山、山脉、山峰',t:'shān',gr:'一级',freq:'常用'},
{c:'水',p:'shuǐ',r:'水',s:4,st:'独体',m:'流水、水源、泉水',t:'shuǐ',gr:'一级',freq:'常用'},
{c:'火',p:'huǒ',r:'火',s:4,st:'独体',m:'火焰、火光、热情',t:'huǒ',gr:'一级',freq:'常用'},
{c:'木',p:'mù',r:'木',s:4,st:'独体',m:'树木、木材、森林',t:'mù',gr:'一级',freq:'常用'},
{c:'花',p:'huā',r:'艹',s:7,st:'上下',m:'花朵、花卉、花园',t:'huā',gr:'一级',freq:'常用'},
{c:'春',p:'chūn',r:'日',s:9,st:'上下',m:'春天、春季、春风',t:'chūn',gr:'一级',freq:'常用'},
{c:'风',p:'fēng',r:'风',s:4,st:'半包围',m:'风力、风向、风景',t:'fēng',gr:'一级',freq:'常用'},
{c:'雨',p:'yǔ',r:'雨',s:8,st:'独体',m:'雨水、下雨、雨天',t:'yǔ',gr:'一级',freq:'常用'},
{c:'天',p:'tiān',r:'大',s:4,st:'独体',m:'天空、天气、天堂',t:'tiān',gr:'一级',freq:'常用'},
{c:'地',p:'dì',r:'土',s:6,st:'左右',m:'地面、大地、地方',t:'dì',gr:'一级',freq:'常用'},
{c:'人',p:'rén',r:'人',s:2,st:'独体',m:'人物、人民、人生',t:'rén',gr:'一级',freq:'常用'},
{c:'大',p:'dà',r:'大',s:3,st:'独体',m:'大小、巨大、伟大',t:'dà',gr:'一级',freq:'常用'},
{c:'小',p:'xiǎo',r:'小',s:3,st:'独体',m:'微小、细小、小心',t:'xiǎo',gr:'一级',freq:'常用'},
{c:'国',p:'guó',r:'囗',s:8,st:'全包围',m:'国家、国度、中国',t:'guó',gr:'一级',freq:'常用'},
{c:'家',p:'jiā',r:'宀',s:10,st:'上下',m:'家庭、家园、家人',t:'jiā',gr:'一级',freq:'常用'},
{c:'学',p:'xué',r:'子',s:8,st:'上下',m:'学习、学校、学问',t:'xué',gr:'一级',freq:'常用'},
{c:'文',p:'wén',r:'文',s:4,st:'独体',m:'文字、文化、文章',t:'wén',gr:'一级',freq:'常用'},
{c:'心',p:'xīn',r:'心',s:4,st:'独体',m:'心情、内心、心意',t:'xīn',gr:'一级',freq:'常用'},
{c:'光',p:'guāng',r:'儿',s:6,st:'上下',m:'光芒、光明、阳光',t:'guāng',gr:'一级',freq:'常用'},
{c:'美',p:'měi',r:'大',s:9,st:'上下',m:'美丽、美好、完美',t:'měi',gr:'一级',freq:'常用'},
{c:'好',p:'hǎo',r:'女',s:6,st:'左右',m:'好坏、美好、友好',t:'hǎo',gr:'一级',freq:'常用'},
{c:'古',p:'gǔ',r:'口',s:5,st:'上下',m:'古代、古老、古人',t:'gǔ',gr:'一级',freq:'常用'},
{c:'新',p:'xīn',r:'斤',s:13,st:'左右',m:'新旧、新鲜、新年',t:'xīn',gr:'一级',freq:'常用'}
];
function renderGrid(filter){
var html='';chars.forEach(function(ch){
if(filter&&ch.c.indexOf(filter)<0&&ch.p.indexOf(filter)<0)return;
var cls=selectedChar===ch.c?'char-cell active':'char-cell';
html+='<div class="'+cls+'" onclick="selectChar(\''+ch.c+'\')"><div class="big">'+ch.c+'</div><div class="sm">'+ch.p+'</div></div>';});
document.getElementById('charGrid').innerHTML=html;}
function filterChars(){renderGrid(document.getElementById('searchInput').value.trim());}
function selectChar(c){
selectedChar=c;renderGrid(document.getElementById('searchInput').value.trim());
var ch=chars.find(function(x){return x.c===c});if(!ch)return;
var related=chars.filter(function(x){return x.r===ch.r&&x.c!==ch.c}).slice(0,6);
var html='<div class="card detail-panel"><div class="detail-top"><div class="detail-char">'+ch.c+'</div><div class="detail-info">';
var rows=[['拼音',ch.p],['声调',ch.t],['部首',ch.r],['笔画',ch.s+'画'],['结构',ch.st],['等级',ch.gr],['频率',ch.freq]];
rows.forEach(function(r){html+='<div class="detail-row"><span class="label">'+r[0]+'</span><span>'+r[1]+'</span></div>';});
html+='</div></div>';
html+='<div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:.85rem;color:var(--text2);margin-bottom:4px">释义</div><div>'+ch.m+'</div></div>';
if(related.length){html+='<div style="margin-top:12px"><div style="font-size:.85rem;color:var(--text2);margin-bottom:6px">同部首汉字</div><div class="related">';
related.forEach(function(r){html+='<span class="related-chip" onclick="selectChar(\''+r.c+'\')">'+r.c+' '+r.p+'</span>';});
html+='</div></div>';}
html+='<div style="margin-top:16px;text-align:center"><button class="btn" onclick="speak(\''+ch.c+'\')">🔊 发音</button></div>';
html+='</div>';document.getElementById('detailPanel').innerHTML=html;}
function speak(c){if('speechSynthesis' in window){var u=new SpeechSynthesisUtterance(c);u.lang='zh-CN';speechSynthesis.speak(u);}}
renderGrid('');
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
