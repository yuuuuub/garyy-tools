<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邮箱验证器</title><meta name="description" content="邮箱验证器 - 在线验证邮箱地址格式"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.validation-result{margin-top:12px;padding:12px;border-radius:8px;font-size:.9rem}.valid{background:rgba(35,134,54,.15);color:var(--green);border:1px solid var(--green)}.invalid{background:rgba(239,68,68,.15);color:var(--red);border:1px solid var(--red)}.email-parts{margin-top:12px;padding:12px;background:var(--bg);border-radius:8px}.email-part{margin:4px 0;font-size:.85rem}.email-part strong{color:var(--blue);min-width:80px;display:inline-block}</style><meta property="og:title" content="邮箱验证器"><meta property="og:description" content="邮箱验证器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"></head><body>
<div class="container"><h1>📧 邮箱验证器</h1><p class="sub">在线验证邮箱地址格式</p>
<div class="card">
<div class="input-group">
<label>输入邮箱地址</label>
<input type="text" id="emailInput" placeholder="example@domain.com" oninput="validateEmail()">
</div>
<button class="btn" onclick="validateEmail()">验证</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function validateEmail(){
  var email=document.getElementById('emailInput').value.trim();
  var r=document.getElementById('result');
  if(!email){r.innerHTML='';return;}
  var result=checkEmail(email);
  var html='<div class="card">';
  html+='<div class="validation-result '+(result.valid?'valid':'invalid')+'">';
  html+=(result.valid?'✅ 有效的邮箱地址':'❌ 无效的邮箱地址');
  html+='</div>';
  if(result.valid){
    html+='<div class="email-parts">';
    html+='<div class="email-part"><strong>本地部分:</strong> '+escapeHtml(result.local)+'</div>';
    html+='<div class="email-part"><strong>域名:</strong> '+escapeHtml(result.domain)+'</div>';
    html+='<div class="email-part"><strong>域名类型:</strong> '+escapeHtml(result.domainType)+'</div>';
    if(result.warnings.length>0){
      html+='<div class="email-part"><strong>注意事项:</strong></div>';
      result.warnings.forEach(function(w){html+='<div class="email-part" style="color:var(--yellow)">⚠️ '+w+'</div>';});
    }
  }else{
    html+='<div class="email-parts">';
    html+='<div class="email-part"><strong>错误原因:</strong> '+escapeHtml(result.error)+'</div>';
    if(result.suggestion){
      html+='<div class="email-part"><strong>建议:</strong> '+escapeHtml(result.suggestion)+'</div>';
    }
    html+='</div>';
  }
  html+='</div>';
  r.innerHTML=html;
}
function checkEmail(email){
  var result={valid:false,warnings:[]};
  if(!email){result.error='邮箱地址为空';return result;}
  if(email.length>254){result.error='邮箱地址过长（超过254个字符）';return result;}
  var atIndex=email.indexOf('@');
  if(atIndex===-1){result.error='缺少@符号';return result;}
  var lastAtIndex=email.lastIndexOf('@');
  if(atIndex!==lastAtIndex){result.error='包含多个@符号';return result;}
  var local=email.substring(0,atIndex);
  var domain=email.substring(atIndex+1);
  if(local.length===0){result.error='本地部分为空';return result;}
  if(local.length>64){result.error='本地部分过长（超过64个字符）';return result;}
  if(domain.length===0){result.error='域名为空';return result;}
  if(domain.length>253){result.error='域名过长（超过253个字符）';return result;}
  var localRegex=/^[a-zA-Z0-9.!#$%&'*+\/=?^_`{|}~-]+$/;
  if(!localRegex.test(local)){result.error='本地部分包含无效字符';return result;}
  var domainRegex=/^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*$/;
  if(!domainRegex.test(domain)){result.error='域名格式无效';return result;}
  var domainParts=domain.split('.');
  if(domainParts.length<2){result.error='域名至少需要两部分';return result;}
  var tld=domainParts[domainParts.length-1].toLowerCase();
  var commonTlds=['com','net','org','edu','gov','mil','int','cn','uk','de','fr','jp','ru','au','ca','br','in','nl','se','no','dk','fi','at','ch','be','ie','nz','za','mx','ar','cl','co','ve','pe','ec','bo','py','uy','cr','pa','gt','hn','sv','ni','cu','do','pr','jm','tt','bs','bb','ag','lc','vc','dm','gd','kn','ms','ai','vg','ky','tc','bm','aw','cw','sx','bq','mf','bl','gp','mq','gf','sr','gy','fk','gs','sh','ac','ta','io','cc','cx','nf','hm','pn','tk','nu','io','me','tv','cc','ws','to','fj','pg','sb','vu','nr','ki','mh','fm','pw','la','mm','kh','la','vn','th','my','sg','id','ph','bn','tl','mn','kg','tj','uz','kz','tm','af','pk','bd','lk','np','bt','mv','io'];
  if(commonTlds.indexOf(tld)===-1){
    result.warnings.push('域名后缀 "'+tld+'" 不是常见的顶级域名');
  }
  if(local.indexOf('..')!==-1){result.error='本地部分包含连续的点号';return result;}
  if(local.startsWith('.')||local.endsWith('.')){result.error='本地部分不能以点号开头或结尾';return result;}
  if(domain.startsWith('-')||domain.endsWith('-')){result.error='域名不能以连字符开头或结尾';return result;}
  result.valid=true;
  result.local=local;
  result.domain=domain;
  result.domainType=tld.length<=3?'国家/地区顶级域名(gTLD)':'通用顶级域名(ccTLD)';
  return result;
}
function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
validateEmail();
</script></body></html>
