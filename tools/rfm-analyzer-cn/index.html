<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💎 RFM分析器</title>
<meta property="og:title" content="💎 RFM分析器">
<meta property="og:description" content="💎 RFM分析器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="RFM客户价值分析工具，基于最近购买、频率、金额三维度细分客户群体">
<meta name="robots" content="index, follow">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:20px}
.container{max-width:1100px;margin:0 auto}
h1{color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
label{display:block;font-weight:600;margin-bottom:4px;font-size:13px;color:var(--text2)}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
textarea{resize:vertical;min-height:80px;font-family:monospace;font-size:12px}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-orange{background:var(--orange)}
.theme-toggle{position:fixed;top:20px;right:20px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:6px;cursor:pointer;z-index:100}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-box{text-align:center;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.stat-box .num{font-size:22px;font-weight:700;color:var(--blue)}
.stat-box .label{font-size:11px;color:var(--text2);margin-top:4px}
.rfm-matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.rfm-cell{padding:12px;border-radius:8px;text-align:center;cursor:pointer;transition:transform .2s}
.rfm-cell:hover{transform:scale(1.03)}
.rfm-cell .count{font-size:24px;font-weight:700}
.rfm-cell .name{font-size:12px;margin-top:4px}
.rfm-cell .pct{font-size:11px;opacity:.8}
.table-wrap{overflow-x:auto;max-height:400px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{font-weight:600;color:var(--text2);font-size:12px;position:sticky;top:0;background:var(--card)}
.score-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.score-high{background:rgba(26,127,55,.15);color:var(--green)}
.score-mid{background:rgba(188,76,0,.15);color:var(--orange)}
.score-low{background:rgba(207,34,46,.15);color:var(--red)}
.bar-h{display:flex;align-items:center;gap:6px;font-size:12px}
.bar-h .bg{width:60px;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.bar-h .fill{height:100%;border-radius:4px}
.insight-box{padding:12px;border-radius:6px;margin-top:8px;font-size:13px;border:1px solid var(--border);background:var(--bg)}
.strategy-tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;margin:2px;border:1px solid var(--border);background:var(--card)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>💎 RFM分析器</h1>

<div class="card">
<h3 style="margin-bottom:12px">导入交易数据</h3>
<div class="grid-2">
<div>
<label>客户数据 (JSON)</label>
<textarea id="rawData" rows="8" placeholder='[
  {"name":"张三","lastPurchase":2,"purchaseCount":15,"totalAmount":4500},
  {"name":"李四","lastPurchase":30,"purchaseCount":3,"totalAmount":300}
]'></textarea>
</div>
<div>
<label>分箱方式</label>
<select id="binMethod" style="margin-bottom:8px">
<option value="auto">自动分箱 (等频)</option>
<option value="quantile">分位数分箱</option>
<option value="custom">自定义阈值</option>
</select>
<div id="customThresholds" style="display:none">
<label>Recency阈值 (逗号分隔，从低到高)</label>
<input type="text" id="rThreshold" placeholder="7,30,90" style="margin-bottom:6px">
<label>Frequency阈值</label>
<input type="text" id="fThreshold" placeholder="3,8,15" style="margin-bottom:6px">
<label>Monetary阈值</label>
<input type="text" id="mThreshold" placeholder="500,2000,5000">
</div>
<div style="margin-top:12px;display:flex;gap:8px">
<button onclick="runRFM()">💎 运行RFM分析</button>
<button class="btn-green" onclick="loadSample()">📋 加载示例</button>
<button class="btn-orange" onclick="exportCSV()">📥 导出CSV</button>
</div>
</div>
</div>
</div>

<div id="statsArea"></div>

<div class="card" id="matrixCard" style="display:none">
<h3 style="margin-bottom:12px">RFM分群矩阵</h3>
<div id="rfmMatrix"></div>
</div>

<div class="card" id="detailCard" style="display:none">
<h3 style="margin-bottom:12px">分群详情 — <span id="detailTitle"></span></h3>
<div class="table-wrap" id="detailTable"></div>
</div>

<div class="card" id="strategyCard" style="display:none">
<h3 style="margin-bottom:12px">运营策略建议</h3>
<div id="strategyList"></div>
</div>

<div class="card">
<h3 style="margin-bottom:12px">分析历史</h3>
<div id="historyList"></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var history=JSON.parse(localStorage.getItem('rfm_history')||'[]');
var lastResult=null;

var rfmSegments=[
  {key:'111',name:'重要价值客户',desc:'高价值高活跃',color:'#1a7f37',bg:'rgba(26,127,55,.1)'},
  {key:'113',name:'重要发展客户',desc:'高价值需提升频率',color:'#0969da',bg:'rgba(9,105,218,.1)'},
  {key:'131',name:'重要保持客户',desc:'高价值近期不活跃',color:'#bc4c00',bg:'rgba(188,76,0,.1)'},
  {key:'133',name:'重要挽留客户',desc:'高价值流失风险',color:'#cf222e',bg:'rgba(207,34,46,.1)'},
  {key:'311',name:'一般价值客户',desc:'低价值高活跃',color:'#8250df',bg:'rgba(130,80,223,.1)'},
  {key:'313',name:'一般发展客户',desc:'低价值低频',color:'#d29922',bg:'rgba(210,153,34,.1)'},
  {key:'331',name:'一般保持客户',desc:'低价值不活跃',color:'#656d76',bg:'rgba(101,109,118,.1)'},
  {key:'333',name:'流失客户',desc:'低价值高流失风险',color:'#cf222e',bg:'rgba(207,34,46,.15)'},
  {key:'222',name:'一般客户',desc:'中等价值中等活跃',color:'#0969da',bg:'rgba(9,105,218,.08)'}
];

function loadSample(){
  var data=[];var names=['张三','李四','王五','赵六','孙七','周八','吴九','郑十','冯十一','陈十二','褚十三','卫十四','蒋十五','沈十六','韩十七','杨十八','朱十九','秦二十','许二一','何二二','吕二三','施二四','张二五','孔二六','曹二七','严二八','华二九','金三十','魏三一','陶三二'];
  for(var i=0;i<30;i++){
    data.push({
      name:names[i],
      lastPurchase:Math.ceil(Math.random()*90),
      purchaseCount:Math.ceil(Math.random()*20),
      totalAmount:Math.round(Math.random()*8000+50)
    });
  }
  document.getElementById('rawData').value=JSON.stringify(data,null,2);
}

document.getElementById('binMethod').addEventListener('change',function(){
  document.getElementById('customThresholds').style.display=this.value==='custom'?'block':'none';
});

function runRFM(){
  var data;
  try{data=JSON.parse(document.getElementById('rawData').value);if(!Array.isArray(data)||!data.length){alert('请输入有效数据');return;}}catch(e){alert('JSON格式错误');return;}

  var method=document.getElementById('binMethod').value;
  var rVals=data.map(function(d){return d.lastPurchase||0;}).sort(function(a,b){return a-b;});
  var fVals=data.map(function(d){return d.purchaseCount||0;}).sort(function(a,b){return a-b;});
  var mVals=data.map(function(d){return d.totalAmount||0;}).sort(function(a,b){return a-b;});

  function getThresholds(vals){
    if(method==='custom')return null;
    var q1=vals[Math.floor(vals.length*0.33)];
    var q2=vals[Math.floor(vals.length*0.66)];
    return[q1,q2];
  }

  var rTh=method==='custom'?document.getElementById('rThreshold').value.split(',').map(Number).filter(function(x){return!isNaN(x);}).sort(function(a,b){return a-b;}):getThresholds(rVals);
  var fTh=method==='custom'?document.getElementById('fThreshold').value.split(',').map(Number).filter(function(x){return!isNaN(x);}).sort(function(a,b){return a-b;}):getThresholds(fVals);
  var mTh=method==='custom'?document.getElementById('mThreshold').value.split(',').map(Number).filter(function(x){return!isNaN(x);}).sort(function(a,b){return a-b;}):getThresholds(mVals);

  function score(vals,th,reverse){
    if(!th)return vals.map(function(){return 2;});
    return vals.map(function(v){
      if(reverse)return v<=th[0]?3:v<=th[1]?2:1;
      return v>=th[1]?3:v>=th[0]?2:1;
    });
  }

  var rScores=score(rVals,rTh,true);
  var fScores=score(fVals,fTh,false);
  var mScores=score(mVals,mTh,false);

  var scored=data.map(function(d,i){
    var r=rScores[i],f=fScores[i],m=mScores[i];
    var key=''+r+f+m;
    var segment=rfmSegments.find(function(s){return s.key===key;})||rfmSegments[8];
    return{r:r,f:f,m:m,key:key,segment:segment.name,segmentColor:segment.color,segmentBg:segment.bg,desc:segment.desc};
  });

  data.forEach(function(d,i){Object.assign(d,scored[i]);});

  var segCounts={};data.forEach(function(d){
    if(!segCounts[d.segment])segCounts[d.segment]={count:0,users:[]};
    segCounts[d.segment].count++;
    segCounts[d.segment].users.push(d);
  });

  lastResult={data:data,segCounts:segCounts};

  var totalRev=data.reduce(function(s,d){return s+(d.totalAmount||0);},0);
  var avgR=Math.round(rVals.reduce(function(a,b){return a+b;},0)/rVals.length);
  var avgF=Math.round(fVals.reduce(function(a,b){return a+b;},0)/fVals.length);
  document.getElementById('statsArea').innerHTML='<div class="stat-row"><div class="stat-box"><div class="num">'+data.length+'</div><div class="label">总客户数</div></div><div class="stat-box"><div class="num" style="color:var(--green)">¥'+totalRev.toLocaleString()+'</div><div class="label">总收入</div></div><div class="stat-box"><div class="num" style="color:var(--blue)">'+avgR+'天</div><div class="label">平均Recency</div></div><div class="stat-box"><div class="num" style="color:var(--purple)">'+avgF+'次</div><div class="label">平均Frequency</div></div></div>';

  var matrixHTML='<div class="rfm-matrix">';
  rfmSegments.forEach(function(seg){
    var info=segCounts[seg.name]||{count:0,users:[]};
    var pct=data.length?Math.round(info.count/data.length*100):0;
    matrixHTML+='<div class="rfm-cell" style="background:'+seg.bg+';border:1px solid '+seg.color+';color:'+seg.color+'" onclick="showDetail(\''+seg.name+'\')"><div class="count">'+info.count+'</div><div class="name">'+seg.name+'</div><div class="pct">'+pct+'%</div></div>';
  });
  matrixHTML+='</div>';
  document.getElementById('matrixCard').style.display='block';
  document.getElementById('rfmMatrix').innerHTML=matrixHTML;

  var strategies=[
    {seg:'重要价值客户',actions:['VIP专属服务','新品优先体验','口碑推荐奖励','专属社群']},
    {seg:'重要发展客户',actions:['增加触达频次','交叉销售推荐','会员积分加速','专属优惠']},
    {seg:'重要保持客户',actions:['唤醒邮件/短信','限时回归优惠','满意度调查','专属客服']},
    {seg:'重要挽留客户',actions:['大额优惠券','电话回访','流失原因调查','特别关怀']},
    {seg:'一般价值客户',actions:['提升客单价','品类引导','满减活动','会员升级']},
    {seg:'一般发展客户',actions:['培养购买习惯','新手引导','首购优惠','社交分享奖励']},
    {seg:'一般保持客户',actions:['定期推送','低价引流品','唤醒活动','积分兑换']},
    {seg:'流失客户',actions:['挽回优惠','满意度调查','产品改进通知','最低成本触达']},
    {seg:'一般客户',actions:['保持联系','内容营销','活动邀请','渐进式培养']}
  ];
  document.getElementById('strategyCard').style.display='block';
  document.getElementById('strategyList').innerHTML=strategies.map(function(s){
    return '<div class="insight-box"><strong>'+s.seg+'</strong><div style="margin-top:6px">'+s.actions.map(function(a){return '<span class="strategy-tag">'+a+'</span>';}).join('')+'</div></div>';
  }).join('');

  history.unshift({date:new Date().toLocaleDateString('zh-CN'),total:data.length,rev:totalRev,segments:Object.keys(segCounts).length});
  if(history.length>10)history.pop();
  localStorage.setItem('rfm_history',JSON.stringify(history));
  renderHistory();
}

function showDetail(segName){
  if(!lastResult)return;
  var users=lastResult.segCounts[segName]?lastResult.segCounts[segName].users:[];
  document.getElementById('detailTitle').textContent=segName+' ('+users.length+'人)';
  document.getElementById('detailTable').innerHTML='<table><thead><tr><th>客户</th><th>R</th><th>F</th><th>M</th><th>最近购买</th><th>购买次数</th><th>消费金额</th></tr></thead><tbody>'+users.map(function(u){
    return '<tr><td><strong>'+u.name+'</strong></td><td><span class="score-badge '+(u.r>=3?'score-high':u.r>=2?'score-mid':'score-low')+'">'+u.r+'</span></td><td><span class="score-badge '+(u.f>=3?'score-high':u.f>=2?'score-mid':'score-low')+'">'+u.f+'</span></td><td><span class="score-badge '+(u.m>=3?'score-high':u.m>=2?'score-mid':'score-low')+'">'+u.m+'</span></td><td>'+u.lastPurchase+'天</td><td>'+u.purchaseCount+'次</td><td>¥'+(u.totalAmount||0).toLocaleString()+'</td></tr>';
  }).join('')+'</tbody></table>';
  document.getElementById('detailCard').style.display='block';
}

function exportCSV(){
  if(!lastResult){alert('请先运行分析');return;}
  var csv='客户名,Recency评分,Frequency评分,Monetary评分,RFM代码,最近购买(天),购买次数,消费金额,分群\n';
  lastResult.data.forEach(function(d){
    csv+=d.name+','+d.r+','+d.f+','+d.m+','+d.key+','+d.lastPurchase+','+d.purchaseCount+','+d.totalAmount+','+d.segment+'\n';
  });
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rfm-analysis.csv';a.click();
}

function renderHistory(){
  document.getElementById('historyList').innerHTML=history.length?history.map(function(h){
    return '<div style="padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between"><div><strong>'+h.date+'</strong> · '+h.total+'客户</div><div style="font-size:12px">¥'+h.rev.toLocaleString()+' · '+h.segments+'个分群</div></div>';
  }).join(''):'<p style="color:var(--text2);font-size:13px">暂无历史记录</p>';
}

function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
renderHistory();
</script>
</body>
</html>
