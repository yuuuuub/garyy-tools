<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑雪场查找 - Ski Resort Finder</title>
    <meta name="description" content="滑雪场查找工具，发现附近的滑雪场和雪道">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;
            --secondary: #8b949e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: var(--secondary);
            font-size: 1.1rem;
        }
        
        .search-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
        }
        
        .search-row {
            display: grid;
            grid-template-columns: 1fr 200px 150px;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        @media (max-width: 768px) {
            .search-row {
                grid-template-columns: 1fr;
            }
        }
        
        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        
        .filter-label {
            color: var(--secondary);
            font-size: 0.9rem;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }
        
        .results-count {
            color: var(--secondary);
        }
        
        .sort-select {
            padding: 8px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .results-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .resort-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .resort-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        
        .resort-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .resort-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
        }
        
        .resort-type {
            padding: 4px 10px;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .resort-location {
            color: var(--secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .resort-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }
        
        .stars {
            color: var(--warning);
            letter-spacing: 2px;
        }
        
        .rating-value {
            font-weight: 600;
        }
        
        .rating-count {
            color: var(--secondary);
            font-size: 0.85rem;
        }
        
        .resort-description {
            color: var(--secondary);
            margin-bottom: 16px;
            line-height: 1.5;
        }
        
        .resort-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .stat-item {
            text-align: center;
            padding: 10px 6px;
            background: var(--bg);
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: var(--secondary);
            margin-top: 4px;
        }
        
        .resort-features {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .feature-tag {
            padding: 4px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--secondary);
        }
        
        .resort-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        
        .info-item {
            font-size: 0.9rem;
        }
        
        .info-label {
            color: var(--secondary);
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
        
        .info-value {
            font-weight: 500;
        }
        
        .book-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 16px;
        }
        
        .book-btn:hover {
            background: var(--accent-hover);
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--secondary);
        }
        
        .no-results-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        
        footer {
            text-align: center;
            padding: 40px 0;
            margin-top: 40px;
            border-top: 1px solid var(--border);
            color: var(--secondary);
            font-size: 0.9rem;
        }
    </style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1>滑雪场查找</h1>
            <p class="subtitle">发现最佳滑雪场，享受冬日运动乐趣</p>
        </header>

        <div class="search-section">
            <div class="search-row">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索滑雪场名称或位置...">
                <select class="sort-select" id="sortSelect">
                    <option value="rating">按评分排序</option>
                    <option value="price-low">票价从低到高</option>
                    <option value="price-high">票价从高到低</option>
                    <option value="slopes">按雪道数量排序</option>
                </select>
            </div>
            <div class="filter-section">
                <span class="filter-label">难度：</span>
                <button class="filter-btn active" data-difficulty="all">全部</button>
                <button class="filter-btn" data-difficulty="beginner">初学者</button>
                <button class="filter-btn" data-difficulty="intermediate">中级</button>
                <button class="filter-btn" data-difficulty="advanced">高级</button>
                <button class="filter-btn" data-difficulty="expert">专家级</button>
            </div>
        </div>

        <div class="results-header">
            <span class="results-count" id="resultsCount">找到 10 个滑雪场</span>
        </div>

        <div class="results-grid" id="resultsGrid">
            <!-- Cards will be injected here -->
        </div>

        <div class="no-results" id="noResults" style="display: none;">
            <div class="no-results-icon">⛷️</div>
            <h2>未找到匹配的滑雪场</h2>
            <p>请尝试调整搜索条件或筛选项</p>
        </div>

        <footer>
            <p>© 2024 滑雪场查找 - 发现您的滑雪天堂</p>
        </footer>
    </div>

    <script>
        const resorts = [

                slopes: 17,
                maxElevation: 1370,

                features: ["17条雪道", "高级道占比高", "缆车系统", "温泉酒店"],

                season: "11月-次年3月"
            },
            {

                difficulty: "intermediate",
                difficultyLabel: "中级",
                location: "河北省张家口市",
                rating: 4.6,
                reviews: 1560,
                description: "冬奥会举办地，设施完善，适合各水平滑雪者。",
                slopes: 32,
                maxElevation: 2110,
                liftPrice: 520,
                snowCondition: "人工造雪为主",
                features: ["32条雪道", "奥运标准", "儿童区", "教学区", "酒店"],
                equipmentRental: "品牌齐全",
                season: "11月-次年3月"
            },
            {
                name: "崇礼太舞滑雪场",
                difficulty: "beginner",
                difficultyLabel: "初学者",
                location: "河北省张家口市",
                rating: 4.5,
                reviews: 1230,
                description: "初学者友好型滑雪场，拥有宽阔的初级道和专业教学团队。",
                slopes: 24,
                maxElevation: 2160,
                liftPrice: 460,
                snowCondition: "人工造雪",
                features: ["24条雪道", "初级道宽阔", "儿童乐园", "教学中心"],

            },
            {

                rating: 4.8,
                reviews: 1670,
                description: "中国自然条件最好的滑雪场，雪质优良，适合追求极致体验者。",
                slopes: 19,
                maxElevation: 1405,
                liftPrice: 500,
                snowCondition: "优质天然雪",
                features: ["19条雪道", "雪质极佳", "树林野雪", "温泉酒店"],

                season: "11月-次年3月"
            },
            {

                difficulty: "intermediate",
                difficultyLabel: "中级",
                location: "吉林省吉林市",
                rating: 4.4,
                reviews: 980,
                description: "城市近郊滑雪场，交通便利，适合周末休闲滑雪。",
                slopes: 16,
                maxElevation: 935,
                liftPrice: 380,
                snowCondition: "人工造雪",
                features: ["16条雪道", "交通便利", "夜场开放", "美食街"],
                equipmentRental: "基础装备",
                season: "12月-次年2月"
            },
            {
                name: "万科石京龙滑雪场",
                difficulty: "beginner",
                difficultyLabel: "初学者",
                location: "北京市延庆区",
                rating: 4.3,
                reviews: 870,
                description: "北京周边最大的滑雪场，适合家庭亲子游和初学者。",
                slopes: 10,
                maxElevation: 1230,
                liftPrice: 360,
                snowCondition: "人工造雪",
                features: ["10条雪道", "亲子区", "教学中心", "餐饮区"],
                equipmentRental: "适合儿童",
                season: "12月-次年2月"
            },
            {
                name: "军都山滑雪场",
                difficulty: "intermediate",
                difficultyLabel: "中级",
                location: "北京市昌平区",
                rating: 4.2,
                reviews: 760,
                description: "北京老牌滑雪场，设施完善，适合周末休闲。",
                slopes: 8,
                maxElevation: 860,
                liftPrice: 320,
                snowCondition: "人工造雪",
                features: ["8条雪道", "夜场开放", "餐饮服务", "停车方便"],
                equipmentRental: "基础装备",
                season: "12月-次年2月"
            },
            {
                name: "西岭雪山滑雪场",
                difficulty: "beginner",
                difficultyLabel: "初学者",
                location: "四川省成都市",
                rating: 4.1,
                reviews: 650,
                description: "南方少有的滑雪场，适合初学者体验冰雪乐趣。",
                slopes: 6,
                maxElevation: 2200,
                liftPrice: 280,
                snowCondition: "天然雪+人工造雪",
                features: ["6条雪道", "初学者友好", "风景优美", "温泉"],
                equipmentRental: "基础装备",
                season: "12月-次年2月"
            },
            {
                name: "张家口云顶滑雪场",
                difficulty: "expert",
                difficultyLabel: "专家级",
                location: "河北省张家口市",
                rating: 4.8,
                reviews: 1980,
                description: "冬奥会自由式滑雪场地，拥有世界顶级难度雪道。",
                slopes: 28,
                maxElevation: 2100,
                liftPrice: 560,
                snowCondition: "优质人工造雪",
                features: ["28条雪道", "奥运赛道", "U型槽", "跳台", "缆车"],
                equipmentRental: "专业竞技装备",
                season: "11月-次年3月"
            }
        ];

        let currentDifficulty = 'all';
        let currentSort = 'rating';
        let searchQuery = '';

        function createStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 >= 0.5;
            let stars = '';
            for (let i = 0; i < fullStars; i++) {
                stars += '★';
            }
            if (hasHalf) {
                stars += '☆';
            }
            return stars;
        }

        function createResortCard(resort) {
            return `
                <div class="resort-card">
                    <div class="resort-header">
                        <h3 class="resort-name">${resort.name}</h3>
                        <span class="resort-type">${resort.difficultyLabel}</span>
                    </div>
                    <div class="resort-location">📍 ${resort.location}</div>
                    <div class="resort-rating">
                        <span class="stars">${createStars(resort.rating)}</span>
                        <span class="rating-value">${resort.rating}</span>
                        <span class="rating-count">(${resort.reviews}条评价)</span>
                    </div>
                    <p class="resort-description">${resort.description}</p>
                    <div class="resort-stats">
                        <div class="stat-item">
                            <div class="stat-value">${resort.slopes}</div>
                            <div class="stat-label">雪道数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${resort.maxElevation}m</div>
                            <div class="stat-label">最高海拔</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">¥${resort.liftPrice}</div>
                            <div class="stat-label">缆车票</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${resort.season.split('-')[0]}</div>
                            <div class="stat-label">开放月份</div>
                        </div>
                    </div>
                    <div class="resort-features">
                        ${resort.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
                    </div>
                    <div class="resort-info">
                        <div class="info-item">
                            <div class="info-label">雪况</div>
                            <div class="info-value">${resort.snowCondition}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">装备租赁</div>
                            <div class="info-value">${resort.equipmentRental}</div>
                        </div>
                    </div>
                    <button class="book-btn">预订缆车票</button>
                </div>
            `;
        }

        function filterAndSort() {
            let filtered = resorts;
            
            if (currentDifficulty !== 'all') {
                filtered = filtered.filter(r => r.difficulty === currentDifficulty);
            }
            
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(r => 
                    r.name.toLowerCase().includes(query) || 
                    r.location.toLowerCase().includes(query)
                );
            }
            
            switch (currentSort) {
                case 'rating':
                    filtered.sort((a, b) => b.rating - a.rating);
                    break;
                case 'price-low':
                    filtered.sort((a, b) => a.liftPrice - b.liftPrice);
                    break;
                case 'price-high':
                    filtered.sort((a, b) => b.liftPrice - a.liftPrice);
                    break;
                case 'slopes':
                    filtered.sort((a, b) => b.slopes - a.slopes);
                    break;
            }
            
            return filtered;
        }

        function renderResults() {
            const filtered = filterAndSort();
            const grid = document.getElementById('resultsGrid');
            const noResults = document.getElementById('noResults');
            const count = document.getElementById('resultsCount');
            
            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                count.textContent = '找到 0 个滑雪场';
            } else {
                noResults.style.display = 'none';
                grid.innerHTML = filtered.map(createResortCard).join('');
                count.textContent = `找到 ${filtered.length} 个滑雪场`;
            }
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDifficulty = btn.dataset.difficulty;
                renderResults();
            });
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderResults();
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderResults();
        });

        renderResults();
    </script>
<script src="../i18n.js"></script>
</body>
</html>
