<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪表盘构建器</title>
<meta name="description" content="仪表盘构建器，拖拽式自定义数据看板">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6scroll-behavior:smooth;}
.container{max-width:1100px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:var(--text);font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-warning{background:var(--yellow);color:#000}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.hidden{display:none!important}
.widget{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;min-height:120px}
.widget-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.widget-title{font-weight:700;font-size:.9rem}
.widget-actions{display:flex;gap:6px}
.widget-actions button{padding:2px 8px;font-size:.75rem;border:none;border-radius:4px;cursor:pointer;background:var(--border);color:var(--text)}
.widget-actions button:hover{background:var(--accent)}
.widget-actions button.danger{background:var(--red);color:#fff}
.stat-big{font-size:2.2rem;font-weight:800;color:var(--accent);text-align:center}
.stat-label{font-size:.8rem;color:var(--text2);text-align:center}
.progress-bar{height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:5px;transition:width .4s}
.list-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem;display:flex;justify-content:space-between}
.table-mini{width:100%;border-collapse:collapse;font-size:.85rem}
.table-mini th,.table-mini td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)}
.table-mini th{color:var(--text2);font-weight:600}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.dashboard-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="仪表盘构建器">
<meta property="og:description" content="仪表盘构建器，拖拽式自定义数据看板">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/dashboard-builder-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🏠 仪表盘构建器';
const APP=document.getElementById('app');
let dashboards=JSON.parse(localStorage.getItem('db_dashboards')||'[]');
let curDash=null;
const WIDGET_TYPES=[
  {type:'stat',label:'统计数字',icon:'🔢'},
  {type:'progress',label:'进度条',icon:'📊'},
  {type:'list',label:'列表',icon:'📋'},
  {type:'table',label:'表格',icon:'📑'},
  {type:'text',label:'文本',icon:'📝'},
  {type:'barChart',label:'迷你柱图',icon:'📉'}
];
const COLORS=['#3b82f6','#3fb950','#f85149','#d29922','#a855f7','#ec4899'];

function save(){localStorage.setItem('db_dashboards',JSON.stringify(dashboards))}

function render(){
  let h=`<h1>🏠 仪表盘构建器</h1><p class="subtitle">自定义你的数据看板</p>`;
  if(curDash!==null){
    let d=dashboards[curDash];
    h+=`<div class="card"><div class="flex-between"><button class="btn btn-sm" onclick="curDash=null;render()">← 返回</button><b>${d.title}</b><div class="flex"><button class="btn btn-sm" onclick="addWidget()">+ 添加组件</button><button class="btn btn-sm btn-warning" onclick="renameDash()">重命名</button></div></div></div>`;
    if(!d.widgets.length){h+=`<div class="empty">点击上方添加组件开始构建仪表盘</div>`;}
    h+=`<div class="dashboard-grid">`;
    d.widgets.forEach((w,i)=>{
      h+=`<div class="widget">`;
      h+=`<div class="widget-header"><span class="widget-title">${WIDGET_TYPES.find(t=>t.type===w.type)?.icon||''} ${w.title}</span>`;
      h+=`<div class="widget-actions"><button onclick="editWidget(${i})">编辑</button><button class="danger" onclick="delWidget(${i})">×</button></div></div>`;
      h+=renderWidget(w);
      h+=`</div>`;
    });
    h+=`</div>`;
  } else {
    h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">仪表盘列表</span><button class="btn btn-sm" onclick="newDash()">+ 新建</button></div></div>`;
    dashboards.forEach((d,i)=>{
      h+=`<div class="card"><div class="flex-between"><b>${d.title}</b><div class="flex"><span class="badge badge-blue">${d.widgets.length} 组件</span><button class="btn btn-sm" onclick="openDash(${i})">打开</button><button class="btn btn-sm btn-danger" onclick="delDash(${i})">×</button></div></div></div>`;
    });
    if(!dashboards.length) h+=`<div class="empty">暂无仪表盘</div>`;
  }
  APP.innerHTML=h;
}

function renderWidget(w){
  switch(w.type){
    case 'stat':
      return `<div class="stat-big">${w.value||'0'}</div><div class="stat-label">${w.label||''}</div>`;
    case 'progress':
      let pct=parseInt(w.value)||0;
      let color=pct>=80?'var(--green)':pct>=50?'var(--accent)':'var(--yellow)';
      return `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div><div style="text-align:center;font-size:.9rem">${pct}%</div><div class="stat-label">${w.label||''}</div>`;
    case 'list':
      let items=(w.value||'').split('\n').filter(Boolean);
      return items.map(it=>`<div class="list-item">${it}</div>`).join('')||'<div class="empty" style="padding:10px">无数据</div>';
    case 'table':
      let rows=(w.value||'').split('\n').filter(Boolean);
      if(!rows.length) return '<div class="empty" style="padding:10px">无数据</div>';
      let ths=rows[0].split(',').map(c=>`<th>${c.trim()}</th>`).join('');
      let trows=rows.slice(1).map(r=>`<tr>${r.split(',').map(c=>`<td>${c.trim()}</td>`).join('')}</tr>`).join('');
      return `<div style="overflow-x:auto"><table class="table-mini"><tr>${ths}</tr>${trows}</table></div>`;
    case 'text':
      return `<div style="font-size:.9rem;line-height:1.6;white-space:pre-wrap">${w.value||''}</div>`;
    case 'barChart':
      let vals=(w.value||'').split(',').map(Number).filter(v=>!isNaN(v));
      if(!vals.length) return '<div class="empty" style="padding:10px">无数据</div>';
      let mx=Math.max(...vals,1);
      return vals.map((v,i)=>`<div style="display:flex;align-items:center;gap:8px;margin:3px 0"><div style="flex:1;height:14px;background:var(--border);border-radius:7px;overflow:hidden"><div style="height:100%;width:${v/mx*100}%;background:${COLORS[i%COLORS.length]};border-radius:7px"></div></div><span style="font-size:.8rem;min-width:30px;text-align:right">${v}</span></div>`).join('');
    default: return '';
  }
}

function newDash(){let t=prompt('仪表盘标题：');if(t){dashboards.push({title:t,widgets:[]});save();render()}}
function openDash(i){curDash=i;render()}
function delDash(i){if(confirm('删除？')){dashboards.splice(i,1);curDash=null;save();render()}}
function renameDash(){let t=prompt('新标题：',dashboards[curDash].title);if(t){dashboards[curDash].title=t;save();render()}}

function addWidget(){
  let type=prompt('组件类型：\n1-统计数字\n2-进度条\n3-列表\n4-表格\n5-文本\n6-迷你柱图\n请输入数字(1-6)：');
  let typeMap={1:'stat',2:'progress',3:'list',4:'table',5:'text',6:'barChart'};
  let t=typeMap[type];
  if(!t){alert('无效选择');return;}
  let title=prompt('组件标题：','未命名');
  if(title===null) return;
  let info=WIDGET_TYPES.find(w=>w.type===t);
  let defaultVal=t==='stat'?'0':t==='progress'?'50':t==='barChart'?'10,20,30,40':'';
  let label=t==='progress'?'说明文字':'';
  dashboards[curDash].widgets.push({type:t,title,value:defaultVal,label});
  save();render();
}

function editWidget(i){
  let w=dashboards[curDash].widgets[i];
  let newVal=prompt(`编辑「${w.title}」的值：`,w.value);
  if(newVal===null) return;
  w.value=newVal;
  if(w.type==='stat'||w.type==='progress'){
    let l=prompt('标签/说明：',w.label||'');
    if(l!==null) w.label=l;
  }
  save();render();
}

function delWidget(i){if(confirm('删除组件？')){dashboards[curDash].widgets.splice(i,1);save();render()}}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
