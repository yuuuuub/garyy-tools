<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>签证查询工具</title>
<meta property="og:title" content="签证查询工具">
<meta property="og:description" content="查询各国签证要求和办理信息">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="签证查询工具，快速了解各国签证要求、材料清单和办理流程">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:16px;min-height:100vh;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text);margin-right:4px;margin-bottom:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.visa-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.visa-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.visa-country{font-weight:600;font-size:1.1rem}
.visa-type{font-size:.8rem}
.visa-info{font-size:.9rem;color:var(--text2);margin-bottom:6px}
.visa-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.doc-list{list-style:none;padding:0}
.doc-list li{padding:6px 0;border-bottom:1px solid var(--border);font-size:.9rem;display:flex;align-items:center;gap:6px}
.doc-list li:last-child{border-bottom:none}
.doc-list .check{color:var(--success)}
.doc-list .warn{color:var(--warn)}
.timeline{position:relative;padding-left:20px;margin-top:8px}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;padding:8px 0 8px 16px;font-size:.85rem}
.timeline-item::before{content:'';position:absolute;left:-16px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.timeline-item .step{font-weight:600;color:var(--accent)}
.timeline-item .desc{color:var(--text2);margin-top:2px}
.cost-table{width:100%;border-collapse:collapse;margin-top:8px}
.cost-table th,.cost-table td{padding:8px;text-align:left;border-bottom:1px solid var(--border);font-size:.85rem}
.cost-table th{color:var(--text2);font-weight:600}
.difficulty{display:flex;gap:4px;align-items:center}
.difficulty .dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.difficulty .dot.filled{background:var(--accent)}
.es{text-align:center;padding:40px;color:var(--text2)}
.search-box{display:flex;gap:8px;margin-bottom:12px}
.search-box input{flex:1}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📋 签证查询工具</h1><p>查询各国签证要求和办理信息</p></div>

<div class="cd"><h2>🔍 查询签证</h2>
<div class="search-box"><input type="text" id="searchInput" placeholder="🔍 搜索国家..." oninput="filterVisas()"></div>
<label>签证类型筛选</label>
<select id="typeFilter" onchange="filterVisas()">
<option value="all">全部类型</option>
<option value="旅游签证">旅游签证</option>
<option value="商务签证">商务签证</option>
<option value="免签">免签/落地签</option>
</select>
</div>

<div id="visaList"></div>
</div>

<script>
const VISAS=[
  {country:'日本',flag:'🇯🇵',type:'旅游签证',difficulty:3,processing:'5-7个工作日',stay:'15-90天',fee:'200元',cost:'500-800元',
    docs:['护照（有效期6个月以上）','签证申请表','2寸白底照片','在职证明/在读证明','银行流水（近6个月）','行程单','酒店预订确认'],
    steps:[{step:'准备材料',desc:'按要求准备签证申请材料'},{step:'递交申请',desc:'前往签证中心递交材料'},{step:'等待审核',desc:'通常5-7个工作日出结果'},{step:'领取签证',desc:'领取护照和签证'}]},
  {country:'韩国',flag:'🇰🇷',type:'旅游签证',difficulty:2,processing:'5个工作日',stay:'30-90天',fee:'280元',cost:'400-600元',
    docs:['护照','签证申请表','照片','身份证复印件','在职证明','银行流水'],
    steps:[{step:'准备材料',desc:'准备签证所需文件'},{step:'递交申请',desc:'前往签证中心'},{step:'等待审核',desc:'5个工作日出签'},{step:'领取签证',desc:'领取签证'}]},
  {country:'泰国',flag:'🇹🇭',type:'免签',difficulty:1,processing:'即办即走',stay:'30天',fee:'0元',cost:'0元',
    docs:['护照（有效期6个月以上）','往返机票','酒店预订','个人携带现金2万泰铢'],
    steps:[{step:'准备护照',desc:'确保护照有效期6个月以上'},{step:'购买机票',desc:'购买往返机票'},{step:'入境泰国',desc:'在机场办理落地签或免签入境'}]},
  {country:'新加坡',flag:'🇸🇬',type:'旅游签证',difficulty:2,processing:'3-5个工作日',stay:'30天',fee:'150元',cost:'300-500元',
    docs:['护照','签证申请表','照片','在职证明','银行流水','行程单'],
    steps:[{step:'准备材料',desc:'在线填写申请表'},{step:'递交申请',desc:'通过授权旅行社递交'},{step:'等待审批',desc:'3-5个工作日'},{step:'领取签证',desc:'收到签证通知'}]},
  {country:'美国',flag:'🇺🇸',type:'旅游签证',difficulty:5,processing:'面签后7-10天',stay:'180天',fee:'1120元',cost:'1200-1500元',
    docs:['护照','DS-160确认页','预约确认信','照片','身份证','户口本','在职证明','银行流水','房产证/车证'],
    steps:[{step:'在线申请',desc:'填写DS-160表格'},{step:'缴费预约',desc:'缴纳签证费并预约面签'},{step:'面签',desc:'前往美国大使馆面签'},{step:'等待结果',desc:'通常7-10天出结果'},{step:'领取护照',desc:'领取贴签护照'}]},
  {country:'英国',flag:'🇬🇧',type:'旅游签证',difficulty:4,processing:'15个工作日',stay:'180天',fee:'900元',cost:'1000-1300元',
    docs:['护照','申请表','照片','银行流水','在职证明','行程单','酒店预订'],
    steps:[{step:'在线申请',desc:'填写签证申请表'},{step:'预约采集',desc:'预约指纹采集'},{step:'递交材料',desc:'前往签证中心递交'},{step:'等待审核',desc:'通常15个工作日'},{step:'领取签证',desc:'领取护照和签证'}]},
  {country:'澳大利亚',flag:'🇦🇺',type:'旅游签证',difficulty:3,processing:'10-20个工作日',stay:'90天',fee:'790元',cost:'800-1000元',
    docs:['护照','申请表','照片','银行流水','在职证明','行程单'],
    steps:[{step:'在线申请',desc:'通过移民局网站申请'},{step:'上传材料',desc:'在线上传所需文件'},{step:'等待审批',desc:'10-20个工作日'},{step:'获得签证',desc:'电子签证发送到邮箱'}]},
  {country:'法国',flag:'🇫🇷',type:'旅游签证',difficulty:3,processing:'5-10个工作日',stay:'90天',fee:'650元',cost:'700-900元',
    docs:['护照','申根签证申请表','照片','机票预订','酒店预订','银行流水','在职证明','旅行保险'],
    steps:[{step:'准备材料',desc:'准备申根签证材料'},{step:'预约递签',desc:'在TLScontact预约'},{step:'递交材料',desc:'前往签证中心递交'},{step:'等待审核',desc:'5-10个工作日'},{step:'领取签证',desc:'领取护照'}]},
  {country:'阿联酋',flag:'🇦🇪',type:'免签',difficulty:1,processing:'即办即走',stay:'30天',fee:'0元',cost:'0元',
    docs:['护照（有效期6个月以上）','往返机票'],
    steps:[{step:'准备护照',desc:'确保护照有效期6个月以上'},{step:'购买机票',desc:'购买往返机票'},{step:'入境',desc:'在机场直接入境'}]},
  {country:'马来西亚',flag:'🇲🇾',type:'免签',difficulty:1,processing:'即办即走',stay:'30天',fee:'0元',cost:'0元',
    docs:['护照（有效期6个月以上）','往返机票'],
    steps:[{step:'准备护照',desc:'确保护照有效期6个月以上'},{step:'入境',desc:'直接入境，无需签证'}]},
  {country:'印度尼西亚',flag:'🇮🇩',type:'免签',difficulty:1,processing:'即办即走',stay:'30天',fee:'0元',cost:'0元',
    docs:['护照（有效期6个月以上）','往返机票'],
    steps:[{step:'准备护照',desc:'确保护照有效期6个月以上'},{step:'入境',desc:'在机场办理落地签或免签'}]},
  {country:'俄罗斯',flag:'🇷🇺',type:'旅游签证',difficulty:4,processing:'7-15个工作日',stay:'30天',fee:'400元',cost:'500-800元',
    docs:['护照','邀请函','签证申请表','照片','旅行保险','酒店预订'],
    steps:[{step:'获取邀请函',desc:'通过旅行社获取邀请函'},{step:'准备材料',desc:'准备签证申请材料'},{step:'递交申请',desc:'前往签证中心递交'},{step:'等待审核',desc:'7-15个工作日'},{step:'领取签证',desc:'领取签证'}]},
  {country:'新西兰',flag:'🇳🇿',type:'旅游签证',difficulty:3,processing:'20个工作日',stay:'90天',fee:'850元',cost:'900-1100元',
    docs:['护照','申请表','照片','银行流水','在职证明','行程单','酒店预订'],
    steps:[{step:'在线申请',desc:'通过移民局网站申请'},{step:'上传材料',desc:'在线上传文件'},{step:'等待审批',desc:'20个工作日'},{step:'获得签证',desc:'电子签证'}]},
  {country:'加拿大',flag:'🇨🇦',type:'旅游签证',difficulty:4,processing:'15-30个工作日',stay:'180天',fee:'850元',cost:'900-1200元',
    docs:['护照','申请表','照片','银行流水','在职证明','行程单','旅行保险'],
    steps:[{step:'在线申请',desc:'通过IRCC网站申请'},{step:'录指纹',desc:'前往签证中心采集指纹'},{step:'等待审核',desc:'15-30个工作日'},{step:'获得签证',desc:'收到签证通知'}]},
  {country:'中国',flag:'🇨🇳',type:'旅游签证',difficulty:2,processing:'5个工作日',stay:'30-90天',fee:'140元',cost:'200-400元',
    docs:['护照','签证申请表','照片','在职证明或在读证明','往返机票','酒店预订'],
    steps:[{step:'准备材料',desc:'准备签证申请材料'},{step:'递交申请',desc:'前往签证中心或在线申请'},{step:'等待审核',desc:'5个工作日'},{step:'领取签证',desc:'领取签证'}]}
];
let favorites=JSON.parse(localStorage.getItem('visa_favorites')||'[]');

function $(id){return document.getElementById(id)}
function filterVisas(){
  const q=($('searchInput').value||'').toLowerCase();
  const type=$('typeFilter').value;
  let filtered=VISAS.filter(v=>{
    if(q&&!v.country.toLowerCase().includes(q))return false;
    if(type!=='all'&&v.type!==type)return false;
    return true;
  });
  renderVisas(filtered);
}
function renderVisas(visas){
  if(!visas.length){$('visaList').innerHTML='<div class="es">未找到匹配的签证信息</div>';return;}
  $('visaList').innerHTML=visas.map((v,i)=>{
    const diffDots=Array.from({length:5},(_, j)=>`<span class="dot ${j<v.difficulty?'filled':''}"></span>`).join('');
    const isFav=favorites.includes(v.country);
    return `<div class="visa-card">
      <div class="visa-head">
        <div><span class="visa-country">${v.flag} ${v.country}</span><span class="visa-type tag ${v.type==='免签'?'s':''}">${v.type}</span></div>
        <button class="sec" style="padding:4px 8px;font-size:.8rem" onclick="toggleFav('${v.country}')">${isFav?'❤️':'🤍'}</button>
      </div>
      <div class="visa-meta">
        <span class="tag">⏱️ ${v.processing}</span>
        <span class="tag">📅 ${v.stay}</span>
        <span class="tag">💰 ${v.fee}</span>
      </div>
      <div style="margin-bottom:6px"><span style="font-size:.8rem;color:var(--text2)">办理难度：</span>
        <div class="difficulty" style="display:inline-flex">${diffDots}</div></div>
      <details><summary style="cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent);margin-bottom:4px">📄 所需材料</summary>
        <ul class="doc-list">${v.docs.map(d=>`<li><span class="check">✓</span> ${d}</li>`).join('')}</ul></details>
      <details><summary style="cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent);margin-top:8px;margin-bottom:4px">📋 办理流程</summary>
        <div class="timeline">${v.steps.map(s=>`<div class="timeline-item"><div class="step">${s.step}</div><div class="desc">${s.desc}</div></div>`).join('')}</div></details>
      <details><summary style="cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent);margin-top:8px;margin-bottom:4px">💰 费用明细</summary>
        <table class="cost-table"><tr><th>项目</th><th>费用</th></tr>
        <tr><td>签证费</td><td>${v.fee}</td></tr>
        <tr><td>服务费（参考）</td><td>${v.cost}</td></tr>
        <tr><td><strong>合计参考</strong></td><td><strong>${v.cost}</strong></td></tr></table></details>
    </div>`;
  }).join('');
}
function toggleFav(country){
  const idx=favorites.indexOf(country);
  if(idx>=0)favorites.splice(idx,1);else favorites.push(country);
  localStorage.setItem('visa_favorites',JSON.stringify(favorites));filterVisas();
}
filterVisas();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
