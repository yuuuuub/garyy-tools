<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 营养补剂追踪器</title>
<meta name="description" content="追踪每日营养补剂服用情况，记录蛋白粉、鱼油等保健品摄入">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px;margin-bottom:2px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.sup-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.sup-card .info{flex:1}.sup-card .name{font-weight:600;font-size:.9rem}.sup-card .detail{font-size:.8rem;color:var(--text2)}
.toggle-btn{width:44px;height:24px;border-radius:12px;border:none;cursor:pointer;transition:all .2s;position:relative}
.toggle-btn.on{background:var(--success)}.toggle-btn.off{background:var(--border)}
.toggle-btn::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;transition:all .2s}
.toggle-btn.on::after{right:2px}.toggle-btn.off::after{left:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🧪 营养补剂追踪器">
<meta property="og:description" content="追踪每日营养补剂服用情况，记录蛋白粉、鱼油等保健品摄入">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/supplement-tracker-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🧪 营养补剂追踪器</h1><p>记录每日补剂服用，维持最佳状态</p></div>

<div class="cd">
<div class="gr" style="margin-bottom:0">
<div class="st"><div class="nm" id="todayCount" style="color:var(--success)">0</div><div class="lb">今日已服用</div></div>
<div class="st"><div class="nm" id="totalCount" style="color:var(--accent)">0</div><div class="lb">补剂总数</div></div>
</div></div>

<div class="cd"><h2>今日服用情况</h2><div id="todayList"></div></div>

<div class="cd"><h2>添加补剂</h2>
<div class="fr">
<div><label>补剂名称</label><input type="text" id="supName" placeholder="如：鱼油"></div>
<div><label>剂量</label><input type="text" id="supDose" placeholder="如：1000mg"></div>
</div>
<label>服用频次</label>
<select id="supFreq"><option value="每日1次">每日1次</option><option value="每日2次">每日2次</option><option value="每日3次">每日3次</option><option value="每周1次">每周1次</option><option value="训练日">训练日</option></select>
<label>服用时间</label>
<select id="supTime"><option value="早餐时">🌅 早餐时</option><option value="午餐时">☀️ 午餐时</option><option value="晚餐时">🌙 晚餐时</option><option value="训练前">💪 训练前</option><option value="训练后">🏋️ 训练后</option><option value="睡前">😴 睡前</option></select>
<label>备注</label><input type="text" id="supNote" placeholder="选填">
<div class="bg"><button onclick="addSup()">添加补剂</button></div></div>

<div class="cd"><h2>我的补剂列表</h2><div id="supList"></div></div>

<div class="cd"><h2>📅 本周记录</h2><div id="weekLog"></div></div>
</div>
<script>
(function(){
var DB='supplement_tracker_cn';
var supps=JSON.parse(localStorage.getItem(DB+'_list')||'[]');
var log=JSON.parse(localStorage.getItem(DB+'_log')||'{}');

if(!supps.length){
supps=[
{name:'鱼油',dose:'1000mg',freq:'每日1次',time:'早餐时',note:'omega-3',id:1},
{name:'蛋白粉',dose:'30g',freq:'训练日',time:'训练后',note:'乳清蛋白',id:2},
{name:'肌酸',dose:'5g',freq:'每日1次',time:'训练前',note:'一水肌酸',id:3},
{name:'复合维生素',dose:'1片',freq:'每日1次',time:'早餐时',note:'',id:4}
];
localStorage.setItem(DB+'_list',JSON.stringify(supps));
}

function today(){return new Date().toLocaleDateString()}
function todayKey(){return today()}

window.addSup=function(){
var name=document.getElementById('supName').value.trim();
var dose=document.getElementById('supDose').value.trim();
var freq=document.getElementById('supFreq').value;
var time=document.getElementById('supTime').value;
var note=document.getElementById('supNote').value.trim();
if(!name){alert('请输入补剂名称');return;}
supps.push({name:name,dose:dose||'适量',freq:freq,time:time,note:note,id:Date.now()});
localStorage.setItem(DB+'_list',JSON.stringify(supps));
document.getElementById('supName').value='';document.getElementById('supDose').value='';document.getElementById('supNote').value='';
render();
};

window.delSup=function(id){supps=supps.filter(function(s){return s.id!==id});localStorage.setItem(DB+'_list',JSON.stringify(supps));render();};

window.toggleSup=function(id){
var tk=todayKey();
if(!log[tk])log[tk]={};
log[tk][id]=!log[tk][id];
if(log[tk][id]){log[tk][id+'_time']=new Date().toLocaleTimeString();}
localStorage.setItem(DB+'_log',JSON.stringify(log));
render();
};

function render(){
var tk=todayKey();
if(!log[tk])log[tk]={};
var done=supps.filter(function(s){return log[tk][s.id]}).length;
document.getElementById('todayCount').textContent=done;
document.getElementById('totalCount').textContent=supps.length;

var el=document.getElementById('todayList');
if(!supps.length){el.innerHTML='<div class="es">请先添加补剂</div>';return;}
el.innerHTML=supps.map(function(s){
var isOn=log[tk][s.id];
return '<div class="sup-card"><div class="info"><div class="name">'+(isOn?'✅ ':'')+s.name+' <span style="color:var(--text2);font-size:.8rem">'+s.dose+'</span></div><div class="detail">'+s.freq+' · '+s.time+(s.note?' · '+s.note:'')+(isOn?' · 服用于 '+log[tk][s.id+'_time']:'')+'</div></div><button class="toggle-btn '+(isOn?'on':'off')+'" onclick="toggleSup('+s.id+')"></button></div>';
}).join('');

var sEl=document.getElementById('supList');
sEl.innerHTML=supps.map(function(s){
return '<div class="li"><div><strong>'+s.name+'</strong> <span style="color:var(--text2);font-size:.8rem">'+s.dose+' · '+s.freq+' · '+s.time+'</span></div><button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="delSup('+s.id+')">✕</button></div>';
}).join('');

var wEl=document.getElementById('weekLog');
var weekHtml='';
for(var i=6;i>=0;i--){
var d=new Date();d.setDate(d.getDate()-i);
var dk=d.toLocaleDateString();
var dayLog=log[dk]||{};
var dayDone=supps.filter(function(s){return dayLog[s.id]}).length;
var dayName=['日','一','二','三','四','五','六'][d.getDay()];
weekHtml+='<div class="li"><span>周'+dayName+' '+dk.substring(5)+'</span><span style="color:var(--accent);font-weight:600">'+dayDone+'/'+supps.length+'</span></div>';
}
wEl.innerHTML=weekHtml;
}
render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
