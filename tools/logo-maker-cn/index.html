<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔷 Logo设计工具</title>
<meta name="description" content="在线Logo设计工具，支持文字、形状、渐变、自定义颜色，导出PNG">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:900px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.canvas-wrap{display:flex;justify-content:center;overflow:auto;padding:10px 0}
canvas#logoCanvas{border:1px solid var(--border);border-radius:8px;background:#ffffff;cursor:move}
.form-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.form-row label{font-size:13px;color:var(--text-secondary);min-width:70px}
.form-row input[type="text"],.form-row select,.form-row input[type="number"]{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--input-bg);color:var(--text);flex:1;min-width:120px}
.form-row input[type="color"]{width:40px;height:32px;border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:2px}
.form-row input[type="range"]{flex:1;accent-color:var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
.layer-list{max-height:200px;overflow-y:auto}
.layer-item{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--input-bg);cursor:pointer;transition:all .15s}
.layer-item.active{border-color:var(--accent);background:var(--tag-bg)}
.layer-item .layer-name{flex:1;font-size:13px}
.layer-item .layer-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.preset{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s}
.preset:hover{border-color:var(--accent)}
.preset.active{border-color:var(--accent);background:var(--tag-bg)}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔷</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🔷 Logo设计工具</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">🖼️ 预览</div>
    <div class="canvas-wrap"><canvas id="logoCanvas" width="400" height="400"></canvas></div>
  </div>

  <div class="card">
    <div class="card-title">📐 画布尺寸</div>
    <div class="preset-row" id="sizePresets"></div>
    <div class="form-row">
      <label>宽度</label><input type="number" id="cWidth" value="400" min="100" max="2000">
      <label>高度</label><input type="number" id="cHeight" value="400" min="100" max="2000">
      <label>背景</label><input type="color" id="bgColor" value="#ffffff" onchange="render()">
      <button class="btn btn-outline" onclick="applySize()">应用</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">➕ 添加元素</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="addText()">📝 文字</button>
      <button class="btn btn-primary" onclick="addShape('circle')">⭕ 圆形</button>
      <button class="btn btn-primary" onclick="addShape('rect')">⬜ 矩形</button>
      <button class="btn btn-primary" onclick="addShape('triangle')">🔺 三角形</button>
      <button class="btn btn-primary" onclick="addShape('star')">⭐ 五角星</button>
      <button class="btn btn-primary" onclick="addShape('diamond')">💎 菱形</button>
      <button class="btn btn-primary" onclick="addShape('hexagon')">⬡ 六边形</button>
      <button class="btn btn-primary" onclick="addShape('ring')">⭕ 圆环</button>
    </div>
  </div>

  <div class="card" id="propPanel" style="display:none">
    <div class="card-title">🎨 属性</div>
    <div class="form-row"><label>文本</label><input type="text" id="propText" oninput="updateProp('text',this.value)"></div>
    <div class="form-row"><label>字体大小</label><input type="range" min="12" max="200" value="48" id="propFontSize" oninput="updateProp('fontSize',parseInt(this.value))"><span id="fontSizeVal">48</span></div>
    <div class="form-row"><label>字体</label><select id="propFont" onchange="updateProp('font',this.value)"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Courier New">Courier New</option><option value="Impact">Impact</option><option value="Comic Sans MS">Comic Sans MS</option><option value="Times New Roman">Times New Roman</option><option value="Verdana">Verdana</option></select></div>
    <div class="form-row"><label>填充色</label><input type="color" id="propFill" onchange="updateProp('fill',this.value)"></div>
    <div class="form-row"><label>边框色</label><input type="color" id="propStroke" onchange="updateProp('stroke',this.value)"></div>
    <div class="form-row"><label>边框宽</label><input type="range" min="0" max="20" value="0" id="propStrokeW" oninput="updateProp('strokeWidth',parseInt(this.value))"><span id="strokeWVal">0</span></div>
    <div class="form-row"><label>旋转°</label><input type="range" min="0" max="360" value="0" id="propRotation" oninput="updateProp('rotation',parseInt(this.value))"><span id="rotationVal">0</span></div>
    <div class="form-row"><label>缩放</label><input type="range" min="20" max="300" value="100" id="propScale" oninput="updateProp('scale',parseInt(this.value)/100)"><span id="scaleVal">100%</span></div>
    <div class="form-row"><label>不透明度</label><input type="range" min="10" max="100" value="100" id="propAlpha" oninput="updateProp('alpha',parseInt(this.value)/100)"><span id="alphaVal">100%</span></div>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="moveLayerUp()">⬆️ 上移</button>
      <button class="btn btn-outline" onclick="moveLayerDown()">⬇️ 下移</button>
      <button class="btn btn-outline" onclick="duplicateLayer()">📋 复制</button>
      <button class="btn btn-outline" onclick="deleteLayer()">🗑️ 删除</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📑 图层</div>
    <div class="layer-list" id="layerList"></div>
  </div>

  <div class="card">
    <div class="card-title">⚡ 操作</div>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="undo()">↩️ 撤销</button>
      <button class="btn btn-outline" onclick="redo()">↪️ 重做</button>
      <button class="btn btn-outline" onclick="clearAll()">🗑️ 清空</button>
      <button class="btn btn-primary" onclick="exportPNG()">💾 导出PNG</button>
      <button class="btn btn-primary" onclick="exportTransparent()">🖼️ 透明背景</button>
    </div>
  </div>

  <footer>🔷 Logo设计工具 - 创建专业Logo</footer>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/i18n-js@3/dist/i18n.min.js" defer></script>
<script>
const C=document.getElementById('logoCanvas'),ctx=C.getContext('2d');
let elements=[],selectedIdx=-1,dragging=false,dragOffX=0,dragOffY=0;
let undoStack=[],redoStack=[];
const sizePresets=[{w:400,h:400,l:'400x400'},{w:512,h:512,l:'512x512'},{w:800,h:600,l:'800x600'},{w:1024,h:1024,l:'1024x1024'},{w:1200,h:630,l:'OG图'},{w:200,h:200,l:'头像'},{w:1920,h:1080,l:'横幅'}];

function init(){
  renderSizePresets();render();renderLayers();saveState();
  C.addEventListener('mousedown',onDown);
  C.addEventListener('mousemove',onMove);
  C.addEventListener('mouseup',onUp);
  C.addEventListener('touchstart',e=>{e.preventDefault();const r=C.getBoundingClientRect();const t=e.touches[0];onDown({clientX:t.clientX,clientY:t.clientY,offsetX:t.clientX-r.left,offsetY:t.clientY-r.top})},{passive:false});
  C.addEventListener('touchmove',e=>{e.preventDefault();const r=C.getBoundingClientRect();const t=e.touches[0];onMove({clientX:t.clientX,clientY:t.clientY,offsetX:t.clientX-r.left,offsetY:t.clientY-r.top})},{passive:false});
  C.addEventListener('touchend',()=>onUp());
}

function renderSizePresets(){
  const row=document.getElementById('sizePresets');row.innerHTML='';
  sizePresets.forEach(p=>{
    const b=document.createElement('button');
    b.className='preset';
    b.textContent=p.l;
    b.onclick=()=>{document.getElementById('cWidth').value=p.w;document.getElementById('cHeight').value=p.h;applySize();};
    row.appendChild(b);
  });
}

function applySize(){
  const w=parseInt(document.getElementById('cWidth').value)||400;
  const h=parseInt(document.getElementById('cHeight').value)||400;
  C.width=w;C.height=h;render();
}

function render(){
  const bg=document.getElementById('bgColor').value;
  ctx.clearRect(0,0,C.width,C.height);
  ctx.fillStyle=bg;ctx.fillRect(0,0,C.width,C.height);
  elements.forEach((el,i)=>{
    ctx.save();
    ctx.globalAlpha=el.alpha||1;
    ctx.translate(el.x,el.y);
    ctx.rotate((el.rotation||0)*Math.PI/180);
    ctx.scale(el.scale||1,el.scale||1);
    if(el.type==='text'){
      ctx.font=`bold ${el.fontSize||48}px ${el.font||'Arial'}`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      if(el.strokeWidth>0){ctx.strokeStyle=el.stroke||'#000';ctx.lineWidth=el.strokeWidth;ctx.strokeText(el.text,0,0);}
      ctx.fillStyle=el.fill||'#000';ctx.fillText(el.text,0,0);
    }else{
      const size=el.size||80;
      ctx.fillStyle=el.fill||'#6366f1';
      if(el.strokeWidth>0){ctx.strokeStyle=el.stroke||'#000';ctx.lineWidth=el.strokeWidth;}
      drawShape(ctx,el.type,0,0,size,el.fill,el.stroke,el.strokeWidth);
    }
    if(i===selectedIdx){ctx.strokeStyle='#6366f1';ctx.lineWidth=2;ctx.setLineDash([4,4]);const b=getBounds(el);ctx.strokeRect(-b.w/2-4,-b.h/2-4,b.w+8,b.h+8);ctx.setLineDash([]);}
    ctx.restore();
  });
}

function drawShape(c,type,x,y,size,fill,stroke,strokeW){
  const s=size/2;
  c.beginPath();
  if(type==='circle'){c.arc(x,y,s,0,Math.PI*2);}
  else if(type==='rect'){c.rect(x-s,y-s,size,size);}
  else if(type==='triangle'){c.moveTo(x,y-s);c.lineTo(x+s,y+s);c.lineTo(x-s,y+s);c.closePath();}
  else if(type==='star'){for(let i=0;i<5;i++){const a=i*4*Math.PI/5-Math.PI/2;const r=i%2===0?s:s*0.4;c[i===0?'moveTo':'lineTo'](x+r*Math.cos(a),y+r*Math.sin(a));}c.closePath();}
  else if(type==='diamond'){c.moveTo(x,y-s);c.lineTo(x+s,y);c.lineTo(x,y+s);c.lineTo(x-s,y);c.closePath();}
  else if(type==='hexagon'){for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;c[i===0?'moveTo':'lineTo'](x+s*Math.cos(a),y+s*Math.sin(a));}c.closePath();}
  else if(type==='ring'){c.arc(x,y,s,0,Math.PI*2);c.moveTo(x+s*0.6,y);c.arc(x,y,s*0.6,0,Math.PI*2,true);}
  c.closePath();
  c.fillStyle=fill;if(c.fill)c.fill();
  if(strokeW>0){c.strokeStyle=stroke;c.lineWidth=strokeW;c.stroke();}
}

function getBounds(el){
  if(el.type==='text'){ctx.font=`bold ${el.fontSize||48}px ${el.font||'Arial'`;const m=ctx.measureText(el.text);return{w:m.width,h:el.fontSize||48};}
  return{w:el.size||80,h:el.size||80};
}

function addText(){
  elements.push({type:'text',text:'Logo',fontSize:48,font:'Arial',fill:'#1a1a1a',stroke:'#000',strokeWidth:0,rotation:0,scale:1,alpha:1,x:C.width/2,y:C.height/2});
  selectedIdx=elements.length-1;render();renderLayers();showPropPanel();saveState();
}

function addShape(type){
  const fills=['#6366f1','#ef4444','#22c55e','#3b82f6','#eab308','#ec4899','#14b8a6','#f97316'];
  elements.push({type,size:80,fill:fills[elements.length%fills.length],stroke:'#000',strokeWidth:0,rotation:0,scale:1,alpha:1,x:C.width/2,y:C.height/2});
  selectedIdx=elements.length-1;render();renderLayers();showPropPanel();saveState();
}

function showPropPanel(){
  const panel=document.getElementById('propPanel');
  if(selectedIdx<0){panel.style.display='none';return;}
  panel.style.display='block';
  const el=elements[selectedIdx];
  document.getElementById('propText').value=el.text||'';
  document.getElementById('propText').parentElement.style.display=el.type==='text'?'flex':'none';
  document.getElementById('propFontSize').value=el.fontSize||48;
  document.getElementById('fontSizeVal').textContent=el.fontSize||48;
  document.getElementById('propFont').value=el.font||'Arial';
  document.getElementById('propFill').value=el.fill||'#6366f1';
  document.getElementById('propStroke').value=el.stroke||'#000';
  document.getElementById('propStrokeW').value=el.strokeWidth||0;
  document.getElementById('strokeWVal').textContent=el.strokeWidth||0;
  document.getElementById('propRotation').value=el.rotation||0;
  document.getElementById('rotationVal').textContent=el.rotation||0;
  document.getElementById('propScale').value=(el.scale||1)*100;
  document.getElementById('scaleVal').textContent=Math.round((el.scale||1)*100)+'%';
  document.getElementById('propAlpha').value=(el.alpha||1)*100;
  document.getElementById('alphaVal').textContent=Math.round((el.alpha||1)*100)+'%';
}

function updateProp(key,val){
  if(selectedIdx<0)return;
  const el=elements[selectedIdx];el[key]=val;
  if(key==='fontSize')document.getElementById('fontSizeVal').textContent=val;
  if(key==='strokeWidth')document.getElementById('strokeWVal').textContent=val;
  if(key==='rotation')document.getElementById('rotationVal').textContent=val;
  if(key==='scale')document.getElementById('scaleVal').textContent=Math.round(val*100)+'%';
  if(key==='alpha')document.getElementById('alphaVal').textContent=Math.round(val*100)+'%';
  render();renderLayers();
}

function renderLayers(){
  const list=document.getElementById('layerList');list.innerHTML='';
  elements.forEach((el,i)=>{
    const item=document.createElement('div');
    item.className='layer-item'+(i===selectedIdx?' active':'');
    const name=document.createElement('span');name.className='layer-name';
    name.textContent=el.type==='text'?(el.text||'文字'):{circle:'圆形',rect:'矩形',triangle:'三角形',star:'五角星',diamond:'菱形',hexagon:'六边形',ring:'圆环'}[el.type];
    item.onclick=()=>{selectedIdx=i;showPropPanel();renderLayers();render()};
    item.appendChild(name);
    list.appendChild(item);
  });
}

function onDown(e){
  const x=e.offsetX,y=e.offsetY;
  for(let i=elements.length-1;i>=0;i--){
    const b=getBounds(elements[i]);
    if(x>elements[i].x-b.w/2&&x<elements[i].x+b.w/2&&y>elements[i].y-b.h/2&&y<elements[i].y+b.h/2){
      selectedIdx=i;dragging=true;dragOffX=x-elements[i].x;dragOffY=y-elements[i].y;
      showPropPanel();renderLayers();render();return;
    }
  }
  selectedIdx=-1;showPropPanel();renderLayers();render();
}

function onMove(e){
  if(!dragging||selectedIdx<0)return;
  elements[selectedIdx].x=e.offsetX-dragOffX;
  elements[selectedIdx].y=e.offsetY-dragOffY;
  render();
}

function onUp(){if(dragging){dragging=false;saveState();}}

function moveLayerUp(){if(selectedIdx<elements.length-1){const t=elements[selectedIdx];elements[selectedIdx]=elements[selectedIdx+1];elements[selectedIdx+1]=t;selectedIdx++;render();renderLayers();saveState();}}
function moveLayerDown(){if(selectedIdx>0){const t=elements[selectedIdx];elements[selectedIdx]=elements[selectedIdx-1];elements[selectedIdx-1]=t;selectedIdx--;render();renderLayers();saveState();}}
function duplicateLayer(){if(selectedIdx>=0){const c=JSON.parse(JSON.stringify(elements[selectedIdx]));c.x+=20;c.y+=20;elements.splice(selectedIdx+1,0,c);selectedIdx++;render();renderLayers();saveState();}}
function deleteLayer(){if(selectedIdx>=0){elements.splice(selectedIdx,1);selectedIdx=-1;document.getElementById('propPanel').style.display='none';render();renderLayers();saveState();}}
function clearAll(){elements=[];selectedIdx=-1;document.getElementById('propPanel').style.display='none';render();renderLayers();saveState();}

function saveState(){undoStack.push(JSON.parse(JSON.stringify(elements.map(e=>({...e}))));redoStack=[];if(undoStack.length>50)undoStack.shift();}
function undo(){if(undoStack.length<=1)return;redoStack.push(undoStack.pop());elements=JSON.parse(JSON.stringify(undoStack[undoStack.length-1]));selectedIdx=-1;document.getElementById('propPanel').style.display='none';render();renderLayers();}
function redo(){if(!redoStack.length)return;const s=redoStack.pop();undoStack.push(s);elements=JSON.parse(JSON.stringify(s));selectedIdx=-1;document.getElementById('propPanel').style.display='none';render();renderLayers();}

function exportPNG(){
  const link=document.createElement('a');link.download='Logo_'+Date.now()+'.png';link.href=C.toDataURL('image/png');link.click();showToast('已导出PNG');
}
function exportTransparent(){
  const tc=document.createElement('canvas');tc.width=C.width;tc.height=C.height;
  const tctx=tc.getContext('2d');
  elements.forEach(el=>{
    tctx.save();tctx.globalAlpha=el.alpha||1;tctx.translate(el.x,el.y);tctx.rotate((el.rotation||0)*Math.PI/180);tctx.scale(el.scale||1,el.scale||1);
    if(el.type==='text'){tctx.font=`bold ${el.fontSize||48}px ${el.font||'Arial'}`;tctx.textAlign='center';tctx.textBaseline='middle';if(el.strokeWidth>0){tctx.strokeStyle=el.stroke;tctx.lineWidth=el.strokeWidth;tctx.strokeText(el.text,0,0);}tctx.fillStyle=el.fill;tctx.fillText(el.text,0,0);}
    else{drawShape(tctx,el.type,0,0,el.size,el.fill,el.stroke,el.strokeWidth);}
    tctx.restore();
  });
  const link=document.createElement('a');link.download='Logo_透明_'+Date.now()+'.png';link.href=tc.toDataURL('image/png');link.click();showToast('已导出透明背景PNG');
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function toggleTheme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';document.querySelector('.theme-toggle').textContent=d.dataset.theme==='dark'?'☀️':'🌙';}

document.addEventListener('keydown',e=>{
  if(e.key==='Delete'||e.key==='Backspace'){if(selectedIdx>=0&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT'){deleteLayer();}}
  if(e.ctrlKey||e.metaKey){if(e.key==='z'){e.preventDefault();undo();}if(e.key==='y'){e.preventDefault();redo();}if(e.key==='s'){e.preventDefault();exportPNG();}}
});

init();
</script>
</body>
</html>
