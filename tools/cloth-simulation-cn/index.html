<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧵 布料模拟</title>
<meta name="description" content="布料模拟 - 实时布料物理模拟，支持风力、重力和交互拖拽">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧵</text></svg>">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.hdr{text-align:center;margin-bottom:16px}.hdr h1{font-size:1.6rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.canvas-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
canvas{display:block;width:100%;cursor:crosshair}
.controls{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.controls .row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.controls label{font-size:.8rem;color:var(--text2);min-width:80px}
.controls input[type=range]{flex:1;accent-color:var(--accent)}
.controls .val{font-size:.8rem;color:var(--accent);min-width:50px;text-align:right}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.85}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{opacity:.85}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.85}
.btn-warn{background:var(--warn);color:#fff}.btn-warn:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.info-bar{display:flex;gap:16px;justify-content:center;color:var(--text2);font-size:.8rem;padding:8px 0}
.info-bar span{color:var(--accent);font-weight:600}
.hint{color:var(--text2);text-align:center;font-size:.8rem;margin-bottom:8px}</style>
</head>
<body>
<div class="hdr"><h1>🧵 布料模拟</h1><p>实时布料物理模拟，支持风力和交互拖拽</p></div>

<div class="hint">拖拽布料任意位置 | 滚轮调整布料大小 | 按住Shift施加风力</div>
<div class="canvas-wrap"><canvas id="cloth"></canvas></div>

<div class="controls">
<div class="row"><label>网格密度</label><input type="range" min="10" max="50" step="2" value="30" id="density"><span class="val">30</span></div>
<div class="row"><label>重力</label><input type="range" min="0" max="2" step="0.05" value="0.5" id="gravity"><span class="val">0.5</span></div>
<div class="row"><label>刚度</label><input type="range" min="0.1" max="1" step="0.05" value="0.9" id="stiffness"><span class="val">0.9</span></div>
<div class="row"><label>阻尼</label><input type="range" min="0.9" max="1" step="0.002" value="0.99" id="damping"><span class="val">0.99</span></div>
<div class="row"><label>风力</label><input type="range" min="0" max="5" step="0.1" value="0" id="wind"><span class="val">0</span></div>
</div>

<div class="btn-row">
<button class="btn btn-primary" onclick="togglePlay()">▶ 播放/暂停</button>
<button class="btn btn-success" onclick="togglePin()">📌 切换固定点</button>
<button class="btn btn-warn" onclick="toggleGravity()">🌍 重力开关</button>
<button class="btn btn-danger" onclick="resetCloth()">↺ 重置</button>
<button class="btn btn-outline" onclick="screenshot()">📷 截图</button>
</div>

<div class="info-bar">FPS: <span id="fps">0</span> | 网格: <span id="meshInfo">0x0</span> | 状态: <span id="state">播放中</span></div>

<script>
const canvas=document.getElementById('cloth'),ctx=canvas.getContext('2d');
let W,H,playing=true,grav=0.5,damp=0.99,stiff=0.9,windForce=0;
let cols=30,rows=20,spacing,points=[],sticks=[],dragPoint=null,gravityOn=true;
let animId,lastTime=0,fpsCount=0,fpsTime=0;

function resize(){
const r=canvas.parentElement.getBoundingClientRect();W=canvas.width=r.width;H=canvas.height=Math.min(500,r.width*0.6);
spacing=Math.min(W/(cols+1),H/(rows+1)*1.5);initCloth();
}

function initCloth(){
points=[];sticks=[];
const startX=(W-cols*spacing)/2;const startY=30;
for(let y=0;y<=rows;y++)for(let x=0;x<=cols;x++){
const px=startX+x*spacing,py=startY+y*spacing;
const pin=y===0&&(x%3===0||x===0||x===cols);
points.push({x:px,y:py,ox:px,oy:py,pinned:pin});
}
for(let y=0;y<=rows;y++)for(let x=0;x<=cols;x++){
const i=y*(cols+1)+x;
if(x<cols)sticks.push({a:i,b:i+1,len:spacing});
if(y<rows)sticks.push({a:i,b:i+cols+1,len:spacing});
}
document.getElementById('meshInfo').textContent=`${cols}x${rows}`;
}

function update(){
const gravity=gravityOn?grav:0;
points.forEach(p=>{
if(p.pinned)return;
const vx=(p.x-p.ox)*damp;const vy=(p.y-p.oy)*damp;
p.ox=p.x;p.oy=p.y;
p.x+=vx+(Math.random()-.5)*0.1;
p.y+=vy+gravity+Math.sin(Date.now()*0.001+p.x*0.01)*windForce*0.5;
if(p.x<5){p.x=5;p.ox=5}if(p.x>W-5){p.x=W-5;p.ox=W-5}
if(p.y<5){p.y=5;p.oy=5}if(p.y>H-5){p.y=H-5;p.oy=H-5}
});
for(let iter=0;iter<5;iter++){
sticks.forEach(s=>{
const a=points[s.a],b=points[s.b];
const dx=b.x-a.x,dy=b.y-a.y;
const dist=Math.sqrt(dx*dx+dy*dy);
const diff=(dist-s.len)/dist*stiff;
const ox=dx*diff*0.5,oy=dy*diff*0.5;
if(!a.pinned){a.x+=ox;a.y+=oy}
if(!b.pinned){b.x-=ox;b.y-=oy}
});
}
}

function draw(){
ctx.fillStyle='rgba(10,10,15,0.4)';ctx.fillRect(0,0,W,H);

ctx.beginPath();ctx.strokeStyle='rgba(100,160,255,0.4)';ctx.lineWidth=0.5;
sticks.forEach(s=>{
const a=points[s.a],b=points[s.b];
ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
});
ctx.stroke();

for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
const i=y*(cols+1)+x;
const p00=points[i],p10=points[i+1],p01=points[i+cols+1],p11=points[i+cols+2];
const cx=(p00.x+p10.x+p01.x+p11.x)/4;
const cy=(p00.y+p10.y+p01.y+p11.y)/4;
const dy=(p01.y+p00.y)/2-(p11.y+p10.y)/2;
const shade=Math.max(0,Math.min(1,0.3+dy*0.008));
const hue=200+x*2+y*3;
ctx.fillStyle=`hsla(${hue%360},60%,${shade*100}%,0.7)`;
ctx.beginPath();ctx.moveTo(p00.x,p00.y);ctx.lineTo(p10.x,p10.y);ctx.lineTo(p11.x,p11.y);ctx.lineTo(p01.x,p01.y);ctx.closePath();ctx.fill();
}

points.filter(p=>p.pinned).forEach(p=>{
ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();
});
}

function animate(t){
if(!playing){animId=requestAnimationFrame(animate);return}
fpsCount++;if(t-fpsTime>1000){document.getElementById('fps').textContent=fpsCount;fpsCount=0;fpsTime=t}
update();draw();animId=requestAnimationFrame(animate);
}

function togglePlay(){playing=!playing;document.getElementById('state').textContent=playing?'播放中':'暂停'}
function resetCloth(){initCloth()}
function toggleGravity(){gravityOn=!gravityOn}
function togglePin(){
points.forEach(p=>{if(!p.pinned&&Math.random()<0.1)p.pinned=true});
}
function screenshot(){const link=document.createElement('a');link.download='cloth.png';link.href=canvas.toDataURL();link.click()}

canvas.addEventListener('mousedown',e=>{
const rect=canvas.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
let closest=null,minD=25;
points.forEach(p=>{const d=Math.hypot(p.x-mx,p.y-my);if(d<minD){minD=d;closest=p}});
if(closest){dragNode=closest;dragNode.pinned=true}
});
canvas.addEventListener('mousemove',e=>{
if(!dragNode)return;
const rect=canvas.getBoundingClientRect();
dragNode.x=e.clientX-rect.left;dragNode.y=e.clientY-rect.top;
dragNode.ox=dragNode.x;dragNode.oy=dragNode.y;
});
canvas.addEventListener('mouseup',()=>{if(dragNode)dragNode.pinned=false;dragNode=null});
canvas.addEventListener('mouseleave',()=>{if(dragNode)dragNode.pinned=false;dragNode=null});

canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const rect=canvas.getBoundingClientRect();
let closest=null,minD=30;
points.forEach(p=>{const d=Math.hypot(p.x-(t.clientX-rect.left),p.y-(t.clientY-rect.top));if(d<minD){minD=d;closest=p}});
if(closest){dragNode=closest;dragNode.pinned=true}},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!dragNode)return;const t=e.touches[0];const rect=canvas.getBoundingClientRect();
dragNode.x=t.clientX-rect.left;dragNode.y=t.clientY-rect.top;dragNode.ox=dragNode.x;dragNode.oy=dragNode.y},{passive:false});
canvas.addEventListener('touchend',()=>{if(dragNode)dragNode.pinned=false;dragNode=null});

canvas.addEventListener('wheel',e=>{
e.preventDefault();
cols=Math.max(10,Math.min(50,cols+(e.deltaY>0?-2:2)));
rows=Math.max(10,Math.min(40,rows+(e.deltaY>0?-1:1)));
document.getElementById('density').value=cols;document.getElementById('density').nextElementSibling.textContent=cols;
resize();
},{passive:false});

document.getElementById('density').oninput=function(){cols=rows=+this.value;this.nextElementSibling.textContent=cols;resize()};
document.getElementById('gravity').oninput=function(){grav=+this.value;this.nextElementSibling.textContent=grav};
document.getElementById('stiffness').oninput=function(){stiff=+this.value;this.nextElementSibling.textContent=stiff};
document.getElementById('damping').oninput=function(){damp=+this.value;this.nextElementSibling.textContent=damp};
document.getElementById('wind').oninput=function(){windForce=+this.value;this.nextElementSibling.textContent=windForce};

resize();requestAnimationFrame(animate);
window.addEventListener('resize',resize);
</script>
</body></html>
