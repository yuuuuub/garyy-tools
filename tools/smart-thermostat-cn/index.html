<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌡️ 智能温控器</title>
<meta name="description" content="智能温控器远程调节温度，设置节能模式与定时计划">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.temp-control{text-align:center;padding:30px;border-radius:var(--radius);background:var(--bg);margin-bottom:16px}
.temp-display{font-size:5rem;font-weight:700;margin:20px 0}
.temp-display .unit{font-size:2rem;color:var(--text2)}
.temp-buttons{display:flex;justify-content:center;gap:20px;margin:20px 0}
.temp-btn{width:60px;height:60px;border-radius:50%;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:1.5rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.temp-btn:hover{border-color:var(--accent);background:rgba(59,130,246,.1)}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.mode-btn{padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;text-align:center;transition:all .2s}
.mode-btn:hover{border-color:var(--accent)}
.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mode-btn .icon{font-size:1.5rem;margin-bottom:4px}
.mode-btn .label{font-size:.8rem}
.schedule-list{display:flex;flex-direction:column;gap:8px}
.schedule-item{padding:12px;background:var(--bg);border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.schedule-info{display:flex;align-items:center;gap:12px}
.schedule-icon{font-size:1.5rem}
.schedule-time{font-weight:600}
.schedule-days{font-size:.8rem;color:var(--text2)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.stat-label{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.stat-value{font-size:1.5rem;font-weight:700;color:var(--accent)}
.humidity-bar{height:12px;background:var(--border);border-radius:6px;overflow:hidden;margin:12px 0}
.humidity-fill{height:100%;background:linear-gradient(90deg,var(--warn),var(--accent));transition:width .5s}
.settings-group{margin-bottom:16px}
.settings-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px}
.settings-group input[type=text],.settings-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
.toggle-group{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.toggle-group:last-child{border-bottom:none}
.toggle{width:50px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background .2s;cursor:pointer}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s}
.toggle.on::after{transform:translateX(24px)}
button{padding:8px 16px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌡️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🌡️ 智能温控器">
<meta property="og:description" content="智能温控器远程调节温度，设置节能模式与定时计划">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🌡️ 智能温控器</h1><p>远程调节室内温度，创造舒适环境</p></div>

<div class="cd">
<div class="temp-control">
<div style="font-size:1.2rem;color:var(--text2)">当前温度</div>
<div class="temp-display"><span id="currentTemp">24.5</span><span class="unit">°C</span></div>
<div style="font-size:1rem;color:var(--text2)">目标温度</div>
<div class="temp-buttons">
<button class="temp-btn" onclick="adjustTemp(-0.5)">-</button>
<div style="font-size:2rem;font-weight:700" id="targetTemp">24.0</div>
<button class="temp-btn" onclick="adjustTemp(0.5)">+</button>
</div>
<div style="font-size:.85rem;color:var(--text2)">湿度: <span id="humidity">45</span>%</div>
<div class="humidity-bar"><div class="humidity-fill" id="humidityFill" style="width:45%"></div></div>
</div>
</div>

<div class="cd">
<h2>运行模式</h2>
<div class="mode-grid" id="modeGrid"></div>
</div>

<div class="cd">
<h2>定时计划</h2>
<div class="schedule-list" id="scheduleList"></div>
<div style="margin-top:12px">
<button onclick="addSchedule()">+ 添加计划</button>
</div>
</div>

<div class="cd">
<h2>能源统计</h2>
<div class="stats-grid">
<div class="stat-card">
<div class="stat-label">今日运行</div>
<div class="stat-value" id="todayRunTime">6.5</div>
<div style="font-size:.8rem;color:var(--text2)">小时</div>
</div>
<div class="stat-card">
<div class="stat-label">本月运行</div>
<div class="stat-value" id="monthRunTime">128</div>
<div style="font-size:.8rem;color:var(--text2)">小时</div>
</div>
<div class="stat-card">
<div class="stat-label">今日能耗</div>
<div class="stat-value" id="todayEnergy">8.2</div>
<div style="font-size:.8rem;color:var(--text2)">千瓦时</div>
</div>
<div class="stat-card">
<div class="stat-label">本月能耗</div>
<div class="stat-value" id="monthEnergy">156</div>
<div style="font-size:.8rem;color:var(--text2)">千瓦时</div>
</div>
</div>
</div>

<div class="cd">
<h2>温控设置</h2>
<div class="settings-group">
<label>温控器名称</label>
<input type="text" id="thermostatName" value="客厅温控器" onchange="saveSettings()">
</div>
<div class="settings-group">
<label>温度范围</label>
<select id="tempRange" onchange="saveSettings()">
<option value="16-30" selected>16°C - 30°C</option>
<option value="10-35">10°C - 35°C</option>
</select>
</div>
<div class="toggle-group">
<span>节能模式</span>
<div class="toggle on" id="ecoToggle" onclick="toggleSetting('eco')"></div>
</div>
<div class="toggle-group">
<span>儿童锁</span>
<div class="toggle" id="childLockToggle" onclick="toggleSetting('childLock')"></div>
</div>
<div class="toggle-group">
<span>自适应学习</span>
<div class="toggle on" id="learningToggle" onclick="toggleSetting('learning')"></div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let targetTemp=24.0;
let currentTemp=24.5;
let humidity=45;
let currentMode='cool';
let schedules=JSON.parse(localStorage.getItem('st_schedules')||'[]');
let settings=JSON.parse(localStorage.getItem('st_settings')||'{"name":"客厅温控器","range":"16-30","eco":true,"childLock":false,"learning":true}');
const modes=[
  {id:'cool',icon:'❄️',label:'制冷'},
  {id:'heat',icon:'🔥',label:'制热'},
  {id:'auto',icon:'🔄',label:'自动'},
  {id:'dry',icon:'💨',label:'除湿'},
  {id:'fan',icon:'🌀',label:'送风'},
  {id:'eco',icon:'🌿',label:'节能'}
];

function saveSchedules(){localStorage.setItem('st_schedules',JSON.stringify(schedules));}
function saveSettings(){localStorage.setItem('st_settings',JSON.stringify(settings));}

function updateUI(){
  $('currentTemp').textContent=currentTemp.toFixed(1);
  $('targetTemp').textContent=targetTemp.toFixed(1);
  $('humidity').textContent=humidity;
  $('humidityFill').style.width=humidity+'%';
  $('thermostatName').value=settings.name;
  $('tempRange').value=settings.range;
  ['eco','childLock','learning'].forEach(key=>{
    $(key+'Toggle').className='toggle '+(settings[key]?'on':'');
  });
  renderModes();
}

function renderModes(){
  $('modeGrid').innerHTML=modes.map(m=>`
    <div class="mode-btn ${m.id===currentMode?'active':''}" onclick="setMode('${m.id}')">
      <div class="icon">${m.icon}</div>
      <div class="label">${m.label}</div>
    </div>
  `).join('');
}

function setMode(mode){
  currentMode=mode;
  renderModes();
}

function adjustTemp(delta){
  targetTemp=Math.max(16,Math.min(30,targetTemp+delta));
  updateUI();
}

function renderSchedules(){
  $('scheduleList').innerHTML=schedules.map((s,i)=>`
    <div class="schedule-item">
      <div class="schedule-info">
        <div class="schedule-icon">${s.mode==='cool'?'❄️':s.mode==='heat'?'🔥':'🔄'}</div>
        <div>
          <div class="schedule-time">${s.time} - ${s.temp}°C</div>
          <div class="schedule-days">${s.days.join(', ')}</div>
        </div>
      </div>
      <button onclick="removeSchedule(${i})" style="background:var(--danger)">删除</button>
    </div>
  `).join('');
}

function addSchedule(){
  const time=prompt('设置时间 (HH:MM):');
  const temp=prompt('目标温度:');
  const mode=prompt('模式 (cool/heat/auto):');
  if(time&&temp&&mode){
    schedules.push({time,temp:parseFloat(temp),mode,days:['周一','周二','周三','周四','周五']});
    saveSchedules();
    renderSchedules();
  }
}

function removeSchedule(index){
  schedules.splice(index,1);
  saveSchedules();
  renderSchedules();
}

function toggleSetting(key){
  settings[key]=!settings[key];
  saveSettings();
  updateUI();
}

function updateTemp(){
  const diff=targetTemp-currentTemp;
  currentTemp+=diff*0.1+(Math.random()-0.5)*0.2;
  humidity=Math.max(30,Math.min(70,humidity+(Math.random()-0.5)*2));
  updateUI();
}

// Initialize with sample data
if(schedules.length===0){
  schedules=[
    {time:'07:00',temp:22,mode:'heat',days:['周一','周二','周三','周四','周五','周六','周日']},
    {time:'22:00',temp:18,mode:'cool',days:['周一','周二','周三','周四','周五','周六','周日']},
    {time:'12:00',temp:24,mode:'auto',days:['周六','周日']}
  ];
  saveSchedules();
}

updateUI();
renderSchedules();
setInterval(updateTemp,5000);
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
