<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无障碍测试</title>
<meta name="description" content="网页无障碍功能测试工具，评估网站可访问性">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#238636;--red:#da3633;--yellow:#9e6a03;--dim:#8b949e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--dim);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
textarea{width:100%;min-height:200px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:12px;font-family:'Fira Code',monospace;font-size:13px;resize:vertical}
button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px 20px;font-size:14px;cursor:pointer;font-weight:600;transition:opacity .2s}
button:hover{opacity:.85}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.results{display:none;margin-top:16px}
.result-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
.result-item:last-child{border-bottom:none}
.line-num{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-family:monospace;font-size:12px;color:var(--dim);white-space:nowrap;flex-shrink:0}
.msg-error{color:var(--red)}
.msg-warn{color:var(--yellow)}
.msg-info{color:var(--accent)}
.icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}
.summary{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.summary-item{padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600}
.s-error{background:#da363333;color:var(--red)}
.s-warn{background:#9e6a0333;color:var(--yellow)}
.s-info{background:#3b82f633;color:var(--accent)}
.s-pass{background:#23863633;color:var(--green)}
.score-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:8px}
.score-fill{height:100%;border-radius:4px;transition:width .3s}
.score-label{font-size:13px;color:var(--dim);margin-top:4px}
@media(max-width:600px){textarea{min-height:150px}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="无障碍测试">
  <meta property="og:description" content="网页无障碍功能测试工具，评估网站可访问性">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/accessibility-tester/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<h1>♿ 无障碍测试</h1>
<p class="subtitle">分析 HTML 代码的无障碍问题，提升可访问性</p>

<div class="card">
<textarea id="htmlInput" placeholder="在此粘贴 HTML 代码..."></textarea>
<div class="btn-row">
<button onclick="analyze()">分析</button>
<button onclick="loadExample()" style="background:var(--border)">示例</button>
<button onclick="clearAll()" style="background:var(--border)">清空</button>
</div>
</div>

<div class="results" id="results">
<div class="card">
<h2 style="margin-bottom:8px">无障碍评分</h2>
<div class="score-bar"><div class="score-fill" id="scoreFill"></div></div>
<div class="score-label" id="scoreLabel"></div>
<div class="summary" id="summary" style="margin-top:16px"></div>
<div id="resultList"></div>
</div>
</div>
</div>

<script>
function analyze(){
const html=document.getElementById('htmlInput').value;
if(!html.trim()){garyyToast('请输入HTML代码');return;}
const lines=html.split('\n');
const issues=[];
const parser=new DOMParser();
const doc=parser.parseFromString(html,'text/html');
const allTags=['img','a','button','input','select','textarea','label','h1','h2','h3','h4','h5','h6','table','th','td','form','nav','main','header','footer','aside','section','article','figure','figcaption','video','audio','iframe','div','span'];
const skipTags=['html','head','meta','title','link','style','script','br','hr','!doctype','DOCTYPE','body','noscript','template'];
allTags.forEach(tag=>{
const tagRe=new RegExp(`<${tag}[\\s>]`,'gi');
let match;
while((match=tagRe.exec(html))!==null){
const before=html.substring(0,match.index);
const lineNum=before.split('\n').length;
const fullTag=match[0];
if(tag==='img'){
if(!fullTag.match(/alt\s*=/i)){
issues.push({line:lineNum,type:'error',tag:'img',msg:'<img loading="lazy"> 缺少 alt 属性，屏幕阅读器无法描述图片',fix:'添加 alt="描述文字" 或 alt=""（装饰图）'});
}
const srcMatch=fullTag.match(/src\s*=\s*["']([^"']*)["']/i);
if(srcMatch&&srcMatch[1].length>100){
issues.push({line:lineNum,type:'warn',tag:'img',msg:'图片 src 路径过长，考虑使用相对路径或CDN'});
}
}
if(tag==='a'){
if(!fullTag.match(/href\s*=/i)){
issues.push({line:lineNum,type:'error',tag:'a',msg:'<a> 缺少 href 属性，无法被键盘导航聚焦',fix:'添加 href 属性或改用 <button>'});
}
const textMatch=fullTag.match(/>([^<]*)</);
if(textMatch&&textMatch[1].trim()===''){
issues.push({line:lineNum,type:'warn',tag:'a',msg:'<a> 内容为空，无有意义的链接文本',fix:'添加链接文本或 aria-label'});
}
if(fullTag.match(/href\s*=\s*["']javascript:/i)){
issues.push({line:lineNum,type:'error',tag:'a',msg:'使用了 javascript: URL，安全和无障碍问题',fix:'改用 button 元素和 JS 事件处理'});
}
}
if(tag==='button'){
const textMatch=fullTag.match(/>([^<]*)</);
if(!textMatch||textMatch[1].trim()===''){
if(!fullTag.match(/aria-label\s*=/i)){
issues.push({line:lineNum,type:'error',tag:'button',msg:'<button> 没有文本内容或 aria-label',fix:'添加按钮文本或 aria-label 属性'});
}
}
}
if(tag==='input'){
const typeMatch=fullTag.match(/type\s*=\s*["']([^"']*)["']/i);
const inputType=typeMatch?typeMatch[1].toLowerCase():'text';
if(!fullTag.match(/aria-label\s*=/i)&&!fullTag.match(/aria-labelledby\s*=/i)){
const idMatch=fullTag.match(/id\s*=\s*["']([^"']*)["']/i);
const hasLabel=idMatch?doc.querySelector(`label[for="${idMatch[1]}"]`):null;
if(!hasLabel&&inputType!=='hidden'&&inputType!=='submit'&&inputType!=='button'){
issues.push({line:lineNum,type:'error',tag:'input',msg:`<input type="${inputType}"> 缺少关联的 label`,fix:'添加 <label for="id"> 或 aria-label'});
}
}
if(inputType==='password'&&fullTag.match(/autocomplete\s*=\s*["']on["']/i)){
issues.push({line:lineNum,type:'warn',tag:'input',msg:'密码输入框不建议使用 autocomplete="on"',fix:'使用 autocomplete="current-password" 或 "new-password"'});
}
}
if(tag==='select'||tag==='textarea'){
const idMatch=fullTag.match(/id\s*=\s*["']([^"']*)["']/i);
if(idMatch){
const hasLabel=doc.querySelector(`label[for="${idMatch[1]}"]`);
if(!hasLabel){
issues.push({line:lineNum,type:'error',tag:tag,msg:`<${tag}> 缺少关联的 <label>`,fix:`添加 <label for="${idMatch[1]}">`});
}
}
}
if(tag==='h1'||tag==='h2'||tag==='h3'||tag==='h4'||tag==='h5'||tag==='h6'){
const level=parseInt(tag[1]);
const prevH=document.querySelectorAll('h1,h2,h3,h4,h5,h6');
let lastLevel=0;
prevH.forEach(h=>{
const hLevel=parseInt(h.tagName[1]);
if(hLevel<=lastLevel&&lastLevel!==0){
issues.push({line:lineNum,type:'warn',tag:tag,msg:`标题层级跳跃: 从 h${lastLevel} 跳到 h${level}`,fix:'确保标题层级依次递增'});
}
lastLevel=hLevel;
});
}
if(tag==='table'){
if(!fullTag.match(/role\s*=\s*["']table["']/i)&&!fullTag.match(/role\s*=\s*["']grid["']/i)){
issues.push({line:lineNum,type:'warn',tag:'table',msg:'表格缺少 <caption> 或 scope 属性',fix:'添加 <caption> 描述表格内容'});
}
}
if(tag==='div'||tag==='span'){
if(fullTag.match(/role\s*=\s*["']button["']/i)){
if(!fullTag.match(/tabindex\s*=/i)){
issues.push({line:lineNum,type:'error',tag:tag,msg:`<${tag} role="button"> 缺少 tabindex`,fix:'添加 tabindex="0" 使其可聚焦'});
}
if(!fullTag.match(/onkeydown\s*=/i)&&!fullTag.match(/onkeyup\s*=/i)){
issues.push({line:lineNum,type:'warn',tag:tag,msg:`<${tag} role="button"> 缺少键盘事件处理`,fix:'添加 keydown 事件处理 Enter 和 Space 键'});
}
}
}
if(tag==='video'||tag==='audio'){
if(!fullTag.match(/<track[\s>]/i)){
issues.push({line:lineNum,type:'warn',tag:tag,msg:`<${tag}> 缺少 <track> 字幕`,fix:'添加字幕轨道 <track kind="captions">'});
}
}
if(tag==='iframe'){
if(!fullTag.match(/title\s*=/i)){
issues.push({line:lineNum,type:'error',tag:tag,msg:'<iframe> 缺少 title 属性',fix:'添加 title="描述"'});
}
}
});
const hasLang=html.match(/<html lang="zh-CN"[^>]*lang\s*=/i);
if(!hasLang){
issues.push({line:1,type:'error',tag:'html',msg:'<html> 缺少 lang 属性',fix:'添加 lang="zh-CN" 或其他语言代码'});
}
const hasTitle=html.match(/<title>[^<]+<\/title>/i);
if(!hasTitle){
issues.push({line:1,type:'error',tag:'title',msg:'缺少 <title> 标签，屏幕阅读器无法识别页面标题',fix:'在 <head> 中添加 <title>'});
}
const h1Count=(html.match(/<h1[\s>]/gi)||[]).length;
if(h1Count===0){
issues.push({line:1,type:'warn',tag:'h1',msg:'页面缺少 <h1> 标题',fix:'添加一个 <h1> 作为主标题'});
}else if(h1Count>1){
issues.push({line:1,type:'warn',tag:'h1',msg:`页面有 ${h1Count} 个 <h1>，通常建议只有一个`,fix:'将多余的 <h1> 改为 <h2>'});
}
const forms=html.match(/<form[\s>]/gi)||[];
const ariaLandmarks=(html.match(/role\s*=\s*["'](?:banner|main|contentinfo|navigation|complementary|search)["']/gi)||[]).length;
const htmlLandmarks=(html.match(/<(header|main|footer|nav|aside)[\s>]/gi)||[]).length;
if(ariaLandmarks+htmlLandmarks===0&&forms.length===0){
issues.push({line:1,type:'info',tag:'landmark',msg:'缺少语义化标签（header/main/footer/nav）',fix:'使用语义化标签组织页面结构'});
}
const focusVisible=html.match(/:focus\s*\{[^}]*outline\s*:\s*none/gi);
if(focusVisible){
issues.push({line:1,type:'error',tag:'css',msg:'使用了 outline:none，键盘用户无法看到焦点位置',fix:'提供 :focus-visible 替代样式'});
}
showResults(issues);
}
function showResults(issues){
document.getElementById('results').style.display='block';
const errors=issues.filter(i=>i.type==='error').length;
const warns=issues.filter(i=>i.type==='warn').length;
const infos=issues.filter(i=>i.type==='info').length;
const total=errors+warns+infos;
const score=total===0?100:Math.max(0,100-errors*15-warns*5-infos*2);
const scoreFill=document.getElementById('scoreFill');
scoreFill.style.width=score+'%';
scoreFill.style.background=score>=80?'var(--green)':score>=50?'var(--yellow)':'var(--red)';
document.getElementById('scoreLabel').textContent=`${score}/100 分`;
let summaryHtml='';
if(errors===0&&warns===0)summaryHtml+=`<div class="summary-item s-pass">✅ 无障碍表现良好</div>`;
if(errors>0)summaryHtml+=`<div class="summary-item s-error">❌ ${errors} 个错误（必须修复）</div>`;
if(warns>0)summaryHtml+=`<div class="summary-item s-warn">⚠️ ${warns} 个警告（建议修复）</div>`;
if(infos>0)summaryHtml+=`<div class="summary-item s-info">💡 ${infos} 个建议</div>`;
document.getElementById('summary').innerHTML=summaryHtml;
let html='';
if(issues.length===0){
html='<div style="text-align:center;color:var(--green);padding:20px">🎉 未发现无障碍问题！页面可访问性很好。</div>';
}else{
issues.forEach(i=>{
const icon=i.type==='error'?'❌':i.type==='warn'?'⚠️':'💡';
const cls=i.type==='error'?'msg-error':i.type==='warn'?'msg-warn':'msg-info';
html+=`<div class="result-item"><span class="icon">${icon}</span><span class="line-num">行 ${i.line}</span><span class="${cls}">${esc(i.msg)}${i.fix?`<div class="suggestion" style="background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 10px;margin-top:4px;font-size:12px;color:var(--dim)">🔧 ${esc(i.fix)}</div>`:''}</span></div>`;
});
}
document.getElementById('resultList').innerHTML=html;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function loadExample(){
document.getElementById('htmlInput').value=`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>
<body>
<header>
<nav>
<a href="/">首页</a>
<a href="/about">关于</a>
<a href="javascript:void(0)">菜单</a>
</nav>
</header>

<main>
<h1>欢迎</h1>
<h3>关于我们</h3>
<h5>团队介绍</h5>

<img src="banner.jpg" loading="lazy">
<img src="photo.png" alt="风景照片" loading="lazy">

<form>
<div class="field">
<input type="text" id="name" placeholder="请输入姓名" title="Enter键搜索">
</div>
<div class="field">
<input type="email" id="email">
</div>
<select id="city">
<option>北京</option>
<option>上海</option>
</select>
<button></button>
<button type="submit">提交</button>
</form>

<div role="button">点击我</div>

<table>
<tr><th>姓名</th><th>年龄</th></tr>
<tr><td>张三</td><td>25</td></tr>
</table>

<video src="intro.mp4"></video>
<iframe src="https://example.com"></iframe>

<a href="/page">了解更多</a>
<a href="/link"></a>
<a href="/link2"><img src="icon.png" loading="lazy"></a>

<style>
:focus { outline: none; }
</style>
</main>
<script src="../i18n.js" defer></script>
</body>
</html>`;
}
function clearAll(){document.getElementById('htmlInput').value='';document.getElementById('results').style.display='none';}
</script>
</body>
</html>
