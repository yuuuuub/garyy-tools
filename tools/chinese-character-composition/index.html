function analyzeComposition(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=compositionData[char];
  if(!data){
    data={components:['?'],type:'未知',meaning:'暂无信息',structure:'未知',strokes:char.length*2,radical:'未知'};
  }
  var html='<div class="card">';
  html+='<div class="composition-display">';
  data.components.forEach(function(comp,index){
    if(index>0)html+='<div class="composition-plus">+</div>';
    html+='<div class="composition-char">'+comp+'</div>';
  });
  html+='<div class="composition-equals">=</div>';
  html+='<div class="composition-result">'+char+'</div>';
  html+='</div>';
  html+='<div class="info-grid">';
  html+='<div class="info-item"><div class="info-value">'+data.type+'</div><div class="info-label">造字法</div></div>';
  html+='<div class="info-item"><div class="info-value">'+data.structure+'</div><div class="info-label">结构类型</div></div>';
  html+='<div class="info-item"><div class="info-value">'+data.strokes+'</div><div class="info-label">笔画数</div></div>';
  html+='<div class="info-item"><div class="info-value">'+data.radical+'</div><div class="info-label">部首</div></div>';
  html+='</div>';
  html+='<div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>构成说明：</strong>'+data.meaning+'</div>';
  html+='<div><strong>构成部件：</strong>'+data.components.join(' + ')+'</div>';
  html+='</div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(compositionData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  analyzeComposition();
}
analyzeComposition();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
