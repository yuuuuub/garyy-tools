function getStrokeOrder(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var order=strokeOrders[char];
  if(!order){
    order={strokes:['一','丨','𠃍','丿','㇏'],names:['横','竖','横折','撇','捺'],total:5};
  }
  var html='<div class="card">';
  html+='<div style="text-align:center;padding:20px">';
  html+='<div style="font-size:6rem;font-weight:700;color:var(--blue)">'+char+'</div>';
  html+='<div style="font-size:1.2rem;margin-top:8px">共 <strong>'+order.total+'</strong> 画</div>';
  html+='</div>';
  html+='<div class="section"><h3>笔顺分解</h3>';
  html+='<div class="stroke-display">';
  order.strokes.forEach(function(stroke,index){
    html+='<div class="stroke-item">';
    html+='<div>'+stroke+'</div>';
    html+='<div class="stroke-number">第'+(index+1)+'画</div>';
    html+='<div class="stroke-name">'+order.names[index]+'</div>';
    html+='</div>';
  });
  html+='</div></div>';
  html+='<div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>笔顺：</strong>'+order.strokes.join(' → ')+'</div>';
  html+='<div><strong>笔画名称：</strong>'+order.names.join('，')+'</div>';
  html+='</div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(strokeOrders);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  getStrokeOrder();
}
