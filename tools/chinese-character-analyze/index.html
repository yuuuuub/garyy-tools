<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字分析</title><meta name="description" content="汉字分析 - 在线分析汉字"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.character-display{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.character-main{font-size:6rem;font-weight:700;color:var(--blue)}.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}.info-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}.info-value{font-size:1.2rem;font-weight:600;color:var(--blue)}.info-label{font-size:.8rem;color:var(--text2);margin-top:4px}</style><meta property="og:title" content="汉字分析"><meta property="og:description" content="汉字分析 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div class="container"><h1>🔬 汉字分析</h1><p class="sub">在线分析汉字</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="analyzeCharacter()">
</div>
<button class="btn" onclick="analyzeCharacter()">分析</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var characters={
  '一':{pinyin:'yī',strokes:1,radical:'一',structure:'独体字',meaning:'一，第一',unicode:'U+4E00',frequency:'常用'},
  '二':{pinyin:'èr',strokes:2,radical:'二',structure:'独体字',meaning:'二，第二',unicode:'U+4E8C',frequency:'常用'},
  '三':{pinyin:'sān',strokes:3,radical:'一',structure:'独体字',meaning:'三，第三',unicode:'U+4E09',frequency:'常用'},
  '四':{pinyin:'sì',strokes:5,radical:'囗',structure:'全包围结构',meaning:'四，第四',unicode:'U+56DB',frequency:'常用'},
  '五':{pinyin:'wǔ',strokes:4,radical:'一',structure:'独体字',meaning:'五，第五',unicode:'U+4E94',frequency:'常用'},
  '六':{pinyin:'liù',strokes:4,radical:'八',structure:'上下结构',meaning:'六，第六',unicode:'U+516D',frequency:'常用'},
  '七':{pinyin:'qī',strokes:2,radical:'一',structure:'独体字',meaning:'七，第七',unicode:'U+4E03',frequency:'常用'},
  '八':{pinyin:'bā',strokes:2,radical:'八',structure:'独体字',meaning:'八，第八',unicode:'U+516B',frequency:'常用'},
  '九':{pinyin:'jiǔ',strokes:2,radical:'丿',structure:'独体字',meaning:'九，第九',unicode:'U+4E5D',frequency:'常用'},
  '十':{pinyin:'shí',strokes:2,radical:'十',structure:'独体字',meaning:'十，第十',unicode:'U+5341',frequency:'常用'},
  '大':{pinyin:'dà',strokes:3,radical:'大',structure:'独体字',meaning:'大的，巨大',unicode:'U+5927',frequency:'常用'},
  '小':{pinyin:'xiǎo',strokes:3,radical:'小',structure:'独体字',meaning:'小的，微小',unicode:'U+5C0F',frequency:'常用'},
  '多':{pinyin:'duō',strokes:6,radical:'夕',structure:'上下结构',meaning:'多的，很多',unicode:'U+591A',frequency:'常用'},
  '少':{pinyin:'shǎo',strokes:4,radical:'小',structure:'独体字',meaning:'少的，很少',unicode:'U+5C11',frequency:'常用'},
  '上':{pinyin:'shàng',strokes:3,radical:'一',structure:'独体字',meaning:'上面，上方',unicode:'U+4E0A',frequency:'常用'},
  '下':{pinyin:'xià',strokes:3,radical:'一',structure:'独体字',meaning:'下面，下方',unicode:'U+4E0B',frequency:'常用'},
  '左':{pinyin:'zuǒ',strokes:5,radical:'工',structure:'半包围结构',meaning:'左边，左侧',unicode:'U+5DE6',frequency:'常用'},
  '右':{pinyin:'yòu',strokes:5,radical:'口',structure:'半包围结构',meaning:'右边，右侧',unicode:'U+53F3',frequency:'常用'},
  '前':{pinyin:'qián',strokes:9,radical:'刂',structure:'上下结构',meaning:'前面，前方',unicode:'U+524D',frequency:'常用'},
  '后':{pinyin:'hòu',strokes:6,radical:'口',structure:'半包围结构',meaning:'后面，后方',unicode:'U+540E',frequency:'常用'},
  '东':{pinyin:'dōng',strokes:5,radical:'一',structure:'独体字',meaning:'东方，东边',unicode:'U+4E1C',frequency:'常用'},
  '西':{pinyin:'xī',strokes:6,radical:'西',structure:'独体字',meaning:'西方，西边',unicode:'U+897F',frequency:'常用'},
  '南':{pinyin:'nán',strokes:9,radical:'十',structure:'上下结构',meaning:'南方，南边',unicode:'U+5357',frequency:'常用'},
  '北':{pinyin:'běi',strokes:5,radical:'匕',structure:'左右结构',meaning:'北方，北边',unicode:'U+5317',frequency:'常用'},
  '天':{pinyin:'tiān',strokes:4,radical:'大',structure:'独体字',meaning:'天空，一天',unicode:'U+5929',frequency:'常用'},
  '地':{pinyin:'dì',strokes:6,radical:'土',structure:'左右结构',meaning:'地面，土地',unicode:'U+5730',frequency:'常用'},
  '人':{pinyin:'rén',strokes:2,radical:'人',structure:'独体字',meaning:'人类，人们',unicode:'U+4EBA',frequency:'常用'},
  '口':{pinyin:'kǒu',strokes:3,radical:'口',structure:'独体字',meaning:'嘴，口',unicode:'U+53E3',frequency:'常用'},
  '日':{pinyin:'rì',strokes:4,radical:'日',structure:'独体字',meaning:'太阳，日子',unicode:'U+65E5',frequency:'常用'},
  '月':{pinyin:'yuè',strokes:4,radical:'月',structure:'独体字',meaning:'月亮，月份',unicode:'U+6708',frequency:'常用'},
  '水':{pinyin:'shuǐ',strokes:4,radical:'水',structure:'独体字',meaning:'水，液体',unicode:'U+6C34',frequency:'常用'},
  '火':{pinyin:'huǒ',strokes:4,radical:'火',structure:'独体字',meaning:'火，火焰',unicode:'U+706B',frequency:'常用'},
  '木':{pinyin:'mù',strokes:4,radical:'木',structure:'独体字',meaning:'木头，树木',unicode:'U+6728',frequency:'常用'},
  '金':{pinyin:'jīn',strokes:8,radical:'金',structure:'独体字',meaning:'金属，黄金',unicode:'U+91D1',frequency:'常用'},
  '土':{pinyin:'tǔ',strokes:3,radical:'土',structure:'独体字',meaning:'土壤，土地',unicode:'U+571F',frequency:'常用'}
};
function analyzeCharacter(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=characters[char];
  if(!data){
    data={pinyin:'未知',strokes:0,radical:'未知',structure:'未知',meaning:'暂无信息',unicode:'U+'+char.charCodeAt(0).toString(16).toUpperCase(),frequency:'未知'};
  }
  var html='<div class="card">';
  html+='<div class="character-display">';
  html+='<div class="character-main">'+char+'</div>';
  html+='</div>';
  html+='<div class="info-grid">';
  html+='<div class="info-item"><div class="info-value">'+data.pinyin+'</div><div class="info-label">拼音</div></div>';
  html+='<div class="info-item"><div class="info-value">'+data.strokes+'</div><div class="info-label">笔画数</div></div>';
  html+='<div class="info-item"><div class="info-value">'+data.radical+'</div><div class="info-label">部首</div></div>';
  html+='<div class="info-item"><div class="info-value">'+data.structure+'</div><div class="info-label">结构</div></div>';
  html+='</div>';
  html+='<div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>含义：</strong>'+data.meaning+'</div>';
  html+='<div><strong>Unicode：</strong>'+data.unicode+'</div>';
  html+='<div><strong>使用频率：</strong>'+data.frequency+'</div>';
  html+='<div><strong>笔画顺序：</strong>暂无</div>';
  html+='<div><strong>五笔编码：</strong>暂无</div>';
  html+='<div><strong>仓颉编码：</strong>暂无</div>';
  html+='</div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(characters);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  analyzeCharacter();
}
analyzeCharacter();
</script></body></html>
