<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色彩趋势 - Color Trend</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{text-align:center;padding:2rem 1rem;border-bottom:1px solid var(--border)}
.header h1{font-size:1.8rem;margin-bottom:.3rem}
.header p{color:#8b949e;font-size:.9rem}
.container{max-width:1000px;margin:0 auto;padding:1.5rem}
.year-nav{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;margin:1.5rem 0}
.year-btn{padding:.4rem .8rem;border-radius:6px;background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s}
.year-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pantone-section{margin:2rem 0}
.pantone-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;display:flex;gap:2rem;flex-wrap:wrap;align-items:center}
.pantone-swatch{width:200px;height:260px;border-radius:12px;flex-shrink:0;position:relative;overflow:hidden}
.pantone-swatch::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.3))}
.pantone-info{flex:1;min-width:250px}
.pantone-info h2{font-size:1.5rem;margin-bottom:.3rem}
.pantone-info .pantone-code{color:var(--accent);font-family:monospace;margin-bottom:.8rem}
.pantone-info p{color:#8b949e;line-height:1.6;font-size:.9rem}
.pantone-values{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1rem}
.pv-item{background:var(--bg);padding:.4rem .8rem;border-radius:6px;font-family:monospace;font-size:.8rem}
.trend-palettes{margin:2rem 0}
.trend-palettes h2{margin-bottom:1rem;font-size:1.2rem}
.palette-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1rem}
.palette-header{padding:1rem 1.2rem;display:flex;justify-content:space-between;align-items:center}
.palette-header h3{font-size:1rem}
.palette-header span{font-size:.8rem;color:var(--accent)}
.palette-colors{display:flex;height:80px}
.palette-colors div{flex:1;cursor:pointer;position:relative;transition:flex .3s}
.palette-colors div:hover{flex:1.5}
.palette-colors div::after{content:attr(data-name);position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:.1rem .4rem;border-radius:3px;font-size:.6rem;white-space:nowrap;opacity:0;transition:opacity .2s}
.palette-colors div:hover::after{opacity:1}
.palette-desc{padding:.8rem 1.2rem;color:#8b949e;font-size:.8rem;border-top:1px solid var(--border)}
.industry-section{margin:2rem 0}
.industry-section h2{margin-bottom:1rem;font-size:1.2rem}
.industry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
.industry-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.2rem}
.industry-card h4{margin-bottom:.5rem;font-size:.9rem}
.industry-colors{display:flex;gap:.3rem;flex-wrap:wrap}
.industry-dot{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:transform .2s}
.industry-dot:hover{transform:scale(1.2)}
.industry-card p{color:#8b949e;font-size:.75rem;margin-top:.5rem}
.generator-section{margin:2rem 0}
.generator-section h2{margin-bottom:1rem;font-size:1.2rem}
.gen-controls{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.gen-row{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.gen-row label{min-width:80px;font-size:.85rem;color:#8b949e}
.gen-row select,.gen-row input[type="range"]{flex:1}
.gen-row select{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.5rem;color:var(--text)}
.gen-palette{display:flex;border-radius:10px;overflow:hidden;height:80px;margin:1rem 0}
.gen-palette div{flex:1;cursor:pointer;transition:flex .3s}
.gen-palette div:hover{flex:1.5}
.gen-btn{background:var(--accent);border:none;color:#fff;padding:.6rem 1.5rem;border-radius:8px;cursor:pointer;font-size:.9rem}
.gen-values{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1rem}
.gen-val{background:var(--bg);padding:.3rem .6rem;border-radius:6px;font-family:monospace;font-size:.8rem;cursor:pointer}
.gen-val:hover{background:var(--card)}
</style>
</head>
<body>
<div class="header">
<h1>📈 色彩趋势</h1>
<p>年度流行色彩与配色趋势</p>
</div>
<div class="container">

<div class="year-nav" id="yearNav"></div>

<div class="pantone-section" id="pantoneSection"></div>

<div class="trend-palettes">
<h2>流行配色方案</h2>
<div id="paletteContainer"></div>
</div>

<div class="industry-section">
<h2>行业色彩趋势</h2>
<div class="industry-grid" id="industryGrid"></div>
</div>

<div class="generator-section">
<h2>趋势配色生成器</h2>
<div class="gen-controls">
<div class="gen-row">
<label>风格</label>
<select id="genStyle">
<option value="warm">温暖活力</option>
<option value="cool">冷静专业</option>
<option value="pastel">柔和淡雅</option>
<option value="vibrant">鲜艳大胆</option>
<option value="earth">自然大地</option>
<option value="neon">霓虹科技</option>
</select>
</div>
<div class="gen-row">
<label>色调</label>
<input type="range" id="genHue" min="0" max="360" value="200">
<span id="genHueVal" style="font-size:.8rem;color:#8b949e;min-width:40px">200°</span>
</div>
<div class="gen-row">
<label>饱和度</label>
<input type="range" id="genSat" min="10" max="100" value="60">
<span id="genSatVal" style="font-size:.8rem;color:#8b949e;min-width:40px">60%</span>
</div>
<button class="gen-btn" onclick="generatePalette()">生成配色</button>
</div>
<div class="gen-palette" id="genPalette"></div>
<div class="gen-values" id="genValues"></div>
</div>

</div>

<script>
const trendData={
2024:{pantone:{name:'柔和桃',code:'PANTONE 13-1023 Peach Fuzz',color:'#FFBE98',desc:'温暖而柔和的蜜桃色调，传达同情与和谐。这种介于粉色和橙色之间的温柔色调，象征着人与人之间的温暖连接，以及在快节奏世界中对宁静的渴望。'},
palettes:[
{name:'宁静绿洲',colors:[{hex:'#7BAE7F',name:'鼠尾草绿'},{hex:'#D4C5A9',name:'亚麻色'},{hex:'#A8B5A2',name:'灰绿'},{hex:'#E8DCC8',name:'奶油白'},{hex:'#C4A882',name:'焦糖'}],desc:'自然、放松的大地色系，适合营造平和氛围。'},
{name:'日落暖调',colors:[{hex:'#E07A5F',name:'赤陶'},{hex:'#F2CC8F',name:'暖金'},{hex:'#3D405B',name:'深靛'},{hex:'#81B29A',name:'薄荷'},{hex:'#F4F1DE',name:'象牙'}],desc:'温暖的日落色调搭配冷色点缀，平衡而有活力。'},
{name:'都市柔光',colors:[{hex:'#2D3142',name:'炭灰'},{hex:'#4F5D75',name:'钢蓝灰'},{hex:'#BFC0C0',name:'银灰'},{hex:'#EF8354',name:'珊瑚橙'},{hex:'#FFFFFF',name:'纯白'}],desc:'现代都市感的灰色调搭配活力橙色。'}
],industry:{'科技':['#0D1B2A','#1B263B','#415A77','#778DA9','#E0E1DD'],'时尚':['#FFBE98','#D4A373','#FEFAE0','#CCD5AE','#E9EDC9'],'餐饮':['#CB997E','#DDBEA9','#FFE8D6','#B7B7A4','#A5A58D'],'美妆':['#FFCDB2','#FFB4A2','#E5989B','#B5838D','#6D6875']}},
2023:{pantone:{name:'非凡洋红',code:'PANTONE 18-1750 Viva Magenta',color:'#BB2649',desc:'源于自然的深洋红色，充满活力和力量。这种颜色源自胭脂红染料，是最天然的染料之一，象征着勇敢和无畏的精神。'},
palettes:[
{name:'大胆宣言',colors:[{hex:'#BB2649',name:'非凡洋红'},{hex:'#E63946',name:'火焰红'},{hex:'#1D3557',name:'深海蓝'},{hex:'#457B9D',name:'灰蓝'},{hex:'#F1FAEE',name:'薄荷白'}],desc:'大胆而有力的配色，适合需要视觉冲击力的设计。'},
{name:'优雅平衡',colors:[{hex:'#6B2D5B',name:'深紫红'},{hex:'#F0A500',name:'琥珀金'},{hex:'#E8D5B7',name:'杏仁色'},{hex:'#3A506B',name:'石板蓝'},{hex:'#5BC0BE',name:'青绿'}],desc:'紫色与金色的经典搭配，传达奢华与优雅。'}
],industry:{'科技':['#2D00F7','#6A00F4','#8900F2','#A100F2','#B100E8'],'时尚':['#BB2649','#D4A373','#FAEDCD','#E9EDC9','#FEFAE0'],'餐饮':['#BC4749','#6A994E','#A7C957','#F2E8CF','#386641']}},
2022:{pantone:{name:'长春花蓝',code:'PANTONE 17-3938 Very Peri',color:'#6667AB',desc:'融合了蓝色的忠诚与恒久以及红色的能量与热情，长春花蓝展现了一种充满活力的新鲜感，预示着未来的变化。'},
palettes:[
{name:'数字未来',colors:[{hex:'#6667AB',name:'长春花蓝'},{hex:'#9B5DE5',name:'紫罗兰'},{hex:'#00BBF9',name:'天蓝'},{hex:'#00F5D4',name:'薄荷绿'},{hex:'#FEE440',name:'柠檬黄'}],desc:'充满数字感的科技配色，适合科技和创意领域。'},
{name:'宁静优雅',colors:[{hex:'#6667AB',name:'长春花蓝'},{hex:'#C9B1FF',name:'薰衣草'},{hex:'#E8D5F5',name:'淡紫'},{hex:'#F5F0FF',name:'丁香白'},{hex:'#2C003E',name:'深紫'}],desc:'柔和的紫色调层次搭配，优雅而现代。'}
],industry:{'科技':['#6667AB','#9B5DE5','#00BBF9','#00F5D4','#FEE440'],'时尚':['#6667AB','#C9B1FF','#E8D5F5','#7B2D8E','#2C003E']}},
2021:{pantone:{name:'明亮黄 + 极致灰',code:'PANTONE 17-5104 + 13-0647',color:'#DFBE6F',desc:'两种独立的色彩携手传递坚韧与希望的信息。极致灰代表持久可靠，明亮黄象征阳光般的好运与活力。'},
palettes:[
{name:'坚韧希望',colors:[{hex:'#DFBE6F',name:'明亮黄'},{hex:'#939597',name:'极致灰'},{hex:'#F5F5F5',name:'亮白'},{hex:'#333333',name:'深灰'},{hex:'#FFD700',name:'金色'}],desc:'黄色与灰色的经典搭配，温暖中带有沉稳。'}
],industry:{'科技':['#939597','#DFBE6F','#333333','#666666','#F5F5F5'],'时尚':['#DFBE6F','#939597','#FFD700','#C0C0C0','#333333']}}
};

const years=Object.keys(trendData).sort((a,b)=>b-a);
let currentYear=years[0];

function renderYearNav(){
document.getElementById('yearNav').innerHTML=years.map(y=>`<div class="year-btn${y==currentYear?' active':''}" data-year="${y}">${y}</div>`).join('');
document.querySelectorAll('.year-btn').forEach(btn=>{
btn.addEventListener('click',()=>{
document.querySelectorAll('.year-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');currentYear=btn.dataset.year;renderAll();
});
});
}

function renderAll(){
const data=trendData[currentYear];
if(!data)return;
const p=data.pantone;
document.getElementById('pantoneSection').innerHTML=`
<div class="pantone-card">
<div class="pantone-swatch" style="background:${p.color}"></div>
<div class="pantone-info">
<h2>${p.name}</h2>
<div class="pantone-code">${p.code}</div>
<p>${p.desc}</p>
<div class="pantone-values">
<div class="pv-item">${p.color}</div>
<div class="pv-item">RGB(${parseInt(p.color.slice(1,3),16)}, ${parseInt(p.color.slice(3,5),16)}, ${parseInt(p.color.slice(5,7),16)})</div>
</div>
</div>
</div>`;

document.getElementById('paletteContainer').innerHTML=data.palettes.map(pal=>`
<div class="palette-card">
<div class="palette-header"><h3>${pal.name}</h3><span>${pal.colors.length} 色</span></div>
<div class="palette-colors">${pal.colors.map(c=>`<div style="background:${c.hex}" data-name="${c.name}" onclick="navigator.clipboard.writeText('${c.hex}')" title="${c.hex}"></div>`).join('')}</div>
<div class="palette-desc">${pal.desc}</div>
</div>
`).join('');

const ig=document.getElementById('industryGrid');
ig.innerHTML='';
if(data.industry){
Object.entries(data.industry).forEach(([name,colors])=>{
ig.innerHTML+=`<div class="industry-card"><h4>${name}</h4><div class="industry-colors">${colors.map(c=>`<div class="industry-dot" style="background:${c}" onclick="navigator.clipboard.writeText('${c}')" title="${c}"></div>`).join('')}</div></div>`;
});
}
}

function hslToRgb(h,s,l){h/=360;s/=100;l/=100;let r,g,b;if(s===0){r=g=b=l}else{const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;const f=t=>{if(t<0)t+=1;if(t>1)t-=1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p};r=f(h+1/3);g=f(h);b=f(h-1/3)}return[Math.round(r*255),Math.round(g*255),Math.round(b*255)]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase()}

function generatePalette(){
const style=document.getElementById('genStyle').value;
const baseHue=+document.getElementById('genHue').value;
const baseSat=+document.getElementById('genSat').value;
const configs={
warm:{satRange:[50,80],ligRange:[45,65],hueOffsets:[0,15,-15,30,-30]},
cool:{satRange:[30,60],ligRange:[40,60],hueOffsets:[0,30,-30,60,-60]},
pastel:{satRange:[25,45],ligRange:[75,90],hueOffsets:[0,20,-20,40,-40]},
vibrant:{satRange:[80,100],ligRange:[45,55],hueOffsets:[0,30,-30,60,-60]},
earth:{satRange:[25,50],ligRange:[35,55],hueOffsets:[0,10,-10,20,-20]},
neon:{satRange:[90,100],ligRange:[50,60],hueOffsets:[0,60,-60,120,-120]}
};
const cfg=configs[style];
const colors=[];
for(let i=0;i<5;i++){
const hue=(baseHue+cfg.hueOffsets[i]+360)%360;
const sat=cfg.satRange[0]+Math.random()*(cfg.satRange[1]-cfg.satRange[0]);
const lig=cfg.ligRange[0]+Math.random()*(cfg.ligRange[1]-cfg.ligRange[0]);
colors.push(rgbToHex(...hslToRgb(hue,sat,lig)));
}
document.getElementById('genPalette').innerHTML=colors.map(c=>`<div style="background:${c}" onclick="navigator.clipboard.writeText('${c}')" title="${c}"></div>`).join('');
document.getElementById('genValues').innerHTML=colors.map(c=>`<div class="gen-val" onclick="navigator.clipboard.writeText('${c}')">${c}</div>`).join('');
}

document.getElementById('genHue').addEventListener('input',e=>{document.getElementById('genHueVal').textContent=e.target.value+'°'});
document.getElementById('genSat').addEventListener('input',e=>{document.getElementById('genSatVal').textContent=e.target.value+'%'});

renderYearNav();renderAll();generatePalette();
</script>
</body>
</html>
