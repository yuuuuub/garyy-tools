<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色彩心理学 v2 - Color Psychology 中文</title>
<meta property="og:title" content="色彩心理学 v2 - Color Psychology 中文">
<meta property="og:description" content="色彩心理学 v2 - Color Psychology 中文 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="探索色彩心理学，了解不同颜色的情感含义、文化象征和设计应用">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<meta name="robots" content="index, follow">
<style>
:root{--radius:10px;--transition:.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.back{position:fixed;top:8px;left:8px;z-index:9999;text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)}
.header{text-align:center;padding:2rem 1rem 1rem}
.header h1{font-size:1.8rem;margin-bottom:.3rem}
.header p{color:var(--text2);font-size:.9rem}
.theme-btn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:.75rem}
.container{max-width:900px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.card h2{font-size:1.1rem;margin-bottom:.8rem;color:var(--accent)}
.color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin:1rem 0}
.color-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .2s}
.color-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.color-card.active{border-color:var(--accent)}
.color-bar{height:80px;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.color-info{padding:1rem}
.color-info h3{font-size:1rem;margin-bottom:.3rem}
.color-info p{font-size:.8rem;color:var(--text2);line-height:1.5}
.detail-panel{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-top:1rem;display:none}
.detail-panel.active{display:block}
.detail-header{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.detail-swatch{width:64px;height:64px;border-radius:10px;border:2px solid var(--border)}
.detail-title{font-size:1.2rem;font-weight:600}
.detail-sub{font-size:.85rem;color:var(--text2)}
.tag-row{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.tag{padding:.2rem .6rem;border-radius:20px;font-size:.75rem;border:1px solid var(--border);color:var(--text2)}
.section-block{margin:1rem 0}
.section-block h3{font-size:.95rem;margin-bottom:.5rem;color:var(--accent)}
.section-block p{font-size:.85rem;color:var(--text2);line-height:1.6}
.industry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.5rem;margin-top:.5rem}
.industry-item{padding:.5rem;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:.8rem;text-align:center}
.quiz-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:1rem;margin:1rem 0}
.quiz-q{font-size:.95rem;margin-bottom:.8rem}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.quiz-opt{padding:.6rem;border-radius:8px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:.85rem;text-align:center;transition:all .2s}
.quiz-opt:hover{border-color:var(--accent)}
.quiz-opt.correct{background:rgba(63,185,80,.15);border-color:var(--green)}
.quiz-opt.wrong{background:rgba(248,81,73,.15);border-color:var(--red)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<a href="../index.html" class="back">← 首页</a>
<button class="theme-btn" onclick="toggleTheme()">🌓 主题</button>
<div class="header">
<h1>🧠 色彩心理学 v2</h1>
<p>深入了解颜色背后的情感、文化与设计意义</p>
</div>
<div class="container">
<div class="card">
<h2>颜色情感图谱</h2>
<p style="color:var(--text2);font-size:.85rem;margin-bottom:.5rem">点击任意颜色查看详细心理学分析</p>
<div class="color-grid" id="colorGrid"></div>
</div>

<div class="detail-panel" id="detailPanel"></div>

<div class="card">
<h2>色彩心理学小测验</h2>
<div id="quizArea"></div>
</div>
</div>

<script>
function toggleTheme(){const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t)}

const colors=[
{name:'红色',hex:'#E74C3C',emoji:'❤️',
emotions:['热情','力量','危险','爱情','愤怒'],
culture:{cn:'喜庆、吉祥、好运',western:'爱情、激情、危险',japan:'生命、活力'},
industries:['餐饮','娱乐','体育','促销'],
tips:'红色能提高心率，激发紧迫感。适合CTA按钮、促销标签，但大面积使用容易造成视觉疲劳。',
usage:'可口可乐、Netflix、YouTube'},
{name:'橙色',hex:'#E67E22',emoji:'🍊',
emotions:['活力','温暖','创造','欢乐','年轻'],
culture:{cn:'丰收、温暖',western:'万圣节、秋天',japan:'勇气、活力'},
industries:['儿童','美食','运动','创意'],
tips:'橙色结合了红色的能量和黄色的快乐，充满活力。适合吸引注意力但不具攻击性的场景。',
usage:'Fanta、Amazon、Nickelodeon'},
{name:'黄色',hex:'#F1C40F',emoji:'☀️',
emotions:['快乐','乐观','智慧','警告','温暖'],
culture:{cn:'皇家、尊贵',western:'快乐、警告',japan:'高贵、勇敢'},
industries:['科技','快餐','教育','金融'],
tips:'黄色是最引人注目的颜色，能激发乐观情绪。但过多使用会造成焦虑，建议作为点缀色。',
usage:'McDonald\'s、IKEA、Snapchat'},
{name:'绿色',hex:'#2ECC71',emoji:'🌿',
emotions:['自然','成长','健康','和平','财富'],
culture:{cn:'生命、春天、健康',western:'自然、环保',japan:'永恒、活力'},
industries:['健康','环保','金融','农业'],
tips:'绿色让人放松，与自然和健康紧密相关。适合环保品牌、健康食品、金融理财类产品。',
usage:'Starbucks、Spotify、Android'},
{name:'蓝色',hex:'#3498DB',emoji:'💧',
emotions:['信任','专业','冷静','智慧','忠诚'],
culture:{cn:'不朽、永恒',western:'信任、专业',japan:'纯洁、诚实'},
industries:['科技','金融','医疗','社交'],
tips:'蓝色是最受欢迎的企业色，传递信任和专业感。深蓝适合金融，浅蓝适合科技和社交。',
usage:'Facebook、Twitter、Samsung'},
{name:'紫色',hex:'#9B59B6',emoji:'🔮',
emotions:['奢华','神秘','智慧','创意','浪漫'],
culture:{cn:'高贵、神秘',western:'皇室、奢华',japan:'特权、贵族'},
industries:['美妆','奢侈品','创意','教育'],
tips:'紫色结合了蓝色的稳定和红色的能量，象征奢华和创意。适合高端品牌和创意产业。',
usage:'Cadbury、Twitch、Yahoo'},
{name:'粉色',hex:'#E91E63',emoji:'💗',
emotions:['温柔','浪漫','女性','甜美','关怀'],
culture:{cn:'浪漫、甜美',western:'女性、爱情',japan:'春天、樱花'},
industries:['美妆','时尚','母婴','社交'],
tips:'粉色传递温柔和关怀，不仅限于女性品牌。柔和的粉色适合健康关怀类设计。',
usage:'T-Mobile、 Barbie、Cosmopolitan'},
{name:'黑色',hex:'#2C3E50',emoji:'🖤',
emotions:['力量','优雅','神秘','正式','高级'],
culture:{cn:'庄重、正式',western:'优雅、高端',japan:'神秘、高贵'},
industries:['奢侈品','时尚','科技','汽车'],
tips:'黑色代表高端和权威，是奢侈品的首选色。在深色模式中，黑色背景能减少视觉疲劳。',
usage:'Chanel、Nike、Apple'},
{name:'白色',hex:'#ECF0F1',emoji:'🤍',
emotions:['纯净','简洁','和平','空灵','干净'],
culture:{cn:'纯洁、丧事',western:'纯洁、和平',japan:'神圣、纯净'},
industries:['医疗','科技','极简','家居'],
tips:'白色是极简主义的核心色，能创造呼吸感。大量留白是现代设计的重要趋势。',
usage:'Apple、Google、Muji'},
{name:'灰色',hex:'#95A5A6',emoji:'🩶',
emotions:['中立','平衡','成熟','稳重','专业'],
culture:{cn:'低调、稳重',western:'中立、商务',japan:'朴素、实用'},
industries:['企业','建筑','金融','科技'],
tips:'灰色是最安全的中性色，适合文字、边框和背景。深灰比纯黑更柔和，是现代UI的首选。',
usage:'LinkedIn、Wikipedia、IBM'}
];

const grid=document.getElementById('colorGrid');
colors.forEach((c,i)=>{
grid.innerHTML+=`<div class="color-card" onclick="showDetail(${i})" id="cc${i}"><div class="color-bar" style="background:${c.hex}">${c.emoji}</div><div class="color-info"><h3>${c.name}</h3><p>${c.emotions.slice(0,3).join('、')}</p></div></div>`;
});

let activeIdx=-1;
function showDetail(i){
if(activeIdx===i){document.getElementById('detailPanel').classList.remove('active');activeIdx=-1;return}
activeIdx=i;
document.querySelectorAll('.color-card').forEach((c,j)=>c.classList.toggle('active',j===i));
const c=colors[i];
const panel=document.getElementById('detailPanel');
panel.className='detail-panel active';
panel.innerHTML=`
<div class="detail-header"><div class="detail-swatch" style="background:${c.hex}"></div><div><div class="detail-title">${c.emoji} ${c.name} 心理学</div><div class="detail-sub">${c.hex}</div></div></div>
<div class="tag-row">${c.emotions.map(e=>`<span class="tag">${e}</span>`).join('')}</div>
<div class="section-block"><h3>🌍 文化象征</h3>
<p><strong>中国文化：</strong>${c.culture.cn}<br><strong>西方文化：</strong>${c.culture.western}<br><strong>日本文化：</strong>${c.culture.japan}</p></div>
<div class="section-block"><h3>🏢 适用行业</h3><div class="industry-grid">${c.industries.map(ind=>`<div class="industry-item">${ind}</div>`).join('')}</div></div>
<div class="section-block"><h3>💡 设计建议</h3><p>${c.tips}</p></div>
<div class="section-block"><h3>📌 知名品牌</h3><p>${c.usage}</p></div>`;
panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

const quizData=[
{q:'哪种颜色最能传递信任感？',opts:['红色','蓝色','黄色','紫色'],ans:1},
{q:'快餐行业常用哪种颜色刺激食欲？',opts:['蓝色','绿色','红黄色','紫色'],ans:2},
{q:'哪种颜色象征奢华和皇室？',opts:['橙色','灰色','紫色','粉色'],ans:2},
{q:'科技公司最常用的品牌色是？',opts:['红色','蓝色','橙色','绿色'],ans:1},
{q:'大面积使用哪种颜色容易造成焦虑？',opts:['蓝色','绿色','黄色','灰色'],ans:2}
];
let qIdx=0,score=0;
function renderQuiz(){
if(qIdx>=quizData.length){
document.getElementById('quizArea').innerHTML=`<div class="quiz-box" style="text-align:center">🎉 得分：${score}/${quizData.length}<br><button onclick="qIdx=0;score=0;renderQuiz()" style="margin-top:.5rem;padding:.5rem 1rem;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer">再来一次</button></div>`;
return;
}
const d=quizData[qIdx];
document.getElementById('quizArea').innerHTML=`<div class="quiz-box"><div class="quiz-q">${qIdx+1}. ${d.q}</div><div class="quiz-opts" id="qOpts">${d.opts.map((o,i)=>`<div class="quiz-opt" onclick="checkQuiz(${i})">${o}</div>`).join('')}</div><div style="text-align:center;font-size:.8rem;color:var(--text2);margin-top:.5rem">${qIdx+1}/${quizData.length}</div></div>`;
}
function checkQuiz(i){
const d=quizData[qIdx];
const opts=document.querySelectorAll('#qOpts .quiz-opt');
opts.forEach((o,j)=>{o.onclick=null;if(j===d.ans)o.classList.add('correct');else if(j===i&&i!==d.ans)o.classList.add('wrong')});
if(i===d.ans)score++;
setTimeout(()=>{qIdx++;renderQuiz()},1000);
}
renderQuiz();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
