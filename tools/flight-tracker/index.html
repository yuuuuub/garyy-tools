<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>航班追踪</title>
<meta name="description" content="航班实时追踪工具，查询航班动态和飞行状态">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#3fb950;--yellow:#d29922;--red:#f85149}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-seriffont-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;padding:16px;scroll-behavior:smooth;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header h1{font-size:20px;white-space:nowrap}
.header h1 span{font-size:24px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls input,.controls select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px}
.controls input{width:180px}
.controls select{min-width:110px}
.controls button{background:var(--accent);color:var(--text);border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:14px}
.main{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 64px)}
.map-area{background:#0a0e14;position:relative;display:flex;align-items:center;justify-content:center}
.flight-map{width:90%;height:80%;position:relative}
.plane-dot{position:absolute;width:12px;height:12px;cursor:pointer;z-index:5}
.plane-dot::after{content:'✈';font-size:16px;position:absolute;top:-8px;left:-4px;color:var(--accent);filter:drop-shadow(0 0 4px var(--accent))}
.plane-dot:hover::after{color:var(--text);transform:scale(1.5)}
.route-line{position:absolute;height:2px;background:var(--accent);opacity:.3;transform-origin:left center}
.sidebar{background:var(--card);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.sidebar-header{padding:12px;border-bottom:1px solid var(--border);display:flex;gap:8px}
.sidebar-header input{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:13px}
.flight-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin:8px;cursor:pointer;transition:border-color .2s}
.flight-card:hover{border-color:var(--accent)}
.flight-card.on-time{border-left:3px solid var(--green)}
.flight-card.delayed{border-left:3px solid var(--yellow)}
.flight-card.cancelled{border-left:3px solid var(--red)}
.flight-card .route{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.flight-card .code{font-size:18px;font-weight:700;color:var(--accent)}
.flight-card .arrow{color:var(--accent)}
.flight-card .cities{font-size:13px;color:#8b949e}
.flight-card .status-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.flight-card .status-badge.green{background:rgba(63,185,80,.15);color:var(--green)}
.flight-card .status-badge.yellow{background:rgba(210,153,34,.15);color:var(--yellow)}
.flight-card .status-badge.red{background:rgba(248,81,73,.15);color:var(--red)}
.flight-card .times{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-top:8px}
.flight-card .times div{padding:6px;background:var(--card);border-radius:6px;text-align:center}
.flight-card .times .time{font-size:16px;font-weight:600}
.flight-card .times .label{color:#8b949e;font-size:11px}
.detail-panel{display:none;position:fixed;top:0;right:0;width:400px;height:100vh;background:var(--card);border-left:1px solid var(--border);z-index:100;overflow-y:auto;padding:20px}
.detail-panel.show{display:block}
.detail-close{position:absolute;top:12px;right:12px;background:var(--border);color:var(--text);border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px}
.detail-header{text-align:center;margin-bottom:20px}
.detail-header h2{font-size:24px;color:var(--accent)}
.detail-route{display:flex;justify-content:space-around;align-items:center;margin:20px 0;padding:20px;background:var(--bg);border-radius:12px}
.detail-route .city{text-align:center}
.detail-route .city .code{font-size:24px;font-weight:700}
.detail-route .city .name{font-size:12px;color:#8b949e}
.detail-route .vs{font-size:20px;color:var(--accent)}
.detail-info{display:grid;gap:8px}
.detail-info .row{display:flex;justify-content:space-between;padding:10px;background:var(--bg);border-radius:8px;font-size:14px}
.detail-info .row .label{color:#8b949e}
.filter-tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border)}
.filter-tab{padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:none;background:transparent;color:#8b949e}
.filter-tab.active{background:var(--accent);color:var(--text)}
@media(max-width:768px){.main{grid-template-columns:1fr;grid-template-rows:40vh 1fr}.sidebar{border-left:none;border-top:1px solid var(--border)}.detail-panel{width:100%}}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);outline:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="航班追踪">
  <meta property="og:description" content="航班实时追踪工具，查询航班动态和飞行状态">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/flight-tracker/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="header">
<h1><span>✈️</span> 航班追踪</h1>
<div class="controls">
<input type="text" id="searchInput" placeholder="航班号/城市..." title="Enter键搜索">
<select id="statusFilter">
<option value="all">所有状态</option>
<option value="on-time">准时</option>
<option value="delayed">延误</option>
<option value="cancelled">取消</option>
</select>
<select id="sortSelect">
<option value="time">按时间</option>
<option value="airline">按航司</option>
<option value="status">按状态</option>
</select>
</div>
</div>
<div class="main">
<div class="map-area"><div class="flight-map" id="flightMap"></div></div>
<div class="sidebar">
<div class="filter-tabs">
<button class="filter-tab active" onclick="filterAirline('all',this)">全部</button>
<button class="filter-tab" onclick="filterAirline('CA',this)">国航</button>
<button class="filter-tab" onclick="filterAirline('MU',this)">东航</button>
<button class="filter-tab" onclick="filterAirline('CZ',this)">南航</button>
<button class="filter-tab" onclick="filterAirline('HU',this)">海航</button>
<button class="filter-tab" onclick="filterAirline('ZH',this)">深航</button>
</div>
<div class="sidebar-header"><input type="text" id="sidebarSearch" placeholder="搜索航班..." title="Enter键搜索" oninput="renderFlights()"></div>
<div id="flightList" style="flex:1;overflow-y:auto"></div>
</div>
</div>
<div class="detail-panel" id="detailPanel"><button class="detail-close" onclick="closeDetail()">✕</button><div id="detailContent"></div></div>
<script>
let airlineFilter='all';
const flights=[
{id:'CA1234',airline:'中国国航',code:'CA',from:'PEK',fromCity:'北京',to:'SHA',toCity:'上海',dep:'08:30',arr:'11:00',status:'on-time',aircraft:'A350',gate:'T3-A12',duration:'2h30m',altitude:'10668m',speed:'856km/h'},
{id:'MU5678',airline:'东方航空',code:'MU',from:'PVG',fromCity:'上海',to:'CAN',toCity:'广州',dep:'09:15',arr:'12:00',status:'delayed',aircraft:'B787',gate:'T2-B05',duration:'2h45m',altitude:'11000m',speed:'832km/h'},
{id:'CZ3456',airline:'南方航空',code:'CTU',from:'CTU',fromCity:'成都',to:'SZX',toCity:'深圳',dep:'10:00',arr:'12:30',status:'on-time',aircraft:'A320neo',gate:'T1-C08',duration:'2h30m',altitude:'10000m',speed:'820km/h'},
{id:'HU7890',airline:'海南航空',code:'HU',from:'HAK',fromCity:'海口',to:'PEK',toCity:'北京',dep:'07:00',arr:'10:30',status:'on-time',aircraft:'B737MAX',gate:'T2-D03',duration:'3h30m',altitude:'11500m',speed:'845km/h'},
{id:'ZH1111',airline:'深圳航空',code:'ZH',from:'SZX',fromCity:'深圳',to:'KMG',toCity:'昆明',dep:'11:30',arr:'14:15',status:'delayed',aircraft:'A320',gate:'T3-E07',duration:'2h45m',altitude:'10300m',speed:'810km/h'},
{id:'CA9876',airline:'中国国航',code:'CA',from:'PEK',fromCity:'北京',to:'CTU',toCity:'成都',dep:'13:00',arr:'15:45',status:'on-time',aircraft:'A330',gate:'T3-A20',duration:'2h45m',altitude:'10800m',speed:'838km/h'},
{id:'MU2222',airline:'东方航空',code:'MU',from:'SHA',fromCity:'上海',to:'WUH',toCity:'武汉',dep:'14:30',arr:'16:00',status:'cancelled',aircraft:'B737',gate:'T1-F12',duration:'1h30m',altitude:'9000m',speed:'800km/h'},
{id:'CZ6666',airline:'南方航空',code:'CZ',from:'CAN',fromCity:'广州',to:'PEK',toCity:'北京',dep:'15:00',arr:'18:00',status:'on-time',aircraft:'B787',gate:'T2-A09',duration:'3h00m',altitude:'11200m',speed:'850km/h'},
{id:'HU3333',airline:'海南航空',code:'HU',from:'XIY',fromCity:'西安',to:'PVG',toCity:'上海',dep:'16:15',arr:'18:45',status:'delayed',aircraft:'A321',gate:'T1-B06',duration:'2h30m',altitude:'10500m',speed:'825km/h'},
{id:'ZH8888',airline:'深圳航空',code:'ZH',from:'SZX',fromCity:'深圳',to:'PEK',toCity:'北京',dep:'17:00',arr:'20:00',status:'on-time',aircraft:'B737',gate:'T3-D02',duration:'3h00m',altitude:'11000m',speed:'842km/h'}
];
function renderFlights(){
const search=(document.getElementById('searchInput').value+document.getElementById('sidebarSearch').value).toLowerCase();
const statusF=document.getElementById('statusFilter').value;
let list=flights.filter(f=>{
if(airlineFilter!=='all'&&f.code!==airlineFilter)return false;
if(statusF!=='all'&&f.status!==statusF)return false;
if(search&&!f.id.toLowerCase().includes(search)&&!f.fromCity.includes(search)&&!f.toCity.includes(search)&&!f.airline.includes(search))return false;
return true;
});
document.getElementById('flightList').innerHTML=list.map(f=>`
<div class="flight-card ${f.status}" onclick="showDetail('${f.id}')">
<div class="route"><span class="code">${f.id}</span><span style="color:#8b949e;font-size:12px">${f.airline}</span>
<span class="status-badge ${f.status==='on-time'?'green':f.status==='delayed'?'yellow':'red'}">${f.status==='on-time'?'准时':f.status==='delayed'?'延误':'取消'}</span></div>
<div class="cities">${f.fromCity} → ${f.toCity}</div>
<div class="times">
<div><div class="label">起飞</div><div class="time">${f.dep}</div><div>${f.from}</div></div>
<div><div class="label">到达</div><div class="time">${f.arr}</div><div>${f.to}</div></div>
</div>
</div>`).join('');
renderMap();
}
function renderMap(){
const map=document.getElementById('flightMap');
const cityPos={PEK:{x:75,y:25},SHA:{x:78,y:42},PVG:{x:79,y:43},CAN:{x:70,y:55},SZX:{x:71,y:57},CTU:{x:55,y:42},HAK:{x:65,y:65},KMG:{x:50,y:52},WUH:{x:72,y:42},XIY:{x:62,y:35}};
let html='<svg viewBox="0 0 100 80" width="100%" height="100%" style="opacity:.3"><rect x="0" y="0" width="100" height="80" fill="none" stroke="#1a2332" stroke-width="0.2"/>';
[20,40,60].forEach(y=>{html+=`<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="#1a2332" stroke-width="0.1"/>`;});
[20,40,60,80].forEach(x=>{html+=`<line x1="${x}" y1="0" x2="${x}" y2="80" stroke="#1a2332" stroke-width="0.1"/>`;});
html+='</svg>';
const filtered=flights.filter(f=>{if(airlineFilter!=='all'&&f.code!==airlineFilter)return false;if(document.getElementById('statusFilter').value!=='all'&&f.status!==document.getElementById('statusFilter').value)return false;return true;});
filtered.forEach(f=>{
const from=cityPos[f.from];const to=cityPos[f.to];
if(from&&to){
html+=`<div class="route-line" style="left:${from.x}%;top:${from.y}%;width:${Math.sqrt((to.x-from.x)**2+(to.y-from.y)**2)}%;transform:rotate(${Math.atan2(to.y-from.y,to.x-from.x)*180/Math.PI}deg)"></div>`;
const mx=(from.x+to.x)/2,my=(from.y+to.y)/2;
html+=`<div class="plane-dot" style="left:${mx}%;top:${my}%" title="${f.id}: ${f.fromCity}→${f.toCity}"></div>`;
}
});
Object.entries(cityPos).forEach(([code,pos])=>{
html+=`<div style="position:absolute;left:${pos.x}%;top:${pos.y}%;transform:translate(-50%,-50%);font-size:10px;color:#8b949e;text-align:center"><div style="width:6px;height:6px;background:var(--accent);border-radius:50%;margin:0 auto 2px"></div>${code}</div>`;
});
map.innerHTML=html;
}
function filterAirline(code,btn){airlineFilter=code;document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');renderFlights();}
function showDetail(id){
const f=flights.find(x=>x.id===id);if(!f)return;
document.getElementById('detailContent').innerHTML=`
<div class="detail-header"><h2>${f.id}</h2><p style="color:#8b949e">${f.airline}</p>
<span class="status-badge ${f.status==='on-time'?'green':f.status==='delayed'?'yellow':'red'}" style="font-size:14px;padding:4px 16px">${f.status==='on-time'?'准时':f.status==='delayed'?'延误':'取消'}</span></div>
<div class="detail-route"><div class="city"><div class="code">${f.from}</div><div class="name">${f.fromCity}</div></div><div class="vs">✈ →</div><div class="city"><div class="code">${f.to}</div><div class="name">${f.toCity}</div></div></div>
<div class="detail-info">
<div class="row"><span class="label">起飞时间</span><span>${f.dep}</span></div>
<div class="row"><span class="label">到达时间</span><span>${f.arr}</span></div>
<div class="row"><span class="label">航程</span><span>${f.duration}</span></div>
<div class="row"><span class="label">机型</span><span>${f.aircraft}</span></div>
<div class="row"><span class="label">登机口</span><span>${f.gate}</span></div>
<div class="row"><span class="label">巡航高度</span><span>${f.altitude}</span></div>
<div class="row"><span class="label">当前速度</span><span>${f.speed}</span></div>
</div>`;
document.getElementById('detailPanel').classList.add('show');
}
function closeDetail(){document.getElementById('detailPanel').classList.remove('show');}
document.getElementById('searchInput').addEventListener('input',renderFlights);
document.getElementById('statusFilter').addEventListener('change',renderFlights);
document.getElementById('sortSelect').addEventListener('change',renderFlights);
renderFlights();
</script>
<script src="../i18n.js" defer>
document.getElementById("searchInput").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();closeDetail();}});

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
</body>
</html>
