<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔍 问题追踪</title>
<meta name="description" content="问题追踪管理工具，记录、分类和跟踪问题的处理进度">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:1100px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:14px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-num{font-size:1.5rem;font-weight:700}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:2px}
.issue-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:all .2s}
.issue-card:hover{border-color:var(--accent)}
.issue-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.issue-id{font-size:.8rem;color:var(--accent);font-weight:700}
.issue-title{font-weight:600;font-size:1rem;margin:4px 0}
.issue-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--text2)}
.issue-desc{font-size:.85rem;color:var(--text2);margin-top:6px}
.badge{padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600;white-space:nowrap}
.badge-critical{background:rgba(248,81,73,.2);color:var(--red)}
.badge-high{background:rgba(248,81,73,.1);color:var(--red)}
.badge-medium{background:rgba(210,153,34,.15);color:var(--yellow)}
.badge-low{background:rgba(63,185,80,.15);color:var(--green)}
.badge-open{background:rgba(248,81,73,.1);color:var(--red)}
.badge-progress{background:rgba(59,130,246,.15);color:var(--accent)}
.badge-resolved{background:rgba(63,185,80,.15);color:var(--green)}
.badge-closed{background:rgba(139,148,158,.15);color:var(--text2)}
.badge-bug{background:rgba(248,81,73,.1);color:var(--red)}
.badge-feature{background:rgba(59,130,246,.15);color:var(--accent)}
.badge-improve{background:rgba(168,85,247,.15);color:var(--purple)}
.comment{padding:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-top:8px;font-size:.85rem}
.comment .ctime{font-size:.75rem;color:var(--text2)}
.issue-actions{display:flex;gap:6px;margin-top:10px}
.issue-actions button{padding:5px 12px;font-size:.8rem}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-chip{padding:5px 12px;border-radius:20px;font-size:.75rem;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text2);transition:all .2s}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:550px;max-height:85vh;overflow-y:auto}
.empty{color:var(--text2);text-align:center;padding:30px}
@media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔍 问题追踪">
<meta property="og:description" content="问题追踪管理工具，记录、分类和跟踪问题的处理进度">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/issue-tracker-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='issue_data';
let state=JSON.parse(localStorage.getItem(STORE)||'{"issues":[]}');
if(!state.issues.length){
  state.issues=[
    {id:'ISS-001',title:'登录页面白屏',description:'Chrome最新版本下登录页面偶现白屏，需刷新才恢复',type:'bug',severity:'high',status:'open',assignee:'张三',created:new Date().toISOString().slice(0,10),comments:[{author:'李四',time:new Date().toISOString().slice(0,16),text:'已复现，怀疑是路由守卫问题'}]},
    {id:'ISS-002',title:'增加数据导出功能',description:'用户反馈希望支持Excel数据导出',type:'feature',severity:'medium',status:'progress',assignee:'王五',created:'2025-06-20',comments:[]},
    {id:'ISS-003',title:'优化列表加载速度',description:'数据量超过1000条时列表加载明显变慢',type:'improve',severity:'medium',status:'open',assignee:'',created:'2025-06-22',comments:[]},
    {id:'ISS-004',title:'移动端适配问题',description:'iPad横屏下侧边栏遮挡内容',type:'bug',severity:'low',status:'resolved',assignee:'赵六',created:'2025-06-15',comments:[{author:'赵六',time:'2025-06-18T10:00',text:'已修复，添加了响应式断点'}]}
  ];
}
let showModal=false,editingIssue=null,filterStatus='all',filterType='all',searchText='';
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function genId(){const n=state.issues.length+1;return'ISS-'+String(n).padStart(3,'0')}

function render(){
  let h=`<div class="hdr"><h1>🔍 问题追踪</h1><p>记录和跟踪问题处理进度</p></div>`;
  const issues=state.issues;
  h+=`<div class="stats-grid"><div class="stat"><div class="stat-num">${issues.length}</div><div class="stat-label">总问题</div></div><div class="stat"><div class="stat-num" style="color:var(--red)">${issues.filter(i=>i.status==='open').length}</div><div class="stat-label">待处理</div></div><div class="stat"><div class="stat-num" style="color:var(--accent)">${issues.filter(i=>i.status==='progress').length}</div><div class="stat-label">进行中</div></div><div class="stat"><div class="stat-num" style="color:var(--green)">${issues.filter(i=>i.status==='resolved').length}</div><div class="stat-label">已解决</div></div><div class="stat"><div class="stat-num" style="color:var(--text2)">${issues.filter(i=>i.status==='closed').length}</div><div class="stat-label">已关闭</div></div></div>`;

  h+=`<div class="cd"><div class="flex-between"><h2 style="margin:0">问题列表</h2><button onclick="openNew()">+ 新问题</button></div>`;
  h+=`<div class="filter-bar"><div class="filter-chip ${filterStatus==='all'?'active':''}" onclick="filterStatus='all';render()">全部</div>`;
  ['open','progress','resolved','closed'].forEach(s=>{
    const labels={open:'待处理',progress:'进行中',resolved:'已解决',closed:'已关闭'};
    h+=`<div class="filter-chip ${filterStatus===s?'active':''}" onclick="filterStatus='${s}';render()">${labels[s]}</div>`;
  });
  h+=`</div><div class="flex" style="margin-bottom:12px"><input placeholder="🔍 搜索问题..." style="max-width:300px;margin:0" oninput="searchText=this.value.toLowerCase();render()"></div>`;

  let filtered=issues;
  if(filterStatus!=='all')filtered=filtered.filter(i=>i.status===filterStatus);
  if(filterType!=='all')filtered=filtered.filter(i=>i.type===filterType);
  if(searchText)filtered=filtered.filter(i=>i.title.toLowerCase().includes(searchText)||i.description.toLowerCase().includes(searchText)||i.id.toLowerCase().includes(searchText));

  if(!filtered.length)h+=`<p class="empty">暂无匹配的问题</p>`;
  filtered.forEach(i=>{
    const typeLabel={bug:'🐛 缺陷',feature:'✨ 需求',improve:'🔧 改进'}[i.type];
    const statusLabel={open:'待处理',progress:'进行中',resolved:'已解决',closed:'已关闭'}[i.status];
    const sevLabel={critical:'严重',high:'高',medium:'中',low:'低'}[i.severity];
    h+=`<div class="issue-card"><div class="issue-header"><div><span class="issue-id">${i.id}</span><div class="issue-title">${i.title}</div><div class="issue-meta"><span class="badge badge-${i.type}">${typeLabel}</span><span class="badge badge-${i.severity}">${sevLabel}</span><span class="badge badge-${i.status}">${statusLabel}</span><span>👤 ${i.assignee||'未指派'}</span><span>📅 ${i.created}</span></div></div></div>`;
    if(i.description)h+=`<div class="issue-desc">${i.description}</div>`;
    if(i.comments?.length){
      i.comments.forEach(c=>{
        h+=`<div class="comment"><strong>${c.author}</strong> <span class="ctime">${c.time}</span><p style="margin-top:4px">${c.text}</p></div>`;
      });
    }
    h+=`<div class="issue-actions">`;
    if(i.status==='open')h+=`<button onclick="updateStatus('${i.id}','progress')">▶️ 开始处理</button>`;
    if(i.status==='progress')h+=`<button onclick="updateStatus('${i.id}','resolved')">✅ 标记解决</button>`;
    if(i.status==='resolved')h+=`<button onclick="updateStatus('${i.id}','closed')">🔒 关闭</button>`;
    if(i.status!=='open'&&i.status!=='closed')h+=`<button class="sec" onclick="updateStatus('${i.id}','open')">🔄 重新打开</button>`;
    h+=`<button class="sec" onclick="addComment('${i.id}')">💬 评论</button><button class="sec" onclick="editIssue('${i.id}')">✏️ 编辑</button><button class="dng" onclick="deleteIssue('${i.id}')">🗑️</button></div></div>`;
  });
  h+=`</div>`;

  if(showModal)h+=renderModal();
  $('app').innerHTML=h;
}

function renderModal(){
  const isEdit=!!editingIssue?.id;
  const i=editingIssue||{};
  let h=`<div class="modal-overlay" onclick="showModal=false;editingIssue=null;render()"><div class="modal" onclick="event.stopPropagation()">`;
  h+=`<h2 style="margin-bottom:16px">${isEdit?'✏️ 编辑问题':'📝 新问题'}</h2>`;
  h+=`<label>标题</label><input id="mTitle" value="${i.title||''}" placeholder="问题标题">`;
  h+=`<label>描述</label><textarea id="mDesc" placeholder="详细描述...">${i.description||''}</textarea>`;
  h+=`<div style="display:flex;gap:12px"><div style="flex:1"><label>类型</label><select id="mType"><option value="bug" ${i.type==='bug'?'selected':''}>🐛 缺陷</option><option value="feature" ${i.type==='feature'?'selected':''}>✨ 需求</option><option value="improve" ${i.type==='improve'?'selected':''}>🔧 改进</option></select></div><div style="flex:1"><label>严重程度</label><select id="mSev"><option value="critical" ${i.severity==='critical'?'selected':''}>严重</option><option value="high" ${i.severity==='high'?'selected':''}>高</option><option value="medium" ${i.severity==='medium'?'selected':''}>中</option><option value="low" ${i.severity==='low'?'selected':''}>低</option></select></div></div>`;
  h+=`<label>指派给</label><input id="mAssignee" value="${i.assignee||''}" placeholder="负责人">`;
  h+=`<div class="flex" style="margin-top:16px;justify-content:flex-end"><button class="sec" onclick="showModal=false;editingIssue=null;render()">取消</button><button onclick="saveIssue()">${isEdit?'保存':'创建'}</button></div>`;
  h+=`</div></div>`;
  return h;
}

function openNew(){editingIssue={type:'bug',severity:'medium',status:'open'};showModal=true;render()}
function editIssue(id){const i=state.issues.find(x=>x.id===id);editingIssue={...i,comments:[...i.comments]};showModal=true;render()}
function saveIssue(){
  const title=$('mTitle').value.trim();
  if(!title){alert('请输入标题');return}
  const issue={
    id:editingIssue?.id||genId(),title,description:$('mDesc').value.trim(),
    type:$('mType').value,severity:$('mSev').value,status:editingIssue?.status||'open',
    assignee:$('mAssignee').value.trim(),created:editingIssue?.created||new Date().toISOString().slice(0,10),
    comments:editingIssue?.comments||[]
  };
  const idx=state.issues.findIndex(x=>x.id===issue.id);
  if(idx>=0)state.issues[idx]=issue;else state.issues.unshift(issue);
  save();showModal=false;editingIssue=null;render();
}
function deleteIssue(id){if(!confirm('确定删除？'))return;state.issues=state.issues.filter(i=>i.id!==id);save();render()}
function updateStatus(id,status){const i=state.issues.find(x=>x.id===id);if(i)i.status=status;save();render()}
function addComment(id){
  const text=prompt('输入评论：');
  if(!text)return;
  const i=state.issues.find(x=>x.id===id);
  if(i)i.comments.push({author:'我',time:new Date().toISOString().slice(0,16),text});
  save();render();
}
render();
</script>
</body>
</html>
