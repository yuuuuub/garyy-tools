<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中餐味型图谱 - Chinese Flavor Profile</title>
<meta name="description" content="中餐味型图谱，详解酸甜苦辣咸鲜麻等中式复合味型">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中餐味型图谱 - Chinese Flavor Profile">
<meta property="og:description" content="详解酸甜苦辣咸鲜麻等中式复合味型">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-flavor-profile-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👅</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
header{background:linear-gradient(135deg,#1a0a00,#2a1505,#3d200a);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3010;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1200px;margin:0 auto;padding:20px}
.search-box{margin-bottom:16px}
.search-box input{width:100%;padding:12px 16px;border-radius:10px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none}
.search-box input:focus{border-color:var(--accent)}
.filter-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.filter-btn{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.82em;transition:all .2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.flavor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.flavor-card{background:var(--card);border-radius:14px;padding:20px;border:1px solid var(--border);transition:all .3s;cursor:pointer;position:relative;overflow:hidden}
.flavor-card::before{content:'';position:absolute;top:0;right:0;width:60px;height:60px;border-radius:0 14px 0 60px;opacity:.15}
.flavor-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.flavor-card .f-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.flavor-card .f-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4em;flex-shrink:0}
.flavor-card .f-name{font-size:1.2em;font-weight:bold}
.flavor-card .f-en{font-size:.75em;color:var(--text2)}
.flavor-card .f-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.flavor-card .f-tag{font-size:.7em;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text2)}
.flavor-card .f-desc{font-size:.82em;color:var(--text2);line-height:1.5}
.flavor-card .f-dishes{margin-top:8px;font-size:.78em;color:var(--accent)}
.flavor-card.hidden{display:none}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:14px;padding:26px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;border:1px solid var(--border)}
.modal h2{font-size:1.4em;margin-bottom:10px}
.modal .close-btn{float:right;background:none;border:none;color:var(--text2);font-size:1.4em;cursor:pointer}
.modal p{font-size:.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.modal ul{list-style:none;padding:0}
.modal ul li{padding:5px 0;font-size:.83em;color:var(--text2);border-bottom:1px solid var(--border)}
.modal ul li::before{content:'• ';color:var(--accent)}
footer{text-align:center;padding:30px;color:var(--text2);font-size:.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.flavor-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>👅 中餐味型图谱</h1>
<p>Chinese Flavor Profile — 酸甜苦辣咸鲜麻的奥秘</p>
</header>
<div class="container">
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索味型或菜品..."></div>
<div class="filter-btns" id="filterBtns">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="基础味">基础味</button>
<button class="filter-btn" data-filter="复合味">复合味</button>
<button class="filter-btn" data-filter="地方味">地方特色味</button>
</div>
<div class="flavor-grid" id="flavorGrid"></div>
<footer><p>👅 中餐味型图谱 — 五味调和，百菜百味</p></footer>
</div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="close-btn" id="closeModal">×</button><div id="modalContent"></div></div></div>
<script>
const FLAVORS=[
{name:"咸",en:"Salty",icon:"🧂",category:"基础味",color:"#6b7280",desc:"中餐最基础的味道。盐能提鲜、去腥、定味。所有菜肴都离不开咸味。用量讲究'咸而不涩'。",keyIngredients:["盐","酱油","豆瓣酱","豆豉","虾酱"],dishes:["盐水鸭","咸鱼","咸肉"],tips:"盐要最后放，先放盐会让蛋白质凝固变老。炒菜时少量多次加盐更均匀。"},
{name:"甜",en:"Sweet",icon:"🍯",category:"基础味",color:"#f59e0b",desc:"甜味能提鲜、增色、缓和辣味。中餐用糖讲究'甜而不腻'。冰糖上色效果最好，白糖最常用。",keyIngredients:["冰糖","白糖","红糖","蜂蜜","麦芽糖"],dishes:["糖醋排骨","红烧肉","拔丝地瓜","糖葫芦"],tips:"炒糖色用冰糖，色泽最亮。糖要小火慢炒，过火会苦。"},
{name:"酸",en:"Sour",icon:"🍋",category:"基础味",color:"#84cc16",desc:"酸味能开胃、去腥、解腻。中餐用醋讲究'酸而不呛'。山西老陈醋和镇江香醋最有名。",keyIngredients:["陈醋","白醋","米醋","柠檬","番茄"],dishes:["西湖醋鱼","醋溜白菜","酸辣汤","锅包肉"],tips:"醋要沿锅边淋入，高温激发香气。出锅前加醋保持酸味。"},
{name:"辣",en:"Spicy",icon:"🌶️",category:"基础味",color:"#ef4444",desc:"辣味能开胃、发汗、驱寒。中餐辣分干辣、鲜辣、酸辣、麻辣等。辣椒品种决定辣度和风味。",keyIngredients:["干辣椒","新鲜辣椒","辣椒面","辣椒油","剁椒"],dishes:["水煮鱼","辣子鸡","剁椒鱼头","辣椒炒肉"],tips:"辣椒品种很重要。二荆条香，小米辣辣，灯笼椒甜。辣度因品种而异。"},
{name:"鲜",en:"Umami",icon:"🍄",category:"基础味",color:"#10b981",desc:"鲜味是中餐的灵魂。'鲜'字由'鱼'和'羊'组成，古人认为鱼和羊最鲜。现代靠味精、蚝油提鲜。",keyIngredients:["味精","鸡精","蚝油","鱼露","高汤"],dishes:["清蒸鱼","鲜虾云吞","菌菇汤"],tips:"鲜味要'提'不要'盖'。好食材本身就有鲜味，少用味精。"},
{name:"苦",en:"Bitter",icon:"🥬",category:"基础味",color:"#8b5cf6",desc:"苦味在中餐中起调节作用。'苦尽甘来'是中华饮食哲学。苦味食材多有清热解毒功效。",keyIngredients:["苦瓜","莲子芯","苦菊","陈皮","茶叶"],dishes:["凉拌苦瓜","苦瓜炒蛋","莲子汤"],tips:"苦味食材焯水可减轻苦味。搭配甜味或咸味可中和苦味。"},
{name:"麻",en:"Numbing",icon:"⚡",category:"基础味",color:"#6366f1",desc:"麻是花椒产生的独特触觉体验。不是味觉而是触觉——花椒素刺激神经末梢产生的麻酥感。",keyIngredients:["花椒","青花椒","花椒油","藤椒"],dishes:["麻婆豆腐","花椒鸡","椒麻凉面"],tips:"花椒要小火炒香再用。青花椒麻味更清新，红花椒香味更浓。"},
{name:"鱼香味",en:"Yu-Xiang",icon:"🐟",category:"复合味",color:"#f97316",desc:"川菜经典复合味型。'鱼香'并非用鱼，而是用泡椒、姜蒜、糖醋调出类似烹鱼的复合味。无鱼而有鱼香。",keyIngredients:["泡椒","姜蒜末","糖","醋","酱油","豆瓣酱"],dishes:["鱼香肉丝","鱼香茄子","鱼香豆腐"],tips:"鱼香汁比例：醋2糖1.5酱油1。泡椒是灵魂，不可省略。"},
{name:"怪味",en:"Strange Flavor",icon:"🎭",category:"复合味",color:"#ec4899",desc:"四川独有的复合味型。集麻、辣、甜、咸、酸、鲜、香于一体，味道层次丰富，故名'怪味'。",keyIngredients:["花椒","辣椒","糖","醋","酱油","芝麻酱","花生碎"],dishes:["怪味鸡丝","怪味胡豆"],tips:"各种调味料比例要精确平衡。任何一种味道都不能过于突出。"},
{name:"椒麻味",en:"Pepper-Numbing",icon:"🫑",category:"复合味",color:"#14b8a6",desc:"以花椒和葱为主要调味的复合味型。麻香浓郁，清爽可口。是川菜中比较温和的味型。",keyIngredients:["花椒","小葱","酱油","香油","盐"],dishes:["椒麻鸡","椒麻拌面","椒麻肚丝"],tips:"花椒要用鲜花椒或现炒的干花椒。葱要切得极细。"},
{name:"麻辣味",en:"Mala",icon:"🔥",category:"复合味",color:"#dc2626",desc:"川菜最具代表性的味型。花椒的麻加辣椒的辣，麻中有辣，辣中有麻，越吃越上瘾。",keyIngredients:["花椒","干辣椒","豆瓣酱","姜蒜","辣椒面"],dishes:["水煮牛肉","麻婆豆腐","麻辣火锅","辣子鸡"],tips:"花椒和辣椒的比例是关键。先炒辣椒出红油，再放花椒出麻味。"},
{name:"酸辣味",en:"Hot and Sour",icon:"🌶️",category:"复合味",color:"#f43f5e",desc:"酸味与辣味的完美结合。开胃解腻，是汤品和面食中最常用的味型。",keyIngredients:["醋","辣椒","胡椒","姜","香菜"],dishes:["酸辣汤","酸辣粉","酸辣鱼","酸辣面"],tips:"醋和辣椒的比例可按个人口味调整。胡椒粉增香提味。"},
{name:"糖醋味",en:"Sweet and Sour",icon:"🍯",category:"复合味",color:"#eab308",desc:"甜味与酸味的经典组合。外酥里嫩、酸甜适口。是鲁菜和苏菜的代表味型。",keyIngredients:["糖","醋","番茄酱","酱油","淀粉"],dishes:["糖醋里脊","糖醋排骨","糖醋鱼","锅包肉"],tips:"糖醋比例一般为3:2。番茄酱可增加色泽和风味。"},
{name:"家常味",en:"Home-style",icon:"🏠",category:"地方味",color:"#78716c",desc:"川菜基础味型。以豆瓣酱为基础，咸鲜微辣。是最家常、最下饭的味道。",keyIngredients:["豆瓣酱","酱油","盐","姜蒜","葱"],dishes:["回锅肉","家常豆腐","家常白菜"],tips:"豆瓣酱要炒出红油。火候掌握是关键。"},
{name:"咸鲜味",en:"Salty-Umami",icon:"🧂",category:"地方味",color:"#0ea5e9",desc:"粤菜和苏菜的核心味型。以食材本味为主，调味为辅。讲究'咸而不涩，鲜而不腻'。",keyIngredients:["盐","酱油","蚝油","高汤","姜葱"],dishes:["白切鸡","清蒸鱼","盐水鸭"],tips:"好食材不需要复杂调味。清淡中见真功。"},
{name:"蒜香味",en:"Garlic",icon:"🧄",category:"地方味",color:"#a3a3a3",desc:"以大量蒜蓉为特色的味型。蒜香浓郁，开胃下饭。在粤菜和湘菜中尤其常见。",keyIngredients:["蒜蓉","盐","油","葱花","红椒"],dishes:["蒜蓉蒸虾","蒜蓉西兰花","蒜蓉烤生蚝"],tips:"蒜蓉要切碎不要拍碎。蒜蓉炒至微黄最香。"},
{name:"豆豉味",en:"Fermented Black Bean",icon:"🫘",category:"地方味",color:"#57534e",desc:"以豆豉为基础的复合味型。豆豉经过发酵，有独特的咸鲜香味。是粤菜和川菜的常用调味。",keyIngredients:["豆豉","蒜","姜","辣椒","酱油"],dishes:["豆豉鲮鱼","豆豉蒸排骨","豆豉炒苦瓜"],tips:"豆豉要剁碎再用，香味更易释放。炒制时小火慢炒。"}
];
let currentFilter='all';
function render(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const grid=document.getElementById('flavorGrid');
  const filtered=FLAVORS.filter(f=>{
    if(q&&!f.name.includes(q)&&!f.en.toLowerCase().includes(q)&&!f.dishes.some(d=>d.includes(q)))return false;
    if(currentFilter!=='all'&&f.category!==currentFilter)return false;
    return true;
  });
  if(!filtered.length){grid.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2);grid-column:1/-1">未找到匹配的味型</div>';return}
  grid.innerHTML=filtered.map(f=>`
    <div class="flavor-card" onclick="showDetail(${FLAVORS.indexOf(f)})" style="--card-accent:${f.color}">
      <div style="position:absolute;top:0;right:0;width:60px;height:60px;border-radius:0 14px 0 60px;background:${f.color};opacity:.1"></div>
      <div class="f-head"><div class="f-icon" style="background:${f.color}20;color:${f.color}">${f.icon}</div><div><div class="f-name">${f.name}</div><div class="f-en">${f.en}</div></div></div>
      <div class="f-tags"><span class="f-tag">${f.category}</span></div>
      <div class="f-desc">${f.desc.substring(0,50)}...</div>
      <div class="f-dishes">代表菜：${f.dishes.slice(0,2).join('、')}</div>
    </div>`).join('');
}
function showDetail(idx){
  const f=FLAVORS[idx];
  document.getElementById('modalContent').innerHTML=`
    <h2>${f.icon} ${f.name}味 <span style="font-size:.5em;color:var(--text2)">${f.en}</span></h2>
    <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap"><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">${f.category}</span></div>
    <p>${f.desc}</p>
    <p><strong>关键调料：</strong>${f.keyIngredients.join('、')}</p>
    <p><strong>代表菜品：</strong></p><ul>${f.dishes.map(d=>`<li>${d}</li>`).join('')}</ul>
    <p><strong>💡 调味技巧：</strong>${f.tips}</p>`;
  document.getElementById('modal').classList.add('show');
}
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('show')};
document.getElementById('searchInput').addEventListener('input',render);
document.getElementById('filterBtns').addEventListener('click',e=>{
  if(!e.target.classList.contains('filter-btn'))return;
  e.target.parentElement.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter=e.target.dataset.filter;
  render();
});
render();
</script>
</body>
</html>
