<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚗️ 科学单位换算器</title>
<meta property="og:title" content="⚗️ 科学单位换算器">
<meta property="og:description" content="⚗️ 科学单位换算器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="科学单位换算器 - 支持长度、质量、温度、能量、压力、速度等常用科学单位的精确换算">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚗️</text></svg>">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;line-height:1.4}
.hdr{text-align:center;margin-bottom:16px}
.hdr h1{font-size:1.6rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.cat-tabs button{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.8rem;transition:all .2s}
.cat-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.converter{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;max-width:600px;margin:0 auto}
.row{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.row label{font-size:.8rem;color:var(--text2);min-width:60px}
.row select,.row input{flex:1;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;outline:none}
.row input:focus{border-color:var(--accent)}
.swap-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--accent);cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.swap-btn:hover{background:var(--accent);color:#fff}
.result-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;margin-top:8px}
.result-box .val{font-size:1.8rem;font-weight:700;color:var(--accent)}
.result-box .formula{font-size:.8rem;color:var(--text2);margin-top:6px}
.history{margin-top:16px}
.history h3{font-size:.9rem;color:var(--text2);margin-bottom:8px}
.history-list{max-height:200px;overflow-y:auto}
.history-item{padding:6px 10px;border-bottom:1px solid var(--border);font-size:.8rem;color:var(--text2);display:flex;justify-content:space-between}
.history-item:last-child{border-bottom:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="hdr"><h1>⚗️ 科学单位换算器</h1><p>支持长度、质量、温度、能量、压力、速度等常用科学单位的精确换算</p></div>
<div class="cat-tabs" id="catTabs"></div>
<div class="converter">
<div class="row"><label>输入值</label><input type="number" id="inputVal" value="1" step="any" oninput="convert()"></div>
<div class="row"><label>从</label><select id="fromUnit" onchange="convert()"></select><button class="swap-btn" onclick="swapUnits()">⇄</button><label>到</label><select id="toUnit" onchange="convert()"></select></div>
<div class="result-box"><div class="val" id="result">—</div><div class="formula" id="formula"></div></div>
</div>
<div class="history"><h3>📝 换算记录</h3><div class="history-list" id="historyList"><div style="color:var(--text2);font-size:.8rem;text-align:center;padding:10px">暂无记录</div></div></div>

<script>
const categories={
length:{name:'长度',units:{米:'1',千米:'0.001',厘米:'100',毫米:'1000',英里:'0.000621371',英尺:'3.28084',英寸:'39.3701',纳米:'1e9',微米:'1e6',天文单位:'6.68459e-12',光年:'1.057e-16',海里:'0.000539957',码:'1.09361',英尺:'3.28084'}},
mass:{name:'质量',units:{千克:'1',克:'1000',毫克:'1e6',吨:'0.001',磅:'2.20462',盎司:'35.274',原子质量单位:'6.022e26',英石:'0.157473',短吨:'0.00110231',长吨:'0.000984207'}},
temperature:{name:'温度',units:{摄氏度:'C',华氏度:'F',开尔文:'K'},isTemp:true},
energy:{name:'能量',units:{焦耳:'1',千焦:'0.001',卡路里:'0.239006',千卡:'0.000239006',千瓦时:'2.77778e-7',电子伏特:'6.242e+18',英热单位:'0.000947817',尔格:'1e7',英尺磅:'0.737562'}},
pressure:{name:'压力',units:{帕斯卡:'1',千帕:'0.001',兆帕:'1e-6',标准大气压:'9.8692e-6',巴:'1e-5',毫米汞柱:'0.00750062',磅每平方英寸:'0.000145038',托:'0.00750062',厘米水柱:'0.0000101972'}},
speed:{name:'速度',units:{米每秒:'1',千米每小时:'3.6',英里每小时:'2.23694',节:'1.94384',马赫:'0.00293858',光速:'3.33564e-9',英尺每秒:'3.28084'}},
volume:{name:'体积',units:{升:'1',毫升:'1000',立方米:'0.001',立方厘米:'1000',加仑:'0.264172',夸脱:'1.05669',品脱:'2.11338',杯:'4.22675',立方英尺:'0.0353147',立方英寸:'61.0237'}},
area:{name:'面积',units:{平方米:'1',平方千米:'1e-6',平方厘米:'1e4',公顷:'1e-4',英亩:'0.000247105',平方英里:'3.861e-7',平方英尺:'10.7639',平方英寸:'1550'},data:{bytes:'1',千字节:'0.001',兆字节:'1e-6',吉字节:'1e-9',太字节:'1e-12',比特:'8',千比特:'0.008',兆比特:'8e-6',吉比特:'8e-9'}}
};
const cats=Object.keys(categories);
let curCat='length';
const fromSel=document.getElementById('fromUnit');
const toSel=document.getElementById('toUnit');
const history=[];

function initTabs(){
const el=document.getElementById('catTabs');
el.innerHTML=cats.map(c=>`<button class="${c===curCat?'active':''}" onclick="setCat('${c}')">${categories[c].name}</button>`).join('');
}

function setCat(c){
curCat=c;
initTabs();
const u=Object.keys(categories[c].units);
fromSel.innerHTML=u.map(v=>`<option value="${v}">${v}</option>`).join('');
toSel.innerHTML=u.map(v=>`<option value="${v}">${v}</option>`).join('');
if(u.length>1)toSel.selectedIndex=1;
convert();
}

function convert(){
const val=parseFloat(document.getElementById('inputVal').value);
if(isNaN(val)){document.getElementById('result').textContent='—';return}
const cat=categories[curCat];
const from=fromSel.value;
const to=toSel.value;
let res,formula;
if(cat.isTemp){
res=tempConvert(val,cat.units[from],cat.units[to]);
formula=`${val} ${from} = ${res} ${to}`;
}else{
const factor1=parseFloat(cat.units[from]);
const factor2=parseFloat(cat.units[to]);
res=val/factor1*factor2;
formula=`${val} ${from} × (${factor2}/${factor1})`;
}
const display=res===0?'0':Math.abs(res)<0.001||Math.abs(res)>=1e9?res.toExponential(6):parseFloat(res.toPrecision(10));
document.getElementById('result').textContent=display+' '+to;
document.getElementById('formula').textContent=formula;
addHistory(val,from,display,to);
}

function tempConvert(val,from,to){
let celsius;
if(from==='C')celsius=val;
else if(from==='F')celsius=(val-32)*5/9;
else celsius=val-273.15;
if(to==='C')return parseFloat(celsius.toFixed(4));
if(to==='F')return parseFloat((celsius*9/5+32).toFixed(4));
return parseFloat((celsius+273.15).toFixed(4));
}

function swapUnits(){
const i=fromSel.selectedIndex;
fromSel.selectedIndex=toSel.selectedIndex;
toSel.selectedIndex=i;
convert();
}

function addHistory(val,from,res,to){
history.unshift({val,from,res,to});
if(history.length>20)history.pop();
const el=document.getElementById('historyList');
el.innerHTML=history.map(h=>`<div class="history-item"><span>${h.val} ${h.from}</span><span>→ ${h.res} ${h.to}</span></div>`).join('');
}

initTabs();
setCat('length');
</script>
</body>
</html>
