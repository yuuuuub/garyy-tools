<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM查找 - ATM Finder</title>
<meta name="description" content="ATM银行自助终端查找工具，快速定位附近的ATM">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--muted:#8b949e}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vhpadding:16px;scroll-behavior:smooth;}
.container{max-width:1200px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 0}
header h1{font-size:1.8em;margin-bottom:4px}
header p{color:var(--muted)}
.filters{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.filter-group label{font-size:12px;color:var(--muted);font-weight:600}
.filter-group input,.filter-group select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px;width:100%}
.filter-group input:focus,.filter-group select:focus{outline:none;border-color:var(--accent)}
.bank-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.bank-tab{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s}
.bank-tab.active{background:var(--accent);border-color:var(--accent);color:var(--text)}
.sort-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.sort-bar span{color:var(--muted);font-size:14px}
.sort-options{display:flex;gap:8px}
.sort-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.sort-btn.active{background:var(--accent);border-color:var(--accent)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card h3{font-size:16px;margin-bottom:8px}
.card-info{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);margin-bottom:10px}
.card-info span{display:flex;align-items:center;gap:6px}
.badge-24h{font-size:11px;padding:3px 8px;border-radius:12px;background:rgba(34,197,94,.15);color:var(--green);font-weight:600}
.badge-normal{font-size:11px;padding:3px 8px;border-radius:12px;background:rgba(59,130,246,.15);color:var(--accent);font-weight:600}
.features{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.feat-tag{font-size:11px;padding:2px 8px;border-radius:10px}
.feat-withdraw{background:rgba(34,197,94,.1);color:var(--green)}
.feat-deposit{background:rgba(59,130,246,.1);color:var(--accent)}
.feat-transfer{background:rgba(234,179,8,.1);color:var(--yellow)}
.cards-accepted{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.card-tag{font-size:10px;padding:2px 6px;border-radius:8px;background:rgba(139,148,158,.1);color:var(--muted)}
.distance{font-size:12px;color:var(--green);font-weight:600;margin-top:6px}
.no-results{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:640px){.results{grid-template-columns:1fr}.filters{flex-direction:column}}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="ATM查找 - ATM Finder">
  <meta property="og:description" content="ATM银行自助终端查找工具，快速定位附近的ATM">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/atm-finder/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>🏧 ATM查找</h1><p>查找附近ATM机，快速存取款</p></header>
<div class="filters">
<div class="filter-group" style="flex:2"><label>搜索</label><input type="text" id="search" placeholder="输入银行名称或地址..."></div>
<div class="filter-group"><label>功能</label><select id="funcFilter"><option value="">全部</option><option value="取款">取款</option><option value="存款">存款</option><option value="转账">转账</option></select></div>
<div class="filter-group"><label>营业时间</label><select id="hourFilter"><option value="">全部</option><option value="24h">24小时</option><option value="day">日间</option></select></div>
</div>
<div class="bank-tabs" id="bankTabs"><button class="bank-tab active" data-bank="">全部</button></div>
<div class="sort-bar"><span id="resultCount"></span><div class="sort-options"><button class="sort-btn active" data-sort="distance">距离优先</button><button class="sort-btn" data-sort="name">名称排序</button></div></div>
<div class="results" id="results"></div>
</div>
<script>
const atms=[
{id:1,name:"工商银行ATM(国贸)",bank:"工商银行",address:"朝阳区建国路88号门口",distance:0.3,is24h:true,features:["取款","存款","转账"],cards:["银联","Visa","Mastercard"],phone:"010-58881688",hours:"24小时"},
{id:2,name:"建设银行ATM(中关村)",bank:"建设银行",address:"海淀区中关村大街1号1层",distance:0.8,is24h:true,features:["取款","转账"],cards:["银联"],phone:"010-82618888",hours:"24小时"},
{id:3,name:"农业银行ATM(西单)",bank:"农业银行",address:"西城区西单北大街120号",distance:1.2,is24h:false,features:["取款","存款"],cards:["银联","Visa"],phone:"010-66018888",hours:"08:00-22:00"},
{id:4,name:"中国银行ATM(王府井)",bank:"中国银行",address:"东城区王府井大街88号",distance:1.5,is24h:true,features:["取款","存款","转账"],cards:["银联","Visa","Mastercard","JCB"],phone:"010-65881688",hours:"24小时"},
{id:5,name:"招商银行ATM(望京)",bank:"招商银行",address:"朝阳区望京街10号",distance:2.0,is24h:true,features:["取款","转账"],cards:["银联"],phone:"010-65058888",hours:"24小时"},
{id:6,name:"交通银行ATM(陆家嘴)",bank:"交通银行",address:"浦东新区陆家嘴环路900号",distance:0.5,is24h:true,features:["取款","存款","转账"],cards:["银联","Visa"],phone:"021-58881688",hours:"24小时"},
{id:7,name:"浦发银行ATM(静安)",bank:"浦发银行",address:"静安区南京西路1000号",distance:1.0,is24h:false,features:["取款","转账"],cards:["银联"],phone:"021-62881688",hours:"08:30-21:00"},
{id:8,name:"工商银行ATM(五道口)",bank:"工商银行",address:"海淀区成府路35号",distance:0.6,is24h:true,features:["取款","存款"],cards:["银联","Visa"],phone:"010-58881888",hours:"24小时"},
{id:9,name:"建设银行ATM(三里屯)",bank:"建设银行",address:"朝阳区三里屯路19号",distance:1.8,is24h:true,features:["取款","存款","转账"],cards:["银联"],phone:"010-64161888",hours:"24小时"},
{id:10,name:"中国银行ATM(金融街)",bank:"中国银行",address:"西城区金融大街甲3号",distance:2.5,is24h:false,features:["取款","存款","转账"],cards:["银联","Visa","Mastercard"],phone:"010-66011688",hours:"09:00-18:00"}
];
const bankNames=[...new Set(atms.map(a=>a.bank))];
let currentBank="",currentSort="distance";
const tabsEl=document.getElementById("bankTabs");
bankNames.forEach(bn=>{const btn=document.createElement("button");btn.className="bank-tab";btn.dataset.bank=bn;btn.textContent=bn;tabsEl.appendChild(btn)});
function render(){
const q=document.getElementById("search").value.toLowerCase();
const ff=document.getElementById("funcFilter").value;
const hf=document.getElementById("hourFilter").value;
let filtered=atms.filter(a=>{
if(q&&!a.name.includes(q)&&!a.address.includes(q))return false;
if(currentBank&&a.bank!==currentBank)return false;
if(ff&&!a.features.includes(ff))return false;
if(hf==="24h"&&!a.is24h)return false;
if(hf==="day"&&a.is24h)return false;
return true;
});
filtered.sort({distance:(a,b)=>a.distance-b.distance,name:(a,b)=>a.name.localeCompare(b.name,"zh")}[currentSort]||(a,b)=>a.distance-b.distance);
document.getElementById("resultCount").textContent=`找到 ${filtered.length} 台ATM`;
const c=document.getElementById("results");
if(!filtered.length){c.innerHTML='<div class="no-results"><p>未找到符合条件的ATM</p></div>';return}
c.innerHTML=filtered.map(a=>`<div class="card"><h3>${a.name}</h3>${a.is24h?'<span class="badge-24h">🕐 24小时</span>':'<span class="badge-normal">🕐 日间</span>'}<div class="card-info"><span>📍 ${a.address}</span><span>📞 ${a.phone}</span><span>🕐 ${a.hours}</span></div><div class="features">${a.features.map(f=>`<span class="feat-tag feat-${f==="取款"?"withdraw":f==="存款"?"deposit":"transfer"}">${f==="取款"?"💸 取款":f==="存款"?"💰 存款":"🔄 转账"}</span>`).join("")}</div><div class="cards-accepted">${a.cards.map(cd=>`<span class="card-tag">${cd}</span>`).join("")}</div><div class="distance">📍 距您 ${a.distance}km</div></div>`).join("")
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("funcFilter").addEventListener("change",render);
document.getElementById("hourFilter").addEventListener("change",render);
tabsEl.addEventListener("click",e=>{if(e.target.classList.contains("bank-tab")){tabsEl.querySelectorAll(".bank-tab").forEach(x=>x.classList.remove("active"));e.target.classList.add("active");currentBank=e.target.dataset.bank;render()}});
document.querySelectorAll(".sort-btn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".sort-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentSort=b.dataset.sort;render()}));
render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
