<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="色彩心理学工具 - 探索颜色对情绪和行为的影响，辅助设计决策">
    <meta name="robots" content="index, follow">
    <title>色彩心理学工具</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #6366f1; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #818cf8; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="color"], textarea, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        input[type="color"] { height: 50px; padding: 4px; cursor: pointer; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 8px; }
        button:hover { opacity: 0.9; }
        .btn-sm { padding: 4px 10px; font-size: 13px; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
        .color-card { border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); cursor: pointer; transition: transform 0.2s; }
        .color-card:hover { transform: scale(1.03); }
        .color-swatch { height: 120px; }
        .color-info { padding: 12px; }
        .color-name { font-weight: bold; margin-bottom: 4px; }
        .color-meaning { font-size: 13px; color: var(--secondary-color); }
        .color-tags { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; background: var(--primary-color); color: white; }
        .result-panel { padding: 20px; border-radius: 8px; border: 2px solid var(--primary-color); background: var(--card-bg); }
        .result-panel h3 { margin-top: 0; }
        .emotion-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
        .emotion-chip { padding: 6px 14px; border-radius: 20px; background: var(--card-bg); border: 1px solid var(--border-color); font-size: 14px; }
        .combo-preview { display: flex; gap: 2px; height: 60px; border-radius: 8px; overflow: hidden; margin: 12px 0; }
        .combo-swatch { flex: 1; }
        .harmony-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
        .harmony-item { padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); cursor: pointer; }
        .harmony-item:hover { border-color: var(--primary-color); }
        .harmony-colors { display: flex; gap: 4px; margin-top: 8px; }
        .harmony-dot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border-color); }
        .export-area { white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 12px; background: var(--bg-color); padding: 12px; border-radius: 4px; border: 1px solid var(--border-color); max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>色彩心理学工具</h1>

        <div class="card">
            <h3>颜色探索</h3>
            <div class="color-grid" id="colorGrid"></div>
        </div>

        <div class="card">
            <h3>自定义颜色分析</h3>
            <div style="display:flex;gap:16px;align-items:flex-end;">
                <div class="form-group" style="flex:0 0 100px;">
                    <label>选择颜色</label>
                    <input type="color" id="customColor" value="#6366f1">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>或输入HEX</label>
                    <input type="text" id="hexInput" value="#6366f1" placeholder="#000000">
                </div>
                <button onclick="analyzeCustomColor()">分析</button>
            </div>
            <div id="customResult" style="margin-top:16px;"></div>
        </div>

        <div class="card">
            <h3>配色方案推荐</h3>
            <p>基于心理学的配色组合：</p>
            <div class="harmony-list" id="harmonyList"></div>
        </div>

        <div class="card">
            <h3>色彩情感对照表</h3>
            <div id="emotionTable"></div>
        </div>

        <div class="card">
            <h3>导出CSS变量</h3>
            <button class="btn-sm" onclick="exportCSS()">生成CSS</button>
            <div class="export-area" id="exportArea" style="margin-top:10px;">点击"生成CSS"查看输出</div>
        </div>
    </div>

    <script defer src="i18n.js"></script>
    <script>
        const colorData = [
            { name: '红色', hex: '#ef4444', emotions: ['激情','力量','紧迫','爱情'], industry: ['餐饮','娱乐','零售'], psychology: '激发兴奋感和紧迫感，提高心率，常用于促销和警示。', tags: ['活力','热情','危险'] },
            { name: '橙色', hex: '#f97316', emotions: ['温暖','友好','活力','创意'], industry: ['旅游','食品','体育'], psychology: '传达温暖和友好，激发创造力和热情，适合年轻化品牌。', tags: ['快乐','积极','活力'] },
            { name: '黄色', hex: '#eab308', emotions: ['乐观','快乐','警示','智慧'], industry: ['快餐','教育','零售'], psychology: '引起注意和乐观情绪，但过度使用会产生焦虑。', tags: ['明亮','欢快','警觉'] },
            { name: '绿色', hex: '#22c55e', emotions: ['自然','成长','安全','健康'], industry: ['环保','医疗','金融'], psychology: '传达和谐与平衡，减轻压力，与自然和健康紧密关联。', tags: ['清新','稳定','生命'] },
            { name: '蓝色', hex: '#3b82f6', emotions: ['信任','专业','平静','科技'], industry: ['科技','金融','医疗'], psychology: '建立信任感和专业形象，降低心率，最受欢迎的企业色。', tags: ['可靠','冷静','专业'] },
            { name: '紫色', hex: '#a855f7', emotions: ['奢华','神秘','创意','高贵'], industry: ['美容','奢侈品','创意'], psychology: '象征高贵和神秘，激发创造力，与灵性和想象力相关。', tags: ['优雅','神秘','艺术'] },
            { name: '粉色', hex: '#ec4899', emotions: ['浪漫','温柔','爱','青春'], industry: ['美容','时尚','母婴'], psychology: '传达温柔和关怀，降低攻击性，常与女性和年轻群体关联。', tags: ['甜蜜','柔和','浪漫'] },
            { name: '黑色', hex: '#1a1a1a', emotions: ['力量','优雅','神秘','高端'], industry: ['奢侈品','时尚','汽车'], psychology: '象征权威、优雅和高端，但也可能传达沉重或严肃。', tags: ['高级','权威','经典'] },
            { name: '白色', hex: '#ffffff', emotions: ['纯净','简洁','和平','干净'], industry: ['医疗','科技','极简'], psychology: '代表纯洁和简洁，创造空间感，常用于极简设计。', tags: ['清爽','简约','纯洁'] },
            { name: '灰色', hex: '#6b7280', emotions: ['中性','专业','稳重','平衡'], industry: ['企业','金融','咨询'], psychology: '传达专业和中立，避免情感偏向，但可能显得单调。', tags: ['沉稳','商务','中性'] },
            { name: '青色', hex: '#06b6d4', emotions: ['清新','现代','科技','信任'], industry: ['科技','社交','教育'], psychology: '结合蓝色的信赖感和绿色的平衡感，传达现代和创新。', tags: ['清新','未来','沟通'] },
            { name: '棕色', hex: '#92400e', earthy: true, emotions: ['可靠','温暖','大地','质朴'], industry: ['咖啡','木材','有机'], psychology: '与大地和自然关联，传达可靠和温暖，适合有机和手工品牌。', tags: ['自然','温暖','稳重'] }
        ];

        const harmonies = [
            { name: '信任与科技', colors: ['#3b82f6','#06b6d4','#1e40af','#e0f2fe'], desc: '蓝色系配色，适合科技和金融' },
            { name: '活力与热情', colors: ['#ef4444','#f97316','#eab308','#fef3c7'], desc: '暖色系渐变，适合餐饮和娱乐' },
            { name: '自然与健康', colors: ['#22c55e','#06b6d4','#15803d','#ecfdf5'], desc: '绿色系，适合环保和医疗' },
            { name: '奢华与高端', colors: ['#a855f7','#1a1a1a','#9333ea','#f5f3ff'], desc: '紫色搭配黑色，适合奢侈品牌' },
            { name: '活力青春', colors: ['#ec4899','#f97316','#eab308','#fdf2f8'], desc: '明亮暖色，适合年轻化品牌' },
            { name: '沉稳专业', colors: ['#374151','#6b7280','#111827','#f9fafb'], desc: '灰阶配色，适合企业和咨询' }
        ];

        const emotionTableData = [
            { emotion: '快乐', primary: '#eab308', secondary: '#f97316', desc: '黄、橙色系，明亮温暖' },
            { emotion: '悲伤', primary: '#3b82f6', secondary: '#1e3a5f', desc: '深蓝色系，冷调沉静' },
            { emotion: '愤怒', primary: '#ef4444', secondary: '#991b1b', desc: '红色系，强烈刺激' },
            { emotion: '恐惧', primary: '#1a1a1a', secondary: '#7c3aed', desc: '黑色搭配紫色，神秘不安' },
            { emotion: '信任', primary: '#3b82f6', secondary: '#06b6d4', desc: '蓝色系，稳定可靠' },
            { emotion: '爱', primary: '#ef4444', secondary: '#ec4899', desc: '红色和粉色，热情温柔' },
            { emotion: '平静', primary: '#22c55e', secondary: '#06b6d4', desc: '绿色和青色，自然和谐' },
            { emotion: '能量', primary: '#f97316', secondary: '#ef4444', desc: '橙红色，充满活力' }
        ];

        let selectedColors = [];

        function init() {
            renderColorGrid();
            renderHarmonies();
            renderEmotionTable();
            document.getElementById('customColor').addEventListener('input', e => {
                document.getElementById('hexInput').value = e.target.value;
            });
            document.getElementById('hexInput').addEventListener('input', e => {
                if (/^#[0-9a-f]{6}$/i.test(e.target.value)) {
                    document.getElementById('customColor').value = e.target.value;
                }
            });
        }

        function renderColorGrid() {
            const grid = document.getElementById('colorGrid');
            grid.innerHTML = colorData.map(c => `
                <div class="color-card" onclick="selectColor('${c.hex}')">
                    <div class="color-swatch" style="background:${c.hex};"></div>
                    <div class="color-info">
                        <div class="color-name">${c.name}</div>
                        <div class="color-meaning">${c.emotions.join('、')}</div>
                        <div class="color-tags">${c.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
                    </div>
                </div>
            `).join('');
        }

        function selectColor(hex) {
            if (!selectedColors.includes(hex)) {
                selectedColors.push(hex);
                if (selectedColors.length > 5) selectedColors.shift();
            }
            const c = colorData.find(x => x.hex === hex);
            if (c) {
                document.getElementById('customColor').value = hex;
                document.getElementById('hexInput').value = hex;
            }
            analyzeCustomColor();
        }

        function hexToHSL(hex) {
            let r = parseInt(hex.slice(1,3),16)/255;
            let g = parseInt(hex.slice(3,5),16)/255;
            let b = parseInt(hex.slice(5,7),16)/255;
            const max = Math.max(r,g,b), min = Math.min(r,g,b);
            let h, s, l = (max+min)/2;
            if (max === min) { h = s = 0; } else {
                const d = max - min;
                s = l > 0.5 ? d/(2-max-min) : d/(max+min);
                switch(max) {
                    case r: h = ((g-b)/d + (g<b?6:0))/6; break;
                    case g: h = ((b-r)/d + 2)/6; break;
                    case b: h = ((r-g)/d + 4)/6; break;
                }
            }
            return { h: Math.round(h*360), s: Math.round(s*100), l: Math.round(l*100) };
        }

        function getEmotionForHue(h) {
            if (h < 15) return '激情、力量';
            if (h < 45) return '温暖、活力';
            if (h < 70) return '乐观、快乐';
            if (h < 160) return '自然、成长';
            if (h < 260) return '信任、专业';
            if (h < 300) return '神秘、创意';
            return '浪漫、温柔';
        }

        function analyzeCustomColor() {
            const hex = document.getElementById('hexInput').value;
            if (!/^#[0-9a-fA-F]{6}$/.test(hex)) { alert('请输入有效HEX颜色值'); return; }
            const hsl = hexToHSL(hex);
            const emotions = getEmotionForHue(hsl.h);
            const lightness = hsl.l < 30 ? '深沉' : hsl.l > 70 ? '明亮' : '适中';
            const saturation = hsl.s < 20 ? '低饱和度（中性、沉稳）' : hsl.s > 70 ? '高饱和度（活力、强烈）' : '中饱和度（平衡、和谐）';

            document.getElementById('customResult').innerHTML = `
                <div class="result-panel">
                    <div style="display:flex;gap:20px;align-items:center;">
                        <div style="width:80px;height:80px;border-radius:12px;background:${hex};border:2px solid var(--border-color);"></div>
                        <div>
                            <h3 style="margin:0;">${hex.toUpperCase()}</h3>
                            <p style="margin:4px 0;">色相: ${hsl.h}° | 饱和度: ${hsl.s}% | 明度: ${hsl.l}%</p>
                        </div>
                    </div>
                    <div class="emotion-list">${emotions.split('、').map(e => `<span class="emotion-chip">${e}</span>`).join('')}</div>
                    <p><strong>明度特征：</strong>${lightness}</p>
                    <p><strong>饱和度特征：</strong>${saturation}</p>
                    <p><strong>心理效应：</strong>${getColorPsychology(hsl.h)}</p>
                    <div class="combo-preview" style="margin-top:12px;">
                        <div class="combo-swatch" style="background:${hex};"></div>
                        <div class="combo-swatch" style="background:${adjustBrightness(hex, -30)};"></div>
                        <div class="combo-swatch" style="background:${adjustBrightness(hex, 30)};"></div>
                        <div class="combo-swatch" style="background:${adjustBrightness(hex, 50)};"></div>
                    </div>
                    <p style="font-size:12px;color:var(--secondary-color);">上方为该色的明暗变体，可用于层次设计</p>
                </div>
            `;
        }

        function getColorPsychology(hue) {
            if (hue < 15) return '红色能刺激肾上腺素分泌，提高心率和血压。在设计中营造紧迫感，适合限时促销、重要警示。但过度使用会导致视觉疲劳和焦虑。';
            if (hue < 45) return '橙色结合了红色的能量和黄色的快乐，传达友好和温暖。能激发食欲和好奇心，适合食品和休闲品牌。';
            if (hue < 70) return '黄色是最引人注意的颜色，象征乐观和智慧。但长时间接触会增加焦躁感，建议作为点缀色而非主色使用。';
            if (hue < 160) return '绿色象征生命和成长，能降低血压和缓解眼部疲劳。传达安全和和谐，适合环保、健康和金融类品牌。';
            if (hue < 200) return '青色融合了蓝色的稳定和绿色的活力，传达创新和清晰。适合科技和教育品牌，营造现代感。';
            if (hue < 260) return '蓝色是最受欢迎的企业色，能降低心率和呼吸频率。传达信任和专业，适合金融、科技和医疗行业。';
            if (hue < 300) return '紫色结合了蓝色的稳定和红色的能量，象征创造力和高贵。能激发想象力，适合创意和奢侈品牌。';
            return '粉色代表温柔和关怀，能降低攻击性。传达浪漫和青春，适合美妆、时尚和母婴品牌。';
        }

        function adjustBrightness(hex, amount) {
            let r = Math.max(0, Math.min(255, parseInt(hex.slice(1,3),16) + amount));
            let g = Math.max(0, Math.min(255, parseInt(hex.slice(3,5),16) + amount));
            let b = Math.max(0, Math.min(255, parseInt(hex.slice(5,7),16) + amount));
            return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
        }

        function renderHarmonies() {
            document.getElementById('harmonyList').innerHTML = harmonies.map(h => `
                <div class="harmony-item" onclick="applyHarmony(${JSON.stringify(h.colors).replace(/"/g,'&quot;')})">
                    <strong>${h.name}</strong>
                    <div style="font-size:12px;color:var(--secondary-color);margin-top:4px;">${h.desc}</div>
                    <div class="harmony-colors">${h.colors.map(c => `<div class="harmony-dot" style="background:${c};"></div>`).join('')}</div>
                </div>
            `).join('');
        }

        function applyHarmony(colors) {
            selectedColors = [...colors];
            document.getElementById('customColor').value = colors[0];
            document.getElementById('hexInput').value = colors[0];
            analyzeCustomColor();
        }

        function renderEmotionTable() {
            document.getElementById('emotionTable').innerHTML = `
                <table style="width:100%;border-collapse:collapse;">
                    <thead><tr style="border-bottom:2px solid var(--border-color);">
                        <th style="padding:10px;text-align:left;">情感</th>
                        <th style="padding:10px;text-align:left;">主色</th>
                        <th style="padding:10px;text-align:left;">辅色</th>
                        <th style="padding:10px;text-align:left;">描述</th>
                    </tr></thead>
                    <tbody>${emotionTableData.map(e => `
                        <tr style="border-bottom:1px solid var(--border-color);">
                            <td style="padding:10px;"><strong>${e.emotion}</strong></td>
                            <td style="padding:10px;"><span style="display:inline-block;width:24px;height:24px;border-radius:4px;background:${e.primary};vertical-align:middle;margin-right:6px;"></span>${e.primary}</td>
                            <td style="padding:10px;"><span style="display:inline-block;width:24px;height:24px;border-radius:4px;background:${e.secondary};vertical-align:middle;margin-right:6px;"></span>${e.secondary}</td>
                            <td style="padding:10px;font-size:13px;">${e.desc}</td>
                        </tr>
                    `).join('')}</tbody>
                </table>
            `;
        }

        function exportCSS() {
            const colors = selectedColors.length ? selectedColors : harmonies[0].colors;
            const css = `:root {\n  /* 色彩心理学配色 */\n${colors.map((c,i) => `  --color-${i+1}: ${c};`).join('\n')}\n}`;
            document.getElementById('exportArea').textContent = css;
        }

        function toggleTheme() {
            const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
        }

        init();
    </script>
</body>
</html>
