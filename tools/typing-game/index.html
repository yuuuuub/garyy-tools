<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文打字大作战</title>
<style>
  :root {
    --bg: #0a0a14;
    --panel: #12122a;
    --border: #1e1e44;
    --text: #e0e0ff;
    --accent: #6c5ce7;
    --danger: #ff4757;
    --success: #2ed573;
    --gold: #ffa502;
    --cyan: #0abde3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden; user-select: none;
  }
  #app {
    width: 100vw; height: 100vh; position: relative;
    display: flex; flex-direction: column;
  }

  /* Top HUD */
  #hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    z-index: 10; gap: 12px; flex-shrink: 0;
  }
  #hud .stat {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  #hud .stat .label { color: #888; font-size: 11px; }
  #hud .stat .value { font-size: 16px; color: var(--text); }
  .combo-indicator {
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    padding: 2px 10px; border-radius: 12px; font-weight: 700;
    font-size: 12px; transition: transform .15s;
  }
  .combo-indicator.pulse { animation: comboPulse .3s ease-out; }
  @keyframes comboPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }
  .lives { display: flex; gap: 3px; }
  .lives .heart { font-size: 16px; transition: .2s; }
  .lives .heart.lost { opacity: .2; transform: scale(.7); }

  /* Game Canvas */
  #gameArea {
    flex: 1; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 20%, #1a1a3e 0%, var(--bg) 70%);
    cursor: crosshair;
  }
  #gameCanvas {
    display: block; width: 100%; height: 100%;
  }

  /* Input Bar */
  #inputBar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--border);
    z-index: 10; flex-shrink: 0;
  }
  #wordInput {
    flex: 1; padding: 10px 14px; border-radius: 8px;
    border: 2px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 18px; font-weight: 600;
    outline: none; transition: border .2s;
    text-align: center; letter-spacing: 2px;
  }
  #wordInput:focus { border-color: var(--accent); }
  #wordInput.match { border-color: var(--success) !important; }
  #wordInput.wrong { border-color: var(--danger) !important; }
  #wordInput:disabled { opacity: .5; }

  /* Overlays */
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,.85); z-index: 100;
    display: flex; justify-content: center; align-items: center;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px; max-width: 520px; width: 90%;
    text-align: center;
  }
  .panel h1 { font-size: 32px; margin-bottom: 6px; background: linear-gradient(135deg, var(--accent), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .panel h2 { font-size: 20px; color: #aaa; margin-bottom: 18px; font-weight: 400; }
  .panel p { color: #999; margin-bottom: 16px; line-height: 1.6; font-size: 14px; }
  .btn {
    display: inline-block; padding: 12px 28px; border-radius: 10px;
    border: none; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: all .2s; color: #fff; margin: 4px;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--accent); }
  .btn-danger { background: var(--danger); }
  .btn-success { background: var(--success); color: #000; }
  .btn-gold { background: var(--gold); color: #000; }

  .difficulty-group, .category-group {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    margin-bottom: 14px;
  }
  .chip {
    padding: 6px 14px; border-radius: 20px; border: 2px solid var(--border);
    background: transparent; color: #aaa; font-size: 13px; cursor: pointer;
    transition: all .2s; font-weight: 500;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .section-label {
    font-size: 13px; color: #777; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 1px;
  }

  .leaderboard-table {
    width: 100%; border-collapse: collapse; margin-bottom: 14px;
  }
  .leaderboard-table th, .leaderboard-table td {
    padding: 6px 10px; text-align: left; font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .leaderboard-table th { color: #888; font-weight: 600; }
  .leaderboard-table td { color: var(--text); }
  .rank-1 { color: var(--gold) !important; font-weight: 700; }
  .rank-2 { color: #bdc3c7; font-weight: 700; }
  .rank-3 { color: #e67e22; font-weight: 700; }

  .powerup-notify {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 8px 20px;
    border-radius: 20px; font-weight: 700; font-size: 14px;
    z-index: 50; pointer-events: none; animation: notifyIn .2s ease-out;
  }
  @keyframes notifyIn {
    0% { transform: translateX(-50%) scale(.5); opacity: 0; }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat"><span class="label">得分</span><span class="value" id="scoreDisplay">0</span></div>
    <div class="stat"><span class="label">连击</span><span id="comboDisplay" class="combo-indicator">x1</span></div>
    <div class="stat"><span class="label">关卡</span><span class="value" id="levelDisplay">1</span></div>
    <div class="stat"><span class="label">生命</span><span class="lives" id="livesDisplay"></span></div>
    <div class="stat"><span class="label">计时</span><span class="value" id="timerDisplay">00:00</span></div>
  </div>

  <div id="gameArea">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="inputBar">
    <input type="text" id="wordInput" placeholder="在此输入单词..." autocomplete="off" autofocus>
  </div>

  <!-- Start Screen -->
  <div class="overlay" id="startScreen">
    <div class="panel">
      <h1>⌨ 英文打字大作战</h1>
      <h2>在单词落地前消灭它们！</h2>
      <p>单词从天而降，输入正确单词在它们到达底部之前消灭它们。<br>连击有额外加成！漏掉单词会扣生命值。</p>

      <div class="section-label">选择难度</div>
      <div class="difficulty-group" id="difficultyGroup">
        <span class="chip" data-diff="easy">简单</span>
        <span class="chip active" data-diff="normal">普通</span>
        <span class="chip" data-diff="hard">困难</span>
        <span class="chip" data-diff="insane">疯狂</span>
      </div>

      <div class="section-label">单词类别</div>
      <div class="category-group" id="categoryGroup">
        <span class="chip active" data-cat="all">全部</span>
        <span class="chip" data-cat="animals">🐾 动物</span>
        <span class="chip" data-cat="food">🍕 食物</span>
        <span class="chip" data-cat="tech">💻 科技</span>
        <span class="chip" data-cat="common">📋 常用</span>
      </div>

      <button class="btn btn-primary" id="startBtn" style="margin-top:8px; font-size:18px; padding:14px 40px;">
        开始游戏
      </button>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div class="overlay" id="gameOverScreen" style="display:none;">
    <div class="panel">
      <h1>💥 游戏结束</h1>
      <h2 style="color:var(--danger);">英文消灭数：<span id="finalScore">0</span></h2>
      <p>最大连击：<span id="finalCombo">0</span>x &nbsp;|&nbsp; 最高关卡：<span id="finalLevel">1</span></p>
      <p>消灭单词总数：<span id="finalWords">0</span></p>
      <button class="btn btn-primary" id="restartBtn">再来一局</button>
      <button class="btn btn-gold" id="toMenuBtn">返回菜单</button>

      <div style="margin-top:18px;" id="leaderboardSection">
        <div class="section-label">🏆 排行榜</div>
        <table class="leaderboard-table">
          <thead><tr><th>#</th><th>得分</th><th>难度</th><th>日期</th></tr></thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
        <button class="btn btn-danger" id="clearLB" style="font-size:12px; padding:6px 14px;">清除记录</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  // ========== DOM REFS ==========
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const wordInput = document.getElementById('wordInput');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const comboDisplay = document.getElementById('comboDisplay');
  const levelDisplay = document.getElementById('levelDisplay');
  const livesDisplay = document.getElementById('livesDisplay');
  const timerDisplay = document.getElementById('timerDisplay');

  // ========== AUDIO (Web Audio API) ==========
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let audioStarted = false;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (!audioStarted) { audioCtx.resume(); audioStarted = true; }
  }

  function playBeep(freq, duration, type = 'square', vol = 0.08) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  }

  function sfxHit() { playBeep(800, .1, 'square', .06); setTimeout(() => playBeep(1200, .08, 'square', .04), 60); }
  function sfxMiss() { playBeep(200, .25, 'sawtooth', .08); }
  function sfxCombo() { playBeep(600, .06, 'square', .05); setTimeout(() => playBeep(900, .06, 'square', .05), 50); setTimeout(() => playBeep(1200, .08, 'square', .05), 100); }
  function sfxLevelUp() { playBeep(500, .1, 'triangle', .06); setTimeout(() => playBeep(700, .1, 'triangle', .06), 80); setTimeout(() => playBeep(1000, .15, 'triangle', .06), 160); }
  function sfxPowerUp() { playBeep(300, .08, 'sine', .07); setTimeout(() => playBeep(500, .08, 'sine', .07), 60); setTimeout(() => playBeep(800, .08, 'sine', .07), 120); setTimeout(() => playBeep(1100, .12, 'sine', .07), 180); }

  // ========== WORD DATA ==========
  const wordBank = {
    animals: ['cat','dog','bird','fish','bear','lion','tiger','wolf','deer','duck',
              'frog','goat','hawk','crow','dove','eagle','snake','shark','whale','sheep',
              'horse','mouse','panda','koala','camel','zebra','rabbit','monkey','turtle','parrot',
              'pig','cow','ant','bee','fox','hen','bat','rat','crab','seal'],
    food: ['apple','bread','cake','rice','soup','milk','egg','meat','corn','bean',
           'grape','lemon','mango','peach','orange','banana','cherry','potato','tomato','carrot',
           'onion','sugar','salt','cream','butter','cheese','pizza','sushi','steak','salad',
           'noodle','berry','melon','lime','plum','pear','wine','tea','juice','candy'],
    tech: ['code','data','file','link','node','chip','byte','disk','port','ram',
           'cloud','server','router','screen','keyboard','browser','python','java','linux','apple',
           'proxy','cache','debug','stack','queue','token','array','logic','patch','script',
           'mouse','click','input','output','fetch','merge','push','pull','clone','git'],
    common: ['time','year','life','hand','part','word','name','work','game','book',
             'city','road','home','door','tree','fire','wind','rain','star','moon',
             'gold','blue','dark','cold','warm','fast','slow','high','deep','wide',
             'love','hope','dream','light','music','story','world','ocean','river','stone']
  };

  let activeCategories = ['animals','food','tech','common'];
  let difficulty = 'normal';

  function getAllWords() {
    let words = [];
    activeCategories.forEach(cat => {
      if (wordBank[cat]) words = words.concat(wordBank[cat]);
    });
    return words;
  }

  // ========== DIFFICULTY SETTINGS ==========
  const diffSettings = {
    easy:    { baseSpeed: 0.6, speedInc: 0.008, spawnInterval: 1800, lives: 5, scorePerWord: 10 },
    normal:  { baseSpeed: 0.9, speedInc: 0.015, spawnInterval: 1500, lives: 4, scorePerWord: 15 },
    hard:    { baseSpeed: 1.3, speedInc: 0.025, spawnInterval: 1200, lives: 3, scorePerWord: 20 },
    insane:  { baseSpeed: 1.8, speedInc: 0.040, spawnInterval: 900, lives: 2, scorePerWord: 25 }
  };

  // ========== GAME STATE ==========
  let words = [];           // { word, x, y, color }
  let score = 0;
  let lives = 5;
  let maxLives = 5;
  let level = 1;
  let combo = 0;
  let maxCombo = 0;
  let totalWordsDestroyed = 0;
  let gameRunning = false;
  let gamePaused = false;
  let lastSpawnTime = 0;
  let spawnTimer = 0;
  let currentSpeed = 0;
  let scoreMultiplier = 1;
  let slowMotion = false;
  let slowMotionTimer = 0;
  let elapsedTime = 0;
  let lastFrameTime = 0;
  let particles = [];
  let powerUps = [];       // falling power-up items
  let animFrameId = null;
  let allWords = [];

  // ========== CANVAS SETUP ==========
  function resizeCanvas() {
    const area = document.getElementById('gameArea');
    canvas.width = area.clientWidth;
    canvas.height = area.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);

  // ========== RENDERING ==========
  function drawStars() {
    if (!canvas.width) return;
    // Just a subtle star field
    for (let i = 0; i < 60; i++) {
      const sx = (i * 173 + 37) % canvas.width;
      const sy = ((i * 211 + elapsedTime * 4) % canvas.height);
      ctx.fillStyle = `rgba(180,180,220,${.15 + .08 * Math.sin(elapsedTime * .01 + i)})`;
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
  }

  function drawDangerZone() {
    const h = canvas.height;
    const zoneY = h - 80;
    const gradient = ctx.createLinearGradient(0, zoneY, 0, h);
    gradient.addColorStop(0, 'rgba(255,71,87,0)');
    gradient.addColorStop(0.5, 'rgba(255,71,87,0.08)');
    gradient.addColorStop(1, 'rgba(255,71,87,0.18)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, zoneY, canvas.width, 80);
    ctx.strokeStyle = 'rgba(255,71,87,.3)';
    ctx.setLineDash([10, 15]);
    ctx.beginPath(); ctx.moveTo(0, zoneY); ctx.lineTo(canvas.width, zoneY); ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawWord(w) {
    ctx.save();
    const dangerY = canvas.height - 80;
    const dangerRatio = Math.max(0, Math.min(1, (w.y - dangerY) / 80));
    const alpha = 1;

    // Glow
    ctx.shadowColor = w.color;
    ctx.shadowBlur = 8 + dangerRatio * 12;

    // Word bg
    const textWidth = ctx.measureText(w.word).width + 20;
    const bx = w.x - textWidth / 2;
    const by = w.y - 20;
    const bh = 34;

    // Gradient bg for word
    const grad = ctx.createLinearGradient(bx, by, bx + textWidth, by + bh);
    if (dangerRatio > 0.6) {
      grad.addColorStop(0, '#ff4757');
      grad.addColorStop(1, '#c0392b');
    } else {
      grad.addColorStop(0, w.color);
      grad.addColorStop(1, 'rgba(0,0,0,.6)');
    }
    ctx.fillStyle = grad;
    roundRect(ctx, bx, by, textWidth, bh, 8);
    ctx.fill();

    // Border
    ctx.strokeStyle = w.color;
    ctx.lineWidth = 1.5 + dangerRatio * 2;
    roundRect(ctx, bx, by, textWidth, bh, 8);
    ctx.stroke();

    // Text
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(w.word, w.x, w.y - 2);

    // Progress bar on word
    if (w.lifetime > 0) {
      const progress = Math.min(1, (Date.now() - w.bornTime) / w.lifetime);
      if (progress > 0.3) {
        const pbw = textWidth - 6;
        const pby = by + bh - 5;
        ctx.fillStyle = 'rgba(0,0,0,.4)';
        ctx.fillRect(bx + 3, pby, pbw, 3);
        const progColor = progress > 0.7 ? '#ff4757' : '#2ed573';
        ctx.fillStyle = progColor;
        ctx.fillRect(bx + 3, pby, pbw * progress, 3);
      }
    }

    ctx.restore();
  }

  function drawParticle(p) {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPowerUp(pu) {
    ctx.save();
    const t = Date.now();
    ctx.translate(pu.x, pu.y);
    ctx.rotate(Math.sin(t * .005) * .3);

    // Glow
    ctx.shadowColor = pu.color;
    ctx.shadowBlur = 14 + Math.sin(t * .008) * 6;

    // Icon base
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 18);
    grad.addColorStop(0, pu.color);
    grad.addColorStop(1, 'rgba(0,0,0,.5)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pu.icon, 0, 0);

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.stroke();

    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  // ========== PARTICLES ==========
  function spawnParticles(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 3.5;
      particles.push({
        x, y, color,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        size: 2 + Math.random() * 4,
        alpha: 1,
        decay: .015 + Math.random() * .025
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08; // gravity
      p.alpha -= p.decay;
      if (p.alpha <= 0) particles.splice(i, 1);
    }
  }

  // ========== POWER-UPS ==========
  const powerUpTypes = [
    { type: 'slow', icon: '⏱', color: '#0abde3', label: '时间减速！' },
    { type: 'clear', icon: '💣', color: '#ffa502', label: '清除屏幕！' },
    { type: 'double', icon: 'x2', color: '#2ed573', label: '双倍积分！' }
  ];

  function spawnPowerUp() {
    if (powerUps.length >= 2) return;
    const pu = { ...powerUpTypes[Math.floor(Math.random() * powerUpTypes.length)] };
    pu.x = 40 + Math.random() * (canvas.width - 80);
    pu.y = -30;
    pu.speed = currentSpeed * .7;
    // Only spawn occasionally
    powerUps.push(pu);
  }

  function collectPowerUp(pu) {
    const gameArea = document.getElementById('gameArea');
    switch(pu.type) {
      case 'slow':
        slowMotion = true;
        slowMotionTimer = Date.now() + 5000;
        showNotify('⏱ 时间减速 5秒！');
        break;
      case 'clear':
        words.forEach(w => { if(w.y < canvas.height - 80) spawnParticles(w.x, w.y, w.color, 8); });
        words = words.filter(w => w.y >= canvas.height - 80);
        showNotify('💣 清除屏幕！');
        break;
      case 'double':
        scoreMultiplier = 2;
        setTimeout(() => { scoreMultiplier = 1; }, 8000);
        showNotify('x2 双倍积分 8秒！');
        break;
    }
    sfxPowerUp();
    spawnParticles(pu.x, pu.y, pu.color, 20);
  }

  function showNotify(msg) {
    const area = document.getElementById('gameArea');
    const el = document.createElement('div');
    el.className = 'powerup-notify';
    el.textContent = msg;
    area.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }

  // ========== MAIN GAME LOOP ==========
  function gameLoop(timestamp) {
    if (!gameRunning) return;
    if (!lastFrameTime) lastFrameTime = timestamp;
    let dt = timestamp - lastFrameTime;
    lastFrameTime = timestamp;
    if (dt > 200) dt = 200; // cap

    const actualDt = slowMotion ? dt * .4 : dt;
    elapsedTime += dt;

    // Update speed
    const d = diffSettings[difficulty];
    currentSpeed = d.baseSpeed + d.speedInc * elapsedTime / 1000;

    // Level up
    const newLevel = Math.floor(elapsedTime / 30000) + 1;
    if (newLevel > level) {
      level = newLevel;
      sfxLevelUp();
      showNotify(`🔺 第 ${level} 关！`);
      spawnParticles(canvas.width / 2, canvas.height / 2, '#ffa502', 40);
    }

    // Update timer display
    const totalSec = Math.floor(elapsedTime / 1000);
    const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const sec = String(totalSec % 60).padStart(2, '0');
    timerDisplay.textContent = `${min}:${sec}`;

    // Slow motion timer
    if (slowMotion && Date.now() > slowMotionTimer) slowMotion = false;

    // Update double score
    // handled by timeout in collectPowerUp

    // Spawn words
    spawnTimer += dt;
    const spawnInt = d.spawnInterval - level * 80;
    const minSpawn = Math.max(400, spawnInt);
    if (spawnTimer >= minSpawn) {
      spawnTimer = 0;
      spawnWord();
      // Occasional power-up
      if (Math.random() < .08 + level * .01) spawnPowerUp();
    }

    // Update words
    for (let i = words.length - 1; i >= 0; i--) {
      const w = words[i];
      w.y += currentSpeed * actualDt / (slowMotion ? 60 : 16.67);
      // Check if reached bottom
      if (w.y > canvas.height + 20) {
        // Advanced past danger zone = miss
        if (w.y > canvas.height - 40) {
          loseLife(w);
        }
        words.splice(i, 1);
      }
    }

    // Update power-ups
    for (let i = powerUps.length - 1; i >= 0; i--) {
      const pu = powerUps[i];
      pu.y += pu.speed * actualDt / 16.67;
      if (pu.y > canvas.height + 30) {
        powerUps.splice(i, 1);
      }
    }

    // Update particles
    updateParticles(actualDt);

    // Render
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawStars();
    drawDangerZone();
    words.forEach(drawWord);
    powerUps.forEach(drawPowerUp);
    particles.forEach(drawParticle);

    // Check collision: player input matches word
    checkInputMatch();

    // Update lives display
    updateLivesDisplay();

    animFrameId = requestAnimationFrame(gameLoop);
  }

  function spawnWord() {
    if (allWords.length === 0) allWords = getAllWords();
    const word = allWords[Math.floor(Math.random() * allWords.length)];
    const x = 60 + Math.random() * (canvas.width - 120);
    const colors = ['#6c5ce7','#a29bfe','#0abde3','#2ed573','#ffa502','#ff6348','#e056a0','#7bed9f'];
    const color = colors[Math.floor(Math.random() * colors.length)];
    const travelDist = canvas.height + 60;
    const travelTime = travelDist / currentSpeed * 16.67; // approx ms
    words.push({
      word, x, y: -30, color,
      bornTime: Date.now(),
      lifetime: travelTime
    });
  }

  function loseLife(w) {
    lives--;
    sfxMiss();
    if (w) spawnParticles(w.x, canvas.height - 20, '#ff4757', 15);
    // Reset combo
    if (combo > 0) { combo = 0; updateComboDisplay(); }
    updateLivesDisplay();
    wordInput.classList.add('wrong');
    setTimeout(() => wordInput.classList.remove('wrong'), 150);

    if (lives <= 0) endGame();
  }

  function updateLivesDisplay() {
    let html = '';
    for (let i = 0; i < maxLives; i++) {
      html += `<span class="heart ${i >= lives ? 'lost' : ''}">❤️</span>`;
    }
    livesDisplay.innerHTML = html;
  }

  function updateComboDisplay() {
    comboDisplay.textContent = `x${combo}`;
    if (combo >= 5) {
      comboDisplay.classList.add('pulse');
      setTimeout(() => comboDisplay.classList.remove('pulse'), 300);
    }
  }

  function checkInputMatch() {
    const input = wordInput.value.trim().toLowerCase();
    if (!input) return;

    for (let i = 0; i < words.length; i++) {
      // Partial match highlight
      if (words[i].word.startsWith(input)) {
        wordInput.classList.add('match');
        wordInput.classList.remove('wrong');
        // Full match
        if (words[i].word === input) {
          destroyWord(i);
          return;
        }
        return;
      }
    }
    wordInput.classList.remove('match');
    wordInput.classList.add('wrong');
  }

  function destroyWord(index) {
    const w = words[index];
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    updateComboDisplay();

    // Combo bonus
    const comboBonus = Math.floor(combo / 5) * (combo >= 10 ? 3 : combo >= 5 ? 2 : 1);
    const baseScore = diffSettings[difficulty].scorePerWord;
    const points = (baseScore + comboBonus) * scoreMultiplier;

    score += points;
    totalWordsDestroyed++;
    scoreDisplay.textContent = score;

    // Effects
    sfxHit();
    if (combo % 5 === 0) sfxCombo();
    spawnParticles(w.x, w.y, w.color, 8 + Math.min(combo, 20));

    // Show +score floating
    showFloatingScore(w.x, w.y, `+${points}`);

    words.splice(index, 1);
    wordInput.value = '';
    wordInput.classList.remove('match', 'wrong');
    wordInput.focus();
  }

  function showFloatingScore(x, y, text) {
    const gameArea = document.getElementById('gameArea');
    const el = document.createElement('div');
    el.style.cssText = `
      position: absolute; left: ${x}px; top: ${y}px; color: #ffa502;
      font-weight: 700; font-size: 16px; pointer-events: none;
      text-shadow: 0 0 10px rgba(255,165,2,.6);
      animation: floatUp .7s ease-out forwards;
      z-index: 30;
    `;
    el.textContent = text;
    gameArea.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }

  // ========== INPUT HANDLING ==========
  wordInput.addEventListener('input', () => {
    if (!gameRunning) return;
    checkInputMatch();
  });

  wordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!gameRunning) return;
      // Check full match on Enter
      const input = wordInput.value.trim().toLowerCase();
      for (let i = words.length - 1; i >= 0; i--) {
        if (words[i].word === input) {
          destroyWord(i);
          return;
        }
      }
      wordInput.value = '';
      wordInput.classList.remove('match', 'wrong');
    }
  });

  // ========== GAME FLOW ==========
  function startGame() {
    initAudio();
    resizeCanvas();
    const d = diffSettings[difficulty];

    allWords = getAllWords();
    words = [];
    particles = [];
    powerUps = [];
    score = 0;
    lives = d.lives;
    maxLives = d.lives;
    level = 1;
    combo = 0;
    maxCombo = 0;
    totalWordsDestroyed = 0;
    currentSpeed = d.baseSpeed;
    scoreMultiplier = 1;
    slowMotion = false;
    slowMotionTimer = 0;
    elapsedTime = 0;
    lastFrameTime = 0;
    spawnTimer = 0;

    scoreDisplay.textContent = '0';
    comboDisplay.textContent = 'x1';
    levelDisplay.textContent = '1';
    timerDisplay.textContent = '00:00';
    updateLivesDisplay();

    wordInput.value = '';
    wordInput.disabled = false;
    wordInput.classList.remove('match', 'wrong');
    wordInput.focus();

    startScreen.style.display = 'none';
    gameOverScreen.style.display = 'none';
    gameRunning = true;

    animFrameId = requestAnimationFrame(gameLoop);

    // Remove any leftover floating elements
    document.querySelectorAll('.powerup-notify').forEach(e => e.remove());
  }

  function endGame() {
    gameRunning = false;
    wordInput.disabled = true;
    if (animFrameId) cancelAnimationFrame(animFrameId);

    // Final score
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalCombo').textContent = maxCombo;
    document.getElementById('finalLevel').textContent = level;
    document.getElementById('finalWords').textContent = totalWordsDestroyed;

    // Save to leaderboard
    saveToLeaderboard();
    renderLeaderboard();

    gameOverScreen.style.display = 'flex';
  }

  // ========== LEADERBOARD ==========
  function getLeaderboard() {
    try {
      return JSON.parse(localStorage.getItem('typingGameLB') || '[]');
    } catch(e) { return []; }
  }

  function saveToLeaderboard() {
    const lb = getLeaderboard();
    lb.push({
      score, difficulty, level, maxCombo, totalWordsDestroyed,
      date: new Date().toLocaleDateString('zh-CN'),
      time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
    });
    lb.sort((a, b) => b.score - a.score);
    const top10 = lb.slice(0, 10);
    localStorage.setItem('typingGameLB', JSON.stringify(top10));
  }

  function renderLeaderboard() {
    const lb = getLeaderboard();
    const tbody = document.getElementById('leaderboardBody');
    if (lb.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#666;">暂无记录</td></tr>';
      return;
    }
    tbody.innerHTML = lb.map((entry, i) => {
      let rankClass = '';
      if (i === 0) rankClass = 'rank-1';
      else if (i === 1) rankClass = 'rank-2';
      else if (i === 2) rankClass = 'rank-3';
      const diffLabel = { easy: '简单', normal: '普通', hard: '困难', insane: '疯狂' }[entry.difficulty] || entry.difficulty;
      return `<tr>
        <td class="${rankClass}">#${i + 1}</td>
        <td>${entry.score}</td>
        <td>${diffLabel}</td>
        <td>${entry.date}</td>
      </tr>`;
    }).join('');
  }

  // ========== EVENT BINDINGS ==========
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  document.getElementById('toMenuBtn').addEventListener('click', () => {
    gameOverScreen.style.display = 'none';
    startScreen.style.display = 'flex';
    wordInput.disabled = true;
    wordInput.value = '';
  });

  document.getElementById('clearLB').addEventListener('click', () => {
    if (confirm('确定要清除所有排行榜记录吗？')) {
      localStorage.removeItem('typingGameLB');
      renderLeaderboard();
    }
  });

  // Difficulty chips
  document.querySelectorAll('#difficultyGroup .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#difficultyGroup .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      difficulty = chip.dataset.diff;
    });
  });

  // Category chips
  document.querySelectorAll('#categoryGroup .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const cat = chip.dataset.cat;
      if (cat === 'all') {
        // If clicking "all", set all selected
        document.querySelectorAll('#categoryGroup .chip').forEach(c => c.classList.add('active'));
        activeCategories = ['animals','food','tech','common'];
      } else {
        // Toggle
        chip.classList.toggle('active');
        const allChip = document.querySelector('#categoryGroup [data-cat="all"]');
        activeCategories = [];
        document.querySelectorAll('#categoryGroup .chip').forEach(c => {
          if (c.dataset.cat !== 'all' && c.classList.contains('active')) {
            activeCategories.push(c.dataset.cat);
          }
        });
        // Update "all" chip
        if (activeCategories.length === 4) {
          allChip.classList.add('active');
        } else {
          allChip.classList.remove('active');
        }
        // Ensure at least one
        if (activeCategories.length === 0) {
          chip.classList.add('active');
          activeCategories = [cat];
        }
      }
    });
  });

  // Click on canvas to focus input
  canvas.addEventListener('click', () => {
    if (gameRunning) wordInput.focus();
  });

  // Global key to start
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && startScreen.style.display !== 'none' && gameOverScreen.style.display === 'none') {
      e.preventDefault();
      startGame();
    }
    if (e.key === ' ' && startScreen.style.display !== 'none' && gameOverScreen.style.display === 'none') {
      e.preventDefault();
      startGame();
    }
  });

  // ========== FLOATING SCORE KEYFRAMES ==========
  const floatStyle = document.createElement('style');
  floatStyle.textContent = `
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.4); }
    }
  `;
  document.head.appendChild(floatStyle);

  // ========== INIT ==========
  updateLivesDisplay();
  resizeCanvas();
  renderLeaderboard();

  // Show start screen
  startScreen.style.display = 'flex';
  gameOverScreen.style.display = 'none';
  wordInput.disabled = true;
})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
