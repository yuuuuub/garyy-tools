let currentCategory = 'all';
let selectedSymptoms = new Set();
function renderContent() {
  let filtered = acupoints;
  if (currentCategory !== 'all') {
    filtered = filtered.filter(p => p.category === currentCategory);
  }
  if (selectedSymptoms.size > 0) {
    filtered = filtered.filter(p => p.symptoms.some(s => selectedSymptoms.has(s)));
  }
  const grouped = {};
  const catOrder = ['头部', '手部', '足部', '背部', '腹部'];
  if (currentCategory !== 'all') {
    grouped[currentCategory] = filtered;
  } else {
    for (const cat of catOrder) {
      const pts = filtered.filter(p => p.category === cat);
      if (pts.length > 0) grouped[cat] = pts;
    }
  }
  const catIcons = { '头部':'&#x1F9E0;', '手部':'&#x270B;', '足部':'&#x1F9B6;', '背部':'&#x1F9CD;', '腹部':'&#x1F4AB;' };
  let html = '';
  for (const [cat, pts] of Object.entries(grouped)) {
    html += `<div class="category-section"><div class="category-title"><span class="category-icon">${catIcons[cat]||''}</span>${cat}</div><div class="point-grid">`;
    for (const p of pts) {
      html += `
        <div class="point-card" id="card-${p.id}" onclick="openDetail('${p.id}')">
          <div class="point-name">${p.name}</div>
          <div class="point-meridian">${p.meridians}</div>
          <div class="point-info"><strong>位置：</strong>${p.location}</div>
          <div class="point-info"><strong>功效：</strong>${p.benefits.substring(0,60)}...</div>
          <div class="point-symptoms">${p.symptoms.map(s=>`<span class="point-symptom-tag">${s}</span>`).join('')}</div>
        </div>
      `;
    }
    html += '</div></div>';
  }
  if (filtered.length === 0) {
    html = '<div style="text-align:center;padding:40px;color:var(--text-dim);">没有找到匹配的穴位，请尝试其他筛选条件。</div>';
  }
  document.getElementById('contentSection').innerHTML = html + `
    <div class="timer-section">
      <h4>&#x23F1; 按摩计时器</h4>
      <div class="timer-display" id="timerDisplay">05:00</div>
      <div class="timer-presets">
        <button class="preset-btn" onclick="setTimer(60)">1分钟</button>
        <button class="preset-btn" onclick="setTimer(180)">3分钟</button>
        <button class="preset-btn" onclick="setTimer(300)">5分钟</button>
        <button class="preset-btn" onclick="setTimer(600)">10分钟</button>
        <button class="preset-btn" onclick="setTimer(300,true)">双穴5分钟</button>
      </div>
      <div class="timer-controls">
        <button class="timer-btn primary" id="timerStartBtn" onclick="toggleTimer()">&#x25B6; 开始计时</button>
        <button class="timer-btn" onclick="resetTimer()">&#x21BA; 重置</button>
      </div>
    </div>
  `;
}
let timerSeconds = 300;
let timerRunning = false;
let timerInterval = null;
let dualMode = false;
let currentSide = 0;
let totalDuration = 300;
function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  document.getElementById('timerDisplay').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if (dualMode) {
    const sideLabel = currentSide === 0 ? '左侧' : '右侧';
    document.getElementById('timerDisplay').textContent += ` (${sideLabel})`;
  }
}
function setTimer(secs, isDual=false) {
  timerSeconds = secs;
  dualMode = isDual;
  totalDuration = secs;
  currentSide = 0;
  timerRunning = false;
  clearInterval(timerInterval);
  document.getElementById('timerStartBtn').innerHTML = '&#x25B6; 开始计时';
  document.getElementById('timerStartBtn').classList.add('primary');
  updateTimerDisplay();
}
function toggleTimer() {
  if (timerRunning) {
    timerRunning = false;
    clearInterval(timerInterval);
    document.getElementById('timerStartBtn').innerHTML = '&#x25B6; 继续';
    document.getElementById('timerStartBtn').classList.add('primary');
    return;
  }
  timerRunning = true;
  document.getElementById('timerStartBtn').innerHTML = '&#x23F8; 暂停';
  document.getElementById('timerStartBtn').classList.remove('primary');
  timerInterval = setInterval(()=>{
    if (timerSeconds > 0) {
      timerSeconds--;
      updateTimerDisplay();
    } else {
      if (dualMode && currentSide === 0) {
        currentSide = 1;
        timerSeconds = totalDuration;
        updateTimerDisplay();
      } else {
        timerRunning = false;
        clearInterval(timerInterval);
        document.getElementById('timerStartBtn').innerHTML = '&#x2714; 完成！';
        document.getElementById('timerStartBtn').classList.remove('primary');
        document.getElementById('timerDisplay').textContent = dualMode ? '双侧按摩完成！' : '按摩完成！';
      }
    }
  }, 1000);
}
function resetTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  timerSeconds = totalDuration;
  currentSide = 0;
  document.getElementById('timerStartBtn').innerHTML = '&#x25B6; 开始计时';
  document.getElementById('timerStartBtn').classList.add('primary');
  updateTimerDisplay();
}
document.getElementById('categoryTabs').addEventListener('click', (e) => {
  if (e.target.classList.contains('tab')) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentCategory = e.target.dataset.cat;
    renderContent();
  }
});
document.getElementById('symptomTags').addEventListener('click', (e) => {
  if (e.target.classList.contains('symptom-tag')) {
    const sym = e.target.dataset.symptom;
    if (selectedSymptoms.has(sym)) {
      selectedSymptoms.delete(sym);
      e.target.classList.remove('selected');
    } else {
      selectedSymptoms.add(sym);
      e.target.classList.add('selected');
    }
    renderContent();
  }
});
document.getElementById('clearSearch').addEventListener('click', () => {
  selectedSymptoms.clear();
  document.querySelectorAll('.symptom-tag').forEach(t=>t.classList.remove('selected'));
  renderContent();
});

    <div class="caution-box">
      <h4>&#x26A0; 注意事项</h4>
      <p>${p.caution}</p>
    </div>
    <div style="text-align:center;margin-top:20px;">
      <button class="timer-btn primary" onclick="closeModal();setTimer(${parseInt(p.duration) * 60});scrollToTimer()">&#x23F1; 开始${p.duration}按摩计时</button>
    </div>
  `;
  document.getElementById('modalOverlay').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
function scrollToPoint(id) {
  const card = document.getElementById('card-' + id);
  if (card) {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('highlight');
    setTimeout(() => card.classList.remove('highlight'), 2000);
  }
}
function scrollToTimer() {
  const timer = document.querySelector('.timer-section');
  if (timer) timer.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
renderContent();
setTimer(300);
updateTimerDisplay();
</script>

<script src="../i18n.js" defer></script>
</body>
</html>
