<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>头脑风暴看板</title>
<meta property="og:title" content="头脑风暴看板">
<meta property="og:description" content="头脑风暴看板 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线头脑风暴工具，分组收集想法，投票排序">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:1200px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:4px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.9rem;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.board{display:flex;gap:16px;overflow-x:auto;padding-bottom:16px}
.column{min-width:260px;max-width:300px;flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.column-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.column-title{font-weight:700;font-size:1rem}
.column-count{font-size:.8rem;color:var(--text2);background:var(--bg);padding:2px 8px;border-radius:10px}
.idea-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:grab;transition:all .2s;position:relative}
.idea-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.idea-card.dragging{opacity:.5}
.idea-text{font-size:.9rem;line-height:1.5;margin-bottom:8px}
.idea-meta{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--text2)}
.vote-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s}
.vote-btn:hover,.vote-btn.voted{background:var(--accent);color:#fff;border-color:var(--accent)}
.vote-btn .upvote{font-size:1rem}
.idea-delete{position:absolute;top:8px;right:8px;cursor:pointer;color:var(--text2);font-size:.75rem;opacity:0;transition:opacity .2s}
.idea-card:hover .idea-delete{opacity:1}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:12px}
.stat-num{font-size:1.8rem;font-weight:700}
.stat-label{font-size:.8rem;color:var(--text2)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.7rem;margin:2px}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.85rem}
.sort-select{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.8rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.idea-card{animation:fadeIn .3s ease-out}
@media(max-width:600px){body{padding:10px}h1{font-size:1.4rem}.board{flex-direction:column}.column{min-width:100%}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🧠 头脑风暴</h1>
<p class="subtitle">收集想法，投票排序，找到最佳方案</p>

<div class="stats-grid" id="statsGrid"></div>

<div class="card">
  <div class="flex-between">
    <div class="flex" style="gap:8px">
      <input type="text" id="topicInput" placeholder="主题：例：如何提升用户活跃度" style="width:300px;margin:0" oninput="saveData()">
      <select class="sort-select" id="sortMode" onchange="render()"><option value="default">默认排序</option><option value="votes">按投票</option><option value="newest">最新</option><option value="oldest">最早</option></select>
    </div>
    <div class="flex" style="gap:8px">
      <button class="btn btn-sm" onclick="addColumn()">+ 分组</button>
      <button class="btn btn-sm btn-danger" onclick="resetAll()">重置</button>
    </div>
  </div>
</div>

<div class="board" id="board"></div>

<div class="card" id="addCard" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;max-width:600px;width:calc(100% - 32px)">
  <div class="flex" style="gap:8px">
    <select id="addColSelect" style="width:120px;margin:0;padding:8px"></select>
    <input type="text" id="addInput" placeholder="输入想法，按回车提交" style="margin:0;flex:1" onkeydown="if(event.key==='Enter')addIdea()">
    <button class="btn" onclick="addIdea()">添加</button>
  </div>
</div>
</div>

<script>
document.title='🧠 头脑风暴看板';
const COLORS=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899'];
let data=JSON.parse(localStorage.getItem('brainstorm_cn')||'null')||{
  topic:'如何提升用户活跃度',
  columns:[
    {id:1,title:'💡 想法',color:'#3b82f6'},
    {id:2,title:'🔬 待验证',color:'#f59e0b'},
    {id:3,title:'✅ 可行',color:'#10b981'}
  ],
  ideas:[
    {id:1,text:'推出每日签到奖励机制',columnId:1,votes:12,voted:false,tags:['运营']},
    {id:2,text:'增加社交分享功能',columnId:1,votes:8,voted:false,tags:['功能']},
    {id:3,text:'优化新手引导流程',columnId:2,votes:5,voted:false,tags:['体验']},
    {id:4,text:'举办线上挑战赛',columnId:1,votes:15,voted:true,tags:['活动']}
  ]
};
let nextIdeaId=100;

function save(){localStorage.setItem('brainstorm_cn',JSON.stringify(data))}
function saveData(){data.topic=document.getElementById('topicInput').value;save()}

function addColumn(){
  const title=prompt('分组名称：','新分组');
  if(!title)return;
  data.columns.push({id:Date.now(),title,color:COLORS[data.columns.length%COLORS.length]});save();render();
}
function removeColumn(id){if(!confirm('删除该分组？'))return;data.ideas=data.ideas.filter(i=>i.columnId!==id);data.columns=data.columns.filter(c=>c.id!==id);save();render()}
function addIdea(){
  const text=document.getElementById('addInput').value.trim();if(!text)return;
  const colId=+document.getElementById('addColSelect').value;
  data.ideas.push({id:nextIdeaId++,text,columnId:colId,votes:0,voted:false,tags:[]});
  document.getElementById('addInput').value='';save();render();
}
function voteIdea(id){
  const idea=data.ideas.find(i=>i.id===id);if(!idea)return;
  if(idea.voted){idea.votes--;idea.voted=false}else{idea.votes++;idea.voted=true}
  save();render();
}
function deleteIdea(id){data.ideas=data.ideas.filter(i=>i.id!==id);save();render()}
function resetAll(){if(!confirm('确定重置？'))return;data={topic:'',columns:[{id:1,title:'💡 想法',color:'#3b82f6'},{id:2,title:'🔬 待验证',color:'#f59e0b'},{id:3,title:'✅ 可行',color:'#10b981'}],ideas:[]};save();render()}

function render(){
  document.getElementById('topicInput').value=data.topic||'';
  const totalIdeas=data.ideas.length;
  const totalVotes=data.ideas.reduce((s,i)=>s+i.votes,0);
  const topIdea=data.ideas.sort((a,b)=>b.votes-a.votes)[0];
  document.getElementById('statsGrid').innerHTML=`
    <div class="card stat"><div class="stat-num" style="color:var(--accent)">${totalIdeas}</div><div class="stat-label">总想法</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--green)">${totalVotes}</div><div class="stat-label">总投票</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--yellow)">${topIdea?topIdea.votes:0}</div><div class="stat-label">最高票</div></div>`;
  
  const sel=document.getElementById('addColSelect');
  sel.innerHTML=data.columns.map(c=>`<option value="${c.id}">${c.title}</option>`).join('');
  
  const sortMode=document.getElementById('sortMode').value;
  let html='';
  data.columns.forEach(col=>{
    let colIdeas=data.ideas.filter(i=>i.columnId===col.id);
    if(sortMode==='votes')colIdeas.sort((a,b)=>b.votes-a.votes);
    else if(sortMode==='newest')colIdeas.sort((a,b)=>b.id-a.id);
    else if(sortMode==='oldest')colIdeas.sort((a,b)=>a.id-b.id);
    
    html+=`<div class="column" ondragover="event.preventDefault()" ondrop="dropIdea(event,${col.id})">
      <div class="column-header">
        <span class="column-title">${col.title} <span class="column-count">${colIdeas.length}</span></span>
        <span style="cursor:pointer;color:var(--text2);font-size:.8rem" onclick="removeColumn(${col.id})">✕</span>
      </div>`;
    if(colIdeas.length===0)html+='<div class="empty">暂无想法</div>';
    colIdeas.forEach(idea=>{
      html+=`<div class="idea-card" draggable="true" ondragstart="event.dataTransfer.setData('text',${idea.id})">
        <span class="idea-delete" onclick="deleteIdea(${idea.id})">✕</span>
        <div class="idea-text">${idea.text}</div>
        <div class="idea-meta">
          <div>${idea.tags.map(t=>`<span class="tag" style="background:var(--bg);border:1px solid var(--border)">${t}</span>`).join('')}</div>
          <button class="vote-btn ${idea.voted?'voted':''}" onclick="voteIdea(${idea.id})"><span class="upvote">👍</span>${idea.votes}</button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('board').innerHTML=html;
}

function dropIdea(e,colId){
  e.preventDefault();
  const ideaId=+e.dataTransfer.getData('text');
  const idea=data.ideas.find(i=>i.id===ideaId);
  if(idea){idea.columnId=colId;save();render()}
}

render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
