<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 故事板分镜工具</title>
<meta property="og:title" content="🎬 故事板分镜工具">
<meta property="og:description" content="🎬 故事板分镜工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="创建和管理故事板分镜，支持场景标题、描述、镜头角度、拍摄方式等参数设置">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root {--green:#238636;--red:#ef4444;--blue:#3b82f6;
--bg: #0f172a;
--surface: #1e293b;
--surface-2: #334155;
--text: #f1f5f9;
--text-secondary: #94a3b8;
--accent: #8b5cf6;
--border: #475569;
--shadow: 0 4px 24px rgba(0,0,0,0.3);
--radius: 12px;
--transition: 0.25s ease;
}
[data-theme="light"] {
--bg: #f8fafc;
--surface: #ffffff;
--surface-2: #f1f5f9;
--text: #1e293b;
--text-secondary: #64748b;
--accent: #8b5cf6;
--border: #e2e8f0;
--shadow: 0 4px 24px rgba(0,0,0,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif,'PingFang SC','Noto Sans SC',sans-serif; display:flex; justify-content:center; min-height:100vh; padding:16px; transition:background var(--transition),color var(--transition); }
.container { max-width:800px; width:100%; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.header h1 { font-size:1.5rem; }
.btn { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 16px; cursor:pointer; font-size:0.9rem; transition:opacity var(--transition); }
.btn:hover { opacity:0.85; }
.btn-secondary { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
.btn-small { padding:4px 10px; font-size:0.8rem; }
.btn-danger { background:#ef4444; }
.badge { background:var(--accent); color:#fff; border-radius:50%; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:600; }
.toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.frame-grid { display:flex; flex-direction:column; gap:16px; }
.frame-card { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:16px; position:relative; }
.frame-card-header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.frame-card-header .scene-num { background:var(--accent); color:#fff; border-radius:8px; padding:4px 12px; font-weight:600; font-size:0.85rem; }
.frame-card-header input { flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:0.9rem; }
.frame-card-body { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.frame-card-body textarea { grid-column:1/-1; resize:vertical; min-height:60px; }
.frame-card-body input, .frame-card-body select, .frame-card-body textarea { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:0.85rem; font-family:inherit; }
.frame-card-footer { display:flex; gap:6px; justify-content:flex-end; margin-top:10px; }
.label { font-size:0.75rem; color:var(--text-secondary); margin-bottom:2px; display:block; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; }
.modal { background:var(--surface); border-radius:var(--radius); padding:24px; max-width:600px; width:90%; max-height:80vh; overflow:auto; }
.modal textarea { width:100%; min-height:300px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font-family:monospace; font-size:0.85rem; resize:vertical; }
.modal-actions { display:flex; gap:8px; margin-top:12px; justify-content:flex-end; }
@media(max-width:600px) {
.frame-card-body { grid-template-columns:1fr; }
}
@media print {
body { background:#fff; padding:0; }
.container { box-shadow:none; padding:12px; }
.no-print { display:none!important; }
.frame-card { break-inside:avoid; border:1px solid #ccc; }
}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<div class="header no-print">
<h1>🎬 故事板分镜工具</h1>
<button class="btn btn-secondary" id="themeToggle" onclick="toggleTheme()">🌙 主题</button>
</div>
<div class="toolbar no-print">
<button class="btn" onclick="addFrame()">➕ 添加分镜</button>
<button class="btn btn-secondary" onclick="importJSON()">📥 导入 JSON</button>
<button class="btn btn-secondary" onclick="exportJSON()">📤 导出 JSON</button>
<button class="btn btn-secondary" onclick="printPreview()">🖨️ 打印预览</button>
<span class="badge" id="frameCount">0</span>
</div>
<div class="frame-grid" id="frameGrid"></div>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="closeModal(event)">
<div class="modal" onclick="event.stopPropagation()">
<h3 style="margin-bottom:12px">📥 导入 JSON</h3>
<textarea id="importInput" placeholder="粘贴 JSON 数据..."></textarea>
<div class="modal-actions">
<button class="btn btn-secondary" onclick="closeModal()">取消</button>
<button class="btn" onclick="doImport()">确认导入</button>
</div>
</div>
</div>

<div class="modal-overlay" id="exportModal" style="display:none" onclick="closeExportModal(event)">
<div class="modal" onclick="event.stopPropagation()">
<h3 style="margin-bottom:12px">📤 导出 JSON</h3>
<textarea id="exportOutput" readonly></textarea>
<div class="modal-actions">
<button class="btn btn-secondary" onclick="closeExportModal()">关闭</button>
<button class="btn" onclick="copyExport()">复制</button>
</div>
</div>
</div>

<script>
let frames = [];
const cameraAngles = ['俯拍','仰拍','平拍','斜拍','特写','远景','中景'];
const shotTypes = ['固定','推','拉','摇','跟'];

function toggleTheme() {
const html = document.documentElement;
html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
}

function render() {
const grid = document.getElementById('frameGrid');
grid.innerHTML = '';
frames.forEach((f, i) => {
const card = document.createElement('div');
card.className = 'frame-card';
card.innerHTML = `
<div class="frame-card-header">
<span class="scene-num">场景 ${i + 1}</span>
<input value="${esc(f.title)}" placeholder="场景标题" oninput="frames[${i}].title=this.value">
</div>
<div class="frame-card-body">
<div>
<label class="label">场景标题</label>
<input value="${esc(f.title)}" placeholder="输入标题" oninput="frames[${i}].title=this.value">
</div>
<div>
<label class="label">持续时间（秒）</label>
<input type="number" min="1" max="300" value="${f.duration}" oninput="frames[${i}].duration=+this.value">
</div>
<div>
<label class="label">镜头角度</label>
<select onchange="frames[${i}].angle=this.value">
${cameraAngles.map(a => `<option ${f.angle===a?'selected':''}>${a}</option>`).join('')}
</select>
</div>
<div>
<label class="label">拍摄方式</label>
<select onchange="frames[${i}].shotType=this.value">
${shotTypes.map(s => `<option ${f.shotType===s?'selected':''}>${s}</option>`).join('')}
</select>
</div>
<label class="label" style="grid-column:1/-1">描述</label>
<textarea placeholder="描述画面内容..." oninput="frames[${i}].desc=this.value">${esc(f.desc)}</textarea>
</div>
<div class="frame-card-footer no-print">
<button class="btn btn-small btn-secondary" onclick="moveFrame(${i},-1)" ${i===0?'disabled':''}>⬆</button>
<button class="btn btn-small btn-secondary" onclick="moveFrame(${i},1)" ${i===frames.length-1?'disabled':''}>⬇</button>
<button class="btn btn-small btn-danger" onclick="removeFrame(${i})">🗑️</button>
</div>
`;
grid.appendChild(card);
});
document.getElementById('frameCount').textContent = frames.length;
}

function addFrame() {
frames.push({ title:'', desc:'', angle:'平拍', shotType:'固定', duration:5 });
render();
}

function removeFrame(i) {
frames.splice(i, 1);
render();
}

function moveFrame(i, dir) {
const j = i + dir;
if (j < 0 || j >= frames.length) return;
[frames[i], frames[j]] = [frames[j], frames[i]];
render();
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function exportJSON() {
document.getElementById('exportOutput').value = JSON.stringify(frames, null, 2);
document.getElementById('exportModal').style.display = 'flex';
}

function closeExportModal(e) {
if (!e || e.target === document.getElementById('exportModal')) {
document.getElementById('exportModal').style.display = 'none';
}
}

function copyExport() {
const ta = document.getElementById('exportOutput');
ta.select();
document.execCommand('copy');
}

function importJSON() {
document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal(e) {
if (!e || e.target === document.getElementById('modalOverlay')) {
document.getElementById('modalOverlay').style.display = 'none';
}
}

function doImport() {
try {
const data = JSON.parse(document.getElementById('importInput').value);
if (Array.isArray(data)) {
frames = data;
render();
closeModal();
}
} catch(e) { alert('JSON 格式错误，请检查后重试'); }
}

function printPreview() { window.print(); }

render();
</script>
</body>
</html>
