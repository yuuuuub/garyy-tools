<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 测试计划</title>
<meta name="description" content="测试计划管理工具，创建和管理测试用例、测试套件和执行结果">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:1000px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:14px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-num{font-size:1.5rem;font-weight:700}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:2px}
.progress-bar{width:100%;height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.suite-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.suite-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.suite-title{font-weight:700;font-size:1rem}
.tc-table{width:100%;border-collapse:collapse;font-size:.85rem}
.tc-table th{text-align:left;padding:8px;border-bottom:2px solid var(--border);font-size:.75rem;color:var(--text2)}
.tc-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
.tc-table tr:hover{background:var(--card)}
.tc-id{font-weight:700;color:var(--accent);font-size:.8rem}
.badge{padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600;white-space:nowrap}
.badge-pass{background:rgba(63,185,80,.15);color:var(--green)}
.badge-fail{background:rgba(248,81,73,.1);color:var(--red)}
.badge-block{background:rgba(210,153,34,.15);color:var(--yellow)}
.badge-skip{background:rgba(139,148,158,.15);color:var(--text2)}
.badge-pending{background:rgba(59,130,246,.15);color:var(--accent)}
.badge-p{background:rgba(248,81,73,.15);color:var(--red)}
.badge-s{background:rgba(210,153,34,.15);color:var(--yellow)}
.badge-m{background:rgba(59,130,246,.15);color:var(--accent)}
.result-bar{display:flex;gap:2px;height:24px;border-radius:4px;overflow:hidden;margin-top:8px}
.result-seg{transition:width .3s}
.tc-actions{display:flex;gap:4px}
.tc-actions button{padding:3px 8px;font-size:.75rem}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto}
.empty{color:var(--text2);text-align:center;padding:30px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--text2);background:var(--bg);border:1px solid var(--border);transition:all .2s}
.tab.active{color:var(--accent);border-color:var(--accent);background:rgba(59,130,246,.1)}
@media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🧪 测试计划">
<meta property="og:description" content="测试计划管理工具，创建和管理测试用例、测试套件和执行结果">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/test-plan-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='testplan_data';
let state=JSON.parse(localStorage.getItem(STORE)||'{"suites":[]}');
if(!state.suites.length){
  state.suites=[{id:'s1',name:'用户模块测试',description:'用户注册、登录、个人信息管理',version:'v2.1.0',
    cases:[
      {id:'TC-001',title:'正常注册流程',precondition:'未注册邮箱',steps:'1. 输入邮箱\n2. 输入密码\n3. 点击注册',expected:'注册成功并跳转登录页',result:'pass',tester:'张三',date:'2025-06-20',priority:'p'},
      {id:'TC-002',title:'重复邮箱注册',precondition:'已注册邮箱',steps:'1. 输入已注册邮箱\n2. 输入密码\n3. 点击注册',expected:'提示邮箱已存在',result:'pass',tester:'张三',date:'2025-06-20',priority:'p'},
      {id:'TC-003',title:'密码强度校验',precondition:'注册页面',steps:'1. 输入弱密码(123)\n2. 点击注册',expected:'提示密码强度不足',result:'fail',tester:'李四',date:'2025-06-21',priority:'p',
        bugRef:'BUG-005',notes:'弱密码123仍可通过'},
      {id:'TC-004',title:'正常登录流程',precondition:'已注册用户',steps:'1. 输入账号密码\n2. 点击登录',expected:'登录成功进入首页',result:'pass',tester:'张三',date:'2025-06-21',priority:'s'},
      {id:'TC-005',title:'错误密码登录',precondition:'已注册用户',steps:'1. 输入错误密码\n2. 点击登录',expected:'提示密码错误',result:'pending',tester:'',date:'',priority:'s'}
    ]
  }];
}
let showModal=false,editingItem=null,viewMode='suites',currentSuite=null;
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function genId(prefix){return prefix+Date.now().toString(36).slice(-4)}

function render(){
  let h=`<div class="hdr"><h1>🧪 测试计划</h1><p>管理测试用例和执行结果</p></div>`;
  const allCases=state.suites.flatMap(s=>s.cases);
  const pass=allCases.filter(c=>c.result==='pass').length;
  const fail=allCases.filter(c=>c.result==='fail').length;
  const total=allCases.length;
  const rate=total?Math.round(pass/total*100):0;

  h+=`<div class="stats-grid"><div class="stat"><div class="stat-num">${total}</div><div class="stat-label">总用例</div></div><div class="stat"><div class="stat-num" style="color:var(--green)">${pass}</div><div class="stat-label">通过</div></div><div class="stat"><div class="stat-num" style="color:var(--red)">${fail}</div><div class="stat-label">失败</div></div><div class="stat"><div class="stat-num" style="color:${rate>=80?'var(--green)':rate>=50?'var(--yellow)':'var(--red)'}">${rate}%</div><div class="stat-label">通过率</div></div></div>`;

  h+=`<div class="cd"><div style="width:100%;background:var(--border);border-radius:4px;height:12px;overflow:hidden"><div style="height:100%;width:${rate}%;background:var(--green);border-radius:4px;transition:width .3s"></div></div><div style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--text2);margin-top:4px"><span>通过 ${pass}</span><span>失败 ${fail}</span><span>待测 ${total-pass-fail-allCases.filter(c=>c.result==='block').length-allCases.filter(c=>c.result==='skip').length}</span></div></div>`;

  h+=`<div class="tabs"><div class="tab ${viewMode==='suites'?'active':''}" onclick="viewMode='suites';render()">📁 测试套件</div><div class="tab ${viewMode==='all'?'active':''}" onclick="viewMode='all';render()">📋 全部用例</div></div>`;

  if(viewMode==='suites'){
    h+=`<div class="cd"><div class="flex-between"><h2 style="margin:0">测试套件</h2><button onclick="openNewSuite()">+ 新套件</button></div></div>`;
    state.suites.forEach(s=>{
      const passN=s.cases.filter(c=>c.result==='pass').length;
      const failN=s.cases.filter(c=>c.result==='fail').length;
      const totalN=s.cases.length;
      const rateN=totalN?Math.round(passN/totalN*100):0;
      h+=`<div class="suite-card"><div class="suite-header"><div><div class="suite-title">${s.name}</div><div style="font-size:.8rem;color:var(--text2)">${s.description} · 📦 ${s.version} · ${s.cases.length}条用例 · 通过率${rateN}%</div></div><div class="flex"><button onclick="openNewCase('${s.id}')" style="padding:6px 12px;font-size:.8rem">+ 用例</button><button class="sec" onclick="editSuite('${s.id}')" style="padding:6px 12px;font-size:.8rem">✏️</button><button class="dng" onclick="deleteSuite('${s.id}')" style="padding:6px 12px;font-size:.8rem">🗑️</button></div></div>`;
      if(s.cases.length){
        h+=`<div class="result-bar"><div class="result-seg" style="width:${passN/totalN*100}%;background:var(--green)"></div><div class="result-seg" style="width:${failN/totalN*100}%;background:var(--red)"></div><div class="result-seg" style="width:${(totalN-passN-failN)/totalN*100}%;background:var(--border)"></div></div>`;
        h+=`<table class="tc-table" style="margin-top:10px"><thead><tr><th>ID</th><th>用例</th><th>优先级</th><th>结果</th><th>操作</th></tr></thead><tbody>`;
        s.cases.forEach(c=>{
          const plabel={p:'🔴 P',s:'🟡 S',m:'🔵 M'}[c.priority]||c.priority;
          const rlabels={pass:'✅ 通过',fail:'❌ 失败',block:'⚠️ 阻塞',skip:'⏭️ 跳过',pending:'🔵 待测'};
          h+=`<tr><td><span class="tc-id">${c.id}</span></td><td><strong>${c.title}</strong><div style="font-size:.75rem;color:var(--text2)">${c.steps.split('\n')[0]}</div></td><td><span class="badge badge-${c.priority}">${plabel}</span></td><td><span class="badge badge-${c.result}">${rlabels[c.result]||c.result}</span></td><td><div class="tc-actions"><button class="sec" onclick="editCase('${s.id}','${c.id}')">✏️</button><select onchange="updateResult('${s.id}','${c.id}',this.value)" style="width:auto;padding:3px 6px;font-size:.75rem;margin:0"><option value="pass" ${c.result==='pass'?'selected':''}>通过</option><option value="fail" ${c.result==='fail'?'selected':''}>失败</option><option value="block" ${c.result==='block'?'selected':''}>阻塞</option><option value="skip" ${c.result==='skip'?'selected':''}>跳过</option><option value="pending" ${c.result==='pending'?'selected':''}>待测</option></select><button class="dng" onclick="deleteCase('${s.id}','${c.id}')">✕</button></div></td></tr>`;
        });
        h+=`</tbody></table>`;
      } else {h+=`<p class="empty" style="padding:10px">暂无测试用例</p>`}
      h+=`</div>`;
    });
  } else {
    h+=`<div class="cd"><h2>📋 全部测试用例</h2>`;
    if(!allCases.length)h+=`<p class="empty">暂无用例</p>`;
    else{
      h+=`<table class="tc-table"><thead><tr><th>ID</th><th>用例</th><th>套件</th><th>优先级</th><th>结果</th><th>测试人</th></tr></thead><tbody>`;
      allCases.forEach(c=>{
        const suite=state.suites.find(s=>s.cases.some(x=>x.id===c.id));
        const rlabels={pass:'✅ 通过',fail:'❌ 失败',block:'⚠️ 阻塞',skip:'⏭️ 跳过',pending:'🔵 待测'};
        h+=`<tr><td><span class="tc-id">${c.id}</span></td><td><strong>${c.title}</strong></td><td style="font-size:.8rem">${suite?.name||'-'}</td><td><span class="badge badge-${c.priority}">${c.priority.toUpperCase()}</span></td><td><span class="badge badge-${c.result}">${rlabels[c.result]||c.result}</span></td><td style="font-size:.8rem">${c.tester||'-'}</td></tr>`;
      });
      h+=`</tbody></table>`;
    }
    h+=`</div>`;
  }

  if(showModal)h+=renderModal();
  $('app').innerHTML=h;
}

function renderModal(){
  const type=editingItem?.type;
  let h=`<div class="modal-overlay" onclick="showModal=false;editingItem=null;render()"><div class="modal" onclick="event.stopPropagation()">`;
  if(type==='suite'){
    h+=`<h2 style="margin-bottom:16px">${editingItem.id?'✏️ 编辑套件':'📁 新套件'}</h2>`;
    h+=`<label>套件名称</label><input id="mName" value="${editingItem.name||''}" placeholder="例：用户模块测试">`;
    h+=`<label>描述</label><textarea id="mDesc" rows="2">${editingItem.description||''}</textarea>`;
    h+=`<label>版本</label><input id="mVersion" value="${editingItem.version||''}" placeholder="如：v2.1.0">`;
  } else {
    h+=`<h2 style="margin-bottom:16px">${editingItem.cid?'✏️ 编辑用例':'➕ 新用例'}</h2>`;
    h+=`<label>用例标题</label><input id="mTitle" value="${editingItem.title||''}" placeholder="用例标题">`;
    h+=`<label>前置条件</label><input id="mPre" value="${editingItem.precondition||''}">`;
    h+=`<label>测试步骤</label><textarea id="mSteps" placeholder="1. 第一步\n2. 第二步">${editingItem.steps||''}</textarea>`;
    h+=`<label>期望结果</label><textarea id="mExpected" rows="2">${editingItem.expected||''}</textarea>`;
    h+=`<div style="display:flex;gap:12px"><div style="flex:1"><label>优先级</label><select id="mPriority"><option value="p" ${editingItem.priority==='p'?'selected':''}>P - 必须</option><option value="s" ${editingItem.priority==='s'?'selected':''}>S - 应该</option><option value="m" ${editingItem.priority==='m'?'selected':''}>M - 可以</option></select></div><div style="flex:1"><label>测试人</label><input id="mTester" value="${editingItem.tester||''}"></div></div>`;
  }
  h+=`<div class="flex" style="margin-top:16px;justify-content:flex-end"><button class="sec" onclick="showModal=false;editingItem=null;render()">取消</button><button onclick="saveItem()">保存</button></div>`;
  h+=`</div></div>`;
  return h;
}

function openNewSuite(){editingItem={type:'suite'};showModal=true;render()}
function editSuite(id){const s=state.suites.find(x=>x.id===id);editingItem={type:'suite',id,name:s.name,description:s.description,version:s.version};showModal=true;render()}
function openNewCase(suiteId){editingItem={type:'case',suiteId};showModal=true;render()}
function editCase(suiteId,caseId){
  const s=state.suites.find(x=>x.id===suiteId);
  const c=s?.cases.find(x=>x.id===caseId);
  editingItem={type:'case',suiteId,cid:caseId,title:c.title,precondition:c.precondition,steps:c.steps,expected:c.expected,priority:c.priority,tester:c.tester};
  showModal=true;render();
}
function saveItem(){
  if(editingItem.type==='suite'){
    const name=$('mName').value.trim();
    if(!name){alert('请输入名称');return}
    const suite={id:editingItem.id||genId('s'),name,description:$('mDesc').value.trim(),version:$('mVersion').value.trim(),cases:[]};
    if(editingItem.id){const idx=state.suites.findIndex(x=>x.id===editingItem.id);if(idx>=0){suite.cases=state.suites[idx].cases;state.suites[idx]=suite}}
    else state.suites.push(suite);
  } else {
    const title=$('mTitle').value.trim();
    if(!title){alert('请输入标题');return}
    const tc={id:editingItem.cid||genId('TC-'),title,precondition:$('mPre').value.trim(),steps:$('mSteps').value.trim(),expected:$('mExpected').value.trim(),priority:$('mPriority').value,result:'pending',tester:$('mTester').value.trim(),date:''};
    const s=state.suites.find(x=>x.id===editingItem.suiteId);
    if(s){
      if(editingItem.cid){const idx=s.cases.findIndex(x=>x.id===editingItem.cid);if(idx>=0)s.cases[idx]=tc}
      else s.cases.push(tc);
    }
  }
  save();showModal=false;editingItem=null;render();
}
function deleteSuite(id){if(!confirm('确定删除？'))return;state.suites=state.suites.filter(s=>s.id!==id);save();render()}
function deleteCase(suiteId,caseId){const s=state.suites.find(x=>x.id===suiteId);if(s)s.cases=s.cases.filter(c=>c.id!==caseId);save();render()}
function updateResult(suiteId,caseId,result){
  const s=state.suites.find(x=>x.id===suiteId);
  if(s){const c=s.cases.find(x=>x.id===caseId);if(c){c.result=result;c.date=new Date().toISOString().slice(0,10)}}
  save();render();
}
render();
</script>
</body>
</html>
