<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>居家风水指南</title>
<meta name="description" content="居家风水指南 - 房间布局、色彩搭配、家具摆放建议"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--gold:#f59e0b}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#9a6700}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:20px;line-height:1.6}
.container{max-width:600px;margin:0 auto}
h1{font-size:1.6rem;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{background:var(--blue);color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:.95rem;width:100%;margin-top:8px;transition:all .2s}
.btn:hover{opacity:.9}
.tab-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.85rem;transition:all .2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab:hover{border-color:var(--blue)}
.room-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.room-card h3{font-size:1rem;color:var(--blue);margin-bottom:8px}
.room-card p{font-size:.88rem;color:var(--text2);margin:4px 0}
.room-card .tip{font-size:.85rem;padding:8px 12px;background:rgba(59,130,246,.1);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;margin-top:8px}
.room-card .taboo{font-size:.85rem;padding:8px 12px;background:rgba(239,68,68,.1);border-left:3px solid var(--red);border-radius:0 8px 8px 0;margin-top:8px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.8rem;margin:2px;font-weight:500}
.tag-gold{background:rgba(245,158,11,.15);color:var(--gold)}
.tag-green{background:rgba(16,185,129,.15);color:var(--green)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
@media(max-width:480px){body{padding:12px}}
</style><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="居家风水指南">
<meta property="og:description" content="居家风水指南 - 房间布局、色彩搭配、家具摆放建议">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🏠 居家风水指南</h1>
<p class="sub">房间布局 · 色彩搭配 · 家具摆放</p>

<div class="tab-bar">
<div class="tab active" onclick="showRoom('living')">客厅</div>
<div class="tab" onclick="showRoom('bedroom')">卧室</div>
<div class="tab" onclick="showRoom('kitchen')">厨房</div>
<div class="tab" onclick="showRoom('study')">书房</div>
<div class="tab" onclick="showRoom('bathroom')">卫生间</div>
<div class="tab" onclick="showRoom('door')">大门</div>
</div>

<div id="roomContent"></div>
</div>

<script>
var rooms={
living:{name:'客厅',icon:'🛋️',tips:[
  {title:'沙发靠墙',desc:'沙发最好靠实墙摆放，背后有靠山，事业稳定。',type:'tip'},
  {title:'明堂开阔',desc:'客厅宜宽敞明亮，不宜堆放杂物，保持气场流通。',type:'tip'},
  {title:'财位在对角',desc:'大门对角线位置是明财位，可放招财植物或聚宝盆。',type:'tip'},
  {title:'镜子不对门',desc:'镜子不宜正对大门，容易将财气反射出去。',type:'taboo'},
  {title:'横梁压顶',desc:'沙发或床不宜在横梁下方，容易产生压迫感。',type:'taboo'},
  {title:'色彩搭配',desc:'客厅宜用暖色调，如米黄、浅棕、淡金，营造温馨氛围。',type:'tip'},
  {title:'植物摆放',desc:'发财树、富贵竹、鸿运当头等植物适合放在客厅。',type:'tip'},
  {title:'电视位置',desc:'电视不宜正对大门，五行属火，宜放南方。',type:'tip'}
]},
bedroom:{name:'卧室',icon:'🛏️',tips:[
  {title:'床头靠墙',desc:'床头必须靠实墙，象征有靠山，睡眠安稳。',type:'tip'},
  {title:'镜子不对床',desc:'镜子有反射作用，对着床影响睡眠质量。',type:'taboo'},
  {title:'横梁压床',desc:'床不宜在横梁下方，容易失眠多梦。',type:'taboo'},
  {title:'色彩柔和',desc:'卧室宜用浅粉、米白、淡蓝等柔和色调。',type:'tip'},
  {title:'床头柜成对',desc:'床头两侧各放一个床头柜，象征夫妻和谐。',type:'tip'},
  {title:'卧室门不对镜',desc:'卧室门不宜正对镜子，容易半夜受惊。',type:'taboo'},
  {title:'床位朝向',desc:'床头朝东或朝北为佳，避免朝西。',type:'tip'},
  {title:'卧室植物',desc:'卧室宜放薰衣草、茉莉等助眠植物，不宜放仙人掌。',type:'tip'}
]},
kitchen:{name:'厨房',icon:'🍳',tips:[
  {title:'灶台不对门',desc:'灶台不宜正对大门或卫生间，影响财运。',type:'taboo'},
  {title:'水火不相冲',desc:'灶台（火）和水槽（水）不宜正对，中间应有操作台。',type:'taboo'},
  {title:'厨房保持整洁',desc:'厨房杂乱会影响家人健康，保持清洁有序。',type:'tip'},
  {title:'冰箱不对灶',desc:'冰箱（水）不宜正对灶台（火），五行相克。',type:'taboo'},
  {title:'厨房在北方不佳',desc:'厨房属火，北方属水，水火不容。厨房宜在南方或东方。',type:'taboo'},
  {title:'刀具收纳',desc:'菜刀等利器应收纳在刀架或抽屉中，不宜外露。',type:'tip'}
]},
study:{name:'书房',icon:'📚',tips:[
  {title:'书桌靠墙',desc:'书桌最好靠实墙摆放，背后有靠山，利于学业事业。',type:'tip'},
  {title:'文昌位',desc:'书房宜设在住宅文昌位（东南方），有利于学业和考试。',type:'tip'},
  {title:'光线充足',desc:'书房光线要充足但不刺眼，自然光为最佳。',type:'tip'},
  {title:'书桌不对门',desc:'书桌不宜正对房门，容易分心。',type:'taboo'},
  {title:'书房忌杂乱',desc:'书桌保持整洁，杂乱影响思维和效率。',type:'taboo'},
  {title:'植物助文运',desc:'书房宜放文竹、富贵竹等，提升文运。',type:'tip'}
]},
bathroom:{name:'卫生间',icon:'🚿',tips:[
  {title:'保持干燥通风',desc:'卫生间要保持干燥通风，避免潮湿滋生细菌。',type:'tip'},
  {title:'马桶盖常关',desc:'使用马桶后盖上盖子，防止污气外泄。',type:'tip'},
  {title:'卫生间不对灶',desc:'卫生间（水）不宜与灶台（火）相邻或相对。',type:'taboo'},
  {title:'卫生间不宜在中央',desc:'卫生间不宜设在房屋正中央，影响整体运势。',type:'taboo'},
  {title:'绿植净化',desc:'可在卫生间放虎尾兰、绿萝等耐阴植物净化空气。',type:'tip'}
]},
door:{name:'大门',icon:'🚪',tips:[
  {title:'大门宜朝南',desc:'大门朝南为最佳，采光好，阳气足。',type:'tip'},
  {title:'大门不对电梯',desc:'大门不宜正对电梯口，容易泄气。',type:'taboo'},
  {title:'玄关设置',desc:'进门宜设玄关，起到缓冲和藏风聚气的作用。',type:'tip'},
  {title:'门槛石',desc:'大门下方宜设门槛，防止财气外泄。',type:'tip'},
  {title:'门不对楼梯',desc:'大门不宜正对楼梯（无论上下），影响运势。',type:'taboo'},
  {title:'门口整洁',desc:'大门口要保持整洁明亮，不宜堆放鞋子杂物。',type:'tip'}
]}
};

function showRoom(key){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  event.target.classList.add('active');
  var room=rooms[key];
  var html='<div class="room-card"><div style="font-size:2em;text-align:center;margin-bottom:8px">'+room.icon+'</div>';
  html+='<h3>'+room.name+'</h3>';
  room.tips.forEach(function(t){
    html+='<div class="'+t.type+'">'+t.title+'：'+t.desc+'</div>';
  });
  html+='</div>';
  document.getElementById('roomContent').innerHTML=html;
}
showRoom('living');
</script>
<script src="../i18n.js" defer></script>
</body></html>
