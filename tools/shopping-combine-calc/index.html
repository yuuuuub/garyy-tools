<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>618凑单满减计算器</title>
<meta name="description" content="618凑单满减计算器，帮你凑出最划算的购物方案">
<style>
  :root {
    --bg-primary: #0f0f14;
    --bg-secondary: #1a1a24;
    --bg-card: #1e1e2a;
    --bg-input: #252536;
    --bg-hover: #2a2a3c;
    --border: #2e2e42;
    --text-primary: #e8e8f0;
    --text-secondary: #9d9db5;
    --text-muted: #6b6b82;
    --accent: #6c5ce7;
    --accent-glow: rgba(108, 92, 231, 0.3);
    --accent-light: #a29bfe;
    --green: #00cec9;
    --green-glow: rgba(0, 206, 201, 0.3);
    --red: #ff6b6b;
    --orange: #fdcb6e;
    --blue: #74b9ff;
    --pink: #fd79a8;
    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 6px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --transition: 0.2s ease;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
  }
  .container { max-width: 800px; margin: 0 auto; padding: 16px; }
  header {
    text-align: center;
    padding: 32px 0 24px;
    position: relative;
  }
  header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe, #fd79a8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  header .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* Platform tabs */
  .platform-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 4px;
    border: 1px solid var(--border);
  }
  .platform-tab {
    flex: 1;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
    text-align: center;
  }
  .platform-tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 12px var(--accent-glow);
  }
  .platform-tab:hover:not(.active) { color: var(--text-primary); background: var(--bg-hover); }
  .platform-info {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 16px;
    padding: 8px 12px;
    background: var(--bg-card);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .platform-info strong { color: var(--accent-light); }

  /* Card */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .card-header .icon {
    width: 32px; height: 32px;
    border-radius: var(--radius-xs);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .icon-purple { background: rgba(108,92,231,0.15); color: var(--accent-light); }
  .icon-green { background: rgba(0,206,201,0.15); color: var(--green); }
  .icon-orange { background: rgba(253,203,110,0.15); color: var(--orange); }
  .icon-blue { background: rgba(116,185,255,0.15); color: var(--blue); }
  .icon-pink { background: rgba(253,121,168,0.15); color: var(--pink); }

  /* Form elements */
  .form-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .form-row:last-child { margin-bottom: 0; }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    min-width: 100px;
  }
  .form-group label {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .form-group input, .form-group select {
    padding: 10px 12px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    transition: var(--transition);
  }
  .form-group input:focus, .form-group select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .form-group input::placeholder { color: var(--text-muted); }
  .form-group .unit {
    position: relative;
  }
  .form-group .unit input { padding-right: 28px; }
  .form-group .unit::after {
    content: attr(data-unit);
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 13px;
    pointer-events: none;
    padding-top: 8px;
  }

  /* Preset chips */
  .preset-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .preset-chip {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--bg-input);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }
  .preset-chip:hover { border-color: var(--accent); color: var(--accent-light); background: rgba(108,92,231,0.1); }
  .preset-chip.active {
    border-color: var(--accent);
    background: rgba(108,92,231,0.15);
    color: var(--accent-light);
    font-weight: 600;
  }

  /* Cart items */
  .cart-item {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 12px;
    background: var(--bg-input);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    border: 1px solid var(--border);
    transition: var(--transition);
  }
  .cart-item:hover { border-color: rgba(255,255,255,0.1); }
  .cart-item .item-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--bg-hover);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    color: var(--text-muted);
    flex-shrink: 0;
    font-weight: 600;
  }
  .cart-item input {
    padding: 8px 10px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    color: var(--text-primary);
    font-size: 13px;
    font-family: inherit;
    min-width: 0;
  }
  .cart-item input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .cart-item .item-name { flex: 2; }
  .cart-item .item-price { flex: 1.2; }
  .cart-item .item-qty { flex: 0.6; }
  .cart-item .item-subtotal {
    flex: 1;
    text-align: right;
    font-weight: 600;
    font-size: 14px;
    color: var(--accent-light);
    white-space: nowrap;
  }
  .cart-item .btn-remove {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition);
    flex-shrink: 0;
  }
  .cart-item .btn-remove:hover { background: rgba(255,107,107,0.2); color: var(--red); border-color: var(--red); }

  /* Buttons */
  .btn {
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: #5b4cdb; box-shadow: 0 4px 16px var(--accent-glow); }
  .btn-outline {
    background: transparent;
    color: var(--accent-light);
    border-color: var(--accent);
  }
  .btn-outline:hover { background: rgba(108,92,231,0.1); }
  .btn-block { width: 100%; justify-content: center; }
  .btn-sm { padding: 6px 14px; font-size: 13px; }
  .btn-icon {
    width: 36px; height: 36px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }

  /* Results */
  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (min-width: 500px) {
    .results-grid { grid-template-columns: 1fr 1fr 1fr; }
  }
  .result-item {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    text-align: center;
  }
  .result-item .result-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .result-item .result-value {
    font-size: 20px;
    font-weight: 700;
  }
  .result-value.green { color: var(--green); }
  .result-value.purple { color: var(--accent-light); }
  .result-value.orange { color: var(--orange); }
  .result-value.blue { color: var(--blue); }

  /* Big final amount */
  .final-amount {
    text-align: center;
    padding: 24px;
    background: linear-gradient(135deg, rgba(108,92,231,0.08), rgba(0,206,201,0.08));
    border: 1px solid rgba(108,92,231,0.2);
    border-radius: var(--radius);
    margin-top: 12px;
  }
  .final-amount .big-number {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(135deg, #6c5ce7, #00cec9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .final-amount .saved-amount {
    font-size: 14px;
    color: var(--green);
    margin-top: 4px;
  }

  /* Breakdown list */
  .breakdown-list {
    list-style: none;
  }
  .breakdown-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .breakdown-list li:last-child { border-bottom: none; }
  .breakdown-list .breakdown-label { color: var(--text-secondary); }
  .breakdown-list .breakdown-value { font-weight: 600; }
  .breakdown-value.discount { color: var(--green); }
  .breakdown-value.cost { color: var(--text-primary); }

  /* Item discount breakdown */
  .item-breakdown {
    margin-top: 12px;
    padding: 12px;
    background: var(--bg-input);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .item-breakdown .item-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 4px 0;
  }
  .item-breakdown .item-row .orig { color: var(--text-muted); text-decoration: line-through; margin-right: 8px; }
  .item-breakdown .item-row .final { color: var(--green); font-weight: 600; }
  .item-breakdown .item-row .name { color: var(--text-secondary); }

  /* Suggestion card */
  .suggestion-box {
    background: rgba(253,203,110,0.08);
    border: 1px solid rgba(253,203,110,0.2);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-top: 12px;
  }
  .suggestion-box .suggestion-title {
    font-size: 13px;
    color: var(--orange);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .suggestion-box .suggestion-text {
    font-size: 14px;
    color: var(--text-primary);
    line-height: 1.8;
  }
  .suggestion-box .suggestion-text strong { color: var(--orange); }
  .next-tier {
    display: inline-block;
    padding: 2px 8px;
    background: rgba(108,92,231,0.15);
    border-radius: 4px;
    color: var(--accent-light);
    font-weight: 600;
    margin: 0 2px;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--green);
    color: #000;
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* Responsive */
  @media (max-width: 480px) {
    .cart-item { flex-wrap: wrap; }
    .cart-item .item-num { display: none; }
    .cart-item .item-name { flex: 1 1 100%; }
    .cart-item .item-price { flex: 1; }
    .cart-item .item-qty { flex: 0.5; }
    .cart-item .item-subtotal { flex: 0.8; }
    .final-amount .big-number { font-size: 32px; }
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card { animation: fadeIn 0.3s ease; }
</style>

<body>
<div class="container">
  <header>
    <h1>618凑单满减计算器</h1>
    <div class="subtitle">购物凑单计算器</div>
  </header>

  <!-- Platform Tabs -->
  <div class="platform-tabs" id="platformTabs">
    <button class="platform-tab active" data-platform="taobao">淘宝天猫</button>
    <button class="platform-tab" data-platform="jd">京东</button>
    <button class="platform-tab" data-platform="pdd">拼多多</button>
  </div>
  <div class="platform-info" id="platformInfo">
    跨店满减 · 每满<strong>300</strong>减<strong>50</strong> · 可叠加优惠券和红包
  </div>

  <!-- Config Card -->
  <div class="card">
    <div class="card-header">
      <div class="icon icon-purple">&#9881;</div>
      满减规则配置
    </div>
    <div class="preset-chips" id="presetChips">
      <button class="preset-chip" data-threshold="200" data-reduce="30">满200减30</button>
      <button class="preset-chip active" data-threshold="300" data-reduce="50">满300减50</button>
      <button class="preset-chip" data-threshold="500" data-reduce="75">满500减75</button>
      <button class="preset-chip" data-threshold="1000" data-reduce="150">满1000减150</button>
      <button class="preset-chip" data-threshold="2000" data-reduce="300">满2000减300</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>满减门槛</label>
        <div class="unit" data-unit="元">
          <input type="number" id="threshold" value="300" min="1" step="1">
        </div>
      </div>
      <div class="form-group">
        <label>满减金额</label>
        <div class="unit" data-unit="元">
          <input type="number" id="reduceAmount" value="50" min="1" step="1">
        </div>
      </div>
      <div class="form-group">
        <label>是否可跨店</label>
        <select id="crossStore">
          <option value="true" selected>跨店满减</option>
          <option value="false">单店满减</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Coupons & Red packets -->
  <div class="card">
    <div class="card-header">
      <div class="icon icon-orange">&#127873;</div>
      优惠券 &amp; 红包
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>店铺优惠券面额</label>
        <div class="unit" data-unit="元">
          <input type="number" id="couponAmount" value="30" min="0" step="1" placeholder="0">
        </div>
      </div>
      <div class="form-group">
        <label>优惠券使用门槛</label>
        <div class="unit" data-unit="元">
          <input type="number" id="couponThreshold" value="200" min="0" step="1" placeholder="0">
        </div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>平台红包金额</label>
        <div class="unit" data-unit="元">
          <input type="number" id="redPacket" value="0" min="0" step="1" placeholder="0">
        </div>
      </div>
      <div class="form-group">
        <label>红包使用门槛</label>
        <div class="unit" data-unit="元">
          <input type="number" id="redPacketThreshold" value="0" min="0" step="1" placeholder="0">
        </div>
      </div>
    </div>
  </div>

  <!-- Cart -->
  <div class="card">
    <div class="card-header">
      <div class="icon icon-blue">&#128722;</div>
      购物车
      <button class="btn btn-sm btn-outline" style="margin-left: auto;" onclick="addItem()">+ 添加商品</button>
    </div>
    <div id="cartItems">
      <!-- Items rendered here -->
    </div>
    <div style="margin-top: 12px; display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border);">
      <span style="font-size: 14px; color: var(--text-secondary);">
        共 <strong id="itemCount" style="color: var(--text-primary);">0</strong> 件商品
      </span>
      <span style="font-size: 13px; color: var(--text-muted);">
        商品总价: <strong id="cartTotalDisplay" style="color: var(--accent-light); font-size: 16px;">¥0.00</strong>
      </span>
    </div>
    <button class="btn btn-outline btn-block" style="margin-top: 12px;" onclick="clearCart()">清空购物车</button>
  </div>

  <!-- Results -->
  <div class="card" id="resultsCard">
    <div class="card-header">
      <div class="icon icon-green">&#10003;</div>
      计算结果
    </div>
    <div class="results-grid" id="resultsGrid">
      <div class="result-item">
        <div class="result-label">商品总价</div>
        <div class="result-value blue" id="resultTotal">¥0.00</div>
      </div>
      <div class="result-item">
        <div class="result-label">满减优惠</div>
        <div class="result-value green" id="resultDiscount">-¥0.00</div>
      </div>
      <div class="result-item">
        <div class="result-label">优惠券</div>
        <div class="result-value orange" id="resultCoupon">-¥0.00</div>
      </div>
      <div class="result-item">
        <div class="result-label">红包</div>
        <div class="result-value purple" id="resultRedPacket">-¥0.00</div>
      </div>
      <div class="result-item">
        <div class="result-label">总计优惠</div>
        <div class="result-value green" id="resultTotalDiscount">-¥0.00</div>
      </div>
      <div class="result-item">
        <div class="result-label">实付金额</div>
        <div class="result-value blue" id="resultPay">¥0.00</div>
      </div>
    </div>

    <!-- Final amount -->
    <div class="final-amount" id="finalAmountBox" style="display:none;">
      <div style="font-size: 13px; color: var(--text-muted);">最终实付</div>
      <div class="big-number" id="finalPay">¥0.00</div>
      <div class="saved-amount" id="savedInfo"></div>
    </div>

    <!-- Suggestion -->
    <div class="suggestion-box" id="suggestionBox" style="display:none;"></div>

    <!-- Item breakdown -->
    <div class="item-breakdown" id="itemBreakdown" style="display:none;">
      <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600;">各商品均摊后实付</div>
      <div id="itemBreakdownList"></div>
    </div>

    <!-- Share -->
    <button class="btn btn-primary btn-block" style="margin-top: 16px;" onclick="shareResult()">
      &#128279; 复制计算结果
    </button>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>
</div>

<script>
// Platforms data
const platforms = {
  taobao: {
    name: '淘宝天猫',
    threshold: 300, reduce: 50,
    info: '跨店满减 · 每满<strong>300</strong>减<strong>50</strong> · 可叠加优惠券和红包',
    style: 'cross'
  },
  jd: {
    name: '京东',
    threshold: 299, reduce: 50,
    info: '跨店满减 · 每满<strong>299</strong>减<strong>50</strong> · 可叠加东券和京豆',
    style: 'cross'
  },
  pdd: {
    name: '拼多多',
    threshold: 200, reduce: 30,
    info: '跨店满减 · 每满<strong>200</strong>减<strong>30</strong> · 可叠加平台券',
    style: 'cross'
  }
};

let activePlatform = 'taobao';
let selectedPreset = { threshold: 300, reduce: 50 };

// Default cart items
let cartItems = [
  { name: '蓝牙耳机', price: 199, qty: 1 },
  { name: '手机壳', price: 29.9, qty: 2 },
];

// Platform switch
document.getElementById('platformTabs').addEventListener('click', function(e) {
  const tab = e.target.closest('.platform-tab');
  if (!tab) return;
  activePlatform = tab.dataset.platform;
  document.querySelectorAll('.platform-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');

  const p = platforms[activePlatform];
  document.getElementById('platformInfo').innerHTML = p.info;
  document.getElementById('threshold').value = p.threshold;
  document.getElementById('reduceAmount').value = p.reduce;

  // Update preset selection
  document.querySelectorAll('.preset-chip').forEach(chip => chip.classList.remove('active'));
  const matchingPreset = document.querySelector(`.preset-chip[data-threshold="${p.threshold}"][data-reduce="${p.reduce}"]`);
  if (matchingPreset) {
    matchingPreset.classList.add('active');
    selectedPreset = { threshold: p.threshold, reduce: p.reduce };
  }

  recalculate();
});

// Preset chips
document.getElementById('presetChips').addEventListener('click', function(e) {
  const chip = e.target.closest('.preset-chip');
  if (!chip) return;
  document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  const threshold = parseInt(chip.dataset.threshold);
  const reduce = parseInt(chip.dataset.reduce);
  document.getElementById('threshold').value = threshold;
  document.getElementById('reduceAmount').value = reduce;
  selectedPreset = { threshold, reduce };
  recalculate();
});

// Listen for config changes
['threshold', 'reduceAmount', 'couponAmount', 'couponThreshold', 'redPacket', 'redPacketThreshold', 'crossStore']
  .forEach(id => {
    document.getElementById(id).addEventListener('input', debounce(recalculate, 300));
  });

// Add default items
function init() {
  renderCart();
  recalculate();
}

function renderCart() {
  const container = document.getElementById('cartItems');
  let html = '';
  cartItems.forEach((item, index) => {
    const subtotal = (item.price * item.qty).toFixed(2);
    html += `
      <div class="cart-item">
        <span class="item-num">${index + 1}</span>
        <input class="item-name" type="text" value="${escapeHtml(item.name)}"
          placeholder="商品名称" onchange="updateItem(${index}, 'name', this.value)">
        <input class="item-price" type="number" value="${item.price}" min="0.01" step="0.01"
          placeholder="单价" onchange="updateItem(${index}, 'price', parseFloat(this.value) || 0)">
        <input class="item-qty" type="number" value="${item.qty}" min="1" step="1"
          placeholder="数量" onchange="updateItem(${index}, 'qty', parseInt(this.value) || 1)">
        <span class="item-subtotal">¥${subtotal}</span>
        <button class="btn-remove" onclick="removeItem(${index})" title="删除">×</button>
      </div>
    `;
  });
  container.innerHTML = html || '<div style="text-align:center;color:var(--text-muted);padding:20px 0;">购物车为空，点击「添加商品」开始</div>';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function addItem() {
  cartItems.push({ name: '新商品', price: 0, qty: 1 });
  renderCart();
  recalculate();
}

function removeItem(index) {
  cartItems.splice(index, 1);
  renderCart();
  recalculate();
}

function updateItem(index, field, value) {
  cartItems[index][field] = value;
  renderCart();
  recalculate();
}

function clearCart() {
  if (cartItems.length === 0) return;
  if (confirm('确定要清空购物车吗？')) {
    cartItems = [];
    renderCart();
    recalculate();
  }
}

function recalculate() {
  const threshold = parseInt(document.getElementById('threshold').value) || 0;
  const reduceAmount = parseInt(document.getElementById('reduceAmount').value) || 0;
  const couponAmount = parseFloat(document.getElementById('couponAmount').value) || 0;
  const couponThreshold = parseFloat(document.getElementById('couponThreshold').value) || 0;
  const redPacket = parseFloat(document.getElementById('redPacket').value) || 0;
  const redPacketThreshold = parseFloat(document.getElementById('redPacketThreshold').value) || 0;
  const crossStore = document.getElementById('crossStore').value === 'true';

  // Calculate cart total
  let cartTotal = 0;
  cartItems.forEach(item => {
    cartTotal += item.price * item.qty;
  });

  // Update display
  document.getElementById('itemCount').textContent = cartItems.length;
  document.getElementById('cartTotalDisplay').textContent = '¥' + cartTotal.toFixed(2);

  // Full discount calculation
  let discountTimes = 0;
  let discountAmount = 0;
  if (threshold > 0 && cartTotal >= threshold) {
    discountTimes = Math.floor(cartTotal / threshold);
    discountAmount = discountTimes * reduceAmount;
  }

  // Coupon
  let couponApplied = 0;
  if (couponAmount > 0 && (couponThreshold === 0 || cartTotal >= couponThreshold)) {
    couponApplied = couponAmount;
  }

  // Red packet
  let redPacketApplied = 0;
  if (redPacket > 0 && (redPacketThreshold === 0 || cartTotal >= redPacketThreshold)) {
    redPacketApplied = redPacket;
  }

  const totalDiscount = discountAmount + couponApplied + redPacketApplied;
  const finalPay = Math.max(0, cartTotal - totalDiscount);
  const saved = cartTotal - finalPay;
  const savedPercent = cartTotal > 0 ? ((saved / cartTotal) * 100).toFixed(1) : '0.0';

  // Update results
  document.getElementById('resultTotal').textContent = '¥' + cartTotal.toFixed(2);
  document.getElementById('resultDiscount').textContent = '-¥' + discountAmount.toFixed(2);
  document.getElementById('resultCoupon').textContent = '-¥' + couponApplied.toFixed(2);
  document.getElementById('resultRedPacket').textContent = '-¥' + redPacketApplied.toFixed(2);
  document.getElementById('resultTotalDiscount').textContent = '-¥' + totalDiscount.toFixed(2);
  document.getElementById('resultPay').textContent = '¥' + finalPay.toFixed(2);

  // Final amount box
  if (cartTotal > 0) {
    document.getElementById('finalAmountBox').style.display = 'block';
    document.getElementById('finalPay').textContent = '¥' + finalPay.toFixed(2);
    document.getElementById('savedInfo').textContent =
      '共省 ¥' + saved.toFixed(2) + '（节省 ' + savedPercent + '%）';
  } else {
    document.getElementById('finalAmountBox').style.display = 'none';
  }

  // Suggestion
  const suggestionBox = document.getElementById('suggestionBox');
  if (threshold > 0 && cartTotal > 0) {
    suggestionBox.style.display = 'block';
    const currentTier = Math.floor(cartTotal / threshold);
    const nextTier = currentTier + 1;
    const nextThreshold = nextTier * threshold;
    const needMore = nextThreshold - cartTotal;

    let suggestionHtml = '<div class="suggestion-title">&#128161; 凑单建议</div>';
    suggestionHtml += '<div class="suggestion-text">';

    if (discountTimes > 0) {
      suggestionHtml += '当前已触发 <strong>' + discountTimes + ' 档</strong>满减，';
    } else {
      suggestionHtml += '当前未触发满减，';
    }

    suggestionHtml += '距离下一档 <span class="next-tier">满' + nextThreshold + '减' + (nextTier * reduceAmount) + '</span>';

    if (needMore > 0) {
      suggestionHtml += ' 还需凑 <strong>¥' + needMore.toFixed(2) + '</strong><br>';
      suggestionHtml += '建议凑单品价格: <strong>¥' + needMore.toFixed(2) + ' ~ ¥' + (needMore + threshold - 0.01).toFixed(2) + '</strong>';
      // Calculate if it's worth it
      const additionalBenefit = reduceAmount - needMore;
      if (additionalBenefit > 0 && needMore <= threshold * 0.6) {
        suggestionHtml += '<br>凑到下一档可多省 <strong>¥' + additionalBenefit.toFixed(2) + '</strong>，很划算！';
      } else if (needMore <= threshold * 0.4) {
        suggestionHtml += '<br>差额较小，推荐凑单！';
      } else if (needMore > threshold * 0.8) {
        suggestionHtml += '<br>差额较大，不必强求凑单。';
      }
    } else {
      suggestionHtml += '<br>刚好达到满减门槛，完美！';
    }

    suggestionHtml += '</div>';
    suggestionBox.innerHTML = suggestionHtml;
  } else {
    suggestionBox.style.display = 'none';
  }

  // Item breakdown: distribute discounts proportionally
  if (cartTotal > 0 && totalDiscount > 0) {
    document.getElementById('itemBreakdown').style.display = 'block';
    let breakdownHtml = '';
    cartItems.forEach((item, i) => {
      const itemTotal = item.price * item.qty;
      const ratio = cartTotal > 0 ? itemTotal / cartTotal : 0;
      const itemDiscount = totalDiscount * ratio;
      const itemFinal = Math.max(0, itemTotal - itemDiscount);
      const perUnit = item.qty > 0 ? itemFinal / item.qty : itemFinal;
      breakdownHtml += `
        <div class="item-row">
          <span class="name">${escapeHtml(item.name)} ×${item.qty}</span>
          <span>
            <span class="orig">¥${itemTotal.toFixed(2)}</span>
            <span class="final">¥${itemFinal.toFixed(2)}</span>
            <span style="color:var(--text-muted);font-size:12px;">（均价¥${perUnit.toFixed(2)}）</span>
          </span>
        </div>
      `;
    });
    document.getElementById('itemBreakdownList').innerHTML = breakdownHtml;
  } else {
    document.getElementById('itemBreakdown').style.display = 'none';
  }
}

function shareResult() {
  const lines = [];
  lines.push('【618凑单计算结果】');
  lines.push('商品总价: ' + document.getElementById('resultTotal').textContent);
  lines.push('满减优惠: ' + document.getElementById('resultDiscount').textContent);
  lines.push('优惠券: ' + document.getElementById('resultCoupon').textContent);
  lines.push('红包: ' + document.getElementById('resultRedPacket').textContent);
  lines.push('总计优惠: ' + document.getElementById('resultTotalDiscount').textContent);
  lines.push('实付金额: ' + document.getElementById('resultPay').textContent);
  lines.push(document.getElementById('savedInfo').textContent);

  cartItems.forEach((item, i) => {
    lines.push((i + 1) + '. ' + item.name + ' ¥' + (item.price * item.qty).toFixed(2) + ' ×' + item.qty);
  });

  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    showToast('已复制到剪贴板！');
  }).catch(() => {
    showToast('复制失败，请手动复制');
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function debounce(fn, delay) {
  let timer;
  return function() {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, arguments), delay);
  };
}

// Init
init();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
