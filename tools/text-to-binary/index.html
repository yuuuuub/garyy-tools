<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文本转二进制</title><meta name="description" content="文本转二进制 - 在线文本二进制转换"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:6px;cursor:pointer;font-size:.85rem}.tab.active{background:var(--blue);color:#fff}</style><meta property="og:title" content="文本转二进制"><meta property="og:description" content="文本转二进制 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div class="container"><h1>🔢 文本转二进制</h1><p class="sub">在线文本二进制转换</p>
<div class="tabs">
<button class="tab active" onclick="switchTab('text')">文本→二进制</button>
<button class="tab" onclick="switchTab('binary')">二进制→文本</button>
</div>
<div class="card" id="inputCard"><div class="label">输入文本</div>
<textarea id="inputText" placeholder="输入要转换的文本..."></textarea>
<div class="btn-group">
<button class="btn" onclick="convertTextToBinary()">转换为二进制</button>
<button class="btn" onclick="convertTextToHex()">转换为十六进制</button>
<button class="btn" onclick="convertTextToOctal()">转换为八进制</button>
<button class="btn" onclick="convertTextToDecimal()">转换为十进制</button>
</div></div>
<div class="card" id="binaryCard" style="display:none"><div class="label">输入二进制</div>
<textarea id="inputBinary" placeholder="输入二进制数（用空格分隔）..."></textarea>
<div class="btn-group">
<button class="btn" onclick="convertBinaryToText()">转换为文本</button>
<button class="btn" onclick="convertBinaryToHex()">二进制→十六进制</button>
<button class="btn" onclick="convertBinaryToDecimal()">二进制→十进制</button>
</div></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var currentTab='text';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  event.target.classList.add('active');
  document.getElementById('inputCard').style.display=tab==='text'?'block':'none';
  document.getElementById('binaryCard').style.display=tab==='binary'?'block':'none';
  document.getElementById('result').innerHTML='';
}
function convertTextToBinary(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var binary=[];
  for(var i=0;i<text.length;i++){
    var bin=text.charCodeAt(i).toString(2);
    while(bin.length<8)bin='0'+bin;
    binary.push(bin);
  }
  showResult(binary.join(' '),'二进制结果');
}
function convertTextToHex(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var hex=[];
  for(var i=0;i<text.length;i++){
    hex.push(text.charCodeAt(i).toString(16).toUpperCase().padStart(2,'0'));
  }
  showResult(hex.join(' '),'十六进制结果');
}
function convertTextToOctal(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var octal=[];
  for(var i=0;i<text.length;i++){
    octal.push(text.charCodeAt(i).toString(8));
  }
  showResult(octal.join(' '),'八进制结果');
}
function convertTextToDecimal(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var decimal=[];
  for(var i=0;i<text.length;i++){
    decimal.push(text.charCodeAt(i));
  }
  showResult(decimal.join(' '),'十进制结果');
}
function convertBinaryToText(){
  var binary=document.getElementById('inputBinary').value.trim();
  var r=document.getElementById('result');
  if(!binary){r.innerHTML='<div class="card" style="color:var(--red)">请输入二进制</div>';return;}
  try{
    var bytes=binary.split(/\s+/);
    var text='';
    for(var i=0;i<bytes.length;i++){
      text+=String.fromCharCode(parseInt(bytes[i],2));
    }
    showResult(text,'文本结果');
  }catch(e){
    r.innerHTML='<div class="card" style="color:var(--red)">转换失败: '+e.message+'</div>';
  }
}
function convertBinaryToHex(){
  var binary=document.getElementById('inputBinary').value.trim();
  var r=document.getElementById('result');
  if(!binary){r.innerHTML='<div class="card" style="color:var(--red)">请输入二进制</div>';return;}
  try{
    var bytes=binary.split(/\s+/);
    var hex=[];
    for(var i=0;i<bytes.length;i++){
      hex.push(parseInt(bytes[i],2).toString(16).toUpperCase().padStart(2,'0'));
    }
    showResult(hex.join(' '),'十六进制结果');
  }catch(e){
    r.innerHTML='<div class="card" style="color:var(--red)">转换失败: '+e.message+'</div>';
  }
}
function convertBinaryToDecimal(){
  var binary=document.getElementById('inputBinary').value.trim();
  var r=document.getElementById('result');
  if(!binary){r.innerHTML='<div class="card" style="color:var(--red)">请输入二进制</div>';return;}
  try{
    var bytes=binary.split(/\s+/);
    var decimal=[];
    for(var i=0;i<bytes.length;i++){
      decimal.push(parseInt(bytes[i],2));
    }
    showResult(decimal.join(' '),'十进制结果');
  }catch(e){
    r.innerHTML='<div class="card" style="color:var(--red)">转换失败: '+e.message+'</div>';
  }
}
function showResult(text,title){
  var r=document.getElementById('result');
  var html='<div class="card"><div class="section"><h3>📋 '+title+'</h3>';
  html+='<div class="result-block" id="resultText">'+escapeHtml(text)+'</div>';
  html+='<button class="copy-btn" onclick="copyResult()">复制结果</button></div></div>';
  r.innerHTML=html;
}
function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyResult(){
  var text=document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
convertTextToBinary();
</script></body></html>
