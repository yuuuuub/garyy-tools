<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖼️ 字符画生成器</title>
<meta name="description" content="ASCII字符画生成器，将文字转换为字符艺术作品">
<style>
:root {--bg: #f5f5f5;
--card: #ffffff;
--text: #1a1a2e;
--text-secondary: #555;
--border: #e0e0e0;
--primary: #4f46e5;
--primary-hover: #4338ca;
--shadow: 0 2px 12px rgba(0,0,0,0.06);
--radius: 12px;
--input-bg: #fafafa;
--tag-bg: #eef2ff;
--tag-text: #4f46e5;
--tag-active-bg: #4f46e5;
--tag-active-text: #fff;
--pre-bg: #1e1e2e;
--pre-text: #cdd6f4}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
@media (prefers-color-scheme: dark) {:root {--bg: #11111b;
--card: #1e1e2e;
--text: #cdd6f4;
--text-secondary: #a6adc8;
--border: #313244;
--shadow: 0 2px 12px rgba(0,0,0,0.3);
--input-bg: #181825;
--tag-bg: #313244;
--tag-text: #89b4fa;
--tag-active-bg: #89b4fa;
--tag-active-text: #1e1e2e;
--pre-bg: #11111b;
--pre-text: #a6e3a1}}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
justify-content: center;
padding: 16px}
.container {width: 100%;
max-width: 800px}
h1 {text-align: center;
font-size: 1.6rem;
margin-bottom: 20px;
letter-spacing: 0.02em}
.card {background: var(--card);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 20px;
box-shadow: var(--shadow);
margin-bottom: 16px}
.input-group {display: flex;
flex-direction: column;
gap: 8px}
.input-group label {font-size: 0.875rem;
font-weight: 600;
color: var(--text-secondary)}
#textInput {width: 100%;
padding: 12px 16px;
border: 2px solid var(--border);
border-radius: var(--radius);
font-size: 1rem;
background: var(--input-bg);
color: var(--text);
outline: none;
transition: border-color 0.2s}
#textInput:focus {border-color: var(--primary)}
.tags {display: flex;
flex-wrap: wrap;
gap: 8px}
.tag {display: inline-flex;
align-items: center;
gap: 4px;
padding: 8px 16px;
border-radius: 20px;
font-size: 0.85rem;
font-weight: 500;
cursor: pointer;
border: 2px solid transparent;
background: var(--tag-bg);
color: var(--tag-text);
transition: all 0.2s;
white-space: nowrap}
.tag:hover {opacity: 0.85}
.tag.active {background: var(--tag-active-bg);
color: var(--tag-active-text);
border-color: var(--primary)}
.output-wrapper {position: relative;
margin-top: 16px}
#output {font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
font-size: 13px;
line-height: 1.2;
white-space: pre;
overflow-x: auto;
padding: 20px;
background: var(--pre-bg);
color: var(--pre-text);
border-radius: var(--radius);
min-height: 120px;
max-height: 60vh;
overflow-y: auto;
border: 1px solid var(--border)}
#output.placeholder {color: var(--text-secondary);
opacity: 0.5;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif}
.btn-group {display: flex;
gap: 10px;
margin-top: 10px;
flex-wrap: wrap}
.btn {display: inline-flex;
align-items: center;
gap: 6px;
padding: 10px 20px;
border-radius: var(--radius);
font-size: 0.9rem;
font-weight: 600;
cursor: pointer;
border: none;
transition: all 0.2s}
.btn-primary {background: var(--primary);
color: var(--text)}
.btn-primary:hover {background: var(--primary-hover)}
.btn-secondary {background: var(--tag-bg);
color: var(--tag-text);
border: 1px solid var(--border)}
.btn-secondary:hover {opacity: 0.85}
.copied-toast {position: fixed;
top: 20px;
left: 50%;
transform: translateX(-50%);
background: #22c55e;
color: var(--text);
padding: 10px 24px;
border-radius: 20px;
font-size: 0.9rem;
font-weight: 600;
opacity: 0;
pointer-events: none;
transition: opacity 0.3s;
z-index: 100}
.copied-toast.show {opacity: 1}
@media (min-width: 640px) {body { padding: 32px; }
h1 { font-size: 2rem; }
#output { font-size: 15px; }}
@media (min-width: 768px) {#output { font-size: 17px; }
.card { padding: 28px; }}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🖼️ 字符画生成器">
  <meta property="og:description" content="ASCII字符画生成器，将文字转换为字符艺术作品">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/ascii-art-gen/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <h1>🖼️ 字符画生成器</h1>

  <div class="card">
    <div class="input-group">
      <label for="textInput">输入文字</label>
      <input type="text" id="textInput" placeholder="输入文字（字母或数字）..." maxlength="60" autofocus>
    </div>
  </div>

  <div class="card">
    <div class="tags" id="styleTags">
      <button class="tag active" data-style="0">✨ 标准</button>
      <button class="tag" data-style="1">🪶 极简</button>
      <button class="tag" data-style="2">🧱 方块</button>
      <button class="tag" data-style="3">🫧 圆润</button>
      <button class="tag" data-style="4">💫 斜体</button>
      <button class="tag" data-style="5">🫧 泡泡字</button>
    </div>
    <div class="output-wrapper">
      <pre id="output" class="placeholder">输入文字即可预览字符画</pre>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="copyBtn">📋 一键复制</button>
      <button class="btn btn-secondary" id="clearBtn">🔄 清空</button>
    </div>
  </div>
</div>

<div class="copied-toast" id="toast">✅ 已复制到剪贴板</div>

<script>
(function() {
  const glyphs = {
    'A': [0x0E,0x11,0x1F,0x11,0x11],
    'B': [0x1E,0x11,0x1E,0x11,0x1E],
    'C': [0x0E,0x11,0x10,0x11,0x0E],
    'D': [0x1E,0x11,0x11,0x11,0x1E],
    'E': [0x1F,0x10,0x1E,0x10,0x1F],
    'F': [0x1F,0x10,0x1E,0x10,0x10],
    'G': [0x0E,0x11,0x13,0x11,0x0E],
    'H': [0x11,0x11,0x1F,0x11,0x11],
    'I': [0x0E,0x04,0x04,0x04,0x0E],
    'J': [0x07,0x01,0x01,0x11,0x0E],
    'K': [0x11,0x12,0x1C,0x12,0x11],
    'L': [0x10,0x10,0x10,0x10,0x1F],
    'M': [0x11,0x1B,0x15,0x11,0x11],
    'N': [0x11,0x19,0x15,0x13,0x11],
    'O': [0x0E,0x11,0x11,0x11,0x0E],
    'P': [0x1E,0x11,0x1E,0x10,0x10],
    'Q': [0x0E,0x11,0x11,0x13,0x0F],
    'R': [0x1E,0x11,0x1E,0x12,0x11],
    'S': [0x0E,0x11,0x0C,0x11,0x0E],
    'T': [0x1F,0x04,0x04,0x04,0x04],
    'U': [0x11,0x11,0x11,0x11,0x0E],
    'V': [0x11,0x11,0x11,0x0A,0x04],
    'W': [0x11,0x11,0x15,0x1B,0x11],
    'X': [0x11,0x0A,0x04,0x0A,0x11],
    'Y': [0x11,0x0A,0x04,0x04,0x04],
    'Z': [0x1F,0x02,0x04,0x08,0x1F],
    '0': [0x0E,0x13,0x15,0x19,0x0E],
    '1': [0x04,0x0C,0x04,0x04,0x0E],
    '2': [0x0E,0x11,0x02,0x04,0x1F],
    '3': [0x1E,0x01,0x0E,0x01,0x1E],
    '4': [0x12,0x12,0x1F,0x02,0x02],
    '5': [0x1F,0x10,0x1E,0x01,0x1E],
    '6': [0x0E,0x10,0x1E,0x11,0x0E],
    '7': [0x1F,0x02,0x04,0x08,0x08],
    '8': [0x0E,0x11,0x0E,0x11,0x0E],
    '9': [0x0E,0x11,0x0F,0x01,0x0E],
    ' ': [0x00,0x00,0x00,0x00,0x00]
  };
  const ROWS = 5;
  const COLS = 5;
  const styles = {
    0: {
      name: '标准',
      fill: '#',
      empty: ' ',
      renderChar: function(glyph) {
        const lines = [];
        for (let r = 0; r < ROWS; r++) {
          let line = '';
          for (let c = 0; c < COLS; c++) {
            line += (glyph[r] >> (COLS-1-c)) & 1 ? this.fill : this.empty;
          }
          lines.push(line);
        }
        return lines;
      }
    },
    1: {
      name: '极简',
      fill: '\u00B7',
      empty: ' ',
      renderChar: function(glyph) {
        const lines = [];
        for (let r = 0; r < ROWS; r++) {
          let line = '';
          for (let c = 0; c < COLS; c++) {
            line += (glyph[r] >> (COLS-1-c)) & 1 ? this.fill : this.empty;
          }
          lines.push(line);
        }
        return lines;
      }
    },
    2: {
      name: '方块',
      fill: '\u2588',
      empty: '\u2591',
      renderChar: function(glyph) {
        const lines = [];
        for (let r = 0; r < ROWS; r++) {
          let line = '';
          for (let c = 0; c < COLS; c++) {
            line += (glyph[r] >> (COLS-1-c)) & 1 ? this.fill : this.empty;
          }
          lines.push(line);
        }
        return lines;
      }
    },
    3: {
      name: '圆润',
      fill: 'O',
      empty: ' ',
      renderChar: function(glyph) {
        const lines = [];
        for (let r = 0; r < ROWS; r++) {
          let line = '';
          for (let c = 0; c < COLS; c++) {
            const isFilled = (glyph[r] >> (COLS-1-c)) & 1;
            if (!isFilled) {
              line += this.empty;
            } else {
              const isInterior = r > 0 && r < ROWS-1 && c > 0 && c < COLS-1;
              const hasNeighborUp = r > 0 && ((glyph[r-1] >> (COLS-1-c)) & 1);
              const hasNeighborDown = r < ROWS-1 && ((glyph[r+1] >> (COLS-1-c)) & 1);
              const hasNeighborLeft = c > 0 && ((glyph[r] >> (COLS-c)) & 1);
              const hasNeighborRight = c < COLS-1 && ((glyph[r] >> (COLS-2-c)) & 1);
              const surrounded = hasNeighborUp && hasNeighborDown && hasNeighborLeft && hasNeighborRight;
              line += (isInterior && surrounded) ? 'o' : 'O';
            }
          }
          lines.push(line);
        }
        return lines;
      }
    },
    4: {
      name: '斜体',
      fill: '#',
      empty: ' ',
      renderChar: function(glyph) {
        const lines = [];
        const totalCols = COLS + ROWS - 1;
        for (let r = 0; r < ROWS; r++) {
          let line = '';
          for (let c = 0; c < totalCols; c++) {
            const srcCol = c - r;
            if (srcCol >= 0 && srcCol < COLS) {
              line += (glyph[r] >> (COLS-1-srcCol)) & 1 ? this.fill : this.empty;
            } else {
              line += this.empty;
            }
          }
          lines.push(line);
        }
        return lines;
      }
    },
    5: {
      name: '泡泡字',
      fill: '\u25CF',
      empty: ' ',
      renderChar: function(glyph) {
        const lines = [];
        for (let r = 0; r < ROWS; r++) {
          let line = '';
          for (let c = 0; c < COLS; c++) {
            if ((glyph[r] >> (COLS-1-c)) & 1) {
              line += this.fill;
            } else {
              const hasFilledNeighbor =
                (r > 0 && ((glyph[r-1] >> (COLS-1-c)) & 1)) ||
                (r < ROWS-1 && ((glyph[r+1] >> (COLS-1-c)) & 1)) ||
                (c > 0 && ((glyph[r] >> (COLS-c)) & 1)) ||
                (c < COLS-1 && ((glyph[r] >> (COLS-2-c)) & 1));
              line += hasFilledNeighbor ? '\u25CB' : ' ';
            }
          }
          lines.push(line);
        }
        return lines;
      }
    }
  };
  let currentStyle = 0;
  const renderCache = {};
  function getRenderedChar(ch, styleIdx) {
    const key = ch + '_' + styleIdx;
    if (renderCache[key]) return renderCache[key];
    const glyph = glyphs[ch];
    if (!glyph) {
      const empty = Array(ROWS).fill('     ');
      renderCache[key] = empty;
      return empty;
    }
    const style = styles[styleIdx];
    const rendered = style.renderChar(glyph);
    renderCache[key] = rendered;
    return rendered;
  }
  function renderText(text, styleIdx) {
    if (!text) return '';
    const chars = text.toUpperCase().split('');
    const colSpace = 1;
    const resultLines = Array(ROWS).fill('');
    for (const ch of chars) {
      const charLines = getRenderedChar(ch, styleIdx);
      const charWidth = charLines[0].length;
      for (let r = 0; r < ROWS; r++) {
        resultLines[r] += charLines[r];
        if (ch !== chars[chars.length-1]) {
          for (let s = 0; s < colSpace; s++) {
            resultLines[r] += ' ';
          }
        }
      }
    }
    return resultLines.join('\n');
  }
  const textInput = document.getElementById('textInput');
  const output = document.getElementById('output');
  const styleTags = document.getElementById('styleTags');
  const copyBtn = document.getElementById('copyBtn');
  const clearBtn = document.getElementById('clearBtn');
  const toast = document.getElementById('toast');
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2000);
  }
  function updatePreview() {
    const text = textInput.value.trim();
    if (!text) {
      output.textContent = '输入文字即可预览字符画';
      output.classList.add('placeholder');
    } else {
      const result = renderText(text, currentStyle);
      output.textContent = result;
      output.classList.remove('placeholder');
    }
  }
  textInput.addEventListener('input', updatePreview);
  styleTags.addEventListener('click', function(e) {
    const tag = e.target.closest('.tag');
    if (!tag) return;
    currentStyle = parseInt(tag.dataset.style, 10);
    styleTags.querySelectorAll('.tag').forEach(function(t) { t.classList.remove('active'); });
    tag.classList.add('active');
    updatePreview();
  });
  copyBtn.addEventListener('click', function() {
    const text = output.textContent;
    if (!text || output.classList.contains('placeholder')) {
      showToast('⚠️ 请先输入文字');
      return;
    }
    navigator.clipboard.writeText(text).then(function() {
      showToast('✅ 已复制到剪贴板');
    }).catch(function() {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('✅ 已复制到剪贴板');
    });
  });
  clearBtn.addEventListener('click', function() {
    textInput.value = '';
    updatePreview();
    textInput.focus();
  });
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      textInput.value = '';
      updatePreview();
    }
  });
  updatePreview();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
