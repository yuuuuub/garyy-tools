<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNS检查工具</title>
<meta name="description" content="DNS记录查询 - 检查域名DNS解析记录">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950;--red:#f85149;--yellow:#d29922}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;min-height:100vh}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.container{max-width:800px;margin:0 auto;padding:24px}
.input-row{display:flex;gap:8px;margin-bottom:16px}
.input-row input{flex:1;padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;outline:none}
.input-row input:focus{border-color:var(--accent)}
.type-select{padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none}
.btn{padding:12px 24px;border-radius:8px;border:none;background:var(--accent);color:var(--text);cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5}
.results{margin-top:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:10px;color:var(--accent)}
.record-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.record-row:last-child{border-bottom:none}
.record-type{background:var(--accent);color:var(--text);padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.empty{text-align:center;padding:40px;color:var(--muted)}
.loading{text-align:center;padding:40px;display:none}
.loading.show{display:block}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:rgba(248,81,73,.1);border:1px solid var(--red);border-radius:8px;padding:12px;color:var(--red);display:none;margin-bottom:16px}
@media(max-width:600px){.input-row{flex-direction:column}.container{padding:16px}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="DNS检查工具">
  <meta property="og:description" content="DNS记录查询 - 检查域名DNS解析记录">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/dns-checker/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="header">
<span style="font-size:28px">🔍</span>
<h1>DNS检查工具</h1>
</div>
<div class="container">
<div class="input-row">
<input type="text" id="domain" placeholder="输入域名" title="Enter键搜索" onkeydown="if(event.key==='Enter')checkDNS()">
<select class="type-select" id="dnsType">
<option value="A">A</option>
<option value="AAAA">AAAA</option>
<option value="CNAME">CNAME</option>
<option value="MX">MX</option>
<option value="TXT">TXT</option>
<option value="NS">NS</option>
<option value="SOA">SOA</option>
<option value="ALL">所有记录</option>
</select>
<button class="btn" id="checkBtn" onclick="checkDNS()">查询</button>
</div>
<div class="error-box" id="error"></div>
<div class="loading" id="loading"><div class="spinner"></div><p style="margin-top:10px;color:var(--muted)">查询中...</p></div>
<div class="results" id="results"></div>
</div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function checkDNS(){
const domain=document.getElementById('domain').value.trim();
const type=document.getElementById('dnsType').value;
if(!domain)return;
if(!/^[a-zA-Z0-9._-]+$/.test(domain)){showError('域名格式无效');return}
document.getElementById('error').classList.remove('show');
document.getElementById('results').innerHTML='';
document.getElementById('loading').classList.add('show');
const types=type==='ALL'?['A','AAAA','CNAME','MX','TXT','NS','SOA']:[type];
Promise.all(types.map(t=>queryDNS(domain,t))).then(results=>{
document.getElementById('loading').classList.remove('show');
let html='';
results.forEach(r=>{
if(r.records.length>0){
html+=`<div class="card"><h3><span class="record-type">${esc(r.type)}</span> ${esc(r.type)} 记录</h3>`;
r.records.forEach(rec=>{
html+=`<div class="record-row"><span style="color:var(--muted)">${esc(rec.name)}</span><span>${esc(rec.data)}</span></div>`;
});
html+='</div>';
}
});
document.getElementById('results').innerHTML=html||'<div class="empty">未找到DNS记录</div>';
}).catch(e=>{
document.getElementById('loading').classList.remove('show');
showError('查询失败: '+e.message);
});
}
function queryDNS(domain,type){
return fetch(`https://dns.alidns.com/resolve?name=${encodeURIComponent(domain)}&type=${type}`)
.then(r=>r.json())
.then(d=>({
type,
records:(d.Answer||[]).map(a=>({name:a.name,data:a.data}))
}));
}
function showError(m){const e=document.getElementById('error');e.textContent=m;e.classList.add('show')}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
