<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 礼物创意生成器</title>
<meta name="description" content="为亲友生成礼物创意，记录送礼计划和预算">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1}.ctn{padding:0}}
.li{padding:14px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.gr .st{text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;color:#fff;margin-right:4px}
.tag.idea{background:var(--accent)}.tag.bought{background:var(--success)}.tag.given{background:var(--warn)}
.idea-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px;text-align:center}
.idea-card .emoji{font-size:2rem;margin-bottom:8px}
.idea-card .name{font-size:1.1rem;font-weight:600}
.idea-card .desc{font-size:.9rem;color:var(--text2);margin-top:4px}
.idea-card .price{color:var(--warn);font-size:.9rem;margin-top:4px}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🎁 礼物创意生成器</h1><p>为亲友找到完美礼物</p></div>

<div class="cd"><h2>生成礼物创意</h2>
<div class="fr">
<div><label>送给谁</label><select id="gPerson"><option value="friend">朋友</option><option value="parent">父母</option><option value="partner">伴侣</option><option value="child">孩子</option><option value="colleague">同事</option><option value="elder">长辈</option></select></div>
<div><label>场合</label><select id="gOccasion"><option value="birthday">生日</option><option value="holiday">节日</option><option value="wedding">婚礼</option><option value="graduation">毕业</option><option value="housewarming">乔迁</option><option value="justbecause">日常惊喜</option></select></div>
</div>
<div class="fr">
<div><label>预算范围</label><select id="gBudget"><option value="low">100元以内</option><option value="mid">100-500元</option><option value="high">500-2000元</option><option value="luxury">2000元以上</option></select></div>
<div><label>兴趣爱好</label><input type="text" id="gInterest" placeholder="如：读书、运动..."></div>
</div>
<div class="bg"><button onclick="generateIdeas()">✨ 生成创意</button></div>
<div id="ideaResult"></div></div>

<div class="cd"><h2>送礼计划</h2>
<div class="fr">
<div><label>礼物名称</label><input type="text" id="pGift" placeholder="礼物名称"></div>
<div><label>送给谁</label><input type="text" id="pTo" placeholder="收礼人"></div>
</div>
<div class="fr">
<div><label>预算(元)</label><input type="number" id="pBudget" placeholder="0"></div>
<div><label>日期</label><input type="date" id="pDate"></div>
</div>
<label>备注</label><textarea id="pNote" placeholder="送礼计划..."></textarea>
<div class="bg"><button onclick="addPlan()">添加计划</button></div>
<div id="pMsg" style="display:none;text-align:center;padding:8px;border-radius:8px;margin-top:8px;font-size:.85rem"></div></div>

<div class="cd"><h2>我的送礼计划</h2>
<div id="planList" class="es">暂无计划</div>
</div>
</div>

<script>
let plans=JSON.parse(localStorage.getItem('giftIdeas')||'[]');
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function save(){localStorage.setItem('giftIdeas',JSON.stringify(plans))}
function showMsg(m,t){const e=$('pMsg');e.textContent=m;e.style.display='block';e.style.background=t==='error'?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)';e.style.color=t==='error'?'var(--danger)':'var(--success)';setTimeout(()=>e.style.display='none',2000)}
const ideas=[
{person:['friend','colleague'],occasion:'birthday',budget:'low',gift:'手工贺卡',desc:'亲手制作的贺卡，心意满满',price:'0-20元',emoji:'💌'},
{person:['friend','partner'],occasion:'birthday',budget:'low',gift:'定制钥匙扣',desc:'刻上名字或照片的钥匙扣',price:'20-50元',emoji:'🔑'},
{person:['friend','colleague'],occasion:'holiday',budget:'mid',gift:'精品咖啡礼盒',desc:'精选多款挂耳咖啡',price:'100-300元',emoji:'☕'},
{person:['parent','elder'],occasion:'holiday',budget:'mid',gift:'按摩仪',desc:'颈椎或腰部按摩仪，关爱健康',price:'200-500元',emoji:'💆'},
{person:['partner'],occasion:'birthday',budget:'mid',gift:'香水',desc:'挑选对方喜欢的香味',price:'300-500元',emoji:'🌸'},
{person:['friend','partner'],occasion:'birthday',budget:'high',gift:'智能手表',desc:'运动健康监测好帮手',price:'1000-2000元',emoji:'⌚'},
{person:['child'],occasion:'birthday',budget:'low',gift:'绘本套装',desc:'精选儿童绘本',price:'50-100元',emoji:'📚'},
{person:['child'],occasion:'birthday',budget:'mid',gift:'乐高积木',desc:'锻炼动手能力和创造力',price:'200-500元',emoji:'🧱'},
{person:['parent'],occasion:'justbecause',budget:'mid',gift:'体检套餐',desc:'定期体检关爱父母健康',price:'300-800元',emoji:'🏥'},
{person:['friend'],occasion:'housewarming',budget:'mid',gift:'香薰套装',desc:'提升居家幸福感',price:'100-300元',emoji:'🕯️'},
{person:['partner'],occasion:'wedding',budget:'high',gift:'珠宝首饰',desc:'纪念日的浪漫礼物',price:'1000-3000元',emoji:'💍'},
{person:['colleague'],occasion:'graduation',budget:'low',gift:'钢笔',desc:'品质钢笔，前程似锦',price:'50-200元',emoji:'🖊️'},
{person:['friend','partner'],occasion:'birthday',budget:'low',gift:'手工烘焙',desc:'亲手做的饼干或蛋糕',price:'30-80元',emoji:'🍪'},
{person:['parent','elder'],occasion:'holiday',budget:'high',gift:'旅行机票',desc:'来一场说走就走的旅行',price:'1000-3000元',emoji:'✈️'},
{person:['friend'],occasion:'justbecause',budget:'low',gift:'绿植盆栽',desc:'办公桌上的小森林',price:'30-80元',emoji:'🌿'},
{person:['partner'],occasion:'birthday',budget:'mid',gift:'手工皮具',desc:'钱包或手包，低调有质感',price:'300-800元',emoji:'👜'},
{person:['child'],occasion:'graduation',budget:'high',gift:'平板电脑',desc:'学习娱乐两不误',price:'2000-3000元',emoji:'📱'},
{person:['colleague'],occasion:'holiday',budget:'low',gift:'坚果礼盒',desc:'健康美味的零食',price:'50-150元',emoji:'🥜'},
{person:['parent'],occasion:'birthday',budget:'mid',gift:'足浴盆',desc:'泡脚养生好帮手',price:'200-500元',emoji:'🦶'},
{person:['friend','partner'],occasion:'holiday',budget:'mid',gift:'围巾',desc:'温暖又有心意',price:'100-400元',emoji:'🧣'}
];
function generateIdeas(){const person=$('gPerson').value,occasion=$('gOccasion').value,budget=$('gBudget').value;const filtered=ideas.filter(idea=>idea.person.includes(person)&&(idea.budget===budget||(budget==='low'&&idea.budget==='low')||(budget==='mid'&&['low','mid'].includes(idea.budget))||(budget==='high'&&['mid','high'].includes(idea.budget))||(budget==='luxury')));const result=filtered.length?filtered.sort(()=>Math.random()-0.5).slice(0,3):ideas.sort(()=>Math.random()-0.5).slice(0,3);$('ideaResult').innerHTML='<div style="display:grid;gap:12px;margin-top:12px">'+result.map(idea=>'<div class="idea-card"><div class="emoji">'+idea.emoji+'</div><div class="name">'+esc(idea.gift)+'</div><div class="desc">'+esc(idea.desc)+'</div><div class="price">'+idea.price+'</div><button class="sec" style="margin-top:8px;padding:6px 16px;font-size:.85rem" onclick="adoptIdea(\''+esc(idea.gift)+'\',\''+esc(idea.price)+'')">采纳此创意</button></div>').join('')+'</div>'}
function adoptIdea(name,price){$('pGift').value=name;$('pNote').value='参考价格: '+price}
function addPlan(){const gift=$('pGift').value.trim(),to=$('pTo').value.trim(),budget=parseFloat($('pBudget').value)||0,date=$('pDate').value,note=$('pNote').value.trim();if(!gift||!to){showMsg('请填写礼物和收礼人','error');return}plans.push({gift,to,budget,date,note,status:'idea',addedAt:Date.now()});save();render();showMsg('计划已添加','success');['pGift','pTo','pBudget','pNote'].forEach(id=>$(id).value='')}
function render(){const statusMap={idea:'构思中',bought:'已购买',given:'已送出'};$('planList').innerHTML=plans.length?plans.map((p,i)=>{const realIdx=plans.indexOf(p);return '<div class="li"><div style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-weight:600">🎁 '+esc(p.gift)+'</span><br>送给: <span style="color:var(--text2)">'+esc(p.to)+'</span>'+(p.date?' <span style="color:var(--text2);font-size:.8rem">📅 '+p.date+'</span>':'')+'<br><span class="tag '+p.status+'">'+statusMap[p.status]+'</span>'+(p.budget?'<span style="color:var(--warn);font-size:.85rem;margin-left:4px">¥'+p.budget+'</span>':'')+'</div></div>'+(p.note?'<div style="font-size:.85rem;color:var(--text2);margin-top:6px">'+esc(p.note)+'</div>':'')+'<div class="bg"><button class="sec" style="padding:4px 12px;font-size:.8rem" onclick="cycleStatus('+realIdx+')">切换状态</button><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="removePlan('+realIdx+')">删除</button></div></div>'}).join(''):'<div class="es">暂无送礼计划</div>'}
function cycleStatus(i){const order=['idea','bought','given'];const cur=order.indexOf(plans[i].status);plans[i].status=order[(cur+1)%order.length];save();render()}
function removePlan(i){plans.splice(i,1);save();render()}
$('pDate').value=new Date().toISOString().slice(0,10);
render()
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
