<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 记账本</title>
<meta name="description" content="简单好用的记账工具，追踪每笔支出和收入">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:20pxpadding:16px;}
.ctn{max-width:600px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem}
.tag.expense{background:var(--danger);color:#fff}
.tag.income{background:var(--success);color:#fff}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st>div{text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.st .nm{font-size:1.3rem;font-weight:700}
.st .lb{font-size:.75rem;color:var(--text2);margin-top:2px}
.empty{color:var(--text2);text-align:center;padding:20px}
.bar{display:flex;gap:4px;height:12px;border-radius:6px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;border-radius:6px;transition:width .3s}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:.8rem}
.legend span{display:flex;align-items:center;gap:4px}
.legend span::before{content:'';width:10px;height:10px;border-radius:50%;display:inline-block}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="💰 记账本">
<meta property="og:description" content="简单好用的记账工具，追踪每笔支出和收入">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>💰 记账本</h1><p>记录每笔收支，掌握财务状况</p></div>

<div class="st" id="stats"></div>

<div class="cd"><h2>记一笔</h2>
<div class="fr">
<div><label>类型</label><select id="eType"><option value="expense">支出</option><option value="income">收入</option></select></div>
<div><label>金额</label><input type="number" id="eAmount" placeholder="0.00" step="0.01" min="0"></div>
</div>
<label>分类</label><select id="eCat"><option>餐饮</option><option>交通</option><option>购物</option><option>娱乐</option><option>居住</option><option>医疗</option><option>教育</option><option>工资</option><option>副业</option><option>其他</option></select>
<label>备注</label><input type="text" id="eNote" placeholder="如：午餐、打车">
<label>日期</label><input type="date" id="eDate">
<div class="bg"><button onclick="addEntry()">记账</button></div></div>

<div class="cd"><h2>本月概览</h2>
<div id="catBar"></div>
<div id="catLegend" class="legend"></div></div>

<div class="cd"><h2>记录列表</h2><div id="entryList" class="empty">暂无记录</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let entries = JSON.parse(localStorage.getItem('et_entries') || '[]');
const catColors = ['#ef4444','#f59e0b','#22c55e','#3b82f6','#8b5cf6','#ec4899','#06b6d4','#f97316','#84cc16','#6b7280'];

function save() { localStorage.setItem('et_entries', JSON.stringify(entries)); }

function addEntry() {
  const amount = parseFloat($('eAmount').value);
  if (!amount || amount <= 0) { alert('请输入有效金额'); return; }
  entries.push({
    id: Date.now(),
    type: $('eType').value,
    amount,
    category: $('eCat').value,
    note: $('eNote').value.trim(),
    date: $('eDate').value || new Date().toISOString().slice(0, 10)
  });
  save(); render(); $('eAmount').value = ''; $('eNote').value = '';
}

function deleteEntry(id) {
  entries = entries.filter(x => x.id !== id);
  save(); render();
}

function render() {
  const now = new Date();
  const month = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const monthEntries = entries.filter(e => e.date.startsWith(month));
  const totalExpense = monthEntries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
  const totalIncome = monthEntries.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
  const balance = totalIncome - totalExpense;

  $('stats').innerHTML = `
    <div><div class="nm" style="color:var(--success)">¥${totalIncome.toFixed(2)}</div><div class="lb">本月收入</div></div>
    <div><div class="nm" style="color:var(--danger)">¥${totalExpense.toFixed(2)}</div><div class="lb">本月支出</div></div>
    <div><div class="nm" style="color:${balance >= 0 ? 'var(--success)' : 'var(--danger)'}">¥${balance.toFixed(2)}</div><div class="lb">结余</div></div>`;

  const cats = {};
  monthEntries.filter(e => e.type === 'expense').forEach(e => { cats[e.category] = (cats[e.category] || 0) + e.amount; });
  const sorted = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  if (sorted.length) {
    $('catBar').innerHTML = `<div class="bar">${sorted.map(([cat, amt], i) => `<div style="width:${(amt / totalExpense * 100).toFixed(1)}%;background:${catColors[i % catColors.length]}" title="${cat}: ¥${amt.toFixed(2)}"></div>`).join('')}</div>`;
    $('catLegend').innerHTML = sorted.map(([cat, amt], i) => `<span style="--c:${catColors[i % catColors.length]}"><span style="background:${catColors[i % catColors.length]};width:10px;height:10px;border-radius:50%;display:inline-block"></span>${cat} ¥${amt.toFixed(2)} (${(amt / totalExpense * 100).toFixed(1)}%)</span>`).join('');
  } else {
    $('catBar').innerHTML = '';
    $('catLegend').innerHTML = '';
  }

  const sorted2 = [...entries].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  $('entryList').innerHTML = sorted2.length ? sorted2.map(e =>
    `<div class="li"><div><strong>¥${e.amount.toFixed(2)}</strong> <span class="tag ${e.type}">${e.type === 'expense' ? '支出' : '收入'}</span><br><span style="font-size:.8rem;color:var(--text2)">${e.category} ${e.note ? '· ' + e.note : ''}</span></div><div style="text-align:right"><div style="font-size:.8rem;color:var(--text2)">${e.date}</div><button class="dng" style="padding:2px 8px;font-size:.75rem;margin-top:4px" onclick="deleteEntry(${e.id})">删</button></div></div>`
  ).join('') : '<div class="empty">暂无记录</div>';

  $('eDate').value = new Date().toISOString().slice(0, 10);
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
