<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国戏曲服饰大全 - Chinese Opera Costume Encyclopedia</title>
<meta name="description" content="中国戏曲服饰大全，详解蟒袍、靠甲、褶子、帔等各行当穿戴规制与刺绣工艺">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国戏曲服饰大全 - Chinese Opera Costume Encyclopedia">
<meta property="og:description" content="中国戏曲服饰大全，详解蟒袍、靠甲、褶子、帔等各行当穿戴规制与刺绣工艺">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-opera-costume-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👘</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#d4547a;--accent2:#b83d60}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#bf3f60;--accent2:#9a3050}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0510 0%,#2a0a1a 50%,#3d1028 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a1a3a;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#d4547a,#e878a0,#c96090,#b83d60);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.costume-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.costume-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.costume-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.costume-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.costume-card .ct-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.costume-card .ct-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(212,84,122,0.15);color:var(--accent)}
.costume-card .ct-name{font-size:1.3em;font-weight:bold}
.costume-card .ct-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.costume-card .ct-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.costume-card .ct-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.costume-card .ct-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.costume-card .ct-detail strong{color:var(--text)}
.costume-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.costume-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>👘 中国戏曲服饰大全</h1>
<p>Chinese Opera Costume Encyclopedia — 探索蟒袍、靠甲、褶子、帔等戏曲穿戴规制与刺绣工艺</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索服饰类型、行当或工艺...（如"蟒袍""靠""旦角"）" title="Enter键搜索">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="蟒袍">蟒袍</button>
<button class="filter-btn" data-filter="靠甲">靠甲</button>
<button class="filter-btn" data-filter="褶子">褶子</button>
<button class="filter-btn" data-filter="帔">帔</button>
<button class="filter-btn" data-filter="衣">衣</button>
<button class="filter-btn" data-filter="盔帽">盔帽</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="costume-grid" id="costumeGrid"></div>
</div>
<footer>中国戏曲服饰大全 — 衣冠楚楚 · 国粹之美 · garyy.top</footer>
<script>
const costumeData=[
{name:"红蟒",category:"蟒袍",icon:"🔴",subtitle:"帝王将相",roles:"生角·帝王",material:"缎面刺绣",craft:"金线盘龙",description:"红蟒是帝王将相的正装，通体红色缎面，绣金龙图案。龙纹采用金线盘绣，工艺精湛。皇帝穿红蟒时配九龙冠，显示至高无上的权威。"},
{name:"黄蟒",category:"蟒袍",icon:"🟡",subtitle:"皇帝专用",roles:"生角·皇帝",material:"明黄缎面",craft:"平金绣龙",description:"黄蟒为皇帝专用服饰，明黄色缎面绣九条金龙，配海水江崖纹。黄色为皇家专用色，象征天子至尊。仅皇帝可穿用。"},
{name:"黑蟒",category:"蟒袍",icon:"⚫",subtitle:"刚正不阿",roles:"净角·忠臣",material:"黑缎金绣",craft:"金线绣龙",description:"黑蟒多为刚正不阿的忠臣所穿，如包拯。黑色缎面绣金色龙纹，线条刚劲有力，表现人物的铁面无私。"},
{name:"白蟒",category:"蟒袍",icon:"⚪",subtitle:"儒雅风流",roles:"生角·文臣",material:"白缎银绣",craft:"银线绣花",description:"白蟒为年轻俊美文臣的服饰，白色缎面绣银色花纹，素雅高贵。多为儒将或新科状元所穿。"},
{name:"靠（硬靠）",category:"靠甲",icon:"⚔️",subtitle:"武将战甲",roles:"生角·武将",material:"绸缎甲片",craft:"扎靠·缀铜钉",description:"硬靠是武将的战甲服装，背部插四面靠旗（护背旗），表示领兵征战。靠身分前后两片，缀满铜钉甲片，威武雄壮。"},
{name:"软靠",category:"靠甲",icon:"🛡️",subtitle:"便装武将",roles:"生角·武将",material:"绸缎甲纹",craft:"彩绣甲纹",description:"软靠不插靠旗，是武将的便装战甲。比硬靠轻便，适合表现人物日常状态或非战斗场合。绣工精细，色彩丰富。"},
{name:"女靠",category:"靠甲",icon:"👩",subtitle:"巾帼英雄",roles:"旦角·女将",material:"彩缎绣花",craft:"彩绣凤凰",description:"女靠是女将的战甲，比男靠更贴身，绣凤凰或花卉图案。穆桂英、樊梨花等女将穿用，英姿飒爽。"},
{name:"素褶子",category:"褶子",icon:"👔",subtitle:"平民百姓",roles:"生角·平民",material:"素色绸缎",craft:"简单裁剪",description:"素褶子是平民百姓的日常服装，颜色素净，无复杂绣工。书生、秀才多穿白色或蓝色素褶子，表现清贫文雅。"},
{name:"花褶子",category:"褶子",icon:"🌸",subtitle:"富贵子弟",roles:"生角·富家",material:"彩缎绣花",craft:"团花刺绣",description:"花褶子是富贵人家子弟的便服，缎面绣团花或折枝花纹。色彩鲜艳，绣工精细，显示身份地位。"},
{name:"武生褶子",category:"褶子",icon:"🥋",subtitle:"江湖侠客",roles:"生角·武生",material:"素缎裁剪",craft:"紧凑合身",description:"武生褶子比文生褶子更短更紧身，便于武打动作。多为白色或黑色，简洁利落，表现侠客风范。"},
{name:"女帔",category:"帔",icon:"👗",subtitle:"贵妇人",roles:"旦角·贵妇",material:"彩缎绣花",craft:"对襟绣凤",description:"女帔是对襟长袍，为贵妇人的正式服装。绣凤凰牡丹图案，色彩华丽，雍容华贵。皇后、贵妃穿用。"},
{name:"男帔",category:"帔",icon:"🧥",subtitle:"官员便服",roles:"生角·官员",material:"缎面绣花",craft:"对襟绣纹",description:"男帔是官员的便服，对襟长袍，绣花卉或祥云图案。比蟒袍轻便，适合非正式场合。"},
{name:"宫装",category:"衣",icon:"👗",subtitle:"宫廷女服",roles:"旦角·宫女",material:"彩缎飘带",craft:"彩绣飘带",description:"宫装是宫廷女子的服装，上衣下裳相连，配彩色飘带。行动间飘带飞舞，婀娜多姿。"},
{name:"八卦衣",category:"衣",icon:"☯️",subtitle:"军师谋士",roles:"生角·军师",material:"黑缎绣八卦",craft:"绣太极八卦",description:"八卦衣是军师谋士的标志性服装，黑色缎面绣太极八卦图案。诸葛亮穿八卦衣，手持羽扇，运筹帷幄。"},
{name:"凤冠",category:"盔帽",icon:"👑",subtitle:"皇后贵妃",roles:"旦角·皇后",material:"点翠金饰",craft:"点翠嵌珠",description:"凤冠是皇后贵妃的头饰，以点翠工艺为主，镶嵌珍珠宝石。凤鸟造型精美绝伦，是戏曲头饰中的极品。"},
{name:"翎子",category:"盔帽",icon:"🪶",subtitle:"番邦将领",roles:"生角·番将",material:"雉鸡翎",craft:"插翎表演",description:"翎子是两根雉鸡尾羽，插在盔帽上，表示番邦将领或年轻武将。演员通过甩翎表演展现人物情绪。"}
];
function getStats(data){const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});return cats}
function renderStats(data){const stats=getStats(data);document.getElementById('statsOverview').innerHTML=`<div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">服饰总数</div></div>`+Object.entries(stats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}
function renderCards(data){document.getElementById('costumeGrid').innerHTML=data.map(m=>`<div class="costume-card" data-category="${m.category}"><div class="ct-header"><div class="ct-icon">${m.icon}</div><div><div class="ct-name">${m.name}</div><div class="ct-sub">${m.subtitle}</div></div></div><div class="ct-meta"><span>${m.roles}</span><span>${m.material}</span><span>${m.craft}</span></div><div class="ct-detail">${m.description}</div></div>`).join('')}
function filterCards(){const q=document.getElementById('searchInput').value.toLowerCase();const f=document.querySelector('.filter-btn.active').dataset.filter;const filtered=costumeData.filter(m=>{const matchF=f==='all'||m.category===f;const matchQ=!q||m.name.toLowerCase().includes(q)||m.description.toLowerCase().includes(q)||m.roles.toLowerCase().includes(q);return matchF&&matchQ});renderCards(filtered);renderStats(filtered)}
document.getElementById('searchInput').addEventListener('input',filterCards);
document.getElementById('filterRow').addEventListener('click',e=>{if(e.target.classList.contains('filter-btn')){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');filterCards()}});
renderCards(costumeData);renderStats(costumeData);
</script>
</body>
</html>
