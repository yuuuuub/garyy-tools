<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>元宵节花灯与灯谜</title>
<meta property="og:title" content="元宵节花灯与灯谜">
<meta property="og:description" content="元宵节花灯与灯谜 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="元宵节花灯与灯谜 - 花灯类型、灯谜竞猜、元宵习俗">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>">
<meta name="robots" content="index,follow">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.hidden{display:none}
.lantern-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;padding:20px 0}
.lantern{text-align:center;cursor:pointer;transition:all .3s}
.lantern:hover{transform:translateY(-5px)}
.lantern-body{width:60px;height:80px;background:linear-gradient(180deg,#ef4444,#dc2626);border-radius:50% 50% 45% 45%;position:relative;margin:0 auto;box-shadow:0 0 20px rgba(239,68,68,.3);animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(239,68,68,.3)}50%{box-shadow:0 0 40px rgba(239,68,68,.5)}}
.lantern-body::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:20px;height:8px;background:#fbbf24;border-radius:2px}
.lantern-body::after{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:16px;height:12px;background:#fbbf24;border-radius:0 0 4px 4px}
.lantern-tassel{width:2px;height:16px;background:#fbbf24;margin:0 auto}
.lantern-name{font-size:.8rem;margin-top:8px;color:var(--text2)}
.quiz-score{display:flex;gap:20px;justify-content:center;margin-bottom:16px}
.score-item{text-align:center}
.score-num{font-size:1.5rem;font-weight:700}
.score-label{font-size:.75rem;color:var(--text2)}
.riddle-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.riddle-card:hover{border-color:var(--yellow)}
.riddle-q{font-weight:600;margin-bottom:8px;line-height:1.6}
.riddle-hint{color:var(--text2);font-size:.8rem;margin-bottom:8px}
.riddle-answer{display:none;color:var(--green);font-weight:600;font-size:1.1rem;margin-top:8px}
.riddle-answer.show{display:block}
.custom-list{display:flex;flex-direction:column;gap:10px}
.custom-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all var(--transition)}
.custom-item:hover{border-color:var(--blue)}
.custom-header{display:flex;align-items:center;gap:10px}
.custom-icon{font-size:1.5rem}
.custom-name{font-weight:600}
.custom-desc{color:var(--text2);font-size:.85rem;margin-top:4px}
.custom-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--text2);font-size:.85rem;line-height:1.6;display:none}
.custom-detail.show{display:block}
.timeline{position:relative;padding-left:30px}
.timeline-item{position:relative;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.timeline-item:last-child{border-bottom:none}
.timeline-dot{position:absolute;left:-30px;top:4px;width:12px;height:12px;background:var(--blue);border-radius:50%}
.timeline-era{font-weight:600;margin-bottom:4px}
.timeline-desc{color:var(--text2);font-size:.85rem;line-height:1.6}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div style="position:fixed;top:8px;right:8px;z-index:9999"><button class="btn btn-secondary" onclick="toggleTheme()" style="font-size:.8rem;padding:4px 10px" id="themeBtn">🌙 暗色</button></div>
<div class="container">
<h1>🏮 元宵节花灯与灯谜</h1>
<p class="sub">花灯展示 · 灯谜竞猜 · 元宵习俗 · 历史渊源</p>

<div class="card">
<div class="lantern-wrap" id="lanternWrap"></div>
</div>

<div class="tabs">
<button class="btn btn-primary" onclick="showTab('riddles')" id="tabRiddles">🧩 灯谜竞猜</button>
<button class="btn btn-secondary" onclick="showTab('lanterns')" id="tabLanterns">🏮 花灯类型</button>
<button class="btn btn-secondary" onclick="showTab('customs')" id="tabCustoms">🎊 习俗</button>
<button class="btn btn-secondary" onclick="showTab('history')" id="tabHistory">📖 历史</button>
</div>

<div id="riddlesView">
<div class="quiz-score">
<div class="score-item"><div class="score-num" id="correctCount" style="color:var(--green)">0</div><div class="score-label">答对</div></div>
<div class="score-item"><div class="score-num" id="totalCount">0</div><div class="score-label">已猜</div></div>
</div>
<div id="riddleList"></div>
</div>
<div id="lanternsView" class="hidden"></div>
<div id="customsView" class="hidden"><div class="custom-list" id="customList"></div></div>
<div id="historyView" class="hidden"><div class="card"><div class="timeline" id="timeline"></div></div></div>
</div>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script src="../i18n.js" defer></script>
<script>
var lanternTypes=[
{name:'宫灯',color:'#ef4444',desc:'皇宫贵族使用的华丽灯笼，造型精致，多为六角或八角形'},
{name:'纱灯',color:'#f59e0b',desc:'用薄纱制成的灯笼，透光性好，光线柔和'},
{name:'走马灯',color:'#3b82f6',desc:'灯内有旋转装置，利用热气流驱动图案旋转'},
{name:'莲花灯',color:'#ec4899',desc:'形状如莲花，是佛教常用的供灯'},
{name:'兔子灯',color:'#f3f4f6',desc:'儿童最喜爱的灯笼，造型可爱，可以拉着走'},
{name:'宫灯',color:'#dc2626',desc:'用竹篾扎架，蒙上绸布或纸，绘画精美图案'}
];
var riddles=[
{q:'麻屋子，红帐子，里面住着个白胖子。（打一食物）',hint:'想想花生的结构',ans:'花生'},
{q:'画时圆，写时方，冬时短，夏时长。（打一字）',hint:'和太阳有关',ans:'日'},
{q:'有头无颈，有眼无眉，无脚能走，有翅难飞。（打一动物）',hint:'生活在水里',ans:'鱼'},
{q:'兄弟七八个，围着柱子坐，大家一分手，衣服就扯破。（打一食物）',hint:'做饭常放',ans:'蒜'},
{q:'红口袋，绿口袋，有人怕，有人爱。（打一食物）',hint:'辣椒',ans:'辣椒'},
{q:'身穿绿衣裳，肚里水汪汪，生的子儿多，个个黑脸膛。（打一食物）',hint:'夏天常吃',ans:'西瓜'},
{q:'一物生得奇，耳朵比身大，一到大热天，躲在树下趴。（打一动物）',hint:'夏天会叫',ans:'知了/蝉'},
{q:'千条线，万条线，掉到水里看不见。（打一自然现象）',hint:'下雨',ans:'雨'},
{q:'兄弟圆圆住一屋，切开兄弟各走各路。（打一食物）',hint:'水果',ans:'橘子'},
{q:'远看山有色，近听水无声，春去花还在，人来鸟不惊。（打一艺术形式）',hint:'王维的诗',ans:'画'}
];
var customs=[
{name:'赏花灯',icon:'🏮',desc:'正月十五赏花灯，各式花灯争奇斗艳',detail:'元宵赏灯起源于汉代，到唐宋达到鼎盛。花灯种类繁多。现代灯会加入了声光电等现代技术。'},
{name:'猜灯谜',icon:'🧩',desc:'将谜语写在花灯上供人猜射',detail:'灯谜始于宋代，将谜面贴在花灯上，猜中者可获得奖品。'},
{name:'吃元宵',icon:'🥣',desc:'正月十五吃元宵或汤圆',detail:'元宵是"摇"出来的，汤圆是"包"出来的。北方叫元宵，南方叫汤圆。'},
{name:'舞龙舞狮',icon:'🐉',desc:'龙狮表演，祈求风调雨顺',detail:'舞龙舞狮是元宵节最重要的表演项目之一。'},
{name:'踩高跷',icon:'🎭',desc:'表演者踩着高跷进行各种表演',detail:'踩高跷是元宵节的传统民间表演，表演者脚踩木跷，做出各种惊险动作。'}
];
var historyData=[
{era:'汉代',desc:'元宵节起源于汉代，汉文帝为纪念平定诸吕之乱，将正月十五定为与民同乐日。汉武帝时开始祭祀"太一"。'},
{era:'隋唐',desc:'隋唐时期元宵灯会规模宏大，长安城内张灯结彩，取消宵禁，万民同乐。唐玄宗时期的灯轮高达二十丈。'},
{era:'宋代',desc:'宋代元宵灯会更加丰富多彩，出现了"灯谜"活动。花灯种类繁多，有琉璃灯、珠子灯、罗帛灯等。'},
{era:'明清',desc:'明清时期元宵灯会持续时间更长，从正月初八到正月十八。花灯工艺更加精湛，出现了许多著名的花灯产地。'},
{era:'现代',desc:'现代元宵节融合了传统与创新，各地举办大型灯会，运用LED、投影等新技术。吃元宵、赏花灯、猜灯谜仍是主要习俗。'}
];
var correct=0,total=0;

function renderLanterns(){
  var h='';lanternTypes.forEach(function(l){
    h+='<div class="lantern"><div class="lantern-body" style="background:linear-gradient(180deg,'+l.color+','+l.color+'cc)"></div><div class="lantern-tassel"></div><div class="lantern-name">'+l.name+'</div></div>';
  });document.getElementById('lanternWrap').innerHTML=h;
}

function showTab(tab){
  ['riddlesView','lanternsView','customsView','historyView'].forEach(function(v){document.getElementById(v).classList.add('hidden')});
  document.getElementById(tab+'View').classList.remove('hidden');
  ['tabRiddles','tabLanterns','tabCustoms','tabHistory'].forEach(function(id){document.getElementById(id).className='btn btn-secondary'});
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).className='btn btn-primary';
}

function renderRiddles(){
  var h='';
  riddles.forEach(function(r,i){
    h+='<div class="riddle-card" onclick="revealRiddle('+i+')">';
    h+='<div class="riddle-q">🏮 '+r.q+'</div>';
    h+='<div class="riddle-hint">💡 提示：'+r.hint+'</div>';
    h+='<div class="riddle-answer" id="ans-'+i+'">答案：'+r.ans+'</div></div>';
  });
  document.getElementById('riddleList').innerHTML=h;
}

function revealRiddle(i){
  var el=document.getElementById('ans-'+i);
  if(!el.classList.contains('show')){
    el.classList.add('show');total++;
    if(riddles[i].ans.includes('花')||riddles[i].ans.includes('日')||riddles[i].ans.includes('鱼')||riddles[i].ans.length<=3)correct++;
    document.getElementById('correctCount').textContent=correct;
    document.getElementById('totalCount').textContent=total;
  }
}

function renderCustoms(){
  var h='';
  customs.forEach(function(c,i){
    h+='<div class="custom-item" onclick="toggleDetail('+i+')">';
    h+='<div class="custom-header"><span class="custom-icon">'+c.icon+'</span><div><div class="custom-name">'+c.name+'</div><div class="custom-desc">'+c.desc+'</div></div></div>';
    h+='<div class="custom-detail" id="cd-'+i+'">'+c.detail+'</div></div>';
  });
  document.getElementById('customList').innerHTML=h;
}

function toggleDetail(idx){var el=document.getElementById('cd-'+idx);if(el)el.classList.toggle('show')}

function renderHistory(){
  var h='';
  historyData.forEach(function(d){
    h+='<div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-era">'+d.era+'</div><div class="timeline-desc">'+d.desc+'</div></div>';
  });
  document.getElementById('timeline').innerHTML=h;
}

function toggleTheme(){
  var html=document.documentElement;var isLight=html.getAttribute('data-theme')==='light';
  html.setAttribute('data-theme',isLight?'dark':'light');
  document.getElementById('themeBtn').textContent=isLight?'☀️ 亮色':'🌙 暗色';
}

renderLanterns();renderRiddles();renderCustoms();renderHistory();
window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});
</script>
</body>
</html>
