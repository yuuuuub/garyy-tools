<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>密码强度检测器</title><meta name="description" content="密码强度检测器 - 在线检测密码强度"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#f59e0b;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;font-family:monospace}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.strength-meter{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:10px 0}.strength-bar{height:100%;transition:width .3s,background .3s}.strength-text{font-size:.9rem;font-weight:600;margin:8px 0}.strength-details{margin-top:12px}.detail-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}.detail-label{color:var(--text2);font-size:.85rem}.detail-value{font-weight:500;font-size:.85rem}.check{color:var(--green)}.cross{color:var(--red)}.tips{margin-top:16px;padding:12px;background:var(--bg);border-radius:8px;font-size:.85rem;color:var(--text2)}.tips ul{margin:8px 0;padding-left:20px}.tips li{margin:4px 0}
/* === Smooth Animations === */
@keyframes animFadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes animScaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
body, .container, main, .container-fluid, .wrapper {
  animation: animFadeIn .45s ease-out both;
}
.weather-card, .word-card, .result-card, .output-card, .info-card,
.card, [class*="card"], [class*="panel"], [class*="result"], [class*="output"],
[class*="detail"], [class*="item"], [class*="section"]:not(header):not(nav),
[class*="box"]:not(.search-box) {
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.weather-card:hover, .word-card:hover, .result-card:hover, .output-card:hover,
.info-card:hover, .card:hover, [class*="card"]:hover, [class*="panel"]:hover,
[class*="result"]:hover, [class*="output"]:hover, [class*="detail"]:hover,
[class*="item"]:hover, [class*="box"]:not(.search-box):hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(0,0,0,.12);
}
button, input[type="submit"], .btn, [class*="btn"], .search-box button,
.filter-btn, .refresh-btn, .retry-btn {
  transition: transform .12s ease, opacity .2s ease, background .2s ease, box-shadow .2s ease;
}
button:active, input[type="submit"]:active, .btn:active, [class*="btn"]:active,
.search-box button:active, .filter-btn:active, .refresh-btn:active, .retry-btn:active {
  transform: scale(.96);
  opacity: .88;
}
button:hover, .btn:hover, [class*="btn"]:hover {
  box-shadow: 0 2px 8px rgba(59,130,246,.18);
}
html { scroll-behavior: smooth; }
.coin-item { transition: transform .2s ease, box-shadow .2s ease; }
.coin-item:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.city-item { transition: transform .2s ease, background .2s ease, border-color .2s ease; }
.city-item:hover { transform: translateX(4px); }
input[type="text"], input[type="number"], textarea, select {
  transition: border-color .2s ease, box-shadow .2s ease;
}
input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}
/* end animations */

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="密码强度检测器"><meta property="og:description" content="密码强度检测器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔒 密码强度检测器</h1><p class="sub">在线检测密码强度</p>
<div class="card">
<div class="input-group">
<label>输入密码</label>
<input type="password" id="passwordInput" placeholder="输入要检测的密码" oninput="checkPassword()">
</div>
<div class="input-group">
<label>显示密码</label>
<input type="checkbox" id="showPassword" onchange="togglePassword()">
</div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function togglePassword(){
  var input=document.getElementById('passwordInput');
  var checkbox=document.getElementById('showPassword');
  input.type=checkbox.checked?'text':'password';
}
function checkPassword(){
  var password=document.getElementById('passwordInput').value;
  var r=document.getElementById('result');
  if(!password){r.innerHTML='';return;}
  var score=0;
  var checks={
    length:password.length>=8,
    uppercase:/[A-Z]/.test(password),
    lowercase:/[a-z]/.test(password),
    numbers:/[0-9]/.test(password),
    special:/[^A-Za-z0-9]/.test(password),
    noRepeats:!/(.)\1{2,}/.test(password),
    noSequential:!/(?:abc|bcd|cde|def|efg|fgh|ghi|hij|ijk|jkl|klm|lmn|mno|nop|opq|pqr|qrs|rst|stu|tuv|uvw|vwx|wxy|xyz|012|123|234|345|456|567|678|789)/i.test(password),
    longEnough:password.length>=12
  };
  if(checks.length)score+=1;
  if(checks.uppercase)score+=1;
  if(checks.lowercase)score+=1;
  if(checks.numbers)score+=1;
  if(checks.special)score+=2;
  if(checks.noRepeats)score+=1;
  if(checks.noSequential)score+=1;
  if(checks.longEnough)score+=1;
  var strength='';
  var color='';
  var width='';
  if(score<=2){strength='弱';color='var(--red)';width='25%';}
  else if(score<=4){strength='中等';color='var(--yellow)';width='50%';}
  else if(score<=6){strength='强';color='var(--blue)';width='75%';}
  else{strength='非常强';color='var(--green)';width='100%';}
  var html='<div class="card">';
  html+='<div class="strength-meter"><div class="strength-bar" style="width:'+width+';background:'+color+'"></div></div>';
  html+='<div class="strength-text" style="color:'+color+'">'+strength+'</div>';
  html+='<div class="strength-details">';
  html+='<div class="detail-row"><span class="detail-label">长度</span><span class="detail-value '+(checks.length?'check':'cross')+'">'+password.length+' 个字符</span></div>';
  html+='<div class="detail-row"><span class="detail-label">包含大写字母</span><span class="detail-value '+(checks.uppercase?'check':'cross')+'">'+(checks.uppercase?'✓':'✗')+'</span></div>';
  html+='<div class="detail-row"><span class="detail-label">包含小写字母</span><span class="detail-value '+(checks.lowercase?'check':'cross')+'">'+(checks.lowercase?'✓':'✗')+'</span></div>';
  html+='<div class="detail-row"><span class="detail-label">包含数字</span><span class="detail-value '+(checks.numbers?'check':'cross')+'">'+(checks.numbers?'✓':'✗')+'</span></div>';
  html+='<div class="detail-row"><span class="detail-label">包含特殊字符</span><span class="detail-value '+(checks.special?'check':'cross')+'">'+(checks.special?'✓':'✗')+'</span></div>';
  html+='<div class="detail-row"><span class="detail-label">无重复字符</span><span class="detail-value '+(checks.noRepeats?'check':'cross')+'">'+(checks.noRepeats?'✓':'✗')+'</span></div>';
  html+='<div class="detail-row"><span class="detail-label">无连续字符</span><span class="detail-value '+(checks.noSequential?'check':'cross')+'">'+(checks.noSequential?'✓':'✗')+'</span></div>';
  html+='<div class="detail-row"><span class="detail-label">长度≥12</span><span class="detail-value '+(checks.longEnough?'check':'cross')+'">'+(checks.longEnough?'✓':'✗')+'</span></div>';
  html+='</div>';
  html+='<div class="tips"><strong>密码安全建议：</strong><ul>';
  html+='<li>至少使用8个字符，推荐12个以上</li>';
  html+='<li>混合使用大小写字母、数字和特殊字符</li>';
  html+='<li>避免使用连续字符（如123、abc）</li>';
  html+='<li>避免使用重复字符（如aaa、111）</li>';
  html+='<li>不要使用常见密码或个人信息</li>';
  html+='</ul></div>';
  html+='</div>';
  r.innerHTML=html;
}
checkPassword();
</script></body></html>
