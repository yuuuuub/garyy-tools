<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="响应式测试工具 - 测试网页响应式设计">
    <meta name="robots" content="index, follow">
    <title>响应式测试工具</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #dee2e6;
            --card-bg: #f8f9fa;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #444444;
            --card-bg: #2d2d2d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-family: monospace;
            resize: vertical;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
        }
        .device-frame {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin: 10px 0;
            background: white;
        }
        .device-header {
            background: var(--secondary-color);
            color: white;
            padding: 8px;
            text-align: center;
            font-size: 14px;
        }
        .device-content {
            padding: 10px;
            min-height: 300px;
        }
        .devices {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .device {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        .preset-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .preset-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>响应式测试工具</h1>
        <p>输入HTML代码测试不同设备下的显示效果</p>
        
        <div class="form-group">
            <label for="htmlInput">HTML代码:</label>
            <textarea id="htmlInput" rows="10" placeholder="粘贴HTML代码..."></textarea>
        </div>
        
        <div class="form-group">
            <label>预设设备:</label>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="setDevice(375, 667)">iPhone SE</button>
                <button class="preset-btn" onclick="setDevice(414, 896)">iPhone XR</button>
                <button class="preset-btn" onclick="setDevice(390, 844)">iPhone 12</button>
                <button class="preset-btn" onclick="setDevice(360, 800)">Pixel 5</button>
                <button class="preset-btn" onclick="setDevice(412, 915)">Pixel 6</button>
                <button class="preset-btn" onclick="setDevice(768, 1024)">iPad</button>
                <button class="preset-btn" onclick="setDevice(1024, 768)">iPad Landscape</button>
                <button class="preset-btn" onclick="setDevice(1280, 800)">Laptop</button>
                <button class="preset-btn" onclick="setDevice(1920, 1080)">Desktop</button>
            </div>
        </div>
        
        <button onclick="runTest()">开始测试</button>
        
        <div id="result" class="result" style="display: none;">
            <h2>测试结果</h2>
            <div id="devices" class="devices"></div>
        </div>
    </div>

    <script src="i18n.js" defer></script>
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            html.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
        }

        function setDevice(width, height) {
            document.getElementById('htmlInput').setAttribute('data-width', width);
            document.getElementById('htmlInput').setAttribute('data-height', height);
            runTest();
        }

        function runTest() {
            const htmlInput = document.getElementById('htmlInput').value;
            
            if (!htmlInput) {
                alert('请输入HTML代码');
                return;
            }
            
            const devices = [
                { name: 'iPhone SE (375x667)', width: 375, height: 667 },
                { name: 'iPhone XR (414x896)', width: 414, height: 896 },
                { name: 'iPhone 12 (390x844)', width: 390, height: 844 },
                { name: 'Pixel 5 (360x800)', width: 360, height: 800 },
                { name: 'Pixel 6 (412x915)', width: 412, height: 915 },
                { name: 'iPad (768x1024)', width: 768, height: 1024 },
                { name: 'iPad Landscape (1024x768)', width: 1024, height: 768 },
                { name: 'Laptop (1280x800)', width: 1280, height: 800 },
                { name: 'Desktop (1920x1080)', width: 1920, height: 1080 }
            ];
            
            // 检查是否有自定义尺寸
            const customWidth = document.getElementById('htmlInput').getAttribute('data-width');
            const customHeight = document.getElementById('htmlInput').getAttribute('data-height');
            if (customWidth && customHeight) {
                devices.unshift({
                    name: `自定义 (${customWidth}x${customHeight})`,
                    width: parseInt(customWidth),
                    height: parseInt(customHeight)
                });
            }
            
            const devicesDiv = document.getElementById('devices');
            devicesDiv.innerHTML = '';
            
            devices.forEach(device => {
                const scale = Math.min(1, 350 / device.width);
                const frameWidth = device.width * scale;
                const frameHeight = device.height * scale;
                
                const deviceDiv = document.createElement('div');
                deviceDiv.className = 'device';
                deviceDiv.innerHTML = `
                    <div class="device-frame" style="width: ${frameWidth}px; height: ${frameHeight + 40}px;">
                        <div class="device-header">${device.name}</div>
                        <div class="device-content" style="width: ${frameWidth}px; height: ${frameHeight}px; overflow: hidden;">
                            <iframe srcdoc="${htmlInput.replace(/"/g, '&quot;')}" 
                                    style="width: ${device.width}px; height: ${device.height}px; transform: scale(${scale}); transform-origin: top left; border: none;"></iframe>
                        </div>
                    </div>
                `;
                devicesDiv.appendChild(deviceDiv);
            });
            
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
