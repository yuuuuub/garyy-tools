<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 Ikigai 发现器</title>
<meta name="description" content="Ikigai人生意义发现工具，找到你热爱、擅长、需要且能获得回报的交汇点">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.ikigai-circles{position:relative;width:100%;max-width:400px;margin:20px auto;aspect-ratio:1}
.ikigai-circle{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;text-align:center;opacity:.7;transition:all .3s;cursor:pointer}
.ikigai-circle:hover{opacity:1;transform:scale(1.05)}
.circle-love{width:55%;height:55%;top:5%;left:5%;background:rgba(239,68,68,.2);border:2px solid #ef4444;color:#ef4444}
.circle-good{width:55%;height:55%;top:5%;right:5%;background:rgba(59,130,246,.2);border:2px solid #3b82f6;color:#3b82f6}
.circle-world{width:55%;height:55%;bottom:5%;left:5%;background:rgba(34,197,94,.2);border:2px solid #22c55e;color:#22c55e}
.circle-paid{width:55%;height:55%;bottom:5%;right:5%;background:rgba(245,158,11,.2);border:2px solid #f59e0b;color:#f59e0b}
.ikigai-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:25%;height:25%;border-radius:50%;background:rgba(139,92,246,.3);border:2px solid #8b5cf6;display:flex;align-items:center;justify-content:center;font-weight:700;color:#8b5cf6;font-size:.7rem;text-align:center}
.item-list{list-style:none;padding:0}
.item-list li{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:.9rem}
.item-list li:last-child{border-bottom:none}
.item-list .del{cursor:pointer;color:var(--danger)}
.result-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;margin-top:12px}
.result-box .ikigai-text{font-size:1.2rem;font-weight:700;color:var(--accent);margin:8px 0}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🎯 Ikigai 发现器">
<meta property="og:description" content="Ikigai人生意义发现工具">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🎯 Ikigai 发现器</h1><p>找到你的人生意义——你热爱、擅长、世界需要且能获得回报的交汇点</p></div>

<div class="cd"><h2>🔴 你热爱什么？</h2>
<p style="font-size:.85rem;color:var(--text2);margin-bottom:8px">什么事情让你忘记时间？什么让你感到兴奋和充实？</p>
<div id="loveList"></div>
<div class="bg"><input type="text" id="loveInput" placeholder="添加你热爱的事物..." style="margin:0;flex:1"><button onclick="addItem('love')">添加</button></div></div>

<div class="cd"><h2>🔵 你擅长什么？</h2>
<p style="font-size:.85rem;color:var(--text2);margin-bottom:8px">你有什么技能？别人经常夸你什么？什么事情你做得比别人好？</p>
<div id="goodList"></div>
<div class="bg"><input type="text" id="goodInput" placeholder="添加你擅长的事物..." style="margin:0;flex:1"><button onclick="addItem('good')">添加</button></div></div>

<div class="cd"><h2>🟢 世界需要什么？</h2>
<p style="font-size:.85rem;color:var(--text2);margin-bottom:8px">你希望解决什么问题？你能为他人提供什么价值？</p>
<div id="worldList"></div>
<div class="bg"><input type="text" id="worldInput" placeholder="添加世界需要的事物..." style="margin:0;flex:1"><button onclick="addItem('world')">添加</button></div></div>

<div class="cd"><h2>🟡 什么能获得回报？</h2>
<p style="font-size:.85rem;color:var(--text2);margin-bottom:8px">什么事情你可以因此获得收入？市场对什么有需求？</p>
<div id="paidList"></div>
<div class="bg"><input type="text" id="paidInput" placeholder="添加能获得回报的事物..." style="margin:0;flex:1"><button onclick="addItem('paid')">添加</button></div></div>

<div class="cd"><h2>🎯 Ikigai 可视化</h2>
<div class="ikigai-circles">
<div class="ikigai-circle circle-love" id="cLove">热爱</div>
<div class="ikigai-circle circle-good" id="cGood">擅长</div>
<div class="ikigai-circle circle-world" id="cWorld">世界需要</div>
<div class="ikigai-circle circle-paid" id="cPaid">获得回报</div>
<div class="ikigai-center" id="cCenter">Ikigai</div>
</div>
<div class="bg"><button onclick="generateResult()">生成我的 Ikigai 分析</button></div>
<div id="resultArea"></div></div>

<div class="cd"><h2>📊 统计</h2><div id="stats"></div>
<div class="bg"><button class="sec" onclick="clearAll()">清空全部</button></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let data=JSON.parse(localStorage.getItem('ik_data')||'{"love":[],"good":[],"world":[],"paid":[]}');

function save(){localStorage.setItem('ik_data',JSON.stringify(data))}

function addItem(cat){
  const input=$(`${cat}Input`),val=input.value.trim();
  if(!val){alert('请输入内容');return}
  data[cat].push(val);save();input.value='';render();
}

function removeItem(cat,idx){data[cat].splice(idx,1);save();render()}

function render(){
  ['love','good','world','paid'].forEach(cat=>{
    const el=$(`${cat}List`);
    if(!data[cat].length){el.innerHTML='<div style="color:var(--text2);font-size:.85rem;padding:8px">暂无内容</div>';return}
    el.innerHTML=`<ul class="item-list">${data[cat].map((item,i)=>`<li>${item}<span class="del" onclick="removeItem('${cat}',${i})">✕</span></li>`).join('')}</ul>`;
  });
  updateCircles();updateStats();
}

function updateCircles(){
  const d=data;
  $('cLove').innerHTML=d.love.length?`❤️ 热爱<br><small>${d.love.length}项</small>`:'❤️ 热爱';
  $('cGood').innerHTML=d.good.length?`💪 擅长<br><small>${d.good.length}项</small>`:'💪 擅长';
  $('cWorld').innerHTML=d.world.length?`🌍 世界需要<br><small>${d.world.length}项</small>`:'🌍 世界需要';
  $('cPaid').innerHTML=d.paid.length?`💰 回报<br><small>${d.paid.length}项</small>`:'💰 回报';
  const hasCenter=d.love.length&&d.good.length&&d.world.length&&d.paid.length;
  $('cCenter').innerHTML=hasCenter?'✨ 你的<br>Ikigai':'Ikigai';
  $('cCenter').style.background=hasCenter?'rgba(139,92,246,.5)':'rgba(139,92,246,.3)';
}

function generateResult(){
  const d=data;
  if(!d.love.length||!d.good.length||!d.world.length||!d.paid.length){alert('每个维度至少添加一项内容');return}
  const loveGood=d.love.filter(x=>d.good.includes(x));
  const goodPaid=d.good.filter(x=>d.paid.includes(x));
  const worldPaid=d.world.filter(x=>d.paid.includes(x));
  const loveWorld=d.love.filter(x=>d.world.includes(x));
  let result='<div class="result-box"><h3 style="color:var(--accent)">你的 Ikigai 分析</h3>';
  result+='<div style="text-align:left;margin-top:16px">';
  result+='<p><strong style="color:#ef4444">❤️ 你热爱的：</strong>'+d.love.join('、')+'</p>';
  result+='<p><strong style="color:#3b82f6">💪 你擅长的：</strong>'+d.good.join('、')+'</p>';
  result+='<p><strong style="color:#22c55e">🌍 世界需要的：</strong>'+d.world.join('、')+'</p>';
  result+='<p><strong style="color:#f59e0b">💰 能获得回报的：</strong>'+d.paid.join('、')+'</p>';
  if(loveGood.length)result+='<p style="margin-top:12px;color:var(--success)">✨ <strong>热爱+擅长：</strong>'+loveGood.join('、')+'</p>';
  if(goodPaid.length)result+='<p style="color:var(--accent)">✨ <strong>擅长+回报：</strong>'+goodPaid.join('、')+'</p>';
  if(worldPaid.length)result+='<p style="color:var(--warn)">✨ <strong>世界需要+回报：</strong>'+worldPaid.join('、')+'</p>';
  if(loveWorld.length)result+='<p style="color:#8b5cf6">✨ <strong>热爱+世界需要：</strong>'+loveWorld.join('、')+'</p>';
  result+='</div></div>';
  $('resultArea').innerHTML=result;
}

function updateStats(){
  const total=data.love.length+data.good.length+data.world.length+data.paid.length;
  $('stats').innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center"><div><div style="font-size:1.3rem;font-weight:700;color:#ef4444">${data.love.length}</div><div style="font-size:.75rem;color:var(--text2)">热爱</div></div><div><div style="font-size:1.3rem;font-weight:700;color:#3b82f6">${data.good.length}</div><div style="font-size:.75rem;color:var(--text2)">擅长</div></div><div><div style="font-size:1.3rem;font-weight:700;color:#22c55e">${data.world.length}</div><div style="font-size:.75rem;color:var(--text2)">世界需要</div></div><div><div style="font-size:1.3rem;font-weight:700;color:#f59e0b">${data.paid.length}</div><div style="font-size:.75rem;color:var(--text2)">回报</div></div></div>`;
}

function clearAll(){if(!confirm('确定清空全部数据？'))return;data={love:[],good:[],world:[],paid:[]};save();render()}
render();
</script>
</body>
</html>
