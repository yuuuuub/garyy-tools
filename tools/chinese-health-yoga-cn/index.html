<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧘 瑜伽养生</title>
<meta property="og:title" content="🧘 瑜伽养生">
<meta property="og:description" content="中式瑜伽养生体式，适合初学者的养生瑜伽动作 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="中式瑜伽养生体式，适合初学者的养生瑜伽动作">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filter-btn{padding:6px 12px;border:1px solid var(--border);border-radius:16px;background:var(--bg);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.seq-item{padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;background:var(--bg)}
.seq-item .remove{color:var(--danger);cursor:pointer;font-size:1.2rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧘</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div class="ctn">
<div class="hdr">
<h1>🧘 瑜伽养生</h1>
<p>中式瑜伽养生体式，适合初学者的养生瑜伽动作</p>
</div>

<div class="cd" id="poseListView">
<h2>🧘 体式列表</h2>
<div class="filter-bar">
<button class="filter-btn active" onclick="filterDiff('all')">全部</button>
<button class="filter-btn" onclick="filterDiff('初级')">初级</button>
<button class="filter-btn" onclick="filterDiff('中级')">中级</button>
<button class="filter-btn" onclick="filterDiff('高级')">高级</button>
</div>
<div class="filter-bar">
<button class="filter-btn active" onclick="filterArea('all')">全身</button>
<button class="filter-btn" onclick="filterArea('上肢')">上肢</button>
<button class="filter-btn" onclick="filterArea('下肢')">下肢</button>
<button class="filter-btn" onclick="filterArea('脊柱')">脊柱</button>
<button class="filter-btn" onclick="filterArea('核心')">核心</button>
</div>
<div id="poseList"></div>
</div>

<div class="cd" id="poseDetailView" style="display:none">
<button class="sec" onclick="showPoseList()" style="margin-bottom:16px">← 返回</button>
<h2 id="poseName"></h2>
<p id="poseSanskrit" style="color:var(--text2);font-style:italic;margin:4px 0"></p>
<div style="display:flex;gap:8px;margin:12px 0">
<span class="tag" id="poseDiff"></span>
<span class="tag s" id="poseArea"></span>
</div>
<div style="margin:16px 0">
<h4 style="font-size:.9rem;margin-bottom:8px">🎯 功效</h4>
<p id="poseBenefits" style="padding:12px;background:var(--bg);border-radius:8px;line-height:1.6"></p>
</div>
<div style="margin:16px 0">
<h4 style="font-size:.9rem;margin-bottom:8px">📋 步骤</h4>
<div id="poseSteps"></div>
</div>
<div style="margin:16px 0">
<h4 style="font-size:.9rem;margin-bottom:8px">🌬️ 呼吸要领</h4>
<p id="poseBreath" style="padding:12px;background:var(--bg);border-radius:8px"></p>
</div>
<div style="margin:16px 0">
<h4 style="font-size:.9rem;margin-bottom:8px">⏱️ 建议时长</h4>
<p id="poseDuration" style="padding:12px;background:var(--bg);border-radius:8px"></p>
</div>
<div style="display:flex;gap:8px;margin-top:16px">
<button onclick="addToSequence()" id="addSeqBtn">加入序列</button>
<button class="sec" onclick="nextPose()">下一式 →</button>
</div>
</div>

<div class="cd" id="sequenceView" style="display:none">
<h2>📝 自定义序列</h2>
<div id="seqList"></div>
<div id="seqEmpty" class="empty">暂无序列，请从体式列表中添加</div>
<div style="margin-top:16px;text-align:center">
<button onclick="startSequence()" id="startSeqBtn" style="display:none">开始序列练习</button>
<button class="sec" onclick="clearSequence()" style="margin-top:8px">清空序列</button>
</div>
</div>

<div class="cd" id="practiceView" style="display:none">
<h2>🎯 序列练习</h2>
<p id="practicePose" style="font-size:1.3rem;font-weight:600;color:var(--accent);text-align:center;margin:16px 0"></p>
<p id="practiceSanskrit" style="text-align:center;color:var(--text2);font-style:italic"></p>
<p id="practiceStep" style="text-align:center;margin:16px 0;padding:12px;background:var(--bg);border-radius:8px"></p>
<p id="practiceTimer" style="text-align:center;font-size:2rem;font-weight:700;margin:16px 0"></p>
<div style="display:flex;gap:8px;justify-content:center">
<button onclick="practicePrev()">上一式</button>
<button onclick="practiceNext()">下一式</button>
</div>
<div style="text-align:center;margin-top:12px">
<button class="sec" onclick="endPractice()">结束练习</button>
</div>
</div>

<div class="cd" id="logView" style="display:none">
<h2>📊 练习记录</h2>
<div id="logStats" style="display:flex;gap:12px;margin-bottom:16px"></div>
<div id="logList"></div>
</div>

<div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
<button class="sec" onclick="showView('poseListView')">🧘 体式</button>
<button class="sec" onclick="showView('sequenceView')">📝 序列</button>
<button class="sec" onclick="showView('logView')">📊 记录</button>
</div>
</div>

<script>
const POSES = [
  {name:'山式',sanskrit:'Tadasana',diff:'初级',area:'全身',benefits:'改善体态，增强腿部力量，培养平衡感和专注力。是所有站立体式的基础。',steps:['双脚并拢站立','体重均匀分布在两脚','收紧大腿肌肉，上提膝盖骨','收紧腹部，尾骨下沉','肩膀向后向下放松','头顶向上延伸','双手自然垂于体侧','保持5-10次呼吸'],breath:'自然呼吸，吸气时脊柱向上延伸，呼气时肩膀放松下沉。',duration:'保持30秒-1分钟'},
  {name:'树式',sanskrit:'Vrksasana',diff:'初级',area:'下肢',benefits:'增强腿部力量和平衡能力，改善体态，培养专注力。',steps:['山式站立','重心移至左脚','右脚抬起，脚掌贴左大腿内侧','双手胸前合十','保持平衡，目光注视前方一点','双手向上延伸','保持5-8次呼吸','换另一侧重复'],breath:'吸气时双手向上延伸，呼气时肩膀放松。保持平稳的呼吸节奏。',duration:'每侧保持30秒-1分钟'},
  {name:'猫牛式',sanskrit:'Marjaryasana-Bitilasana',diff:'初级',area:'脊柱',benefits:'灵活脊柱，缓解背部疼痛，按摩腹部器官，改善消化。',steps:['四足跪姿，手腕在肩下，膝盖在臀下','吸气：抬头，塌腰，翘臀（牛式）','呼气：低头，拱背，收腹（猫式）','配合呼吸缓慢流动','重复10-15次'],breath:'吸气时做牛式，呼气时做猫式。呼吸要深长缓慢。',duration:'重复10-15次'},
  {name:'下犬式',sanskrit:'Adho Mukha Svanasana',diff:'初级',area:'全身',benefits:'伸展全身，强化手臂和腿部力量，改善血液循环，缓解疲劳。',steps:['四足跪姿','脚尖点地，臀部向上推','身体呈倒V字形','双手与肩同宽，手指张开','脚跟尽量踩地','头部自然下垂','保持5-8次呼吸'],breath:'深长的腹式呼吸，每次呼气时尝试脚跟更贴近地面。',duration:'保持30秒-1分钟'},
  {name:'婴儿式',sanskrit:'Balasana',diff:'初级',area:'脊柱',benefits:'放松背部和肩膀，缓解压力和焦虑，轻柔按摩腹部器官。',steps:['跪坐在脚跟上','双膝分开与垫子同宽','上身向前折叠','额头贴地','手臂向前延伸或放在体侧','深呼吸，放松全身','保持1-5分钟'],breath:'深长缓慢的腹式呼吸，感受背部的起伏。',duration:'保持1-5分钟'},
  {name:'战士一式',sanskrit:'Virabhadrasana I',diff:'中级',area:'下肢',benefits:'增强腿部力量，打开髋部和胸部，改善平衡和稳定性。',steps:['山式站立','右脚向后迈一大步','左膝弯曲90度','后腿伸直，脚跟踩地','髋部摆正朝前','双手向上延伸','目光看向双手','保持5-8次呼吸'],breath:'吸气时双手向上延伸，呼气时髋部下沉加深体式。',duration:'每侧保持30秒-1分钟'},
  {name:'战士二式',sanskrit:'Virabhadrasana II',diff:'中级',area:'下肢',benefits:'增强腿部耐力，打开髋部，锻炼核心力量，提升专注力。',steps:['山式站立','右脚向后迈一大步','左膝弯曲90度','双臂向两侧伸展','目光看向左手','后腿伸直有力','保持5-8次呼吸'],breath:'保持均匀的呼吸，吸气时延伸手臂，呼气时加深体式。',duration:'每侧保持30秒-1分钟'},
  {name:'三角式',sanskrit:'Trikonasana',diff:'中级',area:'下肢',benefits:'伸展腿部和侧腰，增强核心力量，改善消化和平衡。',steps:['双脚分开约一腿长','右脚向外转90度','双臂向两侧伸展','身体向右侧弯曲','右手放在小腿或脚踝上','左手指向天空','目光看向左手','保持5-8次呼吸'],breath:'吸气时延伸脊柱，呼气时加深侧弯。',duration:'每侧保持30秒-1分钟'},
  {name:'桥式',sanskrit:'Setu Bandhasana',diff:'初级',area:'核心',benefits:'强化背部和臀部肌肉，打开胸部，缓解背部疼痛，改善消化。',steps:['仰卧，屈膝，双脚平放地面','双脚与臀同宽','双手放在身体两侧','吸气，臀部向上推','双手在身下十指交扣','保持5-8次呼吸','呼气，慢慢放下身体'],breath:'吸气时臀部向上推，呼气时保持或加深体式。',duration:'保持30秒-1分钟'},
  {name:'眼镜蛇式',sanskrit:'Bhujangasana',diff:'初级',area:'脊柱',benefits:'强化脊柱肌肉，打开胸部，改善姿势，缓解背部疼痛。',steps:['俯卧，双手放在胸部两侧','吸气，用手臂力量抬起上身','手肘微曲，肩膀下沉','髋部贴地','目光向上或向前','保持5-8次呼吸','呼气，慢慢放下身体'],breath:'吸气时抬起上身，呼气时保持或加深体式。',duration:'保持15-30秒'},
  {name:'坐角式',sanskrit:'Upavistha Konasana',diff:'中级',area:'下肢',benefits:'伸展大腿内侧和腹股沟，刺激腹部器官，缓解压力。',steps:['坐在地上，双腿尽量分开','脚尖回勾','吸气，脊柱向上延伸','呼气，上身向前折叠','双手向前延伸','保持5-8次呼吸'],breath:'吸气时延伸脊柱，呼气时加深前屈。',duration:'保持1-3分钟'},
  {name:'莲花式',sanskrit:'Padmasana',diff:'高级',area:'下肢',benefits:'冥想最佳坐姿，打开髋部，缓解腿部紧张，培养内心平静。',steps:['坐在地上','将右脚放在左大腿上','将左脚放在右大腿上','双手放在膝盖上','脊柱挺直','肩膀放松','闭眼冥想'],breath:'自然呼吸，专注于呼吸的节奏。',duration:'保持5-20分钟'}
];

const TIPS = ['初学者从初级体式开始','练习前空腹2-3小时','穿着舒适透气的衣物','使用瑜伽垫保护关节','不要强迫身体超出极限','呼吸是瑜伽的核心','持之以恒才能见效'];

let poses=POSES;
let seq=JSON.parse(localStorage.getItem('yoga_seq')||'[]');
let logs=JSON.parse(localStorage.getItem('yoga_logs')||'[]');
let currentPoseIdx=0;
let practiceSeq=null;
let practiceIdx=0;
let practiceTimer=null;
let practiceRemaining=0;
let filterD='all',filterA='all';

function showView(id){
  ['poseListView','poseDetailView','sequenceView','practiceView','logView'].forEach(v=>document.getElementById(v).style.display='none');
  document.getElementById(id).style.display='block';
  if(id==='logView') renderLogs();
  if(id==='sequenceView') renderSeq();
}

function filterDiff(d){
  filterD=d;
  document.querySelectorAll('.filter-bar:first-of-type .filter-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  renderPoses();
}

function filterArea(a){
  filterA=a;
  document.querySelectorAll('.filter-bar:nth-of-type(2) .filter-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  renderPoses();
}

function renderPoses(){
  let filtered=POSES;
  if(filterD!=='all') filtered=filtered.filter(p=>p.diff===filterD);
  if(filterA!=='all') filtered=filtered.filter(p=>p.area===filterA);
  document.getElementById('poseList').innerHTML=filtered.map((p,i)=>{
    const idx=POSES.indexOf(p);
    return `<div class="li" onclick="showPose(${idx})">
      <div><strong>${p.name}</strong> <span style="color:var(--text2);font-size:.8rem">${p.sanskrit}</span><br><span style="color:var(--text2);font-size:.8rem">${p.area}</span></div>
      <span class="tag ${p.diff==='初级'?'s':p.diff==='中级'?'w':'d'}">${p.diff}</span>
    </div>`;
  }).join('');
}

function showPoseList(){showView('poseListView');renderPoses();}

function showPose(idx){
  currentPoseIdx=idx;
  const p=POSES[idx];
  document.getElementById('poseName').textContent=p.name;
  document.getElementById('poseSanskrit').textContent=p.sanskrit;
  document.getElementById('poseDiff').textContent=p.diff;
  document.getElementById('poseArea').textContent=p.area;
  document.getElementById('poseBenefits').textContent=p.benefits;
  document.getElementById('poseSteps').innerHTML=p.steps.map((s,i)=>`<div class="li"><div><strong>${i+1}.</strong> ${s}</div></div>`).join('');
  document.getElementById('poseBreath').textContent=p.breath;
  document.getElementById('poseDuration').textContent=p.duration;
  showView('poseDetailView');
}

function nextPose(){
  if(currentPoseIdx<POSES.length-1) showPose(currentPoseIdx+1);
}

function addToSequence(){
  if(!seq.find(s=>s.name===POSES[currentPoseIdx].name)){
    seq.push(POSES[currentPoseIdx]);
    localStorage.setItem('yoga_seq',JSON.stringify(seq));
    alert('已加入序列！');
  } else {
    alert('已在序列中');
  }
}

function renderSeq(){
  document.getElementById('seqList').innerHTML=seq.map((s,i)=>`
    <div class="seq-item">
      <span>${i+1}. ${s.name}</span>
      <span class="remove" onclick="removeSeq(${i})">×</span>
    </div>
  `).join('');
  document.getElementById('seqEmpty').style.display=seq.length?'none':'block';
  document.getElementById('startSeqBtn').style.display=seq.length?'inline-block':'none';
}

function removeSeq(i){
  seq.splice(i,1);
  localStorage.setItem('yoga_seq',JSON.stringify(seq));
  renderSeq();
}

function clearSequence(){
  seq=[];
  localStorage.setItem('yoga_seq',JSON.stringify(seq));
  renderSeq();
}

function startSequence(){
  practiceSeq=[...seq];
  practiceIdx=0;
  startPractice();
}

function startPractice(){
  showView('practiceView');
  showPracticePose();
  practiceTimer=setInterval(()=>{
    practiceRemaining--;
    if(practiceRemaining<=0){
      if(practiceIdx<practiceSeq.length-1){
        practiceIdx++;
        showPracticePose();
      } else {
        endPractice();
      }
    }
    updatePracticeTimer();
  },1000);
}

function showPracticePose(){
  const p=practiceSeq[practiceIdx];
  document.getElementById('practicePose').textContent=p.name;
  document.getElementById('practiceSanskrit').textContent=p.sanskrit;
  document.getElementById('practiceStep').textContent=p.steps[0];
  practiceRemaining=30;
  updatePracticeTimer();
}

function updatePracticeTimer(){
  const m=Math.floor(practiceRemaining/60);
  const s=practiceRemaining%60;
  document.getElementById('practiceTimer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function practicePrev(){
  if(practiceIdx>0){practiceIdx--;showPracticePose();}
}

function practiceNext(){
  if(practiceIdx<practiceSeq.length-1){practiceIdx++;showPracticePose();}
}

function endPractice(){
  if(practiceTimer) clearInterval(practiceTimer);
  logs.push({
    date:new Date().toISOString(),
    poses:practiceSeq.map(p=>p.name),
    duration:practiceSeq.length*30
  });
  localStorage.setItem('yoga_logs',JSON.stringify(logs));
  practiceSeq=null;
  showView('poseListView');
  alert('练习完成！');
}

function renderLogs(){
  const total=logs.length;
  const totalMin=Math.round(logs.reduce((a,b)=>a+b.duration,0)/60);
  const poseCount={};
  logs.forEach(l=>l.poses.forEach(p=>{poseCount[p]=(poseCount[p]||0)+1}));
  const fav=Object.entries(poseCount).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('logStats').innerHTML=`
    <div style="flex:1;text-align:center;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${total}</div>
      <div style="font-size:.8rem;color:var(--text2)">总次数</div>
    </div>
    <div style="flex:1;text-align:center;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:1.5rem;font-weight:700;color:var(--success)">${totalMin}</div>
      <div style="font-size:.8rem;color:var(--text2)">总分钟</div>
    </div>
    <div style="flex:1;text-align:center;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:1rem;font-weight:700;color:var(--warn)">${fav?fav[0]:'-'}</div>
      <div style="font-size:.8rem;color:var(--text2)">最爱体式</div>
    </div>
  `;
  document.getElementById('logList').innerHTML=logs.length?logs.slice(-10).reverse().map(l=>`
    <div class="li">
      <div><strong>${l.poses.join(' → ')}</strong><br><span style="color:var(--text2);font-size:.8rem">${new Date(l.date).toLocaleDateString('zh-CN')}</span></div>
      <span class="tag s">${Math.round(l.duration/60)}分钟</span>
    </div>
  `).join(''):'<div class="empty">暂无练习记录</div>';
}

renderPoses();
</script>
</body>
</html>
