<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计时2048</title>
<meta name="description" content="计时模式2048数字益智游戏，限时挑战你的操作速度">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0padding:16px;scroll-behavior:smooth;}
.container{text-align:center;padding:20px;max-width:500px;width:100%}
h1{font-size:28px;margin-bottom:10px;color:var(--accent)}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:15px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 20px;min-width:100px}
.stat-label{font-size:12px;color:#8b949e;text-transform:uppercase}
.stat-value{font-size:24px;font-weight:bold;color:var(--accent)}
.stat.danger .stat-value{color:#ff6b6b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.timer-ring{width:80px;height:80px;margin:0 auto 10px;position:relative}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.timer-ring .bg{stroke:var(--border)}
.timer-ring .fg{stroke:var(--accent);transition:stroke-dashoffset .5s linear}
.timer-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:bold}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:0 auto;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:12px}
.cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;transition:all .12s}
.btn{background:var(--accent);color:var(--text);border:none;padding:12px 30px;border-radius:8px;font-size:16px;cursor:pointer;margin-top:15px;font-weight:bold}
.combo-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:42px;font-weight:bold;color:var(--accent);pointer-events:none;animation:comboAnim .8s ease-out forwards;z-index:100}
@keyframes comboAnim{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100}
.overlay-box{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:30px;text-align:center}
.overlay-box h2{font-size:32px;margin-bottom:10px;color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="计时2048">
  <meta property="og:description" content="计时模式2048数字益智游戏，限时挑战你的操作速度">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/2048-time/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>⏱️ 计时2048</h1>
<div class="timer-ring">
<svg width="80" height="80"><circle class="bg" cx="40" cy="40" r="34"/><circle class="fg" id="timerCircle" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="0"/></svg>
<div class="timer-center" id="timerText">60</div>
</div>
<div class="stats">
<div class="stat"><div class="stat-label">分数</div><div class="stat-value" id="score">0</div></div>
<div class="stat"><div class="stat-label">最高方块</div><div class="stat-value" id="maxTile">2</div></div>
<div class="stat"><div class="stat-label">最高分</div><div class="stat-value" id="best">0</div></div>
</div>
<div class="board" id="board"></div>
<button class="btn" id="startBtn" onclick="startGame()">开始挑战</button>
<p style="color:#8b949e;margin-top:10px;font-size:13px">60秒内尽可能获得最高分!</p>
</div>
<div class="overlay" id="overlay" style="display:none">
<div class="overlay-box">
<h2 id="overlayTitle">时间到!</h2>
<p id="overlayMsg" style="margin:10px 0"></p>
<button class="btn" onclick="startGame();document.getElementById('overlay').style.display='none'">再来一局</button>
</div>
</div>
<script>
const SIZE=4,TOTAL_TIME=60;
let grid,score,maxTile,best=0,timer=null,timeLeft=TOTAL_TIME,gameActive=false,comboCount=0,lastScore=0;
const colors={0:'rgba(255,255,255,0.05)',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
const circumference=2*Math.PI*34;

function initBoard(){
    grid=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
    score=0;maxTile=2;comboCount=0;lastScore=0;
    addRandom();addRandom();render();
}

function addRandom(){
    const empty=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]===0)empty.push({r,c});
    if(!empty.length)return;
    const{r,c}=empty[Math.floor(Math.random()*empty.length)];
    grid[r][c]=Math.random()<0.9?2:4;
}

function render(){
    const board=document.getElementById('board');
    board.innerHTML='';
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
        const cell=document.createElement('div');
        cell.className='cell';
        const v=grid[r][c];
        cell.textContent=v||'';
        cell.style.background=colors[v]||`hsl(${Math.log2(v)*30},70%,50%)`;
        cell.style.color=v<=4?'#000':'#fff';
        cell.style.fontSize=v>=1024?'16px':v>=128?'20px':'24px';
        board.appendChild(cell);
    }
    document.getElementById('score').textContent=score;
    document.getElementById('maxTile').textContent=maxTile;
    document.getElementById('best').textContent=best;
    updateTimer();
}

function updateTimer(){
    document.getElementById('timerText').textContent=timeLeft;
    const offset=circumference*(1-timeLeft/TOTAL_TIME);
    document.getElementById('timerCircle').setAttribute('stroke-dashoffset',offset);
    document.getElementById('timerCircle').style.stroke=timeLeft<=10?'#ff6b6b':'var(--accent)';
}

function startGame(){
    if(timer)clearInterval(timer);
    timeLeft=TOTAL_TIME;gameActive=true;
    document.getElementById('overlay').style.display='none';
    document.getElementById('startBtn').textContent='重新开始';
    initBoard();
    timer=setInterval(()=>{
        timeLeft--;
        updateTimer();
        if(timeLeft<=0){
            clearInterval(timer);gameActive=false;
            if(score>best)best=score;
            showOverlay('⏰ 时间到!',`最终分数: ${score} | 最高方块: ${maxTile}`);
        }
    },1000);
}

function slide(row){
    let arr=row.filter(v=>v);
    for(let i=0;i<arr.length-1;i++)if(arr[i]===arr[i+1]){arr[i]*=2;score+=arr[i];arr.splice(i+1,1);}
    while(arr.length<SIZE)arr.push(0);
    return arr;
}

function move(dir){
    if(!gameActive)return;
    const g=grid.map(r=>[...r]);let moved=false;
    if(dir==='left'){for(let r=0;r<SIZE;r++){const s=slide(g[r]);if(s.join(',')!==g[r].join(','))moved=true;grid[r]=s;}}
    else if(dir==='right'){for(let r=0;r<SIZE;r++){const s=slide(g[r].slice().reverse()).reverse();if(s.join(',')!==g[r].join(','))moved=true;grid[r]=s;}}
    else if(dir==='up'){for(let c=0;c<SIZE;c++){const s=slide(g.map(r=>r[c]));if(s.join(',')!==g.map(r=>g[r][c]).join(','))moved=true;for(let r=0;r<SIZE;r++)grid[r][c]=s[r];}}
    else if(dir==='down'){for(let c=0;c<SIZE;c++){const s=slide(g.map(r=>r[c]).reverse()).reverse();if(s.join(',')!==g.map(r=>g[r][c]).join(','))moved=true;for(let r=0;r<SIZE;r++)grid[r][c]=s[r];}}
    if(moved){
        for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]>maxTile)maxTile=grid[r][c];
        const gained=score-lastScore;
        if(gained>0){
            comboCount++;
            if(comboCount>=3)showCombo(comboCount,gained);
        }else{comboCount=0;}
        lastScore=score;
        addRandom();render();
        if(isGameOver()){
            clearInterval(timer);gameActive=false;
            if(score>best)best=score;
            showOverlay('游戏结束',`分数: ${score} | 最高方块: ${maxTile}`);
        }
    }
}

function isGameOver(){
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
        if(grid[r][c]===0)return false;
        if(c<SIZE-1&&grid[r][c]===grid[r][c+1])return false;
        if(r<SIZE-1&&grid[r][c]===grid[r+1][c])return false;
    }
    return true;
}

function showCombo(c,p){
    const el=document.createElement('div');
    el.className='combo-text';
    el.textContent=`${c}连击! +${p}`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),800);
}

function showOverlay(t,m){document.getElementById('overlayTitle').textContent=t;document.getElementById('overlayMsg').textContent=m;document.getElementById('overlay').style.display='flex';}

document.addEventListener('keydown',e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(m[e.key]){e.preventDefault();move(m[e.key]);}});
let tx,ty;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<30&&Math.abs(dy)<30)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up');});

initBoard();updateTimer();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
