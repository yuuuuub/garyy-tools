<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏳️ 国旗问答</title>
<meta name="description" content="国旗识别问答游戏，测试你对世界各国国旗的认知">
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --accent:#3b82f6; --correct:#2ea043; --wrong:#f85149; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;min-height:100vh;padding:16px}
.container{width:100%;max-width:500px;display:flex;flex-direction:column;gap:16px}
.header{text-align:center;padding:16px 0}
.header h1{font-size:1.8rem;margin-bottom:8px}
.stats{display:flex;justify-content:center;gap:24px;font-size:.9rem;color:#8b949e}
.stats span{display:flex;flex-direction:column;align-items:center;gap:4px}
.stats .num{font-size:1.4rem;font-weight:700;color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px}
.difficulty{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.difficulty button{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:.9rem;transition:.2s}
.difficulty button.active{background:var(--accent);border-color:var(--accent);color:var(--text)}
.difficulty button:hover{border-color:var(--accent)}
.flag-display{text-align:center;font-size:5rem;padding:20px 0;min-height:120px;display:flex;align-items:center;justify-content:center}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option-btn{padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);cursor:pointer;font-size:1rem;transition:.2s;text-align:center}
.option-btn:hover{border-color:var(--accent);background:rgba(59,130,246,.1)}
.option-btn.correct{background:var(--correct);border-color:var(--correct);color:var(--text)}
.option-btn.wrong{background:var(--wrong);border-color:var(--wrong);color:var(--text)}
.option-btn:disabled{cursor:not-allowed;opacity:.7}
.feedback{text-align:center;font-size:1.1rem;font-weight:600;padding:12px 0;min-height:44px}
.start-btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;background:var(--accent);color:var(--text);font-size:1.1rem;cursor:pointer;transition:.2s}
.start-btn:hover{opacity:.9}
.progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);transition:width .3s;border-radius:3px}
.timer{font-size:.85rem;color:#8b949e;text-align:center}
.game-over{text-align:center;padding:30px 0}
.game-over h2{font-size:1.6rem;margin-bottom:16px}
.game-over .final-score{font-size:3rem;font-weight:700;color:var(--accent);margin:16px 0}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🏳️ 国旗问答">
  <meta property="og:description" content="国旗识别问答游戏，测试你对世界各国国旗的认知">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/flag-quiz/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<div class="header">
<h1>🏳️ 国旗问答</h1>
<div class="stats">
<span>得分<span class="num" id="score">0</span></span>
<span>连对<span class="num" id="streak">0</span></span>
<span>正确率<span class="num" id="accuracy">0%</span></span>
</div>
</div>
<div class="card" id="gameArea">
<div class="difficulty">
<button class="active" data-diff="easy">简单</button>
<button data-diff="medium">中等</button>
<button data-diff="hard">困难</button>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div class="timer" id="timer">⏱ 10s</div>
<div class="flag-display" id="flag"></div>
<div class="feedback" id="feedback"></div>
<div class="options" id="options"></div>
</div>
<div class="card" id="startScreen">
<button class="start-btn" onclick="startGame()">开始游戏</button>
</div>
<div class="card game-over" id="endScreen" style="display:none">
<h2>🎉 游戏结束</h2>
<div class="final-score" id="finalScore">0</div>
<p>答对 <span id="correctCount">0</span> / <span id="totalCount">0</span> 题</p>
<button class="start-btn" onclick="startGame()" style="margin-top:16px">再来一局</button>
</div>
</div>
<script>
const FLAGS=[
{flag:'🇨🇳',name:'中国'},{flag:'🇺🇸',name:'美国'},{flag:'🇯🇵',name:'日本'},{flag:'🇬🇧',name:'英国'},
{flag:'🇫🇷',name:'法国'},{flag:'🇩🇪',name:'德国'},{flag:'🇰🇷',name:'韩国'},{flag:'🇮🇹',name:'意大利'},
{flag:'🇷🇺',name:'俄罗斯'},{flag:'🇧🇷',name:'巴西'},{flag:'🇨🇦',name:'加拿大'},{flag:'🇦🇺',name:'澳大利亚'},
{flag:'🇮🇳',name:'印度'},{flag:'🇪🇸',name:'西班牙'},{flag:'🇲🇽',name:'墨西哥'},{flag:'🇹🇭',name:'泰国'},
{flag:'🇻🇳',name:'越南'},{flag:'🇸🇬',name:'新加坡'},{flag:'🇲🇾',name:'马来西亚'},{flag:'🇮🇩',name:'印度尼西亚'},
{flag:'🇵🇭',name:'菲律宾'},{flag:'🇳🇿',name:'新西兰'},{flag:'🇿🇦',name:'南非'},{flag:'🇪🇬',name:'埃及'},
{flag:'🇹🇷',name:'土耳其'},{flag:'🇸🇦',name:'沙特阿拉伯'},{flag:'🇦🇪',name:'阿联酋'},{flag:'🇮🇱',name:'以色列'},
{flag:'🇵🇰',name:'巴基斯坦'},{flag:'🇧🇩',name:'孟加拉国'},{flag:'🇨🇱',name:'智利'},{flag:'🇨🇴',name:'哥伦比亚'},
{flag:'🇵🇪',name:'秘鲁'},{flag:'🇦🇷',name:'阿根廷'},{flag:'🇳🇬',name:'尼日利亚'},{flag:'🇰🇪',name:'肯尼亚'},
{flag:'🇬🇷',name:'希腊'},{flag:'🇵🇹',name:'葡萄牙'},{flag:'🇳🇱',name:'荷兰'},{flag:'🇧🇪',name:'比利时'},
{flag:'🇸🇪',name:'瑞典'},{flag:'🇳🇴',name:'挪威'},{flag:'🇫🇮',name:'芬兰'},{flag:'🇩🇰',name:'丹麦'},
{flag:'🇵🇱',name:'波兰'},{flag:'🇨🇿',name:'捷克'},{flag:'🇨🇭',name:'瑞士'},{flag:'🇦🇹',name:'奥地利'},
{flag:'🇮🇪',name:'爱尔兰'},{flag:'🇺🇦',name:'乌克兰'}
];
let diff=4,timer=null,timeLeft=10,score=0,streak=0,total=0,correct=0,current=null;
document.querySelectorAll('.difficulty button').forEach(b=>{
b.onclick=()=>{
document.querySelectorAll('.difficulty button').forEach(x=>x.classList.remove('active'));
b.classList.add('active');
diff=b.dataset.diff==='easy'?4:b.dataset.diff==='medium'?6:8;
};
});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(){
score=0;streak=0;total=0;correct=0;
document.getElementById('startScreen').style.display='none';
document.getElementById('endScreen').style.display='none';
updateStats();nextRound();
}
function nextRound(){
const pool=[...FLAGS];
const answer=pool[Math.floor(Math.random()*pool.length)];
current=answer;
const opts=[answer];
while(opts.length<diff){
const r=pool[Math.floor(Math.random()*pool.length)];
if(!opts.find(o=>o.name===r.name))opts.push(r);
}
shuffle(opts);
document.getElementById('flag').textContent=answer.flag;
document.getElementById('feedback').textContent='';
const optDiv=document.getElementById('options');
optDiv.innerHTML='';
opts.forEach(o=>{
const btn=document.createElement('button');
btn.className='option-btn';
btn.textContent=o.name;
btn.onclick=()=>checkAnswer(btn,o.name===answer.name);
optDiv.appendChild(btn);
});
total++;
timeLeft=10;
clearInterval(timer);
timer=setInterval(()=>{
timeLeft--;
document.getElementById('timer').textContent='⏱ '+timeLeft+'s';
if(timeLeft<=0){clearInterval(timer);timeUp()}
},1000);
document.getElementById('progress').style.width=((total-1)/20*100)+'%';
}
function checkAnswer(btn,isCorrect){
clearInterval(timer);
const btns=document.querySelectorAll('.option-btn');
btns.forEach(b=>{b.disabled=true;if(b.textContent===current.name)b.classList.add('correct')});
if(isCorrect){
btn.classList.add('correct');
score+=timeLeft*10+streak*5;
streak++;correct++;
document.getElementById('feedback').textContent='✅ 正确！';
document.getElementById('feedback').style.color='var(--correct)';
}else{
btn.classList.add('wrong');
streak=0;
document.getElementById('feedback').textContent='❌ 正确答案是：'+current.name;
document.getElementById('feedback').style.color='var(--wrong)';
}
updateStats();
setTimeout(nextRound,1500);
}
function timeUp(){
streak=0;
const btns=document.querySelectorAll('.option-btn');
btns.forEach(b=>{b.disabled=true;if(b.textContent===current.name)b.classList.add('correct')});
document.getElementById('feedback').textContent='⏰ 超时！正确答案是：'+current.name;
document.getElementById('feedback').style.color='var(--wrong)';
updateStats();
setTimeout(nextRound,1500);
}
function updateStats(){
document.getElementById('score').textContent=score;
document.getElementById('streak').textContent=streak;
document.getElementById('accuracy').textContent=total>0?Math.round(correct/total*100)+'%':'0%';
}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
