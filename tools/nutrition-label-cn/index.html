<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏷️ 营养标签解读</title>
<meta property="og:title" content="🏷️ 营养标签解读">
<meta property="og:description" content="🏷️ 营养标签解读 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="输入食材或菜品，查看详细营养成分和每日推荐摄入比例">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#6366f1;--accent2:#4f46e5;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--orange:#f97316;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#6366f1;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--blue:#0969da;--orange:#bc4c00;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:800px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number]{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus{border-color:var(--accent)}
select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;width:100%}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.75rem;margin:2px}
.tag.green{background:rgba(34,197,94,.15);color:var(--green)}
.tag.yellow{background:rgba(234,179,8,.15);color:var(--yellow)}
.tag.red{background:rgba(239,68,68,.15);color:var(--red)}
.nl{background:#fff;color:#1a1a1a;border:3px solid #1a1a1a;border-radius:4px;padding:16px 20px;font-family:Arial,'Microsoft YaHei',sans-serif;margin:12px 0}
.nl h2{font-size:2rem;font-weight:900;border-bottom:8px solid #1a1a1a;padding-bottom:6px;margin:0}
.nl .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e0e0e0;font-size:.9rem}
.nl .row.bold{font-weight:700;border-bottom:2px solid #1a1a1a}
.nl .row.indent{padding-left:20px}
.nl .row.thick{border-bottom:8px solid #1a1a1a}
.bar-wrap{background:var(--bg);border-radius:8px;padding:12px;margin:8px 0}
.bar-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.health-tips{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tip{display:flex;gap:10px;padding:10px;background:var(--bg);border-radius:8px;font-size:.85rem}
.tip-icon{font-size:1.2rem;flex-shrink:0}
.compare-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.compare-item{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
.compare-item .name{font-weight:600;margin-bottom:4px}
.compare-item .value{font-size:1.3rem;font-weight:700;color:var(--accent)}
.compare-item .unit{font-size:.75rem;color:var(--text2)}
.empty{text-align:center;padding:30px;color:var(--text2);font-size:.9rem}
.quick-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick-item{padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .2s}
.quick-item:hover{border-color:var(--accent);color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏷️</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏷️ 营养标签解读</h1><p>查看食物营养成分，了解每日推荐摄入量</p></div>

<div class="cd"><h2>查询营养信息</h2>
<label>食物名称</label><input type="text" id="foodInput" placeholder="如：米饭、鸡蛋、苹果" onkeydown="if(event.key==='Enter')lookup()">
<div class="fr" style="margin-top:8px">
<div><label>份量(克)</label><input type="number" id="servingSize" value="100" min="1"></div>
<div><label>类别</label><select id="foodCat">
<option value="">全部</option><option value="主食">主食</option><option value="肉类">肉类</option><option value="蔬菜">蔬菜</option><option value="水果">水果</option><option value="乳制品">乳制品</option><option value="零食">零食</option>
</select></div>
</div>
<div class="bg"><button onclick="lookup()">🔍 查询</button><button class="sec" onclick="showCompare()">📊 对比模式</button></div>
<div class="quick-list" id="quickList"></div></div>

<div class="cd" id="resultCard" style="display:none"><h2 id="resultTitle">营养成分</h2>
<div class="nl" id="nutritionLabel"></div>
<div id="barsSection"></div>
<div class="health-tips" id="healthTips"></div></div>

<div class="cd" id="compareCard" style="display:none"><h2>📊 营养对比</h2>
<div class="compare-grid" id="compareGrid"></div></div>

<div class="cd"><h2>📚 常见食物营养参考</h2><div id="refList"></div></div>
</div>
<script>
var DB='nutrition_label_cn';
var FOODS={
'米饭':{cal:116,protein:2.6,carb:25.9,fat:0.3,fiber:0.3,na:2,cat:'主食',vitC:0,ca:10,fe:0.4},
'面条':{cal:138,protein:4.5,carb:25.2,fat:1.6,fiber:0.9,na:3,cat:'主食',vitC:0,ca:15,fe:1.2},
'馒头':{cal:223,protein:7.0,carb:44.2,fat:1.1,fiber:1.3,na:231,cat:'主食',vitC:0,ca:38,fe:1.8},
'红薯':{cal:86,protein:1.6,carb:20.1,fat:0.1,fiber:3.0,na:55,cat:'主食',vitC:2.4,ca:23,fe:0.5},
'燕麦':{cal:389,protein:16.9,carb:66.3,fat:6.9,fiber:10.6,na:2,cat:'主食',vitC:0,ca:54,fe:4.7},
'鸡蛋':{cal:144,protein:13.3,carb:1.5,fat:9.5,fiber:0,na:142,cat:'肉类',vitC:0,ca:56,fe:2.0},
'鸡胸肉':{cal:165,protein:31.0,carb:0,fat:3.6,fiber:0,na:74,cat:'肉类',vitC:0,ca:15,fe:1.0},
'猪里脊':{cal:143,protein:21.0,carb:0,fat:6.1,fiber:0,na:63,cat:'肉类',vitC:0,ca:9,fe:0.8},
'牛肉':{cal:250,protein:26.0,carb:0,fat:15.0,fiber:0,na:72,cat:'肉类',vitC:0,ca:18,fe:2.6},
'三文鱼':{cal:208,protein:20.4,carb:0,fat:13.4,fiber:0,na:59,cat:'肉类',vitC:0,ca:12,fe:0.8},
'虾':{cal:99,protein:20.4,carb:0.2,fat:1.7,fiber:0,na:111,cat:'肉类',vitC:2.0,ca:52,fe:1.5},
'豆腐':{cal:76,protein:8.1,carb:1.9,fat:3.7,fiber:0.3,na:7,cat:'肉类',vitC:0,ca:130,fe:1.6},
'牛奶':{cal:61,protein:3.2,carb:4.8,fat:3.3,fiber:0,na:43,cat:'乳制品',vitC:1.0,ca:113,fe:0},
'酸奶':{cal:97,protein:3.5,carb:12.0,fat:3.3,fiber:0,na:47,cat:'乳制品',vitC:0.5,ca:121,fe:0},
'苹果':{cal:52,protein:0.3,carb:13.8,fat:0.2,fiber:2.4,na:1,cat:'水果',vitC:4.6,ca:6,fe:0.1},
'香蕉':{cal:89,protein:1.1,carb:22.8,fat:0.3,fiber:2.6,na:1,cat:'水果',vitC:8.7,ca:5,fe:0.3},
'橙子':{cal:47,protein:0.9,carb:11.8,fat:0.1,fiber:2.4,na:0,cat:'水果',vitC:53.2,ca:40,fe:0.1},
'葡萄':{cal:69,protein:0.7,carb:18.1,fat:0.2,fiber:0.9,na:2,cat:'水果',vitC:3.2,ca:10,fe:0.4},
'西兰花':{cal:34,protein:2.8,carb:6.6,fat:0.4,fiber:2.6,na:33,cat:'蔬菜',vitC:89.2,ca:47,fe:0.7},
'菠菜':{cal:23,protein:2.9,carb:3.6,fat:0.4,fiber:2.2,na:79,cat:'蔬菜',vitC:28.1,ca:99,fe:2.7},
'胡萝卜':{cal:41,protein:0.9,carb:9.6,fat:0.2,fiber:2.8,na:69,cat:'蔬菜',vitC:5.9,ca:33,fe:0.3},
'番茄':{cal:18,protein:0.9,carb:3.9,fat:0.2,fiber:1.2,na:5,cat:'蔬菜',vitC:13.7,ca:10,fe:0.3},
'黄瓜':{cal:15,protein:0.7,carb:3.6,fat:0.1,fiber:0.5,na:2,cat:'蔬菜',vitC:2.8,ca:16,fe:0.3},
'土豆':{cal:77,protein:2.0,carb:17.5,fat:0.1,fiber:2.2,na:6,cat:'蔬菜',vitC:19.7,ca:12,fe:0.8},
'巧克力':{cal:546,protein:5.0,carb:59.4,fat:31.3,fiber:7.0,na:24,cat:'零食',vitC:0,ca:34,fe:7.9},
'薯片':{cal:536,protein:7.0,carb:52.0,fat:35.0,fiber:4.4,na:525,cat:'零食',vitC:4.8,ca:24,fe:1.6},
'饼干':{cal:466,protein:5.8,carb:65.0,fat:20.0,fiber:2.0,na:360,cat:'零食',vitC:0,ca:30,fe:2.5},
'苹果汁':{cal:46,protein:0.1,carb:11.3,fat:0.1,fiber:0.2,na:4,cat:'水果',vitC:0.9,ca:8,fe:0.1},
'可乐':{cal:42,protein:0,carb:10.6,fat:0,fiber:0,na:4,cat:'零食',vitC:0,ca:0,fe:0},
'咖啡':{cal:2,protein:0.1,carb:0,fat:0,fiber:0,na:2,cat:'饮品',vitC:0,ca:2,fe:0}
};
var DRI={cal:2000,protein:65,carb:300,fat:60,fiber:25,na:2000,vitC:100,ca:800,fe:15};

function lookup(){
var name=document.getElementById('foodInput').value.trim();
var cat=document.getElementById('foodCat').value;
var serving=parseInt(document.getElementById('servingSize').value)||100;
var matches=[];
if(name){
matches=Object.entries(FOODS).filter(function(e){return e[0].includes(name)}).map(function(e){return Object.assign({name:e[0]},e[1])});
}else if(cat){
matches=Object.entries(FOODS).filter(function(e){return e[1].cat===cat}).map(function(e){return Object.assign({name:e[0]},e[1])});
}
if(!matches.length){document.getElementById('resultCard').style.display='none';alert('未找到该食物的营养数据');return;}
showResult(matches[0],serving);
}
function showResult(f,serving){
var mul=serving/100;
document.getElementById('resultCard').style.display='block';
document.getElementById('resultTitle').textContent=f.name+' 营养成分 ('+serving+'g)';
var c=f.cal*mul,p=f.protein*mul,cb=f.carb*mul,fa=f.fat*mul,fb=(f.fiber||0)*mul,na=(f.na||0)*mul;
document.getElementById('nutritionLabel').innerHTML=
'<h2>营养成分表</h2>'+
'<div class="row bold"><span>项目</span><span>每100g</span><span>'+serving+'g</span></div>'+
'<div class="row"><span>热量</span><span>'+f.cal+' 千卡</span><span>'+Math.round(c)+' 千卡</span></div>'+
'<div class="row bold"><span>蛋白质</span><span>'+f.protein+'g</span><span>'+p.toFixed(1)+'g</span></div>'+
'<div class="row"><span>碳水化合物</span><span>'+f.carb+'g</span><span>'+cb.toFixed(1)+'g</span></div>'+
'<div class="row bold"><span>脂肪</span><span>'+f.fat+'g</span><span>'+fa.toFixed(1)+'g</span></div>'+
'<div class="row"><span>膳食纤维</span><span>'+(f.fiber||0)+'g</span><span>'+fb.toFixed(1)+'g</span></div>'+
'<div class="row"><span>钠</span><span>'+(f.na||0)+'mg</span><span>'+na.toFixed(0)+'mg</span></div>'+
(f.vitC!==undefined?'<div class="row"><span>维生素C</span><span>'+f.vitC+'mg</span><span>'+(f.vitC*mul).toFixed(1)+'mg</span></div>':'')+
(f.ca!==undefined?'<div class="row"><span>钙</span><span>'+f.ca+'mg</span><span>'+(f.ca*mul).toFixed(0)+'mg</span></div>':'')+
(f.fe!==undefined?'<div class="row"><span>铁</span><span>'+f.fe+'mg</span><span>'+(f.fe*mul).toFixed(1)+'mg</span></div>':'');
var bars=[
{name:'热量',val:c,max:DRI.cal,unit:'千卡',color:'var(--orange)'},
{name:'蛋白质',val:p,max:DRI.protein,unit:'g',color:'var(--green)'},
{name:'碳水',val:cb,max:DRI.carb,unit:'g',color:'var(--blue)'},
{name:'脂肪',val:fa,max:DRI.fat,unit:'g',color:'var(--yellow)'},
{name:'膳食纤维',val:fb,max:DRI.fiber,unit:'g',color:'var(--accent)'},
{name:'钠',val:na,max:DRI.na,unit:'mg',color:'var(--red)'}
];
document.getElementById('barsSection').innerHTML='<h2 style="color:var(--accent);margin-bottom:12px">📊 每日推荐比例</h2>'+bars.map(function(b){
var pct=Math.min(100,b.val/b.max*100);
return '<div class="bar-wrap"><div class="bar-label"><span>'+b.name+'</span><span>'+b.val.toFixed(1)+' / '+b.max+b.unit+' ('+pct.toFixed(1)+'%)</span></div><div class="bar"><div class="bar-fill" style="width:'+pct+'%;background:'+b.color+'"></div></div></div>';
}).join('');
var tips=[];
if(p>DRI.protein*0.5)tips.push({icon:'💪',text:'蛋白质含量较高，适合运动后补充'});
if(fa>DRI.fat*0.3)tips.push({icon:'⚠️',text:'脂肪含量偏高，建议适量食用'});
if(na>DRI.na*0.3)tips.push({icon:'🧂',text:'钠含量较高，注意控制盐分摄入'});
if(fb>5)tips.push({icon:'✅',text:'膳食纤维丰富，有助消化健康'});
if(f.vitC>20)tips.push({icon:'🍊',text:'维生素C含量较高'});
if(f.cal<50)tips.push({icon:'✅',text:'低热量食物，适合减脂期'});
if(!tips.length)tips.push({icon:'ℹ️',text:'该食物营养较均衡'});
document.getElementById('healthTips').innerHTML='<h2 style="color:var(--accent);margin-bottom:8px">💡 健康提示</h2>'+tips.map(function(t){return '<div class="tip"><span class="tip-icon">'+t.icon+'</span><span>'+t.text+'</span></div>'}).join('');
}
function showCompare(){
document.getElementById('compareCard').style.display='block';
var items=['米饭','鸡蛋','鸡胸肉','苹果','西兰花','牛奶'];
document.getElementById('compareGrid').innerHTML=items.map(function(n){
var f=FOODS[n];
return '<div class="compare-item"><div class="name">'+n+'</div><div class="value">'+f.cal+'</div><div class="unit">千卡/100g</div><div style="font-size:.8rem;color:var(--text2);margin-top:4px">蛋白质 '+f.protein+'g · 脂肪 '+f.fat+'g</div></div>';
}).join('');
}
function renderQuick(){
var common=['米饭','鸡蛋','鸡胸肉','苹果','西兰花','牛奶','巧克力','番茄'];
document.getElementById('quickList').innerHTML=common.map(function(n){return '<span class="quick-item" onclick="document.getElementById(\'foodInput\').value=\''+n+'\';lookup()">'+n+'</span>'}).join('');
}
function renderRef(){
var items=['米饭','面条','鸡蛋','鸡胸肉','牛肉','牛奶','苹果','香蕉','西兰花','番茄'];
document.getElementById('refList').innerHTML=items.map(function(n){var f=FOODS[n];return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem"><span>'+n+'</span><span style="color:var(--text2)">'+f.cal+'千卡 · 蛋白质'+f.protein+'g · 脂肪'+f.fat+'g</span></div>'}).join('');
}
renderQuick();renderRef();
</script>
</body>
</html>
