<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随机数据生成器</title><meta name="description" content="随机数据生成器 - 在线生成随机姓名、邮箱、电话、地址、UUID等测试数据"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;width:100%}.input-group input:focus,.input-group select:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;margin:4px}.btn:hover{opacity:.85}.btn-green{background:var(--green)}.btn-group{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:12px}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.tag{display:inline-block;padding:4px 10px;background:var(--blue);color:#fff;border-radius:20px;font-size:.75rem;margin:2px}.data-row{padding:8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:.85rem}.data-row:last-child{border-bottom:none}.data-label{color:var(--text2)}.data-value{font-family:monospace;color:var(--text)}</style>
<meta property="og:title" content="随机数据生成器">
<meta property="og:description" content="随机数据生成器 - 在线生成随机姓名、邮箱、电话、地址、UUID等测试数据">
<meta property="og:image" content="/og-default.png">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎲 随机数据生成器</h1><p class="sub">在线生成随机姓名、邮箱、电话、地址、UUID等测试数据</p>
<div class="card">
<div class="input-group"><label>生成条数</label><input type="number" id="count" value="5" min="1" max="100"></div>
<div class="btn-group">
<button class="btn" onclick="generate('name')">姓名</button>
<button class="btn" onclick="generate('email')">邮箱</button>
<button class="btn" onclick="generate('phone')">电话</button>
<button class="btn" onclick="generate('address')">地址</button>
<button class="btn" onclick="generate('company')">公司</button>
<button class="btn" onclick="generate('date')">日期</button>
<button class="btn" onclick="generate('uuid')">UUID</button>
<button class="btn" onclick="generate('ip')">IP地址</button>
<button class="btn" onclick="generate('creditcard')">信用卡号</button>
<button class="btn" onclick="generate('username')">用户名</button>
<button class="btn" onclick="generate('color')">颜色</button>
<button class="btn" onclick="generate('all')">全部随机</button>
<button class="btn btn-green" onclick="copyResult()">复制全部</button>
</div></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var lastResult='';
var firstNames=['张','王','李','赵','刘','陈','杨','黄','周','吴','徐','孙','马','朱','胡','林','郭','何','高','罗','郑','梁','谢','宋','唐','许','韩','冯','邓','曹','彭','曾','肖','田','董','潘','袁','蔡','蒋','余','于','叶','方','石','姚','谭','邹','熊','金','陆','郝','孔','白','崔','康','毛','邱','秦','江','史','顾','侯','邵','孟','龙','万','段'];
var lastNames=['伟','芳','娜','敏','静','丽','强','磊','洋','军','明','秀英','华','慧','建华','建国','建军','志强','志明','文博','天翔','浩然','子轩','梓萱','思源','宇航','嘉豪','俊杰','晓峰','国强','建平','永康','家明','志远','德华','学明','永强','国栋','志刚','文杰','海涛','伟明','建国','志伟','光明','正阳','天宇','浩宇','子豪','嘉琪'];
var cities=['北京市','上海市','广州市','深圳市','杭州市','南京市','成都市','武汉市','西安市','重庆市','天津市','苏州市','郑州市','长沙市','东莞市','佛山市','宁波市','青岛市','大连市','厦门市'];
var streets=['中山路','解放路','人民路','建设路','和平路','文化路','科技路','创新路','幸福路','光明路','新华路','胜利路','团结路','友谊路','长安街'];
function pick(arr){return arr[Math.floor(Math.random()*rand(arr.length))];}
function rand(n){return Math.random()*n;}
function generate(type){
  var count=parseInt(document.getElementById('count').value)||5;
  var results=[];
  var types=type==='all'?['name','email','phone','address','company','date','uuid','ip','creditcard','username','color']:[type];
  for(var i=0;i<count;i++){
    var row={};
    types.forEach(function(t){row[t]=generateItem(t);});
    results.push(row);
  }
  var html='<div class="card"><div class="grid">';
  results.forEach(function(r,idx){
    html+='<div class="data-row"><span class="data-label">#'+(idx+1)+'</span>';
    var vals=Object.keys(r).map(function(k){return'<span><span class="data-label">'+typeLabel(k)+':</span> <span class="data-value">'+escapeHtml(r[k])+'</span></span>';}).join(' ');
    html+='<span>'+vals+'</span></div>';
  });
  html+='</div><button class="copy-btn" onclick="copyResult()">复制全部</button></div>';
  lastResult=results.map(function(r){
    return Object.keys(r).map(function(k){return typeLabel(k)+': '+r[k]}).join(' | ');
  }).join('\n');
  document.getElementById('result').innerHTML=html;
}
function typeLabel(t){
  var labels={name:'姓名',email:'邮箱',phone:'电话',address:'地址',company:'公司',date:'日期',uuid:'UUID',ip:'IP',creditcard:'信用卡',username:'用户名',color:'颜色'};
  return labels[t]||t;
}
function generateItem(type){
  switch(type){
    case'name':return pick(firstNames)+pick(lastNames);
    case'email':return pick(firstNames).toLowerCase()+pick(lastNames).toLowerCase()+Math.floor(rand(1000))+'@'+pick(['gmail.com','qq.com','163.com','outlook.com','yahoo.com','foxmail.com']);
    case'phone':return '1'+['3','5','7','8','9'][Math.floor(rand(5))]+String(Math.floor(rand(900000000)+100000000));
    case'address':return pick(cities)+pick(streets)+Math.floor(rand(200)+1)+'号';
    case'company':return pick(['北京','上海','深圳','杭州','广州'])+pick(['科技','信息','智能','数据','网络','创新','未来'])+pick(['有限公司','股份有限公司','集团','科技有限公司']);
    case'date':var y=2020+Math.floor(rand(7)),m=String(Math.floor(rand(12))+1).padStart(2,'0'),d=String(Math.floor(rand(28))+1).padStart(2,'0');return y+'-'+m+'-'+d;
    case'uuid':function hex(){return Math.floor(rand(16)).toString(16);}return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16);});
    case'ip':return Math.floor(rand(223)+1)+'.'+Math.floor(rand(256))+'.'+Math.floor(rand(256))+'.'+Math.floor(rand(256));
    case'creditcard':var cc='';for(var i=0;i<16;i++)cc+=Math.floor(rand(10));return cc.replace(/(.{4})/g,'$1 ').trim();
    case'username':var chars='abcdefghijklmnopqrstuvwxyz0123456789';var u='';for(var i=0;i<8;i++)u+=chars[Math.floor(rand(chars.length))];return u;
    case'color':'#'+('000000'+(Math.floor(rand(16777215))).toString(16)).slice(-6);
  }
  return '#'+('000000'+(Math.floor(rand(16777215))).toString(16)).slice(-6);
}
function copyResult(){if(lastResult)navigator.clipboard.writeText(lastResult).then(function(){alert('已复制');});}
function escapeHtml(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
generate('all');
</script></body></html>
