<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😊 心情追踪专业版</title>
<meta name="description" content="专业心情追踪器，记录每日情绪、分析情绪趋势、了解情绪模式">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px}
.ctn{max-width:700px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.li{padding:14px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text)}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}
.empty{text-align:center;padding:40px;color:var(--text2)}
.mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:8px}
.mood-item{display:flex;flex-direction:column;align-items:center;padding:12px 8px;border-radius:12px;border:2px solid var(--border);cursor:pointer;transition:all .2s}.mood-item:hover{border-color:var(--accent)}.mood-item.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
.mood-item .emoji{font-size:2rem}.mood-item .lbl{font-size:.75rem;margin-top:4px;color:var(--text2)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}.stat-card .num{font-size:1.6rem;font-weight:700;color:var(--accent)}.stat-card .lbl{font-size:.75rem;color:var(--text2);margin-top:4px}
.mood-timeline{display:flex;align-items:flex-end;gap:4px;height:100px;margin-top:12px}.mood-bar{flex:1;border-radius:4px 4px 0 0;min-height:8px;display:flex;align-items:flex-end;justify-content:center;font-size:.65rem;color:var(--text)}
.tag-cloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tag-pill{padding:4px 12px;border-radius:20px;font-size:.8rem;border:1px solid var(--border);cursor:pointer;transition:all .2s}.tag-pill:hover{background:var(--accent);color:var(--text)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😊</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>😊 心情追踪专业版</h1><p>了解你的情绪模式</p></div>

<div class="cd"><h2>今天心情如何？</h2>
<div class="mood-grid" id="moodGrid"></div>
<label>发生了什么？</label><textarea id="note" rows="2" placeholder="记录影响心情的事件"></textarea>
<label>情绪标签</label><div class="tag-cloud" id="tagCloud"></div>
<div class="bg"><button onclick="saveMood()">记录心情</button></div></div>

<div class="cd"><h2>📊 心情统计</h2>
<div class="stats-grid" id="stats"></div>
<div style="margin-top:16px"><h3 style="font-size:.95rem;margin-bottom:8px">最近30天趋势</h3><div class="mood-timeline" id="timeline"></div></div>
<div style="margin-top:16px"><h3 style="font-size:.95rem;margin-bottom:8px">情绪分布</h3><div id="distribution"></div></div>
<div style="margin-top:16px"><h3 style="font-size:.95rem;margin-bottom:8px">常出现的标签</h3><div class="tag-cloud" id="topTags"></div></div>
</div>

<div class="cd"><h2>📋 最近记录</h2><div id="recentList" class="empty">暂无记录</div></div>
</div>

<div style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;justify-content:center;align-items:center" id="viewModal">
<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto" id="viewContent"></div>
</div>

<script>
const $=id=>document.getElementById(id);
let moods=JSON.parse(localStorage.getItem('mtp_moods')||'[]');
const today=()=>new Date().toISOString().slice(0,10);
const save=()=>localStorage.setItem('mtp_moods',JSON.stringify(moods));

const moodTypes=[
  {emoji:'😄',name:'开心',score:5,color:'#22c55e'},
  {emoji:'😊',name:'愉快',score:4,color:'#86efac'},
  {emoji:'😐',name:'平淡',score:3,color:'#f59e0b'},
  {emoji:'😔',name:'低落',score:2,color:'#fb923c'},
  {emoji:'😢',name:'难过',score:1,color:'#ef4444'},
  {emoji:'😡',name:'生气',score:1,color:'#dc2626'},
  {emoji:'😰',name:'焦虑',score:2,color:'#f97316'},
  {emoji:'😴',name:'疲惫',score:2,color:'#8b5cf6'},
  {emoji:'🥰',name:'幸福',score:5,color:'#ec4899'},
  {emoji:'💪',name:'有动力',score:4,color:'#3b82f6'}
];

const tagOptions=['工作','学习','运动','社交','家庭','恋爱','健康','旅行','美食','天气','金钱','睡眠'];

let selectedMood=null;let selectedTags=new Set();

function init(){
  let moodHtml='';moodTypes.forEach((m,i)=>{
    moodHtml+=`<div class="mood-item" onclick="selectMood(${i})"><div class="emoji">${m.emoji}</div><div class="lbl">${m.name}</div></div>`;
  });$('moodGrid').innerHTML=moodHtml;

  let tagHtml='';tagOptions.forEach(t=>{
    tagHtml+=`<div class="tag-pill" onclick="toggleTag('${t}')">${t}</div>`;
  });$('tagCloud').innerHTML=tagHtml;

  renderStats();renderRecent();
}

function selectMood(i){selectedMood=i;document.querySelectorAll('.mood-item').forEach((el,j)=>{el.classList.toggle('active',j===i)})}
function toggleTag(t){if(selectedTags.has(t))selectedTags.delete(t);else selectedTags.add(t);document.querySelectorAll('.tag-pill').forEach(el=>{el.style.background=selectedTags.has(el.textContent)?'var(--accent)':'';el.style.color=selectedTags.has(el.textContent)?'var(--text)':''})}

function saveMood(){
  if(selectedMood===null){alert('请选择心情');return}
  const m=moodTypes[selectedMood];
  moods.push({date:today(),time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),mood:m.name,emoji:m.emoji,score:m.score,color:m.color,note:$('note').value,tags:[...selectedTags],savedAt:new Date().toISOString()});
  save();selectedMood=null;selectedTags.clear();$('note').value='';
  document.querySelectorAll('.mood-item').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tag-pill').forEach(el=>{el.style.background='';el.style.color=''});
  renderStats();renderRecent();alert('记录成功！');
}

function renderStats(){
  const total=moods.length;
  const avgScore=total?Math.round(moods.reduce((s,m)=>s+m.score,0)/total*10)/10:0;
  const todayMoods=moods.filter(m=>m.date===today());
  const uniqueDays=new Set(moods.map(m=>m.date)).size;

  $('stats').innerHTML=`
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">总记录</div></div>
    <div class="stat-card"><div class="num">${uniqueDays}</div><div class="lbl">记录天数</div></div>
    <div class="stat-card"><div class="num">${avgScore}</div><div class="lbl">平均心情</div></div>
    <div class="stat-card"><div class="num">${todayMoods.length}</div><div class="lbl">今日记录</div></div>`;

  const last30=[];for(let i=29;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);
    const dayMoods=moods.filter(m=>m.date===k);
    const avg=dayMoods.length?dayMoods.reduce((s,m)=>s+m.score,0)/dayMoods.length:0;
    const color=avg>=4?'#22c55e':avg>=3?'#f59e0b':avg>=2?'#fb923c':'#ef4444';
    last30.push(`<div class="mood-bar" style="height:${avg?avg*20:4}px;background:${color}" title="${k}: ${avg?avg.toFixed(1):'无数据'}"></div>`);
  }$('timeline').innerHTML=last30.join('');

  const dist={};moods.forEach(m=>{dist[m.mood]=(dist[m.mood]||0)+1});
  let distHtml='';Object.entries(dist).sort((a,b)=>b[1]-a[1]).forEach(([name,count])=>{
    const pct=Math.round(count/total*100);distHtml+=`<div style="margin-bottom:6px;display:flex;align-items:center;gap:8px;font-size:.85rem"><span style="width:60px">${name}</span><div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--accent);border-radius:4px"></div></div><span style="width:40px;text-align:right;color:var(--text2)">${pct}%</span></div>`;
  });$('distribution').innerHTML=distHtml||'<div class="empty">暂无数据</div>';

  const tagCount={};moods.forEach(m=>(m.tags||[]).forEach(t=>{tagCount[t]=(tagCount[t]||0)+1}));
  let tagHtml='';Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,8).forEach(([t,n])=>{
    tagHtml+=`<span class="tag-pill" style="font-size:.8rem">${t} (${n})</span>`;
  });$('topTags').innerHTML=tagHtml||'<div class="empty">暂无标签</div>';
}

function renderRecent(){
  const sorted=[...moods].sort((a,b)=>b.savedAt.localeCompare(a.savedAt)).slice(0,15);
  let html='';sorted.forEach(m=>{
    html+=`<div class="li" style="cursor:pointer" onclick="viewMood('${m.savedAt}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><span style="font-size:1.3rem">${m.emoji}</span> <strong>${m.mood}</strong>
        <div style="font-size:.8rem;color:var(--text2)">${m.date} ${m.time}</div></div>
        <div>${m.tags?m.tags.map(t=>`<span class="tag" style="margin-left:4px">${t}</span>`).join(''):''}</div>
      </div></div>`;
  });$('recentList').innerHTML=html||'<div class="empty">暂无记录</div>';
}

function viewMood(savedAt){
  const m=moods.find(m=>m.savedAt===savedAt);if(!m)return;
  $('viewContent').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center"><h3>${m.emoji} ${m.mood}</h3>
    <button class="sec" onclick="$('viewModal').style.display='none'" style="padding:4px 8px;font-size:.8rem">✕</button></div>
    <div style="margin-top:12px;font-size:.9rem">
    <div>📅 ${m.date} ${m.time}</div>
    ${m.note?`<div style="margin-top:8px">${m.note}</div>`:''}
    ${m.tags&&m.tags.length?`<div style="margin-top:8px">${m.tags.map(t=>`<span class="tag">${t}</span> `).join('')}</div>`:''}
    </div>
    <button class="dng" style="margin-top:16px;width:100%" onclick="deleteMood('${m.savedAt}')">删除记录</button>`;
  $('viewModal').style.display='flex';
}

function deleteMood(savedAt){if(!confirm('确定删除？'))return;moods=moods.filter(m=>m.savedAt!==savedAt);save();$('viewModal').style.display='none';renderStats();renderRecent()}

init();
</script>
</body>
</html>
