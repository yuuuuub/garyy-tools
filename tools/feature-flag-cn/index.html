<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚩 功能开关</title>
<meta name="description" content="功能开关(Feature Flag)管理工具，控制功能的渐进式发布">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.flag-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
.flag-card h3{font-size:1rem;margin-bottom:6px;font-family:monospace}
.flag-meta{font-size:.8rem;color:var(--text2);margin-bottom:8px}
.toggle{position:relative;width:50px;height:26px;cursor:pointer}
.toggle input{display:none}
.toggle .slider{position:absolute;inset:0;background:var(--border);border-radius:13px;transition:.3s}
.toggle .slider::before{content:'';position:absolute;width:20px;height:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.slider{background:var(--green)}
.toggle input:checked+.slider::before{transform:translateX(24px)}
.flag-key{font-family:monospace;background:var(--bg);padding:4px 8px;border-radius:4px;font-size:.8rem;border:1px solid var(--border);display:inline-block;margin:4px 0}
.environments{display:flex;gap:6px;margin-top:6px}
.env-tag{padding:3px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.env-prod{background:rgba(248,81,73,.2);color:var(--red)}
.env-staging{background:rgba(210,153,34,.2);color:var(--yellow)}
.env-dev{background:rgba(59,130,246,.2);color:var(--accent)}
.remove-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:.85rem}
.stat-row{display:flex;gap:12px;margin-bottom:16px}
.stat-box{flex:1;text-align:center;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.stat-num{font-size:1.5rem;font-weight:700}
.stat-label{font-size:.75rem;color:var(--text2)}
.empty{text-align:center;color:var(--text2);padding:40px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){background:var(--border)}
@media(max-width:600px){body{padding:10px}.ctn{max-width:100%}.cd{padding:14px}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚩</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🚩 功能开关">
<meta property="og:description" content="功能开关(Feature Flag)管理工具">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/feature-flag-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='ff_data';
let flags=JSON.parse(localStorage.getItem(STORE)||'[]');
let filter='all';
function save(){localStorage.setItem(STORE,JSON.stringify(flags))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function render(){
  let h=`<div class="hdr"><h1>🚩 功能开关</h1><p>控制功能的渐进式发布(Feature Flags)</p></div>`;
  const enabled=flags.filter(f=>f.enabled).length;
  const disabled=flags.length-enabled;
  h+=`<div class="stat-row"><div class="stat-box"><div class="stat-num" style="color:var(--green)">${enabled}</div><div class="stat-label">已启用</div></div>`;
  h+=`<div class="stat-box"><div class="stat-num" style="color:var(--red)">${disabled}</div><div class="stat-label">已禁用</div></div>`;
  h+=`<div class="stat-box"><div class="stat-num">${flags.length}</div><div class="stat-label">总计</div></div></div>`;
  h+=`<div class="cd"><div class="flex"><button onclick="showNew()">新建开关</button>`;
  h+=`<div class="tabs" style="margin-bottom:0"><div class="tab ${filter==='all'?'active':''}" onclick="filter='all';render()">全部</div><div class="tab ${filter==='on'?'active':''}" onclick="filter='on';render()">已启用</div><div class="tab ${filter='off'?'active':''}" onclick="filter='off';render()">已禁用</div></div></div></div>`;
  const filtered=flags.filter(f=>filter==='all'||(filter==='on'&&f.enabled)||(filter==='off'&&!f.enabled));
  h+=`<div id="viewFlags"></div>`;
  $('app').innerHTML=h;
  let fh='';
  if(!filtered.length){fh=`<p class="empty">暂无功能开关</p>`}
  filtered.forEach(f=>{
    fh+=`<div class="cd"><div class="flex-between"><div>`;
    fh+=`<h3 style="font-family:monospace">${f.name}</h3>`;
    fh+=`<div class="flag-key">${f.key}</div>`;
    if(f.desc)fh+=`<div class="flag-meta">${f.desc}</div>`;
    fh+=`</div><label class="toggle"><input type="checkbox" ${f.enabled?'checked':''} onchange="toggleFlag('${f.id}')"><span class="slider"></span></label></div>`;
    fh+=`<div class="environments">`;
    (f.envs||['dev','staging','prod']).forEach(env=>{
      fh+=`<span class="env-tag env-${env}">${env}</span>`;
    });
    fh+=`</div>`;
    fh+=`<div class="bg"><span style="font-size:.8rem;color:var(--text2)">创建于 ${f.createdAt?new Date(f.createdAt).toLocaleDateString('zh-CN'):''}</span>`;
    fh+=`<button class="dng" style="padding:4px 10px;font-size:.8rem;margin-left:auto" onclick="delFlag('${f.id}')">删除</button></div></div>`;
  });
  $('viewFlags').innerHTML=fh;
}
function showNew(){
  let name=prompt('功能开关名称：');if(!name)return;
  const key=name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  const desc=prompt('描述（可选）：')||'';
  flags.push({id:uid(),name,key,desc,enabled:false,envs:['dev'],createdAt:new Date().toISOString()});
  save();render();
}
function toggleFlag(id){const f=flags.find(x=>x.id===id);if(f){f.enabled=!f.enabled;save();render()}}
function delFlag(id){if(!confirm('确定删除?'))return;flags=flags.filter(f=>f.id!==id);save();render()}
render();
</script>
</body>
</html>
