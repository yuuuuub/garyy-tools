<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="记忆大师Pro - 翻牌配对记忆游戏，支持多难度级别">
    <meta name="robots" content="index, follow">
    <title>记忆大师Pro</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="i18n.js" defer></script>
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #e17055; --secondary-color: #636e72; --success-color: #00b894; --warning-color: #fdcb6e; --danger-color: #d63031; --border-color: #dfe6e9; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a2e; --text-color: #eee; --primary-color: #fab1a0; --secondary-color: #b2bec3; --success-color: #55efc4; --warning-color: #ffeaa7; --danger-color: #ff7675; --border-color: #444; --card-bg: #16213e; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        h1 { color: var(--primary-color); text-align: center; border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { padding: 24px; border: 1px solid var(--border-color); border-radius: 12px; background: var(--card-bg); margin-bottom: 20px; text-align: center; }
        .stats { display: flex; justify-content: center; gap: 24px; margin-bottom: 16px; }
        .stat-item .num { font-size: 24px; font-weight: bold; color: var(--primary-color); }
        .stat-item .label { font-size: 12px; color: var(--secondary-color); }
        .controls { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
        .ctrl-btn { padding: 8px 16px; border: 2px solid var(--border-color); border-radius: 6px; background: var(--card-bg); color: var(--text-color); cursor: pointer; font-size: 14px; }
        .ctrl-btn.active { border-color: var(--primary-color); background: var(--primary-color); color: #fff; }
        .grid { display: grid; gap: 8px; justify-content: center; margin: 16px auto; }
        .grid-4x4 { grid-template-columns: repeat(4, 70px); }
        .grid-4x5 { grid-template-columns: repeat(5, 70px); }
        .grid-6x5 { grid-template-columns: repeat(6, 65px); }
        .tile { width: 70px; height: 70px; border-radius: 8px; border: 2px solid var(--border-color); background: var(--primary-color); color: #fff; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; user-select: none; }
        .grid-6x5 .tile { width: 65px; height: 65px; font-size: 24px; }
        .tile.flipped { background: var(--card-bg); color: var(--text-color); border-color: var(--primary-color); }
        .tile.matched { background: var(--success-color); color: #fff; border-color: var(--success-color); opacity: 0.7; pointer-events: none; }
        .tile:hover:not(.flipped):not(.matched) { transform: scale(1.05); }
        .btn { background: var(--primary-color); color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 12px; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background: var(--secondary-color); color: #fff; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .message { font-size: 18px; font-weight: bold; margin-top: 12px; min-height: 28px; color: var(--primary-color); }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>记忆大师Pro</h1>
        <div class="card">
            <div class="stats">
                <div class="stat-item"><div class="num" id="moves">0</div><div class="label">步数</div></div>
                <div class="stat-item"><div class="num" id="matches">0</div><div class="label">配对</div></div>
                <div class="stat-item"><div class="num" id="timer">0s</div><div class="label">用时</div></div>
            </div>
            <div class="controls">
                <button class="ctrl-btn active" onclick="setLevel('easy',this)">4×4 简单</button>
                <button class="ctrl-btn" onclick="setLevel('medium',this)">4×5 中等</button>
                <button class="ctrl-btn" onclick="setLevel('hard',this)">6×5 困难</button>
            </div>
            <div id="board" class="grid grid-4x4"></div>
            <div class="message" id="message"></div>
            <button class="btn" onclick="startGame()">重新开始</button>
        </div>
    </div>
    <script>
        const EMOJIS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦄','🐙','🦀','🐠','🐳','🦋','🌸','🍎','🍕','🎸','⚽','🎯','🚀','💎'];
        let level = 'easy', tiles = [], flipped = [], matched = 0, moves = 0, timerInterval = null, seconds = 0, locked = false;

        const LEVELS = { easy: { cols: 4, rows: 4, pairs: 8 }, medium: { cols: 5, rows: 4, pairs: 10 }, hard: { cols: 6, rows: 5, pairs: 15 } };

        function setLevel(lv, btn) {
            level = lv;
            document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            startGame();
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
            return a;
        }

        function startGame() {
            clearInterval(timerInterval);
            const cfg = LEVELS[level];
            const board = document.getElementById('board');
            board.className = `grid grid-${cfg.cols}x${cfg.rows}`;
            const chosen = shuffle(EMOJIS).slice(0, cfg.pairs);
            tiles = shuffle([...chosen, ...chosen]);
            flipped = []; matched = 0; moves = 0; seconds = 0; locked = false;
            document.getElementById('moves').textContent = '0';
            document.getElementById('matches').textContent = '0';
            document.getElementById('timer').textContent = '0s';
            document.getElementById('message').textContent = '';
            board.innerHTML = '';
            tiles.forEach((emoji, i) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.index = i;
                tile.textContent = '?';
                tile.onclick = () => flipTile(i, tile);
                board.appendChild(tile);
            });
            timerInterval = setInterval(() => { seconds++; document.getElementById('timer').textContent = seconds + 's'; }, 1000);
        }

        function flipTile(i, el) {
            if (locked || el.classList.contains('flipped') || el.classList.contains('matched') || flipped.length >= 2) return;
            el.classList.add('flipped');
            el.textContent = tiles[i];
            flipped.push({ i, el });
            if (flipped.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                locked = true;
                if (flipped[0].i !== flipped[1].i && tiles[flipped[0].i] === tiles[flipped[1].i]) {
                    flipped.forEach(f => f.el.classList.add('matched'));
                    matched++;
                    document.getElementById('matches').textContent = matched;
                    flipped = [];
                    locked = false;
                    const cfg = LEVELS[level];
                    if (matched === cfg.pairs) {
                        clearInterval(timerInterval);
                        document.getElementById('message').textContent = `🎉 恭喜通关！${moves}步 ${seconds}秒`;
                    }
                } else {
                    setTimeout(() => {
                        flipped.forEach(f => { f.el.classList.remove('flipped'); f.el.textContent = '?'; });
                        flipped = [];
                        locked = false;
                    }, 800);
                }
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
        }

        startGame();
    </script>
</body>
</html>
