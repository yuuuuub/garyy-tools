<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😴 睡眠追踪专业版</title>
<meta property="og:title" content="😴 睡眠追踪专业版">
<meta property="og:description" content="😴 睡眠追踪专业版 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="专业睡眠追踪器，记录睡眠时间、质量评分、分析睡眠模式">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px}
.ctn{max-width:700px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.li{padding:14px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text)}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}
.empty{text-align:center;padding:40px;color:var(--text2)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}.stat-card .num{font-size:1.6rem;font-weight:700;color:var(--accent)}.stat-card .lbl{font-size:.75rem;color:var(--text2);margin-top:4px}
.quality-stars{display:flex;gap:6px;margin-top:8px}.star{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;transition:all .2s}.star.active{background:var(--warn);border-color:var(--warn);transform:scale(1.1)}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:100px;margin-top:12px}.bar{flex:1;border-radius:4px 4px 0 0;min-height:4px;transition:height .3s}
.sleep-timeline{position:relative;height:40px;background:var(--bg);border-radius:8px;margin-top:8px;overflow:hidden}.sleep-block{position:absolute;height:100%;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--text)}
.tip-card{background:linear-gradient(135deg,rgba(139,92,246,.1),rgba(59,130,246,.1));border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😴</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>😴 睡眠追踪专业版</h1><p>了解你的睡眠模式</p></div>

<div class="tip-card" id="tip">💡 保持规律的睡眠时间有助于提高睡眠质量</div>

<div class="cd"><h2>🌙 记录睡眠</h2>
<label>日期</label><input type="date" id="sDate">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label>入睡时间</label><input type="time" id="sBedtime" value="23:00"></div>
<div><label>起床时间</label><input type="time" id="sWake" value="07:00"></div>
</div>
<label>睡眠质量评分</label><div class="quality-stars" id="qStars"></div>
<label>入睡用时</label><select id="sLatency"><option>5分钟内</option><option>5-15分钟</option><option selected>15-30分钟</option><option>30-60分钟</option><option>超过1小时</option></select>
<label>夜间醒来次数</label><select id="sWakeCount"><option selected>0次</option><option>1次</option><option>2次</option><option>3次以上</option></select>
<label>影响因素</label><div id="factors" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
<label>备注</label><textarea id="sNote" rows="2" placeholder="如：做了个好梦、喝了咖啡等"></textarea>
<div class="bg"><button onclick="saveSleep()">💾 保存记录</button></div></div>

<div class="cd"><h2>📊 睡眠统计</h2>
<div class="stats-grid" id="stats"></div>
<div style="margin-top:16px"><h3 style="font-size:.95rem;margin-bottom:8px">最近7天睡眠时长</h3><div class="bar-chart" id="weekBars"></div></div>
<div style="margin-top:16px"><h3 style="font-size:.95rem;margin-bottom:8px">睡眠时间分布</h3><div id="timeDist"></div></div>
</div>

<div class="cd"><h2>📋 最近记录</h2><div id="recentList" class="empty">暂无记录</div></div>
</div>

<div style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;justify-content:center;align-items:center" id="viewModal">
<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto" id="viewContent"></div>
</div>

<script>
const $=id=>document.getElementById(id);
let sleeps=JSON.parse(localStorage.getItem('stp_sleeps')||'[]');
const today=()=>new Date().toISOString().slice(0,10);
const save=()=>localStorage.setItem('stp_sleeps',JSON.stringify(sleeps));
let quality=3;

const factorOptions=['咖啡','酒精','运动','屏幕','压力','噪音','晚餐','冥想','药物','其他'];
const tips=['保持卧室温度在18-22°C有助于睡眠','睡前1小时避免使用电子设备','规律的作息时间是最好的安眠药','午睡不超过30分钟','睡前热水澡可以帮助放松'];

function init(){
  $('sDate').value=today();
  $('tip').textContent='💡 '+tips[Math.floor(Math.random()*tips.length)];
  createStars();createFactors();renderStats();renderRecent();
}

function createStars(){
  let html='';for(let i=1;i<=5;i++){
    const emojis=['😫','😕','😐','😊','🤩'];
    html+=`<div class="star ${i<=quality?'active':''}" onclick="setQuality(${i})">${emojis[i-1]}</div>`;
  }$('qStars').innerHTML=html;
}

function setQuality(q){quality=q;createStars()}

function createFactors(){
  let html='';factorOptions.forEach(f=>{
    html+=`<div class="tag-pill" style="padding:6px 12px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:.8rem" onclick="this.classList.toggle('active');this.style.background=this.classList.contains('active')?'var(--accent)':'';this.style.color=this.classList.contains('active')?'var(--text)':''" data-factor="${f}">${f}</div>`;
  });$('factors').innerHTML=html;
}

function calcDuration(bedtime,wake){
  const [bh,bm]=bedtime.split(':').map(Number);const [wh,wm]=wake.split(':').map(Number);
  let mins=(wh*60+wm)-(bh*60+bm);if(mins<0)mins+=1440;
  return{hours:Math.floor(mins/60),mins:mins%60,total:mins};
}

function saveSleep(){
  const bedtime=$('sBedtime').value;const wake=$('sWake').value;
  const dur=calcDuration(bedtime,wake);
  const activeFactors=[...$('factors').querySelectorAll('.active')].map(el=>el.dataset.factor);
  const data={date:$('sDate').value,bedtime,wake,duration:dur,quality,factors:activeFactors,note:$('sNote').value,
    latency:$('sLatency').value,wakeCount:$('sWakeCount').value,savedAt:new Date().toISOString()};
  const idx=sleeps.findIndex(s=>s.date===data.date);
  if(idx>=0)sleeps[idx]=data;else sleeps.push(data);
  save();renderStats();renderRecent();alert('保存成功！');
}

function renderStats(){
  const total=sleeps.length;
  const avgDur=total?Math.round(sleeps.reduce((s,x)=>s+x.duration.total,0)/total):0;
  const avgQuality=total?Math.round(sleeps.reduce((s,x)=>s+x.quality,0)/total*10)/10:0;
  const bestTime=total?getMostFrequent(sleeps.map(s=>s.bedtime)):'-';

  $('stats').innerHTML=`
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">总记录</div></div>
    <div class="stat-card"><div class="num">${Math.floor(avgDur/60)}h${avgDur%60}m</div><div class="lbl">平均时长</div></div>
    <div class="stat-card"><div class="num">${avgQuality}</div><div class="lbl">平均质量</div></div>
    <div class="stat-card"><div class="num">${bestTime}</div><div class="lbl">常见入睡</div></div>`;

  const last7=[];for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);
    const s=sleeps.find(s=>s.date===k);
    const dur=s?s.duration.total/60:0;const h=Math.min(dur/12,100);
    const color=s?(s.quality>=4?'var(--success)':s.quality>=3?'var(--warn)':'var(--danger)'):'var(--border)';
    last7.push(`<div style="flex:1;text-align:center"><div class="bar" style="height:${h}%;background:${color}"></div><div style="font-size:.65rem;color:var(--text2);margin-top:4px">${['日','一','二','三','四','五','六'][d.getDay()]}</div></div>`);
  }$('weekBars').innerHTML=last7.join('');

  const bedtimes={};sleeps.forEach(s=>{const h=s.bedtime.split(':')[0];bedtimes[h]=(bedtimes[h]||0)+1});
  let distHtml='';Object.entries(bedtimes).sort((a,b)=>a[0]-b[0]).forEach(([h,n])=>{
    const pct=Math.round(n/total*100);distHtml+=`<div style="margin-bottom:4px;display:flex;align-items:center;gap:8px;font-size:.85rem"><span style="width:50px">${h}:00</span><div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--accent);border-radius:4px"></div></div><span style="width:30px;text-align:right;color:var(--text2)">${n}</span></div>`;
  });$('timeDist').innerHTML=distHtml||'<div class="empty">暂无数据</div>';
}

function getMostFrequent(arr){const counts={};arr.forEach(x=>{counts[x]=(counts[x]||0)+1});return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'-'}

function renderRecent(){
  const sorted=[...sleeps].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  let html='';sorted.forEach(s=>{
    const emojis=['😫','😕','😐','😊','🤩'];
    html+=`<div class="li" style="cursor:pointer" onclick="viewSleep('${s.date}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><strong>${s.date}</strong><div style="font-size:.8rem;color:var(--text2)">${s.bedtime} ~ ${s.wake} (${s.duration.hours}h${s.duration.mins}m)</div></div>
        <div style="font-size:1.3rem">${emojis[s.quality-1]}</div>
      </div></div>`;
  });$('recentList').innerHTML=html||'<div class="empty">暂无记录</div>';
}

function viewSleep(date){
  const s=sleeps.find(s=>s.date===date);if(!s)return;
  const emojis=['😫','😕','😐','😊','🤩'];
  $('viewContent').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center"><h3>${emojis[s.quality-1]} ${s.date}</h3>
    <button class="sec" onclick="$('viewModal').style.display='none'" style="padding:4px 8px;font-size:.8rem">✕</button></div>
    <div style="margin-top:16px;font-size:.9rem;line-height:1.8">
    🌙 入睡: ${s.bedtime} | ⏰ 起床: ${s.wake}<br>
    ⏱️ 时长: ${s.duration.hours}小时${s.duration.mins}分钟<br>
    💤 质量: ${emojis[s.quality-1]} (${s.quality}/5)<br>
    ⏳ 入睡用时: ${s.latency}<br>
    👁️ 夜醒: ${s.wakeCount}
    ${s.factors&&s.factors.length?`<br>📋 影响因素: ${s.factors.join(', ')}`:''}
    ${s.note?`<br>📝 ${s.note}`:''}
    </div>
    <button class="dng" style="margin-top:16px;width:100%" onclick="deleteSleep('${s.date}')">删除记录</button>`;
  $('viewModal').style.display='flex';
}

function deleteSleep(date){if(!confirm('确定删除？'))return;sleeps=sleeps.filter(s=>s.date!==date);save();$('viewModal').style.display='none';renderStats();renderRecent()}

init();
</script>
</body>
</html>
