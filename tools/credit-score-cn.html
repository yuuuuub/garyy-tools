<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="信用评分模拟器 - 模拟个人信用评分计算，分析影响信用分的因素和提升建议">
    <meta name="robots" content="index, follow">
    <title>信用评分模拟器</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="i18n.js" defer></script>
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #6366f1; --secondary-color: #6b7280; --success-color: #10b981; --warning-color: #f59e0b; --danger-color: #ef4444; --border-color: #e5e7eb; --card-bg: #f9fafb; }
        [data-theme="dark"] { --bg-color: #111827; --text-color: #f9fafb; --primary-color: #818cf8; --secondary-color: #9ca3af; --success-color: #34d399; --warning-color: #fbbf24; --danger-color: #f87171; --border-color: #374151; --card-bg: #1f2937; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-top: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 12px; background: var(--card-bg); margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); color: var(--text-color); font-size: 14px; }
        input:focus { outline: 2px solid var(--primary-color); border-color: transparent; }
        button { background: var(--primary-color); color: #fff; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: opacity 0.2s; width: 100%; }
        button:hover { opacity: 0.85; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 14px; background: var(--secondary-color); color: #fff; border: none; border-radius: 8px; cursor: pointer; z-index: 100; }
        .score-display { text-align: center; padding: 30px; position: relative; }
        .score-circle { width: 180px; height: 180px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; flex-direction: column; position: relative; }
        .score-number { font-size: 48px; font-weight: 800; }
        .score-label { font-size: 14px; color: var(--secondary-color); margin-top: 4px; }
        .score-gauge { width: 100%; height: 12px; background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981); border-radius: 6px; position: relative; margin: 20px 0; }
        .score-gauge .marker { position: absolute; top: -4px; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid var(--text-color); transform: translateX(-50%); }
        .factor-bar { display: flex; align-items: center; gap: 12px; margin: 10px 0; padding: 12px; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--border-color); }
        .factor-name { width: 140px; font-weight: 600; font-size: 14px; flex-shrink: 0; }
        .factor-track { flex: 1; height: 8px; background: var(--border-color); border-radius: 4px; overflow: hidden; }
        .factor-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
        .factor-score { width: 50px; text-align: right; font-weight: 700; font-size: 14px; }
        .tip-item { padding: 12px; margin: 8px 0; background: var(--bg-color); border-radius: 8px; border-left: 4px solid var(--primary-color); }
        .tip-item.urgent { border-left-color: var(--danger-color); }
        .tip-item.good { border-left-color: var(--success-color); }
        .stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
        .stat-box { flex: 1; min-width: 120px; text-align: center; padding: 14px; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--border-color); }
        .stat-box .num { font-size: 20px; font-weight: 700; color: var(--primary-color); }
        .stat-box .lbl { font-size: 11px; color: var(--secondary-color); margin-top: 4px; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>💳 信用评分模拟器</h1>
        <p style="color:var(--secondary-color)">模拟评估个人信用状况，了解影响信用评分的关键因素</p>

        <div class="card">
            <h3>个人信息</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div><label>年龄</label><input type="number" id="age" value="32" min="18" max="80"></div>
                <div><label>工作年限</label><input type="number" id="workYears" value="8" min="0" max="50"></div>
                <div><label>月收入 (元)</label><input type="number" id="monthlyIncome" value="15000"></div>
                <div><label>学历</label>
                    <select id="education">
                        <option value="high">高中/中专</option>
                        <option value="college">大专</option>
                        <option value="bachelor" selected>本科</option>
                        <option value="master">硕士及以上</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>信贷记录</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div><label>信用卡数量</label><input type="number" id="creditCards" value="3" min="0" max="20"></div>
                <div><label>贷款笔数</label><input type="number" id="loans" value="1" min="0" max="20"></div>
                <div><label>信用历史年限</label><input type="number" id="creditHistory" value="6" min="0" max="50"></div>
                <div><label>最高信用额度 (万)</label><input type="number" id="maxCredit" value="10" step="0.5"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
                <div><label>当前使用额度 (万)</label><input type="number" id="usedCredit" value="3" step="0.5"></div>
                <div><label>逾期次数</label><input type="number" id="latePayments" value="0" min="0" max="50"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
                <div><label>近6月查询次数</label><input type="number" id="recentInquiries" value="2" min="0" max="50"></div>
                <div><label>是否有房贷</label>
                    <select id="hasMortgage"><option value="0">无</option><option value="1" selected>有</option></select>
                </div>
            </div>
            <button onclick="calculateScore()" style="margin-top:16px">计算信用评分</button>
        </div>

        <div class="card">
            <h3>信用评分</h3>
            <div class="score-display" id="scoreDisplay"></div>
            <div class="score-gauge"><div class="marker" id="gaugeMarker"></div></div>
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--secondary-color)">
                <span>350 差</span><span>550 一般</span><span>700 良好</span><span>850 优秀</span>
            </div>
        </div>

        <div class="card">
            <h3>分项评分</h3>
            <div id="factorBars"></div>
        </div>

        <div class="card">
            <h3>提升建议</h3>
            <div id="tips"></div>
        </div>

        <div class="card">
            <h3>模拟对比</h3>
            <div class="stat-row" id="simStats"></div>
        </div>
    </div>

    <script>
        function calculateScore() {
            const age = +document.getElementById('age').value;
            const workYears = +document.getElementById('workYears').value;
            const income = +document.getElementById('monthlyIncome').value;
            const education = document.getElementById('education').value;
            const creditCards = +document.getElementById('creditCards').value;
            const loans = +document.getElementById('loans').value;
            const creditHistory = +document.getElementById('creditHistory').value;
            const maxCredit = +document.getElementById('maxCredit').value * 10000;
            const usedCredit = +document.getElementById('usedCredit').value * 10000;
            const latePayments = +document.getElementById('latePayments').value;
            const recentInquiries = +document.getElementById('recentInquiries').value;
            const hasMortgage = +document.getElementById('hasMortgage').value;

            const utilizationRate = maxCredit > 0 ? usedCredit / maxCredit : 0;

            const factors = {
                '还款历史': 0,
                '信贷使用率': 0,
                '信用历史': 0,
                '信贷账户': 0,
                '新信用': 0
            };

            factors['还款历史'] = Math.max(0, 100 - latePayments * 25 - (latePayments > 3 ? 20 : 0));
            factors['信贷使用率'] = utilizationRate < 0.3 ? 95 - utilizationRate * 50 :
                utilizationRate < 0.5 ? 80 - (utilizationRate - 0.3) * 100 :
                    utilizationRate < 0.7 ? 60 - (utilizationRate - 0.5) * 100 :
                        30 - (utilizationRate - 0.7) * 50;
            factors['信贷使用率'] = Math.max(10, factors['信贷使用率']);

            factors['信用历史'] = Math.min(100, creditHistory * 8 + (age > 25 ? 10 : 0));

            const accountScore = creditCards >= 2 && creditCards <= 5 ? 90 :
                creditCards > 5 ? 90 - (creditCards - 5) * 5 : creditCards * 30;
            factors['信贷账户'] = Math.min(100, accountScore + (hasMortgage ? 10 : 0) + Math.min(loans * 5, 20));

            factors['新信用'] = recentInquiries === 0 ? 100 :
                recentInquiries <= 2 ? 85 : recentInquiries <= 5 ? 60 : 30;

            const weights = { '还款历史': 0.35, '信贷使用率': 0.30, '信用历史': 0.15, '信贷账户': 0.10, '新信用': 0.10 };
            let score = 0;
            for (const [k, v] of Object.entries(factors)) score += v * weights[k];

            const eduBonus = { high: 0, college: 3, bachelor: 6, master: 10 };
            score += eduBonus[education] || 0;
            if (income > 20000) score += 3; else if (income > 10000) score += 1;
            if (workYears > 5) score += 2;

            score = Math.max(350, Math.min(850, Math.round(score)));

            const scoreColor = score >= 750 ? '#10b981' : score >= 650 ? '#0ea5e9' : score >= 550 ? '#f59e0b' : '#ef4444';
            const scoreLabel = score >= 750 ? '优秀' : score >= 700 ? '良好' : score >= 650 ? '较好' : score >= 550 ? '一般' : '较差';
            const gaugePercent = (score - 350) / 500 * 100;

            document.getElementById('scoreDisplay').innerHTML = `
                <div class="score-circle" style="border: 6px solid ${scoreColor}">
                    <div class="score-number" style="color:${scoreColor}">${score}</div>
                    <div class="score-label">${scoreLabel}</div>
                </div>
            `;
            document.getElementById('gaugeMarker').style.left = gaugePercent + '%';

            let factorHtml = '';
            const factorColors = ['#6366f1', '#0ea5e9', '#10b981', '#f59e0b', '#8b5cf6'];
            let i = 0;
            for (const [name, val] of Object.entries(factors)) {
                const color = val >= 80 ? '#10b981' : val >= 60 ? '#f59e0b' : '#ef4444';
                factorHtml += `<div class="factor-bar">
                    <div class="factor-name">${name}</div>
                    <div class="factor-track"><div class="factor-fill" style="width:${val}%;background:${color}"></div></div>
                    <div class="factor-score" style="color:${color}">${val.toFixed(0)}</div>
                </div>`;
                i++;
            }
            document.getElementById('factorBars').innerHTML = factorHtml;

            const tips = [];
            if (latePayments > 0) tips.push({ urgent: true, text: `⚠️ 您有${latePayments}次逾期记录，这是影响信用评分最大的因素。请确保所有账单按时还款。` });
            if (utilizationRate > 0.5) tips.push({ urgent: true, text: `⚠️ 信贷使用率${(utilizationRate * 100).toFixed(0)}%偏高，建议控制在30%以下。可申请提高额度或减少使用。` });
            if (recentInquiries > 3) tips.push({ urgent: false, text: `📌 近期查询次数较多(${recentInquiries}次)，短期内避免申请新信贷。` });
            if (creditCards > 6) tips.push({ urgent: false, text: `📌 您有${creditCards}张信用卡，过多信用卡可能影响评分，建议注销不常用的卡。` });
            if (creditHistory < 5) tips.push({ urgent: false, text: `📌 信用历史较短(${creditHistory}年)，保持现有账户正常使用可逐步提升。` });
            tips.push({ urgent: false, good: true, text: `✅ 按时还款是提升信用评分最有效的方式，保持良好还款习惯。` });
            tips.push({ urgent: false, good: true, text: `✅ 定期查询个人信用报告，及时发现并纠正错误信息。` });

            document.getElementById('tips').innerHTML = tips.map(t =>
                `<div class="tip-item ${t.urgent ? 'urgent' : t.good ? 'good' : ''}">${t.text}</div>`
            ).join('');

            const scenarios = [
                { label: '当前', score },
                { label: '还清贷款', score: Math.min(850, score + Math.round(loans * 3 + 5)) },
                { label: '无逾期', score: Math.min(850, score + latePayments * 20) },
                { label: '使用率降至20%', score: Math.min(850, score + Math.round(Math.max(0, (utilizationRate - 0.2) * 60))) },
                { label: '全部优化', score: Math.min(850, score + latePayments * 20 + Math.round(Math.max(0, (utilizationRate - 0.2) * 60)) + loans * 3 + 10) }
            ];
            document.getElementById('simStats').innerHTML = scenarios.map(s => `
                <div class="stat-box"><div class="num" style="color:${s.score >= 750 ? 'var(--success-color)' : s.score >= 650 ? 'var(--primary-color)' : 'var(--warning-color)'}">${s.score}</div><div class="lbl">${s.label}</div></div>
            `).join('');
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        calculateScore();
    </script>
</body>
</html>
