<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行业板块分析</title>
<meta name="description" content="A股行业板块涨跌分析，追踪板块资金流向和估值水平">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#f59e0b;--purple:#a855f7;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
.container{max-width:900px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.sector-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sector-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s}
.sector-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.sector-card.top{border-color:var(--green)}
.sector-card.bottom{border-color:var(--red)}
.sector-name{font-weight:600;font-size:.9rem;margin-bottom:6px}
.sector-change{font-size:1.1rem;font-weight:700}
.sector-meta{font-size:.75rem;color:var(--text2);margin-top:4px}
.sector-bar{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.sector-bar-fill{height:100%;border-radius:2px;transition:width .6s}
.sort-tabs{display:flex;gap:6px;margin-bottom:12px}
.sort-tab{padding:5px 12px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;cursor:pointer;background:var(--card);color:var(--text2);transition:all .2s}
.sort-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:10px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--border)}
th{color:var(--text2);font-weight:500;background:var(--bg)}
td:first-child,th:first-child{text-align:left}
.up{color:var(--green)}.down{color:var(--red)}
.detail-panel{display:none;margin-top:10px}
.detail-panel.show{display:block}
.detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.close-btn{background:none;border:none;color:var(--text2);font-size:1.2rem;cursor:pointer}
.close-btn:hover{color:var(--red)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏭</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="行业板块分析">
<meta property="og:description" content="A股行业板块涨跌分析工具">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🏭 行业板块分析</h1>
    <p>追踪A股行业板块涨跌与资金流向</p>
  </header>
  <div class="card">
    <div class="sort-tabs" id="sortTabs">
      <span class="sort-tab active" data-s="change">涨跌幅</span>
      <span class="sort-tab" data-s="flow">资金流向</span>
      <span class="sort-tab" data-s="pe">市盈率</span>
      <span class="sort-tab" data-s="turnover">换手率</span>
    </div>
    <div class="sector-grid" id="sectorGrid"></div>
  </div>
  <div class="card detail-panel" id="detailPanel">
    <div class="detail-header"><b id="detailTitle"></b><button class="close-btn" onclick="document.getElementById('detailPanel').classList.remove('show')">&times;</button></div>
    <div id="detailContent"></div>
  </div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const sectors=[
  {name:'白酒',change:1.85,flow:12.5,pe:28.2,turnover:1.82,count:18,leaders:['贵州茅台','五粮液','泸州老窖'],laggards:['水井坊','金种子酒']},
  {name:'新能源车',change:2.35,flow:28.3,pe:35.6,turnover:3.45,count:42,leaders:['比亚迪','宁德时代','长城汽车'],laggards:['众泰汽车','北汽蓝谷']},
  {name:'半导体',change:-0.82,flow:-5.2,pe:48.5,turnover:4.12,count:65,leaders:['中芯国际','韦尔股份','北方华创'],laggards:['华天科技','通富微电']},
  {name:'银行',change:0.52,flow:8.7,pe:5.8,turnover:0.85,count:42,leaders:['招商银行','工商银行','建设银行'],laggards:['郑州银行','青农商行']},
  {name:'房地产',change:-1.45,flow:-15.6,pe:8.2,turnover:2.34,count:120,leaders:['万科A','保利发展','华润置地'],laggards:['ST阳光城','华夏幸福']},
  {name:'医药生物',change:0.68,flow:3.2,pe:25.8,turnover:1.95,count:380,leaders:['恒瑞医药','药明康德','迈瑞医疗'],laggards:['ST长康','退市辅仁']},
  {name:'光伏',change:-2.15,flow:-18.9,pe:22.5,turnover:3.78,count:45,leaders:['隆基绿能','通威股份','阳光电源'],laggards:['亿晶光电','东方日升']},
  {name:'人工智能',change:3.12,flow:35.8,pe:62.3,turnover:5.62,count:88,leaders:['科大讯飞','海光信息','中科曙光'],laggards:['ST高升']},
  {name:'白酒二线',change:1.25,flow:5.6,pe:22.8,turnover:2.15,count:15,leaders:['山西汾酒','洋河股份','古井贡酒'],laggards:['金徽酒']},
  {name:'消费电子',change:1.55,flow:8.9,pe:28.5,turnover:3.22,count:35,leaders:['立讯精密','歌尔股份','传音控股'],laggards:['共达电声']},
  {name:'军工',change:0.95,flow:6.8,pe:55.2,turnover:2.88,count:68,leaders:['中航沈飞','航发动力','紫光国微'],laggards:['天奥电子']},
  {name:'证券',change:1.88,flow:22.5,pe:18.5,turnover:4.56,count:50,leaders:['中信证券','东方财富','华泰证券'],laggards:['锦龙股份']},
  {name:'人工智能芯片',change:2.78,flow:18.2,pe:78.5,turnover:6.12,count:25,leaders:['海光信息','寒武纪','景嘉微'],laggards:['ST左江']},
  {name:'新能源',change:1.42,flow:15.6,pe:25.8,turnover:2.68,count:55,leaders:['阳光电源','金风科技','明阳智能'],laggards:['中利集团']},
  {name:'食品饮料',change:0.88,flow:4.5,pe:32.5,turnover:1.72,count:72,leaders:['海天味业','伊利股份','双汇发展'],laggards:['西王食品']},
  {name:'保险',change:0.65,flow:5.2,pe:9.8,turnover:1.15,count:6,leaders:['中国平安','中国人寿','中国太保'],laggards:['天茂集团']},
  {name:'通信',change:1.15,flow:7.8,pe:35.2,turnover:2.45,count:48,leaders:['中兴通讯','中国移动','中国联通'],laggards:['信维通信']},
  {name:'汽车零部件',change:0.42,flow:2.1,pe:22.8,turnover:2.05,count:85,leads:['拓普集团','福耀玻璃','均胜电子'],laggards:['威帝股份']}
];
let sort='change';
const maxAbs=Math.max(...sectors.map(s=>Math.max(Math.abs(s.change),Math.abs(s.flow)/5)));
document.querySelectorAll('.sort-tab').forEach(t=>{
  t.onclick=()=>{document.querySelectorAll('.sort-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');sort=t.dataset.s;renderGrid();};
});
function renderGrid(){
  const sorted=[...sectors].sort((a,b)=>{
    switch(sort){
      case'change':return b.change-a.change;
      case'flow':return b.flow-a.flow;
      case'pe':return a.pe-b.pe;
      case'turnover':return b.turnover-a.turnover;
    }
  });
  let h='';
  sorted.forEach((s,i)=>{
    const isTop=i<3;const isBottom=i>=sorted.length-3;
    const cls=isTop?'top':isBottom?'bottom':'';
    const changeColor=s.change>=0?'var(--green)':'var(--red)';
    const barWidth=Math.abs(s.change)/3*100;
    h+=`<div class="sector-card ${cls}" onclick="showDetail('${s.name}')">
      <div class="sector-name">${s.name}</div>
      <div class="sector-change" style="color:${changeColor}">${s.change>=0?'+':''}${s.change.toFixed(2)}%</div>
      <div class="sector-meta">资金: ${s.flow>=0?'+':''}${s.flow.toFixed(1)}亿 | PE: ${s.pe} | 换手: ${s.turnover}%</div>
      <div class="sector-bar"><div class="sector-bar-fill" style="width:${barWidth}%;background:${changeColor}"></div></div>
    </div>`;
  });
  $('sectorGrid').innerHTML=h;
}
window.showDetail=function(name){
  const s=sectors.find(x=>x.name===name);
  if(!s)return;
  $('detailPanel').classList.add('show');
  $('detailTitle').textContent=s.name+'板块详情';
  const changeColor=s.change>=0?'var(--green)':'var(--red)';
  let h=`<table><tr><td>涨跌幅</td><td class="${s.change>=0?'up':'down'}" style="font-weight:700">${s.change>=0?'+':''}${s.change.toFixed(2)}%</td></tr>`;
  h+=`<tr><td>资金流向</td><td class="${s.flow>=0?'up':'down'}">${s.flow>=0?'+':''}${s.flow.toFixed(1)}亿</td></tr>`;
  h+=`<tr><td>市盈率</td><td>${s.pe}</td></tr>`;
  h+=`<tr><td>换手率</td><td>${s.turnover}%</td></tr>`;
  h+=`<tr><td>成分股数</td><td>${s.count}只</td></tr>`;
  h+=`<tr><td>领涨股</td><td class="up">${s.leaders.join('、')}</td></tr>`;
  h+=`<tr><td>领跌股</td><td class="down">${(s.laggards||[]).join('、')}</td></tr>`;
  h+='</table>';
  // Mini bar
  h+='<div style="margin-top:10px">';
  h+=`<div style="font-size:.8rem;color:var(--text2);margin-bottom:4px">涨跌幅可视化</div>`;
  h+=`<div style="display:flex;align-items:center;gap:6px"><div style="flex:1;height:12px;background:var(--border);border-radius:6px;overflow:hidden"><div style="height:100%;width:${Math.abs(s.change)/3*100}%;background:${changeColor};border-radius:6px"></div></div><span style="font-size:.8rem;font-weight:600;color:${changeColor}">${s.change>=0?'+':''}${s.change.toFixed(2)}%</span></div>`;
  h+='</div>';
  $('detailContent').innerHTML=h;
};
renderGrid();
})();
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
