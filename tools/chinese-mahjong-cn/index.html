<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国麻将</title><meta name="description" content="中国麻将 - 单人麻将消消乐游戏"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#d29922;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin:4px}.btn:hover{opacity:.85}.btn-group{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}.board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:500px;margin:16px auto}.tile{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:linear-gradient(135deg,#f5f0e1,#e8dcc8);border:2px solid #c4b896;border-radius:8px;cursor:pointer;transition:all .2s;box-shadow:0 2px 4px rgba(0,0,0,.3);user-select:none}.tile:hover{transform:translateY(-3px);box-shadow:0 4px 8px rgba(0,0,0,.4)}.tile.selected{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.4);transform:translateY(-5px)}.tile.matched{opacity:.3;pointer-events:none;transform:scale(.8)}.tile .num{font-size:.6rem;position:absolute;bottom:2px;color:#666}.stats{display:flex;gap:16px;justify-content:center;margin:12px 0}.stat{text-align:center}.stat .num{font-size:1.3rem;font-weight:700;color:var(--blue)}.stat .lbl{font-size:.7rem;color:var(--text2)}.mode-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}.mode-tab{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text2);font-size:.85rem}.mode-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.timer{font-size:1.1rem;color:var(--yellow);text-align:center;margin:8px 0}.combo{font-size:1.2rem;color:var(--green);text-align:center;margin:8px 0;display:none}.combo.show{display:block;animation:pop .3s ease-out}@keyframes pop{0%{transform:scale(0.5)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="中国麻将"><meta property="og:description" content="中国麻将 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🀄</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🀄 中国麻将</h1><p class="sub">单人麻将消消乐游戏</p>
<div class="card">
<div class="mode-tabs">
<div class="mode-tab active" onclick="setMode('classic',this)">经典模式</div>
<div class="mode-tab" onclick="setMode('timed',this)">限时挑战</div>
<div class="mode-tab" onclick="setMode('zen',this)">休闲模式</div>
</div>
<div class="btn-group">
<button class="btn" onclick="newGame()">新游戏</button>
<button class="btn" onclick="shuffleTiles()">洗牌</button>
<button class="btn" onclick="undoMove()">撤回</button>
<button class="btn" onclick="addHint()">提示</button>
</div>
<div class="timer" id="timerDisplay">⏱ 00:00</div>
<div class="combo" id="comboDisplay"></div>
<div class="stats">
<div class="stat"><div class="num" id="pairs">0</div><div class="lbl">已配对</div></div>
<div class="stat"><div class="num" id="remaining">0</div><div class="lbl">剩余</div></div>
<div class="stat"><div class="num" id="moves">0</div><div class="lbl">步数</div></div>
</div>
<div class="board" id="board"></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var tileTypes=['🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏','🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡','🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘','🀀','🀁','🀂','🀃','🀄','🀅','🀆'];
var tileNames=['一万','二万','三万','四万','五万','六万','七万','八万','九万','一条','二条','三条','四条','五条','六条','七条','八条','九条','一饼','二饼','三饼','四饼','五饼','六饼','七饼','八饼','九饼','东','南','西','北','中','发','白'];
var mode='classic',tiles=[],selected=null,pairCount=0,moveCount=0,combo=0,maxCombo=0,timerInterval=null,elapsed=0,tileRows=6,tileCols=10,history=[],timeLimit=300,gameOver=false;
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function setMode(m,el){mode=m;document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');newGame();}
function newGame(){
clearInterval(timerInterval);elapsed=0;pairCount=0;moveCount=0;combo=0;maxCombo=0;selected=null;history=[];gameOver=false;
if(mode==='timed'){timeLimit=180;}
var totalTiles=tileRows*tileCols;
var numPairs=Math.floor(totalTiles/2);
var chosen=shuffle(tileTypes).slice(0,numPairs);
var tileArr=[];chosen.forEach(function(t,i){tileArr.push({type:t,name:tileNames[tileTypes.indexOf(t)],id:i});tileArr.push({type:t,name:tileNames[tileTypes.indexOf(t)],id:i});});
tiles=shuffle(tileArr);
renderBoard();updateStats();
document.getElementById('timerDisplay').textContent='⏱ 00:00';
document.getElementById('comboDisplay').className='combo';
startTimer();
}
function renderBoard(){
var board=document.getElementById('board');
board.style.gridTemplateColumns='repeat('+tileCols+',1fr)';
var html='';
tiles.forEach(function(tile,i){
var matched=tile.matched?'matched':'';
var sel=selected===i?'selected':'';
html+='<div class="tile '+matched+' '+sel+'" data-idx="'+i+'" onclick="clickTile('+i+')">'+(tile.matched?'':tile.type)+'</div>';
});
board.innerHTML=html;
}
function clickTile(i){
if(gameOver||tiles[i].matched)return;
if(selected===null){
selected=i;renderBoard();
}else if(selected===i){
selected=null;renderBoard();
}else{
moveCount++;
if(tiles[selected].type===tiles[i].type){
tiles[selected].matched=true;tiles[i].matched=true;
pairCount++;combo++;
if(combo>maxCombo)maxCombo=combo;
history.push([selected,i]);
selected=null;
showCombo();
}else{
combo=0;selected=null;
}
renderBoard();updateStats();
if(pairCount===tiles.length/2){
clearInterval(timerInterval);
setTimeout(function(){alert('🎉 恭喜通关！\n用时：'+formatTime(elapsed)+'\n步数：'+moveCount+'\n最高连击：'+maxCombo);},300);
}
}
}
function showCombo(){
if(combo>=2){
var el=document.getElementById('comboDisplay');
el.textContent='🔥 '+combo+' 连击！';
el.className='combo show';
setTimeout(function(){el.className='combo';},1500);
}
}
function shuffleTiles(){
var unmatched=tiles.filter(function(t){return !t.matched;});
var unmatchedIdx=[];tiles.forEach(function(t,i){if(!t.matched)unmatchedIdx.push(i);});
var vals=unmatched.map(function(t){return t.type;});
vals=shuffle(vals);
unmatchedIdx.forEach(function(idx,i){tiles[idx].type=vals[i];tiles[idx].name=tileNames[tileTypes.indexOf(vals[i])];});
renderBoard();
}
function undoMove(){
if(history.length===0)return;
var last=history.pop();
tiles[last[0]].matched=false;tiles[last[1]].matched=false;
pairCount--;moveCount++;
renderBoard();updateStats();
}
function addHint(){
var unmatchedIdx=[];tiles.forEach(function(t,i){if(!t.matched)unmatchedIdx.push(i);});
for(var i=0;i<unmatchedIdx.length-1;i++){
for(var j=i+1;j<unmatchedIdx.length;j++){
if(tiles[unmatchedIdx[i]].type===tiles[unmatchedIdx[j]].type){
var ci=unmatchedIdx[i],cj=unmatchedIdx[j];
document.querySelector('[data-idx="'+ci+'"]').style.border='3px solid var(--yellow)';
document.querySelector('[data-idx="'+cj+'"]').style.border='3px solid var(--yellow)';
setTimeout(function(){document.querySelectorAll('.tile').forEach(function(el){el.style.border='';});},2000);
return;
}
}
}
}
function startTimer(){
timerInterval=setInterval(function(){
elapsed++;
if(mode==='timed'){
var rem=timeLimit-elapsed;
document.getElementById('timerDisplay').textContent='⏱ '+formatTime(rem>0?rem:0);
if(rem<=0){clearInterval(timerInterval);gameOver=true;alert('⏰ 时间到！已配对 '+pairCount+' 对');}
}else{
document.getElementById('timerDisplay').textContent='⏱ '+formatTime(elapsed);
}
},1000);
}
function formatTime(s){var m=Math.floor(s/60);var sec=s%60;return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;}
function updateStats(){
document.getElementById('pairs').textContent=pairCount;
document.getElementById('remaining').textContent=tiles.length/2-pairCount;
document.getElementById('moves').textContent=moveCount;
}
newGame();
</script></body></html>
