<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏖️ 暑期旅行推荐 - Gary's Tools</title>
<meta name="description" content="2026暑假旅行目的地推荐，国内避暑/海岛/文化/亲子游，含最佳旅行时间和预算参考">
<style>
:root{--bg:#f0fdf4;--card:#fff;--text:#1a2e1a;--text2:#6b7280;--blue:#2563eb;--teal:#0d9488;--orange:#ea580c;--pink:#db2777;--green:#16a34a;--border:#bbf7d0;--radius:14px}
[data-theme="dark"]{--bg:#0a1a10;--card:#122018;--text:#e0f0e0;--text2:#9ca3af;--border:#1a3a20}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#2563eb,#0d9488,#16a34a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.82rem;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s}
.tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.dest-card{position:relative;overflow:hidden}
.dest-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dest-icon{font-size:2rem;width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0}
.dest-name{font-size:1.1rem;font-weight:800}
.dest-subtitle{font-size:.75rem;color:var(--text2)}
.dest-tags{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.dest-tag{padding:4px 10px;border-radius:12px;font-size:.7rem;font-weight:500}
.tag-temp{background:rgba(37,99,235,.1);color:var(--blue)}
.tag-budget{background:rgba(22,163,74,.1);color:var(--green)}
.tag-type{background:rgba(13,148,136,.1);color:var(--teal)}
.dest-detail{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.dest-stat{background:var(--bg);border-radius:8px;padding:8px;text-align:center;font-size:.78rem}
.dest-stat .val{font-weight:700;display:block}
.dest-stat .lab{font-size:.65rem;color:var(--text2)}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🏖️ 暑期旅行推荐 - Gary's Tools">
  <meta property="og:description" content="2026暑假旅行目的地推荐，国内避暑/海岛/文化/亲子游，含最佳旅行时间和预算参考">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/summer-travel/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<header>
<h1>🏖️ 暑期旅行推荐</h1>
<p>2026暑假去哪玩 · 精选目的地攻略</p>
</header>

<div class="tabs" id="tabs">
<button class="tab active" data-c="all">全部</button>
<button class="tab" data-c="cool">❄️ 避暑</button>
<button class="tab" data-c="island">🏝️ 海岛</button>
<button class="tab" data-c="culture">🏛️ 文化</button>
<button class="tab" data-c="family">👨‍👩‍👧‍👦 亲子</button>
</div>

<div id="destList"></div>

<div class="card">
<h2>🧳 旅行打包清单（根据目的地勾选）</h2>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px" id="packCats"></div>
<div style="margin-bottom:8px">
<div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--text2)"><span>打包进度</span><span id="packProgress">0%</span></div>
<div style="width:100%;height:6px;background:var(--bg);border-radius:3px;overflow:hidden"><div id="packBar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:3px;transition:width .3s"></div></div>
</div>
<div id="packList" style="display:flex;flex-direction:column;gap:4px;max-height:350px;overflow-y:auto"></div>
<div style="display:flex;gap:8px;margin-top:8px">
<button id="packReset" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:.72rem;cursor:pointer;font-family:inherit">🔄 重置清单</button>
<button id="packClear" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:.72rem;cursor:pointer;font-family:inherit">🗑️ 清除勾选</button>
</div>
</div>

<footer>旅行愉快 · 注意安全 ✈️</footer>
</div>

<script>
const DESTINATIONS=[
{name:'大理',icon:'🏔️',sub:'云南 · 风花雪月',cats:['cool','culture'],temp:'18-26°C',budget:'3000-5000元',days:'4-6天',bestMonth:'6-8月',features:'苍山洱海 古城漫步 白族文化 环湖骑行',color:'#2563eb'},
{name:'青岛',icon:'🌊',sub:'山东 · 啤酒之都',cats:['cool','family'],temp:'22-28°C',budget:'2500-4000元',days:'3-5天',bestMonth:'7-8月',features:'海滨浴场 啤酒节 八大关 海鲜大餐',color:'#0d9488'},
{name:'三亚',icon:'🏝️',sub:'海南 · 东方夏威夷',cats:['island','family'],temp:'28-33°C',budget:'4000-8000元',days:'5-7天',bestMonth:'6-9月',features:'阳光沙滩 潜水 免税购物 热带雨林',color:'#ea580c'},
{name:'呼伦贝尔',icon:'🌿',sub:'内蒙古 · 草原天堂',cats:['cool','family'],temp:'16-28°C',budget:'3000-5000元',days:'5-7天',bestMonth:'7-8月',features:'大草原 骑马 蒙古包 烤全羊 星空露营',color:'#16a34a'},
{name:'成都',icon:'🐼',sub:'四川 · 美食之都',cats:['culture','family'],temp:'23-30°C',budget:'2500-4000元',days:'3-5天',bestMonth:'6-9月',features:'熊猫基地 火锅串串 宽窄巷子 都江堰',color:'#db2777'},
{name:'厦门',icon:'🏖️',sub:'福建 · 文艺清新',cats:['island','culture'],temp:'26-32°C',budget:'2500-4000元',days:'3-5天',bestMonth:'6-9月',features:'鼓浪屿 环岛路 沙茶面 曾厝垵 植物园',color:'#2563eb'},
{name:'长白山',icon:'⛰️',sub:'吉林 · 神奇天池',cats:['cool'],temp:'12-22°C',budget:'3000-5000元',days:'4-6天',bestMonth:'7-8月',features:'天池 温泉 原始森林 漂流 22℃夏天',color:'#0d9488'},
{name:'西安',icon:'🏛️',sub:'陕西 · 十三朝古都',cats:['culture','family'],temp:'25-35°C',budget:'2000-3500元',days:'3-5天',bestMonth:'6-8月',features:'兵马俑 古城墙 回民街 大唐不夜城 历史',color:'#ea580c'},
{name:'杭州',icon:'🪷',sub:'浙江 · 人间天堂',cats:['culture','cool'],temp:'25-33°C',budget:'2500-4000元',days:'3-5天',bestMonth:'6-8月',features:'西湖荷花 灵隐寺 龙井茶 宋城 丝绸',color:'#16a34a'},
{name:'贵州',icon:'🏞️',sub:'山水秘境',cats:['cool','family'],temp:'20-28°C',budget:'2500-4000元',days:'4-6天',bestMonth:'7-8月',features:'黄果树瀑布 千户苗寨 荔波 酸汤鱼 避暑',color:'#db2777'},
{name:'桂林',icon:'🛶',sub:'广西 · 山水甲天下',cats:['culture','family'],temp:'26-33°C',budget:'2500-4000元',days:'4-5天',bestMonth:'6-9月',features:'漓江竹筏 阳朔 象鼻山 米粉 溶洞',color:'#2563eb'},
{name:'阿勒泰',icon:'🏔️',sub:'新疆 · 北疆秘境',cats:['cool'],temp:'15-28°C',budget:'5000-8000元',days:'7-10天',bestMonth:'7-8月',features:'喀纳斯 禾木村 草原花海 星空 烤肉',color:'#0d9488'},
];

let activeCat='all';

function render(){
const filtered=activeCat==='all'?DESTINATIONS:DESTINATIONS.filter(d=>d.cats.includes(activeCat));
document.getElementById('destList').innerHTML=filtered.map(d=>`
<div class="card dest-card">
<div class="dest-header">
<div class="dest-icon" style="background:${d.color}15">${d.icon}</div>
<div>
<div class="dest-name">${d.name}</div>
<div class="dest-subtitle">${d.sub}</div>
</div>
</div>
<div class="dest-tags">
<span class="dest-tag tag-temp">🌡️ ${d.temp}</span>
<span class="dest-tag tag-budget">💰 ${d.budget}</span>
<span class="dest-tag tag-type">📅 ${d.bestMonth}</span>
</div>
<div class="dest-detail">
<div class="dest-stat"><span class="val">${d.days}</span><span class="lab">建议天数</span></div>
<div class="dest-stat"><span class="val">${d.budget}</span><span class="lab">人均预算</span></div>
</div>
<div style="font-size:.8rem;color:var(--text2);margin-top:8px;line-height:1.5">🌟 ${d.features}</div>
</div>`).join('');
}

document.getElementById('tabs').addEventListener('click',e=>{
if(!e.target.classList.contains('tab'))return;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
e.target.classList.add('active');
activeCat=e.target.dataset.c;
render();
});

render();

// 🧳 旅行打包清单
const packData={证件资料:{items:['身份证/护照','驾驶证','机票/火车票','酒店预订确认单','旅行保险单','签证/复印件']},衣物:{items:['T恤/上衣×3-5','短裤/长裤×2-3','内衣裤×天数','袜子×天数','防晒外套/薄开衫','泳衣(海岛)','舒适运动鞋','拖鞋/凉鞋','遮阳帽','睡衣']},洗护用品:{items:['防晒霜(高倍数)','洗发水/沐浴露','牙刷/牙膏','毛巾/浴巾','湿纸巾','免洗洗手液','驱蚊液','创可贴/常用药']},电子产品:{items:['手机+充电器','充电宝(20000mAh)','耳机/降噪耳机','相机/GoPro','转换插头','数据线×2','移动WiFi/流量卡']},其他:{items:['水杯/保温杯','折叠伞','小背包/斜挎包','零食/干粮','眼罩/耳塞','塑料袋/防水袋','折叠坐垫','现金(备用)']}};
const packKeys=Object.keys(packData);
let activePackCat=packKeys[0];

function initPacking(){
  const catsEl=document.getElementById('packCats');
  catsEl.innerHTML=packKeys.map(k=>'<button class="packCatBtn" data-pk="'+k+'" style="padding:6px 12px;border-radius:14px;border:1px solid var(--border);background:'+(k===activePackCat?'var(--teal)':'var(--card)')+';color:'+(k===activePackCat?'#fff':'var(--text2)')+';font-size:.72rem;cursor:pointer;font-family:inherit;font-weight:'+(k===activePackCat?'700':'400')+'">'+k+'</button>').join('');
  renderPackList();

  catsEl.addEventListener('click',function(e){
    const btn=e.target.closest('.packCatBtn');
    if(!btn)return;
    activePackCat=btn.dataset.pk;
    document.querySelectorAll('.packCatBtn').forEach(b=>{b.style.background='var(--card)';b.style.color='var(--text2)';b.style.fontWeight='400';});
    btn.style.background='var(--teal)';btn.style.color='#fff';btn.style.fontWeight='700';
    renderPackList();
  });

  document.getElementById('packReset').addEventListener('click',function(){if(confirm('确认重置所有打包清单？')){localStorage.removeItem('travelPack');renderPackList();}});
  document.getElementById('packClear').addEventListener('click',function(){if(confirm('清除所有勾选？')){localStorage.setItem('travelPack','[]');renderPackList();}});
}

function renderPackList(){
  const saved=JSON.parse(localStorage.getItem('travelPack')||'[]');
  const items=packData[activePackCat].items;
  const container=document.getElementById('packList');
  container.innerHTML=items.map((item,i)=>{
    const id=activePackCat+'_'+i;
    const checked=saved.includes(id);
    return '<label style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg);border-radius:6px;cursor:pointer;font-size:.8rem;'+(checked?'opacity:.55':'')+'"><input type="checkbox" data-pid="'+id+'" '+(checked?'checked':'')+' style="width:16px;height:16px;accent-color:var(--teal);cursor:pointer;flex-shrink:0"><span style="'+(checked?'text-decoration:line-through':'')+'">'+item+'</span></label>';
  }).join('');
  updatePackProgress();
  container.addEventListener('change',function(e){
    if(e.target.type!=='checkbox')return;
    const pid=e.target.dataset.pid;
    let s=JSON.parse(localStorage.getItem('travelPack')||'[]');
    if(e.target.checked){if(!s.includes(pid))s.push(pid);}else{s=s.filter(v=>v!==pid);}
    localStorage.setItem('travelPack',JSON.stringify(s));
    const lb=e.target.closest('label');
    if(lb){lb.style.opacity=e.target.checked?'.55':'1';lb.querySelector('span').style.textDecoration=e.target.checked?'line-through':'none';}
    updatePackProgress();
  });
}

function updatePackProgress(){
  const allItems=packKeys.reduce((sum,k)=>sum+packData[k].items.length,0);
  const saved=JSON.parse(localStorage.getItem('travelPack')||'[]');
  const pct=allItems?Math.round(saved.length/allItems*100):0;
  document.getElementById('packProgress').textContent=saved.length+'/'+allItems+' ('+pct+'%)';
  document.getElementById('packBar').style.width=pct+'%';
}

initPacking();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
