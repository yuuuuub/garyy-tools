<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字识别训练 - 在线汉字识别练习</title>
<meta name="description" content="汉字识别训练 - 通过闪卡和识别游戏提高汉字识别能力">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>">
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --blue: #3b82f6;
  --green: #238636;
  --red: #ef4444;
  --radius: 10px;
  --transition: 0.2s ease;
}
[data-theme="light"] {
  --bg: #f6f8fa;
  --card: #fff;
  --border: #d0d7de;
  --text: #1f2328;
  --text2: #656d76;
  --blue: #0969da;
  --green: #1a7f37;
  --red: #cf222e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  padding: 16px;
}
.container { max-width: 800px; margin: auto; }
h1 { text-align: center; padding: 24px 0 8px; font-size: 1.5rem; }
.sub { text-align: center; color: var(--text2); font-size: .85rem; margin-bottom: 20px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.btn {
  display: inline-block;
  padding: 10px 24px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: .9rem;
  margin-top: 12px;
  transition: var(--transition);
}
.btn:hover { opacity: .85; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.btn-secondary { background: var(--border); color: var(--text); }
.flashcard-container {
  perspective: 1000px;
  margin: 20px 0;
}
.flashcard {
  width: 200px;
  height: 200px;
  margin: 0 auto;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s;
  cursor: pointer;
}
.flashcard.flipped {
  transform: rotateY(180deg);
}
.flashcard-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  border: 2px solid var(--border);
}
.flashcard-front {
  background: var(--bg);
  font-size: 6rem;
}
.flashcard-back {
  background: var(--card);
  transform: rotateY(180deg);
  flex-direction: column;
  gap: 10px;
}
.flashcard-pinyin {
  font-size: 1.5rem;
  color: var(--blue);
}
.flashcard-meaning {
  font-size: 1rem;
  color: var(--text2);
}
.recognition-area {
  text-align: center;
  margin: 20px 0;
}
.recognition-char {
  font-size: 8rem;
  margin: 20px 0;
  transition: all 0.3s;
}
.recognition-input {
  width: 100%;
  max-width: 300px;
  padding: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 1.2rem;
  text-align: center;
  color: var(--text);
  margin: 16px 0;
}
.recognition-input:focus {
  outline: none;
  border-color: var(--blue);
}
.options-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  max-width: 400px;
  margin: 0 auto;
}
.option-btn {
  padding: 16px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  transition: var(--transition);
  text-align: center;
}
.option-btn:hover {
  border-color: var(--blue);
  background: var(--card);
}
.option-btn.correct {
  background: rgba(35,134,54,0.2);
  border-color: var(--green);
  color: var(--green);
}
.option-btn.wrong {
  background: rgba(239,68,68,0.2);
  border-color: var(--red);
  color: var(--red);
}
.stats {
  display: flex;
  justify-content: space-around;
  margin: 16px 0;
  font-size: .9rem;
}
.stat { text-align: center; }
.stat-value { font-size: 1.2rem; font-weight: bold; color: var(--blue); }
.mode-select {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
.mode-btn {
  padding: 8px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: .85rem;
  transition: var(--transition);
}
.mode-btn:hover {
  border-color: var(--blue);
}
.mode-btn.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin: 12px 0;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--green);
  transition: width 0.3s;
  border-radius: 3px;
}
.char-list {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  margin: 16px 0;
}
.char-item {
  padding: 8px;
  text-align: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: var(--transition);
  font-size: 1.2rem;
}
.char-item:hover {
  border-color: var(--blue);
  background: var(--card);
}
.char-item.mastered {
  background: rgba(35,134,54,0.1);
  border-color: var(--green);
}
.char-item.learning {
  background: rgba(59,130,246,0.1);
  border-color: var(--blue);
}
.char-item.new {
  background: var(--bg);
}
.progress-info {
  display: flex;
  justify-content: space-between;
  margin: 12px 0;
  font-size: .85rem;
}
.history {
  margin-top: 16px;
}
.history-item {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  font-size: .85rem;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
body, .container { animation: fadeIn .4s ease-out; }
@keyframes correctPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}
@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>👁️ 汉字识别训练</h1>
  <p class="sub">通过闪卡和识别游戏提高汉字识别能力</p>

  <div class="card">
    <div class="mode-select">
      <button class="mode-btn active" onclick="setMode('flashcard')">闪卡模式</button>
      <button class="mode-btn" onclick="setMode('quiz')">选择题模式</button>
      <button class="mode-btn" onclick="setMode('input')">输入模式</button>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="startSession()">开始训练</button>
      <button class="btn btn-secondary" onclick="nextCard()">下一个</button>
      <button class="btn btn-secondary" onclick="showAnswer()">显示答案</button>
      <button class="btn btn-secondary" onclick="toggleTheme()">🌓 切换主题</button>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="stat-value" id="mastered">0</div><div>已掌握</div></div>
      <div class="stat"><div class="stat-value" id="learning">0</div><div>学习中</div></div>
      <div class="stat"><div class="stat-value" id="newChars">0</div><div>未学习</div></div>
      <div class="stat"><div class="stat-value" id="accuracy">0%</div><div>正确率</div></div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressBar" style="width:0%"></div>
    </div>
  </div>

  <div class="card" id="flashcardMode">
    <div class="flashcard-container">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="flashcard-face flashcard-front" id="flashcardFront">龙</div>
        <div class="flashcard-face flashcard-back" id="flashcardBack">
          <div class="flashcard-pinyin" id="flashcardPinyin">lóng</div>
          <div class="flashcard-meaning" id="flashcardMeaning">龙</div>
        </div>
      </div>
    </div>
    <div class="btn-group" style="justify-content:center">
      <button class="btn btn-secondary" onclick="markAs('mastered')">✓ 已掌握</button>
      <button class="btn btn-secondary" onclick="markAs('learning')">? 学习中</button>
      <button class="btn btn-secondary" onclick="markAs('new')">✗ 未学习</button>
    </div>
  </div>

  <div class="card" id="quizMode" style="display:none">
    <div class="recognition-area">
      <div class="recognition-char" id="quizChar">龙</div>
      <div class="quiz-text" id="quizText">请选择正确的拼音</div>
      <div class="options-grid" id="quizOptions"></div>
    </div>
  </div>

  <div class="card" id="inputMode" style="display:none">
    <div class="recognition-area">
      <div class="recognition-char" id="inputChar">龙</div>
      <input type="text" class="recognition-input" id="inputAnswer" placeholder="输入拼音或释义">
      <button class="btn" onclick="checkInput()">确认</button>
      <div id="inputResult" style="margin-top:12px"></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">汉字列表</h3>
    <div class="progress-info">
      <span>进度: <span id="progressText">0</span> / <span id="totalChars">0</span></span>
      <span>今日学习: <span id="todayCount">0</span></span>
    </div>
    <div class="char-list" id="charList"></div>
  </div>

  <div class="card history" id="historyCard" style="display:none">
    <h3 style="margin-bottom:12px">学习记录</h3>
    <div id="history"></div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var characters = [
  {char:'永',pinyin:'yǒng',meaning:'永远',status:'new'},
  {char:'一',pinyin:'yī',meaning:'一个',status:'new'},
  {char:'二',pinyin:'èr',meaning:'两个',status:'new'},
  {char:'三',pinyin:'sān',meaning:'三个',status:'new'},
  {char:'四',pinyin:'sì',meaning:'四个',status:'new'},
  {char:'五',pinyin:'wǔ',meaning:'五个',status:'new'},
  {char:'六',pinyin:'liù',meaning:'六个',status:'new'},
  {char:'七',pinyin:'qī',meaning:'七个',status:'new'},
  {char:'八',pinyin:'bā',meaning:'八个',status:'new'},
  {char:'九',pinyin:'jiǔ',meaning:'九个',status:'new'},
  {char:'十',pinyin:'shí',meaning:'十个',status:'new'},
  {char:'大',pinyin:'dà',meaning:'大的',status:'new'},
  {char:'小',pinyin:'xiǎo',meaning:'小的',status:'new'},
  {char:'多',pinyin:'duō',meaning:'很多',status:'new'},
  {char:'少',pinyin:'shǎo',meaning:'很少',status:'new'},
  {char:'上',pinyin:'shàng',meaning:'上面',status:'new'},
  {char:'下',pinyin:'xià',meaning:'下面',status:'new'},
  {char:'人',pinyin:'rén',meaning:'人类',status:'new'},
  {char:'口',pinyin:'kǒu',meaning:'嘴巴',status:'new'},
  {char:'日',pinyin:'rì',meaning:'太阳',status:'new'},
  {char:'月',pinyin:'yuè',meaning:'月亮',status:'new'},
  {char:'水',pinyin:'shuǐ',meaning:'水',status:'new'},
  {char:'火',pinyin:'huǒ',meaning:'火',status:'new'},
  {char:'木',pinyin:'mù',meaning:'树木',status:'new'},
  {char:'金',pinyin:'jīn',meaning:'金属',status:'new'},
  {char:'土',pinyin:'tǔ',meaning:'泥土',status:'new'},
  {char:'山',pinyin:'shān',meaning:'山',status:'new'},
  {char:'石',pinyin:'shí',meaning:'石头',status:'new'},
  {char:'田',pinyin:'tián',meaning:'田地',status:'new'},
  {char:'王',pinyin:'wáng',meaning:'国王',status:'new'},
  {char:'马',pinyin:'mǎ',meaning:'马',status:'new'},
  {char:'鸟',pinyin:'niǎo',meaning:'鸟',status:'new'},
  {char:'鱼',pinyin:'yú',meaning:'鱼',status:'new'},
  {char:'牛',pinyin:'niú',meaning:'牛',status:'new'},
  {char:'羊',pinyin:'yáng',meaning:'羊',status:'new'},
  {char:'龙',pinyin:'lóng',meaning:'龙',status:'new'},
  {char:'凤',pinyin:'fèng',meaning:'凤凰',status:'new'},
  {char:'福',pinyin:'fú',meaning:'福气',status:'new'},
  {char:'禄',pinyin:'lù',meaning:'俸禄',status:'new'},
  {char:'寿',pinyin:'shòu',meaning:'长寿',status:'new'}
];

var mode = 'flashcard';
var currentIndex = 0;
var totalCorrect = 0;
var totalAttempts = 0;
var todayCount = 0;
var isFlipped = false;
var history = [];

function init() {
  renderCharList();
  updateStats();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.textContent.includes(getModeLabel(m)));
  });
  document.getElementById('flashcardMode').style.display = m === 'flashcard' ? 'block' : 'none';
  document.getElementById('quizMode').style.display = m === 'quiz' ? 'block' : 'none';
  document.getElementById('inputMode').style.display = m === 'input' ? 'block' : 'none';
}

function getModeLabel(m) {
  var labels = {flashcard:'闪卡',quiz:'选择题',input:'输入'};
  return labels[m] || m;
}

function startSession() {
  currentIndex = 0;
  totalCorrect = 0;
  totalAttempts = 0;
  todayCount = 0;
  updateStats();
  showCurrent();
}

function showCurrent() {
  var c = characters[currentIndex];
  switch(mode) {
    case 'flashcard':
      isFlipped = false;
      document.getElementById('flashcard').classList.remove('flipped');
      document.getElementById('flashcardFront').textContent = c.char;
      document.getElementById('flashcardPinyin').textContent = c.pinyin;
      document.getElementById('flashcardMeaning').textContent = c.meaning;
      break;
    case 'quiz':
      showQuiz(c);
      break;
    case 'input':
      document.getElementById('inputChar').textContent = c.char;
      document.getElementById('inputAnswer').value = '';
      document.getElementById('inputResult').innerHTML = '';
      break;
  }
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
}

function showAnswer() {
  if(mode === 'flashcard') {
    isFlipped = true;
    document.getElementById('flashcard').classList.add('flipped');
  }
}

function nextCard() {
  currentIndex = (currentIndex + 1) % characters.length;
  showCurrent();
}

function markAs(status) {
  characters[currentIndex].status = status;
  totalAttempts++;
  if(status === 'mastered') totalCorrect++;
  todayCount++;
  updateStats();
  renderCharList();
  nextCard();
}

function showQuiz(correct) {
  document.getElementById('quizChar').textContent = correct.char;
  var options = [correct];
  while(options.length < 4) {
    var random = characters[Math.floor(Math.random() * characters.length)];
    if(!options.some(function(o) { return o.char === random.char; })) {
      options.push(random);
    }
  }
  options = shuffleArray(options);
  var html = '';
  options.forEach(function(opt) {
    html += '<div class="option-btn" onclick="checkQuizAnswer(this,\'' + opt.pinyin + '\',\'' + correct.pinyin + '\')">' + opt.pinyin + '</div>';
  });
  document.getElementById('quizOptions').innerHTML = html;
}

function checkQuizAnswer(el, selected, correct) {
  if(el.classList.contains('correct') || el.classList.contains('wrong')) return;
  totalAttempts++;
  if(selected === correct) {
    el.classList.add('correct');
    el.style.animation = 'correctPulse 0.3s';
    totalCorrect++;
    characters[currentIndex].status = 'mastered';
  } else {
    el.classList.add('wrong');
    el.style.animation = 'wrongShake 0.3s';
    document.querySelectorAll('.option-btn').forEach(function(btn) {
      if(btn.textContent === correct) btn.classList.add('correct');
    });
    characters[currentIndex].status = 'learning';
  }
  todayCount++;
  updateStats();
  renderCharList();
  setTimeout(nextCard, 1000);
}

function checkInput() {
  var answer = document.getElementById('inputAnswer').value.trim();
  var c = characters[currentIndex];
  totalAttempts++;
  if(answer === c.pinyin || answer === c.meaning) {
    document.getElementById('inputResult').innerHTML = '<div style="color:var(--green)">正确!</div>';
    totalCorrect++;
    c.status = 'mastered';
  } else {
    document.getElementById('inputResult').innerHTML = '<div style="color:var(--red)">错误! 正确答案: ' + c.pinyin + ' (' + c.meaning + ')</div>';
    c.status = 'learning';
  }
  todayCount++;
  updateStats();
  renderCharList();
  setTimeout(nextCard, 1500);
}

function updateStats() {
  var mastered = characters.filter(function(c) { return c.status === 'mastered'; }).length;
  var learning = characters.filter(function(c) { return c.status === 'learning'; }).length;
  var newChars = characters.filter(function(c) { return c.status === 'new'; }).length;
  document.getElementById('mastered').textContent = mastered;
  document.getElementById('learning').textContent = learning;
  document.getElementById('newChars').textContent = newChars;
  document.getElementById('accuracy').textContent = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) + '%' : '0%';
  document.getElementById('progressText').textContent = mastered;
  document.getElementById('totalChars').textContent = characters.length;
  document.getElementById('todayCount').textContent = todayCount;
  document.getElementById('progressBar').style.width = ((mastered / characters.length) * 100) + '%';
}

function renderCharList() {
  var html = '';
  characters.forEach(function(c, i) {
    var cls = 'char-item ' + c.status;
    html += '<div class="' + cls + '" onclick="goToChar(' + i + ')">' + c.char + '</div>';
  });
  document.getElementById('charList').innerHTML = html;
}

function goToChar(index) {
  currentIndex = index;
  showCurrent();
}

function shuffleArray(arr) {
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = a[i];
    a[i] = a[j];
    a[j] = temp;
  }
  return a;
}

function toggleTheme() {
  var html = document.documentElement;
  var current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
}

init();
</script>
</body>
</html>
