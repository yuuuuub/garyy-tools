<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>银行查找 - Bank Finder</title>
<meta name="description" content="银行网点查找工具，帮你找到附近的银行营业厅">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#22c55e;--yellow:#eab308;--muted:#8b949e}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vhpadding:16px;scroll-behavior:smooth;}
.container{max-width:1200px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 0}
header h1{font-size:1.8em;margin-bottom:4px}
header p{color:var(--muted)}
.filters{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.filter-group label{font-size:12px;color:var(--muted);font-weight:600}
.filter-group input,.filter-group select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px;width:100%}
.filter-group input:focus,.filter-group select:focus{outline:none;border-color:var(--accent)}
.bank-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.bank-tab{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s}
.bank-tab.active{background:var(--accent);border-color:var(--accent);color:var(--text)}
.sort-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.sort-bar span{color:var(--muted);font-size:14px}
.sort-options{display:flex;gap:8px}
.sort-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.sort-btn.active{background:var(--accent);border-color:var(--accent)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card h3{font-size:16px;margin-bottom:6px}
.card-info{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);margin-bottom:10px}
.card-info span{display:flex;align-items:center;gap:6px}
.services{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.svc-tag{font-size:11px;background:rgba(59,130,246,.1);color:var(--accent);padding:2px 8px;border-radius:10px}
.atm-badge{font-size:11px;padding:3px 8px;border-radius:12px;font-weight:600;display:inline-block}
.atm-yes{background:rgba(34,197,94,.15);color:var(--green)}
.atm-no{background:rgba(239,68,68,.15);color:var(--red)}
.no-results{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:640px){.results{grid-template-columns:1fr}.filters{flex-direction:column}}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="银行查找 - Bank Finder">
  <meta property="og:description" content="银行网点查找工具，帮你找到附近的银行营业厅">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/bank-finder/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>🏦 银行查找</h1><p>查找附近银行网点，办理业务</p></header>
<div class="filters">
<div class="filter-group" style="flex:2"><label>搜索</label><input type="text" id="search" placeholder="输入银行名称或地址..."></div>
<div class="filter-group"><label>ATM</label><select id="atmFilter"><option value="">不限</option><option value="yes">有ATM</option><option value="no">无ATM</option></select></div>
<div class="filter-group"><label>服务类型</label><select id="serviceFilter"><option value="">全部</option><option value="对公业务">对公业务</option><option value="对私业务">对私业务</option><option value="外汇">外汇</option><option value="理财">理财</option></select></div>
</div>
<div class="bank-tabs" id="bankTabs"><button class="bank-tab active" data-bank="">全部</button></div>
<div class="sort-bar"><span id="resultCount"></span><div class="sort-options"><button class="sort-btn active" data-sort="rating">评分优先</button><button class="sort-btn" data-sort="name">名称排序</button></div></div>
<div class="results" id="results"></div>
</div>
<script>
const banks=[
{id:1,name:"中国工商银行(朝阳支行)",bank:"工商银行",address:"朝阳区建国路88号",rating:4.5,phone:"010-58881688",hours:"09:00-17:00",hasAtm:true,services:["对公业务","对私业务","外汇","理财"],description:"工商银行旗舰网点，业务全面"},
{id:2,name:"中国建设银行(海淀分行)",bank:"建设银行",address:"海淀区中关村大街1号",rating:4.4,phone:"010-82618888",hours:"09:00-17:00",hasAtm:true,services:["对公业务","对私业务","理财"],description:"建行重点分行，服务优质"},
{id:3,name:"中国农业银行(西城支行)",bank:"农业银行",address:"西城区金融街35号",rating:4.3,phone:"010-66018888",hours:"09:00-17:00",hasAtm:true,services:["对公业务","对私业务","外汇"],description:"农行核心网点，金融街地区"},
{id:4,name:"中国银行(东城支行)",bank:"中国银行",address:"东城区东长安街1号",rating:4.6,phone:"010-65881688",hours:"09:00-17:00",hasAtm:true,services:["对公业务","对私业务","外汇","理财"],description:"中行旗舰网点，外汇业务专业"},
{id:5,name:"招商银行(国贸支行)",bank:"招商银行",address:"朝阳区国贸大厦B座",rating:4.7,phone:"010-65058888",hours:"09:00-17:30",hasAtm:true,services:["对私业务","理财"],description:"招行标杆网点，零售服务领先"},
{id:6,name:"交通银行(陆家嘴分行)",bank:"交通银行",address:"浦东新区陆家嘴环路900号",rating:4.4,phone:"021-58881688",hours:"09:00-17:00",hasAtm:true,services:["对公业务","对私业务","外汇","理财"],description:"交行上海分行，综合服务"},
{id:7,name:"浦发银行(静安支行)",bank:"浦发银行",address:"静安区南京西路1000号",rating:4.5,phone:"021-62881688",hours:"09:00-17:00",hasAtm:true,services:["对公业务","对私业务","理财"],description:"浦发银行核心网点"},
{id:8,name:"兴业银行(越秀支行)",bank:"兴业银行",address:"越秀区东风东路800号",rating:4.3,phone:"020-83881688",hours:"09:00-17:00",hasAtm:false,services:["对公业务","对私业务"],description:"兴业银行广州分行"},
{id:9,name:"光大银行(南山支行)",bank:"光大银行",address:"南山区科技南路18号",rating:4.2,phone:"0755-86881688",hours:"09:00-17:00",hasAtm:true,services:["对私业务","理财"],description:"光大银行深圳分行"},
{id:10,name:"民生银行(朝阳门支行)",bank:"民生银行",address:"东城区朝阳门北大街6号",rating:4.1,phone:"010-65881888",hours:"09:00-17:00",hasAtm:true,services:["对公业务","对私业务","外汇"],description:"民生银行北京分行"}
];
const bankNames=[...new Set(banks.map(b=>b.bank))];
let currentBank="",currentSort="rating";
const tabsEl=document.getElementById("bankTabs");
bankNames.forEach(bn=>{const btn=document.createElement("button");btn.className="bank-tab";btn.dataset.bank=bn;btn.textContent=bn;tabsEl.appendChild(btn)});
function render(){
const q=document.getElementById("search").value.toLowerCase();
const af=document.getElementById("atmFilter").value;
const sf=document.getElementById("serviceFilter").value;
let filtered=banks.filter(b=>{
if(q&&!b.name.includes(q)&&!b.address.includes(q))return false;
if(currentBank&&b.bank!==currentBank)return false;
if(af==="yes"&&!b.hasAtm)return false;
if(af==="no"&&b.hasAtm)return false;
if(sf&&!b.services.includes(sf))return false;
return true;
});
filtered.sort({rating:(a,b)=>b.rating-a.rating,name:(a,b)=>a.name.localeCompare(b.name,"zh")}[currentSort]||(a,b)=>b.rating-a.rating);
document.getElementById("resultCount").textContent=`找到 ${filtered.length} 个网点`;
const c=document.getElementById("results");
if(!filtered.length){c.innerHTML='<div class="no-results"><p>未找到符合条件的银行网点</p></div>';return}
c.innerHTML=filtered.map(b=>`<div class="card"><h3>${b.name}</h3><div class="card-info"><span>📍 ${b.address}</span><span>📞 ${b.phone}</span><span>🕐 ${b.hours}</span><span>⭐ ${b.rating}</span></div><p style="font-size:13px;color:var(--muted);margin-bottom:8px">${b.description}</p><div class="services">${b.services.map(s=>`<span class="svc-tag">${s}</span>`).join("")}</div><span class="atm-badge ${b.hasAtm?'atm-yes':'atm-no'}">${b.hasAtm?'🏧 有ATM':'❌ 无ATM'}</span></div>`).join("")
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("atmFilter").addEventListener("change",render);
document.getElementById("serviceFilter").addEventListener("change",render);
tabsEl.addEventListener("click",e=>{if(e.target.classList.contains("bank-tab")){tabsEl.querySelectorAll(".bank-tab").forEach(x=>x.classList.remove("active"));e.target.classList.add("active");currentBank=e.target.dataset.bank;render()}});
document.querySelectorAll(".sort-btn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".sort-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentSort=b.dataset.sort;render()}));
render();
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
