<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚖️ 体脂率计算器</title>
<meta property="og:title" content="⚖️ 体脂率计算器">
<meta property="og:description" content="⚖️ 体脂率计算器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线体脂率计算器，通过BMI公式估算体脂率，附带体脂率等级标准">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.gender-tabs{display:flex;gap:8px;margin-bottom:12px}
.gender-tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:14px;cursor:pointer;text-align:center;transition:all .2s;font-weight:600}
.gender-tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-group label{font-size:12px;color:var(--text-secondary);font-weight:500}
.input-group input{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;transition:all .2s}
.input-group input:focus{outline:none;border-color:var(--accent)}
.calc-btn{width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.calc-btn:hover{background:var(--accent-hover)}
.result-card{background:var(--tag-bg);border-radius:12px;padding:20px;text-align:center;margin-top:12px}
.result-val{font-size:48px;font-weight:800;color:var(--accent)}
.result-unit{font-size:16px;color:var(--text-secondary)}
.result-level{font-size:14px;margin-top:8px;padding:4px 12px;border-radius:8px;display:inline-block;font-weight:600}
.bar-chart{margin-top:16px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.bar-label{width:50px;text-align:right;color:var(--text-secondary);flex-shrink:0}
.bar-track{flex:1;height:20px;background:var(--border);border-radius:10px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:10px;transition:width .5s ease}
.bar-marker{position:absolute;top:-2px;width:3px;height:24px;background:var(--text);border-radius:2px}
.level-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
.level-table th{background:var(--accent);color:#fff;padding:8px;text-align:center;font-weight:600}
.level-table td{padding:8px;text-align:center;border-bottom:1px solid var(--border)}
.level-table tr.current{background:var(--tag-bg);font-weight:600}
.tip{font-size:12px;color:var(--text-secondary);margin-top:12px;line-height:1.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>⚖️ 体脂率计算器</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">👤 基本信息</div>
<div class="gender-tabs">
<div class="gender-tab active" onclick="setGender('male',this)">👨 男性</div>
<div class="gender-tab" onclick="setGender('female',this)">👩 女性</div>
</div>
<div class="input-row">
<div class="input-group">
<label>年龄（岁）</label>
<input type="number" id="age" placeholder="25" min="10" max="100">
</div>
<div class="input-group">
<label>身高（cm）</label>
<input type="number" id="height" placeholder="170" min="100" max="220">
</div>
</div>
<div class="input-row">
<div class="input-group">
<label>体重（kg）</label>
<input type="number" id="weight" placeholder="65" min="30" max="200">
</div>
<div class="input-group">
<label>腰围（cm）</label>
<input type="number" id="waist" placeholder="80" min="40" max="200">
</div>
</div>
<button class="calc-btn" onclick="calculate()">📊 计算体脂率</button>
</div>
<div class="card" id="resultCard" style="display:none">
<div class="card-title">📈 体脂率结果</div>
<div class="result-card">
<div class="result-val" id="bfResult">--</div>
<div class="result-unit">体脂率 (%)</div>
<div class="result-level" id="bfLevel">--</div>
</div>
<div class="bar-chart" id="barChart"></div>
</div>
<div class="card">
<div class="card-title">📋 体脂率等级标准</div>
<div id="levelInfo"></div>
</div>
<div class="card">
<div class="card-title">ℹ️ 说明</div>
<div class="tip">
• 本工具采用 BMI 公式估算体脂率，仅供参考<br>
• 男性体脂率公式：1.2×BMI + 0.23×年龄 - 16.2<br>
• 女性体脂率公式：1.2×BMI + 0.23×年龄 - 5.4<br>
• 精确体脂率建议使用专业设备测量（如DEXA、InBody）
</div>
</div>
<div class="footer">Gary's Tools · 体脂率仅供参考</div>
</div>
<script>
let currentGender='male';
const maleLevels=[
{range:'2-5',label:'必需脂肪',color:'#3b82f6'},
{range:'6-13',label:'运动员',color:'#22c55e'},
{range:'14-17',label:'健康',color:'#84cc16'},
{range:'18-24',label:'一般',color:'#eab308'},
{range:'25-31',label:'偏胖',color:'#f97316'},
{range:'32+',label:'肥胖',color:'#ef4444'}
];
const femaleLevels=[
{range:'10-13',label:'必需脂肪',color:'#3b82f6'},
{range:'14-20',label:'运动员',color:'#22c55e'},
{range:'21-24',label:'健康',color:'#84cc16'},
{range:'25-31',label:'一般',color:'#eab308'},
{range:'32-38',label:'偏胖',color:'#f97316'},
{range:'39+',label:'肥胖',color:'#ef4444'}
];
function setGender(g,el){
currentGender=g;
document.querySelectorAll('.gender-tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
renderLevelInfo();
}
function calculate(){
const age=parseFloat(document.getElementById('age').value);
const height=parseFloat(document.getElementById('height').value);
const weight=parseFloat(document.getElementById('weight').value);
if(!age||!height||!weight){alert('请填写完整信息');return}
const bmi=weight/((height/100)**2);
let bf;
if(currentGender==='male'){bf=1.2*bmi+0.23*age-16.2;}
else{bf=1.2*bmi+0.23*age-5.4;}
bf=Math.max(2,Math.min(60,bf));
document.getElementById('bfResult').textContent=bf.toFixed(1)+'%';
const levels=currentGender==='male'?maleLevels:femaleLevels;
let levelColor='#666',levelText='未知';
for(const l of levels){
const parts=l.range.replace('+','').split('-').map(Number);
const min=parts[0];
const max=parts[1]||999;
if(bf>=min&&bf<=max){levelColor=l.color;levelText=l.label;break;}
}
const lvl=document.getElementById('bfLevel');
lvl.textContent=levelText;
lvl.style.background=levelColor+'22';
lvl.style.color=levelColor;
let bars='';
for(const l of levels){
const parts=l.range.replace('+','').split('-').map(Number);
const min=parts[0];
const max=parts[1]||60;
bars+=`<div class="bar-row"><div class="bar-label">${l.label}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(max/60)*100)}%;background:${l.color}44"></div></div><div class="bar-label" style="width:60px">${l.range}%</div></div>`;
}
bars+=`<div style="margin-top:8px;padding:8px;background:var(--preview-bg);border-radius:8px;font-size:12px;color:var(--text-secondary)">您的体脂率：<b style="color:var(--accent)">${bf.toFixed(1)}%</b> — ${levelText}</div>`;
document.getElementById('barChart').innerHTML=bars;
document.getElementById('resultCard').style.display='block';
renderLevelInfo();
}
function renderLevelInfo(){
const levels=currentGender==='male'?maleLevels:femaleLevels;
const tableRows=levels.map(l=>`<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${l.color};margin-right:4px"></span>${l.range}%</td><td>${l.label}</td></tr>`).join('');
document.getElementById('levelInfo').innerHTML=`<table class="level-table"><tr><th>体脂率范围</th><th>等级</th></tr>${tableRows}</table>
<div class="tip" style="margin-top:8px">${currentGender==='male'?'男性健康体脂率约 14-17%':'女性健康体脂率约 21-24%'}</div>`;
}
function toggleTheme(){
const html=document.documentElement;
const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
html.setAttribute('data-theme',next);
document.querySelector('.theme-toggle').textContent=next==='dark'?'☀️':'🌙';
}
renderLevelInfo();
</script>
</body>
</html>
