<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="showEvolution14()">
</div>
<button class="btn" onclick="showEvolution14()">查看进化</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var evolutionData14={
  '飞':{stages:[{era:'甲骨文',char:'🦅',name:'象形字',desc:'像鸟飞翔的形状，有翅膀'},{era:'金文',char:'🦅',name:'象形字',desc:'继续描绘飞翔的形状'},{era:'小篆',char:'飛',name:'象形字',desc:'演变为繁体字'},{era:'隶书',char:'飛',name:'繁体字',desc:'更加规整的飞字'},{era:'楷书',char:'飞',name:'简体字',desc:'现代简体写法'}]},
  '跑':{stages:[{era:'甲骨文',char:'🏃',name:'会意字',desc:'从足从包，表示奔跑'},{era:'金文',char:'🏃',name:'会意字',desc:'继续描绘奔跑的形状'},{era:'小篆',char:'跑',name:'形声字',desc:'从足，包声'},{era:'隶书',char:'跑',name:'形声字',desc:'更加规整的跑字'},{era:'楷书',char:'跑',name:'标准字',desc:'现代标准写法'}]},
  '跳':{stages:[{era:'甲骨文',char:'🦘',name:'会意字',desc:'从足从兆，表示跳跃'},{era:'金文',char:'🦘',name:'会意字',desc:'继续描绘跳跃的形状'},{era:'小篆',char:'跳',name:'形声字',desc:'从足，兆声'},{era:'隶书',char:'跳',name:'形声字',desc:'更加规整的跳字'},{era:'楷书',char:'跳',name:'标准字',desc:'现代标准写法'}]},
  '走':{stages:[{era:'甲骨文',char:'🚶',name:'象形字',desc:'像人行走的形状'},{era:'金文',char:'🚶',name:'象形字',desc:'继续描绘行走的形状'},{era:'小篆',char:'走',name:'象形字',desc:'演变为方块字'},{era:'隶书',char:'走',name:'方块字',desc:'更加规整的走字'},{era:'楷书',char:'走',name:'标准字',desc:'现代标准写法'}]},
  '站':{stages:[{era:'甲骨文',char:'🧍',name:'会意字',desc:'从立从占，表示站立'},{era:'金文',char:'🧍',name:'会意字',desc:'继续描绘站立的形状'},{era:'小篆',char:'站',name:'形声字',desc:'从立，占声'},{era:'隶书',char:'站',name:'形声字',desc:'更加规整的站字'},{era:'楷书',char:'站',name:'标准字',desc:'现代标准写法'}]},
  '坐':{stages:[{era:'甲骨文',char:'🪑',name:'会意字',desc:'从二人从土，表示坐下'},{era:'金文',char:'🪑',name:'会意字',desc:'继续描绘坐下的形状'},{era:'小篆',char:'坐',name:'会意字',desc:'演变为方块字'},{era:'隶书',char:'坐',name:'方块字',desc:'更加规整的坐字'},{era:'楷书',char:'坐',name:'标准字',desc:'现代标准写法'}]},
  '躺':{stages:[{era:'甲骨文',char:'🛏',name:'会意字',desc:'从身从尚，表示躺下'},{era:'金文',char:'🛏',name:'会意字',desc:'继续描绘躺下的形状'},{era:'小篆',char:'躺',name:'形声字',desc:'从身，尚声'},{era:'隶书',char:'躺',name:'形声字',desc:'更加规整的躺字'},{era:'楷书',char:'躺',name:'标准字',desc:'现代标准写法'}]},
  '爬':{stages:[{era:'甲骨文',char:'🐾',name:'会意字',desc:'从爪从巴，表示爬行'},{era:'金文',char:'🐾',name:'会意字',desc:'继续描绘爬行的形状'},{era:'小篆',char:'爬',name:'形声字',desc:'从爪，巴声'},{era:'隶书',char:'爬',name:'形声字',desc:'更加规整的爬字'},{era:'楷书',char:'爬',name:'标准字',desc:'现代标准写法'}]},
  '游':{stages:[{era:'甲骨文',char:'🏊',name:'会意字',desc:'从水从斿，表示游泳'},{era:'金文',char:'🏊',name:'会意字',desc:'继续描绘游泳的形状'},{era:'小篆',char:'游',name:'形声字',desc:'从水，斿声'},{era:'隶书',char:'游',name:'形声字',desc:'更加规整的游字'},{era:'楷书',char:'游',name:'标准字',desc:'现代标准写法'}]},
  '飞':{stages:[{era:'甲骨文',char:'🦅',name:'象形字',desc:'像鸟飞翔的形状，有翅膀'},{era:'金文',char:'🦅',name:'象形字',desc:'继续描绘飞翔的形状'},{era:'小篆',char:'飛',name:'象形字',desc:'演变为繁体字'},{era:'隶书',char:'飛',name:'繁体字',desc:'更加规整的飞字'},{era:'楷书',char:'飞',name:'简体字',desc:'现代简体写法'}]}
};
function showEvolution14(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=evolutionData14[char];
  if(!data){
    data={stages:[{era:'古代',char:char,name:'汉字',desc:'暂无详细进化信息'},{era:'现代',char:char,name:'标准字',desc:'现代标准写法'}]};
  }
  var html='<div class="card">';
  html+='<div style="text-align:center;margin-bottom:20px">';
  html+='<div style="font-size:4rem;font-weight:700;color:var(--blue)">'+char+'</div>';
  html+='<div style="font-size:1.1rem;color:var(--text2);margin-top:8px">汉字进化历程</div>';
  html+='</div>';
  html+='<div class="evolution-timeline">';
  data.stages.forEach(function(stage,index){
    html+='<div class="evolution-stage">';
    html+='<div class="evolution-char">'+stage.char+'</div>';
    html+='<div class="evolution-info">';
    html+='<div class="evolution-era">'+stage.era+'</div>';
    html+='<div class="evolution-name">'+stage.name+'</div>';
    html+='<div class="evolution-desc">'+stage.desc+'</div>';
    html+='</div>';
    if(index<data.stages.length-1){
      html+='<div class="evolution-line"></div>';
    }
    html+='</div>';
  });
  html+='</div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(evolutionData14);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showEvolution14();
}
showEvolution14();
</script></body></html>
