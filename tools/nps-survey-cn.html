<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NPS净推荐值调查 - 轻松创建NPS调查问卷，实时计算净推荐值分数">
    <meta name="robots" content="index, follow">
    <title>NPS净推荐值调查</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="i18n.js" defer></script>
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #7c3aed; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; --hover-color: #f1f3f5; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #a78bfa; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; --hover-color: #3a3a3a; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        textarea { resize: vertical; min-height: 60px; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 8px; margin-bottom: 8px; }
        button:hover { opacity: 0.9; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-danger { background-color: var(--danger-color); }
        .btn-success { background-color: var(--success-color); }
        .btn-secondary { background-color: var(--secondary-color); }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); }
        .tab { padding: 10px 20px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; color: var(--secondary-color); }
        .tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nps-scale { display: flex; gap: 6px; justify-content: center; margin: 24px 0; flex-wrap: wrap; }
        .nps-scale .nps-num { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--border-color); border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .nps-scale .nps-num:hover { transform: scale(1.1); }
        .nps-scale .nps-num.detractor { border-color: #ef4444; }
        .nps-scale .nps-num.passive { border-color: #f59e0b; }
        .nps-scale .nps-num.promoter { border-color: #22c55e; }
        .nps-scale .nps-num.selected { color: white; }
        .nps-scale .nps-num.selected.detractor { background: #ef4444; border-color: #ef4444; }
        .nps-scale .nps-num.selected.passive { background: #f59e0b; border-color: #f59e0b; }
        .nps-scale .nps-num.selected.promoter { background: #22c55e; border-color: #22c55e; }
        .nps-score-big { font-size: 72px; font-weight: 800; text-align: center; }
        .nps-label { text-align: center; font-size: 18px; color: var(--secondary-color); margin-bottom: 8px; }
        .nps-breakdown { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; text-align: center; }
        .nps-breakdown .nps-segment { padding: 20px; border-radius: 10px; }
        .nps-breakdown .nps-segment .num { font-size: 36px; font-weight: bold; }
        .nps-breakdown .nps-segment .pct { font-size: 16px; }
        .nps-breakdown .detractors { background: rgba(239,68,68,0.1); color: #ef4444; }
        .nps-breakdown .passives { background: rgba(245,158,11,0.1); color: #f59e0b; }
        .nps-breakdown .promoters { background: rgba(34,197,94,0.1); color: #22c55e; }
        .histogram { display: flex; align-items: flex-end; gap: 4px; height: 200px; padding: 0 10px; }
        .histogram .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
        .histogram .bar { width: 100%; border-radius: 4px 4px 0 0; transition: height 0.5s; min-height: 2px; }
        .histogram .bar-label { font-size: 11px; margin-top: 4px; color: var(--secondary-color); }
        .histogram .bar-count { font-size: 11px; margin-bottom: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>NPS 净推荐值调查</h1>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('config')">配置调查</div>
            <div class="tab" onclick="switchTab('survey')">填写调查</div>
            <div class="tab" onclick="switchTab('dashboard')">数据仪表盘</div>
        </div>

        <div id="tab-config" class="tab-content active">
            <div class="card">
                <div class="form-group"><label>调查标题</label><input type="text" id="npsTitle" value="NPS 客户满意度调查"></div>
                <div class="form-group"><label>核心问题</label><input type="text" id="npsQuestion" value="您有多大可能向朋友或同事推荐我们？"></div>
                <div class="form-group"><label>调查说明</label><textarea id="npsDesc" rows="2">请根据您的实际体验打分，0 表示完全不可能，10 表示非常可能。</textarea></div>
                <div class="form-group"><label>后续问题（可选）</label><textarea id="npsFollowup" rows="2">请告诉我们您打这个分数的原因：</textarea></div>
                <button onclick="loadDemo()">加载示例数据</button>
                <button onclick="resetAll()" class="btn-danger btn-sm">重置所有</button>
            </div>
        </div>

        <div id="tab-survey" class="tab-content">
            <div class="card">
                <h2 id="surveyTitleDisplay" style="text-align:center;margin-top:0;"></h2>
                <p id="surveyDescDisplay" style="text-align:center;color:var(--secondary-color);"></p>
                <p id="surveyQDisplay" style="text-align:center;font-size:18px;font-weight:600;margin-bottom:8px;"></p>
                <div id="npsScaleDisplay" class="nps-scale"></div>
                <p id="npsLabelDisplay" style="text-align:center;font-size:14px;color:var(--secondary-color);margin-top:8px;min-height:24px;"></p>
                <div id="followupSection" style="display:none;margin-top:20px;">
                    <p id="followupQ" style="font-weight:600;margin-bottom:8px;"></p>
                    <textarea id="followupAnswer" rows="4" style="width:100%;padding:10px;border:1px solid var(--border-color);border-radius:6px;"></textarea>
                </div>
                <div style="text-align:center;margin-top:24px;">
                    <button id="submitNPS" onclick="submitNPS()" disabled style="padding:14px 40px;font-size:16px;">提交</button>
                </div>
            </div>
        </div>

        <div id="tab-dashboard" class="tab-content">
            <div class="card" style="text-align:center;">
                <div class="nps-label">NPS 净推荐值</div>
                <div class="nps-score-big" id="npsScoreBig">--</div>
                <p id="npsDescDisplay2" style="color:var(--secondary-color);"></p>
            </div>
            <div class="card">
                <div class="nps-breakdown">
                    <div class="nps-segment detractors">
                        <div class="num" id="detCount">0</div>
                        <div>贬损者</div>
                        <div class="pct" id="detPct">0%</div>
                        <div style="font-size:12px;margin-top:4px;">(0-6分)</div>
                    </div>
                    <div class="nps-segment passives">
                        <div class="num" id="pasCount">0</div>
                        <div>中立者</div>
                        <div class="pct" id="pasPct">0%</div>
                        <div style="font-size:12px;margin-top:4px;">(7-8分)</div>
                    </div>
                    <div class="nps-segment promoters">
                        <div class="num" id="proCount">0</div>
                        <div>推荐者</div>
                        <div class="pct" id="proPct">0%</div>
                        <div style="font-size:12px;margin-top:4px;">(9-10分)</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <h3>分数分布</h3>
                <div class="histogram" id="histogram"></div>
            </div>
            <div class="card">
                <h3>反馈记录 <span id="respTotal" style="color:var(--secondary-color);font-size:14px;"></span></h3>
                <div id="feedbackList"></div>
            </div>
        </div>
    </div>

    <script>
        let npsData = { responses: [] };
        let selectedScore = -1;

        function toggleTheme() {
            const html = document.documentElement;
            html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
        }

        function switchTab(name) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', ['config','survey','dashboard'][i] === name);
            });
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            if (name === 'survey') renderSurvey();
            if (name === 'dashboard') renderDashboard();
        }

        function renderSurvey() {
            document.getElementById('surveyTitleDisplay').textContent = document.getElementById('npsTitle').value;
            document.getElementById('surveyDescDisplay').textContent = document.getElementById('npsDesc').value;
            document.getElementById('surveyQDisplay').textContent = document.getElementById('npsQuestion').value;

            const scale = document.getElementById('npsScaleDisplay');
            scale.innerHTML = '';
            for (let i = 0; i <= 10; i++) {
                const cls = i <= 6 ? 'detractor' : i <= 8 ? 'passive' : 'promoter';
                const el = document.createElement('div');
                el.className = 'nps-num ' + cls;
                el.textContent = i;
                el.onclick = () => selectNPS(i);
                scale.appendChild(el);
            }

            const fu = document.getElementById('npsFollowup').value.trim();
            document.getElementById('followupSection').style.display = fu ? 'block' : 'none';
            document.getElementById('followupQ').textContent = fu;
            document.getElementById('followupAnswer').value = '';
            selectedScore = -1;
            document.getElementById('submitNPS').disabled = true;
            document.getElementById('npsLabelDisplay').textContent = '';
        }

        function selectNPS(score) {
            selectedScore = score;
            document.querySelectorAll('.nps-num').forEach(el => {
                el.classList.toggle('selected', parseInt(el.textContent) === score);
            });
            const labels = ['非常不可能','','','','','','有可能','比较可能','可能','很可能','非常可能'];
            document.getElementById('npsLabelDisplay').textContent = labels[score];
            document.getElementById('submitNPS').disabled = false;
        }

        function submitNPS() {
            if (selectedScore < 0) return;
            npsData.responses.push({
                score: selectedScore,
                feedback: document.getElementById('followupAnswer').value.trim(),
                timestamp: new Date().toLocaleString()
            });
            alert('感谢您的反馈！');
            renderSurvey();
        }

        function renderDashboard() {
            const total = npsData.responses.length;
            if (!total) {
                document.getElementById('npsScoreBig').textContent = '--';
                document.getElementById('npsDescDisplay2').textContent = '暂无数据';
                document.getElementById('histogram').innerHTML = '';
                document.getElementById('feedbackList').innerHTML = '';
                ['detCount','detPct','pasCount','pasPct','proCount','proPct'].forEach(id => {
                    document.getElementById(id).textContent = id.includes('Pct') ? '0%' : '0';
                });
                return;
            }

            let det = 0, pas = 0, pro = 0;
            npsData.responses.forEach(r => {
                if (r.score <= 6) det++;
                else if (r.score <= 8) pas++;
                else pro++;
            });

            const nps = Math.round((pro / total - det / total) * 100);
            document.getElementById('npsScoreBig').textContent = nps;
            document.getElementById('npsScoreBig').style.color = nps >= 50 ? '#22c55e' : nps >= 0 ? '#f59e0b' : '#ef4444';
            document.getElementById('npsDescDisplay2').textContent = nps >= 50 ? '优秀' : nps >= 0 ? '良好' : '需要改善';

            document.getElementById('detCount').textContent = det;
            document.getElementById('pasCount').textContent = pas;
            document.getElementById('proCount').textContent = pro;
            document.getElementById('detPct').textContent = Math.round(det/total*100) + '%';
            document.getElementById('pasPct').textContent = Math.round(pas/total*100) + '%';
            document.getElementById('proPct').textContent = Math.round(pro/total*100) + '%';

            const counts = Array(11).fill(0);
            npsData.responses.forEach(r => counts[r.score]++);
            const maxC = Math.max(...counts, 1);
            const hist = document.getElementById('histogram');
            hist.innerHTML = '';
            for (let i = 0; i <= 10; i++) {
                const cls = i <= 6 ? '#ef4444' : i <= 8 ? '#f59e0b' : '#22c55e';
                const h = (counts[i] / maxC * 160);
                hist.innerHTML += `<div class="bar-col"><div class="bar-count">${counts[i]||''}</div><div class="bar" style="height:${h}px;background:${cls}"></div><div class="bar-label">${i}</div></div>`;
            }

            document.getElementById('respTotal').textContent = '(' + total + '条)';
            document.getElementById('feedbackList').innerHTML = npsData.responses.filter(r => r.feedback).map(r =>
                `<div style="padding:10px 0;border-bottom:1px solid var(--border-color);"><span style="display:inline-block;width:28px;height:28px;border-radius:50%;text-align:center;line-height:28px;font-weight:bold;color:white;background:${r.score<=6?'#ef4444':r.score<=8?'#f59e0b':'#22c55e'};font-size:12px;">${r.score}</span> ${esc(r.feedback)} <span style="font-size:12px;color:var(--secondary-color);float:right;">${r.timestamp}</span></div>`
            ).join('') || '<div style="color:var(--secondary-color);text-align:center;padding:16px;">暂无文字反馈</div>';
        }

        function loadDemo() {
            npsData.responses = [];
            for (let i = 0; i < 60; i++) {
                const s = Math.floor(Math.random() * 11);
                npsData.responses.push({
                    score: s,
                    feedback: s > 7 ? '产品非常好用！' : s > 5 ? '还不错，但有改进空间' : '需要改善用户体验',
                    timestamp: new Date(Date.now() - Math.random() * 86400000 * 30).toLocaleString()
                });
            }
            switchTab('dashboard');
        }

        function resetAll() { if (confirm('确定重置所有数据？')) { npsData.responses = []; renderDashboard(); } }
        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    </script>
</body>
</html>
