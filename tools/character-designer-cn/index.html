<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧑‍🎨 角色设计工具</title>
<meta property="og:title" content="🧑‍🎨 角色设计工具">
<meta property="og:description" content="🧑‍🎨 角色设计工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="角色设计工具，支持自定义外观、属性雷达图和角色数据导出">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑‍🎨</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root {--green:#238636;--red:#ef4444;--blue:#3b82f6;
--bg: #0f172a;
--surface: #1e293b;
--surface-2: #334155;
--text: #f1f5f9;
--text-secondary: #94a3b8;
--accent: #8b5cf6;
--border: #475569;
--shadow: 0 4px 24px rgba(0,0,0,0.3);
--radius: 12px;
--transition: 0.25s ease;
}
[data-theme="light"] {
--bg: #f8fafc;
--surface: #ffffff;
--surface-2: #f1f5f9;
--text: #1e293b;
--text-secondary: #64748b;
--accent: #8b5cf6;
--border: #e2e8f0;
--shadow: 0 4px 24px rgba(0,0,0,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif,'PingFang SC','Noto Sans SC',sans-serif; display:flex; justify-content:center; min-height:100vh; padding:16px; transition:background var(--transition),color var(--transition); }
.container { max-width:800px; width:100%; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.header h1 { font-size:1.5rem; }
.btn { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 16px; cursor:pointer; font-size:0.9rem; transition:opacity var(--transition); }
.btn:hover { opacity:0.85; }
.btn-secondary { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
.btn-small { padding:4px 10px; font-size:0.8rem; }
.btn-danger { background:#ef4444; }
.section { margin-bottom:20px; }
.section-title { font-size:1.1rem; font-weight:600; margin-bottom:10px; padding-bottom:6px; border-bottom:2px solid var(--accent); display:inline-block; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.form-group { display:flex; flex-direction:column; gap:4px; }
.form-group label { font-size:0.8rem; color:var(--text-secondary); }
.form-group input, .form-group select { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:0.9rem; }
.form-group input[type="color"] { width:40px; height:32px; padding:2px; cursor:pointer; }
.part-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px; }
.part-option { display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px; background:var(--bg); border:2px solid var(--border); border-radius:8px; cursor:pointer; transition:border-color var(--transition); }
.part-option:hover, .part-option.active { border-color:var(--accent); }
.part-option .emoji { font-size:1.8rem; }
.part-option .part-label { font-size:0.7rem; color:var(--text-secondary); }
.preview-area { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
.char-preview { width:200px; height:280px; background:var(--surface-2); border:2px solid var(--border); border-radius:var(--radius); display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; flex-shrink:0; }
.radar-wrap { flex:1; min-width:200px; }
.stat-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.stat-row label { font-size:0.85rem; min-width:50px; }
.stat-row input[type="range"] { flex:1; accent-color:var(--accent); }
.stat-row .stat-val { font-size:0.85rem; min-width:30px; text-align:right; }
.saved-list { display:flex; flex-direction:column; gap:6px; max-height:200px; overflow-y:auto; }
.saved-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; }
.saved-item span { font-size:0.9rem; }
.saved-item .btns { display:flex; gap:4px; }
.char-ascii { font-family:monospace; font-size:0.55rem; line-height:1.1; white-space:pre; text-align:center; color:var(--text); }
@media(max-width:600px) {
.form-row { grid-template-columns:1fr; }
.preview-area { flex-direction:column; }
.char-preview { width:100%; height:200px; }
}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🧑‍🎨 角色设计工具</h1>
<button class="btn btn-secondary" onclick="toggleTheme()">🌙 主题</button>
</div>

<div class="section">
<div class="section-title">基本信息</div>
<div class="form-row">
<div class="form-group">
<label>角色名称</label>
<input id="charName" placeholder="输入角色名称" oninput="updatePreview()">
</div>
<div class="form-group">
<label>角色职业</label>
<select id="charRole" onchange="updatePreview()">
<option>战士</option><option>法师</option><option>刺客</option><option>射手</option><option>辅助</option><option>医生</option><option>科学家</option><option>探险家</option>
</select>
</div>
</div>
</div>

<div class="section">
<div class="section-title">外观设计</div>
<div class="form-row">
<div class="form-group">
<label>头部形状</label>
<div class="part-grid" id="headGrid"></div>
</div>
<div class="form-group">
<label>眼睛</label>
<div class="part-grid" id="eyesGrid"></div>
</div>
</div>
<div class="form-row">
<div class="form-group">
<label>嘴巴</label>
<div class="part-grid" id="mouthGrid"></div>
</div>
<div class="form-group">
<label>发型</label>
<div class="part-grid" id="hairGrid"></div>
</div>
</div>
<div class="form-row">
<div class="form-group">
<label>配饰</label>
<div class="part-grid" id="accGrid"></div>
</div>
<div class="form-group">
<label>颜色</label>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
<div class="form-group" style="flex-direction:row;align-items:center;gap:4px;">
<label>肤色</label><input type="color" id="skinColor" value="#f5d0a9" oninput="updatePreview()">
</div>
<div class="form-group" style="flex-direction:row;align-items:center;gap:4px;">
<label>发色</label><input type="color" id="hairColor" value="#3d2b1f" oninput="updatePreview()">
</div>
<div class="form-group" style="flex-direction:row;align-items:center;gap:4px;">
<label>瞳色</label><input type="color" id="eyeColor" value="#4a2c17" oninput="updatePreview()">
</div>
<div class="form-group" style="flex-direction:row;align-items:center;gap:4px;">
<label>服装</label><input type="color" id="outfitColor" value="#4a6fa5" oninput="updatePreview()">
</div>
</div>
</div>
</div>
</div>

<div class="section">
<div class="section-title">角色预览</div>
<div class="preview-area">
<div class="char-preview" id="charPreview"></div>
<div class="radar-wrap">
<div class="section-title" style="font-size:1rem;">属性雷达图</div>
<canvas id="radarCanvas" width="250" height="250"></canvas>
</div>
</div>
</div>

<div class="section">
<div class="section-title">属性设定</div>
<div class="stat-row"><label>力量</label><input type="range" min="1" max="100" value="50" data-stat="力量" oninput="updateStats(this)"><span class="stat-val">50</span></div>
<div class="stat-row"><label>敏捷</label><input type="range" min="1" max="100" value="50" data-stat="敏捷" oninput="updateStats(this)"><span class="stat-val">50</span></div>
<div class="stat-row"><label>智力</label><input type="range" min="1" max="100" value="50" data-stat="智力" oninput="updateStats(this)"><span class="stat-val">50</span></div>
<div class="stat-row"><label>魅力</label><input type="range" min="1" max="100" value="50" data-stat="魅力" oninput="updateStats(this)"><span class="stat-val">50</span></div>
<div class="stat-row"><label>运气</label><input type="range" min="1" max="100" value="50" data-stat="运气" oninput="updateStats(this)"><span class="stat-val">50</span></div>
</div>

<div class="section">
<div class="section-title">操作</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
<button class="btn" onclick="saveCharacter()">💾 保存角色</button>
<button class="btn btn-secondary" onclick="exportJSON()">📤 导出 JSON</button>
<button class="btn btn-secondary btn-danger" onclick="clearSaved()">🗑️ 清空列表</button>
</div>
</div>

<div class="section">
<div class="section-title">已保存角色</div>
<div class="saved-list" id="savedList"><div style="color:var(--text-secondary);font-size:0.9rem;">暂无保存的角色</div></div>
</div>
</div>

<script>
const headShapes = ['圆形','方形','椭圆','菱形','心形'];
const eyesList = ['大眼','小眼','眯眼','圆眼','弯月'];
const mouthList = ['微笑','大笑','平静','惊讶','撅嘴'];
const hairList = ['短发','长发','马尾','光头','卷发'];
const accList = ['无','眼镜','帽子','耳环','围巾'];
let charState = { head:'圆形', eyes:'大眼', mouth:'微笑', hair:'短发', acc:'无', stats:{力量:50,敏捷:50,智力:50,魅力:50,运气:50} };
let savedCharacters = JSON.parse(localStorage.getItem('char_designer_saved') || '[]');

function toggleTheme() {
const html = document.documentElement;
html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
}

function initPartGrid(containerId, items, stateKey) {
const grid = document.getElementById(containerId);
items.forEach(item => {
const div = document.createElement('div');
div.className = 'part-option' + (charState[stateKey] === item ? ' active' : '');
const emojis = {
'圆形':'🔵','方形':'🟧','椭圆':'🟡','菱形':'🔷','心形':'❤️',
'大眼':'👀','小眼':'👁️','眯眼':'😑','圆眼':'🔵','弯月':'🌙',
'微笑':'😊','大笑':'😄','平静':'😐','惊讶':'😮','撅嘴':'😏',
'短发':'💇','长发':'🧝','马尾':'💇‍♀️','光发':'🧑‍🦲','卷发':'👩‍🦱',
'短发':'💇','长发':'🧝','马尾':'💇‍♀️','光头':'🧑‍🦲','卷发':'👩‍🦱',
'无':'❌','眼镜':'👓','帽子':'🎩','耳环':'💍','围巾':'🧣'
};
div.innerHTML = `<span class="emoji">${emojis[item]||'❓'}</span><span class="part-label">${item}</span>`;
div.onclick = () => {
charState[stateKey] = item;
grid.querySelectorAll('.part-option').forEach(p => p.classList.remove('active'));
div.classList.add('active');
updatePreview();
};
grid.appendChild(div);
});
}

function updatePreview() {
const preview = document.getElementById('charPreview');
const name = document.getElementById('charName').value || '未命名';
const role = document.getElementById('charRole').value;
const skin = document.getElementById('skinColor').value;
const hair = document.getElementById('hairColor').value;
const eyes = document.getElementById('eyeColor').value;
const outfit = document.getElementById('outfitColor').value;
const headEmoji = {'圆形':'🔵','方形':'🟧','椭圆':'🟡','菱形':'🔷','心形':'❤️'}[charState.head];
const eyeEmoji = {'大眼':'👀','小眼':'👁️','眯眼':'😑','圆眼':'🔵','弯月':'🌙'}[charState.eyes];
const mouthEmoji = {'微笑':'😊','大笑':'😄','平静':'😐','惊讶':'😮','撅嘴':'😏'}[charState.mouth];
const hairEmoji = {'短发':'💇','长发':'🧝','马尾':'💇‍♀️','光头':'🧑‍🦲','卷发':'👩‍🦱'}[charState.hair];
const accEmoji = {'无':'','眼镜':'👓','帽子':'🎩','耳环':'💍','围巾':'🧣'}[charState.acc];
preview.innerHTML = `
<div style="font-size:2.5rem;margin-bottom:4px;">${headEmoji}</div>
<div style="font-size:1.5rem;margin-bottom:-4px;">${eyeEmoji}</div>
<div style="font-size:1.3rem;margin-bottom:2px;">${mouthEmoji}</div>
<div style="font-size:1.5rem;margin-bottom:2px;">${hairEmoji}</div>
${accEmoji ? `<div style="font-size:1.3rem;margin-bottom:2px;">${accEmoji}</div>` : ''}
<div style="width:60px;height:40px;background:${outfit};border-radius:8px;margin:4px auto;"></div>
<div style="width:40px;height:50px;background:${outfit};border-radius:0 0 8px 8px;margin:0 auto;"></div>
<div style="font-size:0.9rem;font-weight:600;margin-top:8px;">${name}</div>
<div style="font-size:0.75rem;color:var(--text-secondary);">${role}</div>
`;
drawRadar();
}

function updateStats(el) {
const stat = el.dataset.stat;
charState.stats[stat] = +el.value;
el.nextElementSibling.textContent = el.value;
drawRadar();
}

function drawRadar() {
const canvas = document.getElementById('radarCanvas');
const ctx = canvas.getContext('2d');
const w = canvas.width, h = canvas.height;
const cx = w / 2, cy = h / 2;
const r = Math.min(w, h) / 2 - 30;
const stats = charState.stats;
const keys = Object.keys(stats);
const n = keys.length;
ctx.clearRect(0, 0, w, h);
for (let level = 1; level <= 5; level++) {
ctx.beginPath();
const lr = r * level / 5;
for (let i = 0; i <= n; i++) {
const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
const x = cx + lr * Math.cos(angle);
const y = cy + lr * Math.sin(angle);
i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
}
ctx.strokeStyle = 'rgba(128,128,128,0.3)';
ctx.lineWidth = 1;
ctx.stroke();
}
for (let i = 0; i < n; i++) {
const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
ctx.beginPath();
ctx.moveTo(cx, cy);
ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
ctx.strokeStyle = 'rgba(128,128,128,0.3)';
ctx.stroke();
ctx.fillStyle = 'var(--text)';
ctx.font = '12px system-ui';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
const lx = cx + (r + 18) * Math.cos(angle);
const ly = cy + (r + 18) * Math.sin(angle);
ctx.fillText(keys[i], lx, ly);
}
ctx.beginPath();
for (let i = 0; i <= n; i++) {
const idx = i % n;
const angle = (Math.PI * 2 * idx / n) - Math.PI / 2;
const val = stats[keys[idx]] / 100;
const x = cx + r * val * Math.cos(angle);
const y = cy + r * val * Math.sin(angle);
i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
}
ctx.fillStyle = 'rgba(139,92,246,0.3)';
ctx.fill();
ctx.strokeStyle = 'rgba(139,92,246,0.8)';
ctx.lineWidth = 2;
ctx.stroke();
for (let i = 0; i < n; i++) {
const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
const val = stats[keys[i]] / 100;
ctx.beginPath();
ctx.arc(cx + r * val * Math.cos(angle), cy + r * val * Math.sin(angle), 4, 0, Math.PI * 2);
ctx.fillStyle = '#8b5cf6';
ctx.fill();
}
}

function saveCharacter() {
const char = {
name: document.getElementById('charName').value || '未命名',
role: document.getElementById('charRole').value,
head: charState.head, eyes: charState.eyes, mouth: charState.mouth,
hair: charState.hair, acc: charState.acc,
skin: document.getElementById('skinColor').value,
hairColor: document.getElementById('hairColor').value,
eyeColor: document.getElementById('eyeColor').value,
outfit: document.getElementById('outfitColor').value,
stats: {...charState.stats},
id: Date.now()
};
savedCharacters.push(char);
localStorage.setItem('char_designer_saved', JSON.stringify(savedCharacters));
renderSavedList();
}

function exportJSON() {
const char = {
name: document.getElementById('charName').value || '未命名',
role: document.getElementById('charRole').value,
head: charState.head, eyes: charState.eyes, mouth: charState.mouth,
hair: charState.hair, acc: charState.acc,
skin: document.getElementById('skinColor').value,
hairColor: document.getElementById('hairColor').value,
eyeColor: document.getElementById('eyeColor').value,
outfit: document.getElementById('outfitColor').value,
stats: {...charState.stats}
};
const blob = new Blob([JSON.stringify(char, null, 2)], {type:'application/json'});
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = `${char.name}.json`;
a.click();
}

function clearSaved() {
if (!confirm('确定要清空所有保存的角色吗？')) return;
savedCharacters = [];
localStorage.removeItem('char_designer_saved');
renderSavedList();
}

function loadCharacter(id) {
const c = savedCharacters.find(ch => ch.id === id);
if (!c) return;
document.getElementById('charName').value = c.name;
document.getElementById('charRole').value = c.role;
document.getElementById('skinColor').value = c.skin;
document.getElementById('hairColor').value = c.hairColor;
document.getElementById('eyeColor').value = c.eyeColor;
document.getElementById('outfitColor').value = c.outfit;
charState = { head:c.head, eyes:c.eyes, mouth:c.mouth, hair:c.hair, acc:c.acc, stats:{...c.stats} };
document.querySelectorAll('.part-option').forEach(p => p.classList.remove('active'));
['headGrid','eyesGrid','mouthGrid','hairGrid','accGrid'].forEach((gid, gi) => {
const key = ['head','eyes','mouth','hair','acc'][gi];
const grid = document.getElementById(gid);
grid.querySelectorAll('.part-option').forEach(opt => {
if (opt.querySelector('.part-label').textContent === charState[key]) opt.classList.add('active');
});
});
document.querySelectorAll('.stat-row input[type="range"]').forEach(inp => {
const val = charState.stats[inp.dataset.stat];
inp.value = val;
inp.nextElementSibling.textContent = val;
});
updatePreview();
}

function deleteCharacter(id) {
savedCharacters = savedCharacters.filter(c => c.id !== id);
localStorage.setItem('char_designer_saved', JSON.stringify(savedCharacters));
renderSavedList();
}

function renderSavedList() {
const list = document.getElementById('savedList');
if (savedCharacters.length === 0) {
list.innerHTML = '<div style="color:var(--text-secondary);font-size:0.9rem;">暂无保存的角色</div>';
return;
}
list.innerHTML = savedCharacters.map(c => `
<div class="saved-item">
<span>${c.name} (${c.role})</span>
<div class="btns">
<button class="btn btn-small btn-secondary" onclick="loadCharacter(${c.id})">载入</button>
<button class="btn btn-small btn-danger" onclick="deleteCharacter(${c.id})">删除</button>
</div>
</div>
`).join('');
}

initPartGrid('headGrid', headShapes, 'head');
initPartGrid('eyesGrid', eyesList, 'eyes');
initPartGrid('mouthGrid', mouthList, 'mouth');
initPartGrid('hairGrid', hairList, 'hair');
initPartGrid('accGrid', accList, 'acc');
renderSavedList();
updatePreview();
</script>
</body>
</html>
