<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视觉小说 - 四季之恋</title>
    <meta name="description" content="视觉小说游戏，在四季之恋中体验浪漫故事">
    <style>
:root {--bg: #0d1117;
--card: #161b22;
--border: #30363d;
--text: #e6edf3;
--accent: #3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
* {margin: 0;
padding: 0;
box-sizing: border-box}
body {font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20pxscroll-behavior:smooth;}
.game-container {max-width: 900px;
width: 100%;
background: var(--card);
border: 1px solid var(--border);
border-radius: 12px;
overflow: hidden}
.game-header {background: linear-gradient(135deg, #ec4899, #8b5cf6);
padding: 15px 20px;
display: flex;
justify-content: space-between;
align-items: center}
.game-header h1 {font-size: 1.4rem}
.chapter-info {font-size: 0.9rem;
opacity: 0.9}
.scene-area {position: relative;
height: 300px;
overflow: hidden}
.background {position: absolute;
width: 100%;
height: 100%;
transition: background 0.5s}
.bg-classroom { background: linear-gradient(180deg, #1e3a5f 0%, #2d5a87 100%); }
.bg-park { background: linear-gradient(180deg, #1a472a 0%, #2d7a4f 100%); }
.bg-cafe { background: linear-gradient(180deg, #4a3728 0%, #6b4f3a 100%); }
.bg-sunset { background: linear-gradient(180deg, #d97706 0%, #ec4899 100%); }
.bg-rain { background: linear-gradient(180deg, #374151 0%, #6b7280 100%); }
.characters {position: absolute;
bottom: 0;
width: 100%;
height: 100%;
display: flex;
justify-content: center;
align-items: flex-end;
gap: 50px;
padding-bottom: 20px}
.character {position: relative;
transition: all 0.3s}
.character.active {transform: scale(1.1)}
.character.speaking {animation: bounce 0.5s}
@keyframes bounce {0%, 100% { transform: translateY(0); }
50% { transform: translateY(-10px); }}
.character-avatar {width: 100px;
height: 120px;
border-radius: 50% 50% 45% 45%;
position: relative;
overflow: hidden}
.avatar-sakura {background: linear-gradient(135deg, #fce7f3, #fbcfe8)}
.avatar-haruki {background: linear-gradient(135deg, #dbeafe, #bfdbfe)}
.avatar-me {background: linear-gradient(135deg, #d1d5db, #9ca3af)}
.avatar-hair {position: absolute;
top: 0;
left: 0;
right: 0;
height: 45px;
border-radius: 50% 50% 0 0}
.hair-pink { background: linear-gradient(180deg, #ec4899, #f472b6); }
.hair-blue { background: linear-gradient(180deg, #3b82f6, #60a5fa); }
.hair-brown { background: linear-gradient(180deg, #92400e, #b45309); }
.avatar-face {position: absolute;
top: 35px;
left: 50%;
transform: translateX(-50%);
width: 60px;
height: 50px;
background: #fde68a;
border-radius: 50%}
.avatar-eyes {position: absolute;
top: 12px;
left: 50%;
transform: translateX(-50%);
display: flex;
gap: 15px}
.eye {width: 12px;
height: 12px;
background: var(--bg);
border-radius: 50%;
position: relative}
.eye::after {content: '';
position: absolute;
top: 2px;
right: 2px;
width: 4px;
height: 4px;
background: white;
border-radius: 50%}
.eye.happy {height: 6px;
border-radius: 0 0 10px 10px}
.eye.sad {height: 8px;
border-radius: 50% 50% 0 0}
.avatar-mouth {position: absolute;
bottom: 12px;
left: 50%;
transform: translateX(-50%);
width: 15px;
height: 8px;
border: 2px solid #dc2626;
border-top: none;
border-radius: 0 0 10px 10px}
.mouth-happy {border-color: #dc2626}
.mouth-sad {border-radius: 10px 10px 0 0;
border: 2px solid #dc2626;
border-bottom: none;
top: 35px}
.avatar-body {position: absolute;
bottom: 0;
left: 50%;
transform: translateX(-50%);
width: 70px;
height: 40px;
border-radius: 10px 10px 0 0}
.body-school { background: linear-gradient(180deg, #1f2937, #374151); }
.body-casual { background: linear-gradient(180deg, #059669, #10b981); }
.character-name {position: absolute;
bottom: -25px;
left: 50%;
transform: translateX(-50%);
font-size: 0.9rem;
white-space: nowrap;
text-shadow: 1px 1px 2px rgba(0,0,0,0.8)}
.dialogue-area {position: relative;
background: rgba(0,0,0,0.8);
min-height: 180px;
padding: 20px}
.speaker-name {position: absolute;
top: -15px;
left: 20px;
background: var(--accent);
padding: 5px 15px;
border-radius: 15px;
font-size: 0.9rem;
font-weight: bold}
.speaker-name.sakura { background: #ec4899; }
.speaker-name.haruki { background: #3b82f6; }
.speaker-name.narrator { background: #6b7280; }
.dialogue-text {margin-top: 10px;
line-height: 1.8;
font-size: 1rem}
.choices {display: flex;
flex-direction: column;
gap: 10px;
margin-top: 15px}
.choice-btn {background: rgba(255,255,255,0.1);
border: 1px solid var(--border);
color: var(--text);
padding: 12px 15px;
border-radius: 8px;
cursor: pointer;
text-align: left;
font-size: 0.95rem;
transition: all 0.3s}
.choice-btn:hover {border-color: #ec4899;
background: rgba(236, 72, 153, 0.2)}
.continue-btn {position: absolute;
bottom: 15px;
right: 20px;
background: none;
border: none;
color: var(--text);
opacity: 0.6;
cursor: pointer;
animation: blink 1s infinite}
@keyframes blink {0%, 100% { opacity: 0.6; }
50% { opacity: 1; }}
.stats-bar {display: flex;
gap: 20px;
padding: 15px 20px;
background: rgba(0,0,0,0.3);
flex-wrap: wrap}
.stat {display: flex;
align-items: center;
gap: 8px}
.stat-bar {width: 100px;
height: 8px;
background: rgba(255,255,255,0.2);
border-radius: 4px;
overflow: hidden}
.stat-fill {height: 100%;
border-radius: 4px;
transition: width 0.3s}
.stat-fill.sakura { background: #ec4899; }
.stat-fill.haruki { background: #3b82f6; }
.ending-overlay {position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: rgba(0,0,0,0.9);
display: flex;
justify-content: center;
align-items: center;
z-index: 100}
.ending-content {text-align: center;
padding: 40px}
.ending-content h2 {font-size: 2rem;
margin-bottom: 20px;
color: #ec4899}
.ending-content p {font-size: 1.1rem;
line-height: 1.8;
margin-bottom: 20px;
max-width: 500px}
.restart-btn {padding: 12px 30px;
background: var(--accent);
border: none;
color: white;
border-radius: 8px;
cursor: pointer;
font-size: 1rem}
.hidden { display: none !important; }
@media (max-width: 600px) {.character-avatar { width: 80px; height: 96px; }
.avatar-face { width: 48px; height: 40px; top: 28px; }
.avatar-eyes { gap: 12px; }
.eye { width: 10px; height: 10px; }
.dialogue-area { min-height: 160px; padding: 15px; }}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="视觉小说 - 四季之恋">
  <meta property="og:description" content="视觉小说游戏，在四季之恋中体验浪漫故事">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/visual-novel/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
    <div class="game-container">
        <div class="game-header">
            <h1>四季之恋</h1>
            <span class="chapter-info" id="chapter-info">序章</span>
        </div>

        <div class="scene-area">
            <div class="background bg-classroom" id="background"></div>
            <div class="characters" id="characters"></div>
        </div>

        <div class="dialogue-area">
            <span class="speaker-name narrator" id="speaker-name"></span>
            <div class="dialogue-text" id="dialogue-text"></div>
            <div class="choices hidden" id="choices"></div>
            <button class="continue-btn" id="continue-btn">▼ 继续</button>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <span>樱好感:</span>
                <div class="stat-bar">
                    <div class="stat-fill sakura" id="sakura-bar" style="width: 30%"></div>
                </div>
                <span id="sakura-val">30</span>
            </div>
            <div class="stat">
                <span>晴好感:</span>
                <div class="stat-bar">
                    <div class="stat-fill haruki" id="haruki-bar" style="width: 30%"></div>
                </div>
                <span id="haruki-val">30</span>
            </div>
        </div>
    </div>

    <div class="ending-overlay hidden" id="ending-overlay">
        <div class="ending-content">
            <h2 id="ending-title"></h2>
            <p id="ending-text"></p>
            <button class="restart-btn" onclick="restart()">重新开始</button>
        </div>
    </div>

    <script>
        const gameState = {
            sakura: 30,
            haruki: 30,
            currentScene: 0,
            flags: {}
        };
        const script = [
            { bg: 'bg-classroom', chapter: '序章 - 春日的相遇' },
            { speaker: 'narrator', name: '旁白', text: '四月，樱花盛开的季节。你转学来到这所新的学校，一切都是那么陌生。' },
            { speaker: 'narrator', name: '旁白', text: '走进教室，同学们好奇地看着你。老师让你坐到靠窗的位置。' },
            { speaker: 'narrator', name: '旁白', text: '坐下后，你发现旁边坐着一个粉色头发的女孩，她正安静地看着窗外。' },
            { speaker: 'sakura', name: '樱', text: '（小声）啊...你是新来的转学生吗？', emotion: 'surprised' },
            { speaker: 'me', name: '你', text: '是的，我叫...请多指教。' },
            { speaker: 'sakura', name: '樱', text: '我叫樱。欢迎来到这个班级。如果你有什么不懂的，可以问我。', emotion: 'happy' },
            {
                choices: [
                    { text: '谢谢，你看起来很温柔', next: 8, sakura: 10 },
                    { text: '这个学校怎么样？', next: 9, haruki: 5 },
                    { text: '点头微笑', next: 10 }
                ]
            },
            { speaker: 'sakura', name: '樱', text: '（脸红）没、没有啦...我只是...', emotion: 'shy' },
            { speaker: 'narrator', name: '旁白', text: '这时候，一个蓝头发的男孩从后面拍了拍你的肩膀。' },
            { speaker: 'haruki', name: '晴', text: '嘿！你就是新来的吧？我叫晴，放学后要不要一起去打篮球？', emotion: 'happy' },
            { bg: 'bg-park', chapter: '第一章 - 夏日的约定' },
            { speaker: 'narrator', name: '旁白', text: '放学后，你走在回家的路上。经过一个公园时，你看到了樱的身影。' },
            { speaker: 'narrator', name: '旁白', text: '她一个人坐在长椅上，看着天空发呆。' },
            {
                choices: [
                    { text: '走过去打招呼', next: 14, sakura: 10 },
                    { text: '假装没看见离开', next: 16 }
                ]
            },
            { speaker: 'sakura', name: '樱', text: '啊，是你啊...你每天都走这条路吗？', emotion: 'surprised' },
            { speaker: 'me', name: '你', text: '是啊，这里风景不错。你呢？', sakura: 5 },
            { speaker: 'sakura', name: '樱', text: '我...只是喜欢在这里想事情。有时候觉得一个人也挺好的。', emotion: 'sad' },
            { speaker: 'narrator', name: '旁白', text: '你在她旁边坐下，两个人一起看着夕阳。' },
            { speaker: 'sakura', name: '樱', text: '谢谢你陪我。很少有人愿意听我说话。', emotion: 'happy' },
            { bg: 'bg-cafe', chapter: '第二章 - 秋日的告白' },
            { speaker: 'narrator', name: '旁白', text: '秋天到了。周末，晴约你去咖啡厅。' },
            { speaker: 'haruki', name: '晴', text: '最近樱好像总是心不在焉的，你知道发生什么了吗？', emotion: 'concern' },
            {
                choices: [
                    { text: '我知道，她最近有些烦恼', next: 20, sakura: 10, haruki: 5 },
                    { text: '不清楚，你去问问她吧', next: 21 }
                ]
            },
            { speaker: 'haruki', name: '晴', text: '原来如此...你和樱的关系变好了呢。', emotion: 'sad' },
            { speaker: 'haruki', name: '晴', text: '其实...我一直喜欢樱。但她好像对我没有那种感觉。', emotion: 'sad' },
            { speaker: 'me', name: '你', text: '晴...' },
            { speaker: 'haruki', name: '晴', text: '没关系，我已经决定了。不管结果如何，我要亲口告诉她。', emotion: 'determined' },
            { bg: 'bg-sunset', chapter: '第三章 - 冬日的抉择' },
            { speaker: 'narrator', name: '旁白', text: '冬天来临了。某天放学后，樱叫住了你。' },
            { speaker: 'sakura', name: '樱', text: '那个...我有话想跟你说。', emotion: 'nervous' },
            { speaker: 'narrator', name: '旁白', text: '你们来到了学校天台。夕阳将天空染成了橙红色。' },
            { speaker: 'sakura', name: '樱', text: '其实...我一直想告诉你...', emotion: 'nervous' },
            { speaker: 'narrator', name: '旁白', text: '就在这时，晴出现了。' },
            { speaker: 'haruki', name: '晴', text: '樱！我终于找到你了。我有话要对你说！', emotion: 'determined' },
            { speaker: 'narrator', name: '旁白', text: '三个人陷入了沉默。风吹过天台，带来一丝寒意。' },
            {
                choices: [
                    { text: '让晴先说', next: 30, haruki: 15, sakura: -10 },
                    { text: '告诉樱你的心意', next: 31, sakura: 20 },
                    { text: '默默离开', next: 32 }
                ]
            },
            { speaker: 'haruki', name: '晴', text: '樱，我喜欢你。从很久以前就喜欢你了。', emotion: 'love' },
            { speaker: 'sakura', name: '樱', text: '晴...对不起，我一直把你当朋友。', emotion: 'sad' },
            { speaker: 'narrator', name: '旁白', text: '樱转向了你，眼中含着泪水。' },
            { speaker: 'sakura', name: '樱', text: '其实...我喜欢的人是...', emotion: 'love' },
            { speaker: 'me', name: '你', text: '樱，从遇见你的那天起，我就一直喜欢着你。', sakura: 20 },
            { speaker: 'sakura', name: '樱', text: '我也是...我一直在等你亲口说出来。', emotion: 'love' },
            { speaker: 'narrator', name: '旁白', text: '夕阳下，两个人紧紧相拥。晴默默转身离开了。' },
            { speaker: 'haruki', name: '晴', text: '（独自）果然...是这样啊。不过，看到她幸福的样子，我也觉得值了。', emotion: 'accept' },
            { speaker: 'narrator', name: '旁白', text: '晴望着你们的背影，微笑着流下了眼泪。' },
            { ending: true }
        ];
        function updateStats() {
            gameState.sakura = Math.max(0, Math.min(100, gameState.sakura));
            gameState.haruki = Math.max(0, Math.min(100, gameState.haruki));
            document.getElementById('sakura-bar').style.width = gameState.sakura + '%';
            document.getElementById('haruki-val').textContent = gameState.sakura;
            document.getElementById('haruki-bar').style.width = gameState.haruki + '%';
            document.getElementById('haruki-val').textContent = gameState.haruki;
        }
        function renderCharacter(name, emotion = 'normal') {
            const container = document.getElementById('characters');
            container.innerHTML = '';
            const characters = [
                { id: 'sakura', class: 'avatar-sakura', hair: 'hair-pink', body: 'body-school', name: '樱' },
                { id: 'haruki', class: 'avatar-haruki', hair: 'hair-blue', body: 'body-school', name: '晴' },
                { id: 'me', class: 'avatar-me', hair: 'hair-brown', body: 'body-casual', name: '你' }
            ];
            const activeChars = name === 'me' ? ['me'] : [name];
            activeChars.forEach(charId => {
                const char = characters.find(c => c.id === charId);
                if (!char) return;
                const eyeClass = emotion === 'happy' ? 'happy' : emotion === 'sad' ? 'sad' : '';
                const mouthClass = emotion === 'happy' || emotion === 'love' ? 'mouth-happy' : emotion === 'sad' ? 'mouth-sad' : '';
                const div = document.createElement('div');
                div.className = `character ${name === charId ? 'active speaking' : ''}`;
                div.innerHTML = `
                    <div class="character-avatar ${char.class}">
                        <div class="avatar-hair ${char.hair}"></div>
                        <div class="avatar-face">
                            <div class="avatar-eyes">
                                <div class="eye ${eyeClass}"></div>
                                <div class="eye ${eyeClass}"></div>
                            </div>
                            <div class="avatar-mouth ${mouthClass}"></div>
                        </div>
                        <div class="avatar-body ${char.body}"></div>
                    </div>
                    <div class="character-name">${char.name}</div>
                `;
                container.appendChild(div);
            });
        }
        function showChoices(choices) {
            const container = document.getElementById('choices');
            container.innerHTML = '';
            container.classList.remove('hidden');
            document.getElementById('continue-btn').classList.add('hidden');
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text;
                btn.onclick = () => {
                    if (choice.sakura) gameState.sakura += choice.sakura;
                    if (choice.haruki) gameState.haruki += choice.haruki;
                    updateStats();
                    gameState.currentScene = choice.next;
                    renderScene();
                };
                container.appendChild(btn);
            });
        }
        function renderScene() {
            const scene = script[gameState.currentScene];
            if (scene.ending) {
                showEnding();
                return;
            }
            if (scene.bg) {
                document.getElementById('background').className = `background ${scene.bg}`;
                document.getElementById('chapter-info').textContent = scene.chapter;
            }
            if (scene.choices) {
                showChoices(scene.choices);
                return;
            }
            document.getElementById('choices').classList.add('hidden');
            document.getElementById('continue-btn').classList.remove('hidden');
            const speakerName = document.getElementById('speaker-name');
            speakerName.textContent = scene.name;
            speakerName.className = `speaker-name ${scene.speaker}`;
            document.getElementById('dialogue-text').textContent = scene.text;
            if (scene.speaker !== 'narrator') {
                renderCharacter(scene.speaker, scene.emotion);
            } else {
                document.getElementById('characters').innerHTML = '';
            }
        }
        function showEnding() {
            const overlay = document.getElementById('ending-overlay');
            const title = document.getElementById('ending-title');
            const text = document.getElementById('ending-text');
            if (gameState.sakura >= 60 && gameState.haruki < 40) {
                title.textContent = '结局：永恒的誓言';
                text.textContent = '你和樱在一起了。虽然晴一开始很失落，但最终他选择祝福你们。三个人的友谊经受住了考验，变得更加坚固。多年后，你和樱携手走进了婚姻的殿堂，而晴是你们最好的见证人。';
            } else if (gameState.haruki >= 60 && gameState.sakura < 40) {
                title.textContent = '结局：兄弟情深';
                text.textContent = '你和晴成为了最好的朋友。樱虽然有些失落，但她理解并接受了这个结果。三个人一起度过了美好的校园时光，毕业后各奔东西，但那份珍贵的友谊永远留在心中。';
            } else if (gameState.sakura >= 50 && gameState.haruki >= 50) {
                title.textContent = '结局：三人的约定';
                text.textContent = '三个人做出了一个约定：不管将来发生什么，都要保持这份珍贵的友谊。你和樱互相喜欢，但你不想伤害晴。最终，三个人决定一起努力，创造属于他们的未来。';
            } else {
                title.textContent = '结局：青春的遗憾';
                text.textContent = '你错过了表达心意的机会。樱和晴各自有了自己的生活，而你只能在回忆中想起这段青春岁月。多年后回想起来，你只留下了深深的遗憾。';
            }
            overlay.classList.remove('hidden');
        }
        function restart() {
            gameState.sakura = 30;
            gameState.haruki = 30;
            gameState.currentScene = 0;
            gameState.flags = {};
            updateStats();
            document.getElementById('ending-overlay').classList.add('hidden');
            renderScene();
        }
        document.getElementById('continue-btn').onclick = () => {
            gameState.currentScene++;
            renderScene();
        };
        updateStats();
        renderScene();
    </script>
<script src="../i18n.js" defer></script>
</body>
</html>
