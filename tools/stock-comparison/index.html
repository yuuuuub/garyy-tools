<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票对比工具</title>
<meta name="description" content="股票对比分析工具，同时对比多只股票走势">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vhscroll-behavior:smooth;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus{outline:none;border-color:var(--blue)}
.btn{background:var(--blue);color:var(--text);border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;font-size:.78rem;margin-left:4px}
.btn-sm:hover{border-color:var(--red);color:var(--red)}
.search-row{display:flex;gap:8px;margin-bottom:10px}
.search-row input{flex:1}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:.78rem}
.tag .remove{cursor:pointer;color:var(--text2);font-size:1rem;line-height:1}
.tag .remove:hover{color:var(--red)}
.compare-table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
.compare-table th,.compare-table td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--border)}
.compare-table th{color:var(--text2);font-weight:500;background:var(--bg);text-align:center}
.compare-table th:first-child{text-align:left}
.compare-table td:first-child{text-align:left;color:var(--text2);font-weight:500}
.bar-chart{display:flex;align-items:center;gap:6px}
.bar{height:20px;border-radius:4px;transition:width .5s;min-width:2px}
.bar-label{font-size:.72rem;color:var(--text2);white-space:nowrap}
.bar-row{display:flex;align-items:center;margin:6px 0;gap:8px}
.bar-row .label{min-width:60px;font-size:.8rem;color:var(--text2)}
.bar-row .bar-track{flex:1;background:var(--bg);border-radius:4px;height:20px;overflow:hidden}
.bar-row .bar-track .bar-fill{height:100%;border-radius:4px;transition:width .6s}
.bar-row .val{min-width:60px;text-align:right;font-size:.8rem;font-weight:600}
.up{color:var(--green)}
.down{color:var(--red)}
.hint{font-size:.78rem;color:var(--text2);margin-top:6px;text-align:center}
@media(max-width:640px){.compare-table{font-size:.78rem}.compare-table th,.compare-table td{padding:6px 4px}}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="股票对比工具">
  <meta property="og:description" content="股票对比分析工具，同时对比多只股票走势">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/stock-comparison/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📊 股票对比</h1>
    <p>对比多只股票关键指标</p>
  </header>

  <div class="card">
    <div class="search-row">
      <input type="text" id="stockInput" placeholder="输入股票代码 (如 AAPL,MSFT,GOOGL)" title="Enter键搜索">
      <button class="btn" id="addBtn">添加</button>
    </div>
    <div class="tag-list" id="tagList"></div>
    <div class="hint">输入股票代码后点击添加，至少添加2只股票进行对比</div>
  </div>

  <div id="compareResult"></div>
</div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const stockInput = $('stockInput');
const addBtn = $('addBtn');
const tagList = $('tagList');
const compareResult = $('compareResult');
let stocks = ['AAPL', 'MSFT', 'GOOGL'];
const mockData = {
  AAPL:{name:'Apple Inc.',price:198.72,change:1.35,pe:30.2,eps:6.58,div:0.52,mktCap:'2.98T',volume:52400000},
  MSFT:{name:'Microsoft Corp.',price:458.19,change:0.87,pe:36.8,eps:12.45,div:0.72,mktCap:'3.41T',volume:18200000},
  GOOGL:{name:'Alphabet Inc.',price:174.35,change:-0.23,pe:26.4,eps:6.60,div:0.20,mktCap:'2.15T',volume:28500000},
  AMZN:{name:'Amazon.com Inc.',price:198.02,change:1.12,pe:50.1,eps:3.95,div:0,mktCap:'2.06T',volume:41500000},
  TSLA:{name:'Tesla Inc.',price:263.55,change:-0.88,pe:62.3,eps:4.23,div:0,mktCap:'837B',volume:108000000},
  META:{name:'Meta Platforms',price:527.34,change:1.55,pe:27.9,eps:18.90,div:0.50,mktCap:'1.34T',volume:15600000},
  NVDA:{name:'NVIDIA Corp.',price:950.02,change:3.21,pe:75.4,eps:12.60,div:0.04,mktCap:'2.34T',volume:43200000},
  AMD:{name:'AMD Inc.',price:172.55,change:0.64,pe:48.2,eps:3.58,div:0,mktCap:'278B',volume:56300000},
  BA:{name:'Boeing Co.',price:193.88,change:-0.45,pe:0,eps:-4.12,div:0,mktCap:'118B',volume:12800000},
  JPM:{name:'JPMorgan Chase',price:205.45,change:0.52,pe:12.3,eps:16.68,div:4.25,mktCap:'591B',volume:9500000},
  V:{name:'Visa Inc.',price:280.30,change:0.33,pe:31.5,eps:8.90,div:1.60,mktCap:'575B',volume:8500000},
  DIS:{name:'Walt Disney Co.',price:115.42,change:-0.78,pe:22.8,eps:5.06,div:0.45,mktCap:'210B',volume:14300000}
};
function getStockData(code){
  const c = code.toUpperCase();
  if(mockData[c]) return mockData[c];
  return {
    name: c + ' Inc.',
    price: Math.round(Math.random()*50000+10)/100,
    change: Math.round((Math.random()*10-5)*100)/100,
    pe: Math.round((Math.random()*80+5)*10)/10,
    eps: Math.round(Math.random()*2000)/100,
    div: Math.round(Math.random()*600)/100,
    mktCap: ['125B','58B','340B','890B','42B','2.1T'][Math.floor(Math.random()*6)],
    volume: Math.round(Math.random()*100000000+1000000)
  };
}
function renderTags(){
  tagList.innerHTML = stocks.map((s,i) =>
    `<span class="tag">${s.toUpperCase()} <span class="remove" data-i="${i}">&times;</span></span>`
  ).join('');
  tagList.querySelectorAll('.remove').forEach(el => {
    el.addEventListener('click', () => {
      stocks.splice(parseInt(el.dataset.i), 1);
      renderTags();
      renderCompare();
    });
  });
}
function renderCompare(){
  if(stocks.length < 2){
    compareResult.innerHTML = '<div class="card" style="text-align:center;color:var(--text2);padding:40px">请添加至少2只股票进行对比</div>';
    return;
  }
  const data = stocks.map(s => ({code:s.toUpperCase(), data:getStockData(s.toUpperCase())}));
  const maxPrice = Math.max(...data.map(d => d.data.price));
  const maxPE = Math.max(...data.map(d => d.data.pe));
  const maxEps = Math.max(...data.map(d => d.data.eps));
  let html = '<div class="card"><table class="compare-table"><thead><tr><th>指标</th>';
  data.forEach(d => { html += `<th>${d.code}</th>`; });
  html += '</tr></thead><tbody>';
  html += '<tr><td>价格</td>';
  data.forEach(d => {
    const pct = (d.data.price / maxPrice * 100);
    html += `<td><div class="bar-chart"><div class="bar" style="width:${pct*0.6}px;background:var(--blue)"></div>$${d.data.price.toFixed(2)}</div></td>`;
  });
  html += '</tr>';
  html += '<tr><td>涨跌幅</td>';
  data.forEach(d => {
    const cls = d.data.change >= 0 ? 'up' : 'down';
    html += `<td class="${cls}">${d.data.change >= 0 ? '+' : ''}${d.data.change.toFixed(2)}%</td>`;
  });
  html += '</tr>';
  html += '<tr><td>市盈率(PE)</td>';
  data.forEach(d => {
    const pct = d.data.pe > 0 ? (d.data.pe / maxPE * 100) : 0;
    html += `<td><div class="bar-chart"><div class="bar" style="width:${pct*0.6}px;background:var(--gold)"></div>${d.data.pe > 0 ? d.data.pe.toFixed(1) : '--'}</div></td>`;
  });
  html += '</tr>';
  html += '<tr><td>每股收益(EPS)</td>';
  data.forEach(d => {
    const pct = d.data.eps > 0 ? (d.data.eps / maxEps * 100) : 0;
    html += `<td><div class="bar-chart"><div class="bar" style="width:${pct*0.6}px;background:var(--green)"></div>$${d.data.eps.toFixed(2)}</div></td>`;
  });
  html += '</tr>';
  html += '<tr><td>股息</td>';
  data.forEach(d => {
    html += `<td>$${d.data.div.toFixed(2)}</td>`;
  });
  html += '</tr>';
  html += '<tr><td>市值</td>';
  data.forEach(d => {
    html += `<td>${d.data.mktCap}</td>`;
  });
  html += '</tr>';
  html += '<tr><td>成交量</td>';
  data.forEach(d => {
    html += `<td>${(d.data.volume/1000000).toFixed(1)}M</td>`;
  });
  html += '</tr>';
  html += '</tbody></table></div>';
  html += '<div class="card"><div class="section-title">📊 价格对比图</div>';
  data.forEach(d => {
    const pct = (d.data.price / maxPrice * 100);
    const color = d.data.change >= 0 ? 'var(--green)' : 'var(--red)';
    html += `<div class="bar-row">
      <div class="label">${d.code}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="val">$${d.data.price.toFixed(2)}</div>
    </div>`;
  });
  html += '</div>';
  html += '<div class="card"><div class="section-title">📊 市盈率(PE)对比</div>';
  data.forEach(d => {
    const pct = d.data.pe > 0 ? (d.data.pe / maxPE * 100) : 0;
    html += `<div class="bar-row">
      <div class="label">${d.code}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--gold)"></div></div>
      <div class="val">${d.data.pe > 0 ? d.data.pe.toFixed(1) : '--'}</div>
    </div>`;
  });
  html += '</div>';
  html += '<div class="hint">数据为模拟数据，仅供参考</div>';
  compareResult.innerHTML = html;
}
addBtn.addEventListener('click', () => {
  const val = stockInput.value.trim().toUpperCase();
  if(!val) return;
  if(stocks.includes(val)) return;
  if(stocks.length >= 6){ garyyToast('最多对比6只股票'); return; }
  stocks.push(val);
  stockInput.value = '';
  renderTags();
  renderCompare();
});
stockInput.addEventListener('keydown', e => {
  if(e.key === 'Enter') addBtn.click();
});
renderTags();
renderCompare();
})();
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
