<style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d29922}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#9a6700}body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;line-height:1.6}.container{max-width:800px;margin:0 auto}h1{text-align:center;padding:20px 0 4px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}.tab-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.82rem;transition:all .2s}.tab.active{background:var(--gold);color:#000;border-color:var(--gold)}.timeline{position:relative;padding-left:24px}.timeline::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--border)}.timeline-item{position:relative;margin-bottom:16px;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;transition:all .2s}.timeline-item:hover{border-color:var(--gold);transform:translateX(4px)}.timeline-item::before{content:'';position:absolute;left:-18px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}.year-badge{display:inline-block;padding:2px 10px;background:rgba(210,153,34,.15);color:var(--gold);border-radius:12px;font-size:.8rem;font-weight:600;margin-bottom:6px}.champion{font-size:1.1rem;font-weight:700;margin-bottom:4px}.host{font-size:.85rem;color:var(--text2)}.highlight{color:var(--gold)}.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.stat-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}.stat-num{font-size:1.5rem;font-weight:700;color:var(--gold)}.stat-label{font-size:.8rem;color:var(--text2);margin-top:2px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}@media(max-width:480px){body{padding:12px}}</style></head><body>

var champCount={};
history.forEach(function(h){
  var c=h.champion.replace(/[\u{1F1E0}-\u{1F1FF}]{2}/gu,'').trim();
  champCount[c]=(champCount[c]||0)+1;
});

function showView(view,el){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  var content=document.getElementById('content');
  
  if(view==='timeline'){
    var html='<div class="timeline">';
    history.forEach(function(h){
      html+='<div class="timeline-item">';
      html+='<span class="year-badge">'+h.year+'</span>';
      html+='<div class="champion">'+h.champion+'</div>';
      html+='<div class="host">东道主：'+h.host+'</div>';
      html+='<div style="font-size:.82rem;color:var(--text2);margin-top:4px">亚军：'+h.runner_up+' | 季军：'+h.third+'</div>';
      html+='<div style="font-size:.8rem;color:var(--text2);margin-top:2px">金靴：'+h.golden_boot+' | 金球：'+h.golden_ball+'</div>';
      html+='</div>';
    });
    html+='</div>';
    content.innerHTML=html;
  } else {
    var sorted=Object.entries(champCount).sort(function(a,b){return b[1]-a[1]});
    var html='<div class="stats-grid">';
    sorted.forEach(function(e){
      html+='<div class="stat-item"><div class="stat-num">'+e[1]+'</div><div class="stat-label">'+e[0]+'</div></div>';
    });
    html+='</div>';
    html+='<div class="card" style="margin-top:12px"><h3 style="font-size:1rem;color:var(--gold);margin-bottom:8px;text-align:center">📊 世界杯之最</h3>';
    html+='<div style="font-size:.88rem;line-height:2">';
    html+='<div>🥇 冠军最多：<strong class="highlight">巴西</strong> (5次)</div>';
    html+='<div>⚽ 单场最高进球：<strong class="highlight">1954年 匈牙利 9:3 韩国</strong></div>';
    html+='<div>👟 单届最高进球：<strong class="highlight">方丹 13球 (1958)</strong></div>';
    html+='<div>🏆 连续夺冠：<strong class="highlight">巴西 (1958,1962)</strong></div>';
    html+='<div>🌍 参赛国家：<strong class="highlight">48支 (2026年起)</strong></div>';
    html+='<div>🏟️ 决赛场馆：<strong class="highlight">22座不同球场</strong></div>';
    html+='<div>📺 最高收视：<strong class="highlight">2022决赛 15亿观众</strong></div>';
    html+='</div></div>';
    content.innerHTML=html;
  }
}

showView('timeline',document.querySelector('.tab'));
