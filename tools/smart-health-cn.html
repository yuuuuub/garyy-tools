<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏥 智慧医疗</title>
<meta name="description" content="智慧医疗健康管理系统，预约挂号、健康档案、在线问诊、用药提醒">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:1100px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.stat-card .icon{font-size:1.8rem;margin-bottom:4px}
.stat-card .val{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.8rem;color:var(--text2)}
.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.dept{padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;transition:all .2s}
.dept:hover{border-color:var(--accent);transform:translateY(-2px)}
.dept.selected{border-color:var(--accent);background:rgba(59,130,246,.1)}
.dept .emoji{font-size:2rem;margin-bottom:4px}
.dept .name{font-weight:600;font-size:.85rem}
.dept .count{font-size:.75rem;color:var(--text2);margin-top:2px}
.doctor-list{margin-top:12px}
.doctor{display:flex;align-items:center;padding:14px;border-bottom:1px solid var(--border);gap:12px}
.doctor:last-child{border-bottom:none}
.doctor .avatar{width:48px;height:48px;border-radius:50%;background:var(--bg);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.doctor .info{flex:1}
.doctor .info .name{font-weight:600;font-size:.95rem}
.doctor .info .title{font-size:.8rem;color:var(--text2)}
.doctor .info .spec{font-size:.8rem;color:var(--accent);margin-top:2px}
.doctor .actions{display:flex;flex-direction:column;gap:4px}
.btn{padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-size:.8rem}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:4px 10px;font-size:.75rem}
.btn-success{background:var(--success)}.btn-warn{background:var(--warn)}.btn-danger{background:var(--danger)}.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.health-card{padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.health-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.health-row:last-child{border-bottom:none}
.health-label{color:var(--text2)}
.health-value{font-weight:600}
.health-value.normal{color:var(--success)}
.health-value.warn{color:var(--warn)}
.health-value.danger{color:var(--danger)}
.medicine-list{max-height:200px;overflow-y:auto}
.medicine-item{display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--border);font-size:.85rem}
.medicine-item:last-child{border-bottom:none}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.8rem;transition:all .2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.badge{padding:2px 8px;border-radius:10px;font-size:.75rem}
.badge-success{background:rgba(34,197,94,.15);color:var(--success)}
.badge-warn{background:rgba(245,158,11,.15);color:var(--warn)}
.badge-danger{background:rgba(239,68,68,.15);color:var(--danger)}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🏥 智慧医疗">
<meta property="og:description" content="智慧医疗健康管理系统，预约挂号、健康档案、在线问诊、用药提醒">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏥 智慧医疗</h1><p>预约挂号、健康档案、在线问诊、用药提醒</p></div>

<div class="cd">
<h2>📊 健康概览</h2>
<div class="grid" id="stats"></div>
</div>

<div class="cd">
<h2>🩺 预约挂号</h2>
<div class="dept-grid" id="deptGrid"></div>
<div class="doctor-list" id="doctorList"></div>
</div>

<div class="cd">
<h2>📋 健康档案</h2>
<div class="health-card" id="healthCard"></div>
</div>

<div class="cd">
<h2>💊 用药提醒</h2>
<div class="medicine-list" id="medicineList"></div>
</div>

<div class="cd">
<h2>📅 预约记录</h2>
<div id="appointments"></div>
</div>

<div class="cd">
<h2>🩸 体检报告</h2>
<div id="reports"></div>
</div>
</div>

<script src="i18n.js" defer></script>
<script>
(function(){
var departments=[
  {name:'内科',emoji:'🫀',count:12},
  {name:'外科',emoji:'🔪',count:8},
  {name:'儿科',emoji:'👶',count:6},
  {name:'妇产科',emoji:'🤰',count:5},
  {name:'骨科',emoji:'🦴',count:7},
  {name:'眼科',emoji:'👁️',count:4},
  {name:'口腔科',emoji:'🦷',count:5},
  {name:'皮肤科',emoji:'🧴',count:4},
  {name:'神经科',emoji:'🧠',count:3},
  {name:'心血管',emoji:'❤️',count:6},
  {name:'消化科',emoji:'🫁',count:5},
  {name:'中医科',emoji:'🌿',count:4}
];
var doctors=[
  {name:'张伟',title:'主任医师',spec:'心血管内科',avatar:'👨‍⚕️',exp:20,patients:1200},
  {name:'李芳',title:'副主任医师',spec:'神经内科',avatar:'👩‍⚕️',exp:15,patients:980},
  {name:'王强',title:'主治医师',spec:'消化内科',avatar:'👨‍⚕️',exp:10,patients:650},
  {name:'陈静',title:'主任医师',spec:'妇产科',avatar:'👩‍⚕️',exp:18,patients:1100},
  {name:'刘洋',title:'副主任医师',spec:'骨科',avatar:'👨‍⚕️',exp:12,patients:780},
  {name:'赵敏',title:'主治医师',spec:'儿科',avatar:'👩‍⚕️',exp:8,patients:520}
];
var medicines=[
  {name:'阿莫西林胶囊',dosage:'0.5g',freq:'每日3次',time:'饭后',remain:15,total:30,alert:false},
  {name:'布洛芬缓释片',dosage:'300mg',freq:'每日2次',time:'饭后',remain:8,total:20,alert:true},
  {name:'维生素C片',dosage:'100mg',freq:'每日1次',time:'早餐后',remain:45,total:60,alert:false},
  {name:'降压药缬沙坦',dosage:'80mg',freq:'每日1次',time:'早晨',remain:5,total:30,alert:true},
  {name:'降糖药二甲双胍',dosage:'500mg',freq:'每日2次',time:'餐中',remain:22,total:60,alert:false}
];
var selectedDept=null;

function renderStats(){
  var data=[
    {icon:'❤️',val:'72 bpm',label:'心率'},
    {icon:'🌡️',val:'36.5°C',label:'体温'},
    {icon:'🩸',val:'120/80',label:'血压'},
    {icon:'⚖️',val:'68 kg',label:'体重'},
    {icon:'😴',val:'7.5 h',label:'昨晚睡眠'},
    {icon:'🚶',val:'8,542',label:'今日步数'}
  ];
  var h='';
  data.forEach(function(d){h+='<div class="stat-card"><div class="icon">'+d.icon+'</div><div class="val">'+d.val+'</div><div class="label">'+d.label+'</div></div>'});
  document.getElementById('stats').innerHTML=h;
}

function renderDepts(){
  var h='';
  departments.forEach(function(d,i){
    h+='<div class="dept'+(selectedDept===i?' selected':'')+'" onclick="selectDept('+i+')"><div class="emoji">'+d.emoji+'</div><div class="name">'+d.name+'</div><div class="count">'+d.count+'位医生</div></div>';
  });
  document.getElementById('deptGrid').innerHTML=h;
}

window.selectDept=function(i){
  selectedDept=i;
  renderDepts();
  renderDoctors();
};

function renderDoctors(){
  var h='';
  var list=selectedDept===null?doctors:doctors.slice(0,Math.min(doctors.length,3+selectedDept));
  list.forEach(function(d){
    h+='<div class="doctor"><div class="avatar">'+d.avatar+'</div><div class="info"><div class="name">'+d.name+'</div><div class="title">'+d.title+' · '+d.exp+'年经验</div><div class="spec">'+d.spec+' · 已服务'+d.patients+'人</div></div><div class="actions"><button class="btn btn-sm btn-success" onclick="bookDoctor(\''+d.name+'\')">预约挂号</button><button class="btn btn-sm btn-outline" onclick="consultDoctor(\''+d.name+'\')">在线问诊</button></div></div>';
  });
  document.getElementById('doctorList').innerHTML=h||'<div style="text-align:center;color:var(--text2);padding:20px">请选择科室查看医生</div>';
}

window.bookDoctor=function(n){garyyToast('已预约 '+n+' 的号，请按时就诊','success')};
window.consultDoctor=function(n){garyyToast('正在连接 '+n+' 在线问诊...','info')};

function renderHealthCard(){
  var data=[
    {label:'姓名',value:'张三'},
    {label:'年龄',value:'35岁'},
    {label:'血型',value:'A型'},
    {label:'身高',value:'175cm'},
    {label:'BMI',value:'22.2',status:'normal'},
    {label:'视力',value:'左1.0 右0.8',status:'warn'},
    {label:'心率',value:'72 bpm',status:'normal'},
    {label:'血压',value:'120/80 mmHg',status:'normal'},
    {label:'血糖',value:'5.6 mmol/L',status:'normal'},
    {label:'过敏史',value:'青霉素过敏',status:'warn'},
    {label:'既往病史',value:'无重大疾病',status:'normal'},
    {label:'疫苗接种',value:'已完成',status:'normal'}
  ];
  var h='';
  data.forEach(function(d){
    h+='<div class="health-row"><span class="health-label">'+d.label+'</span><span class="health-value '+(d.status||'normal')+'">'+d.value+'</span></div>';
  });
  document.getElementById('healthCard').innerHTML=h;
}

function renderMedicines(){
  var h='';
  medicines.forEach(function(m){
    var pct=Math.round(m.remain/m.total*100);
    var color=pct<20?'var(--danger)':pct<40?'var(--warn)':'var(--success)';
    h+='<div class="medicine-item"><span style="margin-right:8px">'+(m.alert?'⚠️':'💊')+'</span><span style="flex:1"><strong>'+m.name+'</strong><br><span style="font-size:.8rem;color:var(--text2)">'+m.dosage+' · '+m.freq+' · '+m.time+'</span><div class="progress-bar" style="margin-top:4px"><div class="progress-fill" style="width:'+pct+'%;background:'+color+'"></div></div><span style="font-size:.75rem;color:var(--text2)">剩余 '+m.remain+'/'+m.total+'</span></span>'+(m.alert?'<button class="btn btn-sm btn-warn">补充</button>':'')+'</div>';
  });
  document.getElementById('medicineList').innerHTML=h;
}

function renderAppointments(){
  var doctors=['张伟','李芳','王强','陈静','刘洋'];
  var depts=['内科','外科','儿科','妇产科','骨科'];
  var h='';
  for(var i=0;i<5;i++){
    var status=Math.random()>.5?'已完成':'待就诊';
    var date='2025-'+Random.int(1,12).toString().padStart(2,'0')+'-'+Random.int(1,28).toString().padStart(2,'0');
    h+='<div style="display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:.85rem"><span class="badge '+(status==='已完成'?'badge-success':'badge-warn')+'">'+status+'</span><span style="flex:1;margin-left:8px"><strong>'+Random.pick(depts)+' · '+Random.pick(doctors)+'</strong><br><span style="font-size:.8rem;color:var(--text2)">'+date+' '+Random.time(8,17)+':00</span></span></div>';
  }
  document.getElementById('appointments').innerHTML=h;
}

function renderReports(){
  var items=[
    {name:'血常规',status:'正常',date:'2025-01-15'},
    {name:'肝功能',status:'正常',date:'2025-01-15'},
    {name:'肾功能',status:'正常',date:'2025-01-15'},
    {name:'血脂',status:'偏高',date:'2025-01-15'},
    {name:'血糖',status:'正常',date:'2025-01-15'},
    {name:'心电图',status:'正常',date:'2025-01-15'}
  ];
  var h='';
  items.forEach(function(r){
    h+='<div style="display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:.85rem"><span class="badge '+(r.status==='正常'?'badge-success':'badge-warn')+'">'+r.status+'</span><span style="flex:1;margin-left:8px"><strong>'+r.name+'</strong></span><span style="color:var(--text2);font-size:.8rem">'+r.date+'</span></div>';
  });
  document.getElementById('reports').innerHTML=h;
}

renderStats();renderDepts();renderDoctors();renderHealthCard();renderMedicines();renderAppointments();renderReports();
setInterval(renderStats,10000);
})();
</script>
</body>
</html>
