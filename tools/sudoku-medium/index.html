<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中等数独 6×6</title>
<meta name="description" content="中等难度数独，6x6中等难度数独训练">
<style>
:root{--radius:10px;--transition:0.2s ease;--game-select:none;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20pxscroll-behavior:smooth;padding:16px;}
h1{font-size:1.5rem;margin-bottom:6px}
.info{color:#8b949e;margin-bottom:16px;font-size:.9rem}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border:2px solid var(--accent);width:fit-content;margin-bottom:20px}
.cell{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:background .15s}
.cell:hover{background:#1c2333}
.cell.selected{background:rgba(59,130,246,.25);outline:2px solid var(--accent);z-index:1}
.cell.error{color:#f87171}
.cell.fixed{color:#8b949e;font-weight:600}
.cell.user{color:var(--accent);font-weight:700}
.cell.highlight{background:rgba(59,130,246,.12)}
.cell.block-right{border-right:2px solid var(--accent)}
.cell.block-bottom{border-bottom:2px solid var(--accent)}
.numpad{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.numpad button{width:48px;height:48px;font-size:1.2rem;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;transition:all .15s}
.numpad button:hover{background:var(--accent);color:var(--text)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.controls button{padding:8px 18px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:6px;cursor:pointer;font-size:.9rem;transition:all .15s}
.controls button:hover{background:var(--accent);color:var(--text)}
.timer{font-size:1.1rem;color:#8b949e;margin-bottom:12px}
.timer span{color:var(--accent);font-weight:700}
.win-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center}
.win-overlay.show{display:flex}
.win-box{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:40px;text-align:center}
.win-box h2{font-size:2rem;margin-bottom:10px;color:var(--accent)}
.win-box p{color:#8b949e;margin-bottom:20px}
.win-box button{padding:10px 24px;background:var(--accent);color:var(--text);border:none;border-radius:8px;font-size:1rem;cursor:pointer}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="中等数独 6×6">
  <meta property="og:description" content="中等难度数独，6x6中等难度数独训练">
  <meta property="og:type" content="website">

  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>中等数独 6×6</h1>
<div class="info">每行、每列、每个2×3宫包含1-6不重复</div>
<div class="timer">时间: <span id="time">00:00</span></div>
<div class="board" id="board"></div>
<div class="numpad" id="numpad"></div>
<div class="controls">
<button onclick="newGame()">新游戏</button>
<button onclick="hint()">提示</button>
<button onclick="undo()">撤销</button>
</div>
<div class="win-overlay" id="winOverlay">
<div class="win-box">
<h2>恭喜通关!</h2>
<p id="winMsg">用时</p>
<button onclick="newGame();document.getElementById('winOverlay').classList.remove('show')">再来一局</button>
</div>
</div>
<script>
const ROWS=6,COLS=6,BR=2,BC=3;
let solution=[],puzzle=[],grid=[],history=[],sel=null,timer=null,sec=0;

function rand(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}

function generateSolution(){
let sol=[];
for(let i=0;i<ROWS;i++)sol[i]=Array(COLS).fill(0);
function valid(r,c,v){
for(let i=0;i<COLS;i++)if(sol[r][i]===v)return false;
for(let i=0;i<ROWS;i++)if(sol[i][c]===v)return false;
let br=Math.floor(r/BR)*BR,bc=Math.floor(c/BC)*BC;
for(let i=br;i<br+BR;i++)for(let j=bc;j<bc+BC;j++)if(sol[i][j]===v)return false;
return true;
}
function fill(pos){
if(pos===ROWS*COLS)return true;
let r=Math.floor(pos/COLS),c=pos%COLS;
let nums=shuffle([1,2,3,4,5,6]);
for(let v of nums){
if(valid(r,c,v)){sol[r][c]=v;if(fill(pos+1))return true;sol[r][c]=0;}
}
return false;
}
fill(0);
return sol;
}

function makePuzzle(sol,clues){
let p=sol.map(r=>[...r]);
let cells=[];
for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++)cells.push([i,j]);
shuffle(cells);
let removed=0;
for(let[r,c] of cells){
if(removed>=ROWS*COLS-clues)break;
p[r][c]=0;
removed++;
}
return p;
}

function render(){
let b=document.getElementById('board');
b.innerHTML='';
for(let i=0;i<ROWS;i++){
for(let j=0;j<COLS;j++){
let d=document.createElement('div');
d.className='cell';
if(j%BC===BC-1&&j<COLS-1)d.classList.add('block-right');
if(i%BR===BR-1&&i<ROWS-1)d.classList.add('block-bottom');
if(puzzle[i][j]!==0){d.classList.add('fixed');d.textContent=puzzle[i][j]}
else if(grid[i][j]!==0){
d.classList.add('user');
d.textContent=grid[i][j];
if(!isValid(i,j,grid[i][j]))d.classList.add('error');
}
if(sel){
if(sel[0]===i&&sel[1]===j)d.classList.add('selected');
else if(sel[0]===i||sel[1]===j)d.classList.add('highlight');
}
d.onclick=()=>{if(puzzle[i][j]===0){sel=[i,j];render()}};
b.appendChild(d);
}
}
updateNumpad();
}

function isValid(r,c,v){
if(v===0)return true;
for(let i=0;i<COLS;i++)if(i!==c&&grid[r][i]===v)return false;
for(let i=0;i<ROWS;i++)if(i!==r&&grid[i][c]===v)return false;
let br=Math.floor(r/BR)*BR,bc=Math.floor(c/BC)*BC;
for(let i=br;i<br+BR;i++)for(let j=bc;j<bc+BC;j++)if((i!==r||j!==c)&&grid[i][j]===v)return false;
return true;
}

function updateNumpad(){
let n=document.getElementById('numpad');
n.innerHTML='';
for(let v=1;v<=6;v++){
let b=document.createElement('button');
b.textContent=v;
b.onclick=()=>{
if(sel&&puzzle[sel[0]][sel[1]]===0){
history.push([...sel,grid[sel[0]][sel[1]]]);
grid[sel[0]][sel[1]]=v;
render();
checkWin();
}
};
n.appendChild(b);
}
let clr=document.createElement('button');
clr.textContent='✕';
clr.style.color='#f87171';
clr.onclick=()=>{
if(sel&&puzzle[sel[0]][sel[1]]===0){
history.push([...sel,grid[sel[0]][sel[1]]]);
grid[sel[0]][sel[1]]=0;
render();
}
};
n.appendChild(clr);
}

function checkWin(){
for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++){
if(grid[i][j]===0||!isValid(i,j,grid[i][j]))return;
}
clearInterval(timer);
document.getElementById('winMsg').textContent='用时 '+document.getElementById('time').textContent;
document.getElementById('winOverlay').classList.add('show');
}

function newGame(){
solution=generateSolution();
puzzle=solution.map(r=>[...r]);
let clues=ROWS+COLS+BR*BC;
makePuzzle(puzzle,clues);
grid=puzzle.map(r=>[...r]);
history=[];sel=null;sec=0;
if(timer)clearInterval(timer);
document.getElementById('time').textContent='00:00';
timer=setInterval(()=>{sec++;let m=String(Math.floor(sec/60)).padStart(2,'0');let s=String(sec%60).padStart(2,'0');document.getElementById('time').textContent=m+':'+s},1000);
render();
}

function hint(){
if(!sel)return;
let r=sel[0],c=sel[1];
if(puzzle[r][c]===0&&grid[r][c]!==solution[r][c]){
grid[r][c]=solution[r][c];
render();checkWin();
}
}

function undo(){
if(history.length===0)return;
let[last]=history.pop();
grid[last[0]][last[1]]=sel?grid[sel[0]][sel[1]]:0;
let prev=history.length>0?history[history.length-1]:null;
if(prev)sel=[prev[0],prev[1]];
render();
}

document.onkeydown=e=>{
if(!sel)return;
let v=parseInt(e.key);
if(v>=1&&v<=6){e.preventDefault();
history.push([...sel,grid[sel[0]][sel[1]]]);
grid[sel[0]][sel[1]]=v;render();checkWin()}
if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();
history.push([...sel,grid[sel[0]][sel[1]]]);
grid[sel[0]][sel[1]]=0;render()}
};

newGame();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
