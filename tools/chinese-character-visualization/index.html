<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字可视化</title><meta name="description" content="汉字可视化 - 在线查看汉字可视化"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.visualization-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.viz-main{font-size:8rem;font-weight:700;color:var(--blue);line-height:1}.viz-shadow{font-size:8rem;font-weight:700;color:rgba(59,130,246,.1);position:absolute;top:4px;left:4px;z-index:-1}.viz-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.viz-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.viz-option:hover{border-color:var(--blue)}.viz-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

</style><meta property="og:title" content="汉字可视化"><meta property="og:description" content="汉字可视化 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎨 汉字可视化</h1><p class="sub">在线查看汉字可视化</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="visualizeCharacter()">
</div>
<button class="btn" onclick="visualizeCharacter()">可视化</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var vizStyles=['default','shadow','glow','rotate','scale','blur','colorful','gradient','neon','vintage'];
var currentStyle='default';
function visualizeCharacter(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="viz-options">';
  vizStyles.forEach(function(style){
    html+='<div class="viz-option '+(style===currentStyle?'active':'')+'" onclick="setStyle(\''+style+'\')">'+getStyleName(style)+'</div>';
  });
  html+='</div>';
  html+='<div class="visualization-container" style="position:relative">';
  html+=getVisualization(char);
  html+='</div>';
  html+='<div class="section"><h3>📋 可视化信息</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>汉字：</strong>'+char+'</div>';
  html+='<div><strong>Unicode：</strong>U+'+char.charCodeAt(0).toString(16).toUpperCase().padStart(4,'0')+'</div>';
  html+='<div><strong>样式：</strong>'+getStyleName(currentStyle)+'</div>';
  html+='<div><strong>说明：</strong>'+getStyleDescription(currentStyle)+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function setStyle(style){
  currentStyle=style;
  visualizeCharacter();
}
function getStyleName(style){
  switch(style){
    case 'default':return'默认';
    case 'shadow':return'阴影';
    case 'glow':return'发光';
    case 'rotate':return'旋转';
    case 'scale':return'缩放';
    case 'blur':return'模糊';
    case 'colorful':return'彩色';
    case 'gradient':return'渐变';
    case 'neon':return'霓虹';
    case 'vintage':return'复古';
    default:return'未知';
  }
}
function getStyleDescription(style){
  switch(style){
    case 'default':return'标准显示效果';
    case 'shadow':return'添加阴影效果';
    case 'glow':return'添加发光效果';
    case 'rotate':return'添加旋转动画';
    case 'scale':return'添加缩放动画';
    case 'blur':return'添加模糊效果';
    case 'colorful':return'随机彩色效果';
    case 'gradient':return'渐变色效果';
    case 'neon':return'霓虹灯效果';
    case 'vintage':return'复古效果';
    default:return'未知效果';
  }
}
function getVisualization(char){
  var style=getComputedStyle(document.documentElement);
  switch(currentStyle){
    case 'default':
      return'<div class="viz-main">'+char+'</div>';
    case 'shadow':
      return'<div style="position:relative"><div class="viz-shadow">'+char+'</div><div class="viz-main" style="text-shadow:4px 4px 8px rgba(0,0,0,0.5)">'+char+'</div></div>';
    case 'glow':
      return'<div class="viz-main" style="text-shadow:0 0 20px var(--blue),0 0 40px var(--blue),0 0 60px var(--blue)">'+char+'</div>';
    case 'rotate':
      return'<div class="viz-main" style="animation:rotate 3s linear infinite">@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}'+char+'</div>';
    case 'scale':
      return'<div class="viz-main" style="animation:scale 2s ease-in-out infinite">@keyframes scale{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}'+char+'</div>';
    case 'blur':
      return'<div class="viz-main" style="filter:blur(2px)">'+char+'</div>';
    case 'colorful':
      var colors=['#3b82f6','#238636','#ef4444','#f59e0b','#8b5cf6','#ec4899','#06b6d4'];
      var color=colors[Math.floor(Math.random()*colors.length)];
      return'<div class="viz-main" style="color:'+color+'">'+char+'</div>';
    case 'gradient':
      return'<div class="viz-main" style="background:linear-gradient(45deg,var(--blue),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent">'+char+'</div>';
    case 'neon':
      return'<div class="viz-main" style="color:#fff;text-shadow:0 0 10px #fff,0 0 20px #fff,0 0 30px #fff,0 0 40px var(--blue),0 0 70px var(--blue),0 0 80px var(--blue),0 0 100px var(--blue)">'+char+'</div>';
    case 'vintage':
      return'<div class="viz-main" style="color:#8b4513;text-shadow:2px 2px 4px rgba(139,69,19,0.5);font-family:serif">'+char+'</div>';
    default:
      return'<div class="viz-main">'+char+'</div>';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  visualizeCharacter();
}
visualizeCharacter();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
