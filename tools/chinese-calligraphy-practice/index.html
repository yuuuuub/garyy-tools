<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>书法练习</title><meta name="description" content="书法练习 - 在线练习书法"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.practice-area{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.practice-cell{aspect-ratio:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--blue);cursor:pointer;transition:all .2s}.practice-cell:hover{transform:scale(1.05);border-color:var(--blue)}.practice-cell.selected{border-color:var(--green);background:rgba(35,134,54,.1)}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style><meta property="og:title" content="书法练习"><meta property="og:description" content="书法练习 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>✍️ 书法练习</h1><p class="sub">在线练习书法</p>
<div class="card">
<div class="input-group">
<label>输入练习文字</label>
<input type="text" id="textInput" placeholder="输入要练习的文字..." value="永和九年">
</div>
<div class="btn-group">
<button class="btn" onclick="generatePractice()">生成练习格</button>
<button class="btn" onclick="randomText()">随机文字</button>
<button class="btn" onclick="clearPractice()">清空</button>
</div>
</div>
<div class="card" id="practiceCard">
<h3 style="text-align:center;margin-bottom:16px">练习格</h3>
<div class="practice-area" id="practiceArea"></div>
<div class="btn-group">
<button class="btn" onclick="showGuide()">显示指南</button>
<button class="btn" onclick="hideGuide()">隐藏指南</button>
<button class="btn" onclick="printPractice()">打印练习</button>
</div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var practiceChars=['永','和','九','年','岁','在','癸','丑','暮','春','之','初','会','于','会','稽','山','阴','之','兰','亭','修','禊','事','也','群','贤','毕','至','少','长','咸','集','此','地','有','崇','山','峻','岭','茂','林','修','竹','又','有','清','流','激','湍','映','带','左','右','引','以','为','流','觞','曲','水','列','坐','其','次','虽','无','丝','竹','管','弦','之','盛','一','觞','一','咏','亦','足','以','畅','叙','幽','情','是','日','也','天','朗','气','清','惠','风','和','畅','仰','观','宇','宙','之','大','俯','察','品','类','之','盛','所','以','游','目','骋','怀','足','以','极','视','听','之','娱','信','可','乐','也','夫','人','之','相','与','俯','仰','一','世','或','取','诸','怀','抱','悟','言','一','室','之','内','或','因','寄','所','托','放','浪','形','骸','之','外','虽','趣','舍','万','殊','静','躁','不','同','当','其','欣','于','所','遇','暂','得','于','己','快','然','自','足','不','知','老','之','将','至','及','其','所','之','既','倦','情','随','事','迁','感','慨','系','之','矣','向','之','所','欣','俯','仰','之','间','已','为','陈','迹','犹','不','能','不','以','之','兴','怀','况','修','短','随','化','终','期','于','尽','古','人','云','死','生','亦','大','矣','岂','不','痛','哉','每','览','昔','人','兴','感','之','由','若','合','一','契','未','尝','不','临','文','嗟','悼','不','能','喻','之','于','怀','固','知','一','死','生','为','虚','诞','齐','彭','殇','为','妄','作','后','之','视','今','亦','由','今','之','视','昔','悲','夫','故','列','叙','时','人','录','其','所','述','虽','世','殊','事','异','所','以','兴','怀','其','致','一','也','后','之','览','者','亦','将','有','感','于','斯','文'];
function generatePractice(){
  var text=document.getElementById('textInput').value.trim();
  if(!text){
    text=practiceChars.slice(0,16).join('');
  }
  var chars=text.split('');
  var area=document.getElementById('practiceArea');
  var html='';
  for(var i=0;i<16;i++){
    var char=chars[i%chars.length];
    html+='<div class="practice-cell" onclick="selectCell(this)" data-char="'+char+'">'+char+'</div>';
  }
  area.innerHTML=html;
}
function randomText(){
  var start=Math.floor(Math.random()*(practiceChars.length-16));
  var text=practiceChars.slice(start,start+16).join('');
  document.getElementById('textInput').value=text;
  generatePractice();
}
function clearPractice(){
  var cells=document.querySelectorAll('.practice-cell');
  cells.forEach(function(cell){
    cell.style.color='transparent';
  });
}
function selectCell(cell){
  cell.classList.toggle('selected');
}
function showGuide(){
  var cells=document.querySelectorAll('.practice-cell');
  cells.forEach(function(cell){
    cell.style.color='var(--blue)';
  });
}
function hideGuide(){
  var cells=document.querySelectorAll('.practice-cell');
  cells.forEach(function(cell){
    cell.style.color='transparent';
  });
}
function printPractice(){
  var printWindow=window.open('','_blank');
  var html='<!DOCTYPE html><html><head><title>书法练习</title><style>';
  html+='body{font-family:"楷体","KaiTi","STKaiti",serif;margin:20px}';
  html+='.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:600px;margin:0 auto}';
  html+='.cell{width:120px;height:120px;border:1px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#333}';
  html+='</style></head><body>';
  html+='<h1 style="text-align:center">书法练习</h1>';
  html+='<div class="grid">';
  var cells=document.querySelectorAll('.practice-cell');
  cells.forEach(function(cell){
    html+='<div class="cell">'+cell.dataset.char+'</div>';
  });
  html+='</div><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>';
  printWindow.document.write(html);
  printWindow.document.close();
  printWindow.print();
}
generatePractice();
</script></body></html>
