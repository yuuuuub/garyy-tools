<style>

.era-title{font-size:1.1rem;font-weight:700;color:var(--blue)}
.era-period{font-size:.8rem;color:var(--text2);background:var(--bg);padding:2px 8px;border-radius:4px}
.era-desc{font-size:.9rem;color:var(--text2);line-height:1.6}
.era-content{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.era-card.expanded .era-content{display:block}
.subsection{margin-bottom:16px}

.proverb-example .text{font-weight:700;font-size:.95rem}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:16px 0}

.category-tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.cat-tag{padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:.75rem;color:var(--text2)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

<div class="container">

<div class="card">
<h3 style="font-size:1rem;margin-bottom:12px;color:var(--blue)">📖 谚语概览</h3>
<p style="font-size:.9rem;line-height:1.7;color:var(--text2)">中国谚语是中华民族在长期生活实践中创造的语言精华，蕴含着丰富的哲学思想、生活智慧和道德观念。它们言简意赅、通俗易懂，是中华文化的瑰宝。</p>
<div class="category-tags">
<span class="cat-tag">人生哲理</span>
<span class="cat-tag">学习教育</span>
<span class="cat-tag">工作事业</span>
<span class="cat-tag">人情世故</span>
<span class="cat-tag">自然规律</span>
<span class="cat-tag">家庭生活</span>
</div>
</div>

<div id="eraList"></div>
</div>
<script src="../i18n.js" defer></script>
<script>
var eras=[
{
name:'先秦时期',period:'约前11世纪-前221年',emoji:'🏛️',

content:{
features:['《诗经》中蕴含大量民间智慧','《左传》记载了丰富的政治谚语','《论语》《孟子》等诸子百家的格言','以四言为主的句式结构','与诗歌、散文紧密结合'],
categories:['政治治国','道德修养','人生哲理','农业生产'],
examples:[
{text:'靡不有初，鲜克有终',source:'《诗经·大雅》',note:'做事都有个开头，但很少有人能坚持到底。'},
{text:'辅车相依，唇亡齿寒',source:'《左传》',note:'比喻关系密切，利害相关。'},
{text:'多行不义必自毙',source:'《左传》',note:'坏事做多了，终究会自取灭亡。'},
{text:'前事不忘，后事之师',source:'《战国策》',note:'记取过去的经验教训，作为以后的借鉴。'}
]
}
},
{
name:'两汉时期',period:'前206年-220年',emoji:'📜',
desc:'谚语在史书和政论中大量出现，开始形成系统的民间智慧表达。',
content:{
features:['《史记》《汉书》中大量引用谚语','贾谊等政论家善于用谚','五言诗发展促进了谚语传播','农业生产谚语丰富','开始出现系统的谚语记录'],
categories:['农业节气','治国理政','为人处世','养生保健'],
examples:[
{text:'百闻不如一见',source:'《汉书·赵充国传》',note:'听别人说一百次，不如自己亲眼见一次。'},
{text:'失之毫厘，差之千里',source:'《汉书》',note:'细微的差错会造成巨大的失误。'},
{text:'水至清则无鱼，人至察则无徒',source:'《大戴礼记》',note:'要求太严了就没有伙伴。'}
]
}
},
{
name:'唐宋时期',period:'618年-1279年',emoji:'🌙',
desc:'谚语在诗词、笔记小说中大量出现，开始走向成熟和系统化。',
content:{
features:['唐诗宋词中大量运用谚语','白话文学发展促进了谚语传播','笔记小说记录了丰富的民间谚语','佛教谚语大量融入','开始出现谚语专集'],
categories:['诗词格言','佛教禅语','民间俗语','商业谚语'],
examples:[
{text:'书山有路勤为径，学海无涯苦作舟',source:'唐·韩愈',note:'比喻在学习的道路上，勤奋和刻苦是唯一的途径。'},
{text:'业精于勤，荒于嬉',source:'唐·韩愈',note:'学业精进在于勤奋，荒废在于嬉游。'},
{text:'良药苦口利于病，忠言逆耳利于行',source:'《史记》（广泛流传于唐宋）',note:'好药虽苦却利于治病，忠告虽不好听却利于行事。'}
]
}
},
{
name:'元明清时期',period:'1271年-1912年',emoji:'🎭',
desc:'歇后语大量出现并成熟，谚语在小说戏曲中广泛运用，形成了完整的谚语体系。',
content:{

{text:'三个臭皮匠，顶个诸葛亮',source:'民间谚语',note:'比喻人多智慧多，集思广益。'},
{text:'千里送鹅毛，礼轻情意重',source:'民间谚语',note:'比喻礼物虽轻，但情意深厚。'}
]
}
},
{
name:'近现代',period:'1912年至今',emoji:'🏮',

content:{
features:['鲁迅等作家整理民间谚语','谚语大辞典等工具书出版','电视节目推广谚语文化','新谚语反映现代生活','网络时代谚语新形式'],
categories:['传统谚语传承','现代新谚语','网络谚语','行业新谚语'],
examples:[
{text:'时间就是金钱，效率就是生命',source:'改革开放时期',note:'反映了市场经济时代的价值观。'},
{text:'知识改变命运',source:'现代教育谚语',note:'强调教育对个人发展的重要性。'},
{text:'实践是检验真理的唯一标准',source:'现代哲学谚语',note:'强调实践的重要性。'}
]
}
}
];

function renderEras(){
var list=document.getElementById('eraList');
var html='';
eras.forEach(function(era,i){
html+='<div class="era-card" onclick="toggleEra(this)">';
html+='<div class="era-header"><div class="era-title">'+era.emoji+' '+era.name+'</div>';
html+='<div class="era-period">'+era.period+'</div></div>';
html+='<div class="era-desc">'+era.desc+'</div>';
html+='<div class="era-content">';

html+='<div class="subsection"><h4>📌 时代特征</h4><ul>';
era.content.features.forEach(function(f){html+='<li>'+f+'</li>';});
html+='</ul></div>';

html+='<div class="subsection"><h4>🏷️ 主要类别</h4><div class="category-tags">';
era.content.categories.forEach(function(c){html+='<span class="cat-tag">'+c+'</span>';});
html+='</div></div>';

html+='<div class="subsection"><h4>📖 典型谚语</h4>';
era.content.examples.forEach(function(e){
html+='<div class="proverb-example"><div class="text">"'+e.text+'"</div>';
html+='<div class="note">'+e.source+' — '+e.note+'</div></div>';
});
html+='</div>';

html+='</div></div>';
});
list.innerHTML=html;
}

function toggleEra(el){
el.classList.toggle('expanded');
}

renderEras();
</script>
