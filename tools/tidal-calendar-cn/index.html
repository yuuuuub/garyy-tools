<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
title>🌊 潮汐日历</title>
<meta name="description" content="潮汐时间查询，潮高预测，赶海钓鱼最佳时间">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.tidal-chart{height:200px;position:relative;margin:20px 0;border-bottom:2px solid var(--border);border-left:2px solid var(--border)}
.tidal-line{position:absolute;width:100%;height:100%}
.tidal-point{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);cursor:pointer}
.tidal-label{position:absolute;font-size:.7rem;color:var(--text2);transform:translateX(-50%)}
.tidal-value{position:absolute;font-size:.75rem;color:var(--accent);font-weight:600;transform:translateX(-50%)}
.tidal-info{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tidal-card{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
.tidal-card .icon{font-size:1.5rem;margin-bottom:6px}
.tidal-card .time{font-size:1.1rem;font-weight:600;color:var(--accent)}
.tidal-card .label{font-size:.8rem;color:var(--text2);margin-top:2px}
.tidal-card .height{font-size:.9rem;margin-top:4px}
.location-select{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.location-btn{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.85rem;transition:all .2s}
.location-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.date-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
.date-nav button{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--text)}
.date-nav button:hover{background:var(--accent);color:#fff}
.date-display{font-size:1.1rem;font-weight:600}
.tide-type{display:inline-block;padding:4px 12px;border-radius:16px;font-size:.8rem;font-weight:600;margin-right:8px}
.tide-type.high{background:rgba(59,130,246,.2);color:var(--accent)}
.tide-type.low{background:rgba(34,197,94,.2);color:var(--success)}
.activity-list{margin-top:12px}
.activity-item{display:flex;align-items:center;padding:8px;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-icon{font-size:1.2rem;margin-right:10px}
.activity-info{flex:1}
.activity-name{font-weight:600;font-size:.9rem}
.activity-desc{font-size:.8rem;color:var(--text2)}
.activity-rating{font-size:.85rem;color:var(--warn)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calendar-day{padding:8px;text-align:center;border-radius:6px;cursor:pointer;font-size:.85rem}
.calendar-day:hover{background:var(--bg)}
.calendar-day.today{background:var(--accent);color:#fff}
.calendar-day .high{color:var(--accent);font-size:.7rem}
.calendar-day .low{color:var(--success);font-size:.7rem}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.wave-icon{animation:wave 2s ease-in-out infinite}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🌊 潮汐日历">
<meta property="og:description" content="潮汐时间查询，潮高预测，赶海钓鱼最佳时间">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1 class="wave-icon">🌊 潮汐日历</h1><p>查询潮汐时间，规划海边活动</p></div>

<div class="cd">
<h2>选择地点</h2>
<div class="location-select" id="locationSelect"></div>
</div>

<div class="cd">
<h2>日期选择</h2>
<div class="date-nav">
<button onclick="changeDate(-1)">◀ 上一天</button>
<div class="date-display" id="dateDisplay">2024年1月15日</div>
<button onclick="changeDate(1)">下一天 ▶</button>
</div>
<div class="calendar-grid" id="calendarGrid"></div>
</div>

<div class="cd">
<h2>今日潮汐</h2>
<div class="tidal-chart" id="tidalChart"></div>
<div class="tidal-info" id="tidalInfo"></div>
</div>

<div class="cd">
<h2>潮汐详情</h2>
<div id="tidalDetails"></div>
</div>

<div class="cd">
<h2>推荐活动</h2>
<div class="activity-list" id="activityList"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const locations=[
  {name:'青岛',lat:36.07,lng:120.38},
  {name:'厦门',lat:24.45,lng:118.08},
  {name:'三亚',lat:18.25,lng:109.50},
  {name:'大连',lat:38.91,lng:121.60},
  {name:'舟山',lat:30.01,lng:122.10},
  {name:'深圳',lat:22.54,lng:114.06}
];
let currentLocation=locations[0];
let currentDate=new Date();

function generateTidalData(date,location){
  const seed=date.getDate()+location.lat;
  const tides=[];
  for(let i=0;i<4;i++){
    const hour=Math.floor((seed+i*6.2)%24);
    const minute=Math.floor((seed*7+i*30)%60);
    const isHigh=i%2===0;
    const height=isHigh?2.5+Math.sin(seed+i)*0.8:0.5+Math.cos(seed+i)*0.3;
    tides.push({
      time:`${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`,
      height:height.toFixed(1),
      type:isHigh?'high':'low'
    });
  }
  return tides.sort((a,b)=>a.time.localeCompare(b.time));
}

function renderLocations(){
  $('locationSelect').innerHTML=locations.map(l=>`<div class="location-btn ${l.name===currentLocation.name?'active':''}" onclick="selectLocation('${l.name}')">${l.name}</div>`).join('');
}

function selectLocation(name){
  currentLocation=locations.find(l=>l.name===name);
  renderLocations();
  renderAll();
}

function renderCalendar(){
  const year=currentDate.getFullYear();
  const month=currentDate.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();
  
  let html='';
  for(let i=0;i<firstDay;i++)html+=`<div class="calendar-day"></div>`;
  
  for(let day=1;day<=daysInMonth;day++){
    const date=new Date(year,month,day);
    const isToday=date.toDateString()===today.toDateString();
    const tides=generateTidalData(date,currentLocation);
    const highTide=tides.find(t=>t.type==='high');
    const lowTide=tides.find(t=>t.type==='low');
    html+=`<div class="calendar-day ${isToday?'today':''}" onclick="selectDate(${year},${month},${day})">
      ${day}
      ${highTide?`<div class="high">${highTide.height}m</div>`:''}
      ${lowTide?`<div class="low">${lowTide.height}m</div>`:''}
    </div>`;
  }
  $('calendarGrid').innerHTML=html;
}

function selectDate(year,month,day){
  currentDate=new Date(year,month,day);
  renderAll();
}

function changeDate(delta){
  currentDate.setDate(currentDate.getDate()+delta);
  renderAll();
}

function renderTidalChart(){
  const tides=generateTidalData(currentDate,currentLocation);
  let html='<svg width="100%" height="100%" viewBox="0 0 800 200" preserveAspectRatio="none">';
  
  const points=tides.map((t,i)=>{
    const x=(i/(tides.length-1))*700+50;
    const y=t.type==='high'?50:150;
    return{x,y,t};
  });
  
  html+=`<polyline points="${points.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  
  points.forEach(p=>{
    html+=`<circle cx="${p.x}" cy="${p.y}" r="6" fill="var(--accent)"/>`;
    html+=`<text x="${p.x}" y="${p.y-15}" text-anchor="middle" fill="var(--text)" font-size="12">${p.t.time}</text>`;
    html+=`<text x="${p.x}" y="${p.y+20}" text-anchor="middle" fill="var(--accent)" font-size="12">${p.t.height}m</text>`;
  });
  
  html+='</svg>';
  $('tidalChart').innerHTML=html;
}

function renderTidalInfo(){
  const tides=generateTidalData(currentDate,currentLocation);
  $('tidalInfo').innerHTML=tides.map(t=>`<div class="tidal-card">
    <div class="icon">${t.type==='high'?'⬆️':'⬇️'}</div>
    <div class="time">${t.time}</div>
    <div class="label">${t.type==='high'?'高潮':'低潮'}</div>
    <div class="height">${t.height}米</div>
  </div>`).join('');
}

function renderTidalDetails(){
  const tides=generateTidalData(currentDate,currentLocation);
  const dateStr=currentDate.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  
  $('tidalDetails').innerHTML=`
    <div style="margin-bottom:12px;font-size:.9rem;color:var(--text2)">${dateStr} · ${currentLocation.name}</div>
    ${tides.map(t=>`<div style="display:flex;align-items:center;margin-bottom:8px">
      <span class="tide-type ${t.type}">${t.type==='high'?'高潮':'低潮'}</span>
      <span>${t.time}</span>
      <span style="margin-left:8px;color:var(--accent)">${t.height}米</span>
    </div>`).join('')}
  `;
}

function renderActivities(){
  const activities=[
    {icon:'🦀',name:'赶海',desc:'低潮前后2小时最佳，适合捡拾海鲜',rating:'★★★★☆'},
    {icon:'🎣',name:'钓鱼',desc:'涨潮时鱼儿活跃，适合海钓',rating:'★★★★★'},
    {icon:'🏖️',name:'沙滩活动',desc:'高潮时沙滩面积较小，注意安全',rating:'★★★☆☆'},
    {icon:'📸',name:'摄影',desc:'日出日落时分，潮汐变化最美',rating:'★★★★☆'},
    {icon:'🚢',name:'出海',desc:'根据潮汐安排出海时间，确保安全',rating:'★★★★☆'}
  ];
  $('activityList').innerHTML=activities.map(a=>`<div class="activity-item">
    <div class="activity-icon">${a.icon}</div>
    <div class="activity-info">
      <div class="activity-name">${a.name}</div>
      <div class="activity-desc">${a.desc}</div>
    </div>
    <div class="activity-rating">${a.rating}</div>
  </div>`).join('');
}

function renderAll(){
  const dateStr=currentDate.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
  $('dateDisplay').textContent=dateStr;
  renderCalendar();
  renderTidalChart();
  renderTidalInfo();
  renderTidalDetails();
  renderActivities();
}

renderLocations();
renderAll();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
