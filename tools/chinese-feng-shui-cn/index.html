<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国风水 - 堪舆术 | Gary's Tools</title><meta name="description" content="中国风水学百科 - 阴阳五行、罗盘方位、形势派与理气派、居家风水布局详解"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#c4842d;--accent2:#a0691c}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#a0691c;--accent2:#7d5115}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;transition:background var(--transition),color var(--transition)}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.category-btn{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all var(--transition)}.category-btn.active{background:var(--accent);color:#fff}.category-btn:hover{opacity:.85}.fs-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all var(--transition)}.fs-item:hover{transform:translateY(-2px);border-color:var(--accent)}.fs-item.open .fs-detail{display:block}.fs-title{font-size:1.1rem;font-weight:600;color:var(--accent);margin-bottom:4px}.fs-meta{font-size:.8rem;color:var(--green);margin-bottom:4px}.fs-desc{font-size:.9rem;color:var(--text2);line-height:1.6}.fs-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.9rem;line-height:1.8;color:var(--text)}.fs-detail h4{color:var(--accent);margin-bottom:8px}.fs-tag{display:inline-block;padding:2px 8px;background:var(--border);border-radius:4px;font-size:.75rem;color:var(--text2);margin:2px}#stats{text-align:center;color:var(--text2);font-size:.8rem;margin-bottom:12px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem)}</style><meta property="og:title" content="中国风水"><meta property="og:description" content="中国风水学百科 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🧭 中国风水学</h1><p class="sub">阴阳五行 · 罗盘方位 · 形势理气 · 居家布局</p>
<div class="card"><div class="search-box"><input type="text" id="searchInput" placeholder="搜索风水知识..." oninput="filterList()"></div>
<div class="btn-group">
<button class="category-btn active" onclick="filterCat('all',this)">全部</button>
<button class="category-btn" onclick="filterCat('基础',this)">基础理论</button>
<button class="category-btn" onclick="filterCat('派别',this)">风水派别</button>
<button class="category-btn" onclick="filterCat('居家',this)">居家风水</button>
<button class="category-btn" onclick="filterCat('工具',this)">风水工具</button>
<button class="category-btn" onclick="filterCat('选址',this)">选址要点</button>
</div></div>
<div id="stats"></div><div id="list"></div></div>
<script src="../i18n.js" defer></script>
<script>
var data=[
{title:'阴阳学说',cat:'基础',tags:['哲学','对立统一','平衡'],desc:'风水学的哲学基础，万物皆有阴阳两面。',detail:'阴阳是中国古代哲学的核心概念。在风水中，山为阴、水为阳；北为阴、南为阳；静为阴、动为阳。理想的风水格局讲究阴阳平衡，既不过阴也不过阳。《易经》云："一阴一阳之谓道。"',ref:'《周易》'},
{title:'五行学说',cat:'基础',tags:['金木水火土','相生相克','循环'],desc:'金木水火土五种元素的相生相克关系。',detail:'五行相生：木生火、火生土、土生金、金生水、水生木。五行相克：木克土、土克水、水克火、火克金、金克木。风水中通过五行的生克关系来判断环境的吉凶。如住宅东方属木，宜见水（相生），忌见金（相克）。',ref:'《尚书·洪范》'},
{title:'形势派',cat:'派别',tags:['形势','峦头','龙穴砂水向'],desc:'注重山川地形的风水流派，以"龙穴砂水向"为核心。',detail:'形势派又称峦头派，是中国风水最主要的流派之一。其核心是"地理五诀"：龙（山脉走势）、穴（聚气之处）、砂（穴周围山丘）、水（河流湖泊）、向（建筑朝向）。强调"有形必有势，有势必有形"。',ref:'《撼龙经》'},
{title:'理气派',cat:'派别',tags:['理气','罗盘','方位'],desc:'注重方位和时间的风水流派，以罗盘为主要工具。',detail:'理气派以阴阳五行、八卦天干地支为理论基础，通过罗盘测定方位来判断吉凶。主要分支包括：八宅派（以住宅坐向定吉凶）、玄空飞星派（以三元九运推算）、三合派（以水口定吉凶）等。',ref:'《沈氏玄空学》'},
{title:'八宅风水',cat:'派别',tags:['八宅','东四命','西四命'],desc:'以住宅坐向将房屋分为八种宅命的方法。',detail:'八宅风水将住宅按坐向分为东四宅（震、巽、离、坎）和西四宅（坤、兑、乾、艮）。人的命卦也分东四命和西四命。东四命住东四宅为吉，西四命住西四宅为吉。大门、主卧、厨房宜设在本命吉方。',ref:'《八宅明镜》'},
{title:'大门风水',cat:'居家',tags:['大门','纳气','朝向'],desc:'住宅的"气口"，是风水布局的首要环节。',detail:'大门是住宅纳气的主要通道，其风水至关重要。大门宜开在本命吉方，忌对电梯、楼梯、尖角。门的大小应与住宅相称，"屋大门小"或"屋小门大"都不吉。门前宜开阔，忌有障碍物遮挡。',ref:'《阳宅三要》'},
{title:'客厅风水',cat:'居家',tags:['客厅','明堂','聚财'],desc:'住宅的"明堂"，影响家庭的财运和人际关系。',detail:'客厅宜明亮宽敞，是家庭活动和待客的场所。沙发宜靠实墙，不宜背对大门。电视背景墙宜在沙发对面。客厅的财位一般在大门对角线的位置，宜放招财植物。客厅忌有横梁压顶。',ref:'《阳宅三要》'},
{title:'卧室风水',cat:'居家',tags:['卧室','床位','睡眠'],desc:'影响居住者健康和精神状态的重要空间。',detail:'卧室床头宜靠实墙，不宜靠窗或门。床不宜正对镜子，否则会影响睡眠。床位上方不宜有横梁。卧室颜色宜柔和，忌过于鲜艳。卧室门不宜正对厨房门或卫生间门。',ref:'《阳宅三要》'},
{title:'厨房风水',cat:'居家',tags:['厨房','灶台','水火'],desc:'影响家庭财运和健康的重要空间。',detail:'灶台不宜正对大门或后门，否则会影响财运。灶台不宜与水槽相邻，形成"水火相冲"。灶台不宜正对卧室门。厨房宜保持清洁整齐，颜色以白色或浅色为佳。',ref:'《阳宅三要》'},
{title:'罗盘',cat:'工具',tags:['罗盘','方位','测量'],desc:'风水师最重要的工具，用于测定方位和判断吉凶。',detail:'罗盘又称罗经，是风水师用来测量方位的工具。其核心是天池（指南针），外圈刻有天干地支、八卦、二十四山等。使用时需水平放置，对准磁北极，然后读取方位。不同风水派别使用的罗盘层数不同。',ref:'《罗经透解》'},
{title:'五行颜色',cat:'工具',tags:['颜色','五行','搭配'],desc:'五行对应的颜色体系，用于风水布局。',detail:'五行对应颜色：金-白色、银色；木-绿色、青色；水-黑色、蓝色；火-红色、紫色；土-黄色、棕色。在居家风水中，可根据五行需要选择相应颜色的装饰。如缺水可用蓝色，缺木可用绿色。',ref:'《五行大义》'},
{title:'城市风水',cat:'选址',tags:['城市','龙脉','水口'],desc:'城市选址和规划中的风水考量。',detail:'古代城市选址讲究"前有照，后有靠"，即前方有水流经过，后方有山峦依托。北京城北依燕山、南临永定河，是典型的风水宝地。城市的中轴线就是"龙脉"的体现，故宫中轴线与北京中轴线重合。',ref:'《地理五诀》'},
{title:'阴宅风水',cat:'选址',tags:['阴宅','墓地','祖坟'],desc:'墓地选择的风水理论，影响后代运势。',detail:'阴宅风水认为祖先的墓地会影响后代的运势。好的阴宅需要"前朱雀、后玄武、左青龙、右白虎"四象齐备。阴宅选址讲究"龙真穴的"，即山脉走势真，穴位准确。历代帝王陵寝都经过精心选择。',ref:'《撼龙经》'},
{title:'天斩煞',cat:'居家',tags:['煞气','两楼之间','冲射'],desc:'两栋高楼之间的缝隙正对住宅，形成强烈气流。',detail:'天斩煞是指两栋高楼之间的狭窄缝隙正对住宅，强风从缝隙中穿过形成冲射。这种格局被认为会导致家人不和、血光之灾。化解方法包括在窗台摆放铜制品或八卦镜。',ref:'《阳宅十书》'},
{title:'反弓煞',cat:'居家',tags:['煞气','道路','弓箭'],desc:'住宅位于道路弯曲处的外侧，如弓箭背面。',detail:'反弓煞是指住宅位于道路或河流弯曲处的外侧，形如弓箭背面。这种格局被认为会导致财运不稳、家人离散。理想的位置是弯曲处的内侧（玉带环腰），而非外侧。',ref:'《地理新书》'}
];
var currentCat='all';
function renderList(items){
  document.getElementById('list').innerHTML=items.map(function(d){
    return '<div class="fs-item" onclick="this.classList.toggle(\'open\')">'+
    '<div class="fs-title">'+d.title+'</div><div class="fs-meta">分类：'+d.cat+'</div>'+
    '<div class="fs-desc">'+d.desc+'</div>'+
    '<div class="fs-detail"><h4>详细介绍</h4><p>'+d.detail+'</p>'+
    '<p style="margin-top:8px;color:var(--accent2)">参考：'+d.ref+'</p>'+
    '<div>'+d.tags.map(function(t){return '<span class="fs-tag">'+t+'</span>'}).join('')+'</div></div></div>';
  }).join('');
  document.getElementById('stats').textContent='共 '+items.length+' 条知识';
}
function filterList(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  renderList(data.filter(function(d){
    return (d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q))&&(currentCat==='all'||d.cat===currentCat);
  }));
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterList();
}
renderList(data);
</script></body></html>
