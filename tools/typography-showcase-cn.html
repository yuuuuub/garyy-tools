<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="字体排版展示工具 - 在线预览和对比不同字体效果">
    <meta name="robots" content="index, follow">
    <title>字体排版展示工具</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #8b5cf6; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #a78bfa; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        textarea { resize: vertical; min-height: 80px; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 8px; }
        button:hover { opacity: 0.9; }
        .btn-sm { padding: 4px 10px; font-size: 13px; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .font-card { padding: 20px; border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: border-color 0.2s; }
        .font-card:hover, .font-card.active { border-color: var(--primary-color); }
        .font-name { font-size: 12px; color: var(--secondary-color); margin-bottom: 8px; }
        .font-preview { font-size: 28px; line-height: 1.4; }
        .font-details { font-size: 12px; color: var(--secondary-color); margin-top: 8px; }
        .live-preview { padding: 24px; border: 1px solid var(--border-color); border-radius: 8px; min-height: 200px; line-height: 1.8; }
        .type-scale { list-style: none; padding: 0; }
        .type-scale li { padding: 10px 0; border-bottom: 1px solid var(--border-color); display: flex; align-items: baseline; gap: 16px; }
        .type-scale .size { font-size: 12px; color: var(--secondary-color); min-width: 60px; font-family: monospace; }
        .pair-sample { padding: 16px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; }
        .pair-sample h4 { margin: 0 0 8px 0; }
        .contrast-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .contrast-pass { background: var(--success-color); color: white; }
        .contrast-fail { background: var(--danger-color); color: white; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>字体排版展示工具</h1>

        <div class="card">
            <h3>字体选择</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>标题字体</label>
                    <select id="headingFont" onchange="updatePreview()">
                        <option value="serif">Serif (宋体/衬线)</option>
                        <option value="sans-serif">Sans-serif (无衬线)</option>
                        <option value="monospace">Monospace (等宽)</option>
                        <option value="cursive">Cursive (手写)</option>
                        <option value="fantasy">Fantasy (装饰)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>正文字体</label>
                    <select id="bodyFont" onchange="updatePreview()">
                        <option value="sans-serif">Sans-serif (无衬线)</option>
                        <option value="serif">Serif (宋体/衬线)</option>
                        <option value="monospace">Monospace (等宽)</option>
                        <option value="cursive">Cursive (手写)</option>
                        <option value="fantasy">Fantasy (装饰)</option>
                    </select>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>标题大小: <span id="headingSizeVal">32</span>px</label>
                    <input type="range" id="headingSize" min="16" max="72" value="32" oninput="document.getElementById('headingSizeVal').textContent=this.value;updatePreview();">
                </div>
                <div class="form-group">
                    <label>正文字号: <span id="bodySizeVal">16</span>px</label>
                    <input type="range" id="bodySize" min="12" max="28" value="16" oninput="document.getElementById('bodySizeVal').textContent=this.value;updatePreview();">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>行高: <span id="lineHeightVal">1.8</span></label>
                    <input type="range" id="lineHeight" min="1" max="3" step="0.1" value="1.8" oninput="document.getElementById('lineHeightVal').textContent=this.value;updatePreview();">
                </div>
                <div class="form-group">
                    <label>字间距: <span id="letterSpacingVal">0</span>px</label>
                    <input type="range" id="letterSpacing" min="-2" max="8" value="0" oninput="document.getElementById('letterSpacingVal').textContent=this.value;updatePreview();">
                </div>
            </div>
        </div>

        <div class="card">
            <h3>实时预览</h3>
            <div class="live-preview" id="livePreview">
                <h2 style="font-family:serif;">字体排版的艺术</h2>
                <p>好的排版设计不仅仅是选择漂亮的字体，更是关于如何创造视觉层次、引导读者视线、传达品牌个性。每一组字体搭配都在讲述一个故事。</p>
                <p>Typography is the art and technique of arranging type to make written language legible, readable, and appealing when displayed.</p>
            </div>
        </div>

        <div class="card">
            <h3>字号比例尺</h3>
            <div class="form-group">
                <label>比例模式</label>
                <select id="scaleMode" onchange="updateTypeScale()">
                    <option value="minorThird">小三度 (1.2)</option>
                    <option value="majorThird">大三度 (1.25)</option>
                    <option value="perfectFourth" selected>纯四度 (1.333)</option>
                    <option value="augFourth">增四度 (1.414)</option>
                    <option value="perfectFifth">纯五度 (1.5)</option>
                    <option value="golden">黄金比例 (1.618)</option>
                </select>
            </div>
            <ul class="type-scale" id="typeScale"></ul>
        </div>

        <div class="card">
            <h3>字体搭配推荐</h3>
            <div id="fontPairings"></div>
        </div>

        <div class="card">
            <h3>自定义文本预览</h3>
            <textarea id="customText" placeholder="输入要预览的文本...">好的排版设计是无声的设计，它能让读者专注于内容本身，同时感受到品牌的独特气质。</textarea>
            <div id="customPreview" style="margin-top:12px;padding:20px;border:1px solid var(--border-color);border-radius:8px;"></div>
        </div>

        <div class="card">
            <h3>WCAG对比度检测</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>前景色</label>
                    <input type="color" id="fgColor" value="#333333" onchange="checkContrast()">
                </div>
                <div class="form-group">
                    <label>背景色</label>
                    <input type="color" id="bgColor" value="#ffffff" onchange="checkContrast()">
                </div>
            </div>
            <div id="contrastResult" style="margin-top:10px;"></div>
        </div>
    </div>

    <script defer src="i18n.js"></script>
    <script>
        const pairings = [
            { heading: 'Georgia, serif', body: 'Helvetica, Arial, sans-serif', name: '经典搭配', desc: '衬线标题+无衬线正文，最安全的组合' },
            { heading: 'Palatino, serif', body: 'Gill Sans, sans-serif', name: '优雅搭配', desc: '传统与现代的完美结合' },
            { heading: 'Impact, sans-serif', body: 'Times New Roman, serif', name: '强对比', desc: '冲击力标题配经典正文' },
            { heading: 'Trebuchet MS, sans-serif', body: 'Georgia, serif', name: '现代经典', desc: '现代标题配温暖正文' },
            { heading: 'Courier New, monospace', body: 'Arial, sans-serif', name: '技术风格', desc: '代码风格标题配干净正文' },
            { heading: 'Garamond, serif', body: 'Futura, sans-serif', name: '高端品牌', desc: '永恒优雅搭配几何现代' }
        ];

        const scales = {
            minorThird: 1.2, majorThird: 1.25, perfectFourth: 1.333,
            augFourth: 1.414, perfectFifth: 1.5, golden: 1.618
        };
        const scaleNames = {
            minorThird: '小三度', majorThird: '大三度', perfectFourth: '纯四度',
            augFourth: '增四度', perfectFifth: '纯五度', golden: '黄金比例'
        };

        function init() {
            updatePreview();
            updateTypeScale();
            renderPairings();
            document.getElementById('customText').addEventListener('input', updateCustomPreview);
            updateCustomPreview();
            checkContrast();
        }

        function updatePreview() {
            const hf = document.getElementById('headingFont').value;
            const bf = document.getElementById('bodyFont').value;
            const hs = document.getElementById('headingSize').value;
            const bs = document.getElementById('bodySize').value;
            const lh = document.getElementById('lineHeight').value;
            const ls = document.getElementById('letterSpacing').value;

            const el = document.getElementById('livePreview');
            el.querySelector('h2').style.fontFamily = hf;
            el.querySelector('h2').style.fontSize = hs + 'px';
            el.querySelectorAll('p').forEach(p => {
                p.style.fontFamily = bf;
                p.style.fontSize = bs + 'px';
                p.style.lineHeight = lh;
                p.style.letterSpacing = ls + 'px';
            });
        }

        function updateTypeScale() {
            const ratio = scales[document.getElementById('scaleMode').value];
            const name = scaleNames[document.getElementById('scaleMode').value];
            const base = 16;
            const levels = ['xs','sm','base','lg','xl','2xl','3xl','4xl'];
            const multipliers = [-2, -1, 0, 1, 2, 3, 4, 5];

            document.getElementById('typeScale').innerHTML = multipliers.map((m,i) => {
                const size = Math.round(base * Math.pow(ratio, m));
                return `<li><span class="size">${size}px</span><span style="font-size:${size}px;font-family:${document.getElementById('headingFont').value};">${levels[i]} - ${name}</span></li>`;
            }).join('');
        }

        function renderPairings() {
            document.getElementById('fontPairings').innerHTML = pairings.map(p => `
                <div class="pair-sample">
                    <h4>${p.name}</h4>
                    <div style="font-family:${p.heading};font-size:28px;margin-bottom:8px;">Heading Sample 字体标题</div>
                    <div style="font-family:${p.body};font-size:16px;line-height:1.6;">Body text example. 这是一段正文示例文本，用于展示字体搭配效果。好的字体搭配能够增强内容的可读性和视觉吸引力。</div>
                    <div class="font-details" style="margin-top:8px;">标题: ${p.heading} | 正文: ${p.body}</div>
                    <div style="font-size:12px;color:var(--secondary-color);margin-top:4px;">${p.desc}</div>
                    <button class="btn-sm" style="margin-top:8px;" onclick="applyPairing('${p.heading}','${p.body}')">应用此搭配</button>
                </div>
            `).join('');
        }

        function applyPairing(heading, body) {
            const hSelect = document.getElementById('headingFont');
            const bSelect = document.getElementById('bodyFont');
            const hVal = heading.split(',')[1]?.trim() || heading.split(',')[0].trim();
            const bVal = body.split(',')[1]?.trim() || body.split(',')[0].trim();
            for (let o of hSelect.options) { if (hVal.includes(o.value)) { hSelect.value = o.value; break; } }
            for (let o of bSelect.options) { if (bVal.includes(o.value)) { bSelect.value = o.value; break; } }
            updatePreview();
        }

        function updateCustomPreview() {
            const hf = document.getElementById('headingFont').value;
            const bf = document.getElementById('bodyFont').value;
            const bs = document.getElementById('bodySize').value;
            const lh = document.getElementById('lineHeight').value;
            const text = document.getElementById('customText').value || '输入文本后查看效果';
            document.getElementById('customPreview').innerHTML = `<div style="font-family:${bf};font-size:${bs}px;line-height:${lh};">${text}</div>`;
        }

        function getLuminance(hex) {
            const r = parseInt(hex.slice(1,3),16)/255;
            const g = parseInt(hex.slice(3,5),16)/255;
            const b = parseInt(hex.slice(5,7),16)/255;
            const toLinear = c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
            return 0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b);
        }

        function checkContrast() {
            const fg = document.getElementById('fgColor').value;
            const bg = document.getElementById('bgColor').value;
            const l1 = getLuminance(fg);
            const l2 = getLuminance(bg);
            const ratio = (Math.max(l1,l2) + 0.05) / (Math.min(l1,l2) + 0.05);
            const ratioStr = ratio.toFixed(2);
            const aaLarge = ratio >= 3;
            const aaNormal = ratio >= 4.5;
            const aaaLarge = ratio >= 4.5;
            const aaaNormal = ratio >= 7;

            document.getElementById('contrastResult').innerHTML = `
                <div style="padding:16px;border:1px solid var(--border-color);border-radius:8px;background:${bg};color:${fg};font-size:16px;line-height:1.6;">
                    <strong style="font-size:24px;">预览文本 Aa</strong>
                    <p>对比度: ${ratioStr}:1</p>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <span class="contrast-badge ${aaNormal?'contrast-pass':'contrast-fail'}">AA正文: ${aaNormal?'通过':'不通过'}</span>
                        <span class="contrast-badge ${aaLarge?'contrast-pass':'contrast-fail'}">AA大字: ${aaLarge?'通过':'不通过'}</span>
                        <span class="contrast-badge ${aaaNormal?'contrast-pass':'contrast-fail'}">AAA正文: ${aaaNormal?'通过':'不通过'}</span>
                        <span class="contrast-badge ${aaaLarge?'contrast-pass':'contrast-fail'}">AAA大字: ${aaaLarge?'通过':'不通过'}</span>
                    </div>
                </div>
            `;
        }

        function toggleTheme() {
            const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
        }

        init();
    </script>
</body>
</html>
