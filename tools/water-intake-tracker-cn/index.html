<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💧 饮水追踪器</title>
<meta name="description" content="每日饮水量追踪器，养成健康喝水习惯，记录每次饮水">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.pw{height:24px;background:var(--bg);border-radius:12px;overflow:hidden;margin:12px 0;position:relative}.pf{height:100%;background:linear-gradient(90deg,#60a5fa,#3b82f6);border-radius:12px;transition:width .5s}
.pt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:600}
.cup-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.cup-item{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;transition:all .2s;border:2px solid var(--border);background:var(--bg)}
.cup-item.filled{background:var(--accent);border-color:var(--accent)}
.cup-item:hover{transform:scale(1.1)}
.quick-add{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick-add button{font-size:.8rem;padding:6px 12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="💧 饮水追踪器">
<meta property="og:description" content="每日饮水量追踪器，养成健康喝水习惯，记录每次饮水">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/water-intake-tracker-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>💧 饮水追踪器</h1><p>每天喝够水，身体更健康</p></div>

<div class="cd">
<div class="gr">
<div class="st"><div class="nm" id="todayMl" style="color:var(--accent)">0</div><div class="lb">今日饮水 (ml)</div></div>
<div class="st"><div class="nm" id="todayTarget">2000</div><div class="lb">目标 (ml)</div></div>
<div class="st"><div class="nm" id="todayCups" style="color:var(--success)">0</div><div class="lb">杯数 (250ml/杯)</div></div>
</div>
<div class="pw"><div class="pf" id="progressBar" style="width:0%"></div><div class="pt" id="progressText">0%</div></div>
</div>

<div class="cd"><h2>快速记录</h2>
<div class="quick-add" id="quickBtns"></div>
<label>自定义量 (ml)</label>
<div class="fr">
<div><input type="number" id="customMl" placeholder="200" min="10" max="2000"></div>
<div><button onclick="addCustom()">💧 记录</button></div>
</div></div>

<div class="cd"><h2>今日饮水杯数</h2>
<div class="cup-grid" id="cupGrid"></div>
<p style="text-align:center;margin-top:12px;color:var(--text2);font-size:.85rem">点击杯子图标标记已喝</p></div>

<div class="cd"><h2>设置</h2>
<label>每日目标 (ml)</label>
<div class="fr">
<div><input type="number" id="targetInput" value="2000" min="500" max="5000" step="100"></div>
<div><button onclick="setTarget()">设置目标</button></div>
</div></div>

<div class="cd"><h2>今日记录</h2><div id="todayRecords"></div>
<div class="bg"><button class="dng" onclick="clearToday()">清空今日记录</button></div></div>

<div class="cd"><h2>历史记录</h2><div id="historyList"></div></div>
</div>
<script>
(function(){
var DB='water_tracker_cn';
var TGT_KEY='water_tracker_cn_target';
var records=JSON.parse(localStorage.getItem(DB)||'[]');
var target=parseInt(localStorage.getItem(TGT_KEY))||2000;
var QUICKS=[{l:'🥛 小杯',v:150},{l:'🥤 中杯',v:250},{l:'🍶 大杯',v:350},{l:'🫗 瓶装',v:500}];
var cupCount=8;

function today(){return new Date().toLocaleDateString()}
function todayRecords(){return records.filter(function(r){return r.date===today()})}

function renderQuick(){
document.getElementById('quickBtns').innerHTML=QUICKS.map(function(q,i){
return '<button onclick="quickAdd('+q.v+')">'+q.l+' '+q.v+'ml</button>';
}).join('');
}
window.quickAdd=function(ml){addRecord(ml);};

window.addCustom=function(){
var ml=parseInt(document.getElementById('customMl').value);
if(!ml||ml<10){alert('请输入有效饮水量');return;}
addRecord(ml);document.getElementById('customMl').value='';
};

function addRecord(ml){
records.push({ml:ml,date:today(),time:new Date().toLocaleTimeString(),id:Date.now()});
localStorage.setItem(DB,JSON.stringify(records));
render();
}

window.delRecord=function(id){records=records.filter(function(r){return r.id!==id});localStorage.setItem(DB,JSON.stringify(records));render();};
window.clearToday(){records=records.filter(function(r){return r.date!==today()});localStorage.setItem(DB,JSON.stringify(records));render();}

window.setTarget=function(){
var v=parseInt(document.getElementById('targetInput').value);
if(v>=500&&v<=5000){target=v;localStorage.setItem(TGT_KEY,v);render();}
};

function render(){
var tr=todayRecords();
var total=0;tr.forEach(function(r){total+=r.ml});
var cups=Math.round(total/250);
document.getElementById('todayMl').textContent=total;
document.getElementById('todayTarget').textContent=target;
document.getElementById('todayCups').textContent=cups;
var pct=Math.min(100,Math.round(total/target*100));
document.getElementById('progressBar').style.width=pct+'%';
document.getElementById('progressText').textContent=pct+'%';

var cupTotal=Math.ceil(target/250);
var grid=document.getElementById('cupGrid');
grid.innerHTML='';
for(var i=0;i<Math.min(cupTotal,20);i++){
var filled=i<cups;
grid.innerHTML+='<div class="cup-item'+(filled?' filled':'')+'" onclick="quickAdd(250)" title="第'+(i+1)+'杯">'+(filled?'💧':'○')+'</div>';
}

var el=document.getElementById('todayRecords');
if(!tr.length){el.innerHTML='<div class="es">暂无记录</div>';return;}
el.innerHTML=tr.slice().reverse().map(function(r){
return '<div class="li"><span>'+r.time+' - '+r.ml+'ml</span><button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="delRecord('+r.id+')">✕</button></div>';
}).join('');

var hist={};
records.forEach(function(r){if(!hist[r.date])hist[r.date]=0;hist[r.date]+=r.ml});
var dates=Object.keys(hist).sort().reverse().slice(0,7);
var hEl=document.getElementById('historyList');
if(!dates.length){hEl.innerHTML='<div class="es">暂无历史数据</div>';return;}
hEl.innerHTML=dates.map(function(d){
var done=hist[d]>=target;
return '<div class="li"><span>'+d+'</span><span style="font-weight:600;color:'+(done?'var(--success)':'var(--accent)')+'">'+hist[d]+'ml '+(done?'✅':'')+'</span></div>';
}).join('');
}
document.getElementById('targetInput').value=target;
renderQuick();render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
