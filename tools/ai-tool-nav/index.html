let currentCategory = "全部";
let currentSort = "heat";
let currentSearch = "";
let showFavoritesOnly = false;
function getFavorites() {
  try { return JSON.parse(localStorage.getItem('ai_tool_nav_favs') || '[]'); }
  catch(e) { return []; }
}
function saveFavorites(favs) {
  localStorage.setItem('ai_tool_nav_favs', JSON.stringify(favs));
}
function isFavorite(id) { return getFavorites().includes(id); }
function toggleFavorite(id) {
  const favs = getFavorites();
  const idx = favs.indexOf(id);
  if (idx > -1) favs.splice(idx, 1);
  else favs.push(id);
  saveFavorites(favs);
  render();
}
function getFilteredTools() {
  let filtered = toolsData;
  if (currentCategory !== "全部") {
    filtered = filtered.filter(t => t.cat === currentCategory);
  }
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    filtered = filtered.filter(t =>
      t.name.toLowerCase().includes(q) ||
      t.desc.toLowerCase().includes(q) ||
      t.tags.some(tag => tag.toLowerCase().includes(q)) ||
      t.cat.toLowerCase().includes(q)
    );
  }
  if (showFavoritesOnly) {
    const favs = getFavorites();
    filtered = filtered.filter(t => favs.includes(t.id));
  }
  if (currentSort === "heat") {
    filtered.sort((a, b) => b.heat - a.heat);
  } else if (currentSort === "name") {
    filtered.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  } else if (currentSort === "free") {
    const order = { free: 0, freemium: 1, paid: 2 };
    filtered.sort((a, b) => (order[a.price]||0) - (order[b.price]||0) || b.heat - a.heat);
  }
  return filtered;
}
function render() {
  const tools = getFilteredTools();
  const grid = document.getElementById('toolGrid');
  const empty = document.getElementById('emptyState');
  const stats = document.getElementById('statsCount');
  stats.innerHTML = '共显示 <strong>' + tools.length + '</strong> 个工具';
  if (tools.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = tools.map(t => {
      const f = isFavorite(t.id);
      const priceLabel = t.price === 'free' ? '免费' : t.price === 'paid' ? '付费' : '部分免费';
      const priceClass = 'badge badge-' + t.price;
      return `
        <div class="tool-card" data-id="${t.id}">
          <div class="card-top">
            <div class="tool-logo">${t.emoji}</div>
            <div class="tool-info">
              <div class="tool-header">
                <span class="tool-name">${escapeHtml(t.name)}</span>
                <span class="${priceClass}">${priceLabel}</span>
              </div>
              <p class="tool-desc">${escapeHtml(t.desc)}</p>
            </div>
          </div>
          <div class="feature-tags">
            ${t.tags.map(tag => '<span class="feature-tag">' + escapeHtml(tag) + '</span>').join('')}
          </div>
          <div class="card-actions">
            <a href="${t.url}" target="_blank" rel="noopener" class="btn-visit">🔗 访问官网</a>
            <button class="btn-fav-card ${f ? 'favorited' : ''}" onclick="toggleFavorite(${t.id})" title="${f ? '取消收藏' : '添加收藏'}">
              ${f ? '⭐' : '☆'}
            </button>
          </div>
        </div>
      `;
    }).join('');
  }
  const favCount = getFavorites().length;
  document.getElementById('favCount').textContent = '(' + favCount + ')';
  const btnFav = document.getElementById('btnFavorites');
  if (showFavoritesOnly) btnFav.classList.add('active');
  else btnFav.classList.remove('active');
  if (favCount > 0) btnFav.classList.add('has-favs');
  else btnFav.classList.remove('has-favs');
  renderCategories();
}

  const div = document.createElement('div');
  div.textContent = str;

  const filteredTools = getFilteredTools();
  container.innerHTML = categories.map(cat => {
    let count;
    if (cat === "全部") {
      count = currentSearch ? filteredTools.length : toolsData.length;
    } else {
      count = toolsData.filter(t => t.cat === cat).length;
      if (currentSearch) {
        const q = currentSearch.toLowerCase();
        count = toolsData.filter(t => t.cat === cat && (
          t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) ||
          t.tags.some(tag => tag.toLowerCase().includes(q))
        )).length;
      }
    }
    const emoji = cat === "全部" ? "🏠" : (catEmojis[cat] || "");
    return `
      <button class="category-tab ${currentCategory === cat ? 'active' : ''}"
        onclick="setCategory('${cat}')">
        <span class="cat-emoji">${emoji}</span>${cat}
        <span class="cat-count">${count}</span>
      </button>
    `;
  }).join('');
}
function setCategory(cat) {
  currentCategory = cat;
  render();
}
function setSearch(val) {
  currentSearch = val;
  const clearBtn = document.getElementById('searchClear');
  if (val) clearBtn.classList.add('visible');
  else clearBtn.classList.remove('visible');
  render();
}
document.getElementById('searchInput').addEventListener('input', function(e) {
  setSearch(e.target.value);
});
document.getElementById('searchClear').addEventListener('click', function() {
  document.getElementById('searchInput').value = '';
  setSearch('');
  document.getElementById('searchInput').focus();
});
function setSort(sort) {
  currentSort = sort;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.sort-btn[data-sort="' + sort + '"]').classList.add('active');
  render();
}
function toggleFavFilter() {
  showFavoritesOnly = !showFavoritesOnly;
  if (showFavoritesOnly) currentCategory = "全部";
  render();
}
window.addEventListener('scroll', function() {
  const btn = document.getElementById('backTop');
  if (window.scrollY > 400) btn.classList.add('visible');
  else btn.classList.remove('visible');
});
document.addEventListener('keydown', function(e) {
  if (e.key === '/' && document.activeElement !== document.getElementById('searchInput') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if (e.key === 'Escape' && document.activeElement === document.getElementById('searchInput')) {
    document.getElementById('searchInput').value = '';
    setSearch('');
    document.getElementById('searchInput').blur();
  }
});
render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
