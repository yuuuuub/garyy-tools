<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌊 海浪声</title>
<meta property="og:title" content="🌊 海浪声">
<meta property="og:description" content="🌊 海浪声 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线海浪声生成器，模拟真实海滩海浪，帮助放松入睡">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#0ea5e9;--accent2:#0284c7;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0284c7;--accent2:#0369a1}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.ctn{width:100%;max-width:500px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow)}
header{text-align:center;margin-bottom:24px}h1{font-size:1.5rem;font-weight:700}.sub{color:var(--text2);font-size:.85rem;margin-top:4px}
.section{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}.section h2{font-size:1rem;margin-bottom:12px;color:var(--accent)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{padding:14px 8px;border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;transition:all .2s;background:var(--card)}.mode:hover{border-color:var(--accent)}.mode.active{border-color:var(--accent);background:rgba(14,165,233,.1)}
.mode .icon{font-size:1.6rem;display:block;margin-bottom:4px}.mode .name{font-size:.8rem;color:var(--text2)}.mode.active .name{color:var(--accent);font-weight:600}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}.slider-row label{font-size:.85rem;color:var(--text2);min-width:60px}
.slider-row input[type="range"]{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--border);outline:none}
.slider-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--card)}
.slider-row span{font-size:.85rem;min-width:36px;text-align:right}
.timer-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tbtn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text);font-size:.8rem;cursor:pointer;transition:all .2s}.tbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ctrls{display:flex;gap:10px;margin-top:14px}.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}.btn-play{background:var(--accent);color:#fff}.btn-play:hover{background:var(--accent2)}.btn-play.playing{background:#ef4444}.btn-stop{background:var(--border);color:var(--text)}
.status{text-align:center;margin-top:12px;font-size:.85rem;color:var(--text2);min-height:20px}
.viz{display:flex;align-items:end;justify-content:center;gap:2px;height:50px;margin-top:12px}.bar{width:3px;background:var(--accent);border-radius:2px;transition:height .1s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.ctn{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="ctn">
<header><h1>🌊 海浪声</h1><p class="sub">聆听大海，放松身心</p></header>

<div class="section"><h2>🎵 海浪类型</h2>
<div class="modes" id="modes"></div></div>

<div class="section">
<div class="slider-row"><label>音量</label><input type="range" id="vol" min="0" max="100" value="50" oninput="setVol(this.value)"><span id="volV">50%</span></div>
<div class="slider-row"><label>浪速</label><input type="range" id="speed" min="1" max="10" value="5" oninput="setSpeed(this.value)"><span id="speedV">5</span></div>
<div class="slider-row"><label>距离</label><input type="range" id="dist" min="0" max="100" value="40" oninput="setDist(this.value)"><span id="distV">40%</span></div>
</div>

<div class="section"><h2>⏱ 定时</h2>
<div class="timer-btns">
<button class="tbtn active" onclick="setTimer(0,this)">不限</button>
<button class="tbtn" onclick="setTimer(15,this)">15分钟</button>
<button class="tbtn" onclick="setTimer(30,this)">30分钟</button>
<button class="tbtn" onclick="setTimer(60,this)">1小时</button>
<button class="tbtn" onclick="setTimer(120,this)">2小时</button>
</div></div>

<div class="ctrls">
<button class="btn btn-play" id="playBtn" onclick="toggle()">▶ 播放</button>
<button class="btn btn-stop" onclick="stop()">⏹ 停止</button>
</div>
<div class="viz" id="viz"></div>
<div class="status" id="status">选择海浪，点击播放</div>
</div>

<script src="../i18n.js" defer></script>
<script>
const modes=[
  {id:'gentle',icon:'🏖️',name:'轻柔浪花',desc:'温和拍岸'},
  {id:'steady',icon:'🌊',name:'稳定海浪',desc:'有节奏起伏'},
  {id:'crashing',icon:'💨',name:'拍岸浪',desc:'有力拍打'},
  {id:'distant',icon:'🌅',name:'远方海浪',desc:'遥远低鸣'},
  {id:'shore',icon:'🐚',name:'海岸浪',desc:'沙石摩擦'},
  {id:'storm',icon:'🌀',name:'风暴浪',desc:'汹涌澎湃'},
  {id:'harbor',icon:'⚓',name:'港湾浪',desc:'平静港湾'},
  {id:'reef',icon:'🐠',name:'礁石浪',desc:'浪花飞溅'},
  {id:'lagoon',icon:'🏝️',name:'泻湖',desc:'静谧水面'}
];

let actx=null,gain=null,playing=false,current='gentle',timerId=null,timerMin=0;
let nodes=[],lfoNode=null;

function $(id){return document.getElementById(id);}
function initModes(){const g=$('modes');modes.forEach((m,i)=>{const d=document.createElement('div');d.className='mode'+(i===0?' active':'');d.innerHTML=`<span class="icon">${m.icon}</span><span class="name">${m.name}</span>`;d.onclick=()=>{current=m.id;g.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));d.classList.add('active');if(playing){stop();toggle();}};g.appendChild(d);});}
function initViz(){const v=$('viz');for(let i=0;i<32;i++){const b=document.createElement('div');b.className='bar';b.style.height='2px';v.appendChild(b);}}
function setVol(v){$('volV').textContent=v+'%';if(gain)gain.gain.value=v/100;}
function setSpeed(v){$('speedV').textContent=v;if(lfoNode)lfoNode.frequency.value=v*0.1;}
function setDist(v){$('distV').textContent=v+'%';}
function setTimer(m,t){timerMin=m;document.querySelectorAll('.tbtn').forEach(x=>x.classList.remove('active'));t.classList.add('active');}

function createNoise(ctx,len){const buf=ctx.createBuffer(1,len||ctx.sampleRate*2,ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;return s;}

function setupAudio(){
  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  gain=actx.createGain();gain.gain.value=$('vol').value/100;gain.connect(actx.destination);
  const speed=+$('speed').value;
  const dist=$('dist').value/100;

  const noise=createNoise(actx);
  const lp=actx.createBiquadFilter();lp.type='lowpass';
  lfoNode=actx.createOscillator();lfoNode.type='sine';lfoNode.frequency.value=speed*0.1;
  const lfoG=actx.createGain();lfoG.gain.value=0.3;

  let lfoFreq,lfoGainVal,lpFreq;
  switch(current){
    case'gentle':lfoFreq=speed*0.08;lfoGainVal=0.2;lpFreq=800+dist*600;break;
    case'steady':lfoFreq=speed*0.1;lfoGainVal=0.3;lpFreq=1000+dist*800;break;
    case'crashing':lfoFreq=speed*0.12;lfoGainVal=0.5;lpFreq=1500+dist*1000;break;
    case'distant':lfoFreq=speed*0.05;lfoGainVal=0.15;lpFreq=400+dist*300;break;
    case'shore':lfoFreq=speed*0.1;lfoGainVal=0.35;lpFreq=1200+dist*700;break;
    case'storm':lfoFreq=speed*0.15;lfoGainVal=0.6;lpFreq=2000+dist*1500;break;
    case'harbor':lfoFreq=speed*0.06;lfoGainVal=0.1;lpFreq=500+dist*400;break;
    case'reef':lfoFreq=speed*0.13;lfoGainVal=0.4;lpFreq=1800+dist*900;break;
    case'lagoon':lfoFreq=speed*0.04;lfoGainVal=0.08;lpFreq=300+dist*200;break;
  }

  lfoNode.frequency.value=lfoFreq;
  lfoG.gain.value=lfoGainVal;
  lp.frequency.value=lpFreq;

  lfoNode.connect(lfoG);lfoG.connect(lp.frequency);
  noise.connect(lp);lp.connect(gain);

  lfoNode.start();noise.start();
  nodes.push(lfoNode,noise);

  const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=60;
  const foamNoise=createNoise(actx);
  const foamGain=actx.createGain();foamGain.gain.value=0.08;
  foamNoise.connect(hp);hp.connect(foamGain);foamGain.connect(gain);
  foamNoise.start();nodes.push(foamNoise);
}

function toggle(){if(playing){stop();return;}setupAudio();playing=true;$('playBtn').textContent='⏸ 暂停';$('playBtn').classList.add('playing');$('status').textContent='正在播放：'+modes.find(m=>m.id===current).name;animateViz();if(timerMin>0)timerId=setTimeout(()=>{stop();$('status').textContent='定时结束';},timerMin*60000);}

function stop(){if(!playing)return;nodes.forEach(n=>{try{n.stop();}catch(e){}});nodes=[];if(gain){gain.disconnect();gain=null;}lfoNode=null;playing=false;$('playBtn').textContent='▶ 播放';$('playBtn').classList.remove('playing');$('status').textContent='已停止';if(timerId){clearTimeout(timerId);timerId=null;}document.querySelectorAll('.bar').forEach(b=>b.style.height='2px');}

function animateViz(){if(!playing)return;document.querySelectorAll('.bar').forEach(b=>{b.style.height=(Math.random()*40+4)+'px';});requestAnimationFrame(()=>setTimeout(animateViz,100));}

initModes();initViz();
</script>
</body>
</html>
