<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧊 夏日饮品DIY - Gary's Tools</title>
<meta name="description" content="10款简单易做的夏日冰饮做法，含柠檬茶、杨枝甘露、冰咖啡、水果气泡水等，在家轻松搞定">
<style>
:root{--bg:#f0fdfa;--card:#fff;--text:#134e4a;--text2:#5eead4;--accent:#14b8a6;--lime:#84cc16;--orange:#f97316;--pink:#ec4899;--purple:#a855f7;--border:#ccfbf1;--radius:14px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
[data-theme="dark"]{--bg:#0f1a18;--card:#1a2a26;--text:#ccfbf1;--text2:#5eead4;--border:#134e4a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16pxscroll-behavior:smooth;}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#14b8a6,#84cc16,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:#5eead4;font-size:.85rem;margin-top:4px}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.8rem;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s}
.tab.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.drink-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.03)}
.drink-img{height:120px;display:flex;align-items:center;justify-content:center;font-size:4rem;position:relative}
.drink-body{padding:18px}
.drink-name{font-size:1.1rem;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.drink-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.drink-tag{font-size:.65rem;padding:3px 8px;border-radius:10px;font-weight:500}
.tag-time{background:rgba(249,115,22,.1);color:var(--orange)}
.tag-easy{background:rgba(20,184,166,.1);color:var(--accent)}
.tag-cal{background:rgba(132,204,22,.1);color:var(--lime)}
.ingredients{font-size:.78rem;color:var(--text2);margin-bottom:10px;line-height:1.6}
.steps{font-size:.8rem;line-height:1.8}
.step-num{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--text);align-items:center;justify-content:center;font-size:.65rem;font-weight:800;margin-right:6px;flex-shrink:0}
footer{text-align:center;padding:24px 0;color:#5eead4;font-size:.7rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🧊 夏日饮品DIY - Gary's Tools">
  <meta property="og:description" content="10款简单易做的夏日冰饮做法，含柠檬茶、杨枝甘露、冰咖啡、水果气泡水等，在家轻松搞定">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/summer-drinks/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>🧊 夏日饮品DIY</h1>
<p>10款简单好喝的冰饮 · 在家轻松做</p>
</header>

<div class="tabs" id="tabs">
<button class="tab active" data-c="all">全部</button>
<button class="tab" data-c="tea">🍵 茶饮</button>
<button class="tab" data-c="coffee">☕ 咖啡</button>
<button class="tab" data-c="fruit">🍉 果饮</button>
<button class="tab" data-c="soda">🫧 气泡</button>
</div>

<div id="drinkList"></div>
<footer>清爽一夏 · 告别奶茶店 💰</footer>
</div>

<script>
const DRINKS=[
{name:'暴打柠檬茶',icon:'🍋',cats:['tea'],time:'10分钟',difficulty:'简单',cal:'~80kcal',bg:'linear-gradient(135deg,#fef9c3,#fef08a)',ingredients:'香水柠檬2个 · 红茶包2个 · 冰糖30g · 冰块适量 · 水500ml',steps:['柠檬切片去籽，加冰和冰糖用擀面杖暴打出汁','红茶用热水泡5分钟后取出茶包放凉','杯中加满冰，倒入柠檬汁和红茶','搅匀即可，超清爽！']},
{name:'杨枝甘露',icon:'🥭',cats:['fruit'],time:'20分钟',difficulty:'中等',cal:'~250kcal',bg:'linear-gradient(135deg,#fed7aa,#fdba74)',ingredients:'芒果2个 · 西柚半个 · 椰浆200ml · 淡奶100ml · 西米50g · 糖20g',steps:['西米煮至透明过凉水备用','芒果一半切丁装饰，一半打成泥','椰浆+淡奶+糖混合搅匀','杯中依次放入西米→芒果泥→椰奶→芒果丁和西柚粒']},
{name:'生椰拿铁',icon:'🥥',cats:['coffee'],time:'5分钟',difficulty:'超简单',cal:'~120kcal',bg:'linear-gradient(135deg,#e5d9c8,#d4c5b0)',ingredients:'浓缩咖啡液1份(或速溶+热水) · 厚椰乳200ml · 冰块满杯',steps:['杯中加满冰块','倒入厚椰乳至8分满','缓慢倒入浓缩咖啡液，制造分层效果','拍照后搅匀饮用！']},
{name:'西瓜茉莉冰茶',icon:'🍉',cats:['tea','fruit'],time:'10分钟',difficulty:'简单',cal:'~60kcal',bg:'linear-gradient(135deg,#fecaca,#fda4af)',ingredients:'西瓜200g · 茉莉花茶包2个 · 蜂蜜15ml · 柠檬2片 · 冰块',steps:['西瓜去籽切块，榨汁过滤','茉莉花茶用热水泡3分钟取出放凉','杯中加冰，倒入西瓜汁和茉莉花茶','加蜂蜜和柠檬片搅拌即可']},
{name:'百香果气泡水',icon:'🫧',cats:['soda','fruit'],time:'5分钟',difficulty:'超简单',cal:'~50kcal',bg:'linear-gradient(135deg,#fde68a,#fcd34d)',ingredients:'百香果2个 · 气泡水250ml · 蜂蜜15ml · 薄荷叶 · 冰块',steps:['百香果切开挖出果肉放入杯中','加入蜂蜜搅拌均匀','加满冰块，倒入气泡水','薄荷叶装饰，完成！']},
{name:'冰镇绿豆沙',icon:'🫘',cats:['tea'],time:'50分钟',difficulty:'中等',cal:'~150kcal',bg:'linear-gradient(135deg,#dcfce7,#bbf7d0)',ingredients:'绿豆100g · 冰糖40g · 陈皮1小块 · 冰块',steps:['绿豆洗净泡水30分钟','绿豆+陈皮+800ml水煮沸转小火熬30分钟','加冰糖搅至融化','放凉后冷藏，喝时加冰打碎更好喝']},
{name:'青提气泡养乐多',icon:'🍇',cats:['soda'],time:'5分钟',difficulty:'超简单',cal:'~100kcal',bg:'linear-gradient(135deg,#d9f99d,#bef264)',ingredients:'青提10颗 · 养乐多1瓶 · 气泡水150ml · 冰块',steps:['青提洗净对半切开放入杯中','加冰块至7分满','倒入养乐多，再加气泡水至满','轻轻搅匀，酸酸甜甜']},
{name:'蜜桃乌龙冷泡茶',icon:'🍑',cats:['tea','fruit'],time:'4小时(冷泡)',difficulty:'超简单',cal:'~30kcal',bg:'linear-gradient(135deg,#fce7f3,#fbcfe8)',ingredients:'水蜜桃1个 · 乌龙茶包2个 · 蜂蜜10ml · 冷水500ml',steps:['水蜜桃切片去核','碗中放冷水+茶包+桃片','冰箱冷藏4小时或过夜','取出加蜂蜜和冰块即可']},
{name:'橙香冰美式',icon:'🍊',cats:['coffee','fruit'],time:'5分钟',difficulty:'简单',cal:'~40kcal',bg:'linear-gradient(135deg,#fed7aa,#fdba74)',ingredients:'橙汁100ml · 浓缩咖啡1份 · 冰块 · 橙片装饰',steps:['杯中加满冰块','倒入鲜榨橙汁至半杯','缓慢倒入浓缩咖啡','放一片橙子在杯边，清爽解暑']},
{name:'冰粉奶茶',icon:'🧋',cats:['tea'],time:'30分钟',difficulty:'中等',cal:'~200kcal',bg:'linear-gradient(135deg,#d8b4fe,#c084fc)',ingredients:'冰粉粉10g · 热水500ml · 红糖30g · 牛奶 · 珍珠/芋圆 · 冰块',steps:['冰粉粉+热水搅匀冷藏凝固','红糖+水熬成糖浆','冰粉切块放入碗中','加冰、珍珠、牛奶和红糖浆']},
];

let activeCat='all';

function render(){
const filtered=activeCat==='all'?DRINKS:DRINKS.filter(d=>d.cats.includes(activeCat));
document.getElementById('drinkList').innerHTML=filtered.map(d=>`
<div class="drink-card">
<div class="drink-img" style="background:${d.bg}">${d.icon}</div>
<div class="drink-body">
<div class="drink-name">${d.icon} ${d.name}</div>
<div class="drink-tags">
<span class="drink-tag tag-time">⏱️ ${d.time}</span>
<span class="drink-tag tag-easy">📊 ${d.difficulty}</span>
<span class="drink-tag tag-cal">🔥 ${d.cal}</span>
</div>
<div class="ingredients">📦 <b>材料：</b>${d.ingredients}</div>
<div class="steps">${d.steps.map((s,i)=>`<div><span class="step-num">${i+1}</span> ${s}</div>`).join('')}</div>
</div>
</div>`).join('');
}

document.getElementById('tabs').addEventListener('click',e=>{
if(!e.target.classList.contains('tab'))return;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
e.target.classList.add('active');
activeCat=e.target.dataset.c;
render();
});

render();
</script>
<script>
(function(){
var btn = document.createElement('button');
btn.textContent = '🎲 随机推荐饮品';
btn.style.cssText = 'display:block;margin:20px auto;padding:10px 24px;border:1px solid var(--border,#30363d);border-radius:8px;background:var(--accent,#14b8a6);color:var(--text);font-size:.9rem;font-weight:600;cursor:pointer';
btn.addEventListener('click',function(){
  var cards = document.querySelectorAll('.drink-card');
  cards.forEach(function(c){ c.style.border = ''; c.style.background = ''; });
  if (cards.length) {
    var pick = cards[Math.floor(Math.random() * cards.length)];
    pick.style.border = '2px solid #f59e0b';
    pick.style.background = 'rgba(245,158,11,0.08)';
    pick.scrollIntoView({behavior:'smooth',block:'center'});
  }
});
document.body.appendChild(btn);
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
