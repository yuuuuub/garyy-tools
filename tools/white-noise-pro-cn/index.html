<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔊 白噪音专业版</title>
<meta property="og:title" content="🔊 白噪音专业版">
<meta property="og:description" content="🔊 白噪音专业版 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="专业白噪音生成器，支持多种噪音类型和混合模式，帮助睡眠和专注">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔊</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#6366f1;--accent2:#4f46e5;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#4f46e5;--accent2:#4338ca}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.ctn{width:100%;max-width:500px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow)}
header{text-align:center;margin-bottom:24px}h1{font-size:1.5rem;font-weight:700}.sub{color:var(--text2);font-size:.85rem;margin-top:4px}
.section{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}.section h2{font-size:1rem;margin-bottom:12px;color:var(--accent)}
.mixer{display:flex;flex-direction:column;gap:10px}
.mix-row{display:flex;align-items:center;gap:10px}
.mix-label{font-size:.85rem;min-width:70px;color:var(--text2)}
.mix-slider{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--border);outline:none}
.mix-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--card)}
.mix-val{font-size:.8rem;min-width:30px;text-align:right;color:var(--text)}
.timer-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tbtn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text);font-size:.8rem;cursor:pointer;transition:all .2s}.tbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ctrls{display:flex;gap:10px;margin-top:14px}.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}.btn-play{background:var(--accent);color:#fff}.btn-play:hover{background:var(--accent2)}.btn-play.playing{background:#ef4444}.btn-stop{background:var(--border);color:var(--text)}
.status{text-align:center;margin-top:12px;font-size:.85rem;color:var(--text2);min-height:20px}
.viz{display:flex;align-items:end;justify-content:center;gap:2px;height:50px;margin-top:12px}.bar{width:3px;background:var(--accent);border-radius:2px;transition:height .1s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.ctn{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="ctn">
<header><h1>🔊 白噪音专业版</h1><p class="sub">混合多种噪音，定制专属音效</p></header>

<div class="section"><h2>🎚️ 噪音混合器</h2>
<div class="mixer" id="mixer"></div></div>

<div class="section"><h2>⏱ 定时</h2>
<div class="timer-btns">
<button class="tbtn active" onclick="setTimer(0,this)">不限</button>
<button class="tbtn" onclick="setTimer(15,this)">15分钟</button>
<button class="tbtn" onclick="setTimer(30,this)">30分钟</button>
<button class="tbtn" onclick="setTimer(60,this)">1小时</button>
<button class="tbtn" onclick="setTimer(120,this)">2小时</button>
</div></div>

<div class="ctrls">
<button class="btn btn-play" id="playBtn" onclick="toggle()">▶ 播放</button>
<button class="btn btn-stop" onclick="stop()">⏹ 停止</button>
</div>
<div class="viz" id="viz"></div>
<div class="status" id="status">调节混合比例，点击播放</div>
</div>

<script src="../i18n.js" defer></script>
<script>
const noiseTypes=[
  {id:'white',name:'白噪音',color:'#fff'},
  {id:'pink',name:'粉噪音',color:'#f472b6'},
  {id:'brown',name:'棕噪音',color:'#92400e'},
  {id:'blue',name:'蓝噪音',color:'#3b82f6'},
  {id:'violet',name:'紫噪音',color:'#8b5cf6'},
  {id:'red',name:'红噪音',color:'#ef4444'}
];

let actx=null,playing=false,timerId=null,timerMin=0;
let noiseSources={},gains={};

function $(id){return document.getElementById(id);}

function initMixer(){
  const m=$('mixer');
  noiseTypes.forEach(n=>{
    const row=document.createElement('div');row.className='mix-row';
    row.innerHTML=`<span class="mix-label">${n.name}</span><input type="range" class="mix-slider" id="mix_${n.id}" min="0" max="100" value="${n.id==='white'?50:0}" oninput="updateMix('${n.id}',this.value)"><span class="mix-val" id="val_${n.id}">${n.id==='white'?50:0}%</span>`;
    m.appendChild(row);
  });
}

function initViz(){const v=$('viz');for(let i=0;i<32;i++){const b=document.createElement('div');b.className='bar';b.style.height='2px';v.appendChild(b);}}

function updateMix(id,val){$('val_'+id).textContent=val+'%';if(gains[id])gains[id].gain.value=val/100;}
function setTimer(m,t){timerMin=m;document.querySelectorAll('.tbtn').forEach(x=>x.classList.remove('active'));t.classList.add('active');}

function generateNoiseBuffer(ctx,type,len){
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const data=buf.getChannelData(0);
  if(type==='white'){for(let i=0;i<len;i++)data[i]=Math.random()*2-1;}
  else if(type==='pink'){
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.969*b2+w*0.153852;b3=0.8665*b3+w*0.3104856;b4=0.55*b4+w*0.5329522;b5=-0.7616*b5-w*0.016898;data[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b6=w*0.115926;}
  }
  else if(type==='brown'){
    let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;data[i]=(last+0.02*w)/1.02;last=data[i];data[i]*=3.5;}
  }
  else if(type==='blue'){
    let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;data[i]=w-last;last=w;data[i]*=0.5;}
  }
  else if(type==='violet'){
    let prev=0,prev2=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;data[i]=w-2*prev+prev2;prev2=prev;prev=w;data[i]*=0.2;}
  }
  else if(type==='red'){
    let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;data[i]=(last+0.01*w)/1.01;last=data[i];data[i]*=5;}
  }
  return buf;
}

function setupAudio(){
  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  const masterGain=actx.createGain();masterGain.gain.value=1;masterGain.connect(actx.destination);
  const len=actx.sampleRate*4;

  noiseTypes.forEach(n=>{
    const val=+$('mix_'+n.id).value;
    if(val===0)return;
    const buf=generateNoiseBuffer(actx,n.id,len);
    const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    const g=actx.createGain();g.gain.value=val/100;
    src.connect(g);g.connect(masterGain);
    src.start();
    noiseSources[n.id]=src;
    gains[n.id]=g;
  });

  gains._master=masterGain;
}

function toggle(){if(playing){stop();return;}setupAudio();playing=true;$('playBtn').textContent='⏸ 暂停';$('playBtn').classList.add('playing');$('status').textContent='正在播放：混合噪音';animateViz();if(timerMin>0)timerId=setTimeout(()=>{stop();$('status').textContent='定时结束';},timerMin*60000);}

function stop(){if(!playing)return;Object.values(noiseSources).forEach(s=>{try{s.stop();}catch(e){}});noiseSources={};if(gains._master){gains._master.disconnect();}gains={};playing=false;$('playBtn').textContent='▶ 播放';$('playBtn').classList.remove('playing');$('status').textContent='已停止';if(timerId){clearTimeout(timerId);timerId=null;}document.querySelectorAll('.bar').forEach(b=>b.style.height='2px');}

function animateViz(){if(!playing)return;document.querySelectorAll('.bar').forEach(b=>{b.style.height=(Math.random()*40+4)+'px';});requestAnimationFrame(()=>setTimeout(animateViz,100));}

initMixer();initViz();
</script>
</body>
</html>
