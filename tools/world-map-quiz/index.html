<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗺️ 世界地图测验</title>
<meta property="og:title" content="🗺️ 世界地图测验">
<meta property="og:description" content="🗺️ 世界地图测验 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="世界地图测验 - 通过交互式地图学习世界各国位置，挑战地理知识">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:1000px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{font-family:inherit;font-size:.95rem;padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}
.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.map-container{position:relative;width:100%;aspect-ratio:2/1;background:var(--bg);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.map-container svg{width:100%;height:100%}
.country-dot{width:10px;height:10px;border-radius:50%;position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:all .2s;border:2px solid transparent}
.country-dot:hover{transform:translate(-50%,-50%) scale(1.5);z-index:10}
.country-dot.correct{background:var(--success);border-color:var(--success)}
.country-dot.wrong{background:var(--danger);border-color:var(--danger)}
.country-dot.highlight{background:var(--warn);border-color:var(--warn);animation:pulse 1s infinite}
.country-dot.target{background:var(--accent);border-color:var(--accent);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.5)}50%{box-shadow:0 0 0 8px rgba(59,130,246,0)}}
.question-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.question-bar .q-text{font-size:1.1rem;flex:1}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.options button{text-align:left;padding:12px 16px;font-size:.95rem}
.options button.correct{background:var(--success);color:#fff}
.options button.wrong{background:var(--danger);color:#fff}
.options button:disabled{cursor:not-allowed;opacity:.7}
.hidden{display:none}
.flag-big{font-size:3rem}
.mode-btn{display:inline-block;padding:8px 16px;border-radius:8px;cursor:pointer;background:var(--bg);border:2px solid var(--border);color:var(--text);transition:all .2s;font-weight:600}
.mode-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.info-panel{background:var(--bg);border-radius:8px;padding:16px;margin-top:12px;display:none}
.info-panel.show{display:block}
.info-panel .info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.info-panel .info-item .label{font-size:.75rem;color:var(--text2)}
.info-panel .info-item .val{font-size:.9rem;font-weight:600}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🗺️ 世界地图测验</h1><p>挑战你的地理知识</p></div>

<div class="cd">
<div class="bg">
<span class="mode-btn active" onclick="setMode('capital',this)">🏛 首都</span>
<span class="mode-btn" onclick="setMode('flag',this)">🏁 国旗</span>
<span class="mode-btn" onclick="setMode('map',this)">📍 地图定位</span>
<span class="mode-btn" onclick="setMode('continent',this)">🌏 大洲</span>
</div>
<div class="bg">
<button onclick="startQuiz()">开始测验</button>
<button class="sec" onclick="showAllCountries()">查看所有国家</button>
</div>
</div>

<div id="quizArea" class="cd hidden">
<div class="gr" style="margin-bottom:16px">
<div class="st"><div class="nm" id="qScore">0</div><div class="lb">得分</div></div>
<div class="st"><div class="nm" id="qTotal">0</div><div class="lb">题目</div></div>
<div class="st"><div class="nm" id="qAccuracy">0%</div><div class="lb">正确率</div></div>
<div class="st"><div class="nm" id="qStreak">0</div><div class="lb">连续正确</div></div>
</div>
<div class="question-bar">
<span class="flag-big" id="qFlag"></span>
<div class="q-text" id="qText">选择正确答案</div>
</div>
<div id="qOptions" class="options"></div>
<div id="qFeedback" style="margin-top:12px;font-weight:600"></div>
<div class="bg" style="margin-top:12px"><button onclick="nextQuestion()">下一题 →</button></div>
</div>

<div id="countryList" class="cd hidden">
<h2>世界国家</h2>
<div style="margin-bottom:8px"><input type="text" id="countrySearch" placeholder="搜索国家..." oninput="filterCountries()" style="width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none"></div>
<div id="countries" style="max-height:400px;overflow-y:auto"></div>
</div>

<div id="infoPanel" class="info-panel"></div>
</div>

<script>
const countries=[
{name:'中国',flag:'🇨🇳',capital:'北京',continent:'亚洲',lat:35.86,lng:104.20,pop:'14.1亿'},
{name:'日本',flag:'🇯🇵',capital:'东京',continent:'亚洲',lat:36.20,lng:138.25,pop:'1.26亿'},
{name:'韩国',flag:'🇰🇷',capital:'首尔',continent:'亚洲',lat:35.91,lng:127.77,pop:'5180万'},
{name:'印度',flag:'🇮🇳',capital:'新德里',continent:'亚洲',lat:20.59,lng:78.96,pop:'14.08亿'},
{name:'印度尼西亚',flag:'🇮🇩',capital:'雅加达',continent:'亚洲',lat:-0.79,lng:113.92,pop:'2.74亿'},
{name:'泰国',flag:'🇹🇭',capital:'曼谷',continent:'亚洲',lat:15.87,lng:100.99,pop:'6980万'},
{name:'越南',flag:'🇻🇳',capital:'河内',continent:'亚洲',lat:14.06,lng:108.28,pop:'9730万'},
{name:'新加坡',flag:'🇸🇬',capital:'新加坡',continent:'亚洲',lat:1.35,lng:103.82,pop:'569万'},
{name:'马来西亚',flag:'🇲🇾',capital:'吉隆坡',continent:'亚洲',lat:4.21,lng:101.98,pop:'3240万'},
{name:'菲律宾',flag:'🇵🇭',capital:'马尼拉',continent:'亚洲',lat:12.88,lng:121.77,pop:'1.1亿'},
{name:'美国',flag:'🇺🇸',capital:'华盛顿',continent:'北美洲',lat:37.09,lng:-95.71,pop:'3.31亿'},
{name:'加拿大',flag:'🇨🇦',capital:'渥太华',continent:'北美洲',lat:56.13,lng:-106.35,pop:'3800万'},
{name:'墨西哥',flag:'🇲🇽',capital:'墨西哥城',continent:'北美洲',lat:23.63,lng:-102.55,pop:'1.29亿'},
{name:'巴西',flag:'🇧🇷',capital:'巴西利亚',continent:'南美洲',lat:-14.24,lng:-51.93,pop:'2.13亿'},
{name:'阿根廷',flag:'🇦🇷',capital:'布宜诺斯艾利斯',continent:'南美洲',lat:-38.42,lng:-63.62,pop:'4540万'},
{name:'哥伦比亚',flag:'🇨🇴',capital:'波哥大',continent:'南美洲',lat:4.57,lng:-74.3,pop:'5090万'},
{name:'智利',flag:'🇨🇱',capital:'圣地亚哥',continent:'南美洲',lat:-35.68,lng:-71.54,pop:'1910万'},
{name:'秘鲁',flag:'🇵🇪',capital:'利马',continent:'南美洲',lat:-9.19,lng:-75.02,pop:'3300万'},
{name:'英国',flag:'🇬🇧',capital:'伦敦',continent:'欧洲',lat:55.38,lng:-3.44,pop:'6790万'},
{name:'法国',flag:'🇫🇷',capital:'巴黎',continent:'欧洲',lat:46.23,lng:2.21,pop:'6740万'},
{name:'德国',flag:'🇩🇪',capital:'柏林',continent:'欧洲',lat:51.17,lng:10.45,pop:'8320万'},
{name:'意大利',flag:'🇮🇹',capital:'罗马',continent:'欧洲',lat:41.87,lng:12.57,pop:'6040万'},
{name:'西班牙',flag:'🇪🇸',capital:'马德里',continent:'欧洲',lat:40.46,lng:-3.75,pop:'4670万'},
{name:'俄罗斯',flag:'🇷🇺',capital:'莫斯科',continent:'欧洲',lat:61.52,lng:105.32,pop:'1.44亿'},
{name:'荷兰',flag:'🇳🇱',capital:'阿姆斯特丹',continent:'欧洲',lat:52.13,lng:5.29,pop:'1740万'},
{name:'瑞典',flag:'🇸🇪',capital:'斯德哥尔摩',continent:'欧洲',lat:60.13,lng:18.64,pop:'1010万'},
{name:'挪威',flag:'🇳🇴',capital:'奥斯陆',continent:'欧洲',lat:60.47,lng:8.47,pop:'540万'},
{name:'瑞士',flag:'🇨🇭',capital:'伯尔尼',continent:'欧洲',lat:46.82,lng:8.23,pop:'865万'},
{name:'澳大利亚',flag:'🇦🇺',capital:'堪培拉',continent:'大洋洲',lat:-25.27,lng:133.78,pop:'2560万'},
{name:'新西兰',flag:'🇳🇿',capital:'惠灵顿',continent:'大洋洲',lat:-40.9,lng:174.89,pop:'508万'},
{name:'埃及',flag:'🇪🇬',capital:'开罗',continent:'非洲',lat:26.82,lng:30.8,pop:'1.02亿'},
{name:'南非',flag:'🇿🇦',capital:'比勒陀利亚',continent:'非洲',lat:-30.56,lng:22.94,pop:'5930万'},
{name:'尼日利亚',flag:'🇳🇬',capital:'阿布贾',continent:'非洲',lat:9.08,lng:8.68,pop:'2.06亿'},
{name:'肯尼亚',flag:'🇰🇪',capital:'内罗毕',continent:'非洲',lat:-0.02,lng:37.91,pop:'5380万'},
{name:'摩洛哥',flag:'🇲🇦',capital:'拉巴特',continent:'非洲',lat:31.79,lng:-7.09,pop:'3690万'},
{name:'埃塞俄比亚',flag:'🇪🇹',capital:'亚的斯亚贝巴',continent:'非洲',lat:9.15,lng:40.49,pop:'1.15亿'},
{name:'坦桑尼亚',flag:'🇹🇿',capital:'多多马',continent:'非洲',lat:-6.37,lng:34.89,pop:'5970万'},
{name:'阿联酋',flag:'🇦🇪',capital:'阿布扎比',continent:'亚洲',lat:23.42,lng:53.85,pop:'990万'},
{name:'沙特阿拉伯',flag:'🇸🇦',capital:'利雅得',continent:'亚洲',lat:23.89,lng:45.08,pop:'3480万'},
{name:'土耳其',flag:'🇹🇷',capital:'安卡拉',continent:'亚洲',lat:38.96,lng:35.24,pop:'8430万'},
{name:'巴基斯坦',flag:'🇵🇰',capital:'伊斯兰堡',continent:'亚洲',lat:30.38,lng:69.35,pop:'2.21亿'},
{name:'孟加拉国',flag:'🇧🇩',capital:'达卡',continent:'亚洲',lat:23.68,lng:90.36,pop:'1.65亿'}
];

let mode='capital',score=0,total=0,streak=0,maxStreak=0,questions=[],currentQ=0,answered=false;
function $(id){return document.getElementById(id)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function setMode(m,el){mode=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active')}

function startQuiz(){
  questions=shuffle([...countries]).slice(0,20);
  score=0;total=0;streak=0;maxStreak=0;currentQ=0;answered=false;
  $('quizArea').classList.remove('hidden');$('countryList').classList.add('hidden');$('infoPanel').classList.remove('show');
  showQuestion();
}

function showQuestion(){
  if(currentQ>=questions.length){alert('测验结束！得分: '+score+'/'+total+' ('+Math.round(score/total*100)+'%)');return}
  const q=questions[currentQ];
  $('qScore').textContent=score;$('qTotal').textContent=total;$('qAccuracy').textContent=total?Math.round(score/total*100)+'%':'0%';$('qStreak').textContent=streak;
  $('qFlag').textContent=q.flag;$('qFeedback').textContent='';answered=false;

  let options=[],correctAns='';
  if(mode==='capital'){$('qText').textContent=q.name+'的首都是？';correctAns=q.capital;const others=countries.filter(c=>c.capital!==q.capital);options=shuffle(others).slice(0,3).map(c=>c.capital);options.push(correctAns)}
  else if(mode==='flag'){$('qText').textContent='这个国旗属于哪个国家？';correctAns=q.name;const others=countries.filter(c=>c.name!==q.name);options=shuffle(others).slice(0,3).map(c=>c.name);options.push(correctAns)}
  else if(mode==='continent'){$('qText').textContent=q.name+'位于哪个大洲？';correctAns=q.continent;options=['亚洲','欧洲','北美洲','南美洲','非洲','大洋洲'].filter(c=>c!==q.continent).slice(0,3);options.push(correctAns)}
  else{$('qText').textContent=q.name+'的大致位置？';correctAns=q.name;options=[q.name];const others=countries.filter(c=>c.name!==q.name);shuffle(others).slice(0,3).forEach(c=>options.push(c.name))}

  options=shuffle(options);
  $('qOptions').innerHTML=options.map(o=>'<button onclick="checkAnswer(this,\''+o.replace(/'/g,"\\'")+'\',\''+correctAns.replace(/'/g,"\\'")+'\')">'+o+'</button>').join('');
}

function checkAnswer(el,ans,correct){
  if(answered)return;answered=true;total++;
  const btns=$('qOptions').querySelectorAll('button');
  btns.forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('correct')});
  if(ans===correct){score++;streak++;el.classList.add('correct');$('qFeedback').textContent='✅ 正确！';$('qFeedback').style.color='var(--success)'}
  else{streak=0;el.classList.add('wrong');$('qFeedback').textContent='❌ 正确答案是: '+correct;$('qFeedback').style.color='var(--danger)'}
  $('qScore').textContent=score;$('qTotal').textContent=total;$('qAccuracy').textContent=Math.round(score/total*100)+'%';$('qStreak').textContent=streak;
  if(streak>maxStreak)maxStreak=streak;
}

function nextQuestion(){currentQ++;showQuestion()}

function showAllCountries(){
  $('quizArea').classList.add('hidden');$('countryList').classList.remove('hidden');$('infoPanel').classList.remove('show');
  filterCountries();
}

function filterCountries(){
  const q=($('countrySearch').value||'').toLowerCase();
  const list=countries.filter(c=>!q||c.name.includes(q)||c.capital.includes(q)||c.continent.includes(q));
  $('countries').innerHTML=list.map((c,i)=>
    '<div style="display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid var(--border);cursor:pointer" onclick="showInfo('+countries.indexOf(c)+')"><span style="font-size:1.5rem">'+c.flag+'</span><div><strong>'+c.name+'</strong><div style="font-size:.8rem;color:var(--text2)">'+c.capital+' · '+c.continent+'</div></div></div>'
  ).join('');
}

function showInfo(i){
  const c=countries[i];$('infoPanel').className='info-panel show';
  $('infoPanel').innerHTML='<h2>'+c.flag+' '+c.name+'</h2><div class="info-grid"><div class="info-item"><div class="label">首都</div><div class="val">'+c.capital+'</div></div><div class="info-item"><div class="label">大洲</div><div class="val">'+c.continent+'</div></div><div class="info-item"><div class="label">人口</div><div class="val">'+c.pop+'</div></div><div class="info-item"><div class="label">坐标</div><div class="val">'+c.lat.toFixed(1)+'°, '+c.lng.toFixed(1)+'°</div></div></div>';
  $('infoPanel').scrollIntoView({behavior:'smooth'});
}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
