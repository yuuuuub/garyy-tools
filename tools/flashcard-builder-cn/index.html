<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文闪卡构建器</title>
<meta name="description" content="中文闪卡构建器，制作背单词和知识点卡片">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:var(--text);font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-warning{background:var(--yellow);color:#000}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.stat{text-align:center;padding:12px}
.stat-num{font-size:2rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.8rem;color:var(--text2)}
.tag{display:inline-block;padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:.8rem;margin:2px}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.table th{color:var(--text2);font-size:.85rem;font-weight:600}
.table tr:hover{background:rgba(59,130,246,.05)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.hidden{display:none!important}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;white-space:nowrap;color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:var(--text)}
.tab:hover:not(.active){background:var(--border)}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="中文闪卡构建器">
  <meta property="og:description" content="中文闪卡构建器，制作背单词和知识点卡片">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/flashcard-builder-cn/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container" id="app"></div>
<script>
document.title='🃏 中文闪卡构建器';

const APP=document.getElementById('app');
let decks=JSON.parse(localStorage.getItem('fbc_decks')||'[]');
let curDeck=null,curCard=0,flipped=false,studyMode=false;

function save(){localStorage.setItem('fbc_decks',JSON.stringify(decks))}
function render(){
  let h=`<h1>🃏 中文闪卡构建器</h1><p class="subtitle">记忆闪卡，高效学习</p>`;
  if(studyMode&&curDeck!==null){
    let dk=decks[curDeck];
    if(!dk.cards.length){h+=`<div class="card empty">暂无卡片</div><div style="text-align:center"><button class="btn" onclick="studyMode=false;render()">返回</button></div>`}
    else{
      let c=dk.cards[curCard];
      h+=`<div class="card" style="min-height:200px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem;text-align:center" onclick="flipped=!flipped;render()">${flipped?c.back:c.front}</div>`;
      h+=`<div class="flex" style="justify-content:center"><button class="btn btn-sm" onclick="prevCard()">上一张</button><span style="color:var(--text2)">${curCard+1}/${dk.cards.length}</span><button class="btn btn-sm" onclick="nextCard()">下一张</button></div>`;
      h+=`<div style="text-align:center;margin-top:10px"><button class="btn btn-sm btn-warning" onclick="studyMode=false;render()">退出学习</button></div>`;
    }
  } else if(curDeck!==null){
    let dk=decks[curDeck];
    h+=`<div class="card"><div class="flex-between"><button class="btn btn-sm" onclick="curDeck=null;render()">← 返回</button><b>${dk.name}</b><div class="flex"><button class="btn btn-sm" onclick="startStudy()">开始学习</button><button class="btn btn-sm" onclick="addCard()">+ 添加</button></div></div></div>`;
    dk.cards.forEach((c,i)=>{
      h+=`<div class="card"><div class="flex-between"><div><b>正面：</b>${c.front}</div><div class="flex"><button class="btn btn-sm" onclick="editCard(${i})">编辑</button><button class="btn btn-sm btn-danger" onclick="delCard(${i})">删除</button></div></div><p style="color:var(--text2);margin-top:4px"><b>背面：</b>${c.back}</p></div>`;
    });
    if(!dk.cards.length) h+=`<div class="empty">暂无卡片</div>`;
  } else {
    h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">我的卡组</span><button class="btn btn-sm" onclick="newDeck()">+ 新建卡组</button></div></div>`;
    decks.forEach((d,i)=>{
      h+=`<div class="card"><div class="flex-between"><b>${d.name}</b><div class="flex"><button class="btn btn-sm" onclick="openDeck(${i})">进入</button><button class="btn btn-sm btn-danger" onclick="delDeck(${i})">删除</button></div></div><p style="color:var(--text2);font-size:.85rem">${d.cards.length} 张卡片</p></div>`;
    });
    if(!decks.length) h+=`<div class="empty">暂无卡组</div>`;
  }
  APP.innerHTML=h;
}
function newDeck(){let n=prompt('卡组名称：');if(n){decks.push({name:n,cards:[]});save();render()}}
function delDeck(i){if(confirm('确定删除？')){decks.splice(i,1);save();render()}}
function openDeck(i){curDeck=i;curCard=0;flipped=false;render()}
function startStudy(){studyMode=true;curCard=0;flipped=false;render()}
function addCard(){let f=prompt('正面：');if(!f)return;let b=prompt('背面：');if(!b)return;decks[curDeck].cards.push({front:f,back:b});save();render()}
function editCard(i){let c=decks[curDeck].cards[i];let f=prompt('正面：',c.front);if(f===null)return;let b=prompt('背面：',c.back);if(b===null)return;decks[curDeck].cards[i]={front:f,back:b};save();render()}
function delCard(i){if(confirm('删除？')){decks[curDeck].cards.splice(i,1);save();render()}}
function nextCard(){let dk=decks[curDeck];curCard=(curCard+1)%dk.cards.length;flipped=false;render()}
function prevCard(){let dk=decks[curDeck];curCard=(curCard-1+dk.cards.length)%dk.cards.length;flipped=false;render()}
render();

</script>
<script src="../i18n.js" defer></script>
</body>
</html>
