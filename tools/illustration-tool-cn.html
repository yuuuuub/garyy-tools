<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>插画工具 - SVG插画生成器</title>
<meta name="description" content="SVG插画生成工具，创建场景、人物、物体插画，支持动画效果和导出">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<script src="i18n.js" defer></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--text2:#94a3b8;--accent:#d946ef;--accent2:#e879f9;--green:#22c55e;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--accent:#c026d3;--accent2:#d946ef;--green:#16a34a;--red:#dc2626}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);margin:0;overflow:hidden;height:100vh}
.topbar{height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px}
.topbar h1{font-size:1.05rem;margin:0}
.topbar .spacer{flex:1}
.topbar button{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}
.topbar button:hover{border-color:var(--accent)}
.topbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.main{display:flex;height:calc(100vh - 52px)}
.panel{width:220px;background:var(--card);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:10px}
.panel h3{font-size:.7rem;color:var(--text2);padding:10px 0 6px;text-transform:uppercase;letter-spacing:1px}
.panel .item{padding:6px 8px;margin:2px 0;border-radius:6px;font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s}
.panel .item:hover{background:rgba(217,70,239,.1);color:var(--accent)}
.center{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;background:var(--bg)}
#canvasArea{width:600px;height:400px;background:#fff;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.2);position:relative;overflow:hidden}
.right-panel{width:240px;background:var(--card);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:12px}
.right-panel h3{font-size:.7rem;color:var(--text2);margin:0 0 8px;text-transform:uppercase;letter-spacing:1px}
.right-panel label{display:block;font-size:.75rem;color:var(--text2);margin:6px 0 3px}
.right-panel input,.right-panel select{width:100%;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.8rem;box-sizing:border-box}
.right-panel input:focus{outline:none;border-color:var(--accent)}
.color-row{display:flex;gap:4px;flex-wrap:wrap}
.color-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);cursor:pointer}
.color-dot.active{border-color:var(--accent);transform:scale(1.2)}
.layer-item{padding:6px 8px;margin:2px 0;border:1px solid var(--border);border-radius:6px;font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .15s}
.layer-item:hover,.layer-item.active{border-color:var(--accent)}
.layer-item .vis{cursor:pointer;opacity:.6}
.layer-item .vis:hover{opacity:1}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
body{animation:fadeIn .3s ease-out}
</style>
</head>
<body>
<div class="topbar">
  <h1>🎨 插画工具</h1>
  <div class="spacer"></div>
  <button onclick="addShape('circle')">圆形</button>
  <button onclick="addShape('rect')">矩形</button>
  <button onclick="addShape('triangle')">三角</button>
  <button onclick="addShape('star')">星形</button>
  <button onclick="addShape('person')">人物</button>
  <button onclick="addScene('nature')">自然</button>
  <button onclick="addScene('city')">城市</button>
  <button onclick="addScene('abstract')">抽象</button>
  <button onclick="addAnim()">✨ 动画</button>
  <div class="spacer"></div>
  <button onclick="exportSVG()">导出 SVG</button>
  <button onclick="exportPNG()">导出 PNG</button>
  <button onclick="toggleTheme()">🌙</button>
</div>
<div class="main">
  <div class="panel">
    <h3>元素库</h3>
    <div class="item" onclick="addShape('circle')">⭕ 圆形</div>
    <div class="item" onclick="addShape('rect')">⬜ 矩形</div>
    <div class="item" onclick="addShape('triangle')">🔺 三角形</div>
    <div class="item" onclick="addShape('star')">⭐ 星形</div>
    <div class="item" onclick="addShape('heart')">❤️ 心形</div>
    <div class="item" onclick="addShape('diamond')">💎 菱形</div>
    <div class="item" onclick="addShape('person')">👤 人物</div>
    <div class="item" onclick="addShape('tree')">🌳 树</div>
    <div class="item" onclick="addShape('cloud')">☁️ 云</div>
    <div class="item" onclick="addShape('house')">🏠 房子</div>
    <div class="item" onclick="addShape('sun')">☀️ 太阳</div>
    <div class="item" onclick="addShape('moon')">🌙 月亮</div>
    <h3>预设场景</h3>
    <div class="item" onclick="addScene('nature')">🌿 自然场景</div>
    <div class="item" onclick="addScene('city')">🏙️ 城市场景</div>
    <div class="item" onclick="addScene('abstract')">🎨 抽象场景</div>
    <div class="item" onclick="addScene('space')">🚀 太空场景</div>
    <div class="item" onclick="addScene('ocean')">🌊 海洋场景</div>
  </div>
  <div class="center"><div id="canvasArea"><svg id="mainSvg" width="600" height="400" viewBox="0 0 600 400" style="width:100%;height:100%"></svg></div></div>
  <div class="right-panel">
    <h3>图层</h3>
    <div id="layersPanel"></div>
    <h3 style="margin-top:12px">属性</h3>
    <div id="propsPanel" style="font-size:.8rem;color:var(--text2)">选中元素编辑属性</div>
    <h3 style="margin-top:12px">调色板</h3>
    <div class="color-row" id="colorPalette"></div>
    <h3 style="margin-top:12px">背景</h3>
    <input type="color" id="bgColor" value="#ffffff" onchange="setBg(this.value)">
  </div>
</div>
<script>
const svg=document.getElementById('mainSvg');
let layers=[],selIdx=-1,layerId=0;
const colors=['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f43f5e'];

function renderColorPalette(){
  document.getElementById('colorPalette').innerHTML=colors.map(c=>`<div class="color-dot" style="background:${c}" onclick="setColor('${c}')"></div>`).join('');
}

function addShape(type){
  const defs={circle:`<circle cx="100" cy="100" r="50" fill="${colors[layerId%colors.length]}"/>`,
    rect:`<rect x="60" y="60" width="80" height="80" rx="8" fill="${colors[layerId%colors.length]}"/>`,
    triangle:`<polygon points="100,50 150,130 50,130" fill="${colors[layerId%colors.length]}"/>`,
    star:`<polygon points="100,30 115,75 160,80 125,110 135,155 100,135 65,155 75,110 40,80 85,75" fill="${colors[layerId%colors.length]}"/>`,
    heart:`<path d="M100,150 C60,120 20,80 20,50 C20,20 50,10 100,50 C150,10 180,20 180,50 C180,80 140,120 100,150Z" fill="${colors[layerId%colors.length]}"/>`,
    diamond:`<polygon points="100,40 140,100 100,160 60,100" fill="${colors[layerId%colors.length]}"/>`,
    person:`<g><circle cx="100" cy="60" r="25" fill="${colors[layerId%colors.length]}"/><rect x="80" y="85" width="40" height="50" rx="8" fill="${colors[layerId%colors.length]}"/></g>`,
    tree:`<g><rect x="90" y="100" width="20" height="40" fill="#8B4513"/><circle cx="100" cy="70" r="35" fill="#22c55e"/></g>`,
    cloud:`<g><ellipse cx="90" cy="100" rx="40" ry="25" fill="#e2e8f0"/><ellipse cx="120" cy="95" rx="30" ry="20" fill="#e2e8f0"/><ellipse cx="70" cy="95" rx="25" ry="18" fill="#e2e8f0"/></g>`,
    house:`<g><rect x="60" y="80" width="80" height="60" fill="${colors[layerId%colors.length]}"/><polygon points="100,40 50,80 150,80" fill="#1e293b"/><rect x="88" y="105" width="24" height="35" fill="#1e293b"/></g>`,
    sun:`<g><circle cx="100" cy="100" r="30" fill="#eab308"/>${[0,45,90,135,180,225,270,315].map(a=>`<line x1="${100+40*Math.cos(a*Math.PI/180)}" y1="${100+40*Math.sin(a*Math.PI/180)}" x2="${100+55*Math.cos(a*Math.PI/180)}" y2="${100+55*Math.sin(a*Math.PI/180)}" stroke="#eab308" stroke-width="3"/>`).join('')}</g>`,
    moon:`<path d="M100,40 A50,50 0 1,0 100,160 A35,35 0 1,1 100,40Z" fill="#eab308"/>`
  };
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.innerHTML=defs[type]||defs.circle;
  g.setAttribute('transform',`translate(${Math.random()*300+50},${Math.random()*200+50})`);
  g.dataset.id=++layerId;
  g.style.cursor='move';
  g.addEventListener('mousedown',e=>{e.stopPropagation();selIdx=layers.findIndex(l=>l.id==g.dataset.id);renderLayers();makeDraggable(g,e)});
  svg.appendChild(g);
  layers.push({id:layerId,element:g,name:type,color:colors[(layerId-1)%colors.length],visible:true});
  selIdx=layers.length-1;
  renderLayers();renderProps();
}

function addScene(type){
  layers.forEach(l=>l.element.remove());layers=[];layerId=0;selIdx=-1;
  if(type==='nature'){
    svg.innerHTML=`<rect width="600" height="400" fill="#e0f2fe"/><circle cx="500" cy="80" r="40" fill="#eab308"/><ellipse cx="300" cy="350" rx="300" ry="80" fill="#22c55e"/>`;
    addShape('tree');layers[layers.length-1].element.setAttribute('transform','translate(50,280)');
    addShape('tree');layers[layers.length-1].element.setAttribute('transform','translate(200,300)');
    addShape('cloud');layers[layers.length-1].element.setAttribute('transform','translate(100,30)');
    addShape('cloud');layers[layers.length-1].element.setAttribute('transform','translate(350,50)');
  }else if(type==='city'){
    svg.innerHTML=`<rect width="600" height="400" fill="#1e293b"/>`;
    for(let i=0;i<6;i++){const h=80+Math.random()*150;const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=`<rect x="${i*100+10}" y="${400-h}" width="80" height="${h}" fill="${colors[i%colors.length]}" rx="4"/>`;for(let y=0;y<h;y+=25){for(let x=0;x<80;x+=20){g.innerHTML+=`<rect x="${i*100+15+x}" y="${400-h+5+y}" width="12" height="15" fill="#fef3c7" rx="1" opacity="${Math.random()>.3?.8:.2}"/>`}}svg.appendChild(g)}
  }else if(type==='abstract'){
    svg.innerHTML=`<rect width="600" height="400" fill="#0f172a"/>`;
    for(let i=0;i<12;i++){const g=document.createElementNS('http://www.w3.org/2000/svg','g');const shapes=['circle','rect','triangle'];g.innerHTML=`<${shapes[i%3]==='circle'?`circle cx="0" cy="0" r="${20+Math.random()*30}"`:shapes[i%3]==='rect'?`rect x="-25" y="-25" width="${40+Math.random()*30}" height="${40+Math.random()*30}" rx="8"`:`polygon points="0,-30 26,15 -26,15"`} fill="${colors[i%colors.length]}" opacity="0.7"/>`;g.setAttribute('transform',`translate(${Math.random()*580+10},${Math.random()*380+10})`);g.style.cursor='move';svg.appendChild(g);layers.push({id:++layerId,element:g,name:'abstract-'+i,color:colors[i%colors.length],visible:true})}
  }else if(type==='space'){
    svg.innerHTML=`<rect width="600" height="400" fill="#0f172a"/>`;
    for(let i=0;i<50;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',Math.random()*600);c.setAttribute('cy',Math.random()*400);c.setAttribute('r',Math.random()*2);c.setAttribute('fill','#fff');svg.appendChild(c)}
    addShape('moon');layers[layers.length-1].element.setAttribute('transform','translate(400,80)');
    for(let i=0;i<5;i++){addShape('star');layers[layers.length-1].element.setAttribute('transform',`translate(${Math.random()*500+50},${Math.random()*300+50})`)}
  }else if(type==='ocean'){
    svg.innerHTML=`<rect width="600" height="400" fill="#0ea5e9"/><ellipse cx="300" cy="400" rx="400" ry="100" fill="#0284c7"/><ellipse cx="300" cy="400" rx="350" ry="80" fill="#0369a1"/>`;
    addShape('sun');layers[layers.length-1].element.setAttribute('transform','translate(480,60)');
    addShape('cloud');layers[layers.length-1].element.setAttribute('transform','translate(80,40)');
  }
  renderLayers();
}

function renderLayers(){
  document.getElementById('layersPanel').innerHTML=layers.map((l,i)=>`<div class="layer-item ${i===selIdx?'active':''}" onclick="selectLayer(${i})"><span>${l.name} #${l.id}</span><span class="vis" onclick="event.stopPropagation();toggleVis(${i})">${l.visible?'👁':'🚫'}</span></div>`).join('');
}
function selectLayer(i){selIdx=i;renderLayers();renderProps()}
function toggleVis(i){layers[i].visible=!layers[i].visible;layers[i].element.style.display=layers[i].visible?'':'none';renderLayers()}

function renderProps(){
  if(selIdx<0||!layers[selIdx])return;
  const l=layers[selIdx];const el=l.element;const t=el.getAttribute('transform')||'';const m=t.match(/translate\(([^,]+),([^)]+)\)/);
  const x=m?Math.round(+m[1]):0,y=m?Math.round(+m[2]):0;
  document.getElementById('propsPanel').innerHTML=`
    <label>X</label><input type="number" value="${x}" onchange="moveEl(${selIdx},+this.value,null)">
    <label>Y</label><input type="number" value="${y}" onchange="moveEl(${selIdx},null,+this.value)">
    <label>颜色</label><input type="color" value="${l.color}" onchange="setColorForLayer(${selIdx},this.value)">
    <label>名称</label><input type="text" value="${l.name}" onchange="layers[${selIdx}].name=this.value;renderLayers()">
    <button style="margin-top:8px;width:100%;padding:6px;background:var(--red);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:.8rem" onclick="deleteLayer(${selIdx})">删除</button>
  `;
}
function moveEl(i,x,y){const el=layers[i].element;const t=el.getAttribute('transform')||'';const m=t.match(/translate\(([^,]+),([^)]+)\)/);const ox=m?+m[1]:0,oy=m?+m[2]:0;el.setAttribute('transform',`translate(${x??ox},${y??oy})`);renderProps()}
function setColorForLayer(i,c){layers[i].color=c;const el=layers[i].element;const fc=el.querySelector('[fill]');if(fc)fc.setAttribute('fill',c);renderProps()}
function setColor(c){if(selIdx>=0) setColorForLayer(selIdx,c)}
function setBg(c){svg.querySelector('rect')?.setAttribute('fill',c)}
function deleteLayer(i){layers[i].element.remove();layers.splice(i,1);selIdx=-1;renderLayers();document.getElementById('propsPanel').innerHTML='<span style="font-size:.8rem;color:var(--text2)">选中元素编辑属性</span>'}

function makeDraggable(g,e){
  const t=g.getAttribute('transform')||'';const m=t.match(/translate\(([^,]+),([^)]+)\)/);
  const sx=m?+m[1]:0,sy=m?+m[2]:0;const ox=e.clientX,oy=e.clientY;
  const mv=e2=>g.setAttribute('transform',`translate(${sx+(e2.clientX-ox)},${sy+(e2.clientY-oy)})`);
  const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);renderProps()};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
}

function addAnim(){
  const anim=document.createElementNS('http://www.w3.org/2000/svg','animateTransform');
  anim.setAttribute('attributeName','transform');anim.setAttribute('type','rotate');
  anim.setAttribute('from','0 300 200');anim.setAttribute('to','360 300 200');
  anim.setAttribute('dur','10s');anim.setAttribute('repeatCount','indefinite');
  svg.appendChild(anim);
}

function exportSVG(){const clone=svg.cloneNode(true);clone.querySelectorAll('animateTransform').forEach(a=>a.remove());const blob=new Blob([clone.outerHTML],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='illustration.svg';a.click()}
function exportPNG(){const c=document.createElement('canvas');c.width=1200;c.height=800;const ctx=c.getContext('2d');const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='illustration.png';a.click()})};img.src='data:image/svg+xml,'+encodeURIComponent(svg.outerHTML)}
function toggleTheme(){const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t}
renderColorPalette();
</script>
</body>
</html>
