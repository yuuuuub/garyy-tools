<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:900px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.canvas-wrap{display:flex;justify-content:center;overflow:auto;padding:10px 0}
canvas#mainCanvas{cursor:crosshair;border:1px solid var(--border);border-radius:8px;background:#fff;touch-action:none}
.tool-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tool-btn{padding:8px 12px;border-radius:10px;border:2px solid var(--border);background:var(--card-bg);font-size:13px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.tool-btn:hover{border-color:var(--accent)}
.tool-btn.active{border-color:var(--accent);background:var(--tag-bg);box-shadow:0 0 0 2px var(--accent)}
.palette{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.color-cell{width:28px;height:28px;border-radius:6px;border:2px solid transparent;cursor:pointer;transition:all .15s}
.color-cell:hover{transform:scale(1.2)}
.color-cell.active{border-color:var(--text);box-shadow:0 0 0 2px var(--accent)}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.slider-row label{font-size:13px;color:var(--text-secondary);min-width:60px}
.slider-row input[type="range"]{flex:1;accent-color:var(--accent)}
.slider-row span{font-size:13px;color:var(--text-secondary);min-width:30px;text-align:right}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
.layer-item{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--input-bg)}
.layer-item.active{border-color:var(--accent);background:var(--tag-bg)}
.layer-item canvas{border:1px solid var(--border);border-radius:4px;image-rendering:pixelated}
.layer-item .layer-name{flex:1;font-size:13px;cursor:pointer}
.layer-item .layer-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.layer-item .layer-btn:hover{border-color:var(--accent)}
.section-row{display:flex;gap:12px;flex-wrap:wrap}
.section-row .card{flex:1;min-width:260px}
.color-input-wrap{display:flex;align-items:center;gap:8px}
.color-input-wrap input[type="color"]{width:40px;height:32px;border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:2px}
.color-input-wrap input[type="text"]{width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--input-bg);color:var(--text)}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>

<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🎨 画布绘图工具</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="section-row">
    <div class="card" style="flex:2">
      <div class="card-title">🖼️ 画布</div>
      <div class="canvas-wrap"><canvas id="mainCanvas" width="600" height="400"></canvas></div>
    </div>
    <div class="card" style="flex:1">
      <div class="card-title">📑 图层</div>
      <div id="layerList"></div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn btn-outline" onclick="addLayer()">+ 新图层</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🔧 工具</div>
    <div class="tool-bar" id="toolBar"></div>
    <div class="slider-row"><label>画笔大小</label><input type="range" min="1" max="40" value="3" id="brushSize" oninput="document.getElementById('brushSizeVal').textContent=this.value"><span id="brushSizeVal">3</span></div>
    <div class="slider-row"><label>不透明度</label><input type="range" min="1" max="100" value="100" id="opacity" oninput="document.getElementById('opacityVal').textContent=this.value+'%'"><span id="opacityVal">100%</span></div>
  </div>

  <div class="card">
    <div class="card-title">🎨 颜色</div>

      <input type="color" id="customColor" value="#000000" onchange="setColor(this.value)">
      <input type="text" id="colorHex" value="#000000" onchange="setColor(this.value)" placeholder="#000000">
    </div>
    <div class="palette" id="palette"></div>
  </div>

  <div class="card">
    <div class="card-title">⚡ 操作</div>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="undo()">↩️ 撤销</button>
      <button class="btn btn-outline" onclick="redo()">↪️ 重做</button>
      <button class="btn btn-outline" onclick="clearCanvas()">🗑️ 清空</button>
      <button class="btn btn-outline" onclick="toggleGrid()">📏 网格</button>
      <button class="btn btn-primary" onclick="exportPNG()">💾 导出PNG</button>
      <button class="btn btn-primary" onclick="exportJPG()">💾 导出JPG</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📐 画布尺寸</div>
    <div class="slider-row">
      <label>宽度</label><input type="number" id="canvasW" value="600" min="100" max="3000" style="width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--input-bg);color:var(--text)">
      <label>高度</label><input type="number" id="canvasH" value="400" min="100" max="3000" style="width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--input-bg);color:var(--text)">
      <button class="btn btn-outline" onclick="resizeCanvas()" style="margin-left:auto">应用</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">⌨️ 快捷键</div>
    <div style="font-size:13px;color:var(--text-secondary);display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px">
      <span>Ctrl+Z 撤销</span><span>Ctrl+Y 重做</span><span>B 画笔</span><span>E 橡皮擦</span><span>R 矩形</span><span>C 圆形</span><span>L 直线</span><span>A 三角形</span><span>G 填充</span><span>I 吸色</span><span>Ctrl+S 导出PNG</span>
    </div>
  </div>

  <footer>🎨 画布绘图工具 - 在线绘图</footer>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/i18n-js@3/dist/i18n.min.js" defer></script>
<script>
const C=document.getElementById('mainCanvas'),ctx=C.getContext('2d');
let currentTool='brush',currentColor='#000000',brushSize=3,brushOpacity=100;
let layers=[],activeLayerIndex=0,history=[],historyIndex=-1,maxHistory=50;
let isDrawing=false,lastX=0,lastY=0,showGrid=false,gridSize=20;
let startX=0,startY=0,shapeSnapshot=null;

const colors=['#000000','#ffffff','#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#3b82f6','#6366f1','#a855f7','#ec4899','#f43f5e','#6b7280','#374151','#1e293b','#fbbf24','#34d399','#60a5fa','#818cf8','#c084fc','#fb7185','#84cc16','#06b6d4','#8b5cf6','#d946ef','#f59e0b','#10b981','#2563eb','#7c3aed','#db2777'];
const tools=['brush','eraser','rect','circle','line','triangle','arrow','fill','eyedropper'];
const toolIcons={brush:'✏️',eraser:'🧽',rect:'⬜',circle:'⭕',line:'📏',triangle:'🔺',arrow:'➡️',fill:'🪣',eyedropper:'💉'};

function init(){
  addLayer();
  renderPalette();
  renderToolBar();
  saveHistory();
  C.addEventListener('mousedown',onMouseDown);
  C.addEventListener('mousemove',onMouseMove);
  C.addEventListener('mouseup',onMouseUp);
  C.addEventListener('mouseleave',onMouseUp);
  C.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];onMouseDown({clientX:t.clientX,clientY:t.clientY})},{passive:false});
  C.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];onMouseMove({clientX:t.clientX,clientY:t.clientY})},{passive:false});
  C.addEventListener('touchend',()=>onMouseUp());
}

function renderToolBar(){
  const bar=document.getElementById('toolBar');
  bar.innerHTML='';
  tools.forEach(t=>{
    const btn=document.createElement('button');
    btn.className='tool-btn'+(currentTool===t?' active':'');
    btn.textContent=toolIcons[t]+' '+{brush:'画笔',eraser:'橡皮擦',rect:'矩形',circle:'圆形',line:'直线',triangle:'三角形',arrow:'箭头',fill:'填充',eyedropper:'吸色'}[t];
    btn.onclick=()=>{currentTool=t;renderToolBar()};
    bar.appendChild(btn);
  });
}

function renderPalette(){
  const pal=document.getElementById('palette');
  pal.innerHTML='';
  colors.forEach(c=>{
    const d=document.createElement('div');
    d.className='color-cell'+(currentColor===c?' active':'');
    d.style.background=c;
    if(c==='#ffffff')d.style.border='1px solid #ccc';
    d.onclick=()=>setColor(c);
    pal.appendChild(d);
  });
}

function setColor(c){currentColor=c;document.getElementById('customColor').value=c;document.getElementById('colorHex').value=c;renderPalette();}

function addLayer(){
  const oc=document.createElement('canvas');
  oc.width=C.width;oc.height=C.height;
  const octx=oc.getContext('2d');
  layers.push({canvas:oc,ctx:octx,name:'图层'+(layers.length+1),visible:true,opacity:1});
  activeLayerIndex=layers.length-1;
  renderLayers();compositeCanvas();
}

function renderLayers(){
  const list=document.getElementById('layerList');
  list.innerHTML='';
  layers.forEach((l,i)=>{
    const item=document.createElement('div');
    item.className='layer-item'+(i===activeLayerIndex?' active':'');
    const thumb=document.createElement('canvas');
    thumb.width=48;thumb.height=32;
    thumb.getContext('2d').drawImage(l.canvas,0,0,48,32);
    const name=document.createElement('span');
    name.className='layer-name';
    name.textContent=l.name;
    name.onclick=()=>{activeLayerIndex=i;renderLayers()};
    const vis=document.createElement('button');
    vis.className='layer-btn';
    vis.textContent=l.visible?'👁':'🚫';
    vis.onclick=()=>{l.visible=!l.visible;renderLayers();compositeCanvas()};
    const op=document.createElement('input');
    op.type='range';op.min=0;op.max=100;op.value=l.opacity*100;
    op.style.width='50px';op.oninput=()=>{l.opacity=op.value/100;compositeCanvas()};
    const del=document.createElement('button');
    del.className='layer-btn';
    del.textContent='✕';
    del.onclick=()=>{if(layers.length>1){layers.splice(i,1);if(activeLayerIndex>=layers.length)activeLayerIndex=layers.length-1;renderLayers();compositeCanvas()}};
    item.append(thumb,name,vis,op,del);
    list.appendChild(item);
  });
}

function compositeCanvas(){
  ctx.clearRect(0,0,C.width,C.height);
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,C.width,C.height);
  layers.forEach(l=>{
    if(!l.visible)return;
    ctx.globalAlpha=l.opacity;
    ctx.drawImage(l.canvas,0,0);
  });
  ctx.globalAlpha=1;
  if(showGrid)drawGrid();
}

function drawGrid(){
  ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=1;
  for(let x=0;x<=C.width;x+=gridSize){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,C.height);ctx.stroke();}
  for(let y=0;y<=C.height;y+=gridSize){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(C.width,y);ctx.stroke();}
}

function getLayerCtx(){return layers[activeLayerIndex].ctx;}

function onMouseDown(e){
  const rect=C.getBoundingClientRect();
  lastX=e.clientX-rect.left;lastY=e.clientY-rect.top;
  startX=lastX;startY=lastY;
  isDrawing=true;
  const lctx=getLayerCtx();
  lctx.globalAlpha=brushOpacity/100;
  if(currentTool==='fill'){floodFill(Math.round(lastX),Math.round(lastY),currentColor);isDrawing=false;compositeCanvas();saveHistory();return;}
  if(currentTool==='eyedropper'){pickColor(Math.round(lastX),Math.round(lastY));isDrawing=false;return;}
  if(currentTool==='brush'||currentTool==='eraser'){
    lctx.lineCap='round';lctx.lineJoin='round';
    lctx.strokeStyle=currentTool==='eraser'?'#ffffff':currentColor;
    lctx.lineWidth=brushSize;
    lctx.beginPath();lctx.moveTo(lastX,lastY);lctx.lineTo(lastX,lastY);lctx.stroke();
  }
  if(['rect','circle','line','triangle','arrow'].includes(currentTool)){
    shapeSnapshot=lctx.getImageData(0,0,C.width,C.height);
  }
}

function onMouseMove(e){
  if(!isDrawing)return;
  const rect=C.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  const lctx=getLayerCtx();
  lctx.globalAlpha=brushOpacity/100;
  if(currentTool==='brush'||currentTool==='eraser'){
    lctx.lineCap='round';lctx.lineJoin='round';
    lctx.strokeStyle=currentTool==='eraser'?'#ffffff':currentColor;
    lctx.lineWidth=brushSize;
    lctx.beginPath();lctx.moveTo(lastX,lastY);lctx.lineTo(x,y);lctx.stroke();
    lastX=x;lastY=y;compositeCanvas();
  }
  if(['rect','circle','line','triangle','arrow'].includes(currentTool)){
    lctx.putImageData(shapeSnapshot,0,0);
    lctx.strokeStyle=currentColor;lctx.lineWidth=brushSize;lctx.lineCap='round';
    if(currentTool==='rect'){lctx.strokeRect(startX,startY,x-startX,y-startY);}
    else if(currentTool==='circle'){const rx=Math.abs(x-startX)/2,ry=Math.abs(y-startY)/2;lctx.beginPath();lctx.ellipse(startX+((x-startX)/2),startY+((y-startY)/2),rx,ry,0,0,Math.PI*2);lctx.stroke();}
    else if(currentTool==='line'){lctx.beginPath();lctx.moveTo(startX,startY);lctx.lineTo(x,y);lctx.stroke();}
    else if(currentTool==='triangle'){lctx.beginPath();lctx.moveTo((startX+x)/2,startY);lctx.lineTo(x,y);lctx.lineTo(startX,y);lctx.closePath();lctx.stroke();}
    else if(currentTool==='arrow'){lctx.beginPath();lctx.moveTo(startX,startY);lctx.lineTo(x,y);lctx.stroke();const a=Math.atan2(y-startY,x-startX);const hl=12;lctx.beginPath();lctx.moveTo(x,y);lctx.lineTo(x-hl*Math.cos(a-Math.PI/6),y-hl*Math.sin(a-Math.PI/6));lctx.moveTo(x,y);lctx.lineTo(x-hl*Math.cos(a+Math.PI/6),y-hl*Math.sin(a+Math.PI/6));lctx.stroke();}
    compositeCanvas();
  }
}

function onMouseUp(){
  if(!isDrawing)return;
  isDrawing=false;
  const lctx=getLayerCtx();lctx.globalAlpha=1;
  shapeSnapshot=null;
  saveHistory();compositeCanvas();
}

function floodFill(sx,sy,fillColor){
  const lctx=getLayerCtx();
  const imgData=lctx.getImageData(0,0,C.width,C.height);
  const data=imgData.data;
  const w=C.width,h=C.height;
  const idx=(y,x)=>(y*w+x)*4;
  const sr=data[idx(sy,sx)],sg=data[idx(sy,sx)+1],sb=data[idx(sy,sx)+2],sa=data[idx(sy,sx)+3];
  const fc=hexToRgb(fillColor);
  if(sr===fc.r&&sg===fc.g&&sb===fc.b&&sa===255)return;
  const stack=[[sx,sy]];
  const visited=new Set();
  while(stack.length){
    const[cx,cy]=stack.pop();
    if(cx<0||cx>=w||cy<0||cy>=h)continue;
    const key=cy*w+cx;
    if(visited.has(key))continue;
    visited.add(key);
    const i=idx(cy,cx);
    if(Math.abs(data[i]-sr)>2||Math.abs(data[i+1]-sg)>2||Math.abs(data[i+2]-sb)>2||Math.abs(data[i+3]-sa)>2)continue;
    data[i]=fc.r;data[i+1]=fc.g;data[i+2]=fc.b;data[i+3]=255;
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  lctx.putImageData(imgData,0,0);
}

function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b};}

function pickColor(x,y){
  const lctx=getLayerCtx();
  const d=lctx.getImageData(x,y,1,1).data;
  const hex='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
  setColor(hex);showToast('已取色: '+hex);
}

function saveHistory(){
  const state=layers.map(l=>l.canvas.toDataURL());
  history=history.slice(0,historyIndex+1);
  history.push({data:state,index:activeLayerIndex});
  if(history.length>maxHistory)history.shift();
  historyIndex=history.length-1;
}

function undo(){
  if(historyIndex<=0)return;
  historyIndex--;
  restoreHistory(history[historyIndex]);
}
function redo(){
  if(historyIndex>=history.length-1)return;
  historyIndex++;
  restoreHistory(history[historyIndex]);
}

function restoreHistory(state){
  layers=[];
  state.data.forEach((d,i)=>{
    const oc=document.createElement('canvas');
    oc.width=C.width;oc.height=C.height;
    const img=new Image();
    img.onload=()=>{const octx=oc.getContext('2d');octx.drawImage(img,0,0);layers[i].ctx=octx;compositeCanvas();};
    img.src=d;
    layers.push({canvas:oc,ctx:oc.getContext('2d'),name:'图层'+(i+1),visible:true,opacity:1});
  });
  activeLayerIndex=state.index;
  setTimeout(()=>{renderLayers();compositeCanvas();},100);
}

function clearCanvas(){
  getLayerCtx().clearRect(0,0,C.width,C.height);
  compositeCanvas();saveHistory();showToast('已清空画布');
}

function toggleGrid(){
  showGrid=!showGrid;compositeCanvas();showToast(showGrid?'网格已开启':'网格已关闭');
}

function resizeCanvas(){
  const w=parseInt(document.getElementById('canvasW').value)||600;
  const h=parseInt(document.getElementById('canvasH').value)||400;
  const tempCanvas=document.createElement('canvas');
  tempCanvas.width=C.width;tempCanvas.height=C.height;
  tempCanvas.getContext('2d').drawImage(C,0,0);
  C.width=w;C.height=h;
  layers.forEach(l=>{const tc=document.createElement('canvas');tc.width=w;tc.height=h;const tctx=tc.getContext('2d');tctx.drawImage(l.canvas,0,0);l.canvas=tc;l.ctx=tctx;});
  compositeCanvas();saveHistory();showToast('画布已调整为 '+w+'x'+h);
}

function exportPNG(){
  compositeCanvas();
  const link=document.createElement('a');
  link.download='画布绘图_'+Date.now()+'.png';
  link.href=C.toDataURL('image/png');
  link.click();showToast('已导出PNG');
}

function exportJPG(){
  compositeCanvas();
  const link=document.createElement('a');
  link.download='画布绘图_'+Date.now()+'.jpg';
  link.href=C.toDataURL('image/jpeg',0.92);
  link.click();showToast('已导出JPG');
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function toggleTheme(){
  const d=document.documentElement;
  d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';
  document.querySelector('.theme-toggle').textContent=d.dataset.theme==='dark'?'☀️':'🌙';
}

document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey){
    if(e.key==='z'){e.preventDefault();undo();}
    if(e.key==='y'){e.preventDefault();redo();}
    if(e.key==='s'){e.preventDefault();exportPNG();}
  }
  if(!e.ctrlKey&&!e.metaKey){
    const m={b:'brush',e:'eraser',r:'rect',c:'circle',l:'line',a:'triangle',g:'fill',i:'eyedropper'};
    if(m[e.key]){currentTool=m[e.key];renderToolBar();}
  }
});

init();
</script>
</body>
</html>
