<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大小写转换器</title><meta name="description" content="大小写转换器 - 在线文本大小写转换工具"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn-secondary{background:var(--border);color:var(--text)}.btn-secondary:hover{opacity:.85}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}</style><meta property="og:title" content="大小写转换器"><meta property="og:description" content="大小写转换器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔄 大小写转换器</h1><p class="sub">在线文本大小写转换工具</p>
<div class="card"><div class="label">输入文本</div>
<textarea id="inputText" placeholder="输入要转换的文本..."></textarea>
<div class="btn-group">
<button class="btn" onclick="convert('upper')">全部大写</button>
<button class="btn" onclick="convert('lower')">全部小写</button>
<button class="btn" onclick="convert('title')">标题大小写</button>
<button class="btn" onclick="convert('sentence')">句首大写</button>
<button class="btn" onclick="convert('toggle')">大小写反转</button>
<button class="btn" onclick="convert('camel')">驼峰命名</button>
<button class="btn" onclick="convert('pascal')">帕斯卡命名</button>
<button class="btn" onclick="convert('snake')">蛇形命名</button>
<button class="btn" onclick="convert('kebab')">短横线命名</button>
<button class="btn" onclick="convert('constant')">常量命名</button>
<button class="btn" onclick="convert('dot')">点式命名</button>
<button class="btn" onclick="convert('path')">路径命名</button>
</div></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function convert(type){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var result='';
  switch(type){
    case 'upper':result=text.toUpperCase();break;
    case 'lower':result=text.toLowerCase();break;
    case 'title':result=text.replace(/\w\S*/g,function(txt){return txt.charAt(0).toUpperCase()+txt.substr(1).toLowerCase();});break;
    case 'sentence':result=text.charAt(0).toUpperCase()+text.slice(1).toLowerCase();break;
    case 'toggle':result=text.split('').map(function(c){return c===c.toUpperCase()?c.toLowerCase():c.toUpperCase();}).join('');break;
    case 'camel':result=text.replace(/[-_\s]+(.)?/g,function(_,c){return c?c.toUpperCase():''}).replace(/^(.)/,function(_,c){return c.toLowerCase();});break;
    case 'pascal':result=text.replace(/[-_\s]+(.)?/g,function(_,c){return c?c.toUpperCase():''}).replace(/^(.)/,function(_,c){return c.toUpperCase();});break;
    case 'snake':result=text.replace(/[-.\s]+/g,'_').replace(/([A-Z])/g,'_$1').toLowerCase().replace(/^_/,'');break;
    case 'kebab':result=text.replace(/[-.\s]+/g,'-').replace(/([A-Z])/g,'-$1').toLowerCase().replace(/^-/,'');break;
    case 'constant':result=text.replace(/[-.\s]+/g,'_').replace(/([a-z])/g,'_$1').toUpperCase().replace(/^_/,'');break;
    case 'dot':result=text.replace(/[-_\s]+/g,'.').replace(/([A-Z])/g,'.$1').toLowerCase().replace(/^\./,'');break;
    case 'path':result=text.replace(/[-.\s]+/g,'/').replace(/([A-Z])/g,'/$1').toLowerCase().replace(/^\//,'');break;
  }
  r.innerHTML='<div class="card"><div class="section"><h3>📋 转换结果</h3><div class="result-block" id="resultText">'+escapeHtml(result)+'</div><button class="copy-btn" onclick="copyResult()">复制结果</button></div></div>';
}
function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyResult(){
  var text=document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
</script></body></html>
