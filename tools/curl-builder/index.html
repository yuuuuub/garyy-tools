<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cURL 命令生成器 | curl Builder</title>
<meta property="og:title" content="cURL 命令生成器 | curl Builder">
<meta property="og:description" content="可视化构建curl命令，支持GET/POST/PUT/DELETE等">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线curl命令生成器，可视化构建HTTP请求命令">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<script src="i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5scroll-behavior:smooth;}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.main{max-width:1000px;margin:0 auto;padding:20px 24px}
.card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:1rem;margin-bottom:12px;color:var(--text)}
.form-row{display:flex;gap:12px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.form-row label{font-size:.85rem;color:var(--text-secondary);min-width:80px}
.form-row input,.form-row select,.form-row textarea{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.85rem;outline:none}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--accent)}
.form-row select option{background:var(--bg-secondary)}
.form-row textarea{min-height:80px;resize:vertical;font-family:'Fira Code',Consolas,monospace;font-size:.8rem;line-height:1.5}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.kv-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.kv-row input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.8rem;outline:none}
.kv-row input:focus{border-color:var(--accent)}
.kv-row .remove-btn{padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--red);cursor:pointer;font-size:.8rem}
.kv-row .remove-btn:hover{background:var(--red-bg)}
.add-row-btn{padding:6px 12px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text-secondary);cursor:pointer;font-size:.8rem;width:100%;margin-top:4px}
.add-row-btn:hover{border-color:var(--accent);color:var(--accent)}
.output-section{position:relative}
.output{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.7;white-space:pre-wrap;word-break:break-all;min-height:120px;color:var(--cyan)}
.output-actions{display:flex;gap:8px;margin-bottom:8px}
.flag-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.flag-item{display:flex;align-items:center;gap:4px;padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:20px;font-size:.75rem;cursor:pointer;transition:var(--transition)}
.flag-item:hover{border-color:var(--accent)}
.flag-item.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.flag-item input[type="checkbox"]{display:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<header class="app-header">
<div>
<h1>📋 cURL 命令生成器</h1>
<span class="subtitle">可视化构建 curl 命令</span>
</div>
<button class="btn" onclick="resetAll()">重置</button>
</header>
<div class="main">
<div class="card">
<h2>请求配置</h2>
<div class="form-row">
<label>方法</label>
<select id="method">
<option value="GET">GET</option>
<option value="POST">POST</option>
<option value="PUT">PUT</option>
<option value="PATCH">PATCH</option>
<option value="DELETE">DELETE</option>
<option value="HEAD">HEAD</option>
<option value="OPTIONS">OPTIONS</option>
</select>
</div>
<div class="form-row">
<label>URL</label>
<input id="url" placeholder="https://api.example.com/endpoint" oninput="generate()">
</div>
</div>

<div class="card">
<h2>Headers</h2>
<div id="headersList"></div>
<button class="add-row-btn" onclick="addHeader()">+ 添加 Header</button>
</div>

<div class="card">
<h2>请求体</h2>
<div class="form-row">
<label>类型</label>
<select id="bodyType" onchange="onBodyTypeChange()">
<option value="none">无</option>
<option value="json">JSON</option>
<option value="form">Form Data</option>
<option value="raw">Raw</option>
</select>
</div>
<textarea id="bodyContent" placeholder='{"key": "value"}' style="display:none" oninput="generate()"></textarea>
</div>

<div class="card">
<h2>选项</h2>
<div class="flag-list" id="flagList"></div>
</div>

<div class="card output-section">
<h2>生成的命令</h2>
<div class="output-actions">
<button class="btn btn-primary" onclick="copyCommand()">📋 复制命令</button>
<button class="btn" onclick="copyAsScript()">📄 复制为脚本</button>
</div>
<div class="output" id="output">curl https://api.example.com/endpoint</div>
</div>
</div>

<script>
let headers=[{k:'Content-Type',v:'application/json'},{k:'Accept',v:'application/json'}];
const FLAGS=[
  {id:'insecure',flag:'-k',label:'忽略SSL (-k)',checked:false},
  {id:'verbose',flag:'-v',label:'详细输出 (-v)',checked:false},
  {id:'follow',flag:'-L',label:'跟随重定向 (-L)',checked:false},
  {id:'compressed',flag:'--compressed',label:'压缩 (--compressed)',checked:false},
  {id:'noproxy',flag:'--noproxy *',label:'不使用代理',checked:false},
  {id:'maxtime',flag:'--max-time 30',label:'超时30秒',checked:false},
  {id:'retry',flag:'--retry 3',label:'重试3次',checked:false},
];

function renderHeaders(){
  const el=document.getElementById('headersList');
  el.innerHTML=headers.map((h,i)=>`
    <div class="kv-row">
      <input placeholder="Key" value="${esc(h.k)}" oninput="headers[${i}].k=this.value;generate()">
      <input placeholder="Value" value="${esc(h.v)}" oninput="headers[${i}].v=this.value;generate()">
      <button class="remove-btn" onclick="removeHeader(${i})">×</button>
    </div>`).join('');
}

function addHeader(){headers.push({k:'',v:''});renderHeaders();generate()}
function removeHeader(i){headers.splice(i,1);renderHeaders();generate()}

function renderFlags(){
  const el=document.getElementById('flagList');
  el.innerHTML=FLAGS.map((f,i)=>`
    <label class="flag-item ${f.checked?'active':''}" onclick="toggleFlag(${i})">
      <input type="checkbox" ${f.checked?'checked':''}>
      ${f.label}
    </label>`).join('');
}

function toggleFlag(i){
  FLAGS[i].checked=!FLAGS[i].checked;
  renderFlags();
  generate();
}

function onBodyTypeChange(){
  const type=document.getElementById('bodyType').value;
  const textarea=document.getElementById('bodyContent');
  textarea.style.display=type==='none'?'none':'block';
  if(type==='json')textarea.placeholder='{"key": "value"}';
  else if(type==='form')textarea.placeholder='key1=value1&key2=value2';
  else textarea.placeholder='原始请求体内容';
  generate();
}

function generate(){
  const method=document.getElementById('method').value;
  const url=document.getElementById('url').value.trim()||'https://api.example.com/endpoint';
  const bodyType=document.getElementById('bodyType').value;
  const bodyContent=document.getElementById('bodyContent').value.trim();

  let cmd='curl';

  if(method!=='GET') cmd+=` -X ${method}`;

  headers.forEach(h=>{
    if(h.k) cmd+=` -H '${esc(h.k)}: ${esc(h.v)}'`;
  });

  FLAGS.forEach(f=>{
    if(f.checked) cmd+=` ${f.flag}`;
  });

  if(bodyType!=='none'&&bodyContent){
    if(bodyType==='json'){
      cmd+=` -d '${esc(bodyContent)}'`;
    }else if(bodyType==='form'){
      bodyContent.split('&').forEach(pair=>{
        const [k,v]=pair.split('=');
        if(k) cmd+=` -F '${esc(k)}=${esc(v||'')}'`;
      });
    }else{
      cmd+=` -d '${esc(bodyContent)}'`;
    }
  }

  cmd+=` '${esc(url)}'`;

  document.getElementById('output').textContent=cmd;
}

function copyCommand(){
  const text=document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(()=>showToast('已复制命令','success'));
}

function copyAsScript(){
  const cmd=document.getElementById('output').textContent;
  const script='#!/bin/bash\n'+cmd+'\n';
  navigator.clipboard.writeText(script).then(()=>showToast('已复制为脚本','success'));
}

function resetAll(){
  document.getElementById('method').value='GET';
  document.getElementById('url').value='';
  document.getElementById('bodyType').value='none';
  document.getElementById('bodyContent').value='';
  document.getElementById('bodyContent').style.display='none';
  headers=[{k:'Content-Type',v:'application/json'},{k:'Accept',v:'application/json'}];
  FLAGS.forEach(f=>f.checked=false);
  renderHeaders();
  renderFlags();
  generate();
}

function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"'\\''")}

function showToast(msg,type='success'){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:.85rem;font-weight:500;z-index:99999;transition:opacity .3s;background:var(--green);color:#fff';
  if(type==='error')t.style.background='var(--red)';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2000);
}

renderHeaders();
renderFlags();
generate();
</script>
</body>
</html>
