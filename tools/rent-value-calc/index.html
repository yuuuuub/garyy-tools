<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 租房性价比计算器</title>
<meta name="description" content="租房性价比计算器，评估租房是否划算">
<style>
:root {--bg: #f8f6f2;
--card: #ffffff;
--text: #2d2420;
--text-secondary: #8a7a6e;
--accent: #e07b39;
--accent-light: #fdf0e5;
--border: #e8ddd3;
--shadow: 0 4px 24px rgba(120, 80, 40, 0.08);
--green: #5da04e;
--yellow: #e2a62e;
--orange: #e07b39;
--red: #d94646;
--bg-tag: #f5ede4;
--input-bg: #faf8f5;
--bar-bg: #efe7de}
.dark {--bg: #1a1512;
--card: #2a221c;
--text: #e8d5c4;
--text-secondary: #b09a82;
--accent: #f09050;
--accent-light: #3d2214;
--border: #3d3028;
--shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
--bg-tag: #3d3028;
--input-bg: #24201a;
--bar-bg: #3d3028}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
transition: background 0.3s, color 0.3s;
-webkit-tap-highlight-color: transparent}
.container {width: 100%;
max-width: 480px;
padding: 20px 16px 40px}
.header {text-align: center;
padding: 24px 0 16px}
.header h1 {font-size: 28px;
font-weight: 700;
letter-spacing: 0.5px}
.header .subtitle {font-size: 14px;
color: var(--text-secondary);
margin-top: 4px}
.theme-toggle {position: absolute;
top: 16px;
right: 16px;
width: 40px;
height: 40px;
border-radius: 50%;
border: 1px solid var(--border);
background: var(--card);
font-size: 20px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.2s;
z-index: 10}
.theme-toggle:hover { background: var(--accent-light); }
.card {background: var(--card);
border-radius: 16px;
padding: 20px;
margin-bottom: 16px;
box-shadow: var(--shadow);
border: 1px solid var(--border)}
.card-title {font-size: 16px;
font-weight: 600;
margin-bottom: 14px;
display: flex;
align-items: center;
gap: 8px}
.input-group { margin-bottom: 14px; }
.input-group:last-child { margin-bottom: 0; }
.input-group label {display: block;
font-size: 13px;
color: var(--text-secondary);
margin-bottom: 6px;
font-weight: 500}
.input-row {display: flex;
align-items: center;
gap: 8px}
.input-row input {flex: 1;
padding: 12px 14px;
border: 1.5px solid var(--border);
border-radius: 10px;
font-size: 16px;
background: var(--input-bg);
color: var(--text);
transition: border-color 0.2s;
font-family: inherit;
min-width: 0}
.input-row input:focus { outline: none; border-color: var(--accent); }
.input-row .unit {font-size: 14px;
color: var(--text-secondary);
white-space: nowrap;
min-width: 40px}
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.preset-row {display: flex;
gap: 8px;
flex-wrap: wrap;
margin-top: 8px}
.preset-btn {padding: 6px 14px;
border: 1px solid var(--border);
border-radius: 20px;
background: var(--bg);
color: var(--text-secondary);
font-size: 12px;
cursor: pointer;
transition: all 0.2s;
font-family: inherit}
.preset-btn:hover { border-color: var(--accent); color: var(--accent); }
.preset-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.result-card {background: linear-gradient(135deg, #e07b39, #f0a060);
color: #fff;
border-radius: 16px;
padding: 24px;
margin-bottom: 16px;
box-shadow: 0 8px 32px rgba(224, 123, 57, 0.25)}
.result-big {text-align: center;
margin-bottom: 16px}
.result-number {font-size: 48px;
font-weight: 800;
line-height: 1}
.result-unit {font-size: 16px;
opacity: 0.85}
.result-row {display: flex;
justify-content: space-around;
text-align: center;
padding: 12px 0;
border-top: 1px solid rgba(255,255,255,0.2)}
.result-row .item { flex: 1; }
.result-row .val { font-size: 20px; font-weight: 700; }
.result-row .lbl { font-size: 11px; opacity: 0.8; margin-top: 2px; }
.grade-badge {display: inline-flex;
align-items: center;
gap: 8px;
padding: 12px 24px;
border-radius: 12px;
font-weight: 700;
font-size: 18px;
margin-top: 12px}
.grade-super { background: #e8f5e3; color: #3d8b37; }
.grade-good { background: #e8fdf5; color: #2ea87a; }
.grade-ok { background: #fef6e7; color: #e2a62e; }
.grade-bad { background: #fef0e7; color: #e07b39; }
.grade-terrible { background: #fde8e8; color: #d94646; }
.dark .grade-super { background: #1e321a; color: #7ec970; }
.dark .grade-good { background: #1a3228; color: #5ec89a; }
.dark .grade-ok { background: #3d2e14; color: #f0c050; }
.dark .grade-bad { background: #3d2214; color: #f09050; }
.dark .grade-terrible { background: #3d1a1a; color: #f06060; }
.ratio-bar-outer {height: 10px;
background: var(--bar-bg);
border-radius: 5px;
margin-top: 10px;
overflow: hidden}
.ratio-bar-inner {height: 100%;
border-radius: 5px;
transition: width 0.4s ease, background 0.4s ease}
.detail-item {display: flex;
align-items: center;
gap: 12px;
padding: 10px 0}
.detail-item + .detail-item { border-top: 1px solid var(--border); }
.detail-icon { font-size: 24px; width: 36px; text-align: center; }
.detail-text { flex: 1; font-size: 14px; }
.detail-val { font-weight: 700; color: var(--accent); font-size: 16px; }
.suggestion-card {background: var(--accent-light);
border-radius: 16px;
padding: 16px 20px;
margin-bottom: 16px;
border-left: 4px solid var(--accent);
font-size: 14px;
line-height: 1.6}
.suggestion-card .sug-icon { font-size: 20px; margin-right: 6px; }
.ref-table {width: 100%;
font-size: 13px;
border-collapse: collapse}
.ref-table th, .ref-table td {padding: 8px 10px;
text-align: left;
border-bottom: 1px solid var(--border)}
.ref-table th {color: var(--text-secondary);
font-weight: 500;
font-size: 12px}
.ref-table td:last-child { text-align: right; font-weight: 600; }
.ref-table .highlight { color: var(--accent); }
@media (max-width: 360px) {.container { padding: 12px 10px 30px; }
.header h1 { font-size: 24px; }
.result-number { font-size: 40px; }}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🏠 租房性价比计算器">
  <meta property="og:description" content="租房性价比计算器，评估租房是否划算">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/rent-value-calc/">
</head>
<body>

<div class="container">
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">🌙</button>

  <div class="header">
    <h1>🏠 租房性价比计算器</h1>
    <div class="subtitle">房租值不值，一算就知道</div>
  </div>


  <div class="card">
    <div class="card-title">📝 填写租房信息</div>

    <div class="input-group">
      <label>💰 月租金（元）</label>
      <div class="input-row">
        <input type="number" id="rent" value="4000" min="0" step="100" oninput="calc()" placeholder="例如 4000">
        <span class="unit">元/月</span>
      </div>
    </div>

    <div class="input-group">
      <label>🔐 押金（几个月）</label>
      <div class="input-row">
        <input type="number" id="deposit" value="1" min="1" max="6" step="1" oninput="calc()" placeholder="通常 1-3 个月">
        <span class="unit">个月</span>
      </div>
      <div class="preset-row" id="depositPresets"></div>
    </div>

    <div class="input-group">
      <label>🚇 通勤时间（单程，分钟）</label>
      <div class="input-row">
        <input type="number" id="commute" value="40" min="0" max="180" step="5" oninput="calc()">
        <span class="unit">分钟</span>
      </div>
      <div class="preset-row" id="commutePresets"></div>
    </div>

    <div class="input-group">
      <label>📐 房屋面积（平米）</label>
      <div class="input-row">
        <input type="number" id="area" value="30" min="5" max="500" step="1" oninput="calc()">
        <span class="unit">m²</span>
      </div>
    </div>

    <div class="input-group">
      <label>💵 月薪（税前，元）</label>
      <div class="input-row">
        <input type="number" id="salary" value="15000" min="0" step="500" oninput="calc()">
        <span class="unit">元/月</span>
      </div>
      <div class="preset-row" id="salaryPresets"></div>
    </div>

    <div class="input-group">
      <label>⏱️ 每天工作时长</label>
      <div class="input-row">
        <input type="number" id="workHours" value="8" min="4" max="16" step="0.5" oninput="calc()">
        <span class="unit">小时</span>
      </div>
      <div class="preset-row" id="workHoursPresets"></div>
    </div>
  </div>


  <div id="resultSection"></div>


  <div class="card">
    <div class="card-title">🏙️ 主要城市平均租金参考（元/m²/月）</div>
    <table class="ref-table">
      <thead>
        <tr><th>城市</th><th>市中心</th><th>近郊</th><th>远郊</th></tr>
      </thead>
      <tbody>
        <tr><td>北京</td><td class="highlight">120-180</td><td>80-110</td><td>40-70</td></tr>
        <tr><td>上海</td><td class="highlight">110-170</td><td>75-105</td><td>38-65</td></tr>
        <tr><td>深圳</td><td class="highlight">100-160</td><td>70-100</td><td>35-60</td></tr>
        <tr><td>广州</td><td>80-130</td><td>50-80</td><td>25-45</td></tr>
        <tr><td>杭州</td><td>70-120</td><td>45-70</td><td>25-40</td></tr>
        <tr><td>成都</td><td>50-90</td><td>30-55</td><td>15-30</td></tr>
        <tr><td>南京</td><td>55-95</td><td>35-60</td><td>18-32</td></tr>
        <tr><td>武汉</td><td>40-75</td><td>25-45</td><td>12-25</td></tr>
      </tbody>
    </table>
    <div style="text-align:center; font-size:12px; color:var(--text-secondary); margin-top:12px;">
      📌 数据为2024-2025年市场参考值，整租一居/开间
    </div>
  </div>
</div>

<script>
const WORK_DAYS_PER_MONTH = 22;
function renderPresets(containerId, options, currentVal) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = options.map(o => {
    const active = o.value === currentVal ? ' active' : '';
    return `<button class="preset-btn${active}" onclick="setPreset(event, '${o.targetId}', ${o.value})">${o.label}</button>`;
  }).join('');
}
function setPreset(e, targetId, value) {
  const input = document.getElementById(targetId);
  input.value = value;
  const container = e.target.parentElement;
  container.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  calc();
}
function calc() {
  const rent = parseFloat(document.getElementById('rent').value) || 0;
  const deposit = parseFloat(document.getElementById('deposit').value) || 1;
  const commute = parseFloat(document.getElementById('commute').value) || 0;
  const area = parseFloat(document.getElementById('area').value) || 1;
  const salary = parseFloat(document.getElementById('salary').value) || 1;
  const workHours = parseFloat(document.getElementById('workHours').value) || 8;
  const rentPerSqm = area > 0 ? (rent / area) : 0;
  const rentRatio = salary > 0 ? (rent / salary * 100) : 0;
  const dailyCommuteHours = commute * 2 / 60;
  const monthlyCommuteHours = dailyCommuteHours * WORK_DAYS_PER_MONTH;
  const hourlyRate = salary / (WORK_DAYS_PER_MONTH * workHours);
  const commuteCost = monthlyCommuteHours * hourlyRate;
  const realCost = rent + commuteCost;
  const firstPayment = rent * (deposit + 1);
  let gradeIcon, gradeLabel, gradeClass, barColor;
  if (rentRatio <= 15) {
    gradeIcon = '🏆'; gradeLabel = '超值'; gradeClass = 'grade-super';
    barColor = '#5da04e';
  } else if (rentRatio <= 25) {
    gradeIcon = '😊'; gradeLabel = '合理'; gradeClass = 'grade-good';
    barColor = '#2ea87a';
  } else if (rentRatio <= 30) {
    gradeIcon = '😐'; gradeLabel = '勉强'; gradeClass = 'grade-ok';
    barColor = '#e2a62e';
  } else if (rentRatio <= 40) {
    gradeIcon = '😰'; gradeLabel = '贵了'; gradeClass = 'grade-bad';
    barColor = '#e07b39';
  } else {
    gradeIcon = '💀'; gradeLabel = '割韭菜'; gradeClass = 'grade-terrible';
    barColor = '#d94646';
  }
  const barPct = Math.min(rentRatio / 50 * 100, 100);
  let suggestionHTML = '';
  if (rentRatio > 25 && commute > 0) {
    const savedRent = rent * 0.20;
    const extraCommuteHours = (10 * 2 / 60) * WORK_DAYS_PER_MONTH;
    suggestionHTML = `
      <div class="suggestion-card">
        <span class="sug-icon">💡</span>
        <strong>建议：</strong>你可以考虑搬远一点，每月通勤多花约 <strong>${extraCommuteHours.toFixed(1)} 小时</strong>，
        能节省大约 <strong>¥${savedRent.toFixed(0)}</strong>/月。
        <br>需要在 <em>省租金</em> 和 <em>省时间</em> 之间找到最适合你的平衡点。
      </div>`;
  } else if (rentRatio > 25) {
    suggestionHTML = `
      <div class="suggestion-card">
        <span class="sug-icon">💡</span>
        <strong>建议：</strong>租金占工资比例偏高，可以考虑合租、搬至近郊
        或寻找性价比更高的房源来降低租房压力。
      </div>`;
  } else if (commute > 60) {
    const savedCommuteRent = rent * 0.15;
    suggestionHTML = `
      <div class="suggestion-card">
        <span class="sug-icon">💡</span>
        <strong>建议：</strong>你目前通勤时间较长。如果愿意多花约
        <strong>¥${savedCommuteRent.toFixed(0)}</strong>/月，可以住得离公司更近，
        每月节省大量通勤时间，改善生活质量。
      </div>`;
  }
  const section = document.getElementById('resultSection');
  section.innerHTML = `

    <div class="result-card">
      <div class="result-big">
        <div style="font-size:14px;opacity:0.85;margin-bottom:4px;">💸 每月租房真实代价</div>
        <div class="result-number">¥${realCost.toFixed(0)}</div>
        <div class="result-unit">元/月（含通勤机会成本）</div>
      </div>
      <div class="result-row">
        <div class="item"><div class="val">${rentRatio.toFixed(1)}%</div><div class="lbl">租金占比</div></div>
        <div class="item"><div class="val">¥${rentPerSqm.toFixed(0)}</div><div class="lbl">每平米</div></div>
        <div class="item"><div class="val">¥${commuteCost.toFixed(0)}</div><div class="lbl">通勤成本</div></div>
      </div>
    </div>

    <div class="card" style="text-align:center;">
      <div class="card-title">🏅 租房性价比评分</div>
      <span class="grade-badge ${gradeClass}">${gradeIcon} ${gradeLabel}</span>
      <div style="margin-top:12px;font-size:14px;">租金占工资 <strong>${rentRatio.toFixed(1)}%</strong>（建议 ≤30%）</div>
      <div class="ratio-bar-outer">
        <div class="ratio-bar-inner" style="width:${barPct}%;background:${barColor};"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);margin-top:4px;">
        <span>0%</span><span>15% 超值</span><span>25% 合理</span><span>30% 勉强</span><span>40% 贵了</span><span>50%+</span>
      </div>
    </div>
    ${suggestionHTML}

    <div class="card">
      <div class="card-title">📊 详细明细</div>
      <div class="detail-item">
        <div class="detail-icon">💰</div>
        <div class="detail-text">月租金</div>
        <div class="detail-val">¥${rent.toFixed(0)}</div>
      </div>
      <div class="detail-item">
        <div class="detail-icon">📐</div>
        <div class="detail-text">每平米租金</div>
        <div class="detail-val">¥${rentPerSqm.toFixed(1)}/m²</div>
      </div>
      <div class="detail-item">
        <div class="detail-icon">🚇</div>
        <div class="detail-text">每日通勤时间（往返）</div>
        <div class="detail-val">${(commute * 2).toFixed(0)} 分钟</div>
      </div>
      <div class="detail-item">
        <div class="detail-icon">⏱️</div>
        <div class="detail-text">每月通勤总时长</div>
        <div class="detail-val">${monthlyCommuteHours.toFixed(1)} 小时</div>
      </div>
      <div class="detail-item">
        <div class="detail-icon">🕐</div>
        <div class="detail-text">你的时薪</div>
        <div class="detail-val">¥${hourlyRate.toFixed(1)}</div>
      </div>
      <div class="detail-item">
        <div class="detail-icon">💸</div>
        <div class="detail-text">通勤机会成本</div>
        <div class="detail-val">¥${commuteCost.toFixed(0)}/月</div>
      </div>
      <div class="detail-item">
        <div class="detail-icon">🏠</div>
        <div class="detail-text">首次支付（押${deposit}付1）</div>
        <div class="detail-val">¥${firstPayment.toFixed(0)}</div>
      </div>
    </div>
  `;
}
function initPresets() {
  renderPresets('depositPresets', [
    { targetId: 'deposit', value: 1, label: '押一付一' },
    { targetId: 'deposit', value: 2, label: '押二付一' },
    { targetId: 'deposit', value: 3, label: '押三付一' },
  ], 1);
  renderPresets('commutePresets', [
    { targetId: 'commute', value: 10, label: '10分钟' },
    { targetId: 'commute', value: 30, label: '30分钟' },
    { targetId: 'commute', value: 45, label: '45分钟' },
    { targetId: 'commute', value: 60, label: '1小时' },
    { targetId: 'commute', value: 90, label: '1.5小时' },
  ], 40);
  renderPresets('salaryPresets', [
    { targetId: 'salary', value: 6000, label: '6k' },
    { targetId: 'salary', value: 10000, label: '10k' },
    { targetId: 'salary', value: 15000, label: '15k' },
    { targetId: 'salary', value: 20000, label: '20k' },
    { targetId: 'salary', value: 30000, label: '30k' },
  ], 15000);
  renderPresets('workHoursPresets', [
    { targetId: 'workHours', value: 8, label: '8小时' },
    { targetId: 'workHours', value: 9, label: '965' },
    { targetId: 'workHours', value: 10, label: '996' },
    { targetId: 'workHours', value: 12, label: '9106' },
  ], 8);
}
function toggleTheme() {
  document.documentElement.classList.toggle('dark');
  const btn = document.querySelector('.theme-toggle');
  const isDark = document.documentElement.classList.contains('dark');
  btn.textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
(function init() {
  const savedTheme = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
    document.documentElement.classList.add('dark');
    document.querySelector('.theme-toggle').textContent = '☀️';
  }
  initPresets();
  calc();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
