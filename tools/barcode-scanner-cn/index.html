<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>条形码扫描工具 | Barcode Scanner</title>
<meta property="og:title" content="条形码扫描工具 | Barcode Scanner">
<meta property="og:description" content="条形码扫描工具 | Barcode Scanner - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="条形码扫描识别工具，上传图片或使用摄像头识别EAN-13、Code128等条形码">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
<script src="../i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--cyan:#39d2c0;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--cyan:#0598bc}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;padding:16px}
.container{max-width:700px;margin:0 auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{text-align:center;color:var(--text-secondary);font-size:.85rem;margin-bottom:20px}
.card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text-secondary);cursor:pointer;font-size:.9rem;text-align:center;transition:.2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:12px}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(88,166,255,.05)}
.drop-zone p{color:var(--text-secondary);margin-top:8px;font-size:.9rem}
.drop-zone .icon{font-size:48px;margin-bottom:8px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--accent)}
.btn-group{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.preview-img{max-width:100%;max-height:300px;border-radius:8px;margin:12px 0;display:none}
.result-box{background:rgba(88,166,255,.05);border:1px solid var(--accent);border-radius:8px;padding:16px;margin-top:12px;display:none}
.result-box .label{font-size:.8rem;color:var(--text-secondary);margin-bottom:6px}
.result-box .value{font-size:1.1rem;font-family:monospace;word-break:break-all;margin-bottom:8px}
.result-box .type{font-size:.8rem;color:var(--cyan);margin-bottom:4px}
.history-item{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:.85rem;transition:.2s;cursor:pointer}
.history-item:hover{background:var(--bg-tertiary)}
.history-item .code{font-family:monospace;color:var(--accent)}
.history-item .time{font-size:.75rem;color:var(--text-secondary)}
.empty-state{text-align:center;padding:30px;color:var(--text-secondary);font-size:.85rem}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:8px 16px;border-radius:8px;font-size:.85rem;opacity:0;transition:.3s;z-index:100}
.toast.show{opacity:1}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--bg-secondary);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>📱 条形码扫描工具</h1>
<p class="sub">上传图片识别条形码，支持EAN-13、UPC-A、Code128等</p>

<div class="tabs">
<div class="tab active" onclick="switchTab('upload')">图片上传</div>
<div class="tab" onclick="switchTab('camera')">摄像头扫描</div>
</div>

<div id="uploadSection" class="card">
<div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
<div class="icon">📁</div>
<p>点击选择条形码图片或拖拽到此处</p>
<p style="font-size:.75rem;margin-top:4px">支持 JPG / PNG / GIF / WebP</p>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
<img class="preview-img" id="previewImg">
<div class="btn-group">
<button class="btn btn-primary" id="scanBtn" onclick="scanFromUpload()" disabled>🔍 识别</button>
<button class="btn btn-outline" onclick="clearAll()">🗑️ 清空</button>
</div>
</div>

<div id="cameraSection" class="card" style="display:none">
<div style="position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:8px;overflow:hidden;margin-bottom:12px">
<video id="cameraVideo" autoplay playsinline style="width:100%;height:100%;object-fit:cover"></video>
<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
<div style="width:80%;height:60%;border:2px solid var(--accent);border-radius:8px;box-shadow:0 0 20px rgba(88,166,255,.3)"></div>
</div>
</div>
<div class="btn-group">
<button class="btn btn-primary" onclick="startCamera()">📷 启动摄像头</button>
<button class="btn btn-outline" onclick="stopCamera()">⏹️ 停止</button>
</div>
</div>

<div class="result-box" id="resultBox">
<div class="label">识别结果</div>
<div class="type" id="resultType"></div>
<div class="value" id="resultValue"></div>
<div class="btn-group">
<button class="btn btn-outline" onclick="copyResult()">📋 复制</button>
</div>
</div>

<div class="card">
<h3 style="font-size:.85rem;color:var(--text-secondary);margin-bottom:8px">扫描历史</h3>
<div id="historyList"><div class="empty-state">暂无扫描记录</div></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
var history=[];
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function switchTab(tab){
document.querySelectorAll('.tabs .tab').forEach(function(t,i){t.classList.toggle('active',i===(tab==='upload'?0:1))});
document.getElementById('uploadSection').style.display=tab==='upload'?'block':'none';
document.getElementById('cameraSection').style.display=tab==='camera'?'block':'none';
if(tab!=='camera')stopCamera();
}
var dropZone=document.getElementById('dropZone');
dropZone.addEventListener('dragover',function(e){e.preventDefault();dropZone.classList.add('dragover')});
dropZone.addEventListener('dragleave',function(){dropZone.classList.remove('dragover')});
dropZone.addEventListener('drop',function(e){e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0])});
var currentImageData=null;
function handleFile(file){
if(!file||!file.type.startsWith('image/')){toast('请选择图片文件');return;}
var reader=new FileReader();
reader.onload=function(e){
currentImageData=e.target.result;
document.getElementById('previewImg').src=currentImageData;
document.getElementById('previewImg').style.display='block';
document.getElementById('scanBtn').disabled=false;
};
reader.readAsDataURL(file);
}
function scanFromUpload(){
if(!currentImageData){toast('请先选择图片');return;}
scanImage(currentImageData);
}
function scanImage(src){
toast('正在识别...');
var img=new Image();
img.crossOrigin='anonymous';
img.onload=function(){
var canvas=document.createElement('canvas');
canvas.width=img.width;canvas.height=img.height;
var ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0);
var imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
var result=analyzeBarcode(imageData);
if(result){
showResult(result.code,result.type);
addHistory(result.code,result.type);
toast('识别成功');
}else{
toast('未能识别到条形码，请确保图片清晰');
}
};
img.onerror=function(){toast('图片加载失败')};
img.src=src;
}
function analyzeBarcode(imageData){
var data=imageData.data;
var w=imageData.width,h=imageData.height;
var gray=new Uint8Array(w*h);
for(var i=0;i<w*h;i++)gray[i]=Math.round(data[i*4]*0.299+data[i*4+1]*0.587+data[i*4+2]*0.114);
var rows=[];
var rowH=Math.max(1,Math.floor(h/10));
for(var y=Math.floor(h*0.3);y<Math.floor(h*0.7);y+=rowH){
var row=[];
var threshold=128;
for(var x=0;x<w;x++)row.push(gray[y*w+x]<threshold?1:0);
rows.push(row);
}
if(!rows.length)return null;
var profile=new Array(w).fill(0);
rows.forEach(function(r){r.forEach(function(v,i){profile[i]+=v})});
var mid=Math.floor(rows.length/2);
var row=rows[mid]||rows[0];
var transitions=[];
for(var x=1;x<row.length;x++){if(row[x]!==row[x-1])transitions.push(x);}
if(transitions.length<10)return null;
var bars=[];
for(var i=1;i<transitions.length;i++)bars.push(transitions[i]-transitions[i-1]);
var avgBar=bars.reduce(function(a,b){return a+b},0)/bars.length;
var code=barcodeToNumber(bars,avgBar);
if(code&&code.length>=8){
var type='Code128';
if(code.length===13&&/^\d{13}$/.test(code))type='EAN-13';
else if(code.length===12&&/^\d{12}$/.test(code))type='UPC-A';
else if(code.length===8&&/^\d{8}$/.test(code))type='EAN-8';
return{code:code,type:type};
}
return null;
}
function barcodeToNumber(bars,avg){
var bits='';
bars.forEach(function(b){
var modules=Math.round(b/avg);
for(var i=0;i<modules;i++)bits+=(bits.length%2===0)?'1':'0';
});
var nums=[];
var codeMap={'0001101':0,'0011001':1,'0010011':2,'0111101':3,'0100011':4,'0110001':5,'0101111':6,'0111011':7,'0110111':8,'0001011':9};
for(var i=0;i+7<=bits.length&&nums.length<14;i+=7){
var seg=bits.substr(i,7);
if(codeMap[seg]!==undefined)nums.push(codeMap[seg]);
}
return nums.length>=8?nums.join(''):'';
}
function showResult(code,type){
document.getElementById('resultValue').textContent=code;
document.getElementById('resultType').textContent='类型: '+type;
document.getElementById('resultBox').style.display='block';
}
function addHistory(code,type){
history.unshift({code:code,type:type,time:new Date().toLocaleTimeString()});
renderHistory();
}
function renderHistory(){
var c=document.getElementById('historyList');
if(!history.length){c.innerHTML='<div class="empty-state">暂无扫描记录</div>';return;}
c.innerHTML=history.slice(0,20).map(function(h){
return '<div class="history-item" onclick="copyText(\''+h.code+'\')"><span class="code">'+h.code+'</span><span style="font-size:.75rem;color:var(--cyan)">'+h.type+'</span><span class="time">'+h.time+'</span></div>';
}).join('');
}
function copyResult(){navigator.clipboard.writeText(document.getElementById('resultValue').textContent).then(function(){toast('已复制到剪贴板')}))}
function copyText(t){navigator.clipboard.writeText(t).then(function(){toast('已复制'))}
var cameraStream=null;
function startCamera(){
navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(stream){
cameraStream=stream;
document.getElementById('cameraVideo').srcObject=stream;
scanCamera();
}).catch(function(e){toast('无法访问摄像头: '+e.message)});
}
function scanCamera(){
if(!cameraStream)return;
var video=document.getElementById('cameraVideo');
if(video.readyState<2){requestAnimationFrame(scanCamera);return;}
var canvas=document.createElement('canvas');
canvas.width=video.videoWidth;canvas.height=video.videoHeight;
var ctx=canvas.getContext('2d');
ctx.drawImage(video,0,0);
var imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
var result=analyzeBarcode(imageData);
if(result){
showResult(result.code,result.type);
addHistory(result.code,result.type);
toast('识别成功');
}else{requestAnimationFrame(scanCamera);}
}
function stopCamera(){
if(cameraStream){cameraStream.getTracks().forEach(function(t){t.stop()});cameraStream=null;}
document.getElementById('cameraVideo').srcObject=null;
}
function clearAll(){
currentImageData=null;
document.getElementById('previewImg').style.display='none';
document.getElementById('scanBtn').disabled=true;
document.getElementById('resultBox').style.display='none';
stopCamera();
}
</script>
</body>
</html>
