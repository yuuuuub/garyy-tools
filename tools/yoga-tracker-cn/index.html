<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧘 瑜伽追踪</title>
<meta name="description" content="瑜伽练习追踪器，记录瑜伽类型、时长、体式，管理体式库和练习历史">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.pose-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px}
.pose-card{background:var(--bg);border-radius:8px;padding:10px;text-align:center;font-size:.8rem;cursor:pointer;transition:all .2s}
.pose-card:hover{border:1px solid var(--accent)}
.pose-card .pn{font-weight:600;margin-bottom:4px}
.pose-card .pd{color:var(--text2);font-size:.7rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧘</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🧘 瑜伽追踪">
<meta property="og:description" content="瑜伽练习追踪器，记录瑜伽类型、时长、体式">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/yoga-tracker-cn/">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🧘 瑜伽追踪</h1><p>身心合一，记录每一次练习</p></div>

<div class="cd">
<div class="gr">
<div class="st"><div class="nm" id="totalSessions">0</div><div class="lb">总练习次数</div></div>
<div class="st"><div class="nm" id="totalHours" style="color:var(--success)">0</div><div class="lb">总时长(小时)</div></div>
<div class="st"><div class="nm" id="avgDur" style="color:var(--warn)">0</div><div class="lb">平均时长(分钟)</div></div>
<div class="st"><div class="nm" id="streak" style="color:var(--danger)">0</div><div class="lb">连续天数</div></div>
</div>
</div>

<div class="cd"><h2>记录练习</h2>
<div class="fr">
<div><label>瑜伽类型</label><select id="yStyle"><option>哈他瑜伽</option><option>流瑜伽</option><option>阴瑜伽</option><option>修复瑜伽</option><option>阿斯汤加</option><option>热瑜伽</option><option>空中瑜伽</option><option>冥想</option><option>其他</option></select></div>
<div><label>时长(分钟)</label><input type="number" id="yDur" placeholder="60" min="1"></div>
</div>
<div class="fr">
<div><label>体式数量</label><input type="number" id="yPoses" placeholder="15" min="0"></div>
<div><label>难度</label><select id="yDiff"><option>初级</option><option>中级</option><option>高级</option></select></div>
</div>
<div><label>日期</label><input type="date" id="yDate"></div>
<div><label>心得(选填)</label><textarea id="yNote" placeholder="今天的练习感受..."></textarea></div>
<div class="bg"><button onclick="addSession()">保存练习</button></div></div>

<div class="cd"><h2>体式库</h2>
<div style="display:flex;gap:8px;margin-bottom:12px">
<select id="poseCat" style="width:auto"><option>全部</option><option>站姿</option><option>坐姿</option><option>倒立</option><option>后弯</option><option>平衡</option><option>扭转</option></select>
<button class="sec" onclick="showAddPose()" style="font-size:.85rem;padding:6px 12px">+ 添加体式</button>
</div>
<div id="addPoseForm" style="display:none">
<div class="fr">
<div><label>体式名称</label><input type="text" id="poseName" placeholder="如：树式"></div>
<div><label>分类</label><select id="poseType"><option>站姿</option><option>坐姿</option><option>倒立</option><option>后弯</option><option>平衡</option><option>扭转</option></select></div>
</div>
<div class="fr">
<div><label>难度</label><select id="poseDiff"><option>初级</option><option>中级</option><option>高级</option></select></div>
<div></div>
</div>
<div class="bg"><button onclick="savePose()">保存体式</button><button class="sec" onclick="hideAddPose()">取消</button></div>
</div>
<div class="pose-grid" id="poseGrid"></div></div>

<div class="cd"><h2>练习历史</h2><div id="sessionList" class="es">暂无记录</div>
<div class="bg"><button class="dng" onclick="clearSessions()">清空所有</button></div></div>
</div>
<script>
(function(){
var SESS_KEY='yoga_tracker_sessions';
var POSE_KEY='yoga_tracker_poses';
var sessions=JSON.parse(localStorage.getItem(SESS_KEY)||'[]');
var poses=JSON.parse(localStorage.getItem(POSE_KEY)||'[]');
var today=function(){return new Date().toISOString().slice(0,10)};

if(!poses.length){
var defaults=[
{name:'山式',cat:'站姿',diff:'初级'},{name:'树式',cat:'平衡',diff:'初级'},{name:'战士一式',cat:'站姿',diff:'初级'},
{name:'战士二式',cat:'站姿',diff:'初级'},{name:'三角式',cat:'站姿',diff:'初级'},{name:'下犬式',cat:'坐姿',diff:'初级'},
{name:'猫牛式',cat:'坐姿',diff:'初级'},{name:'婴儿式',cat:'坐姿',diff:'初级'},{name:'眼镜蛇式',cat:'后弯',diff:'初级'},
{name:'肩倒立',cat:'倒立',diff:'中级'},{name:'头倒立',cat:'倒立',diff:'高级'},{name:'轮式',cat:'后弯',diff:'高级'},
{name:'鸽子式',cat:'坐姿',diff:'中级'},{name:'半月式',cat:'平衡',diff:'中级'},{name:'扭转三角式',cat:'扭转',diff:'中级'}
];
defaults.forEach(function(p){p.id=Date.now()+Math.random();});
poses=defaults;
localStorage.setItem(POSE_KEY,JSON.stringify(poses));
}

function saveSessions(){localStorage.setItem(SESS_KEY,JSON.stringify(sessions));}
function savePoses(){localStorage.setItem(POSE_KEY,JSON.stringify(poses));}

window.addSession=function(){
var style=document.getElementById('yStyle').value;
var dur=parseInt(document.getElementById('yDur').value)||0;
if(!dur){alert('请填写练习时长');return;}
var poses_count=parseInt(document.getElementById('yPoses').value)||0;
var diff=document.getElementById('yDiff').value;
var date=document.getElementById('yDate').value||today();
var note=document.getElementById('yNote').value.trim();
sessions.push({id:Date.now(),style:style,duration:dur,poses:poses_count,difficulty:diff,date:date,note:note});
saveSessions();
document.getElementById('yDur').value='';document.getElementById('yPoses').value='';document.getElementById('yNote').value='';
render();
};

window.delSession=function(id){sessions=sessions.filter(function(s){return s.id!==id});saveSessions();render();};
window.clearSessions=function(){if(!confirm('确定清空所有？'))return;sessions=[];saveSessions();render();};

function getStreak(){
var streak=0;var d=new Date();
while(true){var ds=d.toISOString().slice(0,10);
var found=sessions.some(function(s){return s.date===ds;});
if(found){streak++;d.setDate(d.getDate()-1);}else break;}
return streak;
}

window.showAddPose=function(){document.getElementById('addPoseForm').style.display='block';};
window.hideAddPose=function(){document.getElementById('addPoseForm').style.display='none';};

window.savePose=function(){
var name=document.getElementById('poseName').value.trim();
if(!name){alert('请输入体式名称');return;}
poses.push({id:Date.now(),name:name,cat:document.getElementById('poseType').value,diff:document.getElementById('poseDiff').value});
savePoses();document.getElementById('poseName').value='';hideAddPose();renderPoses();
};

window.delPose=function(id){poses=poses.filter(function(p){return p.id!==id});savePoses();renderPoses();};

function renderPoses(){
var cat=document.getElementById('poseCat').value;
var filtered=cat==='全部'?poses:poses.filter(function(p){return p.cat===cat;});
var el=document.getElementById('poseGrid');
if(!filtered.length){el.innerHTML='<div class="es" style="grid-column:1/-1">暂无体式</div>';return;}
el.innerHTML=filtered.map(function(p){
var dc=p.diff==='高级'?'d':p.diff==='中级'?'w':'s';
return '<div class="pose-card" onclick="delPose('+p.id+')" title="点击删除"><div class="pn">'+p.name+'</div><div class="pd"><span class="tag '+dc+'" style="font-size:.65rem">'+p.diff+'</span> '+p.cat+'</div></div>';
}).join('');
}
document.getElementById('poseCat').addEventListener('change',renderPoses);

function render(){
document.getElementById('totalSessions').textContent=sessions.length;
var totalMin=0;sessions.forEach(function(s){totalMin+=s.duration;});
document.getElementById('totalHours').textContent=(totalMin/60).toFixed(1);
document.getElementById('avgDur').textContent=sessions.length?Math.round(totalMin/sessions.length):0;
document.getElementById('streak').textContent=getStreak();

var el=document.getElementById('sessionList');
if(!sessions.length){el.innerHTML='<div class="es">暂无记录</div>';return;}
el.innerHTML=sessions.slice().reverse().map(function(s){
var dc=s.difficulty==='高级'?'d':s.difficulty==='中级'?'w':'s';
return '<div class="li"><div style="flex:1"><strong>'+s.style+'</strong> <span class="tag '+dc+'">'+s.difficulty+'</span><br><span style="font-size:.8rem;color:var(--text2)">'+s.duration+'分钟 · '+s.poses+'个体式 · '+s.date+(s.note?' · '+s.note:'')+'</span></div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="delSession('+s.id+')">✕</button></div>';
}).join('');

renderPoses();
}
document.getElementById('yDate').value=today();
render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
