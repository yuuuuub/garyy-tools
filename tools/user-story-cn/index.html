<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 用户故事</title>
<meta name="description" content="用户故事编写工具，以用户视角描述需求功能">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.story-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;border-left:4px solid var(--accent)}
.story-card h3{font-size:1rem;margin-bottom:8px}
.story-preview{font-size:.9rem;color:var(--text2);font-style:italic}
.priority{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.p-high{background:rgba(248,81,73,.2);color:var(--red)}
.p-med{background:rgba(210,153,34,.2);color:var(--yellow)}
.p-low{background:rgba(63,185,80,.2);color:var(--green)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.hidden{display:none!important}
.story-full{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.story-full .row{margin-bottom:8px}
.story-full .label{font-size:.8rem;color:var(--text2);font-weight:600}
.checklist{list-style:none;padding:0}
.checklist li{padding:6px 0;font-size:.9rem}
.checklist li::before{content:'☐ ';color:var(--text2)}
.checklist li.done::before{content:'☑ ';color:var(--green)}
.checklist li.done{text-decoration:line-through;color:var(--text2)}
.empty{text-align:center;color:var(--text2);padding:40px}
@media(max-width:600px){body{padding:10px}.ctn{max-width:100%}.cd{padding:14px}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📝 用户故事">
<meta property="og:description" content="用户故事编写工具，以用户视角描述需求功能">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/user-story-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='user_story_data';
let stories=JSON.parse(localStorage.getItem(STORE)||'[]');
let curView='list',curId=null;
function save(){localStorage.setItem(STORE,JSON.stringify(stories))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function render(){
  let h=`<div class="hdr"><h1>📝 用户故事</h1><p>以用户视角描述需求功能</p></div>`;
  h+=`<div class="flex" style="justify-content:center;margin-bottom:16px"><button onclick="showNew()">新建故事</button><button class="sec" onclick="curView='list';render()">故事列表</button></div>`;
  h+=`<div id="viewNew" class="${curView==='new'?'':'hidden'}"></div>`;
  h+=`<div id="viewList" class="${curView==='list'?'':'hidden'}"></div>`;
  h+=`<div id="viewDetail" class="${curView==='detail'?'':'hidden'}"></div>`;
  $('app').innerHTML=h;
  if(curView==='new')renderNew();else if(curView==='list')renderList();else renderDetail();
}
function renderNew(){
  let h=`<div class="cd"><h2>新建用户故事</h2>`;
  h+=`<label>故事标题</label><input id="sTitle" placeholder="简短描述">`;
  h+=`<label>角色</label><input id="sRole" placeholder="例如：注册用户、管理员">`;
  h+=`<label>想要</label><textarea id="sWant" placeholder="想要执行某个操作"></textarea>`;
  h+=`<label>以便</label><textarea id="sSo" placeholder="以便获得某种价值"></textarea>`;
  h+=`<label>验收标准</label><textarea id="sAC" placeholder="每行一条验收标准"></textarea>`;
  h+=`<label>优先级</label><select id="sPriority"><option value="high">高</option><option value="med" selected>中</option><option value="low">低</option></select>`;
  h+=`<label>故事点数</label><input type="number" id="sPoints" placeholder="估算工作量" min="1" max="100" value="3">`;
  h+=`<div class="bg"><button onclick="saveStory()">保存</button><button class="sec" onclick="curView='list';render()">取消</button></div></div>`;
  $('viewNew').innerHTML=h;
}
function saveStory(){
  const title=$('sTitle').value.trim();if(!title){alert('请输入标题');return}
  stories.push({id:uid(),title,role:$('sRole').value,want:$('sWant').value,so:$('sSo').value,
    ac:$('sAC').value.split('\n').filter(l=>l.trim()),priority:$('sPriority').value,
    points:+$('sPoints').value||3,acceptedList:[],createdAt:new Date().toISOString()});
  save();curView='list';render();
}
function renderList(){
  let h=`<div class="cd">`;
  if(!stories.length){h+=`<p class="empty">暂无用户故事</p>`}
  stories.forEach(s=>{
    const pClass={high:'p-high',med:'p-med',low:'p-low'}[s.priority];
    const pName={high:'高',med:'中',low:'低'}[s.priority];
    h+=`<div class="story-card" style="border-left-color:${s.priority==='high'?'var(--red)':s.priority==='med'?'var(--yellow)':'var(--green)'}" onclick="viewStory('${s.id}')">`;
    h+=`<div class="flex-between"><h3>${s.title}</h3><span class="priority ${pClass}">${pName} · ${s.points}点</span></div>`;
    h+=`<div class="story-preview">作为${s.role||'用户'}，我想要${s.want||'...'}，以便${s.so||'...'}</div></div>`;
  });
  h+=`</div>`;$('viewList').innerHTML=h;
}
function viewStory(id){curId=id;curView='detail';render()}
function delStory(id){if(!confirm('确定删除?'))return;stories=stories.filter(s=>s.id!==id);save();curView='list';render()}
function renderDetail(){
  const s=stories.find(x=>x.id===curId);if(!s){curView='list';render();return}
  let h=`<div class="cd"><div class="flex-between"><h2>${s.title}</h2><span class="priority p-${s.priority}">${{high:'高',med:'中',low:'低'}[s.priority]} · ${s.points}点</span></div>`;
  h+=`<div class="story-full">`;
  h+=`<div class="row"><span class="label">作为</span> ${s.role||'用户'}</div>`;
  h+=`<div class="row"><span class="label">我想要</span> ${s.want||'-'}</div>`;
  h+=`<div class="row"><span class="label">以便</span> ${s.so||'-'}</div>`;
  h+=`</div>`;
  if(s.ac&&s.ac.length){
    h+=`<h2 style="margin-top:16px">验收标准</h2><ul class="checklist">`;
    s.ac.forEach((ac,i)=>{
      const done=(s.acceptedList||[]).includes(i);
      h+=`<li class="${done?'done':''}" onclick="toggleAC('${s.id}',${i})">${ac}</li>`;
    });
    h+=`</ul>`;
  }
  h+=`<div class="bg" style="margin-top:16px"><button class="sec" onclick="curView='list';render()">返回</button><button class="dng" onclick="delStory('${s.id}')">删除</button></div></div>`;
  $('viewDetail').innerHTML=h;
}
function toggleAC(id,idx){
  const s=stories.find(x=>x.id===id);if(!s)return;
  if(!s.acceptedList)s.acceptedList=[];
  const i=s.acceptedList.indexOf(idx);if(i>-1)s.acceptedList.splice(i,1);else s.acceptedList.push(idx);
  save();renderDetail();
}
function showNew(){curView='new';render()}
render();
</script>
</body>
</html>
