<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>笑话生成器</title><meta name="description" content="随机生成中文笑话，让你开怀大笑"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#eab308}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:20px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.options{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.options select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem}.btn{display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.btn:hover{opacity:.85}.btn-secondary{background:var(--border);color:var(--text)}.actions{display:flex;gap:8px;justify-content:center;margin-top:16px}.joke-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-top:16px;text-align:center}.joke-icon{font-size:3rem;margin-bottom:12px}.joke-setup{font-size:1.1rem;line-height:1.7;color:var(--text);margin-bottom:12px}.joke-punchline{font-size:1rem;line-height:1.6;color:var(--accent);font-weight:600;display:none}.joke-card.revealed .joke-punchline{display:block}.reveal-btn{display:inline-block;margin-top:12px;padding:8px 20px;background:var(--accent);color:#000;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.reveal-btn:hover{opacity:.85}.joke-card.revealed .reveal-btn{display:none}.joke-tags{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}.joke-tag{padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:.75rem;color:var(--text2)}.counter{font-size:.8rem;color:var(--text2);margin-top:8px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}</style><meta name="robots" content="index, follow"><meta property="og:title" content="笑话生成器"><meta property="og:description" content="随机生成中文笑话"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😂</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>😂 笑话生成器</h1><p class="sub">随机生成中文笑话，让你开怀大笑</p>
<div class="card">
<div class="options">
<select id="category"><option value="all">全部</option><option value="dad">冷笑话</option><option value="pun">谐音梗</option><option value="work">职场</option><option value="school">校园</option><option value="family">家庭</option><option value="animal">动物</option></select>
</div>
<div class="actions"><button class="btn" onclick="generate()">🎲 生成笑话</button></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
(function(){
var jokes=[
{c:'dad',s:'什么东西越洗越脏？',a:'水。'},
{c:'dad',s:'什么布剪不断？',a:'瀑布。'},
{c:'dad',s:'什么锁没有孔？',a:'密码锁。'},
{c:'dad',s:'什么路不能走？',a:'电路。'},
{c:'dad',s:'什么花不能摸？',a:'火花。'},
{c:'dad',s:'什么池不能有水？',a:'电池。'},
{c:'dad',s:'什么帽不能戴？',a:'螺帽。'},
{c:'dad',s:'什么桥不能走？',a：'鼻梁。'},
{c:'pun',s:'为什么程序员不喜欢出门？',a:'因为外面没有WiFi！'},
{c:'pun',s:'什么动物最容易摔倒？',a:'狐狸，因为狐狸很狡猾（脚滑）。'},
{c:'pun',s:'什么水果最忙？',a:'芒果，因为它很"忙"果。'},
{c:'pun',s:'什么门永远关不上？',a:'球门。'},
{c:'pun',s:'什么鱼不能吃？',a:'木鱼。'},
{c:'pun',s:'为什么蚕宝宝很有钱？',a:'因为它会结茧（节俭）。'},
{c:'pun',s:'什么蛋不能吃？',a:'笨蛋、混蛋、滚蛋。'},
{c:'pun',s:'什么光没有亮度？',a:'时光。'},
{c:'work',s:'老板：你为什么迟到？',a:'员工：因为路上堵车。老板：那你为什么不早点出门？员工：因为我不想太早到，那样显得您来得太晚。'},
{c:'work',s:'老板：你觉得加班怎么样？',a:'员工：我觉得加班是一种修行。老板：那你怎么不修行？员工：我在修，修的是不生气。'},
{c:'work',s:'面试官：你期望的薪资是多少？',a:'我：100万。面试官：你觉得你值这个价吗？我：不觉得，但我需要一个让你拒绝我的理由。'},
{c:'work',s:'什么是996？',a:'就是早上9点上班，晚上9点下班，一周工作6天。什么是007？就是从0点到0点，一周7天都在工作。'},
{c:'work',s:'新来的实习生问老员工：这里加班多吗？',a:'老员工：不多，就是每天加一点。实习生：那还好。老员工：每天加一点，一年就加了很多。'},
{c:'school',s:'老师：小明，你长大想当什么？',a:'小明：我想当医生。老师：为什么？小明：因为只有医生可以让人说"啊——"。'},
{c:'school',s:'老师：小明，1+1等于几？',a:'小明：不知道。老师：回家问你爸去！小明回来后说：等于田。'},
{c:'school',s:'小明：妈妈，我考了0分。',a:'妈妈：你看看隔壁小红，考了100分！小明：那又怎样，她又不是我老婆。'},
{c:'school',s:'老师：谁能用"果然"造句？',a:'小明：我吃水果然后拉肚子。'},
{c:'school',s:'数学老师：8减去一半等于多少？',a:'小明：等于0。老师：为什么？小明：8减一半就是把8的上半部分去掉，不就是0了吗？'},
{c:'family',s:'老婆：你觉得我漂亮吗？',a:'老公：你是我见过最美的女人。老婆：你撒谎！老公：对，我撒谎了，你不是我见过的，你是从未见过的。'},
{c:'family',s:'女朋友问我：如果我和你妈同时掉进水里...',a:'我：放心，我妈会游泳。女朋友：那我呢？我：你不是说你最擅长"沉鱼落雁"吗？'},
{c:'family',s:'儿子：爸爸，为什么我叫小明？',a:'爸爸：因为你出生那天阳光明媚。儿子：那姐姐为什么叫小雪？爸爸：因为你妈怀她的时候在下雪。儿子：那哥哥呢？爸爸：别问了，你哥叫小雷。'},
{c:'family',s:'妈妈：儿子，你长大了想娶什么样的媳妇？',a:'儿子：像妈妈这样的。妈妈：真乖。儿子：但是爸爸说他娶错了。'},
{c:'family',s:'爸爸：儿子，你知道什么是勇敢吗？',a:'儿子：知道。爸爸：那你说说。儿子：妈妈说"你再说一遍"的时候，我敢再说一遍。'},
{c:'animal',s:'一只企鹅走进了一家便利店。',a:'它问老板：你们这里卖企鹅吗？老板：不卖。企鹅：那你们为什么叫便利店？'},
{c:'animal',s:'为什么大象不用电脑？',a:'因为它怕鼠标。'},
{c:'animal',s:'一只猫对另一只猫说：你知道我最喜欢什么运动吗？',a:'另一只猫：什么？第一只猫：追尾巴。'},
{c:'animal',s:'狗和猫比赛跑步。',a:'狗赢了。猫不服，说：你作弊！狗说：我怎么作弊了？猫说：你一直在追我，肯定有动力！'},
{c:'animal',s:'一只鹦鹉对主人说：你好帅！',a:'主人很开心。鹦鹉又说：但是你在镜子面前可不是这么说的。'}
];
var count=0;
function generate(){
var cat=document.getElementById('category').value;
var filtered=cat==='all'?jokes:jokes.filter(function(j){return j.c===cat});
var joke=filtered[Math.floor(Math.random()*filtered.length)];
count++;
document.getElementById('result').innerHTML='<div class="joke-card" id="jokeCard"><div class="joke-icon">😂</div><div class="joke-setup">'+joke.s+'</div><div class="joke-punchline">'+joke.a+'</div><button class="reveal-btn" onclick="document.getElementById(\'jokeCard\').classList.add(\'revealed\')">揭晓答案</button><div class="joke-tags"><span class="joke-tag">'+{dad:'冷笑话',pun:'谐音梗',work:'职场',school:'校园',family:'家庭',animal:'动物'}[joke.c]+'</span></div><div class="counter">已生成 '+count+' 个笑话</div></div>';
}
})();
</script></body></html>
