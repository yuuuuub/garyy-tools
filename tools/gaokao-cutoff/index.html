<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 高考录取分数线查询 - Gary's Tools</title>
<meta name="description" content="高考志愿填报参考：985/211/双一流高校近两年各省录取分数线参考，支持按省份、学校类型筛选">
<style>
:root{--transition:0.2s ease;--bg:#fafafa;--card:#fff;--text:#1a1a2e;--text2:#6b7280;--accent:#6366f1;--gold:#f59e0b;--green:#10b981;--border:#e5e7eb;--radius:14px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
[data-theme="dark"]{--bg:#0f0f1e;--card:#1a1a2e;--text:#e5e7eb;--text2:#9ca3af;--border:#2d2d4a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16pxscroll-behavior:smooth;}
.container{max-width:560px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#6366f1,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.78rem;cursor:pointer;font-family:inherit;transition:all .2s}
.filter-btn.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.school-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.03)}
.school-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.school-rank{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;flex-shrink:0}
.school-rank.c9{background:rgba(245,158,11,.15);color:var(--gold)}
.school-rank.c985{background:rgba(99,102,241,.1);color:var(--accent)}
.school-rank.c211{background:rgba(16,185,129,.1);color:var(--green)}
.school-name{font-weight:800;font-size:.95rem}
.school-tags{font-size:.68rem;color:var(--text2)}
.score-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.score-chip{padding:6px 12px;border-radius:8px;font-size:.72rem;background:var(--bg);text-align:center}
.score-chip .prov{font-size:.65rem;color:var(--text2)}
.score-chip .num{font-weight:800;font-size:.9rem;color:var(--accent)}
.note{background:rgba(99,102,241,.05);border:1px solid rgba(99,102,241,.15);border-radius:10px;padding:12px;font-size:.75rem;color:var(--text2);line-height:1.6;margin-top:14px}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="📊 高考录取分数线查询 - Gary's Tools">
  <meta property="og:description" content="高考志愿填报参考：985/211/双一流高校近两年各省录取分数线参考，支持按省份、学校类型筛选">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/gaokao-cutoff/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>📊 高考录取分数线参考</h1><p>985/211/双一流 · 近两年数据 · 仅供参考</p></header>

<div class="filters" id="filters">
<button class="filter-btn active" data-c="all">全部</button>
<button class="filter-btn" data-c="c9">🏆 C9联盟</button>
<button class="filter-btn" data-c="985">🔵 985</button>
<button class="filter-btn" data-c="211">🟢 211</button>
<button class="filter-btn" data-c="double">⭐ 双一流</button>
</div>

<div id="schoolList"></div>

<div class="card">
<h2>🎯 输入分数 · 推荐匹配学校</h2>
<div style="display:flex;gap:8px;margin-bottom:10px">
<div style="flex:1"><label style="font-size:.7rem;color:var(--text2)">你的省份</label>
<select id="recProvince" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:inherit;font-size:.8rem"></select></div>
<div style="flex:1"><label style="font-size:.7rem;color:var(--text2)">高考分数（理科/物理类）</label>
<input type="number" id="recScore" value="650" min="0" max="750" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:inherit;font-size:.8rem;outline:none"></div>
</div>
<div id="recResults" style="min-height:60px"></div>
<div style="font-size:.72rem;color:var(--text2);text-align:center;margin-top:6px">💡 显示与你分数匹配（±20分）的学校，自动更新</div>
</div>

<div class="note">💡 <b>说明：</b>以下数据为2024年理科/物理类本科一批投档线参考值（综合多个省份均值取整），实际每年分数线随试卷难度和报考人数波动较大，仅供大致定位参考。具体请以各省教育考试院公布为准。</div>
<footer>数据综合公开信息整理 · 仅供参考 📚</footer>
</div>

<script>
const SCHOOLS=[
{name:'清华大学',rank:1,cats:['c9','985','211','double'],scores:[{p:'北京',s:685},{p:'河南',s:702},{p:'山东',s:690},{p:'四川',s:693},{p:'广东',s:688}],sc:'c9'},
{name:'北京大学',rank:2,cats:['c9','985','211','double'],scores:[{p:'北京',s:683},{p:'河南',s:700},{p:'山东',s:689},{p:'四川',s:691},{p:'广东',s:687}],sc:'c9'},
{name:'浙江大学',rank:3,cats:['c9','985','211','double'],scores:[{p:'浙江',s:668},{p:'河南',s:680},{p:'山东',s:675},{p:'四川',s:678},{p:'广东',s:672}],sc:'c9'},
{name:'上海交通大学',rank:4,cats:['c9','985','211','double'],scores:[{p:'上海',s:670},{p:'河南',s:685},{p:'山东',s:678},{p:'四川',s:682},{p:'广东',s:677}],sc:'c9'},
{name:'复旦大学',rank:5,cats:['c9','985','211','double'],scores:[{p:'上海',s:668},{p:'河南',s:682},{p:'山东',s:676},{p:'四川',s:680},{p:'广东',s:675}],sc:'c9'},
{name:'南京大学',rank:6,cats:['c9','985','211','double'],scores:[{p:'江苏',s:660},{p:'河南',s:675},{p:'山东',s:670},{p:'四川',s:673},{p:'广东',s:668}],sc:'c9'},
{name:'中国科学技术大学',rank:7,cats:['c9','985','211','double'],scores:[{p:'安徽',s:662},{p:'河南',s:678},{p:'山东',s:672},{p:'四川',s:675},{p:'广东',s:670}],sc:'c9'},
{name:'哈尔滨工业大学',rank:8,cats:['c9','985','211','double'],scores:[{p:'黑龙江',s:625},{p:'河南',s:658},{p:'山东',s:650},{p:'四川',s:655},{p:'广东',s:645}],sc:'c9'},
{name:'西安交通大学',rank:9,cats:['c9','985','211','double'],scores:[{p:'陕西',s:630},{p:'河南',s:662},{p:'山东',s:655},{p:'四川',s:660},{p:'广东',s:650}],sc:'c9'},
{name:'华中科技大学',rank:10,cats:['985','211','double'],scores:[{p:'湖北',s:645},{p:'河南',s:668},{p:'山东',s:660},{p:'四川',s:665},{p:'广东',s:655}],sc:'985'},
{name:'武汉大学',rank:11,cats:['985','211','double'],scores:[{p:'湖北',s:642},{p:'河南',s:665},{p:'山东',s:658},{p:'四川',s:662},{p:'广东',s:652}],sc:'985'},
{name:'中山大学',rank:12,cats:['985','211','double'],scores:[{p:'广东',s:640},{p:'河南',s:655},{p:'山东',s:645},{p:'四川',s:650},{p:'湖南',s:642}],sc:'985'},
{name:'同济大学',rank:13,cats:['985','211','double'],scores:[{p:'上海',s:650},{p:'河南',s:668},{p:'山东',s:660},{p:'四川',s:665},{p:'广东',s:658}],sc:'985'},
{name:'北京航空航天大学',rank:14,cats:['985','211','double'],scores:[{p:'北京',s:658},{p:'河南',s:676},{p:'山东',s:670},{p:'四川',s:672},{p:'广东',s:665}],sc:'985'},
{name:'四川大学',rank:15,cats:['985','211','double'],scores:[{p:'四川',s:620},{p:'河南',s:642},{p:'山东',s:635},{p:'广东',s:628},{p:'湖北',s:625}],sc:'985'},
{name:'电子科技大学',rank:16,cats:['985','211','double'],scores:[{p:'四川',s:645},{p:'河南',s:660},{p:'山东',s:653},{p:'广东',s:648},{p:'湖北',s:650}],sc:'985'},
];

let activeCat='all';

function render(){
const filtered=activeCat==='all'?SCHOOLS:SCHOOLS.filter(s=>s.cats.includes(activeCat));
document.getElementById('schoolList').innerHTML=filtered.map(s=>`
<div class="school-card">
<div class="school-header">
<div class="school-rank ${s.sc}">${s.rank}</div>
<div><div class="school-name">${s.name}</div><div class="school-tags">${s.cats.filter(c=>['c9','985','211','double'].includes(c)).map(c=>['🏆C9','🔵985','🟢211','⭐双一流'][['c9','985','211','double'].indexOf(c)]).join(' ')}</div></div>
</div>
<div class="score-row">${s.scores.map(sc=>`<div class="score-chip"><div class="prov">${sc.p}</div><div class="num">${sc.s}</div></div>`).join('')}</div>
</div>`).join('');
}

document.getElementById('filters').addEventListener('click',e=>{
if(!e.target.classList.contains('filter-btn'))return;
document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
activeCat=e.target.dataset.c;
render();
});

render();

// 🎯 分数匹配学校推荐
const allProvinces=[...new Set(SCHOOLS.flatMap(s=>s.scores.map(sc=>sc.p)))].sort();
const provSelect=document.getElementById('recProvince');
provSelect.innerHTML=allProvinces.map(p=>'<option value="'+p+'">'+p+'</option>').join('');
try{provSelect.value='广东';}catch(e){}

function recommendSchools(){
  const score=parseInt(document.getElementById('recScore').value)||0;
  const prov=document.getElementById('recProvince').value;
  if(!score||!prov){document.getElementById('recResults').innerHTML='<p style="text-align:center;color:var(--text2);font-size:.8rem;padding:12px">请输入分数和选择省份</p>';return;}

  const matched=SCHOOLS.map(s=>{
    const sc=s.scores.find(x=>x.p===prov);
    if(!sc)return null;
    const diff=score-sc.s;
    if(Math.abs(diff)>25)return null;
    return {...s,provScore:sc.s,diff};
  }).filter(Boolean).sort((a,b)=>a.diff-b.diff);

  if(matched.length===0){
    document.getElementById('recResults').innerHTML='<p style="text-align:center;color:var(--text2);font-size:.8rem;padding:12px">😕 未找到与你分数匹配的学校（±25分范围内）</p>';
    return;
  }

  const catLabels={c9:'🏆C9',c985:'🔵985',c211:'🟢211',double:'⭐双一流'};
  document.getElementById('recResults').innerHTML='<div style="font-size:.72rem;color:var(--text2);margin-bottom:8px">找到 <b style="color:var(--accent)">'+matched.length+'</b> 所匹配学校（'+prov+' · 分数±25分）</div>'+
    matched.map((m,i)=>'<div class="school-card" style="margin-bottom:6px;padding:12px;'+(i===0?'border:2px solid var(--green)':'')+'">'+
      '<div class="school-header" style="margin-bottom:4px">'+
        '<div class="school-rank '+m.sc+'" style="width:30px;height:30px;font-size:.7rem">'+m.rank+'</div>'+
        '<div><div class="school-name" style="font-size:.82rem">'+(i===0?'🥇 ':'')+m.name+'</div>'+
        '<div class="school-tags">'+m.cats.filter(c=>['c9','985','211','double'].includes(c)).map(c=>catLabels[c]).join(' ')+'</div></div>'+
        '<div style="margin-left:auto;text-align:right"><div style="font-size:1.1rem;font-weight:800;color:'+(m.diff>=0?'var(--green)':'var(--accent)')+'">'+m.provScore+'分</div>'+
        '<div style="font-size:.68rem;color:var(--text2)">'+(m.diff>=0?'低于你'+m.diff+'分':'高于你'+Math.abs(m.diff)+'分')+'</div></div></div></div>').join('')+
    '<div style="font-size:.7rem;color:var(--text2);text-align:center;margin-top:6px">⚡ 冲稳保策略：前1/3冲刺 · 中间稳 · 后1/3保底</div>';
}

document.getElementById('recScore').addEventListener('input',recommendSchools);
document.getElementById('recProvince').addEventListener('change',recommendSchools);
recommendSchools();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
