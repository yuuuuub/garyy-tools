<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色彩历史 - Color History</title>
<meta name="description" content="色彩文化历史，了解各种颜色的文化含义和演变">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{text-align:center;padding:2rem 1rem;border-bottom:1px solid var(--border)}
.header h1{font-size:1.8rem;margin-bottom:.3rem}
.header p{color:#8b949e;font-size:.9rem}
.container{max-width:900px;margin:0 auto;padding:1.5rem}
.era-filter{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;margin:1.5rem 0}
.era-btn{padding:.4rem .8rem;border-radius:6px;background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s}
.era-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.timeline{position:relative;padding:2rem 0}
.timeline::before{content:'';position:absolute;left:24px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;padding-left:60px;margin-bottom:2rem;cursor:pointer}
.timeline-dot{position:absolute;left:14px;top:8px;width:22px;height:22px;border-radius:50%;border:3px solid var(--border);background:var(--bg);z-index:1;transition:all .3s}
.timeline-item:hover .timeline-dot{transform:scale(1.3);border-color:var(--accent)}
.timeline-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem;transition:all .3s}
.timeline-item:hover .timeline-card{border-color:var(--accent);transform:translateX(4px)}
.timeline-year{font-size:.75rem;color:var(--accent);font-weight:600;margin-bottom:.3rem}
.timeline-card h3{font-size:1rem;margin-bottom:.4rem;display:flex;align-items:center;gap:.5rem}
.timeline-card h3 .swatch{width:20px;height:20px;border-radius:4px;border:1px solid var(--border);display:inline-block}
.timeline-card p{color:#8b949e;font-size:.85rem;line-height:1.5}
.timeline-tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.5rem}
.tag{padding:.15rem .5rem;border-radius:12px;font-size:.65rem;background:var(--bg);border:1px solid var(--border);color:#8b949e}
.detail-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center;padding:1rem}
.detail-modal.show{display:flex}
.detail-content{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;position:relative}
.detail-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--text);font-size:1.5rem;cursor:pointer}
.detail-swatch{width:100%;height:100px;border-radius:10px;margin-bottom:1rem}
.detail-content h2{margin-bottom:.3rem}
.detail-content .year{color:var(--accent);margin-bottom:1rem;font-size:.9rem}
.detail-content p{color:#8b949e;line-height:1.6;margin-bottom:1rem;font-size:.9rem}
.detail-content h4{margin:1rem 0 .5rem;color:var(--accent)}
.stats-bar{display:flex;gap:1rem;flex-wrap:wrap;margin:1.5rem 0;justify-content:center}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem;text-align:center;min-width:120px}
.stat-card .num{font-size:1.8rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.75rem;color:#8b949e;margin-top:.2rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div class="header">
<h1>📜 色彩历史</h1>
<p>探索人类色彩发现与应用的历程</p>
</div>
<div class="container">
<div class="stats-bar">
<div class="stat-card"><div class="num">40,000+</div><div class="label">年前 · 最早的颜料</div></div>
<div class="stat-card"><div class="num">140+</div><div class="label">种合成颜料</div></div>
<div class="stat-card"><div class="num">1666</div><div class="label">年 · 牛顿色轮</div></div>
<div class="stat-card"><div class="num">1856</div><div class="label">年 · 首个合成染料</div></div>
</div>

<div class="era-filter">
<div class="era-btn active" data-era="all">全部</div>
<div class="era-btn" data-era="ancient">古代</div>
<div class="era-btn" data-era="medieval">中世纪</div>
<div class="era-btn" data-era="renaissance">文艺复兴</div>
<div class="era-btn" data-era="modern">近现代</div>
<div class="era-btn" data-era="contemporary">当代</div>
</div>

<div class="timeline" id="timeline"></div>
</div>

<div class="detail-modal" id="detailModal" onclick="if(event.target===this)closeDetail()">
<div class="detail-content" id="detailContent"></div>
</div>

<script>
const colorHistory=[
{year:'约40000年前',era:'ancient',name:'赭石',color:'#9B4F0F',tags:['天然矿物','洞穴壁画'],
desc:'人类最早使用的颜料之一。在南非和澳大利亚的洞穴壁画中发现了使用赭石的证据。赭石由氧化铁制成，是最持久的天然颜料之一。',
significance:'标志着人类最早的艺术创作和象征性思维的出现。'},
{year:'约3000年前',era:'ancient',name:'靛蓝',color:'#00416A',tags:['植物染料','纺织'],
desc:'从靛蓝植物中提取的深蓝色染料。古埃及人使用靛蓝染色亚麻布，制作木乃伊的裹尸布。中国在周朝已有靛蓝染色的记载。',
significance:'靛蓝是人类最早使用的合成色之一，后来成为全球贸易的重要商品。'},
{year:'约2500年前',era:'ancient',name:'泰尔紫',color:'#66023C',tags:['贝壳提取','皇室专属'],
desc:'从骨螺中提取的紫色染料，需要约10000只蜗牛才能生产1克染料。因其极其昂贵，只有皇室和极富之人才能使用。',
significance:'紫色因此成为权力和财富的象征，这一传统延续至今。'},
{year:'约2000年前',era:'ancient',name:'中国朱砂',color:'#FF2400',tags:['硫化汞','中国'],
desc:'中国古人从辰砂矿中提取的鲜红色颜料。用于甲骨文书写、漆器和墓葬壁画。道家将其视为炼丹的重要原料。',
significance:'在中国文化中，朱砂红代表喜庆、驱邪，至今仍是重要的文化符号。'},
{year:'12世纪',era:'medieval',name:'群青',color:'#1B3A6B',tags:['青金石','比黄金贵'],
desc:'从阿富汗巴达赫尚省的青金石中提取。在中世纪欧洲，群青颜料的价格甚至超过黄金，只有最富有的赞助人才能负担。',
significance:'拉斐尔等文艺复兴大师用群青描绘圣母玛利亚的斗篷，象征神圣与纯洁。'},
{year:'14世纪',era:'renaissance',name:'威尼斯红',color:'#C0392B',tags:['氧化铁','威尼斯贸易'],
desc:'意大利威尼斯成为欧洲颜料贸易中心。威尼斯红是从当地氧化铁矿中提取的暖红色颜料，被广泛用于文艺复兴绘画。',
significance:'威尼斯的颜料贸易推动了文艺复兴艺术的繁荣。'},
{year:'1666',era:'modern',name:'牛顿色轮',color:'#FF6B6B',tags:['光学','科学'],
desc:'艾萨克·牛顿用三棱镜将白光分解为七色光谱，制作了第一个色轮。这一发现揭示了光与色彩的科学关系。',
significance:'开启了色彩科学的新纪元，为现代色彩理论奠定基础。'},
{year:'1704',era:'modern',name:'普鲁士蓝',color:'#003153',tags:['合成颜料','偶然发现'],
desc:'柏林颜料制造商迪斯巴赫在制造胭脂红时偶然发现了这种深蓝色颜料。这是第一个现代意义上的合成颜料。',
significance:'影响了梵高《星夜》等名画，也是日本浮世绘的重要颜料。'},
{year:'1797',era:'modern',name:'铬黄',color:'#FFC200',tags:['铬酸盐','梵高'],
desc:'从铬酸铅中提取的明亮黄色颜料。梵高的向日葵系列大量使用了铬黄，使其成为印象派的标志性颜色。',
significance:'虽然有毒，但铬黄的鲜艳度改变了19世纪绘画的色彩表达。'},
{year:'1856',era:'modern',name:'苯胺紫',color:'#8B008B',tags:['首个合成染料','意外发现'],
desc:'18岁的英国化学家威廉·珀金在尝试合成奎宁时意外发现了苯胺紫。这是第一个人工合成的有机染料。',
significance:'开创了合成染料工业，彻底改变了纺织业和色彩产业。'},
{year:'1868',era:'modern',name:'茜素红',color:'#E34234',tags:['合成替代','工业革命'],
desc:'两位德国化学家成功合成了从茜草根中提取的红色染料。这是第一个从天然染料成功复制的合成染料。',
significance:'标志着合成颜料开始替代天然颜料的时代。'},
{year:'1935',era:'contemporary',name:'法斯蒂夫蓝',color:'#0057B8',tags:['品牌色','广告'],
desc:'雀巢公司为其速溶咖啡广告创造了"法斯蒂夫蓝"（Fastive Blue），这种深蓝色成为品牌营销中色彩运用的经典案例。',
significance:'色彩开始被系统性地用于品牌识别和商业营销。'},
{year:'1963',era:'contemporary',name:'潘通色卡',color:'#FF6F61',tags:['标准化','设计行业'],
desc:'潘通公司推出了统一的色彩匹配系统，让全球设计师和印刷商能够精确沟通和复制颜色。',
significance:'潘通色卡成为全球设计行业的标准语言，每年发布年度代表色。'},
{year:'2000',era:'contemporary',name:'潘通千禧蓝',color:'#9BB7D4',tags:['千禧年','世纪之交'],
desc:'潘通选择"蔚蓝色"（Aqua Sky）作为2000年的年度代表色，象征新世纪的希望与宁静。',
significance:'开启了"年度代表色"的文化现象，影响时尚、设计和流行趋势。'},
{year:'2020',era:'contemporary',name:'经典蓝',color:'#0F4C81',tags:['Pantone年度色'],
desc:'潘通将"经典蓝"（Classic Blue）选为2021年年度代表色，象征稳定、信心和连接感。在疫情时代传递安定与平静。',
significance:'色彩选择反映了社会心理和时代精神。'}
];

function renderTimeline(era='all'){
const tl=document.getElementById('timeline');
const filtered=era==='all'?colorHistory:colorHistory.filter(c=>c.era===era);
tl.innerHTML=filtered.map((item,i)=>`
<div class="timeline-item" onclick="showDetail(${colorHistory.indexOf(item)})">
<div class="timeline-dot" style="border-color:${item.color};background:${item.color}"></div>
<div class="timeline-card">
<div class="timeline-year">${item.year}</div>
<h3><span class="swatch" style="background:${item.color}"></span>${item.name}</h3>
<p>${item.desc.slice(0,80)}...</p>
<div class="timeline-tags">${item.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
</div>
</div>
`).join('');
}

function showDetail(index){
const item=colorHistory[index];
const modal=document.getElementById('detailModal');
document.getElementById('detailContent').innerHTML=`
<button class="detail-close" onclick="closeDetail()">✕</button>
<div class="detail-swatch" style="background:${item.color}"></div>
<h2>${item.name}</h2>
<div class="year">${item.year}</div>
<p>${item.desc}</p>
<h4>文化意义</h4>
<p>${item.significance}</p>
<div class="timeline-tags" style="margin-top:1rem">${item.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
<div style="margin-top:1rem;padding:.8rem;background:var(--bg);border-radius:8px">
<div style="font-size:.8rem;color:#8b949e">颜色值</div>
<div style="font-family:monospace;margin-top:.3rem">${item.color}</div>
</div>
`;
modal.classList.add('show');
}

function closeDetail(){document.getElementById('detailModal').classList.remove('show')}

document.querySelectorAll('.era-btn').forEach(btn=>{
btn.addEventListener('click',()=>{
document.querySelectorAll('.era-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');renderTimeline(btn.dataset.era);
});
});

renderTimeline();
</script>
<script src="../i18n.js"></script>
</body>
</html>
