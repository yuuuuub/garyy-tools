<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👂 听音训练</title>
<meta property="og:title" content="👂 听音训练">
<meta property="og:description" content="👂 听音训练 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线听音训练工具，练习音程、和弦、音阶的听辨能力">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👂</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tab-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;font-weight:600}
.tab-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.play-area{text-align:center;padding:20px}
.play-big{width:80px;height:80px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:28px;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(99,102,241,.4)}
.play-big:hover{transform:scale(1.05);background:var(--accent-hover)}
.play-big:active{transform:scale(0.95)}
.options-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.option-btn{padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:13px;cursor:pointer;transition:all .2s;text-align:center}
.option-btn:hover{border-color:var(--accent)}
.option-btn.correct{background:var(--green);color:#fff;border-color:var(--green)}
.option-btn.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.option-btn:disabled{cursor:not-allowed;opacity:.7}
.score-bar{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--text-secondary)}
.score-bar span{font-weight:600}
.streak{color:var(--accent);font-weight:700}
.mode-desc{font-size:12px;color:var(--text-secondary);margin-bottom:12px;padding:8px;background:var(--preview-bg);border-radius:8px}
.footer{text-align:center;padding:20px 0;font-size:12px;color:var(--text-secondary)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@keyframes pulse{0%,100%{box-shadow:0 4px 20px rgba(99,102,241,.4)}50%{box-shadow:0 4px 30px rgba(99,102,241,.7)}}
.play-big.playing{animation:pulse 0.5s infinite}
</style>
</head>
<body>
<div class="container">
<header>
<h1>👂 听音训练</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">🎯 训练模式</div>
<div class="tab-bar" id="modeTabs"></div>
<div class="mode-desc" id="modeDesc"></div>
</div>
<div class="card">
<div class="card-title">🔊 播放</div>
<div class="play-area">
<button class="play-big" id="playBtn" onclick="playQuestion()">▶</button>
<div class="options-grid" id="optionsGrid"></div>
</div>
<div class="score-bar">
<span>得分: <span id="score">0</span>/<span id="total">0</span></span>
<span class="streak" id="streak"></span>
<button class="tab-btn" onclick="resetScore()" style="font-size:11px;padding:4px 10px">重置</button>
</div>
</div>
<div class="footer">听音训练 - Web Audio API | 点击播放按钮开始</div>
</div>
<script>
let audioCtx,currentMode=0,score=0,total=0,streak=0,answered=false;
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const MODES=[
{name:'🎵 音程辨认',desc:'听两个音之间的音程关系',type:'interval'},
{name:'🎸 和弦辨认',desc:'听和弦类型（大/小/减/增）',type:'chord'},
{name:'🎼 音阶辨认',desc:'听音阶类型（大调/小调/五声）',type:'scale'},
{name:'🎹 单音辨认',desc:'听辨单个音的音名',type:'note'}
];
const INTERVALS=[
{name:'纯一度',semitones:0},{name:'小二度',semitones:1},{name:'大二度',semitones:2},
{name:'小三度',semitones:3},{name:'大三度',semitones:4},{name:'纯四度',semitones:5},
{name:'三全音',semitones:6},{name:'纯五度',semitones:7},{name:'小六度',semitones:8},
{name:'大六度',semitones:9},{name:'小七度',semitones:10},{name:'大七度',semitones:11},
{name:'八度',semitones:12}
];
const CHORDS=[
{name:'大三和弦',intervals:[0,4,7]},{name:'小三和弦',intervals:[0,3,7]},
{name:'减三和弦',intervals:[0,3,6]},{name:'增三和弦',intervals:[0,4,8]}
];
const SCALES=[
{name:'大调',intervals:[0,2,4,5,7,9,11]},{name:'小调',intervals:[0,2,3,5,7,8,10]},
{name:'五声(大)',intervals:[0,2,4,7,9]},{name:'五声(小)',intervals:[0,3,5,7,10]},
{name:'蓝调',intervals:[0,3,5,6,7,10]}
];
let currentAnswer='';
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playFreq(freq,delay=0,dur=0.6,type='sine'){initAudio();const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type=type;osc.frequency.value=freq;g.gain.setValueAtTime(0.3,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+delay+dur);osc.connect(g);g.connect(audioCtx.destination);osc.start(audioCtx.currentTime+delay);osc.stop(audioCtx.currentTime+delay+dur)}
function freqFromNote(noteIdx,midi=60){return 440*Math.pow(2,(noteIdx+midi-69)/12)}
function buildModeTabs(){document.getElementById('modeTabs').innerHTML=MODES.map((m,i)=>`<button class="tab-btn${i===currentMode?' active':''}" onclick="selectMode(${i})">${m.name}</button>`).join('');document.getElementById('modeDesc').textContent=MODES[currentMode].desc}
function selectMode(i){currentMode=i;buildModeTabs();generateQuestion()}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generateQuestion(){answered=false;document.getElementById('playBtn').classList.remove('playing');const mode=MODES[currentMode];let options=[],answer='';if(mode.type==='interval'){const correct=INTERVALS[Math.floor(Math.random()*INTERVALS.length)];answer=correct.name;const opts=shuffle(INTERVALS.filter(i=>i.name!==correct.name).slice(0,5).concat(correct)).map(i=>i.name);options=opts;currentAnswer=correct.name;window._playData={type:'interval',semitones:correct.semitones}}else if(mode.type==='chord'){const correct=CHORDS[Math.floor(Math.random()*CHORDS.length)];answer=correct.name;const opts=shuffle(CHORDS.filter(c=>c.name!==correct.name).slice(0,2).concat(correct)).map(c=>c.name);options=opts;currentAnswer=correct.name;window._playData={type:'chord',intervals:correct.intervals}}else if(mode.type==='scale'){const correct=SCALES[Math.floor(Math.random()*SCALES.length)];answer=correct.name;const opts=shuffle(SCALES.filter(s=>s.name!==correct.name).slice(0,3).concat(correct)).map(s=>s.name);options=opts;currentAnswer=correct.name;window._playData={type:'scale',intervals:correct.intervals}}else{const noteIdx=Math.floor(Math.random()*12);answer=NOTES[noteIdx];const opts=shuffle([NOTES[noteIdx],...NOTES.filter((_,i)=>i!==noteIdx).sort(()=>Math.random()-.5).slice(0,5)]);options=opts;currentAnswer=answer;window._playData={type:'note',noteIdx}}
document.getElementById('optionsGrid').innerHTML=options.map(o=>`<button class="option-btn" onclick="checkAnswer(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
function playQuestion(){if(!window._playData)return;const btn=document.getElementById('playBtn');btn.classList.add('playing');setTimeout(()=>btn.classList.remove('playing'),1000);const d=window._playData;const rootNote=Math.floor(Math.random()*12);if(d.type==='interval'){playFreq(freqFromNote(rootNote,60));playFreq(freqFromNote(rootNote+d.semitones,60),0.7)}else if(d.type==='chord'){d.intervals.forEach((iv,i)=>{playFreq(freqFromNote(rootNote+iv,60),0,0.8);playFreq(freqFromNote(rootNote+iv,72),0,0.8)})}else if(d.type==='scale'){d.intervals.forEach((iv,i)=>{setTimeout(()=>playFreq(freqFromNote(rootNote+iv,60),0,0.3),i*300)})}else{playFreq(freqFromNote(d.noteIdx,60),0,1)}}
function checkAnswer(btn,answer){if(answered)return;answered=true;total++;const correct=answer===currentAnswer;if(correct){score++;streak++;btn.classList.add('correct')}else{streak=0;btn.classList.add('wrong');document.querySelectorAll('.option-btn').forEach(b=>{if(b.textContent===currentAnswer)b.classList.add('correct')})}updateScore();setTimeout(generateQuestion,1200)}
function updateScore(){document.getElementById('score').textContent=score;document.getElementById('total').textContent=total;document.getElementById('streak').textContent=streak>=3?`🔥 连续${streak}题`:''}
function resetScore(){score=0;total=0;streak=0;updateScore();generateQuestion()}
buildModeTabs();generateQuestion();
</script>
</body>
</html>
