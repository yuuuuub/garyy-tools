<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">

<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;--muted:#8b949e}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warning:#9a6700;--error:#cf222e;--muted:#656d76}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
nav .logo{font-size:18px;font-weight:600;color:var(--accent2)}
nav a{color:var(--accent);text-decoration:none;font-size:14px}
nav a:hover{color:var(--accent2)}
.container{display:flex;flex-direction:column;height:calc(100vh - 52px)}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{opacity:.8}
.workspace{display:flex;flex:1;overflow:hidden}
.editor-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.preview-panel{flex:1;display:flex;flex-direction:column}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;font-size:13px;color:var(--accent2);font-weight:500}
.editor-wrapper{flex:1;position:relative}
#cssEditor{width:100%;height:100%;background:var(--bg);border:none;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:14px;padding:12px;resize:none;outline:none;line-height:1.6}
.preview-frame{flex:1;border:none;background:#fff}
.templates{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.templates span{font-size:12px;color:var(--muted);margin-right:4px}
.template-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--accent2);cursor:pointer;transition:.2s}
.template-btn:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:768px){.workspace{flex-direction:column}.editor-panel{border-right:none;border-bottom:1px solid var(--border)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="CSS游乐场 - 在线CSS编辑器">
<meta property="og:description" content="在线CSS编辑器，实时编写和预览CSS样式效果">
<meta property="og:type" content="website">

</head>
<body>
<h1>CSS游乐场 - 在线CSS编辑器</h1>
<nav>
<span class="logo">CSS游乐场</span>
<a href="/index.html">← 返回工具箱</a>
</nav>
<div class="container">
<div class="toolbar">
<button class="btn btn-primary" onclick="applyCSS()">▶ 应用样式</button>
<button class="btn btn-secondary" onclick="formatCSS()">格式化</button>
<button class="btn btn-secondary" onclick="copyCSS()">复制CSS</button>
<button class="btn btn-secondary" onclick="resetCSS()">重置</button>
</div>
<div class="templates">
<span>模板:</span>
<button class="template-btn" data-css=".box{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:30px;border-radius:16px;text-align:center;font-size:20px;font-weight:bold;box-shadow:0 10px 40px rgba(102,126,234,0.4);}">渐变卡片</button>
<button class="template-btn" data-css=".box{display:flex;gap:10px;flex-wrap:wrap;padding:10px;}.item{background:var(--accent);color:white;padding:15px 20px;border-radius:8px;flex:1;min-width:80px;text-align:center;transition:transform 0.3s;}.item:hover{transform:scale(1.05);}">Flex布局</button>
<button class="template-btn" data-css=".box{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px;}.item{background:var(--card);border:1px solid var(--border);padding:20px;border-radius:8px;text-align:center;}.item:nth-child(odd){background:var(--accent);color:white;border-color:var(--accent);}">Grid网格</button>
<button class="template-btn" data-css=".box{position:relative;width:200px;height:200px;margin:20px auto;}.circle{width:100%;height:100%;background:conic-gradient(#f85149,#d29922,#3fb950,#3b82f6,#f85149);border-radius:50%;animation:spin 3s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}">动画圆</button>
<button class="template-btn" data-css=".box{text-align:center;padding:20px;}.glitch{font-size:48px;font-weight:bold;color:var(--text);text-shadow:2px 0 #f85149,-2px 0 #3b82f6;animation:glitch 0.5s infinite;}@keyframes glitch{0%,100%{text-shadow:2px 0 #f85149,-2px 0 #3b82f6;}50%{text-shadow:-2px 0 #f85149,2px 0 #3b82f6;}}">故障效果</button>
<button class="template-btn" data-css=".box{display:flex;justify-content:center;align-items:center;height:200px;background:var(--bg);}.neon{font-size:36px;color:var(--text);text-shadow:0 0 10px #fff,0 0 20px #fff,0 0 40px #3b82f6,0 0 80px #3b82f6;}">霓虹灯</button>
</div>
<div class="workspace">
<div class="editor-panel">
<div class="panel-header">CSS代码</div>
<div class="editor-wrapper">
<textarea id="cssEditor">.box {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 30px;
  border-radius: 16px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
}

.item {
  margin: 10px;
  padding: 10px 20px;
  background: rgba(255,255,255,0.2);
  border-radius: 8px;
  display: inline-block;
}</textarea>
</div>
</div>
<div class="preview-panel">
<div class="panel-header">实时预览</div>
<iframe id="previewFrame" class="preview-frame"></iframe>
</div>
</div>
</div>
<script>
const cssEditor = document.getElementById('cssEditor');
const previewFrame = document.getElementById('previewFrame');

const defaultCSS = `.box {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 30px;
  border-radius: 16px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}
.item {
  margin: 10px;
  padding: 10px 20px;
  background: rgba(255,255,255,0.2);
  border-radius: 8px;
  display: inline-block;
}`;

const previewHTML = `<!DOCTYPE html><html><head><style>body{margin:20px;font-family:sans-serif;}*{box-sizing:border-box;}</style></head><body><div class="box">CSS样式预览<div class="item">元素1</div><div class="item">元素2</div><div class="item">元素3</div></div></body></html>`;

function applyCSS() {
  const doc = previewFrame.contentDocument;
  doc.open();
  doc.write(previewHTML.replace('</head>', '<style>' + cssEditor.value + '</style></head>'));
  doc.close();
}

function formatCSS() {
  let css = cssEditor.value;
  css = css.replace(/\s*{\s*/g, ' {\n  ');
  css = css.replace(/\s*}\s*/g, '\n}\n');
  css = css.replace(/;\s*/g, ';\n  ');
  css = css.replace(/\n  \n/g, '\n');
  cssEditor.value = css.trim();
}

function copyCSS() {
  navigator.clipboard.writeText(cssEditor.value).then(() => alert('CSS已复制'));
}

function resetCSS() {
  cssEditor.value = defaultCSS;
  applyCSS();
}

document.querySelectorAll('.template-btn').forEach(btn => {
  btn.onclick = () => { cssEditor.value = btn.dataset.css; applyCSS(); };
});

cssEditor.addEventListener('input', applyCSS);
applyCSS();
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
