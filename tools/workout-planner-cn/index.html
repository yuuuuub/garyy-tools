<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💪 健身计划</title>
<meta name="description" content="自定义健身计划，包含动作组数、次数、重量，支持计时休息">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:480px){.fr,.fr3{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.timer-display{text-align:center;font-size:3rem;font-weight:700;color:var(--accent);padding:20px;font-variant-numeric:tabular-nums}
.exercise-item{background:var(--bg);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💪</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="💪 健身计划">
<meta property="og:description" content="自定义健身计划，包含动作组数、次数、重量，支持计时休息">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/workout-planner-cn/">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>💪 健身计划</h1><p>制定计划，科学训练</p></div>

<div class="cd">
<div class="gr">
<div class="st"><div class="nm" id="totalPlans">0</div><div class="lb">计划总数</div></div>
<div class="st"><div class="nm" id="totalLogs" style="color:var(--success)">0</div><div class="lb">训练次数</div></div>
<div class="st"><div class="nm" id="thisMonth" style="color:var(--warn)">0</div><div class="lb">本月训练</div></div>
</div>
</div>

<div class="cd"><h2>创建计划</h2>
<div><label>计划名称</label><input type="text" id="planName" placeholder="如：胸肌训练日"></div>
<div id="exerciseList"></div>
<div style="margin-top:8px">
<div class="fr3">
<div><label>动作</label><input type="text" id="exName" placeholder="动作名称"></div>
<div><label>组数</label><input type="number" id="exSets" value="3" min="1"></div>
<div><label>次数</label><input type="number" id="exReps" value="12" min="1"></div>
</div>
<div class="fr3">
<div><label>重量(kg)</label><input type="number" id="exWeight" value="0" min="0" step="0.5"></div>
<div><label>休息(秒)</label><input type="number" id="exRest" value="60" min="0" step="15"></div>
<div></div>
</div>
<div class="bg"><button onclick="addExercise()" style="font-size:.85rem">+ 添加动作</button><button class="sec" onclick="savePlan()" style="font-size:.85rem">保存计划</button></div>
</div></div>

<div class="cd"><h2>休息计时器</h2>
<div class="timer-display" id="timerDisplay">01:00</div>
<div class="fr">
<div><label>休息时间(秒)</label><input type="number" id="restTime" value="60" min="5" step="5"></div>
</div>
<div class="bg"><button onclick="startTimer()">▶ 开始</button><button class="sec" onclick="stopTimer()">⏹ 停止</button><button class="sec" onclick="resetTimer()">↺ 重置</button></div></div>

<div class="cd"><h2>我的计划</h2><div id="planList" class="es">暂无计划</div></div>

<div class="cd"><h2>训练记录</h2><div id="logList" class="es">暂无记录</div></div>
</div>
<script>
(function(){
var PLAN_KEY='workout_planner_plans';
var LOG_KEY='workout_planner_logs';
var plans=JSON.parse(localStorage.getItem(PLAN_KEY)||'[]');
var logs=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');
var tempExercises=[];
var timerInterval=null;
var timerSeconds=60;
var today=function(){return new Date().toISOString().slice(0,10)};

function savePlans(){localStorage.setItem(PLAN_KEY,JSON.stringify(plans));}
function saveLogs(){localStorage.setItem(LOG_KEY,JSON.stringify(logs));}

window.addExercise=function(){
var name=document.getElementById('exName').value.trim();
if(!name){alert('请输入动作名称');return;}
tempExercises.push({name:name,sets:parseInt(document.getElementById('exSets').value)||3,reps:parseInt(document.getElementById('exReps').value)||12,weight:parseFloat(document.getElementById('exWeight').value)||0,rest:parseInt(document.getElementById('exRest').value)||60});
document.getElementById('exName').value='';
renderTempExercises();
};

window.removeTempEx=function(i){tempExercises.splice(i,1);renderTempExercises();};

function renderTempExercises(){
var el=document.getElementById('exerciseList');
if(!tempExercises.length){el.innerHTML='';return;}
el.innerHTML=tempExercises.map(function(e,i){
return '<div class="exercise-item"><div><strong>'+e.name+'</strong><br><span style="font-size:.8rem;color:var(--text2)">'+e.sets+'组 × '+e.reps+'次 · '+e.weight+'kg · 休息'+e.rest+'秒</span></div><button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="removeTempEx('+i+')">✕</button></div>';
}).join('');
}

window.savePlan=function(){
var name=document.getElementById('planName').value.trim();
if(!name||!tempExercises.length){alert('请输入计划名称并添加动作');return;}
plans.push({id:Date.now(),name:name,exercises:tempExercises.slice()});
savePlans();tempExercises=[];
document.getElementById('planName').value='';
renderTempExercises();render();
};

window.deletePlan=function(id){plans=plans.filter(function(p){return p.id!==id});savePlans();render();};

window.startWorkout=function(id){
var plan=plans.find(function(p){return p.id===id});
if(!plan)return;
var dur=prompt('本次训练时长(分钟)','60');
if(dur&&parseInt(dur)>0){
logs.push({id:Date.now(),planName:plan.name,planId:plan.date:today(),duration:parseInt(dur),exercises:plan.exercises.length});
saveLogs();render();
}
};

window.deleteLog=function(id){logs=logs.filter(function(l){return l.id!==id});saveLogs();render();};

function formatTime(s){var m=Math.floor(s/60);var sec=s%60;return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;}
window.startTimer=function(){
stopTimer();
timerSeconds=parseInt(document.getElementById('restTime').value)||60;
var remaining=timerSeconds;
document.getElementById('timerDisplay').textContent=formatTime(remaining);
timerInterval=setInterval(function(){
remaining--;
document.getElementById('timerDisplay').textContent=formatTime(remaining);
if(remaining<=0){stopTimer();document.getElementById('timerDisplay').textContent='完成！';try{new Audio('data:audio/wav;base64,UklGRl9vT19teleVBmb3JtYXQ=').play();}catch(e){}}}
,1000);
};
window.stopTimer=function(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}};
window.resetTimer=function(){stopTimer();var s=parseInt(document.getElementById('restTime').value)||60;document.getElementById('timerDisplay').textContent=formatTime(s);};

function render(){
document.getElementById('totalPlans').textContent=plans.length;
document.getElementById('totalLogs').textContent=logs.length;
var cm=new Date().toISOString().slice(0,7);
document.getElementById('thisMonth').textContent=logs.filter(function(l){return l.date&&l.date.indexOf(cm)===0;}).length;

var pEl=document.getElementById('planList');
if(!plans.length){pEl.innerHTML='<div class="es">暂无计划</div>';return;}
pEl.innerHTML=plans.map(function(p){
return '<div class="li"><div style="flex:1"><strong>'+p.name+'</strong><br><span style="font-size:.8rem;color:var(--text2)">'+p.exercises.length+'个动作</span></div><div style="display:flex;gap:8px"><button style="padding:4px 12px;font-size:.8rem" onclick="startWorkout('+p.id+')">开始</button><button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="deletePlan('+p.id+')">删</button></div></div>';
}).join('');

var lEl=document.getElementById('logList');
if(!logs.length){lEl.innerHTML='<div class="es">暂无记录</div>';return;}
lEl.innerHTML=logs.slice().reverse().map(function(l){
return '<div class="li"><div style="flex:1"><strong>'+l.planName+'</strong> <span class="tag s">'+l.duration+'分钟</span><br><span style="font-size:.8rem;color:var(--text2)">'+l.exercises+'个动作 · '+l.date+'</span></div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="deleteLog('+l.id+')">✕</button></div>';
}).join('');
}
render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
