<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表情拼图</title>
<meta name="description" content="Emoji表情拼图游戏，根据Emoji猜测对应词语">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent-hover:#2563eb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8rem;margin:20px 0 8px}
.sub{color:#8b949e;margin-bottom:24px;font-size:0.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:640px;margin-bottom:16px}
.stats{display:flex;justify-content:space-around;text-align:center;margin-bottom:20px}
.stat-item .num{font-size:1.6rem;font-weight:bold}
.stat-item .label{font-size:0.8rem;color:#8b949e}
.difficulty{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.diff-btn{padding:8px 20px;border:2px solid var(--border);border-radius:8px;background:transparent;color:var(--text);cursor:pointer;font-size:0.9rem;transition:all .2s}
.diff-btn.active{border-color:var(--accent);background:rgba(59,130,246,0.1);color:var(--accent)}
.diff-btn:hover{border-color:var(--accent)}
.board{display:grid;gap:8px;justify-content:center;margin:0 auto}
.card-cell{width:80px;height:80px;background:var(--bg);border:2px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;cursor:pointer;transition:all .3s;user-select:none;perspective:600px}
.card-cell .card-inner{width:100%;height:100%;position:relative;transition:transform 0.5s;transform-style:preserve-3d}
.card-cell.flipped .card-inner{transform:rotateY(180deg)}
.card-cell .card-front,.card-cell .card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border-radius:10px}
.card-cell .card-front{background:var(--accent);font-size:1.4rem}
.card-cell .card-back{background:var(--bg);border:2px solid var(--border);transform:rotateY(180deg)}
.card-cell.matched .card-back{border-color:#238636;background:rgba(35,134,54,0.1)}
.card-cell:hover:not(.flipped):not(.matched){border-color:var(--accent)}
.btn-row{display:flex;gap:10px;margin-top:14px;justify-content:center}
button{padding:10px 20px;border:none;border-radius:8px;font-size:0.95rem;cursor:pointer;font-weight:500;transition:background .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--border);color:var(--text)}.btn-secondary:hover{background:#444c56}
.complete{text-align:center;padding:20px}
.complete h2{font-size:1.5rem;margin-bottom:10px}
.complete .score{font-size:2rem;font-weight:bold;color:var(--accent);margin:10px 0}
.complete .detail{color:#8b949e;font-size:0.9rem}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:10px 24px;border-radius:8px;font-size:0.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="表情拼图">
  <meta property="og:description" content="Emoji表情拼图游戏，根据Emoji猜测对应词语">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/emoji-puzzle/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<h1>表情拼图</h1>
<p class="sub">翻开卡牌，找出所有相同的表情对</p>
<div class="card">
<div class="difficulty" id="diffBtns">
<button class="diff-btn active" onclick="setDifficulty(4,this)">简单 (4对)</button>
<button class="diff-btn" onclick="setDifficulty(6,this)">普通 (6对)</button>
<button class="diff-btn" onclick="setDifficulty(8,this)">困难 (8对)</button>
<button class="diff-btn" onclick="setDifficulty(10,this)">地狱 (10对)</button>
</div>
<div class="stats">
<div class="stat-item"><div class="num" id="moveCount">0</div><div class="label">翻牌次数</div></div>
<div class="stat-item"><div class="num" id="matchCount">0</div><div class="label">匹配对数</div></div>
<div class="stat-item"><div class="num" id="timer">0:00</div><div class="label">用时</div></div>
</div>
<div class="board" id="board"></div>
<div class="btn-row">
<button class="btn-primary" onclick="startGame()">重新开始</button>
</div>
</div>
<div class="card" id="completeCard" style="display:none">
<div class="complete">
<h2>🎉 恭喜完成！</h2>
<div class="score" id="finalScore"></div>
<div class="detail" id="finalDetail"></div>
<div style="margin:16px 0">
<button class="btn-primary" onclick="startGame()">再来一局</button>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const ALL_EMOJIS=['😀','😃','😄','😁','😆','😅','🤣','😂','🙂','😉','😊','😇','🥰','😍','🤩','😘','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔','😐','😑','😏','😒','🙄','😬','😌','😔','😪','😴','😷','🤒','🤕','🤢','🤮','🥵','🥶','🥴','😵','🤯','🤠','🥳','😎','🤓','😕','😟','😮','😲','😳','🥺','😦','😧','😨','😰','😥','😢','😭','😱','😖','😣','😞','😓','😩','😫','😤','😡','😠','🤬','💀','💩','🤡','👻','👽','🤖','❤️','🧡','💛','💚','💙','💜','🖤','🤍','💔','💕','💞','💓','💗','💖','💘','💝','👍','👎','👌','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','👇','☝️','✋','🤚','💪','🙏','🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦆','🦄','🐝','🐛','🦋','🐢','🐍','🐙','🦑','🦐','🦀','🐟','🐬','🐳','🐋','🦈','🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🫐','🍒','🍑','🥭','🍍','🍅','🥑','🍆','🥕','🌽','🌶️','🍄','🍞','🥐','🧀','🍖','🍗','🥩','🍔','🍟','🍕','🌮','🥚','🍳','🍜','🍝','🍣','🥟','🍦','🍩','🍪','🎂','🍰','☕','🍵','🍷','🍸','🍹','✈️','🚀','⛵','🚂','🚗','🚕','🚌','🏎️','🚓','🚑','🚒','🏍️','🚲','🚁','🏠','🏡','🏢','🏨','🏪','🏫','🏰','🗼','🗽','⛲','⛰️','🏔️','🌋','🏖️','🌅','🌌','⭐','🌟','✨','⚡','🔥','💥','☀️','🌈','❄️','💧','🌊','✅','❌','⭕','❓','❗','💯','🔴','🟡','🟢','🔵','📱','💻','⌨️','🖥️','📷','📹','🎥','📺','💡','🔧','🔨','🎁','🎈','🎉','🧧','✉️','📝','✂️','💎'];
let pairCount=6;
let cards=[];
let flipped=[];
let matched=new Set();
let moves=0;
let timerInterval=null;
let seconds=0;
let gameStarted=false;
let isProcessing=false;
function setDifficulty(n,el){
pairCount=n;
document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
startGame();
}
function shuffle(arr){
const a=[...arr];
for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
return a;
}
function startGame(){
clearInterval(timerInterval);
seconds=0;moves=0;flipped=[];matched.clear();gameStarted=false;isProcessing=false;
document.getElementById('moveCount').textContent='0';
document.getElementById('matchCount').textContent='0';
document.getElementById('timer').textContent='0:00';
document.getElementById('completeCard').style.display='none';
const emojis=shuffle(ALL_EMOJIS).slice(0,pairCount);
cards=shuffle([...emojis,...emojis].map((e,i)=>({id:i,emoji:e})));
const cols=pairCount<=4?4:pairCount<=6?4:pairCount<=8?4:5;
document.getElementById('board').style.gridTemplateColumns=`repeat(${cols},80px)`;
renderBoard();
}
function renderBoard(){
document.getElementById('board').innerHTML=cards.map((c,i)=>
`<div class="card-cell${flipped.includes(i)?' flipped':''}${matched.has(c.emoji)?' matched':''}" onclick="flipCard(${i})">
<div class="card-inner">
<div class="card-front">❓</div>
<div class="card-back">${c.emoji}</div>
</div>
</div>`
).join('');
}
function flipCard(idx){
if(isProcessing)return;
if(flipped.length>=2)return;
if(flipped.includes(idx))return;
if(matched.has(cards[idx].emoji))return;
if(!gameStarted){gameStarted=true;startTimer();}
flipped.push(idx);
renderBoard();
if(flipped.length===2){
moves++;
document.getElementById('moveCount').textContent=moves;
isProcessing=true;
const [a,b]=flipped;
if(cards[a].emoji===cards[b].emoji){
matched.add(cards[a].emoji);
document.getElementById('matchCount').textContent=matched.size;
setTimeout(()=>{
flipped=[];
isProcessing=false;
renderBoard();
if(matched.size===pairCount){
clearInterval(timerInterval);
showComplete();
}
},300);
}else{
setTimeout(()=>{
flipped=[];
isProcessing=false;
renderBoard();
},800);
}
}
}
function startTimer(){
timerInterval=setInterval(()=>{
seconds++;
const m=Math.floor(seconds/60);
const s=seconds%60;
document.getElementById('timer').textContent=`${m}:${s.toString().padStart(2,'0')}`;
},1000);
}
function showComplete(){
const timeStr=document.getElementById('timer').textContent;
const stars=moves<=pairCount*2+2?'⭐⭐⭐⭐⭐':moves<=pairCount*3?'⭐⭐⭐⭐':moves<=pairCount*4?'⭐⭐⭐':moves<=pairCount*6?'⭐⭐':'⭐';
const score=Math.max(100,500-moves*10+pairCount*20);
document.getElementById('finalScore').textContent=`${score} 分`;
document.getElementById('finalDetail').innerHTML=`用时 ${timeStr} · 翻牌 ${moves} 次 · ${stars}`;
document.getElementById('completeCard').style.display='block';
}
startGame();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
