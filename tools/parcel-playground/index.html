<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parcel 游乐场</title>
<meta name="description" content="Parcel打包工具在线实验环境">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;--muted:#8b949e;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.navbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
.navbar a{color:var(--accent);text-decoration:none;font-size:.9rem}
.navbar h1{font-size:1.2rem;flex:1}
.navbar .icon{font-size:1.4rem}
.container{max-width:1200px;margin:0 auto}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:.85rem;transition:.2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{display:none}.panel.active{display:block}
.editor-section{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.editor-section{grid-template-columns:1fr}}
.editor-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.editor-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border)}
.editor-header span{font-size:.8rem;color:var(--muted)}
textarea{width:100%;min-height:350px;padding:14px;border:none;background:var(--bg);color:var(--text);font-family:'Fira Code',monospace;font-size:.82rem;line-height:1.6;resize:vertical;outline:none;tab-size:2}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;transition:.2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent)}
.cmd-list{display:flex;flex-direction:column;gap:8px}
.cmd-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:.2s}
.cmd-item:hover{border-color:var(--accent)}
.cmd-item .cmd{font-family:monospace;color:var(--accent);font-size:.85rem;margin-bottom:4px}
.cmd-item .desc{font-size:.78rem;color:var(--muted)}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ref-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;transition:.2s}
.ref-card:hover{border-color:var(--accent)}
.ref-card h3{font-size:.9rem;margin-bottom:8px;color:var(--accent)}
.ref-card pre{background:var(--bg);padding:10px;border-radius:6px;font-size:.78rem;overflow-x:auto;color:var(--text);line-height:1.5}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:8px 18px;border-radius:8px;font-size:.85rem;opacity:0;transition:.3s;z-index:100}
.toast.show{opacity:1}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Parcel 游乐场">
  <meta property="og:description" content="Parcel打包工具在线实验环境">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/parcel-playground/">
</head>
<body>
<div class="container">
<div class="navbar">
<a href="/index.html">← 返回</a>
<span class="icon">📦</span>
<h1>Parcel 游乐场</h1>
</div>

<div class="tabs">
<div class="tab active" onclick="switchTab('editor',this)">配置编辑器</div>
<div class="tab" onclick="switchTab('zero',this)">零配置说明</div>
<div class="tab" onclick="switchTab('pkg',this)">package.json 配置</div>
<div class="tab" onclick="switchTab('commands',this)">常用命令</div>
</div>

<div class="panel active" id="panel-editor">
<div class="editor-section">
<div class="editor-box">
<div class="editor-header"><span>.parcelrc</span><button class="btn btn-outline" onclick="copyCode('configEditor')">复制</button></div>
<div class="editor-body">
<textarea id="configEditor">{
  "extends": "@parcel/config-default",
  "resolvers": ["./my-resolver"],
  "transformers": {
    "*.svg": ["@parcel/transformer-svg"],
    "*.css": ["@parcel/transformer-css"]
  },
  "optimizers": {
    "*.js": ["@parcel/optimizer-terser"],
    "*.css": ["@parcel/optimizer-cssnano"],
    "*.html": ["@parcel/optimizer-html"]
  },
  "namers": ["@parcel/namer-default"],
  "packagers": {
    "*.js": "@parcel/packager-js",
    "*.css": "@parcel/packager-css"
  },
  "runtime": {
    "global": "@parcel/runtime-js"
  }
}</textarea>
</div>
</div>
<div class="editor-box">
<div class="editor-header"><span>说明</span></div>
<div class="editor-body">
<textarea readonly>Parcel 2 - 零配置的打包工具

🎯 核心理念：
• 零配置开箱即用
• 自动检测语言和工具
• 极速增量编译
• 内置代码分割

📋 自动支持：
• TypeScript / JSX / TSX
• CSS / SCSS / LESS / PostCSS
• 图片优化（压缩/转格式）
• HTML 入口
• Web Workers
• Service Workers

🔧 可选自定义：
• .parcelrc - 覆盖默认行为
• package.json 中的 targets
• browserslist 配置

💡 与 Webpack 区别：
Parcel 更偏向约定大于配置，大多数场景无需任何配置文件。</textarea>
</div>
</div>
</div>
<div class="btn-row">
<button class="btn btn-primary" onclick="genTargets()">生成 targets 配置</button>
<button class="btn btn-outline" onclick="genReact()">生成 React 配置</button>
</div>
</div>

<div class="panel" id="panel-zero">
<div class="ref-grid">
<div class="ref-card"><h2>零配置启动</h2><pre># 只需一个 HTML 文件作为入口
npx parcel index.html

# Parcel 自动检测：
✅ HTML 中引用的 <script> 标签
✅ import/require 语句
✅ CSS @import
✅ 图片 url() 引用
✅ 自动转译 TypeScript/JSX
✅ 自动压缩和优化</pre></div>
<div class="ref-card"><h3>自动转换</h3><pre># Parcel 会自动处理：
• TypeScript → JavaScript
• JSX → JavaScript
• SCSS/LESS → CSS
• 图片压缩和优化
• HTML 压缩
• 代码分割
• HMR (热模块替换)

# 无需安装任何 loader 或 plugin</pre></div>
<div class="ref-card"><h3>多入口支持</h3><pre># 每个页面都可以是独立入口
npx parcel index.html admin.html

# Parcel 会自动：
• 为每个入口创建构建
• 共享代码自动提取
• 按需加载优化</pre></div>
<div class="ref-card"><h3>内置优化</h3><pre># 生产构建自动执行：
• JavaScript 压缩 (Terser)
• CSS 压缩 (cssnano)
• HTML 压缩
• 图片压缩
• 自动添加内容哈希
• Tree Shaking
• Scope Hoisting</pre></div>
</div>
</div>

<div class="panel" id="panel-pkg">
<div class="ref-grid">
<div class="ref-card"><h3>基础 package.json</h3><pre>{
  "name": "my-app",
  "version": "1.0.0",
  "source": "src/index.html",
  "scripts": {
    "start": "parcel",
    "build": "parcel build"
  },
  "browserslist": "> 0.5%, last 2 versions",
  "devDependencies": {
    "parcel": "^2.12.0"
  }
}</pre></div>
<div class="ref-card"><h3>多目标构建</h3><pre>{
  "source": "src/index.html",
  "targets": {
    "default": {
      "distDir": "./dist",
      "publicUrl": "./"
    },
    "modern": {
      "engines": { "browsers": "last 1 version" }
    },
    "legacy": {
      "engines": { "browsers": "> 0.5%" }
    }
  }
}</pre></div>
<div class="ref-card"><h3>库模式</h3><pre>{
  "source": "src/index.js",
  "main": "dist/index.cjs.js",
  "module": "dist/index.esm.js",
  "types": "dist/index.d.ts",
  "targets": {
    "main": {
      "context": "node",
      "outputFormat": "commonjs"
    },
    "module": {
      "outputFormat": "esmodule"
    }
  }
}</pre></div>
</div>
</div>

<div class="panel" id="panel-commands">
<div class="cmd-list">
<div class="cmd-item" onclick="copyCmd(this)"><div class="cmd">npx parcel index.html</div><div class="desc">启动开发服务器</div></div>
<div class="cmd-item" onclick="copyCmd(this)"><div class="cmd">npx parcel build index.html</div><div class="desc">生产构建</div></div>
<div class="cmd-item" onclick="copyCmd(this)"><div class="cmd">npx parcel index.html --port 8080</div><div class="desc">指定端口启动</div></div>
<div class="cmd-item" onclick="copyCmd(this)"><div class="cmd">npx parcel index.html --open</div><div class="desc">构建后自动打开浏览器</div></div>
<div class="cmd-item" onclick="copyCmd(this)"><div class="cmd">npx parcel build index.html --no-source-maps</div><div class="desc">不生成 Source Map</div></div>
<div class="cmd-item" onclick="copyCmd(this)"><div class="cmd">npx parcel build index.html --public-url ./</div><div class="desc">设置公共资源路径</div></div>
<div class="cmd-item" onclick="copyCmd(this)"><div class="cmd">npm install --save-dev parcel</div><div class="desc">安装 Parcel</div></div>
</div>
</div>

</div>
<div class="toast" id="toast"></div>
<script>
function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function copyCode(id){const ta=document.getElementById(id);ta.select();document.execCommand('copy');showToast('已复制到剪贴板')}
function copyCmd(el){navigator.clipboard.writeText(el.querySelector('.cmd').textContent).then(()=>showToast('命令已复制'))}
function genTargets(){
  document.getElementById('configEditor').value=`{
  "source": "src/index.html",
  "targets": {
    "default": {
      "distDir": "./dist",
      "publicUrl": "./",
      "optimize": true
    },
    "modern": {
      "engines": { "browsers": "last 2 versions" },
      "outputFormat": "esmodule"
    },
    "legacy": {
      "engines": { "browsers": "> 0.5%" },
      "outputFormat": "commonjs"
    }
  }
}`;
  showToast('targets 配置已加载');
}
function genReact(){
  document.getElementById('configEditor').value=`{
  "extends": "@parcel/config-default",
  "transformers": {
    "*.{js,jsx,ts,tsx}": ["@parcel/transformer-js"],
    "*.{css,scss,less}": ["@parcel/transformer-css"]
  }
}

# package.json 配置
{
  "scripts": {
    "start": "parcel src/index.html",
    "build": "parcel build src/index.html"
  },
  "devDependencies": {
    "parcel": "^2.12.0",
    "react": "^18.2.0",
    "react-dom": "^18.2.0"
  }
}`;
  showToast('React 配置已加载');
}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
