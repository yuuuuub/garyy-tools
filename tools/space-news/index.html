<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太空新闻</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem}.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.news-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-top:10px}
.news-title{font-size:.95rem;font-weight:600;color:var(--text)}
.news-summary{font-size:.82rem;color:var(--text2);margin-top:8px;line-height:1.5}
.news-meta{display:flex;gap:12px;margin-top:10px;font-size:.78rem;color:var(--text2)}
.news-source{padding:2px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:.75rem}
.filter-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.filter-btn{padding:6px 14px;background:var(--card);border:1px solid var(--border);border-radius:16px;color:var(--text2);cursor:pointer;font-size:.8rem;transition:.2s}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
</style>
</head>
<body>
<div class="container">
<header><h1>🚀 太空新闻</h1><p class="sub">中国航天 · 深空探测 · 卫星导航</p></header>
<div class="filter-bar" id="filterBar"></div>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var news=[
{t:'天宫空间站全面建成',s:'中国空间站天宫号于2022年底全面建成，标志着中国成为继俄罗斯之后第二个独立建造空间站的国家。空间站由天和核心舱、问天实验舱和梦天实验舱组成。',src:'中国载人航天工程办公室',d:'2022-12-31',c:'中国航天'},
{t:'嫦娥六号成功实现月背采样返回',s:'嫦娥六号探测器成功在月球背面南极-艾特肯盆地着陆，完成人类首次月背采样任务，携带约1935.3克月球样品安全返回地球。',src:'国家航天局',d:'2024-06-25',c:'深空探测'},
{t:'天问一号火星探测任务圆满成功',s:'天问一号探测器成功着陆火星乌托邦平原，祝融号火星车开展巡视探测，获取了大量科学数据。中国成为第二个成功着陆火星的国家。',src:'国家航天局',d:'2021-05-15',c:'深空探测'},
{t:'北斗三号全球卫星导航系统正式开通',s:'北斗三号全球卫星导航系统正式开通，由30颗卫星组成，可提供全球范围内全天候、全天时、高精度定位导航授时服务。',src:'中国卫星导航系统管理办公室',d:'2020-07-31',c:'卫星导航'},
{t:'长征五号B遥四运载火箭成功发射梦天实验舱',s:'长征五号B遥四运载火箭在文昌航天发射场成功将梦天实验舱送入预定轨道，中国空间站建造进入收官阶段。',src:'中国航天科技集团',d:'2022-10-31',c:'中国航天'},
{t:'嫦娥五号任务圆满成功',s:'嫦娥五号探测器成功携带月球样品返回地球，这是中国首次实现地外天体采样返回，获得约1731克月球样品。',src:'国家航天局',d:'2020-12-17',c:'深空探测'},
{t:'神舟十七号航天员乘组成功出舱',s:'神舟十七号航天员乘组成功完成出舱活动，航天员汤洪波、唐胜杰、江新林在空间站机械臂支持下，顺利完成各项既定任务。',src:'中国载人航天工程办公室',d:'2024-03-01',c:'中国航天'},
{t:'鹊桥二号中继星成功发射',s:'鹊桥二号中继星成功发射，将为嫦娥六号月背采样任务提供通信支持，是中国探月工程四期的重要组成部分。',src:'国家航天局',d:'2024-03-20',c:'深空探测'},
{t:'风云三号G星成功发射',s:'风云三号G星成功发射，是中国首颗降水测量卫星，标志着中国成为继美国和日本之后第三个拥有降水测量卫星的国家。',src:'中国气象局',d:'2023-04-16',c:'卫星导航'},
{t:'快舟一号甲运载火箭成功发射升空',s:'快舟一号甲固体运载火箭成功将连理卫星送入预定轨道，该卫星主要用于验证空间新技术试验。',src:'中国航天科工集团',d:'2024-02-03',c:'中国航天'},
{t:'实践二十一号卫星成功发射',s:'实践二十一号卫星成功发射，主要用于空间碎片减缓技术试验验证，展示了中国在空间环境保护方面的技术实力。',src:'中国航天科技集团',d:'2024-01-11',c:'中国航天'},
{t:'长征二号丁运载火箭成功发射5颗卫星',s:'长征二号丁运载火箭在太原卫星发射中心成功将5颗卫星送入预定轨道，用于科学实验和遥感探测。',src:'中国航天科技集团',d:'2024-01-17',c:'中国航天'},
{t:'SpaceX星舰完成第四次试飞',s:'SpaceX星舰完成第四次飞行测试，成功实现了助推器软着陆和飞船溅落，标志着可重复使用运载火箭技术的重大突破。',src:'SpaceX',d:'2024-06-06',c:'国际动态'},
{t:'韦伯太空望远镜发现最遥远星系',s:'詹姆斯·韦伯太空望远镜发现了迄今最遥远的星系，距离地球约134亿光年，为研究宇宙早期演化提供了重要线索。',src:'NASA',d:'2024-03-15',c:'国际动态'},
{t:'阿尔忒弥斯计划载人绕月任务推迟',s:'NASA宣布阿尔忒弥斯计划载人绕月任务（Artemis II）推迟至2025年9月，以确保航天员安全和系统可靠性。',src:'NASA',d:'2024-01-09',c:'国际动态'},
{t:'嫦娥七号将于2026年前后发射',s:'嫦娥七号探测器计划于2026年前后发射，将对月球南极进行详查，寻找水冰存在的证据，为后续建立月球科研站做准备。',src:'国家航天局',d:'2024-04-25',c:'深空探测'},
{t:'中国计划2030年前实现载人登月',s:'中国载人登月工程稳步推进，计划在2030年前实现中国人首次登陆月球。长征十号运载火箭和新一代载人飞船研制进展顺利。',src:'中国载人航天工程办公室',d:'2024-02-24',c:'中国航天'},
{t:'国际空间站即将退役',s:'国际空间站计划于2030年退役，美国已开始规划后续商业空间站建设，多个国家正在评估未来太空合作模式。',src:'NASA',d:'2024-01-30',c:'国际动态'},
{t:'印度月船三号成功着陆月球南极',s:'印度月船三号探测器成功着陆月球南极附近区域，使印度成为第四个在月球表面软着陆的国家。',src:'ISRO',d:'2023-08-23',c:'国际动态'},
{t:'中国商业航天蓬勃发展',s:'中国商业航天企业数量快速增长，蓝箭航天、星际荣耀、零壹空间等企业在运载火箭、卫星制造等领域取得重要突破。',src:'中国航天报',d:'2024-03-10',c:'中国航天'}
];
var categories=['全部','中国航天','深空探测','卫星导航','国际动态'];
var currentCat='全部';
function renderFilter(){
var html='';
categories.forEach(function(c){
html+='<button class="filter-btn'+(c===currentCat?' active':'')+'" onclick="filterNews(\''+c+'\')">'+c+'</button>';
});
document.getElementById('filterBar').innerHTML=html;
}
window.filterNews=function(cat){currentCat=cat;renderFilter();render();};
function render(){
var filtered=news.filter(function(n){return currentCat==='全部'||n.c===currentCat;});
var html='';
filtered.forEach(function(n){
html+='<div class="news-item">';
html+='<div class="news-title">'+n.t+'</div>';
html+='<div class="news-summary">'+n.s+'</div>';
html+='<div class="news-meta"><span class="news-source">'+n.src+'</span><span>'+n.d+'</span></div>';
html+='</div>';
});
document.getElementById('app').innerHTML=html;
}
renderFilter();
render();
})();
</script>
</body>
</html>
