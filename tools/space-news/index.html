<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太空新闻</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;color:var(--text)}
.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.refresh-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.85rem;transition:.2s}
.refresh-btn:hover{background:#1c2333;border-color:var(--blue)}
.loading{text-align:center;padding:60px 0}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:.85rem}
.error{text-align:center;padding:40px 0;color:var(--red);font-size:.9rem}
.retry-btn{margin-top:10px;padding:8px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.85rem}
.news-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.news-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:.2s}
.news-item:hover{border-color:var(--blue)}
.news-title{font-size:.95rem;font-weight:600;color:var(--text);text-decoration:none;display:block;line-height:1.4}
.news-title:hover{color:var(--blue)}
.news-summary{font-size:.82rem;color:var(--text2);margin-top:8px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news-meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.78rem;color:var(--text2)}
.news-meta span{display:inline-flex;align-items:center;gap:4px}
.news-source{padding:2px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:.75rem}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🚀 太空新闻</h1>
<p class="sub">Spaceflight News API</p>
<button class="refresh-btn" onclick="loadNews()">🔄 刷新</button>
</header>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
window.loadNews=function(){
app.innerHTML='<div class="loading"><div class="spinner"></div><p>加载新闻...</p></div>';
fetch('https://api.spaceflightnewsapi.net/v4/articles/?limit=10')
.then(function(r){if(!r.ok)throw new Error('请求失败 ('+r.status+')');return r.json();})
.then(function(data){
var articles=data.results;
if(!articles||!articles.length){app.innerHTML='<div class="error"><p>暂无新闻</p></div>';return;}
var html='<div class="news-list">';
articles.forEach(function(a){
var title=a.title||'无标题';
var summary=a.summary||'暂无摘要';
var published=new Date(a.published_at).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
var source=a.news_site||'未知来源';
var url=a.url||'#';
html+='<div class="news-item">';
html+='<a class="news-title" href="'+url+'" target="_blank" rel="noopener">'+title+'</a>';
html+='<div class="news-summary">'+summary+'</div>';
html+='<div class="news-meta">';
html+='<span>📅 '+published+'</span>';
html+='<span class="news-source">'+source+'</span>';
if(a.launches&&a.launches.length)html+='<span>🚀 '+a.launches.length+' 次发射</span>';
if(a.events&&a.events.length)html+='<span>📌 '+a.events.length+' 个事件</span>';
html+='</div></div>';
});
html+='</div>';
app.innerHTML=html;
})
.catch(function(e){
app.innerHTML='<div class="error"><p>⚠️ '+e.message+'</p><button class="retry-btn" onclick="loadNews()">重试</button></div>';
});
};
loadNews();
})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
