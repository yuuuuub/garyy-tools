<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国武术发展史 - Chinese Martial Arts History</title>
<meta name="description" content="中国武术发展史，从先秦武术萌芽到现代武术运动的完整历史脉络">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国武术发展史 - Chinese Martial Arts History">
<meta property="og:description" content="中国武术发展史，从先秦武术萌芽到现代武术运动的完整历史脉络">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-martial-arts-history-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a05 0%,#2a1510 50%,#3d2015 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a,#b06a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.timeline{position:relative;padding:20px 0}
.timeline::before{content:'';position:absolute;left:30px;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:2px}
.timeline-item{position:relative;padding:0 0 30px 70px}
.timeline-dot{position:absolute;left:20px;top:0;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);z-index:1}
.timeline-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s}
.timeline-card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.timeline-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.timeline-card .t-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4em;flex-shrink:0;background:rgba(232,168,124,0.15);color:var(--accent)}
.timeline-card .t-title{font-size:1.2em;font-weight:bold}
.timeline-card .t-era{font-size:0.8em;color:var(--accent)}
.timeline-card .t-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.timeline-card .t-detail strong{color:var(--text)}
.timeline-card .t-events{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.timeline-card .t-events span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.timeline-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.timeline::before{left:15px}.timeline-item{padding:0 0 20px 45px}.timeline-dot{left:6px;width:18px;height:18px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>📜 中国武术发展史</h1>
<p>Chinese Martial Arts History — 从先秦到现代的武术发展历程</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索朝代、事件或人物...">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部时期</button>
<button class="filter-btn" data-filter="先秦">🏛️ 先秦</button>
<button class="filter-btn" data-filter="秦汉">⚔️ 秦汉</button>
<button class="filter-btn" data-filter="魏晋南北朝">🏯 魏晋</button>
<button class="filter-btn" data-filter="隋唐">🌟 隋唐</button>
<button class="filter-btn" data-filter="宋元">📚 宋元</button>
<button class="filter-btn" data-filter="明清">🔥 明清</button>
<button class="filter-btn" data-filter="近现代">🌍 近现代</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="timeline" id="timeline"></div>
<footer><p>📜 中国武术发展史 — 武以载道，道以化武</p></footer>
</div>
<script>
const HISTORY_DATA=[
  {id:1,era:"先秦",period:"约公元前21世纪-前221年",icon:"🏛️",title:"武术萌芽期",description:"武术起源于原始社会的狩猎和战争。先秦时期，武术作为军事技能得到发展，出现了剑术、射术等专门的武术形式。",events:["蚩尤作兵","干戚之舞","越女论剑","庄子说剑","剑术流派形成"],significance:"武术从实战技能开始向艺术化发展"},
  {id:2,era:"秦汉",period:"公元前221年-220年",icon:"⚔️",title:"武术体系形成期",description:"秦汉时期，武术开始形成独立的体系。汉代出现了'角抵'（摔跤），剑术得到发展，刀术开始流行。",events:["角抵之戏","剑舞流行","刀术发展","手搏形成","百戏中的武术"],significance:"武术从军事技能向民间体育过渡"},
  {id:3,era:"魏晋南北朝",period:"220年-589年",icon:"🏯",title:"武术融合期",description:"魏晋南北朝时期，佛教传入中国，少林寺建立。武术与佛教、道教文化开始融合，出现了'禅武合一'的萌芽。",events:["少林寺建立","佛教武术萌芽","道教养生术","武术与宗教融合","武艺比赛出现"],significance:"武术与宗教文化开始深度融合"},
  {id:4,era:"隋唐",period:"581年-907年",icon:"🌟",title:"武术繁荣期",description:"隋唐时期，武术得到空前发展。唐代实行武举制度，武术人才得到选拔。少林武僧助唐王李世民，少林功夫名扬天下。",events:["武举制度创立","少林武僧助唐","剑舞艺术化","武艺套路出现","边塞武术交流"],significance:"武术制度化、艺术化发展"},
  {id:5,era:"宋元",period:"960年-1368年",icon:"📚",title:"武术民间化期",description:"宋元时期，武术在民间广泛传播。出现了'英略社'等民间武术组织，武术套路进一步发展，摔跤（角抵）成为宫廷娱乐。",events:["英略社等组织","武术套路发展","角抵盛行","民间习武成风","武术与戏曲融合"],significance:"武术从宫廷走向民间"},
  {id:6,era:"明清",period:"1368年-1912年",icon:"🔥",title:"武术鼎盛期",description:"明清时期是中国武术的鼎盛期。内家拳（太极、形意、八卦）形成，南拳北腿格局确立，武术门派林立，名家辈出。",events:["太极拳形成","形意拳创立","八卦掌创立","南拳北腿格局","武术门派林立","戚继光《纪效新书》"],significance:"武术体系完全成熟，门派纷呈"},
  {id:7,era:"近现代",period:"1912年-1949年",icon:"🌍",title:"武术转型期",description:"近代以来，武术面临西方体育的冲击。精武体育会成立，中央国术馆创办，武术开始向现代体育转型。",events:["精武体育会成立","中央国术馆创办","武术进入学校","竞技武术萌芽","武术向海外传播"],significance:"武术从传统向现代转型"},
  {id:8,era:"当代",period:"1949年至今",icon:"🏆",title:"武术国际化期",description:"新中国成立后，武术得到系统整理和发展。1958年国家制定武术竞赛规则，武术成为正式比赛项目，走向世界。",events:["武术竞赛规则制定","武术成为正式比赛","太极拳全球推广","武术进入奥运","武术文化输出"],significance:"武术成为世界文化遗产和竞技运动"}
];
function renderTimeline(data){
  document.getElementById('timeline').innerHTML=data.map(m=>`
    <div class="timeline-item" data-category="${m.era}">
      <div class="timeline-dot"></div>
      <div class="timeline-card">
        <div class="t-header"><div class="t-icon">${m.icon}</div><div><div class="t-title">${m.title}</div><div class="t-era">${m.period}</div></div></div>
        <div class="t-detail"><strong>概述：</strong>${m.description}</div>
        <div class="t-detail"><strong>意义：</strong>${m.significance}</div>
        <div class="t-events">${m.events.map(e=>`<span>${e}</span>`).join('')}</div>
      </div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(m=>{cats[m.era]=(cats[m.era]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">历史时期</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.timeline-card').forEach(c=>{const p=c.closest('.timeline-item');p.style.display=q&&!c.textContent.toLowerCase().includes(q)?'none':''});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.timeline-item').forEach(c=>{c.style.display=f!=='all'&&c.dataset.category!==f?'none':''});
});
renderTimeline(HISTORY_DATA);renderStats(HISTORY_DATA);
</script>
</body>
</html>
