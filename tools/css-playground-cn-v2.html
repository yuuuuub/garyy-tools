<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS代码 playground</title>
    <meta name="description" content="在线CSS代码实时预览编辑器，支持Flexbox、Grid、动画等常用CSS属性">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    <meta name="robots" content="index, follow">
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #e6e6e6;
            --text-secondary: #a6a6a6;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --border: #2a2a4a;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; height: 100vh; display: flex; flex-direction: column; }
        .header { padding: 0.75rem 1.5rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 1rem; flex-shrink: 0; flex-wrap: wrap; }
        h1 { color: var(--accent); font-size: 1.1rem; white-space: nowrap; }
        .header-btns { margin-left: auto; display: flex; gap: 0.5rem; }
        button {
            background: var(--accent); color: white; border: none; padding: 0.4rem 0.8rem;
            border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.3s; font-size: 0.8rem;
        }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: var(--bg-tertiary); color: var(--text-primary); }
        button.secondary:hover { background: var(--border); }
        .main { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 220px; background: var(--bg-secondary); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
        .sidebar h3 { padding: 0.75rem 1rem; font-size: 0.85rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
        .snippet { padding: 0.5rem 1rem; cursor: pointer; font-size: 0.8rem; color: var(--text-primary); border-bottom: 1px solid rgba(255,255,255,0.03); }
        .snippet:hover { background: var(--bg-tertiary); color: var(--accent); }
        .editor-section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .css-editor { position: relative; }
        textarea {
            width: 100%; padding: 1rem; border: none; resize: none;
            background: var(--bg-secondary); color: var(--text-primary);
            font-family: 'Courier New', monospace; font-size: 0.9rem; line-height: 1.5; min-height: 200px; border-bottom: 2px solid var(--border);
        }
        textarea:focus { outline: none; }
        .preview-section { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .preview-controls { padding: 0.4rem 1rem; background: var(--bg-tertiary); display: flex; gap: 0.5rem; align-items: center; flex-shrink: 0; }
        .preview-controls label { font-size: 0.8rem; color: var(--text-secondary); }
        .preview-controls select {
            padding: 0.3rem 0.5rem; border-radius: 4px; border: 1px solid var(--border);
            background: var(--bg-secondary); color: var(--text-primary); font-size: 0.8rem;
        }
        .preview-container { flex: 1; overflow: auto; padding: 1.5rem; transition: background 0.3s; }
        #previewContent {
            border: 1px dashed var(--border); border-radius: 8px; padding: 1.5rem; min-height: 200px;
        }
        .pane-label { font-size: 0.8rem; color: var(--text-secondary); padding: 0.4rem 1rem; background: var(--bg-tertiary); flex-shrink: 0; font-weight: 600; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { flex-direction: column; }
        }
    </style>
    <script src="i18n.js" defer></script>
</head>
<body>
    <div class="header">
        <h1>🎨 CSS Playground</h1>
        <div class="header-btns">
            <button onclick="copyCss()">复制CSS</button>
            <button class="secondary" onclick="resetCss()">重置</button>
        </div>
    </div>
    <div class="main">
        <div class="sidebar">
            <h3>📦 Flexbox</h3>
            <div class="snippet" onclick="insertSnippet('flex-center')">Flex居中</div>
            <div class="snippet" onclick="insertSnippet('flex-between')">Flex两端对齐</div>
            <div class="snippet" onclick="insertSnippet('flex-wrap')">Flex换行</div>
            <div class="snippet" onclick="insertSnippet('flex-stretch')">Flex拉伸</div>
            <h3>📐 Grid</h3>
            <div class="snippet" onclick="insertSnippet('grid-basic')">Grid基础</div>
            <div class="snippet" onclick="insertSnippet('grid-areas')">Grid区域</div>
            <div class="snippet" onclick="insertSnippet('grid-responsive')">Grid响应式</div>
            <h3>✨ 效果</h3>
            <div class="snippet" onclick="insertSnippet('shadow')">阴影</div>
            <div class="snippet" onclick="insertSnippet('gradient')">渐变</div>
            <div class="snippet" onclick="insertSnippet('border-radius')">圆角</div>
            <div class="snippet" onclick="insertSnippet('transition')">过渡动画</div>
            <div class="snippet" onclick="insertSnippet('animation')">关键帧动画</div>
            <div class="snippet" onclick="insertSnippet('transform')">变换</div>
            <h3>🔤 文字</h3>
            <div class="snippet" onclick="insertSnippet('text-gradient')">文字渐变</div>
            <div class="snippet" onclick="insertSnippet('text-shadow')">文字阴影</div>
            <div class="snippet" onclick="insertSnippet('text-truncate')">文字截断</div>
        </div>
        <div class="editor-section">
            <div class="pane-label">📝 CSS代码</div>
            <textarea id="cssInput" oninput="applyCss()"></textarea>
            <div class="preview-controls">
                <label>预览背景:</label>
                <select id="bgSelect" onchange="changeBg()">
                    <option value="white">白色</option>
                    <option value="#1a1a2e">深色</option>
                    <option value="#f5f5f5">浅灰</option>
                    <option value="transparent">透明</option>
                </select>
            </div>
            <div class="pane-label">👁️ 预览效果</div>
            <div class="preview-container" id="previewContainer">
                <div id="previewContent">
                    <h2>预览标题</h2>
                    <p>这是一个段落文本，用于展示CSS样式效果。</p>
                    <div class="demo-boxes" id="demoBoxes">
                        <div class="demo-box">1</div>
                        <div class="demo-box">2</div>
                        <div class="demo-box">3</div>
                    </div>
                    <button class="demo-btn">按钮</button>
                    <ul class="demo-list">
                        <li>列表项 1</li>
                        <li>列表项 2</li>
                        <li>列表项 3</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
const snippets = {
    'flex-center': `#demoBoxes {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  min-height: 200px;\n  gap: 1rem;\n}`,
    'flex-between': `#demoBoxes {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 1rem;\n  padding: 1rem;\n}`,
    'flex-wrap': `#demoBoxes {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 1rem;\n}\n.demo-box {\n  flex: 1 1 100px;\n  min-width: 80px;\n}`,
    'flex-stretch': `#demoBoxes {\n  display: flex;\n  align-items: stretch;\n  gap: 1rem;\n  min-height: 200px;\n}\n.demo-box {\n  flex: 1;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}`,
    'grid-basic': `#demoBoxes {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 1rem;\n}`,
    'grid-areas': `#demoBoxes {\n  display: grid;\n  grid-template-areas:\n    "header header header"\n    "nav main aside"\n    "footer footer footer";\n  grid-template-columns: 150px 1fr 150px;\n  gap: 0.5rem;\n  min-height: 250px;\n}\n.demo-box:nth-child(1) { grid-area: header; }\n.demo-box:nth-child(2) { grid-area: nav; }\n.demo-box:nth-child(3) { grid-area: main; }`,
    'grid-responsive': `#demoBoxes {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));\n  gap: 1rem;\n}`,
    'shadow': `.demo-box {\n  box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);\n  transition: box-shadow 0.3s;\n}\n.demo-box:hover {\n  box-shadow: 0 8px 30px rgba(233, 69, 96, 0.5);\n}`,
    'gradient': `.demo-box {\n  background: linear-gradient(135deg, #e94560, #ff6b6b);\n  color: white;\n  border: none;\n}\n#demoBoxes {\n  display: flex;\n  gap: 1rem;\n}`,
    'border-radius': `.demo-box {\n  border-radius: 50%;\n}\n.demo-btn {\n  border-radius: 50px;\n}\n#demoBoxes {\n  display: flex;\n  gap: 1rem;\n  justify-content: center;\n}`,
    'transition': `.demo-box {\n  transition: all 0.3s ease;\n}\n.demo-box:hover {\n  transform: translateY(-5px);\n  background: #e94560;\n  color: white;\n}`,
    'animation': `@keyframes pulse {\n  0% { transform: scale(1); }\n  50% { transform: scale(1.1); }\n  100% { transform: scale(1); }\n}\n.demo-box {\n  animation: pulse 1.5s infinite;\n}\n#demoBoxes {\n  display: flex;\n  gap: 1rem;\n  justify-content: center;\n}`,
    'transform': `.demo-box {\n  transition: transform 0.3s;\n}\n.demo-box:nth-child(1):hover { transform: rotate(15deg); }\n.demo-box:nth-child(2):hover { transform: scale(1.2); }\n.demo-box:nth-child(3):hover { transform: skewX(10deg); }\n#demoBoxes {\n  display: flex;\n  gap: 2rem;\n  justify-content: center;\n  padding: 2rem;\n}`,
    'text-gradient': `h2 {\n  background: linear-gradient(90deg, #e94560, #ff6b6b, #ff9800);\n  -webkit-background-clip: text;\n  -webkit-text-fill-color: transparent;\n  font-size: 2.5rem;\n}`,
    'text-shadow': `h2 {\n  text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 20px rgba(233,69,96,0.3);\n  font-size: 2rem;\n}`,
    'text-truncate': `p {\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  max-width: 300px;\n  border: 1px dashed var(--border);\n  padding: 0.5rem;\n}`
};

const defaultCss = `#demoBoxes {\n  display: flex;\n  gap: 1rem;\n  margin: 1rem 0;\n}\n\n.demo-box {\n  width: 80px;\n  height: 80px;\n  background: var(--accent);\n  color: white;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  border-radius: 8px;\n  font-weight: 700;\n  font-size: 1.2rem;\n}\n\n.demo-btn {\n  background: var(--accent);\n  color: white;\n  border: none;\n  padding: 0.6rem 1.5rem;\n  border-radius: 6px;\n  font-weight: 600;\n  cursor: pointer;\n  margin: 1rem 0;\n}\n\n.demo-list {\n  padding-left: 1.5rem;\n  color: var(--text-secondary);\n}\n\n.demo-list li {\n  margin: 0.3rem 0;\n}`;

document.getElementById('cssInput').value = defaultCss;

function applyCss() {
    const css = document.getElementById('cssInput').value;
    let styleEl = document.getElementById('dynamicStyle');
    if (!styleEl) { styleEl = document.createElement('style'); styleEl.id = 'dynamicStyle'; document.head.appendChild(styleEl); }
    styleEl.textContent = css;
}

function insertSnippet(name) {
    const ta = document.getElementById('cssInput');
    ta.value += '\n\n' + snippets[name];
    applyCss();
}

function resetCss() { document.getElementById('cssInput').value = defaultCss; applyCss(); }
function copyCss() { navigator.clipboard.writeText(document.getElementById('cssInput').value).then(() => alert('CSS已复制')); }
function changeBg() {
    const bg = document.getElementById('bgSelect').value;
    document.getElementById('previewContainer').style.background = bg === 'white' ? '#ffffff' : bg;
}

applyCss();
    </script>
</body>
</html>
