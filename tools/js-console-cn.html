<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript控制台</title>
    <meta name="description" content="在线JavaScript代码运行控制台，支持执行代码、查看输出结果">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <meta name="robots" content="index, follow">
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #e6e6e6;
            --text-secondary: #a6a6a6;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --border: #2a2a4a;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; height: 100vh; display: flex; flex-direction: column; }
        .header { padding: 0.75rem 1.5rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
        h1 { color: var(--accent); font-size: 1.1rem; }
        .header-btns { margin-left: auto; display: flex; gap: 0.5rem; }
        button {
            background: var(--accent); color: white; border: none; padding: 0.4rem 0.8rem;
            border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.3s; font-size: 0.8rem;
        }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: var(--bg-tertiary); color: var(--text-primary); }
        button.secondary:hover { background: var(--border); }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .editor-area { flex: 1; min-height: 150px; border-bottom: 2px solid var(--border); display: flex; flex-direction: column; }
        .editor-label { padding: 0.4rem 1rem; background: var(--bg-tertiary); color: var(--text-secondary); font-size: 0.8rem; font-weight: 600; flex-shrink: 0; }
        textarea {
            flex: 1; width: 100%; padding: 1rem; border: none; resize: none;
            background: var(--bg-secondary); color: var(--text-primary);
            font-family: 'Courier New', monospace; font-size: 0.9rem; line-height: 1.5;
        }
        textarea:focus { outline: none; }
        .console-area { flex: 1; display: flex; flex-direction: column; min-height: 200px; }
        .console-header { padding: 0.4rem 1rem; background: var(--bg-tertiary); color: var(--text-secondary); font-size: 0.8rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .console-output {
            flex: 1; overflow-y: auto; padding: 0.75rem; background: #0d1117;
            font-family: 'Courier New', monospace; font-size: 0.85rem;
        }
        .console-line {
            padding: 0.3rem 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex; gap: 0.5rem; align-items: flex-start; word-break: break-all;
        }
        .console-line:hover { background: rgba(255,255,255,0.03); }
        .line-type {
            font-size: 0.7rem; padding: 0.1rem 0.3rem; border-radius: 3px;
            font-weight: 700; flex-shrink: 0; margin-top: 0.15rem;
        }
        .type-log { background: #238636; color: white; }
        .type-error { background: #f85149; color: white; }
        .type-warn { background: #d29922; color: white; }
        .type-info { background: #388bfd; color: white; }
        .type-result { background: #8b5cf6; color: white; }
        .line-content { flex: 1; }
        .line-time { color: var(--text-secondary); font-size: 0.75rem; flex-shrink: 0; }
        .line-content .str { color: #4caf50; }
        .line-content .num { color: #ff9800; }
        .line-content .bool { color: #2196f3; }
        .line-content .null-val { color: #9e9e9e; }
        .line-content .obj { color: var(--text-secondary); }
        .line-content .err-msg { color: #f85149; }
        .input-area {
            padding: 0.5rem 1rem; background: var(--bg-secondary); border-top: 1px solid var(--border);
            display: flex; gap: 0.5rem; flex-shrink: 0;
        }
        .input-area input {
            flex: 1; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 6px;
            background: var(--bg-tertiary); color: var(--text-primary); font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        .input-area input:focus { outline: none; border-color: var(--accent); }
    </style>
    <script src="i18n.js" defer></script>
</head>
<body>
    <div class="header">
        <h1>⚡ JavaScript控制台</h1>
        <div class="header-btns">
            <button onclick="runCode()">▶ 执行</button>
            <button class="secondary" onclick="clearConsole()">清空</button>
            <button class="secondary" onclick="copyOutput()">复制输出</button>
        </div>
    </div>
    <div class="main">
        <div class="editor-area">
            <div class="editor-label">📝 JavaScript代码 <span style="float:right;font-weight:400;color:var(--text-secondary);">Shift+Enter换行 | Ctrl+Enter执行</span></div>
            <textarea id="codeInput" spellcheck="false"></textarea>
        </div>
        <div class="console-area">
            <div class="console-header">
                <span>🖥️ 控制台输出</span>
                <span id="outputCount">0 条输出</span>
            </div>
            <div class="console-output" id="consoleOutput"></div>
        </div>
        <div class="input-area">
            <input type="text" id="quickInput" placeholder="快速输入代码..." onkeydown="if(event.key==='Enter')runQuick()">
            <button onclick="runQuick()">执行</button>
        </div>
    </div>

    <script>
const sampleCode = `// 🎯 JavaScript控制台 - 试试运行这些代码！

// 基础输出
console.log("你好，世界！");
console.log("当前时间:", new Date().toLocaleString());

// 数组操作
const fruits = ["苹果", "香蕉", "橙子", "葡萄", "西瓜"];
console.log("水果列表:", fruits);
console.log("第一个:", fruits[0]);
console.log("反转:", [...fruits].reverse());

// 数学运算
const numbers = Array.from({length: 10}, (_, i) => i + 1);
console.log("数字:", numbers);
console.log("总和:", numbers.reduce((a, b) => a + b, 0));
console.log("平均值:", (numbers.reduce((a, b) => a + b, 0) / numbers.length).toFixed(2));

// 对象操作
const user = { name: "张三", age: 28, city: "北京", skills: ["JavaScript", "Python", "Go"] };
console.log("用户信息:", user);
console.log("姓名:", user.name);
console.log("技能数量:", user.skills.length);

// 字符串处理
const msg = "Hello JavaScript Console";
console.log("原始:", msg);
console.log("大写:", msg.toUpperCase());
console.log("替换:", msg.replace("Hello", "你好"));

// Promise演示
async function fetchData() {
    console.log("⏳ 模拟异步请求...");
    await new Promise(r => setTimeout(r, 500));
    console.log("✅ 请求完成！");
    return { status: 200, data: "模拟数据" };
}
fetchData().then(r => console.log("响应:", r));

// 错误捕获演示
try {
    const result = JSON.parse('{"key": "value"}');
    console.log("JSON解析成功:", result);
} catch (e) {
    console.error("JSON解析失败:", e.message);
}

// 生成随机数据
const randomUsers = Array.from({length: 5}, (_, i) => ({
    id: i + 1,
    name: ["张三", "李四", "王五", "赵六", "钱七"][i],
    score: Math.floor(Math.random() * 100)
}));
console.table(randomUsers);

// 调用返回值
const calcResult = [1, 2, 3, 4, 5].map(x => x * x);
console.log("平方:", calcResult);`;

document.getElementById('codeInput').value = sampleCode;

let outputCount = 0;
const history = [];
let historyIndex = -1;

function formatValue(val) {
    if (val === null) return '<span class="null-val">null</span>';
    if (val === undefined) return '<span class="null-val">undefined</span>';
    if (typeof val === 'boolean') return `<span class="bool">${val}</span>`;
    if (typeof val === 'number') return `<span class="num">${val}</span>`;
    if (typeof val === 'string') return `<span class="str">"${val.replace(/</g,'&lt;')}"</span>`;
    if (typeof val === 'function') return `<span class="obj">ƒ ${val.name || 'anonymous'}()</span>`;
    if (typeof val === 'object') {
        try {
            const str = JSON.stringify(val, null, 2);
            return `<span class="obj">${str.replace(/</g,'&lt;').replace(/"([^"]+)"(?=\s*:)/g, '<span class="str">"$1"</span>').replace(/: "([^"]*)"/g, ': <span class="str">"$1"</span>').replace(/: (\d+)/g, ': <span class="num">$1</span>')}</span>`;
        } catch { return `<span class="obj">[Circular]</span>`; }
    }
    return String(val);
}

function addLine(type, ...args) {
    const output = document.getElementById('consoleOutput');
    const line = document.createElement('div');
    line.className = 'console-line';
    const typeLabel = { log: 'LOG', error: 'ERR', warn: 'WARN', info: 'INFO', result: 'RET' }[type] || 'LOG';
    const typeClass = { log: 'type-log', error: 'type-error', warn: 'type-warn', info: 'type-info', result: 'type-result' }[type] || 'type-log';
    const content = args.map(a => formatValue(a)).join(' ');
    const time = new Date().toLocaleTimeString();
    line.innerHTML = `<span class="line-type ${typeClass}">${typeLabel}</span><span class="line-content">${content}</span><span class="line-time">${time}</span>`;
    output.appendChild(line);
    output.scrollTop = output.scrollHeight;
    outputCount++;
    document.getElementById('outputCount').textContent = outputCount + ' 条输出';
}

function runCode() {
    const code = document.getElementById('codeInput').value;
    if (!code.trim()) return;

    // Save to history
    history.unshift(code);
    if (history.length > 50) history.pop();
    historyIndex = -1;

    const origLog = console.log;
    const origError = console.error;
    const origWarn = console.warn;
    const origInfo = console.info;

    console.log = (...args) => { addLine('log', ...args); origLog.apply(console, args); };
    console.error = (...args) => { addLine('error', ...args); origError.apply(console, args); };
    console.warn = (...args) => { addLine('warn', ...args); origWarn.apply(console, args); };
    console.info = (...args) => { addLine('info', ...args); origInfo.apply(console, args); };

    // Override console.table
    const origTable = console.table;
    console.table = (data) => {
        if (Array.isArray(data) && data.length > 0) {
            const keys = Object.keys(data[0]);
            let tableStr = keys.join(' | ') + '\n' + keys.map(() => '---').join(' | ') + '\n';
            data.forEach(row => { tableStr += keys.map(k => row[k]).join(' | ') + '\n'; });
            addLine('log', tableStr);
        } else { origTable.apply(console, [data]); }
    };

    const startTime = performance.now();
    try {
        const result = new Function(code)();
        if (result !== undefined) {
            const elapsed = (performance.now() - startTime).toFixed(1);
            addLine('result', result);
            addLine('info', `⏱️ 执行耗时: ${elapsed}ms`);
        }
    } catch (e) {
        addLine('error', `❌ ${e.name}: ${e.message}`);
    } finally {
        console.log = origLog;
        console.error = origError;
        console.warn = origWarn;
        console.info = origInfo;
        console.table = origTable;
    }
}

function runQuick() {
    const input = document.getElementById('quickInput');
    const code = input.value.trim();
    if (!code) return;
    document.getElementById('codeInput').value = code;
    runCode();
    input.value = '';
}

function clearConsole() {
    document.getElementById('consoleOutput').innerHTML = '';
    outputCount = 0;
    document.getElementById('outputCount').textContent = '0 条输出';
}

function copyOutput() {
    const lines = document.querySelectorAll('#consoleOutput .console-line');
    const text = Array.from(lines).map(l => l.querySelector('.line-content').textContent).join('\n');
    navigator.clipboard.writeText(text).then(() => alert('输出已复制'));
}

// Keyboard shortcuts
document.getElementById('codeInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runCode(); }
});

document.getElementById('quickInput').addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' && history.length) {
        historyIndex = Math.min(historyIndex + 1, history.length - 1);
        e.target.value = history[historyIndex];
    }
    if (e.key === 'ArrowDown') {
        historyIndex = Math.max(historyIndex - 1, -1);
        e.target.value = historyIndex >= 0 ? history[historyIndex] : '';
    }
});
    </script>
</body>
</html>
