<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>干系人地图</title>
<meta property="og:title" content="干系人地图">
<meta property="og:description" content="干系人地图 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="干系人分析地图，权力-利益矩阵，识别关键干系人">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👥</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:4px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.9rem;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin:16px 0}
.matrix-quadrant{padding:20px;border-radius:8px;min-height:180px;position:relative;transition:all .2s}
.matrix-quadrant:hover{transform:scale(1.01)}
.q-top-left{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3)}
.q-top-right{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3)}
.q-bottom-left{background:rgba(139,148,158,.1);border:1px solid rgba(139,148,158,.3)}
.q-bottom-right{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3)}
.q-label{font-size:.85rem;font-weight:600;margin-bottom:8px}
.person-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;margin:4px;font-size:.85rem;cursor:pointer;transition:all .2s}
.person-chip:hover{transform:scale(1.05)}
.person-chip .remove{cursor:pointer;font-size:.7rem;opacity:.6;transition:opacity .2s}
.person-chip .remove:hover{opacity:1;color:var(--red)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:12px}
.stat-num{font-size:1.8rem;font-weight:700}
.stat-label{font-size:.8rem;color:var(--text2)}
.person-list{max-height:300px;overflow-y:auto}
.person-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border);transition:background .2s}
.person-item:hover{background:rgba(59,130,246,.05)}
.person-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.person-info{flex:1}
.person-name{font-weight:600;font-size:.9rem}
.person-role{font-size:.8rem;color:var(--text2)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px}
.hidden{display:none!important}
.empty{text-align:center;color:var(--text2);padding:30px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}h1{font-size:1.4rem}.stats-grid{grid-template-columns:repeat(2,1fr)}.matrix{grid-template-columns:1fr}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>👥 干系人地图</h1>
<p class="subtitle">权力-利益矩阵分析</p>

<div class="stats-grid" id="statsGrid"></div>

<div class="card">
  <div class="flex-between">
    <b>干系人管理</b>
    <button class="btn" onclick="showModal()">+ 添加干系人</button>
  </div>
</div>

<div class="card">
  <b style="display:block;margin-bottom:4px">权力-利益矩阵</b>
  <p style="font-size:.8rem;color:var(--text2);margin-bottom:12px">X轴：利益 ｜ Y轴：权力</p>
  <div class="matrix" id="matrix">
    <div class="matrix-quadrant q-top-left"><div class="q-label" style="color:var(--accent)">📌 保持满意</div><div id="q1"></div></div>
    <div class="matrix-quadrant q-top-right"><div class="q-label" style="color:var(--red)">🎯 重点管理</div><div id="q2"></div></div>
    <div class="matrix-quadrant q-bottom-left"><div class="q-label" style="color:var(--text2)">📢 监督观察</div><div id="q3"></div></div>
    <div class="matrix-quadrant q-bottom-right"><div class="q-label" style="color:var(--green)">✅ 保持沟通</div><div id="q4"></div></div>
  </div>
</div>

<div class="card">
  <b style="display:block;margin-bottom:8px">全部干系人</b>
  <div class="person-list" id="personList"></div>
</div>
</div>

<div class="modal-overlay hidden" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 style="margin-bottom:16px" id="modalTitle">添加干系人</h3>
    <label>姓名</label><input type="text" id="pName" placeholder="例：张总">
    <label>角色/职位</label><input type="text" id="pRole" placeholder="例：CTO">
    <label>权力 (1-10)</label><input type="number" id="pPower" min="1" max="10" value="5">
    <label>利益 (1-10)</label><input type="number" id="pInterest" min="1" max="10" value="5">
    <label>态度</label>
    <select id="pAttitude"><option value="支持">支持</option><option value="中立">中立</option><option value="反对">反对</option></select>
    <label>沟通策略</label><textarea id="pStrategy" placeholder="例：每周汇报项目进展" rows="2"></textarea>
    <div class="flex" style="margin-top:16px;justify-content:flex-end">
      <button class="btn btn-danger btn-sm" onclick="closeModal()">取消</button>
      <button class="btn" onclick="savePerson()">保存</button>
    </div>
  </div>
</div>

<script>
document.title='👥 干系人地图';
let people=JSON.parse(localStorage.getItem('stakeholder_cn')||'[]');
let editingId=null;
const COLORS=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#f97316'];
const ATTITUDE_COLORS={'支持':'var(--green)','中立':'var(--yellow)','反对':'var(--red)'};

function save(){localStorage.setItem('stakeholder_cn',JSON.stringify(people))}

function showModal(id){
  editingId=id||null;
  document.getElementById('modalTitle').textContent=id?'编辑干系人':'添加干系人';
  if(id){const p=people.find(x=>x.id===id);document.getElementById('pName').value=p.name;document.getElementById('pRole').value=p.role;document.getElementById('pPower').value=p.power;document.getElementById('pInterest').value=p.interest;document.getElementById('pAttitude').value=p.attitude;document.getElementById('pStrategy').value=p.strategy||''}
  else{document.getElementById('pName').value='';document.getElementById('pRole').value='';document.getElementById('pPower').value=5;document.getElementById('pInterest').value=5;document.getElementById('pAttitude').value='中立';document.getElementById('pStrategy').value=''}
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal').classList.add('hidden')}

function savePerson(){
  const name=document.getElementById('pName').value.trim();if(!name)return;
  const role=document.getElementById('pRole').value.trim();
  const power=Math.min(10,Math.max(1,+document.getElementById('pPower').value||5));
  const interest=Math.min(10,Math.max(1,+document.getElementById('pInterest').value||5));
  const attitude=document.getElementById('pAttitude').value;
  const strategy=document.getElementById('pStrategy').value.trim();
  if(editingId){const p=people.find(x=>x.id===editingId);if(p){p.name=name;p.role=role;p.power=power;p.interest=interest;p.attitude=attitude;p.strategy=strategy}}
  else people.push({id:Date.now(),name,role,power,interest,attitude,strategy});
  save();render();closeModal();
}
function deletePerson(id){people=people.filter(p=>p.id!==id);save();render()}

function render(){
  const q1=people.filter(p=>p.power>=6&&p.interest<6);
  const q2=people.filter(p=>p.power>=6&&p.interest>=6);
  const q3=people.filter(p=>p.power<6&&p.interest<6);
  const q4=people.filter(p=>p.power<6&&p.interest>=6);
  
  document.getElementById('statsGrid').innerHTML=`
    <div class="card stat"><div class="stat-num" style="color:var(--text)">${people.length}</div><div class="stat-label">总干系人</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--red)">${q2.length}</div><div class="stat-label">重点管理</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--green)">${people.filter(p=>p.attitude==='支持').length}</div><div class="stat-label">支持者</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--red)">${people.filter(p=>p.attitude==='反对').length}</div><div class="stat-label">反对者</div></div>`;
  
  const renderChips=(list,containerId)=>{
    if(list.length===0){document.getElementById(containerId).innerHTML='<div class="empty" style="padding:10px;font-size:.8rem">暂无</div>';return}
    document.getElementById(containerId).innerHTML=list.map((p,i)=>`<div class="person-chip" style="background:${COLORS[i%COLORS.length]}33;color:${COLORS[i%COLORS.length]};border:1px solid ${COLORS[i%COLORS.length]}55" onclick="showModal(${p.id})"><span>${p.name}</span><span class="remove" onclick="event.stopPropagation();deletePerson(${p.id})">✕</span></div>`).join('');
  };
  renderChips(q1,'q1');renderChips(q2,'q2');renderChips(q3,'q3');renderChips(q4,'q4');
  
  let listHtml='';
  if(people.length===0)listHtml='<div class="empty">暂无干系人，点击上方按钮添加</div>';
  people.forEach((p,i)=>{
    listHtml+=`<div class="person-item">
      <div class="person-avatar" style="background:${COLORS[i%COLORS.length]}">${p.name[0]}</div>
      <div class="person-info">
        <div class="person-name">${p.name} <span class="badge" style="background:${ATTITUDE_COLORS[p.attitude]}33;color:${ATTITUDE_COLORS[p.attitude]}">${p.attitude}</span></div>
        <div class="person-role">${p.role||'未设置'} · 权力:${p.power} 利益:${p.interest}</div>
        ${p.strategy?`<div style="font-size:.8rem;margin-top:2px;color:var(--accent)">💡 ${p.strategy}</div>`:''}
      </div>
      <div style="display:flex;gap:4px"><button class="btn btn-sm" onclick="showModal(${p.id})" style="background:transparent;border:1px solid var(--border);color:var(--text);padding:4px 8px;font-size:.7rem">✎</button><button class="btn btn-sm btn-danger" onclick="deletePerson(${p.id})" style="padding:4px 8px;font-size:.7rem">✕</button></div>
    </div>`;
  });
  document.getElementById('personList').innerHTML=listHtml;
}

render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
