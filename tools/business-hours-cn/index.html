<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>营业时间助手</title>
<meta name="description" content="营业时间助手，支持多店铺管理、营业状态查询、时间计算和提醒设置">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:800px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.status-open{color:var(--green)}
.status-closed{color:var(--red)}
.status-soon{color:var(--yellow)}
.shop-item{padding:16px;border-bottom:1px solid var(--border)}
.shop-item:last-child{border-bottom:none}
.time-row{display:grid;grid-template-columns:80px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.time-row{grid-template-columns:60px 1fr 1fr}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏪</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="营业时间助手">
<meta property="og:description" content="营业时间助手，支持多店铺管理、营业状态查询、时间计算和提醒设置">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/business-hours-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🏪 营业时间助手';
const APP=document.getElementById('app');
let shops=JSON.parse(localStorage.getItem('bh_shops')||'[]');
let modalOpen=false;
let editingIdx=-1;

const weekdays=['周日','周一','周二','周三','周四','周五','周六'];

if(!shops.length){
  shops=[
    {name:'示例咖啡店',hours:{0:{open:'09:00',close:'22:00'},1:{open:'08:00',close:'22:00'},2:{open:'08:00',close:'22:00'},3:{open:'08:00',close:'22:00'},4:{open:'08:00',close:'22:00'},5:{open:'09:00',close:'23:00'},6:{open:'10:00',close:'23:00'}},breakTime:{start:'14:00',end:'15:00'},note:'周一至周五早8点开始'},
    {name:'示例餐厅',hours:{0:{open:'11:00',close:'21:00'},1:{open:'11:00',close:'21:00'},2:{open:'11:00',close:'21:00'},3:{open:'11:00',close:'21:00'},4:{open:'11:00',close:'21:00'},5:{open:'11:00',close:'22:00'},6:{open:'11:00',close:'22:00'}},breakTime:{start:'14:00',end:'17:00'},note:'周末延长营业'}
  ];
  save();
}

function save(){localStorage.setItem('bh_shops',JSON.stringify(shops))}

function getStatus(shop){
  let now=new Date();
  let day=now.getDay();
  let currentTime=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  let todayHours=shop.hours[day];
  if(!todayHours||!todayHours.open) return {status:'closed',label:'今日休息',cls:'status-closed'};
  if(currentTime<todayHours.open){
    let diff=calcDiff(currentTime,todayHours.open);
    return {status:'closed',label:`${diff}后开门`,cls:'status-closed'};
  }
  if(currentTime>=todayHours.close){
    return {status:'closed',label:'已打烊',cls:'status-closed'};
  }
  if(shop.breakTime&&currentTime>=shop.breakTime.start&&currentTime<shop.breakTime.end){
    let diff=calcDiff(currentTime,shop.breakTime.end);
    return {status:'break',label:`休息中，${diff}恢复`,cls:'status-soon'};
  }
  let diff=calcDiff(currentTime,todayHours.close);
  return {status:'open',label:`营业中，${diff}后打烊`,cls:'status-open'};
}

function calcDiff(from,to){
  let [fh,fm]=from.split(':').map(Number);
  let [th,tm]=to.split(':').map(Number);
  let diffMin=(th*60+tm)-(fh*60+fm);
  if(diffMin<0) diffMin+=24*60;
  let h=Math.floor(diffMin/60);
  let m=diffMin%60;
  if(h>0&&m>0) return `${h}小时${m}分钟`;
  if(h>0) return `${h}小时`;
  return `${m}分钟`;
}

function getNextOpen(shop){
  let now=new Date();
  let day=now.getDay();
  for(let i=0;i<7;i++){
    let checkDay=(day+i)%7;
    let h=shop.hours[checkDay];
    if(h&&h.open){
      if(i===0){
        let currentTime=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        if(currentTime<h.open) return `今天 ${h.open}开门`;
        continue;
      }
      return `${weekdays[checkDay]} ${h.open}开门`;
    }
  }
  return '暂无开门时间';
}

function render(){
  let h=`<h1>🏪 营业时间助手</h1><p class="subtitle">多店铺管理 · 实时营业状态 · 时间计算 · 提醒设置</p>`;

  let now=new Date();
  let currentTime=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  let currentDay=now.getDay();
  h+=`<div class="card" style="text-align:center">
    <div style="font-size:.9rem;color:var(--text2)">当前时间</div>
    <div style="font-size:2.5rem;font-weight:700;font-family:'Courier New',monospace;color:var(--accent)">${currentTime}</div>
    <div style="color:var(--text2)">${weekdays[currentDay]}</div>
  </div>`;

  h+=`<div class="card"><div class="flex-between"><b>店铺列表</b><button class="btn btn-sm" onclick="openModal(-1)">+ 添加店铺</button></div></div>`;

  if(!shops.length){
    h+=`<div class="empty">暂无店铺，点击上方按钮添加</div>`;
  } else {
    shops.forEach((shop,i)=>{
      let status=getStatus(shop);
      h+=`<div class="card shop-item">
        <div class="flex-between">
          <div>
            <b style="font-size:1.1rem">${shop.name}</b>
            <span class="badge ${status.cls==='status-open'?'badge-green':status.cls==='status-soon'?'badge-yellow':'badge-red'}" style="margin-left:8px">${status.label}</span>
          </div>
          <div class="flex">
            <button class="btn btn-sm" onclick="openModal(${i})">编辑</button>
            <button class="btn btn-sm btn-danger" onclick="delShop(${i})">删除</button>
          </div>
        </div>
        <div style="margin-top:12px">`;
      
      for(let d=0;d<7;d++){
        let h24=shop.hours[d];
        let isToday=d===currentDay;
        let timeStr=h24&&h24.open?`${h24.open} - ${h24.close}`:'休息';
        h+=`<div class="flex-between" style="padding:4px 0;${isToday?'font-weight:700':''}">
          <span style="width:60px;color:${isToday?'var(--accent)':'var(--text2)'}">${weekdays[d]}</span>
          <span>${timeStr}</span>
        </div>`;
      }
      if(shop.breakTime){
        h+=`<div style="margin-top:8px;padding:8px;background:var(--bg);border-radius:8px;font-size:.85rem">☕ 午休时间：${shop.breakTime.start} - ${shop.breakTime.end}</div>`;
      }
      if(shop.note){
        h+=`<div style="margin-top:4px;font-size:.85rem;color:var(--text2)">📝 ${shop.note}</div>`;
      }
      if(status.status!=='open'){
        h+=`<div style="margin-top:8px;font-size:.85rem;color:var(--text2)">⏰ ${getNextOpen(shop)}</div>`;
      }
      h+=`</div></div>`;
    });
  }

  if(modalOpen) h+=renderModal();
  APP.innerHTML=h;
}

function renderModal(){
  let shop=editingIdx>=0?shops[editingIdx]:null;
  let hoursRows='';
  for(let d=0;d<7;d++){
    let h24=shop?shop.hours[d]:null;
    hoursRows+=`<div class="time-row">
      <span style="font-size:.85rem;color:var(--text2)">${weekdays[d]}</span>
      <input type="time" class="bh-open" data-day="${d}" value="${h24?h24.open:'09:00'}" style="margin-bottom:0">
      <input type="time" class="bh-close" data-day="${d}" value="${h24?h24.close:'21:00'}" style="margin-bottom:0">
    </div>`;
  }
  return `<div class="modal-overlay" onclick="modalOpen=false;render()"><div class="modal" onclick="event.stopPropagation()">
    <h2 style="margin-bottom:16px">${shop?'编辑店铺':'添加店铺'}</h2>
    <label>店铺名称</label><input id="shopName" value="${shop?shop.name:''}" placeholder="店铺名称">
    <label>营业时间</label>
    <div style="display:grid;grid-template-columns:80px 1fr 1fr;gap:8px;margin-bottom:8px">
      <span style="font-size:.75rem;color:var(--text2)">星期</span>
      <span style="font-size:.75rem;color:var(--text2)">开门时间</span>
      <span style="font-size:.75rem;color:var(--text2)">打烊时间</span>
    </div>
    ${hoursRows}
    <label style="margin-top:12px">午休开始</label><input id="breakStart" type="time" value="${shop&&shop.breakTime?shop.breakTime.start:'14:00'}">
    <label>午休结束</label><input id="breakEnd" type="time" value="${shop&&shop.breakTime?shop.breakTime.end:'15:00'}">
    <label>备注</label><input id="shopNote" value="${shop?shop.note||'':''}" placeholder="备注信息（可选）">
    <div class="flex" style="justify-content:flex-end;margin-top:16px">
      <button class="btn btn-sm" style="background:var(--border);color:var(--text)" onclick="modalOpen=false;render()">取消</button>
      <button class="btn btn-sm btn-success" onclick="saveShop()">保存</button>
    </div>
  </div></div>`;
}

function openModal(idx){editingIdx=idx;modalOpen=true;render();setTimeout(()=>{let t=document.getElementById('shopName');if(t)t.focus()},100)}

function saveShop(){
  let name=document.getElementById('shopName').value.trim();
  if(!name){alert('请填写店铺名称');return}
  let hours={};
  document.querySelectorAll('.bh-open').forEach(inp=>{
    let d=parseInt(inp.dataset.day);
    let close=document.querySelector(`.bh-close[data-day="${d}"]`);
    if(!hours[d]) hours[d]={};
    hours[d].open=inp.value;
    hours[d].close=close?close.value:'21:00';
  });
  let breakStart=document.getElementById('breakStart').value;
  let breakEnd=document.getElementById('breakEnd').value;
  let breakTime=(breakStart&&breakEnd)?{start:breakStart,end:breakEnd}:null;
  let note=document.getElementById('shopNote').value.trim();
  if(editingIdx>=0){
    shops[editingIdx]={name,hours,breakTime,note};
  } else {
    shops.push({name,hours,breakTime,note});
  }
  save();modalOpen=false;editingIdx=-1;render();
}

function delShop(idx){if(confirm('删除此店铺？')){shops.splice(idx,1);save();render()}}

setInterval(()=>render(),60000);
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
