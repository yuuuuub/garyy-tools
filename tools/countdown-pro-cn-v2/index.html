<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倒计时Pro V2</title>
<meta name="description" content="倒计时Pro V2，支持多倒计时、自定义主题、声音提醒和全屏展示">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px}
.countdown-display{font-size:3rem;font-weight:700;font-family:'Courier New',monospace;text-align:center;padding:20px;color:var(--accent)}
.countdown-label{text-align:center;color:var(--text2);font-size:.9rem;margin-bottom:8px}
.progress-ring{width:200px;height:200px;margin:0 auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.countdown-display{font-size:2rem}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="倒计时Pro V2">
<meta property="og:description" content="倒计时Pro V2，支持多倒计时、自定义主题、声音提醒和全屏展示">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/countdown-pro-cn-v2/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='⏳ 倒计时Pro V2';
const APP=document.getElementById('app');
let timers=JSON.parse(localStorage.getItem('cdp2_timers')||'[]');
let modalOpen=false;
let editingIdx=-1;
let intervals={};

const presets=[
  {name:'1分钟',seconds:60},
  {name:'5分钟',seconds:300},
  {name:'10分钟',seconds:600},
  {name:'15分钟',seconds:900},
  {name:'30分钟',seconds:1800},
  {name:'1小时',seconds:3600},
  {name:'2小时',seconds:7200},
  {name:'自定义',seconds:0}
];

function save(){localStorage.setItem('cdp2_timers',JSON.stringify(timers))}

function formatTime(s){
  if(s<=0) return '00:00:00';
  let h=Math.floor(s/3600);
  let m=Math.floor((s%3600)/60);
  let sec=s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function getProgress(timer){
  if(!timer.totalSeconds) return 0;
  return Math.max(0,Math.min(100,((timer.totalSeconds-timer.remaining)/timer.totalSeconds)*100));
}

function render(){
  let h=`<h1>⏳ 倒计时Pro V2</h1><p class="subtitle">多倒计时 · 自定义主题 · 声音提醒</p>`;
  
  h+=`<div class="card"><div class="flex-between"><b>倒计时列表</b><button class="btn btn-sm" onclick="openModal(-1)">+ 新建倒计时</button></div></div>`;
  
  if(!timers.length){
    h+=`<div class="empty">暂无倒计时，点击上方按钮创建<br><div class="flex" style="justify-content:center;margin-top:16px;flex-wrap:wrap">`;
    presets.filter(p=>p.seconds>0).forEach(p=>{
      h+=`<button class="btn btn-sm" style="margin:4px" onclick="quickAdd(${p.seconds},'${p.name}')">${p.name}</button>`;
    });
    h+=`</div></div>`;
  } else {
    timers.forEach((t,i)=>{
      let progress=getProgress(t);
      let isRunning=t.running;
      let isComplete=t.remaining<=0&&t.totalSeconds>0;
      h+=`<div class="card" style="${isComplete?'border-color:var(--green)':''}">
        <div class="flex-between" style="margin-bottom:12px">
          <b>${t.name}</b>
          <div class="flex">
            <span class="badge ${isComplete?'badge-green':isRunning?'badge-blue':'badge-red'}">${isComplete?'已完成':isRunning?'运行中':'已暂停'}</span>
          </div>
        </div>
        <div class="countdown-display" style="${isComplete?'color:var(--green);animation:pulse 1s infinite':''}">${formatTime(t.remaining)}</div>
        <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:12px 0">
          <div style="height:100%;width:${progress}%;background:${isComplete?'var(--green)':'var(--accent)'};border-radius:3px;transition:width .5s"></div>
        </div>
        <div class="flex" style="justify-content:center">
          ${isComplete?`<button class="btn btn-sm btn-success" onclick="resetTimer(${i})">重新开始</button>`:
          `<button class="btn btn-sm" onclick="toggleTimer(${i})">${isRunning?'暂停':'开始'}</button>
          <button class="btn btn-sm btn-danger" onclick="resetTimer(${i})">重置</button>`}
          <button class="btn btn-sm" style="background:var(--border)" onclick="openModal(${i})">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="delTimer(${i})">删除</button>
        </div>
      </div>`;
    });
  }

  if(modalOpen) h+=renderModal();
  APP.innerHTML=h;
}

function renderModal(){
  let t=editingIdx>=0?timers[editingIdx]:null;
  return `<div class="modal-overlay" onclick="modalOpen=false;render()"><div class="modal" onclick="event.stopPropagation()">
    <h2 style="margin-bottom:16px">${t?'编辑倒计时':'新建倒计时'}</h2>
    <label>名称</label><input id="cdName" value="${t?t.name:''}" placeholder="倒计时名称">
    <label>预设</label><select id="cdPreset" onchange="applyPreset()">
      ${presets.map((p,i)=>`<option value="${i}" ${t&&t.totalSeconds===p.seconds?'selected':''}>${p.name}</option>`).join('')}
    </select>
    <label>自定义时间</label>
    <div class="flex">
      <input id="cdH" type="number" min="0" max="99" placeholder="时" style="width:33%">
      <input id="cdM" type="number" min="0" max="59" placeholder="分" style="width:33%">
      <input id="cdS" type="number" min="0" max="59" placeholder="秒" style="width:33%">
    </div>
    <label>完成后提醒</label><select id="cdAlert"><option value="yes">是</option><option value="no">否</option></select>
    <div class="flex" style="justify-content:flex-end;margin-top:16px">
      <button class="btn btn-sm" style="background:var(--border);color:var(--text)" onclick="modalOpen=false;render()">取消</button>
      <button class="btn btn-sm btn-success" onclick="saveTimer()">保存</button>
    </div>
  </div></div>`;
}

function quickAdd(sec,name){
  timers.push({name:name||formatTime(sec),totalSeconds:sec,remaining:sec,running:false,alert:true});
  save();render();
}

function applyPreset(){
  let idx=parseInt(document.getElementById('cdPreset').value);
  let p=presets[idx];
  if(p.seconds===0)return;
  document.getElementById('cdH').value=Math.floor(p.seconds/3600);
  document.getElementById('cdM').value=Math.floor((p.seconds%3600)/60);
  document.getElementById('cdS').value=p.seconds%60;
}

function openModal(idx){
  editingIdx=idx;modalOpen=true;render();
  setTimeout(()=>{let t=document.getElementById('cdName');if(t)t.focus()},100);
}

function saveTimer(){
  let name=document.getElementById('cdName').value.trim()||'倒计时';
  let h=parseInt(document.getElementById('cdH').value)||0;
  let m=parseInt(document.getElementById('cdM').value)||0;
  let s=parseInt(document.getElementById('cdS').value)||0;
  let total=h*3600+m*60+s;
  let alert=document.getElementById('cdAlert').value==='yes';
  if(total<=0){alert('请设置时间');return}
  if(editingIdx>=0){
    timers[editingIdx]={...timers[editingIdx],name,totalSeconds:total,remaining:total,running:false,alert};
  } else {
    timers.push({name,totalSeconds:total,remaining:total,running:false,alert});
  }
  save();modalOpen=false;editingIdx=-1;render();
}

function toggleTimer(idx){
  let t=timers[idx];
  if(t.running){
    clearInterval(intervals[idx]);
    t.running=false;
  } else {
    t.running=true;
    intervals[idx]=setInterval(()=>{
      t.remaining--;
      if(t.remaining<=0){
        t.remaining=0;
        t.running=false;
        clearInterval(intervals[idx]);
        if(t.alert) playAlert();
      }
      render();
    },1000);
  }
  save();render();
}

function resetTimer(idx){
  clearInterval(intervals[idx]);
  timers[idx].remaining=timers[idx].totalSeconds;
  timers[idx].running=false;
  save();render();
}

function delTimer(idx){
  if(confirm('删除此倒计时？')){
    clearInterval(intervals[idx]);
    timers.splice(idx,1);
    save();render();
  }
}

function playAlert(){
  try{
    let audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    let osc=audioCtx.createOscillator();
    let gain=audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value=800;
    gain.gain.value=0.3;
    osc.start();
    setTimeout(()=>{osc.stop();audioCtx.close()},1000);
  }catch(e){}
  garyyToast('⏰ 倒计时结束！');
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
