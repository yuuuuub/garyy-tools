<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⌚ 智能手表控制</title>
<meta name="description" content="智能手表健康监测、通知管理与表盘设置">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.watch-preview{text-align:center;padding:30px;border-radius:var(--radius);background:var(--bg);margin-bottom:16px}
.watch-face{width:150px;height:150px;border-radius:50%;background:var(--card);border:4px solid var(--border);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
.watch-time{font-size:1.8rem;font-weight:700}
.watch-date{font-size:.8rem;color:var(--text2)}
.watch-status{font-size:1rem;font-weight:600;margin-bottom:16px}
.health-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.health-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.health-icon{font-size:2rem;margin-bottom:8px}
.health-value{font-size:1.5rem;font-weight:700}
.health-label{font-size:.85rem;color:var(--text2);margin-top:4px}
.health-trend{font-size:.8rem;margin-top:4px}
.health-trend.up{color:var(--success)}
.health-trend.down{color:var(--danger)}
.chart-container{height:150px;background:var(--bg);border-radius:8px;margin-bottom:16px;position:relative;overflow:hidden}
.chart-canvas{width:100%;height:100%}
.activity-ring{width:100px;height:100px;margin:0 auto 16px}
.notif-list{display:flex;flex-direction:column;gap:8px}
.notif-item{padding:12px;background:var(--bg);border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.notif-info{display:flex;align-items:center;gap:12px}
.notif-icon{font-size:1.5rem}
.notif-text{font-weight:600}
.notif-time{font-size:.8rem;color:var(--text2)}
.watchface-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.watchface-item{padding:12px;background:var(--bg);border-radius:8px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s}
.watchface-item:hover{border-color:var(--accent)}
.watchface-item.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
.watchface-preview{width:60px;height:60px;border-radius:50%;background:var(--card);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.watchface-name{font-size:.85rem}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.app-item{padding:12px;background:var(--bg);border-radius:8px;text-align:center;cursor:pointer;transition:all .2s}
.app-item:hover{background:rgba(59,130,246,.1)}
.app-icon{font-size:1.5rem;margin-bottom:4px}
.app-name{font-size:.75rem}
.settings-group{margin-bottom:16px}
.settings-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px}
.settings-group input[type=text],.settings-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
.toggle-group{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.toggle-group:last-child{border-bottom:none}
.toggle{width:50px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background .2s;cursor:pointer}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s}
.toggle.on::after{transform:translateX(24px)}
button{padding:8px 16px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.heart-pulse{animation:pulse 1s infinite}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⌚</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="⌚ 智能手表控制">
<meta property="og:description" content="智能手表健康监测、通知管理与表盘设置">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>⌚ 智能手表控制</h1><p>健康监测，通知管理，个性化设置</p></div>

<div class="cd">
<div class="watch-preview">
<div class="watch-face">
<div class="watch-time" id="watchTime">12:00</div>
<div class="watch-date" id="watchDate">12月20日</div>
</div>
<div class="watch-status" id="watchStatus">已连接</div>
<button onclick="findWatch()">查找手表</button>
</div>
</div>

<div class="cd">
<h2>健康数据</h2>
<div class="health-grid">
<div class="health-card">
<div class="health-icon heart-pulse" style="color:var(--danger)">❤️</div>
<div class="health-value" id="heartRate">72</div>
<div class="health-label">心率 (BPM)</div>
<div class="health-trend up">↑ 2%</div>
</div>
<div class="health-card">
<div class="health-icon">👟</div>
<div class="health-value" id="steps">8,432</div>
<div class="health-label">步数</div>
<div class="health-trend up">↑ 15%</div>
</div>
<div class="health-card">
<div class="health-icon">🔥</div>
<div class="health-value" id="calories">320</div>
<div class="health-label">卡路里</div>
<div class="health-trend down">↓ 5%</div>
</div>
<div class="health-card">
<div class="health-icon">😴</div>
<div class="health-value" id="sleepHours">7.5</div>
<div class="health-label">睡眠 (小时)</div>
<div class="health-trend up">↑ 10%</div>
</div>
</div>
</div>

<div class="cd">
<h2>活动环</h2>
<div class="chart-container">
<canvas class="chart-canvas" id="activityChart"></canvas>
</div>
<div style="display:flex;justify-content:space-around;text-align:center">
<div><div style="color:var(--danger);font-weight:600" id="moveValue">320</div><div style="font-size:.8rem;color:var(--text2)">活动</div></div>
<div><div style="color:var(--success);font-weight:600" id="exerciseValue">30</div><div style="font-size:.8rem;color:var(--text2)">锻炼</div></div>
<div><div style="color:var(--accent);font-weight:600" id="standValue">8</div><div style="font-size:.8rem;color:var(--text2)">站立</div></div>
</div>
</div>

<div class="cd">
<h2>通知</h2>
<div class="notif-list" id="notifList"></div>
</div>

<div class="cd">
<h2>表盘选择</h2>
<div class="watchface-grid" id="watchfaceGrid"></div>
</div>

<div class="cd">
<h2>应用</h2>
<div class="app-grid" id="appGrid"></div>
</div>

<div class="cd">
<h2>手表设置</h2>
<div class="settings-group">
<label>手表名称</label>
<input type="text" id="watchName" value="我的手表" onchange="saveSettings()">
</div>
<div class="settings-group">
<label>亮度</label>
<select id="brightness" onchange="saveSettings()">
<option value="auto" selected>自动</option>
<option value="low">低</option>
<option value="medium">中</option>
<option value="high">高</option>
</select>
</div>
<div class="toggle-group">
<span>抬腕亮屏</span>
<div class="toggle on" id="wakeToggle" onclick="toggleSetting('wake')"></div>
</div>
<div class="toggle-group">
<span>心率监测</span>
<div class="toggle on" id="heartToggle" onclick="toggleSetting('heart')"></div>
</div>
<div class="toggle-group">
<span>睡眠追踪</span>
<div class="toggle on" id="sleepToggle" onclick="toggleSetting('sleep')"></div>
</div>
<div class="toggle-group">
<span>通知提醒</span>
<div class="toggle on" id="notifToggle" onclick="toggleSetting('notif')"></div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let heartRate=72;
let steps=8432;
let calories=320;
let sleepHours=7.5;
let notifications=JSON.parse(localStorage.getItem('sw_notifs')||'[]');
let settings=JSON.parse(localStorage.getItem('sw_settings')||'{"name":"我的手表","brightness":"auto","wake":true,"heart":true,"sleep":true,"notif":true}');
const watchfaces=[
  {id:'classic',name:'经典',icon:'⏰'},
  {id:'digital',name:'数字',icon:'🔢'},
  {id:'sport',name:'运动',icon:'🏃'},
  {id:'minimal',name:'简约',icon:'➖'},
  {id:'photo',name:'照片',icon:'📷'}
];
let currentWatchface='classic';
const apps=[
  {name:'心率',icon:'❤️'},
  {name:'运动',icon:'🏃'},
  {name:'睡眠',icon:'😴'},
  {name:'天气',icon:'🌤️'},
  {name:'音乐',icon:'🎵'},
  {name:'地图',icon:'🗺️'},
  {name:'支付',icon:'💰'},
  {name:'消息',icon:'💬'},
  {name:'闹钟',icon:'⏰'},
  {name:'计时器',icon:'⏱️'},
  {name:'手电筒',icon:'🔦'},
  {name:'设置',icon:'⚙️'}
];

function saveNotifs(){localStorage.setItem('sw_notifs',JSON.stringify(notifications.slice(-20)));}
function saveSettings(){localStorage.setItem('sw_settings',JSON.stringify(settings));}

function updateUI(){
  const now=new Date();
  $('watchTime').textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  $('watchDate').textContent=now.toLocaleDateString('zh-CN',{month:'long',day:'numeric'});
  $('watchName').value=settings.name;
  $('brightness').value=settings.brightness;
  ['wake','heart','sleep','notif'].forEach(key=>{
    $(key+'Toggle').className='toggle '+(settings[key]?'on':'');
  });
}

function updateHealth(){
  heartRate=Math.round(70+Math.random()*10);
  steps+=Math.round(Math.random()*50);
  calories+=Math.round(Math.random()*5);
  sleepHours=parseFloat((sleepHours+(Math.random()-0.5)*0.1).toFixed(1));
  
  $('heartRate').textContent=heartRate;
  $('steps').textContent=steps.toLocaleString();
  $('calories').textContent=calories;
  $('sleepHours').textContent=sleepHours;
}

function drawActivityChart(){
  const canvas=$('activityChart');
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth;
  canvas.height=canvas.offsetHeight;
  
  const centerX=canvas.width/2;
  const centerY=canvas.height/2;
  const radius=Math.min(centerX,centerY)-20;
  
  const rings=[
    {value:calories/500,color:'#ef4444'},
    {value:30/60,color:'#22c55e'},
    {value:8/12,color:'#3b82f6'}
  ];
  
  rings.forEach((ring,i)=>{
    const r=radius-i*15;
    ctx.beginPath();
    ctx.arc(centerX,centerY,r,0,Math.PI*2);
    ctx.strokeStyle='var(--border)';
    ctx.lineWidth=10;
    ctx.stroke();
    
    ctx.beginPath();
    ctx.arc(centerX,centerY,r,-Math.PI/2,-Math.PI/2+Math.PI*2*ring.value);
    ctx.strokeStyle=ring.color;
    ctx.lineWidth=10;
    ctx.lineCap='round';
    ctx.stroke();
  });
  
  $('moveValue').textContent=calories;
  $('exerciseValue').textContent=30;
  $('standValue').textContent=8;
}

function renderNotifications(){
  $('notifList').innerHTML=notifications.map(n=>`
    <div class="notif-item">
      <div class="notif-info">
        <div class="notif-icon">${n.icon}</div>
        <div>
          <div class="notif-text">${n.text}</div>
          <div class="notif-time">${n.time}</div>
        </div>
      </div>
      <button onclick="dismissNotif('${n.id}')" style="background:var(--danger)">删除</button>
    </div>
  `).join('');
}

function dismissNotif(id){
  notifications=notifications.filter(n=>n.id!==id);
  saveNotifs();
  renderNotifications();
}

function addNotification(icon,text){
  const now=new Date();
  notifications.unshift({id:Date.now().toString(),icon,text,time:now.toLocaleTimeString('zh-CN')});
  saveNotifs();
  renderNotifications();
}

function renderWatchfaces(){
  $('watchfaceGrid').innerHTML=watchfaces.map(wf=>`
    <div class="watchface-item ${wf.id===currentWatchface?'active':''}" onclick="setWatchface('${wf.id}')">
      <div class="watchface-preview">${wf.icon}</div>
      <div class="watchface-name">${wf.name}</div>
    </div>
  `).join('');
}

function setWatchface(id){
  currentWatchface=id;
  renderWatchfaces();
}

function renderApps(){
  $('appGrid').innerHTML=apps.map(app=>`
    <div class="app-item" onclick="alert('打开 ${app.name} 应用')">
      <div class="app-icon">${app.icon}</div>
      <div class="app-name">${app.name}</div>
    </div>
  `).join('');
}

function findWatch(){
  alert('正在查找手表...');
  addNotification('⌚','手表正在响铃');
}

function toggleSetting(key){
  settings[key]=!settings[key];
  saveSettings();
  updateUI();
}

function simulateNotif(){
  if(Math.random()>0.7){
    const notifs=[
      {icon:'📱',text:'新消息'},
      {icon:'📧',text:'新邮件'},
      {icon:'📞',text:'来电提醒'},
      {icon:'📅',text:'日程提醒'}
    ];
    const notif=notifs[Math.floor(Math.random()*notifs.length)];
    addNotification(notif.icon,notif.text);
  }
}

// Initialize with sample data
if(notifications.length===0){
  notifications=[
    {id:'1',icon:'📱',text:'微信新消息',time:'10:30'},
    {id:'2',icon:'📧',text:'工作邮件',time:'09:15'},
    {id:'3',icon:'📅',text:'会议提醒',time:'08:00'}
  ];
  saveNotifs();
}

updateUI();
renderNotifications();
renderWatchfaces();
renderApps();
setTimeout(drawActivityChart,100);
setInterval(updateUI,1000);
setInterval(updateHealth,5000);
setInterval(simulateNotif,15000);
window.addEventListener('resize',drawActivityChart);
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
