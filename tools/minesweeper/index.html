<style>
:root {--bg: #0d1117;
--card: #161b22;
--border: #30363d;
--text: #e6edf3;
--text2: #8b949e;
--accent: #3b82f6;
--success: #22c55e;
--warn: #f59e0b;
--danger: #ef4444;
--radius: 12px;
--shadow: 0 2px 12px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
* {margin: 0;
padding: 0;
box-sizing: border-box}
body {background: var(--bg);
color: var(--text);
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
user-select: none;

-webkit-tap-highlight-color: transparent;
padding: 10px;
touch-action: manipulationscroll-behavior:smooth;}
.container {background: var(--card);
border-radius: 16px;
box-shadow: var(--shadow);
padding: 24px;
max-width: 100%}
h1 {text-align: center;
font-size: 1.8rem;

color: var(--accent);
margin-bottom: 16px;
letter-spacing: 2px}
.difficulty-bar {display: flex;
justify-content: center;
gap: 8px;
margin-bottom: 16px;
flex-wrap: wrap}
.difficulty-bar button {background: var(--border);
color: var(--text2);
border: 1px solid var(--border);

transition: all 0.2s;
font-family: inherit}
.difficulty-bar button:hover {background: var(--accent);
color: var(--text)}
.difficulty-bar button.active {background: var(--accent);
color: var(--text);
border-color: var(--accent)}
.toolbar {display: flex;
justify-content: center;
align-items: center;
gap: 12px;
margin-bottom: 8px;
flex-wrap: wrap}

align-items: center;
gap: 6px;
font-size: 0.85rem;
color: var(--text2);
cursor: pointer}
.toolbar input[type="checkbox"] {accent-color: var(--accent)}
.control-panel {display: flex;
align-items: center;
justify-content: space-between;
background: var(--border);
border-radius: 12px;
padding: 10px 20px;
margin-bottom: 16px;
min-width: 280px}
.counter {background: var(--bg);
color: var(--danger);
font-family: 'Courier New', 'Menlo', monospace;
font-size: 1.5rem;
font-weight: 700;
padding: 6px 16px;
border-radius: 8px;
min-width: 60px;
text-align: center;
letter-spacing: 1px;
border: 1px solid var(--border)}
.face-btn {width: 44px;
height: 44px;
font-size: 1.5rem;
background: var(--border);
border: 1px solid var(--border);
border-radius: 10px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.15s;
line-height: 1}
.face-btn:hover {background: var(--accent);
transform: scale(1.08)}
.face-btn:active {transform: scale(0.95)}
.grid-wrapper {overflow: auto;
max-width: 100%;
-webkit-overflow-scrolling: touch;
margin-bottom: 12px}
table {border-collapse: collapse;
margin: 0 auto}
td {width: 28px;
height: 28px;
min-width: 28px;
min-height: 28px;
text-align: center;
vertical-align: middle;
font-size: 0.85rem;
font-weight: 700;
border: 1px solid var(--border);
background: var(--card);
cursor: pointer;
transition: background 0.08s;
position: relative;
padding: 0;
line-height: 28px;
touch-action: manipulation}
td:hover:not(.revealed) {background: #1c2333}
td.revealed {background: var(--bg);
cursor: default;
border-color: #0d1117}
td.revealed:hover {background: var(--bg)}
td:active:not(.revealed) {background: #1c2333}
td.n1  { color: #4a9eff; }
td.n2  { color: #4caf50; }
td.n3  { color: #f44336; }
td.n4  { color: #1a237e; }
td.n5  { color: #b71c1c; }
td.n6  { color: #00897b; }
td.n7  { color: #c9d1d9; }
td.n8  { color: #9e9e9e; }
td.flagged::after {content: '🚩';
font-size: 0.8rem;
line-height: 28px}
td.question::after {content: '❓';
font-size: 0.8rem;
line-height: 28px}
td.mine-hit {background: #f44336 !important}
td.mine-hit::after {content: '💣';
font-size: 0.9rem;
line-height: 28px}
td.mine-reveal::after {content: '💣';
font-size: 0.9rem;
line-height: 28px}
td.wrong-flag {background: #ff9800 !important}
td.wrong-flag::after {content: '❌';
font-size: 0.8rem;
line-height: 28px}
.highscores {margin-top: 12px;
font-size: 0.8rem;
color: var(--text2);
text-align: center}
.highscores h3 {color: var(--accent);
margin-bottom: 6px;
font-size: 1rem}
.highscores .score-row {display: flex;
justify-content: center;
gap: 16px;
flex-wrap: wrap;
margin-bottom: 2px}
.highscores .score-item {background: var(--border);
padding: 4px 12px;
border-radius: 6px;
min-width: 120px}
.highscores .score-label {color: var(--text2);
margin-right: 6px}
.highscores .score-val {color: var(--accent);
font-weight: 700;
font-family: 'Courier New', monospace}
.instructions {text-align: center;
font-size: 0.75rem;
color: #6e7681;
margin-top: 10px;
line-height: 1.6}
.instructions span {color: var(--text2)}
@media (min-width: 600px) {td {width: 32px;
height: 32px;
min-width: 32px;
min-height: 32px;
font-size: 0.9rem;
line-height: 32px}}
@media (min-width: 900px) {td {width: 36px;
height: 36px;
min-width: 36px;
min-height: 36px;
font-size: 1rem;
line-height: 36px}}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);outline:none}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="💣 扫雷游戏">
  <meta property="og:description" content="经典扫雷游戏，找出所有安全格子避开地雷">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/minesweeper/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>

<div class="container">
  <h1>💣 扫 雷 💣</h1>

  <div class="difficulty-bar">
    <button id="btn-easy" class="active" onclick="setDifficulty('easy')">初级 9×9 (10💣)</button>
    <button id="btn-medium" onclick="setDifficulty('medium')">中级 16×16 (40💣)</button>
    <button id="btn-hard" onclick="setDifficulty('hard')">高级 30×16 (99💣)</button>
  </div>

  <div class="toolbar">
    <label>
      <input type="checkbox" id="questionToggle">
      问号模式 (❓)
    </label>
  </div>

  <div class="control-panel">
    <div class="counter" id="mineCounter">010</div>
    <button class="face-btn" id="faceBtn" onclick="resetGame()">😊</button>
    <div class="counter" id="timer">000</div>
  </div>

  <div class="grid-wrapper">
    <table id="grid"></table>
  </div>

  <div class="highscores" id="highscores"></div>

  <div class="instructions">
    <span>🖱️ 左键点击：翻开格子</span>&nbsp;&nbsp;
    <span>🖱️ 右键 / 长按：插旗 🚩</span>&nbsp;&nbsp;
    <span>📱 移动端：点击翻开，长按插旗</span>
  </div>
</div>

<script>
"use strict";
const CONFIG = {
  easy:   { rows: 9,  cols: 9,  mines: 10, label: '初级' },
  medium: { rows: 16, cols: 16, mines: 40, label: '中级' },
  hard:   { rows: 30, cols: 16, mines: 99, label: '高级' },
};
let difficulty = 'easy';
let rows, cols, totalMines;
let board = [];
let gameOver = false;
let gameWon = false;
let firstClickDone = false;
let flaggedCount = 0;
let revealedCount = 0;
let timerInterval = null;
let seconds = 0;
let questionMode = false;
let lastCell = null;
const gridEl = document.getElementById('grid');
const mineCounterEl = document.getElementById('mineCounter');
const timerEl = document.getElementById('timer');
const faceBtn = document.getElementById('faceBtn');
const questionToggle = document.getElementById('questionToggle');
const highscoresEl = document.getElementById('highscores');
function init() {
  const cfg = CONFIG[difficulty];
  rows = cfg.rows;
  cols = cfg.cols;
  totalMines = cfg.mines;
  board = [];
  gameOver = false;
  gameWon = false;
  firstClickDone = false;
  flaggedCount = 0;
  revealedCount = 0;
  seconds = 0;
  stopTimer();
  updateTimer();
  updateMineCounter();
  faceBtn.textContent = '😊';
  for (let r = 0; r < rows; r++) {
    board[r] = [];
    for (let c = 0; c < cols; c++) {
      board[r][c] = { mine: false, revealed: false, flagged: false, question: false, adjacentMines: 0 };
    }
  }
  updateDifficultyButtons();
  renderGrid();
  updateHighscores();
}
function placeMines(safeR, safeC) {
  const safeZone = new Set();
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      const nr = safeR + dr;
      const nc = safeC + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
        safeZone.add(`${nr},${nc}`);
      }
    }
  }
  const available = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (!safeZone.has(`${r},${c}`)) {
        available.push({ r, c });
      }
    }
  }
  const total = available.length;
  const needed = Math.min(totalMines, total);
  for (let i = 0; i < needed; i++) {
    const j = i + Math.floor(Math.random() * (total - i));
    [available[i], available[j]] = [available[j], available[i]];
  }
  for (let i = 0; i < needed; i++) {
    board[available[i].r][available[i].c].mine = true;
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c].mine) continue;
      let count = 0;
      forEachNeighbor(r, c, (nr, nc) => {
        if (board[nr][nc].mine) count++;
      });
      board[r][c].adjacentMines = count;
    }
  }
}
function forEachNeighbor(r, c, fn) {
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr;
      const nc = c + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
        fn(nr, nc);
      }
    }
  }
}
function renderGrid() {
  gridEl.innerHTML = '';
  for (let r = 0; r < rows; r++) {
    const tr = document.createElement('tr');
    for (let c = 0; c < cols; c++) {
      const td = document.createElement('td');
      td.dataset.r = r;
      td.dataset.c = c;
      updateCellAppearance(td, board[r][c], false);
      tr.appendChild(td);
    }
    gridEl.appendChild(tr);
  }
}
function updateCellAppearance(td, cell, gold) {
  td.className = '';
  if (cell.revealed) {
    td.classList.add('revealed');
    if (cell.mine) {
      td.classList.add(gold ? 'mine-hit' : 'mine-reveal');
    } else if (cell.adjacentMines > 0) {
      td.textContent = cell.adjacentMines;
      td.classList.add('n' + cell.adjacentMines);
    } else {
      td.textContent = '';
    }
  } else {
    td.textContent = '';
    if (cell.flagged) {
      td.classList.add('flagged');
    } else if (cell.question) {
      td.classList.add('question');
    }
  }
}
function updateCellAt(r, c, gold) {
  const td = gridEl.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
  if (td) updateCellAppearance(td, board[r][c], gold);
}
let touchStartTime = 0;
let touchStartPos = null;
const LONG_PRESS_DURATION = 500;
gridEl.addEventListener('click', (e) => {
  if (gameOver) return;
  const td = e.target.closest('td');
  if (!td) return;
  const r = parseInt(td.dataset.r);
  const c = parseInt(td.dataset.c);
  if (isNaN(r) || isNaN(c)) return;
  const cell = board[r][c];
  if (cell.revealed) {
    chordReveal(r, c);
    return;
  }
  if (cell.flagged) return;
  if (cell.question) return;
  revealCell(r, c);
});
gridEl.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (gameOver) return;
  const td = e.target.closest('td');
  if (!td) return;
  const r = parseInt(td.dataset.r);
  const c = parseInt(td.dataset.c);
  if (isNaN(r) || isNaN(c)) return;
  const cell = board[r][c];
  if (cell.revealed) return;
  toggleFlag(r, c);
});
gridEl.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  const td = e.target.closest('td');
  if (!td) return;
  lastCell = td;
  touchStartTime = Date.now();
  touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
gridEl.addEventListener('touchend', (e) => {
  if (!lastCell) return;
  const td = lastCell;
  const elapsed = Date.now() - touchStartTime;
  const dx = e.changedTouches[0] ? Math.abs(e.changedTouches[0].clientX - (touchStartPos?.x || 0)) : 0;
  const dy = e.changedTouches[0] ? Math.abs(e.changedTouches[0].clientY - (touchStartPos?.y || 0)) : 0;
  const moved = dx > 10 || dy > 10;
  lastCell = null;
  if (gameOver) return;
  if (moved) return;
  const r = parseInt(td.dataset.r);
  const c = parseInt(td.dataset.c);
  if (isNaN(r) || isNaN(c)) return;
  if (elapsed >= LONG_PRESS_DURATION) {
    const cell = board[r][c];
    if (!cell.revealed) {
      toggleFlag(r, c);
    }
  }
});
gridEl.addEventListener('dblclick', (e) => e.preventDefault());
function revealCell(r, c) {
  const cell = board[r][c];
  if (cell.revealed || cell.flagged || cell.question || gameOver) return;
  if (!firstClickDone) {
    firstClickDone = true;
    placeMines(r, c);
    startTimer();
  }
  cell.revealed = true;
  revealedCount++;
  if (cell.mine) {
    gameOver = true;
    gameWon = false;
    faceBtn.textContent = '😵';
    stopTimer();
    updateCellAt(r, c, true);
    revealAllMines(r, c);
    return;
  }
  updateCellAt(r, c, false);
  if (cell.adjacentMines === 0) {
    floodFill(r, c);
  }
  checkWin();
}
function floodFill(startR, startC) {
  const queue = [[startR, startC]];
  const visited = new Set();
  visited.add(`${startR},${startC}`);
  while (queue.length > 0) {
    const [cr, cc] = queue.shift();
    forEachNeighbor(cr, cc, (nr, nc) => {
      const ncell = board[nr][nc];
      if (visited.has(`${nr},${nc}`)) return;
      if (ncell.revealed || ncell.flagged || ncell.question || ncell.mine) return;
      visited.add(`${nr},${nc}`);
      ncell.revealed = true;
      revealedCount++;
      updateCellAt(nr, nc, false);
      if (ncell.adjacentMines === 0) {
        queue.push([nr, nc]);
      }
    });
  }
}
function chordReveal(r, c) {
  const cell = board[r][c];
  if (!cell.revealed || cell.adjacentMines === 0) return;
  let adjFlags = 0;
  forEachNeighbor(r, c, (nr, nc) => {
    if (board[nr][nc].flagged) adjFlags++;
  });
  if (adjFlags !== cell.adjacentMines) return;
  forEachNeighbor(r, c, (nr, nc) => {
    const ncell = board[nr][nc];
    if (!ncell.revealed && !ncell.flagged && !ncell.question) {
      revealCell(nr, nc);
    }
  });
}
function toggleFlag(r, c) {
  const cell = board[r][c];
  if (cell.revealed || gameOver) return;
  if (questionMode) {
    if (cell.flagged) {
      cell.flagged = false;
      cell.question = true;
      flaggedCount--;
    } else if (cell.question) {
      cell.question = false;
    } else {
      cell.flagged = true;
      flaggedCount++;
    }
  } else {
    if (cell.flagged) {
      cell.flagged = false;
      flaggedCount--;
    } else {
      cell.flagged = true;
      flaggedCount++;
    }
  }
  updateCellAt(r, c, false);
  updateMineCounter();
  checkWin();
}
function revealAllMines(hitR, hitC) {
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = board[r][c];
      if (cell.mine && !cell.revealed && !cell.flagged) {
        updateCellAt(r, c, false);
        cell.revealed = true;
      }
      if (cell.flagged && !cell.mine) {
        const td = gridEl.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
        if (td) {
          td.classList.add('wrong-flag');
          td.textContent = '';
        }
      }
    }
  }
}
function checkWin() {
  const totalCells = rows * cols;
  if (revealedCount === totalCells - totalMines) {
    gameOver = true;
    gameWon = true;
    faceBtn.textContent = '😎';
    stopTimer();
    saveHighscore();
    updateHighscores();
  }
}
function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    seconds++;
    updateTimer();
  }, 1000);
}
function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}
function updateTimer() {
  timerEl.textContent = String(seconds).padStart(3, '0');
}
function updateMineCounter() {
  const remaining = totalMines - flaggedCount;
  mineCounterEl.textContent = String(Math.max(0, remaining)).padStart(3, '0');
}
function setDifficulty(d) {
  if (difficulty === d && firstClickDone) return;
  difficulty = d;
  init();
}
function updateDifficultyButtons() {
  document.querySelectorAll('.difficulty-bar button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + difficulty)?.classList.add('active');
}
function resetGame() {
  init();
}
questionToggle.addEventListener('change', () => {
  questionMode = questionToggle.checked;
});
function getHighscoreKey() {
  return `minesweeper_highscore_${difficulty}`;
}
function saveHighscore() {
  const key = getHighscoreKey();
  const stored = JSON.parse(localStorage.getItem(key) || '[]');
  if (!Array.isArray(stored)) return;
  const entry = { time: seconds, date: new Date().toLocaleDateString('zh-CN') };
  stored.push(entry);
  stored.sort((a, b) => a.time - b.time);
  const top = stored.slice(0, 5);
  localStorage.setItem(key, JSON.stringify(top));
}
function updateHighscores() {
  const levels = ['easy', 'medium', 'hard'];
  let html = '<h3>🏆 最佳纪录</h3>';
  for (const lv of levels) {
    const key = `minesweeper_highscore_${lv}`;
    const stored = JSON.parse(localStorage.getItem(key) || '[]');
    const cfg = CONFIG[lv];
    html += '<div class="score-row">';
    html += `<span class="score-label">${cfg.label}：</span>`;
    if (Array.isArray(stored) && stored.length > 0) {
      const entries = stored.slice(0, 3);
      html += entries.map((e, i) =>
        `<span class="score-item">#${i+1} <span class="score-val">${e.time}秒</span> ${e.date || ''}</span>`
      ).join(' ');
    } else {
      html += '<span class="score-item">暂无纪录</span>';
    }
    html += '</div>';
  }
  highscoresEl.innerHTML = html;
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    resetGame();
  }
});
init();
</script>
