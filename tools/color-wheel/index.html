<script>
const canvas = document.getElementById('colorWheel');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const CX = W / 2;
const CY = H / 2;
const R = 170;
let hue = 24;
let saturation = 100;
let lightness = 60;
let opacity = 100;
let angularPos = (hue * Math.PI) / 180;
let radialPos = (saturation / 100) * R;
let pickerX = CX + radialPos * Math.cos(angularPos);
let pickerY = CY - radialPos * Math.sin(angularPos);
let savedPalettes = [];
let currentHarmony = 'complementary';
let cbMode = 'normal';
function drawWheel() {
  const imgData = ctx.createImageData(W, H);
  const data = imgData.data;
  const l = lightness / 100;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const dx = x - CX;
      const dy = y - CY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > R) { data[(y * W + x) * 4 + 3] = 0; continue; }
      let ang = Math.atan2(-dy, dx);
      if (ang < 0) ang += 2 * Math.PI;
      const h = (ang * 180) / Math.PI;
      const s = Math.min(dist / R, 1);
      const rgb = hslToRgb(h, s * 100, lightness);
      if (cbMode !== 'normal') {
        const sim = simulateColorBlindness(rgb, cbMode);
        data[(y * W + x) * 4] = sim.r;
        data[(y * W + x) * 4 + 1] = sim.g;
        data[(y * W + x) * 4 + 2] = sim.b;
      } else {
        data[(y * W + x) * 4] = rgb.r;
        data[(y * W + x) * 4 + 1] = rgb.g;
        data[(y * W + x) * 4 + 2] = rgb.b;
      }
      data[(y * W + x) * 4 + 3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}
function drawHarmonyLines() {
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, 2 * Math.PI);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.stroke();
  const angles = getHarmonyAngles();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  angles.forEach(a => {
    const ex = CX + R * Math.cos(a);
    const ey = CY - R * Math.sin(a);
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(ex, ey);
    ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(pickerX, pickerY);
  ctx.stroke();
  angles.forEach(a => {
    const px = CX + radialPos * Math.cos(a);
    const py = CY - radialPos * Math.sin(a);
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, 2 * Math.PI);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();
  });
}
function updateWheel() {
  drawWheel();
  drawHarmonyLines();
}
function getHarmonyAngles() {
  const baseAng = angularPos;
  const angles = [baseAng];
  switch (currentHarmony) {
    case 'complementary':
      angles.push((baseAng + Math.PI) % (2 * Math.PI));
      break;
    case 'split-complementary':
      angles.push((baseAng + Math.PI - Math.PI / 6) % (2 * Math.PI));
      angles.push((baseAng + Math.PI + Math.PI / 6) % (2 * Math.PI));
      break;
    case 'triadic':
      angles.push((baseAng + 2 * Math.PI / 3) % (2 * Math.PI));
      angles.push((baseAng + 4 * Math.PI / 3) % (2 * Math.PI));
      break;
    case 'tetradic':
      angles.push((baseAng + Math.PI / 2) % (2 * Math.PI));
      angles.push((baseAng + Math.PI) % (2 * Math.PI));
      angles.push((baseAng + 3 * Math.PI / 2) % (2 * Math.PI));
      break;
    case 'analogous':
      angles.push((baseAng - Math.PI / 6 + 2 * Math.PI) % (2 * Math.PI));
      angles.push((baseAng + Math.PI / 6) % (2 * Math.PI));
      break;
    case 'monochromatic':
      for (let i = 1; i <= 4; i++) {
        angles.push(baseAng);
      }
      break;
  }
  return angles;
}
function getHarmonyColors() {
  const baseAng = angularPos;
  const s = saturation;
  const l = lightness;
  const a = opacity / 100;
  const hueDeg = ((baseAng * 180) / Math.PI) % 360;
  const colors = [];
  function addColor(h, sat, light) {
    const rgb = hslToRgb(((h % 360) + 360) % 360, sat, light);
    const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
    const rgbaStr = opacity < 100 ? `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${a.toFixed(2)})` : rgbToHex(rgb.r, rgb.g, rgb.b);
    colors.push({
      h: ((h % 360) + 360) % 360,
      s: sat,
      l: light,
      r: rgb.r, g: rgb.g, b: rgb.b,
      hex: hex,
      rgba: rgbaStr,
    });
  }
  switch (currentHarmony) {
    case 'complementary':
      addColor(hueDeg, s, l);
      addColor(hueDeg + 180, s, l);
      break;
    case 'split-complementary':
      addColor(hueDeg, s, l);
      addColor(hueDeg + 150, s, l);
      addColor(hueDeg + 210, s, l);
      break;
    case 'triadic':
      addColor(hueDeg, s, l);
      addColor(hueDeg + 120, s, l);
      addColor(hueDeg + 240, s, l);
      break;
    case 'tetradic':
      addColor(hueDeg, s, l);
      addColor(hueDeg + 90, s, l);
      addColor(hueDeg + 180, s, l);
      addColor(hueDeg + 270, s, l);
      break;
    case 'analogous':
      addColor(hueDeg - 30, s, l);
      addColor(hueDeg, s, l);
      addColor(hueDeg + 30, s, l);
      break;
    case 'monochromatic':
      addColor(hueDeg, s, Math.max(0, l - 20));
      addColor(hueDeg, s, Math.max(0, l - 10));
      addColor(hueDeg, s, l);
      addColor(hueDeg, s, Math.min(100, l + 10));
      addColor(hueDeg, s, Math.min(100, l + 20));
      break;
  }
  return colors;
}
function updateUI() {
  const colors = getHarmonyColors();
  const mainColor = colors[0];
  hue = mainColor.h;
  saturation = Math.round(mainColor.s);
  document.getElementById('hexVal').textContent = mainColor.hex;
  document.getElementById('rgbVal').textContent = `rgb(${mainColor.r}, ${mainColor.g}, ${mainColor.b})`;
  document.getElementById('hslVal').textContent = `hsl(${Math.round(mainColor.h)}, ${Math.round(mainColor.s)}%, ${Math.round(mainColor.l)}%)`;
  document.getElementById('mainSwatch').style.backgroundColor = mainColor.rgba;
  const container = document.getElementById('paletteColors');
  container.innerHTML = '';
  colors.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'palette-swatch';
    div.onclick = () => {
      hue = c.h;
      saturation = c.s;
      lightness = c.l;
      angularPos = (hue * Math.PI) / 180;
      radialPos = (saturation / 100) * R;
      pickerX = CX + radialPos * Math.cos(angularPos);

function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s = Math.max(0, Math.min(100, s)) / 100;
  l = Math.max(0, Math.min(100, l)) / 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let r1, g1, b1;
  if (h < 60) { r1 = c; g1 = x; b1 = 0; }
  else if (h < 120) { r1 = x; g1 = c; b1 = 0; }
  else if (h < 180) { r1 = 0; g1 = c; b1 = x; }
  else if (h < 240) { r1 = 0; g1 = x; b1 = c; }
  else if (h < 300) { r1 = x; g1 = 0; b1 = c; }
  else { r1 = c; g1 = 0; b1 = x; }
  return {
    r: Math.round((r1 + m) * 255),
    g: Math.round((g1 + m) * 255),
    b: Math.round((b1 + m) * 255),
  };
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2;
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
      case g: h = ((b - r) / d + 2) / 6; break;
      case b: h = ((r - g) / d + 4) / 6; break;
    }
  }
  return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
}
function rgbToHex(r, g, b) {
  const toHex = (n) => {
    const clamped = Math.max(0, Math.min(255, Math.round(n)));
    return clamped.toString(16).padStart(2, '0');
  };
  return '#' + toHex(r) + toHex(g) + toHex(b).toUpperCase();
}
function simulateColorBlindness(rgb, type) {
  const r = rgb.r / 255, g = rgb.g / 255, b = rgb.b / 255;
  let matrix;
  switch (type) {
    case 'protanopia':
      matrix = [0.567, 0.433, 0, 0.558, 0.442, 0, 0, 0.242, 0.758];
      break;
    case 'deuteranopia':
      matrix = [0.625, 0.375, 0, 0.7, 0.3, 0, 0, 0.3, 0.7];
      break;
    case 'tritanopia':
      matrix = [0.95, 0.05, 0, 0, 0.433, 0.567, 0, 0.475, 0.525];
      break;
    default:
      return rgb;
  }
  const nr = matrix[0] * r + matrix[1] * g + matrix[2] * b;
  const ng = matrix[3] * r + matrix[4] * g + matrix[5] * b;
  const nb = matrix[6] * r + matrix[7] * g + matrix[8] * b;
  return {
    r: Math.round(Math.max(0, Math.min(1, nr)) * 255),
    g: Math.round(Math.max(0, Math.min(1, ng)) * 255),
    b: Math.round(Math.max(0, Math.min(1, nb)) * 255),
  };
}
function getLuminance(rgb) {
  const toLinear = (c) => {
    c = c / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * toLinear(rgb.r) + 0.7152 * toLinear(rgb.g) + 0.0722 * toLinear(rgb.b);
}
function getContrastRatio(c1, c2) {
  const l1 = getLuminance(c1);
  const l2 = getLuminance(c2);
  const lighter = Math.max(l1, l2);
  const darker = Math.min(l1, l2);
  return (lighter + 0.05) / (darker + 0.05);
}
function posFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  return { x: mx, y: my };
}
function handlePick(x, y) {
  const dx = x - CX;
  const dy = y - CY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const clampedDist = Math.min(dist, R);
  let ang = Math.atan2(-dy, dx);
  if (ang < 0) ang += 2 * Math.PI;
  hue = ((ang * 180) / Math.PI) % 360;
  saturation = Math.round((clampedDist / R) * 100);
  angularPos = ang;
  radialPos = clampedDist;
  pickerX = CX + radialPos * Math.cos(angularPos);
  pickerY = CY - radialPos * Math.sin(angularPos);
  updateAll();
}
canvas.addEventListener('mousedown', (e) => {
  const pos = posFromEvent(e);
  handlePick(pos.x, pos.y);
  const onMove = (ev) => {
    const p = posFromEvent(ev);
    handlePick(p.x, p.y);
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const pos = posFromEvent(e.touches[0]);
  handlePick(pos.x, pos.y);
  const onMove = (ev) => {
    ev.preventDefault();
    const p = posFromEvent(ev.touches[0]);
    handlePick(p.x, p.y);
  };
  const onUp = () => {
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  };
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend', onUp);
});

function savePalette() {

function renderSaved() {

function exportImage() {
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = W;
  tempCanvas.height = H;
  const tempCtx = tempCanvas.getContext('2d');
  drawWheelOnCtx(tempCtx);
  drawHarmonyLinesOnCtx(tempCtx);

  link.href = tempCanvas.toDataURL('image/png');
  link.click();

}
function drawWheelOnCtx(c) {
  const imgData = ctx.createImageData(W, H);
  const data = imgData.data;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const dx = x - CX;
      const dy = y - CY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > R) { data[(y * W + x) * 4 + 3] = 0; continue; }
      let ang = Math.atan2(-dy, dx);
      if (ang < 0) ang += 2 * Math.PI;
      const h = (ang * 180) / Math.PI;
      const s = Math.min(dist / R, 1);
      const rgb = hslToRgb(h, s * 100, lightness);
      data[(y * W + x) * 4] = rgb.r;
      data[(y * W + x) * 4 + 1] = rgb.g;
      data[(y * W + x) * 4 + 2] = rgb.b;
      data[(y * W + x) * 4 + 3] = 255;
    }
  }
  c.putImageData(imgData, 0, 0);
}
function drawHarmonyLinesOnCtx(c) {
  c.beginPath();
  c.arc(CX, CY, R, 0, 2 * Math.PI);
  c.strokeStyle = '#333';
  c.lineWidth = 2;
  c.stroke();
  const angles = getHarmonyAngles();
  c.strokeStyle = 'rgba(255,255,255,0.5)';
  c.lineWidth = 2;
  c.setLineDash([6, 4]);
  angles.forEach(a => {
    const ex = CX + R * Math.cos(a);
    const ey = CY - R * Math.sin(a);
    c.beginPath();
    c.moveTo(CX, CY);
    c.lineTo(ex, ey);
    c.stroke();
  });
  c.setLineDash([]);
  c.strokeStyle = 'rgba(255,255,255,0.8)';
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(CX, CY);
  c.lineTo(pickerX, pickerY);
  c.stroke();
  angles.forEach(a => {
    const px = CX + radialPos * Math.cos(a);
    const py = CY - radialPos * Math.sin(a);
    c.beginPath();
    c.arc(px, py, 6, 0, 2 * Math.PI);
    c.fillStyle = '#fff';
    c.fill();
    c.strokeStyle = '#000';
    c.lineWidth = 2;
    c.stroke();
  });
}
