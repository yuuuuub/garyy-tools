<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>太空侵略者</title>
<meta name="description" content="经典太空侵略者游戏，消灭入侵的外星人">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;user-select:none}
h1{font-size:1.3rem;margin-bottom:8px;color:#3b82f6}
canvas{background:var(--bg);border:2px solid #30363d;border-radius:8px;touch-action:none}
.hud{display:flex;gap:20px;margin-top:8px;font-size:0.9rem;color:#8b949e}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="太空侵略者">
  <meta property="og:description" content="经典太空侵略者游戏，消灭入侵的外星人">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/space-invaders/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<h1>🚀 太空侵略者</h1>
<canvas id="game" width="480" height="400"></canvas>
<div class="hud"><span>分数: <b id="score">0</b></span><span>关卡: <b id="level">1</b></span><span>生命: <b id="lives">3</b></span></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
let player={x:W/2,y:H-40,w:30,h:20},bullets=[],eBullets=[],aliens=[],stars=[];
let score=0,lives=3,level=1,alienDir=1,alienSpeed=0.5,frame=0,gameState='start';
let keys={};let alienShootTimer=0;
function createStars(){stars=[];for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.5})}
function createAliens(){
  aliens=[];
  for(let r=0;r<4+Math.min(level-1,2);r++)for(let c=0;c<8;c++){
    aliens.push({x:40+c*50,y:40+r*35,w:24,h:20,alive:true,type:r<2?2:1});
  }
}
function reset(){score=0;lives=3;level=1;player.x=W/2;bullets=[];eBullets=[];createAliens();createStars()}
function nextLevel(){level++;bullets=[];eBullets=[];createAliens();alienDir=1}
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&gameState==='start')startGame()});
document.addEventListener('keyup',e=>{keys[e.code]=false});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(gameState==='start')startGame();if(gameState==='playing')shoot()});
canvas.addEventListener('pointermove',e=>{
  if(gameState!=='playing')return;
  const rect=canvas.getBoundingClientRect();
  player.x=((e.clientX-rect.left)/rect.width)*W;
  player.x=Math.max(15,Math.min(W-15,player.x));
});
function startGame(){reset();gameState='playing'}
function shoot(){if(bullets.length<3)bullets.push({x:player.x,y:player.y-10,vy:-6})}
function draw(){
  ctx.fillStyle='#0a0e1a';ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${0.3+s.s*0.2})`;ctx.fillRect(s.x,s.y,s.s,s.s)});
  if(gameState==='start'){
    ctx.fillStyle='#e6edf3';ctx.font='bold 26px system-ui';ctx.textAlign='center';
    ctx.fillText('🚀 太空侵略者',W/2,150);
    ctx.font='16px system-ui';ctx.fillStyle='#8b949e';
    ctx.fillText('← → 或触摸移动，空格/点击射击',W/2,200);
    ctx.fillText('点击/空格开始',W/2,240);return;
  }
  ctx.fillStyle='#3b82f6';ctx.beginPath();
  ctx.moveTo(player.x,player.y-15);ctx.lineTo(player.x-15,player.y+10);ctx.lineTo(player.x+15,player.y+10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#60a5fa';ctx.fillRect(player.x-3,player.y+10,6,8);
  ctx.fillStyle='#22c55e';bullets.forEach(b=>{ctx.fillRect(b.x-1.5,b.y,3,10)});
  ctx.fillStyle='#ef4444';eBullets.forEach(b=>{ctx.fillRect(b.x-1.5,b.y,3,10)});
  aliens.forEach(a=>{
    if(!a.alive)return;
    ctx.fillStyle=a.type===2?'#ef4444':'#eab308';
    ctx.beginPath();ctx.arc(a.x,a.y,a.w/2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=a.type===2?'#fca5a5':'#fde68a';
    ctx.fillRect(a.x-8,a.y-4,4,4);ctx.fillRect(a.x+4,a.y-4,4,4);
  });
  document.getElementById('score').textContent=score;
  document.getElementById('level').textContent=level;
  document.getElementById('lives').textContent='❤️'.repeat(lives);
  if(gameState==='over'){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ef4444';ctx.font='bold 30px system-ui';ctx.textAlign='center';
    ctx.fillText('游戏结束',W/2,180);
    ctx.fillStyle='#e6edf3';ctx.font='20px system-ui';ctx.fillText(`分数: ${score}  关卡: ${level}`,W/2,220);
    ctx.fillStyle='#8b949e';ctx.font='16px system-ui';ctx.fillText('点击重新开始',W/2,270);
  }
}
function update(){
  if(gameState!=='playing')return;
  frame++;
  if(keys.ArrowLeft||keys.KeyA)player.x-=5;
  if(keys.ArrowRight||keys.KeyD)player.x+=5;
  player.x=Math.max(15,Math.min(W-15,player.x));
  bullets.forEach(b=>b.y+=b.vy);
  bullets=bullets.filter(b=>b.y>-10);
  let hitEdge=false;
  aliens.forEach(a=>{if(a.alive){a.x+=alienDir*alienSpeed;if(a.x+12>W-5||a.x-12<5)hitEdge=true}});
  if(hitEdge){alienDir*=-1;aliens.forEach(a=>{if(a.alive)a.y+=10})}
  alienShootTimer++;
  if(alienShootTimer>60-Math.min(level*5,30)){
    const living=aliens.filter(a=>a.alive);
    if(living.length){const a=living[Math.floor(Math.random()*living.length)];eBullets.push({x:a.x,y:a.y+10,vy:3+level*0.3})}
    alienShootTimer=0;
  }
  eBullets.forEach(b=>b.y+=b.vy);
  eBullets=eBullets.filter(b=>b.y<H+10);
  bullets.forEach(b=>{
    aliens.forEach(a=>{
      if(!a.alive)return;
      if(Math.abs(b.x-a.x)<a.w/2+3&&Math.abs(b.y-a.y)<a.h/2+5){
        a.alive=false;b.y=-100;score+=a.type===2?20:10;
      }
    });
  });
  eBullets.forEach(b=>{
    if(Math.abs(b.x-player.x)<15&&Math.abs(b.y-player.y)<15){lives--;b.y=H+100;if(lives<=0)gameState='over'}
  });
  if(aliens.some(a=>a.alive&&a.y+a.h/2>player.y-20))gameState='over';
  if(aliens.every(a=>!a.alive))nextLevel();
}
function loop(){draw();update();requestAnimationFrame(loop)}
createStars();createAliens();loop();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
