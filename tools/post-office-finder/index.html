<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮局查找 - Post Office Finder</title>
<meta name="description" content="邮局查找工具，定位附近的邮政服务网点">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#22c55e;--yellow:#eab308;--muted:#8b949e}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vhpadding:16px;scroll-behavior:smooth;}
.container{max-width:1200px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 0}
header h1{font-size:1.8em;margin-bottom:4px}
header p{color:var(--muted)}
.filters{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.filter-group label{font-size:12px;color:var(--muted);font-weight:600}
.filter-group input,.filter-group select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px;width:100%}
.filter-group input:focus,.filter-group select:focus{outline:none;border-color:var(--accent)}
.sort-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.sort-bar span{color:var(--muted);font-size:14px}
.sort-options{display:flex;gap:8px}
.sort-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.sort-btn.active{background:var(--accent);border-color:var(--accent)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card h3{font-size:16px;margin-bottom:8px}
.card-info{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);margin-bottom:10px}
.card-info span{display:flex;align-items:center;gap:6px}
.services{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.svc-tag{font-size:11px;padding:2px 8px;border-radius:10px}
.svc-express{background:rgba(34,197,94,.1);color:var(--green)}
.svc-package{background:rgba(59,130,246,.1);color:var(--accent)}
.svc-letter{background:rgba(234,179,8,.1);color:var(--yellow)}
.svc-other{background:rgba(139,148,158,.1);color:var(--muted)}
.materials{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.mat-tag{font-size:10px;padding:2px 6px;border-radius:8px;background:rgba(139,148,158,.1);color:var(--muted)}
.distance{font-size:12px;color:var(--green);font-weight:600;margin-top:6px}
.no-results{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:640px){.results{grid-template-columns:1fr}.filters{flex-direction:column}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="邮局查找 - Post Office Finder">
  <meta property="og:description" content="邮局查找工具，定位附近的邮政服务网点">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/post-office-finder/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>📮 邮局查找</h1><p>查找附近邮局，寄送包裹信件</p></header>
<div class="filters">
<div class="filter-group" style="flex:2"><label>搜索</label><input type="text" id="search" placeholder="输入邮局名称或地址..."></div>
<div class="filter-group"><label>服务类型</label><select id="serviceFilter"><option value="">全部</option><option value="快递">快递</option><option value="包裹">包裹</option><option value="信件">信件</option><option value="集邮">集邮</option></select></div>
<div class="filter-group"><label>营业时间</label><select id="hourFilter"><option value="">全部</option><option value="full">全天营业</option><option value="half">半天营业</option></select></div>
</div>
<div class="sort-bar"><span id="resultCount"></span><div class="sort-options"><button class="sort-btn active" data-sort="distance">距离优先</button><button class="sort-btn" data-sort="rating">评分优先</button><button class="sort-btn" data-sort="name">名称排序</button></div></div>
<div class="results" id="results"></div>
</div>
<script>
const postOffices=[
{id:1,name:"中国邮政(朝阳区营业厅)",address:"朝阳区建国路93号",rating:4.5,phone:"010-65881688",hours:"09:00-17:00",services:["快递","包裹","信件","集邮"],materials:["纸箱","气泡袋","胶带","填充物"],distance:0.5,description:"朝阳区最大的邮政营业厅"},
{id:2,name:"中国邮政(海淀支行)",address:"海淀区中关村大街1号",rating:4.3,phone:"010-82618888",hours:"09:00-17:00",services:["快递","包裹","信件"],materials:["纸箱","气泡袋","胶带"],distance:1.2,description:"海淀区主要邮政网点"},
{id:3,name:"中国邮政(西城分局)",address:"西城区金融街35号",rating:4.4,phone:"010-66018888",hours:"09:00-12:00,14:00-17:00",services:["快递","包裹","信件","集邮"],materials:["纸箱","气泡袋","胶带","填充物","纪念邮票"],distance:1.8,description:"西城区核心邮局，集邮服务特色"},
{id:4,name:"中国邮政(东城营业所)",address:"东城区东长安街1号",rating:4.2,phone:"010-65881688",hours:"09:00-17:00",services:["快递","包裹","信件"],materials:["纸箱","胶带"],distance:2.0,description:"长安街沿线邮局"},
{id:5,name:"顺丰速运(望京店)",address:"朝阳区望京街10号",rating:4.6,phone:"010-84726018",hours:"08:00-21:00",services:["快递"],materials:["纸箱","气泡袋","胶带","填充物"],distance:0.8,description:"顺丰直营店，时效有保障"},
{id:6,name:"中通快递(五道口站)",address:"海淀区成府路35号",rating:4.0,phone:"010-82866988",hours:"08:00-20:00",services:["快递","包裹"],materials:["纸箱","胶带"],distance:0.6,description:"中通快递网点，价格实惠"},
{id:7,name:"圆通速递(三里屯站)",address:"朝阳区三里屯路19号",rating:4.1,phone:"010-64169988",hours:"08:00-20:00",services:["快递"],materials:["纸箱","胶带"],distance:1.5,description:"圆通快递网点"},
{id:8,name:"中国邮政(南山支局)",address:"南山区科技南路18号",rating:4.3,phone:"0755-86881688",hours:"09:00-17:00",services:["快递","包裹","信件"],materials:["纸箱","气泡袋","胶带"],distance:2.5,description:"南山区邮政支局"},
{id:9,name:"韵达快递(越秀站)",address:"越秀区东风东路800号",rating:3.9,phone:"020-83881688",hours:"08:30-19:30",services:["快递"],materials:["纸箱","胶带"],distance:3.0,description:"韵达快递网点"},
{id:10,name:"中国邮政(静安旗舰店)",address:"静安区南京西路1000号",rating:4.5,phone:"021-62881688",hours:"09:00-18:00",services:["快递","包裹","信件","集邮"],materials:["纸箱","气泡袋","胶带","填充物","纪念邮票","明信片"],distance:1.0,description:"静安区旗舰店，服务全面"}
];
let currentSort="distance";
function render(){
const q=document.getElementById("search").value.toLowerCase();
const sf=document.getElementById("serviceFilter").value;
const hf=document.getElementById("hourFilter").value;
let filtered=postOffices.filter(p=>{
if(q&&!p.name.includes(q)&&!p.address.includes(q))return false;
if(sf&&!p.services.includes(sf))return false;
if(hf==="full"&&(p.hours.includes("12:00")||p.hours.includes("半天")))return false;
if(hf==="half"&&!p.hours.includes("12:00")&&!p.hours.includes("半天"))return false;
return true;
});
filtered.sort({distance:(a,b)=>a.distance-b.distance,rating:(a,b)=>b.rating-a.rating,name:(a,b)=>a.name.localeCompare(b.name,"zh")}[currentSort]||(a,b)=>a.distance-b.distance);
document.getElementById("resultCount").textContent=`找到 ${filtered.length} 个邮局/快递点`;
const c=document.getElementById("results");
if(!filtered.length){c.innerHTML='<div class="no-results"><p>未找到符合条件的邮局</p></div>';return}
c.innerHTML=filtered.map(p=>`<div class="card"><h3>${p.name}</h3><div class="card-info"><span>📍 ${p.address}</span><span>📞 ${p.phone}</span><span>🕐 ${p.hours}</span><span>⭐ ${p.rating}</span></div><p style="font-size:13px;color:var(--muted);margin-bottom:8px">${p.description}</p><div class="services">${p.services.map(s=>`<span class="svc-tag svc-${s==="快递"?"express":s==="包裹"?"package":s==="信件"?"letter":"other"}">${s}</span>`).join("")}</div><div class="materials">${p.materials.map(m=>`<span class="mat-tag">${m}</span>`).join("")}</div><div class="distance">📍 距您 ${p.distance}km</div></div>`).join("")
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("serviceFilter").addEventListener("change",render);
document.getElementById("hourFilter").addEventListener("change",render);
document.querySelectorAll(".sort-btn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".sort-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentSort=b.dataset.sort;render()}));
render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
