<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 笔记工具</title>
<meta property="og:title" content="📋 笔记工具">
<meta property="og:description" content="📋 笔记工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="笔记工具 - 快速记录学习笔记，支持分类、标签、搜索和Markdown格式">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3b82f6;--green:#238636;--red:#ef4444;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:800px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:120px;font-family:'SF Mono','Fira Code',monospace;font-size:.9rem}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.note-item{padding:14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.note-item:hover{background:var(--bg)}
.note-item .title{font-weight:600;font-size:1rem;margin-bottom:4px}
.note-item .preview{color:var(--text2);font-size:.85rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-item .meta{font-size:.75rem;color:var(--text2);margin-top:6px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px;cursor:pointer}
.tag.del{background:var(--danger);font-size:.65rem;margin-left:2px}
.es{text-align:center;padding:40px;color:var(--text2)}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1}
.hidden{display:none}
.md-preview{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;min-height:100px;font-size:.9rem;line-height:1.8}
.md-preview h1,.md-preview h2,.md-preview h3{margin:12px 0 8px;color:var(--accent)}
.md-preview code{background:var(--card);padding:2px 6px;border-radius:4px;font-size:.85rem;border:1px solid var(--border)}
.md-preview pre{background:var(--card);padding:12px;border-radius:8px;overflow-x:auto;border:1px solid var(--border)}
.md-preview blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text2);margin:8px 0}
.md-preview ul,.md-preview ol{padding-left:20px;margin:8px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📋 笔记工具</h1><p>快速记录，支持Markdown预览和分类管理</p></div>

<div class="cd" id="editorArea">
<h2 id="editorTitle">新建笔记</h2>
<label>标题</label>
<input type="text" id="noteTitle" placeholder="输入笔记标题">
<label>分类</label>
<select id="noteCat">
<option value="学习">学习</option>
<option value="工作">工作</option>
<option value="生活">生活</option>
<option value="灵感">灵感</option>
<option value="其他">其他</option>
</select>
<label>标签（逗号分隔）</label>
<input type="text" id="noteTags" placeholder="例如：重要,复习,待办">
<label>内容（支持Markdown）</label>
<textarea id="noteContent" placeholder="输入笔记内容..."></textarea>
<div class="bg">
<button onclick="saveNote()">💾 保存</button>
<button class="sec" onclick="togglePreview()">👁 预览</button>
<button class="sec" onclick="clearEditor()">清空</button>
</div>
<div id="previewArea" class="hidden" style="margin-top:12px">
<div class="md-preview" id="mdPreview"></div>
</div>
</div>

<div class="cd">
<div class="search-bar">
<input type="text" id="searchInput" placeholder="搜索笔记..." oninput="renderNotes()">
<select id="filterCat" onchange="renderNotes()" style="width:120px">
<option value="">全部分类</option>
<option value="学习">学习</option>
<option value="工作">工作</option>
<option value="生活">生活</option>
<option value="灵感">灵感</option>
<option value="其他">其他</option>
</select>
</div>
<h2>笔记列表 (<span id="noteCount">0</span>条)</h2>
<div id="noteList" class="es">暂无笔记</div>
</div>
</div>

<script>
let notes=[],editingIdx=-1;
function $(id){return document.getElementById(id)}
function load(){try{return JSON.parse(localStorage.getItem('note-taker-cn-data'))||[]}catch(e){return[]}}
function save(){localStorage.setItem('note-taker-cn-data',JSON.stringify(notes))}
notes=load();

function saveNote(){
  const t=$('noteTitle').value.trim(),c=$('noteContent').value.trim(),cat=$('noteCat').value,tags=$('noteTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!t||!c)return alert('标题和内容不能为空');
  const note={title:t,content:c,category:cat,tags,updated:Date.now()};
  if(editingIdx>=0){notes[editingIdx]=note}else{notes.unshift(note)}
  save();clearEditor();renderNotes();
}

function clearEditor(){editingIdx=-1;$('noteTitle').value='';$('noteContent').value='';$('noteTags').value='';$('noteCat').value='学习';$('editorTitle').textContent='新建笔记';$('previewArea').classList.add('hidden')}

function editNote(i){editingIdx=i;const n=notes[i];$('noteTitle').value=n.title;$('noteContent').value=n.content;$('noteTags').value=(n.tags||[]).join(',');$('noteCat').value=n.category||'学习';$('editorTitle').textContent='编辑笔记';window.scrollTo({top:0,behavior:'smooth'})}

function deleteNote(i){if(!confirm('确定删除？'))return;notes.splice(i,1);save();renderNotes()}

function togglePreview(){const p=$('previewArea');p.classList.toggle('hidden');if(!p.classList.contains('hidden')){$('mdPreview').innerHTML=renderMd($('noteContent').value)}}

function renderMd(md){
  return md.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^- (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>)/gs,'<ul>$1</ul>').replace(/\n/g,'<br>');
}

function renderNotes(){
  const q=$('searchInput').value.toLowerCase(),cat=$('filterCat').value;
  let list=notes.filter(n=>{
    if(cat&&n.category!==cat)return false;
    if(q&&!n.title.toLowerCase().includes(q)&&!(n.content||'').toLowerCase().includes(q)&&!(n.tags||[]).some(t=>t.toLowerCase().includes(q)))return false;
    return true;
  });
  $('noteCount').textContent=list.length;
  const el=$('noteList');
  if(!list.length){el.innerHTML='<div class="es">暂无笔记</div>';return}
  el.innerHTML=list.map((n,i)=>{
    const idx=notes.indexOf(n);
    const tags=(n.tags||[]).map(t=>'<span class="tag">'+t+'</span>').join('');
    const date=new Date(n.updated).toLocaleString('zh-CN');
    return '<div class="note-item" onclick="editNote('+idx+')"><div class="title">'+n.title+'</div><div class="preview">'+n.content.substring(0,100)+'</div><div class="meta"><span class="tag" style="background:var(--success)">'+n.category+'</span> '+tags+' · '+date+' <button class="dng" style="padding:2px 8px;font-size:.7rem;margin-left:8px" onclick="event.stopPropagation();deleteNote('+idx+')">删除</button></div></div>';
  }).join('');
}

renderNotes();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
