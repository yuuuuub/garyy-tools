<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国茶具 - Chinese Tea Sets</title>
<meta name="description" content="中国茶具百科，盖碗、紫砂壶、茶杯、茶盘、配件、地域风格、名窑精品">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国茶具 - Chinese Tea Sets">
<meta property="og:description" content="中国茶具百科，盖碗、紫砂壶、茶杯、茶盘、配件、地域风格、名窑精品">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-tea-sets-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍵</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#7a9e6a;--accent2:#5a8a4a}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#238636;--accent2:#1a7f37}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#0a1510 0%,#142818 50%,#1a3a20 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #2a5a30;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#7a9e6a,#5a8a4a,#4a7a3a,#3a6a2a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.tea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.tea-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.tea-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.tea-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.tea-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tea-card .t-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(122,158,106,0.15);color:var(--accent)}
.tea-card .t-name{font-size:1.3em;font-weight:bold}
.tea-card .t-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.tea-card .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tea-card .t-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.tea-card .t-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.tea-card .t-detail strong{color:var(--text)}
.tea-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.tea-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🍵 中国茶具</h1>
<p>Chinese Tea Sets — 器为茶之父，好器出好茶</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索茶具...（如"盖碗""公道杯""汝窑"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="主泡器">🫖 主泡器</button>
<button class="filter-btn" data-filter="品饮器">🍵 品饮器</button>
<button class="filter-btn" data-filter="辅助器具">🔧 辅助器具</button>
<button class="filter-btn" data-filter="名窑精品">🏺 名窑精品</button>
<button class="filter-btn" data-filter="茶盘茶台">🪵 茶盘茶台</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="tea-grid" id="teaGrid"></div>
<footer><p>🍵 中国茶具 — 器为茶之父，好器出好茶</p></footer>
</div>
<script>
const TEA_DATA=[
  {id:1,name:"盖碗",en:"Gaiwan (Lidded Bowl)",category:"主泡器",icon:"🍵",summary:"万能茶器",detail:"盖碗由盖、碗、托三部分组成，又称'三才碗'（天、地、人）。盖碗适用于所有茶类，是品鉴茶叶的最佳器具。盖子可以控制出水速度，碗身散热快，方便观察叶底。",origin:"清代康熙年间",usage:"茶艺表演与日常品茶的万能器具"},
  {id:2,name:"紫砂壶",en:"Yixing Zisha Teapot",category:"主泡器",icon:"🫖",summary:"茶器之王",detail:"紫砂壶以宜兴紫砂泥为原料，具有独特的双气孔结构，能吸附茶香、保持茶味。好的紫砂壶'越养越润'，长期使用会形成美丽的包浆。一把壶通常只泡一种茶。",origin:"明代正德年间",usage:"乌龙茶、普洱茶等重发酵茶的理想器具"},
  {id:3,name:"瓷壶",en:"Porcelain Teapot",category:"主泡器",icon:"🫙",summary:"洁白无瑕",detail:"瓷壶以景德镇青花瓷、德化白瓷最为著名。瓷壶不吸味，适合泡各种茶类。青花瓷壶雅致大方，白瓷壶便于观察茶汤颜色。瓷壶清洗方便，适合多人品饮。",origin:"宋代景德镇窑",usage:"绿茶、白茶等清淡茶类的首选"},
  {id:4,name:"玻璃壶",en:"Glass Teapot",category:"主泡器",icon:"🫗",summary:"观色之美",detail:"玻璃壶透明，可以完整观赏茶叶在水中舒展的过程。特别适合冲泡花茶、绿茶等需要观赏茶舞的茶类。玻璃壶不吸味，清洗方便，是入门茶友的好选择。",origin:"现代工艺",usage:"花茶、绿茶的冲泡与茶艺展示"},
  {id:5,name:"品茗杯",en:"Tasting Cup",category:"品饮器",icon:"☕",summary:"品茶的小杯",detail:"品茗杯是品茶的小杯子，容量约30-50毫升。白瓷杯最能衬托茶汤颜色，适合品鉴。杯口微敛的杯型有利于聚香。好杯要薄、匀、净、白，握感舒适。",origin:"宋代点茶传统",usage:"品鉴茶汤的专用小杯"},
  {id:6,name:"闻香杯",en:"Aroma Cup",category:"品饮器",icon:"👃",summary:"闻香的专用杯",detail:"闻香杯是高而窄的长形小杯，专门用于闻茶香。先将茶汤倒入闻香杯，再倒入品茗杯。双手搓动闻香杯感受余温中的茶香变化。常配建盏使用，是功夫茶的标配。",origin:"台湾茶艺创新",usage:"功夫茶品香环节的专用器具"},
  {id:7,name:"公道杯",en:"Fairness Cup / Cha Hai",category:"辅助器具",icon:"⚖️",summary:"公平公道",detail:"公道杯又称茶海、茶盅，用于均匀茶汤浓度。泡好茶后先倒入公道杯，再分入各品茗杯，确保每杯浓度相同。玻璃公道杯最常见，方便观察茶汤颜色。",origin:"明代茶具",usage:"功夫茶分茶的标准器具"},
  {id:8,name:"茶漏",en:"Tea Strainer",category:"辅助器具",icon:"🔍",summary:"过滤茶渣",detail:"茶漏放在公道杯口上，用于过滤茶渣和碎末。确保倒入品茗杯的茶汤清澈透亮。茶漏有金属网和陶瓷两种，金属网更细密，陶瓷更美观。",origin:"现代茶具",usage:"保证茶汤清澈的辅助工具"},
  {id:9,name:"茶夹",en:"Tea Tongs",category:"辅助器具",icon:"🪝",summary:"夹取茶杯",detail:"茶夹用于夹取烫热的品茗杯，避免烫手。也用于夹取茶叶（如普洱茶饼）。茶夹通常与茶匙、茶针、茶漏组成'茶道六君子'中的四件。使用时动作要轻柔优雅。",origin:"功夫茶传统",usage:"茶席上的辅助夹取工具"},
  {id:10,name:"茶匙",en:"Tea Scoop",category:"辅助器具",icon:"🥄",summary:"取茶入壶",detail:"茶匙又称茶则，用于从茶罐中取茶叶放入壶中。避免手直接接触茶叶，保持茶叶卫生。茶匙有竹制、木制、金属制等多种材质，形状像小勺子。",origin:"唐代茶道",usage:"茶叶取用的标准工具"},
  {id:11,name:"茶盘",en:"Tea Tray",category:"茶盘茶台",icon:"🪵",summary:"承茶的基础",detail:"茶盘是放置茶具的底座，有排水功能。材质有竹制、木制、石制、陶瓷等。干泡台只放少量茶具，湿泡台可以淋水。茶盘的设计体现了主人的审美品味。",origin:"明代茶席",usage:"茶席布置的核心器具"},
  {id:12,name:"汝窑",en:"Ru Kiln Ware",category:"名窑精品",icon:"🏺",summary:"天青色等烟雨",detail:"汝窑是宋代五大名窑之首，以天青色釉闻名。'雨过天青云破处，这般颜色做将来'。汝窑茶具釉色温润如玉，开片自然，是茶具收藏的顶级品。",origin:"北宋汝州",usage:"顶级茶具收藏与品鉴"},
  {id:13,name:"建盏",en:"Jian Zhan (Tenmoku)",category:"名窑精品",icon:"🥣",summary:"兔毫油滴",detail:"建盏产于福建建阳，是宋代点茶的首选茶碗。以黑釉为主，有兔毫、油滴、曜变等珍贵品种。建盏的铁胎能软化水质，提升茶汤口感。近年来重新受到茶友追捧。",origin:"宋代建窑",usage:"点茶与品鉴黑茶的理想器具"},
  {id:14,name:"景德镇瓷器",en:"Jingdezhen Porcelain",category:"名窑精品",icon:"🏛️",summary:"瓷都精品",detail:"景德镇是世界瓷都，产的青花瓷、粉彩瓷、玲珑瓷、颜色釉瓷被誉为四大名瓷。景德镇茶具以白如玉、薄如纸、声如磬著称，是瓷质茶具的最高代表。",origin:"汉代始烧",usage:"茶具收藏与日常使用的上品"},
  {id:15,name:"茶道六君子",en:"Six Gentlemen of Tea",category:"辅助器具",icon:"📦",summary:"茶道工具套装",detail:"茶道六君子包括：茶筒（收纳）、茶匙（取茶）、茶漏（过滤）、茶针（通壶嘴）、茶夹（夹杯）、茶则（量茶）。通常放在一个竹筒或木筒中，是茶席的标配工具。",origin:"功夫茶传统",usage:"茶席必备的辅助工具套装"},
  {id:16,name:"煮水器",en:"Water Boiler",category:"辅助器具",icon:"🔥",summary:"好水配好茶",detail:"煮水器是烧水的器具。传统用铁壶、铜壶，现代用电热水壶。日本铁壶能软化水质，银壶能杀菌。泡不同茶类需要不同水温，煮水器的温控功能很重要。",origin:"各时代发展",usage:"泡茶前的烧水准备"},
  {id:17,name:"德化白瓷",en:"Dehua White Porcelain",category:"名窑精品",icon:"🤍",summary:"中国白",detail:"德化白瓷产于福建德化，以纯白温润著称，被法国人称为'中国白'（Blanc de Chine）。德化白瓷茶具胎质细腻，釉色如凝脂，适合品鉴茶汤本色。",origin:"宋代德化窑",usage:"品鉴白茶、绿茶的理想器具"},
  {id:18,name:"茶宠",en:"Tea Pet",category:"辅助器具",icon:"🐉",summary:"茶桌上的灵物",detail:"茶宠是放在茶盘上的小型陶塑，常用紫砂制作。常见造型有貔貅、金蟾、弥勒、小猪等。每次泡茶时用茶汤浇淋，日久天长会养出温润光泽，是茶桌的趣味所在。",origin:"清代紫砂工艺",usage:"茶桌装饰与养壶文化的延伸"},
  {id:19,name:"茶巾",en:"Tea Towel",category:"辅助器具",icon:"🧻",summary:"擦拭的优雅",detail:"茶巾用于擦拭茶具上的水渍和茶渍，保持茶席整洁。一般用棉麻材质，吸水性好。使用时折成方形，轻轻擦拭。茶巾要保持干净，定期清洗。",origin:"功夫茶传统",usage:"茶席清洁与茶具保养的必备品"},
  {id:20,name:"茶罐",en:"Tea Caddy",category:"辅助器具",icon:"🏺",summary:"储存茶叶",detail:"茶罐用于储存茶叶，保持茶叶新鲜。材质有锡罐（密封性最好）、紫砂罐（透气醒茶）、瓷罐（防潮）、竹罐等。好茶罐要密封、避光、防潮、无异味。",origin:"古代储茶传统",usage:"茶叶储存与保鲜的专用容器"}
];
function renderCards(data){
  document.getElementById('teaGrid').innerHTML=data.map(t=>`
    <div class="tea-card" data-category="${t.category}">
      <div class="t-header"><div class="t-icon">${t.icon}</div><div><div class="t-name">${t.name}</div><div class="t-sub">${t.en}</div></div></div>
      <div class="t-meta"><span>${t.summary}</span><span>${t.category}</span></div>
      <div class="t-detail">${t.detail}</div>
      <div class="t-detail"><strong>起源：</strong>${t.origin}</div>
      <div class="t-detail"><strong>用途：</strong>${t.usage}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(t=>{cats[t.category]=(cats[t.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">茶具器具</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(TEA_DATA);renderStats(TEA_DATA);
</script>
</body>
</html>
