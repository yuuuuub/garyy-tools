<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国谚语生成器 - Chinese Proverb Generator</title>
<meta name="description" content="在线中国谚语生成器 - 选择主题和场景，自动生成中国谚语、俗语、歇后语">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}
.container{max-width:800px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}
.input-group select:focus{border-color:var(--blue);outline:none}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:8px;margin-right:8px}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.proverb-display{padding:24px;text-align:center}
.proverb-text{font-size:1.4rem;font-weight:700;line-height:1.6;margin-bottom:12px;color:var(--text)}
.proverb-source{font-size:.85rem;color:var(--text2);margin-bottom:8px}
.proverb-meaning{font-size:.9rem;color:var(--blue);line-height:1.6;margin:12px 0;padding:12px;background:var(--bg);border-radius:8px;text-align:left}
.proverb-type{display:inline-block;padding:3px 10px;border-radius:4px;font-size:.75rem;margin:4px}
.type-tanyu{background:rgba(59,130,246,0.15);color:var(--blue)}
.type-xiehouyu{background:rgba(139,92,246,0.15);color:#8b5cf6}
.type-geyan{background:rgba(35,134,54,0.15);color:var(--green)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>📖 中国谚语生成器</h1>
<p class="sub">选择主题，自动生成谚语、俗语、歇后语</p>

<div class="card">
<div class="input-group">
<label>谚语类型</label>
<select id="proverbType">
<option value="all">全部类型</option>
<option value="tanyu">谚语/俗语</option>
<option value="xiehouyu">歇后语</option>
<option value="geyan">格言/警句</option>
</select>
</div>
<div class="input-group">
<label>主题分类</label>
<select id="category">
<option value="all">全部主题</option>
<option value="life">人生哲理</option>
<option value="study">学习教育</option>
<option value="work">工作事业</option>
<option value="social">人情世故</option>
<option value="nature">自然规律</option>
<option value="family">家庭生活</option>
</select>
</div>
<button class="btn" onclick="generateProverb()">✨ 生成谚语</button>
<button class="btn btn-green" onclick="randomProverb()">🎲 随机生成</button>
<button class="btn" onclick="generateBatch()">📋 生成5条</button>
</div>
<div id="result"></div>
</div>
<script src="../i18n.js" defer></script>
<script>
var proverbs=[
{text:'千里之行，始于足下',source:'老子《道德经》',type:'geyan',category:'life',meaning:'再远的路也要从脚下第一步开始。比喻事情的成功是由小到大逐渐积累的。'},
{text:'塞翁失马，焉知非福',source:'《淮南子》',type:'tanyu',category:'life',meaning:'比喻一时虽然受到损失，但也有可能带来好处。坏事在一定条件下可变为好事。'},
{text:'己所不欲，勿施于人',source:'《论语》',type:'geyan',category:'social',meaning:'自己不想要的东西，不要强加给别人。这是儒家"仁"的核心思想。'},
{text:'学而时习之，不亦说乎',source:'《论语》',type:'geyan',category:'study',meaning:'学习并且经常复习，不是很快乐吗？强调复习的重要性。'},
{text:'温故而知新，可以为师矣',source:'《论语》',type:'geyan',category:'study',meaning:'温习旧知识从而得知新的理解，就可以成为老师了。'},
{text:'三人行，必有我师焉',source:'《论语》',type:'geyan',category:'study',meaning:'几个人一起走路，其中必定有人可以做我的老师。要善于向他人学习。'},
{text:'业精于勤，荒于嬉',source:'韩愈《进学解》',type:'geyan',category:'work',meaning:'学业或事业的精进在于勤奋，而荒废在于嬉游。'},
{text:'书山有路勤为径，学海无涯苦作舟',source:'韩愈',type:'tanyu',category:'study',meaning:'在读书学习的道路上，勤奋和刻苦是唯一的途径。'},
{text:'路遥知马力，日久见人心',source:'元·无名氏',type:'tanyu',category:'social',meaning:'路途遥远才能知道马的力气大小，日子长了才能看出人心的好坏。'},
{text:'良药苦口利于病，忠言逆耳利于行',source:'《史记》',type:'tanyu',category:'social',meaning:'好药虽苦却利于治病，忠诚的告诫虽不好听却有利于行事。'},
{text:'滴水穿石，非一日之功',source:'民间谚语',type:'tanyu',category:'work',meaning:'水滴能把石头穿透，这不是一天的功夫。比喻坚持不懈才能成功。'},
{text:'世上无难事，只怕有心人',source:'民间谚语',type:'tanyu',category:'life',meaning:'只要下定决心去做，世界上没有什么办不到的事情。'},
{text:'一分耕耘，一分收获',source:'民间谚语',type:'tanyu',category:'work',meaning:'付出一份努力，就会有一份收获。'},
{text:'吃一堑，长一智',source:'民间谚语',type:'tanyu',category:'life',meaning:'受一次挫折，增长一分见识。'},
{text:'百闻不如一见',source:'《汉书》',type:'tanyu',category:'study',meaning:'听别人说一百次，不如自己亲眼见一次。'},
{text:'活到老，学到老',source:'民间谚语',type:'tanyu',category:'study',meaning:'人要不停地学习，直到生命的尽头。'},
{text:'人心齐，泰山移',source:'民间谚语',type:'tanyu',category:'social',meaning:'只要大家一心一意，就能产生巨大的力量。'},
{text:'种瓜得瓜，种豆得豆',source:'民间谚语',type:'tanyu',category:'life',meaning:'做了什么事，就会得到什么样的结果。因果报应。'},
{text:'不经一番寒彻骨，怎得梅花扑鼻香',source:'唐·黄檗禅师',type:'geyan',category:'life',meaning:'不经历一番刺骨的寒冷，怎能有梅花扑鼻的芳香。'},
{text:'姜太公钓鱼，愿者上钩',source:'民间歇后语',type:'xiehouyu',category:'social',meaning:'比喻心甘情愿上圈套或主动投入。'},
{text:'竹篮打水——一场空',source:'民间歇后语',type:'xiehouyu',category:'life',meaning:'比喻白费力气，没有成果。'},
{text:'哑巴吃黄连——有苦说不出',source:'民间歇后语',type:'xiehouyu',category:'life',meaning:'比喻有苦难言，只能默默承受。'},
{text:'猪八戒照镜子——里外不是人',source:'民间歇后语',type:'xiehouyu',category:'social',比喻怎么做都不讨好，到处受埋怨。'},
{text:'老鼠过街——人人喊打',source:'民间歇后语',type:'xiehouyu',category:'social',meaning:'比喻害人的东西，人人都痛恨。'},
{text:'八仙过海——各显神通',source:'民间歇后语',type:'xiehouyu',category:'work',meaning:'比喻各自发挥本领，互相竞争。'},
{text:'姜是老的辣',source:'民间谚语',type:'tanyu',category:'life',meaning:'比喻老年人经验丰富，办事老练。'},
{text:'不听老人言，吃亏在眼前',source:'民间谚语',type:'tanyu',category:'life',meaning:'不听从有经验的人的劝告，很快就会吃亏。'},
{text:'一个篱笆三个桩，一个好汉三个帮',source:'民间谚语',type:'tanyu',category:'social',meaning:'一个人再有能力也需要别人的帮助。'},
{text:'家和万事兴',source:'民间谚语',type:'tanyu',category:'family',meaning:'家庭和睦，一切事情都会兴旺发达。'},
{text:'儿行千里母担忧',source:'民间谚语',type:'tanyu',category:'family',meaning:'子女出门在外，父母总是牵挂担心。'},
{text:'一寸光阴一寸金，寸金难买寸光阴',source:'民间谚语',type:'geyan',category:'study',meaning:'时间比金钱更珍贵，金钱买不回时间。'},
{text:'黑发不知勤学早，白首方悔读书迟',source:'唐·颜真卿',type:'geyan',category:'study',meaning:'年轻时不知道勤奋学习，到老了才后悔读书太迟。'},
{text:'天时不如地利，地利不如人和',source:'《孟子》',type:'geyan',category:'social',meaning:'有利的时机不如有利的地理条件，有利的地理条件不如人心团结。'},
{text:'一年之计在于春',source:'民间谚语',type:'tanyu',category:'work',meaning:'一年的计划要在春天安排好。比喻做事要早做打算。'},
{text:'笨鸟先飞早入林',source:'民间谚语',type:'tanyu',category:'study',meaning:'比喻能力差的人做事要比别人早，才能赶上。'},
{text:'失败是成功之母',source:'民间谚语',type:'geyan',category:'life',meaning:'从失败中吸取教训，就能走向成功。'},
{text:'满招损，谦受益',source:'《尚书》',type:'geyan',category:'life',meaning:'自满招来损害，谦虚得到益处。'},
{text:'知之为知之，不知为不知',source:'《论语》',type:'geyan',category:'study',meaning:'知道就是知道，不知道就是不知道，这才是明智的态度。'},
{text:'冰冻三尺，非一日之寒',source:'民间谚语',type:'tanyu',category:'life',meaning:'比喻事物的形成是长期积累的结果。'},
{text:'近朱者赤，近墨者黑',source:'晋·傅玄',type:'geyan',category:'social',meaning:'接近好人可以变好，接近坏人可以变坏。环境对人的影响很大。'}
];

function generateProverb(){
var type=document.getElementById('proverbType').value;
var cat=document.getElementById('category').value;
var filtered=proverbs.filter(function(p){
var matchType=type==='all'||p.type===type;
var matchCat=cat==='all'||p.category===cat;
return matchType&&matchCat;
});
if(filtered.length===0){alert('没有找到符合条件的谚语');return;}
var idx=Math.floor(Math.random()*filtered.length);
showProverb(filtered[idx]);
}

function randomProverb(){
var idx=Math.floor(Math.random()*proverbs.length);
showProverb(proverbs[idx]);
}

function generateBatch(){
var type=document.getElementById('proverbType').value;
var cat=document.getElementById('category').value;
var filtered=proverbs.filter(function(p){
var matchType=type==='all'||p.type===type;
var matchCat=cat==='all'||p.category===cat;
return matchType&&matchCat;
});
var shuffled=filtered.slice().sort(function(){return Math.random()-0.5;});
var batch=shuffled.slice(0,Math.min(5,filtered.length));
var html='';
batch.forEach(function(p){html+=buildProverbCard(p);});
document.getElementById('result').innerHTML=html;
}

function showProverb(p){
document.getElementById('result').innerHTML=buildProverbCard(p);
}

function buildProverbCard(p){
var typeNames={tanyu:'谚语/俗语',xiehouyu:'歇后语',geyan:'格言/警句'};
var typeClasses={tanyu:'type-tanyu',xiehouyu:'type-xiehouyu',geyan:'type-geyan'};
var html='<div class="card">';
html+='<div class="proverb-display">';
html+='<span class="proverb-type '+typeClasses[p.type]+'">'+typeNames[p.type]+'</span>';
html+='<div class="proverb-text">"'+p.text+'"</div>';
html+='<div class="proverb-source">—— '+p.source+'</div>';
html+='<div class="proverb-meaning">'+p.meaning+'</div>';
html+='</div>';
html+='<div style="text-align:center;padding-top:8px">';
html+='<button class="btn" onclick="copyProverb(\''+p.text.replace(/'/g,"\\'")+'\')">📋 复制</button>';
html+='</div></div>';
return html;
}

function copyProverb(text){
navigator.clipboard.writeText(text).then(function(){alert('已复制');}).catch(function(){alert('复制失败');});
}
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
