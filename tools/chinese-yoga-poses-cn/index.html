let activeCategory = '站立体式';
let currentPose = null;
let seqTimerInterval = null;
let seqTimerSeconds = 0;
let seqTimerRunning = false;
const categories = [...new Set(poses.map(p => p.category))];

function loadData() { return JSON.parse(localStorage.getItem('yoga-data') || '{"records":[]}'); }
function saveData(d) { localStorage.setItem('yoga-data', JSON.stringify(d)); }

function renderCatTabs() {
  document.getElementById('cat-tabs').innerHTML = categories.map(c =>
    `<div class="tab ${c === activeCategory ? 'active' : ''}" onclick="switchCategory('${c}')" style="padding:6px 12px;font-size:.8rem">${c}</div>`
  ).join('');
}
function switchCategory(c) { activeCategory = c; renderCatTabs(); renderPoseList(); }

function renderPoseList() {
  const filtered = poses.filter(p => p.category === activeCategory);
  document.getElementById('pose-list').innerHTML = filtered.map(p => {
    const idx = poses.indexOf(p);
    return `<div class="li" onclick="showPose(${idx})">
      <div><strong>${p.name}</strong> <span style="color:var(--text2);font-size:.8rem">${p.sanskrit}</span><br><span style="color:var(--text2);font-size:.85rem">${p.difficulty} · ${p.meridian}</span></div>
      <span class="tag p">${p.tcm.substring(0, 6)}</span>
    </div>`;
  }).join('');
}

function showPose(i) {
  currentPose = i;
  const p = poses[i];
  document.getElementById('pose-detail-card').style.display = 'block';
  document.getElementById('detail-empty').style.display = 'none';
  document.getElementById('pd-title').textContent = `${p.name}（${p.sanskrit}）`;
  document.getElementById('pd-content').innerHTML = `
    <p style="margin-bottom:12px;color:var(--text2)">${p.desc}</p>
    <div style="margin-bottom:8px"><span class="tag s">${p.difficulty}</span> <span class="tag w" style="margin-left:4px">${p.duration}</span></div>
    <div style="margin-bottom:8px"><strong>中医关联：</strong><span class="tag p">${p.tcm}</span></div>
    <div style="margin-bottom:8px"><strong>调理经络：</strong><span class="tag b">${p.meridian}</span></div>
    <div style="margin-bottom:12px"><strong>功效：</strong>${p.benefits.map(b => `<span class="tag s" style="margin:2px">${b}</span>`).join('')}</div>
    <div><strong>练习步骤：</strong>${p.steps.map((s, j) => `<div class="step"><span class="step-num">${j+1}.</span>${s}</div>`).join('')}</div>`;
}

    <div class="li" onclick="showSequence(${i})">
      <div><strong>${s.name}</strong><br><span style="color:var(--text2);font-size:.85rem">${s.desc} · ${s.duration}分钟 · ${s.poses.length}个体式</span></div>
      <span class="tag s">开始</span>
    </div>
  `).join('');
}

function showSequence(i) {
  const seq = sequences[i];
  document.getElementById('seq-detail').style.display = 'block';
  document.getElementById('seq-title').textContent = seq.name;
  document.getElementById('seq-content').innerHTML = `
    <p style="margin-bottom:12px;color:var(--text2)">${seq.desc}</p>
    ${seq.poses.map((pname, j) => {
      const pose = poses.find(p => p.name === pname);
      return `<div class="seq-item"><div><span class="seq-num">${j+1}</span><strong>${pname}</strong>${pose ? ` <span style="color:var(--text2);font-size:.8rem">${pose.sanskrit}</span>` : ''}</div><span class="tag w">${pose ? pose.duration : ''}</span></div>`;
    }).join('')}`;
  resetSeqTimer();
}

function toggleSeqTimer() {
  if (seqTimerRunning) {
    clearInterval(seqTimerInterval);
    seqTimerRunning = false;
    document.getElementById('seq-btn').textContent = '继续';
  } else {
    seqTimerRunning = true;
    document.getElementById('seq-btn').textContent = '暂停';
    seqTimerInterval = setInterval(() => {
      seqTimerSeconds++;
      const mins = Math.floor(seqTimerSeconds / 60).toString().padStart(2, '0');
      const secs = (seqTimerSeconds % 60).toString().padStart(2, '0');
      document.getElementById('seq-timer').textContent = `${mins}:${secs}`;
    }, 1000);
  }
}

function resetSeqTimer() {
  clearInterval(seqTimerInterval);
  seqTimerSeconds = 0;
  seqTimerRunning = false;
  document.getElementById('seq-btn').textContent = '开始计时';
  document.getElementById('seq-timer').textContent = '00:00';
}

function renderRecord() {
  const data = loadData();
  const records = data.records;
  document.getElementById('total-sessions').textContent = records.length;
  document.getElementById('total-minutes').textContent = records.reduce((s, r) => s + r.duration, 0);
  const dates = [...new Set(records.map(r => r.date))].sort().reverse();
  let streak = 0, checkDate = new Date();
  while (dates.includes(checkDate.toISOString().split('T')[0])) { streak++; checkDate.setDate(checkDate.getDate() - 1); }
  document.getElementById('streak-days').textContent = streak;
  const recent = records.slice(-7).reverse();
  document.getElementById('recent-records').innerHTML = recent.length ? recent.map(r => `
    <div class="log-item">
      <div><strong>${r.poses || '自由练习'}</strong><br><span class="log-date">${r.date} · ${r.duration}分钟</span></div>
      <span class="tag s">✓</span>
    </div>
  `).join('') : '<div class="empty">暂无记录，完成序列后自动记录</div>';
}

// Tabs
document.querySelectorAll('#tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'sequence') renderSequences();
    if (tab.dataset.tab === 'record') renderRecord();
  });
});

renderCatTabs();
renderPoseList();
</script>
</body>
</html>
