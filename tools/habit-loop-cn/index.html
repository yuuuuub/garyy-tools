<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔁 习惯回路</title>
<meta name="description" content="习惯回路分析工具，理解提示-惯常-奖赏循环，改掉坏习惯养成好习惯">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.loop-visual{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 0;flex-wrap:wrap}
.loop-node{padding:12px 16px;border-radius:var(--radius);text-align:center;font-weight:600;min-width:80px}
.loop-cue{background:rgba(59,130,246,.15);color:var(--accent);border:2px solid var(--accent)}
.loop-routine{background:rgba(245,158,11,.15);color:var(--warn);border:2px solid var(--warn)}
.loop-reward{background:rgba(34,197,94,.15);color:var(--success);border:2px solid var(--success)}
.loop-arrow{font-size:1.5rem;color:var(--text2)}
.habit-item{padding:16px;border-bottom:1px solid var(--border)}.habit-item:last-child{border-bottom:none}
.habit-item .name{font-weight:600;font-size:1.05rem}.habit-item .type-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:600;margin-left:8px}
.type-good{background:rgba(34,197,94,.15);color:var(--success)}
.type-bad{background:rgba(248,81,73,.15);color:var(--danger)}
.type-neutral{background:rgba(139,92,246,.15);color:#8b5cf6}
.habit-detail{font-size:.85rem;color:var(--text2);margin-top:6px}
.streak-bar{display:flex;gap:2px;margin-top:8px}
.streak-day{width:16px;height:16px;border-radius:3px;background:var(--border)}
.streak-day.done{background:var(--success)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔁</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔁 习惯回路">
<meta property="og:description" content="习惯回路分析工具，理解提示-惯常-奖赏循环">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🔁 习惯回路</h1><p>提示 → 惯常行为 → 奖赏，理解和改变你的习惯</p></div>

<div class="cd"><h2>🔄 习惯回路模型</h2>
<div class="loop-visual">
<div class="loop-node loop-cue">💡 提示</div>
<div class="loop-arrow">→</div>
<div class="loop-node loop-routine">⚡ 惯常行为</div>
<div class="loop-arrow">→</div>
<div class="loop-node loop-reward">🎁 奖赏</div>
</div>
<p style="text-align:center;font-size:.85rem;color:var(--text2)">每个习惯都由提示触发，经过惯常行为，最终获得奖赏</p></div>

<div class="cd"><h2>➕ 添加习惯回路</h2>
<label>习惯名称</label><input type="text" id="hName" placeholder="如：每天运动、刷手机">
<label>类型</label><select id="hType"><option value="good">好习惯</option><option value="bad">坏习惯</option><option value="neutral">中性习惯</option></select>
<label>💡 提示（什么触发了这个习惯？）</label><textarea id="hCue" placeholder="如：感到无聊时、饭后、闹钟响后" style="min-height:40px"></textarea>
<label>⚡ 惯常行为（你实际做了什么？）</label><textarea id="hRoutine" placeholder="如：打开手机刷短视频、去跑步" style="min-height:40px"></textarea>
<label>🎁 奖赏（你从中获得了什么？）</label><textarea id="hReward" placeholder="如：短暂的快感、成就感、放松" style="min-height:40px"></textarea>
<label>替代方案（可选，针对坏习惯）</label><textarea id="hReplace" placeholder="用什么好习惯替代这个坏习惯？" style="min-height:40px"></textarea>
<div class="bg"><button onclick="addHabit()">添加习惯</button></div></div>

<div class="cd"><h2>📋 习惯列表</h2><div id="habitList"></div></div>

<div class="cd"><h2>📊 习惯打卡</h2>
<div id="checkArea" class="es">添加习惯后可进行每日打卡</div></div>

<div class="cd"><h2>📈 统计</h2><div id="stats" class="es">暂无数据</div>
<div class="bg"><button class="sec" onclick="clearAll()">清空全部</button></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let habits=JSON.parse(localStorage.getItem('hl_habits')||'[]');
let checks=JSON.parse(localStorage.getItem('hl_checks')||'[]');
const today=()=>new Date().toISOString().slice(0,10);

function save(){localStorage.setItem('hl_habits',JSON.stringify(habits));localStorage.setItem('hl_checks',JSON.stringify(checks))}

function addHabit(){
  const name=$('hName').value.trim(),type=$('hType').value,cue=$('hCue').value.trim(),routine=$('hRoutine').value.trim(),reward=$('hReward').value.trim(),replace=$('hReplace').value.trim();
  if(!name||!cue||!routine||!reward){alert('请填写完整信息');return}
  habits.push({id:Date.now(),name,type,cue,routine,reward,replace,created:today()});
  save();['hName','hCue','hRoutine','hReward','hReplace'].forEach(id=>$(id).value='');render();
}

function render(){
  if(!habits.length){$('habitList').innerHTML='<div class="es">暂无习惯</div>';$('checkArea').innerHTML='<div class="es">添加习惯后可进行每日打卡</div>';renderStats();return}
  $('habitList').innerHTML=habits.map(h=>{
    const typeLabel={good:'好习惯',bad:'坏习惯',neutral:'中性习惯'}[h.type];
    return `<div class="habit-item"><div><span class="name">${h.name}</span><span class="type-badge type-${h.type}">${typeLabel}</span><span style="float:right;cursor:pointer;color:var(--danger)" onclick="delHabit(${h.id})">✕</span></div><div class="habit-detail">💡 提示：${h.cue}</div><div class="habit-detail">⚡ 行为：${h.routine}</div><div class="habit-detail">🎁 奖赏：${h.reward}</div>${h.replace?'<div class="habit-detail" style="color:var(--success)">🔄 替代：'+h.replace+'</div>':''}</div>`;
  }).join('');

  const t=today();
  $('checkArea').innerHTML=habits.map(h=>{
    const checked=checks.some(c=>c.habitId===h.id&&c.date===t);
    const streak=getStreak(h.id);
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid var(--border)"><div><strong>${h.name}</strong><div style="font-size:.8rem;color:var(--text2)">连续 ${streak} 天</div></div><button onclick="toggleCheck(${h.id})" style="min-width:80px;${checked?'background:var(--success)':''}">${checked?'✓ 已打卡':'打卡'}</button></div>`;
  }).join('');
  renderStats();
}

function toggleCheck(habitId){
  const t=today();
  const idx=checks.findIndex(c=>c.habitId===habitId&&c.date===t);
  if(idx>=0)checks.splice(idx,1);else checks.push({habitId,date:t});
  save();render();
}

function getStreak(habitId){
  let streak=0,d=new Date();
  while(true){
    const ds=d.toISOString().slice(0,10);
    if(checks.some(c=>c.habitId===habitId&&c.date===ds)){streak++;d.setDate(d.getDate()-1)}
    else break;
  }
  return streak;
}

function delHabit(id){habits=habits.filter(h=>h.id!==id);checks=checks.filter(c=>c.habitId!==id);save();render()}

function renderStats(){
  const total=habits.length;
  const good=habits.filter(h=>h.type==='good').length;
  const bad=habits.filter(h=>h.type==='bad').length;
  const todayChecks=checks.filter(c=>c.date===today()).length;
  $('stats').innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center"><div><div style="font-size:1.3rem;font-weight:700;color:var(--accent)">${total}</div><div style="font-size:.75rem;color:var(--text2)">总习惯</div></div><div><div style="font-size:1.3rem;font-weight:700;color:var(--success)">${good}</div><div style="font-size:.75rem;color:var(--text2)">好习惯</div></div><div><div style="font-size:1.3rem;font-weight:700;color:var(--danger)">${bad}</div><div style="font-size:.75rem;color:var(--text2)">坏习惯</div></div><div><div style="font-size:1.3rem;font-weight:700;color:var(--warn)">${todayChecks}</div><div style="font-size:.75rem;color:var(--text2)">今日打卡</div></div></div>`;
}

function clearAll(){if(!confirm('确定清空全部数据？'))return;habits=[];checks=[];save();render()}
render();
</script>
</body>
</html>
