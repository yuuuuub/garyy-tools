<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国菜谱历史 - Chinese Recipe History</title>
<meta name="description" content="中国菜谱历史演变，从先秦到现代的中华饮食文化发展脉络">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国菜谱历史 - Chinese Recipe History">
<meta property="og:description" content="从先秦到现代的中华饮食文化发展脉络">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-recipe-history-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
header{background:linear-gradient(135deg,#1a0a00,#2a1505,#3d200a);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3010;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:900px;margin:0 auto;padding:20px}
.timeline{position:relative;padding-left:40px}
.timeline::before{content:'';position:absolute;left:16px;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2),var(--accent));border-radius:2px}
.era{margin-bottom:30px;position:relative}
.era::before{content:'';position:absolute;left:-30px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);z-index:1}
.era-card{background:var(--card);border-radius:12px;padding:20px;border:1px solid var(--border);transition:all .3s}
.era-card:hover{transform:translateX(4px);box-shadow:0 4px 20px rgba(0,0,0,.2)}
.era-card .era-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.era-card .era-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3em;background:rgba(232,168,124,.15);flex-shrink:0}
.era-card .era-name{font-size:1.2em;font-weight:bold}
.era-card .era-period{font-size:.78em;color:var(--accent)}
.era-card .era-desc{font-size:.85em;color:var(--text2);line-height:1.7;margin-bottom:10px}
.era-card .dishes{display:flex;flex-wrap:wrap;gap:6px}
.era-card .dish-tag{font-size:.75em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text2)}
.era-card .highlight{font-size:.82em;color:var(--accent);margin-top:8px;font-style:italic}
.stats-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;justify-content:center}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;text-align:center}
.stat .num{font-size:1.3em;font-weight:bold;color:var(--accent)}
.stat .lbl{font-size:.72em;color:var(--text2)}
footer{text-align:center;padding:30px;color:var(--text2);font-size:.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.timeline{padding-left:30px}.timeline::before{left:10px}.era::before{left:-24px;width:12px;height:12px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>📜 中国菜谱历史</h1>
<p>Chinese Recipe History — 从先秦到现代的中华饮食文化演变</p>
</header>
<div class="container">
<div class="stats-bar">
<div class="stat"><div class="num">5000+</div><div class="lbl">年历史</div></div>
<div class="stat"><div class="num">8</div><div class="lbl">大菜系</div></div>
<div class="stat"><div class="num">30+</div><div class="lbl">烹饪技法</div></div>
<div class="stat"><div class="num">数万</div><div class="lbl">经典菜式</div></div>
</div>
<div class="timeline" id="timeline"></div>
<footer><p>📜 中国菜谱历史 — 民以食为天，食以文化为根</p></footer>
</div>
<script>
const ERAS=[
{name:"先秦时期",period:"远古—公元前221年",icon:"🏛️",desc:"中国烹饪的萌芽期。火的使用开启了熟食时代，《周礼》记载了周代宫廷的饮食制度，'八珍'是最早的标准菜式。酱、醋、盐等调味品已开始使用。",dishes:["周八珍","醢（肉酱）","醯（醋）","脯（干肉）","脩（腊肉）"],highlight:"《周礼·天官》记载'膳夫掌王之食饮膳羞'，是中国最早的饮食管理制度。"},
{name:"秦汉时期",period:"公元前221年—220年",icon:"⚔️",desc:"大一统促进了饮食交流。张骞出使西域带回了葡萄、石榴、胡萝卜等食材。豆腐据传由淮南王刘安发明。铁锅的普及使炒菜成为可能。",dishes:["豆腐","煮饼","烤肉","羹汤","蜜饯"],highlight:"淮南王刘安炼丹时意外发明豆腐，改变了中国人的蛋白质摄入方式。"},
{name:"魏晋南北朝",period:"220年—589年",icon:"🎋",desc:"民族融合带来饮食多样化。贾思勰《齐民要术》记载了大量烹饪技法，是中国最早的农学和烹饪百科。素食文化因佛教盛行而兴起。",dishes:["五侯鲭","胡饼","烤全羊","素斋","汤饼"],highlight:"《齐民要术》记载了近300种食品加工方法，是世界最早的食品工艺学著作。"},
{name:"隋唐盛世",period:"581年—907年",icon:"🏯",desc:"大唐盛世饮食文化空前繁荣。胡食流行，长安成为世界美食之都。茶道兴起，陆羽著《茶经》。宴席文化发展成熟。",dishes:["烧尾宴","胡饼","毕罗","酥山（冰淇淋原型）","团茶"],highlight:"韦巨源《烧尾宴食单》记载了58道菜，是中国最早的完整宴席菜单。"},
{name:"两宋时期",period:"960年—1279年",icon:"🎨",desc:"中国饮食文化的黄金时代。城市餐饮业高度发达，夜市繁荣。炒菜技法成熟，宋人'会吃'闻名于世。苏东坡是代表性美食家。",dishes:["东坡肉","蟹酿橙","莲花鸭","酒酿清蒸鸭子","梅花汤饼"],highlight:"《东京梦华录》记载北宋汴京有72家正店，餐饮业空前繁荣。"},
{name:"元明时期",period:"1271年—1644年",icon:"🚢",desc:"蒙古统治带来草原饮食文化。明代大航海时代引入辣椒、番茄、土豆等新食材。《随园食单》成为经典食谱。",dishes:["涮羊肉","烤全羊","佛跳墙（原型）","叫化鸡","松鼠鳜鱼"],highlight:"辣椒从美洲传入中国，彻底改变了川湘菜的面貌。"},
{name:"清代鼎盛",period:"1644年—1912年",icon:"👑",desc:"满汉全席代表了中国宫廷菜的巅峰。四大菜系格局形成。袁枚《随园食单》系统总结了烹饪理论，提出'味要浓厚'的美学。",dishes:["满汉全席","北京烤鸭","开水白菜","宫保鸡丁","麻婆豆腐"],highlight:"袁枚《随园食单》提出'先天须知' '作料须知'等烹饪理论，是中餐理论的里程碑。"},
{name:"民国至现代",period:"1912年—至今",icon:"🌐",desc:"中餐走向世界。八大菜系体系确立。改革开放后餐饮业飞速发展， fusion菜（中西融合）兴起。预制菜和分子料理成为新趋势。",dishes:["新派川菜","分子中餐","创意粤菜","融合菜","分子料理"],highlight:"中餐已成为全球最受欢迎的菜系之一，在180多个国家有中餐馆。"}
];
function render(){
  document.getElementById('timeline').innerHTML=ERAS.map(e=>`
    <div class="era">
      <div class="era-card">
        <div class="era-header"><div class="era-icon">${e.icon}</div><div><div class="era-name">${e.name}</div><div class="era-period">${e.period}</div></div></div>
        <div class="era-desc">${e.desc}</div>
        <div class="dishes">${e.dishes.map(d=>`<span class="dish-tag">${d}</span>`).join('')}</div>
        <div class="highlight">📖 ${e.highlight}</div>
      </div>
    </div>`).join('');
}
render();
</script>
</body>
</html>
