<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="用户画像构建器 - 创建详细的用户画像Persona，帮助团队理解目标用户">
    <meta name="robots" content="index, follow">
    <title>用户画像构建器</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="i18n.js" defer></script>
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #ea580c; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; --hover-color: #f1f3f5; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #fb923c; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; --hover-color: #3a3a3a; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        textarea { resize: vertical; min-height: 60px; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 8px; margin-bottom: 8px; }
        button:hover { opacity: 0.9; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-danger { background-color: var(--danger-color); }
        .btn-success { background-color: var(--success-color); }
        .btn-secondary { background-color: var(--secondary-color); }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
        .persona-display { border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; background: var(--bg-color); }
        .persona-header { display: flex; gap: 24px; align-items: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .persona-avatar { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 42px; color: white; flex-shrink: 0; }
        .persona-name { font-size: 24px; font-weight: bold; margin-bottom: 4px; }
        .persona-role { font-size: 16px; color: var(--secondary-color); }
        .persona-section { margin-bottom: 20px; }
        .persona-section h4 { color: var(--primary-color); margin-bottom: 10px; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        .trait-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .trait-item { padding: 8px 12px; background: var(--card-bg); border-radius: 6px; font-size: 14px; }
        .trait-item .t-label { color: var(--secondary-color); font-size: 12px; }
        .quote-box { padding: 16px; background: color-mix(in srgb, var(--primary-color) 8%, var(--bg-color)); border-radius: 8px; font-style: italic; border-left: 4px solid var(--primary-color); }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; background: color-mix(in srgb, var(--primary-color) 15%, var(--card-bg)); color: var(--primary-color); margin: 2px; }
        .persona-list-item { display: flex; align-items: center; gap: 16px; padding: 14px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; background: var(--bg-color); cursor: pointer; transition: border-color 0.2s; }
        .persona-list-item:hover { border-color: var(--primary-color); }
        .persona-mini-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; flex-shrink: 0; }
        .persona-list-info { flex: 1; }
        .persona-list-info h4 { margin: 0 0 4px; }
        .persona-list-info p { margin: 0; font-size: 13px; color: var(--secondary-color); }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>用户画像构建器</h1>

        <div class="grid-2">
            <div>
                <div class="card">
                    <h3>创建/编辑画像</h3>
                    <div class="form-group"><label>姓名/代号</label><input type="text" id="pName" placeholder="如：小明"></div>
                    <div class="form-group"><label>角色/职业</label><input type="text" id="pRole" placeholder="如：产品经理"></div>
                    <div class="grid-2">
                        <div class="form-group"><label>年龄段</label>
                            <select id="pAge"><option>18-24</option><option>25-34</option><option>35-44</option><option>45-54</option><option>55+</option></select>
                        </div>
                        <div class="form-group"><label>性别</label>
                            <select id="pGender"><option>男</option><option>女</option><option>其他</option></select>
                        </div>
                    </div>
                    <div class="form-group"><label>头像颜色</label>
                        <input type="color" id="pColor" value="#ea580c" style="width:60px;height:36px;padding:2px;border:1px solid var(--border-color);border-radius:4px;">
                    </div>
                    <div class="form-group"><label>简介</label><textarea id="pBio" rows="2" placeholder="简短的背景介绍..."></textarea></div>
                    <div class="form-group"><label>痛点（每行一个）</label><textarea id="pPainPoints" rows="3" placeholder="痛点1&#10;痛点2"></textarea></div>
                    <div class="form-group"><label>目标（每行一个）</label><textarea id="pGoals" rows="3" placeholder="目标1&#10;目标2"></textarea></div>
                    <div class="form-group"><label>行为特征（每行一个）</label><textarea id="pBehaviors" rows="2" placeholder="特征1&#10;特征2"></textarea></div>
                    <div class="form-group"><label>技术熟练度</label>
                        <select id="pTechLevel"><option value="low">初级</option><option value="medium" selected>中级</option><option value="high">高级</option></select>
                    </div>
                    <div class="form-group"><label>引用语</label><input type="text" id="pQuote" placeholder="一句代表其心声的话"></div>
                    <div class="form-group"><label>标签（逗号分隔）</label><input type="text" id="pTags" placeholder="如：效率控, 数据驱动"></div>
                    <button onclick="savePersona()">保存画像</button>
                    <button onclick="loadDemo()" class="btn-secondary">加载示例</button>
                </div>
            </div>

            <div>
                <div class="card">
                    <h3>画像预览</h3>
                    <div id="personaPreview" class="persona-display">
                        <div style="text-align:center;color:var(--secondary-color);padding:40px 0;">填写左侧表单预览画像</div>
                    </div>
                </div>
                <div class="card">
                    <h3>已有画像 <span id="personaCount" style="color:var(--secondary-color)">(0)</span></h3>
                    <div id="personaList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let personas = [];
        let editingIdx = -1;

        function toggleTheme() {
            const html = document.documentElement;
            html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
        }

        function getFormData() {
            return {
                name: document.getElementById('pName').value.trim(),
                role: document.getElementById('pRole').value.trim(),
                age: document.getElementById('pAge').value,
                gender: document.getElementById('pGender').value,
                color: document.getElementById('pColor').value,
                bio: document.getElementById('pBio').value.trim(),
                painPoints: document.getElementById('pPainPoints').value.split('\n').filter(x => x.trim()),
                goals: document.getElementById('pGoals').value.split('\n').filter(x => x.trim()),
                behaviors: document.getElementById('pBehaviors').value.split('\n').filter(x => x.trim()),
                techLevel: document.getElementById('pTechLevel').value,
                quote: document.getElementById('pQuote').value.trim(),
                tags: document.getElementById('pTags').value.split(',').map(t => t.trim()).filter(Boolean)
            };
        }

        function savePersona() {
            const data = getFormData();
            if (!data.name) { alert('请输入姓名'); return; }
            if (editingIdx >= 0) {
                data.id = personas[editingIdx].id;
                personas[editingIdx] = data;
                editingIdx = -1;
            } else {
                data.id = Date.now();
                personas.push(data);
            }
            clearForm();
            renderPersonas();
        }

        function clearForm() {
            ['pName','pRole','pBio','pPainPoints','pGoals','pBehaviors','pQuote','pTags'].forEach(id => document.getElementById(id).value = '');
        }

        function renderPersonas() {
            const el = document.getElementById('personaList');
            document.getElementById('personaCount').textContent = '(' + personas.length + ')';
            el.innerHTML = personas.map((p, i) => `
                <div class="persona-list-item" onclick="previewPersona(${i})">
                    <div class="persona-mini-avatar" style="background:${p.color}">${p.name.charAt(0)}</div>
                    <div class="persona-list-info">
                        <h4>${esc(p.name)}</h4>
                        <p>${esc(p.role || '未设置角色')} · ${p.age} · ${p.gender}</p>
                    </div>
                    <span>
                        <button class="btn-sm" onclick="event.stopPropagation();editPersona(${i})">编辑</button>
                        <button class="btn-sm btn-danger" onclick="event.stopPropagation();personas.splice(${i},1);renderPersonas()">删除</button>
                    </span>
                </div>
            `).join('') || '<div style="color:var(--secondary-color);text-align:center;padding:20px;">暂无画像</div>';
        }

        function editPersona(i) {
            const p = personas[i];
            editingIdx = i;
            document.getElementById('pName').value = p.name;
            document.getElementById('pRole').value = p.role;
            document.getElementById('pAge').value = p.age;
            document.getElementById('pGender').value = p.gender;
            document.getElementById('pColor').value = p.color;
            document.getElementById('pBio').value = p.bio;
            document.getElementById('pPainPoints').value = p.painPoints.join('\n');
            document.getElementById('pGoals').value = p.goals.join('\n');
            document.getElementById('pBehaviors').value = p.behaviors.join('\n');
            document.getElementById('pTechLevel').value = p.techLevel;
            document.getElementById('pQuote').value = p.quote;
            document.getElementById('pTags').value = p.tags.join(', ');
            previewPersona(i);
        }

        function previewPersona(i) { renderPersonaDisplay(personas[i]); }

        function renderPersonaDisplay(p) {
            const techLabels = { low:'初级', medium:'中级', high:'高级' };
            document.getElementById('personaPreview').innerHTML = `
                <div class="persona-header">
                    <div class="persona-avatar" style="background:${p.color}">${p.name.charAt(0)}</div>
                    <div>
                        <div class="persona-name">${esc(p.name)}</div>
                        <div class="persona-role">${esc(p.role || '未设置角色')} · ${p.gender} · ${p.age}</div>
                        ${p.tags.length ? `<div style="margin-top:8px;">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
                    </div>
                </div>
                ${p.bio ? `<div class="persona-section"><h4>简介</h4><p style="font-size:15px;">${esc(p.bio)}</p></div>` : ''}
                ${p.quote ? `<div class="persona-section"><div class="quote-box">"${esc(p.quote)}"</div></div>` : ''}
                <div class="grid-2">
                    <div class="persona-section">
                        <h4>痛点</h4>
                        ${p.painPoints.map(pp => `<div style="padding:6px 0;font-size:14px;">❌ ${esc(pp)}</div>`).join('') || '<div style="color:var(--secondary-color);">暂无</div>'}
                    </div>
                    <div class="persona-section">
                        <h4>目标</h4>
                        ${p.goals.map(g => `<div style="padding:6px 0;font-size:14px;">🎯 ${esc(g)}</div>`).join('') || '<div style="color:var(--secondary-color);">暂无</div>'}
                    </div>
                </div>
                <div class="persona-section">
                    <h4>行为特征</h4>
                    <div class="trait-grid">
                        ${p.behaviors.map(b => `<div class="trait-item">• ${esc(b)}</div>`).join('') || '<div style="color:var(--secondary-color);">暂无</div>'}
                    </div>
                </div>
                <div class="persona-section">
                    <h4>技术熟练度</h4>
                    <div style="display:flex;gap:6px;margin-top:4px;">
                        ${['low','medium','high'].map(l => `<div style="flex:1;height:8px;border-radius:4px;background:${l==='low'?'var(--danger-color)':l==='medium'?'var(--warning-color)':'var(--success-color)'};opacity:${p.techLevel===l?1:0.2}"></div>`).join('')}
                    </div>
                    <div style="font-size:13px;color:var(--secondary-color);margin-top:4px;">${techLabels[p.techLevel]}</div>
                </div>
            `;
        }

        function loadDemo() {
            personas = [{
                name: '王小明', role: '产品经理', age: '25-34', gender: '男', color: '#2563eb',
                bio: '在一家中型互联网公司担任产品经理，负责电商产品线。日常需要频繁与设计和开发团队沟通。',
                painPoints: ['工具太多导致信息分散', '跨部门沟通效率低', '需求变更管理困难'],
                goals: ['提高团队协作效率', '缩短产品迭代周期', '做出用户真正需要的产品'],
                behaviors: ['每天使用10+工具', '习惯用数据驱动决策', '喜欢尝试新工具'],
                techLevel: 'high', quote: '好的工具应该让人感觉不到它的存在。',
                tags: ['效率控', '数据驱动', 'Tech-savvy'], id: 1
            }];
            renderPersonas();
            previewPersona(0);
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        renderPersonas();
    </script>
</body>
</html>
