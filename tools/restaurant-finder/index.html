<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>餐厅查找</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#3fb950;--yellow:#d29922;--red:#f85149;--orange:#db6d28}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 20px}
.header h1{font-size:20px;margin-bottom:12px}.header h1 span{font-size:24px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls input,.controls select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px}
.controls input{width:220px}
.main{display:grid;grid-template-columns:1fr 380px;height:calc(100vh - 110px)}
.map-area{background:#0a0e14;position:relative;display:flex;align-items:center;justify-content:center}
.rest-map{width:90%;height:80%;position:relative}
.rest-dot{position:absolute;cursor:pointer;z-index:5;text-align:center}
.rest-dot .icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;margin:0 auto}
.rest-dot .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:11px;white-space:nowrap;z-index:10}
.rest-dot:hover .tip{display:block}
.sidebar{background:var(--card);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.cuisine-tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.cuisine-tab{padding:5px 10px;border-radius:14px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:transparent;color:#8b949e}
.cuisine-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sort-bar{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;font-size:12px;flex-wrap:wrap}
.sort-bar select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:12px}
.rest-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;margin:8px;cursor:pointer;transition:border-color .2s}
.rest-card:hover{border-color:var(--accent)}
.rest-card .top{display:flex;justify-content:space-between;align-items:flex-start}
.rest-card .name{font-size:16px;font-weight:700}
.rest-card .cuisine-tag{padding:2px 8px;border-radius:4px;font-size:11px;background:var(--card)}
.rest-card .rating{margin-top:4px;font-size:13px}
.rest-card .rating .stars{color:var(--yellow)}
.rest-card .addr{font-size:12px;color:#8b949e;margin:6px 0}
.rest-card .meta{display:flex;gap:12px;font-size:12px;color:#8b949e;margin:6px 0}
.rest-card .price{font-size:14px;font-weight:700;color:var(--green)}
.rest-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rest-card .tag{padding:3px 8px;background:var(--card);border-radius:4px;font-size:11px;color:#8b949e}
.rest-card .highlights{margin-top:8px;padding:8px 10px;background:var(--card);border-radius:6px;font-size:12px}
.rest-card .highlights .hl{color:var(--accent)}
.rest-card .hours{margin-top:6px;font-size:11px;color:#8b949e}
.no-result{text-align:center;padding:40px;color:#8b949e}
.detail-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:100;justify-content:center;align-items:center}
.detail-overlay.show{display:flex}
.detail-box{background:var(--card);border:1px solid var(--border);border-radius:12px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;padding:20px}
.detail-close{float:right;background:var(--border);color:var(--text);border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px}
@media(max-width:768px){.main{grid-template-columns:1fr;grid-template-rows:40vh 1fr}.sidebar{border-left:none;border-top:1px solid var(--border)}}
</style>
</head>
<body>
<div class="header">
<h1><span>🍽️</span> 餐厅查找</h1>
<div class="controls">
<input type="text" id="searchInput" placeholder="搜索餐厅/菜系..." oninput="renderRestaurants()">
<select id="priceFilter" onchange="renderRestaurants()">
<option value="all">所有价位</option>
<option value="low">¥ 人均50以下</option>
<option value="mid">¥¥ 人均50-150</option>
<option value="high">¥¥¥ 人均150-300</option>
<option value="luxury">¥¥¥¥ 人均300以上</option>
</select>
<select id="sortSelect" onchange="renderRestaurants()">
<option value="rating">评分最高</option>
<option value="distance">距离最近</option>
<option value="price-asc">价格最低</option>
<option value="price-desc">价格最高</option>
<option value="reviews">评论最多</option>
</select>
</div>
</div>
<div class="main">
<div class="map-area"><div class="rest-map" id="restMap"></div></div>
<div class="sidebar">
<div class="cuisine-tabs">
<button class="cuisine-tab active" onclick="filterCuisine('all',this)">全部</button>
<button class="cuisine-tab" onclick="filterCuisine('中餐',this)">中餐</button>
<button class="cuisine-tab" onclick="filterCuisine('火锅',this)">火锅</button>
<button class="cuisine-tab" onclick="filterCuisine('日料',this)">日料</button>
<button class="cuisine-tab" onclick="filterCuisine('西餐',this)">西餐</button>
<button class="cuisine-tab" onclick="filterCuisine('烧烤',this)">烧烤</button>
<button class="cuisine-tab" onclick="filterCuisine('快餐',this)">快餐</button>
<button class="cuisine-tab" onclick="filterCuisine('甜品',this)">甜品</button>
</div>
<div id="restList" style="flex:1;overflow-y:auto"></div>
</div>
</div>
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)"><div class="detail-box" id="detailBox"></div></div>
<script>
let cuisineFilter='all';
const restaurants=[
{name:'全聚德(前门店)',cuisine:'中餐',priceLevel:'high',price:180,addr:'东城区前门大街30号',distance:0.8,lat:39.898,lon:116.40,rating:4.3,reviews:12580,hours:'11:00-14:00,17:00-21:00',tags:['百年老店','烤鸭','中华老字号'],highlights:['招牌烤鸭 ¥198/只','芥末鸭掌','火燎鸭心'],ambience:'传统中式',parking:'有'},
{name:'海底捞(国贸店)',cuisine:'火锅',priceLevel:'mid',price:120,addr:'朝阳区建国门外大街1号',distance:0.5,lat:39.908,lon:116.46,rating:4.5,reviews:28900,hours:'10:00-次日07:00',tags:['服务好','等位小食','生日惊喜'],highlights:['番茄锅底','捞派毛肚','虾滑'],ambience:'现代时尚',parking:'代客泊车'},
{name:'海底捞(西单店)',cuisine:'火锅',priceLevel:'mid',price:115,addr:'西城区西单北大街131号',distance:2.0,lat:39.912,lon:116.37,rating:4.4,reviews:15600,hours:'10:00-次日07:00',tags:['24小时','自助调料','等位服务'],highlights:['鸳鸯锅','嫩牛肉','酥肉'],ambience:'热闹',parking:'商场地下'},
{name:'鼎泰丰(新光店)',cuisine:'中餐',priceLevel:'mid',price:100,addr:'朝阳区建国路89号华贸中心',distance:1.2,lat:39.910,lon:116.47,rating:4.7,reviews:8900,hours:'11:00-14:00,17:00-21:00',tags:['米其林','小笼包','台湾菜'],highlights:['蟹粉小笼包 ¥68/笼','红油抄手','担担面'],ambience:'精致典雅',parking:'商场地下'},
{name:'望湘园(三里屯店)',cuisine:'中餐',priceLevel:'mid',price:85,addr:'朝阳区三里屯路19号',distance:1.5,lat:39.933,lon:116.45,rating:4.2,reviews:6700,hours:'11:00-22:00',tags:['湘菜','辣','下饭'],highlights:['剁椒鱼头','毛氏红烧肉','小炒黄牛肉'],ambience:'热闹',parking:'路边'},
{name:'一兰拉面(王府井店)',cuisine:'日料',priceLevel:'low',price:45,addr:'东城区王府井大街138号',distance:1.0,lat:39.913,lon:116.41,rating:4.4,reviews:11200,hours:'00:00-24:00',tags:['24小时','日式拉面','自助点单'],highlights:['豚骨拉面 ¥42','味噌拉面','溏心蛋'],ambience:'日式简约',parking:'无'},
{name:'外婆家(朝阳大悦城店)',cuisine:'中餐',priceLevel:'low',price:55,addr:'朝阳区朝阳北路101号',distance:3.2,lat:39.925,lon:116.49,rating:4.1,reviews:9800,hours:'10:30-21:30',tags:['杭帮菜','性价比高','排队'],highlights:['茶香鸡 ¥39','外婆红烧肉','西湖醋鱼'],ambience:'温馨',parking:'商场地下'},
{name:'木屋烧烤(望京店)',cuisine:'烧烤',priceLevel:'mid',price:95,addr:'朝阳区望京街9号',distance:3.8,lat:39.994,lon:116.48,rating:4.3,reviews:7600,hours:'17:00-次日02:00',tags:['深夜食堂','啤酒','聚会'],highlights:['烤羊排','蒜蓉生蚝','烤串拼盘'],ambience:'休闲热闹',parking:'路边'},
{name:'局气(南锣鼓巷店)',cuisine:'中餐',priceLevel:'mid',price:88,addr:'东城区南锣鼓巷102号',distance:1.8,lat:39.935,lon:116.40,rating:4.5,reviews:5400,hours:'11:00-22:00',tags:['老北京','兔爷土豆泥','蜂窝煤'],highlights:['兔爷土豆泥','蜂窝煤蛋糕','炸酱面'],ambience:'老北京风情',parking:'胡同内'},
{name:'Wagas(国贸店)',cuisine:'西餐',priceLevel:'mid',price:75,addr:'朝阳区建国门外大街1号',distance:0.6,lat:39.908,lon:116.46,rating:4.2,reviews:4500,hours:'07:00-22:00',tags:['轻食','沙拉','健康'],highlights:['牛肉沙拉 ¥58','意面','鲜榨果汁'],ambience:'简约现代',parking:'商场内'},
{name:'哈根达斯(王府井店)',cuisine:'甜品',priceLevel:'mid',price:65,addr:'东城区王府井大街255号',distance:0.9,lat:39.914,lon:116.41,rating:4.3,reviews:3200,hours:'10:00-22:00',tags:['冰淇淋','甜品','下午茶'],highlights:['抹茶冰淇淋','夏威夷果仁','下午茶套餐'],ambience:'浪漫',parking:'商场内'},
{name:'眉州东坡(大望路店)',cuisine:'中餐',priceLevel:'mid',price:90,addr:'朝阳区大望路15号',distance:1.5,lat:39.908,lon:116.48,rating:4.4,reviews:8100,hours:'11:00-22:00',tags:['川菜','正宗','大份'],highlights:['东坡肘子','水煮鱼','宫保鸡丁'],ambience:'传统中式',parking:'地下'},
{name:'蓝蛙(三里屯店)',cuisine:'西餐',priceLevel:'high',price:160,addr:'朝阳区三里屯路19号',distance:1.6,lat:39.933,lon:116.45,rating:4.5,reviews:6300,hours:'11:00-次日01:00',tags:['汉堡','牛排','精酿啤酒'],highlights:['蓝蛙经典汉堡 ¥98','战斧牛排','精酿啤酒'],ambience:'美式休闲',parking:'路边'}
];
function getPriceLabel(p){
if(p<=50)return{label:'¥',color:'var(--green)'};
if(p<=150)return{label:'¥¥',color:'var(--yellow)'};
if(p<=300)return{label:'¥¥¥',color:'var(--orange)'};
return{label:'¥¥¥¥',color:'var(--red)'};
}
function renderRestaurants(){
const search=document.getElementById('searchInput').value.toLowerCase();
const priceF=document.getElementById('priceFilter').value;
const sortF=document.getElementById('sortSelect').value;
let list=restaurants.filter(r=>{
if(cuisineFilter!=='all'&&r.cuisine!==cuisineFilter)return false;
if(priceF==='low'&&r.price>50)return false;
if(priceF==='mid'&&(r.price<=50||r.price>150))return false;
if(priceF==='high'&&(r.price<=150||r.price>300))return false;
if(priceF==='luxury'&&r.price<=300)return false;
if(search&&!r.name.includes(search)&&!r.cuisine.includes(search)&&!r.addr.includes(search))return false;
return true;
});
if(sortF==='rating')list.sort((a,b)=>b.rating-a.rating);
else if(sortF==='distance')list.sort((a,b)=>a.distance-b.distance);
else if(sortF==='price-asc')list.sort((a,b)=>a.price-b.price);
else if(sortF==='price-desc')list.sort((a,b)=>b.price-a.price);
else if(sortF==='reviews')list.sort((a,b)=>b.reviews-a.reviews);
document.getElementById('restList').innerHTML=list.length===0?'<div class="no-result">没有匹配的餐厅</div>':list.map(r=>{
const stars='★'.repeat(Math.floor(r.rating))+'☆'.repeat(5-Math.floor(r.rating));
const pl=getPriceLabel(r.price);
return`<div class="rest-card" onclick="showDetail(${restaurants.indexOf(r)})">
<div class="top"><div class="name">${r.name}</div><div class="cuisine-tag" style="color:${pl.color}">${pl.label}</div></div>
<div class="rating"><span class="stars">${stars}</span> ${r.rating} · ${r.reviews.toLocaleString()}条评价</div>
<div class="addr">📍 ${r.addr} · 📏 ${r.distance}km</div>
<div class="meta"><span>🕐 ${r.hours}</span><span>🅿️ ${r.parking}</span></div>
<div class="highlights">${r.highlights.map(h=>`<span class="hl">${h}</span>`).join(' · ')}</div>
<div class="tags">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
<div class="price">人均 ¥${r.price}</div>
</div>`;
}).join('');
renderMap();
}
function renderMap(){
const map=document.getElementById('restMap');
let html='<svg viewBox="0 0 100 70" width="100%" height="100%" style="opacity:.15">';
for(let y=0;y<70;y+=5){html+=`<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="#1a2332" stroke-width="0.1"/>`;}
for(let x=0;x<100;x+=5){html+=`<line x1="${x}" y1="0" x2="${x}" y2="70" stroke="#1a2332" stroke-width="0.1"/>`;}
html+='</svg>';
const cuisineColors={中餐:'#e4002b',火锅:'#ff6600',日料:'#ff9900',西餐:'#0066cc',烧烤:'#8b4513',快餐:'#00b050',甜品:'#ff69b4'};
restaurants.forEach(r=>{
const x=(r.lon-116.2)/0.4*80+5;
const y=(40.0-r.lat)/0.15*60+5;
const color=cuisineColors[r.cuisine]||'var(--accent)';
html+=`<div class="rest-dot" style="left:${x}%;top:${y}%"><div class="icon" style="background:${color};color:#fff">🍽️</div><div class="tip">${r.name}<br>${r.cuisine} · 人均¥${r.price}<br>★${r.rating}</div></div>`;
});
map.innerHTML=html;
}
function filterCuisine(c,btn){cuisineFilter=c;document.querySelectorAll('.cuisine-tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');renderRestaurants();}
function showDetail(idx){
const r=restaurants[idx];if(!r)return;
const stars='★'.repeat(Math.floor(r.rating))+'☆'.repeat(5-Math.floor(r.rating));
const pl=getPriceLabel(r.price);
document.getElementById('detailBox').innerHTML=`
<button class="detail-close" onclick="closeDetail(event,true)">✕</button>
<h2 style="font-size:20px;margin-bottom:4px">${r.name}</h2>
<p style="color:#8b949e;margin-bottom:8px">${r.cuisine} · <span style="color:${pl.color}">${pl.label}</span></p>
<div style="margin-bottom:12px"><span style="color:var(--yellow)">${stars}</span> ${r.rating} · ${r.reviews.toLocaleString()}条评价</div>
<div style="padding:12px;background:var(--bg);border-radius:8px;margin-bottom:12px">
<div style="margin-bottom:6px">📍 ${r.addr}</div>
<div style="margin-bottom:6px">🕐 ${r.hours}</div>
<div style="margin-bottom:6px">💰 人均 ¥${r.price}</div>
<div style="margin-bottom:6px">🅿️ ${r.parking}</div>
<div>🏠 ${r.ambience}</div>
</div>
<h3 style="font-size:14px;margin-bottom:8px">🔥 招牌菜</h3>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${r.highlights.map(h=>`<div style="padding:6px 12px;background:var(--bg);border-radius:6px;font-size:13px">${h}</div>`).join('')}</div>
<h3 style="font-size:14px;margin-bottom:8px">🏷️ 标签</h3>
<div style="display:flex;gap:6px;flex-wrap:wrap">${r.tags.map(t=>`<span style="padding:4px 10px;background:var(--bg);border-radius:4px;font-size:12px">${t}</span>`).join('')}</div>`;
document.getElementById('detailOverlay').classList.add('show');
}
function closeDetail(e,force){if(force||e.target===document.getElementById('detailOverlay'))document.getElementById('detailOverlay').classList.remove('show');}
renderRestaurants();
</script>
</body>
</html>
