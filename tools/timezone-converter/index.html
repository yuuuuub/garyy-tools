<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时区转换</title>
<meta name="description" content="时区转换工具，快速转换全球各地时间">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#60a5fa;--muted:#8b949e;--radius:12px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16pxscroll-behavior:smooth;}
.container{max-width:700px;margin:0 auto}
h1{font-size:1.5rem;text-align:center;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem;outline:none}
.search-wrap input:focus{border-color:var(--accent)}
.city-list{max-height:250px;overflow-y:auto}
.city-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;transition:.2s;border:1px solid transparent}
.city-item:hover{background:rgba(59,130,246,.05);border-color:var(--border)}
.city-item.selected{background:rgba(59,130,246,.1);border-color:var(--accent)}
.city-name{font-weight:600;font-size:.9rem}
.city-tz{color:var(--muted);font-size:.8rem}
.city-time{font-family:monospace;font-size:1rem;color:var(--accent)}
.city-date{font-size:.7rem;color:var(--muted)}
.day-night{font-size:.8rem}
.convert-section{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.convert-section .field{flex:1;min-width:120px}
.convert-section label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.convert-section input,.convert-section select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem;outline:none}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:16px}
.result-card{background:rgba(59,130,246,.05);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.result-city{font-weight:600;font-size:.85rem;margin-bottom:4px}
.result-time{font-size:1.3rem;font-weight:700;color:var(--accent)}
.result-date{font-size:.75rem;color:var(--muted)}
.result-offset{font-size:.7rem;color:var(--muted)}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;background:var(--accent);color:var(--text);transition:.2s}
.btn:hover{background:var(--accent2)}
.selected-cities{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(59,130,246,.1);border:1px solid var(--accent);border-radius:16px;font-size:.8rem;cursor:pointer}
.chip:hover{background:rgba(248,113,113,.1);border-color:var(--danger)}
.danger{color:var(--danger)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="时区转换">
  <meta property="og:description" content="时区转换工具，快速转换全球各地时间">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/timezone-converter/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🌍 时区转换</h1>

<div class="card">
<h2 style="font-size:1rem;margin-bottom:12px">选择城市</h2>
<div class="search-wrap"><input type="text" id="searchInput" placeholder="搜索城市..." oninput="filterCities(this.value)"></div>
<div class="city-list" id="cityList"></div>
<div class="selected-cities" id="selectedChips"></div>
</div>

<div class="card">
<h2 style="font-size:1rem;margin-bottom:12px">时间转换</h2>
<div class="convert-section">
<div class="field"><label>源城市</label><select id="fromCity" onchange="convert()"></select></div>
<div class="field"><label>日期时间</label><input type="datetime-local" id="convertTime" onchange="convert()"></div>
</div>
<div class="result-grid" id="resultGrid"></div>
</div>

<div class="card">
<h2 style="font-size:1rem;margin-bottom:12px">实时时间</h2>
<div class="result-grid" id="liveGrid"></div>
</div>
</div>

<script>
const cities = [
  {name:'北京',tz:'Asia/Shanghai',offset:'+08:00'},{name:'上海',tz:'Asia/Shanghai',offset:'+08:00'},
  {name:'东京',tz:'Asia/Tokyo',offset:'+09:00'},{name:'首尔',tz:'Asia/Seoul',offset:'+09:00'},
  {name:'新加坡',tz:'Asia/Singapore',offset:'+08:00'},{name:'曼谷',tz:'Asia/Bangkok',offset:'+07:00'},
  {name:'孟买',tz:'Asia/Kolkata',offset:'+05:30'},{name:'迪拜',tz:'Asia/Dubai',offset:'+04:00'},
  {name:'莫斯科',tz:'Europe/Moscow',offset:'+03:00'},{name:'伊斯坦布尔',tz:'Europe/Istanbul',offset:'+03:00'},
  {name:'开罗',tz:'Africa/Cairo',offset:'+02:00'},{name:'柏林',tz:'Europe/Berlin',offset:'+01:00'},
  {name:'巴黎',tz:'Europe/Paris',offset:'+01:00'},{name:'伦敦',tz:'Europe/London',offset:'+00:00'},
  {name:'纽约',tz:'America/New_York',offset:'-05:00'},{name:'芝加哥',tz:'America/Chicago',offset:'-06:00'},
  {name:'丹佛',tz:'America/Denver',offset:'-07:00'},{name:'洛杉矶',tz:'America/Los_Angeles',offset:'-08:00'},
  {name:'旧金山',tz:'America/Los_Angeles',offset:'-08:00'},{name:'多伦多',tz:'America/Toronto',offset:'-05:00'},
  {name:'温哥华',tz:'America/Vancouver',offset:'-08:00'},{name:'悉尼',tz:'Australia/Sydney',offset:'+11:00'},
  {name:'墨尔本',tz:'Australia/Melbourne',offset:'+11:00'},{name:'奥克兰',tz:'Pacific/Auckland',offset:'+13:00'},
  {name:'檀香山',tz:'Pacific/Honolulu',offset:'-10:00'},{name:'台北',tz:'Asia/Taipei',offset:'+08:00'},
  {name:'香港',tz:'Asia/Hong_Kong',offset:'+08:00'},{name:'澳门',tz:'Asia/Macau',offset:'+08:00'},
  {name:'雅加达',tz:'Asia/Jakarta',offset:'+07:00'},{name:'河内',tz:'Asia/Ho_Chi_Minh',offset:'+07:00'},
  {name:'马尼拉',tz:'Asia/Manila',offset:'+08:00'},{name:'吉隆坡',tz:'Asia/Kuala_Lumpur',offset:'+08:00'},
  {name:'利马',tz:'America/Lima',offset:'-05:00'},{name:'圣地亚哥',tz:'America/Santiago',offset:'-04:00'},
  {name:'布宜诺斯艾利斯',tz:'America/Argentina/Buenos_Aires',offset:'-03:00'},
  {name:'圣保罗',tz:'America/Sao_Paulo',offset:'-03:00'},{name:'开普敦',tz:'Africa/Johannesburg',offset:'+02:00'},
  {name:'内罗毕',tz:'Africa/Nairobi',offset:'+03:00'},{name:'赫尔辛基',tz:'Europe/Helsinki',offset:'+02:00'}
];

let selectedCities = new Set(['北京','纽约','伦敦','东京']);
let liveTimer = null;

function init() {
  renderCityList();
  populateSelects();
  setDefaultTime();
  renderSelected();
  startLive();
}

function renderCityList(filter = '') {
  const list = document.getElementById('cityList');
  list.innerHTML = '';
  cities.filter(c => !filter || c.name.includes(filter) || c.tz.toLowerCase().includes(filter.toLowerCase())).forEach(c => {
    const item = document.createElement('div');
    item.className = 'city-item' + (selectedCities.has(c.name) ? ' selected' : '');
    const now = getTimeInTz(c.tz);
    item.innerHTML = `<div><div class="city-name">${c.name}</div><div class="city-tz">${c.tz}</div></div><div style="text-align:right"><div class="city-time">${now.time}</div><div class="city-date">${now.date} ${getDayNight(now.hour)}</div></div>`;
    item.onclick = () => toggleCity(c.name);
    list.appendChild(item);
  });
}

function filterCities(v) { renderCityList(v); }

function toggleCity(name) {
  if (selectedCities.has(name)) selectedCities.delete(name);
  else selectedCities.add(name);
  renderSelected();
  renderCityList(document.getElementById('searchInput').value);
  populateSelects();
  convert();
  renderLive();
}

function renderSelected() {
  const chips = document.getElementById('selectedChips');
  chips.innerHTML = '';
  selectedCities.forEach(name => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `${name} ✕`;
    chip.onclick = (e) => { e.stopPropagation(); toggleCity(name); };
    chips.appendChild(chip);
  });
}

function populateSelects() {
  const sel = document.getElementById('fromCity');
  sel.innerHTML = '';
  selectedCities.forEach(name => {
    const c = cities.find(x => x.name === name);
    if (c) { const opt = document.createElement('option'); opt.value = c.tz; opt.textContent = c.name; sel.appendChild(opt); }
  });
}

function setDefaultTime() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('convertTime').value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

function convert() {
  const fromTz = document.getElementById('fromCity').value;
  const timeStr = document.getElementById('convertTime').value;
  if (!fromTz || !timeStr) return;
  const grid = document.getElementById('resultGrid');
  grid.innerHTML = '';
  selectedCities.forEach(name => {
    const c = cities.find(x => x.name === name);
    if (!c) return;
    const result = convertTime(timeStr, fromTz, c.tz);
    grid.innerHTML += `<div class="result-card"><div class="result-city">${c.name}</div><div class="result-time">${result.time}</div><div class="result-date">${result.date}</div><div class="result-offset">UTC${c.offset}</div></div>`;
  });
}

function convertTime(timeStr, fromTz, toTz) {
  const d = new Date(timeStr);
  const fromTime = d.toLocaleString('en-US', { timeZone: fromTz, hour12: false });
  const toTime = new Date(fromTime).toLocaleString('en-US', { timeZone: toTz, hour12: false });
  const td = new Date(toTime);
  const pad = n => String(n).padStart(2, '0');
  return { time: `${pad(td.getHours())}:${pad(td.getMinutes())}`, date: `${td.getFullYear()}-${pad(td.getMonth()+1)}-${pad(td.getDate())}` };
}

function getTimeInTz(tz) {
  const now = new Date();
  const str = now.toLocaleString('en-US', { timeZone: tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const d = new Date(str);
  const pad = n => String(n).padStart(2, '0');
  return { time: `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`, date: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, hour: d.getHours() };
}

function getDayNight(h) { return h >= 6 && h < 18 ? '☀️' : '🌙'; }

function renderLive() {
  const grid = document.getElementById('liveGrid');
  grid.innerHTML = '';
  selectedCities.forEach(name => {
    const c = cities.find(x => x.name === name);
    if (!c) return;
    const now = getTimeInTz(c.tz);
    grid.innerHTML += `<div class="result-card"><div class="result-city">${c.name} ${getDayNight(now.hour)}</div><div class="result-time">${now.time}</div><div class="result-date">${now.date}</div></div>`;
  });
}

function startLive() {
  renderLive();
  liveTimer = setInterval(() => { renderLive(); renderCityList(document.getElementById('searchInput').value); }, 1000);
}

init();
convert();
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
