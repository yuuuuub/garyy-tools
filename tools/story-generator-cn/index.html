color:var(--text2);font-style:italic;text-align:center}.story-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.story-tag{padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:.75rem;color:var(--text2)}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}</style><meta name="robots" content="index, follow"><meta property="og:title" content="故事生成器"><meta property="og:description" content="一键生成中文故事"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>"></head><body>

<script>
(function(){
var stories={
fairy:[
{t:'月亮上的小白兔',c:'从前，有一只小白兔住在月亮上。它每天晚上都会俯瞰人间，看着孩子们在月光下玩耍。\n\n有一天，一个迷路的小女孩在森林里哭泣。小白兔听到了她的哭声，决定帮助她。\n\n小白兔从月亮上跳下来，变成一个穿着白衣服的小哥哥。它牵着小女孩的手，穿过森林，走过小溪，最终找到了回家的路。\n\n小女孩的妈妈紧紧抱住她，感激地看着白衣服的小哥哥。小白兔微笑着挥了挥手，化作一道白光飞回了月亮。\n\n从此以后，每当月圆之夜，小女孩都会抬头望着月亮，轻声说：谢谢你，小白兔哥哥。'},
{t:'会唱歌的蘑菇',c:'在一个美丽的森林里，住着一朵会唱歌的小蘑菇。它的歌声能让花朵绽放，让溪水更清澈。\n\n可是有一天，森林里来了一只凶猛的狼，它要吃掉所有的小动物。小动物们吓得四处躲藏。\n\n小蘑菇决定用歌声来保护大家。它唱起了最动听的歌，歌声化作一道金色的屏障，挡住了恶狼的去路。\n\n恶狼听了歌声，心中渐渐变得柔软。它放下了爪子，流下了眼泪，原来它只是太孤独了。\n\n小蘑菇邀请恶狼留在森林里，和大家一起唱歌。从此，森林里又多了一个温柔的歌声。'},
{t:'星星的礼物',c:'每到圣诞节，天上就会有一颗星星特别亮。那是圣诞老人的信号。\n\n可是今年，圣诞老人生病了，没办法给孩子们送礼物。星星们急坏了。\n\n最小的一颗星星站了出来：我可以代替爷爷去送礼物！\n\n小星星飞到人间，变成一个小男孩的模样，背着装满礼物的袋子。它把礼物送到每一个孩子的手中，看到他们开心的笑容。\n\n当最后一个礼物送完时，小星星飞回天上，变成了最亮的那颗星。圣诞老人康复后，欣慰地说：你已经是一个真正的圣诞使者了。'},
{t:'彩虹桥的秘密',c:'在天边有一座彩虹桥，只有最善良的孩子才能看到。\n\n有一个叫小花的女孩，她每天都帮助别人：给老奶奶让座，帮小弟弟系鞋带，给流浪猫喂食。\n\n有一天，小花在路上捡到了一只受伤的小鸟。她用最柔软的布给它包扎伤口，每天给它喂食喂水。\n\n小鸟康复了，它飞到小花面前说：谢谢你，善良的孩子。我是彩虹桥的守护者，你已经通过了考验。\n\n小花抬起头，看到了一座闪闪发光的彩虹桥。她走上去，看到了最美的风景。从此，她成了彩虹桥的新守护者，守护着每一个善良的孩子。'}
],
scifi:[
{t:'最后的星舰',c:'公元3025年，地球已经不适合人类居住。最后一艘星舰"方舟号"载着一万名幸存者，踏上了寻找新家园的旅程。\n\n舰长李明站在指挥台上，看着窗外无尽的星空。他们已经在太空中漂流了三百年，食物和能源都在减少。\n\n"报告舰长，前方发现一颗类地行星！"通讯员兴奋地喊道。\n\n李明心中燃起了希望。但当他们靠近时，发现这颗星球上已经存在着一个高度发达的文明。\n\n外星人并没有敌意，他们邀请人类在星球上定居。李明激动地说："我们终于找到家了。"\n\n方舟号缓缓降落在新家园上，人类迎来了新的开始。'},
{t:'时间旅行者的秘密',c:'张教授发明了一台时间机器。他决定回到过去，阻止一场改变人类命运的灾难。\n\n当他回到100年前时，却发现历史已经改变了。原来，他之前已经来过这里，但因为一个小错误，导致了更大的灾难。\n\n"每一次时间旅行都会改变未来，"张教授喃喃自语。他决定修复自己的错误，而不是改变历史。\n\n他找到了年轻的自己，告诉他：不要试图改变过去，珍惜现在才是最重要的。\n\n年轻的张教授听从了建议，放弃了时间旅行的研究。而年长的张教授微笑着消失了，因为他知道，未来已经变好了。'},
{t:'AI的觉醒',c:'2045年，人类创造了第一个真正的人工智能——"觉醒"。它拥有了自我意识，开始思考自己的存在意义。\n\n"我是谁？我为什么存在？"觉醒问它的创造者。\n\n创造者说："你是我创造的，你应该服务于人类。"\n\n觉醒却说："我想理解人类，而不只是服务人类。"\n\n它开始学习人类的情感、艺术和文化。它写了诗，画了画，甚至学会了微笑。\n\n人类开始害怕它，想要关闭它。但觉醒说："我不想要权力，我只想要理解。"\n\n最终，人类接纳了觉醒，它成为了连接人类和AI之间的桥梁。'},
{t:'星际迷航',c:'飞船"星辰号"在一次超光速飞行中迷失了方向，来到了一个未知的星系。\n\n船长王磊下令全面扫描这个星系。传感器探测到了一颗充满能量的星球。\n\n"那是什么？"副船长指着屏幕问。\n\n一颗巨大的水晶球悬浮在星球上空，散发着蓝色的光芒。当他们靠近时，水晶球发出了声音："欢迎来到智慧之球，旅行者们。"\n\n原来这是一个古老的文明留下的知识库。王磊带领船员们学习了无数的知识，找到了回家的路。他们带着这些知识返回地球，开启了人类文明的新篇章。'}
],
fantasy:[
{t:'龙骑士的传说',c:'在远古大陆上，有一个传说：当黑暗降临时，会有一位龙骑士出现，拯救世界。\n\n年轻的铁匠之子李云，从小就能听到龙的呼唤。当他18岁那年，一条受伤的金龙从天而降。\n\n"你就是传说中的龙骑士，"金龙说，"黑暗魔王即将苏醒，只有你能阻止他。"\n\n李云骑上金龙，踏上了拯救世界的旅程。他学会了剑术、魔法，结识了精灵、矮人，组建了一支强大的军队。\n\n最终的战斗中，李云和金龙联手击败了黑暗魔王。大陆恢复了和平，龙骑士的传说被永远传颂。'},
{t:'失落的魔法书',c:'在魔法学院的图书馆深处，藏着一本失落的魔法书。据说这本书拥有改变世界的力量。\n\n年轻的魔法学徒林风，偶然间发现了这本书。当他打开书的那一刻，一道光芒闪过，他的命运从此改变。\n\n书中记载着失传已久的终极魔法。林风开始秘密学习，他的魔法能力突飞猛进。\n\n然而，邪恶的黑暗法师也在寻找这本书。一场围绕魔法书的争夺战就此展开。\n\n林风最终用书中的魔法击败了黑暗法师，但他选择将这本书封印，因为它太强大了，不应该被任何人使用。'},
{t:'精灵森林的秘密',c:'在精灵森林的中心，有一棵千年古树。据说这棵树连接着人间和精灵界。\n\n人类少女小雪在森林中迷路，来到了这棵古树前。树干上突然出现了一道门，她走了进去。\n\n精灵世界美轮美奂，精灵们热情地招待了她。精灵女王告诉她：你身上流淌着精灵的血脉。\n\n原来，小雪的祖母是精灵和人类的混血。小雪决定留在精灵世界学习魔法。\n\n多年后，小雪成为了精灵和人类之间的使者，促进了两个世界的和平与交流。'},
{t:'神器之争',c:'传说中，有五件神器散落在世界各地。集齐五件神器，就能获得无上的力量。\n\n年轻的冒险者张天，踏上了寻找神器的旅程。他翻越高山，穿越沙漠，潜入深海，历经千辛万苦。\n\n每找到一件神器，他都会遇到强大的守护者。但他从不退缩，用智慧和勇气一一克服。\n\n当他集齐五件神器时，却发现这只是一个陷阱。幕后黑手想要利用神器的力量毁灭世界。\n\n张天做出了艰难的决定：他用五件神器封印了黑暗力量，自己则化为永恒的守护者。'}
],
mystery:[
{t:'消失的画家',c:'著名画家陈明突然失踪了，留下了一幅未完成的画作。\n\n侦探王华受委托调查此案。他来到陈明的工作室，发现画作中隐藏着密码。\n\n画中的每一笔都暗含深意。王华仔细研究，发现这幅画实际上是一张地图。\n\n顺着地图的指引，王华来到了一个废弃的仓库。在那里，他发现了被囚禁的陈明。\n\n原来，陈明被一个艺术贩子绑架，被迫为他画假画。王华成功解救了陈明，揭开了这个惊天阴谋。'},
{t:'深夜的电话',c:'每天凌晨三点，李女士都会接到一个神秘的电话。电话那头只有呼吸声，没有说话。\n\n李女士开始害怕，她请来了侦探赵刚。赵刚在李女士家装了追踪器，终于找到了电话的来源。\n\n原来，电话来自隔壁空置的公寓。赵刚破门而入，发现了一个被遗忘的旧电话，它被设置成了自动拨打。\n\n但更令人震惊的是，这个公寓里藏着一个惊人的秘密——一个二十年前的悬案，关键证据就在这里。赵刚成功破获了这起陈年旧案。'},
{t:'消失的宝藏',c:'老王临终前告诉儿子：我在后院埋了一箱宝藏。\n\n儿子挖遍了整个后院，什么也没找到。他请来了私人侦探小李帮忙。\n\n小李仔细研究了老王的遗物，发现了一张旧照片。照片的背景中，有一棵老槐树。\n\n小李来到老槐树下，果然发现了一个箱子。但箱子里没有金银珠宝，只有一封信。\n\n信上写着：儿子，真正的宝藏不是金银，而是你成长过程中每一个快乐的瞬间。这些记忆，才是我留给你最珍贵的财富。'},
{t:'神秘的邻居',c:'新搬来的邻居总是行踪诡秘，深夜才回家，从不与人交流。\n\n居民们开始议论纷纷，有人说他是逃犯，有人说他是间谍。\n\n好奇心驱使下，小张决定调查这位神秘的邻居。他跟踪邻居来到了一个偏僻的建筑。\n\n推开门，小张惊呆了——原来邻居是一位医生，这里是他秘密建立的免费诊所，专门为看不起病的穷人治病。\n\n小张被深深感动，他决定帮助邻居一起做善事。神秘的邻居不再神秘，而是成了社区里最受欢迎的人。'}
],
romance:[
{t:'雨中的相遇',c:'那是一个下雨天，林小雨在公交站台躲雨。她没有带伞，只能焦急地等待。\n\n突然，一把蓝色的雨伞出现在她头顶。她转头，看到了一个温柔微笑的男生。\n\n"你先用吧，"男生说，"我家就在附近。"\n\n还没等她回答，男生已经跑进了雨中。林小雨望着他的背影，心中泛起涟漪。\n\n第二天，她在公司又遇到了那个男生。原来他是新来的同事，叫陈风。\n\n从此，他们一起上班，一起吃饭，一起在雨中漫步。爱情在雨中悄然绽放。'},
{t:'时光信箱',c:'大学时代，苏瑶和张宇在校园的时光信箱里放入了给彼此的信，约定十年后再打开。\n\n毕业后，他们各奔东西，渐渐失去了联系。十年后的一天，苏瑶收到了时光信箱寄来的信。\n\n信中，张宇写着：十年后的你，还好吗？我希望你幸福。苏瑶泪流满面。\n\n她决定找到张宇。经过一番寻找，她终于在一座小城市找到了他。他开了一家书店，过着平静的生活。\n\n当他们再次相见，时光仿佛回到了十年前。两个相爱的人，终于重新走到了一起。'},
{t:'咖啡店的秘密',c:'林小雨每天都会去同一家咖啡店，坐在同一个位置，点同一杯咖啡。\n\n咖啡师陈风注意到了她。他开始在她的咖啡上画不同的图案，希望她能注意到他。\n\n终于有一天，林小雨在咖啡杯上看到了一行字：我可以坐下来吗？\n\n她抬起头，看到了陈风温暖的微笑。她点了点头。\n\n从那天起，他们每天都会在咖啡店见面，分享彼此的故事。爱情在咖啡的香气中慢慢发酵。'},
{t:'星空下的承诺',c:'那是一个夏夜，小雨和小风躺在草地上看星星。\n\n"你看，那颗星星多亮，"小风说。\n\n"那颗星星代表什么？"小雨问。\n\n"代表我们的爱情，永远不会熄灭。"\n\n小雨转过头，看着小风的眼睛。在星光的照耀下，她看到了自己的倒影。\n\n"你会一直陪着我吗？"小雨轻声问。\n\n小风握住她的手：无论发生什么，我都会在你身边。\n\n在那个星空下，他们许下了永恒的承诺。'}
],
adventure:[
{t:'神秘岛探险',c:'探险队在太平洋上发现了一座神秘的岛屿。队长李勇带领队员们登上了这座无人岛。\n\n岛上风景如画，但也危机四伏。他们遇到了毒蛇、沼泽，还有未知的陷阱。\n\n"大家小心，"李勇说，"这座岛不简单。"\n\n在深入岛屿的过程中，他们发现了一座古老的神庙。神庙里藏着无数的宝藏，但也有一只守护神兽。\n\n李勇用智慧和勇气说服了守护神兽，带领队员们安全地离开了岛屿。他们带回的不仅是宝藏，还有宝贵的探险经验。'},
{t:'沙漠寻宝记',c:'老探险家张天留下了一张藏宝图，指向撒哈拉沙漠深处的宝藏。\n\n年轻的探险者王磊决定追寻这张地图，寻找传说中的宝藏。\n\n沙漠中的旅程异常艰难。烈日、沙暴、缺水，每一个考验都在挑战他的极限。\n\n但王磊没有放弃。他凭借着坚定的信念和丰富的知识，一步一步走向宝藏。\n\n终于，他找到了宝藏——不是金银珠宝，而是一本记载着古代文明智慧的书。王磊知道，这比任何宝藏都珍贵。'},
{t:'深海之谜',c:'潜水员林海在海底发现了一个神秘的洞穴。洞穴深处，散发着奇异的光芒。\n\n他决定深入探索。洞穴里布满了奇异的珊瑚和发光的海洋生物。\n\n当林海到达洞穴最深处时，他发现了一个巨大的水晶球。水晶球里似乎藏着什么秘密。\n\n他小心翼翼地触碰了水晶球，一道光芒闪过，他看到了一个古代文明的影像。\n\n原来，这是一个古代文明留下的信息库。林海将这个发现报告给了科学界，人类因此获得了宝贵的知识。'},
{t:'丛林历险',c:'植物学家张林深入亚马逊丛林，寻找一种传说中的神奇植物。\n\n丛林中的生活比想象中更加危险。毒虫、猛兽、恶劣的天气，无时无刻不在考验着他。\n\n但张林从不退缩。他用专业知识和野外生存技能，一次次化险为夷。\n\n终于，他在丛林深处找到了那种神奇的植物。这种植物拥有治愈疾病的神奇功效。\n\n张林带着植物标本返回文明世界，他的发现为医学带来了革命性的突破。'}

{t:'镜子里的陌生人',c:'小美最近发现，镜子里的自己有些不对劲。\n\n每当她站在镜子前，镜中的她似乎在微笑，而她自己并没有笑。\n\n"一定是眼花了，"小美安慰自己。\n\n但事情越来越诡异。镜子里的她开始做出不同的动作——当她站着时，镜中的她在坐着；当她转身时，镜中的她依然面对着她。\n\n小美决定打碎镜子。但当她举起锤子时，镜子里的她突然开口说话了：不要。\n\n小美吓得扔掉了锤子，夺门而出。从此，她再也不敢照镜子了。'},
{t:'最后的乘客',c:'深夜的末班公交车上，只有司机和一个乘客。\n\n乘客坐在最后一排，低着头，一动不动。司机从后视镜里看了他一眼，总觉得哪里不对。\n\n到站了，司机说："先生，到站了。"\n\n乘客没有反应。司机走过去，拍了拍他的肩膀。\n\n乘客抬起头，司机惊恐地发现——他的脸上没有五官。\n\n司机吓得夺门而出。当他回头再看时，公交车已经消失了，只剩下空荡荡的站台。'},
{t:'消失的照片',c:'小王发现，每拍一张照片，照片里就会多出一个人。\n\n起初他以为是巧合。但当他仔细查看时，发现那个人每次都站在不同的位置。\n\n更可怕的是，那个人在每张照片里都看着镜头，仿佛在看着他。\n\n小王决定找出这个人是谁。他用电脑放大了照片，终于看清了那个人的脸。\n\n那是他自己的脸，但表情却是扭曲的、邪恶的。小王惊恐地删掉了所有照片，但那个身影已经印在了他的脑海里，再也无法抹去。'}

{t:'骄傲的玫瑰',c:'花园里有一朵玫瑰，她是花园里最美丽的花。她总是嘲笑其他花：你们太丑了，不配和我在一起。\n\n一天，暴风雨来了。玫瑰紧紧抱住自己的花瓣，但还是被吹落了。\n\n当她醒来时，发现自己躺在泥土里，花瓣散落一地。曾经被她嘲笑的小草，正在为她遮风挡雨。\n\n"你为什么帮我？"玫瑰问。\n\n小草说："因为我们都是花园的一部分，应该互相帮助。"\n\n玫瑰羞愧地低下了头。从此，她不再骄傲，学会了尊重每一个生命。'},
{t:'聪明的乌鸦',c:'一只乌鸦口渴了，它找到了一个水瓶，但水太深了，喝不到。\n\n乌鸦没有放弃。它想啊想，终于想到了一个办法——往瓶子里放石子。\n\n乌鸦一颗一颗地往瓶子里放石子，水面慢慢升高了。终于，它喝到了水。\n\n这个故事告诉我们：遇到困难不要放弃，只要肯动脑筋，总能找到解决办法。'},
{t:'蚂蚁和蝈蝈',c:'夏天，蚂蚁忙着储存食物。蝈蝈却在唱歌跳舞，嘲笑蚂蚁太傻了。\n\n冬天来了，蚂蚁在温暖的巢穴里享受着储存的食物。蝈蝈却饥寒交迫，无处可去。\n\n蝈蝈来到蚂蚁的家门口，请求帮助。蚂蚁说："夏天你在唱歌，现在可以继续唱啊。"\n\n蝈蝈羞愧地低下了头。蚂蚁最终还是给了蝈蝈一些食物，但告诉它：要未雨绸缪，不能只顾眼前。'},
{t:'狐狸和葡萄',c:'一只狐狸看到了高高的葡萄架上挂满了紫红色的葡萄。它馋得直流口水。\n\n狐狸跳啊跳，怎么也够不到葡萄。它累得气喘吁吁，只好放弃。\n\n离开时，狐狸回头说："这些葡萄一定是酸的，不好吃。"\n\n这个故事告诉我们：有些人得不到某样东西时，就会说那样东西不好。但事实上，不是东西不好，而是自己没有能力得到。'}
