<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财务比率计算器</title>
<meta name="description" content="财务比率计算器，企业财务指标分析和对比工具">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6;scroll-behavior:smooth}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:var(--text);font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.ratio-card{padding:12px;border-bottom:1px solid var(--border)}
.ratio-name{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.ratio-val{font-size:1.3rem;font-weight:700}
.ratio-desc{font-size:.75rem;color:var(--text2);margin-top:4px}
.ratio-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:600;margin-left:8px}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.table th{color:var(--text2);font-size:.85rem;font-weight:600}
.table tr:hover{background:rgba(59,130,246,.05)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:600px;max-height:80vh;overflow-y:auto}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;white-space:nowrap;color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:var(--text)}
.tab:hover:not(.active){background:var(--border)}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;border-radius:3px}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.grid-2,.grid-3{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="财务比率计算器">
<meta property="og:description" content="财务比率计算器，企业财务指标分析和对比工具">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/financial-ratio-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🧮 财务比率计算器';
const APP=document.getElementById('app');

const BENCHMARKS={
  currentRatio:{good:2,min:1,desc:'流动比率',optimal:'1.5-2.5'},
  quickRatio:{good:1,min:0.5,desc:'速动比率',optimal:'0.8-1.5'},
  cashRatio:{good:0.5,min:0.2,desc:'现金比率',optimal:'0.2-0.5'},
  roe:{good:15,min:5,desc:'净资产收益率',optimal:'15%-25%'},
  roa:{good:5,min:2,desc:'总资产收益率',optimal:'5%-10%'},
  grossMargin:{good:30,min:15,desc:'毛利率',optimal:'30%-50%'},
  netMargin:{good:10,min:3,desc:'净利率',optimal:'10%-20%'},
  debtToEquity:{good:1,min:2,desc:'资产负债率(低=好)',optimal:'<1.0'},
  interestCoverage:{good:5,min:2,desc:'利息保障倍数',optimal:'>5'},
  assetTurnover:{good:1,min:0.5,desc:'总资产周转率',optimal:'>1'},
  inventoryTurnover:{good:6,min:3,desc:'存货周转率',optimal:'6-12'},
  receivablesTurnover:{good:8,min:4,desc:'应收账款周转率',optimal:'8-12'},
  pe:{good:20,min:10,desc:'市盈率',optimal:'10-25'},
  pb:{good:3,min:1,desc:'市净率',optimal:'1-5'},
  ps:{good:3,min:1,desc:'市销率',optimal:'1-5'},
  evEbitda:{good:12,min:5,desc:'EV/EBITDA',optimal:'8-15'}
};

let companies=JSON.parse(localStorage.getItem('fr_data')||'[]');
let currentIdx=0;
let activeTab='liquidity';

function save(){localStorage.setItem('fr_data',JSON.stringify(companies))}

function getRating(key,val){
  if(val===null||val===undefined||isNaN(val))return{color:'var(--text2)',label:'—',bg:'transparent'};
  const b=BENCHMARKS[key];
  if(!b)return{color:'var(--text2)',label:'—',bg:'transparent'};
  if(key==='debtToEquity'){
    if(val<=b.good)return{color:'var(--green)',label:'优秀',bg:'rgba(63,185,80,.2)'};
    if(val<=b.min)return{color:'var(--yellow)',label:'一般',bg:'rgba(210,153,34,.2)'};
    return{color:'var(--red)',label:'偏高',bg:'rgba(248,81,73,.2)'};
  }
  if(val>=b.good)return{color:'var(--green)',label:'优秀',bg:'rgba(63,185,80,.2)'};
  if(val>=b.min)return{color:'var(--yellow)',label:'一般',bg:'rgba(210,153,34,.2)'};
  return{color:'var(--red)',label:'偏低',bg:'rgba(248,81,73,.2)'};
}

function calcRatios(c){
  const d=c.data;
  return{
    currentRatio:d.currentAssets/d.currentLiabilities||null,
    quickRatio:(d.currentAssets-d.inventory)/d.currentLiabilities||null,
    cashRatio:d.cash/d.currentLiabilities||null,
    roe:(d.netIncome/d.totalEquity)*100||null,
    roa:(d.netIncome/d.totalAssets)*100||null,
    grossMargin:((d.revenue-d.cogs)/d.revenue)*100||null,
    netMargin:(d.netIncome/d.revenue)*100||null,
    debtToEquity:d.totalDebt/d.totalEquity||null,
    interestCoverage:d.ebit/d.interestExpense||null,
    assetTurnover:d.revenue/d.totalAssets||null,
    inventoryTurnover:d.cogs/d.inventory||null,
    receivablesTurnover:d.revenue/d.accountsReceivable||null,
    pe:d.marketCap/d.netIncome||null,
    pb:d.marketCap/d.totalEquity||null,
    ps:d.marketCap/d.revenue||null,
    evEbitda:(d.marketCap+d.totalDebt-d.cash)/d.ebit||null
  };
}

const EMPTY_DATA={revenue:0,cogs:0,netIncome:0,totalAssets:0,totalEquity:0,totalDebt:0,currentAssets:0,currentLiabilities:0,inventory:0,cash:0,accountsReceivable:0,ebit:0,interestExpense:0,marketCap:0};

function showCompanyModal(editIdx){
  const c=editIdx!==undefined?companies[editIdx]:null;
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  const labels={revenue:'营业收入',cogs:'营业成本',netIncome:'净利润',totalAssets:'总资产',totalEquity:'股东权益',totalDebt:'总负债',currentAssets:'流动资产',currentLiabilities:'流动负债',inventory:'存货',cash:'现金及等价物',accountsReceivable:'应收账款',ebit:'EBIT(息税前利润)',interestExpense:'利息费用',marketCap:'市值'};
  let inputs='';
  Object.entries(labels).forEach(([k,v])=>{
    inputs+=`<label>${v} (万元)</label><input id="d_${k}" type="number" step="0.01" value="${c?c.data[k]||0:0}">`;
  });
  overlay.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">${c?'编辑':'添加'}公司</h3>
    <label>公司名称</label><input id="m_name" placeholder="如：贵州茅台" value="${c?c.name:''}">
    <div style="max-height:50vh;overflow-y:auto">${inputs}</div>
    <div class="flex" style="margin-top:16px"><button class="btn" onclick="saveCompany(${editIdx!==undefined?editIdx:'-1'})">保存</button><button class="btn btn-danger" onclick="this.closest('.modal-overlay').remove()">取消</button></div></div>`;
  document.body.appendChild(overlay);
}

function saveCompany(editIdx){
  const name=document.getElementById('m_name').value.trim();
  if(!name)return;
  const data={};
  Object.keys(EMPTY_DATA).forEach(k=>{data[k]=parseFloat(document.getElementById('d_'+k).value)||0});
  if(editIdx>=0){companies[editIdx]={...companies[editIdx],name,data}}
  else{companies.push({name,data})}
  save();document.querySelector('.modal-overlay').remove();
  currentIdx=companies.length-1;
  render();
}

function deleteCompany(idx){companies.splice(idx,1);if(currentIdx>=companies.length)currentIdx=Math.max(0,companies.length-1);save();render()}

function ratioBar(key,val){
  if(val===null||isNaN(val))return '';
  const b=BENCHMARKS[key];if(!b)return '';
  let pct;
  if(key==='debtToEquity'){pct=Math.min((val/3)*100,100)}
  else{pct=Math.min((val/(b.good*2))*100,100)}
  const r=getRating(key,val);
  return`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${r.color}"></div></div>`;
}

function render(){
  let h=`<h1>🧮 财务比率计算器</h1><p class="subtitle">企业财务指标分析和对比</p>`;

  if(companies.length===0){
    h+=`<div class="card"><div class="empty">暂无公司数据，点击下方按钮添加</div></div>`;
    h+=`<div style="text-align:center"><button class="btn" onclick="showCompanyModal()">+ 添加公司</button></div>`;
    APP.innerHTML=h;return;
  }

  const companyNames=companies.map((c,i)=>`<button class="btn btn-sm ${i===currentIdx?'':'btn-danger'}" onclick="currentIdx=${i};render()" style="${i===currentIdx?'background:var(--accent)':''}">${c.name}</button>`).join('');
  h+=`<div class="card"><div class="flex-between"><div class="flex" style="flex-wrap:wrap">${companyNames}</div><div class="flex"><button class="btn btn-sm" onclick="showCompanyModal()">+ 添加</button><button class="btn btn-sm btn-danger" onclick="deleteCompany(${currentIdx})">删除</button></div></div></div>`;

  if(companies.length===0||!companies[currentIdx])return;
  const c=companies[currentIdx];
  const ratios=calcRatios(c);

  const tabs=[
    {id:'liquidity',label:'流动性比率'},
    {id:'profitability',label:'盈利能力'},
    {id:'leverage',label:'杠杆比率'},
    {id:'efficiency',label:'运营效率'},
    {id:'valuation',label:'估值指标'},
    {id:'compare',label:'公司对比'}
  ];
  h+=`<div class="tabs">`;
  tabs.forEach(t=>{h+=`<div class="tab ${activeTab===t.id?'active':''}" onclick="activeTab='${t.id}';render()">${t.label}</div>`});
  h+=`</div>`;

  const groups={
    liquidity:['currentRatio','quickRatio','cashRatio'],
    profitability:['roe','roa','grossMargin','netMargin'],
    leverage:['debtToEquity','interestCoverage'],
    efficiency:['assetTurnover','inventoryTurnover','receivablesTurnover'],
    valuation:['pe','pb','ps','evEbitda']
  };

  if(activeTab!=='compare'){
    const keys=groups[activeTab]||[];
    h+=`<div class="card">`;
    keys.forEach(k=>{
      const b=BENCHMARKS[k];
      const val=ratios[k];
      const r=getRating(k,val);
      const display=val!==null&&!isNaN(val)?(k.includes('Margin')||k.includes('ROE')||k.includes('ROA')?val.toFixed(2)+'%':val.toFixed(2)):'—';
      h+=`<div class="ratio-card"><div class="flex-between"><div><div class="ratio-name">${b.desc}</div><div class="ratio-val" style="color:${r.color}">${display} <span class="ratio-badge" style="background:${r.bg};color:${r.color}">${r.label}</span></div><div class="ratio-desc">最优区间: ${b.optimal}</div></div></div>${ratioBar(k,val)}</div>`;
    });
    h+=`</div>`;
  }else{
    h+=`<div class="card"><h3 style="margin-bottom:12px">公司对比</h3>`;
    const compareKeys=['currentRatio','roe','roa','netMargin','debtToEquity','pe','pb'];
    h+=`<div style="overflow-x:auto"><table class="table"><thead><tr><th>指标</th>`;
    companies.forEach(c=>{h+=`<th>${c.name}</th>`});
    h+=`</tr></thead><tbody>`;
    compareKeys.forEach(k=>{
      const b=BENCHMARKS[k];
      h+=`<tr><td style="font-weight:600">${b.desc}</td>`;
      companies.forEach(cc=>{
        const r=calcRatios(cc);
        const val=r[k];
        const rating=getRating(k,val);
        const display=val!==null&&!isNaN(val)?(k.includes('Margin')||k.includes('ROE')||k.includes('ROA')?val.toFixed(2)+'%':val.toFixed(2)):'—';
        h+=`<td style="color:${rating.color}">${display}</td>`;
      });
      h+=`</tr>`;
    });
    h+=`</tbody></table></div></div>`;
  }

  h+=`<div style="text-align:center;margin-top:16px"><button class="btn" onclick="showCompanyModal(${currentIdx})">编辑 ${c.name} 数据</button></div>`;

  APP.innerHTML=h;
}

render();
</script>
</body>
</html>
