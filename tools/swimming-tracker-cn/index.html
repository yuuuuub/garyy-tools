<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏊 游泳追踪</title>
<meta name="description" content="游泳数据追踪器，记录泳姿、距离、用时，支持泳池计算器和速度统计">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.calc-result{font-size:2rem;font-weight:700;color:var(--accent);text-align:center;padding:16px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🏊 游泳追踪">
<meta property="og:description" content="游泳数据追踪器，记录泳姿、距离、用时">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/swimming-tracker-cn/">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏊 游泳追踪</h1><p>记录每一次划水，追踪游泳进步</p></div>

<div class="cd">
<div class="gr">
<div class="st"><div class="nm" id="totalDist">0</div><div class="lb">总距离(m)</div></div>
<div class="st"><div class="nm" id="avgSpeed" style="color:var(--success)">0</div><div class="lb">平均速度(m/min)</div></div>
<div class="st"><div class="nm" id="totalSwims" style="color:var(--warn)">0</div><div class="lb">游泳次数</div></div>
<div class="st"><div class="nm" id="weekDist" style="color:var(--danger)">0</div><div class="lb">本周距离(m)</div></div>
</div>
</div>

<div class="cd"><h2>泳池距离计算器</h2>
<div class="fr">
<div><label>泳池长度(m)</label><select id="poolLen"><option value="25">25米</option><option value="50">50米</option></select></div>
<div><label>趟数</label><input type="number" id="poolLaps" value="20" min="1"></div>
</div>
<div class="calc-result" id="poolResult">总计: 500m</div>
<div class="bg"><button onclick="usePoolCalc()">用此距离填入</button></div></div>

<div class="cd"><h2>记录游泳</h2>
<div class="fr">
<div><label>泳姿</label><select id="sStroke"><option>自由泳</option><option>蛙泳</option><option>仰泳</option><option>蝶泳</option><option>混合泳</option></select></div>
<div><label>距离(m)</label><input type="number" id="sDist" placeholder="1000"></div>
</div>
<div class="fr">
<div><label>用时(分钟)</label><input type="number" id="sMin" placeholder="30" min="1"></div>
<div><label>泳池长度(m)</label><select id="sPool"><option value="25">25米</option><option value="50">50米</option></select></div>
</div>
<div><label>日期</label><input type="date" id="sDate"></div>
<div class="bg"><button onclick="addSwim()">保存游泳</button></div></div>

<div class="cd"><h2>游泳记录</h2><div id="swimList" class="es">暂无记录</div>
<div class="bg"><button class="dng" onclick="clearSwims()">清空所有</button></div></div>
</div>
<script>
(function(){
var DB_KEY='swimming_tracker_cn';
var swims=JSON.parse(localStorage.getItem(DB_KEY)||'[]');
var today=function(){return new Date().toISOString().slice(0,10)};

window.updatePoolCalc=function(){
var len=parseInt(document.getElementById('poolLen').value);
var laps=parseInt(document.getElementById('poolLaps').value)||0;
document.getElementById('poolResult').textContent='总计: '+(len*laps)+'m';
};
document.getElementById('poolLaps').addEventListener('input',window.updatePoolCalc);

window.usePoolCalc=function(){
var len=parseInt(document.getElementById('poolLen').value);
var laps=parseInt(document.getElementById('poolLaps').value)||0;
document.getElementById('sDist').value=len*laps;
};

window.addSwim=function(){
var stroke=document.getElementById('sStroke').value;
var dist=parseInt(document.getElementById('sDist').value)||0;
var min=parseInt(document.getElementById('sMin').value)||0;
if(!dist||!min){alert('请填写距离和用时');return;}
var pool=document.getElementById('sPool').value;
var date=document.getElementById('sDate').value||today();
var speed=Math.round(dist/min);
swims.push({id:Date.now(),stroke:stroke,distance:dist,duration:min,pool:pool,date:date,speed:speed});
localStorage.setItem(DB_KEY,JSON.stringify(swims));
document.getElementById('sDist').value='';document.getElementById('sMin').value='';
render();
};

window.delSwim=function(id){swims=swims.filter(function(s){return s.id!==id});localStorage.setItem(DB_KEY,JSON.stringify(swims));render();};
window.clearSwims=function(){if(!confirm('确定清空所有？'))return;swims=[];localStorage.setItem(DB_KEY,JSON.stringify(swims));render();};

function render(){
var totalD=0,totalMin=0;
swims.forEach(function(s){totalD+=s.distance;totalMin+=s.duration;});
var avgSpeed=swims.length?Math.round(totalD/totalMin):0;
var now=new Date();var dow=now.getDay()||7;
var ws=new Date(now);ws.setDate(now.getDate()-dow+1);ws.setHours(0,0,0,0);
var weekD=0;swims.forEach(function(s){if(new Date(s.date)>=ws)weekD+=s.distance;});

document.getElementById('totalDist').textContent=totalD;
document.getElementById('avgSpeed').textContent=avgSpeed;
document.getElementById('totalSwims').textContent=swims.length;
document.getElementById('weekDist').textContent=weekD;

var el=document.getElementById('swimList');
if(!swims.length){el.innerHTML='<div class="es">暂无记录</div>';return;}
el.innerHTML=swims.slice().reverse().map(function(s){
return '<div class="li"><div style="flex:1"><strong>'+s.stroke+'</strong> <span class="tag">'+s.pool+'m池</span><br><span style="font-size:.8rem;color:var(--text2)">'+s.distance+'m · '+s.duration+'分钟 · 速度'+s.speed+'m/min · '+s.date+'</span></div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="delSwim('+s.id+')">✕</button></div>';
}).join('');
}
document.getElementById('sDate').value=today();
updatePoolCalc();render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
