<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧘 中医冥想指南</title>
<meta property="og:title" content="🧘 中医冥想指南">
<meta property="og:description" content="中医冥想功法，静坐、行禅、呼吸冥想等传统修心方法 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="中医冥想功法，静坐、行禅、呼吸冥想等传统修心方法">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧘</text></svg>">
<meta name="robots" content="index, follow">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}.tag.b{background:rgba(59,130,246,.15);color:var(--blue)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.detail{display:none}.detail.active{display:block}
.step{padding:10px;border-left:3px solid var(--accent);margin-bottom:8px;background:var(--bg);border-radius:0 8px 8px 0}
.step-num{font-weight:700;color:var(--accent);margin-right:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{padding:12px;background:var(--bg);border-radius:8px}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border)}
.log-date{color:var(--text2);font-size:.85rem}
.timer-display{font-size:3rem;font-weight:700;text-align:center;color:var(--accent);margin:20px 0;font-variant-numeric:tabular-nums}
.timer-circle{width:200px;height:200px;border-radius:50%;border:4px solid var(--border);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;position:relative}
.timer-circle.running{border-color:var(--accent);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(59,130,246,.3)}50%{transform:scale(1.05);box-shadow:0 0 20px 10px rgba(59,130,246,.1)}}
.duration-btns{display:flex;gap:8px;justify-content:center;margin:12px 0}
.dur-btn{padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text2);cursor:pointer;font-size:.85rem;transition:all .2s}
.dur-btn.active{background:var(--accent);color:white;border-color:var(--accent)}
.day-plan{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}
.day-item{padding:8px 4px;text-align:center;border:1px solid var(--border);border-radius:8px;font-size:.75rem}
.day-item.done{background:rgba(34,197,94,.15);border-color:var(--success)}
.day-item .day-name{font-weight:600;margin-bottom:4px}
.day-item .day-method{color:var(--text2);font-size:.65rem}
</style>
</head>
<body>
<div class="ctn">
<div class="hdr">
<h1>🧘 中医冥想指南</h1>
<p>静心养神，修身养性</p>
</div>

<div class="tab-bar" id="tabs">
<div class="tab active" data-tab="methods">冥想方法</div>
<div class="tab" data-tab="beginner">冥想入门</div>
<div class="tab" data-tab="timer">冥想计时</div>
<div class="tab" data-tab="record">冥想记录</div>
</div>

<div id="view-methods" class="detail active">
<div class="cd">
<h2>📋 冥想功法</h2>
<div id="method-list"></div>
</div>
<div class="cd" id="method-detail" style="display:none">
<h2 id="md-title">功法详情</h2>
<div id="md-content"></div>
</div>
</div>

<div id="view-beginner" class="detail">
<div class="cd">
<h2>🌱 七日入门计划</h2>
<div id="beginner-plan"></div>
</div>
<div class="cd">
<h2>💡 冥想要点</h2>
<div id="beginner-tips"></div>
</div>
</div>

<div id="view-timer" class="detail">
<div class="cd">
<h2>⏱️ 冥想计时</h2>
<div class="duration-btns" id="dur-btns"></div>
<div class="timer-circle" id="timer-circle">
<div class="timer-display" id="timer-display">00:00</div>
</div>
<div style="text-align:center">
<button onclick="toggleTimer()" id="timer-btn" style="min-width:120px">开始冥想</button>
<button class="sec" onclick="resetTimer()" style="margin-left:8px">重置</button>
</div>
<div id="timer-guide" style="margin-top:16px;text-align:center;color:var(--text2);font-size:.9rem"></div>
</div>
</div>

<div id="view-record" class="detail">
<div class="cd">
<h2>📊 冥想统计</h2>
<div class="stats">
<div class="stat"><div class="stat-num" id="total-sessions">0</div><div class="stat-label">总次数</div></div>
<div class="stat"><div class="stat-num" id="total-minutes">0</div><div class="stat-label">总分钟</div></div>
<div class="stat"><div class="stat-num" id="streak-days">0</div><div class="stat-label">连续天数</div></div>
</div>
</div>
<div class="cd">
<h2>📅 近期记录</h2>
<div id="recent-records"></div>
</div>
</div>
</div>

<script>
const methods = [
  {name:'静坐冥想',desc:'盘腿而坐，全身放松，排除杂念，专注于呼吸或内心观照。是中医最基础的冥想方法。',difficulty:'简单',duration:'10-30分钟',benefits:['安定心神','调节呼吸','平衡阴阳','培养内气'],steps:['选择安静环境，盘腿坐于垫上','脊柱自然挺直，双手放于膝上','轻轻闭眼，放松全身肌肉','专注于呼吸的出入','如有杂念，温和地将注意力拉回','持续练习10-30分钟']},
  {name:'行禅冥想',desc:'缓慢行走，专注于每一步的感受。通过行走的觉知来培养当下意识。',difficulty:'简单',duration:'15-30分钟',benefits:['动静结合','培养觉知','疏通经络','舒缓压力'],steps:['选择一段5-10米的平路','脱鞋，双脚交替缓慢行走','专注于脚底与地面的接触','配合自然呼吸','目光低垂，注视前方1-2米处','来回行走，保持正念']},
  {name:'站桩冥想',desc:'双脚站立不动，保持特定姿势，培养内气、增强下肢力量和身体稳定性。',difficulty:'中等',duration:'10-30分钟',benefits:['培养内气','稳定身心','增强下肢','疏通经络'],steps:['两脚平行站立，与肩同宽','膝盖微曲，臀部微坐','两臂环抱于胸前，如抱球状','全身放松，呼吸自然','意守丹田，排除杂念','初站5分钟，逐渐增加']},
  {name:'呼吸冥想',desc:'专注于呼吸的节奏和感受，通过调控呼吸来安定心神、调节脏腑功能。',difficulty:'简单',duration:'10-20分钟',benefits:['安定心神','调节脏腑','平衡自律神经','改善睡眠'],steps:['舒适坐姿，闭眼放松','自然呼吸几次，放松身体','将注意力集中在鼻尖','感受空气进出的温度变化','可配合数息法（数1-10循环）','保持10-20分钟']},
  {name:'观照冥想',desc:'以旁观者的角度观察自己的念头和情绪，不评判、不执着，培养内心的清明。',difficulty:'中等',duration:'15-30分钟',benefits:['增强觉知','减少执着','培养智慧','情绪管理'],steps:['舒适坐姿，闭眼放松','先做几次深呼吸','打开觉知，观察内心活动','念头升起时，只是观察，不跟随','情绪出现时，承认它的存在','保持平等心，不评判']},
  {name:'慈悲冥想',desc:'培养对自己和他人的慈悲心，通过观想慈爱的能量来净化心灵、和谐人际关系。',difficulty:'中等',duration:'15-20分钟',benefits:['培养慈悲','和谐关系','净化心灵','提升幸福感'],steps:['舒适坐姿，闭眼放松','先对自己发送善意："愿我平安快乐"','然后对亲人发送同样的善意','扩展到朋友、陌生人、甚至不喜欢的人','最后对一切众生发送慈悲','感受内心充满温暖和善意']},
  {name:'内观冥想',desc:'源自佛教禅修，系统地观察身体感受，培养对当下的觉知力，达到身心净化。',difficulty:'高级',duration:'30-60分钟',benefits:['深度觉知','身心净化','消除烦恼','提升智慧'],steps:['盘腿坐姿，脊柱挺直','将注意力从头到脚逐一扫描','观察每个部位的感受（冷热、酸麻等）','不评判感受的好坏','觉知感受的无常变化','持续30-60分钟']},
  {name:'导引冥想',desc:'结合中医经络理论，在冥想中引导气的运行，疏通经络、调和气血。',difficulty:'高级',duration:'20-40分钟',benefits:['疏通经络','调和气血','培养内气','强身健体'],steps:['盘腿坐姿，放松全身','意守下丹田（脐下三寸）','吸气时意想气从会阴沿督脉上升','呼气时意想气从百会沿任脉下降','小周天循环运行','持续20-40分钟']}
];

const beginnerDays = [
  {day:'第1天',method:'呼吸觉知',desc:'5分钟，只关注呼吸'},
  {day:'第2天',method:'身体扫描',desc:'10分钟，从头到脚放松'},
  {day:'第3天',method:'数息法',desc:'10分钟，数呼吸1-10循环'},
  {day:'第4天',method:'静坐观心',desc:'10分钟，观察内心活动'},
  {day:'第5天',method:'行禅入门',desc:'15分钟，缓慢行走觉知'},
  {day:'第6天',method:'慈悲冥想',desc:'15分钟，对自己和他人发送善意'},
  {day:'第7天',method:'综合练习',desc:'20分钟，结合以上方法'}
];

const tips = [
  {title:'姿势要点',content:'脊柱自然挺直，不要刻意挺胸。可以盘腿坐、跪坐或坐在椅子上，关键是保持舒适和警觉。'},
  {title:'呼吸方法',content:'不要刻意控制呼吸，让呼吸自然进行。只需观察呼吸的节奏和感受即可。'},
  {title:'杂念处理',content:'杂念是正常的，不要抗拒。当发现自己走神时，温和地将注意力拉回即可。'},
  {title:'时间选择',content:'清晨或睡前是较好的冥想时间。空腹或饭后1小时后练习为佳。'},
  {title:'循序渐进',content:'初学者从5-10分钟开始，不要急于求成。坚持比时长更重要。'},
  {title:'常见误区',content:'冥想不是"什么都不想"，而是"觉知自己在想什么"。不要追求特殊感受。'}
];

let timerDuration = 600;
let timerRemaining = 600;
let timerInterval = null;
let isTimerRunning = false;

function loadData() { return JSON.parse(localStorage.getItem('meditation-data') || '{"records":[]}'); }
function saveData(d) { localStorage.setItem('meditation-data', JSON.stringify(d)); }

function renderMethods() {
  document.getElementById('method-list').innerHTML = methods.map((m, i) => `
    <div class="li" onclick="showMethod(${i})">
      <div><strong>${m.name}</strong><br><span style="color:var(--text2);font-size:.85rem">${m.difficulty} · ${m.duration}</span></div>
      <span class="tag s">${m.benefits.length}种功效</span>
    </div>
  `).join('');
}

function showMethod(i) {
  const m = methods[i];
  document.getElementById('method-detail').style.display = 'block';
  document.getElementById('md-title').textContent = m.name;
  document.getElementById('md-content').innerHTML = `
    <p style="margin-bottom:12px;color:var(--text2)">${m.desc}</p>
    <div style="margin-bottom:8px"><span class="tag s">${m.difficulty}</span> <span class="tag w" style="margin-left:4px">${m.duration}</span></div>
    <div style="margin-bottom:12px"><strong>功效：</strong>${m.benefits.map(b => `<span class="tag s" style="margin:2px">${b}</span>`).join('')}</div>
    <div><strong>步骤：</strong>${m.steps.map((s, j) => `<div class="step"><span class="step-num">${j+1}.</span>${s}</div>`).join('')}</div>`;
}

function renderBeginner() {
  document.getElementById('beginner-plan').innerHTML = beginnerDays.map(d => `
    <div class="step"><span class="step-num">${d.day}</span><strong>${d.method}</strong> - ${d.desc}</div>
  `).join('');
  document.getElementById('beginner-tips').innerHTML = tips.map(t => `
    <div class="step"><span class="step-num">💡</span><strong>${t.title}</strong><br><span style="color:var(--text2);font-size:.85rem">${t.content}</span></div>
  `).join('');
}

// Timer
const durations = [300, 600, 900, 1200, 1800];
document.getElementById('dur-btns').innerHTML = durations.map(d => {
  const min = d / 60;
  return `<div class="dur-btn ${d === timerDuration ? 'active' : ''}" onclick="setDuration(${d})">${min}分钟</div>`;
}).join('');

function setDuration(d) {
  timerDuration = d;
  timerRemaining = d;
  document.querySelectorAll('.dur-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  updateTimerDisplay();
}

function toggleTimer() {
  if (isTimerRunning) {
    clearInterval(timerInterval);
    isTimerRunning = false;
    document.getElementById('timer-btn').textContent = '继续冥想';
    document.getElementById('timer-circle').classList.remove('running');
  } else {
    timerInterval = setInterval(() => {
      timerRemaining--;
      updateTimerDisplay();
      if (timerRemaining <= 0) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        document.getElementById('timer-btn').textContent = '开始冥想';
        document.getElementById('timer-circle').classList.remove('running');
        document.getElementById('timer-guide').textContent = '🎉 冥想完成！';
        recordSession();
      }
    }, 1000);
    isTimerRunning = true;
    document.getElementById('timer-btn').textContent = '暂停';
    document.getElementById('timer-circle').classList.add('running');
  }
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRemaining = timerDuration;
  isTimerRunning = false;
  document.getElementById('timer-btn').textContent = '开始冥想';
  document.getElementById('timer-circle').classList.remove('running');
  document.getElementById('timer-guide').textContent = '';
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const mins = Math.floor(timerRemaining / 60).toString().padStart(2, '0');
  const secs = (timerRemaining % 60).toString().padStart(2, '0');
  document.getElementById('timer-display').textContent = `${mins}:${secs}`;
}

function recordSession() {
  const data = loadData();
  data.records.push({
    date: new Date().toISOString().split('T')[0],
    duration: timerDuration,
    timestamp: Date.now()
  });
  saveData(data);
}

function renderRecord() {
  const data = loadData();
  const records = data.records;
  document.getElementById('total-sessions').textContent = records.length;
  document.getElementById('total-minutes').textContent = Math.floor(records.reduce((s, r) => s + r.duration, 0) / 60);

  const dates = [...new Set(records.map(r => r.date))].sort().reverse();
  let streak = 0;
  let checkDate = new Date();
  while (dates.includes(checkDate.toISOString().split('T')[0])) {
    streak++;
    checkDate.setDate(checkDate.getDate() - 1);
  }
  document.getElementById('streak-days').textContent = streak;

  const recent = records.slice(-7).reverse();
  document.getElementById('recent-records').innerHTML = recent.length ? recent.map(r => `
    <div class="log-item">
      <div><strong>${r.date}</strong><br><span class="log-date">${r.duration / 60}分钟</span></div>
      <span class="tag s">✓</span>
    </div>
  `).join('') : '<div class="empty">暂无记录</div>';
}

// Tabs
document.querySelectorAll('#tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'record') renderRecord();
  });
});

renderMethods();
renderBeginner();
updateTimerDisplay();
</script>
</body>
</html>
