<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>颜色匹配</title>
<meta name="description" content="颜色匹配游戏，训练你的色彩辨识和记忆能力">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:15px}
h1{font-size:1.5rem;margin-bottom:15px;color:#3b82f6}
.target{width:160px;height:160px;border-radius:16px;border:3px solid #30363d;margin-bottom:15px}
.slider-wrap{max-width:400px;width:100%;margin-bottom:10px}
.slider-label{display:flex;justify-content:space-between;font-size:0.85rem;color:#8b949e;margin-bottom:4px}
input[type=range]{width:100%;height:8px;-webkit-appearance:none;background:linear-gradient(90deg,#000,#f00,#ff0,#0f0,#0ff,#00f,#f0f);border-radius:4px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;background:#fff;border-radius:50%;border:2px solid #30363d;cursor:pointer}
.preview{display:flex;gap:15px;margin-bottom:15px;align-items:center}
.preview-box{width:100px;height:100px;border-radius:12px;border:2px solid #30363d}
.vs-text{font-size:1.2rem;color:#8b949e}
.score-display{font-size:1.1rem;margin:10px 0}
button{padding:10px 24px;border:none;background:#3b82f6;color:var(--text);border-radius:8px;cursor:pointer;font-size:1rem}
.hint{color:#8b949e;font-size:0.9rem;margin-top:8px}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="颜色匹配">
  <meta property="og:description" content="颜色匹配游戏，训练你的色彩辨识和记忆能力">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/color-match/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<h1>🎨 颜色匹配</h1>
<div class="target" id="target"></div>
<div class="preview">
<div class="preview-box" id="guess"></div>
<div class="vs-text">VS</div>
<div class="preview-box" id="target2"></div>
</div>
<div class="slider-wrap">
<div class="slider-label"><span>🔴 红 <span id="rv">128</span></span></div>
<input type="range" min="0" max="255" value="128" id="rSlider" oninput="updateGuess()">
</div>
<div class="slider-wrap">
<div class="slider-label"><span>🟢 绿 <span id="gv">128</span></span></div>
<input type="range" min="0" max="255" value="128" id="gSlider" oninput="updateGuess()">
</div>
<div class="slider-wrap">
<div class="slider-label"><span>🔵 蓝 <span id="bv">128</span></span></div>
<input type="range" min="0" max="255" value="128" id="bSlider" oninput="updateGuess()">
</div>
<div class="score-display">得分: <b id="score">0</b> | 最高: <b id="best">0</b></div>
<button onclick="submit()">确认匹配</button>
<button onclick="newColor()" style="margin-left:10px;background:#30363d">跳过</button>
<div class="hint" id="hint"></div>
<script>
let targetColor,targetR,targetG,targetB,score=0,best=0;

function newColor(){
  targetR=Math.floor(Math.random()*256);targetG=Math.floor(Math.random()*256);targetB=Math.floor(Math.random()*256);
  targetColor=`rgb(${targetR},${targetG},${targetB})`;
  document.getElementById('target').style.background=targetColor;
  document.getElementById('target2').style.background=targetColor;
  document.getElementById('rSlider').value=128;document.getElementById('gSlider').value=128;document.getElementById('bSlider').value=128;
  updateGuess();document.getElementById('hint').textContent='';
}

function updateGuess(){
  const r=document.getElementById('rSlider').value,g=document.getElementById('gSlider').value,b=document.getElementById('bSlider').value;
  document.getElementById('rv').textContent=r;document.getElementById('gv').textContent=g;document.getElementById('bv').textContent=b;
  document.getElementById('guess').style.background=`rgb(${r},${g},${b})`;
}

function submit(){
  const r=+document.getElementById('rSlider').value,g=+document.getElementById('gSlider').value,b=+document.getElementById('bSlider').value;
  const dist=Math.sqrt((r-targetR)**2+(g-targetG)**2+(b-targetB)**2);
  const maxDist=Math.sqrt(255**2*3);
  const similarity=Math.round((1-dist/maxDist)*100);
  score+=similarity;
  if(similarity>best)best=similarity;
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=best;

  let msg='';if(similarity>=95)msg='完美匹配！🎯';else if(similarity>=80)msg='非常接近！👏';else if(similarity>=60)msg='还不错 👌';else msg='差得远呢 😅';
  document.getElementById('hint').textContent=`相似度: ${similarity}% ${msg}`;
  setTimeout(newColor,1000);
}

newColor();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
