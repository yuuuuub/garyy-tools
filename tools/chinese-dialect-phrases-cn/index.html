-radius:8px;padding:14px;margin-bottom:8px;transition:all .2s}.phrase-card:hover{border-color:var(--blue)}.phrase-header{display:flex;justify-content:space-between;align-items:flex-start}.phrase-text{font-size:1.1rem;font-weight:600}.phrase-meaning{font-size:.9rem;color:var(--text2);margin-top:4px}.phrase-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.phrase-tag{padding:2px 8px;border-radius:10px;font-size:.7rem;background:rgba(59,130,246,.1);color:var(--blue)}.phrase-dialect-tag{background:rgba(35,134,54,.1);color:var(--green)}.phrase-phonetic{font-size:.8rem;color:var(--yellow);margin-top:4px}.phrase-actions{display:flex;gap:6px;margin-top:8px}.phrase-actions button{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer;font-size:.75rem;transition:all .2s}.phrase-actions button:hover{border-color:var(--blue);color:var(--blue)}.daily-box{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(234,179,8,.1));border:2px solid var(--blue);border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:16px}.daily-phrase{font-size:1.5rem;font-weight:700;margin:10px 0}.daily-meaning{font-size:1rem;color:var(--text2)}.daily-dialect{font-size:.85rem;color:var(--blue);margin-top:6px}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.fav-section{margin-top:16px}.fav-section h3{font-size:1rem;margin-bottom:10px}.empty-msg{text-align:center;color:var(--text2);font-size:.85rem;padding:20px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}</style><meta property="og:title" content="中国方言常用语"><meta property="og:description" content="中国方言常用语 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>"></head><body>

<div class="dialect-tabs" id="dialectTabs"><span class="dialect-tab active" onclick="selectDialect(this,'all')">全部方言</span><span class="dialect-tab" onclick="selectDialect(this,'粤语')">粤语</span><span class="dialect-tab" onclick="selectDialect(this,'四川话')">四川话</span><span class="dialect-tab" onclick="selectDialect(this,'上海话')">上海话</span><span class="dialect-tab" onclick="selectDialect(this,'闽南语')">闽南语</span><span class="dialect-tab" onclick="selectDialect(this,'东北话')">东北话</span><span class="dialect-tab" onclick="selectDialect(this,'河南话')">河南话</span><span class="dialect-tab" onclick="selectDialect(this,'山东话')">山东话</span><span class="dialect-tab" onclick="selectDialect(this,'湖南话')">湖南话</span></div>
<div class="cat-tabs" id="catTabs"><span class="cat-tab active" onclick="selectCat(this,'all')">全部分类</span><span class="cat-tab" onclick="selectCat(this,'问候')">👋 问候</span><span class="cat-tab" onclick="selectCat(this,'感谢')">🙏 感谢</span><span class="cat-tab" onclick="selectCat(this,'道歉')">😔 道歉</span><span class="cat-tab" onclick="selectCat(this,'餐饮')">🍜 餐饮</span><span class="cat-tab" onclick="selectCat(this,'购物')">🛒 购物</span><span class="cat-tab" onclick="selectCat(this,'问路')">🧭 问路</span><span class="cat-tab" onclick="selectCat(this,'数字')">🔢 数字</span><span class="cat-tab" onclick="selectCat(this,'感叹')">😲 感叹</span></div>
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索方言短语..." oninput="filterPhrases()"></div>
<div id="phraseList"></div>
<div class="fav-section"><h3>⭐ 我的收藏 <button class="btn btn-secondary" onclick="clearFavs()" style="font-size:.75rem;padding:4px 10px">清空</button></h3><div id="favList"></div></div></div>
<script src="../i18n.js" defer></script>
<script>
var phrases=[

{text:'唔该',dialect:'粤语',meaning:'谢谢/劳驾',phonetic:'m4 goi1',cat:'感谢'},
{text:'唔好意思',dialect:'粤语',meaning:'不好意思',phonetic:'m4 hou2 ji3 si3',cat:'道歉'},

{text:'好靓',dialect:'粤语',meaning:'很漂亮',phonetic:'hou2 leng3',cat:'感叹'},

{text:'杠杠的',dialect:'东北话',meaning:'非常好',phonetic:'gàng gàng de',cat:'感叹'},

{text:'晓得',dialect:'四川话',meaning:'知道',phonetic:'xiǎo dé',cat:'问候'},
{text:'不存在',dialect:'四川话',meaning:'没关系',phonetic:'bù cún zài',cat:'道歉'},

{text:'侬好',dialect:'上海话',meaning:'你好',phonetic:'nóng hǎo',cat:'问候'},

{text:'么',dialect:'山东话',meaning:'什么',phonetic:'me',cat:'问候'},
{text:'搞么子',dialect:'湖南话',meaning:'干什么',phonetic:'gǎo mó zǐ',cat:'问候'},
{text:'嬲',dialect:'湖南话',meaning:'生气',phonetic:'niǎo',cat:'感叹'},
{text:'呷饭',dialect:'湖南话',meaning:'吃饭',phonetic:'xiā fàn',cat:'餐饮'},
{text:'好恰',dialect:'湖南话',meaning:'好吃',phonetic:'hǎo qià',cat:'餐饮'},
{text:'蛮好',dialect:'湖南话',meaning:'很好',phonetic:'mán hǎo',cat:'感叹'},
{text:'过早',dialect:'武汉话',meaning:'吃早餐',phonetic:'guò zǎo',cat:'餐饮'},
{text:'搞么斯',dialect:'武汉话',meaning:'干什么',phonetic:'gǎo mó sī',cat:'问候'},
{text:'蛮扎实',dialect:'武汉话',meaning:'很厉害',phonetic:'mán zhā shi',cat:'感叹'}
];

var currentDialect='all',currentCat='all';
var favs=JSON.parse(localStorage.getItem('dialectFavs')||'[]');

function selectDialect(el,d){
  document.querySelectorAll('.dialect-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');currentDialect=d;filterPhrases();
}
function selectCat(el,c){
  document.querySelectorAll('.cat-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');currentCat=c;filterPhrases();
}

function filterPhrases(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=phrases.filter(function(p){
    if(currentDialect!=='all'&&p.dialect!==currentDialect)return false;
    if(currentCat!=='all'&&p.cat!==currentCat)return false;
    if(search&&!p.text.toLowerCase().includes(search)&&!p.meaning.toLowerCase().includes(search)&&!p.dialect.toLowerCase().includes(search))return false;
    return true;
  });
  renderPhrases(filtered);
}

function renderPhrases(items){
  if(!items.length){document.getElementById('phraseList').innerHTML='<div class="empty-msg">没有找到匹配的短语</div>';return}
  var h='';
  items.forEach(function(p,i){
    var idx=phrases.indexOf(p);
    var isFav=favs.indexOf(idx)!==-1;
    h+='<div class="phrase-card"><div class="phrase-header"><div><div class="phrase-text">'+p.text+'</div>';
    h+='<div class="phrase-meaning">普通话: '+p.meaning+'</div>';
    h+='<div class="phrase-phonetic">🔊 '+p.phonetic+'</div></div></div>';
    h+='<div class="phrase-meta"><span class="phrase-tag phrase-dialect-tag">'+p.dialect+'</span><span class="phrase-tag">'+p.cat+'</span></div>';
    h+='<div class="phrase-actions"><button onclick="copyPhrase(\''+p.text+' - '+p.meaning+'\')">📋 复制</button>';
    h+='<button onclick="toggleFav('+idx+')">'+(isFav?'💛 已收藏':'🤍 收藏')+'</button></div></div>';
  });
  document.getElementById('phraseList').innerHTML=h;
}

function copyPhrase(text){
  navigator.clipboard.writeText(text).then(function(){alert('已复制: '+text)}).catch(function(){alert('复制失败')});
}

function toggleFav(idx){
  var i=favs.indexOf(idx);
  if(i===-1)favs.push(idx);else favs.splice(i,1);
  localStorage.setItem('dialectFavs',JSON.stringify(favs));
  filterPhrases();renderFavs();
}

function clearFavs(){favs=[];localStorage.setItem('dialectFavs',JSON.stringify(favs));renderFavs();filterPhrases()}

function renderFavs(){
  var el=document.getElementById('favList');
  if(!favs.length){el.innerHTML='<div class="empty-msg">暂无收藏</div>';return}
  var h='';
  favs.forEach(function(idx){
    var p=phrases[idx];if(!p)return;
    h+='<div class="phrase-card"><div class="phrase-text">'+p.text+'</div><div class="phrase-meaning">'+p.meaning+' ('+p.dialect+')</div>';
    h+='<div class="phrase-actions"><button onclick="toggleFav('+idx+')">💔 取消收藏</button></div></div>';
  });
  el.innerHTML=h;
}

function showDaily(){
  var p=phrases[Math.floor(Math.random()*phrases.length)];
  document.getElementById('dailyPhrase').textContent=p.text;
  document.getElementById('dailyMeaning').textContent='含义: '+p.meaning;
  document.getElementById('dailyDialect').textContent=p.dialect+' · '+p.phonetic;
}

showDaily();filterPhrases();renderFavs();
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input');if(inp)inp.focus()}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur()}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0})</script>
