<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国古诗词</title><meta name="description" content="中国古诗词 - 在线查询欣赏中国古诗词"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.poem-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .2s}.poem-item:hover{transform:translateY(-2px)}.poem-title{font-size:1.2rem;font-weight:600;color:var(--blue);margin-bottom:8px}.poem-author{font-size:.9rem;color:var(--text2);margin-bottom:12px}.poem-content{font-size:1rem;line-height:1.8;white-space:pre-wrap}.poem-dynasty{font-size:.8rem;color:var(--green);margin-top:8px}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.85rem}.btn:hover{opacity:.85}.btn.active{background:var(--green)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

<div class="container"><h1>📜 中国古诗词</h1><p class="sub">在线查询欣赏中国古诗词</p>
<div class="card">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索诗词、作者..." oninput="filterPoems()">
</div>
<div class="btn-group">
<button class="btn active" onclick="filterByDynasty('all',this)">全部</button>
<button class="btn" onclick="filterByDynasty('唐',this)">唐代</button>
<button class="btn" onclick="filterByDynasty('宋',this)">宋代</button>
<button class="btn" onclick="filterByDynasty('元',this)">元代</button>
<button class="btn" onclick="filterByDynasty('明',this)">明代</button>
<button class="btn" onclick="filterByDynasty('清',this)">清代</button>
</div>
</div>
<div id="poemList"></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var poems=[
  {title:'静夜思',author:'李白',dynasty:'唐',content:'床前明月光，\n疑是地上霜。\n举头望明月，\n低头思故乡。'},
  {title:'春晓',author:'孟浩然',dynasty:'唐',content:'春眠不觉晓，\n处处闻啼鸟。\n夜来风雨声，\n花落知多少。'},
  {title:'登鹳雀楼',author:'王之涣',dynasty:'唐',content:'白日依山尽，\n黄河入海流。\n欲穷千里目，\n更上一层楼。'},
  {title:'悯农',author:'李绅',dynasty:'唐',content:'锄禾日当午，\n汗滴禾下土。\n谁知盘中餐，\n粒粒皆辛苦。'},
  {title:'望庐山瀑布',author:'李白',dynasty:'唐',content:'日照香炉生紫烟，\n遥看瀑布挂前川。\n飞流直下三千尺，\n疑是银河落九天。'},
  {title:'江雪',author:'柳宗元',dynasty:'唐',content:'千山鸟飞绝，\n万径人踪灭。\n孤舟蓑笠翁，\n独钓寒江雪。'},
  {title:'枫桥夜泊',author:'张继',dynasty:'唐',content:'月落乌啼霜满天，\n江枫渔火对愁眠。\n姑苏城外寒山寺，\n夜半钟声到客船。'},
  {title:'游子吟',author:'孟郊',dynasty:'唐',content:'慈母手中线，\n游子身上衣。\n临行密密缝，\n意恐迟迟归。\n谁言寸草心，\n报得三春晖。'},
  {title:'出塞',author:'王昌龄',dynasty:'唐',content:'秦时明月汉时关，\n万里长征人未还。\n但使龙城飞将在，\n不教胡马度阴山。'},
  {title:'凉州词',author:'王翰',dynasty:'唐',content:'葡萄美酒夜光杯，\n欲饮琵琶马上催。\n醉卧沙场君莫笑，\n古来征战几人回。'},
  {title:'水调歌头',author:'苏轼',dynasty:'宋',content:'明月几时有？把酒问青天。\n不知天上宫阙，今夕是何年。\n我欲乘风归去，又恐琼楼玉宇，\n高处不胜寒。\n起舞弄清影，何似在人间。\n\n转朱阁，低绮户，照无眠。\n不应有恨，何事长向别时圆？\n人有悲欢离合，月有阴晴圆缺，\n此事古难全。\n但愿人长久，千里共婵娟。'},
  {title:'念奴娇·赤壁怀古',author:'苏轼',dynasty:'宋',content:'大江东去，浪淘尽，千古风流人物。\n故垒西边，人道是，三国周郎赤壁。\n乱石穿空，惊涛拍岸，卷起千堆雪。\n江山如画，一时多少豪杰。\n\n遥想公瑾当年，小乔初嫁了，雄姿英发。\n羽扇纶巾，谈笑间，樯橹灰飞烟灭。\n故国神游，多情应笑我，早生华发。\n人生如梦，一尊还酹江月。'},
  {title:'虞美人',author:'李煜',dynasty:'五代',content:'春花秋月何时了？往事知多少。\n小楼昨夜又东风，故国不堪回首月明中。\n\n雕栏玉砌应犹在，只是朱颜改。\n问君能有几多愁？恰似一江春水向东流。'},
  {title:'如梦令',author:'李清照',dynasty:'宋',content:'昨夜雨疏风骤，浓睡不消残酒。\n试问卷帘人，却道海棠依旧。\n知否，知否？应是绿肥红瘦。'},
  {title:'声声慢',author:'李清照',dynasty:'宋',content:'寻寻觅觅，冷冷清清，凄凄惨惨戚戚。\n乍暖还寒时候，最难将息。\n三杯两盏淡酒，怎敌他、晚来风急！\n雁过也，正伤心，却是旧时相识。\n\n满地黄花堆积，憔悴损，如今有谁堪摘？\n守着窗儿，独自怎生得黑！\n梧桐更兼细雨，到黄昏、点点滴滴。\n这次第，怎一个愁字了得！'}
];
var currentDynasty='all';
function renderPoems(poemsToShow){
  var list=document.getElementById('poemList');
  var html='';
  poemsToShow.forEach(function(poem,index){
    html+='<div class="poem-item" onclick="showPoemDetail('+index+')">';
    html+='<div class="poem-title">'+poem.title+'</div>';
    html+='<div class="poem-author">作者：'+poem.author+'</div>';
    html+='<div class="poem-content">'+poem.content.substring(0,50)+'...</div>';
    html+='<div class="poem-dynasty">朝代：'+poem.dynasty+'</div>';
    html+='</div>';
  });
  list.innerHTML=html;
}
function filterPoems(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=poems.filter(function(poem){
    var matchSearch=poem.title.toLowerCase().includes(search)||poem.author.toLowerCase().includes(search)||poem.content.toLowerCase().includes(search);
    var matchDynasty=currentDynasty==='all'||poem.dynasty===currentDynasty;
    return matchSearch&&matchDynasty;
  });
  renderPoems(filtered);
}
function filterByDynasty(dynasty,btn){
  currentDynasty=dynasty;
  document.querySelectorAll('.btn-group .btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterPoems();
}
function showPoemDetail(index){
  var poem=poems[index];
  var r=document.getElementById('result');
  var html='<div class="card">';
  html+='<div class="poem-title" style="font-size:1.5rem;text-align:center;margin-bottom:16px">'+poem.title+'</div>';
  html+='<div class="poem-author" style="text-align:center;font-size:1.1rem;margin-bottom:20px">'+poem.author+' ('+poem.dynasty+'代)</div>';
  html+='<div class="poem-content" style="font-size:1.2rem;line-height:2;text-align:center;white-space:pre-wrap">'+poem.content+'</div>';
  html+='</div>';
  r.innerHTML=html;
  r.scrollIntoView({behavior:'smooth'});
}
renderPoems(poems);

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script></body></html>
