<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国书法生成器</title><meta name="description" content="中国书法生成器 - 在线生成各种书体的书法作品，支持楷书、行书、草书、隶书、篆书"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select,.input-group textarea{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--blue);outline:none}.input-group textarea{min-height:80px;font-family:monospace;font-size:.85rem;resize:vertical}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.calligraphy-canvas{background:#f5f5f0;border:1px solid var(--border);border-radius:8px;padding:20px;min-height:300px;display:flex;align-items:center;justify-content:center;position:relative;margin-top:16px}.seal{width:60px;height:60px;border:2px solid #8B0000;border-radius:4px;padding:8px;color:#8B0000;font-size:1rem;line-height:1.2;text-align:center;position:absolute;bottom:10px;right:10px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="中国书法生成器"><meta property="og:description" content="中国书法生成器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖌️</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🖌️ 中国书法生成器</h1><p class="sub">在线生成各种书体的书法作品</p>
<div class="card">
<div class="input-group"><label>输入文字</label><textarea id="textInput" placeholder="输入要生成书法的文字..."></textarea></div>
<div class="input-group"><label>选择书体</label><select id="styleSelect"><option value="kaishu">楷书</option><option value="xingshu">行书</option><option value="caoshu">草书</option><option value="lishu">隶书</option><option value="zhuanshu">篆书</option><option value="songti">宋体</option><option value="heiti">黑体</option></select></div>
<div class="input-group"><label>字体大小</label><select id="sizeSelect"><option value="small">小号</option><option value="medium" selected>中号</option><option value="large">大号</option><option value="xlarge">特大号</option></select></div>
<div class="input-group"><label>文字颜色</label><select id="colorSelect"><option value="#000000">黑色</option><option value="#8B0000">朱砂红</option><option value="#006400">墨绿</option><option value="#00008B">靛蓝</option><option value="#4B0082">紫色</option><option value="#8B4513">棕色</option></select></div>
<div class="input-group"><label>背景颜色</label><select id="bgSelect"><option value="#f5f5f0">宣纸色</option><option value="#ffffff">白色</option><option value="#f4e4bc">仿古色</option><option value="#1a1a2e">深色</option></select></div>
<div style="display:flex;gap:16px;margin-bottom:12px"><label><input type="checkbox" id="verticalLayout"> 竖排布局</label><label><input type="checkbox" id="sealStamp" checked> 添加印章</label><label><input type="checkbox" id="watermark"> 添加水印</label></div>
<button class="btn" onclick="generate()">生成书法</button>
<button class="btn" onclick="randomText()" style="background:var(--green)">随机文字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var fonts={kaishu:'"楷体","KaiTi","STKaiti",serif',xingshu:'"行楷","STXingkai","华文行楷",cursive',caoshu:'"草书","STCaiyun","华文草书",cursive',lishu:'"隶书","LiSu","STLiti",serif',zhuanshu:'"篆书","STZhuan","方正小篆体",serif',songti:'"宋体","SimSun","STSong",serif',heiti:'"黑体","SimHei","STHeiti",sans-serif'};
var names={kaishu:'楷书',xingshu:'行书',caoshu:'草书',lishu:'隶书',zhuanshu:'篆书',songti:'宋体',heiti:'黑体'};
var sizes={small:'2.5rem',medium:'4rem',large:'6rem',xlarge:'8rem'};
var randoms=['宁静致远','厚德载物','自强不息','上善若水','天道酬勤','海纳百川','有容乃大','大道至简','知行合一','止于至善','心如止水','虚怀若竹','临危不惧','从容不迫','宠辱不惊','春华秋实','云淡风轻','淡泊明志','见贤思齐','温故知新','学而不厌','诲人不倦','三人行必有我师','己所不欲勿施于人'];
function generate(){
var t=document.getElementById('textInput').value.trim();
if(!t){alert('请输入文字');return}
var s=document.getElementById('styleSelect').value;
var sz=document.getElementById('sizeSelect').value;
var c=document.getElementById('colorSelect').value;
var bg=document.getElementById('bgSelect').value;
var v=document.getElementById('verticalLayout').checked;
var seal=document.getElementById('sealStamp').checked;
var wm=document.getElementById('watermark').checked;
var html='<div class="card"><div class="calligraphy-canvas" style="background:'+bg+';min-height:400px;flex-direction:'+(v?'column':'row')+'">';
html+='<div style="font-family:'+fonts[s]+';font-size:'+sizes[s]+';color:'+c+';writing-mode:'+(v?'vertical-rl':'horizontal-tb')+';line-height:1.8;letter-spacing:0.1em;white-space:pre-wrap">'+t+'</div>';
if(seal) html+='<div class="seal">印</div>';
if(wm) html+='<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:2rem;color:rgba(0,0,0,0.05);pointer-events:none;font-family:'+fonts[s]+'">水印文字</div>';
html+='</div>';
html+='<div style="text-align:center;margin-top:12px;color:var(--text2);font-size:.85rem">书体：'+names[s]+' | 字数：'+t.length+'字</div>';
html+='<div style="text-align:center;margin-top:12px"><button class="btn" onclick="download()">下载图片</button><button class="btn" onclick="copyText()" style="background:var(--green)">复制文字</button></div></div>';
document.getElementById('result').innerHTML=html;
}
function randomText(){document.getElementById('textInput').value=randoms[Math.floor(Math.random()*randoms.length)];generate()}
function download(){var el=document.querySelector('.calligraphy-canvas');if(!el)return;var c=document.createElement('canvas');c.width=800;c.height=600;var ctx=c.getContext('2d');ctx.fillStyle='#f5f5f0';ctx.fillRect(0,0,800,600);ctx.fillStyle='#000';ctx.font='48px KaiTi';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(document.getElementById('textInput').value||'书法',400,300);var a=document.createElement('a');a.download='calligraphy.png';a.href=c.toDataURL('image/png');a.click()}
function copyText(){var t=document.getElementById('textInput').value;if(!t)return;navigator.clipboard.writeText(t).then(()=>alert('已复制')).catch(()=>alert('复制失败'))}
generate();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
