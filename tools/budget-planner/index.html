<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月度预算规划器</title>
<meta name="description" content="月度预算规划器，合理分配收入制定支出计划">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus{outline:none;border-color:var(--blue)}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-sm{background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;font-size:.78rem}
.btn-sm:hover{border-color:var(--blue);color:var(--blue)}
.btn-danger{background:var(--red);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s}
.btn-danger:hover{opacity:.85}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.result-big{text-align:center;padding:14px}
.result-big .label{font-size:.8rem;color:var(--text2)}
.result-big .value{font-size:1.8rem;font-weight:700}
.budget-card{padding:14px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px}
.budget-card .header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.budget-card .cat-name{font-size:.9rem;font-weight:600}
.budget-card .cat-amount{font-size:.9rem;font-weight:700}
.budget-card .cat-amount.need{color:var(--red)}
.budget-card .cat-amount.want{color:var(--gold)}
.budget-card .cat-amount.save{color:var(--green)}
.budget-card .cat-amount.over{color:var(--red)}
.budget-card .cat-detail{font-size:.78rem;color:var(--text2);margin-bottom:4px}
.budget-card .bar-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.budget-card .bar-fill{height:100%;border-radius:3px;transition:width .5s}
.budget-card .bar-fill.need{background:var(--red)}
.budget-card .bar-fill.want{background:var(--gold)}
.budget-card .bar-fill.save{background:var(--green)}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.pie-legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
.pie-legend-item{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--text2)}
.pie-legend-dot{width:12px;height:12px;border-radius:4px}
.custom-item{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.custom-item input[type=text]{flex:1}
.custom-item input[type=number]{width:120px}
.custom-item .remove-btn{cursor:pointer;color:var(--text2);font-size:1.2rem;line-height:1}
.custom-item .remove-btn:hover{color:var(--red)}
.progress-ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--red) 0deg, var(--gold) 0deg, var(--green) 0deg);margin:10px auto;position:relative}
.progress-ring .inner{position:absolute;top:10px;left:10px;right:10px;bottom:10px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.progress-ring .inner .pct{font-size:1.5rem;font-weight:700}
.progress-ring .inner .pct-label{font-size:.7rem;color:var(--text2)}
.actions{display:flex;gap:8px;justify-content:center;margin-top:12px}
@media(max-width:640px){.form-row{flex-direction:column}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="月度预算规划器">
  <meta property="og:description" content="月度预算规划器，合理分配收入制定支出计划">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/budget-planner/">
</head>
<body>
<div class="container">
  <header>
    <h1>📝 月度预算规划</h1>
    <p>50/30/20预算法则</p>
  </header>

  <div class="card">
    <div class="form-row">
      <div class="group">
        <label>月收入 (元)</label>
        <input type="number" id="monthlyIncome" value="15000" min="0" step="any">
      </div>
    </div>
  </div>

  <div id="overviewCard" class="card">
    <div class="section-title">📊 预算概览</div>
    <div id="overviewContent"></div>
  </div>

  <div class="card">
    <div class="section-title">💳 预算分配</div>
    <div id="budgetAllocation"></div>
  </div>

  <div class="card">
    <div class="section-title">✏️ 自定义调整</div>
    <p style="font-size:.78rem;color:var(--text2);margin-bottom:10px">可手动调整各分类金额，或添加自定义分类</p>
    <div id="customCategories"></div>
    <button class="btn btn-sm" id="addCategoryBtn" style="margin-top:8px">+ 添加自定义分类</button>
    <div class="actions">
      <button class="btn" id="saveBtn">保存预算</button>
      <button class="btn-danger" id="resetBtn">重置</button>
    </div>
    <div id="saveStatus" style="text-align:center;font-size:.78rem;color:var(--green);margin-top:6px"></div>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const incomeInp = $('monthlyIncome');
const overviewContent = $('overviewContent');
const budgetAllocation = $('budgetAllocation');
const customCategories = $('customCategories');
const addCategoryBtn = $('addCategoryBtn');
const saveBtn = $('saveBtn');
const resetBtn = $('resetBtn');
const saveStatus = $('saveStatus');
const STORAGE_KEY = 'budget-planner-data';
const defaultNeeds = [
  {name:'房租/房贷', pct:30},
  {name:'伙食费', pct:10},
  {name:'交通', pct:5},
  {name:'水电煤', pct:3},
  {name:'保险', pct:2}
];
const defaultWants = [
  {name:'娱乐', pct:10},
  {name:'购物', pct:8},
  {name:'餐饮外食', pct:5},
  {name:'旅行', pct:5},
  {name:'其他消费', pct:2}
];
const defaultSaves = [
  {name:'储蓄/投资', pct:10},
  {name:'应急基金', pct:5},
  {name:'退休金', pct:5}
];
let state = {};
function loadState(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{
      state = JSON.parse(saved);
      incomeInp.value = state.income || 15000;
      return;
    }catch(e){}
  }
  state = {
    income: 15000,
    needs: defaultNeeds.map(n => ({...n})),
    wants: defaultWants.map(n => ({...n})),
    saves: defaultSaves.map(n => ({...n})),
    custom: []
  };
}
function saveState(){
  state.income = parseFloat(incomeInp.value) || 0;
  const data = {
    income: state.income,
    needs: collectCategory('need'),
    wants: collectCategory('want'),
    saves: collectCategory('save'),
    custom: state.custom
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  state = data;
  saveStatus.textContent = '已保存 ' + new Date().toLocaleTimeString();
  setTimeout(() => { saveStatus.textContent = ''; }, 2000);
}
function collectCategory(type){
  const items = [];
  customCategories.querySelectorAll(`.custom-item[data-type="${type}"]`).forEach(el => {
    const name = el.querySelector('.cat-name-input').value.trim();
    const pct = parseFloat(el.querySelector('.cat-pct-input').value) || 0;
    if(name && pct > 0) items.push({name, pct});
  });
  return items;
}
function renderCustomCategories(){
  const all = [
    {label:'必要支出 (需)', type:'need', color:'var(--red)', data:state.needs},
    {label:'可选支出 (欲)', type:'want', color:'var(--gold)', data:state.wants},
    {label:'储蓄投资 (储)', type:'save', color:'var(--green)', data:state.saves}
  ];
  let html = '';
  all.forEach(g => {
    html += `<div style="margin-bottom:10px"><div style="font-size:.8rem;color:${g.color};margin-bottom:4px;font-weight:600">${g.label}</div>`;
    g.data.forEach(item => {
      html += renderCustomItem(g.type, item.name, item.pct);
    });
    html += '</div>';
  });
  if(state.custom && state.custom.length > 0){
    html += `<div style="margin-bottom:10px"><div style="font-size:.8rem;color:var(--blue);margin-bottom:4px;font-weight:600">自定义</div>`;
    state.custom.forEach(item => {
      html += renderCustomItem('custom', item.name, item.pct);
    });
    html += '</div>';
  }
  customCategories.innerHTML = html;
  customCategories.querySelectorAll('.remove-cat').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      const type = el.dataset.type;
      if(type === 'need') state.needs.splice(idx, 1);
      else if(type === 'want') state.wants.splice(idx, 1);
      else if(type === 'save') state.saves.splice(idx, 1);
      else if(type === 'custom') state.custom.splice(idx, 1);
      renderCustomCategories();
      calc();
    });
  });
}
function renderCustomItem(type, name, pct){
  const idx = customCategories.querySelectorAll(`.custom-item[data-type="${type}"]`).length;
  return `<div class="custom-item" data-type="${type}">
    <input type="text" class="cat-name-input" value="${name}" placeholder="名称">
    <input type="number" class="cat-pct-input" value="${pct}" min="0" max="100" step="0.5" style="width:80px">
    <span style="font-size:.78rem;color:var(--text2);min-width:20px">%</span>
    <span class="remove-cat" data-idx="${idx}" data-type="${type}" style="cursor:pointer;color:var(--text2);font-size:1.1rem">&times;</span>
  </div>`;
}
function calc(){
  const income = parseFloat(incomeInp.value) || 0;
  const needs = [];
  const wants = [];
  const saves = [];
  customCategories.querySelectorAll('.custom-item').forEach(el => {
    const type = el.dataset.type;
    const name = el.querySelector('.cat-name-input').value.trim();
    const pct = parseFloat(el.querySelector('.cat-pct-input').value) || 0;
    if(!name) return;
    const amount = income * pct / 100;
    if(type === 'need') needs.push({name, pct, amount});
    else if(type === 'want') wants.push({name, pct, amount});
    else if(type === 'save') saves.push({name, pct, amount});
  });
  const needsTotal = needs.reduce((s, n) => s + n.pct, 0);
  const wantsTotal = wants.reduce((s, n) => s + n.pct, 0);
  const savesTotal = saves.reduce((s, n) => s + n.pct, 0);
  const totalPct = needsTotal + wantsTotal + savesTotal;
  const recNeed = 50, recWant = 30, recSave = 20;
  const needAmount = income * needsTotal / 100;
  const wantAmount = income * wantsTotal / 100;
  const saveAmount = income * savesTotal / 100;
  const needPctReal = totalPct > 0 ? (needsTotal / totalPct * 100) : 0;
  const wantPctReal = totalPct > 0 ? (wantsTotal / totalPct * 100) : 0;
  const savePctReal = totalPct > 0 ? (savesTotal / totalPct * 100) : 0;
  const needDeg = needPctReal * 3.6;
  const wantDeg = needDeg + wantPctReal * 3.6;
  overviewContent.innerHTML = `
    <div class="result-big">
      <div class="label">月收入</div>
      <div class="value" style="color:var(--gold)">¥${income.toLocaleString()}</div>
    </div>
    <div style="text-align:center">
      <div class="progress-ring" style="background:conic-gradient(var(--red) 0deg ${needDeg}deg, var(--gold) ${needDeg}deg ${wantDeg}deg, var(--green) ${wantDeg}deg 360deg)">
        <div class="inner">
          <div class="pct">${totalPct.toFixed(0)}%</div>
          <div class="pct-label">已分配</div>
        </div>
      </div>
    </div>
    <div class="pie-legend">
      <div class="pie-legend-item"><span class="pie-legend-dot" style="background:var(--red)"></span>必要 ${needsTotal.toFixed(0)}%</div>
      <div class="pie-legend-item"><span class="pie-legend-dot" style="background:var(--gold)"></span>可选 ${wantsTotal.toFixed(0)}%</div>
      <div class="pie-legend-item"><span class="pie-legend-dot" style="background:var(--green)"></span>储蓄 ${savesTotal.toFixed(0)}%</div>
    </div>
    <div style="font-size:.78rem;color:var(--text2);text-align:center">推荐比例: 必要50% | 可选30% | 储蓄20%</div>
  `;
  let allocHtml = '';
  allocHtml += `<div class="budget-card">
    <div class="header-row">
      <span class="cat-name" style="color:var(--red)">🏠 必要支出 (${needsTotal.toFixed(0)}%)</span>
      <span class="cat-amount need">¥${needAmount.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span>
    </div>
    <div class="bar-track"><div class="bar-fill need" style="width:${Math.min(100, needsTotal/recNeed*100)}%"></div></div>
    <div style="font-size:.72rem;color:var(--text2);margin-top:4px">推荐 ${recNeed}% | 超预算需关注</div>
    ${needs.map(n => `<div class="cat-detail">${n.name}: ${n.pct}% = ¥${n.amount.toLocaleString('zh-CN',{minimumFractionDigits:2})}</div>`).join('')}
  </div>`;
  allocHtml += `<div class="budget-card">
    <div class="header-row">
      <span class="cat-name" style="color:var(--gold)">🎮 可选支出 (${wantsTotal.toFixed(0)}%)</span>
      <span class="cat-amount want">¥${wantAmount.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span>
    </div>
    <div class="bar-track"><div class="bar-fill want" style="width:${Math.min(100, wantsTotal/recWant*100)}%"></div></div>
    <div style="font-size:.72rem;color:var(--text2);margin-top:4px">推荐 ${recWant}% | 可适度压缩</div>
    ${wants.map(n => `<div class="cat-detail">${n.name}: ${n.pct}% = ¥${n.amount.toLocaleString('zh-CN',{minimumFractionDigits:2})}</div>`).join('')}
  </div>`;
  allocHtml += `<div class="budget-card">
    <div class="header-row">
      <span class="cat-name" style="color:var(--green)">💰 储蓄投资 (${savesTotal.toFixed(0)}%)</span>
      <span class="cat-amount save">¥${saveAmount.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span>
    </div>
    <div class="bar-track"><div class="bar-fill save" style="width:${Math.min(100, savesTotal/recSave*100)}%"></div></div>
    <div style="font-size:.72rem;color:var(--text2);margin-top:4px">推荐 ${recSave}% | 越高越安心</div>
    ${saves.map(n => `<div class="cat-detail">${n.name}: ${n.pct}% = ¥${n.amount.toLocaleString('zh-CN',{minimumFractionDigits:2})}</div>`).join('')}
  </div>`;
  allocHtml += `<div style="text-align:center;font-size:.78rem;color:var(--text2);padding-top:8px;border-top:1px solid var(--border);margin-top:8px">
    总计分配: ${totalPct.toFixed(1)}% | 未分配: ${(100 - totalPct).toFixed(1)}%
    ${totalPct < 100 ? '<span style="color:var(--gold)"> (建议将剩余加入储蓄)</span>' : ''}
    ${totalPct > 100 ? '<span style="color:var(--red)"> (超出100%，请调整)</span>' : ''}
  </div>`;
  budgetAllocation.innerHTML = allocHtml;
}
addCategoryBtn.addEventListener('click', () => {
  if(!state.custom) state.custom = [];
  state.custom.push({name:'自定义', pct:5});
  renderCustomCategories();
  calc();
});
saveBtn.addEventListener('click', saveState);
resetBtn.addEventListener('click', () => {
  if(confirm('确认重置所有预算数据？')){
    localStorage.removeItem(STORAGE_KEY);
    state = {
      income: 15000,
      needs: defaultNeeds.map(n => ({...n})),
      wants: defaultWants.map(n => ({...n})),
      saves: defaultSaves.map(n => ({...n})),
      custom: []
    };
    incomeInp.value = 15000;
    renderCustomCategories();
    calc();
    saveStatus.textContent = '已重置';
  }
});
incomeInp.addEventListener('input', calc);
incomeInp.addEventListener('change', calc);
loadState();
renderCustomCategories();
calc();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
