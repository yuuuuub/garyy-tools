  container.innerHTML = html;

  container.querySelectorAll('.preset-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      container.querySelectorAll('.preset-tag').forEach(t => t.classList.remove('active'));
      tag.classList.add('active');
      loadProduct(tag.dataset.id);
    });
  });
}

// ========== 搜索 ==========
function searchProduct(query) {
  const q = query.trim().toLowerCase();
  if (!q) return;
  // 模糊匹配
  let match = null;
  for (const [id, p] of Object.entries(products)) {
    if (p.name.toLowerCase().includes(q) || p.category.includes(q)) {
      match = id; break;
    }
  }
  if (match) {
    document.querySelectorAll('.preset-tag').forEach(t => t.classList.remove('active'));
    const tag = document.querySelector(`.preset-tag[data-id="${match}"]`);
    if (tag) tag.classList.add('active');
    loadProduct(match);
  } else {
    garyyToast('未找到相关商品，请尝试搜索 "手机"、"耳机"、"冰箱" 等关键词，或点击下方预设商品。');
  }
}

// ========== 加载商品 ==========
function loadProduct(productId) {
  const p = products[productId];
  if (!p) return;
  currentProduct = p;
  alertPrice = null;

  document.getElementById('emptyState').style.display = 'none';
  const container = document.getElementById('productInfo');

  const adviceClass = p.advice.type === 'buy' ? 'advice-buy' : p.advice.type === 'wait' ? 'advice-wait' : 'advice-no';

  const platformRows = p.prices.platforms.map(pl => {
    const trendClass = pl.trend === 'down' ? 'trend-down' : pl.trend === 'up' ? 'trend-up' : 'trend-flat';
    const trendArrow = pl.trend === 'down' ? '\u2193' : pl.trend === 'up' ? '\u2191' : '\u2192';
    return `<div class="compare-row">
      <span class="compare-platform">${pl.name}</span>
      <div>
        <span class="compare-price">&yen;${pl.price.toLocaleString()}</span>
        <span class="compare-trend ${trendClass}">${trendArrow} ${pl.diff}</span>
      </div>
    </div>`;
  }).join('');

  // 常售价区间范围计算
  const rangeTotal = p.range.max - p.range.min;
  const rangeFillLeft = ((p.range.commonLow - p.range.min) / rangeTotal) * 100;
  const rangeFillWidth = ((p.range.commonHigh - p.range.commonLow) / rangeTotal) * 100;
  const currMarkerPos = ((p.prices.current - p.range.min) / rangeTotal) * 100;

  const rangeLowPct = ((p.prices.low - p.range.min) / rangeTotal) * 100;
  const rangeHighPct = ((p.prices.high - p.range.min) / rangeTotal) * 100;

  container.innerHTML = `
    <div class="product-header">
      <div>
        <div class="product-name">${p.name}</div>
        <span class="price-tag" style="margin-top:6px;">${p.category}</span>
      </div>
    </div>
    <div class="price-summary">
      <div class="price-item">
        <div class="price-label">当前价格</div>
        <div class="price-value price-current">&yen;${p.prices.current.toLocaleString()}</div>
      </div>
      <div class="price-item">
        <div class="price-label">历史最低</div>
        <div class="price-value price-low">&yen;${p.prices.low.toLocaleString()}</div>
      </div>
      <div class="price-item">
        <div class="price-label">历史最高</div>
        <div class="price-value price-high">&yen;${p.prices.high.toLocaleString()}</div>
      </div>
      <div class="price-item">
        <div class="price-label">常售价</div>
        <div class="price-value price-avg">&yen;${p.prices.avg.toLocaleString()}</div>
      </div>
    </div>
    <div class="advice-section ${adviceClass}">
      <div class="advice-icon">${p.advice.type === 'buy' ? '\u2705' : p.advice.type === 'wait' ? '\u23F3' : '\u274C'}</div>
      <div class="advice-text">
        <strong>${p.advice.title}</strong>
        ${p.advice.detail}
      </div>
    </div>
    <div class="chart-section">
      <div class="section-label">近 6 个月价格走势</div>
      <canvas id="priceChart"></canvas>
    </div>
    <div class="info-grid">
      <div class="info-card">
        <h4>价格区间分析</h4>
        <div class="range-bar">
          <div class="range-fill" style="left:${rangeFillLeft}%;width:${rangeFillWidth}%;"></div>
          <div class="range-marker range-marker-low" style="left:${rangeLowPct}%;" title="历史最低"></div>
          <div class="range-marker range-marker-high" style="left:${rangeHighPct}%;" title="历史最高"></div>
          <div class="range-marker range-marker-curr" style="left:${currMarkerPos}%;" title="当前价格"></div>
        </div>
        <div class="range-labels">
          <span>&yen;${p.range.min.toLocaleString()}</span>
          <span>常售价 &yen;${p.range.commonLow.toLocaleString()} - &yen;${p.range.commonHigh.toLocaleString()}</span>
          <span>&yen;${p.range.max.toLocaleString()}</span>
        </div>
        <div style="display:flex;gap:12px;margin-top:12px;font-size:0.8rem;">
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-right:4px;"></span>历史最低</span>
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:4px;"></span>历史最高</span>
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:4px;"></span>当前价</span>
        </div>
      </div>
      <div class="info-card">
        <h4>平台价格对比 (模拟)</h4>
        ${platformRows}
      </div>
    </div>
    <div class="info-card alert-section">
      <h4>降价提醒设置（模拟）</h4>
      <div class="alert-row">
        <span style="font-size:0.9rem;">设定目标价：</span>
        <span style="color:var(--text-secondary);font-size:0.9rem;">&yen;</span>
        <input type="number" class="alert-input" id="alertInput" placeholder="输入目标价格">
        <button class="btn btn-primary btn-sm" id="alertBtn">设置提醒</button>
      </div>
      <div class="alert-msg" id="alertMsg"></div>
    </div>
  `;

  container.classList.add('show');
  drawChart(p.prices.history, p.prices.low, p.prices.high, p.prices.current);

  // 绑定提醒事件
  document.getElementById('alertBtn').addEventListener('click', setAlert);
  document.getElementById('alertInput').addEventListener('keydown', e => { if (e.key === 'Enter') setAlert(); });

  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ========== 价格走势图 ==========
function drawChart(history, low, high, current) {
  const canvas = document.getElementById('priceChart');
  if (!canvas) return;

  const container = canvas.parentElement;
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width * (window.devicePixelRatio || 1);
  canvas.height = 320 * (window.devicePixelRatio || 1);
  canvas.style.width = rect.width + 'px';
  canvas.style.height = '320px';

  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);

  const w = rect.width;
  const h = 320;
  const pad = { top: 40, right: 30, bottom: 40, left: 60 };
  const pw = w - pad.left - pad.right;
  const ph = h - pad.top - pad.bottom;

  ctx.clearRect(0, 0, w, h);

  // 背景网格
  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (ph / 4) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
  }

  const months = Object.keys(history);
  const values = Object.values(history);
  const minVal = low - 100;
  const maxVal = high + 100;
  const valRange = maxVal - minVal;

  function xPos(i) { return pad.left + (pw / (months.length - 1)) * i; }
  function yPos(v) { return pad.top + ph - ((v - minVal) / valRange) * ph; }

  // 填充渐变
  const gradient = ctx.createLinearGradient(0, pad.top, 0, pad.top + ph);
  gradient.addColorStop(0, 'rgba(88,166,255,0.2)');
  gradient.addColorStop(1, 'rgba(88,166,255,0.02)');
  ctx.beginPath();
  ctx.moveTo(xPos(0), yPos(values[0]));
  for (let i = 1; i < values.length; i++) ctx.lineTo(xPos(i), yPos(values[i]));
  ctx.lineTo(xPos(values.length - 1), pad.top + ph);
  ctx.lineTo(xPos(0), pad.top + ph);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();

  // 折线
  ctx.beginPath();
  ctx.moveTo(xPos(0), yPos(values[0]));
  for (let i = 1; i < values.length; i++) ctx.lineTo(xPos(i), yPos(values[i]));
  ctx.strokeStyle = '#58a6ff';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // 数据点
  months.forEach((m, i) => {
    const v = values[i];
    ctx.beginPath();
    ctx.arc(xPos(i), yPos(v), 4, 0, Math.PI * 2);
    if (v === low) ctx.fillStyle = '#3fb950';
    else if (v === high) ctx.fillStyle = '#f85149';
    else ctx.fillStyle = '#58a6ff';
    ctx.fill();
    ctx.strokeStyle = '#161b22';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // X轴标签
  ctx.fillStyle = '#8b949e';
  ctx.font = '12px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  months.forEach((m, i) => {
    ctx.fillText(m, xPos(i), pad.top + ph + 20);
  });

  // Y轴标签
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const val = minVal + (valRange / 4) * (4 - i);
    const y = pad.top + (ph / 4) * i;
    ctx.fillText('\u00A5' + Math.round(val).toLocaleString(), pad.left - 8, y + 4);
  }

  // 图例
  const legendY = 16;
  const legendItems = [
    { color: '#3fb950', label: '历史最低' },
    { color: '#f85149', label: '历史最高' },
    { color: '#58a6ff', label: '当前价格' }
  ];
  ctx.textAlign = 'left';
  let legendX = pad.left;
  legendItems.forEach(item => {
    ctx.beginPath();
    ctx.arc(legendX + 5, legendY, 5, 0, Math.PI * 2);
    ctx.fillStyle = item.color;
    ctx.fill();
    ctx.fillStyle = '#8b949e';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.fillText(item.label, legendX + 14, legendY + 4);
    legendX += ctx.measureText(item.label).width + 34;
  });
}

// ========== 降价提醒 ==========
function setAlert() {
  const input = document.getElementById('alertInput');
  const msg = document.getElementById('alertMsg');
  const val = parseFloat(input.value);
  if (!val || val <= 0) return;
  alertPrice = val;
  if (currentProduct) {
    if (val >= currentProduct.prices.current) {
      msg.textContent = '\u2705 已设置目标价 \u00A5' + val.toLocaleString() + '。当前价格 \u00A5' + currentProduct.prices.current.toLocaleString() + ' 已低于您的目标价，建议立即入手！';
    } else {
      const diff = currentProduct.prices.current - val;
      const pct = Math.round((diff / currentProduct.prices.current) * 100);
      msg.textContent = '\u23F3 已设置目标价 \u00A5' + val.toLocaleString() + '。还需降价 \u00A5' + diff.toLocaleString() + '（约 ' + pct + '%），降价后将通知您。（模拟演示）';
    }
    msg.classList.add('show');
  }
}

// ========== 事件绑定 ==========
document.getElementById('searchBtn').addEventListener('click', () => {
  searchProduct(document.getElementById('searchInput').value);
});
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchProduct(e.target.value);
});

// 窗口缩放重绘
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (currentProduct) drawChart(currentProduct.prices.history, currentProduct.prices.low, currentProduct.prices.high, currentProduct.prices.current);
  }, 200);
});

// 初始化
renderPresets();
</script>
