<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta标签生成器</title><meta name="description" content="Meta标签生成器 - 在线生成HTML Meta标签"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group textarea,.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group textarea:focus,.input-group select:focus{border-color:var(--blue);outline:none}.input-group textarea{min-height:80px;font-family:monospace;font-size:.85rem;resize:vertical}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.checkbox-group{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}.checkbox-group label{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--text2);cursor:pointer}.checkbox-group input[type="checkbox"]{width:auto;margin:0}.preview{margin-top:16px;padding:16px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}.preview-title{font-size:1.1rem;font-weight:600;color:var(--blue);margin-bottom:8px}.preview-url{font-size:.85rem;color:var(--green);margin-bottom:4px}.preview-desc{font-size:.9rem;color:var(--text2)}</style><meta property="og:title" content="Meta标签生成器"><meta property="og:description" content="Meta标签生成器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🏷️ Meta标签生成器</h1><p class="sub">在线生成HTML Meta标签</p>
<div class="card">
<div class="input-group">
<label>页面标题</label>
<input type="text" id="title" placeholder="我的网站标题" oninput="generateMeta()">
</div>
<div class="input-group">
<label>页面描述</label>
<textarea id="description" placeholder="这是一个描述..." oninput="generateMeta()"></textarea>
</div>
<div class="input-group">
<label>关键词（逗号分隔）</label>
<input type="text" id="keywords" placeholder="关键词1, 关键词2, 关键词3" oninput="generateMeta()">
</div>
<div class="input-group">
<label>页面URL</label>
<input type="text" id="url" placeholder="https://example.com" oninput="generateMeta()">
</div>
<div class="input-group">
<label>图片URL（用于社交分享）</label>
<input type="text" id="image" placeholder="https://example.com/image.jpg" oninput="generateMeta()">
</div>
<div class="input-group">
<label>作者</label>
<input type="text" id="author" placeholder="作者名" oninput="generateMeta()">
</div>
<div class="input-group">
<label>视口设置</label>
<select id="viewport" onchange="generateMeta()">
<option value="width=device-width, initial-scale=1.0">标准视口</option>
<option value="width=device-width, initial-scale=1.0, maximum-scale=1.0">禁用缩放</option>
<option value="width=320">固定宽度</option>
</select>
</div>
<div class="checkbox-group">
<label><input type="checkbox" id="ogTags" checked onchange="generateMeta()"> Open Graph标签</label>
<label><input type="checkbox" id="twitterTags" onchange="generateMeta()"> Twitter Card标签</label>
<label><input type="checkbox" id="robotsTags" checked onchange="generateMeta()"> Robots标签</label>
</div>
<button class="btn" onclick="generateMeta()">生成Meta标签</button>
</div>
<div class="preview" id="preview" style="display:none">
<div class="preview-title" id="previewTitle"></div>
<div class="preview-url" id="previewUrl"></div>
<div class="preview-desc" id="previewDesc"></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function generateMeta(){
  var title=document.getElementById('title').value;
  var description=document.getElementById('description').value;
  var keywords=document.getElementById('keywords').value;
  var url=document.getElementById('url').value;
  var image=document.getElementById('image').value;
  var author=document.getElementById('author').value;
  var viewport=document.getElementById('viewport').value;
  var ogTags=document.getElementById('ogTags').checked;
  var twitterTags=document.getElementById('twitterTags').checked;
  var robotsTags=document.getElementById('robotsTags').checked;
  if(title){
    document.getElementById('preview').style.display='block';
    document.getElementById('previewTitle').textContent=title;
    document.getElementById('previewUrl').textContent=url||'https://example.com';
    document.getElementById('previewDesc').textContent=description||'';
  }else{
    document.getElementById('preview').style.display='none';
  }
  var tags=[];
  if(title)tags.push('<title>'+escapeHtml(title)+'</title>');
  if(description)tags.push('<meta name="description" content="'+escapeHtml(description)+'">');
  if(keywords)tags.push('<meta name="keywords" content="'+escapeHtml(keywords)+'">');
  if(author)tags.push('<meta name="author" content="'+escapeHtml(author)+'">');
  if(viewport)tags.push('<meta name="viewport" content="'+viewport+'">');
  if(robotsTags){
    tags.push('<meta name="robots" content="index, follow">');
    tags.push('<meta name="googlebot" content="index, follow">');
  }
  if(ogTags){
    if(title)tags.push('<meta property="og:title" content="'+escapeHtml(title)+'">');
    if(description)tags.push('<meta property="og:description" content="'+escapeHtml(description)+'">');
    if(url)tags.push('<meta property="og:url" content="'+escapeHtml(url)+'">');
    if(image)tags.push('<meta property="og:image" content="'+escapeHtml(image)+'">');
    tags.push('<meta property="og:type" content="website">');
  }
  if(twitterTags){
    tags.push('<meta name="twitter:card" content="summary_large_image">');
    if(title)tags.push('<meta name="twitter:title" content="'+escapeHtml(title)+'">');
    if(description)tags.push('<meta name="twitter:description" content="'+escapeHtml(description)+'">');
    if(image)tags.push('<meta name="twitter:image" content="'+escapeHtml(image)+'">');
  }
  if(tags.length>0){
    showResult(tags.join('\n'),'Meta标签代码');
  }
}
function showResult(text,title){
  var r=document.getElementById('result');
  var html='<div class="card"><div class="section"><h3>📋 '+title+'</h3>';
  html+='<div class="result-block" id="resultText">'+escapeHtml(text)+'</div>';
  html+='<button class="copy-btn" onclick="copyResult()">复制代码</button></div></div>';
  r.innerHTML=html;
}
function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyResult(){
  var text=document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
generateMeta();
</script></body></html>
