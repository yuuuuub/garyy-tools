<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日数独</title>
<meta name="description" content="每日数独题目，每天一道新的数独等你挑战"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#8b5cf6;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8em;margin-bottom:8px;text-align:center}
.subtitle{color:#8b949e;margin-bottom:20px;text-align:center;font-size:.9em}
.game-area{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:100%;margin-bottom:16px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:1em;transition:all .2s}
.btn:hover{opacity:.9;transform:scale(1.02)}
.btn:active{transform:scale(.98)}
.btn-sm{padding:6px 14px;font-size:.85em}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-yellow{background:var(--yellow);color:#000}.btn-orange{background:var(--orange)}
.flex{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;gap:4px}
.info{text-align:center;color:#8b949e;margin:12px 0;font-size:.95em}
.result{text-align:center;font-size:1.2em;margin:16px 0;padding:16px;border-radius:8px;background:var(--bg);min-height:40px}
.token{display:inline-block;padding:4px 10px;margin:3px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.token:hover{border-color:var(--accent)}
.token.active{background:var(--accent);border-color:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media(max-width:480px){body{padding:12px}.game-area{padding:16px}h1{font-size:1.4em}}
</style><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="每日数独">
  <meta property="og:description" content="每日数独题目，每天一道新的数独等你挑战">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/sudoku-daily/">
</head><body>
<h1>每日数独</h1><p class="subtitle">每日数独挑战</p>
<div class="game-area"><div id="board" class="grid" style="grid-template-columns:repeat(9,38px);margin:0 auto;width:fit-content;border:2px solid var(--accent);padding:4px;border-radius:8px"></div>
<div class="flex" style="margin-top:16px"><button class="btn" onclick="newPuzzle()">新游戏</button><button class="btn btn-green" onclick="checkS()">检查</button><button class="btn btn-red" onclick="solveS()">求解</button></div>
<div class="result" id="result"></div>
<script>
const sol=Array(9).fill(null).map(()=>Array(9).fill(0));const inp={};const diff=1;
function gen(){const b=Array(9).fill(null).map(()=>Array(9).fill(0));
function ok(b,r,c,n){for(let i=0;i<9;i++)if(b[r][i]===n||b[i][c]===n)return false;
const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
for(let i=br;i<br+3;i++)for(let j=bc;j<bc+3;j++)if(b[i][j]===n)return false;return true;}
function fill(b){for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(b[r][c]===0){const ns=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-.5);
for(const n of ns)if(ok(b,r,c,n)){b[r][c]=n;if(fill(b))return true;b[r][c]=0;}}return false;}}
fill(b);return b;}
function newPuzzle(){const s=gen();for(let r=0;r<9;r++)for(let c=0;c<9;c++)sol[r][c]=s[r][c];
const hide=35+diff*5;let h=0;while(h<hide){const r=Math.floor(Math.random()*9),c=Math.floor(Math.random()*9);
if(s[r][c]!==0){s[r][c]=0;h++;}}
const b=document.getElementById('board');b.innerHTML='';
for(let r=0;r<9;r++)for(let c=0;c<9;c++){const d=document.createElement('input');d.type='number';d.min=1;d.max=9;
d.style.cssText='width:38px;height:38px;text-align:center;font-size:1.1em;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px';
if(s[r][c]!==0){d.value=s[r][c];d.disabled=true;d.style.color='var(--accent)';d.style.background='var(--card)';}
d.oninput=function(){if(this.value>9)this.value=9;if(this.value<1)this.value='';};
b.appendChild(d);inp[r+'-'+c]=d;}}}
function checkS(){let ok=true;for(let r=0;r<9;r++)for(let c=0;c<9;c++){const v=parseInt(inp[r+'-'+c]?.value)||0;if(v!==sol[r][c])ok=false;}
document.getElementById('result').innerHTML=ok?'恭喜，答案正确！':'还有错误';}
function solveS(){for(let r=0;r<9;r++)for(let c=0;c<9;c++)inp[r+'-'+c].value=sol[r][c];}
newPuzzle();</script>
</div></body></html>
