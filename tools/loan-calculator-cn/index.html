<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贷款计算器</title>
<meta name="description" content="贷款计算器，等额本息和等额本金对比，房贷车贷计算">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vhscroll-behavior:smooth;padding:16px;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.result-big{text-align:center;padding:18px}
.result-big .label{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.result-big .value{font-size:2rem;font-weight:700}
.result-big .value.green{color:var(--green)}
.result-big .value.gold{color:var(--gold)}
.result-big .value.red{color:var(--red)}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.stat-card{text-align:center;padding:14px;background:var(--bg);border-radius:var(--radius)}
.stat-card .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:1.1rem;font-weight:700}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.detail-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
.detail-table th,.detail-table td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}
.detail-table th{color:var(--text2);font-weight:500;background:var(--bg)}
.detail-table td:first-child,.detail-table th:first-child{text-align:left}
.detail-table tr:last-child td{border-bottom:none}
.table-wrap{max-height:350px;overflow-y:auto}
.table-wrap::-webkit-scrollbar{width:4px}
.table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.chart-bar-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.chart-bar-row .label{min-width:60px;font-size:.78rem;color:var(--text2)}
.chart-bar-row .bar-track{flex:1;height:18px;background:var(--bg);border-radius:4px;overflow:hidden}
.chart-bar-row .bar-fill{height:100%;border-radius:4px;transition:width .5s}
.chart-bar-row .val{min-width:70px;text-align:right;font-size:.78rem;font-weight:600}
.preset-group{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.preset-btn{padding:4px 12px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;background:var(--card);color:var(--text);cursor:pointer;transition:all .2s}
.preset-btn:hover{border-color:var(--blue);color:var(--blue)}
.compare-table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:12px}
.compare-table th,.compare-table td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left}
.compare-table th{color:var(--text2);font-weight:500}
.compare-table td{font-weight:600}
@media(max-width:640px){.form-row{flex-direction:column}.grid-3{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="贷款计算器">
<meta property="og:description" content="贷款计算器，等额本息和等额本金对比，房贷车贷计算">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/loan-calculator-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🏦 贷款计算器</h1>
    <p>等额本息 vs 等额本金 对比</p>
  </header>

  <div class="card">
    <div class="form-row">
      <div class="group"><label>贷款金额 (元)</label><input type="number" id="loanAmt" value="1000000" min="0" step="any"></div>
      <div class="group"><label>年利率 (%)</label><input type="number" id="annualRate" value="4.2" min="0" max="100" step="any"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>贷款期限 (年)</label><input type="number" id="termYears" value="30" min="1" max="50" step="1"></div>
    </div>
    <div class="preset-group" id="presets"></div>
  </div>

  <div class="card">
    <div class="section-title">📊 还款方式对比</div>
    <div id="compareResult"></div>
    <table class="compare-table" id="compareTable"></table>
  </div>

  <div class="card">
    <div class="section-title">📊 还款构成</div>
    <div id="bars"></div>
  </div>

  <div class="card">
    <div class="section-title">📋 等额本息还款明细 <span style="font-size:.75rem;color:var(--text2);font-weight:400">(前12期 + 最后3期)</span></div>
    <div class="table-wrap"><table class="detail-table" id="epTable"></table></div>
  </div>

  <div class="card">
    <div class="section-title">📋 等额本金还款明细 <span style="font-size:.75rem;color:var(--text2);font-weight:400">(前12期 + 最后3期)</span></div>
    <div class="table-wrap"><table class="detail-table" id="eqTable"></table></div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtInt=n=>n.toLocaleString('zh-CN');

const presets=[
  {name:'房贷100万/30年',loanAmt:1000000,annualRate:4.2,termYears:30},
  {name:'房贷200万/30年',loanAmt:2000000,annualRate:4.2,termYears:30},
  {name:'车贷10万/3年',loanAmt:100000,annualRate:5.5,termYears:3},
  {name:'消费贷20万/5年',loanAmt:200000,annualRate:6.0,termYears:5}
];

$('presets').innerHTML=presets.map(p=>`<button class="preset-btn" onclick="applyPreset(${JSON.stringify(p).replace(/"/g,'&quot;')})">${p.name}</button>`).join('');

window.applyPreset=function(p){
  $('loanAmt').value=p.loanAmt;
  $('annualRate').value=p.annualRate;
  $('termYears').value=p.termYears;
  calc();
};

function calcEP(principal,monthlyRate,totalMonths){
  const payment=principal*monthlyRate*Math.pow(1+monthlyRate,totalMonths)/(Math.pow(1+monthlyRate,totalMonths)-1);
  let balance=principal;
  let schedule=[];
  let totalInterest=0;
  for(let m=1;m<=totalMonths;m++){
    const interest=balance*monthlyRate;
    const principalPart=payment-interest;
    balance-=principalPart;
    totalInterest+=interest;
    schedule.push({month:m,payment:payment,principal:principalPart,interest:interest,balance:Math.max(0,balance)});
  }
  return{payment,schedule,totalInterest,totalPayment:principal+totalInterest};
}

function calcEQ(principal,monthlyRate,totalMonths){
  const monthlyPrincipal=principal/totalMonths;
  let balance=principal;
  let schedule=[];
  let totalInterest=0;
  for(let m=1;m<=totalMonths;m++){
    const interest=balance*monthlyRate;
    const payment=monthlyPrincipal+interest;
    balance-=monthlyPrincipal;
    totalInterest+=interest;
    schedule.push({month:m,payment:payment,principal:monthlyPrincipal,interest:interest,balance:Math.max(0,balance)});
  }
  return{firstPayment:schedule[0]?.payment||0,lastPayment:schedule[schedule.length-1]?.payment||0,schedule,totalInterest,totalPayment:principal+totalInterest};
}

function calc(){
  const principal=+$('loanAmt').value||0;
  const annualRate=+$('annualRate').value||0;
  const years=+$('termYears').value||1;
  const monthlyRate=annualRate/100/12;
  const totalMonths=years*12;

  const ep=calcEP(principal,monthlyRate,totalMonths);
  const eq=calcEQ(principal,monthlyRate,totalMonths);
  const savings=eq.totalInterest-ep.totalInterest;

  $('compareResult').innerHTML=`
    <div class="grid-3">
      <div class="stat-card"><div class="label">等额本息月供</div><div class="value" style="color:var(--blue)">¥${fmt(ep.payment)}</div></div>
      <div class="stat-card"><div class="label">等额本金首月</div><div class="value" style="color:var(--gold)">¥${fmt(eq.firstPayment)}</div></div>
      <div class="stat-card"><div class="label">等额本金末月</div><div class="value" style="color:var(--green)">¥${fmt(eq.lastPayment)}</div></div>
    </div>
  `;

  $('compareTable').innerHTML=`
    <tr><th>对比项</th><th>等额本息</th><th>等额本金</th><th>差额</th></tr>
    <tr><td>总利息</td><td style="color:var(--red)">¥${fmt(ep.totalInterest)}</td><td style="color:var(--gold)">¥${fmt(eq.totalInterest)}</td><td style="color:${savings>=0?'var(--green)':'var(--red)'}">¥${fmt(Math.abs(savings))} ${savings>=0?'等额本息多付':'等额本金多付'}</td></tr>
    <tr><td>总还款</td><td>¥${fmt(ep.totalPayment)}</td><td>¥${fmt(eq.totalPayment)}</td><td>¥${fmt(Math.abs(ep.totalPayment-eq.totalPayment))}</td></tr>
    <tr><td>月供特点</td><td>固定月供</td><td>逐月递减</td><td></td></tr>
  `;

  const maxTotal=Math.max(ep.totalPayment,eq.totalPayment,1);
  $('bars').innerHTML=`
    <div class="chart-bar-row"><div class="label">等额本息</div><div class="bar-track"><div class="bar-fill" style="width:${ep.totalPayment/maxTotal*100}%;background:linear-gradient(90deg,var(--blue),var(--blue))"></div></div><div class="val" style="color:var(--blue)">¥${fmtInt(ep.totalPayment)}</div></div>
    <div class="chart-bar-row"><div class="label">　本金</div><div class="bar-track"><div class="bar-fill" style="width:${principal/maxTotal*100}%;background:var(--green)"></div></div><div class="val" style="color:var(--green)">¥${fmtInt(principal)}</div></div>
    <div class="chart-bar-row"><div class="label">　利息</div><div class="bar-track"><div class="bar-fill" style="width:${ep.totalInterest/maxTotal*100}%;background:var(--red)"></div></div><div class="val" style="color:var(--red)">¥${fmtInt(ep.totalInterest)}</div></div>
    <div style="height:8px"></div>
    <div class="chart-bar-row"><div class="label">等额本金</div><div class="bar-track"><div class="bar-fill" style="width:${eq.totalPayment/maxTotal*100}%;background:linear-gradient(90deg,var(--gold),var(--gold))"></div></div><div class="val" style="color:var(--gold)">¥${fmtInt(eq.totalPayment)}</div></div>
    <div class="chart-bar-row"><div class="label">　本金</div><div class="bar-track"><div class="bar-fill" style="width:${principal/maxTotal*100}%;background:var(--green)"></div></div><div class="val" style="color:var(--green)">¥${fmtInt(principal)}</div></div>
    <div class="chart-bar-row"><div class="label">　利息</div><div class="bar-track"><div class="bar-fill" style="width:${eq.totalInterest/maxTotal*100}%;background:var(--red)"></div></div><div class="val" style="color:var(--red)">¥${fmtInt(eq.totalInterest)}</div></div>
  `;

  function renderTable(id,schedule){
    let head=`<thead><tr><th>期数</th><th>月供</th><th>本金</th><th>利息</th><th>剩余本金</th></tr></thead>`;
    let rows=[];
    const show=totalMonths<=15?schedule:schedule.slice(0,12).concat([{month:'...',payment:0,principal:0,interest:0,balance:0}],schedule.slice(-3));
    rows=rows.concat(show.map(s=>{
      if(s.month==='...')return `<tr><td colspan="5" style="text-align:center;color:var(--text2)">... 共${totalMonths}期 ...</td></tr>`;
      return `<tr><td>${s.month}</td><td>¥${fmt(s.payment)}</td><td>¥${fmt(s.principal)}</td><td style="color:var(--red)">¥${fmt(s.interest)}</td><td>¥${fmt(s.balance)}</td></tr>`;
    }));
    $(id).innerHTML=head+'<tbody>'+rows.join('')+'</tbody>';
  }
  renderTable('epTable',ep.schedule);
  renderTable('eqTable',eq.schedule);
}

calc();
[$('loanAmt'),$('annualRate'),$('termYears')].forEach(el=>{el.addEventListener('input',calc);el.addEventListener('change',calc)});
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
