<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown转HTML</title><meta name="description" content="Markdown转HTML - 在线Markdown格式转换为HTML"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>"><meta name="robots" content="index, follow"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:1000px;margin:auto}h1{text-align:center;padding:20px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.editor-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}textarea{width:100%;min-height:400px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.82rem;resize:vertical;outline:none;line-height:1.6}textarea:focus{border-color:var(--blue)}.preview{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;min-height:400px;overflow:auto;line-height:1.7;font-size:.9rem}.preview h1{font-size:1.5rem;margin:16px 0 8px;border-bottom:1px solid var(--border);padding-bottom:6px}.preview h2{font-size:1.3rem;margin:14px 0 6px}.preview h3{font-size:1.1rem;margin:12px 0 6px}.preview p{margin:8px 0}.preview code{background:var(--bg-card);padding:2px 6px;border-radius:4px;font-size:.85rem}.preview pre{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto}.preview pre code{background:none;padding:0}.preview ul,.preview ol{padding-left:24px;margin:8px 0}.preview li{margin:4px 0}.preview blockquote{border-left:3px solid var(--blue);padding-left:12px;color:var(--text2);margin:8px 0}.preview table{border-collapse:collapse;width:100%;margin:8px 0}.preview th,.preview td{border:1px solid var(--border);padding:8px;text-align:left}.preview th{background:var(--bg-card)}.preview a{color:var(--blue);text-decoration:none}.preview img{max-width:100%;border-radius:8px}.preview hr{border:none;border-top:1px solid var(--border);margin:16px 0}.btn-row{display:flex;gap:8px;justify-content:center;margin:12px 0}.btn{padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.82rem}.btn:hover{opacity:.85}.btn.secondary{background:var(--bg);border:1px solid var(--border);color:var(--text)}@media(max-width:700px){.editor-wrap{grid-template-columns:1fr}}</style>
<meta property="og:title" content="Markdown转HTML">
<meta property="og:description" content="Markdown转HTML - 在线Markdown格式转换为HTML">
<meta property="og:image" content="/og-default.png">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📝 Markdown 转 HTML</h1><p class="sub">实时预览Markdown转HTML效果</p>
<div class="btn-row"><button class="btn secondary" onclick="loadSample()">📋 示例</button><button class="btn secondary" onclick="copyHTML()">📋 复制HTML</button><button class="btn secondary" onclick="copyMD()">📋 复制MD</button></div>
<div class="editor-wrap"><div><textarea id="mdInput" placeholder="在此输入Markdown..." oninput="render()"></textarea></div><div class="preview card" id="preview"></div></div></div>
<script src="../i18n.js" defer></script>
<script>
function render(){
  var md=document.getElementById('mdInput').value;
  document.getElementById('preview').innerHTML=md2html(md);
}
function md2html(md){
  var html=md
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^---$/gm,'<hr>')
    .replace(/^\* (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s,function(m){return '<ul>'+m+'</ul>';})
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>');
  return '<p>'+html+'</p>';
}
function loadSample(){
  document.getElementById('mdInput').value='# Markdown 示例\n\n这是一段**加粗**和*斜体*文本。\n\n## 功能列表\n\n- 支持标题 (h1-h3)\n- 支持**粗体**和*斜体*\n- 支持`行内代码`\n- 支持[链接](https://example.com)\n- 支持列表\n- 支持引用\n\n## 代码示例\n\n`console.log("Hello World")`\n\n> 这是一段引用文本\n\n---\n\n### 表格\n\n| 姓名 | 年龄 | 城市 |\n|------|------|------|\n| 张三 | 25 | 北京 |\n| 李四 | 30 | 上海 |';
  render();
}
function copyHTML(){navigator.clipboard.writeText(document.getElementById('preview').innerHTML).then(function(){garyyToast('HTML已复制','success')}).catch(function(){});}
function copyMD(){navigator.clipboard.writeText(document.getElementById('mdInput').value).then(function(){garyyToast('Markdown已复制','success')}).catch(function(){});}
loadSample();
</script></body></html>
