<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG 查看器 | SVG Viewer</title>
<meta property="og:title" content="SVG 查看器 | SVG Viewer">
<meta property="og:description" content="SVG 查看器 | SVG Viewer - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="SVG查看器，实时预览和编辑SVG代码，支持拖拽导入">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>">
<script src="i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5padding:16px;scroll-behavior:smooth;}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.container{max-width:1600px;margin:0 auto;padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:calc(100vh - 140px)}
@media(max-width:900px){.container{grid-template-columns:1fr}}
.panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:500;color:var(--text-secondary);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.editor{width:100%;flex:1;min-height:400px;padding:16px;background:var(--bg);color:var(--text);border:none;resize:none;font-family:'Fira Code',Consolas,Monaco,monospace;font-size:.85rem;line-height:1.6;outline:none}
.editor::placeholder{color:var(--text-secondary)}
.preview-container{flex:1;min-height:400px;padding:16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:auto;background-image:linear-gradient(45deg,var(--bg-tertiary) 25%,transparent 25%),linear-gradient(-45deg,var(--bg-tertiary) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--bg-tertiary) 75%),linear-gradient(-45deg,transparent 75%,var(--bg-tertiary) 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.preview-container svg{max-width:100%;max-height:100%;transition:transform .2s}
.info-bar{display:flex;gap:16px;padding:8px 16px;border-top:1px solid var(--border);font-size:.75rem;color:var(--text-secondary);flex-wrap:wrap}
.info-item{display:flex;gap:4px}
.info-item span{color:var(--cyan)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg-secondary)}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.zoom-controls{display:flex;gap:4px;align-items:center;margin-left:auto}
.zoom-controls span{font-size:.8rem;color:var(--text-secondary);min-width:50px;text-align:center}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 20px;border-radius:var(--radius-sm);background:var(--green);color:#fff;font-size:.85rem;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.drop-overlay{position:absolute;inset:0;background:rgba(88,166,255,.1);border:2px dashed var(--accent);border-radius:var(--radius);display:none;align-items:center;justify-content:center;font-size:1.1rem;color:var(--accent);z-index:10}
.drop-overlay.show{display:flex}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header class="app-header">
<div>
<h1>🖼️ SVG 查看器</h1>
<span class="subtitle">实时预览和编辑SVG代码</span>
</div>
<div style="display:flex;gap:6px">
<button class="btn" onclick="loadSample()">示例SVG</button>
<button class="btn" onclick="clearAll()">清空</button>
</div>
</header>
<div class="container">
<div class="panel">
<div class="panel-header">
<span>📝 SVG 代码</span>
<div style="display:flex;gap:6px">
<button class="btn" onclick="copyCode()">📋 复制</button>
<button class="btn" onclick="downloadSVG()">💾 下载</button>
</div>
</div>
<textarea class="editor" id="editor" placeholder="粘贴SVG代码...&#10;&#10;支持拖拽SVG文件到预览区域导入" spellcheck="false"></textarea>
<div class="info-bar" id="infoBar"></div>
</div>
<div class="panel">
<div class="panel-header">
<span>👁️ 预览</span>
<button class="btn" onclick="toggleGrid()">网格</button>
</div>
<div class="preview-container" id="previewContainer">
<div class="drop-overlay" id="dropOverlay">拖放SVG文件到这里</div>
<div id="preview"></div>
</div>
<div class="toolbar">
<label class="btn" style="cursor:pointer">📂 打开文件<input type="file" accept=".svg,image/svg+xml" style="display:none" onchange="loadFile(event)"></label>
<span style="font-size:.8rem;color:var(--text-secondary)">缩放：</span>
<div class="zoom-controls">
<button class="btn" onclick="zoomOut()">−</button>
<span id="zoomLevel">100%</span>
<button class="btn" onclick="zoomIn()">+</button>
<button class="btn" onclick="zoomReset()">重置</button>
</div>
</div>
</div>
</div>
<div class="toast" id="toast">已复制到剪贴板</div>

<script>
const editor=document.getElementById('editor'),preview=document.getElementById('preview'),previewContainer=document.getElementById('previewContainer'),infoBar=document.getElementById('infoBar'),dropOverlay=document.getElementById('dropOverlay');
let zoom=1;let showGrid=false;

editor.addEventListener('input',renderPreview);

function renderPreview(){
const svg=editor.value.trim();
if(!svg){preview.innerHTML='';infoBar.innerHTML='';return}
preview.innerHTML=svg;
const svgEl=preview.querySelector('svg');
if(!svgEl){infoBar.innerHTML='';return}
const w=svgEl.getAttribute('width')||svgEl.viewBox?.baseVal?.width||'?';
const h=svgEl.getAttribute('height')||svgEl.viewBox?.baseVal?.height||'?';
const elems=svgEl.querySelectorAll('*').length;
const size=new Blob([svg]).size;
const kb=(size/1024).toFixed(1);
infoBar.innerHTML=`
<div class="info-item">尺寸: <span>${w} × ${h}</span></div>
<div class="info-item">元素数: <span>${elems}</span></div>
<div class="info-item">文件大小: <span>${kb} KB</span></div>`;
}

function zoomIn(){zoom=Math.min(5,zoom+0.25);applyZoom()}
function zoomOut(){zoom=Math.max(0.25,zoom-0.25);applyZoom()}
function zoomReset(){zoom=1;applyZoom()}
function applyZoom(){
preview.style.transform=`scale(${zoom})`;
document.getElementById('zoomLevel').textContent=Math.round(zoom*100)+'%';
}

function toggleGrid(){
showGrid=!showGrid;
previewContainer.style.backgroundImage=showGrid?'linear-gradient(45deg,var(--bg-tertiary) 25%,transparent 25%),linear-gradient(-45deg,var(--bg-tertiary) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--bg-tertiary) 75%),linear-gradient(-45deg,transparent 75%,var(--bg-tertiary) 75%)':'none';
}

function copyCode(){
if(!editor.value)return;
navigator.clipboard.writeText(editor.value).then(()=>showToast());
}

function downloadSVG(){
if(!editor.value)return;
const blob=new Blob([editor.value],{type:'image/svg+xml'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download='image.svg';a.click();
URL.revokeObjectURL(url);
}

function loadFile(e){
const file=e.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=ev=>{editor.value=ev.target.result;renderPreview()};
reader.readAsText(file);
}

function clearAll(){editor.value='';renderPreview()}

function loadSample(){
editor.value=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="160" height="160" rx="20" fill="url(#grad)" opacity="0.9"/>
  <circle cx="100" cy="80" r="30" fill="white" opacity="0.9"/>
  <ellipse cx="100" cy="130" rx="50" ry="30" fill="white" opacity="0.7"/>
  <text x="100" y="175" text-anchor="middle" fill="white" font-size="14" font-family="Arial">SVG Preview</text>
</svg>`;
renderPreview();
}

// Drag & drop
previewContainer.addEventListener('dragover',e=>{e.preventDefault();dropOverlay.classList.add('show')});
previewContainer.addEventListener('dragleave',()=>dropOverlay.classList.remove('show'));
previewContainer.addEventListener('drop',e=>{
e.preventDefault();dropOverlay.classList.remove('show');
const file=e.dataTransfer.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=ev=>{editor.value=ev.target.result;renderPreview()};
reader.readAsText(file);
});

function showToast(){document.getElementById('toast').classList.add('show');setTimeout(()=>document.getElementById('toast').classList.remove('show'),1500)}
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
