<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行预算管理 v2</title>
<meta property="og:title" content="旅行预算管理 v2">
<meta property="og:description" content="旅行费用预算与记录管理">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="旅行预算管理工具，合理规划旅行花费，实时追踪支出">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:16px;min-height:100vh;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text);margin-right:4px;margin-bottom:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.gr .st{text-align:center;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.gr .st .nm{font-size:1.3rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.75rem;color:var(--text2);margin-top:4px}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.progress-text{display:flex;justify-content:space-between;font-size:12px;color:var(--text2)}
.budget-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.budget-amount{font-size:1.5rem;font-weight:700}
.expense-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border)}
.expense-item:last-child{border-bottom:none}
.expense-icon{font-size:1.3rem;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:8px}
.expense-info{flex:1}
.expense-name{font-weight:600;font-size:.9rem}
.expense-date{font-size:.75rem;color:var(--text2)}
.expense-amount{font-weight:700;font-size:.95rem}
.expense-amount.income{color:var(--success)}
.expense-amount.expense{color:var(--danger)}
.chart-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chart-label{min-width:60px;font-size:.8rem;color:var(--text2);text-align:right}
.chart-fill{height:18px;border-radius:4px;transition:width .3s}
.chart-val{font-size:.8rem;font-weight:600;min-width:60px}
.category-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat-pill{padding:4px 12px;border-radius:16px;font-size:.8rem;background:var(--bg);border:1px solid var(--border);cursor:pointer;color:var(--text2);transition:all .15s}
.cat-pill:hover,.cat-pill.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.es{text-align:center;padding:40px;color:var(--text2)}
.list-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.list-btn{padding:6px 14px;border-radius:8px;font-size:.85rem;background:var(--bg);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all .15s}
.list-btn:hover,.list-btn.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:.85rem}
th{color:var(--text2);font-weight:600}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>💰 旅行预算管理 v2</h1><p>合理规划旅行花费，实时追踪支出</p></div>

<div class="gr" id="stats"></div>

<div class="cd"><h2>✈️ 创建预算</h2>
<label>旅行名称</label><input type="text" id="tripName" placeholder="如：日本7日游">
<div class="fr">
<div><label>目的地</label><input type="text" id="tripDest" placeholder="目的地"></div>
<div><label>总预算（¥）</label><input type="number" id="tripBudget" placeholder="预算金额"></div>
</div>
<div class="fr">
<div><label>出发日期</label><input type="date" id="tripStart"></div>
<div><label>返回日期</label><input type="date" id="tripEnd"></div>
</div>
<div class="bg"><button onclick="createTrip()" id="tripBtn">💾 创建预算</button>
<button class="sec" onclick="resetTripForm()">🔄 重置</button></div></div>

<div class="cd">
<h2>📋 我的预算</h2>
<div class="list-tabs" id="tripTabs"></div>
<div id="activeTripArea"></div>
</div>

<div class="cd"><h2>📊 分类统计</h2><div id="categoryChart"></div></div>

<div class="cd"><h2>📈 每日支出</h2><div id="dailyChart"></div></div>

<div class="cd"><h2>📤 数据管理</h2>
<div class="bg">
<button class="sec" onclick="exportTrip()">📥 导出当前预算</button>
<button class="dng" onclick="clearAll()">🗑️ 清空全部</button>
</div></div>
</div>

<script>
const CATEGORIES=[
  {id:'transport',icon:'🚗',name:'交通',color:'#3b82f6'},
  {id:'hotel',icon:'🏨',name:'住宿',color:'#8b5cf6'},
  {id:'food',icon:'🍜',name:'餐饮',color:'#f59e0b'},
  {id:'attraction',icon:'🏛️',name:'景点',color:'#22c55e'},
  {id:'shopping',icon:'🛍️',name:'购物',color:'#ec4899'},
  {id:'other',icon:'📋',name:'其他',color:'#6b7280'}
];
let trips=JSON.parse(localStorage.getItem('travel_budget_v2')||'[]');
let activeTrip=null;
function $(id){return document.getElementById(id)}
function createTrip(){
  const name=$('tripName').value.trim(),dest=$('tripDest').value.trim();
  const budget=parseFloat($('tripBudget').value)||0;
  const start=$('tripStart').value,end=$('tripEnd').value;
  if(!name){alert('请输入旅行名称');return;}
  const idx=trips.findIndex(t=>t.name===name);
  const trip={name,dest,budget,start,end,expenses:[],createdAt:new Date().toISOString()};
  if(idx>=0){trips[idx]={...trips[idx],...trip,expenses:trips[idx].expenses};}
  else{trips.push(trip);activeTrip=trips.length-1;}
  localStorage.setItem('travel_budget_v2',JSON.stringify(trips));
  resetTripForm();renderAll();
}
function resetTripForm(){
  $('tripName').value='';$('tripDest').value='';$('tripBudget').value='';
  $('tripStart').value='';$('tripEnd').value='';$('tripBtn').textContent='💾 创建预算';
}
function selectTrip(i){activeTrip=i;renderAll();}
function deleteTrip(i){if(confirm('确定删除此预算？')){trips.splice(i,1);if(activeTrip>=trips.length)activeTrip=trips.length-1;localStorage.setItem('travel_budget_v2',JSON.stringify(trips));renderAll();}}
function addExpense(){
  if(activeTrip===null)return;
  const name=prompt('消费项目：');if(!name)return;
  const amount=parseFloat(prompt('金额（¥）：'));if(isNaN(amount))return;
  const catIdx=prompt('分类编号：\n0=交通 1=住宿 2=餐饮 3=景点 4=购物 5=其他')||5;
  const date=prompt('日期（YYYY-MM-DD，留空为今天）')||new Date().toISOString().slice(0,10);
  const note=prompt('备注（可选）')||'';
  trips[activeTrip].expenses.push({name,amount,cat:CATEGORIES[parseInt(catIdx)]?.id||'other',date,note,createdAt:new Date().toISOString()});
  localStorage.setItem('travel_budget_v2',JSON.stringify(trips));renderAll();
}
function deleteExpense(i,j){trips[activeTrip].expenses.splice(j,1);localStorage.setItem('travel_budget_v2',JSON.stringify(trips));renderAll();}
function renderAll(){renderStats();renderTabs();renderActiveTrip();renderCategoryChart();renderDailyChart();}
function renderStats(){
  const totalBudget=trips.reduce((s,t)=>s+(t.budget||0),0);
  const totalSpent=trips.reduce((s,t)=>s+t.expenses.reduce((ss,e)=>ss+e.amount,0),0);
  const totalTrips=trips.length;
  const totalExpenses=trips.reduce((s,t)=>s+t.expenses.length,0);
  const remaining=totalBudget-totalSpent;
  $('stats').innerHTML=`
    <div class="st"><div class="nm">¥${totalBudget}</div><div class="lb">总预算</div></div>
    <div class="st"><div class="nm" style="color:var(--danger)">¥${totalSpent}</div><div class="lb">已花费</div></div>
    <div class="st"><div class="nm" style="color:${remaining>=0?'var(--success)':'var(--danger)'}">¥${Math.abs(remaining)}</div><div class="lb">${remaining>=0?'剩余':'超支'}</div></div>
    <div class="st"><div class="nm">${totalTrips}</div><div class="lb">旅行计划</div></div>`;
}
function renderTabs(){
  $('tripTabs').innerHTML=trips.map((t,i)=>`<button class="list-btn ${activeTrip===i?'active':''}" onclick="selectTrip(${i})">
    ${t.name} <span onclick="event.stopPropagation();deleteTrip(${i})" style="margin-left:4px;cursor:pointer">✕</span></button>`).join('');
}
function renderActiveTrip(){
  if(activeTrip===null||!trips.length){$('activeTripArea').innerHTML='<div class="es">请选择或创建一个预算</div>';return;}
  const trip=trips[activeTrip];
  const spent=trip.expenses.reduce((s,e)=>s+e.amount,0);
  const remaining=trip.budget-spent;
  const pct=trip.budget?Math.min(100,Math.round(spent/trip.budget*100)):0;
  $('activeTripArea').innerHTML=`
    <div style="margin-bottom:12px">
      <div class="budget-header">
        <div><span style="font-size:.85rem;color:var(--text2)">📍 ${trip.dest||'未设置'}</span>
        ${trip.start?`<span class="tag">📅 ${trip.start}${trip.end?' → '+trip.end:''}</span>`:''}</div>
        <span class="budget-amount" style="color:${remaining>=0?'var(--success)':'var(--danger)'}">¥${Math.abs(remaining)} ${remaining>=0?'剩余':'超支'}</span>
      </div>
      <div class="progress-text"><span>已花费 ¥${spent} / ¥${trip.budget}</span><span>${pct}%</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${pct>90?'var(--danger)':pct>60?'var(--warn)':'var(--success)'}"></div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:600">📝 支出记录 (${trip.expenses.length})</span>
      <button onclick="addExpense()" style="padding:4px 12px;font-size:.8rem">+ 记一笔</button>
    </div>
    ${trip.expenses.length?trip.expenses.slice().reverse().map((e,i)=>{
      const origIdx=trip.expenses.length-1-i;
      const cat=CATEGORIES.find(c=>c.id===e.cat)||CATEGORIES[5];
      return `<div class="expense-item">
        <div class="expense-icon">${cat.icon}</div>
        <div class="expense-info"><div class="expense-name">${e.name}</div>
          <div class="expense-date">${e.date} · ${cat.name}${e.note?' · '+e.note:''}</div></div>
        <span class="expense-amount expense">-¥${e.amount}</span>
        <button class="dng" style="padding:2px 6px;font-size:.7rem" onclick="deleteExpense(${activeTrip},${origIdx})">✕</button>
      </div>`;
    }).join(''):'<div class="es">暂无支出记录</div>'}`;
}
function renderCategoryChart(){
  if(activeTrip===null||!trips.length){$('categoryChart').innerHTML='';return;}
  const trip=trips[activeTrip];
  const catTotals={};
  CATEGORIES.forEach(c=>{catTotals[c.id]=0;});
  trip.expenses.forEach(e=>{catTotals[e.cat]=(catTotals[e.cat]||0)+e.amount;});
  const maxVal=Math.max(...Object.values(catTotals),1);
  $('categoryChart').innerHTML=CATEGORIES.map(c=>{
    const val=catTotals[c.id]||0;
    const pct=Math.round(val/maxVal*100);
    return `<div class="chart-bar"><span class="chart-label">${c.icon} ${c.name}</span>
      <div class="chart-fill" style="width:${pct}%;background:${c.color}"></div>
      <span class="chart-val">¥${val}</span></div>`;
  }).join('');
}
function renderDailyChart(){
  if(activeTrip===null||!trips.length){$('dailyChart').innerHTML='';return;}
  const trip=trips[activeTrip];
  if(!trip.start||!trip.end){$('dailyChart').innerHTML='<div class="es">请设置起止日期以查看每日支出</div>';return;}
  const start=new Date(trip.start),end=new Date(trip.end);
  const days=[];const d=new Date(start);
  while(d<=end){days.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}
  const dailyTotals={};
  days.forEach(day=>{dailyTotals[day]=0;});
  trip.expenses.forEach(e=>{if(dailyTotals[e.date]!==undefined)dailyTotals[e.date]+=e.amount;});
  const maxDay=Math.max(...Object.values(dailyTotals),1);
  $('dailyChart').innerHTML=days.map(day=>{
    const val=dailyTotals[day]||0;
    const pct=Math.round(val/maxDay*100);
    return `<div class="chart-bar"><span class="chart-label">${day.slice(5)}</span>
      <div class="chart-fill" style="width:${pct}%;background:var(--accent)"></div>
      <span class="chart-val">¥${val}</span></div>`;
  }).join('');
}
function exportTrip(){
  if(activeTrip===null)return;
  const trip=trips[activeTrip];
  let text=`💰 ${trip.name} 预算报告\n${'━'.repeat(25)}\n\n`;
  text+=`目的地：${trip.dest||'未设置'}\n预算：¥${trip.budget}\n`;
  text+=`日期：${trip.start||'?'} → ${trip.end||'?'}\n\n`;
  const catTotals={};
  CATEGORIES.forEach(c=>{catTotals[c.id]=0;});
  trip.expenses.forEach(e=>{catTotals[e.cat]=(catTotals[e.cat]||0)+e.amount;});
  CATEGORIES.forEach(c=>{text+=`${c.icon} ${c.name}：¥${catTotals[c.id]||0}\n`;});
  const spent=trip.expenses.reduce((s,e)=>s+e.amount,0);
  text+=`\n总计：¥${spent} / ¥${trip.budget}\n剩余：¥${trip.budget-spent}\n\n`;
  text+='支出明细\n'+'-'.repeat(20)+'\n';
  trip.expenses.forEach(e=>{text+=`${e.date} ${e.name} ¥${e.amount} [${e.cat}]${e.note?' '+e.note:''}\n`;});
  const blob=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=trip.name+'预算报告.txt';a.click();
}
function clearAll(){if(confirm('确定清空所有预算数据？')){trips=[];activeTrip=null;localStorage.removeItem('travel_budget_v2');renderAll();}}
renderAll();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
