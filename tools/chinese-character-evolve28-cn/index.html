<div class="container"><h1>🧬 汉字进化28</h1><p class="sub">在线查看汉字进化过程</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="showEvolution()">
</div>
<button class="btn" onclick="showEvolution()">查看进化</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>

  '钢':{stages:[{era:'甲骨文',char:'⚙️',name:'形声字',desc:'从金冈声'},{era:'金文',char:'鋼',name:'形声字',desc:'金旁更加清晰'},{era:'小篆',char:'鋼',name:'形声字',desc:'规范化钢字'},{era:'隶书',char:'鋼',name:'繁体字',desc:'繁体钢字'},{era:'楷书',char:'钢',name:'简体字',desc:'现代简体写法'}]},
  '铁':{stages:[{era:'甲骨文',char:'🔗',name:'形声字',desc:'从金失声'},{era:'金文',char:'鐵',name:'形声字',desc:'金旁更加清晰'},{era:'小篆',char:'鐵',name:'形声字',desc:'规范化铁字'},{era:'隶书',char:'鐵',name:'繁体字',desc:'繁体铁字'},{era:'楷书',char:'铁',name:'简体字',desc:'现代简体写法'}]},
  '铜':{stages:[{era:'甲骨文',char:'🥉',name:'形声字',desc:'从金同声'},{era:'金文',char:'銅',name:'形声字',desc:'金旁更加清晰'},{era:'小篆',char:'銅',name:'形声字',desc:'规范化铜字'},{era:'隶书',char:'銅',name:'繁体字',desc:'繁体铜字'},{era:'楷书',char:'铜',name:'简体字',desc:'现代简体写法'}]},
  '银':{stages:[{era:'甲骨文',char:'🥈',name:'形声字',desc:'从金艮声'},{era:'金文',char:'銀',name:'形声字',desc:'金旁更加清晰'},{era:'小篆',char:'銀',name:'形声字',desc:'规范化银字'},{era:'隶书',char:'銀',name:'繁体字',desc:'繁体银字'},{era:'楷书',char:'银',name:'简体字',desc:'现代简体写法'}]},
  '铝':{stages:[{era:'甲骨文',char:'🪙',name:'形声字',desc:'从金吕声'},{era:'金文',char:'鋁',name:'形声字',desc:'金旁更加清晰'},{era:'小篆',char:'鋁',name:'形声字',desc:'规范化铝字'},{era:'隶书',char:'鋁',name:'繁体字',desc:'繁体铝字'},{era:'楷书',char:'铝',name:'简体字',desc:'现代简体写法'}]},
  '锡':{stages:[{era:'甲骨文',char:'🪙',name:'形声字',desc:'从金易声'},{era:'金文',char:'錫',name:'形声字',desc:'金旁更加清晰'},{era:'小篆',char:'錫',name:'形声字',desc:'规范化锡字'},{era:'隶书',char:'錫',name:'繁体字',desc:'繁体锡字'},{era:'楷书',char:'锡',name:'简体字',desc:'现代简体写法'}]},
  '铅':{stages:[{era:'甲骨文',char:'🪙',name:'形声字',desc:'从金㕣声'},{era:'金文',char:'鉛',name:'形声字',desc:'金旁更加清晰'},{era:'小篆',char:'鉛',name:'形声字',desc:'规范化铅字'},{era:'隶书',char:'鉛',name:'繁体字',desc:'繁体铅字'},{era:'楷书',char:'铅',name:'简体字',desc:'现代简体写法'}]},
  '锌':{stages:[{era:'甲骨文',char:'🪙',name:'形声字',desc:'从金辛声'},{era:'金文',char:'鋅',name:'形声字',desc:'金旁更加清晰'},{era:'小篆',char:'鋅',name:'形声字',desc:'规范化锌字'},{era:'隶书',char:'鋅',name:'繁体字',desc:'繁体锌字'},{era:'楷书',char:'锌',name:'简体字',desc:'现代简体写法'}]},
  '钻':{stages:[{era:'甲骨文',char:'💎',name:'形声字',desc:'从金占声'},{era:'金文',char:'鑽',name:'形声字',desc:'金旁更加清晰'},{era:'小篆',char:'鑽',name:'形声字',desc:'规范化钻字'},{era:'隶书',char:'鑽',name:'繁体字',desc:'繁体钻字'},{era:'楷书',char:'钻',name:'简体字',desc:'现代简体写法'}]},
  '镜':{stages:[{era:'甲骨文',char:'🪞',name:'形声字',desc:'从金竟声'},{era:'金文',char:'鏡',name:'形声字',desc:'金旁更加清晰'},{era:'小篆',char:'鏡',name:'形声字',desc:'规范化镜字'},{era:'隶书',char:'鏡',name:'繁体字',desc:'繁体镜字'},{era:'楷书',char:'镜',name:'简体字',desc:'现代简体写法'}]}
};
function showEvolution(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=evolutionData[char];
  if(!data){
    data={stages:[{era:'古代',char:char,name:'汉字',desc:'暂无详细进化信息'},{era:'现代',char:char,name:'标准字',desc:'现代标准写法'}]};
  }
  var html='<div class="card">';
  html+='<div style="text-align:center;margin-bottom:20px">';
  html+='<div style="font-size:4rem;font-weight:700;color:var(--blue)">'+char+'</div>';
  html+='<div style="font-size:1.1rem;color:var(--text2);margin-top:8px">汉字进化历程</div>';
  html+='</div>';
  html+='<div class="evolution-timeline">';
  data.stages.forEach(function(stage,index){
    html+='<div class="evolution-stage">';
    html+='<div class="evolution-char">'+stage.char+'</div>';
    html+='<div class="evolution-info">';
    html+='<div class="evolution-era">'+stage.era+'</div>';
    html+='<div class="evolution-name">'+stage.name+'</div>';
    html+='<div class="evolution-desc">'+stage.desc+'</div>';
    html+='</div>';
    if(index<data.stages.length-1){
      html+='<div class="evolution-line"></div>';
    }
    html+='</div>';
  });
  html+='</div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(evolutionData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showEvolution();
}
showEvolution();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
