<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 帕累托图</title>
<meta name="description" content="帕累托图工具，80/20法则可视化分析">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
button.grn{background:var(--green)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.item-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--border)}
.item-row input{margin-bottom:0;flex:1}
.item-row input[type=number]{width:100px}
.item-row button{padding:4px 10px;font-size:.8rem}
.chart-wrap{position:relative;width:100%;height:350px;margin-top:12px}
canvas{width:100%!important;height:100%!important;border:1px solid var(--border);border-radius:8px}
.data-table{width:100%;border-collapse:collapse;margin-top:12px}
.data-table th,.data-table td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:.85rem}
.data-table th{color:var(--text2);font-weight:600}
.data-table tr:hover{background:rgba(59,130,246,.05)}
.data-table .vital{background:rgba(63,185,80,.08)}
.vital-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;background:rgba(63,185,80,.15);color:var(--green);font-weight:600}
.hidden{display:none!important}
@media(max-width:600px){body{padding:10px}.item-row{flex-wrap:wrap}.item-row input{min-width:100px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📊 帕累托图">
<meta property="og:description" content="帕累托图工具，80/20法则可视化分析">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/pareto-chart-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='pareto_data';
let analyses=JSON.parse(localStorage.getItem(STORE)||'[]');
let curIdx=-1;
const TEMPLATES={defect:{name:'缺陷分析',items:[{name:'UI错位',value:45},{name:'空指针',value:30},{name:'超时',value:20},{name:'内存泄漏',value:12},{name:'样式错乱',value:8},{name:'权限错误',value:5}]},complaint:{name:'客户投诉分析',items:[{name:'物流延迟',value:80},{name:'产品质量',value:55},{name:'客服态度',value:30},{name:'价格争议',value:18},{name:'包装破损',value:10}]},cost:{name:'成本分析',items:[{name:'人工成本',value:120},{name:'原材料',value:85},{name:'设备折旧',value:45},{name:'水电费',value:25},{name:'管理费用',value:15},{name:'其他',value:8}]},time:{name:'时间分配',items:[{name:'会议',value:180},{name:'邮件',value:90},{name:'编码',value:240},{name:'调试',value:120},{name:'文档',value:60},{name:'沟通',value:45}]}}; 
function save(){localStorage.setItem(STORE,JSON.stringify(analyses))}
function render(){
  let h=`<div class="hdr"><h1>📊 帕累托图</h1><p>80/20法则可视化分析</p></div>`;
  h+=`<div class="flex" style="justify-content:center;margin-bottom:16px"><button onclick="newAnalysis()">+ 新建分析</button>`;
  h+=`<select onchange="if(this.value)loadTemplate(this.value)" style="min-width:140px"><option value="">加载模板...</option><option value="defect">缺陷分析</option><option value="complaint">客户投诉</option><option value="cost">成本分析</option><option value="time">时间分配</option></select>`;
  if(analyses.length>0)h+=`<select onchange="curIdx=parseInt(this.value);render()" style="min-width:150px"><option value="-1">选择分析</option>${analyses.map((a,i)=>`<option value="${i}"${i===curIdx?' selected':''}>${a.name}</option>`).join('')}</select>`;
  h+=`</div>`;
  if(curIdx>=0&&curIdx<analyses.length){
    const a=analyses[curIdx];
    h+=`<div class="cd"><div class="flex-between"><input type="text" value="${a.name}" onchange="analyses[${curIdx}].name=this.value;save()" style="width:250px;margin-bottom:0;font-weight:700" placeholder="分析名称"><div class="flex"><button class="dng" style="padding:6px 12px;font-size:.8rem" onclick="delAnalysis()">删除</button></div></div></div>`;
    h+=`<div class="cd"><h2>数据输入 <button class="sec" style="float:right;padding:4px 12px;font-size:.8rem" onclick="addItem()">+ 添加</button></h2>`;
    a.items.forEach((item,i)=>{h+=`<div class="item-row"><input type="text" value="${item.name}" placeholder="名称" onchange="analyses[${curIdx}].items[${i}].name=this.value;save();render()"><input type="number" value="${item.value}" min="0" placeholder="值" onchange="analyses[${curIdx}].items[${i}].value=parseFloat(this.value)||0;save();render()"><button class="dng" onclick="removeItem(${i})">✕</button></div>`;});
    h+=`</div>`;
    const sorted=a.items.slice().sort((a,b)=>b.value-a.value);
    const total=sorted.reduce((s,i)=>s+i.value,0);
    let cumPct=0;const cumData=sorted.map(i=>{cumPct+=i.value/total*100;return{...i,pct:(i.value/total*100).toFixed(1),cumPct:cumPct.toFixed(1)}});
    const vitalIdx=cumData.findIndex(d=>parseFloat(d.cumPct)>=80);
    h+=`<div class="cd"><h2>帕累托图</h2><div class="chart-wrap"><canvas id="paretoChart"></canvas></div></div>`;
    h+=`<div class="cd"><h2>数据表</h2><table class="data-table"><thead><tr><th>#</th><th>项目</th><th>值</th><th>占比</th><th>累计占比</th><th>分类</th></tr></thead><tbody>`;
    cumData.forEach((d,i)=>{const isVital=i<=vitalIdx;h+=`<tr class="${isVital?'vital':''}"><td>${i+1}</td><td>${d.name}</td><td>${d.value}</td><td>${d.pct}%</td><td>${d.cumPct}%</td><td>${isVital?'<span class="vital-badge">关键少数</span>':'<span style="color:var(--text2)">次要多数</span>'}</td></tr>`;});
    h+=`</tbody></table></div>`;
    h+=`<div class="bg" style="justify-content:center"><button onclick="exportChart()">导出图片</button><button class="sec" onclick="exportReport()">导出报告</button></div>`;
  }
  $('app').innerHTML=h;
  if(curIdx>=0)drawChart();
}
function addItem(){analyses[curIdx].items.push({name:'',value:0});save();render()}
function removeItem(i){analyses[curIdx].items.splice(i,1);save();render()}
function newAnalysis(){const name=prompt('请输入分析名称：','新帕累托分析');if(!name)return;analyses.push({name,items:[{name:'项目1',value:100},{name:'项目2',value:60},{name:'项目3',value:30}]});curIdx=analyses.length-1;save();render()}
function delAnalysis(){if(!confirm('确定删除？'))return;analyses.splice(curIdx,1);curIdx=analyses.length>0?0:-1;save();render()}
function loadTemplate(t){const tpl=TEMPLATES[t];if(!tpl)return;analyses.push({name:tpl.name,items:JSON.parse(JSON.stringify(tpl.items))});curIdx=analyses.length-1;save();render()}
function drawChart(){
  const canvas=$('paretoChart');if(!canvas)return;
  const a=analyses[curIdx];
  const ctx=canvas.getContext('2d');
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width*2;canvas.height=rect.height*2;ctx.scale(2,2);
  const W=rect.width,H=rect.height;
  const pad={t:30,r:60,b:60,l:60};
  const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  ctx.clearRect(0,0,W,H);
  const sorted=a.items.slice().sort((a,b)=>b.value-a.value);
  if(sorted.length===0)return;
  const total=sorted.reduce((s,i)=>s+i.value,0);
  const maxVal=sorted[0].value;
  const barW=Math.min(cW/sorted.length*.7,60);
  const gap=(cW-barW*sorted.length)/(sorted.length+1);
  ctx.strokeStyle='rgba(128,128,128,.3)';ctx.lineWidth=.5;
  for(let i=0;i<=5;i++){const y=pad.t+cH-cH*(i/5);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillText(Math.round(maxVal*i/5),pad.l-5,y+4);}
  for(let i=0;i<=5;i++){const y=pad.t+cH-cH*(i/5);ctx.fillStyle='#8b949e';ctx.textAlign='left';ctx.fillText(`${i*20}%`,pad.l+cW+5,y+4);}
  let cumPct=0;
  ctx.beginPath();ctx.strokeStyle='#f97316';ctx.lineWidth=2;
  sorted.forEach((item,i)=>{
    const x=pad.l+gap+(barW+gap)*i+barW/2;
    const bH=cH*(item.value/maxVal);
    ctx.fillStyle='#3b82f6';ctx.fillRect(pad.l+gap+(barW+gap)*i,pad.t+cH-bH,barW,bH);
    ctx.fillStyle='#e6edf3';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
    ctx.fillText(item.value,x,pad.t+cH-bH-5);
    cumPct+=item.value/total*100;
    const y=pad.t+cH-cH*(cumPct/100);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    ctx.fillStyle='#f97316';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8b949e';ctx.font='9px sans-serif';ctx.textAlign='center';
    ctx.fillText(item.name,x,pad.t+cH+16);
  });
  ctx.stroke();
  const y80=pad.t+cH-cH*0.8;
  ctx.setLineDash([5,5]);ctx.strokeStyle='var(--red)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad.l,y80);ctx.lineTo(pad.l+cW,y80);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#f85149';ctx.font='10px sans-serif';ctx.textAlign='left';ctx.fillText('80%线',pad.l+cW+5,y80+4);
  ctx.fillStyle='#3b82f6';ctx.fillRect(pad.l,pad.t-15,10,10);ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';ctx.fillText('值',pad.l+14,pad.t-6);
  ctx.fillStyle='#f97316';ctx.fillRect(pad.l+50,pad.t-15,10,10);ctx.fillText('累计%',pad.l+64,pad.t-6);
}
function exportChart(){const c=$('paretoChart');if(!c)return;const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='pareto-chart.png';a.click()}
function exportReport(){
  const a=analyses[curIdx];const sorted=a.items.slice().sort((a,b)=>b.value-a.value);
  const total=sorted.reduce((s,i)=>s+i.value,0);let cumPct=0;
  let txt=`帕累托分析报告: ${a.name}\n${'═'.repeat(40)}\n\n`;
  sorted.forEach((item,i)=>{cumPct+=item.value/total*100;txt+=`${i+1}. ${item.name}: ${item.value} (${(item.value/total*100).toFixed(1)}%, 累计${cumPct.toFixed(1)}%)\n`;});
  const vitalIdx=sorted.findIndex((_,i)=>{let c=0;for(let j=0;j<=i;j++)c+=sorted[j].value/total*100;return c>=80;});
  txt+=`\n关键少数(前${vitalIdx+1}项): ${sorted.slice(0,vitalIdx+1).map(i=>i.name).join('、')}\n`;
  navigator.clipboard.writeText(txt).then(()=>alert('已复制到剪贴板！')).catch(()=>alert('复制失败'));
}
render();
</script>
</body>
</html>
