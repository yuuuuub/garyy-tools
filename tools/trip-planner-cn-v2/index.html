<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行策划器 v2</title>
<meta property="og:title" content="旅行策划器 v2">
<meta property="og:description" content="制定完美的旅行行程计划">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="旅行策划工具，制定完整的旅行路线方案">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:16px;min-height:100vh;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.gr .st{text-align:center;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.gr .st .nm{font-size:1.4rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.75rem;color:var(--text2);margin-top:4px}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text);margin-right:4px;margin-bottom:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.trip-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.trip-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.trip-name{font-size:1.1rem;font-weight:600}
.day-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px}
.day-title{font-weight:600;font-size:.95rem;margin-bottom:8px;color:var(--accent)}
.slot{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--border);font-size:.85rem}
.slot:last-child{border-bottom:none}
.slot-time{min-width:50px;font-weight:600;color:var(--accent)}
.slot-cat{font-size:1.1rem}
.slot-info{flex:1}
.slot-cost{color:var(--warn);font-weight:600;font-size:.8rem}
.hidden{display:none}
.budget-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px}
.budget-fill{height:100%;border-radius:3px;transition:width .3s}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.cat-tab{padding:3px 10px;border-radius:12px;font-size:.75rem;background:var(--bg);border:1px solid var(--border);cursor:pointer;color:var(--text2);transition:all .15s}
.cat-tab:hover,.cat-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:.85rem}th{color:var(--text2);font-weight:600}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🗺️ 旅行策划器 v2</h1><p>制定完美的旅行行程计划</p></div>

<div class="gr" id="stats"></div>

<div class="cd"><h2>✈️ 创建旅行</h2>
<input type="hidden" id="editTripIdx" value="-1">
<label>旅行名称</label><input type="text" id="tripName" placeholder="如：日本7日游">
<label>目的地</label><input type="text" id="tripDest" placeholder="目的地">
<div class="fr">
<div><label>出发日期</label><input type="date" id="tripStart"></div>
<div><label>返回日期</label><input type="date" id="tripEnd"></div>
</div>
<div class="fr">
<div><label>预算（元）</label><input type="number" id="tripBudget" placeholder="预算"></div>
<div><label>人数</label><input type="number" id="tripPeople" placeholder="人数" min="1" value="1"></div>
</div>
<label>备注</label><textarea id="tripNote" placeholder="旅行备注"></textarea>
<div class="bg">
<button onclick="saveTrip()" id="tripBtn">💾 保存旅行</button>
<button class="sec" onclick="resetTripForm()">🔄 重置</button>
</div></div>

<div id="tripsList"><div class="es">暂无旅行计划</div></div>
</div>

<script>
const CATS=[{k:'food',e:'🍜',l:'美食'},{k:'transport',e:'🚗',l:'交通'},{k:'attraction',e:'🏛️',l:'景点'},{k:'hotel',e:'🏨',l:'住宿'},{k:'other',e:'📋',l:'其他'}];
let trips=JSON.parse(localStorage.getItem('trip_planner_v2')||'[]');
function $(id){return document.getElementById(id)}
function saveTrip(){
  const name=$('tripName').value.trim(),dest=$('tripDest').value.trim();
  const start=$('tripStart').value,end=$('tripEnd').value;
  const budget=parseFloat($('tripBudget').value)||0,people=parseInt($('tripPeople').value)||1;
  const note=$('tripNote').value.trim();
  if(!name||!dest){alert('请填写旅行名称和目的地');return;}
  const idx=parseInt($('editTripIdx').value);
  const trip={name,dest,start,end,budget,people,note,days:idx>=0?trips[idx].days:[],createdAt:new Date().toISOString()};
  if(idx>=0){trips[idx]={...trips[idx],...trip};}
  else{trips.push(trip);}
  localStorage.setItem('trip_planner_v2',JSON.stringify(trips));
  resetTripForm();renderTrips();
}
function resetTripForm(){
  $('tripName').value='';$('tripDest').value='';$('tripStart').value='';$('tripEnd').value='';
  $('tripBudget').value='';$('tripPeople').value='1';$('tripNote').value='';
  $('editTripIdx').value='-1';$('tripBtn').textContent='💾 保存旅行';
}
function editTrip(i){
  const t=trips[i];$('tripName').value=t.name;$('tripDest').value=t.dest;
  $('tripStart').value=t.start||'';$('tripEnd').value=t.end||'';
  $('tripBudget').value=t.budget||'';$('tripPeople').value=t.people||1;
  $('tripNote').value=t.note||'';$('editTripIdx').value=i;$('tripBtn').textContent='✏️ 更新旅行';
  window.scrollTo({top:0,behavior:'smooth'});
}
function deleteTrip(i){if(confirm('确定删除此旅行？')){trips.splice(i,1);localStorage.setItem('trip_planner_v2',JSON.stringify(trips));renderTrips();}}
function addDay(ti){
  trips[ti].days.push({slots:[]});
  localStorage.setItem('trip_planner_v2',JSON.stringify(trips));renderTrips();
}
function deleteDay(ti,di){if(confirm('删除这一天？')){trips[ti].days.splice(di,1);localStorage.setItem('trip_planner_v2',JSON.stringify(trips));renderTrips();}}
function addSlot(ti,di){
  const time=prompt('时间（如 09:00）');if(!time)return;
  const catIdx=prompt('类别编号：0=美食 1=交通 2=景点 3=住宿 4=其他')||4;
  const activity=prompt('活动内容');if(!activity)return;
  const location=prompt('地点（可选）')||'';
  const cost=parseFloat(prompt('费用（元，可选）'))||0;
  trips[ti].days[di].slots.push({time,cat:CATS[parseInt(catIdx)]?.k||'other',activity,location,cost});
  localStorage.setItem('trip_planner_v2',JSON.stringify(trips));renderTrips();
}
function deleteSlot(ti,di,si){trips[ti].days[di].slots.splice(si,1);localStorage.setItem('trip_planner_v2',JSON.stringify(trips));renderTrips();}
function renderTrips(){
  if(!trips.length){$('tripsList').innerHTML='<div class="es">暂无旅行计划</div>';updateStats();return;}
  $('tripsList').innerHTML=trips.map((t,i)=>{
    const days=t.days||[];
    const totalCost=days.reduce((s,d)=>s+d.slots.reduce((ss,sl)=>ss+(sl.cost||0),0),0);
    const totalSlots=days.reduce((s,d)=>s+d.slots.length,0);
    const budgetPct=t.budget?Math.min(100,Math.round(totalCost/t.budget*100)):0;
    return `<div class="trip-card">
      <div class="trip-header"><span class="trip-name">✈️ ${t.name}</span>
      <div style="display:flex;gap:6px">
        <button class="sec" style="padding:4px 10px;font-size:.8rem" onclick="editTrip(${i})">✏️</button>
        <button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="deleteTrip(${i})">🗑️</button>
      </div></div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">
        <span class="tag s">📍 ${t.dest}</span>
        ${t.start?`<span class="tag">📅 ${t.start}</span>`:''}
        ${t.end?`<span class="tag">📅 ${t.end}</span>`:''}
        <span class="tag w">👥 ${t.people}人</span>
        ${t.budget?`<span class="tag">💰 ¥${t.budget}</span>`:''}
      </div>
      ${t.budget?`<div style="font-size:.8rem;color:var(--text2)">已花费 ¥${totalCost} / ¥${t.budget} (${budgetPct}%)</div>
      <div class="budget-bar"><div class="budget-fill" style="width:${budgetPct}%;background:${budgetPct>90?'var(--danger)':budgetPct>60?'var(--warn)':'var(--success)'}"></div></div>`:''}
      ${t.note?`<div style="font-size:.85rem;color:var(--text2);margin-top:6px">${t.note}</div>`:''}
      <div style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:600;font-size:.9rem">📅 行程安排 (${days.length}天)</span>
          <button class="sec" style="padding:3px 10px;font-size:.75rem" onclick="addDay(${i})">+ 添加天</button>
        </div>
        ${days.map((day,di)=>`<div class="day-card">
          <div class="day-title">第${di+1}天
            <button class="dng" style="padding:2px 8px;font-size:.7rem;float:right" onclick="deleteDay(${i},${di})">删除</button>
          </div>
          ${day.slots.length?day.slots.map((sl,si)=>{
            const cat=CATS.find(c=>c.k===sl.cat)||CATS[4];
            return `<div class="slot">
              <span class="slot-time">${sl.time}</span>
              <span class="slot-cat">${cat.e}</span>
              <span class="slot-info">${sl.activity}${sl.location?' · '+sl.location:''}</span>
              ${sl.cost?`<span class="slot-cost">¥${sl.cost}</span>`:''}
              <button class="dng" style="padding:1px 6px;font-size:.7rem" onclick="deleteSlot(${i},${di},${si})">×</button>
            </div>`;
          }).join(''):'<div style="padding:8px;color:var(--text2);font-size:.85rem">暂无活动</div>'}
          <button class="sec" style="padding:3px 10px;font-size:.75rem;margin-top:6px" onclick="addSlot(${i},${di})">+ 添加活动</button>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
  updateStats();
}
function updateStats(){
  const totalTrips=trips.length;
  const totalDays=trips.reduce((s,t)=>s+(t.days||[]).length,0);
  const totalCost=trips.reduce((s,t)=>s+(t.days||[]).reduce((ss,d)=>ss+d.slots.reduce((sss,sl)=>sss+(sl.cost||0),0),0),0);
  const totalActivities=trips.reduce((s,t)=>s+(t.days||[]).reduce((ss,d)=>ss+d.slots.length,0),0);
  $('stats').innerHTML=`
    <div class="st"><div class="nm">${totalTrips}</div><div class="lb">旅行计划</div></div>
    <div class="st"><div class="nm">${totalDays}</div><div class="lb">总天数</div></div>
    <div class="st"><div class="nm">${totalActivities}</div><div class="lb">活动数</div></div>
    <div class="st"><div class="nm">¥${totalCost}</div><div class="lb">总花费</div></div>`;
}
renderTrips();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
