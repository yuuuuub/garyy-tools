<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寻物神技 - 找失物工具</title>
<meta name="description" content="寻物神技 - 基于传统玄学方法的失物寻找工具，截路空亡、十二建星、方位定位">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="寻物神技 - 找失物工具">
<meta property="og:description" content="基于传统玄学方法的失物寻找工具，截路空亡、十二建星、方位定位">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--purple:#8b5cf6}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--purple:#8250df}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:20px;line-height:1.6}
.container{max-width:700px;margin:0 auto}
header{text-align:center;padding:30px 0 20px}
header h1{font-size:2rem;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{color:var(--text2);font-size:1rem}
.input-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px;margin-bottom:20px}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:8px;font-weight:600;color:var(--text);font-size:1rem}
.form-group input,.form-group select{width:100%;padding:12px 15px;border:2px solid var(--border);border-radius:8px;font-size:1rem;background:var(--bg);color:var(--text);transition:border-color .3s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--blue)}
.btn-primary{width:100%;padding:15px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border:none;border-radius:8px;font-size:1.2em;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(59,130,246,.4)}
.btn-primary:active{transform:translateY(0)}
.result-section{margin-top:20px}
.result-item{margin-bottom:20px;padding:20px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:12px}
.result-item h3{color:var(--blue);margin-bottom:12px;font-size:1.1em}
.result-content{font-size:1em;line-height:1.8;color:var(--text)}
.status{display:inline-block;padding:5px 15px;border-radius:20px;font-weight:600;margin-left:10px;font-size:.9em}
.status.success{background:rgba(35,134,54,.15);color:var(--green)}
.status.warning{background:rgba(210,153,34,.15);color:#d29922}
.status.danger{background:rgba(239,68,68,.15);color:var(--red)}
.status.info{background:rgba(59,130,246,.15);color:var(--blue)}
footer{padding:20px;text-align:center;color:var(--text2);font-size:.88rem;margin-top:20px;border-top:1px solid var(--border)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:12px}header h1{font-size:1.6rem}.input-section{padding:20px}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>🔍 寻物神技</h1>
<p class="subtitle">基于传统玄学方法的失物寻找工具</p>
</header>
<div class="input-section">
<div class="form-group">
<label for="date">丢失日期：</label>
<input type="date" id="date" required>
</div>
<div class="form-group">
<label for="time">丢失时辰：</label>
<select id="time" required>
<option value="">请选择时辰</option>
<option value="0">子时 (23:00-01:00)</option>
<option value="1">丑时 (01:00-03:00)</option>
<option value="2">寅时 (03:00-05:00)</option>
<option value="3">卯时 (05:00-07:00)</option>
<option value="4">辰时 (07:00-09:00)</option>
<option value="5">巳时 (09:00-11:00)</option>
<option value="6">午时 (11:00-13:00)</option>
<option value="7">未时 (13:00-15:00)</option>
<option value="8">申时 (15:00-17:00)</option>
<option value="9">酉时 (17:00-19:00)</option>
<option value="10">戌时 (19:00-21:00)</option>
<option value="11">亥时 (21:00-23:00)</option>
</select>
</div>
<button id="searchBtn" class="btn-primary">开始寻找</button>
</div>
<div id="result" class="result-section" style="display:none">
<div class="result-card">
<h2 style="text-align:center;margin-bottom:16px;color:var(--blue)">📊 寻找结果</h2>
<div class="result-item"><h3>第一步：能否找回？</h3><div id="step1" class="result-content"></div></div>
<div class="result-item"><h3>第二步：距离判断</h3><div id="step2" class="result-content"></div></div>
<div class="result-item"><h3>第三步：寻找方向</h3><div id="step3" class="result-content"></div></div>
<div class="result-item"><h3>第四步：具体位置</h3><div id="step4" class="result-content"></div></div>
</div>
</div>
<footer>
<p><strong>温馨提示：</strong>玄学本质是概率学，不是万能的，但能帮我们少走90%的弯路。</p>
<p style="margin-top:6px;font-size:.8rem">来源：<a href="https://github.com/yuuuuub/xunwu-tool" target="_blank" style="color:var(--blue)">GitHub 寻物神技</a></p>
</footer>
</div>
<script src="../i18n.js" defer></script>
<script>
var TIAN_GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var DI_ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var SHI_CHEN=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var JIE_LU_KONG_WANG={'甲':['申','酉'],'己':['申','酉'],'乙':['午','未'],'庚':['午','未'],'丙':['辰','巳'],'辛':['辰','巳'],'丁':['寅','卯'],'壬':['寅','卯'],'戊':['子','丑'],'癸':['子','丑']};
var JIAN_XING=['建','除','满','平','定','执','破','危','成','收','开','闭'];
var JIAN_XING_FANG_WEI={'建':{bagua:'兑',direction:'正西'},'除':{bagua:'兑',direction:'正西'},'破':{bagua:'乾',direction:'西北'},'成':{bagua:'乾',direction:'西北'},'开':{bagua:'离',direction:'正南'},'闭':{bagua:'离',direction:'正南'},'危':{bagua:'坎',direction:'正北'},'定':{bagua:'坤',direction:'西南'},'执':{bagua:'巽',direction:'东南'},'满':{bagua:'艮',direction:'东北'},'平':{bagua:'震',direction:'正东'},'收':{bagua:'震',direction:'正东'}};
var SHI_CHEN_DING_WEI={'子':'去有木质家具、绿植的地方，比如书架旁、阳台花盆边','丑':'去有木质家具、绿植的地方，比如书架旁、阳台花盆边','寅':'找高处或有坡度的地方，比如衣柜顶层、楼梯转角','卯':'找高处或有坡度的地方，比如衣柜顶层、楼梯转角','辰':'先问家人朋友，说不定是他们帮忙收起来了','巳':'先问家人朋友，说不定是他们帮忙收起来了','午':'在桌子、柜子、抽屉等平面处找','未':'在桌子、柜子、抽屉等平面处找','申':'顺着当天走过的路往回找，可能掉在路边或被人捡到','酉':'顺着当天走过的路往回找，可能掉在路边或被人捡到','戌':'找悬空的"半腰"位置，比如裤脚卷边、书包侧袋','亥':'找悬空的"半腰"位置，比如裤脚卷边、书包侧袋'};

function getGanZhi(date){
  var baseDate=new Date(1900,0,31);
  var daysDiff=Math.floor((date-baseDate)/(1000*60*60*24));
  var ganIndex=(daysDiff%10+10)%10;
  var zhiIndex=(daysDiff%12+12)%12;
  return{gan:TIAN_GAN[ganIndex],zhi:DI_ZHI[zhiIndex],ganIndex:ganIndex,zhiIndex:zhiIndex};
}

function getJianXingSimple(date){
  var startOfYear=new Date(date.getFullYear(),0,1);
  var daysFromYearStart=Math.floor((date-startOfYear)/(1000*60*60*24))+1;
  return JIAN_XING[(daysFromYearStart-1)%12];
}

function getKongWangKouJue(gan){
  var m={'甲':'甲己申酉最为愁','己':'甲己申酉最为愁','乙':'乙庚午未不须求','庚':'乙庚午未不须求','丙':'丙辛之日空辰巳','辛':'丙辛之日空辰巳','丁':'丁壬寅卯一场空','壬':'丁壬寅卯一场空','戊':'戊癸子丑何劳问','癸':'戊癸子丑何劳问'};
  return m[gan]||'';
}

function checkJieLuKongWang(gan,shiChenZhi){
  var kw=JIE_LU_KONG_WANG[gan];
  if(!kw)return{canFind:true,message:'未匹配到天干，建议尝试寻找'};
  if(kw.includes(shiChenZhi)){
    return{canFind:false,message:'❌ 落空！根据口诀"'+getKongWangKouJue(gan)+'"，'+gan+'日'+shiChenZhi+'时落空，找回来的概率很低。',status:'danger'};
  }else{
    return{canFind:true,message:'✅ 未落空！根据口诀"'+getKongWangKouJue(gan)+'"，'+gan+'日'+shiChenZhi+'时未落空，可以尝试寻找。',status:'success'};
  }
}

function checkDistance(jianXing){
  var m={
    '满':{distance:'自归家',message:'🎉 满日：不用找，东西会自己出现！',status:'success'},
    '成':{distance:'自归家',message:'🎉 成日：不用找，东西会自己出现！',status:'success'},
    '定':{distance:'自归家',message:'🎉 定日：不用找，东西会自己出现！',status:'success'},
    '执':{distance:'自归家',message:'🎉 执日：不用找，东西会自己出现！',status:'success'},
    '危':{distance:'在近处',message:'📍 危日：在近处，比如家中、办公室周围',status:'info'},
    '收':{distance:'在近处',message:'📍 收日：在近处，比如家中、办公室周围',status:'info'},
    '开':{distance:'在远处',message:'🚶 开日：在远处，可能要去常去的街道、车站找',status:'warning'},
    '除':{distance:'在远处',message:'🚶 除日：在远处，可能要去常去的街道、车站找',status:'warning'},
    '建':{distance:'莫寻他',message:'⚠️ 建日：找回来的概率极低',status:'danger'},
    '平':{distance:'莫寻他',message:'⚠️ 平日：找回来的概率极低',status:'danger'},
    '破':{distance:'莫寻他',message:'⚠️ 破日：找回来的概率极低',status:'danger'},
    '闭':{distance:'莫寻他',message:'⚠️ 闭日：找回来的概率极低',status:'danger'}
  };
  return m[jianXing]||{distance:'未知',message:'无法判断距离',status:'warning'};
}

function getDirection(jianXing){
  var fw=JIAN_XING_FANG_WEI[jianXing];
  if(!fw)return{bagua:'未知',direction:'未知',message:'无法判断方位'};
  return{bagua:fw.bagua,direction:fw.direction,message:'🧭 '+jianXing+'日对应'+fw.bagua+'卦，方位：'+fw.direction};
}

function getLocation(shiChenZhi){
  var loc=SHI_CHEN_DING_WEI[shiChenZhi];
  return loc?'🔍 '+shiChenZhi+'时：'+loc:'无法判断具体位置';
}

function handleSearch(){
  var dateInput=document.getElementById('date').value;
  var timeSelect=document.getElementById('time').value;
  if(!dateInput||timeSelect===''){alert('请填写完整的日期和时辰信息！');return;}
  var parts=dateInput.split('-').map(Number);
  var y=parts[0],m=parts[1],d=parts[2];
  var date=new Date(y,m-1,d);
  var shiChenIndex=parseInt(timeSelect);
  var shiChenZhi=SHI_CHEN[shiChenIndex];
  var gz=getGanZhi(date);
  var gan=gz.gan,zhi=gz.zhi;
  var jianXing=getJianXingSimple(date);
  var step1=checkJieLuKongWang(gan,shiChenZhi);
  var step2=checkDistance(jianXing);
  var step3=getDirection(jianXing);
  var step4=getLocation(shiChenZhi);
  displayResults(step1,step2,step3,step4,gan,zhi,jianXing,shiChenZhi);
}

function displayResults(step1,step2,step3,step4,gan,zhi,jianXing,shiChenZhi){
  var resultSection=document.getElementById('result');
  resultSection.style.display='block';
  var dateInfo=gan+zhi+'日';
  document.getElementById('step1').innerHTML='<p>日期：'+dateInfo+'，时辰：'+shiChenZhi+'时</p><p>'+step1.message+' <span class="status '+step1.status+'">'+(step1.canFind?'可寻找':'难找回')+'</span></p>';
  document.getElementById('step2').innerHTML='<p>当日建星：<strong>'+jianXing+'日</strong></p><p>'+step2.message+' <span class="status '+step2.status+'">'+step2.distance+'</span></p>';
  document.getElementById('step3').innerHTML='<p>'+step3.message+'</p><p>重点往<strong>'+step3.direction+'</strong>方向寻找</p>';
  document.getElementById('step4').innerHTML='<p>'+step4+'</p>';
  resultSection.scrollIntoView({behavior:'smooth',block:'start'});
}

document.getElementById('searchBtn').addEventListener('click',handleSearch);
document.getElementById('date').addEventListener('keypress',function(e){if(e.key==='Enter')handleSearch()});
document.getElementById('time').addEventListener('keypress',function(e){if(e.key==='Enter')handleSearch()});
document.getElementById('date').value=new Date().toISOString().split('T')[0];
</script>
</body></html>
