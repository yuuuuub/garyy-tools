document.getElementById('method').addEventListener('change',function(){
  document.getElementById('numberInput').style.display=this.value==='number'?'block':'none';
});

function divination(){
  var q=document.getElementById('question').value.trim();
  if(!q){alert('请输入你要寻找的物品');return;}
  var method=document.getElementById('method').value;
  var guaName,gua;
  
  if(method==='coin'){
    guaName=coinDivination();
  }else if(method==='time'){
    guaName=timeDivination();
  }else if(method==='number'){
    var nums=document.getElementById('numInput').value.trim().split(/[,，\s]+/).map(Number);
    if(nums.length<2||nums.some(isNaN)){alert('请输入两个有效数字');return;}
    guaName=numberDivination(nums[0],nums[1]);
  }else{
    guaName=randomDivination();
  }
  
  gua=guaData[guaName];
  if(!gua){alert('占卜失败，请重试');return;}
  
  var now=new Date();
  var timeStr=now.toLocaleString('zh-CN');
  
  var html='<div class="card result">';
  html+='<div class="section-title">🔮 占卜结果</div>';
  html+='<div class="gua-card">';
  html+='<div class="gua-name">'+gua.name+'</div>';
  html+='<div class="gua-lines">'+gua.symbol+'</div>';
  html+='<div style="text-align:center"><span class="tag">'+gua.fortune+'</span> <span class="tag">'+gua.element+'</span> <span class="tag">'+gua.direction+'</span></div>';
  html+='<div class="gua-info">';
  html+='<p><strong>卦象：</strong>'+gua.meaning+'</p>';
  html+='<p><strong>寻物指导：</strong>'+gua.advice+'</p>';
  html+='<p><strong>占卜时间：</strong>'+timeStr+'</p>';
  html+='<p><strong>占卜方法：</strong>'+getMethodName(method)+'</p>';
  html+='<p><strong>所问之事：</strong>'+q+'</p>';
  html+='</div></div></div>';
  
  document.getElementById('result').innerHTML=html;
  document.getElementById('result').style.display='block';
  
  // 保存历史
  history.unshift({question:q,gua:gua.name,time:timeStr,fortune:gua.fortune});
  if(history.length>20)history=history.slice(0,20);
  localStorage.setItem('xunwu_history',JSON.stringify(history));
  renderHistory();
}

function renderHistory(){
  var el=document.getElementById('history');
  if(history.length===0){el.innerHTML='<div class="empty">暂无占卜记录</div>';return;}
  var html='';
  history.forEach(function(h,i){
    html+='<div class="history-item" onclick="showHistory('+i+')">';
    html+='<div class="history-question">'+h.gua+' - '+h.question+'</div>';
    html+='<div class="history-answer">'+h.time+' · '+h.fortune+'</div>';
    html+='</div>';
  });
  el.innerHTML=html;
}

function showHistory(i){
  var h=history[i];
  if(!h)return;
  var gua=guaData[h.gua];
  if(!gua){alert('卦象数据丢失');return;}
  var html='<div class="card result">';
  html+='<div class="section-title">🔮 历史记录</div>';
  html+='<div class="gua-card">';
  html+='<div class="gua-name">'+gua.name+'</div>';
  html+='<div class="gua-lines">'+gua.symbol+'</div>';
  html+='<div class="gua-info">';
  html+='<p><strong>卦象：</strong>'+gua.meaning+'</p>';
  html+='<p><strong>寻物指导：</strong>'+gua.advice+'</p>';
  html+='<p><strong>占卜时间：</strong>'+h.time+'</p>';
  html+='<p><strong>所问之事：</strong>'+h.question+'</p>';
  html+='</div></div></div>';
  document.getElementById('result').innerHTML=html;
  document.getElementById('result').style.display='block';
}

renderHistory();
