<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style>*{box-sizing:border-box}:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body {
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
padding:16px;scroll-behavior:smooth;}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻物神技 - 找失物工具</title>
    <meta name="description" content="寻物神技工具，帮你回忆丢失物品可能的位置">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="寻物神技 - 找失物工具">
  <meta property="og:description" content="寻物神技工具，帮你回忆丢失物品可能的位置">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/xunwu/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
    <div class="container">
        <header>
            <h1>🔍 寻物神技</h1>
            <p class="subtitle">基于传统玄学方法的失物寻找工具</p>
        </header>

        <div class="input-section">
            <div class="form-group">
                <label for="date">丢失日期：</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="time">丢失时辰：</label>
                <select id="time" required>
                    <option value="">请选择时辰</option>
                    <option value="0">子时 (23:00-01:00)</option>
                    <option value="1">丑时 (01:00-03:00)</option>
                    <option value="2">寅时 (03:00-05:00)</option>
                    <option value="3">卯时 (05:00-07:00)</option>
                    <option value="4">辰时 (07:00-09:00)</option>
                    <option value="5">巳时 (09:00-11:00)</option>
                    <option value="6">午时 (11:00-13:00)</option>
                    <option value="7">未时 (13:00-15:00)</option>
                    <option value="8">申时 (15:00-17:00)</option>
                    <option value="9">酉时 (17:00-19:00)</option>
                    <option value="10">戌时 (19:00-21:00)</option>
                    <option value="11">亥时 (21:00-23:00)</option>
                </select>
            </div>
            <button id="searchBtn" class="btn-primary">开始寻找</button>
        </div>

        <div id="result" class="result-section" style="display: none;">
            <div class="result-card">
                <h2>📊 寻找结果</h2>

                <div class="result-item">
                    <h3>第一步：能否找回？</h3>
                    <div id="step1" class="result-content"></div>
                </div>

                <div class="result-item">
                    <h3>第二步：距离判断</h3>
                    <div id="step2" class="result-content"></div>
                </div>

                <div class="result-item">
                    <h3>第三步：寻找方向</h3>
                    <div id="step3" class="result-content"></div>
                </div>

                <div class="result-item">
                    <h3>第四步：具体位置</h3>
                    <div id="step4" class="result-content"></div>
                </div>
            </div>
        </div>

        <footer>
            <p><strong>温馨提示：</strong>玄学本质是概率学，不是万能的，但能帮我们少走90%的弯路。</p>
        </footer>
    </div>

    <script>
// Auto-show search hint on load
setTimeout(() => { var r = document.getElementById("result"); if(r && !r.innerHTML.trim()) { r.style.display = "block"; r.innerHTML = "<p style=\"text-align:center;color:var(--text2)\">输入汉字，查询五行属性</p>"; } }, 300);
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
