<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二十八星宿 | Chinese Constellation</title>
<meta property="og:title" content="二十八星宿 | Chinese Constellation">
<meta property="og:description" content="二十八星宿 | Chinese Constellation - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="二十八星宿完整查询：四大星区、本命星宿、星宿配对、星宿日历。专业的中国传统星宿文化工具。">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a843;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.8rem;color:var(--gold)}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
.tab{padding:8px 18px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.85rem;transition:.2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.input-group input,.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}
.btn:hover{opacity:.85}
.result-area{margin-top:16px;display:none}
.result-area.show{display:block}
.group-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;margin-bottom:8px;cursor:pointer}
.group-header.g-blue{background:rgba(33,150,243,.15);border:1px solid rgba(33,150,243,.3)}
.group-header.g-red{background:rgba(244,67,54,.15);border:1px solid rgba(244,67,54,.3)}
.group-header.g-white{background:rgba(158,158,158,.15);border:1px solid rgba(158,158,158,.3)}
.group-header.g-black{background:rgba(55,55,55,.3);border:1px solid rgba(100,100,100,.3)}
.group-header .g-icon{font-size:1.5rem}
.group-header .g-name{font-size:1.1rem;font-weight:600}
.star-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;padding:0 10px 12px}
.star-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;cursor:pointer;transition:.2s}
.star-item:hover{border-color:var(--gold)}
.star-item .s-icon{font-size:1.3rem;margin-bottom:2px}
.star-item .s-name{font-size:.85rem;color:var(--gold);font-weight:600}
.star-item .s-animal{font-size:.7rem;color:var(--text2)}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78rem;margin:2px}
.tag.good{background:rgba(35,134,54,.15);color:var(--green);border:1px solid rgba(35,134,54,.3)}
.tag.neutral{background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.25)}
.tag.bad{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}
.cal-header{text-align:center;font-size:.75rem;color:var(--text2);padding:6px}
.cal-day{text-align:center;padding:8px 4px;border-radius:6px;font-size:.8rem;background:var(--bg);border:1px solid var(--border)}
.cal-day.today{border-color:var(--blue);background:rgba(59,130,246,.1)}
.cal-day .cd-num{font-weight:600}
.cal-day .cd-star{font-size:.65rem;color:var(--gold);margin-top:2px}
#themeBtn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer;font-size:.8rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button id="themeBtn" onclick="toggleTheme()">🌓 主题</button>
<div class="container">
<h1>⭐ 二十八星宿</h1>
<p class="sub">四大星区 · 本命星宿 · 星宿配对 · 星宿日历</p>
<div class="tabs">
<button class="tab active" onclick="switchTab('all')">📖 全部星宿</button>
<button class="tab" onclick="switchTab('birth')">🔍 本命星宿</button>
<button class="tab" onclick="switchTab('compat')">💕 星宿配对</button>
<button class="tab" onclick="switchTab('calendar')">📅 星宿日历</button>
</div>
<div class="card" id="allPanel"><div id="starGroups"></div><div class="result-area" id="allDetail"></div></div>
<div class="card" id="birthPanel" style="display:none">
<div class="input-group"><label>出生日期</label><input type="date" id="birthDate"></div>
<button class="btn" onclick="calcBirthStar()">查询本命星宿</button>
<div class="result-area" id="birthResult"></div>
</div>
<div class="card" id="compatPanel" style="display:none">
<div class="input-group"><label>你的星宿</label><select id="compatStar1"></select></div>
<div class="input-group"><label>对方星宿</label><select id="compatStar2"></select></div>
<button class="btn" onclick="checkCompat()">查看配对</button>
<div class="result-area" id="compatResult"></div>
</div>
<div class="card" id="calendarPanel" style="display:none">
<div class="input-group"><label>选择月份</label><input type="month" id="calMonth"></div>
<div class="calendar-grid" id="calGrid"></div>
</div>
</div>
<script src="../i18n.js" defer></script>
<script>
var groups=[
{name:'东方青龙',color:'g-blue',icon:'🐲',stars:[
{name:'角',animal:'蛟',element:'木',fortune:'吉',personality:'刚毅果断，有领导才能，性格直爽',lucky:['东','绿','3']},
{name:'亢',animal:'龙',element:'木',fortune:'吉',personality:'聪明机智，善于交际，口才出众',lucky:['东','白','9']},
{name:'氐',animal:'貉',element:'土',fortune:'凶',personality:'性格多变，情绪波动，需稳定心态',lucky:['北','黄','4']},
{name:'房',animal:'兔',element:'火',fortune:'吉',personality:'温和善良，家庭观念强，重感情',lucky:['南','红','6']},
{name:'心',animal:'狐',element:'火',fortune:'凶',personality:'心思细腻，直觉敏锐，但易多虑',lucky:['南','红','2']},
{name:'尾',animal:'虎',element:'水',fortune:'吉',personality:'勇敢果断，行动力强，有冒险精神',lucky:['北','黑','7']},
{name:'箕',animal:'豹',element:'水',fortune:'凶',personality:'性格刚烈，直来直去，需控制脾气',lucky:['北','黑','5']}
]},
{name:'北方玄武',color:'g-black',icon:'🐢',stars:[
{name:'斗',animal:'獬',element:'水',fortune:'吉',personality:'才华横溢，文采斐然，适合文艺',lucky:['北','黑','6']},
{name:'牛',animal:'牛',element:'金',fortune:'吉',personality:'勤劳踏实，坚韧不拔，值得信赖',lucky:['西','白','3']},
{name:'女',animal:'蝠',element:'水',fortune:'凶',personality:'聪慧灵巧，但有时过于精明',lucky:['北','黑','1']},
{name:'虚',animal:'鼠',element:'水',fortune:'凶',personality:'机敏灵活，善于察言观色',lucky:['北','黑','4']},
{name:'危',animal:'燕',element:'火',fortune:'凶',personality:'性格多疑，缺乏安全感，需建立信心',lucky:['南','红','8']},
{name:'室',animal:'猪',element:'火',fortune:'吉',personality:'温和宽厚，包容大度，人缘好',lucky:['南','红','2']},
{name:'壁',animal:'貐',element:'水',fortune:'吉',personality:'学识渊博，追求完美，有艺术天赋',lucky:['北','黑','9']}
]},
{name:'西方白虎',color:'g-white',icon:'🐅',stars:[
{name:'奎',animal:'狼',element:'火',fortune:'吉',personality:'独立自主，有主见，适合领导岗位',lucky:['南','红','1']},
{name:'娄',animal:'狗',element:'金',fortune:'吉',personality:'忠诚可靠，正义感强，重义气',lucky:['西','白','6']},
{name:'胃',animal:'雉',element:'土',fortune:'吉',personality:'精力充沛，热情开朗，社交能力强',lucky:['中','黄','3']},
{name:'昴',animal:'鸡',element:'水',fortune:'凶',personality:'观察力强，但容易挑剔，需宽容',lucky:['北','黑','7']},
{name:'毕',animal:'乌',element:'水',fortune:'吉',personality:'聪明过人，才华出众，有远大志向',lucky:['北','黑','5']},
{name:'觜',animal:'猴',element:'火',fortune:'凶',personality:'灵活多变，适应力强，但缺乏定性',lucky:['南','红','4']},
{name:'参',animal:'猿',element:'木',fortune:'吉',personality:'智慧深沉，善于谋略，有大局观',lucky:['东','绿','8']}
]},
{name:'南方朱雀',color:'g-red',icon:'🐦',stars:[
{name:'井',animal:'犴',element:'木',fortune:'吉',personality:'宽厚仁慈，乐于助人，有奉献精神',lucky:['东','绿','3']},
{name:'鬼',animal:'羊',element:'金',fortune:'凶',personality:'性格内敛，敏感多思，需开朗一些',lucky:['西','白','4']},
{name:'柳',animal:'獐',element:'土',fortune:'吉',personality:'温和谦逊，脚踏实地，稳步前进',lucky:['中','黄','8']},
{name:'星',animal:'马',element:'火',fortune:'吉',personality:'热情奔放，积极乐观，行动力强',lucky:['南','红','6']},
{name:'张',animal:'鹿',element:'火',fortune:'凶',personality:'追求完美，有时过于理想化',lucky:['南','红','2']},
{name:'翼',animal:'蛇',element:'土',fortune:'吉',personality:'优雅深沉，直觉敏锐，有艺术天赋',lucky:['中','黄','7']},
{name:'轸',animal:'蚓',element:'水',fortune:'凶',personality:'性格沉稳，但有时过于保守',lucky:['北','黑','1']}
]}
];

var allStars=[];
groups.forEach(function(g){g.stars.forEach(function(s){s.group=g.name;allStars.push(s)})});

function init(){
renderGroups();
populateSelects();
var now=new Date();
document.getElementById('calMonth').value=now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0');
renderCalendar();
document.getElementById('birthDate').value=now.toISOString().split('T')[0];
}

function switchTab(tab){
document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
event.target.classList.add('active');
['allPanel','birthPanel','compatPanel','calendarPanel'].forEach(function(id){document.getElementById(id).style.display='none'});
var map={all:'allPanel',birth:'birthPanel',compat:'compatPanel',calendar:'calendarPanel'};
document.getElementById(map[tab]).style.display='block';
}

function renderGroups(){
var h='';
groups.forEach(function(g){
h+='<div class="group-header '+g.color+'"><span class="g-icon">'+g.icon+'</span><span class="g-name">'+g.name+'</span><span class="g-count">'+g.stars.length+'宿</span></div>';
h+='<div class="star-grid">';
g.stars.forEach(function(s){
h+='<div class="star-item" onclick="showStarDetail(\''+s.name+'\')">';
h+='<div class="s-icon">'+s.animal+'</div><div class="s-name">'+s.name+'宿</div>';
h+='<div class="s-animal">'+s.animal+' · '+s.element+'</div></div>';
});
h+='</div>';
});
document.getElementById('starGroups').innerHTML=h;
}

function showStarDetail(name){
var s=allStars.find(function(x){return x.name===name});
if(!s)return;
var r=document.getElementById('allDetail');
r.className='result-area show';
var h='<div style="text-align:center;margin-bottom:12px"><span style="font-size:2rem">'+s.animal+'</span> <span style="font-size:1.3rem;color:var(--gold)">'+s.name+'宿</span></div>';
h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">';
h+='<div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center"><div style="color:var(--text2);font-size:.75rem">所属星区</div><div style="color:var(--gold)">'+s.group+'</div></div>';
h+='<div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center"><div style="color:var(--text2);font-size:.75rem">五行</div><div style="color:var(--gold)">'+s.element+'</div></div>';
h+='<div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center"><div style="color:var(--text2);font-size:.75rem">吉凶</div><div><span class="tag '+(s.fortune==='吉'?'good':'bad')+'">'+s.fortune+'</span></div></div>';
h+='<div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center"><div style="color:var(--text2);font-size:.75rem">动物</div><div style="color:var(--gold)">'+s.animal+'</div></div>';
h+='</div>';
h+='<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">';
h+='<div><strong>性格特征：</strong>'+s.personality+'</div>';
h+='<div style="margin-top:6px"><strong>幸运元素：</strong>'+s.lucky.map(function(l){return '<span class="tag neutral">'+l+'</span>'}).join('')+'</div></div>';
r.innerHTML=h;
}

function populateSelects(){
var s1=document.getElementById('compatStar1');
var s2=document.getElementById('compatStar2');
allStars.forEach(function(s){
s1.innerHTML+='<option value="'+s.name+'">'+s.name+'宿 ('+s.animal+')</option>';
s2.innerHTML+='<option value="'+s.name+'">'+s.name+'宿 ('+s.animal+')</option>';
});
}

function calcBirthStar(){
var ds=document.getElementById('birthDate').value;
if(!ds){alert('请选择出生日期');return}
var d=new Date(ds);
var daysSinceEpoch=Math.floor(d.getTime()/86400000);
var starIdx=daysSinceEpoch%28;
var star=allStars[starIdx];
var r=document.getElementById('birthResult');
r.className='result-area show';
var h='<div style="text-align:center"><span style="font-size:2.5rem">'+star.animal+'</span></div>';
h+='<div style="text-align:center;font-size:1.3rem;color:var(--gold);margin:8px 0">你的本命星宿：'+star.name+'宿</div>';
h+='<div style="text-align:center;color:var(--text2);margin-bottom:12px">'+star.group+' · '+star.element+' · '+star.fortune+'</div>';
h+='<div style="padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">';
h+='<div><strong>性格特征：</strong>'+star.personality+'</div>';
h+='<div style="margin-top:6px"><strong>幸运元素：</strong>'+star.lucky.map(function(l){return '<span class="tag neutral">'+l+'</span>'}).join('')+'</div>';
h+='<div style="margin-top:6px"><strong>建议：</strong>';
if(star.fortune==='吉')h+='本命星宿为吉，运势较好，可积极进取。';
else h+='本命星宿需注意化解，保持低调谨慎，多行善事。';
h+='</div></div>';
r.innerHTML=h;
}

function checkCompat(){
var n1=document.getElementById('compatStar1').value;
var n2=document.getElementById('compatStar2').value;
var s1=allStars.find(function(s){return s.name===n1});
var s2=allStars.find(function(s){return s.name===n2});
if(!s1||!s2)return;
var sameGroup=s1.group===s2.group;
var elemMatch=s1.element===s2.element;
var score=sameGroup?85:(elemMatch?80:60);
var fortune=score>=80?'大吉':score>=70?'吉':score>=60?'一般':'需注意';
var advice=score>=80?'两人星宿相合，默契十足，适合合作或交往。':
score>=70?'有一定默契，需要互相理解和包容。':'性格差异较大，需要更多沟通和磨合。';
var r=document.getElementById('compatResult');
r.className='result-area show';
var h='<div style="text-align:center;margin:12px 0"><span style="font-size:1.2rem;color:var(--gold)">'+s1.name+'宿 ❤️ '+s2.name+'宿</span></div>';
h+='<div style="text-align:center;font-size:2rem;color:var(--gold);font-weight:700">'+score+'分</div>';
h+='<div style="text-align:center;margin:8px 0"><span class="tag '+(score>=80?'good':score>=60?'neutral':'bad')+'">'+fortune+'</span></div>';
h+='<div style="padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border);margin-top:12px">';
h+='<div>'+advice+'</div></div>';
r.innerHTML=h;
}

function renderCalendar(){
var ms=document.getElementById('calMonth').value;
if(!ms)return;
var parts=ms.split('-');
var year=parseInt(parts[0]),month=parseInt(parts[1]);
var daysInMonth=new Date(year,month,0).getDate();
var firstDay=new Date(year,month-1,1).getDay();
var today=new Date();
var h='<div class="cal-header">日</div><div class="cal-header">一</div><div class="cal-header">二</div><div class="cal-header">三</div><div class="cal-header">四</div><div class="cal-header">五</div><div class="cal-header">六</div>';
for(var i=0;i<firstDay;i++)h+='<div class="cal-day" style="visibility:hidden"></div>';
for(var d=1;d<=daysInMonth;d++){
var date=new Date(year,month-1,d);
var daysSinceEpoch=Math.floor(date.getTime()/86400000);
var starIdx=daysSinceEpoch%28;
var star=allStars[starIdx];
var isToday=(d===today.getDate()&&month===(today.getMonth()+1)&&year===today.getFullYear());
h+='<div class="cal-day'+(isToday?' today':'')+'"><div class="cd-num">'+d+'</div><div class="cd-star">'+star.name+'宿</div></div>';
}
document.getElementById('calGrid').innerHTML=h;
}

function toggleTheme(){
var t=document.documentElement;
t.setAttribute('data-theme',t.getAttribute('data-theme')==='light'?'dark':'light');
}

init();
document.getElementById('calMonth').addEventListener('change',renderCalendar);
</script>
</body>
</html>
