<html style="scroll-behavior:smooth" lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国节日小游戏</title><meta name="description" content="中国节日小游戏 - 趣味节日知识互动游戏"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{opacity:.85}.btn-secondary{background:var(--border);color:var(--text)}.btn-success{background:var(--green);color:#fff}.btn-danger{background:var(--red);color:#fff}.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}.mode-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;transition:transform .2s;text-align:center}.mode-card:hover{transform:translateY(-2px);border-color:var(--blue)}.mode-card h3{font-size:1rem;margin-bottom:6px}.mode-card p{font-size:.8rem;color:var(--text2)}.score-bar{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:8px;margin-bottom:12px;font-size:.9rem}.question-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.question-num{font-size:.8rem;color:var(--text2);margin-bottom:8px}.question-text{font-size:1.1rem;font-weight:600;margin-bottom:16px;line-height:1.6}.options{display:flex;flex-direction:column;gap:10px}.option-btn{padding:14px;background:var(--card);border:2px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;cursor:pointer;text-align:left;transition:all .2s}.option-btn:hover{border-color:var(--blue);background:rgba(59,130,246,.1)}.option-btn.correct{border-color:var(--green);background:rgba(35,134,54,.15)}.option-btn.wrong{border-color:var(--red);background:rgba(239,68,68,.15)}.sort-item{display:flex;align-items:center;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:grab;gap:10px;transition:all .2s}.sort-item:active{cursor:grabbing;opacity:.7}.sort-item .num{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.match-col h3{text-align:center;margin-bottom:10px;font-size:.9rem;color:var(--text2)}.match-item{padding:12px;background:var(--card);border:2px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;transition:all .2s;font-size:.95rem}.match-item:hover{border-color:var(--blue)}.match-item.selected{border-color:var(--blue);background:rgba(59,130,246,.1)}.match-item.matched{border-color:var(--green);background:rgba(35,134,54,.15);cursor:default}.result-card{text-align:center;padding:30px}.result-card h2{font-size:1.4rem;margin-bottom:10px}.result-card .big-score{font-size:3rem;font-weight:700;color:var(--blue);margin:16px 0}.hidden{display:none}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}</style><meta property="og:title" content="中国节日小游戏"><meta property="og:description" content="中国节日小游戏 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎮 中国节日小游戏</h1><p class="sub">互动节日知识挑战</p>
<div id="menuScreen">
<div class="score-bar"><span>🏆 总分: <b id="totalScore">0</b></span><span>📊 已答: <b id="totalAnswered">0</b>题</span></div>
<div class="mode-grid">
<div class="mode-card" onclick="startGame('guess')"><h3>🤔 猜节日</h3><p>根据线索猜出节日名称</p></div>
<div class="mode-card" onclick="startGame('sort')"><h3>📅 节日排序</h3><p>将节日按农历时间排序</p></div>
<div class="mode-card" onclick="startGame('match')"><h3>🔗 连连看</h3><p>匹配节日与其习俗</p></div>
</div>
</div>
<div id="gameScreen" class="hidden"></div>
</div>
<script src="../i18n.js" defer></script>
<script>
var festivals=[
{name:'春节',lunar:'正月初一',icon:'🧧',customs:['贴春联','放鞭炮','拜年','吃年夜饭'],food:['饺子','年糕','汤圆'],clue:'农历新年第一天，家家户户贴红联，长辈给晚辈发红包。',month:1,day:1},
{name:'元宵节',lunar:'正月十五',icon:'🏮',customs:['赏花灯','猜灯谜','吃元宵'],food:['元宵','汤圆'],clue:'正月里的第一个月圆之夜，街头挂满花灯，人们猜灯谜吃汤圆。',month:1,day:15},
{name:'龙抬头',lunar:'二月初二',icon:'🐉',customs:['理发','吃龙须面','祭龙'],food:['龙须面','春饼'],clue:'二月二这天理发能带来好运，人们吃龙须面祈求风调雨顺。',month:2,day:2},
{name:'清明节',lunar:'四月初(公历4月5日前后)',icon:'🌿',customs:['扫墓','踏青','插柳','放风筝'],food:['青团','馓子'],clue:'既是祭祀祖先的日子，也是踏青郊游的好时节，有"植树造林"的习俗。',month:4,day:5},
{name:'端午节',lunar:'五月初五',icon:'🐲',customs:['赛龙舟','吃粽子','挂艾草','喝雄黄酒'],food:['粽子','雄黄酒'],clue:'纪念爱国诗人屈原，人们赛龙舟、吃粽子，门上挂艾草驱邪。',month:5,day:5},
{name:'七夕节',lunar:'七月初七',icon:'💑',customs:['乞巧','观星','拜织女'],food:['巧果','花生'],clue:'牛郎织女鹊桥相会的日子，古代女子在这天乞求心灵手巧。',month:7,day:7},
{name:'中元节',lunar:'七月十五',icon:'🕯️',customs:['祭祀祖先','放河灯','烧纸钱'],food:['鸭子','濑粉'],clue:'民间又称"鬼节"，人们放河灯为亡灵照亮归途，祭祀先人。',month:7,day:15},
{name:'中秋节',lunar:'八月十五',icon:'🌕',customs:['赏月','吃月饼','团圆','赏桂花'],food:['月饼','桂花酒','柚子'],clue:'一年中月亮最圆最亮的夜晚之一，家人团聚赏月，品尝各式月饼。',month:8,day:15},
{name:'重阳节',larva:'九月初九',icon:'⛰️',customs:['登高','赏菊','插茱萸','喝菊花酒'],food:['重阳糕','菊花酒'],clue:'九月九日双九重叠，人们登高望远、赏菊花、佩戴茱萸辟邪。',month:9,day:9},
{name:'寒衣节',lunar:'十月初一',icon:'🧥',customs:['祭祀祖先','送寒衣','烧纸'],food:['面条','饺子'],clue:'天气转冷，人们为已故亲人送去寒衣，表达对先人的思念。',month:10,day:1},
{name:'腊八节',lunar:'腊月初八',icon:'🥣',customs:['喝腊八粥','祭祀','泡腊八蒜'],food:['腊八粥','腊八蒜'],clue:'腊月里第一个重要节日，喝由多种谷物熬制的腊八粥，拉开春节序幕。',month:12,day:8},
{name:'小年',lunar:'腊月二十三',icon:'🧹',customs:['祭灶神','扫尘','贴窗花','吃糖瓜'],food:['糖瓜','关东糖'],clue:'灶王爷上天言好事的日子，家家大扫除迎新年，吃甜食让灶王嘴甜。',month:12,day:23},
{name:'除夕',lunar:'腊月最后一天',icon:'🎆',customs:['守岁','吃年夜饭','放鞭炮','看春晚'],food:['饺子','鱼','年糕'],clue:'一年最后一天，全家围坐吃年夜饭，看春晚守岁到新年钟声敲响。',month:12,day:30}
];

var guessQuestions=festivals.map(function(f){
  var wrong=festivals.filter(function(x){return x.name!==f.name});
  var opts=[f.name];
  while(opts.length<4){var r=wrong[Math.floor(Math.random()*wrong.length)];if(opts.indexOf(r.name)===-1)opts.push(r.name)}
  opts.sort(function(){return Math.random()-.5});
  return{question:f.clue,answer:f.name,options:opts,icon:f.icon,customs:f.customs.join('、')}
});
guessQuestions.sort(function(){return Math.random()-.5});

var gameState={mode:null,questions:[],current:0,score:0,answers:[]};

function startGame(mode){
  gameState.mode=mode;gameState.current=0;gameState.score=0;gameState.answers=[];
  document.getElementById('menuScreen').classList.add('hidden');
  var gs=document.getElementById('gameScreen');gs.classList.remove('hidden');
  if(mode==='guess'){
    gameState.questions=guessQuestions.slice(0,10);
    renderGuess();
  }else if(mode==='sort'){
    var picked=festivals.slice().sort(function(){return Math.random()-.5}).slice(0,6);
    gameState.questions=picked;
    renderSort(picked);
  }else if(mode==='match'){
    var picked=festivals.slice().sort(function(){return Math.random()-.5}).slice(0,5);
    gameState.questions=picked;
    renderMatch(picked);
  }
}

function renderGuess(){
  var gs=document.getElementById('gameScreen');
  if(gameState.current>=gameState.questions.length){renderResult();return}
  var q=gameState.questions[gameState.current];
  var h='<div class="question-card"><div class="question-num">第 '+(gameState.current+1)+' / '+gameState.questions.length+' 题</div>';
  h+='<div class="question-text">'+q.question+'</div><div class="options">';
  q.options.forEach(function(o){h+='<button class="option-btn" onclick="checkGuess(this,\''+o.replace(/'/g,"\\'")+'\'\')">'+o+'</button>'});
  h+='</div></div><button class="btn btn-secondary" onclick="backToMenu()" style="width:100%">返回菜单</button>';
  gs.innerHTML=h;
}

function checkGuess(el,answer){
  var q=gameState.questions[gameState.current];
  var btns=document.querySelectorAll('.option-btn');
  btns.forEach(function(b){
    b.onclick=null;
    if(b.textContent===q.answer)b.classList.add('correct');
    if(b.textContent===answer&&answer!==q.answer)b.classList.add('wrong');
  });
  var correct=answer===q.answer;
  if(correct)gameState.score++;
  gameState.answers.push({question:q.question,answer:q.answer,yourAnswer:answer,correct:correct});
  setTimeout(function(){gameState.current++;renderGuess()},1200);
}

function renderSort(items){
  var gs=document.getElementById('gameScreen');
  var shuffled=items.slice().sort(function(){return Math.random()-.5});
  var h='<div class="card"><h3 style="margin-bottom:12px">📅 将节日按农历时间先后排列（拖拽调整顺序）</h3>';
  h+='<div id="sortList">';
  shuffled.forEach(function(f,i){h+='<div class="sort-item" draggable="true" data-month="'+f.month+'" data-day="'+f.day+'" data-name="'+f.name+'"><span class="num">'+(i+1)+'</span><span style="font-size:1.2rem">'+f.icon+'</span><span>'+f.name+' ('+f.lunar+')</span></div>'});
  h+='</div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-primary" onclick="checkSort()">检查排序</button><button class="btn btn-secondary" onclick="backToMenu()">返回</button></div></div>';
  gs.innerHTML=h;
  initDragSort();
}

function initDragSort(){
  var list=document.getElementById('sortList');
  if(!list)return;
  var dragEl=null;
  list.querySelectorAll('.sort-item').forEach(function(item){
    item.addEventListener('dragstart',function(e){dragEl=this;this.style.opacity='.4'});
    item.addEventListener('dragend',function(){this.style.opacity='1'});
    item.addEventListener('dragover',function(e){e.preventDefault()});
    item.addEventListener('drop',function(e){
      e.preventDefault();
      if(dragEl!==this){
        var items=Array.from(list.children);
        var fromIdx=items.indexOf(dragEl);
        var toIdx=items.indexOf(this);
        if(fromIdx<toIdx)list.insertBefore(dragEl,this.nextSibling);
        else list.insertBefore(dragEl,this);
        updateSortNums();
      }
    });
  });
  var touchEl=null;
  list.querySelectorAll('.sort-item').forEach(function(item){
    item.addEventListener('touchstart',function(e){touchEl=this},{passive:true});
    item.addEventListener('touchend',function(e){
      if(!touchEl||touchEl===this)return;
      var items=Array.from(list.children);
      var fromIdx=items.indexOf(touchEl);
      var toIdx=items.indexOf(this);
      if(fromIdx<toIdx)list.insertBefore(touchEl,this.nextSibling);
      else list.insertBefore(touchEl,this);
      updateSortNums();
    },{passive:true});
  });
}

function updateSortNums(){
  document.querySelectorAll('#sortList .sort-item').forEach(function(el,i){el.querySelector('.num').textContent=i+1});
}

function checkSort(){
  var items=Array.from(document.querySelectorAll('#sortList .sort-item'));
  var correct=true;
  for(var i=1;i<items.length;i++){
    var prev=items[i-1],curr=items[i];
    var pm=parseInt(prev.dataset.month),pd=parseInt(prev.dataset.day);
    var cm=parseInt(curr.dataset.month),cd=parseInt(curr.dataset.day);
    if(pm>cm||(pm===cm&&pd>cd)){correct=false;break}
  }
  if(correct){gameState.score+=2;alert('✅ 排序正确！+2分')}
  else{alert('❌ 排序不完全正确，正确顺序应按农历日期从小到大排列')}
  gameState.current=gameState.questions.length;
  renderResult();
}

var matchState={selected:null,matched:0};

function renderMatch(items){
  var gs=document.getElementById('gameScreen');
  matchState={selected:null,matched:0};
  var customs=items.map(function(f){return{name:f.name,custom:f.customs[0],icon:f.icon}});
  var shuffledCustoms=customs.slice().sort(function(){return Math.random()-.5});
  var h='<div class="card"><h3 style="margin-bottom:12px">🔗 点击左右两侧匹配节日与习俗</h3>';
  h+='<div class="match-grid"><div class="match-col"><h3>节日</h3>';
  customs.forEach(function(c,i){h+='<div class="match-item" data-type="festival" data-idx="'+i+'" data-name="'+c.name+'" onclick="clickMatch(this)">'+c.icon+' '+c.name+'</div>'});
  h+='</div><div class="match-col"><h3>习俗</h3>';
  shuffledCustoms.forEach(function(c,i){h+='<div class="match-item" data-type="custom" data-idx="'+customs.findIndex(function(x){return x.name===c.name})+'" data-name="'+c.name+'" onclick="clickMatch(this)">'+c.custom+'</div>'});
  h+='</div></div><div id="matchMsg" style="text-align:center;margin-top:12px;color:var(--text2)"></div>';
  h+='<div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-secondary" onclick="backToMenu()">返回</button></div></div>';
  gs.innerHTML=h;
}

function clickMatch(el){
  if(el.classList.contains('matched'))return;
  if(!matchState.selected){
    matchState.selected=el;el.classList.add('selected');
  }else{
    var prev=matchState.selected;
    if(prev===el){prev.classList.remove('selected');matchState.selected=null;return}
    if(prev.dataset.type===el.dataset.type){
      prev.classList.remove('selected');
      matchState.selected=el;el.classList.add('selected');
    }else{
      if(prev.dataset.idx===el.dataset.idx){
        prev.classList.add('matched');el.classList.add('matched');
        prev.classList.remove('selected');el.classList.remove('selected');
        matchState.matched++;gameState.score++;
        document.getElementById('matchMsg').textContent='✅ 正确！'+matchState.matched+'/5';
        if(matchState.matched>=5){
          setTimeout(function(){gameState.current=gameState.questions.length;renderResult()},800);
        }
      }else{
        prev.classList.remove('selected');
        el.style.borderColor='var(--red)';
        prev.style.borderColor='var(--red)';
        var p=prev,p2=el;
        setTimeout(function(){p.style.borderColor='';p2.style.borderColor=''},500);
      }
      matchState.selected=null;
    }
  }
}

function renderResult(){
  var gs=document.getElementById('gameScreen');
  var total=gameState.mode==='guess'?10:gameState.mode==='sort'?1:5;
  var pct=Math.round(gameState.score/total*100);
  var emoji=pct>=80?'🎉':pct>=60?'👍':pct>=40?'💪':'😅';
  var h='<div class="result-card"><h2>'+emoji+' 游戏结束</h2>';
  h+='<div class="big-score">'+gameState.score+' / '+total+'</div>';
  h+='<p style="color:var(--text2);margin-bottom:16px">正确率: '+pct+'%</p>';
  if(gameState.mode==='guess'&&gameState.answers.length){
    h+='<div class="card" style="text-align:left"><h3 style="margin-bottom:10px">📋 答题详情</h3>';
    gameState.answers.forEach(function(a){
      h+='<div style="padding:8px 0;border-bottom:1px solid var(--border)">';
      h+='<span style="color:'+(a.correct?'var(--green)':'var(--red)')+'">'+(a.correct?'✅':'❌')+'</span> ';
      h+=a.question.substring(0,20)+'... → <b>'+a.answer+'</b>';
      if(!a.correct)h+=' (你答: '+a.yourAnswer+')';
      h+='</div>';
    });
    h+='</div>';
  }
  h+='<div style="margin-top:16px;display:flex;gap:8px;justify-content:center"><button class="btn btn-primary" onclick="startGame(\''+gameState.mode+'\')">再来一局</button><button class="btn btn-secondary" onclick="backToMenu()">返回菜单</button></div></div>';
  gs.innerHTML=h;
}

function backToMenu(){
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('menuScreen').classList.remove('hidden');
  updateScoreDisplay();
}

function updateScoreDisplay(){
  document.getElementById('totalScore').textContent=gameState.score;
  document.getElementById('totalAnswered').textContent=gameState.answers.length;
}

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input');if(inp)inp.focus()}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur()}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0})</script>
</body></html>
