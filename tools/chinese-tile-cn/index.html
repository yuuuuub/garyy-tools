<html lang="zh-CN" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国琉璃瓦 - 五色琉璃 | Gary's Tools</title><meta name="description" content="中国琉璃瓦艺术百科 - 琉璃历史、制作工艺、建筑应用、文化象征全解"><meta name="robots" content="index,follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏯</text></svg>"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#d4a574;--accent2:#8b6914}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#8b5e3c;--accent2:#6b4226}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;transition:background var(--transition),color var(--transition)}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.category-btn{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all var(--transition)}.category-btn.active{background:var(--accent);color:#fff}.category-btn:hover{opacity:.85}.item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all var(--transition)}.item:hover{transform:translateY(-2px);border-color:var(--accent)}.item-title{font-size:1.05rem;font-weight:600;margin-bottom:4px}.item-era{color:var(--accent);font-size:.8rem;margin-bottom:6px}.item-desc{color:var(--text2);font-size:.9rem;line-height:1.5}.item-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.9rem;line-height:1.7;color:var(--text)}.item.open .item-detail{display:block}.tag{display:inline-block;padding:2px 8px;margin:4px 4px 0;background:var(--border);border-radius:12px;font-size:.75rem;color:var(--text2)}</style></head>

<div class="container"><h1>🏯 中国琉璃瓦</h1><p class="sub">琉璃历史 · 制作工艺 · 建筑应用 · 文化象征</p>

<script>
var data=[
{title:'琉璃起源',era:'西周',cat:'历史',tags:['釉陶','西周','建筑'],desc:'琉璃起源于西周时期的釉陶，最初用于建筑装饰。',detail:'琉璃起源于西周时期。"琉璃"一词最早见于《汉书》，指以铅钡玻璃为原料烧制的釉陶。琉璃瓦是在陶瓦表面施以琉璃釉烧制而成，具有防水、防腐、色彩鲜艳的特点。琉璃瓦的出现使中国古代建筑呈现出金碧辉煌的壮丽景象。',ref:'《汉书·西域传》'},
{title:'北魏发展',era:'北魏',cat:'历史',tags:['大同','平城','发展'],desc:'北魏时期琉璃技术在大同得到发展，开始大规模用于建筑。',detail:'北魏定都平城（今山西大同）后，琉璃技术得到重要发展。大同出土的北魏琉璃瓦是已知最早的建筑琉璃实物。北魏还从西域引进了新的琉璃制作技术，使琉璃釉色更加丰富。云冈石窟等建筑上已使用了琉璃装饰。',ref:'《魏书》'},
{title:'唐宋成熟',era:'唐宋',cat:'历史',tags:['唐代','宋代','官窑'],desc:'唐代琉璃技术成熟，宋代建立了官方琉璃窑厂。',detail:'唐代琉璃技术趋于成熟，琉璃瓦开始大量用于宫殿和寺庙建筑。唐大明宫遗址出土了大量精美的琉璃瓦。宋代建立了官方琉璃窑厂，琉璃生产更加规范化。《营造法式》详细记载了琉璃瓦的制作方法和使用规范。',ref:'《营造法式》'},
{title:'明清鼎盛',era:'明清',cat:'历史',tags:['故宫','官窑','鼎盛'],desc:'明清是琉璃瓦的鼎盛期，北京故宫的琉璃瓦代表了最高水平。',detail:'明清是琉璃瓦发展的鼎盛期。北京故宫的琉璃瓦代表了中国琉璃工艺的最高水平。明清在北京设有官窑（琉璃厂），专门为皇家建筑烧制琉璃瓦。故宫太和殿的黄色琉璃瓦在阳光下金光灿烂，象征着皇权的至高无上。',ref:'《明史·食货志》'},
{title:'制坯',era:'历代',cat:'工艺',tags:['陶土','成型','干燥'],desc:'琉璃瓦制作的第一步，用陶土制作瓦坯并晾干。',detail:'琉璃瓦制作的第一步是制坯。选用细腻的陶土，经过淘洗、揉练后，用模具制成各种瓦件——板瓦、筒瓦、勾头、滴水、脊兽等。制好的瓦坯需要在阴凉处晾干，防止开裂。晾干时间根据天气而定，通常需要数天到数周。',ref:'《琉璃窑厂》'},
{title:'施釉',era:'历代',cat:'工艺',tags:['釉料','配色','上釉'],desc:'在瓦坯表面施以琉璃釉，釉色的配方是各家的秘密。',detail:'施釉是琉璃瓦制作的关键工序。琉璃釉以铅为助熔剂，以各种金属氧化物为着色剂。釉料的配方是各窑厂的核心机密。施釉方法有浸釉、浇釉、刷釉等。釉层要均匀厚薄一致，否则烧制后会出现色差。',ref:'《中国琉璃》'},
{title:'烧制',era:'历代',cat:'工艺',tags:['窑炉','温度','火候'],desc:'将施釉后的瓦坯入窑烧制，温度和火候的控制至关重要。',detail:'烧制是琉璃瓦制作的最后一道工序。琉璃瓦需要两次烧制：第一次是素烧（约1000℃），将瓦坯烧结；第二次是釉烧（约800-900℃），使釉料熔化附着在瓦面上。烧制过程中温度和火候的控制至关重要，直接影响琉璃瓦的色泽和品质。',ref:'《琉璃工艺》'},
{title:'黄色',era:'明清',cat:'颜色',tags:['皇权','至尊','故宫'],desc:'黄色是琉璃瓦最高等级的颜色，专供皇家建筑使用。',detail:'黄色是琉璃瓦最高等级的颜色，象征皇权和至尊。明清时期，黄色琉璃瓦为皇家建筑专用，民间不得使用。故宫太和殿、中和殿、保和殿等主要建筑均覆以黄色琉璃瓦，金碧辉煌，气势恢宏。黄色釉的着色剂是氧化铁。',ref:'《大清会典》'},
{title:'绿色',era:'明清',cat:'颜色',tags:['亲王','王府','次等'],desc:'绿色是琉璃瓦的次高等级颜色，供亲王府等高级建筑使用。',detail:'绿色琉璃瓦是仅次于黄色的等级，供亲王府、郡王府等高级建筑使用。北京的雍和宫、恭王府等建筑使用绿色琉璃瓦。绿色釉的着色剂是氧化铜。在一些寺庙建筑中也使用绿色琉璃瓦。',ref:'《清史稿》'},
{title:'蓝色',era:'明清',cat:'颜色',tags:['天坛','祭天','天空'],desc:'蓝色琉璃瓦用于天坛建筑，象征天空。',detail:'蓝色琉璃瓦主要用于祭祀建筑，特别是天坛。天坛祈年殿的三重檐均覆以蓝色琉璃瓦，象征苍穹。蓝色釉的着色剂是氧化钴。蓝色琉璃瓦在中国古代建筑中使用较少，主要用于与天相关的祭祀建筑。',ref:'《天坛志》'},
{title:'黑色与紫色',era:'历代',cat:'颜色',tags:['藏书楼','文渊阁','特殊'],desc:'黑色和紫色琉璃瓦用于藏书楼等特殊建筑，寓意防火。',detail:'黑色琉璃瓦在五行中属水，寓意防火。故宫文渊阁（皇家藏书楼）覆以黑色琉璃瓦，寓意以水克火，保护藏书。紫色琉璃瓦较为罕见，故宫某些偏殿使用。不同颜色的琉璃瓦体现了中国古代"五行"哲学思想在建筑中的应用。',ref:'《故宫志》'},
{title:'故宫琉璃瓦',era:'明代至今',cat:'建筑',tags:['故宫','太和殿','金碧辉煌'],desc:'故宫的琉璃瓦是中国古代建筑琉璃的最高代表。',detail:'故宫是中国古代建筑琉璃的最高代表。故宫共有大小建筑数十万平方米，使用了数百万块琉璃瓦。太和殿的黄色琉璃瓦在阳光下金光灿烂，气势恢宏。故宫的琉璃瓦历经数百年风雨，至今色泽鲜艳，展现了高超的琉璃制作工艺。',ref:'《故宫建筑》'},
{title:'九龙壁',era:'明清',cat:'建筑',tags:['九龙壁','影壁','琉璃'],desc:'以琉璃瓦拼砌的九龙壁影壁，是琉璃建筑的杰作。',detail:'中国现存三座九龙壁：北京故宫、北京北海公园、山西大同。九龙壁是以琉璃瓦拼砌而成的大型影壁，壁面饰有九条形态各异的蟠龙。北京故宫九龙壁建于乾隆年间，长约30米，由270块琉璃构件组成，色彩绚丽、工艺精湛。',ref:'《北京故宫》'},
{title:'琉璃与皇家等级',era:'明清',cat:'文化',tags:['等级','礼制','五色'],desc:'琉璃瓦的颜色是建筑等级的重要标志，严格遵守礼制规定。',detail:'琉璃瓦的颜色是建筑等级的重要标志，体现了中国古代严格的礼制规定。黄色为皇帝专用，绿色为亲王所用，蓝色用于祭祀建筑，黑色用于藏书楼。民间建筑不得使用琉璃瓦。这一等级制度从明清一直延续到清末。',ref:'《大清会典》'},
{title:'琉璃与五行',era:'历代',cat:'文化',tags:['五行','风水','哲学'],desc:'琉璃瓦的颜色对应五行学说，体现天人合一的建筑哲学。',detail:'琉璃瓦的颜色选择体现了五行学说在建筑中的应用。黄色属土（中央）、绿色属木（东方）、蓝色属水（北方）、红色属火（南方）、白色属金（西方）。不同颜色的琉璃瓦用于不同方位的建筑，体现了天人合一的建筑哲学。',ref:'《五行大义》'},
{title:'琉璃厂',era:'明代至今',cat:'文化',tags:['北京','文化街','古玩'],desc:'北京琉璃厂因明代琉璃窑而得名，后发展为文化古玩街。',detail:'北京琉璃厂因明代在此设立琉璃窑烧制建筑琉璃而得名。清代琉璃窑迁走后，这里逐渐发展为文化古玩街。琉璃厂聚集了大量古玩店、书画店、文房四宝店，成为北京著名的文化街区。"琉璃厂"这个名字本身就是中国琉璃文化的历史见证。',ref:'《琉璃厂小志》'}
];
var currentCat='all';
function renderList(items){
  var el=document.getElementById('list');
  var s=document.getElementById('stats');
  s.textContent='共 '+items.length+' 条知识';
  el.innerHTML=items.map(function(d,i){
    return '<div class="item" onclick="this.classList.toggle(\'open\')">'+
    '<div class="item-title">'+d.title+'</div>'+
    '<div class="item-era">年代：'+d.era+'</div>'+
    '<div class="item-desc">'+d.desc+'</div>'+
    '<div class="item-detail"><h4>详细介绍</h4><p>'+d.detail+'</p>'+
    '<p style="margin-top:8px;color:var(--accent2)">参考：'+d.ref+'</p>'+
    '<div>'+d.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div></div>';
  }).join('');
}
function filterList(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=data.filter(function(d){
    var matchQ=d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q)||d.era.toLowerCase().includes(q);
    var matchC=currentCat==='all'||d.cat===currentCat;
    return matchQ&&matchC;
  });
  renderList(filtered);
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterList();
}
renderList(data);
</script></body></html>
