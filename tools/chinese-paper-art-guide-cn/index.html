<script>
var data={
overview:{title:'中国纸艺总览',content:'<p>中国纸艺历史悠久，种类丰富。从剪纸到折纸，从纸扎到灯笼，纸艺贯穿了中国人的日常生活和节日庆典。</p><div class="paper-demo"><div class="paper-item"><div class="icon">✂️</div><div>剪纸</div></div><div class="paper-item"><div class="icon">📄</div><div>折纸</div></div><div class="paper-item"><div class="icon">🏮</div><div>灯笼</div></div><div class="paper-item"><div class="icon">🎭</div><div>纸扎</div></div><div class="paper-item"><div class="icon">🎨</div><div>年画</div></div><div class="paper-item"><div class="icon">🪁</div><div>风筝</div></div></div><h4 style="margin-top:16px">纸艺的文化意义</h4><div class="item" style="cursor:default;margin-top:8px"><div class="desc">• 剪纸是联合国人类非物质文化遗产<br>• 纸艺反映了中国人的审美情趣<br>• 节日纸艺承载着吉祥寓意<br>• 纸艺是民间艺术的重要组成部分<br>• 纸艺在现代设计中仍有广泛应用</div></div>'},
jianzhi:{title:'剪纸艺术',content:'<p>中国剪纸是用剪刀或刻刀在纸上剪刻花纹的民间艺术，已有1500多年历史。2009年被列入联合国人类非物质文化遗产代表作名录。</p>',
items:[
{name:'剪纸的历史',desc:'南北朝时期已有剪纸实物出土。唐代剪纸用于装饰和礼品。宋代出现专业剪纸艺人。明清时期剪纸艺术达到高峰。',tags:['历史悠久','1500年']},
{name:'剪纸工具',desc:'• 剪刀：专业剪纸剪刀，尖细锋利<br>• 刻刀：用于精细雕刻<br>• 纸张：红色宣纸最常用<br>• 蜡板：垫在纸下防止滑动<br>• 镂空：剪纸的核心技法',tags:['工具','技法']},
{name:'剪纸题材',desc:'• 吉祥图案：福禄寿喜、龙凤呈祥<br>• 花卉：牡丹、梅花、莲花<br>• 动物：十二生肖、鱼、鸟<br>• 人物：戏曲人物、民间传说<br>• 字：福字、春字、喜字',tags:['题材','吉祥']},
{name:'剪纸流派',desc:'北方剪纸：粗犷豪放，线条简洁（如陕西、山西、河北）<br>南方剪纸：精巧细腻，构图繁复（如扬州、佛山、南京）',tags:['南北','流派']}
]},
origami:{title:'折纸艺术',content:'<p>中国折纸起源于汉代，是中国传统纸艺的重要组成部分。折纸不仅是一种手工艺术，也是数学和几何学的直观展示。</p>',
items:[
{name:'传统折纸',desc:'• 纸鹤：象征长寿和吉祥<br>• 纸船：童年记忆，寓意一帆风顺<br>• 纸元宝：祭祀用品，象征财富<br>• 纸花：装饰和祭祀用<br>• 纸衣：清明节祭祀用品',tags:['传统','吉祥']},
{name:'折纸技法',desc:'• 基础折法：对折、三折、四折<br>• 进阶折法：双正方形、双三角形<br> • 组合折纸：多个单元组合<br>• 湿折法：湿润纸张进行塑形',tags:['技法','组合']},
{name:'折纸应用',desc:'• 教育：培养空间想象力和动手能力<br>• 装饰：节日和庆典装饰<br>• 祭祀：纸钱、纸衣等祭祀用品<br>• 艺术：现代折纸已成为独立艺术形式',tags:['教育','艺术']}
]},
others:{title:'其他纸艺',items:[
{name:'灯笼',desc:'元宵节挂灯笼是传统习俗。花灯种类繁多，有宫灯、纱灯、走马灯等。自贡灯会闻名全国。',tags:['元宵节','花灯']},
{name:'纸扎',desc:'用于祭祀和民俗活动。包括纸人、纸马、纸房子等。闽南和潮汕地区的纸扎工艺尤为精湛。',tags:['祭祀','民俗']},
{name:'年画',desc:'春节期间张贴的彩色画。苏州桃花坞、天津杨柳青、山东潍坊是三大年画产地。',tags:['春节','年画']},
{name:'风筝',desc:'中国传统手工艺品。潍坊是世界风筝之都。风筝融合了绘画、绑扎、糊制等多种技艺。',tags:['风筝','潍坊']},
{name:'纸编',desc:'用纸条编织成各种物品。包括纸编花、纸编篮等。是民间手工艺的重要组成部分。',tags:['编织','手工艺']},
{name:'纸塑',desc:'用纸浆塑造立体造型。用于制作面具、玩具、装饰品等。是民间艺术的独特表现形式。',tags:['立体','塑造']}
]},
regions:{title:'地方特色',items:[
{name:'陕西剪纸',region:'陕西',desc:'以粗犷豪放著称，图案简洁有力。安塞剪纸最为著名，被列入国家级非遗。',tags:['粗犷','非遗']},
{name:'扬州剪纸',region:'江苏扬州',desc:'以精巧细腻闻名，构图繁复精美。扬州剪纸被列入联合国非遗名录。',tags:['细腻','联合国非遗']},
{name:'佛山剪纸',region:'广东佛山',desc:'以铜凿剪纸和衬色剪纸著称，色彩金碧辉煌。是岭南文化的重要代表。',tags:['铜凿','岭南']},
{name:'蔚县剪纸',region:'河北蔚县',desc:'以刻代剪，色彩鲜艳。以戏曲人物和花鸟为特色题材。',tags:['刻纸','戏曲']},
{name:'自贡灯会',region:'四川自贡',desc:'以彩灯闻名，有"南国灯城"之称。自贡灯会历史悠久，规模宏大。',tags:['灯会','彩灯']},
{name:'潍坊风筝',region:'山东潍坊',desc:'世界风筝之都，每年举办国际风筝节。风筝制作技艺精湛。',tags:['风筝','国际']}
]},
quiz:{title:'中国纸艺知识测验',questions:[
{q:'中国剪纸在哪一年被列入联合国非遗？',options:['2005年','2009年','2013年','2017年'],answer:1,explain:'中国剪纸于2009年被列入联合国人类非物质文化遗产代表作名录。'},
{q:'世界风筝之都是哪个城市？',options:['北京','潍坊','南京','杭州'],answer:1,explain:'山东潍坊是世界风筝之都，每年举办国际风筝节。'},
{q:'以下哪个不是三大年画产地？',options:['苏州桃花坞','天津杨柳青','山东潍坊','四川绵竹'],answer:2,explain:'三大年画产地是苏州桃花坞、天津杨柳青、四川绵竹。山东潍坊以风筝闻名。'},
{q:'北方剪纸的特点是？',options:['精巧细腻','构图繁复','粗犷豪放','色彩鲜艳'],answer:2,explain:'北方剪纸以粗犷豪放、线条简洁著称，如陕西、山西、河北等地的剪纸。'},
{q:'元宵节挂灯笼是为了纪念谁？',options:['嫦娥','玉兔','太一（天帝）','屈原'],answer:2,explain:'元宵节挂灯笼源于汉代祭祀太一（天帝）的活动，后来演变为节日习俗。'}]}
};
function switchTab(name,el){
document.querySelectorAll('.tab-bar .tab').forEach(function(t){t.classList.remove('active')});
el.classList.add('active');
renderContent(name);
}
function renderContent(name){
var d=data[name];
var html='<div class="card"><h3>'+d.title+'</h3>';
if(d.content) html+=d.content;
if(d.items){
d.items.forEach(function(item){
html+='<div class="item">';
if(item.icon) html+='<div style="font-size:1.5rem;margin-bottom:4px">'+item.icon+'</div>';
html+='<h4>'+item.name+'</h4>';
if(item.region) html+='<div class="meta">'+item.region+'</div>';
html+='<div class="desc">'+item.desc+'</div>';
if(item.tags) html+='<div style="margin-top:8px">'+item.tags.map(function(t){return '<span class="tag" style="background:rgba(59,130,246,.15);color:var(--blue)">'+t+'</span>'}).join('')+'</div>';
html+='</div>';
});
}
if(d.questions){
d.questions.forEach(function(q,i){
html+='<div class="item" style="cursor:default" id="q'+i+'"><h4>'+q.q+'</h4>';
q.options.forEach(function(opt,j){
html+='<div class="quiz-option" onclick="checkAnswer('+i+','+j+','+q.answer+',this)">'+String.fromCharCode(65+j)+'. '+opt+'</div>';
});
html+='<div class="explain" style="display:none;margin-top:8px;padding:8px;background:rgba(59,130,246,.1);border-radius:8px;font-size:.85rem">'+q.explain+'</div></div>';
});
}
html+='</div>';
document.getElementById('content').innerHTML=html;
}
function checkAnswer(qi,oi,correct,el){
var q=document.getElementById('q'+qi);
var opts=q.querySelectorAll('.quiz-option');
opts.forEach(function(o,i){
if(i===correct) o.style.borderColor='var(--green)';
else if(i===oi) o.style.borderColor='var(--red)';
});
q.querySelector('.explain').style.display='block';
}
renderContent('overview');
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
