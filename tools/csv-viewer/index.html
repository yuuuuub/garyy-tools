<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV查看器</title>
<meta name="description" content="CSV文件查看器，在线打开浏览CSV表格数据">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#60a5fa;--muted:#8b949e;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.5rem;text-align:center;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;transition:.2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent)}
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:.2s}
.upload-area:hover{border-color:var(--accent)}
.upload-area p{color:var(--muted);margin-top:8px}
.search-input{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:.85rem;outline:none;width:200px}
.search-input:focus{border-color:var(--accent)}
.info-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.8rem;color:var(--muted);flex-wrap:wrap;gap:8px}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{position:sticky;top:0;background:var(--card);padding:10px 12px;text-align:left;border-bottom:2px solid var(--accent);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{background:rgba(59,130,246,.1)}
th .sort-icon{margin-left:4px;color:var(--muted);font-size:.7rem}
td{padding:8px 12px;border-bottom:1px solid var(--border)}
tr:nth-child(even){background:rgba(255,255,255,.02)}
tr:hover{background:rgba(59,130,246,.05)}
.pagination{display:flex;gap:6px;justify-content:center;margin-top:16px;align-items:center}
.page-btn{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text);cursor:pointer;font-size:.8rem;transition:.2s}
.page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.page-btn:hover{border-color:var(--accent)}
.page-info{font-size:.8rem;color:var(--muted)}
.hidden{display:none}
textarea.paste-area{width:100%;height:150px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 16px;border-radius:8px;font-size:.85rem;opacity:0;transition:.3s;z-index:100}
.toast.show{opacity:1}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div class="container">
<h1>📊 CSV查看器</h1>

<div class="card" id="uploadCard">
<div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
<p>📁 点击上传或拖拽 CSV 文件</p>
</div>
<input type="file" id="fileInput" accept=".csv,.tsv,.txt" class="hidden" onchange="handleFile(event)">
<div style="text-align:center;color:var(--muted);font-size:.85rem;margin:12px 0">或直接粘贴 CSV 数据</div>
<textarea class="paste-area" id="pasteArea" placeholder="姓名,年龄,城市&#10;张三,25,北京&#10;李四,30,上海"></textarea>
<button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="parsePasted()">解析粘贴内容</button>
</div>

<div class="card hidden" id="tableCard">
<div class="toolbar">
<button class="btn btn-outline" onclick="exportCSV()">导出 CSV</button>
<button class="btn btn-outline" onclick="backToUpload()">重新导入</button>
</div>
<div class="info-bar">
<div><span id="rowCount">0</span> 行 × <span id="colCount">0</span> 列</div>
<div><input type="text" class="search-input" id="searchInput" placeholder="搜索..." oninput="filterRows()"></div>
</div>
<div class="table-wrap" id="tableWrap"></div>
<div class="pagination" id="pagination"></div>
</div>
</div>
<div class="toast" id="toast"></div>
<canvas id="csvCanvas" style="display:none"></canvas>
<script>
let allData = [], headers = [], sortCol = -1, sortAsc = true, currentPage = 1, perPage = 50;
function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => { parseCSV(ev.target.result); };
  reader.readAsText(file);
  e.target.value = '';
}
function parsePasted() {
  const text = document.getElementById('pasteArea').value.trim();
  if (!text) { showToast('请先粘贴数据'); return; }
  parseCSV(text);
}
function parseCSV(text) {
  const delimiter = detectDelimiter(text);
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) { showToast('数据不足'); return; }
  headers = parseLine(lines[0], delimiter);
  allData = lines.slice(1).map(l => parseLine(l, delimiter));
  currentPage = 1;
  sortCol = -1;
  document.getElementById('uploadCard').classList.add('hidden');
  document.getElementById('tableCard').classList.remove('hidden');
  renderTable();
}
function detectDelimiter(text) {
  const firstLine = text.split('\n')[0];
  const counts = { ',': (firstLine.match(/,/g) || []).length, '\t': (firstLine.match(/\t/g) || []).length, ';': (firstLine.match(/;/g) || []).length };
  return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0] || ',';
}
function parseLine(line, delimiter) {
  const result = []; let current = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"' && line[i + 1] === '"') { current += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else current += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === delimiter) { result.push(current); current = ''; }
      else current += ch;
    }
  }
  result.push(current);
  return result;
}
function renderTable() {
  const filtered = getFilteredData();
  const totalPages = Math.ceil(filtered.length / perPage);
  const start = (currentPage - 1) * perPage;
  const pageData = filtered.slice(start, start + perPage);
  document.getElementById('rowCount').textContent = allData.length;
  document.getElementById('colCount').textContent = headers.length;
  let html = '<table><thead><tr>';
  headers.forEach((h, i) => {
    const arrow = sortCol === i ? (sortAsc ? ' ▲' : ' ▼') : '';
    html += `<th onclick="sortBy(${i})">${h}<span class="sort-icon">${arrow}</span></th>`;
  });
  html += '</tr></thead><tbody>';
  pageData.forEach(row => {
    html += '<tr>';
    row.forEach(cell => { html += `<td>${escapeHtml(cell)}</td>`; });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;
  renderPagination(totalPages);
}
function getFilteredData() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  if (!query) return allData;
  return allData.filter(row => row.some(cell => cell.toLowerCase().includes(query)));
}
function filterRows() { currentPage = 1; renderTable(); }
function sortBy(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  allData.sort((a, b) => {
    let va = a[col] || '', vb = b[col] || '';
    const na = parseFloat(va), nb = parseFloat(vb);
    if (!isNaN(na) && !isNaN(nb)) return sortAsc ? na - nb : nb - na;
    return sortAsc ? va.localeCompare(vb, 'zh') : vb.localeCompare(va, 'zh');
  });
  renderTable();
}
function renderPagination(total) {
  const el = document.getElementById('pagination');
  if (total <= 1) { el.innerHTML = ''; return; }
  let html = '';
  html += `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;
  const start = Math.max(1, currentPage - 2);
  const end = Math.min(total, currentPage + 2);
  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn${i === currentPage ? ' active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === total ? 'disabled' : ''}>下一页</button>`;
  html += `<span class="page-info">${currentPage} / ${total}</span>`;
  el.innerHTML = html;
}
function goPage(p) {
  const total = Math.ceil(getFilteredData().length / perPage);
  currentPage = Math.max(1, Math.min(total, p));
  renderTable();
}
function exportCSV() {
  const csv = [headers.join(','), ...allData.map(r => r.map(c => c.includes(',') ? `"${c}"` : c).join(','))].join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'export.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('已导出');
}
function backToUpload() {
  document.getElementById('uploadCard').classList.remove('hidden');
  document.getElementById('tableCard').classList.add('hidden');
}
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
document.addEventListener('DOMContentLoaded', () => {
  const area = document.getElementById('uploadArea');
  area.addEventListener('dragover', e => { e.preventDefault(); area.style.borderColor = 'var(--accent)'; });
  area.addEventListener('dragleave', () => { area.style.borderColor = ''; });
  area.addEventListener('drop', e => {
    e.preventDefault(); area.style.borderColor = '';
    const file = e.dataTransfer.files[0];
    if (file) { const reader = new FileReader(); reader.onload = ev => parseCSV(ev.target.result); reader.readAsText(file); }
  });
});
</script>
<script src="../i18n.js"></script>
</body>
</html>
