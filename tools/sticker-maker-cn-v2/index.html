<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏷️ 贴纸制作工具 v2</title>
<meta property="og:title" content="🏷️ 贴纸制作工具 v2">
<meta property="og:description" content="🏷️ 贴纸制作工具 v2 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线贴纸制作工具，上传图片抠图、添加边框文字、自定义形状，导出透明PNG">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:900px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.canvas-wrap{display:flex;justify-content:center;overflow:auto;padding:10px 0}
canvas#stickerCanvas{border:1px solid var(--border);border-radius:8px;background:repeating-conic-gradient(#e0e0e0 0% 25%,#fff 0% 50%) 0 0/16px 16px}
.form-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.form-row label{font-size:13px;color:var(--text-secondary);min-width:70px}
.form-row input[type="text"],.form-row select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--input-bg);color:var(--text);flex:1;min-width:120px}
.form-row input[type="color"]{width:40px;height:32px;border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:2px}
.form-row input[type="range"]{flex:1;accent-color:var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text-secondary)}
.upload-zone:hover{border-color:var(--accent);color:var(--accent)}
.shape-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px}
.shape-card{padding:8px;border:2px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;font-size:24px;transition:all .2s;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.shape-card:hover{border-color:var(--accent)}
.shape-card.active{border-color:var(--accent);background:var(--tag-bg)}
.sticker-preview{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.sticker-thumb{border:1px solid var(--border);border-radius:8px;background:repeating-conic-gradient(#e0e0e0 0% 25%,#fff 0% 50%) 0 0/8px 8px;cursor:pointer;transition:all .2s}
.sticker-thumb:hover{box-shadow:0 0 0 2px var(--accent)}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏷️</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🏷️ 贴纸制作工具 v2</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">🖼️ 预览</div>
    <div class="canvas-wrap"><canvas id="stickerCanvas" width="400" height="400"></canvas></div>
  </div>

  <div class="card">
    <div class="card-title">📸 上传图片</div>
    <div class="upload-zone" id="uploadZone">点击或拖拽上传图片</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="card">
    <div class="card-title">🔷 贴纸形状</div>
    <div class="shape-grid" id="shapeGrid"></div>
  </div>

  <div class="card">
    <div class="card-title">⚙️ 设置</div>
    <div class="form-row"><label>边框宽度</label><input type="range" min="0" max="30" value="8" id="borderW" oninput="render()"><span id="bwVal">8px</span></div>
    <div class="form-row"><label>边框颜色</label><input type="color" id="borderColor" value="#ffffff" onchange="render()"></div>
    <div class="form-row"><label>图片缩放</label><input type="range" min="30" max="100" value="80" id="imgScale" oninput="render()"><span id="isVal">80%</span></div>
    <div class="form-row"><label>旋转</label><input type="range" min="-180" max="180" value="0" id="rotation" oninput="render()"><span id="rtVal">0°</span></div>
    <div class="form-row"><label>阴影</label><input type="range" min="0" max="30" value="8" id="shadow" oninput="render()"><span id="shVal">8px</span></div>
  </div>

  <div class="card">
    <div class="card-title">📝 文字</div>
    <div class="form-row"><label>文字</label><input type="text" id="stickerText" value="" oninput="render()"></div>
    <div class="form-row"><label>字号</label><input type="range" min="12" max="48" value="24" id="stickerFontSize" oninput="render()"><span id="sfsVal">24</span></div>
    <div class="form-row"><label>颜色</label><input type="color" id="stickerFontColor" value="#ffffff" onchange="render()"></div>
    <div class="form-row"><label>位置</label>
      <select id="textPos" onchange="render()">
        <option value="bottom">底部</option>
        <option value="top">顶部</option>
        <option value="center">居中</option>
      </select>
    </div>
    <div class="form-row"><label>描边</label><input type="color" id="textStroke" value="#000000" onchange="render()"></div>
  </div>

  <div class="card">
    <div class="card-title">🎨 贴纸风格</div>
    <div class="shape-grid" id="styleGrid"></div>
  </div>

  <div class="card">
    <div class="card-title">⚡ 操作</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="exportPNG()">💾 导出透明PNG</button>
      <button class="btn btn-outline" onclick="exportWithBg()">💾 导出带背景</button>
    </div>
  </div>

  <footer>🏷️ 贴纸制作工具 v2 - 创作个性贴纸</footer>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/i18n-js@3/dist/i18n.min.js" defer></script>
<script>
const C=document.getElementById('stickerCanvas'),ctx=C.getContext('2d');
let bgImg=null,shapeIdx=0,styleIdx=0;
const shapes=[
  {name:'圆形',icon:'⭕',draw:(c,x,y,r)=>{c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.closePath();}},
  {name:'方形',icon:'⬜',draw:(c,x,y,r)=>{c.fillRect(x-r,y-r,r*2,r*2);}},
  {name:'圆角方',icon:'🔲',draw:(c,x,y,r)=>{const rr=r*0.2;c.beginPath();c.moveTo(x-r+rr,y-r);c.lineTo(x+r-rr,y-r);c.quadraticCurveTo(x+r,y-r,x+r,y-r+rr);c.lineTo(x+r,y+r-rr);c.quadraticCurveTo(x+r,y+r,x+r-rr,y+r);c.lineTo(x-r+rr,y+r);c.quadraticCurveTo(x-r,y+r,x-r,y+r-rr);c.lineTo(x-r,y-r+rr);c.quadraticCurveTo(x-r,y-r,x-r+rr,y-r);c.closePath();}},
  {name:'菱形',icon:'🔷',draw:(c,x,y,r)=>{c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r,y);c.lineTo(x,y+r);c.lineTo(x-r,y);c.closePath();}},
  {name:'心形',icon:'❤️',draw:(c,x,y,r)=>{c.beginPath();const s=r*0.55;c.bezierCurveTo(x,y-s*2,x+r*2,y-s*2,x,y+s);c.bezierCurveTo(x-r*2,y-s*2,x,y-s*2,x,y-s*2);c.closePath();}},
  {name:'星形',icon:'⭐',draw:(c,x,y,r)=>{c.beginPath();for(let i=0;i<5;i++){const a=i*4*Math.PI/5-Math.PI/2;const ri=i%2===0?r:r*0.45;c[i===0?'moveTo':'lineTo'](x+ri*Math.cos(a),y+ri*Math.sin(a));}c.closePath();}},
  {name:'六边形',icon:'⬡',draw:(c,x,y,r)=>{c.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;c[i===0?'moveTo':'lineTo'](x+r*Math.cos(a),y+r*Math.sin(a));}c.closePath();}},
  {name:'三角形',icon:'🔺',draw:(c,x,y,r)=>{c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r*0.87,y+r*0.5);c.lineTo(x-r*0.87,y+r*0.5);c.closePath();}},
];
const styles=[
  {name:'白边',border:'#ffffff',bg:null},
  {name:'黑边',border:'#000000',bg:null},
  {name:'粉色',border:'#ff69b4',bg:null},
  {name:'蓝色',border:'#3b82f6',bg:null},
  {name:'黄色',border:'#fbbf24',bg:null},
  {name:'渐变',border:null,gradient:['#6366f1','#a855f7']},
  {name:'彩虹',border:null,gradient:['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#6366f1']},
  {name:'无边框',border:'transparent',bg:null},
];

function init(){
  renderShapes();renderStyles();
  const uz=document.getElementById('uploadZone');
  const fi=document.getElementById('fileInput');
  uz.onclick=()=>fi.click();
  uz.ondragover=e=>{e.preventDefault();uz.style.borderColor='var(--accent)';};
  uz.ondragleave=()=>uz.style.borderColor='var(--border)';
  uz.ondrop=e=>{e.preventDefault();uz.style.borderColor='var(--border)';handleFile(e.dataTransfer.files[0]);};
  fi.onchange=()=>handleFile(fi.files[0]);
  render();
}

function renderShapes(){
  const grid=document.getElementById('shapeGrid');grid.innerHTML='';
  shapes.forEach((s,i)=>{
    const card=document.createElement('div');
    card.className='shape-card'+(i===shapeIdx?' active':'');
    card.innerHTML=`<span>${s.icon}</span><div style="font-size:10px">${s.name}</div>`;
    card.onclick=()=>{shapeIdx=i;renderShapes();render();};
    grid.appendChild(card);
  });
}

function renderStyles(){
  const grid=document.getElementById('styleGrid');grid.innerHTML='';
  styles.forEach((s,i)=>{
    const card=document.createElement('div');
    card.className='shape-card'+(i===styleIdx?' active':'');
    card.style.border=`2px solid ${i===styleIdx?'var(--accent)':s.border||'#e0e0e0'}`;
    if(s.gradient){card.style.background=`linear-gradient(135deg,${s.gradient.join(',')})`;}
    card.innerHTML=`<div style="font-size:10px;color:${s.border||'#333'}">${s.name}</div>`;
    card.onclick=()=>{styleIdx=i;renderStyles();render();};
    grid.appendChild(card);
  });
}

function handleFile(f){
  if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{bgImg=img;render();showToast('图片已加载');};
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

function render(){
  const w=C.width,h=C.height;
  const bw=parseInt(document.getElementById('borderW').value);
  const bc=document.getElementById('borderColor').value;
  const is=parseInt(document.getElementById('imgScale').value)/100;
  const rt=parseInt(document.getElementById('rotation').value);
  const sh=parseInt(document.getElementById('shadow').value);
  const txt=document.getElementById('stickerText').value;
  const fs=parseInt(document.getElementById('stickerFontSize').value);
  const fc=document.getElementById('stickerFontColor').value;
  const tp=document.getElementById('textPos').value;
  const tc=document.getElementById('textStroke').value;

  document.getElementById('bwVal').textContent=bw+'px';
  document.getElementById('isVal').textContent=Math.round(is*100)+'%';
  document.getElementById('rtVal').textContent=rt+'°';
  document.getElementById('shVal').textContent=sh+'px';
  document.getElementById('sfsVal').textContent=fs;

  ctx.clearRect(0,0,w,h);

  const cx=w/2,cy=h/2;
  const r=Math.min(w,h)/2-bw-sh;

  if(sh>0){ctx.shadowColor='rgba(0,0,0,0.3)';ctx.shadowBlur=sh;ctx.shadowOffsetY=sh/4;}

  const style=styles[styleIdx];
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rt*Math.PI/180);

  if(style.gradient){
    const grad=ctx.createLinearGradient(-r,-r,r,r);
    style.gradient.forEach((c,i)=>grad.addColorStop(i/(style.gradient.length-1),c));
    ctx.fillStyle=grad;
  }else{
    ctx.fillStyle=style.border||bc;
  }

  shapes[shapeIdx].draw(ctx,0,0,r+bw/2);
  if(style.gradient||style.border!=='transparent')ctx.fill();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;

  ctx.save();
  ctx.beginPath();
  shapes[shapeIdx].draw(ctx,0,0,r);
  ctx.clip();

  if(bgImg){
    const imgR=r*is;
    const scale=Math.max(imgR*2/bgImg.width,imgR*2/bgImg.height);
    const sw=bgImg.width*scale,sh2=bgImg.height*scale;
    ctx.drawImage(bgImg,-sw/2,-sh2/2,sw,sh2);
  }else{
    ctx.fillStyle='#e0e0e0';
    shapes[shapeIdx].draw(ctx,0,0,r);ctx.fill();
    ctx.fillStyle='#999';ctx.font='48px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('📷',0,0);
  }
  ctx.restore();

  if(txt){
    ctx.font=`bold ${fs}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    const ty=tp==='top'?-r*0.7:tp==='center'?0:r*0.7;
    if(tc!=='transparent'){ctx.strokeStyle=tc;ctx.lineWidth=3;ctx.lineJoin='round';ctx.strokeText(txt,0,ty);}
    ctx.fillStyle=fc;ctx.fillText(txt,0,ty);
  }

  ctx.restore();
}

function exportPNG(){
  const link=document.createElement('a');link.download='贴纸_'+Date.now()+'.png';link.href=C.toDataURL('image/png');link.click();showToast('已导出透明PNG');
}
function exportWithBg(){
  const tc=document.createElement('canvas');tc.width=C.width;tc.height=C.height;
  const tctx=tc.getContext('2d');
  tctx.fillStyle='#ffffff';tctx.fillRect(0,0,tc.width,tc.height);
  tctx.drawImage(C,0,0);
  const link=document.createElement('a');link.download='贴纸_白底_'+Date.now()+'.png';link.href=tc.toDataURL('image/png');link.click();showToast('已导出白底PNG');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function toggleTheme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';document.querySelector('.theme-toggle').textContent=d.dataset.theme==='dark'?'☀️':'🌙';}
init();
</script>
</body>
</html>
