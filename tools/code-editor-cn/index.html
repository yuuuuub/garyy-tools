<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文代码编辑器</title>
<meta name="description" content="在线代码编辑器 - 支持多种语言语法高亮">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px}
nav a{color:var(--accent2);text-decoration:none;font-size:14px}
nav a:hover{text-decoration:underline}
nav h1{font-size:18px;font-weight:600}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar button{background:var(--border);color:var(--text);border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .2s}
.toolbar button:hover{background:var(--accent)}
.toolbar button.danger{background:var(--error)}
.toolbar button.danger:hover{background:#da3633}
.toolbar button.success{background:var(--success)}
.toolbar select{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:6px;font-size:13px;outline:none}
.toolbar .spacer{flex:1}
.toolbar .stats{font-size:13px;color:#8b949e}
.editor-container{display:flex;flex:1;position:relative}
.line-numbers{background:var(--card);color:#8b949e;padding:20px 12px;text-align:right;font-size:14px;line-height:1.6;font-family:"SF Mono",Monaco,Consolas,monospace;user-select:none;min-width:50px;border-right:1px solid var(--border);overflow:hidden;white-space:pre-line}
.code-area{flex:1;position:relative}
#editor{width:100%;height:calc(100vh - 130px);background:var(--bg);color:var(--text);border:none;padding:20px;font-size:14px;line-height:1.6;font-family:"SF Mono",Monaco,Consolas,monospace;resize:none;outline:none;tab-size:2;white-space:pre;overflow:auto}
.editor-container.fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100}
.editor-container.fullscreen #editor{height:100vh}
.editor-container.fullscreen .line-numbers{height:100vh}
.toast{position:fixed;bottom:20px;right:20px;background:var(--success);color:var(--text);padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="中文代码编辑器">
  <meta property="og:description" content="在线代码编辑器 - 支持多种语言语法高亮">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/code-editor-cn/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<nav>
  <a href="/index.html">← 返回</a>
  <h1>中文代码编辑器</h1>
</nav>
<div class="toolbar">
  <select id="langSelect" onchange="updateLang()">
    <option value="javascript">JavaScript</option>
    <option value="python">Python</option>
    <option value="java">Java</option>
    <option value="c">C</option>
    <option value="go">Go</option>
  </select>
  <button onclick="copyCode()" title="复制代码">📋 复制</button>
  <button onclick="clearEditor()" class="danger" title="清空">🗑 清空</button>
  <button onclick="insertTab()">→| 缩进</button>
  <button onclick="removeTab()">|← 取消缩进</button>
  <button onclick="toggleFullscreen()">⛶ 全屏</button>
  <span class="spacer"></span>
  <span class="stats" id="stats">字数: 0 | 行数: 1</span>
</div>
<div class="editor-container" id="editorContainer">
  <div class="line-numbers" id="lineNumbers">1</div>
  <div class="code-area">
    <textarea id="editor" spellcheck="false" placeholder="在这里输入代码..."></textarea>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const editor = document.getElementById('editor');
const lineNumbers = document.getElementById('lineNumbers');
const stats = document.getElementById('stats');
function updateLineNumbers() {
  const lines = editor.value.split('\n').length;
  lineNumbers.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('\n');
}
function updateStats() {
  const text = editor.value;
  stats.textContent = `字数: ${text.length} | 行数: ${text ? text.split('\n').length : 1}`;
}
function updateAll() {
  updateLineNumbers();
  updateStats();
}
editor.addEventListener('input', updateAll);
editor.addEventListener('scroll', () => { lineNumbers.scrollTop = editor.scrollTop; });
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, end = editor.selectionEnd;
    editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = s + 2;
    updateAll();
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    const s = editor.selectionStart;
    const lineStart = editor.value.lastIndexOf('\n', s - 1) + 1;
    const line = editor.value.substring(lineStart, s);
    const indent = line.match(/^\s*/)[0];
    const lastChar = editor.value.charAt(s - 1);
    let extra = '';
    if (lastChar === '{' || lastChar === '(' || lastChar === '[' || lastChar === ':') extra = '  ';
    editor.value = editor.value.substring(0, s) + '\n' + indent + extra + editor.value.substring(editor.selectionEnd);
    editor.selectionStart = editor.selectionEnd = s + 1 + indent.length + extra.length;
    updateAll();
  }
});
function updateLang() {
  const lang = document.getElementById('langSelect').value;
  const templates = {
    javascript: '
    python: '# Python 示例\ndef hello():\n    print("Hello, World!")\n\nhello()',
    java: '
    c: '
    go: '
  };
  if (!editor.value.trim()) editor.value = templates[lang] || '';
  updateAll();
}
function copyCode() {
  navigator.clipboard.writeText(editor.value).then(() => showToast('已复制到剪贴板'));
}
function clearEditor() {
  if (!editor.value.trim() || confirm('确定要清空所有内容吗？')) {
    editor.value = '';
    updateAll();
  }
}
function insertTab() {
  const s = editor.selectionStart, end = editor.selectionEnd;
  editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(end);
  editor.selectionStart = editor.selectionEnd = s + 2;
  editor.focus();
  updateAll();
}
function removeTab() {
  const s = editor.selectionStart;
  const lineStart = editor.value.lastIndexOf('\n', s - 1) + 1;
  const line = editor.value.substring(lineStart);
  if (line.startsWith('  ')) {
    editor.value = editor.value.substring(0, lineStart) + line.substring(2);
    editor.selectionStart = editor.selectionEnd = Math.max(lineStart, s - 2);
    editor.focus();
    updateAll();
  }
}
function toggleFullscreen() {
  const c = document.getElementById('editorContainer');
  c.classList.toggle('fullscreen');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
updateAll();
</script>

<script>
(function(){
  var e=document.getElementById('editor');
  if(e&&!e.value)e.value=`// 欢迎使用代码编辑器
function greet(name) {
  return \`Hello, \${name}!\`;
}

console.log(greet("World"));`;
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
