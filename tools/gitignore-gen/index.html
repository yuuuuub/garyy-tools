<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gitignore生成器</title>
<meta name="description" content=".gitignore文件生成器，快速生成项目忽略配置">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950;--red:#f85149}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;min-height:100vh}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.container{max-width:900px;margin:0 auto;padding:24px}
.section-title{font-size:16px;margin:16px 0 12px;color:var(--accent)}
.search-box{width:100%;padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;outline:none;margin-bottom:16px}
.search-box:focus{border-color:var(--accent)}
.lang-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.lang-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px;transition:all .2s}
.lang-btn:hover{border-color:var(--accent);color:var(--accent)}
.lang-btn.selected{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar{display:flex;gap:8px;margin-bottom:16px}
.btn{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.output{background:#000;border-radius:12px;padding:16px;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:13px;line-height:1.6;max-height:500px;overflow-y:auto;white-space:pre-wrap;border:1px solid var(--border)}
.custom-section{margin-top:16px}
.custom-input{width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:monospace;font-size:13px;outline:none;resize:vertical;min-height:60px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;z-index:100}
.toast.show{opacity:1}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Gitignore生成器">
  <meta property="og:description" content=".gitignore文件生成器，快速生成项目忽略配置">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/gitignore-gen/">
</head>
<body>
<div class="header">
<span style="font-size:28px">📝</span>
<h1>Gitignore生成器</h1>
</div>
<div class="container">
<input type="text" class="search-box" id="search" placeholder="搜索语言/框架..." title="Enter键搜索" oninput="filterLangs()">
<div class="lang-grid" id="langGrid"></div>
<div class="toolbar">
<button class="btn btn-primary" onclick="copyResult()">📋 复制</button>
<button class="btn" onclick="downloadFile()">⬇️ 下载.gitignore</button>
<button class="btn" onclick="resetSelection()">🔄 重置</button>
</div>
<div class="custom-section">
<div class="section-title">➕ 自定义规则（每行一条）</div>
<textarea class="custom-input" id="customInput" placeholder="# 自定义忽略规则&#10;*.log&#10;temp/" oninput="generateOutput()"></textarea>
</div>
<div class="section-title">📄 预览</div>
<div class="output" id="output"># 请选择语言或框架</div>
</div>
<div class="toast" id="toast"></div>
<script>
const langData={
'Node.js':`node_modules/\n.env\n.env.local\ndist/\nbuild/\ncoverage/\n*.log\n.DS_Store\nnpm-debug.log*\nyarn-debug.log*\nyarn-error.log*\npnpm-debug.log*\npackage-lock.json\nyarn.lock\n.pnpm-store/`,
'Python':`__pycache__/\n*.py[cod]\n*.egg-info/\ndist/\nbuild/\n.eggs/\n*.egg\n.env\nvenv/\n.venv/\n*.so\n.pytest_cache/\n.mypy_cache/\n.ruff_cache/\n.ipynb_checkpoints/`,
'Java':`*.class\n*.jar\n*.war\n*.ear\n.gradle/\nbuild/\nout/\n.idea/\n*.iml\n.settings/\n.project\n.classpath\ntarget/\n.mvn/`,
'Go':`*.exe\n*.exe~\n*.dll\n*.so\n*.dylib\n*.test\n*.out\nvendor/\ngo.work\n/go.work.sum`,
'Rust':`/target\n**knitr/*-Ex.txt\ninst/CACHE/`,
'MATLAB':`*.asv\n*.mex*.*\n*.mlappinstall\n*.mltbx\ntoolbox/`,
'Shell':`*.swp\n*.swo\n*~\n.env\n.DS_Store\n*.log`,
'Docker':`node_modules/\n*.log\n.env\n.DS_Store\ndist/\nbuild/`,
'Haskell':`dist/\ncabal-dev/\n*.o\n*.hi\n.mstack-work/`,
'Unity':`Library/\nTemp/\nObj/\nBuild/\nBuilds/\nLogs/\nUserSettings/\nMemoryCaptures/\nRecordings/\n*.csproj\n*.sln\n*.suo\n*.tmp\n*.user\n*.userprefs\n*.pidb\n*.booproj\n*.svd\n*.pdb\n*.mdb\n*.opendb\n*.VC.db\n*.apk\n*.aab\n*.unitypackage\n*.app`,
'Unreal':`Binaries/\nIntermediate/\nSaved/\nDerivedDataCache/\n*.sln\n*.suo\n*.opensdf\n*.opendb\n*.VC.db\n*.VC.opendb`,
'Svelte':`node_modules/\nbuild/\n.DS_Store\ndist/`,
'Flutter':`.dart_tool/\n.flutter-plugins\n.flutter-plugins-dependencies\n.packages\n.pub-cache/\n.pub/\nbuild/\n*.iml\n.idea/`,
'Terraform':`*.tfstate\n*.tfstate.*\n.terraform/\n*.tfvars\n!example.tfvars\ncrash.log\noverride.tf\noverride.tf.json\n*_override.tf\n*_override.tf.json`,
'AWS':`*.zip\n*.tfstate\n.terraform/\n*.tfvars\ncredentials\n.env`,
'Ansible':`*.retry\n*.pyc\n__pycache__/\n.vagrant/\n*.log\ninventory/hosts`
};
const selected=new Set();
function renderLangs(filter=''){
const grid=document.getElementById('langGrid');
const filtered=Object.keys(langData).filter(l=>l.toLowerCase().includes(filter.toLowerCase()));
grid.innerHTML=filtered.map(l=>`<div class="lang-btn ${selected.has(l)?'selected':''}" onclick="toggleLang('${l}')">${l}</div>`).join('');
}
function filterLangs(){renderLangs(document.getElementById('search').value)}
function toggleLang(lang){if(selected.has(lang))selected.delete(lang);else selected.add(lang);renderLangs(document.getElementById('search').value);generateOutput()}
function generateOutput(){
let content='# Generated by Gitignore Generator\n\n';
if(selected.size>0){
selected.forEach(lang=>{content+=`# ${lang}\n${langData[lang]}\n\n`});
}
const custom=document.getElementById('customInput').value.trim();
if(custom){content+=`# Custom\n${custom}\n`}
document.getElementById('output').textContent=content.trim();
}
function copyResult(){
navigator.clipboard.writeText(document.getElementById('output').textContent).then(()=>showToast('已复制到剪贴板'));
}
function downloadFile(){
const blob=new Blob([document.getElementById('output').textContent],{type:'text/plain'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='.gitignore';a.click();
}
function resetSelection(){selected.clear();document.getElementById('customInput').value='';document.getElementById('search').value='';renderLangs();generateOutput()}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
renderLangs();
</script>
<script src="../i18n.js" defer>
document.getElementById("search").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();copyResult();}});
</script>
</body>
</html>
