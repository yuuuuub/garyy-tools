<!DOCTYPE html>
<html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国陶瓷指南</title><meta name="description" content="中国陶瓷指南 - 了解中国陶瓷的历史、名窑和鉴赏知识"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.card h3{margin-bottom:12px;color:var(--blue)}.tab-bar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:8px}.tab{padding:8px 16px;cursor:pointer;border-radius:8px;white-space:nowrap;color:var(--text2);transition:var(--transition);border:1px solid var(--border);font-size:.9rem}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.tab:hover:not(.active){background:var(--bg)}.item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;transition:var(--transition)}.item h4{margin-bottom:6px}.item .meta{color:var(--text2);font-size:.85rem}.item .desc{margin-top:8px;line-height:1.8;color:var(--text2)}.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;margin:2px}.glaze-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:12px 0}.glaze-item{padding:12px;border-radius:8px;text-align:center;color:#fff;font-weight:bold;cursor:pointer;transition:var(--transition)}.glaze-item:hover{transform:scale(1.05)}.quiz-option{display:block;padding:10px;margin:6px 0;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:var(--transition)}.quiz-option:hover{border-color:var(--blue)}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}</style><meta property="og:title" content="中国陶瓷指南"><meta property="og:description" content="中国陶瓷指南 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏺</text></svg>"></head><body>

<div class="container"><h1>🏺 中国陶瓷指南</h1><p class="sub">探索中国陶瓷的历史名窑、釉色分类和鉴赏知识</p>
<div class="tab-bar">
<div class="tab active" onclick="switchTab('overview',this)">总览</div>
<div class="tab" onclick="switchTab('kilns',this)">五大名窑</div>
<div class="tab" onclick="switchTab('glazes',this)">釉色分类</div>

<script src="../i18n.js" defer></script>
<script>
var data={
overview:{title:'中国陶瓷总览',content:'<p>中国是瓷器的故乡，"China"一词本身就与瓷器密切相关。中国陶瓷有着八千年的悠久历史，是中华文明的重要标志。</p><h4 style="margin-top:16px">陶与瓷的区别</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px"><div class="item" style="cursor:default"><h4>🏺 陶器</h4><p class="desc">• 烧成温度：800-1100℃<br>• 吸水率：较高<br>• 胎体：不透光<br>• 代表：紫砂壶、唐三彩</p></div><div class="item" style="cursor:default"><h4>🍶 瓷器</h4><p class="desc">• 烧成温度：1200-1400℃<br>• 吸水率：极低<br>• 胎体：透光<br>• 代表：青花瓷、粉彩</p></div></div>'},
kilns:{title:'宋代五大名窑',items:[
{name:'汝窑',location:'河南宝丰',era:'北宋',feature:'天青色釉，"雨过天青云破处"。釉面开片细密，如冰裂纹。存世仅约90件，极为珍贵。',tags:['天青','开片','珍稀']},
{name:'官窑',location:'河南开封',era:'北宋',feature:'紫口铁足，釉色以粉青为主。多次施釉，釉层厚润。专为宫廷烧制。',tags:['宫廷','粉青','厚釉']},
{name:'哥窑',location:'浙江龙泉',era:'宋',feature:'以开片著称，"金丝铁线"为典型特征。釉色有米黄、粉青等。',tags:['开片','金丝铁线']},
{name:'钧窑',location:'河南禹州',era:'宋',feature:'以窑变釉闻名，"入窑一色，出窑万彩"。红紫交融，绚丽多彩。',tags:['窑变','多彩']},
{name:'定窑',location:'河北曲阳',era:'宋',feature:'以白瓷著称，"白如玉、薄如纸、声如磬"。刻花、印花装饰精美。',tags:['白瓷','刻花','薄胎']}
]},
glazes:{title:'釉色分类',content:'<div class="glaze-grid"><div class="glaze-item" style="background:#2563eb" onclick="showGlazeInfo(\'青釉\')">青釉</div><div class="glaze-item" style="background:#fff;color:#000;border:1px solid #ccc" onclick="showGlazeInfo(\'白釉\')">白釉</div><div class="glaze-item" style="background:#1e3a5f" onclick="showGlazeInfo(\'黑釉\')">黑釉</div><div class="glaze-item" style="background:#dc2626" onclick="showGlazeInfo(\'红釉\')">红釉</div><div class="glaze-item" style="background:#16a34a" onclick="showGlazeInfo(\'绿釉\')">绿釉</div><div class="glaze-item" style="background:#eab308" onclick="showGlazeInfo(\'黄釉\')">黄釉</div><div class="glaze-item" style="background:#7c3aed" onclick="showGlazeInfo(\'紫釉\')">紫釉</div><div class="glaze-item" style="background:linear-gradient(135deg,#2563eb,#dc2626)" onclick="showGlazeInfo(\'窑变釉\')">窑变釉</div></div><div id="glazeDetail" class="item" style="margin-top:12px"></div>',items:[
{name:'青釉',desc:'以铁为着色剂，是中国瓷器中最古老的釉色。包括粉青、梅子青、天青等。龙泉窑的青瓷最为著名。',tags:['古老','龙泉']},
{name:'白釉',desc:'以高岭土为原料，铁含量极低。定窑白瓷"白如玉"，景德镇甜白瓷温润如脂。',tags:['纯净','定窑']},
{name:'黑釉',desc:'以铁为主要着色剂，铁含量较高。建窑的兔毫盏、油滴盏最为著名，是宋代斗茶的首选。',tags:['建窑','斗茶']},
{name:'红釉',desc:'以铜为着色剂，烧成难度极高。有郎窑红、豇豆红、祭红等品种。"要想穷，烧郎红"形容其难度。',tags:['铜红','郎窑红']},
{name:'青花瓷',desc:'以钴料在胎上绘画，罩透明釉高温一次烧成。蓝白相间，素雅清新。始于唐代，盛于元明。',tags:['蓝白','元青花']}
]},
history:{title:'历史发展',items:[
{name:'新石器时代',era:'约8000年前',desc:'陶器出现，以仰韶文化的彩陶、龙山文化的黑陶为代表。彩陶以红底黑彩为主，图案生动。',tags:['彩陶','黑陶']},
{name:'商周时期',era:'约3600年前',desc:'原始瓷器出现，釉色以青绿为主。商代已有原始青瓷，是瓷器的雏形。',tags:['原始瓷','青釉']},
{name:'东汉时期',era:'约2000年前',真正的成熟瓷器在浙江上虞一带烧制成功。以越窑青瓷为代表，质地坚致。',tags:['成熟','越窑']},
{name:'唐代',era:'约1400年前',desc:'形成"南青北白"格局。南方越窑青瓷"如冰似玉"，北方邢窑白瓷"类银似雪"。',tags:['南青北白']},
{name:'宋代',era:'约1000年前',desc:'瓷器发展的黄金时代。五大名窑各具特色，景德镇成为瓷业中心。青瓷、白瓷、黑瓷并驾齐驱。',tags:['黄金时代','五大名窑']},
{name:'元代',era:'约700年前',desc:'青花瓷成熟，釉里红创烧成功。景德镇成为全国制瓷中心，产品远销海外。',tags:['青花瓷','外销']},
{name:'明清时期',era:'约600年前',desc:'彩瓷大放异彩，斗彩、五彩、粉彩、珐琅彩争奇斗艳。景德镇成为"瓷都"。',tags:['彩瓷','瓷都']}
]},
porcelain:{title:'瓷器之都——景德镇',content:'<div class="item" style="cursor:default"><h4>🏙️ 千年瓷都</h4><p class="desc">景德镇位于江西省，因宋真宗景德年间（1004年）烧制御瓷而得名。至今已有两千多年的制瓷历史，是中国乃至世界的"瓷都"。</p></div><div class="item" style="cursor:default"><h4>🎨 四大名瓷</h4><p class="desc">• 青花瓷：蓝白相间，素雅清新<br>• 粉彩瓷：色彩丰富，柔美细腻<br>• 颜色釉：窑变幻化，天成之美<br>• 雕刻瓷：精雕细琢，巧夺天工</p></div><div class="item" style="cursor:default"><h4>🏛️ 御窑厂</h4><p class="desc">明清两代的官窑所在地，专门为皇室烧制瓷器。御窑厂遗址是全国重点文物保护单位，出土了大量珍贵瓷器。</p></div><div class="item" style="cursor:default"><h4>🌍 世界影响</h4><p class="desc">景德镇瓷器通过海上丝绸之路远销世界各地，对欧洲、日本等地的陶瓷生产产生了深远影响。"China"一词即源于此。</p></div>'},
quiz:{title:'中国陶瓷知识测验',questions:[
{q:'宋代五大名窑不包括以下哪一个？',options:['汝窑','钧窑','景德镇窑','定窑'],answer:2,explain:'五大名窑是汝、官、哥、钧、定。景德镇窑虽然著名，但不在五大名窑之列。'},
{q:'"入窑一色，出窑万彩"形容的是？',options:['汝窑','钧窑','哥窑','官窑'],answer:1,explain:'钧窑以窑变釉闻名，烧制前釉色单一，烧制后呈现多彩变化。'},
{q:'青花瓷的着色剂是什么？',options:['铜','铁','钴','锰'],answer:2,explain:'青花瓷以钴料为着色剂，在胎上绘画后罩透明釉高温烧成。'},
{q:'景德镇因哪个朝代烧制御瓷而得名？',options:['唐朝','宋朝','元朝','明朝'],answer:1,explain:'景德镇因宋真宗景德年间（1004年）烧制御瓷而得名。'},
{q："白如玉、薄如纸、声如磬"形容的是？',options:['景德镇白瓷','德化白瓷','定窑白瓷','邢窑白瓷'],answer:2,explain:'这是对宋代定窑白瓷的经典描述。定窑以白瓷著称，胎薄质细。'}]}
};
function switchTab(name,el){
document.querySelectorAll('.tab-bar .tab').forEach(function(t){t.classList.remove('active')});
el.classList.add('active');
renderContent(name);
}
function renderContent(name){
var d=data[name];
var html='<div class="card"><h3>'+d.title+'</h3>';
if(d.content) html+=d.content;
if(d.items){
d.items.forEach(function(item){
html+='<div class="item"><h4>'+item.name+'</h4>';
if(item.location) html+='<div class="meta">'+item.location+(item.era?' · '+item.era:'')+'</div>';
else if(item.era) html+='<div class="meta">'+item.era+'</div>';
html+='<div class="desc">'+item.desc+'</div>';
if(item.tags) html+='<div style="margin-top:8px">'+item.tags.map(function(t){return '<span class="tag" style="background:rgba(59,130,246,.15);color:var(--blue)">'+t+'</span>'}).join('')+'</div>';
html+='</div>';
});
}
if(d.questions){
d.questions.forEach(function(q,i){
html+='<div class="item" style="cursor:default" id="q'+i+'"><h4>'+q.q+'</h4>';
q.options.forEach(function(opt,j){
html+='<div class="quiz-option" onclick="checkAnswer('+i+','+j+','+q.answer+',this)">'+String.fromCharCode(65+j)+'. '+opt+'</div>';
});
html+='<div class="explain" style="display:none;margin-top:8px;padding:8px;background:rgba(59,130,246,.1);border-radius:8px;font-size:.85rem">'+q.explain+'</div></div>';
});
}
html+='</div>';
document.getElementById('content').innerHTML=html;
}
function showGlazeInfo(name){
var el=document.getElementById('glazeDetail');
var info=data.glazes.items.find(function(g){return g.name===name});
if(info){el.innerHTML='<h4>'+info.name+'</h4><div class="desc">'+info.desc+'</div>';}
}
function checkAnswer(qi,oi,correct,el){
var q=document.getElementById('q'+qi);
var opts=q.querySelectorAll('.quiz-option');
opts.forEach(function(o,i){
if(i===correct) o.style.borderColor='var(--green)';
else if(i===oi) o.style.borderColor='var(--red)';
});
q.querySelector('.explain').style.display='block';
}
renderContent('overview');
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
