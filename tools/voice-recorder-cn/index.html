<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎙️ 语音录音机</title>
<meta name="description" content="在线语音录音机，支持录音、暂停、回放、下载WAV格式">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.recorder-center{display:flex;flex-direction:column;align-items:center;padding:30px 0}
.rec-btn{width:100px;height:100px;border-radius:50%;border:none;font-size:40px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.3)}
.rec-btn:hover{transform:scale(1.05)}
.rec-btn:active{transform:scale(.95)}
.rec-btn.recording{background:#ef4444;animation:pulse 1s infinite}
.rec-btn.paused{background:#f59e0b}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 20px rgba(239,68,68,0)}}
.timer{font-size:36px;font-weight:700;font-family:monospace;margin:16px 0;color:var(--text)}
.waveform-wrap{width:100%;height:100px;border-radius:12px;background:var(--preview-bg);overflow:hidden;margin:12px 0}
canvas#waveform{width:100%;height:100%}
.level-bar{width:100%;height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin:8px 0}
.level-fill{height:100%;background:linear-gradient(90deg,#10b981,#f59e0b,#ef4444);border-radius:4px;transition:width .1s}
.control-row{display:flex;gap:10px;margin-top:16px;justify-content:center}
.ctrl-btn{width:48px;height:48px;border-radius:50%;border:2px solid var(--border);background:var(--card-bg);font-size:20px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.ctrl-btn:hover{border-color:var(--accent);transform:scale(1.1)}
.recordings{margin-top:12px}
.recording-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--preview-bg);margin-bottom:8px}
.recording-item .info{flex:1}
.recording-item .name{font-size:14px;font-weight:600}
.recording-item .meta{font-size:12px;color:var(--text-secondary)}
.recording-item .actions{display:flex;gap:6px}
.recording-item .act-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.recording-item .act-btn:hover{border-color:var(--accent)}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slider-row label{font-size:13px;color:var(--text-secondary);min-width:60px}
.slider-row select{flex:1;padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text)}
.footer{text-align:center;padding:20px 0;font-size:12px;color:var(--text-secondary)}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🎙️ 语音录音机</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">📊 音频电平</div>
<div class="level-bar"><div class="level-fill" id="levelFill" style="width:0%"></div></div>
<div class="waveform-wrap"><canvas id="waveform"></canvas></div>
</div>
<div class="card">
<div class="recorder-center">
<button class="rec-btn" id="recBtn" onclick="toggleRecord()">🎤</button>
<div class="timer" id="timer">00:00.0</div>
<div class="control-row">
<button class="ctrl-btn" id="pauseBtn" onclick="togglePause()" disabled>⏸️</button>
<button class="ctrl-btn" id="stopBtn" onclick="stopRecord()" disabled>⏹️</button>
</div>
</div>
</div>
<div class="card">
<div class="card-title">⚙️ 录音设置</div>
<div class="slider-row">
<label>采样率</label>
<select id="sampleRate"><option value="44100">44100 Hz</option><option value="48000">48000 Hz</option><option value="22050">22050 Hz</option></select>
</div>
<div class="slider-row">
<label>声道</label>
<select id="channels"><option value="1">单声道</option><option value="2">立体声</option></select>
</div>
</div>
<div class="card">
<div class="card-title">💾 录音记录</div>
<div id="recordings" class="recordings"><p style="color:var(--text-secondary);font-size:13px">暂无录音记录</p></div>
</div>
<div class="footer">语音录音机 - 基于 Web Audio API</div>
</div>
<script>
let audioCtx,analyser,mediaStream,recorder,chunks=[],startTime,timerInterval,isRecording=false,isPaused=false,pausedAt=0,recordings=[],animFrame;
const recBtn=document.getElementById('recBtn'),pauseBtn=document.getElementById('pauseBtn'),stopBtn=document.getElementById('stopBtn'),timerEl=document.getElementById('timer'),levelFill=document.getElementById('levelFill'),canvas=document.getElementById('waveform'),ctx2d=canvas.getContext('2d');
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
async function toggleRecord(){
if(!isRecording){try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:parseInt(document.getElementById('channels').value),sampleRate:parseInt(document.getElementById('sampleRate').value)}});audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=2048;const src=audioCtx.createMediaStreamSource(mediaStream);src.connect(analyser);recorder=new MediaRecorder(mediaStream);chunks=[];recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};recorder.onstop=saveRecording;recorder.start();isRecording=true;isPaused=false;startTime=Date.now();timerInterval=setInterval(updateTimer,100);recBtn.classList.add('recording');recBtn.textContent='⏹️';pauseBtn.disabled=false;stopBtn.disabled=false;drawWaveform()}catch(e){alert('请允许麦克风权限')}}
else{stopRecord()}}
function togglePause(){if(isPaused){recorder.resume();isPaused=false;startTime=Date.now()-pausedAt;timerInterval=setInterval(updateTimer,100);pauseBtn.textContent='⏸️';recBtn.classList.remove('paused')}else{recorder.pause();isPaused=true;pausedAt=Date.now()-startTime;clearInterval(timerInterval);pauseBtn.textContent='▶️';recBtn.classList.add('paused')}}
function stopRecord(){if(recorder&&recorder.state!=='inactive')recorder.stop();if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close();isRecording=false;isPaused=false;clearInterval(timerInterval);cancelAnimationFrame(animFrame);recBtn.classList.remove('recording','paused');recBtn.textContent='🎤';pauseBtn.disabled=true;stopBtn.disabled=true;pauseBtn.textContent='⏸️';levelFill.style.width='0%';ctx2d.clearRect(0,0,canvas.width,canvas.height)}
function updateTimer(){const d=Date.now()-startTime;const m=Math.floor(d/60000);const s=Math.floor((d%60000)/1000);const ms=Math.floor((d%1000)/100);timerEl.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+ms}
function drawWaveform(){if(!isRecording||isPaused)return;const buf=new Uint8Array(analyser.frequencyBinCount);analyser.getByteTimeDomainData(buf);const freq=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(freq);let sum=0;for(let i=0;i<freq.length;i++)sum+=freq[i];levelFill.style.width=Math.min(100,sum/freq.length*2)+'%';canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2;ctx2d.clearRect(0,0,canvas.width,canvas.height);ctx2d.beginPath();const sl=buf.length;const sw=canvas.width/sl;for(let i=0;i<sl;i++){const v=buf[i]/128;const y=v*canvas.height/2;i===0?ctx2d.moveTo(0,y):ctx2d.lineTo(i*sw,y)}ctx2d.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent');ctx2d.lineWidth=2;ctx2d.stroke();animFrame=requestAnimationFrame(drawWaveform)}
function saveRecording(){const blob=new Blob(chunks,{type:'audio/webm'});const url=URL.createObjectURL(blob);const d=new Date();const name='录音_'+d.getFullYear()+(d.getMonth()+1)+d.getDate()+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+String(d.getSeconds()).padStart(2,'0');recordings.push({name,url,blob,size:(blob.size/1024).toFixed(1)+'KB',duration:timerEl.textContent});renderRecordings()}
function renderRecordings(){const el=document.getElementById('recordings');if(!recordings.length){el.innerHTML='<p style="color:var(--text-secondary);font-size:13px">暂无录音记录</p>';return}el.innerHTML=recordings.map((r,i)=>`<div class="recording-item"><div class="info"><div class="name">${r.name}</div><div class="meta">${r.duration} | ${r.size}</div></div><div class="actions"><button class="act-btn" onclick="playRec(${i})">▶️</button><button class="act-btn" onclick="downloadRec(${i})">⬇️</button><button class="act-btn" onclick="deleteRec(${i})">🗑️</button></div></div>`).join('')}
function playRec(i){const a=new Audio(recordings[i].url);a.play()}
function downloadRec(i){const a=document.createElement('a');a.href=recordings[i].url;a.download=recordings[i].name+'.webm';a.click()}
function deleteRec(i){URL.revokeObjectURL(recordings[i].url);recordings.splice(i,1);renderRecordings()}
</script>
</body>
</html>
