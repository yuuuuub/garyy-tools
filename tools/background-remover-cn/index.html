<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✂️ 背景去除器</title>
<meta name="description" content="在线背景去除器，智能抠图、色度抠图、手动擦除，一键去除图片背景">
<style>
:root{--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s}
.upload-area:hover{border-color:var(--accent);background:var(--tag-bg)}
.upload-icon{font-size:48px;margin-bottom:8px}
.upload-text{font-size:14px;color:var(--text-secondary)}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare-box{border-radius:10px;overflow:hidden;border:1px solid var(--border);background:repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 50%/16px 16px}
.compare-box img,.compare-box canvas{width:100%;height:auto;display:block}
.compare-label{padding:6px;font-size:12px;color:var(--text-secondary);background:var(--preview-bg);text-align:center}
.tag-grid{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);cursor:pointer;font-size:13px;transition:all .2s;user-select:none}
.tag:hover{border-color:var(--accent);transform:translateY(-1px)}
.tag.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slider-row label{font-size:13px;color:var(--text-secondary);min-width:60px}
.slider-row input[type="range"]{flex:1}
.slider-row span{font-size:13px;color:var(--text-secondary);min-width:36px;text-align:right}
.color-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.color-swatch{width:32px;height:32px;border-radius:8px;border:2px solid var(--border);cursor:pointer;transition:all .2s}
.color-swatch:hover{transform:scale(1.1)}
.color-swatch.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.hidden{display:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✂️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="✂️ 背景去除器">
<meta property="og:description" content="在线背景去除器，智能抠图一键去背景">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/background-remover-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>✂️ 背景去除器</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card" id="uploadCard">
    <div class="card-title">📤 上传图片</div>
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">🖼️</div>
      <div class="upload-text">点击或拖拽上传图片</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="card hidden" id="modeCard">
    <div class="card-title">🔧 抠图模式</div>
    <div class="tag-grid" id="modeGrid"></div>
  </div>

  <div class="card hidden" id="colorCard">
    <div class="card-title">🎯 选择背景颜色</div>
    <div class="color-row" id="presetColors"></div>
    <div style="margin-top:10px;display:flex;align-items:center;gap:8px">
      <span style="font-size:13px;color:var(--text-secondary)">自定义:</span>
      <input type="color" id="customColor" value="#00ff00" style="width:40px;height:36px;border:none;cursor:pointer">
      <button class="btn btn-outline" style="flex:none;padding:8px 14px" onclick="useCustomColor()">使用</button>
      <button class="btn btn-outline" style="flex:none;padding:8px 14px" onclick="pickFromImage()">🔍 取色</button>
    </div>
  </div>

  <div class="card hidden" id="toleranceCard">
    <div class="card-title">📐 容差调节</div>
    <div class="slider-row"><label>容差</label><input type="range" min="0" max="100" value="30" id="tolerance" oninput="document.getElementById('tolVal').textContent=this.value"><span id="tolVal">30</span></div>
    <div class="slider-row"><label>羽化</label><input type="range" min="0" max="10" value="1" id="feather" oninput="document.getElementById('feaVal').textContent=this.value"><span id="feaVal">1</span></div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="processImage()">✂️ 开始抠图</button>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="card-title">👁️ 对比预览</div>
    <div class="compare-grid">
      <div><div class="compare-box"><canvas id="origCanvas"></canvas></div><div class="compare-label">原图</div></div>
      <div><div class="compare-box"><canvas id="resultCanvas"></canvas></div><div class="compare-label">抠图结果</div></div>
    </div>
  </div>

  <div class="btn-row hidden" id="btnRow">
    <button class="btn btn-primary" onclick="downloadResult()">💾 下载PNG</button>
    <button class="btn btn-outline" onclick="resetAll()">🔄 重新开始</button>
  </div>

  <footer>背景去除器 · 所有处理本地完成</footer>
</div>
<div class="toast" id="toast"></div>
<script src="../i18n.js" defer></script>
<script>
let baseImage = null, mode = 'chroma', bgColor = '#00ff00', pickingColor = false;
const modes = [{name:'色度抠图',id:'chroma',icon:'🟢'},{name:'魔棒',id:'magic',icon:'🪄'},{name:'手动擦除',id:'manual',icon:'🧹'}];
const presetColors = ['#00ff00','#0000ff','#ff0000','#000000','#ffffff','#ffff00','#ff00ff','#00ffff'];

function init() {
  document.getElementById('modeGrid').innerHTML = modes.map(m => `<div class="tag${m.id===mode?' active':''}" onclick="setMode('${m.id}')">${m.icon} ${m.name}</div>`).join('');
  document.getElementById('presetColors').innerHTML = presetColors.map(c => `<div class="color-swatch${c===bgColor?' active':''}" style="background:${c}" onclick="setBgColor('${c}')"></div>`).join('');

  const ua = document.getElementById('uploadArea');
  const fi = document.getElementById('fileInput');
  ua.addEventListener('click', () => fi.click());
  ua.addEventListener('dragover', e => { e.preventDefault(); ua.classList.add('dragover'); });
  ua.addEventListener('dragleave', () => ua.classList.remove('dragover'));
  ua.addEventListener('drop', e => { e.preventDefault(); ua.classList.remove('dragover'); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
  fi.addEventListener('change', e => { if(e.target.files[0]) loadFile(e.target.files[0]); });

  // manual mode mouse events
  const rc = document.getElementById('resultCanvas');
  rc.addEventListener('mousedown', startManual);
  rc.addEventListener('mousemove', doManual);
  rc.addEventListener('mouseup', endManual);
  rc.addEventListener('mouseleave', endManual);
}

function loadFile(f) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      baseImage = img;
      const maxW = 540, ratio = Math.min(maxW / img.width, 1);
      ['origCanvas','resultCanvas'].forEach(id => {
        const c = document.getElementById(id);
        c.width = img.width * ratio; c.height = img.height * ratio;
      });
      document.getElementById('origCanvas').getContext('2d').drawImage(img, 0, 0, document.getElementById('origCanvas').width, document.getElementById('origCanvas').height);
      document.getElementById('resultCanvas').getContext('2d').drawImage(img, 0, 0, document.getElementById('resultCanvas').width, document.getElementById('resultCanvas').height);
      ['uploadCard'].forEach(id => document.getElementById(id).classList.add('hidden'));
      ['modeCard','toleranceCard','resultCard','btnRow'].forEach(id => document.getElementById(id).classList.remove('hidden'));
      toggleColorCard();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('#modeGrid .tag').forEach(el => el.classList.toggle('active', el.textContent.includes(modes.find(md=>md.id===m).name)));
  toggleColorCard();
}

function toggleColorCard() {
  document.getElementById('colorCard').classList.toggle('hidden', mode !== 'chroma');
}

function setBgColor(c) {
  bgColor = c;
  document.querySelectorAll('#presetColors .color-swatch').forEach(el => el.classList.toggle('active', el.style.background === c));
}

function useCustomColor() { bgColor = document.getElementById('customColor').value; showToast(`背景色: ${bgColor}`); }

function pickFromImage() {
  pickingColor = true;
  showToast('点击图片取色...');
  document.getElementById('resultCanvas').style.cursor = 'crosshair';
}

function processImage() {
  if (!baseImage) return;
  const rc = document.getElementById('resultCanvas');
  const ctx = rc.getContext('2d');
  ctx.drawImage(baseImage, 0, 0, rc.width, rc.height);
  const id = ctx.getImageData(0, 0, rc.width, rc.height);
  const d = id.data;
  const tol = +document.getElementById('tolerance').value;
  const feather = +document.getElementById('feather').value;

  const bg = hexToRgb(bgColor);

  if (mode === 'chroma') {
    for (let i = 0; i < d.length; i += 4) {
      const dr = d[i] - bg.r, dg = d[i+1] - bg.g, db = d[i+2] - bg.b;
      const dist = Math.sqrt(dr*dr + dg*dg + db*db);
      if (dist < tol * 3) {
        d[i+3] = Math.max(0, Math.min(255, Math.round((dist / (tol * 3)) * 255)));
      }
    }
  } else if (mode === 'magic') {
    // Simple edge detection: remove near-uniform regions
    for (let i = 0; i < d.length; i += 4) {
      const x = (i/4) % rc.width, y = Math.floor((i/4) / rc.width);
      if (x === 0 || x === rc.width-1 || y === 0 || y === rc.height-1) continue;
      const neighbors = [
        d[i-4], d[i-4+1], d[i-4+2],
        d[i+4], d[i+4+1], d[i+4+2],
        d[i-rc.width*4], d[i-rc.width*4+1], d[i-rc.width*4+2],
        d[i+rc.width*4], d[i+rc.width*4+1], d[i+rc.width*4+2]
      ];
      let variance = 0;
      for (let j = 0; j < neighbors.length; j += 3) {
        variance += Math.abs(neighbors[j] - d[i]) + Math.abs(neighbors[j+1] - d[i+1]) + Math.abs(neighbors[j+2] - d[i+2]);
      }
      variance /= (neighbors.length / 3);
      if (variance < tol * 2) d[i+3] = 0;
    }
  }

  // feather
  if (feather > 0) {
    for (let i = 0; i < d.length; i += 4) {
      if (d[i+3] > 0 && d[i+3] < 255) {
        d[i+3] = Math.min(255, d[i+3] + feather * 10);
      }
    }
  }

  ctx.putImageData(id, 0, 0);
  showToast('抠图完成！');
}

let manualDrawing = false;
function startManual(e) {
  if (mode !== 'manual' && !pickingColor) return;
  if (pickingColor) {
    const rc = document.getElementById('resultCanvas');
    const r = rc.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * rc.width;
    const y = (e.clientY - r.top) / r.height * rc.height;
    const ctx = rc.getContext('2d');
    const px = ctx.getImageData(x, y, 1, 1).data;
    bgColor = `#${[px[0],px[1],px[2]].map(v=>v.toString(16).padStart(2,'0')).join('')}`;
    pickingColor = false;
    rc.style.cursor = 'crosshair';
    showToast(`取色: ${bgColor}`);
    return;
  }
  manualDrawing = true;
  doManual(e);
}

function doManual(e) {
  if (!manualDrawing || mode !== 'manual') return;
  const rc = document.getElementById('resultCanvas');
  const ctx = rc.getContext('2d');
  const r = rc.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * rc.width;
  const y = (e.clientY - r.top) / r.height * rc.height;
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(x, y, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

function endManual() { manualDrawing = false; }

function hexToRgb(hex) {
  const n = parseInt(hex.replace('#',''), 16);
  return { r: (n >> 16) & 0xff, g: (n >> 8) & 0xff, b: n & 0xff };
}

function downloadResult() {
  const c = document.getElementById('resultCanvas');
  const a = document.createElement('a');
  a.download = 'removed-bg.png'; a.href = c.toDataURL('image/png'); a.click();
  showToast('已下载！');
}

function resetAll() {
  baseImage = null;
  document.getElementById('uploadCard').classList.remove('hidden');
  ['modeCard','colorCard','toleranceCard','resultCard','btnRow'].forEach(id => document.getElementById(id).classList.add('hidden'));
}

function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

init();
</script>
</body>
</html>
