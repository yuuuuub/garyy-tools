<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS游乐场 - 在线JavaScript编辑器</title>
<meta name="description" content="在线JavaScript编辑器，实时运行和调试JS代码，支持console输出">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;--muted:#8b949e}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warning:#9a6700;--error:#cf222e;--muted:#656d76}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
nav .logo{font-size:18px;font-weight:600;color:var(--accent2)}
nav a{color:var(--accent);text-decoration:none;font-size:14px}
.container{display:flex;flex-direction:column;height:calc(100vh - 52px)}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s}
.btn-primary{background:var(--success);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{opacity:.8}
.workspace{display:flex;flex:1;overflow:hidden}
.editor-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.console-panel{flex:1;display:flex;flex-direction:column}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;font-size:13px;color:var(--accent2);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.editor-wrapper{flex:1;position:relative}
#jsEditor{width:100%;height:100%;background:var(--bg);border:none;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:14px;padding:12px;resize:none;outline:none;line-height:1.6}
.console-output{flex:1;overflow-y:auto;padding:12px;font-family:"Fira Code",Consolas,monospace;font-size:13px;line-height:1.6}
.console-item{padding:6px 10px;border-bottom:1px solid var(--border);word-break:break-all}
.console-item.log{color:var(--text)}
.console-item.error{color:var(--error);background:rgba(248,81,73,0.1)}
.console-item.warn{color:var(--warning);background:rgba(210,153,34,0.1)}
.console-item.info{color:var(--accent2)}
.console-item .prefix{margin-right:8px;font-weight:bold}
.templates{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.templates span{font-size:12px;color:var(--muted);margin-right:4px}
.template-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--accent2);cursor:pointer;transition:.2s}
.template-btn:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:768px){.workspace{flex-direction:column}.editor-panel{border-right:none;border-bottom:1px solid var(--border)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="JS游乐场 - 在线JavaScript编辑器">
<meta property="og:description" content="在线JavaScript编辑器，实时运行和调试JS代码">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/js-playground-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="/i18n.js" defer></script>
</head>
<body>
<h1>JS游乐场 - 在线JavaScript编辑器</h1>
<nav>
<span class="logo">JS游乐场</span>
<a href="/index.html">← 返回工具箱</a>
</nav>
<div class="container">
<div class="toolbar">
<button class="btn btn-primary" onclick="runCode()">▶ 运行</button>
<button class="btn btn-secondary" onclick="clearConsole()">清空控制台</button>
<button class="btn btn-secondary" onclick="copyCode()">复制代码</button>
<button class="btn btn-secondary" onclick="resetCode()">重置</button>
</div>
<div class="templates">
<span>模板:</span>
<button class="template-btn" data-code="// 基础语法\nconst name = 'JavaScript';\nconsole.log(\`Hello, ${'{}'}!\`);">基础语法</button>
<button class="template-btn" data-code="// 数组操作\nconst arr = [1, 2, 3, 4, 5];\nconsole.log('原数组:', arr);\nconsole.log('过滤偶数:', arr.filter(x => x % 2 === 0));\nconsole.log('平方:', arr.map(x => x * x));\nconsole.log('求和:', arr.reduce((a, b) => a + b, 0));">数组操作</button>
<button class="template-btn" data-code="// 异步编程\nasync function fetchData() {\n  console.log('开始请求...');\n  await new Promise(r => setTimeout(r, 1000));\n  console.log('请求完成!');\n  return { data: '模拟数据' };\n}\nfetchData().then(result => console.log('结果:', result));">异步编程</button>
<button class="template-btn" data-code="// 类和继承\nclass Animal {\n  constructor(name) { this.name = name; }\n  speak() { console.log(\`\${this.name}发出声音\`); }\n}\nclass Dog extends Animal {\n  speak() { console.log(\`\${this.name}汪汪叫\`); }\n}\nnew Dog('小狗').speak();">类和继承</button>
<button class="template-btn" data-code="// 解构赋值\nconst user = { name: '张三', age: 25, hobbies: ['编程', '阅读'] };\nconst { name, age, hobbies } = user;\nconsole.log('姓名:', name);\nconsole.log('年龄:', age);\nconsole.log('爱好:', hobbies.join(', '));">解构赋值</button>
<button class="template-btn" data-code="// Promise链式调用\nfunction delay(ms) {\n  return new Promise(r => setTimeout(r, ms));\n}\nconsole.log('开始');\ndelay(500).then(() => {\n  console.log('500ms后');\n  return delay(500);\n}).then(() => {\n  console.log('1000ms后');\n});">Promise链式调用</button>
</div>
<div class="workspace">
<div class="editor-panel">
<div class="panel-header">JavaScript代码</div>
<div class="editor-wrapper">
<textarea id="jsEditor">// 在此编写JavaScript代码
const name = 'JavaScript';
console.log(`Hello, ${name}!`);
console.info('这是一条信息');
console.warn('这是一条警告');
console.error('这是一条错误');

// 数组操作
const numbers = [1, 2, 3, 4, 5];
console.log('原数组:', numbers);
console.log('翻倍:', numbers.map(n => n * 2));</textarea>
</div>
</div>
<div class="console-panel">
<div class="panel-header">
<span>控制台输出</span>
<span id="consoleCount" style="color:var(--muted);font-size:12px">0 条日志</span>
</div>
<div class="console-output" id="consoleOutput">
<div style="color:var(--muted);font-size:13px">点击"运行"执行代码</div>
</div>
</div>
</div>
</div>
<script>
const jsEditor = document.getElementById('jsEditor');
const consoleOutput = document.getElementById('consoleOutput');
const consoleCount = document.getElementById('consoleCount');
let logCount = 0;

function clearConsole() {
  consoleOutput.innerHTML = '';
  logCount = 0;
  consoleCount.textContent = '0 条日志';
}

function addLog(type, prefix, args) {
  const item = document.createElement('div');
  item.className = 'console-item ' + type;
  const text = args.map(arg => {
    if (typeof arg === 'object') try { return JSON.stringify(arg, null, 2); } catch(e) { return String(arg); }
    return String(arg);
  }).join(' ');
  item.innerHTML = '<span class="prefix">[' + prefix + ']</span>' + escapeHtml(text);
  consoleOutput.appendChild(item);
  consoleOutput.scrollTop = consoleOutput.scrollHeight;
  logCount++;
  consoleCount.textContent = logCount + ' 条日志';
}

function escapeHtml(t) {
  return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function runCode() {
  clearConsole();
  const code = jsEditor.value;
  const origLog = console.log, origErr = console.error, origWarn = console.warn, origInfo = console.info;
  const sandbox = {
    log: (...a) => { addLog('log', 'LOG', a); origLog.apply(console, a); },
    error: (...a) => { addLog('error', 'ERROR', a); origErr.apply(console, a); },
    warn: (...a) => { addLog('warn', 'WARN', a); origWarn.apply(console, a); },
    info: (...a) => { addLog('info', 'INFO', a); origInfo.apply(console, a); }
  };
  try {
    const fn = new Function('console', code);
    fn(sandbox);
  } catch(e) {
    addLog('error', 'EXCEPTION', [e.message]);
  }
}

function copyCode() {
  navigator.clipboard.writeText(jsEditor.value).then(() => alert('代码已复制'));
}

function resetCode() {
  jsEditor.value = '// 在此编写JavaScript代码\nconst name = \'JavaScript\';\nconsole.log(`Hello, ${name}!`);';
  clearConsole();
}

document.querySelectorAll('.template-btn').forEach(btn => {
  btn.onclick = () => { jsEditor.value = btn.dataset.code; clearConsole(); };
});

jsEditor.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runCode(); }
});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
