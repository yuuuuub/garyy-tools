<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国算命大全 V2 | Chinese Fortune V2</title>
<meta property="og:title" content="中国算命大全 V2 | Chinese Fortune V2">
<meta property="og:description" content="中国算命大全 V2 | Chinese Fortune V2 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="中国算命大全：八字排盘、姓名测算、紫微斗数、姻缘配对。全面的中国命理文化工具。">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a843;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:800px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.8rem;color:var(--gold)}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
.tab{padding:8px 18px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.85rem;transition:.2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab:hover{border-color:var(--blue)}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.input-group input,.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}
.input-group input:focus{border-color:var(--blue);outline:none}
.row{display:flex;gap:12px}
.row .input-group{flex:1}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}
.btn:hover{opacity:.85}
.result-area{margin-top:16px;padding:16px;background:var(--bg);border-radius:8px;border:1px solid var(--border);display:none}
.result-area.show{display:block}
.section h3{font-size:1rem;margin-bottom:10px;color:var(--blue)}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.info-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.info-value{font-size:1.3rem;color:var(--gold);font-weight:700}
.info-label{font-size:.7rem;color:var(--text2);margin-top:4px}
.palace-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.palace{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;font-size:.8rem}
.palace .p-name{color:var(--gold);font-weight:600;margin-bottom:4px}
.palace .p-star{color:var(--text2);font-size:.75rem}
.compat-score{font-size:2.5rem;color:var(--gold);text-align:center;font-weight:700}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78rem;margin:2px}
.tag.good{background:rgba(35,134,54,.15);color:var(--green);border:1px solid rgba(35,134,54,.3)}
.tag.bad{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
#themeBtn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer;font-size:.8rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button id="themeBtn" onclick="toggleTheme()">🌓 主题</button>
<div class="container">
<h1>🔮 中国算命大全 V2</h1>
<p class="sub">八字排盘 · 姓名测算 · 紫微斗数 · 姻缘配对</p>

<div class="tabs">
<button class="tab active" onclick="switchTab('bazi')">八字排盘</button>
<button class="tab" onclick="switchTab('name')">姓名测算</button>
<button class="tab" onclick="switchTab('ziwei')">紫微斗数</button>
<button class="tab" onclick="switchTab('marriage')">姻缘配对</button>
</div>

<div class="card" id="baziPanel">
<div class="row">
<div class="input-group"><label>出生日期</label><input type="date" id="baziDate"></div>
<div class="input-group"><label>出生时间</label><input type="time" id="baziTime" value="12:00"></div>
</div>
<button class="btn" onclick="calcBazi()">排盘</button>
<div class="result-area" id="baziResult"></div>
</div>

<div class="card" id="namePanel" style="display:none">
<div class="input-group"><label>输入姓名</label><input type="text" id="nameInput" placeholder="请输入中文姓名"></div>
<button class="btn" onclick="calcName()">测算</button>
<div class="result-area" id="nameResult"></div>
</div>

<div class="card" id="ziweiPanel" style="display:none">
<div class="row">
<div class="input-group"><label>出生日期</label><input type="date" id="zwDate"></div>
<div class="input-group"><label>性别</label><select id="zwGender"><option value="male">男</option><option value="female">女</option></select></div>
</div>
<button class="btn" onclick="calcZiwei()">排盘</button>
<div class="result-area" id="zwResult"></div>
</div>

<div class="card" id="marriagePanel" style="display:none">
<div class="input-group"><label>你的姓名</label><input type="text" id="m1Name" placeholder="请输入姓名"></div>
<div class="input-group"><label>对方姓名</label><input type="text" id="m2Name" placeholder="请输入姓名"></div>
<button class="btn" onclick="calcMarriage()">配对</button>
<div class="result-area" id="marriageResult"></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var tianGan=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var diZhi=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var wuxingMap=['木','木','火','火','土','土','金','金','水','水'];
var animals=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
var zwStars=['紫微','天机','太阳','武曲','天同','廉贞','天府','太阴','贪狼','巨门','天相','天梁','七杀','破军','文昌','文曲','左辅','右弼','天魁','天钺','禄存','擎羊','陀罗','火星','铃星','地空','地劫','天刑','天姚','红鸾','天喜','天马','解神','天巫','华盖'];
var zwPalaces=['命宫','兄弟','夫妻','子女','财帛','疾厄','迁移','交友','官禄','田宅','福德','父母'];

function switchTab(tab){
document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
event.target.classList.add('active');
['baziPanel','namePanel','ziweiPanel','marriagePanel'].forEach(function(id){document.getElementById(id).style.display='none'});
var map={bazi:'baziPanel',name:'namePanel',ziwei:'ziweiPanel',marriage:'marriagePanel'};
document.getElementById(map[tab]).style.display='block';
}

function calcBazi(){
var ds=document.getElementById('baziDate').value;
var ts=document.getElementById('baziTime').value;
if(!ds){alert('请选择出生日期');return}
var d=new Date(ds+'T'+ts);
var y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
var h=parseInt(ts.split(':')[0]);
var yg=(y-4)%10,yz=(y-4)%12;
var mg=(y*2+m)%10,mz=(m+1)%12;
var dg=(y*5+m*6+day)%10,dz=(y*5+m*6+day)%12;
var hg=(dg*2+Math.floor(h/2))%10,hz=Math.floor(h/2)%12;
var pillars=[
{gan:tianGan[yg],zhi:diZhi[yz],wx:wuxingMap[yg],label:'年柱'},
{gan:tianGan[mg],zhi:diZhi[mz],wx:wuxingMap[mg],label:'月柱'},
{gan:tianGan[dg],zhi:diZhi[dz],wx:wuxingMap[dg],label:'日柱'},
{gan:tianGan[hg],zhi:diZhi[hz],wx:wuxingMap[hg],label:'时柱'}
];
var wxCount={木:0,火:0,土:0,金:0,水:0};
pillars.forEach(function(p){wxCount[p.wx]++});
var dayMaster=pillars[2].wx;
var r=document.getElementById('baziResult');
r.className='result-area show';
var html='<div class="section"><h3>📋 八字排盘结果</h3></div>';
html+='<div class="info-grid">';
pillars.forEach(function(p){
html+='<div class="info-item"><div class="info-value">'+p.gan+p.zhi+'</div><div class="info-label">'+p.label+'</div></div>';
});
html+='</div>';
html+='<div style="margin-top:16px;padding:12px;background:var(--card);border-radius:8px;border:1px solid var(--border)">';
html+='<div><strong>生肖：</strong>'+animals[yz]+'</div>';
html+='<div><strong>日主：</strong>'+pillars[2].gan+' ('+dayMaster+')</div>';
html+='<div style="margin-top:8px"><strong>五行统计：</strong></div>';
html+='<div style="display:flex;gap:8px;margin-top:6px">';
Object.keys(wxCount).forEach(function(k){
var c=wxCount[k];var color=k==='木'?'#4caf50':k==='火'?'#f44336':k==='土'?'#ff9800':k==='金'?'#ffd700':'#2196f3';
html+='<span class="tag '+(c===0?'bad':'good')+'" style="border-color:'+color+'">'+k+' '+c+'</span>';
});
html+='</div></div>';

var dominant=Object.keys(wxCount).reduce(function(a,b){return wxCount[a]>wxCount[b]?a:b});
var weak=Object.keys(wxCount).reduce(function(a,b){return wxCount[a]<wxCount[b]?a:b});
var dayMasterCycle={木:'火',火:'土',土:'金',金:'水',水:'木'};
var favorable=dayMasterCycle[dayMaster];
html+='<div style="margin-top:12px;padding:12px;background:var(--card);border-radius:8px;border:1px solid var(--border)">';
html+='<div><strong>喜用神：</strong><span class="tag good">'+favorable+'</span></div>';
html+='<div><strong>五行最旺：</strong>'+dominant+'</div>';
html+='<div><strong>五行最弱：</strong>'+weak+'</div>';
html+='</div>';
r.innerHTML=html;
}

function calcName(){
var name=document.getElementById('nameInput').value.trim();
if(!name||name.length<2){alert('请输入至少两个字的姓名');return}
var r=document.getElementById('nameResult');
r.className='result-area show';
var strokeData=[];
var totalStrokes=0;
var wxList=[];
var wxColors={木:'#4caf50',火:'#f44336',土:'#ff9800',金:'#ffd700',水:'#2196f3'};
var wxNames=['木','火','土','金','水'];
for(var i=0;i<name.length;i++){
var code=name.charCodeAt(i);
var stroke=(code%25)+1;
var wx=wxNames[(stroke-1)%5];
strokeData.push({char:name[i],stroke:stroke,wx:wx});
totalStrokes+=stroke;
wxList.push(wx);
}
var wxCount={木:0,火:0,土:0,金:0,水:0};
wxList.forEach(function(w){wxCount[w]++});
var score=Math.min(100,60+totalStrokes%20+wxList.length*5);
var fortune=score>=90?'大吉':score>=80?'吉':score>=70?'中吉':score>=60?'小吉':'末吉';
var tianGe=strokeData[0].stroke+1;
var renGe=strokeData.length>=2?strokeData[0].stroke+strokeData[1].stroke:strokeData[0].stroke+1;
var diGe=strokeData.length>=2?strokeData[1].stroke+(strokeData.length>2?strokeData[2].stroke:1):strokeData[0].stroke+1;
var waiGe=totalStrokes+1-strokeData[0].stroke;
var zongGe=totalStrokes;

var html='<div class="section"><h3>📋 姓名测算结果</h3></div>';
html+='<div style="text-align:center;font-size:2rem;color:var(--gold);margin:12px 0">'+name+'</div>';
html+='<div style="text-align:center;margin-bottom:16px"><span class="tag good" style="font-size:1rem;padding:6px 20px">'+fortune+' '+score+'分</span></div>';
html+='<div class="info-grid" style="grid-template-columns:repeat(5,1fr)">';
strokeData.forEach(function(s){
html+='<div class="info-item"><div class="info-value">'+s.char+'</div><div class="info-label">'+s.stroke+'画 '+s.wx+'</div></div>';
});
html+='</div>';
html+='<div style="margin-top:16px;padding:12px;background:var(--card);border-radius:8px;border:1px solid var(--border)">';
html+='<div><strong>五行分布：</strong>';
Object.keys(wxCount).forEach(function(k){html+='<span class="tag '+(wxCount[k]>0?'good':'bad')+'" style="border-color:'+wxColors[k]+'">'+k+' '+wxCount[k]+'</span> '});
html+='</div>';
html+='<div style="margin-top:8px"><strong>天格：</strong>'+tianGe+' <strong>人格：</strong>'+renGe+' <strong>地格：</strong>'+diGe+' <strong>外格：</strong>'+waiGe+' <strong>总格：</strong>'+zongGe+'</div>';
html+='</div>';

var analyses=[
'聪明伶俐，思维敏捷，善于学习新知识',
'性格温和，人缘良好，适合从事创意工作',
'意志坚强，事业心强，有领导才能',
'感情细腻，重情重义，家庭观念强',
'财运较好，中年后运势上升，晚年安康'
];
html+='<div style="margin-top:12px;padding:12px;background:var(--card);border-radius:8px;border:1px solid var(--border)">';
html+='<strong>综合分析：</strong><ul style="margin-top:6px;padding-left:20px;color:var(--text2)">';
analyses.forEach(function(a){html+='<li style="margin:4px 0">'+a+'</li>'});
html+='</ul></div>';
r.innerHTML=html;
}

function calcZiwei(){
var ds=document.getElementById('zwDate').value;
var gender=document.getElementById('zwGender').value;
if(!ds){alert('请选择出生日期');return}
var d=new Date(ds);
var y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
var r=document.getElementById('zwResult');
r.className='result-area show';

var命宫Idx=((day-1)%12+m)%12;
var starsPerPalace=[];
for(var i=0;i<12;i++){
var count=(y+i)%3===0?3:(y+i)%3===1?2:1;
var pStars=[];
for(var j=0;j<count;j++){
pStars.push(zwStars[(y*3+m+j*7+i*13)%zwStars.length]);
}
starsPerPalace.push(pStars);
}

var html='<div class="section"><h3>📋 紫微斗数命盘</h3></div>';
html+='<div style="text-align:center;color:var(--text2);margin-bottom:12px">'+y+'年'+m+'月'+day+'日 · '+(gender==='male'?'男命':'女命')+'</div>';
html+='<div class="palace-grid">';
zwPalaces.forEach(function(p,i){
var stars=starsPerPalace[i]||[];
html+='<div class="palace"><div class="p-name">'+p+'</div>'+
stars.map(function(s){return '<div class="p-star">'+s+'</div>'}).join('')+'</div>';
});
html+='</div>';

var mainStar=zwStars[y%zwStars.length];
var personalityTraits={
'紫微':'帝王之相，尊贵大气，有领导才能',
'天机':'聪明机智，善于策划，思维敏捷',
'太阳':'光明磊落，热情大方，乐于助人',
'武曲':'果断刚毅，理财有道，事业心强',
'天同':'温和善良，随遇而安，人缘极好',
'廉贞':'多才多艺，感情丰富，个性鲜明'
};
html+='<div style="margin-top:16px;padding:12px;background:var(--card);border-radius:8px;border:1px solid var(--border)">';
html+='<div><strong>命主星：</strong><span style="color:var(--gold)">'+mainStar+'</span></div>';
html+='<div style="margin-top:6px"><strong>性格特点：</strong>'+
(personalityTraits[mainStar]||'个性独特，才华出众，运势平稳')+'</div>';
html+='</div>';
r.innerHTML=html;
}

function calcMarriage(){
var n1=document.getElementById('m1Name').value.trim();
var n2=document.getElementById('m2Name').value.trim();
if(!n1||!n2){alert('请输入双方姓名');return}
var r=document.getElementById('marriageResult');
r.className='result-area show';
var s1=0,s2=0;
for(var i=0;i<n1.length;i++)s1+=n1.charCodeAt(i);
for(var i=0;i<n2.length;i++)s2+=n2.charCodeAt(i);
var score=(s1+s2)%41+60;
var aspects=['默契度','包容度','幸福感','长久度','沟通力'];
var details=[];
aspects.forEach(function(a,i){
var s=Math.min(100,Math.max(40,(score+i*7)%30+70));
details.push({name:a,score:s});
});
var advice=score>=90?'天作之合，非常般配！':
score>=80?'缘分深厚，幸福美满！':
score>=70?'比较般配，互相珍惜。':
score>=60?'需要磨合，互相包容。':'差异较大，需谨慎。';

var html='<div class="section"><h3>💕 姻缘配对结果</h3></div>';
html+='<div style="text-align:center;font-size:1.2rem;margin:8px 0">'+n1+' ❤️ '+n2+'</div>';
html+='<div class="compat-score">'+score+'分</div>';
html+='<div style="text-align:center;color:var(--text2);margin:8px 0">'+advice+'</div>';
html+='<div style="margin-top:16px">';
details.forEach(function(d){
var color=d.score>=85?'var(--green)':d.score>=70?'var(--blue)':'var(--red)';
html+='<div style="display:flex;align-items:center;margin:8px 0;font-size:.85rem">';
html+='<span style="width:60px;color:var(--text2)">'+d.name+'</span>';
html+='<div style="flex:1;height:6px;background:var(--border);border-radius:3px;margin:0 12px;overflow:hidden">';
html+='<div style="height:100%;width:'+d.score+'%;background:'+color+';border-radius:3px"></div></div>';
html+='<span style="width:36px;text-align:right;color:'+color+'">'+d.score+'</span></div>';
});
html+='</div>';
r.innerHTML=html;
}

function toggleTheme(){
var t=document.documentElement;
t.setAttribute('data-theme',t.getAttribute('data-theme')==='light'?'dark':'light');
}

document.getElementById('baziDate').value=new Date().toISOString().split('T')[0];
document.getElementById('zwDate').value=new Date().toISOString().split('T')[0];
calcBazi();
</script>
</body>
</html>
