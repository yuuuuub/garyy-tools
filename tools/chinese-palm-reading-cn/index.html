<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手相算命 | Chinese Palm Reading</title>
<meta name="description" content="手相算命：生命线、智慧线、感情线、事业线、婚姻线详解。手型分析、五行手掌、综合解读。">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✋</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a843;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.8rem;color:var(--gold)}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
.tab{padding:8px 18px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.85rem;transition:.2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.input-group input,.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}
.btn:hover{opacity:.85}
.result-area{margin-top:16px;display:none}
.result-area.show{display:block}
.hand-canvas{width:300px;height:420px;margin:0 auto;position:relative;border:2px solid var(--gold);border-radius:20px;background:linear-gradient(135deg,#2a1a0a,#1a0a00)}
.hand-canvas svg{width:100%;height:100%}
.hand-canvas svg path{cursor:pointer;transition:opacity .2s}
.hand-canvas svg path:hover{opacity:.8}
.hand-canvas svg text{fill:var(--gold);font-size:10px;pointer-events:none}
.line-info{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin:8px 0}
.line-info .li-name{color:var(--gold);font-weight:600;font-size:1rem}
.line-info .li-desc{color:var(--text2);font-size:.85rem;margin-top:4px;line-height:1.6}
.hand-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:12px 0}
.hand-type{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;cursor:pointer;transition:.2s}
.hand-type:hover{border-color:var(--gold)}
.hand-type.selected{border-color:var(--blue);background:rgba(59,130,246,.08)}
.hand-type .ht-icon{font-size:1.8rem;margin-bottom:4px}
.hand-type .ht-name{color:var(--gold);font-weight:600}
.hand-type .ht-el{color:var(--text2);font-size:.8rem}
.line-options{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.line-opt{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text2);cursor:pointer;font-size:.8rem;transition:.2s}
.line-opt:hover{border-color:var(--blue)}
.line-opt.active{border-color:var(--blue);color:var(--blue);background:rgba(59,130,246,.08)}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78rem;margin:2px}
.tag.good{background:rgba(35,134,54,.15);color:var(--green);border:1px solid rgba(35,134,54,.3)}
.tag.neutral{background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.25)}
#themeBtn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer;font-size:.8rem}
</style>
</head>
<body>
<button id="themeBtn" onclick="toggleTheme()">🌓 主题</button>
<div class="container">
<h1>✋ 手相算命</h1>
<p class="sub">掌纹解析 · 手型分析 · 五行手掌 · 综合解读</p>
<div class="tabs">
<button class="tab active" onclick="switchTab('interactive')">🖐️ 互动手相</button>
<button class="tab" onclick="switchTab('reading')">📝 综合手相</button>
<button class="tab" onclick="switchTab('handtype')">🤚 手型分析</button>
</div>
<div class="card" id="interactivePanel">
<p style="text-align:center;color:var(--text2);margin-bottom:12px">点击手掌上的线条查看详情</p>
<div class="hand-canvas">
<svg viewBox="0 0 300 420">
<defs><linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d4a574"/><stop offset="100%" stop-color="#c49060"/></linearGradient></defs>
<path d="M150,380 C100,380 60,340 50,300 C40,260 35,220 40,180 C45,140 55,100 70,70 L80,50 C85,42 95,38 100,45 L105,60 C110,50 120,35 125,30 C130,25 140,28 142,38 L140,55 C145,40 155,25 160,22 C165,19 175,22 175,32 L170,55 C175,40 185,30 190,28 C195,26 205,30 205,40 L195,60 C210,50 225,55 230,65 C235,75 225,90 215,95 L210,98 C220,110 228,130 232,150 C236,170 240,200 238,230 C236,260 228,290 215,310 C202,330 180,360 150,380Z" fill="url(#skinGrad)" stroke="#8B6914" stroke-width="1.5" opacity=".9"/>
<path id="lifeLine" d="M185,310 C175,280 170,250 168,220 C166,190 165,160 170,130 C175,100 185,80 195,65" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linecap="round" onclick="showLine('life')" style="cursor:pointer"/>
<text x="198" y="190" font-size="9" fill="#c0392b">生命线</text>
<path id="headLine" d="M90,195 C120,190 150,188 180,190 C210,192 240,198 260,210" stroke="#2980b9" stroke-width="2.5" fill="none" stroke-linecap="round" onclick="showLine('head')" style="cursor:pointer"/>
<text x="120" y="182" font-size="9" fill="#2980b9">智慧线</text>
<path id="heartLine" d="M80,155 C110,148 140,145 170,148 C200,151 230,158 255,170" stroke="#e74c3c" stroke-width="2.5" fill="none" stroke-linecap="round" onclick="showLine('heart')" style="cursor:pointer"/>
<text x="115" y="140" font-size="9" fill="#e74c3c">感情线</text>
<path id="fateLine" d="M155,370 C153,340 152,310 155,280 C158,250 160,220 158,190 C156,160 152,130 148,100" stroke="#27ae60" stroke-width="2" fill="none" stroke-linecap="round" onclick="showLine('fate')" style="cursor:pointer"/>
<text x="162" y="310" font-size="9" fill="#27ae60">事业线</text>
<path id="marriageLine" d="M232,135 C240,133 248,132 258,133" stroke="#8e44ad" stroke-width="2" fill="none" stroke-linecap="round" onclick="showLine('marriage')" style="cursor:pointer"/>
<text x="232" y="125" font-size="8" fill="#8e44ad">婚姻线</text>
</svg>
</div>
<div id="lineDetail" style="margin-top:16px"></div>
</div>
<div class="card" id="readingPanel" style="display:none">
<div class="input-group"><label>出生日期</label><input type="date" id="palmBirthDate"></div>
<div class="input-group"><label>选择手掌</label><select id="palmHand"><option value="left">左手</option><option value="right">右手</option></select></div>
<div style="margin-bottom:12px"><label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">生命线特征</label>
<div class="line-options" id="lifeOpts"></div></div>
<div style="margin-bottom:12px"><label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">智慧线特征</label>
<div class="line-options" id="headOpts"></div></div>
<div style="margin-bottom:12px"><label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">感情线特征</label>
<div class="line-options" id="heartOpts"></div></div>
<button class="btn" onclick="genReading()">生成手相解读</button>
<div class="result-area" id="readingResult"></div>
</div>
<div class="card" id="handtypePanel" style="display:none">
<p style="color:var(--text2);margin-bottom:12px">选择最接近你手型的类型</p>
<div class="hand-types" id="handTypes"></div>
<div class="result-area" id="handtypeResult"></div>
</div>
</div>
<script src="../i18n.js" defer></script>
<script>
var lineData={
life:{name:'生命线',color:'#c0392b',
desc:'生命线从大拇指与食指之间出发，向手腕方向延伸。生命线不代表寿命长短，而是代表生命力强弱、健康状况和生活品质。',
traits:{
'深长清晰':'生命力旺盛，身体健康，精力充沛，抗病能力强',
'浅淡细弱':'体质偏弱，需注意养生保健，容易疲劳',
'断裂有缺':'中年可能有健康波动，需定期体检',
'弧度大':'性格开朗乐观，生活积极，人缘好',
'弧度小':'性格谨慎内敛，做事保守稳健',
'有分支向上':'事业有成，生活满意度高',
'末端分叉':'晚年需注意健康保养'
}},
head:{name:'智慧线',color:'#2980b9',
desc:'智慧线从拇指与食指之间横过手掌，代表思维能力、智慧水平、判断力和创造力。',
traits:{
'长而清晰':'思维缜密，善于分析，学习能力强',
'短而粗':'行动力强，喜欢实践，不太注重理论',
'弯曲向下':'想象力丰富，有艺术天赋，感性思维',
'平直延伸':'逻辑思维强，善于理性分析',
'分叉':'多才多艺，兴趣广泛，可兼顾多领域',
'末端上扬':'有远大理想，追求精神层面',
'有岛纹':'需注意集中注意力，避免分心'
}},
heart:{name:'感情线',color:'#e74c3c',
desc:'感情线从小指下方横向延伸，代表情感态度、恋爱方式、人际交往能力和感情运势。',
traits:{
'长而上弯':'感情丰富，重视爱情，善解人意',
'短而平直':'理性克制，感情表达含蓄',
'深而清晰':'感情专一，对待感情认真负责',
'浅淡模糊':'感情不善表达，容易错过机会',
'末端分叉':'感情中可能有选择困难',
'有岛纹':'感情路上有波折，但终会圆满',
'中断':'感情可能经历分离或转变'
}},
fate:{name:'事业线',color:'#27ae60',
desc:'事业线从手掌底部向上延伸，代表事业发展、社会地位和人生方向。并非所有人都有明显事业线。',
traits:{
'深长直达':'事业稳定发展，有明确目标',
'从生命线出发':'靠自身努力奋斗成功',
'从感情线出发':'中年后事业有大发展',
'断断续续':'职业可能有多次转变',
'多条并行':'有多种事业发展方向',
'没有事业线':'自由职业倾向，不受固定工作约束'
}},
marriage:{name:'婚姻线',color:'#8e44ad',
desc:'婚姻线位于小指下方，手掌侧面。代表婚姻状况、感情归宿和家庭生活。',
traits:{
'一条清晰':'婚姻稳定，感情专一',
'多条平行':'感情经历丰富，但最终会选定一人',
'上弯':'婚姻幸福美满',
'下弯':'需注意婚姻中的沟通问题',
'交叉':'感情可能有波折',
'短而深':'重视家庭，婚姻观念传统'
}}
};

var lineSelections={};
var handTypes=[
{name:'方形手',icon:'🖐️',element:'金',desc:'手指短而方，手掌方正',personality:'务实可靠，做事有条理，注重规则和秩序，适合管理和财务工作',career:'管理、财务、法律'},
{name:'尖型手',icon:'🤲',element:'火',desc:'手指尖细修长，手掌狭长',personality:'浪漫多情，富有艺术感，直觉敏锐，追求美感和精神生活',career:'艺术、设计、文学'},
{name:'铲型手',icon:'👋',element:'木',desc:'指尖宽大如铲，手掌宽阔',personality:'精力充沛，行动力强，勇于冒险，有领导才能',career:'创业、运动、工程'},
{name:'圆型手',icon:'✊',element:'水',desc:'手指圆润，手掌柔软',personality:'温和善良，善解人意，感性细腻，注重人际关系',career:'服务、教育、医疗'},
{name:'哲学手',icon:'🤚',element:'土',desc:'手指关节突出，手掌厚实',personality:'深思熟虑，善于分析，求知欲强，有研究精神',career:'学术、科研、技术'}
];

var selectedHandType=-1;

function init(){
renderLineOptions();
renderHandTypes();
document.getElementById('palmBirthDate').value=new Date().toISOString().split('T')[0];
}

function switchTab(tab){
document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
event.target.classList.add('active');
['interactivePanel','readingPanel','handtypePanel'].forEach(function(id){document.getElementById(id).style.display='none'});
var map={interactive:'interactivePanel',reading:'readingPanel',handtype:'handtypePanel'};
document.getElementById(map[tab]).style.display='block';
}

function showLine(line){
var d=lineData[line];
var detail=document.getElementById('lineDetail');
var html='<div class="line-info"><div class="li-name" style="color:'+d.color+'">'+d.name+'</div><div class="li-desc">'+d.desc+'</div></div>';
html+='<div style="margin-top:8px">';
Object.keys(d.traits).forEach(function(k){
html+='<div class="line-info"><div class="li-name" style="font-size:.9rem;color:var(--text)">'+k+'</div><div class="li-desc">'+d.traits[k]+'</div></div>';
});
html+='</div>';
detail.innerHTML=html;
}

function renderLineOptions(){
var lifeOpts=['深长清晰','浅淡细弱','断裂有缺','弧度大','弧度小','有分支向上','末端分叉'];
var headOpts=['长而清晰','短而粗','弯曲向下','平直延伸','分叉','末端上扬','有岛纹'];
var heartOpts=['长而上弯','短而平直','深而清晰','浅淡模糊','末端分叉','有岛纹','中断'];
function renderOpts(arr,containerId,key){
var c=document.getElementById(containerId);
c.innerHTML='';
arr.forEach(function(opt){
var btn=document.createElement('div');
btn.className='line-opt';
btn.textContent=opt;
btn.onclick=function(){
c.querySelectorAll('.line-opt').forEach(function(b){b.classList.remove('active')});
btn.classList.add('active');
lineSelections[key]=opt;
};
c.appendChild(btn);
});
}
renderOpts(lifeOpts,'lifeOpts','life');
renderOpts(headOpts,'headOpts','head');
renderOpts(heartOpts,'heartOpts','heart');
}

function genReading(){
var birth=document.getElementById('palmBirthDate').value;
var hand=document.getElementById('palmHand').value;
if(!birth){alert('请选择出生日期');return}
var r=document.getElementById('readingResult');
r.className='result-area show';
var html='<div style="text-align:center;margin-bottom:12px"><span style="color:var(--gold);font-size:1.1rem">'+(hand==='left'?'左手':'右手')+'手相解读</span></div>';
Object.keys(lineSelections).forEach(function(key){
var d=lineData[key];
var sel=lineSelections[key];
if(!sel)return;
html+='<div class="line-info"><div class="li-name" style="color:'+d.color+'">'+d.name+' — '+sel+'</div>';
html+='<div class="li-desc">'+d.traits[sel]+'</div></div>';
});
var age=new Date().getFullYear()-new Date(birth).getFullYear();
html+='<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">';
html+='<strong>🔮 综合解读：</strong>';
if(!lineSelections.life&&!lineSelections.head&&!lineSelections.lineSelections){
html+='请选择掌纹特征后生成详细解读。';
}else{
var advice=[];
if(lineSelections.life==='深长清晰')advice.push('健康运势佳');
if(lineSelections.life==='断裂有缺')advice.push('注意健康管理');
if(lineSelections.head==='长而清晰')advice.push('智慧出众');
if(lineSelections.head==='分叉')advice.push('多才多艺');
if(lineSelections.heart==='长而上弯')advice.push('感情丰富');
if(lineSelections.heart==='中断')advice.push('感情需经营');
if(advice.length>0)html+=advice.join('，')+'。';
else html+='掌纹特征综合分析完成，建议保持积极心态。';
}
html+='</div>';
r.innerHTML=html;
}

function renderHandTypes(){
var c=document.getElementById('handTypes');
c.innerHTML='';
handTypes.forEach(function(h,i){
var div=document.createElement('div');
div.className='hand-type';
div.innerHTML='<div class="ht-icon">'+h.icon+'</div><div class="ht-name">'+h.name+'</div><div class="ht-el">'+h.element+'</div>';
div.onclick=function(){
c.querySelectorAll('.hand-type').forEach(function(d){d.classList.remove('selected')});
div.classList.add('selected');
selectedHandType=i;
showHandTypeDetail(h);
};
c.appendChild(div);
});
}

function showHandTypeDetail(h){
var r=document.getElementById('handtypeResult');
r.className='result-area show';
var html='<div style="text-align:center;margin-bottom:12px"><span style="font-size:1.5rem">'+h.icon+'</span> <span style="color:var(--gold);font-size:1.2rem">'+h.name+'</span></div>';
html+='<div style="text-align:center;margin-bottom:12px"><span class="tag neutral">'+h.element+'型手</span></div>';
html+='<div style="padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">';
html+='<div><strong>手型特征：</strong>'+h.desc+'</div>';
html+='<div style="margin-top:6px"><strong>性格特点：</strong>'+h.personality+'</div>';
html+='<div style="margin-top:6px"><strong>适合职业：</strong>'+h.career+'</div></div>';
r.innerHTML=html;
}

function toggleTheme(){
var t=document.documentElement;
t.setAttribute('data-theme',t.getAttribute('data-theme')==='light'?'dark':'light');
}

init();
</script>
</body>
</html>
