<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中餐营养分析 - Chinese Recipe Nutrition</title>
<meta name="description" content="中餐营养成分分析工具，查看经典中式菜肴的热量、蛋白质、脂肪等营养信息">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中餐营养分析 - Chinese Recipe Nutrition">
<meta property="og:description" content="查看经典中式菜肴的热量、蛋白质、脂肪等营养信息">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-recipe-nutrition-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥗</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
header{background:linear-gradient(135deg,#1a0a00,#2a1505,#3d200a);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3010;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1200px;margin:0 auto;padding:20px}
.search-box{margin-bottom:16px}
.search-box input{width:100%;padding:12px 16px;border-radius:10px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none}
.search-box input:focus{border-color:var(--accent)}
.filter-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.filter-btn{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.82em;transition:all .2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.recipe-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:14px;margin-bottom:20px}
.recipe-card{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--border);transition:all .3s;cursor:pointer}
.recipe-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.recipe-card .r-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.recipe-card .r-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4em;background:rgba(232,168,124,.15);flex-shrink:0}
.recipe-card .r-name{font-size:1.1em;font-weight:bold}
.recipe-card .r-sub{font-size:.78em;color:var(--text2)}
.recipe-card .nutrition-bars{margin-top:10px}
.nutrition-bar{margin-bottom:6px}
.nutrition-bar .bar-label{display:flex;justify-content:space-between;font-size:.75em;color:var(--text2);margin-bottom:2px}
.nutrition-bar .bar-track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.nutrition-bar .bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
.detail-panel{background:var(--card);border-radius:14px;padding:24px;border:1px solid var(--border);margin-top:20px;display:none}
.detail-panel.show{display:block;animation:fadeIn .3s ease-out}
.detail-panel h2{font-size:1.4em;margin-bottom:12px}
.nutrition-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.nutrition-item{background:var(--bg);border-radius:10px;padding:14px;border:1px solid var(--border);text-align:center}
.nutrition-item .value{font-size:1.6em;font-weight:bold;color:var(--accent)}
.nutrition-item .unit{font-size:.72em;color:var(--text2)}
.nutrition-item .label{font-size:.78em;color:var(--text2);margin-top:4px}
.health-tips{background:rgba(232,168,124,.1);border:1px solid var(--accent);border-radius:10px;padding:14px;margin-top:12px}
.health-tips strong{color:var(--accent)}
.health-tips p{font-size:.85em;color:var(--text2);line-height:1.7;margin-top:6px}
footer{text-align:center;padding:30px;color:var(--text2);font-size:.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.recipe-list{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🥗 中餐营养分析</h1>
<p>Chinese Recipe Nutrition — 查看经典中式菜肴的营养成分</p>
</header>
<div class="container">
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索菜名..."></div>
<div class="filter-btns" id="filterBtns">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="低卡">低卡 (&lt;300kcal)</button>
<button class="filter-btn" data-filter="高蛋白">高蛋白 (&gt;20g)</button>
<button class="filter-btn" data-filter="素食">素食</button>
<button class="filter-btn" data-filter="快手菜">快手菜 (&lt;20min)</button>
</div>
<div class="recipe-list" id="recipeList"></div>
<div class="detail-panel" id="detailPanel"></div>
<footer><p>🥗 中餐营养分析 — 吃出健康，吃出美味</p></footer>
</div>
<script>
const RECIPES=[
{name:"清蒸鲈鱼",en:"Steamed Sea Bass",icon:"🐟",cuisine:"粤菜",calories:185,protein:32,fat:5,carbs:2,fiber:0,sodium:480,vitamins:["B12","D","硒"],healthTips:"高蛋白低脂肪，富含Omega-3脂肪酸，适合减脂期食用。蒸制方式保留最多营养。"},
{name:"白灼虾",en:"Boiled Shrimp",icon:"🦐",cuisine:"粤菜",calories:99,protein:24,fat:0.3,carbs:0.2,fiber:0,sodium:350,vitamins:["B12","硒","锌"],healthTips:"极低脂肪高蛋白，几乎零碳水。焯水方式最大程度保留营养。"},
{name:"清炒时蔬",en:"Stir-fried Vegetables",icon:"🥬",cuisine:"粤菜",calories:85,protein:3,fat:5,carbs:8,fiber:4,sodium:320,vitamins:["C","K","叶酸"],healthTips:"低热量高纤维，维生素丰富。快炒保留蔬菜脆嫩和营养。"},
{name:"蒸蛋",en:"Steamed Egg",icon:"🥚",cuisine:"粤菜",calories:120,protein:10,fat:8,carbs:2,fiber:0,sodium:380,vitamins:["A","D","B12"],healthTips:"优质蛋白质来源，口感嫩滑易消化。适合老人和儿童。"},
{name:"白切鸡",en:"White Cut Chicken",icon:"🍗",cuisine:"粤菜",calories:210,protein:28,fat:10,carbs:0,fiber:0,sodium:420,vitamins:["B6","B12","硒"],healthTips:"高蛋白低脂，白煮方式少油健康。去皮后脂肪更低。"},
{name:"水煮鱼",en:"Boiled Fish in Chili",icon:"🐟",cuisine:"川菜",calories:350,protein:28,fat:22,carbs:8,fiber:2,sodium:890,vitamins:["B12","D"],healthTips:"蛋白质丰富但油脂和钠含量较高。建议少油少盐版。"},
{name:"麻婆豆腐",en:"Mapo Tofu",icon:"豆腐",cuisine:"川菜",calories:180,protein:12,fat:12,carbs:6,fiber:1,sodium:720,vitamins:["钙","铁"],healthTips:"植物蛋白与动物蛋白结合。豆腐富含钙质。注意含油量。"},
{name:"宫保鸡丁",en:"Kung Pao Chicken",icon:"🌶️",cuisine:"川菜",calories:265,protein:22,fat:16,carbs:8,fiber:1,sodium:680,vitamins:["B6","硒"],healthTips:"蛋白质含量适中。花生提供不饱和脂肪酸。注意盐分。"},
{name:"红烧肉",en:"Braised Pork Belly",icon:"🍖",cuisine:"苏菜",calories:480,protein:18,fat:38,carbs:12,fiber:0,sodium:650,vitamins:["B1","B12"],healthTips:"高脂肪高热量，适量食用。搭配蔬菜可平衡营养。"},
{name:"东坡肉",en:"Dongpo Pork",icon:"🍖",cuisine:"浙菜",calories:460,protein:16,fat:36,carbs:14,fiber:0,sodium:620,vitamins:["B1"],healthTips:"经典高脂菜肴。建议搭配清淡蔬菜平衡一餐营养。"},
{name:"糖醋排骨",en:"Sweet and Sour Ribs",icon:"🍖",cuisine:"苏菜",calories:380,protein:20,fat:22,carbs:24,fiber:0,sodium:520,vitamins:["B12","钙"],healthTips:"含糖量较高。建议控制食用量，搭配蔬菜。"},
{name:"回锅肉",en:"Twice-Cooked Pork",icon:"🍖",cuisine:"川菜",calories:340,protein:18,fat:26,carbs:8,fiber:1,sodium:680,vitamins:["B1","硒"],healthTips:"五花肉脂肪含量高。蒜苗提供膳食纤维和维生素。"},
{name:"龙井虾仁",en:"Longjing Shrimp",icon:"🦐",cuisine:"浙菜",calories:145,protein:22,fat:5,carbs:2,fiber:0,sodium:350,vitamins:["B12","硒","茶多酚"],healthTips:"低脂高蛋白，茶叶含茶多酚有抗氧化作用。非常健康的选择。"},
{name:"叫化鸡",en:"Beggar's Chicken",icon:"🍗",cuisine:"浙菜",calories:280,protein:30,fat:16,carbs:2,fiber:0,sodium:480,vitamins:["B6","B12"],healthTips:"荷叶包裹烤制，油脂自然滴落，比油炸更健康。"},
{name:"剁椒鱼头",en:"Chopped Chili Fish Head",icon:"🐟",cuisine:"湘菜",calories:220,protein:26,fat:12,carbs:4,fiber:1,sodium:750,vitamins:["B12","D","Omega-3"],healthTips:"鱼头富含DHA和EPA。剁椒含辣椒素可促进代谢。注意钠含量。"},
{name:"腊味合蒸",en:"Steamed Cured Meats",icon:"🍲",cuisine:"湘菜",calories:390,protein:24,fat:28,carbs:6,fiber:0,sodium:980,vitamins:["B1","B12"],healthTips:"腌制食品钠含量极高。偶尔食用，搭配新鲜蔬菜。"},
{name:"佛跳墙",en:"Buddha Jumps Over the Wall",icon:"🍲",cuisine:"闽菜",calories:320,protein:35,fat:18,carbs:4,fiber:0,sodium:680,vitamins:["B12","胶原蛋白","硒"],healthTips:"多种海产品富含微量元素。胶原蛋白丰富。高嘌呤，痛风者慎食。"},
{name:"臭鳜鱼",en:"Stinky Mandarin Fish",icon:"🐟",cuisine:"徽菜",calories:250,protein:30,fat:14,carbs:2,fiber:0,sodium:620,vitamins:["B12","D","硒"],healthTips:"发酵鱼肉蛋白质更易吸收。注意钠含量偏高。"},
{name:"鱼香肉丝",en:"Yu-Shiang Shredded Pork",icon:"🥩",cuisine:"川菜",calories:230,protein:16,fat:14,carbs:12,fiber:2,sodium:650,vitamins:["B1","C"],healthTips:"含木耳和胡萝卜，增加膳食纤维。注意油盐用量。"},
{name:"盐水鸭",en:"Salted Duck",icon:"🦆",cuisine:"苏菜",calories:260,protein:20,fat:18,carbs:2,fiber:0,sodium:850,vitamins:["B族","铁"],healthTips:"鸭肉性凉，适合夏季。但腌制食品钠含量高，适量食用。"}
];
let currentFilter='all';
function getFiltered(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  return RECIPES.filter(r=>{
    if(q&&!r.name.toLowerCase().includes(q)&&!r.en.toLowerCase().includes(q))return false;
    if(currentFilter==='低卡'&&r.calories>=300)return false;
    if(currentFilter==='高蛋白'&&r.protein<=20)return false;
    if(currentFilter==='素食'&&r.protein>10)return false;
    if(currentFilter==='快手菜')return false;
    return true;
  });
}
function getBarColor(pct){return pct>70?'var(--red)':pct>40?'var(--accent)':'var(--green)'}
function renderList(){
  const data=getFiltered();
  const list=document.getElementById('recipeList');
  if(!data.length){list.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)">未找到匹配的菜谱</div>';return}
  list.innerHTML=data.map((r,i)=>{
    const maxCal=500;
    return`<div class="recipe-card" onclick="showDetail(${RECIPES.indexOf(r)})">
      <div class="r-head"><div class="r-icon">${r.icon}</div><div><div class="r-name">${r.name}</div><div class="r-sub">${r.en} · ${r.cuisine}</div></div></div>
      <div class="nutrition-bars">
        <div class="nutrition-bar"><div class="bar-label"><span>热量</span><span>${r.calories} kcal</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(r.calories/maxCal*100,100)}%;background:${getBarColor(r.calories/maxCal*100)}"></div></div></div>
        <div class="nutrition-bar"><div class="bar-label"><span>蛋白质</span><span>${r.protein}g</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(r.protein/40*100,100)}%;background:var(--blue)"></div></div></div>
        <div class="nutrition-bar"><div class="bar-label"><span>脂肪</span><span>${r.fat}g</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(r.fat/40*100,100)}%;background:${r.fat>20?'var(--red)':'var(--accent)'}"></div></div></div>
      </div>
    </div>`}).join('');
}
function showDetail(idx){
  const r=RECIPES[idx];
  const panel=document.getElementById('detailPanel');
  panel.className='detail-panel show';
  panel.innerHTML=`
    <h2>${r.icon} ${r.name} <span style="font-size:.5em;color:var(--text2)">${r.en}</span></h2>
    <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap"><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">${r.cuisine}</span></div>
    <div class="nutrition-grid">
      <div class="nutrition-item"><div class="value">${r.calories}</div><div class="unit">kcal</div><div class="label">热量</div></div>
      <div class="nutrition-item"><div class="value">${r.protein}</div><div class="unit">g</div><div class="label">蛋白质</div></div>
      <div class="nutrition-item"><div class="value">${r.fat}</div><div class="unit">g</div><div class="label">脂肪</div></div>
      <div class="nutrition-item"><div class="value">${r.carbs}</div><div class="unit">g</div><div class="label">碳水</div></div>
      <div class="nutrition-item"><div class="value">${r.fiber}</div><div class="unit">g</div><div class="label">膳食纤维</div></div>
      <div class="nutrition-item"><div class="value">${r.sodium}</div><div class="unit">mg</div><div class="label">钠</div></div>
    </div>
    <div style="margin-bottom:12px"><strong style="font-size:.88em">主要维生素/矿物质：</strong><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${r.vitamins.map(v=>`<span style="font-size:.75em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">${v}</span>`).join('')}</div></div>
    <div class="health-tips"><strong>💡 健康建议</strong><p>${r.healthTips}</p></div>`;
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}
document.getElementById('searchInput').addEventListener('input',renderList);
document.getElementById('filterBtns').addEventListener('click',e=>{
  if(!e.target.classList.contains('filter-btn'))return;
  e.target.parentElement.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter=e.target.dataset.filter;
  renderList();
});
renderList();
</script>
</body>
</html>
