<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👁️ 视唱练耳</title>
<meta property="og:title" content="👁️ 视唱练耳">
<meta property="og:description" content="👁️ 视唱练耳 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线视唱练耳训练工具，练习读谱、唱名和音准">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁️</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tab-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;font-weight:600}
.tab-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.staff{position:relative;height:200px;background:var(--preview-bg);border-radius:12px;padding:20px;margin:12px 0;overflow:hidden}
.staff-line{position:absolute;left:20px;right:20px;height:1px;background:var(--border)}
.note-symbol{position:absolute;font-size:24px;font-weight:700;color:var(--accent);transition:all .3s;transform:translate(-50%,-50%)}
.note-symbol.current{color:var(--red);transform:translate(-50%,-50%) scale(1.3)}
.controls{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.ctrl-btn{padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;font-weight:600}
.ctrl-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.ctrl-btn.primary:hover{background:var(--accent-hover)}
.options-area{margin-top:16px}
.quiz-q{font-size:14px;font-weight:600;margin-bottom:12px}
.options-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt-btn{padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;text-align:center;font-weight:600}
.opt-btn:hover{border-color:var(--accent)}
.opt-btn.correct{background:var(--green);color:#fff;border-color:var(--green)}
.opt-btn.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.score-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);margin-top:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.legend-item{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:4px}
.legend-dot{width:10px;height:10px;border-radius:50%}
.footer{text-align:center;padding:20px 0;font-size:12px;color:var(--text-secondary)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>👁️ 视唱练耳</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">🎯 训练模式</div>
<div class="tab-bar" id="modeTabs"></div>
</div>
<div class="card">
<div class="card-title">🎼 五线谱</div>
<div class="staff" id="staff"></div>
<div class="legend">
<div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>音符</div>
<div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>当前音</div>
</div>
<div class="controls">
<button class="ctrl-btn primary" onclick="playMelody()">▶ 播放旋律</button>
<button class="ctrl-btn" onclick="generateNew()">🔄 换一题</button>
</div>
</div>
<div class="card">
<div class="card-title">❓ 听音答题</div>
<div class="options-area" id="optionsArea">
<div class="quiz-q" id="quizQ">点击播放后，选择正确的旋律</div>
<div class="options-grid" id="optsGrid"></div>
</div>
<div class="score-row">
<span>得分: <b id="score">0</b>/<b id="total">0</b></span>
<span id="feedback"></span>
</div>
</div>
<div class="footer">视唱练耳 - Web Audio API | 建议使用耳机</div>
</div>
<script>
let audioCtx,currentMode=0,score=0,total=0;
let currentMelody=[],currentIdx=0;
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SOLFEGE=['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const MODES=[
{name:'🎵 旋律听辨',desc:'听旋律后选择正确的唱名序列'},
{name:'📝 读谱训练',desc:'看五线谱，点击音符听对应音高'},
{name:'🎼 音程听辨',desc:'听两个音的音程关系'}
];
const MELODIES=[
[0,2,4,5,7,5,4,2,0],
[0,4,7,12,7,4,0],
[0,2,4,7,4,2,0],
[0,3,5,7,5,3,0],
[0,2,4,5,7,9,11,12],
[12,11,9,7,5,4,2,0],
[0,4,7,11,7,4,0],
[0,2,3,5,7,10,7,5,3,2,0]
];
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playFreq(freq,delay=0,dur=0.5){initAudio();const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;g.gain.setValueAtTime(0.3,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+delay+dur);osc.connect(g);g.connect(audioCtx.destination);osc.start(audioCtx.currentTime+delay);osc.stop(audioCtx.currentTime+delay+dur)}
function buildModeTabs(){document.getElementById('modeTabs').innerHTML=MODES.map((m,i)=>`<button class="tab-btn${i===currentMode?' active':''}" onclick="selectMode(${i})">${m.name}</button>`).join('')}
function selectMode(i){currentMode=i;buildModeTabs();generateNew()}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generateNew(){currentMelody=MELODIES[Math.floor(Math.random()*MELODIES.length)].map(n=>n+60);renderStaff();if(currentMode===0)generateQuiz();else if(currentMode===1)renderInteractiveStaff()}
function renderStaff(){const el=document.getElementById('staff');const staffTop=20;const lineSpacing=16;let html='';for(let i=0;i<5;i++){const y=staffTop+i*lineSpacing;html+=`<div class="staff-line" style="top:${y}px"></div>`}
const clefY=staffTop+2*lineSpacing;html+=`<div style="position:absolute;left:25px;top:${clefY-15}px;font-size:32px;color:var(--accent)">𝄞</div>`;
currentMelody.forEach((note,i)=>{const noteIdx=note%12;const octave=Math.floor(note/12)-1;const scalePos=[0,0,1,1,2,3,3,4,4,5,5,6][noteIdx];const linePos=6-scalePos;const x=80+i*50;const y=staffTop+linePos*lineSpacing/2;html+=`<div class="note-symbol" id="note${i}" style="left:${x}px;top:${y}px">${SOLFEGE[noteIdx]}</div>`});el.innerHTML=html}
function renderInteractiveStaff(){const el=document.getElementById('staff');const staffTop=20;const lineSpacing=16;let html='';for(let i=0;i<5;i++){const y=staffTop+i*lineSpacing;html+=`<div class="staff-line" style="top:${y}px"></div>`}
html+=`<div style="position:absolute;left:25px;top:${staffTop+2*lineSpacing-15}px;font-size:32px;color:var(--accent)">𝄞</div>`;
currentMelody.forEach((note,i)=>{const noteIdx=note%12;const scalePos=[0,0,1,1,2,3,3,4,4,5,5,6][noteIdx];const linePos=6-scalePos;const x=80+i*50;const y=staffTop+linePos*lineSpacing/2;html+=`<div class="note-symbol" style="left:${x}px;top:${y}px;cursor:pointer" onclick="playNoteAt(${i},${note})" title="点击试听">${SOLFEGE[noteIdx]}</div>`});el.innerHTML=html}
function playNoteAt(i,note){playFreq(440*Math.pow(2,(note-69)/12),0,0.5);document.querySelectorAll('.note-symbol').forEach(n=>n.classList.remove('current'));const el=document.getElementById('note'+i);if(el)el.classList.add('current');setTimeout(()=>{if(el)el.classList.remove('current')},500)}
async function playMelody(){for(let i=0;i<currentMelody.length;i++){playNoteAt(i,currentMelody[i]);await new Promise(r=>setTimeout(r,500))}}
function generateQuiz(){const correct=shuffle([...currentMelody]);const opts=[currentMelody,correct,shuffle([...currentMelody]).map((n,i)=>(n+2)%12+Math.floor(n/12)*12),shuffle([...currentMelody]).map((n,i)=>(n-2+12)%12+Math.floor(n/12)*12)];const shuffled=shuffle(opts);document.getElementById('quizQ').textContent='这段旋律的唱名是？';document.getElementById('optsGrid').innerHTML=shuffled.map((o,i)=>{const seq=o.map(n=>SOLFEGE[n%12]).join(' ');return`<button class="opt-btn" onclick="checkAnswer(this,${i},${JSON.stringify(seq)===JSON.stringify(currentMelody.map(n=>SOLFEGE[n%12]).join(' '))})" style="grid-column:span 4;text-align:left;font-size:11px">${seq}</button>`}).join('')}
function checkAnswer(btn,idx,correct){total++;if(correct){score++;btn.classList.add('correct');document.getElementById('feedback').textContent='✅ 正确!';document.getElementById('feedback').style.color='var(--green)'}else{btn.classList.add('wrong');document.getElementById('feedback').textContent='❌ 再试试!';document.getElementById('feedback').style.color='var(--red)'}document.querySelectorAll('.opt-btn').forEach(b=>b.style.pointerEvents='none');setTimeout(()=>{document.getElementById('feedback').textContent='';generateNew()},1500);document.getElementById('score').textContent=score;document.getElementById('total').textContent=total}
buildModeTabs();generateNew();
</script>
</body>
</html>
