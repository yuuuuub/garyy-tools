<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Mock生成器</title>
<meta name="description" content="在线生成Mock API接口定义，支持RESTful和自定义响应">
<script defer src="../i18n.js"></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth;padding:16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button,textarea{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:80px;font-family:'SF Mono',Menlo,monospace;font-size:.82rem}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s;display:inline-block;text-align:center}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:4px 12px;font-size:.8rem}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.method-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:700;color:#fff}
.method-GET{background:var(--green)}
.method-POST{background:var(--blue)}
.method-PUT{background:var(--gold);color:#000}
.method-DELETE{background:var(--red)}
.api-list{list-style:none}
.api-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.api-item .api-path{flex:1;font-family:monospace;font-size:.85rem}
.api-item .api-desc{font-size:.8rem;color:var(--text2)}
.api-item button{flex-shrink:0}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:var(--radius);cursor:pointer;font-size:.82rem;background:var(--card);border:1px solid var(--border);color:var(--text2);transition:all .2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.preview-box{background:#1a1a2e;color:#e6e6e6;padding:16px;border-radius:var(--radius);border:1px solid var(--border);font-family:'SF Mono',Menlo,monospace;font-size:.8rem;line-height:1.6;white-space:pre-wrap;word-break:break-all;overflow-x:auto}
.output-area{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px;display:none}
.json-key{color:var(--blue)}
.json-str{color:var(--green)}
.json-num{color:var(--gold)}
.json-bool{color:var(--red)}
@media(max-width:640px){.form-row{flex-direction:column}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔌</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="API Mock生成器">
<meta property="og:description" content="在线生成Mock API接口定义">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🔌 API Mock生成器</h1>
    <p>快速创建Mock API接口定义</p>
  </header>

  <div class="card">
    <div class="section-title">API配置</div>
    <div class="form-row">
      <div class="group"><label>API基础路径</label><input type="text" id="baseUrl" value="/api/v1"></div>
      <div class="group"><label>响应延迟(ms)</label><input type="number" id="delay" value="200"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">接口列表</div>
    <ul class="api-list" id="apiList"></ul>
    <div class="card" style="margin-top:12px;background:var(--bg)">
      <div class="section-title">添加接口</div>
      <div class="form-row">
        <div class="group" style="flex:0 0 120px">
          <select id="newMethod">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
          </select>
        </div>
        <div class="group"><input type="text" id="newPath" placeholder="/users"></div>
      </div>
      <div class="form-row">
        <div class="group"><label>描述</label><input type="text" id="newDesc" placeholder="获取用户列表"></div>
      </div>
      <div class="form-row">
        <div class="group"><label>响应JSON</label>
          <textarea id="newResponse" rows="4" placeholder='{"code":0,"data":[]}'>{"code":0,"data":[{"id":1,"name":"张三","email":"zhangsan@example.com"}],"total":1}</textarea>
        </div>
      </div>
      <div class="form-row">
        <div class="group"><label>状态码</label>
          <select id="newStatus">
            <option value="200">200 OK</option>
            <option value="201">201 Created</option>
            <option value="400">400 Bad Request</option>
            <option value="401">401 Unauthorized</option>
            <option value="404">404 Not Found</option>
            <option value="500">500 Internal Server Error</option>
          </select>
        </div>
      </div>
      <button class="btn btn-sm" onclick="addApi()">添加接口</button>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" onclick="generate()">生成配置</button>
    <button class="btn btn-green" onclick="copyMock()">复制</button>
    <button class="btn btn-outline" onclick="downloadMock()">下载</button>
  </div>

  <div class="output-area" id="outputArea">
    <div class="tabs" style="margin-bottom:8px">
      <div class="tab active" onclick="showTab('json')">JSON配置</div>
      <div class="tab" onclick="showTab('js')">JS Mock</div>
      <div class="tab" onclick="showTab('express')">Express路由</div>
    </div>
    <div class="preview-box" id="preview"></div>
  </div>
</div>

<script>
var apis = [
  {method:'GET', path:'/users', desc:'获取用户列表', status:'200', response:'{"code":0,"data":[{"id":1,"name":"张三","email":"zhangsan@example.com"},{"id":2,"name":"李四","email":"lisi@example.com"}],"total":2}'},
  {method:'GET', path:'/users/:id', desc:'获取单个用户', status:'200', response:'{"code":0,"data":{"id":1,"name":"张三","email":"zhangsan@example.com","phone":"13800138000"}}'},
  {method:'POST', path:'/users', desc:'创建用户', status:'201', response:'{"code":0,"data":{"id":3,"name":"新用户"},"message":"创建成功"}'},
  {method:'PUT', path:'/users/:id', desc:'更新用户', status:'200', response:'{"code":0,"message":"更新成功"}'},
  {method:'DELETE', path:'/users/:id', desc:'删除用户', status:'200', response:'{"code":0,"message":"删除成功"}'}
];

var currentTab = 'json';

function renderApis() {
  var list = document.getElementById('apiList');
  list.innerHTML = '';
  apis.forEach(function(api, i) {
    var li = document.createElement('li');
    li.className = 'api-item';
    li.innerHTML = '<span class="method-badge method-' + api.method + '">' + api.method + '</span>' +
      '<span class="api-path">' + api.path + '</span>' +
      '<span class="api-desc">' + api.desc + '</span>' +
      '<span style="font-size:.7rem;color:var(--text2)">' + api.status + '</span>' +
      '<button class="btn-outline btn-sm" style="padding:2px 8px;font-size:.7rem;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:4px;cursor:pointer" onclick="removeApi(' + i + ')">×</button>';
    list.appendChild(li);
  });
}

function addApi() {
  var method = document.getElementById('newMethod').value;
  var path = document.getElementById('newPath').value.trim();
  var desc = document.getElementById('newDesc').value.trim();
  var response = document.getElementById('newResponse').value.trim();
  var status = document.getElementById('newStatus').value;
  if (!path) { alert('请输入接口路径'); return; }
  apis.push({method: method, path: path, desc: desc, status: status, response: response || '{}'});
  document.getElementById('newPath').value = '';
  document.getElementById('newDesc').value = '';
  document.getElementById('newResponse').value = '{"code":0}';
  renderApis();
}

function removeApi(i) {
  apis.splice(i, 1);
  renderApis();
}

function generate() {
  var baseUrl = document.getElementById('baseUrl').value;
  var delay = document.getElementById('delay').value;
  var output = '';

  if (currentTab === 'json') {
    var config = {baseUrl: baseUrl, delay: Number(delay), endpoints: apis.map(function(a) {
      return {method: a.method, path: a.path, description: a.desc, statusCode: Number(a.status), response: JSON.parse(a.response)};
    })};
    output = JSON.stringify(config, null, 2);
  } else if (currentTab === 'js') {
    output = 'const mockData = {\n';
    output += '  baseUrl: "' + baseUrl + '",\n';
    output += '  delay: ' + delay + ',\n';
    output += '  routes: {\n';
    apis.forEach(function(a) {
      output += '    "' + a.method + ' ' + a.path + '": {\n';
      output += '      description: "' + a.desc + '",\n';
      output += '      status: ' + a.status + ',\n';
      output += '      response: ' + a.response + '\n';
      output += '    },\n';
    });
    output += '  }\n};\n\n';
    output += 'function mockFetch(method, path, body) {\n';
    output += '  return new Promise((resolve) => {\n';
    output += '    setTimeout(() => {\n';
    output += '      const key = method + " " + path;\n';
    output += '      const route = mockData.routes[key];\n';
    output += '      if (route) {\n';
    output += '        resolve({ status: route.status, data: route.response });\n';
    output += '      } else {\n';
    output += '        resolve({ status: 404, data: { code: 404, message: "Not Found" } });\n';
    output += '      }\n';
    output += '    }, mockData.delay);\n';
    output += '  });\n';
    output += '}\n';
  } else {
    output = "const express = require('express');\nconst router = express.Router();\n\n";
    apis.forEach(function(a) {
      var routeMethod = a.method.toLowerCase();
      output += 'router.' + routeMethod + '("' + a.path + '", (req, res) => {\n';
      output += '  setTimeout(() => {\n';
      output += '    res.status(' + a.status + ').json(' + a.response + ');\n';
      output += '  }, ' + delay + ');\n';
      output += '});\n\n';
    });
    output += 'module.exports = router;\n';
  }

  document.getElementById('preview').textContent = output;
  document.getElementById('outputArea').style.display = 'block';
  document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
}

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('#outputArea .tab').forEach(function(t) { t.classList.remove('active'); });
  event.target.classList.add('active');
  generate();
}

function copyMock() {
  generate();
  navigator.clipboard.writeText(document.getElementById('preview').textContent).then(function() {
    alert('已复制到剪贴板');
  });
}

function downloadMock() {
  generate();
  var ext = currentTab === 'json' ? '.json' : currentTab === 'js' ? '.js' : '.js';
  var blob = new Blob([document.getElementById('preview').textContent], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mock-api' + ext;
  a.click();
}

renderApis();
</script>
</body>
</html>
