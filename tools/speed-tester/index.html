<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>速度测试</title>
<meta name="description" content="网络速度测试工具，测试下载上传和延迟">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#238636;--red:#da3633;--yellow:#9e6a03;--dim:#8b949e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:20px}
.container{max-width:600px;margin:0 auto;text-align:center}
h1{font-size:1.8rem;margin-bottom:8px}
.subtitle{color:var(--dim);margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;margin-bottom:16px}
.speed-display{font-size:3.5rem;font-weight:700;color:var(--accent);margin:20px 0 4px}
.speed-unit{font-size:1rem;color:var(--dim);margin-bottom:16px}
.gauge{width:200px;height:200px;margin:0 auto 20px;position:relative}
.gauge svg{transform:rotate(-90deg)}
.gauge-bg{fill:none;stroke:var(--border);stroke-width:12}
.gauge-fill{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;stroke-dasharray:565;stroke-dashoffset:565;transition:stroke-dashoffset 1s ease}
.gauge-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;font-weight:700}
button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:12px 32px;font-size:15px;cursor:pointer;font-weight:600;transition:opacity .2s}
button:hover{opacity:.85}
button:disabled{opacity:.5;cursor:not-allowed}
.progress{width:100%;height:6px;background:var(--border);border-radius:3px;margin:16px 0;overflow:hidden;display:none}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;width:0%;transition:width .1s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;margin-top:16px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px}
.stat-label{font-size:12px;color:var(--dim)}
.stat-value{font-size:1.3rem;font-weight:600;margin-top:4px}
.history{margin-top:16px;text-align:left}
.history-item{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px}
.status{color:var(--dim);font-size:13px;margin-top:8px}
@media(max-width:500px){.speed-display{font-size:2.5rem}.stats{grid-template-columns:1fr}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="速度测试">
  <meta property="og:description" content="网络速度测试工具，测试下载上传和延迟">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/speed-tester/">
</head>
<body>
<div class="container">
<h1>🚀 速度测试</h1>
<p class="subtitle">测量当前网络下载速度</p>

<div class="card">
<div class="gauge">
<svg viewBox="0 0 200 200">
<circle class="gauge-bg" cx="100" cy="100" r="90"/>
<circle class="gauge-fill" id="gaugeFill" cx="100" cy="100" r="90"/>
</svg>
<div class="gauge-text" id="gaugeText">0</div>
</div>
<div class="speed-display" id="speedValue">0.00</div>
<div class="speed-unit">Mbps</div>
<button id="startBtn" onclick="startTest()">开始测试</button>
<div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="status" id="status"></div>
</div>

<div class="stats" id="stats" style="display:none">
<div class="stat"><div class="stat-label">下载大小</div><div class="stat-value" id="totalSize">-</div></div>
<div class="stat"><div class="stat-label">耗时</div><div class="stat-value" id="duration">-</div></div>
<div class="stat"><div class="stat-label">峰值速度</div><div class="stat-value" id="peakSpeed">-</div></div>
<div class="stat"><div class="stat-label">平均速度</div><div class="stat-value" id="avgSpeed">-</div></div>
</div>

<div class="card history" id="historyCard" style="display:none">
<h2 style="margin-bottom:12px;font-size:14px">测试历史</h2>
<div id="historyList"></div>
</div>
</div>

<script>
const testSizes=[
{name:'小文件',size:1024*100,url:'https://speed.cloudflare.com/__down?bytes=102400'},
{name:'中文件',size:1024*500,url:'https://speed.cloudflare.com/__down?bytes=512000'},
{name:'大文件',size:1024*1024,url:'https://speed.cloudflare.com/__down?bytes=1048576'},
{name:'超大文件',size:1024*1024*5,url:'https://speed.cloudflare.com/__down?bytes=5242880'}
];
let testing=false;
let history=JSON.parse(localStorage.getItem('speedTestHistory')||'[]');
function renderHistory(){
if(history.length===0){document.getElementById('historyCard').style.display='none';return;}
document.getElementById('historyCard').style.display='block';
let html='';
history.slice(-5).reverse().forEach(h=>{
html+=`<div class="history-item"><span>${h.date}</span><span>${h.size}</span><span style="color:var(--accent);font-weight:600">${h.speed} Mbps</span></div>`;
});
document.getElementById('historyList').innerHTML=html;
}
renderHistory();
async function startTest(){
if(testing)return;
testing=true;
const btn=document.getElementById('startBtn');
btn.disabled=true;
btn.textContent='测试中...';
document.getElementById('progress').style.display='block';
document.getElementById('status').textContent='准备测试...';
let totalBytes=0;
let totalTime=0;
let peakSpeed=0;
let speeds=[];
const startTime=performance.now();
for(let i=0;i<testSizes.length;i++){
const t=testSizes[i];
document.getElementById('status').textContent=`正在测试 ${t.name} (${formatSize(t.size)})...`;
document.getElementById('progressBar').width=((i+1)/testSizes.length*100)+'%';
try{
const chunkStart=performance.now();
const resp=await fetch(t.url+'?'+Date.now(),{cache:'no-store'});
const reader=resp.body.getReader();
let received=0;
while(true){
const{done,value}=await reader.read();
if(done)break;
received+=value.length;
const elapsed=(performance.now()-chunkStart)/1000;
if(elapsed>0){
const speed=(received*8)/(elapsed*1000000);
updateDisplay(speed);
if(speed>peakSpeed)peakSpeed=speed;
}
}
const chunkTime=(performance.now()-chunkStart)/1000;
totalBytes+=received;
totalTime+=chunkTime;
const speed=(received*8)/(chunkTime*1000000);
speeds.push(speed);
updateDisplay(speed);
}catch(e){
document.getElementById('status').textContent=`测试 ${t.name} 失败，跳过...`;
}
}
const avgSpeed=speeds.length>0?speeds.reduce((a,b)=>a+b,0)/speeds.length:0;
updateDisplay(avgSpeed);
document.getElementById('gaugeText').textContent=avgSpeed.toFixed(1);
document.getElementById('stats').style.display='grid';
document.getElementById('totalSize').textContent=formatSize(totalBytes);
document.getElementById('duration').textContent=totalTime.toFixed(2)+'s';
document.getElementById('peakSpeed').textContent=peakSpeed.toFixed(2)+' Mbps';
document.getElementById('avgSpeed').textContent=avgSpeed.toFixed(2)+' Mbps';
const now=new Date();
const dateStr=`${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
history.push({date:dateStr,speed:avgSpeed.toFixed(2),size:formatSize(totalBytes)});
if(history.length>20)history=history.slice(-20);
localStorage.setItem('speedTestHistory',JSON.stringify(history));
renderHistory();
document.getElementById('status').textContent='测试完成！';
document.getElementById('progressBar').width='100%';
btn.disabled=false;
btn.textContent='重新测试';
testing=false;
}
function updateDisplay(speed){
document.getElementById('speedValue').textContent=speed.toFixed(2);
const maxSpeed=100;
const pct=Math.min(speed/maxSpeed,1);
const offset=565-(565*pct);
document.getElementById('gaugeFill').style.strokeDashoffset=offset;
if(speed>=50)document.getElementById('gaugeFill').style.stroke='var(--green)';
else if(speed>=10)document.getElementById('gaugeFill').style.stroke='var(--accent)';
else document.getElementById('gaugeFill').style.stroke='var(--yellow)';
}
function formatSize(bytes){
if(bytes===0)return'0 B';
const k=1024;
const sizes=['B','KB','MB','GB'];
const i=Math.floor(Math.log(bytes)/Math.log(k));
return parseFloat((bytes/Math.pow(k,i)).toFixed(1))+' '+sizes[i];
}
</script>
<script src="../i18n.js"></script>
</body>
</html>
