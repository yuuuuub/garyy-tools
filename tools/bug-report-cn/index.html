<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐛 缺陷报告</title>
<meta name="description" content="Bug报告工具，规范记录软件缺陷信息，追踪修复进度">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--orange:#f0883e;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--orange:#bc4c00}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:1000px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:14px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-num{font-size:1.5rem;font-weight:700}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:2px}
.bug-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:all .2s}
.bug-card:hover{border-color:var(--accent)}
.bug-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bug-id{font-size:.8rem;color:var(--accent);font-weight:700}
.bug-title{font-weight:600;font-size:1rem;margin:4px 0}
.badge{padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600;white-space:nowrap}
.badge-critical{background:rgba(248,81,73,.2);color:var(--red)}
.badge-high{background:rgba(248,81,73,.1);color:var(--red)}
.badge-medium{background:rgba(210,153,34,.15);color:var(--yellow)}
.badge-low{background:rgba(63,185,80,.15);color:var(--green)}
.badge-new{background:rgba(248,81,73,.1);color:var(--red)}
.badge-open{background:rgba(248,81,73,.1);color:var(--red)}
.badge-progress{background:rgba(59,130,246,.15);color:var(--accent)}
.badge-fixed{background:rgba(63,185,80,.15);color:var(--green)}
.badge-verified{background:rgba(168,85,247,.15);color:var(--purple)}
.badge-closed{background:rgba(139,148,158,.15);color:var(--text2)}
.bug-section{margin-top:10px;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:.85rem}
.bug-section .label{font-size:.75rem;font-weight:600;color:var(--text2);margin-bottom:4px}
.bug-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--text2);margin-top:4px}
.bug-actions{display:flex;gap:6px;margin-top:10px}
.bug-actions button{padding:5px 12px;font-size:.8rem}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-chip{padding:5px 12px;border-radius:20px;font-size:.75rem;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text2);transition:all .2s}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto}
.empty{color:var(--text2);text-align:center;padding:30px}
@media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐛</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🐛 缺陷报告">
<meta property="og:description" content="Bug报告工具，规范记录软件缺陷信息，追踪修复进度">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/bug-report-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='bugreport_data';
let state=JSON.parse(localStorage.getItem(STORE)||'{"bugs":[]}');
if(!state.bugs.length){
  state.bugs=[
    {id:'BUG-001',title:'用户头像上传失败',severity:'high',status:'progress',module:'用户中心',version:'v2.1.0',
      environment:'Chrome 120 / macOS 14.2',steps:'1. 点击头像区域\n2. 选择图片文件\n3. 点击上传',
      expected:'图片成功上传并显示',actual:'页面显示"上传失败"错误提示',
      reporter:'测试组-小王',assignee:'张三',created:'2025-06-20',updated:'2025-06-22',
      notes:'仅JPEG格式复现，PNG正常'},
    {id:'BUG-002',title:'订单列表分页异常',severity:'critical',status:'open',module:'订单管理',version:'v2.1.0',
      environment:'Safari 17 / iOS 17',steps:'1. 打开订单列表\n2. 点击第3页',
      expected:'显示第3页数据',actual:'显示的仍是第1页数据',
      reporter:'开发组-李四',assignee:'',created:'2025-06-23',updated:'2025-06-23',
      notes:''},
    {id:'BUG-003',title:'暗色模式文字颜色不统一',severity:'low',status:'fixed',module:'全局样式',version:'v2.0.5',
      environment:'所有浏览器',steps:'1. 切换到暗色模式\n2. 查看各页面',
      expected:'所有文字清晰可读',actual:'部分页面辅助文字颜色过浅',
      reporter:'设计组-赵六',assignee:'王五',created:'2025-06-10',updated:'2025-06-12',
      notes:'已修复'}
  ];
}
let showModal=false,editingBug=null,filterSeverity='all',filterStatus='all';
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function genId(){const n=state.bugs.length+1;return'BUG-'+String(n).padStart(3,'0')}

function render(){
  let h=`<div class="hdr"><h1>🐛 缺陷报告</h1><p>规范记录和追踪软件缺陷</p></div>`;
  const bugs=state.bugs;
  h+=`<div class="stats-grid"><div class="stat"><div class="stat-num">${bugs.length}</div><div class="stat-label">总缺陷</div></div><div class="stat"><div class="stat-num" style="color:var(--red)">${bugs.filter(b=>b.status==='open'||b.status==='new').length}</div><div class="stat-label">待修复</div></div><div class="stat"><div class="stat-num" style="color:var(--accent)">${bugs.filter(b=>b.status==='progress').length}</div><div class="stat-label">修复中</div></div><div class="stat"><div class="stat-num" style="color:var(--green)">${bugs.filter(b=>b.status==='fixed'||b.status==='verified'||b.status==='closed').length}</div><div class="stat-label">已修复</div></div></div>`;

  h+=`<div class="cd"><div class="flex-between"><h2 style="margin:0">缺陷列表</h2><button onclick="openNew()">+ 报告缺陷</button></div>`;
  h+=`<div class="filter-bar">`;
  ['all','critical','high','medium','low'].forEach(s=>{
    const labels={all:'全部',critical:'严重',high:'高',medium:'中',low:'低'};
    h+=`<div class="filter-chip ${filterSeverity===s?'active':''}" onclick="filterSeverity='${s}';render()">${labels[s]}</div>`;
  });
  h+=`<span style="color:var(--border)">|</span>`;
  ['all','open','progress','fixed','verified','closed'].forEach(s=>{
    const labels={all:'全部',new:'新建',open:'待修复',progress:'修复中',fixed:'已修复',verified:'已验证',closed:'已关闭'};
    h+=`<div class="filter-chip ${filterStatus===s?'active':''}" onclick="filterStatus='${s}';render()">${labels[s]||s}</div>`;
  });
  h+=`</div></div>`;

  let filtered=bugs;
  if(filterSeverity!=='all')filtered=filtered.filter(b=>b.severity===filterSeverity);
  if(filterStatus!=='all')filtered=filtered.filter(b=>b.status===filterStatus);

  if(!filtered.length)h+=`<div class="cd"><p class="empty">暂无缺陷记录</p></div>`;
  filtered.forEach(b=>{
    const statusLabels={new:'🆕 新建',open:'📭 待修复',progress:'🔧 修复中',fixed:'✅ 已修复',verified:'✔️ 已验证',closed:'🔒 已关闭'};
    const sevLabels={critical:'🔴 严重',high:'🟠 高',medium:'🟡 中',low:'🟢 低'};
    h+=`<div class="bug-card"><div class="bug-header"><div><span class="bug-id">${b.id}</span><div class="bug-title">${b.title}</div><div class="bug-meta"><span class="badge badge-${b.severity}">${sevLabels[b.severity]}</span><span class="badge badge-${b.status}">${statusLabels[b.status]||b.status}</span><span>📦 ${b.version}</span><span>📁 ${b.module}</span></div></div></div>`;
    h+=`<div class="bug-section"><div class="label">环境</div>${b.environment}</div>`;
    h+=`<div class="bug-section"><div class="label">复现步骤</div><pre style="white-space:pre-wrap;font-family:inherit;margin:0">${b.steps}</pre></div>`;
    h+=`<div style="display:flex;gap:8px;margin-top:8px"><div class="bug-section" style="flex:1"><div class="label">期望结果</div>${b.expected}</div><div class="bug-section" style="flex:1"><div class="label">实际结果</div><span style="color:var(--red)">${b.actual}</span></div></div>`;
    if(b.notes)h+=`<div class="bug-section"><div class="label">备注</div>${b.notes}</div>`;
    h+=`<div class="bug-meta"><span>👤 报告人：${b.reporter}</span><span>🔧 指派：${b.assignee||'未指派'}</span><span>📅 创建：${b.created}</span><span>🔄 更新：${b.updated}</span></div>`;
    h+=`<div class="bug-actions">`;
    if(b.status==='open'||b.status==='new')h+=`<button onclick="updateBugStatus('${b.id}','progress')">▶️ 开始修复</button>`;
    if(b.status==='progress')h+=`<button onclick="updateBugStatus('${b.id}','fixed')">✅ 标记修复</button>`;
    if(b.status==='fixed')h+=`<button onclick="updateBugStatus('${b.id}','verified')">✔️ 验证通过</button>`;
    if(b.status==='verified')h+=`<button onclick="updateBugStatus('${b.id}','closed')">🔒 关闭</button>`;
    if(b.status!=='open'&&b.status!=='new'&&b.status!=='closed')h+=`<button class="sec" onclick="updateBugStatus('${b.id}','open')">🔄 重新打开</button>`;
    h+=`<button class="sec" onclick="editBug('${b.id}')">✏️ 编辑</button><button class="dng" onclick="deleteBug('${b.id}')">🗑️</button></div></div>`;
  });

  if(showModal)h+=renderModal();
  $('app').innerHTML=h;
}

function renderModal(){
  const isEdit=!!editingBug?.id;
  const b=editingBug||{};
  let h=`<div class="modal-overlay" onclick="showModal=false;editingBug=null;render()"><div class="modal" onclick="event.stopPropagation()">`;
  h+=`<h2 style="margin-bottom:16px">${isEdit?'✏️ 编辑缺陷':'🐛 报告缺陷'}</h2>`;
  h+=`<label>标题</label><input id="mTitle" value="${b.title||''}" placeholder="缺陷标题">`;
  h+=`<div style="display:flex;gap:12px"><div style="flex:1"><label>严重程度</label><select id="mSev"><option value="critical" ${b.severity==='critical'?'selected':''}>🔴 严重</option><option value="high" ${b.severity==='high'?'selected':''}>🟠 高</option><option value="medium" ${b.severity==='medium'?'selected':''}>🟡 中</option><option value="low" ${b.severity==='low'?'selected':''}>🟢 低</option></select></div><div style="flex:1"><label>状态</label><select id="mStatus"><option value="open" ${b.status==='open'?'selected':''}>待修复</option><option value="progress" ${b.status==='progress'?'selected':''}>修复中</option><option value="fixed" ${b.status==='fixed'?'selected':''}>已修复</option><option value="verified" ${b.status==='verified'?'selected':''}>已验证</option><option value="closed" ${b.status==='closed'?'selected':''}>已关闭</option></select></div></div>`;
  h+=`<div style="display:flex;gap:12px"><div style="flex:1"><label>模块</label><input id="mModule" value="${b.module||''}" placeholder="如：用户中心"></div><div style="flex:1"><label>版本</label><input id="mVersion" value="${b.version||''}" placeholder="如：v2.1.0"></div></div>`;
  h+=`<label>环境</label><input id="mEnv" value="${b.environment||''}" placeholder="如：Chrome 120 / macOS 14.2">`;
  h+=`<label>复现步骤</label><textarea id="mSteps" placeholder="1. 第一步\n2. 第二步\n3. 第三步">${b.steps||''}</textarea>`;
  h+=`<div style="display:flex;gap:12px"><div style="flex:1"><label>期望结果</label><textarea id="mExpected" rows="2">${b.expected||''}</textarea></div><div style="flex:1"><label>实际结果</label><textarea id="mActual" rows="2">${b.actual||''}</textarea></div></div>`;
  h+=`<div style="display:flex;gap:12px"><div style="flex:1"><label>报告人</label><input id="mReporter" value="${b.reporter||''}"></div><div style="flex:1"><label>指派给</label><input id="mAssignee" value="${b.assignee||''}"></div></div>`;
  h+=`<label>备注</label><textarea id="mNotes" rows="2">${b.notes||''}</textarea>`;
  h+=`<div class="flex" style="margin-top:16px;justify-content:flex-end"><button class="sec" onclick="showModal=false;editingBug=null;render()">取消</button><button onclick="saveBug()">${isEdit?'保存':'提交'}</button></div>`;
  h+=`</div></div>`;
  return h;
}

function openNew(){editingBug={severity:'medium',status:'open',created:new Date().toISOString().slice(0,10),updated:new Date().toISOString().slice(0,10)};showModal=true;render()}
function editBug(id){const b=state.bugs.find(x=>x.id===id);editingBug={...b};showModal=true;render()}
function saveBug(){
  const title=$('mTitle').value.trim();
  if(!title){alert('请输入标题');return}
  const bug={
    id:editingBug?.id||genId(),title,severity:$('mSev').value,status:$('mStatus').value||editingBug?.status||'open',
    module:$('mModule').value.trim(),version:$('mVersion').value.trim(),
    environment:$('mEnv').value.trim(),steps:$('mSteps').value.trim(),
    expected:$('mExpected').value.trim(),actual:$('mActual').value.trim(),
    reporter:$('mReporter').value.trim(),assignee:$('mAssignee').value.trim(),
    created:editingBug?.created||new Date().toISOString().slice(0,10),
    updated:new Date().toISOString().slice(0,10),notes:$('mNotes').value.trim()
  };
  const idx=state.bugs.findIndex(x=>x.id===bug.id);
  if(idx>=0)state.bugs[idx]=bug;else state.bugs.unshift(bug);
  save();showModal=false;editingBug=null;render();
}
function deleteBug(id){if(!confirm('确定删除？'))return;state.bugs=state.bugs.filter(b=>b.id!==id);save();render()}
function updateBugStatus(id,status){const b=state.bugs.find(x=>x.id===id);if(b){b.status=status;b.updated=new Date().toISOString().slice(0,10)}save();render()}
render();
</script>
</body>
</html>
