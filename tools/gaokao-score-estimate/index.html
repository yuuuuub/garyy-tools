<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 高考估分助手 - Gary's Tools</title>
<meta name="description" content="2026高考估分工具，选择题/填空题/解答题分科估分，智能计算总分和预估排名区间">
<style>
:root{--bg:#f5f3ff;--card:#fff;--text:#1e1b4b;--text2:#6b7280;--accent:#7c3aed;--accent2:#a855f7;--green:#059669;--red:#dc2626;--orange:#ea580c;--border:#e5e7eb;--radius:14px;--shadow:0 2px 16px rgba(0,0,0,.06)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
[data-theme="dark"]{--bg:#0f0a1a;--card:#1a1228;--text:#e5e0f0;--text2:#9ca3af;--border:#2d1f4e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;-webkit-font-smoothing:antialiased}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#7c3aed,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:1rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.input-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.input-row label{font-size:.85rem;color:var(--text2);min-width:80px;font-weight:500}
.input-row input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:1rem;background:var(--bg);color:var(--text);outline:none;text-align:center;font-weight:600;transition:border-color .2s}
.input-row input:focus{border-color:var(--accent)}
.input-row .max{font-size:.8rem;color:var(--text2);min-width:50px}
.result-big{text-align:center;padding:24px 0}
.result-big .total{font-size:3.5rem;font-weight:900;background:linear-gradient(135deg,#7c3aed,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-big .label{font-size:.85rem;color:var(--text2)}
.subject-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub-stat{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
.sub-stat .name{font-size:.8rem;color:var(--text2)}
.sub-stat .score{font-size:1.3rem;font-weight:700;color:var(--accent)}
.rank-estimate{text-align:center;padding:12px;background:linear-gradient(135deg,rgba(124,58,237,.1),rgba(236,72,153,.1));border-radius:10px;margin-top:12px}
.rank-estimate .rank{font-size:1.3rem;font-weight:800;color:var(--accent)}
.rank-estimate .desc{font-size:.8rem;color:var(--text2)}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="📝 高考估分助手 - Gary's Tools">
  <meta property="og:description" content="2026高考估分工具，选择题/填空题/解答题分科估分，智能计算总分和预估排名区间">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/gaokao-score-estimate/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<header>
<h1>📝 高考估分助手</h1>
<p>输入各科预估得分 · 智能估算总分与排名区间</p>
</header>

<div class="card">
<h2>📚 科目得分</h2>
<div id="subjects"></div>
</div>

<div class="card" id="resultCard">
<h2>📊 估分结果</h2>
<div class="result-big">
<div class="label">预估总分</div>
<div class="total" id="totalScore">0</div>
<div class="label">满分 750</div>
</div>
<div class="subject-grid" id="subjectStats"></div>
<div class="rank-estimate">
<div class="desc">预估排名区间（仅供参考）</div>
<div class="rank" id="rankEstimate">--</div>
<div class="desc">基于历年高考数据模拟推算</div>
</div>
</div>
<footer>数据仅供参考 · 祝金榜题名 🎓</footer>
</div>

<script>
const SUBJECTS=[
{name:'语文',max:150,icon:'📖'},
{name:'数学',max:150,icon:'🧮'},
{name:'外语',max:150,icon:'🌍'},
{name:'物理/历史',max:100,icon:'⚛️'},
{name:'化学/地理',max:100,icon:'🧪'},
{name:'生物/政治',max:100,icon:'🧬'},
];
function init(){
let html='';
SUBJECTS.forEach((s,i)=>{
html+=`<div class="input-row">
<label>${s.icon} ${s.name}</label>
<input type="number" id="sub${i}" min="0" max="${s.max}" placeholder="0" value="0">
<span class="max">/ ${s.max}</span>
</div>`;
});
document.getElementById('subjects').innerHTML=html;
try{
const d=JSON.parse(localStorage.getItem('gaokao-estimate')||'{}');
SUBJECTS.forEach((s,i)=>{if(d[i]!==undefined)document.getElementById('sub'+i).value=d[i];});
}catch(e){}
SUBJECTS.forEach((s,i)=>{
document.getElementById('sub'+i).addEventListener('input',calc);
});
calc();
}
function calc(){
const scores=[];
SUBJECTS.forEach((s,i)=>{
let v=parseInt(document.getElementById('sub'+i).value)||0;
v=Math.max(0,Math.min(s.max,v));
document.getElementById('sub'+i).value=v;
scores.push(v);
});
const total=scores.reduce((a,b)=>a+b,0);
document.getElementById('totalScore').textContent=total;
document.getElementById('subjectStats').innerHTML=SUBJECTS.map((s,i)=>`<div class="sub-stat"><div class="name">${s.icon} ${s.name}</div><div class="score">${scores[i]}</div></div>`).join('');
let rank='',rankDesc='';
if(total>=700){rank='全省前50名';rankDesc='清北复交稳了！';}
else if(total>=680){rank='全省前200名';rankDesc='C9名校任选！';}
else if(total>=650){rank='全省前2000名';rankDesc='985名校有把握';}
else if(total>=600){rank='全省前8000名';rankDesc='211重点大学可期';}
else if(total>=550){rank='全省前2万名';rankDesc='一本线以上，好专业可选';}
else if(total>=500){rank='全省前5万名';rankDesc='二本线以上，本科稳';}
else if(total>=450){rank='全省前10万名';rankDesc='本科线附近，需慎选';}
else if(total>=400){rank='全省前15万名';rankDesc='专科批，也可专升本';}
else if(total>0){rank='请认真估分';rankDesc='输入各科得分后查看';}
else{rank='--';rankDesc='输入各科预估得分';}
document.getElementById('rankEstimate').innerHTML=rank+'<br><small style="font-size:.75rem;color:var(--text2)">'+rankDesc+'</small>';
const d={};scores.forEach((v,i)=>{d[i]=v;});
localStorage.setItem('gaokao-estimate',JSON.stringify(d));
}
init();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
