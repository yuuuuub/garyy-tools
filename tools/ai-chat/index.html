<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 简易AI对话 - Gary's Tools</title>
<meta name="description" content="简易AI对话工具，与人工智能聊天获取回答和灵感">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;line-height:1.6;min-height:100vh}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.8rem;font-weight:700;margin-bottom:4px}
header p{color:var(--text2);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.chat-box{height:400px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;background:rgba(13,17,23,.4)}
.chat-box::-webkit-scrollbar{width:6px}
.chat-box::-webkit-scrollbar-track{background:transparent}
.chat-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.msg{margin-bottom:14px;display:flex;gap:10px}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.msg-user .msg-avatar{background:var(--blue)}
.msg-bot .msg-avatar{background:var(--green)}
.msg-content{background:rgba(22,27,34,.8);border:1px solid var(--border);border-radius:8px;padding:10px 14px;max-width:80%;font-size:.88rem;line-height:1.6}
.msg-user .msg-content{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.2)}
.msg-bot .msg-content{background:rgba(35,134,54,.1);border-color:rgba(35,134,54,.2)}
.msg-time{font-size:.65rem;color:var(--text2);margin-top:4px}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:.9rem;font-family:inherit;outline:none;transition:border .2s}
.input-row input:focus{border-color:var(--blue)}
.input-row button{padding:9px 20px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:#fff;font-size:.85rem;cursor:pointer;font-family:inherit;transition:opacity .2s;white-space:nowrap}
.input-row button:hover{opacity:.9}
.input-row button:disabled{opacity:.5;cursor:not-allowed}
.error-msg{background:rgba(239,68,68,.1);border:1px solid var(--red);border-radius:6px;padding:10px;color:var(--red);font-size:.82rem;margin-top:10px;display:none}
.waiting-msg{background:rgba(245,158,11,.1);border:1px solid var(--gold);border-radius:6px;padding:10px;color:var(--gold);font-size:.82rem;margin-top:10px;display:none}
.typing-indicator{display:flex;gap:4px;padding:4px 0}
.typing-indicator span{width:6px;height:6px;border-radius:50%;background:var(--text2);animation:typing 1s infinite}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{opacity:.3}30%{opacity:1}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="💬 简易AI对话 - Gary's Tools">
  <meta property="og:description" content="简易AI对话工具，与人工智能聊天获取回答和灵感">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/ai-chat/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<header>
<h1>💬 简易AI对话</h1>
<p>SiliconFlow · Qwen2</p>
<div style="margin-top:8px">
<button onclick="promptApiKey()" style="padding:4px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:.75rem;cursor:pointer">⚙️ 设置 API Key</button>
<span id="keyStatus" style="font-size:.7rem;color:var(--text2);margin-left:8px"></span>
</div>
</header>
<div class="card">
<div class="chat-box" id="chatBox">
<div class="msg msg-bot">
<div class="msg-avatar">🤖</div>
<div class="msg-content">
<div>你好！我是AI助手，有什么可以帮你的吗？</div>
<div class="msg-time">现在</div>
</div>
</div>
</div>
<div id="waitingMsg" class="waiting-msg">⏳ 模型加载中，请稍候...</div>
<div id="errorMsg" class="error-msg"></div>
<div class="input-row">
<input type="text" id="msgInput" placeholder="输入消息..." title="Enter键搜索" autocomplete="off">
<button id="sendBtn">发送</button>
<button id="clearChatBtn" style="border-color:var(--border);background:transparent;color:var(--text)">清空</button>
</div>
</div>
</div>
<script>
(function(){
'use strict';
var chatBox=document.getElementById('chatBox');
var msgInput=document.getElementById('msgInput');
var sendBtn=document.getElementById('sendBtn');
var clearChatBtn=document.getElementById('clearChatBtn');
var errorMsg=document.getElementById('errorMsg');
var waitingMsg=document.getElementById('waitingMsg');
var API_URL='https://api.siliconflow.cn/v1/chat/completions';
var API_KEY=localStorage.getItem('sf_api_key')||'';
var MODEL='Qwen/Qwen2-7B-Instruct';
var isWaiting=false;
var chatHistory=[{role:'system',content:'你是一个有用的AI助手，请用中文回答问题。'}];

function addMessage(role,text){
  var div=document.createElement('div');
  div.className='msg msg-'+(role==='user'?'user':'bot');
  var avatar=role==='user'?'👤':'🤖';
  var now=new Date();
  var timeStr=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  div.innerHTML='<div class="msg-avatar">'+avatar+'</div><div class="msg-content"><div>'+text+'</div><div class="msg-time">'+timeStr+'</div></div>';
  chatBox.appendChild(div);
  chatBox.scrollTop=chatBox.scrollHeight;
}

function addTyping(){
  var div=document.createElement('div');
  div.className='msg msg-bot';
  div.id='typingMsg';
  div.innerHTML='<div class="msg-avatar">🤖</div><div class="msg-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  chatBox.appendChild(div);
  chatBox.scrollTop=chatBox.scrollHeight;
}

function removeTyping(){
  var el=document.getElementById('typingMsg');
  if(el)el.remove();
}

function sendMessage(){
  if(isWaiting)return;
  var text=msgInput.value.trim();
  if(!text){showError('请输入消息');return;}
  hideError();
  hideWaiting();
  addMessage('user',escapeHtml(text));
  msgInput.value='';
  isWaiting=true;
  sendBtn.disabled=true;
  addTyping();
  fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
    body:JSON.stringify({model:MODEL,messages:chatHistory.concat([{role:'user',content:text}]),max_tokens:500,temperature:0.7})
  })
  .then(function(r){
    if(!r.ok)return r.json().then(function(d){throw new Error(d.error?.message||'请求失败 ('+r.status+')')});
    return r.json();
  })
  .then(function(data){
    removeTyping();
    isWaiting=false;
    sendBtn.disabled=false;
    hideWaiting();
    var reply='';
    if(data&&data.choices&&data.choices[0]&&data.choices[0].message){
      reply=data.choices[0].message.content;
      chatHistory.push({role:'user',content:text});
      chatHistory.push({role:'assistant',content:reply});
      if(chatHistory.length>20)chatHistory=chatHistory.slice(-20);
    }else{
      reply='抱歉，我暂时无法回答这个问题。';
    }
    addMessage('bot',escapeHtml(reply));
  })
  .catch(function(err){
    removeTyping();
    isWaiting=false;
    sendBtn.disabled=false;
    if(err.message==='模型加载中')return;
    if(!API_KEY){showError('请先设置 API Key（点击右上角齿轮图标）');return;}
    showError(err.message||'请求失败，请稍后重试');
  });
}

function escapeHtml(str){
  var div=document.createElement('div');
  div.textContent=str;
  return div.innerHTML;
}

function showError(msg){errorMsg.textContent=msg;errorMsg.style.display='block';}
function hideError(){errorMsg.style.display='none';}
function showWaiting(){waitingMsg.style.display='block';}
function hideWaiting(){waitingMsg.style.display='none';}

function promptApiKey(){
  var key=prompt('请输入 SiliconFlow API Key\n\n免费注册: https://cloud.siliconflow.cn',API_KEY);
  if(key!==null){
    API_KEY=key.trim();
    localStorage.setItem('sf_api_key',API_KEY);
    updateKeyStatus();
  }
}
function updateKeyStatus(){
  var el=document.getElementById('keyStatus');
  if(API_KEY){el.textContent='✅ 已设置';el.style.color='var(--green)';}
  else{el.textContent='❌ 未设置';el.style.color='var(--red)';}
}
updateKeyStatus();

sendBtn.addEventListener('click',sendMessage);
msgInput.addEventListener('keydown',function(e){
  if(e.key==='Enter')sendMessage();
});
clearChatBtn.addEventListener('click',function(){
  chatBox.innerHTML='<div class="msg msg-bot"><div class="msg-avatar">🤖</div><div class="msg-content"><div>你好！我是AI助手，有什么可以帮你的吗？</div><div class="msg-time">现在</div></div></div>';
  chatHistory=[{role:'system',content:'你是一个有用的AI助手，请用中文回答问题。'}];
  hideError();
  hideWaiting();
});
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
