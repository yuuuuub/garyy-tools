<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤸 拉伸运动</title>
<meta name="description" content="拉伸运动指南，多种拉伸动作、计时器、记录运动数据">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px}
.ctn{max-width:600px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}.button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text)}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}
.empty{text-align:center;padding:40px;color:var(--text2)}
.routine-card{background:var(--bg);border:2px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .2s}.routine-card:hover{border-color:var(--accent)}.routine-card.active{border-color:var(--accent);background:rgba(59,130,246,.05)}
.routine-card .title{font-weight:600;font-size:1.05rem}.routine-card .meta{font-size:.8rem;color:var(--text2);margin-top:4px}
.exercise-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:8px;margin-bottom:8px}
.exercise-item .icon{font-size:2rem;width:50px;text-align:center;flex-shrink:0}
.exercise-item .info{flex:1}.exercise-item .name{font-weight:600}.exercise-item .detail{font-size:.8rem;color:var(--text2);margin-top:2px}
.exercise-item .timer-btn{padding:6px 14px;border-radius:20px;font-size:.85rem}
.active-exercise{background:rgba(59,130,246,.1);border:2px solid var(--accent)}
.timer-display{text-align:center;padding:20px}
.timer-big{font-size:3rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.timer-exercise-name{font-size:1.2rem;margin-top:8px;color:var(--text)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:12px 0}.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}.stat-card .num{font-size:1.4rem;font-weight:700;color:var(--accent)}.stat-card .lbl{font-size:.7rem;color:var(--text2);margin-top:2px}
.check-item{display:flex;align-items:center;gap:8px;padding:8px;cursor:pointer;border-radius:6px;transition:background .2s}.check-item:hover{background:var(--bg)}.check-item.done{opacity:.5}
.check-item .check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}.check-item.done .check{background:var(--success);border-color:var(--success)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤸</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🤸 拉伸运动</h1><p>科学拉伸，缓解疲劳</p></div>

<div class="cd"><h2>🎯 选择训练计划</h2>
<div id="routineList"></div></div>

<div class="cd" id="activeSection" style="display:none"><h2>🏃 当前训练</h2>
<div class="timer-display">
  <div class="timer-big" id="timerBig">00:30</div>
  <div class="timer-exercise-name" id="timerName">准备开始</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>
<div class="bg">
<button id="startBtn" onclick="toggleWorkout()" style="padding:14px 40px;font-size:1.1rem">▶ 开始</button>
<button class="sec" onclick="skipExercise()">⏭ 跳过</button>
<button class="sec" onclick="stopWorkout()">⏹ 结束</button>
</div>
<div id="exerciseChecklist" style="margin-top:16px"></div></div>

<div class="cd"><h2>📊 运动统计</h2>
<div class="stats-grid" id="stats"></div></div>

<div class="cd"><h2>📋 最近记录</h2><div id="recentList" class="empty">暂无记录</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let records=JSON.parse(localStorage.getItem('sr_records')||'[]');
const today=()=>new Date().toISOString().slice(0,10);
const save=()=>localStorage.setItem('sr_records',JSON.stringify(records));

const routines=[
  {name:'办公室拉伸',desc:'缓解久坐疲劳',icon:'🏢',duration:10,exercises:[
    {name:'颈部旋转',icon:'🔄',dur:30,desc:'缓慢转动头部'},
    {name:'肩部耸肩',icon:' shrugged',dur:30,desc:'上下耸肩放松'},
    {name:'手臂伸展',icon:'🙆',dur:30,desc:'双手交叉向上伸展'},
    {name:'腰部扭转',icon:'🔄',dur:30,desc:'坐姿左右扭转'},
    {name:'手腕旋转',icon:'🤲',dur:30,desc:'旋转手腕关节'},
    {name:'眼部放松',icon:'👀',dur:60,desc:'闭眼休息+远眺'}
  ]},
  {name:'晨间唤醒',desc:'开启活力一天',icon:'☀️',duration:15,exercises:[
    {name:'全身伸展',icon:'🙆',dur:30,desc:'双手上举全身拉伸'},
    {name:'猫牛式',icon:'🐱',dur:45,desc:'四点跪姿弓背塌腰'},
    {name:'下犬式',icon:'🐕',dur:45,desc:'手脚撑地臀部上抬'},
    {name:'弓步拉伸',icon:'🏃',dur:40,desc:'前腿弓步后腿伸直'},
    {name:'大腿前侧',icon:'🦵',dur:30,desc:'站立拉伸大腿前侧'},
    {name:'小腿拉伸',icon:'🦶',dur:30,desc:'前脚掌踩墙拉伸'}
  ]},
  {name:'睡前放松',desc:'助眠减压',icon:'🌙',duration:12,exercises:[
    {name:'蝴蝶式',icon:'🦋',dur:60,desc:'坐姿脚掌相对'},
    {name:'仰卧扭转',icon:'🔄',dur:60,desc:'平躺左右扭转'},
    {name:'婴儿式',icon:'👶',dur:60,desc:'跪坐前趴放松'},
    {name:'仰卧抱膝',icon:'🤗',dur:45,desc:'平躺双手抱膝'},
    {name:'腿部靠墙',icon:'🦵',dur:90,desc:'双腿靠墙向上'},
    {name:'深呼吸',icon:'🌬️',dur:90,desc:'腹式深呼吸'}
  ]},
  {name:'全身拉伸',desc:'全面放松身体',icon:'💪',duration:20,exercises:[
    {name:'颈部拉伸',icon:'🔄',dur:30,desc:'左右前后拉伸'},
    {name:'肩部环绕',icon:'🔄',dur:30,desc:'前后画圈'},
    {name:'胸部展开',icon:'🙆',dur:30,desc:'双手后扣展开'},
    {name:'腰部前弯',icon:'🙇',dur:40,desc:'站立前弯触脚'},
    {name:'大腿内侧',icon:'🦵',dur:40,desc:'分腿侧压'},
    {name:'臀部拉伸',icon:'🍑',dur:40,desc:'坐姿4字拉伸'},
    {name:'小腿拉伸',icon:'🦶',dur:30,desc:'弓步压腿'},
    {name:'背部伸展',icon:'🧘',dur:30,desc:'猫牛式伸展'}
  ]}
];

let selectedRoutine=null,isRunning=false,workoutTimer=null;
let currentExercise=0,exerciseTimer=0,exerciseRemaining=0;

function init(){
  let html='';routines.forEach((r,i)=>{
    html+=`<div class="routine-card" onclick="selectRoutine(${i})">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div class="title">${r.icon} ${r.name}</div><div class="meta">${r.desc} · ${r.exercises.length}个动作 · 约${r.duration}分钟</div></div>
        <button style="padding:6px 14px;font-size:.85rem">选择</button>
      </div></div>`;
  });$('routineList').innerHTML=html;
  renderStats();renderRecent();
}

function selectRoutine(i){
  selectedRoutine=routines[i];
  document.querySelectorAll('.routine-card').forEach((el,j)=>{el.classList.toggle('active',j===i)});
  $('activeSection').style.display='block';
  currentExercise=0;exerciseRemaining=selectedRoutine.exercises[0].dur;
  renderExerciseChecklist();updateTimerDisplay();$('activeSection').scrollIntoView({behavior:'smooth'});
}

function renderExerciseChecklist(){
  if(!selectedRoutine)return;
  let html='';selectedRoutine.exercises.forEach((ex,i)=>{
    const done=i<currentExercise;const active=i===currentExercise;
    html+=`<div class="check-item ${done?'done':''} ${active?'active-exercise':''}">
      <div class="check">${done?'✓':i===currentExercise?'▶':(i+1)}</div>
      <div><strong>${ex.icon} ${ex.name}</strong><div style="font-size:.8rem;color:var(--text2)">${ex.desc} · ${ex.dur}秒</div></div></div>`;
  });$('exerciseChecklist').innerHTML=html;
}

function toggleWorkout(){
  if(isRunning){pauseWorkout()}else{startWorkout()}
}

function startWorkout(){
  if(!selectedRoutine){alert('请先选择训练计划');return}
  isRunning=true;$('startBtn').textContent='⏸ 暂停';
  workoutTimer=setInterval(()=>{
    exerciseRemaining--;
    if(exerciseRemaining<=0){nextExercise()}
    updateTimerDisplay();
  },1000);
}

function pauseWorkout(){
  isRunning=false;clearInterval(workoutTimer);$('startBtn').textContent='▶ 继续';
}

function stopWorkout(){
  isRunning=false;clearInterval(workoutTimer);
  if(currentExercise>0){
    const completed=currentExercise;
    const totalSec=selectedRoutine.exercises.slice(0,currentExercise).reduce((s,e)=>s+e.dur,0);
    records.push({date:today(),routine:selectedRoutine.name,completed,totalTime:Math.round(totalSec/60),completedAt:new Date().toISOString()});
    save();renderStats();renderRecent();
  }
  $('startBtn').textContent='▶ 开始';$('timerName').textContent='准备开始';
  $('timerBig').textContent='00:00';$('progressFill').style.width='0%';
  currentExercise=0;renderExerciseChecklist();
}

function skipExercise(){if(selectedRoutine)nextExercise()}

function nextExercise(){
  if(!selectedRoutine)return;
  currentExercise++;
  if(currentExercise>=selectedRoutine.exercises.length){
    const totalSec=selectedRoutine.exercises.reduce((s,e)=>s+e.dur,0);
    records.push({date:today(),routine:selectedRoutine.name,completed:currentExercise,totalTime:Math.round(totalSec/60),completedAt:new Date().toISOString()});
    save();renderStats();renderRecent();
    isRunning=false;clearInterval(workoutTimer);
    $('timerName').textContent='🎉 训练完成！';$('startBtn').textContent='▶ 开始';
    $('progressFill').style.width='100%';renderExerciseChecklist();
    return;
  }
  exerciseRemaining=selectedRoutine.exercises[currentExercise].dur;
  renderExerciseChecklist();
}

function updateTimerDisplay(){
  const min=Math.floor(exerciseRemaining/60);const sec=exerciseRemaining%60;
  $('timerBig').textContent=`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  if(selectedRoutine){
    $('timerName').textContent=selectedRoutine.exercises[currentExercise].name;
    const total=selectedRoutine.exercises.reduce((s,e)=>s+e.dur,0);
    const done=selectedRoutine.exercises.slice(0,currentExercise).reduce((s,e)=>s+e.dur,0)+(selectedRoutine.exercises[currentExercise].dur-exerciseRemaining);
    $('progressFill').style.width=`${Math.round(done/total*100)}%`;
  }
}

function renderStats(){
  const total=records.length;const totalMin=records.reduce((s,r)=>s+r.totalTime,0);
  const uniqueRoutines=new Set(records.map(r=>r.routine)).size;
  $('stats').innerHTML=`
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">总次数</div></div>
    <div class="stat-card"><div class="num">${totalMin}</div><div class="lbl">总分钟</div></div>
    <div class="stat-card"><div class="num">${uniqueRoutines}</div><div class="lbl">训练类型</div></div>`;
}

function renderRecent(){
  const sorted=[...records].sort((a,b)=>b.completedAt.localeCompare(a.completedAt)).slice(0,10);
  let html='';sorted.forEach(r=>{
    html+=`<div class="li"><div style="display:flex;justify-content:space-between;align-items:center">
      <div><strong>${r.routine}</strong><div style="font-size:.8rem;color:var(--text2)">${r.date}</div></div>
      <span class="tag s">${r.totalTime}分钟</span></div></div>`;
  });$('recentList').innerHTML=html||'<div class="empty">暂无记录</div>';
}

init();
</script>
</body>
</html>
