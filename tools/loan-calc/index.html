<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贷款计算器</title>
<meta name="description" content="贷款计算器，计算房贷车贷等月供和利息">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.btn{background:var(--blue);color:var(--text);border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s}
.btn:hover{opacity:.85}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.result-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.stat-card{text-align:center;padding:14px;background:var(--bg);border-radius:var(--radius)}
.stat-card .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:1.2rem;font-weight:700}
.stat-card .value.gold{color:var(--gold)}
.stat-card .value.green{color:var(--green)}
.stat-card .value.red{color:var(--red)}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.detail-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
.detail-table th,.detail-table td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}
.detail-table th{color:var(--text2);font-weight:500;background:var(--bg)}
.detail-table td:first-child,.detail-table th:first-child{text-align:left}
.detail-table tr:last-child td{border-bottom:none}
.table-wrap{max-height:350px;overflow-y:auto}
.table-wrap::-webkit-scrollbar{width:4px}
.table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.chart-bar-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.chart-bar-row .label{min-width:60px;font-size:.78rem;color:var(--text2)}
.chart-bar-row .bar-track{flex:1;height:18px;background:var(--bg);border-radius:4px;overflow:hidden}
.chart-bar-row .bar-fill{height:100%;border-radius:4px;transition:width .5s}
.chart-bar-row .val{min-width:70px;text-align:right;font-size:.78rem;font-weight:600}
.preset-group{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.preset-btn{padding:4px 12px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;background:var(--card);color:var(--text);cursor:pointer;transition:all .2s}
.preset-btn:hover{border-color:var(--blue);color:var(--blue)}
@media(max-width:640px){.form-row{flex-direction:column}.result-grid{grid-template-columns:1fr}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="贷款计算器">
  <meta property="og:description" content="贷款计算器，计算房贷车贷等月供和利息">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/loan-calc/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
  <header>
    <h1>🏦 贷款计算器</h1>
    <p>等额本息月供计算</p>
  </header>

  <div class="card">
    <div class="form-row">
      <div class="group">
        <label>贷款金额 (元)</label>
        <input type="number" id="amount" value="500000" min="0" step="any">
      </div>
      <div class="group">
        <label>年利率 (%)</label>
        <input type="number" id="rate" value="4.5" min="0" max="100" step="any">
      </div>
    </div>
    <div class="form-row">
      <div class="group">
        <label>贷款期限 (年)</label>
        <input type="number" id="years" value="20" min="1" max="50" step="1">
      </div>
    </div>
    <div class="preset-group" id="ratePresets"></div>
    <div class="preset-group" id="yearPresets"></div>
  </div>

  <div class="card">
    <div class="section-title">📊 计算结果</div>
    <div class="result-grid" id="resultGrid"></div>
  </div>

  <div class="card">
    <div class="section-title">📊 贷款构成</div>
    <div id="pieChart"></div>
  </div>

  <div class="card">
    <div class="section-title">📋 还款明细</div>
    <div class="table-wrap" id="detailTable"></div>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const amountInp = $('amount');
const rateInp = $('rate');
const yearsInp = $('years');
const resultGrid = $('resultGrid');
const pieChart = $('pieChart');
const detailTable = $('detailTable');
const ratePresets = [3.5, 4.0, 4.5, 5.0, 5.5, 6.0];
const yearPresets = [5, 10, 15, 20, 25, 30];
function renderPresets(container, values, input, suffix){
  container.innerHTML = values.map(v => {
    const cls = parseFloat(input.value) === v ? 'preset-btn active' : 'preset-btn';
    return `<button class="preset-btn${parseFloat(input.value) === v ? ' active' : ''}" data-val="${v}">${v}${suffix}</button>`;
  }).join('');
  container.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.val;
      container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calc();
    });
  });
}
function calc(){
  const P = parseFloat(amountInp.value) || 0;
  const annualRate = (parseFloat(rateInp.value) || 0) / 100;
  const n = parseInt(yearsInp.value) || 1;
  const totalMonths = n * 12;
  const monthlyRate = annualRate / 12;
  if(P <= 0 || annualRate <= 0){
    resultGrid.innerHTML = '<div style="text-align:center;color:var(--text2);padding:20px">请输入有效数值</div>';
    pieChart.innerHTML = '';
    detailTable.innerHTML = '';
    return;
  }
  const compound = Math.pow(1 + monthlyRate, totalMonths);
  const monthlyPayment = P * monthlyRate * compound / (compound - 1);
  const totalPayment = monthlyPayment * totalMonths;
  const totalInterest = totalPayment - P;
  resultGrid.innerHTML = `
    <div class="stat-card"><div class="label">每月月供</div><div class="value gold">¥${monthlyPayment.toLocaleString('zh-CN',{minimumFractionDigits:2})}</div></div>
    <div class="stat-card"><div class="label">总还款额</div><div class="value">¥${totalPayment.toLocaleString('zh-CN',{minimumFractionDigits:2})}</div></div>
    <div class="stat-card"><div class="label">总利息</div><div class="value red">¥${totalInterest.toLocaleString('zh-CN',{minimumFractionDigits:2})}</div></div>
  `;
  const principalPct = (P / totalPayment * 100);
  const interestPct = 100 - principalPct;
  pieChart.innerHTML = `
    <div class="chart-bar-row">
      <div class="label">本金</div>
      <div class="bar-track"><div class="bar-fill" style="width:${principalPct}%;background:var(--green)"></div></div>
      <div class="val" style="color:var(--green)">${principalPct.toFixed(1)}%</div>
    </div>
    <div class="chart-bar-row">
      <div class="label">利息</div>
      <div class="bar-track"><div class="bar-fill" style="width:${interestPct}%;background:var(--red)"></div></div>
      <div class="val" style="color:var(--red)">${interestPct.toFixed(1)}%</div>
    </div>
    <div style="text-align:center;font-size:.78rem;color:var(--text2);margin-top:8px">贷款总额 ¥${P.toLocaleString()} &nbsp;|&nbsp; 利息总额 ¥${totalInterest.toLocaleString('zh-CN',{minimumFractionDigits:0})}</div>
  `;
  let rows = [];
  let balance = P;
  for(let y = 1; y <= n; y++){
    let yearPrincipal = 0;
    let yearInterest = 0;
    for(let m = 1; m <= 12; m++){
      const interestPart = balance * monthlyRate;
      const principalPart = monthlyPayment - interestPart;
      yearPrincipal += principalPart;
      yearInterest += interestPart;
      balance -= principalPart;
      if(balance < 0) balance = 0;
    }
    rows.push({year: y, principal: yearPrincipal, interest: yearInterest, balance: balance});
    if(balance <= 0) break;
  }
  detailTable.innerHTML = `<table class="detail-table">
    <thead><tr><th>年份</th><th>偿还本金</th><th>偿还利息</th><th>剩余本金</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>第${r.year}年</td>
      <td>¥${r.principal.toLocaleString('zh-CN',{minimumFractionDigits:2})}</td>
      <td>¥${r.interest.toLocaleString('zh-CN',{minimumFractionDigits:2})}</td>
      <td>¥${r.balance.toLocaleString('zh-CN',{minimumFractionDigits:2})}</td>
    </tr>`).join('')}</tbody></table>`;
  renderPresets($('ratePresets'), ratePresets, rateInp, '%');
  renderPresets($('yearPresets'), yearPresets, yearsInp, '年');
}
[amountInp, rateInp, yearsInp].forEach(el => {
  el.addEventListener('input', calc);
  el.addEventListener('change', calc);
});
calc();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
