<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 中文参考文献生成器</title>
<meta name="description" content="参考文献格式生成工具，支持GB/T 7714、APA、MLA等多种引用格式">
<meta name="robots" content="index, follow">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
button.grn{background:var(--green)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
label{display:block;font-size:.85rem;color:var(--text2);margin:8px 0 4px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hidden{display:none}
.type-tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.type-tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;white-space:nowrap;color:var(--text2);transition:all .2s;border:1px solid var(--border);background:var(--bg)}
.type-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ref-item{padding:16px;border:1px solid var(--border);border-radius:8px;margin:8px 0;background:var(--bg);position:relative}
.ref-item .ref-text{font-size:.9rem;line-height:1.6;padding-right:60px}
.ref-item .ref-format{font-size:.75rem;color:var(--accent);margin-top:6px}
.ref-item .ref-actions{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.ref-item .ref-actions button{padding:4px 8px;font-size:.75rem}
.output-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;min-height:100px;font-size:.9rem;white-space:pre-wrap;line-height:1.8;max-height:400px;overflow-y:auto}
.empty{text-align:center;padding:40px;color:var(--text2)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600;background:rgba(59,130,246,.2);color:var(--accent2)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:550px;max-height:85vh;overflow-y:auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1 style="position:fixed;top:6px;left:80px;z-index:999;font-size:1rem;pointer-events:none">📚 中文参考文献生成器</h1>

<div class="ctn" style="padding-top:50px">
<div class="bg" style="justify-content:center;margin-bottom:20px">
<button onclick="showView('add')" id="btn-add">➕ 添加文献</button>
<button onclick="showView('list')" id="btn-list">📋 文献列表</button>
<button onclick="showView('output')" id="btn-output">📤 生成引用</button>
<button class="sec" onclick="loadDemo()">📖 示例</button>
<button class="sec" onclick="exportRefs()">💾 导出</button>
<button class="sec" onclick="importRefs()">📥 导入</button>
</div>

<div id="view-add">
<div class="cd">
<h2 style="margin-bottom:12px">添加参考文献</h2>
<div class="type-tabs" id="type-tabs">
<div class="type-tab active" onclick="setRefType('article')">📄 期刊论文</div>
<div class="type-tab" onclick="setRefType('book')">📕 图书</div>
<div class="type-tab" onclick="setRefType('conference')">🎤 会议论文</div>
<div class="type-tab" onclick="setRefType('thesis')">🎓 学位论文</div>
<div class="type-tab" onclick="setRefType('web')">🌐 网页</div>
<div class="type-tab" onclick="setRefType('patent')">📜 专利</div>
</div>

<div id="form-article">
<div class="fr"><label>作者</label><input type="text" id="f-authors" placeholder="张三, 李四"><label>文章标题</label><input type="text" id="f-title" placeholder="论文标题"></div>
<div class="fr"><label>期刊名称</label><input type="text" id="f-journal" placeholder="期刊名称"><label>年份</label><input type="text" id="f-year" placeholder="2024"></div>
<div class="fr"><label>卷(期)</label><input type="text" id="f-volume" placeholder="12(3)"><label>页码</label><input type="text" id="f-pages" placeholder="45-52"></div>
</div>

<div id="form-book" class="hidden">
<div class="fr"><label>作者</label><input type="text" id="f-b-authors" placeholder="作者"><label>书名</label><input type="text" id="f-b-title" placeholder="书名"></div>
<div class="fr"><label>出版社</label><input type="text" id="f-b-publisher" placeholder="出版社"><label>年份</label><input type="text" id="f-b-year" placeholder="2024"></div>
<label>版次</label><input type="text" id="f-b-edition" placeholder="第2版" style="max-width:200px">
</div>

<div id="form-conference" class="hidden">
<div class="fr"><label>作者</label><input type="text" id="f-c-authors" placeholder="作者"><label>论文标题</label><input type="text" id="f-c-title" placeholder="论文标题"></div>
<div class="fr"><label>会议名称</label><input type="text" id="f-c-conf" placeholder="会议名称"><label>年份</label><input type="text" id="f-c-year" placeholder="2024"></div>
<div class="fr"><label>会议地点</label><input type="text" id="f-c-location" placeholder="北京"><label>页码</label><input type="text" id="f-c-pages" placeholder="100-110"></div>
</div>

<div id="form-thesis" class="hidden">
<div class="fr"><label>作者</label><input type="text" id="f-t-authors" placeholder="作者"><label>论文标题</label><input type="text" id="f-t-title" placeholder="论文标题"></div>
<div class="fr"><label>学校</label><input type="text" id="f-t-school" placeholder="学校名称"><label>年份</label><input type="text" id="f-t-year" placeholder="2024"></div>
<label>类型</label><select id="f-t-type" style="max-width:200px"><option value="硕士">硕士学位论文</option><option value="博士">博士学位论文</option></select>
</div>

<div id="form-web" class="hidden">
<div class="fr"><label>作者</label><input type="text" id="f-w-authors" placeholder="作者(可选)"><label>标题</label><input type="text" id="f-w-title" placeholder="网页标题"></div>
<div class="fr"><label>网站名称</label><input type="text" id="f-w-site" placeholder="网站名称"><label>网址</label><input type="text" id="f-w-url" placeholder="https://..."></div>
<label>发布/引用日期</label><input type="text" id="f-w-date" placeholder="2024-01-15" style="max-width:200px">
</div>

<div id="form-patent" class="hidden">
<div class="fr"><label>发明人</label><input type="text" id="f-p-inventors" placeholder="发明人"><label>专利名称</label><input type="text" id="f-p-title" placeholder="专利名称"></div>
<div class="fr"><label>专利号</label><input type="text" id="f-p-number" placeholder="CN202410123456"><label>年份</label><input type="text" id="f-p-year" placeholder="2024"></div>
</div>

<div class="bg" style="margin-top:16px">
<button onclick="addReference()">添加文献</button>
<button class="sec" onclick="clearForm()">清空表单</button>
</div>
</div>
</div>

<div id="view-list" class="hidden"><div id="ref-list"></div></div>

<div id="view-output" class="hidden">
<div class="cd">
<h2 style="margin-bottom:12px">生成引用格式</h2>
<label>选择格式</label>
<div class="type-tabs" id="format-tabs">
<div class="type-tab active" onclick="setFormat('gb7714')">GB/T 7714</div>
<div class="type-tab" onclick="setFormat('apa')">APA</div>
<div class="type-tab" onclick="setFormat('mla')">MLA</div>
<div class="type-tab" onclick="setFormat('chicago')">Chicago</div>
</div>
<div class="bg"><button onclick="copyOutput()">📋 复制到剪贴板</button><button class="sec" onclick="clearRefs()">🗑️ 清空全部</button></div>
</div>
<div class="output-box" id="output-box"></div>
</div>
</div>

<div class="modal-overlay hidden" id="import-modal"><div class="modal"><h2>📥 导入文献</h2><textarea id="import-input" rows="10" placeholder="粘贴JSON格式的文献数据"></textarea><div class="bg"><button onclick="confirmImport()">导入</button><button class="sec" onclick="closeModal('import-modal')">取消</button></div></div></div>

<script>
const STORAGE_KEY='citation_gen_data';
let refs=[];
let currentType='article';
let currentFormat='gb7714';

function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY));if(d)refs=d.refs||[]}catch(e){}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({refs}))}

function showView(v){['add','list','output'].forEach(id=>{document.getElementById('view-'+id).classList.toggle('hidden',id!==v);document.getElementById('btn-'+id)?.classList.toggle('active',id===v)});if(v==='list')renderList();if(v==='output')renderOutput()}

function setRefType(type){
currentType=type;
['article','book','conference','thesis','web','patent'].forEach(t=>{
document.getElementById('form-'+t).classList.toggle('hidden',t!==type);
});
document.querySelectorAll('#type-tabs .type-tab').forEach((tab,i)=>{
tab.classList.toggle('active',['article','book','conference','thesis','web','patent'][i]===type);
});
}

function setFormat(fmt){
currentFormat=fmt;
document.querySelectorAll('#format-tabs .type-tab').forEach((tab,i)=>{
tab.classList.toggle('active',['gb7714','apa','mla','chicago'][i]===fmt);
});
renderOutput();
}

function addReference(){
let ref={type:currentType,id:Date.now()};
if(currentType==='article'){
ref.authors=document.getElementById('f-authors').value.trim();
ref.title=document.getElementById('f-title').value.trim();
ref.journal=document.getElementById('f-journal').value.trim();
ref.year=document.getElementById('f-year').value.trim();
ref.volume=document.getElementById('f-volume').value.trim();
ref.pages=document.getElementById('f-pages').value.trim();
}else if(currentType==='book'){
ref.authors=document.getElementById('f-b-authors').value.trim();
ref.title=document.getElementById('f-b-title').value.trim();
ref.publisher=document.getElementById('f-b-publisher').value.trim();
ref.year=document.getElementById('f-b-year').value.trim();
ref.edition=document.getElementById('f-b-edition').value.trim();
}else if(currentType==='conference'){
ref.authors=document.getElementById('f-c-authors').value.trim();
ref.title=document.getElementById('f-c-title').value.trim();
ref.conference=document.getElementById('f-c-conf').value.trim();
ref.year=document.getElementById('f-c-year').value.trim();
ref.location=document.getElementById('f-c-location').value.trim();
ref.pages=document.getElementById('f-c-pages').value.trim();
}else if(currentType==='thesis'){
ref.authors=document.getElementById('f-t-authors').value.trim();
ref.title=document.getElementById('f-t-title').value.trim();
ref.school=document.getElementById('f-t-school').value.trim();
ref.year=document.getElementById('f-t-year').value.trim();
ref.level=document.getElementById('f-t-type').value;
}else if(currentType==='web'){
ref.authors=document.getElementById('f-w-authors').value.trim();
ref.title=document.getElementById('f-w-title').value.trim();
ref.site=document.getElementById('f-w-site').value.trim();
ref.url=document.getElementById('f-w-url').value.trim();
ref.date=document.getElementById('f-w-date').value.trim();
}else if(currentType==='patent'){
ref.inventors=document.getElementById('f-p-inventors').value.trim();
ref.title=document.getElementById('f-p-title').value.trim();
ref.number=document.getElementById('f-p-number').value.trim();
ref.year=document.getElementById('f-p-year').value.trim();
}
if(!ref.title){alert('请至少填写标题');return}
refs.push(ref);save();clearForm();showView('list');
}

function clearForm(){
document.querySelectorAll('input[type=text]').forEach(i=>i.value='');
}

function renderList(){
const el=document.getElementById('ref-list');
if(!refs.length){el.innerHTML='<div class="empty">暂无参考文献，点击"+ 添加文献"开始</div>';return}
const typeNames={article:'📄 论文',book:'📕 图书',conference:'🎤 会议',thesis:'🎓 学位',web:'🌐 网页',patent:'📜 专利'};
el.innerHTML=refs.map((r,i)=>`<div class="ref-item"><div class="ref-actions"><button onclick="editRef(${i})">编辑</button><button class="dng" onclick="deleteRef(${i})">删除</button></div><span class="badge">${typeNames[r.type]||r.type}</span><div class="ref-text">${formatRef(r)}</div></div>`).join('');
}

function deleteRef(i){if(!confirm('删除此文献？'))return;refs.splice(i,1);save();renderList()}
function editRef(i){
const r=refs[i];
setRefType(r.type);
if(r.type==='article'){document.getElementById('f-authors').value=r.authors||'';document.getElementById('f-title').value=r.title||'';document.getElementById('f-journal').value=r.journal||'';document.getElementById('f-year').value=r.year||'';document.getElementById('f-volume').value=r.volume||'';document.getElementById('f-pages').value=r.pages||''}
else if(r.type==='book'){document.getElementById('f-b-authors').value=r.authors||'';document.getElementById('f-b-title').value=r.title||'';document.getElementById('f-b-publisher').value=r.publisher||'';document.getElementById('f-b-year').value=r.year||'';document.getElementById('f-b-edition').value=r.edition||''}
refs.splice(i,1);save();showView('add');
}

function formatRef(r,fmt){
fmt=fmt||currentFormat;
if(fmt==='gb7714')return formatGB7714(r);
if(fmt==='apa')return formatAPA(r);
if(fmt==='mla')return formatMLA(r);
if(fmt==='chicago')return formatChicago(r);
return formatGB7714(r);
}

function formatGB7714(r){
if(r.type==='article')return`[${r.authors||'佚名'}]. ${r.title}[J]. ${r.journal}, ${r.year}${r.volume?' '+r.volume:''}${r.pages?', '+r.pages:''}.`;
if(r.type==='book')return`[${r.authors||'佚名'}]. ${r.title}[M]. ${r.publisher}, ${r.year}${r.edition?','+r.edition:''}.`;
if(r.type==='conference')return`[${r.authors||'佚名'}]. ${r.title}[C]//${r.conference}. ${r.location||''}: ${r.year}${r.pages?','+r.pages:''}.`;
if(r.type==='thesis')return`[${r.authors||'佚名'}]. ${r.title}[D]. ${r.school}, ${r.year}.`;
if(r.type==='web')return`${r.authors?'['+r.authors+']. ':''}${r.title}[EB/OL]. ${r.site||''}, ${r.date||r.year}. ${r.url}.`;
if(r.type==='patent')return`${r.inventors||'佚名'}. ${r.title}: ${r.number}[P]. ${r.year}.`;
return r.title;
}

function formatAPA(r){
const a=r.authors||'Unknown';
if(r.type==='article')return`${a} (${r.year}). ${r.title}. ${r.journal}${r.volume?', '+r.volume:''}${r.pages?', '+r.pages:''}.`;
if(r.type==='book')return`${a} (${r.year}). ${r.title}. ${r.publisher}.`;
if(r.type==='conference')return`${a} (${r.year}). ${r.title}. Paper presented at ${r.conference}, ${r.location||''}.`;
if(r.type==='thesis')return`${a} (${r.year}). ${r.title} [Doctoral dissertation/Master's thesis, ${r.school}].`;
if(r.type==='web')return`${a||r.site} (${r.year}). ${r.title}. ${r.url}`;
return r.title;
}

function formatMLA(r){
const a=r.authors||'Unknown';
if(r.type==='article')return`${a}. "${r.title}." ${r.journal}, vol. ${r.volume||'n.d.'}, ${r.year}, pp. ${r.pages||'n.p.'}.`;
if(r.type==='book')return`${a}. ${r.title}. ${r.publisher}, ${r.year}.`;
if(r.type==='web')return`${a||r.site}. "${r.title}." ${r.site||''}, ${r.date||r.year}, ${r.url}.`;
return r.title;
}

function formatChicago(r){
const a=r.authors||'Unknown';
if(r.type==='article')return`${a}. "${r.title}." ${r.journal} ${r.volume||''} (${r.year}): ${r.pages||''}.`;
if(r.type==='book')return`${a}. ${r.title}. ${r.publisher}, ${r.year}.`;
if(r.type==='web')return`${a||r.site}. "${r.title}." Accessed ${r.date||r.year}. ${r.url}.`;
return r.title;
}

function renderOutput(){
const el=document.getElementById('output-box');
if(!refs.length){el.innerHTML='<div style="color:var(--text2);text-align:center;padding:40px">暂无文献可生成</div>';return}
el.textContent=refs.map((r,i)=>`${i+1}. ${formatRef(r)}`).join('\n');
}

function copyOutput(){
const text=document.getElementById('output-box').textContent;
navigator.clipboard.writeText(text).then(()=>alert('已复制到剪贴板！'));
}

function exportRefs(){const blob=new Blob([JSON.stringify(refs,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='references.json';a.click()}
function importRefs(){document.getElementById('import-input').value='';document.getElementById('import-modal').classList.remove('hidden')}
function confirmImport(){try{const d=JSON.parse(document.getElementById('import-input').value);if(Array.isArray(d)){refs=d;save();closeModal('import-modal');showView('list')}}catch(e){alert('导入格式错误')}}
function closeModal(id){document.getElementById(id).classList.add('hidden')}

function loadDemo(){
refs=[
{type:'article',id:1,authors:'张三, 李四',title:'基于深度学习的图像识别方法研究',journal:'计算机学报',year:'2024',volume:'47(3)',pages:'512-525'},
{type:'book',id:2,authors:'王五',title:'机器学习实战',publisher:'清华大学出版社',year:'2023',edition:'第3版'},
{type:'conference',id:3,authors:'赵六, 钱七',title:'自然语言处理新进展',conference:'全国计算语言学学术会议',year:'2024',location:'北京',pages:'88-95'},
{type:'web',id:4,authors:'',title:'PyTorch官方文档',site:'PyTorch',year:'2024',url:'https://pytorch.org/docs/',date:'2024-06-01'}
];save();
}

load();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
