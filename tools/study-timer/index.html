<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⏱️ 学习计时器</title>
<meta property="og:title" content="⏱️ 学习计时器">
<meta property="og:description" content="⏱️ 学习计时器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="学习计时器 - 番茄钟专注学习，支持自定义时长、统计和白噪音">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3b82f6;--green:#238636;--red:#ef4444;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:600px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,button{font-family:inherit;font-size:.95rem}
input[type=number]{width:80px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;text-align:center}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.timer-display{font-size:4rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:4px;margin:20px 0}
.timer-display.running{color:var(--accent)}
.timer-display.paused{color:var(--warn)}
.timer-display.done{color:var(--success)}
.progress-bar{width:100%;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin:12px 0}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;transition:width .5s linear}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}
.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.labels{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.labels span{padding:4px 12px;border-radius:16px;font-size:.8rem;cursor:pointer;background:var(--bg);border:1px solid var(--border);color:var(--text2);transition:all .2s}
.labels span.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.hidden{display:none}
.noise-btn{display:inline-block;padding:6px 12px;border-radius:8px;margin:4px;cursor:pointer;background:var(--bg);border:1px solid var(--border);color:var(--text);transition:all .2s;font-size:.85rem}
.noise-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>⏱️ 学习计时器</h1><p>番茄钟专注学习，高效管理时间</p></div>

<div class="cd">
<h2>计时设置</h2>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
<div><label style="margin-top:0">专注（分钟）</label><input type="number" id="focusMin" value="25" min="1" max="120"></div>
<div><label style="margin-top:0">休息（分钟）</label><input type="number" id="breakMin" value="5" min="1" max="30"></div>
<div><label style="margin-top:0">长休息（分钟）</label><input type="number" id="longBreakMin" value="15" min="1" max="60"></div>
</div>
<div class="labels" id="presets" style="margin-top:12px">
<span onclick="setPreset(25,5,15)">标准 25/5</span>
<span onclick="setPreset(50,10,20)">深度 50/10</span>
<span onclick="setPreset(15,3,10)">短冲刺 15/3</span>
<span onclick="setPreset(90,15,30)">长专注 90/15</span>
</div>
</div>

<div class="cd" style="text-align:center">
<div class="timer-display running" id="timerDisplay">25:00</div>
<div class="progress-bar"><div class="fill" id="timerProgress" style="width:100%"></div></div>
<p style="color:var(--text2);margin-bottom:12px" id="timerLabel">准备开始</p>
<div class="bg" style="justify-content:center">
<button id="startBtn" onclick="toggleTimer()">▶ 开始</button>
<button class="sec" onclick="resetTimer()">↺ 重置</button>
<button class="sec" onclick="skipPhase()">⏭ 跳过</button>
</div>
</div>

<div class="cd">
<h2>白噪音</h2>
<div id="noiseList">
<span class="noise-btn" onclick="toggleNoise('rain')">🌧 雨声</span>
<span class="noise-btn" onclick="toggleNoise('forest')">🌲 森林</span>
<span class="noise-btn" onclick="toggleNoise('ocean')">🌊 海浪</span>
<span class="noise-btn" onclick="toggleNoise('fire')">🔥 篝火</span>
<span class="noise-btn" onclick="toggleNoise('wind')">💨 微风</span>
<span class="noise-btn" onclick="toggleNoise('birds')">🐦 鸟鸣</span>
</div>
<p style="font-size:.75rem;color:var(--text2);margin-top:8px">提示：点击切换白噪音（使用Web Audio API生成）</p>
</div>

<div class="cd">
<h2>今日统计</h2>
<div class="gr">
<div class="st"><div class="nm" id="todaySessions">0</div><div class="lb">完成次数</div></div>
<div class="st"><div class="nm" id="todayMinutes">0</div><div class="lb">专注分钟</div></div>
<div class="st"><div class="nm" id="todayStreak">0</div><div class="lb">连续天数</div></div>
<div class="st"><div class="nm" id="totalSessions">0</div><div class="lb">总次数</div></div>
</div>
</div>
</div>

<script>
let timerState='idle',totalSeconds=25*60,remaining=25*60,timerInterval=null,phase='focus',pomodoroCount=0;
let audioCtx=null,noiseNode=null,currentNoise=null;
function $(id){return document.getElementById(id)}

function loadStats(){try{return JSON.parse(localStorage.getItem('study-timer-stats'))}catch(e){return null}}
function saveStats(s){localStorage.setItem('study-timer-stats',JSON.stringify(s))}
function getToday(){return new Date().toISOString().slice(0,10)}
function ensureStats(){let s=loadStats();if(!s||s.date!==getToday()){s={date:getToday(),sessions:0,minutes:0,streak:s?s.streak:0,lastDate:s?s.lastDate:''};if(s.lastDate!==getToday()){const d=new Date(s.lastDate);const diff=(new Date(getToday())-d)/(86400000);s.streak=diff===1?s.streak:0}}return s}

function setPreset(f,b,l){$('focusMin').value=f;$('breakMin').value=b;$('longBreakMin').value=l;resetTimer()}

function toggleTimer(){
  if(timerState==='running'){timerState='paused';clearInterval(timerInterval);$('startBtn').textContent='▶ 继续';$('timerDisplay').className='timer-display paused'}
  else{timerState='running';timerInterval=setInterval(tick,1000);$('startBtn').textContent='⏸ 暂停';$('timerDisplay').className='timer-display running'}
}

function tick(){
  remaining--;
  if(remaining<=0){playAlarm();phaseComplete();return}
  updateDisplay();
}

function updateDisplay(){
  const m=Math.floor(remaining/60),s=remaining%60;
  $('timerDisplay').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  $('timerProgress').style.width=(remaining/totalSeconds*100)+'%';
}

function phaseComplete(){
  clearInterval(timerInterval);timerState='idle';
  if(phase==='focus'){
    pomodoroCount++;const s=ensureStats();s.sessions++;s.minutes+=parseInt($('focusMin').value);s.lastDate=getToday();if(s.sessions>0)s.streak=Math.max(s.streak,1);saveStats(s);updateStats();
    $('timerLabel').textContent='专注完成！休息一下';
    $('timerDisplay').className='timer-display done';$('startBtn').textContent='▶ 开始';
    phase=pomodoroCount%4===0?'longBreak':'break';
    totalSeconds=(phase==='longBreak'?parseInt($('longBreakMin').value):parseInt($('breakMin').value))*60;
  } else {
    $('timerLabel').textContent='休息结束，继续专注！';
    $('timerDisplay').className='timer-display done';$('startBtn').textContent='▶ 开始';
    phase='focus';totalSeconds=parseInt($('focusMin').value)*60;
  }
  remaining=totalSeconds;updateDisplay();
}

function resetTimer(){clearInterval(timerInterval);timerState='idle';phase='focus';totalSeconds=parseInt($('focusMin').value)*60;remaining=totalSeconds;updateDisplay();$('startBtn').textContent='▶ 开始';$('timerDisplay').className='timer-display running';$('timerLabel').textContent='准备开始'}
function skipPhase(){clearInterval(timerInterval);timerState='idle';phaseComplete();remaining=totalSeconds;updateDisplay()}

function playAlarm(){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=800;g.gain.value=0.3;o.start();o.stop(ctx.currentTime+0.5);setTimeout(()=>{const o2=ctx.createOscillator();const g2=ctx.createGain();o2.connect(g2);g2.connect(ctx.destination);o2.frequency.value=1000;g2.gain.value=0.3;o2.start();o2.stop(ctx.currentTime+0.5)},600)}catch(e){}
}

function toggleNoise(type){
  if(currentNoise===type){stopNoise();return}
  stopNoise();currentNoise=type;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(type==='rain'||type==='fire'){const bufSize=2*audioCtx.sampleRate;const buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);const data=buf.getChannelData(0);for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1)*(type==='fire'?.6:.4);const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;const f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.value=type==='fire'?300:2000;const g=audioCtx.createGain();g.gain.value=0.15;src.connect(f);f.connect(g);g.connect(audioCtx.destination);src.start();noiseNode={source:src,gain:g}}
    else{const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type='sine';osc.frequency.value=type==='ocean'?60:type==='wind'?100:type==='forest'?200:300;g.gain.value=0.05;const f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.value=type==='ocean'?200:800;osc.connect(f);f.connect(g);g.connect(audioCtx.destination);osc.start();noiseNode={source:osc,gain:g}}
    document.querySelectorAll('.noise-btn').forEach(b=>{b.classList.toggle('active',b.textContent.includes({rain:'雨',forest:'森',ocean:'海',fire:'篝',wind:'微',birds:'鸟'}[type]))});
  }catch(e){}
}

function stopNoise(){if(noiseNode){try{noiseNode.source.stop()}catch(e){}noiseNode=null}currentNoise=null;if(audioCtx){audioCtx.close();audioCtx=null}document.querySelectorAll('.noise-btn').forEach(b=>b.classList.remove('active'))}

function updateStats(){const s=ensureStats();$('todaySessions').textContent=s.sessions;$('todayMinutes').textContent=s.minutes;$('todayStreak').textContent=s.streak;const all=loadStats();$('totalSessions').textContent=all?all.totalSessions||0:0}

resetTimer();updateStats();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
