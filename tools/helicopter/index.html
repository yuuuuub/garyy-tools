<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚁 直升机</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;flex-direction:column}
h1{font-size:1.3rem;margin-bottom:4px}
.info{font-size:.9rem;color:#8b949e;margin-bottom:8px}
canvas{border:2px solid var(--border);border-radius:4px;touch-action:none}
.hint{font-size:.8rem;color:#8b949e;margin-top:8px}
</style>
</head>
<body>
<h1>🚁 直升机</h1>
<div class="info">距离 <b id="dist">0</b>m | 最远 <b id="best">0</b>m</div>
<canvas id="game" width="400" height="500"></canvas>
<div class="hint">按住/点击屏幕上升 | 松手下降</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=400,H=500;
let heli={x:80,y:H/2,vy:0,rot:0};
let pipes=[],dist=0,best=0,gameOver=false,started=false,ground=0;
let keys={space:false};

function init(){
heli={x:80,y:H/2,vy:0,rot:0};
pipes=[];dist=0;gameOver=false;started=false;ground=0;
}

function addPipe(){
const gap=140-Math.min(dist/20,50);
const top=Math.random()*(H-200)+50;
pipes.push({x:W,top,bot:top+gap,scored:false});
}

function update(){
if(gameOver||!started)return;
// gravity
heli.vy+=0.25;
if(keys.space)heli.vy-=0.5;
heli.vy=Math.max(-5,Math.min(heli.vy,5));
heli.y+=heli.vy;
heli.rot=heli.vy*3;

// ground
ground-=2;
if(heli.y>H-30){heli.y=H-30;gameOver=true;best=Math.max(best,Math.floor(dist))}
if(heli.y<10){heli.y=10;heli.vy=0}

// pipes
if(pipes.length===0||pipes[pipes.length-1].x<W-200)addPipe();
pipes.forEach(p=>{
p.x-=2;
if(!p.scored&&p.x+30<heli.x){p.scored=true;dist++;document.getElementById('dist').textContent=Math.floor(dist)}
});
pipes=pipes.filter(p=>p.x>-60);

// collision
pipes.forEach(p=>{
const hx=heli.x,hy=heli.y;
if(hx+15>p.x&&hx-15<p.x+40){
if(hy-12<p.top||hy+12>p.bot){gameOver=true;best=Math.max(best,Math.floor(dist));document.getElementById('best').textContent=best}
});
}

function draw(){
ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
// stars
for(let i=0;i<30;i++){
ctx.fillStyle='rgba(255,255,255,'+(0.3+Math.sin(Date.now()/1000+i)*0.2)+')';
ctx.fillRect((i*137+ground*0.1)%W,(i*97)%H,2,2);
}
// ground
ctx.fillStyle='#2d5016';ctx.fillRect(0,H-30,W,30);
// pipes
pipes.forEach(p=>{
ctx.fillStyle='#27ae60';
ctx.fillRect(p.x,0,40,p.top);
ctx.fillRect(p.x,p.bot,40,H-p.bot-30);
ctx.strokeStyle='#1e8449';ctx.lineWidth=2;
ctx.strokeRect(p.x,0,40,p.top);
ctx.strokeRect(p.x,p.bot,40,H-p.bot-30);
});
// helicopter
const hx=heli.x,hy=heli.y;
ctx.save();ctx.translate(hx,hy);ctx.rotate(heli.rot*Math.PI/180);
// body
ctx.fillStyle='#3498db';
ctx.beginPath();ctx.ellipse(0,0,18,10,0,0,Math.PI*2);ctx.fill();
// tail
ctx.fillStyle='#2980b9';
ctx.fillRect(-25,-3,15,6);
// blades
ctx.fillStyle='#ecf0f1';
const bladeAngle=Date.now()/30;
ctx.save();ctx.rotate(bladeAngle);
ctx.fillRect(-20,-2,40,4);
ctx.restore();
ctx.restore();

if(!started){
ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.textAlign='center';
ctx.fillText('🚁 直升机',W/2,H/2-40);
ctx.font='16px sans-serif';ctx.fillText('按住屏幕上升，松手下降',W/2,H/2);
ctx.fillText('点击开始',W/2,H/2+40);
}
if(gameOver){
ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.textAlign='center';
ctx.fillText('游戏结束',W/2,H/2-30);
ctx.font='18px sans-serif';ctx.fillText('距离: '+Math.floor(dist)+'m',W/2,H/2+10);
ctx.fillText('点击重新开始',W/2,H/2+40);
}
}

function gameLoop(){update();draw();requestAnimationFrame(gameLoop)}

canvas.addEventListener('mousedown',()=>{if(!started){started=true}keys.space=true});
canvas.addEventListener('mouseup',()=>{keys.space=false});
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(!started)started=true;keys.space=true});
canvas.addEventListener('touchend',()=>{keys.space=false});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!started)started=true;keys.space=true}});
document.addEventListener('keyup',e=>{if(e.code==='Space')keys.space=false});
canvas.addEventListener('click',()=>{if(gameOver)init()});

init();gameLoop();
</script>
</body>
</html>
