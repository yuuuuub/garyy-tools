<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟Pro</title>
<meta name="description" content="番茄钟Pro，支持自定义工作/休息时长、统计分析、白噪音和任务关联">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#e74c3c;--accent2:#ff6b6b;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#cf222e;--accent2:#cf222e;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:800px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-purple{background:var(--purple)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:#58a6ff}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.badge-purple{background:rgba(168,85,247,.2);color:var(--purple)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.timer-circle{width:250px;height:250px;border-radius:50%;border:8px solid var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto 20px;position:relative}
.timer-circle svg{position:absolute;top:-8px;left:-8px;width:266px;height:266px;transform:rotate(-90deg)}
.timer-circle circle{fill:none;stroke-width:8;stroke-linecap:round}
.timer-circle .bg{stroke:var(--border)}
.timer-circle .fg{stroke:var(--accent);transition:stroke-dashoffset .5s linear}
.timer-time{font-size:3.5rem;font-weight:700;font-family:'Courier New',monospace;color:var(--accent)}
.timer-label{font-size:1rem;color:var(--text2)}
.session-dots{display:flex;gap:8px;justify-content:center;margin:16px 0}
.session-dot{width:12px;height:12px;border-radius:50%;background:var(--border)}
.session-dot.done{background:var(--green)}
.session-dot.active{background:var(--accent);animation:pulse 1s infinite}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.timer-circle{width:200px;height:200px}.timer-circle svg{width:216px;height:216px}.timer-time{font-size:2.5rem}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="番茄钟Pro">
<meta property="og:description" content="番茄钟Pro，支持自定义工作/休息时长、统计分析、白噪音和任务关联">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/pomodoro-pro-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🍅 番茄钟Pro';
const APP=document.getElementById('app');
let settings=JSON.parse(localStorage.getItem('pom_settings')||'{"workMin":25,"shortMin":5,"longMin":15,"sessionsBeforeLong":4}');
let stats=JSON.parse(localStorage.getItem('pom_stats')||'[]');
let tasks=JSON.parse(localStorage.getItem('pom_tasks')||'[]');
let mode='work';
let running=false;
let remainingMs=0;
let totalMs=0;
let completedSessions=0;
let currentSession=0;
let animFrame=null;
let currentTask='';
let noiseType='none';

const noises=['无','雨声','咖啡馆','白噪音','海浪','鸟鸣'];

function save(){localStorage.setItem('pom_settings',JSON.stringify(settings));localStorage.setItem('pom_stats',JSON.stringify(stats));localStorage.setItem('pom_tasks',JSON.stringify(tasks))}

function getTotalMs(){
  if(mode==='work') return settings.workMin*60000;
  if(mode==='short') return settings.shortMin*60000;
  return settings.longMin*60000;
}

function startSession(){
  mode='work';
  totalMs=getTotalMs();
  remainingMs=totalMs;
  currentSession++;
  running=true;
  tick();
  render();
}

function tick(){
  if(!running) return;
  remainingMs-=1000;
  if(remainingMs<=0){
    remainingMs=0;
    running=false;
    playChime();
    if(mode==='work'){
      completedSessions++;
      stats.push({date:new Date().toISOString().slice(0,10),minutes:settings.workMin,task:currentTask});
      save();
      if(currentSession%settings.sessionsBeforeLong===0){
        mode='long';
      } else {
        mode='short';
      }
    } else {
      mode='work';
    }
    totalMs=getTotalMs();
    remainingMs=totalMs;
    render();
    return;
  }
  updateDisplay();
  animFrame=setTimeout(tick,1000);
}

function updateDisplay(){
  let m=Math.floor(remainingMs/60000);
  let s=Math.floor((remainingMs%60000)/1000);
  let timeEl=document.getElementById('timerTime');
  let labelEl=document.getElementById('timerLabel');
  if(timeEl) timeEl.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(labelEl) labelEl.textContent=mode==='work'?'专注工作':mode==='short'?'短休息':'长休息';
  let circle=document.getElementById('timerFg');
  if(circle){
    let circumference=2*Math.PI*125;
    let progress=(totalMs-remainingMs)/totalMs;
    circle.style.strokeDashoffset=circumference*(1-progress);
  }
}

function toggleTimer(){
  if(running){running=false;clearTimeout(animFrame)}
  else{running=true;tick()}
  render();
}

function resetTimer(){
  running=false;clearTimeout(animFrame);
  totalMs=getTotalMs();remainingMs=totalMs;
  mode='work';
  render();
}

function skipSession(){
  running=false;clearTimeout(animFrame);
  if(mode==='work'){mode='short';currentSession++}
  else mode='work';
  totalMs=getTotalMs();remainingMs=totalMs;
  render();
}

function playChime(){
  try{
    let ctx=new(window.AudioContext||window.webkitAudioContext)();
    let notes=[523.25,659.25,783.99];
    notes.forEach((f,i)=>{
      let osc=ctx.createOscillator();
      let gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=f;gain.gain.value=0.2;
      osc.start(ctx.currentTime+i*0.2);
      osc.stop(ctx.currentTime+i*0.2+0.3);
    });
    setTimeout(()=>ctx.close(),1000);
  }catch(e){}
  garyyToast(mode==='work'?'🍅 番茄完成！休息一下':'⏰ 休息结束，继续工作！');
}

function render(){
  let m=Math.floor(remainingMs/60000);
  let s=Math.floor((remainingMs%60000)/1000);
  let circumference=2*Math.PI*125;
  let progress=totalMs>0?(totalMs-remainingMs)/totalMs:0;
  let modeLabel=mode==='work'?'专注工作':mode==='short'?'短休息':'长休息';
  let modeColor=mode==='work'?'var(--accent)':mode==='short'?'var(--green)':'var(--purple)';

  let h=`<h1>🍅 番茄钟Pro</h1><p class="subtitle">自定义时长 · 统计分析 · 白噪音 · 任务关联</p>`;

  h+=`<div class="card" style="text-align:center">
    <div class="timer-circle" style="border-color:${modeColor}">
      <svg viewBox="0 0 266 266">
        <circle class="bg" cx="133" cy="133" r="125"/>
        <circle id="timerFg" class="fg" cx="133" cy="133" r="125" stroke="${modeColor}" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference*(1-progress)}"/>
      </svg>
      <div id="timerTime" class="timer-time" style="color:${modeColor}">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div>
      <div id="timerLabel" class="timer-label">${modeLabel}</div>
    </div>
    <div class="session-dots">`;
  for(let i=0;i<settings.sessionsBeforeLong;i++){
    let cls=i<currentSession%settings.sessionsBeforeLong?'done':i===currentSession%settings.sessionsBeforeLong&&running&&mode==='work'?'active':'';
    h+=`<div class="session-dot ${cls}"></div>`;
  }
  h+=`</div>
    <div class="flex" style="justify-content:center">
      <button class="btn" onclick="toggleTimer()" style="background:${modeColor}">${running?'暂停':'开始'}</button>
      <button class="btn btn-sm" style="background:var(--border);color:var(--text)" onclick="resetTimer()">重置</button>
      <button class="btn btn-sm btn-purple" onclick="skipSession()">跳过</button>
    </div>
  </div>`;

  h+=`<div class="card"><b>当前任务</b><input id="taskInput" value="${currentTask}" placeholder="输入当前专注的任务..." onchange="currentTask=this.value;save()"></div>`;

  let today=stats.filter(s=>s.date===new Date().toISOString().slice(0,10));
  let totalToday=today.reduce((s,p)=>s+p.minutes,0);
  let totalAll=stats.length;
  h+=`<div class="card"><b>今日统计</b><div style="display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:12px">
    <div><div style="font-size:1.8rem;font-weight:700;color:var(--accent)">${today.length}</div><div style="font-size:.8rem;color:var(--text2)">今日番茄</div></div>
    <div><div style="font-size:1.8rem;font-weight:700;color:var(--green)">${totalToday}分</div><div style="font-size:.8rem;color:var(--text2)">专注时长</div></div>
    <div><div style="font-size:1.8rem;font-weight:700;color:var(--purple)">${totalAll}</div><div style="font-size:.8rem;color:var(--text2)">累计番茄</div></div>
  </div></div>`;

  h+=`<div class="card"><div class="flex-between"><b>设置</b></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px">
      <div><label>工作（分钟）</label><input type="number" min="1" max="120" value="${settings.workMin}" onchange="settings.workMin=parseInt(this.value)||25;save()"></div>
      <div><label>短休息（分钟）</label><input type="number" min="1" max="30" value="${settings.shortMin}" onchange="settings.shortMin=parseInt(this.value)||5;save()"></div>
      <div><label>长休息（分钟）</label><input type="number" min="1" max="60" value="${settings.longMin}" onchange="settings.longMin=parseInt(this.value)||15;save()"></div>
    </div>
    <div style="margin-top:8px"><label>几个番茄后长休息</label><input type="number" min="2" max="10" value="${settings.sessionsBeforeLong}" onchange="settings.sessionsBeforeLong=parseInt(this.value)||4;save()" style="width:120px"></div>
  </div>`;

  if(stats.length){
    let byDate={};
    stats.forEach(s=>{byDate[s.date]=(byDate[s.date]||0)+s.minutes});
    let dates=Object.keys(byDate).sort().slice(-7);
    h+=`<div class="card"><b>近7天专注时长</b><div style="display:flex;align-items:end;gap:8px;height:120px;margin-top:12px">`;
    let maxMin=Math.max(...dates.map(d=>byDate[d]),1);
    dates.forEach(d=>{
      let min=byDate[d];
      let pct=(min/maxMin)*100;
      h+=`<div style="flex:1;text-align:center"><div style="background:var(--accent);height:${pct}%;border-radius:4px 4px 0 0;min-height:4px"></div><div style="font-size:.7rem;color:var(--text2);margin-top:4px">${d.slice(5)}</div></div>`;
    });
    h+=`</div></div>`;
  }

  APP.innerHTML=h;
}

remainingMs=getTotalMs();totalMs=getTotalMs();
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
