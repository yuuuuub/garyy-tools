<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人民币大写转换</title><meta name="description" content="人民币大写转换 - 数字金额转中文大写"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:600px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}input[type=text],input[type=number]{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;outline:none;font-family:inherit}input:focus{border-color:var(--blue)}.result-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:20px;text-align:center;margin-top:16px;min-height:60px;display:flex;align-items:center;justify-content:center}.result-text{font-size:1.2rem;font-weight:600;color:var(--green);letter-spacing:2px;line-height:1.8}.quick-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quick-btn{padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.82rem}.quick-btn:hover{border-color:var(--blue);color:var(--text)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta property="og:title" content="人民币大写转换">
  <meta property="og:description" content="人民币大写转换 - Gary's Tools">
  <meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="robots" content="index, follow">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>💰 人民币大写转换</h1><p class="sub">数字金额 → 中文大写（壹贰叁...）</p>
<div class="card">
<input type="text" id="amount" placeholder="输入数字金额，如 12345.67" oninput="convert()">
<div class="quick-btns">
<button class="quick-btn" onclick="document.getElementById('amount').value='100';convert()">¥100</button>
<button class="quick-btn" onclick="document.getElementById('amount').value='1234.56';convert()">¥1,234.56</button>
<button class="quick-btn" onclick="document.getElementById('amount').value='10000';convert()">¥10,000</button>
<button class="quick-btn" onclick="document.getElementById('amount').value='123456789.01';convert()">¥1.23亿</button>
</div>
<div class="result-box"><div class="result-text" id="result">请输入金额</div></div>
</div>
<div class="card"><h3 style="font-size:.95rem;margin-bottom:8px">📖 大写对照</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.82rem;color:var(--text2)">
<span>0 → 零</span><span>5 → 伍</span>
<span>1 → 壹</span><span>6 → 陆</span>
<span>2 → 贰</span><span>7 → 柒</span>
<span>3 → 叁</span><span>8 → 捌</span>
<span>4 → 肆</span><span>9 → 玖</span>
<span>角 → 角</span><span>分 → 分</span>
<span>元 → 元</span><span>整 → 整</span>
</div></div></div>
<script src="../i18n.js" defer></script>
<script>
var CN=['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
var UNITS=['','拾','佰','仟'];
var BIG_UNITS=['','万','亿','万亿'];
function convert(){
  var v=document.getElementById('amount').value.replace(/[,，¥￥\s]/g,'');
  var r=document.getElementById('result');
  if(!v||isNaN(v)){r.textContent='请输入有效金额';r.style.color='var(--text2)';return;}
  var n=parseFloat(v);
  if(n<0){r.textContent='不支持负数';r.style.color='var(--red)';return;}
  if(n>99999999999999){r.textContent='超出转换范围';r.style.color='var(--red)';return;}
  var result=toChinese(n);
  r.textContent='人民币'+result;
  r.style.color='var(--green)';
}
function toChinese(n){
  if(n===0) return '零元整';
  var s=n.toFixed(2);
  var parts=s.split('.');
  var intPart=parseInt(parts[0]);
  var decPart=parts[1];
  var result='';
  if(intPart>0){
    result=convertInt(intPart)+'元';
  }
  var jiao=parseInt(decPart[0]);
  var fen=parseInt(decPart[1]);
  if(jiao===0&&fen===0){
    result+='整';
  }else{
    if(jiao>0) result+=CN[jiao]+'角';
    else if(intPart>0) result+='零';
    if(fen>0) result+=CN[fen]+'分';
  }
  return result;
}
function convertInt(n){
  var s=String(n);
  var len=s.length;
  var result='';
  var zeroFlag=false;
  for(var i=0;i<len;i++){
    var d=parseInt(s[i]);
    var pos=len-i-1;
    var unitIdx=pos%4;
    var bigIdx=Math.floor(pos/4);
    if(d===0){
      zeroFlag=true;
      if(unitIdx===0&&bigIdx>0){
        result+=BIG_UNITS[bigIdx];
        zeroFlag=false;
      }
    }else{
      if(zeroFlag){result+='零';zeroFlag=false;}
      result+=CN[d]+UNITS[unitIdx];
      if(unitIdx===0&&bigIdx>0) result+=BIG_UNITS[bigIdx];
    }
  }
  return result;
}
convert();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
