<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASCAR赛车</title>
    <meta name="description" content="NASCAR赛车游戏，体验美国纳斯卡赛车文化">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #3b82f6;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            color: #3b82f6;
        }
        .controls {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 18px;
        }
        canvas {
            border: 2px solid var(--border);
            border-radius: 8px;
            background: #1a1e24;
            max-width: 100%;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .message {
            margin-top: 15px;
            font-size: 16px;
            color: #8b949e;
        }
    </style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
    <h1>🏁 NASCAR赛车</h1>
    <div class="controls">
        <div class="info">
            <span>圈数: <span id="laps">0</span>/10</span>
            <span>位置: <span id="position">8th</span></span>
            <span>超车: <span id="overtakes">0</span></span>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div style="margin-top: 10px;">
            <button class="btn" onclick="startGame()">开始比赛</button>
            <button class="btn" onclick="resetGame()">重新开始</button>
        </div>
        <div class="message">方向键/WASD控制，椭圆赛道，完成10圈比赛！</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lapsEl = document.getElementById('laps');
        const positionEl = document.getElementById('position');
        const overtakesEl = document.getElementById('overtakes');
        
        let gameRunning = false;
        let laps = 0;
        let overtakes = 0;
        let lastTime = 0;
        let car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30 };
        let keys = {};
        let opponents = [];
        let checkpoints = [0, 0, 0, 0];
        let lastCheckpoint = -1;
        
        // NASCAR椭圆赛道
        const track = [
            { x: 400, y: 500, type: 'start' },
            { x: 400, y: 400, type: 'straight' },
            { x: 400, y: 300, type: 'straight' },
            { x: 300, y: 200, type: 'curve' },
            { x: 200, y: 150, type: 'straight' },
            { x: 200, y: 100, type: 'straight' },
            { x: 300, y: 50, type: 'curve' },
            { x: 500, y: 50, type: 'straight' },
            { x: 600, y: 100, type: 'curve' },
            { x: 600, y: 200, type: 'straight' },
            { x: 600, y: 300, type: 'straight' },
            { x: 500, y: 400, type: 'curve' },
            { x: 400, y: 500, type: 'finish' }
        ];
        
        // 初始化对手
        function initOpponents() {
            opponents = [];
            for (let i = 0; i < 7; i++) {
                opponents.push({
                    x: 350 + (i % 3) * 50,
                    y: 450 + Math.floor(i / 3) * 60,
                    angle: 0,
                    speed: 2 + Math.random() * 2,
                    width: 20,
                    height: 30,
                    color: ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff922b', '#a855f7', '#ec4899'][i],
                    overtaken: false
                });
            }
        }
        
        function drawTrack() {
            // 椭圆赛道
            ctx.strokeStyle = '#30363d';
            ctx.lineWidth = 80;
            ctx.beginPath();
            ctx.ellipse(400, 300, 300, 200, 0, 0, Math.PI * 2);
            ctx.stroke();
            
            // 赛道边线
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.ellipse(400, 300, 300, 200, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 起点线
            ctx.strokeStyle = '#ff6b6b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(400, 100);
            ctx.lineTo(400, 500);
            ctx.stroke();
        }
        
        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // NASCAR车身
            ctx.fillStyle = #3b82f6;
            ctx.fillRect(-car.width/2, -car.height/2, car.width, car.height);
            
            // 车窗
            ctx.fillStyle = '#1a1e24';
            ctx.fillRect(-car.width/2 + 3, -car.height/2 + 3, car.width - 6, car.height/3);
            
            ctx.restore();
        }
        
        function drawOpponents() {
            opponents.forEach(opponent => {
                ctx.save();
                ctx.translate(opponent.x, opponent.y);
                ctx.rotate(opponent.angle);
                
                ctx.fillStyle = opponent.color;
                ctx.fillRect(-opponent.width/2, -opponent.height/2, opponent.width, opponent.height);
                
                ctx.fillStyle = '#1a1e24';
                ctx.fillRect(-opponent.width/2 + 3, -opponent.height/2 + 3, opponent.width - 6, opponent.height/3);
                
                ctx.restore();
            });
        }
        
        function updateCar(deltaTime) {
            if (keys['ArrowUp'] || keys['w']) {
                car.speed = Math.min(car.speed + 0.1, 8);
            } else if (keys['ArrowDown'] || keys['s']) {
                car.speed = Math.max(car.speed - 0.2, -3);
            } else {
                car.speed *= 0.98;
            }
            
            if (keys['ArrowLeft'] || keys['a']) {
                car.angle -= 0.05 * car.speed;
            }
            if (keys['ArrowRight'] || keys['d']) {
                car.angle += 0.05 * car.speed;
            }
            
            car.x += Math.sin(car.angle) * car.speed;
            car.y -= Math.cos(car.angle) * car.speed;
            
            // 边界检查
            car.x = Math.max(20, Math.min(canvas.width - 20, car.x));
            car.y = Math.max(20, Math.min(canvas.height - 20, car.y));
            
            // 更新对手
            opponents.forEach(opponent => {
                opponent.angle += 0.02;
                opponent.x = 400 + Math.cos(opponent.angle) * (250 + opponent.y % 100);
                opponent.y = 300 + Math.sin(opponent.angle) * (150 + opponent.x % 100);
                
                // 超车检测
                if (!opponent.overtaken && car.y < opponent.y - 50) {
                    opponent.overtaken = true;
                    overtakes++;
                    overtakesEl.textContent = overtakes;
                }
            });
            
            // 圈数计算
            if (car.y > 490 && car.y < 510 && car.x > 350 && car.x < 450) {
                if (lastCheckpoint !== 0) {
                    lastCheckpoint = 0;
                    checkpoints[0] = 1;
                }
            }
            
            // 检查是否完成一圈
            if (checkpoints.every(c => c === 1)) {
                laps++;
                lapsEl.textContent = laps;
                checkpoints = [0, 0, 0, 0];
                lastCheckpoint = -1;
                
                if (laps >= 10) {
                    gameOver();
                }
            }
            
            // 更新位置
            const position = 8 - overtakes;
            positionEl.textContent = position + getOrdinal(position);
        }
        
        function getOrdinal(n) {
            const s = ["th", "st", "nd", "rd"];
            const v = n % 100;
            return s[(v - 20) % 10] || s[v] || s[0];
        }
        
        function updateGame(timestamp) {
            if (!gameRunning) return;
            
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            
            updateCar(deltaTime);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();
            drawOpponents();
            drawCar();
            
            requestAnimationFrame(updateGame);
        }
        
        function gameOver() {
            gameRunning = false;
            alert('比赛完成！最终位置: ' + positionEl.textContent + '\n超车: ' + overtakes);
        }
        
        function startGame() {
            if (gameRunning) return;
            
            car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30 };
            laps = 0;
            overtakes = 0;
            
            initOpponents();
            
            lapsEl.textContent = '0';
            positionEl.textContent = '8th';
            overtakesEl.textContent = '0';
            
            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(updateGame);
        }
        
        function resetGame() {
            gameRunning = false;
            car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30 };
            laps = 0;
            overtakes = 0;
            
            initOpponents();
            
            lapsEl.textContent = '0';
            positionEl.textContent = '8th';
            overtakesEl.textContent = '0';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();
            drawCar();
        }
        
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // 初始绘制
        initOpponents();
        drawTrack();
        drawCar();
    </script>
<script src="../i18n.js"></script>
</body>
</html>
