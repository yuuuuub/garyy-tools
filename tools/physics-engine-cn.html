<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚛️ 物理引擎</title>
<meta property="og:title" content="⚛️ 物理引擎">
<meta property="og:description" content="⚛️ 物理引擎 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="物理引擎 - 模拟真实物理运动与碰撞">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚛️</text></svg>">
<script src="i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.hdr{text-align:center;margin-bottom:16px}.hdr h1{font-size:1.6rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.canvas-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
canvas{display:block;width:100%}
.controls{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.controls .row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.controls label{font-size:.8rem;color:var(--text2);min-width:70px}
.controls input[type=range]{flex:1;accent-color:var(--accent)}
.controls .val{font-size:.8rem;color:var(--accent);min-width:50px;text-align:right}
.controls select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;font-size:.8rem}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.85}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{opacity:.85}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.info-bar{display:flex;gap:16px;justify-content:center;color:var(--text2);font-size:.8rem;padding:8px 0;flex-wrap:wrap}
.info-bar span{color:var(--accent);font-weight:600}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.8rem;transition:all .2s}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="hdr"><h1>⚛️ 物理引擎</h1><p>模拟真实物理运动与碰撞 - 弹力、重力、摩擦力</p></div>

<div class="tabs" id="modeTabs">
<button class="active" data-mode="bounce">弹性碰撞</button>
<button data-mode="gravity">重力模拟</button>
<button data-mode="friction">摩擦力</button>
<button data-mode="pendulum">钟摆</button>
</div>

<div class="canvas-wrap"><canvas id="c" width="800" height="500"></canvas></div>

<div class="info-bar">
<span>物体: <b id="objCount">0</b></span>
<span>速度: <b id="avgSpeed">0</b></span>
<span>能量: <b id="energy">0</b></span>
</div>

<div class="btn-row">
<button class="btn btn-primary" id="btnAdd">+ 添加物体</button>
<button class="btn btn-success" id="btnStart">▶ 运行</button>
<button class="btn btn-danger" id="btnReset">↺ 重置</button>
</div>

<div class="controls">
<div class="row"><label>重力</label><input type="range" id="gravity" min="0" max="20" value="10"><span class="val" id="gravityVal">10</span></div>
<div class="row"><label>弹性</label><input type="range" id="bounciness" min="0" max="100" value="80"><span class="val" id="bounceVal">80%</span></div>
<div class="row"><label>摩擦</label><input type="range" id="friction" min="0" max="100" value="10"><span class="val" id="frictionVal">10%</span></div>
<div class="row"><label>大小</label><input type="range" id="ballSize" min="10" max="80" value="25"><span class="val" id="sizeVal">25</span></div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=canvas.width,H=canvas.height,running=false,mode='bounce',animId=null;
let grav=10,bounce=.8,fric=.1,bsize=25;
let balls=[];

const colors=['#3b82f6','#22c55e','#ef4444','#f59e0b','#a855f7','#06b6d4','#ec4899','#84cc16'];

class Ball{
constructor(x,y,vx,vy,r){
this.x=x;this.y=y;this.vx=vx||0;this.vy=vy||0;this.r=r||bsize;
this.color=colors[Math.floor(Math.random()*colors.length)];this.trail=[];
}
update(){
if(mode==='bounce'||mode==='friction'){
this.vy+=grav*.1;this.x+=this.vx;this.y+=this.vy;
if(mode==='friction'){this.vx*=1-fric*.02;this.vy*=1-fric*.02;}
if(this.x+this.r>W){this.x=W-this.r;this.vx*=-bounce;}
if(this.x-this.r<0){this.x=this.r;this.vx*=-bounce;}
if(this.y+this.r>H){this.y=H-this.r;this.vy*=-bounce;this.vx*=1-fric*.01;}
if(this.y-this.r<0){this.y=this.r;this.vy*=-bounce;}
}else if(mode==='gravity'){
this.vy+=grav*.15;this.x+=this.vx;this.y+=this.vy;
if(this.x+this.r>W){this.x=W-this.r;this.vx*=-.5;}
if(this.x-this.r<0){this.x=this.r;this.vx*=-.5;}
if(this.y+this.r>H){this.y=H-this.r;this.vy=0;this.vx*=.99;}
if(this.y-this.r<0){this.y=this.r;this.vy*=-bounce;}
}
this.trail.push({x:this.x,y:this.y});
if(this.trail.length>20)this.trail.shift();
}
draw(){
this.trail.forEach((t,i)=>{
ctx.beginPath();ctx.arc(t.x,t.y,this.r*(i/this.trail.length)*.5,0,Math.PI*2);
ctx.fillStyle=this.color+(Math.floor(i/this.trail.length*40).toString(16).padStart(2,'0'));ctx.fill();
});
ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
ctx.fillStyle=this.color;ctx.fill();
ctx.strokeStyle='rgba(255,255,255,.2)';ctx.stroke();
}
speed(){return Math.sqrt(this.vx*this.vx+this.vy*this.vy)}
}

class Pendulum{
constructor(anchorX,anchorY,len){
this.ax=anchorX;this.ay=anchorY;this.len=len;this.angle=Math.PI/4;this.angVel=0;this.angAcc=0;
this.r=12;this.color=colors[Math.floor(Math.random()*colors.length)];this.trail=[];
}
update(){
this.angAcc=-grav*.001*Math.sin(this.angle);this.angVel+=this.angAcc;this.angVel*=1-fric*.005;
this.angle+=this.angVel;
this.x=this.ax+Math.sin(this.angle)*this.len;this.y=this.ay+Math.cos(this.angle)*this.len;
this.trail.push({x:this.x,y:this.y});if(this.trail.length>30)this.trail.shift();
}
draw(){
ctx.beginPath();ctx.moveTo(this.ax,this.ay);ctx.lineTo(this.x,this.y);
ctx.strokeStyle='#30363d';ctx.lineWidth=2;ctx.stroke();
this.trail.forEach((t,i)=>{
ctx.beginPath();ctx.arc(t.x,t.y,3,0,Math.PI*2);
ctx.fillStyle=this.color+'40';ctx.fill();
});
ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
ctx.fillStyle=this.color;ctx.fill();
}
speed(){return Math.abs(this.angVel)*this.len}
}

let pendulums=[];

function addBall(){
const r=bsize;
if(mode==='pendulum'){
pendulums.push(new Pendulum(W/2+Math.random()*200-100,50,100+Math.random()*200));
}else{
balls.push(new Ball(Math.random()*(W-r*2)+r,Math.random()*(H/2),Math.random()*6-3,Math.random()*3,r));
}
updateInfo();
}

function reset(){
cancelAnimationFrame(animId);running=false;balls=[];pendulums=[];
document.getElementById('btnStart').textContent='▶ 运行';
updateInfo();draw();
}

function updateInfo(){
document.getElementById('objCount').textContent=mode==='pendulum'?pendulums.length:balls.length;
const arr=mode==='pendulum'?pendulums:balls;
if(arr.length>0){
const avg=arr.reduce((s,b)=>s+b.speed(),0)/arr.length;
document.getElementById('avgSpeed').textContent=avg.toFixed(1);
}
document.getElementById('energy').textContent=arr.length>0?(arr.reduce((s,b)=>s+b.speed(),0)*10).toFixed(0):'0';
}

function draw(){
ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#161b22';ctx.fillRect(0,H-5,W,5);
if(mode==='pendulum'){
pendulums.forEach(p=>p.draw());
}else{
balls.forEach(b=>b.draw());
}
}

function loop(){
if(!running)return;
if(mode==='pendulum')pendulums.forEach(p=>p.update());
else balls.forEach(b=>b.update());
updateInfo();draw();animId=requestAnimationFrame(loop);
}

document.getElementById('btnAdd').onclick=addBall;
document.getElementById('btnStart').onclick=()=>{running=!running;document.getElementById('btnStart').textContent=running?'⏸ 暂停':'▶ 运行';if(running)loop();};
document.getElementById('btnReset').onclick=reset;

document.getElementById('gravity').oninput=function(){grav=+this.value;document.getElementById('gravityVal').textContent=this.value;};
document.getElementById('bounciness').oninput=function(){bounce=this.value/100;document.getElementById('bounceVal').textContent=this.value+'%';};
document.getElementById('friction').oninput=function(){fric=this.value/100;document.getElementById('frictionVal').textContent=this.value+'%';};
document.getElementById('ballSize').oninput=function(){bsize=+this.value;document.getElementById('sizeVal').textContent=this.value;};

document.getElementById('modeTabs').onclick=e=>{
const btn=e.target.closest('button');if(!btn)return;
document.querySelectorAll('#modeTabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');mode=btn.dataset.mode;reset();
};

canvas.addEventListener('click',e=>{
const rect=canvas.getBoundingClientRect();
const sx=W/rect.width,sy=H/rect.height;
const x=(e.clientX-rect.left)*sx,y=(e.clientY-rect.top)*sy;
if(mode==='pendulum'){
pendulums.push(new Pendulum(x,y,50+Math.random()*150));
}else{
balls.push(new Ball(x,y,(Math.random()-.5)*8,(Math.random()-.5)*8,bsize));
}
updateInfo();
});

for(let i=0;i<5;i++)addBall();
draw();
</script>
</body>
</html>
