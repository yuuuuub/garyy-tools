<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 化学方程式配平</title>
<meta property="og:title" content="🧪 化学方程式配平">
<meta property="og:description" content="🧪 化学方程式配平 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="化学方程式自动配平工具 - 输入反应物和生成物，自动计算配平系数">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;line-height:1.4}
.hdr{text-align:center;margin-bottom:16px}.hdr h1{font-size:1.6rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{font-size:.95rem;color:var(--accent);margin-bottom:10px}
.input-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.input-row input{flex:1;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;font-family:monospace;outline:none;min-width:120px}
.input-row input:focus{border-color:var(--accent)}
.arrow{font-size:1.5rem;color:var(--accent);flex-shrink:0}
.plus{font-size:1.2rem;color:var(--text2);flex-shrink:0}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:4px 10px;font-size:.75rem}
.result-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;margin-top:12px}
.result-box .equation{font-size:1.3rem;font-weight:700;font-family:monospace;color:var(--accent);line-height:2}
.result-box .coeff{color:var(--warn);font-weight:700}
.error{color:var(--danger);font-size:.85rem;margin-top:8px}
.success{color:var(--success);font-size:.85rem;margin-top:8px}
.examples{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.examples button{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-size:.75rem;transition:all .2s}
.examples button:hover{border-color:var(--accent);color:var(--accent)}
.element-table{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.element-table .el{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px;text-align:center;font-size:.75rem}
.element-table .el .sym{font-weight:700;font-size:1rem;color:var(--accent)}
.element-table .el .name{color:var(--text2)}
.history-item{padding:8px;border-bottom:1px solid var(--border);font-family:monospace;font-size:.85rem;cursor:pointer;transition:background .2s}
.history-item:hover{background:var(--bg)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="hdr"><h1>🧪 化学方程式配平</h1><p>输入化学式，自动计算配平系数</p></div>

<div class="card">
<h3>常用示例</h3>
<div class="examples" id="examples"></div>
</div>

<div class="card">
<h3>输入方程式</h3>
<div id="reactants"><div class="input-row"><input type="text" placeholder="反应物1 (如 H2O)" class="reactant"><span class="plus">+</span><button class="btn btn-sm btn-secondary" onclick="addReactant()">+</button></div></div>
<div style="text-align:center;margin:10px 0"><span class="arrow">→</span></div>
<div id="products"><div class="input-row"><input type="text" placeholder="生成物1 (如 H2 + O2)" class="product"><span class="plus">+</span><button class="btn btn-sm btn-secondary" onclick="addProduct()">+</button></div></div>
<div style="display:flex;gap:8px;margin-top:12px;justify-content:center">
<button class="btn btn-primary" onclick="balance()">配平方程式</button>
<button class="btn btn-secondary" onclick="clearAll()">清空</button>
</div>
</div>

<div class="card" id="resultCard" style="display:none">
<h3>配平结果</h3>
<div class="result-box" id="resultBox"></div>
</div>

<div class="card">
<h3>配平历史</h3>
<div id="history"><div style="color:var(--text2);font-size:.8rem;text-align:center;padding:10px">暂无记录</div></div>
</div>

<script>
const examples=[
{name:'水的合成',reactants:['H2','O2'],products:['H2O']},
{name:'甲烷燃烧',reactants:['CH4','O2'],products:['CO2','H2O']},
{name:'铁生锈',reactants:['Fe','O2'],products:['Fe2O3']},
{name:'碳酸钙分解',reactants:['CaCO3'],products:['CaO','CO2']},
{name:'锌与盐酸',reactants:['Zn','HCl'],products:['ZnCl2','H2']},
{name:'氨的合成',reactants:['N2','H2'],products:['NH3']},
{name:'光合作用',reactants:['CO2','H2O'],products:['C6H12O6','O2']},
{name:'酒精燃烧',reactants:['C2H5OH','O2'],products:['CO2','H2O']}
];

function initExamples(){
document.getElementById('examples').innerHTML=examples.map((e,i)=>`<button onclick="loadExample(${i})">${e.name}</button>`).join('');
}

function loadExample(i){
const e=examples[i];
const rDiv=document.getElementById('reactants');
const pDiv=document.getElementById('products');
rDiv.innerHTML='';pDiv.innerHTML='';
e.reactants.forEach((r,j)=>{
rDiv.innerHTML+=`<div class="input-row"><input type="text" class="reactant" value="${r}">${j<e.reactants.length-1?'<span class="plus">+</span>':''}</div>`;
});
e.products.forEach((p,j)=>{
pDiv.innerHTML+=`<div class="input-row"><input type="text" class="product" value="${p}">${j<e.products.length-1?'<span class="plus">+</span>':''}</div>`;
});
balance();
}

function addReactant(){
const div=document.getElementById('reactants');
div.innerHTML+=`<div class="input-row"><span class="plus">+</span><input type="text" class="reactant" placeholder="反应物"></div>`;
}

function addProduct(){
const div=document.getElementById('products');
div.innerHTML+=`<div class="input-row"><span class="plus">+</span><input type="text" class="product" placeholder="生成物"></div>`;
}

function parseFormula(formula){
const elements={};
const regex=/([A-Z][a-z]?)(\d*)/g;
let match;
while((match=regex.exec(formula))!==null){
if(match[1]){
const el=match[1];
const count=match[2]?parseInt(match[2]):1;
elements[el]=(elements[el]||0)+count;
}
}
return elements;
}

function balance(){
const reactants=[...document.querySelectorAll('.reactant')].map(el=>el.value.trim()).filter(v=>v);
const products=[...document.querySelectorAll('.product')].map(el=>el.value.trim()).filter(v=>v);
if(!reactants.length||!products.length){
showResult('请输入至少一个反应物和生成物',true);return;
}

const allFormulas=[...reactants,...products];
const allElements=new Set();
allFormulas.forEach(f=>{Object.keys(parseFormula(f)).forEach(el=>allElements.add(el))});
const elementList=[...allElements];

try{
const coeffs=solveBalance(reactants,products,elementList);
if(coeffs){
const eq=reactants.map((r,i)=>{
const c=coeffs[i];return c>1?`<span class="coeff">${c}</span>${r}`:r;
}).join(' + ')+' → '+products.map((p,i)=>{
const c=coeffs[reactants.length+i];return c>1?`<span class="coeff">${c}</span>${p}`:p;
}).join(' + ');
showResult(`<div class="equation">${eq}</div><div class="success">配平成功！</div>`);
addHistory(reactants,products,coeffs);
}else{
showResult('无法配平该方程式，请检查化学式是否正确',true);
}
}catch(e){
showResult('配平失败：'+e.message,true);
}
}

function solveBalance(reactants,products,elements){
const n=reactants.length+products.length;
const m=elements.length;
const matrix=[];
for(let j=0;j<m;j++){
const row=[];
for(let i=0;i<reactants.length;i++){
const el=parseFormula(reactants[i]);
row.push((el[elements[j]]||0));
}
for(let i=0;i<products.length;i++){
const el=parseFormula(products[i]);
row.push(-(el[elements[j]]||0));
}
matrix.push(row);
}

let rank=0;const mat=matrix.map(r=>[...r]);
for(let col=0;col<n&&rank<m;col++){
let maxRow=rank;
for(let row=rank+1;row<m;row++){if(Math.abs(mat[row][col])>Math.abs(mat[maxRow][col]))maxRow=row}
if(Math.abs(mat[maxRow][col])<1e-10)continue;
[mat[rank],mat[maxRow]]=[mat[maxRow],mat[rank]];
const pivot=mat[rank][col];
for(let j=col;j<n;j++)mat[rank][j]/=pivot;
for(let row=0;row<m;row++){
if(row===rank)continue;
const factor=mat[row][col];
for(let j=col;j<n;j++)mat[row][j]-=factor*mat[rank][j];
}
rank++;
}

const coeffs=new Array(n).fill(0);
coeffs[n-1]=1;
for(let i=Math.min(rank,n-1)-1;i>=0;i--){
let sum=0;
for(let j=i+1;j<n;j++)sum+=mat[i][j]*coeffs[j];
coeffs[i]=-sum/(mat[i][i]||1);
}

if(coeffs.some(c=>c<=0||!isFinite(c)))return null;

let minPos=Infinity;
coeffs.forEach(c=>{if(c>0&&c<minPos)minPos=c});
const scaled=coeffs.map(c=>Math.round(c/minPos*100));
const gcd=scaled.reduce((a,b)=>gcd2(Math.abs(a),Math.abs(b)));
const result=scaled.map(c=>c/gcd);

if(result.some(c=>c<=0||c>1000||!Number.isInteger(c)))return null;
return result;
}

function gcd2(a,b){return b===0?a:gcd2(b,a%b)}

function showResult(html,isError){
const card=document.getElementById('resultCard');
card.style.display='block';
document.getElementById('resultBox').innerHTML=html;
card.scrollIntoView({behavior:'smooth'});
}

const historyList=[];
function addHistory(reactants,products,coeffs){
const eq=reactants.map((r,i)=>(coeffs[i]>1?coeffs[i]:'')+r).join('+')+'→'+products.map((p,i)=>(coeffs[reactants.length+i]>1?coeffs[reactants.length+i]:'')+p).join('+');
historyList.unshift(eq);
if(historyList.length>20)historyList.pop();
document.getElementById('history').innerHTML=historyList.map(h=>`<div class="history-item">${h}</div>`).join('');
}

function clearAll(){
document.querySelectorAll('.reactant,.product').forEach(el=>el.value='');
document.getElementById('resultCard').style.display='none';
}

initExamples();
</script>
</body>
</html>
