<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>航班比价工具</title>
<meta property="og:title" content="航班比价工具">
<meta property="og:description" content="比较不同航班的价格和时间">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="航班比价工具，比较不同航空公司航班的价格和时间">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:16px;min-height:100vh;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.gr .st{text-align:center;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.gr .st .nm{font-size:1.3rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.75rem;color:var(--text2);margin-top:4px}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text);margin-right:4px;margin-bottom:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.flight-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .15s}
.flight-card:hover{transform:translateY(-2px)}
.flight-card.best{border-color:var(--success)}
.flight-card.fastest{border-color:var(--accent)}
.flight-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.flight-airline{font-weight:600;font-size:1rem}
.flight-price{font-size:1.2rem;font-weight:700;color:var(--warn)}
.flight-info{display:flex;align-items:center;gap:8px;font-size:.9rem;margin-bottom:6px}
.flight-time{font-weight:600;font-size:1rem}
.flight-arr{color:var(--text2)}
.flight-duration{color:var(--text2);font-size:.8rem}
.flight-meta{display:flex;gap:6px;flex-wrap:wrap}
.sort-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sort-btn{padding:4px 12px;border-radius:16px;font-size:.8rem;background:var(--bg);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s}
.sort-btn:hover,.sort-btn.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filter-row select,.filter-row input{flex:1;min-width:120px}
.chart-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chart-label{min-width:80px;font-size:.8rem;color:var(--text2);text-align:right}
.chart-fill{height:20px;border-radius:4px;transition:width .3s;min-width:2px}
.chart-val{font-size:.8rem;font-weight:600;min-width:50px}
.es{text-align:center;padding:40px;color:var(--text2)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>✈️ 航班比价工具</h1><p>比较不同航班的价格和时间</p></div>

<div class="gr" id="stats"></div>

<div class="cd"><h2>🔍 搜索航班</h2>
<div class="fr">
<div><label>出发城市</label><select id="fromCity"></select></div>
<div><label>到达城市</label><select id="toCity"></select></div>
</div>
<div class="fr" style="margin-top:8px">
<div><label>出发时段</label><select id="timeSlot"><option value="all">全部时段</option><option value="morning">早晨 (6:00-12:00)</option><option value="afternoon">下午 (12:00-18:00)</option><option value="evening">晚间 (18:00-24:00)</option></select></div>
<div><label>排序方式</label><select id="sortBy"><option value="price">价格从低到高</option><option value="duration">耗时从短到长</option><option value="departure">出发时间</option></select></div>
</div>
<div class="bg"><button onclick="searchFlights()">🔍 搜索航班</button></div></div>

<div class="cd"><h2>📊 价格对比</h2><div id="priceChart"></div></div>

<div class="cd"><h2>✈️ 航班结果</h2><div id="flightResults"><div class="es">请选择出发和到达城市</div></div></div>
</div>

<script>
const CITIES=['北京','上海','广州','深圳','成都','杭州','重庆','武汉','西安','三亚'];
const AIRLINES=[
  {name:'中国国航',code:'CA'},{name:'南方航空',code:'CZ'},{name:'东方航空',code:'MU'},
  {name:'海南航空',code:'HU'},{name:'春秋航空',code:'9C'},{name:'深圳航空',code:'ZH'},
  {name:'厦门航空',code:'MF'},{name:'四川航空',code:'3U'},{name:'吉祥航空',code:'HO'},
  {name:'山东航空',code:'SC'}
];
const PLANES=['A320','A321','A330','B737','B738','B787','A350','B777'];
const FLIGHTS=[
  {from:'北京',to:'上海',dep:'07:00',arr:'09:15',dur:135,price:680,airline:0,plane:'A321'},
  {from:'北京',to:'上海',dep:'08:30',arr:'10:40',dur:130,price:720,airline:1,plane:'B738'},
  {from:'北京',to:'上海',dep:'10:00',arr:'12:10',dur:130,price:650,airline:2,plane:'A320'},
  {from:'北京',to:'上海',dep:'14:00',arr:'16:20',dur:140,price:580,airline:4,plane:'A320'},
  {from:'北京',to:'上海',dep:'18:00',arr:'20:15',dur:135,price:620,airline:3,plane:'B787'},
  {from:'上海',to:'北京',dep:'07:30',arr:'10:00',dur:150,price:700,airline:0,plane:'A330'},
  {from:'上海',to:'北京',dep:'12:00',arr:'14:30',dur:150,price:640,airline:2,plane:'B737'},
  {from:'上海',to:'北京',dep:'16:00',arr:'18:25',dur:145,price:560,airline:4,plane:'A320'},
  {from:'广州',to:'成都',dep:'08:00',arr:'10:50',dur:170,price:850,airline:1,plane:'A321'},
  {from:'广州',to:'成都',dep:'13:00',arr:'15:45',dur:165,price:780,airline:3,plane:'B738'},
  {from:'广州',to:'成都',dep:'19:00',arr:'21:40',dur:160,price:720,airline:5,plane:'A320'},
  {from:'广州',to:'成都',dep:'10:30',arr:'13:15',dur:165,price:690,airline:8,plane:'A320'},
  {from:'深圳',to:'杭州',dep:'07:30',arr:'09:45',dur:135,price:580,airline:6,plane:'B738'},
  {from:'深圳',to:'杭州',dep:'14:00',arr:'16:10',dur:130,price:520,airline:4,plane:'A320'},
  {from:'深圳',to:'杭州',dep:'18:30',arr:'20:40',dur:130,price:490,airline:9,plane:'A321'},
  {from:'北京',to:'广州',dep:'06:30',arr:'09:30',dur:180,price:1100,airline:0,plane:'A330'},
  {from:'北京',to:'广州',dep:'11:00',arr:'14:00',dur:180,price:980,airline:1,plane:'B787'},
  {from:'北京',to:'广州',dep:'17:00',arr:'19:55',dur:175,price:890,airline:3,plane:'A321'},
  {from:'上海',to:'深圳',dep:'08:00',arr:'10:20',dur:140,price:620,airline:2,plane:'A321'},
  {from:'上海',to:'深圳',dep:'15:00',arr:'17:15',dur:135,price:550,airline:4,plane:'A320'},
  {from:'成都',to:'杭州',dep:'09:00',arr:'11:30',dur:150,price:750,airline:7,plane:'A321'},
  {from:'成都',to:'杭州',dep:'16:00',arr:'18:25',dur:145,price:680,airline:5,plane:'B737'},
  {from:'西安',to:'三亚',dep:'08:30',arr:'11:40',dur:190,price:1200,airline:1,plane:'B787'},
  {from:'西安',to:'三亚',dep:'14:00',arr:'17:05',dur:185,price:980,airline:3,plane:'A321'},
  {from:'重庆',to:'三亚',dep:'07:00',arr:'09:40',dur:160,price:880,airline:7,plane:'A320'},
  {from:'重庆',to:'三亚',dep:'15:30',arr:'18:10',dur:160,price:760,airline:5,plane:'B738'}
];
let results=[];

function $(id){return document.getElementById(id)}
function initCities(){
  const fromOpts=CITIES.map(c=>`<option value="${c}">${c}</option>`).join('');
  const toOpts=CITIES.map(c=>`<option value="${c}">${c}</option>`).join('');
  $('fromCity').innerHTML=fromOpts;$('toCity').innerHTML=toOpts;
  $('toCity').selectedIndex=1;
}
function getTimeSlot(dep){
  const h=parseInt(dep.split(':')[0]);
  if(h<12)return'morning';if(h<18)return'afternoon';return'evening';
}
function searchFlights(){
  const from=$('fromCity').value,to=$('toCity').value;
  const timeSlot=$('timeSlot').value,sortBy=$('sortBy').value;
  if(from===to){$('flightResults').innerHTML='<div class="es">出发地和目的地不能相同</div>';return;}
  results=FLIGHTS.filter(f=>f.from===from&&f.to===to&&(timeSlot==='all'||getTimeSlot(f.dep)===timeSlot));
  results.sort((a,b)=>{
    if(sortBy==='price')return a.price-b.price;
    if(sortBy==='duration')return a.dur-b.dur;
    return a.dep.localeCompare(b.dep);
  });
  renderResults();
}
function renderResults(){
  if(!results.length){$('flightResults').innerHTML='<div class="es">未找到符合条件的航班</div>';renderChart([]);updateStats(0,0);return;}
  const minPrice=Math.min(...results.map(f=>f.price));
  const minDur=Math.min(...results.map(f=>f.dur));
  const airlines=[...new Set(results.map(f=>AIRLINES[f.airline].name))];
  $('flightResults').innerHTML=results.map((f,i)=>{
    const isCheapest=f.price===minPrice;
    const isFastest=f.dur===minDur;
    const cls=isCheapest?'best':isFastest?'fastest':'';
    return `<div class="flight-card ${cls}">
      <div class="flight-head">
        <span class="flight-airline">${AIRLINES[f.airline].name} ${AIRLINES[f.airline].code}${1000+i}</span>
        <span class="flight-price">¥${f.price}</span>
      </div>
      <div class="flight-info">
        <span class="flight-time">${f.dep}</span>
        <span style="color:var(--text2)">→</span>
        <span class="flight-arr">${f.arr}</span>
        <span class="flight-duration">(${Math.floor(f.dur/60)}h${f.dur%60}m)</span>
      </div>
      <div class="flight-meta">
        ${isCheapest?'<span class="tag s">💰 最低价</span>':''}
        ${isFastest?'<span class="tag">⚡ 最快</span>':''}
        <span class="tag">${f.plane}</span>
        <span class="tag">${getTimeSlot(f.dep)==='morning'?'🌅 早班':getTimeSlot(f.dep)==='afternoon'?'☀️ 午班':'🌙 晚班'}</span>
      </div>
    </div>`;
  }).join('');
  renderChart(results);updateStats(results.length,airlines.length);
}
function renderChart(flights){
  if(!flights.length){$('priceChart').innerHTML='<div class="es">暂无数据</div>';return;}
  const maxPrice=Math.max(...flights.map(f=>f.price));
  $('priceChart').innerHTML=flights.map(f=>{
    const pct=Math.round(f.price/maxPrice*100);
    const isMin=f.price===Math.min(...flights.map(x=>x.price));
    return `<div class="chart-bar">
      <span class="chart-label">${AIRLINES[f.airline].name}</span>
      <div class="chart-fill" style="width:${pct}%;background:${isMin?'var(--success)':'var(--accent)'}"></div>
      <span class="chart-val" style="color:${isMin?'var(--success)':'var(--text)'}">¥${f.price}</span>
    </div>`;
  }).join('');
}
function updateStats(flightCount,airlineCount){
  const avgPrice=results.length?Math.round(results.reduce((s,f)=>s+f.price,0)/results.length):0;
  const minPrice=results.length?Math.min(...results.map(f=>f.price)):0;
  $('stats').innerHTML=`
    <div class="st"><div class="nm">${flightCount}</div><div class="lb">航班数</div></div>
    <div class="st"><div class="nm">¥${avgPrice}</div><div class="lb">平均价格</div></div>
    <div class="st"><div class="nm">¥${minPrice}</div><div class="lb">最低价格</div></div>
    <div class="st"><div class="nm">${airlineCount}</div><div class="lb">航空公司</div></div>`;
}
initCities();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
