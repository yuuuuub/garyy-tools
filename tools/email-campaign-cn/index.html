<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📧 邮件营销管理器</title>
<meta name="description" content="邮件营销活动管理工具，创建、追踪和优化邮件营销活动">
<meta name="robots" content="index, follow">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:20px;transition:background .3s,color .3s}
.container{max-width:1000px;margin:0 auto}
h1{color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
label{display:block;font-weight:600;margin-bottom:4px;font-size:14px;color:var(--text2)}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
textarea{resize:vertical;min-height:80px}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-orange{background:var(--orange)}
.btn-purple{background:var(--purple)}
.btn-sm{padding:4px 10px;font-size:12px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-box{text-align:center;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.stat-box .num{font-size:28px;font-weight:700;color:var(--blue)}
.stat-box .label{font-size:12px;color:var(--text2);margin-top:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;color:#fff}
.badge-draft{background:var(--text2)}
.badge-sending{background:var(--blue)}
.badge-sent{background:var(--green)}
.badge-paused{background:var(--orange)}
.campaign-item{padding:16px;border-left:4px solid var(--blue);margin-bottom:12px;border-radius:0 8px 8px 0;background:var(--card);border:1px solid var(--border)}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:8px 0}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .3s}
.chart-bar{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:10px}
.chart-bar .bar{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px;transition:height .3s;position:relative}
.chart-bar .bar:hover::after{content:attr(data-val);position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;background:var(--text);color:var(--bg);padding:1px 6px;border-radius:3px;white-space:nowrap}
.email-preview{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:16px;margin-top:12px}
.email-subject{font-weight:700;font-size:16px;margin-bottom:8px}
.email-body{font-size:14px;line-height:1.6;color:var(--text2)}
.tab-bar{display:flex;gap:4px;margin-bottom:16px}
.tab-bar button{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.tab-bar button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.theme-toggle{position:fixed;top:20px;right:20px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:6px;cursor:pointer;z-index:100}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{font-weight:600;color:var(--text2);font-size:12px}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>📧 邮件营销管理器</h1>

<div class="stat-row" id="statsRow"></div>

<div class="tab-bar">
<button class="active" onclick="switchTab('create')">创建活动</button>
<button onclick="switchTab('list')">活动列表</button>
<button onclick="switchTab('analytics')">数据分析</button>
<button onclick="switchTab('templates')">邮件模板</button>
</div>

<div id="tab-create" class="card">
<h3 style="margin-bottom:16px">新建邮件活动</h3>
<div class="grid-2">
<div><label>活动名称</label><input type="text" id="cName" placeholder="例：618大促邮件"></div>
<div><label>活动类型</label><select id="cType"><option value="promo">促销推广</option><option value="newsletter">新闻通讯</option><option value="welcome">欢迎邮件</option><option value="cart-abandon">购物车挽回</option><option value="reengagement">用户唤醒</option><option value="transactional">交易通知</option></select></div>
</div>
<div class="grid-2">
<div><label>发件人名称</label><input type="text" id="cFrom" placeholder="品牌名称"></div>
<div><label>发件人邮箱</label><input type="email" id="cEmail" placeholder="noreply@example.com"></div>
</div>
<div><label>邮件主题</label><input type="text" id="cSubject" placeholder="邮件主题行"></div>
<div style="margin-top:8px"><label>邮件预览文本</label><input type="text" id="cPreview" placeholder="在收件箱中显示的预览文字"></div>
<div style="margin-top:8px"><label>邮件正文</label><textarea id="cBody" rows="5" placeholder="支持HTML或纯文本"></textarea></div>
<div class="grid-3" style="margin-top:12px">
<div><label>目标受众数量</label><input type="number" id="cAudience" placeholder="5000"></div>
<div><label>计划发送日期</label><input type="date" id="cDate"></div>
<div><label>发送时间</label><input type="time" id="cTime" value="10:00"></div>
</div>
<div style="margin-top:16px;display:flex;gap:8px">
<button onclick="createCampaign()">🚀 创建活动</button>
<button class="btn-green" onclick="previewEmail()">👁 预览邮件</button>
</div>
<div id="emailPreview"></div>
</div>

<div id="tab-list" class="card" style="display:none">
<h3 style="margin-bottom:16px">活动列表</h3>
<div id="campaignList"></div>
</div>

<div id="tab-analytics" class="card" style="display:none">
<h3 style="margin-bottom:16px">数据分析</h3>
<div id="analyticsContent"></div>
</div>

<div id="tab-templates" class="card" style="display:none">
<h3 style="margin-bottom:16px">邮件模板库</h3>
<div id="templateList"></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var campaigns = JSON.parse(localStorage.getItem('email_campaigns') || '[]');
var idCounter = campaigns.length ? Math.max(...campaigns.map(c=>c.id)) + 1 : 1;

var templates = [
  {name:'促销模板',subject:'🎉 {品牌名}限时特惠，全场低至{折扣}折！',body:'尊敬的用户，\n\n{品牌名}限时特惠活动火热进行中！\n\n全场商品低至{折扣}折，优惠码：{优惠码}\n\n活动时间：{开始时间} - {结束时间}\n\n立即选购 →\n\n祝购物愉快！\n{品牌名}团队'},
  {name:'新闻通讯模板',subject:'📰 {月份}月刊 - 最新动态与行业洞察',body:'亲爱的读者，\n\n本期月刊为您带来：\n\n1. {头条新闻}\n2. 行业趋势分析\n3. 产品更新\n\n详细内容请查看完整版月刊。\n\n{品牌名}编辑部'},
  {name:'欢迎邮件模板',subject:'👋 欢迎加入{品牌名}！',body:'您好，{用户名}！\n\n欢迎加入{品牌名}大家庭！\n\n作为新会员，您可以：\n• 浏览精选商品\n• 参与会员专属活动\n• 获取首单优惠\n\n立即开始您的旅程 →\n\n{品牌名}团队'},
  {name:'购物车挽回模板',subject:'🛒 您还有未完成的订单哦~',body:'亲爱的用户，\n\n我们注意到您有商品还在购物车中等待结算：\n\n{商品列表}\n\n完成下单即享9折优惠！\n\n立即结算 →\n\n优惠码：CART10\n有效期：7天'},
  {name:'用户唤醒模板',subject:'好久不见！{品牌名}为您准备了专属优惠',body:'亲爱的{用户名}，\n\n距离您上次访问已经有一段时间了。\n\n我们为您准备了一份专属优惠：\n\n🎁 无门槛优惠券 ¥{金额}\n🎁 满{满减额}减{优惠额}\n\n有效期至：{截止日期}\n\n重新开启您的购物之旅 →'}
];

function save(){localStorage.setItem('email_campaigns',JSON.stringify(campaigns))}

function switchTab(tab){
  document.querySelectorAll('.tab-bar button').forEach((b,i)=>{
    b.classList.toggle('active', b.textContent.includes({create:'创建',list:'列表',analytics:'数据',templates:'模板'}[tab]));
  });
  ['create','list','analytics','templates'].forEach(t=>{
    var el=document.getElementById('tab-'+t);
    if(el) el.style.display=t===tab?'block':'none';
  });
  if(tab==='list') renderList();
  if(tab==='analytics') renderAnalytics();
  if(tab==='templates') renderTemplates();
}

function createCampaign(){
  var name=document.getElementById('cName').value.trim();
  if(!name){alert('请输入活动名称');return;}
  var c={
    id:idCounter++,name:name,type:document.getElementById('cType').value,
    from:document.getElementById('cFrom').value,email:document.getElementById('cEmail').value,
    subject:document.getElementById('cSubject').value,preview:document.getElementById('cPreview').value,
    body:document.getElementById('cBody').value,audience:parseInt(document.getElementById('cAudience').value)||0,
    date:document.getElementById('cDate').value,time:document.getElementById('cTime').value,
    status:'draft',sent:0,opened:0,clicked:0,bounced:0,unsubscribed:0,
    created:new Date().toLocaleDateString('zh-CN')
  };
  campaigns.unshift(c);save();renderStats();
  ['cName','cFrom','cEmail','cSubject','cPreview','cBody','cAudience','cDate'].forEach(id=>document.getElementById(id).value='');
  alert('活动创建成功！');
}

function previewEmail(){
  var subj=document.getElementById('cSubject').value||'（未设置主题）';
  var body=document.getElementById('cBody').value||'（邮件正文为空）';
  document.getElementById('emailPreview').innerHTML='<div class="email-preview"><div class="email-subject">'+subj+'</div><div class="email-body">'+body.replace(/\n/g,'<br>')+'</div></div>';
}

function renderList(){
  var el=document.getElementById('campaignList');
  if(!campaigns.length){el.innerHTML='<p style="color:var(--text2)">暂无活动</p>';return;}
  el.innerHTML=campaigns.map(c=>{
    var badgeClass={draft:'badge-draft',sending:'badge-sending',sent:'badge-sent',paused:'badge-paused'}[c.status]||'badge-draft';
    var statusText={draft:'草稿',sending:'发送中',sent:'已发送',paused:'已暂停'}[c.status]||c.status;
    var pct=c.audience?Math.round(c.sent/c.audience*100):0;
    var barColor=pct>=80?'var(--green)':pct>=40?'var(--blue)':'var(--orange)';
    return '<div class="campaign-item"><div style="display:flex;justify-content:space-between;align-items:center"><div><strong>'+c.name+'</strong> <span class="badge '+badgeClass+'">'+statusText+'</span></div><div style="display:flex;gap:4px">'+(c.status==='draft'?'<button class="btn-sm btn-green" onclick="updateCampaignStatus('+c.id+',\'sending\')">发送</button>':'')+(c.status==='sending'?'<button class="btn-sm btn-orange" onclick="updateCampaignStatus('+c.id+',\'paused\')">暂停</button>':'')+(c.status==='paused'?'<button class="btn-sm btn-green" onclick="updateCampaignStatus('+c.id+',\'sending\')">恢复</button>':'')+'<button class="btn-sm btn-red" onclick="deleteCampaign('+c.id+')">删除</button></div></div><div style="font-size:13px;color:var(--text2);margin-top:6px">'+c.type+' · '+c.audience+'收件人 · '+c.created+'</div><div class="progress-bar"><div class="fill" style="width:'+pct+'%;background:'+barColor+'"></div></div><div style="font-size:12px;color:var(--text2)">已发送 '+c.sent+'</div></div>';
  }).join('');
}

function updateCampaignStatus(id,status){
  var c=campaigns.find(x=>x.id===id);if(!c)return;
  c.status=status;
  if(status==='sending'){
    var remaining=c.audience-c.sent;
    var interval=setInterval(function(){
      if(remaining<=0||c.status!=='sending'){clearInterval(interval);save();renderList();return;}
      var batch=Math.min(Math.ceil(Math.random()*c.audience*0.05),remaining);
      c.sent+=batch;
      c.opened+=Math.round(batch*(0.15+Math.random()*0.2));
      c.clicked+=Math.round(batch*(0.02+Math.random()*0.05));
      c.bounced+=Math.round(batch*0.02);
      remaining=c.audience-c.sent;
      save();renderList();
    },1000);
  }
  save();renderList();
}

function deleteCampaign(id){campaigns=campaigns.filter(c=>c.id!==id);save();renderList();renderStats();}

function renderAnalytics(){
  if(!campaigns.length){document.getElementById('analyticsContent').innerHTML='<p style="color:var(--text2)">暂无数据</p>';return;}
  var totalSent=campaigns.reduce((s,c)=>s+c.sent,0);
  var totalOpened=campaigns.reduce((s,c)=>s+c.opened,0);
  var totalClicked=campaigns.reduce((s,c)=>s+c.clicked,0);
  var totalBounced=campaigns.reduce((s,c)=>s+c.bounced,0);
  var openRate=totalSent?Math.round(totalOpened/totalSent*100):0;
  var clickRate=totalSent?Math.round(totalClicked/totalSent*100):0;
  var bounceRate=totalSent?Math.round(totalBounced/totalSent*100):0;

  var byType={};campaigns.forEach(c=>{if(!byType[c.type])byType[c.type]={count:0,sent:0,opened:0,clicked:0};byType[c.type].count++;byType[c.type].sent+=c.sent;byType[c.type].opened+=c.opened;byType[c.type].clicked+=c.clicked;});
  var typeLabels={promo:'促销',newsletter:'通讯',welcome:'欢迎','cart-abandon':'挽回',reengagement:'唤醒',transactional:'通知'};

  var html='<div class="stat-row" style="grid-template-columns:repeat(5,1fr)"><div class="stat-box"><div class="num" style="font-size:22px">'+totalSent.toLocaleString()+'</div><div class="label">总发送量</div></div><div class="stat-box"><div class="num" style="font-size:22px;color:var(--green)">'+openRate+'%</div><div class="label">平均打开率</div></div><div class="stat-box"><div class="num" style="font-size:22px;color:var(--blue)">'+clickRate+'%</div><div class="label">平均点击率</div></div><div class="stat-box"><div class="num" style="font-size:22px;color:var(--red)">'+bounceRate+'%</div><div class="label">退信率</div></div><div class="stat-box"><div class="num" style="font-size:22px;color:var(--purple)">'+campaigns.length+'</div><div class="label">总活动数</div></div></div>';

  html+='<h4 style="margin:16px 0 8px">按类型分析</h4><table><thead><tr><th>类型</th><th>活动数</th><th>发送量</th><th>打开率</th><th>点击率</th></tr></thead><tbody>';
  Object.keys(byType).forEach(t=>{
    var d=byType[t];var or=d.sent?Math.round(d.opened/d.sent*100):0;var cr=d.sent?Math.round(d.clicked/d.sent*100):0;
    html+='<tr><td>'+(typeLabels[t]||t)+'</td><td>'+d.count+'</td><td>'+d.sent.toLocaleString()+'</td><td>'+or+'%</td><td>'+cr+'%</td></tr>';
  });
  html+='</tbody></table>';

  html+='<h4 style="margin:16px 0 8px">各活动表现</h4><div class="chart-bar">';
  var maxSent=Math.max(...campaigns.map(c=>c.sent),1);
  campaigns.forEach(c=>{
    var h=Math.round(c.sent/maxSent*100);
    html+='<div class="bar" style="height:'+h+'%" data-val="'+c.name+': '+c.sent+'"></div>';
  });
  html+='</div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2)"><span>'+campaigns[0]?.name+'</span><span>'+campaigns[campaigns.length-1]?.name+'</span></div>';

  document.getElementById('analyticsContent').innerHTML=html;
}

function renderTemplates(){
  document.getElementById('templateList').innerHTML=templates.map((t,i)=>
    '<div class="campaign-item"><strong>'+t.name+'</strong><div style="font-size:13px;color:var(--text2);margin:4px 0">主题: '+t.subject+'</div><pre style="font-size:12px;white-space:pre-wrap;background:var(--bg);padding:8px;border-radius:4px;border:1px solid var(--border);max-height:100px;overflow:auto">'+t.body+'</pre><div style="margin-top:8px"><button class="btn-sm" onclick="useTemplate('+i+')">使用模板</button></div></div>'
  ).join('');
}

function useTemplate(i){
  var t=templates[i];
  document.getElementById('cSubject').value=t.subject;
  document.getElementById('cBody').value=t.body;
  switchTab('create');
}

function renderStats(){
  var total=campaigns.length;
  var sent=campaigns.filter(c=>c.status==='sending'||c.status==='sent').length;
  var draft=campaigns.filter(c=>c.status==='draft').length;
  var totalOpen=campaigns.reduce((s,c)=>s+c.opened,0);
  document.getElementById('statsRow').innerHTML='<div class="stat-box"><div class="num">'+total+'</div><div class="label">总活动</div></div><div class="stat-box"><div class="num" style="color:var(--green)">'+sent+'</div><div class="label">进行中</div></div><div class="stat-box"><div class="num" style="color:var(--text2)">'+draft+'</div><div class="label">草稿</div></div><div class="stat-box"><div class="num" style="color:var(--blue)">'+totalOpen.toLocaleString()+'</div><div class="label">总打开数</div></div>';
}

function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
renderStats();renderList();
</script>
</body>
</html>
