<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>

<div class="container" id="app">
  <div class="header"><h1>秒表计时器</h1></div>

  <div class="tabs">
    <button class="tab active" data-tab="stopwatch" id="tabStopwatch">秒表</button>
    <button class="tab" data-tab="countdown" id="tabCountdown">倒计时</button>
  </div>

  <div class="panel active" id="panelStopwatch">
    <div class="display-wrapper">
      <div class="digital-display" id="swDisplay">00<span class="colon">:</span>00<span class="colon">:</span>00<span class="millis">.00</span></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-start" id="swStart">开始</button>
      <button class="btn btn-lap" id="swLap" disabled>计次</button>
      <button class="btn btn-reset" id="swReset">重置</button>
    </div>

    <div class="lap-section">
      <div class="lap-header">
        <span>#</span><span>计次时间</span><span>总时间</span><span>差距</span>
      </div>
      <ul class="lap-list" id="lapList">
        <li class="no-laps">暂无计次记录</li>
      </ul>
    </div>
  </div>

  <div class="panel" id="panelCountdown">

    <div class="ring-container" id="ringContainer">
      <svg viewBox="0 0 180 180">
        <circle class="ring-bg" cx="90" cy="90" r="82"/>
        <circle class="ring-progress" id="ringProgress" cx="90" cy="90" r="82"
          stroke-dasharray="515.22" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-center-text">
        <span id="ringPercent">100%</span><br>
        <span class="small">剩余</span>
      </div>
    </div>

    <div class="display-wrapper">
      <div class="digital-display" id="cdDisplay">00<span class="colon">:</span>00<span class="colon">:</span>00<span class="millis">.00</span></div>
      <div class="percentage-label" id="percentLabel">—</div>
    </div>

    <div class="time-input-row" id="timeInputRow">
      <div class="time-unit">
        <button class="adj-btn" data-target="cdHours" data-dir="1">+</button>
        <input type="number" class="val" id="cdHours" value="0" min="0" max="99" readonly>
        <button class="adj-btn" data-target="cdHours" data-dir="-1">−</button>
        <label>时</label>
      </div>
      <span class="time-separator">:</span>
      <div class="time-unit">
        <button class="adj-btn" data-target="cdMinutes" data-dir="1">+</button>
        <input type="number" class="val" id="cdMinutes" value="5" min="0" max="59" readonly>
        <button class="adj-btn" data-target="cdMinutes" data-dir="-1">−</button>
        <label>分</label>
      </div>
      <span class="time-separator">:</span>
      <div class="time-unit">
        <button class="adj-btn" data-target="cdSeconds" data-dir="1">+</button>
        <input type="number" class="val" id="cdSeconds" value="0" min="0" max="59" readonly>
        <button class="adj-btn" data-target="cdSeconds" data-dir="-1">−</button>
        <label>秒</label>
      </div>
    </div>

    <div class="preset-row" id="presetRow">
      <button class="btn btn-preset" data-preset="30">30秒</button>
      <button class="btn btn-preset active" data-preset="300">1分</button>
      <button class="btn btn-preset" data-preset="300">5分</button>
      <button class="btn btn-preset" data-preset="600">10分</button>
      <button class="btn btn-preset" data-preset="1500">番茄 25分</button>
      <button class="btn btn-preset" data-preset="3000">50分</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-start" id="cdStart">开始</button>
      <button class="btn btn-reset" id="cdReset">重置</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);
  const tabStopwatch = $('#tabStopwatch');
  const tabCountdown = $('#tabCountdown');
  const panelStopwatch = $('#panelStopwatch');
  const panelCountdown = $('#panelCountdown');
  const swDisplay = $('#swDisplay');
  const swStartBtn = $('#swStart');
  const swLapBtn = $('#swLap');
  const swResetBtn = $('#swReset');
  const lapList = $('#lapList');
  const cdDisplay = $('#cdDisplay');
  const cdStartBtn = $('#cdStart');
  const cdResetBtn = $('#cdReset');
  const ringProgress = $('#ringProgress');
  const ringPercent = $('#ringPercent');
  const percentLabel = $('#percentLabel');
  const cdHours = $('#cdHours');
  const cdMinutes = $('#cdMinutes');
  const cdSeconds = $('#cdSeconds');
  const timeInputRow = $('#timeInputRow');
  const appContainer = $('#app');
  const presetRow = $('#presetRow');
  tabStopwatch.addEventListener('click', () => switchTab('stopwatch'));
  tabCountdown.addEventListener('click', () => switchTab('countdown'));
  function switchTab(tab) {
    const activeTab = tab === 'stopwatch' ? tabStopwatch : tabCountdown;
    const activePanel = tab === 'stopwatch' ? panelStopwatch : panelCountdown;
    const inactiveTab = tab === 'stopwatch' ? tabCountdown : tabStopwatch;
    const inactivePanel = tab === 'stopwatch' ? panelCountdown : panelStopwatch;
    inactiveTab.classList.remove('active');
    inactivePanel.classList.remove('active');
    activeTab.classList.add('active');
    activePanel.classList.add('active');
    if (tab === 'stopwatch' && countdownState.running) {
      pauseCountdown();
    }
    if (tab === 'countdown' && stopwatchState.running) {
      pauseStopwatch();
    }
    updateAllButtons();
  }
  const CIRCUMFERENCE = 2 * Math.PI * 82;
  function formatTime(totalMs, showMillis = true) {
    const negative = totalMs < 0;
    totalMs = Math.abs(totalMs);
    const hours = Math.floor(totalMs / 3600000);
    const mins = Math.floor((totalMs % 3600000) / 60000);
    const secs = Math.floor((totalMs % 60000) / 1000);
    const ms = Math.floor((totalMs % 1000) / 10);
    const hh = String(hours).padStart(2, '0');
    const mm = String(mins).padStart(2, '0');
    const ss = String(secs).padStart(2, '0');
    const msStr = String(ms).padStart(2, '0');
    const sign = negative ? '−' : '';
    if (showMillis) {
      return { html: `${sign}${hh}<span class="colon">:</span>${mm}<span class="colon">:</span>${ss}<span class="millis">.${msStr}</span>`, hh, mm, ss, ms: msStr, negative };
    }
    return { html: `${sign}${hh}:${mm}:${ss}`, hh, mm, ss, ms: msStr, negative };
  }
  function formatSimple(totalMs) {
    const f = formatTime(totalMs, false);
    return `${f.negative ? '−' : ''}${f.hh}:${f.mm}:${f.ss}`;
  }
  function formatDiff(diffMs) {
    if (diffMs === 0) return '±0.00';
    const sign = diffMs > 0 ? '+' : '';
    const absMs = Math.abs(diffMs);
    const mins = Math.floor(absMs / 60000);
    const secs = Math.floor((absMs % 60000) / 1000);
    const ms = Math.floor((absMs % 1000) / 10);
    return `${sign}${mins > 0 ? mins + ':' : ''}${String(secs).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
  }
  const stopwatchState = {
    running: false,
    startTime: 0,
    elapsedBeforePause: 0,
    lapStartTime: 0,
    laps: [],
    displayMs: 0,
    rafId: null,
  };
  function tickStopwatch() {
    if (!stopwatchState.running) return;
    const now = performance.now();
    stopwatchState.displayMs = stopwatchState.elapsedBeforePause + (now - stopwatchState.startTime);
    updateSwDisplay();
    stopwatchState.rafId = requestAnimationFrame(tickStopwatch);
  }
  function updateSwDisplay() {
    const f = formatTime(stopwatchState.displayMs, true);
    swDisplay.innerHTML = f.html;
  }
  function startStopwatch() {
    stopwatchState.running = true;
    stopwatchState.startTime = performance.now();
    updateAllButtons();
    stopwatchState.rafId = requestAnimationFrame(tickStopwatch);
  }
  function pauseStopwatch() {
    stopwatchState.running = false;
    if (stopwatchState.rafId) {
      cancelAnimationFrame(stopwatchState.rafId);
      stopwatchState.rafId = null;
    }
    stopwatchState.elapsedBeforePause = stopwatchState.displayMs;
    updateAllButtons();
  }
  function resetStopwatch() {
    if (stopwatchState.rafId) {
      cancelAnimationFrame(stopwatchState.rafId);
      stopwatchState.rafId = null;
    }
    stopwatchState.running = false;
    stopwatchState.elapsedBeforePause = 0;
    stopwatchState.displayMs = 0;
    stopwatchState.laps = [];
    updateSwDisplay();
    updateAllButtons();
    renderLaps();
  }
  function recordLap() {
    const totalMs = stopwatchState.displayMs;
    const prevTotal = stopwatchState.laps.length > 0
      ? stopwatchState.laps[stopwatchState.laps.length - 1].totalMs
      : 0;
    const lapMs = totalMs - prevTotal;
    stopwatchState.laps.push({ totalMs, lapMs });
    renderLaps();
  }
  function renderLaps() {
    lapList.innerHTML = '';
    if (stopwatchState.laps.length === 0) {
      lapList.innerHTML = '<li class="no-laps">暂无计次记录</li>';
      return;
    }
    let bestIdx = 0;
    let worstIdx = 0;
    for (let i = 1; i < stopwatchState.laps.length; i++) {
      if (stopwatchState.laps[i].lapMs < stopwatchState.laps[bestIdx].lapMs) bestIdx = i;
      if (stopwatchState.laps[i].lapMs > stopwatchState.laps[worstIdx].lapMs) worstIdx = i;
    }
    const reversed = [...stopwatchState.laps].reverse();
    for (let i = 0; i < reversed.length; i++) {
      const lapNum = reversed.length - i;
      const lap = reversed[i];
      const origIdx = stopwatchState.laps.length - 1 - i;
      let cls = '';
      if (stopwatchState.laps.length > 1) {
        if (origIdx === bestIdx) cls = 'best';
        else if (origIdx === worstIdx) cls = 'worst';
      }
      const prevOrigIdx = origIdx - 1;
      let diffHtml = '—';
      let diffClass = '';
      if (prevOrigIdx >= 0) {
        const diffMs = lap.lapMs - stopwatchState.laps[prevOrigIdx].lapMs;
        diffHtml = formatDiff(diffMs);
        if (diffMs > 0) diffClass = 'positive';
        else if (diffMs === 0) diffClass = 'zero';
      }
      const lapFmt = formatSimple(lap.lapMs);
      const totalFmt = formatSimple(lap.totalMs);
      const li = document.createElement('li');
      li.className = `lap-item ${cls}`;
      li.innerHTML = `
        <span class="lap-num">${lapNum}</span>
        <span>${lapFmt}</span>
        <span>${totalFmt}</span>
        <span class="lap-diff ${diffClass}">${diffHtml}</span>
      `;
      lapList.appendChild(li);
    }
  }
  const countdownState = {
    running: false,
    totalMs: 300000,
    remainingMs: 300000,
    startTime: 0,
    remainingBeforePause: 300000,
    rafId: null,
    alarmed: false,
  };
  function readInputTime() {
    const h = parseInt(cdHours.value, 10) || 0;
    const m = parseInt(cdMinutes.value, 10) || 0;
    const s = parseInt(cdSeconds.value, 10) || 0;
    return (h * 3600 + m * 60 + s) * 1000;
  }
  function applyInputTime() {
    const totalMs = readInputTime();
    countdownState.totalMs = totalMs;
    countdownState.remainingMs = totalMs;
    countdownState.remainingBeforePause = totalMs;
    countdownState.alarmed = false;
    appContainer.classList.remove('flash');
    updateCdDisplay();
    updateRing();
    updateCdDisplayClasses();
  }
  function setPresetTime(ms) {
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    cdHours.value = h;
    cdMinutes.value = m;
    cdSeconds.value = s;
    applyInputTime();
  }
  function tickCountdown() {
    if (!countdownState.running) return;
    const now = performance.now();
    const elapsed = now - countdownState.startTime;
    countdownState.remainingMs = countdownState.remainingBeforePause - elapsed;
    if (countdownState.remainingMs <= 0) {
      countdownState.remainingMs = 0;
      countdownState.running = false;
      if (countdownState.rafId) {
        cancelAnimationFrame(countdownState.rafId);
        countdownState.rafId = null;
      }
      updateCdDisplay();
      updateRing();
      updateAllButtons();
      triggerAlarm();
      return;
    }
    updateCdDisplay();
    updateRing();
    updateCdDisplayClasses();
    countdownState.rafId = requestAnimationFrame(tickCountdown);
  }
  function updateCdDisplay() {
    const f = formatTime(countdownState.remainingMs, true);
    cdDisplay.innerHTML = f.html;
    const pct = countdownState.totalMs > 0
      ? Math.round((countdownState.remainingMs / countdownState.totalMs) * 100)
      : 0;
    percentLabel.textContent = countdownState.remainingMs > 0
      ? `剩余 ${pct}%`
      : '时间到！';
  }
  function updateCdDisplayClasses() {
    cdDisplay.classList.remove('warning', 'danger', 'finished');
    if (countdownState.remainingMs <= 0) {
      cdDisplay.classList.add('finished');
    } else if (countdownState.totalMs > 0 && countdownState.remainingMs / countdownState.totalMs < 0.1) {
      cdDisplay.classList.add('danger');
    } else if (countdownState.totalMs > 0 && countdownState.remainingMs / countdownState.totalMs < 0.3) {
      cdDisplay.classList.add('warning');
    }
  }
  function updateRing() {
    const total = countdownState.totalMs;
    const remaining = countdownState.remainingMs;
    const fraction = total > 0 ? remaining / total : 1;
    const offset = CIRCUMFERENCE * (1 - fraction);
    ringProgress.style.strokeDashoffset = offset;
    ringProgress.classList.remove('warning', 'danger');
    if (remaining <= 0) {
      ringProgress.style.stroke = 'var(--danger)';
    } else if (fraction < 0.1) {
      ringProgress.classList.add('danger');
    } else if (fraction < 0.3) {
      ringProgress.classList.add('warning');
    }
    ringPercent.textContent = Math.round(fraction * 100) + '%';
  }
  function startCountdown() {
    if (countdownState.remainingMs <= 0) return;
    countdownState.running = true;
    countdownState.alarmed = false;
    appContainer.classList.remove('flash');
    countdownState.startTime = performance.now();
    countdownState.remainingBeforePause = countdownState.remainingMs;
    updateAllButtons();
    countdownState.rafId = requestAnimationFrame(tickCountdown);
  }
  function pauseCountdown() {
    countdownState.running = false;
    if (countdownState.rafId) {
      cancelAnimationFrame(countdownState.rafId);
      countdownState.rafId = null;
    }
    countdownState.remainingBeforePause = countdownState.remainingMs;
    updateAllButtons();
  }
  function resetCountdown() {
    if (countdownState.rafId) {
      cancelAnimationFrame(countdownState.rafId);
      countdownState.rafId = null;
    }
    countdownState.running = false;
    countdownState.alarmed = false;
    appContainer.classList.remove('flash');
    stopAlarm();
    applyInputTime();
    updateAllButtons();
  }
  let alarmCtx = null;
  let alarmOsc = null;
  let alarmInterval = null;
  function triggerAlarm() {
    if (countdownState.alarmed) return;
    countdownState.alarmed = true;
    appContainer.classList.add('flash');
    setTimeout(() => appContainer.classList.remove('flash'), 4000);
    try {
      alarmCtx = new (window.AudioContext || window.webkitAudioContext)();
      let beepCount = 0;
      const maxBeeps = 12;
      function beep() {
        if (beepCount >= maxBeeps) {
          stopAlarm();
          return;
        }
        const osc = alarmCtx.createOscillator();
        const gain = alarmCtx.createGain();
        osc.connect(gain);
        gain.connect(alarmCtx.destination);
        osc.frequency.value = beepCount % 2 === 0 ? 880 : 660;
        osc.type = 'square';
        gain.gain.setValueAtTime(0.3, alarmCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, alarmCtx.currentTime + 0.2);
        osc.start(alarmCtx.currentTime);
        osc.stop(alarmCtx.currentTime + 0.25);
        beepCount++;
        alarmInterval = setTimeout(beep, 500);
      }
      beep();
    } catch (e) {
    }
  }
  function stopAlarm() {
    if (alarmInterval) {
      clearTimeout(alarmInterval);
      alarmInterval = null;
    }
    if (alarmCtx) {
      alarmCtx.close().catch(() => {});
      alarmCtx = null;
    }
    alarmOsc = null;
  }
  function updateAllButtons() {
    if (stopwatchState.running) {
      swStartBtn.textContent = '暂停';
      swStartBtn.className = 'btn btn-pause';
      swLapBtn.disabled = false;
      swLapBtn.style.opacity = '1';
      swResetBtn.style.display = '';
    } else {
      swStartBtn.textContent = '开始';
      swStartBtn.className = 'btn btn-start';
      swLapBtn.disabled = stopwatchState.displayMs === 0;
      swLapBtn.style.opacity = stopwatchState.displayMs === 0 ? '0.4' : '1';
      swResetBtn.style.display = '';
    }
    if (stopwatchState.displayMs === 0 && !stopwatchState.running) {
      swLapBtn.disabled = true;
      swLapBtn.style.opacity = '0.4';
    }
    if (countdownState.running) {
      cdStartBtn.textContent = '暂停';
      cdStartBtn.className = 'btn btn-pause';
    } else {
      cdStartBtn.textContent = '开始';
      cdStartBtn.className = 'btn btn-start';
    }
    const showInput = !countdownState.running && countdownState.remainingMs === countdownState.totalMs;
    timeInputRow.style.display = showInput ? '' : 'none';
    presetRow.style.display = showInput ? '' : 'none';
  }
  swStartBtn.addEventListener('click', () => {
    if (stopwatchState.running) {
      pauseStopwatch();
    } else {
      startStopwatch();
    }
  });
  swLapBtn.addEventListener('click', () => {
    if (stopwatchState.running) {
      recordLap();
    }
  });
  swResetBtn.addEventListener('click', () => {
    resetStopwatch();
  });
  cdStartBtn.addEventListener('click', () => {
    if (countdownState.running) {
      pauseCountdown();
    } else {
      startCountdown();
    }
  });
  cdResetBtn.addEventListener('click', () => {
    resetCountdown();
  });
  $$('.adj-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (countdownState.running) return;
      const target = document.getElementById(btn.dataset.target);
      const dir = parseInt(btn.dataset.dir, 10);
      const max = target.id === 'cdHours' ? 99 : 59;
      let val = parseInt(target.value, 10) || 0;
      val += dir;
      if (val < 0) val = 0;
      if (val > max) val = max;
      target.value = val;
      applyInputTime();
    });
  });
  $$('.btn-preset').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (countdownState.running) return;
      const ms = parseInt(btn.dataset.preset, 10);
      setPresetTime(ms);
      $$('.btn-preset').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      const activePanel = panelStopwatch.classList.contains('active') ? 'stopwatch' : 'countdown';
      if (activePanel === 'stopwatch') {
        if (stopwatchState.running) pauseStopwatch();
        else startStopwatch();
      } else {
        if (countdownState.running) pauseCountdown();
        else startCountdown();
      }
    }
    if (e.code === 'KeyL' && panelStopwatch.classList.contains('active')) {
      if (stopwatchState.running) recordLap();
    }
    if (e.code === 'KeyR') {
      e.preventDefault();
      const activePanel = panelStopwatch.classList.contains('active') ? 'stopwatch' : 'countdown';
      if (activePanel === 'stopwatch') resetStopwatch();
      else resetCountdown();
    }
  });
  updateSwDisplay();
  updateCdDisplay();
  updateRing();
  updateAllButtons();
  $$('.btn-preset').forEach(b => b.classList.remove('active'));
  const fiveMinPreset = document.querySelector('.btn-preset[data-preset="300"]');
  if (fiveMinPreset) fiveMinPreset.classList.add('active');
  window.addEventListener('beforeunload', () => {
    if (stopwatchState.rafId) cancelAnimationFrame(stopwatchState.rafId);
    if (countdownState.rafId) cancelAnimationFrame(countdownState.rafId);
    stopAlarm();
  });
})();
</script>
