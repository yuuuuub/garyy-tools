<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地铁跑酷</title>
<meta name="description" content="地铁跑酷游戏，在铁轨上奔跑收集金币">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{border:2px solid var(--border);border-radius:8px;display:block}
.ui{display:flex;gap:16px;margin-bottom:12px;font-size:14px}
.ui span{background:var(--card);padding:6px 14px;border-radius:6px;border:1px solid var(--border)}
.btn{background:var(--accent);color:var(--text);border:none;padding:10px 24px;border-radius:6px;font-size:16px;cursor:pointer;margin-top:12px}
.btn:hover{opacity:.85}
#overlay{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,17,23,.9);border-radius:12px;padding:32px;text-align:center}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="地铁跑酷">
  <meta property="og:description" content="地铁跑酷游戏，在铁轨上奔跑收集金币">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/subway-surf/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1 style="text-align:center;padding:20px 0;font-size:1.5rem">地铁跑酷</h1>
<div class="ui">
<span id="scoreText">分数: 0</span>
<span id="coinsText">金币: 0</span>
<span id="speedText">速度: 1.0x</span>
</div>
<div style="position:relative">
<canvas id="c" width="420" height="600"></canvas>
<div id="overlay">
<h2>地铁跑酷</h2>
<p style="margin:10px 0;color:#8b949e">地铁轨道奔跑，三跑道切换，跳跃翻滚躲避火车！</p>
<button class="btn" onclick="startGame()">开始游戏</button>
<p style="margin-top:8px;font-size:12px;color:#8b949e">← → 切换跑道 | ↑ 跳跃 | ↓ 翻滚</p>
</div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=420,H=600,LANES=3;
const LANE_X=[90,210,330];
let player,trains,obstacles,coins,speed,baseSpeed,distance,score,coinCount,gameState='idle',animFrame;
const overlay=document.getElementById('overlay');
const trainColors=['#3b82f6','#f85149','#2ea043','#f0883e','#a371f7'];
function init(){
  player={lane:1,vy:0,onGround:true,rolling:false,rollTimer:0,jumpTimer:0};
  trains=[];obstacles=[];coins=[];speed=5;baseSpeed=5;distance=0;score=0;coinCount=0;
}
function startGame(){init();gameState='playing';overlay.style.display='none';if(animFrame)cancelAnimationFrame(animFrame);loop()}
function spawnTrain(){
  const lane=Math.floor(Math.random()*LANES);
  const h=80+Math.random()*60;
  const double=Math.random()>0.7;
  trains.push({lane,y:H+h,w:70,h,color:trainColors[Math.floor(Math.random()*trainColors.length)]});
  if(double){
    let lane2=(lane+1+(Math.random()>0.5?1:0))%LANES;
    trains.push({lane:lane2,y:H+h+10,w:70,h:60,color:trainColors[Math.floor(Math.random()*trainColors.length)]});
  }
}
function spawnCoin(){
  const lane=Math.floor(Math.random()*LANES);
  for(let i=0;i<3;i++){
    coins.push({lane,y:H+40+i*30,r:8});
  }
}
function update(){
  const p=player;
  speed=baseSpeed+distance*0.00015;
  distance+=speed;score=Math.floor(distance/5);
  p.vy+=0.8;p.jumpTimer+=p.vy;
  if(p.jumpTimer>=0){p.jumpTimer=0;p.vy=0;p.onGround=true}
  if(p.rolling){p.rollTimer--;if(p.rollTimer<=0)p.rolling=false}
  if(Math.random()<0.025)spawnTrain();
  if(Math.random()<0.04)spawnCoin();
  for(const t of trains)t.y-=speed*0.8;
  for(const c of coins)c.y-=speed*0.8;
  while(trains.length&&trains[0].y<-150)trains.shift();
  while(coins.length&&coins[0].y<-30)coins.shift();
  for(const t of trains){
    if(t.lane===p.lane){
      const pH=p.rolling?20:45;
      const pY=H-80+p.jumpTimer*0.3;
      if(Math.abs(pY-t.y)<(t.h+pH)/2&&Math.abs(LANE_X[p.lane]-LANE_X[t.lane])<60){
        if(p.rolling)continue;
        gameState='dead';showOverlay('游戏结束','分数: '+score+' | 金币: '+coinCount,'重新开始');return;
      }
    }
  }
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    if(c.lane===p.lane&&Math.abs(H-80-c.y)<25){coinCount++;coins.splice(i,1);score+=10}
  }
}
function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0d1117');grad.addColorStop(0.3,'#161b22');grad.addColorStop(1,'#21262d');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  for(let i=0;i<LANES;i++){
    const x=LANE_X[i];
    ctx.fillStyle='#1a1f27';ctx.fillRect(x-35,0,70,H);
    ctx.strokeStyle='#30363d';ctx.setLineDash([8,8]);
    ctx.beginPath();ctx.moveTo(x-25,0);ctx.lineTo(x-25,H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+25,0);ctx.lineTo(x+25,H);ctx.stroke();
    ctx.setLineDash([]);
  }
  for(const t of trains){
    ctx.fillStyle=t.color;
    const tw=60,th=t.h;
    ctx.fillRect(LANE_X[t.lane]-tw/2,t.y-th/2,tw,th);
    ctx.fillStyle='rgba(255,255,255,0.15)';
    ctx.fillRect(LANE_X[t.lane]-tw/2+5,t.y-th/2+5,tw-10,th-10);
    ctx.fillStyle='rgba(255,255,255,0.3)';
    for(let w=0;w<3;w++){
      ctx.fillRect(LANE_X[t.lane]-tw/2+8,t.y-th/2+8+w*18,tw-16,10);
    }
  }
  ctx.fillStyle='#f0c000';
  for(const c of coins){
    ctx.beginPath();ctx.arc(LANE_X[c.lane],c.y,c.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#0d1117';ctx.font='bold 10px sans-serif';ctx.fillText('$',LANE_X[c.lane]-4,c.y+4);ctx.fillStyle='#f0c000';
  }
  const p=player;
  const px=LANE_X[p.lane];
  const py=H-80+p.jumpTimer*0.3;
  if(p.rolling){
    ctx.fillStyle='#3b82f6';ctx.beginPath();ctx.arc(px,py,16,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='#3b82f6';ctx.fillRect(px-14,py-45,28,45);
    ctx.fillStyle='#fff';ctx.fillRect(px-7,py-37,5,5);ctx.fillRect(px+2,py-37,5,5);
    const leg=Math.sin(Date.now()*0.012)*4;
    ctx.fillRect(px-10,py,6,10+leg);ctx.fillRect(px+4,py,6,10-leg);
  }
  document.getElementById('scoreText').textContent='分数: '+score;
  document.getElementById('coinsText').textContent='金币: '+coinCount;
  document.getElementById('speedText').textContent='速度: '+(speed/baseSpeed).toFixed(1)+'x';
}
function showOverlay(t,d,b){overlay.querySelector('h2').textContent=t;overlay.querySelector('p').textContent=d;overlay.querySelector('.btn').textContent=b;overlay.style.display='flex'}
function jump(){if(gameState!=='playing')return;if(player.onGround){player.vy=-13;player.onGround=false}}
function roll(){if(gameState!=='playing'||!player.onGround)return;player.rolling=true;player.rollTimer=25}
function switchLane(d){if(gameState!=='playing')return;const n=player.lane+d;if(n>=0&&n<LANES)player.lane=n}
function loop(){if(gameState!=='playing')return;update();draw();animFrame=requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft')switchLane(-1);if(e.code==='ArrowRight')switchLane(1);
  if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='ArrowDown')roll();
});
canvas.addEventListener('touchstart',e=>{e.preventDefault();canvas._tx=e.touches[0].clientX;canvas._ty=e.touches[0].clientY});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-canvas._tx,dy=e.changedTouches[0].clientY-canvas._ty;
  if(Math.abs(dx)>Math.abs(dy))switchLane(dx>0?1:-1);
  else if(dy<-30)jump();else if(dy>30)roll();
});
init();draw();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
