<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS游乐场 - 在线JavaScript编辑器</title>
<meta name="description" content="JavaScript在线编辑器，实时运行JS代码片段">
<style>
:root {
--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
nav .logo{font-size:18px;font-weight:600;color:var(--accent2);}
nav a{color:var(--accent);text-decoration:none;font-size:14px;}
nav a:hover{color:var(--accent2);}
.container{display:flex;flex-direction:column;height:calc(100vh - 52px);}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s;}
.btn-primary{background:var(--success);color:var(--text);}
.btn-primary:hover{background:#46c45a;}
.btn-secondary{background:var(--border);color:var(--text);}
.btn-secondary:hover{background:#3d444d;}
.workspace{display:flex;flex:1;overflow:hidden;}
.editor-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);}
.console-panel{flex:1;display:flex;flex-direction:column;}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;font-size:13px;color:var(--accent2);font-weight:500;display:flex;justify-content:space-between;align-items:center;}
.editor-wrapper{flex:1;position:relative;}
#jsEditor{width:100%;height:100%;background:var(--bg);border:none;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:14px;padding:12px;resize:none;outline:none;line-height:1.6;}
.console-output{flex:1;overflow-y:auto;padding:12px;font-family:"Fira Code",Consolas,monospace;font-size:13px;line-height:1.6;}
.console-item{padding:6px 10px;border-bottom:1px solid var(--border);word-break:break-all;}
.console-item.log{color:var(--text);}
.console-item.error{color:var(--error);background:rgba(248,81,73,0.1);}
.console-item.warn{color:var(--warning);background:rgba(210,153,34,0.1);}
.console-item.info{color:var(--accent2);}
.console-item .prefix{margin-right:8px;font-weight:bold;}
.templates{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;}
.templates span{font-size:12px;color:#8b949e;margin-right:8px;}
.template-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--accent2);cursor:pointer;margin-right:6px;margin-bottom:4px;}
.template-btn:hover{border-color:var(--accent);color:var(--accent);}
@media(max-width:768px){
.workspace{flex-direction:column;}
.editor-panel{border-right:none;border-bottom:1px solid var(--border);}
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="JS游乐场 - 在线JavaScript编辑器">
  <meta property="og:description" content="JavaScript在线编辑器，实时运行JS代码片段">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/js-playground/">
</head>
<body>
<h1 style="text-align:center;padding:20px 0;font-size:1.5rem">JS游乐场 - 在线JavaScript编辑器</h1>
<nav>
<span class="logo">JS游乐场</span>
<a href="/index.html">← 返回工具箱</a>
</nav>
<div class="container">
<div class="toolbar">
<button class="btn btn-primary" onclick="runCode()">▶ 运行</button>
<button class="btn btn-secondary" onclick="clearConsole()">清空控制台</button>
<button class="btn btn-secondary" onclick="copyCode()">复制代码</button>
<button class="btn btn-secondary" onclick="resetCode()">重置</button>
</div>
<div class="templates">
<span>模板:</span>
<button class="template-btn" data-code="// 基础语法\nconst name = 'JavaScript';\nconsole.log(`Hello, ${name}!`);">基础语法</button>
<button class="template-btn" data-code="// 数组操作\nconst arr = [1, 2, 3, 4, 5];\nconsole.log('原数组:', arr);\nconsole.log('过滤偶数:', arr.filter(x => x % 2 === 0));\nconsole.log('平方:', arr.map(x => x * x));\nconsole.log('求和:', arr.reduce((a, b) => a + b, 0));">数组操作</button>
<button class="template-btn" data-code="// 异步编程\nasync function fetchData() {\n  console.log('开始请求...');\n  await new Promise(r => setTimeout(r, 1000));\n  console.log('请求完成!');\n  return { data: '模拟数据' };\n}\n\nfetchData().then(result => {\n  console.log('结果:', result);\n});">异步编程</button>
<button class="template-btn" data-code="// 类和继承\nclass Animal {\n  constructor(name) {\n    this.name = name;\n  }\n  speak() {\n    console.log(`${this.name}发出声音`);\n  }\n}\n\nclass Dog extends Animal {\n  speak() {\n    console.log(`${this.name}汪汪叫`);\n  }\n}\n\nconst dog = new Dog('小狗');\ndog.speak();">类和继承</button>
<button class="template-btn" data-code="// 解构赋值\nconst user = {\n  name: '张三',\n  age: 25,\n  hobbies: ['编程', '阅读']\n};\n\nconst { name, age, hobbies } = user;\nconsole.log('姓名:', name);\nconsole.log('年龄:', age);\nconsole.log('爱好:', hobbies.join(', '));">解构赋值</button>
<button class="template-btn" data-code="// Map和Set\nconst map = new Map();\nmap.set('name', '李四');\nmap.set('age', 30);\nconsole.log('Map:', map);\nconsole.log('获取name:', map.get('name'));\n\nconst set = new Set([1, 2, 2, 3, 3, 3]);\nconsole.log('Set:', set);\nconsole.log('去重后:', [...set]);">Map和Set</button>
</div>
<div class="workspace">
<div class="editor-panel">
<div class="panel-header">JavaScript代码</div>
<div class="editor-wrapper">
<textarea id="jsEditor">// 在这里编写JavaScript代码
// 点击"运行"按钮执行代码

console.log('Hello, JavaScript!');
console.info('这是一条信息');
console.warn('这是一条警告');
console.error('这是一条错误');

// 尝试修改代码并运行
const numbers = [1, 2, 3, 4, 5];
const doubled = numbers.map(n => n * 2);
console.log('原数组:', numbers);
console.log('翻倍:', doubled);</textarea>
</div>
</div>
<div class="console-panel">
<div class="panel-header">
<span>控制台输出</span>
<span id="consoleCount" style="color:#8b949e;font-size:12px;">0 条日志</span>
</div>
<div class="console-output" id="consoleOutput">
<div style="color:#8b949e;font-size:13px;">点击"运行"执行代码</div>
</div>
</div>
</div>
</div>
<script>
const jsEditor=document.getElementById('jsEditor');
const consoleOutput=document.getElementById('consoleOutput');
const consoleCount=document.getElementById('consoleCount');
let logCount=0;
function clearConsole(){
consoleOutput.innerHTML='';
logCount=0;
consoleCount.textContent='0 条日志';
}
function addLog(type,prefix,args){
const item=document.createElement('div');
item.className='console-item '+type;
const text=args.map(arg=>{
if(typeof arg==='object')try{return JSON.stringify(arg,null,2);catch(e){return String(arg);}}
return String(arg);
}).join(' ');
item.innerHTML=`<span class="prefix">[${prefix}]</span>${escapeHtml(text)}`;
consoleOutput.appendChild(item);
consoleOutput.scrollTop(consoleOutput.scrollHeight);
logCount++;
consoleCount.textContent=logCount+' 条日志';
}
function escapeHtml(t){
return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function runCode(){
clearConsole();
const code=jsEditor.value;
const originalLog=console.log;
const originalError=console.error;
const originalWarn=console.warn;
const originalInfo=console.info;
console.log=(...args)=>{addLog('log','LOG',args);originalLog.apply(console,args);};
console.error=(...args)=>{addLog('error','ERROR',args);originalError.apply(console,args);};
console.warn=(...args)=>{addLog('warn','WARN',args);originalWarn.apply(console,args);};
console.info=(...args)=>{addLog('info','INFO',args);originalInfo.apply(console,args);};
try{
const sandboxConsole={log:(...a)=>
  <meta property="og:image" content="https://garyy.top/og-image.png">addLog('log','LOG',a),error:(...a)=>addLog('error','ERROR',a),warn:(...a)=>addLog('warn','WARN',a),info:(...a)=>addLog('info','INFO',a)};
const fn=new Function('console',code);
fn(sandboxConsole);
}catch(e){
addLog('error','EXCEPTION',[e.message]);
}
console.log=originalLog;
console.error=originalError;
console.warn=originalWarn;
console.info=originalInfo;
}
function copyCode(){
navigator.clipboard.writeText(jsEditor.value).then(()=>garyyToast('代码已复制到剪贴板'));
}
function resetCode(){
jsEditor.value='
clearConsole();
}
document.querySelectorAll('.template-btn').forEach(btn=>{
btn.onclick=()=>{
jsEditor.value=btn.dataset.code;
clearConsole();
};
});
jsEditor.addEventListener('keydown',e=>{
if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){
e.preventDefault();
runCode();
}
});
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
