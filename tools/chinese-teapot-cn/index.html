<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国紫砂壶 - Chinese Yixing Teapots</title>
<meta name="description" content="中国紫砂壶百科，紫砂泥料、名家名作、壶型鉴赏、冲泡技巧、收藏指南">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国紫砂壶 - Chinese Yixing Teapots">
<meta property="og:description" content="中国紫砂壶百科，紫砂泥料、名家名作、壶型鉴赏、冲泡技巧、收藏指南">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-teapot-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫖</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#a0522d;--accent2:#8b4513}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#9a3412;--accent2:#7c2d12}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0f05 0%,#2a1a0a 50%,#3a2510 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3a18;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#a0522d,#8b4513,#cd853f,#deb887);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.tea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.tea-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.tea-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.tea-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.tea-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tea-card .t-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(160,82,45,0.15);color:var(--accent)}
.tea-card .t-name{font-size:1.3em;font-weight:bold}
.tea-card .t-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.tea-card .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tea-card .t-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.tea-card .t-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.tea-card .t-detail strong{color:var(--text)}
.tea-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.tea-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🫖 中国紫砂壶</h1>
<p>Chinese Yixing Teapots — 人间珠玉安足取，岂如阳羡溪头一丸土</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索紫砂壶...（如"朱泥""西施壶""顾景舟"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="泥料种类">🪨 泥料种类</button>
<button class="filter-btn" data-filter="经典壶型">🏺 经典壶型</button>
<button class="filter-btn" data-filter="名家大师">👨‍🎨 名家大师</button>
<button class="filter-btn" data-filter="冲泡指南">🫖 冲泡指南</button>
<button class="filter-btn" data-filter="收藏保养">💰 收藏保养</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="tea-grid" id="teaGrid"></div>
<footer><p>🫖 中国紫砂壶 — 人间珠玉安足取，岂如阳羡溪头一丸土</p></footer>
</div>
<script>
const TEA_DATA=[
  {id:1,name:"紫泥",en:"Purple Clay (Zini)",category:"泥料种类",icon:"🪨",summary:"最经典的紫砂泥",detail:"紫泥是紫砂壶最常用的泥料，颜色呈紫棕色。质地细腻，可塑性强，烧成温度约1150°C。紫泥壶透气性好，适合泡各种茶类，尤其是乌龙茶和普洱茶。",origin:"江苏宜兴丁蜀镇",usage:"制作各类紫砂壶的基础泥料"},
  {id:2,name:"朱泥",en:"Vermilion Clay (Zhuni)",category:"泥料种类",icon:"🔴",summary:"细腻如脂的红泥",detail:"朱泥是紫砂泥中最细腻的一种，颜色鲜红或橘红。收缩率高达25%以上，制作难度大，成品率低。朱泥壶密度高，适合冲泡铁观音等高香茶类，能很好地保留茶香。",origin:"宜兴赵庄、黄龙山",usage:"冲泡铁观音、高山乌龙的最佳选择"},
  {id:3,name:"段泥",en:"Segment Clay (Duanni)",category:"泥料种类",icon:"🟡",summary:"金黄素雅的泥料",detail:"段泥又称团泥，是紫泥和绿泥的天然混合。颜色呈金黄、米黄或青灰色，质地疏松，透气性极好。段泥壶适合泡绿茶、白茶等清淡茶类，不会夺茶香。",origin:"宜兴黄龙山",usage:"绿茶和白茶冲泡的理想泥料"},
  {id:4,name:"底槽清",en:"Bottom Slot Pure",category:"泥料种类",icon:"🟤",summary:"紫泥中的极品",detail:"底槽清是紫泥中最优质的品种，因产于矿层底部而得名。质地极其细腻温润，烧成后呈深紫色，有'紫玉金砂'之美誉。底槽清壶泡茶醇厚，是藏家追捧的珍品。",origin:"宜兴黄龙山",usage:"高端紫砂壶的顶级泥料"},
  {id:5,name:"西施壶",en:"Xishi Teapot",category:"经典壶型",icon:"🫖",summary:"最美的壶型",detail:"西施壶以中国古代美女西施命名，壶身圆润饱满，壶嘴短小可爱，壶把柔和优美。整体线条流畅，如同美人的丰腴体态。是最受欢迎的经典壶型之一。",origin:"明代时大彬",usage:"适合冲泡各类茶，收藏与实用兼备"},
  {id:6,name:"石瓢壶",en:"Stone Ladle Teapot",category:"经典壶型",icon:"🏺",summary:"文人壶的代表",detail:"石瓢壶造型简洁古朴，壶身呈三角形，壶嘴直而有力，壶把呈三角形。'弱水三千，只取一瓢饮'的文人意境。石瓢壶实用性强，出水流畅，是实用与艺术的完美结合。",origin:"清代陈曼生",usage:"日常品茶和文人茶会的首选"},
  {id:7,name:"仿古壶",en:"Antique Teapot",category:"经典壶型",icon:"🏛️",summary:"古朴典雅",detail:"仿古壶壶身扁圆，壶盖平整，壶嘴和壶把对称协调。整体造型古朴端庄，有大将之风。'仿古'意为仿效古代器物的造型。是邵大亨的代表作之一。",origin:"清代邵大亨",usage:"商务茶会和正式品茶场合"},
  {id:8,name:"掇球壶",en:"Stacked Ball Teapot",category:"经典壶型",icon:"⭕",summary:"球体的极致",detail:"掇球壶由三个球体叠加而成：壶身是大球，壶盖是中球，壶钮是小球。造型圆润饱满，比例协调，有'大珠小珠落玉盘'之美。是几何形壶型的经典之作。",origin:"清代程寿珍",usage:"收藏鉴赏与日常冲泡"},
  {id:9,name:"顾景舟",en:"Gu Jingzhou",category:"名家大师",icon:"👨‍🎨",summary:"壶艺泰斗",detail:"顾景舟（1915-1996）被誉为'壶艺泰斗'、'一代宗师'。其作品造型端庄，工艺精湛，线条流畅，代表了紫砂壶艺术的最高成就。其作品拍卖价格屡创新高。",origin:"宜兴紫砂世家",usage:"紫砂壶收藏的顶级选择"},
  {id:10,name:"时大彬",en:"Shi Dabin",category:"名家大师",icon:"👨‍🎨",summary:"明代壶艺宗师",detail:"时大彬是明代最著名的紫砂壶大师，被誉为'千载一时'。他改良了紫砂壶的成型工艺，从大壶改为小壶，适应了品茶方式的变革。其作品存世极少，极为珍贵。",origin:"明代万历年间",usage:"紫砂壶历史上的里程碑人物"},
  {id:11,name:"陈鸣远",en:"Chen Mingyuan",category:"名家大师",icon:"👨‍🎨",summary:"花货之祖",detail:"陈鸣远是清代初期的紫砂壶大师，擅长制作自然形态的'花货'。他将松竹梅、瓜果蔬菜等自然元素融入壶型设计，开创了紫砂花货的先河。作品生动自然，充满生活情趣。",origin:"清初宜兴",usage:"紫砂花货艺术的开创者"},
  {id:12,name:"一壶一茶",en:"One Pot, One Tea",category:"冲泡指南",icon:"🫖",summary:"专壶专用",detail:"紫砂壶具有吸味性，长期泡某种茶会吸收其香味。因此建议一壶只泡一种茶，避免串味。泡乌龙茶的壶不要再泡绿茶，否则会影响茶汤的纯正口感。",origin:"紫砂壶特性",usage:"使用紫砂壶的基本原则"},
  {id:13,name:"开壶养壶",en:"Opening and Nurturing",category:"冲泡指南",icon:"🔥",summary:"新壶的第一次",detail:"新买的紫砂壶需要'开壶'：先用清水内外冲洗，然后放入锅中加茶叶煮沸，最后自然冷却。开壶能去除窑火气和杂味。养壶要常用，每次泡完茶用热水冲洗，自然阴干。",origin:"紫砂壶使用传统",usage:"新壶使用前的必要步骤"},
  {id:14,name:"冲泡温度",en:"Brewing Temperature",category:"冲泡指南",icon:"🌡️",summary:"温度的掌控",detail:"紫砂壶保温性好，冲泡时水温要略低于玻璃杯。绿茶用80-85°C，乌龙茶用95-100°C，普洱茶用100°C。紫砂壶散热慢，浸泡时间要适当缩短，避免苦涩。",origin:"紫砂壶特性",usage:"用紫砂壶泡茶的温度指南"},
  {id:15,name:"紫砂壶鉴别",en:"Authenticity Guide",category:"收藏保养",icon:"🔍",summary:"真假紫砂壶",detail:"鉴别真假紫砂壶：看（真壶有砂质感，假壶太光滑）、听（真壶声音清脆，假壶声音沉闷）、摸（真壶手感温润，假壶手感粗糙）、闻（真壶有土腥味，假壶有化工味）。",origin:"紫砂壶鉴定传统",usage:"购买紫砂壶时的鉴别方法"},
  {id:16,name:"养壶包浆",en:"Developing Patina",category:"收藏保养",icon:"✨",summary:"时间的艺术",detail:"养壶是用茶汤长期浸润紫砂壶，使其表面形成温润的光泽，称为'包浆'。好的包浆如玉般温润，是时间和用心的结晶。养壶忌急功近利，要自然使用，不可刻意涂抹。",origin:"文人雅趣",usage:"紫砂壶使用过程中的乐趣"},
  {id:17,name:"紫砂壶保养",en:"Pot Care Guide",category:"收藏保养",icon:"🧽",summary:"日常养护",detail:"紫砂壶保养要点：每次用完及时清洗，不用洗涤剂（会破坏包浆）。不能沾油污。不用时放在通风处，不要密封。磕碰后及时修补。一把好壶用几十年会越来越美。",origin:"紫砂壶使用传统",usage:"延长壶寿命的保养方法"},
  {id:18,name:"紫砂壶收藏",en:"Collecting Guide",category:"收藏保养",icon:"💰",summary:"投资与鉴赏",detail:"紫砂壶收藏要注意：选名家作品（有升值潜力）、选精品泥料（原矿紫砂）、选经典壶型（经久不衰）、选精工细作（工艺到位）。新手建议从实用壶开始，逐步进阶。",origin:"现代收藏市场",usage:"紫砂壶投资与收藏的入门指南"},
  {id:19,name:"曼生十八式",en:"Mansheng 18 Styles",category:"经典壶型",icon:"📜",summary:"文人壶经典",detail:"曼生十八式是清代陈曼生设计的十八种经典壶型，将文人书画与紫砂壶完美结合。包括石瓢、横云、井栏、汲直等壶型。每把壶都配有铭文，体现了诗书画印的综合艺术。",origin:"清代陈曼生",usage:"文人紫砂壶的最高成就"},
  {id:20,name:"紫砂壶与茶",en:"Tea-Pot Pairing",category:"冲泡指南",icon:"🍵",summary:"茶壶的搭配",detail:"不同泥料适合不同茶类：朱泥壶泡铁观音（保香），紫泥壶泡普洱（醇厚），段泥壶泡绿茶（清鲜），红泥壶泡红茶（温润）。选对泥料能让茶汤品质提升一个层次。",origin:"实践经验",usage:"根据茶类选择紫砂壶的指南"}
];
function renderCards(data){
  document.getElementById('teaGrid').innerHTML=data.map(t=>`
    <div class="tea-card" data-category="${t.category}">
      <div class="t-header"><div class="t-icon">${t.icon}</div><div><div class="t-name">${t.name}</div><div class="t-sub">${t.en}</div></div></div>
      <div class="t-meta"><span>${t.summary}</span><span>${t.category}</span></div>
      <div class="t-detail">${t.detail}</div>
      <div class="t-detail"><strong>来源：</strong>${t.origin}</div>
      <div class="t-detail"><strong>应用：</strong>${t.usage}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(t=>{cats[t.category]=(cats[t.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">紫砂壶文化</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(TEA_DATA);renderStats(TEA_DATA);
</script>
</body>
</html>
