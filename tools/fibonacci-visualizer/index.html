<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌀 斐波那契可视化</title>
<meta property="og:title" content="🌀 斐波那契可视化">
<meta property="og:description" content="🌀 斐波那契可视化 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="斐波那契数列可视化 - 螺旋线、黄金分割、自然斐波那契图案展示">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌀</text></svg>">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;line-height:1.4}
.hdr{text-align:center;margin-bottom:16px}.hdr h1{font-size:1.6rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.view-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.view-tabs button{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.8rem;transition:all .2s}
.view-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.controls{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.controls label{font-size:.8rem;color:var(--text2)}
.controls input[type=range]{width:200px;accent-color:var(--accent)}
.controls .val{font-size:.85rem;color:var(--accent);font-weight:600;min-width:40px}
canvas{display:block;width:100%;border-radius:8px}
.seq-display{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.seq-item{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-family:monospace;font-size:.8rem}
.seq-item.highlight{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.stat-card .num{font-size:1.1rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.7rem;color:var(--text2);margin-top:4px}
.golden-info{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px;text-align:center}
.golden-info .phi{font-size:2rem;font-weight:700;color:var(--warn)}
.golden-info .desc{font-size:.85rem;color:var(--text2);margin-top:6px}
.nature-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.nature-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.nature-card .icon{font-size:2rem;margin-bottom:6px}
.nature-card .name{font-size:.85rem;font-weight:600}
.nature-card .detail{font-size:.75rem;color:var(--text2);margin-top:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="hdr"><h1>🌀 斐波那契可视化</h1><p>螺旋线、黄金分割、自然斐波那契图案</p></div>
<div class="view-tabs"><button class="active" onclick="setView('spiral')">螺旋线</button><button onclick="setView('golden')">黄金矩形</button><button onclick="setView('sequence')">数列展示</button><button onclick="setView('nature')">自然斐波那契</button><button onclick="setView('sunflower')">向日葵排列</button></div>
<div class="card" id="controlCard">
<div class="controls"><label>项数:</label><input type="range" id="countSlider" min="3" max="20" value="10" oninput="updateCount()"><span class="val" id="countVal">10</span></div>
</div>
<div class="card"><canvas id="mainCanvas"></canvas></div>
<div id="bottomContent"></div>

<script>
const canvas=document.getElementById('mainCanvas');
const ctx=canvas.getContext('2d');
let W,H,curView='spiral',count=10;
const PHI=(1+Math.sqrt(5))/2;
let animProgress=0,animRunning=true;

function fib(n){if(n<=1)return n;let a=0,b=1;for(let i=2;i<=n;i++){[a,b]=[b,a+b]}return b}

function fibSeq(n){const seq=[0,1];for(let i=2;i<n;i++)seq.push(seq[i-1]+seq[i-2]);return seq}

function initCanvas(){
const dpr=window.devicePixelRatio||1;
const rect=canvas.parentElement.getBoundingClientRect();
W=rect.width;H=Math.min(450,window.innerHeight*0.45);
canvas.width=W*dpr;canvas.height=H*dpr;
canvas.style.height=H+'px';
ctx.scale(dpr,dpr);
}

function updateCount(){
count=+document.getElementById('countSlider').value;
document.getElementById('countVal').textContent=count;
animProgress=0;animRunning=true;
draw();
updateBottom();
}

function setView(v){
curView=v;
document.querySelectorAll('.view-tabs button').forEach((b,i)=>['spiral','golden','sequence','nature','sunflower'][i]===v?b.classList.add('active'):b.classList.remove('active'));
document.getElementById('controlCard').style.display=(v==='nature'||v==='sunflower')?'none':'block';
animProgress=0;animRunning=true;
draw();updateBottom();
}

function draw(){
ctx.clearRect(0,0,W,H);
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
ctx.fillRect(0,0,W,H);
if(curView==='spiral')drawSpiral();
else if(curView==='golden')drawGolden();
else if(curView==='sequence')drawSequence();
else if(curView==='nature')drawNature();
else if(curView==='sunflower')drawSunflower();
}

function drawSpiral(){
const seq=fibSeq(count+2);
const maxVal=Math.max(...seq);
const scale=Math.min(W,H)*0.4/maxVal;
const cx=W/2,cy=H/2;
const colors=['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c','#e91e63','#00bcd4','#8bc34a'];
let x=cx,y=cy;
ctx.lineWidth=1;
const drawCount=Math.min(Math.floor(animProgress*seq.length),seq.length);
for(let i=2;i<drawCount&&i<seq.length;i++){
const size=seq[i]*scale*0.8;
const color=colors[i%colors.length];
ctx.strokeStyle=color+'88';ctx.lineWidth=2;
ctx.beginPath();
const angle=i*0.5*animProgress;
const sx=x+Math.cos(angle)*size*0.3;
const sy=y+Math.sin(angle)*size*0.3;
ctx.arc(sx,sy,size,0,Math.PI*2);
ctx.stroke();
ctx.fillStyle=color+'11';ctx.fill();
x+=size*0.7*Math.cos(angle+0.5);
y+=size*0.7*Math.sin(angle+0.5);
}
ctx.strokeStyle='var(--accent)';ctx.lineWidth=2;
ctx.beginPath();
for(let i=0;i<drawCount&&i<seq.length;i++){
const angle=i*PHI*0.5;
const r=seq[i]*scale*0.4*animProgress;
const px=W/2+r*Math.cos(angle);
const py=H/2+r*Math.sin(angle);
i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
}
ctx.stroke();
seq.slice(0,drawCount).forEach((v,i)=>{
const angle=i*PHI*0.5;
const r=v*scale*0.4*animProgress;
const px=W/2+r*Math.cos(angle);
const py=H/2+r*Math.sin(angle);
const size=Math.max(2,Math.min(8,v*0.15));
ctx.fillStyle=`hsl(${i*30},70%,60%)`;
ctx.beginPath();ctx.arc(px,py,size,0,Math.PI*2);ctx.fill();
});
}

function drawGolden(){
const seq=fibSeq(count+2);
const maxVal=Math.max(...seq);
const scale=Math.min(W,H)*0.4/maxVal;
const cx=W/2,cy=H/2;
const colors=['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c','#e91e63'];
let x=cx,y=cy;
let dir=0;
const drawCount=Math.min(Math.floor(animProgress*seq.length),seq.length);
for(let i=2;i<drawCount&&i<seq.length;i++){
const size=seq[i]*scale;
const color=colors[i%colors.length];
ctx.strokeStyle=color;ctx.lineWidth=2;
ctx.strokeRect(x,y,size,size);
ctx.fillStyle=color+'11';ctx.fill();
const spiralAngle=(i-2)*Math.PI/2;
const startA=spiralAngle;const endA=spiralAngle+Math.PI/2;
ctx.beginPath();
const sx=x+size;const sy=y+size;
ctx.arc(sx,sy,size,startA,endA);
ctx.stroke();
if(i%4===0){x+=seq[i-1]*scale}
else if(i%4===1){y-=seq[i-1]*scale}
else if(i%4===2){x-=seq[i-1]*scale}
else{y+=seq[i-1]*scale}
}
const ratio=seq[drawCount-1]/seq[drawCount-2];
if(drawCount>2){
ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='14px monospace';
ctx.fillText(`F(${drawCount-1})/F(${drawCount-2}) = ${ratio.toFixed(6)}`,10,20);
ctx.fillText(`φ = ${PHI.toFixed(6)}`,10,38);
}
}

function drawSequence(){
const seq=fibSeq(count+2);
const maxVal=Math.max(...seq);
const barW=W/(seq.length*1.5);
const drawCount=Math.min(Math.floor(animProgress*seq.length),seq.length);
seq.slice(0,drawCount).forEach((v,i)=>{
const barH=v/maxVal*(H-80);
const x=i*(barW+4)+20;
const y=H-40-barH;
const hue=(i*30)%360;
ctx.fillStyle=`hsl(${hue},65%,55%)`;
ctx.fillRect(x,y,barW,barH);
ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='10px monospace';
ctx.fillText(v,x+barW/2-10,y-5);
ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText(i,x+barW/2-4,H-25);
});
ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='11px sans-serif';
ctx.fillText('斐波那契数列',W/2-40,20);
}

function drawNature(){
const items=[
{icon:'🐚',name:'鹦鹉螺',detail:'壳体截面呈完美对数螺旋，每室比例约1.618'},
{icon:'🌻',name:'向日葵',detail:'种子排列遵循斐波那契螺旋，常见34和55条'},
{icon:'🌀',name:'台风',detail:'气旋云系形成对数螺旋结构'},
{icon:'🌾',name:'松果',detail:'鳞片排列呈斐波那契螺旋，通常8和13'},
{icon:'🐉',name:'蕨类植物',detail:'新叶展开遵循斐波那契比例'},
{icon:'⭐',name:'星系',detail:'旋臂呈对数螺旋，符合黄金比例'}
];
ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='14px sans-serif';
ctx.fillText('自然界的斐波那契',W/2-60,30);
ctx.fillText('斐波那契数列在自然界中广泛存在',W/2-120,55);
const cols=Math.floor(W/160);
items.forEach((item,i)=>{
const col=i%cols;const row=Math.floor(i/cols);
const x=40+col*160;const y=80+row*130;
ctx.font='40px serif';ctx.fillText(item.icon,x,y);
ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 12px sans-serif';
ctx.fillText(item.name,x,y+30);
ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px sans-serif';
const words=item.detail.split('');
let line='';let ly=y+50;
for(const ch of words){
if(ctx.measureText(line+ch).width>140){ctx.fillText(line,x,ly);ly+=16;line=ch}
else line+=ch;
}
if(line)ctx.fillText(line,x,ly);
});
}

function drawSunflower(){
const n=Math.floor(animProgress*count*50);
const cx=W/2,cy=H/2;
const maxR=Math.min(W,H)*0.42;
for(let i=1;i<=n;i++){
const angle=i*PHI*2*Math.PI;
const r=Math.sqrt(i)*maxR/Math.sqrt(count*50);
const x=cx+r*Math.cos(angle);
const y=cy+r*Math.sin(angle);
const size=Math.max(2,Math.min(6,r*0.08+2));
const hue=(i*137.508)%360;
ctx.fillStyle=`hsl(${hue},70%,50%)`;
ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();
}
ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';
ctx.fillText('向日葵种子排列模拟（黄金角 137.508°）',10,20);
ctx.fillText(`种子数: ${n}`,10,38);
}

function updateBottom(){
const seq=fibSeq(count+2);
const el=document.getElementById('bottomContent');
if(curView==='sequence'){
el.innerHTML=`<div class="card"><div class="seq-display">${seq.map((v,i)=>`<div class="seq-item${i===seq.length-1?' highlight':''}">${v}</div>`).join('')}</div></div>
<div class="card"><div class="stats-grid">
<div class="stat-card"><div class="num">${seq[seq.length-1]}</div><div class="label">第${seq.length}项</div></div>
<div class="stat-card"><div class="num">${PHI.toFixed(6)}</div><div class="label">黄金比例 φ</div></div>
<div class="stat-card"><div class="num">${(seq[seq.length-1]/seq[seq.length-2]).toFixed(6)}</div><div class="label">相邻比值</div></div>
<div class="stat-card"><div class="num">${count}</div><div class="label">项数</div></div>
</div></div>`;
}else if(curView==='spiral'||curView==='golden'){
el.innerHTML=`<div class="card"><div class="seq-display">${seq.map((v,i)=>`<div class="seq-item">${v}</div>`).join('')}</div></div>
<div class="card"><div class="golden-info"><div class="phi">φ = ${PHI.toFixed(10)}</div><div class="desc">黄金比例 (1+√5)/2 ≈ 1.6180339887...<br>斐波那契相邻项比值趋近于φ</div></div></div>`;
}else if(curView==='nature'){
el.innerHTML=`<div class="card"><div class="golden-info"><div class="phi">自然界中的斐波那契</div><div class="desc">从贝壳到星系，斐波那契螺旋无处不在<br>黄金角 137.508° 使植物叶片获得最大光照</div></div></div>`;
}else if(curView==='sunflower'){
el.innerHTML=`<div class="card"><div class="golden-info"><div class="phi">黄金角 = 137.508°</div><div class="desc">360° × (1 - 1/φ) ≈ 137.508°<br>每个新种子与前一个的夹角恰好是黄金角</div></div></div>`;
}
}

function animate(){
if(animRunning){
animProgress=Math.min(1,animProgress+0.015);
draw();
if(animProgress>=1)animRunning=false;
}
requestAnimationFrame(animate);
}

window.addEventListener('resize',()=>{initCanvas();draw()});
initCanvas();updateBottom();animate();
</script>
</body>
</html>
