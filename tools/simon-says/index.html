<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>西蒙说</title>
<meta name="description" content="西蒙说记忆游戏，记住并重复颜色序列">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;user-select:none}
h1{font-size:1.5rem;margin-bottom:15px;color:#3b82f6}
.hud{display:flex;gap:20px;margin-bottom:20px;font-size:1rem}
.container{position:relative;width:280px;height:280px}
.btn{position:absolute;width:130px;height:130px;border:none;cursor:pointer;opacity:0.6;transition:opacity .2s,transform .1s;border-radius:16px}
.btn:hover{transform:scale(1.03)}
.btn.lit{opacity:1;transform:scale(1.08);box-shadow:0 0 30px rgba(255,255,255,0.3)}
.btn:nth-child(1){top:0;left:0;background:#ef4444;border-radius:16px 4px 4px 4px}
.btn:nth-child(2){top:0;right:0;background:#22c55e;border-radius:4px 16px 4px 4px}
.btn:nth-child(3){bottom:0;left:0;background:#3b82f6;border-radius:4px 4px 4px 16px}
.btn:nth-child(4){bottom:0;right:0;background:#eab308;border-radius:4px 4px 16px 4px}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;background:#161b22;border-radius:50%;border:3px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:bold}
.controls{margin-top:25px}
button{padding:10px 28px;border:none;background:#3b82f6;color:#fff;border-radius:8px;cursor:pointer;font-size:1rem}
.status{margin-top:15px;font-size:1.1rem;min-height:1.5em}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="西蒙说">
  <meta property="og:description" content="西蒙说记忆游戏，记住并重复颜色序列">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/simon-says/">
</head>
<body>
<h1>🧠 西蒙说</h1>
<div class="hud"><span>关卡: <b id="level">0</b></span><span>最高: <b id="best">0</b></span></div>
<div class="container">
<div class="btn" data-c="0"></div>
<div class="btn" data-c="1"></div>
<div class="btn" data-c="2"></div>
<div class="btn" data-c="3"></div>
<div class="center" id="center">0</div>
</div>
<div class="controls"><button id="startBtn" onclick="startGame()">开始游戏</button></div>
<div class="status" id="status">点击开始记忆游戏</div>
<script>
const colors=['red','green','blue','yellow'];
let sequence=[],playerSeq=[],playing=false,showing=false,level=0,best=0;
const btns=document.querySelectorAll('.btn');

btns.forEach((b,i)=>b.addEventListener('pointerdown',e=>{
  e.preventDefault();if(!playing||showing)return;
  flash(i,200);playerSeq.push(i);
  if(playerSeq[playerSeq.length-1]!==sequence[playerSeq.length-1]){gameOver();return}
  if(playerSeq.length===sequence.length){
    playing=false;level++;document.getElementById('level').textContent=level;
    if(level>=best){best=level;document.getElementById('best').textContent=best}
    document.getElementById('status').textContent='正确！准备下一关...';
    setTimeout(()=>nextRound(),800);
  }
}));

function flash(i,dur=300){btns[i].classList.add('lit');setTimeout(()=>btns[i].classList.remove('lit'),dur)}

function startGame(){sequence=[];level=0;document.getElementById('level').textContent=0;nextRound()}

function nextRound(){
  sequence.push(Math.floor(Math.random()*4));
  playerSeq=[];document.getElementById('center').textContent=sequence.length;
  document.getElementById('status').textContent='观察序列...';showing=true;
  let i=0;const iv=setInterval(()=>{
    if(i>=sequence.length){clearInterval(iv);showing=false;playing=true;document.getElementById('status').textContent='你的回合！';return}
    flash(sequence[i],350);i++;
  },500);
}

function gameOver(){
  playing=false;
  document.getElementById('status').textContent=`游戏结束！你到了第 ${sequence.length} 关`;
  document.getElementById('center').textContent='X';
}
</script>
<script src="../i18n.js"></script>
</body>
</html>
