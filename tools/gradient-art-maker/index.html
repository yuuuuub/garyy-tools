<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 渐变艺术画制作器</title>
<meta name="description" content="在线渐变艺术画生成器，支持线性、径向、锥形渐变，自定义色彩停靠点，一键导出PNG/SVG。">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --surface-2: #334155;
  --text: #f1f5f9; --text-secondary: #94a3b8; --accent: #8b5cf6;
  --border: #475569; --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --radius: 12px; --transition: 0.25s ease;
}
[data-theme="light"] {
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9;
  --text: #1e293b; --text-secondary: #64748b; --accent: #8b5cf6;
  --border: #e2e8f0; --shadow: 0 4px 24px rgba(0,0,0,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; justify-content: center; min-height: 100vh; padding: 16px;
  transition: background var(--transition), color var(--transition);
}
.container {
  max-width: 800px; width: 100%; background: var(--surface);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px;
  transition: background var(--transition), box-shadow var(--transition);
}
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
header h1 { font-size: 1.5rem; }
.theme-toggle {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; cursor: pointer; font-size: 1.1rem; color: var(--text);
  transition: background var(--transition), border var(--transition);
}
.theme-toggle:hover { background: var(--accent); color: #fff; }
.section { margin-bottom: 20px; }
.section label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px; }
.section select, .section input[type="number"] {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; color: var(--text); font-size: 0.9rem; width: 100%;
}
.preview-box {
  width: 100%; aspect-ratio: 1; max-height: 400px; border-radius: var(--radius);
  border: 2px solid var(--border); position: relative; overflow: hidden; margin-bottom: 16px;
}
.preview-box canvas { width: 100%; height: 100%; display: block; }
.controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .controls-grid { grid-template-columns: 1fr; } }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.row label { margin-bottom: 0; min-width: 60px; font-size: 0.82rem; color: var(--text-secondary); }
.row input[type="range"] { flex: 1; min-width: 80px; accent-color: var(--accent); }
.row input[type="color"] {
  width: 36px; height: 36px; border: 2px solid var(--border); border-radius: 8px;
  cursor: pointer; padding: 0; background: none;
}
.color-stop {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.color-stop .remove-btn {
  background: #ef4444; color: #fff; border: none; border-radius: 6px;
  width: 28px; height: 28px; cursor: pointer; font-size: 1rem; flex-shrink: 0;
}
.preset-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.preset-btn {
  padding: 6px 14px; border-radius: 8px; border: 2px solid var(--border);
  background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 0.82rem;
  transition: border-color var(--transition);
}
.preset-btn:hover, .preset-btn.active { border-color: var(--accent); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn {
  padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 0.85rem; font-weight: 600; transition: opacity var(--transition);
}
.btn:hover { opacity: 0.85; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-small { padding: 5px 10px; font-size: 0.78rem; }
.toggle-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.toggle-label {
  display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-secondary); cursor: pointer;
}
.toggle-label input { accent-color: var(--accent); }
.css-output {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; font-family: 'Courier New', monospace; font-size: 0.8rem;
  color: var(--text); word-break: break-all; white-space: pre-wrap; margin-top: 8px;
  max-height: 120px; overflow-y: auto;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🌌 渐变艺术画制作器</h1>
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">🌓</button>
  </header>

  <div class="section">
    <div class="preview-box">
      <canvas id="preview" width="800" height="800"></canvas>
    </div>
  </div>

  <div class="section">
    <label>渐变类型</label>
    <select id="gradType" onchange="render()">
      <option value="linear">线性渐变</option>
      <option value="radial">径向渐变</option>
      <option value="conic">锥形渐变</option>
    </select>
  </div>

  <div class="section" id="angleSection">
    <div class="row">
      <label>角度</label>
      <input type="range" id="angle" min="0" max="360" value="135" oninput="render()">
      <span id="angleVal" style="min-width:40px;font-size:0.85rem;">135°</span>
    </div>
  </div>

  <div class="section">
    <label>预设渐变</label>
    <div class="preset-grid" id="presetGrid"></div>
  </div>

  <div class="section">
    <label>色彩停靠点 <button class="btn btn-primary btn-small" onclick="addColorStop()">+ 添加</button></label>
    <div id="colorStops"></div>
  </div>

  <div class="section">
    <div class="row">
      <label>噪点纹理</label>
      <input type="range" id="noise" min="0" max="100" value="0" oninput="render()">
      <span id="noiseVal" style="min-width:30px;font-size:0.85rem;">0</span>
    </div>
  </div>

  <div class="toggle-group">
    <label class="toggle-label"><input type="checkbox" id="blurEdges" onchange="render()"> 模糊边缘</label>
    <label class="toggle-label"><input type="checkbox" id="mirrorMode" onchange="render()"> 镜像模式</label>
  </div>

  <div class="btn-row">
    <button class="btn btn-secondary" onclick="randomGradient()">🎲 随机渐变</button>
    <button class="btn btn-primary" onclick="downloadPNG()">📥 下载 PNG</button>
    <button class="btn btn-primary" onclick="downloadSVG()">📥 下载 SVG</button>
  </div>

  <div class="section" style="margin-top:16px;">
    <label>CSS 输出 <button class="btn btn-secondary btn-small" onclick="copyCSS()">📋 复制</button></label>
    <div class="css-output" id="cssOutput"></div>
  </div>
</div>

<script>
const presets = [
  { name: '🌅 日落', colors: ['#ff512f','#f09819','#ff6b6b','#ee5a24'] },
  { name: '🌊 海洋', colors: ['#005c97','#363795','#00d2ff','#00f2fe'] },
  { name: '🌲 森林', colors: ['#134e5e','#71b280','#2d5016','#56ab2f'] },
  { name: '🌌 极光', colors: ['#0f0c29','#302b63','#24243e','#00d2ff','#7b2ff7'] },
  { name: '🧋 奶茶', colors: ['#c4956a','#f2d388','#e8b86d','#d4a574'] },
  { name: '🤖 赛博朋克', colors: ['#0ff','#f0f','#ff0','#00f'] },
  { name: '🌑 暗夜', colors: ['#0f0c29','#302b63','#24243e'] }
];

let colorStops = [
  { color: '#8b5cf6', pos: 0 },
  { color: '#ec4899', pos: 50 },
  { color: '#f97316', pos: 100 }
];

function toggleTheme() {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'light' ? 'dark' : 'light';
}

function initPresets() {
  const grid = document.getElementById('presetGrid');
  grid.innerHTML = '';
  presets.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.textContent = p.name;
    btn.onclick = () => applyPreset(i);
    grid.appendChild(btn);
  });
}

function applyPreset(idx) {
  colorStops = presets[idx].colors.map((c, i) => ({
    color: c, pos: Math.round((i / (presets[idx].colors.length - 1)) * 100)
  }));
  renderColorStops();
  render();
}

function renderColorStops() {
  const container = document.getElementById('colorStops');
  container.innerHTML = '';
  colorStops.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'color-stop';
    div.innerHTML = `
      <input type="color" value="${s.color}" onchange="colorStops[${i}].color=this.value;render()">
      <span style="font-size:0.82rem;color:var(--text-secondary)">位置:</span>
      <input type="range" min="0" max="100" value="${s.pos}" style="flex:1;min-width:60px;accent-color:var(--accent)"
        oninput="colorStops[${i}].pos=+this.value;this.nextElementSibling.textContent=this.value+'%';render()">
      <span style="min-width:36px;font-size:0.82rem;">${s.pos}%</span>
      <span style="font-size:0.82rem;color:var(--text-secondary)">${s.color}</span>
      ${colorStops.length > 2 ? `<button class="remove-btn" onclick="removeColorStop(${i})">×</button>` : ''}
    `;
    container.appendChild(div);
  });
}

function addColorStop() {
  if (colorStops.length >= 6) return;
  colorStops.push({ color: '#ffffff', pos: 50 });
  colorStops.sort((a, b) => a.pos - b.pos);
  renderColorStops();
  render();
}

function removeColorStop(i) {
  if (colorStops.length <= 2) return;
  colorStops.splice(i, 1);
  renderColorStops();
  render();
}

function buildGradientCSS() {
  const type = document.getElementById('gradType').value;
  const angle = document.getElementById('angle').value;
  const stops = colorStops.map(s => `${s.color} ${s.pos}%`).join(', ');
  if (type === 'linear') return `linear-gradient(${angle}deg, ${stops})`;
  if (type === 'radial') return `radial-gradient(circle, ${stops})`;
  return `conic-gradient(from ${angle}deg, ${stops})`;
}

function render() {
  const canvas = document.getElementById('preview');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const type = document.getElementById('gradType').value;
  const angle = +document.getElementById('angle').value;
  const noise = +document.getElementById('noise').value;
  const blurEdges = document.getElementById('blurEdges').checked;
  const mirrorMode = document.getElementById('mirrorMode').checked;

  document.getElementById('angleVal').textContent = angle + '°';
  document.getElementById('angleSection').style.display = type === 'linear' ? 'block' : type === 'conic' ? 'block' : 'none';
  document.getElementById('noiseVal').textContent = noise;

  let grad;
  if (type === 'linear') {
    const rad = angle * Math.PI / 180;
    const cx = w / 2, cy = h / 2;
    const len = Math.max(w, h);
    const x1 = cx - Math.cos(rad) * len / 2;
    const y1 = cy - Math.sin(rad) * len / 2;
    const x2 = cx + Math.cos(rad) * len / 2;
    const y2 = cy + Math.sin(rad) * len / 2;
    grad = ctx.createLinearGradient(x1, y1, x2, y2);
  } else if (type === 'radial') {
    grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) / 2);
  } else {
    grad = ctx.createConicGradient(angle * Math.PI / 180, w / 2, h / 2);
  }

  colorStops.forEach(s => grad.addColorStop(s.pos / 100, s.color));

  ctx.clearRect(0, 0, w, h);

  if (mirrorMode) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, w / 2, h);
    ctx.clip();
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
    ctx.save();
    ctx.beginPath();
    ctx.rect(w / 2, 0, w / 2, h);
    ctx.clip();
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  } else {
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  }

  if (noise > 0) {
    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * noise * 2.55;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  if (blurEdges) {
    const edgeGrad = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.7);
    edgeGrad.addColorStop(0, 'rgba(0,0,0,0)');
    edgeGrad.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = edgeGrad;
    ctx.fillRect(0, 0, w, h);
  }

  document.getElementById('cssOutput').textContent = `background: ${buildGradientCSS()};`;
}

function copyCSS() {
  navigator.clipboard.writeText(document.getElementById('cssOutput').textContent);
}

function randomGradient() {
  const randColor = () => '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
  const count = 2 + Math.floor(Math.random() * 5);
  colorStops = Array.from({ length: count }, (_, i) => ({
    color: randColor(),
    pos: Math.round((i / (count - 1)) * 100)
  }));
  document.getElementById('angle').value = Math.floor(Math.random() * 360);
  renderColorStops();
  render();
}

function downloadPNG() {
  const canvas = document.getElementById('preview');
  const link = document.createElement('a');
  link.download = 'gradient-art.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function downloadSVG() {
  const type = document.getElementById('gradType').value;
  const angle = document.getElementById('angle').value;
  const stops = colorStops.map(s => `<stop offset="${s.pos}%" stop-color="${s.color}"/>`).join('\n    ');
  let gradDef;
  if (type === 'linear') {
    const rad = angle * Math.PI / 180;
    gradDef = `<linearGradient id="g" x1="0%" y1="0%" x2="${Math.round(50 + Math.cos(rad)*50)}%" y2="${Math.round(50 + Math.sin(rad)*50)}%">\n    ${stops}\n  </linearGradient>`;
  } else if (type === 'radial') {
    gradDef = `<radialGradient id="g" cx="50%" cy="50%" r="50%">\n    ${stops}\n  </radialGradient>`;
  } else {
    gradDef = `<linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">\n    ${stops}\n  </linearGradient>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    ${gradDef}
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
</svg>`;
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const link = document.createElement('a');
  link.download = 'gradient-art.svg';
  link.href = URL.createObjectURL(blob);
  link.click();
}

initPresets();
renderColorStops();
render();
</script>
</body>
</html>
