<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔊 音调生成器</title>
<meta property="og:title" content="🔊 音调生成器">
<meta property="og:description" content="🔊 音调生成器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线音调生成器，生成任意频率的音调，支持正弦波、方波、三角波等波形">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔊</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.freq-display{text-align:center;padding:20px;background:var(--preview-bg);border-radius:12px;margin-bottom:16px}
.freq-val{font-size:48px;font-weight:700;color:var(--accent);font-family:monospace}
.freq-unit{font-size:16px;color:var(--text-secondary);margin-left:4px}
.freq-note{font-size:18px;color:var(--text-secondary);margin-top:4px}
.slider-group{margin-bottom:16px}
.slider-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.slider-label b{color:var(--text);font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent);height:6px}
.wave-selector{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.wave-btn{flex:1;min-width:70px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;text-align:center}
.wave-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.wave-btn .icon{font-size:20px;display:block;margin-bottom:4px}
.controls{display:flex;gap:8px;justify-content:center;margin:16px 0}
.ctrl-btn{padding:14px 28px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.ctrl-btn.play{background:var(--green);color:#fff}
.ctrl-btn.play:hover{background:#2ea043}
.ctrl-btn.play.active{background:var(--red)}
.ctrl-btn.play.active:hover{background:#dc2626}
.piano-row{display:flex;gap:4px;margin-top:16px;justify-content:center}
.key-btn{width:36px;height:100px;border-radius:0 0 6px 6px;border:1px solid var(--border);background:var(--card-bg);cursor:pointer;transition:all .1s;font-size:9px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;color:var(--text-secondary)}
.key-btn:active{background:var(--accent);color:#fff}
.key-btn.active{background:var(--accent);color:#fff}
.preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.preset-btn{padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:11px;cursor:pointer;transition:all .2s;text-align:center}
.preset-btn:hover{border-color:var(--accent)}
.preset-btn .pf{font-weight:700;font-size:13px;color:var(--accent)}
.footer{text-align:center;padding:20px 0;font-size:12px;color:var(--text-secondary)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🔊 音调生成器</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">🎵 当前频率</div>
<div class="freq-display">
<span class="freq-val" id="freqVal">440</span><span class="freq-unit">Hz</span>
<div class="freq-note" id="freqNote">A4 (标准音)</div>
</div>
</div>
<div class="card">
<div class="card-title">🎛️ 频率控制</div>
<div class="slider-group">
<div class="slider-label"><span>频率</span><b id="freqSliderVal">440 Hz</b></div>
<input type="range" min="20" max="2000" value="440" id="freqSlider" oninput="updateFreq(+this.value)">
</div>
<div class="slider-group">
<div class="slider-label"><span>音量</span><b id="volSliderVal">50%</b></div>
<input type="range" min="0" max="100" value="50" id="volSlider" oninput="updateVolume(+this.value)">
</div>
</div>
<div class="card">
<div class="card-title">🌊 波形选择</div>
<div class="wave-selector" id="waveSelector"></div>
</div>
<div class="card">
<div class="card-title">▶ 播放控制</div>
<div class="controls">
<button class="ctrl-btn play" id="playBtn" onclick="togglePlay()">▶ 播放</button>
</div>
</div>
<div class="card">
<div class="card-title">🎹 快捷音符</div>
<div class="piano-row" id="pianoRow"></div>
</div>
<div class="card">
<div class="card-title">📌 常用频率</div>
<div class="preset-grid" id="presetGrid"></div>
</div>
<div class="footer">音调生成器 - Web Audio API | 频率范围 20Hz-2000Hz</div>
</div>
<script>
let audioCtx,oscillator,gainNode,isPlaying=false,currentFreq=440,currentWave='sine',volume=0.5;
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const WAVES=[{id:'sine',name:'正弦波',icon:'∿'},{id:'square',name:'方波',icon:'⊓'},{id:'sawtooth',name:'锯齿波',icon:'⩘'},{id:'triangle',name:'三角波',icon:'△'}];
const PRESETS=[
{freq:261.63,name:'C4 中央C'},{freq:440,name:'A4 标准音'},{freq:523.25,name:'C5 高音C'},
{freq:329.63,name:'E4'},{freq:392,name:'G4'},{freq:293.66,name:'D4'},
{freq:100,name:'低频测试'},{freq:1000,name:'中频测试'},{freq:4000,name:'高频测试'}
];
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function noteFromFreq(freq){const n=12*(Math.log2(freq/440));const noteIdx=Math.round(n)+69;const octave=Math.floor(noteIdx/12)-1;const note=NOTES[noteIdx%12];return note+octave}
function buildWaveSelector(){document.getElementById('waveSelector').innerHTML=WAVES.map(w=>`<button class="wave-btn${w.id===currentWave?' active':''}" onclick="selectWave('${w.id}')"><span class="icon">${w.icon}</span>${w.name}</button>`).join('')}
function selectWave(w){currentWave=w;buildWaveSelector();if(isPlaying){stopOsc();startOsc()}}
function buildPiano(){const el=document.getElementById('pianoRow');const pianoNotes=[{note:'C4',freq:261.63},{note:'D4',freq:293.66},{note:'E4',freq:329.63},{note:'F4',freq:349.23},{note:'G4',freq:392},{note:'A4',freq:440},{note:'B4',freq:493.88}];el.innerHTML=pianoNotes.map(p=>`<div class="key-btn" onclick="setFreq(${p.freq})">${p.note}</div>`).join('')}
function buildPresets(){document.getElementById('presetGrid').innerHTML=PRESETS.map(p=>`<button class="preset-btn" onclick="setFreq(${p.freq})"><div class="pf">${p.freq}Hz</div>${p.name}</button>`).join('')}
function setFreq(f){currentFreq=f;document.getElementById('freqSlider').value=f;updateFreqDisplay();if(isPlaying){stopOsc();startOsc()}}
function updateFreq(f){currentFreq=f;updateFreqDisplay();if(isPlaying){oscillator.frequency.setValueAtTime(f,audioCtx.currentTime)}}
function updateFreqDisplay(){document.getElementById('freqVal').textContent=Math.round(currentFreq);document.getElementById('freqSliderVal').textContent=Math.round(currentFreq)+' Hz';document.getElementById('freqNote').textContent=noteFromFreq(currentFreq)}
function updateVolume(v){volume=v/100;document.getElementById('volSliderVal').textContent=v+'%';if(gainNode)gainNode.gain.setValueAtTime(volume,audioCtx.currentTime)}
function togglePlay(){if(isPlaying){stopPlay()}else{startPlay()}}
function startPlay(){initAudio();isPlaying=true;document.getElementById('playBtn').textContent='⏹ 停止';document.getElementById('playBtn').classList.add('active');startOsc()}
function stopPlay(){isPlaying=false;document.getElementById('playBtn').textContent='▶ 播放';document.getElementById('playBtn').classList.remove('active');stopOsc()}
function startOsc(){oscillator=audioCtx.createOscillator();gainNode=audioCtx.createGain();oscillator.type=currentWave;oscillator.frequency.setValueAtTime(currentFreq,audioCtx.currentTime);gainNode.gain.setValueAtTime(volume,audioCtx.currentTime);oscillator.connect(gainNode);gainNode.connect(audioCtx.destination);oscillator.start()}
function stopOsc(){if(oscillator){try{oscillator.stop()}catch(e){}oscillator=null}}
buildWaveSelector();buildPiano();buildPresets();updateFreqDisplay();
</script>
</body>
</html>
