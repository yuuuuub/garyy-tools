<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冲刺回顾会</title>
<meta name="description" content="冲刺回顾会工具 - 敏捷团队回顾总结，收集反馈并制定改进计划">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--orange:#db6d28;--purple:#a371f7;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--orange:#bc4c00;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:1100px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
input,textarea,select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
textarea{resize:vertical;min-height:60px}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.retro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:20px}
.retro-col{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;min-height:250px}
.retro-col-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.retro-col-title{font-weight:700;font-size:1rem}
.note-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;transition:all .2s;position:relative}
.note-card:hover{border-color:var(--accent)}
.note-text{font-size:.9rem;margin-bottom:6px}
.note-meta{font-size:.75rem;color:var(--text2);display:flex;justify-content:space-between;align-items:center}
.vote-btn{padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);cursor:pointer;font-size:.75rem}
.vote-btn:hover{border-color:var(--accent)}
.vote-count{font-weight:700;color:var(--accent)}
.action-item{background:var(--bg);border-left:3px solid var(--green);border-radius:0 8px 8px 0;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.action-status{padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:600;cursor:pointer}
.status-pending{background:rgba(210,153,34,.2);color:var(--yellow)}
.status-done{background:rgba(63,185,80,.2);color:var(--green)}
.radar-container{display:flex;justify-content:center;margin:20px 0}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.summary-card{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.summary-num{font-size:1.8rem;font-weight:700}
.summary-label{font-size:.8rem;color:var(--text2);margin-top:4px}
@media(max-width:768px){.retro-grid{grid-template-columns:1fr}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🔄 冲刺回顾会';
const APP=document.getElementById('app');
let retro=JSON.parse(localStorage.getItem('sr_data')||'{"sprintName":"Sprint 1","wentWell":[],"toImprove":[],"actionItems":[]}');

function save(){localStorage.setItem('sr_data',JSON.stringify(retro))}

function render(){
  let h=`<h1>🔄 冲刺回顾会</h1><p class="subtitle">回顾总结 · 持续改进</p>`;
  const totalNotes=retro.wentWell.length+retro.toImprove.length;
  const totalVotes=retro.wentWell.reduce((s,n)=>s+n.votes,0)+retro.toImprove.reduce((s,n)=>s+n.votes,0);

  h+=`<div class="summary-grid">`;
  h+=`<div class="summary-card"><div class="summary-num" style="color:var(--green)">${retro.wentWell.length}</div><div class="summary-label">做得好</div></div>`;
  h+=`<div class="summary-card"><div class="summary-num" style="color:var(--yellow)">${retro.toImprove.length}</div><div class="summary-label">待改进</div></div>`;
  h+=`<div class="summary-card"><div class="summary-num" style="color:var(--accent)">${retro.actionItems.length}</div><div class="summary-label">行动项</div></div>`;
  h+=`<div class="summary-card"><div class="summary-num" style="color:var(--purple)">${totalVotes}</div><div class="summary-label">总投票</div></div>`;
  h+=`</div>`;

  h+=`<div class="card"><div class="flex-between"><b>📋 冲刺信息</b><button class="btn btn-sm btn-outline" onclick="editSprint()">编辑</button></div><p style="margin-top:8px;color:var(--text2)">${retro.sprintName}</p></div>`;

  h+=`<div class="retro-grid">`;
  h+=`<div class="retro-col"><div class="retro-col-header" style="border-color:var(--green)"><span style="font-size:1.3rem">😊</span><span class="retro-col-title" style="color:var(--green)">做得好</span></div>`;
  retro.wentWell.forEach((n,i)=>{
    h+=`<div class="note-card"><div class="note-text">${n.text}</div><div class="note-meta"><span>${n.author||'匿名'}</span><div class="flex"><button class="vote-btn" onclick="vote('wentWell',${i})">👍 <span class="vote-count">${n.votes}</span></button><button class="btn btn-sm btn-danger" onclick="delNote('wentWell',${i})">✕</button></div></div></div>`;
  });
  h+=`<button class="btn btn-sm btn-success" onclick="addNote('wentWell')">+ 添加</button></div>`;

  h+=`<div class="retro-col"><div class="retro-col-header" style="border-color:var(--yellow)"><span style="font-size:1.3rem">⚠️</span><span class="retro-col-title" style="color:var(--yellow)">待改进</span></div>`;
  retro.toImprove.forEach((n,i)=>{
    h+=`<div class="note-card"><div class="note-text">${n.text}</div><div class="note-meta"><span>${n.author||'匿名'}</span><div class="flex"><button class="vote-btn" onclick="vote('toImprove',${i})">👍 <span class="vote-count">${n.votes}</span></button><button class="btn btn-sm btn-danger" onclick="delNote('toImprove',${i})">✕</button></div></div></div>`;
  });
  h+=`<button class="btn btn-sm btn-warning" onclick="addNote('toImprove')">+ 添加</button></div>`;

  h+=`<div class="retro-col"><div class="retro-col-header" style="border-color:var(--accent)"><span style="font-size:1.3rem">🎯</span><span class="retro-col-title" style="color:var(--accent)">行动项</span></div>`;
  retro.actionItems.forEach((a,i)=>{
    h+=`<div class="action-item"><div><div style="font-size:.9rem;font-weight:600">${a.text}</div><div style="font-size:.75rem;color:var(--text2)">${a.owner||'未分配'}</div></div><div class="flex"><span class="action-status ${a.done?'status-done':'status-pending'}" onclick="toggleAction(${i})">${a.done?'已完成':'待完成'}</span><button class="btn btn-sm btn-danger" onclick="delAction(${i})">✕</button></div></div>`;
  });
  h+=`<button class="btn btn-sm" onclick="addAction()">+ 添加</button></div>`;
  h+=`</div>`;

  h+=`<div class="card"><div class="flex-between"><b>📤 导出</b><div class="flex"><button class="btn btn-sm btn-outline" onclick="exportMD()">Markdown</button><button class="btn btn-sm btn-danger" onclick="clearAll()">清空</button></div></div></div>`;
  APP.innerHTML=h;
}

function addNote(type){
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">${type==='wentWell'?'😊 做得好':'⚠️ 待改进'}</h3>
    <label>内容</label><textarea id="nt" placeholder="描述..."></textarea>
    <label>作者</label><input id="na" placeholder="姓名（可选）">
    <div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    <button class="btn btn-success" onclick="saveNote('${type}')">确定</button></div></div>`;
  document.body.appendChild(m);
}
function saveNote(type){
  const t=document.getElementById('nt').value.trim();if(!t)return;
  const a=document.getElementById('na').value.trim();
  retro[type].push({text:t,author:a,votes:0,created:new Date().toISOString()});
  save();document.querySelector('.modal-overlay').remove();render();
}
function delNote(type,i){if(confirm('删除？')){retro[type].splice(i,1);save();render()}}
function vote(type,i){retro[type][i].votes++;save();render()}
function addAction(){
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">🎯 添加行动项</h3>
    <label>行动内容</label><textarea id="at" placeholder="具体行动..."></textarea>
    <label>负责人</label><input id="ao" placeholder="负责人">
    <div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    <button class="btn btn-success" onclick="saveAction()">确定</button></div></div>`;
  document.body.appendChild(m);
}
function saveAction(){
  const t=document.getElementById('at').value.trim();if(!t)return;
  const o=document.getElementById('ao').value.trim();
  retro.actionItems.push({text:t,owner:o,done:false});save();document.querySelector('.modal-overlay').remove();render();
}
function delAction(i){if(confirm('删除？')){retro.actionItems.splice(i,1);save();render()}}
function toggleAction(i){retro.actionItems[i].done=!retro.actionItems[i].done;save();render()}
function editSprint(){const n=prompt('冲刺名称：',retro.sprintName);if(n){retro.sprintName=n;save();render()}}
function clearAll(){if(confirm('清空所有回顾数据？')){retro={sprintName:retro.sprintName,wentWell:[],toImprove:[],actionItems:[]};save();render()}}
function exportMD(){
  let md=`# ${retro.sprintName} 回顾\n\n## 😊 做得好\n`;
  retro.wentWell.forEach(n=>md+=`- ${n.text} (👍${n.votes})\n`);
  md+=`\n## ⚠️ 待改进\n`;
  retro.toImprove.forEach(n=>md+=`- ${n.text} (👍${n.votes})\n`);
  md+=`\n## 🎯 行动项\n`;
  retro.actionItems.forEach(a=>md+=`- [${a.done?'x':' '}] ${a.text} - ${a.owner||'未分配'}\n`);
  const blob=new Blob([md],{type:'text/markdown'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`retro-${retro.sprintName}.md`;a.click();
}
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
