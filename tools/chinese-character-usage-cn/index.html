<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字用法大全</title>
<meta name="description" content="汉字组词、成语、造句用法大全，助你提升语文水平">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:800px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:10px 16px;cursor:pointer;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;font-size:.9rem}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.85rem;margin:3px;cursor:pointer;transition:all .2s}
.tag-blue{background:rgba(59,130,246,.15);color:var(--accent)}.tag-blue:hover{background:var(--accent);color:#fff}
.tag-green{background:rgba(34,197,94,.15);color:var(--success)}
.tag-yellow{background:rgba(245,158,11,.15);color:var(--warn)}
.result-section{margin-top:16px}
.result-section h3{font-size:1rem;margin-bottom:8px;color:var(--text)}
.word-list{display:flex;flex-wrap:wrap;gap:8px}
.word-item{padding:8px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s}
.word-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.word-item .w{font-weight:700;font-size:1.1rem}.word-item .p{font-size:.8rem;color:var(--accent)}
.idiom-card{padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.idiom-card .idiom{font-size:1.3rem;font-weight:700;color:var(--accent)}.idiom-card .py{font-size:.85rem;color:var(--text2)}.idiom-card .meaning{font-size:.9rem;margin-top:4px}
.sentence{padding:12px;background:var(--bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;margin-bottom:8px;font-size:.95rem}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="汉字用法大全">
<meta property="og:description" content="汉字组词、成语、造句用法大全">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📚 汉字用法大全</h1><p>组词、成语、造句一站式查询</p></div>

<div class="cd">
<div style="display:flex;gap:8px">
<input type="text" id="searchInput" placeholder="输入汉字查询用法..." style="flex:1">
<button onclick="searchUsage()">查询</button>
</div>
<div class="bg" style="margin-top:8px">
<button class="sec" onclick="setChar('水')">水</button>
<button class="sec" onclick="setChar('山')">山</button>
<button class="sec" onclick="setChar('风')">风</button>
<button class="sec" onclick="setChar('花')">花</button>
<button class="sec" onclick="setChar('月')">月</button>
<button class="sec" onclick="setChar('心')">心</button>
<button class="sec" onclick="setChar('天')">天</button>
<button class="sec" onclick="setChar('人')">人</button>
</div></div>

<div id="resultArea" class="hidden"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const usageDB={
'水':{pinyin:'shuǐ',meaning:'无色透明的液体',
  words:[{w:'水平',p:'shuǐ píng'},{w:'水果',p:'shuǐ guǒ'},{w:'水分',p:'shuǐ fèn'},{w:'水面',p:'shuǐ miàn'},{w:'水彩',p:'shuǐ cǎi'},{w:'水滴',p:'shuǐ dī'},{w:'水流',p:'shuǐ liú'},{w:'水乡',p:'shuǐ xiāng'},{w:'泉水',p:'quán shuǐ'},{w:'河水',p:'hé shuǐ'}],
  idioms:[{i:'水落石出',py:'shuǐ luò shí chū',m:'水落下去，水底的石头就露出来。比喻事情的真相完全显露出来。'},{i:'山清水秀',py:'shān qīng shuǐ xiù',m:'形容风景优美。'},{i:'水到渠成',py:'shuǐ dào qú chéng',m:'水流到的地方自然形成一条渠。比喻条件成熟，事情自然会成功。'},{i:'水深火热',py:'shuǐ shēn huǒ rè',m:'形容人民生活处境极端痛苦。'}],
  sentences:['清澈的河水从山上流下来。','我们要节约用水，保护水资源。','水是生命之源。']},
'山':{pinyin:'shān',meaning:'地面形成的高耸部分',
  words:[{w:'山水',p:'shān shuǐ'},{w:'山林',p:'shān lín'},{w:'山上',p:'shān shàng'},{w:'山峰',p:'shān fēng'},{w:'山脚',p:'shān jiǎo'},{w:'山谷',p:'shān gǔ'},{w:'雪山',p:'xuě shān'},{w:'火山',p:'huǒ shān'},{w:'高山',p:'gāo shān'},{w:'大山',p:'dà shān'}],
  idioms:[{i:'山高水长',py:'shān gāo shuǐ cháng',m:'比喻恩德深厚或情谊深长。'},{i:'山穷水尽',py:'shān qióng shuǐ jìn',m:'山和水都到了尽头。比喻无路可走陷入绝境。'},{i:'开山祖师',py:'kāi shān zǔ shī',m:'比喻某一事业的创始人。'},{i:'半壁江山',py:'bàn bì jiāng shān',m:'比喻国家领土遭到入侵后保存下来的部分。'}],
  sentences:['远处的山峰直入云霄。','这座山上有很多珍稀植物。','我最喜欢爬山了。']},
'风':{pinyin:'fēng',meaning:'空气流动的现象',
  words:[{w:'风景',p:'fēng jǐng'},{w:'风格',p:'fēng gé'},{w:'风气',p:'fēng qì'},{w:'风雨',p:'fēng yǔ'},{w:'风力',p:'fēng lì'},{w:'风光',p:'fēng guāng'},{w:'春风',p:'chūn fēng'},{w:'大风',p:'dà fēng'},{w:'微风',p:'wēi fēng'},{w:'台风',p:'tái fēng'}],
  idioms:[{i:'风和日丽',py:'fēng hé rì lì',m:'和风习习，阳光灿烂。形容晴朗暖和的天气。'},{i:'风调雨顺',py:'fēng tiáo yǔ shùn',m:'形容风雨及时适量，有利于农作物生长。'},{i:'一帆风顺',py:'yī fān fēng shùn',m:'比喻非常顺利，毫无挫折。'},{i:'风花雪月',py:'fēng huā xuě yuè',m:'比喻堆砌辞藻、内容空洞的诗文。'}],
  sentences:['今天的风很大，出门要多穿点。','春风拂面，非常舒服。','风景如画，让人流连忘返。']},
'花':{pinyin:'huā',meaning:'植物的繁殖器官',
  words:[{w:'花园',p:'huā yuán'},{w:'花朵',p:'huā duǒ'},{w:'花样',p:'huā yàng'},{w:'花生',p:'huā shēng'},{w:'花费',p:'huā fèi'},{w:'开花',p:'kāi huā'},{w:'鲜花',p:'xiān huā'},{w:'雪花',p:'xuě huā'},{w:'火花',p:'huǒ huā'},{w:'浪花',p:'làng huā'}],
  idioms:[{i:'花好月圆',py:'huā hǎo yuè yuán',m:'花正盛开，月亮正圆的时候。比喻美好圆满。'},{i:'花言巧语',py:'huā yán qiǎo yǔ',m:'原指铺张修饰、内容空泛的言语。后指用来骗人的虚伪动听的话。'},{i:'百花齐放',py:'bǎi huā qí fàng',m:'形容百花盛开，丰富多彩。比喻各种不同形式和风格的艺术自由发展。'},{i:'锦上添花',py:'jǐn shàng tiān huā',m:'在锦上再绣花。比喻好上加好。'}],
  sentences:['春天来了，花园里开满了鲜花。','她的脸上像花一样美丽。','这幅画色彩斑斓，就像盛开的花。']},
'月':{pinyin:'yuè',meaning:'月亮，地球的卫星',
  words:[{w:'月亮',p:'yuè liang'},{w:'月光',p:'yuè guāng'},{w:'月饼',p:'yuè bǐng'},{w:'月球',p:'yuè qiú'},{w:'岁月',p:'suì yuè'},{w:'本月',p:'běn yuè'},{w:'明月',p:'míng yuè'},{w:'残月',p:'cán yuè'},{w:'新月',p:'xīn yuè'},{w:'满月',p:'mǎn yuè'}],
  idioms:[{i:'花前月下',py:'huā qián yuè xià',m:'本指游乐休息的环境。后多指谈情说爱的处所。'},{i:'水中捞月',py:'shuǐ zhōng lāo yuè',m:'到水中去捞月亮。比喻去做根本做不到的事情。'},{i:'日月如梭',py:'rì yuè rú suō',m:'太阳和月亮像穿梭一样来去。形容时间过得很快。'},{i:'披星戴月',py:'pī xīng dài yuè',m:'身披星星，头戴月亮。形容连夜奔波或早出晚归。'}],
  sentences:['今晚的月亮真圆啊。','月光洒在大地上，一片银白。','中秋节要吃月饼。']},
'心':{pinyin:'xīn',meaning:'人和高等动物身体内推动血液循环的器官',
  words:[{w:'心情',p:'xīn qíng'},{w:'心里',p:'xīn lǐ'},{w:'心灵',p:'xīn líng'},{w:'心脏',p:'xīn zàng'},{w:'心愿',p:'xīn yuàn'},{w:'开心',p:'kāi xīn'},{w:'关心',p:'guān xīn'},{w:'放心',p:'fàng xīn'},{w:'小心',p:'xiǎo xīn'},{w:'信心',p:'xìn xīn'}],
  idioms:[{i:'心花怒放',py:'xīn huā nù fàng',m:'心里高兴得像花儿盛开一样。形容极其高兴。'},{i:'心旷神怡',py:'xīn kuàng shén yí',m:'心境开阔，精神愉快。'},{i:'心直口快',py:'xīn zhí kǒu kuài',m:'性情直爽，有话就说。'},{i:'心心相印',py:'xīn xīn xiāng yìn',m:'彼此的心意不用说出，就可以互相了解。形容彼此思想感情完全一致。'}],
  sentences:['今天心情特别好。','做事要用心才能做好。','她是一个心地善良的人。']},
'天':{pinyin:'tiān',meaning:'在地面以上的高空',
  words:[{w:'天空',p:'tiān kōng'},{w:'天气',p:'tiān qì'},{w:'天堂',p:'tiān táng'},{w:'天才',p:'tiān cái'},{w:'今天',p:'jīn tiān'},{w:'明天',p:'míng tiān'},{w:'昨天',p:'zuó tiān'},{w:'蓝天',p:'lán tiān'},{w:'晴天',p:'qíng tiān'},{w:'雨天',p:'yǔ tiān'}],
  idioms:[{i:'天长地久',py:'tiān cháng dì jiǔ',m:'跟天和地存在的时间那样长。形容永久不变。'},{i:'天翻地覆',py:'tiān fān dì fù',m:'形容变化巨大。也形容闹得很凶。'},{i:'天衣无缝',py:'tiān yī wú fèng',m:'神话传说，仙女的衣服没有衣缝。比喻事物周密完善。'},{i:'杞人忧天',py:'qǐ rén yōu tiān',m:'杞国有个人怕天塌下来。比喻不必要的或缺乏根据的忧虑和担心。'}],
  sentences:['今天的天气真好。','天空蓝得像一块宝石。','明天我要去图书馆看书。']},
'人':{pinyin:'rén',meaning:'能制造和使用工具的高等动物',
  words:[{w:'人们',p:'rén men'},{w:'人生',p:'rén shēng'},{w:'人民',p:'rén mín'},{w:'人才',p:'rén cái'},{w:'人物',p:'rén wù'},{w:'大人',p:'dà rén'},{w:'小人',p:'xiǎo rén'},{w:'好人',p:'hǎo rén'},{w:'男人',p:'nán rén'},{w:'女人',p:'nǚ rén'}],
  idioms:[{i:'人山人海',py:'rén shān rén hǎi',m:'人群如山似海。形容人聚集得非常多。'},{i:'人杰地灵',py:'rén jié dì líng',m:'指有杰出的人降生或到过的地方，也就成为名胜之地。'},{i:'人各有志',py:'rén gè yǒu zhì',m:'每个人都有不同的志向。'},{i:'助人为乐',py:'zhù rén wéi lè',m:'把帮助别人当作快乐。'}],
  sentences:['人要有梦想才能有动力。','这里的人们都很热情。','做人要诚实守信。']},
};

function setChar(ch){$('searchInput').value=ch;searchUsage()}

function searchUsage(){
  const ch=$('searchInput').value.trim();
  if(!ch||!usageDB[ch]){$('resultArea').innerHTML='<div class="cd" style="text-align:center;color:var(--text2)">暂无「'+(ch||'?')+'」的详细数据，试试其他汉字</div>';$('resultArea').classList.remove('hidden');return}
  const d=usageDB[ch];
  $('resultArea').innerHTML=`
    <div class="cd">
      <div style="text-align:center;font-size:3rem;font-weight:700;margin-bottom:8px">${ch}</div>
      <div style="text-align:center;color:var(--accent);font-size:1rem">${d.pinyin}</div>
      <div style="text-align:center;color:var(--text2);margin-top:4px">${d.meaning}</div>
    </div>
    <div class="cd"><h2>组词</h2><div class="word-list">${d.words.map(w=>'<div class="word-item"><div class="w">'+w.w+'</div><div class="p">'+w.p+'</div></div>').join('')}</div></div>
    <div class="cd"><h2>成语</h2>${d.idioms.map(id=>'<div class="idiom-card"><div class="idiom">'+id.i+'</div><div class="py">'+id.py+'</div><div class="meaning">'+id.m+'</div></div>').join('')}</div>
    <div class="cd"><h2>例句</h2>${d.sentences.map(s=>'<div class="sentence">'+s+'</div>').join('')}</div>`;
  $('resultArea').classList.remove('hidden');
}

$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchUsage()});
</script>
</body>
</html>
