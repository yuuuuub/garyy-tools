<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--transition:0.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:800px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px;transition:var(--transition)}
.btn:hover{opacity:.85}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn-secondary{background:var(--border);color:var(--text)}
.input{width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:1.2rem;text-align:center;margin-bottom:12px}
.input:focus{outline:none;border-color:var(--blue)}
.char-header{display:flex;align-items:center;gap:20px;margin:16px 0;padding:16px;background:var(--bg);border-radius:var(--radius)}
.char-big{font-size:4rem;font-weight:bold}
.char-meta{flex:1}
.char-pinyin{font-size:1.3rem;color:var(--blue);margin-bottom:4px}
.char-info{font-size:.85rem;color:var(--text2)}
.meaning-section{margin:12px 0}
.meaning-item{padding:12px;background:var(--bg);border-radius:8px;margin-bottom:8px}
.meaning-pos{display:inline-block;padding:2px 8px;background:var(--blue);color:#fff;border-radius:4px;font-size:.75rem;margin-bottom:6px}
.meaning-text{font-size:1rem;margin-bottom:6px}
.example-list{list-style:none;padding:0}
.example-list li{padding:6px 0;border-bottom:1px solid var(--border);font-size:.9rem;color:var(--text2)}
.example-list li:last-child{border-bottom:none}
.example-list li .en{color:var(--text)}
.example-list li .zh{color:var(--blue)}
.section-title{font-size:1rem;font-weight:bold;margin:16px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.idiom-grid{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.idiom-tag{padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;font-size:.85rem;cursor:pointer;transition:var(--transition)}
.idiom-tag:hover{border-color:var(--blue);color:var(--blue)}
.collocation-list{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.collocation-item{padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:.9rem}
.word-list{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.word-item{padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:.9rem;cursor:pointer;transition:var(--transition)}
.word-item:hover{border-color:var(--blue)}
.fav-btn{background:none;border:1px solid var(--border);color:var(--text);padding:4px 12px;border-radius:4px;cursor:pointer;font-size:.8rem;transition:var(--transition)}
.fav-btn:hover,.fav-btn.active{border-color:var(--red);color:var(--red)}
.history-list{max-height:200px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--border);font-size:.85rem;cursor:pointer;transition:var(--transition)}
.history-item:hover{background:var(--bg)}
.copy-hint{font-size:.7rem;color:var(--green);margin-top:4px;display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>

var favorites = JSON.parse(localStorage.getItem('char_favorites') || '[]');
var history = JSON.parse(localStorage.getItem('char_history') || '[]');

function lookupChar() {
  var ch = document.getElementById('searchInput').value.trim();
  if (!ch) return;
  document.getElementById('favCard').classList.add('hidden');
  document.getElementById('histCard').classList.add('hidden');
  addToHistory(ch);
  var data = usageDB[ch];
  if (!data) {
    document.getElementById('resultArea').innerHTML = '<div class="card"><div style="text-align:center;padding:20px;color:var(--text2)">未找到 "' + ch + '" 的详细用法数据<br><br><button class="btn" onclick="addToFavorites(\'' + ch + '\')">❤ 添加到收藏</button></div></div>';
    return;
  }
  var isFav = favorites.indexOf(ch) >= 0;
  var html = '<div class="card">';
  html += '<div class="char-header">';
  html += '<div class="char-big">' + ch + '</div>';
  html += '<div class="char-meta">';
  html += '<div class="char-pinyin">' + data.pinyin + '</div>';
  html += '<div class="char-info">部首: ' + data.radical + ' · 笔画: ' + data.strokes + '</div>';
  html += '<button class="fav-btn' + (isFav ? ' active' : '') + '" onclick="toggleFav(\'' + ch + '\')">' + (isFav ? '❤ 已收藏' : '♡ 收藏') + '</button>';
  html += '</div></div>';

  html += '<div class="section-title">释义与例句</div>';
  data.meanings.forEach(function(m) {
    html += '<div class="meaning-item">';
    html += '<div class="meaning-pos">' + m.pos + '</div>';
    html += '<div class="meaning-text">' + m.text + '</div>';
    html += '<ul class="example-list">';
    m.examples.forEach(function(ex) {
      html += '<li onclick="copyText(\'' + ex.zh.replace(/'/g, "\\'") + '\')"><span class="zh">' + ex.zh + '</span><br><span class="en">' + ex.en + '</span></li>';
    });
    html += '</ul></div>';
  });

  html += '<div class="section-title">常用成语</div>';
  html += '<div class="idiom-grid">';
  data.idioms.forEach(function(id) {
    html += '<div class="idiom-tag" onclick="copyText(\'' + id + '\')">' + id + '</div>';
  });
  html += '</div>';

  html += '<div class="section-title">常用搭配</div>';
  html += '<div class="collocation-list">';
  data.collocations.forEach(function(c) {
    html += '<div class="collocation-item">' + c + '</div>';
  });
  html += '</div>';

  html += '<div class="section-title">组词</div>';
  html += '<div class="word-list">';
  data.words.forEach(function(w) {
    html += '<div class="word-item">' + w + '</div>';
  });
  html += '</div></div>';
  document.getElementById('resultArea').innerHTML = html;
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(function() {
    var hint = document.createElement('div');
    hint.className = 'copy-hint';
    hint.style.display = 'block';
    hint.textContent = '✓ 已复制: ' + text;
    event.target.appendChild(hint);
    setTimeout(function() { hint.remove(); }, 1500);
  });
}

function addToHistory(ch) {
  history = history.filter(function(h) { return h !== ch; });
  history.unshift(ch);
  if (history.length > 50) history.pop();
  localStorage.setItem('char_history', JSON.stringify(history));
}

function addToFavorites(ch) {
  if (favorites.indexOf(ch) < 0) {
    favorites.push(ch);
    localStorage.setItem('char_favorites', JSON.stringify(favorites));
  }
}

function removeFromFavorites(ch) {
  favorites = favorites.filter(function(f) { return f !== ch; });
  localStorage.setItem('char_favorites', JSON.stringify(favorites));
}

function toggleFav(ch) {
  if (favorites.indexOf(ch) >= 0) removeFromFavorites(ch);
  else addToFavorites(ch);
  lookupChar();
}

function showFavorites() {
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('histCard').classList.add('hidden');
  var card = document.getElementById('favCard');
  card.classList.remove('hidden');
  if (favorites.length === 0) {
    document.getElementById('favList').innerHTML = '<div style="text-align:center;color:var(--text2);padding:12px">暂无收藏</div>';
    return;
  }
  var html = '';
  favorites.forEach(function(f) {
    html += '<div class="history-item"><span style="font-size:1.2rem;cursor:pointer" onclick="jumpTo(\'' + f + '\')">' + f + '</span><span><button class="fav-btn" onclick="removeFromFavorites(\'' + f + '\');showFavorites()">移除</button></span></div>';
  });
  document.getElementById('favList').innerHTML = html;
}

function showHistory() {
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('favCard').classList.add('hidden');
  var card = document.getElementById('histCard');
  card.classList.remove('hidden');
  if (history.length === 0) {
    document.getElementById('histList').innerHTML = '<div style="text-align:center;color:var(--text2);padding:12px">暂无记录</div>';
    return;
  }
  var html = '';
  history.forEach(function(h) {
    html += '<div class="history-item" onclick="jumpTo(\'' + h + '\')"><span>' + h + '</span></div>';
  });
  document.getElementById('histList').innerHTML = html;
}

function jumpTo(ch) {
  document.getElementById('searchInput').value = ch;
  lookupChar();
}

function toggleTheme() {
  var h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
}

document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') lookupChar(); });
lookupChar();
</script>
</body>
</html>
