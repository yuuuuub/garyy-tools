<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 上线清单</title>
<meta name="description" content="发布上线检查清单工具，确保每次发布都经过完整检查">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.progress-ring{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.ring{width:100px;height:100px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--border)}
.ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring .pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.3rem;font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:14px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-num{font-size:1.5rem;font-weight:700}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:2px}
.checklist-group{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.checklist-group h3{font-size:.95rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.check-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;transition:all .15s;cursor:pointer}
.check-item:hover{border-color:var(--accent)}
.check-item.checked{opacity:.6;background:rgba(63,185,80,.03);border-color:var(--green)}
.check-box{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.check-item.checked .check-box{background:var(--green);border-color:var(--green);color:#fff}
.check-text{flex:1;font-size:.9rem}
.check-item.checked .check-text{text-decoration:line-through;color:var(--text2)}
.check-note{font-size:.8rem;color:var(--text2);margin-top:2px}
.check-actions{display:flex;gap:4px}
.check-actions button{padding:3px 8px;font-size:.75rem}
.release-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;cursor:pointer;transition:all .2s}
.release-card:hover{border-color:var(--accent)}
.release-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.empty{color:var(--text2);text-align:center;padding:30px}
.timeline{margin-top:12px;padding-left:20px;border-left:2px solid var(--border)}
.timeline-item{padding:6px 0 6px 16px;font-size:.85rem;position:relative}
.timeline-item::before{content:'';position:absolute;left:-6px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
@media(max-width:768px){.stats-grid{grid-template-columns:1fr}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🚀 上线清单">
<meta property="og:description" content="发布上线检查清单工具，确保每次发布都经过完整检查">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/release-checklist-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='releasecheck_data';
let state=JSON.parse(localStorage.getItem(STORE)||'{"releases":[]}');
if(!state.releases.length){
  const defaultGroups=[
    {name:'📋 发布前检查',items:[
      {id:'c1',text:'代码合并到主分支',note:'确保所有PR已合并',checked:false},
      {id:'c2',text:'单元测试全部通过',note:'CI/CD流水线绿色',checked:true},
      {id:'c3',text:'代码审查完成',note:'至少2人approve',checked:true},
      {id:'c4',text:'版本号更新',note:'package.json版本号',checked:false},
      {id:'c5',text:'CHANGELOG更新',note:'记录所有变更',checked:false}
    ]},
    {name:'🔍 测试验证',items:[
      {id:'c6',text:'功能测试通过',note:'测试环境完整跑通',checked:false},
      {id:'c7',text:'回归测试通过',note:'核心流程无回退',checked:false},
      {id:'c8',text:'性能测试达标',note:'响应时间<200ms',checked:false},
      {id:'c9',text:'安全扫描无高危',note:'Snyk/OWASP扫描',checked:false}
    ]},
    {name:'⚙️ 环境准备',items:[
      {id:'c10',text:'数据库迁移脚本就绪',note:'含回滚脚本',checked:false},
      {id:'c11',text:'配置项确认',note:'环境变量/特性开关',checked:false},
      {id:'c12',text:'监控告警配置',note:'新增指标监控',checked:false},
      {id:'c13',text:'CDN/缓存刷新策略',note:'静态资源版本化',checked:false}
    ]},
    {name:'📢 发布后验证',items:[
      {id:'c14',text:'线上冒烟测试',note:'核心流程验证',checked:false},
      {id:'c15',text:'监控无异常',note:'错误率/延迟/成功率',checked:false},
      {id:'c16',text:'通知相关团队',note:'产品/运营/客服',checked:false},
      {id:'c17',text:'文档更新',note:'API文档/用户手册',checked:false}
    ]}
  ];
  state.releases=[{id:'r1',name:'v2.1.0 - 支付模块上线',version:'v2.1.0',date:new Date().toISOString().slice(0,10),status:'in_progress',groups:defaultGroups,
    timeline:[{action:'创建发布清单',user:'张三',date:new Date().toISOString().slice(0,10)}]
  }];
}
let showModal=false,editingItem=null,editingRelease=null;
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function genId(){return'c'+Date.now().toString(36).slice(-4)}
function getRelease(){return state.releases.find(r=>r.id===editingRelease)||state.releases[0]}

function render(){
  let h=`<div class="hdr"><h1>🚀 上线清单</h1><p>发布前完整检查，确保上线质量</p></div>`;

  h+=`<div class="cd"><div class="flex-between"><h2 style="margin:0">发布版本</h2><button onclick="openNewRelease()">+ 新版本</button></div><div style="margin-top:10px">`;
  state.releases.forEach(r=>{
    const total=r.groups.reduce((s,g)=>s+g.items.length,0);
    const checked=r.groups.reduce((s,g)=>s+g.items.filter(i=>i.checked).length,0);
    const pct=total?Math.round(checked/total*100):0;
    h+=`<div class="release-card ${r.id===editingRelease||(!editingRelease&&r===state.releases[0])?'active':''}" onclick="editingRelease='${r.id}';render()"><div class="flex-between"><strong>${r.name}</strong><span style="font-size:.8rem;color:var(--text2)">${pct}% · ${checked}/${total} · ${r.date}</span></div><div style="width:100%;height:6px;background:var(--border);border-radius:3px;margin-top:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${pct>=100?'var(--green)':pct>=50?'var(--yellow)':'var(--red)'};border-radius:3px"></div></div></div>`;
  });
  h+=`</div></div>`;

  const rel=getRelease();
  if(!rel){h+=`<div class="cd"><p class="empty">请选择或创建发布版本</p></div>`;$('app').innerHTML=h;return}

  const total=rel.groups.reduce((s,g)=>s+g.items.length,0);
  const checked=rel.groups.reduce((s,g)=>s+g.items.filter(i=>i.checked).length,0);
  const pct=total?Math.round(checked/total*100):0;
  const circumference=2*Math.PI*42;

  h+=`<div class="cd"><div class="progress-ring"><div class="ring"><svg width="100" height="100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference*(1-pct/100)}"/></svg><div class="pct" style="color:${pct>=100?'var(--green)':pct>=50?'var(--yellow)':'var(--red)'}">${pct}%</div></div><div><div style="font-size:1.2rem;font-weight:700">${checked} / ${total} 项已完成</div><div style="font-size:.85rem;color:var(--text2)">${pct>=100?'🎉 所有检查项已完成，可以发布！':'⚠️ 还有 '+(total-checked)+' 项未完成'}</div>${pct>=100?`<button onclick="completeRelease('${rel.id}')" style="margin-top:8px;padding:6px 14px;font-size:.85rem">🚀 标记发布完成</button>`:''}</div></div></div>`;

  h+=`<div class="cd"><div class="flex-between"><h2 style="margin:0">检查清单</h2><button onclick="openNewGroup()">+ 新分组</button></div></div>`;

  rel.groups.forEach((g,gi)=>{
    const gChecked=g.items.filter(i=>i.checked).length;
    h+=`<div class="checklist-group"><div class="flex-between"><h3 style="margin:0">${g.name} <span style="font-size:.8rem;color:var(--text2);font-weight:400">${gChecked}/${g.items.length}</span></h3><div class="flex"><button onclick="openNewItem(${gi})" style="padding:4px 10px;font-size:.8rem">+ 检查项</button><button class="sec" onclick="renameGroup(${gi})" style="padding:4px 10px;font-size:.8rem">✏️</button><button class="dng" onclick="deleteGroup(${gi})" style="padding:4px 10px;font-size:.8rem">🗑️</button></div></div>`;
    g.items.forEach((item,ii)=>{
      h+=`<div class="check-item ${item.checked?'checked':''}" onclick="toggleItem(${gi},${ii})"><div class="check-box">${item.checked?'✓':''}</div><div style="flex:1"><div class="check-text">${item.text}</div>${item.note?`<div class="check-note">${item.note}</div>`:''}</div><div class="check-actions"><button class="sec" onclick="event.stopPropagation();editItem(${gi},${ii})" style="padding:3px 6px;font-size:.75rem">✏️</button><button class="dng" onclick="event.stopPropagation();deleteItem(${gi},${ii})" style="padding:3px 6px;font-size:.75rem">✕</button></div></div>`;
    });
    if(!g.items.length)h+=`<p style="text-align:center;color:var(--text2);padding:10px;font-size:.85rem">暂无检查项</p>`;
    h+=`</div>`;
  });

  if(rel.timeline?.length){
    h+=`<div class="cd"><h2>📜 操作记录</h2><div class="timeline">`;
    rel.timeline.slice(-10).reverse().forEach(t=>{
      h+=`<div class="timeline-item">${t.action} <span style="color:var(--accent)">${t.user}</span> <span style="color:var(--text2);font-size:.8rem">${t.date}</span></div>`;
    });
    h+=`</div></div>`;
  }

  if(showModal)h+=renderModal();
  $('app').innerHTML=h;
}

function renderModal(){
  let h=`<div class="modal-overlay" onclick="showModal=false;editingItem=null;render()"><div class="modal" onclick="event.stopPropagation()">`;
  if(editingItem?.type==='release'){
    h+=`<h2 style="margin-bottom:16px">📦 新发布版本</h2>`;
    h+=`<label>版本名称</label><input id="mName" value="" placeholder="如：v2.2.0 - 新功能上线">`;
    h+=`<label>版本号</label><input id="mVersion" value="" placeholder="如：v2.2.0">`;
  } else if(editingItem?.type==='group'){
    h+=`<h2 style="margin-bottom:16px">📁 新检查分组</h2>`;
    h+=`<label>分组名称</label><input id="mGroupName" value="${editingItem.name||''}" placeholder="如：发布前检查">`;
  } else {
    const isEdit=!!editingItem?.isEdit;
    h+=`<h2 style="margin-bottom:16px">${isEdit?'✏️ 编辑检查项':'➕ 新检查项'}</h2>`;
    h+=`<label>检查项</label><input id="mItemText" value="${editingItem?.text||''}" placeholder="如：单元测试全部通过">`;
    h+=`<label>备注</label><input id="mItemNote" value="${editingItem?.note||''}" placeholder="可选说明">`;
  }
  h+=`<div class="flex" style="margin-top:16px;justify-content:flex-end"><button class="sec" onclick="showModal=false;editingItem=null;render()">取消</button><button onclick="saveModalItem()">保存</button></div>`;
  h+=`</div></div>`;
  return h;
}

function openNewRelease(){editingItem={type:'release'};showModal=true;render()}
function openNewGroup(){editingItem={type:'group'};showModal=true;render()}
function openNewItem(groupIdx){editingItem={type:'item',groupIdx};showModal=true;render()}
function editItem(gi,ii){
  const item=getRelease().groups[gi].items[ii];
  editingItem={type:'item',groupIdx:gi,isEdit:true,text:item.text,note:item.note};
  showModal=true;render();
}
function renameGroup(gi){
  const g=getRelease().groups[gi];
  editingItem={type:'group',groupIdx:gi,name:g.name};
  showModal=true;render();
}
function saveModalItem(){
  const rel=getRelease();
  if(!rel)return;
  if(editingItem.type==='release'){
    const name=$('mName').value.trim();
    if(!name){alert('请输入名称');return}
    const r={id:'r'+Date.now().toString(36),name,version:$('mVersion').value.trim(),date:new Date().toISOString().slice(0,10),status:'in_progress',groups:[],timeline:[{action:'创建发布清单',user:'我',date:new Date().toISOString().slice(0,10)}]};
    state.releases.unshift(r);editingRelease=r.id;
  } else if(editingItem.type==='group'){
    const name=$('mGroupName').value.trim();
    if(!name){alert('请输入名称');return}
    if(editingItem.groupIdx!==undefined){rel.groups[editingItem.groupIdx].name=name}
    else rel.groups.push({name,items:[]});
  } else {
    const text=$('mItemText').value.trim();
    if(!text){alert('请输入检查项');return}
    const note=$('mItemNote').value.trim();
    if(editingItem.isEdit){
      rel.groups[editingItem.groupIdx].items.push({id:genId(),text,note,checked:false});
    } else {
      rel.groups[editingItem.groupIdx].items.push({id:genId(),text,note,checked:false});
    }
  }
  save();showModal=false;editingItem=null;render();
}
function toggleItem(gi,ii){
  const rel=getRelease();
  if(!rel)return;
  const item=rel.groups[gi].items[ii];
  item.checked=!item.checked;
  if(item.checked){
    rel.timeline.push({action:`完成：${item.text}`,user:'我',date:new Date().toISOString().slice(0,10)});
  }
  save();render();
}
function deleteItem(gi,ii){const rel=getRelease();if(rel)rel.groups[gi].items.splice(ii,1);save();render()}
function deleteGroup(gi){if(!confirm('确定删除此分组？'))return;const rel=getRelease();if(rel)rel.groups.splice(gi,1);save();render()}
function completeRelease(id){
  const r=state.releases.find(x=>x.id===id);
  if(r){r.status='done';r.timeline.push({action:'🚀 发布完成',user:'我',date:new Date().toISOString().slice(0,10)})}save();render();
}
render();
</script>
</body>
</html>
