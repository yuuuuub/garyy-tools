<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房贷计算器</title>
<meta name="description" content="房贷计算器，计算月供总额和利息明细">
<style>
:root {
  --bg: #f5f7fa;
  --card-bg: #fff;
  --text: #1a1a2e;
  --text-secondary: #555;
  --border: #e0e0e0;
  --primary: #4f6ef7;
  --primary-hover: #3b54d4;
  --accent: #ff6b6b;
  --accent2: #ffd93d;
  --table-stripe: #f9fafc;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --input-bg: #fff;
}

:root.dark {
  --bg: #0f0f1a;
  --card-bg: #1a1a2e;
  --text: #e0e0e0;
  --text-secondary: #a0a0b0;
  --border: #2a2a3e;
  --primary: #6c83f7;
  --primary-hover: #5a6fd6;
  --accent: #ff6b6b;
  --accent2: #ffd93d;
  --table-stripe: #1e1e35;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --input-bg: #12122a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 0 12px;
}

.header h1 {
  font-size: 1.5rem;
  font-weight: 700;
}

.theme-toggle {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s;
}

.card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.card-title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--text);
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.form-row {
  display: flex;
  gap: 12px;
}

.form-row .form-group {
  flex: 1;
  margin-bottom: 0;
}

input, select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.95rem;
  background: var(--input-bg);
  color: var(--text);
  transition: border 0.2s;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,110,247,0.15);
}

.btn {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

.btn:hover { background: var(--primary-hover); }

.result-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 8px;
}

.result-item {
  background: var(--table-stripe);
  border-radius: 8px;
  padding: 12px;
  text-align: center;
}

.result-item .label {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.result-item .value {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--primary);
}

.result-item .value.accent { color: var(--accent); }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
  margin-top: 8px;
}

th, td {
  padding: 10px 8px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

th {
  background: var(--table-stripe);
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--text-secondary);
}

tr:nth-child(even) td { background: var(--table-stripe); }

.table-scroll {
  max-height: 320px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
}

.table-scroll table th {
  position: sticky;
  top: 0;
  z-index: 1;
}

.fun-facts {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.fun-fact {
  padding: 14px;
  border-radius: 8px;
  font-size: 0.9rem;
  line-height: 1.5;
}

.fun-fact.tesla {
  background: linear-gradient(135deg, rgba(255,107,107,0.1), rgba(255,107,107,0.05));
  border-left: 4px solid var(--accent);
}

.fun-fact.save {
  background: linear-gradient(135deg, rgba(255,217,61,0.1), rgba(255,217,61,0.05));
  border-left: 4px solid var(--accent2);
}

.fun-fact .highlight {
  font-weight: 700;
  font-size: 1.05rem;
}

.ratio-btns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.ratio-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
}

.ratio-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.ratio-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.chart-bar-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.chart-label {
  font-size: 0.8rem;
  width: 80px;
  flex-shrink: 0;
  text-align: right;
  color: var(--text-secondary);
}

.chart-bar {
  height: 24px;
  border-radius: 4px;
  transition: width 0.5s ease;
  min-width: 2px;
  display: flex;
  align-items: center;
  padding-left: 8px;
  font-size: 0.75rem;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
}

.chart-bar.interest { background: var(--accent); }
.chart-bar.principal { background: var(--primary); }

.toggle-detail {
  background: none;
  border: none;
  color: var(--primary);
  font-size: 0.85rem;
  cursor: pointer;
  padding: 4px 0;
}

.toggle-detail:hover {
  text-decoration: underline;
}

.hidden { display: none !important; }

@media (max-width: 480px) {
  .form-row { flex-direction: column; gap: 14px; }
  .form-row .form-group { margin-bottom: 0; }
  .result-grid { grid-template-columns: 1fr 1fr; }
  .chart-label { width: 60px; font-size: 0.7rem; }
}

@media (min-width: 768px) {
  .container { padding: 24px; }
  .header h1 { font-size: 1.8rem; }
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div class="container">

  <div class="header">
    <h1>&#127968; 房贷计算器</h1>
    <button class="theme-toggle" id="themeToggle" title="切换暗色模式">&#9790;</button>
  </div>

  <div class="card">
    <div class="card-title">贷款参数</div>
    <div class="form-group">
      <label>房屋总价（万元）</label>
      <input type="number" id="totalPrice" value="300" step="1" min="1">
    </div>
    <div class="form-group">
      <label>首付比例</label>
      <div class="ratio-btns">
        <button class="ratio-btn" data-ratio="15">15%</button>
        <button class="ratio-btn" data-ratio="20">20%</button>
        <button class="ratio-btn active" data-ratio="30">30%</button>
        <button class="ratio-btn" data-ratio="40">40%</button>
        <button class="ratio-btn" data-ratio="50">50%</button>
      </div>
      <input type="number" id="downPaymentPct" value="30" min="0" max="100" step="0.1" style="margin-top:8px;">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>贷款年限（年）</label>
        <select id="loanYears">
          <option value="5">5年</option>
          <option value="10">10年</option>
          <option value="15">15年</option>
          <option value="20">20年</option>
          <option value="25">25年</option>
          <option value="30" selected>30年</option>
        </select>
      </div>
      <div class="form-group">
        <label>年利率（%）</label>
        <input type="number" id="annualRate" value="4.2" step="0.01" min="0.01">
      </div>
    </div>
    <button class="btn" id="calcBtn">&#128269; 开始计算</button>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="card-title">计算结果</div>
    <div class="result-grid" id="resultGrid"></div>
  </div>

  <div class="card hidden" id="compareCard">
    <div class="card-title">两种还款方式对比</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>对比项</th>
            <th>等额本息</th>
            <th>等额本金</th>
          </tr>
        </thead>
        <tbody id="compareBody"></tbody>
      </table>
    </div>
    <canvas id="compareChart" style="margin-top:16px; width:100%; height:160px;"></canvas>
  </div>

  <div class="card hidden" id="equalInstallmentCard">
    <div class="card-title">等额本息 - 每月固定还款</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>期数</th><th>月供</th><th>本金</th><th>利息</th><th>剩余本金</th></tr>
        </thead>
        <tbody id="equalInstallBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card hidden" id="equalPrincipalCard">
    <div class="card-title">等额本金 - 每月递减</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>期数</th><th>月供</th><th>本金</th><th>利息</th><th>剩余本金</th></tr>
        </thead>
        <tbody id="equalPrinBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card hidden" id="funCard">
    <div class="card-title">&#127881; 趣味解读</div>
    <div class="fun-facts">
      <div class="fun-fact tesla" id="teslaFact"></div>
      <div class="fun-fact save" id="saveFact"></div>
    </div>
  </div>

</div>

<script>
(function() {

  // ===== Theme toggle =====
  const themeBtn = document.getElementById('themeToggle');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (prefersDark) {
    document.documentElement.classList.add('dark');
    themeBtn.innerHTML = '&#9788;';
  }
  themeBtn.addEventListener('click', function() {
    document.documentElement.classList.toggle('dark');
    themeBtn.innerHTML = document.documentElement.classList.contains('dark') ? '&#9788;' : '&#9790;';
  });

  // ===== Ratio buttons =====
  const ratioBtns = document.querySelectorAll('.ratio-btn');
  const downPaymentPctInput = document.getElementById('downPaymentPct');
  ratioBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      ratioBtns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      downPaymentPctInput.value = btn.dataset.ratio;
      calculate();
    });
  });
  downPaymentPctInput.addEventListener('input', function() {
    ratioBtns.forEach(function(b) {
      b.classList.toggle('active', parseFloat(b.dataset.ratio) === parseFloat(downPaymentPctInput.value));
    });
  });

  // ===== Calculate =====
  document.getElementById('calcBtn').addEventListener('click', calculate);

  // Trigger on input changes
  ['totalPrice', 'downPaymentPct', 'loanYears', 'annualRate'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', calculate);
  });
  document.getElementById('loanYears').addEventListener('change', calculate);

  function calculate() {
    var totalPrice = parseFloat(document.getElementById('totalPrice').value) || 0;
    var downPct = parseFloat(document.getElementById('downPaymentPct').value) || 0;
    var loanYears = parseInt(document.getElementById('loanYears').value) || 0;
    var annualRate = parseFloat(document.getElementById('annualRate').value) || 0;

    if (totalPrice <= 0 || loanYears <= 0 || annualRate <= 0) return;

    var totalPriceYuan = totalPrice * 10000;
    var downPayment = totalPriceYuan * downPct / 100;
    var loanAmount = totalPriceYuan - downPayment;
    var totalMonths = loanYears * 12;
    var monthlyRate = annualRate / 100 / 12;

    // ===== 等额本息 =====
    var equalInstallMonthly = 0;
    var equalInstallTotal = 0;
    var equalInstallInterest = 0;
    if (monthlyRate === 0) {
      equalInstallMonthly = loanAmount / totalMonths;
      equalInstallTotal = loanAmount;
    } else {
      var tmp = Math.pow(1 + monthlyRate, totalMonths);
      equalInstallMonthly = loanAmount * monthlyRate * tmp / (tmp - 1);
      equalInstallTotal = equalInstallMonthly * totalMonths;
    }
    equalInstallInterest = equalInstallTotal - loanAmount;

    // ===== 等额本金 =====
    var monthlyPrincipal = loanAmount / totalMonths;
    var equalPrinFirstMonth = monthlyPrincipal + loanAmount * monthlyRate;
    var equalPrinLastMonth = monthlyPrincipal + (loanAmount - monthlyPrincipal * (totalMonths - 1)) * monthlyRate;
    var equalPrinInterest = 0;
    var equalPrinTotal = 0;
    for (var i = 0; i < totalMonths; i++) {
      var remain = loanAmount - monthlyPrincipal * i;
      equalPrinInterest += remain * monthlyRate;
    }
    equalPrinTotal = loanAmount + equalPrinInterest;

    // ===== Display results =====
    document.getElementById('resultCard').classList.remove('hidden');
    document.getElementById('resultGrid').innerHTML = [
      { label: '首付金额', value: fmt(downPayment), cls: '' },
      { label: '贷款金额', value: fmt(loanAmount), cls: '' },
      { label: '等额本息 月供', value: fmt(equalInstallMonthly), cls: '' },
      { label: '等额本金 首月', value: fmt(equalPrinFirstMonth), cls: '' },
      { label: '等额本息 总还款', value: fmt(equalInstallTotal), cls: '' },
      { label: '等额本金 总还款', value: fmt(equalPrinTotal), cls: '' },
      { label: '等额本息 总利息', value: fmt(equalInstallInterest), cls: 'accent' },
      { label: '等额本金 总利息', value: fmt(equalPrinInterest), cls: 'accent' }
    ].map(function(r) {
      return '<div class="result-item"><div class="label">' + r.label + '</div>' +
        '<div class="value' + (r.cls ? ' ' + r.cls : '') + '">' + r.value + '</div></div>';
    }).join('');

    // ===== Compare table =====
    document.getElementById('compareCard').classList.remove('hidden');
    var diffTotal = equalInstallTotal - equalPrinTotal;
    var diffInterest = equalInstallInterest - equalPrinInterest;
    var diffMonthly = equalInstallMonthly - equalPrinFirstMonth;
    document.getElementById('compareBody').innerHTML = [
      { label: '月供（首月）', a: fmt(equalInstallMonthly), b: fmt(equalPrinFirstMonth) },
      { label: '月供（末月）', a: fmt(equalInstallMonthly), b: fmt(equalPrinLastMonth) },
      { label: '总还款额', a: fmt(equalInstallTotal), b: fmt(equalPrinTotal) },
      { label: '总利息', a: fmt(equalInstallInterest), b: fmt(equalPrinInterest) },
      { label: '多付利息', a: fmt(Math.max(0, equalInstallInterest - equalPrinInterest)), b: '\u2014' },
      { label: '特点', a: '每月固定，压力均匀', b: '每月递减，前期压力大' }
    ].map(function(r) {
      return '<tr><td>' + r.label + '</td><td>' + r.a + '</td><td>' + r.b + '</td></tr>';
    }).join('');

    // ===== Draw compare chart =====
    drawCompareChart(loanAmount, totalMonths, monthlyRate, monthlyPrincipal);

    // ===== Equal installment detail =====
    document.getElementById('equalInstallCard').classList.remove('hidden');
    var eiRows = '';
    var eiBalance = loanAmount;
    var step = Math.max(1, Math.floor(totalMonths / 24));
    for (var m = 1; m <= totalMonths; m++) {
      var eiInterest = eiBalance * monthlyRate;
      var eiPrincipal = equalInstallMonthly - eiInterest;
      eiBalance -= eiPrincipal;
      if (m === 1 || m === totalMonths || m % step === 0) {
        eiRows += '<tr><td>' + m + '</td><td>' + fmt(equalInstallMonthly) + '</td><td>' +
          fmt(eiPrincipal) + '</td><td>' + fmt(eiInterest) + '</td><td>' + fmt(Math.max(0, eiBalance)) + '</td></tr>';
      }
    }
    document.getElementById('equalInstallBody').innerHTML = eiRows;

    // ===== Equal principal detail =====
    document.getElementById('equalPrincipalCard').classList.remove('hidden');
    var epRows = '';
    var epBalance = loanAmount;
    for (var n = 1; n <= totalMonths; n++) {
      var epInterest = epBalance * monthlyRate;
      var epMonthly = monthlyPrincipal + epInterest;
      epBalance -= monthlyPrincipal;
      if (n === 1 || n === totalMonths || n % step === 0) {
        epRows += '<tr><td>' + n + '</td><td>' + fmt(epMonthly) + '</td><td>' +
          fmt(monthlyPrincipal) + '</td><td>' + fmt(epInterest) + '</td><td>' + fmt(Math.max(0, epBalance)) + '</td></tr>';
      }
    }
    document.getElementById('equalPrinBody').innerHTML = epRows;

    // ===== Fun facts =====
    document.getElementById('funCard').classList.remove('hidden');
    // Tesla: assume ~250,000 yuan per Tesla
    var teslaPrice = 250000;
    var totalInterest = equalInstallInterest;
    var teslaCount = Math.floor(totalInterest / teslaPrice);
    document.getElementById('teslaFact').innerHTML = '你支付的利息够买 <span class="highlight">' + teslaCount + ' 辆</span> 特斯拉（按 ' +
      fmt(teslaPrice) + '/辆计算）&#127950;';

    // If rate drops 0.5%
    var lowerRate = annualRate / 100 - 0.005;
    var lowerMonthly = 0;
    if (lowerRate <= 0) lowerRate = 0.001;
    var lowerMonthlyRate = lowerRate / 12;
    if (monthlyRate === 0) {
      lowerMonthly = equalInstallMonthly;
    } else {
      var tmp2 = Math.pow(1 + lowerMonthlyRate, totalMonths);
      lowerMonthly = loanAmount * lowerMonthlyRate * tmp2 / (tmp2 - 1);
    }
    var monthlySave = equalInstallMonthly - lowerMonthly;
    var yearlySave = monthlySave * 12;
    document.getElementById('saveFact').innerHTML = '如果利率降 <span class="highlight">0.5%</span>（至 ' +
      (lowerRate * 100).toFixed(1) + '%），你每月能省 <span class="highlight">' + fmt(monthlySave) +
      '</span>，一年省下 <span class="highlight">' + fmt(yearlySave) + '</span>，够一次出国游啦 &#9992;';
  }

  function drawCompareChart(loanAmount, totalMonths, monthlyRate, monthlyPrincipal) {
    var canvas = document.getElementById('compareChart');
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    var w = rect.width;
    var h = rect.height;
    ctx.clearRect(0, 0, w, h);

    // Chart margins
    var ml = 80, mr = 20, mt = 20, mb = 40;
    var cw = w - ml - mr;
    var ch = h - mt - mb;

    // Background
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--card-bg').trim();
    ctx.fillRect(0, 0, w, h);

    // Data
    var maxMonths = Math.min(totalMonths, 360);
    var maxMonthly = 0;
    var eiData = [], epData = [];
    var pointInterval = Math.max(1, Math.floor(maxMonths / 100));

    // EI line
    var eiBalance = loanAmount;
    for (var i = 1; i <= maxMonths; i++) {
      var eiInterest = eiBalance * monthlyRate;
      var tmp = Math.pow(1 + monthlyRate, totalMonths);
      var eiMonth = loanAmount * monthlyRate * tmp / (tmp - 1);
      eiBalance -= (eiMonth - eiInterest);
      if (i % pointInterval === 0 || i === maxMonths || i === 1) {
        eiData.push({ m: i, v: eiMonth });
        maxMonthly = Math.max(maxMonthly, eiMonth);
      }
    }

    var epBalance = loanAmount;
    for (i = 1; i <= maxMonths; i++) {
      var epCurrent = monthlyPrincipal + epBalance * monthlyRate;
      epBalance -= monthlyPrincipal;
      if (i % pointInterval === 0 || i === maxMonths || i === 1) {
        epData.push({ m: i, v: epCurrent });
        maxMonthly = Math.max(maxMonthly, epCurrent);
      }
    }

    // Scale
    var xScale = cw / maxMonths;
    var yScale = ch / (maxMonthly * 1.05);

    // Grid lines
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
    ctx.lineWidth = 0.5;
    ctx.font = '10px sans-serif';
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim();
    var gridLines = 5;
    for (var g = 0; g <= gridLines; g++) {
      var gy = mt + (ch * g / gridLines);
      ctx.beginPath();
      ctx.moveTo(ml, gy);
      ctx.lineTo(ml + cw, gy);
      ctx.stroke();
      ctx.fillText(fmtShort(maxMonthly * (gridLines - g) / gridLines), 2, gy + 3);
    }

    // X-axis labels
    for (g = 0; g <= 4; g++) {
      var gx = ml + (cw * g / 4);
      ctx.beginPath();
      ctx.moveTo(gx, mt);
      ctx.lineTo(gx, mt + ch);
      ctx.stroke();
      var mLabel = Math.round(maxMonths * g / 4);
      ctx.fillText(mLabel + '月', gx - 15, mt + ch + 16);
    }

    // Draw EP line (等额本金 - accent/red)
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (i = 0; i < epData.length; i++) {
      var ex = ml + epData[i].m * xScale;
      var ey = mt + ch - epData[i].v * yScale;
      if (i === 0) ctx.moveTo(ex, ey);
      else ctx.lineTo(ex, ey);
    }
    ctx.stroke();

    // Draw EI line (等额本息 - primary/blue)
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (i = 0; i < eiData.length; i++) {
      var ix = ml + eiData[i].m * xScale;
      var iy = mt + ch - eiData[i].v * yScale;
      if (i === 0) ctx.moveTo(ix, iy);
      else ctx.lineTo(ix, iy);
    }
    ctx.stroke();

    // Legend
    var legendY = mt - 4;
    ctx.font = '11px sans-serif';
    // EI legend
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
    ctx.fillRect(ml, legendY, 12, 12);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
    ctx.fillText('等额本息', ml + 16, legendY + 10);
    // EP legend
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    ctx.fillRect(ml + 80, legendY, 12, 12);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
    ctx.fillText('等额本金', ml + 96, legendY + 10);
  }

  function fmt(n) {
    return '\u00a5' + n.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function fmtShort(n) {
    if (n >= 10000) return (n / 10000).toFixed(1) + '万';
    return n.toFixed(0);
  }

  // Init dark mode toggle icon and calculate on load
  if (prefersDark) {
    themeBtn.innerHTML = '&#9788;';
  }

  // Auto calculate on page load
  calculate();

})();
</script>
<script src="../i18n.js"></script>
</body>
