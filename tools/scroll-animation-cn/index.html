<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滚动动画工具</title>
<meta property="og:title" content="滚动动画工具">
<meta property="og:description" content="滚动动画工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="滚动动画工具，创建各种滚动触发的CSS动画效果">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖱️</text></svg>">
<meta name="robots" content="index, follow">
<script src="../i18n.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--pink:#ec4899;--cyan:#06b6d4;--orange:#f97316;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--green:#1a7f37;--red:#cf222e;--shadow:0 4px 24px rgba(0,0,0,.1)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px}
.header-inner{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.4rem;margin:0}
.subtitle{color:var(--text2);font-size:.85rem}
.container{max-width:1000px;margin:0 auto;padding:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;margin-bottom:20px;overflow-x:auto;padding-bottom:8px}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;white-space:nowrap;color:var(--text2);background:var(--card);border:1px solid var(--border);transition:all .2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab:hover:not(.active){border-color:var(--accent)}
.demo-section{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.demo-box{width:300px;height:200px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;transition:all .8s cubic-bezier(.4,0,.2,1)}
.scroll-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--pink));z-index:200;transition:width .1s}
.scroll-indicator{position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);transition:all .3s;opacity:0;transform:translateY(10px)}
.scroll-indicator.visible{opacity:1;transform:translateY(0)}
.scroll-indicator:hover{transform:scale(1.1)}
.scroll-reveal{opacity:0;transform:translateY(40px);transition:all .8s cubic-bezier(.4,0,.2,1)}
.scroll-reveal.visible{opacity:1;transform:translateY(0)}
.scroll-reveal-left{opacity:0;transform:translateX(-60px);transition:all .8s cubic-bezier(.4,0,.2,1)}
.scroll-reveal-left.visible{opacity:1;transform:translateX(0)}
.scroll-reveal-right{opacity:0;transform:translateX(60px);transition:all .8s cubic-bezier(.4,0,.2,1)}
.scroll-reveal-right.visible{opacity:1;transform:translateX(0)}
.scroll-reveal-scale{opacity:0;transform:scale(.8);transition:all .8s cubic-bezier(.4,0,.2,1)}
.scroll-reveal-scale.visible{opacity:1;transform:scale(1)}
.scroll-reveal-rotate{opacity:0;transform:rotate(-10deg) scale(.9);transition:all .8s cubic-bezier(.4,0,.2,1)}
.scroll-reveal-rotate.visible{opacity:1;transform:rotate(0) scale(1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes rotate360{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
@keyframes skewIn{from{opacity:0;transform:skewX(-15deg) translateX(-50px)}to{opacity:1;transform:skewX(0) translateX(0)}}
@keyframes flipIn{from{opacity:0;transform:perspective(400px) rotateY(90deg)}to{opacity:1;transform:perspective(400px) rotateY(0)}}
@keyframes zoomBounce{0%{opacity:0;transform:scale(0)}60%{transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
@keyframes slideUpBounce{0%{opacity:0;transform:translateY(60px)}60%{transform:translateY(-10px)}100%{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:0}.container{padding:10px}h1{font-size:1.2rem}.demo-box{width:200px;height:150px;font-size:1rem}}
</style>
</head>
<body>
<div class="scroll-progress" id="scrollProgress"></div>
<div class="scroll-indicator" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>

<div class="header">
<div class="header-inner">
<div><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem">← 首页</a></div>
<h1>🖱️ 滚动动画工具</h1>
<div class="tabs" id="tabs"></div>
</div>
</div>

<div class="container" id="app"></div>
<script>
document.title='🖱️ 滚动动画工具';
const $=id=>document.getElementById(id);
const APP=$('app');
const COLORS=['#3b82f6','#3fb950','#f85149','#d29922','#a855f7','#ec4899','#06b6d4','#f97316'];

let curEffect='fadeUp';

const effects=[
  {id:'fadeUp',name:'淡入上移',desc:'元素从下方淡入'},
  {id:'fadeLeft',name:'淡入左移',desc:'元素从左侧淡入'},
  {id:'fadeRight',name:'淡入右移',desc:'元素从右侧淡入'},
  {id:'scale',name:'缩放进入',desc:'元素从小到大缩放'},
  {id:'rotate',name:'旋转进入',desc:'元素旋转淡入'},
  {id:'parallax',name:'视差效果',desc:'滚动速度差异化'},
  {id:'stagger',name:'交错显示',desc:'子元素依次出现'},
  {id:'text',name:'文字动画',desc:'逐字/逐行显示'}
];

function render(){
  let h=`<div style="text-align:center;padding:40px 0"><h1 style="font-size:2rem;margin-bottom:8px">滚动动画演示</h1><p class="subtitle">向下滚动查看动画效果</p><div style="margin-top:20px;color:var(--text2)">↓ 向下滚动 ↓</div></div>`;

  if(curEffect==='fadeUp') h+=renderFadeUp();
  else if(curEffect==='fadeLeft') h+=renderFadeLeft();
  else if(curEffect==='fadeRight') h+=renderFadeRight();
  else if(curEffect==='scale') h+=renderScale();
  else if(curEffect==='rotate') h+=renderRotate();
  else if(curEffect==='parallax') h+=renderParallax();
  else if(curEffect==='stagger') h+=renderStagger();
  else if(curEffect==='text') h+=renderText();

  h+=`<div style="text-align:center;padding:60px 0;color:var(--text2)"><p>🎉 滚动到底部</p><button class="btn btn-sm" onclick="window.scrollTo({top:0,behavior:'smooth'})">回到顶部</button></div>`;
  APP.innerHTML=h;

  $('tabs').innerHTML=effects.map(e=>`<button class="tab ${curEffect===e.id?'active':''}" onclick="curEffect='${e.id}';window.scrollTo(0,0);render()">${e.name}</button>`).join('');

  setTimeout(()=>{observeElements();updateScrollProgress();},100);
}

function renderFadeUp(){
  let h='';
  for(let i=0;i<8;i++){
    h+=`<div class="demo-section"><div class="scroll-reveal" style="transition-delay:${i*0.1}s;background:${COLORS[i%COLORS.length]}22;border:1px solid ${COLORS[i%COLORS.length]}44;min-width:300px;padding:30px;border-radius:var(--radius);text-align:center">`;
    h+=`<div style="font-size:2rem;margin-bottom:8px">${['🎯','🚀','💡','🎨','⚡','🌟','🔥','💎'][i]}</div>`;
    h+=`<div style="font-size:1.2rem;font-weight:700;color:${COLORS[i%COLORS.length]}">卡片 ${i+1}</div>`;
    h+=`<div style="color:var(--text2);margin-top:4px;font-size:.85rem">${effects[0].desc}</div>`;
    h+=`</div></div>`;
  }
  return h;
}

function renderFadeLeft(){
  let h='';
  for(let i=0;i<6;i++){
    const fromRight=i%2===1;
    h+=`<div class="demo-section"><div class="scroll-reveal" style="transition-delay:${i*0.15}s;display:flex;gap:20px;align-items:center;max-width:600px;${fromRight?'flex-direction:row-reverse':''}">`;
    h+=`<div style="width:120px;height:120px;border-radius:var(--radius);background:${COLORS[i%COLORS.length]}33;display:flex;align-items:center;justify-content:center;font-size:2.5rem;flex-shrink:0">${['📊','📈','🎯','🏆','🎪','🎨'][i]}</div>`;
    h+=`<div><div style="font-size:1.2rem;font-weight:700;margin-bottom:4px">功能模块 ${i+1}</div><div style="color:var(--text2);font-size:.9rem">这是描述文字，展示${fromRight?'右':'左'}侧淡入效果。支持延迟触发。</div></div>`;
    h+=`</div></div>`;
  }
  return h;
}

function renderFadeRight(){return renderFadeLeft();}

function renderScale(){
  let h='';
  for(let i=0;i<6;i++){
    h+=`<div class="demo-section"><div class="scroll-reveal-scale" style="transition-delay:${i*0.12}s;width:250px;height:250px;border-radius:var(--radius);background:linear-gradient(135deg,${COLORS[i%COLORS.length]}33,${COLORS[(i+1)%COLORS.length]}33);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border:1px solid var(--border)">`;
    h+=`<div style="font-size:3rem">${['🌐','📱','💻','🖥️','⌚','🎮'][i]}</div>`;
    h+=`<div style="font-weight:700">${['网站','手机','电脑','桌面','手表','游戏'][i]}</div>`;
    h+=`</div></div>`;
  }
  return h;
}

function renderRotate(){
  let h='';
  for(let i=0;i<6;i++){
    h+=`<div class="demo-section"><div class="scroll-reveal-rotate" style="transition-delay:${i*0.15}s;width:280px;padding:30px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);text-align:center;box-shadow:var(--shadow)">`;
    h+=`<div style="width:60px;height:60px;border-radius:50%;background:${COLORS[i%COLORS.length]};margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem">${['🎯','✨','🚀','💡','🎨','⚡'][i]}</div>`;
    h+=`<div style="font-weight:700;margin-bottom:4px">旋转卡片 ${i+1}</div>`;
    h+=`<div style="color:var(--text2);font-size:.85rem">旋转进入效果演示</div>`;
    h+=`</div></div>`;
  }
  return h;
}

function renderParallax(){
  let h=`<div style="position:relative;height:200vh">`;
  const layers=[
    {speed:0.1,y:100,color:COLORS[0],size:200,text:'背景层'},
    {speed:0.3,y:300,color:COLORS[1],size:150,text:'中间层'},
    {speed:0.5,y:500,color:COLORS[2],size:100,text:'前景层'}
  ];
  layers.forEach((l,i)=>{
    h+=`<div class="parallax-layer" data-speed="${l.speed}" style="position:absolute;top:${l.y}px;left:50%;transform:translateX(-50%);width:${l.size}px;height:${l.size}px;border-radius:var(--radius);background:${l.color}33;border:2px solid ${l.color};display:flex;align-items:center;justify-content:center;font-weight:700;color:${l.color};transition:transform .1s linear">`;
    h+=`<div style="text-align:center"><div style="font-size:1.5rem">${['🏔️','🌊','☀️'][i]}</div><div style="font-size:.8rem;margin-top:4px">${l.text}</div><div style="font-size:.7rem;color:var(--text2)">速度: ${l.speed}x</div></div>`;
    h+=`</div>`;
  });
  h+=`<div style="position:absolute;top:800px;left:50%;transform:translateX(-50%);text-align:center"><div style="font-size:1.5rem;font-weight:700">视差滚动效果</div><div style="color:var(--text2);font-size:.9rem">不同层级以不同速度滚动</div></div>`;
  h+=`</div>`;
  return h;
}

function renderStagger(){
  const groups=[
    {title:'网格布局',items:['📦','🎨','🔧','💡','🎯','🚀','⚡','🌟','🔮']},
    {title:'列表项',items:['📋','📝','✅','❌','⏳','🔄','📊','📈','🏆']},
    {title:'图标组',items:['🌍','🌎','🌏','🌑','🌒','🌓','🌔','🌕','🌖']}
  ];
  let h='';
  groups.forEach((g,gi)=>{
    h+=`<div style="padding:60px 16px"><h2 style="text-align:center;margin-bottom:24px;font-size:1.3rem">${g.title}</h2>`;
    h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:16px;max-width:500px;margin:0 auto">`;
    g.items.forEach((item,i)=>{
      h+=`<div class="scroll-reveal" style="transition-delay:${(gi*0.2+i*0.08).toFixed(2)}s;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;cursor:default;transition-property:opacity,transform">`;
      h+=`<div style="font-size:2rem;margin-bottom:4px">${item}</div>`;
      h+=`<div style="font-size:.75rem;color:var(--text2)">项 ${i+1}</div></div>`;
    });
    h+=`</div></div>`;
  });
  return h;
}

function renderText(){
  const texts=['滚动动画，让页面活起来','每一个元素都有灵魂','交互体验，从此不同','CSS动画，无限可能'];
  let h='';
  texts.forEach((text,ti)=>{
    h+=`<div class="demo-section" style="min-height:60vh"><div style="text-align:center;max-width:600px">`;
    h+=`<div style="font-size:2rem;font-weight:800;margin-bottom:16px">`;
    text.split('').forEach((char,i)=>{
      h+=`<span class="scroll-reveal" style="transition-delay:${ti*0.3+i*0.03}s;display:inline-block;${char===' '?'width:.3em':''}">${char}</span>`;
    });
    h+=`</div>`;
    h+=`<div class="scroll-reveal" style="transition-delay:${ti*0.3+text.length*0.03+0.2}s;color:var(--text2);font-size:.9rem">逐字动画效果 · 延迟递增</div>`;
    h+=`</div></div>`;
  });
  return h;
}

function observeElements(){
  const observer=new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('visible');
      }
    });
  },{threshold:0.1,rootMargin:'0px 0px -50px 0px'});
  document.querySelectorAll('.scroll-reveal,.scroll-reveal-left,.scroll-reveal-right,.scroll-reveal-scale,.scroll-reveal-rotate').forEach(el=>{
    observer.observe(el);
  });
}

function updateScrollProgress(){
  window.addEventListener('scroll',()=>{
    const scrollTop=window.scrollY;
    const docHeight=document.documentElement.scrollHeight-window.innerHeight;
    const progress=docHeight>0?(scrollTop/docHeight*100):0;
    $('scrollProgress').style.width=progress+'%';
    $('scrollTop').classList.toggle('visible',scrollTop>300);
    document.querySelectorAll('.parallax-layer').forEach(el=>{
      const speed=parseFloat(el.dataset.speed);
      el.style.transform=`translateX(-50%) translateY(${-scrollTop*speed}px)`;
    });
  });
}

render();
</script>
</body>
</html>
