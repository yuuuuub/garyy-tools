<div class="container"><h1>🔴 印章篆刻</h1><p class="sub">篆刻流派 · 印章类型 · 名家名作 · 篆刻技法</p>

<script>
var data=[
{title:'印章起源',era:'商代',cat:'历史',tags:['玺印','封泥','权力'],desc:'印章起源于商代，最初用于封泥封缄文书，象征权力和信用。',detail:'印章最早见于商代，殷墟出土的三枚铜玺是已知最早的印章。先秦时期印章称"玺"，是权力的象征。秦始皇统一六国后，规定天子印称"玺"，臣民印称"印"。印章最初的功能是封泥——在竹简封口处按压泥块并加盖印章，以防私拆。',ref:'《汉书·百官公卿表》'},
{title:'秦汉印',era:'秦汉',cat:'历史',tags:['玺印制度','缪篆','白文'],desc:'秦汉是印章艺术的第一个高峰期，确立了印章的基本规范。',detail:'秦统一后建立了严格的玺印制度，规定了印的材质、大小和纽制。汉印以白文为主，字体用"缪篆"（摹印篆），风格浑厚朴茂。汉印是后世篆刻的典范，明清篆刻家无不以汉印为宗。汉代将军印因匆忙凿刻，又称"急就章"，别具天趣。',ref:'《汉书·百官公卿表》'},
{title:'隋唐印',era:'隋唐',cat:'历史',tags:['朱文','九叠篆','官印'],desc:'隋唐时期印章由白文转为朱文，官印开始使用九叠篆。',detail:'隋唐以后，印章从封泥转变为蘸印泥钤盖，因此由白文（阴刻）转为朱文（阳刻）。官印尺寸增大，字体采用"九叠篆"——笔画层层折叠以填满印面。唐代还出现了"鉴藏印"，用于书画收藏和鉴赏。',ref:'《唐六典》'},
{title:'宋元印',era:'宋元',cat:'历史',tags:['文人印','收藏印','花押'],desc:'宋元时期文人开始参与篆刻，出现了文人自用印和收藏印。',detail:'宋代文人开始在书画上钤盖个人印章，如苏轼、米芾等都有自用印。宋代还流行"花押印"——以个人独特的符号代替文字。元代赵孟頫提倡以小篆入印，为明清文人篆刻的兴起奠定了基础。元代还出现了以花乳石刻印的风气。',ref:'《宣和印谱》'},
{title:'明清流派',era:'明清',cat:'历史',tags:['文人篆刻','流派纷呈','印学复兴'],desc:'明清是篆刻艺术的第二个高峰期，形成了众多篆刻流派。',detail:'明代文彭发现灯光冻石可用于篆刻，从此文人纷纷自篆自刻，开创了文人篆刻的新时代。此后流派纷呈：浙派（丁敬）、皖派（邓石如）、赵派（赵之谦）、吴派（吴昌硕）、齐派（齐白石）等各领风骚。',ref:'《印人传》'},
{title:'姓名印',era:'先秦至今',cat:'类型',tags:['姓名','私印','身份'],desc:'刻有姓名的印章，是最常见的印章类型。',detail:'姓名印是刻有个人姓名的印章，分为朱文（阳刻）和白文（阴刻）两种。汉代姓名印多为白文，明清以后多为朱文。现代人常用的个人名章多为姓名印，用于书画落款、文件签署等。',ref:'《印章集说》'},
{title:'闲章',era:'宋代至今',cat:'类型',tags:['格言','斋号','情趣'],desc:'刻有诗句、格言、斋号等内容的印章，体现主人的志趣。',detail:'闲章是相对于姓名印而言的，内容包括诗词名句、格言警语、斋号室名、吉祥语等。如郑板桥的"难得糊涂"、齐白石的"中国长沙湘潭人也"等都是著名的闲章。闲章是文人个性和情趣的体现。',ref:'《篆刻学》'},
{title:'收藏印',era:'唐代至今',cat:'类型',tags:['鉴藏','书画','流传'],desc:'用于书画鉴赏和收藏的印章，是书画流传的重要见证。',detail:'收藏印又称鉴藏印，是收藏家在书画作品上钤盖的印章。著名的收藏印有唐太宗的"贞观"连珠印、宋徽宗的"宣和七玺"、乾隆的"三希堂精鉴玺"等。通过收藏印可以追溯书画的流传经过。',ref:'《历代名画记》'},
{title:'肖形印',era:'汉代至今',cat:'类型',tags:['图像','图案','生肖'],desc:'不刻文字而刻图案的印章，以图像表达寓意。',detail:'肖形印又称"图像印"，起源于汉代。印面刻有人物、动物、车马、神话故事等图案，具有装饰性和象征意义。汉代肖形印题材丰富，如四神（青龙白虎朱雀玄武）、十二生肖等。现代肖形印常用于书画装饰。',ref:'《缪篆分韵》'},
{title:'冲刀法',era:'明代至今',cat:'技法',tags:['冲刀','爽利','浙派'],desc:'执刀向前推进，刀法爽利明快，是浙派的主要刀法。',detail:'冲刀法是篆刻的基本刀法之一。执刀以拇指、食指、中指握刀，无名指抵住刀杆，刀刃以30度角向前推进。冲刀法刻出的线条爽利明快、挺拔有力。浙派篆刻家多以冲刀为主，如丁敬、蒋仁等。',ref:'《篆刻技法》'},
{title:'切刀法',era:'明代至今',cat:'技法',tags:['切刀','苍茫','皖派'],desc:'刀刃上下切刻，产生苍茫古朴的效果，是皖派的主要刀法。',detail:'切刀法是与冲刀法相对的刀法。刀刃以较小的角度切入石面，短距离地上下切刻，产生毛涩苍茫的效果。切刀法刻出的线条浑厚朴茂、富有金石气。皖派篆刻家如邓石如、吴让之等多以切刀为主。',ref:'《篆刻技法》'},
{title:'浙派',era:'清代',cat:'流派',tags:['西泠八家','丁敬','切刀'],desc:'以丁敬为首的篆刻流派，强调"印从书出"，风格刚健。',detail:'浙派又称"西泠派"，创始人丁敬（1695-1765）为首"西泠八家"之首。浙派篆刻以汉印为宗，用刀以切刀为主，风格刚健苍劲、古朴典雅。西泠八家：丁敬、蒋仁、黄易、奚冈、陈豫钟、陈鸿寿、赵之琛、钱松。',ref:'《西泠八家印选》'},
{title:'皖派',era:'清代',cat:'流派',tags:['邓石如','皖派','刚柔相济'],desc:'以邓石如为代表的篆刻流派，风格刚柔相济、浑厚苍劲。',detail:'皖派又称"徽派"，以邓石如（1743-1805）为开创者。邓石如以书法入印，提出"印从书出"的理论，将书法的笔意融入篆刻。其后吴让之、赵之谦继承发展，皖派篆刻风格浑厚苍劲、刚柔相济，与浙派并称清代两大篆刻流派。',ref:'《篆刻学》'},
{title:'邓石如',era:'清代',cat:'名家',tags:['皖派','印从书出','篆隶'],desc:'清代篆刻大师，皖派开创者，提出"印从书出"理论。',detail:'邓石如（1743-1805），初名琰，字石如，安徽怀宁人。他是清代最伟大的书法家和篆刻家之一。其篆书取法秦汉，隶书融合汉碑，篆刻将书法笔意融入刀法，开创了皖派新风。"印从书出"成为后世篆刻的重要理论。',ref:'《清史稿·邓石如传》'},
{title:'吴昌硕',era:'清末民国',cat:'名家',tags:['西泠印社','石鼓文','大写意'],desc:'清末民国艺术大师，西泠印社首任社长，诗书画印全能。',detail:'吴昌硕（1844-1927），原名俊，浙江安吉人。他是近代最杰出的艺术大师之一，诗书画印无一不精。其篆刻以石鼓文为宗，风格雄浑古朴。1913年被推为西泠印社首任社长。他将篆刻的金石气融入大写意花鸟画，开创了"金石画风"。',ref:'《吴昌硕传》'},
{title:'齐白石',era:'近现代',cat:'名家',tags:['齐派','单刀','大写意'],desc:'近现代篆刻大师，以单刀直冲的独特刀法著称。',detail:'齐白石（1864-1957）不仅是国画大师，也是篆刻名家。其篆刻以"单刀直冲"的独特刀法著称——不打草稿，直接以刀刻石，线条刚猛有力、气势逼人。他的篆刻风格与大写意花鸟画一脉相承，追求"胆敢独造"的艺术境界。',ref:'《齐白石自述》'},
{title:'赵之谦',era:'清代',cat:'名家',tags:['赵派','印外求印','北魏书'],desc:'清代篆刻书画大家，开创"印外求印"的新思路。',detail:'赵之谦（1829-1884），字撝叔，浙江绍兴人。他是清代杰出的书画篆刻家。其篆刻突破了秦汉印的局限，"印外求印"——将钱币、镜铭、碑额等文字入印，极大地丰富了篆刻的文字来源和表现形式。对吴昌硕、齐白石等后世篆刻家影响深远。',ref:'《悲庵剩墨》'},
{title:'《十钟山房印举》',era:'清代',cat:'名作',tags:['陈介祺','古玺印','集大成'],desc:'清代陈介祺编纂的古玺印集大成之作，收录印谱最为丰富。',detail:'《十钟山房印举》是清代金石学家陈介祺（1813-1884）编纂的大型印谱，收录古玺印约一万方，是历代印谱中收录最多的一部。此书对古玺印的分类、考证极为精详，是研究古代印章艺术的重要资料。',ref:'《十钟山房印举》'},
{title:'《飞鸿堂印谱》',era:'清代',cat:'名作',tags:['汪启淑','流派印','汇集'],desc:'清代汪启淑编纂的流派篆刻集大成之作。',detail:'《飞鸿堂印谱》是清代汪启淑编纂的大型印谱，汇集了清代前期各派篆刻家的作品，共收录数千方印。此书是研究清代流派篆刻的重要资料，展示了浙派、皖派等各派的风格特点。',ref:'《飞鸿堂印谱》'}
];
var currentCat='all';
function renderList(items){
  var el=document.getElementById('list');
  var s=document.getElementById('stats');
  s.textContent='共 '+items.length+' 条知识';
  el.innerHTML=items.map(function(d,i){
    return '<div class="item" onclick="this.classList.toggle(\'open\')">'+
    '<div class="item-title">'+d.title+'</div>'+
    '<div class="item-era">年代：'+d.era+'</div>'+
    '<div class="item-desc">'+d.desc+'</div>'+
    '<div class="item-detail"><h4>详细介绍</h4><p>'+d.detail+'</p>'+
    '<p style="margin-top:8px;color:var(--accent2)">参考：'+d.ref+'</p>'+
    '<div>'+d.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div></div>';
  }).join('');
}
function filterList(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=data.filter(function(d){
    var matchQ=d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q)||d.era.toLowerCase().includes(q);
    var matchC=currentCat==='all'||d.cat===currentCat;
    return matchQ&&matchC;
  });
  renderList(filtered);
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterList();
}
renderList(data);
</script></body></html>
