<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无尽扫雷</title>
<meta name="description" content="无尽扫雷游戏，无限生成的扫雷挑战">
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --accent:#3b82f6; }[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px; }
h1 { color:var(--accent); margin-bottom:8px; font-size:1.5rem; }
.hud { display:flex; gap:12px; margin:10px 0; flex-wrap:wrap; justify-content:center; }
.hud span { background:var(--card); border:1px solid var(--border); padding:6px 14px; border-radius:8px; }
.board-wrap { max-width:90vw; max-height:70vh; overflow:auto; margin:10px 0; border:2px solid var(--accent); border-radius:4px; }
.board { display:grid; gap:1px; }
.cell { width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:2px; font-weight:bold; font-size:11px; cursor:pointer; user-select:none; }
.cell.hidden { background:var(--card); border:1px solid var(--border); }
.cell.revealed { background:#21262d; border:1px solid #30363d; }
.cell.mine { background:#ef4444; }
.cell.flagged { background:var(--card); border:2px solid #eab308; }
.controls { display:flex; gap:10px; margin-top:10px; }
button { background:var(--accent); color:var(--text); border:none; padding:8px 20px; border-radius:6px; cursor:pointer; font-size:1rem; }
button:hover { opacity:0.85; }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="无尽扫雷">
  <meta property="og:description" content="无尽扫雷游戏，无限生成的扫雷挑战">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/minesweeper-endless/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>♾️ 无尽扫雷</h1>
<div class="hud">
<span id="level">关卡: 1</span>
<span id="size">大小: 6x6</span>
<span id="mineCount">💣 5</span>
<span id="flagCount">🚩 0</span>
<span id="timer">⏱ 0s</span>
</div>
<div class="board-wrap"><div class="board" id="board"></div></div>
<div class="controls">
<button onclick="startGame()">重新开始</button>
</div>
<script>
let ROWS,COLS,MINES,level;
let board,revealed,flagged,gameOver,gameWon,startTimer,timerInterval;

function startGame(){
  level=1;initLevel();
}

function initLevel(){
  ROWS=Math.min(5+level,20);COLS=Math.min(5+level,20);
  MINES=Math.floor(ROWS*COLS*0.15);

  board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  revealed=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  flagged=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  gameOver=false;gameWon=false;

  let placed=0;
  while(placed<MINES){
    const r=Math.floor(Math.random()*ROWS),c=Math.floor(Math.random()*COLS);
    if(board[r][c]!==-1){board[r][c]=-1;placed++;}
  }

  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(board[r][c]===-1)continue;
    let count=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===-1)count++;
    }
    board[r][c]=count;
  }
  render();
}

function render(){
  const el=document.getElementById('board');
  el.style.gridTemplateColumns='repeat('+COLS+',28px)';
  el.innerHTML='';
  document.getElementById('level').textContent='关卡: '+level;
  document.getElementById('size').textContent='大小: '+ROWS+'x'+COLS;
  document.getElementById('mineCount').textContent='💣 '+MINES;
  document.getElementById('flagCount').textContent='🚩 '+flagged.flat().filter(Boolean).length;
  const NC=['','#3b82f6','#22c55e','#ef4444','#7c3aed','#f97316','#06b6d4','#000','#666'];

  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=document.createElement('div');
    cell.className='cell';
    if(revealed[r][c]){
      cell.classList.add('revealed');
      if(board[r][c]===-1){cell.classList.add('mine');cell.textContent='💣';}
      else if(board[r][c]>0){cell.textContent=board[r][c];cell.style.color=NC[board[r][c]];}
    }else if(flagged[r][c]){
      cell.classList.add('hidden','flagged');cell.textContent='🚩';
    }else{
      cell.classList.add('hidden');
    }
    cell.addEventListener('click',()=>reveal(r,c));
    cell.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(r,c);});
    el.appendChild(cell);
  }
}

function reveal(r,c){
  if(gameOver||gameWon||flagged[r][c]||revealed[r][c])return;
  if(!startTimer){startTimer=Date.now();timerInterval=setInterval(()=>{document.getElementById('timer').textContent='⏱ '+Math.floor((Date.now()-startTimer)/1000)+'s';},1000);}
  revealed[r][c]=true;
  if(board[r][c]===-1){
    gameOver=true;clearInterval(timerInterval);
    for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++)if(board[i][j]===-1)revealed[i][j]=true;
    render();setTimeout(()=>garyyToast('踩雷了！到达关卡 '+level),100);return;
  }
  if(board[r][c]===0){
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS)reveal(nr,nc);
    }
  }
  checkWin();render();
}

function toggleFlag(r,c){
  if(gameOver||gameWon||revealed[r][c])return;
  flagged[r][c]=!flagged[r][c];render();
}

function checkWin(){
  let unrevealed=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(!revealed[r][c])unrevealed++;
  if(unrevealed===MINES){
    gameWon=true;clearInterval(timerInterval);
    setTimeout(()=>{
      level++;
      initLevel();
    },300);
  }
}

startGame();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
