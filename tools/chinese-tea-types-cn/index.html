<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国茶叶分类 - Chinese Tea Classification</title>
<meta name="description" content="中国茶叶分类百科，六大茶类详细子品种，制作工艺，风味特征">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国茶叶分类 - Chinese Tea Classification">
<meta property="og:description" content="中国茶叶分类百科，六大茶类详细子品种，制作工艺，风味特征">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-tea-types-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#7a9e6a;--accent2:#5a8a4a}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#238636;--accent2:#1a7f37}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#0a1510 0%,#142818 50%,#1a3a20 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #2a5a30;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#7a9e6a,#5a8a4a,#4a7a3a,#3a6a2a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.tea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.tea-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.tea-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.tea-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.tea-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tea-card .t-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(122,158,106,0.15);color:var(--accent)}
.tea-card .t-name{font-size:1.3em;font-weight:bold}
.tea-card .t-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.tea-card .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tea-card .t-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.tea-card .t-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.tea-card .t-detail strong{color:var(--text)}
.tea-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.tea-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🍃 中国茶叶分类</h1>
<p>Chinese Tea Classification — 六大茶类，各有千秋</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索茶叶...（如"龙井""铁观音""普洱"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="绿茶">🍃 绿茶</button>
<button class="filter-btn" data-filter="红茶">🫖 红茶</button>
<button class="filter-btn" data-filter="乌龙茶">🍵 乌龙茶</button>
<button class="filter-btn" data-filter="白茶">🤍 白茶</button>
<button class="filter-btn" data-filter="黑茶">⬛ 黑茶</button>
<button class="filter-btn" data-filter="黄茶">💛 黄茶</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="tea-grid" id="teaGrid"></div>
<footer><p>🍃 中国茶叶分类 — 六大茶类，各有千秋</p></footer>
</div>
<script>
const TEA_DATA=[
  {id:1,name:"西湖龙井",en:"West Lake Longjing",category:"绿茶",icon:"🍃",sub:"炒青绿茶",process:"杀青→揉捻→干燥",flavor:"鲜爽甘醇，豆香或兰花香",detail:"中国十大名茶之首，产于杭州西湖。以'色绿、香郁、味甘、形美'四绝著称。明前龙井最为珍贵，雨前龙井性价比高。",origin:"浙江杭州"},
  {id:2,name:"碧螺春",en:"Biluochun",category:"绿茶",icon:"🍃",sub:"炒青绿茶",process:"杀青→揉捻→搓团显毫→干燥",flavor:"鲜爽甘甜，花果香浓郁",detail:"产于江苏苏州太湖洞庭山，与果树间种，茶叶自带花果香。条索纤细卷曲如螺，满身披毫。以'一斤茶叶七万芽'著称。",origin:"江苏苏州"},
  {id:3,name:"黄山毛峰",en:"Huangshan Maofeng",category:"绿茶",icon:"🍃",sub:"烘青绿茶",process:"杀青→揉捻→烘焙",flavor:"清香高长，滋味鲜浓",detail:"产于安徽黄山，以一芽一叶初展为标准。外形似雀舌，白毫显露，色如象牙。入杯冲泡后雾气结顶，汤色清碧微黄。",origin:"安徽黄山"},
  {id:4,name:"安吉白茶",en:"Anji Baicha",category:"绿茶",icon:"🍃",sub:"烘青绿茶",process:"杀青→摊凉→烘干",flavor:"鲜爽回甘，氨基酸含量高",detail:"虽名为白茶实为绿茶，产于浙江安吉。因茶树品种特殊（白叶一号），春季新芽呈白色。氨基酸含量是普通绿茶的2-3倍，鲜爽度极高。",origin:"浙江安吉"},
  {id:5,name:"祁门红茶",en:"Keemun Black Tea",category:"红茶",icon:"🫖",sub:"工夫红茶",process:"萎凋→揉捻→发酵→干燥",flavor:"似花似蜜，祁门香",detail:"世界三大高香红茶之一，产于安徽祁门。'祁门香'似花似蜜似果，国际市场上被誉为'群芳最'。曾获巴拿马万国博览会金奖。",origin:"安徽祁门"},
  {id:6,name:"正山小种",en:"Lapsang Souchong",category:"红茶",icon:"🫖",sub:"小种红茶",process:"萎凋→揉捻→发酵→过红锅→干燥",flavor:"松烟香，桂圆味",detail:"世界上最早的红茶，产于福建武夷山桐木关。传统工艺用松针或松柴熏制，有独特的松烟香。金骏眉是正山小种的高端品种。",origin:"福建武夷山"},
  {id:7,name:"滇红",en:"Dian Hong",category:"红茶",icon:"🫖",sub:"工夫红茶",process:"萎凋→揉捻→发酵→干燥",flavor:"浓醇鲜爽，薯香或蜜香",detail:"产于云南凤庆、临沧等地，以大叶种茶为原料。金芽满披，汤色红艳明亮，滋味浓醇。是世界茶叶市场的重要品种。",origin:"云南凤庆"},
  {id:8,name:"铁观音",en:"Tieguanyin",category:"乌龙茶",icon:"🍵",sub:"闽南乌龙",process:"晒青→做青（摇青）→炒青→揉捻→烘焙",flavor:"兰花香，观音韵",detail:"中国十大名茶之一，产于福建安溪。以'观音韵'和兰花香著称。分清香型（轻发酵）、浓香型（重焙火）、陈香型（老茶）。",origin:"福建安溪"},
  {id:9,name:"大红袍",en:"Da Hong Pao",category:"乌龙茶",icon:"🍵",sub:"闽北乌龙（武夷岩茶）",process:"晒青→做青→炒青→揉捻→焙火",flavor:"岩骨花香，岩韵明显",detail:"产于福建武夷山，是武夷岩茶之王。母树大红袍仅六棵，已停采保护。岩韵是其核心特征，即'岩骨花香'的独特风味。",origin:"福建武夷山"},
  {id:10,name:"凤凰单丛",en:"Phoenix Dancong",category:"乌龙茶",icon:"🍵",sub:"广东乌龙",process:"晒青→做青→炒青→揉捻→干燥",flavor:"花香馥郁，品种香突出",detail:"产于广东潮州凤凰山，以香型分类：蜜兰香、芝兰香、桂花香、杏仁香等十余种香型。每棵茶树都有独特的'个性'。",origin:"广东潮州"},
  {id:11,name:"白毫银针",en:"Silver Needle",category:"白茶",icon:"🤍",sub:"芽茶",process:"萎凋→干燥（不炒不揉）",flavor:"毫香清鲜，滋味清淡回甘",detail:"白茶中的极品，只采单芽制作。满披白毫，挺直似针。产于福建福鼎和政和。白茶工艺最简，保留了最多的天然营养成分。",origin:"福建福鼎/政和"},
  {id:12,name:"白牡丹",en:"White Peony",category:"白茶",icon:"🤍",sub:"叶茶",process:"萎凋→干燥",flavor:"毫香显，滋味鲜醇",detail:"白茶中的常见品种，以一芽二叶为原料。芽叶连枝，形似花朵。口感比银针更醇厚，性价比高。适合日常品饮和存放转化。",origin:"福建福鼎"},
  {id:13,name:"普洱熟茶",en:"Pu'er Ripe Tea",category:"黑茶",icon:"⬛",sub:"后发酵茶",process:"杀青→揉捻→渥堆发酵→干燥",flavor:"醇厚顺滑，陈香或樟香",detail:"产于云南，经渥堆发酵工艺加速后发酵。汤色红浓明亮，口感醇厚顺滑。有降脂减肥、暖胃养胃的功效。',越陈越香'。",origin:"云南普洱"},
  {id:14,name:"安化黑茶",en:"Anhua Hei Cha",category:"黑茶",icon:"⬛",sub:"后发酵茶",process:"杀青→揉捻→渥堆→干燥",flavor:"松烟香，滋味醇和",detail:"产于湖南安化，以'三尖三砖一花卷'著称。千两茶（花卷茶）是安化黑茶的代表，制作工艺被列入国家级非遗。",origin:"湖南安化"},
  {id:15,name:"六堡茶",en:"Liubao Tea",category:"黑茶",icon:"⬛",sub:"后发酵茶",process:"杀青→揉捻→渥堆→干燥→陈化",flavor:"槟榔香，红浓陈醇",detail:"产于广西梧州，有1500多年历史。以'红、浓、陈、醇'四绝著称。六堡茶有独特的槟榔香，是广西最具代表性的黑茶。",origin:"广西梧州"},
  {id:16,name:"君山银针",en:"Junshan Silver Needle",category:"黄茶",icon:"💛",sub:"芽茶",process:"杀青→闷黄→干燥",flavor:"甘甜醇和，毫香清鲜",detail:"黄茶中的极品，产于湖南岳阳洞庭湖君山岛。冲泡时芽身在杯中三起三落，极为壮观，被誉为'茶中奇观'。清代贡茶。",origin:"湖南岳阳"},
  {id:17,name:"蒙顶黄芽",en:"Mengding Huangya",category:"黄茶",icon:"💛",sub:"芽茶",process:"杀青→初包闷黄→复包闷黄→干燥",flavor:"甜香浓郁，味甘而醇",detail:"产于四川名山蒙顶山，是中国最古老的黄茶之一。'扬子江中水，蒙顶山上茶'。黄茶工艺比绿茶多了'闷黄'步骤，形成黄汤黄叶的特点。",origin:"四川名山"},
  {id:18,name:"信阳毛尖",en:"Xinyang Maojian",category:"绿茶",icon:"🍃",sub:"炒青绿茶",process:"生锅→熟锅→烘焙",flavor:"栗香高爽，滋味醇厚",detail:"产于河南信阳，是中国十大名茶之一。以'细圆紧直多白毫'著称。汤色嫩绿明亮，入口有熟板栗的香气。",origin:"河南信阳"},
  {id:19,name:"武夷岩茶",en:"Wuyi Rock Tea",category:"乌龙茶",icon:"🍵",sub:"闽北乌龙",process:"晒青→做青→炒青→揉捻→焙火",flavor:"岩韵独特，品种多样",detail:"产于福建武夷山的岩缝之中。除大红袍外，还有水仙、肉桂、铁罗汉等名丛。'岩岩有茶，非岩不茶'是其核心理念。",origin:"福建武夷山"},
  {id:20,name:"太平猴魁",en:"Taiping Houkui",category:"绿茶",icon:"🍃",sub:"烘青绿茶",process:"杀青→做形→烘干",flavor:"兰花香高长，滋味鲜爽",detail:"产于安徽太平（今黄山市），是中国外形最大的绿茶。两叶抱芽，扁平挺直，长约10厘米。入杯冲泡后芽叶成朵，如兰花初放。",origin:"安徽黄山"},
  {id:21,name:"老白茶",en:"Aged White Tea",category:"白茶",icon:"🤍",sub:"陈年白茶",process:"自然陈化（3年以上）",flavor:"药香枣香，醇厚温润",detail:"白茶'一年茶、三年药、七年宝'。老白茶经过自然陈化，口感从清淡转为醇厚，出现药香和枣香。老白茶煮饮最佳，适合秋冬季节。",origin:"福建福鼎"}
];
function renderCards(data){
  document.getElementById('teaGrid').innerHTML=data.map(t=>`
    <div class="tea-card" data-category="${t.category}">
      <div class="t-header"><div class="t-icon">${t.icon}</div><div><div class="t-name">${t.name}</div><div class="t-sub">${t.en} · ${t.sub}</div></div></div>
      <div class="t-meta"><span>${t.category}</span><span>${t.origin}</span></div>
      <div class="t-detail"><strong>工艺：</strong>${t.process}</div>
      <div class="t-detail"><strong>风味：</strong>${t.flavor}</div>
      <div class="t-detail">${t.detail}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(t=>{cats[t.category]=(cats[t.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">茶叶品种</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(TEA_DATA);renderStats(TEA_DATA);
</script>
</body>
</html>
