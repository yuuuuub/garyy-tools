<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸运签</title><meta name="description" content="幸运签 - 在线抽取幸运签"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.fortune-display{text-align:center;padding:40px 20px;background:linear-gradient(135deg,var(--card),var(--bg));border-radius:16px;margin:20px 0;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center}.fortune-number{font-size:4rem;font-weight:700;color:var(--blue);margin-bottom:16px}.fortune-type{font-size:1.5rem;font-weight:600;margin-bottom:12px}.fortune-text{font-size:1.1rem;line-height:1.8;max-width:500px;margin-bottom:20px}.fortune-poem{font-size:1rem;color:var(--text2);font-style:italic;margin-bottom:20px}.fortune-advice{font-size:.9rem;color:var(--green);padding:12px;background:rgba(35,134,54,.1);border-radius:8px;max-width:500px}.btn{display:inline-block;padding:12px 32px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:1rem;margin-top:12px}.btn:hover{opacity:.85}.btn-group{display:flex;gap:8px;justify-content:center;margin-top:16px}.history{margin-top:20px}.history-title{font-size:1rem;font-weight:600;margin-bottom:12px;color:var(--blue)}.history-item{padding:12px;background:var(--bg);border-radius:8px;margin-bottom:8px;font-size:.9rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="幸运签"><meta property="og:description" content="幸运签 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎫 幸运签</h1><p class="sub">在线抽取幸运签</p>
<div class="card">
<div class="fortune-display" id="fortuneDisplay">
<div class="fortune-number">???</div>
<div class="fortune-type">点击按钮抽取幸运签</div>
</div>
<div class="btn-group">
<button class="btn" onclick="drawFortune()">抽取幸运签</button>
<button class="btn" onclick="clearHistory()">清空历史</button>
</div>
</div>
<div class="card" id="historyCard" style="display:none">
<div class="history-title">📜 抽签历史</div>
<div class="history" id="fortuneHistory"></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var fortunes=[
  {number:1,type:'大吉',text:'万事如意，心想事成。',poem:'春风得意马蹄疾，一日看尽长安花。',advice:'把握机会，勇往直前，会有意想不到的收获。'},
  {number:2,type:'大吉',text:'鸿运当头，财源广进。',poem:'千淘万漉虽辛苦，吹尽狂沙始到金。',advice:'坚持努力，好运即将到来。'},
  {number:3,type:'中吉',text:'稳步前进，渐入佳境。',poem:'山重水复疑无路，柳暗花明又一村。',advice:'保持耐心，事情会慢慢好转。'},
  {number:4,type:'中吉',text:'贵人相助，事半功倍。',poem:'莫愁前路无知己，天下谁人不识君。',advice:'多与人交流，会有意想不到的帮助。'},
  {number:5,type:'小吉',text:'平稳发展，无大波折。',poem:'采菊东篱下，悠然见南山。',advice:'保持平常心，稳扎稳打。'},
  {number:6,type:'小吉',text:'小有收获，继续努力。',poem:'不积跬步，无以至千里。',advice:'脚踏实地，一步一个脚印。'},
  {number:7,type:'末吉',text:'需谨慎行事，避免冲动。',poem:'三思而后行，再思可矣。',advice:'多思考，少行动，避免不必要的麻烦。'},
  {number:8,type:'末吉',text:'暂时困难，终会过去。',poem:'冬天来了，春天还会远吗？',advice:'保持乐观，困难只是暂时的。'},
  {number:9,type:'凶',text:'诸事不顺，宜静不宜动。',poem:'退一步海阔天空，忍一时风平浪静。',advice:'保持低调，避免冲突。'},
  {number:10,type:'凶',text:'小心谨慎，避免口舌是非。',poem:'是非只为多开口，烦恼皆因强出头。',advice:'少说话，多做事，避免不必要的麻烦。'},
  {number:11,type:'大吉',text:'否极泰来，好运将至。',poem:'沉舟侧畔千帆过，病树前头万木春。',advice:'坚持就是胜利，好运即将到来。'},
  {number:12,type:'大吉',text:'心想事成，万事亨通。',poem:'会当凌绝顶，一览众山小。',advice:'把握机会，大胆前进。'},
  {number:13,type:'中吉',text:'稳中有进，渐入佳境。',poem:'欲穷千里目，更上一层楼。',advice:'不断进步，会有好的结果。'},
  {number:14,type:'中吉',text:'人缘旺盛，贵人相助。',poem:'海内存知己，天涯若比邻。',advice:'多结交朋友，会有意想不到的帮助。'},
  {number:15,type:'小吉',text:'平稳发展，无大波折。',poem:'行到水穷处，坐看云起时。',advice:'顺其自然，一切都会好起来的。'},
  {number:16,type:'小吉',text:'小有成就，继续努力。',poem:'千里之行，始于足下。',advice:'保持努力，会有好的结果。'},
  {number:17,type:'末吉',text:'需耐心等待，时机未到。',poem:'宝剑锋从磨砺出，梅花香自苦寒来。',advice:'耐心等待，时机成熟自然会成功。'},
  {number:18,type:'末吉',text:'暂时挫折，终会克服。',poem:'天生我材必有用，千金散尽还复来。',advice:'保持信心，困难只是暂时的。'},
  {number:19,type:'凶',text:'宜守不宜攻，避免冒险。',poem:'识时务者为俊杰。',advice:'保持低调，避免不必要的风险。'},
  {number:20,type:'凶',text:'谨言慎行，避免纠纷。',poem:'忍一时风平浪静，退一步海阔天空。',advice:'多忍让，少争执，避免不必要的麻烦。'}
];
var fortuneHistory=[];
function drawFortune(){
  var fortune=fortunes[Math.floor(Math.random()*fortunes.length)];
  var display=document.getElementById('fortuneDisplay');
  var typeColor=fortune.type==='大吉'?'var(--green)':fortune.type==='中吉'?'var(--blue)':fortune.type==='小吉'?'var(--text2)':fortune.type==='末吉'?'var(--yellow)':'var(--red)';
  display.innerHTML='<div class="fortune-number">'+fortune.number+'</div>'+
    '<div class="fortune-type" style="color:'+typeColor+'">'+fortune.type+'</div>'+
    '<div class="fortune-text">'+fortune.text+'</div>'+
    '<div class="fortune-poem">'+fortune.poem+'</div>'+
    '<div class="fortune-advice">'+fortune.advice+'</div>';
  fortuneHistory.unshift(fortune);
  if(fortuneHistory.length>10)fortuneHistory.pop();
  renderHistory();
}
function renderHistory(){
  if(fortuneHistory.length===0){
    document.getElementById('historyCard').style.display='none';
    return;
  }
  document.getElementById('historyCard').style.display='block';
  var history=document.getElementById('fortuneHistory');
  var html='';
  fortuneHistory.forEach(function(fortune){
    html+='<div class="history-item">';
    html+='<strong>#'+fortune.number+' '+fortune.type+'</strong>: '+fortune.text;
    html+='</div>';
  });
  history.innerHTML=html;
}
function clearHistory(){
  fortuneHistory=[];
  renderHistory();
  document.getElementById('fortuneDisplay').innerHTML='<div class="fortune-number">???</div><div class="fortune-type">点击按钮抽取幸运签</div>';
}
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
