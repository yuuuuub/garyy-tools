<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 漫画创作工具</title>
<meta property="og:title" content="🎨 漫画创作工具">
<meta property="og:description" content="🎨 漫画创作工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="Canvas漫画创作工具，支持多种画笔、面板布局、气泡对话框和文字标注">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root {
--bg: #0f172a;
--surface: #1e293b;
--surface-2: #334155;
--text: #f1f5f9;
--text-secondary: #94a3b8;
--accent: #8b5cf6;
--border: #475569;
--shadow: 0 4px 24px rgba(0,0,0,0.3);
--radius: 12px;
--transition: 0.25s ease;
}
[data-theme="light"] {
--bg: #f8fafc;
--surface: #ffffff;
--surface-2: #f1f5f9;
--text: #1e293b;
--text-secondary: #64748b;
--accent: #8b5cf6;
--border: #e2e8f0;
--shadow: 0 4px 24px rgba(0,0,0,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; display:flex; justify-content:center; min-height:100vh; padding:16px; transition:background var(--transition),color var(--transition); }
.container { max-width:800px; width:100%; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.header h1 { font-size:1.5rem; }
.btn { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 16px; cursor:pointer; font-size:0.9rem; transition:opacity var(--transition); }
.btn:hover { opacity:0.85; }
.btn-secondary { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
.btn-small { padding:4px 10px; font-size:0.8rem; }
.btn-danger { background:#ef4444; }
.toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
.tool-group { display:flex; gap:4px; align-items:center; padding:4px 8px; background:var(--surface-2); border-radius:8px; }
.tool-group label { font-size:0.75rem; color:var(--text-secondary); white-space:nowrap; }
.tool-btn { background:var(--bg); border:2px solid var(--border); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:0.85rem; transition:border-color var(--transition); }
.tool-btn.active { border-color:var(--accent); background:var(--accent); color:#fff; }
.tool-btn:hover { border-color:var(--accent); }
input[type="color"] { width:32px; height:32px; border:none; border-radius:6px; cursor:pointer; background:var(--bg); }
input[type="range"] { width:80px; accent-color:var(--accent); }
.canvas-area { position:relative; background:#fff; border:2px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:12px; cursor:crosshair; }
.canvas-area canvas { display:block; width:100%; }
.bubble { position:absolute; background:#fff; border:2px solid #000; border-radius:50%; padding:8px 12px; cursor:move; font-size:0.8rem; text-align:center; user-select:none; min-width:40px; min-height:20px; }
.bubble.rect { border-radius:8px; }
.bubble.thought { border-radius:50%; border:2px dashed #000; }
.bubble::after { content:''; position:absolute; bottom:-16px; left:50%; transform:translateX(-50%); border:8px solid transparent; border-top-color:#000; }
.bubble.rect::after { content:''; position:absolute; bottom:-16px; left:20px; border:8px solid transparent; border-top-color:#000; }
.bubble.thought::after { content:''; position:absolute; bottom:-20px; left:50%; transform:translateX(-50%); width:12px; height:8px; background:#000; border-radius:50%; }
.bubble-inner { outline:none; min-width:30px; }
.caption { position:absolute; background:rgba(0,0,0,0.75); color:#fff; padding:4px 8px; border-radius:4px; cursor:move; font-size:0.8rem; user-select:none; }
.caption-inner { outline:none; }
.layout-select { padding:4px 8px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:0.8rem; }
@media print {
body { background:#fff; padding:0; }
.container { box-shadow:none; padding:8px; }
.no-print { display:none!important; }
}
</style>
</head>
<body>
<div class="container">
<div class="header no-print">
<h1>🎨 漫画创作工具</h1>
<button class="btn btn-secondary" onclick="toggleTheme()">🌙 主题</button>
</div>
<div class="toolbar no-print">
<div class="tool-group">
<label>工具:</label>
<button class="tool-btn active" data-tool="pencil" onclick="setTool('pencil',this)">✏️ 画笔</button>
<button class="tool-btn" data-tool="line" onclick="setTool('line',this)">📏 直线</button>
<button class="tool-btn" data-tool="rect" onclick="setTool('rect',this)">⬜ 矩形</button>
<button class="tool-btn" data-tool="circle" onclick="setTool('circle',this)">⭕ 圆形</button>
<button class="tool-btn" data-tool="eraser" onclick="setTool('eraser',this)">🧹 橡皮</button>
</div>
<div class="tool-group">
<label>颜色:</label>
<input type="color" id="colorPicker" value="#000000">
</div>
<div class="tool-group">
<label>笔触:</label>
<input type="range" id="brushSize" min="1" max="20" value="3">
</div>
<div class="tool-group">
<label>布局:</label>
<select class="layout-select" id="layoutSelect" onchange="applyLayout(this.value)">
<option value="1x1">1×1</option>
<option value="1x2">1×2</option>
<option value="2x1">2×1</option>
<option value="2x2" selected>2×2</option>
<option value="3x2">3×2</option>
</select>
</div>
</div>
<div class="toolbar no-print">
<div class="tool-group">
<button class="tool-btn" onclick="addBubble('oval')">💬 椭圆气泡</button>
<button class="tool-btn" onclick="addBubble('rect')">🗨️ 矩形气泡</button>
<button class="tool-btn" onclick="addBubble('thought')">💭 思想气泡</button>
<button class="tool-btn" onclick="addCaption()">📝 文字标注</button>
</div>
<button class="btn btn-secondary" onclick="undo()">↩️ 撤销</button>
<button class="btn btn-secondary" onclick="redo()">↪️ 重做</button>
<button class="btn btn-secondary btn-danger" onclick="clearCanvas()">🗑️ 清空</button>
<button class="btn" onclick="exportPNG()">📤 导出 PNG</button>
</div>
<div class="canvas-area" id="canvasArea">
<canvas id="canvas" width="760" height="500"></canvas>
</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const area = document.getElementById('canvasArea');
let tool = 'pencil';
let drawing = false;
let startX, startY;
let snapshots = [];
let redoStack = [];
let lastSnapshot = null;

function toggleTheme() {
const html = document.documentElement;
html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
}

function setTool(t, btn) {
tool = t;
document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
if (btn) btn.classList.add('active');
}

function saveSnapshot() {
snapshots.push(canvas.toDataURL());
redoStack = [];
if (snapshots.length > 50) snapshots.shift();
}

function undo() {
if (snapshots.length === 0) return;
redoStack.push(canvas.toDataURL());
const prev = snapshots.pop();
const img = new Image();
img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
img.src = prev;
}

function redo() {
if (redoStack.length === 0) return;
snapshots.push(canvas.toDataURL());
const next = redoStack.pop();
const img = new Image();
img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
img.src = next;
}

function getPos(e) {
const r = canvas.getBoundingClientRect();
const scaleX = canvas.width / r.width;
const scaleY = canvas.height / r.height;
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;
return { x: (clientX - r.left) * scaleX, y: (clientY - r.top) * scaleY };
}

function startDraw(e) {
drawing = true;
const p = getPos(e);
startX = p.x; startY = p.y;
lastSnapshot = canvas.toDataURL();
if (tool === 'pencil' || tool === 'eraser') {
ctx.beginPath();
ctx.moveTo(p.x, p.y);
}
e.preventDefault();
}

function draw(e) {
if (!drawing) return;
const p = getPos(e);
const color = document.getElementById('colorPicker').value;
const size = +document.getElementById('brushSize').value;
if (tool === 'pencil') {
ctx.strokeStyle = color;
ctx.lineWidth = size;
ctx.lineCap = 'round';
ctx.lineTo(p.x, p.y);
ctx.stroke();
} else if (tool === 'eraser') {
ctx.strokeStyle = '#ffffff';
ctx.lineWidth = size * 3;
ctx.lineCap = 'round';
ctx.lineTo(p.x, p.y);
ctx.stroke();
}
e.preventDefault();
}

function endDraw(e) {
if (!drawing) return;
drawing = false;
const p = getPos(e.changedTouches ? e.changedTouches[0] : e);
const color = document.getElementById('colorPicker').value;
const size = +document.getElementById('brushSize').value;
if (tool === 'line') {
ctx.beginPath();
ctx.strokeStyle = color;
ctx.lineWidth = size;
ctx.moveTo(startX, startY);
ctx.lineTo(p.x, p.y);
ctx.stroke();
} else if (tool === 'rect') {
ctx.strokeStyle = color;
ctx.lineWidth = size;
ctx.strokeRect(startX, startY, p.x - startX, p.y - startY);
} else if (tool === 'circle') {
const rx = Math.abs(p.x - startX) / 2;
const ry = Math.abs(p.y - startY) / 2;
const cx = startX + (p.x - startX) / 2;
const cy = startY + (p.y - startY) / 2;
ctx.beginPath();
ctx.strokeStyle = color;
ctx.lineWidth = size;
ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
ctx.stroke();
}
if (tool !== 'pencil' && tool !== 'eraser') {
snapshots.push(lastSnapshot);
redoStack = [];
}
if (tool === 'pencil' || tool === 'eraser') {
snapshots.push(lastSnapshot);
redoStack = [];
}
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove', draw, {passive:false});
canvas.addEventListener('touchend', endDraw);

function clearCanvas() {
if (!confirm('确定要清空画布吗？此操作不可撤销。')) return;
saveSnapshot();
ctx.clearRect(0, 0, canvas.width, canvas.height);
document.querySelectorAll('.bubble,.caption').forEach(el => el.remove());
}

function applyLayout(layout) {
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.strokeStyle = '#000';
ctx.lineWidth = 2;
const w = canvas.width, h = canvas.height;
switch(layout) {
case '1x1':
ctx.strokeRect(2, 2, w-4, h-4);
break;
case '1x2':
ctx.strokeRect(2, 2, w-4, h/2-4);
ctx.strokeRect(2, h/2+2, w-4, h/2-4);
break;
case '2x1':
ctx.strokeRect(2, 2, w/2-4, h-4);
ctx.strokeRect(w/2+2, 2, w/2-4, h-4);
break;
case '2x2':
ctx.strokeRect(2, 2, w/2-4, h/2-4);
ctx.strokeRect(w/2+2, 2, w/2-4, h/2-4);
ctx.strokeRect(2, h/2+2, w/2-4, h/2-4);
ctx.strokeRect(w/2+2, h/2+2, w/2-4, h/2-4);
break;
case '3x2':
for(let r=0;r<3;r++) for(let c=0;c<2;c++) {
ctx.strokeRect(2+c*(w/2), 2+r*(h/3), w/2-4, h/3-4);
}
break;
}
saveSnapshot();
}

function addBubble(style) {
const b = document.createElement('div');
b.className = 'bubble ' + (style === 'rect' ? 'rect' : style === 'thought' ? 'thought' : '');
b.style.left = '100px';
b.style.top = '80px';
const inner = document.createElement('div');
inner.className = 'bubble-inner';
inner.contentEditable = true;
inner.textContent = '对话内容';
b.appendChild(inner);
makeDraggable(b);
area.appendChild(b);
}

function addCaption() {
const c = document.createElement('div');
c.className = 'caption';
c.style.left = '100px';
c.style.top = '300px';
const inner = document.createElement('div');
inner.className = 'caption-inner';
inner.contentEditable = true;
inner.textContent = '旁白文字';
c.appendChild(inner);
makeDraggable(c);
area.appendChild(c);
}

function makeDraggable(el) {
let ox, oy;
const onMove = (e) => {
const cx = e.touches ? e.touches[0].clientX : e.clientX;
const cy = e.touches ? e.touches[0].clientY : e.clientY;
el.style.left = (cx - ox) + 'px';
el.style.top = (cy - oy) + 'px';
e.preventDefault();
};
const onUp = () => {
document.removeEventListener('mousemove', onMove);
document.removeEventListener('mouseup', onUp);
document.removeEventListener('touchmove', onMove);
document.removeEventListener('touchend', onUp);
};
el.addEventListener('mousedown', (e) => {
ox = e.clientX - el.offsetLeft;
oy = e.clientY - el.offsetTop;
document.addEventListener('mousemove', onMove);
document.addEventListener('mouseup', onUp);
});
el.addEventListener('touchstart', (e) => {
ox = e.touches[0].clientX - el.offsetLeft;
oy = e.touches[0].clientY - el.offsetTop;
document.addEventListener('touchmove', onMove, {passive:false});
document.addEventListener('touchend', onUp);
}, {passive:false});
}

function exportPNG() {
const tempCanvas = document.createElement('canvas');
tempCanvas.width = canvas.width;
tempCanvas.height = canvas.height;
const tCtx = tempCanvas.getContext('2d');
tCtx.fillStyle = '#fff';
tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
tCtx.drawImage(canvas, 0, 0);
const link = document.createElement('a');
link.download = '漫画作品.png';
link.href = tempCanvas.toDataURL('image/png');
link.click();
}

applyLayout('2x2');
</script>
</body>
</html>
