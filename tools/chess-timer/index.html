<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>棋类计时器 Chess Timer</title>
<meta name="description" content="棋类计时器，为象棋围棋等棋类比赛计时">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f0f14;
    --bg-card: #1a1a24;
    --text: #e0e0e0;
    --text-secondary: #888;
    --p1-bg: #0d1b2a;
    --p1-accent: #1b8a8a;
    --p1-glow: rgba(27, 138, 138, 0.3);
    --p1-active: #1a3a3a;
    --p2-bg: #1f0f14;
    --p2-accent: #c0392b;
    --p2-glow: rgba(192, 57, 43, 0.3);
    --p2-active: #2a1015;
    --warning: #f39c12;
    --danger: #e74c3c;
    --btn-bg: #2a2a38;
    --btn-hover: #3a3a4c;
    --preset-bg: #252535;
    --preset-active: #1b8a8a;
    --border: #2a2a3a;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 12px;
  }

  .container {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 8px 0;
  }

  .header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, var(--p1-accent), #aaa, var(--p2-accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header .subtitle {
    font-size: 0.78rem;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* Presets */
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .preset-btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--preset-bg);
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .preset-btn:hover { background: var(--btn-hover); }
  .preset-btn.active { background: var(--preset-active); border-color: var(--preset-active); color: #fff; font-weight: 600; }

  /* Custom time inputs */
  .custom-row {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .custom-row label {
    font-size: 0.82rem;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .custom-row input {
    width: 56px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card);
    color: var(--text);
    font-size: 0.9rem;
    text-align: center;
  }

  .custom-row select {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card);
    color: var(--text);
    font-size: 0.85rem;
  }

  .apply-custom {
    padding: 6px 16px;
    border: none;
    border-radius: 8px;
    background: var(--preset-active);
    color: #fff;
    font-size: 0.82rem;
    cursor: pointer;
    font-weight: 600;
  }

  .apply-custom:hover { opacity: 0.85; }

  /* Timers container */
  .timers {
    display: flex;
    gap: 8px;
    min-height: 280px;
  }

  @media (max-width: 480px) {
    .timers { flex-direction: column; min-height: 380px; }
  }

  .player-panel {
    flex: 1;
    border-radius: 20px;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
  }

  .player-panel.p1 {
    background: var(--p1-bg);
    border-color: var(--border);
  }

  .player-panel.p2 {
    background: var(--p2-bg);
    border-color: var(--border);
  }

  .player-panel.active {
    border-color: var(--p1-accent);
    box-shadow: 0 0 20px var(--p1-glow), inset 0 0 40px rgba(27,138,138,0.08);
  }

  .player-panel.p2.active {
    border-color: var(--p2-accent);
    box-shadow: 0 0 20px var(--p2-glow), inset 0 0 40px rgba(192,57,43,0.08);
  }

  .player-panel.warning .time-display { color: var(--warning); }
  .player-panel.danger .time-display { color: var(--danger); animation: pulse 0.6s infinite alternate; }

  @keyframes pulse {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0.85; transform: scale(1.03); }
  }

  .player-name {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .p1 .player-name { color: var(--p1-accent); }
  .p2 .player-name { color: var(--p2-accent); }

  .time-display {
    font-size: 3.6rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
    transition: color 0.3s;
    letter-spacing: 0.02em;
  }

  .time-display.negative { color: var(--danger) !important; animation: pulse 0.5s infinite alternate; }

  @media (max-width: 480px) {
    .time-display { font-size: 2.8rem; }
    .player-panel { padding: 18px 12px; gap: 8px; }
  }

  .increment-info {
    font-size: 0.78rem;
    color: var(--text-secondary);
  }

  .move-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    opacity: 0.7;
  }

  .p1 .move-badge { background: rgba(27,138,138,0.15); color: var(--p1-accent); }
  .p2 .move-badge { background: rgba(192,57,43,0.15); color: var(--p2-accent); }

  .player-panel.active .move-badge { opacity: 1; }

  /* tap hint */
  .tap-hint {
    position: absolute;
    bottom: 10px;
    font-size: 0.7rem;
    color: var(--text-secondary);
    opacity: 0.6;
    pointer-events: none;
  }

  .player-panel.active .tap-hint { opacity: 0; }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    padding: 12px 28px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--btn-bg);
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }

  .ctrl-btn:hover { background: var(--btn-hover); }
  .ctrl-btn:active { transform: scale(0.96); }

  .ctrl-btn.start { background: #1b6e3a; border-color: #1b6e3a; color: #fff; }
  .ctrl-btn.start:hover { background: #228847; }
  .ctrl-btn.reset { background: #6e1b1b; border-color: #6e1b1b; color: #fff; }
  .ctrl-btn.reset:hover { background: #882222; }

  /* Sound toggle */
  .sound-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--btn-bg);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }

  .sound-toggle:hover { background: var(--btn-hover); }
  .sound-toggle.muted { opacity: 0.45; }

  .settings-row {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  .inc-delay-toggle {
    display: flex;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .inc-delay-toggle span {
    padding: 7px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    background: var(--btn-bg);
    color: var(--text-secondary);
    transition: all 0.2s;
  }

  .inc-delay-toggle span.active {
    background: var(--preset-active);
    color: #fff;
    font-weight: 600;
  }

  /* Stats bar */
  .stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    font-size: 0.82rem;
    color: var(--text-secondary);
  }

  .stats strong { color: var(--text); }

  /* Footer */
  .footer {
    text-align: center;
    font-size: 0.7rem;
    color: #555;
    padding: 8px 0;
  }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div class="container">

  <div class="header">
    <h1>&#9823; 棋类计时器</h1>
    <div class="subtitle">双人 Chess Clock / Game Timer</div>
  </div>

  <!-- Presets -->
  <div class="presets" id="presets">
    <button class="preset-btn" data-time="300" data-inc="3" data-delay="0">快棋 5+3</button>
    <button class="preset-btn" data-time="180" data-inc="2" data-delay="0">闪电 3+2</button>
    <button class="preset-btn" data-time="60" data-inc="0" data-delay="0">超快 1+0</button>
    <button class="preset-btn" data-time="1800" data-inc="0" data-delay="0">经典 30+0</button>
    <button class="preset-btn" data-time="900" data-inc="10" data-delay="0">标准 15+10</button>
    <button class="preset-btn" id="custom-preset-btn">自定义</button>
  </div>

  <!-- Custom time row -->
  <div class="custom-row" id="customRow" style="display:none;">
    <label>初始时间 <input type="number" id="customTimeMin" value="5" min="0" max="120"> 分
      <input type="number" id="customTimeSec" value="0" min="0" max="59"> 秒</label>
    <label>加秒/延时 <input type="number" id="customInc" value="3" min="0" max="60"> 秒</label>
    <button class="apply-custom" id="applyCustom">应用</button>
  </div>

  <!-- Increment / Delay toggle -->
  <div class="settings-row">
    <div class="inc-delay-toggle" id="modeToggle">
      <span class="active" data-mode="inc">加秒制</span>
      <span data-mode="delay">延时制</span>
    </div>
  </div>

  <!-- Two player timers -->
  <div class="timers">
    <div class="player-panel p1 active" id="panel1">
      <div class="player-name">&#9679; 玩家一</div>
      <div class="time-display" id="time1">05:00</div>
      <div class="increment-info" id="incInfo1">+3s</div>
      <div class="move-badge" id="moves1">步数 0</div>
      <div class="tap-hint">点击切换</div>
    </div>

    <div class="player-panel p2" id="panel2">
      <div class="player-name">&#9679; 玩家二</div>
      <div class="time-display" id="time2">05:00</div>
      <div class="increment-info" id="incInfo2">+3s</div>
      <div class="move-badge" id="moves2">步数 0</div>
      <div class="tap-hint">点击切换</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn start" id="btnStart">开始计时</button>
    <button class="ctrl-btn" id="btnPause" disabled>暂停</button>
    <button class="ctrl-btn reset" id="btnReset">重置</button>
    <div class="sound-toggle" id="soundToggle" title="音效开关">
      <span id="soundIcon">&#128266;</span>
      <span id="soundLabel">音效开</span>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <span>总步数 <strong id="totalMoves">0</strong></span>
    <span>状态 <strong id="statusText">等待开始</strong></span>
  </div>

  <div class="footer">Made with &#9829; for the chess community</div>

</div>

<script>
(function() {
  // ===== State =====
  let player1 = { remaining: 300, increment: 3, delay: 0, moves: 0, isActive: true };
  let player2 = { remaining: 300, increment: 3, delay: 0, moves: 0, isActive: false };
  let running = false;
  let paused = false;
  let intervalId = null;
  let soundEnabled = true;
  let mode = 'inc'; // 'inc' or 'delay'
  let currentPreset = '快棋 5+3';
  let delayRunningFor = null; // which player is in delay phase, null = none
  let delayStartTime = 0;
  let delayRemaining = 0;

  // ===== Audio =====
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playBeep(freq, duration, type = 'square') {
    if (!soundEnabled) return;
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    } catch(e) { /* ignore audio errors */ }
  }

  function playSwitchSound() { playBeep(800, 0.08, 'sine'); }
  function playWarningSound() { playBeep(600, 0.12, 'square'); }
  function playDangerSound() { playBeep(400, 0.18, 'square'); }
  function playTimeoutSound() {
    playBeep(200, 0.5, 'sawtooth');
    setTimeout(() => playBeep(150, 0.5, 'sawtooth'), 300);
  }

  // ===== DOM refs =====
  const panel1 = document.getElementById('panel1');
  const panel2 = document.getElementById('panel2');
  const time1 = document.getElementById('time1');
  const time2 = document.getElementById('time2');
  const incInfo1 = document.getElementById('incInfo1');
  const incInfo2 = document.getElementById('incInfo2');
  const moves1 = document.getElementById('moves1');
  const moves2 = document.getElementById('moves2');
  const totalMoves = document.getElementById('totalMoves');
  const statusText = document.getElementById('statusText');
  const btnStart = document.getElementById('btnStart');
  const btnPause = document.getElementById('btnPause');
  const btnReset = document.getElementById('btnReset');
  const soundToggle = document.getElementById('soundToggle');
  const soundIcon = document.getElementById('soundIcon');
  const soundLabel = document.getElementById('soundLabel');
  const customRow = document.getElementById('customRow');
  const customPresetBtn = document.getElementById('custom-preset-btn');
  const modeToggle = document.getElementById('modeToggle');
  const presetBtns = document.querySelectorAll('.preset-btn:not(#custom-preset-btn)');

  // ===== Helpers =====
  function fmtTime(seconds) {
    const abs = Math.abs(seconds);
    const m = Math.floor(abs / 60);
    const s = Math.floor(abs % 60);
    const prefix = seconds < 0 ? '-' : '';
    return prefix + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function getIncLabel(player) {
    if (player.delay > 0 && mode === 'delay') {
      return '延时 ' + player.delay + 's';
    }
    if (player.increment > 0) {
      return '+' + player.increment + 's';
    }
    return '无加秒';
  }

  function updateDisplay() {
    time1.textContent = fmtTime(player1.remaining);
    time2.textContent = fmtTime(player2.remaining);
    incInfo1.textContent = getIncLabel(player1);
    incInfo2.textContent = getIncLabel(player2);
    moves1.textContent = '步数 ' + player1.moves;
    moves2.textContent = '步数 ' + player2.moves;
    totalMoves.textContent = player1.moves + player2.moves;

    // Active panel
    if (player1.isActive) {
      panel1.classList.add('active');
      panel2.classList.remove('active');
    } else {
      panel2.classList.add('active');
      panel1.classList.remove('active');
    }

    // Warning/danger classes
    [panel1, panel2].forEach(p => { p.classList.remove('warning', 'danger'); });
    [time1, time2].forEach(t => { t.classList.remove('negative'); });

    const activePanel = player1.isActive ? panel1 : panel2;
    const activeTime = player1.isActive ? player1.remaining : player2.remaining;

    if (activeTime < 0) {
      activePanel.classList.add('danger');
      (player1.isActive ? time1 : time2).classList.add('negative');
    } else if (activeTime <= 10) {
      activePanel.classList.add('danger');
    } else if (activeTime <= 30) {
      activePanel.classList.add('warning');
    }

    // Button states
    if (running && !paused) {
      btnStart.textContent = '进行中';
      btnStart.disabled = true;
      btnPause.disabled = false;
    } else if (running && paused) {
      btnStart.textContent = '继续';
      btnStart.disabled = false;
      btnPause.disabled = true;
    } else {
      btnStart.textContent = '开始计时';
      btnStart.disabled = false;
      btnPause.disabled = true;
    }

    // Status text
    if (!running) {
      statusText.textContent = '等待开始';
    } else if (paused) {
      statusText.textContent = '已暂停';
    } else if (player1.remaining < 0) {
      statusText.textContent = '玩家一 超时！';
    } else if (player2.remaining < 0) {
      statusText.textContent = '玩家二 超时！';
    } else {
      statusText.textContent = (player1.isActive ? '玩家一' : '玩家二') + ' 回合中';
    }
  }

  function applyPreset(totalSecs, inc, delay) {
    running = false;
    paused = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    delayRunningFor = null;
    delayStartTime = 0;
    delayRemaining = 0;

    player1.remaining = totalSecs;
    player1.increment = inc;
    player1.delay = delay;
    player1.moves = 0;
    player1.isActive = true;

    player2.remaining = totalSecs;
    player2.increment = inc;
    player2.delay = delay;
    player2.moves = 0;
    player2.isActive = false;

    updateDisplay();
    updatePresetButtons();
  }

  function updatePresetButtons() {
    const p1 = player1;
    presetBtns.forEach(btn => {
      const t = parseInt(btn.dataset.time);
      const i = parseInt(btn.dataset.inc);
      const d = parseInt(btn.dataset.delay);
      if (t === p1.remaining && i === p1.increment && d === p1.delay &&
          p1.remaining === player2.remaining && p1.increment === player2.increment && p1.delay === player2.delay) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
  }

  function togglePlayer() {
    if (!running || paused) return;

    const departing = player1.isActive ? player1 : player2;
    const arriving = player1.isActive ? player2 : player1;

    // Apply increment to departing player (only in increment mode)
    if (mode === 'inc' && departing.increment > 0) {
      departing.remaining += departing.increment;
    }

    // Apply delay to arriving player (in delay mode)
    delayRunningFor = null;
    delayRemaining = 0;
    if (mode === 'delay' && arriving.delay > 0) {
      delayRunningFor = arriving;
      delayRemaining = arriving.delay;
      delayStartTime = Date.now();
    }

    departing.moves++;

    player1.isActive = !player1.isActive;
    player2.isActive = !player2.isActive;

    playSwitchSound();
    updateDisplay();
  }

  function tick() {
    if (!running || paused) return;

    const active = player1.isActive ? player1 : player2;

    // Handle delay first
    if (delayRunningFor === active && delayRemaining > 0) {
      const elapsed = (Date.now() - delayStartTime) / 1000;
      delayRemaining = Math.max(0, active.delay - elapsed);
      updateDisplay();
      // If delay still running, don't deduct main time
      if (delayRemaining > 0) return;
      // Delay finished, reset
      delayRunningFor = null;
      delayRemaining = 0;
      delayStartTime = 0;
      return;
    }

    active.remaining -= 1;

    // Warning sounds
    if (active.remaining === 30 || active.remaining === 20) {
      playWarningSound();
    } else if (active.remaining === 10 || active.remaining === 5) {
      playDangerSound();
    } else if (active.remaining <= 4 && active.remaining >= 1) {
      playDangerSound();
    } else if (active.remaining === 0) {
      playTimeoutSound();
    } else if (active.remaining < 0 && active.remaining % 5 === 0) {
      playDangerSound();
    }

    if (active.remaining <= -120) {
      // Auto-stop after 2 minutes overtime
      running = false;
      if (intervalId) { clearInterval(intervalId); intervalId = null; }
    }

    updateDisplay();
  }

  function startTimer() {
    if (running && !paused) return; // already running
    if (paused) {
      // Resume
      paused = false;
      if (delayRunningFor && delayRemaining > 0) {
        delayStartTime = Date.now();
      }
      updateDisplay();
      return;
    }

    // Fresh start
    running = true;
    paused = false;
    delayRunningFor = null;
    delayRemaining = 0;
    updateDisplay();

    if (intervalId) clearInterval(intervalId);
    intervalId = setInterval(tick, 1000);
  }

  function pauseTimer() {
    if (!running || paused) return;
    paused = true;
    updateDisplay();
  }

  function resetTimer() {
    running = false;
    paused = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    delayRunningFor = null;
    delayStartTime = 0;
    delayRemaining = 0;
    applyPreset(player1.remaining, player1.increment, player1.delay);
    updateDisplay();
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
      soundToggle.classList.remove('muted');
      soundIcon.textContent = '\uD83D\uDD0A';
      soundLabel.textContent = '音效开';
    } else {
      soundToggle.classList.add('muted');
      soundIcon.textContent = '\uD83D\uDD07';
      soundLabel.textContent = '音效关';
    }
  }

  // ===== Event bindings =====
  panel1.addEventListener('click', () => {
    if (running && !paused && !player1.isActive) {
      togglePlayer();
    }
  });

  panel2.addEventListener('click', () => {
    if (running && !paused && player1.isActive) {
      togglePlayer();
    }
  });

  btnStart.addEventListener('click', startTimer);
  btnPause.addEventListener('click', pauseTimer);
  btnReset.addEventListener('click', resetTimer);
  soundToggle.addEventListener('click', toggleSound);

  // Preset buttons
  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const total = parseInt(btn.dataset.time);
      const inc = parseInt(btn.dataset.inc);
      const delay = parseInt(btn.dataset.delay);
      applyPreset(total, inc, delay);
      customRow.style.display = 'none';
      currentPreset = btn.textContent;
      btn.classList.add('active');
    });
  });

  // Custom preset button
  customPresetBtn.addEventListener('click', () => {
    customRow.style.display = customRow.style.display === 'none' ? 'flex' : 'none';
    presetBtns.forEach(b => b.classList.remove('active'));
    customPresetBtn.classList.add('active');
  });

  // Apply custom
  document.getElementById('applyCustom').addEventListener('click', () => {
    const min = parseInt(document.getElementById('customTimeMin').value) || 0;
    const sec = parseInt(document.getElementById('customTimeSec').value) || 0;
    const inc = parseInt(document.getElementById('customInc').value) || 0;
    const total = min * 60 + sec;
    applyPreset(total, inc, inc);
    currentPreset = '自定义';
  });

  // Mode toggle: increment vs delay
  modeToggle.querySelectorAll('span').forEach(el => {
    el.addEventListener('click', () => {
      modeToggle.querySelectorAll('span').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      mode = el.dataset.mode;
      updateDisplay();
    });
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (running && !paused) {
        togglePlayer();
      } else {
        startTimer();
      }
    } else if (e.code === 'KeyP') {
      e.preventDefault();
      if (running && !paused) pauseTimer();
      else if (paused) startTimer();
    } else if (e.code === 'KeyR') {
      e.preventDefault();
      resetTimer();
    }
  });

  // Initial preset highlight
  updatePresetButtons();
  presetBtns[0]?.classList.add('active');
  updateDisplay();

})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
