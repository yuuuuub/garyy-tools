<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML实体参考表 - 常用HTML字符实体编码</title>
<meta property="og:title" content="HTML实体参考表 - 常用HTML字符实体编码">
<meta property="og:description" content="HTML实体参考表 - 常用HTML字符实体编码 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="HTML实体参考表 - 常用HTML字符实体编码速查，支持转义/反转义，涵盖特殊符号、数学符号、希腊字母等">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<script src="../i18n.js" defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {--green:#238636;--red:#ef4444;--blue:#3b82f6;
  --bg: #0d1117; --bg-card: #161b22; --bg-input: #0d1117;
  --border: #30363d; --text: #e6edf3; --text-secondary: #8b949e;
  --accent: #58a6ff; --accent-hover: #79c0ff; --danger: #f85149;
  --success: #3fb950; --warning: #d2991d; --radius: 8px;
}
[data-theme="light"] { --bg: #f6f8fa; --bg-card: #fff; --bg-input: #fff; --border: #d0d7de; --text: #1f2328; --text-secondary: #656d76; --accent: #0969da; --accent-hover: #0550ae; --danger: #cf222e; --success: #1a7f37; --warning: #9a6700; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; line-height: 1.6; }
.container { max-width: 1000px; margin: 0 auto; }
h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), #bc8cff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 8px; }
.subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 32px; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
.card h2 { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
label { display: block; font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 4px; margin-top: 12px; }
input, select, textarea { width: 100%; padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.95rem; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; font-family: monospace; }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: 0.2s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 6px 12px; font-size: 0.8rem; }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 0.9rem; z-index: 1000; animation: slideIn 0.3s ease; }
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.search-area { margin-bottom: 12px; }
.search-area input { font-family: monospace; }
.category-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
.cat-tab { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.85rem; background: transparent; color: var(--text-secondary); transition: 0.2s; }
.cat-tab:hover { border-color: var(--accent); color: var(--accent); }
.cat-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.entity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.entity-cell { display: flex; flex-direction: column; align-items: center; padding: 10px 6px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: 0.2s; }
.entity-cell:hover { border-color: var(--accent); background: rgba(88,166,255,0.05); }
.entity-cell .preview { font-size: 1.4rem; margin-bottom: 4px; min-height: 24px; display: flex; align-items: center; }
.entity-cell .entity { font-family: monospace; font-size: 0.7rem; color: var(--accent); word-break: break-all; text-align: center; }
.entity-cell .name { font-size: 0.65rem; color: var(--text-secondary); text-align: center; margin-top: 2px; }
.output-box { padding: 16px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; font-family: monospace; font-size: 0.9rem; word-break: break-all; white-space: pre-wrap; min-height: 60px; max-height: 200px; overflow-y: auto; }
.mode-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.mode-tab { padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.85rem; background: transparent; color: var(--text-secondary); transition: 0.2s; }
.mode-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.count-info { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px; }

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
  <h1>📝 HTML实体参考表</h1>
  <p class="subtitle">HTML字符实体编码速查 · 编码/解码工具 · 符号/Emoji/数学/希腊字母</p>

  <div class="card">
    <h2>🔄 实体编码/解码</h2>
    <div class="mode-tabs">
      <div class="mode-tab active" onclick="setMode('encode')">编码（文本→实体）</div>
      <div class="mode-tab" onclick="setMode('decode')">解码（实体→文本）</div>
    </div>
    <textarea id="convert-input" rows="3" placeholder="输入文本进行编码/解码..." oninput="convert()"></textarea>
    <div class="actions">
      <button class="btn btn-primary btn-sm" onclick="convert()">转换</button>
      <button class="btn btn-outline btn-sm" onclick="copyOutput()">复制结果</button>
    </div>
    <div class="output-box" id="convert-output" style="margin-top:12px">输入文本后点击转换</div>
  </div>

  <div class="card">
    <h2>📚 实体编码速查表</h2>
    <div class="search-area">
      <input id="search" placeholder="搜索实体名称或符号（如 &amp;lt;、小于、&lt;）" oninput="filterEntities()">
    </div>
    <div class="category-tabs" id="cat-tabs"></div>
    <div class="count-info" id="count-info"></div>
    <div class="entity-grid" id="entity-grid"></div>
  </div>

  <div class="card">
    <h2>⚠️ HTML保留字符</h2>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:0.9rem">
        <thead><tr style="border-bottom:1px solid var(--border)"><th style="padding:10px;text-align:left">字符</th><th style="padding:10px;text-align:left">实体编码</th><th style="padding:10px;text-align:left">数字编码</th><th style="padding:10px;text-align:left">说明</th></tr></thead>
        <tbody id="reserved-table"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let mode = 'encode';
let currentCategory = '全部';

const ENTITY_DATA = {
  'HTML保留字符': [
    { char: '<', entity: '&lt;', name: '小于号' },
    { char: '>', entity: '&gt;', name: '大于号' },
    { char: '&', entity: '&amp;', name: '和号' },
    { char: '"', entity: '&quot;', name: '双引号' },
    { char: "'", entity: '&apos;', name: '单引号' }
  ],
  '标点符号': [
    { char: '©', entity: '&copy;', name: '版权' },
    { char: '®', entity: '&reg;', name: '注册商标' },
    { char: '™', entity: '&trade;', name: '商标' },
    { char: '€', entity: '&euro;', name: '欧元' },
    { char: '£', entity: '&pound;', name: '英镑' },
    { char: '¥', entity: '&yen;', name: '日元/人民币' },
    { char: '¢', entity: '&cent;', name: '美分' },
    { char: '§', entity: '&sect;', name: '章节符号' },
    { char: '¶', entity: '&para;', name: '段落符号' },
    { char: '†', entity: '&dagger;', name: '匕首号' },
    { char: '‡', entity: '&Dagger;', name: '双匕首号' },
    { char: '…', entity: '&hellip;', name: '省略号' },
    { char: '–', entity: '&ndash;', name: '短破折号' },
    { char: '—', entity: '&mdash;', name: '长破折号' },
    { char: '¡', entity: '&iexcl;', name: '倒感叹号' },
    { char: '¿', entity: '&iquest;', name: '倒问号' },
    { char: '«', entity: '&laquo;', name: '左双角引号' },
    { char: '»', entity: '&raquo;', name: '右双角引号' }
  ],
  '数学符号': [
    { char: '×', entity: '&times;', name: '乘号' },
    { char: '÷', entity: '&divide;', name: '除号' },
    { char: '±', entity: '&plusmn;', name: '正负号' },
    { char: '≠', entity: '&ne;', name: '不等于' },
    { char: '≤', entity: '&le;', name: '小于等于' },
    { char: '≥', entity: '&ge;', name: '大于等于' },
    { char: '≈', entity: '&asymp;', name: '约等于' },
    { char: '≡', entity: '&equiv;', name: '恒等于' },
    { char: '∞', entity: '&infin;', name: '无穷大' },
    { char: '∑', entity: '&sum;', name: '求和' },
    { char: '∏', entity: '&prod;', name: '连乘' },
    { char: '√', entity: '&radic;', name: '平方根' },
    { char: '∂', entity: '&part;', name: '偏微分' },
    { char: '∫', entity: '&int;', name: '积分' },
    { char: '∇', entity: '&nabla;', name: '梯度' },
    { char: '∈', entity: '&isin;', name: '属于' },
    { char: '∉', entity: '&notin;', name: '不属于' },
    { char: '⊂', entity: '&sub;', name: '子集' },
    { char: '⊃', entity: '&sup;', name: '超集' },
    { char: '∪', entity: '&cup;', name: '并集' },
    { char: '∩', entity: '&cap;', name: '交集' },
    { char: '∝', entity: '&prop;', name: '正比于' },
    { char: '∠', entity: '&ang;', name: '角度' },
    { char: '°', entity: '&deg;', name: '度' },
    { char: '‰', entity: '&permil;', name: '千分号' }
  ],
  '希腊字母': [
    { char: 'α', entity: '&alpha;', name: 'alpha' },
    { char: 'β', entity: '&beta;', name: 'beta' },
    { char: 'γ', entity: '&gamma;', name: 'gamma' },
    { char: 'δ', entity: '&delta;', name: 'delta' },
    { char: 'ε', entity: '&epsilon;', name: 'epsilon' },
    { char: 'ζ', entity: '&zeta;', name: 'zeta' },
    { char: 'η', entity: '&eta;', name: 'eta' },
    { char: 'θ', entity: '&theta;', name: 'theta' },
    { char: 'ι', entity: '&iota;', name: 'iota' },
    { char: 'κ', entity: '&kappa;', name: 'kappa' },
    { char: 'λ', entity: '&lambda;', name: 'lambda' },
    { char: 'μ', entity: '&mu;', name: 'mu' },
    { char: 'ν', entity: '&nu;', name: 'nu' },
    { char: 'ξ', entity: '&xi;', name: 'xi' },
    { char: 'ο', entity: '&omicron;', name: 'omicron' },
    { char: 'π', entity: '&pi;', name: 'pi' },
    { char: 'ρ', entity: '&rho;', name: 'rho' },
    { char: 'σ', entity: '&sigma;', name: 'sigma' },
    { char: 'τ', entity: '&tau;', name: 'tau' },
    { char: 'υ', entity: '&upsilon;', name: 'upsilon' },
    { char: 'φ', entity: '&phi;', name: 'phi' },
    { char: 'χ', entity: '&chi;', name: 'chi' },
    { char: 'ψ', entity: '&psi;', name: 'psi' },
    { char: 'ω', entity: '&omega;', name: 'omega' },
    { char: 'Δ', entity: '&Delta;', name: 'Delta' },
    { char: 'Θ', entity: '&Theta;', name: 'Theta' },
    { char: 'Λ', entity: '&Lambda;', name: 'Lambda' },
    { char: 'Σ', entity: '&Sigma;', name: 'Sigma' },
    { char: 'Φ', entity: '&Phi;', name: 'Phi' },
    { char: 'Ω', entity: '&Omega;', name: 'Omega' }
  ],
  '箭头符号': [
    { char: '←', entity: '&larr;', name: '左箭头' },
    { char: '→', entity: '&rarr;', name: '右箭头' },
    { char: '↑', entity: '&uarr;', name: '上箭头' },
    { char: '↓', entity: '&darr;', name: '下箭头' },
    { char: '↔', entity: '&harr;', name: '左右箭头' },
    { char: '⇐', entity: '&lArr;', name: '双左箭头' },
    { char: '⇒', entity: '&rArr;', name: '双右箭头' },
    { char: '⇑', entity: '&uArr;', name: '双上箭头' },
    { char: '⇓', entity: '&dArr;', name: '双下箭头' },
    { char: '⇔', entity: '&hArr;', name: '双左右箭头' },
    { char: '↵', entity: '&crarr;', name: '回车箭头' }
  ],
  '形状符号': [
    { char: '■', entity: '&#9632;', name: '黑方块' },
    { char: '□', entity: '&#9633;', name: '白方块' },
    { char: '●', entity: '&#9679;', name: '黑圆' },
    { char: '○', entity: '&#9675;', name: '白圆' },
    { char: '◆', entity: '&#9670;', name: '黑菱形' },
    { char: '◇', entity: '&#9671;', name: '白菱形' },
    { char: '★', entity: '&#9733;', name: '黑星' },
    { char: '☆', entity: '&#9734;', name: '白星' },
    { char: '♠', entity: '&spades;', name: '黑桃' },
    { char: '♣', entity: '&clubs;', name: '梅花' },
    { char: '♥', entity: '&hearts;', name: '红心' },
    { char: '♦', entity: '&diams;', name: '方块' }
  ]
};

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-tab').forEach((t, i) => {
    t.classList.toggle('active', ['encode', 'decode'][i] === m);
  });
  document.getElementById('convert-input').placeholder = m === 'encode' ? '输入普通文本，转换为HTML实体...' : '输入HTML实体，转换为普通文本...';
  convert();
}

function encodeEntities(text) {
  return text.replace(/[<>&"']/g, c => {
    switch (c) {
      case '<': return '&lt;';
      case '>': return '&gt;';
      case '&': return '&amp;';
      case '"': return '&quot;';
      case "'": return '&apos;';
    }
  }).replace(/[^\x00-\x7F]/g, c => '&#' + c.codePointAt(0) + ';');
}

function decodeEntities(text) {
  return text.replace(/&(#\d+|#x[0-9a-fA-F]+|[a-zA-Z]+);/g, (match, entity) => {
    if (entity.startsWith('#x')) return String.fromCodePoint(parseInt(entity.slice(2), 16));
    if (entity.startsWith('#')) return String.fromCodePoint(parseInt(entity.slice(1)));
    const entities = { lt: '<', gt: '>', amp: '&', quot: '"', apos: "'", nbsp: ' ', copy: '©', reg: '®', trade: '™', euro: '€', pound: '£', yen: '¥', times: '×', divide: '÷', plusmn: '±', ne: '≠', le: '≤', ge: '≥', infin: '∞', alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', pi: 'π', sigma: 'σ', omega: 'ω', sigma: 'σ', sum: '∑', prod: '∏', radic: '√', int: '∫' };
    return entities[entity] || match;
  });
}

function convert() {
  const input = document.getElementById('convert-input').value;
  const output = document.getElementById('convert-output');
  if (!input) { output.textContent = '输入文本后点击转换'; return; }
  output.textContent = mode === 'encode' ? encodeEntities(input) : decodeEntities(input);
}

function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('convert-output').textContent);
  toast('已复制');
}

function renderTabs() {
  const cats = ['全部', ...Object.keys(ENTITY_DATA)];
  document.getElementById('cat-tabs').innerHTML = cats.map(c =>
    `<div class="cat-tab${c === currentCategory ? ' active' : ''}" onclick="selectCategory('${c}')">${c}</div>`
  ).join('');
}

function selectCategory(cat) {
  currentCategory = cat;
  renderTabs();
  filterEntities();
}

function getAllEntities() {
  if (currentCategory === '全部') {
    return Object.values(ENTITY_DATA).flat();
  }
  return ENTITY_DATA[currentCategory] || [];
}

function filterEntities() {
  const search = document.getElementById('search').value.toLowerCase();
  let entities = getAllEntities();
  if (search) {
    entities = entities.filter(e =>
      e.entity.toLowerCase().includes(search) ||
      e.name.toLowerCase().includes(search) ||
      e.char.includes(search) ||
      e.char.codePointAt(0).toString(16).includes(search)
    );
  }

  document.getElementById('count-info').textContent = `共 ${entities.length} 个实体`;
  document.getElementById('entity-grid').innerHTML = entities.map(e =>
    `<div class="entity-cell" onclick="copyEntity('${esc(e.entity)}')" title="${e.name}">
      <span class="preview">${e.char}</span>
      <span class="entity">${e.entity}</span>
      <span class="name">${e.name}</span>
    </div>`
  ).join('');
}

function copyEntity(entity) {
  navigator.clipboard.writeText(entity);
  toast(entity + ' 已复制');
}

function esc(s) { return s.replace(/'/g, "\\'"); }

function renderReservedTable() {
  const reserved = ENTITY_DATA['HTML保留字符'];
  document.getElementById('reserved-table').innerHTML = reserved.map(e =>
    `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:10px;font-size:1.2rem;text-align:center">${e.char}</td>
      <td style="padding:10px;font-family:monospace;color:var(--accent)">${e.entity}</td>
      <td style="padding:10px;font-family:monospace;color:var(--accent)">&amp;#${e.char.codePointAt(0)};</td>
      <td style="padding:10px;color:var(--text-secondary)">${e.name}</td>
    </tr>`
  ).join('');
}

renderTabs();
filterEntities();
renderReservedTable();
</script>
</body>
</html>
