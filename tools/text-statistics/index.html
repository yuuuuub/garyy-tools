<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文本统计分析</title><meta name="description" content="文本统计分析 - 在线文本字数统计工具"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:200px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}.stat-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}.stat-value{font-size:1.5rem;font-weight:700;color:var(--blue)}.stat-label{font-size:.8rem;color:var(--text2);margin-top:4px}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.reading-time{margin-top:12px;padding:12px;background:var(--bg);border-radius:8px;font-size:.9rem}.char-bar{height:20px;background:var(--border);border-radius:10px;overflow:hidden;margin:8px 0}.char-bar-fill{height:100%;background:var(--blue);transition:width .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style><meta property="og:title" content="文本统计分析"><meta property="og:description" content="文本统计分析 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📊 文本统计分析</h1><p class="sub">在线文本字数统计工具</p>
<div class="card"><div class="label">输入文本</div>
<textarea id="inputText" placeholder="输入要分析的文本..."></textarea>
<button class="btn" onclick="analyzeText()">分析文本</button></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function analyzeText(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var stats=getTextStats(text);
  var html='<div class="card"><div class="section"><h3>📋 统计结果</h3>';
  html+='<div class="stats-grid">';
  html+='<div class="stat-item"><div class="stat-value">'+stats.chars+'</div><div class="stat-label">总字符数</div></div>';
  html+='<div class="stat-item"><div class="stat-value">'+stats.charsNoSpaces+'</div><div class="stat-label">不含空格</div></div>';
  html+='<div class="stat-item"><div class="stat-value">'+stats.words+'</div><div class="stat-label">单词数</div></div>';
  html+='<div class="stat-item"><div class="stat-value">'+stats.sentences+'</div><div class="stat-label">句子数</div></div>';
  html+='<div class="stat-item"><div class="stat-value">'+stats.paragraphs+'</div><div class="stat-label">段落数</div></div>';
  html+='<div class="stat-item"><div class="stat-value">'+stats.lines+'</div><div class="stat-label">行数</div></div>';
  html+='</div>';
  html+='<div class="reading-time"><strong>预计阅读时间：</strong>'+stats.readingTime+' 分钟</div>';
  html+='<div class="section"><h3>字符分布</h3>';
  html+='<div class="char-bar"><div class="char-bar-fill" style="width:'+(stats.letters/stats.chars*100)+'%"></div></div>';
  html+='<div style="font-size:.8rem;color:var(--text2)">字母: '+stats.letters+' ('+Math.round(stats.letters/stats.chars*100)+'%)</div>';
  html+='<div class="char-bar"><div class="char-bar-fill" style="width:'+(stats.digits/stats.chars*100)+'%;background:var(--green)"></div></div>';
  html+='<div style="font-size:.8rem;color:var(--text2)">数字: '+stats.digits+' ('+Math.round(stats.digits/stats.chars*100)+'%)</div>';
  html+='<div class="char-bar"><div class="char-bar-fill" style="width:'+(stats.spaces/stats.chars*100)+'%;background:var(--yellow)"></div></div>';
  html+='<div style="font-size:.8rem;color:var(--text2)">空格: '+stats.spaces+' ('+Math.round(stats.spaces/stats.chars*100)+'%)</div>';
  html+='<div class="char-bar"><div class="char-bar-fill" style="width:'+(stats.punctuation/stats.chars*100)+'%;background:var(--red)"></div></div>';
  html+='<div style="font-size:.8rem;color:var(--text2)">标点: '+stats.punctuation+' ('+Math.round(stats.punctuation/stats.chars*100)+'%)</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function getTextStats(text){
  var chars=text.length;
  var charsNoSpaces=text.replace(/\s/g,'').length;
  var words=text.trim()===''?0:text.trim().split(/\s+/).length;
  var sentences=text.split(/[.!?。！？]+/).filter(function(s){return s.trim().length>0;}).length;
  var paragraphs=text.split(/\n\s*\n/).filter(function(p){return p.trim().length>0;}).length;
  var lines=text.split('\n').length;
  var letters=text.replace(/[^a-zA-Z\u4e00-\u9fa5]/g,'').length;
  var digits=text.replace(/[^0-9]/g,'').length;
  var spaces=text.replace(/[^ ]/g,'').length;
  var punctuation=text.replace(/[a-zA-Z0-9\u4e00-\u9fa5\s]/g,'').length;
  var readingTime=Math.max(1,Math.ceil(words/200));
  return{
    chars:chars,
    charsNoSpaces:charsNoSpaces,
    words:words,
    sentences:sentences,
    paragraphs:paragraphs,
    lines:lines,
    letters:letters,
    digits:digits,
    spaces:spaces,
    punctuation:punctuation,
    readingTime:readingTime
  };
}
analyzeText();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
