<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷宫竞速</title>
    <meta name="description" content="迷宫竞速游戏，与时间赛跑找出迷宫出口">
    <style>
:root {--bg: #0d1117;
--card: #161b22;
--border: #30363d;
--text: #e6edf3;
--accent: #3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {background: var(--bg);
color: var(--text);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
padding: 20pxscroll-behavior:smooth;}
h1 { margin-bottom: 10px; font-size: 1.8rem; }
.controls {display: flex;
gap: 20px;
margin-bottom: 15px;
flex-wrap: wrap;
justify-content: center}
.controls label { display: flex; align-items: center; gap: 8px; }
.controls select, .controls button {background: var(--card);
border: 1px solid var(--border);
color: var(--text);
padding: 8px 16px;
border-radius: 6px;
cursor: pointer;
font-size: 1rem}
.controls button:hover { background: var(--accent); }
.stats {display: flex;
gap: 30px;
margin-bottom: 15px;
font-size: 1.2rem}
.stats span { color: var(--accent); font-weight: bold; }
#gameCanvas {border: 2px solid var(--border);
border-radius: 8px;
background: var(--card);
max-width: 100%}
.info {margin-top: 15px;
color: #8b949e;
text-align: center}
.mobile-controls {display: none;
margin-top: 20px;
gap: 10px}
.mobile-btn {width: 60px;
height: 60px;
background: var(--card);
border: 1px solid var(--border);
border-radius: 10px;
color: var(--text);
font-size: 1.5rem;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center}
.mobile-btn:active { background: var(--accent); }
.dpad { display: grid; grid-template-columns: repeat(3, 60px); gap: 5px; }
.dpad .mobile-btn:nth-child(1) { grid-column: 2; }
.dpad .mobile-btn:nth-child(2) { grid-column: 1; grid-row: 2; }
.dpad .mobile-btn:nth-child(3) { grid-column: 3; grid-row: 2; }
.dpad .mobile-btn:nth-child(4) { grid-column: 2; grid-row: 3; }
@media (max-width: 600px) {.mobile-controls { display: flex; justify-content: center; }
h1 { font-size: 1.4rem; }}
.win-overlay {display: none;
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0,0,0,0.8);
justify-content: center;
align-items: center;
flex-direction: column;
z-index: 100}
.win-overlay.show { display: flex; }
.win-overlay h2 { font-size: 2rem; margin-bottom: 10px; color: var(--accent); }
.win-overlay p { font-size: 1.3rem; margin-bottom: 20px; }
.win-overlay button {background: var(--accent);
border: none;
color: white;
padding: 12px 30px;
border-radius: 8px;
font-size: 1.1rem;
cursor: pointer}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="迷宫竞速">
  <meta property="og:description" content="迷宫竞速游戏，与时间赛跑找出迷宫出口">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/maze-race/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
    <h1>🏃 迷宫竞速</h1>
    <div class="controls">
        <label>难度：
            <select id="difficulty">
                <option value="easy">简单 (10x10)</option>
                <option value="medium" selected>中等 (15x15)</option>
                <option value="hard">困难 (20x20)</option>
            </select>
        </label>
        <button onclick="newGame()">新游戏</button>
    </div>
    <div class="stats">
        时间：<span id="timer">0.0</span>秒
        步数：<span id="steps">0</span>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="info">方向键或WASD控制移动，从左上角走到右下角</div>
    <div class="mobile-controls">
        <div class="dpad">
            <button class="mobile-btn" ontouchstart="move(0,-1)">↑</button>
            <button class="mobile-btn" ontouchstart="move(-1,0)">←</button>
            <button class="mobile-btn" ontouchstart="move(1,0)">→</button>
            <button class="mobile-btn" ontouchstart="move(0,1)">↓</button>
        </div>
    </div>
    <div class="win-overlay" id="winOverlay">
        <h2>🎉 恭喜通关！</h2>
        <p>用时 <span id="finalTime"></span>秒，共 <span id="finalSteps"></span>步</p>
        <button onclick="newGame();document.getElementById('winOverlay').classList.remove('show')">再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timerEl = document.getElementById('timer');
        const stepsEl = document.getElementById('steps');

        let maze = [], cols, rows, cellSize;
        let player = {x: 0, y: 0};
        let goal = {x: 0, y: 0};
        let steps = 0, startTime = 0, timerInterval = null, gameWon = false;

        const sizes = {easy: 10, medium: 15, hard: 20};

        function generateMaze(w, h) {
            const grid = Array.from({length: h}, () => Array.from({length: w}, () => ({n:1,s:1,e:1,w:1,visited:false})));
            const stack = [{x:0, y:0}];
            grid[0][0].visited = true;

            while (stack.length) {
                const cur = stack[stack.length-1];
                const neighbors = [];
                if (cur.y > 0 && !grid[cur.y-1][cur.x].visited) neighbors.push({x:cur.x, y:cur.y-1, dir:'n'});
                if (cur.y < h-1 && !grid[cur.y+1][cur.x].visited) neighbors.push({x:cur.x, y:cur.y+1, dir:'s'});
                if (cur.x < w-1 && !grid[cur.y][cur.x+1].visited) neighbors.push({x:cur.x+1, y:cur.y, dir:'e'});
                if (cur.x > 0 && !grid[cur.y][cur.x-1].visited) neighbors.push({x:cur.x-1, y:cur.y, dir:'w'});

                if (neighbors.length) {
                    const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    const opposite = {n:'s', s:'n', e:'w', w:'e'};
                    grid[cur.y][cur.x][next.dir] = 0;
                    grid[next.y][next.x][opposite[next.dir]] = 0;
                    grid[next.y][next.x].visited = true;
                    stack.push({x: next.x, y: next.y});
                } else {
                    stack.pop();
                }
            }
            return grid;
        }

        function newGame() {
            const diff = document.getElementById('difficulty').value;
            const size = sizes[diff];
            cols = rows = size;
            cellSize = Math.min(Math.floor((Math.min(window.innerWidth - 40, 600)) / cols), 40);
            canvas.width = cols * cellSize;
            canvas.height = rows * cellSize;

            maze = generateMaze(cols, rows);
            player = {x: 0, y: 0};
            goal = {x: cols-1, y: rows-1};
            steps = 0;
            gameWon = false;
            stepsEl.textContent = '0';
            timerEl.textContent = '0.0';
            if (timerInterval) clearInterval(timerInterval);
            startTime = Date.now();
            timerInterval = setInterval(() => {
                if (!gameWon) timerEl.textContent = ((Date.now() - startTime) / 1000).toFixed(1);
            }, 100);
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#30363d';
            ctx.lineWidth = 2;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const px = x * cellSize, py = y * cellSize;
                    const cell = maze[y][x];
                    if (cell.n) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px+cellSize, py); ctx.stroke(); }
                    if (cell.s) { ctx.beginPath(); ctx.moveTo(px, py+cellSize); ctx.lineTo(px+cellSize, py+cellSize); ctx.stroke(); }
                    if (cell.e) { ctx.beginPath(); ctx.moveTo(px+cellSize, py); ctx.lineTo(px+cellSize, py+cellSize); ctx.stroke(); }
                    if (cell.w) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py+cellSize); ctx.stroke(); }
                }
            }

            ctx.fillStyle = '#22c55e';
            ctx.fillRect(goal.x * cellSize + cellSize*0.2, goal.y * cellSize + cellSize*0.2, cellSize*0.6, cellSize*0.6);

            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.arc(player.x * cellSize + cellSize/2, player.y * cellSize + cellSize/2, cellSize*0.35, 0, Math.PI*2);
            ctx.fill();
        }

        function move(dx, dy) {
            if (gameWon) return;
            const cell = maze[player.y][player.x];
            if ((dx === -1 && cell.w) || (dx === 1 && cell.e) || (dy === -1 && cell.n) || (dy === 1 && cell.s)) return;
            const nx = player.x + dx, ny = player.y + dy;
            if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) return;
            player.x = nx;
            player.y = ny;
            steps++;
            stepsEl.textContent = steps;
            draw();
            if (player.x === goal.x && player.y === goal.y) {
                gameWon = true;
                clearInterval(timerInterval);
                document.getElementById('finalTime').textContent = timerEl.textContent;
                document.getElementById('finalSteps').textContent = steps;
                document.getElementById('winOverlay').classList.add('show');
            }
        }

        document.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp': case 'w': case 'W': e.preventDefault(); move(0,-1); break;
                case 'ArrowDown': case 's': case 'S': e.preventDefault(); move(0,1); break;
                case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); move(-1,0); break;
                case 'ArrowRight': case 'd': case 'D': e.preventDefault(); move(1,0); break;
            }
        });

        newGame();
    </script>
<script src="../i18n.js" defer></script>
</body>
</html>
