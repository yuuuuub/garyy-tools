<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 食谱份量换算器</title>
<meta property="og:title" content="📐 食谱份量换算器">
<meta property="og:description" content="📐 食谱份量换算器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="根据用餐人数自动换算食材份量，支持常用计量单位互转">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#a855f7;--accent2:#9333ea;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#9333ea;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--blue:#0969da;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=number],input[type=text]{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus{border-color:var(--accent)}
select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;width:100%}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:12px 0}
.result-item{background:var(--bg);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--border)}
.result-item .food{font-weight:600;margin-bottom:4px}
.result-item .amount{font-size:1.2rem;font-weight:700;color:var(--accent)}
.result-item .unit{font-size:.8rem;color:var(--text2)}
.serving-btn{display:flex;align-items:center;gap:12px;margin:12px 0}
.serving-btn button{width:36px;height:36px;border-radius:50%;font-size:1.2rem;padding:0;display:flex;align-items:center;justify-content:center}
.serving-btn .count{font-size:1.8rem;font-weight:800;min-width:60px;text-align:center}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0}
.unit-card{background:var(--bg);border-radius:8px;padding:12px;text-align:center;border:1px solid var(--border)}
.unit-card .name{font-size:.85rem;font-weight:600;margin-bottom:4px}
.unit-card .equiv{font-size:.75rem;color:var(--text2)}
.ref-table{width:100%;border-collapse:collapse;font-size:.85rem}
.ref-table th{text-align:left;padding:8px;border-bottom:2px solid var(--border);color:var(--accent);font-weight:600}
.ref-table td{padding:8px;border-bottom:1px solid var(--border)}
.ref-table tr:hover{background:var(--bg)}
.ing-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.ing-row:last-child{border-bottom:none}
.ing-row input[type=text]{flex:2}
.ing-row input[type=number]{flex:1}
.ing-row select{flex:1}
.ing-row button{padding:6px 10px;font-size:.8rem}
.preset-recipes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.preset-recipes button{font-size:.8rem;padding:6px 14px}
.empty{text-align:center;padding:30px;color:var(--text2);font-size:.9rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📐 食谱份量换算器</h1><p>根据用餐人数自动换算食材用量</p></div>

<div class="cd"><h2>🍽️ 份量换算</h2>
<label>原食谱人数</label>
<div class="serving-btn">
<button onclick="adjustServing(-1)">−</button>
<div class="count" id="origServing">2</div>
<button onclick="adjustServing(1)">＋</button>
<span style="color:var(--text2);font-size:.85rem">人份</span>
</div>
<label>目标人数</label>
<div class="serving-btn">
<button onclick="adjustTarget(-1)">−</button>
<div class="count" id="targetServing">4</div>
<button onclick="adjustTarget(1)">＋</button>
<span style="color:var(--text2);font-size:.85rem">人份</span>
</div>
<div style="text-align:center;padding:12px;background:var(--bg);border-radius:10px;margin:12px 0">
<span style="font-size:.9rem;color:var(--text2)">换算倍数：</span>
<span style="font-size:1.5rem;font-weight:800;color:var(--accent)" id="multiplier">2.0x</span>
</div>
<h3 style="color:var(--accent);margin:16px 0 8px">📝 添加食材</h3>
<div id="ingList"></div>
<div class="bg">
<button onclick="addIngRow()">＋ 添加食材</button>
<button onclick="calculate()">📐 换算</button>
</div>
<div class="preset-recipes" style="margin-top:12px"><span style="color:var(--text2);font-size:.85rem">快捷模板：</span></div>
<div class="result-grid" id="resultGrid" style="display:none"></div></div>

<div class="cd"><h2>📏 常用烹饪单位</h2>
<div class="unit-grid" id="unitGrid"></div></div>

<div class="cd"><h2>📚 常见食材份量参考</h2>
<table class="ref-table" id="refTable"></table></div>
</div>
<script>
var DB='recipe_converter_cn';
var origServe=2,targetServe=4;
var PRESETS={
'红烧肉':[{name:'五花肉',amount:500,unit:'g'},{name:'冰糖',amount:30,unit:'g'},{name:'酱油',amount:3,unit:'勺'},{name:'料酒',amount:2,unit:'勺'},{name:'八角',amount:2,unit:'个'}],
'番茄炒蛋':[{name:'鸡蛋',amount:3,unit:'个'},{name:'番茄',amount:2,unit:'个'},{name:'葱',amount:1,unit:'根'},{name:'糖',amount:1,unit:'小勺'}],
'宫保鸡丁':[{name:'鸡胸肉',amount:250,unit:'g'},{name:'花生米',amount:50,unit:'g'},{name:'干辣椒',amount:10,unit:'个'},{name:'花椒',amount:1,unit:'小勺'}],
'蛋炒饭':[{name:'隔夜饭',amount:1,unit:'碗'},{name:'鸡蛋',amount:2,unit:'个'},{name:'葱',amount:1,unit:'根'}],
'可乐鸡翅':[{name:'鸡翅中',amount:8,unit:'个'},{name:'可乐',amount:1,unit:'罐'},{name:'酱油',amount:2,unit:'勺'}]
};
var UNITS=[
{name:'1茶匙',equiv:'约5ml ≈ 3g盐/糖'},{name:'1汤匙',equiv:'约15ml ≈ 3茶匙'},
{name:'1杯',equiv:'约240ml ≈ 16汤匙'},{name:'1碗米饭',equiv:'约150g熟饭'},
{name:'1斤',equiv:'500g'},{name:'1两',equiv:'50g'},
{name:'1磅',equiv:'约454g'},{name:'1盎司',equiv:'约28g'},
{name:'1打',equiv:'12个'},{name:'半勺',equiv:'约2.5ml'}
];
var REF_DATA=[
{food:'大米(生)',serving:'100g',cooked:'约200g熟饭',calories:'346千卡'},
{food:'面条(生)',serving:'100g',cooked:'约240g熟面',calories:'348千卡'},
{food:'鸡胸肉',serving:'100g',cooked:'约85g熟肉',calories:'165千卡'},
{food:'鸡蛋',serving:'1个(约50g)',cooked:'约45g熟蛋',calories:'72千卡'},
{food:'五花肉',serving:'100g',cooked:'约75g熟肉',calories:'395千卡'},
{food:'豆腐',serving:'100g',cooked:'100g',calories:'76千卡'},
{food:'西兰花',serving:'100g',cooked:'约60g熟菜',calories:'34千卡'},
{food:'番茄',serving:'1个(约150g)',cooked:'约130g',calories:'27千卡'},
{food:'土豆',serving:'1个(约200g)',cooked:'约160g熟',calories:'154千卡'},
{food:'苹果',serving:'1个(约200g)',cooked:'—',calories:'104千卡'}
];

function adjustServing(d){origServe=Math.max(1,origServe+d);update();}
function adjustTarget(d){targetServe=Math.max(1,targetServe+d);update();}
function update(){
document.getElementById('origServing').textContent=origServe;
document.getElementById('targetServing').textContent=targetServe;
document.getElementById('multiplier').textContent=(targetServe/origServe).toFixed(1)+'x';
}
function addIngRow(name,amount,unit){
var div=document.getElementById('ingList');
var row=document.createElement('div');row.className='ing-row';
row.innerHTML='<input type="text" value="'+(name||'')+'" placeholder="食材名称" class="ing-name">'+
'<input type="number" value="'+(amount||100)+'" min="0" class="ing-amount" placeholder="数量">'+
'<select class="ing-unit"><option value="g"'+(unit==='g'?' selected':'')+'>克(g)</option><option value="ml"'+(unit==='ml'?' selected':'')+'>毫升(ml)</option><option value="勺"'+(unit==='勺'?' selected':'')+'>勺</option><option value="个"'+(unit==='个'?' selected':'')+'>个</option><option value="碗"'+(unit==='碗'?' selected':'')+'>碗</option><option value="根"'+(unit==='根'?' selected':'')+'>根</option><option value="块"'+(unit==='块'?' selected':'')+'>块</option></select>'+
'<button class="dng" style="background:var(--red)" onclick="this.parentElement.remove()">✕</button>';
div.appendChild(row);
}
function calculate(){
var mult=targetServe/origServe;
var rows=document.querySelectorAll('.ing-row');
var results=[];
rows.forEach(function(r){
var name=r.querySelector('.ing-name').value.trim();if(!name)return;
var amt=parseFloat(r.querySelector('.ing-amount').value)||0;
var unit=r.querySelector('.ing-unit').value;
var newAmt=amt*mult;
results.push({name:name,original:amt,newAmount:newAmt,unit:unit});
});
if(!results.length){alert('请先添加食材');return;}
var grid=document.getElementById('resultGrid');grid.style.display='grid';
grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:8px"><span style="color:var(--text2)">目标：</span><b style="color:var(--accent)">'+targetServe+'人份</b><span style="color:var(--text2);margin-left:12px">原：</span><b>'+origServe+'人份</b><span style="color:var(--text2);margin-left:12px">倍数：</span><b style="color:var(--accent)">'+mult.toFixed(1)+'x</b></div>'+
results.map(function(r){
return '<div class="result-item"><div class="food">'+r.name+'</div><div class="amount">'+formatAmt(r.newAmount)+'</div><div class="unit">'+r.unit+' <span style="color:var(--text2)">(原'+r.original+')</span></div></div>';
}).join('');
}
function formatAmt(n){return Number.isInteger(n)?n:n.toFixed(1);}
function loadPreset(name){
var ings=PRESETS[name];if(!ings)return;
document.getElementById('ingList').innerHTML='';
ings.forEach(function(i){addIngRow(i.name,i.amount,i.unit)});
}
function renderPresets(){
var el=document.querySelector('.preset-recipes');
Object.keys(PRESETS).forEach(function(name){
var btn=document.createElement('button');btn.className='sec';btn.textContent=name;
btn.onclick=function(){loadPreset(name)};el.appendChild(btn);
});
}
function renderUnits(){
document.getElementById('unitGrid').innerHTML=UNITS.map(function(u){
return '<div class="unit-card"><div class="name">'+u.name+'</div><div class="equiv">'+u.equiv+'</div></div>';
}).join('');
}
function renderRef(){
document.getElementById('refTable').innerHTML='<thead><tr><th>食材</th><th>生量</th><th>熟量</th><th>热量</th></tr></thead><tbody>'+
REF_DATA.map(function(r){return '<tr><td><b>'+r.food+'</b></td><td>'+r.serving+'</td><td>'+r.cooked+'</td><td>'+r.calories+'</td></tr>'}).join('')+'</tbody>';
}
addIngRow('五花肉',500,'g');addIngRow('冰糖',30,'g');addIngRow('酱油',3,'勺');
renderPresets();renderUnits();renderRef();update();
</script>
</body>
</html>
