<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文能力地图</title>
<meta name="description" content="中文能力地图，评估和展示个人技能能力矩阵">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6scroll-behavior:smooth;}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:var(--text);font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-warning{background:var(--yellow);color:#000}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.stat{text-align:center;padding:12px}
.stat-num{font-size:2rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.8rem;color:var(--text2)}
.tag{display:inline-block;padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:.8rem;margin:2px}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.table th{color:var(--text2);font-size:.85rem;font-weight:600}
.table tr:hover{background:rgba(59,130,246,.05)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.hidden{display:none!important}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;white-space:nowrap;color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:var(--text)}
.tab:hover:not(.active){background:var(--border)}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="中文能力地图">
  <meta property="og:description" content="中文能力地图，评估和展示个人技能能力矩阵">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/competency-map-cn/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🗺️ 中文能力地图';

const APP=document.getElementById('app');
let maps=JSON.parse(localStorage.getItem('cm_data')||'[]');
let curMap=null;

function save(){localStorage.setItem('cm_data',JSON.stringify(maps))}
function render(){
  let h=`<h1>🗺️ 中文能力地图</h1><p class="subtitle">映射你的能力领域</p>`;
  if(curMap!==null){
    let m=maps[curMap];
    h+=`<div class="card"><div class="flex-between"><button class="btn btn-sm" onclick="curMap=null;render()">← 返回</button><b>${m.title}</b><button class="btn btn-sm" onclick="addArea()">+ 添加能力领域</button></div></div>`;
    m.areas.forEach((a,i)=>{
      let pct=a.level*20;
      h+=`<div class="card"><div class="flex-between"><b>${a.name}</b><div class="flex"><span class="badge badge-blue">${a.level}/5</span><button class="btn btn-sm" onclick="editArea(${i})">编辑</button><button class="btn btn-sm btn-danger" onclick="delArea(${i})">删除</button></div></div>`;
      h+=`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
      if(a.items&&a.items.length){
        h+=`<div style="margin-top:6px">`;a.items.forEach(it=>{h+=`<span class="tag">${it}</span> `});h+=`</div>`;
      }
      h+=`</div>`;
    });
    if(!m.areas.length) h+=`<div class="empty">暂无能力领域</div>`;
  } else {
    h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">能力地图列表</span><button class="btn btn-sm" onclick="newMap()">+ 新建</button></div></div>`;
    maps.forEach((m,i)=>{
      h+=`<div class="card"><div class="flex-between"><b>${m.title}</b><div class="flex"><button class="btn btn-sm" onclick="openMap(${i})">编辑</button><button class="btn btn-sm btn-danger" onclick="delMap(${i})">删除</button></div></div><p style="color:var(--text2)">${m.areas.length} 个能力领域</p></div>`;
    });
    if(!maps.length) h+=`<div class="empty">暂无能力地图</div>`;
  }
  APP.innerHTML=h;
}
function newMap(){let t=prompt('地图标题：');if(t){maps.push({title:t,areas:[]});save();render()}}
function delMap(i){if(confirm('删除？')){maps.splice(i,1);curMap=null;save();render()}}
function openMap(i){curMap=i;render()}
function addArea(){let n=prompt('能力名称：');if(!n)return;let l=parseInt(prompt('等级(1-5)：','3'));if(isNaN(l))l=3;let items=prompt('子技能(逗号分隔)：')||'';maps[curMap].areas.push({name:n,level:l,items:items?items.split(',').map(s=>s.trim()):[]});save();render()}
function editArea(i){let a=maps[curMap].areas[i];let n=prompt('名称：',a.name);if(n===null)return;let l=parseInt(prompt('等级(1-5)：',a.level));if(isNaN(l))l=a.level;let items=prompt('子技能(逗号分隔)：',(a.items||[]).join(','));if(items!==null)a.items=items.split(',').map(s=>s.trim());a.name=n;a.level=l;save();render()}
function delArea(i){if(confirm('删除？')){maps[curMap].areas.splice(i,1);save();render()}}
render();

</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
