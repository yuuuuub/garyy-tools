<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间轴生成器 - Timeline Generator</title>
<meta property="og:title" content="时间轴生成器 - Timeline Generator">
<meta property="og:description" content="时间轴生成器 - Timeline Generator - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线时间轴生成器，支持自定义事件，快速创建精美时间轴">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><line x1='16' y1='2' x2='16' y2='30' stroke='%23e94560' stroke-width='2'/><circle cx='16' cy='6' r='3' fill='%23e94560'/><circle cx='16' cy='14' r='3' fill='%230969da'/><circle cx='16' cy='22' r='3' fill='%231a7f37'/><circle cx='16' cy='30' r='3' fill='%23f5a623'/><line x1='16' y1='6' x2='28' y2='6' stroke='%23e94560' stroke-width='1'/><line x1='4' y1='14' x2='16' y2='14' stroke='%230969da' stroke-width='1'/><line x1='16' y1='22' x2='28' y2='22' stroke='%231a7f37' stroke-width='1'/><line x1='4' y1='30' x2='16' y2='30' stroke='%23f5a623' stroke-width='1'/></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--text:#e0e0e0;--text2:#a0a0b0;--accent:#e94560;--accent2:#533483;--border:#2a2a4a;--radius:10px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--surface:#fff;--surface2:#f0f3f6;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#8250df;--border:#d0d7de}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vhpadding:16px;}
h1{font-size:20px;font-weight:700;color:var(--accent);padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.container{display:flex;height:calc(100vh - 56px)}
.sidebar{width:340px;background:var(--surface);border-right:1px solid var(--border);padding:16px;overflow-y:auto;flex-shrink:0}
.main{flex:1;padding:16px;overflow:auto}
label{display:block;font-size:13px;color:var(--text2);margin:8px 0 4px}
input,textarea,select{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:13px;font-family:monospace}
textarea{resize:vertical;min-height:140px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;width:100%;margin-top:12px;transition:var(--transition)}
.btn:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);margin-top:8px}
.btn-outline:hover{background:var(--surface2)}
.toggle-theme{position:fixed;top:16px;right:16px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;z-index:200}
.tl-wrap{max-width:700px;margin:0 auto}
.tl-title{font-size:22px;font-weight:700;color:var(--accent);text-align:center;margin-bottom:24px}
.tl-item{display:flex;align-items:flex-start;margin-bottom:0;position:relative}
.tl-left,.tl-right{flex:1;padding:12px 20px}
.tl-left{text-align:right}
.tl-right{text-align:left}
.tl-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;margin:14px 16px 0;position:relative;z-index:2}
.tl-line{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--border);transform:translateX(-50%);z-index:1}
.tl-date{font-size:13px;font-weight:600;color:var(--accent)}
.tl-desc{font-size:13px;color:var(--text2);margin-top:4px}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;display:inline-block;text-align:left;max-width:260px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<h1>📅 时间轴生成器 Timeline Generator</h1>
<button class="toggle-theme" onclick="toggleTheme()">🌙 / ☀️</button>
<div class="container">
<div class="sidebar">
<label>时间轴标题</label>
<input id="title" value="科技发展里程碑" placeholder="标题">
<label>配色方案</label>
<select id="colorScheme">
<option value="rainbow">彩虹色</option>
<option value="warm">暖色系</option>
<option value="cool">冷色系</option>
</select>
<label>事件（每行：日期,标题,描述）</label>
<textarea id="events" rows="10">1969,ARPANET诞生,互联网的前身在美国诞生
1983,TCP/IP协议,互联网标准协议正式确立
1991,万维网,Tim Berners-Lee发明WWW
1998,Google创立,搜索引擎改变信息获取方式
2007,智能手机,iPhone开启移动互联网时代
2010,云计算,企业IT基础设施全面云化
2020,人工智能,AI技术深入各行各业
2024,量子计算,量子优势逐步实现</textarea>
<button class="btn" onclick="renderTimeline()">生成时间轴</button>
<button class="btn btn-outline" onclick="exportPNG()">导出 PNG</button>
</div>
<div class="main"><div class="tl-wrap" id="tlWrap"></div></div>
</div>
<script>
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'}
const colorSets={rainbow:['#e94560','#0969da','#1a7f37','#f5a623','#8250df','#cf222e','#bf8700','#533483'],warm:['#e94560','#f5a623','#cf222e','#ea6045','#d29922'],cool:['#0969da','#533483','#1f6feb','#8250df','#6639ba']};
function renderTimeline(){
const events=document.getElementById('events').value.trim().split('\n').filter(Boolean).map(l=>{
const p=l.split(/[,，]/);return{date:p[0]?.trim(),title:p[1]?.trim(),desc:p[2]?.trim()};
}).filter(e=>e.date);
const cs=document.getElementById('colorScheme').value;
const colors=colorSets[cs];
const title=document.getElementById('title').value;
let html=`<div class="tl-title">${title}</div><div style="position:relative">`;
html+=`<div class="tl-line"></div>`;
events.forEach((e,i)=>{
const c=colors[i%colors.length];const isLeft=i%2===0;
html+=`<div class="tl-item">
${isLeft?`<div class="tl-left"><div class="tl-card"><div class="tl-date" style="color:${c}">${e.date}</div><div style="font-weight:600;margin:4px 0">${e.title}</div><div class="tl-desc">${e.desc||''}</div></div></div><div class="tl-dot" style="background:${c}"></div><div class="tl-right"></div>`
:`<div class="tl-left"></div><div class="tl-dot" style="background:${c}"></div><div class="tl-right"><div class="tl-card"><div class="tl-date" style="color:${c}">${e.date}</div><div style="font-weight:600;margin:4px 0">${e.title}</div><div class="tl-desc">${e.desc||''}</div></div></div>`}
</div>`;
});
html+='</div>';
document.getElementById('tlWrap').innerHTML=html;
}
function exportPNG(){
html2canvas(document.getElementById('tlWrap')).then(canvas=>{
const a=document.createElement('a');a.download='timeline.png';a.href=canvas.toDataURL('image/png');a.click();
}).catch(()=>alert('导出需要 html2canvas 库'));
}
renderTimeline();
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
