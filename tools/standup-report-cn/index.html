<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📢 站会报告</title>
<meta name="description" content="每日站会报告工具，快速记录三件事：昨日完成、今日计划、阻塞问题">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.section-box{border-radius:8px;padding:14px;margin-bottom:12px;border-left:4px solid}
.section-box.done{border-color:var(--green);background:rgba(63,185,80,.05)}
.section-box.plan{border-color:var(--accent);background:rgba(59,130,246,.05)}
.section-box.block{border-color:var(--red);background:rgba(248,81,73,.05)}
.section-box h3{font-size:.95rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid var(--border);font-size:.9rem}
.item:last-child{border-bottom:none}
.remove-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:.85rem}
.add-row{display:flex;gap:6px;margin-top:8px}
.add-row input{margin-bottom:0;flex:1}
.report-item{padding:14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.report-item:hover{background:rgba(59,130,246,.05)}
.report-item:last-child{border-bottom:none}
.report-date{font-size:.8rem;color:var(--text2)}
.empty{text-align:center;color:var(--text2);padding:40px}
.timer-display{text-align:center;font-size:1.2rem;font-weight:700;color:var(--accent);margin:8px 0}
@media(max-width:600px){body{padding:10px}.ctn{max-width:100%}.cd{padding:14px}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📢</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📢 站会报告">
<meta property="og:description" content="每日站会报告工具，快速记录三件事">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/standup-report-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='standup_rpt';
let reports=JSON.parse(localStorage.getItem(STORE)||'[]');
let curView='list',curId=null;
function save(){localStorage.setItem(STORE,JSON.stringify(reports))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toLocaleDateString('zh-CN')}
function render(){
  let h=`<div class="hdr"><h1>📢 站会报告</h1><p>每日站会：昨日完成、今日计划、阻塞问题</p></div>`;
  h+=`<div class="flex" style="justify-content:center;margin-bottom:16px"><button onclick="showNew()">今日站会</button><button class="sec" onclick="curView='list';render()">历史记录</button></div>`;
  h+=`<div id="viewNew" class="${curView==='new'?'':'hidden'}"></div>`;
  h+=`<div id="viewList" class="${curView==='list'?'':'hidden'}"></div>`;
  h+=`<div id="viewDetail" class="${curView==='detail'?'':'hidden'}"></div>`;
  $('app').innerHTML=h;
  if(curView==='new')renderNew();else if(curView==='list')renderList();else renderDetail();
}
function renderNew(){
  let h=`<div class="cd"><h2>今日站会报告</h2>`;
  h+=`<label>姓名</label><input id="sName" placeholder="你的名字">`;
  h+=`<div class="section-box done"><h3>✅ 昨日完成</h3><div id="doneItems"></div>`;
  h+=`<div class="add-row"><input id="doneInput" placeholder="完成的任务..." onkeydown="if(event.key==='Enter')addItem('done')"><button style="padding:6px 12px" onclick="addItem('done')">+</button></div></div>`;
  h+=`<div class="section-box plan"><h3>📋 今日计划</h3><div id="planItems"></div>`;
  h+=`<div class="add-row"><input id="planInput" placeholder="计划的任务..." onkeydown="if(event.key==='Enter')addItem('plan')"><button style="padding:6px 12px" onclick="addItem('plan')">+</button></div></div>`;
  h+=`<div class="section-box block"><h3>🚧 阻塞问题</h3><div id="blockItems"></div>`;
  h+=`<div class="add-row"><input id="blockInput" placeholder="阻塞的问题..." onkeydown="if(event.key==='Enter')addItem('block')"><button style="padding:6px 12px" onclick="addItem('block')">+</button></div></div>`;
  h+=`<div class="bg"><button onclick="saveReport()">提交报告</button><button class="sec" onclick="curView='list';render()">取消</button></div></div>`;
  $('viewNew').innerHTML=h;
  window._items={done:[],plan:[],block:[]};
}
function addItem(type){
  const input=$(type+'Input');const val=input.value.trim();if(!val)return;
  window._items[type].push(val);renderItems(type);input.value='';input.focus();
}
function removeItem(type,idx){window._items[type].splice(idx,1);renderItems(type)}
function renderItems(type){
  let h='';window._items[type].forEach((item,i)=>{
    h+=`<div class="item"><span>${item}</span><button class="remove-btn" onclick="removeItem('${type}',${i})">✕</button></div>`;
  });$(type+'Items').innerHTML=h;
}
function saveReport(){
  const name=$('sName').value.trim()||'匿名';
  reports.push({id:uid(),name,date:today(),done:[...window._items.done],plan:[...window._items.plan],block:[...window._items.block],createdAt:new Date().toISOString()});
  save();curView='list';render();
}
function renderList(){
  let h=`<div class="cd">`;
  if(!reports.length){h+=`<p class="empty">暂无站会报告</p>`}
  reports.slice().reverse().forEach(r=>{
    h+=`<div class="report-item" onclick="viewReport('${r.id}')">`;
    h+=`<div class="flex-between"><b>${r.name}</b><span class="report-date">${r.date}</span></div>`;
    h+=`<div style="font-size:.85rem;color:var(--text2);margin-top:4px">完成${r.done.length}项 · 计划${r.plan.length}项 · 阻塞${r.block.length}项</div></div>`;
  });
  h+=`</div>`;$('viewList').innerHTML=h;
}
function viewReport(id){curId=id;curView='detail';render()}
function delReport(id){if(!confirm('确定删除?'))return;reports=reports.filter(r=>r.id!==id);save();curView='list';render()}
function renderDetail(){
  const r=reports.find(x=>x.id===curId);if(!r){curView='list';render();return}
  let h=`<div class="cd"><div class="flex-between"><h2>${r.name}的站会</h2><span class="report-date">${r.date}</span></div>`;
  const sections=[{key:'done',icon:'✅',label:'昨日完成',cls:'done'},{key:'plan',icon:'📋',label:'今日计划',cls:'plan'},{key:'block',icon:'🚧',label:'阻塞问题',cls:'block'}];
  sections.forEach(sec=>{
    h+=`<div class="section-box ${sec.cls}"><h3>${sec.icon} ${sec.label} (${r[sec.key].length})</h3>`;
    if(!r[sec.key].length)h+=`<p style="font-size:.85rem;color:var(--text2)">无</p>`;
    r[sec.key].forEach(item=>{h+=`<div class="item"><span>${item}</span></div>`});
    h+=`</div>`;
  });
  h+=`<div class="bg"><button class="sec" onclick="curView='list';render()">返回</button><button class="dng" onclick="delReport('${r.id}')">删除</button></div></div>`;
  $('viewDetail').innerHTML=h;
}
function showNew(){curView='new';render()}
render();
</script>
</body>
</html>
