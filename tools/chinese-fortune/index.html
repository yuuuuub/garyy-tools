@media(max-width:480px){body{padding:12px}.hunli-grid{grid-template-columns:1fr}}

<div class="container">

<script>
var tianGan=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var diZhi=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var shengXiao=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
var shengXiaoIcon=['🐀','🐂','🐅','🐇','🐉','🐍','🐴','🐑','🐒','🐓','🐕','🐖'];
var wuxingGan=['木','木','火','火','土','土','金','金','水','水'];
var wuxingZhi=['水','土','木','木','土','火','火','土','金','金','土','水'];
var jianChu12=['建','除','满','平','定','执','破','危','成','收','开','闭'];
var daysOfWeek=['日','一','二','三','四','五','六'];

document.getElementById('hlDate').value=new Date().toISOString().split('T')[0];

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  event.target.classList.add('active');
  document.getElementById('huangli-panel').style.display=tab==='huangli'?'block':'none';
  document.getElementById('mingzi-panel').style.display=tab==='mingzi'?'block':'none';
  document.getElementById('shengxiao-panel').style.display=tab==='shengxiao'?'block':'none';
}

// 黄历
var yiItems=[
  '嫁娶','纳采','订盟','祭祀','祈福','求嗣','开光','出行','解除','伐木',
  '进人口','交易','立券','入宅','移徙','安床','栽种','纳畜','动土','修造',
  '盖屋','造畜稠','牧养','上梁','竖柱','安门','造车器','造桥','开池','掘井',
  '求医','治病','会亲友','拆卸','修坟','安葬','启攒','破土','除服','成服'
];
var jiItems=[
  '开市','造屋','作灶','入宅','移徙','安葬','行丧','出行','动土','破土',
  '针灸','伐木','修造','嫁娶','纳采','开光','祈福','求嗣','上梁','栽种'
];

function showHuangli(){
  var dateStr=document.getElementById('hlDate').value;
  if(!dateStr){alert('请选择日期');return;}
  var d=new Date(dateStr+'T12:00:00');
  var year=d.getFullYear();
  var month=d.getMonth()+1;
  var day=d.getDate();
  var dow=d.getDay();
  
  var yearGan=(year-4)%10;var yearZhi=(year-4)%12;
  var monthGan=(yearGan*2+month)%10;var monthZhi=(month+1)%12;
  var dayGanIdx=(year*5+Math.floor(year/4)+9*month+day+15)%10;
  if(dayGanIdx<0)dayGanIdx+=10;
  dayGanIdx=Math.floor(dayGanIdx)%10;
  var dayZhiIdx=Math.floor((dayGanIdx+2*monthZhi)%12);
  if(dayZhiIdx<0)dayZhiIdx+=12;
  
  var jianIdx=(month*2+day)%12;
  
  // 随机生成宜忌（基于日期种子）
  var seed=year*10000+month*100+day;
  var rng=function(){seed=(seed*9301+49297)%233280;return seed/233280;};
  var yi=[];var ji=[];
  var usedYi={};var usedJi={};
  while(yi.length<6){var idx=Math.floor(rng()*yiItems.length);if(!usedYi[idx]){usedYi[idx]=1;yi.push(yiItems[idx]);}}
  while(ji.length<4){var idx=Math.floor(rng()*jiItems.length);if(!usedJi[idx]){usedJi[idx]=1;ji.push(jiItems[idx]);}}
  
  var html='<div class="card">';
  html+='<div style="text-align:center;margin-bottom:12px">';
  html+='<div style="font-size:2rem;margin-bottom:4px">📅</div>';
  html+='<div style="font-size:1.3rem;font-weight:700">'+year+'年'+month+'月'+day+'日</div>';
  html+='<div style="font-size:.9rem;color:var(--text2)">星期'+daysOfWeek[dow]+' · 农历'+tianGan[yearGan]+diZhi[yearZhi]+'年</div>';
  html+='</div>';
  
  html+='<div style="display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap">';
  html+='<span class="tag tag-blue">'+tianGan[dayGanIdx]+diZhi[dayZhiIdx]+'日</span>';
  html+='<span class="tag tag-purple">'+jianChu12[jianIdx]+'日</span>';
  html+='<span class="tag tag-gold">'+shengXiaoIcon[yearZhi]+shengXiao[yearZhi]+'年</span>';
  html+='</div>';
  
  html+='<div class="hunli-grid">';
  html+='<div class="hunli-item good"><div class="icon">✅</div><div style="font-weight:600;margin-bottom:6px">宜</div>';
  yi.forEach(function(y){html+='<span class="tag tag-green">'+y+'</span> ';});
  html+='</div>';
  html+='<div class="hunli-item bad"><div class="icon">❌</div><div style="font-weight:600;margin-bottom:6px">忌</div>';
  ji.forEach(function(j){html+='<span class="tag tag-red">'+j+'</span> ';});
  html+='</div></div>';
  
  html+='<div style="margin-top:12px;padding:10px;background:var(--bg);border-radius:8px;font-size:.85rem;color:var(--text2)">';
  html+='<strong>💡 温馨提示：</strong>黄历宜忌仅供参考，做事还需结合实际情况，心诚则灵。';
  html+='</div></div>';
  
  document.getElementById('hlResult').innerHTML=html;
}

// 姓名测试
var strokeData={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,
'王':4,'李':7,'张':7,'刘':6,'陈':7,'杨':7,'赵':4,'黄':6,'周':8,'吴':7,
'徐':6,'孙':6,'马':3,'胡':9,'朱':6,'高':10,'林':8,'何':7,'郭':10,'郑':8,
'梁':11,'罗':8,'宋':7,'谢':12,'韩':12,'唐':10,'冯':5,'于':3,'董':12,'萧':11,
'程':12,'曹':11,'袁':10,'邓':4,'许':6,'傅':12,'沈':8,'曾':12,'彭':12,'吕':6,
'苏':7,'卢':5,'蒋':12,'蔡':14,'贾':10,'丁':2,'魏':17,'薛':16,'叶':5,'阎':11,
'余':7,'潘':15,'杜':7,'戴':15,'夏':10,'钟':9,'汪':7,'田':5,'任':6,'姜':9,
'范':8,'方':4,'石':5,'姚':9,'谭':14,'廖':14,'邹':12,'熊':14,'金':8,'陆':11,
'郝':9,'孔':4,'白':5,'崔':11,'康':11,'毛':4,'邱':7,'秦':10,'江':6,'史':5,
'顾':10,'侯':9,'邵':7,'孟':8,'龙':16,'万':3,'段':7,'雷':13,'钱':10,'汤':12,
'尹':4,'黎':15,'易':8,'常':11,'武':8,'乔':6,'贺':9,'赖':16,'龚':11,'文':4,
'大':3,'小':3,'中':4,'上':3,'下':3,'天':4,'人':2,'子':3,'女':3,'明':8,
'月':4,'日':4,'水':4,'火':4,'木':4,'金':8,'土':3,'山':3,'风':4,'云':4,
'花':7,'草':9,'树':16,'鸟':5,'鱼':8,'龙':16,'虎':8,'凤':4,'星':9,'雪':11,
'春':9,'夏':10,'秋':9,'冬':5,'东':5,'西':6,'南':9,'北':5,'中':4,'和':8,
'美':9,'好':6,'心':4,'爱':10,'情':11,'思':9,'梦':11,'真':10,'善':12,'慧':15,
'文':4,'武':8,'智':12,'勇':9,'仁':4,'义':3,'礼':5,'信':9,'忠':8,'孝':7};

function getStrokes(ch){
  if(strokeData[ch])return strokeData[ch];
  var code=ch.charCodeAt(0);
  return (code%15)+1;
}

function getWuxing(strokes){
  var wx=['木','火','土','金','水'];
  return wx[(strokes-1)%5];
}

var wuxingColors={'木':'#22c55e','火':'#ef4444','土':'#f59e0b','金':'#e5e7eb','水':'#3b82f6'};
var wuxingDesc={
  '木':'仁慈正直，有领导力，适合教育、文化行业',
  '火':'热情开朗，有感染力，适合传媒、演艺行业',
  '土':'稳重踏实，有耐心，适合房产、管理行业',
  '金':'果断刚毅，有决断力，适合金融、法律行业',
  '水':'聪明灵活，有洞察力，适合贸易、创意行业'
};

function testMingzi(){
  var name=document.getElementById('mzName').value.trim();
  if(!name){alert('请输入姓名');return;}
  
  var chars=[];
  var totalStrokes=0;
  var wxCount={'木':0,'火':0,'土':0,'金':0,'水':0};
  
  for(var i=0;i<name.length;i++){
    var s=getStrokes(name[i]);
    var w=getWuxing(s);
    wxCount[w]++;
    totalStrokes+=s;
    chars.push({ch:name[i],stroke:s,wuxing:w});
  }
  
  // 天格/人格/地格/总格
  var tianGe=chars.length>0?chars[0].stroke+1:0;
  var renGe=chars.length>=2?chars[0].stroke+chars[1].stroke:tianGe;
  var diGe=chars.length>=2?chars[1].stroke+chars[2]?.stroke||chars[1].stroke:0;
  var zongGe=totalStrokes;
  
  // 五格吉凶
  var ji凶=function(n){var r=n%10;return(r===0||r===1||r===3||r===5||r===6||r===8)?'吉':'凶';};
  
  var totalScore=0;
  chars.forEach(function(c){totalScore+=c.stroke*8+15;});
  totalScore=Math.min(100,Math.round(totalScore/chars.length));
  var fortune=totalScore>=90?'大吉':totalScore>=75?'吉':totalScore>=60?'中吉':totalScore>=45?'小吉':'末吉';
  var fortuneColor=totalScore>=75?'tag-green':totalScore>=50?'tag-gold':'tag-red';
  
  var html='<div class="card">';
  html+='<h3 style="text-align:center;font-size:1.2rem;margin-bottom:12px">📊 姓名分析报告</h3>';
  
  html+='<div style="text-align:center;margin-bottom:12px">';
  html+='<span style="font-size:1.5rem;font-weight:700">'+name+'</span>';
  html+='<span class="tag '+fortuneColor+'" style="margin-left:8px">'+fortune+' '+totalScore+'分</span>';
  html+='</div>';
  
  html+='<div class="result"><h3>字画分析</h3>';
  html+='<table style="width:100%;border-collapse:collapse;margin-top:8px">';
  html+='<tr style="border-bottom:1px solid var(--border)"><td style="padding:6px;width:33%">汉字</td><td style="padding:6px;width:33%">笔画</td><td style="padding:6px;width:33%">五行</td></tr>';
  chars.forEach(function(c){
    html+='<tr style="border-bottom:1px solid var(--border)"><td style="padding:6px;text-align:center;font-size:1.1rem">'+c.ch+'</td><td style="padding:6px;text-align:center">'+c.stroke+'画</td><td style="padding:6px;text-align:center"><span style="color:'+wuxingColors[c.wuxing]+';font-weight:600">'+c.wuxing+'</span></td></tr>';
  });
  html+='</table></div>';
  
  html+='<div class="result"><h3>五行分布</h3>';
  html+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">';
  var wxList=['木','火','土','金','水'];
  wxList.forEach(function(w){
    var c=wxCount[w]||0;
    var opacity=Math.max(0.3,c/chars.length);
    html+='<span style="background:'+wuxingColors[w]+Math.round(opacity*255).toString(16).padStart(2,'0')+';color:'+wuxingColors[w]+';padding:6px 14px;border-radius:8px;font-weight:600;border:1px solid '+wuxingColors[w]+'44">'+w+' '+c+'</span>';
  });
  html+='</div>';
  
  var dominantWx=wxList.reduce(function(a,b){return(wxCount[a]||0)>=(wxCount[b]||0)?a:b;});
  html+='<p style="font-size:.85rem;color:var(--text2);margin-top:10px">主属<strong style="color:'+wuxingColors[dominantWx]+'">'+dominantWx+'</strong> — '+wuxingDesc[dominantWx]+'</p>';
  html+='</div>';
  
  html+='<div class="result"><h3>五格剖象</h3>';
  html+='<table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:.88rem">';
  html+='<tr style="border-bottom:1px solid var(--border)"><td style="padding:6px">天格</td><td style="padding:6px">'+tianGe+'</td><td style="padding:6px"><span class="tag '+(ji凶(tianGe)==='吉'?'tag-green':'tag-red')+'">'+ji凶(tianGe)+'</span></td><td style="padding:6px;color:var(--text2)">先天运</td></tr>';
  html+='<tr style="border-bottom:1px solid var(--border)"><td style="padding:6px">人格</td><td style="padding:6px">'+renGe+'</td><td style="padding:6px"><span class="tag '+(ji凶(renGe)==='吉'?'tag-green':'tag-red')+'">'+ji凶(renGe)+'</span></td><td style="padding:6px;color:var(--text2)">主运</td></tr>';
  html+='<tr style="border-bottom:1px solid var(--border)"><td style="padding:6px">地格</td><td style="padding:6px">'+diGe+'</td><td style="padding:6px"><span class="tag '+(ji凶(diGe)==='吉'?'tag-green':'tag-red')+'">'+ji凶(diGe)+'</span></td><td style="padding:6px;color:var(--text2)">前运</td></tr>';
  html+='<tr><td style="padding:6px">总格</td><td style="padding:6px">'+zongGe+'</td><td style="padding:6px"><span class="tag '+(ji凶(zongGe)==='吉'?'tag-green':'tag-red')+'">'+ji凶(zongGe)+'</span></td><td style="padding:6px;color:var(--text2)">后运</td></tr>';
  html+='</table></div>';
  
  html+='<div style="margin-top:10px;padding:10px;background:var(--bg);border-radius:8px;font-size:.85rem;color:var(--text2)">';
  html+='💡 姓名测试仅供娱乐参考，真正的人生掌握在自己手中。';
  html+='</div></div>';
  
  document.getElementById('mzResult').innerHTML=html;
}

// 生肖运势
