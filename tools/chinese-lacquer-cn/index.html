<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国漆器鉴赏</title><meta name="description" content="中国漆器鉴赏 - 在线了解中国漆器艺术"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a017;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .2s}.item:hover{transform:translateY(-2px)}.item-title{font-size:1.2rem;font-weight:600;color:var(--gold);margin-bottom:8px}.item-meta{font-size:.9rem;color:var(--text2);margin-bottom:4px}.item-display{font-size:3rem;text-align:center;padding:30px;background:var(--bg);border-radius:8px;margin-bottom:12px;min-height:100px;display:flex;align-items:center;justify-content:center}.item-desc{font-size:.9rem;color:var(--text)}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .2s}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;position:relative}.modal h2{color:var(--gold);margin-bottom:12px}.modal p{color:var(--text2);line-height:1.8;margin-bottom:12px}.close-btn{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer}.theme-toggle{position:fixed;top:8px;right:80px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;color:var(--text);font-size:.75rem}</style><meta property="og:title" content="中国漆器鉴赏"><meta property="og:description" content="中国漆器鉴赏 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🟥</text></svg>"></head><body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🟥 中国漆器鉴赏</h1><p class="sub">在线了解中国漆器艺术</p>
<div class="card"><div class="search-box"><input type="text" id="searchInput" placeholder="搜索漆器名称..." oninput="filterItems()"></div>
<div class="btn-group"><button class="btn active" onclick="filterByType('all',this)">全部</button><button class="btn" onclick="filterByType('雕漆',this)">雕漆</button><button class="btn" onclick="filterByType('螺钿',this)">螺钿</button><button class="btn" onclick="filterByType('金银平脱',this)">金银平脱</button><button class="btn" onclick="filterByType('彩绘',this)">彩绘漆器</button><button class="btn" onclick="filterByType('戗金',this)">戗金</button></div></div>
<div id="itemList"></div></div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="close-btn" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><div id="modalDisplay" class="item-display"></div><p id="modalMeta"></p><p id="modalDesc"></p><p id="modalDetail" style="padding-top:12px;border-top:1px solid var(--border);margin-top:8px"></p></div></div>
<script src="../i18n.js" defer></script>
<script>
var items=[
  {title:'元剔红栀子花纹圆盘',type:'雕漆',emoji:'🔴',desc:'元代雕漆的代表作，漆层厚实，雕刻精细，栀子花纹栩栩如生。是元代张成的代表作品。',detail:'雕漆是在器胎上涂漆数十层甚至上百层，待漆干后在漆层上雕刻花纹的工艺。元代是雕漆的鼎盛时期，张成、杨茂是当时的名家。'},
  {title:'唐螺钿紫檀五弦琵琶',type:'螺钿',emoji:'🎵',desc:'唐代螺钿工艺的巅峰之作，用贝壳、玳瑁等镶嵌成精美图案，是日本正仓院的镇馆之宝。',detail:'螺钿是将贝壳、鲍鱼壳等磨成薄片，镶嵌在漆器或木器表面的装饰工艺。唐代螺钿工艺达到极高水平。'},
  {title:'汉马王堆漆棺',type:'彩绘',emoji:'⚰️',desc:'西汉马王堆出土的彩绘漆棺，色彩鲜艳，图案神秘，展现了汉代漆器的高超技艺。',detail:'马王堆汉墓出土了大量漆器，其中彩绘漆棺最为壮观。棺上绘有云气、神兽等图案，色彩历经两千多年依然鲜艳。'},
  {title:'明剔红龙纹方盒',type:'雕漆',emoji:'📦',desc:'明代永乐时期的雕漆精品，漆层肥厚，龙纹雕刻生动有力，是宫廷御用漆器。',detail:'明代雕漆继承了元代的传统，永乐、宣德时期的果园厂是皇家漆器作坊，生产了大量精品。'},
  {title:'金银平脱镜盒',type:'金银平脱',emoji:'🪞',desc:'唐代金银平脱漆器的代表，将金银片嵌入漆面，打磨后与漆面齐平，工艺精湛。',detail:'金银平脱是在漆器表面嵌入金银薄片，再涂漆打磨，使金银图案与漆面平齐的工艺。唐代此工艺达到顶峰。'},
  {title:'南宋戗金花卉纹漆盒',type:'戗金',emoji:'✨',desc:'南宋戗金漆器的精品，在漆面上刻出花纹后填入金粉，金碧辉煌。',detail:'戗金是在漆面上用针或刀刻出花纹，再在刻痕中填入金粉或金箔的工艺。此工艺始于南宋，盛于明清。'},
  {title:'清乾隆剔彩山水人物笔筒',type:'雕漆',emoji:'🏔️',desc:'清代乾隆时期的雕漆杰作，多色漆层交替，雕刻出精美的山水人物图案。',detail:'剔彩是在器胎上涂多种颜色的漆层，雕刻时根据图案需要剔去不同颜色的漆层，呈现出多彩的图案。'},
  {title:'战国曾侯乙漆棺',type:'彩绘',emoji:'🐉',desc:'战国时期的彩绘漆棺，绘有精美的龙凤纹样，是先秦漆器的代表作品。',detail:'曾侯乙墓出土了大量漆器，其中漆棺上绘有复杂的龙凤、武士等图案，色彩鲜艳，构图严谨。'},
  {title:'元螺钿花卉纹漆盘',type:'螺钿',emoji:'🌺',desc:'元代螺钿漆器的精品，用贝壳镶嵌出精美的花卉图案，工艺精湛。',detail:'元代螺钿工艺在唐代基础上有所发展，螺片更薄，镶嵌更精细，图案更加繁复。'},
  {title:'明黑漆描金山水屏风',type:'戗金',emoji:'🖼️',desc:'明代宫廷漆器，黑漆为底，描金山水图案，金碧辉煌，气势恢宏。',detail:'描金是在漆面上用金粉或金泥描绘图案的工艺。明代宫廷漆器多采用此工艺，效果华贵典雅。'},
  {title:'清雕填花鸟纹漆盒',type:'雕漆',emoji:'🐦',desc:'清代雕填漆器的代表，将雕漆与填漆工艺结合，色彩丰富，图案精美。',detail:'雕填是将雕刻与填色相结合的漆器工艺，在雕刻的花纹中填入不同颜色的漆料，使图案更加生动。'},
  {title:'汉漆耳杯',type:'彩绘',emoji:'🍶',desc:'汉代最常用的漆器，黑红两色，造型优美，是汉代漆器的典型代表。',detail:'耳杯是汉代最流行的饮酒器，因两侧有把手如耳而得名。汉代漆耳杯多为木胎，外髹黑漆，内涂朱漆。'}
];
var currentType='all';
function renderItems(list){
  var el=document.getElementById('itemList');
  var html='';
  list.forEach(function(p,i){
    html+='<div class="item" onclick="showDetail('+items.indexOf(p)+')">';
    html+='<div class="item-title">'+p.emoji+' '+p.title+'</div>';
    html+='<div class="item-meta">'+p.type+'</div>';
    html+='<div class="item-display">'+p.emoji+'</div>';
    html+='<div class="item-desc">'+p.desc.substring(0,60)+'...</div>';
    html+='</div>';
  });
  el.innerHTML=html||'<div class="card" style="text-align:center;color:var(--text2)">未找到匹配的漆器</div>';
}
function filterItems(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=items.filter(function(p){return(p.title.includes(q)||p.desc.includes(q))&&(currentType==='all'||p.type===currentType);});
  renderItems(filtered);
}
function filterByType(type,btn){
  currentType=type;
  document.querySelectorAll('.btn-group .btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterItems();
}
function showDetail(i){
  var p=items[i];
  document.getElementById('modalTitle').textContent=p.title;
  document.getElementById('modalDisplay').textContent=p.emoji;
  document.getElementById('modalMeta').textContent=p.type;
  document.getElementById('modalDesc').textContent=p.desc;
  document.getElementById('modalDetail').textContent=p.detail;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='light'?'dark':'light');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
renderItems(items);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
