<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花园规划器 v2</title>
<meta property="og:title" content="花园规划器 v2">
<meta property="og:description" content="花园规划器 v2 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="可视化花园规划工具，拖拽布局、分区管理、种植日历，打造你的梦想花园">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌻</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0757b5;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grid-area{position:relative;width:100%;aspect-ratio:2/1;background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:crosshair}
.zone{position:absolute;border:2px dashed;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);cursor:move;transition:opacity .2s}
.zone:hover{opacity:.85}
.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.palette .swatch{width:32px;height:32px;border-radius:6px;border:2px solid transparent;cursor:pointer;transition:border-color .2s}
.palette .swatch.active{border-color:var(--text)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:.8rem;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:12px;height:12px;border-radius:3px}
.tab-bar{display:flex;gap:4px;margin-bottom:16px}
.tab-bar button{flex:1;padding:8px;background:var(--bg);border:1px solid var(--border);color:var(--text2);border-radius:8px;font-size:.85rem}
.tab-bar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.hidden{display:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🌻 花园规划器 v2</h1><p>可视化布局 · 分区管理 · 种植日历</p></div>

<div class="tab-bar">
<button class="active" onclick="showTab('layout')">布局设计</button>
<button onclick="showTab('zones')">分区管理</button>
<button onclick="showTab('calendar')">种植日历</button>
<button onclick="showTab('stats')">数据统计</button>
</div>

<div id="tab-layout" class="cd">
<h2>花园布局</h2>
<p style="font-size:.85rem;color:var(--text2);margin-bottom:12px">选择颜色后在画布上拖拽绘制分区</p>
<div class="palette" id="palette"></div>
<div class="grid-area" id="gardenCanvas" onmousedown="startDraw(event)" onmousemove="drawing(event)" onmouseup="endDraw()" onmouseleave="endDraw()"></div>
<div class="legend" id="legend"></div>
<div class="bg" style="margin-top:12px">
<button onclick="clearCanvas()">清空画布</button>
<button class="sec" onclick="saveLayout()">保存布局</button>
</div>
</div>

<div id="tab-zones" class="cd hidden">
<h2>分区管理</h2>
<div class="fr">
<div><label>分区名称</label><input type="text" id="zName" placeholder="例：蔬菜区"></div>
<div><label>植物种类</label><input type="text" id="zPlant" placeholder="番茄、黄瓜等"></div>
</div>
<div class="fr">
<div><label>面积(㎡)</label><input type="number" id="zArea" placeholder="面积"></div>
<div><label>土壤类型</label><select id="zSoil"><option>壤土</option><option>砂土</option><option>黏土</option><option>腐殖土</option></select></div>
</div>
<label>备注</label><textarea id="zNote" placeholder="光照、排水等信息"></textarea>
<div class="bg"><button onclick="addZone()">添加分区</button></div>
<div id="zoneList" class="es">暂无分区</div>
</div>

<div id="tab-calendar" class="cd hidden">
<h2>种植日历</h2>
<div class="fr">
<div><label>植物名称</label><input type="text" id="cPlant" placeholder="植物名称"></div>
<div><label>操作类型</label><select id="cAction"><option>播种</option><option>定植</option><option>施肥</option><option>修剪</option><option>采收</option></select></div>
</div>
<div class="fr">
<div><label>开始日期</label><input type="date" id="cStart"></div>
<div><label>结束日期</label><input type="date" id="cEnd"></div>
</div>
<label>备注</label><input type="text" id="cNote" placeholder="补充说明">
<div class="bg"><button onclick="addCalendar()">添加日程</button></div>
<div id="calendarList" class="es">暂无日程</div>
</div>

<div id="tab-stats" class="cd hidden">
<h2>数据统计</h2>
<div id="statsContent"></div>
</div>
</div>

<script>
const ZONES_DB='garden_planner_v2_zones';
const CAL_DB='garden_planner_v2_cal';
const LAYOUT_DB='garden_planner_v2_layout';
let zones=JSON.parse(localStorage.getItem(ZONES_DB)||'[]');
let cals=JSON.parse(localStorage.getItem(CAL_DB)||'[]');
let layout=JSON.parse(localStorage.getItem(LAYOUT_DB)||'[]');

const ZONE_COLORS=['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316'];
let selColor=ZONE_COLORS[0];
let drawing=false, startPt=null, curZone=null;

function showTab(t){
  document.querySelectorAll('.tab-bar button').forEach((b,i)=>b.classList.toggle('active',b.textContent.includes({layout:'布局',zones:'分区',calendar:'日历',stats:'统计'}[t])));
  ['layout','zones','calendar','stats'].forEach(id=>document.getElementById('tab-'+id).classList.toggle('hidden',id!==t));
  if(t==='stats') renderStats();
}

// Palette
(function initPalette(){
  const p=document.getElementById('palette');
  ZONE_COLORS.forEach((c,i)=>{
    const s=document.createElement('div');
    s.className='swatch'+(i===0?' active':'');
    s.style.background=c;
    s.onclick=()=>{document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));s.classList.add('active');selColor=c;};
    p.appendChild(s);
  });
})();

// Canvas drawing
function getPos(e){const r=document.getElementById('gardenCanvas').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,width:r.width,height:r.height}}
function startDraw(e){drawing=true;startPt=getPos(e);curZone=document.createElement('div');curZone.className='zone';curZone.style.borderColor=selColor;curZone.style.background=selColor+'33';document.getElementById('gardenCanvas').appendChild(curZone)}
function drawing(e){if(!drawing||!curZone)return;const p=getPos(e);const x=Math.min(startPt.x,p.x),y=Math.min(startPt.y,p.y);const w=Math.abs(p.x-startPt.x),h=Math.abs(p.y-startPt.y);curZone.style.left=x+'px';curZone.style.top=y+'px';curZone.style.width=w+'px';curZone.style.height=h+'px';curZone.style.background=selColor+'44'}
function endDraw(){
  if(!drawing)return;drawing=false;
  if(curZone&&parseFloat(curZone.style.width)>10){
    const name=prompt('分区名称：','分区'+(layout.length+1));
    if(name){curZone.textContent=name;layout.push({name,color:selColor,left:curZone.style.left,top:curZone.style.top,width:curZone.style.width,height:curZone.style.height})}
    else curZone.remove();
  }else if(curZone)curZone.remove();
  curZone=null;saveLayout();renderLegend();
}
function saveLayout(){localStorage.setItem(LAYOUT_DB,JSON.stringify(layout));renderLayout()}
function renderLayout(){
  const c=document.getElementById('gardenCanvas');c.innerHTML='';
  layout.forEach(z=>{
    const d=document.createElement('div');d.className='zone';d.textContent=z.name;d.style.borderColor=z.color;d.style.background=z.color+'44';
    d.style.left=z.left;d.style.top=z.top;d.style.width=z.width;d.style.height=z.height;
    d.ondblclick=()=>{if(confirm('删除分区 '+z.name+'？')){layout=layout.filter(x=>x!==z);saveLayout();renderLayout();renderLegend()}}
    c.appendChild(d);
  });renderLegend();
}
function renderLegend(){
  const l=document.getElementById('legend');l.innerHTML='';
  layout.forEach(z=>{l.innerHTML+=`<span><span class="dot" style="background:${z.color}"></span>${z.name}</span>`});
}
function clearCanvas(){if(confirm('清空所有分区？')){layout=[];saveLayout();renderLayout()}}
renderLayout();

// Zones
function addZone(){
  const n=document.getElementById('zName').value.trim(),pl=document.getElementById('zPlant').value.trim(),a=document.getElementById('zArea').value,s=document.getElementById('zSoil').value,note=document.getElementById('zNote').value.trim();
  if(!n)return alert('请输入分区名称');
  zones.push({name:n,plants:pl,area:a,soil:s,note,date:new Date().toLocaleDateString()});
  localStorage.setItem(ZONES_DB,JSON.stringify(zones));
  ['zName','zPlant','zArea','zNote'].forEach(id=>document.getElementById(id).value='');
  renderZones();
}
function renderZones(){
  const el=document.getElementById('zoneList');
  if(!zones.length){el.innerHTML='<div class="es">暂无分区</div>';return}
  el.innerHTML=zones.map((z,i)=>`<div class="li" style="flex-direction:column;align-items:stretch">
    <div><strong>${z.name}</strong> <span class="tag">${z.soil}</span> <span class="tag s">${z.area}㎡</span></div>
    <div style="font-size:.85rem;color:var(--text2)">植物：${z.plants||'未设置'} ${z.note?'| '+z.note:''}</div>
    <div class="bg"><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="zones.splice(${i},1);localStorage.setItem('${ZONES_DB}',JSON.stringify(zones));renderZones()">删除</button></div>
  </div>`).reverse().join('');
}
renderZones();

// Calendar
function addCalendar(){
  const p=document.getElementById('cPlant').value.trim(),a=document.getElementById('cAction').value,s=document.getElementById('cStart').value,e=document.getElementById('cEnd').value,note=document.getElementById('cNote').value.trim();
  if(!p||!s)return alert('请填写植物名称和开始日期');
  cals.push({plant:p,action:a,start:s,end:e||s,note});
  localStorage.setItem(CAL_DB,JSON.stringify(cals));
  ['cPlant','cStart','cEnd','cNote'].forEach(id=>document.getElementById(id).value='');
  renderCal();
}
function renderCal(){
  const el=document.getElementById('calendarList');
  if(!cals.length){el.innerHTML='<div class="es">暂无日程</div>';return}
  const actionColors={播种:'s',定植:'',施肥:'w',修剪:'d',采收:'s'};
  el.innerHTML=cals.map((c,i)=>`<div class="li" style="flex-direction:column;align-items:stretch">
    <div><span class="tag ${actionColors[c.action]||''}">${c.action}</span> <strong>${c.plant}</strong> <span class="tag">${c.start}~${c.end}</span></div>
    ${c.note?'<div style="font-size:.85rem;color:var(--text2)">'+c.note+'</div>':''}
    <div class="bg"><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="cals.splice(${i},1);localStorage.setItem('${CAL_DB}',JSON.stringify(cals));renderCal()">删除</button></div>
  </div>`).reverse().join('');
}
renderCal();

// Stats
function renderStats(){
  const soilCounts={};zones.forEach(z=>{soilCounts[z.soil]=(soilCounts[z.soil]||0)+1});
  const totalArea=zones.reduce((s,z)=>s+parseFloat(z.area||0),0);
  const actionCounts={};cals.forEach(c=>{actionCounts[c.action]=(actionCounts[c.action]||0)+1});
  document.getElementById('statsContent').innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:20px">
      <div style="text-align:center;padding:16px;background:var(--bg);border-radius:8px"><div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${zones.length}</div><div style="font-size:.8rem;color:var(--text2)">分区数</div></div>
      <div style="text-align:center;padding:16px;background:var(--bg);border-radius:8px"><div style="font-size:1.5rem;font-weight:700;color:var(--success)">${totalArea.toFixed(1)}</div><div style="font-size:.8rem;color:var(--text2)">总面积(㎡)</div></div>
      <div style="text-align:center;padding:16px;background:var(--bg);border-radius:8px"><div style="font-size:1.5rem;font-weight:700;color:var(--warn)">${cals.length}</div><div style="font-size:.8rem;color:var(--text2)">日程数</div></div>
      <div style="text-align:center;padding:16px;background:var(--bg);border-radius:8px"><div style="font-size:1.5rem;font-weight:700;color:var(--danger)">${layout.length}</div><div style="font-size:.8rem;color:var(--text2)">布局分区</div></div>
    </div>
    <h3 style="font-size:.95rem;margin-bottom:8px">土壤类型分布</h3>
    ${Object.entries(soilCounts).map(([k,v])=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="width:60px;font-size:.85rem">${k}</span><div style="flex:1;height:20px;background:var(--bg);border-radius:4px;overflow:hidden"><div style="width:${v/zones.length*100}%;height:100%;background:var(--accent);border-radius:4px"></div></div><span style="font-size:.85rem;color:var(--text2)">${v}</span></div>`).join('')||'<div style="color:var(--text2);font-size:.85rem">暂无数据</div>'}
    <h3 style="font-size:.95rem;margin:16px 0 8px">操作类型统计</h3>
    ${Object.entries(actionCounts).map(([k,v])=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="width:60px;font-size:.85rem">${k}</span><div style="flex:1;height:20px;background:var(--bg);border-radius:4px;overflow:hidden"><div style="width:${v/cals.length*100}%;height:100%;background:var(--success);border-radius:4px"></div></div><span style="font-size:.85rem;color:var(--text2)">${v}</span></div>`).join('')||'<div style="color:var(--text2);font-size:.85rem">暂无数据</div>'}
  `;
}
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
