<script>
(function() {
  const canvas = document.getElementById('puzzleCanvas');
  const ctx = canvas.getContext('2d');
  const moveCountEl = document.getElementById('moveCount');
  const timerDisplayEl = document.getElementById('timerDisplay');
  const winOverlay = document.getElementById('winOverlay');
  const winStatsEl = document.getElementById('winStats');
  const btnPreview = document.getElementById('btnPreview');
  const btnNewGame = document.getElementById('btnNewGame');
  const btnPlayAgain = document.getElementById('btnPlayAgain');
  const difficultyGroup = document.getElementById('difficultyGroup');
  const CANVAS_SIZE = 500;
  canvas.width = CANVAS_SIZE;
  canvas.height = CANVAS_SIZE;
  let state = {
    gridSize: 3,
    pieces: [],
    fullCanvas: null,
    selectedIndex: -1,
    moves: 0,
    timerStarted: false,
    startTime: 0,
    elapsedSeconds: 0,
    timerInterval: null,
    isComplete: false,
    showPreview: false,
    gradientType: 0,
    confettiParticles: [],
    confettiAnimId: null,
  };
  const colorPalettes = [
    ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd'],
    ['#ff9a9e', '#fecfef', '#a1c4fd', '#c2e9fb', '#fbc2eb', '#8fd3f4'],
    ['#ffecd2', '#fcb69f', '#ff9a9e', '#fad0c4', '#ffd1ff', '#a18cd1'],
    ['#fa709a', '#fee140', '#30cfd0', '#6c5ce7', '#a29bfe', '#fd79a8'],
    ['#f77062', '#fe5196', '#43e97b', '#38f9d7', '#667eea', '#764ba2'],
    ['#ff0844', '#ffb199', '#00b4db', '#0083b0', '#8e2de2', '#4a00e0'],
    ['#ffd89b', '#19547b', '#e96443', '#904e95', '#11998e', '#38ef7d'],
    ['#d299c2', '#fef9d7', '#89f7fe', '#66a6ff', '#f093fb', '#f5576c'],
  ];
  function randomPalette() {
    return colorPalettes[Math.floor(Math.random() * colorPalettes.length)];
  }
  function generateGradient(canvas, type) {
    const c = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    const colors = randomPalette();
    c.clearRect(0, 0, w, h);
    c.fillStyle = '#0a0a14';
    c.fillRect(0, 0, w, h);
    const patterns = [
      drawRainbowDiagonal,
      drawRadialBurst,
      drawCornerGradients,
      drawColorStripes,
      drawConcentricRings,
      drawGeometricBlocks,
      drawLinearMultiStop,
      drawDiamondPattern,
    ];
    const fn = patterns[type % patterns.length];
    fn(c, w, h, colors);
  }
  function drawRainbowDiagonal(c, w, h, colors) {
    const grad = c.createLinearGradient(0, 0, w, h);
    colors.forEach((color, i) => grad.addColorStop(i / (colors.length - 1), color));
    c.fillStyle = grad;
    c.fillRect(0, 0, w, h);
    const hl = c.createRadialGradient(w * 0.3, h * 0.3, 0, w * 0.5, h * 0.5, w * 0.7);
    hl.addColorStop(0, 'rgba(255,255,255,0.2)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = hl;
    c.fillRect(0, 0, w, h);
  }
  function drawRadialBurst(c, w, h, colors) {
    const cx = w / 2, cy = h / 2;
    for (let i = 0; i < 5; i++) {
      const r = (i + 1) * (w * 0.22);
      const grad = c.createRadialGradient(cx + (Math.random() - 0.5) * 60, cy + (Math.random() - 0.5) * 60, r * 0.1, cx, cy, r);
      colors.forEach((color, j) => {
        const offset = j / (colors.length - 1);
        grad.addColorStop(offset, color);
      });
      c.fillStyle = grad;
      c.fillRect(0, 0, w, h);
    }
  }
  function drawCornerGradients(c, w, h, colors) {
    const corners = [
      [0, 0], [w, 0], [0, h], [w, h],
    ];
    corners.forEach(([x, y], i) => {
      const grad = c.createRadialGradient(x, y, 0, x, y, w * 0.75);
      grad.addColorStop(0, colors[i % colors.length]);
      grad.addColorStop(0.5, colors[(i + 1) % colors.length]);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = grad;
      c.fillRect(0, 0, w, h);
    });
  }
  function drawColorStripes(c, w, h, colors) {
    const angle = Math.random() * Math.PI;
    const count = 12 + Math.floor(Math.random() * 8);
    const stripeW = w * 1.5 / count;
    c.save();
    c.translate(w / 2, h / 2);
    c.rotate(angle);
    for (let i = 0; i < count; i++) {
      const x = -w + i * stripeW;
      c.fillStyle = colors[i % colors.length];
      c.globalAlpha = 0.75 + Math.random() * 0.25;
      c.fillRect(x, -h, stripeW, h * 2);
    }
    c.restore();
    const overlay = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.7);
    overlay.addColorStop(0, 'rgba(255,255,255,0.1)');
    overlay.addColorStop(1, 'rgba(0,0,0,0.15)');
    c.fillStyle = overlay;
    c.fillRect(0, 0, w, h);
  }
  function drawConcentricRings(c, w, h, colors) {
    const cx = w / 2 + (Math.random() - 0.5) * 80;
    const cy = h / 2 + (Math.random() - 0.5) * 80;
    const ringCount = 8 + Math.floor(Math.random() * 6);
    for (let i = ringCount; i >= 0; i--) {
      const r = (i / ringCount) * w * 0.72;
      const grad = c.createRadialGradient(cx, cy, r * 0.85, cx, cy, r);
      grad.addColorStop(0, colors[i % colors.length]);
      grad.addColorStop(1, colors[(i + 1) % colors.length]);
      c.fillStyle = grad;
      c.beginPath();
      c.arc(cx, cy, r, 0, Math.PI * 2);
      c.fill();
    }
  }
  function drawGeometricBlocks(c, w, h, colors) {
    const blockSize = w / (3 + Math.floor(Math.random() * 3));
    for (let row = 0; row < h; row += blockSize) {
      for (let col = 0; col < w; col += blockSize) {
        const colorIdx = (Math.floor(row / blockSize) + Math.floor(col / blockSize)) % colors.length;
        c.fillStyle = colors[colorIdx];
        c.globalAlpha = 0.5 + Math.random() * 0.5;
        const offset = blockSize * 0.08;
        c.fillRect(col + offset, row + offset, blockSize - offset * 2, blockSize - offset * 2);
        c.strokeStyle = 'rgba(255,255,255,0.08)';
        c.lineWidth = 1;
        c.strokeRect(col + offset, row + offset, blockSize - offset * 2, blockSize - offset * 2);
      }
    }
    c.globalAlpha = 1;
  }
  function drawLinearMultiStop(c, w, h, colors) {
    const angle = Math.random() * Math.PI * 2;
    const dx = Math.cos(angle) * w;
    const dy = Math.sin(angle) * h;
    const grad = c.createLinearGradient(w / 2 - dx / 2, h / 2 - dy / 2, w / 2 + dx / 2, h / 2 + dy / 2);
    colors.forEach((color, i) => grad.addColorStop(i / (colors.length - 1), color));
    c.fillStyle = grad;
    c.fillRect(0, 0, w, h);
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * w;
      const y = Math.random() * h;
      const r = 4 + Math.random() * 14;
      c.fillStyle = `rgba(255,255,255,${0.02 + Math.random() * 0.06})`;
      c.beginPath();
      c.arc(x, y, r, 0, Math.PI * 2);
      c.fill();
    }
  }
  function drawDiamondPattern(c, w, h, colors) {
    const cx = w / 2, cy = h / 2;
    const layers = 6 + Math.floor(Math.random() * 4);
    for (let i = layers; i >= 0; i--) {
      const size = (i / layers) * w * 0.75;
      const grad = c.createLinearGradient(cx - size, cy, cx + size, cy);
      grad.addColorStop(0, colors[i % colors.length]);
      grad.addColorStop(0.5, colors[(i + 2) % colors.length]);
      grad.addColorStop(1, colors[(i + 1) % colors.length]);
      c.fillStyle = grad;
      c.beginPath();
      c.moveTo(cx, cy - size);
      c.lineTo(cx + size, cy);
      c.lineTo(cx, cy + size);
      c.lineTo(cx - size, cy);
      c.closePath();
      c.fill();
    }
  }
  function createFullCanvas() {
    const fullCanvas = document.createElement('canvas');
    fullCanvas.width = CANVAS_SIZE;
    fullCanvas.height = CANVAS_SIZE;
    return fullCanvas;
  }
  function createPieces(fullCanvas, gridSize) {
    const pieceSize = fullCanvas.width / gridSize;
    const pieces = [];
    for (let r = 0; r < gridSize; r++) {
      for (let c = 0; c < gridSize; c++) {
        const pc = document.createElement('canvas');
        pc.width = pieceSize;
        pc.height = pieceSize;
        const pCtx = pc.getContext('2d');
        pCtx.drawImage(
          fullCanvas,
          c * pieceSize, r * pieceSize, pieceSize, pieceSize,
          0, 0, pieceSize, pieceSize
        );
        pieces.push({
          correctRow: r,
          correctCol: c,
          canvas: pc,
        });
      }
    }
    return pieces;
  }
  function shufflePieces(pieces, gridSize) {
    const total = gridSize * gridSize;
    const swapCount = total * total;
    for (let s = 0; s < swapCount; s++) {
      const a = Math.floor(Math.random() * total);
      const b = Math.floor(Math.random() * total);
      if (a !== b) {
        [pieces[a], pieces[b]] = [pieces[b], pieces[a]];
      }
    }
    if (isPiecesSolved(pieces, gridSize)) {
      const i = Math.floor(Math.random() * (total - 1));
      [pieces[i], pieces[i + 1]] = [pieces[i + 1], pieces[i]];
    }
  }
  function isPiecesSolved(pieces, gridSize) {
    for (let i = 0; i < pieces.length; i++) {
      const piece = pieces[i];
      const correctPos = piece.correctRow * gridSize + piece.correctCol;
      if (i !== correctPos) return false;
    }
    return true;
  }
  function drawPuzzle() {
    ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    const gridSize = state.gridSize;
    const pieceSize = CANVAS_SIZE / gridSize;
    const gap = pieceSize * 0.04;
    const drawSize = pieceSize - gap;
    for (let i = 0; i < state.pieces.length; i++) {
      const piece = state.pieces[i];
      const row = Math.floor(i / gridSize);
      const col = i % gridSize;
      const x = col * pieceSize + gap / 2;
      const y = row * pieceSize + gap / 2;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 1;
      ctx.drawImage(piece.canvas, x, y, drawSize, drawSize);
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, drawSize, drawSize);
      if (i === state.selectedIndex) {
        const glowSize = 3;
        ctx.save();
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 14;
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x - 1, y - 1, drawSize + 2, drawSize + 2);
        ctx.restore();
        ctx.fillStyle = 'rgba(251, 191, 36, 0.15)';
        ctx.fillRect(x, y, drawSize, drawSize);
      }
    }
    if (!state.isComplete) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.lineWidth = 1;
      for (let i = 1; i < gridSize; i++) {
        const pos = i * pieceSize;
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, CANVAS_SIZE);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(CANVAS_SIZE, pos);
        ctx.stroke();
      }
    }
    if (state.isComplete) {
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#fbbf24';
      ctx.shadowBlur = 20;
      ctx.strokeRect(2, 2, CANVAS_SIZE - 4, CANVAS_SIZE - 4);
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    }
    if (state.confettiParticles.length > 0) {
      drawConfetti();
    }
  }
  function drawPreview() {
    ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    if (state.fullCanvas) {
      ctx.drawImage(state.fullCanvas, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(0, 0, CANVAS_SIZE, 40);
      ctx.fillStyle = '#fff';
      ctx.font = '600 16px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('预览原图 - 点击任意位置返回', CANVAS_SIZE / 2, 28);
      ctx.textAlign = 'start';
    }
  }
  function initConfetti() {
    state.confettiParticles = [];
    const colors = [
      '#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3',
      '#54a0ff', '#5f27cd', '#1dd1a1', '#f368e0',
      '#ff9f43', '#00d2d3', '#ff6348', '#7bed9f',
    ];
    for (let i = 0; i < 120; i++) {
      state.confettiParticles.push({
        x: Math.random() * CANVAS_SIZE,
        y: -10 - Math.random() * 100,
        w: 4 + Math.random() * 10,
        h: 3 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 3,
        vy: 2 + Math.random() * 4,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.15,
        opacity: 1,
        gravity: 0.04 + Math.random() * 0.04,
      });
    }
    state.confettiAnimId = requestAnimationFrame(confettiLoop);
  }
  function confettiLoop() {
    let alive = false;
    ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    const gridSize = state.gridSize;
    const pieceSize = CANVAS_SIZE / gridSize;
    const gap = pieceSize * 0.04;
    const drawSize = pieceSize - gap;
    for (let i = 0; i < state.pieces.length; i++) {
      const piece = state.pieces[i];
      const row = Math.floor(i / gridSize);
      const col = i % gridSize;
      const x = col * pieceSize + gap / 2;
      const y = row * pieceSize + gap / 2;
      ctx.drawImage(piece.canvas, x, y, drawSize, drawSize);
    }
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = 20;
    ctx.strokeRect(2, 2, CANVAS_SIZE - 4, CANVAS_SIZE - 4);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    for (const p of state.confettiParticles) {
      if (p.opacity <= 0) continue;
      alive = true;
      p.vy += p.gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      p.opacity -= 0.003;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (alive) {
      state.confettiAnimId = requestAnimationFrame(confettiLoop);
    } else {
      state.confettiAnimId = null;
      state.confettiParticles = [];
      drawPuzzle();
    }
  }
  function drawConfetti() {
    for (const p of state.confettiParticles) {
      if (p.opacity <= 0) continue;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
  }
  function showWinOverlay() {
    const m = state.elapsedSeconds;
    const minutes = Math.floor(m / 60);
    const seconds = m % 60;
    const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    winStatsEl.innerHTML = `
      难度：<span>${state.gridSize}×${state.gridSize}</span><br>
      步数：<span>${state.moves}</span><br>
      用时：<span>${timeStr}</span>
    `;
    winOverlay.classList.add('show');
  }
  function hideWinOverlay() {
    winOverlay.classList.remove('show');
  }
  function startTimer() {
    if (state.timerStarted || state.isComplete) return;
    state.timerStarted = true;
    state.startTime = Date.now() - state.elapsedSeconds * 1000;
    state.timerInterval = setInterval(updateTimer, 200);
  }
  function stopTimer() {
    if (state.timerInterval) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
    }
  }
  function updateTimer() {
    if (!state.timerStarted || state.isComplete) return;
    state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
    renderTimer();
  }
  function renderTimer() {
    const m = state.elapsedSeconds;
    const minutes = Math.floor(m / 60);
    const seconds = m % 60;
    timerDisplayEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  }
  function getGridPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = CANVAS_SIZE / rect.width;
    const scaleY = CANVAS_SIZE / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    const pieceSize = CANVAS_SIZE / state.gridSize;
    const col = Math.floor(mx / pieceSize);
    const row = Math.floor(my / pieceSize);
    if (col < 0 || col >= state.gridSize || row < 0 || row >= state.gridSize) return -1;
    return row * state.gridSize + col;
  }
  function handleCanvasClick(e) {
    if (state.isComplete) return;
    if (state.showPreview) {
      togglePreview();
      return;
    }
    const index = getGridPos(e);
    if (index < 0 || index >= state.pieces.length) return;
    if (state.selectedIndex < 0) {
      state.selectedIndex = index;
      drawPuzzle();
    } else if (state.selectedIndex === index) {
      state.selectedIndex = -1;
      drawPuzzle();
    } else {
      swapPieces(state.selectedIndex, index);
    }
  }
  function swapPieces(a, b) {
    startTimer();
    [state.pieces[a], state.pieces[b]] = [state.pieces[b], state.pieces[a]];
    state.moves++;
    state.selectedIndex = -1;
    moveCountEl.textContent = state.moves;
    drawPuzzle();
    if (isPiecesSolved(state.pieces, state.gridSize)) {
      handleWin();
    }
  }
  function handleWin() {
    state.isComplete = true;
    stopTimer();
    renderTimer();
    initConfetti();
    setTimeout(showWinOverlay, 800);
  }
  function togglePreview() {
    state.showPreview = !state.showPreview;
    if (state.showPreview) {
      state.selectedIndex = -1;
      btnPreview.textContent = '👁 隐藏预览';
      btnPreview.classList.add('active-toggle');
      canvas.classList.add('preview-mode');
      drawPreview();
    } else {
      btnPreview.textContent = '👁 预览原图';
      btnPreview.classList.remove('active-toggle');
      canvas.classList.remove('preview-mode');
      drawPuzzle();
    }
  }
  function setDifficulty(size) {
    if (state.gridSize === size) return;
    state.gridSize = size;
    const buttons = difficultyGroup.querySelectorAll('button');
    buttons.forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.size) === size);
    });
    newGame();
  }
  function newGame() {
    stopTimer();
    if (state.confettiAnimId) {
      cancelAnimationFrame(state.confettiAnimId);
      state.confettiAnimId = null;
    }
    state.selectedIndex = -1;
    state.moves = 0;
    state.timerStarted = false;
    state.elapsedSeconds = 0;
    state.isComplete = false;
    state.showPreview = false;
    state.confettiParticles = [];
    state.gradientType = Math.floor(Math.random() * 8);
    moveCountEl.textContent = '0';
    timerDisplayEl.textContent = '00:00';
    btnPreview.textContent = '👁 预览原图';
    btnPreview.classList.remove('active-toggle');
    canvas.classList.remove('preview-mode');
    hideWinOverlay();
    const fullCanvas = createFullCanvas();
    generateGradient(fullCanvas, state.gradientType);
    state.fullCanvas = fullCanvas;
    state.pieces = createPieces(fullCanvas, state.gridSize);
    shufflePieces(state.pieces, state.gridSize);
    drawPuzzle();
  }
  difficultyGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const size = parseInt(btn.dataset.size);
    if (!isNaN(size)) setDifficulty(size);
  });
  btnNewGame.addEventListener('click', newGame);
  btnPreview.addEventListener('click', togglePreview);
  btnPlayAgain.addEventListener('click', newGame);
  canvas.addEventListener('click', handleCanvasClick);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'p' || e.key === 'P') {
      if (!state.isComplete) togglePreview();
    }
    if (e.key === 'n' || e.key === 'N') {
      e.preventDefault();
      newGame();
    }
    if (e.key === 'Escape') {
      if (state.showPreview) togglePreview();
      if (state.selectedIndex >= 0) {
        state.selectedIndex = -1;
        drawPuzzle();
      }
    }
  });
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY };
    handleCanvasClick(fakeEvent);
  }, { passive: false });
  newGame();
})();
</script>
