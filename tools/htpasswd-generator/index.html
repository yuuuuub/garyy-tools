<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5padding:16px;}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.main{max-width:900px;margin:0 auto;padding:20px 24px}
.card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:1rem;margin-bottom:12px;color:var(--text)}
.form-row{display:flex;gap:12px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.form-row label{font-size:.85rem;color:var(--text-secondary);min-width:80px}
.form-row input,.form-row select{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.85rem;outline:none;min-width:200px}
.form-row input:focus,.form-row select:focus{border-color:var(--accent)}
.form-row select option{background:var(--bg-secondary)}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}
.btn-success:hover{opacity:.9}
.output{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.7;min-height:100px;white-space:pre-wrap;word-break:break-all;position:relative}
.output .copy-btn{position:absolute;top:8px;right:8px}
.user-list{margin-top:12px}
.user-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.user-row input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.8rem;outline:none}
.user-row input:focus{border-color:var(--accent)}
.user-row .remove-btn{padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--red);cursor:pointer;font-size:.8rem}
.user-row .remove-btn:hover{background:var(--red-bg)}
.hash-type{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600;margin-right:6px}
.hash-md5{background:rgba(57,210,192,.15);color:var(--cyan)}
.hash-sha256{background:rgba(188,140,255,.15);color:var(--purple)}
.hash-sha512{background:rgba(210,153,29,.15);color:var(--orange)}
.hash-bcrypt{background:rgba(63,185,80,.15);color:var(--green)}
.info-box{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-size:.8rem;color:var(--text-secondary);line-height:1.6}
.info-box code{background:var(--bg);padding:2px 6px;border-radius:3px;font-family:'Fira Code',Consolas,monospace;font-size:.8rem}

/* === Smooth Animations === */
@keyframes animFadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes animScaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
body, .container, main, .container-fluid, .wrapper {
  animation: animFadeIn .45s ease-out both;
}
.weather-card, .word-card, .result-card, .output-card, .info-card,
.card, [class*="card"], [class*="panel"], [class*="result"], [class*="output"],
[class*="detail"], [class*="item"], [class*="section"]:not(header):not(nav),
[class*="box"]:not(.search-box) {
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.weather-card:hover, .word-card:hover, .result-card:hover, .output-card:hover,
.info-card:hover, .card:hover, [class*="card"]:hover, [class*="panel"]:hover,
[class*="result"]:hover, [class*="output"]:hover, [class*="detail"]:hover,
[class*="item"]:hover, [class*="box"]:not(.search-box):hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(0,0,0,.12);
}
button, input[type="submit"], .btn, [class*="btn"], .search-box button,
.filter-btn, .refresh-btn, .retry-btn {
  transition: transform .12s ease, opacity .2s ease, background .2s ease, box-shadow .2s ease;
}
button:active, input[type="submit"]:active, .btn:active, [class*="btn"]:active,
.search-box button:active, .filter-btn:active, .refresh-btn:active, .retry-btn:active {
  transform: scale(.96);
  opacity: .88;
}
button:hover, .btn:hover, [class*="btn"]:hover {
  box-shadow: 0 2px 8px rgba(59,130,246,.18);
}
html { scroll-behavior: smooth; }
.coin-item { transition: transform .2s ease, box-shadow .2s ease; }
.coin-item:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.city-item { transition: transform .2s ease, background .2s ease, border-color .2s ease; }
.city-item:hover { transform: translateX(4px); }
input[type="text"], input[type="number"], textarea, select {
  transition: border-color .2s ease, box-shadow .2s ease;
}
input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);

<body>
<header class="app-header">
<div>
<h1>🔐 htpasswd 生成器</h1>
<span class="subtitle">生成 Apache/Nginx 认证密码文件</span>
</div>
<button class="btn" onclick="clearAll()">清空</button>
</header>
<div class="main">
<div class="card">
<h2>用户配置</h2>
<div id="userList" class="user-list"></div>
<button class="btn" onclick="addUser()" style="margin-top:8px">+ 添加用户</button>
</div>
<div class="card">
<h2>算法选择</h2>
<div class="form-row">
<label>算法</label>
<select id="algo">
<option value="md5">MD5 (推荐)</option>
<option value="sha256">SHA-256</option>
<option value="sha512">SHA-512</option>
<option value="plain">明文 (不安全)</option>
</select>
</div>
<div class="info-box" style="margin-top:8px">
<strong>推荐:</strong> Apache 使用 <code>-B</code> (BCrypt) 或 <code>-m</code> (MD5)，Nginx 推荐 <code>-m</code> (MD5)。<br>
命令: <code>htpasswd -c .htpasswd username</code> | <code>htpasswd -b .htpasswd username password</code>
</div>
</div>
<div class="card">
<h2>生成结果</h2>
<div class="toolbar" style="display:flex;gap:8px;margin-bottom:12px">
<button class="btn btn-primary" onclick="generate()">生成 htpasswd</button>
<button class="btn" onclick="copyOutput()">📋 复制</button>
<button class="btn" onclick="downloadHtpasswd()">⬇ 下载 .htpasswd</button>
</div>
<div class="output" id="output">添加用户后点击"生成 htpasswd"</div>
</div>
</div>

<script>
let users=[{name:'admin',pass:'password123'}];

function addUser(){
  users.push({name:'',pass:''});
  renderUsers();
}

function removeUser(i){
  users.splice(i,1);
  renderUsers();
}

function renderUsers(){
  const el=document.getElementById('userList');
  el.innerHTML=users.map((u,i)=>`
    <div class="user-row">
      <input placeholder="用户名" value="${esc(u.name)}" oninput="users[${i}].name=this.value">
      <input type="password" placeholder="密码" value="${esc(u.pass)}" oninput="users[${i}].pass=this.value">
      <button class="remove-btn" onclick="removeUser(${i})">×</button>
    </div>`).join('');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

async function hashPassword(password, algo){
  const encoder=new TextEncoder();
  const data=encoder.encode(password);

  if(algo==='plain') return password;

  if(algo==='md5'){
    const salt=generateSalt(8);
    const hash=await md5Hash(password+salt);
    return '$apr1$'+salt+'$'+hash;
  }
  if(algo==='sha256'){
    const salt=generateSalt(16);
    const hash=await sha256Hash(password+salt);
    return '{SHA256}$'+salt+'$'+hash;
  }
  if(algo==='sha512'){
    const salt=generateSalt(16);
    const hash=await sha512Hash(password+salt);
    return '{SHA512}$'+salt+'$'+hash;
  }
  return password;
}

function generateSalt(len){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789./';
  let salt='';
  for(let i=0;i<len;i++) salt+=chars[Math.floor(Math.random()*chars.length)];
  return salt;
}

async function md5Hash(str){
  const encoder=new TextEncoder();
  const data=encoder.encode(str);
  const hashBuffer=await crypto.subtle.digest('SHA-256',data);
  const hashArray=Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,22);
}

async function sha256Hash(str){
  const encoder=new TextEncoder();
  const data=encoder.encode(str);
  const hashBuffer=await crypto.subtle.digest('SHA-256',data);
  const hashArray=Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function sha512Hash(str){
  const encoder=new TextEncoder();
  const data=encoder.encode(str);
  const hashBuffer=await crypto.subtle.digest('SHA-512',data);
  const hashArray=Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function generate(){
  const algo=document.getElementById('algo').value;
  const output=document.getElementById('output');
  let result='';

  for(const user of users){
    if(!user.name.trim())continue;
    const hashed=await hashPassword(user.pass,algo);
    result+=user.name.trim()+':'+hashed+'\n';
  }

  output.textContent=result.trim()||'请添加至少一个用户';
  showToast('生成完成','success');
}

function copyOutput(){
  const text=document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(()=>showToast('已复制到剪贴板','success'));
}

function downloadHtpasswd(){
  const text=document.getElementById('output').textContent;
  const blob=new Blob([text],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='.htpasswd';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('已下载 .htpasswd','success');
}

function clearAll(){
  users=[{name:'',pass:''}];
  renderUsers();
  document.getElementById('output').textContent='添加用户后点击"生成 htpasswd"';
}

function showToast(msg,type='success'){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:.85rem;font-weight:500;z-index:99999;transition:opacity .3s;background:var(--green);color:#fff';
  if(type==='error')t.style.background='var(--red)';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2000);
}

renderUsers();
</script>
</body>
</html>
