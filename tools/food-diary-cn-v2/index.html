<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📔 饮食日记 v2</title>
<meta property="og:title" content="📔 饮食日记 v2">
<meta property="og:description" content="📔 饮食日记 v2 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="记录每日饮食，追踪热量和营养摄入，生成饮食报告">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#ec4899;--accent2:#db2777;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#db2777;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--blue:#0969da;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date]{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus{border-color:var(--accent)}
select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;width:100%}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.stat-box{text-align:center;padding:12px 8px;background:var(--bg);border-radius:8px}
.stat-box .num{font-size:1.1rem;font-weight:700;color:var(--accent)}
.stat-box .lbl{font-size:.7rem;color:var(--text2);margin-top:2px}
.stat-box .target{font-size:.65rem;color:var(--text2)}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.meal-section{margin-bottom:12px}
.meal-section h3{font-size:.9rem;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.meal-section .tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.7rem}
.meal-section .tag.b{background:rgba(59,130,246,.15);color:var(--blue)}
.meal-section .tag.l{background:rgba(34,197,94,.15);color:var(--green)}
.meal-section .tag.d{background:rgba(234,179,8,.15);color:var(--yellow)}
.meal-section .tag.s{background:rgba(236,72,153,.15);color:var(--accent)}
.entry{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.entry:last-child{border-bottom:none}
.entry .food{flex:1;font-weight:600}
.entry .cal{color:var(--accent);font-weight:700;min-width:60px;text-align:right}
.entry .del{padding:2px 8px;font-size:.7rem}
.quick-food{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick-food span{padding:5px 12px;background:var(--bg);border:1px solid var(--border);border-radius:16px;cursor:pointer;font-size:.8rem;transition:all .2s}
.quick-food span:hover{border-color:var(--accent);color:var(--accent)}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline .entry{position:relative}
.timeline .entry::before{content:'';position:absolute;left:-16px;top:12px;width:8px;height:8px;background:var(--accent);border-radius:50%}
.empty{text-align:center;padding:30px;color:var(--text2);font-size:.9rem}
.canvas-wrap{margin:16px 0}
canvas{width:100%;max-height:200px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📔</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📔 饮食日记 v2</h1><p>记录每日饮食，追踪营养摄入</p></div>

<div class="cd"><h2>➕ 记录饮食</h2>
<label>日期</label><input type="date" id="dateInput">
<div class="fr">
<div><label>食物名称</label><input type="text" id="foodName" placeholder="如：米饭" onkeydown="if(event.key==='Enter')addEntry()"></div>
<div><label>餐次</label><select id="mealType"><option value="早餐">🌅 早餐</option><option value="午餐" selected>☀️ 午餐</option><option value="晚餐">🌙 晚餐</option><option value="加餐">🍪 加餐</option></select></div>
</div>
<div class="fr">
<div><label>热量(千卡)</label><input type="number" id="foodCal" placeholder="自动填充" min="0"></div>
<div><label>蛋白质(g)</label><input type="number" id="foodProtein" placeholder="可选" min="0" step="0.1"></div>
</div>
<div class="bg"><button onclick="addEntry()">➕ 记录</button></div>
<div class="quick-food" id="quickFood"></div></div>

<div class="cd"><h2>📊 今日概览</h2>
<div class="stats-row" id="todayStats"></div>
<div class="canvas-wrap"><canvas id="chart" height="160"></canvas></div></div>

<div class="cd" id="dayCard"><h2 id="dayTitle">📋 今日记录</h2>
<div id="dayEntries" class="empty">暂无记录</div></div>

<div class="cd"><h2>📅 历史趋势</h2><div class="canvas-wrap"><canvas id="weekChart" height="120"></canvas></div></div>
</div>
<script>
var DB='food_diary_v2',records=JSON.parse(localStorage.getItem(DB)||'{}');
var QUICK={白米饭:{cal:116,p:2.6},面条:{cal:138,p:4.5},馒头:{cal:223,p:7},鸡蛋:{cal:144,p:13.3},鸡胸肉:{cal:165,p:31},苹果:{cal:52,p:0.3},牛奶:{cal:61,p:3.2},香蕉:{cal:89,p:1.1},番茄:{cal:18,p:0.9},西兰花:{cal:34,p:2.8},猪肉:{cal:143,p:21},牛肉:{cal:250,p:26},虾:{cal:99,p:20.4},豆腐:{cal:76,p:8.1},酸奶:{cal:97,p:3.5}};
var TARGET_CAL=2000,TARGET_P=65;

function today(){return document.getElementById('dateInput').value||new Date().toISOString().slice(0,10);}
function addEntry(){
var date=today(),name=document.getElementById('foodName').value.trim();
if(!name)return;
var cal=parseInt(document.getElementById('foodCal').value)||0,protein=parseFloat(document.getElementById('foodProtein').value)||0;
var meal=document.getElementById('mealType').value;
if(!cal&&QUICK[name]){cal=QUICK[name].cal;protein=QUICK[name].p;}
if(!cal){var q=parseInt(prompt('请输入热量(千卡)'));if(isNaN(q))return;cal=q;}
if(!records[date])records[date]={};
if(!records[date][meal])records[date][meal]=[];
records[date][meal].push({name:name,cal:cal,protein:protein,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});
save();render();document.getElementById('foodName').value='';document.getElementById('foodCal').value='';document.getElementById('foodProtein').value='';
}
function removeEntry(date,meal,idx){records[date][meal].splice(idx,1);if(!records[date][meal].length)delete records[date][meal];if(!Object.keys(records[date]).length)delete records[date];save();render();}
function save(){localStorage.setItem(DB,JSON.stringify(records));}
function render(){
var date=today();
var dayData=records[date]||{};
var totalCal=0,totalP=0,entries=0;
['早餐','午餐','晚餐','加餐'].forEach(function(m){(dayData[m]||[]).forEach(function(e){totalCal+=e.cal;totalP+=e.protein||0;entries++})});
var calPct=Math.min(100,totalCal/TARGET_CAL*100),pPct=Math.min(100,totalP/TARGET_P*100);
document.getElementById('todayStats').innerHTML=[
{v:totalCal,l:'热量',t:TARGET_CAL+'千卡',c:calPct>90?'var(--green)':calPct>60?'var(--yellow)':'var(--accent)'},
{v:totalP.toFixed(0)+'g',l:'蛋白质',t:TARGET_P+'g',c:pPct>90?'var(--green)':'var(--accent)'},
{v:entries,l:'记录数',t:'',c:'var(--blue)'},
{v:(TARGET_CAL-totalCal),l:'剩余',t:'千卡',c:totalCal>TARGET_CAL?'var(--red)':'var(--green)'}
].map(function(s){return '<div class="stat-box"><div class="num" style="color:'+s.c+'">'+s.v+'</div><div class="lbl">'+s.l+'</div>'+(s.t?'<div class="target">'+s.t+'</div>':'')+'<div class="bar"><div class="bar-fill" style="width:'+Math.min(100,typeof s.v==='number'?s.v/(s.l==='热量'?TARGET_CAL:1)*100:0)+'%;background:'+s.c+'"></div></div></div>'}).join('');
document.getElementById('dayTitle').textContent=date+' 饮食记录';
var html='';
['早餐','午餐','晚餐','加餐'].forEach(function(m){
var items=dayData[m]||[];if(!items.length)return;
var icons={早餐:'🌅',午餐:'☀️',晚餐:'🌙',加餐:'🍪'};
var cls={早餐:'b',午餐:'l',晚餐:'d',加餐:'s'};
html+='<div class="meal-section"><h3><span class="tag '+cls[m]+'">'+icons[m]+' '+m+'</span></h3>';
items.forEach(function(e,i){html+='<div class="entry"><span class="food">'+e.name+'</span><span style="color:var(--text2);font-size:.8rem">'+(e.time||'')+'</span><span class="cal">'+e.cal+'千卡</span><button class="del" onclick="removeEntry(\''+date+'\',\''+m+'','+i+')">✕</button></div>'});
html+='</div>';
});
if(!html)html='<div class="empty">今日暂无饮食记录</div>';
document.getElementById('dayEntries').innerHTML=html;
drawDayChart(dayData);
drawWeekChart();
}
function drawDayChart(data){
var cv=document.getElementById('chart'),ctx=cv.getContext('2d');
cv.width=cv.offsetWidth;ctx.clearRect(0,0,cv.width,160);
var meals=['早餐','午餐','晚餐','加餐'],colors=['#3b82f6','#22c55e','#eab308','#ec4899'];
var max=TARGET_CAL/2;
meals.forEach(function(m,i){var cal=0;(data[m]||[]).forEach(function(e){cal+=e.cal});var h=Math.min(120,cal/max*120);
var x=40+i*(cv.width-60)/4,y=140-h;
ctx.fillStyle=colors[i];ctx.beginPath();ctx.roundRect(x,y,(cv.width-60)/5,h,4);ctx.fill();
ctx.fillStyle='#8b949e';ctx.font='12px sans-serif';ctx.textAlign='center';
ctx.fillText(m,x+(cv.width-60)/10,155);
ctx.fillStyle='#e6edf3';ctx.fillText(cal+'',x+(cv.width-60)/10,y-5);
});
}
function drawWeekChart(){
var cv=document.getElementById('weekChart'),ctx=cv.getContext('2d');
cv.width=cv.offsetWidth;ctx.clearRect(0,0,cv.width,120);
var days=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10));}
var cals=days.map(function(d){var total=0;var dd=records[d]||{};Object.values(dd).forEach(function(arr){arr.forEach(function(e){total+=e.cal})});return total;});
var max=Math.max.apply(null,cals.concat([TARGET_CAL]))*1.1;
var bw=(cv.width-60)/7;
days.forEach(function(d,i){var h=Math.min(100,cals[i]/max*100);var x=40+i*bw,y=100-h;
ctx.fillStyle=cals[i]>TARGET_CAL?'#ef4444':'#8b5cf6';ctx.beginPath();ctx.roundRect(x+4,y,bw-8,h,4);ctx.fill();
ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';ctx.textAlign='center';
ctx.fillText(d.slice(5),x+bw/2,115);
ctx.fillStyle='#e6edf3';ctx.fillText(cals[i]+'',x+bw/2,y-4);
});
ctx.strokeStyle='#30363d';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(30,100-TARGET_CAL/max*100);ctx.lineTo(cv.width,100-TARGET_CAL/max*100);ctx.stroke();
ctx.fillStyle='#8b949e';ctx.fillText('目标',25,100-TARGET_CAL/max*100+4);
}
function renderQuick(){
var el=document.getElementById('quickFood');
Object.entries(QUICK).forEach(function(e){
var s=document.createElement('span');s.textContent=e[0]+' '+e[1].cal+'千卡';
s.onclick=function(){document.getElementById('foodName').value=e[0];document.getElementById('foodCal').value=e[1].cal;document.getElementById('foodProtein').value=e[1].p;addEntry()};
el.appendChild(s);
});
}
document.getElementById('dateInput').value=new Date().toISOString().slice(0,10);
document.getElementById('dateInput').onchange=render;
renderQuick();render();
</script>
</body>
</html>
