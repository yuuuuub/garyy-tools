<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环保产品推荐 | Eco-Friendly CN</title>
<meta name="description" content="环保产品推荐指南，发现可持续生活的绿色好物">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">
<meta name="robots" content="index, follow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--input:#242836;--text:#e2e4e9;--text2:#8b8fa3;--green:#22c55e;--green2:#16a34a;--blue:#3b82f6;--purple:#8b5cf6;--warn:#f59e0b;--border:#2a2e3a;--radius:12px;--radius-sm:8px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--input:#f0f2f5;--text:#1f2328;--text2:#656d76;--green:#1a7f37;--blue:#0969da;--purple:#8250df;--warn:#bf8700;--border:#d0d7de}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;line-height:1.6;padding:20px}
.container{max-width:860px;margin:0 auto;padding:0 12px}
header{text-align:center;padding:40px 0 24px}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#22c55e,#10b981,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{color:var(--text2);font-size:.95rem}
.search-box{display:flex;gap:12px;margin-bottom:24px}
.search-box input{flex:1;background:var(--input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;color:var(--text);font-size:1rem;outline:none}
.search-box input:focus{border-color:var(--green)}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--input);color:var(--text2);cursor:pointer;font-size:.88rem;transition:all .2s}
.tab:hover,.tab.active{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.05)}
.product-list{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:500px){.product-list{grid-template-columns:1fr}}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .2s}
.product-card:hover{border-color:var(--green);transform:translateY(-2px)}
.product-card .p-icon{font-size:2.5rem;margin-bottom:12px}
.product-card .p-name{font-weight:700;font-size:1rem;margin-bottom:6px}
.product-card .p-desc{font-size:.85rem;color:var(--text2);line-height:1.6;margin-bottom:12px}
.product-card .p-tags{display:flex;gap:6px;flex-wrap:wrap}
.product-card .p-tag{font-size:.72rem;padding:2px 8px;border-radius:10px;background:rgba(34,197,94,.1);color:var(--green)}
.product-card .p-saving{font-size:.82rem;color:var(--warn);margin-top:8px;font-weight:600}
.eco-score{display:flex;align-items:center;gap:6px;margin-top:8px}
.eco-score .e-dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.eco-score .e-dot.active{background:var(--green)}
.eco-score .e-label{font-size:.75rem;color:var(--text2)}
.compare-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-top:24px}
.compare-section h2{font-size:1.15rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.compare-table{width:100%;border-collapse:collapse;font-size:.88rem}
.compare-table th,.compare-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.compare-table th{color:var(--text2);font-weight:600;font-size:.82rem;text-transform:uppercase}
.compare-table .better{color:var(--green);font-weight:600}
.compare-table .worse{color:var(--text2)}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.82rem}
</style>
</head>
<body>
<div class="container">
<header><h1>🍃 环保产品推荐</h1><p class="subtitle">发现可持续生活的绿色好物</p></header>
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索环保产品..." oninput="filterProducts()">
</div>
<div class="tabs" id="tabs"></div>
<div class="product-list" id="productList"></div>
<div class="compare-section">
<h2><span class="icon">📊</span> 环保 vs 普通产品对比</h2>
<table class="compare-table">
<thead><tr><th>对比项</th><th>环保产品</th><th>普通产品</th></tr></thead>
<tbody>
<tr><td>可降解性</td><td class="better">✅ 180天内降解</td><td class="worse">❌ 数百年不降解</td></tr>
<tr><td>碳排放</td><td class="better">✅ 降低60-80%</td><td class="worse">⚠️ 标准排放</td></tr>
<tr><td>原料来源</td><td class="better">✅ 可再生材料</td><td class="worse">❌ 石化原料</td></tr>
<tr><td>使用寿命</td><td class="better">✅ 可重复使用</td><td class="worse">⚠️ 多为一次性</td></tr>
<tr><td>价格</td><td class="worse">⚠️ 略高10-30%</td><td class="better">✅ 价格较低</td></tr>
<tr><td>环境影响</td><td class="better">✅ 极低污染</td><td class="worse">❌ 高污染风险</td></tr>
</tbody>
</table>
</div>
<footer>环保产品推荐 · 用消费投票，为地球选择</footer>
</div>
<script>
const CATEGORIES=[
{id:'all',name:'全部'},
{id:'kitchen',name:'厨房'},
{id:'bath',name:'卫浴'},
{id:'daily',name:'日用'},
{id:'baby',name:'母婴'},
{id:'outdoor',name:'户外'}
];
const PRODUCTS=[
{cat:'kitchen',icon:'🥢',name:'竹制餐具套装',desc:'天然竹材制作，轻便耐用，替代一次性餐具',tags:['可降解','天然材料','可重复使用'],saving:'年省¥200+一次性餐具',eco:5},
{cat:'kitchen',icon:'🧽',name:'天然丝瓜络',desc:'植物纤维海绵，可完全降解，替代塑料海绵',tags:['100%天然','可降解','无化学添加'],saving:'减少塑料海绵污染',eco:5},
{cat:'kitchen',icon:'🍶',name:'玻璃储物罐',desc:'食品级玻璃，替代塑料保鲜盒，无BPA风险',tags:['食品级','可回收','无毒'],saving:'减少塑料容器使用',eco:4},
{cat:'kitchen',icon:'☕',name:'可重复使用咖啡滤网',desc:'不锈钢材质，终身使用，替代纸质滤纸',tags:['不锈钢','终身使用','零废弃'],saving:'年省¥150滤纸费用',eco:5},
{cat:'bath',icon:'🪥',name:'竹牙刷',desc:'竹柄可降解刷头，替代塑料牙刷',tags:['可降解','竹材','环保包装'],saving:'年减少4支塑料牙刷',eco:4},
{cat:'bath',icon:'🧴',name:'固体洗发皂',desc:'无塑料包装，天然成分，替代瓶装洗发水',tags:['无塑料','天然成分','浓缩耐用'],saving:'减少6个塑料瓶/年',eco:5},
{cat:'bath',icon:'🧼',name:'手工冷制皂',desc:'植物油制作，可降解，替代化学合成洗面奶',tags:['手工制作','可降解','温和'],saving:'减少塑料瓶包装',eco:4},
{cat:'daily',icon:'🛍️',name:'有机棉购物袋',desc:'GOTS认证有机棉，结实耐用，替代塑料袋',tags:['有机棉','GOTS认证','可清洗'],saving:'年减少200+塑料袋',eco:5},
{cat:'daily',icon:'📒',name:'再生纸笔记本',desc:'100%再生纸制作，环保大豆油墨印刷',tags:['再生纸','大豆油墨','FSC认证'],saving:'保护森林资源',eco:4},
{cat:'daily',icon:'🔋',name:'充电电池',desc:'可充电数百次，替代一次性电池',tags:['可充电','长寿命','含回收计划'],saving:'年减少40+废旧电池',eco:5},
{cat:'baby',icon:'👶',name:'有机棉婴儿服',desc:'GOTS有机棉，无荧光剂，对宝宝更安全',tags:['有机棉','无荧光剂','A类标准'],saving:'减少化学接触',eco:4},
{cat:'baby',icon:'🧷',name:'可水洗尿布',desc:'有机棉材质，可重复使用200+次',tags:['可水洗','有机棉','长寿命'],saving:'年省¥2000+纸尿裤',eco:5},
{cat:'outdoor',icon:'🚲',name:'环保骑行头盔',desc:'回收塑料制成，保护头部同时保护地球',tags:['回收材料','安全认证','可回收'],saving:'减少海洋塑料',eco:4},
{cat:'outdoor',icon:'🥤',name:'钛合金保温杯',desc:'轻量耐用终身使用，替代一次性杯子',tags:['钛合金','轻量','终身使用'],saving:'年省500+一次性杯',eco:5},
{cat:'outdoor',icon:'🧳',name:'再生涤纶背包',desc:'回收塑料瓶制成，结实耐用',tags:['回收材料','再生涤纶','耐用'],saving:'每个包回收20+塑料瓶',eco:4}
];
let activeTab='all';
function renderTabs(){
let h='';
CATEGORIES.forEach(c=>{h+=`<div class="tab ${activeTab===c.id?'active':''}" onclick="setTab('${c.id}')">${c.name}</div>`});
document.getElementById('tabs').innerHTML=h;
}
function renderList(query=''){
let filtered=PRODUCTS;
if(activeTab!=='all')filtered=filtered.filter(p=>p.cat===activeTab);
if(query)filtered=filtered.filter(p=>p.name.includes(query)||p.desc.includes(query)||p.tags.some(t=>t.includes(query)));
let h='';
filtered.forEach(p=>{
let dots='';
for(let i=0;i<5;i++)dots+=`<div class="e-dot ${i<p.eco?'active':''}"></div>`;
h+=`<div class="product-card"><div class="p-icon">${p.icon}</div><div class="p-name">${p.name}</div><div class="p-desc">${p.desc}</div><div class="p-tags">${p.tags.map(t=>`<span class="p-tag">${t}</span>`).join('')}</div><div class="eco-score">${dots}<span class="e-label">环保指数</span></div><div class="p-saving">💰 ${p.saving}</div></div>`;
});
if(!filtered.length)h='<div style="text-align:center;padding:40px;color:var(--text2);grid-column:1/-1">未找到相关产品</div>';
document.getElementById('productList').innerHTML=h;
}
function setTab(id){activeTab=id;renderTabs();renderList(document.getElementById('searchInput').value)}
function filterProducts(){renderList(document.getElementById('searchInput').value)}
renderTabs();renderList();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
