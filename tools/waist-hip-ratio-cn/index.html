<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 腰臀比计算器</title>
<meta property="og:title" content="📐 腰臀比计算器">
<meta property="og:description" content="📐 腰臀比计算器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线腰臀比(WHR)计算器，评估中心性肥胖和心血管疾病风险">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.gender-tabs{display:flex;gap:8px;margin-bottom:12px}
.gender-tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:14px;cursor:pointer;text-align:center;transition:all .2s;font-weight:600}
.gender-tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-group label{font-size:12px;color:var(--text-secondary);font-weight:500}
.input-group input{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;transition:all .2s}
.input-group input:focus{outline:none;border-color:var(--accent)}
.calc-btn{width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.calc-btn:hover{background:var(--accent-hover)}
.result-card{background:var(--tag-bg);border-radius:12px;padding:20px;text-align:center;margin-top:12px}
.result-val{font-size:56px;font-weight:800;color:var(--accent)}
.result-level{font-size:18px;margin-top:4px;font-weight:600}
.whr-bar{position:relative;height:30px;border-radius:15px;margin:16px 0 24px}
.whr-track{display:flex;height:100%;border-radius:15px;overflow:hidden}
.whr-seg{height:100%}
.whr-marker{position:absolute;top:-4px;width:4px;height:38px;background:var(--text);border-radius:2px;transition:left .5s ease;z-index:2}
.whr-labels{display:flex;font-size:10px;color:var(--text-secondary);margin-top:4px}
.whr-labels span{flex:1;text-align:center}
.gauge{position:relative;width:200px;height:110px;margin:0 auto 12px}
.gauge-bg{fill:none;stroke:var(--border);stroke-width:16}
.gauge-fill{fill:none;stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.gauge-center{font-size:36px;font-weight:800;fill:var(--accent);text-anchor:middle}
.gauge-label{font-size:12px;fill:var(--text-secondary);text-anchor:middle}
.level-table{width:100%;border-collapse:collapse;font-size:13px}
.level-table th{background:var(--accent);color:#fff;padding:10px;text-align:center;font-weight:600}
.level-table td{padding:10px;text-align:center;border-bottom:1px solid var(--border)}
.level-table tr.current{background:var(--tag-bg);font-weight:600}
.tip{font-size:12px;color:var(--text-secondary);margin-top:12px;line-height:1.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📐 腰臀比计算器</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">👤 性别</div>
<div class="gender-tabs">
<div class="gender-tab active" onclick="setGender('male',this)">👨 男性</div>
<div class="gender-tab" onclick="setGender('female',this)">👩 女性</div>
</div>
<div class="input-row">
<div class="input-group">
<label>腰围 (cm)</label>
<input type="number" id="waist" placeholder="80" min="40" max="200">
</div>
<div class="input-group">
<label>臀围 (cm)</label>
<input type="number" id="hip" placeholder="95" min="40" max="200">
</div>
</div>
<button class="calc-btn" onclick="calculate()">📐 计算腰臀比</button>
</div>
<div class="card" id="resultCard" style="display:none">
<div class="card-title">📊 腰臀比结果</div>
<svg class="gauge" viewBox="0 0 200 110">
<path class="gauge-bg" d="M20,100 A80,80 0 0,1 180,100"/>
<path class="gauge-fill" id="gaugeFill" d="M20,100 A80,80 0 0,1 180,100" stroke="var(--accent)"/>
<text class="gauge-center" id="gaugeText" x="100" y="90">--</text>
<text class="gauge-label" x="100" y="108">腰臀比</text>
</svg>
<div class="result-level" id="whrLevel" style="text-align:center">--</div>
<div class="whr-bar">
<div class="whr-track">
<div class="whr-seg" style="width:33%;background:#22c55e"></div>
<div class="whr-seg" style="width:34%;background:#eab308"></div>
<div class="whr-seg" style="width:33%;background:#ef4444"></div>
</div>
<div class="whr-marker" id="whrMarker"></div>
<div class="whr-labels"><span>低风险</span><span>中风险</span><span>高风险</span></div>
</div>
</div>
<div class="card">
<div class="card-title">📋 腰臀比健康标准</div>
<table class="level-table">
<tr><th>性别</th><th>低风险</th><th>中风险</th><th>高风险</th></tr>
<tr><td>👨 男性</td><td style="color:#22c55e">≤0.85</td><td style="color:#eab308">0.85-0.90</td><td style="color:#ef4444">&gt;0.90</td></tr>
<tr><td>👩 女性</td><td style="color:#22c55e">≤0.75</td><td style="color:#eab308">0.75-0.80</td><td style="color:#ef4444">&gt;0.80</td></tr>
</table>
</div>
<div class="card">
<div class="card-title">💡 测量方法</div>
<div class="tip">
• <b>腰围</b>：站立位，沿肋骨下缘与髂嵴之间的中点水平测量<br>
• <b>臀围</b>：水平测量臀部最宽处<br>
• 腰臀比是评估中心性肥胖的重要指标，比单纯BMI更有参考价值
</div>
</div>
<div class="footer">Gary's Tools · 腰臀比仅供参考</div>
</div>
<script>
let currentGender='male';
function setGender(g,el){
currentGender=g;
document.querySelectorAll('.gender-tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
}
function calculate(){
const waist=parseFloat(document.getElementById('waist').value);
const hip=parseFloat(document.getElementById('hip').value);
if(!waist||!hip){alert('请输入腰围和臀围');return}
const whr=waist/hip;
document.getElementById('gaugeText').textContent=whr.toFixed(2);
const pct=Math.min(100,Math.max(0,(whr/1.2)*100));
const circumference=2*Math.PI*80;
const arcLength=circumference*0.5;
const offset=arcLength*(1-pct/100);
document.getElementById('gaugeFill').style.strokeDasharray=arcLength;
document.getElementById('gaugeFill').style.strokeDashoffset=offset;
let level,color,maxWhr;
if(currentGender==='male'){
maxWhr=1.2;
if(whr<=0.85){level='低风险 ✓';color='#22c55e';}
else if(whr<=0.90){level='中风险 ⚠';color='#eab308';}
else{level='高风险 ✗';color='#ef4444';}
}else{
maxWhr=1.1;
if(whr<=0.75){level='低风险 ✓';color='#22c55e';}
else if(whr<=0.80){level='中风险 ⚠';color='#eab308';}
else{level='高风险 ✗';color='#ef4444';}
}
document.getElementById('gaugeFill').style.stroke=color;
const lvl=document.getElementById('whrLevel');
lvl.textContent=level;
lvl.style.color=color;
const markerPct=Math.min(100,Math.max(0,((whr-0.6)/0.6)*100));
document.getElementById('whrMarker').style.left=`calc(${markerPct}% - 2px)`;
document.getElementById('resultCard').style.display='block';
}
function toggleTheme(){
const html=document.documentElement;
const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
html.setAttribute('data-theme',next);
document.querySelector('.theme-toggle').textContent=next==='dark'?'☀️':'🌙';
}
</script>
</body>
</html>
