<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍎 iOS 27 新功能速查 - Gary's Tools</title>
<meta name="description" content="WWDC 2026 iOS 27 全部新功能一览，Siri AI、相机AI、快捷指令升级等特性速查表">
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--text2:#86868b;--blue:#0071e3;--purple:#af52de;--pink:#ff375f;--green:#34c759;--orange:#ff9500;--border:#e5e5ea;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,.06)}
[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--text2:#98989d;--border:#38383a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;-webkit-font-smoothing:antialiased}
.container{max-width:560px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header .badge{display:inline-block;padding:4px 12px;background:var(--blue);color:#fff;border-radius:20px;font-size:.75rem;font-weight:600;margin-bottom:8px}
header h1{font-size:1.8rem;font-weight:800;margin-bottom:6px}
header p{color:var(--text2);font-size:.85rem}
.cards{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);overflow:hidden}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.card-header .icon{font-size:1.5rem;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;flex-shrink:0}
.card-header h3{font-size:1.05rem;font-weight:700}
.card-header .tag{font-size:.7rem;padding:2px 8px;border-radius:10px;font-weight:600;margin-left:auto}
.tag-new{background:rgba(52,199,89,.15);color:var(--green)}
.tag-updated{background:rgba(0,113,227,.1);color:var(--blue)}
.feature-list{display:flex;flex-direction:column;gap:8px}
.feature{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.85rem;line-height:1.5}
.feature .f-icon{font-size:1.1rem;flex-shrink:0;margin-top:1px}
.feature .f-title{font-weight:600;margin-bottom:2px}
.feature .f-desc{font-size:.78rem;color:var(--text2)}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🍎 iOS 27 新功能速查 - Gary's Tools">
  <meta property="og:description" content="WWDC 2026 iOS 27 全部新功能一览，Siri AI、相机AI、快捷指令升级等特性速查表">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/ios-27-features/">
</head>
<body>
<div class="container">
<header>
<div class="badge">WWDC 2026 · 6月9日发布</div>
<h1>🍎 iOS 27 新功能速查</h1>
<p>Tim Cook谢幕之作 · 史上最大Siri更新</p>
</header>

<div class="cards" id="cards"></div>

<div class="card">
<h2>✅ 功能探索清单（标记已了解的功能）</h2>
<div style="margin-bottom:10px">
<div style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--text2);margin-bottom:4px"><span>探索进度</span><span id="featProgressText">0%</span></div>
<div style="width:100%;height:8px;background:var(--bg);border-radius:4px;overflow:hidden"><div id="featProgressBar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:4px;transition:width .4s"></div></div>
</div>
<div id="featChecklist" style="display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto"></div>
<div style="font-size:.72rem;color:var(--text2);text-align:center;margin-top:6px">💡 点击标记已了解的功能，进度自动保存</div>
</div>

<footer>功能以正式版为准 · 部分功能需设备支持</footer>
</div>

<script>
const FEATURES=[
{icon:'🧠',color:'#af52de',title:'Siri AI 全面升级',subtitle:'接入Google Gemini大模型',tag:'重磅更新',tagClass:'tag-new',items:[
{icon:'💬',title:'自然语言理解',desc:'不再需要固定指令，像和朋友聊天一样自然交流'},
{icon:'🔗',title:'跨应用操作',desc:'一句话完成"帮我把昨天照片发给妈妈并附上生日祝福"'},
{icon:'🔄',title:'第三方模型切换',desc:'支持手动切换到ChatGPT、Claude等AI模型'},
{icon:'📱',title:'全新唤起方式',desc:'从屏幕顶部中段下滑唤出Siri面板'},
{icon:'📲',title:'独立Siri App',desc:'Siri首次作为独立App出现在主屏幕上'},
]},
{icon:'📷',color:'#ff375f',title:'相机 & 照片 AI',subtitle:'图像识别+智能编辑',tag:'新功能',tagClass:'tag-new',items:[
{icon:'👁️',title:'相机集成Siri识别',desc:'拍摄物体/文字/植物自动识别并提供信息'},
{icon:'🖼️',title:'Reframe重构',desc:'AI自动优化照片构图，智能裁剪+旋转'},
{icon:'✨',title:'Extend扩展',desc:'AI补全照片边缘，扩展画面范围'},
{icon:'🖌️',title:'AI生成壁纸',desc:'描述你想要的壁纸风格，AI即刻生成'},
]},
{icon:'⚡',color:'#ff9500',title:'快捷指令 & 自动化',subtitle:'自然语义创建',tag:'升级',tagClass:'tag-updated',items:[
{icon:'🗣️',title:'自然语言创建',desc:'说"每天8点提醒我喝水"自动生成快捷指令'},
{icon:'📋',title:'AI语法检查',desc:'全系统文本输入框内置AI语法纠错'},
{icon:'🎯',title:'场景感知建议',desc:'根据时间和位置智能推荐快捷指令'},
]},
{icon:'🔒',color:'#34c759',title:'隐私 & 安全',subtitle:'AI时代的隐私保护',tag:'新功能',tagClass:'tag-new',items:[
{icon:'🛡️',title:'设备端AI处理',desc:'敏感数据优先在设备本地处理，不上传云端'},
{icon:'📊',title:'App隐私报告升级',desc:'实时查看哪些App访问了你的数据'},
{icon:'🔐',title:'AI权限管理',desc:'精细控制每个App的AI功能使用权限'},
]},
{icon:'🎮',color:'#0071e3',title:'其他亮点',subtitle:'体验优化',tag:'升级',tagClass:'tag-updated',items:[
{icon:'🏠',title:'控制中心重新设计',desc:'可自定义布局，支持更多快捷操作'},
{icon:'📝',title:'备忘录升级',desc:'AI摘要长笔记、手写转文字、语音转文字'},
{icon:'🗺️',title:'地图AR导航',desc:'支持AR实景导航，路线更直观'},
{icon:'🔋',title:'电池健康优化',desc:'智能充电学习习惯，延长电池寿命'},
]},
];

// ✅ 功能探索清单
function initFeatChecklist(){
  const allItems=[];
  FEATURES.forEach(cat=>{cat.items.forEach(item=>{allItems.push({cat:cat.icon+' '+cat.title,title:item.title,desc:item.desc});});});
  const saved=JSON.parse(localStorage.getItem('ios27Checklist')||'[]');
  const container=document.getElementById('featChecklist');
  container.innerHTML=allItems.map((item,i)=>{const c=saved.includes(i);return '<label style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg);border-radius:6px;cursor:pointer;font-size:.75rem;'+(c?'opacity:.5':'')+'"><input type="checkbox" data-fi="'+i+'" '+(c?'checked':'')+' style="width:16px;height:16px;accent-color:var(--blue);cursor:pointer;flex-shrink:0"><span style="'+(c?'text-decoration:line-through':'')+'"><b>'+item.title+'</b><span style="color:var(--text2);margin-left:4px">'+item.cat+'</span></span></label>';}).join('');
  updateFeatProgress();
  container.addEventListener('change',function(e){
    if(e.target.type!=='checkbox')return;
    const fi=parseInt(e.target.dataset.fi);
    let s=JSON.parse(localStorage.getItem('ios27Checklist')||'[]');
    if(e.target.checked){if(!s.includes(fi))s.push(fi);}else{s=s.filter(v=>v!==fi);}
    localStorage.setItem('ios27Checklist',JSON.stringify(s));
    const lb=e.target.closest('label');
    if(lb){lb.style.opacity=e.target.checked?'.5':'1';lb.querySelector('span').style.textDecoration=e.target.checked?'line-through':'none';}
    updateFeatProgress();
  });
}
function updateFeatProgress(){
  const total=document.querySelectorAll('#featChecklist input').length;
  const checked=document.querySelectorAll('#featChecklist input:checked').length;
  const pct=total?Math.round(checked/total*100):0;
  document.getElementById('featProgressText').textContent=checked+'/'+total+' ('+pct+'%)';
  document.getElementById('featProgressBar').style.width=pct+'%';
}

document.getElementById('cards').innerHTML=FEATURES.map(f=>`
<div class="card">
<div class="card-header">
<div class="icon" style="background:${f.color}15;color:${f.color}">${f.icon}</div>
<div>
<h3>${f.title}</h3>
<div style="font-size:.8rem;color:var(--text2)">${f.subtitle}</div>
</div>
<span class="tag ${f.tagClass}">${f.tag}</span>
</div>
<div class="feature-list">
${f.items.map(i=>`<div class="feature">
<span class="f-icon">${i.icon}</span>
<div><div class="f-title">${i.title}</div><div class="f-desc">${i.desc}</div></div>
</div>`).join('')}
</div>
</div>`).join('');
initFeatChecklist();
</script>
</body>
</html>
