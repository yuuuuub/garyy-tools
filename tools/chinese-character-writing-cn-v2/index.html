<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字书写练习 v2 - 笔顺动画与书写练习</title>
<meta property="og:title" content="汉字书写练习 v2 - 笔顺动画与书写练习">
<meta property="og:description" content="汉字书写练习 v2 - 在线笔顺动画与临摹练习 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="汉字书写练习 v2 - 在线笔顺动画展示与临摹练习，支持鼠标触屏书写">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍️</text></svg>">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--transition:0.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:800px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px;transition:var(--transition)}
.btn:hover{opacity:.85}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn-secondary{background:var(--border);color:var(--text)}
.input{width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:1.2rem;text-align:center;margin-bottom:12px}
.input:focus{outline:none;border-color:var(--blue)}
.char-display{display:flex;justify-content:center;align-items:center;gap:20px;margin:20px 0}
.char-big{font-size:8rem;font-weight:bold;background:var(--bg);border:2px solid var(--border);border-radius:var(--radius);width:160px;height:160px;display:flex;align-items:center;justify-content:center;position:relative}
.char-big .grid-overlay{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;pointer-events:none}
.char-big .grid-overlay div{border:1px dashed rgba(59,130,246,0.3)}
.info-row{display:flex;justify-content:center;gap:20px;margin:12px 0;font-size:.9rem;color:var(--text2)}
.info-row span{background:var(--bg);padding:4px 12px;border-radius:6px;border:1px solid var(--border)}
canvas{display:block;margin:12px auto;border:2px solid var(--border);border-radius:var(--radius);cursor:crosshair;touch-action:none}
.stroke-guide{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.stroke-num{width:28px;height:28px;background:var(--bg);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--blue);cursor:pointer;transition:var(--transition)}
.stroke-num:hover,.stroke-num.active{background:var(--blue);color:#fff}
.word-list{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.word-item{padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:.9rem;cursor:pointer;transition:var(--transition)}
.word-item:hover{border-color:var(--blue)}
.speed-row{display:flex;align-items:center;gap:8px;font-size:.85rem;margin:12px 0}
.speed-row input{width:120px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>✍️ 汉字书写练习 v2</h1>
  <p class="sub">笔顺动画与临摹练习，支持鼠标和触屏书写</p>

  <div class="card">
    <input class="input" id="charInput" placeholder="输入一个汉字" maxlength="1" value="永">
    <div class="btn-group" style="justify-content:center">
      <button class="btn" onclick="loadChar()">加载汉字</button>
      <button class="btn btn-secondary" onclick="playStrokeOrder()">▶ 笔顺动画</button>
      <button class="btn btn-secondary" onclick="clearPractice()">清除练习</button>
      <button class="btn btn-secondary" onclick="toggleTheme()">🌓 主题</button>
    </div>
  </div>

  <div class="card">
    <div class="char-display">
      <div class="char-big" id="charBig">
        <div class="grid-overlay"><div></div><div></div><div></div><div></div></div>
        <span id="charShow">永</span>
      </div>
      <div style="text-align:center">
        <div id="pinyinDisplay" style="font-size:1.5rem;color:var(--blue);margin-bottom:8px">yǒng</div>
        <div id="strokeCount" style="color:var(--text2);margin-bottom:4px">笔画数: 5</div>
        <div id="radicalInfo" style="color:var(--text2)">部首: 水</div>
      </div>
    </div>
    <div class="info-row">
      <span id="strokeDisplay">笔画: 横折钩</span>
      <span id="structureDisplay">结构: 独体字</span>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">笔顺指引</h3>
    <div class="stroke-guide" id="strokeGuide"></div>
    <div class="speed-row">
      <span>动画速度:</span>
      <input type="range" id="animSpeed" min="1" max="10" value="5">
      <span id="speedLabel">5x</span>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">临摹练习</h3>
    <canvas id="practiceCanvas" width="350" height="350"></canvas>
    <div class="btn-group" style="justify-content:center;margin-top:12px">
      <button class="btn btn-secondary" onclick="setBrushSize(3)">细笔</button>
      <button class="btn btn-secondary" onclick="setBrushSize(6)">中笔</button>
      <button class="btn btn-secondary" onclick="setBrushSize(10)">粗笔</button>
      <button class="btn btn-secondary" onclick="clearPractice()">清除</button>
      <button class="btn btn-secondary" onclick="toggleGuide()">显示/隐藏底字</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">常用组词</h3>
    <div class="word-list" id="wordList"></div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var charData = {
  '永':{pinyin:'yǒng',strokes:5,radical:'水',structure:'独体字',strokeNames:['点','横折钩','横撇','撇','捺'],words:['永远','永恒','永久','永生','永不','永远','勇往直前']},
  '大':{pinyin:'dà',strokes:3,radical:'大',structure:'独体字',strokeNames:['横','撇','捺'],words:['大家','大人','大小','伟大','大学','长大']},
  '人':{pinyin:'rén',strokes:2,radical:'人',structure:'独体字',strokeNames:['撇','捺'],words:['人民','人生','人家','别人','人才','人间']},
  '山':{pinyin:'shān',strokes:3,radical:'山',structure:'独体字',strokeNames:['竖','竖折','竖'],words:['山水','山上','大山','山河','火山','山林']},
  '水':{pinyin:'shuǐ',strokes:4,radical:'水',structure:'独体字',strokeNames:['竖钩','横撇','撇','捺'],words:['水果','水平','山水','水花','泉水','清水']},
  '日':{pinyin:'rì',strokes:4,radical:'日',structure:'独体字',strokeNames:['竖','横折','横','横'],words:['日子','日出','日记','日记','日月','每日']},
  '月':{pinyin:'yuè',strokes:4,radical:'月',structure:'独体字',strokeNames:['撇','横折钩','横','横'],words:['月亮','月光','岁月','月球','明月','月份']},
  '木':{pinyin:'mù',strokes:4,radical:'木',structure:'独体字',strokeNames:['横','竖','撇','捺'],words:['木头','树木','木材','木屋','木门','花木']},
  '火':{pinyin:'huǒ',strokes:4,radical:'火',structure:'独体字',strokeNames:['点','撇','撇','捺'],words:['火车','大火','火焰','火花','灭火','生火']},
  '土':{pinyin:'tǔ',strokes:3,radical:'土',structure:'独体字',strokeNames:['横','竖','横'],words:['土地','泥土','国土','土豆','土壤','尘土']},
  '田':{pinyin:'tián',strokes:5,radical:'田',structure:'独体字',strokeNames:['竖','横折','横','竖','横'],words:['田地','田野','稻田','田园','种田','农田']},
  '王':{pinyin:'wáng',strokes:4,radical:'王',structure:'独体字',strokeNames:['横','横','竖','横'],words:['国王','王子','大王','王者','王朝','女王']},
  '心':{pinyin:'xīn',strokes:4,radical:'心',structure:'独体字',strokeNames:['点','卧钩','点','点'],words:['心里','心中','心情','心愿','心灵','用心']},
  '天':{pinyin:'tiān',strokes:4,radical:'大',structure:'上下结构',strokeNames:['横','横','撇','捺'],words:['天气','天空','今天','每天','明天','天下']},
  '口':{pinyin:'kǒu',strokes:3,radical:'口',structure:'独体字',strokeNames:['竖','横折','横'],words:['口头','开口','门口','人口','出口','入口']},
  '手':{pinyin:'shǒu',strokes:4,radical:'手',structure:'独体字',strokeNames:['撇','横','横','竖钩'],words:['手里','手机','双手','手表','手工','帮手']},
  '目':{pinyin:'mù',strokes:5,radical:'目',structure:'独体字',strokeNames:['竖','横折','横','横','横'],words:['目光','目前','目标','目录','耳目','醒目']},
  '耳':{pinyin:'ěr',strokes:6,radical:'耳',structure:'独体字',strokeNames:['横','竖','竖','横','横','横'],words:['耳朵','耳机','木耳','耳目','银耳','悦耳']},
  '力':{pinyin:'lì',strokes:2,radical:'力',structure:'独体字',strokeNames:['横折钩','撇'],words:['力量','力气','努力','能力','电力','用力']}
};

var currentChar = '永';
var practiceCanvas, pCtx;
var drawing = false;
var brushSize = 4;
var showGuide = true;
var animFrame = null;
var strokeIdx = 0;

function loadChar() {
  var ch = document.getElementById('charInput').value.trim();
  if (!ch) return;
  if (!charData[ch]) {
    charData[ch] = {
      pinyin: '', strokes: ch.length || 1, radical: '', structure: '独体字',
      strokeNames: ['笔画1'], words: []
    };
  }
  currentChar = ch;
  var d = charData[ch];
  document.getElementById('charShow').textContent = ch;
  document.getElementById('pinyinDisplay').textContent = d.pinyin || '(未知读音)';
  document.getElementById('strokeCount').textContent = '笔画数: ' + d.strokes;
  document.getElementById('radicalInfo').textContent = d.radical ? '部首: ' + d.radical : '部首: 未知';
  document.getElementById('structureDisplay').textContent = '结构: ' + d.structure;
  document.getElementById('strokeDisplay').textContent = '笔画: ' + (d.strokeNames.join('、') || '未知');
  renderStrokeGuide(d.strokes);
  renderWords(d.words);
  drawGuideChar();
}

function renderStrokeGuide(count) {
  var html = '';
  for (var i = 0; i < count; i++) {
    html += '<div class="stroke-num" onclick="highlightStroke(' + i + ')">' + (i + 1) + '</div>';
  }
  document.getElementById('strokeGuide').innerHTML = html;
}

function highlightStroke(idx) {
  var nums = document.querySelectorAll('.stroke-num');
  nums.forEach(function(n, i) { n.classList.toggle('active', i === idx); });
}

function renderWords(words) {
  var html = '';
  words.forEach(function(w) {
    html += '<div class="word-item">' + w + '</div>';
  });
  document.getElementById('wordList').innerHTML = html;
}

function playStrokeOrder() {
  if (animFrame) cancelAnimationFrame(animFrame);
  strokeIdx = 0;
  var d = charData[currentChar];
  var count = d ? d.strokes : 5;
  var speed = parseInt(document.getElementById('animSpeed').value);
  var delay = 800 / speed;
  var highlightStep = function() {
    if (strokeIdx >= count) { strokeIdx = 0; return; }
    highlightStroke(strokeIdx);
    var guideCanvas = document.getElementById('practiceCanvas');
    drawStrokeOnCanvas(guideCanvas, strokeIdx, count);
    strokeIdx++;
    animFrame = setTimeout(highlightStep, delay);
  };
  highlightStep();
}

function drawStrokeOnCanvas(canvas, idx, total) {
  if (!showGuide) return;
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  drawGrid(ctx, w, h);
  ctx.font = (w * 0.7) + 'px "KaiTi", "STKaiti", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillText(currentChar, w / 2, h / 2);
  var progress = (idx + 1) / total;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, w, h * progress);
  ctx.clip();
  ctx.fillStyle = 'rgba(59,130,246,0.15)';
  ctx.fillText(currentChar, w / 2, h / 2);
  ctx.restore();
  ctx.fillStyle = 'var(--blue)';
  ctx.font = '14px sans-serif';
  ctx.fillText('第' + (idx + 1) + '笔', w / 2, h - 20);
}

function drawGrid(ctx, w, h) {
  ctx.strokeStyle = 'rgba(59,130,246,0.2)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
  ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
  ctx.moveTo(0, 0); ctx.lineTo(w, h);
  ctx.moveTo(w, 0); ctx.lineTo(0, h);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawGuideChar() {
  var canvas = document.getElementById('practiceCanvas');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid(ctx, canvas.width, canvas.height);
  if (showGuide) {
    ctx.font = (canvas.width * 0.7) + 'px "KaiTi", "STKaiti", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillText(currentChar, canvas.width / 2, canvas.height / 2);
  }
}

function setBrushSize(size) { brushSize = size; }

function clearPractice() {
  drawGuideChar();
}

function toggleGuide() {
  showGuide = !showGuide;
  drawGuideChar();
}

function initCanvas() {
  practiceCanvas = document.getElementById('practiceCanvas');
  pCtx = practiceCanvas.getContext('2d');

  function getPos(e) {
    var rect = practiceCanvas.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    var y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    var scaleX = practiceCanvas.width / rect.width;
    var scaleY = practiceCanvas.height / rect.height;
    return { x: x * scaleX, y: y * scaleY };
  }

  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    var pos = getPos(e);
    pCtx.beginPath();
    pCtx.moveTo(pos.x, pos.y);
  }

  function doDraw(e) {
    if (!drawing) return;
    e.preventDefault();
    var pos = getPos(e);
    pCtx.lineTo(pos.x, pos.y);
    pCtx.strokeStyle = '#e6edf3';
    pCtx.lineWidth = brushSize;
    pCtx.lineCap = 'round';
    pCtx.lineJoin = 'round';
    pCtx.stroke();
  }

  function endDraw() { drawing = false; }

  practiceCanvas.addEventListener('mousedown', startDraw);
  practiceCanvas.addEventListener('mousemove', doDraw);
  practiceCanvas.addEventListener('mouseup', endDraw);
  practiceCanvas.addEventListener('mouseleave', endDraw);
  practiceCanvas.addEventListener('touchstart', startDraw);
  practiceCanvas.addEventListener('touchmove', doDraw);
  practiceCanvas.addEventListener('touchend', endDraw);
}

function toggleTheme() {
  var h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
}

document.getElementById('charInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') loadChar();
});
document.getElementById('animSpeed').addEventListener('input', function() {
  document.getElementById('speedLabel').textContent = this.value + 'x';
});

loadChar();
initCanvas();
</script>
</body>
</html>
