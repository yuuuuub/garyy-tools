<div class="container"><h1>📝 Markdown转HTML</h1><p class="sub">在线Markdown转HTML工具</p>
<div class="card"><div class="label">输入Markdown</div>
<textarea id="inputMarkdown" placeholder="# 标题

console.log('Hello World');
```"></textarea>
<div class="btn-group">
<button class="btn" onclick="convertToHtml()">转换为HTML</button>
<button class="btn" onclick="previewHtml()">预览</button>
<button class="btn" onclick="copyHtml()">复制HTML</button>
<button class="btn" onclick="copyMarkdown()">复制Markdown</button>
</div></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function convertToHtml(){
  var markdown=document.getElementById('inputMarkdown').value;
  var r=document.getElementById('result');
  if(!markdown){r.innerHTML='<div class="card" style="color:var(--red)">请输入Markdown</div>';return;}
  var html=markdownToHtml(markdown);
  r.innerHTML='<div class="card"><div class="section"><h3>📋 HTML代码</h3><div class="result-block" id="resultText">'+escapeHtml(html)+'</div><button class="copy-btn" onclick="copyResult()">复制HTML</button></div></div>';
}
function previewHtml(){
  var markdown=document.getElementById('inputMarkdown').value;
  var r=document.getElementById('result');
  if(!markdown){r.innerHTML='<div class="card" style="color:var(--red)">请输入Markdown</div>';return;}
  var html=markdownToHtml(markdown);
  r.innerHTML='<div class="card"><div class="section"><h3>👁️ 预览</h3><div class="preview">'+html+'</div></div></div>';
}
function copyHtml(){
  var markdown=document.getElementById('inputMarkdown').value;
  if(!markdown){alert('请输入Markdown');return;}
  var html=markdownToHtml(markdown);
  navigator.clipboard.writeText(html).then(function(){alert('已复制HTML');}).catch(function(){alert('复制失败');});
}
function copyMarkdown(){
  var markdown=document.getElementById('inputMarkdown').value;
  if(!markdown){alert('请输入Markdown');return;}
  navigator.clipboard.writeText(markdown).then(function(){alert('已复制Markdown');}).catch(function(){alert('复制失败');});
}
function markdownToHtml(md){
  var html=md;
  html=html.replace(/^```(\w*)\n([\s\S]*?)```/gm,function(match,lang,code){
    return'<pre><code class="language-'+lang+'">'+escapeHtml(code.trim())+'</code></pre>';
  });
  html=html.replace(/`([^`]+)`/g,'<code>$1</code>');
  html=html.replace(/^#{6}\s+(.+)$/gm,'<h6>$1</h6>');
  html=html.replace(/^#{5}\s+(.+)$/gm,'<h5>$1</h5>');
  html=html.replace(/^#{4}\s+(.+)$/gm,'<h4>$1</h4>');
  html=html.replace(/^#{3}\s+(.+)$/gm,'<h3>$1</h3>');
  html=html.replace(/^#{2}\s+(.+)$/gm,'<h2>$1</h2>');
  html=html.replace(/^#\s+(.+)$/gm,'<h1>$1</h1>');
  html=html.replace(/^>\s+(.+)$/gm,'<blockquote>$1</blockquote>');
  html=html.replace(/^---+$/gm,'<hr>');
  html=html.replace(/^\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  html=html.replace(/^\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  html=html.replace(/^\*(.+?)\*/g,'<em>$1</em>');
  html=html.replace(/^~~(.+?)~~/g,'<del>$1</del>');
  html=html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  html=html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">');
  html=html.replace(/^\s*[-*+]\s+(.+)$/gm,'<li>$1</li>');
  html=html.replace(/(<li>.*<\/li>\n?)+/g,function(match){return'<ul>'+match+'</ul>';});
  html=html.replace(/^\s*\d+\.\s+(.+)$/gm,'<li>$1</li>');
  html=html.replace(/(<li>.*<\/li>\n?)+/g,function(match){return'<ol>'+match+'</ol>';});
  html=html.replace(/\n{2,}/g,'</p><p>');
  html='<p>'+html+'</p>';
  html=html.replace(/<p>\s*<(h[1-6]|ul|ol|blockquote|pre|hr)/g,'<$1');
  html=html.replace(/<\/(h[1-6]|ul|ol|blockquote|pre)>\s*<\/p>/g,'</$1>');
  html=html.replace(/<p>\s*<\/p>/g,'');
  return html;
}
function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyResult(){
  var text=document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
convertToHtml();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
