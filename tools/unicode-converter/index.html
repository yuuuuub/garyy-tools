<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unicode转换器</title><meta name="description" content="Unicode转换器 - 在线Unicode编码转换工具"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:6px;cursor:pointer;font-size:.85rem}.tab.active{background:var(--blue);color:#fff}.char-list{margin-top:16px}.char-item{display:flex;align-items:center;gap:12px;padding:8px;background:var(--bg);border-radius:6px;margin-bottom:8px}.char-symbol{font-size:1.5rem;min-width:40px;text-align:center}.char-info{flex:1;font-size:.85rem;color:var(--text2)}.char-unicode{font-family:monospace;color:var(--blue)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style><meta property="og:title" content="Unicode转换器"><meta property="og:description" content="Unicode转换器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔤 Unicode转换器</h1><p class="sub">在线Unicode编码转换工具</p>
<div class="tabs">
<button class="tab active" onclick="switchTab('text')">文本→Unicode</button>
<button class="tab" onclick="switchTab('unicode')">Unicode→文本</button>
<button class="tab" onclick="switchTab('html')">HTML实体</button>
</div>
<div class="card" id="textCard">
<div class="label">输入文本</div>
<textarea id="inputText" placeholder="输入要转换的文本..."></textarea>
<div class="btn-group">
<button class="btn" onclick="textToUnicode()">转换为Unicode</button>
<button class="btn" onclick="textToHtmlEntity()">转换为HTML实体</button>
<button class="btn" onclick="textToEscape()">转换为转义序列</button>
</div></div>
<div class="card" id="unicodeCard" style="display:none">
<div class="label">输入Unicode（如 U+4E2D 或 &#x4E2D;）</div>
<textarea id="inputUnicode" placeholder="U+4E2D 或 &#x4E2D;"></textarea>
<button class="btn" onclick="unicodeToText()">转换为文本</button>
</div>
<div class="card" id="htmlCard" style="display:none">
<div class="label">输入HTML实体（如 &amp;#20013;）</div>
<textarea id="inputHtml" placeholder="&amp;#20013;"></textarea>
<button class="btn" onclick="htmlToText()">转换为文本</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var currentTab='text';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  event.target.classList.add('active');
  document.getElementById('textCard').style.display=tab==='text'?'block':'none';
  document.getElementById('unicodeCard').style.display=tab==='unicode'?'block':'none';
  document.getElementById('htmlCard').style.display=tab==='html'?'block':'none';
  document.getElementById('result').innerHTML='';
}
function textToUnicode(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var unicode=[];
  for(var i=0;i<text.length;i++){
    var code=text.codePointAt(i);
    if(code>0xFFFF)i++;
    unicode.push('U+'+code.toString(16).toUpperCase().padStart(4,'0'));
  }
  showResult(unicode.join(' '),'Unicode编码');
}
function textToHtmlEntity(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var entities=[];
  for(var i=0;i<text.length;i++){
    var code=text.codePointAt(i);
    if(code>0xFFFF)i++;
    entities.push('&#'+code+';');
  }
  showResult(entities.join(''),'HTML实体');
}
function textToEscape(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var escapes=[];
  for(var i=0;i<text.length;i++){
    var code=text.codePointAt(i);
    if(code>0xFFFF)i++;
    escapes.push('\\u'+code.toString(16).padStart(4,'0'));
  }
  showResult(escapes.join(''),'转义序列');
}
function unicodeToText(){
  var input=document.getElementById('inputUnicode').value.trim();
  var r=document.getElementById('result');
  if(!input){r.innerHTML='<div class="card" style="color:var(--red)">请输入Unicode</div>';return;}
  try{
    var text='';
    var regex=/U\+([0-9A-Fa-f]{4,6})|&#x([0-9A-Fa-f]+);|&#(\d+);/g;
    var match;
    while((match=regex.exec(input))!==null){
      var code=parseInt(match[1]||match[2]||match[3],16);
      text+=String.fromCodePoint(code);
    }
    if(!text)text=String.fromCodePoint(parseInt(input.replace('U+',''),16));
    showResult(text,'转换结果');
  }catch(e){
    r.innerHTML='<div class="card" style="color:var(--red)">转换失败: '+e.message+'</div>';
  }
}
function htmlToText(){
  var input=document.getElementById('inputHtml').value.trim();
  var r=document.getElementById('result');
  if(!input){r.innerHTML='<div class="card" style="color:var(--red)">请输入HTML实体</div>';return;}
  try{
    var text='';
    var regex=/&#(\d+);|&#x([0-9A-Fa-f]+);/g;
    var match;
    while((match=regex.exec(input))!==null){
      var code=parseInt(match[1]||match[2],match[1]?10:16);
      text+=String.fromCodePoint(code);
    }
    showResult(text,'转换结果');
  }catch(e){
    r.innerHTML='<div class="card" style="color:var(--red)">转换失败: '+e.message+'</div>';
  }
}
function showResult(text,title){
  var r=document.getElementById('result');
  var html='<div class="card"><div class="section"><h3>📋 '+title+'</h3>';
  html+='<div class="result-block" id="resultText">'+escapeHtml(text)+'</div>';
  html+='<button class="copy-btn" onclick="copyResult()">复制结果</button></div></div>';
  r.innerHTML=html;
}
function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyResult(){
  var text=document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
textToUnicode();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
