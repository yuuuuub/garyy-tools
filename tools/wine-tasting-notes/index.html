<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍷 品酒笔记</title>
<meta property="og:title" content="🍷 品酒笔记">
<meta property="og:description" content="🍷 品酒笔记 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="记录品酒体验，追踪品酒笔记和评分">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍷</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1}.ctn{padding:0}}
.li{padding:14px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.gr .st{text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.stars{color:var(--warn);font-size:1rem}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;color:#fff;margin-right:4px}
.tag.red{background:#9b2335}.tag.white{background:#d4c5a9;color:#333}.tag.rose{background:#e8a0bf;color:#333}.tag.sparkling{background:#c9b037;color:#333}
.nose,.palate{font-size:.85rem;color:var(--text2);margin-top:4px}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar button{padding:6px 14px;font-size:.85rem;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:20px;cursor:pointer}
.filter-bar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🍷 品酒笔记</h1><p>记录每一次品酒体验</p></div>

<div class="gr">
<div class="st"><div class="nm" id="sTotal">0</div><div class="lb">总记录</div></div>
<div class="st"><div class="nm" id="sRed">0</div><div class="lb">红葡萄酒</div></div>
<div class="st"><div class="nm" id="sWhite">0</div><div class="lb">白葡萄酒</div></div>
<div class="st"><div class="nm" id="sAvg">-</div><div class="lb">平均评分</div></div>
</div>

<div class="cd" style="margin-top:16px"><h2>添加品酒记录</h2>
<div class="fr">
<div><label>酒名</label><input type="text" id="wName" placeholder="如：拉菲古堡"></div>
<div><label>酒庄/品牌</label><input type="text" id="wWinery" placeholder="酒庄名称"></div>
</div>
<div class="fr">
<div><label>年份</label><input type="number" id="wVintage" placeholder="2020"></div>
<div><label>类型</label><select id="wType"><option value="red">红葡萄酒</option><option value="white">白葡萄酒</option><option value="rose">桃红</option><option value="sparkling">起泡酒</option></select></div>
</div>
<div class="fr">
<div><label>产区</label><input type="text" id="wRegion" placeholder="如：波尔多"></div>
<div><label>评分 (1-100)</label><input type="number" id="wScore" min="1" max="100" placeholder="85"></div>
</div>
<label>香气</label><textarea id="wNose" placeholder="黑醋栗、橡木、香草..."></textarea>
<label>口感</label><textarea id="wPalate" placeholder="单宁柔和、果味浓郁..."></textarea>
<label>品酒笔记</label><textarea id="wNotes" placeholder="整体感受和搭配建议..."></textarea>
<label>价格区间</label><select id="wPrice"><option value="">未记录</option><option value="budget">经济型 (&lt;100元)</option><option value="mid">中端 (100-500元)</option><option value="premium">高端 (500-2000元)</option><option value="luxury">奢华 (&gt;2000元)</option></select>
<div class="bg"><button onclick="addWine()">添加记录</button></div>
<div id="wMsg" style="display:none;text-align:center;padding:8px;border-radius:8px;margin-top:8px;font-size:.85rem"></div></div>

<div class="cd"><h2>品酒记录</h2>
<div class="filter-bar">
<button class="active" onclick="setFilter('all',this)">全部</button>
<button onclick="setFilter('red',this)">红葡萄酒</button>
<button onclick="setFilter('white',this)">白葡萄酒</button>
<button onclick="setFilter('rose',this)">桃红</button>
<button onclick="setFilter('sparkling',this)">起泡酒</option>
</div>
<div id="wineList" class="es">暂无记录</div>
</div>
</div>

<script>
let wines=JSON.parse(localStorage.getItem('wineTasting')||'[]');
let filter='all';
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function save(){localStorage.setItem('wineTasting',JSON.stringify(wines))}
function showMsg(m,t){const e=$('wMsg');e.textContent=m;e.style.display='block';e.style.background=t==='error'?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)';e.style.color=t==='error'?'var(--danger)':'var(--success)';setTimeout(()=>e.style.display='none',2000)}
function addWine(){const name=$('wName').value.trim(),winery=$('wWinery').value.trim(),vintage=$('wVintage').value,type=$('wType').value,region=$('wRegion').value.trim(),score=parseInt($('wScore').value),nose=$('wNose').value.trim(),palate=$('wPalate').value.trim(),notes=$('wNotes').value.trim(),price=$('wPrice').value;if(!name){showMsg('请填写酒名','error');return}wines.push({name,winery,vintage,type,region,score:score||0,nose,palate,notes,price,addedAt:Date.now()});save();render();showMsg('记录已添加','success');['wName','wWinery','wVintage','wRegion','wScore','wNose','wPalate','wNotes'].forEach(id=>$(id).value='')}
function setFilter(f,el){filter=f;document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function render(){const list=filter==='all'?wines:wines.filter(w=>w.type===filter);const scored=wines.filter(w=>w.score>0);$('sTotal').textContent=wines.length;$('sRed').textContent=wines.filter(w=>w.type==='red').length;$('sWhite').textContent=wines.filter(w=>w.type==='white').length;$('sAvg').textContent=scored.length?Math.round(scored.reduce((s,w)=>s+w.score,0)/scored.length):'-';const typeMap={red:'红葡萄酒',white:'白葡萄酒',rose:'桃红',sparkling:'起泡酒'};const priceMap={budget:'经济型',mid:'中端',premium:'高端',luxury:'奢华'};$('wineList').innerHTML=list.length?list.map((w,i)=>{const realIdx=wines.indexOf(w);return '<div class="li"><div style="display:flex;justify-content:space-between"><div><span style="font-weight:600">'+esc(w.name)+'</span>'+(w.winery?'<span style="color:var(--text2)"> · '+esc(w.winery)+'</span>':'')+(w.vintage?'<span style="color:var(--text2)"> ('+esc(w.vintage)+')</span>':'')+'<br><span class="tag '+w.type+'">'+typeMap[w.type]+'</span>'+(w.region?'<span style="color:var(--text2);font-size:.8rem;margin-left:4px">'+esc(w.region)+'</span>':'')+(w.price?'<span style="color:var(--text2);font-size:.8rem;margin-left:4px">'+priceMap[w.price]+'</span>':'')+'</div><div style="text-align:right"><div style="font-size:1.2rem;font-weight:700;color:var(--warn)">'+(w.score||'-')+'</div><div style="font-size:.7rem;color:var(--text2)">/100</div></div></div>'+(w.nose?'<div class="nose">👃 '+esc(w.nose)+'</div>':'')+(w.palate?'<div class="palate">👅 '+esc(w.palate)+'</div>':'')+(w.notes?'<div style="font-size:.85rem;margin-top:6px;font-style:italic;color:var(--text2)">"'+esc(w.notes)+'"</div>':'')+'<div class="bg"><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="removeWine('+realIdx+')">删除</button></div></div>'}).join(''):'<div class="es">暂无记录</div>'}
function removeWine(i){wines.splice(i,1);save();render()}
render()
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
