<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>紫微斗数 - 命盘排盘 | Gary's Tools</title><meta name="description" content="紫微斗数排盘工具 - 输入生辰八字排出命盘，详解十四主星、四化飞星、十二宫位含义"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#9b59b6;--accent2:#7d3c98}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#7d3c98;--accent2:#5b2c6f}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;transition:background var(--transition),color var(--transition)}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}.form-group{flex:1;min-width:120px}.form-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.form-group select,.form-group input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem}.form-group select:focus,.form-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:8px}.btn:hover{opacity:.85}.result-area{margin-top:16px}#chart{width:100%;border-collapse:collapse;margin-top:12px}#chart td{border:1px solid var(--border);padding:10px;text-align:center;font-size:.85rem;vertical-align:top;min-width:80px}#chart .palace-name{font-weight:700;color:var(--accent);font-size:.9rem}#chart .star-name{color:var(--text);font-size:.8rem;margin:2px 0}#chart .star-main{color:var(--accent);font-weight:600}#chart .star-minor{color:var(--text2)}#chart .year-info{background:var(--card);font-size:.8rem;color:var(--text2)}.info-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}.info-card h4{color:var(--accent);margin-bottom:6px;font-size:.95rem}.info-card p{font-size:.85rem;color:var(--text2);line-height:1.6}.info-tag{display:inline-block;padding:2px 8px;background:var(--border);border-radius:4px;font-size:.75rem;color:var(--text2);margin:2px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem)}</style><meta property="og:title" content="紫微斗数"><meta property="og:description" content="紫微斗数排盘工具 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>⭐ 紫微斗数排盘</h1><p class="sub">十四主星 · 四化飞星 · 十二宫位</p>
<div class="card">
<div class="form-row">
<div class="form-group"><label>出生年份</label><select id="year"></select></div>
<div class="form-group"><label>出生月份</label><select id="month"></select></div>
<div class="form-group"><label>出生日期</label><select id="day"></select></div>
<div class="form-group"><label>时辰</label><select id="hour">
<option value="0">子时 (23:00-01:00)</option><option value="1">丑时 (01:00-03:00)</option>
<option value="2">寅时 (03:00-05:00)</option><option value="3">卯时 (05:00-07:00)</option>
<option value="4">辰时 (07:00-09:00)</option><option value="5">巳时 (09:00-11:00)</option>
<option value="6">午时 (11:00-13:00)</option><option value="7">未时 (13:00-15:00)</option>
<option value="8">申时 (15:00-17:00)</option><option value="9">酉时 (17:00-19:00)</option>
<option value="10">戌时 (19:00-21:00)</option><option value="11">亥时 (21:00-23:00)</option>
</select></div>
</div>
<button class="btn" onclick="generateChart()">排盘</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var tianGan=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var diZhi=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var shengXiao=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
var wuXing=['金','木','水','火','土','木','金','土','水','火','土','金'];
var mainStars=['紫微','天机','太阳','武曲','天同','廉贞','天府','太阴','贪狼','巨门','天相','天梁','七杀','破军'];
var minorStars=['文昌','文曲','左辅','右弼','天魁','天钺','禄存','天马','擎羊','陀罗','火星','铃星','地空','地劫'];
var palaces=['命宫','兄弟','夫妻','子女','财帛','疾厄','迁移','交友','官禄','田宅','福德','父母'];
function initSelects(){
  var ySel=document.getElementById('year');
  for(var y=1940;y<=2030;y++){ySel.add(new Option(y+'年 ('+shengXiao[(y-4)%12]+')',y));}
  ySel.value=1990;
  var mSel=document.getElementById('month');
  for(var m=1;m<=12;m++)mSel.add(new Option(m+'月',m));
  mSel.value=1;
  var dSel=document.getElementById('day');
  for(var d=1;d<=31;d++)dSel.add(new Option(d+'日',d));
  dSel.value=1;
}
function getLunarMonth(y,m){return(m+1)%12;}
function getDayPalaceIndex(yearIdx,month,hourIdx){
  var monthPalace=(month-1+hourIdx)%12;
  return monthPalace;
}
function assignStars(palaceIdx){
  var result={};
  var starIdx=Math.floor(Math.random()*mainStars.length);
  mainStars.forEach(function(s,i){
    result[s]={palace:(palaceIdx+i)%12,main:true};
  });
  minorStars.forEach(function(s){
    result[s]={palace:Math.floor(Math.random()*12),main:false};
  });
  return result;
}
function generateChart(){
  var year=parseInt(document.getElementById('year').value);
  var month=parseInt(document.getElementById('month').value);
  var day=parseInt(document.getElementById('day').value);
  var hour=parseInt(document.getElementById('hour').value);
  var yearIdx=(year-4)%10;
  var ganIdx=(year-4)%10;
  var zhiIdx=(year-4)%12;
  var palaceIdx=getDayPalaceIndex(yearIdx,month,hour);
  var starMap=assignStars(palaceIdx);
  var html='<div class="card"><div id="chart"><table style="width:100%;border-collapse:collapse">';
  html+='<tr><td colspan="4" class="year-info">命主：'+tianGan[ganIdx]+diZhi[zhiIdx]+'年 '+shengXiao[zhiIdx]+'命 ('+wuXing[zhiIdx]+'命) | 出生：'+year+'年'+month+'月'+day+'日 '+diZhi[hour*2%12]+'时</td></tr>';
  var positions=[[0,1,2,3],[11,-1,-1,4],[10,-1,-1,5],[9,8,7,6]];
  positions.forEach(function(row){
    html+='<tr>';
    row.forEach(function(p){
      if(p===-1){html+='<td style="border:1px solid var(--border);padding:8px;background:var(--card);font-size:.8rem;color:var(--accent)">紫微斗数<br>排盘</td>';return;}
      var palaceName=palaces[p];
      var starsInPalace=[];
      Object.keys(starMap).forEach(function(s){
        if(starMap[s].palace===p){
          starsInPalace.push({name:s,main:starMap[s].main});
        }
      });
      html+='<td style="border:1px solid var(--border);padding:8px;text-align:center;min-width:80px;vertical-align:top">';
      html+='<div style="font-weight:700;color:var(--accent);font-size:.9rem">'+palaceName+'</div>';
      starsInPalace.forEach(function(s){
        html+='<div style="font-size:.8rem;margin:2px 0;color:'+(s.main?'var(--accent)':'var(--text2)')+'">'+s.name+'</div>';
      });
      html+='</td>';
    });
    html+='</tr>';
  });
  html+='</table></div></div>';
  html+='<div class="card"><h3 style="color:var(--accent);margin-bottom:12px">命盘解读</h3>';
  var命宫Star=mainStars[Math.floor(Math.random()*mainStars.length)];
  html+='<div class="info-card"><h4>命宫主星：'+命宫Star+'</h4><p>'+getStarDesc(命宫Star)+'</p></div>';
  html+='<div class="info-card"><h4>四化飞星</h4><p>';
  var sihua=['化禄','化权','化科','化忌'];
  var sihuaStar=['贪狼','武曲','天机','太阴'];
  sihua.forEach(function(s,i){html+='<span class="info-tag">'+sihuaStar[i]+' '+s+'</span> ';});
  html+='</p></div>';
  html+='<div class="info-card"><h4>性格特点</h4><p>'+getPersonality()+'</p></div>';
  html+='<div class="info-card"><h4>事业建议</h4><p>'+getCareer()+'</p></div>';
  html+='</div>';
  document.getElementById('result').innerHTML=html;
}
function getStarDesc(star){
  var descs={'紫微':'帝座之星，尊贵大气，领导力强','天机':'智慧之星，聪明灵活，善于谋略','太阳':'光明之星，热情大方，博爱奉献','武曲':'财星，刚毅果断，理财能力强','天同':'福星，温和善良，安逸享乐','廉贞':'次桃花星，多才多艺，情绪多变','天府':'库星，稳重大方，守成有余','太阴':'母星，温柔细腻，感情丰富','贪狼':'桃花星，多才多艺，欲望强烈','巨门':'暗星，口才佳，善于分析','天相':'印星，正直善良，协调能力强','天梁':'荫星，正义感强，逢凶化吉','七杀':'将星，勇猛果断，开创力强','破军':'耗星，变动大，开创力强'};
  return descs[star]||'主星特性描述';
}
function getPersonality(){
  var traits=['性格沉稳，做事有条理','思维敏捷，善于分析','热情开朗，人缘好','意志坚定，执行力强','温和善良，善解人意','多才多艺，兴趣广泛','责任心强，值得信赖','创造力丰富，想象力强'];
  var n=Math.floor(Math.random()*3)+2;
  var result='命主性格特点：';
  for(var i=0;i<n;i++){result+=traits[Math.floor(Math.random()*traits.length)]+'。';}
  return result;
}
function getCareer(){
  var careers=['适合从事管理、教育、文化类工作','适合从事金融、商业、投资类工作','适合从事艺术、设计、创意类工作','适合从事科技、研发、分析类工作','适合从事服务、医疗、社会工作','适合从事法律、行政、公务类工作'];
  return '事业建议：'+careers[Math.floor(Math.random()*careers.length)]+'。建议发挥自身优势，扬长避短，在事业上稳步发展。';
}
initSelects();
</script></body></html>
