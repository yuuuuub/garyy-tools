function generate(){
  const cuisine=document.getElementById('cuisineSelect').value;
  const diff=document.getElementById('diffSelect').value;
  const ing=document.getElementById('ingredientInput').value.trim();
  let pool=RECIPES.slice();
  if(cuisine!=='all')pool=pool.filter(r=>r.cuisine===cuisine);
  if(diff!=='all')pool=pool.filter(r=>r.difficulty===diff);
  if(ing)pool=pool.filter(r=>r.ingredients.some(i=>i.name.includes(ing)));
  if(!pool.length){document.getElementById('result').innerHTML='';document.getElementById('empty').style.display='block';document.getElementById('empty').querySelector('p').textContent='没有匹配的菜谱，请调整筛选条件';return}
  const r=pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('empty').style.display='none';
  document.getElementById('result').innerHTML=`
    <div class="result-card">
      <h2>${r.icon} ${r.name}</h2>
      <div class="sub">${r.en} · ${r.cuisine} · ${r.difficulty} · ⏱️ ${r.time}</div>
      <div class="tags"><span>${r.cuisine}</span><span>${r.difficulty}</span><span>⏱️ ${r.time}</span></div>
      <div class="section-title">📋 食材清单</div>
      <div class="ingredient-grid">${r.ingredients.map(i=>`<div class="ingredient-item"><span class="name">${i.name}</span><span class="amount">${i.amount}</span></div>`).join('')}</div>
      <div class="section-title">👨‍🍳 烹饪步骤</div>
      <ol class="step-list">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
      <div class="tip-box"><strong>💡 小贴士：</strong>${r.tips}</div>
      <div class="history-box"><strong>📖 历史典故：</strong>${r.history}</div>
    </div>`;
  const btn=document.getElementById('generateBtn');
  btn.classList.add('spinning');
  setTimeout(()=>btn.classList.remove('spinning'),600);
}
document.getElementById('generateBtn').addEventListener('click',generate);
document.getElementById('resetBtn').addEventListener('click',()=>{
  document.getElementById('cuisineSelect').value='all';
  document.getElementById('diffSelect').value='all';
  document.getElementById('ingredientInput').value='';
  document.getElementById('result').innerHTML='';
  document.getElementById('empty').style.display='block';
  document.getElementById('empty').querySelector('p').textContent='点击"随机生成"获取菜谱';
});
</script>
