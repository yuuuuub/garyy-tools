<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 待办矩阵</title>
<meta name="description" content="艾森豪威尔矩阵，按紧急和重要程度分类待办事项，提升效率">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quad{border-radius:var(--radius);padding:16px;border:1px solid var(--border);min-height:150px}
.q1{background:rgba(239,68,68,.08);border-color:var(--danger)}
.q2{background:rgba(245,158,11,.08);border-color:var(--warn)}
.q3{background:rgba(59,130,246,.08);border-color:var(--accent)}
.q4{background:rgba(107,114,128,.08);border-color:var(--text2)}
.quad h3{font-size:.9rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.q1 h3{color:var(--danger)}.q2 h3{color:var(--warn)}.q3 h3{color:var(--accent)}.q4 h3{color:var(--text2)}
.task-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.task-item:last-child{border-bottom:none}
.task-item.done span{text-decoration:line-through;opacity:.5}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;margin-right:4px}
.tag.urgent{background:var(--danger);color:#fff}.tag.important{background:var(--warn);color:#fff}.tag.normal{background:var(--accent);color:#fff}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.gr .st{text-align:center;padding:12px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.75rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📋 待办矩阵">
<meta property="og:description" content="艾森豪威尔矩阵，按紧急和重要程度分类待办事项">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📋 待办矩阵</h1><p>艾森豪威尔矩阵，按紧急和重要程度分类待办</p></div>

<div class="cd"><h2>添加任务</h2>
<input type="text" id="taskInput" placeholder="输入任务名称" onkeydown="if(event.key==='Enter')addTask()">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<div><label>紧急程度</label><select id="urgent"><option value="1">紧急</option><option value="0" selected>不紧急</option></select></div>
<div><label>重要程度</label><select id="important"><option value="1">重要</option><option value="0" selected>不重要</option></select></div>
</div>
<div class="bg"><button onclick="addTask()">添加任务</button></div></div>

<div class="cd"><h2>矩阵视图</h2>
<div class="matrix">
<div class="quad q1"><h3>🔴 紧急且重要</h3><div id="q1"></div></div>
<div class="quad q2"><h3>🟡 紧急不重要</h3><div id="q2"></div></div>
<div class="quad q3"><h3>🔵 重要不紧急</h3><div id="q3"></div></div>
<div class="quad q4"><h3>⚪ 不紧急不重要</h3><div id="q4"></div></div>
</div></div>

<div class="cd"><h2>统计</h2>
<div class="gr" id="stats"></div>
<div class="bg"><button class="sec" onclick="clearDone()">清除已完成</button><button class="sec" onclick="clearAll()">清空全部</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let tasks=JSON.parse(localStorage.getItem('tm_tasks')||'[]');

function addTask(){
  const text=$('taskInput').value.trim();
  if(!text){alert('请输入任务');return;}
  tasks.push({id:Date.now(),text,urgent:!!+$('urgent').value,important:!!+$('important').value,done:false});
  save();render();$('taskInput').value='';
}

function toggleTask(id){
  const t=tasks.find(x=>x.id===id);
  if(t){t.done=!t.done;save();render();}
}

function deleteTask(id){tasks=tasks.filter(x=>x.id!==id);save();render();}
function clearDone(){tasks=tasks.filter(t=>!t.done);save();render();}
function clearAll(){tasks=[];save();render();}
function save(){localStorage.setItem('tm_tasks',JSON.stringify(tasks));}

function render(){
  const q={q1:[],q2:[],q3:[],q4:[]};
  tasks.forEach(t=>{
    if(t.urgent&&t.important)q.q1.push(t);
    else if(t.urgent&&!t.important)q.q2.push(t);
    else if(!t.urgent&&t.important)q.q3.push(t);
    else q.q4.push(t);
  });
  
  Object.entries(q).forEach(([key,list])=>{
    $(key).innerHTML=list.length?list.map(t=>
      `<div class="task-item ${t.done?'done':''}">
        <span onclick="toggleTask(${t.id})" style="cursor:pointer">${t.done?'☑':'☐'} ${t.text}</span>
        <button class="dng" style="padding:2px 6px;font-size:.7rem" onclick="deleteTask(${t.id})">×</button>
      </div>`
    ).join(''):'<div style="color:var(--text2);font-size:.8rem;text-align:center;padding:12px">暂无任务</div>';
  });
  
  const total=tasks.length, done=tasks.filter(t=>t.done).length;
  const urgent=tasks.filter(t=>t.urgent&&!t.done).length;
  const important=tasks.filter(t=>t.important&&!t.done).length;
  const overdue=tasks.filter(t=>t.urgent&&t.important&&!t.done).length;
  $('stats').innerHTML=`
    <div class="st"><div class="nm">${total}</div><div class="lb">总任务</div></div>
    <div class="st"><div class="nm" style="color:var(--success)">${done}</div><div class="lb">已完成</div></div>
    <div class="st"><div class="nm" style="color:var(--danger)">${overdue}</div><div class="lb">紧急重要</div></div>
    <div class="st"><div class="nm" style="color:var(--warn)">${urgent}</div><div class="lb">待处理</div></div>`;
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
