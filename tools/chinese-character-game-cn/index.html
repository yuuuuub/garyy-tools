<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字游戏大全</title><meta name="description" content="汉字游戏大全 - 看图猜字、汉字接龙、拼音学习"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#d29922;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin:4px}.btn:hover{opacity:.85}.btn.active{background:var(--green)}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}.game-area{text-align:center;padding:30px;background:var(--bg);border-radius:12px;margin:16px 0}.big-char{font-size:8rem;font-weight:700;line-height:1.2}.pinyin-hint{font-size:1.5rem;color:var(--green);margin-top:12px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.option-btn{padding:16px;background:var(--bg);border:2px solid var(--border);border-radius:8px;color:var(--text);font-size:1.1rem;cursor:pointer;transition:all .2s}.option-btn:hover{border-color:var(--blue);transform:scale(1.02)}.option-btn.correct{background:rgba(35,134,54,.3);border-color:var(--green)}.option-btn.wrong{background:rgba(239,68,68,.3);border-color:var(--red)}.score-bar{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:8px;margin-top:12px}.score-val{font-size:1.3rem;font-weight:700;color:var(--blue)}.mode-tabs{display:flex;gap:8px;margin-bottom:16px;justify-content:center}.mode-tab{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text2)}.mode-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.feedback{padding:12px;border-radius:8px;margin-top:12px;text-align:center;font-weight:600;display:none}.feedback.show{display:block}.feedback.correct{background:rgba(35,134,54,.2);color:var(--green)}.feedback.wrong{background:rgba(239,68,68,.2);color:var(--red)}.char-history{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.history-item{padding:8px;background:var(--bg);border-radius:6px;text-align:center;font-size:.9rem}.history-item.right{border-left:3px solid var(--green)}.history-item.fail{border-left:3px solid var(--red)}.leaderboard{margin-top:16px}.leaderboard-item{display:flex;justify-content:space-between;padding:10px;background:var(--bg);border-radius:6px;margin-bottom:6px}</style><meta property="og:title" content="汉字游戏大全"><meta property="og:description" content="汉字游戏大全 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎯 汉字游戏大全</h1><p class="sub">看图猜字、汉字接龙、拼音学习</p>
<div class="card">
<div class="mode-tabs">
<div class="mode-tab active" onclick="switchMode('guess',this)">看字猜义</div>
<div class="mode-tab" onclick="switchMode('pinyin',this)">拼音选择</div>
<div class="mode-tab" onclick="switchMode('stroke',this)">笔画问答</div>
<div class="mode-tab" onclick="switchMode('idiom',this)">成语填空</div>
</div>
<div class="btn-group">
<button class="btn" onclick="startGame()">开始游戏</button>
<button class="btn" onclick="skipQuestion()">跳过</button>
<button class="btn" onclick="useHint()">提示</button>
</div>
<div class="score-bar">
<div><span class="score-val" id="score">0</span> 分</div>
<div><span id="qNum">0</span>/<span id="qTotal">20</span></div>
<div>🔥 <span id="streak">0</span> 连对</div>
</div>
<div class="game-area" id="gameArea">
<div class="big-char" id="mainChar">?</div>
<div class="pinyin-hint" id="hintArea"></div>
<div class="options" id="optionsArea"></div>
<div class="feedback" id="feedback"></div>
</div>
</div>
<div class="card" id="historyCard" style="display:none">
<h3 style="margin-bottom:12px">答题记录</h3>
<div class="char-history" id="historyArea"></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var charData=[
{char:'日',pinyin:'rì',meaning:'太阳',strokes:4,opts:['太阳','月亮','星星','水']},
{char:'月',pinyin:'yuè',meaning:'月亮',strokes:4,opts:['太阳','月亮','云朵','雨水']},
{char:'水',pinyin:'shuǐ',meaning:'水',strokes:4,opts:['火','土','水','木']},
{char:'火',pinyin:'huǒ',meaning:'火',strokes:4,opts:['水','火','金','土']},
{char:'木',pinyin:'mù',meaning:'树木',strokes:4,opts:['石头','树木','花朵','果实']},
{char:'金',pinyin:'jīn',meaning:'金属',strokes:8,opts:['木头','金属','水','火']},
{char:'土',pinyin:'tǔ',meaning:'泥土',strokes:3,opts:['天','地','泥土','风']},
{char:'山',pinyin:'shān',meaning:'山',strokes:3,opts:['河','湖','山','海']},
{char:'石',pinyin:'shí',meaning:'石头',strokes:5,opts:['木','石','玉','土']},
{char:'田',pinyin:'tián',meaning:'田地',strokes:5,opts:['工厂','田地','学校','医院']},
{char:'人',pinyin:'rén',meaning:'人',strokes:2,opts:['人','鸟','鱼','虫']},
{char:'大',pinyin:'dà',meaning:'大',strokes:3,opts:['大','小','多','少']},
{char:'小',pinyin:'xiǎo',meaning:'小',strokes:3,opts:['上','下','小','中']},
{char:'天',pinyin:'tiān',meaning:'天空',strokes:4,opts:['天空','大地','河流','森林']},
{char:'地',pinyin:'dì',meaning:'大地',strokes:6,opts:['天空','大地','风','雨']},
{char:'口',pinyin:'kǒu',meaning:'嘴巴',strokes:3,opts:['眼睛','耳朵','嘴巴','鼻子']},
{char:'目',pinyin:'mù',meaning:'眼睛',strokes:5,opts:['手','足','眼睛','嘴巴']},
{char:'手',pinyin:'shǒu',meaning:'手',strokes:4,opts:['脚','手','头','身']},
{char:'心',pinyin:'xīn',meaning:'心',strokes:4,opts:['肝','心','脾','肾']},
{char:'花',pinyin:'huā',meaning:'花朵',strokes:7,opts:['树木','花朵','果实','叶子']},
{char:'鸟',pinyin:'niǎo',meaning:'鸟',strokes:5,opts:['鱼','鸟','虫','兽']},
{char:'鱼',pinyin:'yú',meaning:'鱼',strokes:8,opts:['鸟','兽','虫','鱼']},
{char:'马',pinyin:'mǎ',meaning:'马',strokes:3,opts:['牛','马','羊','猪']},
{char:'牛',pinyin:'niú',meaning:'牛',strokes:4,opts:['马','牛','羊','鸡']},
{char:'羊',pinyin:'yáng',meaning:'羊',strokes:6,opts:['牛','马','羊','猪']},
{char:'龙',pinyin:'lóng',meaning:'龙',strokes:5,opts:['凤','虎','龙','龟']},
{char:'虎',pinyin:'hǔ',meaning:'老虎',strokes:8,opts:['龙','虎','豹','狼']},
{char:'风',pinyin:'fēng',meaning:'风',strokes:4,opts:['雨','雪','风','云']},
{char:'雨',pinyin:'yǔ',meaning:'雨',strokes:8,opts:['风','雨','雪','霜']},
{char:'云',pinyin:'yún',meaning:'云',strokes:4,opts:['风','雨','雪','云']},
{char:'春',pinyin:'chūn',meaning:'春天',strokes:9,opts:['春','夏','秋','冬']},
{char:'夏',pinyin:'xià',meaning:'夏天',strokes:10,opts:['春','夏','秋','冬']},
{char:'秋',pinyin:'qiū',meaning:'秋天',strokes:9,opts:['春','夏','秋','冬']},
{char:'冬',pinyin:'dōng',meaning:'冬天',strokes:5,opts:['春','夏','秋','冬']},
{char:'上',pinyin:'shàng',meaning:'上面',strokes:3,opts:['上','下','左','右']},
{char:'下',pinyin:'xià',meaning:'下面',strokes:3,opts:['上','下','前','后']},
{char:'左',pinyin:'zuǒ',meaning:'左边',strokes:5,opts:['左','右','前','后']},
{char:'右',pinyin:'yòu',meaning:'右边',strokes:5,opts:['左','右','上','下']},
{char:'东',pinyin:'dōng',meaning:'东方',strokes:5,opts:['东','西','南','北']},
{char:'西',pinyin:'xī',meaning:'西方',strokes:6,opts:['东','西','南','北']}
];
var idiomData=[
{idiom:'一__十寒',answer:'曝',hint:'比喻学习或工作一时勤奋，一时又懒散，没有恒心。',opts:['曝','爆','暴','瀑']},
{idiom:'__上添花',answer:'锦',hint:'比喻好上加好。',opts:['锦','金','银','玉']},
{idiom:'画__添足',answer:'蛇',hint:'比喻做了多余的事。',opts:['蛇','龙','凤','虎']},
{idiom:'__落归根',answer:'叶',hint:'比喻返回本源。',opts:['叶','花','果','根']},
{idiom:'__入人心',answer:'深',hint:'形容深入人心。',opts:['深','浅','厚','薄']},
{idiom:'__高望重',answer:'德',hint:'品德高尚，名望很大。',opts:['德','才','学','识']},
{idiom:'__明正大',answer:'光',hint:'形容心怀坦白，言行正派。',opts:['光','正','明','真']},
{idiom:'__手牵羊',answer:'顺',hint:'比喻趁便随手拿走别人的东西。',opts:['顺','偷','摸','抢']},
{idiom:'__心悦目',answer:'赏',hint:'看到美好的事物而身心愉快。',opts:['赏','观','看','望']},
{idiom:'__到成功',answer:'马',hint:'比喻事情顺利，一开始就取得成功。',opts:['马','牛','羊','兔']}
];
var mode='guess',currentQ=null,score=0,qNum=0,totalQ=20,streak=0,maxStreak=0,history=[],usedIds=[];
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function switchMode(m,el){mode=m;document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');score=0;qNum=0;streak=0;history=[];usedIds=[];updateScore();document.getElementById('historyCard').style.display='none';document.getElementById('mainChar').textContent='?';document.getElementById('hintArea').textContent='';document.getElementById('optionsArea').innerHTML='';document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='';}
function startGame(){
score=0;qNum=0;streak=0;history=[];usedIds=[];totalQ=20;
updateScore();nextQuestion();
}
function nextQuestion(){
if(qNum>=totalQ){showResult();return;}
var pool=mode==='idiom'?idiomData:charData;
var available=[];
for(var i=0;i<pool.length;i++){if(usedIds.indexOf(i)===-1)available.push(i);}
if(available.length===0){usedIds=[];available=pool.map(function(_,i){return i;});}
var idx=available[Math.floor(Math.random()*available.length)];
usedIds.push(idx);
currentQ=pool[idx];
qNum++;
document.getElementById('qNum').textContent=qNum;
document.getElementById('qTotal').textContent=totalQ;
if(mode==='idiom'){
document.getElementById('mainChar').style.fontSize='2rem';
document.getElementById('mainChar').textContent=currentQ.idiom;
document.getElementById('hintArea').textContent='提示：'+currentQ.hint;
}else if(mode==='pinyin'){
document.getElementById('mainChar').style.fontSize='8rem';
document.getElementById('mainChar').textContent=currentQ.char;
document.getElementById('hintArea').textContent='请选择正确的拼音';
}else if(mode==='stroke'){
document.getElementById('mainChar').style.fontSize='8rem';
document.getElementById('mainChar').textContent=currentQ.char;
document.getElementById('hintArea').textContent='该字有多少画？';
}else{
document.getElementById('mainChar').style.fontSize='8rem';
document.getElementById('mainChar').textContent=currentQ.char;
document.getElementById('hintArea').textContent='';
}
document.getElementById('feedback').className='feedback';
document.getElementById('feedback').textContent='';
renderOptions();
}
function renderOptions(){
var area=document.getElementById('optionsArea');
var opts=mode==='idiom'?currentQ.opts:mode==='pinyin'?shuffle(currentQ.opts):mode==='stroke'?[String(currentQ.strokes),String(currentQ.strokes+1),String(currentQ.strokes-1),String(currentQ.strokes+2)]:currentQ.opts;
if(mode==='pinyin')opts=shuffle(currentQ.opts);
if(mode==='stroke'){
opts=shuffle([String(currentQ.strokes),String(Math.max(1,currentQ.strokes-1)),String(currentQ.strokes+1),String(currentQ.strokes+2)]);
}
var html='';
opts.forEach(function(opt){
html+='<button class="option-btn" onclick="checkAnswer(this,\''+opt+'\')">'+opt+'</button>';
});
area.innerHTML=html;
}
function checkAnswer(el,ans){
var correct=false;
if(mode==='idiom')correct=ans===currentQ.answer;
else if(mode==='pinyin')correct=ans===currentQ.pinyin;
else if(mode==='stroke')correct=ans===String(currentQ.strokes);
else correct=ans===currentQ.meaning;
var fb=document.getElementById('feedback');
if(correct){
el.classList.add('correct');
fb.className='feedback show correct';
fb.textContent='✓ 正确！';
score+=10+streak*2;
streak++;
if(streak>maxStreak)maxStreak=streak;
history.push({char:mode==='idiom'?currentQ.idiom:currentQ.char,correct:true});
}else{
el.classList.add('wrong');
fb.className='feedback show wrong';
var answer=mode==='idiom'?currentQ.answer:mode==='pinyin'?currentQ.pinyin:mode==='stroke'?String(currentQ.strokes):currentQ.meaning;
fb.textContent='✗ 答案是：'+answer;
streak=0;
history.push({char:mode==='idiom'?currentQ.idiom:currentQ.char,correct:false});
}
updateScore();
document.querySelectorAll('.option-btn').forEach(function(b){b.onclick=null;b.style.cursor='default';});
document.getElementById('historyCard').style.display='block';
renderHistory();
setTimeout(nextQuestion,1500);
}
function skipQuestion(){
streak=0;
history.push({char:mode==='idiom'?currentQ.idiom:currentQ.char,correct:false});
document.getElementById('feedback').className='feedback show wrong';
document.getElementById('feedback').textContent='已跳过';
updateScore();renderHistory();setTimeout(nextQuestion,800);
}
function useHint(){
if(mode==='pinyin'){
document.getElementById('hintArea').textContent='提示：首字母是 '+currentQ.pinyin.charAt(0);
}else if(mode==='stroke'){
document.getElementById('hintArea').textContent='提示：该字有 '+currentQ.strokes+' 画';
}else if(mode==='idiom'){
document.getElementById('hintArea').textContent='提示：'+currentQ.hint;
}else{
document.getElementById('hintArea').textContent='提示：'+currentQ.meaning;
}
score=Math.max(0,score-3);
updateScore();
}
function updateScore(){
document.getElementById('score').textContent=score;
document.getElementById('streak').textContent=streak;
}
function renderHistory(){
var area=document.getElementById('historyArea');
var html='';
history.forEach(function(h){
html+='<div class="history-item '+(h.correct?'right':'fail')+'">'+h.char+'</div>';
});
area.innerHTML=html;
}
function showResult(){
var correct=history.filter(function(h){return h.correct;}).length;
var pct=Math.round(correct/totalQ*100);
var grade=pct>=90?'S':pct>=80?'A':pct>=70?'B':pct>=60?'C':'D';
document.getElementById('gameArea').innerHTML='<div style="text-align:center;padding:30px"><div style="font-size:4rem;margin-bottom:16px">'+grade+'</div><h2>游戏结束</h2><p style="color:var(--text2);margin:12px 0">正确率：'+pct+'% ('+correct+'/'+totalQ+')</p><p style="color:var(--text2)">最高连对：'+maxStreak+'</p><p style="color:var(--blue);font-size:1.2rem;margin-top:12px">总分：'+score+'</p><button class="btn" onclick="startGame()" style="margin-top:16px">再来一局</button></div>';
}
</script></body></html>
