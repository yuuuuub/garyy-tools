<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看板仪表盘</title>
<meta property="og:title" content="看板仪表盘">
<meta property="og:description" content="看板仪表盘 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="看板仪表盘 - 可视化管理团队工作流，实时追踪任务状态和团队效率">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--orange:#db6d28;--purple:#a371f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--orange:#bc4c00;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:1200px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-warning{background:var(--yellow);color:#000}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
input,textarea,select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-num{font-size:2rem;font-weight:700}
.stat-label{font-size:.8rem;color:var(--text2);margin-top:4px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:20px}
.column{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-height:200px}
.column-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.column-title{font-weight:700;font-size:.95rem}
.column-count{background:var(--bg);padding:2px 8px;border-radius:10px;font-size:.75rem;color:var(--text2)}
.task-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:grab;transition:all .2s}
.task-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.task-card.dragging{opacity:.5}
.task-title{font-weight:600;font-size:.9rem;margin-bottom:6px}
.task-meta{font-size:.75rem;color:var(--text2);display:flex;justify-content:space-between;align-items:center}
.priority-high{border-left:3px solid var(--red)}
.priority-medium{border-left:3px solid var(--yellow)}
.priority-low{border-left:3px solid var(--green)}
.chart-bar{display:flex;align-items:center;gap:8px;margin:6px 0}
.chart-bar-label{width:60px;font-size:.8rem;color:var(--text2);text-align:right}
.chart-bar-track{flex:1;height:20px;background:var(--bg);border-radius:4px;overflow:hidden}
.chart-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.chart-bar-value{width:30px;font-size:.8rem;font-weight:600}
@media(max-width:768px){.board{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(2,1fr)}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📊 看板仪表盘';
const APP=document.getElementById('app');
let data=JSON.parse(localStorage.getItem('kbd_data')||'{"columns":[{"name":"待办","color":"#d29922","tasks":[]},{"name":"进行中","color":"#3b82f6","tasks":[]},{"name":"评审","color":"#a371f7","tasks":[]},{"name":"已完成","color":"#3fb950","tasks":[]}]}');
let stats=JSON.parse(localStorage.getItem('kbd_stats')||'{"completed":0,"total":0}');

function save(){localStorage.setItem('kbd_data',JSON.stringify(data));localStorage.setItem('kbd_stats',JSON.stringify(stats))}

function render(){
  const totalTasks=data.columns.reduce((s,c)=>s+c.tasks.length,0);
  const doneTasks=data.columns.find(c=>c.name==='已完成')?.tasks.length||0;
  const inProgress=data.columns.find(c=>c.name==='进行中')?.tasks.length||0;
  const highP=data.columns.reduce((s,c)=>s+c.tasks.filter(t=>t.priority==='high').length,0);

  let h=`<h1>📊 看板仪表盘</h1><p class="subtitle">可视化管理团队工作流</p>`;
  h+=`<div class="stats-grid">`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--accent)">${totalTasks}</div><div class="stat-label">总任务数</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--green)">${doneTasks}</div><div class="stat-label">已完成</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--yellow)">${inProgress}</div><div class="stat-label">进行中</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--red)">${highP}</div><div class="stat-label">高优先级</div></div>`;
  h+=`</div>`;

  h+=`<div class="card"><div class="flex-between"><b>📈 工作流分布</b></div>`;
  data.columns.forEach(col=>{
    const pct=totalTasks?Math.round(col.tasks.length/totalTasks*100):0;
    h+=`<div class="chart-bar"><span class="chart-bar-label">${col.name}</span><div class="chart-bar-track"><div class="chart-bar-fill" style="width:${pct}%;background:${col.color}"></div></div><span class="chart-bar-value">${col.tasks.length}</span></div>`;
  });
  h+=`</div>`;

  h+=`<div class="flex-between" style="margin-bottom:12px"><b style="font-size:1.1rem">🗂️ 任务看板</b><button class="btn btn-sm" onclick="addTask()">+ 新建任务</button></div>`;
  h+=`<div class="board">`;
  data.columns.forEach((col,ci)=>{
    h+=`<div class="column" ondragover="event.preventDefault()" ondrop="dropTask(event,${ci})">`;
    h+=`<div class="column-header"><span class="column-title" style="color:${col.color}">${col.name}</span><span class="column-count">${col.tasks.length}</span></div>`;
    col.tasks.forEach((task,ti)=>{
      const pri=task.priority==='high'?'priority-high':task.priority==='medium'?'priority-medium':'priority-low';
      h+=`<div class="task-card ${pri}" draggable="true" ondragstart="dragTask(event,${ci},${ti})" id="task-${ci}-${ti}">`;
      h+=`<div class="task-title">${task.title}</div>`;
      h+=`<div class="task-meta"><span>${task.assignee||'未分配'}</span>`;
      h+=`<div class="flex"><button class="btn btn-sm btn-outline" onclick="moveTask(${ci},${ti},-1)" title="左移">◀</button>`;
      h+=`<button class="btn btn-sm btn-outline" onclick="moveTask(${ci},${ti},1)" title="右移">▶</button>`;
      h+=`<button class="btn btn-sm btn-danger" onclick="delTask(${ci},${ti})">✕</button></div></div></div>`;
    });
    if(!col.tasks.length) h+=`<div style="text-align:center;color:var(--text2);padding:20px;font-size:.85rem">暂无任务</div>`;
    h+=`</div>`;
  });
  h+=`</div>`;

  h+=`<div class="card"><div class="flex-between"><b>⚙️ 列管理</b><button class="btn btn-sm btn-outline" onclick="addColumn()">+ 添加列</button></div>`;
  data.columns.forEach((col,i)=>{
    h+=`<div class="flex-between" style="padding:6px 0;border-bottom:1px solid var(--border)"><span style="color:${col.color}">${col.name}</span>`;
    h+=`<button class="btn btn-sm btn-danger" onclick="delColumn(${i})">删除</button></div>`;
  });
  h+=`</div>`;
  APP.innerHTML=h;
}

let dragInfo=null;
function dragTask(e,ci,ti){dragInfo={ci,ti};e.dataTransfer.effectAllowed='move'}
function dropTask(e,ci){e.preventDefault();if(!dragInfo)return;const task=data.columns[dragInfo.ci].tasks.splice(dragInfo.ti,1)[0];data.columns[ci].tasks.push(task);dragInfo=null;save();render()}
function moveTask(ci,ti,dir){const newCi=ci+dir;if(newCi<0||newCi>=data.columns.length)return;const task=data.columns[ci].tasks.splice(ti,1)[0];data.columns[newCi].tasks.push(task);save();render()}
function delTask(ci,ti){if(confirm('删除此任务？')){data.columns[ci].tasks.splice(ti,1);stats.completed++;save();render()}}
function addTask(){
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">新建任务</h3>
    <label>任务标题</label><input id="mt" placeholder="输入任务标题">
    <label>负责人</label><input id="ma" placeholder="负责人姓名">
    <label>优先级</label><select id="mp"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select>
    <label>目标列</label><select id="mc">${data.columns.map((c,i)=>`<option value="${i}">${c.name}</option>`).join('')}</select>
    <div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    <button class="btn btn-success" onclick="saveTask()">确定</button></div></div>`;
  document.body.appendChild(m);
}
function saveTask(){
  const t=document.getElementById('mt').value.trim();if(!t)return;
  const a=document.getElementById('ma').value.trim();
  const p=document.getElementById('mp').value;
  const ci=parseInt(document.getElementById('mc').value);
  data.columns[ci].tasks.push({title:t,assignee:a,priority:p,created:new Date().toLocaleDateString('zh-CN')});
  save();document.querySelector('.modal-overlay').remove();render();
}
function addColumn(){const n=prompt('列名称：');if(n){data.columns.push({name:n,color:'#3b82f6',tasks:[]});save();render()}}
function delColumn(i){if(data.columns[i].tasks.length&&confirm('该列有任务，确定删除？'))return;if(confirm('删除此列？')){data.columns.splice(i,1);save();render()}}
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
