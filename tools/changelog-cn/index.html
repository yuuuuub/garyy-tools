<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更新日志生成器</title>
<meta name="description" content="在线生成项目更新日志(Changelog)，支持多种格式导出">
<script defer src="../i18n.js"></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth;padding:16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button,textarea{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:60px}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s;display:inline-block;text-align:center}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:4px 12px;font-size:.8rem}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:var(--radius);cursor:pointer;font-size:.82rem;background:var(--card);border:1px solid var(--border);color:var(--text2);transition:all .2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.change-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.change-item .item-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.change-item select{width:auto;padding:4px 8px;font-size:.82rem}
.change-item input,.change-item textarea{font-size:.82rem;padding:6px 8px}
.change-remove{background:var(--red);color:#fff;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:.75rem}
.preview-box{background:#fff;color:#333;padding:24px;border-radius:var(--radius);border:1px solid #ddd;font-size:.82rem;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.output-area{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px;display:none}
@media(max-width:640px){.form-row{flex-direction:column}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="更新日志生成器">
<meta property="og:description" content="在线生成项目更新日志">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📋 更新日志生成器</h1>
    <p>快速生成项目版本更新日志</p>
  </header>

  <div class="card">
    <div class="section-title">版本信息</div>
    <div class="form-row">
      <div class="group"><label>项目名称</label><input type="text" id="projectName" value="My Project"></div>
      <div class="group"><label>版本号</label><input type="text" id="version" value="v1.2.0"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>发布日期</label><input type="date" id="releaseDate"></div>
      <div class="group"><label>版本类型</label>
        <select id="versionType">
          <option value="feature">新功能</option>
          <option value="fix">修复</option>
          <option value="breaking">重大变更</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">变更记录</div>
    <div id="changeList"></div>
    <button class="btn btn-outline btn-sm" onclick="addChange()" style="margin-top:8px">+ 添加变更</button>
  </div>

  <div class="card">
    <div class="section-title">发布说明（可选）</div>
    <div class="form-row">
      <div class="group"><textarea id="releaseNotes" rows="3" placeholder="输入版本发布说明..."></textarea></div>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" onclick="generate()">生成日志</button>
    <button class="btn btn-green" onclick="copyChangelog()">复制</button>
    <button class="btn btn-outline" onclick="downloadChangelog()">下载</button>
  </div>

  <div class="output-area" id="outputArea">
    <div class="tabs" style="margin-bottom:8px">
      <div class="tab active" onclick="showFormat('markdown')">Markdown</div>
      <div class="tab" onclick="showFormat('text')">纯文本</div>
      <div class="tab" onclick="showFormat('keepachangelog')">Keep a Changelog</div>
    </div>
    <div class="preview-box" id="preview"></div>
  </div>
</div>

<script>
document.getElementById('releaseDate').value = new Date().toISOString().split('T')[0];

var changes = [
  {type:'Added', desc:'新增用户仪表盘页面'},
  {type:'Added', desc:'支持数据导出为CSV格式'},
  {type:'Changed', desc:'优化首页加载性能，提升50%'},
  {type:'Fixed', desc:'修复登录页面表单验证问题'},
  {type:'Deprecated', desc:'废弃旧版API接口/v1'}
];

var typeLabels = {Added:'新增',Changed:'改进',Deprecated:'废弃',Removed:'移除',Fixed:'修复',Security:'安全'};
var currentFormat = 'markdown';

function renderChanges() {
  var list = document.getElementById('changeList');
  list.innerHTML = '';
  changes.forEach(function(c, i) {
    var div = document.createElement('div');
    div.className = 'change-item';
    div.innerHTML = '<div class="item-head">' +
      '<select onchange="changes[' + i + '].type=this.value">' +
      Object.keys(typeLabels).map(function(t){ return '<option value="' + t + '"' + (c.type === t ? ' selected' : '') + '>' + t + ' (' + typeLabels[t] + ')</option>'; }).join('') +
      '</select>' +
      '<button class="change-remove" onclick="removeChange(' + i + ')">删除</button>' +
      '</div>' +
      '<input type="text" value="' + c.desc + '" onchange="changes[' + i + '].desc=this.value" placeholder="变更描述">';
    list.appendChild(div);
  });
}

function addChange() {
  changes.push({type:'Added', desc:''});
  renderChanges();
}

function removeChange(i) {
  changes.splice(i, 1);
  renderChanges();
}

function generate() {
  var name = document.getElementById('projectName').value;
  var version = document.getElementById('version').value;
  var date = document.getElementById('releaseDate').value;
  var notes = document.getElementById('releaseNotes').value;
  var output = '';

  if (currentFormat === 'markdown') {
    output = '# ' + name + ' ' + version + ' (' + date + ')\n\n';
    if (notes) output += notes + '\n\n';
    var grouped = {};
    changes.forEach(function(c) {
      if (!grouped[c.type]) grouped[c.type] = [];
      grouped[c.type].push(c.desc);
    });
    Object.keys(grouped).forEach(function(type) {
      output += '## ' + typeLabels[type] + '\n\n';
      grouped[type].forEach(function(d) {
        output += '- ' + d + '\n';
      });
      output += '\n';
    });
  } else if (currentFormat === 'text') {
    output = name + ' ' + version + ' - ' + date + '\n';
    output += '='.repeat(50) + '\n\n';
    if (notes) output += notes + '\n\n';
    changes.forEach(function(c) {
      output += '[' + c.type + '] ' + c.desc + '\n';
    });
  } else {
    output = '# Changelog\n\n';
    output += '## [' + version + '] - ' + date + '\n\n';
    if (notes) output += notes + '\n\n';
    var g2 = {};
    changes.forEach(function(c) {
      if (!g2[c.type]) g2[c.type] = [];
      g2[c.type].push(c.desc);
    });
    Object.keys(g2).forEach(function(type) {
      output += '### ' + type + '\n\n';
      g2[type].forEach(function(d) {
        output += '- ' + d + '\n';
      });
      output += '\n';
    });
  }

  document.getElementById('preview').textContent = output;
  document.getElementById('outputArea').style.display = 'block';
  document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
}

function showFormat(fmt) {
  currentFormat = fmt;
  document.querySelectorAll('#outputArea .tab').forEach(function(t) {
    t.classList.remove('active');
  });
  event.target.classList.add('active');
  generate();
}

function copyChangelog() {
  generate();
  navigator.clipboard.writeText(document.getElementById('preview').textContent).then(function() {
    alert('已复制到剪贴板');
  });
}

function downloadChangelog() {
  generate();
  var ext = currentFormat === 'markdown' || currentFormat === 'keepachangelog' ? '.md' : '.txt';
  var blob = new Blob([document.getElementById('preview').textContent], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'CHANGELOG-' + document.getElementById('version').value + ext;
  a.click();
}

renderChanges();
</script>
</body>
</html>
