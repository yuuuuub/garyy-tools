<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计时赛车</title>
    <meta name="description" content="计时赛车挑战，在限定时间内跑出最快圈速">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #3b82f6;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            color: #3b82f6;
        }
        .controls {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 18px;
        }
        canvas {
            border: 2px solid var(--border);
            border-radius: 8px;
            background: #1a1e24;
            max-width: 100%;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .message {
            margin-top: 15px;
            font-size: 16px;
            color: #8b949e;
        }
        .ghost-info {
            margin-top: 10px;
            padding: 10px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 6px;
            border: 1px solid #3b82f6;
        }
    </style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
    <h1>⏱️ 计时赛车</h1>
    <div class="controls">
        <div class="info">
            <span>当前时间: <span id="currentTime">0.000</span>秒</span>
            <span>最佳时间: <span id="bestTime">--</span>秒</span>
            <span>圈数: <span id="laps">0</span>/3</span>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div style="margin-top: 10px;">
            <button class="btn" onclick="startGame()">开始计时</button>
            <button class="btn" onclick="resetGame()">重新开始</button>
        </div>
        <div class="ghost-info">
            <p>Ghost车（蓝色半透明）显示你的最佳圈速轨迹</p>
            <p>使用方向键或WASD控制赛车</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const currentTimeEl = document.getElementById('currentTime');
        const bestTimeEl = document.getElementById('bestTime');
        const lapsEl = document.getElementById('laps');
        
        let gameRunning = false;
        let currentTime = 0;
        let bestTime = localStorage.getItem('timeTrialBestTime') || Infinity;
        let lastTime = 0;
        let car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30 };
        let ghost = { x: 400, y: 500, angle: 0, positions: [] };
        let keys = {};
        let laps = 0;
        let checkpoints = [0, 0, 0, 0];
        let lastCheckpoint = -1;
        let recording = false;
        let recordingData = [];
        
        if (bestTime !== Infinity) {
            bestTimeEl.textContent = bestTime.toFixed(3);
        }
        
        // 赛道定义
        const track = [
            { x: 400, y: 500, type: 'start' },
            { x: 400, y: 400, type: 'straight' },
            { x: 400, y: 300, type: 'straight' },
            { x: 300, y: 200, type: 'curve' },
            { x: 200, y: 150, type: 'straight' },
            { x: 200, y: 100, type: 'straight' },
            { x: 300, y: 50, type: 'curve' },
            { x: 500, y: 50, type: 'straight' },
            { x: 600, y: 100, type: 'curve' },
            { x: 600, y: 200, type: 'straight' },
            { x: 600, y: 300, type: 'straight' },
            { x: 500, y: 400, type: 'curve' },
            { x: 400, y: 500, type: 'finish' }
        ];
        
        function drawTrack() {
            ctx.strokeStyle = '#30363d';
            ctx.lineWidth = 80;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            ctx.moveTo(track[0].x, track[0].y);
            for (let i = 1; i < track.length; i++) {
                ctx.lineTo(track[i].x, track[i].y);
            }
            ctx.stroke();
            
            // 赛道边线
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(track[0].x, track[0].y);
            for (let i = 1; i < track.length; i++) {
                ctx.lineTo(track[i].x, track[i].y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }
        
        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // 车身
            ctx.fillStyle = #3b82f6;
            ctx.fillRect(-car.width/2, -car.height/2, car.width, car.height);
            
            // 车窗
            ctx.fillStyle = '#1a1e24';
            ctx.fillRect(-car.width/2 + 3, -car.height/2 + 3, car.width - 6, car.height/3);
            
            ctx.restore();
        }
        
        function drawGhost() {
            if (ghost.positions.length === 0) return;
            
            ctx.save();
            ctx.globalAlpha = 0.3;
            ctx.translate(ghost.x, ghost.y);
            ctx.rotate(ghost.angle);
            
            // Ghost车身
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(-car.width/2, -car.height/2, car.width, car.height);
            
            ctx.restore();
        }
        
        function updateCar(deltaTime) {
            if (keys['ArrowUp'] || keys['w']) {
                car.speed = Math.min(car.speed + 0.1, 8);
            } else if (keys['ArrowDown'] || keys['s']) {
                car.speed = Math.max(car.speed - 0.2, -3);
            } else {
                car.speed *= 0.98;
            }
            
            if (keys['ArrowLeft'] || keys['a']) {
                car.angle -= 0.05 * car.speed;
            }
            if (keys['ArrowRight'] || keys['d']) {
                car.angle += 0.05 * car.speed;
            }
            
            car.x += Math.sin(car.angle) * car.speed;
            car.y -= Math.cos(car.angle) * car.speed;
            
            // 边界检查
            car.x = Math.max(20, Math.min(canvas.width - 20, car.x));
            car.y = Math.max(20, Math.min(canvas.height - 20, car.y));
            
            // 记录位置
            if (recording) {
                recordingData.push({ x: car.x, y: car.y, angle: car.angle });
            }
            
            // 更新Ghost位置
            if (ghost.positions.length > 0) {
                const frameIndex = Math.min(recordingData.length, ghost.positions.length - 1);
                ghost.x = ghost.positions[frameIndex].x;
                ghost.y = ghost.positions[frameIndex].y;
                ghost.angle = ghost.positions[frameIndex].angle;
            }
        }
        
        function updateGame(timestamp) {
            if (!gameRunning) return;
            
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            
            currentTime += deltaTime;
            currentTimeEl.textContent = currentTime.toFixed(3);
            
            updateCar(deltaTime);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();
            drawGhost();
            drawCar();
            
            requestAnimationFrame(updateGame);
        }
        
        function startGame() {
            if (gameRunning) return;
            
            car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30 };
            currentTime = 0;
            laps = 0;
            recording = true;
            recordingData = [];
            
            // 加载最佳记录作为Ghost
            if (bestTime !== Infinity) {
                const savedData = localStorage.getItem('timeTrialRecording');
                if (savedData) {
                    ghost.positions = JSON.parse(savedData);
                }
            }
            
            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(updateGame);
        }
        
        function resetGame() {
            gameRunning = false;
            car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30 };
            currentTime = 0;
            laps = 0;
            recording = false;
            recordingData = [];
            ghost.positions = [];
            
            currentTimeEl.textContent = '0.000';
            lapsEl.textContent = '0';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();
            drawCar();
        }
        
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // 初始绘制
        drawTrack();
        drawCar();
    </script>
<script src="../i18n.js"></script>
</body>
</html>
