<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL 编解码工具</title>
<meta name="description" content="URL编码解码工具，转换URL特殊字符编码">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {--bg: #0f1117;
--bg-card: #1a1d27;
--bg-input: #131620;
--border: #2a2d3a;
--text: #e1e4eb;
--text-secondary: #8b8fa8;
--accent: #6366f1;
--accent-hover: #818cf8;
--accent-bg: rgba(99, 102, 241, 0.12);
--success: #22c55e;
--success-bg: rgba(34, 197, 94, 0.12);
--danger: #ef4444;
--danger-bg: rgba(239, 68, 68, 0.12);
--warning: #f59e0b;
--warning-bg: rgba(245, 158, 11, 0.12);
--radius: 10px;
--radius-sm: 6px;
--shadow: 0 2px 12px rgba(0,0,0,0.3)}
body {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
flex-direction: column;
line-height: 1.6}
.container {max-width: 960px;
margin: 0 auto;
padding: 20px 16px 40px;
width: 100%;
flex: 1}
header {text-align: center;
padding: 32px 0 8px}
header h1 {font-size: 28px;
font-weight: 700;
background: linear-gradient(135deg, #818cf8, #a78bfa, #f472b6);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
margin-bottom: 6px}
header p {color: var(--text-secondary);
font-size: 14px}
.tabs {display: flex;
gap: 4px;
margin: 24px 0 0;
background: var(--bg-card);
border-radius: var(--radius);
padding: 4px}
.tab-btn {flex: 1;
padding: 10px 16px;
border: none;
border-radius: var(--radius-sm);
background: transparent;
color: var(--text-secondary);
cursor: pointer;
font-size: 13px;
font-weight: 500;
transition: all 0.2s;
font-family: inherit;
white-space: nowrap}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {background: var(--accent-bg);
color: var(--accent-hover)}
.tab-panel { display: none; margin-top: 20px; }
.tab-panel.active { display: block; }
.card {background: var(--bg-card);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 20px;
margin-bottom: 16px}
.card-header {display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 12px;
flex-wrap: wrap;
gap: 8px}
.card-title {font-size: 15px;
font-weight: 600;
color: var(--text)}
.auto-detect {display: none;
padding: 10px 14px;
border-radius: var(--radius-sm);
margin-bottom: 12px;
font-size: 13px;
align-items: center;
gap: 8px}
.auto-detect.show { display: flex; }
.auto-detect.encoded {background: var(--warning-bg);
color: var(--warning);
border: 1px solid rgba(245, 158, 11, 0.25)}
.auto-detect.raw {background: var(--accent-bg);
color: var(--accent-hover);
border: 1px solid rgba(99, 102, 241, 0.25)}
.auto-detect .dot {width: 8px; height: 8px;
border-radius: 50%;
flex-shrink: 0}
.auto-detect.encoded .dot { background: var(--warning); }
.auto-detect.raw .dot { background: var(--accent); }
textarea {width: 100%;
min-height: 120px;
padding: 14px;
font-size: 13px;
font-family: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", "Menlo", monospace;
background: var(--bg-input);
color: var(--text);
border: 1px solid var(--border);
border-radius: var(--radius-sm);
resize: vertical;
outline: none;
transition: border-color 0.2s;
line-height: 1.5}
textarea:focus {border-color: var(--accent);
box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15)}
textarea::placeholder { color: #4a4e62; }
.char-count {font-size: 11px;
color: var(--text-secondary);
text-align: right;
margin-top: 4px;
display: flex;
justify-content: space-between}
.char-count span {display: inline-flex;
gap: 12px}
.btn-group {display: flex;
flex-wrap: wrap;
gap: 8px;
margin: 12px 0}
.btn {padding: 9px 18px;
border: 1px solid var(--border);
border-radius: var(--radius-sm);
font-size: 13px;
font-weight: 500;
cursor: pointer;
transition: all 0.2s;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 6px;
white-space: nowrap;
background: var(--bg-card);
color: var(--text)}
.btn:hover {border-color: var(--accent);
background: var(--accent-bg)}
.btn-primary {background: var(--accent);
color: var(--text);
border-color: var(--accent)}
.btn-primary:hover {background: var(--accent-hover);
border-color: var(--accent-hover)}
.btn-success {background: var(--success);
color: var(--text);
border-color: var(--success)}
.btn-success:hover {background: #16a34a;
border-color: #16a34a}
.btn-danger {background: transparent;
color: var(--danger);
border-color: var(--danger)}
.btn-danger:hover {background: var(--danger-bg)}
.btn-sm {padding: 6px 12px;
font-size: 12px}
.btn-xs {padding: 3px 8px;
font-size: 11px}
.btn:active { transform: scale(0.97); }
.btn:disabled {opacity: 0.45;
cursor: not-allowed;
pointer-events: none}
.mode-toggle {display: inline-flex;
background: var(--bg-input);
border: 1px solid var(--border);
border-radius: var(--radius-sm);
overflow: hidden;
font-size: 12px}
.mode-toggle button {padding: 7px 14px;
border: none;
background: transparent;
color: var(--text-secondary);
cursor: pointer;
font-size: 12px;
font-family: inherit;
transition: all 0.2s;
font-weight: 500}
.mode-toggle button.active {background: var(--accent);
color: var(--text)}
.mode-toggle button:not(:last-child) {border-right: 1px solid var(--border)}
.mode-hint {font-size: 11px;
color: var(--text-secondary);
margin-left: 8px;
font-style: italic}
.toast {position: fixed;
bottom: 24px;
left: 50%;
transform: translateX(-50%);
background: var(--success);
color: var(--text);
padding: 10px 24px;
border-radius: var(--radius-sm);
font-size: 13px;
font-weight: 500;
box-shadow: var(--shadow);
z-index: 999;
opacity: 0;
pointer-events: none;
transition: opacity 0.25s}
.toast.show {opacity: 1}
.history-list {max-height: 240px;
overflow-y: auto}
.history-item {display: flex;
align-items: flex-start;
justify-content: space-between;
padding: 8px 0;
border-bottom: 1px solid var(--border);
gap: 10px;
font-size: 12px}
.history-item:last-child { border-bottom: none; }
.history-op {font-size: 10px;
color: var(--accent);
font-weight: 600;
white-space: nowrap;
flex-shrink: 0;
min-width: 52px}
.history-text {color: var(--text-secondary);
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
flex: 1;
cursor: pointer}
.history-text:hover { color: var(--text); }
.history-time {font-size: 10px;
color: #4a4e62;
white-space: nowrap;
flex-shrink: 0}
.no-history {color: var(--text-secondary);
font-size: 13px;
text-align: center;
padding: 20px 0}
.param-table {width: 100%;
border-collapse: collapse;
font-size: 13px;
margin-top: 8px}
.param-table th, .param-table td {padding: 10px 12px;
text-align: left;
border-bottom: 1px solid var(--border)}
.param-table th {color: var(--text-secondary);
font-weight: 600;
font-size: 11px;
text-transform: uppercase;
letter-spacing: 0.5px;
background: var(--bg-input)}
.param-table td {font-family: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", "Menlo", monospace;
font-size: 12px;
word-break: break-all}
.param-table tr:hover td {background: rgba(99, 102, 241, 0.04)}
.param-table .copy-param {background: transparent;
border: none;
color: var(--accent);
cursor: pointer;
font-size: 12px;
padding: 2px 6px;
border-radius: 3px}
.param-table .copy-param:hover {background: var(--accent-bg)}
.param-count {font-size: 12px;
color: var(--text-secondary);
margin-bottom: 8px}
.util-row {display: flex;
align-items: center;
justify-content: space-between;
flex-wrap: wrap;
gap: 10px;
margin-top: 12px}
@media (max-width: 640px) {header h1 { font-size: 22px; }
.card { padding: 14px; }
.btn-group { gap: 6px; }
.btn { padding: 7px 12px; font-size: 12px; }
textarea { min-height: 100px; font-size: 12px; }
.param-table th, .param-table td { padding: 6px 8px; font-size: 11px; }}
.section-divider {border: none;
border-top: 1px solid var(--border);
margin: 20px 0}
footer {text-align: center;
padding: 20px;
color: var(--text-secondary);
font-size: 12px}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="URL 编解码工具">
  <meta property="og:description" content="URL编码解码工具，转换URL特殊字符编码">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/url-encoder/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>

<div class="container">
  <header>
    <h1>URL 编解码工具</h1>
    <p>URL 编码解码 · Base64 转换 · 参数解析 · 历史记录</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('url')">🔗 URL 编解码</button>
    <button class="tab-btn" onclick="switchTab('base64')">📦 Base64 编解码</button>
    <button class="tab-btn" onclick="switchTab('params')">📋 URL 参数解析</button>
  </div>

  <div id="tab-url" class="tab-panel active">

    <div class="card">
      <div class="card-header">
        <span class="card-title">输入内容</span>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="mode-toggle" id="modeToggle">
            <button class="active" onclick="setEncodeMode('component')" id="mode-component">encodeURIComponent</button>
            <button onclick="setEncodeMode('uri')" id="mode-uri">encodeURI</button>
          </div>
          <span class="mode-hint" id="modeHint">编码所有特殊字符（推荐）</span>
        </div>
      </div>
      <div class="auto-detect" id="autoDetect">
        <span class="dot"></span>
        <span id="autoDetectText"></span>
        <button class="btn btn-sm" id="autoDetectBtn" onclick="applyAutoDetect()"></button>
      </div>
      <textarea id="urlInput" placeholder="在此输入需要编码或解码的文本或 URL..." oninput="onInputChange()"></textarea>
      <div class="char-count">
        <span>字符数: <strong id="urlInputCount">0</strong></span>
        <span>字节数: <strong id="urlInputBytes">0</strong></span>
      </div>
    </div>

    <div class="btn-group" style="justify-content:center;">
      <button class="btn btn-primary" onclick="urlEncode()">🔒 URL 编码</button>
      <button class="btn btn-success" onclick="urlDecode()">🔓 URL 解码</button>
      <button class="btn" onclick="swapInputOutput()">🔄 交换</button>
      <button class="btn" onclick="copyResult('urlOutput')">📋 复制结果</button>
      <button class="btn" onclick="clearAll()">🗑️ 清空</button>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">输出结果</span>
      </div>
      <textarea id="urlOutput" placeholder="结果将显示在这里..." readonly></textarea>
      <div class="char-count">
        <span>字符数: <strong id="urlOutputCount">0</strong></span>
        <span>字节数: <strong id="urlOutputBytes">0</strong></span>
      </div>
    </div>
  </div>

  <div id="tab-base64" class="tab-panel">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Base64 输入</span>
      </div>
      <textarea id="b64Input" placeholder="在此输入需要 Base64 编码或解码的文本..." oninput="onB64InputChange()"></textarea>
      <div class="char-count">
        <span>字符数: <strong id="b64InputCount">0</strong></span>
        <span>字节数: <strong id="b64InputBytes">0</strong></span>
      </div>
    </div>

    <div class="btn-group" style="justify-content:center;">
      <button class="btn btn-primary" onclick="base64Encode()">🔒 Base64 编码</button>
      <button class="btn btn-success" onclick="base64Decode()">🔓 Base64 解码</button>
      <button class="btn" onclick="swapB64InputOutput()">🔄 交换</button>
      <button class="btn" onclick="copyResult('b64Output')">📋 复制结果</button>
      <button class="btn" onclick="clearB64()">🗑️ 清空</button>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Base64 输出</span>
      </div>
      <textarea id="b64Output" placeholder="结果将显示在这里..." readonly></textarea>
      <div class="char-count">
        <span>字符数: <strong id="b64OutputCount">0</strong></span>
        <span>字节数: <strong id="b64OutputBytes">0</strong></span>
      </div>
    </div>
  </div>

  <div id="tab-params" class="tab-panel">
    <div class="card">
      <div class="card-header">
        <span class="card-title">粘贴完整 URL 以解析参数</span>
      </div>
      <textarea id="paramInput" placeholder="在此粘贴包含查询参数的完整 URL，例如：&#10;https://example.com/path?name=张三&age=25&city=北京&q=hello%20world" oninput="parseParams()"></textarea>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">解析结果</span>
        <span class="param-count" id="paramCount">0 个参数</span>
      </div>
      <div id="paramResult">
        <div class="no-history">请在上方输入包含查询参数的 URL</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">📜 操作历史</span>
      <button class="btn btn-danger btn-xs" onclick="clearHistory()">清空历史</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="no-history">暂无操作记录</div>
    </div>
  </div>

  <footer>
    完全在浏览器本地运行 · 数据不上传服务器 · 历史记录存储在 localStorage
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
let encodeMode = 'component';
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  event.target.classList.add('active');
}
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 1800);
}
async function copyResult(elementId) {
  const el = document.getElementById(elementId);
  const text = el.value.trim();
  if (!text) {
    showToast('⚠️ 没有可复制的内容');
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
    showToast('✅ 已复制到剪贴板');
  } catch {
    el.select();
    document.execCommand('copy');
    showToast('✅ 已复制到剪贴板');
  }
}
function setEncodeMode(mode) {
  encodeMode = mode;
  document.getElementById('mode-component').classList.toggle('active', mode === 'component');
  document.getElementById('mode-uri').classList.toggle('active', mode === 'uri');
  const hint = document.getElementById('modeHint');
  hint.textContent = mode === 'component'
    ? '编码所有特殊字符（推荐）'
    : '保留 URL 协议和域名中的特殊字符';
  onInputChange();
}
function detectEncoding(text) {
  if (!text.trim()) return null;
  const hasPercentEncoding = /%[0-9A-Fa-f]{2}/.test(text);
  const hasRawSpecialChars = /[^\x00-\x7F]/.test(text) || /[^a-zA-Z0-9\-_.!~*'()/#?&=+$,;:@%]/.test(text);
  if (hasPercentEncoding && !hasRawSpecialChars) return 'encoded';
  if (!hasPercentEncoding && hasRawSpecialChars) return 'raw';
  if (hasPercentEncoding) return 'encoded';
  return null;
}
function onInputChange() {
  const input = document.getElementById('urlInput').value;
  updateCharCount('urlInput', 'urlInputCount', 'urlInputBytes');
  const detected = detectEncoding(input);
  const banner = document.getElementById('autoDetect');
  const textEl = document.getElementById('autoDetectText');
  const btnEl = document.getElementById('autoDetectBtn');
  if (detected === 'encoded') {
    banner.className = 'auto-detect encoded show';
    textEl.textContent = '检测到输入似乎已被编码，建议解码';
    btnEl.textContent = '🔓 立即解码';
    btnEl.onclick = urlDecode;
  } else if (detected === 'raw') {
    banner.className = 'auto-detect raw show';
    textEl.textContent = '检测到输入为原始文本，建议编码';
    btnEl.textContent = '🔒 立即编码';
    btnEl.onclick = urlEncode;
  } else {
    banner.className = 'auto-detect';
    banner.classList.remove('show');
  }
}
function applyAutoDetect() {
  const input = document.getElementById('urlInput').value;
  const detected = detectEncoding(input);
  if (detected === 'encoded') urlDecode();
  else if (detected === 'raw') urlEncode();
}
function updateCharCount(inputId, countId, bytesId) {
  const text = document.getElementById(inputId).value;
  document.getElementById(countId).textContent = text.length;
  document.getElementById(bytesId).textContent = new Blob([text]).size;
}
function urlEncode() {
  const input = document.getElementById('urlInput').value;
  if (!input.trim()) {
    showToast('⚠️ 请输入需要编码的内容');
    return;
  }
  try {
    let result;
    if (encodeMode === 'component') {
      result = encodeURIComponent(input);
    } else {
      result = encodeURI(input);
    }
    document.getElementById('urlOutput').value = result;
    updateCharCount('urlOutput', 'urlOutputCount', 'urlOutputBytes');
    addHistory('URL 编码', input.substring(0, 60), result.substring(0, 60));
    showToast('✅ URL 编码完成');
  } catch (e) {
    showToast('❌ 编码失败: ' + e.message);
  }
}
function urlDecode() {
  const input = document.getElementById('urlInput').value;
  if (!input.trim()) {
    showToast('⚠️ 请输入需要解码的内容');
    return;
  }
  try {
    let result;
    if (encodeMode === 'component') {
      result = decodeURIComponent(input);
    } else {
      result = decodeURI(input);
    }
    document.getElementById('urlOutput').value = result;
    updateCharCount('urlOutput', 'urlOutputCount', 'urlOutputBytes');
    addHistory('URL 解码', input.substring(0, 60), result.substring(0, 60));
    showToast('✅ URL 解码完成');
  } catch (e) {
    showToast('❌ 解码失败，请检查输入内容');
  }
}
function swapInputOutput() {
  const inputEl = document.getElementById('urlInput');
  const outputEl = document.getElementById('urlOutput');
  const temp = inputEl.value;
  inputEl.value = outputEl.value;
  outputEl.value = temp;
  updateCharCount('urlInput', 'urlInputCount', 'urlInputBytes');
  updateCharCount('urlOutput', 'urlOutputCount', 'urlOutputBytes');
  onInputChange();
  showToast('🔄 已交换输入输出');
}
function clearAll() {
  document.getElementById('urlInput').value = '';
  document.getElementById('urlOutput').value = '';
  updateCharCount('urlInput', 'urlInputCount', 'urlInputBytes');
  updateCharCount('urlOutput', 'urlOutputCount', 'urlOutputBytes');
  document.getElementById('autoDetect').classList.remove('show');
  showToast('🗑️ 已清空');
}
function base64Encode() {
  const input = document.getElementById('b64Input').value;
  if (!input.trim()) {
    showToast('⚠️ 请输入需要编码的内容');
    return;
  }
  try {
    const encoder = new TextEncoder();
    const bytes = encoder.encode(input);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    const result = btoa(binary);
    document.getElementById('b64Output').value = result;
    updateCharCount('b64Output', 'b64OutputCount', 'b64OutputBytes');
    addHistory('Base64 编码', input.substring(0, 60), result.substring(0, 60));
    showToast('✅ Base64 编码完成');
  } catch (e) {
    showToast('❌ 编码失败: ' + e.message);
  }
}
function base64Decode() {
  const input = document.getElementById('b64Input').value;
  if (!input.trim()) {
    showToast('⚠️ 请输入需要解码的内容');
    return;
  }
  try {
    const binary = atob(input);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    const decoder = new TextDecoder();
    const result = decoder.decode(bytes);
    document.getElementById('b64Output').value = result;
    updateCharCount('b64Output', 'b64OutputCount', 'b64OutputBytes');
    addHistory('Base64 解码', input.substring(0, 60), result.substring(0, 60));
    showToast('✅ Base64 解码完成');
  } catch (e) {
    showToast('❌ 解码失败，请检查 Base64 格式是否正确');
  }
}
function swapB64InputOutput() {
  const inputEl = document.getElementById('b64Input');
  const outputEl = document.getElementById('b64Output');
  const temp = inputEl.value;
  inputEl.value = outputEl.value;
  outputEl.value = temp;
  updateCharCount('b64Input', 'b64InputCount', 'b64InputBytes');
  updateCharCount('b64Output', 'b64OutputCount', 'b64OutputBytes');
  showToast('🔄 已交换输入输出');
}
function clearB64() {
  document.getElementById('b64Input').value = '';
  document.getElementById('b64Output').value = '';
  updateCharCount('b64Input', 'b64InputCount', 'b64InputBytes');
  updateCharCount('b64Output', 'b64OutputCount', 'b64OutputBytes');
  showToast('🗑️ 已清空');
}
function onB64InputChange() {
  updateCharCount('b64Input', 'b64InputCount', 'b64InputBytes');
}
function parseParams() {
  const input = document.getElementById('paramInput').value.trim();
  const resultDiv = document.getElementById('paramResult');
  const countEl = document.getElementById('paramCount');
  if (!input) {
    resultDiv.innerHTML = '<div class="no-history">请在上方输入包含查询参数的 URL</div>';
    countEl.textContent = '0 个参数';
    return;
  }
  let url;
  try {
    url = new URL(input);
  } catch {
    try {
      if (!input.startsWith('http://') && !input.startsWith('https://')) {
        url = new URL('https://' + input);
      } else {
        resultDiv.innerHTML = '<div class="no-history" style="color:#ef4444;">⚠️ 无效的 URL 格式</div>';
        countEl.textContent = '0 个参数';
        return;
      }
    } catch {
      resultDiv.innerHTML = '<div class="no-history" style="color:#ef4444;">⚠️ 无效的 URL 格式</div>';
      countEl.textContent = '0 个参数';
      return;
    }
  }
  const params = url.searchParams;
  const entries = [];
  for (const [key, value] of params.entries()) {
    entries.push({ key, value });
  }
  countEl.textContent = entries.length + ' 个参数';
  if (entries.length === 0) {
    resultDiv.innerHTML = '<div class="no-history">该 URL 没有查询参数</div>';
    return;
  }
  let info = '';
  if (url.pathname) {
    info += `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;word-break:break-all;">
      路径: <strong style="color:var(--text);">${escapeHtml(url.pathname)}</strong>
      ${url.hash ? '&nbsp;&nbsp;哈希: <strong style="color:var(--text);">' + escapeHtml(url.hash) + '</strong>' : ''}
    </div>`;
  }
  let table = '<table class="param-table" style="width:100%;">';
  table += '<thead><tr><th>#</th><th>参数名</th><th>参数值</th><th>操作</th></tr></thead><tbody>';
  entries.forEach((entry, index) => {
    table += `<tr>
      <td>${index + 1}</td>
      <td>${escapeHtml(entry.key)}</td>
      <td>${escapeHtml(entry.value)}</td>
      <td>
        <button class="copy-param" onclick="copyParam('${escapeAttr(entry.key)}','${escapeAttr(entry.value)}')" title="复制键值对">📋</button>
      </td>
    </tr>`;
  });
  table += '</tbody></table>';
  const fullQs = url.search;
  table += `<div style="margin-top:12px;font-size:12px;color:var(--text-secondary);">
    <div style="display:flex;align-items:center;gap:8px;">
      完整查询字符串:
      <code style="color:var(--text);word-break:break-all;background:var(--bg-input);padding:4px 8px;border-radius:4px;font-size:11px;">${escapeHtml(fullQs)}</code>
      <button class="btn btn-xs" onclick="navigator.clipboard.writeText('${escapeAttr(fullQs)}').then(()=>showToast('✅ 已复制'))">复制</button>
    </div>
  </div>`;
  resultDiv.innerHTML = info + table;
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str) {
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
}
function copyParam(key, value) {
  const text = key + '=' + value;
  navigator.clipboard.writeText(text).then(() => showToast('✅ 已复制: ' + text));
}
const MAX_HISTORY = 50;
function getHistory() {
  try {
    return JSON.parse(localStorage.getItem('url_encoder_history') || '[]');
  } catch {
    return [];
  }
}
function saveHistory(history) {
  localStorage.setItem('url_encoder_history', JSON.stringify(history));
}
function addHistory(operation, input, output) {
  const history = getHistory();
  history.unshift({
    operation,
    input,
    output,
    time: Date.now()
  });
  if (history.length > MAX_HISTORY) history.pop();
  saveHistory(history);
  renderHistory();
}
function renderHistory() {
  const history = getHistory();
  const listEl = document.getElementById('historyList');
  if (history.length === 0) {
    listEl.innerHTML = '<div class="no-history">暂无操作记录</div>';
    return;
  }
  listEl.innerHTML = history.map(item => {
    const time = new Date(item.time);
    const timeStr = formatTime(time);
    return `
      <div class="history-item">
        <span class="history-op">${escapeHtml(item.operation)}</span>
        <span class="history-text" title="${escapeHtml(item.input)}" onclick="restoreFromHistory('${escapeAttr(item.input)}')">
          ${escapeHtml(item.input || '(空)')}
        </span>
        <span class="history-time">${timeStr}</span>
      </div>`;
  }).join('');
}
function formatTime(date) {
  const now = new Date();
  const diff = now - date;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  const month = date.getMonth() + 1;
  const day = date.getDate();
  const hours = date.getHours().toString().padStart(2, '0');
  const minutes = date.getMinutes().toString().padStart(2, '0');
  return `${month}-${day} ${hours}:${minutes}`;
}
function restoreFromHistory(text) {
  switchTabDirect('url');
  document.getElementById('urlInput').value = text;
  updateCharCount('urlInput', 'urlInputCount', 'urlInputBytes');
  onInputChange();
  showToast('📥 已恢复历史记录');
}
function switchTabDirect(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  const buttons = document.querySelectorAll('.tab-btn');
  if (tab === 'url') buttons[0].classList.add('active');
  else if (tab === 'base64') buttons[1].classList.add('active');
  else if (tab === 'params') buttons[2].classList.add('active');
}
function clearHistory() {
  if (confirm('确定要清空所有操作历史吗？此操作不可撤销。')) {
    localStorage.removeItem('url_encoder_history');
    renderHistory();
    showToast('🗑️ 历史记录已清空');
  }
}
const _origAddHistory = addHistory;
addHistory = function(operation, input, output) {
  const history = getHistory();
  history.unshift({
    operation,
    input,
    output,
    time: Date.now(),
    tab: operation.startsWith('Base64') ? 'base64' : operation.startsWith('URL') ? 'url' : 'params'
  });
  if (history.length > MAX_HISTORY) history.pop();
  saveHistory(history);
  renderHistory();
};
renderHistory = function() {
  const history = getHistory();
  const listEl = document.getElementById('historyList');
  if (history.length === 0) {
    listEl.innerHTML = '<div class="no-history">暂无操作记录</div>';
    return;
  }
  listEl.innerHTML = history.map(item => {
    const time = new Date(item.time);
    const timeStr = formatTime(time);
    const tab = item.tab || 'url';
    return `
      <div class="history-item">
        <span class="history-op">${escapeHtml(item.operation)}</span>
        <span class="history-text" title="${escapeHtml(item.input)}" onclick="restoreFromHistoryTab('${escapeAttr(item.input)}', '${escapeAttr(tab)}')">
          ${escapeHtml(item.input || '(空)')}
        </span>
        <span class="history-time">${timeStr}</span>
      </div>`;
  }).join('');
};
function restoreFromHistoryTab(text, tab) {
  switchTabDirect(tab);
  if (tab === 'base64') {
    document.getElementById('b64Input').value = text;
    onB64InputChange();
  } else if (tab === 'params') {
    document.getElementById('paramInput').value = text;
    parseParams();
  } else {
    document.getElementById('urlInput').value = text;
    updateCharCount('urlInput', 'urlInputCount', 'urlInputBytes');
    onInputChange();
  }
  showToast('📥 已恢复历史记录');
}
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    const activeTab = document.querySelector('.tab-panel.active');
    if (activeTab.id === 'tab-url') {
      if (e.shiftKey) {
        urlDecode();
      } else {
        urlEncode();
      }
    } else if (activeTab.id === 'tab-base64') {
      if (e.shiftKey) {
        base64Decode();
      } else {
        base64Encode();
      }
    }
  }
});
renderHistory();
document.getElementById('paramInput').addEventListener('input', parseParams);
</script>
