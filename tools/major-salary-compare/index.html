<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 高考专业薪资对比 - Gary's Tools</title>
<meta name="description" content="2026高考热门专业毕业后薪资对比，含计算机、医学、金融、法学、人工智能等专业起薪和5年薪资预测">
<style>
:root{--bg:#fafafa;--card:#fff;--text:#1a1a2e;--text2:#6b7280;--accent:#6366f1;--gold:#f59e0b;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--border:#e5e7eb;--radius:14px}
[data-theme="dark"]{--bg:#0f0f1e;--card:#1a1a2e;--text:#e5e7eb;--text2:#9ca3af;--border:#2d2d4a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:560px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#6366f1,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.sort-bar{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto}
.sort-btn{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.78rem;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s}
.sort-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.major-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:0 1px 8px rgba(0,0,0,.03);position:relative;overflow:hidden}
.major-rank{position:absolute;top:12px;right:14px;font-size:.65rem;padding:3px 8px;border-radius:10px;font-weight:700}
.rank-top3{background:rgba(245,158,11,.15);color:var(--gold)}
.rank-other{background:rgba(107,114,128,.1);color:var(--text2)}
.major-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.major-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.major-name{font-size:1.05rem;font-weight:700}
.major-cat{font-size:.7rem;color:var(--text2)}
.salary-bar-wrap{margin-top:8px}
.salary-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.salary-label{font-size:.72rem;color:var(--text2);width:55px;flex-shrink:0;text-align:right}
.salary-bar-bg{flex:1;height:18px;background:var(--bg);border-radius:9px;overflow:hidden}
.salary-bar{height:100%;border-radius:9px;transition:width .6s ease;display:flex;align-items:center;padding-left:8px;font-size:.68rem;color:#fff;font-weight:600;white-space:nowrap}
.salary-bar.start{background:linear-gradient(90deg,#6366f1,#818cf8)}
.salary-bar.five{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.salary-bar.ten{background:linear-gradient(90deg,#10b981,#34d399)}
.demand-tag{display:inline-block;font-size:.65rem;padding:2px 8px;border-radius:8px;margin-top:6px;font-weight:500}
.tag-hot{background:rgba(239,68,68,.1);color:var(--red)}
.tag-steady{background:rgba(59,130,246,.1);color:var(--blue)}
.tag-niche{background:rgba(16,185,129,.1);color:var(--green)}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="💰 高考专业薪资对比 - Gary's Tools">
  <meta property="og:description" content="2026高考热门专业毕业后薪资对比，含计算机、医学、金融、法学、人工智能等专业起薪和5年薪资预测">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/major-salary-compare/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<header>
<h1>💰 高考专业薪资对比</h1>
<p>2026年热门专业毕业薪资参考 · 数据来源公开招聘</p>
</header>

<div class="sort-bar" id="sortBar">
<button class="sort-btn active" data-s="start">起薪排序</button>
<button class="sort-btn" data-s="five">5年薪资排序</button>
<button class="sort-btn" data-s="ratio">增长率排序</button>
</div>

<div id="majorList"></div>

<div class="card">
<h2>📊 多专业横向对比（选择2-3个专业对比薪资曲线）</h2>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px" id="majorSelectors"></div>
<div id="compareChart" style="min-height:120px;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--text2)">👆 点击上方专业名称开始对比</div>
</div>

<footer>数据仅供参考 · 薪资因城市/行业/个人差异较大</footer>
</div>

<script>
const MAJORS=[
{name:'人工智能',icon:'🤖',cat:'工科',start:18000,five:42000,ten:65000,demand:'hot',color:'#6366f1',desc:'AI Agent爆发，大模型人才紧缺'},
{name:'数据科学与大数据',icon:'📊',cat:'工科',start:16000,five:38000,ten:58000,demand:'hot',color:'#3b82f6',desc:'企业数字化转型核心推动力'},
{name:'计算机科学与技术',icon:'💻',cat:'工科',start:15000,five:35000,ten:55000,demand:'hot',color:'#6366f1',desc:'互联网/AI基础，就业面最广'},
{name:'软件工程',icon:'⚙️',cat:'工科',start:14000,five:33000,ten:50000,demand:'steady',color:'#3b82f6',desc:'各大厂核心岗位，需求稳定'},
{name:'电子信息工程',icon:'🔌',cat:'工科',start:13000,five:30000,ten:45000,demand:'steady',color:'#6366f1',desc:'芯片/半导体/通信行业刚需'},
{name:'临床医学',icon:'🩺',cat:'医学',start:8000,five:25000,ten:45000,demand:'steady',color:'#ef4444',desc:'前期投入大，后期收入稳定高'},
{name:'口腔医学',icon:'🦷',cat:'医学',start:12000,five:35000,ten:60000,demand:'hot',color:'#ef4444',desc:'私立诊所收入高，供需缺口大'},
{name:'金融学',icon:'📈',cat:'经管',start:12000,five:30000,ten:50000,demand:'steady',color:'#f59e0b',desc:'投行/基金/证券，上限极高'},
{name:'法学',icon:'⚖️',cat:'社科',start:7000,five:20000,ten:40000,demand:'steady',color:'#10b981',desc:'需过法考，前期收入低后期高'},
{name:'新能源科学与工程',icon:'🔋',cat:'工科',start:13000,five:30000,ten:42000,demand:'hot',color:'#34d399',desc:'光伏/锂电/储能，政策强驱动'},
{name:'生物医学工程',icon:'🧬',cat:'工科',start:11000,five:25000,ten:38000,demand:'niche',color:'#a855f7',desc:'医疗器械/基因检测持续增长'},
{name:'自动化',icon:'🎛️',cat:'工科',start:11000,five:28000,ten:40000,demand:'steady',color:'#6366f1',desc:'智能制造/工业机器人前景好'},
];

let sortBy='start';

function render(){
let sorted=[...MAJORS].sort((a,b)=>{
if(sortBy==='start')return b.start-a.start;
if(sortBy==='five')return b.five-a.five;
return b.five/b.start-a.five/a.start;
});
const maxFive=sorted[0].five;

const demandLabels={hot:'🔥 热门',steady:'📊 稳定',niche:'💎 蓝海'};

document.getElementById('majorList').innerHTML=sorted.map((m,i)=>{
const pct5=(m.five/maxFive*100).toFixed(0);
const pctS=(m.start/maxFive*100).toFixed(0);
const pct10=(m.ten/maxFive*100).toFixed(0);
const ratio=((m.five/m.start-1)*100).toFixed(0);
return`<div class="major-card">
<div class="major-rank${i<3?' rank-top3':' rank-other'}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</div>
<div class="major-header">
<div class="major-icon" style="background:${m.color}15">${m.icon}</div>
<div><div class="major-name">${m.name}</div><div class="major-cat">${m.cat} · ${m.desc}</div></div>
</div>
<div class="salary-bar-wrap">
<div class="salary-row"><span class="salary-label">起薪</span><div class="salary-bar-bg"><div class="salary-bar start" style="width:${pctS}%">¥${(m.start/10000).toFixed(1)}万/月</div></div></div>
<div class="salary-row"><span class="salary-label">5年经验</span><div class="salary-bar-bg"><div class="salary-bar five" style="width:${pct5}%">¥${(m.five/10000).toFixed(1)}万/月</div></div></div>
<div class="salary-row"><span class="salary-label">10年经验</span><div class="salary-bar-bg"><div class="salary-bar ten" style="width:${pct10}%">¥${(m.ten/10000).toFixed(1)}万/月</div></div></div>
</div>
<span class="demand-tag tag-${m.demand}">${demandLabels[m.demand]}</span>
<span style="font-size:.7rem;color:var(--text2);margin-left:8px">+${ratio}% (5年增长)</span>
</div>`}).join('');
}

document.getElementById('sortBar').addEventListener('click',e=>{
if(!e.target.classList.contains('sort-btn'))return;
document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
sortBy=e.target.dataset.s;
render();
});

render();

// 📊 多专业横向对比
let compareMajors=[];
const chartColors=['#6366f1','#f59e0b','#10b981'];

function initCompare(){
  const container=document.getElementById('majorSelectors');
  container.innerHTML=MAJORS.map((m,i)=>'<button class="sort-btn" data-ci="'+i+'" style="font-size:.72rem;padding:5px 10px">'+m.icon+' '+m.name+'</button>').join('');
  container.addEventListener('click',function(e){
    if(!e.target.classList.contains('sort-btn'))return;
    const ci=parseInt(e.target.dataset.ci);
    const idx=compareMajors.indexOf(ci);
    if(idx>=0){compareMajors.splice(idx,1);e.target.style.borderColor='var(--border)';e.target.style.background='var(--card)';e.target.style.color='var(--text2)';}
    else if(compareMajors.length>=3)return;
    else{compareMajors.push(ci);e.target.style.borderColor=chartColors[compareMajors.length-1];e.target.style.background=chartColors[compareMajors.length-1]+'15';e.target.style.color=chartColors[compareMajors.length-1];e.target.style.fontWeight='700';}
    updateCompareChart();
  });
}

function updateCompareChart(){
  const chart=document.getElementById('compareChart');
  if(compareMajors.length<2){chart.innerHTML='<span style="color:var(--text2);font-size:.85rem">👆 请选择至少2个专业进行对比（最多3个）</span>';return;}
  const selected=compareMajors.map(i=>MAJORS[i]);
  const maxVal=Math.max(...selected.flatMap(m=>[m.start,m.five,m.ten]));
  const labels=['起薪','5年','10年'];
  chart.innerHTML='<div style="width:100%"><div style="display:flex;gap:20px;justify-content:center;margin-bottom:10px">'+
    selected.map((m,i)=>'<span style="font-size:.7rem;font-weight:700;color:'+chartColors[i]+'">'+m.icon+' '+m.name+'</span>').join('')+'</div>'+
    labels.map((l,li)=>'<div style="margin-bottom:8px"><div style="font-size:.7rem;color:var(--text2);margin-bottom:2px">'+l+'</div><div style="display:flex;gap:4px;height:28px">'+
      selected.map((m,si)=>{const vals=[m.start,m.five,m.ten];const w=(vals[li]/maxVal*100).toFixed(0);return '<div style="flex:1;background:'+chartColors[si]+'20;border-radius:6px;position:relative;overflow:hidden"><div style="width:'+w+'%;height:100%;background:'+chartColors[si]+';border-radius:6px;display:flex;align-items:center;padding-left:4px;font-size:.6rem;color:#fff;font-weight:700;white-space:nowrap">¥'+(vals[li]/10000).toFixed(1)+'w</div></div>';}).join('')+
    '</div></div>').join('')+'</div>';
}

initCompare();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
