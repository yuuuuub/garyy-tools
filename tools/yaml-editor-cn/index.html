<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文YAML编辑器</title>
<meta name="description" content="中文YAML编辑器，实时编辑YAML配置文件">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px}
nav a{color:var(--accent2);text-decoration:none;font-size:14px}
nav h1{font-size:18px;font-weight:600}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar button{background:var(--border);color:var(--text);border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .2s}
.toolbar button:hover{background:var(--accent)}
.toolbar button.success{background:var(--success)}
.toolbar .spacer{flex:1}
.status-bar{background:var(--card);border-bottom:1px solid var(--border);padding:8px 20px;font-size:13px;display:flex;gap:16px;align-items:center}
.status-bar .valid{color:var(--success)}
.status-bar .invalid{color:var(--error)}
.panels{display:flex;flex:1;overflow:hidden}
.panel{flex:1;display:flex;flex-direction:column}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 16px;font-size:13px;color:#8b949e}
#editor{flex:1;width:100%;background:var(--bg);color:var(--text);border:none;padding:16px;font-size:14px;line-height:1.6;font-family:"SF Mono",Monaco,Consolas,monospace;resize:none;outline:none;tab-size:2}
#output{flex:1;background:var(--bg);color:var(--text);border:none;padding:16px;font-size:14px;line-height:1.6;font-family:"SF Mono",Monaco,Consolas,monospace;resize:none;outline:none;white-space:pre-wrap;overflow:auto}
.divider{width:4px;background:var(--border);cursor:col-resize;flex-shrink:0}
.toast{position:fixed;bottom:20px;right:20px;background:var(--success);color:var(--text);padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
@media(max-width:768px){.panels{flex-direction:column}.divider{width:100%;height:4px;cursor:row-resize}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="中文YAML编辑器">
  <meta property="og:description" content="中文YAML编辑器，实时编辑YAML配置文件">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/yaml-editor-cn/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<nav>
  <a href="/index.html">← 返回</a>
  <h1>中文YAML编辑器</h1>
</nav>
<div class="toolbar">
  <button onclick="formatYAML()" title="格式化">🔧 格式化</button>
  <button onclick="validateYAML()" title="校验">✅ 校验</button>
  <button onclick="yamlToJson()" class="success" title="YAML转JSON">YAML → JSON</button>
  <button onclick="jsonToYaml()" title="JSON转YAML">JSON → YAML</button>
  <button onclick="copyOutput()">📋 复制结果</button>
  <button onclick="loadDemo()">📄 加载示例</button>
  <span class="spacer"></span>
  <span class="valid" id="status">● 就绪</span>
</div>
<div class="panels">
  <div class="panel">
    <div class="panel-header"><span>YAML 编辑</span></div>
    <textarea id="editor" spellcheck="false" placeholder="在这里输入YAML代码..."></textarea>
  </div>
  <div class="divider" id="divider"></div>
  <div class="panel">
    <div class="panel-header"><span>JSON / 格式化输出</span></div>
    <div id="output"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const editor = document.getElementById('editor');
const output = document.getElementById('output');
const status = document.getElementById('status');
function parseYAML(str) {
  const lines = str.split('\n').filter(l => l.trim() && !l.trim().startsWith('#'));
  const result = {};
  const stack = [{ obj: result, indent: -1 }];
  let currentKey = null;
  let inArray = false;
  for (const line of lines) {
    const indent = line.search(/\S/);
    const trimmed = line.trim();
    if (trimmed.startsWith('- ')) {
      const val = trimmed.substring(2).trim();
      const parent = stack[stack.length - 1];
      if (!Array.isArray(parent.obj[currentKey])) {
        parent.obj[currentKey] = [];
      }
      if (val.includes(':')) {
        const [k, v] = val.split(':').map(s => s.trim());
        const item = {};
        item[k] = parseValue(v);
        parent.obj[currentKey].push(item);
      } else {
        parent.obj[currentKey].push(parseValue(val));
      }
      continue;
    }
    const colonIdx = trimmed.indexOf(':');
    if (colonIdx > 0) {
      const key = trimmed.substring(0, colonIdx).trim();
      const val = trimmed.substring(colonIdx + 1).trim();
      while (stack.length > 1 && indent <= stack[stack.length - 1].indent) {
        stack.pop();
      }
      if (val === '' || val === '|' || val === '>') {
        const newObj = {};
        stack[stack.length - 1].obj[key] = newObj;
        stack.push({ obj: newObj, indent: indent });
        currentKey = key;
      } else {
        stack[stack.length - 1].obj[key] = parseValue(val);
        currentKey = key;
      }
    }
  }
  return result;
}
function parseValue(val) {
  if (val === 'true') return true;
  if (val === 'false') return false;
  if (val === 'null' || val === '~') return null;
  if (/^-?\d+$/.test(val)) return parseInt(val);
  if (/^-?\d*\.\d+$/.test(val)) return parseFloat(val);
  if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
    return val.slice(1, -1);
  }
  if (val.startsWith('[') && val.endsWith(']')) {
    try { return JSON.parse(val); } catch { return val; }
  }
  return val;
}
function formatYAMLString(obj, indent = 0) {
  const pad = '  '.repeat(indent);
  let result = '';
  if (obj === null) return 'null';
  if (typeof obj === 'boolean') return String(obj);
  if (typeof obj === 'number') return String(obj);
  if (typeof obj === 'string') {
    if (obj.includes(':') || obj.includes('#') || obj.startsWith(' ') || obj.endsWith(' ') || obj === '') {
      return `"${obj.replace(/"/g, '\\"')}"`;
    }
    return obj;
  }
  if (Array.isArray(obj)) {
    if (obj.length === 0) return '[]';
    obj.forEach(item => {
      if (typeof item === 'object' && item !== null && !Array.isArray(item)) {
        const keys = Object.keys(item);
        result += `${pad}- ${keys[0]}: ${formatYAMLString(item[keys[0]], indent + 2)}\n`;
        keys.slice(1).forEach(k => {
          result += `${pad}  ${k}: ${formatYAMLString(item[k], indent + 2)}\n`;
        });
      } else {
        result += `${pad}- ${formatYAMLString(item, indent + 1)}\n`;
      }
    });
    return result.trimEnd();
  }
  if (typeof obj === 'object') {
    const keys = Object.keys(obj);
    if (keys.length === 0) return '{}';
    keys.forEach(key => {
      const val = obj[key];
      if (typeof val === 'object' && val !== null) {
        result += `${pad}${key}:\n${formatYAMLString(val, indent + 1)}\n`;
      } else {
        result += `${pad}${key}: ${formatYAMLString(val, indent + 1)}\n`;
      }
    });
    return result.trimEnd();
  }
  return String(obj);
}
function yamlToJson() {
  try {
    const obj = parseYAML(editor.value);
    const json = JSON.stringify(obj, null, 2);
    output.textContent = json;
    status.textContent = '● YAML → JSON 转换成功';
    status.className = 'valid';
    showToast('转换完成');
  } catch (e) {
    status.textContent = '● 解析错误: ' + e.message;
    status.className = 'invalid';
  }
}
function jsonToYaml() {
  try {
    const obj = JSON.parse(editor.value);
    const yaml = formatYAMLString(obj);
    editor.value = yaml;
    output.textContent = yaml;
    status.textContent = '● JSON → YAML 转换成功';
    status.className = 'valid';
    showToast('转换完成');
  } catch (e) {
    status.textContent = '● JSON解析错误: ' + e.message;
    status.className = 'invalid';
  }
}
function formatYAML() {
  try {
    const obj = parseYAML(editor.value);
    editor.value = formatYAMLString(obj);
    output.textContent = editor.value;
    status.textContent = '● 已格式化';
    status.className = 'valid';
    showToast('YAML 已格式化');
  } catch (e) {
    status.textContent = '● 格式化失败: ' + e.message;
    status.className = 'invalid';
  }
}
function validateYAML() {
  try {
    parseYAML(editor.value);
    status.textContent = '● 有效 YAML';
    status.className = 'valid';
    showToast('YAML 语法有效');
  } catch (e) {
    status.textContent = '● ' + e.message;
    status.className = 'invalid';
  }
}
function copyOutput() {
  const text = output.textContent || output.innerText;
  navigator.clipboard.writeText(text).then(() => showToast('已复制结果'));
}
function loadDemo() {
  editor.value = `# 用户配置文件
name: 张三
age: 28
email: zhangsan@example.com
isActive: true
address:
  city: 北京
  district: 朝阳区
  street: 建国路88号
hobbies:
  - 编程
  - 阅读
  - 游泳
education:
  - school: 清华大学
    degree: 硕士
    year: 2018
  - school: 北京大学
    degree: 学士
    year: 2015
settings:
  theme: dark
  language: zh-CN
  notifications: true`;
  yamlToJson();
}
editor.addEventListener('input', () => {
  clearTimeout(editor._timer);
  editor._timer = setTimeout(yamlToJson, 800);
});
const divider = document.getElementById('divider');
let isDragging = false;
divider.addEventListener('mousedown', (e) => { isDragging = true; e.preventDefault(); });
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const panels = document.querySelector('.panels');
  const rect = panels.getBoundingClientRect();
  const pct = ((e.clientX - rect.left) / rect.width) * 100;
  const clamped = Math.min(Math.max(pct, 20), 80);
  panels.children[0].style.flex = 'none';
  panels.children[0].style.width = clamped + '%';
  panels.children[2].style.flex = '1';
});
document.addEventListener('mouseup', () => { isDragging = false; });
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
loadDemo();
</script>

<script>
(function(){
  var e=document.getElementById('editor');
  if(e&&!e.value)e.value=`# YAML 示例
server:
  host: localhost
  port: 8080

database:
  driver: mysql
  name: myapp`;
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
