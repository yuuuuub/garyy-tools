<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消遣推荐</title>
<meta name="description" content="无聊时推荐活动，随机推荐有趣好玩的消遣方式">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;color:var(--text)}
.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.loading{text-align:center;padding:60px 0}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:.85rem}
.error{text-align:center;padding:40px 0;color:var(--red);font-size:.9rem}
.retry-btn{margin-top:10px;padding:8px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.85rem}
.activity-card{margin-top:30px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:32px 24px;text-align:center}
.activity-icon{font-size:3rem;margin-bottom:12px}
.activity-text{font-size:1.15rem;line-height:1.6;color:var(--text);font-weight:500;margin-bottom:20px}
.activity-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.activity-detail{background:var(--bg);border-radius:var(--radius);padding:12px}
.activity-detail .label{font-size:.75rem;color:var(--text2)}
.activity-detail .value{font-size:.92rem;font-weight:600;margin-top:4px;text-transform:capitalize}
.next-btn{display:block;margin:24px auto 0;padding:12px 32px;background:var(--blue);border:none;border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.9rem;transition:.2s}
.next-btn:hover{opacity:.9}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="消遣推荐">
  <meta property="og:description" content="无聊时推荐活动，随机推荐有趣好玩的消遣方式">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/bored-activity/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<header>
<h1>🎯 消遣推荐</h1>
<p class="sub">内置推荐 · 今天做什么</p>
</header>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var activities=[
{activity:'去公园散步',type:'relaxation',participants:1,price:0,accessibility:0.1,icon:'🚶'},

{activity:'给朋友打电话',type:'social',participants:2,price:0,accessibility:0.1,icon:'📞'},
{activity:'整理书架',type:'busywork',participants:1,price:0,accessibility:0.2,icon:'📚'},
{activity:'画一幅画',type:'recreational',participants:1,price:0.1,accessibility:0.2,icon:'🎨'},
{activity:'做瑜伽',type:'relaxation',participants:1,price:0,accessibility:0.1,icon:'🧘'},

{activity:'学习一个新技能',type:'education',participants:1,price:0,accessibility:0.5,icon:'📖'},
{activity:'整理照片',type:'busywork',participants:1,price:0,accessibility:0.1,icon:'🖼️'},
{activity:'参加志愿者活动',type:'charity',participants:3,price:0,accessibility:0.4,icon:'❤️'},
{activity:'听一个新播客',type:'education',participants:1,price:0,accessibility:0.1,icon:'🎧'},
{activity:'做手工',type:'diy',participants:1,price:0.3,accessibility:0.3,icon:'🔧'},
{activity:'看一部纪录片',type:'education',participants:1,price:0,accessibility:0.1,icon:'🎬'},
{activity:'去游泳',type:'recreational',participants:1,price:0.2,accessibility:0.3,icon:'🏊'},
{activity:'玩桌游',type:'social',participants:4,price:0,accessibility:0.3,icon:'🎲'},
{activity:'做早餐',type:'cooking',participants:1,price:0.2,accessibility:0.1,icon:'🥞'},
{activity:'写一首诗',type:'recreational',participants:1,price:0,accessibility:0.1,icon:'✍️'},
{activity:'冥想10分钟',type:'relaxation',participants:1,price:0,accessibility:0.1,icon:'🧘'},
{activity:'修理家里的东西',type:'diy',participants:1,price:0.1,accessibility:0.5,icon:'🔨'},
{activity:'和朋友视频聊天',type:'social',participants:2,price:0,accessibility:0.1,icon:'💻'},
{activity:'学一门外语',type:'education',participants:1,price:0,accessibility:0.4,icon:'🗣️'},
{activity:'烤饼干',type:'cooking',participants:2,price:0.3,accessibility:0.2,icon:'🍪'},
{activity:'去图书馆',type:'education',participants:1,price:0,accessibility:0.1,icon:'📚'},

{activity:'去野餐',type:'social',participants:3,price:0.3,accessibility:0.2,icon:'🧺'},
{activity:'学一个魔术',type:'recreational',participants:1,price:0,accessibility:0.3,icon:'🎩'},
{activity:'去钓鱼',type:'relaxation',participants:1,price:0.2,accessibility:0.3,icon:'🎣'},

{activity:'种一盆植物',type:'diy',participants:1,price:0.3,accessibility:0.2,icon:'🌱'},
{activity:'和朋友打球',type:'social',participants:4,price:0,accessibility:0.3,icon:'🏀'},
{activity:'做志愿服务',type:'charity',participants:2,price:0,accessibility:0.4,icon:'🤝'},
{activity:'学摄影',type:'education',participants:1,price:0.4,accessibility:0.3,icon:'📷'},
{activity:'下厨挑战新菜系',type:'cooking',participants:2,price:0.5,accessibility:0.4,icon:'🍜'}
];
function loadActivity(){
app.innerHTML='<div class="loading"><div class="spinner"></div><p>请稍候...</p></div>';
setTimeout(function(){
var data=activities[Math.floor(Math.random()*activities.length)];
var act=data.activity;
var type=data.type||'general';
var participants=data.participants||1;
var price=data.price||0;
var accessibility=data.accessibility||0;
var priceLabel=price===0?'免费':price<0.3?'便宜':price<0.6?'中等':'较贵';
var accessibilityLabel=accessibility<0.3?'容易':accessibility<0.6?'中等':'困难';
var icon=data.icon||'🎯';
var html='<div class="activity-card">';
html+='<div class="activity-icon">'+icon+'</div>';
html+='<div class="activity-text">'+act+'</div>';
html+='<div class="activity-details">';
html+='<div class="activity-detail"><div class="label">类型</div><div class="value">'+(type.charAt(0).toUpperCase()+type.slice(1))+'</div></div>';
html+='<div class="activity-detail"><div class="label">参与人数</div><div class="value">'+participants+' 人</div></div>';
html+='<div class="activity-detail"><div class="label">花费</div><div class="value">'+priceLabel+'</div></div>';
html+='<div class="activity-detail"><div class="label">难度</div><div class="value">'+accessibilityLabel+'</div></div>';
html+='</div></div>';
html+='<button class="next-btn" onclick="loadActivity()">🔄 换一个</button>';
app.innerHTML=html;
}, 400);
}
window.loadActivity=loadActivity;
loadActivity();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
