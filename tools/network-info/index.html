<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网络信息</title>
<meta name="description" content="网络信息 - 查看公网IP、连接类型、延迟测试">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vhpadding:16px;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.container{max-width:800px;margin:0 auto;padding:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 span{color:var(--accent)}
.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row .label{color:var(--muted)}
.info-row .value{font-weight:500;word-break:break-all;text-align:right;max-width:60%}
.btn{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px;margin-top:8px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.ping-result{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
.loading-text{color:var(--muted);font-style:italic}

/* === Smooth Animations === */
@keyframes animFadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes animScaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
body, .container, main, .container-fluid, .wrapper {
  animation: animFadeIn .45s ease-out both;
}
.weather-card, .word-card, .result-card, .output-card, .info-card,
.card, [class*="card"], [class*="panel"], [class*="result"], [class*="output"],
[class*="detail"], [class*="item"], [class*="section"]:not(header):not(nav),
[class*="box"]:not(.search-box) {
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.weather-card:hover, .word-card:hover, .result-card:hover, .output-card:hover,
.info-card:hover, .card:hover, [class*="card"]:hover, [class*="panel"]:hover,
[class*="result"]:hover, [class*="output"]:hover, [class*="detail"]:hover,
[class*="item"]:hover, [class*="box"]:not(.search-box):hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(0,0,0,.12);
}
button, input[type="submit"], .btn, [class*="btn"], .search-box button,
.filter-btn, .refresh-btn, .retry-btn {
  transition: transform .12s ease, opacity .2s ease, background .2s ease, box-shadow .2s ease;
}
button:active, input[type="submit"]:active, .btn:active, [class*="btn"]:active,
.search-box button:active, .filter-btn:active, .refresh-btn:active, .retry-btn:active {
  transform: scale(.96);
  opacity: .88;
}
button:hover, .btn:hover, [class*="btn"]:hover {
  box-shadow: 0 2px 8px rgba(59,130,246,.18);
}
html { scroll-behavior: smooth; }
.coin-item { transition: transform .2s ease, box-shadow .2s ease; }
.coin-item:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.city-item { transition: transform .2s ease, background .2s ease, border-color .2s ease; }
.city-item:hover { transform: translateX(4px); }
input[type="text"], input[type="number"], textarea, select {
  transition: border-color .2s ease, box-shadow .2s ease;
}
input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}
/* end animations */

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="网络信息">
  <meta property="og:description" content="网络信息 - 查看公网IP、连接类型、延迟测试">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/network-info/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="header">
<span style="font-size:28px">🌐</span>
<h1>网络信息</h1>
</div>
<div class="container">
<div class="card">
<h2><span>📡</span> IP地址信息</h2>
<div id="ipInfo"><div class="loading-text">获取中...</div></div>
<button class="btn" onclick="refreshIP()">🔄 刷新</button>
</div>
<div class="card">
<h2><span>🔗</span> 连接信息</h2>
<div id="connInfo"></div>
</div>
<div class="card">
<h2><span>📏</span> 网络延迟测试</h2>
<button class="btn" onclick="testPing()">测试延迟</button>
<div id="pingResult" style="margin-top:8px"></div>
</div>
<div class="card">
<h2><span>🌍</span> WebRTC本地IP</h2>
<div id="webrtcInfo"><div class="loading-text">获取中...</div></div>
</div>
</div>
<script>
function refreshIP(){
document.getElementById('ipInfo').innerHTML='<div class="loading-text">获取中...</div>';
fetch('https://ipwho.is/')
.then(function(r){return r.json();})
.then(function(d){
if(d.success===false)throw new Error(d.message||'查询失败');
let html=`<div class="info-row"><span class="label">公网IP</span><span class="value">${d.ip}</span></div>`;
html+=`<div class="info-row"><span class="label">国家</span><span class="value">${d.country} ${d.country_code}</span></div>`;
html+=`<div class="info-row"><span class="label">地区</span><span class="value">${d.region}, ${d.city}</span></div>`;
html+=`<div class="info-row"><span class="label">ISP</span><span class="value">${d.org}</span></div>`;
html+=`<div class="info-row"><span class="label">时区</span><span class="value">${d.timezone}</span></div>`;
html+=`<div class="info-row"><span class="label">经纬度</span><span class="value">${d.latitude}, ${d.longitude}</span></div>`;
document.getElementById('ipInfo').innerHTML=html;
}).catch(function(){
fetch('https://api.ip.sb/ip')
.then(function(r){return r.text();})
.then(function(ip){
let html=`<div class="info-row"><span class="label">公网IP</span><span class="value">${ip.trim()}</span></div>`;
document.getElementById('ipInfo').innerHTML=html;
}).catch(function(){
document.getElementById('ipInfo').innerHTML='<div class="loading-text">获取失败</div>';
});
});
}
function showConnInfo(){
const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
if(!c){document.getElementById('connInfo').innerHTML='<div class="info-row"><span class="label">连接API</span><span class="value">浏览器不支持</span></div>';return}
let html='';
html+=`<div class="info-row"><span class="label">有效类型</span><span class="value">${c.effectiveType||'N/A'}</span></div>`;
html+=`<div class="info-row"><span class="label">下行带宽</span><span class="value">${c.downlink?c.downlink+'Mbps':'N/A'}</span></div>`;
html+=`<div class="info-row"><span class="label">RTT</span><span class="value">${c.rtt!=null?c.rtt+'ms':'N/A'}</span></div>`;
html+=`<div class="info-row"><span class="label">省流量</span><span class="value">${c.saveData?'是':'否'}</span></div>`;
html+=`<div class="info-row"><span class="label">在线状态</span><span class="value">${navigator.onLine?'在线':'离线'}</span></div>`;
document.getElementById('connInfo').innerHTML=html;
}
function testPing(){
const targets=[
{name:'Cloudflare',url:'https://speed.cloudflare.com/cdn-cgi/trace'},
{name:'Baidu',url:'https://www.baidu.com/favicon.ico'},
{name:'百度',url:'https://www.baidu.com/favicon.ico'}
];
document.getElementById('pingResult').innerHTML='测试中...';
Promise.all(targets.map(t=>{
const s=performance.now();
return fetch(t.url,{cache:'no-store',mode:'no-cors'}).then(()=>({name:t.name,ms:Math.round(performance.now()-s)})).catch(()=>({name:t.name,ms:'超时'}));
})).then(results=>{
document.getElementById('pingResult').innerHTML=results.map(r=>{
const color=typeof r.ms==='number'?r.ms<100?'var(--green)':r.ms<300?'var(--yellow)':'var(--red)':'var(--red)';
return `<span class="ping-result" style="background:${color}20;color:${color}">${r.name}: ${r.ms}ms</span>`;
}).join(' ');
});
}
function getWebRTCIP(){
try{
const pc=new RTCPeerConnection({iceServers:[]});
pc.createDataChannel('');
pc.createOffer().then(o=>pc.setLocalDescription(o));
pc.onicecandidate=e=>{
if(!e||!e.candidate||!e.candidate.candidate)return;
const ip=e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
if(ip){
document.getElementById('webrtcInfo').innerHTML=`<div class="info-row"><span class="label">本地IP</span><span class="value">${ip[1]}</span></div>`;
pc.close();
}
};
setTimeout(()=>{if(!document.getElementById('webrtcInfo').querySelector('.value')){document.getElementById('webrtcInfo').innerHTML='<div class="info-row"><span class="label">本地IP</span><span class="value">无法获取(可能需要权限)</span></div>'}},3000);
}catch(e){document.getElementById('webrtcInfo').innerHTML='<div class="info-row"><span class="label">错误</span><span class="value">'+e.message+'</span></div>'}
}
refreshIP();showConnInfo();getWebRTCIP();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
