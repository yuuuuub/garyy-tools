<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="用户研究工具 - 规划和管理用户研究项目，包含访谈记录、研究计划和洞察总结">
    <meta name="robots" content="index, follow">
    <title>用户研究工具</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="i18n.js" defer></script>
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #0d9488; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; --hover-color: #f1f3f5; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #2dd4bf; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; --hover-color: #3a3a3a; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        textarea { resize: vertical; min-height: 60px; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 8px; margin-bottom: 8px; }
        button:hover { opacity: 0.9; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-danger { background-color: var(--danger-color); }
        .btn-success { background-color: var(--success-color); }
        .btn-secondary { background-color: var(--secondary-color); }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); }
        .tab { padding: 10px 20px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; color: var(--secondary-color); }
        .tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-right: 4px; }
        .tag-method { background: color-mix(in srgb, var(--primary-color) 15%, var(--card-bg)); color: var(--primary-color); }
        .tag-status-new { background: #dbeafe; color: #2563eb; }
        .tag-status-progress { background: #fef3c7; color: #d97706; }
        .tag-status-done { background: #d1fae5; color: #059669; }
        .research-item { border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 12px; background: var(--bg-color); }
        .research-item h4 { margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
        .insight-card { padding: 14px; border-left: 4px solid var(--primary-color); background: var(--bg-color); border-radius: 0 8px 8px 0; margin-bottom: 10px; }
        .persona-card { border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; text-align: center; background: var(--bg-color); }
        .persona-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 12px; }
        .stat-box { text-align: center; padding: 16px; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--border-color); }
        .stat-box .num { font-size: 32px; font-weight: bold; color: var(--primary-color); }
        .stat-box .label { font-size: 13px; color: var(--secondary-color); }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>用户研究工具</h1>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('projects')">研究项目</div>
            <div class="tab" onclick="switchTab('interviews')">访谈记录</div>
            <div class="tab" onclick="switchTab('insights')">洞察汇总</div>
            <div class="tab" onclick="switchTab('dashboard')">概览</div>
        </div>

        <div id="tab-projects" class="tab-content active">
            <div class="card">
                <h3>新建研究项目</h3>
                <div class="grid-2">
                    <div class="form-group"><label>项目名称</label><input type="text" id="projName" placeholder="如：电商App改版调研"></div>
                    <div class="form-group"><label>研究方法</label>
                        <select id="projMethod">
                            <option value="usability">可用性测试</option>
                            <option value="interview">用户访谈</option>
                            <option value="survey">问卷调查</option>
                            <option value="card-sort">卡片分类</option>
                            <option value="tree-test">树测试</option>
                            <option value="a-b">A/B测试分析</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>研究目标</label><textarea id="projGoal" placeholder="本次研究要验证的核心假设或目标..."></textarea></div>
                <div class="form-group"><label>目标用户</label><input type="text" id="projUsers" placeholder="如：25-35岁电商活跃用户"></div>
                <button onclick="addProject()">创建项目</button>
            </div>
            <div class="card">
                <h3>研究项目列表 <span id="projCount" style="color:var(--secondary-color)">(0)</span></h3>
                <div id="projList"></div>
            </div>
        </div>

        <div id="tab-interviews" class="tab-content">
            <div class="card">
                <h3>访谈记录</h3>
                <div class="grid-2">
                    <div class="form-group"><label>受访者</label><input type="text" id="interviewee" placeholder="姓名/代号"></div>
                    <div class="form-group"><label>关联项目</label><select id="interviewProj"><option value="">选择项目...</option></select></div>
                </div>
                <div class="form-group"><label>访谈日期</label><input type="text" id="interviewDate" placeholder="YYYY-MM-DD"></div>
                <div class="form-group"><label>关键发现</label><textarea id="interviewFindings" rows="3" placeholder="受访者的痛点、需求和行为..."></textarea></div>
                <div class="form-group"><label>直接引语</label><textarea id="interviewQuotes" rows="2" placeholder="受访者的原话..."></textarea></div>
                <div class="form-group"><label>情绪/态度</label>
                    <select id="interviewMood"><option value="positive">积极</option><option value="neutral">中性</option><option value="negative">消极</option><option value="frustrated">受挫</option></select>
                </div>
                <button onclick="addInterview()">保存记录</button>
            </div>
            <div class="card">
                <h3>访谈列表 <span id="intCount" style="color:var(--secondary-color)">(0)</span></h3>
                <div id="intList"></div>
            </div>
        </div>

        <div id="tab-insights" class="tab-content">
            <div class="card">
                <h3>提取洞察</h3>
                <div class="form-group"><label>洞察标题</label><input type="text" id="insightTitle" placeholder="如：用户在结账流程中感到困惑"></div>
                <div class="grid-2">
                    <div class="form-group"><label>类型</label>
                        <select id="insightType"><option value="pain">痛点</option><option value="need">需求</option><option value="behavior">行为模式</option><option value="opportunity">机会点</option></select>
                    </div>
                    <div class="form-group"><label>优先级</label>
                        <select id="insightPriority"><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select>
                    </div>
                </div>
                <div class="form-group"><label>详细描述</label><textarea id="insightDesc" rows="3"></textarea></div>
                <div class="form-group"><label>支持证据（来源）</label><input type="text" id="insightSource" placeholder="如：来自访谈#3, 受访者A"></div>
                <button onclick="addInsight()">添加洞察</button>
            </div>
            <div class="card">
                <h3>洞察列表 <span id="insightCount" style="color:var(--secondary-color)">(0)</span></h3>
                <div id="insightList"></div>
            </div>
        </div>

        <div id="tab-dashboard" class="tab-content">
            <div class="grid-3" id="dashStats"></div>
            <div class="card">
                <h3>洞察分布</h3>
                <div id="insightDistribution"></div>
            </div>
        </div>
    </div>

    <script>
        let projects = [];
        let interviews = [];
        let insights = [];

        function toggleTheme() {
            const html = document.documentElement;
            html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
        }

        function switchTab(name) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', ['projects','interviews','insights','dashboard'][i] === name);
            });
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            if (name === 'dashboard') renderDashboard();
            if (name === 'interviews') renderProjectSelects();
        }

        function addProject() {
            const name = document.getElementById('projName').value.trim();
            if (!name) { alert('请输入项目名称'); return; }
            projects.push({
                name, method: document.getElementById('projMethod').value,
                goal: document.getElementById('projGoal').value.trim(),
                users: document.getElementById('projUsers').value.trim(),
                status: 'new', id: Date.now()
            });
            document.getElementById('projName').value = '';
            document.getElementById('projGoal').value = '';
            document.getElementById('projUsers').value = '';
            renderProjects();
        }

        function renderProjects() {
            const el = document.getElementById('projList');
            document.getElementById('projCount').textContent = '(' + projects.length + ')';
            const methodNames = { usability:'可用性测试', interview:'用户访谈', survey:'问卷调查', 'card-sort':'卡片分类', 'tree-test':'树测试', 'a-b':'A/B测试' };
            const statusNames = { new:'新建', progress:'进行中', done:'已完成' };
            const statusCls = { new:'tag-status-new', progress:'tag-status-progress', done:'tag-status-done' };
            el.innerHTML = projects.map((p, i) => `
                <div class="research-item">
                    <h4><span>${esc(p.name)}</span>
                        <span>
                            <span class="tag tag-method">${methodNames[p.method]}</span>
                            <span class="tag ${statusCls[p.status]}">${statusNames[p.status]}</span>
                            <button class="btn-sm" onclick="cycleStatus(${i})">切换状态</button>
                            <button class="btn-sm btn-danger" onclick="projects.splice(${i},1);renderProjects()">删除</button>
                        </span>
                    </h4>
                    <div style="font-size:13px;color:var(--secondary-color);">
                        <div><strong>目标：</strong>${esc(p.goal || '未设置')}</div>
                        <div><strong>目标用户：</strong>${esc(p.users || '未设置')}</div>
                    </div>
                </div>
            `).join('') || '<div style="color:var(--secondary-color);text-align:center;padding:20px;">暂无项目</div>';
        }

        function cycleStatus(i) {
            const order = ['new', 'progress', 'done'];
            projects[i].status = order[(order.indexOf(projects[i].status) + 1) % 3];
            renderProjects();
        }

        function renderProjectSelects() {
            const sel = document.getElementById('interviewProj');
            sel.innerHTML = '<option value="">选择项目...</option>' + projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
        }

        function addInterview() {
            const name = document.getElementById('interviewee').value.trim();
            if (!name) { alert('请输入受访者'); return; }
            interviews.push({
                name, projectId: document.getElementById('interviewProj').value,
                date: document.getElementById('interviewDate').value || new Date().toLocaleDateString(),
                findings: document.getElementById('interviewFindings').value.trim(),
                quotes: document.getElementById('interviewQuotes').value.trim(),
                mood: document.getElementById('interviewMood').value, id: Date.now()
            });
            document.getElementById('interviewee').value = '';
            document.getElementById('interviewFindings').value = '';
            document.getElementById('interviewQuotes').value = '';
            renderInterviews();
        }

        function renderInterviews() {
            const el = document.getElementById('intList');
            document.getElementById('intCount').textContent = '(' + interviews.length + ')';
            const moodEmoji = { positive:'😊', neutral:'😐', negative:'😟', frustrated:'😤' };
            el.innerHTML = interviews.map((r, i) => `
                <div class="research-item">
                    <h4><span>${moodEmoji[r.mood]} ${esc(r.name)} <span style="font-weight:normal;color:var(--secondary-color);font-size:13px;">${r.date}</span></span>
                    <button class="btn-sm btn-danger" onclick="interviews.splice(${i},1);renderInterviews()">删除</button></h4>
                    ${r.findings ? `<div style="margin-top:8px;"><strong>发现：</strong>${esc(r.findings)}</div>` : ''}
                    ${r.quotes ? `<div style="margin-top:4px;font-style:italic;color:var(--secondary-color);">"${esc(r.quotes)}"</div>` : ''}
                </div>
            `).join('') || '<div style="color:var(--secondary-color);text-align:center;padding:20px;">暂无访谈记录</div>';
        }

        function addInsight() {
            const title = document.getElementById('insightTitle').value.trim();
            if (!title) { alert('请输入洞察标题'); return; }
            insights.push({
                title, type: document.getElementById('insightType').value,
                priority: document.getElementById('insightPriority').value,
                desc: document.getElementById('insightDesc').value.trim(),
                source: document.getElementById('insightSource').value.trim(), id: Date.now()
            });
            document.getElementById('insightTitle').value = '';
            document.getElementById('insightDesc').value = '';
            document.getElementById('insightSource').value = '';
            renderInsights();
        }

        function renderInsights() {
            const el = document.getElementById('insightList');
            document.getElementById('insightCount').textContent = '(' + insights.length + ')';
            const typeNames = { pain:'痛点', need:'需求', behavior:'行为', opportunity:'机会' };
            const typeColors = { pain:'var(--danger-color)', need:'var(--primary-color)', behavior:'var(--warning-color)', opportunity:'var(--success-color)' };
            const priNames = { high:'高', medium:'中', low:'低' };
            el.innerHTML = insights.map((ins, i) => `
                <div class="insight-card" style="border-left-color:${typeColors[ins.type]}">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <strong>${esc(ins.title)}</strong>
                        <span>
                            <span class="tag" style="background:${typeColors[ins.type]};color:white;">${typeNames[ins.type]}</span>
                            <span class="tag" style="background:var(--border-color);">优先级: ${priNames[ins.priority]}</span>
                            <button class="btn-sm btn-danger" onclick="insights.splice(${i},1);renderInsights()">删除</button>
                        </span>
                    </div>
                    ${ins.desc ? `<div style="margin-top:6px;font-size:14px;">${esc(ins.desc)}</div>` : ''}
                    ${ins.source ? `<div style="margin-top:4px;font-size:12px;color:var(--secondary-color);">来源: ${esc(ins.source)}</div>` : ''}
                </div>
            `).join('') || '<div style="color:var(--secondary-color);text-align:center;padding:20px;">暂无洞察</div>';
        }

        function renderDashboard() {
            const painCount = insights.filter(i => i.type === 'pain').length;
            const needCount = insights.filter(i => i.type === 'need').length;
            const behaviorCount = insights.filter(i => i.type === 'behavior').length;
            const oppCount = insights.filter(i => i.type === 'opportunity').length;

            document.getElementById('dashStats').innerHTML = `
                <div class="stat-box"><div class="num">${projects.length}</div><div class="label">研究项目</div></div>
                <div class="stat-box"><div class="num">${interviews.length}</div><div class="label">访谈记录</div></div>
                <div class="stat-box"><div class="num">${insights.length}</div><div class="label">洞察总数</div></div>
            `;

            const dist = document.getElementById('insightDistribution');
            const types = [{name:'痛点',count:painCount,color:'var(--danger-color)'},{name:'需求',count:needCount,color:'var(--primary-color)'},{name:'行为模式',count:behaviorCount,color:'var(--warning-color)'},{name:'机会点',count:oppCount,color:'var(--success-color)'}];
            dist.innerHTML = types.map(t => {
                const pct = insights.length ? Math.round(t.count / insights.length * 100) : 0;
                return `<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>${t.name}</span><span>${t.count}个 (${pct}%)</span></div><div style="height:8px;background:var(--border-color);border-radius:4px;"><div style="height:100%;width:${pct}%;background:${t.color};border-radius:4px;"></div></div></div>`;
            }).join('');
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        renderProjects();
    </script>
</body>
</html>
