<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字测验 - 在线汉字知识测试</title>
<meta property="og:title" content="汉字测验 - 在线汉字知识测试">
<meta property="og:description" content="汉字测验 - 在线汉字知识测试 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="汉字测验 - 测试你的汉字知识，支持拼音、部首、释义等多种题型">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --blue: #3b82f6;
  --green: #238636;
  --red: #ef4444;
  --radius: 10px;
  --transition: 0.2s ease;
}
[data-theme="light"] {
  --bg: #f6f8fa;
  --card: #fff;
  --border: #d0d7de;
  --text: #1f2328;
  --text2: #656d76;
  --blue: #0969da;
  --green: #1a7f37;
  --red: #cf222e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  padding: 16px;
}
.container { max-width: 800px; margin: auto; }
h1 { text-align: center; padding: 24px 0 8px; font-size: 1.5rem; }
.sub { text-align: center; color: var(--text2); font-size: .85rem; margin-bottom: 20px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.btn {
  display: inline-block;
  padding: 10px 24px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: .9rem;
  margin-top: 12px;
  transition: var(--transition);
}
.btn:hover { opacity: .85; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.btn-secondary { background: var(--border); color: var(--text); }
.quiz-question {
  text-align: center;
  margin: 20px 0;
}
.quiz-char {
  font-size: 6rem;
  margin: 20px 0;
}
.quiz-text {
  font-size: 1.1rem;
  margin-bottom: 20px;
}
.quiz-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  max-width: 500px;
  margin: 0 auto;
}
.quiz-option {
  padding: 16px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  transition: var(--transition);
  text-align: center;
}
.quiz-option:hover {
  border-color: var(--blue);
  background: var(--card);
}
.quiz-option.correct {
  background: rgba(35,134,54,0.2);
  border-color: var(--green);
  color: var(--green);
}
.quiz-option.wrong {
  background: rgba(239,68,68,0.2);
  border-color: var(--red);
  color: var(--red);
}
.quiz-option.disabled {
  pointer-events: none;
  opacity: 0.6;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  margin: 16px 0;
  font-size: .9rem;
}
.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin: 12px 0;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--blue);
  transition: width 0.3s;
  border-radius: 3px;
}
.score-display {
  text-align: center;
  font-size: 1.2rem;
  margin: 16px 0;
}
.score-value {
  font-size: 2rem;
  font-weight: bold;
  color: var(--blue);
}
.type-select {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.type-btn {
  padding: 8px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: .85rem;
  transition: var(--transition);
}
.type-btn:hover {
  border-color: var(--blue);
}
.type-btn.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.difficulty-select {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
.difficulty-btn {
  padding: 8px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: .85rem;
  transition: var(--transition);
}
.difficulty-btn.active {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.result-card {
  text-align: center;
  padding: 30px;
}
.result-score {
  font-size: 3rem;
  font-weight: bold;
  color: var(--blue);
  margin: 20px 0;
}
.result-message {
  font-size: 1.2rem;
  margin-bottom: 20px;
}
.result-stats {
  display: flex;
  justify-content: space-around;
  margin: 20px 0;
}
.result-stat {
  text-align: center;
}
.result-stat-value {
  font-size: 1.5rem;
  font-weight: bold;
  color: var(--green);
}
.result-stat-label {
  font-size: .85rem;
  color: var(--text2);
}
.streak-display {
  text-align: center;
  margin: 12px 0;
  font-size: .9rem;
}
.streak-value {
  color: var(--blue);
  font-weight: bold;
}
.history {
  margin-top: 16px;
}
.history-item {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  font-size: .85rem;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
body, .container { animation: fadeIn .4s ease-out; }
@keyframes correctPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}
@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>📝 汉字测验</h1>
  <p class="sub">测试你的汉字知识</p>

  <div class="card">
    <div class="type-select">
      <button class="type-btn active" onclick="setType('pinyin')">拼音测试</button>
      <button class="type-btn" onclick="setType('meaning')">释义测试</button>
      <button class="type-btn" onclick="setType('radical')">部首测试</button>
      <button class="type-btn" onclick="setType('stroke')">笔画测试</button>
    </div>
    <div class="difficulty-select">
      <button class="difficulty-btn active" onclick="setDifficulty('easy')">简单</button>
      <button class="difficulty-btn" onclick="setDifficulty('medium')">中等</button>
      <button class="difficulty-btn" onclick="setDifficulty('hard')">困难</button>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="startQuiz()">开始测验</button>
      <button class="btn btn-secondary" onclick="resetQuiz()">重置</button>
      <button class="btn btn-secondary" onclick="toggleTheme()">🌓 切换主题</button>
    </div>
  </div>

  <div class="card" id="quizCard" style="display:none">
    <div class="progress-info">
      <span>题目: <span id="currentQ">1</span> / <span id="totalQ">10</span></span>
      <span>得分: <span id="currentScore">0</span></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressBar" style="width:0%"></div>
    </div>
    <div class="streak-display">连续答对: <span class="streak-value" id="streak">0</span></div>

    <div class="quiz-question">
      <div class="quiz-char" id="quizChar">龙</div>
      <div class="quiz-text" id="quizText">请选择正确的拼音</div>
      <div class="quiz-options" id="quizOptions"></div>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="result-card">
      <h2>测验完成!</h2>
      <div class="result-score" id="resultScore">80</div>
      <div class="result-message" id="resultMessage">很好!</div>
      <div class="result-stats">
        <div class="result-stat">
          <div class="result-stat-value" id="correctCount">8</div>
          <div class="result-stat-label">正确</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-value" id="wrongCount">2</div>
          <div class="result-stat-label">错误</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-value" id="maxStreak">5</div>
          <div class="result-stat-label">最长连续</div>
        </div>
      </div>
      <button class="btn" onclick="startQuiz()">再次测验</button>
    </div>
  </div>

  <div class="card history" id="historyCard" style="display:none">
    <h3 style="margin-bottom:12px">测验记录</h3>
    <div id="history"></div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var characters = [
  {char:'永',pinyin:'yǒng',meaning:'永远',radical:'水',stroke:5},
  {char:'一',pinyin:'yī',meaning:'一个',radical:'一',stroke:1},
  {char:'二',pinyin:'èr',meaning:'两个',radical:'二',stroke:2},
  {char:'三',pinyin:'sān',meaning:'三个',radical:'一',stroke:3},
  {char:'四',pinyin:'sì',meaning:'四个',radical:'囗',stroke:5},
  {char:'五',pinyin:'wǔ',meaning:'五个',radical:'二',stroke:4},
  {char:'六',pinyin:'liù',meaning:'六个',radical:'八',stroke:4},
  {char:'七',pinyin:'qī',meaning:'七个',radical:'一',stroke:2},
  {char:'八',pinyin:'bā',meaning:'八个',radical:'八',stroke:2},
  {char:'九',pinyin:'jiǔ',meaning:'九个',radical:'乙',stroke:2},
  {char:'十',pinyin:'shí',meaning:'十个',radical:'十',stroke:2},
  {char:'大',pinyin:'dà',meaning:'大的',radical:'大',stroke:3},
  {char:'小',pinyin:'xiǎo',meaning:'小的',radical:'小',stroke:3},
  {char:'多',pinyin:'duō',meaning:'很多',radical:'夕',stroke:6},
  {char:'少',pinyin:'shǎo',meaning:'很少',radical:'小',stroke:4},
  {char:'上',pinyin:'shàng',meaning:'上面',radical:'一',stroke:3},
  {char:'下',pinyin:'xià',meaning:'下面',radical:'一',stroke:3},
  {char:'人',pinyin:'rén',meaning:'人类',radical:'人',stroke:2},
  {char:'口',pinyin:'kǒu',meaning:'嘴巴',radical:'口',stroke:3},
  {char:'日',pinyin:'rì',meaning:'太阳',radical:'日',stroke:4},
  {char:'月',pinyin:'yuè',meaning:'月亮',radical:'月',stroke:4},
  {char:'水',pinyin:'shuǐ',meaning:'水',radical:'水',stroke:4},
  {char:'火',pinyin:'huǒ',meaning:'火',radical:'火',stroke:4},
  {char:'木',pinyin:'mù',meaning:'树木',radical:'木',stroke:4},
  {char:'金',pinyin:'jīn',meaning:'金属',radical:'金',stroke:8},
  {char:'土',pinyin:'tǔ',meaning:'泥土',radical:'土',stroke:3},
  {char:'山',pinyin:'shān',meaning:'山',radical:'山',stroke:3},
  {char:'石',pinyin:'shí',meaning:'石头',radical:'石',stroke:5},
  {char:'田',pinyin:'tián',meaning:'田地',radical:'田',stroke:5},
  {char:'王',pinyin:'wáng',meaning:'国王',radical:'王',stroke:4},
  {char:'马',pinyin:'mǎ',meaning:'马',radical:'马',stroke:3},
  {char:'鸟',pinyin:'niǎo',meaning:'鸟',radical:'鸟',stroke:5},
  {char:'鱼',pinyin:'yú',meaning:'鱼',radical:'鱼',stroke:8},
  {char:'牛',pinyin:'niú',meaning:'牛',radical:'牛',stroke:4},
  {char:'羊',pinyin:'yáng',meaning:'羊',radical:'羊',stroke:6},
  {char:'竹',pinyin:'zhú',meaning:'竹子',radical:'竹',stroke:6},
  {char:'米',pinyin:'mǐ',meaning:'大米',radical:'米',stroke:6},
  {char:'麦',pinyin:'mài',meaning:'小麦',radical:'麦',stroke:7},
  {char:'豆',pinyin:'dòu',meaning:'豆子',radical:'豆',stroke:7},
  {char:'车',pinyin:'chē',meaning:'车',radical:'车',stroke:4},
  {char:'门',pinyin:'mén',meaning:'门',radical:'门',stroke:3},
  {char:'龙',pinyin:'lóng',meaning:'龙',radical:'龙',stroke:5},
  {char:'凤',pinyin:'fèng',meaning:'凤凰',radical:'几',stroke:4},
  {char:'福',pinyin:'fú',meaning:'福气',radical:'礻',stroke:15},
  {char:'禄',pinyin:'lù',meaning:'俸禄',radical:'礻',stroke:12},
  {char:'寿',pinyin:'shòu',meaning:'长寿',radical:'寸',stroke:7},
  {char:'喜',pinyin:'xǐ',meaning:'喜悦',radical:'口',stroke:12},
  {char:'财',pinyin:'cái',meaning:'财富',radical:'贝',stroke:7},
  {char:'吉',pinyin:'jí',meaning:'吉祥',radical:'口',stroke:6},
  {char:'祥',pinyin:'xiáng',meaning:'祥瑞',radical:'礻',stroke:10}
];

var quizType = 'pinyin';
var difficulty = 'easy';
var totalQuestions = 10;
var currentQuestion = 0;
var score = 0;
var streak = 0;
var maxStreak = 0;
var questions = [];
var answered = false;
var history = [];

function init() {
  // ready
}

function setType(type) {
  quizType = type;
  document.querySelectorAll('.type-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.textContent.includes(getTypeLabel(type)));
  });
}

function getTypeLabel(type) {
  var labels = {pinyin:'拼音',meaning:'释义',radical:'部首',stroke:'笔画'};
  return labels[type] || type;
}

function setDifficulty(d) {
  difficulty = d;
  document.querySelectorAll('.difficulty-btn').forEach(function(btn) {
    var labels = {easy:'简单',medium:'中等',hard:'困难'};
    btn.classList.toggle('active', btn.textContent === labels[d]);
  });
}

function startQuiz() {
  currentQuestion = 0;
  score = 0;
  streak = 0;
  maxStreak = 0;
  questions = generateQuestions();
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('totalQ').textContent = totalQuestions;
  showQuestion();
}

function generateQuestions() {
  var shuffled = characters.slice().sort(function() { return Math.random() - 0.5; });
  var count = difficulty === 'easy' ? 8 : difficulty === 'medium' ? 12 : 16;
  var pool = shuffled.slice(0, Math.min(count, shuffled.length));
  var qs = [];
  for(var i = 0; i < totalQuestions; i++) {
    var correct = pool[i % pool.length];
    var options = [correct];
    while(options.length < 4) {
      var random = characters[Math.floor(Math.random() * characters.length)];
      if(!options.some(function(o) { return o.char === random.char; })) {
        options.push(random);
      }
    }
    options = shuffleArray(options);
    qs.push({correct:correct, options:options});
  }
  return qs;
}

function showQuestion() {
  if(currentQuestion >= totalQuestions) {
    showResult();
    return;
  }
  answered = false;
  var q = questions[currentQuestion];
  document.getElementById('currentQ').textContent = currentQuestion + 1;
  document.getElementById('currentScore').textContent = score;
  document.getElementById('streak').textContent = streak;
  document.getElementById('progressBar').style.width = ((currentQuestion / totalQuestions) * 100) + '%';
  document.getElementById('quizChar').textContent = q.correct.char;
  var text = '';
  switch(quizType) {
    case 'pinyin': text = '请选择正确的拼音'; break;
    case 'meaning': text = '请选择正确的释义'; break;
    case 'radical': text = '请选择正确的部首'; break;
    case 'stroke': text = '请选择正确的笔画数'; break;
  }
  document.getElementById('quizText').textContent = text;
  var html = '';
  q.options.forEach(function(opt) {
    var value = '';
    switch(quizType) {
      case 'pinyin': value = opt.pinyin; break;
      case 'meaning': value = opt.meaning; break;
      case 'radical': value = opt.radical; break;
      case 'stroke': value = opt.stroke + '画'; break;
    }
    html += '<div class="quiz-option" onclick="checkAnswer(this,\'' + opt.char + '\')">' + value + '</div>';
  });
  document.getElementById('quizOptions').innerHTML = html;
}

function checkAnswer(el, selectedChar) {
  if(answered) return;
  answered = true;
  var q = questions[currentQuestion];
  var isCorrect = selectedChar === q.correct.char;
  if(isCorrect) {
    el.classList.add('correct');
    el.style.animation = 'correctPulse 0.3s';
    score += 10;
    streak++;
    if(streak > maxStreak) maxStreak = streak;
  } else {
    el.classList.add('wrong');
    el.style.animation = 'wrongShake 0.3s';
    streak = 0;
    document.querySelectorAll('.quiz-option').forEach(function(opt) {
      if(opt.textContent === getCorrectValue(q.correct)) {
        opt.classList.add('correct');
      }
    });
  }
  document.querySelectorAll('.quiz-option').forEach(function(opt) {
    opt.classList.add('disabled');
  });
  setTimeout(function() {
    currentQuestion++;
    showQuestion();
  }, 1000);
}

function getCorrectValue(char) {
  switch(quizType) {
    case 'pinyin': return char.pinyin;
    case 'meaning': return char.meaning;
    case 'radical': return char.radical;
    case 'stroke': return char.stroke + '画';
    default: return char.pinyin;
  }
}

function showResult() {
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('resultCard').style.display = 'block';
  var percent = Math.round((score / (totalQuestions * 10)) * 100);
  document.getElementById('resultScore').textContent = percent + '%';
  document.getElementById('correctCount').textContent = Math.round(score / 10);
  document.getElementById('wrongCount').textContent = totalQuestions - Math.round(score / 10);
  document.getElementById('maxStreak').textContent = maxStreak;
  var message = '';
  if(percent >= 90) message = '优秀!';
  else if(percent >= 70) message = '很好!';
  else if(percent >= 50) message = '不错!';
  else message = '继续努力!';
  document.getElementById('resultMessage').textContent = message;
  addToHistory(percent);
}

function resetQuiz() {
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('resultCard').style.display = 'none';
}

function addToHistory(percent) {
  history.unshift({
    type: getTypeLabel(quizType),
    difficulty: difficulty,
    score: percent + '%',
    date: new Date().toLocaleString()
  });
  if(history.length > 10) history.pop();
  renderHistory();
}

function renderHistory() {
  if(history.length === 0) {
    document.getElementById('historyCard').style.display = 'none';
    return;
  }
  document.getElementById('historyCard').style.display = 'block';
  var html = '';
  history.forEach(function(h) {
    html += '<div class="history-item">';
    html += '<span>' + h.type + ' ' + h.difficulty + '</span>';
    html += '<span>' + h.score + '</span>';
    html += '<span style="color:var(--text2)">' + h.date + '</span>';
    html += '</div>';
  });
  document.getElementById('history').innerHTML = html;
}

function shuffleArray(arr) {
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = a[i];
    a[i] = a[j];
    a[j] = temp;
  }
  return a;
}

function toggleTheme() {
  var html = document.documentElement;
  var current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
}

init();
</script>
</body>
</html>
