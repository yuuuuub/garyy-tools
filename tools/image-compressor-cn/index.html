<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 图片压缩工具</title>
<meta name="description" content="图片压缩工具，在线压缩图片大小，保持高清画质">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s}
.upload-area:hover{border-color:var(--accent);background:var(--tag-bg)}
.upload-area.dragover{border-color:var(--accent);background:var(--tag-bg)}
.upload-icon{font-size:48px;margin-bottom:8px}
.upload-text{font-size:14px;color:var(--text-secondary)}
.upload-hint{font-size:12px;color:var(--text-secondary);margin-top:4px}
.input-group{margin-bottom:12px}
.input-group:last-child{margin-bottom:0}
.input-group label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px;font-weight:500}
.input-group select{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;outline:none}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type="range"]{flex:1}
.slider-row span{font-size:13px;color:var(--text-secondary);min-width:40px;text-align:right}
.tag-grid{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);cursor:pointer;font-size:13px;transition:all .2s;user-select:none}
.tag:hover{border-color:var(--accent);transform:translateY(-1px)}
.tag.active{background:var(--accent);color:var(--text);border-color:var(--accent);font-weight:600}
.compare-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.compare-box{border-radius:10px;border:1px solid var(--border);overflow:hidden}
.compare-box img,.compare-box canvas{width:100%;height:auto;display:block}
.compare-label{padding:6px 10px;font-size:12px;color:var(--text-secondary);background:var(--preview-bg);text-align:center}
.compare-label strong{color:var(--text)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.info-item{background:var(--preview-bg);border-radius:10px;padding:12px;text-align:center}
.info-item .val{font-size:20px;font-weight:700;color:var(--accent)}
.info-item .lbl{font-size:11px;color:var(--text-secondary);margin-top:2px}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.hidden{display:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📦 图片压缩工具">
<meta property="og:description" content="图片压缩工具，在线压缩图片大小，保持高清画质">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/image-compressor-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📦 图片压缩工具</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card" id="uploadCard">
    <div class="card-title">📤 上传图片</div>
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📁</div>
      <div class="upload-text">点击或拖拽上传图片</div>
      <div class="upload-hint">支持 JPG、PNG、WebP，可批量上传</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
  </div>

  <div class="card" id="settingsCard">
    <div class="card-title">⚙️ 压缩设置</div>
    <div class="input-group">
      <label>压缩质量</label>
      <div class="slider-row">
        <input type="range" id="quality" min="1" max="100" value="70">
        <span id="qualityVal">70%</span>
      </div>
    </div>
    <div class="input-group">
      <label>最大宽度</label>
      <div class="tag-grid" id="maxWidths">
        <div class="tag" data-val="1920">1920px</div>
        <div class="tag active" data-val="1280">1280px</div>
        <div class="tag" data-val="800">800px</div>
        <div class="tag" data-val="640">640px</div>
        <div class="tag" data-val="0">原始大小</div>
      </div>
    </div>
    <div class="input-group">
      <label>输出格式</label>
      <div class="tag-grid" id="formats">
        <div class="tag active" data-val="jpeg">JPEG</div>
        <div class="tag" data-val="png">PNG</div>
        <div class="tag" data-val="webp">WebP</div>
      </div>
    </div>
  </div>

  <div class="btn-row" id="compressRow">
    <button class="btn btn-primary" id="compressBtn">🗜️ 开始压缩</button>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="card-title">📊 压缩结果</div>
    <div class="info-grid" id="infoGrid">
      <div class="info-item"><div class="val" id="origSize">-</div><div class="lbl">原始大小</div></div>
      <div class="info-item"><div class="val" id="newSize">-</div><div class="lbl">压缩后大小</div></div>
      <div class="info-item"><div class="val" id="reduction">-</div><div class="lbl">压缩率</div></div>
      <div class="info-item"><div class="val" id="dimensions">-</div><div class="lbl">输出尺寸</div></div>
    </div>
    <div class="compare-wrap">
      <div class="compare-box">
        <img id="origPreview" src="" alt="原图">
        <div class="compare-label">原图 <strong id="origLabel">-</strong></div>
      </div>
      <div class="compare-box">
        <img id="newPreview" src="" alt="压缩后">
        <div class="compare-label">压缩后 <strong id="newLabel">-</strong></div>
      </div>
    </div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-primary" id="downloadBtn">💾 下载压缩图片</button>
    </div>
  </div>

  <footer>© 2025 Gary's Tools | garyy.top</footer>
</div>
<div class="toast" id="toast"></div>

<script>
function toggleTheme(){var h=document.documentElement;var t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('garyy_theme',t)}
(function(){var s=localStorage.getItem('garyy_theme');if(s==='dark'){document.documentElement.setAttribute('data-theme','dark');document.querySelector('.theme-toggle').textContent='☀️'}})();

function initTags(id,cb){var c=document.getElementById(id);c.addEventListener('click',function(e){var t=e.target.closest('.tag');if(!t)return;c.querySelectorAll('.tag').forEach(function(x){x.classList.remove('active')});t.classList.add('active');if(cb)cb()})}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function formatSize(b){if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(2)+'MB'}

var origFile=null,compressedBlob=null;

document.getElementById('uploadArea').addEventListener('click',function(){document.getElementById('fileInput').click()});
document.getElementById('uploadArea').addEventListener('dragover',function(e){e.preventDefault();this.classList.add('dragover')});
document.getElementById('uploadArea').addEventListener('dragleave',function(){this.classList.remove('dragover')});
document.getElementById('uploadArea').addEventListener('drop',function(e){e.preventDefault();this.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0])});
document.getElementById('fileInput').addEventListener('change',function(){if(this.files.length)handleFile(this.files[0])});

function handleFile(file){
  origFile=file;
  document.getElementById('origSize').textContent=formatSize(file.size);
  document.getElementById('dimensions').textContent='等待压缩';
  var reader=new FileReader();
  reader.onload=function(e){
    document.getElementById('origPreview').src=e.target.result;
    document.getElementById('newPreview').src='';
    document.getElementById('resultCard').classList.remove('hidden');
    document.getElementById('origLabel').textContent=formatSize(file.size);
    document.getElementById('newLabel').textContent='-';
    document.getElementById('reduction').textContent='-';
    document.getElementById('newSize').textContent='-';
  };
  reader.readAsDataURL(file);
  showToast('✅ 图片已加载');
}

document.getElementById('quality').addEventListener('input',function(){document.getElementById('qualityVal').textContent=this.value+'%'});
initTags('maxWidths');initTags('formats');

document.getElementById('compressBtn').addEventListener('click',function(){
  if(!origFile){showToast('请先上传图片');return}
  var quality=parseInt(document.getElementById('quality').value)/100;
  var maxW=parseInt(document.querySelector('#maxWidths .tag.active').dataset.val);
  var format=document.querySelector('#formats .tag.active').dataset.val;
  var mimeType=format==='png'?'image/png':format==='webp'?'image/webp':'image/jpeg';

  var img=new Image();
  img.onload=function(){
    var w=img.width,h=img.height;
    if(maxW>0&&w>maxW){h=Math.floor(h*maxW/w);w=maxW}
    var c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    c.toBlob(function(blob){
      compressedBlob=blob;
      document.getElementById('newSize').textContent=formatSize(blob.size);
      var pct=((1-blob.size/origFile.size)*100).toFixed(1);
      document.getElementById('reduction').textContent=pct+'%';
      document.getElementById('dimensions').textContent=w+'×'+h;
      var url=URL.createObjectURL(blob);
      document.getElementById('newPreview').src=url;
      document.getElementById('newLabel').textContent=formatSize(blob.size);
      showToast('✅ 压缩完成，节省 '+pct+'%');
    },mimeType,quality);
  };
  img.src=URL.createObjectURL(origFile);
});

document.getElementById('downloadBtn').addEventListener('click',function(){
  if(!compressedBlob){showToast('请先压缩图片');return}
  var format=document.querySelector('#formats .tag.active').dataset.val;
  var link=document.createElement('a');
  link.download='compressed-'+Date.now()+'.'+(format==='jpeg'?'jpg':format);
  link.href=URL.createObjectURL(compressedBlob);link.click();
  showToast('✅ 已下载');
});
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:.8;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=.8">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
