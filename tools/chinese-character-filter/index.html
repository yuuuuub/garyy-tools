<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字筛选</title><meta name="description" content="汉字筛选 - 在线筛选汉字"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.filter-group{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filter-btn{padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem}.filter-btn.active{border-color:var(--blue);background:rgba(59,130,246,.1)}.filter-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;margin:16px 0}.filter-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:transform .2s}.filter-item:hover{transform:translateY(-2px)}.filter-char{font-size:1.5rem;font-weight:700;color:var(--blue)}.filter-pinyin{font-size:.8rem;color:var(--text2);margin-top:4px}.filter-strokes{font-size:.75rem;color:var(--green)}</style><meta property="og:title" content="汉字筛选"><meta property="og:description" content="汉字筛选 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"></head><body>
<div class="container"><h1>🔍 汉字筛选</h1><p class="sub">在线筛选汉字</p>
<div class="card">
<div style="margin-bottom:16px">
<h3 style="margin-bottom:12px">筛选条件</h3>
<div class="filter-group">
<button class="filter-btn active" onclick="setFilter('all','all',this)">全部</button>
<button class="filter-btn" onclick="setFilter('radical','一',this)">一部</button>
<button class="filter-btn" onclick="setFilter('radical','八',this)">八部</button>
<button class="filter-btn" onclick="setFilter('radical','大',this)">大部</button>
<button class="filter-btn" onclick="setFilter('radical','小',this)">小部</button>
<button class="filter-btn" onclick="setFilter('radical','口',this)">口部</button>
<button class="filter-btn" onclick="setFilter('radical','日',this)">日部</button>
<button class="filter-btn" onclick="setFilter('radical','月',this)">月部</button>
<button class="filter-btn" onclick="setFilter('radical','水',this)">水部</button>
<button class="filter-btn" onclick="setFilter('radical','火',this)">火部</button>
<button class="filter-btn" onclick="setFilter('radical','木',this)">木部</button>
<button class="filter-btn" onclick="setFilter('radical','金',this)">金部</button>
<button class="filter-btn" onclick="setFilter('radical','土',this)">土部</button>
</div>
</div>
<div style="margin-bottom:16px">
<h3 style="margin-bottom:12px">笔画筛选</h3>
<div class="filter-group">
<button class="filter-btn active" onclick="setStrokeFilter('all',this)">全部</button>
<button class="filter-btn" onclick="setStrokeFilter('1-2',this)">1-2画</button>
<button class="filter-btn" onclick="setStrokeFilter('3-4',this)">3-4画</button>
<button class="filter-btn" onclick="setStrokeFilter('5-6',this)">5-6画</button>
<button class="filter-btn" onclick="setStrokeFilter('7-8',this)">7-8画</button>
<button class="filter-btn" onclick="setStrokeFilter('9+',this)">9+画</button>
</div>
</div>
<button class="btn" onclick="resetFilters()">重置筛选</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var characters=[
  {char:'一',pinyin:'yī',strokes:1,radical:'一'},
  {char:'二',pinyin:'èr',strokes:2,radical:'二'},
  {char:'三',pinyin:'sān',strokes:3,radical:'一'},
  {char:'四',pinyin:'sì',strokes:5,radical:'囗'},
  {char:'五',pinyin:'wǔ',strokes:4,radical:'一'},
  {char:'六',pinyin:'liù',strokes:4,radical:'八'},
  {char:'七',pinyin:'qī',strokes:2,radical:'一'},
  {char:'八',pinyin:'bā',strokes:2,radical:'八'},
  {char:'九',pinyin:'jiǔ',strokes:2,radical:'丿'},
  {char:'十',pinyin:'shí',strokes:2,radical:'十'},
  {char:'大',pinyin:'dà',strokes:3,radical:'大'},
  {char:'小',pinyin:'xiǎo',strokes:3,radical:'小'},
  {char:'多',pinyin:'duō',strokes:6,radical:'夕'},
  {char:'少',pinyin:'shǎo',strokes:4,radical:'小'},
  {char:'上',pinyin:'shàng',strokes:3,radical:'一'},
  {char:'下',pinyin:'xià',strokes:3,radical:'一'},
  {char:'左',pinyin:'zuǒ',strokes:5,radical:'工'},
  {char:'右',pinyin:'yòu',strokes:5,radical:'口'},
  {char:'前',pinyin:'qián',strokes:9,radical:'刂'},
  {char:'后',pinyin:'hòu',strokes:6,radical:'口'},
  {char:'东',pinyin:'dōng',strokes:5,radical:'一'},
  {char:'西',pinyin:'xī',strokes:6,radical:'西'},
  {char:'南',pinyin:'nán',strokes:9,radical:'十'},
  {char:'北',pinyin:'běi',strokes:5,radical:'匕'},
  {char:'天',pinyin:'tiān',strokes:4,radical:'大'},
  {char:'地',pinyin:'dì',strokes:6,radical:'土'},
  {char:'人',pinyin:'rén',strokes:2,radical:'人'},
  {char:'口',pinyin:'kǒu',strokes:3,radical:'口'},
  {char:'日',pinyin:'rì',strokes:4,radical:'日'},
  {char:'月',pinyin:'yuè',strokes:4,radical:'月'},
  {char:'水',pinyin:'shuǐ',strokes:4,radical:'水'},
  {char:'火',pinyin:'huǒ',strokes:4,radical:'火'},
  {char:'木',pinyin:'mù',strokes:4,radical:'木'},
  {char:'金',pinyin:'jīn',strokes:8,radical:'金'},
  {char:'土',pinyin:'tǔ',strokes:3,radical:'土'}
];
var currentRadical='all';
var currentStrokes='all';
function setFilter(type,value,btn){
  if(type==='radical'){
    currentRadical=value;
    document.querySelectorAll('.filter-group')[0].querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
  }
  filterCharacters();
}
function setStrokeFilter(value,btn){
  currentStrokes=value;
  document.querySelectorAll('.filter-group')[1].querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterCharacters();
}
function resetFilters(){
  currentRadical='all';
  currentStrokes='all';
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.filter-group')[0].querySelector('.filter-btn').classList.add('active');
  document.querySelectorAll('.filter-group')[1].querySelector('.filter-btn').classList.add('active');
  filterCharacters();
}
function filterCharacters(){
  var filtered=characters.filter(function(char){
    var matchRadical=currentRadical==='all'||char.radical===currentRadical;
    var matchStrokes=true;
    switch(currentStrokes){
      case '1-2':matchStrokes=char.strokes>=1&&char.strokes<=2;break;
      case '3-4':matchStrokes=char.strokes>=3&&char.strokes<=4;break;
      case '5-6':matchStrokes=char.strokes>=5&&char.strokes<=6;break;
      case '7-8':matchStrokes=char.strokes>=7&&char.strokes<=8;break;
      case '9+':matchStrokes=char.strokes>=9;break;
    }
    return matchRadical&&matchStrokes;
  });
  renderResults(filtered);
}
function renderResults(results){
  var html='<div class="card">';
  html+='<div style="margin-bottom:12px;color:var(--text2)">筛选结果：'+results.length+' 个汉字</div>';
  html+='<div class="filter-results">';
  results.forEach(function(char){
    html+='<div class="filter-item">';
    html+='<div class="filter-char">'+char.char+'</div>';
    html+='<div class="filter-pinyin">'+char.pinyin+'</div>';
    html+='<div class="filter-strokes">'+char.strokes+'画</div>';
    html+='</div>';
  });
  html+='</div></div>';
  document.getElementById('result').innerHTML=html;
}
filterCharacters();
</script></body></html>
