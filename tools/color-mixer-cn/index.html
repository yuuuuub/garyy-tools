<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颜色混合器 - Color Mixer 中文</title>
<meta property="og:title" content="颜色混合器 - Color Mixer 中文">
<meta property="og:description" content="颜色混合器 - Color Mixer 中文 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线颜色混合器，支持两种颜色混合、比例调节、实时预览混合效果">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
<meta name="robots" content="index, follow">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--radius:10px;--transition:.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.back{position:fixed;top:8px;left:8px;z-index:9999;text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)}
.header{text-align:center;padding:2rem 1rem 1rem}
.header h1{font-size:1.8rem;margin-bottom:.3rem}
.header p{color:var(--text2);font-size:.9rem}
.theme-btn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:.75rem}
.container{max-width:800px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.card h2{font-size:1.1rem;margin-bottom:.8rem;color:var(--accent)}
.mix-area{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap;margin:1rem 0}
.color-pick-box{text-align:center}
.color-pick-box label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:.4rem}
.color-pick-box input[type="color"]{width:80px;height:80px;border:none;border-radius:12px;cursor:pointer;background:none;padding:0}
.color-pick-box input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
.color-pick-box input[type="color"]::-webkit-color-swatch{border-radius:12px;border:2px solid var(--border)}
.plus-sign{font-size:2rem;color:var(--text2)}
.result-box{text-align:center}
.result-box label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:.4rem}
.result-swatch{width:80px;height:80px;border-radius:12px;border:2px solid var(--border)}
.result-hex{font-family:monospace;font-size:.9rem;margin-top:.3rem}
.ratio-section{margin:1rem 0}
.ratio-bar{height:20px;border-radius:10px;display:flex;overflow:hidden;margin:.5rem 0;border:1px solid var(--border)}
.ratio-bar div{transition:width .3s}
.slider-row{display:flex;align-items:center;gap:.8rem;margin:.5rem 0}
.slider-row label{font-size:.85rem;min-width:50px;color:var(--text2)}
.slider-row input[type="range"]{flex:1;accent-color:var(--accent)}
.slider-row .val{font-size:.85rem;min-width:35px;text-align:right;font-family:monospace}
.presets{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
.preset{padding:.4rem .8rem;border-radius:8px;background:var(--bg);border:1px solid var(--border);cursor:pointer;font-size:.8rem;transition:all .2s}
.preset:hover{border-color:var(--accent)}
.history{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
.history-swatch{width:36px;height:36px;border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:transform .2s}
.history-swatch:hover{transform:scale(1.15)}
.copy-btn{padding:.3rem .6rem;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:.75rem}
.copy-btn:hover{background:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<a href="../index.html" class="back">← 首页</a>
<button class="theme-btn" onclick="toggleTheme()">🌓 主题</button>
<div class="header">
<h1>🧪 颜色混合器</h1>
<p>选择两种颜色并调节比例，实时预览混合效果</p>
</div>
<div class="container">

<div class="card">
<h2>颜色混合</h2>
<div class="mix-area">
<div class="color-pick-box">
<label>颜色 A</label>
<input type="color" id="colorA" value="#E74C3C" oninput="mix()">
<div style="font-family:monospace;font-size:.8rem;margin-top:.3rem" id="hexA">#E74C3C</div>
</div>
<div class="plus-sign">+</div>
<div class="color-pick-box">
<label>颜色 B</label>
<input type="color" id="colorB" value="#3498DB" oninput="mix()">
<div style="font-family:mon-font;font-size:.8rem;margin-top:.3rem" id="hexB">#3498DB</div>
</div>
<div class="plus-sign">=</div>
<div class="result-box">
<label>混合结果</label>
<div class="result-swatch" id="resultSwatch"></div>
<div class="result-hex" id="resultHex">#9B6299</div>
<button class="copy-btn" onclick="copyResult()" style="margin-top:.3rem">复制颜色</button>
</div>
</div>
<div class="ratio-section">
<p style="font-size:.85rem;color:var(--text2);margin-bottom:.5rem">混合比例</p>
<div class="ratio-bar"><div id="ratioBarA" style="background:#E74C3C;width:50%"></div><div id="ratioBarB" style="background:#3498DB;width:50%"></div></div>
<div class="slider-row">
<label>A: <span id="ratioValA">50%</span></label>
<input type="range" min="0" max="100" value="50" id="ratioSlider" oninput="mix()">
<label>B: <span id="ratioValB">50%</span></label>
</div>
</div>
</div>

<div class="card">
<h2>预设配色方案</h2>
<div class="presets" id="presetList"></div>
</div>

<div class="card">
<h2>混合历史</h2>
<div class="history" id="historyList"><span style="color:var(--text2);font-size:.85rem">尚无混合记录</span></div>
</div>

</div>

<script>
function toggleTheme(){const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t)}
function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('').toUpperCase()}
let history=[];
function mix(){
const a=document.getElementById('colorA').value;
const b=document.getElementById('colorB').value;
const ratio=+document.getElementById('ratioSlider').value;
const ra=100-ratio;
const [r1,g1,b1]=hexToRgb(a),[r2,g2,b2]=hexToRgb(b);
const r=(r1*ra+r2*ratio)/100,g=(g1*ra+g2*ratio)/100,bl=(b1*ra+b2*ratio)/100;
const hex=rgbToHex(r,g,bl);
document.getElementById('hexA').textContent=a.toUpperCase();
document.getElementById('hexB').textContent=b.toUpperCase();
document.getElementById('resultSwatch').style.background=hex;
document.getElementById('resultHex').textContent=hex;
document.getElementById('ratioBarA').style.width=ra+'%';
document.getElementById('ratioBarB').style.width=ratio+'%';
document.getElementById('ratioValA').textContent=ra+'%';
document.getElementById('ratioValB').textContent=ratio+'%';
addHistory(hex);
}
function addHistory(hex){
if(history.length>0&&history[history.length-1]===hex)return;
history.push(hex);if(history.length>20)history.shift();
const el=document.getElementById('historyList');
el.innerHTML=history.map(h=>`<div class="history-swatch" style="background:${h}" title="${h}" onclick="navigator.clipboard&&navigator.clipboard.writeText('${h}')"></div>`).join('');
}
function copyResult(){navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('resultHex').textContent)}
const presets=[
{name:'日落',a:'#FF6B35',b:'#004E89'},{name:'森林',a:'#2D6A4F',b:'#D4A373'},
{name:'海洋',a:'#0077B6',b:'#90E0EF'},{name:'火焰',a:'#DC2F02',b:'#FFBA08'},
{name:'薰衣草',a:'#7B2D8E',b:'#E8D5F5'},{name:'极光',a:'#06D6A0',b:'#118AB2'},
{name:'樱花',a:'#FFB7C5',b:'#FF69B4'},{name:'夜空',a:'#0D1B2A',b:'#1B263B'}
];
const pl=document.getElementById('presetList');
presets.forEach(p=>{
pl.innerHTML+=`<div class="preset" onclick="document.getElementById('colorA').value='${p.a}';document.getElementById('colorB').value='${p.b}';mix()" style="border-left:3px solid ${p.a};border-right:3px solid ${p.b}">${p.name}</div>`;
});
mix();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
