<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📚 成语生成器</h1><p class="sub">在线生成成语</p>
<div class="card">
<div class="input-group">
<label>搜索成语</label>
<input type="text" id="searchInput" placeholder="输入成语或含义..." oninput="filterIdioms()">
</div>
<div class="btn-group">
<button class="category-btn active" onclick="filterByCategory('all',this)">全部</button>
<button class="category-btn" onclick="filterByCategory('动物',this)">动物</button>
<button class="category-btn" onclick="filterByCategory('数字',this)">数字</button>
<button class="category-btn" onclick="filterByCategory('自然',this)">自然</button>
<button class="category-btn" onclick="filterByCategory('人物',this)">人物</button>
<button class="category-btn" onclick="filterByCategory('其他',this)">其他</button>
</div>
<div class="btn-group" style="margin-top:12px">
<button class="btn" onclick="randomIdiom()">随机成语</button>
<button class="btn" onclick="generateByCategory()">按类别生成</button>
</div>
</div>
<div id="idiomList"></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>

  {text:'亡羊补牢',pinyin:'wáng yáng bǔ láo',meaning:'比喻出了差错后及时补救，免得再受损失。',source:'战国策·楚策四',category:'动物'},

  {text:'对牛弹琴',pinyin:'duì niú tán qín',meaning:'比喻对不懂道理的人讲道理，是白费口舌。',source:'理惑论',category:'动物'},
  {text:'九牛一毛',pinyin:'jiǔ niú yī máo',meaning:'比喻极大数量中微不足道的一部分。',source:'报任少卿书',category:'动物'},
  {text:'虎头蛇尾',pinyin:'hǔ tóu shé wěi',meaning:'比喻做事有始无终，开头声势大，后来劲头小。',source:'元曲选·李逵负荆',category:'动物'},
  {text:'一石二鸟',pinyin:'yī shí èr niǎo',meaning:'比喻做一件事达到两个目的。',source:'民间谚语',category:'动物'},
  {text:'龙马精神',pinyin:'lóng mǎ jīng shén',meaning:'比喻人精神旺盛。',source:'春夜宴桃李园序',category:'动物'},
  {text:'三心二意',pinyin:'sān xīn èr yì',meaning:'又想干这个，又想干那个。形容意志不坚定。',source:'民间谚语',category:'数字'},
  {text:'四面楚歌',pinyin:'sì miàn chǔ gē',meaning:'比喻四面受敌，处于孤立无援的困境。',source:'史记·项羽本纪',category:'数字'},
  {text:'五湖四海',pinyin:'wǔ hú sì hǎi',meaning:'泛指全国各处。',source:'周礼·夏官·职方氏',category:'数字'},
  {text:'六神无主',pinyin:'liù shén wú zhǔ',meaning:'形容惊慌着急，没了主意。',source:'民间谚语',category:'数字'},

  {text:'九死一生',pinyin:'jiǔ sǐ yī shēng',meaning:'形容经历极大的危险而幸存。',source:'离骚',category:'数字'},
  {text:'十全十美',pinyin:'shí quán shí měi',meaning:'各方面都非常完美，毫无缺陷。',source:'周礼·天官·冢宰',category:'数字'},
  {text:'百发百中',pinyin:'bǎi fā bǎi zhòng',meaning:'形容射箭或射击技术非常高明。',source:'战国策·西周策',category:'数字'},

  {text:'万象更新',pinyin:'wàn xiàng gēng xīn',meaning:'一切事物都改换了样子，出现了新气象。',source:'红楼梦',category:'自然'},
  {text:'风和日丽',pinyin:'fēng hé rì lì',meaning:'形容天气晴朗温和。',source:'浪淘沙',category:'自然'},
  {text:'花好月圆',pinyin:'huā hǎo yuè yuán',meaning:'比喻美好圆满。多用于祝贺人新婚。',source:'行香子',category:'自然'},
  {text:'山清水秀',pinyin:'shān qīng shuǐ xiù',meaning:'形容风景优美。',source:'民间谚语',category:'自然'},
  {text:'春暖花开',pinyin:'chūn nuǎn huā kāi',meaning:'春天气候暖和，百花盛开。形容春天的美好景象。',source:'民间谚语',category:'自然'},
  {text:'秋高气爽',pinyin:'qiū gāo qì shuǎng',meaning:'形容秋季晴空万里，天气清爽。',source:'民间谚语',category:'自然'},

  {text:'愚公移山',pinyin:'yú gōng yí shān',meaning:'比喻坚持不懈地改造自然和坚定不移地进行斗争。',source:'列子·汤问',category:'人物'},
  {text:'精忠报国',pinyin:'jīng zhōng bào guó',meaning:'为国家竭尽忠诚，牺牲一切。',source:'宋史·岳飞传',category:'人物'},
  {text:'卧薪尝胆',pinyin:'wò xīn cháng dǎn',meaning:'形容人刻苦自励，发奋图强。',source:'史记·越王勾践世家',category:'人物'},
  {text:'闻鸡起舞',pinyin:'wén jī qǐ wǔ',meaning:'比喻有志之人及时奋发努力。',source:'晋书·祖逖传',category:'人物'},
  {text:'悬梁刺股',pinyin:'xuán liáng cì gǔ',meaning:'形容刻苦学习。',source:'太平御览',category:'人物'},
  {text:'凿壁偷光',pinyin:'záo bì tōu guāng',meaning:'形容家贫而读书刻苦。',source:'西京杂记',category:'人物'},
  {text:'铁杵磨针',pinyin:'tiě chǔ mó zhēn',比喻只要有毅力，肯下功夫，就一定能成功。',source:'方舆胜览',category:'人物'},
  {text:'开卷有益',pinyin:'kāi juàn yǒu yì',meaning:'读书总有好处。',source:'水燕谈录',category:'其他'},
  {text:'温故知新',pinyin:'wēn gù zhī xīn',meaning:'温习旧知识，得到新的理解和体会。',source:'论语·为政',category:'其他'},
  {text:'举一反三',pinyin:'jǔ yī fǎn sān',meaning:'比喻从一件事类推而知道其他许多事。',source:'论语·述而',category:'其他'}
];
var currentCategory='all';
function renderIdioms(idiomsToShow){
  var list=document.getElementById('idiomList');
  var html='';
  idiomsToShow.forEach(function(idiom){
    html+='<div class="idiom-item">';
    html+='<div class="idiom-text">'+idiom.text+'</div>';
    html+='<div class="idiom-pinyin">'+idiom.pinyin+'</div>';
    html+='<div class="idiom-meaning">'+idiom.meaning+'</div>';
    html+='<div class="idiom-source">出处：'+idiom.source+'</div>';
    html+='</div>';
  });
  list.innerHTML=html;
}
function filterIdioms(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=idioms.filter(function(idiom){
    var matchSearch=idiom.text.toLowerCase().includes(search)||idiom.meaning.toLowerCase().includes(search)||idiom.pinyin.toLowerCase().includes(search);
    var matchCategory=currentCategory==='all'||idiom.category===currentCategory;
    return matchSearch&&matchCategory;
  });
  renderIdioms(filtered);
}
function filterByCategory(category,btn){
  currentCategory=category;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterIdioms();
}
function randomIdiom(){
  var randomIndex=Math.floor(Math.random()*idioms.length);
  var idiom=idioms[randomIndex];
  var r=document.getElementById('result');
  var html='<div class="card">';
  html+='<div class="idiom-text" style="font-size:2rem">'+idiom.text+'</div>';
  html+='<div class="idiom-pinyin" style="font-size:1.1rem">'+idiom.pinyin+'</div>';
  html+='<div class="idiom-meaning" style="font-size:1rem;margin:16px 0">'+idiom.meaning+'</div>';
  html+='<div class="idiom-source">出处：'+idiom.source+'</div>';
  html+='</div>';
  r.innerHTML=html;
}
function generateByCategory(){
  var categories=['动物','数字','自然','人物','其他'];
  var randomCategory=categories[Math.floor(Math.random()*categories.length)];
  var filtered=idioms.filter(function(idiom){return idiom.category===randomCategory;});
  if(filtered.length>0){
    var randomIndex=Math.floor(Math.random()*filtered.length);
    var idiom=filtered[randomIndex];
    var r=document.getElementById('result');
    var html='<div class="card">';
    html+='<div style="text-align:center;margin-bottom:12px;color:var(--green)">类别：'+randomCategory+'</div>';
    html+='<div class="idiom-text" style="font-size:2rem">'+idiom.text+'</div>';
    html+='<div class="idiom-pinyin" style="font-size:1.1rem">'+idiom.pinyin+'</div>';
    html+='<div class="idiom-meaning" style="font-size:1rem;margin:16px 0">'+idiom.meaning+'</div>';
    html+='<div class="idiom-source">出处：'+idiom.source+'</div>';
    html+='</div>';
    r.innerHTML=html;
  }
}
renderIdioms(idioms);

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
