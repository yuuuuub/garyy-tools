<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字变形18</title><meta name="description" content="汉字变形18 - 在线查看汉字变形效果"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.morph10-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.morph10-char{font-size:6rem;font-weight:700;color:var(--blue);display:inline-block}.morph10-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.morph10-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.morph10-option:hover{border-color:var(--blue)}.morph10-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}</style><meta property="og:title" content="汉字变形18"><meta property="og:description" content="汉字变形18 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"></head><body>
<div class="container"><h1>🔄 汉字变形18</h1><p class="sub">在线查看汉字变形效果</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="变" oninput="showMorph10()">
</div>
<button class="btn" onclick="showMorph10()">显示变形</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var morphTypes10=['galaxy','nebula','aurora','firework','sparkle','shimmer','glitter','glow','pulse','wave'];
var currentMorph10='galaxy';
function showMorph10(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="morph10-options">';
  morphTypes10.forEach(function(type){
    html+='<div class="morph10-option '+(type===currentMorph10?'active':'')+'" onclick="setMorph10(\''+type+'\')">'+getMorphName10(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="morph10-container">';
  html+='<div class="morph10-char" style="animation:'+getMorphCSS10(currentMorph10)+'">'+char+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>📋 变形说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>变形类型：</strong>'+getMorphName10(currentMorph10)+'</div>';
  html+='<div><strong>效果描述：</strong>'+getMorphDescription10(currentMorph10)+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function setMorph10(type){
  currentMorph10=type;
  showMorph10();
}
function getMorphName10(type){
  switch(type){
    case 'galaxy':return'银河';
    case 'nebula':return'星云';
    case 'aurora':return'极光';
    case 'firework':return'烟花';
    case 'sparkle':return'闪耀';
    case 'shimmer':return'闪烁';
    case 'glitter':return'闪光';
    case 'glow':return'发光';
    case 'pulse':return'脉冲';
    case 'wave':return'波浪';
    default:return'未知';
  }
}
function getMorphDescription10(type){
  switch(type){
    case 'galaxy':return'银河旋转效果，星空闪烁';
    case 'nebula':return'星云飘动效果，色彩斑斓';
    case 'aurora':return'极光流动效果，梦幻光彩';
    case 'firework':return'烟花绽放效果，绚烂多彩';
    case 'sparkle':return'闪耀闪烁效果，星光闪闪';
    case 'shimmer':return'闪烁波动效果，波光粼粼';
    case 'glitter':return'闪光点缀效果，闪闪发光';
    case 'glow':return'发光扩散效果，光芒四射';
    case 'pulse':return'脉冲跳动效果，节奏感强';
    case 'wave':return'波浪起伏效果，连绵不断';
    default:return'未知效果';
  }
}
function getMorphCSS10(type){
  switch(type){
    case 'galaxy':return'galaxy10 5s linear infinite';
    case 'nebula':return'nebula10 4s ease-in-out infinite';
    case 'aurora':return'aurora10 3s ease-in-out infinite';
    case 'firework':return'firework10 1.5s ease-out infinite';
    case 'sparkle':return'sparkle10 1s ease-in-out infinite';
    case 'shimmer':return'shimmer10 2s ease-in-out infinite';
    case 'glitter':return'glitter10 0.5s ease-in-out infinite';
    case 'glow':return'glow10 2s ease-in-out infinite';
    case 'pulse':return'pulse11 1.5s ease-in-out infinite';
    case 'wave':return'wave11 2s ease-in-out infinite';
    default:return'none';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showMorph10();
}
showMorph10();
</script>
<style>
@keyframes galaxy10{0%{transform:rotate(0deg);text-shadow:0 0 20px #fff,0 0 40px #fff,0 0 60px #fff,0 0 80px #00ffff,0 0 100px #00ffff}100%{transform:rotate(360deg);text-shadow:0 0 20px #fff,0 0 40px #fff,0 0 60px #fff,0 0 80px #00ffff,0 0 100px #00ffff}}
@keyframes nebula10{0%,100%{filter:hue-rotate(0deg) brightness(1)}50%{filter:hue-rotate(180deg) brightness(1.2)}}
@keyframes aurora10{0%,100%{filter:hue-rotate(0deg);opacity:1}50%{filter:hue-rotate(120deg);opacity:0.8}}
@keyframes firework10{0%{transform:scale(0);opacity:0}50%{transform:scale(1.5);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes sparkle10{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.2)}}
@keyframes shimmer10{0%,100%{opacity:1}50%{opacity:0.7}}
@keyframes glitter10{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.8)}}
@keyframes glow10{0%,100%{text-shadow:0 0 10px var(--blue)}50%{text-shadow:0 0 30px var(--blue),0 0 50px var(--blue),0 0 70px var(--blue)}}
@keyframes pulse11{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes wave11{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-10px) rotate(2deg)}50%{transform:translateY(0) rotate(0deg)}75%{transform:translateY(10px) rotate(-2deg)}}
</style></body></html>
