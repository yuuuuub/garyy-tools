<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酒店查找 - Hotel Finder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#2563eb;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--muted:#8b949e;--input-bg:#0d1117}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 0}
header h1{font-size:1.8em;margin-bottom:4px}
header p{color:var(--muted)}
.filters{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.filter-group label{font-size:12px;color:var(--muted);font-weight:600}
.filter-group input,.filter-group select{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px;width:100%}
.filter-group input:focus,.filter-group select:focus{outline:none;border-color:var(--accent)}
.amenities{display:flex;flex-wrap:wrap;gap:8px}
.amenity-btn{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .2s}
.amenity-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sort-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.sort-bar span{color:var(--muted);font-size:14px}
.sort-options{display:flex;gap:8px}
.sort-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.sort-btn.active{background:var(--accent);border-color:var(--accent)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-header h3{font-size:16px;line-height:1.3}
.stars{color:var(--yellow);font-size:14px}
.badge{font-size:11px;padding:3px 8px;border-radius:12px;font-weight:600}
.badge-available{background:rgba(34,197,94,.15);color:var(--green)}
.badge-limited{background:rgba(234,179,8,.15);color:var(--yellow)}
.badge-full{background:rgba(239,68,68,.15);color:var(--red)}
.card-info{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin-bottom:10px}
.card-info span{display:flex;align-items:center;gap:6px}
.card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border)}
.price{font-size:18px;font-weight:700;color:var(--accent)}
.price small{font-size:12px;color:var(--muted);font-weight:400}
.amenity-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.amenity-tag{font-size:11px;background:rgba(59,130,246,.1);color:var(--accent);padding:2px 8px;border-radius:10px}
.no-results{text-align:center;padding:60px 20px;color:var(--muted)}
.no-results p{font-size:16px}
@media(max-width:640px){.results{grid-template-columns:1fr}.filters{flex-direction:column}.filter-group{min-width:100%}}
</style>
</head>
<body>
<div class="container">
<header><h1>🏨 酒店查找</h1><p>搜索附近优质酒店，轻松预订</p></header>
<div class="filters">
<div class="filter-group"><label>搜索</label><input type="text" id="search" placeholder="输入酒店名称或地址..."></div>
<div class="filter-group"><label>星级</label><select id="starFilter"><option value="">全部星级</option><option value="5">五星级</option><option value="4">四星级</option><option value="3">三星级</option><option value="2">二星级</option></select></div>
<div class="filter-group"><label>价格范围</label><select id="priceFilter"><option value="">不限</option><option value="0-300">¥300以下</option><option value="300-600">¥300-600</option><option value="600-1000">¥600-1000</option><option value="1000-9999">¥1000以上</option></select></div>
<div class="filter-group"><label>设施</label>
<div class="amenities">
<button class="amenity-btn" data-amenity="wifi">WiFi</button>
<button class="amenity-btn" data-amenity="parking">停车</button>
<button class="amenity-btn" data-amenity="pool">泳池</button>
<button class="amenity-btn" data-amenity="gym">健身房</button>
<button class="amenity-btn" data-amenity="spa">SPA</button>
</div></div>
</div>
<div class="sort-bar"><span id="resultCount"></span><div class="sort-options"><button class="sort-btn active" data-sort="distance">距离优先</button><button class="sort-btn" data-sort="rating">评分优先</button><button class="sort-btn" data-sort="price">价格优先</button><button class="sort-btn" data-sort="name">名称排序</button></div></div>
<div class="results" id="results"></div>
</div>
<script>
const hotels=[
{id:1,name:"北京丽思卡尔顿酒店",address:"朝阳区建国路甲83号",rating:4.9,price:1280,stars:5,phone:"010-59088888",hours:"24小时",status:"available",amenities:["wifi","parking","pool","gym","spa"],description:"豪华五星级酒店，毗邻国贸CBD，提供世界级服务体验"},
{id:2,name:"上海外滩华尔道夫",address:"黄浦区中山东一路2号",rating:4.8,price:1560,stars:5,phone:"021-63229999",hours:"24小时",status:"available",amenities:["wifi","parking","pool","spa"],description:"坐落于外滩历史建筑，融合经典与现代奢华"},
{id:3,name:"深圳万豪酒店",address:"福田区益田路4088号",rating:4.6,price:888,stars:5,phone:"0755-82826666",hours:"24小时",status:"limited",amenities:["wifi","parking","pool","gym"],description:"福田CBD核心地段，商务出行首选"},
{id:4,name:"杭州西湖国宾馆",address:"西湖区杨公堤18号",rating:4.7,price:980,stars:5,phone:"0571-87979889",hours:"24小时",status:"available",amenities:["wifi","parking","pool","spa"],description:"坐拥西湖美景，百年历史底蕴的国宾馆"},
{id:5,name:"成都锦江宾馆",address:"锦江区滨江中路1号",rating:4.4,price:680,stars:4,phone:"028-86688888",hours:"24小时",status:"available",amenities:["wifi","parking","gym"],description:"成都老牌四星级酒店，交通便利"},
{id:6,name:"广州白云宾馆",address:"越秀区环市东路367号",rating:4.2,price:520,stars:4,phone:"020-83333998",hours:"06:00-23:00",status:"available",amenities:["wifi","parking"],description:"位于环市东商圈，出行购物便利"},
{id:7,name:"西安钟楼饭店",address:"碑林区北大街1号",rating:4.3,price:460,stars:4,phone:"029-87681111",hours:"24小时",status:"limited",amenities:["wifi","parking","gym"],description:"紧邻钟鼓楼，感受古都魅力"},
{id:8,name:"厦门鼓浪屿民宿",address:"思明区鼓浪屿安海路33号",rating:4.5,price:358,stars:3,phone:"0592-2062288",hours:"24小时",status:"full",amenities:["wifi"],description:"鼓浪屿特色民宿，步行可达日光岩"},
{id:9,name:"三亚亚龙湾希尔顿",address:"吉阳区亚龙湾国家旅游度假区",rating:4.7,price:1120,stars:5,phone:"0898-88588888",hours:"24小时",status:"available",amenities:["wifi","parking","pool","spa","gym"],description:"亚龙湾畔豪华度假酒店，私享沙滩"},
{id:10,name:"武汉光谷希尔顿",address:"东湖高新区高新大道770号",rating:4.4,price:598,stars:4,phone:"027-59599999",hours:"24小时",status:"available",amenities:["wifi","parking","pool","gym"],description:"光谷核心区商务酒店，毗邻科技园区"}
];
let selectedAmenities=new Set(),currentSort="distance";
function getStatusBadge(s){return s==="available"?'<span class="badge badge-available">有房</span>':s==="limited"?'<span class="badge badge-limited">余少量</span>':'<span class="badge badge-full">已满</span>'}
function getStars(s){return "★".repeat(s)+"☆".repeat(5-s)}
function renderHotels(){
const q=document.getElementById("search").value.toLowerCase();
const sf=document.getElementById("starFilter").value;
const pf=document.getElementById("priceFilter").value;
let filtered=hotels.filter(h=>{
if(q&&!h.name.toLowerCase().includes(q)&&!h.address.includes(q))return false;
if(sf&&h.stars!=sf)return false;
if(pf){const[min,max]=pf.split("-").map(Number);if(h.price<min||h.price>max)return false}
if(selectedAmenities.size>0){for(const a of selectedAmenities)if(!h.amenities.includes(a))return false}
return true;
});
const sortFns={distance:()=>0,rating:(a,b)=>b.rating-a.rating,price:(a,b)=>a.price-b.price,name:(a,b)=>a.name.localeCompare(b.name,"zh")};
filtered.sort(sortFns[currentSort]||sortFns.distance);
document.getElementById("resultCount").textContent=`找到 ${filtered.length} 家酒店`;
const c=document.getElementById("results");
if(filtered.length===0){c.innerHTML='<div class="no-results"><p>未找到符合条件的酒店</p></div>';return}
c.innerHTML=filtered.map(h=>`<div class="card"><div class="card-header"><div><h3>${h.name}</h3><div class="stars">${getStars(h.stars)}</div></div>${getStatusBadge(h.status)}</div><div class="card-info"><span>📍 ${h.address}</span><span>📞 ${h.phone}</span><span>🕐 ${h.hours}</span></div><p style="font-size:13px;margin-bottom:10px">${h.description}</p><div class="amenity-tags">${h.amenities.map(a=>`<span class="amenity-tag">${{wifi:"WiFi",parking:"停车",pool:"泳池",gym:"健身",spa:"SPA"}[a]}</span>`).join("")}</div><div class="card-footer"><span class="price">¥${h.price}<small>/晚</small></span></div></div>`).join("")
}
document.getElementById("search").addEventListener("input",renderHotels);
document.getElementById("starFilter").addEventListener("change",renderHotels);
document.getElementById("priceFilter").addEventListener("change",renderHotels);
document.querySelectorAll(".amenity-btn").forEach(b=>b.addEventListener("click",()=>{const a=b.dataset.amenity;if(selectedAmenities.has(a)){selectedAmenities.delete(a);b.classList.remove("active")}else{selectedAmenities.add(a);b.classList.add("active")}renderHotels()}));
document.querySelectorAll(".sort-btn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".sort-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentSort=b.dataset.sort;renderHotels()}));
renderHotels();
</script>
</body>
</html>
