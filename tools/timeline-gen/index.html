<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史时间线 - Timeline Gen</title>

<style>
:root {--bg: #0d1117;
--surface: #161b22;
--border: #30363d;
--text: #e6edf3;
--text-secondary: #8b949e;
--accent: #58a6ff;
--accent2: #f78166;
--accent3: #3fb950;
--accent4: #d2a8ff;
--accent5: #f0c44a;
--accent6: #ff7b72;
--line: #30363d;
--node: #58a6ff;
--shadow: 0 4px 24px rgba(0,0,0,0.4)}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
background: var(--bg);
color: var(--text);
height: 100vh;
display: flex;
flex-direction: column;
overflow: hidden}
header {background: var(--surface);
border-bottom: 1px solid var(--border);
padding: 12px 24px;
display: flex;
align-items: center;
justify-content: space-between;
flex-shrink: 0;
z-index: 10}
header h1 {font-size: 20px;
font-weight: 700;
background: linear-gradient(135deg, var(--accent), var(--accent4));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text}
.header-actions {display: flex;
gap: 8px;
align-items: center}
select, button, input {font-family: inherit;
font-size: 13px;
padding: 6px 14px;
border-radius: 6px;
border: 1px solid var(--border);
background: var(--bg);
color: var(--text);
cursor: pointer;
transition: all 0.2s}
select:hover, button:hover {border-color: var(--accent);
background: var(--surface)}
button.primary {background: var(--accent);
color: var(--text);
border-color: var(--accent)}
button.primary:hover {background: #409eff}
button.danger { border-color: var(--accent6); color: var(--accent6); }
button.danger:hover { background: rgba(255,123,114,0.15); }
.toolbar {background: var(--surface);
border-bottom: 1px solid var(--border);
padding: 10px 24px;
display: flex;
align-items: center;
gap: 12px;
flex-shrink: 0;
flex-wrap: wrap}
.toolbar label {font-size: 12px;
color: var(--text-secondary);
display: flex;
align-items: center;
gap: 4px}
.toolbar input[type="range"] { width: 100px; padding: 0; border: none; cursor: pointer; }
.toolbar span { font-size: 12px; color: var(--text-secondary); min-width: 36px; }
.main-container {display: flex;
flex: 1;
overflow: hidden}
.sidebar {width: 280px;
background: var(--surface);
border-right: 1px solid var(--border);
display: flex;
flex-direction: column;
flex-shrink: 0;
overflow-y: auto}
.sidebar h3 {padding: 16px 16px 8px;
font-size: 13px;
color: var(--text-secondary);
text-transform: uppercase;
letter-spacing: 1px}
.preset-list {list-style: none}
.preset-list li {padding: 10px 16px;
cursor: pointer;
font-size: 14px;
border-left: 3px solid transparent;
transition: all 0.15s;
display: flex;
align-items: center;
gap: 8px}
.preset-list li:hover {background: rgba(88,166,255,0.08);
border-left-color: var(--accent)}
.preset-list li.active {background: rgba(88,166,255,0.12);
border-left-color: var(--accent);
color: var(--accent)}
.preset-dot {width: 8px; height: 8px;
border-radius: 50%;
flex-shrink: 0}
.divider {border-top: 1px solid var(--border);
margin: 12px 0}
.custom-section {padding: 0 16px 16px;
flex: 1;
overflow-y: auto}
.custom-section h3 {padding: 16px 0 8px;
margin: 0}
.custom-event {background: var(--bg);
border: 1px solid var(--border);
border-radius: 8px;
padding: 10px;
margin-bottom: 8px;
position: relative}
.custom-event .event-header {display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 6px}
.custom-event .event-year {font-size: 12px;
color: var(--accent);
font-weight: 600}
.custom-event .event-title {font-size: 13px;
font-weight: 500}
.custom-event .event-desc {font-size: 11px;
color: var(--text-secondary);
margin-top: 4px;
line-height: 1.4}
.custom-event .remove-btn {background: none;
border: none;
color: var(--accent6);
cursor: pointer;
font-size: 16px;
padding: 0 4px;
line-height: 1}
.custom-event .remove-btn:hover { color: #ff4444; }
.add-event-form {display: flex;
flex-direction: column;
gap: 6px}
.add-event-form input, .add-event-form select {width: 100%;
padding: 6px 10px}
.add-event-form .year-input {display: flex;
gap: 6px}
.add-event-form .year-input input { flex: 1; }
.add-event-form button { width: 100%; }
.timeline-view {flex: 1;
overflow: hidden;
display: flex;
flex-direction: column;
position: relative}
.timeline-canvas-wrap {flex: 1;
overflow: auto;
position: relative;
cursor: grab}
.timeline-canvas-wrap:active { cursor: grabbing; }
.timeline-canvas-wrap.dragging { cursor: grabbing; }
canvas#timelineCanvas {display: block;
min-width: 100%;
min-height: 100%}
.event-popup {position: fixed;
background: var(--surface);
border: 1px solid var(--border);
border-radius: 10px;
padding: 16px 20px;
box-shadow: var(--shadow);
z-index: 100;
max-width: 360px;
pointer-events: auto;
display: none}
.event-popup.visible { display: block; }
.event-popup .popup-year {font-size: 12px;
color: var(--accent);
font-weight: 600;
margin-bottom: 4px}
.event-popup .popup-title {font-size: 16px;
font-weight: 600;
margin-bottom: 8px}
.event-popup .popup-desc {font-size: 13px;
color: var(--text-secondary);
line-height: 1.6}
.popup-color {width: 12px; height: 12px;
border-radius: 50%;
display: inline-block;
margin-right: 6px;
vertical-align: middle}
.empty-state {display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
flex: 1;
color: var(--text-secondary);
text-align: center;
padding: 40px}
.empty-state svg { margin-bottom: 16px; opacity: 0.3; }
.empty-state h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
.legend-bar {display: flex;
gap: 16px;
align-items: center;
padding: 8px 24px;
background: var(--surface);
border-top: 1px solid var(--border);
flex-shrink: 0;
flex-wrap: wrap}
.legend-item {display: flex;
align-items: center;
gap: 4px;
font-size: 11px;
color: var(--text-secondary)}
.legend-item span:first-child {width: 10px; height: 10px;
border-radius: 50%;
display: inline-block;
flex-shrink: 0}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #484f58; }
@media (max-width: 768px) {.main-container { flex-direction: column; }
.sidebar { width: 100%; max-height: 200px; border-right: none; border-bottom: 1px solid var(--border); }
.custom-section { max-height: 150px; }}
</style>

<body>

<header>
  <h1>历史时间线</h1>
  <div class="header-actions">
    <button onclick="resetView()" title="重置视图">↺ 重置</button>
    <button class="primary" onclick="exportImage()">📷 导出图片</button>
    <select id="orientationSelect" onchange="switchOrientation()">
      <option value="horizontal">水平排列</option>
      <option value="vertical">垂直排列</option>
    </select>
  </div>
</header>

<div class="toolbar">
  <label>缩放 <input type="range" id="zoomSlider" min="0.2" max="3" step="0.1" value="1" oninput="setZoom(this.value)"></label>
  <span id="zoomLabel">100%</span>
  <label>年份跨度 <input type="range" id="spanSlider" min="0.5" max="5" step="0.1" value="1" oninput="setSpan(this.value)"></label>
  <span id="spanLabel">1x</span>
  <label><input type="checkbox" id="showLabels" checked onchange="renderTimeline()"> 显示标签</label>
  <label><input type="checkbox" id="showGrid" checked onchange="renderTimeline()"> 显示网格</label>
</div>

<div class="main-container">
  <aside class="sidebar">
    <h2>📋 预设时间线</h2>
    <ul class="preset-list" id="presetList"></ul>
    <div class="divider"></div>
    <div class="custom-section" id="customSection">
      <h2>✏️ 自定义时间线</h2>
      <div class="add-event-form">
        <div class="year-input">
          <input type="text" id="customYear" placeholder="年份 (如 -221 或 618)">
          <input type="text" id="customDate" placeholder="具体日期 (可选)">
        </div>
        <input type="text" id="customTitle" placeholder="事件标题">
        <input type="text" id="customDesc" placeholder="事件描述">
        <select id="customColor">
          <option value="#58a6ff">蓝色</option>
          <option value="#f78166">橙色</option>
          <option value="#3fb950">绿色</option>
          <option value="#d2a8ff">紫色</option>
          <option value="#f0c44a">金色</option>
          <option value="#ff7b72">红色</option>
        </select>
        <button class="primary" onclick="addCustomEvent()">+ 添加事件</button>
      </div>
      <div id="customEvents"></div>
    </div>
  </aside>

  <div class="timeline-view" id="timelineView">
    <div class="timeline-canvas-wrap" id="canvasWrap">
      <canvas id="timelineCanvas"></canvas>
    </div>
  </div>
</div>

<div class="legend-bar" id="legendBar"></div>

<div class="event-popup" id="eventPopup"></div>

<script>

  if (e.key === '+' || e.key === '=') {
    e.preventDefault();
    zoom = Math.min(3, zoom + 0.1);
    document.getElementById('zoomSlider').value = zoom;
    document.getElementById('zoomLabel').textContent = Math.round(zoom * 100) + '%';
    renderTimeline();
  }
  if (e.key === '-') {
    e.preventDefault();
    zoom = Math.max(0.2, zoom - 0.1);
    document.getElementById('zoomSlider').value = zoom;
    document.getElementById('zoomLabel').textContent = Math.round(zoom * 100) + '%';
    renderTimeline();
  }
});
init();
document.getElementById('customSection').querySelector('h3').style.cursor = 'pointer';
document.getElementById('customSection').querySelector('h3').addEventListener('click', switchToCustom);
document.getElementById('customSection').querySelector('h3').title = '点击切换到自定义时间线';
</script>

<script src="../i18n.js" defer></script>
