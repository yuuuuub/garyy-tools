<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RSI计算器 - 相对强弱指标计算器，判断超买超卖状态">
    <meta name="robots" content="index, follow">
    <title>RSI 相对强弱指标计算器</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #007bff; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #e0e0e0; --primary-color: #0d6efd; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        button { background-color: var(--primary-color); color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { opacity: 0.85; }
        canvas { width: 100%; border-radius: 6px; border: 1px solid var(--border-color); }
        .stat-box { text-align: center; padding: 16px; border: 1px solid var(--border-color); border-radius: 8px; }
        .stat-box .num { font-size: 28px; font-weight: bold; }
        .stat-box .label { font-size: 12px; color: var(--secondary-color); margin-top: 4px; }
        .legend { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
        .legend span { font-size: 12px; display: flex; align-items: center; gap: 4px; }
        .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; }
        .gauge { width: 200px; height: 110px; margin: 0 auto; position: relative; }
        .output { font-family: 'Courier New', monospace; font-size: 13px; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--card-bg); white-space: pre-wrap; line-height: 1.6; }
        .signal-tag { display: inline-block; padding: 4px 12px; border-radius: 16px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>RSI 相对强弱指标计算器</h1>

        <div class="card">
            <div class="form-group">
                <label>价格数据（逗号分隔，从旧到新）</label>
                <input type="text" id="priceInput" value="44,44.34,44.09,43.61,44.33,44.83,45.10,45.42,45.84,46.08,45.89,46.03,45.61,46.28,46.28,46.00,46.03,46.41,46.22,45.64,46.21,46.25,45.71,46.45,45.78,45.35,44.03,44.18,44.22,44.57,43.42,42.66,43.13" placeholder="例: 44,44.34,44.09...">
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>RSI 周期</label>
                    <select id="rsiPeriod">
                        <option value="7">7</option>
                        <option value="9">9</option>
                        <option value="14" selected>14</option>
                        <option value="21">21</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>信号线周期</label>
                    <select id="signalPeriod">
                        <option value="3" selected>3</option>
                        <option value="5">5</option>
                        <option value="7">7</option>
                    </select>
                </div>
            </div>
            <button onclick="calculate()">计算 RSI</button>
        </div>

        <div id="statsArea" class="grid-3" style="display:none;"></div>

        <div class="card" id="gaugeCard" style="display:none;">
            <h3>RSI 仪表盘</h3>
            <canvas id="gaugeCanvas" width="400" height="220" style="max-width:400px;margin:0 auto;display:block;"></canvas>
            <div id="gaugeSignal" style="text-align:center;margin-top:12px;font-size:18px;font-weight:bold;"></div>
        </div>

        <div class="card" id="chartCard" style="display:none;">
            <h3>RSI 走势图</h3>
            <canvas id="rsiChart" height="250"></canvas>
            <div class="legend">
                <span><i style="background:#007bff;"></i> RSI</span>
                <span><i style="background:#ffc107;"></i> 信号线</span>
                <span><i style="background:rgba(220,53,69,0.4);"></i> 超买区 (>70)</span>
                <span><i style="background:rgba(40,167,69,0.4);"></i> 超卖区 (<30)</span>
            </div>
        </div>

        <div class="card" id="priceChartCard" style="display:none;">
            <h3>价格走势</h3>
            <canvas id="priceChart" height="200"></canvas>
        </div>

        <div class="card" id="detailCard" style="display:none;">
            <h3>RSI 分析报告</h3>
            <div id="detailContent" class="output"></div>
        </div>
    </div>

    <script src="i18n.js" defer></script>
    <script>
        function toggleTheme() { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; }

        function parsePrices() {
            return document.getElementById('priceInput').value.split(',').map(Number).filter(n => !isNaN(n));
        }

        function calcRSI(prices, period) {
            const rsi = [];
            let gains = [], losses = [];
            for (let i = 1; i < prices.length; i++) {
                const diff = prices[i] - prices[i - 1];
                gains.push(diff > 0 ? diff : 0);
                losses.push(diff < 0 ? -diff : 0);
            }

            let avgGain = gains.slice(0, period).reduce((a, b) => a + b, 0) / period;
            let avgLoss = losses.slice(0, period).reduce((a, b) => a + b, 0) / period;

            for (let i = 0; i < prices.length; i++) {
                if (i < period) { rsi.push(null); continue; }
                if (i === period) {
                    // use precalculated
                } else {
                    avgGain = (avgGain * (period - 1) + gains[i - 1]) / period;
                    avgLoss = (avgLoss * (period - 1) + losses[i - 1]) / period;
                }
                if (avgLoss === 0) { rsi.push(100); continue; }
                const rs = avgGain / avgLoss;
                rsi.push(100 - 100 / (1 + rs));
            }
            return rsi;
        }

        function calcSMA(data, period) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) { result.push(null); continue; }
                let sum = 0, count = 0;
                for (let j = i - period + 1; j <= i; j++) {
                    if (data[j] !== null) { sum += data[j]; count++; }
                }
                result.push(count > 0 ? sum / count : null);
            }
            return result;
        }

        function calculate() {
            const prices = parsePrices();
            const period = parseInt(document.getElementById('rsiPeriod').value);
            const signalP = parseInt(document.getElementById('signalPeriod').value);
            if (prices.length < period + 1) { alert(`请输入至少${period + 1}个价格数据`); return; }

            const rsi = calcRSI(prices, period);
            const signal = calcSMA(rsi, signalP);
            const currentRSI = rsi[rsi.length - 1];
            const currentSignal = signal[signal.length - 1];

            let statusText, statusColor;
            if (currentRSI > 80) { statusText = '极度超买'; statusColor = '#dc3545'; }
            else if (currentRSI > 70) { statusText = '超买'; statusColor = '#fd7e14'; }
            else if (currentRSI > 60) { statusText = '偏强'; statusColor = '#28a745'; }
            else if (currentRSI > 40) { statusText = '中性'; statusColor = '#6c757d'; }
            else if (currentRSI > 30) { statusText = '偏弱'; statusColor = '#ffc107'; }
            else if (currentRSI > 20) { statusText = '超卖'; statusColor = '#20c997'; }
            else { statusText = '极度超卖'; statusColor = '#28a745'; }

            document.getElementById('statsArea').style.display = 'grid';
            document.getElementById('statsArea').innerHTML = `
                <div class="stat-box"><div class="num" style="color:${statusColor};">${currentRSI.toFixed(2)}</div><div class="label">RSI(${period})</div></div>
                <div class="stat-box"><div class="num" style="color:var(--secondary-color);">${currentSignal ? currentSignal.toFixed(2) : '-'}</div><div class="label">信号线(${signalP})</div></div>
                <div class="stat-box"><div class="num" style="color:${statusColor};">${statusText}</div><div class="label">市场状态</div></div>
            `;

            drawGauge(currentRSI, statusColor);
            drawRSIChart(rsi, signal);
            drawPriceChart(prices);
            showDetail(prices, rsi, period, currentRSI, currentSignal, statusText);
        }

        function drawGauge(value, color) {
            const canvas = document.getElementById('gaugeCanvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.width, H = canvas.height;
            ctx.clearRect(0, 0, W, H);

            const cx = W / 2, cy = H - 20, radius = 150;
            const startAngle = Math.PI;
            const endAngle = 2 * Math.PI;

            const zones = [
                { start: 0, end: 0.3, color: '#28a745' },
                { start: 0.3, end: 0.7, color: '#ffc107' },
                { start: 0.7, end: 1.0, color: '#dc3545' }
            ];

            zones.forEach(z => {
                ctx.beginPath();
                ctx.arc(cx, cy, radius, startAngle + z.start * Math.PI, startAngle + z.end * Math.PI);
                ctx.arc(cx, cy, radius * 0.65, startAngle + z.end * Math.PI, startAngle + z.start * Math.PI, true);
                ctx.closePath();
                ctx.fillStyle = z.color;
                ctx.globalAlpha = 0.3;
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            const needleAngle = startAngle + (value / 100) * Math.PI;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(needleAngle) * (radius * 0.9), cy + Math.sin(needleAngle) * (radius * 0.9));
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, 8, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();

            ctx.font = 'bold 32px sans-serif';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.fillText(value.toFixed(1), cx, cy - 20);

            ctx.font = '14px sans-serif';
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim();
            ctx.textAlign = 'left';
            ctx.fillText('0', cx - radius - 5, cy + 20);
            ctx.textAlign = 'center';
            ctx.fillText('50', cx, cy - radius - 10);
            ctx.textAlign = 'right';
            ctx.fillText('100', cx + radius + 5, cy + 20);

            document.getElementById('gaugeSignal').innerHTML = `<span style="color:${color};">${value > 70 ? '超买区域' : value < 30 ? '超卖区域' : '正常区域'}</span>`;
            document.getElementById('gaugeCard').style.display = 'block';
        }

        function drawRSIChart(rsi, signal) {
            const canvas = document.getElementById('rsiChart');
            const ctx = canvas.getContext('2d');
            const W = canvas.width = canvas.offsetWidth * 2;
            const H = canvas.height * 2;
            ctx.clearRect(0, 0, W, H);

            const padL = 60, padR = 20, padT = 20, padB = 40;
            const chartW = W - padL - padR;
            const chartH = H - padT - padB;
            const n = rsi.length;
            const xPos = (i) => padL + (i / (n - 1)) * chartW;
            const yPos = (v) => padT + chartH - (v / 100) * chartH;

            ctx.font = '18px sans-serif';
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim();
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim();
            ctx.lineWidth = 1;
            [0, 30, 50, 70, 100].forEach(v => {
                const y = yPos(v);
                ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
                ctx.fillText(v, 8, y + 5);
            });

            ctx.fillStyle = 'rgba(220,53,69,0.08)';
            ctx.fillRect(padL, yPos(100), chartW, yPos(70) - yPos(100));
            ctx.fillStyle = 'rgba(40,167,69,0.08)';
            ctx.fillRect(padL, yPos(30), chartW, yPos(0) - yPos(30));

            ctx.strokeStyle = 'rgba(220,53,69,0.5)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(padL, yPos(70)); ctx.lineTo(W - padR, yPos(70)); ctx.stroke();
            ctx.strokeStyle = 'rgba(40,167,69,0.5)';
            ctx.beginPath(); ctx.moveTo(padL, yPos(30)); ctx.lineTo(W - padR, yPos(30)); ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = '#ffc107'; ctx.lineWidth = 1.5; ctx.beginPath();
            let started = false;
            signal.forEach((v, i) => {
                if (v === null) return;
                if (!started) { ctx.moveTo(xPos(i), yPos(v)); started = true; } else ctx.lineTo(xPos(i), yPos(v));
            });
            ctx.stroke();

            ctx.strokeStyle = '#007bff'; ctx.lineWidth = 2.5; ctx.beginPath();
            started = false;
            rsi.forEach((v, i) => {
                if (v === null) return;
                if (!started) { ctx.moveTo(xPos(i), yPos(v)); started = true; } else ctx.lineTo(xPos(i), yPos(v));
            });
            ctx.stroke();

            const lastRSI = rsi[rsi.length - 1];
            ctx.beginPath(); ctx.arc(xPos(n - 1), yPos(lastRSI), 6, 0, Math.PI * 2);
            ctx.fillStyle = '#007bff'; ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(xPos(n - 1), yPos(lastRSI), 3, 0, Math.PI * 2); ctx.fill();

            document.getElementById('chartCard').style.display = 'block';
        }

        function drawPriceChart(prices) {
            const canvas = document.getElementById('priceChart');
            const ctx = canvas.getContext('2d');
            const W = canvas.width = canvas.offsetWidth * 2;
            const H = canvas.height * 2;
            ctx.clearRect(0, 0, W, H);

            const minP = Math.min(...prices) * 0.98;
            const maxP = Math.max(...prices) * 1.02;
            const padL = 60, padR = 20, padT = 10, padB = 30;
            const chartW = W - padL - padR;
            const chartH = H - padT - padB;
            const n = prices.length;

            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim();
            ctx.lineWidth = 1;
            ctx.font = '18px sans-serif';
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim();
            for (let i = 0; i <= 3; i++) {
                const y = padT + chartH - (i / 3) * chartH;
                ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
                ctx.fillText((minP + (i / 3) * (maxP - minP)).toFixed(1), 4, y + 5);
            }

            ctx.strokeStyle = '#007bff'; ctx.lineWidth = 2;
            ctx.beginPath();
            prices.forEach((p, i) => {
                const x = padL + (i / (n - 1)) * chartW;
                const y = padT + chartH - ((p - minP) / (maxP - minP)) * chartH;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();

            document.getElementById('priceChartCard').style.display = 'block';
        }

        function showDetail(prices, rsi, period, currentRSI, currentSignal, status) {
            const validRSI = rsi.filter(v => v !== null);
            const avgRSI = validRSI.reduce((a, b) => a + b, 0) / validRSI.length;
            const maxRSI = Math.max(...validRSI);
            const minRSI = Math.min(...validRSI);
            const current = prices[prices.length - 1];
            const prev = prices[prices.length - 2];

            let text = `RSI 分析报告\n${'='.repeat(40)}\n`;
            text += `参数: RSI(${period})\n`;
            text += `当前价格: ${current.toFixed(2)} (${current > prev ? '+' : ''}${((current - prev) / prev * 100).toFixed(2)}%)\n\n`;
            text += `当前 RSI: ${currentRSI.toFixed(2)}\n`;
            text += `信号线: ${currentSignal ? currentSignal.toFixed(2) : '-'}\n`;
            text += `市场状态: ${status}\n\n`;
            text += `统计:\n`;
            text += `  平均 RSI: ${avgRSI.toFixed(2)}\n`;
            text += `  最高 RSI: ${maxRSI.toFixed(2)}\n`;
            text += `  最低 RSI: ${minRSI.toFixed(2)}\n\n`;

            if (currentRSI > 70 && currentSignal && currentRSI < currentSignal) {
                text += `信号: RSI 从超买区域向下穿越信号线，可能是卖出信号。\n`;
            } else if (currentRSI < 30 && currentSignal && currentRSI > currentSignal) {
                text += `信号: RSI 从超卖区域向上穿越信号线，可能是买入信号。\n`;
            } else if (currentRSI > 70) {
                text += `信号: RSI 处于超买区域，注意回调风险。\n`;
            } else if (currentRSI < 30) {
                text += `信号: RSI 处于超卖区域，可能存在反弹机会。\n`;
            } else {
                text += `信号: RSI 处于正常区间，无明显信号。\n`;
            }

            document.getElementById('detailCard').style.display = 'block';
            document.getElementById('detailContent').textContent = text;
        }

        calculate();
    </script>
</body>
</html>
