<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹幕游戏</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; }
        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .stats span { color: var(--accent); font-weight: bold; }
        #gameCanvas {
            border: 2px solid var(--border);
            border-radius: 8px;
            max-width: 100%;
        }
        .info { margin-top: 10px; color: #8b949e; }
        .mobile-controls {
            display: none;
            margin-top: 15px;
        }
        .mobile-btn {
            width: 50px; height: 50px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            .mobile-controls { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <h1>💥 弹幕游戏</h1>
    <div class="stats">
        分数：<span id="score">0</span>
        生命：<span id="lives">3</span>
        BOSS：<span id="bossHp">100</span>%
    </div>
    <canvas id="gameCanvas" width="600" height="700"></canvas>
    <div class="info">方向键移动 | 自动射击 | 穿越弹幕消灭BOSS</div>
    <div class="mobile-controls">
        <button class="mobile-btn" id="bl">←</button>
        <button class="mobile-btn" id="bu">↑</button>
        <button class="mobile-btn" id="bd">↓</button>
        <button class="mobile-btn" id="br">→</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 600, H = 700;

        let player = {x:W/2, y:H-80, r:8, lives:3, invincible:0};
        let boss = {x:W/2, y:80, hp:100, maxHp:100, timer:0, pattern:0};
        let playerBullets = [], enemyBullets = [], particles = [];
        let score = 0, keys = {};

        document.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault(); });
        document.addEventListener('keyup', e => keys[e.key] = false);

        const mb = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', () => keys[key] = false);
        };
        mb('bl','ArrowLeft'); mb('bu','ArrowUp'); mb('bd','ArrowDown'); mb('br','ArrowRight');

        function shootPlayerBullet() {
            playerBullets.push({x:player.x, y:player.y-10, vy:-8, r:3});
        }

        let shootTimer = 0;
        function update() {
            const spd = 4;
            if (keys['ArrowLeft'] || keys['a']) player.x -= spd;
            if (keys['ArrowRight'] || keys['d']) player.x += spd;
            if (keys['ArrowUp'] || keys['w']) player.y -= spd;
            if (keys['ArrowDown'] || keys['s']) player.y += spd;
            player.x = Math.max(player.r, Math.min(W-player.r, player.x));
            player.y = Math.max(player.r, Math.min(H-player.r, player.y));

            shootTimer++;
            if (shootTimer % 5 === 0) shootPlayerBullet();

            if (player.invincible > 0) player.invincible--;

            playerBullets.forEach(b => b.y += b.vy);
            playerBullets = playerBullets.filter(b => b.y > -10);

            playerBullets.forEach(b => {
                if (Math.hypot(b.x-boss.x, b.y-boss.y) < 40) {
                    b.y = -100;
                    boss.hp -= 1;
                    if (boss.hp <= 0) {
                        score += 1000;
                        boss.hp = boss.maxHp + 20;
                        boss.maxHp += 20;
                        boss.pattern = (boss.pattern + 1) % 4;
                        for (let i = 0; i < 30; i++) {
                            particles.push({x:boss.x, y:boss.y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:30, color:'#fbbf24'});
                        }
                    }
                }
            });

            boss.timer++;
            boss.x = W/2 + Math.sin(boss.timer * 0.01) * 150;

            if (boss.timer % 15 === 0) {
                const pattern = boss.pattern;
                if (pattern === 0) {
                    for (let i = 0; i < 12; i++) {
                        const a = (i/12) * Math.PI * 2 + boss.timer * 0.02;
                        enemyBullets.push({x:boss.x, y:boss.y+30, vx:Math.cos(a)*3, vy:Math.sin(a)*3+1, r:4, color:'#ef4444'});
                    }
                } else if (pattern === 1) {
                    for (let i = 0; i < 8; i++) {
                        const a = Math.atan2(player.y-boss.y, player.x-boss.x) + (i-3.5)*0.15;
                        enemyBullets.push({x:boss.x, y:boss.y+30, vx:Math.cos(a)*4, vy:Math.sin(a)*4, r:4, color:'#f97316'});
                    }
                } else if (pattern === 2) {
                    for (let i = 0; i < 20; i++) {
                        const a = (i/20) * Math.PI * 2;
                        enemyBullets.push({x:boss.x, y:boss.y+30, vx:Math.cos(a)*2, vy:Math.sin(a)*2+2, r:3, color:'#a855f7'});
                    }
                } else {
                    for (let i = 0; i < 6; i++) {
                        const a = boss.timer * 0.1 + i * Math.PI/3;
                        enemyBullets.push({x:boss.x, y:boss.y+30, vx:Math.cos(a)*5, vy:Math.abs(Math.sin(a))*4+1, r:5, color:'#22c55e'});
                    }
                }
            }

            enemyBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
            enemyBullets = enemyBullets.filter(b => b.x > -20 && b.x < W+20 && b.y > -20 && b.y < H+20);

            if (player.invincible <= 0) {
                enemyBullets.forEach(b => {
                    if (Math.hypot(b.x-player.x, b.y-player.y) < player.r + b.r) {
                        b.y = H + 100;
                        player.lives--;
                        player.invincible = 90;
                        if (player.lives <= 0) {
                            player.lives = 3;
                            score = 0;
                            boss.hp = 100;
                            boss.maxHp = 100;
                            boss.pattern = 0;
                            enemyBullets = [];
                        }
                    }
                });
            }

            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; p.vx *= 0.95; p.vy *= 0.95; });
            particles = particles.filter(p => p.life > 0);

            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = player.lives;
            document.getElementById('bossHp').textContent = Math.max(0, Math.ceil(boss.hp / boss.maxHp * 100));
        }

        function draw() {
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, W, H);

            for (let i = 0; i < H; i += 40) {
                ctx.fillStyle = `rgba(59,130,246,${0.03 + Math.sin(Date.now()*0.001+i*0.1)*0.02})`;
                ctx.fillRect(0, i, W, 1);
            }

            particles.forEach(p => {
                ctx.globalAlpha = p.life / 30;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            enemyBullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r*0.5, 0, Math.PI*2);
                ctx.fill();
            });

            playerBullets.forEach(b => {
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
                ctx.fill();
            });

            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(boss.x, boss.y, 35, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#991b1b';
            ctx.beginPath();
            ctx.arc(boss.x-10, boss.y-5, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(boss.x+10, boss.y-5, 8, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = 'rgba(239,68,68,0.3)';
            ctx.fillRect(W/2-52, 10, 104, 14);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(W/2-50, 12, Math.max(0, boss.hp/boss.maxHp*100), 10);

            const alpha = player.invincible > 0 ? (Math.floor(player.invincible/4)%2===0 ? 1 : 0.3) : 1;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.r);
            ctx.lineTo(player.x - player.r, player.y + player.r);
            ctx.lineTo(player.x + player.r, player.y + player.r);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
