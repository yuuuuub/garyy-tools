<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;
            --secondary: #8b949e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: var(--secondary);
            font-size: 1.1rem;
        }
        
        .search-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
        }
        
        .search-row {
            display: grid;
            grid-template-columns: 1fr 200px 150px;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        @media (max-width: 768px) {
            .search-row {
                grid-template-columns: 1fr;
            }
        }
        
        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        
        .filter-label {
            color: var(--secondary);
            font-size: 0.9rem;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }
        
        .results-count {
            color: var(--secondary);
        }
        
        .sort-select {
            padding: 8px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .results-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .waterfall-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .waterfall-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        
        .waterfall-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .waterfall-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
        }
        
        .waterfall-type {
            padding: 4px 10px;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .waterfall-location {
            color: var(--secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .waterfall-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }
        
        .stars {
            color: var(--warning);
            letter-spacing: 2px;
        }
        
        .rating-value {
            font-weight: 600;
        }
        
        .rating-count {
            color: var(--secondary);
            font-size: 0.85rem;
        }
        
        .waterfall-description {
            color: var(--secondary);
            margin-bottom: 16px;
            line-height: 1.5;
        }
        
        .waterfall-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .stat-item {
            text-align: center;
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: var(--secondary);
            margin-top: 4px;
        }
        
        .waterfall-features {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .feature-tag {
            padding: 4px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--secondary);
        }
        
        .waterfall-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        
        .info-item {
            font-size: 0.9rem;
        }
        
        .info-label {
            color: var(--secondary);
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
        
        .info-value {
            font-weight: 500;
        }
        
        .book-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 16px;
        }
        
        .book-btn:hover {
            background: var(--accent-hover);
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--secondary);
        }
        
        .no-results-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        
        footer {
            text-align: center;
            padding: 40px 0;
            margin-top: 40px;
            border-top: 1px solid var(--border);
            color: var(--secondary);
            font-size: 0.9rem;
        }
    </style>

<body>

        <div class="search-section">

                <select class="sort-select" id="sortSelect">
                    <option value="rating">按评分排序</option>
                    <option value="height-high">高度从高到低</option>
                    <option value="height-low">高度从低到高</option>
                    <option value="fee-low">门票从低到高</option>
                </select>
            </div>
            <div class="filter-section">
                <span class="filter-label">徒步难度：</span>
                <button class="filter-btn active" data-difficulty="all">全部</button>
                <button class="filter-btn" data-difficulty="easy">轻松</button>
                <button class="filter-btn" data-difficulty="moderate">中等</button>
                <button class="filter-btn" data-difficulty="hard">困难</button>
                <button class="filter-btn" data-difficulty="extreme">极限</button>
            </div>
        </div>

        <div class="results-header">
            <span class="results-count" id="resultsCount">找到 10 个瀑布</span>
        </div>

        <div class="results-grid" id="resultsGrid">
            <!-- Cards will be injected here -->
        </div>

        <div class="no-results" id="noResults" style="display: none;">
            <div class="no-results-icon">🏞️</div>
            <h2>未找到匹配的瀑布</h2>
            <p>请尝试调整搜索条件或筛选项</p>

        <footer>

        </footer>
    </div>

                description: "峡谷中的瀑布群，水潭碧绿，峡谷幽深，是避暑胜地。",
                height: 20,
                waterFlow: "中",
                hikingDifficulty: "轻松",
                bestSeason: "5月-9月",
                entryFee: 80,
                features: ["峡谷瀑布", "碧绿水潭", "栈道", "避暑胜地"],
                bestViewingTime: "上午10-12点"
            },
            {
                name: "白水台瀑布",
                difficulty: "moderate",
                difficultyLabel: "中等",
                location: "云南省迪庆州",
                rating: 4.6,
                reviews: 1230,
                description: "中国最大的华泉台地，层层叠叠的钙华池，被誉为"仙人遗田"。",
                height: 15,
                waterFlow: "小",
                hikingDifficulty: "中等",
                bestSeason: "4月-10月",
                entryFee: 50,
                features: ["华泉台地", "钙华池", "纳西文化", "高原景观"],
                bestViewingTime: "上午9-11点"
            },
            {
                name: "白龙潭瀑布",
                difficulty: "hard",
                difficultyLabel: "困难",
                location: "河北省承德市",
                rating: 4.2,
                reviews: 980,
                description: "燕山山脉中的瀑布，落差30米，潭水清澈，是承德著名的避暑胜地。",
                height: 30,
                waterFlow: "中",
                hikingDifficulty: "困难",
                bestSeason: "5月-9月",
                entryFee: 60,
                features: ["燕山瀑布", "清澈潭水", "古寺", "避暑胜地"],
                bestViewingTime: "上午10-12点"
            },
            {
                name: "九龙瀑布群",
                difficulty: "extreme",
                difficultyLabel: "极限",
                location: "云南省曲靖市",
                rating: 4.7,
                reviews: 1670,
                description: "中国最大的瀑布群，九级瀑布总落差300多米，气势磅礴，震撼人心。",
                height: 300,
                waterFlow: "极大",
                hikingDifficulty: "极限",
                bestSeason: "6月-10月",
                entryFee: 70,
                features: ["九级瀑布", "总落差300米", "原始森林", "徒步探险"],
                bestViewingTime: "上午8-10点"
            }
        ];

        let currentDifficulty = 'all';
        let currentSort = 'rating';
        let searchQuery = '';

        function createStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 >= 0.5;
            let stars = '';
            for (let i = 0; i < fullStars; i++) {
                stars += '★';
            }
            if (hasHalf) {
                stars += '☆';
            }
            return stars;
        }

        function createWaterfallCard(waterfall) {
            return `
                <div class="waterfall-card">
                    <div class="waterfall-header">
                        <h3 class="waterfall-name">${waterfall.name}</h3>
                        <span class="waterfall-type">${waterfall.difficultyLabel}</span>
                    </div>
                    <div class="waterfall-location">📍 ${waterfall.location}</div>
                    <div class="waterfall-rating">
                        <span class="stars">${createStars(waterfall.rating)}</span>
                        <span class="rating-value">${waterfall.rating}</span>
                        <span class="rating-count">(${waterfall.reviews}条评价)</span>
                    </div>
                    <p class="waterfall-description">${waterfall.description}</p>
                    <div class="waterfall-stats">
                        <div class="stat-item">
                            <div class="stat-value">${waterfall.height}m</div>
                            <div class="stat-label">落差高度</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${waterfall.waterFlow}</div>
                            <div class="stat-label">水量</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">¥${waterfall.entryFee}</div>
                            <div class="stat-label">门票</div>
                        </div>
                    </div>
                    <div class="waterfall-features">
                        ${waterfall.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
                    </div>
                    <div class="waterfall-info">
                        <div class="info-item">
                            <div class="info-label">最佳季节</div>
                            <div class="info-value">${waterfall.bestSeason}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">最佳观赏时间</div>
                            <div class="info-value">${waterfall.bestViewingTime}</div>
                        </div>
                    </div>
                    <button class="book-btn">查看详情</button>
                </div>
            `;
        }

        function filterAndSort() {
            let filtered = waterfalls;
            
            if (currentDifficulty !== 'all') {
                filtered = filtered.filter(w => w.difficulty === currentDifficulty);
            }
            
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(w => 
                    w.name.toLowerCase().includes(query) || 
                    w.location.toLowerCase().includes(query)
                );
            }
            
            switch (currentSort) {
                case 'rating':
                    filtered.sort((a, b) => b.rating - a.rating);
                    break;
                case 'height-high':
                    filtered.sort((a, b) => b.height - a.height);
                    break;
                case 'height-low':
                    filtered.sort((a, b) => a.height - b.height);
                    break;
                case 'fee-low':
                    filtered.sort((a, b) => a.entryFee - b.entryFee);
                    break;
            }
            
            return filtered;
        }

        function renderResults() {
            const filtered = filterAndSort();
            const grid = document.getElementById('resultsGrid');
            const noResults = document.getElementById('noResults');
            const count = document.getElementById('resultsCount');
            
            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                count.textContent = '找到 0 个瀑布';
            } else {
                noResults.style.display = 'none';
                grid.innerHTML = filtered.map(createWaterfallCard).join('');
                count.textContent = `找到 ${filtered.length} 个瀑布`;
            }
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDifficulty = btn.dataset.difficulty;
                renderResults();
            });
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderResults();
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderResults();
        });

        renderResults();
    </script>
