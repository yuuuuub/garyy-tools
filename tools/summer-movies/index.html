<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>🎬 暑期档电影推荐 - Gary's Tools</title>
<meta name="description" content="2026年暑期档电影推荐：国产大片、好莱坞、动画电影、恐怖片分类推荐，含上映日期和期待指数">
<style>
:root{--bg:#0a0a0a;--card:#141414;--text:#e5e5e5;--text2:#737373;--accent:#e50914;--gold:#f5c518;--blue:#54b9c5;--border:#222;--radius:14px}
[data-theme="light"]{--bg:#f5f5f5;--card:#fff;--text:#111;--text2:#666;--border:#ddd}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:560px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#e50914,#f5c518,#54b9c5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.78rem;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.movie-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;transition:transform .2s}
.movie-card:hover{transform:translateY(-2px)}
.movie-poster{height:140px;display:flex;align-items:center;justify-content:center;font-size:4rem;position:relative}
.movie-poster .poster-badge{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:10px;font-size:.65rem;font-weight:700;color:#000;background:var(--gold)}
.movie-body{padding:16px}
.movie-title{font-size:1.1rem;font-weight:800;margin-bottom:4px}
.movie-meta{font-size:.72rem;color:var(--text2);margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap}
.movie-meta span{display:flex;align-items:center;gap:3px}
.movie-desc{font-size:.8rem;color:var(--text2);line-height:1.6;margin-bottom:8px}
.movie-stars{display:flex;gap:4px;align-items:center}
.star{color:var(--gold);font-size:.85rem}
.star-num{font-size:.8rem;font-weight:700;color:var(--gold);margin-left:4px}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🎬 暑期档电影推荐 - Gary's Tools">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/summer-movies/">
</head>
<body>
<div class="container">
<header><h1>🎬 暑期档电影推荐</h1><p>2026暑假 · 电影院值得看的片子</p></header>

<div class="tabs" id="tabs">
<button class="tab active" data-c="all">全部</button>
<button class="tab" data-c="domestic">🇨🇳 国产</button>
<button class="tab" data-c="hollywood">🇺🇸 好莱坞</button>
<button class="tab" data-c="anime">🎨 动画</button>
<button class="tab" data-c="streaming">📱 流媒体</button>
</div>

<div id="movieList"></div>
<footer>上映日期可能调整 · 以实际排片为准 🎬</footer>
</div>

<script>
const MOVIES=[
{title:'哪吒3：闹海重生',poster:'🔥',date:'7月18日',cats:['domestic'],type:'动画/奇幻',score:9.2,expect:'年度最期待',desc:'光线彩条屋出品，饺子导演。前两部票房超100亿，第三部哪吒将穿越到现代，画面和技术全面升级，暑期档票房冠军头号种子。',color:'linear-gradient(135deg,#ef4444,#f97316)'},
{title:'封神第三部',poster:'⚔️',date:'8月8日',cats:['domestic'],type:'奇幻/史诗',score:8.8,expect:'万众期待',desc:'乌尔善导演封神三部曲完结篇，武王伐纣终极决战。黄渤、费翔回归，神仙大战特效拉到天花板，中国神话史诗巅峰之作。',color:'linear-gradient(135deg,#b45309,#92400e)'},
{title:'流浪地球3',poster:'🌍',date:'7月25日',cats:['domestic'],type:'科幻/冒险',score:9.0,expect:'科幻巨制',desc:'郭帆导演，吴京、刘德华回归。地球开启新家园计划，与外星文明首次接触。国产科幻天花板，IMAX必看。',color:'linear-gradient(135deg,#1e40af,#3b82f6)'},
{title:'阿凡达3：火与灰',poster:'🌋',date:'12月(非暑期)',cats:['hollywood'],type:'科幻/冒险',score:8.5,expect:'史诗续作',desc:'卡梅隆13年磨一剑，纳美族新部落亮相，火元素视觉革命。虽然非暑期档但已开始预热，全球期待。',color:'linear-gradient(135deg,#ea580c,#ef4444)'},
{title:'复仇者联盟5：康之王朝',poster:'🛡️',date:'7月4日',cats:['hollywood'],type:'超级英雄/动作',score:8.3,expect:'漫威重磅',desc:'漫威宇宙新阶段开篇，多元宇宙大战全面爆发。X战警角色正式加入MCU，死侍客串，粉丝过年。',color:'linear-gradient(135deg,#7c3aed,#6366f1)'},
{title:'头脑特工队3',poster:'🧠',date:'7月11日',cats:['anime','hollywood'],type:'动画/喜剧',score:8.7,expect:'治愈必看',desc:'皮克斯系列第三部，莱莉进入高中，新情绪角色登场。前两部豆瓣9.0+，第三部维持高水准。',color:'linear-gradient(135deg,#ec4899,#8b5cf6)'},
{title:'神偷奶爸4',poster:'🟡',date:'7月4日',cats:['anime','hollywood'],type:'动画/喜剧',score:7.8,expect:'合家欢',desc:'照明娱乐王牌IP，格鲁一家新冒险。小黄人依旧蠢萌，暑期带娃观影首选。',color:'linear-gradient(135deg,#eab308,#facc15)'},
{title:'大护法2',poster:'🎭',date:'8月1日',cats:['domestic','anime'],type:'动画/奇幻',score:8.9,expect:'口碑黑马',desc:'不思凡导演暌违9年续作，成人向动画顶峰。思辨深度+水墨美学，第一部豆瓣8.3，续作格局更大。',color:'linear-gradient(135deg,#1e293b,#475569)'},
{title:'749局',poster:'🔍',date:'7月4日',cats:['domestic'],type:'科幻/悬疑',score:8.0,expect:'神秘之作',desc:'陆川导演多年打磨，王俊凯主演。关于中国神秘部门的超自然故事，预告质感极佳，暑期档最大变数。',color:'linear-gradient(135deg,#0891b2,#06b6d4)'},
{title:'疾速追杀5',poster:'🔫',date:'6月27日',cats:['hollywood'],type:'动作/犯罪',score:8.2,expect:'动作爽片',desc:'基努·里维斯回归！John Wick面对高桌会终极审判，动作设计再升级，全球最卖座R级动作系列新作。',color:'linear-gradient(135deg,#1c1917,#292524)'},
{title:'鱿鱼游戏3(流媒体)',poster:'🦑',date:'6月27日',cats:['streaming'],type:'惊悚/悬疑',score:8.5,expect:'全球爆款',desc:'Netflix现象级韩剧最终季，李政宰、李秉宪对决。网飞已确认6月27日全球上线，不需要去电影院。',color:'linear-gradient(135deg,#e11d48,#ec4899)'},
{title:'龙之家族 第三季',poster:'🐉',date:'6月15日',cats:['streaming'],type:'奇幻/史诗',score:8.6,expect:'权游粉必追',desc:'HBO权游前传新季，血龙狂舞内战白热化。龙战场景翻倍，马丁亲自参与编剧，口碑回升之作。',color:'linear-gradient(135deg,#166534,#16a34a)'},
];

let activeCat='all';

function render(){
const filtered=activeCat==='all'?MOVIES:MOVIES.filter(m=>m.cats.includes(activeCat));
document.getElementById('movieList').innerHTML=filtered.map(m=>{
const starCount=Math.round(m.score/2);
return`<div class="movie-card">
<div class="movie-poster" style="background:${m.color}">
<span class="poster-badge">${m.expect}</span>${m.poster}
</div>
<div class="movie-body">
<div class="movie-title">${m.title}</div>
<div class="movie-meta">
<span>📅 ${m.date}</span><span>🎭 ${m.type}</span>
</div>
<div class="movie-desc">${m.desc}</div>
<div class="movie-stars">${'★'.repeat(starCount)}${'☆'.repeat(5-starCount)}<span class="star-num">${m.score}</span></div>
</div>
</div>`}).join('');
}

document.getElementById('tabs').addEventListener('click',e=>{
if(!e.target.classList.contains('tab'))return;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
e.target.classList.add('active');
activeCat=e.target.dataset.c;
render();
});

render();
</script>
</body>
