<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔤 五字猜词</title>
    <meta name="description" content="五字猜词游戏Wordle，猜出隐藏的五字词语">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #3b82f6;
            --green: #22c55e;
            --yellow: #eab308;
            --gray: #6b7280;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; font-size: 2rem; }
        .subtitle { color: #8b949e; margin-bottom: 20px; }
        .game-board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        .cell {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            transition: all 0.3s;
        }
        .cell.correct { background: var(--green); border-color: var(--green); color: #fff; }
        .cell.present { background: var(--yellow); border-color: var(--yellow); color: #fff; }
        .cell.absent { background: var(--gray); border-color: var(--gray); color: #fff; }
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        #guess-input {
            width: 300px;
            padding: 12px 16px;
            font-size: 1.2rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            text-align: center;
            letter-spacing: 0.3em;
        }
        #guess-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .message {
            margin-top: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 1.1rem;
            display: none;
        }
        .message.win { background: var(--green); color: #fff; display: block; }
        .message.lose { background: #ef4444; color: #fff; display: block; }
        .hint {
            margin-top: 15px;
            padding: 10px 15px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #8b949e;
        }
        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
            max-width: 500px;
        }
        .key-row {
            display: flex;
            justify-content: center;
            gap: 4px;
        }
        .key {
            min-width: 35px;
            height: 45px;
            padding: 0 8px;
            border: none;
            border-radius: 6px;
            background: #374151;
            color: var(--text);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .key:hover { background: #4b5563; }
        .key.correct { background: var(--green); }
        .key.present { background: var(--yellow); }
        .key.absent { background: var(--gray); }
        @media (max-width: 600px) {
            .cell { width: 50px; height: 50px; font-size: 1.5rem; }
            #guess-input { width: 250px; }
            .key { min-width: 28px; height: 40px; font-size: 0.8rem; }
        }
    </style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">

    <div class="hint">提示：绿色=位置正确，黄色=存在但位置错，灰色=不存在</div>
    
    <div class="message" id="message"></div>

            '亡羊补牢', '刻舟求剑', '叶公好龙', '对牛弹琴', '井底之蛙',
            '狐假虎威', '鹤立鸡群', '龙飞凤舞', '虎踞龙盘', '马到成功',
            '一马当先', '万马奔腾', '龙马精神', '车水马龙', '千军万马',
            '刀光剑影', '枪林弹雨', '炮火连天', '硝烟弥漫', '浴血奋战',
            '出生入死', '奋不顾身', '舍生忘死', '视死如归', '前赴后继',
            '勇往直前', '一往无前', '义无反顾', '挺身而出', '自告奋勇'
        ];
        
        let targetWord = '';
        let currentRow = 0;
        let gameOver = false;
        let guessHistory = [];
        let keyStates = {};
        
        const board = document.getElementById('board');
        const input = document.getElementById('guess-input');
        const message = document.getElementById('message');
        const restartBtn = document.getElementById('restart-btn');
        const submitBtn = document.getElementById('submit-btn');
        
        function init() {
            targetWord = wordList[Math.floor(Math.random() * wordList.length)];
            currentRow = 0;
            gameOver = false;
            guessHistory = [];
            keyStates = {};
            
            board.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const row = document.createElement('div');
                row.className = 'row';
                row.id = `row-${i}`;
                for (let j = 0; j < 5; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${i}-${j}`;
                    row.appendChild(cell);
                }
                board.appendChild(row);
            }
            
            buildKeyboard();
            
            message.style.display = 'none';
            message.className = 'message';
            restartBtn.style.display = 'none';
            input.value = '';
            input.disabled = false;
            submitBtn.disabled = false;
            input.focus();
        }
        
        function buildKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';
            const rows = [
                ['q','w','e','r','t','y','u','i','o','p'],
                ['a','s','d','f','g','h','j','k','l'],
                ['z','x','c','v','b','n','m']
            ];
            rows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'key-row';
                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'key';
                    btn.textContent = key;
                    btn.onclick = () => {
                        if (!gameOver && input.value.length < 5) {
                            input.value += key;
                        }
                    };
                    btn.id = `key-${key}`;
                    rowDiv.appendChild(btn);
                });
                keyboard.appendChild(rowDiv);
            });
        }
        
        function submitGuess() {
            if (gameOver) return;
            
            const guess = input.value.trim();
            if (guess.length !== 5) {
                alert('请输入5个字！');
                return;
            }
            
            const row = document.getElementById(`row-${currentRow}`);
            const cells = row.querySelectorAll('.cell');
            
            for (let i = 0; i < 5; i++) {
                cells[i].textContent = guess[i];
            }
            
            const result = checkGuess(guess, targetWord);
            
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    cells[i].classList.add(result[i]);
                    updateKeyboard(guess[i], result[i]);
                }, i * 100);
            }
            
            guessHistory.push({ guess, result });
            
            setTimeout(() => {
                if (guess === targetWord) {
                    message.textContent = `🎉 恭喜！你猜对了！答案是：${targetWord}`;
                    message.className = 'message win';
                    message.style.display = 'block';
                    endGame();
                } else if (currentRow >= 5) {
                    message.textContent = `😢 游戏结束！答案是：${targetWord}`;
                    message.className = 'message lose';
                    message.style.display = 'block';
                    endGame();
                }
                currentRow++;
                input.value = '';
            }, 500);
        }
        
        function checkGuess(guess, target) {
            const result = new Array(5).fill('absent');
            const targetChars = target.split('');
            const guessChars = guess.split('');
            
            for (let i = 0; i < 5; i++) {
                if (guessChars[i] === targetChars[i]) {
                    result[i] = 'correct';
                    targetChars[i] = null;
                    guessChars[i] = null;
                }
            }
            
            for (let i = 0; i < 5; i++) {
                if (guessChars[i] === null) continue;
                const idx = targetChars.indexOf(guessChars[i]);
                if (idx !== -1) {
                    result[i] = 'present';
                    targetChars[idx] = null;
                }
            }
            
            return result;
        }
        
        function updateKeyboard(char, state) {
            const key = document.getElementById(`key-${char}`);
            if (!key) return;
            
            const currentState = keyStates[char];
            if (currentState === 'correct') return;
            if (currentState === 'present' && state === 'absent') return;
            
            keyStates[char] = state;
            key.className = `key ${state}`;
        }
        
        function endGame() {
            gameOver = true;
            input.disabled = true;
            submitBtn.disabled = true;
            restartBtn.style.display = 'block';
        }
        
        function restart() {
            init();
        }
        
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitGuess();
        });
        
        init();
    </script>
