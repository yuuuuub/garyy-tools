<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="信息图制作工具 - 创建数据可视化信息图">
    <meta name="robots" content="index, follow">
    <title>信息图制作工具</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #14b8a6; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #2dd4bf; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="color"], textarea, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        input[type="color"] { height: 40px; padding: 4px; cursor: pointer; }
        textarea { resize: vertical; min-height: 60px; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 8px; }
        button:hover { opacity: 0.9; }
        .btn-sm { padding: 4px 10px; font-size: 13px; }
        .btn-danger { background-color: var(--danger-color); }
        .btn-outline { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .template-btn { padding: 12px; border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; text-align: center; background: var(--card-bg); }
        .template-btn:hover, .template-btn.active { border-color: var(--primary-color); }
        .preview-canvas { background: white; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; max-width: 600px; margin: 0 auto; }
        .infographic { padding: 0; }
        .infographic .header { text-align: center; padding: 40px 30px; color: white; }
        .infographic .header h2 { margin: 0 0 8px 0; font-size: 28px; }
        .infographic .header p { margin: 0; opacity: 0.9; font-size: 14px; }
        .infographic .section { padding: 24px 30px; border-bottom: 1px solid var(--border-color); }
        .infographic .section:last-child { border-bottom: none; }
        .infographic .section h3 { margin: 0 0 16px 0; font-size: 18px; }
        .stat-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .stat-item { flex: 1; min-width: 100px; text-align: center; padding: 16px; border-radius: 8px; }
        .stat-item .number { font-size: 36px; font-weight: bold; }
        .stat-item .label { font-size: 12px; margin-top: 4px; }
        .bar-chart { margin: 12px 0; }
        .bar-row { display: flex; align-items: center; margin-bottom: 8px; gap: 12px; }
        .bar-label { width: 80px; font-size: 13px; text-align: right; }
        .bar-track { flex: 1; height: 24px; background: var(--border-color); border-radius: 12px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 12px; transition: width 0.5s; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 11px; color: white; font-weight: bold; }
        .timeline-vertical { position: relative; padding-left: 24px; }
        .timeline-vertical::before { content:''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--primary-color); }
        .timeline-item { position: relative; margin-bottom: 20px; }
        .timeline-item::before { content:''; position: absolute; left: -20px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary-color); }
        .timeline-item .year { font-weight: bold; color: var(--primary-color); }
        .timeline-item .desc { font-size: 13px; color: var(--secondary-color); margin-top: 4px; }
        .donut-chart { width: 150px; height: 150px; border-radius: 50%; position: relative; margin: 0 auto; }
        .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 80px; height: 80px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .data-list { list-style: none; padding: 0; }
        .data-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .data-list li:last-child { border-bottom: none; }
        .code-output { white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 12px; background: var(--bg-color); padding: 16px; border-radius: 6px; border: 1px solid var(--border-color); max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>信息图制作工具</h1>

        <div class="card">
            <h3>选择模板</h3>
            <div class="grid-3">
                <div class="template-btn active" onclick="setTemplate('stats')"><div style="font-size:24px;">📊</div><div>数据统计</div></div>
                <div class="template-btn" onclick="setTemplate('timeline')"><div style="font-size:24px;">📅</div><div>时间线</div></div>
                <div class="template-btn" onclick="setTemplate('comparison')"><div style="font-size:24px;">⚖️</div><div>对比分析</div></div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>内容编辑</h3>
                <div class="form-group"><label>标题</label><input type="text" id="infoTitle" value="2024年度数据报告" oninput="renderPreview()"></div>
                <div class="form-group"><label>副标题</label><input type="text" id="infoSubtitle" value="关键指标与增长趋势" oninput="renderPreview()"></div>
                <div class="form-group"><label>主题色</label><input type="color" id="themeColor" value="#14b8a6" oninput="renderPreview()"></div>

                <h4 style="margin-top:16px;">数据项</h4>
                <div id="dataItems"></div>
                <button class="btn-sm" onclick="addDataItem()">+ 添加数据</button>

                <h4 style="margin-top:16px;">图表数据</h4>
                <div id="chartData"></div>
                <button class="btn-sm" onclick="addChartData()">+ 添加图表项</button>
            </div>

            <div class="card">
                <h3>预览</h3>
                <div class="preview-canvas">
                    <div class="infographic" id="preview"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>导出 <button class="btn-sm" onclick="copyHTML()">复制HTML</button></h3>
            <div class="code-output" id="exportArea">预览区域的HTML内容将在此显示</div>
        </div>
    </div>

    <script defer src="i18n.js"></script>
    <script>
        let currentTemplate = 'stats';
        let dataItems = [
            { label: '总用户', value: '128,500', icon: '👥' },
            { label: '增长率', value: '+45%', icon: '📈' },
            { label: '满意度', value: '98.2%', icon: '⭐' },
            { label: '转化率', value: '3.8%', icon: '🎯' }
        ];
        let chartData = [
            { label: 'Q1', value: 65, color: '#14b8a6' },
            { label: 'Q2', value: 78, color: '#0ea5e9' },
            { label: 'Q3', value: 92, color: '#8b5cf6' },
            { label: 'Q4', value: 85, color: '#f59e0b' }
        ];

        function init() { renderDataItems(); renderChartData(); renderPreview(); }

        function setTemplate(t) {
            currentTemplate = t;
            document.querySelectorAll('.template-btn').forEach((b,i) => b.classList.toggle('active', ['stats','timeline','comparison'][i]===t));
            renderPreview();
        }

        function renderDataItems() {
            document.getElementById('dataItems').innerHTML = dataItems.map((d,i) => `
                <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
                    <input type="text" value="${d.icon}" style="width:40px !important;" onchange="dataItems[${i}].icon=this.value;renderPreview()">
                    <input type="text" value="${d.label}" placeholder="标签" onchange="dataItems[${i}].label=this.value;renderPreview()">
                    <input type="text" value="${d.value}" placeholder="数值" onchange="dataItems[${i}].value=this.value;renderPreview()">
                    <button class="btn-sm btn-danger" onclick="dataItems.splice(${i},1);renderDataItems();renderPreview()">×</button>
                </div>
            `).join('');
        }

        function addDataItem() {
            dataItems.push({ label: '新数据', value: '0', icon: '📊' });
            renderDataItems(); renderPreview();
        }

        function renderChartData() {
            document.getElementById('chartData').innerHTML = chartData.map((c,i) => `
                <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
                    <input type="text" value="${c.label}" style="width:60px !important;" onchange="chartData[${i}].label=this.value;renderPreview()">
                    <input type="number" value="${c.value}" min="0" max="100" style="width:60px !important;" onchange="chartData[${i}].value=+this.value;renderPreview()">
                    <input type="color" value="${c.color}" style="width:40px !important;height:32px;" onchange="chartData[${i}].color=this.value;renderPreview()">
                    <button class="btn-sm btn-danger" onclick="chartData.splice(${i},1);renderChartData();renderPreview()">×</button>
                </div>
            `).join('');
        }

        function addChartData() {
            const colors = ['#14b8a6','#0ea5e9','#8b5cf6','#f59e0b','#ef4444','#ec4899'];
            chartData.push({ label: '新项', value: 50, color: colors[chartData.length % colors.length] });
            renderChartData(); renderPreview();
        }

        function renderPreview() {
            const color = document.getElementById('themeColor').value;
            const title = document.getElementById('infoTitle').value;
            const subtitle = document.getElementById('infoSubtitle').value;
            const preview = document.getElementById('preview');

            let html = `<div class="header" style="background:${color};"><h2>${title}</h2><p>${subtitle}</p></div>`;

            if (currentTemplate === 'stats') {
                html += `<div class="section"><div class="stat-row">${dataItems.map(d => `
                    <div class="stat-item" style="background:${color}15;">
                        <div style="font-size:24px;">${d.icon}</div>
                        <div class="number" style="color:${color};">${d.value}</div>
                        <div class="label">${d.label}</div>
                    </div>
                `).join('')}</div></div>`;
                html += `<div class="section"><h3>季度趋势</h3><div class="bar-chart">${chartData.map(c => `
                    <div class="bar-row">
                        <div class="bar-label">${c.label}</div>
                        <div class="bar-track"><div class="bar-fill" style="width:${c.value}%;background:${c.color};">${c.value}%</div></div>
                    </div>
                `).join('')}</div></div>`;
            } else if (currentTemplate === 'timeline') {
                html += `<div class="section"><h3>发展历程</h3><div class="timeline-vertical">${dataItems.map((d,i) => `
                    <div class="timeline-item">
                        <div class="year">${d.icon} ${d.label}</div>
                        <div class="desc">${d.value}</div>
                    </div>
                `).join('')}</div></div>`;
                html += `<div class="section"><h3>关键数据</h3><ul class="data-list">${chartData.map(c => `
                    <li><span>${c.label}</span><span style="font-weight:bold;color:${c.color};">${c.value}</span></li>
                `).join('')}</ul></div>`;
            } else {
                html += `<div class="section"><h3>数据对比</h3>${chartData.map(c => `
                    <div style="margin-bottom:16px;">
                        <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>${c.label}</span><span style="font-weight:bold;">${c.value}%</span></div>
                        <div class="bar-track"><div class="bar-fill" style="width:${c.value}%;background:${c.color};"></div></div>
                    </div>
                `).join('')}</div>`;
                html += `<div class="section"><h3>关键发现</h3><ul class="data-list">${dataItems.map(d => `
                    <li><span>${d.icon} ${d.label}</span><span style="font-weight:bold;">${d.value}</span></li>
                `).join('')}</ul></div>`;
            }

            preview.innerHTML = html;
            document.getElementById('exportArea').textContent = preview.outerHTML;
        }

        function copyHTML() {
            navigator.clipboard.writeText(document.getElementById('exportArea').textContent).then(() => alert('HTML已复制'));
        }

        function toggleTheme() {
            const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
        }

        init();
    </script>
</body>
</html>
