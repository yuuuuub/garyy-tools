<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔗 网络图查看器 - Graph Network Viewer</title>
<meta name="description" content="交互式网络图查看器，可视化展示节点和连线关系">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔗 网络图查看器">
<meta property="og:description" content="交互式网络图查看器，可视化展示节点和连线关系">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/graph-network-viewer/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.toolbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px;z-index:100;box-shadow:var(--shadow)}
.toolbar h1{font-size:1rem;font-weight:700;color:var(--accent);margin-right:12px;white-space:nowrap}
.toolbar button{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;white-space:nowrap}
.toolbar button:hover{border-color:var(--accent)}
.toolbar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar .sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.toolbar label{font-size:.8rem;color:var(--text2)}
.toolbar input[type=color]{width:28px;height:28px;border:none;background:none;cursor:pointer}
.canvas-wrap{position:fixed;top:52px;left:0;right:0;bottom:0;overflow:hidden}
canvas{display:block;cursor:grab}
canvas.dragging{cursor:grabbing}
.info-panel{position:fixed;top:60px;right:16px;width:220px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;z-index:90;box-shadow:var(--shadow);display:none}
.info-panel h3{font-size:.85rem;color:var(--accent);margin-bottom:8px}
.info-panel p{font-size:.8rem;color:var(--text2);margin:4px 0}
.info-panel .lbl{color:var(--text2)}
.info-panel .val{color:var(--text);font-weight:600}
.stats{position:fixed;bottom:16px;left:16px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:.75rem;color:var(--text2);z-index:90}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>

<div class="toolbar">
<h1>🔗 网络图查看器</h1>
<button id="btnAdd" onclick="setMode('add')" class="active">+ 添加节点</button>
<button id="btnEdge" onclick="setMode('edge')">🔗 连线</button>
<button id="btnDel" onclick="setMode('delete')">🗑 删除</button>
<div class="sep"></div>
<button onclick="autoLayout()">📐 自动布局</button>
<button onclick="exportPNG()">💾 导出PNG</button>
<button onclick="clearAll()">🧹 清空</button>
<div class="sep"></div>
<label>颜色</label>
<input type="color" id="nodeColor" value="#3b82f6">
</div>

<div class="canvas-wrap">
<canvas id="c"></canvas>
</div>

<div class="info-panel" id="infoPanel">
<h3>节点信息</h3>
<p><span class="lbl">名称：</span><span class="val" id="infoName">-</span></p>
<p><span class="lbl">连接数：</span><span class="val" id="infoEdges">0</span></p>
<p><span class="lbl">位置：</span><span class="val" id="infoPos">-</span></p>
</div>

<div class="stats" id="stats">节点: 0 | 连线: 0</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = canvas.parentElement.clientWidth;
  H = canvas.height = canvas.parentElement.clientHeight;
}
resize();
window.addEventListener('resize', resize);

let nodes = [];
let edges = [];
let mode = 'add';
let selected = null;
let edgeStart = null;
let dragging = null;
let dragOff = {x:0,y:0};
let pan = {x:0,y:0};
let isPanning = false;
let panStart = {x:0,y:0};
let nodeId = 0;
let animFrame;
const NODE_R = 24;

function setMode(m) {
  mode = m;
  edgeStart = null;
  document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
  const map = {add:'btnAdd',edge:'btnEdge',delete:'btnDel'};
  if(map[m]) document.getElementById(map[m]).classList.add('active');
  canvas.style.cursor = m==='add'?'crosshair':m==='delete'?'pointer':'grab';
}

function addNode(x, y, label) {
  nodes.push({id: nodeId++, x, y, label: label||'Node '+nodeId, color: document.getElementById('nodeColor').value, vx:0, vy:0});
  updateStats();
}

function addEdge(from, to) {
  if(from===to) return;
  if(edges.find(e=>(e.from===from&&e.to===to)||(e.from===to&&e.to===from))) return;
  edges.push({from, to});
  updateStats();
}

function removeNode(id) {
  nodes = nodes.filter(n=>n.id!==id);
  edges = edges.filter(e=>e.from!==id&&e.to!==id);
  if(selected===id) { selected=null; document.getElementById('infoPanel').style.display='none'; }
  updateStats();
}

function clearAll() {
  if(!confirm('确定清空所有节点和连线？')) return;
  nodes=[]; edges=[]; selected=null; nodeId=0;
  document.getElementById('infoPanel').style.display='none';
  updateStats();
}

function updateStats() {
  document.getElementById('stats').textContent = '节点: '+nodes.length+' | 连线: '+edges.length;
}

function autoLayout() {
  if(!nodes.length) return;
  const cx = W/2, cy = H/2;
  const r = Math.min(W,H)*0.35;
  nodes.forEach((n,i) => {
    const a = (i/nodes.length)*Math.PI*2 - Math.PI/2;
    n.x = cx + Math.cos(a)*r;
    n.y = cy + Math.sin(a)*r;
    n.vx = 0; n.vy = 0;
  });
  for(let iter=0;iter<100;iter++) {
    for(let i=0;i<nodes.length;i++) {
      for(let j=i+1;j<nodes.length;j++) {
        let dx=nodes[j].x-nodes[i].x, dy=nodes[j].y-nodes[i].y;
        let d=Math.sqrt(dx*dx+dy*dy)||1;
        let f=2000/(d*d);
        nodes[i].vx-=f*dx/d; nodes[i].vy-=f*dy/d;
        nodes[j].vx+=f*dx/d; nodes[j].vy+=f*dy/d;
      }
    }
    edges.forEach(e=>{
      let a=nodes.find(n=>n.id===e.from), b=nodes.find(n=>n.id===e.to);
      if(!a||!b) return;
      let dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
      let f=(d-120)*0.02;
      a.vx+=f*dx/d; a.vy+=f*dy/d;
      b.vx-=f*dx/d; b.vy-=f*dy/d;
    });
    nodes.forEach(n=>{
      n.vx*=0.8; n.vy*=0.8;
      n.x+=n.vx; n.y+=n.vy;
      n.x=Math.max(NODE_R,Math.min(W-NODE_R,n.x));
      n.y=Math.max(NODE_R,Math.min(H-NODE_R,n.y));
    });
  }
}

function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.save();
  edges.forEach(e=>{
    const a=nodes.find(n=>n.id===e.from), b=nodes.find(n=>n.id===e.to);
    if(!a||!b) return;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.strokeStyle = 'rgba(139,148,158,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();
  });
  if(edgeStart!==null) {
    const a=nodes.find(n=>n.id===edgeStart);
    if(a) { ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(mouseX,mouseY); ctx.strokeStyle='rgba(59,130,246,0.5)'; ctx.lineWidth=2; ctx.setLineDash([6,4]); ctx.stroke(); ctx.setLineDash([]); }
  }
  nodes.forEach(n=>{
    ctx.beginPath();
    ctx.arc(n.x,n.y,NODE_R,0,Math.PI*2);
    ctx.fillStyle = n.id===selected ? '#fff' : n.color;
    ctx.fill();
    ctx.strokeStyle = n.id===selected ? n.color : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = n.id===selected ? 3 : 1;
    ctx.stroke();
    ctx.fillStyle = n.id===selected ? n.color : '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n.label.substring(0,6), n.x, n.y);
  });
  ctx.restore();
  animFrame = requestAnimationFrame(draw);
}

let mouseX=0, mouseY=0;
function getMousePos(e) {
  const r = canvas.getBoundingClientRect();
  return {x: e.clientX-r.left, y: e.clientY-r.top};
}

function findNode(x,y) {
  return nodes.find(n=>Math.hypot(n.x-x,n.y-y)<NODE_R);
}

canvas.addEventListener('mousedown', e=>{
  const p = getMousePos(e);
  const n = findNode(p.x,p.y);
  if(mode==='add' && !n) {
    addNode(p.x, p.y);
    return;
  }
  if(mode==='delete' && n) {
    removeNode(n.id);
    return;
  }
  if(mode==='edge') {
    if(n) {
      if(edgeStart===null) { edgeStart=n.id; }
      else { addEdge(edgeStart, n.id); edgeStart=null; }
    }
    return;
  }
  if(n) {
    dragging = n;
    dragOff = {x:p.x-n.x, y:p.y-n.y};
    selected = n.id;
    showInfo(n);
    canvas.classList.add('dragging');
  } else {
    isPanning = true;
    panStart = {x:p.x-pan.x, y:p.y-pan.y};
    selected = null;
    document.getElementById('infoPanel').style.display='none';
  }
});

canvas.addEventListener('mousemove', e=>{
  const p = getMousePos(e);
  mouseX=p.x; mouseY=p.y;
  if(dragging) {
    dragging.x = p.x - dragOff.x;
    dragging.y = p.y - dragOff.y;
  }
});

canvas.addEventListener('mouseup', ()=>{
  dragging=null;
  isPanning=false;
  canvas.classList.remove('dragging');
});

function showInfo(n) {
  const panel = document.getElementById('infoPanel');
  panel.style.display='block';
  document.getElementById('infoName').textContent=n.label;
  document.getElementById('infoEdges').textContent=edges.filter(e=>e.from===n.id||e.to===n.id).length;
  document.getElementById('infoPos').textContent=Math.round(n.x)+', '+Math.round(n.y);
}

function exportPNG() {
  const link = document.createElement('a');
  link.download = 'network-graph.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// Sample data
addNode(W*0.2, H*0.3, '客户端');
addNode(W*0.5, H*0.15, '负载均衡');
addNode(W*0.8, H*0.3, '数据库');
addNode(W*0.35, H*0.6, '服务A');
addNode(W*0.65, H*0.6, '服务B');
addEdge(0,1); addEdge(1,2); addEdge(1,3); addEdge(1,4); addEdge(3,2); addEdge(4,2);

draw();
updateStats();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
