<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS渐变生成器 - Color Gradient 中文</title>
<meta property="og:title" content="CSS渐变生成器 - Color Gradient 中文">
<meta property="og:description" content="CSS渐变生成器 - Color Gradient 中文 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="可视化CSS渐变生成器，支持线性渐变、径向渐变，一键复制CSS代码">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌈</text></svg>">
<meta name="robots" content="index, follow">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--radius:10px;--transition:.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.back{position:fixed;top:8px;left:8px;z-index:9999;text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)}
.header{text-align:center;padding:2rem 1rem 1rem}
.header h1{font-size:1.8rem;margin-bottom:.3rem}
.header p{color:var(--text2);font-size:.9rem}
.theme-btn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:.75rem}
.container{max-width:900px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.card h2{font-size:1.1rem;margin-bottom:.8rem;color:var(--accent)}
.gradient-preview{width:100%;height:180px;border-radius:12px;border:2px solid var(--border);margin:1rem 0;transition:background .3s}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.tab{padding:.5rem 1rem;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:.85rem;transition:all .2s}
.tab.active{background:var(--accent);border-color:var(--accent)}
.color-stops{margin:1rem 0}
.stop-row{display:flex;align-items:center;gap:.8rem;margin:.5rem 0}
.stop-row input[type="color"]{width:40px;height:40px;border:none;border-radius:8px;cursor:pointer;background:none;padding:0}
.stop-row input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
.stop-row input[type="color"]::-webkit-color-swatch{border-radius:8px;border:1px solid var(--border)}
.stop-row input[type="range"]{flex:1;accent-color:var(--accent)}
.stop-row .remove-btn{padding:.3rem .5rem;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:.8rem}
.add-stop-btn{padding:.5rem 1rem;border-radius:8px;border:1px dashed var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.85rem;width:100%;margin-top:.5rem}
.add-stop-btn:hover{border-color:var(--accent);color:var(--accent)}
.slider-row{display:flex;align-items:center;gap:.8rem;margin:.5rem 0}
.slider-row label{font-size:.85rem;min-width:60px;color:var(--text2)}
.slider-row input[type="range"]{flex:1;accent-color:var(--accent)}
.slider-row .val{font-size:.85rem;min-width:40px;text-align:right;font-family:monospace}
.css-output{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem;font-family:'SF Mono',Monaco,monospace;font-size:.8rem;white-space:pre-wrap;position:relative;margin-top:.8rem}
.copy-btn{position:absolute;top:.5rem;right:.5rem;padding:.3rem .6rem;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.75rem}
.copy-btn:hover{background:var(--accent);color:#fff}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.5rem;margin:1rem 0}
.preset{height:48px;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:transform .2s}
.preset:hover{transform:scale(1.05)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1,transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<a href="../index.html" class="back">← 首页</a>
<button class="theme-btn" onclick="toggleTheme()">🌓 主题</button>
<div class="header">
<h1>🌈 CSS渐变生成器</h1>
<p>可视化创建线性渐变和径向渐变，一键复制CSS代码</p>
</div>
<div class="container">
<div class="card">
<h2>渐变预览</h2>
<div class="gradient-preview" id="gradientPreview"></div>
</div>

<div class="card">
<h2>渐变设置</h2>
<div class="tabs">
<div class="tab active" onclick="setType('linear',this)">线性渐变</div>
<div class="tab" onclick="setType('radial',this)">径向渐变</div>
</div>
<div id="linearControls">
<div class="slider-row"><label>角度</label><input type="range" min="0" max="360" value="90" id="angleSlider" oninput="updateGrad()"><span class="val" id="angleVal">90°</span></div>
</div>
<div id="radialControls" style="display:none">
<div class="slider-row"><label>形状</label>
<select id="radialShape" onchange="updateGrad()" style="flex:1;padding:.4rem;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text)">
<option value="circle">圆形 Circle</option><option value="ellipse">椭圆 Ellipse</option>
</select></div>
</div>
<div class="color-stops" id="colorStops"></div>
<button class="add-stop-btn" onclick="addStop()">+ 添加色标</button>
</div>

<div class="card">
<h2>CSS 代码</h2>
<div class="css-output" id="cssOutput"><button class="copy-btn" onclick="copyCSS()">复制</button></div>
</div>

<div class="card">
<h2>预设渐变</h2>
<div class="presets" id="presetList"></div>
</div>
</div>

<script>
function toggleTheme(){const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t)}

let gradType='linear';
let stops=[
{color:'#667eea',pos:0},
{color:'#764ba2',pos:100}
];

function setType(type,el){
gradType=type;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
document.getElementById('linearControls').style.display=type==='linear'?'block':'none';
document.getElementById('radialControls').style.display=type==='radial'?'block':'none';
updateGrad();
}

function renderStops(){
const el=document.getElementById('colorStops');
el.innerHTML=stops.map((s,i)=>`
<div class="stop-row">
<input type="color" value="${s.color}" onchange="stops[${i}].color=this.value;updateGrad()">
<input type="range" min="0" max="100" value="${s.pos}" oninput="stops[${i}].pos=+this.value;updateGrad()">
<span style="font-size:.8rem;min-width:40px;text-align:right;font-family:monospace">${s.pos}%</span>
${stops.length>2?`<button class="remove-btn" onclick="stops.splice(${i},1);renderStops();updateGrad()">✕</button>`:''}
</div>`).join('');
}

function addStop(){
stops.push({color:'#ffffff',pos:50});
stops.sort((a,b)=>a.pos-b.pos);
renderStops();updateGrad();
}

function buildGradient(){
if(gradType==='linear'){
const angle=document.getElementById('angleSlider').value;
return`linear-gradient(${angle}deg, ${stops.map(s=>s.color+' '+s.pos+'%').join(', ')})`;
}else{
const shape=document.getElementById('radialShape').value;
return`radial-gradient(${shape}, ${stops.map(s=>s.color+' '+s.pos+'%').join(', ')})`;
}
}

function updateGrad(){
const grad=buildGradient();
document.getElementById('gradientPreview').style.background=grad;
document.getElementById('angleVal').textContent=document.getElementById('angleSlider').value+'°';
const css=`background: ${grad};`;
document.getElementById('cssOutput').innerHTML=`<button class="copy-btn" onclick="copyCSS()">复制</button>${css}`;
renderStops();
}

function copyCSS(){navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('cssOutput').textContent)}

const presets=[
{name:'日落',stops:[{color:'#f093fb',pos:0},{color:'#f5576c',pos:100}]},
{name:'海洋',stops:[{color:'#4facfe',pos:0},{color:'#00f2fe',pos:100}]},
{name:'森林',stops:[{color:'#43e97b',pos:0},{color:'#38f9d7',pos:100}]},
{name:'火焰',stops:[{color:'#f5576c',pos:0},{color:'#ff9a9e',pos:100}]},
{name:'极光',stops:[{color:'#a18cd1',pos:0},{color:'#fbc2eb',pos:100}]},
{name:'晚霞',stops:[{color:'#fa709a',pos:0},{color:'#fee140',pos:100}]},
{name:'冰蓝',stops:[{color:'#667eea',pos:0},{color:'#764ba2',pos:100}]},
{name:'薄荷',stops:[{color:'#11998e',pos:0},{color:'#38ef7d',pos:100}]},
{name:'深海',stops:[{color:'#0c3483',pos:0},{color:'#a2b6df',pos:100}]},
{name:'蜜桃',stops:[{color:'#ffecd2',pos:0},{color:'#fcb69f',pos:100}]}
];
const pl=document.getElementById('presetList');
presets.forEach(p=>{
const grad=`linear-gradient(135deg, ${p.stops.map(s=>s.color+' '+s.pos+'%').join(', ')})`;
pl.innerHTML+=`<div class="preset" style="background:${grad}" onclick="applyPreset(${JSON.stringify(p.stops).replace(/"/g,'&quot;')})" title="${p.name}"></div>`;
});
function applyPreset(s){stops=s.map(x=>({...x}));renderStops();updateGrad()}

renderStops();updateGrad();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
