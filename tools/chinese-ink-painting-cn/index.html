<div class="container"><h1>🎨 中国水墨画</h1><p class="sub">水墨技法 · 山水花鸟 · 名家名作 · 意境美学</p>

<script>
var data=[
{title:'墨分五色',era:'唐代至今',cat:'技法',tags:['焦浓重淡清','墨色变化','水墨核心'],desc:'以浓淡不同的墨色表现丰富的色彩层次，是水墨画的核心理念。',detail:'"墨分五色"指焦、浓、重、淡、清五种墨色层次。焦墨如漆、浓墨深沉、重墨浑厚、淡墨空灵、清墨缥缈。实际上墨色变化远不止五种，古人说"运墨而五色具"，意在说明水墨虽无色，却能表现万物色彩。',ref:'张彦远《历代名画记》'},
{title:'泼墨法',era:'唐代至今',cat:'技法',tags:['豪放','泼洒','大写意'],desc:'将墨汁泼洒于纸上，任其自然流淌形成画面，气势磅礴。',detail:'泼墨法传为唐代王洽所创。作画时将大量墨汁泼于纸上，再用笔引导墨色走向，形成自然天成的画面。泼墨法要求画家胸有成竹，敢于放手，追求"笔不到意到"的境界。张大千晚年将泼墨发展为"泼彩"，开创了水墨新境界。',ref:'《唐朝名画录》'},
{title:'破墨法',era:'唐代至今',cat:'技法',tags:['浓淡相破','层次','变化'],desc:'先画淡墨，趁湿用浓墨破之，产生丰富的墨色变化。',detail:'破墨法是水墨画最重要的技法之一。在第一层墨未干时，以浓墨或淡墨破之，使浓淡墨色相互渗透融合，产生丰富的层次变化。破墨法有浓破淡、淡破浓、水破墨等多种变化，是写意花鸟和山水画的基本技法。',ref:'《画鉴》'},
{title:'积墨法',era:'宋代至今',cat:'技法',tags:['层层叠加','厚重','浑厚'],desc:'用墨层层叠加，由淡到浓逐渐积染，画面厚重而丰富。',detail:'积墨法要求在前一层墨色干透后再加下一层，反复多次积染。积墨法能产生深邃厚重的效果，适合表现山石的质感和体量。黄宾虹是近现代积墨法的集大成者，其山水画层层积染数十遍，画面浑厚华滋。',ref:'黄宾虹《画语录》'},
{title:'山水画',era:'隋唐至今',cat:'题材',tags:['山水','意境','可居可游'],desc:'以自然山水为题材，追求"可居可游"的理想境界。',detail:'山水画是中国画的最大门类，分为青绿山水、金碧山水、水墨山水、浅绛山水等。山水画不仅是对自然的描绘，更是文人寄情山水、追求天人合一的精神寄托。宗炳提出"卧游"理论，认为山水画可以代替真实山水的游览。',ref:'宗炳《画山水序》'},
{title:'花鸟画',era:'唐代至今',cat:'题材',tags:['花鸟','生机','寓意'],desc:'以花卉、禽鸟、虫鱼为题材，讲究形神兼备、借物寓意。',detail:'花鸟画在唐代独立成科，五代时期黄筌和徐熙形成"黄家富贵、徐熙野逸"两大风格。花鸟画讲究"外师造化，中得心源"，要求画家深入观察自然。许多花鸟题材有吉祥寓意，如梅兰竹菊"四君子"象征高洁品格。',ref:'《宣和画谱》'},
{title:'人物画',era:'战国至今',cat:'题材',tags:['人物','传神','以形写神'],desc:'以人物为题材，讲究"以形写神"、"传神写照"。',detail:'人物画是中国画最早成熟的门类。顾恺之提出"以形写神"理论，强调人物画要传达人物的精神气质。人物画有工笔和写意两种风格：工笔人物精细入微，写意人物简练传神。张萱《捣练图》和周昉《簪花仕女图》是唐代人物画的代表作。',ref:'顾恺之《论画》'},
{title:'工笔画',era:'战国至今',cat:'流派',tags:['工整','细致','三矾九染'],desc:'用工整细致的笔法绘制，色彩绚丽、层次丰富。',detail:'工笔画是中国画中工整细致的一派。其特点是用笔工整、设色细腻，需要"三矾九染"——反复上色和固色数十遍。工笔画有工笔花鸟、工笔人物、工笔山水等分支。宋代院体工笔花鸟达到顶峰，如宋徽宗《瑞鹤图》。',ref:'《图画见闻志》'},
{title:'写意画',era:'宋代至今',cat:'流派',tags:['简练','奔放','不求形似'],desc:'用简练奔放的笔法抒发情感，不求形似而求神似。',detail:'写意画与工笔画相对，以简练的笔墨表达画家的主观情感。写意画讲究"得意忘形"、"不求形似"，追求笔墨的趣味和意境。梁楷的《泼墨仙人图》是写意人物的极致；徐渭的大写意花鸟将写意画推向高峰。',ref:'《画品》'},
{title:'青绿山水',era:'隋唐至今',cat:'流派',tags:['矿物颜料','金碧辉煌','宫廷'],desc:'以石青、石绿等矿物颜料为主，色彩鲜艳、金碧辉煌。',detail:'青绿山水是最早的山水画形式，以石青、石绿、朱砂等矿物颜料为主。隋代展子虔《游春图》是现存最早的青绿山水画。宋代王希孟《千里江山图》是青绿山水的巅峰之作，以石青石绿为主色，历经千年色彩依然鲜艳。',ref:'《画继》'},
{title:'文人画',era:'宋代至今',cat:'流派',tags:['士大夫','诗书画印','逸品'],desc:'文人以绘画抒发胸臆，强调诗书画印结合，追求"逸品"境界。',detail:'文人画兴起于宋代，以苏轼、文同等为代表。文人画不追求形似，强调画家的文学修养和精神境界。文人画的特点是诗书画印结合，画面题诗用印，形成独特的综合艺术形式。元代文人画达到高峰，以"元四家"黄公望、王蒙、倪瓒、吴镇为代表。',ref:'苏轼《论画》'},
{title:'范宽',era:'北宋',cat:'名家',tags:['山水','雨点皴','溪山行旅图'],desc:'北宋山水画大师，以雄强浑厚的风格著称。',detail:'范宽（约950-1032），字中立，华原人。他长期隐居终南山、太华山，观察自然山水，提出"与其师人，不若师诸造化"。其代表作《溪山行旅图》以"雨点皴"描绘北方山水的雄浑壮阔，被誉为"宋画第一"。',ref:'《图画见闻志》'},
{title:'郭熙',era:'北宋',cat:'名家',tags:['山水','三远法','早春图'],desc:'北宋山水画大师，提出"三远法"理论。',detail:'郭熙（约1020-1090），字淳夫，河南温县人。他是宋神宗时期的画院艺学，提出"三远法"——高远、深远、平远，成为中国山水画构图的重要理论。其代表作《早春图》描绘了早春时节山水云雾变幻的景象，是北宋山水画的杰作。',ref:'郭熙《林泉高致》'},
{title:'黄公望',era:'元代',cat:'名家',tags:['元四家','富春山居图','浅绛山水'],desc:'元四家之首，以《富春山居图》闻名于世。',detail:'黄公望（1269-1354），字子久，号一峰。他是"元四家"之首，对后世山水画影响深远。《富春山居图》是其晚年的代表作，描绘浙江富春江两岸的秀丽景色，被誉为"画中之兰亭"。此画历经火焚，分为"剩山图"和"无用师卷"两段。',ref:'《元史·黄公望传》'},
{title:'八大山人',era:'清初',cat:'名家',tags:['朱耷','简约','白眼向人'],desc:'清初四僧之一，以简约冷逸的画风著称，画中鱼鸟常"白眼向人"。',detail:'八大山人（1626-1705），原名朱耷，明宁献王朱权后裔。明亡后出家为僧，后还俗。他的画以极简的笔墨表现孤傲冷逸的情感，花鸟画中的鱼、鸟常翻白眼，表达对清朝的不满。其画风对后世齐白石等人影响极大。',ref:'《清史稿·八大山人传》'},
{title:'齐白石',era:'近现代',cat:'名家',tags:['人民艺术家','虾','衰年变法'],desc:'近现代国画大师，以画虾闻名，被誉为"人民艺术家"。',detail:'齐白石（1864-1957），原名纯芝，湖南湘潭人。他出身贫寒，自学成才。"衰年变法"后形成独特的大写意风格，以画虾最负盛名——寥寥数笔，墨色浓淡相宜，虾的透明感和灵动跃然纸上。他将民间艺术的质朴与文人画的高雅融为一体。',ref:'《齐白石自述》'},
{title:'张大千',era:'近现代',cat:'名家',tags:['泼彩','敦煌临摹','全能'],desc:'近现代全能型画家，晚年开创泼彩山水新风格。',detail:'张大千（1899-1983），名爰，四川内江人。他是近现代最具影响力的画家之一，山水、花鸟、人物无不精通。他曾在敦煌临摹壁画三年，深得古代绘画精髓。晚年因目力衰退，开创泼墨泼彩新风格，以抽象的墨彩表现山水意境。',ref:'《张大千传》'},
{title:'《千里江山图》',era:'北宋',cat:'名作',tags:['青绿山水','王希孟','18岁'],desc:'北宋王希孟18岁时创作的青绿山水巨作，现藏故宫博物院。',detail:'《千里江山图》纵51.5厘米、横1191.5厘米，是现存最大的青绿山水画。全卷以石青、石绿为主色，描绘了连绵起伏的山峦和波光粼粼的江河。作者王希孟创作此画时年仅18岁，完成后不久便英年早逝，此画成为他唯一的传世作品。',ref:'《千里江山图》蔡京题跋'},
{title:'《富春山居图》',era:'元代',cat:'名作',tags:['画中之兰亭','黄公望','火焚'],desc:'黄公望的代表作，被誉为"画中之兰亭"，历经火焚分藏两岸。',detail:'《富春山居图》描绘浙江富春江两岸初秋景色，全卷长约6米。此画为黄公望晚年历时数年完成，笔法苍润、意境深远。明末收藏家吴洪裕临终焚画殉葬，画作被救出但烧为两段。前段"剩山图"藏于浙江省博物馆，后段"无用师卷"藏于台北故宫博物院。',ref:'《富春山居图》'},
{title:'《墨葡萄图》',era:'明代',cat:'名作',tags:['徐渭','大写意','笔墨纵横'],desc:'徐渭的大写意代表作，笔墨纵横，情感奔放。',detail:'《墨葡萄图》是徐渭的代表作之一，以狂放的笔法绘写葡萄，墨色淋漓、气势磅礴。画上题诗"半生落魄已成翁，独立书斋啸晚风。笔底明珠无处卖，闲抛闲掷野藤中。"抒发了画家怀才不遇的悲愤。徐渭的大写意画风对后世影响深远。',ref:'《徐渭集》'}
];
var currentCat='all';
function renderList(items){
  var el=document.getElementById('list');
  var s=document.getElementById('stats');
  s.textContent='共 '+items.length+' 条知识';
  el.innerHTML=items.map(function(d,i){
    return '<div class="item" onclick="this.classList.toggle(\'open\')">'+
    '<div class="item-title">'+d.title+'</div>'+
    '<div class="item-era">年代：'+d.era+'</div>'+
    '<div class="item-desc">'+d.desc+'</div>'+
    '<div class="item-detail"><h4>详细介绍</h4><p>'+d.detail+'</p>'+
    '<p style="margin-top:8px;color:var(--accent2)">参考：'+d.ref+'</p>'+
    '<div>'+d.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div></div>';
  }).join('');
}
function filterList(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=data.filter(function(d){
    var matchQ=d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q)||d.era.toLowerCase().includes(q);
    var matchC=currentCat==='all'||d.cat===currentCat;
    return matchQ&&matchC;
  });
  renderList(filtered);
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterList();
}
renderList(data);
</script></body></html>
