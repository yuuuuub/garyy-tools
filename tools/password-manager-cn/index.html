<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码管理器 - 在线安全密码存储工具</title>
<meta name="description" content="本地密码管理器 - 生成、存储和管理您的安全密码，所有数据仅保存在浏览器本地">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<script src="../i18n.js" defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --bg-card: #161b22; --bg-input: #0d1117;
  --border: #30363d; --text: #e6edf3; --text-secondary: #8b949e;
  --accent: #58a6ff; --accent-hover: #79c0ff; --danger: #f85149;
  --success: #3fb950; --warning: #d2991d; --radius: 8px;
}
[data-theme="light"] { --bg: #f6f8fa; --bg-card: #fff; --bg-input: #fff; --border: #d0d7de; --text: #1f2328; --text-secondary: #656d76; --accent: #0969da; --accent-hover: #0550ae; --danger: #cf222e; --success: #1a7f37; --warning: #9a6700; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; line-height: 1.6; }
.container { max-width: 900px; margin: 0 auto; }
h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), #bc8cff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 8px; }
.subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 32px; font-size: 0.95rem; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
.card h2 { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
label { display: block; font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 4px; margin-top: 12px; }
input, select, textarea { width: 100%; padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.95rem; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
.row { display: flex; gap: 12px; align-items: flex-end; }
.row > * { flex: 1; }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: 0.2s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: 0.85; }
.btn-success { background: var(--success); color: #fff; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 6px 12px; font-size: 0.8rem; }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
table { width: 100%; border-collapse: collapse; margin-top: 12px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
th { color: var(--text-secondary); font-weight: 500; }
.password-cell { font-family: monospace; letter-spacing: 1px; }
.strength-bar { height: 4px; border-radius: 2px; margin-top: 4px; }
.strength-weak { background: var(--danger); width: 33%; }
.strength-medium { background: var(--warning); width: 66%; }
.strength-strong { background: var(--success); width: 100%; }
.search-box { position: relative; }
.search-box input { padding-left: 36px; }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 0.9rem; z-index: 1000; animation: slideIn 0.3s ease; }
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 999; }
.modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 90%; max-width: 500px; }
.modal h3 { margin-bottom: 16px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.toggle input { accent-color: var(--accent); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; background: var(--border); color: var(--text-secondary); }
.copy-hint { font-size: 0.8rem; color: var(--text-secondary); cursor: pointer; }
.copy-hint:hover { color: var(--accent); }
.empty-state { text-align: center; padding: 48px; color: var(--text-secondary); }
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
.stat-card .num { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
.stat-card .label { font-size: 0.8rem; color: var(--text-secondary); }
.master-input { max-width: 400px; margin: 0 auto 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>🔐 密码管理器</h1>
  <p class="subtitle">本地安全密码管理 · 所有数据仅存储在您的浏览器中</p>

  <div id="master-section" class="card">
    <h2>🔑 主密码设置</h2>
    <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:12px">设置主密码以加密保护所有存储的密码</p>
    <div class="master-input">
      <input type="password" id="master-password" placeholder="输入主密码（至少6位）">
    </div>
    <div class="actions" style="justify-content:center">
      <button class="btn btn-primary" onclick="unlockVault()">解锁密码库</button>
      <button class="btn btn-outline" onclick="createMasterPassword()">创建新密码库</button>
    </div>
  </div>

  <div id="main-section" style="display:none">
    <div class="stats" id="stats">
      <div class="stat-card"><div class="num" id="stat-total">0</div><div class="label">总密码数</div></div>
      <div class="stat-card"><div class="num" id="stat-strong">0</div><div class="label">强密码</div></div>
      <div class="stat-card"><div class="num" id="stat-weak">0</div><div class="label">弱密码</div></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <h2 style="margin:0">📋 密码列表</h2>
        <div style="display:flex;gap:8px">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search" placeholder="搜索..." oninput="renderPasswords()" style="padding-left:36px;width:200px">
          </div>
          <button class="btn btn-primary" onclick="showAddModal()">+ 添加密码</button>
          <button class="btn btn-outline" onclick="exportVault()">导出</button>
          <button class="btn btn-outline" onclick="importVault()">导入</button>
        </div>
      </div>
      <div id="password-list"></div>
    </div>

    <div class="card">
      <h2>🎲 密码生成器</h2>
      <div class="row" style="margin-bottom:12px">
        <div>
          <label>长度: <span id="gen-len">16</span></label>
          <input type="range" id="gen-length" min="8" max="64" value="16" oninput="updateGenLen();generatePreview()">
        </div>
      </div>
      <div class="row" style="font-size:0.9rem">
        <label class="toggle"><input type="checkbox" id="gen-upper" checked onchange="generatePreview()"> 大写</label>
        <label class="toggle"><input type="checkbox" id="gen-lower" checked onchange="generatePreview()"> 小写</label>
        <label class="toggle"><input type="checkbox" id="gen-digits" checked onchange="generatePreview()"> 数字</label>
        <label class="toggle"><input type="checkbox" id="gen-symbols" checked onchange="generatePreview()"> 符号</label>
      </div>
      <div style="margin-top:12px;padding:12px;background:var(--bg-input);border-radius:6px;font-family:monospace;font-size:1.1rem;word-break:break-all" id="gen-preview"></div>
      <div class="actions">
        <button class="btn btn-primary btn-sm" onclick="generatePreview()">🔄 重新生成</button>
        <button class="btn btn-success btn-sm" onclick="copyGenerated()">📋 复制密码</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">
<input type="hidden" id="modal-type">

<script>
const STORAGE_KEY = 'pm_vault';
let vault = [];
let masterKey = '';

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function simpleEncrypt(text, key) {
  let result = '';
  for (let i = 0; i < text.length; i++) {
    result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return btoa(result);
}

function simpleDecrypt(encoded, key) {
  const text = atob(encoded);
  let result = '';
  for (let i = 0; i < text.length; i++) {
    result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return result;
}

function createMasterPassword() {
  const mp = document.getElementById('master-password').value;
  if (mp.length < 6) { toast('主密码至少6位', 'error'); return; }
  masterKey = mp;
  vault = [];
  saveVault();
  document.getElementById('master-section').style.display = 'none';
  document.getElementById('main-section').style.display = 'block';
  generatePreview();
  renderPasswords();
  toast('密码库已创建');
}

function unlockVault() {
  const mp = document.getElementById('master-password').value;
  if (!mp) { toast('请输入主密码', 'error'); return; }
  masterKey = mp;
  const data = localStorage.getItem(STORAGE_KEY);
  if (data) {
    try {
      const decrypted = simpleDecrypt(data, masterKey);
      vault = JSON.parse(decrypted);
    } catch (e) {
      toast('主密码错误', 'error');
      masterKey = '';
      return;
    }
  } else {
    vault = [];
  }
  document.getElementById('master-section').style.display = 'none';
  document.getElementById('main-section').style.display = 'block';
  generatePreview();
  renderPasswords();
  toast('密码库已解锁');
}

function saveVault() {
  const encrypted = simpleEncrypt(JSON.stringify(vault), masterKey);
  localStorage.setItem(STORAGE_KEY, encrypted);
}

function updateGenLen() {
  document.getElementById('gen-len').textContent = document.getElementById('gen-length').value;
}

function generatePassword(len, upper, lower, digits, symbols) {
  let chars = '';
  if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (lower) chars += 'abcdefghijklmnopqrstuvwxyz';
  if (digits) chars += '0123456789';
  if (symbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
  if (!chars) chars = 'abcdefghijklmnopqrstuvwxyz';
  let pw = '';
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  for (let i = 0; i < len; i++) pw += chars[arr[i] % chars.length];
  return pw;
}

function generatePreview() {
  const len = +document.getElementById('gen-length').value;
  const pw = generatePassword(len,
    document.getElementById('gen-upper').checked,
    document.getElementById('gen-lower').checked,
    document.getElementById('gen-digits').checked,
    document.getElementById('gen-symbols').checked
  );
  document.getElementById('gen-preview').textContent = pw;
}

function copyGenerated() {
  navigator.clipboard.writeText(document.getElementById('gen-preview').textContent);
  toast('密码已复制');
}

function getPasswordStrength(pw) {
  let score = 0;
  if (pw.length >= 12) score++;
  if (pw.length >= 16) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[a-z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  if (score <= 2) return 'weak';
  if (score <= 4) return 'medium';
  return 'strong';
}

function renderPasswords() {
  const search = document.getElementById('search').value.toLowerCase();
  const filtered = vault.filter(p => p.site.toLowerCase().includes(search) || p.username.toLowerCase().includes(search));
  const list = document.getElementById('password-list');

  let total = vault.length, strong = 0, weak = 0;
  vault.forEach(p => {
    const s = getPasswordStrength(p.password);
    if (s === 'strong') strong++;
    if (s === 'weak') weak++;
  });
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-strong').textContent = strong;
  document.getElementById('stat-weak').textContent = weak;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🔒</div><p>暂无保存的密码</p></div>';
    return;
  }

  let html = '<table><thead><tr><th>网站/应用</th><th>用户名</th><th>密码</th><th>强度</th><th>操作</th></tr></thead><tbody>';
  filtered.forEach((p, i) => {
    const strength = getPasswordStrength(p.password);
    const strengthClass = 'strength-' + strength;
    const strengthLabel = { weak: '弱', medium: '中', strong: '强' }[strength];
    html += `<tr>
      <td><strong>${esc(p.site)}</strong>${p.note ? '<br><small style="color:var(--text-secondary)">' + esc(p.note) + '</small>' : ''}</td>
      <td>${esc(p.username)}</td>
      <td class="password-cell"><span id="pw-${i}" style="filter:blur(5px)">••••••••</span>
        <span class="copy-hint" onclick="togglePw(${i},'${esc(p.password)}')" title="显示/复制">👁</span></td>
      <td><span class="tag">${strengthLabel}</span><div class="strength-bar ${strengthClass}"></div></td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="copyText('${esc(p.password)}')">复制</button>
        <button class="btn btn-danger btn-sm" onclick="deletePassword(${vault.indexOf(p)})">删除</button>
      </td>
    </tr>`;
  });
  html += '</tbody></table>';
  list.innerHTML = html;
}

function esc(s) { return s.replace(/'/g, "\\'").replace(/</g, '&lt;'); }

function togglePw(i, pw) {
  const el = document.getElementById('pw-' + i);
  if (el.style.filter === 'none') {
    el.style.filter = 'blur(5px)';
    el.textContent = '••••••••';
  } else {
    el.style.filter = 'none';
    el.textContent = pw;
    navigator.clipboard.writeText(pw);
    toast('密码已复制');
  }
}

function copyText(text) {
  navigator.clipboard.writeText(text);
  toast('已复制到剪贴板');
}

function showAddModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="modal">
    <h3>➕ 添加密码</h3>
    <label>网站/应用名称</label><input id="m-site" placeholder="例如: GitHub">
    <label>用户名/邮箱</label><input id="m-user" placeholder="your@email.com">
    <label>密码</label>
    <div class="row"><input id="m-pw" type="password" placeholder="输入密码">
    <button class="btn btn-outline btn-sm" onclick="document.getElementById('m-pw').value=generatePassword(16,true,true,true,true);document.getElementById('m-pw').type='text'">生成</button></div>
    <label>备注</label><input id="m-note" placeholder="可选">
    <div class="actions">
      <button class="btn btn-primary" onclick="addPassword()">保存</button>
      <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

function addPassword() {
  const site = document.getElementById('m-site').value.trim();
  const user = document.getElementById('m-user').value.trim();
  const pw = document.getElementById('m-pw').value;
  const note = document.getElementById('m-note').value.trim();
  if (!site || !user || !pw) { toast('请填写必填项', 'error'); return; }
  vault.push({ site, username: user, password: pw, note, created: new Date().toISOString() });
  saveVault();
  renderPasswords();
  document.querySelector('.modal-overlay').remove();
  toast('密码已保存');
}

function deletePassword(i) {
  if (!confirm('确定删除此密码？')) return;
  vault.splice(i, 1);
  saveVault();
  renderPasswords();
  toast('密码已删除');
}

function exportVault() {
  const data = JSON.stringify(vault, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'password-vault-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  toast('密码库已导出');
}

function importVault() { document.getElementById('import-file').click(); }

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (Array.isArray(data)) {
        vault = vault.concat(data);
        saveVault();
        renderPasswords();
        toast('导入成功，共导入 ' + data.length + ' 条');
      }
    } catch (err) {
      toast('导入失败：文件格式错误', 'error');
    }
  };
  reader.readAsText(file);
}
</script>
</body>
</html>
