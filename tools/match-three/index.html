<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>💎 消消乐</title>
<meta name="description" content="经典三消游戏，交换宝石消除三个以上连线">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;flex-direction:column}
h1{font-size:1.5rem;margin-bottom:4px}
.info{display:flex;gap:24px;font-size:.9rem;color:#8b949e;margin-bottom:8px}
.info b{color:var(--text)}
canvas{border-radius:8px;touch-action:none;max-width:100%}
.combo{font-size:1.2rem;font-weight:700;color:var(--accent);min-height:28px;text-align:center;margin-top:8px}
button{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:.9rem;margin-top:8px}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="💎 消消乐">
  <meta property="og:description" content="经典三消游戏，交换宝石消除三个以上连线">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/match-three/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<h1>💎 消消乐</h1>
<div class="info">
<span>分数 <b id="score">0</b></span>
<span>连击 <b id="combo">0</b></span>
<span>步数 <b id="moves">30</b></span>
</div>
<canvas id="game"></canvas>
<div class="combo" id="comboText"></div>
<button onclick="newGame()">新游戏</button>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ROWS=8,COLS=8,CELL=48,MARGIN=8;
canvas.width=COLS*CELL+MARGIN*2;canvas.height=ROWS*CELL+MARGIN*2;
const GEMS=['🔴','🔵','🟢','🟡','🟣','🟠'];
let grid=[],selected=null,score=0,combo=0,moves=30,animating=false;

function init(){
grid=[];
for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++){do{grid[r][c]=Math.floor(Math.random()*GEMS.length)}while(checkMatch(r,c))}}
selected=null;score=0;combo=0;moves=30;
document.getElementById('comboText').textContent='';
updateUI();
}

function checkMatch(r,c){
const g=grid[r][c];
if(c>=2&&grid[r][c-1]===g&&grid[r][c-2]===g)return true;
if(r>=2&&grid[r-1]&&grid[r-1][c]===g&&grid[r-2]&&grid[r-2][c]===g)return true;
return false;
}

function findMatches(){
const matched=new Set();
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
const g=grid[r][c];if(g===null)continue;
// horizontal
if(c<=COLS-3&&grid[r][c+1]===g&&grid[r][c+2]===g){
let e=c+2;while(e+1<COLS&&grid[r][e+1]===g)e++;
for(let i=c;i<=e;i++)matched.add(r+','+i);
}
// vertical
if(r<=ROWS-3&&grid[r+1]&&grid[r+1][c]===g&&grid[r+2]&&grid[r+2][c]===g){
let e=r+2;while(e+1<ROWS&&grid[e+1]&&grid[e+1][c]===g)e++;
for(let i=r;i<=e;i++)matched.add(i+','+c);
}
}
return[...matched].map(k=>({r:parseInt(k.split(',')[0]),c:parseInt(k.split(',')[1])}));
}

function removeAndDrop(){
const matches=findMatches();
if(!matches.length){combo=0;document.getElementById('comboText').textContent='';return false}
combo++;score+=matches.length*combo*10;
document.getElementById('comboText').textContent=combo>1?'🔥 '+combo+'连击！':'';
document.getElementById('combo').textContent=combo;
matches.forEach(({r,c})=>{grid[r][c]=null});
// drop
for(let c=0;c<COLS;c++){
let empty=ROWS-1;
for(let r=ROWS-1;r>=0;r--){
if(grid[r][c]!==null){grid[empty][c]=grid[r][c];if(empty!==r)grid[r][c]=null;empty--}
}
for(let r=empty;r>=0;r--)grid[r][c]=Math.floor(Math.random()*GEMS.length);
}
return true;
}

function swap(r1,c1,r2,c2){
[grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];
}

function updateUI(){
document.getElementById('score').textContent=score;
document.getElementById('combo').textContent=combo;
document.getElementById('moves').textContent=moves;
}

function draw(){
ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,canvas.width,canvas.height);
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
const x=MARGIN+c*CELL,y=MARGIN+r*CELL;
ctx.fillStyle=(r+c)%2===0?'#161b22':'#1c2230';
ctx.fillRect(x,y,CELL,CELL);
if(selected&&selected.r===r&&selected.c===c){
ctx.strokeStyle='var(--accent)';ctx.lineWidth=3;ctx.strokeRect(x+2,y+2,CELL-4,CELL-4);
}
if(grid[r][c]!==null){
ctx.font='28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText(GEMS[grid[r][c]],x+CELL/2,y+CELL/2);
}
}
}

function doSwap(r1,c1,r2,c2){
swap(r1,c1,r2,c2);
if(findMatches().length===0){swap(r1,c1,r2,c2);draw();return}
moves--;updateUI();
animating=true;
(function loop(){
removeAndDrop();draw();
if(findMatches().length>0)setTimeout(loop,200);
else{animating=false;if(moves<=0){setTimeout(()=>garyyToast('游戏结束！得分: '+score),300)}}
})();
}

canvas.addEventListener('click',e=>{
if(animating||moves<=0)return;
const rect=canvas.getBoundingClientRect();
const sx=canvas.width/rect.width,sy=canvas.height/rect.height;
const bx=(e.clientX-rect.left)*sx,by=(e.clientY-rect.top)*sy;
const c=Math.floor((bx-MARGIN)/CELL),r=Math.floor((by-MARGIN)/CELL);
if(r<0||r>=ROWS||c<0||c>=COLS)return;
if(!selected){selected={r,c};draw();return}
const dr=Math.abs(r-selected.r),dc=Math.abs(c-selected.c);
if((dr===1&&dc===0)||(dr===0&&dc===1)){
doSwap(selected.r,selected.c,r,c);
}
selected={r,c};draw();
});

function newGame(){init();draw()}
init();draw();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
