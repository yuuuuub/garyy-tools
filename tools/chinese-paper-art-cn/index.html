<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国剪纸 - 剪艺生花 | Gary's Tools</title><meta name="description" content="中国剪纸艺术百科 - 剪纸流派、技法、题材、民俗应用全解"><meta name="robots" content="index,follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✂️</text></svg>"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#d4a574;--accent2:#8b6914}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#8b5e3c;--accent2:#6b4226}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;transition:background var(--transition),color var(--transition)}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.category-btn{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all var(--transition)}.category-btn.active{background:var(--accent);color:#fff}.category-btn:hover{opacity:.85}.item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all var(--transition)}.item:hover{transform:translateY(-2px);border-color:var(--accent)}.item-title{font-size:1.05rem;font-weight:600;margin-bottom:4px}.item-era{color:var(--accent);font-size:.8rem;margin-bottom:6px}.item-desc{color:var(--text2);font-size:.9rem;line-height:1.5}.item-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.9rem;line-height:1.7;color:var(--text)}.item.open .item-detail{display:block}.tag{display:inline-block;padding:2px 8px;margin:4px 4px 0;background:var(--border);border-radius:12px;font-size:.75rem;color:var(--text2)}</style></head>

<div class="container"><h1>✂️ 中国剪纸</h1><p class="sub">剪纸流派 · 技法题材 · 民俗应用 · 非遗传承</p>
<div class="card">
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索剪纸知识..." oninput="filterList()"></div>
<div class="btn-group">
<button class="category-btn active" onclick="filterCat('all',this)">全部</button>
<button class="category-btn" onclick="filterCat('历史',this)">历史</button>
<button class="category-btn" onclick="filterCat('技法',this)">技法</button>
<button class="category-btn" onclick="filterCat('流派',this)">流派</button>
<button class="category-btn" onclick="filterCat('题材',this)">题材</button>
<button class="category-btn" onclick="filterCat('民俗',this)">民俗</button>
</div></div>
<div id="stats"></div>

<script src="../i18n.js" defer></script>
<script>
var data=[
{title:'剪纸起源',era:'南北朝',cat:'历史',tags:['考古发现','北朝','最早实物'],desc:'中国最早的剪纸实物发现于新疆，距今约1500年。',detail:'剪纸起源于南北朝时期。1959年在新疆吐鲁番阿斯塔那北朝墓葬中出土了五幅剪纸作品，是目前已知最早的剪纸实物。其中包括对马团花、对猴团花等，说明早在南北朝时期，剪纸艺术已经相当成熟。',ref:'《中国剪纸艺术》'},
{title:'唐宋剪纸',era:'唐宋',cat:'历史',tags:['唐代','宋代','窗花'],desc:'唐代剪纸用于装饰和节庆，宋代出现了专业的剪纸艺人。',detail:'唐代剪纸艺术繁荣发展，用于节日装饰、佛事活动等。杜甫诗中"暖汤濯我足，剪纸招我魂"即反映了剪纸在民间的普及。宋代出现了专业的"剪字"艺人，剪纸商品化，用于装点窗牖的"窗花"开始流行。',ref:'《武林旧事》'},
{title:'明清鼎盛',era:'明清',cat:'历史',tags:['鼎盛','专业化','地方特色'],desc:'明清是剪纸艺术的鼎盛期，形成了鲜明的地方特色。',detail:'明清时期剪纸艺术达到鼎盛。各地形成了鲜明的地方风格：北方粗犷豪放，南方精细秀丽。剪纸广泛应用于窗花、刺绣底样、嫁妆装饰等。清代扬州剪纸名家包钧以"剪画"闻名，将剪纸提升为独立的艺术形式。',ref:'《扬州画舫录》'},
{title:'阳剪',era:'历代',cat:'技法',tags:['保留线条','纤细','南方'],desc:'保留图案的线条轮廓，剪去空白部分，线条纤细流畅。',detail:'阳剪又称"阳刻"，是剪纸的基本技法之一。阳剪保留图案的线条和轮廓，将背景部分剪去。阳剪作品线条纤细流畅、玲珑剔透，适合表现精细的图案。南方剪纸多以阳剪为主，如扬州剪纸、佛山剪纸等。',ref:'《剪纸技法》'},
{title:'阴剪',era:'历代',cat:'技法',tags:['剪去线条','块面','北方'],desc:'剪去图案的线条部分，保留背景，形成块面效果。',detail:'阴剪又称"阴刻"，与阳剪相反，是剪去图案的线条部分，保留背景的技法。阴剪作品块面感强、粗犷有力，适合表现大面积的图案。北方剪纸多以阴剪为主，如陕西剪纸、山西剪纸等。',ref:'《剪纸技法》'},
{title:'折叠剪',era:'历代',cat:'技法',tags:['对称','折叠','重复'],desc:'将纸折叠后剪裁，展开后形成对称重复的图案。',detail:'折叠剪是最常用的剪纸技法。将纸对折或多折后剪裁，展开后形成对称或重复的图案。如四折剪出窗花、五折剪出五角星等。折叠剪的关键在于把握折叠层数和图案的对称关系。',ref:'《民间剪纸》'},
{title:'套色剪纸',era:'明代至今',cat:'技法',tags:['多色','套色','彩色'],desc:'用不同颜色的纸分别剪裁后套叠在一起，形成彩色效果。',detail:'套色剪纸是在单色剪纸的基础上发展而来的。先用黑色纸剪出主轮廓，再用不同颜色的纸剪出局部图案，套叠粘贴在一起。套色剪纸色彩鲜艳、层次丰富，以广东佛山套色剪纸最为著名。',ref:'《佛山剪纸》'},
{title:'蔚县剪纸',era:'清代至今',cat:'流派',tags:['河北','点染','彩色'],desc:'河北蔚县的彩色点染剪纸，以刀刻代替剪裁，色彩绚丽。',detail:'蔚县剪纸是河北蔚县的传统剪纸，以刀刻代替剪裁，然后用毛笔蘸品色点染而成。其特点是色彩鲜艳、对比强烈，具有浓郁的民间特色。蔚县剪纸以戏曲人物、花鸟鱼虫为主要内容，2006年被列入国家级非物质文化遗产。',ref:'《蔚县剪纸》'},
{title:'扬州剪纸',era:'唐代至今',cat:'流派',tags:['江苏','精细','清秀'],desc:'南方剪纸的代表，以精细清秀著称，2009年入选联合国非遗。',detail:'扬州剪纸历史悠久，唐代即已流行。其特点是线条纤细流畅、构图精巧雅致，具有南方剪纸的典型风格。扬州剪纸以花卉、鸟兽、人物为主要内容，风格清秀典雅。2009年入选联合国教科文组织"人类非物质文化遗产代表作名录"。',ref:'《扬州剪纸》'},
{title:'陕西剪纸',era:'历代',cat:'流派',tags:['北方','粗犷','生命力'],desc:'北方剪纸的代表，风格粗犷豪放，充满原始生命力。',detail:'陕西剪纸是北方剪纸的典型代表，以延安、关中地区最为著名。其特点是构图大胆、线条粗犷、造型夸张，充满了原始的生命力。陕西剪纸中"抓髻娃娃"等图案保留了远古生殖崇拜的遗风，是研究民俗文化的珍贵资料。',ref:'《陕西民间剪纸》'},
{title:'佛山剪纸',era:'明代至今',cat:'流派',tags:['广东','铜凿','金碧辉煌'],desc:'广东佛山的传统剪纸，以铜箔、铜凿剪纸闻名，金碧辉煌。',detail:'佛山剪纸始于明代，以铜箔、银箔为材料，用铜凿等工具制作，风格金碧辉煌。佛山剪纸有剪、凿、衬、写、裱等多种技法，题材以戏曲人物、龙凤图案为主。佛山剪纸是岭南文化的重要组成部分。',ref:'《佛山剪纸志》'},
{title:'窗花',era:'历代',cat:'题材',tags:['春节','窗户','装饰'],desc:'贴在窗户上的剪纸装饰，是春节期间最重要的民俗活动之一。',detail:'窗花是中国北方春节期间贴在窗户上的剪纸装饰。每逢春节，家家户户都要贴窗花，增添节日气氛。窗花题材丰富，包括花鸟鱼虫、吉祥图案、戏曲人物等。常见的窗花有"连年有余"（莲花和鱼）、"福禄寿喜"等。',ref:'《中国民俗大观》'},
{title:'喜花',era:'历代',cat:'题材',tags:['婚礼','喜字','鸳鸯'],desc:'婚礼上使用的剪纸装饰，以"囍"字和鸳鸯图案为主。',detail:'喜花是婚礼上使用的剪纸装饰。最常见的是"双喜"（囍）字剪纸，贴在新房门窗和嫁妆上。喜花的图案还有鸳鸯戏水、龙凤呈祥、并蒂莲等，都寓意婚姻美满。不同地区的喜花风格各异，但都洋溢着喜庆气氛。',ref:'《中国婚俗》'},
{title:'刺绣底样',era:'历代',cat:'题材',tags:['刺绣','花样','实用'],desc:'为刺绣提供图案模板的剪纸，是剪纸与刺绣的结合。',detail:'刺绣底样是剪纸的一个重要用途。剪纸艺人将图案剪好后贴在布料上，绣工按照剪纸轮廓刺绣。刺绣底样题材广泛，有花鸟、人物、吉祥图案等。苏州刺绣、湘绣等都以精细的剪纸底样著称。',ref:'《中国刺绣》'},
{title:'剪纸与春节',era:'历代',cat:'民俗',tags:['春节','年俗','除旧迎新'],desc:'春节期间贴窗花、挂笺是重要的年俗，寓意除旧迎新。',detail:'春节贴剪纸是中国最重要的年俗之一。除夕之前，家家户户贴窗花、挂笺、贴福字，以红色剪纸装饰门窗，寓意驱邪纳福、除旧迎新。红色在中国文化中象征喜庆和吉祥，春节期间到处红彤彤的剪纸，营造出浓厚的节日氛围。',ref:'《中国年节》'},
{title:'剪纸与端午',era:'历代',cat:'民俗',tags:['端午','五毒','驱邪'],desc:'端午节剪"五毒"图案剪纸贴于门窗，寓意驱毒辟邪。',detail:'端午节有剪"五毒"剪纸的习俗。"五毒"指蛇、蝎、蜈蚣、壁虎、蟾蜍五种毒虫。将五毒图案剪纸贴在门窗上，寓意以毒攻毒、驱毒辟邪。有些地方还剪"钟馗"剪纸贴于门上，借钟馗之威驱除邪祟。',ref:'《端午节俗》'},
{title:'剪纸与婚俗',era:'历代',cat:'民俗',tags:['婚礼','嫁妆','洞房'],desc:'婚礼中大量使用剪纸装饰，从嫁妆到洞房处处可见。',detail:'中国各地婚礼都大量使用剪纸装饰。新娘出嫁前要剪喜花贴在嫁妆上；新房门窗要贴大红喜字和鸳鸯戏水；洞房内要贴"坐帐花"。不同地区的婚俗剪纸各有特色，如陕北的"扣碗花"、关中的"嫁娶图"等。',ref:'《中国婚俗文化》'},
{title:'剪纸与丧葬',era:'历代',cat:'民俗',tags:['纸扎','引魂','丧俗'],desc:'丧葬中使用剪纸装饰纸扎、棺木，引导亡灵升天。',detail:'剪纸在丧葬习俗中也有重要应用。出殡时使用的纸扎（纸房子、纸人等）上贴有各种剪纸图案。棺木上贴的剪纸称为"寿花"，寓意引导亡灵升天。虽然现代丧葬习俗已简化，但在一些农村地区仍保留着这些传统。',ref:'《中国丧葬文化》'}
];
var currentCat='all';
function renderList(items){
  var el=document.getElementById('list');
  var s=document.getElementById('stats');
  s.textContent='共 '+items.length+' 条知识';
  el.innerHTML=items.map(function(d,i){
    return '<div class="item" onclick="this.classList.toggle(\'open\')">'+
    '<div class="item-title">'+d.title+'</div>'+
    '<div class="item-era">年代：'+d.era+'</div>'+
    '<div class="item-desc">'+d.desc+'</div>'+
    '<div class="item-detail"><h4>详细介绍</h4><p>'+d.detail+'</p>'+
    '<p style="margin-top:8px;color:var(--accent2)">参考：'+d.ref+'</p>'+
    '<div>'+d.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div></div>';
  }).join('');
}
function filterList(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=data.filter(function(d){
    var matchQ=d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q)||d.era.toLowerCase().includes(q);
    var matchC=currentCat==='all'||d.cat===currentCat;
    return matchQ&&matchC;
  });
  renderList(filtered);
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterList();
}
renderList(data);
</script></body></html>
