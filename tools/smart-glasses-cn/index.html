<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👓 智能眼镜控制</title>
<meta name="description" content="智能眼镜AR功能、显示设置与应用管理">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.glasses-preview{text-align:center;padding:30px;border-radius:var(--radius);background:var(--bg);margin-bottom:16px}
.glasses-icon{font-size:4rem;margin-bottom:12px}
.glasses-text{font-size:1.2rem;font-weight:600;margin-bottom:16px}
.glasses-status{display:flex;justify-content:center;gap:20px;margin-bottom:16px}
.status-item{text-align:center}
.status-icon{font-size:1.5rem}
.status-value{font-size:.85rem;color:var(--text2)}
.ar-view{width:100%;height:200px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:8px;margin-bottom:16px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ar-overlay{position:absolute;padding:8px 12px;background:rgba(0,0,0,.7);color:#fff;border-radius:4px;font-size:.85rem}
.ar-overlay.top-left{top:10px;left:10px}
.ar-overlay.top-right{top:10px;right:10px}
.ar-overlay.bottom{bottom:10px;left:50%;transform:translateX(-50%)}
.ar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.ar-item{padding:12px;background:var(--bg);border-radius:8px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s}
.ar-item:hover{border-color:var(--accent)}
.ar-item.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
.ar-icon{font-size:1.5rem;margin-bottom:4px}
.ar-name{font-size:.8rem}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.app-item{padding:12px;background:var(--bg);border-radius:8px;text-align:center;cursor:pointer;transition:all .2s}
.app-item:hover{background:rgba(59,130,246,.1)}
.app-icon{font-size:1.5rem;margin-bottom:4px}
.app-name{font-size:.75rem}
.gesture-list{display:flex;flex-direction:column;gap:8px}
.gesture-item{padding:12px;background:var(--bg);border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.gesture-info{display:flex;align-items:center;gap:12px}
.gesture-icon{font-size:1.5rem}
.gesture-name{font-weight:600}
.gesture-action{font-size:.85rem;color:var(--text2)}
.voice-command{margin-top:12px}
.voice-command input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem}
.settings-group{margin-bottom:16px}
.settings-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px}
.settings-group input[type=text],.settings-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
.toggle-group{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.toggle-group:last-child{border-bottom:none}
.toggle{width:50px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background .2s;cursor:pointer}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s}
.toggle.on::after{transform:translateX(24px)}
button{padding:8px 16px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.scan-line{position:absolute;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 2s linear infinite}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👓</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="👓 智能眼镜控制">
<meta property="og:description" content="智能眼镜AR功能、显示设置与应用管理">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>👓 智能眼镜控制</h1><p>AR体验，智能显示，语音交互</p></div>

<div class="cd">
<div class="glasses-preview">
<div class="glasses-icon">👓</div>
<div class="glasses-text" id="glassesStatus">已连接</div>
<div class="glasses-status">
<div class="status-item"><div class="status-icon">🔋</div><div class="status-value" id="batteryStatus">85%</div></div>
<div class="status-item"><div class="status-icon">📶</div><div class="status-value">Wi-Fi</div></div>
<div class="status-item"><div class="status-icon">📡</div><div class="status-value">蓝牙</div></div>
</div>
<button onclick="togglePower()">开关机</button>
</div>
</div>

<div class="cd">
<h2>AR视图</h2>
<div class="ar-view">
<div class="scan-line"></div>
<div class="ar-overlay top-left" id="arTime">12:00</div>
<div class="ar-overlay top-right" id="arWeather">25°C 晴</div>
<div class="ar-overlay bottom" id="arNav">前方500米左转</div>
</div>
<div class="ar-grid" id="arGrid"></div>
</div>

<div class="cd">
<h2>应用</h2>
<div class="app-grid" id="appGrid"></div>
</div>

<div class="cd">
<h2>手势控制</h2>
<div class="gesture-list" id="gestureList"></div>
<div style="margin-top:12px">
<button onclick="addGesture()">+ 添加手势</button>
</div>
</div>

<div class="cd">
<h2>语音助手</h2>
<div class="voice-command">
<input type="text" id="voiceInput" placeholder="说出你的命令..." onkeypress="if(event.key==='Enter')sendVoice()">
</div>
<button onclick="sendVoice()" style="margin-top:12px;width:100%">发送命令</button>
<div id="voiceResponse" style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px;display:none"></div>
</div>

<div class="cd">
<h2>显示设置</h2>
<div class="settings-group">
<label>亮度</label>
<select id="displayBrightness" onchange="saveSettings()">
<option value="auto" selected>自动</option>
<option value="low">低</option>
<option value="medium">中</option>
<option value="high">高</option>
</select>
</div>
<div class="settings-group">
<label>字体大小</label>
<select id="fontSize" onchange="saveSettings()">
<option value="small">小</option>
<option value="medium" selected>中</option>
<option value="large">大</option>
</select>
</div>
<div class="toggle-group">
<span>HUD显示</span>
<div class="toggle on" id="hudToggle" onclick="toggleSetting('hud')"></div>
</div>
<div class="toggle-group">
<span>手势控制</span>
<div class="toggle on" id="gestureToggle" onclick="toggleSetting('gesture')"></div>
</div>
<div class="toggle-group">
<span>语音唤醒</span>
<div class="toggle on" id="voiceToggle" onclick="toggleSetting('voice')"></div>
</div>
<div class="toggle-group">
<span>隐私模式</span>
<div class="toggle" id="privacyToggle" onclick="toggleSetting('privacy')"></div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let isOn=true;
let gestures=JSON.parse(localStorage.getItem('sg_gestures')||'[]');
let settings=JSON.parse(localStorage.getItem('sg_settings')||'{"brightness":"auto","fontSize":"medium","hud":true,"gesture":true,"voice":true,"privacy":false}');
const arModes=[
  {id:'nav',icon:'🗺️',name:'导航'},
  {id:'translate',icon:'🌐',name:'翻译'},
  {id:'fitness',icon:'🏃',name:'健身'},
  {id:'weather',icon:'🌤️',name:'天气'},
  {id:'calendar',icon:'📅',name:'日历'},
  {id:'camera',icon:'📷',name:'拍照'}
];
let currentArMode='nav';
const apps=[
  {name:'导航',icon:'🗺️'},
  {name:'翻译',icon:'🌐'},
  {name:'相机',icon:'📷'},
  {name:'音乐',icon:'🎵'},
  {name:'消息',icon:'💬'},
  {name:'天气',icon:'🌤️'},
  {name:'日历',icon:'📅'},
  {name:'健康',icon:'❤️'},
  {name:'笔记',icon:'📝'},
  {name:'设置',icon:'⚙️'}
];

function saveGestures(){localStorage.setItem('sg_gestures',JSON.stringify(gestures));}
function saveSettings(){localStorage.setItem('sg_settings',JSON.stringify(settings));}

function updateUI(){
  $('displayBrightness').value=settings.brightness;
  $('fontSize').value=settings.fontSize;
  ['hud','gesture','voice','privacy'].forEach(key=>{
    $(key+'Toggle').className='toggle '+(settings[key]?'on':'');
  });
  $('glassesStatus').textContent=isOn?'已连接':'已关机';
}

function togglePower(){
  isOn=!isOn;
  updateUI();
}

function renderArModes(){
  $('arGrid').innerHTML=arModes.map(m=>`
    <div class="ar-item ${m.id===currentArMode?'active':''}" onclick="setArMode('${m.id}')">
      <div class="ar-icon">${m.icon}</div>
      <div class="ar-name">${m.name}</div>
    </div>
  `).join('');
}

function setArMode(mode){
  currentArMode=mode;
  renderArModes();
  updateArView();
}

function updateArView(){
  const now=new Date();
  $('arTime').textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  
  switch(currentArMode){
    case 'nav':
      $('arNav').textContent='前方500米左转';
      break;
    case 'translate':
      $('arNav').textContent='翻译: Hello → 你好';
      break;
    case 'fitness':
      $('arNav').textContent='心率: 72 BPM | 步数: 8432';
      break;
    case 'weather':
      $('arNav').textContent='今天: 晴 25°C | 明天: 多云 22°C';
      break;
    case 'calendar':
      $('arNav').textContent='下一个会议: 14:00 产品评审';
      break;
    case 'camera':
      $('arNav').textContent='点击拍照 | 滑动切换模式';
      break;
  }
}

function renderApps(){
  $('appGrid').innerHTML=apps.map(app=>`
    <div class="app-item" onclick="alert('打开 ${app.name} 应用')">
      <div class="app-icon">${app.icon}</div>
      <div class="app-name">${app.name}</div>
    </div>
  `).join('');
}

function renderGestures(){
  $('gestureList').innerHTML=gestures.map((g,i)=>`
    <div class="gesture-item">
      <div class="gesture-info">
        <div class="gesture-icon">${g.icon}</div>
        <div>
          <div class="gesture-name">${g.name}</div>
          <div class="gesture-action">${g.action}</div>
        </div>
      </div>
      <button onclick="removeGesture(${i})" style="background:var(--danger)">删除</button>
    </div>
  `).join('');
}

function addGesture(){
  const name=prompt('手势名称:');
  const icon=prompt('图标 (emoji):');
  const action=prompt('触发动作:');
  if(name&&icon&&action){
    gestures.push({name,icon,action});
    saveGestures();
    renderGestures();
  }
}

function removeGesture(index){
  gestures.splice(index,1);
  saveGestures();
  renderGestures();
}

function sendVoice(){
  const command=$('voiceInput').value.trim();
  if(!command)return;
  const response=processVoiceCommand(command);
  $('voiceResponse').style.display='block';
  $('voiceResponse').textContent=response;
  $('voiceInput').value='';
  setTimeout(()=>$('voiceResponse').style.display='none',3000);
}

function processVoiceCommand(cmd){
  if(cmd.includes('导航')||cmd.includes('路线')){
    setArMode('nav');
    return '已切换到导航模式';
  }else if(cmd.includes('翻译')){
    setArMode('translate');
    return '已切换到翻译模式';
  }else if(cmd.includes('天气')){
    setArMode('weather');
    return '今天天气晴朗，温度25°C';
  }else if(cmd.includes('拍照')||cmd.includes('相机')){
    setArMode('camera');
    return '相机已就绪';
  }else if(cmd.includes('时间')){
    return '现在是'+new Date().toLocaleTimeString('zh-CN');
  }else{
    return '抱歉，我没有理解您的命令';
  }
}

function toggleSetting(key){
  settings[key]=!settings[key];
  saveSettings();
  updateUI();
}

// Initialize with sample data
if(gestures.length===0){
  gestures=[
    {name:'双击',icon:'👆',action:'确认/选择'},
    {name:'滑动',icon:'👉',action:'切换页面'},
    {name:'长按',icon:'✊',action:'返回主页'},
    {name:'捏合',icon:'🤏',action:'缩放'}
  ];
  saveGestures();
}

updateUI();
renderArModes();
renderApps();
renderGestures();
updateArView();
setInterval(updateArView,1000);
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
