<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👁️ 色盲测试 - 中文版</title>
<meta name="description" content="在线色盲测试 - 快速检测红绿色盲、蓝黄色盲等色觉异常，了解你的色觉类型">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#3b82f6;--green:#238636;--red:#ef4444;--bg-primary:#f8fafc;--bg-card:#ffffff;--bg-input:#f1f5f9;--text-primary:#1e293b;--text-secondary:#64748b;--text-muted:#94a3b8;--border:#e2e8f0;--accent:#3b82f6;--accent-hover:#2563eb;--danger:#ef4444;--success:#22c55e;--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1);--radius:12px;--radius-sm:8px;--transition:.2s ease}
[data-theme="dark"]{--bg-primary:#0f172a;--bg-card:#1e293b;--bg-input:#334155;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--border:#334155;--accent:#3b82f6;--accent-hover:#60a5fa;--danger:#f87171;--success:#4ade80;--shadow-lg:0 10px 15px -3px rgba(0,0,0,.4)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.container{width:100%;max-width:480px;background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:24px 20px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:1.4rem;font-weight:700}
.theme-btn{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer;font-size:1.1rem}
.plate{width:240px;height:240px;border-radius:50%;margin:0 auto 16px;position:relative;overflow:hidden;cursor:pointer;transition:transform .3s}
.plate:hover{transform:scale(1.03)}
.progress{font-size:.85rem;color:var(--text-secondary);margin-bottom:12px;text-align:center}
.progress-bar{height:6px;background:var(--bg-input);border-radius:3px;overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;background:var(--accent);transition:width .3s;border-radius:3px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.option-btn{padding:12px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text-primary);font-size:1rem;font-weight:600;cursor:pointer;transition:all var(--transition);text-align:center}
.option-btn:hover{border-color:var(--accent);background:var(--accent-light)}
.option-btn.correct{border-color:var(--success);background:#dcfce7}
.option-btn.wrong{border-color:var(--danger);background:#fee2e2}
.result{text-align:center;padding:20px 0}
.result h2{font-size:1.5rem;margin-bottom:8px}
.result p{color:var(--text-secondary);line-height:1.8}
.result .type-badge{display:inline-block;padding:8px 20px;border-radius:20px;font-weight:700;font-size:1.1rem;margin:12px 0}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:var(--radius-sm);font-size:1rem;font-weight:600;cursor:pointer;margin-top:12px;transition:all var(--transition)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<header>
<h1>👁️ 色盲测试</h1>
<button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
</header>

<div id="quizArea">
<div class="progress" id="progressText">问题 1 / 15</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:6.67%"></div></div>
<canvas class="plate" id="plate" width="480" height="480"></canvas>
<div class="options" id="options"></div>
</div>

<div id="resultArea" class="hidden">
<div class="result" id="resultContent"></div>
<button class="btn btn-primary" onclick="restart()">重新测试</button>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
function toggleTheme(){
const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
document.documentElement.dataset.theme=t;
document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌙';
}

const tests=[
{num:'74',color:'#6b8e23',bg:'#e8a020',options:['74','17','21','27'],correct:0},
{num:'12',color:'#c0392b',bg:'#27ae60',options:['12','21','17','71'],correct:0},
{num:'8',color:'#2980b9',bg:'#8e44ad',options:['8','3','6','9'],correct:0},
{num:'26',color:'#27ae60',bg:'#c0392b',options:['26','62','29','92'],correct:0},
{num:'45',color:'#d35400',bg:'#2c3e50',options:['45','54','15','51'],correct:0},
{num:'5',color:'#16a085',bg:'#e74c3c',options:['5','3','8','6'],correct:0},
{num:'97',color:'#8e44ad',bg:'#27ae60',options:['97','79','37','73'],correct:0},
{num:'16',color:'#c0392b',bg:'#2980b9',options:['16','61','18','81'],correct:0},
{num:'73',color:'#f39c12',bg:'#8e44ad',options:['73','37','13','31'],correct:0},
{num:'42',color:'#1abc9c',bg:'#e74c3c',options:['42','24','49','94'],correct:0},
{num:'35',color:'#2c3e50',bg:'#27ae60',options:['35','53','85','58'],correct:0},
{num:'19',color:'#e74c3c',bg:'#3498db',options:['19','91','16','61'],correct:0},
{num:'68',color:'#9b59b6',bg:'#2ecc71',options:['68','86','98','89'],correct:0},
{num:'3',color:'#e67e22',bg:'#1a5276',options:['3','8','5','6'],correct:0},
{num:'29',color:'#27ae60',bg:'#c0392b',options:['29','92','39','93'],correct:0},
];

let current=0,score=0,answered=false;

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
return arr;
}

function drawPlate(t){
const canvas=document.getElementById('plate');
const ctx=canvas.getContext('2d');
ctx.clearRect(0,0,480,480);

// Background circle
ctx.beginPath();ctx.arc(240,240,240,0,Math.PI*2);
ctx.fillStyle='#999';ctx.fill();

// Generate random dots
const dots=[];const numDots=600;
for(let i=0;i<numDots;i++){
const angle=Math.random()*Math.PI*2;
const r=Math.sqrt(Math.random())*220;
const x=240+r*Math.cos(angle);
const y=240+r*Math.sin(angle);
const dotR=4+Math.random()*6;
dots.push({x,y,r:dotR});
}

// Draw background dots
dots.forEach(d=>{
ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
ctx.fillStyle=t.bg;ctx.fill();
});

// Draw number dots (larger, more prominent)
const numChars=t.num.split('');
const numDotsInner=150;
for(let i=0;i<numDotsInner;i++){
const angle=Math.random()*Math.PI*2;
const r=Math.sqrt(Math.random())*180;
const x=240+r*Math.cos(angle);
const y=240+r*Math.sin(angle);
const dotR=6+Math.random()*10;
ctx.beginPath();ctx.arc(x,y,dotR,0,Math.PI*2);
ctx.fillStyle=t.color;ctx.fill();
}

// Clip to circle
ctx.globalCompositeOperation='destination-in';
ctx.beginPath();ctx.arc(240,240,238,0,Math.PI*2);
ctx.fillStyle='#fff';ctx.fill();
ctx.globalCompositeOperation='source-over';

// Subtle border
ctx.beginPath();ctx.arc(240,240,239,0,Math.PI*2);
ctx.strokeStyle='rgba(0,0,0,.1)';ctx.lineWidth=2;ctx.stroke();
}

function renderOptions(t){
const container=document.getElementById('options');
const opts=shuffle([...t.options]);
container.innerHTML=opts.map((o,i)=>
`<button class="option-btn" onclick="answer(${i},'${o}','${t.correct===opts.indexOf(t.options[t.correct])?t.options[t.correct]:o}')">${o}</button>`
).join('');
}

function answer(idx,val){
if(answered)return;
answered=true;
const t=tests[current];
const isCorrect=val===t.num;
if(isCorrect)score++;

const btns=document.querySelectorAll('.option-btn');
btns.forEach((b,i)=>{
if(b.textContent===t.num)b.classList.add('correct');
else if(i===idx&&!isCorrect)b.classList.add('wrong');
});

setTimeout(()=>{
current++;answered=false;
if(current>=tests.length)showResult();
else renderQuestion();
},800);
}

function renderQuestion(){
document.getElementById('progressText').textContent=`问题 ${current+1} / ${tests.length}`;
document.getElementById('progressFill').style.width=((current+1)/tests.length*100)+'%';
drawPlate(tests[current]);
renderOptions(tests[current]);
}

function showResult(){
document.getElementById('quizArea').classList.add('hidden');
const pct=Math.round(score/tests.length*100);
let type,color,desc;
if(pct>=90){type='正常色觉';color='#22c55e';desc='你的色觉完全正常，能准确区分各种颜色。';}
else if(pct>=70){type='轻度色觉异常';color='#f59e0b';desc='你可能有轻微的颜色辨别困难，建议做更专业的医学检测。';}
else if(pct>=50){type='中度色觉异常';color='#f97316';desc='你可能有色觉异常，建议到医院眼科做正式检查。';}
else{type='重度色觉异常';color='#ef4444';desc='你可能有明显的色觉障碍，请务必就医检查确认。';}

document.getElementById('resultContent').innerHTML=`
<h2>测试完成！</h2>
<p>你答对了 <strong>${score}/${tests.length}</strong> 题 (${pct}%)</p>
<div class="type-badge" style="background:${color}20;color:${color}">${type}</div>
<p>${desc}</p>
<p style="font-size:.8rem;color:var(--text-muted);margin-top:16px">注：本测试仅供参考，不构成医学诊断。</p>
`;
document.getElementById('resultArea').classList.remove('hidden');
}

function restart(){
current=0;score=0;answered=false;
document.getElementById('quizArea').classList.remove('hidden');
document.getElementById('resultArea').classList.add('hidden');
renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
