<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC收集游戏</title>
<meta name="description" content="NFC近场通讯游戏，利用手机NFC功能互动">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--success:#22c55e;--error:#ef4444;--gold:#f59e0b;--purple:#8b5cf6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px}
h1{font-size:1.5rem;margin-bottom:8px;color:var(--accent)}
.info-bar{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.info-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:0.85rem}
.info-item span{color:var(--accent);font-weight:bold}
.mode-tabs{display:flex;gap:6px;margin-bottom:10px}
.mode-tab{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:0.85rem}
.mode-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.scan-area{width:100%;max-width:400px;background:var(--card);border:2px dashed var(--border);border-radius:16px;padding:30px;text-align:center;margin-bottom:10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 0.3s}
.scan-area.scanning{border-color:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.scan-icon{font-size:3rem;margin-bottom:10px}
.collection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;width:100%;max-width:500px;margin-bottom:10px}
.item-card{aspect-ratio:1;background:var(--card);border:2px solid var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:0.75rem;transition:all 0.2s;cursor:pointer;position:relative}
.item-card:hover{transform:scale(1.05);border-color:var(--accent)}
.item-card .icon{font-size:1.8rem;margin-bottom:2px}
.item-card.common{border-color:#4a5568}
.item-card.rare{border-color:var(--purple);background:rgba(139,92,246,0.1)}
.item-card.legendary{border-color:var(--gold);background:rgba(245,158,11,0.1);box-shadow:0 0 15px rgba(245,158,11,0.2)}
.item-card.locked{opacity:0.3}
.item-card .rarity{font-size:0.6rem;padding:1px 4px;border-radius:4px}
.item-card.common .rarity{background:#4a5568}
.item-card.rare .rarity{background:var(--purple);color:#fff}
.item-card.legendary .rarity{background:var(--gold);color:#000}
.achievement{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;width:100%;max-width:500px;display:flex;align-items:center;gap:10px}
.achievement.unlocked{border-color:var(--success);background:rgba(34,197,94,0.1)}
.achievement .ach-icon{font-size:1.5rem}
.achievement .ach-text{flex:1;font-size:0.85rem}
.achievement .ach-check{color:var(--success)}
.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:0.9rem;cursor:pointer;font-family:inherit}
button:hover{opacity:0.85}
.msg{font-size:0.9rem;padding:6px;text-align:center;color:var(--accent)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="NFC收集游戏">
  <meta property="og:description" content="NFC近场通讯游戏，利用手机NFC功能互动">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/nfc-game/">
</head>
<body>
<h1>📱 NFC收集游戏</h1>
<div class="info-bar">
  <div class="info-item">🏆 分数: <span id="score">0</span></div>
  <div class="info-item">📦 收集: <span id="collected">0</span>/<span id="total">20</span></div>
  <div class="info-item">🏅 成就: <span id="achCount">0</span></div>
</div>
<div class="mode-tabs">
  <div class="mode-tab active" onclick="setMode('scan')">📡 扫描</div>
  <div class="mode-tab" onclick="setMode('collection')">📦 收藏</div>
  <div class="mode-tab" onclick="setMode('achievements')">🏅 成就</div>
</div>
<div id="content"></div>
<div class="buttons">
  <button onclick="scanItem()">📱 扫描获取</button>
  <button onclick="clickCollect()">🖱 点击收集</button>
  <button onclick="resetGame()">🔄 重置</button>
</div>
<div class="msg" id="msg">点击"扫描"或"点击收集"获取物品</div>
<script>
const ITEMS=[
  {id:1,name:'小龙',icon:'🐉',rarity:'legendary',pts:500},
  {id:2,name:'凤凰',icon:'🔥',rarity:'legendary',pts:500},
  {id:3,name:'独角兽',icon:'🦄',rarity:'legendary',pts:500},
  {id:4,name:'虎',icon:'🐯',rarity:'rare',pts:200},
  {id:5,name:'狼',icon:'🐺',rarity:'rare',pts:200},
  {id:6,name:'鹰',icon:'🦅',rarity:'rare',pts:200},
  {id:7,name:'狐狸',icon:'🦊',rarity:'rare',pts:200},
  {id:8,name:'猫',icon:'🐱',rarity:'common',pts:50},
  {id:9,name:'狗',icon:'🐶',rarity:'common',pts:50},
  {id:10,name:'兔',icon:'🐰',rarity:'common',pts:50},
  {id:11,name:'熊',icon:'🐻',rarity:'common',pts:50},
  {id:12,name:'熊猫',icon:'🐼',rarity:'rare',pts:200},
  {id:13,name:'剑',icon:'⚔️',rarity:'rare',pts:200},
  {id:14,name:'盾',icon:'🛡️',rarity:'common',pts:50},
  {id:15,name:'皇冠',icon:'👑',rarity:'legendary',pts:500},
  {id:16,name:'宝石',icon:'💎',rarity:'rare',pts:200},
  {id:17,name:'药水',icon:'🧪',rarity:'common',pts:50},
  {id:18,name:'卷轴',icon:'📜',rarity:'common',pts:50},
  {id:19,name:'钥匙',icon:'🔑',rarity:'common',pts:50},
  {id:20,name:'宝箱',icon:'📦',rarity:'rare',pts:200}
];
const ACHIEVEMENTS=[
  {id:'first',name:'初次扫描',desc:'获取第一个物品',icon:'🎯',check:s=>s.total>=1},
  {id:'five',name:'收藏新手',desc:'收集5个物品',icon:'📦',check:s=>s.total>=5},
  {id:'ten',name:'收藏达人',desc:'收集10个物品',icon:'🏅',check:s=>s.total>=10},
  {id:'rare',name:'稀有发现',desc:'获得一个稀有物品',icon:'💜',check:s=>s.rare},
  {id:'legend',name:'传说之光',desc:'获得一个传说物品',icon:'⭐',check:s=>s.legendary},
  {id:'all',name:'全收集',desc:'收集所有20个物品',icon:'🏆',check:s=>s.total>=20}
];
let collection=new Set(),score=0,mode='scan';
let hasNfc='NDEFReader' in window;

function load(){try{const d=JSON.parse(localStorage.getItem('nfc_game'));if(d){collection=new Set(d.collection);score=d.score}}catch(e){}}
function save(){localStorage.setItem('nfc_game',JSON.stringify({collection:[...collection],score}))}

function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.mode-tab').forEach(t=>{
    if(t.textContent.includes(m==='scan'?'扫描':m==='collection'?'收藏':'成就'))t.classList.add('active');
  });
  renderContent();
}

function renderContent(){
  const el=document.getElementById('content');
  if(mode==='scan')el.innerHTML=`
    <div class="scan-area" id="scanArea">
      <div class="scan-icon">📡</div>
      <div style="font-size:1rem;margin-bottom:5px">NFC扫描站</div>
      <div style="font-size:0.8rem;color:var(--text);opacity:0.6">${hasNfc?'支持NFC扫描':'点击按钮收集物品'}</div>
    </div>`;
  else if(mode==='collection')renderCollection();
  else renderAchievements();
  document.getElementById('collected').textContent=collection.size;
  document.getElementById('score').textContent=score;
  updateAchCount();
}

function renderCollection(){
  const el=document.getElementById('content');
  el.innerHTML='<div class="collection-grid" id="collGrid"></div>';
  const grid=document.getElementById('collGrid');
  ITEMS.forEach(item=>{
    const owned=collection.has(item.id);
    const card=document.createElement('div');
    card.className=`item-card ${item.rarity}${owned?'':' locked'}`;
    card.innerHTML=`<div class="icon">${item.icon}</div><div>${item.name}</div><div class="rarity">${item.rarity==='legendary'?'传说':item.rarity==='rare'?'稀有':'普通'}</div>`;
    grid.appendChild(card);
  });
}

function renderAchievements(){
  const el=document.getElementById('content');
  el.innerHTML='';
  const stats=getStats();
  ACHIEVEMENTS.forEach(a=>{
    const unlocked=a.check(stats);
    const div=document.createElement('div');
    div.className='achievement'+(unlocked?' unlocked':'');
    div.innerHTML=`<div class="ach-icon">${a.icon}</div><div class="ach-text"><div><strong>${a.name}</strong></div><div style="opacity:0.7">${a.desc}</div></div><div class="ach-check">${unlocked?'✅':'🔒'}</div>`;
    el.appendChild(div);
  });
}

function getStats(){
  let rare=false,legendary=false;
  collection.forEach(id=>{const item=ITEMS.find(i=>i.id===id);if(item){if(item.rarity==='rare')rare=true;if(item.rarity==='legendary')legendary=true}});
  return{total:collection.size,rare,legendary};
}

function updateAchCount(){
  const stats=getStats();
  const count=ACHIEVEMENTS.filter(a=>a.check(stats)).length;
  document.getElementById('achCount').textContent=count;
  document.getElementById('total').textContent=ITEMS.length;
}

function getRandomItem(){
  const rand=Math.random();
  let pool;
  if(rand<0.05)pool=ITEMS.filter(i=>i.rarity==='legendary');
  else if(rand<0.25)pool=ITEMS.filter(i=>i.rarity==='rare');
  else pool=ITEMS.filter(i=>i.rarity==='common');
  return pool[Math.floor(Math.random()*pool.length)];
}

function scanItem(){
  const scan=document.getElementById('scanArea');
  if(scan)scan.classList.add('scanning');
  setTimeout(()=>{
    if(scan)scan.classList.remove('scanning');
    const item=getRandomItem();
    const isNew=!collection.has(item.id);
    collection.add(item.id);score+=item.pts;
    save();renderContent();
    document.getElementById('msg').textContent=`获得 ${item.icon} ${item.name} (${item.rarity}) ${isNew?'🆕 新收藏!':'+'+item.pts+'分'}`;
  },1500);
}

function clickCollect(){
  const item=getRandomItem();
  const isNew=!collection.has(item.id);
  collection.add(item.id);score+=item.pts;
  save();renderContent();
  document.getElementById('msg').textContent=`获得 ${item.icon} ${item.name} (${item.rarity}) ${isNew?'🆕 新收藏!':'+'+item.pts+'分'}`;
}

function resetGame(){
  collection=new Set();score=0;
  localStorage.removeItem('nfc_game');
  renderContent();document.getElementById('msg').textContent='已重置';
}

load();renderContent();
</script>
</body>
</html>
