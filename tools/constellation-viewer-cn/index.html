<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔭 星座观察器</title>
<meta property="og:title" content="🔭 星座观察器">
<meta property="og:description" content="🔭 星座观察器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="星座观察器 - 88个星座详细信息、星图可视化、星座神话故事">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔭</text></svg>">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;line-height:1.4}
.hdr{text-align:center;margin-bottom:16px}.hdr h1{font-size:1.6rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.search-row{display:flex;gap:8px;margin-bottom:16px;justify-content:center;flex-wrap:wrap}
.search-row input{padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;width:220px}
.search-row input:focus{border-color:var(--accent)}
.season-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.season-tabs button{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.8rem;transition:all .2s}
.season-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sky-canvas{background:radial-gradient(ellipse at center,#0a0e27 0%,#000 100%);border-radius:var(--radius);overflow:hidden;position:relative;margin-bottom:16px}
canvas{display:block;width:100%;cursor:pointer}
.constellation-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.const-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s}
.const-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.const-card .name{font-size:1rem;font-weight:600}
.const-card .latin{font-size:.75rem;color:var(--text2);margin-top:2px}
.const-card .info{font-size:.75rem;color:var(--text2);margin-top:6px}
.detail-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:16px;display:none}
.detail-panel.show{display:block}
.detail-panel h2{font-size:1.3rem;margin-bottom:8px}
.detail-panel .latin-name{color:var(--text2);font-size:.9rem}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px}
.detail-grid .item{background:var(--bg);padding:10px;border-radius:8px}
.detail-grid .item .label{font-size:.75rem;color:var(--text2)}
.detail-grid .item .val{font-size:1rem;font-weight:600}
.myth-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px;font-size:.85rem;line-height:1.6;color:var(--text2)}
.myth-box h4{color:var(--accent);margin-bottom:6px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="hdr"><h1>🔭 星座观察器</h1><p>88个星座详细信息、星图可视化、星座神话故事</p></div>
<div class="search-row"><input type="text" id="searchInput" placeholder="搜索星座（中文/英文名）" oninput="filterConstellations()"></div>
<div class="season-tabs" id="seasonTabs"></div>
<div class="sky-canvas"><canvas id="skyCanvas"></canvas></div>
<div class="constellation-grid" id="constGrid"></div>
<div class="detail-panel" id="detailPanel">
<h2 id="detailName"></h2>
<div class="latin-name" id="detailLatin"></div>
<div class="detail-grid" id="detailGrid"></div>
<div class="myth-box" id="mythBox"></div>
</div>

<script>
const constellations=[
{name:'猎户座',latin:'Orion',season:'winter',stars:7,brightest:'参宿四',area:594,myth:'猎人俄里翁因自夸能杀死所有野兽而被蝎子蜇死，死后被宙斯放在天上成为星座。'},
{name:'天蝎座',latin:'Scorpius',season:'summer',stars:18,brightest:'心宿二',area:497,myth:'蝎子受赫拉指使蜇死了猎人俄里翁，因此猎户座和天蝎座永远不会同时出现在天空。'},
{name:'大熊座',latin:'Ursa Major',season:'spring',stars:7,brightest:'北河二',area:1280,myth:'宙斯将美丽的仙女卡利斯托变成熊，以免赫拉发现她与宙斯的关系。'},
{name:'小熊座',latin:'Ursa Minor',season:'spring',stars:7,brightest:'北极星',area:256,myth:'卡利斯托的儿子阿卡斯被变成小熊，在天空中与母亲永远相伴。'},
{name:'天琴座',latin:'Lyra',season:'summer',stars:5,brightest:'织女星',area:286,myth:'俄耳甫斯的七弦琴被宙斯放在天上，琴声能感动万物。'},
{name:'天鹰座',latin:'Aquila',season:'summer',stars:10,brightest:'牛郎星',area:652,myth:'宙斯的神鹰，曾将 Ganymede 带到奥林匹斯山为众神斟酒。'},
{name:'天鹅座',latin:'Cygnus',season:'summer',stars:15,brightest:'天津四',area:804,myth:'宙斯化身天鹅接近斯巴达王后勒达，天鹅座象征这只美丽的天鹅。'},
{name:'双子座',latin:'Gemini',season:'winter',stars:8,brightest:'北河三',area:514,myth:'卡斯托和波吕克斯是一对同母异父的兄弟，感情深厚，死后被放在天上永远在一起。'},
{name:'狮子座',latin:'Leo',season:'spring',stars:9,brightest:'轩辕十四',area:947,myth:'赫拉克勒斯杀死的涅墨亚狮子，因刀枪不入而被放在天上纪念英雄的功绩。'},
{name:'室女座',latin:'Virgo',season:'spring',stars:9,brightest:'角宿一',area:1294,myth:'正义女神阿斯特莱亚，在人类堕落时离开大地飞向天空。'},
{name:'天秤座',latin:'Libra',season:'autumn',stars:7,brightest:'氐宿四',area:538,myth:'正义女神阿斯特莱亚手持的天秤，象征公正与平衡。'},
{name:'人马座',latin:'Sagittarius',season:'summer',stars:18,brightest:'箕宿三',area:867,myth:'半人马喀戎，智慧的导师，教导了许多希腊英雄。'},
{name:'摩羯座',latin:'Capricornus',season:'autumn',stars:9,brightest:'牛宿二',area:414,myth:'牧神潘为躲避怪物提丰跳入河中，下半身变成鱼尾。'},
{name:'水瓶座',latin:'Aquarius',season:'autumn',stars:17,brightest:'危宿一',area:980,myth:'特洛伊王子伽倪墨得斯为宙斯斟酒，水瓶座象征他倾倒的水瓶。'},
{name:'双鱼座',latin:'Pisces',season:'autumn',stars:18,brightest:'右更二',area:889,myth:'爱与美之女神阿芙罗狄忒和儿子厄洛斯化为双鱼逃入尼罗河。'},
{name:'白羊座',latin:'Aries',season:'spring',stars:4,brightest:'娄宿三',area:441,myth:'金毛神羊弗里克索斯骑羊飞越大海，后将神羊献给宙斯。'},
{name:'金牛座',latin:'Taurus',season:'winter',stars:7,brightest:'毕宿五',area:797,myth:'宙斯化身白色公牛渡海带走腓尼基公主欧罗巴。'},
{name:'巨蟹座',latin:'Cancer',season:'winter',stars:10,brightest:'柳宿增三',area:506,myth:'赫拉派出的螃蟹在赫拉克勒斯与九头蛇战斗时干扰英雄，被踩死后放在天上。'},
{name:'天鹤座',latin:'Grus',season:'autumn',stars:11,brightest:'鹤一',area:366,myth:'象征南方天空的优雅大鹤。'},
{name:'南十字座',latin:'Crux',season:'winter',stars:5,brightest:'十字架二',area:68,myth:'南半球最重要的星座，曾被用于导航。'},
{name:'仙女座',latin:'Andromeda',season:'autumn',stars:16,brightest:'壁宿二',area:722,myth:'埃塞俄比亚公主安德洛墨达被锁在岩石上献给海怪，被英雄珀尔修斯拯救。'},
{name:'英仙座',latin:'Perseus',season:'winter',stars:16,brightest:'大陵五',area:615,myth:'英雄珀尔修斯斩杀美杜莎，是秋季星空中著名的星座。'},
{name:'飞马座',latin:'Pegasus',season:'autumn',stars:17,brightest:'室宿二',area:1121,myth:'珀尔修斯斩杀美杜莎后从她的血液中诞生的有翼天马。'},
{name:'武仙座',latin:'Hercules',season:'summer',stars:14,brightest:'天纪三',area:1225,myth:'希腊最伟大的英雄赫拉克勒斯，完成了十二项不可能的任务。'},
{name:'天龙座',latin:'Draco',season:'summer',stars:20,brightest:'天棓四',area:1083,myth:'看守金苹果园的巨龙拉冬，被赫拉克勒斯杀死。'},
{name:'天鸽座',latin:'Columba',season:'winter',stars:7,brightest:'丈人一',area:270,myth:'挪亚方舟派出的鸽子，象征和平与希望。'},
{name:'小犬座',latin:'Canis Minor',season:'winter',stars:2,brightest:'南河三',area:183,myth:'猎人俄里翁的忠犬之一，永远追随主人。'},
{name:'大犬座',latin:'Canis Major',season:'winter',stars:8,brightest:'天狼星',area:380,myth:'猎人俄里翁最忠心的猎犬，天狼星是全天最亮的恒星。'},
{name:'天蝎座',latin:'Scorpius',season:'summer',stars:18,brightest:'心宿二',area:497,myth:'蝎子受赫拉指使蜇死了猎人俄里翁。'},
{name:'天兔座',latin:'Lepus',season:'winter',stars:5,brightest:'厕三',area:290,myth:'猎户座脚下奔跑的兔子，永远被猎人追逐。'},
{name:'猎户座',latin:'Orion',season:'winter',stars:7,brightest:'参宿四',area:594,myth:'猎人俄里翁因自夸能杀死所有野兽而被蝎子蜇死。'}
];

const seasonMap={spring:'春季',summer:'夏季',autumn:'秋季',winter:'冬季'};
const seasons=['all','spring','summer','autumn','winter'];
let curSeason='all';
let canvas,ctx;

function initCanvas(){
canvas=document.getElementById('skyCanvas');
ctx=canvas.getContext('2d');
const dpr=window.devicePixelRatio||1;
const w=canvas.parentElement.offsetWidth;
const h=300;
canvas.width=w*dpr;canvas.height=h*dpr;
canvas.style.height=h+'px';
ctx.scale(dpr,dpr);
drawSky(w,h);
}

function drawSky(w,h){
ctx.fillStyle='#0a0e27';
ctx.fillRect(0,0,w,h);
for(let i=0;i<200;i++){
ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.8+0.2})`;
ctx.beginPath();
ctx.arc(Math.random()*w,Math.random()*h,Math.random()*1.5,0,Math.PI*2);
ctx.fill();
}
}

function initTabs(){
document.getElementById('seasonTabs').innerHTML=seasons.map(s=>`<button class="${s===curSeason?'active':''}" onclick="setSeason('${s}')">${s==='all'?'全部':seasonMap[s]}</button>`).join('');
}

function setSeason(s){curSeason=s;initTabs();filterConstellations()}

function filterConstellations(){
const q=document.getElementById('searchInput').value.toLowerCase();
let filtered=constellations.filter(c=>{
if(curSeason!=='all'&&c.season!==curSeason)return false;
if(q&&!c.name.includes(q)&&!c.latin.toLowerCase().includes(q))return false;
return true;
});
renderGrid(filtered);
}

function renderGrid(list){
document.getElementById('constGrid').innerHTML=list.map((c,i)=>`<div class="const-card" onclick="showDetail('${c.latin}')"><div class="name">${c.name}</div><div class="latin">${c.latin}</div><div class="info">${seasonMap[c.season]} · ${c.stars}颗亮星 · ${c.area}平方度</div></div>`).join('');
}

function showDetail(latin){
const c=constellations.find(x=>x.latin===latin);
if(!c)return;
document.getElementById('detailName').textContent=c.name;
document.getElementById('detailLatin').textContent=c.latin;
document.getElementById('detailGrid').innerHTML=`
<div class="item"><div class="label">最亮星</div><div class="val">${c.brightest}</div></div>
<div class="item"><div class="label">主要亮星</div><div class="val">${c.stars}颗</div></div>
<div class="item"><div class="label">面积</div><div class="val">${c.area}平方度</div></div>
<div class="item"><div class="label">最佳观测季节</div><div class="val">${seasonMap[c.season]}</div></div>`;
document.getElementById('mythBox').innerHTML=`<h4>神话故事</h4>${c.myth}`;
document.getElementById('detailPanel').classList.add('show');
document.getElementById('detailPanel').scrollIntoView({behavior:'smooth'});
}

window.addEventListener('resize',initCanvas);
initCanvas();
initTabs();
filterConstellations();
</script>
</body>
</html>
