<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票组合追踪器</title>
<meta name="description" content="股票投资组合追踪器，监控持仓收益">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vhscroll-behavior:smooth;padding:16px;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-red{background:var(--red)}
.btn-green{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.result-big{text-align:center;padding:18px}
.result-big .label{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.result-big .value{font-size:2rem;font-weight:700}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.stat-card{text-align:center;padding:14px;background:var(--bg);border-radius:var(--radius)}
.stat-card .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:1.1rem;font-weight:700}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.portfolio-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
.portfolio-table th,.portfolio-table td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}
.portfolio-table th{color:var(--text2);font-weight:500;background:var(--bg);text-align:center}
.portfolio-table td{text-align:center}
.portfolio-table td:first-child{text-align:left;font-weight:600}
.portfolio-table tr:last-child td{border-bottom:none}
.portfolio-table .positive{color:var(--green)}
.portfolio-table .negative{color:var(--red)}
.portfolio-table input{width:80px;text-align:right;padding:2px 4px;font-size:.8rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)}
.empty-state{text-align:center;padding:40px;color:var(--text2);font-size:.9rem}
.donut-chart{width:180px;height:180px;border-radius:50%;margin:0 auto 12px;position:relative}
.donut-chart::after{content:'';position:absolute;top:35px;left:35px;width:110px;height:110px;border-radius:50%;background:var(--card)}
.donut-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;text-align:center}
.donut-label .big{font-size:1.2rem;font-weight:700}
.donut-label .small{font-size:.7rem;color:var(--text2)}
.donut-legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.donut-legend span{font-size:.75rem;display:flex;align-items:center;gap:4px}
.donut-legend span::before{content:'';width:10px;height:10px;border-radius:2px;display:inline-block}
.remove-btn{background:var(--red);color:#fff;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:.75rem}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media(max-width:640px){.form-row{flex-direction:column}.grid-3{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="股票组合追踪器">
<meta property="og:description" content="股票投资组合追踪器，监控持仓收益">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/stock-portfolio-tracker/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📊 股票组合追踪器</h1>
    <p>监控持仓收益</p>
  </header>

  <div class="card">
    <div class="section-title">添加持仓</div>
    <div class="form-row">
      <div class="group"><label>股票代码</label><input type="text" id="ticker" placeholder="600519"></div>
      <div class="group"><label>股票名称</label><input type="text" id="stockName" placeholder="贵州茅台"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>买入价格</label><input type="number" id="buyPrice" value="1500" min="0" step="any"></div>
      <div class="group"><label>持有数量</label><input type="number" id="shares" value="100" min="1" step="1"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>当前价格</label><input type="number" id="currentPrice" value="1600" min="0" step="any"></div>
      <div class="group"><label>买入日期</label><input type="date" id="buyDate"></div>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="addStock()">+ 添加</button>
      <button class="btn btn-outline" onclick="loadDemo()">加载示例</button>
      <button class="btn btn-red" onclick="clearAll()">清空</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">📊 组合概览</div>
    <div class="result-big"><div class="label">总盈亏</div><div class="value" id="totalPL">¥0</div></div>
    <div class="grid-3" id="statGrid"></div>
  </div>

  <div class="card" id="donutCard" style="display:none">
    <div class="section-title">📊 持仓分布</div>
    <div class="donut-chart" id="donutChart"></div>
    <div class="donut-legend" id="donutLegend"></div>
  </div>

  <div class="card">
    <div class="section-title">📋 持仓明细</div>
    <div id="holdings"></div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});

const colors=['#3b82f6','#238636','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316'];
$('buyDate').value=new Date().toISOString().slice(0,10);

let stocks=JSON.parse(localStorage.getItem('stockPortfolio')||'[]');

function save(){localStorage.setItem('stockPortfolio',JSON.stringify(stocks));}

window.addStock=function(){
  const s={
    id:Date.now(),
    ticker:$('ticker').value||'UNKNOWN',
    name:$('stockName').value||$('ticker').value,
    buyPrice:+$('buyPrice').value||0,
    shares:+$('shares').value||1,
    currentPrice:+$('currentPrice').value||0,
    buyDate:$('buyDate').value
  };
  stocks.push(s);
  save();render();
  $('ticker').value='';$('stockName').value='';$('shares').value=100;
};

window.loadDemo=function(){
  stocks=[
    {id:1,ticker:'600519',name:'贵州茅台',buyPrice:1500,shares:100,currentPrice:1680,buyDate:'2024-01-15'},
    {id:2,ticker:'000858',name:'五粮液',buyPrice:120,shares:500,currentPrice:145,buyDate:'2024-03-20'},
    {id:3,ticker:'300750',name:'宁德时代',buyPrice:180,shares:300,currentPrice:210,buyDate:'2024-06-10'},
    {id:4,ticker:'601318',name:'中国平安',buyPrice:45,shares:1000,currentPrice:52,buyDate:'2024-02-28'},
    {id:5,ticker:'002594',name:'比亚迪',buyPrice:250,shares:200,currentPrice:280,buyDate:'2024-05-01'}
  ];
  save();render();
};

window.clearAll=function(){stocks=[];save();render();};

window.updatePrice=function(id,val){
  const s=stocks.find(x=>x.id===id);
  if(s)s.currentPrice=+val||0;
  save();render();
};

window.removeStock=function(id){
  stocks=stocks.filter(x=>x.id!==id);
  save();render();
};

function render(){
  if(stocks.length===0){
    $('holdings').innerHTML='<div class="empty-state">暂无持仓，点击上方"加载示例"快速体验</div>';
    $('statGrid').innerHTML='';$('totalPL').textContent='¥0';
    $('totalPL').style.color='var(--text2)';
    $('donutCard').style.display='none';
    return;
  }

  let totalCost=0,totalValue=0;
  const enriched=stocks.map(s=>{
    const cost=s.buyPrice*s.shares;
    const value=s.currentPrice*s.shares;
    const pl=value-cost;
    const plPct=cost>0?(pl/cost*100):0;
    totalCost+=cost;totalValue+=value;
    return{...s,cost,value,pl,plPct};
  });

  const totalPL=totalValue-totalCost;
  const totalPLPct=totalCost>0?(totalPL/totalCost*100):0;

  $('totalPL').textContent='¥'+fmt(totalPL);
  $('totalPL').style.color=totalPL>=0?'var(--green)':'var(--red)';

  $('statGrid').innerHTML=`
    <div class="stat-card"><div class="label">总投入</div><div class="value" style="color:var(--blue)">¥${fmt(totalCost)}</div></div>
    <div class="stat-card"><div class="label">当前总值</div><div class="value" style="color:var(--green)">¥${fmt(totalValue)}</div></div>
    <div class="stat-card"><div class="label">盈亏比例</div><div class="value" style="color:${totalPL>=0?'var(--green)':'var(--red)'}">${totalPLPct.toFixed(2)}%</div></div>
  `;

  const donutGrad=enriched.map((s,i)=>{
    const pct=s.value/totalValue*100;
    const start=enriched.slice(0,i).reduce((a,x)=>a+x.value/totalValue*100,0);
    return `${colors[i%colors.length]} ${start}% ${start+pct}%`;
  }).join(',');
  $('donutCard').style.display='';
  $('donutChart').style.background=`conic-gradient(${donutGrad})`;
  $('donutChart').innerHTML=`<div class="donut-label"><div class="big">${stocks.length}</div><div class="small">只股票</div></div>`;
  $('donutLegend').innerHTML=enriched.map((s,i)=>`<span style="--c:${colors[i%colors.length]}"><span style="background:${colors[i%colors.length]};width:10px;height:10px;border-radius:2px;display:inline-block"></span>${s.name} ${(s.value/totalValue*100).toFixed(1)}%</span>`).join('');

  let rows=enriched.map(s=>`<tr>
    <td>${s.ticker}<br><span style="font-size:.7rem;color:var(--text2)">${s.name}</span></td>
    <td>¥${fmt(s.buyPrice)}</td>
    <td><input type="number" value="${s.currentPrice}" min="0" onchange="updatePrice(${s.id},this.value)" style="width:80px"></td>
    <td>${s.shares}</td>
    <td>¥${fmt(s.value)}</td>
    <td class="${s.pl>=0?'positive':'negative'}">¥${fmt(s.pl)}</td>
    <td class="${s.pl>=0?'positive':'negative'}">${s.plPct.toFixed(2)}%</td>
    <td><button class="remove-btn" onclick="removeStock(${s.id})">删除</button></td>
  </tr>`).join('');

  $('holdings').innerHTML=`<div style="overflow-x:auto"><table class="portfolio-table">
    <thead><tr><th>股票</th><th>买入价</th><th>现价</th><th>数量</th><th>市值</th><th>盈亏</th><th>盈亏%</th><th>操作</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
