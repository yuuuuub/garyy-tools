<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文本大小写转换</title><meta name="description" content="文本大小写转换 - 在线转换大小写、首字母大写、句首大写等"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:150px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;margin:4px}.btn:hover{opacity:.85}.btn-green{background:var(--green)}.btn-group{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.85rem;white-space:pre-wrap;word-break:break-all;min-height:80px;max-height:300px;overflow-y:auto;margin-top:12px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.stats{font-size:.8rem;color:var(--text2);margin-top:8px}</style>
<meta property="og:title" content="文本大小写转换">
<meta property="og:description" content="文本大小写转换 - 在线转换大小写、首字母大写、句首大写等">
<meta property="og:image" content="/og-default.png">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔠 文本大小写转换</h1><p class="sub">在线转换大小写、首字母大写、句首大写、交替大小写等</p>
<div class="card">
<textarea id="inputText" placeholder="在此输入文本...">Hello World! this is a SAMPLE text. what can we do with it?</textarea>
<div class="btn-group">
<button class="btn" onclick="convert('upper')">全部大写</button>
<button class="btn" onclick="convert('lower')">全部小写</button>
<button class="btn" onclick="convert('title')">标题大小写</button>
<button class="btn" onclick="convert('sentence')">句首大写</button>
<button class="btn" onclick="convert('capitalize')">每词首字母大写</button>
<button class="btn" onclick="convert('toggle')">交替大小写</button>
<button class="btn" onclick="convert('inverse')">反转大小写</button>
<button class="btn" onclick="convert('snake')">snake_case</button>
<button class="btn" onclick="convert('camel')">camelCase</button>
<button class="btn" onclick="convert('pascal')">PascalCase</button>
<button class="btn" onclick="convert('kebab')">kebab-case</button>
<button class="btn" onclick="convert('constant')">CONSTANT_CASE</button>
<button class="btn btn-green" onclick="convert('copy')">复制结果</button>
</div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var lastResult='';
function convert(type){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='';return;}
  var result='';
  switch(type){
    case'upper':result=text.toUpperCase();break;
    case'lower':result=text.toLowerCase();break;
    case'title':result=text.replace(/\w\S*/g,function(w){return w.charAt(0).toUpperCase()+w.substr(1).toLowerCase();});break;
    case'sentence':result=text.toLowerCase().replace(/(^\s*|[.!?]\s+)(\w)/g,function(m,p,c){return p+c.toUpperCase();});break;
    case'capitalize':result=text.toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase();});break;
    case'toggle':result=text.split('').map(function(c,i){return i%2===0?c.toUpperCase():c.toLowerCase();}).join('');break;
    case'inverse':result=text.split('').map(function(c){return c===c.toUpperCase()?c.toLowerCase():c.toUpperCase();}).join('');break;
    case'snake':result=text.replace(/([A-Z])/g,'_$1').replace(/[\s\-\.]+/g,'_').replace(/^_/,'').toLowerCase();break;
    case'camel':result=text.replace(/[\s\-\.]+([a-z])/g,function(_,c){return c.toUpperCase();}).replace(/^./,function(c){return c.toLowerCase();});break;
    case'pascal':result=text.replace(/[\s\-\.]+([a-z])/g,function(_,c){return c.toUpperCase();}).replace(/^./,function(c){return c.toUpperCase();});break;
    case'kebab':result=text.replace(/([A-Z])/g,'-$1').replace(/[\s_\.]+/g,'-').replace(/^-/,'').toLowerCase();break;
    case'constant':result=text.replace(/([A-Z])/g,'_$1').replace(/[\s\-\.]+/g,'_').replace(/^_/,'').toUpperCase();break;
    case'copy':navigator.clipboard.writeText(lastResult).then(function(){alert('已复制');});return;
  }
  lastResult=result;
  var words=result.split(/\s+/).length;
  var chars=result.length;
  r.innerHTML='<div class="card"><div class="result-block">'+escapeHtml(result)+'</div><div class="stats">字符数: '+chars+' | 单词数: '+words+'</div><button class="copy-btn" onclick="navigator.clipboard.writeText(lastResult).then(function(){alert(\'已复制\');})">复制结果</button></div>';
}
function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
convert('upper');
</script></body></html>
