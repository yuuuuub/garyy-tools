<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="反馈表单构建器 - 创建精美的客户反馈收集表单，支持多种反馈类型">
    <meta name="robots" content="index, follow">
    <title>反馈表单构建器</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="i18n.js" defer></script>
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #0ea5e9; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; --hover-color: #f1f3f5; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #38bdf8; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; --hover-color: #3a3a3a; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        textarea { resize: vertical; min-height: 60px; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 8px; margin-bottom: 8px; }
        button:hover { opacity: 0.9; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-danger { background-color: var(--danger-color); }
        .btn-success { background-color: var(--success-color); }
        .btn-secondary { background-color: var(--secondary-color); }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); }
        .tab { padding: 10px 20px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; color: var(--secondary-color); }
        .tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .fb-item { border: 1px solid var(--border-color); border-radius: 6px; padding: 14px; margin-bottom: 10px; background: var(--bg-color); }
        .fb-item h4 { margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        .fb-preview { max-width: 600px; margin: 0 auto; padding: 30px; }
        .fb-preview .fb-title { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .fb-preview .fb-desc { color: var(--secondary-color); margin-bottom: 24px; }
        .fb-preview .fb-field { margin-bottom: 20px; }
        .fb-preview .fb-label { font-weight: bold; margin-bottom: 6px; }
        .fb-preview .fb-required { color: var(--danger-color); }
        .emoji-rating { display: flex; gap: 12px; margin-top: 8px; }
        .emoji-rating span { font-size: 32px; cursor: pointer; opacity: 0.4; transition: all 0.2s; padding: 4px; }
        .emoji-rating span:hover, .emoji-rating span.active { opacity: 1; transform: scale(1.2); }
        .csat-scale { display: flex; gap: 6px; margin-top: 8px; }
        .csat-scale span { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .csat-scale span:hover { border-color: var(--primary-color); background: var(--hover-color); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>反馈表单构建器</h1>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('build')">构建表单</div>
            <div class="tab" onclick="switchTab('preview')">预览</div>
            <div class="tab" onclick="switchTab('responses')">反馈数据</div>
        </div>

        <div id="tab-build" class="tab-content active">
            <div class="card">
                <div class="grid-2">
                    <div class="form-group"><label>表单标题</label><input type="text" id="fbTitle" value="客户反馈表"></div>
                    <div class="form-group"><label>公司/产品名</label><input type="text" id="fbCompany" placeholder="可选"></div>
                </div>
                <div class="form-group"><label>表单说明</label><textarea id="fbDesc" rows="2">请花几分钟时间告诉我们您的使用体验，您的反馈对我们非常重要。</textarea></div>
            </div>

            <div class="card">
                <h3>添加字段</h3>
                <div class="grid-2">
                    <div class="form-group"><label>字段类型</label>
                        <select id="fbFieldType">
                            <option value="text">文本输入</option>
                            <option value="textarea">多行文本</option>
                            <option value="email">邮箱</option>
                            <option value="emoji">表情评分</option>
                            <option value="csat">满意度评分(1-5)</option>
                            <option value="nps">NPS推荐度(0-10)</option>
                            <option value="single">单选</option>
                            <option value="multi">多选</option>
                        </select>
                    </div>
                    <div class="form-group"><label>标签</label><input type="text" id="fbLabel" placeholder="如：您的姓名"></div>
                </div>
                <div class="form-group"><label>占位符文字</label><input type="text" id="fbPlaceholder" placeholder="可选"></div>
                <div id="fbOptionsWrap" style="display:none;" class="form-group">
                    <label>选项（每行一个）</label>
                    <textarea id="fbOptions" rows="3"></textarea>
                </div>
                <div class="form-group"><label><input type="checkbox" id="fbRequired"> 必填</label></div>
                <button onclick="addField()">+ 添加字段</button>
            </div>

            <div class="card">
                <h3>已添加字段 <span id="fieldCount" style="color:var(--secondary-color)">(0)</span></h3>
                <div id="fieldsList"></div>
            </div>
        </div>

        <div id="tab-preview" class="tab-content">
            <div class="card">
                <div class="fb-preview" id="fbPreview"></div>
            </div>
        </div>

        <div id="tab-responses" class="tab-content">
            <div class="card">
                <h3>收到的反馈 <span id="respCount" style="color:var(--secondary-color)">(0)</span></h3>
                <button onclick="simulateResponse()" class="btn-secondary btn-sm">模拟提交</button>
                <button onclick="clearResponses()" class="btn-danger btn-sm">清空数据</button>
                <div id="respList" style="margin-top:16px;"></div>
            </div>
        </div>
    </div>

    <script>
        let fields = [];
        let responses = [];

        function toggleTheme() {
            const html = document.documentElement;
            html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
        }

        function switchTab(name) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', ['build','preview','responses'][i] === name);
            });
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            if (name === 'preview') renderPreview();
            if (name === 'responses') renderResponses();
        }

        function updateOptWrap() {
            const t = document.getElementById('fbFieldType').value;
            document.getElementById('fbOptionsWrap').style.display = ['single','multi'].includes(t) ? 'block' : 'none';
        }
        document.getElementById('fbFieldType').addEventListener('change', updateOptWrap);

        function addField() {
            const type = document.getElementById('fbFieldType').value;
            const label = document.getElementById('fbLabel').value.trim();
            if (!label) { alert('请输入标签'); return; }
            const needsOpts = ['single','multi'].includes(type);
            const opts = needsOpts ? document.getElementById('fbOptions').value.split('\n').filter(o => o.trim()) : [];
            if (needsOpts && opts.length < 2) { alert('至少需要2个选项'); return; }

            fields.push({
                type, label,
                placeholder: document.getElementById('fbPlaceholder').value.trim(),
                required: document.getElementById('fbRequired').checked,
                options: opts, id: Date.now()
            });
            document.getElementById('fbLabel').value = '';
            document.getElementById('fbPlaceholder').value = '';
            document.getElementById('fbOptions').value = '';
            document.getElementById('fbRequired').checked = false;
            renderFields();
        }

        function renderFields() {
            const el = document.getElementById('fieldsList');
            document.getElementById('fieldCount').textContent = '(' + fields.length + ')';
            const typeNames = { text:'文本', textarea:'多行', email:'邮箱', emoji:'表情', csat:'满意度', nps:'NPS', single:'单选', multi:'多选' };
            el.innerHTML = fields.map((f, i) => `
                <div class="fb-item">
                    <h4><span>${i+1}. ${esc(f.label)} ${f.required?'<span style="color:var(--danger-color)">*</span>':''}</span>
                    <span><span style="color:var(--secondary-color);font-size:12px;">${typeNames[f.type]}</span>
                    <button class="btn-sm btn-danger" onclick="removeField(${i})">删除</button></span></h4>
                </div>
            `).join('') || '<div style="color:var(--secondary-color);text-align:center;padding:20px;">暂无字段</div>';
        }

        function removeField(i) { fields.splice(i, 1); renderFields(); }

        function renderPreview() {
            const area = document.getElementById('fbPreview');
            const title = document.getElementById('fbTitle').value || '反馈表单';
            const company = document.getElementById('fbCompany').value;
            const desc = document.getElementById('fbDesc').value;

            let html = `<div class="fb-title">${esc(title)}</div>`;
            if (company) html += `<div style="font-size:14px;color:var(--secondary-color);margin-bottom:4px;">${esc(company)}</div>`;
            if (desc) html += `<div class="fb-desc">${esc(desc)}</div>`;

            if (!fields.length) { html += '<div style="color:var(--secondary-color);text-align:center;padding:30px;">请先添加字段</div>'; area.innerHTML = html; return; }

            fields.forEach((f, i) => {
                html += `<div class="fb-field">`;
                html += `<div class="fb-label">${f.required?'<span class="fb-required">*</span> ':''} ${esc(f.label)}</div>`;

                if (f.type === 'text') html += `<input type="text" placeholder="${esc(f.placeholder)}" style="width:100%;padding:10px;border:1px solid var(--border-color);border-radius:6px;">`;
                else if (f.type === 'textarea') html += `<textarea placeholder="${esc(f.placeholder)}" style="width:100%;padding:10px;border:1px solid var(--border-color);border-radius:6px;min-height:80px;"></textarea>`;
                else if (f.type === 'email') html += `<input type="email" placeholder="${esc(f.placeholder)}" style="width:100%;padding:10px;border:1px solid var(--border-color);border-radius:6px;">`;
                else if (f.type === 'emoji') {
                    html += `<div class="emoji-rating">${['😡','😟','😐','🙂','😍'].map(e => `<span onclick="this.parentNode.querySelectorAll('span').forEach(s=>s.classList.remove('active'));this.classList.add('active')">${e}</span>`).join('')}</div>`;
                } else if (f.type === 'csat') {
                    html += `<div class="csat-scale">${[1,2,3,4,5].map(n => `<span onclick="this.parentNode.querySelectorAll('span').forEach(s=>s.style.background='');this.style.background='var(--primary-color)';this.style.color='white'">${n}</span>`).join('')}</div>`;
                } else if (f.type === 'nps') {
                    html += `<div class="csat-scale">${Array.from({length:11},(_,n) => `<span onclick="this.parentNode.querySelectorAll('span').forEach(s=>{s.style.background='';s.style.color=''});this.style.background='var(--primary-color)';this.style.color='white'">${n}</span>`).join('')}</div>`;
                    html += `<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--secondary-color);margin-top:4px;"><span>完全不会</span><span>非常可能</span></div>`;
                } else if (f.type === 'single') {
                    html += f.options.map(o => `<label style="display:flex;align-items:center;gap:8px;padding:6px 0;"><input type="radio" name="fbf${i}"> ${esc(o)}</label>`).join('');
                } else if (f.type === 'multi') {
                    html += f.options.map(o => `<label style="display:flex;align-items:center;gap:8px;padding:6px 0;"><input type="checkbox" name="fbf${i}"> ${esc(o)}</label>`).join('');
                }
                html += `</div>`;
            });

            html += `<button style="width:100%;margin-top:16px;padding:14px;font-size:16px;">提交反馈</button>`;
            area.innerHTML = html;
        }

        function simulateResponse() {
            if (!fields.length) return;
            const r = { timestamp: new Date().toLocaleString(), data: {} };
            fields.forEach((f, i) => {
                if (f.type === 'text' || f.type === 'email') r.data[f.label] = '示例' + Math.floor(Math.random() * 1000);
                else if (f.type === 'textarea') r.data[f.label] = '这是一段示例反馈文本。';
                else if (f.type === 'emoji') r.data[f.label] = ['😡','😟','😐','🙂','😍'][Math.floor(Math.random() * 5)];
                else if (f.type === 'csat') r.data[f.label] = Math.ceil(Math.random() * 5);
                else if (f.type === 'nps') r.data[f.label] = Math.floor(Math.random() * 11);
                else if (f.type === 'single') r.data[f.label] = f.options[Math.floor(Math.random() * f.options.length)];
                else if (f.type === 'multi') r.data[f.label] = [f.options[Math.floor(Math.random() * f.options.length)]];
            });
            responses.push(r);
            renderResponses();
        }

        function renderResponses() {
            document.getElementById('respCount').textContent = '(' + responses.length + ')';
            const el = document.getElementById('respList');
            if (!responses.length) { el.innerHTML = '<div style="color:var(--secondary-color);text-align:center;padding:20px;">暂无反馈数据</div>'; return; }

            el.innerHTML = responses.map((r, i) => `
                <div style="padding:16px;border:1px solid var(--border-color);border-radius:8px;margin-bottom:10px;background:var(--bg-color);">
                    <div style="font-size:13px;color:var(--secondary-color);margin-bottom:8px;">#${i+1} · ${r.timestamp}</div>
                    ${Object.entries(r.data).map(([k,v]) => `<div><strong>${esc(k)}:</strong> ${Array.isArray(v)?v.join(', '):v}</div>`).join('')}
                </div>
            `).join('');
        }

        function clearResponses() { if (confirm('确定清空？')) { responses = []; renderResponses(); } }
        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        renderFields();
    </script>
</body>
</html>
