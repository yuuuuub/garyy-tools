<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颜色无障碍检测 - Color Accessibility 中文</title>
<meta name="description" content="检测颜色对比度是否符合WCAG 2.1标准，评估文字可读性和无障碍合规性">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♿</text></svg>">
<meta name="robots" content="index, follow">
<style>
:root{--radius:10px;--transition:.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--green:#3fb950;--red:#f85149;--yellow:#d29922}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.back{position:fixed;top:8px;left:8px;z-index:9999;text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)}
.header{text-align:center;padding:2rem 1rem 1rem}
.header h1{font-size:1.8rem;margin-bottom:.3rem}
.header p{color:var(--text2);font-size:.9rem}
.theme-btn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:.75rem}
.container{max-width:900px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.card h2{font-size:1.1rem;margin-bottom:.8rem;color:var(--accent)}
.color-inputs{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}
.color-input{text-align:center}
.color-input label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:.4rem}
.color-input input[type="color"]{width:64px;height:64px;border:none;border-radius:10px;cursor:pointer;background:none;padding:0}
.color-input input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
.color-input input[type="color"]::-webkit-color-swatch{border-radius:10px;border:2px solid var(--border)}
.color-input .hex{font-family:monospace;font-size:.85rem;margin-top:.3rem}
.swap-btn{align-self:center;padding:.5rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:1.1rem}
.ratio-display{text-align:center;margin:1.5rem 0}
.ratio-num{font-size:3rem;font-weight:700}
.ratio-label{font-size:.9rem;color:var(--text2)}
等级判定行
等级列表{margin:1rem 0}
.grade-item{display:flex;align-items:center;gap:1rem;padding:.8rem;border-radius:8px;margin:.3rem 0;font-size:.9rem}
.grade-item.pass{background:rgba(63,185,80,.1);border-left:3px solid var(--green)}
.grade-item.fail{background:rgba(248,81,73,.1);border-left:3px solid var(--red)}
.grade-icon{font-size:1.2rem;width:24px;text-align:center}
.grade-info{flex:1}
.grade-info strong{display:block;margin-bottom:.15rem}
.grade-info span{font-size:.8rem;color:var(--text2)}
.preview-box{border-radius:12px;overflow:hidden;margin:1rem 0;border:1px solid var(--border)}
.preview-section{padding:1.5rem}
.preview-normal{font-size:1rem;line-height:1.6}
.preview-large{font-size:1.5rem;font-weight:700}
.preview-small{font-size:.75rem}
.swap-btn-row{text-align:center;margin:.5rem 0}
.tips-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem;font-size:.85rem;color:var(--text2);line-height:1.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<a href="../index.html" class="back">← 首页</a>
<button class="theme-btn" onclick="toggleTheme()">🌓 主题</button>
<div class="header">
<h1>♿ 颜色无障碍检测</h1>
<p>检测颜色对比度是否符合 WCAG 2.1 无障碍标准</p>
</div>
<div class="container">
<div class="card">
<h2>选择颜色</h2>
<div class="color-inputs">
<div class="color-input"><label>前景色（文字）</label><input type="color" id="fg" value="#FFFFFF" oninput="analyze()"><div class="hex" id="fgHex">#FFFFFF</div></div>
<div class="swap-btn-row"><button class="swap-btn" onclick="swapColors()">🔄</button></div>
<div class="color-input"><label>背景色</label><input type="color" id="bg" value="#3B82F6" oninput="analyze()"><div class="hex" id="bgHex">#3B82F6</div></div>
</div>
</div>

<div class="card">
<h2>对比度评分</h2>
<div class="ratio-display">
<div class="ratio-num" id="ratioNum">8.59:1</div>
<div class="ratio-label">对比度</div>
</div>
<div id="gradeList"></div>
</div>

<div class="card">
<h2>预览效果</h2>
<div class="preview-box" id="previewBox">
<div class="preview-section">
<div class="preview-large" id="prevLarge">大号文字预览 24px</div>
<div class="preview-normal" id="prevNormal">普通文字预览 16px — 这是一段示例文本，用于测试前景色和背景色组合的可读性。良好的对比度能确保所有用户都能清晰阅读内容。</div>
<div class="preview-small" id="prevSmall" style="margin-top:.5rem">小号文字预览 12px — 辅助信息、注释文字</div>
</div>
</div>
</div>

<div class="card">
<h2>对比度提升建议</h2>
<div class="tips-box" id="tipsBox"></div>
</div>
</div>

<script>
function toggleTheme(){const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t)}
function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function luminance(r,g,b){const a=[r,g,b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return a[0]*.2126+a[1]*.7152+a[2]*.0722}
function contrastRatio(hex1,hex2){const l1=luminance(...hexToRgb(hex1)),l2=luminance(...hexToRgb(hex2));const lighter=Math.max(l1,l2),darker=Math.min(l1,l2);return(lighter+.05)/(darker+.05)}

function swapColors(){
const fg=document.getElementById('fg'),bg=document.getElementById('bg');
const tmp=fg.value;fg.value=bg.value;bg.value=tmp;analyze();
}

function analyze(){
const fg=document.getElementById('fg').value;
const bg=document.getElementById('bg').value;
document.getElementById('fgHex').textContent=fg.toUpperCase();
document.getElementById('bgHex').textContent=bg.toUpperCase();
const ratio=contrastRatio(fg,bg);
document.getElementById('ratioNum').textContent=ratio.toFixed(2)+':1';
const ratioColor=ratio>=7?'var(--green)':ratio>=4.5?'var(--yellow)':'var(--red)';
document.getElementById('ratioNum').style.color=ratioColor;

const grades=[
{name:'AA 普通文字 (≥4.5:1)',req:4.5,size:'16px+'},
{name:'AA 大号文字 (≥3:1)',req:3,size:'24px+ 或 19px 加粗'},
{name:'AAA 普通文字 (≥7:1)',req:7,size:'16px+'},
{name:'AAA 大号文字 (≥4.5:1)',req:4.5,size:'24px+ 或 19px 加粗'}
];
const gl=document.getElementById('gradeList');
gl.innerHTML=grades.map(g=>{
const pass=ratio>=g.req;
return`<div class="grade-item ${pass?'pass':'fail'}"><div class="grade-icon">${pass?'✅':'❌'}</div><div class="grade-info"><strong>${g.name}</strong><span>${pass?'通过':'未通过'} — 最低要求 ${g.req}:1，当前 ${ratio.toFixed(2)}:1，适用${g.size}</span></div></div>`;
}).join('');

document.getElementById('prevLarge').style.cssText=`color:${fg};background:${bg}`;
document.getElementById('prevNormal').style.cssText=`color:${fg};background:${bg}`;
document.getElementById('prevSmall').style.cssText=`color:${fg};background:${bg}`;
document.getElementById('previewBox').style.background=bg;

const tips=[];
if(ratio<3)tips.push('⚠️ 对比度极低，文字几乎无法阅读。请大幅增加前景与背景的明度差异。');
else if(ratio<4.5)tips.push('⚠️ 对比度不足，不满足WCAG AA标准。建议增加对比度至4.5:1以上。');
else if(ratio<7)tips.push('✅ 满足AA标准，但未达AAA标准。对于关键信息，建议进一步提升对比度。');
else tips.push('✅ 优秀！满足WCAG AAA最高标准，所有用户都能清晰阅读。');
if(ratio>=4.5&&ratio<7)tips.push('💡 可通过加深前景色或减浅背景色来达到AAA标准(7:1)。');
tips.push('💡 建议使用本工具检测所有文本与背景的颜色组合，确保全站无障碍合规。');
document.getElementById('tipsBox').innerHTML=tips.join('<br><br>');
}
analyze();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
