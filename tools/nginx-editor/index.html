<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nginx配置编辑器</title>
<meta name="description" content="Nginx配置文件在线编辑器，实时编辑Nginx配置">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;display:flex;flex-direction:columnpadding:16px;scroll-behavior:smooth;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.header .icon{font-size:28px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--border)}
.btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--text)}
.btn-primary:hover{opacity:.9}
.editor-wrap{display:flex;flex:1;overflow:hidden;height:calc(100vh - 140px)}
.line-numbers{background:var(--card);border-right:1px solid var(--border);padding:12px 8px;text-align:right;color:var(--muted);font-family:'SF Mono',Monaco,Consolas,monospace;font-size:14px;line-height:1.6;user-select:none;overflow:hidden;min-width:40px}
.editor{flex:1;width:100%;background:var(--bg);color:var(--text);border:none;outline:none;resize:none;padding:12px 16px;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:14px;line-height:1.6;tab-size:4}
.snippets{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:100;justify-content:center;align-items:center}
.snippets.show{display:flex}
.snippet-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto}
.snippet-panel h2{margin-bottom:16px;font-size:18px}
.snippet-item{padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.snippet-item:hover{border-color:var(--accent)}
.snippet-item h3{font-size:14px;color:var(--accent);margin-bottom:4px}
.snippet-item p{font-size:12px;color:var(--muted)}
.close-btn{float:right;cursor:pointer;font-size:20px;color:var(--muted);border:none;background:none}
.close-btn:hover{color:var(--text)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:var(--text);padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;z-index:200}
.toast.show{opacity:1}
@media(max-width:768px){.header{padding:12px 16px}.toolbar{padding:8px 16px}.editor-wrap{height:calc(100vh - 180px)}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Nginx配置编辑器">
  <meta property="og:description" content="Nginx配置文件在线编辑器，实时编辑Nginx配置">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/nginx-editor/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="header">
<span class="icon">🌐</span>
<h1>Nginx配置编辑器</h1>
</div>
<div class="toolbar">
<button class="btn" onclick="showSnippets()">📝 常用配置</button>
<button class="btn" onclick="loadTpl('basic')">基础配置</button>
<button class="btn" onclick="loadTpl('proxy')">反向代理</button>
<button class="btn" onclick="loadTpl('ssl')">SSL配置</button>
<button class="btn" onclick="loadTpl('static')">静态站点</button>
<button class="btn btn-primary" onclick="copyCode()">📋 复制</button>
<button class="btn" onclick="downloadFile()">⬇️ 下载</button>
</div>
<div class="editor-wrap">
<div class="line-numbers" id="lineNums">1</div>
<textarea class="editor" id="editor" spellcheck="false" placeholder="在此输入Nginx配置..."></textarea>
</div>
<div class="snippets" id="snippetsPanel">
<div class="snippet-panel">
<button class="close-btn" onclick="hideSnippets()">&times;</button>
<h2>常用配置模板</h2>
<div class="snippet-item" onclick="insertSnippet('gzip')"><h3>Gzip压缩</h3><p>启用Gzip压缩减少传输大小</p></div>
<div class="snippet-item" onclick="insertSnippet('cache')"><h3>浏览器缓存</h3><p>配置静态资源缓存策略</p></div>
<div class="snippet-item" onclick="insertSnippet('security')"><h3>安全头</h3><p>添加安全相关响应头</p></div>
<div class="snippet-item" onclick="insertSnippet('ratelimit')"><h3>限流配置</h3><p>请求速率限制</p></div>
<div class="snippet-item" onclick="insertSnippet('websocket')"><h3>WebSocket</h3><p>WebSocket代理配置</p></div>
<div class="snippet-item" onclick="insertSnippet('loadbalance')"><h3>负载均衡</h3><p>多后端负载均衡配置</p></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const tpls={
basic:`server {
    listen 80;
    server_name example.com;

    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}`,
proxy:`server {
    listen 80;
    server_name example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}`,
ssl:`server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /var/www/html;
        index index.html;
    }
}

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}`,
static:`server {
    listen 80;
    server_name example.com;
    root /var/www/site;
    index index.html;

    location ~* \\.(css|js|png|jpg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}`
};
const snippets={
gzip:`    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;`,
cache:`    location ~* \\.(css|js|png|jpg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }`,
security:`    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'" always;`,
ratelimit:`    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }`,
websocket:`    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }`,
loadbalance:`upstream backend {
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    server 127.0.0.1:3003;
}

server {
    listen 80;
    location / {
        proxy_pass http://backend;
    }
}`
};
const editor=document.getElementById('editor');
const lineNums=document.getElementById('lineNums');
function updateLn(){const n=editor.value.split('\n').length;lineNums.innerHTML=Array.from({length:n},(_,i)=>`<div>${i+1}</div>`).join('')}
editor.addEventListener('input',updateLn);
editor.addEventListener('scroll',()=>lineNums.scrollTop=editor.scrollTop);
function loadTpl(k){editor.value=tpls[k]||'';updateLn()}
function showSnippets(){document.getElementById('snippetsPanel').classList.add('show')}
function hideSnippets(){document.getElementById('snippetsPanel').classList.remove('show')}
function insertSnippet(k){
const pos=editor.selectionStart;const v=editor.value;
editor.value=v.slice(0,pos)+'\n'+snippets[k]+'\n'+v.slice(pos);
updateLn();hideSnippets();showToast('已插入配置片段');
}
function copyCode(){navigator.clipboard.writeText(editor.value).then(()=>showToast('已复制到剪贴板'))}
function downloadFile(){const b=new Blob([editor.value],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nginx.conf';a.click()}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
loadTpl('basic');
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
