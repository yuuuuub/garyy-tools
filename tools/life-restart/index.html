<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生重启模拟器</title>
<meta name="description" content="人生重启模拟器，体验不同选择下的人生走向">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text-muted:#8b949e;--accent:#f59e0b;--accent-glow:rgba(245,158,11,.25);--pink:#ec4899;--blue:#3b82f6;--green:#22c55e;--purple:#a855f7;--amber:#f59e0b;--radius:12px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;justify-content:center;align-items:center;min-height:100vh;overflow-x:hidden}
#app{width:100%;max-width:520px;padding:16px;min-height:100vh;display:flex;flex-direction:column}
/* ---- 开始画面 ---- */
#startScreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:24px;padding:40px 20px}
#startScreen h1{font-size:32px;font-weight:800;background:linear-gradient(135deg,#f59e0b,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.3}
#startScreen .subtitle{color:var(--text-muted);font-size:15px;line-height:1.6;max-width:360px}
#startScreen .rules{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:left;width:100%;max-width:380px;font-size:13px;color:var(--text-muted);line-height:1.8}
#startScreen .rules span{color:var(--text)}
.btn-primary{background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#000;font-size:17px;font-weight:700;padding:14px 48px;border-radius:var(--radius);cursor:pointer;transition:transform .15s,box-shadow .2s;box-shadow:0 4px 20px var(--accent-glow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 30px var(--accent-glow)}
.btn-primary:active{transform:translateY(0)}
/* ---- 游戏画面 ---- */
#gameScreen{flex:1;display:none;flex-direction:column;gap:12px}
#gameScreen.active{display:flex}
.game-header{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.game-header .age{font-size:20px;font-weight:700;color:var(--accent)}
.game-header .turn{font-size:12px;color:var(--text-muted)}
.progress-wrap{background:var(--card);border-radius:99px;height:6px;overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#fbbf24);border-radius:99px;transition:width .6s ease;width:0%}
/* ---- 属性面板 ---- */
.stats-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.stat-row{display:flex;align-items:center;gap:6px}
.stat-icon{font-size:14px;width:20px;text-align:center}
.stat-label{font-size:11px;color:var(--text-muted);width:28px;flex-shrink:0}
.stat-bar-wrap{flex:1;height:8px;background:#21262d;border-radius:99px;overflow:hidden;min-width:0}
.stat-bar-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.34,1.56,.64,1);width:50%}
.stat-val{font-size:11px;font-weight:600;width:22px;text-align:right;flex-shrink:0}
.stat-change{font-size:10px;width:20px;text-align:center;flex-shrink:0;opacity:0;transition:opacity .3s}
.stat-change.show{opacity:1}
.stat-change.pos{color:var(--green)}
.stat-change.neg{color:#ef4444}
/* ---- 事件卡片 ---- */
.event-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;flex:1;display:flex;flex-direction:column;gap:16px;min-height:240px;position:relative}
.event-age-tag{position:absolute;top:12px;right:12px;background:rgba(245,158,11,.12);color:var(--accent);font-size:11px;padding:2px 10px;border-radius:99px;font-weight:600}
.event-text{font-size:16px;line-height:1.7;padding-top:8px;min-height:60px}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.choice-btn{background:#21262d;border:1px solid var(--border);color:var(--text);font-size:14px;padding:12px 16px;border-radius:8px;cursor:pointer;text-align:left;transition:all .15s;line-height:1.4}
.choice-btn:hover{background:#282e36;border-color:var(--accent);box-shadow:0 0 12px var(--accent-glow);transform:translateX(4px)}
.choice-btn:active{transform:translateX(2px)}
.choice-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.choice-btn .effect-hint{display:block;font-size:11px;color:var(--text-muted);margin-top:4px}
.choice-btn .effect-hint .pos{color:var(--green)}
.choice-btn .effect-hint .neg{color:#ef4444}
.choice-btn .effect-hint .neu{color:var(--text-muted)}
/* ---- 结果过渡 ---- */
.result-overlay{position:absolute;inset:0;background:var(--card);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:2;padding:20px;text-align:center}
.result-overlay.show{opacity:1}
.result-overlay .result-title{font-size:20px;font-weight:700}
.result-overlay .result-desc{font-size:14px;color:var(--text-muted);line-height:1.6}
.result-overlay .result-changes{font-size:13px;line-height:1.8}
/* ---- 结束画面 ---- */
#endScreen{display:none;flex-direction:column;gap:20px;padding:20px 0}
#endScreen.active{display:flex}
.end-title{text-align:center;font-size:28px;font-weight:800;background:linear-gradient(135deg,#f59e0b,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;padding:16px 0 4px}
.end-rating{text-align:center;font-size:22px;font-weight:700;color:var(--accent);padding:4px 0 12px}
.end-stats{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.end-stat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.end-stat-row:last-child{margin-bottom:0}
.end-stat-icon{font-size:16px;width:24px;text-align:center}
.end-stat-label{font-size:13px;width:56px;flex-shrink:0;color:var(--text-muted)}
.end-stat-bar{flex:1;height:20px;background:#21262d;border-radius:6px;overflow:hidden}
.end-stat-fill{height:100%;border-radius:6px;transition:width 1s ease;width:0%}
.end-stat-val{font-size:13px;font-weight:700;width:28px;text-align:right}
.end-score{text-align:center;font-size:15px;color:var(--text-muted);line-height:1.8;padding:8px 0}
.end-flavor{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;font-size:14px;color:var(--text-muted);line-height:1.8;font-style:italic}
.end-actions{display:flex;gap:12px}
.end-actions .btn-primary{flex:1;text-align:center;font-size:15px;padding:14px 20px}
.btn-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);font-size:15px;font-weight:600;padding:14px 20px;border-radius:var(--radius);cursor:pointer;transition:all .15s;text-align:center;flex:1}
.btn-secondary:hover{background:#21262d;border-color:var(--text-muted)}
/* ---- 动画 ---- */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.event-card,.end-stats,.end-flavor{animation:fadeIn .4s ease}
.choice-btn{animation:fadeIn .3s ease both}
.choice-btn:nth-child(1){animation-delay:.1s}
.choice-btn:nth-child(2){animation-delay:.18s}
.choice-btn:nth-child(3){animation-delay:.26s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.stat-change.show{animation:pulse .6s ease}
/* ---- 响应式 ---- */
@media(max-width:480px){
  #app{padding:12px}
  #startScreen h1{font-size:26px}
  .event-text{font-size:15px}
  .stats-panel{gap:6px 10px;padding:12px}
  .stat-label{width:24px;font-size:10px}
  .stat-icon{font-size:12px;width:16px}
  .stat-val{font-size:10px;width:18px}
  .end-title{font-size:24px}
  .end-rating{font-size:18px}
  .choice-btn{font-size:13px;padding:10px 14px}
  .game-header .age{font-size:17px}
}
</style>

<body>
<div id="app">

<!-- 开始画面 -->
<div id="startScreen">
  <h1>🔄 人生重启模拟器</h1>
  <p class="subtitle">如果给你一次重活的机会，你会如何度过这一生？<br>从 0 岁到 80 岁，每一次选择都将改变你的命运。</p>
  <div class="rules">
    <div>🎯 <span>5 项核心属性</span>：颜值 · 智力 · 财富 · 幸运 · 快乐</div>
    <div>🎲 <span>随机事件</span>：每个年龄段都会遇到不同的人生事件</div>
    <div>🤔 <span>做出选择</span>：你的每个选择都会影响属性变化</div>
    <div>🏁 <span>80 岁终章</span>：回顾你的一生，看看你活成了什么样</div>
  </div>
  <button class="btn-primary" onclick="startGame()">✨ 开始新人生</button>
</div>

<!-- 游戏画面 -->
<div id="gameScreen">
  <div class="game-header">
    <div class="age" id="ageDisplay">👤 0 岁</div>
    <div class="turn" id="turnDisplay">第 1 章</div>
  </div>
  <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
  <div class="stats-panel" id="statsPanel"></div>
  <div class="event-card" id="eventCard">
    <div class="event-age-tag" id="eventAgeTag">童年</div>
    <div class="event-text" id="eventText">加载中...</div>
    <div class="choices" id="choicesContainer"></div>
    <div class="result-overlay" id="resultOverlay">
      <div class="result-title" id="resultTitle">✨</div>
      <div class="result-desc" id="resultDesc"></div>
      <div class="result-changes" id="resultChanges"></div>
    </div>
  </div>
</div>

<!-- 结束画面 -->
<div id="endScreen">
  <div class="end-title">🏁 人生终章</div>
  <div class="end-rating" id="endRating">-</div>
  <div class="end-stats" id="endStats"></div>
  <div class="end-score" id="endScore"></div>
  <div class="end-flavor" id="endFlavor"></div>
  <div class="end-actions">
    <button class="btn-primary" onclick="resetGame()">🔄 重新开始</button>
  </div>
</div>

</div>

<script>
// ============================================================
// 事 件 库  —— 50+ 个年龄适配事件
// ============================================================
const EVENTS = [

  // ─── 童年 0-9 岁 ───
  {
    minAge:0,maxAge:4,
    text:'🎨 幼儿园举办画画比赛，主题是「我的家」。你准备画什么？',
    choices:[
      {text:"🌈 画一幅色彩丰富的全家福",effects:{looks:3,happiness:2,intelligence:1}},
      {text:"📐 认真地画房子的结构图",effects:{intelligence:3,happiness:-1}},
      {text:"😢 不想画，躲在角落里哭",effects:{happiness:-2,luck:-1}}
    ]
  },
  {
    minAge:0,maxAge:4,
    text:"🤸 在小区公园里和小伙伴们追逐打闹，你摔倒了，膝盖擦破了皮。",
    choices:[
      {text:"😭 大哭起来，等大人来安慰",effects:{happiness:-1,luck:1}},
      {text:"💪 爬起来拍拍土，继续玩",effects:{happiness:2,luck:2,looks:1}},
      {text:"🏠 默默回家找妈妈贴创可贴",effects:{happiness:1,intelligence:1}}
    ]
  },
  {
    minAge:0,maxAge:4,
    text:"🧸 爸妈给你买了一个新玩具，隔壁小朋友想借来玩。",
    choices:[
      {text:"🤝 大方地借给他一起玩",effects:{happiness:3,luck:1,looks:1}},
      {text:"🙅 护着自己的玩具不松手",effects:{happiness:-1}},
      {text:"🎲 跟他交换玩具玩",effects:{happiness:2,intelligence:1,looks:1}}
    ]
  },
  {
    minAge:0,maxAge:4,
    text:"🍭 第一次去超市，琳琅满目的零食让你眼花缭乱。",
    choices:[
      {text:"🍬 选了最甜的棒棒糖和巧克力",effects:{happiness:3,looks:-1}},
      {text:"🥦 好奇地选了蔬菜和水果",effects:{looks:2,intelligence:1,happiness:-1}},
      {text:"🤔 纠结了半天，最后选了玩具",effects:{intelligence:1,happiness:1}}
    ]
  },
  {
    minAge:5,maxAge:9,
    text:"📚 小学一年级第一次考试，你考了 80 分。同桌考了 100 分。",
    choices:[
      {text:"📖 暗下决心要努力学习追上他",effects:{intelligence:4,happiness:-1}},
      {text:"🎉 觉得自己考得不错，开心回家",effects:{happiness:2,luck:1}},
      {text:"😞 很沮丧，不想再学习了",effects:{intelligence:-2,happiness:-2}}
    ]
  },
  {
    minAge:5,maxAge:9,
    text:"🎭 学校举办文艺汇演，老师在班上挑选小演员。",
    choices:[
      {text:"🎤 勇敢举手报名参加",effects:{looks:3,happiness:2,luck:1}},
      {text:"📝 主动报名做幕后道具组",effects:{intelligence:2,happiness:1}},
      {text:"🙈 低着头，希望老师不要点到自己",effects:{looks:-1,luck:-1}}
    ]
  },
  {
    minAge:5,maxAge:9,
    text:"🐶 放学路上遇到一只流浪小狗，它看起来很饿。",
    choices:[
      {text:"🍗 把自己的零食分给它吃",effects:{happiness:3,luck:2,looks:1}},
      {text:"🏃 害怕地跑开了",effects:{happiness:-1}},
      {text:"📱 跑去叫大人来帮忙",effects:{intelligence:2,happiness:1,luck:1}}
    ]
  },
  {
    minAge:5,maxAge:9,
    text:"🎮 同学邀请你去他家打游戏，但你还有作业没写完。",
    choices:[
      {text:"📝 先回家写完作业再去玩",effects:{intelligence:2,happiness:1}},
      {text:"🎮 先玩再说，作业晚上赶一赶",effects:{happiness:2,intelligence:-1}},
      {text:"🚫 拒绝了，回家认真做作业",effects:{intelligence:3,happiness:-1}}
    ]
  },
  {
    minAge:5,maxAge:9,
    text:"🎂 今天是你的生日，爸妈问你想要什么生日礼物。",
    choices:[
      {text:"📚 想要一套百科全书",effects:{intelligence:3,happiness:2}},
      {text:"🧸 想要一个超大的毛绒玩具",effects:{happiness:2,looks:1}},
      {text:"🌍 想要全家一起去游乐园玩",effects:{happiness:3,luck:1}}
    ]
  },
  {
    minAge:5,maxAge:9,
    text:"⚽ 体育课上分组踢球，你是最后被选中的那个人。",
    choices:[
      {text:"💪 暗暗努力踢球证明自己",effects:{looks:2,intelligence:1,happiness:1}},
      {text:"😔 觉得很难过，不想上体育课了",effects:{happiness:-2,looks:-1}},
      {text:"🤷 无所谓，随便踢踢就好",effects:{luck:1,happiness:-1}}
    ]
  },

  // ─── 少年 10-17 岁 ───
  {
    minAge:10,maxAge:17,
    text:"📱 你偷偷攒钱买了一部手机，被父母发现了。",
    choices:[
      {text:"💬 诚恳地和父母沟通，约定使用时间",effects:{intelligence:2,happiness:2,looks:1}},
      {text:"🙊 撒谎说是同学借给你的",effects:{intelligence:-2,luck:-1}},
      {text:"🔒 保证只在周末使用",effects:{intelligence:1,happiness:1}}
    ]
  },
  {
    minAge:10,maxAge:17,
    text:"💕 你发现自己对班上某个同学有了特别的好感。",
    choices:[
      {text:"💌 写了一封情书表白",effects:{looks:2,luck:2,happiness:3}},
      {text:"📖 把这份心情埋在心底，专心学习",effects:{intelligence:3,happiness:-1}},
      {text:"🤝 主动和对方做朋友，慢慢了解",effects:{looks:2,intelligence:1,happiness:2}}
    ]
  },
  {
    minAge:10,maxAge:17,
    text:"🎸 学校社团招新，你对好几个社团都感兴趣。",
    choices:[
      {text:"🎵 加入音乐社，学一门乐器",effects:{looks:3,happiness:2}},
      {text:"🤖 加入科技社，搞点发明创造",effects:{intelligence:3,happiness:1}},
      {text:"🏃 加入体育社，锻炼身体",effects:{looks:2,happiness:2,luck:1}},
      {text:"📚 哪个都不参加，专心学习",effects:{intelligence:2,happiness:-1}}
    ]
  },
  {
    minAge:10,maxAge:17,
    text:"😤 好朋友在背后说了你的坏话，被你发现了。",
    choices:[
      {text:"💬 找他当面谈清楚，化解误会",effects:{looks:2,intelligence:2,happiness:2}},
      {text:"😠 跟他绝交，再也不理他",effects:{happiness:-2,luck:-1}},
      {text:"🙂 装作不知道，但保持距离",effects:{intelligence:1,happiness:-1}}

  },
  {

    text:"🏆 学校举行运动会，你有机会代表班级参赛。",
    choices:[

      {text:"📣 主动当班级拉拉队组织者",effects:{looks:2,intelligence:1,happiness:2}},
      {text:"🚶 觉得自己不行，放弃了机会",effects:{happiness:-1,luck:-2}}
    ]
  },
  {
    minAge:10,maxAge:17,
    text:"💻 你迷上了一款网络游戏，每天都很想玩。",
    choices:[
      {text:"⏰ 给自己定规矩，每天只玩一小时",effects:{intelligence:1,happiness:1}},
      {text:"🎮 放学就玩，作业随便写写",effects:{happiness:2,intelligence:-3,looks:-1}},
      {text:"🚫 删掉游戏，专注学习和运动",effects:{intelligence:3,looks:1,happiness:-2}}
    ]
  },
  {
    minAge:10,maxAge:17,
    text:"💰 过年收到了压岁钱，是一笔不小的数目。",
    choices:[
      {text:"🏦 存起来，以后需要再用",effects:{wealth:3,intelligence:1}},
      {text:"🛍️ 买自己一直想要的东西",effects:{happiness:2,wealth:-1}},
      {text:"📈 买一些学习资料和课程",effects:{intelligence:3,wealth:-1,happiness:1}}
    ]
  },
  {
    minAge:14,maxAge:17,
    text:"🧪 中考结束了，你在犹豫选文科还是理科。",
    choices:[
      {text:"🔬 选理科，未来好就业",effects:{intelligence:3,wealth:2}},
      {text:"🎨 选文科，发挥自己的创造力",effects:{looks:2,happiness:2,intelligence:1}},
      {text:"🤷 随大流，看朋友选什么",effects:{luck:1,intelligence:-1}}
    ]
  },
  {
    minAge:14,maxAge:17,
    text:"☕ 好朋友深夜约你出去聊天散心，但明天有重要考试。",
    choices:[
      {text:"🚶 出去陪他，考试可以再复习",effects:{happiness:3,luck:2,intelligence:-1}},
      {text:"📝 拒绝他，专心准备考试",effects:{intelligence:2,happiness:-1}},
      {text:"💬 陪他聊半小时，然后回来复习",effects:{happiness:2,intelligence:1,looks:1}}
    ]
  },
  {
    minAge:14,maxAge:17,
    text:"🎓 高中班长竞选，你被提名了。",
    choices:[
      {text:"🗣️ 精心准备竞选演讲",effects:{looks:3,intelligence:2,happiness:1}},
      {text:"🤝 做一些承诺拉票",effects:{luck:2,happiness:1,intelligence:-1}},

];

const STAT_EMOJIS = {looks:'✨',intelligence:'📚',wealth:'💰',luck:'🍀',happiness:'😊'};
const STAT_LABELS = {looks:'颜值',intelligence:'智力',wealth:'财富',luck:'幸运',happiness:'快乐'};

let state = {
  age: 0,
  turn: 1,
  stats: {looks:50, intelligence:50, wealth:50, luck:50, happiness:50},
  usedEvents: new Set(),
  history: [],
  isPlaying: false
};

let isTransitioning = false;

// ============================================================
// 核 心 游 戏 逻 辑
// ============================================================
function startGame() {
  state.age = 0;
  state.turn = 1;
  state.stats = {looks:50, intelligence:50, wealth:50, luck:50, happiness:50};
  state.usedEvents = new Set();
  state.history = [];
  state.isPlaying = true;
  isTransitioning = false;

  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').classList.add('active');
  document.getElementById('endScreen').classList.remove('active');

  renderStats();
  showRandomEvent();
}

function resetGame() {
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('startScreen').style.display = 'flex';
  state.isPlaying = false;
}

function getEventsForAge(age) {
  return EVENTS.filter(e => age >= e.minAge && age <= e.maxAge);
}

function getAgeGroup(age) {
  if (age <= 9) return {name:'🧸 童年', tag:'童年'};
  if (age <= 17) return {name:'🌱 少年', tag:'少年'};
  if (age <= 29) return {name:'🔥 青年', tag:'青年'};
  if (age <= 44) return {name:'💼 壮年', tag:'壮年'};
  if (age <= 59) return {name:'🧓 中年', tag:'中年'};
  return {name:'👴 老年', tag:'老年'};
}

function showRandomEvent() {
  if (!state.isPlaying) return;

  // 年龄 ≥ 80 → 游戏结束
  if (state.age >= 80) {
    endGame();
    return;
  }

  const candidates = getEventsForAge(state.age);
  // 过滤已用过的事件
  const unused = candidates.filter(e => !state.usedEvents.has(e));
  let event;
  if (unused.length > 0) {
    event = unused[Math.floor(Math.random() * unused.length)];
  } else {
    // 全都用过了，允许重复
    event = candidates[Math.floor(Math.random() * candidates.length)];
  }
  state.usedEvents.add(event);

  // 更新界面
  const group = getAgeGroup(state.age);
  document.getElementById('ageDisplay').textContent = `👤 ${state.age} 岁`;
  document.getElementById('turnDisplay').textContent = `第 ${state.turn} 章  ·  ${group.name}`;
  document.getElementById('progressFill').style.width = `${Math.min(100, (state.age / 80) * 100)}%`;
  document.getElementById('eventAgeTag').textContent = group.tag;
  document.getElementById('eventText').textContent = event.text;
  document.getElementById('resultOverlay').classList.remove('show');

  // 生成选项
  const container = document.getElementById('choicesContainer');
  container.innerHTML = '';

  const choices = event.choices || [];
  choices.forEach((choice, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';

    // 显示效果预览
    const effects = choice.effects || {};
    const effectParts = [];
    for (const [k, v] of Object.entries(effects)) {
      if (v === 0) continue;
      const sign = v > 0 ? '+' : '';
      const cls = v > 0 ? 'pos' : 'neg';
      effectParts.push(`<span class="${cls}">${STAT_EMOJIS[k]||''} ${sign}${v}</span>`);
    }
    const hint = effectParts.length > 0
      ? `<span class="effect-hint">${effectParts.join(' · ')}</span>`
      : '';

    btn.innerHTML = `${choice.text}${hint}`;
    btn.onclick = () => handleChoice(event, idx);
    container.appendChild(btn);
  });
}

function handleChoice(event, choiceIdx) {
  if (isTransitioning) return;
  isTransitioning = true;

  const choice = event.choices[choiceIdx];
  const effects = choice.effects || {};

  // 禁用所有按钮
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

  // 应用效果
  const changes = [];
  for (const [key, delta] of Object.entries(effects)) {
    if (delta === 0) continue;
    const oldVal = state.stats[key];
    state.stats[key] = Math.max(0, Math.min(100, oldVal + delta));
    const actualDelta = state.stats[key] - oldVal;
    if (actualDelta !== 0) {
      changes.push({key, delta: actualDelta});
    }
  }

  // 记录历史
  state.history.push({
    age: state.age,
    turn: state.turn,
    event: event.text,
    choice: choice.text,
    changes: [...changes]
  });

  // 显示结果浮层
  const overlay = document.getElementById('resultOverlay');
  const resultTitle = changes.length > 0
    ? (changes.some(c => c.delta > 0) ? '📈 命运改变！' : '📉 世事难料...')
    : '🤔 风平浪静';
  document.getElementById('resultTitle').textContent = resultTitle;
  document.getElementById('resultDesc').textContent = choice.text;

  const changesHtml = changes.map(c => {
    const sign = c.delta > 0 ? '+' : '';
    const color = c.delta > 0 ? 'var(--green)' : '#ef4444';
    const emoji = STAT_EMOJIS[c.key] || '';
    return `<span style="color:${color}">${emoji} ${STAT_LABELS[c.key]||c.key} ${sign}${c.delta}</span>`;
  }).join(' &nbsp; ');
  document.getElementById('resultChanges').innerHTML = changesHtml || '<span style="color:var(--text-muted)">没有任何变化</span>';

  overlay.classList.add('show');

  // 更新属性条
  renderStats();

  // 年龄增长（1-4 岁）
  const ageJump = Math.floor(Math.random() * 4) + 1;
  state.age += ageJump;
  state.turn++;

  // 延迟后进入下一轮
  setTimeout(() => {
    isTransitioning = false;
    showRandomEvent();
  }, 1400);
}

function renderStats() {
  const panel = document.getElementById('statsPanel');
  panel.innerHTML = '';
  STAT_CONFIG.forEach(cfg => {
    const val = state.stats[cfg.key] || 50;
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = `
      <span class="stat-icon">${cfg.icon}</span>
      <span class="stat-label">${cfg.label}</span>
      <div class="stat-bar-wrap">
        <div class="stat-bar-fill" style="width:${val}%;background:${cfg.color}"></div>
      </div>
      <span class="stat-val" style="color:${cfg.color}">${val}</span>
    `;
    panel.appendChild(row);
  });
}

// ============================================================
// 游 戏 结 束
// ============================================================
function endGame() {
  state.isPlaying = false;
  document.getElementById('gameScreen').classList.remove('active');

  const s = state.stats;
  const avg = Math.round((s.looks + s.intelligence + s.wealth + s.luck + s.happiness) / 5);

  // 评级
  let rating, ratingDesc;
  if (avg >= 85) { rating = '🏆 传奇人生'; ratingDesc = '你活成了一个传奇！无论从哪个角度看，你的人生都令人惊叹。'; }
  else if (avg >= 70) { rating = '🌟 精彩人生'; ratingDesc = '你的人生精彩纷呈，令人羡慕。大多数人都梦想能活成这样。'; }
  else if (avg >= 60) { rating = '🌻 充实人生'; ratingDesc = '你的人生充实而美好，有过欢笑也有过泪水，但都值得。'; }
  else if (avg >= 50) { rating = '🌿 普通人生'; ratingDesc = '和大多数人一样，你过了一个平凡但真实的人生。平平淡淡才是真。'; }
  else if (avg >= 35) { rating = '🌧️ 坎坷人生'; ratingDesc = '你的人生经历了不少波折，但你依然坚强地走到了最后。'; }
  else { rating = '💔 艰难人生'; ratingDesc = '命运对你不太公平，但你始终没有放弃。你的坚韧值得尊敬。'; }

  document.getElementById('endRating').textContent = rating;

  // 最终属性
  const statsHtml = STAT_CONFIG.map(cfg => {
    const val = s[cfg.key];
    return `
      <div class="end-stat-row">
        <span class="end-stat-icon">${cfg.icon}</span>
        <span class="end-stat-label">${cfg.label}</span>
        <div class="end-stat-bar">
          <div class="end-stat-fill" style="width:${val}%;background:${cfg.color}"></div>
        </div>
        <span class="end-stat-val" style="color:${cfg.color}">${val}</span>
      </div>
    `;
  }).join('');
  document.getElementById('endStats').innerHTML = statsHtml;

  // 评分
  const bestStat = STAT_CONFIG.reduce((a, b) => s[a.key] >= s[b.key] ? a : b);
  const worstStat = STAT_CONFIG.reduce((a, b) => s[a.key] <= s[b.key] ? a : b);
  document.getElementById('endScore').innerHTML = `
    综合评分：<strong style="color:var(--accent);font-size:20px">${avg}</strong> 分
    <br>最强属性：${bestStat.icon} ${bestStat.label}（${s[bestStat.key]}）
    · 最弱属性：${worstStat.icon} ${worstStat.label}（${s[worstStat.key]}）
  `;

  // 人生格言
  const flavors = [
    '「人生没有白走的路，每一步都算数。」',
    '「生命中最重要的不是长度，而是宽度和深度。」',
    '「活着就是不断地选择，而每个选择都塑造了现在的你。」',
    '「幸福不是拥有最多，而是计较最少。」',
    '「人生如棋，落子无悔。好好走完每一步就好。」',
    '「所谓人生，就是一场体验。体验过，就够了。」',
    '「命运给的牌不能选，但怎么打由你决定。」',
    '「人生的意义不在于拿到一手好牌，而在于打好一手坏牌。」'
  ];
  document.getElementById('endFlavor').textContent = flavors[Math.floor(Math.random() * flavors.length)];

  document.getElementById('endScreen').classList.add('active');

  // 动画延迟触发属性条
  setTimeout(() => {
    document.querySelectorAll('.end-stat-fill').forEach(el => {
      const w = el.style.width;
      el.style.width = '0%';
      setTimeout(() => { el.style.width = w; }, 100);
    });
  }, 300);
}

// ============================================================
// 初 始 化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  // 显示开始画面
  document.getElementById('startScreen').style.display = 'flex';
});
</script>
