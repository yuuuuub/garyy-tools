<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚢 海战棋</title>
<meta name="description" content="经典海战棋游戏，双人对战用战舰击沉对方舰队">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--correct:#2ea043;--wrong:#f85149}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;min-height:100vh;padding:16px}
.container{width:100%;max-width:600px;display:flex;flex-direction:column;gap:12px;align-items:center}
h1{font-size:1.5rem}
.boards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.board-wrap{text-align:center}
.board-wrap h3{font-size:.9rem;color:#8b949e;margin-bottom:6px}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;background:var(--border);border-radius:6px;overflow:hidden;width:100%;aspect-ratio:1}
.cell{background:var(--card);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.7rem;cursor:pointer;transition:.15s}
.cell:hover{background:rgba(59,130,246,.2)}
.cell.ship{background:#2a3a5a}
.cell.hit{background:var(--wrong);color:var(--text)}
.cell.miss{background:#333;color:#8b949e}
.cell.sunk{background:#7c1d1d}
.status{font-size:.95rem;text-align:center;min-height:24px;color:#8b949e}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:.85rem}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--text)}
.ships-info{font-size:.8rem;color:#8b949e;text-align:center}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🚢 海战棋">
  <meta property="og:description" content="经典海战棋游戏，双人对战用战舰击沉对方舰队">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/battleship/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<h1>🚢 海战棋</h1>
<div class="ships-info" id="shipsInfo">点击你的棋盘放置舰船 (2,3,3,4,5)</div>
<div class="boards">
<div class="board-wrap"><h2>你的舰队</h2><div class="board" id="myBoard"></div></div>
<div class="board-wrap"><h2>敌方海域</h2><div class="board" id="oppBoard"></div></div>
</div>
<div class="status" id="status">放置你的舰船</div>
<div class="controls">
<button class="primary" onclick="newGame()">新游戏</button>
<button onclick="randomPlace()">随机放置</button>
</div>
</div>
<script>
const N=10,SHIPS=[5,4,3,3,2];
let myGrid=[],oppGrid=[],phase='place',myShips=[],oppShips=[],currentShip=0,horizontal=true;
let myHits=0,oppHits=0,totalShipCells=SHIPS.reduce((a,b)=>a+b,0);

function init(){
myGrid=Array(N).fill(null).map(()=>Array(N).fill(0));
oppGrid=Array(N).fill(null).map(()=>Array(N).fill(0));
myShips=Array(SHIPS.length).fill(null).map(()=>[]);
oppShips=Array(SHIPS.length).fill(null).map(()=>[]);
phase='place';currentShip=0;myHits=0;oppHits=0;
placeOppShips();render();
}

function placeOppShips(){
SHIPS.forEach((size,idx)=>{
let placed=false;
while(!placed){
const h=Math.random()>.5,r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);
let ok=true;
for(let i=0;i<size;i++){
const nr=h?r:r+i,nc=h?c+i:c;
if(nr>=N||nc>=N||oppGrid[nr][nc]!==0){ok=false;break}
}
if(ok){for(let i=0;i<size;i++){const nr=h?r:r+i,nc=h?c+i:c;oppGrid[nr][nc]=idx+1;oppShips[idx].push({r:nr,c:nc})}placed=true}
}});
}

function render(){
const myDiv=document.getElementById('myBoard');
const oppDiv=document.getElementById('oppBoard');
myDiv.innerHTML='';oppDiv.innerHTML='';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){
const d1=document.createElement('div');d1.className='cell';
const v=myGrid[r][c];
if(v>0&&myHits&(1<<(r*N+c))){d1.classList.add('sunk');d1.textContent='✕'}
else if(myHits&(1<<(r*N+c))){d1.classList.add('miss');d1.textContent='•'}
else if(v>0){d1.classList.add('ship');d1.textContent='■'}
if(phase==='place')d1.onclick=()=>placeMyShip(r,c);
myDiv.appendChild(d1);

const d2=document.createElement('div');d2.className='cell';
const ov=oppGrid[r][c];
const hitKey=r*N+c;
if(oppHits&hitKey){d2.classList.add(ov>0?'hit':'miss');d2.textContent=ov>0?'✕':'•'}
if(phase==='attack')d2.onclick=()=>attack(r,c);
oppDiv.appendChild(d2);
}
}

function placeMyShip(r,c){
if(currentShip>=SHIPS.length)return;
const size=SHIPS[currentShip];
let ok=true;
for(let i=0;i<size;i++){
const nr=horizontal?r:r+i,nc=horizontal?c+i:c;
if(nr>=N||nc>=N||myGrid[nr][nc]!==0){ok=false;break}
}
if(!ok)return;
for(let i=0;i<size;i++){
const nr=horizontal?r:r+i,nc=horizontal?c+i:c;
myGrid[nr][nc]=currentShip+1;myShips[currentShip].push({r:nr,c:nc});
}
currentShip++;
if(currentShip>=SHIPS.length){
phase='attack';
document.getElementById('status').textContent='你的舰队部署完毕！开始攻击敌方海域！';
document.getElementById('shipsInfo').textContent='点击敌方海域开炮！';
}
render();
}

function randomPlace(){
myGrid=Array(N).fill(null).map(()=>Array(N).fill(0));
myShips=Array(SHIPS.length).fill(null).map(()=>[]);currentShip=0;
SHIPS.forEach((size,idx)=>{
let placed=false;
while(!placed){
const h=Math.random()>.5,r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);
let ok=true;
for(let i=0;i<size;i++){const nr=h?r:r+i,nc=h?c+i:c;if(nr>=N||nc>=N||myGrid[nr][nc]!==0){ok=false;break}}
if(ok){for(let i=0;i<size;i++){const nr=h?r:r+i,nc=h?c+i:c;myGrid[nr][nc]=idx+1;myShips[idx].push({r:nr,c:nc})}placed=true}
}});
currentShip=SHIPS.length;phase='attack';
document.getElementById('status').textContent='随机部署完毕！开始攻击！';
document.getElementById('shipsInfo').textContent='点击敌方海域开炮！';
render();
}

function attack(r,c){
if(oppHits&(1<<(r*N+c)))return;
if(oppGrid[r][c]>0){
oppHits|=(1<<(r*N+c));
const shipIdx=oppGrid[r][c]-1;
const sunk=oppShips[shipIdx].every(p=>oppHits&(1<<(p.r*N+p.c)));
if(sunk)document.getElementById('status').textContent='🎉 击沉敌舰！';
else document.getElementById('status').textContent='💥 命中！';
setTimeout(aiTurn,500);
}else{
oppHits|=(1<<(r*N+c));
document.getElementById('status').textContent='🌊 未命中';
setTimeout(aiTurn,500);
}
render();
checkWin();
}

function aiTurn(){
let targets=[];
for(let r=0;r<N;r++)for(let c=0;c<N;c++){
if(!(myHits&(1<<(r*N+c)))){
let score=1;
if(r>0&&(myHits&((1<<((r-1)*N+c))))&&myGrid[r-1][c]===0)score=5;
if(r<N-1&&(myHits&((1<<((r+1)*N+c))))&&myGrid[r+1][c]===0)score=5;
if(c>0&&(myHits&((1<<(r*N+c-1))))&&myGrid[r][c-1]===0)score=5;
if(c<N-1&&(myHits&((1<<(r*N+c+1))))&&myGrid[r][c+1]===0)score=5;
targets.push({r,c,score});
}}
targets.sort((a,b)=>b.score-a.score);
if(targets.length){
const t=targets[0];
myHits|=(1<<(t.r*N+t.c));
if(myGrid[t.r][t.c]>0)document.getElementById('status').textContent+=' 敌方命中你的船！';
}
render();checkWin();
}

function checkWin(){
let myLost=true,oppLost=true;
for(let r=0;r<N;r++)for(let c=0;c<N;c++){
if(myGrid[r][c]>0&&!(myHits&(1<<(r*N+c))))myLost=false;
if(oppGrid[r][c]>0&&!(oppHits&(1<<(r*N+c))))oppLost=false;
}
if(oppLost){phase='end';document.getElementById('status').textContent='🎉 你赢了！消灭了所有敌舰！'}
else if(myLost){phase='end';document.getElementById('status').textContent='💀 你输了！你的舰队全灭'}
}

function newGame(){init();document.getElementById('status').textContent='放置你的舰船';document.getElementById('shipsInfo').textContent='点击你的棋盘放置舰船 (2,3,3,4,5)'}
init();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
