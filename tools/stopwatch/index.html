<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秒表 - garyy-tools</title>
<meta name="description" content="在线秒表工具，精确计时精确到毫秒">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;margin-bottom:4px}
.sub{color:var(--text2);font-size:.85rem}
button{padding:9px 20px;border-radius:6px;border:none;background:var(--blue);color:#fff;font-size:.85rem;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.85}
button:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.9rem;width:100%;outline:none;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-gold{background:var(--gold);color:#000}
.time-display{font-size:3rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px;padding:20px 0;font-family:'Courier New',monospace}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.lap-list{list-style:none;max-height:300px;overflow-y:auto}
.lap-list li{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);font-size:.9rem}
.lap-list li:last-child{border-bottom:none}
.lap-list .lap-num{color:var(--text2)}
.lap-list .lap-time{font-family:'Courier New',monospace}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="秒表 - garyy-tools">
  <meta property="og:description" content="在线秒表工具，精确计时精确到毫秒">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/stopwatch/">
</head>
<body>
<div class="container">
<header>
<h1>⏱️ 秒表</h1>
<div class="sub">精确计时</div>
</header>

<div class="card">
<div class="time-display" id="display">00:00.00</div>
<div class="controls">
<button class="btn-green" id="btnStart">开始</button>
<button class="btn-gold" id="btnLap" disabled>计次</button>
<button class="btn-red" id="btnReset">重置</button>
</div>
</div>

<div class="card">
<h2 style="margin-bottom:12px;font-size:.95rem;color:var(--text2)">计次记录</h2>
<ul class="lap-list" id="lapList">
<li style="color:var(--text2);text-align:center;justify-content:center">暂无计次</li>
</ul>
</div>
</div>

<script>
(function(){
'use strict';
const display=document.getElementById('display');
const btnStart=document.getElementById('btnStart');
const btnLap=document.getElementById('btnLap');
const btnReset=document.getElementById('btnReset');
const lapList=document.getElementById('lapList');

let running=false;
let startTime=0;
let elapsed=0;
let timerId=null;
let lapCount=0;
let lastLapTime=0;

function formatTime(ms){
const total=Math.floor(ms/10);
const minutes=String(Math.floor(total/6000)).padStart(2,'0');
const seconds=String(Math.floor((total%6000)/100)).padStart(2,'0');
const centiseconds=String(total%100).padStart(2,'0');
return minutes+':'+seconds+'.'+centiseconds;
}

function updateDisplay(){
const now=running?Date.now()-startTime+elapsed:elapsed;
display.textContent=formatTime(now);
}

function tick(){
updateDisplay();
timerId=requestAnimationFrame(tick);
}

function start(){
if(running)return;
running=true;
startTime=Date.now();
tick();
btnStart.textContent='暂停';
btnStart.className='btn-gold';
btnLap.disabled=false;
}

function pause(){
if(!running)return;
running=false;
elapsed+=Date.now()-startTime;
cancelAnimationFrame(timerId);
btnStart.textContent='继续';
btnStart.className='btn-green';
}

function reset(){
running=false;
cancelAnimationFrame(timerId);
elapsed=0;
startTime=0;
lapCount=0;
lastLapTime=0;
updateDisplay();
btnStart.textContent='开始';
btnStart.className='btn-green';
btnLap.disabled=true;
lapList.innerHTML='<li style="color:var(--text2);text-align:center;justify-content:center">暂无计次</li>';
}

function addLap(){
if(!running)return;
const now=Date.now()-startTime+elapsed;
const lapTime=now-lastLapTime;
lapCount++;
const li=document.createElement('li');
li.innerHTML='<span class="lap-num">计次 '+lapCount+'</span><span class="lap-time">'+formatTime(now)+' (+'+formatTime(lapTime)+')</span>';
if(lapList.children[0]&&lapList.children[0].textContent==='暂无计次'){
lapList.innerHTML='';
}
lapList.insertBefore(li,lapList.firstChild);
lastLapTime=now;
}

btnStart.addEventListener('click',function(){
if(running){pause();}else{start();}
});
btnLap.addEventListener('click',addLap);
btnReset.addEventListener('click',reset);

updateDisplay();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
