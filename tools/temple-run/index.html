<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神庙逃亡</title>
<meta name="description" content="神庙逃亡跑酷游戏，在神庙中奔跑躲避障碍">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
body{background:var(--bg);color:var(--text);font-family:sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{border:2px solid var(--border);border-radius:8px;display:block}
.ui{display:flex;gap:16px;margin-bottom:12px;font-size:14px}
.ui span{background:var(--card);padding:6px 14px;border-radius:6px;border:1px solid var(--border)}
.btn{background:var(--accent);color:var(--text);border:none;padding:10px 24px;border-radius:6px;font-size:16px;cursor:pointer;margin-top:12px}
.btn:hover{opacity:.85}
#overlay{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,17,23,.9);border-radius:12px;padding:32px;text-align:center}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="神庙逃亡">
  <meta property="og:description" content="神庙逃亡跑酷游戏，在神庙中奔跑躲避障碍">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/temple-run/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<h1 style="text-align:center;padding:20px 0;font-size:1.5rem">神庙逃亡</h1>
<div class="ui">
<span id="scoreText">分数: 0</span>
<span id="coinsText">金币: 0</span>
<span id="speedText">速度: 1.0x</span>
</div>
<div style="position:relative">
<canvas id="c" width="400" height="600"></canvas>
<div id="overlay">
<h2>神庙逃亡</h2>
<p style="margin:10px 0;color:#8b949e">3D透视逃跑，左右切换跑道，上滑跳跃下滑翻滚！</p>
<button class="btn" onclick="startGame()">开始游戏</button>
<p style="margin-top:8px;font-size:12px;color:#8b949e">← → 切换跑道 | ↑ 跳跃 | ↓ 翻滚</p>
</div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=400,H=600,LANES=3;
let player,obstacles,coins,speed,baseSpeed,distance,score,coinCount,gameState='idle',animFrame;
const overlay=document.getElementById('overlay');
function laneToX(lane,depth){
  const cx=W/2,spread=120*(1-depth*0.02);
  return cx+(lane-1)*spread*(0.3+depth*0.7);
}
function init(){
  player={lane:1,vy:0,onGround:true,rolling:false,rollTimer:0,animY:0};
  obstacles=[];coins=[];speed=5;baseSpeed=5;distance=0;score=0;coinCount=0;
}
function startGame(){
  init();gameState='playing';overlay.style.display='none';
  if(animFrame)cancelAnimationFrame(animFrame);loop();
}
function spawnObstacle(){
  const lane=Math.floor(Math.random()*LANES);
  const types=['barrier','fire'];
  const t=types[Math.floor(Math.random()*types.length)];
  obstacles.push({lane,y:H+50,h:t==='fire'?30:50,type:t});
}
function spawnCoin(){
  const lane=Math.floor(Math.random()*LANES);
  coins.push({lane,y:H+50,r:8});
}
function update(){
  const p=player;
  speed=baseSpeed+distance*0.0002;
  distance+=speed;score=Math.floor(distance/5);
  p.vy+=0.8;p.animY+=p.vy;
  const groundY=0;
  if(p.animY>=groundY){p.animY=groundY;p.vy=0;p.onGround=true}
  if(p.rolling){p.rollTimer--;if(p.rollTimer<=0)p.rolling=false}
  if(Math.random()<0.03)spawnObstacle();
  if(Math.random()<0.05)spawnCoin();
  for(const o of obstacles){o.y-=speed*0.8}
  for(const c of coins){c.y-=speed*0.8}
  while(obstacles.length&&obstacles[0].y<-100)obstacles.shift();
  while(coins.length&&coins[0].y<-30)coins.shift();
  const pDepth=(H-80-p.animY);
  for(const o of obstacles){
    if(o.lane===p.lane&&Math.abs(o.y-(H-80))<30){
      if(p.rolling&&o.type==='barrier')continue;
      gameState='dead';
      showOverlay('游戏结束','分数: '+score+' | 金币: '+coinCount,'重新开始');return;
    }
  }
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    if(c.lane===p.lane&&Math.abs(c.y-(H-80))<25){coinCount++;coins.splice(i,1);score+=10}
  }
}
function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
  const vx=W/2,vy=80;
  ctx.fillStyle='#161b22';
  ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(vx-20,vy);ctx.lineTo(vx+20,vy);ctx.lineTo(W,H);ctx.fill();
  ctx.strokeStyle='#30363d';ctx.lineWidth=1;
  for(let i=0;i<3;i++){
    const x1=laneToX(i,0),x2=laneToX(i,1);
    ctx.beginPath();ctx.moveTo(x1,H);ctx.lineTo(x2,vy);ctx.stroke();
  }
  const allObj=[];
  for(const o of obstacles)allObj.push({...o,kind:'obs',depth:o.y});
  for(const c of coins)allObj.push({...c,kind:'coin',depth:c.y});
  allObj.sort((a,b)=>b.depth-a.depth);
  for(const obj of allObj){
    const t=1-obj.depth/(H+50);
    const sz=0.3+t*0.7;
    const x=laneToX(obj.lane,t);
    const screenY=H-(H-vy)*t;
    if(obj.kind==='obs'){
      ctx.fillStyle=obj.type==='fire'?'#f85149':'#30363d';
      const w=40*sz,h=obj.h*sz;
      ctx.fillRect(x-w/2,screenY-h,w,h);
      if(obj.type==='fire'){
        ctx.fillStyle='#f0883e';ctx.fillRect(x-w/2+5,screenY-h+5,w-10,h-10);
      }
    }else{
      ctx.fillStyle='#f0c000';ctx.beginPath();ctx.arc(x,screenY,8*sz,0,Math.PI*2);ctx.fill();
    }
  }
  const p=player;
  const px=laneToX(p.lane,0.85);
  const py=H-80+p.animY*0.3;
  if(p.rolling){
    ctx.fillStyle='#3b82f6';ctx.beginPath();ctx.arc(px,py,18,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='#3b82f6';ctx.fillRect(px-14,py-45,28,45);
    ctx.fillStyle='#fff';ctx.fillRect(px-7,py-37,5,5);ctx.fillRect(px+2,py-37,5,5);
    ctx.fillStyle='#3b82f6';
    const leg=Math.sin(Date.now()*0.012)*5;
    ctx.fillRect(px-10,py,6,10+leg);ctx.fillRect(px+4,py,6,10-leg);
  }
  document.getElementById('scoreText').textContent='分数: '+score;
  document.getElementById('coinsText').textContent='金币: '+coinCount;
  document.getElementById('speedText').textContent='速度: '+(speed/baseSpeed).toFixed(1)+'x';
}
function showOverlay(title,desc,btnText){
  overlay.querySelector('h2').textContent=title;
  overlay.querySelector('p').textContent=desc;
  overlay.querySelector('.btn').textContent=btnText;
  overlay.style.display='flex';
}
function jump(){if(gameState!=='playing')return;if(player.onGround){player.vy=-14;player.onGround=false}}
function roll(){if(gameState!=='playing'||!player.onGround)return;player.rolling=true;player.rollTimer=25}
function switchLane(d){if(gameState!=='playing')return;const n=player.lane+d;if(n>=0&&n<LANES)player.lane=n}
function loop(){
  if(gameState!=='playing')return;update();draw();animFrame=requestAnimationFrame(loop);
}
document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft')switchLane(-1);if(e.code==='ArrowRight')switchLane(1);
  if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='ArrowDown')roll();
});
canvas.addEventListener('touchstart',e=>{e.preventDefault();canvas._tx=e.touches[0].clientX;canvas._ty=e.touches[0].clientY});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-canvas._tx,dy=e.changedTouches[0].clientY-canvas._ty;
  if(Math.abs(dx)>Math.abs(dy))switchLane(dx>0?1:-1);
  else if(dy<-30)jump();else if(dy>30)roll();
});
init();draw();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
