<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>专业围棋</title><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#8b5cf6;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8em;margin-bottom:8px;text-align:center}
.subtitle{color:#8b949e;margin-bottom:20px;text-align:center;font-size:.9em}
.game-area{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:100%;margin-bottom:16px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:1em;transition:all .2s}
.btn:hover{opacity:.9;transform:scale(1.02)}
.btn:active{transform:scale(.98)}
.btn-sm{padding:6px 14px;font-size:.85em}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-yellow{background:var(--yellow);color:#000}.btn-orange{background:var(--orange)}
.flex{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;gap:4px}
.info{text-align:center;color:#8b949e;margin:12px 0;font-size:.95em}
.result{text-align:center;font-size:1.2em;margin:16px 0;padding:16px;border-radius:8px;background:var(--bg);min-height:40px}
.token{display:inline-block;padding:4px 10px;margin:3px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.token:hover{border-color:var(--accent)}
.token.active{background:var(--accent);border-color:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media(max-width:480px){body{padding:12px}.game-area{padding:16px}h1{font-size:1.4em}}
</style></head><body>
<h1>专业围棋</h1><p class="subtitle">19路围棋对弈</p>
<div class="game-area"><div id="board" style="margin:0 auto;width:fit-content"></div>
<div class="info" id="info">黑方先行 | 黑:0 白:0</div>
<div class="flex"><button class="btn" onclick="initGo()">新游戏</button><button class="btn btn-red" onclick="passMove()">停一手</button></div>
<script>
const S=19;let grid,turn=1,cap={1:0,-1:0};
function initGo(){grid=Array(S).fill(null).map(()=>Array(S).fill(0));turn=1;cap={1:0,-1:0};render();}
function render(){const d=document.getElementById('board');d.innerHTML='';d.style.display='grid';d.style.gridTemplateColumns='repeat('+S+',24px)';
for(let r=0;r<S;r++)for(let c=0;c<S;c++){const cell=document.createElement('div');
cell.style.cssText='width:24px;height:24px;position:relative;cursor:pointer';
const bg=document.createElement('div');bg.style.cssText='position:absolute;inset:0;border:0.5px solid #555;background:#dcb35c';cell.appendChild(bg);
if(grid[r][c]!==0){const st=document.createElement('div');
st.style.cssText='position:absolute;width:22px;height:22px;border-radius:50%;left:1px;top:1px;background:'+(grid[r][c]===1?'#111':'#eee')+';box-shadow:1px 1px 2px rgba(0,0,0,.5)';cell.appendChild(st);}
cell.onclick=()=>playG(r,c);d.appendChild(cell);}}updateInfo();}
function playG(r,c){if(grid[r][c]!==0)return;grid[r][c]=turn;
const adj=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
for(const[nr,nc]of adj)if(nr>=0&&nr<S&&nc>=0&&nc<S&&grid[nr][nc]===-turn){if(countL(nr,nc)===0){remG(nr,nc);cap[turn]++;}}
if(countL(r,c)===0){grid[r][c]=0;return;}turn=-turn;render();}
function countL(r,c){const col=grid[r][c],vis=new Set();let libs=0;
function dfs(x,y){const k=x+','+y;if(vis.has(k))return;vis.add(k);
if(x<0||x>=S||y<0||y>=S)return;if(grid[x][y]===0){libs++;return;}if(grid[x][y]!==col)return;
dfs(x-1,y);dfs(x+1,y);dfs(x,y-1);dfs(x,y+1);}dfs(r,c);return libs;}
function remG(r,c){const col=grid[r][c],vis=new Set();
function dfs(x,y){const k=x+','+y;if(vis.has(k))return;vis.add(k);
if(x<0||x>=S||y<0||y>=S||grid[x][y]!==col)return;grid[x][y]=0;dfs(x-1,y);dfs(x+1,y);dfs(x,y-1);dfs(x,y+1);}dfs(r,c);}
function passMove(){turn=-turn;render();}
function updateInfo(){document.getElementById('info').textContent=(turn===1?'黑':'白')+'方回合 | 黑:'+cap[1]+' 白:'+cap[-1];}
initGo();</script>
</div></body></html>
