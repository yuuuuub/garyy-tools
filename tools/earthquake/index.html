<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球地震监测</title>
<meta name="description" content="全球地震实时监测，查看全球地震活动数据">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;color:var(--text)}
.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.refresh-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.85rem;transition:.2s}
.refresh-btn:hover{background:#1c2333;border-color:var(--blue)}
.loading{text-align:center;padding:60px 0}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:.85rem}
.error{text-align:center;padding:40px 0;color:var(--red);font-size:.9rem}
.retry-btn{margin-top:10px;padding:8px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.85rem}
.info-bar{text-align:center;padding:12px 0;color:var(--text2);font-size:.82rem}
.quake-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.quake-item{display:grid;grid-template-columns:70px 1fr 80px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;gap:10px}
.quake-mag{font-size:1.1rem;font-weight:700;text-align:center;padding:4px 0;border-radius:6px;width:60px;text-align:center}
.quake-mag.major{color:#ef4444;background:rgba(239,68,68,.15)}
.quake-mag.strong{color:#f97316;background:rgba(249,115,22,.15)}
.quake-mag.moderate{color:#f59e0b;background:rgba(245,158,11,.15)}
.quake-mag.minor{color:#3b82f6;background:rgba(59,130,246,.15)}
.quake-info{display:flex;flex-direction:column}
.quake-place{font-size:.9rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quake-time{font-size:.78rem;color:var(--text2);margin-top:2px}
.quake-depth{font-size:.82rem;color:var(--text2);text-align:right;justify-self:end}
@media(max-width:600px){
.quake-item{grid-template-columns:60px 1fr 60px;padding:10px 12px;gap:6px}
.quake-mag{width:50px;font-size:1rem}
.quake-place{font-size:.82rem}
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="全球地震监测">
  <meta property="og:description" content="全球地震实时监测，查看全球地震活动数据">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/earthquake/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
<header>
<h1>🌎 全球地震监测</h1>
<p class="sub">USGS · 实时地震数据（2.5级以上，过去24小时）</p>
<button class="refresh-btn" onclick="loadData()">🔄 刷新数据</button>
</header>
<div id="app"></div>
</div>
<script>
function eH(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
(function(){
'use strict';
var app=document.getElementById('app');
function magClass(mag){
if(mag>=6)return 'major';
if(mag>=5)return 'strong';
if(mag>=4)return 'moderate';
return 'minor';
}
function timeAgo(ts){
var seconds=Math.floor((Date.now()-new Date(ts).getTime())/1000);
if(seconds<60)return '刚刚';
var mins=Math.floor(seconds/60);
if(mins<60)return mins+'分钟前';
var hours=Math.floor(mins/60);
if(hours<24)return hours+'小时前';
var days=Math.floor(hours/24);
return days+'天前';
}
window.loadData=function(){
app.innerHTML='<div class="loading"><div class="spinner"></div><p>加载地震数据...</p></div>';
fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson')
.then(function(r){if(!r.ok)throw new Error('请求失败 ('+r.status+')');return r.json();})
.then(function(data){
var features=data.features;
if(!features||!features.length){
app.innerHTML='<div class="error"><p>暂无数据</p></div>';return;
}
var total=features.length;
var html='<div class="info-bar">共监测到 '+total+' 次地震</div>';
html+='<div class="quake-list">';
features.slice(0,50).forEach(function(f){
var props=f.properties;
var coords=f.geometry.coordinates;
var mag=props.mag||0;
var place=props.place||'未知位置';
var time=props.time;
var depth=coords[2];
var cls=magClass(mag);
html+='<div class="quake-item">';
html+='<div class="quake-mag '+cls+'">'+mag.toFixed(1)+'</div>';
html+='<div class="quake-info"><span class="quake-place">'+eH(place)+'</span><span class="quake-time">'+timeAgo(time)+'</span></div>';
html+='<span class="quake-depth">'+depth.toFixed(1)+' km</span>';
html+='</div>';
});
html+='</div>';
if(features.length>50){
html+='<div class="info-bar">仅显示最近50条</div>';
}
app.innerHTML=html;
})
.catch(function(e){
app.innerHTML='<div class="error"><p>⚠️ '+e.message+'</p><button class="retry-btn" onclick="loadData()">重试</button></div>';
});
};
loadData();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
