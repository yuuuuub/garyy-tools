<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>药店查找 - Pharmacy Finder</title>
<meta name="description" content="药店查找工具，定位附近的药店和药房">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--muted:#8b949e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 0}
header h1{font-size:1.8em;margin-bottom:4px}
header p{color:var(--muted)}
.filters{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.filter-group label{font-size:12px;color:var(--muted);font-weight:600}
.filter-group input,.filter-group select{background:#0d1117;border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px;width:100%}
.filter-group input:focus,.filter-group select:focus{outline:none;border-color:var(--accent)}
.sort-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.sort-bar span{color:var(--muted);font-size:14px}
.sort-options{display:flex;gap:8px}
.sort-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.sort-btn.active{background:var(--accent);border-color:var(--accent)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card h3{font-size:16px;margin-bottom:8px}
.card-info{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);margin-bottom:10px}
.card-info span{display:flex;align-items:center;gap:6px}
.badge-24h{font-size:11px;padding:3px 8px;border-radius:12px;background:rgba(34,197,94,.15);color:var(--green);font-weight:600;display:inline-block;margin-bottom:6px}
.badge-normal{font-size:11px;padding:3px 8px;border-radius:12px;background:rgba(59,130,246,.15);color:var(--accent);font-weight:600;display:inline-block;margin-bottom:6px}
.services{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.svc-tag{font-size:11px;background:rgba(59,130,246,.1);color:var(--accent);padding:2px 8px;border-radius:10px}
.distance{font-size:12px;color:var(--green);font-weight:600;margin-top:6px}
.no-results{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:640px){.results{grid-template-columns:1fr}.filters{flex-direction:column}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="药店查找 - Pharmacy Finder">
  <meta property="og:description" content="药店查找工具，定位附近的药店和药房">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/pharmacy-finder/">
</head>
<body>
<div class="container">
<header><h1>💊 药店查找</h1><p>查找附近药店，方便快捷购药</p></header>
<div class="filters">
<div class="filter-group" style="flex:2"><label>搜索</label><input type="text" id="search" placeholder="输入药店名称或地址..."></div>
<div class="filter-group"><label>营业时间</label><select id="hourFilter"><option value="">全部</option><option value="24h">24小时</option><option value="day">日间营业</option></select></div>
<div class="filter-group"><label>服务类型</label><select id="serviceFilter"><option value="">全部</option><option value="处方药">处方药</option><option value="OTC">OTC非处方药</option><option value="中药">中药</option><option value="医保">医保刷卡</option></select></div>
</div>
<div class="sort-bar"><span id="resultCount"></span><div class="sort-options"><button class="sort-btn active" data-sort="distance">距离优先</button><button class="sort-btn" data-sort="rating">评分优先</button><button class="sort-btn" data-sort="name">名称排序</button></div></div>
<div class="results" id="results"></div>
</div>
<script>
const pharmacies=[
{id:1,name:"同仁堂(王府井店)",address:"东城区王府井大街188号",rating:4.7,phone:"010-65240388",hours:"08:00-22:00",is24h:false,distance:0.5,services:["处方药","OTC","中药","医保"],description:"百年老字号中药品牌，品质保证"},
{id:2,name:"海王星辰(中关村店)",address:"海淀区中关村大街15号",rating:4.3,phone:"010-82619988",hours:"24小时",is24h:true,distance:1.2,services:["处方药","OTC","医保"],description:"全国连锁药店，24小时服务"},
{id:3,name:"大参林(天河店)",address:"天河区天河路228号",rating:4.4,phone:"020-85591688",hours:"08:30-22:30",is24h:false,distance:0.8,services:["处方药","OTC","中药"],description:"华南地区大型连锁药店"},
{id:4,name:"益丰药房(南京路店)",address:"黄浦区南京东路800号",rating:4.5,phone:"021-63516888",hours:"24小时",is24h:true,distance:1.5,services:["处方药","OTC","医保","中药"],description:"上市公司连锁品牌，药品种类齐全"},
{id:5,name:"老百姓大药房(解放碑店)",address:"渝中区解放碑民权路28号",rating:4.2,phone:"023-63762888",hours:"08:00-23:00",is24h:false,distance:0.6,services:["处方药","OTC","医保"],description:"平价大药房，药品价格实惠"},
{id:6,name:"一心堂(翠湖店)",address:"五华区翠湖南路2号",rating:4.6,phone:"0871-65156888",hours:"24小时",is24h:true,distance:2.0,services:["处方药","OTC","中药","医保"],description:"云南本土龙头药店，品种丰富"},
{id:7,name:"国大药房(人民路店)",address:"天桥区泉城路268号",rating:4.3,phone:"0531-86016888",hours:"08:00-21:30",is24h:false,distance:1.0,services:["处方药","OTC","医保"],description:"山东知名连锁药店"},
{id:8,name:"漱玉平民(泉城广场店)",address:"历下区泉城路168号",rating:4.4,phone:"0531-86116888",hours:"24小时",is24h:true,distance:1.8,services:["处方药","OTC","中药","医保"],description:"山东大型医药连锁，服务周到"},
{id:9,name:"北京同仁堂(亦庄店)",address:"大兴区宏达北路8号",rating:4.5,phone:"010-67866888",hours:"09:00-21:00",is24h:false,distance:3.2,services:["处方药","OTC","中药"],description:"同仁堂分店，中药特色服务"},
{id:10,name:"老百姓大药房(西直门店)",address:"西城区西直门内大街148号",rating:4.1,phone:"010-66156888",hours:"07:30-23:30",is24h:false,distance:0.9,services:["处方药","OTC","医保"],description:"社区平价药房，便民服务"}
];
let currentSort="distance";
function render(){
const q=document.getElementById("search").value.toLowerCase();
const hf=document.getElementById("hourFilter").value;
const sf=document.getElementById("serviceFilter").value;
let filtered=pharmacies.filter(p=>{
if(q&&!p.name.includes(q)&&!p.address.includes(q))return false;
if(hf==="24h"&&!p.is24h)return false;
if(hf==="day"&&p.is24h)return false;
if(sf&&!p.services.includes(sf))return false;
return true;
});
filtered.sort({distance:(a,b)=>a.distance-b.distance,rating:(a,b)=>b.rating-a.rating,name:(a,b)=>a.name.localeCompare(b.name,"zh")}[currentSort]||(a,b)=>a.distance-b.distance);
document.getElementById("resultCount").textContent=`找到 ${filtered.length} 家药店`;
const c=document.getElementById("results");
if(!filtered.length){c.innerHTML='<div class="no-results"><p>未找到符合条件的药店</p></div>';return}
c.innerHTML=filtered.map(p=>`<div class="card"><h3>${p.name}</h3>${p.is24h?'<span class="badge-24h">🏪 24小时营业</span>':'<span class="badge-normal">🕐 日间营业</span>'}<div class="card-info"><span>📍 ${p.address}</span><span>📞 ${p.phone}</span><span>🕐 ${p.hours}</span><span>⭐ ${p.rating}</span></div><p style="font-size:13px;color:var(--muted);margin-bottom:8px">${p.description}</p><div class="services">${p.services.map(s=>`<span class="svc-tag">${s}</span>`).join("")}</div><div class="distance">📍 距您 ${p.distance}km</div></div>`).join("")
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("hourFilter").addEventListener("change",render);
document.getElementById("serviceFilter").addEventListener("change",render);
document.querySelectorAll(".sort-btn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".sort-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentSort=b.dataset.sort;render()}));
render();
</script>
<script src="../i18n.js"></script>
</body>
</html>
