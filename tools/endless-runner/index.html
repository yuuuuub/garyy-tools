<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无尽跑酷</title>
<meta name="description" content="无尽跑酷游戏，控制角色不断奔跑躲避障碍">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
body{background:var(--bg);color:var(--text);font-family:sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{border:2px solid var(--border);border-radius:8px;display:block}
.ui{display:flex;gap:16px;margin-bottom:12px;font-size:14px}
.ui span{background:var(--card);padding:6px 14px;border-radius:6px;border:1px solid var(--border)}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:6px;font-size:16px;cursor:pointer;margin-top:12px}
.btn:hover{opacity:.85}
#overlay{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,17,23,.9);border-radius:12px;padding:32px;text-align:center}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="无尽跑酷">
  <meta property="og:description" content="无尽跑酷游戏，控制角色不断奔跑躲避障碍">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/endless-runner/">
</head>
<body>
<div class="ui">
<span id="scoreText">分数: 0</span>
<span id="speedText">速度: 1.0x</span>
<span id="bestText">最高: 0</span>
</div>
<div style="position:relative">
<canvas id="c" width="420" height="600"></canvas>
<div id="overlay">
<h2>无尽跑酷</h2>
<p style="margin:10px 0;color:#8b949e">无尽奔跑跳跃，左右切换跑道，速度越来越快！</p>
<button class="btn" onclick="startGame()">开始游戏</button>
<p style="margin-top:8px;font-size:12px;color:#8b949e">← → 切换跑道 | 空格/↑ 跳跃 | ↓ 下滑</p>
</div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=420,H=600,LANES=3,LANE_W=80,LANE_X=[80,170,260];
const GRAVITY=0.7,JUMP=-13;
let player,obstacles,obstacleTimer,speed,baseSpeed,distance,score,bestScore=0,gameState='idle',animFrame;
const overlay=document.getElementById('overlay');

function init(){
  player={lane:1,y:H-120,vy:0,onGround:true,rolling:false,rollTimer:0};
  obstacles=[];obstacleTimer=0;speed=4;baseSpeed=4;distance=0;score=0;
}

function startGame(){
  init();gameState='playing';overlay.style.display='none';
  if(animFrame)cancelAnimationFrame(animFrame);loop();
}

function spawnObstacle(){
  const lane=Math.floor(Math.random()*LANES);
  const types=['block','low','high'];
  const t=types[Math.floor(Math.random()*types.length)];
  let h=40,y=H-40;
  if(t==='low'){h=25;y=H-25}
  if(t==='high'){h=50;yu=H-100}
  obstacles.push({lane,x:LANE_X[lane],y:t==='high'?H-140:H-40,w:60,h:40,type:t,passed:false});
}

function update(){
  const p=player;
  speed=baseSpeed+distance*0.0003;
  distance+=speed;score=Math.floor(distance/5);
  obstacleTimer++;
  if(obstacleTimer>60-Math.min(speed,10)*3){spawnObstacle();obstacleTimer=0}
  for(const o of obstacles){o.y-=speed;if(!o.passed&&o.y+p.y>400)o.passed=true}
  while(obstacles.length&&obstacles[0].y<-80)obstacles.shift();
  // gravity
  p.vy+=GRAVITY;p.y+=p.vy;
  const groundY=H-120;
  if(p.y>=groundY){p.y=groundY;p.vy=0;p.onGround=true}
  // roll
  if(p.rolling){p.rollTimer--;if(p.rollTimer<=0)p.rolling=false}
  // collision
  const px=LANE_X[p.lane];
  for(const o of obstacles){
    if(o.lane===p.lane){
      const pH=p.rolling?20:40;
      if(Math.abs(p.y-40-(o.y))<pH&&Math.abs(px-40-o.x)<50){
        gameState='dead';if(score>bestScore)bestScore=score;
        showOverlay('游戏结束','分数: '+score,'重新开始');return;
      }
    }
  }
}

function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
  // lanes
  for(let i=0;i<LANES;i++){
    const x=LANE_X[i];
    ctx.fillStyle='#161b22';ctx.fillRect(x-30,0,60,H);
    ctx.strokeStyle='#21262d';ctx.setLineDash([10,10]);
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);
  }
  // obstacles
  for(const o of obstacles){
    if(o.type==='high'){
      ctx.fillStyle='#f85149';ctx.fillRect(o.x-25,o.y,50,40);
      ctx.fillStyle='#da3633';ctx.fillRect(o.x-20,o.y+5,40,8);
    }else if(o.type==='low'){
      ctx.fillStyle='#f0883e';ctx.fillRect(o.x-25,o.y,50,25);
    }else{
      ctx.fillStyle='#30363d';ctx.fillRect(o.x-25,o.y,50,40);
      ctx.strokeStyle='#f85149';ctx.lineWidth=2;ctx.strokeRect(o.x-25,o.y,50,40);
    }
  }
  // player
  const p=player,px=LANE_X[p.lane];
  if(p.rolling){
    ctx.fillStyle='#3b82f6';ctx.beginPath();ctx.arc(px,p.y,15,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='#3b82f6';ctx.fillRect(px-15,p.y-40,30,40);
    ctx.fillStyle='#fff';ctx.fillRect(px-8,p.y-32,5,5);ctx.fillRect(px+3,p.y-32,5,5);
    // legs
    const leg=Math.sin(Date.now()*0.01)*3;
    ctx.fillRect(px-10,p.y,6,8+leg);ctx.fillRect(px+4,p.y,6,8-leg);
  }
  // UI
  document.getElementById('scoreText').textContent='分数: '+score;
  document.getElementById('speedText').textContent='速度: '+(speed/baseSpeed).toFixed(1)+'x';
  document.getElementById('bestText').textContent='最高: '+bestScore;
}

function showOverlay(title,desc,btnText){
  overlay.querySelector('h2').textContent=title;
  overlay.querySelector('p').textContent=desc;
  overlay.querySelector('.btn').textContent=btnText;
  overlay.style.display='flex';
}

function jump(){
  if(gameState!=='playing')return;
  if(player.onGround){player.vy=JUMP;player.onGround=false}
}

function switchLane(dir){
  if(gameState!=='playing')return;
  const newLane=player.lane+dir;
  if(newLane>=0&&newLane<LANES)player.lane=newLane;
}

function roll(){
  if(gameState!=='playing'||!player.onGround)return;
  player.rolling=true;player.rollTimer=30;
}

function loop(){
  if(gameState!=='playing')return;
  update();draw();animFrame=requestAnimationFrame(loop);
}

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')switchLane(-1);
  if(e.code==='ArrowRight'||e.code==='KeyD')switchLane(1);
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jump();
  if(e.code==='ArrowDown'||e.code==='KeyS')roll();
});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];
  canvas._tx=t.clientX;canvas._ty=t.clientY;
});
canvas.addEventListener('touchend',e=>{
  const t=e.changedTouches[0];
  const dx=t.clientX-canvas._tx,dy=t.clientY-canvas._ty;
  if(Math.abs(dx)>Math.abs(dy)){switchLane(dx>0?1:-1)}
  else if(dy<-30)jump();
  else if(dy>30)roll();
});

init();draw();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
