<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🧮 计算器</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --btn-num: #ffffff;
      --btn-op: #ff9f0a;
      --btn-func: #e5e5ea;
      --btn-sci: #d1d1d6;
      --text: #1c1c1e;
      --text-secondary: #8e8e93;
      --display-bg: #f9f9fb;
      --shadow: rgba(0,0,0,.08);
      --border: rgba(0,0,0,.06);
      --history-bg: #f9f9fb;
      --history-hover: #e8e8ed;
    }

    body.dark {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --btn-num: #2c2c2e;
      --btn-op: #ff9f0a;
      --btn-func: #48484a;
      --btn-sci: #3a3a3c;
      --text: #ffffff;
      --text-secondary: #98989d;
      --display-bg: #1c1c1e;
      --shadow: rgba(0,0,0,.4);
      --border: rgba(255,255,255,.08);
      --history-bg: #2c2c2e;
      --history-hover: #3a3a3c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex; flex-direction: column; align-items: center;
      min-height: 100dvh; padding: 16px 12px;
      transition: background .3s, color .3s;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }

    .calc-wrapper {
      width: 100%; max-width: 380px;
      background: var(--card-bg);
      border-radius: 28px;
      padding: 20px 14px 24px;
      box-shadow: 0 8px 40px var(--shadow);
      transition: background .3s, box-shadow .3s;
      display: flex; flex-direction: column; gap: 14px;
    }

    /* Display */
    .display {
      background: var(--display-bg);
      border-radius: 18px;
      padding: 18px 20px 14px;
      text-align: right;
      transition: background .3s;
      min-height: 110px;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .display .expr {
      font-size: 17px; color: var(--text-secondary);
      min-height: 24px; word-break: break-all;
      line-height: 1.3;
      transition: color .3s;
    }
    .display .result {
      font-size: 42px; font-weight: 300; letter-spacing: -1px;
      min-height: 52px; word-break: break-all;
      line-height: 1.2;
      transition: color .3s;
      margin-top: 4px;
    }

    /* Top bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
    .top-bar button {
      background: none; border: none; font-size: 20px; cursor: pointer;
      padding: 8px; border-radius: 50%; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .top-bar button:hover { background: var(--btn-func); }
    .mode-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; letter-spacing: .5px; }

    /* Button grid */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .btn-grid.sci {
      grid-template-columns: repeat(5, 1fr);
    }

    /* Buttons */
    .btn {
      border: none; outline: none; cursor: pointer;
      font-size: 22px; font-weight: 400;
      border-radius: 16px;
      padding: 0; aspect-ratio: 1 / 1;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s, filter .15s, background .2s, color .2s;
      position: relative; overflow: hidden;
    }
    .btn:active { transform: scale(.92); }
    .btn::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      background: transparent; transition: background .15s;
    }
    .btn:active::after { background: rgba(255,255,255,.25); }

    .btn-num  { background: var(--btn-num); color: var(--text); }
    .btn-func { background: var(--btn-func); color: var(--text); font-size: 18px; }
    .btn-op   { background: var(--btn-op); color: #fff; font-size: 24px; font-weight: 500; }
    .btn-sci  { background: var(--btn-sci); color: var(--text); font-size: 13px; font-weight: 500; }
    .btn-eq   { background: var(--btn-op); color: #fff; font-size: 24px; font-weight: 500; }
    .btn-zero { aspect-ratio: auto; }

    /* For 5-column sci grid, some buttons span */
    .btn-wide { aspect-ratio: auto; }

    /* History panel */
    .history-panel {
      display: none;
      background: var(--history-bg);
      border-radius: 18px;
      padding: 12px 14px;
      max-height: 200px;
      overflow-y: auto;
      transition: background .3s;
    }
    .history-panel.show { display: block; }
    .history-panel h4 {
      font-size: 13px; color: var(--text-secondary);
      margin-bottom: 8px; font-weight: 600;
    }
    .history-item {
      padding: 8px 10px; border-radius: 10px;
      cursor: pointer; transition: background .15s;
      font-size: 14px; line-height: 1.4;
    }
    .history-item:hover { background: var(--history-hover); }
    .history-item .h-expr { color: var(--text-secondary); font-size: 12px; }
    .history-item .h-result { color: var(--text); font-size: 16px; font-weight: 500; }
    .history-empty { color: var(--text-secondary); font-size: 13px; text-align: center; padding: 16px 0; }

    /* Toast */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.8); color: #fff; font-size: 13px;
      padding: 10px 20px; border-radius: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .3s; z-index: 10;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 400px) {
      .calc-wrapper { padding: 14px 8px 18px; }
      .btn { font-size: 18px; border-radius: 14px; }
      .btn-func { font-size: 15px; }
      .btn-sci { font-size: 11px; }
      .btn-op, .btn-eq { font-size: 20px; }
      .display .result { font-size: 34px; }
      .btn-grid { gap: 5px; }
    }
  </style>
</head>
<body>
  <div class="calc-wrapper">
    <div class="top-bar">
      <button id="historyBtn" title="历史记录" aria-label="历史记录">⏱</button>
      <span class="mode-label" id="modeLabel">标准模式</span>
      <button id="darkBtn" title="暗色模式" aria-label="暗色模式">🌙</button>
    </div>

    <div class="display">
      <div class="expr" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="history-panel" id="historyPanel">
      <h4>历史记录</h4>
      <div id="historyList"></div>
    </div>

    <div class="btn-grid" id="btnGrid">
      <!-- Scientific row 1 -->
      <button class="btn btn-sci sci-only" data-action="sin">sin</button>
      <button class="btn btn-sci sci-only" data-action="cos">cos</button>
      <button class="btn btn-sci sci-only" data-action="tan">tan</button>
      <button class="btn btn-sci sci-only" data-action="log">log</button>
      <button class="btn btn-sci sci-only" data-action="ln">ln</button>

      <!-- Scientific row 2 -->
      <button class="btn btn-sci sci-only" data-action="sqrt">√</button>
      <button class="btn btn-sci sci-only" data-action="square">x²</button>
      <button class="btn btn-sci sci-only" data-action="power">xʸ</button>
      <button class="btn btn-sci sci-only" data-action="pi">π</button>
      <button class="btn btn-sci sci-only" data-action="e">e</button>
      <button class="btn btn-sci sci-only" data-action="factorial">n!</button>

      <!-- Clear row -->
      <button class="btn btn-func" data-action="clear">AC</button>
      <button class="btn btn-func" data-action="negate">±</button>
      <button class="btn btn-func" data-action="percent">%</button>
      <button class="btn btn-op" data-action="operator" data-value="/">÷</button>

      <!-- Row 1 -->
      <button class="btn btn-num" data-action="digit" data-value="7">7</button>
      <button class="btn btn-num" data-action="digit" data-value="8">8</button>
      <button class="btn btn-num" data-action="digit" data-value="9">9</button>
      <button class="btn btn-op" data-action="operator" data-value="*">×</button>

      <!-- Row 2 -->
      <button class="btn btn-num" data-action="digit" data-value="4">4</button>
      <button class="btn btn-num" data-action="digit" data-value="5">5</button>
      <button class="btn btn-num" data-action="digit" data-value="6">6</button>
      <button class="btn btn-op" data-action="operator" data-value="-">−</button>

      <!-- Row 3 -->
      <button class="btn btn-num" data-action="digit" data-value="1">1</button>
      <button class="btn btn-num" data-action="digit" data-value="2">2</button>
      <button class="btn btn-num" data-action="digit" data-value="3">3</button>
      <button class="btn btn-op" data-action="operator" data-value="+">+</button>

      <!-- Row 4 -->
      <button class="btn btn-func" data-action="sci-toggle" id="sciToggle">🧪</button>
      <button class="btn btn-num" data-action="digit" data-value="0" style="grid-column: span 2; aspect-ratio: auto;">0</button>
      <button class="btn btn-num" data-action="decimal" data-value=".">.</button>
      <button class="btn btn-eq" data-action="equals">=</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function(){
      let currentInput     = '0';
      let expression       = '';
      let lastResult       = null;
      let lastOperator     = null;
      let shouldResetInput = false;
      let justPressedEquals= false;
      let sciMode          = false;
      let history          = [];
      let memory           = 0;

      const expressionEl = document.getElementById('expression');
      const resultEl     = document.getElementById('result');
      const historyPanel = document.getElementById('historyPanel');
      const historyList  = document.getElementById('historyList');
      const modeLabel    = document.getElementById('modeLabel');
      const toastEl      = document.getElementById('toast');
      const btnGrid      = document.getElementById('btnGrid');
      const sciToggleBtn = document.getElementById('sciToggle');

      // --- Load state ---
      const savedDark = localStorage.getItem('calc-dark');
      if (savedDark === '1') document.body.classList.add('dark');

      const savedHistory = localStorage.getItem('calc-history');
      if (savedHistory) { try { history = JSON.parse(savedHistory); } catch(e){} }

      // --- Helpers ---
      function updateDisplay() {
        expressionEl.textContent = expression;
        resultEl.textContent = currentInput;
      }

      function saveHistory() {
        localStorage.setItem('calc-history', JSON.stringify(history));
      }

      function addHistory(expr, res) {
        history.unshift({ expr, res, time: Date.now() });
        if (history.length > 10) history = history.slice(0, 10);
        saveHistory();
        renderHistory();
      }

      function renderHistory() {
        if (history.length === 0) {
          historyList.innerHTML = '<div class="history-empty">暂无计算记录</div>';
          return;
        }
        historyList.innerHTML = history.map((h,i) =>
          `<div class="history-item" data-index="${i}">
            <div class="h-expr">${h.expr}</div>
            <div class="h-result">= ${h.res}</div>
          </div>`
        ).join('');
      }

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
      }

      // --- Scientific helpers ---
      function factorial(n) {
        if (n < 0 || !Number.isInteger(n)) return NaN;
        if (n === 0 || n === 1) return 1;
        let r = 1;
        for (let i = 2; i <= n; i++) r *= i;
        return r;
      }

      function toRad(deg) { return deg * (Math.PI / 180); }
      function toDeg(rad) { return rad * (180 / Math.PI); }

      // --- Input handling ---
      function inputDigit(d) {
        if (justPressedEquals) { currentInput = '0'; expression = ''; justPressedEquals = false; }
        if (shouldResetInput || currentInput === '0') {
          currentInput = d === '.' ? '0.' : d;
          shouldResetInput = false;
        } else {
          if (d === '.' && currentInput.includes('.')) return;
          currentInput += d;
        }
        updateDisplay();
      }

      function inputDecimal() {
        if (justPressedEquals) { currentInput = '0'; expression = ''; justPressedEquals = false; shouldResetInput = false; }
        if (shouldResetInput) { currentInput = '0'; shouldResetInput = false; }
        if (currentInput.includes('.')) return;
        currentInput += '.';
        updateDisplay();
      }

      function inputOperator(op) {
        justPressedEquals = false;
        const num = parseFloat(currentInput);
        if (isNaN(num)) return;

        if (lastOperator !== null && !shouldResetInput) {
          const prevNum = parseFloat(expression.split(/[\+\-\*\/]/).pop());
          if (!isNaN(prevNum)) {
            const r = calculate(lastResult, prevNum, lastOperator);
            lastResult = r;
            currentInput = formatNumber(r);
          }
        } else {
          lastResult = num;
        }

        const opSymbol = op === '*' ? '×' : op === '/' ? '÷' : op === '-' ? '−' : op;
        expression = formatNumber(num) + ' ' + opSymbol + ' ';
        lastOperator = op;
        shouldResetInput = true;
        updateDisplay();
      }

      function inputEquals() {
        if (lastOperator === null) {
          // May need to evaluate expression
          if (expression) {
            try {
              const eV = evalMathExpr(expression);
              addHistory(expression + ' =', eV);
              currentInput = formatNumber(eV);
              expression = '';
              lastResult = eV;
            } catch(e) { toast('计算错误'); }
          }
          justPressedEquals = true;
          shouldResetInput = true;
          updateDisplay();
          return;
        }
        const currentNum = parseFloat(currentInput);
        if (isNaN(currentNum)) return;

        const fullExpr = expression + currentInput;
        const result = calculate(lastResult, currentNum, lastOperator);

        addHistory(fullExpr + ' =', formatNumber(result));

        expression = fullExpr + ' =';
        currentInput = formatNumber(result);
        lastResult = result;
        lastOperator = null;
        justPressedEquals = true;
        shouldResetInput = true;
        updateDisplay();
      }

      function inputClear() {
        currentInput = '0';
        expression = '';
        lastResult = null;
        lastOperator = null;
        shouldResetInput = false;
        justPressedEquals = false;
        updateDisplay();
      }

      function inputNegate() {
        if (currentInput === '0' || currentInput === '') return;
        if (currentInput.startsWith('-')) {
          currentInput = currentInput.slice(1);
        } else {
          currentInput = '-' + currentInput;
        }
        updateDisplay();
      }

      function inputPercent() {
        const n = parseFloat(currentInput);
        if (isNaN(n)) return;
        currentInput = formatNumber(n / 100);
        updateDisplay();
      }

      function inputSci(action) {
        let n = parseFloat(currentInput);
        if (isNaN(n)) { toast('请输入数字'); return; }

        let result;
        const exprLabel = action + '(' + formatNumber(n) + ')';

        switch(action) {
          case 'sin': result = Math.sin(toRad(n)); break;
          case 'cos': result = Math.cos(toRad(n)); break;
          case 'tan': result = Math.tan(toRad(n)); break;
          case 'log': result = n > 0 ? Math.log10(n) : NaN; break;
          case 'ln':  result = n > 0 ? Math.log(n) : NaN; break;
          case 'sqrt': result = n >= 0 ? Math.sqrt(n) : NaN; break;
          case 'square': result = n * n; break;
          case 'power': lastResult = n; expression = formatNumber(n) + ' ^ '; lastOperator = '^'; shouldResetInput = true; updateDisplay(); return;
          case 'pi': currentInput = formatNumber(Math.PI); shouldResetInput = false; justPressedEquals = false; updateDisplay(); return;
          case 'e':  currentInput = formatNumber(Math.E); shouldResetInput = false; justPressedEquals = false; updateDisplay(); return;
          case 'factorial': result = factorial(Math.floor(n)); break;
          default: return;
        }

        if (isNaN(result) || !isFinite(result)) { toast('无效计算'); return; }
        addHistory(exprLabel + ' =', formatNumber(result));
        currentInput = formatNumber(result);
        shouldResetInput = true;
        updateDisplay();
      }

      function calculate(a, b, op) {
        switch(op) {
          case '+': return a + b;
          case '-': return a - b;
          case '*': return a * b;
          case '/': return b !== 0 ? a / b : NaN;
          case '^': return Math.pow(a, b);
          default: return b;
        }
      }

      function evalMathExpr(exprStr) {
        exprStr = exprStr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
        // Only allow basic math
        const sanitized = exprStr.replace(/[^0-9+\-*/.()^]/g, '');
        return Function('"use strict"; return (' + sanitized.replace(/\^/g, '**') + ')')();
      }

      function formatNumber(n) {
        if (!isFinite(n)) return '错误';
        // Handle large/small numbers
        if (Math.abs(n) >= 1e15 || (Math.abs(n) < 1e-10 && n !== 0)) return n.toExponential(6);
        // Round to avoid floating point issues
        const fixed = parseFloat(n.toPrecision(14));
        const s = fixed.toString();
        if (s.length > 14) return fixed.toExponential(6);
        return s;
      }

      function toggleSciMode() {
        sciMode = !sciMode;
        const sciBtns = document.querySelectorAll('.sci-only');
        sciBtns.forEach(b => b.style.display = sciMode ? '' : 'none');

        if (sciMode) {
          btnGrid.classList.add('sci');
          btnGrid.style.gridTemplateColumns = 'repeat(5, 1fr)';
          modeLabel.textContent = '科学模式';
          sciToggleBtn.textContent = '🔢';
        } else {
          btnGrid.classList.remove('sci');
          btnGrid.style.gridTemplateColumns = 'repeat(4, 1fr)';
          modeLabel.textContent = '标准模式';
          sciToggleBtn.textContent = '🧪';
        }
      }

      function toggleDark() {
        document.body.classList.toggle('dark');
        localStorage.setItem('calc-dark', document.body.classList.contains('dark') ? '1' : '0');
      }

      // --- Event delegation ---
      document.querySelector('.calc-wrapper').addEventListener('click', function(e) {
        const btn = e.target.closest('button');
        if (!btn) return;
        const action = btn.dataset.action;
        const value = btn.dataset.value;

        switch(action) {
          case 'digit':       inputDigit(value); break;
          case 'decimal':     inputDecimal(); break;
          case 'operator':    inputOperator(value); break;
          case 'equals':      inputEquals(); break;
          case 'clear':       inputClear(); break;
          case 'negate':      inputNegate(); break;
          case 'percent':     inputPercent(); break;
          case 'sci-toggle':  toggleSciMode(); break;
          case 'sin': case 'cos': case 'tan':
          case 'log': case 'ln': case 'sqrt':
          case 'square': case 'power':
          case 'pi': case 'e': case 'factorial':
            inputSci(action); break;
        }
      });

      // --- History click ---
      historyList.addEventListener('click', function(e) {
        const item = e.target.closest('.history-item');
        if (!item) return;
        const idx = parseInt(item.dataset.index);
        if (idx >= 0 && idx < history.length) {
          currentInput = history[idx].res;
          expression = history[idx].expr.replace(' =', '') + ' =';
          shouldResetInput = true;
          justPressedEquals = true;
          updateDisplay();
          historyPanel.classList.remove('show');
          toast('已恢复历史记录');
        }
      });

      // --- Top bar buttons ---
      document.getElementById('historyBtn').addEventListener('click', function(){
        historyPanel.classList.toggle('show');
        renderHistory();
      });

      document.getElementById('darkBtn').addEventListener('click', function(){
        toggleDark();
        this.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
      });

      // --- Keyboard support ---
      document.addEventListener('keydown', function(e) {
        const key = e.key;
        if (historyPanel.classList.contains('show') && key === 'Escape') {
          historyPanel.classList.remove('show');
          return;
        }
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        if (key >= '0' && key <= '9') { inputDigit(key); return; }
        if (key === '.') { inputDecimal(); return; }
        if (key === '+') { inputOperator('+'); return; }
        if (key === '-') { inputOperator('-'); return; }
        if (key === '*') { inputOperator('*'); return; }
        if (key === '/') { e.preventDefault(); inputOperator('/'); return; }
        if (key === '%') { inputPercent(); return; }
        if (key === 'Enter' || key === '=') { inputEquals(); return; }
        if (key === 'Escape') { inputClear(); return; }
        if (key === 'Backspace') {
          if (currentInput.length > 1 && !shouldResetInput && !justPressedEquals) {
            currentInput = currentInput.slice(0, -1);
          } else {
            inputClear(); return;
          }
          if (currentInput === '' || currentInput === '-') currentInput = '0';
          updateDisplay();
          return;
        }
      });

      // --- Init ---
      toggleSciMode(); // ensure sci buttons hidden by default
      renderHistory();
      updateDisplay();

      // Sync dark button text
      if (document.body.classList.contains('dark')) {
        document.getElementById('darkBtn').textContent = '☀️';
      }
    })();
  </script>
<script src="../
