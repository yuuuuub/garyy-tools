<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字动态效果</title><meta name="description" content="汉字动态效果 - 在线查看汉字动态效果"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.motion-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0;position:relative;overflow:hidden;height:300px}.motion-char{font-size:6rem;font-weight:700;color:var(--blue);position:absolute;cursor:pointer}.motion-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.motion-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.motion-option:hover{border-color:var(--blue)}.motion-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}.score-display{font-size:1.2rem;margin:16px 0}</style><meta property="og:title" content="汉字动态效果"><meta property="og:description" content="汉字动态效果 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎬 汉字动态效果</h1><p class="sub">在线查看汉字动态效果</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="动" oninput="createMotion()">
</div>
<button class="btn" onclick="createMotion()">创建效果</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var motionTypes=['typing','glitch','neon','rainbow','matrix','heartbeat','wave','bounce','spin','float'];
var currentType='typing';
function createMotion(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="motion-options">';
  motionTypes.forEach(function(type){
    html+='<div class="motion-option '+(type===currentType?'active':'')+'" onclick="setType(\''+type+'\')">'+getTypeName(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="motion-container" id="motionContainer">';
  html+=getMotionHTML(char);
  html+='</div></div>';
  r.innerHTML=html;
}
function setType(type){
  currentType=type;
  var char=document.getElementById('characterInput').value.trim()||'动';
  createMotion();
}
function getTypeName(type){
  switch(type){
    case 'typing':return'打字机';
    case 'glitch':return'故障';
    case 'neon':return'霓虹';
    case 'rainbow':return'彩虹';
    case 'matrix':return'矩阵';
    case 'heartbeat':return'心跳';
    case 'wave':return'波浪';
    case 'bounce':return'弹跳';
    case 'spin':return'旋转';
    case 'float':return'浮动';
    default:return'未知';
  }
}
function getMotionHTML(char){
  switch(currentType){
    case 'typing':
      return'<div style="font-family:monospace;font-size:2rem;color:var(--green)">'+char+'<span style="animation:blink 1s infinite">_</span></div>';
    case 'glitch':
      return'<div class="motion-char" style="animation:glitch 0.5s infinite;text-shadow:2px 0 var(--red),-2px 0 var(--blue)">'+char+'</div>';
    case 'neon':
      return'<div class="motion-char" style="color:#fff;text-shadow:0 0 10px #fff,0 0 20px #fff,0 0 30px #fff,0 0 40px var(--blue),0 0 70px var(--blue),0 0 80px var(--blue),0 0 100px var(--blue);animation:neon 1.5s infinite alternate">'+char+'</div>';
    case 'rainbow':
      return'<div class="motion-char" style="animation:rainbow 3s linear infinite">'+char+'</div>';
    case 'matrix':
      return'<div class="motion-char" style="color:var(--green);text-shadow:0 0 10px var(--green);animation:matrix 2s infinite">'+char+'</div>';
    case 'heartbeat':
      return'<div class="motion-char" style="animation:heartbeat 1.5s infinite">'+char+'</div>';
    case 'wave':
      return'<div style="display:flex;gap:4px;justify-content:center">'+char.split('').map(function(c,i){return'<span style="animation:wave 1s ease-in-out '+(i*0.1)+'s infinite;font-size:4rem;font-weight:700;color:var(--blue)">'+c+'</span>';}).join('')+'</div>';
    case 'bounce':
      return'<div class="motion-char" style="animation:bounce 1s infinite">'+char+'</div>';
    case 'spin':
      return'<div class="motion-char" style="animation:spin 1s linear infinite">'+char+'</div>';
    case 'float':
      return'<div class="motion-char" style="animation:float 3s ease-in-out infinite">'+char+'</div>';
    default:
      return'<div class="motion-char">'+char+'</div>';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  createMotion();
}
createMotion();
</script>
<style>
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(-2px,-2px)}60%{transform:translate(2px,2px)}80%{transform:translate(2px,-2px)}100%{transform:translate(0)}}
@keyframes neon{from{text-shadow:0 0 10px #fff,0 0 20px #fff,0 0 30px #fff,0 0 40px var(--blue),0 0 70px var(--blue)}to{text-shadow:0 0 20px #fff,0 0 30px #fff,0 0 40px #fff,0 0 50px var(--blue),0 0 80px var(--blue),0 0 90px var(--blue),0 0 100px var(--blue),0 0 150px var(--blue)}}
@keyframes rainbow{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes matrix{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:0.5;transform:translateY(-10px)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.3)}28%{transform:scale(1)}42%{transform:scale(1.3)}70%{transform:scale(1)}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
</style></body></html>
