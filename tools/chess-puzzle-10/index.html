<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>象棋残局10 - 双马炮对车炮兵</title>
    <meta name="description" content="象棋残局第10局，双马炮对车炮兵残局破解">
    <style>
:root {--bg: #0d1117;
--card: #161b22;
--border: #30363d;
--text: #e6edf3;
--accent: #3b82f6}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
padding: 20px}
h1 { margin-bottom: 5px; }
.subtitle { color: #8b949e; margin-bottom: 15px; }
.info-bar {display: flex;
gap: 20px;
margin-bottom: 15px;
flex-wrap: wrap;
justify-content: center}
.info-item {padding: 8px 16px;
background: var(--card);
border: 1px solid var(--border);
border-radius: 8px}
.info-item.red { border-color: #ef4444; }
.info-item.black { border-color: #6b7280; }
#board-container {background: #dcb35c;
border-radius: 10px;
padding: 15px;
box-shadow: 0 4px 20px rgba(0,0,0,0.3)}
canvas { display: block; cursor: pointer; }
.controls {margin-top: 20px;
display: flex;
gap: 10px;
flex-wrap: wrap;
justify-content: center}
button {padding: 12px 24px;
font-size: 1rem;
border: none;
border-radius: 8px;
background: var(--accent);
color: var(--text);
cursor: pointer;
transition: opacity 0.2s}
button:hover { opacity: 0.9; }
.status {margin-top: 15px;
padding: 12px 20px;
background: var(--card);
border: 1px solid var(--border);
border-radius: 8px;
font-size: 1.1rem}
.status.win { border-color: #22c55e; background: #14532d; }
.hint {margin-top: 10px;
padding: 10px 15px;
background: var(--card);
border: 1px solid var(--border);
border-radius: 8px;
font-size: 0.9rem;
color: #8b949e;
max-width: 450px;
text-align: center}
.move-list {margin-top: 10px;
padding: 10px;
background: var(--card);
border: 1px solid var(--border);
border-radius: 8px;
max-height: 100px;
overflow-y: auto;
font-size: 0.9rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="象棋残局10 - 双马炮对车炮兵">
  <meta property="og:description" content="象棋残局第10局，双马炮对车炮兵残局破解">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/chess-puzzle-10/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
    <h1>🏯 象棋残局10</h1>
    <p class="subtitle">双马炮 对 车炮兵 - 红先胜</p>

    <div class="info-bar">
        <div class="info-item red">红方：双马炮</div>
        <div class="info-item black">黑方：车炮兵</div>
        <div class="info-item">剩余步数：<span id="moves-left">5</span></div>
    </div>

    <div id="board-container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <button onclick="undoMove()">悔棋</button>
        <button onclick="resetPuzzle()">重新开始</button>
        <button onclick="showHint()">提示</button>
    </div>

    <div class="status" id="status">红方先行，请选择棋子</div>
    <div class="move-list" id="move-list"></div>
    <div class="hint" id="hint" style="display:none"></div>

    <script>
        const CELL = 50;
        const MARGIN = 30;
        const COLS = 9;
        const ROWS = 10;
        const W = (COLS - 1) * CELL + MARGIN * 2;
        const H = (ROWS - 1) * CELL + MARGIN * 2;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = W;
        canvas.height = H;
        const statusEl = document.getElementById('status');
        const movesLeftEl = document.getElementById('moves-left');
        const moveListEl = document.getElementById('move-list');
        const hintEl = document.getElementById('hint');
        const PIECES = {
            'k': '帅', 'K': '将',
            'r': '车', 'R': '车',
            'n': '马', 'N': '马',
            'b': '炮', 'B': '炮',
            'p': '兵', 'P': '卒'
        };
        let board, selectedPiece, validMoves, moveHistory, movesLeft, currentPlayer, gameOver;
        function initPuzzle() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
            board[9][4] = { type: 'k', color: 'red' };
            board[7][3] = { type: 'n', color: 'red' };
            board[6][5] = { type: 'n', color: 'red' };
            board[7][6] = { type: 'b', color: 'red' };
            board[0][4] = { type: 'K', color: 'black' };
            board[1][3] = { type: 'r', color: 'black' };
            board[2][5] = { type: 'b', color: 'black' };
            board[4][4] = { type: 'p', color: 'black' };
            selectedPiece = null;
            validMoves = [];
            moveHistory = [];
            movesLeft = 5;
            currentPlayer = 'red';
            gameOver = false;
            movesLeftEl.textContent = movesLeft;
            statusEl.textContent = '红方先行，请选择棋子';
            statusEl.className = 'status';
            moveListEl.innerHTML = '';
            hintEl.style.display = 'none';
            drawBoard();
        }
        function drawBoard() {
            ctx.fillStyle = '#dcb35c';
            ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            for (let i = 0; i < ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(MARGIN, MARGIN + i * CELL);
                ctx.lineTo(MARGIN + 8 * CELL, MARGIN + i * CELL);
                ctx.stroke();
            }
            for (let j = 0; j < COLS; j++) {
                if (j === 0 || j === 8) {
                    ctx.beginPath();
                    ctx.moveTo(MARGIN + j * CELL, MARGIN);
                    ctx.lineTo(MARGIN + j * CELL, MARGIN + 9 * CELL);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(MARGIN + j * CELL, MARGIN);
                    ctx.lineTo(MARGIN + j * CELL, MARGIN + 4 * CELL);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(MARGIN + j * CELL, MARGIN + 5 * CELL);
                    ctx.lineTo(MARGIN + j * CELL, MARGIN + 9 * CELL);
                    ctx.stroke();
                }
            }
            ctx.beginPath();
            ctx.moveTo(MARGIN + 3 * CELL, MARGIN);
            ctx.lineTo(MARGIN + 5 * CELL, MARGIN + 2 * CELL);
            ctx.lineTo(MARGIN + 3 * CELL, MARGIN + 2 * CELL);
            ctx.closePath();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(MARGIN + 5 * CELL, MARGIN + 7 * CELL);
            ctx.lineTo(MARGIN + 3 * CELL, MARGIN + 9 * CELL);
            ctx.lineTo(MARGIN + 5 * CELL, MARGIN + 9 * CELL);
            ctx.closePath();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(MARGIN + 6 * CELL, MARGIN);
            ctx.lineTo(MARGIN + 6 * CELL, MARGIN + 2 * CELL);
            ctx.lineTo(MARGIN + 8 * CELL, MARGIN);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(MARGIN + 6 * CELL, MARGIN + 7 * CELL);
            ctx.lineTo(MARGIN + 6 * CELL, MARGIN + 9 * CELL);
            ctx.lineTo(MARGIN + 8 * CELL, MARGIN + 9 * CELL);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(MARGIN + 0 * CELL, MARGIN + 0 * CELL);
            ctx.lineTo(MARGIN + 2 * CELL, MARGIN + 2 * CELL);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(MARGIN + 0 * CELL, MARGIN + 7 * CELL);
            ctx.lineTo(MARGIN + 2 * CELL, MARGIN + 9 * CELL);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(MARGIN + 8 * CELL, MARGIN + 0 * CELL);
            ctx.lineTo(MARGIN + 6 * CELL, MARGIN + 2 * CELL);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(MARGIN + 8 * CELL, MARGIN + 7 * CELL);
            ctx.lineTo(MARGIN + 6 * CELL, MARGIN + 9 * CELL);
            ctx.stroke();
            for (let i = 0; i < ROWS; i++) {
                for (let j = 0; j < COLS; j++) {
                    if (board[i][j]) {
                        drawPiece(j, i, board[i][j]);
                    }
                }
            }
            if (selectedPiece) {
                ctx.strokeStyle = '#22c55e';
                ctx.lineWidth = 3;
                ctx.strokeRect(
                    MARGIN + selectedPiece.col * CELL - CELL/2,
                    MARGIN + selectedPiece.row * CELL - CELL/2,
                    CELL, CELL
                );
            }
            validMoves.forEach(move => {
                ctx.fillStyle = 'rgba(34, 197, 94, 0.4)';
                ctx.beginPath();
                ctx.arc(MARGIN + move.col * CELL, MARGIN + move.row * CELL, 10, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        function drawPiece(col, row, piece) {
            const x = MARGIN + col * CELL;
            const y = MARGIN + row * CELL;
            const radius = CELL * 0.42;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#f5deb3';
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(x, y, radius - 4, 0, Math.PI * 2);
            ctx.strokeStyle = piece.color === 'red' ? '#ef4444' : '#000';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = piece.color === 'red' ? '#ef4444' : '#000';
            ctx.font = 'bold 22px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(PIECES[piece.type], x, y + 1);
        }
        canvas.addEventListener('click', (e) => {
            if (gameOver || currentPlayer !== 'red') return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            const col = Math.round((x - MARGIN) / CELL);
            const row = Math.round((y - MARGIN) / CELL);
            if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
            if (selectedPiece) {
                const move = validMoves.find(m => m.row === row && m.col === col);
                if (move) {
                    executeMove(selectedPiece.row, selectedPiece.col, row, col);
                    return;
                }
            }
            const piece = board[row][col];
            if (piece && piece.color === 'red') {
                selectedPiece = { row, col, piece };
                validMoves = getValidMoves(row, col, piece);
                drawBoard();
            } else {
                selectedPiece = null;
                validMoves = [];
                drawBoard();
            }
        });
        function getValidMoves(row, col, piece) {
            const moves = [];
            switch (piece.type) {
                case 'r':
                    addLinearMoves(row, col, piece.color, moves);
                    break;
                case 'n':
                    addKnightMoves(row, col, piece.color, moves);
                    break;
                case 'b':
                    addLinearMoves(row, col, piece.color, moves);
                    break;
                case 'p':
                    addPawnMoves(row, col, piece.color, moves);
                    break;
                case 'k':
                    addKingMoves(row, col, piece.color, moves);
                    break;
            }
            return moves.filter(m => isValidPosition(m.row, m.col, piece.color));
        }
        function addLinearMoves(row, col, color, moves) {
            const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
            for (const [dr, dc] of dirs) {
                let r = row + dr;
                let c = col + dc;
                while (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                    const target = board[r][c];
                    if (target) {
                        if (target.color !== color) {
                            moves.push({ row: r, col: c });
                        }
                        break;
                    }
                    moves.push({ row: r, col: c });
                    r += dr;
                    c += dc;
                }
            }
        }
        function addKnightMoves(row, col, color, moves) {
            const jumps = [
                [-2,-1],[-2,1],[-1,-2],[-1,2],
                [1,-2],[1,2],[2,-1],[2,1]
            ];
            for (const [dr, dc] of jumps) {
                const r = row + dr;
                const c = col + dc;
                if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                    const blockR = row + (dr === 0 ? 0 : dr / 2);
                    const blockC = col + (dc === 0 ? 0 : dc / 2);
                    if (!board[blockR][blockC]) {
                        const target = board[r][c];
                        if (!target || target.color !== color) {
                            moves.push({ row: r, col: c });
                        }
                    }
                }
            }
        }
        function addPawnMoves(row, col, color, moves) {
            const forward = color === 'red' ? -1 : 1;
            const crossed = color === 'red' ? row <= 4 : row >= 5;
            if (isValidPosition(row + forward, col, color)) {
                moves.push({ row: row + forward, col: col });
            }
            if (crossed) {
                if (isValidPosition(row, col - 1, color)) {
                    moves.push({ row: row, col: col - 1 });
                }
                if (isValidPosition(row, col + 1, color)) {
                    moves.push({ row: row, col: col + 1 });
                }
            }
        }
        function addKingMoves(row, col, color, moves) {
            const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
            const minRow = color === 'red' ? 7 : 0;
            const maxRow = color === 'red' ? 9 : 2;
            const minCol = 3;
            const maxCol = 5;
            for (const [dr, dc] of dirs) {
                const r = row + dr;
                const c = col + dc;
                if (r >= minRow && r <= maxRow && c >= minCol && c <= maxCol) {
                    const target = board[r][c];
                    if (!target || target.color !== color) {
                        moves.push({ row: r, col: c });
                    }
                }
            }
        }
        function isValidPosition(row, col, color) {
            if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return false;
            const target = board[row][col];
            return !target || target.color !== color;
        }
        function executeMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            const captured = board[toRow][toCol];
            moveHistory.push({
                from: { row: fromRow, col: fromCol },
                to: { row: toRow, col: toCol },
                piece: piece,
                captured: captured
            });
            board[toRow][toCol] = piece;
            board[fromRow][fromCol] = null;
            const pieceName = PIECES[piece.type];
            moveListEl.innerHTML += `<div>红方：${pieceName} ${fromCol},${fromRow}→${toCol},${toRow}</div>`;
            moveListEl.scrollTop = moveListEl.scrollHeight;
            selectedPiece = null;
            validMoves = [];
            movesLeft--;
            movesLeftEl.textContent = movesLeft;
            if (captured && captured.type === 'K') {
                gameOver = true;
                statusEl.textContent = '🎉 恭喜！红方胜！';
                statusEl.className = 'status win';
                drawBoard();
                return;
            }
            if (movesLeft <= 0) {
                gameOver = true;
                statusEl.textContent = '😢 步数用完，挑战失败！';
                statusEl.className = 'status';
                drawBoard();
                return;
            }
            currentPlayer = 'black';
            statusEl.textContent = 'AI思考中...';
            drawBoard();
            setTimeout(aiMove, 500);
        }
        function aiMove() {
            if (gameOver) return;
            const allMoves = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const piece = board[r][c];
                    if (piece && piece.color === 'black') {
                        const moves = getValidMoves(r, c, piece);
                        moves.forEach(m => allMoves.push({ from: { row: r, col: c }, to: m, piece }));
                    }
                }
            }
            if (allMoves.length === 0) {
                gameOver = true;
                statusEl.textContent = '🎉 黑方无子可动，红方胜！';
                statusEl.className = 'status win';
                drawBoard();
                return;
            }
            let bestMove = allMoves[0];
            let bestScore = -Infinity;
            for (const move of allMoves) {
                let score = 0;
                const target = board[move.to.row][move.to.col];
                if (target) {
                    const pieceValues = { k: 1000, r: 500, n: 300, b: 300, p: 100 };
                    score += pieceValues[target.type] || 0;
                }
                score += Math.random() * 50;
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = move;
                }
            }
            const captured = board[bestMove.to.row][bestMove.to.col];
            moveHistory.push({
                from: bestMove.from,
                to: bestMove.to,
                piece: bestMove.piece,
                captured: captured
            });
            board[bestMove.to.row][bestMove.to.col] = bestMove.piece;
            board[bestMove.from.row][bestMove.from.col] = null;
            const pieceName = PIECES[bestMove.piece.type];
            moveListEl.innerHTML += `<div>黑方：${pieceName} ${bestMove.from.col},${bestMove.from.row}→${bestMove.to.col},${bestMove.to.row}</div>`;
            moveListEl.scrollTop = moveListEl.scrollHeight;
            if (captured && captured.type === 'k') {
                gameOver = true;
                statusEl.textContent = '😢 你的帅被吃，挑战失败！';
                statusEl.className = 'status';
                drawBoard();
                return;
            }
            currentPlayer = 'red';
            statusEl.textContent = '红方行棋，请选择棋子';
            drawBoard();
        }
        function undoMove() {
            if (moveHistory.length < 2 || gameOver) return;
            for (let i = 0; i < 2; i++) {
                const last = moveHistory.pop();
                board[last.from.row][last.from.col] = last.piece;
                board[last.to.row][last.to.col] = last.captured;
            }
            movesLeft = Math.min(movesLeft + 1, 5);
            movesLeftEl.textContent = movesLeft;
            currentPlayer = 'red';
            selectedPiece = null;
            validMoves = [];
            statusEl.textContent = '红方行棋，请选择棋子';
            statusEl.className = 'status';
            drawBoard();
        }
        function showHint() {
            hintEl.textContent = '提示：双马可以形成"八角马"或"卧槽马"配合炮进行杀局。';
            hintEl.style.display = 'block';
        }
        function resetPuzzle() {
            initPuzzle();
        }
        initPuzzle();
    </script>
<script src="../i18n.js" defer></script>
</body>
</html>
