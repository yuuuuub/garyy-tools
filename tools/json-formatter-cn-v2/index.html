<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 格式化工具 V2 | JSON Formatter</title>
<meta property="og:title" content="JSON 格式化工具 V2 | JSON Formatter">
<meta property="og:description" content="JSON 格式化工具 V2 | JSON Formatter - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="JSON格式化美化压缩工具，支持语法高亮、树形视图、压缩转换">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<script src="../i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#ffa657;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--string:#a5d6ff;--number:#79c0ff;--boolean:#ffa657;--null:#8b949e;--key:#7ee787;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;padding:16px}
.container{max-width:1400px;margin:0 auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{text-align:center;color:var(--text-secondary);font-size:.85rem;margin-bottom:20px}
.toolbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.82rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:calc(100vh - 200px)}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:8px 12px;border-bottom:1px solid var(--border);font-size:.8rem;color:var(--text-secondary);display:flex;justify-content:space-between;align-items:center}
textarea.code-input{width:100%;flex:1;min-height:400px;padding:12px;border:none;background:var(--bg);color:var(--text);font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.6;resize:none;outline:none;tab-size:2}
.output-area{flex:1;overflow:auto;padding:12px;font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.6;min-height:400px;white-space:pre-wrap;word-break:break-all}
.tree-view{padding:12px;font-size:.85rem}
.tree-item{padding:2px 0;cursor:pointer}
.tree-key{color:var(--key);font-weight:600}
.tree-string{color:var(--string)}
.tree-number{color:var(--number)}
.tree-boolean{color:var(--boolean)}
.tree-null{color:var(--null)}
.tree-toggle{cursor:pointer;user-select:none;color:var(--text-secondary);margin-right:4px}
.tree-children{padding-left:20px;border-left:1px solid var(--border);margin-left:8px}
.error-msg{color:var(--red);font-size:.85rem;padding:12px;background:var(--red-bg);border:1px solid var(--red);border-radius:var(--radius-sm);margin-bottom:12px;display:none}
.info-bar{font-size:.75rem;color:var(--text-secondary);padding:4px 0}
select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);font-size:.8rem}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 20px;border-radius:var(--radius);font-size:.85rem;opacity:0;transition:.3s;z-index:100}
.toast.show{opacity:1}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--bg-secondary);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>📋 JSON 格式化工具 V2</h1>
<p class="sub">JSON美化、压缩、校验、语法高亮、树形视图</p>
<div id="error" class="error-msg"></div>
<div class="toolbar">
<button class="btn btn-primary" onclick="formatJSON()">美化</button>
<button class="btn" onclick="minifyJSON()">压缩</button>
<button class="btn" onclick="validateJSON()">校验</button>
<div class="sep"></div>
<button class="btn" onclick="showTree()">树视图</button>
<button class="btn" onclick="showCode()">代码视图</button>
<div class="sep"></div>
<select id="indentSize" onchange="formatJSON()"><option value="2">2空格</option><option value="4">4空格</option><option value="tab">Tab</option></select>
<div class="sep"></div>
<button class="btn btn-green" onclick="copyOutput()">复制</button>
<button class="btn" onclick="loadSample()">示例</button>
<button class="btn" onclick="clearAll()">清空</button>
</div>
<div class="layout">
<div class="panel">
<div class="panel-header"><span>输入 JSON</span><span class="info-bar" id="inputInfo"></span></div>
<textarea class="code-input" id="input" placeholder='在此粘贴JSON数据...' oninput="autoFormat()"></textarea>
</div>
<div class="panel">
<div class="panel-header"><span>输出</span><span class="info-bar" id="outputInfo"></span></div>
<div class="output-area" id="output"><span style="color:var(--text-secondary)">点击"美化"或输入JSON后自动格式化</span></div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
function showError(msg){var e=document.getElementById('error');e.textContent=msg;e.style.display='block';setTimeout(function(){e.style.display='none'},5000)}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function formatJSON(){
var input=document.getElementById('input').value.trim();
if(!input){showError('请输入JSON数据');return;}
try{
var obj=JSON.parse(input);
var indent=document.getElementById('indentSize').value;
var gap=indent==='tab'?'\t':parseInt(indent);
var result=JSON.stringify(obj,null,gap);
document.getElementById('output').textContent=result;
document.getElementById('inputInfo').textContent=input.length+'字符';
document.getElementById('outputInfo').textContent=result.length+'字符';
document.getElementById('error').style.display='none';
}catch(e){showError('JSON解析错误: '+e.message)}
}
function minifyJSON(){
var input=document.getElementById('input').value.trim();
if(!input){showError('请输入JSON数据');return;}
try{
var obj=JSON.parse(input);
var result=JSON.stringify(obj);
document.getElementById('output').textContent=result;
document.getElementById('outputInfo').textContent=result.length+'字符';
}catch(e){showError('JSON解析错误: '+e.message)}
}
function validateJSON(){
var input=document.getElementById('input').value.trim();
if(!input){showError('请输入JSON数据');return;}
try{JSON.parse(input);showError('');toast('JSON格式正确 ✓')}catch(e){showError('JSON解析错误: '+e.message)}
}
function showTree(){
var input=document.getElementById('input').value.trim();
if(!input){showError('请输入JSON数据');return;}
try{
var obj=JSON.parse(input);
document.getElementById('output').innerHTML=renderTree(obj);
document.getElementById('error').style.display='none';
}catch(e){showError('JSON解析错误: '+e.message)}
}
function renderTree(data,key,isLast){
if(data===null) return '<span class="tree-null">null</span>'+(isLast?'':'');
if(typeof data==='boolean') return '<span class="tree-boolean">'+data+'</span>'+(isLast?'':'');
if(typeof data==='number') return '<span class="tree-number">'+data+'</span>'+(isLast?'':'');
if(typeof data==='string') return '<span class="tree-string">"'+data.replace(/</g,'&lt;')+'"</span>'+(isLast?'':'');
var isArray=Array.isArray(data);
var items=isArray?data:Object.keys(data);
if(!items.length) return '<span class="tree-null">'+(isArray?'[]':'{}')+'</span>'+(isLast?'':'');
var html='';
items.forEach(function(k,i){
var last=i===items.length-1;
var val=isArray?data[k]:data[k];
var label=isArray?'':('<span class="tree-key">"'+k+'"</span>: ');
var comma=last?'':',';
if(typeof val==='object'&&val!==null){
var childKey=isArray?k:k;
html+='<div class="tree-item"><span class="tree-toggle" onclick="this.parentElement.querySelector(\'.tree-children\').style.display=this.parentElement.querySelector(\'.tree-children\').style.display===\'none\'?\'block\':\'none\'">▼</span>'+label+renderTree(val,childKey,last);
}else{
html+='<div class="tree-item">'+label+renderTree(val,k,last)+comma;
}
});
return '<span class="tree-toggle" onclick="this.parentElement.querySelector(\'.tree-children\').style.display=this.parentElement.querySelector(\'.tree-children\').style.display===\'none\'?\'block\':\'none\'">▼</span>'+(key?'"'+key+'": ':'')+(isArray?'[':'{')+'<div class="tree-children">'+html+'</div>'+(isArray?']':'}');
}
function showCode(){formatJSON()}
function autoFormat(){
var input=document.getElementById('input').value;
document.getElementById('inputInfo').textContent=input.length+'字符';
}
function loadSample(){
document.getElementById('input').value=JSON.stringify({
"name":"张三","age":25,"skills":["JavaScript","Python","Go"],
"address":{"city":"北京","district":"海淀","zip":"100080"},
"projects":[{"name":"工具站","stars":128,"active":true},{"name":"CLI工具","stars":64,"active":false}],
"config":null,"version":2.0
},null,2);
formatJSON();
}
function clearAll(){document.getElementById('input').value='';document.getElementById('output').innerHTML='';document.getElementById('inputInfo').textContent='';document.getElementById('outputInfo').textContent=''}
function copyOutput(){
var t=document.getElementById('output').textContent;
navigator.clipboard.writeText(t).then(function(){toast('已复制到剪贴板')});
}
</script>
</body>
</html>
