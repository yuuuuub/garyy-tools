<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字挑战赛</title><meta name="description" content="汉字挑战赛 - 测试你的汉字知识，包括读音、笔画、部首等挑战"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.score-bar{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:8px;margin-bottom:16px}.score-item{text-align:center}.score-item .num{font-size:1.5rem;font-weight:700}.score-item .lbl{font-size:.75rem;color:var(--text2)}.char-display{text-align:center;font-size:6rem;padding:30px;border:2px solid var(--border);border-radius:12px;margin:16px 0;background:var(--bg)}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.option-btn{padding:14px;background:var(--bg);border:2px solid var(--border);border-radius:8px;cursor:pointer;font-size:1rem;color:var(--text);transition:all .2s;text-align:center}.option-btn:hover{border-color:var(--blue)}.option-btn.correct{border-color:var(--green);background:rgba(34,197,94,0.1)}.option-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.1)}.timer-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin:12px 0}.timer-fill{height:100%;background:var(--blue);transition:width 0.1s linear}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字挑战赛"><meta property="og:description" content="汉字挑战赛 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🏆 汉字挑战赛</h1><p class="sub">测试你的汉字知识</p>
<div id="startScreen" class="card" style="text-align:center">
<h2 style="margin-bottom:16px">选择挑战类型</h2>
<div style="display:grid;gap:10px;max-width:400px;margin:0 auto">
<button class="btn" onclick="startGame('pinyin')" style="width:100%">📖 拼音挑战</button>
<button class="btn" onclick="startGame('strokes')" style="width:100%;background:var(--green)">✏️ 笔画挑战</button>
<button class="btn" onclick="startGame('radical')" style="width:100%;background:#a855f7">🔍 部首挑战</button>
<button class="btn" onclick="startGame('meaning')" style="width:100%;background:#f97316">💡 释义挑战</button>
</div>
</div>
<div id="gameScreen" style="display:none">
<div class="score-bar"><div class="score-item"><div class="num" id="score">0</div><div class="lbl">得分</div></div><div class="score-item"><div class="num" id="combo">0</div><div class="lbl">连击</div></div><div class="score-item"><div class="num" id="questionNum">1/10</div><div class="lbl">进度</div></div></div>
<div class="timer-bar"><div class="timer-fill" id="timerBar"></div></div>
<div class="card" id="questionCard">
<div class="char-display" id="charDisplay">龙</div>
<div id="questionText" style="text-align:center;margin:8px 0;color:var(--text2)"></div>
<div class="options" id="options"></div>
</div>
<div style="text-align:center;margin-top:12px"><button class="btn" onclick="endGame()">结束挑战</button></div>
</div>
<div id="resultScreen" style="display:none" class="card" style="text-align:center"></div></div>
<script src="../i18n.js" defer></script>
<script>
var chars=[
{char:'龙',pinyin:'lóng',strokes:5,radical:'龙',meaning:'传说中的神兽'},
{char:'虎',pinyin:'hǔ',strokes:8,radical:'虍',meaning:'猛兽'},
{char:'凤',pinyin:'fèng',strokes:4,radical:'几',meaning:'传说中的神鸟'},
{char:'福',pinyin:'fú',strokes:15,radical:'礻',meaning:'幸福、福气'},
{char:'寿',pinyin:'shòu',strokes:7,radical:'寸',meaning:'长寿'},
{char:'喜',pinyin:'xǐ',strokes:12,radical:'口',meaning:'快乐、高兴'},
{char:'财',pinyin:'cái',strokes:7,radical:'贝',meaning:'钱财'},
{char:'旺',pinyin:'wàng',strokes:8,radical:'日',meaning:'兴旺'},
{char:'安',pinyin:'ān',strokes:6,radical:'宀',meaning:'平安、安定'},
{char:'康',pinyin:'kāng',strokes:11,radical:'广',meaning:'健康'},
{char:'富',pinyin:'fù',strokes:12,radical:'宀',meaning:'富裕'},
{char:'贵',pinyin:'guì',strokes:9,radical:'贝',meaning:'珍贵、高贵'},
{char:'祥',pinyin:'xiáng',strokes:10,radical:'礻',meaning:'吉祥'},
{char:'和',pinyin:'hé',strokes:8,radical:'口',meaning:'和平、和谐'},
{char:'顺',pinyin:'shùn',strokes:9,radical:'页',meaning:'顺利'},
{char:'春',pinyin:'chūn',strokes:9,radical:'日',meaning:'春天'},
{char:'夏',pinyin:'xià',strokes:10,radical:'夂',meaning:'夏天'},
{char:'秋',pinyin:'qiū',strokes:9,radical:'禾',meaning:'秋天'},
{char:'冬',pinyin:'dōng',strokes:5,radical:'冫',meaning:'冬天'},
{char:'花',pinyin:'huā',strokes:7,radical:'艹',meaning:'花朵'},
{char:'月',pinyin:'yuè',strokes:4,radical:'月',meaning:'月亮'},
{char:'水',pinyin:'shuǐ',strokes:4,radical:'水',meaning:'水'},
{char:'火',pinyin:'huǒ',strokes:4,radical:'火',meaning:'火'},
{char:'山',pinyin:'shān',strokes:3,radical:'山',meaning:'山'},
{char:'木',pinyin:'mù',strokes:4,radical:'木',meaning:'树木'}
];
var game={type:'',score:0,combo:0,maxCombo:0,total:10,current:0,correct:0,timer:null,timeLeft:10};
function startGame(type){game={type:type,score:0,combo:0,maxCombo:0,total:10,current:0,correct:0,timer:null,timeLeft:10};document.getElementById('startScreen').style.display='none';document.getElementById('gameScreen').style.display='block';document.getElementById('resultScreen').style.display='none';nextQuestion()}
function nextQuestion(){
if(game.current>=game.total){endGame();return}
game.current++;game.timeLeft=10;
var q=chars[Math.floor(Math.random()*chars.length)];
document.getElementById('charDisplay').textContent=q.char;
document.getElementById('questionNum').textContent=game.current+'/'+game.total;
var correct,question,opts=[];
switch(game.type){
case'pinyin':correct=q.pinyin;question='这个字的拼音是什么？';opts=[q.pinyin,'lóng','fèng','fú'].sort(function(){return Math.random()-0.5});break;
case'strokes':correct=q.strokes+'画';question='这个字有几画？';opts=[q.strokes+'画',(q.strokes+2)+'画',(q.strokes-1)+'画',(q.strokes+3)+'画'].sort(function(){return Math.random()-0.5});break;
case'radical':correct=q.radical;question='这个字的部首是什么？';opts=[q.radical,'口','木','日'].sort(function(){return Math.random()-0.5});break;
case'meaning':correct=q.meaning;question='这个字的意思是？';opts=[q.meaning,'太阳','月亮','水流'].sort(function(){return Math.random()-0.5});break;
}
document.getElementById('questionText').textContent=question;
var h='';opts.forEach(function(o){h+='<button class="option-btn" onclick="checkAnswer(this,\''+o.replace(/'/g,"\\'")+'\',\''+correct.replace(/'/g,"\\'")+'\')">'+o+'</button>'});
document.getElementById('options').innerHTML=h;
clearInterval(game.timer);
var bar=document.getElementById('timerBar');
bar.style.width='100%';
game.timer=setInterval(function(){game.timeLeft-=0.1;bar.style.width=(game.timeLeft/10*100)+'%';if(game.timeLeft<=0){clearInterval(game.timer);game.combo=0;document.getElementById('combo').textContent='0';nextQuestion()}},100);
}
function checkAnswer(btn,answer,correct){
clearInterval(game.timer);
var btns=document.querySelectorAll('.option-btn');
btns.forEach(function(b){b.onclick=null;if(b.textContent===correct)b.classList.add('correct')});
if(answer===correct){game.score+=10+game.combo*2;game.combo++;game.correct++;if(game.combo>game.maxCombo)game.maxCombo=game.combo}else{game.combo=0;btn.classList.add('wrong')}
document.getElementById('score').textContent=game.score;
document.getElementById('combo').textContent=game.combo;
setTimeout(nextQuestion,1000);
}
function endGame(){
clearInterval(game.timer);
var pct=Math.round(game.correct/game.total*100);
var grade=pct>=90?'S':pct>=70?'A':pct>=50?'B':'C';
document.getElementById('gameScreen').style.display='none';
document.getElementById('resultScreen').style.display='block';
document.getElementById('resultScreen').innerHTML='<h2 style="text-align:center;margin-bottom:16px">挑战完成！</h2><div style="text-align:center;font-size:4rem;margin:20px 0">'+grade+'</div><div class="score-bar"><div class="score-item"><div class="num">'+game.score+'</div><div class="lbl">总分</div></div><div class="score-item"><div class="num">'+game.correct+'/'+game.total+'</div><div class="lbl">正确率</div></div><div class="score-item"><div class="num">'+game.maxCombo+'</div><div class="lbl">最大连击</div></div></div><div style="text-align:center;margin-top:16px"><button class="btn" onclick="location.reload()">再来一次</button></div>';
}
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
