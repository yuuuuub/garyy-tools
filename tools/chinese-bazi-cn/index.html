<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>八字排盘详解 | Chinese Bazi Analysis</title>
<meta name="description" content="八字排盘详解：四柱天干地支、日主分析、十神关系、五行平衡、大运流年。专业的八字命理分析工具。">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☯️</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a843;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.8rem;color:var(--gold)}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .input-group{flex:1;min-width:200px}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}
.input-group input:focus{border-color:var(--blue);outline:none}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}
.btn:hover{opacity:.85}
.result-area{margin-top:16px;display:none}
.result-area.show{display:block}
.section h3{font-size:1rem;margin-bottom:10px;color:var(--blue)}
.pillar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.pillar{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;position:relative}
.pillar .p-label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.pillar .p-gan{font-size:1.8rem;font-weight:700;color:var(--gold)}
.pillar .p-zhi{font-size:1.4rem;color:var(--text)}
.pillar .p-wx{font-size:.8rem;color:var(--text2);margin-top:4px}
.wx-bar{display:flex;gap:8px;margin:12px 0}
.wx-item{flex:1;text-align:center;padding:10px;border-radius:8px;background:var(--card);border:1px solid var(--border)}
.wx-item .wx-name{font-size:.85rem;font-weight:600}
.wx-item .wx-count{font-size:1.6rem;font-weight:700;margin:4px 0}
.wx-item .wx-bar-inner{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.wx-item .wx-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.wx-colors{木:#4caf50;火:#f44336;土:#ff9800;金:#ffd700;水:#2196f3}
.dayun-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:12px 0}
.dayun-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px}
.dayun-item .d-age{color:var(--text2);font-size:.8rem}
.dayun-item .d-pillar{color:var(--gold);font-size:1.1rem;font-weight:600}
.dayun-item .d-wx{color:var(--text2);font-size:.8rem}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78rem;margin:2px}
.tag.good{background:rgba(35,134,54,.15);color:var(--green);border:1px solid rgba(35,134,54,.3)}
.tag.bad{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.tag.neutral{background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.25)}
.info-box{padding:12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin:8px 0}
#themeBtn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer;font-size:.8rem}
</style>
</head>
<body>
<button id="themeBtn" onclick="toggleTheme()">🌓 主题</button>
<div class="container">
<h1>☯️ 八字排盘详解</h1>
<p class="sub">四柱天干地支 · 日主分析 · 十神关系 · 五行平衡 · 大运流年</p>

<div class="card">
<div class="row">
<div class="input-group"><label>出生日期</label><input type="date" id="bDate"></div>
<div class="input-group"><label>出生时间</label><input type="time" id="bTime" value="12:00"></div>
</div>
<button class="btn" onclick="calculate()">排盘分析</button>
</div>

<div class="result-area" id="result"></div>
</div>

<script src="../i18n.js" defer></script>
<script>
var TG=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var DZ=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var WX=['木','木','火','火','土','土','金','金','水','水'];
var ANIMALS=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
var SHISHEN_MAP={
'甲甲':'比肩','甲乙':'劫财','甲丙':'食神','甲丁':'伤官','甲戊':'偏财',
'甲己':'正财','甲庚':'七杀','甲辛':'正官','甲壬':'偏印','甲癸':'正印',
'乙甲':'劫财','乙乙':'比肩','乙丙':'伤官','乙丁':'食神','乙戊':'正财',
'乙己':'偏财','乙庚':'正官','乙辛':'七杀','乙壬':'正印','乙癸':'偏印',
'丙甲':'偏印','丙乙':'正印','丙丙':'比肩','丙丁':'劫财','丙戊':'食神',
'丙己':'伤官','丙庚':'偏财','丙辛':'正财','丙壬':'七杀','丙癸':'正官',
'丁甲':'正印','丁乙':'偏印','丁丙':'劫财','丁丁':'比肩','丁戊':'伤官',
'丁己':'食神','丁庚':'正财','丁辛':'偏财','丁壬':'正官','丁癸':'七杀',
'戊甲':'七杀','戊乙':'正官','戊丙':'偏印','戊丁':'正印','戊戊':'比肩',
'戊己':'劫财','戊庚':'食神','戊辛':'伤官','戊壬':'偏财','戊癸':'正财',
'己甲':'正官','己乙':'七杀','己丙':'正印','己丁':'偏印','己戊':'劫财',
'己己':'比肩','己庚':'伤官','己辛':'食神','己壬':'正财','己癸':'偏财',
'庚甲':'偏财','庚乙':'正财','庚丙':'七杀','庚丁':'正官','庚戊':'偏印',
'己壬':'正财','庚辛':'比肩','庚壬':'伤官','庚癸':'食神',
'辛甲':'正财','辛乙':'偏财','辛丙':'正官','辛丁':'七杀','辛戊':'正印',
'辛己':'偏印','辛庚':'劫财','辛辛':'比肩','辛壬':'食神','辛癸':'伤官',
'壬甲':'食神','壬乙':'伤官','壬丙':'偏财','壬丁':'正财','壬戊':'七杀',
'壬己':'正官','壬庚':'偏印','壬辛':'正印','壬壬':'比肩','壬癸':'劫财',
'癸甲':'伤官','癸乙':'食神','癸丙':'正财','癸丁':'偏财','癸戊':'正官',
'癸己':'七杀','癸庚':'正印','癸辛':'偏印','癸壬':'劫财','癸癸':'比肩'
};

function calculate(){
var ds=document.getElementById('bDate').value;
var ts=document.getElementById('bTime').value;
if(!ds){alert('请选择出生日期');return}
var d=new Date(ds+'T'+ts);
var y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
var h=parseInt(ts.split(':')[0]);

var yg=(y-4)%10,yz=(y-4)%12;
var mg=(y*2+m)%10,mz=(m+1)%12;
var dg=(y*5+m*6+day)%10,dz=(y*5+m*6+day)%12;
var hg=(dg*2+Math.floor(h/2))%10,hz=Math.floor(h/2)%12;

var pillars=[
{gan:TG[yg],zhi:DZ[yz],wx:WX[yg],dzWx:WX[yz],label:'年柱'},
{gan:TG[mg],zhi:DZ[mz],wx:WX[mg],dzWx:WX[mz],label:'月柱'},
{gan:TG[dg],zhi:DZ[dz],wx:WX[dg],dzWx:WX[dz],label:'日柱'},
{gan:TG[hg],zhi:DZ[hz],wx:WX[hg],dzWx:WX[hz],label:'时柱'}
];

var dayMaster=pillars[2].gan;
var dayMasterWx=WX[dg];

var wxCount={木:0,火:0,土:0,金:0,水:0};
pillars.forEach(function(p){wxCount[p.wx]++;wxCount[p.dzWx]++});
var maxWx=Math.max.apply(null,Object.values(wxCount));
var minWx=Math.min.apply(null,Object.values(wxCount));

var shishen=[];
pillars.forEach(function(p,i){
if(i===2)return;
var key=dayMaster+p.gan;
var ss=SHISHEN_MAP[key]||'未知';
shishen.push({label:p.label,gan:p.gan,ss:ss});
});

var luckyWx;
var cycle={木:'火',火:'土',土:'金',金:'水',水:'木'};
luckyWx=cycle[dayMasterWx];
var avoidWx=cycle[cycle[luckyWx]];

var age=new Date().getFullYear()-y;
var dayunBase=(y-4)%10;
var dayunStart=Math.max(1,18-Math.floor((day%10)*0.5));
var dayuns=[];
for(var i=0;i<8;i++){
var duYg=(dayunBase+i)%10;
var duDz=(dayunBase+i)%12;
dayuns.push({
age:dayunStart+i*10,
pillar:TG[duYg]+DZ[duDz],
wx:WX[duYg],
endAge:dayunStart+(i+1)*10
});
}

var currentDayun=dayuns.find(function(d){return age>=d.age&&age<d.endAge})||dayuns[0];
var liunianYg=(y-4)%10;
var liunianWx=WX[liunianYg];

var r=document.getElementById('result');
r.className='result-area show';
var html='';

html+='<div class="card"><div class="section"><h3>📋 四柱排盘</h3></div>';
html+='<div class="pillar-grid">';
pillars.forEach(function(p){
var gColor=WX[TG.indexOf(p.gan)]==='木'?'#4caf50':WX[TG.indexOf(p.gan)]==='火'?'#f44336':WX[TG.indexOf(p.gan)]==='土'?'#ff9800':WX[TG.indexOf(p.gan)]==='金'?'#ffd700':'#2196f3';
html+='<div class="pillar"><div class="p-label">'+p.label+'</div>';
html+='<div class="p-gan" style="color:'+gColor+'">'+p.gan+'</div>';
html+='<div class="p-zhi">'+p.zhi+'</div>';
html+='<div class="p-wx">'+p.wx+' '+p.dzWx+'</div></div>';
});
html+='</div>';
html+='<div class="info-box"><strong>生肖：</strong>'+ANIMALS[yz]+' · <strong>日主：</strong>'+dayMaster+' ('+dayMasterWx+')</div>';
html+='</div>';

html+='<div class="card"><div class="section"><h3>📊 十神分析</h3></div>';
html+='<div style="display:flex;flex-wrap:wrap;gap:8px">';
shishen.forEach(function(s){
html+='<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 16px;text-align:center;min-width:80px">';
html+='<div style="color:var(--text2);font-size:.75rem">'+s.label+'</div>';
html+='<div style="color:var(--gold);font-size:1.1rem;font-weight:600">'+s.gan+'</div>';
html+='<div style="font-size:.8rem;color:var(--text)">'+s.ss+'</div></div>';
});
html+='</div></div>';

html+='<div class="card"><div class="section"><h3>🔥 五行平衡</h3></div>';
html+='<div class="wx-bar">';
var wxColors={木:'#4caf50',火:'#f44336',土:'#ff9800',金:'#ffd700',水:'#2196f3'};
Object.keys(wxCount).forEach(function(k){
var pct=maxWx>0?(wxCount[k]/maxWx*100):0;
html+='<div class="wx-item">';
html+='<div class="wx-name" style="color:'+wxColors[k]+'">'+k+'</div>';
html+='<div class="wx-count" style="color:'+wxColors[k]+'">'+wxCount[k]+'</div>';
html+='<div class="wx-bar-inner"><div class="wx-bar-fill" style="width:'+pct+'%;background:'+wxColors[k]+'"></div></div></div>';
});
html+='</div>';
html+='<div class="info-box">';
html+='<div><strong>五行最旺：</strong>'+Object.keys(wxCount).reduce(function(a,b){return wxCount[a]>wxCount[b]?a:b})+'</div>';
html+='<div><strong>五行最弱：</strong>'+Object.keys(wxCount).reduce(function(a,b){return wxCount[a]<wxCount[b]?a:b})+'</div>';
html+='<div style="margin-top:6px"><strong>喜用神：</strong><span class="tag good">'+luckyWx+'</span> <strong>忌神：</strong><span class="tag bad">'+avoidWx+'</span></div>';
html+='</div></div>';

html+='<div class="card"><div class="section"><h3>📈 大运排列</h3></div>';
html+='<div style="color:var(--text2);font-size:.85rem;margin-bottom:8px">起运年龄：约'+dayunStart+'岁</div>';
html+='<div class="dayun-grid">';
dayuns.forEach(function(du){
var isCurrent=(age>=du.age&&age<du.endAge);
html+='<div class="dayun-item" style="'+(isCurrent?'border-color:var(--gold);background:rgba(212,168,67,.08)':'')+'">';
html+='<div class="d-age">'+du.age+'-'+du.endAge+'岁'+(isCurrent?' ⭐当前':'')+'</div>';
html+='<div class="d-pillar">'+du.pillar+'</div>';
html+='<div class="d-wx">'+du.wx+'</div></div>';
});
html+='</div></div>';

html+='<div class="card"><div class="section"><h3>📅 '+y+'年流年运势</h3></div>';
html+='<div class="info-box">';
html+='<div><strong>流年天干：</strong>'+TG[liunianYg]+' ('+liunianWx+')</div>';
var liunianRelation=SHISHEN_MAP[dayMaster+TG[liunianYg]]||'';
html+='<div><strong>与日主关系：</strong>'+liunianRelation+'</div>';
html+='<div style="margin-top:8px"><strong>建议：</strong>';
if(luckyWx===liunianWx)html+='流年五行与喜用神相同，运势较好，适合积极进取。';
else if(avoidWx===liunianWx)html+='流年五行与忌神相同，需谨慎行事，稳中求进。';
else html+='流年五行中性，保持平常心，把握机会。';
html+='</div></div></div>';

r.innerHTML=html;
}

function toggleTheme(){
var t=document.documentElement;
t.setAttribute('data-theme',t.getAttribute('data-theme')==='light'?'dark':'light');
}

document.getElementById('bDate').value=new Date().toISOString().split('T')[0];
calculate();
</script>
</body>
</html>
