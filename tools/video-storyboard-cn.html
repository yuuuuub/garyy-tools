<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="视频故事板工具 - 创建视频分镜脚本和场景规划">
    <meta name="robots" content="index, follow">
    <title>视频故事板工具</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #f59e0b; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #fbbf24; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        textarea { resize: vertical; min-height: 60px; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 8px; }
        button:hover { opacity: 0.9; }
        .btn-sm { padding: 4px 10px; font-size: 13px; }
        .btn-success { background-color: var(--success-color); }
        .btn-danger { background-color: var(--danger-color); }
        .btn-outline { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .scene-card { display: grid; grid-template-columns: 200px 1fr auto; gap: 16px; padding: 16px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; background: var(--card-bg); }
        .scene-thumb { border-radius: 8px; min-height: 120px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; font-size: 12px; color: var(--secondary-color); }
        .scene-thumb img { max-width: 100%; max-height: 120px; border-radius: 8px; }
        .scene-info h4 { margin: 0 0 8px 0; }
        .scene-info .meta { font-size: 12px; color: var(--secondary-color); display: flex; gap: 12px; margin-top: 8px; }
        .scene-info .meta span { display: flex; align-items: center; gap: 4px; }
        .shot-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; background: var(--primary-color); color: white; }
        .add-scene { border: 2px dashed var(--border-color); border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; color: var(--secondary-color); }
        .add-scene:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .project-info { display: flex; gap: 16px; flex-wrap: wrap; padding: 16px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 16px; }
        .project-info .info-item { flex: 1; min-width: 150px; }
        .project-info .info-item label { font-size: 12px; color: var(--secondary-color); margin-bottom: 2px; }
        .project-info .info-item .value { font-weight: bold; }
        .export-text { white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 12px; background: var(--bg-color); padding: 16px; border-radius: 6px; border: 1px solid var(--border-color); max-height: 400px; overflow-y: auto; }
        .stats-row { display: flex; gap: 12px; margin-bottom: 16px; }
        .stat { padding: 12px 20px; border-radius: 8px; background: var(--card-bg); border: 1px solid var(--border-color); text-align: center; }
        .stat .num { font-size: 24px; font-weight: bold; color: var(--primary-color); }
        .stat .label { font-size: 12px; color: var(--secondary-color); }
        .drag-handle { cursor: grab; padding: 4px; color: var(--secondary-color); font-size: 18px; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>视频故事板工具</h1>

        <div class="card">
            <h3>项目信息</h3>
            <div class="grid-2">
                <div class="form-group"><label>项目名称</label><input type="text" id="projectName" value="我的视频项目" onchange="updateInfo()"></div>
                <div class="form-group"><label>视频类型</label><select id="videoType" onchange="updateInfo()"><option>广告宣传片</option><option>产品介绍</option><option>教学视频</option><option>微电影</option><option>Vlog</option><option>动画短片</option><option>纪录片</option></select></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>目标时长 (秒)</label><input type="number" id="targetDuration" value="60" min="5" max="3600" onchange="updateInfo()"></div>
                <div class="form-group"><label>画面比例</label><select id="aspectRatio"><option>16:9 (横屏)</option><option>9:16 (竖屏)</option><option>1:1 (方形)</option><option>4:3 (传统)</option></select></div>
            </div>
            <div class="form-group"><label>项目简介</label><textarea id="projectDesc" rows="2" placeholder="描述视频的整体概念和目标..."></textarea></div>
        </div>

        <div class="stats-row" id="statsRow"></div>

        <div class="card">
            <h3>场景列表</h3>
            <div id="sceneList"></div>
            <div class="add-scene" onclick="addScene()">+ 添加新场景</div>
        </div>

        <div class="card" id="editPanel" style="display:none;">
            <h3>编辑场景 <span id="editSceneNum" style="color:var(--secondary-color);font-size:14px;"></span></h3>
            <div class="grid-2">
                <div>
                    <div class="form-group"><label>场景标题</label><input type="text" id="editTitle"></div>
                    <div class="form-group"><label>镜头类型</label><select id="editShot"><option>全景</option><option>中景</option><option>近景</option><option>特写</option><option>远景</option><option>航拍</option><option>跟拍</option><option>固定</option></select></div>
                    <div class="grid-2">
                        <div class="form-group"><label>时长 (秒)</label><input type="number" id="editDuration" min="1" max="300"></div>
                        <div class="form-group"><label>运镜</label><select id="editMovement"><option>静止</option><option>推进</option><option>拉远</option><option>左移</option><option>右移</option><option>上移</option><option>下移</option><option>环绕</option><option>跟随</option></select></div>
                    </div>
                    <div class="form-group"><label>画面描述</label><textarea id="editVisual" rows="3" placeholder="描述画面内容..."></textarea></div>
                    <div class="form-group"><label>对白/旁白</label><textarea id="editDialogue" rows="2" placeholder="角色台词或旁白文字..."></textarea></div>
                    <div class="form-group"><label>音效/音乐</label><input type="text" id="editAudio" placeholder="背景音乐或音效描述"></div>
                </div>
                <div>
                    <div class="form-group"><label>画面草图 (可粘贴图片URL)</label><input type="text" id="editImageUrl" placeholder="https://... 或留空"></div>
                    <div class="scene-thumb" id="editThumb" style="background:var(--border-color);height:180px;" onclick="document.getElementById('editImageUrl').focus()">点击设置图片</div>
                    <div class="form-group" style="margin-top:12px;"><label>转场效果</label><select id="editTransition"><option>无</option><option>淡入淡出</option><option>交叉溶解</option><option>滑动</option><option>擦除</option><option>缩放</option><option>翻转</option></select></div>
                    <div class="form-group"><label>备注</label><textarea id="editNotes" rows="2" placeholder="其他说明..."></textarea></div>
                </div>
            </div>
            <div style="margin-top:12px;">
                <button class="btn-success" onclick="saveScene()">保存</button>
                <button class="btn-outline" onclick="closeEditor()">取消</button>
                <button class="btn-danger btn-sm" style="float:right;" onclick="deleteScene()">删除场景</button>
            </div>
        </div>

        <div class="card">
            <h3>导出</h3>
            <div style="display:flex;gap:8px;margin-bottom:12px;">
                <button class="btn-sm" onclick="exportText()">导出文本脚本</button>
                <button class="btn-sm btn-outline" onclick="exportJSON()">导出JSON</button>
                <button class="btn-sm btn-outline" onclick="exportCSV()">导出CSV</button>
            </div>
            <div class="export-text" id="exportArea">点击上方按钮导出</div>
        </div>
    </div>

    <script defer src="i18n.js"></script>
    <script>
        let scenes = [
            { id: 1, title: '开场', shot: '全景', duration: 5, movement: '推进', visual: '城市天际线，日出时分，阳光洒在建筑上', dialogue: '', audio: '轻柔的钢琴音乐渐入', imageUrl: '', transition: '淡入淡出', notes: '' },
            { id: 2, title: '产品展示', shot: '近景', duration: 8, movement: '环绕', visual: '产品360度旋转展示，光影效果', dialogue: '旁白：这是一款改变生活的产品', audio: '背景音乐渐强', imageUrl: '', transition: '交叉溶解', notes: '需要专业灯光' },
            { id: 3, title: '用户使用', shot: '中景', duration: 6, movement: '跟随', visual: '用户在日常场景中使用产品', dialogue: '用户：使用起来非常方便', audio: '环境音+背景音乐', imageUrl: '', transition: '滑动', notes: '自然光拍摄' },
            { id: 4, title: '结尾', shot: '全景', duration: 4, movement: '拉远', visual: 'Logo展示，Slogan出现', dialogue: '旁白：立即体验', audio: '音乐渐弱', imageUrl: '', transition: '淡入淡出', notes: '' }
        ];
        let editingId = null;

        function init() { renderScenes(); updateStats(); }

        function renderScenes() {
            const list = document.getElementById('sceneList');
            list.innerHTML = scenes.map((s, i) => `
                <div class="scene-card" draggable="true" ondragstart="dragStart(event,${i})" ondragover="event.preventDefault()" ondrop="drop(event,${i})">
                    <div class="scene-thumb" style="background:${s.imageUrl ? 'none' : 'var(--border-color)'};">
                        ${s.imageUrl ? `<img src="${s.imageUrl}" alt="${s.title}">` : `<span>场景 ${i+1}<br>${s.shot}</span>`}
                        <div style="position:absolute;top:4px;left:4px;" class="drag-handle">⠿</div>
                    </div>
                    <div class="scene-info">
                        <h4><span class="shot-badge">${s.shot}</span> ${s.title}</h4>
                        <p style="margin:4px 0;font-size:13px;">${s.visual}</p>
                        ${s.dialogue ? `<p style="margin:4px 0;font-size:12px;color:var(--secondary-color);font-style:italic;">"${s.dialogue}"</p>` : ''}
                        <div class="meta">
                            <span>⏱ ${s.duration}秒</span>
                            <span>🎬 ${s.movement}</span>
                            <span>🔀 ${s.transition}</span>
                            ${s.audio ? `<span>🔊 ${s.audio}</span>` : ''}
                        </div>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:4px;">
                        <button class="btn-sm" onclick="editScene(${s.id})">编辑</button>
                        <button class="btn-sm btn-danger" onclick="deleteSceneById(${s.id})">×</button>
                        ${i > 0 ? `<button class="btn-sm btn-outline" onclick="moveScene(${i},-1)">↑</button>` : ''}
                        ${i < scenes.length-1 ? `<button class="btn-sm btn-outline" onclick="moveScene(${i},1)">↓</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const totalDur = scenes.reduce((s,x) => s + x.duration, 0);
            const target = +document.getElementById('targetDuration').value || 60;
            document.getElementById('statsRow').innerHTML = `
                <div class="stat"><div class="num">${scenes.length}</div><div class="label">场景数</div></div>
                <div class="stat"><div class="num">${totalDur}秒</div><div class="label">总时长</div></div>
                <div class="stat"><div class="num">${Math.round(totalDur/target*100)}%</div><div class="label">目标占比</div></div>
                <div class="stat"><div class="num">${target - totalDur > 0 ? '+' : ''}${target - totalDur}秒</div><div class="label">剩余时间</div></div>
            `;
        }

        function addScene() {
            const id = Date.now();
            scenes.push({ id, title: '新场景', shot: '中景', duration: 5, movement: '静止', visual: '', dialogue: '', audio: '', imageUrl: '', transition: '无', notes: '' });
            renderScenes(); updateStats(); editScene(id);
        }

        function editScene(id) {
            const s = scenes.find(x => x.id === id);
            if (!s) return;
            editingId = id;
            document.getElementById('editSceneNum').textContent = `#${scenes.indexOf(s)+1}`;
            document.getElementById('editTitle').value = s.title;
            document.getElementById('editShot').value = s.shot;
            document.getElementById('editDuration').value = s.duration;
            document.getElementById('editMovement').value = s.movement;
            document.getElementById('editVisual').value = s.visual;
            document.getElementById('editDialogue').value = s.dialogue;
            document.getElementById('editAudio').value = s.audio;
            document.getElementById('editImageUrl').value = s.imageUrl;
            document.getElementById('editTransition').value = s.transition;
            document.getElementById('editNotes').value = s.notes;
            document.getElementById('editThumb').innerHTML = s.imageUrl ? `<img src="${s.imageUrl}" style="max-width:100%;max-height:180px;border-radius:8px;">` : '<span>点击设置图片</span>';
            document.getElementById('editPanel').style.display = 'block';
            document.getElementById('editPanel').scrollIntoView({ behavior: 'smooth' });
            document.getElementById('editImageUrl').onchange = function() {
                document.getElementById('editThumb').innerHTML = this.value ? `<img src="${this.value}" style="max-width:100%;max-height:180px;border-radius:8px;">` : '<span>点击设置图片</span>';
            };
        }

        function saveScene() {
            const s = scenes.find(x => x.id === editingId);
            if (!s) return;
            s.title = document.getElementById('editTitle').value;
            s.shot = document.getElementById('editShot').value;
            s.duration = +document.getElementById('editDuration').value;
            s.movement = document.getElementById('editMovement').value;
            s.visual = document.getElementById('editVisual').value;
            s.dialogue = document.getElementById('editDialogue').value;
            s.audio = document.getElementById('editAudio').value;
            s.imageUrl = document.getElementById('editImageUrl').value;
            s.transition = document.getElementById('editTransition').value;
            s.notes = document.getElementById('editNotes').value;
            closeEditor(); renderScenes(); updateStats();
        }

        function closeEditor() { document.getElementById('editPanel').style.display = 'none'; editingId = null; }

        function deleteScene() { deleteSceneById(editingId); closeEditor(); }

        function deleteSceneById(id) {
            if (!confirm('确定删除此场景？')) return;
            scenes = scenes.filter(x => x.id !== id);
            renderScenes(); updateStats();
        }

        function moveScene(i, dir) {
            const j = i + dir;
            [scenes[i], scenes[j]] = [scenes[j], scenes[i]];
            renderScenes();
        }

        let dragIdx = null;
        function dragStart(e, i) { dragIdx = i; }
        function drop(e, i) {
            e.preventDefault();
            if (dragIdx === null || dragIdx === i) return;
            const item = scenes.splice(dragIdx, 1)[0];
            scenes.splice(i, 0, item);
            dragIdx = null;
            renderScenes();
        }

        function updateInfo() { updateStats(); }

        function exportText() {
            const name = document.getElementById('projectName').value;
            const type = document.getElementById('videoType').value;
            const target = document.getElementById('targetDuration').value;
            let text = `【${name}】视频分镜脚本\n类型: ${type} | 目标时长: ${target}秒\n${'='.repeat(40)}\n\n`;
            scenes.forEach((s, i) => {
                text += `场景 ${i+1}: ${s.title}\n`;
                text += `  镜头: ${s.shot} | 时长: ${s.duration}秒 | 运镜: ${s.movement}\n`;
                text += `  画面: ${s.visual}\n`;
                if (s.dialogue) text += `  对白: ${s.dialogue}\n`;
                if (s.audio) text += `  音效: ${s.audio}\n`;
                text += `  转场: ${s.transition}\n`;
                if (s.notes) text += `  备注: ${s.notes}\n`;
                text += '\n';
            });
            document.getElementById('exportArea').textContent = text;
        }

        function exportJSON() {
            document.getElementById('exportArea').textContent = JSON.stringify({ project: document.getElementById('projectName').value, scenes }, null, 2);
        }

        function exportCSV() {
            let csv = '场景,标题,镜头,时长(秒),运镜,画面描述,对白,音效,转场,备注\n';
            scenes.forEach(s => {
                csv += `"${scenes.indexOf(s)+1}","${s.title}","${s.shot}",${s.duration},"${s.movement}","${s.visual}","${s.dialogue}","${s.audio}","${s.transition}","${s.notes}"\n`;
            });
            document.getElementById('exportArea').textContent = csv;
        }

        function toggleTheme() {
            const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
        }

        init();
    </script>
</body>
</html>
