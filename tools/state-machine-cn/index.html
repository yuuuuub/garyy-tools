<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔀 状态机图 - State Machine Diagram</title>
<meta name="description" content="创建UML状态机图，可视化对象的状态转换流程">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔀</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔀 状态机图 - State Machine Diagram">
<meta property="og:description" content="创建UML状态机图，可视化对象的状态转换流程">
<meta property="og:type" content="website">

<meta property="og:image" content="https://garyy.top/og-image.png">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;padding:16px}
.hdr{text-align:center;margin-bottom:20px}
.hdr h1{font-size:1.6rem;color:var(--accent)}
.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:1rem;color:var(--accent);margin-bottom:10px}
textarea{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;min-height:140px;outline:none}
textarea:focus{border-color:var(--accent)}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600}
button:hover{opacity:.9}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
#canvas{display:block;width:100%;border-radius:8px;cursor:grab}
#canvas.dragging{cursor:grabbing}
.help{font-size:.75rem;color:var(--text2);margin-top:8px;line-height:1.8}
.help code{background:var(--bg);padding:1px 6px;border-radius:4px;font-size:.75rem}
</style>

<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>

<div class="hdr"><h1>🔀 状态机图</h1><p>UML状态机图可视化</p></div>

<div class="card">
<h2>数据定义</h2>
<textarea id="dataInput">状态: 空闲
状态: 处理中
状态: 等待确认
状态: 已完成
状态: 已取消

转换: 空闲 -> 处理中: 开始处理
转换: 处理中 -> 等待确认: 提交审核
转换: 等待确认 -> 已完成: 审核通过
转换: 等待确认 -> 处理中: 审核驳回
转换: 处理中 -> 已完成: 快速完成
转换: 空闲 -> 已取消: 取消
转换: 处理中 -> 已取消: 取消
转换: 等待确认 -> 已取消: 取消

初始 -> 空闲
已完成 -> 终止</textarea>
<div class="help">
语法：<code>状态: 名称</code> | <code>转换: 状态A -> 状态B: 触发事件</code> | <code>初始 -> 状态</code> | <code>状态 -> 终止</code>
</div>
<div class="btn-row">
<button onclick="generate()">生成状态机图</button>
<button class="sec" onclick="loadSample()">加载示例</button>
<button class="sec" onclick="exportPNG()">💾 导出PNG</button>
</div>
</div>

<div class="card">
<h2>状态机图预览</h2>
<canvas id="canvas" height="500"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let stateNodes = [];
let transitions = [];
let dragging = null;
let dragOff = {x:0,y:0};

function resize() {
  canvas.width = canvas.parentElement.clientWidth - 32;
}
resize();
window.addEventListener('resize', () => { resize(); draw(); });

function generate() {
  const text = document.getElementById('dataInput').value;
  stateNodes = [];
  transitions = [];

  const stateNames = new Set();

  text.split('\n').map(l => l.trim()).filter(l => l).forEach(line => {
    if(line.startsWith('状态:') || line.startsWith('State:')) {
      const name = line.split(':')[1].trim();
      stateNames.add(name);
    } else if(line.startsWith('转换:') || line.startsWith('Transition:')) {
      const match = line.match(/转换:\s*(.+?)\s*->\s*(.+?):\s*(.+)/);
      if(match) {
        const from = match[1].trim(), to = match[2].trim(), event = match[3].trim();
        stateNames.add(from); stateNames.add(to);
        transitions.push({from, to, event});
      }
    } else if(line.includes('->')) {
      const parts = line.split('->').map(s => s.trim());
      if(parts.length === 2) {
        stateNames.add(parts[0]); stateNames.add(parts[1]);
        transitions.push({from: parts[0], to: parts[1], event: ''});
      }
    }
  });

  // Layout states in circle
  const arr = [...stateNames];
  const cx = canvas.width/2, cy = canvas.height/2;
  const r = Math.min(cx, cy) * 0.6;

  arr.forEach((name, i) => {
    if(name === '初始' || name === '终止') {
      stateNodes.push({name, x: name==='初始' ? cx - r - 60 : cx + r + 60, cy, radius: 14, type: name});
    } else {
      const a = (i / (arr.length)) * Math.PI * 2 - Math.PI/2;
      stateNodes.push({name, x: cx + Math.cos(a)*r, y: cy + Math.sin(a)*r, radius: 30, type: 'normal'});
    }
  });

  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw transitions
  transitions.forEach(t => {
    const fromNode = stateNodes.find(n => n.name === t.from);
    const toNode = stateNodes.find(n => n.name === t.to);
    if(!fromNode || !toNode) return;

    const fx = fromNode.x, fy = fromNode.y || fromNode.cy;
    const tx = toNode.x, ty = toNode.y || toNode.cy;
    const r1 = fromNode.radius, r2 = toNode.radius;

    const dx = tx - fx, dy = ty - fy;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const ux = dx/dist, uy = dy/dist;

    const sx = fx + ux * r1, sy = fy + uy * r1;
    const ex = tx - ux * r2, ey = ty - uy * r2;

    // Curve for self-loops or overlapping
    const isSelf = fromNode === toNode;

    if(isSelf) {
      ctx.beginPath();
      ctx.arc(fx, fy - r1 - 25, 25, 0.3*Math.PI, 0.7*Math.PI, true);
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Arrow
      ctx.beginPath();
      ctx.moveTo(fx + 20, fy - r1 - 3);
      ctx.lineTo(fx + 12, fy - r1 - 15);
      ctx.lineTo(fx + 24, fy - r1 - 18);
      ctx.fillStyle = '#3b82f6';
      ctx.fill();
    } else {
      // Check for bidirectional
      const hasReverse = transitions.find(tr => tr.from === t.to && tr.to === t.from);
      const perpX = hasReverse ? -uy * 12 : 0;
      const perpY = hasReverse ? ux * 12 : 0;

      const midX = (sx+ex)/2 + perpX;
      const midY = (sy+ey)/2 + perpY;

      ctx.beginPath();
      ctx.moveTo(sx + perpX, sy + perpY);
      ctx.quadraticCurveTo(midX, midY, ex + perpX, ey + perpY);
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Arrowhead
      const angle = Math.atan2((ey+perpY) - midY, (ex+perpX) - midX);
      ctx.beginPath();
      ctx.moveTo(ex + perpX, ey + perpY);
      ctx.lineTo(ex + perpX - 10*Math.cos(angle-0.4), ey + perpY - 10*Math.sin(angle-0.4));
      ctx.lineTo(ex + perpX - 10*Math.cos(angle+0.4), ey + perpY - 10*Math.sin(angle+0.4));
      ctx.closePath();
      ctx.fillStyle = '#3b82f6';
      ctx.fill();

      // Label
      if(t.event) {
        ctx.fillStyle = '#e6edf3';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const lx = (sx+ex)/2 + perpX*2;
        const ly = (sy+ey)/2 + perpY*2 - 6;
        ctx.fillText(t.event, lx, ly);
      }
    }
  });

  // Draw states
  stateNodes.forEach(s => {
    const sy = s.y || s.cy;

    if(s.type === '初始') {
      // Solid circle
      ctx.beginPath();
      ctx.arc(s.x, sy, s.radius, 0, Math.PI*2);
      ctx.fillStyle = '#1a1a2e';
      ctx.fill();
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 3;
      ctx.stroke();
    } else if(s.type === '终止') {
      // Bullseye
      ctx.beginPath();
      ctx.arc(s.x, sy, s.radius, 0, Math.PI*2);
      ctx.fillStyle = '#1a1a2e';
      ctx.fill();
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(s.x, sy, s.radius - 8, 0, Math.PI*2);
      ctx.fillStyle = '#ef4444';
      ctx.fill();
    } else {
      // Rounded rectangle
      const w = s.radius * 2.5, h = s.radius * 1.4;

      ctx.fillStyle = '#161b22';
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 2;
      roundRect(ctx, s.x - w/2, sy - h/2, w, h, h/2);

      ctx.fillStyle = '#e6edf3';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(s.name, s.x, sy);
    }
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

// Drag support
canvas.addEventListener('mousedown', e => {
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  for(let i = stateNodes.length-1; i >= 0; i--) {
    const s = stateNodes[i];
    const sy = s.y || s.cy;
    if(Math.hypot(mx-s.x, my-sy) < s.radius + 10) {
      dragging = s;
      dragOff = {x: mx-s.x, y: my-sy};
      canvas.classList.add('dragging');
      break;
    }
  }
});
canvas.addEventListener('mousemove', e => {
  if(!dragging) return;
  const r = canvas.getBoundingClientRect();
  dragging.x = e.clientX - r.left - dragOff.x;
  if(dragging.y !== undefined) dragging.y = e.clientY - r.top - dragOff.y;
  else dragging.cy = e.clientY - r.top - dragOff.y;
  draw();
});
canvas.addEventListener('mouseup', () => { dragging=null; canvas.classList.remove('dragging'); });

function loadSample() {
  document.getElementById('dataInput').value = `状态: 待支付
状态: 已支付
状态: 生产中
状态: 已发货
状态: 已签收
状态: 已完成
状态: 退款中
状态: 已退款

转换: 待支付 -> 已支付: 用户付款
转换: 待支付 -> 已退款: 支付超时
转换: 已支付 -> 生产中: 排产
转换: 生产中 -> 已发货: 发货
转换: 已发货 -> 已签收: 签收
转换: 已签收 -> 已完成: 确认收货
转换: 已签收 -> 退款中: 申请退款
转换: 退款中 -> 已退款: 退款完成
转换: 已支付 -> 退款中: 申请退款

初始 -> 待支付
已完成 -> 终止
已退款 -> 终止`;
  generate();
}

function exportPNG() {
  const link = document.createElement('a');
  link.download = 'state-machine.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

generate();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
