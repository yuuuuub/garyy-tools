<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面运动</title>
<meta name="description" content="办公室桌面运动指南，久坐族的健康运动方案">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#60a5fa;--success:#4ade80;--warning:#fbbf24;--muted:#8b949e;--radius:12px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16pxscroll-behavior:smooth;}
.container{width:100%;max-width:500px}
h1{font-size:1.5rem;text-align:center;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.exercise-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-bottom:16px}
.ex-item{border:2px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:.2s}
.ex-item:hover{border-color:var(--accent)}
.ex-item.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
.ex-icon{font-size:2rem;margin-bottom:6px}
.ex-name{font-size:.75rem;color:var(--muted)}
.timer-ring{width:180px;height:180px;margin:20px auto;position:relative}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.timer-bg{stroke:var(--border)}
.timer-progress{stroke:var(--accent);transition:stroke-dashoffset .5s linear}
.timer-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-num{font-size:2.5rem;font-weight:700}
.timer-phase{font-size:.85rem;color:var(--muted);margin-top:4px}
.exercise-desc{text-align:center;color:var(--muted);font-size:.85rem;margin:12px 0;line-height:1.6;min-height:48px}
.exercise-anim{height:100px;display:flex;align-items:center;justify-content:center;margin:10px 0}
.anim-figure{width:60px;height:80px;position:relative}
.anim-head{width:20px;height:20px;border-radius:50%;background:var(--accent);position:absolute;top:0;left:50%;transform:translateX(-50%)}
.anim-body{width:3px;height:30px;background:var(--text);position:absolute;top:22px;left:50%;transform:translateX(-50%)}
.anim-arm{width:25px;height:3px;background:var(--text);position:absolute;top:28px}
.anim-arm.left{right:50%;transform-origin:right center}.anim-arm.right{left:50%;transform-origin:left center}
.anim-leg{width:3px;height:25px;background:var(--text);position:absolute;top:52px}
.anim-leg.left{left:calc(50% - 8px);transform-origin:top center}.anim-leg.right{left:calc(50% + 5px);transform-origin:top center}
.controls{display:flex;gap:10px;justify-content:center;margin-top:16px}
.btn{padding:10px 24px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}
.btn-primary{background:var(--accent);color:var(--text)}.btn-primary:hover{background:var(--accent2)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent)}
.btn-success{background:var(--success);color:#000}
.hidden{display:none}
.routine-info{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:12px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="桌面运动">
  <meta property="og:description" content="办公室桌面运动指南，久坐族的健康运动方案">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/desk-exercise/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🏃 桌面运动</h1>

<div class="card" id="selectCard">
<div class="exercise-grid" id="exerciseGrid"></div>
<button class="btn btn-primary" style="width:100%" onclick="startExercise()">开始运动</button>
<div style="margin-top:12px;text-align:center">
<button class="btn btn-outline" onclick="startRoutine()">播放全套动作 (约5分钟)</button>
</div>
</div>

<div class="card hidden" id="activeCard">
<div class="routine-info" id="routineInfo"></div>
<div class="exercise-anim" id="exerciseAnim"></div>
<div class="timer-ring">
<svg viewBox="0 0 100 100"><circle class="timer-bg" cx="50" cy="50" r="42"/><circle class="timer-progress" id="timerCircle" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="0"/></svg>
<div class="timer-text"><div class="timer-num" id="timerNum">00:30</div><div class="timer-phase" id="timerPhase">颈部旋转</div></div>
</div>
<div class="exercise-desc" id="exerciseDesc"></div>
<div class="controls">
<button class="btn btn-outline" onclick="prevExercise()">上一个</button>
<button class="btn btn-primary" id="playBtn" onclick="togglePlay()">暂停</button>
<button class="btn btn-outline" onclick="nextExercise()">下一个</button>
</div>
</div>
</div>

<script>
const exercises = [
  { name: '颈部旋转', icon: '🔄', duration: 30, desc: '缓慢旋转头部，顺时针10圈，逆时针10圈。动作要缓慢、轻柔。', anim: 'head' },
  { name: '肩部耸肩', icon: '💪', duration: 30, desc: '双肩上提至耳朵附近，保持3秒后放下。重复15次。', anim: 'shoulder' },
  { name: '手腕拉伸', icon: '🤲', duration: 30, desc: '一只手向前伸直，另一只手将手掌向身体方向拉。每侧保持15秒。', anim: 'wrist' },
  { name: '眼部休息', icon: '👀', duration: 60, desc: '闭眼5秒，然后远眺窗外20秒。重复3次。遵循20-20-20法则。', anim: 'eye' },
  { name: '坐姿扭转', icon: '🧘', duration: 30, desc: '坐在椅子上，双手交叉放在胸前，缓慢扭转上半身。每侧保持15秒。', anim: 'twist' },
  { name: '腿部抬升', icon: '🦵', duration: 30, desc: '坐直后缓慢抬起一条腿，伸直保持5秒后放下。每侧10次。', anim: 'leg' },
  { name: '踝关节旋转', icon: '🦶', duration: 30, desc: '抬起一只脚，旋转踝关节。顺时针10圈，逆时针10圈。', anim: 'ankle' },
  { name: '深呼吸', icon: '🌬️', duration: 60, desc: '鼻吸4秒→屏息4秒→口呼6秒。专注于呼吸，放松身体。', anim: 'breathe' }
];

let currentExercise = 0, isPlaying = false, timer = null, timeLeft = 0, animInterval = null;
let routineMode = false;

function init() {
  const grid = document.getElementById('exerciseGrid');
  exercises.forEach((ex, i) => {
    const item = document.createElement('div');
    item.className = 'ex-item' + (i === 0 ? ' active' : '');
    item.id = 'ex' + i;
    item.innerHTML = `<div class="ex-icon">${ex.icon}</div><div class="ex-name">${ex.name}</div>`;
    item.onclick = () => selectExercise(i);
    grid.appendChild(item);
  });
}

function selectExercise(i) {
  currentExercise = i;
  document.querySelectorAll('.ex-item').forEach((el, idx) => el.classList.toggle('active', idx === i));
}

function startExercise() {
  routineMode = false;
  showActiveCard();
}

function startRoutine() {
  routineMode = true;
  currentExercise = 0;
  showActiveCard();
}

function showActiveCard() {
  document.getElementById('selectCard').classList.add('hidden');
  document.getElementById('activeCard').classList.remove('hidden');
  loadExercise();
}

function loadExercise() {
  const ex = exercises[currentExercise];
  document.getElementById('timerPhase').textContent = ex.name;
  document.getElementById('exerciseDesc').textContent = ex.desc;
  document.getElementById('routineInfo').textContent = routineMode ? `全套动作 ${currentExercise + 1}/${exercises.length}` : '';
  document.getElementById('playBtn').textContent = '暂停';
  isPlaying = true;
  timeLeft = ex.duration;
  updateTimerDisplay();
  startAnim(ex.anim);
  if (timer) clearInterval(timer);
  timer = setInterval(() => {
    if (!isPlaying) return;
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timer);
      notifyComplete();
      if (routineMode) {
        if (currentExercise < exercises.length - 1) {
          currentExercise++;
          loadExercise();
        } else {
          stopExercise();
        }
      }
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
  const s = String(timeLeft % 60).padStart(2, '0');
  document.getElementById('timerNum').textContent = `${m}:${s}`;
  const total = exercises[currentExercise].duration;
  const pct = (total - timeLeft) / total;
  const circle = document.getElementById('timerCircle');
  circle.style.strokeDashoffset = 264 * (1 - pct);
}

function togglePlay() {
  isPlaying = !isPlaying;
  document.getElementById('playBtn').textContent = isPlaying ? '暂停' : '继续';
}

function prevExercise() {
  if (currentExercise > 0) { currentExercise--; loadExercise(); }
}

function nextExercise() {
  if (currentExercise < exercises.length - 1) { currentExercise++; loadExercise(); }
}

function stopExercise() {
  if (timer) clearInterval(timer);
  if (animInterval) { cancelAnimationFrame(animInterval); animInterval = null; }
  isPlaying = false;
  document.getElementById('selectCard').classList.remove('hidden');
  document.getElementById('activeCard').classList.add('hidden');
}

function notifyComplete() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 800; gain.gain.value = 0.3;
    osc.start(); osc.stop(ctx.currentTime + 0.2);
  } catch(e) {}
}

function startAnim(type) {
  if (animInterval) cancelAnimationFrame(animInterval);
  const container = document.getElementById('exerciseAnim');
  container.innerHTML = `<div class="anim-figure"><div class="anim-head" id="aHead"></div><div class="anim-body"></div><div class="anim-arm left" id="aArmL"></div><div class="anim-arm right" id="aArmR"></div><div class="anim-leg left" id="aLegL"></div><div class="anim-leg right" id="aLegR"></div></div>`;

  let deg = 0, pos = 0, up = false, scale = 1, dir = 0.01, legDeg = 0, legDir = 1;
  let lastTime = performance.now();
  function animLoop(now) {
    if (!isPlaying) { animInterval = null; return; }
    const dt = now - lastTime;
    if (dt >= 50) {
      lastTime = now;
      const h = document.getElementById('aHead');
      const armL = document.getElementById('aArmL');
      const armR = document.getElementById('aArmR');
      const legL = document.getElementById('aLegL');
      const legR = document.getElementById('aLegR');
      const body = document.querySelector('.anim-body');
      switch(type) {
        case 'head': deg = (deg + 3) % 360; if(h) h.style.transform = `translateX(-50%) rotate(${Math.sin(deg * Math.PI / 180) * 20}deg)`; break;
        case 'shoulder': pos += up ? -1 : 1; if (pos < -5) up = true; if (pos > 0) up = false; if(armL) armL.style.transform = `translateY(${pos}px)`; if(armR) armR.style.transform = `translateY(${pos}px)`; break;
        case 'wrist': deg = (deg + 2) % 30; if(armL) armL.style.transform = `rotate(${-30 - deg}deg)`; break;
        case 'eye': if(h) h.style.opacity = h.style.opacity === '0.5' ? '1' : '0.5'; break;
        case 'twist': deg = (deg + 1) % 60 - 30; if(body) body.style.transform = `translateX(-50%) rotate(${deg}deg)`; break;
        case 'leg': legDeg += legDir * 1.5; if (legDeg > 30 || legDeg < 0) legDir *= -1; if(legL) legL.style.transform = `rotate(${-legDeg}deg)`; break;
        case 'ankle': deg = (deg + 3) % 360; if(legR) legR.style.transform = `rotate(${Math.sin(deg * Math.PI / 180) * 15}deg)`; break;
        case 'breathe': scale += dir; if (scale > 1.15 || scale < 1) dir *= -1; if(body) body.style.transform = `translateX(-50%) scaleX(${scale})`; break;
      }
    }
    animInterval = requestAnimationFrame(animLoop);
  }
  animInterval = requestAnimationFrame(animLoop);
}

init();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
