<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭用水计算器 | Water Conservation CN</title>
<meta property="og:title" content="家庭用水计算器 | Water Conservation CN">
<meta property="og:description" content="家庭用水计算器 | Water Conservation CN - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="家庭用水计算器，估算用水量并提供节水建议">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>">
<meta name="robots" content="index, follow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--input:#242836;--text:#e2e4e9;--text2:#8b8fa3;--blue:#3b82f6;--blue2:#2563eb;--green:#22c55e;--warn:#f59e0b;--border:#2a2e3a;--radius:12px;--radius-sm:8px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--input:#f0f2f5;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--warn:#bf8700;--border:#d0d7de}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;line-height:1.6;padding:20px}
.container{max-width:860px;margin:0 auto;padding:0 12px}
header{text-align:center;padding:40px 0 24px}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#3b82f6,#60a5fa,#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{color:var(--text2);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px;transition:border-color .2s}
.card:hover{border-color:#3a3f50}
.card h2{font-size:1.15rem;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:.88rem;font-weight:500;color:var(--text2)}
.form-group input{background:var(--input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-size:.93rem;font-family:inherit;outline:none;width:100%}
.form-group input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 32px;border-radius:var(--radius-sm);font-size:1rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:all .2s;width:100%}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue2);transform:translateY(-1px)}
.btn-secondary{background:var(--input);color:var(--text);border:1px solid var(--border);margin-top:10px}
.result-hidden{display:none}
.result-visible{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.total-box{text-align:center;padding:20px 0}
.total-box .big-num{font-size:3.5rem;font-weight:800;background:linear-gradient(135deg,#3b82f6,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.total-box .unit{color:var(--text2);font-size:1rem;margin-top:4px}
.breakdown-item{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.breakdown-item .b-label{min-width:80px;font-size:.88rem}
.breakdown-item .b-track{flex:1;height:20px;background:#1e2230;border-radius:4px;overflow:hidden}
.breakdown-item .b-fill{height:100%;border-radius:4px;transition:width .6s ease;display:flex;align-items:center;padding-right:8px;font-size:.72rem;font-weight:600;color:#fff}
.breakdown-item .b-val{min-width:60px;text-align:right;font-size:.85rem;font-weight:600}
.tips-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:500px){.tips-grid{grid-template-columns:1fr}}
.tip{background:var(--input);border-radius:var(--radius-sm);padding:14px 16px;font-size:.88rem;border-left:3px solid var(--blue)}
.tip .tip-cat{font-size:.75rem;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.82rem}
</style>
</head>
<body>
<div class="container">
<header><h1>家庭用水计算器</h1><p class="subtitle">了解家庭用水情况，践行节水生活</p></header>
<div class="card" id="inputCard">
<h2><span class="icon">💧</span> 输入每日用水习惯</h2>
<div class="form-grid">
<div class="form-group"><label>洗澡时长（分钟）</label><input type="number" id="shower" value="8" min="0" max="60"></div>
<div class="form-group"><label>淋浴还是泡澡</label><select id="showerType" style="background:var(--input);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-size:.93rem;width:100%"><option value="shower">🚿 淋浴</option><option value="bath">🛁 泡澡</option></select></div>
<div class="form-group"><label>洗手/刷牙次数</label><input type="number" id="washHands" value="8" min="0" max="30"></div>
<div class="form-group"><label>每次洗手用水（升）</label><input type="number" id="handWater" value="5" min="0" max="20"></div>
<div class="form-group"><label>冲厕次数</label><input type="number" id="flush" value="6" min="0" max="20"></div>
<div class="form-group"><label>是否节水马桶</label><select id="toiletType" style="background:var(--input);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-size:.93rem;width:100%"><option value="normal">普通马桶（9升/次）</option><option value="save">节水马桶（6升/次）</option><option value="dual">双键马桶（3/6升）</option></select></div>
<div class="form-group"><label>洗衣服次数/周</label><input type="number" id="laundry" value="5" min="0" max="14"></div>
<div class="form-group"><label>做饭时间（分钟/天）</label><input type="number" id="cooking" value="30" min="0" max="120"></div>
</div>
<button class="btn btn-primary" onclick="calc()">💧 计算用水量</button>
</div>
<div id="result" class="result-hidden">
<div class="card">
<div class="total-box">
<div style="font-size:.9rem;color:var(--text2);margin-bottom:4px">你的日用水量</div>
<div class="big-num" id="totalL">0</div>
<div class="unit">升 / 天</div>
<div id="compNote" style="margin-top:8px;font-size:.95rem"></div>
</div>
<div id="breakdown"></div>
</div>
<div class="card">
<h2><span class="icon">💡</span> 节水建议</h2>
<div class="tips-grid" id="tips"></div>
</div>
<button class="btn btn-secondary" onclick="resetForm()">🔄 重新计算</button>
</div>
<footer>家庭用水计算器 · 参考：中国人均日用水约150-200升</footer>
</div>
<script>
const SHOWER_FLOW=10;const BATH_VOL=150;const TOILET_VOL={normal:9,save:6,dual:4.5};
function calc(){
const showerMin=parseInt(document.getElementById('shower').value)||0;
const showerType=document.getElementById('showerType').value;
const hands=parseInt(document.getElementById('washHands').value)||0;
const handL=parseInt(document.getElementById('handWater').value)||0;
const flushN=parseInt(document.getElementById('flush').value)||0;
const toilet=document.getElementById('toiletType').value;
const laundryW=parseInt(document.getElementById('laundry').value)||0;
const cookMin=parseInt(document.getElementById('cooking').value)||0;
const showerL=showerType==='bath'?BATH_VOL:showerMin*SHOWER_FLOW;
const handsL=hands*handL;
const flushL=flushN*TOILET_VOL[toilet];
const laundryL=laundryW*50/7;
const cookingL=cookMin*2;
const drinkingL=5;
const otherL=20;
const totalL=showerL+handsL+flushL+laundryL+cookingL+drinkingL+otherL;
const cats=[
{name:'洗澡',val:showerL,color:'#60a5fa'},
{name:'洗手',val:handsL,color:'#34d399'},
{name:'冲厕',val:flushL,color:'#fbbf24'},
{name:'洗衣',val:laundryL,color:'#c084fc'},
{name:'做饭',val:cookingL,color:'#f87171'},
{name:'其他',val:drinkingL+otherL,color:'#8b8fa3'}
];
const maxV=Math.max(...cats.map(c=>c.val),0.1);
let bh='';
cats.forEach(c=>{
const pct=totalL>0?(c.val/totalL*100):0;
bh+=`<div class="breakdown-item"><span class="b-label">${c.name}</span><div class="b-track"><div class="b-fill" style="width:${pct}%;background:${c.color}">${c.val.toFixed(0)}L</div></div><span class="b-val">${pct.toFixed(1)}%</span></div>`;
});
document.getElementById('breakdown').innerHTML=bh;
document.getElementById('totalL').textContent=totalL.toFixed(0);
let note='';
if(totalL<100)note='<span style="color:var(--green);font-weight:700">✅ 用水量很低，节水做得好！</span>';
else if(totalL<200)note='<span style="color:var(--blue);font-weight:700">👍 用水量适中，还有优化空间</span>';
else note='<span style="color:var(--warn);font-weight:700">⚠️ 用水量偏高，建议优化用水习惯</span>';
document.getElementById('compNote').innerHTML=note;
const allTips=[
{cat:'洗澡',text:'缩短洗澡时间至5分钟，可节水约50%'},
{cat:'洗澡',text:'选择淋浴代替泡澡，每次可节省100升以上'},
{cat:'冲厕',text:'在马桶水箱中放一瓶水可减少每次冲水量'},
{cat:'洗衣',text:'攒够一桶再洗，避免少量衣物频繁洗涤'},
{cat:'厨房',text:'洗菜水收集起来浇花，一水多用'},
{cat:'洗手',text:'使用水龙头节水器，减少不必要的流水'},
{cat:'通用',text:'修复滴水龙头，一个滴水龙头每天浪费70升'},
{cat:'通用',text:'安装智能水表，实时监控家庭用水量'}
];
let th='';
allTips.forEach(t=>{th+=`<div class="tip"><div class="tip-cat">${t.cat}</div>${t.text}</div>`});
document.getElementById('tips').innerHTML=th;
document.getElementById('result').className='result-visible';
document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
function resetForm(){document.getElementById('result').className='result-hidden';document.getElementById('inputCard').scrollIntoView({behavior:'smooth'})}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
