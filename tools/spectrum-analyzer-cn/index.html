<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 频谱分析器</title>
<meta property="og:title" content="📊 频谱分析器">
<meta property="og:description" content="📊 频谱分析器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线频谱分析器，实时显示音频频谱、FFT分析和频率分布">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.canvas-wrap{background:#0a0a1a;border-radius:12px;overflow:hidden;margin:12px 0}
canvas{width:100%;display:block}
.controls{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.ctrl-btn{padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;font-weight:600}
.ctrl-btn.play{background:var(--green);color:#fff;border:none}
.ctrl-btn.play:hover{background:#2ea043}
.ctrl-btn.play.active{background:var(--red)}
.ctrl-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.param-group{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.param-item{flex:1;min-width:100px}
.param-label{font-size:11px;color:var(--text-secondary);margin-bottom:4px}
.param-val{font-size:14px;font-weight:700;color:var(--accent)}
.slider-group{margin-bottom:12px}
.slider-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--accent)}
.wave-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.wave-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:11px;cursor:pointer;transition:all .2s;font-weight:600}
.wave-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.info-cell{padding:8px;border-radius:8px;background:var(--preview-bg);text-align:center}
.info-cell .val{font-size:16px;font-weight:700;color:var(--accent)}
.info-cell .lbl{font-size:10px;color:var(--text-secondary)}
.footer{text-align:center;padding:20px 0;font-size:12px;color:var(--text-secondary)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📊 频谱分析器</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">🎵 音源选择</div>
<div class="wave-btns" id="waveBtns"></div>
<div class="slider-group">
<div class="slider-label"><span>频率</span><b id="freqVal">440 Hz</b></div>
<input type="range" min="20" max="2000" value="440" id="freqSlider" oninput="updateFreq()">
</div>
</div>
<div class="card">
<div class="card-title">📊 频谱图</div>
<div class="canvas-wrap"><canvas id="spectrumCanvas" width="500" height="250"></canvas></div>
<div class="controls">
<button class="ctrl-btn play" id="playBtn" onclick="togglePlay()">▶ 播放</button>
<button class="ctrl-btn" id="logBtn" onclick="toggleLog()">对数</button>
<button class="ctrl-btn" id="colorBtn" onclick="cycleColor()">🌈 主题</button>
</div>
</div>
<div class="card">
<div class="card-title">📈 实时数据</div>
<div class="info-grid" id="infoGrid">
<div class="info-cell"><div class="val" id="peakFreq">-</div><div class="lbl">峰值频率</div></div>
<div class="info-cell"><div class="val" id="peakAmp">-</div><div class="lbl">峰值振幅</div></div>
<div class="info-cell"><div class="val" id="rmsLevel">-</div><div class="lbl">RMS 电平</div></div>
<div class="info-cell"><div class="val" id="spectralFlux">-</div><div class="lbl">频谱变化率</div></div>
</div>
</div>
<div class="card">
<div class="card-title">📖 频率参考</div>
<div class="info-grid">
<div class="info-cell"><div class="val">20-60Hz</div><div class="lbl">低频/Bass</div></div>
<div class="info-cell"><div class="val">60-250Hz</div><div class="lbl">中低频</div></div>
<div class="info-cell"><div class="val">250-2kHz</div><div class="lbl">中频</div></div>
<div class="info-cell"><div class="val">2k-20kHz</div><div class="lbl">高频</div></div>
</div>
</div>
<div class="footer">频谱分析器 - Web Audio API + FFT</div>
</div>
<script>
let audioCtx,oscillator,gainNode,analyser,animId,isPlaying=false;
let currentFreq=440,waveType='sine',useLog=false,colorIdx=0;
const WAVE_TYPES=[{id:'sine',name:'正弦波'},{id:'square',name:'方波'},{id:'sawtooth',name:'锯齿波'},{id:'triangle',name:'三角波'}];
const COLOR_THEMES=[
{grad:['#00ff88','#00aaff','#6366f1'],name:'极光'},
{grad:['#ff6b6b','#ffd93d','#6bcb77'],name:'彩虹'},
{grad:['#667eea','#764ba2'],name:'紫色'},
{grad:['#f093fb','#f5576c'],name:'粉红'},
{grad:['#4facfe','#00f2fe'],name:'海洋'}
];
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function buildWaveBtns(){document.getElementById('waveBtns').innerHTML=WAVE_TYPES.map(w=>`<button class="wave-btn${w.id===waveType?' active':''}" onclick="selectWave('${w.id}')">${w.name}</button>`).join('')}
function selectWave(w){waveType=w;buildWaveBtns();if(isPlaying){stopOsc();startOsc()}}
function updateFreq(){currentFreq=+document.getElementById('freqSlider').value;document.getElementById('freqVal').textContent=currentFreq+' Hz';if(oscillator)oscillator.frequency.setValueAtTime(currentFreq,audioCtx.currentTime)}
function toggleLog(){useLog=!useLog;document.getElementById('logBtn').classList.toggle('active',useLog)}
function cycleColor(){colorIdx=(colorIdx+1)%COLOR_THEMES.length;document.getElementById('colorBtn').textContent='🌈 '+COLOR_THEMES[colorIdx].name}
function togglePlay(){if(isPlaying)stopPlay();else startPlay()}
function startPlay(){initAudio();isPlaying=true;document.getElementById('playBtn').textContent='⏹ 停止';document.getElementById('playBtn').classList.add('active');oscillator=audioCtx.createOscillator();gainNode=audioCtx.createGain();analyser=audioCtx.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=0.8;oscillator.type=waveType;oscillator.frequency.setValueAtTime(currentFreq,audioCtx.currentTime);gainNode.gain.setValueAtTime(0.3,audioCtx.currentTime);oscillator.connect(gainNode);gainNode.connect(analyser);analyser.connect(audioCtx.destination);oscillator.start();drawSpectrum()}
function stopPlay(){isPlaying=false;document.getElementById('playBtn').textContent='▶ 播放';document.getElementById('playBtn').classList.remove('active');stopOsc();cancelAnimationFrame(animId);clearCanvas()}
function stopOsc(){if(oscillator){try{oscillator.stop()}catch(e){}oscillator=null}}
function drawSpectrum(){if(!isPlaying||!analyser)return;const canvas=document.getElementById('spectrumCanvas');const ctx=canvas.getContext('2d');const W=canvas.width,H=canvas.height;const bufferLength=analyser.frequencyBinCount;const dataArray=new Uint8Array(bufferLength);analyser.getByteFrequencyData(dataArray);ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);const barCount=useLog?128:256;const barWidth=W/barCount;const colors=COLOR_THEMES[colorIdx].grad;let peakFreqIdx=0;let peakAmp=0;let sumSq=0;const prevData=drawSpectrum._prev||new Float32Array(bufferLength);let flux=0;
for(let i=0;i<barCount;i++){let idx;if(useLog){idx=Math.floor(Math.pow(i/barCount,2)*bufferLength)}else{idx=Math.floor(i/barCount*bufferLength)}const val=dataArray[idx]/255;const barH=val*H;const x=i*barWidth;if(val>peakAmp){peakAmp=val;peakFreqIdx=idx}sumSq+=val*val;flux+=Math.abs(val-prevData[idx]/255);prevData[idx]=dataArray[idx];
const t=i/barCount;const cIdx=Math.floor(t*(colors.length-1));const cFrac=t*(colors.length-1)-cIdx;const c1=colors[Math.min(cIdx,colors.length-1)];const c2=colors[Math.min(cIdx+1,colors.length-1)];ctx.fillStyle=blendColor(c1,c2,cFrac);ctx.fillRect(x,H-barH,barWidth-1,barH)}
drawSpectrum._prev=prevData;const nyquist=audioCtx.sampleRate/2;const peakF=Math.round(peakFreqIdx/bufferLength*nyquist);const peakDb=(20*Math.log10(peakAmp||0.001)).toFixed(1);const rms=Math.sqrt(sumSq/barCount);const rmsDb=(20*Math.log10(rms||0.001)).toFixed(1);document.getElementById('peakFreq').textContent=peakF+'Hz';document.getElementById('peakAmp').textContent=peakDb+'dB';document.getElementById('rmsLevel').textContent=rmsDb+'dB';document.getElementById('spectralFlux').textContent=(flux/barCount).toFixed(3);animId=requestAnimationFrame(drawSpectrum)}
function blendColor(c1,c2,t){const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16);const r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);const r=Math.round(r1+(r2-r1)*t),g=Math.round(g1+(g2-g1)*t),b=Math.round(b1+(b2-b1)*t);return`rgb(${r},${g},${b})`}
function clearCanvas(){const canvas=document.getElementById('spectrumCanvas');const ctx=canvas.getContext('2d');ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,canvas.width,canvas.height)}
buildWaveBtns();
</script>
</body>
</html>
