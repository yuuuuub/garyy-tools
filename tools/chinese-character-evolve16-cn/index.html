ont-size:1rem;font-weight:600;margin-bottom:2px}.evolution-desc{font-size:.85rem;color:var(--text2)}.evolution-line{position:absolute;left:30px;bottom:-16px;width:2px;height:16px;background:var(--border)}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}</style><meta property="og:title" content="汉字进化16"><meta property="og:description" content="汉字进化16 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🧬 汉字进化16</h1><p class="sub">在线查看汉字进化过程</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="showEvolution()">
</div>
<button class="btn" onclick="showEvolution()">查看进化</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var evolutionData={
  '父':{stages:[{era:'甲骨文',char:'👴',name:'象形字',desc:'像手持石斧的形象'},{era:'金文',char:'父',name:'象形字',desc:'手持工具之形'},{era:'小篆',char:'父',name:'象形字',desc:'规范化父字'},{era:'隶书',char:'父',name:'方块字',desc:'更加规整'},{era:'楷书',char:'父',name:'标准字',desc:'现代标准写法'}]},
  '母':{stages:[{era:'甲骨文',char:'👩',name:'象形字',desc:'像哺乳的母亲形象'},{era:'金文',char:'母',name:'象形字',desc:'母亲哺乳之形'},{era:'小篆',char:'母',name:'象形字',desc:'规范化母字'},{era:'隶书',char:'母',name:'方块字',desc:'更加规整'},{era:'楷书',char:'母',name:'标准字',desc:'现代标准写法'}]},
  '子':{stages:[{era:'甲骨文',char:'👶',name:'象形字',desc:'像婴儿的形状'},{era:'金文',char:'子',name:'象形字',desc:'婴儿更加清晰'},{era:'小篆',char:'子',name:'象形字',desc:'规范化子字'},{era:'隶书',char:'子',name:'方块字',desc:'更加规整'},{era:'楷书',char:'子',name:'标准字',desc:'现代标准写法'}]},
  '女':{stages:[{era:'甲骨文',char:'👧',name:'象形字',desc:'像跪坐的女子形象'},{era:'金文',char:'女',name:'象形字',desc:'女子跪坐之形'},{era:'小篆',char:'女',name:'象形字',desc:'规范化女字'},{era:'隶书',char:'女',name:'方块字',desc:'更加规整'},{era:'楷书',char:'女',name:'标准字',desc:'现代标准写法'}]},
  '老':{stages:[{era:'甲骨文',char:'👴',name:'会意字',desc:'从人从毛从匕，表示老人'},{era:'金文',char:'老',name:'会意字',desc:'老人拄杖之形'},{era:'小篆',char:'老',name:'会意字',desc:'规范化老字'},{era:'隶书',char:'老',name:'方块字',desc:'更加规整'},{era:'楷书',char:'老',name:'标准字',desc:'现代标准写法'}]},
  '少':{stages:[{era:'甲骨文',char:'🤏',name:'象形字',desc:'像细小的沙粒'},{era:'金文',char:'少',name:'象形字',desc:'小点更加清晰'},{era:'小篆',char:'少',name:'象形字',desc:'规范化少字'},{era:'隶书',char:'少',name:'方块字',desc:'更加规整'},{era:'楷书',char:'少',name:'标准字',desc:'现代标准写法'}]},
  '兄':{stages:[{era:'甲骨文',char:'👨',name:'会意字',desc:'从口从人，表示长者'},{era:'金文',char:'兄',name:'会意字',desc:'兄长之形'},{era:'小篆',char:'兄',name:'会意字',desc:'规范化兄字'},{era:'隶书',char:'兄',name:'方块字',desc:'更加规整'},{era:'楷书',char:'兄',name:'标准字',desc:'现代标准写法'}]},
  '弟':{stages:[{era:'甲骨文',char:'👦',name:'象形字',desc:'像缠绕的绳索'},{era:'金文',char:'弟',name:'象形字',desc:'绳索更加清晰'},{era:'小篆',char:'弟',name:'象形字',desc:'规范化弟字'},{era:'隶书',char:'弟',name:'方块字',desc:'更加规整'},{era:'楷书',char:'弟',name:'标准字',desc:'现代标准写法'}]},
  '夫':{stages:[{era:'甲骨文',char:'👨',name:'象形字',desc:'像成年男子束发的形象'},{era:'金文',char:'夫',name:'象形字',desc:'男子束发之形'},{era:'小篆',char:'夫',name:'象形字',desc:'规范化夫字'},{era:'隶书',char:'夫',name:'方块字',desc:'更加规整'},{era:'楷书',char:'夫',name:'标准字',desc:'现代标准写法'}]},
  '妻':{stages:[{era:'甲骨文',char:'👩',name:'会意字',desc:'从女从又，表示持家'},{era:'金文',char:'妻',name:'会意字',desc:'女子持家之形'},{era:'小篆',char:'妻',name:'会意字',desc:'规范化妻字'},{era:'隶书',char:'妻',name:'方块字',desc:'更加规整'},{era:'楷书',char:'妻',name:'标准字',desc:'现代标准写法'}]}
};
function showEvolution(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=evolutionData[char];
  if(!data){
    data={stages:[{era:'古代',char:char,name:'汉字',desc:'暂无详细进化信息'},{era:'现代',char:char,name:'标准字',desc:'现代标准写法'}]};
  }
  var html='<div class="card">';
  html+='<div style="text-align:center;margin-bottom:20px">';
  html+='<div style="font-size:4rem;font-weight:700;color:var(--blue)">'+char+'</div>';
  html+='<div style="font-size:1.1rem;color:var(--text2);margin-top:8px">汉字进化历程</div>';
  html+='</div>';
  html+='<div class="evolution-timeline">';
  data.stages.forEach(function(stage,index){
    html+='<div class="evolution-stage">';
    html+='<div class="evolution-char">'+stage.char+'</div>';
    html+='<div class="evolution-info">';
    html+='<div class="evolution-era">'+stage.era+'</div>';
    html+='<div class="evolution-name">'+stage.name+'</div>';
    html+='<div class="evolution-desc">'+stage.desc+'</div>';
    html+='</div>';
    if(index<data.stages.length-1){
      html+='<div class="evolution-line"></div>';
    }
    html+='</div>';
  });
  html+='</div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(evolutionData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showEvolution();
}
showEvolution();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
