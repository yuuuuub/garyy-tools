<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国画欣赏</title><meta name="description" content="中国画欣赏 - 在线欣赏中国画经典名作"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a017;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.painting-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .2s}.painting-item:hover{transform:translateY(-2px)}.painting-title{font-size:1.2rem;font-weight:600;color:var(--gold);margin-bottom:8px}.painting-artist{font-size:.9rem;color:var(--text2);margin-bottom:4px}.painting-dynasty{font-size:.85rem;color:var(--green);margin-bottom:12px}.painting-display{font-size:3rem;text-align:center;padding:30px;background:var(--bg);border-radius:8px;margin-bottom:12px;line-height:1.5;min-height:120px;display:flex;align-items:center;justify-content:center}.painting-desc{font-size:.9rem;color:var(--text)}.painting-detail{font-size:.85rem;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .2s}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto}.modal h2{color:var(--gold);margin-bottom:12px}.modal p{color:var(--text2);line-height:1.8;margin-bottom:12px}.modal .close-btn{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer}.theme-toggle{position:fixed;top:8px;right:80px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;color:var(--text);font-size:.75rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="中国画欣赏"><meta property="og:description" content="中国画欣赏 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>"></head><body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎨 中国画欣赏</h1><p class="sub">在线欣赏中国画经典名作</p>
<div class="card"><div class="search-box"><input type="text" id="searchInput" placeholder="搜索画作名称、画家..." oninput="filterPaintings()"></div>
<div class="btn-group"><button class="btn active" onclick="filterByCat('all',this)">全部</button><button class="btn" onclick="filterByCat('山水',this)">山水</button><button class="btn" onclick="filterByCat('人物',this)">人物</button><button class="btn" onclick="filterByCat('花鸟',this)">花鸟</button><button class="btn" onclick="filterByCat('工笔',this)">工笔</button><button class="btn" onclick="filterByCat('写意',this)">写意</button></div></div>
<div id="paintingList"></div></div>
<div class="modal-overlay" id="modal"><div class="modal" style="position:relative"><button class="close-btn" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><div id="modalDisplay" class="painting-display"></div><p id="modalArtist"></p><p id="modalDynasty"></p><p id="modalDesc"></p><p id="modalDetail" class="painting-detail"></p></div></div>
<script src="../i18n.js" defer></script>
<script>
var paintings=[
  {title:'千里江山图',artist:'王希孟',dynasty:'北宋',cat:'山水',emoji:'🏔️',desc:'以矿物颜料绘成的青绿山水长卷，全长11.9米，是中国十大传世名画之一。画面气势磅礴，色彩绚丽，展现了北宋山河的壮丽景象。',detail:'此画用笔精细，色彩鲜艳，在千年后依然光彩夺目。画中描绘了连绵起伏的山峦、烟波浩渺的江河、渔村野市、水榭楼台等景物。'},
  {title:'清明上河图',artist:'张择端',dynasty:'北宋',cat:'人物',emoji:'🏘️',desc:'描绘北宋都城汴京的繁华景象，是中国十大传世名画之一。全卷共绘人物814人、牲畜83头、船只29艘、房屋楼宇30多栋。',detail:'画卷生动记录了中国十二世纪北宋都城汴京的城市面貌和当时社会各阶层人民的生活状况，是北宋时期都城汴京繁荣的见证。'},
  {title:'富春山居图',artist:'黄公望',dynasty:'元代',cat:'山水',emoji:'🌅',desc:'被誉为"画中之兰亭"，是中国十大传世名画之一。描绘浙江富春江两岸初秋景色，峰峦叠翠，松石挺秀。',detail:'此画用水墨和浅绛着色，笔法苍简清润，为"元四家"之首黄公望的传世名作。几经辗转，分为两段，前段《剩山图》藏于浙江省博物馆，后段《无用师卷》藏于台北故宫博物院。'},
  {title:'洛神赋图',artist:'顾恺之',dynasty:'东晋',cat:'人物',emoji:'👩',desc:'根据曹植《洛神赋》创作，是中国十大传世名画之一。描绘了曹植与洛神真挚的爱情故事。',detail:'原作已佚，现存宋代摹本四本。画中人物传神，山水画法古朴，展现了东晋时期的绘画风格。'},
  {title:'簪花仕女图',artist:'周昉',dynasty:'唐代',cat:'工笔',emoji:'👸',desc:'描绘唐代贵族妇女悠闲生活的工笔重彩人物画。画中仕女体态丰腴，衣着华丽，展现了唐代的审美风尚。',detail:'此画是唐代仕女画的杰出代表，现藏于辽宁省博物馆。画中人物高髻簪花，体态丰腴，衣纹流畅，色彩艳丽。'},
  {title:'韩熙载夜宴图',artist:'顾闳中',dynasty:'五代',cat:'人物',emoji:'🎭',desc:'描绘南唐大臣韩熙载家宴场景的长卷。分为"听乐""观舞""休息""清吹""散宴"五段。',detail:'此画以连环画形式展现了韩熙载夜宴的全过程，人物刻画生动传神，是中国十大传世名画之一。'},
  {title:'步辇图',artist:'阎立本',dynasty:'唐代',cat:'人物',emoji:'👑',desc:'描绘唐太宗接见吐蕃使者禄东赞的场景。是汉藏民族团结的历史见证。',detail:'此画线条流畅，人物神态各异，色彩古朴典雅，是中国十大传世名画之一。'},
  {title:'溪山行旅图',artist:'范宽',dynasty:'北宋',cat:'山水',emoji:'⛰️',desc:'北宋山水画的巅峰之作。画面气势雄强，山峦浑厚，是"雨点皴"的典范作品。',detail:'此画被董其昌誉为"宋画第一"。画中巨峰矗立，气势磅礴，被誉为"东方的蒙娜丽莎"。'},
  {title:'墨葡萄图',artist:'徐渭',dynasty:'明代',cat:'写意',emoji:'🍇',desc:'徐渭大写意花鸟画的代表作。笔墨纵横奔放，葡萄晶莹剔透，题诗与画面浑然一体。',detail:'画上题诗"半生落魄已成翁，独立书斋啸晚风。笔底明珠无处卖，闲抛闲掷野藤中。"表达了画家怀才不遇的悲愤。'},
  {title:'蛙声十里出山泉',artist:'齐白石',dynasty:'近现代',cat:'写意',emoji:'🐸',desc:'齐白石的代表作之一。画面简洁，以寥寥数笔勾勒出山泉中游动的蝌蚪，巧妙地表现出蛙声十里的意境。',detail:'此画以简驭繁，是中国写意画"以少胜多"的典范。画面只有山涧、石块和蝌蚪，却让人联想到满塘蛙鸣。'},
  {title:'五牛图',artist:'韩滉',dynasty:'唐代',cat:'工笔',emoji:'🐄',desc:'中国十大传世名画之一，是现存最古的纸本中国画。描绘了五头神态各异的牛。',detail:'此画以粗放有力的线条勾勒牛的形态，设色简朴，是唐代畜兽画的杰出代表。'},
  {title:'瑞鹤图',artist:'赵佶',dynasty:'北宋',cat:'花鸟',emoji:'🦢',desc:'宋徽宗赵佶的代表作。描绘群鹤翔集于宣德门上空的祥瑞景象。',detail:'画中二十只丹顶鹤形态各异，或飞翔或栖息，色彩明丽，是宋代院体花鸟画的精品。'}
];
var currentCat='all';
function renderPaintings(list){
  var el=document.getElementById('paintingList');
  var html='';
  list.forEach(function(p,i){
    html+='<div class="painting-item" onclick="showDetail('+paintings.indexOf(p)+')">';
    html+='<div class="painting-title">'+p.emoji+' '+p.title+'</div>';
    html+='<div class="painting-artist">画家：'+p.artist+'</div>';
    html+='<div class="painting-dynasty">'+p.dynasty+' · '+p.cat+'</div>';
    html+='<div class="painting-display">'+p.emoji+'</div>';
    html+='<div class="painting-desc">'+p.desc.substring(0,60)+'...</div>';
    html+='</div>';
  });
  el.innerHTML=html||'<div class="card" style="text-align:center;color:var(--text2)">未找到匹配的画作</div>';
}
function filterPaintings(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=paintings.filter(function(p){
    var ms=p.title.includes(q)||p.artist.includes(q)||p.desc.includes(q);
    var mc=currentCat==='all'||p.cat===currentCat;
    return ms&&mc;
  });
  renderPaintings(filtered);
}
function filterByCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.btn-group .btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterPaintings();
}
function showDetail(i){
  var p=paintings[i];
  document.getElementById('modalTitle').textContent=p.title;
  document.getElementById('modalDisplay').textContent=p.emoji;
  document.getElementById('modalArtist').textContent='画家：'+p.artist;
  document.getElementById('modalDynasty').textContent=p.dynasty+' · '+p.cat;
  document.getElementById('modalDesc').textContent=p.desc;
  document.getElementById('modalDetail').textContent=p.detail;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='light'?'dark':'light');}
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search]');if(inp)inp.focus();}if(e.key==='Escape')closeModal();});
renderPaintings(paintings);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
