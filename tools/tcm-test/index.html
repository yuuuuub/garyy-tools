let answers = new Array(questions.length).fill(-1);
let currentQ = 0;
function showPage(pageId) {
  document.getElementById('start-page').classList.add('hidden');
  document.getElementById('quiz-page').classList.add('hidden');
  document.getElementById('result-page').classList.add('hidden');
  document.getElementById(pageId).classList.remove('hidden');
}
function startQuiz() {
  answers = new Array(questions.length).fill(-1);
  currentQ = 0;
  showPage('quiz-page');
  renderQuestion();
}
function renderQuestion() {
  const q = questions[currentQ];
  updateProgress();
  const card = document.getElementById('questionCard');
  let html = `
    <div class="question-num">第 ${currentQ + 1} 题 / 共 ${questions.length} 题</div>
    <div class="question-title">${q.title}</div>
    <div class="options">`;
  q.options.forEach((opt, i) => {
    const sel = answers[currentQ] === i ? ' selected' : '';
    html += `
      <button class="option-btn${sel}" onclick="selectOption(${i})">
        <span class="option-score">${i + 1}</span>
        <span>${opt}</span>
      </button>`;
  });
  html += '</div>';
  card.innerHTML = html;
  document.getElementById('btnPrev').style.visibility = currentQ === 0 ? 'hidden' : 'visible';
  const btnNext = document.getElementById('btnNext');
  if (currentQ === questions.length - 1) {
    btnNext.textContent = '查看结果';
  } else {
    btnNext.textContent = '下一题';
  }
  btnNext.disabled = answers[currentQ] === -1;
}
function selectOption(index) {
  answers[currentQ] = index;
  document.getElementById('btnNext').disabled = false;
  renderQuestion();
}
function updateProgress() {
  const pct = Math.round(((currentQ + 1) / questions.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `第 ${currentQ + 1} / ${questions.length} 题`;
}
function nextQuestion() {
  if (answers[currentQ] === -1) return;
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    showResults();
  }
}
function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}
function calculateScores() {
  let scores = new Array(9).fill(0);
  let maxPossible = new Array(9).fill(0);
  questions.forEach((q, qi) => {
    const ansIdx = answers[qi];
    if (ansIdx === -1) return;
    const w = q.weights[ansIdx];
    for (let i = 0; i < 9; i++) {
      scores[i] += w[i];
    }
  });
  questions.forEach(q => {
    for (let ci = 0; ci < 9; ci++) {
      let maxForQ = 0;
      q.weights.forEach(w => {
        if (w[ci] > maxForQ) maxForQ = w[ci];
      });
      maxPossible[ci] += maxForQ;
    }
  });
  let percentages = scores.map((s, i) => {
    return maxPossible[i] > 0 ? Math.round((s / maxPossible[i]) * 100) : 0;
  });
  return { scores, percentages };
}
function showResults() {
  const { scores, percentages } = calculateScores();
  let indexed = percentages.map((p, i) => ({ pct: p, idx: i }));
  indexed.sort((a, b) => b.pct - a.pct);
  const top1 = indexed[0];
  const top2 = indexed[1];
  document.getElementById('topConstName').textContent =
    `您的体质倾向：${constitutionNames[top1.idx]}`;
  document.getElementById('topConstPct').textContent =
    `倾向程度 ${top1.pct}%`;
  let topHtml = '';
  [top1, top2].forEach((item, rank) => {
    const name = constitutionNames[item.idx];
    const detail = constitutionDetails[name];
    const cls = rank === 0 ? 'top1' : 'top2';
    topHtml += `
      <div class="constitution-card ${cls}">
        <div class="const-header">
          <span class="const-name">${name}</span>
          <span class="const-pct">${item.pct}%</span>
        </div>
        <div class="const-desc">${detail.desc}</div>
        <div class="advice-section">
          <h4>饮食建议</h4>
          <p>${detail.diet}</p>
        </div>
        <div class="advice-section">
          <h4>运动建议</h4>
          <p>${detail.exercise}</p>
        </div>
        <div class="advice-section">
          <h4>起居建议</h4>
          <p>${detail.living}</p>
        </div>
        <div class="advice-section">
          <h4>穴位保健</h4>
          <p>${detail.acupoint}</p>
        </div>
      </div>`;
  });
  document.getElementById('topConstitutions').innerHTML = topHtml;
  let allHtml = '<h3>九种体质完整评分</h3><div class="score-list">';
  indexed.forEach(item => {
    allHtml += `
      <div class="score-item">
        <span class="s-name">${constitutionNames[item.idx]}</span>
        <span class="s-val">${item.pct}%</span>
      </div>`;
  });
  allHtml += '</div>';
  document.getElementById('allConstitutions').innerHTML = allHtml;
  showPage('result-page');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function restartQuiz() {
  answers = new Array(questions.length).fill(-1);
  currentQ = 0;
  startQuiz();
}
function shareResult() {
  const { percentages } = calculateScores();
  let indexed = percentages.map((p, i) => ({ pct: p, idx: i }));
  indexed.sort((a, b) => b.pct - a.pct);
  const topName = constitutionNames[indexed[0].idx];
  const text = `【中医体质测试】我的体质倾向是：${topName}（${indexed[0].pct}%）
来看看你是什么体质吧！
测试基于中华中医药学会标准，共11道题，涵盖精力、寒热、疲劳、睡眠、饮食等维度。`;
  if (navigator.share) {
    navigator.share({ title: '中医九种体质测试', text: text }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => {
      garyyToast('结果已复制到剪贴板，可以粘贴分享给朋友！');
    }).catch(() => {
      garyyToast(text);
    });
  }
}
</script>
