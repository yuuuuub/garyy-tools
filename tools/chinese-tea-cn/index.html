<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国茶文化百科 - Chinese Tea Culture Encyclopedia</title>
<meta name="description" content="中国茶文化百科，涵盖绿茶、红茶、乌龙茶、白茶、黑茶、黄茶六大茶类与茶道礼仪">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国茶文化百科 - Chinese Tea Culture Encyclopedia">
<meta property="og:description" content="中国茶文化百科，涵盖绿茶、红茶、乌龙茶、白茶、黑茶、黄茶六大茶类与茶道礼仪">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-tea-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍵</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#7a9e6a;--accent2:#5a8a4a}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#238636;--accent2:#1a7f37}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#0a1510 0%,#142818 50%,#1a3a20 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #2a5a30;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#7a9e6a,#5a8a4a,#4a7a3a,#3a6a2a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.tea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.tea-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.tea-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.tea-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.tea-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tea-card .t-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(122,158,106,0.15);color:var(--accent)}
.tea-card .t-name{font-size:1.3em;font-weight:bold}
.tea-card .t-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.tea-card .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tea-card .t-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.tea-card .t-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.tea-card .t-detail strong{color:var(--text)}
.tea-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.tea-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🍵 中国茶文化百科</h1>
<p>Chinese Tea Culture Encyclopedia — 探索六大茶类与中华茶道礼仪</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索茶类、名茶或茶道...（如"龙井""铁观音""普洱"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部茶类</button>
<button class="filter-btn" data-filter="绿茶">🍃 绿茶</button>
<button class="filter-btn" data-filter="红茶">🫖 红茶</button>
<button class="filter-btn" data-filter="乌龙茶">🍵 乌龙茶</button>
<button class="filter-btn" data-filter="白茶">🤍 白茶</button>
<button class="filter-btn" data-filter="黑茶">⬛ 黑茶</button>
<button class="filter-btn" data-filter="黄茶">💛 黄茶</button>
<button class="filter-btn" data-filter="茶道礼仪">🎎 茶道礼仪</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="tea-grid" id="teaGrid"></div>
<footer><p>🍵 中国茶文化百科 — 茶禅一味，静心养性</p></footer>
</div>
<script>
const TEA_DATA=[
  {id:1,name:"西湖龙井",en:"West Lake Longjing",category:"绿茶",icon:"🍃",origin:"浙江杭州",features:"色绿、香郁、味甘、形美",history:"西湖龙井是中国十大名茶之首，产于杭州西湖区。有'绿茶皇后'之称，以'色绿、香郁、味甘、形美'四绝著称。",brewing:"80°C，玻璃杯冲泡，2-3分钟",taste:"鲜爽甘醇，豆香或兰花香",benefits:"提神醒脑、抗氧化、降血脂",culture:"龙井茶与西湖一样，是杭州的文化符号。乾隆皇帝曾六次南巡，四次到龙井品茶。"},
  {id:2,name:"碧螺春",en:"Biluochun",category:"绿茶",icon:"🍃",origin:"江苏苏州",features:"条索纤细、卷曲如螺",history:"碧螺春产于江苏苏州太湖洞庭山，有'吓煞人香'之称。以其纤细卷曲的外形和清新的花果香著称。",brewing:"75-80°C，上投法冲泡",taste:"鲜爽甘甜，花果香浓郁",benefits:"提神醒脑、清热解毒、减肥美容",culture:"碧螺春的名字来源于康熙皇帝，因其卷曲如螺、色泽碧绿而得名。"},
  {id:3,name:"铁观音",en:"Tieguanyin",category:"乌龙茶",icon:"🍵",origin:"福建安溪",features:"兰花香、观音韵",history:"铁观音是中国十大名茶之一，产于福建安溪。以其独特的'观音韵'和兰花香著称。",brewing:"95-100°C，盖碗冲泡，5-10秒出汤",taste:"醇厚甘鲜，兰花香，回甘持久",benefits:"抗衰老、抗动脉硬化、减肥健美",culture:"铁观音的名字来源于'观音托梦'的传说，是闽南功夫茶的代表。"},
  {id:4,name:"大红袍",en:"Da Hong Pao",category:"乌龙茶",icon:"🍵",origin:"福建武夷山",features:"岩骨花香、岩韵明显",history:"大红袍产于福建武夷山，是中国最名贵的乌龙茶。母树大红袍仅有六棵，已被保护禁止采摘。",brewing:"95-100°C，功夫茶冲泡",taste:"岩骨花香，醇厚回甘，岩韵明显",benefits:"提神醒脑、抗衰老、降血脂",culture:"大红袍的名字来源于明代状元丁显御赐的红袍，是武夷岩茶的代表。"},
  {id:5,name:"普洱茶",en:"Pu'er Tea",category:"黑茶",icon:"⬛",origin:"云南普洱",features:"越陈越香、可收藏",history:"普洱茶产于云南，有千年历史。分为生普和熟普，生普可以长期存放，越陈越香。",brewing:"95-100°C，紫砂壶冲泡",taste:"醇厚顺滑，陈香或樟香",benefits:"降脂减肥、暖胃养胃、抗衰老",culture:"普洱茶是'可以喝的古董'，具有收藏价值，是茶文化的活化石。"},
  {id:6,name:"白毫银针",en:"Silver Needle",category:"白茶",icon:"🤍",origin:"福建福鼎",features:"满披白毫、挺直似针",history:"白毫银针是白茶中的极品，产于福建福鼎。以其满披白毫、挺直似针的外形著称。",brewing:"85-90°C，盖碗或玻璃杯冲泡",taste:"鲜爽甘甜，毫香明显",benefits:"清热解毒、降火消炎、美容养颜",culture:"白茶是中国最古老的茶类之一，加工工艺最简单，保留了最多的天然营养成分。"},
  {id:7,name:"君山银针",en:"Junshan Silver Needle",category:"黄茶",icon:"💛",origin:"湖南岳阳",features:"三起三落、芽身金黄",history:"君山银针产于湖南岳阳洞庭湖君山岛，是黄茶中的极品。冲泡时芽身在杯中三起三落，极为壮观。",brewing:"80-85°C，玻璃杯冲泡",taste:"甘甜醇和，毫香清鲜",benefits:"提神醒脑、消食化滞、抗氧化",culture:"君山银针曾是清代贡茶，冲泡时的'三起三落'被誉为'茶中奇观'。"},
  {id:8,name:"祁门红茶",en:"Keemun Black Tea",category:"红茶",icon:"🫖",origin:"安徽祁门",features:"祁门香、似花似蜜",history:"祁门红茶产于安徽祁门，是世界三大高香红茶之一。以其独特的'祁门香'著称。",brewing:"90-95°C，盖碗冲泡",taste:"醇厚甘甜，似花似蜜的香气",benefits:"暖胃养胃、提神醒脑、消食化滞",culture:"祁门红茶在国际市场上享有盛誉，曾获巴拿马万国博览会金奖。"},
  {id:9,name:"正山小种",en:"Lapsang Souchong",category:"红茶",icon:"🫖",origin:"福建武夷山",features:"松烟香、桂圆味",history:"正山小种是世界上最早的红茶，产于福建武夷山桐木关。以其独特的松烟香著称。",brewing:"90-95°C，盖碗或紫砂壶冲泡",taste:"醇厚甘甜，松烟香，桂圆味",benefits:"暖胃养胃、提神醒脑、消食化滞",culture:"正山小种是红茶的鼻祖，据说是在偶然中被发明的，后传入欧洲，影响了世界茶文化。"},
  {id:10,name:"功夫茶道",en:"Gongfu Tea Ceremony",category:"茶道礼仪",icon:"🎎",origin:"福建潮汕",features:"器具讲究、程序严谨",history:"功夫茶道是中国最著名的茶道形式，以福建潮汕地区最为正宗。'功夫'意为讲究、精致。",brewing:"根据茶类不同而异",taste:"品茶的过程重于结果",benefits:"修身养性、陶冶情操",culture:"功夫茶道体现了中国传统文化中'和、敬、清、寂'的精神，是茶文化的精髓。"},
  {id:11,name:"日本茶道",en:"Japanese Tea Ceremony",category:"茶道礼仪",icon:"🎎",origin:"日本",features:"一期一会、禅茶一味",history:"日本茶道源于中国唐代，由遣唐使传入日本。经过千利休等茶道大师的发展，形成了独特的日本茶道。",brewing:"抹茶80°C，茶筅点茶",taste:"抹茶的苦涩与甘甜",benefits:"修身养性、陶冶情操",culture:"日本茶道强调'一期一会'，即每次茶会都是独一无二的，体现了对当下的珍惜。"},
  {id:12,name:"茶马古道",en:"Tea Horse Road",category:"茶道礼仪",icon:"🐎",origin:"云南四川",features:"千年商道、文化交流",history:"茶马古道是古代以茶马贸易为主要商贸内容的交通要道，连接云南、四川与西藏。",brewing:"各地茶俗不同",taste:"茶的味道因地域而异",benefits:"促进民族团结和文化交流",culture:"茶马古道是世界上海拔最高、距离最长的古代商道，是人类文明交流的见证。"}
];
function renderCards(data){
  document.getElementById('teaGrid').innerHTML=data.map(t=>`
    <div class="tea-card" data-category="${t.category}">
      <div class="t-header"><div class="t-icon">${t.icon}</div><div><div class="t-name">${t.name}</div><div class="t-sub">${t.en} · ${t.origin}</div></div></div>
      <div class="t-meta"><span>${t.features}</span></div>
      <div class="t-detail"><strong>历史：</strong>${t.history}</div>
      <div class="t-detail"><strong>冲泡：</strong>${t.brewing}</div>
      <div class="t-detail"><strong>口感：</strong>${t.taste}</div>
      <div class="t-detail"><strong>功效：</strong>${t.benefits}</div>
      <div class="t-detail"><strong>文化：</strong>${t.culture}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(t=>{cats[t.category]=(cats[t.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">茶类/名茶</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(TEA_DATA);renderStats(TEA_DATA);
</script>
</body>
</html>
