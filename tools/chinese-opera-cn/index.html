<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国传统戏曲百科 - Chinese Opera Encyclopedia</title>
<meta name="description" content="中国传统戏曲百科，涵盖京剧、昆曲、越剧、黄梅戏等各大剧种的历史流派与经典剧目">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国传统戏曲百科 - Chinese Opera Encyclopedia">
<meta property="og:description" content="中国传统戏曲百科，涵盖京剧、昆曲、越剧、黄梅戏等各大剧种的历史流派与经典剧目">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-opera-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a0a 0%,#2a1010 50%,#3d1a1a 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #4a2020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a,#b06a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.opera-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.opera-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;cursor:default;position:relative;overflow:hidden}
.opera-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:14px 0 0 14px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.opera-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3);border-color:var(--accent)}
.opera-card .opera-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.opera-card .opera-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(232,168,124,0.15);color:var(--accent)}
.opera-card .opera-name{font-size:1.3em;font-weight:bold}
.opera-card .opera-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.opera-card .opera-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.opera-card .opera-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.opera-card .opera-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.opera-card .opera-detail strong{color:var(--text)}
.opera-card .opera-roles{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.opera-card .opera-roles .role-label{font-size:0.8em;color:var(--accent);margin-bottom:6px}
.opera-card .opera-roles .role-list{display:flex;flex-wrap:wrap;gap:6px}
.opera-card .opera-roles .role-tag{font-size:0.75em;padding:3px 10px;border-radius:10px;background:rgba(232,168,124,0.08);color:var(--accent);border:1px solid rgba(232,168,124,0.2)}
.opera-card.hidden{display:none}
.compare-section{background:var(--card);border-radius:16px;padding:24px;margin:24px 0;border:1px solid var(--border);text-align:center}
.compare-section h2{font-size:1.4em;margin-bottom:8px;color:var(--accent)}
.compare-section .compare-desc{font-size:0.85em;color:var(--text2);margin-bottom:16px}
.compare-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.compare-select{width:240px;padding:10px 16px;border-radius:10px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:0.95em;outline:none;cursor:pointer}
.compare-btn{padding:10px 28px;border-radius:20px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:bold;cursor:pointer;font-size:0.95em;transition:all 0.3s}
.compare-btn:hover{opacity:0.85}
.compare-result{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.compare-card{background:var(--bg);border-radius:12px;padding:20px;border:1px solid var(--border);text-align:left}
.compare-card h3{color:var(--accent);font-size:1.1em;margin-bottom:8px}
.compare-card .compare-item{margin-bottom:6px;font-size:0.85em;color:var(--text2);line-height:1.5}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.opera-grid{grid-template-columns:1fr}.compare-select{width:180px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🎭 中国传统戏曲百科</h1>
<p>Chinese Opera Encyclopedia — 探索中国各大剧种的历史流派、行当脸谱与经典剧目</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索剧种、剧目或角色...（如"京剧""牡丹亭""生旦净丑"）" title="Enter键搜索">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部剧种</button>
<button class="filter-btn" data-filter="京剧">🎭 京剧</button>
<button class="filter-btn" data-filter="昆曲">🎶 昆曲</button>
<button class="filter-btn" data-filter="越剧">🌸 越剧</button>
<button class="filter-btn" data-filter="黄梅戏">🍃 黄梅戏</button>
<button class="filter-btn" data-filter="豫剧">🏮 豫剧</button>
<button class="filter-btn" data-filter="粤剧">🏮 粤剧</button>
<button class="filter-btn" data-filter="川剧">🔥 川剧</button>
<button class="filter-btn" data-filter="评剧">🎪 评剧</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="opera-grid" id="operaGrid"></div>

<div class="compare-section">
<h2>剧种对比</h2>
<p class="compare-desc">选择两个剧种进行对比</p>
<div class="compare-row">
<select class="compare-select" id="compareA"></select>
<span class="compare-vs">VS</span>
<select class="compare-select" id="compareB"></select>
</div>
<button class="compare-btn" onclick="doCompare()">开始对比</button>
<div class="compare-result" id="compareResult"></div>
</div>

<footer>
<p>🎭 中国传统戏曲百科 — 传承国粹，弘扬文化</p>
</footer>
</div>

<script>
const OPERA_DATA = [
  {id:1,name:"京剧",en:"Peking Opera",category:"京剧",icon:"🎭",origin:"北京",dynasty:"清代",year:"1790年",features:"唱念做打、生旦净丑",history:"京剧形成于清朝乾隆年间，融合了徽剧、汉剧、昆曲等多种戏曲元素。被誉为'国粹'，是中国影响最大的戏曲剧种。",roles:["生","旦","净","丑","龙套"],masterpieces:["霸王别姬","贵妃醉酒","空城计","四郎探母","铡美案","闹天宫","三岔口","卖水"],schools:"梅派、程派、荀派、尚派（四大名旦）；谭派、马派、余派、麒派（四大须生）",culture:"京剧脸谱是京剧艺术的重要标志，不同颜色代表不同性格：红色忠勇、白色奸诈、黑色刚直、蓝色草莽。"},
  {id:2,name:"昆曲",en:"Kunqu Opera",category:"昆曲",icon:"🎶",origin:"苏州",dynasty:"明代",year:"14世纪",features:"水磨腔、载歌载舞",history:"昆曲起源于苏州昆山，是中国最古老的戏曲剧种之一，被称为'百戏之祖'。2001年被联合国教科文组织列为'人类口头和非物质遗产代表作'。",roles:["生","旦","净","末","丑","外","贴","小"],masterpieces:["牡丹亭","长生殿","桃花扇","西厢记","浣纱记","千忠戮","邯郸记","紫钗记"],schools:"昆曲正宗流派",culture:"昆曲以其典雅的唱词、细腻的表演和优美的音乐著称，是文人雅士推崇的高雅艺术。"},
  {id:3,name:"越剧",en:"Yue Opera",category:"越剧",icon:"🌸",origin:"浙江嵊州",dynasty:"清末",year:"1906年",features:"抒情优美、才子佳人",history:"越剧发源于浙江嵊州，是中国第二大剧种。以抒情见长，擅长演绎爱情故事，深受观众喜爱。",roles:["小生","花旦","老生","老旦","小丑"],masterpieces:["梁山伯与祝英台","红楼梦","西厢记","碧玉簪","盘妻索妻","追鱼","情探","祥林嫂"],schools:"袁派、傅派、吕派、王派、徐派、尹派",culture:"越剧以其清丽婉转的唱腔和细腻动人的表演著称，多演绎才子佳人的故事。"},
  {id:4,name:"黄梅戏",en:"Huangmei Opera",category:"黄梅戏",icon:"🍃",origin:"湖北黄梅",dynasty:"清代",year:"18世纪",features:"质朴清新、贴近生活",history:"黄梅戏起源于湖北黄梅，发展壮大于安徽安庆。曲调悠扬婉转，语言通俗易懂，是中国五大戏曲剧种之一。",roles:["花旦","小生","老生","丑角"],masterpieces:["天仙配","女驸马","牛郎织女","打猪草","夫妻观灯","罗帕记","告御状","小辞店"],schools:"严凤英派、马兰派",culture:"黄梅戏以其质朴清新、贴近生活的风格著称，严凤英的《天仙配》是最经典的作品。"},
  {id:5,name:"豫剧",en:"Yu Opera",category:"豫剧",icon:"🏮",origin:"河南",dynasty:"明代",year:"明末清初",features:"高亢激昂、铿锵有力",history:"豫剧发源于河南，是中国最大的地方剧种之一。唱腔高亢激昂，具有浓郁的中原文化特色。",roles:["生","旦","净","丑"],masterpieces:["花木兰","穆桂英挂帅","朝阳沟","七品芝麻官","抬花轿","断桥","红娘","五世请缨"],schools:"常派（常香玉）、陈派、崔派、马派",culture:"豫剧以其高亢激昂的唱腔和质朴豪放的风格著称，是中原文化的重要代表。"},
  {id:6,name:"粤剧",en:"Cantonese Opera",category:"粤剧",icon:"🏮",origin:"广东佛山",dynasty:"明代",year:"明末清初",features:"南派武功、唱腔独特",history:"粤剧又称'大戏'，是广东最大的地方剧种，流行于广东、广西、港澳及海外华人社区。2009年被联合国教科文组织列为'人类口头和非物质遗产代表作'。",roles:["文武生","花旦","丑生","武生","须生"],masterpieces:["帝女花","紫钗记","牡丹亭惊梦","红线盗盒","苏三起解","李后主","昭君出塞","梁祝"],schools:"薛派、马派、白派、任派",culture:"粤剧融合了南派武功和独特的粤语唱腔，是岭南文化的重要组成部分。"},
  {id:7,name:"川剧",en:"Sichuan Opera",category:"川剧",icon:"🔥",origin:"四川",dynasty:"明代",year:"明末清初",features:"变脸、吐火、高腔",history:"川剧是四川最大的地方剧种，以'变脸'绝技闻名世界。融合了高腔、昆腔、胡琴腔、弹戏、灯调五种声腔。",roles:["生","旦","净","末","丑"],masterpieces:["白蛇传","柳荫记","水漫金山","秋江","拦马","滚灯","变脸","望江亭"],schools:"高腔四大流派",culture:"川剧变脸是川剧艺术的标志性绝技，表演者能在瞬间变换多张脸谱，令观众叹为观止。"},
  {id:8,name:"评剧",en:"Ping Opera",category:"评剧",icon:"🎪",origin:"河北唐山",dynasty:"清末",year:"1910年左右",features:"生活气息浓郁、通俗易懂",history:"评剧发源于河北唐山，是中国北方重要的地方剧种。以贴近生活、通俗易懂著称，深受广大群众喜爱。",roles:["花旦","小生","老旦","彩旦"],masterpieces:["刘巧儿","花为媒","杨三姐告状","秦香莲","杜十娘","小二黑结婚","会计姑娘","三看御妹"],schools:"刘派（刘巧儿）、新派（新凤霞）",culture:"评剧以其浓郁的生活气息和通俗易懂的语言著称，是中国北方最受欢迎的地方剧种之一。"}
];

function renderCards(data){
  const grid=document.getElementById('operaGrid');
  grid.innerHTML=data.map(o=>`
    <div class="opera-card" data-category="${o.category}">
      <div class="opera-header">
        <div class="opera-icon">${o.icon}</div>
        <div><div class="opera-name">${o.name}</div><div class="opera-sub">${o.en} · ${o.origin}</div></div>
      </div>
      <div class="opera-meta">
        <span>${o.dynasty}</span><span>${o.year}</span><span>${o.features}</span>
      </div>
      <div class="opera-detail"><strong>历史：</strong>${o.history}</div>
      <div class="opera-detail"><strong>行当：</strong>${o.roles.join('、')}</div>
      <div class="opera-detail"><strong>代表剧目：</strong>${o.masterpieces.slice(0,5).join('、')}</div>
      <div class="opera-detail"><strong>流派：</strong>${o.schools}</div>
      <div class="opera-roles">
        <div class="role-label">🎭 文化特色</div>
        <div style="font-size:0.82em;color:var(--text2);line-height:1.6">${o.culture}</div>
      </div>
    </div>`).join('');
}

function renderStats(data){
  const cats={};
  data.forEach(o=>{cats[o.category]=(cats[o.category]||0)+1});
  const stats=document.getElementById('statsOverview');
  stats.innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">剧种总数</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}
  `;
}

function renderCompareSelects(){
  const sels=[document.getElementById('compareA'),document.getElementById('compareB')];
  sels.forEach(sel=>{
    sel.innerHTML=OPERA_DATA.map(o=>`<option value="${o.id}">${o.icon} ${o.name}</option>`).join('');
  });
  sels[1].selectedIndex=1;
}

function doCompare(){
  const a=OPERA_DATA.find(o=>o.id==document.getElementById('compareA').value);
  const b=OPERA_DATA.find(o=>o.id==document.getElementById('compareB').value);
  if(!a||!b)return;
  const items=['name','en','origin','dynasty','year','features','history','roles','masterpieces','schools','culture'];
  const labels={name:'中文名',en:'英文名',origin:'发源地',dynasty:'朝代',year:'时间',features:'特色',history:'历史',roles:'行当',masterpieces:'代表剧目',schools:'流派',culture:'文化特色'};
  document.getElementById('compareResult').innerHTML=`
    <div class="compare-card"><h3>${a.icon} ${a.name}</h3>${items.map(k=>`<div class="compare-item"><strong>${labels[k]}：</strong>${Array.isArray(a[k])?a[k].join('、'):a[k]}</div>`).join('')}</div>
    <div class="compare-card"><h3>${b.icon} ${b.name}</h3>${items.map(k=>`<div class="compare-item"><strong>${labels[k]}：</strong>${Array.isArray(b[k])?b[k].join('、'):b[k]}</div>`).join('')}</div>
  `;
}

document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.opera-card').forEach(c=>{
    const text=c.textContent.toLowerCase();
    c.classList.toggle('hidden',q&&!text.includes(q));
  });
});

document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.opera-card').forEach(c=>{
    c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f);
  });
});

renderCards(OPERA_DATA);
renderStats(OPERA_DATA);
renderCompareSelects();
</script>
</body>
</html>
