<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ 宏量营养素计算器</title>
<meta property="og:title" content="🍽️ 宏量营养素计算器">
<meta property="og:description" content="🍽️ 宏量营养素计算器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线宏量营养素(蛋白质/脂肪/碳水)计算器，根据目标定制每日饮食计划">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.gender-tabs{display:flex;gap:8px;margin-bottom:12px}
.gender-tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:14px;cursor:pointer;text-align:center;transition:all .2s;font-weight:600}
.gender-tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.preset-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.preset-tab{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;font-weight:500}
.preset-tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-group label{font-size:12px;color:var(--text-secondary);font-weight:500}
.input-group input,.input-group select{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;transition:all .2s}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--accent)}
.macro-sliders{margin-top:12px}
.slider-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.slider-label{width:60px;font-size:12px;font-weight:600}
.slider-input{flex:1;-webkit-appearance:none;height:8px;border-radius:4px;background:var(--border);outline:none}
.slider-input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer}
.slider-val{width:50px;font-size:13px;font-weight:600;text-align:right}
.calc-btn{width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.calc-btn:hover{background:var(--accent-hover)}
.result-main{background:var(--tag-bg);border-radius:12px;padding:16px;text-align:center;margin-top:12px}
.result-val{font-size:36px;font-weight:800;color:var(--accent)}
.result-label{font-size:13px;color:var(--text-secondary)}
.macro-donut{width:180px;height:180px;margin:12px auto}
.macro-result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.macro-item{background:var(--card-bg);border-radius:10px;padding:12px;text-align:center;border:1px solid var(--border)}
.macro-item .color{width:12px;height:12px;border-radius:50%;margin:0 auto 4px}
.macro-item .name{font-size:11px;color:var(--text-secondary)}
.macro-item .val{font-size:18px;font-weight:700;margin-top:2px}
.macro-item .pct{font-size:11px;color:var(--text-secondary)}
.meal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.meal-item{background:var(--preview-bg);border-radius:10px;padding:12px;text-align:center}
.meal-item .emoji{font-size:20px}
.meal-item .name{font-size:12px;font-weight:600;margin-top:4px}
.meal-item .val{font-size:11px;color:var(--text-secondary);margin-top:2px}
.tip{font-size:12px;color:var(--text-secondary);margin-top:12px;line-height:1.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🍽️ 宏量营养素计算器</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">👤 基本信息</div>
<div class="gender-tabs">
<div class="gender-tab active" onclick="setGender('male',this)">👨 男性</div>
<div class="gender-tab" onclick="setGender('female',this)">👩 女性</div>
</div>
<div class="input-row">
<div class="input-group">
<label>年龄（岁）</label>
<input type="number" id="age" placeholder="25" min="10" max="100">
</div>
<div class="input-group">
<label>身高（cm）</label>
<input type="number" id="height" placeholder="170" min="100" max="220">
</div>
</div>
<div class="input-row">
<div class="input-group">
<label>体重（kg）</label>
<input type="number" id="weight" placeholder="65" min="20" max="250">
</div>
<div class="input-group">
<label>活动水平</label>
<select id="activity">
<option value="1.2">久坐不动</option>
<option value="1.375">轻度运动</option>
<option value="1.55" selected>中度运动</option>
<option value="1.725">重度运动</option>
<option value="1.9">专业运动员</option>
</select>
</div>
</div>
</div>
<div class="card">
<div class="card-title">🎯 饮食目标</div>
<div class="preset-tabs" id="presetTabs">
<div class="preset-tab active" data-p="30" data-f="25" data-c="45" onclick="setPreset(this)">均衡饮食</div>
<div class="preset-tab" data-p="40" data-f="30" data-c="30" onclick="setPreset(this)">增肌塑形</div>
<div class="preset-tab" data-p="35" data-f="20" data-c="45" onclick="setPreset(this)">减脂减重</div>
<div class="preset-tab" data-p="25" data-f="65" data-c="10" onclick="setPreset(this)">生酮饮食</div>
<div class="preset-tab" data-p="30" data-f="30" data-c="40" onclick="setPreset(this)">地中海饮食</div>
</div>
<div class="macro-sliders">
<div class="slider-row">
<div class="slider-label" style="color:#ef4444">蛋白质</div>
<input type="range" class="slider-input" id="proteinSlider" min="5" max="60" value="30" oninput="updateSliders('protein')">
<div class="slider-val" id="proteinVal">30%</div>
</div>
<div class="slider-row">
<div class="slider-label" style="color:#eab308">脂肪</div>
<input type="range" class="slider-input" id="fatSlider" min="5" max="70" value="25" oninput="updateSliders('fat')">
<div class="slider-val" id="fatVal">25%</div>
</div>
<div class="slider-row">
<div class="slider-label" style="color:#3b82f6">碳水</div>
<input type="range" class="slider-input" id="carbSlider" min="5" max="75" value="45" oninput="updateSliders('carb')">
<div class="slider-val" id="carbVal">45%</div>
</div>
<div style="font-size:12px;color:var(--text-secondary);text-align:center">合计：<span id="totalPct" style="font-weight:600">100%</span></div>
</div>
<button class="calc-btn" onclick="calculate()" style="margin-top:12px">🍽️ 计算营养素</button>
</div>
<div class="card" id="resultCard" style="display:none">
<div class="card-title">📊 营养素分配</div>
<div class="result-main">
<div class="result-val" id="totalCal">--</div>
<div class="result-label">每日总热量 (千卡)</div>
</div>
<svg class="macro-donut" viewBox="0 0 180 180" id="donutChart"></svg>
<div class="macro-result-grid" id="macroGrid"></div>
</div>
<div class="card" id="mealCard" style="display:none">
<div class="card-title">🍽️ 三餐分配建议</div>
<div class="meal-grid" id="mealGrid"></div>
</div>
<div class="footer">Gary's Tools · 营养素仅供参考</div>
</div>
<script>
let currentGender='male';
let preset='balanced';
const presets={
balanced:{p:30,f:25,c:45},
muscle:{p:40,f:30,c:30},
cut:{p:35,f:20,c:45},
keto:{p:25,f:65,c:10},
med:{p:30,f:30,c:40}
};
function setGender(g,el){
currentGender=g;
document.querySelectorAll('.gender-tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
}
function setPreset(el){
document.querySelectorAll('.preset-tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
document.getElementById('proteinSlider').value=el.dataset.p;
document.getElementById('fatSlider').value=el.dataset.f;
document.getElementById('carbSlider').value=el.dataset.c;
updateSliders('all');
}
function updateSliders(changed){
let p=parseInt(document.getElementById('proteinSlider').value);
let f=parseInt(document.getElementById('fatSlider').value);
let c=parseInt(document.getElementById('carbSlider').value);
const total=p+f+c;
document.getElementById('proteinVal').textContent=p+'%';
document.getElementById('fatVal').textContent=f+'%';
document.getElementById('carbVal').textContent=c+'%';
const totalEl=document.getElementById('totalPct');
totalEl.textContent=total+'%';
totalEl.style.color=total===100?'var(--green)':'var(--red)';
}
function calculate(){
const age=parseFloat(document.getElementById('age').value);
const h=parseFloat(document.getElementById('height').value);
const w=parseFloat(document.getElementById('weight').value);
const act=parseFloat(document.getElementById('activity').value);
const pPct=parseInt(document.getElementById('proteinSlider').value);
const fPct=parseInt(document.getElementById('fatSlider').value);
const cPct=parseInt(document.getElementById('carbSlider').value);
if(!age||!h||!w){alert('请填写完整信息');return}
let bmr=currentGender==='male'?10*w+6.25*h-5*age+5:10*w+6.25*h-5*age-161;
const tdee=Math.round(bmr*act);
const total=pPct+fPct+cPct;
const pCal=Math.round(tdee*pPct/total);
const fCal=Math.round(tdee*fPct/total);
const cCal=tdee-pCal-fCal;
const pGram=Math.round(pCal/4);
const fGram=Math.round(fCal/9);
const cGram=Math.round(cCal/4);
document.getElementById('totalCal').textContent=tdee;
const r=70,cx=90,cy=90,circ=2*Math.PI*r;
const pArc=circ*pPct/100;
const fArc=circ*fPct/100;
const cArc=circ*cPct/100;
document.getElementById('donutChart').innerHTML=`
<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e0e0e0" stroke-width="20"/>
<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#ef4444" stroke-width="20" stroke-dasharray="${pArc} ${circ}" stroke-dashoffset="0" transform="rotate(-90 ${cx} ${cy})"/>
<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eab308" stroke-width="20" stroke-dasharray="${fArc} ${circ}" stroke-dashoffset="${-pArc}" transform="rotate(-90 ${cx} ${cy})"/>
<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#3b82f6" stroke-width="20" stroke-dasharray="${cArc} ${circ}" stroke-dashoffset="${-pArc-fArc}" transform="rotate(-90 ${cx} ${cy})"/>
<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="14" fill="var(--text)" font-weight="700">${tdee}</text>
<text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="var(--text-secondary)">千卡</text>
`;
document.getElementById('macroGrid').innerHTML=`
<div class="macro-item"><div class="color" style="background:#ef4444"></div><div class="name">蛋白质</div><div class="val">${pGram}g</div><div class="pct">${pCal}千卡 · ${pPct}%</div></div>
<div class="macro-item"><div class="color" style="background:#eab308"></div><div class="name">脂肪</div><div class="val">${fGram}g</div><div class="pct">${fCal}千卡 · ${fPct}%</div></div>
<div class="macro-item"><div class="color" style="background:#3b82f6"></div><div class="name">碳水</div><div class="val">${cGram}g</div><div class="pct">${cCal}千卡 · ${cPct}%</div></div>
`;
const meals=[
{emoji:'🌅',name:'早餐',cal:Math.round(tdee*0.3),pct:30},
{emoji:'☀️',name:'午餐',cal:Math.round(tdee*0.4),pct:40},
{emoji:'🌙',name:'晚餐',cal:Math.round(tdee*0.25),pct:25},
{emoji:'🍎',name:'加餐',cal:Math.round(tdee*0.05),pct:5}
];
document.getElementById('mealGrid').innerHTML=meals.map(m=>
`<div class="meal-item"><div class="emoji">${m.emoji}</div><div class="name">${m.name}</div><div class="val">${m.cal}千卡 (${m.pct}%)</div></div>`
).join('');
document.getElementById('resultCard').style.display='block';
document.getElementById('mealCard').style.display='block';
}
function toggleTheme(){
const html=document.documentElement;
const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
html.setAttribute('data-theme',next);
document.querySelector('.theme-toggle').textContent=next==='dark'?'☀️':'🌙';
}
</script>
</body>
</html>
