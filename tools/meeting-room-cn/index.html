<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏢 会议室预订</title>
<meta name="description" content="会议室预订管理工具，查看可用会议室、预订时段、管理预约记录">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:1100px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.room-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:all .2s}
.room-card:hover{border-color:var(--accent)}
.room-card h3{font-size:1rem;font-weight:600;margin-bottom:6px}
.room-card .info{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.room-card .status{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:600;margin-top:8px}
.status-free{background:rgba(63,185,80,.15);color:var(--green)}
.status-busy{background:rgba(248,81,73,.15);color:var(--red)}
.status-upcoming{background:rgba(210,153,34,.15);color:var(--yellow)}
.timeline{display:flex;gap:2px;margin-top:12px}
.timeline-bar{flex:1;height:24px;border-radius:4px;cursor:pointer;position:relative;transition:all .15s}
.timeline-bar:hover{transform:scaleY(1.2)}
.timeline-bar.empty{background:var(--border)}
.timeline-bar.booked{background:var(--accent);opacity:.7}
.timeline-bar.mine{background:var(--green)}
.slot-labels{display:flex;justify-content:space-between;font-size:.65rem;color:var(--text2);margin-top:2px}
.booking-list{max-height:300px;overflow-y:auto}
.booking-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:.9rem}
.booking-item .bmeta{font-size:.8rem;color:var(--text2)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:600}
.badge-green{background:rgba(63,185,80,.15);color:var(--green)}
.badge-red{background:rgba(248,81,73,.15);color:var(--red)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.hidden{display:none!important}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--text2);background:var(--bg);border:1px solid var(--border);transition:all .2s}
.tab.active{color:var(--accent);border-color:var(--accent);background:rgba(59,130,246,.1)}
@media(max-width:768px){.room-grid{grid-template-columns:1fr}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🏢 会议室预订">
<meta property="og:description" content="会议室预订管理工具，查看可用会议室、预订时段、管理预约记录">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/meeting-room-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='mtroom_data';
let state=JSON.parse(localStorage.getItem(STORE)||'{"rooms":[],"bookings":[]}');
if(!state.rooms.length){
  state.rooms=[
    {id:'r1',name:'大会议室A',capacity:20,floor:'3F',equipment:'投影仪,白板,视频会议'},
    {id:'r2',name:'中会议室B',capacity:10,floor:'3F',equipment:'电视屏,白板'},
    {id:'r3',name:'小会议室C',capacity:6,floor:'2F',equipment:'电视屏'},
    {id:'r4',name:'培训室D',capacity:30,floor:'5F',equipment:'投影仪,音响,麦克风'},
    {id:'r5',name:'洽谈室E',capacity:4,floor:'1F',equipment:'电话会议'}
  ];
  state.bookings=[
    {id:'b1',roomId:'r1',title:'产品评审会',date:new Date().toISOString().slice(0,10),start:9,end:11,owner:'张三',attendees:'李四,王五'},
    {id:'b2',roomId:'r2',title:'技术分享',date:new Date().toISOString().slice(0,10),start:14,end:15,owner:'李四',attendees:'团队全员'},
    {id:'b3',roomId:'r1',title:'季度总结',date:new Date().toISOString().slice(0,10),start:13,end:14,owner:'王五',attendees:'各部门负责人'}
  ];
}
let currentTab='rooms',selectedDate=new Date().toISOString().slice(0,10),showModal=false,editingBooking=null;
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function genId(){return 'id'+Date.now()+Math.random().toString(36).slice(2,6)}

function getBookingStatus(roomId,hour){
  const b=state.bookings.find(b=>b.roomId===roomId&&b.date===selectedDate&&hour>=b.start&&hour<b.end);
  if(!b)return'empty';
  return'booked';
}
function isMyBooking(b){return b.owner==='我'}
function getRoomBookings(roomId){return state.bookings.filter(b=>b.roomId===roomId&&b.date===selectedDate).sort((a,b)=>a.start-b.start)}
function isRoomFree(roomId){
  const now=new Date();
  const today=now.toISOString().slice(0,10);
  const h=now.getHours();
  return!state.bookings.some(b=>b.roomId===roomId&&b.date===today&&h>=b.start&&h<b.end);
}

function render(){
  let h=`<div class="hdr"><h1>🏢 会议室预订</h1><p>管理会议室预约，查看时段占用</p></div>`;
  h+=`<div class="tabs"><div class="tab ${currentTab==='rooms'?'active':''}" onclick="currentTab='rooms';render()">📋 会议室</div><div class="tab ${currentTab==='my'?'active':''}" onclick="currentTab='my';render()">👤 我的预约</div><div class="tab ${currentTab==='timeline'?'active':''}" onclick="currentTab='timeline';render()">📊 今日时间线</div></div>`;

  h+=`<div class="cd"><div class="flex-between"><label style="margin:0">📅 选择日期</label><span style="font-size:.85rem;color:var(--text2)">${state.bookings.filter(b=>b.date===selectedDate).length} 条预约</span></div><input type="date" value="${selectedDate}" onchange="selectedDate=this.value;render()" style="max-width:240px"></div>`;

  if(currentTab==='rooms'){
    h+=`<div class="room-grid">`;
    state.rooms.forEach(r=>{
      const bookings=getRoomBookings(r.id);
      const free=isRoomFree(r.id);
      h+=`<div class="room-card"><h3>${r.name}</h3><div class="info">📍 ${r.floor} · 👥 ${r.capacity}人 · 🎛️ ${r.equipment}</div>`;
      h+=`<span class="status ${free?'status-free':'status-busy'}">${free?'🟢 空闲':'🔴 使用中'}</span>`;
      h+=`<div class="timeline">`;
      for(let i=8;i<20;i++){
        const s=getBookingStatus(r.id,i);
        h+=`<div class="timeline-bar ${s}" title="${i}:00-${s==='booked'?'占用':'空闲'}" onclick="quickBook('${r.id}',${i})"></div>`;
      }
      h+=`</div><div class="slot-labels"><span>8:00</span><span>12:00</span><span>16:00</span><span>20:00</span></div>`;
      if(bookings.length){
        h+=`<div style="margin-top:10px">`;
        bookings.forEach(b=>{
          h+=`<div style="font-size:.8rem;padding:4px 8px;background:var(--card);border-radius:6px;margin-top:4px;border:1px solid var(--border)">📌 ${b.start}:00-${b.end}:00 ${b.title} <span style="color:var(--text2)">(${b.owner})</span> <button class="dng" style="padding:2px 6px;font-size:.7rem;margin-left:4px" onclick="cancelBooking('${b.id}')">取消</button></div>`;
        });
        h+=`</div>`;
      }
      h+=`<div style="margin-top:10px"><button onclick="openModal('${r.id}')" style="width:100%">+ 预订会议室</button></div></div>`;
    });
    h+=`</div>`;
  } else if(currentTab==='my'){
    const myBookings=state.bookings.filter(b=>b.owner==='我').sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
    h+=`<div class="cd"><h2>👤 我的预约</h2>`;
    if(!myBookings.length){h+=`<p style="color:var(--text2);text-align:center;padding:20px">暂无预约记录</p>`}
    else{
      h+=`<div class="booking-list">`;
      myBookings.forEach(b=>{
        const room=state.rooms.find(r=>r.id===b.roomId);
        const isPast=b.date<new Date().toISOString().slice(0,10);
        h+=`<div class="booking-item" style="${isPast?'opacity:.5':''}"><div><strong>${b.title}</strong><div class="bmeta">🏢 ${room?room.name:'未知'} · 📅 ${b.date} ⏰ ${b.start}:00-${b.end}:00</div><div class="bmeta">👥 ${b.attendees||'无'}</div></div><div><span class="badge ${isPast?'badge-red':'badge-green'}">${isPast?'已结束':'即将到来'}</span><button class="dng" style="padding:4px 10px;font-size:.8rem;margin-left:6px" onclick="cancelBooking('${b.id}')">取消</button></div></div>`;
      });
      h+=`</div>`;
    }
    h+=`</div>`;
  } else if(currentTab==='timeline'){
    h+=`<div class="cd"><h2>📊 今日时间线</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;min-width:600px">`;
    h+=`<tr><th style="text-align:left;padding:8px;border-bottom:2px solid var(--border)">会议室</th>`;
    for(let i=8;i<20;i++)h+=`<th style="padding:4px;border-bottom:2px solid var(--border);font-size:.75rem;min-width:50px">${i}:00</th>`;
    h+=`</tr>`;
    state.rooms.forEach(r=>{
      h+=`<tr><td style="padding:8px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600">${r.name}</td>`;
      for(let i=8;i<20;i++){
        const b=state.bookings.find(b=>b.roomId===r.id&&b.date===selectedDate&&i>=b.start&&i<b.end);
        if(b){
          h+=`<td style="padding:4px;border-bottom:1px solid var(--border);background:rgba(59,130,246,.15);text-align:center;cursor:pointer" title="${b.title} (${b.owner})" onclick="quickBook('${r.id}',${i})"><span style="font-size:.7rem;color:var(--accent)">●</span></td>`;
        } else {
          h+=`<td style="padding:4px;border-bottom:1px solid var(--border);text-align:center;cursor:pointer" onclick="quickBook('${r.id}',${i})"></td>`;
        }
      }
      h+=`</tr>`;
    });
    h+=`</table></div><div style="margin-top:10px;display:flex;gap:16px;font-size:.8rem;color:var(--text2)"><span>⬜ 空闲</span><span style="color:var(--accent)">● 已预订</span></div></div>`;
  }

  if(showModal)h+=renderModal();
  $('app').innerHTML=h;
}

function renderModal(){
  const room=state.rooms.find(r=>r.id===editingBooking?.roomId)||state.rooms[0];
  const isEdit=!!editingBooking?.id;
  let h=`<div class="modal-overlay" onclick="showModal=false;editingBooking=null;render()"><div class="modal" onclick="event.stopPropagation()">`;
  h+=`<h2 style="margin-bottom:16px">${isEdit?'✏️ 编辑预约':'📅 预订会议室'}</h2>`;
  h+=`<label>会议室</label><select id="mRoom">${state.rooms.map(r=>`<option value="${r.id}" ${r.id===room.id?'selected':''}>${r.name} (${r.floor}, ${r.capacity}人)</option>`).join('')}</select>`;
  h+=`<label>会议主题</label><input id="mTitle" value="${editingBooking?.title||''}" placeholder="例：产品评审会">`;
  h+=`<label>日期</label><input type="date" id="mDate" value="${editingBooking?.date||selectedDate}">`;
  h+=`<div style="display:flex;gap:10px"><div style="flex:1"><label>开始时间</label><select id="mStart">${[...Array(24)].map((_,i)=>`<option value="${i}" ${editingBooking?.start===i?'selected':''}>${String(i).padStart(2,'0')}:00</option>`).join('')}</select></div><div style="flex:1"><label>结束时间</label><select id="mEnd">${[...Array(24)].map((_,i)=>`<option value="${i}" ${editingBooking?.end===i?'selected':''}>${String(i).padStart(2,'0')}:00</option>`).join('')}</select></div></div>`;
  h+=`<label>参会人</label><input id="mAttendees" value="${editingBooking?.attendees||''}" placeholder="姓名用逗号分隔">`;
  h+=`<div class="flex" style="margin-top:16px;justify-content:flex-end"><button class="sec" onclick="showModal=false;editingBooking=null;render()">取消</button><button onclick="saveBooking()">${isEdit?'保存修改':'确认预订'}</button></div>`;
  h+=`</div></div>`;
  return h;
}

function openModal(roomId){
  editingBooking={roomId,start:9,end:10};
  showModal=true;
  render();
  setTimeout(()=>{const s=$('mStart');if(s)s.onchange=()=>{const v=parseInt(s.value);const e=$('mEnd');if(e&&parseInt(e.value)<=v)e.value=v+1;}},50);
}
function saveBooking(){
  const roomId=$('mRoom').value;
  const title=$('mTitle').value.trim();
  const date=$('mDate').value;
  const start=parseInt($('mStart').value);
  const end=parseInt($('mEnd').value);
  const attendees=$('mAttendees').value.trim();
  if(!title){alert('请输入会议主题');return}
  if(end<=start){alert('结束时间必须晚于开始时间');return}
  const conflict=state.bookings.find(b=>b.roomId===roomId&&b.date===date&&b.id!==editingBooking?.id&&start<b.end&&end>b.start);
  if(conflict){alert('该时段已被预订：'+conflict.title);return}
  if(editingBooking?.id){
    const idx=state.bookings.findIndex(b=>b.id===editingBooking.id);
    if(idx>=0)state.bookings[idx]={...state.bookings[idx],roomId,title,date,start,end,attendees};
  } else {
    state.bookings.push({id:genId(),roomId,title,date,start,end,owner:'我',attendees});
  }
  save();showModal=false;editingBooking=null;render();
}
function cancelBooking(id){
  if(!confirm('确定取消此预约？'))return;
  state.bookings=state.bookings.filter(b=>b.id!==id);
  save();render();
}
function quickBook(roomId,hour){
  editingBooking={roomId,date:selectedDate,start:hour,end:hour+1};
  showModal=true;render();
}
render();
</script>
</body>
</html>
