<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🙏 感恩日记专业版</title>
<meta property="og:title" content="🙏 感恩日记专业版">
<meta property="og:description" content="🙏 感恩日记专业版 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="感恩日记工具，每天记录3件感恩的事，培养积极心态">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px}
.ctn{max-width:700px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.li{padding:14px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text)}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}
.empty{text-align:center;padding:40px;color:var(--text2)}
.entry-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .2s}.entry-card:hover{border-color:var(--accent)}
.entry-card .date{font-size:.8rem;color:var(--text2)}.entry-card .items{margin-top:6px;font-size:.9rem;line-height:1.6}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}.stat-card .num{font-size:1.6rem;font-weight:700;color:var(--accent)}.stat-card .lbl{font-size:.75rem;color:var(--text2);margin-top:4px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.cal-day{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.7rem;cursor:pointer}.cal-day.has{background:var(--success);color:var(--text)}.cal-day.today{border:2px solid var(--warn)}.cal-day.empty{background:var(--bg)}
.prompt-card{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(139,92,246,.1));border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;text-align:center;font-style:italic;color:var(--text2)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🙏</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🙏 感恩日记专业版</h1><p>每天记录3件感恩的事</p></div>

<div class="prompt-card" id="prompt">💡 感恩提示：今天有什么小事让你感到温暖？</div>

<div class="cd"><h2>📅 今日感恩</h2>
<div id="todayItems"></div>
<label>添加感恩的事</label><input type="text" id="newItem" placeholder="如：感谢家人的陪伴">
<label>类别</label><select id="itemCat"><option>人</option><option>事</option><option>物</option><option>自然</option><option>自己</option><option>其他</option></select>
<label>详细描述（可选）</label><textarea id="itemDetail" rows="2" placeholder="为什么感恩这件事？"></textarea>
<div class="bg"><button onclick="addItem()">添加</button></div>
<div class="bg" style="justify-content:center;margin-top:8px"><button onclick="saveToday()" style="padding:12px 32px">💾 保存今日感恩</button></div></div>

<div class="cd"><h2>📊 感恩统计</h2>
<div class="stats-grid" id="stats"></div>
<div style="margin-top:16px"><h3 style="font-size:.95rem;margin-bottom:8px">感恩类别分布</h3><div id="catDist"></div></div>
<div style="margin-top:16px"><h3 style="font-size:.95rem;margin-bottom:8px">本月概览</h3><div class="calendar" id="calendar"></div></div>
</div>

<div class="cd"><h2>📖 感恩故事</h2><div id="storyList" class="empty">暂无故事</div></div>
<div class="cd"><h2>📋 历史记录</h2><div id="historyList" class="empty">暂无记录</div></div>
</div>

<div style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;justify-content:center;align-items:center" id="viewModal">
<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto" id="viewContent"></div>
</div>

<script>
const $=id=>document.getElementById(id);
let entries=JSON.parse(localStorage.getItem('gjp_entries')||'[]');
const today=()=>new Date().toISOString().slice(0,10);
const save=()=>localStorage.setItem('gjp_entries',JSON.stringify(entries));
let tempItems=[];

const prompts=['今天有什么小事让你感到温暖？','谁今天帮助了你？','你今天学到了什么？','什么让你今天笑了？','你感谢自己的什么品质？','今天有什么美食让你开心？','你感谢身边谁的陪伴？','今天的天气让你感觉如何？','你有什么值得庆祝的小事？','什么让你对未来充满希望？'];

function init(){
  $('prompt').textContent='💡 '+prompts[Math.floor(Math.random()*prompts.length)];
  loadToday();renderStats();renderHistory();renderCalendar();renderStory();
}

function loadToday(){
  const e=entries.find(e=>e.date===today());
  tempItems=e?JSON.parse(JSON.stringify(e.items)):[];
  renderTempItems();
}

function renderTempItems(){
  if(!tempItems.length){$('todayItems').innerHTML='<div class="empty" style="padding:16px">今天还没有记录感恩的事</div>';return}
  let html='';tempItems.forEach((item,i)=>{
    html+=`<div class="li" style="display:flex;justify-content:space-between;align-items:center">
      <div><strong>${i+1}.</strong> ${item.text} <span class="tag">${item.cat}</span>
      ${item.detail?`<div style="font-size:.8rem;color:var(--text2);margin-top:4px">${item.detail}</div>`:''}</div>
      <button class="dng" onclick="removeItem(${i})" style="padding:4px 8px;font-size:.8rem">✕</button></div>`;
  });$('todayItems').innerHTML=html;
}

function addItem(){
  const text=$('newItem').value.trim();if(!text){alert('请输入感恩的事');return}
  tempItems.push({text,cat:$('itemCat').value,detail:$('itemDetail').value});
  $('newItem').value='';$('itemDetail').value='';renderTempItems();
}

function removeItem(i){tempItems.splice(i,1);renderTempItems()}

function saveToday(){
  if(!tempItems.length){alert('请至少添加一件感恩的事');return}
  const data={date:today(),items:JSON.parse(JSON.stringify(tempItems)),savedAt:new Date().toISOString()};
  const idx=entries.findIndex(e=>e.date===today());
  if(idx>=0)entries[idx]=data;else entries.push(data);
  save();renderStats();renderHistory();renderCalendar();renderStory();alert('保存成功！');
}

function renderStats(){
  const total=entries.length;const totalItems=entries.reduce((s,e)=>s+e.items.length,0);
  const streak=getStreak();const avgItems=total?Math.round(totalItems/total*10)/10:0;
  $('stats').innerHTML=`
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">总天数</div></div>
    <div class="stat-card"><div class="num">${totalItems}</div><div class="lbl">感恩总数</div></div>
    <div class="stat-card"><div class="num">${streak}</div><div class="lbl">连续天数</div></div>
    <div class="stat-card"><div class="num">${avgItems}</div><div class="lbl">日均条数</div></div>`;

  const cats={};entries.forEach(e=>e.items.forEach(i=>{cats[i.cat]=(cats[i.cat]||0)+1}));
  let catHtml='';Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([c,n])=>{
    const pct=Math.round(n/totalItems*100);catHtml+=`<div style="margin-bottom:6px;display:flex;align-items:center;gap:8px;font-size:.85rem"><span style="width:40px">${c}</span><div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--accent);border-radius:4px"></div></div><span style="width:40px;text-align:right;color:var(--text2)">${pct}%</span></div>`;
  });$('catDist').innerHTML=catHtml||'<div class="empty">暂无数据</div>';
}

function getStreak(){let s=0;const d=new Date();for(let i=0;i<365;i++){const k=d.toISOString().slice(0,10);if(entries.some(e=>e.date===k))s++;else break;d.setDate(d.getDate()-1)}return s}

function renderCalendar(){
  const now=new Date();const y=now.getFullYear(),m=now.getMonth();
  const first=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();
  let html='';for(let i=0;i<first;i++)html+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=days;d++){
    const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=entries.some(e=>e.date===k);const isToday=k===today();
    html+=`<div class="cal-day ${has?'has':''} ${isToday?'today':''}" onclick="viewEntry('${k}')">${d}</div>`;
  }$('calendar').innerHTML=html;
}

function renderHistory(){
  const sorted=[...entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);
  let html='';sorted.forEach(e=>{
    html+=`<div class="entry-card" onclick="viewEntry('${e.date}')">
      <div class="date">${e.date}</div>
      <div class="items">${e.items.map(i=>`${i.text}`).join(' · ')}</div></div>`;
  });$('historyList').innerHTML=html||'<div class="empty">暂无记录</div>';
}

function renderStory(){
  const entriesWithDetail=entries.filter(e=>e.items.some(i=>i.detail));
  let html='';entriesWithDetail.slice(0,5).forEach(e=>{
    const detailed=e.items.filter(i=>i.detail);
    html+=`<div class="entry-card" onclick="viewEntry('${e.date}')">
      <div class="date">${e.date}</div>
      <div class="items">${detailed.map(i=>`"${i.text}" - ${i.detail}`).join('<br>')}</div></div>`;
  });$('storyList').innerHTML=html||'<div class="empty">暂无详细故事</div>';
}

function viewEntry(date){
  const e=entries.find(e=>e.date===date);if(!e){alert('该日无记录');return}
  $('viewContent').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center"><h3>🙏 ${e.date}</h3>
    <button class="sec" onclick="$('viewModal').style.display='none'" style="padding:4px 8px;font-size:.8rem">✕</button></div>
    <div style="margin-top:16px">${e.items.map((item,i)=>`<div style="margin-bottom:12px;padding:12px;background:var(--bg);border-radius:8px">
      <div><strong>${i+1}. ${item.text}</strong> <span class="tag">${item.cat}</span></div>
      ${item.detail?`<div style="font-size:.85rem;color:var(--text2);margin-top:4px">${item.detail}</div>`:''}</div>`).join('')}</div>
    <button class="dng" style="margin-top:16px;width:100%" onclick="deleteEntry('${date}')">删除记录</button>`;
  $('viewModal').style.display='flex';
}

function deleteEntry(date){if(!confirm('确定删除？'))return;entries=entries.filter(e=>e.date!==date);save();$('viewModal').style.display='none';renderStats();renderHistory();renderCalendar();renderStory()}

init();
</script>
</body>
</html>
