<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行常用语手册</title>
<meta name="description" content="出国旅行必备常用语，支持中英日韩泰等多语种对照">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#3fb950;--yellow:#d29922;--red:#f85149}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;padding:16px}
.header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.header h1{font-size:20px;white-space:nowrap}
.header h1 span{font-size:24px}
.lang-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.lang-btn{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;transition:all .15s;display:flex;align-items:center;gap:4px}
.lang-btn:hover,.lang-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;gap:8px;align-items:center}
.search-bar input{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px}
.search-bar input:focus{border-color:var(--accent);outline:none}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cat-btn{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:12px;transition:all .15s}
.cat-btn:hover,.cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.phrase-list{display:flex;flex-direction:column;gap:8px}
.phrase-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;transition:border-color .2s;cursor:pointer}
.phrase-card:hover{border-color:var(--accent)}
.phrase-card .cn{font-size:16px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.phrase-card .cn .tag{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg);color:var(--text2)}
.phrase-card .translations{display:flex;flex-direction:column;gap:4px}
.phrase-card .trans-row{display:flex;gap:8px;align-items:baseline}
.phrase-card .lang-flag{font-size:14px;min-width:24px}
.phrase-card .trans-text{font-size:14px;color:var(--text2)}
.phrase-card .trans-text .romaji{font-size:11px;color:var(--text2);opacity:.7;margin-left:4px}
.phrase-card .phonetic{font-size:12px;color:var(--accent);margin-left:32px;margin-top:2px}
.phrase-card .copy-btn{position:absolute;right:12px;top:12px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;opacity:0;transition:opacity .15s}
.phrase-card{position:relative}
.phrase-card:hover .copy-btn{opacity:1}
.copy-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{text-align:center;padding:40px;color:var(--text2)}
.tab-bar{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.tab{padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap;background:var(--bg);border:1px solid var(--border);transition:all .15s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.copied-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.copied-toast.show{opacity:1}
</style>
</head>
<body>
<div class="header">
<h1><span>🗣️</span> 旅行常用语手册</h1>
<div style="margin-left:auto;font-size:12px;color:var(--text2)" id="phraseCount"></div>
</div>
<div class="lang-bar">
<span style="font-size:12px;color:var(--text2);margin-right:4px">显示语言：</span>
<button class="lang-btn active" data-lang="en" onclick="toggleLang(this)">🇬🇧 英语</button>
<button class="lang-btn active" data-lang="ja" onclick="toggleLang(this)">🇯🇵 日语</button>
<button class="lang-btn" data-lang="ko" onclick="toggleLang(this)">🇰🇷 韩语</button>
<button class="lang-btn" data-lang="th" onclick="toggleLang(this)">🇹🇭 泰语</button>
<button class="lang-btn" data-lang="fr" onclick="toggleLang(this)">🇫🇷 法语</button>
<button class="lang-btn" data-lang="de" onclick="toggleLang(this)">🇩🇪 德语</button>
<button class="lang-btn" data-lang="es" onclick="toggleLang(this)">🇪🇸 西语</button>
<button class="lang-btn" data-lang="it" onclick="toggleLang(this)">🇮🇹 意语</button>
</div>
<div class="search-bar">
<span>🔍</span>
<input type="text" id="searchInput" placeholder="搜索中文或外语..." oninput="filterPhrases()">
</div>
<div class="categories" id="categories"></div>
<div class="tab-bar" id="tabBar"></div>
<div class="phrase-list" id="phraseList"></div>
<div class="copied-toast" id="toast">已复制到剪贴板</div>

const categories=[...new Set(phraseData.map(p=>p.cat))];
let activeLangs=new Set(['en','ja']);let activeCat='all';let searchText='';
function initCategories(){
const el=document.getElementById('categories');
el.innerHTML=`<button class="cat-btn active" onclick="setCat('all',this)">全部</button>`+categories.map(c=>`<button class="cat-btn" onclick="setCat('${c}',this)">${c}</button>`).join('');
}
function initTabs(){
const el=document.getElementById('tabBar');
el.innerHTML=['en','ja','ko','th','fr','de','es','it'].map(l=>{
const flags={en:'🇬🇧',ja:'🇯🇵',ko:'🇰🇷',th:'🇹🇭',fr:'🇫🇷',de:'🇩🇪',es:'🇪🇸',it:'🇮🇹'};
return `<div class="tab ${activeLangs.has(l)?'active':''}" onclick="toggleLangTab('${l}',this)">${flags[l]}</div>`;
}).join('');
}
function toggleLang(btn){
const lang=btn.dataset.lang;
if(activeLangs.has(lang)){if(activeLangs.size<=1)return;activeLangs.delete(lang);btn.classList.remove('active');}
else{activeLangs.add(lang);btn.classList.add('active');}
renderPhrases();
}
function toggleLangTab(lang,el){
if(activeLangs.has(lang)){if(activeLangs.size<=1)return;activeLangs.delete(lang);el.classList.remove('active');}
else{activeLangs.add(lang);el.classList.add('active');}
document.querySelectorAll('.lang-btn').forEach(b=>{if(b.dataset.lang===lang){if(activeLangs.has(lang))b.classList.add('active');else b.classList.remove('active');}});
renderPhrases();
}
function setCat(cat,btn){
activeCat=cat;
document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
renderPhrases();
}
function filterPhrases(){searchText=document.getElementById('searchInput').value.toLowerCase();renderPhrases();}
function renderPhrases(){
let filtered=phraseData;
if(activeCat!=='all')filtered=filtered.filter(p=>p.cat===activeCat);
if(searchText)filtered=filtered.filter(p=>p.cn.toLowerCase().includes(searchText)||Object.values(p).some(v=>typeof v==='object'&&v.text&&v.text.toLowerCase().includes(searchText)));
const list=document.getElementById('phraseList');
document.getElementById('phraseCount').textContent=`${filtered.length} 条常用语`;
if(!filtered.length){list.innerHTML='<div class="empty">🔍 未找到匹配的常用语</div>';return;}
list.innerHTML=filtered.map(p=>{
const langRows=[...activeLangs].map(l=>{
const t=p[l];
if(!t)return '';
const flags={en:'🇬🇧',ja:'🇯🇵',ko:'🇰🇷',th:'🇹🇭',fr:'🇫🇷',de:'🇩🇪',es:'🇪🇸',it:'🇮🇹'};
return `<div class="trans-row"><span class="lang-flag">${flags[l]}</span><span class="trans-text">${t.text}</span></div>${t.phonetic?`<div class="phonetic">${t.phonetic}</div>`:''}`;
}).join('');
return `<div class="phrase-card" onclick="copyText('${p.cn.replace(/'/g,"\\'")}')">
<button class="copy-btn" onclick="event.stopPropagation();copyText('${p.cn.replace(/'/g,"\\'")}')">复制</button>
<div class="cn">${p.cn}<span class="tag">${p.cat}</span></div>
<div class="translations">${langRows}</div></div>`;
}).join('');
}
function copyText(text){
navigator.clipboard.writeText(text).then(()=>{
const t=document.getElementById('toast');
t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),1500);
});
}
initCategories();initTabs();renderPhrases();
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('searchInput').focus();}if(e.key==='Escape'){document.getElementById('searchInput').blur();}});
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
