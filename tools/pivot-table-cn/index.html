<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据透视表</title>
<meta name="description" content="数据透视表工具，快速分析和汇总表格数据">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6scroll-behavior:smooth;}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:var(--text);font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px;font-family:monospace}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.table th{color:var(--text2);font-size:.85rem;font-weight:600;background:var(--bg)}
.table tr:hover{background:rgba(59,130,246,.05)}
.table td.num{text-align:right;font-variant-numeric:tabular-nums}
.table tfoot td{font-weight:700;border-top:2px solid var(--accent)}
.hidden{display:none!important}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="数据透视表">
<meta property="og:description" content="数据透视表工具，快速分析和汇总表格数据">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/pivot-table-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📋 数据透视表';
const APP=document.getElementById('app');
let tables=JSON.parse(localStorage.getItem('pt_tables')||'[]');
let curTable=null;

function save(){localStorage.setItem('pt_tables',JSON.stringify(tables))}

function parseCSV(text){
  let lines=text.trim().split('\n').map(l=>l.split(',').map(c=>c.trim()));
  if(lines.length<2) return null;
  return {headers:lines[0],rows:lines.slice(1)};
}

function render(){
  let h=`<h1>📋 数据透视表</h1><p class="subtitle">粘贴CSV数据，按行/列字段分组汇总</p>`;
  if(curTable!==null){
    let t=tables[curTable];
    h+=`<div class="card"><div class="flex-between"><button class="btn btn-sm" onclick="curTable=null;render()">← 返回</button><b>${t.name}</b><div class="flex"><button class="btn btn-sm btn-danger" onclick="delTable(${curTable})">删除</button></div></div></div>`;
    if(!t.parsed){
      h+=`<div class="card"><label>粘贴CSV数据（逗号分隔，首行为表头）</label><textarea id="csvInput" rows="12" placeholder="姓名,部门,金额&#10;张三,销售,5000&#10;李四,技术,8000&#10;王五,销售,6000">${t.raw||''}</textarea><button class="btn btn-success" onclick="parseData(${curTable})">解析数据</button></div>`;
    } else {
      let p=t.parsed;
      h+=`<div class="card"><div class="flex-between" style="margin-bottom:12px"><span style="font-weight:600">数据预览（${p.rows.length} 行）</span><button class="btn btn-sm" onclick="tables[${curTable}].parsed=null;save();render()">重新输入</button></div>`;
      h+=`<div style="overflow-x:auto"><table class="table"><tr>${p.headers.map(hh=>`<th>${hh}</th>`).join('')}</tr>`;
      p.rows.slice(0,5).forEach(r=>{h+=`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`;});
      if(p.rows.length>5) h+=`<tr><td colspan="${p.headers.length}" style="text-align:center;color:var(--text2)">... 共 ${p.rows.length} 行</td></tr>`;
      h+=`</table></div></div>`;
      h+=`<div class="card"><b style="margin-bottom:12px;display:block">透视配置</b>`;
      h+=`<div class="grid" style="grid-template-columns:1fr 1fr"><div><label>行字段（分组依据）</label><select id="rowField">${p.headers.map((hh,i)=>`<option value="${i}" ${t.rowField==i?'selected':''}>${hh}</option>`).join('')}</select></div><div><label>值字段（汇总目标）</label><select id="valField">${p.headers.map((hh,i)=>`<option value="${i}" ${t.valField==i?'selected':''}>${hh}</option>`).join('')}</select></div></div>`;
      h+=`<div class="flex" style="margin-top:8px"><label style="margin:0">汇总方式：</label><select id="aggFn" style="width:auto"><option value="sum" ${t.aggFn==='sum'?'selected':''}>求和</option><option value="avg" ${t.aggFn==='avg'?'selected':''}>平均值</option><option value="count" ${t.aggFn==='count'?'selected':''}>计数</option><option value="max" ${t.aggFn==='max'?'selected':''}>最大值</option><option value="min" ${t.aggFn==='min'?'selected':''}>最小值</option></select></div>`;
      h+=`<button class="btn" style="margin-top:12px" onclick="buildPivot(${curTable})">生成透视表</button></div>`;
      if(t.pivot){
        h+=renderPivot(t.pivot);
      }
    }
  } else {
    h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">透视表列表</span><button class="btn btn-sm" onclick="newTable()">+ 新建</button></div></div>`;
    tables.forEach((t,i)=>{
      let info=t.parsed?`${t.parsed.rows.length} 行`:'未解析';
      h+=`<div class="card"><div class="flex-between"><b>${t.name}</b><div class="flex"><span class="badge badge-blue">${info}</span><button class="btn btn-sm" onclick="openTable(${i})">打开</button><button class="btn btn-sm btn-danger" onclick="delTable(${i})">删除</button></div></div></div>`;
    });
    if(!tables.length) h+=`<div class="empty">暂无数据表，点击上方新建</div>`;
  }
  APP.innerHTML=h;
}

function renderPivot(pivot){
  let h=`<div class="card"><b style="margin-bottom:12px;display:block">透视结果</b><div style="overflow-x:auto"><table class="table"><tr><th>${pivot.rowLabel}</th><th>${pivot.valLabel}（${pivot.fnName}）</th></tr>`;
  let total=0;
  pivot.data.forEach(r=>{
    h+=`<tr><td>${r.group}</td><td class="num">${typeof r.result==='number'?r.result.toLocaleString():r.result}</td></tr>`;
    if(typeof r.result==='number') total+=r.result;
  });
  h+=`<tfoot><tr><td>合计</td><td class="num">${total.toLocaleString()}</td></tr></tfoot>`;
  h+=`</table></div></div>`;
  return h;
}

function parseData(i){
  let raw=document.getElementById('csvInput').value;
  let parsed=parseCSV(raw);
  if(!parsed||!parsed.rows.length){alert('CSV格式不正确，请检查');return;}
  tables[i].raw=raw;
  tables[i].parsed=parsed;
  tables[i].rowField=0;
  tables[i].valField=Math.min(1,parsed.headers.length-1);
  tables[i].aggFn='sum';
  save();render();
}

function buildPivot(i){
  let t=tables[i],p=t.parsed;
  let ri=parseInt(document.getElementById('rowField').value);
  let vi=parseInt(document.getElementById('valField').value);
  let fn=document.getElementById('aggFn').value;
  t.rowField=ri;t.valField=vi;t.aggFn=fn;
  let groups={};
  p.rows.forEach(r=>{
    let key=r[ri]||'(空)';
    let val=parseFloat(r[vi]);
    if(!groups[key]) groups[key]=[];
    if(!isNaN(val)) groups[key].push(val);
  });
  let fnName={sum:'求和',avg:'平均值',count:'计数',max:'最大值',min:'最小值'}[fn];
  let data=Object.entries(groups).map(([g,vals])=>{
    let result;
    switch(fn){
      case 'sum':result=vals.reduce((a,b)=>a+b,0);break;
      case 'avg':result=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;result=Math.round(result*100)/100;break;
      case 'count':result=vals.length;break;
      case 'max':result=vals.length?Math.max(...vals):0;break;
      case 'min':result=vals.length?Math.min(...vals):0;break;
    }
    return {group:g,result};
  });
  data.sort((a,b)=>typeof a.result==='number'&&typeof b.result==='number'?b.result-a.result:0);
  t.pivot={rowLabel:p.headers[ri],valLabel:p.headers[vi],fnName,data};
  save();render();
}

function newTable(){let n=prompt('数据表名称：');if(n){tables.push({name:n,raw:'',parsed:null,rowField:0,valField:1,aggFn:'sum',pivot:null});save();render()}}
function openTable(i){curTable=i;render()}
function delTable(i){if(confirm('删除此数据表？')){tables.splice(i,1);curTable=null;save();render()}}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
