<!DOCTYPE html>
<html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国民间艺术指南</title><meta name="description" content="中国民间艺术指南 - 了解中国各地民间艺术、非遗技艺和民俗文化"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.card h3{margin-bottom:12px;color:var(--blue)}.tab-bar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:8px}.tab{padding:8px 16px;cursor:pointer;border-radius:8px;white-space:nowrap;color:var(--text2);transition:var(--transition);border:1px solid var(--border);font-size:.9rem}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.tab:hover:not(.active){background:var(--bg)}.item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;transition:var(--transition)}.item h4{margin-bottom:6px}.item .meta{color:var(--text2);font-size:.85rem}.item .desc{margin-top:8px;line-height:1.8;color:var(--text2)}.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;margin:2px}.folk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:12px 0}.folk-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:var(--transition)}.folk-item:hover{border-color:var(--blue)}.folk-item .icon{font-size:2rem;margin-bottom:4px}.quiz-option{display:block;padding:10px;margin:6px 0;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:var(--transition)}.quiz-option:hover{border-color:var(--blue)}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}</style><meta property="og:title" content="中国民间艺术指南"><meta property="og:description" content="中国民间艺术指南 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>"></head><body>

<div class="container"><h1>🎭 中国民间艺术指南</h1><p class="sub">探索中国各地民间艺术、非遗技艺和民俗文化</p>

<script>
var data={
overview:{title:'中国民间艺术总览',content:'<p>中国民间艺术是劳动人民在长期生产生活实践中创造的艺术形式，承载着丰富的文化内涵和民族精神。</p><div class="folk-grid"><div class="folk-item"><div class="icon">🎭</div><div>戏曲</div></div><div class="folk-item"><div class="icon">🪘</div><div>皮影</div></div><div class="folk-item"><div class="icon">🎨</div><div>年画</div></div><div class="folk-item"><div class="icon">✂️</div><div>剪纸</div></div><div class="folk-item"><div class="icon">🪭</div><div>刺绣</div></div><div class="folk-item"><div class="icon">🏺</div><div>陶瓷</div></div><div class="folk-item"><div class="icon">🏮</div><div>灯笼</div></div><div class="folk-item"><div class="icon">🪁</div><div>风筝</div></div></div><h4 style="margin-top:16px">民间艺术的特点</h4><div class="item" style="cursor:default;margin-top:8px"><div class="desc">• <strong>地域性</strong>：不同地区有独特的艺术风格<br>• <strong>传承性</strong>：师徒传承，口传心授<br>• <strong>实用性</strong>：艺术与生活紧密结合<br>• <strong>象征性</strong>：图案蕴含吉祥寓意<br>• <strong>集体性</strong>：集体智慧的结晶</div></div>'},
performing:{title:'表演艺术',items:[
{name:'京剧',type:'戏曲',desc:'中国国粹，融合唱念做打。以西皮、二黄为主要腔调。角色分为生旦净丑四大行当。梅兰芳是京剧艺术的杰出代表。',tags:['国粹','四大行当']},
{name:'皮影戏',type:'民间戏剧',desc:'用兽皮或纸板制作人物剪影，在灯光照射下表演。有"一口说尽千古事，双手对舞百万兵"之美誉。唐山皮影、陕西皮影最为著名。',tags:['光影','口传']},
{name:'木偶戏',type:'民间戏剧',desc:'用木偶表演的戏剧形式。有提线木偶、布袋木偶、杖头木偶等。福建泉州提线木偶最为精湛。',tags:['木偶','提线']},
{name:'相声',type:'曲艺',desc:'中国传统说唱艺术，以说学逗唱为基本功。起源于北京，天津是相声的重要发源地。',tags:['说唱','北京']},
{name:'评书',type:'曲艺',desc:'一人演说的曲艺形式，以口头讲述为主。有"一人一桌一醒木"的传统表演形式。',tags:['口头','醒木']},
{name:'二人转',type:'曲艺',desc:'东北地区传统曲艺，以唱为主，说唱结合。表演风格幽默活泼，有"宁舍一顿饭，不舍二人转"之说。',tags:['东北','幽默']}
]},
crafts:{title:'手工艺品',items:[
{name:'泥塑',desc:'用泥土捏制的民间艺术品。天津泥人张、无锡惠山泥人最为著名。造型生动，色彩鲜明。',tags:['泥人张','惠山']},
{name:'面塑',desc:'用面粉捏制的艺术品，又称"捏面人"。色彩鲜艳，造型生动。常以戏曲人物和吉祥图案为题材。',tags:['面人','色彩']},
{name:'竹编',desc:'用竹篾编织的工艺品。四川竹编、浙江竹编技艺精湛。有竹编画、竹编器皿等品种。',tags:['竹篾','编织']},
{name:'草编',desc:'用稻草、麦秸等编织的工艺品。山东草编、浙江草编最为著名。有草帽、草鞋、草篮等。',tags:['稻草','实用']},
{name:'木雕',desc:'在木材上雕刻的工艺品。东阳木雕、潮州木雕、黄杨木雕并称"中国三大木雕"。',tags:['东阳','潮州']},
{name:'石雕',desc:'在石材上雕刻的工艺品。青田石雕、寿山石雕、昌化石雕、巴林石雕并称"四大国石"。',tags:['石雕','国石']},
{name:'糖画',desc:'用糖浆在石板上绘制的民间艺术。以铜勺为笔，糖浆为墨，绘制各种图案。是庙会常见的民间艺术。',tags:['糖浆','庙会']},
{name:'风筝制作',desc:'传统风筝制作融合了绑扎、糊制、绘画等多种技艺。潍坊风筝以"扎糊绘放"四艺著称。',tags:['绑扎','潍坊']}
]},
music:{title:'民间音乐',items:[
{name:'唢呐',desc:'中国传统双簧木管乐器，声音高亢嘹亮。用于婚丧嫁娶等民俗活动。《百鸟朝凤》是唢呐名曲。',tags:['双簧','百鸟朝凤']},
{name:'二胡',desc:'中国传统拉弦乐器，音色柔美。《二泉映月》《赛马》是二胡名曲。阿炳是著名的民间二胡演奏家。',tags:['拉弦','二泉映月']},
{name:'古筝',desc:'中国传统弹拨乐器，音色清越。有"东方钢琴"之称。《高山流水》《渔舟唱晚》是古筝名曲。',tags:['弹拨','高山流水']},
{name:'琵琶',desc:'中国传统弹拨乐器，有"民乐之王"之称。白居易《琵琶行》描写了琵琶的精湛技艺。',tags:['弹拨','民乐之王']},
{name:'笛子',desc:'中国传统吹管乐器，以竹笛最为常见。《牧民新歌》《姑苏行》是笛子名曲。',tags:['竹笛','吹管']},
{name:'锣鼓',desc:'中国传统打击乐器，用于节日庆典和戏曲伴奏。威风锣鼓、安塞腰鼓最为著名。',tags:['打击','威风锣鼓']}
]},
festivals:{title:'节日民俗',items:[
{name:'春节',desc:'贴春联、放鞭炮、拜年、吃年夜饭、发红包。舞龙舞狮是最具代表性的春节民俗活动。',tags:['舞龙舞狮','年夜饭']},
{name:'元宵节',desc:'吃元宵/汤圆、赏花灯、猜灯谜、舞龙灯。花灯是元宵节最具特色的民俗。',tags:['花灯','猜谜']},
{name:'清明节',desc:'扫墓祭祖、踏青、插柳、放风筝。是纪念祖先的传统节日。',tags:['扫墓','踏青']},
{name:'端午节',desc:'吃粽子、赛龙舟、挂艾草、佩香囊。纪念屈原的传统节日。',tags:['赛龙舟','粽子']},
{name:'中秋节',desc:'赏月、吃月饼、猜灯谜。象征团圆的传统节日。嫦娥奔月是最著名的中秋传说。',tags:['赏月','月饼']},
{name:'重阳节',desc:'登高望远、赏菊花、佩茱萸、吃重阳糕。又称"老人节"，有敬老爱老的寓意。',tags:['登高','敬老']},
{name:'七夕节',desc:'中国传统情人节，源于牛郎织女传说。女子乞巧，祈求心灵手巧。',tags:['乞巧','牛郎织女']}
]},
quiz:{title:'中国民间艺术知识测验',questions:[
{q:'中国国粹是指以下哪种艺术？',options:['皮影戏','京剧','相声','评书'],answer:1,explain:'京剧被称为中国国粹，融合唱念做打，是中国最具代表性的戏曲剧种。'},
{q:'"泥人张"是哪个地方的泥塑艺术？',options:['无锡','天津','山东','陕西'],answer:1,explain:'泥人张是天津著名的泥塑艺术，以张明山创始，至今已传承六代。'},
{q:'被称为"民乐之王"的是？',options:['二胡','古筝','琵琶','笛子'],answer:2,explain:'琵琶被称为"民乐之王"，其演奏技法丰富，表现力强。'},
{q:'以下哪个不是春节的传统民俗？',options:['舞龙舞狮','吃元宵','贴春联','发红包'],answer:1,explain:'吃元宵是元宵节的习俗，不是春节的习俗。春节的习俗包括舞龙舞狮、贴春联、发红包等。'},
{q:'"百鸟朝凤"是哪种乐器的名曲？',options:['二胡','古筝','唢呐','笛子'],answer:2,explain:'《百鸟朝凤》是唢呐名曲，以模拟百鸟鸣叫著称，表现力极强。'}]}
};
function switchTab(name,el){
document.querySelectorAll('.tab-bar .tab').forEach(function(t){t.classList.remove('active')});
el.classList.add('active');
renderContent(name);
}
function renderContent(name){
var d=data[name];
var html='<div class="card"><h3>'+d.title+'</h3>';
if(d.content) html+=d.content;
if(d.items){
d.items.forEach(function(item){
html+='<div class="item"><h4>'+item.name+'</h4>';
if(item.type) html+='<div class="meta">'+item.type+'</div>';
html+='<div class="desc">'+item.desc+'</div>';
if(item.tags) html+='<div style="margin-top:8px">'+item.tags.map(function(t){return '<span class="tag" style="background:rgba(59,130,246,.15);color:var(--blue)">'+t+'</span>'}).join('')+'</div>';
html+='</div>';
});
}
if(d.questions){
d.questions.forEach(function(q,i){
html+='<div class="item" style="cursor:default" id="q'+i+'"><h4>'+q.q+'</h4>';
q.options.forEach(function(opt,j){
html+='<div class="quiz-option" onclick="checkAnswer('+i+','+j+','+q.answer+',this)">'+String.fromCharCode(65+j)+'. '+opt+'</div>';
});
html+='<div class="explain" style="display:none;margin-top:8px;padding:8px;background:rgba(59,130,246,.1);border-radius:8px;font-size:.85rem">'+q.explain+'</div></div>';
});
}
html+='</div>';
document.getElementById('content').innerHTML=html;
}
function checkAnswer(qi,oi,correct,el){
var q=document.getElementById('q'+qi);
var opts=q.querySelectorAll('.quiz-option');
opts.forEach(function(o,i){
if(i===correct) o.style.borderColor='var(--green)';
else if(i===oi) o.style.borderColor='var(--red)';
});
q.querySelector('.explain').style.display='block';
}
renderContent('overview');
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
