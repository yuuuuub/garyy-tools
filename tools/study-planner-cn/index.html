<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 中文学习计划器</title>
<meta property="og:title" content="📅 中文学习计划器">
<meta property="og:description" content="📅 中文学习计划器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="学习计划制定工具，支持周计划、番茄钟、进度追踪、学习统计">
<meta name="robots" content="index, follow">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
button.grn{background:var(--green)}
button.ylw{background:var(--yellow);color:#000}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
label{display:block;font-size:.85rem;color:var(--text2);margin:8px 0 4px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hidden{display:none}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center;margin:16px 0}
.stat-box{padding:14px;background:var(--bg);border-radius:8px}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.progress-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.table{width:100%;border-collapse:collapse;margin-top:8px}
.table th,.table td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:.9rem}
.table th{color:var(--text2);font-weight:600}
.table tr:hover{background:rgba(59,130,246,.05)}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}
.week-day{padding:8px 4px;text-align:center;border-radius:8px;border:1px solid var(--border);font-size:.8rem;cursor:pointer;transition:all .15s}
.week-day:hover{border-color:var(--accent)}
.week-day.has-task{background:rgba(59,130,246,.15);border-color:var(--accent)}
.week-day.today{border-color:var(--green);box-shadow:0 0 0 2px rgba(63,185,80,.3)}
.pomodoro-display{text-align:center;padding:40px}
.pomodoro-time{font-size:4rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.pomodoro-label{font-size:1rem;color:var(--text2);margin:8px 0 20px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1 style="position:fixed;top:6px;left:80px;z-index:999;font-size:1rem;pointer-events:none">📅 中文学习计划器</h1>

<div class="ctn" style="padding-top:50px">
<div class="bg" style="justify-content:center;margin-bottom:20px">
<button onclick="showView('plan')" id="btn-plan">📋 计划</button>
<button onclick="showView('schedule')" id="btn-schedule">🗓️ 周计划</button>
<button onclick="showView('pomodoro')" id="btn-pomodoro">🍅 番茄钟</button>
<button onclick="showView('stats')" id="btn-stats">📊 统计</button>
</div>

<div id="view-plan">
<div class="bg"><button onclick="createSubject()">+ 新建科目</button><button class="sec" onclick="loadDemo()">📖 示例</button></div>
<div id="subject-list"></div>
<div id="task-list-area" class="hidden"><div class="cd"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="task-list-title"></h2><button onclick="addTask()">+ 添加任务</button></div><div id="task-items"></div></div></div>
</div>

<div id="view-schedule" class="hidden"><div class="cd"><h2 style="margin-bottom:12px">🗓️ 本周学习计划</h2><div class="week-grid" id="week-grid"></div><div id="schedule-tasks" style="margin-top:16px"></div><div class="bg" style="margin-top:12px"><button onclick="addScheduleTask()">+ 添加计划任务</button></div></div></div>

<div id="view-pomodoro" class="hidden"><div class="cd"><div class="pomodoro-display"><div id="pom-label" class="pomodoro-label">专注学习</div><div id="pom-time" class="pomodoro-time">25:00</div><div id="pom-round" style="color:var(--text2);margin-bottom:20px">第 1 轮 / 4 轮</div><div class="bg" style="justify-content:center"><button id="pom-start" onclick="togglePomodoro()">▶ 开始</button><button class="sec" onclick="resetPomodoro()">↺ 重置</button><button class="sec" onclick="skipPomodoro()">⏭ 跳过</button></div><div style="margin-top:20px"><label>专注时长（分钟）</label><input type="number" id="pom-focus" value="25" min="1" max="60" style="max-width:100px"></div><div><label>休息时长（分钟）</label><input type="number" id="pom-break" value="5" min="1" max="30" style="max-width:100px"></div></div></div></div>

<div id="view-stats" class="hidden"><div id="stats-content"></div></div>
</div>

<div class="modal-overlay hidden" id="subject-modal"><div class="modal"><h2>新建科目</h2><label>科目名称</label><input type="text" id="subj-name" placeholder="如：数学"><label>优先级</label><select id="subj-priority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select><label>每日目标（分钟）</label><input type="number" id="subj-daily" value="30" min="5"><div class="bg"><button onclick="saveSubject()">保存</button><button class="sec" onclick="closeModal('subject-modal')">取消</button></div></div></div>
<div class="modal-overlay hidden" id="task-modal"><div class="modal"><h2>添加任务</h2><label>任务名称</label><input type="text" id="task-name" placeholder="如：完成第三章习题"><label>截止日期</label><input type="date" id="task-due"><div class="bg"><button onclick="saveTask()">保存</button><button class="sec" onclick="closeModal('task-modal')">取消</button></div></div></div>
<div class="modal-overlay hidden" id="sched-modal"><div class="modal"><h2>添加计划任务</h2><label>科目</label><select id="sched-subj"></select><label>日期</label><input type="date" id="sched-date"><label>时间</label><input type="time" id="sched-time"><label>时长（分钟）</label><input type="number" id="sched-dur" value="30"><div class="bg"><button onclick="saveSchedule()">保存</button><button class="sec" onclick="closeModal('sched-modal')">取消</button></div></div></div>

<script>
const STORAGE_KEY='study_planner_data';
let data={subjects:[],schedule:[],pomSessions:0,pomTotalMin:0,history:[]};
let currentSubject=null;
let pom={running:false,interval:null,time:25*60,mode:'focus',round:1,totalRounds:4,focusMin:25,breakMin:5};

function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY));if(d)data={...data,...d}}catch(e){}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}

function showView(v){['plan','schedule','pomodoro','stats'].forEach(id=>{document.getElementById('view-'+id).classList.toggle('hidden',id!==v);document.getElementById('btn-'+id)?.classList.toggle('active',id===v)});if(v==='schedule')renderWeek();if(v==='stats')renderStats()}

function createSubject(){document.getElementById('subj-name').value='';document.getElementById('subj-priority').value='medium';document.getElementById('subj-daily').value='30';document.getElementById('subject-modal').classList.remove('hidden')}
function saveSubject(){const name=document.getElementById('subj-name').value.trim();if(!name)return;data.subjects.push({id:Date.now(),name,priority:document.getElementById('subj-priority').value,dailyMin:parseInt(document.getElementById('subj-daily').value)||30,tasks:[]});save();closeModal('subject-modal');renderSubjects()}

function renderSubjects(){
const el=document.getElementById('subject-list');
if(!data.subjects.length){el.innerHTML='<div class="empty" style="text-align:center;padding:40px;color:var(--text2)">暂无科目，点击"+ 新建科目"开始</div>';return}
el.innerHTML=data.subjects.map(s=>{
const done=s.tasks.filter(t=>t.done).length;
const total=s.tasks.length;
const pct=total?Math.floor(done/total*100):0;
const colors={high:'var(--red)',medium:'var(--yellow)',low:'var(--green)'};
const pText={high:'高',medium:'中',low:'低'};
return`<div class="cd"><div style="display:flex;justify-content:space-between;align-items:center"><div><strong style="font-size:1.05rem">${s.name}</strong> <span class="badge" style="background:${colors[s.priority]}33;color:${colors[s.priority]}">${pText[s.priority]}</span><div style="font-size:.8rem;color:var(--text2);margin-top:4px">每日目标 ${s.dailyMin} 分钟 · ${done}/${total} 任务完成</div></div><div class="bg"><button onclick="openSubjectTasks('${s.id}')">任务</button><button class="dng" onclick="deleteSubject('${s.id}')">删除</button></div></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
}).join('');
}

function openSubjectTasks(id){currentSubject=data.subjects.find(s=>s.id==id);if(!currentSubject)return;document.getElementById('task-list-area').classList.remove('hidden');document.getElementById('task-list-title').textContent=currentSubject.name+' - 任务列表';renderTasks()}
function deleteSubject(id){if(!confirm('删除此科目？'))return;data.subjects=data.subjects.filter(s=>s.id!=id);save();renderSubjects();document.getElementById('task-list-area').classList.add('hidden')}
function addTask(){if(!currentSubject)return;document.getElementById('task-name').value='';document.getElementById('task-due').value='';document.getElementById('task-modal').classList.remove('hidden')}
function saveTask(){if(!currentSubject)return;const name=document.getElementById('task-name').value.trim();if(!name)return;currentSubject.tasks.push({id:Date.now(),name,due:document.getElementById('task-due').value,done:false});save();closeModal('task-modal');renderTasks();renderSubjects()}
function renderTasks(){if(!currentSubject)return;const el=document.getElementById('task-items');if(!currentSubject.tasks.length){el.innerHTML='<div style="text-align:center;padding:20px;color:var(--text2)">暂无任务</div>';return}el.innerHTML=currentSubject.tasks.map(t=>`<div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border)"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${currentSubject.id}',${t.id})" style="width:auto"><span style="flex:1;${t.done?'text-decoration:line-through;color:var(--text2)':''}">${t.name}</span><span style="font-size:.8rem;color:var(--text2)">${t.due||''}</span><button class="dng" onclick="removeTask('${currentSubject.id}',${t.id})" style="padding:4px 8px;font-size:.75rem">删除</button></div>`).join('')}
function toggleTask(sid,tid){const s=data.subjects.find(x=>x.id==sid);if(s){const t=s.tasks.find(x=>x.id===tid);if(t){t.done=!t.done;save();renderTasks();renderSubjects()}}}
function removeTask(sid,tid){const s=data.subjects.find(x=>x.id==sid);if(s){s.tasks=s.tasks.filter(x=>x.id!==tid);save();renderTasks();renderSubjects()}}

function renderWeek(){
const grid=document.getElementById('week-grid');
const today=new Date();const dayOfWeek=today.getDay()||7;
const startOfWeek=new Date(today);startOfWeek.setDate(today.getDate()-dayOfWeek+1);
const days=['一','二','三','四','五','六','日'];
grid.innerHTML=days.map((d,i)=>{
const date=new Date(startOfWeek);date.setDate(startOfWeek.getDate()+i);
const dateStr=date.toISOString().split('T')[0];
const tasks=data.schedule.filter(s=>s.date===dateStr);
const isToday=date.toISOString().split('T')[0]===today.toISOString().split('T')[0];
return`<div class="week-day ${tasks.length?'has-task':''} ${isToday?'today':''}" onclick="showDayTasks('${dateStr}')"><div style="font-weight:600">周${d}</div><div style="font-size:.7rem;color:var(--text2)">${date.getMonth()+1}/${date.getDate()}</div><div style="font-size:.65rem;color:var(--accent);margin-top:4px">${tasks.length?tasks.length+'项':''}</div></div>`;
}).join('');
}

function showDayTasks(dateStr){
const el=document.getElementById('schedule-tasks');
const tasks=data.schedule.filter(s=>s.date===dateStr);
const d=new Date(dateStr);
el.innerHTML=`<h3 style="margin-bottom:8px">${d.getMonth()+1}月${d.getDate()}日 计划</h3>${tasks.length?tasks.map((t,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid var(--border)"><span>⏰ ${t.time} - ${t.subject} (${t.duration}分钟)</span><button class="dng" onclick="removeSchedule(${i})" style="padding:4px 8px;font-size:.75rem">删除</button></div>`).join(''):'<div style="color:var(--text2);padding:12px">暂无计划</div>'}`;
}

function addScheduleTask(){
const sel=document.getElementById('sched-subj');
sel.innerHTML=data.subjects.map(s=>`<option value="${s.name}">${s.name}</option>`).join('');
if(!data.subjects.length){alert('请先创建科目');return}
document.getElementById('sched-date').value=new Date().toISOString().split('T')[0];
document.getElementById('sched-time').value='09:00';
document.getElementById('sched-dur').value='30';
document.getElementById('sched-modal').classList.remove('hidden');
}
function saveSchedule(){
data.schedule.push({subject:document.getElementById('sched-subj').value,date:document.getElementById('sched-date').value,time:document.getElementById('sched-time').value,duration:parseInt(document.getElementById('sched-dur').value)||30});
save();closeModal('sched-modal');renderWeek();
}
function removeSchedule(i){data.schedule.splice(i,1);save();renderWeek()}

function togglePomodoro(){
if(pom.running){clearInterval(pom.interval);pom.running=false;document.getElementById('pom-start').textContent='▶ 继续';return}
pom.focusMin=parseInt(document.getElementById('pom-focus').value)||25;
pom.breakMin=parseInt(document.getElementById('pom-break').value)||5;
pom.running=true;document.getElementById('pom-start').textContent='⏸ 暂停';
pom.interval=setInterval(()=>{
pom.time--;
if(pom.time<=0){
clearInterval(pom.interval);
if(pom.mode==='focus'){
data.pomSessions++;data.pomTotalMin+=pom.focusMin;
data.history.push({date:new Date().toISOString(),type:'focus',minutes:pom.focusMin});
save();
if(pom.round>=pom.totalRounds){pom.mode='break';pom.time=pom.breakMin*2;alert('🎉 全部完成！')}
else{pom.mode='break';pom.time=pom.breakMin*2}
}else{
pom.mode='focus';pom.time=pom.focusMin*60;pom.round++;
}
pom.running=false;document.getElementById('pom-start').textContent='▶ 开始';
}
updatePomDisplay();
},1000);
}

function updatePomDisplay(){
const m=Math.floor(pom.time/60);const s=pom.time%60;
document.getElementById('pom-time').textContent=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
document.getElementById('pom-label').textContent=pom.mode==='focus'?'🎯 专注学习':'☕ 休息时间';
document.getElementById('pom-round').textContent=`第 ${pom.round} 轮 / ${pom.totalRounds} 轮`;
document.getElementById('pom-time').style.color=pom.mode==='focus'?'var(--accent)':'var(--green)';
}

function resetPomodoro(){clearInterval(pom.interval);pom.running=false;pom.time=pom.focusMin*60;pom.mode='focus';pom.round=1;document.getElementById('pom-start').textContent='▶ 开始';updatePomDisplay()}
function skipPomodoro(){clearInterval(pom.interval);pom.running=false;if(pom.mode==='focus'){pom.mode='break';pom.time=pom.breakMin*2}else{pom.mode='focus';pom.time=pom.focusMin*60;pom.round++}document.getElementById('pom-start').textContent='▶ 开始';updatePomDisplay()}

function renderStats(){
const el=document.getElementById('stats-content');
const todayStudy=data.history.filter(h=>h.date.split('T')[0]===new Date().toISOString().split('T')[0]);
const weekAgo=new Date();weekAgo.setDate(weekAgo.getDate()-7);
const weekStudy=data.history.filter(h=>new Date(h.date)>=weekAgo);
el.innerHTML=`<div class="cd"><h2 style="margin-bottom:16px">📊 学习统计</h2><div class="stat-grid"><div class="stat-box"><div class="stat-num">${data.subjects.length}</div><div class="stat-label">科目数</div></div><div class="stat-box"><div class="stat-num">${data.pomSessions}</div><div class="stat-label">番茄总数</div></div><div class="stat-box"><div class="stat-num">${data.pomTotalMin}</div><div class="stat-label">专注分钟</div></div><div class="stat-box"><div class="stat-num">${weekStudy.length}</div><div class="stat-label">本周番茄</div></div></div></div>`;
}

function loadDemo(){
data.subjects=[
{id:1,name:'高等数学',priority:'high',dailyMin:45,tasks:[{id:101,name:'微积分基础',due:'',done:false},{id:102,name:'线性代数',due:'',done:false},{id:103,name:'概率论',due:'',done:true}]},
{id:2,name:'英语',priority:'medium',dailyMin:30,tasks:[{id:201,name:'单词背诵',due:'',done:false},{id:202,name:'阅读理解',due:'',done:false}]},
{id:3,name:'物理',priority:'low',dailyMin:30,tasks:[{id:301,name:'力学复习',due:'',done:false}]}
];save();renderSubjects();
}

function closeModal(id){document.getElementById(id).classList.add('hidden')}

load();renderSubjects();updatePomDisplay();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
