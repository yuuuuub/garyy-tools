<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇竞技场</title>
<meta name="description" content="贪吃蛇竞技场，多人在线贪吃蛇对战">
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --accent:#3b82f6; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px; }
h1 { color:var(--accent); margin-bottom:8px; font-size:1.5rem; }
.info { display:flex; gap:20px; margin:10px 0; font-size:1rem; }
.info span { background:var(--card); border:1px solid var(--border); padding:6px 14px; border-radius:8px; }
canvas { border:2px solid var(--accent); border-radius:4px; display:block; margin:10px 0; }
.controls { display:flex; gap:10px; margin:10px 0; flex-wrap:wrap; justify-content:center; }
button { background:var(--accent); color:#fff; border:none; padding:8px 20px; border-radius:6px; cursor:pointer; font-size:1rem; }
button:hover { opacity:0.85; }
.legend { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:8px 0; }
.legend-item { display:flex; align-items:center; gap:4px; font-size:0.85rem; }
.legend-item span { width:16px; height:16px; border-radius:3px; display:inline-block; }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="贪吃蛇竞技场">
  <meta property="og:description" content="贪吃蛇竞技场，多人在线贪吃蛇对战">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/snake-arena/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<h1>🐍 贪吃蛇竞技场</h1>
<div class="info">
<span id="score">得分: 0</span>
<span id="length">长度: 3</span>
<span id="level">关卡: 1</span>
</div>
<div class="legend">
<div class="legend-item"><span style="background:#22c55e"></span>食物</div>
<div class="legend-item"><span style="background:#ef4444"></span>炸弹</div>
<div class="legend-item"><span style="background:#eab308"></span>加速道具</div>
<div class="legend-item"><span style="background:#a855f7"></span>穿墙道具</div>
<div class="legend-item"><span style="background:#06b6d4"></span>护盾道具</div>
<div class="legend-item"><span style="background:#f97316"></span>障碍物</div>
</div>
<canvas id="game" width="400" height="400"></canvas>
<div class="controls">
<button onclick="startGame()">开始游戏</button>
<button onclick="pauseGame()">暂停</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;
let snake, dir, nextDir, food, obstacles, powerups, score, alive, paused, speed, gameLoop, shieldTimer, wallhack;
const POWERUP_TYPES = [
  { type:'speed', color:'#eab308', duration:300, name:'加速' },
  { type:'wall', color:'#a855f7', duration:400, name:'穿墙' },
  { type:'shield', color:'#06b6d4', duration:500, name:'护盾' },
];
function init() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; alive = true; paused = false; speed = 120; shieldTimer = 0; wallhack = false;
  obstacles = []; powerups = [];
  generateObstacles(8);
  spawnFood();
  spawnPowerup();
  updateInfo();
}
function generateObstacles(count) {
  obstacles = [];
  for (let i = 0; i < count; i++) {
    let o;
    do { o = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) }; }
    while (snake.some(s => s.x===o.x && s.y===o.y) || (o.x>=7 && o.x<=13 && o.y>=7 && o.y<=13));
    obstacles.push(o);
  }
}
function spawnFood() {
  do { food = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) }; }
  while (snake.some(s => s.x===food.x && s.y===food.y) || obstacles.some(o => o.x===food.x && o.y===food.y));
}
function spawnPowerup() {
  if (powerups.length >= 3) return;
  const type = POWERUP_TYPES[Math.floor(Math.random()*POWERUP_TYPES.length)];
  let p;
  do { p = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS), ...type, timer:0 }; }
  while (snake.some(s => s.x===p.x && s.y===p.y) || obstacles.some(o => o.x===p.x && o.y===p.y));
  powerups.push(p);
}
function updateInfo() {
  document.getElementById('score').textContent = '得分: ' + score;
  document.getElementById('length').textContent = '长度: ' + snake.length;
  document.getElementById('level').textContent = '关卡: ' + Math.floor(score/50+1);
}
function step() {
  if (!alive || paused) return;
  dir = { ...nextDir };
  let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (wallhack) {
    head.x = (head.x + COLS) % COLS;
    head.y = (head.y + ROWS) % ROWS;
  }
  if (!wallhack && (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS)) {
    if (shieldTimer > 0) { shieldTimer = 0; draw(); return; }
    alive = false; draw(); return garyyToast('游戏结束！得分: ' + score);
  }
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    if (shieldTimer > 0) { shieldTimer = 0; draw(); return; }
    alive = false; draw(); return garyyToast('游戏结束！得分: ' + score);
  }
  if (obstacles.some(o => o.x === head.x && o.y === head.y)) {
    if (shieldTimer > 0) { shieldTimer = 0; obstacles = obstacles.filter(o => !(o.x===head.x && o.y===head.y)); snake.unshift(head); draw(); return; }
    alive = false; draw(); return garyyToast('游戏结束！得分: ' + score);
  }
  snake.unshift(head);
  let ate = false;
  if (head.x === food.x && head.y === food.y) {
    score += 10; ate = true; spawnFood();
    if (score % 50 === 0) { speed = Math.max(40, speed - 10); generateObstacles(8 + Math.floor(score/50)*2); spawnPowerup(); }
    if (Math.random() < 0.3) spawnPowerup();
  }
  const pi = powerups.findIndex(p => p.x === head.x && p.y === head.y);
  if (pi !== -1) {
    const p = powerups[pi];
    if (p.type === 'speed') speed = Math.max(40, speed - 30);
    if (p.type === 'wall') wallhack = true;
    if (p.type === 'shield') shieldTimer = p.duration;
    powerups.splice(pi, 1);
  }
  if (!ate) snake.pop();
  if (shieldTimer > 0) shieldTimer -= speed;
  if (wallhack && Math.random() < 0.01) wallhack = false;
  draw();
  updateInfo();
}
function draw() {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#1a2030';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x*GRID,0); ctx.lineTo(x*GRID,canvas.height); ctx.stroke(); }
  for (let y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0,y*GRID); ctx.lineTo(canvas.width,y*GRID); ctx.stroke(); }
  ctx.fillStyle = '#f97316';
  obstacles.forEach(o => { ctx.fillRect(o.x*GRID+1, o.y*GRID+1, GRID-2, GRID-2); });
  ctx.fillStyle = '#22c55e';
  ctx.beginPath(); ctx.arc(food.x*GRID+GRID/2, food.y*GRID+GRID/2, GRID/2-2, 0, Math.PI*2); ctx.fill();
  powerups.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x*GRID+GRID/2, p.y*GRID+GRID/2, GRID/2-1, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    const labels = { speed:'⚡', wall:'🌀', shield:'🛡' };
    ctx.fillText(labels[p.type], p.x*GRID+GRID/2, p.y*GRID+GRID/2+4);
  });
  snake.forEach((s, i) => {
    ctx.fillStyle = i===0 ? (shieldTimer>0 ? '#06b6d4' : '#22c55e') : (wallhack ? '#a855f7' : '#16a34a');
    ctx.fillRect(s.x*GRID+1, s.y*GRID+1, GRID-2, GRID-2);
    if (i===0) { ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.fillText('●', s.x*GRID+GRID/2, s.y*GRID+GRID/2+4); }
  });
  if (!alive) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('游戏结束', canvas.width/2, canvas.height/2-10);
    ctx.fillStyle = '#e6edf3'; ctx.font = '18px sans-serif';
    ctx.fillText('得分: ' + score, canvas.width/2, canvas.height/2+20);
  }
}
function startGame() { clearInterval(gameLoop); init(); draw(); gameLoop = setInterval(step, speed); }
function pauseGame() { paused = !paused; }
document.addEventListener('keydown', e => {
  const map = { ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0}, w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0} };
  const nd = map[e.key];
  if (nd && (nd.x + dir.x !== 0 || nd.y + dir.y !== 0)) { nextDir = nd; e.preventDefault(); }
});
let tx, ty;
canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  let nd;
  if (Math.abs(dx) > Math.abs(dy)) nd = { x: dx>0?1:-1, y:0 }; else nd = { x:0, y:dy>0?1:-1 };
  if (nd.x + dir.x !== 0 || nd.y + dir.y !== 0) nextDir = nd;
});
init(); draw();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
