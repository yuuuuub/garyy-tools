<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>填字游戏 7×7</title>
<meta name="description" content="7x7填字游戏，中等难度的英语填字挑战">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--block:#21262d}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{font-size:1.5rem;margin-bottom:6px}
.info{color:#8b949e;margin-bottom:16px;font-size:.9rem}
.timer{font-size:1.1rem;color:#8b949e;margin-bottom:12px}
.timer span{color:var(--accent);font-weight:700}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border:2px solid var(--accent);width:fit-content;margin-bottom:20px}
.cell{width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:background .15s;position:relative}
.cell:hover{background:#1c2333}
.cell.selected{background:rgba(59,130,246,.25);outline:2px solid var(--accent);z-index:1}
.cell.blocked{background:var(--block);cursor:default}
.cell.filled{color:var(--accent);font-weight:700}
.cell.highlight{background:rgba(59,130,246,.12)}
.cell .num{position:absolute;top:2px;left:4px;font-size:.5rem;color:#8b949e}
.clues{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;max-width:600px}
.clue-section{min-width:220px}
.clue-section h3{color:var(--accent);margin-bottom:8px;font-size:.95rem}
.clue{font-size:.85rem;color:#8b949e;margin-bottom:4px;cursor:pointer;padding:4px 8px;border-radius:4px;transition:background .15s}
.clue:hover{background:rgba(59,130,246,.12)}
.clue.active{color:var(--text);background:rgba(59,130,246,.15)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.controls button{padding:8px 18px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:6px;cursor:pointer;font-size:.9rem;transition:all .15s}
.controls button:hover{background:var(--accent);color:#fff}
.win-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center}
.win-overlay.show{display:flex}
.win-box{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:40px;text-align:center}
.win-box h2{font-size:2rem;margin-bottom:10px;color:var(--accent)}
.win-box p{color:#8b949e;margin-bottom:20px}
.win-box button{padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="填字游戏 7×7">
  <meta property="og:description" content="7x7填字游戏，中等难度的英语填字挑战">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/crosswords-7x7/">
</head>
<body>
<h1>填字游戏 7×7</h1>
<div class="info">点击格子填入汉字或字母，参照提示完成填字</div>
<div class="timer">时间: <span id="time">00:00</span></div>
<div class="board" id="board"></div>
<div class="clues" id="clues"></div>
<div class="controls">
<button onclick="newGame()">新游戏</button>
<button onclick="clearAll()">清除</button>
</div>
<div class="win-overlay" id="winOverlay">
<div class="win-box">
<h2>恭喜通关!</h2>
<p id="winMsg">用时</p>
<button onclick="newGame();document.getElementById('winOverlay').classList.remove('show')">再来一局</button>
</div>
</div>
<script>
const puzzles=[
{
grid:[
['地','球','太','阳','月','亮','星'],
['','','','','','',''],
['','','','','','',''],
['','','','','','',''],
['','','','','','',''],
['','','','','','',''],
['','','','','','','']
],
blocked:[[1,0],[1,1],[1,2],[2,0],[2,3],[3,0],[3,1],[3,4],[4,0],[4,2],[4,5],[5,0],[5,3],[5,6],[6,0],[6,1],[6,4]],
across:[
{num:1,row:0,col:0,clue:'我们居住的星球',answer:'地球'},
{num:3,row:0,col:2,clue:'白天最亮的恒星',answer:'太阳'},
{num:5,row:0,col:4,clue:'夜晚照亮天空的卫星',answer:'月亮'},
{num:7,row:0,col:6,clue:'夜空中闪烁的天体',answer:'星'}
],
down:[
{num:1,row:0,col:0,clue:'脚下踩着的',answer:'地'},
{num:2,row:0,col:1,clue:'球类运动',answer:'球'},
{num:4,row:0,col:3,clue:'阳关道的阳',answer:'阳'},
{num:6,row:0,col:5,clue:'月光的月',answer:'月'}
]
},
{
grid:[
['金','木','水','火','土','行','者'],
['','','','','','',''],
['','','','','','',''],
['','','','','','',''],
['','','','','','',''],
['','','','','','',''],
['','','','','','','']
],
blocked:[[1,0],[1,2],[1,4],[2,0],[2,1],[2,3],[2,5],[3,0],[3,2],[3,4],[4,0],[4,1],[4,3],[4,5],[5,0],[5,2],[5,4],[6,0],[6,1],[6,3],[6,5]],
across:[
{num:1,row:0,col:0,clue:'五行之一，代表财富',answer:'金'},
{num:2,row:0,col:1,clue:'五行之一，代表生长',answer:'木'},
{num:3,row:0,col:2,clue:'五行之一，代表智慧',answer:'水'},
{num:4,row:0,col:3,clue:'五行之一，代表热情',answer:'火'},
{num:5,row:0,col:4,clue:'五行之一，代表稳定',answer:'土'},
{num:6,row:0,col:5,clue:'行列的行',answer:'行'},
{num:7,row:0,col:6,clue:'行者的者',answer:'者'}
],
down:[]
},
{
grid:[
['东','南','西','北','中','国','梦'],
['','','','','','',''],
['','','','','','',''],
['','','','','','',''],
['','','','','','',''],
['','','','','','',''],
['','','','','','','']
],
blocked:[[1,1],[1,3],[1,5],[2,0],[2,2],[2,4],[2,6],[3,1],[3,3],[3,5],[4,0],[4,2],[4,4],[4,6],[5,1],[5,3],[5,5],[6,0],[6,2],[6,4],[6,6]],
across:[
{num:1,row:0,col:0,clue:'日出的方向',answer:'东'},
{num:2,row:0,col:1,clue:'面对太阳时的右边',answer:'南'},
{num:3,row:0,col:2,clue:'日落的方向',answer:'西'},
{num:4,row:0,col:3,clue:'面对太阳时的左边',answer:'北'},
{num:5,row:0,col:4,clue:'中央的中',answer:'中'},
{num:6,row:0,col:5,clue:'国家的国',answer:'国'},
{num:7,row:0,col:6,clue:'中国梦的梦',answer:'梦'}
],
down:[]
}
];
let currentPuzzle,puzzleIdx=0,grid=[],sel=null,activeClue=null,timer=null,sec=0;

function newGame(){
puzzleIdx=Math.floor(Math.random()*puzzles.length);
currentPuzzle=puzzles[puzzleIdx];
grid=currentPuzzle.grid.map(r=>[...r]);
sel=null;activeClue=null;sec=0;
if(timer)clearInterval(timer);
document.getElementById('time').textContent='00:00';
timer=setInterval(()=>{sec++;let m=String(Math.floor(sec/60)).padStart(2,'0');let s=String(sec%60).padStart(2,'0');document.getElementById('time').textContent=m+':'+s},1000);
render();
}

function isBlocked(r,c){
return currentPuzzle.blocked.some(([br,bc])=>br===r&&bc===c);
}

function render(){
let b=document.getElementById('board');
b.innerHTML='';
let numMap={};
currentPuzzle.across.forEach(c=>{
if(!numMap[c.row])numMap[c.row]={};
numMap[c.row][c.col]=c.num;
});
for(let i=0;i<7;i++){
for(let j=0;j<7;j++){
let d=document.createElement('div');
d.className='cell';
if(isBlocked(i,j)){d.classList.add('blocked')}
else{
if(numMap[i]&&numMap[i][j]){
let num=document.createElement('span');
num.className='num';num.textContent=numMap[i][j];
d.appendChild(num);
}
if(grid[i][j]!==''){
d.classList.add('filled');
let txt=document.createTextNode(grid[i][j]);
d.appendChild(txt);
}
if(sel&&sel[0]===i&&sel[1]===j)d.classList.add('selected');
if(sel&&activeClue){
let clue=activeClue;
let sameWord=false;
if(clue.dir==='across'){
for(let c=0;c<clue.answer.length;c++){
if(i===clue.row&&j===clue.col+c){sameWord=true;break}
}
}else{
for(let c=0;c<clue.answer.length;c++){
if(j===clue.col&&i===clue.row+c){sameWord=true;break}
}
}
if(sameWord)d.classList.add('highlight');
}
d.onclick=()=>{if(!isBlocked(i,j)){sel=[i,j];findClue(i,j);render()}};
}
b.appendChild(d);
}
}
renderClues();
}

function findClue(r,c){
activeClue=null;
for(let clue of currentPuzzle.across){
if(clue.row===r&&c>=clue.col&&c<clue.col+clue.answer.length){
activeClue={...clue,dir:'across'};return;
}
}
for(let clue of currentPuzzle.down){
if(clue.col===c&&r>=clue.row&&r<clue.row+clue.answer.length){
activeClue={...clue,dir:'down'};return;
}
}
}

function renderClues(){
let c=document.getElementById('clues');
c.innerHTML='';
let sections=[
{title:'横向',clues:currentPuzzle.across,dir:'across'},
{title:'纵向',clues:currentPuzzle.down,dir:'down'}
];
sections.forEach(sec=>{
if(sec.clues.length===0)return;
let div=document.createElement('div');
div.className='clue-section';
let h3=document.createElement('h3');
h3.textContent=sec.title;
div.appendChild(h3);
sec.clues.forEach(clue=>{
let p=document.createElement('div');
p.className='clue';
if(activeClue&&activeClue.num===clue.num&&activeClue.dir===sec.dir)p.classList.add('active');
p.textContent=clue.num+'. '+clue.clue;
p.onclick=()=>{
let r=clue.row,c=clue.col;
activeClue={...clue,dir:sec.dir};
sel=[r,c];render();
};
div.appendChild(p);
});
c.appendChild(div);
});
}

document.onkeydown=e=>{
if(!sel)return;
if(isBlocked(sel[0],sel[1]))return;
let key=e.key;
if(key.length===1&&/[\u4e00-\u9fa5a-zA-Z]/.test(key)){
e.preventDefault();
grid[sel[0]][sel[1]]=key;
moveSel();render();checkWin();
}
if(e.key==='Backspace'||e.key==='Delete'){
e.preventDefault();
grid[sel[0]][sel[1]]='';
moveSel(true);render();
}
};

function moveSel(back){
if(!activeClue||!sel)return;
let clue=activeClue;
if(clue.dir==='across'){
if(back){if(sel[1]>clue.col)sel[1]--;else sel[1]=clue.col+clue.answer.length-1}
else{if(sel[1]<clue.col+clue.answer.length-1)sel[1]++;else sel[1]=clue.col}
}else{
if(back){if(sel[0]>clue.row)sel[0]--;else sel[0]=clue.row+clue.answer.length-1}
else{if(sel[0]<clue.row+clue.answer.length-1)sel[0]++;else sel[0]=clue.row}
}
}

function checkWin(){
for(let i=0;i<7;i++)for(let j=0;j<7;j++){
if(isBlocked(i,j))continue;
if(grid[i][j]==='')return;
}
clearInterval(timer);
document.getElementById('winMsg').textContent='用时 '+document.getElementById('time').textContent;
document.getElementById('winOverlay').classList.add('show');
}

function clearAll(){
for(let i=0;i<7;i++)for(let j=0;j<7;j++){
if(!isBlocked(i,j))grid[i][j]='';
}
render();
}

newGame();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
