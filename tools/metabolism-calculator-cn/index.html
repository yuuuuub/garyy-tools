<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 基础代谢率计算器</title>
<meta property="og:title" content="🔥 基础代谢率计算器">
<meta property="og:description" content="🔥 基础代谢率计算器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线基础代谢率(BMR)计算器，支持Mifflin-St Jeor和Harris-Benedict公式">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.gender-tabs{display:flex;gap:8px;margin-bottom:12px}
.gender-tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:14px;cursor:pointer;text-align:center;transition:all .2s;font-weight:600}
.gender-tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-group label{font-size:12px;color:var(--text-secondary);font-weight:500}
.input-group input,.input-group select{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;transition:all .2s}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--accent)}
.calc-btn{width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.calc-btn:hover{background:var(--accent-hover)}
.result-card{background:var(--tag-bg);border-radius:12px;padding:20px;text-align:center;margin-top:12px}
.result-val{font-size:48px;font-weight:800;color:var(--accent)}
.result-unit{font-size:14px;color:var(--text-secondary)}
.formula-card{border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--border);background:var(--preview-bg)}
.formula-name{font-size:13px;font-weight:600;margin-bottom:4px}
.formula-result{font-size:20px;font-weight:700;color:var(--accent)}
.formula-desc{font-size:11px;color:var(--text-secondary);margin-top:2px}
.tdee-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.tdee-item{background:var(--card-bg);border-radius:10px;padding:12px;text-align:center;border:1px solid var(--border)}
.tdee-item .level{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.tdee-item .val{font-size:18px;font-weight:700;color:var(--accent)}
.tip{font-size:12px;color:var(--text-secondary);margin-top:12px;line-height:1.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🔥 基础代谢率计算器</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">👤 基本信息</div>
<div class="gender-tabs">
<div class="gender-tab active" onclick="setGender('male',this)">👨 男性</div>
<div class="gender-tab" onclick="setGender('female',this)">👩 女性</div>
</div>
<div class="input-row">
<div class="input-group">
<label>年龄（岁）</label>
<input type="number" id="age" placeholder="25" min="10" max="100">
</div>
<div class="input-group">
<label>身高（cm）</label>
<input type="number" id="height" placeholder="170" min="100" max="220">
</div>
</div>
<div class="input-row">
<div class="input-group">
<label>体重（kg）</label>
<input type="number" id="weight" placeholder="65" min="20" max="250">
</div>
<div class="input-group">
<label>活动水平</label>
<select id="activity">
<option value="1.2">久坐不动</option>
<option value="1.375">轻度运动(1-3天/周)</option>
<option value="1.55" selected>中度运动(3-5天/周)</option>
<option value="1.725">重度运动(6-7天/周)</option>
<option value="1.9">专业运动员</option>
</select>
</div>
</div>
<button class="calc-btn" onclick="calculate()">🔥 计算代谢率</button>
</div>
<div class="card" id="resultCard" style="display:none">
<div class="card-title">📊 计算结果</div>
<div class="result-card">
<div class="result-val" id="bmrVal">--</div>
<div class="result-unit">基础代谢率 (千卡/天)</div>
</div>
<div id="formulaCards"></div>
</div>
<div class="card" id="tdeeCard" style="display:none">
<div class="card-title">📈 每日总消耗 (TDEE)</div>
<div class="tdee-grid" id="tdeeGrid"></div>
</div>
<div class="card">
<div class="card-title">ℹ️ 说明</div>
<div class="tip">
• <b>基础代谢率(BMR)</b>：维持生命所需的最低热量<br>
• <b>TDEE</b>：每日总能量消耗 = BMR × 活动系数<br>
• Mifflin-St Jeor公式被认为是最准确的BMR计算公式<br>
• 实际代谢率可能因肌肉量、基因等因素有所差异
</div>
</div>
<div class="footer">Gary's Tools · 代谢率仅供参考</div>
</div>
<script>
let currentGender='male';
function setGender(g,el){
currentGender=g;
document.querySelectorAll('.gender-tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
}
function calculate(){
const age=parseFloat(document.getElementById('age').value);
const h=parseFloat(document.getElementById('height').value);
const w=parseFloat(document.getElementById('weight').value);
const act=parseFloat(document.getElementById('activity').value);
if(!age||!h||!w){alert('请填写完整信息');return}
let mifflin,harris,newHarris;
if(currentGender==='male'){
mifflin=10*w+6.25*h-5*age+5;
harris=88.362+13.397*w+4.799*h-5.677*age;
newHarris=88.362+13.397*w+4.799*h-5.677*age;
}else{
mifflin=10*w+6.25*h-5*age-161;
harris=447.593+9.247*w+3.098*h-4.330*age;
newHarris=447.593+9.247*w+3.098*h-4.330*age;
}
const avg=(mifflin+harris+newHarris)/3;
document.getElementById('bmrVal').textContent=Math.round(avg);
let cardsHtml=`
<div class="formula-card"><div class="formula-name">Mifflin-St Jeor (推荐)</div><div class="formula-result">${Math.round(mifflin)} 千卡</div><div class="formula-desc">目前最准确的BMR公式</div></div>
<div class="formula-card"><div class="formula-name">Harris-Benedict</div><div class="formula-result">${Math.round(harris)} 千卡</div><div class="formula-desc">经典BMR公式</div></div>
`;
document.getElementById('formulaCards').innerHTML=cardsHtml;
const levels=[
{label:'久坐不动',act:1.2,emoji:'🪑'},
{label:'轻度运动',act:1.375,emoji:'🚶'},
{label:'中度运动',act:1.55,emoji:'🏃'},
{label:'重度运动',act:1.725,emoji:'💪'},
{label:'专业运动',act:1.9,emoji:'🏅'}
];
let tdeeHtml='';
levels.forEach(l=>{
const tdee=Math.round(avg*l.act);
const isActive=Math.abs(l.act-act)<0.01;
tdeeHtml+=`<div class="tdee-item" style="${isActive?'border-color:var(--accent);background:var(--tag-bg)':''}"><div class="level">${l.emoji} ${l.label}</div><div class="val">${tdee}</div></div>`;
});
document.getElementById('tdeeGrid').innerHTML=tdeeHtml;
document.getElementById('resultCard').style.display='block';
document.getElementById('tdeeCard').style.display='block';
}
function toggleTheme(){
const html=document.documentElement;
const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
html.setAttribute('data-theme',next);
document.querySelector('.theme-toggle').textContent=next==='dark'?'☀️':'🌙';
}
</script>
</body>
</html>
