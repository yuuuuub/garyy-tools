<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💡 智能路灯管理</title>
<meta name="description" content="智能路灯管理系统，远程控制、能耗监控、故障检测、亮度调节">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:1100px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.stat-card .icon{font-size:1.8rem;margin-bottom:4px}
.stat-card .val{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.8rem;color:var(--text2)}
.lamp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lamp{padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;transition:all .2s}
.lamp.on{border-color:var(--warn);box-shadow:0 0 15px rgba(245,158,11,.2)}
.lamp .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lamp .name{font-weight:600;font-size:.9rem}
.lamp .status-dot{width:10px;height:10px;border-radius:50%}
.lamp .status-dot.on{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.lamp .status-dot.off{background:var(--text2)}
.lamp .status-dot.fault{background:var(--danger);animation:pulse 1s infinite}
.lamp .info{font-size:.8rem;color:var(--text2);margin-bottom:6px}
.lamp .brightness{display:flex;align-items:center;gap:8px;font-size:.8rem}
.lamp .brightness input[type=range]{flex:1;accent-color:var(--warn)}
.lamp .brightness span{min-width:30px;text-align:right;color:var(--warn);font-weight:600}
.lamp .actions{display:flex;gap:6px;margin-top:8px}
.btn{padding:6px 12px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;transition:all .2s;font-size:.8rem}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:4px 8px;font-size:.75rem}
.btn-success{background:var(--success)}.btn-danger{background:var(--danger)}.btn-warn{background:var(--warn)}.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.8rem;transition:all .2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.energy-chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.energy-bar{flex:1;border-radius:3px 3px 0 0;background:var(--accent);transition:height .5s;min-width:8px}
.fault-list{max-height:200px;overflow-y:auto}
.fault-item{display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--border);font-size:.85rem}
.fault-item:last-child{border-bottom:none}
.badge{padding:2px 8px;border-radius:10px;font-size:.75rem}
.badge-danger{background:rgba(239,68,68,.15);color:var(--danger)}
.badge-warn{background:rgba(245,158,11,.15);color:var(--warn)}
.badge-success{background:rgba(34,197,94,.15);color:var(--success)}
input[type=text]{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.85rem;margin-bottom:8px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="💡 智能路灯管理">
<meta property="og:description" content="智能路灯管理系统，远程控制、能耗监控、故障检测、亮度调节">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>💡 智能路灯管理</h1><p>远程控制、能耗监控、故障检测、亮度调节</p></div>

<div class="cd">
<h2>📊 运营数据</h2>
<div class="grid" id="stats"></div>
</div>

<div class="cd">
<h2>💡 路灯控制</h2>
<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
<input type="text" id="searchInput" placeholder="搜索路灯编号或位置..." style="flex:1;margin-bottom:0">
<button class="btn btn-success" onclick="allOn()">全部开启</button>
<button class="btn btn-danger" onclick="allOff()">全部关闭</button>
</div>
<div class="tabs" id="zoneTabs"></div>
<div class="lamp-grid" id="lampGrid"></div>
</div>

<div class="cd">
<h2>📈 今日能耗趋势</h2>
<div class="energy-chart" id="energyChart"></div>
<div style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--text2);margin-top:4px"><span>0:00</span><span>6:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
</div>

<div class="cd">
<h2>🚨 故障报警</h2>
<div class="fault-list" id="faultList"></div>
</div>
</div>

<script src="i18n.js" defer></script>
<script>
(function(){
var zones=['全部','长安街','二环路','三环路','商业区','居民区'];
var streets=['长安街','建国路','复兴路','东二环','西二环','三里屯路','望京街','中关村大街','学院路','朝阳北路'];
var currentZone='全部';
var lamps=[];
var faults=[];

function initLamps(){
  for(var i=0;i<20;i++){
    var state=Math.random();
    lamps.push({
      id:'L-'+String(i+1).padStart(4,'0'),
      street:Random.pick(streets),
      brightness:Math.round(50+Math.random()*50),
      status:state>.9?'fault':state>.3?'on':'off',
      power:Math.round(30+Math.random()*40),
      temp:Math.round(35+Math.random()*25)
    });
  }
}

function initFaults(){
  var types=['灯泡损坏','线路故障','控制器异常','电压不稳','通信中断'];
  for(var i=0;i<5;i++){
    faults.push({
      lamp:lamps[Random.int(0,lamps.length-1)],
      type:Random.pick(types),
      time:Random.time(24)+':'+Random.int(0,59).toString().padStart(2,'0'),
      status:Math.random()>.5?'待处理':'处理中'
    });
  }
}

function renderStats(){
  var onCount=lamps.filter(function(l){return l.status==='on'}).length;
  var faultCount=lamps.filter(function(l){return l.status==='fault'}).length;
  var totalPower=lamps.reduce(function(s,l){return s+(l.status==='on'?l.power:0)},0);
  var data=[
    {icon:'💡',val:lamps.length,label:'路灯总数'},
    {icon:'🟢',val:onCount,label:'运行中'},
    {icon:'🔴',val:lamps.length-onCount-faultCount,label:'已关闭'},
    {icon:'⚠️',val:faultCount,label:'故障'},
    {icon:'⚡',val:totalPower+'W',label:'当前功耗'},
    {icon:'💰',val:'¥'+Math.round(totalPower*0.5),label:'今日电费'}
  ];
  var h='';
  data.forEach(function(d){h+='<div class="stat-card"><div class="icon">'+d.icon+'</div><div class="val">'+d.val+'</div><div class="label">'+d.label+'</div></div>'});
  document.getElementById('stats').innerHTML=h;
}

function renderZoneTabs(){
  var h='';
  zones.forEach(function(z){h+='<div class="tab'+(z===currentZone?' active':'')+'" onclick="filterZone(\''+z+'\')">'+z+'</div>'});
  document.getElementById('zoneTabs').innerHTML=h;
}

window.filterZone=function(z){currentZone=z;renderZoneTabs();renderLamps()};

function renderLamps(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=lamps.filter(function(l){
    if(search&&l.id.toLowerCase().indexOf(search)===-1&&l.street.toLowerCase().indexOf(search)===-1) return false;
    return true;
  });
  var h='';
  filtered.forEach(function(l,i){
    h+='<div class="lamp '+l.status+'"><div class="top"><span class="name">💡 '+l.id+'</span><div class="status-dot '+l.status+'"></div></div><div class="info">📍 '+l.street+' · '+l.power+'W · '+l.temp+'°C</div><div class="brightness"><span>亮度</span><input type="range" min="0" max="100" value="'+l.brightness+'" onchange="setBrightness('+i+',this.value)"><span>'+l.brightness+'%</span></div><div class="actions"><button class="btn btn-sm '+(l.status==='on'?'btn-warn':'btn-success')+'" onclick="toggleLamp('+i+')">'+(l.status==='on'?'关闭':'开启')+'</button>'+(l.status==='fault'?'<button class="btn btn-sm btn-danger" onclick="reportFault('+i+')">报修</button>':'')+'</div></div>';
  });
  document.getElementById('lampGrid').innerHTML=h||'<div style="text-align:center;color:var(--text2);padding:20px">暂无匹配路灯</div>';
}

window.toggleLamp=function(i){lamps[i].status=lamps[i].status==='on'?'off':'on';renderLamps();renderStats()};
window.setBrightness=function(i,v){lamps[i].brightness=parseInt(v);renderLamps()};
window.reportFault=function(i){garyyToast('已提交报修工单：'+lamps[i].id,'success')};
window.allOn=function(){lamps.forEach(function(l){if(l.status!=='fault')l.status='on'});renderLamps();renderStats();garyyToast('全部路灯已开启','success')};
window.allOff=function(){lamps.forEach(function(l){l.status='off'});renderLamps();renderStats();garyyToast('全部路灯已关闭','info')};

function renderEnergy(){
  var h='';
  for(var i=0;i<24;i++){
    var v=i>=18||i<=6?60+Math.random()*40:10+Math.random()*30;
    h+='<div class="energy-bar" style="height:'+v+'%"></div>';
  }
  document.getElementById('energyChart').innerHTML=h;
}

function renderFaults(){
  var h='';
  faults.forEach(function(f){
    var badge=f.status==='待处理'?'badge-danger':'badge-warn';
    h+='<div class="fault-item"><span class="badge '+badge+'">'+f.status+'</span><span style="flex:1"><strong>'+f.lamp.id+'</strong> · '+f.type+'</span><span style="color:var(--text2);font-size:.8rem">'+f.time+'</span></div>';
  });
  document.getElementById('faultList').innerHTML=h;
}

initLamps();initFaults();
document.getElementById('searchInput').addEventListener('input',renderLamps);
renderStats();renderZoneTabs();renderLamps();renderEnergy();renderFaults();
setInterval(function(){renderStats()},8000);
})();
</script>
</body>
</html>
