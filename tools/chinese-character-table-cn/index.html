<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字速查表</title>
<meta name="description" content="汉字速查表，按部首和笔画分类，支持拼音、释义搜索">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.char-card{padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;text-align:center}.char-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.char-card .ch{font-size:1.8rem;font-weight:700}.char-card .py{font-size:.8rem;color:var(--accent);margin-top:2px}.char-card .mn{font-size:.75rem;color:var(--text2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.8rem;font-weight:600;margin:2px;cursor:pointer;transition:all .2s}
.tag-blue{background:rgba(59,130,246,.15);color:var(--accent)}.tag-blue.active{background:var(--accent);color:#fff}
.tag-green{background:rgba(34,197,94,.15);color:var(--success)}
.tag-yellow{background:rgba(245,158,11,.15);color:var(--warn)}
.tag-red{background:rgba(239,68,68,.15);color:var(--danger)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:1000;justify-content:center;align-items:center}
.modal.show{display:flex}
.modal-content{background:var(--card);border-radius:var(--radius);padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;border:1px solid var(--border)}
.modal-content .close{float:right;cursor:pointer;font-size:1.5rem;color:var(--text2)}
.stats{display:flex;gap:12px;margin-bottom:12px}
.stat{text-align:center;padding:12px;background:var(--bg);border-radius:8px;flex:1}.stat .num{font-size:1.5rem;font-weight:700;color:var(--accent)}.stat .lbl{font-size:.75rem;color:var(--text2)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="汉字速查表">
<meta property="og:description" content="汉字速查表，按部首和笔画分类">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📖 汉字速查表</h1><p>按部首和笔画分类，支持搜索</p></div>

<div class="stats" id="statsBar">
<div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">总字数</div></div>
<div class="stat"><div class="num" id="radicalCount">0</div><div class="lbl">部首数</div></div>
<div class="stat"><div class="num" id="shownCount">0</div><div class="lbl">当前显示</div></div>
</div>

<div class="cd"><h2>搜索</h2>
<div style="display:flex;gap:8px">
<input type="text" id="searchInput" placeholder="搜索汉字、拼音或释义..." style="flex:1">
<button onclick="searchChars()">搜索</button>
<button class="sec" onclick="resetSearch()">重置</button>
</div>
<div class="bg" id="radicalTags"></div>
<div class="bg" id="strokeTags" style="margin-top:8px"></div></div>

<div class="cd"><h2>汉字列表</h2>
<div class="gr" id="charGrid"></div>
<div id="noResult" class="hidden" style="text-align:center;padding:20px;color:var(--text2)">没有找到匹配的汉字</div></div>
</div>

<div class="modal" id="detailModal">
<div class="modal-content">
<span class="close" onclick="closeModal()">&times;</span>
<div id="detailContent"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const allChars=[
{ch:'一',py:'yī',st:1,r:'一',m:'最小正整数'},{ch:'二',py:'èr',st:2,r:'二',m:'一加一的和'},
{ch:'三',py:'sān',st:3,r:'一',m:'二加一的和'},{ch:'人',py:'rén',st:2,r:'人',m:'高等动物'},
{ch:'大',py:'dà',st:3,r:'大',m:'超过一般'},{ch:'小',py:'xiǎo',st:3,r:'小',m:'不大'},
{ch:'中',py:'zhōng',st:4,r:'丨',m:'中间'},{ch:'国',py:'guó',st:8,r:'囗',m:'国家'},
{ch:'好',py:'hǎo',st:6,r:'女',m:'优点多'},{ch:'明',py:'míng',st:8,r:'日',m:'亮'},
{ch:'林',py:'lín',st:8,r:'木',m:'树木众多'},{ch:'森',py:'sēn',st:12,r:'木',m:'树木丛生'},
{ch:'花',py:'huā',st:7,r:'艹',m:'植物繁殖器官'},{ch:'草',py:'cǎo',st:9,r:'艹',m:'草本植物'},
{ch:'想',py:'xiǎng',st:13,r:'心',m:'思考'},{ch:'思',py:'sī',st:9,r:'心',m:'考虑'},
{ch:'问',py:'wèn',st:6,r:'门',m:'请人解答'},{ch:'间',py:'jiān',st:7,r:'门',m:'两者之间'},
{ch:'同',py:'tóng',st:6,r:'冂',m:'一样'},{ch:'龙',py:'lóng',st:5,r:'龙',m:'传说动物'},
{ch:'凤',py:'fèng',st:4,r:'几',m:'凤凰'},{ch:'水',py:'shuǐ',st:4,r:'水',m:'无色液体'},
{ch:'火',py:'huǒ',st:4,r:'火',m:'燃烧的光焰'},{ch:'山',py:'shān',st:3,r:'山',m:'高耸地面'},
{ch:'石',py:'shí',st:5,r:'石',m:'矿物质硬块'},{ch:'田',py:'tián',st:5,r:'田',m:'种植地'},
{ch:'口',py:'kǒu',st:3,r:'口',m:'嘴'},{ch:'日',py:'rì',st:4,r:'日',m:'太阳'},
{ch:'月',py:'yuè',st:4,r:'月',m:'月亮'},{ch:'木',py:'mù',st:4,r:'木',m:'树木'},
{ch:'金',py:'jīn',st:8,r:'金',m:'金属元素'},{ch:'马',py:'mǎ',st:3,r:'马',m:'哺乳动物'},
{ch:'鸟',py:'niǎo',st:5,r:'鸟',m:'有羽毛能飞'},{ch:'鱼',py:'yú',st:8,r:'鱼',m:'水生动物'},
{ch:'牛',py:'niú',st:4,r:'牛',m:'哺乳动物'},{ch:'羊',py:'yáng',st:6,r:'羊',m:'哺乳动物'},
{ch:'犬',py:'quǎn',st:4,r:'犬',m:'狗'},{ch:'猫',py:'māo',st:11,r:'犭',m:'哺乳动物'},
{ch:'狗',py:'gǒu',st:8,r:'犭',m:'哺乳动物'},{ch:'爱',py:'ài',st:10,r:'爫',m:'深厚感情'},
{ch:'学',py:'xué',st:8,r:'子',m:'学习'},{ch:'天',py:'tiān',st:4,r:'大',m:'高空'},
{ch:'地',py:'dì',st:6,r:'土',m:'人类活动所在'},{ch:'家',py:'jiā',st:10,r:'宀',m:'住所'},
{ch:'房',py:'fáng',st:8,r:'户',m:'建筑物'},{ch:'树',py:'shù',st:9,r:'木',m:'木本植物'},
{ch:'河',py:'hé',st:8,r:'氵',m:'水道'},{ch:'湖',py:'hú',st:12,r:'氵',m:'大水聚积'},
{ch:'海',py:'hǎi',st:10,r:'氵',m:'近大陆水域'},{ch:'红',py:'hóng',st:6,r:'纟',m:'鲜血颜色'},
{ch:'绿',py:'lǜ',st:11,r:'纟',m:'蓝黄混合色'},{ch:'蓝',py:'lán',st:13,r:'艹',m:'靛青色'},
{ch:'风',py:'fēng',st:4,r:'风',m:'空气流动'},{ch:'雨',py:'yǔ',st:8,r:'雨',m:'水蒸气凝结'},
{ch:'云',py:'yún',st:4,r:'二',m:'水汽凝聚'},{ch:'雪',py:'xuě',st:11,r:'雨',m:'白色结晶'},
{ch:'春',py:'chūn',st:9,r:'日',m:'四季之首'},{ch:'夏',py:'xià',st:10,r:'夂',m:'四季之一'},
{ch:'秋',py:'qiū',st:9,r:'禾',m:'四季之一'},{ch:'冬',py:'dōng',st:5,r:'冫',m:'四季之一'},
{ch:'东',py:'dōng',st:5,r:'一',m:'方向'},{ch:'西',py:'xī',st:6,r:'覀',m:'方向'},
{ch:'南',py:'nán',st:9,r:'十',m:'方向'},{ch:'北',py:'běi',st:5,r:'匕',m:'方向'},
{ch:'左',py:'zuǒ',st:5,r:'工',m:'方位'},{ch:'右',py:'yòu',st:5,r:'口',m:'方位'},
{ch:'上',py:'shàng',st:3,r:'一',m:'高处'},{ch:'下',py:'xià',st:3,r:'一',m:'低处'},
{ch:'前',py:'qián',st:9,r:'刂',m:'方位'},{ch:'后',py:'hòu',st:6,r:'口',m:'方位'},
{ch:'男',py:'nán',st:7,r:'田',m:'男性'},{ch:'女',py:'nǚ',st:3,r:'女',m:'女性'},
{ch:'子',py:'zǐ',st:3,r:'子',m:'儿女'},{ch:'父',py:'fù',st:4,r:'父',m:'爸爸'},
{ch:'母',py:'mǔ',st:5,r:'母',m:'妈妈'},{ch:'兄',py:'xiōng',st:5,r:'儿',m:'哥哥'},
{ch:'弟',py:'dì',st:7,r:'弓',m:'弟弟'},{ch:'姐',py:'jiě',st:8,r:'女',m:'姐姐'},
{ch:'妹',py:'mèi',st:8,r:'女',m:'妹妹'},{ch:'哥',py:'gē',st:10,r:'口',m:'哥哥'},
{ch:'姐',py:'jiě',st:8,r:'女',m:'姐姐'},{ch:'爸',py:'bà',st:8,r:'父',m:'父亲'},
{ch:'妈',py:'mā',st:6,r:'女',m:'母亲'},{ch:'手',py:'shǒu',st:4,r:'手',m:'人体器官'},
{ch:'足',py:'zú',st:7,r:'足',m:'脚'},{ch:'目',py:'mù',st:5,r:'目',m:'眼睛'},
{ch:'耳',py:'ěr',st:6,r:'耳',m:'听觉器官'},{ch:'心',py:'xīn',st:4,r:'心',m:'心脏'},
{ch:'头',py:'tóu',st:5,r:'大',m:'脑袋'},{ch:'面',py:'miàn',st:9,r:'面',m:'脸'},
{ch:'书',py:'shū',st:4,r:'乙',m:'著作'},{ch:'画',py:'huà',st:8,r:'田',m:'图画'},
{ch:'歌',py:'gē',st:14,r:'欠',m:'能唱的文词'},{ch:'诗',py:'shī',st:8,r:'讠',m:'文学体裁'},
{ch:'文',py:'wén',st:4,r:'文',m:'文字'},{ch:'字',py:'zì',st:6,r:'子',m:'文字'},
{ch:'数',py:'shù',st:13,r:'攵',m:'数学'},{ch:'理',py:'lǐ',st:11,r:'王',m:'道理'},
{ch:'工',py:'gōng',st:3,r:'工',m:'工作'},{ch:'商',py:'shāng',st:11,r:'亠',m:'商业'},
];

let currentRadical='all';
let currentStroke='all';

function init(){
  const radicals=[...new Set(allChars.map(c=>c.r))];
  const strokes=[...new Set(allChars.map(c=>c.st))].sort((a,b)=>a-b);
  $('totalCount').textContent=allChars.length;
  $('radicalCount').textContent=radicals.length;
  $('radicalTags').innerHTML='<span class="tag tag-blue active" onclick="filterRadical(\'all\',this)">全部</span>'+radicals.map(r=>'<span class="tag tag-blue" onclick="filterRadical(\''+r+'\',this)">'+r+'</span>').join('');
  $('strokeTags').innerHTML='<span class="tag tag-green active" onclick="filterStroke(\'all\',this)">全部笔画</span>'+strokes.map(s=>'<span class="tag tag-green" onclick="filterStroke('+s+',this)">'+s+'画</span>').join('');
  renderChars(allChars);
}

function filterRadical(r,el){
  currentRadical=r;
  document.querySelectorAll('#radicalTags .tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function filterStroke(s,el){
  currentStroke=s;
  document.querySelectorAll('#strokeTags .tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function applyFilters(){
  const q=$('searchInput').value.trim().toLowerCase();
  let filtered=allChars;
  if(currentRadical!=='all')filtered=filtered.filter(c=>c.r===currentRadical);
  if(currentStroke!=='all')filtered=filtered.filter(c=>c.st===currentStroke);
  if(q)filtered=filtered.filter(c=>c.ch.includes(q)||c.py.includes(q)||c.m.includes(q));
  renderChars(filtered);
}

function searchChars(){applyFilters()}
function resetSearch(){
  $('searchInput').value='';currentRadical='all';currentStroke='all';
  document.querySelectorAll('.tag').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tag').forEach(t=>{if(t.textContent==='全部'||t.textContent==='全部笔画')t.classList.add('active')});
  renderChars(allChars);
}

function renderChars(chars){
  $('shownCount').textContent=chars.length;
  if(chars.length===0){$('charGrid').innerHTML='';$('noResult').classList.remove('hidden');return}
  $('noResult').classList.add('hidden');
  $('charGrid').innerHTML=chars.map(c=>'<div class="char-card" onclick="showDetail(\''+c.ch+'\')"><div class="ch">'+c.ch+'</div><div class="py">'+c.py+'</div><div class="mn">'+c.m+'</div></div>').join('');
}

function showDetail(ch){
  const c=allChars.find(x=>x.ch===ch);
  if(!c)return;
  $('detailContent').innerHTML=`
    <div style="text-align:center;font-size:4rem;font-weight:700;margin-bottom:16px">${c.ch}</div>
    <div class="gr" style="grid-template-columns:repeat(2,1fr);margin-bottom:16px">
      <div style="padding:12px;background:var(--bg);border-radius:8px;text-align:center"><div style="font-size:1.2rem;font-weight:700;color:var(--accent)">${c.py}</div><div style="font-size:.8rem;color:var(--text2)">拼音</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px;text-align:center"><div style="font-size:1.2rem;font-weight:700;color:var(--accent)">${c.st}</div><div style="font-size:.8rem;color:var(--text2)">笔画</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px;text-align:center"><div style="font-size:1.2rem;font-weight:700;color:var(--accent)">${c.r}</div><div style="font-size:.8rem;color:var(--text2)">部首</div></div>
      <div style="padding:12px;background:var(--bg);border-radius:8px;text-align:center"><div style="font-size:1rem;font-weight:700;color:var(--accent)">${c.m}</div><div style="font-size:.8rem;color:var(--text2)">释义</div></div>
    </div>`;
  $('detailModal').classList.add('show');
}

function closeModal(){$('detailModal').classList.remove('show')}
$('detailModal').addEventListener('click',e=>{if(e.target===$('detailModal'))closeModal()});
$('searchInput').addEventListener('input',applyFilters);
init();
</script>
</body>
</html>
