<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 高考专业兴趣测试 - Gary's Tools</title>
<meta name="description" content="高考专业选择测试，通过兴趣问答帮助你找到适合的大学专业方向，涵盖工学、医学、文科、艺术等">
<style>
:root{--bg:#f0f9ff;--card:#fff;--text:#1e293b;--text2:#64748b;--accent:#2563eb;--accent2:#7c3aed;--green:#059669;--border:#e2e8f0;--radius:14px;--shadow:0 2px 16px rgba(0,0,0,.06)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
[data-theme="dark"]{--bg:#0a1628;--card:#112240;--text:#e2e8f0;--text2:#94a3b8;--border:#1e3a5f}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;-webkit-font-smoothing:antialiased}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#2563eb,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.progress{height:6px;background:var(--border);border-radius:3px;margin-bottom:16px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s}
.question-card{text-align:center}
.question-num{font-size:.8rem;color:var(--text2);margin-bottom:8px}
.question-text{font-size:1.15rem;font-weight:600;margin-bottom:20px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:10px}
.option{padding:14px 18px;border:2px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-size:.95rem;cursor:pointer;text-align:left;transition:all .2s;font-family:inherit}
.option:hover{border-color:var(--accent);background:rgba(37,99,235,.05)}
.option.selected{border-color:var(--accent);background:rgba(37,99,235,.1)}
.result-card{text-align:center}
.result-icon{font-size:3rem;margin-bottom:8px}
.result-title{font-size:1.3rem;font-weight:800;color:var(--accent);margin-bottom:8px}
.result-desc{font-size:.85rem;color:var(--text2);line-height:1.7;margin-bottom:16px}
.result-majors{text-align:left}
.result-majors h4{font-size:.9rem;margin-bottom:8px;color:var(--text)}
.major-tag{display:inline-block;padding:6px 14px;margin:4px;background:rgba(37,99,235,.1);border-radius:20px;font-size:.8rem;color:var(--accent);font-weight:500}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--text)}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--bg);color:var(--text);border:2px solid var(--border);margin-top:10px}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🎓 高考专业兴趣测试 - Gary's Tools">
  <meta property="og:description" content="高考专业选择测试，通过兴趣问答帮助你找到适合的大学专业方向，涵盖工学、医学、文科、艺术等">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/gaokao-major-quiz/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>🎓 高考专业兴趣测试</h1>
<p>10道题 · 帮你找到最适合的大学专业方向</p>
</header>

<div id="quizArea"></div>
<footer>测试结果仅供参考 · 祝找到心中热爱 💙</footer>
</div>

<script>
const QUEST=[
{q:'你更喜欢哪种解决问题的方式？',o:[
{t:'动手实验，亲手验证',s:[4,3,0,0,0,1]},
{t:'逻辑推理，用公式计算',s:[0,5,2,0,0,0]},
{t:'与人沟通，团队协作',s:[0,0,0,4,2,3]},
{t:'创造表达，艺术呈现',s:[0,0,0,0,5,2]},
]},
{q:'哪种场景让你最投入？',o:[
{t:'在实验室做研究',s:[5,3,0,0,0,0]},
{t:'编写代码解决问题',s:[2,5,1,0,0,0]},
{t:'组织策划一场活动',s:[0,0,0,3,2,5]},
{t:'设计一张海报或画一幅画',s:[0,0,0,0,5,3]},
]},
{q:'你最擅长哪个科目？',o:[
{t:'数学/物理',s:[2,5,3,0,0,0]},
{t:'化学/生物',s:[5,2,0,0,0,0]},
{t:'语文/历史',s:[0,0,0,4,3,2]},
{t:'英语/地理',s:[0,0,0,3,2,4]},
]},
{q:'课余时间你最喜欢？',o:[
{t:'看科普纪录片',s:[3,2,0,0,1,2]},
{t:'拆装小电器/DIY',s:[4,3,0,0,0,1]},
{t:'写作/阅读文学作品',s:[0,0,0,5,3,0]},
{t:'玩创意设计类游戏',s:[0,2,0,0,4,0]},
]},
{q:'未来你最看重工作的哪个方面？',o:[
{t:'推动科技进步',s:[3,4,1,0,0,0]},
{t:'帮助他人/服务社会',s:[4,0,0,3,1,2]},
{t:'高收入/稳定性',s:[0,3,2,0,1,4]},
{t:'自由创作/自我表达',s:[0,0,0,0,5,3]},
]},
{q:'看到一个复杂系统，你更想？',o:[
{t:'了解其运行原理',s:[3,5,1,0,0,0]},
{t:'找出系统中的问题并优化',s:[1,4,2,0,1,3]},
{t:'思考对人的影响',s:[0,0,0,5,2,1]},
{t:'用美学方式表现它',s:[0,0,0,0,4,5]},
]},
{q:'团队项目中，你更愿意承担什么角色？',o:[
{t:'数据分析和研究',s:[2,4,1,1,0,0]},
{t:'方案设计和架构',s:[0,3,2,0,2,3]},
{t:'沟通协调和记录',s:[0,0,0,4,3,2]},
{t:'视觉呈现和创意',s:[0,0,0,0,5,4]},
]},
{q:'哪种成就让你最有满足感？',o:[
{t:'发现了一个科学现象',s:[5,2,0,0,0,1]},
{t:'写出了一段优雅的代码',s:[1,5,3,0,0,0]},
{t:'帮助了一个需要帮助的人',s:[3,0,0,5,0,0]},
{t:'创作了一件被人欣赏的作品',s:[0,0,0,0,5,3]},
]},
{q:'你对未来的想象更接近？',o:[
{t:'在实验室或研究所工作',s:[5,3,0,0,0,0]},
{t:'在科技公司做技术大牛',s:[0,5,2,0,1,0]},
{t:'教书育人或做管理者',s:[0,0,0,5,3,2]},
{t:'自由职业/内容创作者',s:[0,0,0,1,4,5]},
]},
{q:'遇到困难时，你倾向？',o:[
{t:'查资料，自己研究解决',s:[3,4,2,0,0,0]},
{t:'找懂行的人请教',s:[0,2,1,4,2,3]},
{t:'组织讨论，集思广益',s:[0,0,0,5,3,2]},
{t:'换个思路，从灵感出发',s:[0,0,0,0,4,5]},
]},
];

const CATEGORIES=[
{name:'🔬 理学 & 医学',majors:['临床医学','药学','生物学','化学','物理学','基础医学','预防医学','护理学','心理学','生物医学工程'],desc:'你对生命科学和基础研究有浓厚兴趣。适合从事医学、科研、制药等领域，治病救人，探索未知。'},
{name:'💻 工学 & 计算机',majors:['计算机科学','人工智能','软件工程','电子信息','自动化','机械工程','土木工程','航天航空','电气工程','数据科学'],desc:'你逻辑思维强，喜欢动手和技术创新。适合从事IT、工程、制造等领域，用技术改变世界。'},
{name:'📊 金融 & 经管',majors:['金融学','经济学','工商管理','会计学','市场营销','国际贸易','保险学','管理科学','物流管理','电子商务'],desc:'你对数字敏感，善于分析决策。适合从事金融、咨询、企业管理等领域，在商业世界大展拳脚。'},
{name:'📖 教育 & 社科',majors:['教育学','社会学','法学','新闻传播','公共管理','政治学','哲学','社会工作','国际关系','思想政治教育'],desc:'你善于沟通和思考社会问题。适合从事教育、法律、公共服务等领域，为社会发展贡献力量。'},
{name:'🎨 艺术 & 设计',majors:['视觉传达','产品设计','环境设计','数字媒体','动画','建筑学','服装设计','音乐表演','美术学','影视制作'],desc:'你富有创造力和审美能力。适合从事设计、艺术、影视等领域，用想象力和才华表达自我。'},
{name:'🌍 语言 & 文史',majors:['汉语言文学','英语','历史学','考古学','翻译','新闻学','编辑出版','文化遗产','博物馆学','对外汉语'],desc:'你对语言和文化有深刻感知力。适合从事教育、出版、文化传播等领域，传承文明，沟通世界。'},
];

let scores=[0,0,0,0,0,0],qIdx=0,started=false;

function renderQuestion(){
const q=QUEST[qIdx];
const pct=Math.round((qIdx/QUEST.length)*100);
document.getElementById('quizArea').innerHTML=`
<div class="card">
<div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
<div class="question-card">
<div class="question-num">第 ${qIdx+1} / ${QUEST.length} 题</div>
<div class="question-text">${q.q}</div>
<div class="options" id="options">${q.o.map((o,i)=>`<button class="option" data-idx="${i}">${o.t}</button>`).join('')}</div>
</div>
</div>`;

document.getElementById('options').addEventListener('click',e=>{
if(!e.target.classList.contains('option'))return;
const idx=parseInt(e.target.dataset.idx);
q.o[idx].s.forEach((v,i)=>{scores[i]+=v;});
qIdx++;
if(qIdx>=QUEST.length)showResult();
else setTimeout(renderQuestion,200);
});
}

function showResult(){
let maxIdx=0;
for(let i=1;i<scores.length;i++)if(scores[i]>scores[maxIdx])maxIdx=i;
const c=CATEGORIES[maxIdx];
const sorted=scores.map((s,i)=>({s,idx:i})).sort((a,b)=>b.s-a.s);

document.getElementById('quizArea').innerHTML=`
<div class="card result-card">
<div class="result-icon">${c.name.slice(0,2)}</div>
<div class="result-title">${c.name}</div>
<div class="result-desc">${c.desc}</div>
<div class="result-majors">
<h4>📋 推荐专业方向</h4>
<div>${c.majors.map(m=>`<span class="major-tag">${m}</span>`).join('')}</div>
</div>
<div style="margin-top:8px;font-size:.8rem;color:var(--text2)">
匹配度：${Math.round(sorted[0].s/sorted.reduce((a,b)=>a+b.s,0)*100)}%<br>
</div>
<button class="btn btn-secondary" onclick="location.reload()">🔄 重新测试</button>
</div>`;
}

renderQuestion();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
