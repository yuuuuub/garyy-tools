<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAML 格式化工具 | YAML Formatter</title>
<meta property="og:title" content="YAML 格式化工具 | YAML Formatter">
<meta property="og:description" content="YAML 格式化工具 | YAML Formatter - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="YAML格式化美化压缩工具，支持格式化、压缩、验证、JSON互转">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<script src="../i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--cyan:#39d2c0;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--cyan:#0598bc}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;padding:16px}
.container{max-width:1200px;margin:0 auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{text-align:center;color:var(--text-secondary);font-size:.85rem;margin-bottom:20px}
.toolbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.82rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:calc(100vh - 200px)}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:8px 12px;border-bottom:1px solid var(--border);font-size:.8rem;color:var(--text-secondary);display:flex;justify-content:space-between;align-items:center}
textarea.code-input{width:100%;flex:1;min-height:400px;padding:12px;border:none;background:var(--bg);color:var(--text);font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.6;resize:none;outline:none;tab-size:2}
.output-area{flex:1;overflow:auto;padding:12px;font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.6;min-height:400px;white-space:pre-wrap;word-break:break-all}
.error-msg{color:var(--red);font-size:.85rem;padding:12px;background:var(--red-bg);border:1px solid var(--red);border-radius:var(--radius-sm);margin-bottom:12px;display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 20px;border-radius:var(--radius);font-size:.85rem;opacity:0;transition:.3s;z-index:100}
.toast.show{opacity:1}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--bg-secondary);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>📝 YAML 格式化工具</h1>
<p class="sub">YAML美化、压缩、验证、JSON互转</p>
<div id="error" class="error-msg"></div>
<div class="toolbar">
<button class="btn btn-primary" onclick="formatYAML()">美化</button>
<button class="btn" onclick="minifyYAML()">压缩</button>
<button class="btn" onclick="validateYAML()">验证</button>
<div class="sep"></div>
<button class="btn" onclick="yamlToJson()">YAML→JSON</button>
<button class="btn" onclick="jsonToYaml()">JSON→YAML</button>
<div class="sep"></div>
<button class="btn btn-green" onclick="copyOutput()">复制</button>
<button class="btn" onclick="loadSample()">示例</button>
<button class="btn" onclick="clearAll()">清空</button>
</div>
<div class="layout">
<div class="panel">
<div class="panel-header"><span>输入 YAML</span></div>
<textarea class="code-input" id="input" placeholder="在此粘贴YAML代码..."></textarea>
</div>
<div class="panel">
<div class="panel-header"><span>输出</span></div>
<div class="output-area" id="output"><span style="color:var(--text-secondary)">点击"美化"格式化YAML</span></div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
function showError(msg){var e=document.getElementById('error');e.textContent=msg;e.style.display='block';setTimeout(function(){e.style.display='none'},5000)}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function parseYAML(text){
var lines=text.split('\n');
var result={};var stack=[{obj:result,indent:-1}];
lines.forEach(function(line){
if(!line.trim()||line.trim().charAt(0)==='#')return;
var indent=line.search(/\S/);
var content=line.trim();
while(stack.length>1&&stack[stack.length-1].indent>=indent)stack.pop();
var parent=stack[stack.length-1].obj;
var colonIdx=content.indexOf(':');
if(colonIdx>-1){
var key=content.substring(0,colonIdx).trim().replace(/^["']|["']$/g,'');
var val=content.substring(colonIdx+1).trim();
if(!val||val===''){
var newObj={};
if(Array.isArray(parent))parent.push(newObj);
else parent[key]=newObj;
stack.push({obj:newObj,indent:indent});
}else{
if(val==='true')parent[key]=true;
else if(val==='false')parent[key]=false;
else if(val==='null'||val==='~')parent[key]=null;
else if(!isNaN(val))parent[key]=Number(val);
else if((val.charAt(0)==='"'&&val.charAt(val.length-1)==='"')||(val.charAt(0)==="'"&&val.charAt(val.length-1)==="'"))parent[key]=val.slice(1,-1);
else parent[key]=val;
}
}else if(content.charAt(0)==='-'){
var item=content.substring(1).trim();
var parentArr;
var lastKey=Object.keys(parent).pop();
if(lastKey&&Array.isArray(parent[lastKey]))parentArr=parent[lastKey];
else{parentArr=[];if(lastKey)parent[lastKey]=parentArr;else if(Array.isArray(parent))parentArr=parent;}
if(!item){var newObj={};parentArr.push(newObj);stack.push({obj:newObj,indent:indent});}
else if(item.indexOf(':')>-1){
var ci=item.indexOf(':');var k=item.substring(0,ci).trim().replace(/^["']|["']$/g,'');var v=item.substring(ci+1).trim();
var o={};parentArr.push(o);
if(!v)o[k]=true;
else if(v==='true')o[k]=true;else if(v==='false')o[k]=false;
else if(!isNaN(v))o[k]=Number(v);else o[k]=v.replace(/^["']|["']$/g,'');
stack.push({obj:o,indent:indent});
}else{parentArr.push(item.replace(/^["']|["']$/g,''));}
}
});
return result;
}
function yamlToObj(text){return parseYAML(text)}
function objToYaml(obj,indent){
indent=indent||0;
var pad='  '.repeat(indent);var result='';
if(Array.isArray(obj)){
obj.forEach(function(item){
if(typeof item==='object'&&item!==null&&!Array.isArray(item)){
var keys=Object.keys(item);
if(keys.length===1&&typeof item[keys[0]]==='object'){
result+=pad+'- '+keys[0]+':\n'+objToYaml(item[keys[0]],indent+2);
}else{
result+=pad+'- '+keys.map(function(k){return k+': '+yamlValue(item[k])}).join('\n'+pad+'  ')+'\n';
}
}else{result+=pad+'- '+yamlValue(item)+'\n';}
});
}else if(typeof obj==='object'&&obj!==null){
Object.keys(obj).forEach(function(key){
var val=obj[key];
if(typeof val==='object'&&val!==null){
result+=pad+key+':\n'+objToYaml(val,indent+1);
}else{result+=pad+key+': '+yamlValue(val)+'\n';}
});
}
return result;
}
function yamlValue(v){
if(v===null)return 'null';
if(typeof v==='boolean')return v?'true':'false';
if(typeof v==='number')return String(v);
if(typeof v==='string'){
if(v.indexOf(':')>-1||v.indexOf('#')>-1||v.indexOf('\n')>-1||v.trim()===''||v==='true'||v==='false'||v==='null'||!isNaN(v))return '"'+v.replace(/"/g,'\\"')+'"';
return v;
}
return String(v);
}
function formatYAML(){
var text=document.getElementById('input').value.trim();
if(!text){showError('请输入YAML数据');return;}
try{
var obj=yamlToObj(text);
var result=objToYaml(obj);
document.getElementById('output').textContent=result;
document.getElementById('error').style.display='none';
}catch(e){showError('YAML解析错误: '+e.message)}
}
function minifyYAML(){
var text=document.getElementById('input').value.trim();
if(!text){showError('请输入YAML数据');return;}
try{
var obj=yamlToObj(text);
var result=objToYaml(obj).replace(/\n\s*\n/g,'\n').trim();
document.getElementById('output').textContent=result;
document.getElementById('error').style.display='none';
}catch(e){showError('YAML解析错误: '+e.message)}
}
function validateYAML(){
var text=document.getElementById('input').value.trim();
if(!text){showError('请输入YAML数据');return;}
try{yamlToObj(text);toast('YAML格式正确 ✓');document.getElementById('error').style.display='none';}
catch(e){showError('YAML解析错误: '+e.message)}
}
function yamlToJson(){
var text=document.getElementById('input').value.trim();
if(!text){showError('请输入YAML数据');return;}
try{
var obj=yamlToObj(text);
document.getElementById('output').textContent=JSON.stringify(obj,null,2);
document.getElementById('error').style.display='none';
}catch(e){showError('YAML解析错误: '+e.message)}
}
function jsonToYaml(){
var text=document.getElementById('input').value.trim();
if(!text){showError('请输入JSON数据');return;}
try{
var obj=JSON.parse(text);
document.getElementById('output').textContent=objToYaml(obj);
document.getElementById('error').style.display='none';
}catch(e){showError('JSON解析错误: '+e.message)}
}
function loadSample(){
document.getElementById('input').value='name: 张三\nage: 25\nskills:\n  - JavaScript\n  - Python\n  - Go\naddress:\n  city: 北京\n  district: 海淀\nactive: true\nconfig: null';
formatYAML();
}
function clearAll(){document.getElementById('input').value='';document.getElementById('output').innerHTML='';document.getElementById('error').style.display='none'}
function copyOutput(){navigator.clipboard.writeText(document.getElementById('output').textContent).then(function(){toast('已复制到剪贴板')})}
</script>
</body>
</html>
