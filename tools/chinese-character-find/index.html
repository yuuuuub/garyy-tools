<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字查找</title><meta name="description" content="汉字查找 - 在线查找汉字"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.find-area{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:16px 0}.find-item{padding:12px;background:var(--bg);border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;text-align:center;font-size:1.5rem}.find-item:hover{border-color:var(--blue)}.find-item.found{border-color:var(--green);background:rgba(35,134,54,.1)}.find-item.highlighted{border-color:var(--yellow);background:rgba(245,158,11,.1)}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}.score-display{font-size:1.2rem;margin:16px 0}.timer{font-size:2rem;font-weight:700;color:var(--blue);margin:16px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字查找"><meta property="og:description" content="汉字查找 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔍 汉字查找</h1><p class="sub">在线查找汉字</p>
<div class="card">
<div class="btn-group">
<button class="btn" onclick="startFind()">开始游戏</button>
<button class="btn" onclick="nextRound()">下一轮</button>
<button class="btn" onclick="showAnswer()">查看答案</button>
</div>
<div class="score-display" id="scoreDisplay"></div>
<div class="timer" id="timer"></div>
</div>
<div id="result"></div>
<div class="card" id="historyCard" style="display:none">
<h3 style="margin-bottom:16px">游戏记录</h3>
<div id="history" style="padding:12px;background:var(--bg);border-radius:8px"></div>
</div></div>
<script src="../i18n.js" defer></script>
<script>
var characters=[
  {char:'一',pinyin:'yī'},
  {char:'二',pinyin:'èr'},
  {char:'三',pinyin:'sān'},
  {char:'四',pinyin:'sì'},
  {char:'五',pinyin:'wǔ'},
  {char:'六',pinyin:'liù'},
  {char:'七',pinyin:'qī'},
  {char:'八',pinyin:'bā'},
  {char:'九',pinyin:'jiǔ'},
  {char:'十',pinyin:'shí'},
  {char:'大',pinyin:'dà'},
  {char:'小',pinyin:'xiǎo'},
  {char:'多',pinyin:'duō'},
  {char:'少',pinyin:'shǎo'},
  {char:'上',pinyin:'shàng'},
  {char:'下',pinyin:'xià'},
  {char:'左',pinyin:'zuǒ'},
  {char:'右',pinyin:'yòu'},
  {char:'前',pinyin:'qián'},
  {char:'后',pinyin:'hòu'},
  {char:'东',pinyin:'dōng'},
  {char:'西',pinyin:'xī'},
  {char:'南',pinyin:'nán'},
  {char:'北',pinyin:'běi'},
  {char:'天',pinyin:'tiān'},
  {char:'地',pinyin:'dì'},
  {char:'人',pinyin:'rén'},
  {char:'口',pinyin:'kǒu'},
  {char:'日',pinyin:'rì'},
  {char:'月',pinyin:'yuè'},
  {char:'水',pinyin:'shuǐ'},
  {char:'火',pinyin:'huǒ'},
  {char:'木',pinyin:'mù'},
  {char:'金',pinyin:'jīn'},
  {char:'土',pinyin:'tǔ'}
];
var currentTarget=null;
var foundCount=0;
var totalTargets=5;
var score=0;
var total=0;
var history=[];
var timer=null;
var timeLeft=30;
function startFind(){
  score=0;
  total=0;
  history=[];
  nextRound();
}
function nextRound(){
  clearInterval(timer);
  timeLeft=30;
  updateTimer();
  timer=setInterval(function(){
    timeLeft--;
    updateTimer();
    if(timeLeft<=0){
      clearInterval(timer);
      total++;
      history.push({target:currentTarget.char,found:foundCount,total:totalTargets,time:30});
      updateHistory();
      alert('⏰ 时间到！找到 '+foundCount+'/'+totalTargets+' 个');
    }
  },1000);
  var selectedCharacters=[];
  while(selectedCharacters.length<32){
    var randomChar=characters[Math.floor(Math.random()*characters.length)];
    if(!selectedCharacters.some(function(sc){return sc.char===randomChar.char;})){
      selectedCharacters.push(randomChar);
    }
  }
  var targetIndex=Math.floor(Math.random()*selectedCharacters.length);
  currentTarget=selectedCharacters[targetIndex];
  foundCount=0;
  var html='<div class="card">';
  html+='<div style="text-align:center;margin-bottom:16px">';
  html+='<div style="font-size:1.1rem;color:var(--text2)">请找到所有 <strong style="color:var(--blue)">'+currentTarget.char+'</strong> ('+currentTarget.pinyin+')</div>';
  html+='<div style="font-size:1rem;margin-top:8px">已找到：<strong style="color:var(--green)">'+foundCount+'</strong>/'+totalTargets+'</div>';
  html+='</div>';
  html+='<div class="find-area">';
  selectedCharacters.forEach(function(char,index){
    html+='<div class="find-item" onclick="findChar('+index+',\''+char.char+'\')">'+char.char+'</div>';
  });
  html+='</div></div>';
  document.getElementById('result').innerHTML=html;
}
function findChar(index,char){
  if(char===currentTarget.char){
    foundCount++;
    var items=document.querySelectorAll('.find-item');
    items[index].classList.add('found');
    updateFoundCount();
    if(foundCount>=totalTargets){
      clearInterval(timer);
      total++;
      score++;
      history.push({target:currentTarget.char,found:foundCount,total:totalTargets,time:30-timeLeft});
      updateScore();
      updateHistory();
      setTimeout(function(){
        alert('🎉 找到所有 '+currentTarget.char+'！用时 '+(30-timeLeft)+' 秒');
      },300);
    }
  }else{
    var items=document.querySelectorAll('.find-item');
    items[index].classList.add('highlighted');
    setTimeout(function(){
      items[index].classList.remove('highlighted');
    },500);
  }
}
function updateFoundCount(){
  var items=document.querySelectorAll('.find-item');
  var count=0;
  items.forEach(function(item){
    if(item.textContent===currentTarget.char&&item.classList.contains('found')){
      count++;
    }
  });
  document.querySelector('.card div div').innerHTML='<div style="font-size:1.1rem;color:var(--text2)">请找到所有 <strong style="color:var(--blue)">'+currentTarget.char+'</strong> ('+currentTarget.pinyin+')</div><div style="font-size:1rem;margin-top:8px">已找到：<strong style="color:var(--green)">'+count+'</strong>/'+totalTargets+'</div>';
}
function showAnswer(){
  if(!currentTarget)return;
  var items=document.querySelectorAll('.find-item');
  items.forEach(function(item){
    if(item.textContent===currentTarget.char){
      item.classList.add('found');
    }
  });
}
function updateTimer(){
  document.getElementById('timer').textContent=timeLeft+'秒';
  var timerElement=document.getElementById('timer');
  if(timeLeft<=5)timerElement.style.color='var(--red)';
  else if(timeLeft<=10)timerElement.style.color='var(--blue)';
  else timerElement.style.color='var(--green)';
}
function updateScore(){
  var percentage=Math.round(score/total*100);
  document.getElementById('scoreDisplay').innerHTML='得分：'+score+'/'+total+' ('+percentage+'%)';
}
function updateHistory(){
  if(history.length===0){
    document.getElementById('historyCard').style.display='none';
    return;
  }
  document.getElementById('historyCard').style.display='block';
  var html='';
  history.forEach(function(item){
    html+='<div style="padding:8px;margin-bottom:4px;background:rgba(35,134,54,.1);border-radius:4px">';
    html+='<strong>'+item.target+'</strong> | 找到：'+item.found+'/'+item.total+' | 用时：'+item.time+'秒';
    html+='</div>';
  });
  document.getElementById('history').innerHTML=html;
}
function shuffleArray(array){
  for(var i=array.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var temp=array[i];
    array[i]=array[j];
    array[j]=temp;
  }
  return array;
}
startFind();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
