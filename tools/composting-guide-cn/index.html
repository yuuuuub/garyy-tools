<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>堆肥指南</title>
<meta property="og:title" content="堆肥指南">
<meta property="og:description" content="堆肥指南 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="厨余堆肥全攻略，从零开始学习有机堆肥，变废为宝">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#22c55e;--accent2:#16a34a;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#1a7f37;--accent2:#116329;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;margin-right:4px}
.tag.g{background:var(--accent);color:#fff}.tag.w{background:var(--warn);color:#fff}.tag.r{background:var(--danger);color:#fff}
.li{padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.item-card{padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;text-align:center}
.item-card .emoji{font-size:2rem;margin-bottom:8px}
.item-card .name{font-size:.95rem;font-weight:600}
.item-card .cat{font-size:.8rem;color:var(--text2);margin-top:4px}
.progress-bar{width:100%;height:12px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:8px}
.progress-bar .fill{height:100%;border-radius:6px;transition:width .5s}
.tip-box{padding:12px;background:var(--bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;margin-top:12px;font-size:.85rem;color:var(--text2)}
.hidden{display:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>♻️ 堆肥指南</h1><p>厨余堆肥全攻略 · 变废为宝</p></div>

<div class="cd">
<h2>堆肥材料分类</h2>
<p style="font-size:.85rem;color:var(--text2);margin-bottom:12px">了解哪些可以堆肥，哪些不可以</p>
<div class="grid3" id="materialGrid"></div>
</div>

<div class="cd">
<h2>添加堆肥记录</h2>
<div class="fr">
<div><label>材料名称</label><input type="text" id="mName" placeholder="如：苹果皮"></div>
<div><label>类别</label><select id="mCat"><option>绿色材料(氮)</option><option>棕色材料(碳)</option><option>不宜堆肥</option></select></div>
</div>
<div class="fr">
<div><label>重量(kg)</label><input type="number" id="mWeight" placeholder="重量" step="0.1"></div>
<div><label>日期</label><input type="text" id="mDate" placeholder="YYYY-MM-DD"></div>
</div>
<div class="bg"><button onclick="addRecord()">添加记录</button></div>
</div>

<div class="cd">
<h2>堆肥进度</h2>
<div id="progressSection">
  <div style="display:flex;justify-content:space-between;font-size:.85rem"><span>堆肥进度</span><span id="progressPct">0%</span></div>
  <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%;background:var(--accent)"></div></div>
  <div style="display:flex;gap:16px;margin-top:12px;font-size:.85rem;color:var(--text2)">
    <span>🟢 绿色材料：<strong id="greenCount">0</strong>kg</span>
    <span>🟤 棕色材料：<strong id="brownCount">0</strong>kg</span>
  </div>
</div>
<div class="tip-box">💡 理想碳氮比为 25:1 ~ 30:1，即棕色材料与绿色材料约 3:1 的比例</div>
</div>

<div class="cd">
<h2>堆肥记录</h2>
<div id="recordList" class="es">暂无记录</div>
</div>

<div class="cd">
<h2>堆肥阶段指南</h2>
<div id="stagesGuide"></div>
</div>

<div class="cd">
<h2>常见问题</h2>
<div id="faqList"></div>
</div>
</div>

<script>
const DB='composting_guide_db';
let records=JSON.parse(localStorage.getItem(DB)||'[]');

const MATERIALS=[
  {name:'苹果皮',cat:'green',emoji:'🍎'},{name:'香蕉皮',cat:'green',emoji:'🍌'},{name:'菜叶',cat:'green',emoji:'🥬'},
  {name:'咖啡渣',cat:'green',emoji:'☕'},{name:'茶渣',cat:'green',emoji:'🍵'},{name:'蛋壳',cat:'green',emoji:'🥚'},
  {name:'玉米芯',cat:'brown',emoji:'🌽'},{name:'落叶',cat:'brown',emoji:'🍂'},{name:'纸板',cat:'brown',emoji:'📦'},
  {name:'锯末',cat:'brown',emoji:'🪵'},{name:'干草',cat:'brown',emoji:'🌾'},{name:'枯枝',cat:'brown',emoji:'🪵'},
  {name:'肉类',cat:'no',emoji:'🥩'},{name:'油脂',cat:'no',emoji:'🫗'},{name:'乳制品',cat:'no',emoji:'🧀'},
  {name:'塑料',cat:'no',emoji:'🚫'},{name:'金属',cat:'no',emoji:'🚫'},{name:'病株',cat:'no',emoji:'🚫'},
];

const STAGES=[
  {name:'初始阶段',days:'1-7天',desc:'材料混合，开始分解',color:'var(--warn)',icon:'🟡'},
  {name:'升温阶段',days:'7-14天',desc:'温度升至50-70℃，微生物活跃',color:'var(--danger)',icon:'🔴'},
  {name:'高温阶段',days:'14-30天',desc:'持续高温杀灭病菌和杂草种子',color:'var(--danger)',icon:'🔥'},
  {name:'降温阶段',days:'30-60天',desc:'温度逐渐下降，蚯蚓开始出现',color:'var(--accent)',icon:'🟢'},
  {name:'腐熟阶段',days:'60-90天',desc:'材料变为深褐色，有泥土清香',color:'var(--accent)',icon:'✅'},
];

const FAQS=[
  {q:'堆肥发臭怎么办？',a:'通常是氮材料过多或缺氧导致。添加棕色材料（落叶、纸板）并翻堆通气即可改善。'},
  {q:'堆肥太慢怎么办？',a:'将材料切碎、保持适当湿度（拧不出水的程度）、定期翻堆可加速分解。'},
  {q:'堆肥有虫子正常吗？',a:'蚯蚓、黑水虻等是正常现象，有助于分解。若苍蝇过多，可覆盖一层棕色材料。'},
  {q:'多久可以使用？',a:'一般2-3个月，材料变为深褐色、松散、有泥土味道即可使用。'},
  {q:'堆肥可以种什么？',a:'适合大多数植物，建议与土壤混合使用，比例约1:3。新堆肥用量减半。'},
];

function initMaterials(){
  const el=document.getElementById('materialGrid');
  el.innerHTML=MATERIALS.map(m=>{
    const catLabel=m.cat==='green'?'🟢 绿色':m.cat==='brown'?'🟤 棕色':'🔴 不宜';
    const catClass=m.cat==='green'?'g':m.cat==='brown'?'w':'r';
    return`<div class="item-card"><div class="emoji">${m.emoji}</div><div class="name">${m.name}</div><div class="cat"><span class="tag ${catClass}">${catLabel}</span></div></div>`;
  }).join('');
}

function initStages(){
  document.getElementById('stagesGuide').innerHTML=STAGES.map(s=>`
    <div class="li" style="display:flex;gap:12px;align-items:flex-start">
      <span style="font-size:1.5rem">${s.icon}</span>
      <div><strong>${s.name}</strong><span class="tag w" style="margin-left:8px">${s.days}</span><div style="font-size:.85rem;color:var(--text2);margin-top:4px">${s.desc}</div></div>
    </div>`).join('');
}

function initFAQ(){
  document.getElementById('faqList').innerHTML=FAQS.map(f=>`
    <div class="li"><div style="font-weight:600;margin-bottom:4px">${f.q}</div><div style="font-size:.85rem;color:var(--text2)">${f.a}</div></div>`).join('');
}

function addRecord(){
  const name=document.getElementById('mName').value.trim();
  const cat=document.getElementById('mCat').value;
  const weight=parseFloat(document.getElementById('mWeight').value)||0;
  const date=document.getElementById('mDate').value||new Date().toLocaleDateString();
  if(!name)return alert('请输入材料名称');
  records.push({name,cat,weight,date,id:Date.now()});
  localStorage.setItem(DB,JSON.stringify(records));
  ['mName','mWeight'].forEach(id=>document.getElementById(id).value='');
  renderRecords();updateProgress();
}

function renderRecords(){
  const el=document.getElementById('recordList');
  if(!records.length){el.innerHTML='<div class="es">暂无记录</div>';return}
  el.innerHTML=records.map((r,i)=>{
    const catLabel=r.cat.includes('绿色')?'g':r.cat.includes('棕色')?'w':'r';
    const catEmoji=r.cat.includes('🟢')?'🟢':r.cat.includes('🟤')?'🟤':'🔴';
    return`<div class="li" style="display:flex;justify-content:space-between;align-items:center">
      <div><span class="tag ${catLabel}">${catEmoji} ${r.cat.split('(')[0]}</span> <strong>${r.name}</strong> <span style="font-size:.85rem;color:var(--text2)">${r.weight}kg · ${r.date}</span></div>
      <button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="records.splice(${i},1);localStorage.setItem('${DB}',JSON.stringify(records));renderRecords();updateProgress()">删除</button>
    </div>`}).reverse().join('');
}

function updateProgress(){
  const green=records.filter(r=>r.cat.includes('绿色')).reduce((s,r)=>s+r.weight,0);
  const brown=records.filter(r=>r.cat.includes('棕色')).reduce((s,r)=>s+r.weight,0);
  document.getElementById('greenCount').textContent=green.toFixed(1);
  document.getElementById('brownCount').textContent=brown.toFixed(1);
  const total=green+brown;
  const ratio=brown>0&&green>0?brown/green:0;
  const idealRatio=3;
  const pct=total>0?Math.min(100,Math.round((Math.min(ratio,idealRatio)/idealRatio)*100)):0;
  document.getElementById('progressPct').textContent=pct+'%';
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressFill').style.background=pct>=80?'var(--accent)':pct>=40?'var(--warn)':'var(--danger)';
}

initMaterials();initStages();initFAQ();renderRecords();updateProgress();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
