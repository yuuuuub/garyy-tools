<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>病虫害识别</title>
<meta property="og:title" content="病虫害识别">
<meta property="og:description" content="病虫害识别 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="常见植物病虫害图鉴与防治方案，拍照识别、症状匹配、用药指南">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐛</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#f59e0b;--accent2:#d97706;--success:#22c55e;--warn:#3b82f6;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#9a6700;--accent2:#7c5e00;--success:#1a7f37;--warn:#0969da;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;margin-right:4px}
.tag.g{background:var(--accent);color:#fff}.tag.w{background:var(--warn);color:#fff}.tag.r{background:var(--danger);color:#fff}
.li{padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pest-card{padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s}
.pest-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.pest-card .emoji{font-size:2rem;margin-bottom:8px}
.pest-card .name{font-size:1rem;font-weight:600}
.pest-card .type{font-size:.8rem;color:var(--text2);margin-top:4px}
.symptom-check{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.symptom-chip{padding:6px 14px;border:1px solid var(--border);border-radius:20px;font-size:.85rem;cursor:pointer;transition:all .2s;background:var(--bg)}
.symptom-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.result-box{padding:16px;background:var(--bg);border-radius:8px;margin-top:12px;border-left:3px solid var(--accent)}
.severity{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
.severity.high{background:var(--danger);color:#fff}
.severity.mid{background:var(--warn);color:#fff}
.severity.low{background:var(--success);color:#fff}
.hidden{display:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🐛 病虫害识别</h1><p>症状匹配 · 诊断分析 · 防治方案</p></div>

<div class="cd">
<h2>症状选择</h2>
<p style="font-size:.85rem;color:var(--text2);margin-bottom:8px">选择你观察到的症状，系统将智能匹配可能的病虫害</p>
<div class="symptom-check" id="symptomCheck"></div>
<button onclick="diagnose()" style="margin-top:12px">🔍 诊断分析</button>
<div id="diagResult"></div>
</div>

<div class="cd">
<h2>病虫害图鉴</h2>
<input type="text" id="searchInput" placeholder="🔍 搜索病虫害..." oninput="filterPests()">
<div class="grid3" id="pestGrid" style="margin-top:12px"></div>
</div>

<div class="cd">
<h2>防治日志</h2>
<div class="fr">
<div><label>病虫害名称</label><input type="text" id="logName" placeholder="如：蚜虫"></div>
<div><label>防治方法</label><select id="logMethod"><option>物理防治</option><option>生物防治</option><option>化学防治</option><option>综合防治</option></select></div>
</div>
<label>详情</label><input type="text" id="logDetail" placeholder="用药名称、浓度等">
<div class="bg"><button onclick="addLog()">记录防治</button></div>
<div id="logList" class="es" style="margin-top:12px">暂无记录</div>
</div>
</div>

<div id="detailModal" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
<div class="modal" id="detailContent"></div>
</div>

<script>
const DB='pest_identifier_db';
let logs=JSON.parse(localStorage.getItem(DB)||'[]');

const PESTS=[
  {name:'蚜虫',type:'害虫',emoji:'🐛',severity:'mid',symptoms:['叶片卷曲','嫩梢发黄','蜜露分泌','叶片粘腻'],
   damage:'吸食汁液，传播病毒',prevention:'黄板诱杀、瓢虫天敌、吡虫啉喷施',
   plants:'月季、蔷薇、十字花科蔬菜',season:'春秋高发'},
  {name:'白粉虱',type:'害虫',emoji:'🦟',severity:'mid',symptoms:['叶片白色粉状','叶片褪绿','蜜露煤污'],
   damage:'吸食汁液，诱发煤污病',prevention:'黄板、噻虫嗪、生物农药',
   plants:'番茄、黄瓜、花卉',season:'夏秋高发'},
  {name:'红蜘蛛',type:'害虫',emoji:'🔴',severity:'high',symptoms:['叶片失绿','叶背红点','丝网','叶片干枯'],
   damage:'吸食叶绿素，严重时整株死亡',prevention:'阿维菌素、增加湿度、清除杂草',
   plants:'月季、多肉、果树',season:'干旱季节'},
  {name:'白粉病',type:'病害',emoji:'⚪',severity:'mid',symptoms:['叶片白色粉层','叶片卷曲','生长受阻'],
   damage:'影响光合作用，削弱植株',prevention:'三唑酮、嘧菌酯、改善通风',
   plants:'月季、南瓜、豌豆',season:'春秋多湿'},
  {name:'黑斑病',type:'病害',emoji:'⚫',severity:'high',symptoms:['叶片黑色斑点','叶片黄化脱落','斑点有轮纹'],
   damage:'导致大量落叶，影响开花',prevention:'甲基托布津、清除病叶、改善通风',
   plants:'月季、蔷薇',season:'雨季'},
  {name:'根腐病',type:'病害',emoji:'🪦',severity:'high',symptoms:['植株萎蔫','根部发黑','叶片下垂','生长停滞'],
   damage:'根系腐烂，严重时整株死亡',prevention:'改善排水、多菌灵灌根、避免积水',
   plants:'多肉、兰花、蔬菜',season:'梅雨季节'},
  {name:'介壳虫',type:'害虫',emoji:'🪲',severity:'mid',symptoms:['茎叶白色蜡质','叶片发黄','蜜露煤污'],
   damage:'吸食汁液，传播病害',prevention:'酒精棉擦拭、螺虫乙酯、物理刮除',
   plants:'多肉、兰花、柑橘',season:'全年'},
  {name:'潜叶蝇',type:'害虫',emoji:'🪰',severity:'low',symptoms:['叶片白色隧道','叶片花纹','叶片干枯'],
   damage:'幼虫蛀食叶肉',prevention:'黄色粘虫板、灭蝇胺、摘除病叶',
   plants:'番茄、韭菜、菊花',season:'春夏'},
  {name:'锈病',type:'病害',emoji:'🟤',severity:'mid',symptoms:['叶片锈色孢子','叶片橙色斑','叶片枯萎'],
   damage:'影响光合和观赏性',prevention:'三唑类杀菌剂、清除病残体、抗病品种',
   plants:'菊花、月季、豆类',season:'春秋'},
  {name:'蜗牛',type:'害虫',emoji:'🐌',severity:'low',symptoms:['叶片孔洞','银色痕迹','夜间活动'],
   damage:'啃食嫩叶和花朵',prevention:'啤酒诱杀、四聚乙醛、清除杂草',
   plants:'蔬菜、草莓、花卉',season:'雨季'},
  {name:'蓟马',type:'害虫',emoji:'🪳',severity:'mid',symptoms:['叶片银灰斑','花朵畸形','生长点变形'],
   damage:'吸食嫩叶汁液，传播病毒',prevention:'蓝色粘虫板、吡虫啉、乙基多杀菌素',
   plants:'辣椒、番茄、兰花',season:'温暖干燥'},
  {name:'病毒病',type:'病害',emoji:'🦠',severity:'high',symptoms:['叶片花叶','植株矮化','果实畸形','叶片皱缩'],
   damage:'系统性感染，无法治愈',prevention:'拔除病株、防治传毒昆虫、抗病品种',
   plants:'番茄、辣椒、烟草',season:'全年'},
];

const ALL_SYMPTOMS=[...new Set(PESTS.flatMap(p=>p.symptoms))].sort();
let selectedSymptoms=[];

function initSymptoms(){
  const el=document.getElementById('symptomCheck');
  el.innerHTML=ALL_SYMPTOMS.map(s=>`<div class="symptom-chip" onclick="toggleSymptom('${s}',this)">${s}</div>`).join('');
}

function toggleSymptom(s,el){
  if(selectedSymptoms.includes(s)){selectedSymptoms=selectedSymptoms.filter(x=>x!==s);el.classList.remove('active')}
  else{selectedSymptoms.push(s);el.classList.add('active')}
}

function diagnose(){
  if(!selectedSymptoms.length){document.getElementById('diagResult').innerHTML='<div class="result-box" style="border-color:var(--warn)">请先选择至少一个症状</div>';return}
  const scored=PESTS.map(p=>{
    const match=selectedSymptoms.filter(s=>p.symptoms.includes(s)).length;
    return{...p,match,score:match/p.symptoms.length};
  }).filter(p=>p.match>0).sort((a,b)=>b.score-a.score||b.match-a.match);
  if(!scored.length){document.getElementById('diagResult').innerHTML='<div class="result-box">未匹配到相关病虫害，请尝试其他症状组合</div>';return}
  document.getElementById('diagResult').innerHTML=scored.map(p=>`
    <div class="result-box" style="margin-top:8px;cursor:pointer" onclick="showDetail('${p.name}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span><strong>${p.emoji} ${p.name}</strong> <span class="tag ${p.type==='害虫'?'r':'g'}">${p.type}</span></span>
        <span class="severity ${p.severity}">${p.severity==='high'?'高危':p.severity==='mid'?'中等':'低危'}</span>
      </div>
      <div style="font-size:.85rem;color:var(--text2);margin-top:4px">匹配度 ${Math.round(p.score*100)}% | 匹配症状：${p.symptoms.filter(s=>selectedSymptoms.includes(s)).join('、')}</div>
      <div style="font-size:.85rem;margin-top:4px">防治：${p.prevention.split('、')[0]}</div>
    </div>`).join('');
}

function renderPests(filter=''){
  const el=document.getElementById('pestGrid');
  const filtered=PESTS.filter(p=>!filter||p.name.includes(filter)||p.type.includes(filter));
  el.innerHTML=filtered.map(p=>`
    <div class="pest-card" onclick="showDetail('${p.name}')">
      <div class="emoji">${p.emoji}</div>
      <div class="name">${p.name}</div>
      <div class="type"><span class="tag ${p.type==='害虫'?'r':'g'}">${p.type}</span> <span class="severity ${p.severity}">${p.severity==='high'?'高危':p.severity==='mid'?'中等':'低危'}</span></div>
    </div>`).join('');
}

function filterPests(){renderPests(document.getElementById('searchInput').value.trim())}

function showDetail(name){
  const p=PESTS.find(x=>x.name===name);if(!p)return;
  document.getElementById('detailContent').innerHTML=`
    <h2 style="margin-bottom:12px">${p.emoji} ${p.name}</h2>
    <div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag ${p.type==='害虫'?'r':'g'}">${p.type}</span><span class="severity ${p.severity}">${p.severity==='high'?'高危':p.severity==='mid'?'中等':'低危'}</span></div>
    <div style="margin-bottom:12px"><div style="font-weight:600;margin-bottom:4px">典型症状</div>${p.symptoms.map(s=>`<span class="tag w">${s}</span>`).join(' ')}</div>
    <div style="margin-bottom:12px"><div style="font-weight:600;margin-bottom:4px">危害</div><div style="font-size:.9rem;color:var(--text2)">${p.damage}</div></div>
    <div style="margin-bottom:12px"><div style="font-weight:600;margin-bottom:4px">防治方法</div><div style="font-size:.9rem;color:var(--text2)">${p.prevention}</div></div>
    <div style="margin-bottom:12px"><div style="font-weight:600;margin-bottom:4px">易感植物</div><div style="font-size:.9rem;color:var(--text2)">${p.plants}</div></div>
    <div><div style="font-weight:600;margin-bottom:4px">高发季节</div><div style="font-size:.9rem;color:var(--text2)">${p.season}</div></div>
    <div class="bg" style="margin-top:16px"><button class="sec" onclick="closeModal()">关闭</button></div>`;
  document.getElementById('detailModal').classList.remove('hidden');
}
function closeModal(){document.getElementById('detailModal').classList.add('hidden')}

function addLog(){
  const name=document.getElementById('logName').value.trim();
  const method=document.getElementById('logMethod').value;
  const detail=document.getElementById('logDetail').value.trim();
  if(!name)return alert('请输入病虫害名称');
  logs.push({name,method,detail,date:new Date().toLocaleDateString(),id:Date.now()});
  localStorage.setItem(DB,JSON.stringify(logs));
  ['logName','logDetail'].forEach(id=>document.getElementById(id).value='');
  renderLogs();
}
function renderLogs(){
  const el=document.getElementById('logList');
  if(!logs.length){el.innerHTML='<div class="es">暂无记录</div>';return}
  el.innerHTML=logs.map((l,i)=>`<div class="li" style="display:flex;justify-content:space-between;align-items:center">
    <div><strong>${l.name}</strong> <span class="tag g">${l.method}</span><span style="font-size:.85rem;color:var(--text2);margin-left:8px">${l.detail} · ${l.date}</span></div>
    <button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="logs.splice(${i},1);localStorage.setItem('${DB}',JSON.stringify(logs));renderLogs()">删除</button>
  </div>`).reverse().join('');
}

initSymptoms();renderPests();renderLogs();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
