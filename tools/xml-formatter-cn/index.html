<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XML 格式化工具 | XML Formatter</title>
<meta property="og:title" content="XML 格式化工具 | XML Formatter">
<meta property="og:description" content="XML 格式化工具 | XML Formatter - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="XML格式化美化压缩工具，支持格式化、压缩、验证、树视图查看">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<script src="../i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--cyan:#39d2c0;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--cyan:#0598bc}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;padding:16px}
.container{max-width:1200px;margin:0 auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{text-align:center;color:var(--text-secondary);font-size:.85rem;margin-bottom:20px}
.toolbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.82rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.sep{width:1px;height:20px;background:var(--border);margin:0 4px}
select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);font-size:.8rem}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:calc(100vh - 200px)}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:8px 12px;border-bottom:1px solid var(--border);font-size:.8rem;color:var(--text-secondary);display:flex;justify-content:space-between;align-items:center}
textarea.code-input{width:100%;flex:1;min-height:400px;padding:12px;border:none;background:var(--bg);color:var(--text);font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.6;resize:none;outline:none;tab-size:2}
.output-area{flex:1;overflow:auto;padding:12px;font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.6;min-height:400px;white-space:pre-wrap;word-break:break-all}
.error-msg{color:var(--red);font-size:.85rem;padding:12px;background:var(--red-bg);border:1px solid var(--red);border-radius:var(--radius-sm);margin-bottom:12px;display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 20px;border-radius:var(--radius);font-size:.85rem;opacity:0;transition:.3s;z-index:100}
.toast.show{opacity:1}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--bg-secondary);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>📄 XML 格式化工具</h1>
<p class="sub">XML美化、压缩、验证、树视图查看</p>
<div id="error" class="error-msg"></div>
<div class="toolbar">
<button class="btn btn-primary" onclick="formatXML()">美化</button>
<button class="btn" onclick="minifyXML()">压缩</button>
<button class="btn" onclick="validateXML()">验证</button>
<div class="sep"></div>
<button class="btn" onclick="showTreeView()">树视图</button>
<button class="btn" onclick="showRaw()">原始视图</button>
<div class="sep"></div>
<select id="indentSize"><option value="2">2空格</option><option value="4">4空格</option><option value="tab">Tab</option></select>
<div class="sep"></div>
<button class="btn btn-green" onclick="copyOutput()">复制</button>
<button class="btn" onclick="loadSample()">示例</button>
<button class="btn" onclick="clearAll()">清空</button>
</div>
<div class="layout">
<div class="panel">
<div class="panel-header"><span>输入 XML</span></div>
<textarea class="code-input" id="input" placeholder="在此粘贴XML代码..."></textarea>
</div>
<div class="panel">
<div class="panel-header"><span>输出</span></div>
<div class="output-area" id="output"><span style="color:var(--text-secondary)">点击"美化"格式化XML</span></div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
function showError(msg){var e=document.getElementById('error');e.textContent=msg;e.style.display='block';setTimeout(function(){e.style.display='none'},5000)}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function getIndent(){var v=document.getElementById('indentSize').value;return v==='tab'?'\t':parseInt(v)}
function formatXML(){
var xml=document.getElementById('input').value.trim();
if(!xml){showError('请输入XML数据');return;}
try{
var parser=new DOMParser();
var doc=parser.parseFromString(xml,'text/xml');
var err=doc.querySelector('parsererror');
if(err){showError('XML解析错误: '+err.textContent.substring(0,200));return;}
var formatted=prettyPrint(doc.documentElement,0,getIndent());
document.getElementById('output').textContent='<?xml version="1.0" encoding="UTF-8"?>\n'+formatted;
document.getElementById('error').style.display='none';
}catch(e){showError('XML解析错误: '+e.message)}
}
function prettyPrint(node,level,indent){
var pad=Array(level*indent+1).join(indent===1?'\t':' ');
var padInner=Array((level+1)*indent+1).join(indent===1?'\t':' ');
var result='';
if(node.nodeType===3){var t=node.textContent.trim();return t;}
if(node.nodeType!==1)return '';
result+='<'+node.tagName;
var attrs=Array.from(node.attributes||[]);
attrs.forEach(function(a){result+=' '+a.name+'="'+a.value+'"'});
var kids=Array.from(node.childNodes).filter(function(n){return n.nodeType===1||n.nodeType===3});
if(!kids.length)return result+'/>';
if(kids.length===1&&kids[0].nodeType===3){
var text=kids[0].textContent.trim();
return result+'>'+text+'</'+node.tagName+'>';
}
result+='>\n';
kids.forEach(function(kid){
if(kid.nodeType===3){var t=kid.textContent.trim();if(t)result+=padInner+t+'\n';}
else if(kid.nodeType===1){result+=padInner+prettyPrint(kid,level+1,indent)+'\n';}
});
result+=pad+'</'+node.tagName+'>';
return result;
}
function minifyXML(){
var xml=document.getElementById('input').value.trim();
if(!xml){showError('请输入XML数据');return;}
try{
var parser=new DOMParser();
var doc=parser.parseFromString(xml,'text/xml');
if(doc.querySelector('parsererror')){showError('XML格式无效');return;}
var s=new XMLSerializer().serializeToString(doc);
s=s.replace(/>\s+</g,'><').replace(/\n\s*/g,'').trim();
document.getElementById('output').textContent=s;
document.getElementById('error').style.display='none';
}catch(e){showError(e.message)}
}
function validateXML(){
var xml=document.getElementById('input').value.trim();
if(!xml){showError('请输入XML数据');return;}
var parser=new DOMParser();
var doc=parser.parseFromString(xml,'text/xml');
var err=doc.querySelector('parsererror');
if(err){showError('XML无效: '+err.textContent.substring(0,200));}
else{toast('XML格式正确 ✓');document.getElementById('error').style.display='none';}
}
function showTreeView(){
var xml=document.getElementById('input').value.trim();
if(!xml){showError('请输入XML数据');return;}
try{
var parser=new DOMParser();
var doc=parser.parseFromString(xml,'text/xml');
if(doc.querySelector('parsererror')){showError('XML格式无效');return;}
document.getElementById('output').innerHTML=renderXMLTree(doc.documentElement,0);
document.getElementById('error').style.display='none';
}catch(e){showError(e.message)}
}
function renderXMLTree(node,level){
var pad='  '.repeat(level);
var tag=node.tagName;
var attrs=Array.from(node.attributes||[]).map(function(a){return ' <span style="color:var(--cyan)">'+a.name+'</span>="<span style="color:var(--text-secondary)">'+a.value+'</span>"'}).join('');
var kids=Array.from(node.childNodes).filter(function(n){return n.nodeType===1||n.nodeType===3});
if(!kids.length)return pad+'<span style="color:var(--accent)">&lt;'+tag+attrs+'&nbsp;/&gt;</span>';
var text='';
kids.forEach(function(k){if(k.nodeType===3)text+=k.textContent.trim()});
if(text&&!kids.some(function(k){return k.nodeType===1})){
return pad+'<span style="color:var(--accent)">&lt;'+tag+attrs+'&gt;</span><span style="color:var(--text)">'+text+'</span><span style="color:var(--accent)">&lt;/'+tag+'&gt;</span>';
}
var html=pad+'<span style="color:var(--accent)">&lt;'+tag+attrs+'&gt;</span>\n';
kids.forEach(function(kid){
if(kid.nodeType===1)html+=renderXMLTree(kid,level+1)+'\n';
else if(kid.nodeType===3){var t=kid.textContent.trim();if(t)html+=pad+'  '+t+'\n';}
});
html+=pad+'<span style="color:var(--accent)">&lt;/'+tag+'&gt;</span>';
return html;
}
function showRaw(){formatXML()}
function loadSample(){
document.getElementById('input').value='<?xml version="1.0" encoding="UTF-8"?>\n<bookstore>\n  <book category="fiction">\n    <title lang="zh">三体</title>\n    <author>刘慈欣</author>\n    <price>36.00</price>\n  </book>\n  <book category="non-fiction">\n    <title lang="zh">人类简史</title>\n    <author>尤瓦尔·赫拉利</author>\n    <price>42.00</price>\n  </book>\n</bookstore>';
formatXML();
}
function clearAll(){document.getElementById('input').value='';document.getElementById('output').innerHTML='';document.getElementById('error').style.display='none'}
function copyOutput(){
navigator.clipboard.writeText(document.getElementById('output').textContent).then(function(){toast('已复制到剪贴板')});
}
</script>
</body>
</html>
