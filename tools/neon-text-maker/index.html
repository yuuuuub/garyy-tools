<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💡 霓虹文字效果制作器</title>
<meta property="og:title" content="💡 霓虹文字效果制作器">
<meta property="og:description" content="💡 霓虹文字效果制作器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线霓虹文字效果生成器，自定义字体、发光、动画，一键导出PNG/HTML。">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root {--green:#238636;--red:#ef4444;--blue:#3b82f6;
  --bg: #0f172a; --surface: #1e293b; --surface-2: #334155;
  --text: #f1f5f9; --text-secondary: #94a3b8; --accent: #8b5cf6;
  --border: #475569; --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --radius: 12px; --transition: 0.25s ease;
}
[data-theme="light"] {
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9;
  --text: #1e293b; --text-secondary: #64748b; --accent: #8b5cf6;
  --border: #e2e8f0; --shadow: 0 4px 24px rgba(0,0,0,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; justify-content: center; min-height: 100vh; padding: 16px;
  transition: background var(--transition), color var(--transition);
}
.container {
  max-width: 800px; width: 100%; background: var(--surface);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px;
  transition: background var(--transition), box-shadow var(--transition);
}
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
header h1 { font-size: 1.5rem; }
.theme-toggle {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; cursor: pointer; font-size: 1.1rem; color: var(--text);
}
.theme-toggle:hover { background: var(--accent); color: #fff; }
.preview-box {
  background: #000; border-radius: var(--radius); padding: 40px 20px;
  text-align: center; margin-bottom: 20px; min-height: 200px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
.preview-text {
  font-size: 64px; font-weight: bold; color: #fff;
  transition: all 0.3s ease; position: relative; z-index: 1;
}
.section { margin-bottom: 16px; }
.section label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px; }
.section select, .section input[type="number"], .section input[type="text"] {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; color: var(--text); font-size: 0.9rem; width: 100%;
}
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.row label { margin-bottom: 0; min-width: 70px; font-size: 0.82rem; color: var(--text-secondary); }
.row input[type="range"] { flex: 1; min-width: 80px; accent-color: var(--accent); }
.row input[type="color"] {
  width: 36px; height: 36px; border: 2px solid var(--border); border-radius: 8px;
  cursor: pointer; padding: 0; background: none;
}
.controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .controls-grid { grid-template-columns: 1fr; } }
.preset-colors { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.preset-color-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border);
  cursor: pointer; transition: transform 0.2s;
}
.preset-color-btn:hover { transform: scale(1.2); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn {
  padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 0.85rem; font-weight: 600; transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-small { padding: 5px 10px; font-size: 0.78rem; }
.css-output {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; font-family: 'Courier New', monospace; font-size: 0.78rem;
  color: var(--text); word-break: break-all; white-space: pre-wrap; margin-top: 8px;
  max-height: 140px; overflow-y: auto;
}
.decoration-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.deco-btn {
  padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 0.8rem;
}
.deco-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>💡 霓虹文字效果制作器</h1>
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">🌓</button>
  </header>

  <div class="preview-box" id="previewBox">
    <div class="preview-text" id="previewText">NEON</div>
  </div>

  <div class="section">
    <label>预设霓虹色</label>
    <div class="preset-colors" id="presetColors"></div>
  </div>

  <div class="controls-grid">
    <div class="section">
      <label>文字内容</label>
      <input type="text" id="neonText" value="NEON" oninput="render()">
    </div>
    <div class="section">
      <label>字体</label>
      <select id="fontFamily" onchange="render()">
        <option value="'Courier New', monospace">Courier New</option>
        <option value="Arial, sans-serif">Arial</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="Verdana, sans-serif">Verdana</option>
        <option value="'Impact', sans-serif" selected>Impact</option>
      </select>
    </div>
    <div class="section">
      <label>字体大小</label>
      <div class="row">
        <input type="range" id="fontSize" min="24" max="120" value="64" oninput="render()">
        <span id="fontSizeVal" style="min-width:40px;font-size:0.85rem;">64px</span>
      </div>
    </div>
    <div class="section">
      <label>文字颜色</label>
      <div class="row">
        <input type="color" id="textColor" value="#ff00ff" oninput="render()">
        <span id="textColorVal" style="font-size:0.82rem;color:var(--text-secondary)">#ff00ff</span>
      </div>
    </div>
    <div class="section">
      <label>发光强度</label>
      <div class="row">
        <input type="range" id="glowIntensity" min="1" max="30" value="10" oninput="render()">
        <span id="glowIntVal" style="min-width:24px;font-size:0.85rem;">10</span>
      </div>
    </div>
    <div class="section">
      <label>发光层数</label>
      <div class="row">
        <input type="range" id="glowLayers" min="1" max="5" value="3" oninput="render()">
        <span id="glowLyrVal" style="min-width:24px;font-size:0.85rem;">3</span>
      </div>
    </div>
    <div class="section">
      <label>动画效果</label>
      <select id="animation" onchange="render()">
        <option value="static">静态</option>
        <option value="pulse" selected>脉冲</option>
        <option value="flicker">闪烁</option>
      </select>
    </div>
    <div class="section">
      <label>动画速度</label>
      <div class="row">
        <input type="range" id="animSpeed" min="0.5" max="5" step="0.1" value="2" oninput="render()">
        <span id="animSpeedVal" style="min-width:40px;font-size:0.85rem;">2s</span>
      </div>
    </div>
    <div class="section">
      <label>背景颜色</label>
      <div class="row">
        <input type="color" id="bgColor" value="#000000" oninput="render()">
        <span id="bgColorVal" style="font-size:0.82rem;color:var(--text-secondary)">#000000</span>
      </div>
    </div>
    <div class="section">
      <label>字间距</label>
      <div class="row">
        <input type="range" id="letterSpacing" min="0" max="30" value="0" oninput="render()">
        <span id="lsVal" style="min-width:24px;font-size:0.85rem;">0</span>
      </div>
    </div>
  </div>

  <div class="section">
    <label>文字装饰</label>
    <div class="decoration-group" id="decoGroup">
      <button class="deco-btn active" data-val="none" onclick="setDecor(this)">无</button>
      <button class="deco-btn" data-val="underline" onclick="setDecor(this)">下划线</button>
      <button class="deco-btn" data-val="overline" onclick="setDecor(this)">上划线</button>
      <button class="deco-btn" data-val="line-through" onclick="setDecor(this)">删除线</button>
    </div>
  </div>

  <div class="section">
    <label>文字转换</label>
    <div class="decoration-group" id="transformGroup">
      <button class="deco-btn active" data-val="none" onclick="setTransform(this)">无</button>
      <button class="deco-btn" data-val="uppercase" onclick="setTransform(this)">大写</button>
      <button class="deco-btn" data-val="lowercase" onclick="setTransform(this)">小写</button>
      <button class="deco-btn" data-val="capitalize" onclick="setTransform(this)">首字母大写</button>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="exportPNG()">📥 导出 PNG</button>
    <button class="btn btn-secondary" onclick="copyCSS()">📋 复制 CSS</button>
    <button class="btn btn-secondary" onclick="copyHTML()">📋 复制 HTML+CSS</button>
  </div>

  <div class="section" style="margin-top:16px;">
    <label>CSS 输出 <button class="btn btn-secondary btn-small" onclick="copyCSS()">📋 复制</button></label>
    <div class="css-output" id="cssOutput"></div>
  </div>
</div>

<style id="animStyle"></style>

<script>
const neonPresets = [
  { name: '品红', color: '#ff00ff' },
  { name: '青色', color: '#00ffff' },
  { name: '红色', color: '#ff0040' },
  { name: '绿色', color: '#39ff14' },
  { name: '橙色', color: '#ff6600' },
  { name: '蓝色', color: '#0080ff' }
];

let currentDecor = 'none';
let currentTransform = 'none';

function toggleTheme() {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'light' ? 'dark' : 'light';
}

function initPresets() {
  const container = document.getElementById('presetColors');
  container.innerHTML = '';
  neonPresets.forEach(p => {
    const btn = document.createElement('div');
    btn.className = 'preset-color-btn';
    btn.style.background = p.color;
    btn.title = p.name;
    btn.onclick = () => {
      document.getElementById('textColor').value = p.color;
      render();
    };
    container.appendChild(btn);
  });
}

function setDecor(btn) {
  document.querySelectorAll('#decoGroup .deco-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentDecor = btn.dataset.val;
  render();
}

function setTransform(btn) {
  document.querySelectorAll('#transformGroup .deco-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTransform = btn.dataset.val;
  render();
}

function buildGlowCSS() {
  const color = document.getElementById('textColor').value;
  const intensity = +document.getElementById('glowIntensity').value;
  const layers = +document.getElementById('glowLayers').value;
  const glows = [];
  for (let i = 1; i <= layers; i++) {
    glows.push(`0 0 ${intensity * i}px ${color}`);
  }
  return glows.join(', ');
}

function render() {
  const text = document.getElementById('neonText').value || 'NEON';
  const fontFamily = document.getElementById('fontFamily').value;
  const fontSize = document.getElementById('fontSize').value;
  const color = document.getElementById('textColor').value;
  const intensity = +document.getElementById('glowIntensity').value;
  const layers = +document.getElementById('glowLayers').value;
  const animation = document.getElementById('animation').value;
  const speed = +document.getElementById('animSpeed').value;
  const bgColor = document.getElementById('bgColor').value;
  const letterSpacing = document.getElementById('letterSpacing').value;

  document.getElementById('fontSizeVal').textContent = fontSize + 'px';
  document.getElementById('textColorVal').textContent = color;
  document.getElementById('glowIntVal').textContent = intensity;
  document.getElementById('glowLyrVal').textContent = layers;
  document.getElementById('animSpeedVal').textContent = speed + 's';
  document.getElementById('bgColorVal').textContent = bgColor;

  const previewBox = document.getElementById('previewBox');
  const previewText = document.getElementById('previewText');
  previewBox.style.background = bgColor;
  previewText.textContent = text;
  previewText.style.fontFamily = fontFamily;
  previewText.style.fontSize = fontSize + 'px';
  previewText.style.color = color;
  previewText.style.letterSpacing = letterSpacing + 'px';
  previewText.style.textShadow = buildGlowCSS();
  previewText.style.textDecoration = currentDecor;
  previewText.style.textTransform = currentTransform;

  const animStyle = document.getElementById('animStyle');
  if (animation === 'pulse') {
    previewText.style.animation = `neonPulse ${speed}s ease-in-out infinite`;
    animStyle.textContent = `
      @keyframes neonPulse {
        0%, 100% { text-shadow: ${buildGlowCSS()}; opacity: 1; }
        50% { text-shadow: ${color} 0 ${intensity * layers * 1.5}px; opacity: 0.85; }
      }
    `;
  } else if (animation === 'flicker') {
    previewText.style.animation = `neonFlicker ${speed}s ease-in-out infinite`;
    animStyle.textContent = `
      @keyframes neonFlicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: ${buildGlowCSS()}; opacity: 1; }
        20%, 24%, 55% { text-shadow: none; opacity: 0.4; }
      }
    `;
  } else {
    previewText.style.animation = 'none';
    animStyle.textContent = '';
  }

  const cssLines = [
    `color: ${color};`,
    `font-family: ${fontFamily};`,
    `font-size: ${fontSize}px;`,
    `font-weight: bold;`,
    `text-shadow: ${buildGlowCSS()};`,
    `letter-spacing: ${letterSpacing}px;`,
    currentDecor !== 'none' ? `text-decoration: ${currentDecor};` : '',
    currentTransform !== 'none' ? `text-transform: ${currentTransform};` : '',
    `background: ${bgColor};`
  ].filter(Boolean).join('\n  ');
  document.getElementById('cssOutput').textContent = cssLines;
}

function copyCSS() {
  navigator.clipboard.writeText(document.getElementById('cssOutput').textContent);
}

function copyHTML() {
  const text = document.getElementById('neonText').value || 'NEON';
  const css = document.getElementById('cssOutput').textContent;
  const html = `<div style="padding: 40px; text-align: center;">
  <h1 style="${css.replace(/\n  /g, ' ')}">${text}</h1>
</div>`;
  navigator.clipboard.writeText(html);
}

function exportPNG() {
  const canvas = document.createElement('canvas');
  const w = 800, h = 300;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const bgColor = document.getElementById('bgColor').value;
  const color = document.getElementById('textColor').value;
  const text = document.getElementById('neonText').value || 'NEON';
  const fontSize = +document.getElementById('fontSize').value;
  const fontFamily = document.getElementById('fontFamily').value;
  const intensity = +document.getElementById('glowIntensity').value;
  const layers = +document.getElementById('glowLayers').value;

  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, w, h);
  ctx.font = `bold ${fontSize}px ${fontFamily}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (let i = layers; i >= 1; i--) {
    ctx.shadowColor = color;
    ctx.shadowBlur = intensity * i;
    ctx.fillStyle = color;
    ctx.fillText(text, w / 2, h / 2);
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = color;
  ctx.fillText(text, w / 2, h / 2);

  const link = document.createElement('a');
  link.download = 'neon-text.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

initPresets();
render();
</script>
</body>
</html>
