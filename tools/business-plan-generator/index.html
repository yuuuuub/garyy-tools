<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商业计划书生成器</title>
<meta name="description" content="商业计划书生成器，快速生成专业商业计划大纲">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vhscroll-behavior:smooth;padding:16px;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button,textarea{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:80px;width:100%}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.plan-output{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;white-space:pre-wrap;font-size:.88rem;line-height:1.7}
.plan-output h2{font-size:1.1rem;margin:16px 0 8px;color:var(--blue)}
.plan-output h3{font-size:.95rem;margin:12px 0 6px;color:var(--gold)}
.plan-output ul{margin:4px 0 8px 20px}
.step-indicator{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.step-dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.step-dot.active{border-color:var(--blue);background:var(--blue);color:#fff}
.step-dot.done{border-color:var(--green);background:var(--green);color:#fff}
.step-label{font-size:.75rem;color:var(--text2);text-align:center;margin-top:4px}
.step-nav{display:flex;justify-content:space-between;margin-top:16px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tab-group{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab-btn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;font-size:.82rem;background:var(--card);color:var(--text);cursor:pointer;transition:all .2s}
.tab-btn:hover,.tab-btn.active{border-color:var(--blue);color:var(--blue)}
@media(max-width:640px){.form-row{flex-direction:column}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="商业计划书生成器">
<meta property="og:description" content="商业计划书生成器，快速生成专业商业计划大纲">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/business-plan-generator/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📝 商业计划书生成器</h1>
    <p>4步生成专业商业计划大纲</p>
  </header>

  <div class="card">
    <div class="step-indicator" id="stepIndicator"></div>
  </div>

  <div id="stepContent"></div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
let currentStep=1;
const totalSteps=4;

const stepNames=['基本信息','市场分析','产品运营','财务预测'];

let data={
  projectName:'',industry:'',stage:'',description:'',
  targetMarket:'',targetCustomer:'',competitors:'',marketSize:'',
  coreProduct:'',techSolution:'',operationModel:'',teamSize:'',
  initialInvestment:'',monthlyRevenue:'',monthlyCost:'',profitTime:''
};

const industries=['科技/SaaS','餐饮','零售','教育','健康医疗','金融','电商','制造业','文旅','其他'];
const stages=['种子轮','天使轮','A轮','B轮','C轮+','已盈利','未启动'];

function renderIndicator(){
  let html='';
  for(let i=1;i<=totalSteps;i++){
    const cls=i===currentStep?'active':(i<currentStep?'done':'');
    html+=`<div><div class="step-dot ${cls}" onclick="goStep(${i})">${i<currentStep?'✓':i}</div><div class="step-label">${stepNames[i-1]}</div></div>`;
  }
  $('stepIndicator').innerHTML=html;
}

window.goStep=function(n){currentStep=n;render();};

function render(){
  renderIndicator();
  if(currentStep===5){renderOutput();return;}

  let html=`<div class="card">`;
  if(currentStep===1){
    html+=`
      <div class="section-title">基本信息</div>
      <div class="form-row"><div class="group"><label>项目名称</label><input type="text" id="d_projectName" value="${data.projectName}" oninput="data.projectName=this.value"></div></div>
      <div class="form-row">
        <div class="group"><label>行业类型</label><select id="d_industry" onchange="data.industry=this.value"><option value="">请选择</option>${industries.map(i=>`<option value="${i}" ${data.industry===i?'selected':''}>${i}</option>`).join('')}</select></div>
        <div class="group"><label>公司阶段</label><select id="d_stage" onchange="data.stage=this.value"><option value="">请选择</option>${stages.map(s=>`<option value="${s}" ${data.stage===s?'selected':''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="form-row"><div class="group"><label>简要描述</label><textarea id="d_description" oninput="data.description=this.value" placeholder="用1-2句话描述你的项目...">${data.description}</textarea></div></div>
    `;
  }else if(currentStep===2){
    html+=`
      <div class="section-title">市场分析</div>
      <div class="form-row"><div class="group"><label>目标市场</label><input type="text" id="d_targetMarket" value="${data.targetMarket}" oninput="data.targetMarket=this.value" placeholder="如：中国一线城市白领"></div></div>
      <div class="form-row"><div class="group"><label>目标客户</label><input type="text" id="d_targetCustomer" value="${data.targetCustomer}" oninput="data.targetCustomer=this.value" placeholder="如：25-35岁年轻职场人"></div></div>
      <div class="form-row"><div class="group"><label>竞争对手</label><input type="text" id="d_competitors" value="${data.competitors}" oninput="data.competitors=this.value" placeholder="如：竞品A、竞品B"></div></div>
      <div class="form-row"><div class="group"><label>市场规模</label><input type="text" id="d_marketSize" value="${data.marketSize}" oninput="data.marketSize=this.value" placeholder="如：100亿/年"></div></div>
    `;
  }else if(currentStep===3){
    html+=`
      <div class="section-title">产品与运营</div>
      <div class="form-row"><div class="group"><label>核心产品/服务</label><textarea id="d_coreProduct" oninput="data.coreProduct=this.value" placeholder="描述核心产品或服务">${data.coreProduct}</textarea></div></div>
      <div class="form-row"><div class="group"><label>技术方案</label><input type="text" id="d_techSolution" value="${data.techSolution}" oninput="data.techSolution=this.value" placeholder="如：AI+大数据"></div></div>
      <div class="form-row"><div class="group"><label>运营模式</label><input type="text" id="d_operationModel" value="${data.operationModel}" oninput="data.operationModel=this.value" placeholder="如：SaaS订阅制"></div></div>
      <div class="form-row"><div class="group"><label>团队规模</label><input type="text" id="d_teamSize" value="${data.teamSize}" oninput="data.teamSize=this.value" placeholder="如：10人核心团队"></div></div>
    `;
  }else if(currentStep===4){
    html+=`
      <div class="section-title">财务预测</div>
      <div class="form-row">
        <div class="group"><label>初始投资 (万元)</label><input type="number" id="d_initialInvestment" value="${data.initialInvestment}" oninput="data.initialInvestment=this.value" min="0"></div>
        <div class="group"><label>月营收预期 (万元)</label><input type="number" id="d_monthlyRevenue" value="${data.monthlyRevenue}" oninput="data.monthlyRevenue=this.value" min="0"></div>
      </div>
      <div class="form-row">
        <div class="group"><label>月成本 (万元)</label><input type="number" id="d_monthlyCost" value="${data.monthlyCost}" oninput="data.monthlyCost=this.value" min="0"></div>
        <div class="group"><label>预计盈利时间</label><input type="text" id="d_profitTime" value="${data.profitTime}" oninput="data.profitTime=this.value" placeholder="如：12个月"></div>
      </div>
    `;
  }

  html+=`<div class="step-nav">
    ${currentStep>1?`<button class="btn btn-outline" onclick="goStep(${currentStep-1})">← 上一步</button>`:`<div></div>`}
    ${currentStep<totalSteps?`<button class="btn" onclick="goStep(${currentStep+1})">下一步 →</button>`:`<button class="btn btn-green" onclick="goStep(5)">生成计划书 →</button>`}
  </div></div>`;
  $('stepContent').innerHTML=html;
}

function renderOutput(){
  const invest=data.initialInvestment||'待定';
  const rev=data.monthlyRevenue||'待定';
  const cost=data.monthlyCost||'待定';
  const profitTime=data.profitTime||'待定';

  const plan=`
<h2>一、执行摘要</h2>
${data.projectName?`${data.projectName}是一个`:'一个'}面向${data.targetMarket||'目标市场'}的${data.industry||'行业'}项目。${data.description||'项目致力于为客户提供优质的产品和服务。'}
核心定位：${data.stage||'初创阶段'}，以${data.operationMode||'创新模式'}切入市场。

<h2>二、公司概述</h2>
• 项目名称：${data.projectName||'待填写'}
• 所属行业：${data.industry||'待填写'}
• 发展阶段：${data.stage||'待填写'}
• 团队规模：${data.teamSize||'待填写'}

<h2>三、市场分析</h2>
• 目标市场：${data.targetMarket||'待填写'}
• 目标客户：${data.targetCustomer||'待填写'}
• 市场规模：${data.marketSize||'待填写'}
• 竞争对手：${data.competitors||'待填写'}
• 差异化优势：通过技术创新和优质服务建立竞争壁垒。

<h2>四、产品与服务</h2>
• 核心产品：${data.coreProduct||'待填写'}
• 技术方案：${data.techSolution||'待填写'}
• 运营模式：${data.operationModel||'待填写'}
• 产品路线图：MVP → V1.0 → 规模化扩展

<h2>五、营销策略</h2>
• 获客渠道：线上推广 + 线下活动 + 合作伙伴
• 品牌定位：专业、可靠、创新
• 定价策略：根据市场调研制定有竞争力的价格
• 增长目标：首年获取1000+付费用户

<h2>六、运营计划</h2>
• 第一阶段（1-3月）：产品开发与测试
• 第二阶段（4-6月）：市场验证与迭代
• 第三阶段（7-12月）：规模化运营

<h2>七、财务预测</h2>
• 初始投资：${invest}万元
• 月营收预期：${rev}万元
• 月运营成本：${cost}万元
• 预计盈利时间：${profitTime}
• 第一年营收目标：${rev!=='待定'?((+rev)*12).toFixed(0):'待定'}万元

<h2>八、风险分析</h2>
• 市场风险：行业竞争加剧，需持续创新保持领先
• 技术风险：技术迭代快速，需保持研发投入
• 运营风险：团队扩张带来的管理挑战
• 财务风险：现金流管理，控制成本支出
• 应对策略：多元化收入来源，保持6个月以上现金储备
  `.trim();

  $('stepContent').innerHTML=`
    <div class="card">
      <div class="section-title">📋 商业计划书</div>
      <div class="plan-output" id="planOutput">${plan}</div>
      <div class="btn-group">
        <button class="btn" onclick="goStep(1)">← 返回编辑</button>
        <button class="btn btn-green" onclick="copyPlan()">📋 复制文本</button>
        <button class="btn btn-outline" onclick="downloadPlan()">💾 下载TXT</button>
      </div>
    </div>
  `;
}

window.copyPlan=function(){
  const text=$('planOutput')?.innerText||'';
  navigator.clipboard.writeText(text).then(()=>alert('已复制到剪贴板'));
};

window.downloadPlan=function(){
  const text=$('planOutput')?.innerText||'';
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(data.projectName||'商业计划书')+'.txt';a.click();
};

render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
