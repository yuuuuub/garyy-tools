<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>塔罗牌占卜 | Chinese Tarot Reading</title>
<meta name="description" content="塔罗牌占卜：22张大阿尔卡那、三种牌阵（单牌/凯尔特十字/三牌阵）。在线塔罗牌占卜工具。">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a843;--purple:#9b59b6;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b;--purple:#7c3aed}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.8rem;color:var(--purple)}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
.tab{padding:8px 18px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.85rem;transition:.2s}
.tab.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn{display:inline-block;padding:10px 24px;background:var(--purple);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}
.btn:hover{opacity:.85}
.card-area{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0;min-height:160px}
.tarot-card{width:80px;height:130px;border-radius:8px;cursor:pointer;transition:transform .4s;perspective:600px;position:relative}
.tarot-card .card-inner{width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;position:relative}
.tarot-card.flipped .card-inner{transform:rotateY(180deg)}
.tarot-card .card-front,.tarot-card .card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--gold)}
.card-front{background:linear-gradient(135deg,#1a1a3e,#2d1b69);color:var(--gold)}
.card-front .card-icon{font-size:1.8rem}
.card-front .card-label{font-size:.6rem;margin-top:4px;color:var(--text2)}
.card-back{background:linear-gradient(135deg,var(--card),#1a1a2e);transform:rotateY(180deg);padding:8px;text-align:center}
.card-back .cb-name{font-size:.7rem;color:var(--gold);font-weight:600;margin-bottom:4px}
.card-back .cb-num{font-size:.6rem;color:var(--text2)}
.card-back .cb-icon{font-size:1.4rem;margin:4px 0}
.spread-types{display:flex;gap:8px;justify-content:center;margin:12px 0}
.spread-btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text2);cursor:pointer;font-size:.8rem;transition:.2s}
.spread-btn.active{border-color:var(--purple);color:var(--purple);background:rgba(155,89,182,.1)}
.result-area{margin-top:16px;display:none}
.result-area.show{display:block}
.reading-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin:8px 0}
.reading-card .rc-pos{color:var(--text2);font-size:.8rem}
.reading-card .rc-name{color:var(--gold);font-size:1rem;font-weight:600}
.reading-card .rc-meaning{color:var(--text);font-size:.85rem;margin-top:4px}
.reading-card .rc-reversed{color:var(--red);font-size:.8rem;margin-top:2px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78rem;margin:2px}
.tag.good{background:rgba(35,134,54,.15);color:var(--green);border:1px solid rgba(35,134,54,.3)}
.tag.reversed{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
#themeBtn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer;font-size:.8rem}
</style>
</head>
<body>
<button id="themeBtn" onclick="toggleTheme()">🌓 主题</button>
<div class="container">
<h1>🃏 塔罗牌占卜</h1>
<p class="sub">22张大阿尔卡那 · 多种牌阵 · 正逆位解读</p>

<div class="tabs">
<button class="tab active" onclick="switchTab('single')">单牌占卜</button>
<button class="tab" onclick="switchTab('three')">三牌阵</button>
<button class="tab" onclick="switchTab('celtic')">凯尔特十字</button>
</div>

<div class="card" id="singlePanel">
<p style="text-align:center;color:var(--text2);margin-bottom:12px">心中默念问题，点击牌面翻开</p>
<div class="card-area" id="singleArea"></div>
<button class="btn" onclick="shuffleAndDraw('single',1)">洗牌</button>
<div class="result-area" id="singleResult"></div>
</div>

<div class="card" id="threePanel" style="display:none">
<p style="text-align:center;color:var(--text2);margin-bottom:12px">过去 · 现在 · 未来 — 点击牌面翻开</p>
<div class="card-area" id="threeArea"></div>
<button class="btn" onclick="shuffleAndDraw('three',3)">洗牌</button>
<div class="result-area" id="threeResult"></div>
</div>

<div class="card" id="celticPanel" style="display:none">
<p style="text-align:center;color:var(--text2);margin-bottom:12px">凯尔特十字 — 10张牌全面解读</p>
<div class="card-area" id="celticArea"></div>
<button class="btn" onclick="shuffleAndDraw('celtic',10)">洗牌</button>
<div class="result-area" id="celticResult"></div>
</div>

<div class="card">
<h3 style="color:var(--purple);margin-bottom:8px">📜 占卜记录</h3>
<div id="historyList"><div style="color:var(--text2);font-size:.85rem">暂无记录</div></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var majorArcana=[
{num:0,name:'愚者',icon:'🃏',upright:'新的开始、冒险、自由、天真无邪',reversed:'鲁莽、冒险、不确定、犹豫不决'},
{num:1,name:'魔术师',icon:'🎩',upright:'创造力、技能、自信、新机会',reversed:'欺骗、缺乏自信、操纵'},
{num:2,name:'女祭司',icon:'🌙',upright:'直觉、潜意识、内在智慧、神秘',reversed:'忽视直觉、秘密被揭露'},
{num:3,name:'女皇',icon:'👑',upright:'丰收、母性、自然、富足',reversed:'依赖、创造力受阻、忽视自我'},
{num:4,name:'皇帝',icon:'🏛️',upright:'权威、领导力、稳定、控制',reversed:'专横、过度控制、缺乏纪律'},
{num:5,name:'教皇',icon:'📿',upright:'传统、信仰、智慧、精神指导',reversed:'教条主义、叛逆、非传统'},
{num:6,name:'恋人',icon:'💕',upright:'爱情、选择、和谐、关系',reversed:'不和谐、分离、错误选择'},
{num:7,name:'战车',icon:'⚔️',upright:'胜利、意志力、决心、前进',reversed:'失控、方向迷失、缺乏意志'},
{num:8,name:'力量',icon:'🦁',upright:'勇气、耐心、内在力量、慈悲',reversed:'自我怀疑、软弱、缺乏自制'},
{num:9,name:'隐士',icon:'🏔️',upright:'内省、孤独、智慧、寻求真理',reversed:'孤立、逃避现实、过度封闭'},
{num:10,name:'命运之轮',icon:'🔄',upright:'转变、命运、机遇、循环',reversed:'不幸、抗拒变化、运气不佳'},
{num:11,name:'正义',icon:'⚖️',upright:'公正、真相、因果、法律',reversed:'不公、逃避责任、偏见'},
{num:12,name:'倒吊人',icon:'🙃',upright:'牺牲、等待、新视角、放下',reversed:'拖延、无谓牺牲、自怜'},
{num:13,name:'死神',icon:'💀',upright:'结束、转变、放下、新生',reversed:'抗拒改变、停滞不前、恐惧'},
{num:14,name:'节制',icon:'🏺',upright:'平衡、耐心、调和、适度',reversed:'失衡、过度、缺乏耐心'},
{num:15,name:'恶魔',icon:'😈',upright:'诱惑、束缚、物质主义、执念',reversed:'解脱、打破束缚、觉醒'},
{num:16,name:'塔',icon:'🗼',upright:'突变、破坏、觉醒、释放',reversed:'逃避灾难、恐惧改变'},
{num:17,name:'星星',icon:'⭐',upright:'希望、灵感、宁静、信心',reversed:'失望、缺乏信心、脱离现实'},
{num:18,name:'月亮',icon:'🌕',upright:'幻觉、恐惧、潜意识、直觉',reversed:'克服恐惧、真相显现'},
{num:19,name:'太阳',icon:'☀️',upright:'成功、快乐、活力、光明',reversed:'暂时低落、过度乐观'},
{num:20,name:'审判',icon:'📯',upright:'觉醒、重生、反思、召唤',reversed:'自我怀疑、逃避评判'},
{num:21,name:'世界',icon:'🌍',upright:'完成、成就、圆满、整合',reversed:'未完成、缺乏闭合、延迟'}
];

var celticPositions=['当前处境','挑战/障碍','潜意识/根源','过去','近期未来','近期未来','自我态度','外部影响','希望与恐惧','最终结果'];
var threePositions=['过去','现在','未来'];

var currentSpread='single';
var drawnCards=[];
var flippedCount=0;
var history=JSON.parse(localStorage.getItem('tarot_history')||'[]');

function init(){
shuffleAndDraw('single',1);
renderHistory();
}

function switchTab(tab){
currentSpread=tab;
document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
event.target.classList.add('active');
['singlePanel','threePanel','celticPanel'].forEach(function(id){document.getElementById(id).style.display='none'});
var map={single:'singlePanel',three:'threePanel',celtic:'celticPanel'};
document.getElementById(map[tab]).style.display='block';
var count={single:1,three:3,celtic:10}[tab];
shuffleAndDraw(tab,count);
}

function shuffleAndDraw(spread,count){
currentSpread=spread;
drawnCards=[];
flippedCount=0;
var deck=majorArcana.slice();
for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=deck[i];deck[i]=deck[j];deck[j]=t}
for(var i=0;i<count;i++){drawnCards.push({card:deck[i],reversed:Math.random()>0.5,flipped:false})}

var areaId={single:'singleArea',three:'threeArea',celtic:'celticArea'}[spread];
var area=document.getElementById(areaId);
area.innerHTML='';
drawnCards.forEach(function(d,i){
var div=document.createElement('div');
div.className='tarot-card';
div.id='card'+i;
div.innerHTML='<div class="card-inner"><div class="card-front"><div class="card-icon">🃏</div><div class="card-label">点击翻开</div></div>'+
'<div class="card-back"><div class="cb-num">'+d.card.num+'</div><div class="cb-icon">'+d.card.icon+'</div>'+
'<div class="cb-name">'+d.card.name+(d.reversed?' 逆位':'')+'</div></div></div>';
div.onclick=function(){flipCard(i)};
area.appendChild(div);
});

var resultId={single:'singleResult',three:'threeResult',celtic:'celticResult'}[spread];
document.getElementById(resultId).className='result-area';
document.getElementById(resultId).innerHTML='';
}

function flipCard(i){
if(drawnCards[i].flipped)return;
drawnCards[i].flipped=true;
flippedCount++;
document.getElementById('card'+i).classList.add('flipped');

var count=drawnCards.length;
if(flippedCount>=count){
setTimeout(function(){showReading()},500);
}
}

function showReading(){
var spread=currentSpread;
var resultId={single:'singleResult',three:'threeResult',celtic:'celticResult'}[spread];
var r=document.getElementById(resultId);
r.className='result-area show';
var positions=spread==='celtic'?celticPositions:spread==='three'?threePositions:['牌意'];
var html='';
drawnCards.forEach(function(d,i){
var pos=positions[i]||('第'+(i+1)+'张');
html+='<div class="reading-card">';
html+='<div class="rc-pos">'+pos+'</div>';
html+='<div class="rc-name">'+d.card.icon+' '+d.card.name+' '+(d.reversed?'逆位':'正位')+'</div>';
html+='<span class="tag '+(d.reversed?'reversed':'good')+'">'+(d.reversed?'逆位':'正位')+'</span>';
html+='<div class="rc-meaning">'+(d.reversed?d.card.reversed:d.card.upright)+'</div></div>';
});

var advice=drawnCards.some(function(d){return d.reversed})?
'注意逆位牌的警示，调整心态和行为。':'整体牌面积极，把握机遇，保持信心。';
html+='<div style="padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border);margin-top:12px">';
html+='<strong>🔮 综合建议：</strong>'+advice+'</div>';
r.innerHTML=html;

var cardNames=drawnCards.map(function(d){return d.card.name+(d.reversed?'逆':'正')}).join(', ');
saveHistory(spread==='celtic'?'凯尔特十字':spread==='three'?'三牌阵':'单牌占卜',cardNames,advice);
}

function saveHistory(type,cards,advice){
var now=new Date();
var time=now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0')+'-'+now.getDate().toString().padStart(2,'0')+' '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
history.unshift({time:type,time:time,type:type,cards:cards,advice:advice});
if(history.length>10)history=history.slice(0,10);
localStorage.setItem('tarot_history',JSON.stringify(history));
renderHistory();
}

function renderHistory(){
var d=document.getElementById('historyList');
if(history.length===0){d.innerHTML='<div style="color:var(--text2);font-size:.85rem">暂无记录</div>';return}
var html='';
history.forEach(function(h){
html+='<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin:6px 0">';
html+='<div style="font-size:.75rem;color:var(--text2)">'+h.time+'</div>';
html+='<div style="color:var(--purple);font-weight:600">'+h.type+'</div>';
html+='<div style="font-size:.8rem;color:var(--gold);margin-top:2px">'+h.cards+'</div>';
html+='<div style="font-size:.8rem;color:var(--text2)">'+h.advice+'</div></div>';
});
d.innerHTML=html;
}

function toggleTheme(){
var t=document.documentElement;
t.setAttribute('data-theme',t.getAttribute('data-theme')==='light'?'dark':'light');
}

init();
</script>
</body>
</html>
