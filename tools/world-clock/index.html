<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 世界时钟</title>
<style>
  :root {
    --bg: #f0f2f5;
    --card-bg: #fff;
    --text: #1a1a2e;
    --text-secondary: #666;
    --border: #e0e0e0;
    --day-bg: #fff3e0;
    --night-bg: #e8eaf6;
    --day-border: #ffe0b2;
    --night-border: #c5cae9;
    --btn-bg: #eee;
    --btn-hover: #ddd;
    --add-bg: #e3f2fd;
    --shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  [data-theme="dark"] {
    --bg: #0d1117;
    --card-bg: #161b22;
    --text: #e6edf3;
    --text-secondary: #8b949e;
    --border: #30363d;
    --day-bg: #2d1b00;
    --night-bg: #1a1a3e;
    --day-border: #5c3d00;
    --night-border: #2a2a6e;
    --btn-bg: #21262d;
    --btn-hover: #30363d;
    --add-bg: #0d1117;
    --shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background .3s, color .3s;
  }
  .container { max-width: 800px; margin: 0 auto; padding: 16px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; flex-wrap: wrap; gap: 8px;
  }
  header h1 { font-size: 1.5rem; font-weight: 700; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    border: none; cursor: pointer; border-radius: 8px; font-size: .875rem;
    padding: 8px 14px; transition: all .2s; font-weight: 500;
    background: var(--btn-bg); color: var(--text);
  }
  .btn:hover { background: var(--btn-hover); }
  .btn:active { transform: scale(.96); }
  .theme-btn { width: 38px; height: 38px; border-radius: 50%; padding: 0; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
  .add-section {
    background: var(--add-bg); border: 2px dashed var(--border); border-radius: 12px;
    padding: 14px 18px; margin-bottom: 16px; display: flex; gap: 8px;
    flex-wrap: wrap; align-items: center;
  }
  .add-section label { font-size: .85rem; color: var(--text-secondary); white-space: nowrap; }
  .add-section select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card-bg); color: var(--text); font-size: .875rem; min-width: 160px;
  }
  .add-section .btn { background: #2196f3; color: #fff; white-space: nowrap; }
  .add-section .btn:hover { background: #1976d2; }
  .clocks { display: flex; flex-direction: column; gap: 10px; }
  .clock-card {
    background: var(--card-bg); border-left: 5px solid transparent;
    border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow);
    transition: all .3s; position: relative; display: flex;
    align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .clock-card.day { background: var(--day-bg); border-left-color: #ff9800; }
  .clock-card.night { background: var(--night-bg); border-left-color: #3f51b5; }
  .clock-card .city-info { display: flex; align-items: center; gap: 8px; min-width: 120px; flex-shrink: 0; }
  .clock-card .city-info .flag { font-size: 1.8rem; }
  .clock-card .city-info .city-name { font-size: 1rem; font-weight: 600; }
  .clock-card .time-display { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 140px; }
  .clock-card .meta { font-size: .8rem; color: var(--text-secondary); min-width: 100px; }
  .clock-card .diff { font-size: .75rem; color: var(--text-secondary); background: var(--btn-bg); padding: 3px 8px; border-radius: 20px; }
  .clock-card .actions { display: flex; gap: 4px; margin-left: auto; }
  .clock-card .actions .btn { width: 32px; height: 32px; padding: 0; font-size: .85rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .clock-card .actions .btn.del { color: #e53935; }
  .clock-card .actions .btn.del:hover { background: #ffebee; }

  @media (max-width: 600px) {
    .container { padding: 10px; }
    header h1 { font-size: 1.2rem; }
    .clock-card { padding: 12px; gap: 8px; }
    .clock-card .time-display { font-size: 1.3rem; min-width: 120px; }
    .clock-card .city-info { min-width: 90px; }
    .clock-card .city-info .flag { font-size: 1.4rem; }
    .add-section { padding: 10px 12px; }
    .add-section select { min-width: 130px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🌍 世界时钟</h1>
    <div class="header-actions">
      <button class="btn theme-btn" id="themeToggle" title="切换暗色/亮色模式">🌙</button>
    </div>
  </header>

  <div class="add-section">
    <label for="tzSelect">添加时区：</label>
    <select id="tzSelect">
      <optgroup label="亚洲">
        <option value="Asia/Shanghai">🇨🇳 上海 (UTC+8)</option>
        <option value="Asia/Tokyo">🇯🇵 东京 (UTC+9)</option>
        <option value="Asia/Seoul">🇰🇷 首尔 (UTC+9)</option>
        <option value="Asia/Singapore">🇸🇬 新加坡 (UTC+8)</option>
        <option value="Asia/Bangkok">🇹🇭 曼谷 (UTC+7)</option>
        <option value="Asia/Kolkata">🇮🇳 孟买 (UTC+5:30)</option>
        <option value="Asia/Dubai">🇦🇪 迪拜 (UTC+4)</option>
      </optgroup>
      <optgroup label="欧洲">
        <option value="Europe/London">🇬🇧 伦敦 (UTC+0/+1)</option>
        <option value="Europe/Paris">🇫🇷 巴黎 (UTC+1/+2)</option>
        <option value="Europe/Berlin">🇩🇪 柏林 (UTC+1/+2)</option>
        <option value="Europe/Moscow">🇷🇺 莫斯科 (UTC+3)</option>
      </optgroup>
      <optgroup label="美洲">
        <option value="America/New_York">🇺🇸 纽约 (UTC-5/-4)</option>
        <option value="America/Chicago">🇺🇸 芝加哥 (UTC-6/-5)</option>
        <option value="America/Los_Angeles">🇺🇸 洛杉矶 (UTC-8/-7)</option>
        <option value="America/Sao_Paulo">🇧🇷 圣保罗 (UTC-3)</option>
      </optgroup>
      <optgroup label="大洋洲">
        <option value="Australia/Sydney">🇦🇺 悉尼 (UTC+10/+11)</option>
        <option value="Pacific/Auckland">🇳🇿 奥克兰 (UTC+12/+13)</option>
      </optgroup>
      <optgroup label="非洲">
        <option value="Africa/Cairo">🇪🇬 开罗 (UTC+2/+3)</option>
        <option value="Africa/Johannesburg">🇿🇦 约翰内斯堡 (UTC+2)</option>
      </optgroup>
    </select>
    <button class="btn" id="addBtn">＋ 添加</button>
  </div>

  <div class="clocks" id="clocks"></div>
</div>

<script>
const FLAGS = {
  'Asia/Shanghai': '🇨🇳', 'Asia/Tokyo': '🇯🇵', 'America/New_York': '🇺🇸',
  'Europe/London': '🇬🇧', 'Europe/Paris': '🇫🇷', 'Australia/Sydney': '🇦🇺',
  'Asia/Dubai': '🇦🇪', 'America/Los_Angeles': '🇺🇸',
  'Asia/Seoul': '🇰🇷', 'Asia/Singapore': '🇸🇬', 'Asia/Bangkok': '🇹🇭',
  'Asia/Kolkata': '🇮🇳', 'Europe/Berlin': '🇩🇪', 'Europe/Moscow': '🇷🇺',
  'America/Chicago': '🇺🇸', 'America/Sao_Paulo': '🇧🇷', 'Pacific/Auckland': '🇳🇿',
  'Africa/Cairo': '🇪🇬', 'Africa/Johannesburg': '🇿🇦'
};

const CITY_NAMES = {
  'Asia/Shanghai': '北京', 'Asia/Tokyo': '东京', 'America/New_York': '纽约',
  'Europe/London': '伦敦', 'Europe/Paris': '巴黎', 'Australia/Sydney': '悉尼',
  'Asia/Dubai': '迪拜', 'America/Los_Angeles': '洛杉矶',
  'Asia/Seoul': '首尔', 'Asia/Singapore': '新加坡', 'Asia/Bangkok': '曼谷',
  'Asia/Kolkata': '孟买', 'Europe/Berlin': '柏林', 'Europe/Moscow': '莫斯科',
  'America/Chicago': '芝加哥', 'America/Sao_Paulo': '圣保罗', 'Pacific/Auckland': '奥克兰',
  'Africa/Cairo': '开罗', 'Africa/Johannesburg': '约翰内斯堡'
};

const DEFAULT_ZONES = [
  'Asia/Shanghai', 'Asia/Tokyo', 'America/New_York', 'Europe/London',
  'Europe/Paris', 'Australia/Sydney', 'Asia/Dubai', 'America/Los_Angeles'
];

let zones = JSON.parse(localStorage.getItem('world-clock-zones')) || DEFAULT_ZONES;

function getTimeInZone(tz) {
  return new Date(new Date().toLocaleString('en-US', { timeZone: tz }));
}

function formatTime(d) {
  return d.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function formatDate(d) {
  return d.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
}

function getDiff(zone) {
  const now = new Date();
  const beijing = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }));
  const target = new Date(now.toLocaleString('en-US', { timeZone: zone }));
  const diffHours = (target.getTime() - beijing.getTime()) / 3600000;
  if (diffHours === 0) return '与北京同步';
  const sign = diffHours > 0 ? '早' : '晚';
  const absH = Math.abs(diffHours);
  if (absH % 1 === 0) return `比北京${sign}${absH}小时`;
  return `比北京${sign}${absH}小时`;
}

function moveZone(index, direction) {
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= zones.length) return;
  [zones[index], zones[newIndex]] = [zones[newIndex], zones[index]];
  localStorage.setItem('world-clock-zones', JSON.stringify(zones));
  render();
}

function removeZone(index) {
  zones.splice(index, 1);
  localStorage.setItem('world-clock-zones', JSON.stringify(zones));
  render();
}

function addZone(tz) {
  if (zones.includes(tz)) {
    alert('该时区已存在！');
    return;
  }
  zones.push(tz);
  localStorage.setItem('world-clock-zones', JSON.stringify(zones));
  render();
}

function render() {
  const container = document.getElementById('clocks');
  container.innerHTML = zones.map((tz, i) => {
    const d = getTimeInZone(tz);
    const hour = d.getHours();
    const isDay = hour >= 6 && hour < 18;
    const timeClass = isDay ? 'day' : 'night';
    const flag = FLAGS[tz] || '🌐';
    const city = CITY_NAMES[tz] || tz.split('/').pop().replace('_', ' ');
    return `
      <div class="clock-card ${timeClass}" data-tz="${tz}">
        <div class="city-info"><span class="flag">${flag}</span><span class="city-name">${city}</span></div>
        <div class="time-display">${formatTime(d)}</div>
        <div class="meta">${formatDate(d)}</div>
        <div class="diff">${getDiff(tz)}</div>
        <div class="actions">
          <button class="btn" onclick="moveZone(${i},-1)" ${i===0?'disabled':''} title="上移">▲</button>
          <button class="btn" onclick="moveZone(${i},1)" ${i===zones.length-1?'disabled':''} title="下移">▼</button>
          <button class="btn del" onclick="removeZone(${i})" title="删除">✕</button>
        </div>
      </div>`;
  }).join('');
}

// Theme toggle
const themeToggle = document.getElementById('themeToggle');
function applyTheme() {
  const isDark = localStorage.getItem('world-clock-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  themeToggle.textContent = isDark ? '☀️' : '🌙';
}
themeToggle.addEventListener('click', () => {
  const isDark = localStorage.getItem('world-clock-theme') === 'dark';
  localStorage.setItem('world-clock-theme', isDark ? 'light' : 'dark');
  applyTheme();
});
applyTheme();

// Add button
document.getElementById('addBtn').addEventListener('click', () => {
  const select = document.getElementById('tzSelect');
  addZone(select.value);
});

// Initial render + ticking
render();
setInterval(render, 1000);
</script>
</body>
</html>
