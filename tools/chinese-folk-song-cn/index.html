<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国民歌大全 - Chinese Folk Song Encyclopedia</title>
<meta name="description" content="中国民歌大全，收录各地区各民族的代表性民歌，涵盖号子、山歌、小调等体裁">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国民歌大全 - Chinese Folk Song Encyclopedia">
<meta property="og:description" content="中国民歌大全，收录各地区各民族的代表性民歌，涵盖号子、山歌、小调等体裁">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-folk-song-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#f472b6;--accent2:#ec4899}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#db2777;--accent2:#be185d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0510 0%,#2a0a18 50%,#3d1025 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a1a3a;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#f472b6,#f9a8d4,#ec4899,#db2777);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.song-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.song-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.song-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.song-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.song-card .sg-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.song-card .sg-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(244,114,182,0.15);color:var(--accent)}
.song-card .sg-name{font-size:1.3em;font-weight:bold}
.song-card .sg-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.song-card .sg-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.song-card .sg-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.song-card .sg-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.song-card .sg-detail strong{color:var(--text)}
.song-card .sg-lyrics{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;font-size:0.85em;color:var(--accent);font-style:italic;line-height:1.8}
.song-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.song-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🎵 中国民歌大全</h1>
<p>Chinese Folk Song Encyclopedia — 聆听各地区各民族的天籁之声</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索民歌、地区或民族...（如"茉莉花""信天游""蒙古长调"）" title="Enter键搜索">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="号子">号子</button>
<button class="filter-btn" data-filter="山歌">山歌</button>
<button class="filter-btn" data-filter="小调">小调</button>
<button class="filter-btn" data-filter="长调">长调</button>
<button class="filter-btn" data-filter="花儿">花儿</button>
<button class="filter-btn" data-filter="酒歌">酒歌</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="song-grid" id="songGrid"></div>
</div>
<footer>中国民歌大全 — 天籁之音 · 代代传唱 · garyy.top</footer>
<script>
const songData=[
{name:"茉莉花",category:"小调",icon:"🌸",subtitle:"江南水乡",region:"江苏",ethnicity:"汉族",description:"中国最具代表性的民歌之一，旋律优美婉转，流传海内外。被普采入歌剧《图兰朵》，成为中国文化的音乐名片。",lyrics:"「好一朵美丽的茉莉花，好一朵美丽的茉莉花，芬芳美丽满枝桠，又香又白人人夸。」"},
{name:"半个月亮爬上来",category:"小调",icon:"🌙",subtitle:"西北风情",region:"新疆",ethnicity:"维吾尔族",description:"新疆维吾尔族民歌，旋律优美深情，被王洛宾整理改编后广泛传唱。表现了青年男女的爱情故事。",lyrics:"「半个月亮爬上来，咿啦啦爬上来，照着我的姑娘梳妆台，咿啦啦梳妆台。」"},
{name:"康定情歌",category:"山歌",icon:"🏔️",subtitle:"跑马溜溜的山上",region:"四川康定",ethnicity:"藏族/汉族",description:"四川康定地区的民歌，以\"跑马溜溜的山上\"闻名。旋律简单质朴，表达了青年男女的纯真爱情。",lyrics:"「跑马溜溜的山上，一朵溜溜的云哟，端端溜溜的照在康定溜溜的城哟。」"},
{name:"黄河船夫曲",category:"号子",icon:"🚣",subtitle:"黄河号子",region:"陕西",ethnicity:"汉族",description:"黄河船夫在行船时演唱的劳动号子，节奏铿锵有力，表现了船夫与黄河搏斗的英勇精神。",lyrics:"「你晓得，天下黄河几十几道湾？几十几道湾上，几十几只船？」"},
{name:"在那遥远的地方",category:"小调",icon:"🌟",subtitle:"草原恋歌",region:"青海",ethnicity:"哈萨克族",description:"王洛宾在青海采风时创作的歌曲，融合了哈萨克族民歌元素。旋律深情优美，被誉为\"中国最美情歌\"。",lyrics:"「在那遥远的地方，有位好姑娘，人们走过了她的帐房，都要回头留恋地张望。」"},
{name:"长调·辽阔的草原",category:"长调",icon:"🐎",subtitle:"蒙古长调",region:"内蒙古",ethnicity:"蒙古族",description:"蒙古长调是蒙古族最具代表性的民歌形式，旋律悠长舒展，节奏自由，展现草原的辽阔与壮美。被列为世界非物质文化遗产。",lyrics:"「辽阔的草原宽又广，骏马飞奔在草原上……」"},
{name:"龙船调",category:"山歌",icon:"🐉",subtitle:"湖北利川",region:"湖北利川",ethnicity:"土家族",description:"湖北利川土家族民歌，以对唱形式表现青年男女的爱情。\"妹娃要过河，哪个来推我\"的旋律深入人心。",lyrics:"「妹娃要过河，哪个来推我嘛？我就来推你嘛。」"},
{name:"沂蒙山小调",category:"小调",icon:"⛰️",subtitle:"山东民歌",region:"山东临沂",ethnicity:"汉族",description:"山东临沂地区的民歌，歌颂沂蒙山区的美丽风光和人民的幸福生活。旋律优美，流传广泛。",lyrics:"「人人那个都说哎，沂蒙山好，沂蒙那个山上哎，好风光。」"},
{name:"走西口",category:"山歌",icon:"🚪",subtitle:"晋陕民歌",region:"山西/陕西",ethnicity:"汉族",description:"晋陕地区的传统民歌，反映了历史上山西、陕西人民走西口谋生的艰辛。曲调悲凉，感人至深。",lyrics:"「哥哥你走西口，小妹妹我实难留，手拉着那哥哥的手，送哥送到大门口。」"},
{name:"掀起你的盖头来",category:"小调",icon:"💃",subtitle:"新疆维吾尔族",region:"新疆",ethnicity:"维吾尔族",description:"新疆维吾尔族民歌，王洛宾整理改编。节奏欢快活泼，表现了维吾尔族人民的热情与欢乐。",lyrics:"「掀起你的盖头来，让我看看你的眉，你的眉毛细又长呀，好像那树上的弯月亮。」"},
{name:"乌苏里船歌",category:"山歌",icon:"🚣",subtitle:"赫哲族渔歌",region:"黑龙江",ethnicity:"赫哲族",description:"赫哲族民歌，反映了赫哲族人民在乌苏里江上捕鱼的生活场景。旋律悠扬，意境深远。",lyrics:"「乌苏里江水长又长，蓝蓝的江水起波浪……」"},
{name:"花儿与少年",category:"花儿",icon:"🌺",subtitle:"西北花儿",region:"青海/甘肃",ethnicity:"回族/藏族",description:"\"花儿\"是西北地区回族、藏族等民族的山歌形式，\"花儿与少年\"是其中最著名的曲目之一。",lyrics:"「春季里那么到了这，水仙花儿开，水仙花儿开，绣呀么绣阁里啊，望春季里么到了这……」"},
{name:"敬酒歌",category:"酒歌",icon:"🍷",subtitle:"蒙古族酒歌",region:"内蒙古",ethnicity:"蒙古族",description:"蒙古族在宴会上演唱的酒歌，表达对客人的欢迎和祝福。旋律热情豪迈，体现了蒙古族的好客之道。",lyrics:"「金杯银杯斟满酒，双手举过头，炒米奶茶手扒肉，今天喝个够。」"},
{name:"月光下的凤尾竹",category:"小调",icon:"🎋",subtitle:"傣族风情",region:"云南",ethnicity:"傣族",description:"云南傣族风格的歌曲，描绘了月光下凤尾竹的美丽景象。旋律优美动听，充满热带风情。",lyrics:"「月光下的凤尾竹哟，轻柔美丽像绿色的雾哟……」"},
{name:"太阳出来喜洋洋",category:"山歌",icon:"☀️",subtitle:"四川民歌",region:"四川",ethnicity:"汉族",description:"四川地区的山歌，旋律欢快活泼，表现了劳动人民的乐观精神。\"太阳出来喜洋洋\"已成为四川的文化符号。",lyrics:"「太阳出来喜洋洋，挑起扁担上山岗哟。」"}
];
function getStats(data){const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});return cats}
function renderStats(data){const stats=getStats(data);document.getElementById('statsOverview').innerHTML=`<div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">民歌总数</div></div>`+Object.entries(stats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}
function renderCards(data){document.getElementById('songGrid').innerHTML=data.map(m=>`<div class="song-card" data-category="${m.category}"><div class="sg-header"><div class="sg-icon">${m.icon}</div><div><div class="sg-name">${m.name}</div><div class="sg-sub">${m.subtitle}</div></div></div><div class="sg-meta"><span>${m.category}</span><span>${m.region}</span><span>${m.ethnicity}</span></div><div class="sg-detail">${m.description}</div><div class="sg-lyrics">${m.lyrics}</div></div>`).join('')}
function filterCards(){const q=document.getElementById('searchInput').value.toLowerCase();const f=document.querySelector('.filter-btn.active').dataset.filter;const filtered=songData.filter(m=>{const matchF=f==='all'||m.category===f;const matchQ=!q||m.name.toLowerCase().includes(q)||m.description.toLowerCase().includes(q)||m.region.toLowerCase().includes(q)||m.ethnicity.toLowerCase().includes(q);return matchF&&matchQ});renderCards(filtered);renderStats(filtered)}
document.getElementById('searchInput').addEventListener('input',filterCards);
document.getElementById('filterRow').addEventListener('click',e=>{if(e.target.classList.contains('filter-btn')){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');filterCards()}});
renderCards(songData);renderStats(songData);
</script>
</body>
</html>
