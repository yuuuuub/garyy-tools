<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>排行榜</title>
<meta name="description" content="排行榜 - 创建和管理多榜单排行榜，支持多种排序和分类">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--gold:#f0b429;--silver:#c0c0c0;--bronze:#cd7f32;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--gold:#d4a017;--silver:#808080;--bronze:#a0522d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:700px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
input,select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem}
label{display:block;color:var(--text2);font-size:.85rem;margin-bottom:4px}
.form-group{margin-bottom:12px}
.lb-entry{display:flex;align-items:center;padding:12px;border-bottom:1px solid var(--border);gap:12px}
.lb-entry:last-child{border-bottom:none}
.lb-rank{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
.rank-1{background:var(--gold);color:#000}
.rank-2{background:var(--silver);color:#000}
.rank-3{background:var(--bronze);color:#fff}
.rank-other{background:var(--border);color:var(--text2)}
.lb-info{flex:1}
.lb-name{font-weight:600}
.lb-score{font-size:1.3rem;font-weight:700;color:var(--accent);text-align:right}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.tab{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .2s;font-size:.85rem}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:40px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}}
</style>
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🏆 排行榜';
const APP=document.getElementById('app');
let boards=JSON.parse(localStorage.getItem('lb_boards')||'[{"id":"default","name":"默认榜单","entries":[]}]');
let activeBoard=boards[0].id;

function save(){localStorage.setItem('lb_boards',JSON.stringify(boards))}

function getBoard(){return boards.find(b=>b.id===activeBoard)}

function render(){
  const board=getBoard();
  const sorted=board?board.entries.sort((a,b)=>b.score-a.score):[];
  APP.innerHTML=`
    <h1>🏆 排行榜</h1>
    <p class="subtitle">创建和管理多榜单排行榜</p>
    <div class="card">
      <div class="tab-bar">
        ${boards.map(b=>`<div class="tab ${b.id===activeBoard?'active':''}" onclick="switchBoard('${b.id}')">${b.name}</div>`).join('')}
        <div class="tab" onclick="addBoard()" style="border-style:dashed">+ 新榜单</div>
      </div>
    </div>
    <div class="card">
      <div class="form-group">
        <label>添加成员</label>
        <div class="flex">
          <input id="ename" placeholder="名称" style="flex:1">
          <input id="escore" type="number" placeholder="分数" style="width:100px">
          <button class="btn" onclick="addEntry()">添加</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="flex-between" style="margin-bottom:12px">
        <h2 style="font-size:1.2rem">${board?board.name:''}</h2>
        <button class="btn btn-sm btn-danger" onclick="clearBoard()">清空</button>
      </div>
      ${sorted.length===0?'<div class="empty">添加成员开始排行</div>':''}
      ${sorted.map((e,i)=>`
        <div class="lb-entry">
          <div class="lb-rank ${i<3?'rank-'+(i+1):'rank-other'}">${i+1}</div>
          <div class="lb-info">
            <div class="lb-name">${e.name}</div>
            <div style="font-size:.8rem;color:var(--text2)">${e.tag||''}</div>
          </div>
          <div class="lb-score">${e.score}</div>
          <button class="btn btn-sm btn-danger" onclick="removeEntry('${e.id}')" style="padding:4px 8px">✕</button>
        </div>
      `).join('')}
    </div>
  `;
}

function switchBoard(id){activeBoard=id;render()}

function addBoard(){
  const name=prompt('输入榜单名称:');
  if(!name)return;
  const id=Date.now().toString();
  boards.push({id,name,entries:[]});
  activeBoard=id;save();render();
}

function addEntry(){
  const name=document.getElementById('ename').value.trim();
  const score=parseInt(document.getElementById('escore').value)||0;
  if(!name)return;
  const board=getBoard();
  board.entries.push({id:Date.now().toString(),name,score,tag:''});
  document.getElementById('ename').value='';
  document.getElementById('escore').value='';
  save();render();
}

function removeEntry(id){
  const board=getBoard();
  board.entries=board.entries.filter(e=>e.id!==id);save();render();
}

function clearBoard(){
  if(!confirm('确定清空当前榜单?'))return;
  getBoard().entries=[];save();render();
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.activeElement.id==='ename')addEntry();
  if(e.key==='Enter'&&document.activeElement.id==='escore')addEntry();
});
render();
</script>
</body>
</html>
