<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏷️ 贴纸制作器</title>
<meta name="description" content="在线贴纸制作器，上传图片添加文字和装饰，一键生成贴纸">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s}
.upload-area:hover{border-color:var(--accent);background:var(--tag-bg)}
.upload-icon{font-size:48px;margin-bottom:8px}
.upload-text{font-size:14px;color:var(--text-secondary)}
.canvas-wrap{display:flex;justify-content:center;padding:10px 0}
canvas#stickerCanvas{border-radius:12px;border:1px solid var(--border);cursor:crosshair;max-width:100%}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px;font-weight:500}
.input-group input,.input-group textarea,.input-group select{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;outline:none;font-family:inherit}
.input-group input:focus,.input-group textarea:focus{border-color:var(--accent)}
.tag-grid{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);cursor:pointer;font-size:13px;transition:all .2s;user-select:none}
.tag:hover{border-color:var(--accent);transform:translateY(-1px)}
.tag.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-swatch{width:32px;height:32px;border-radius:8px;border:2px solid var(--border);cursor:pointer;transition:all .2s}
.color-swatch:hover{transform:scale(1.1)}
.color-swatch.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.hidden{display:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏷️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🏷️ 贴纸制作器">
<meta property="og:description" content="在线贴纸制作器，上传图片一键生成贴纸">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/sticker-maker-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🏷️ 贴纸制作器</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card" id="uploadCard">
    <div class="card-title">📤 上传图片</div>
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📁</div>
      <div class="upload-text">点击或拖拽上传图片</div>
      <div class="upload-hint" style="font-size:12px;color:var(--text-secondary);margin-top:4px">支持 JPG / PNG / GIF</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="card hidden" id="editorCard">
    <div class="card-title">🖼️ 预览</div>
    <div class="canvas-wrap"><canvas id="stickerCanvas" width="400" height="400"></canvas></div>
  </div>

  <div class="card hidden" id="textCard">
    <div class="card-title">✏️ 添加文字</div>
    <div class="input-group"><label>文字内容</label><input id="stickerText" placeholder="输入文字..." oninput="drawSticker()"></div>
    <div class="input-group"><label>字体大小</label><input type="range" min="12" max="60" value="24" id="fontSize" oninput="drawSticker()"></div>
    <div class="tag-grid" id="fontStyleGrid"></div>
    <div class="color-row" id="textColors" style="margin-top:10px"></div>
  </div>

  <div class="card hidden" id="shapeCard">
    <div class="card-title">🔷 贴纸形状</div>
    <div class="tag-grid" id="shapeGrid"></div>
  </div>

  <div class="card hidden" id="borderCard">
    <div class="card-title">🖌️ 边框</div>
    <div class="tag-grid" id="borderGrid"></div>
    <div class="color-row" id="borderColors" style="margin-top:10px"></div>
  </div>

  <div class="card hidden" id="decoCard">
    <div class="card-title">✨ 装饰 Emoji</div>
    <div class="tag-grid" id="decoGrid"></div>
  </div>

  <div class="card hidden" id="bgCard">
    <div class="card-title">🎨 背景色</div>
    <div class="color-row" id="bgColors"></div>
  </div>

  <div class="btn-row hidden" id="btnRow">
    <button class="btn btn-primary" onclick="downloadSticker()">💾 下载贴纸</button>
    <button class="btn btn-outline" onclick="resetAll()">🔄 重新开始</button>
  </div>

  <footer>贴纸制作器 · 所有数据本地处理</footer>
</div>
<div class="toast" id="toast"></div>
<script src="../i18n.js" defer></script>
<script>
let baseImage = null, bgColor = '#ffffff', borderColor = '#000000', borderWidth = 0;
let stickerShape = 'circle', decoEmoji = '', fontColor = '#000000';
const textColors = ['#000000','#ffffff','#ff0000','#00ff00','#0000ff','#ffff00','#ff00ff','#00ffff','#ff8800','#8800ff'];
const bgColors = ['#ffffff','#000000','#ff4444','#44ff44','#4444ff','#ffff00','#ff00ff','#00ffff','#ff8800','#88ff00'];
const borderColors = ['#000000','#ffffff','#ff0000','#00ff00','#0000ff','#ffaa00','#ff00ff'];
const shapes = [{name:'圆形',id:'circle'},{name:'方形',id:'square'},{name:'圆角',id:'round'},{name:'星形',id:'star'},{name:'心形',id:'heart'},{name:'无裁剪',id:'none'}];
const borders = [{name:'无',id:'none'},{name:'细',id:'thin'},{name:'中',id:'medium'},{name:'粗',id:'thick'}];
const decos = ['','⭐','🌟','✨','💫','🎉','🎈','❤️','🔥','🌈','👑','🎵','🌸','🍀','🦋','💫','💥','⚡'];
const fontStyles = [{name:'正常',id:'normal'},{name:'粗体',id:'bold'},{name:'斜体',id:'italic'},{name:'描边',id:'stroke'}];
let currentFontStyle = 'normal';

function init() {
  document.getElementById('fontStyleGrid').innerHTML = fontStyles.map(f => `<div class="tag${f.id===currentFontStyle?' active':''}" onclick="setFontStyle('${f.id}')">${f.name}</div>`).join('');
  document.getElementById('textColors').innerHTML = textColors.map(c => `<div class="color-swatch${c===fontColor?' active':''}" style="background:${c}" onclick="setFontColor('${c}')"></div>`).join('');
  document.getElementById('shapeGrid').innerHTML = shapes.map(s => `<div class="tag${s.id===stickerShape?' active':''}" onclick="setShape('${s.id}')">${s.name}</div>`).join('');
  document.getElementById('borderGrid').innerHTML = borders.map(b => `<div class="tag" onclick="setBorder('${b.id}')">${b.name}</div>`).join('');
  document.getElementById('borderColors').innerHTML = borderColors.map(c => `<div class="color-swatch" style="background:${c}" onclick="setBorderColor('${c}')"></div>`).join('');
  document.getElementById('decoGrid').innerHTML = decos.map(d => `<div class="tag" onclick="setDeco('${d}')">${d||'无'}</div>`).join('');
  document.getElementById('bgColors').innerHTML = bgColors.map(c => `<div class="color-swatch" style="background:${c}" onclick="setBgColor('${c}')"></div>`).join('');

  const ua = document.getElementById('uploadArea');
  const fi = document.getElementById('fileInput');
  ua.addEventListener('click', () => fi.click());
  ua.addEventListener('dragover', e => { e.preventDefault(); ua.classList.add('dragover'); });
  ua.addEventListener('dragleave', () => ua.classList.remove('dragover'));
  ua.addEventListener('drop', e => { e.preventDefault(); ua.classList.remove('dragover'); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
  fi.addEventListener('change', e => { if(e.target.files[0]) loadFile(e.target.files[0]); });
}

function loadFile(f) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => { baseImage = img; showEditor(); drawSticker(); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
}

function showEditor() {
  ['editorCard','textCard','shapeCard','borderCard','decoCard','bgCard','btnRow'].forEach(id => document.getElementById(id).classList.remove('hidden'));
  document.getElementById('uploadCard').classList.add('hidden');
}

function setFontStyle(s) { currentFontStyle = s; document.querySelectorAll('#fontStyleGrid .tag').forEach(el => el.classList.toggle('active', el.textContent === fontStyles.find(f=>f.id===s).name)); drawSticker(); }
function setFontColor(c) { fontColor = c; document.querySelectorAll('#textColors .color-swatch').forEach(el => el.classList.toggle('active', el.style.background === c || rgbToHex(el.style.background) === c)); drawSticker(); }
function setShape(s) { stickerShape = s; document.querySelectorAll('#shapeGrid .tag').forEach(el => el.classList.toggle('active', el.textContent === shapes.find(sh=>sh.id===s).name)); drawSticker(); }
function setBorder(b) { borderWidth = b === 'none' ? 0 : b === 'thin' ? 3 : b === 'medium' ? 6 : 10; document.querySelectorAll('#borderGrid .tag').forEach(el => el.classList.toggle('active', el.textContent === borders.find(br=>br.id===b).name)); drawSticker(); }
function setBorderColor(c) { borderColor = c; document.querySelectorAll('#borderColors .color-swatch').forEach(el => el.classList.toggle('active', el.style.background === c || rgbToHex(el.style.background) === c)); drawSticker(); }
function setDeco(d) { decoEmoji = d; document.querySelectorAll('#decoGrid .tag').forEach(el => el.classList.toggle('active', el.textContent === (d||'无'))); drawSticker(); }
function setBgColor(c) { bgColor = c; document.querySelectorAll('#bgColors .color-swatch').forEach(el => el.classList.toggle('active', el.style.background === c || rgbToHex(el.style.background) === c)); drawSticker(); }

function rgbToHex(rgb) {
  if (rgb.startsWith('#')) return rgb;
  const m = rgb.match(/\d+/g);
  return '#' + m.slice(0,3).map(x => (+x).toString(16).padStart(2,'0')).join('');
}

function drawSticker() {
  const c = document.getElementById('stickerCanvas');
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);

  // background
  ctx.fillStyle = bgColor;
  if (stickerShape === 'circle') { ctx.beginPath(); ctx.arc(w/2, h/2, w/2-4, 0, Math.PI*2); ctx.fill(); }
  else if (stickerShape === 'round') { roundRect(ctx, 4, 4, w-8, h-8, 30); ctx.fill(); }
  else if (stickerShape === 'star') { drawStar(ctx, w/2, h/2, w/2-4, 5); ctx.fill(); }
  else if (stickerShape === 'heart') { drawHeart(ctx, w/2, h/2, w/2-10); ctx.fill(); }
  else { ctx.fillRect(0, 0, w, h); }

  // image
  if (baseImage) {
    ctx.save();
    clipShape(ctx, w, h);
    const ratio = Math.min(w / baseImage.width, h / baseImage.height);
    const iw = baseImage.width * ratio, ih = baseImage.height * ratio;
    ctx.drawImage(baseImage, (w-iw)/2, (h-ih)/2, iw, ih);
    ctx.restore();
  }

  // border
  if (borderWidth > 0) {
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = borderWidth;
    if (stickerShape === 'circle') { ctx.beginPath(); ctx.arc(w/2, h/2, w/2-4-borderWidth/2, 0, Math.PI*2); ctx.stroke(); }
    else if (stickerShape === 'round') { roundRect(ctx, 4+borderWidth/2, 4+borderWidth/2, w-8-borderWidth, h-8-borderWidth, 30); ctx.stroke(); }
    else if (stickerShape === 'star') { drawStar(ctx, w/2, h/2, w/2-4-borderWidth/2, 5); ctx.stroke(); }
    else if (stickerShape === 'heart') { drawHeart(ctx, w/2, h/2, w/2-10-borderWidth/2); ctx.stroke(); }
    else { ctx.strokeRect(borderWidth/2, borderWidth/2, w-borderWidth, h-borderWidth); }
  }

  // text
  const txt = document.getElementById('stickerText').value;
  if (txt) {
    const fs = +document.getElementById('fontSize').value;
    ctx.font = `${currentFontStyle === 'italic' ? 'italic ' : ''}${currentFontStyle === 'bold' ? 'bold ' : ''}${fs}px -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (currentFontStyle === 'stroke') {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeText(txt, w/2, h*0.75);
    }
    ctx.fillStyle = fontColor;
    ctx.fillText(txt, w/2, h*0.75);
  }

  // decoration
  if (decoEmoji) {
    ctx.font = '32px serif'; ctx.textAlign = 'center';
    ctx.fillText(decoEmoji, w*0.2, h*0.2);
    ctx.fillText(decoEmoji, w*0.8, h*0.2);
  }
}

function clipShape(ctx, w, h) {
  ctx.beginPath();
  if (stickerShape === 'circle') { ctx.arc(w/2, h/2, w/2-4, 0, Math.PI*2); }
  else if (stickerShape === 'round') { roundRect(ctx, 4, 4, w-8, h-8, 30); }
  else if (stickerShape === 'star') { drawStar(ctx, w/2, h/2, w/2-4, 5); }
  else if (stickerShape === 'heart') { drawHeart(ctx, w/2, h/2, w/2-10); }
  else { ctx.rect(0, 0, w, h); }
  ctx.clip();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
}

function drawStar(ctx, cx, cy, r, pts) {
  ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = Math.PI / pts * i - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.4;
    ctx[i === 0 ? 'moveTo' : 'lineTo'](cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
  }
  ctx.closePath();
}

function drawHeart(ctx, cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 0.6);
  ctx.bezierCurveTo(cx - r, cy - r * 0.2, cx - r * 0.5, cy - r, cx, cy - r * 0.4);
  ctx.bezierCurveTo(cx + r * 0.5, cy - r, cx + r, cy - r * 0.2, cx, cy + r * 0.6);
  ctx.closePath();
}

function downloadSticker() {
  const c = document.getElementById('stickerCanvas');
  const a = document.createElement('a');
  a.download = 'sticker.png'; a.href = c.toDataURL('image/png'); a.click();
  showToast('贴纸已下载！');
}

function resetAll() {
  baseImage = null;
  document.getElementById('uploadCard').classList.remove('hidden');
  ['editorCard','textCard','shapeCard','borderCard','decoCard','bgCard','btnRow'].forEach(id => document.getElementById(id).classList.add('hidden'));
  document.getElementById('stickerText').value = '';
}

function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

init();
</script>
</body>
</html>
