<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ 粒子系统</title>
<meta property="og:title" content="✨ 粒子系统">
<meta property="og:description" content="✨ 粒子系统 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="粒子系统 - 创建和模拟各种粒子特效">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.hdr{text-align:center;margin-bottom:16px}.hdr h1{font-size:1.6rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.8rem;transition:all .2s}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.canvas-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
canvas{display:block;width:100%}
.controls{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.controls .row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.controls label{font-size:.8rem;color:var(--text2);min-width:70px}
.controls input[type=range]{flex:1;accent-color:var(--accent)}
.controls .val{font-size:.8rem;color:var(--accent);min-width:50px;text-align:right}
.controls select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;font-size:.8rem}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.85}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{opacity:.85}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.info-bar{display:flex;gap:16px;justify-content:center;color:var(--text2);font-size:.8rem;padding:8px 0}
.info-bar span{color:var(--accent);font-weight:600}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="hdr"><h1>✨ 粒子系统</h1><p>创建和模拟各种粒子特效</p></div>

<div class="tabs" id="tabs">
<button class="active" data-e="fountain">喷泉</button>
<button data-e="fire">火焰</button>
<button data-e="smoke">烟雾</button>
<button data-e="snow">雪花</button>
<button data-e="galaxy">星系</button>
<button data-e="explosion">爆炸</button>
<button data-e="confetti">五彩纸屑</button>
</div>

<div class="canvas-wrap"><canvas id="pc"></canvas></div>

<div class="controls">
<div class="row"><label>粒子数量</label><input type="range" min="50" max="2000" step="50" value="500" id="maxP"><span class="val">500</span></div>
<div class="row"><label>发射速度</label><input type="range" min="0.5" max="10" step="0.5" value="4" id="vel"><span class="val">4</span></div>
<div class="row"><label>重力</label><input type="range" min="-2" max="5" step="0.1" value="0.15" id="grav"><span class="val">0.15</span></div>
<div class="row"><label>生命周期</label><input type="range" min="30" max="300" step="10" value="120" id="life"><span class="val">120</span></div>
<div class="row"><label>颜色模式</label>
<select id="colorMode"><option value="hue">色相渐变</option><option value="fire">火焰色</option><option value="white">纯白</option><option value="random">随机</option></select>
</div>
</div>

<div class="btn-row">
<button class="btn btn-primary" onclick="togglePlay()">▶ 播放/暂停</button>
<button class="btn btn-success" onclick="burst()">💥 爆发</button>
<button class="btn btn-danger" onclick="clearAll()">🗑 清空</button>
<button class="btn btn-outline" onclick="screenshot()">📷 截图</button>
</div>

<div class="info-bar">FPS: <span id="fps">0</span> | 活跃粒子: <span id="count">0</span> | 状态: <span id="state">播放中</span></div>

<script>
const canvas=document.getElementById('pc'),ctx=canvas.getContext('2d');
let W,H,playing=true,frame=0,animId,lastTime=0,fpsCount=0,fpsTime=0;
let effect='fountain',maxParticles=500,velocity=4,gravity=0.15,lifeSpan=120,colorMode='hue';
let particles=[];

function resize(){const r=canvas.parentElement.getBoundingClientRect();W=canvas.width=r.width;H=canvas.height=Math.min(500,r.width*0.6);ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,W,H)}
window.addEventListener('resize',resize);

class Particle{
constructor(x,y,vx,vy,lifetime,color){
this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.life=lifetime||lifeSpan;this.maxLife=this.life;
this.color=color||this.getColor();this.size=Math.random()*3+1;this.rotation=Math.random()*Math.PI*2;this.rotSpeed=(Math.random()-.5)*0.1;
}
getColor(){
if(colorMode==='fire'){const t=this.life/this.maxLife;return`rgb(${255},${Math.floor(100+t*100)},${Math.floor(t*50)})`}
if(colorMode==='white')return`rgba(255,255,255,${this.life/this.maxLife})`;
if(colorMode==='random')return`hsl(${Math.random()*360},80%,60%)`;
return`hsl(${(this.x/W*360+frame)%360},80%,${40+this.life/this.maxLife*30}%)`;
}
update(){
this.vy+=gravity*0.1;this.x+=this.vx;this.y+=this.vy;this.life--;this.rotation+=this.rotSpeed;
if(effect==='smoke'){this.size+=0.05;this.vx*=0.99}
return this.life>0&&this.y<H+50;
}
draw(){
const alpha=this.life/this.maxLife;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rotation);ctx.globalAlpha=alpha;
ctx.fillStyle=this.color;
if(effect==='snow'){ctx.beginPath();ctx.arc(0,0,this.size*1.5,0,Math.PI*2);ctx.fill()}
else if(effect==='confetti'){ctx.fillRect(-this.size,-this.size/2,this.size*2,this.size)}
else{ctx.beginPath();ctx.arc(0,0,this.size,0,Math.PI*2);ctx.fill()}
ctx.globalAlpha=1;ctx.restore();
}
}

function emit(){
const count=Math.min(5,maxParticles-particles.length);
for(let i=0;i<count;i++){
let vx,vy,x,y;
if(effect==='fountain'){
x=W/2+(Math.random()-.5)*10;y=H-20;vx=(Math.random()-.5)*velocity*0.8;vy=-velocity*(1+Math.random());
}else if(effect==='fire'){
x=W/2+(Math.random()-.5)*30;y=H-10;vx=(Math.random()-.5)*1.5;vy=-velocity*(0.5+Math.random()*0.5);
}else if(effect==='smoke'){
x=W/2+(Math.random()-.5)*20;y=H-30;vx=(Math.random()-.5)*0.8;vy=-velocity*0.3;
}else if(effect==='snow'){
x=Math.random()*W;y=-10;vx=Math.sin(frame*0.01+Math.random()*6)*0.5;vy=velocity*0.15+Math.random()*0.5;
}else if(effect==='galaxy'){
const angle=Math.random()*Math.PI*2,r=Math.random()*Math.min(W,H)*0.35;
x=W/2+Math.cos(angle)*r;y=H/2+Math.sin(angle)*r;
vx=-Math.sin(angle)*velocity*0.3+Math.cos(angle)*velocity*0.1;vy=Math.cos(angle)*velocity*0.3+Math.sin(angle)*velocity*0.1;
}else if(effect==='confetti'){
x=W/2+(Math.random()-.5)*20;y=H/3;vx=(Math.random()-.5)*velocity*2;vy=-velocity*(1+Math.random());
}else{
x=W/2;y=H/2;const a=Math.random()*Math.PI*2,s=Math.random()*velocity;vx=Math.cos(a)*s;vy=Math.sin(a)*s;
}
particles.push(new Particle(x,y,vx,vy));
}
}

function burst(){
const bx=W/2+((Math.random()-.5)*W*0.6),by=H/2+((Math.random()-.5)*H*0.4);
for(let i=0;i<100;i++){const a=Math.random()*Math.PI*2,s=Math.random()*velocity*2;particles.push(new Particle(bx,by,Math.cos(a)*s,Math.sin(a)*s,lifeSpan*0.7))}
}

function clearAll(){particles=[]}

function animate(t){
if(!playing){animId=requestAnimationFrame(animate);return}
const dt=t-lastTime;lastTime=t;fpsCount++;
if(t-fpsTime>1000){document.getElementById('fps').textContent=fpsCount;fpsCount=0;fpsTime=t}

ctx.fillStyle=effect==='smoke'?'rgba(10,10,15,0.03)':effect==='snow'?'rgba(10,15,30,0.1)':'rgba(10,10,15,0.15)';
ctx.fillRect(0,0,W,H);

emit();particles=particles.filter(p=>{const alive=p.update();if(alive)p.draw();return alive});
frame++;document.getElementById('count').textContent=particles.length;
animId=requestAnimationFrame(animate);
}

function togglePlay(){playing=!playing;document.getElementById('state').textContent=playing?'播放中':'暂停'}
function screenshot(){const link=document.createElement('a');link.download='particles.png';link.href=canvas.toDataURL();link.click()}

document.getElementById('maxP').oninput=function(){maxParticles=+this.value;this.nextElementSibling.textContent=maxParticles};
document.getElementById('vel').oninput=function(){velocity=+this.value;this.nextElementSibling.textContent=velocity};
document.getElementById('grav').oninput=function(){gravity=+this.value;this.nextElementSibling.textContent=gravity};
document.getElementById('life').oninput=function(){lifeSpan=+this.value;this.nextElementSibling.textContent=lifeSpan};
document.getElementById('colorMode').onchange=function(){colorMode=this.value};

document.getElementById('tabs').addEventListener('click',e=>{
if(!e.target.dataset.e)return;
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');
effect=e.target.dataset.e;particles=[];
});

resize();requestAnimationFrame(animate);
</script>
</body></html>
