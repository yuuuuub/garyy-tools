let currentCat='all',searchTerm='';
function $(id){return document.getElementById(id)}

function renderTable(){
  const t=$('ptable');t.innerHTML='';
  for(let r=1;r<=10;r++){
    for(let c=1;c<=18;c++){
      if((r===6&&(c>=4&&c<=17))||(r===7&&(c>=4&&c<=17))||(r===9&&(c>=3&&c<=17))||(r===10&&(c>=3&&c<=17))){if(r<=7){const ph=document.createElement('div');ph.className='placeholder';t.appendChild(ph);continue}else continue}
      if(r>=8&&r<=10)continue;
      const el=elements.find(e=>e.row===r&&e.col===c);
      if(!el){const ph=document.createElement('div');ph.className='placeholder';t.appendChild(ph);continue}
      const matchesCat=currentCat==='all'||el.cat===currentCat;
      const matchesSearch=!searchTerm||el.name.includes(searchTerm)||el.sym.toLowerCase().includes(searchTerm.toLowerCase())||String(el.n)===searchTerm;
      const d=document.createElement('div');
      d.className='el cat-'+el.cat;
      d.style.opacity=(matchesCat&&matchesSearch)?1:.2;
      d.innerHTML='<span class="z">'+el.n+'</span><span class="sym">'+el.sym+'</span><span class="name">'+el.name+'</span>';
      d.onclick=()=>showDetail(el);
      t.appendChild(d);
    }
  }
  // Lanthanide/Actinide rows
  for(let r=9;r<=10;r++){
    for(let c=3;c<=17;c++){
      const el=elements.find(e=>e.row===r&&e.col===c);
      if(!el)continue;
      const matchesCat=currentCat==='all'||el.cat===currentCat;
      const matchesSearch=!searchTerm||el.name.includes(searchTerm)||el.sym.toLowerCase().includes(searchTerm.toLowerCase())||String(el.n)===searchTerm;
      const d=document.createElement('div');
      d.className='el cat-'+el.cat;
      d.style.opacity=(matchesCat&&matchesSearch)?1:.2;
      d.innerHTML='<span class="z">'+el.n+'</span><span class="sym">'+el.sym+'</span><span class="name">'+el.name+'</span>';
      d.onclick=()=>showDetail(el);
      t.appendChild(d);
    }
  }
}

function showDetail(el){
  const p=$('detail');p.className='detail-panel show';
  const catNames={alkali:'碱金属',alkaline:'碱土金属',transition:'过渡金属','post-trans':'后过渡金属',metalloid:'准金属',nonmetal:'非金属',halogen:'卤素',noble:'稀有气体',lanthanide:'镧系',actinide:'锕系',unknown:'未知'};
  p.innerHTML='<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap"><div class="big-sym cat-'+el.cat+'" style="padding:16px 24px;border-radius:12px;color:#fff">'+el.sym+'</div><div><h2>'+el.name+' ('+el.sym+')</h2><p style="color:var(--text2)">原子序数: '+el.n+' | 原子量: '+el.mass+' | '+catNames[el.cat]+'</p><p style="margin-top:8px">'+el.desc+'</p></div></div><div class="detail-grid"><div class="item"><div class="label">电子构型</div><div class="val">'+el.econfig+'</div></div><div class="item"><div class="label">密度</div><div class="val">'+(el.density||'-')+' g/cm³</div></div><div class="item"><div class="label">熔点</div><div class="val">'+(el.melt!==null?el.melt+'°C':'-')+'</div></div><div class="item"><div class="label">沸点</div><div class="val">'+(el.boil!==null?el.boil+'°C':'-')+'</div></div></div>';
  p.scrollIntoView({behavior:'smooth'});
}

function filterCat(cat,el){currentCat=cat;document.querySelectorAll('.cat-filter span').forEach(s=>s.classList.remove('active'));el.classList.add('active');renderTable()}
function filterTable(){searchTerm=$('search').value.trim();renderTable()}
renderTable();
