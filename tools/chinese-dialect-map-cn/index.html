<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国方言地图</title><meta name="description" content="中国方言地图 - 交互式方言分布探索"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:1000px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}.btn-primary{background:var(--blue);color:#fff}.btn-secondary{background:var(--border);color:var(--text)}.hidden{display:none}.map-container{position:relative;width:100%;aspect-ratio:4/3;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}.map-svg{width:100%;height:100%}.map-region{fill:var(--border);stroke:var(--bg);stroke-width:2;cursor:pointer;transition:all .3s}.map-region:hover{opacity:.8;stroke:var(--blue);stroke-width:3}.map-region.active{stroke:var(--blue);stroke-width:3}.map-label{font-size:11px;fill:var(--text);pointer-events:none;text-anchor:middle;dominant-baseline:central}.map-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;justify-content:center}.legend-item{display:flex;align-items:center;gap:4px;font-size:.75rem;cursor:pointer;padding:4px 8px;border-radius:12px;border:1px solid var(--border);transition:all .2s}.legend-item:hover{border-color:var(--blue)}.legend-item.active{background:var(--blue);color:#fff;border-color:var(--blue)}.legend-dot{width:10px;height:10px;border-radius:50%}.detail-panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:12px}.detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.detail-name{font-size:1.2rem;font-weight:700}.detail-family{font-size:.8rem;padding:4px 10px;border-radius:12px;background:rgba(59,130,246,.15);color:var(--blue)}.detail-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}.stat-box{text-align:center;padding:10px;background:var(--card);border-radius:8px}.stat-box .val{font-size:1.1rem;font-weight:700;color:var(--blue)}.stat-box .lbl{font-size:.75rem;color:var(--text2);margin-top:2px}.detail-section{margin-top:12px}.detail-section h4{font-size:.9rem;color:var(--blue);margin-bottom:6px}.detail-section p{font-size:.85rem;color:var(--text2);line-height:1.6}.phrase-list{margin-top:10px}.phrase-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(48,54,61,.5);font-size:.85rem}.phrase-item:last-child{border:none}.compare-btn{margin-top:12px}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.dialect-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:12px}.dialect-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all .2s}.dialect-card:hover{border-color:var(--blue)}.dialect-card h4{font-size:.95rem;margin-bottom:4px}.dialect-card .speakers{font-size:.8rem;color:var(--text2)}.dialect-card .region{font-size:.75rem;color:var(--blue);margin-top:4px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}</style><meta property="og:title" content="中国方言地图"><meta property="og:description" content="中国方言地图 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>"></head><body>

<div class="container"><h1>🗺️ 中国方言地图</h1><p class="sub">交互式方言分布探索</p>
<div class="map-legend" id="mapLegend"></div>
<div class="map-container"><svg class="map-svg" viewBox="0 0 800 600" id="mapSvg">
<rect width="800" height="600" fill="var(--bg)"/>
<path class="map-region" id="region-guanhua" d="M300,100 L500,80 L550,150 L520,280 L400,300 L350,250 L280,200 Z" data-dialect="官话" onclick="selectDialect('官话')"/>

<text class="map-label" x="510" y="365">客家话</text>
<path class="map-region" id="region-gan" d="M440,290 L500,280 L510,330 L470,340 L430,320 Z" data-dialect="赣语" onclick="selectDialect('赣语')"/>
<text class="map-label" x="470" y="310">赣语</text>
<path class="map-region" id="region-xiang" d="M370,300 L430,290 L440,340 L390,360 L360,340 Z" data-dialect="湘语" onclick="selectDialect('湘语')"/>
<text class="map-label" x="395" y="325">湘语</text>
<path class="map-region" id="region-jin" d="M350,140 L420,130 L430,180 L380,200 L340,180 Z" data-dialect="晋语" onclick="selectDialect('晋语')"/>
<text class="map-label" x="385" y="165">晋语</text>
<path class="map-region" id="region-hui" d="M520,250 L570,240 L580,280 L540,290 Z" data-dialect="徽语" onclick="selectDialect('徽语')"/>
<text class="map-label" x="555" y="265">徽语</text>
<path class="map-region" id="region-ping" d="M340,400 L400,390 L410,430 L360,440 Z" data-dialect="平话" onclick="selectDialect('平话')"/>
<text class="map-label" x="375" y="415">平话</text>
</svg></div>
<div id="detailPanel"></div>
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索方言..." oninput="searchDialects()"></div>
<div class="dialect-list" id="dialectList"></div>
</div>
<script src="../i18n.js" defer></script>
<script>
var dialectData={
'官话':{name:'官话',family:'北方方言',speakers:'8亿+',color:'#3b82f6',regions:['华北','东北','西北','西南','江淮'],desc:'官话是中国最大的方言区，使用人口约8亿，约占全国汉语人口的70%。官话内部差异较小，不同地区的人基本可以互相通话。官话又分为东北官话、北京官话、冀鲁官话、胶辽官话、中原官话、兰银官话、西南官话、江淮官话等八片。',phrases:[{dialect:'你干啥呢',meaning:'你在做什么',region:'东北'},{dialect:'咋了',meaning:'怎么了',region:'河南'},{dialect:'得劲',meaning:'舒服',region:'中原'},{dialect:'巴适',meaning:'舒服',region:'西南'}]},
'吴语':{name:'吴语',family:'吴方言',speakers:'9000万',color:'#238636',regions:['上海','浙江','江苏南部'],desc:'吴语以上海话为代表，使用人口约9000万。吴语保留了较多的古汉语特征，有独特的浊音系统。吴语区是中国经济最发达的地区之一，文化底蕴深厚。上海话、苏州话、杭州话等都是吴语的代表。',phrases:[{dialect:'阿拉',meaning:'我们/我',region:'上海'},{dialect:'侬好',meaning:'你好',region:'上海'},{dialect:'撒度',meaning:'辛苦',region:'苏州'},{dialect:'格种',meaning:'这种',region:'杭州'}]},
'粤语':{name:'粤语',family:'粤方言',speakers:'8000万',color:'#ef4444',regions:['广东','广西','港澳','海外'],desc:'粤语以广州话为代表，使用人口约8000万。粤语保留了大量古汉语特征，有9个声调，是中国方言中声调最多的。粤语在海外华人社区广泛使用，是香港、澳门的官方语言之一。粤语歌曲、电影在华语世界影响深远。',phrases:[{dialect:'你好',meaning:'你好',region:'广州'},{dialect:'唔该',meaning:'谢谢/劳驾',region:'广州'},{dialect:'靓仔',meaning:'帅哥',region:'广东'},{dialect:'冇',meaning:'没有',region:'广东'}]},
'闽语':{name:'闽语',family:'闽方言',speakers:'7500万',color:'#eab308',regions:['福建','台湾','海南','潮汕'],desc:'闽语是历史最悠久的方言之一，内部差异很大，可分为闽南语、闽东语、闽北语、闽中语、莆仙语等。闽南语是闽语中使用最广的分支，在台湾、东南亚华人社区广泛使用。闽语保留了大量上古汉语的特征。',phrases:[{dialect:'吃饱未',meaning:'吃了吗',region:'闽南'},{dialect:'水',meaning:'漂亮',region:'闽南'},{dialect:'厝',meaning:'房子',region:'闽南'},{dialect:'歹势',meaning:'不好意思',region:'闽南'}]},
'客家话':{name:'客家话',family:'客家方言',speakers:'6000万',color:'#a855f7',regions:['广东','江西','福建','台湾'],desc:'客家话是汉族客家民系的语言，使用人口约6000万。客家话保留了较多的中古汉语特征，被称为"古汉语的活化石"。客家人历史上多次南迁，形成了独特的客家文化。客家山歌、围龙屋是客家文化的代表。',phrases:[{dialect:'食饱么',meaning:'吃了吗',region:'梅州'},{dialect:'涯',meaning:'我',region:'客家'},{dialect:'靓',meaning:'漂亮',region:'客家'},{dialect:'做么',meaning:'做什么',region:'客家'}]},
'赣语':{name:'赣语',family:'赣方言',speakers:'5000万',color:'#06b6d4',regions:['江西','湖南东部','湖北东南部'],desc:'赣语以南昌话为代表，使用人口约5000万。赣语区位于中国中部，历史上是南北交通要道。赣语保留了较多的古汉语特征，有独特的浊音系统。南昌、九江、赣州等地的赣语各有特色。',phrases:[{dialect:'恰饭',meaning:'吃饭',region:'南昌'},{dialect:'做么事',meaning:'做什么',region:'南昌'},{dialect:'好靓',meaning:'很漂亮',region:'赣语'},{dialect:'蛮好',meaning:'很好',region:'赣语'}]},
'湘语':{name:'湘语',family:'湘方言',speakers:'4500万',color:'#f97316',regions:['湖南','广西东北部'],desc:'湘语以长沙话为代表，使用人口约4500万。湘语分为新湘语和老湘语，新湘语受官话影响较大，老湘语保留了更多古特征。湘语区文化底蕴深厚，湖南人性格豪爽，"霸蛮"精神闻名全国。',phrases:[{dialect:'搞么子',meaning:'干什么',region:'长沙'},{dialect:'蛮好',meaning:'很好',region:'湖南'},{dialect:'嬲',meaning:'生气',region:'湖南'},{dialect:'恰辣椒',meaning:'吃辣椒',region:'湖南'}]},
'晋语':{name:'晋语',family:'晋方言',speakers:'4500万',color:'#84cc16',regions:['山西','陕西北部','河北西部'],desc:'晋语以太原话为代表，使用人口约4500万。晋语最大的特点是保留了入声，这是北方方言中罕见的特征。晋语区是中国古代文明的重要发源地之一，有着丰富的历史文化积淀。',phrases:[{dialect:'圪蹴',meaning:'蹲下',region:'山西'},{dialect:'咋咧',meaning:'怎么了',region:'山西'},{dialect:'美太太',meaning:'很好',region:'山西'},{dialect:'日怪',meaning:'奇怪',region:'山西'}]},
'徽语':{name:'徽语',family:'徽方言',speakers:'500万',color:'#ec4899',regions:['安徽南部','浙江西部','江西东北部'],desc:'徽语以歙县话为代表，使用人口约500万。徽语是中国方言中较独特的一支，有学者认为它是吴语和赣语之间的过渡方言。徽语区是徽商的发源地，徽派建筑、徽菜、徽剧都是中国文化的瑰宝。',phrases:[{dialect:'侬好',meaning:'你好',region:'徽州'},{dialect:'做啥',meaning:'做什么',region:'徽州'},{dialect:'蛮好',meaning:'很好',region:'徽州'},{dialect:'食',meaning:'吃',region:'徽州'}]},
'平话':{name:'平话',family:'平话方言',speakers:'500万',color:'#f43f5e',regions:['广西','广东西部'],desc:'平话是汉语方言中较为特殊的一支，使用人口约500万。平话主要分布在广西的南宁、柳州等地，以及广东西部。平话保留了较多的古汉语特征，有独特的声调系统。',phrases:[{dialect:'食饭',meaning:'吃饭',region:'广西'},{dialect:'好食',meaning:'好吃',region:'广西'},{dialect:'靓',meaning:'漂亮',region:'广西'},{dialect:'做哪样',meaning:'做什么',region:'广西'}]}
};

var selectedDialect=null;

function init(){
  var legend=document.getElementById('mapLegend');
  var h='';
  Object.keys(dialectData).forEach(function(k){
    var d=dialectData[k];
    h+='<div class="legend-item" onclick="selectDialect(\''+k+'\')" id="legend-'+k+'"><div class="legend-dot" style="background:'+d.color+'"></div><span>'+k+'</span></div>';
  });
  legend.innerHTML=h;
  renderDialectList(dialectData);
  Object.keys(dialectData).forEach(function(k){
    var el=document.getElementById('region-'+k);
    if(el)el.style.fill=dialectData[k].color;
  });
}

function selectDialect(name){
  selectedDialect=name;
  var d=dialectData[name];
  if(!d)return;
  document.querySelectorAll('.map-region').forEach(function(r){r.classList.remove('active')});
  document.querySelectorAll('.legend-item').forEach(function(l){l.classList.remove('active')});
  var regionEl=document.getElementById('region-'+name);
  if(regionEl)regionEl.classList.add('active');
  var legendEl=document.getElementById('legend-'+name);
  if(legendEl)legendEl.classList.add('active');
  var h='<div class="detail-panel"><div class="detail-header"><span class="detail-name">'+d.name+'</span><span class="detail-family">'+d.family+'</span></div>';
  h+='<div class="detail-stats"><div class="stat-box"><div class="val">'+d.speakers+'</div><div class="lbl">使用人口</div></div>';
  h+='<div class="stat-box"><div class="val">'+d.regions.length+'</div><div class="lbl">主要分布区</div></div>';
  h+='<div class="stat-box"><div class="val">'+d.phrases.length+'</div><div class="lbl">收录词条</div></div></div>';
  h+='<div class="detail-section"><h4>📖 简介</h4><p>'+d.desc+'</p></div>';
  h+='<div class="detail-section"><h4>📍 分布地区</h4><p>'+d.regions.join('、')+'</p></div>';
  h+='<div class="detail-section"><h4>💬 方言示例</h4><div class="phrase-list">';
  d.phrases.forEach(function(p){
    h+='<div class="phrase-item"><span><b>'+p.dialect+'</b> <span style="color:var(--text2)">('+p.region+')</span></span><span>'+p.meaning+'</span></div>';
  });
  h+='</div></div></div>';
  document.getElementById('detailPanel').innerHTML=h;
}

function renderDialectList(data){
  var h='';
  Object.keys(data).forEach(function(k){
    var d=data[k];
    h+='<div class="dialect-card" onclick="selectDialect(\''+k+'\')">';
    h+='<h4 style="color:'+d.color+'">'+d.name+' <span style="font-size:.75rem;color:var(--text2)">'+d.family+'</span></h4>';
    h+='<div class="speakers">👥 '+d.speakers+' 使用者</div>';
    h+='<div class="region">📍 '+d.regions.slice(0,3).join('、')+'</div></div>';
  });
  document.getElementById('dialectList').innerHTML=h;
}

function searchDialects(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered={};
  Object.keys(dialectData).forEach(function(k){
    var d=dialectData[k];
    if(k.toLowerCase().includes(q)||d.family.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.regions.join('').toLowerCase().includes(q))filtered[k]=d;
  });
  renderDialectList(filtered);
}

init();
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input');if(inp)inp.focus()}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur()}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0})</script>
</body></html>
