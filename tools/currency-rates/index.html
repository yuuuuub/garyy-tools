<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汇率查询</title>
<meta name="description" content="全球货币汇率实时查询，查看主要货币汇率变动">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#60a5fa;--success:#4ade80;--warning:#fbbf24;--muted:#8b949e;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:600px;margin:0 auto}
h1{font-size:1.5rem;text-align:center;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.conv-row{display:flex;gap:10px;align-items:end;margin-bottom:12px}
.field{flex:1}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.swap-btn{padding:10px 16px;border:2px solid var(--border);border-radius:8px;background:transparent;color:var(--accent);cursor:pointer;font-size:1.2rem;transition:.2s;flex-shrink:0}
.swap-btn:hover{border-color:var(--accent);background:rgba(59,130,246,.1)}
.result-display{text-align:center;padding:16px;background:rgba(59,130,246,.05);border-radius:8px;margin-top:8px}
.result-display .amount{font-size:1.8rem;font-weight:700;color:var(--accent)}
.result-display .rate{font-size:.85rem;color:var(--muted);margin-top:4px}
.fav-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fav-chip{padding:6px 12px;border:1px solid var(--border);border-radius:16px;font-size:.8rem;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:4px}
.fav-chip.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
.table-wrap{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase}
td{font-family:monospace}
.chart-container{height:150px;position:relative;margin-top:12px}
.chart-container canvas{width:100%;height:100%}
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.85rem;outline:none}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="汇率查询">
  <meta property="og:description" content="全球货币汇率实时查询，查看主要货币汇率变动">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/currency-rates/">
</head>
<body>
<div class="container">
<h1>💱 汇率查询</h1>

<div class="card">
<div class="conv-row">
<div class="field"><label>金额</label><input type="number" id="amount" value="100" min="0" step="0.01" oninput="convert()"></div>
<button class="swap-btn" onclick="swap()">⇄</button>
</div>
<div class="conv-row">
<div class="field"><label>从</label><select id="fromCurrency" onchange="convert()"></select></div>
<div class="field"><label>到</label><select id="toCurrency" onchange="convert()"></select></div>
</div>
<div class="result-display"><div class="amount" id="resultAmount">--</div><div class="rate" id="resultRate"></div></div>
<div class="chart-container"><canvas id="chart"></canvas></div>
</div>

<div class="card">
<h2 style="font-size:.95rem;margin-bottom:8px">收藏货币</h2>
<div class="fav-grid" id="favGrid"></div>
</div>

<div class="card">
<h2 style="font-size:.95rem;margin-bottom:8px">主要汇率表</h2>
<div class="search-wrap"><input type="text" id="tableSearch" placeholder="搜索货币..." oninput="filterTable()"></div>
<div class="table-wrap"><table><thead><tr><th>货币</th><th>代码</th><th>汇率</th><th>涨跌</th></tr></thead><tbody id="rateTable"></tbody></table></div>
</div>
</div>

<script>
const currencies = {
  CNY:{name:'人民币',symbol:'¥',flag:'🇨🇳'},USD:{name:'美元',symbol:'$',flag:'🇺🇸'},
  EUR:{name:'欧元',symbol:'€',flag:'🇪🇺'},GBP:{name:'英镑',symbol:'£',flag:'🇬🇧'},
  JPY:{name:'日元',symbol:'¥',flag:'🇯🇵'},KRW:{name:'韩元',symbol:'₩',flag:'🇰🇷'},
  SGD:{name:'新加坡元',symbol:'S$',flag:'🇸🇬'},HKD:{name:'港元',symbol:'HK$',flag:'🇭🇰'},
  TWD:{name:'新台币',symbol:'NT$',flag:'🇹🇼'},THB:{name:'泰铢',symbol:'฿',flag:'🇹🇭'},
  AUD:{name:'澳元',symbol:'A$',flag:'🇦🇺'},CAD:{name:'加元',symbol:'C$',flag:'🇨🇦'},
  CHF:{name:'瑞士法郎',symbol:'Fr',flag:'🇨🇭'},SEK:{name:'瑞典克朗',symbol:'kr',flag:'🇸🇪'},
  NOK:{name:'挪威克朗',symbol:'kr',flag:'🇳🇴'},DKK:{name:'丹麦克朗',symbol:'kr',flag:'🇩🇰'},
  INR:{name:'印度卢比',symbol:'₹',flag:'🇮🇳'},RUB:{name:'俄罗斯卢布',symbol:'₽',flag:'🇷🇺'},
  BRL:{name:'巴西雷亚尔',symbol:'R$',flag:'🇧🇷'},MXN:{name:'墨西哥比索',symbol:'$',flag:'🇲🇽'},
  ZAR:{name:'南非兰特',symbol:'R',flag:'🇿🇦'},TRY:{name:'土耳其里拉',symbol:'₺',flag:'🇹🇷'},
  MYR:{name:'林吉特',symbol:'RM',flag:'🇲🇾'},IDR:{name:'印尼盾',symbol:'Rp',flag:'🇮🇩'},
  PHP:{name:'菲律宾比索',symbol:'₱',flag:'🇵🇭'},VND:{name:'越南盾',symbol:'₫',flag:'🇻🇳'},
  EGP:{name:'埃及镑',symbol:'E£',flag:'🇪🇬'},AED:{name:'阿联酋迪拉姆',symbol:'د.إ',flag:'🇦🇪'},
  SAR:{name:'沙特里亚尔',symbol:'﷼',flag:'🇸🇦'},NZD:{name:'新西兰元',symbol:'NZ$',flag:'🇳🇿'}
};

const baseRates = {
  CNY:1,USD:0.138,EUR:0.127,GBP:0.109,JPY:21.3,KRW:188.5,SGD:0.187,HKD:1.078,
  TWD:4.43,THB:4.92,AUD:0.212,CAD:0.189,CHF:0.124,SEK:1.48,NOK:1.52,DKK:0.945,
  INR:11.52,RUB:12.8,BRL:0.692,MXN:2.38,ZAR:2.65,TRY:4.52,MYR:0.658,IDR:2175,
  PHP:7.88,VND:3420,EGP:6.72,AED:0.507,SAR:0.518,NZD:0.228
};

let favorites = new Set(['USD','EUR','GBP','JPY','KRW']);
let chartData = {};

function init() {
  populateSelects();
  renderFavorites();
  renderTable();
  generateChartData();
  convert();
  drawChart();
}

function populateSelects() {
  const from = document.getElementById('fromCurrency');
  const to = document.getElementById('toCurrency');
  from.innerHTML = ''; to.innerHTML = '';
  Object.entries(currencies).forEach(([code, c]) => {
    from.innerHTML += `<option value="${code}">${c.flag} ${c.name} (${code})</option>`;
    to.innerHTML += `<option value="${code}">${c.flag} ${c.name} (${code})</option>`;
  });
  from.value = 'USD'; to.value = 'CNY';
}

function convert() {
  const amount = parseFloat(document.getElementById('amount').value) || 0;
  const from = document.getElementById('fromCurrency').value;
  const to = document.getElementById('toCurrency').value;
  const rateFrom = baseRates[from];
  const rateTo = baseRates[to];
  const result = amount * rateTo / rateFrom;
  const rate1 = rateTo / rateFrom;
  const rate2 = rateFrom / rateTo;
  document.getElementById('resultAmount').textContent = `${currencies[to].symbol} ${result.toFixed(2)}`;
  document.getElementById('resultRate').textContent = `1 ${from} = ${rate1.toFixed(4)} ${to} | 1 ${to} = ${rate2.toFixed(4)} ${from}`;
  updateChart(from, to);
}

function swap() {
  const f = document.getElementById('fromCurrency');
  const t = document.getElementById('toCurrency');
  [f.value, t.value] = [t.value, f.value];
  convert();
}

function renderFavorites() {
  const grid = document.getElementById('favGrid');
  grid.innerHTML = '';
  favorites.forEach(code => {
    const c = currencies[code];
    const chip = document.createElement('div');
    chip.className = 'fav-chip';
    chip.innerHTML = `${c.flag} ${code}`;
    chip.onclick = () => {
      document.getElementById('toCurrency').value = code;
      convert();
    };
    chip.ondblclick = () => { favorites.delete(code); renderFavorites(); };
    grid.appendChild(chip);
  });
}

function renderTable(filter = '') {
  const tbody = document.getElementById('rateTable');
  tbody.innerHTML = '';
  Object.entries(currencies).forEach(([code, c]) => {
    if (filter && !c.name.includes(filter) && !code.includes(filter.toUpperCase())) return;
    const rate = (baseRates[code] / baseRates.USD).toFixed(4);
    const change = ((Math.random() - 0.5) * 2).toFixed(2);
    const color = change >= 0 ? 'var(--success)' : 'var(--danger)';
    tbody.innerHTML += `<tr><td>${c.flag} ${c.name}</td><td>${code}</td><td>${rate}</td><td style="color:${color}">${change >= 0 ? '+' : ''}${change}%</td></tr>`;
  });
}

function filterTable() {
  renderTable(document.getElementById('tableSearch').value);
}

function generateChartData() {
  const from = document.getElementById('fromCurrency').value;
  const to = document.getElementById('toCurrency').value;
  const rate = baseRates[to] / baseRates[from];
  chartData = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    chartData.push({ label: `${d.getMonth()+1}/${d.getDate()}`, value: rate * (0.97 + Math.random() * 0.06) });
  }
}

function updateChart(from, to) {
  const rate = baseRates[to] / baseRates[from];
  chartData = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    chartData.push({ label: `${d.getMonth()+1}/${d.getDate()}`, value: rate * (0.97 + Math.random() * 0.06) });
  }
  drawChart();
}

function drawChart() {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  const pad = { top: 10, right: 10, bottom: 20, left: 50 };
  const pw = w - pad.left - pad.right;
  const ph = h - pad.top - pad.bottom;
  if (!chartData.length) return;
  const values = chartData.map(d => d.value);
  const min = Math.min(...values) * 0.999;
  const max = Math.max(...values) * 1.001;

  ctx.strokeStyle = '#30363d'; ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (ph / 4) * i;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
  }

  ctx.beginPath();
  const gradient = ctx.createLinearGradient(0, pad.top, 0, h - pad.bottom);
  gradient.addColorStop(0, 'rgba(59,130,246,0.3)');
  gradient.addColorStop(1, 'rgba(59,130,246,0)');
  ctx.fillStyle = gradient;
  ctx.moveTo(pad.left, h - pad.bottom);
  chartData.forEach((d, i) => {
    const x = pad.left + (pw / (chartData.length - 1)) * i;
    const y = pad.top + ph - ((d.value - min) / (max - min)) * ph;
    ctx.lineTo(x, y);
  });
  ctx.lineTo(pad.left + pw, h - pad.bottom);
  ctx.fill();

  ctx.beginPath();
  ctx.strokeStyle = 'var(--accent)'; ctx.lineWidth = 2;
  chartData.forEach((d, i) => {
    const x = pad.left + (pw / (chartData.length - 1)) * i;
    const y = pad.top + ph - ((d.value - min) / (max - min)) * ph;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  chartData.forEach((d, i) => {
    const x = pad.left + (pw / (chartData.length - 1)) * i;
    ctx.fillStyle = '#8b949e'; ctx.font = '9px sans-serif';
    ctx.fillText(d.label, x - 10, h - 4);
  });
}

init();
</script>
<script src="../i18n.js">
document.getElementById("tableSearch").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();swap();}});
</script>
</body>
</html>
