<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎹 音阶练习</title>
<meta property="og:title" content="🎹 音阶练习">
<meta property="og:description" content="🎹 音阶练习 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线音阶练习工具，支持多种音阶类型试听、钢琴键盘可视化和练习模式">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.key-selector{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.key-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:13px;cursor:pointer;transition:all .2s;font-weight:600}
.key-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.scale-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.scale-btn{padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;text-align:left}
.scale-btn.active{border-color:var(--accent);background:var(--tag-bg);color:var(--tag-text)}
.scale-btn .sn{font-weight:700;font-size:13px}
.scale-btn .si{font-size:10px;color:var(--text-secondary);margin-top:2px}
.piano-wrap{overflow-x:auto;margin:12px 0;padding:10px 0}
.piano{display:flex;position:relative;height:120px;min-width:600px}
.pkey{flex:1;border-radius:0 0 6px 6px;cursor:pointer;transition:all .1s;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.pkey-white{background:var(--card-bg);border:1px solid var(--border);z-index:1}
.pkey-white:active,.pkey-white.playing{background:var(--accent)!important;color:#fff}
.pkey-black{background:var(--text);width:5%;margin-left:-2.5%;margin-right:-2.5%;z-index:2;height:65%;position:absolute;border-radius:0 0 4px 4px}
.pkey-black:active,.pkey-black.playing{background:var(--accent-hover)!important}
.pkey.in-scale.pkey-white{background:var(--tag-bg);border-color:var(--accent)}
.pkey.in-scale.pkey-black{background:var(--accent)}
.pkey.root-note{background:var(--red)!important;color:#fff!important}
.pkey-label{font-size:9px;color:var(--text-secondary)}
.info-row{display:flex;gap:12px;margin:10px 0;flex-wrap:wrap}
.info-tag{padding:6px 10px;border-radius:6px;background:var(--tag-bg);color:var(--tag-text);font-size:11px;font-weight:600}
.play-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.play-btn{padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;font-weight:600}
.play-btn:hover{border-color:var(--accent);background:var(--tag-bg)}
.play-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.play-btn.primary:hover{background:var(--accent-hover)}
.footer{text-align:center;padding:20px 0;font-size:12px;color:var(--text-secondary)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🎹 音阶练习</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">🔑 选择根音</div>
<div class="key-selector" id="keySelector"></div>
</div>
<div class="card">
<div class="card-title">🎼 音阶类型</div>
<div class="scale-grid" id="scaleGrid"></div>
</div>
<div class="card">
<div class="card-title">🎹 钢琴键盘</div>
<div class="piano-wrap"><div class="piano" id="piano"></div></div>
<div class="info-row" id="scaleInfo"></div>
<div class="play-row">
<button class="play-btn primary" onclick="playScaleUp()">⬆ 上行</button>
<button class="play-btn primary" onclick="playScaleDown()">⬇ 下行</button>
<button class="play-btn" onclick="playScaleUpDown()">↕ 上下行</button>
<button class="play-btn" onclick="playAllNotes()">🎵 逐个试听</button>
</div>
</div>
<div class="footer">音阶练习 - Web Audio API | 点击琴键试听</div>
</div>
<script>
let audioCtx,currentKey='C',currentScale=0,isPlaying=false;
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SCALES=[
{name:'自然大调',intervals:[0,2,4,5,7,9,11],formula:'全全半全全全半'},
{name:'自然小调',intervals:[0,2,3,5,7,8,10],formula:'全半全全半全全'},
{name:'和声小调',intervals:[0,2,3,5,7,8,11],formula:'全半全全半增半'},
{name:'旋律小调',intervals:[0,2,3,5,7,9,11],formula:'上行全半全全全全半'},
{name:'五声音阶(大)',intervals:[0,2,4,7,9],formula:'全全小三全小三'},
{name:'五声音阶(小)',intervals:[0,3,5,7,10],formula:'小三全全小三全'},
{name:'蓝调音阶',intervals:[0,3,5,6,7,10],formula:'小三全半半小三'},
{name:'全音音阶',intervals:[0,2,4,6,8,10],formula:'全全全全全'},
{name:'减七音阶',intervals:[0,1,3,4,6,7,9,10],formula:'半全半全半全半全'},
{name:'半全减音阶',intervals:[0,1,3,4,6,7,9,10],formula:'半全半全半全半全'},
{name:'弗里几亚',intervals:[0,1,3,5,7,8,10],formula:'半全全全半全全'},
{name:'利底亚',intervals:[0,2,4,6,7,9,11],formula:'全全全半全全半'},
{name:'混合利底亚',intervals:[0,2,4,5,7,9,10],formula:'全全半全全半全'},
{name:'中国五声',intervals:[0,2,4,7,9],formula:'宫商角徵羽'}
];
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playNote(noteIdx,delay=0,dur=0.5){initAudio();const freq=440*Math.pow(2,(noteIdx-69)/12);const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;g.gain.setValueAtTime(0.3,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+delay+dur);osc.connect(g);g.connect(audioCtx.destination);osc.start(audioCtx.currentTime+delay);osc.stop(audioCtx.currentTime+delay+dur)}
function highlightKey(noteIdx,duration=400){const el=document.querySelector(`.pkey[data-note="${noteIdx}"]`);if(!el)return;el.classList.add('playing');setTimeout(()=>el.classList.remove('playing'),duration)}
function getScaleNotes(){const rootIdx=NOTES.indexOf(currentKey);return SCALES[currentScale].intervals.map(i=>(rootIdx+i)%12)}
function buildKeySelector(){document.getElementById('keySelector').innerHTML=NOTES.map(n=>`<button class="key-btn${n===currentKey?' active':''}" onclick="selectKey('${n}')">${n}</button>`).join('')}
function selectKey(n){currentKey=n;buildKeySelector();buildPiano();buildInfo()}
function buildScaleGrid(){document.getElementById('scaleGrid').innerHTML=SCALES.map((s,i)=>`<button class="scale-btn${i===currentScale?' active':''}" onclick="selectScale(${i})"><div class="sn">${s.name}</div><div class="si">${s.formula}</div></button>`).join('')}
function selectScale(i){currentScale=i;buildScaleGrid();buildPiano();buildInfo()}
function buildPiano(){const el=document.getElementById('piano');const scaleNotes=getScaleNotes();const rootIdx=NOTES.indexOf(currentKey);let html='';for(let i=0;i<12;i++){const isBlack=[1,3,6,8,10].includes(i);const inScale=scaleNotes.includes(i);const isRoot=i===rootIdx;const cls=['pkey',isBlack?'pkey-black':'pkey-white'];if(inScale)cls.push('in-scale');if(isRoot)cls.push('root-note');html+=`<div class="${cls.join(' ')}" data-note="${i}" onclick="playSingleNote(${i})"><span class="pkey-label">${NOTES[i]}</span></div>`}el.innerHTML=html}
function buildInfo(){const scale=SCALES[currentScale];const notes=getScaleNotes();document.getElementById('scaleInfo').innerHTML=`<span class="info-tag">音阶: ${scale.name}</span><span class="info-tag">组成: ${notes.map(n=>NOTES[n]).join(' ')}</span><span class="info-tag">音程: ${scale.formula}</span>`}
function playSingleNote(noteIdx){if(isPlaying)return;playNote(noteIdx+60);highlightKey(noteIdx)}
async function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function playScaleUp(){if(isPlaying)return;isPlaying=true;const notes=getScaleNotes();for(let i=0;i<notes.length;i++){const midi=notes[i]+60;playNote(midi,0,0.4);highlightKey(notes[i],400);await sleep(400)}isPlaying=false}
async function playScaleDown(){if(isPlaying)return;isPlaying=true;const notes=getScaleNotes().slice().reverse();for(let i=0;i<notes.length;i++){const midi=notes[i]+60;playNote(midi,0,0.4);highlightKey(notes[i],400);await sleep(400)}isPlaying=false}
async function playScaleUpDown(){if(isPlaying)return;isPlaying=true;const notes=getScaleNotes();const full=[...notes,...notes.slice().reverse()];for(let i=0;i<full.length;i++){const midi=full[i]+60;playNote(midi,0,0.4);highlightKey(full[i],400);await sleep(400)}isPlaying=false}
async function playAllNotes(){if(isPlaying)return;isPlaying=true;for(let i=0;i<12;i++){playNote(i+60,0,0.5);highlightKey(i,500);await sleep(500)}isPlaying=false}
buildKeySelector();buildScaleGrid();buildPiano();buildInfo();
</script>
</body>
</html>
