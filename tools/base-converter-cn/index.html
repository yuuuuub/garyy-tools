<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进制转换器 - 在线数字进制转换工具</title>
<meta property="og:title" content="进制转换器 - 在线数字进制转换工具">
<meta property="og:description" content="进制转换器 - 在线数字进制转换工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线进制转换器 - 支持二进制、八进制、十进制、十六进制等任意进制互转">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<script src="../i18n.js" defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {--green:#238636;--red:#ef4444;--blue:#3b82f6;
  --bg: #0d1117; --bg-card: #161b22; --bg-input: #0d1117;
  --border: #30363d; --text: #e6edf3; --text-secondary: #8b949e;
  --accent: #58a6ff; --accent-hover: #79c0ff; --danger: #f85149;
  --success: #3fb950; --warning: #d2991d; --radius: 8px;
}
[data-theme="light"] { --bg: #f6f8fa; --bg-card: #fff; --bg-input: #fff; --border: #d0d7de; --text: #1f2328; --text-secondary: #656d76; --accent: #0969da; --accent-hover: #0550ae; --danger: #cf222e; --success: #1a7f37; --warning: #9a6700; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; line-height: 1.6; }
.container { max-width: 900px; margin: 0 auto; }
h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), #bc8cff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 8px; }
.subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 32px; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
.card h2 { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
label { display: block; font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 4px; margin-top: 12px; }
input, select, textarea { width: 100%; padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.95rem; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; font-family: monospace; }
.row { display: flex; gap: 12px; align-items: flex-end; }
.row > * { flex: 1; }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: 0.2s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 6px 12px; font-size: 0.8rem; }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 0.9rem; z-index: 1000; animation: slideIn 0.3s ease; }
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
.result-item { padding: 16px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; }
.result-item .base-name { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }
.result-item .value { font-family: monospace; font-size: 0.95rem; word-break: break-all; }
.result-item .copy-btn { cursor: pointer; color: var(--accent); font-size: 0.8rem; margin-top: 4px; display: inline-block; }
.result-item .copy-btn:hover { text-decoration: underline; }
.active-base { border-color: var(--accent); }
.bits-display { margin-top: 12px; padding: 12px; background: var(--bg-input); border-radius: 6px; font-family: monospace; font-size: 0.8rem; word-break: break-all; }
.bit-group { display: inline-block; margin-right: 8px; }
.bit-group-label { font-size: 0.7rem; color: var(--text-secondary); display: block; margin-bottom: 2px; }
.bit-group-value { letter-spacing: 1px; }
.custom-base { margin-top: 12px; padding: 12px; background: var(--bg-input); border-radius: 6px; }
.bit-length { font-size: 0.8rem; color: var(--text-secondary); margin-top: 8px; }

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
  <h1>🔢 进制转换器</h1>
  <p class="subtitle">二进制 / 八进制 / 十进制 / 十六进制 任意进制互转</p>

  <div class="card">
    <h2>📝 输入数值</h2>
    <div class="row">
      <div style="flex:2">
        <label>数值</label>
        <input id="input-value" placeholder="输入数值" oninput="convert()" style="font-family:monospace;font-size:1.1rem">
      </div>
      <div style="flex:1">
        <label>输入进制</label>
        <select id="input-base" onchange="convert()">
          <option value="10" selected>十进制 (10)</option>
          <option value="2">二进制 (2)</option>
          <option value="8">八进制 (8)</option>
          <option value="16">十六进制 (16)</option>
          <option value="3">三进制 (3)</option>
          <option value="4">四进制 (4)</option>
          <option value="5">五进制 (5)</option>
          <option value="6">六进制 (6)</option>
          <option value="12">十二进制 (12)</option>
          <option value="20">二十进制 (20)</option>
          <option value="32">三十二进制 (32)</option>
          <option value="36">三十六进制 (36)</option>
          <option value="64">六十四进制 (64)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>📊 转换结果</h2>
    <div class="result-grid" id="result-grid"></div>
  </div>

  <div class="card">
    <h2>🔢 二进制位分析</h2>
    <div class="bits-display" id="bits-display">输入数值后显示二进制位分析</div>
    <div class="bit-length" id="bit-length"></div>
  </div>

  <div class="card">
    <h2>⚙️ 自定义进制转换</h2>
    <div class="info-box" style="padding:8px;background:var(--bg-input);border-radius:6px;font-size:0.85rem;color:var(--text-secondary);margin-bottom:12px">支持2~64进制转换</div>
    <div class="row">
      <div>
        <label>数值</label>
        <input id="custom-value" placeholder="输入数值" style="font-family:monospace">
      </div>
    </div>
    <div class="row">
      <div>
        <label>源进制</label>
        <input id="custom-from" type="number" value="10" min="2" max="64">
      </div>
      <div>
        <label>目标进制</label>
        <input id="custom-to" type="number" value="2" min="2" max="64">
      </div>
      <div style="flex:0">
        <button class="btn btn-primary" onclick="customConvert()" style="margin-top:20px">转换</button>
      </div>
    </div>
    <div id="custom-result" style="margin-top:12px;font-family:monospace;min-height:24px"></div>
  </div>

  <div class="card">
    <h2>📋 常用进制对照表</h2>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:0.85rem">
        <thead><tr style="border-bottom:1px solid var(--border)"><th style="padding:8px">十进制</th><th style="padding:8px">二进制</th><th style="padding:8px">八进制</th><th style="padding:8px">十六进制</th></tr></thead>
        <tbody id="ref-table"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const DIGITS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz+/';

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function toBase(numStr, fromBase, toBase) {
  fromBase = parseInt(fromBase);
  toBase = parseInt(toBase);
  if (fromBase < 2 || fromBase > 64 || toBase < 2 || toBase > 64) throw new Error('进制范围: 2-64');

  const isNegative = numStr.startsWith('-');
  if (isNegative) numStr = numStr.slice(1);

  let num = BigInt(0);
  for (const c of numStr.toUpperCase()) {
    const val = DIGITS.indexOf(c);
    if (val === -1 || val >= fromBase) throw new Error('无效字符: ' + c);
    num = num * BigInt(fromBase) + BigInt(val);
  }

  if (num === BigInt(0)) return '0';
  let result = '';
  while (num > BigInt(0)) {
    result = DIGITS[Number(num % BigInt(toBase))] + result;
    num = num / BigInt(toBase);
  }
  return (isNegative ? '-' : '') + result;
}

function convert() {
  const value = document.getElementById('input-value').value.trim();
  const fromBase = parseInt(document.getElementById('input-base').value);
  const grid = document.getElementById('result-grid');
  const bitsDisplay = document.getElementById('bits-display');
  const bitLength = document.getElementById('bit-length');

  if (!value) {
    grid.innerHTML = '';
    bitsDisplay.textContent = '输入数值后显示二进制位分析';
    bitLength.textContent = '';
    return;
  }

  const bases = [
    { name: '二进制', base: 2 },
    { name: '八进制', base: 8 },
    { name: '十进制', base: 10 },
    { name: '十六进制', base: 16 },
    { name: '三十二进制', base: 32 },
    { name: '三十六进制', base: 36 }
  ];

  let html = '';
  const results = {};
  for (const b of bases) {
    try {
      const result = toBase(value, fromBase, b.base);
      results[b.base] = result;
      html += `<div class="result-item${b.base === fromBase ? ' active-base' : ''}">
        <div class="base-name">${b.name} (${b.base})</div>
        <div class="value">${result}</div>
        <span class="copy-btn" onclick="copyVal('${result}')">复制</span>
      </div>`;
    } catch (e) {
      html += `<div class="result-item"><div class="base-name">${b.name} (${b.base})</div><div class="value" style="color:var(--danger)">错误: ${e.message}</div></div>`;
    }
  }
  grid.innerHTML = html;

  try {
    const binary = results[2] || toBase(value, fromBase, 2);
    const cleanBinary = binary.replace(/^-/, '');
    const padded = cleanBinary.padStart(Math.ceil(cleanBinary.length / 8) * 8, '0');
    let bitsHtml = '';
    for (let i = 0; i < padded.length; i += 8) {
      const byte = padded.substr(i, 8);
      bitsHtml += `<span class="bit-group"><span class="bit-group-label">Byte ${i / 8}</span><span class="bit-group-value">${byte}</span></span>`;
    }
    bitsDisplay.innerHTML = bitsHtml || '00000000';
    bitLength.textContent = `位长度: ${cleanBinary.length} 位, ${Math.ceil(cleanBinary.length / 8)} 字节`;
  } catch (e) {
    bitsDisplay.textContent = '无法分析';
    bitLength.textContent = '';
  }
}

function copyVal(val) {
  navigator.clipboard.writeText(val);
  toast('已复制');
}

function customConvert() {
  const value = document.getElementById('custom-value').value.trim();
  const from = document.getElementById('custom-from').value;
  const to = document.getElementById('custom-to').value;
  const resultBox = document.getElementById('custom-result');
  if (!value) { toast('请输入数值', 'error'); return; }
  try {
    const result = toBase(value, from, to);
    resultBox.innerHTML = `<span style="color:var(--success);font-weight:600">${result}</span> <span class="copy-btn" onclick="copyVal('${result}')">复制</span>`;
  } catch (e) {
    resultBox.innerHTML = `<span style="color:var(--danger)">错误: ${e.message}</span>`;
  }
}

function populateRefTable() {
  const tbody = document.getElementById('ref-table');
  let html = '';
  for (let i = 0; i <= 31; i++) {
    html += `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:8px;text-align:center">${i}</td>
      <td style="padding:8px;font-family:monospace">${i.toString(2)}</td>
      <td style="padding:8px;font-family:monospace">${i.toString(8)}</td>
      <td style="padding:8px;font-family:monospace">${i.toString(16).toUpperCase()}</td>
    </tr>`;
  }
  tbody.innerHTML = html;
}
populateRefTable();
</script>
</body>
</html>
