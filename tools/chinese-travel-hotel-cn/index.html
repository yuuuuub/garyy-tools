<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国旅行住宿指南 - Chinese Travel Hotel Guide</title>
<meta name="description" content="中国旅行住宿指南，酒店选择、预订技巧与住宿安全全攻略">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国旅行住宿指南 - Chinese Travel Hotel Guide">
<meta property="og:description" content="中国旅行住宿指南，酒店选择、预订技巧与住宿安全全攻略">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏨</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e11d48;--accent2:#be123c}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#e11d48;--accent2:#be123c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0510 0%,#2d0a1a 50%,#3d0f24 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #9f1239;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e11d48,#fb7185,#f43f5e,#fda4af);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.hotel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px}
.hotel-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.hotel-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.hotel-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.hotel-card .h-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hotel-card .h-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(225,29,72,0.15);color:var(--accent)}
.hotel-card .h-name{font-size:1.2em;font-weight:bold}
.hotel-card .h-en{font-size:0.8em;color:var(--text2);margin-top:2px}
.hotel-card .h-price{display:flex;align-items:baseline;gap:4px;margin:8px 0}
.hotel-card .h-price .amount{font-size:1.5em;font-weight:700;color:var(--accent)}
.hotel-card .h-price .unit{font-size:0.8em;color:var(--text2)}
.hotel-card .h-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.hotel-card .h-tags span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.hotel-card .h-content{font-size:0.85em;color:var(--text2);line-height:1.8;margin-bottom:8px}
.hotel-card .h-content strong{color:var(--text)}
.hotel-card .h-tips{margin-top:8px;font-size:0.8em;color:var(--accent);padding:8px 12px;background:rgba(225,29,72,0.05);border-radius:8px}
.hotel-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.hotel-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🏨 中国旅行住宿指南</h1>
<p>Chinese Travel Hotel Guide — 住得好，玩得才好</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索住宿类型...（如"民宿""青旅""五星"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="经济型">💰 经济型</button>
<button class="filter-btn" data-filter="舒适型">⭐ 舒适型</button>
<button class="filter-btn" data-filter="豪华型">👑 豪华型</button>
<button class="filter-btn" data-filter="特色住宿">🎨 特色住宿</button>
<button class="filter-btn" data-filter="预订技巧">📱 预订技巧</button>
</div>
<div class="hotel-grid" id="hotelGrid"></div>
<footer><p>🏨 中国旅行住宿指南 — 好的住宿是旅行的一半</p></footer>
</div>
<script>
const HOTEL_DATA=[
{id:1,name:"经济型连锁酒店",en:"Budget Chain Hotels",category:"经济型",icon:"🏨",price:"¥100-200",tags:["干净","标准化","24小时"],content:"如家、汉庭、7天、锦江之星等。全国连锁，品质标准统一。<strong>干净卫生</strong>，适合商旅和背包客。部分提供免费早餐和WiFi。",tips:"连锁会员价通常比OTA便宜10-20%"},
{id:2,name:"青年旅舍",en:"Youth Hostel",category:"经济型",icon:"🛏️",price:"¥30-80/床位",tags:["社交","背包客","氛围好"],content:"适合<strong>独自旅行</strong>和背包客。多人间床位最便宜，也有双人间。公共区域是交友的好地方。丽江、大理、阳朔的青旅氛围最好。",tips:"旺季提前预订，自带洗漱用品"},
{id:3,name:"中档酒店",en:"Mid-Range Hotels",category:"舒适型",icon:"⭐",price:"¥300-600",tags:["舒适","服务好","早餐"],content:"全季、亚朵、维也纳、桔子水晶等。<strong>品质与价格的最佳平衡</strong>。设施齐全，服务规范，通常含早餐。亚朵的阅读氛围很受欢迎。",tips:"亚朵会员权益好，全季性价比高"},
{id:4,name:"高端商务酒店",en:"Business Hotels",category:"豪华型",icon:"🏢",price:"¥600-1500",tags:["商务","设施全","行政酒廊"],content:"万豪、希尔顿、洲际等国际品牌。<strong>服务标准全球统一</strong>，适合商务出行。行政楼层有专属礼遇，泳池健身房齐全。",tips:"会员积分可兑换免费住宿"},
{id:5,name:"豪华度假酒店",en:"Luxury Resorts",category:"豪华型",icon:"👑",price:"¥1500+",tags:["顶级","度假","SPA"],content:"安缦、悦榕庄、半岛、四季等。<strong>极致体验</strong>，私人管家服务。三亚、杭州、丽江是热门度假地。海景房和SPA是亮点。",tips:"提前预订有早鸟价，含早餐套餐更划算"},
{id:6,name:"民宿/客栈",en:"B&B / Guesthouse",category:"特色住宿",icon:"🏡",price:"¥150-500",tags:["本地体验","特色","人情味"],content:"通过<strong>美团、途家、小猪</strong>预订。有当地特色，能体验地道生活。丽江古城、厦门鼓浪屿、杭州西湖边的民宿各有风格。",tips:"看评价选，照片可能有偏差"},
{id:7,name:"精品酒店",en:"Boutique Hotels",category:"特色住宿",icon:"🎨",price:"¥500-2000",tags:["设计感","独特","体验"],content:"<strong>设计感十足</strong>，每家都有独特主题。通常由老建筑改造，融合现代设计与历史文化。北京胡同、上海弄堂里的精品酒店很有味道。",tips:"小红书搜评价，适合拍照打卡"},
{id:8,name:"露营/帐篷",en:"Camping / Glamping",category:"特色住宿",icon:"⛺",price:"¥100-800",tags:["亲近自然","户外","星空"],content:"<strong>精致露营(Glamping)</strong>近年流行。配备舒适的床铺和设施。内蒙古草原、新疆喀纳斯、云南香格里拉是热门露营地。",tips:"注意防蚊虫，带好防晒和保暖装备"},
{id:9,name:"预订平台对比",en:"Booking Platforms",category:"预订技巧",icon:"📱",price:"对比选择",tags:["携程","美团","飞猪"],content:"<strong>携程</strong>：覆盖面广，客服好；<strong>美团</strong>：价格最低，本地酒店优势；<strong>飞猪</strong>：阿里系，信用住方便；<strong>Booking</strong>：国际酒店和外宾友好。",tips:"同一酒店多平台比价，会员叠加优惠"},
{id:10,name:"省钱技巧",en:"Money-Saving Tips",category:"预订技巧",icon:"💡",price:"省15-40%",tags:["提前","会员","错峰"],content:"<strong>提前14天</strong>预订通常最便宜。周中比周末便宜。关注平台会员日（携程每周三、美团每周二）。连锁酒店官方APP价格往往最低。",tips:"国庆/春节价格翻倍，提前1个月订"},
{id:11,name:"入住须知",en:"Check-in Tips",category:"预订技巧",icon:"📋",price:"必备证件",tags:["身份证","押金","发票"],content:"入住必须出示<strong>身份证或护照</strong>。部分酒店收押金（现金或预授权）。退房后索要发票用于报销。<strong>下午2点后入住</strong>，中午12点前退房。",tips:"拍照记录房间现状，退房不扯皮"},
{id:12,name:"住宿安全",en:"Hotel Safety",category:"预订技巧",icon:"🔒",price:"安全第一",tags:["锁门","安全","隐私"],content:"入住后<strong>检查门锁</strong>和安全链。使用保险柜存放贵重物品。<strong>猫眼</strong>确认来访者身份。不给陌生人开门。了解紧急出口位置。",tips:"用毛巾堵门缝增加安全性"}
];
const grid=document.getElementById('hotelGrid');
const search=document.getElementById('searchInput');
const filterRow=document.getElementById('filterRow');
let currentFilter='all';
function render(){
const q=search.value.toLowerCase();
grid.innerHTML='';
HOTEL_DATA.filter(d=>{
const matchFilter=currentFilter==='all'||d.category===currentFilter;
const matchSearch=!q||d.name.toLowerCase().includes(q)||d.en.toLowerCase().includes(q)||d.content.includes(q)||d.tags.some(t=>t.includes(q));
return matchFilter&&matchSearch;
}).forEach(d=>{
const tagsHTML=d.tags.map(t=>`<span>${t}</span>`).join('');
grid.innerHTML+=`<div class="hotel-card"><div class="h-header"><div class="h-icon">${d.icon}</div><div><div class="h-name">${d.name}</div><div class="h-en">${d.en}</div></div></div><div class="h-price"><span class="amount">${d.price}</span><span class="unit">/晚</span></div><div class="h-tags">${tagsHTML}</div><div class="h-content">${d.content}</div><div class="h-tips">💡 ${d.tips}</div></div>`;
});
}
filterRow.addEventListener('click',e=>{
if(e.target.classList.contains('filter-btn')){
filterRow.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
currentFilter=e.target.dataset.filter;
render();
}
});
search.addEventListener('input',render);
render();
</script>
</body>
</html>
