<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 智慧教育</title>
<meta name="description" content="智慧教育平台，课程管理、在线学习、考试测评、学情分析">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:1100px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.stat-card .icon{font-size:1.8rem;margin-bottom:4px}
.stat-card .val{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.8rem;color:var(--text2)}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.course{padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;transition:all .2s;cursor:pointer}
.course:hover{border-color:var(--accent);transform:translateY(-2px)}
.course .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.course .name{font-weight:600;font-size:.95rem}
.course .badge{padding:2px 8px;border-radius:10px;font-size:.75rem}
.badge-live{background:rgba(239,68,68,.15);color:var(--danger)}
.badge-record{background:rgba(34,197,94,.15);color:var(--success)}
.badge-upcoming{background:rgba(245,158,11,.15);color:var(--warn)}
.course .teacher{font-size:.8rem;color:var(--text2);margin-bottom:6px}
.course .progress{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px}
.course .fill{height:100%;border-radius:3px;background:var(--accent)}
.course .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.8rem;color:var(--text2)}
.btn{padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-size:.8rem}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:4px 10px;font-size:.75rem}
.btn-success{background:var(--success)}.btn-warn{background:var(--warn)}.btn-danger{background:var(--danger)}.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.8rem;transition:all .2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.score-bar{display:flex;align-items:center;gap:8px;margin-top:4px}
.score-bar .bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.score-bar .fill{height:100%;border-radius:4px}
.rank-list{max-height:300px;overflow-y:auto}
.rank-item{display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--border);font-size:.85rem}
.rank-item:last-child{border-bottom:none}
.rank-num{width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;margin-right:10px}
.rank-num.top{background:var(--warn);color:#fff;border-color:var(--warn)}
.quiz-box{padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.quiz-q{font-size:1rem;font-weight:600;margin-bottom:12px}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{padding:10px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;font-size:.9rem}
.quiz-opt:hover{border-color:var(--accent);background:rgba(59,130,246,.05)}
.quiz-opt.selected{border-color:var(--accent);background:rgba(59,130,246,.1)}
.quiz-opt.correct{border-color:var(--success);background:rgba(34,197,94,.1)}
.quiz-opt.wrong{border-color:var(--danger);background:rgba(239,68,68,.1)}
.schedule-item{display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--border);font-size:.85rem}
.schedule-item:last-child{border-bottom:none}
.schedule-time{min-width:60px;color:var(--accent);font-weight:600}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📚 智慧教育">
<meta property="og:description" content="智慧教育平台，课程管理、在线学习、考试测评、学情分析">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📚 智慧教育</h1><p>课程管理、在线学习、考试测评、学情分析</p></div>

<div class="cd">
<h2>📊 学习数据</h2>
<div class="grid" id="stats"></div>
</div>

<div class="cd">
<h2>📖 我的课程</h2>
<div class="tabs" id="courseTabs"></div>
<div class="course-grid" id="courseGrid"></div>
</div>

<div class="cd">
<h2>🏆 排行榜</h2>
<div class="rank-list" id="rankList"></div>
</div>

<div class="cd">
<h2>📝 在线测验</h2>
<div id="quizArea"></div>
</div>

<div class="cd">
<h2>📅 今日课程</h2>
<div id="todaySchedule"></div>
</div>

<div class="cd">
<h2>📈 学习趋势</h2>
<div id="trendChart" style="display:flex;align-items:flex-end;gap:3px;height:120px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px"></div>
</div>
</div>

<script src="i18n.js" defer></script>
<script>
(function(){
var courses=[
  {name:'高等数学',teacher:'张教授',type:'live',progress:68,students:120,hours:48,nextClass:'14:00'},
  {name:'大学英语',teacher:'李老师',type:'record',progress:85,students:200,hours:36,nextClass:'-'},
  {name:'数据结构',teacher:'王教授',type:'live',progress:42,students:95,hours:52,nextClass:'16:00'},
  {name:'线性代数',teacher:'陈老师',type:'upcoming',progress:0,students:150,hours:40,nextClass:'明天'},
  {name:'计算机网络',teacher:'刘教授',type:'live',progress:55,students:88,hours:44,nextClass:'10:00'},
  {name:'操作系统',teacher:'赵老师',type:'record',progress:72,students:110,hours:48,nextClass:'-'}
];
var ranks=[
  {name:'李明',score:9850,avatar:'👨‍🎓'},
  {name:'王芳',score:9720,avatar:'👩‍🎓'},
  {name:'张伟',score:9580,avatar:'👨‍🎓'},
  {name:'陈静',score:9450,avatar:'👩‍🎓'},
  {name:'刘洋',score:9320,avatar:'👨‍🎓'},
  {name:'赵敏',score:9180,avatar:'👩‍🎓'},
  {name:'周杰',score:9050,avatar:'👨‍🎓'},
  {name:'吴丽',score:8920,avatar:'👩‍🎓'}
];
var quizData=[
  {q:'数据结构中，栈的特点是？',opts:['先进先出','先进后出','随机访问','以上都不是'],ans:1},
  {q:'以下哪种排序算法平均时间复杂度最低？',opts:['冒泡排序','选择排序','快速排序','插入排序'],ans:2},
  {q:'HTTP协议默认端口号是？',opts:['21','22','80','443'],ans:2}
];
var currentCourseTab='全部';
var quizIdx=0;

function renderStats(){
  var data=[
    {icon:'📖',val:Math.round(120+Math.random()*30)+'h',label:'学习时长'},
    {icon:'📝',val:Math.round(85+Math.random()*10),label:'平均分'},
    {icon:'🏅',val:'#'+Math.round(5+Math.random()*10),label:'排名'},
    {icon:'📚',val:courses.length,label:'课程数'},
    {icon:'✅',val:Math.round(15+Math.random()*10),label:'已完成作业'},
    {icon:'💬',val:Math.round(50+Math.random()*30),label:'讨论数'}
  ];
  var h='';
  data.forEach(function(d){h+='<div class="stat-card"><div class="icon">'+d.icon+'</div><div class="val">'+d.val+'</div><div class="label">'+d.label+'</div></div>'});
  document.getElementById('stats').innerHTML=h;
}

function renderCourseTabs(){
  var tabs=['全部','直播','录播','即将开课'];
  var h='';
  tabs.forEach(function(t){h+='<div class="tab'+(t===currentCourseTab?' active':'')+'" onclick="filterCourses(\''+t+'\')">'+t+'</div>'});
  document.getElementById('courseTabs').innerHTML=h;
}

window.filterCourses=function(t){currentCourseTab=t;renderCourseTabs();renderCourses()};

function renderCourses(){
  var map={'直播':'live','录播':'record','即将开课':'upcoming'};
  var filtered=courses.filter(function(c){return currentCourseTab==='全部'||c.type===map[currentCourseTab]});
  var h='';
  filtered.forEach(function(c){
    var badge=c.type==='live'?'badge-live':c.type==='record'?'badge-record':'badge-upcoming';
    var label=c.type==='live'?'直播中':c.type==='record'?'录播':'即将开课';
    h+='<div class="course"><div class="top"><span class="name">'+c.name+'</span><span class="badge '+badge+'">'+label+'</span></div><div class="teacher">👨‍🏫 '+c.teacher+' · '+c.students+'人学习</div><div class="progress"><div class="fill" style="width:'+c.progress+'%"></div></div><div class="bottom"><span>进度 '+c.progress+'%</span><span>'+c.hours+'课时</span></div><div style="margin-top:8px;display:flex;gap:6px"><button class="btn btn-sm btn-success" onclick="enterCourse(\''+c.name+'\')">'+(c.type==='live'?'进入直播':'开始学习')+'</button>'+(c.nextClass!=='-'?'<button class="btn btn-sm btn-outline">⏰ '+c.nextClass+'</button>':'')+'</div></div>';
  });
  document.getElementById('courseGrid').innerHTML=h;
}

window.enterCourse=function(n){garyyToast('正在进入 '+n+' 课堂','info')};

function renderRanks(){
  var h='';
  ranks.forEach(function(r,i){
    h+='<div class="rank-item"><div class="rank-num '+(i<3?'top':'')+'">'+(i+1)+'</div><span style="margin-right:8px">'+r.avatar+'</span><span style="flex:1;font-weight:600">'+r.name+'</span><span style="color:var(--warn);font-weight:700">'+r.score+'</span></div>';
  });
  document.getElementById('rankList').innerHTML=h;
}

function renderQuiz(){
  var q=quizData[quizIdx%quizData.length];
  var h='<div class="quiz-box"><div class="quiz-q">Q'+(quizIdx+1)+'. '+q.q+'</div><div class="quiz-opts">';
  q.opts.forEach(function(o,i){
    h+='<div class="quiz-opt" id="opt'+i+'" onclick="answerQuiz('+i+')">'+o+'</div>';
  });
  h+='</div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn" onclick="checkQuiz()">提交答案</button><button class="btn btn-outline" onclick="nextQuiz()">下一题</button></div><div id="quizResult" style="margin-top:8px;font-size:.9rem"></div></div>';
  document.getElementById('quizArea').innerHTML=h;
}

var selectedOpt=-1;
window.answerQuiz=function(i){
  selectedOpt=i;
  document.querySelectorAll('.quiz-opt').forEach(function(o,j){o.className='quiz-opt'+(j===i?' selected':'')});
};

window.checkQuiz=function(){
  var q=quizData[quizIdx%quizData.length];
  document.querySelectorAll('.quiz-opt').forEach(function(o,j){
    o.className='quiz-opt'+(j===q.ans?' correct':'')+(j===selectedOpt&&j!==q.ans?' wrong':'');
    o.onclick=null;
  });
  document.getElementById('quizResult').innerHTML=selectedOpt===q.ans?'✅ 回答正确！':'❌ 回答错误，正确答案是：'+q.opts[q.ans];
};

window.nextQuiz=function(){quizIdx++;selectedOpt=-1;renderQuiz()};

function renderSchedule(){
  var items=[
    {time:'08:00',name:'高等数学',teacher:'张教授',type:'直播'},
    {time:'10:00',name:'计算机网络',teacher:'刘教授',type:'直播'},
    {time:'14:00',name:'数据结构实验',teacher:'王教授',type:'实验'},
    {time:'16:00',name:'英语听力',teacher:'李老师',type:'录播'},
    {time:'19:00',name:'晚自习',teacher:'-',type:'自习'}
  ];
  var h='';
  items.forEach(function(it){
    h+='<div class="schedule-item"><span class="schedule-time">'+it.time+'</span><span style="flex:1"><strong>'+it.name+'</strong><br><span style="font-size:.8rem;color:var(--text2)">'+it.teacher+' · '+it.type+'</span></span><button class="btn btn-sm btn-outline" onclick="enterCourse(\''+it.name+'\')">'+(it.type==='直播'?'进入':'查看')+'</button></div>';
  });
  document.getElementById('todaySchedule').innerHTML=h;
}

function renderTrend(){
  var h='';
  for(var i=0;i<14;i++){
    var v=30+Math.random()*70;
    h+='<div style="flex:1;height:'+v+'%;background:var(--accent);border-radius:3px 3px 0 0;min-width:6px;transition:height .5s"></div>';
  }
  document.getElementById('trendChart').innerHTML=h;
}

renderStats();renderCourseTabs();renderCourses();renderRanks();renderQuiz();renderSchedule();renderTrend();
setInterval(renderStats,10000);
})();
</script>
</body>
</html>
