<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字变化2</title><meta name="description" content="汉字变化2 - 在线查看汉字变化效果"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.change2-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.change2-char{font-size:6rem;font-weight:700;color:var(--blue);display:inline-block}.change2-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.change2-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.change2-option:hover{border-color:var(--blue)}.change2-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}</style><meta property="og:title" content="汉字变化2"><meta property="og:description" content="汉字变化2 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔄 汉字变化2</h1><p class="sub">在线查看汉字变化效果</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="化" oninput="showChange2()">
</div>
<button class="btn" onclick="showChange2()">显示变化</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var changeTypes2=['hue','saturation','brightness','contrast','invert','sepia','grayscale','blur','sharpen','emboss'];
var currentChange2='hue';
function showChange2(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="change2-options">';
  changeTypes2.forEach(function(type){
    html+='<div class="change2-option '+(type===currentChange2?'active':'')+'" onclick="setChange2(\''+type+'\')">'+getChangeName2(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="change2-container">';
  html+='<div class="change2-char" style="animation:'+getChangeCSS2(currentChange2)+'">'+char+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>📋 变化说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>变化类型：</strong>'+getChangeName2(currentChange2)+'</div>';
  html+='<div><strong>效果描述：</strong>'+getChangeDescription2(currentChange2)+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function setChange2(type){
  currentChange2=type;
  showChange2();
}
function getChangeName2(type){
  switch(type){
    case 'hue':return'色相变化';
    case 'saturation':return'饱和度变化';
    case 'brightness':return'亮度变化';
    case 'contrast':return'对比度变化';
    case 'invert':return'反色变化';
    case 'sepia':return'复古变化';
    case 'grayscale':return'灰度变化';
    case 'blur':return'模糊变化';
    case 'sharpen':return'锐化变化';
    case 'emboss':return'浮雕变化';
    default:return'未知';
  }
}
function getChangeDescription2(type){
  switch(type){
    case 'hue':return'色相在不同颜色之间循环变化';
    case 'saturation':return'饱和度在不同强度之间变化';
    case 'brightness':return'亮度在不同明暗之间变化';
    case 'contrast':return'对比度在不同强度之间变化';
    case 'invert':return'颜色反转效果';
    case 'sepia':return'复古棕褐色效果';
    case 'grayscale':return'灰度效果';
    case 'blur':return'模糊程度变化';
    case 'sharpen':return'锐化程度变化';
    case 'emboss':return'浮雕效果';
    default:return'未知效果';
  }
}
function getChangeCSS2(type){
  switch(type){
    case 'hue':return'hueRotate 3s linear infinite';
    case 'saturation':return'saturate 2s ease-in-out infinite';
    case 'brightness':return'brightness 2s ease-in-out infinite';
    case 'contrast':return'contrast 2s ease-in-out infinite';
    case 'invert':return'invert 1s ease-in-out infinite';
    case 'sepia':return'sepia 2s ease-in-out infinite';
    case 'grayscale':return'grayscale 2s ease-in-out infinite';
    case 'blur':return'blurFilter 3s ease-in-out infinite';
    case 'sharpen':return'contrast 2s ease-in-out infinite';
    case 'emboss':return'emboss 2s ease-in-out infinite';
    default:return'none';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showChange2();
}
showChange2();
</script>
<style>
@keyframes hueRotate{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes saturate{0%,100%{filter:saturate(1)}50%{filter:saturate(2)}}
@keyframes brightness{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
@keyframes contrast{0%,100%{filter:contrast(1)}50%{filter:contrast(1.5)}}
@keyframes invert{0%,100%{filter:invert(0)}50%{filter:invert(1)}}
@keyframes sepia{0%,100%{filter:sepia(0)}50%{filter:sepia(1)}}
@keyframes grayscale{0%,100%{filter:grayscale(0)}50%{filter:grayscale(1)}}
@keyframes blurFilter{0%,100%{filter:blur(0px)}50%{filter:blur(5px)}}
@keyframes emboss{0%,100%{filter:blur(0px) contrast(1)}50%{filter:blur(1px) contrast(2)}}
</style></body></html>
