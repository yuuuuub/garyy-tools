<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行保险比较</title>
<meta property="og:title" content="旅行保险比较">
<meta property="og:description" content="比较不同旅行保险方案">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="旅行保险比较工具，选择最适合的旅行保险方案">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:16px;min-height:100vh;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text);margin-right:4px;margin-bottom:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.plan-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);transition:all .2s;position:relative}
.plan-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.plan-card.recommended{border-color:var(--success)}
.plan-card.recommended::after{content:'推荐';position:absolute;top:-1px;right:12px;background:var(--success);color:#fff;padding:2px 10px;border-radius:0 0 6px 6px;font-size:.7rem;font-weight:600}
.plan-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.plan-name{font-weight:600;font-size:1.1rem}
.plan-price{font-size:1.3rem;font-weight:700;color:var(--warn)}
.plan-price span{font-size:.8rem;font-weight:400;color:var(--text2)}
.plan-provider{color:var(--text2);font-size:.85rem;margin-bottom:8px}
.plan-cov{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.cov-item{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;border-bottom:1px solid var(--border)}
.cov-item:last-child{border-bottom:none}
.cov-item .limit{font-weight:600;color:var(--accent)}
.plan-features{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.feature{font-size:.75rem;padding:2px 8px;border-radius:12px;background:var(--bg);color:var(--text2)}
.feature.yes{background:rgba(34,197,94,.15);color:var(--success)}
.feature.no{background:rgba(239,68,68,.15);color:var(--danger)}
.compare-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.8rem}
.compare-table th,.compare-table td{padding:8px;text-align:center;border-bottom:1px solid var(--border)}
.compare-table th{background:var(--bg);font-weight:600;position:sticky;top:0}
.compare-table td{color:var(--text2)}
.compare-table td.best{color:var(--success);font-weight:700}
.chart-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chart-label{min-width:60px;font-size:.75rem;color:var(--text2);text-align:right}
.chart-fill{height:16px;border-radius:4px;transition:width .3s}
.chart-val{font-size:.75rem;font-weight:600}
.es{text-align:center;padding:40px;color:var(--text2)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🛡️ 旅行保险比较</h1><p>选择最适合的旅行保险方案</p></div>

<div class="cd"><h2>🔍 旅行信息</h2>
<label>目的地</label><select id="destination"><option value="亚洲">亚洲</option><option value="欧洲">欧洲</option><option value="美洲">美洲</option><option value="大洋洲">大洋洲</option><option value="全球">全球</option></select>
<div class="fr" style="margin-top:8px">
<div><label>出发日期</label><input type="date" id="startDate"></div>
<div><label>返回日期</label><input type="date" id="endDate"></div>
</div>
<div class="fr" style="margin-top:8px">
<div><label>出行人数</label><input type="number" id="people" value="1" min="1" max="10"></div>
<div><label>最高预算（¥）</label><input type="number" id="budget" placeholder="不限" value="0"></div>
</div>
<div class="bg"><button onclick="comparePlans()">🔍 比较方案</button></div></div>

<div class="cd"><h2>💰 价格对比</h2><div id="priceChart"></div></div>

<div class="cd"><h2>📊 保障对比表</h2><div style="overflow-x:auto"><table class="compare-table" id="compareTable"></table></div></div>

<div id="planList"></div>

<div class="cd"><h2>💡 选购建议</h2>
<div id="tipsArea"></div></div>
</div>

<script>
const PLANS=[
  {name:'平安境外旅行险',provider:'中国平安',price:85,days:7,covers:{medical:300000,evacuation:200000,cancellation:5000,lost_luggage:3000,delay:1000,accident:500000},features:{24h:true,visa:true,sports:true,preexist:false,covid:true,rental:true}},
  {name:'安联全球旅行险',provider:'安联保险',price:120,days:7,covers:{medical:500000,evacuation:300000,cancellation:10000,lost_luggage:5000,delay:2000,accident:800000},features:{24h:true,visa:true,sports:true,preexist:false,covid:true,rental:true}},
  {name:'美亚万国游踪',provider:'美亚保险',price:150,days:7,covers:{medical:800000,evacuation:500000,cancellation:15000,lost_luggage:8000,delay:3000,accident:1000000},features:{24h:true,visa:true,sports:true,preexist:true,covid:true,rental:true}},
  {name:'太平洋境外险',provider:'太平洋保险',price:75,days:7,covers:{medical:200000,evacuation:150000,cancellation:3000,lost_luggage:2000,delay:800,accident:300000},features:{24h:true,visa:true,sports:false,preexist:false,covid:true,rental:false}},
  {name:'中国人寿境外旅行',provider:'中国人寿',price:90,days:7,covers:{medical:350000,evacuation:250000,cancellation:6000,lost_luggage:3000,delay:1200,accident:600000},features:{24h:true,visa:true,sports:true,preexist:false,covid:true,rental:false}},
  {name:'AIG旅行险',provider:'AIG',price:180,days:7,covers:{medical:1000000,evacuation:800000,cancellation:20000,lost_luggage:10000,delay:5000,accident:1500000},features:{24h:true,visa:true,sports:true,preexist:true,covid:true,rental:true}}
];
const COV_LABELS={medical:'医疗费用',evacuation:'紧急救援',cancellation:'行程取消',lost_luggage:'行李丢失',delay:'航班延误',accident:'意外伤害'};
const FEAT_LABELS={'24h':'24小时救援',visa:'签证保障',sports:'运动保障',preexist:'既往症',covid:'新冠保障',rental:'租车保障'};
let currentPlans=[];
function $(id){return document.getElementById(id)}
function getNights(){
  const s=$('startDate').value,e=$('endDate').value;
  if(!s||!e)return 7;
  return Math.max(1,Math.ceil((new Date(e)-new Date(s))/(86400000)));
}
function comparePlans(){
  const dest=$('destination').value,budget=parseInt($('budget').value)||Infinity;
  const people=parseInt($('people').value)||1;
  const nights=getNights();
  currentPlans=PLANS.map(p=>{
    const totalNights=Math.ceil(nights/7)*7;
    const pricePerWeek=Math.ceil(nights/7)*p.price;
    return{...p,totalPrice:pricePerWeek*people};
  }).filter(p=>p.totalPrice<=budget);
  currentPlans.sort((a,b)=>a.totalPrice-b.totalPrice);
  renderPlans();renderChart();renderCompareTable();renderTips();
}
function renderPlans(){
  if(!currentPlans.length){$('planList').innerHTML='<div class="es">未找到符合条件的保险方案</div>';return;}
  const minIdx=currentPlans.findIndex(p=>p.totalPrice===Math.min(...currentPlans.map(x=>x.totalPrice)));
  $('planList').innerHTML=currentPlans.map((p,i)=>{
    const isRec=i===minIdx;
    return `<div class="plan-card ${isRec?'recommended':''}">
      <div class="plan-head"><span class="plan-name">${p.name}</span><span class="plan-price">¥${p.totalPrice} <span>/人</span></span></div>
      <div class="plan-provider">${p.provider}</div>
      <div class="plan-cov">${Object.entries(p.covers).map(([k,v])=>`<div class="cov-item"><span>${COV_LABELS[k]}</span><span class="limit">¥${(v/10000).toFixed(0)}万</span></div>`).join('')}</div>
      <div class="plan-features">${Object.entries(p.features).map(([k,v])=>`<span class="feature ${v?'yes':'no'}">${FEAT_LABELS[k]} ${v?'✓':'✗'}</span>`).join('')}</div>
    </div>`;
  }).join('');
}
function renderChart(){
  if(!currentPlans.length){$('priceChart').innerHTML='';return;}
  const maxP=Math.max(...currentPlans.map(p=>p.totalPrice));
  $('priceChart').innerHTML=currentPlans.map(p=>{
    const pct=Math.round(p.totalPrice/maxP*100);
    const isMin=p.totalPrice===Math.min(...currentPlans.map(x=>x.totalPrice));
    return `<div class="chart-bar"><span class="chart-label">${p.name.slice(0,5)}</span>
      <div class="chart-fill" style="width:${pct}%;background:${isMin?'var(--success)':'var(--accent)'}"></div>
      <span class="chart-val" style="color:${isMin?'var(--success)':'var(--text)'}">¥${p.totalPrice}</span></div>`;
  }).join('');
}
function renderCompareTable(){
  if(!currentPlans.length){$('compareTable').innerHTML='';return;}
  const keys=Object.keys(COV_LABELS);
  const maxVals=keys.map(k=>Math.max(...currentPlans.map(p=>p.covers[k])));
  let html='<thead><tr><th>保障项目</th>'+currentPlans.map(p=>`<th>${p.name.slice(0,6)}</th>`).join('')+'</tr></thead><tbody>';
  keys.forEach(k=>{
    html+=`<tr><td>${COV_LABELS[k]}</td>${currentPlans.map((p,i)=>`<td class="${p.covers[k]===maxVals[i]?'best':''}">¥${(p.covers[k]/10000).toFixed(0)}万</td>`).join('')}</tr>`;
  });
  html+=`<tr style="font-weight:600"><td>价格</td>${currentPlans.map(p=>`<td>¥${p.totalPrice}</td>`).join('')}</tr></tbody>`;
  $('compareTable').innerHTML=html;
}
function renderTips(){
  const tips=[
    {t:'医疗保额',d:'建议至少30万以上，欧美国家建议50万以上'},
    {t:'紧急救援',d:'选择包含紧急医疗转运和送返的保险'},
    {t:'既往症保障',d:'如有慢性病史，注意是否覆盖既往症'},
    {t:'新冠保障',d:'确认保险是否覆盖新冠相关医疗费用'},
    {t:'高风险运动',d:'如参加滑雪、潜水等运动，确认运动保障'},
    {t:'购买时间',d:'建议在购买机票后立即投保，确保行程取消保障生效'}
  ];
  $('tipsArea').innerHTML=tips.map(t=>`<div style="padding:8px;background:var(--bg);border-radius:6px;margin-bottom:6px;font-size:.85rem"><strong>💡 ${t.t}</strong><br><span style="color:var(--text2)">${t.d}</span></div>`).join('');
}
const today=new Date().toISOString().slice(0,10);
const nextWeek=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
$('startDate').value=today;$('endDate').value=nextWeek;
comparePlans();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
