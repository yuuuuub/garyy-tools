<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投资组合追踪器V2</title>
<meta name="description" content="投资组合追踪器V2，多资产类别投资组合管理分析工具">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6;scroll-behavior:smooth}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:var(--text);font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.stat{text-align:center;padding:12px}
.stat-num{font-size:2rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.8rem;color:var(--text2)}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.table th{color:var(--text2);font-size:.85rem;font-weight:600}
.table tr:hover{background:rgba(59,130,246,.05)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.hidden{display:none!important}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.grid-2,.grid-3{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="投资组合追踪器V2">
<meta property="og:description" content="投资组合追踪器V2，多资产类别投资组合管理分析工具">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/investment-portfolio-cn-v2/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📈 投资组合追踪器V2';
const APP=document.getElementById('app');
const COLORS=['#3b82f6','#3fb950','#f85149','#d29922','#a855f7','#ec4899','#06b6d4','#f97316'];
const ASSET_TYPES={stock:'股票',bond:'债券',fund:'基金',crypto:'加密货币',cash:'现金',other:'其他'};
let holdings=JSON.parse(localStorage.getItem('ip2_holdings')||'[]');

function save(){localStorage.setItem('ip2_holdings',JSON.stringify(holdings))}

function totalValue(){return holdings.reduce((s,h)=>s+(h.currentPrice*h.quantity),0)}
function totalCost(){return holdings.reduce((s,h)=>s+(h.buyPrice*h.quantity),0)}
function totalPnL(){return totalValue()-totalCost()}

function render(){
  let h=`<h1>📈 投资组合追踪器V2</h1><p class="subtitle">多资产类别投资组合管理与分析</p>`;
  const tv=totalValue(),tc=totalCost(),pnl=totalPnL();
  const pnlPct=tc>0?((pnl/tc)*100).toFixed(2):'0.00';
  h+=`<div class="grid grid-3">`;
  h+=`<div class="card stat"><div class="stat-num">¥${tv.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="stat-label">总市值</div></div>`;
  h+=`<div class="card stat"><div class="stat-num" style="color:var(--text2)">¥${tc.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="stat-label">总成本</div></div>`;
  h+=`<div class="card stat"><div class="stat-num" style="color:${pnl>=0?'var(--green)':'var(--red)'}">¥${pnl.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} (${pnl>=0?'+':''}${pnlPct}%)</div><div class="stat-label">未实现盈亏</div></div>`;
  h+=`</div>`;

  if(holdings.length>0){
    h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">资产配置</span></div>`;
    h+=`<div style="display:flex;justify-content:center;margin:16px 0"><canvas id="allocChart" width="300" height="300"></canvas></div>`;
    const byType={};
    holdings.forEach(hh=>{const t=ASSET_TYPES[hh.type]||hh.type;byType[t]=(byType[t]||0)+hh.currentPrice*hh.quantity});
    h+=`<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">`;
    let ci=0;
    for(const[t,v]of Object.entries(byType)){
      h+=`<span style="display:flex;align-items:center;gap:4px;font-size:.8rem"><span style="width:12px;height:12px;border-radius:50%;background:${COLORS[ci%COLORS.length]}"></span>${t}: ¥${v.toLocaleString(undefined,{maximumFractionDigits:0})}</span>`;
      ci++;
    }
    h+=`</div></div>`;
  }

  h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">持仓明细</span><button class="btn btn-sm" onclick="showModal()">+ 添加持仓</button></div>`;
  if(holdings.length===0)h+=`<div class="empty">暂无持仓记录</div>`;
  else{
    h+=`<table class="table"><thead><tr><th>代码</th><th>类型</th><th>数量</th><th>买入价</th><th>现价</th><th>盈亏</th><th>操作</th></tr></thead><tbody>`;
    holdings.forEach(hh=>{
      const val=hh.currentPrice*hh.quantity;
      const cost=hh.buyPrice*hh.quantity;
      const p=val-cost;
      const pct=cost>0?((p/cost)*100).toFixed(1):'0.0';
      h+=`<tr><td><strong>${hh.ticker}</strong><br><span style="font-size:.75rem;color:var(--text2)">${hh.name||''}</span></td><td><span class="badge badge-blue">${ASSET_TYPES[hh.type]||hh.type}</span></td><td>${hh.quantity}</td><td>¥${hh.buyPrice.toLocaleString()}</td><td>¥${hh.currentPrice.toLocaleString()}</td><td style="color:${p>=0?'var(--green)':'var(--red)'}">¥${p.toLocaleString(undefined,{maximumFractionDigits:2})} (${p>=0?'+':''}${pct}%)</td><td><button class="btn btn-sm" onclick="editHolding('${hh.id}')">编辑</button> <button class="btn btn-sm btn-danger" onclick="deleteHolding('${hh.id}')">删除</button></td></tr>`;
    });
    h+=`</tbody></table>`;
  }
  h+=`</div>`;

  h+=`<div class="flex" style="justify-content:flex-end"><button class="btn btn-success" onclick="exportCSV()">导出CSV</button></div>`;
  APP.innerHTML=h;
  drawAllocChart();
}

function drawAllocChart(){
  const canvas=document.getElementById('allocChart');
  if(!canvas||holdings.length===0)return;
  const ctx=canvas.getContext('2d');
  const cx=150,cy=150,r=120;
  ctx.clearRect(0,0,300,300);
  const tv=totalValue();
  let angle=-Math.PI/2;
  const byTicker={};
  holdings.forEach(hh=>{byTicker[hh.ticker]=(byTicker[hh.ticker]||0)+hh.currentPrice*hh.quantity});
  const entries=Object.entries(byTicker);
  entries.forEach(([ticker,val],i)=>{
    const slice=(val/tv)*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,angle,angle+slice);ctx.closePath();
    ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();
    angle+=slice;
  });
  ctx.beginPath();ctx.arc(cx,cy,60,0,Math.PI*2);ctx.fillStyle='#161b22';ctx.fill();
  ctx.fillStyle='#e6edf3';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('¥'+tv.toLocaleString(undefined,{maximumFractionDigits:0}),cx,cy-8);
  ctx.font='11px sans-serif';ctx.fillStyle='#8b949e';ctx.fillText('总市值',cx,cy+12);
}

function showModal(editId){
  const holding=editId?holdings.find(h=>h.id===editId):null;
  const title=editing?'编辑持仓':'添加持仓';
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  const opts=Object.entries(ASSET_TYPES).map(([k,v])=>`<option value="${k}" ${holding&&holding.type===k?'selected':''}>${v}</option>`).join('');
  overlay.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">${title}</h3>
    <label>代码/名称</label><input id="m_ticker" placeholder="如：AAPL" value="${holding?holding.ticker:''}">
    <label>名称</label><input id="m_name" placeholder="如：苹果公司" value="${holding?holding.name:''}">
    <label>资产类型</label><select id="m_type">${opts}</select>
    <label>数量</label><input id="m_qty" type="number" step="0.01" value="${holding?holding.quantity:''}">
    <label>买入价 (¥)</label><input id="m_buy" type="number" step="0.01" value="${holding?holding.buyPrice:''}">
    <label>当前价 (¥)</label><input id="m_cur" type="number" step="0.01" value="${holding?holding.currentPrice:''}">
    <div class="flex" style="margin-top:16px"><button class="btn" onclick="saveHolding('${editId||''}')">保存</button><button class="btn btn-danger" onclick="this.closest('.modal-overlay').remove()">取消</button></div></div>`;
  document.body.appendChild(overlay);
}
function editHolding(id){showModal(id)}
function saveHolding(editId){
  const ticker=document.getElementById('m_ticker').value.trim().toUpperCase();
  const name=document.getElementById('m_name').value.trim();
  const type=document.getElementById('m_type').value;
  const quantity=parseFloat(document.getElementById('m_qty').value)||0;
  const buyPrice=parseFloat(document.getElementById('m_buy').value)||0;
  const currentPrice=parseFloat(document.getElementById('m_cur').value)||0;
  if(!ticker||!quantity)return;
  if(editId){
    const idx=holdings.findIndex(h=>h.id===editId);
    if(idx>=0)holdings[idx]={...holdings[idx],ticker,name,type,quantity,buyPrice,currentPrice};
  }else{
    holdings.push({id:Date.now().toString(36),ticker,name,type,quantity,buyPrice,currentPrice});
  }
  save();document.querySelector('.modal-overlay').remove();render();
}
function deleteHolding(id){holdings=holdings.filter(h=>h.id!==id);save();render()}

function exportCSV(){
  let csv='代码,名称,类型,数量,买入价,当前价,市值,盈亏\n';
  holdings.forEach(h=>{
    const val=h.currentPrice*h.quantity;
    const pnl=val-h.buyPrice*h.quantity;
    csv+=`${h.ticker},${h.name||''},${ASSET_TYPES[h.type]||h.type},${h.quantity},${h.buyPrice},${h.currentPrice},${val.toFixed(2)},${pnl.toFixed(2)}\n`;
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='portfolio.csv';a.click();
}

render();
</script>
</body>
</html>
