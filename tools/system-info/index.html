<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系统信息</title>
<meta name="description" content="设备系统信息查看工具，显示操作系统和硬件信息">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vhpadding:16px;scroll-behavior:smooth;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.container{max-width:800px;margin:0 auto;padding:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row .label{color:var(--muted)}
.info-row .value{font-weight:500;text-align:right;word-break:break-all;max-width:60%}
.btn{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px;margin-top:8px}
.btn:hover{border-color:var(--accent);color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="系统信息">
  <meta property="og:description" content="设备系统信息查看工具，显示操作系统和硬件信息">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/system-info/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="header">
<span style="font-size:28px">💻</span>
<h1>系统信息</h1>
</div>
<div class="container">
<div class="card">
<h2>🖥️ 操作系统</h2>
<div id="osInfo"></div>
</div>
<div class="card">
<h2>📱 设备信息</h2>
<div id="deviceInfo"></div>
</div>
<div class="card">
<h2>🖼️ 屏幕信息</h2>
<div id="screenInfo"></div>
</div>
<div class="card">
<h2>🔋 电池状态</h2>
<div id="batteryInfo"><div style="color:var(--muted)">获取中...</div></div>
</div>
<div class="card">
<h2>💾 内存信息</h2>
<div id="memInfo"></div>
</div>
<div class="card">
<h2>🧩 CPU信息</h2>
<div id="cpuInfo"></div>
</div>
<button class="btn" onclick="location.reload()">🔄 刷新</button>
</div>
<script>
const ua=navigator.userAgent;
function detectOS(){
const checks=[
[/Windows NT 10\.0/,'Windows 10/11'],['Windows NT 6\.3/','Windows 8.1'],['Windows NT 6\.2/','Windows 8'],
[/Windows NT 6\.1/,'Windows 7'],['Windows/','Windows'],['Mac OS X ([\d_]+)/','macOS $1'],
[/Android ([\d.]+)/,'Android $1'],['iPhone OS ([\d_]+)/','iOS $1'],['iPad.*OS ([\d_]+)/','iPadOS $1'],
[/Linux/,'Linux'],['CrOS/','ChromeOS']
];
for(const[pattern,replace]of checks){if(ua.match(pattern))return ua.match(pattern)[0].replace(pattern,replace)}
return '未知';
}
function detectBrowser(){
if(ua.includes('Edg/'))return'Edge '+ua.match(/Edg\/([\d.]+)/)?.[1];
if(ua.includes('OPR/'))return'Opera '+ua.match(/OPR\/([\d.]+)/)?.[1];
if(ua.includes('Chrome/'))return'Chrome '+ua.match(/Chrome\/([\d.]+)/)?.[1];
if(ua.includes('Firefox/'))return'Firefox '+ua.match(/Firefox\/([\d.]+)/)?.[1];
if(ua.includes('Safari/')&&!ua.includes('Chrome'))return'Safari '+ua.match(/Version\/([\d.]+)/)?.[1];
return '未知';
}
function infoRow(label,value){return `<div class="info-row"><span class="label">${label}</span><span class="value">${value}</span></div>`}
document.getElementById('osInfo').innerHTML=[
infoRow('操作系统',detectOS()),
infoRow('平台',navigator.platform),
infoRow('语言',navigator.language),
infoRow('Cookie支持',navigator.cookieEnabled?'是':'否'),
infoRow('Do Not Track',navigator.doNotTrack==='1'?'是':'否')
].join('');
document.getElementById('deviceInfo').innerHTML=[
infoRow('浏览器',detectBrowser()),
infoRow('UserAgent',navigator.userAgent),
infoRow('设备内存',navigator.deviceMemory?navigator.deviceMemory+'GB':'不支持'),
infoRow('硬件并发数',navigator.hardwareConcurrency||'不支持'),
infoRow('触控支持','ontouchstart' in window?'是':'否'),
infoRow('振动支持',navigator.vibrate?'是':'否')
].join('');
document.getElementById('screenInfo').innerHTML=[
infoRow('分辨率',screen.width+' × '+screen.height),
infoRow('可用区域',screen.availWidth+' × '+screen.availHeight),
infoRow('色彩深度',screen.colorDepth+'bit'),
infoRow('像素比',window.devicePixelRatio),
infoRow('方向',screen.orientation?.type||'N/A')
].join('');
document.getElementById('memInfo').innerHTML=[
infoRow('设备内存',navigator.deviceMemory?navigator.deviceMemory+'GB':'不支持'),
infoRow('性能内存',performance.memory?Math.round(performance.memory.usedJSHeapSize/1048576)+'MB / '+Math.round(performance.memory.jsHeapSizeLimit/1048576)+'MB':'不支持'),
infoRow('触摸点数',navigator.maxTouchPoints)
].join('');
document.getElementById('cpuInfo').innerHTML=[
infoRow('硬件并发数',navigator.hardwareConcurrency?navigator.hardwareConcurrency+'核':'不支持'),
infoRow('平台',navigator.platform)
].join('');
if(navigator.getBattery){
navigator.getBattery().then(b=>{
b.addEventListener('levelchange',()=>updateBattery(b));
updateBattery(b);
});
function updateBattery(b){
document.getElementById('batteryInfo').innerHTML=[
infoRow('电量',Math.round(b.level*100)+'%'),
infoRow('充电状态',b.charging?'充电中':'未充电'),
infoRow('充满时间',b.chargingTime===Infinity?'计算中':b.chargingTime?Math.round(b.chargingTime/60)+'分钟':'未知'),
infoRow('剩余时间',b.dischargingTime===Infinity?'计算中':b.dischargingTime?Math.round(b.dischargingTime/60)+'分钟':'未知')
].join('');
}
}else{document.getElementById('batteryInfo').innerHTML=infoRow('状态','浏览器不支持Battery API')}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
