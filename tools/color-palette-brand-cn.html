<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="品牌色彩调色板 - 创建和管理品牌色彩方案">
    <meta name="robots" content="index, follow">
    <title>品牌色彩调色板</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #007bff; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #0d6efd; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="color"], textarea, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 8px; }
        button:hover { opacity: 0.9; }
        .btn-success { background-color: var(--success-color); }
        .btn-danger { background-color: var(--danger-color); }
        .btn-sm { padding: 4px 10px; font-size: 13px; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .output { white-space: pre-wrap; font-family: 'Courier New', monospace; line-height: 1.6; background: var(--bg-color); padding: 12px; border-radius: 4px; border: 1px solid var(--border-color); font-size: 13px; }
        .palette-display { display: flex; border-radius: 12px; overflow: hidden; height: 120px; margin: 16px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .palette-color { flex: 1; display: flex; align-items: flex-end; justify-content: center; padding: 8px; font-size: 11px; color: white; font-weight: bold; cursor: pointer; transition: flex 0.3s; position: relative; }
        .palette-color:hover { flex: 1.5; }
        .palette-color .color-info { background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 4px; text-align: center; }
        .palette-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
        .palette-row input[type="color"] { width: 50px; height: 40px; padding: 2px; cursor: pointer; }
        .palette-row input[type="text"] { flex: 1; }
        .swatch-grid { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
        .swatch { width: 64px; height: 64px; border-radius: 8px; border: 2px solid var(--border-color); cursor: pointer; position: relative; transition: transform 0.2s; }
        .swatch:hover { transform: scale(1.1); }
        .swatch .swatch-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; white-space: nowrap; }
        .contrast-preview { padding: 16px; border-radius: 8px; margin: 12px 0; text-align: center; font-size: 18px; font-weight: bold; }
        .harmony-card { padding: 16px; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; text-align: center; transition: border-color 0.2s; }
        .harmony-card:hover { border-color: var(--primary-color); }
        .harmony-card.active { border-color: var(--primary-color); border-width: 2px; }
        .harmony-card h4 { margin: 0 0 8px 0; font-size: 14px; }
        .harmony-colors { display: flex; gap: 4px; justify-content: center; }
        .harmony-dot { width: 24px; height: 24px; border-radius: 50%; }
        .export-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .export-tabs button { font-size: 13px; padding: 6px 14px; }
        .color-detail { padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; margin-top: 12px; }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-bar button { font-size: 14px; padding: 6px 14px; }
        .tab-bar button.active { background-color: var(--primary-color); }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>品牌色彩调色板</h1>

        <div class="card">
            <h3>选择基础颜色</h3>
            <div class="grid-3">
                <div class="form-group"><label>主色</label><input type="color" id="baseColor1" value="#3b82f6" onchange="generatePalette()"></div>
                <div class="form-group"><label>辅色</label><input type="color" id="baseColor2" value="#10b981" onchange="generatePalette()"></div>
                <div class="form-group"><label>强调色</label><input type="color" id="baseColor3" value="#f59e0b" onchange="generatePalette()"></div>
            </div>
            <div class="form-group"><label>或输入HEX值</label><div style="display:flex;gap:8px;"><input type="text" id="hexInput" placeholder="#3b82f6"><button class="btn-sm" onclick="setColorFromHex()">应用</button></div></div>
        </div>

        <div class="card">
            <h3>调色板预览</h3>
            <div class="palette-display" id="paletteDisplay"></div>
        </div>

        <div class="card">
            <h3>色彩和谐方案</h3>
            <div class="grid-3" id="harmonyGrid"></div>
        </div>

        <div class="tab-bar">
            <button class="active" onclick="switchTab('shades')">明暗渐变</button>
            <button onclick="switchTab('contrast')">对比度检测</button>
            <button onclick="switchTab('usage')">使用建议</button>
            <button onclick="switchTab('export')">导出</button>
        </div>

        <div id="tabShades" class="card">
            <h3>明暗渐变</h3>
            <div id="shadesDisplay"></div>
        </div>

        <div id="tabContrast" class="card" style="display:none;">
            <h3>WCAG对比度检测</h3>
            <div id="contrastResults"></div>
        </div>

        <div id="tabUsage" class="card" style="display:none;">
            <h3>色彩使用建议</h3>
            <div id="usageSuggestions"></div>
        </div>

        <div id="tabExport" class="card" style="display:none;">
            <h3>导出色彩方案</h3>
            <div class="export-tabs">
                <button class="active" onclick="switchExport('css')">CSS变量</button>
                <button onclick="switchExport('scss')">SCSS</button>
                <button onclick="switchExport('json')">JSON</button>
                <button onclick="switchExport('tailwind')">Tailwind</button>
            </div>
            <pre class="output" id="exportOutput"></pre>
            <button class="btn-success" onclick="copyExport()" style="margin-top:10px;">复制代码</button>
        </div>
    </div>

    <script src="i18n.js" defer></script>
    <script>
        function toggleTheme() { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; }

        let currentColors = ['#3b82f6', '#10b981', '#f59e0b'];
        let currentExportFormat = 'css';

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join('');
        }

        function hslToRgb(h, s, l) {
            s /= 100; l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => { const k = (n + h / 30) % 12; return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1); };
            return { r: Math.round(f(0) * 255), g: Math.round(f(8) * 255), b: Math.round(f(4) * 255) };
        }

        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) { h = s = 0; } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) { case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break; case g: h = ((b - r) / d + 2) / 6; break; case b: h = ((r - g) / d + 4) / 6; break; }
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        function getLuminance(hex) {
            const { r, g, b } = hexToRgb(hex);
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }

        function getContrastRatio(c1, c2) {
            const l1 = getLuminance(c1), l2 = getLuminance(c2);
            const lighter = Math.max(l1, l2), darker = Math.min(l1, l2);
            return ((lighter + 0.05) / (darker + 0.05)).toFixed(2);
        }

        function generateShades(hex) {
            const { r, g, b } = hexToRgb(hex);
            const shades = [];
            for (let i = 50; i <= 950; i += 100) {
                const factor = 1 - (i / 1000);
                const nr = Math.round(r * factor + 255 * (1 - factor));
                const ng = Math.round(g * factor + 255 * (1 - factor));
                const nb = Math.round(b * factor + 255 * (1 - factor));
                shades.push({ level: i, hex: rgbToHex(nr, ng, nb) });
            }
            return shades;
        }

        function generatePalette() {
            currentColors = [
                document.getElementById('baseColor1').value,
                document.getElementById('baseColor2').value,
                document.getElementById('baseColor3').value
            ];

            const display = document.getElementById('paletteDisplay');
            display.innerHTML = currentColors.map(c => `<div class="palette-color" style="background:${c};"><div class="color-info">${c.toUpperCase()}</div></div>`).join('');

            generateHarmonies();
            generateShadesDisplay();
            generateContrastResults();
            generateUsageSuggestions();
            updateExport();
        }

        function setColorFromHex() {
            const hex = document.getElementById('hexInput').value.trim();
            if (/^#[0-9a-fA-F]{6}$/.test(hex)) {
                document.getElementById('baseColor1').value = hex;
                generatePalette();
            }
        }

        function generateHarmonies() {
            const base = hexToRgb(currentColors[0]);
            const hsl = rgbToHsl(base.r, base.g, base.b);
            const harmonies = [
                { name: '互补色', colors: [currentColors[0], rgbToHex(...Object.values(hslToRgb((hsl.h + 180) % 360, hsl.s, hsl.l)))] },
                { name: '类似色', colors: [rgbToHex(...Object.values(hslToRgb((hsl.h - 30 + 360) % 360, hsl.s, hsl.l))), currentColors[0], rgbToHex(...Object.values(hslToRgb((hsl.h + 30) % 360, hsl.s, hsl.l)))] },
                { name: '三色组', colors: [currentColors[0], rgbToHex(...Object.values(hslToRgb((hsl.h + 120) % 360, hsl.s, hsl.l))), rgbToHex(...Object.values(hslToRgb((hsl.h + 240) % 360, hsl.s, hsl.l)))] },
                { name: '分裂互补', colors: [currentColors[0], rgbToHex(...Object.values(hslToRgb((hsl.h + 150) % 360, hsl.s, hsl.l))), rgbToHex(...Object.values(hslToRgb((hsl.h + 210) % 360, hsl.s, hsl.l)))] },
                { name: '四色组', colors: [currentColors[0], rgbToHex(...Object.values(hslToRgb((hsl.h + 90) % 360, hsl.s, hsl.l))), rgbToHex(...Object.values(hslToRgb((hsl.h + 180) % 360, hsl.s, hsl.l))), rgbToHex(...Object.values(hslToRgb((hsl.h + 270) % 360, hsl.s, hsl.l)))] },
                { name: '单色系', colors: generateShades(currentColors[0]).filter((_, i) => [0, 2, 4, 6, 8].includes(i)).map(s => s.hex) }
            ];
            document.getElementById('harmonyGrid').innerHTML = harmonies.map(h => `
                <div class="harmony-card" onclick="applyHarmony(${JSON.stringify(h.colors).replace(/"/g, '&quot;')})">
                    <h4>${h.name}</h4>
                    <div class="harmony-colors">${h.colors.map(c => `<div class="harmony-dot" style="background:${c};"></div>`).join('')}</div>
                </div>
            `).join('');
        }

        function applyHarmony(colors) {
            document.getElementById('baseColor1').value = colors[0];
            if (colors[1]) document.getElementById('baseColor2').value = colors[1];
            if (colors[2]) document.getElementById('baseColor3').value = colors[2];
            generatePalette();
        }

        function generateShadesDisplay() {
            const allShades = currentColors.map((c, i) => {
                const shades = generateShades(c);
                return `<div style="margin-bottom:16px;"><h4 style="color:${c};">颜色 ${i + 1} 渐变</h4><div style="display:flex;border-radius:8px;overflow:hidden;height:50px;">${shades.map(s => `<div style="flex:1;background:${s.hex};display:flex;align-items:center;justify-content:center;font-size:10px;color:${getLuminance(s.hex) > 0.5 ? '#333' : '#fff'};">${s.level}</div>`).join('')}</div></div>`;
            }).join('');
            document.getElementById('shadesDisplay').innerHTML = allShades;
        }

        function generateContrastResults() {
            const pairs = [
                [currentColors[0], '#ffffff', '主色 + 白色文字'],
                [currentColors[0], '#000000', '主色 + 黑色文字'],
                [currentColors[1], '#ffffff', '辅色 + 白色文字'],
                [currentColors[1], '#000000', '辅色 + 黑色文字'],
                [currentColors[0], currentColors[1], '主色 + 辅色'],
                [currentColors[0], currentColors[2], '主色 + 强调色']
            ];
            document.getElementById('contrastResults').innerHTML = pairs.map(([c1, c2, label]) => {
                const ratio = getContrastRatio(c1, c2);
                const aaa = ratio >= 7, aa = ratio >= 4.5, aaLarge = ratio >= 3;
                return `<div class="color-detail" style="display:flex;align-items:center;gap:16px;">
                    <div class="contrast-preview" style="background:${c1};color:${c2};width:160px;flex-shrink:0;margin:0;">Aa文本</div>
                    <div><strong>${label}</strong><br>对比度: ${ratio}:1<br>
                    <span style="color:${aaa ? 'var(--success-color)' : aa ? 'var(--warning-color)' : 'var(--danger-color)'};">${aaa ? '✅ WCAG AAA 通过' : aa ? '⚠️ WCAG AA 通过' : '❌ 未通过'}${aaLarge ? '' : ' (大字可用)'}</span></div>
                </div>`;
            }).join('');
        }

        function generateUsageSuggestions() {
            const suggestions = currentColors.map((c, i) => {
                const roles = ['主色适合用于：按钮、链接、标题、品牌标识', '辅色适合用于：次要信息、背景装饰、图标', '强调色适合用于：警告提示、重要通知、价格标签'];
                return `<div class="color-detail"><div style="display:flex;gap:12px;align-items:center;margin-bottom:8px;"><div style="width:48px;height:48px;background:${c};border-radius:8px;flex-shrink:0;"></div><div><strong>颜色 ${i + 1}</strong> <code>${c}</code><br><span style="font-size:13px;color:var(--secondary-color);">${rgbToHex(...Object.values(hexToRgb(c)))}</span></div></div><p style="font-size:14px;margin:0;">${roles[i]}</p></div>`;
            }).join('');
            document.getElementById('usageSuggestions').innerHTML = suggestions;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-bar button').forEach((b, i) => b.classList.remove('active'));
            event.target.classList.add('active');
            ['Shades', 'Contrast', 'Usage', 'Export'].forEach(t => document.getElementById('tab' + t).style.display = 'none');
            const tabMap = { shades: 'Shades', contrast: 'Contrast', usage: 'Usage', export: 'Export' };
            document.getElementById('tab' + tabMap[tab]).style.display = 'block';
        }

        function switchExport(format) {
            currentExportFormat = format;
            document.querySelectorAll('.export-tabs button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            updateExport();
        }

        function updateExport() {
            const names = ['primary', 'secondary', 'accent'];
            let code = '';
            if (currentExportFormat === 'css') {
                code = `:root {\n  --color-primary: ${currentColors[0]};\n  --color-secondary: ${currentColors[1]};\n  --color-accent: ${currentColors[2]};\n`;
                currentColors.forEach((c, i) => {
                    generateShades(c).forEach(s => code += `  --color-${names[i]}-${s.level}: ${s.hex};\n`);
                });
                code += '}';
            } else if (currentExportFormat === 'scss') {
                code = currentColors.map((c, i) => `$${names[i]}: ${c};`).join('\n') + '\n\n';
                currentColors.forEach((c, i) => {
                    code += `$${names[i]}-shades: (\n`;
                    generateShades(c).forEach(s => code += `  '${s.level}': ${s.hex},\n`);
                    code += ');\n\n';
                });
            } else if (currentExportFormat === 'json') {
                const obj = {};
                currentColors.forEach((c, i) => {
                    obj[names[i]] = { base: c };
                    generateShades(c).forEach(s => obj[names[i]][s.level] = s.hex);
                });
                code = JSON.stringify(obj, null, 2);
            } else if (currentExportFormat === 'tailwind') {
                code = `// tailwind.config.js\nmodule.exports = {\n  theme: {\n    extend: {\n      colors: {\n`;
                currentColors.forEach((c, i) => {
                    code += `        '${names[i]}': {\n`;
                    generateShades(c).forEach(s => code += `          ${s.level}: '${s.hex}',\n`);
                    code += '        },\n';
                });
                code += '      },\n    },\n  },\n};';
            }
            document.getElementById('exportOutput').textContent = code;
        }

        function copyExport() { navigator.clipboard.writeText(document.getElementById('exportOutput').textContent).then(() => alert('代码已复制')); }

        generatePalette();
    </script>
</body>
</html>
