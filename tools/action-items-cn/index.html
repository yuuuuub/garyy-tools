<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✅ 待办事项</title>
<meta name="description" content="待办事项追踪器，管理你的任务和行动项">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:1000px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kanban-col{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;min-height:200px}
.kanban-col h3{font-size:.9rem;text-align:center;margin-bottom:10px;padding:8px;border-radius:8px;font-weight:600}
.col-todo h3{background:rgba(210,153,34,.15);color:var(--yellow)}
.col-doing h3{background:rgba(59,130,246,.15);color:var(--accent)}
.col-done h3{background:rgba(63,185,80,.15);color:var(--green)}
.task-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:grab;transition:all .15s}
.task-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.task-card.dragging{opacity:.5;transform:rotate(2deg)}
.task-card .title{font-weight:600;font-size:.9rem;margin-bottom:4px}
.task-card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.75rem;color:var(--text2)}
.task-card .overdue{color:var(--red);font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:600}
.badge-high{background:rgba(248,81,73,.15);color:var(--red)}
.badge-mid{background:rgba(210,153,34,.15);color:var(--yellow)}
.badge-low{background:rgba(63,185,80,.15);color:var(--green)}
.badge-cat{background:rgba(59,130,246,.15);color:var(--accent)}
.task-card .card-actions{display:flex;gap:4px;margin-top:8px}
.task-card .card-actions button{padding:3px 8px;font-size:.75rem}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:14px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:2px}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
@media(max-width:768px){.kanban{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(2,1fr)}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="✅ 待办事项">
<meta property="og:description" content="待办事项追踪器，管理你的任务和行动项">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/action-items-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='actitem_data';
let tasks=JSON.parse(localStorage.getItem(STORE)||'[]');
let filterPriority='',filterCategory='',searchText='',selectedIds=new Set();
function save(){localStorage.setItem(STORE,JSON.stringify(tasks))}
function render(){
  let h=`<div class="hdr"><h1>✅ 待办事项</h1><p>看板式任务管理</p></div>`;
  const overdueCount=tasks.filter(t=>t.status!=='done'&&t.due&&t.due<new Date().toISOString().slice(0,10)).length;
  const todoCount=tasks.filter(t=>t.status==='todo').length;
  const doingCount=tasks.filter(t=>t.status==='doing').length;
  const doneCount=tasks.filter(t=>t.status==='done').length;
  h+=`<div class="stats-grid"><div class="stat"><div class="stat-num">${tasks.length}</div><div class="stat-label">总任务</div></div>`;
  h+=`<div class="stat"><div class="stat-num" style="color:var(--yellow)">${todoCount}</div><div class="stat-label">待处理</div></div>`;
  h+=`<div class="stat"><div class="stat-num" style="color:var(--accent)">${doingCount}</div><div class="stat-label">进行中</div></div>`;
  h+=`<div class="stat"><div class="stat-num" style="color:${overdueCount>0?'var(--red)':'var(--green)'}">${overdueCount}</div><div class="stat-label">已逾期</div></div></div>`;
  h+=`<div class="cd"><div class="flex" style="flex-wrap:wrap"><input type="text" id="searchInput" placeholder="搜索任务..." value="${searchText}" oninput="searchText=this.value;render()" style="flex:1;min-width:150px;margin-bottom:0">`;
  h+=`<select id="fP" onchange="filterPriority=this.value;render()" style="width:auto;min-width:100px;margin-bottom:0"><option value="">全部优先级</option><option value="高">高</option><option value="中">中</option><option value="低">低</option></select>`;
  h+=`<select id="fC" onchange="filterCategory=this.value;render()" style="width:auto;min-width:100px;margin-bottom:0"><option value="">全部类别</option><option value="工作">工作</option><option value="个人">个人</option><option value="学习">学习</option><option value="其他">其他</option></select>`;
  h+=`<button onclick="showModal()">+ 新任务</button></div></div>`;
  h+=`<div class="kanban">`;
  ['todo','doing','done'].forEach(status=>{
    const label=status==='todo'?'待处理':status==='doing'?'进行中':'已完成';
    const colClass=status==='todo'?'col-todo':status==='doing'?'col-doing':'col-done';
    const filtered=getFiltered().filter(t=>t.status===status);
    h+=`<div class="kanban-col ${colClass}" ondragover="event.preventDefault()" ondrop="dropTask(event,'${status}')">`;
    h+=`<h3>${label} (${filtered.length})</h3>`;
    filtered.forEach(t=>{
      const isOverdue=t.status!=='done'&&t.due&&t.due<new Date().toISOString().slice(0,10);
      h+=`<div class="task-card" draggable="true" ondragstart="dragTask(event,${t.id})" ondragend="this.classList.remove('dragging')" ondragenter="this.classList.add('dragging')" ondragleave="this.classList.remove('dragging')">`;
      h+=`<div class="title">${t.title}</div>`;
      h+=`<div class="meta"><span class="badge badge-${t.priority==='高'?'high':t.priority==='中'?'mid':'low'}">${t.priority}</span>`;
      h+=`<span class="badge badge-cat">${t.category}</span>`;
      if(t.assignee)h+=`<span>${t.assignee}</span>`;
      if(t.due)h+=`<span class="${isOverdue?'overdue':''}">截止: ${t.due}</span>`;
      h+=`</div><div class="card-actions">`;
      if(status!=='todo')h+=`<button class="sec" onclick="moveTask(${t.id},'todo')">← 待处理</button>`;
      if(status!=='doing')h+=`<button class="sec" onclick="moveTask(${t.id},'doing')">进行中</button>`;
      if(status!=='done')h+=`<button class="sec" style="background:var(--green);color:#fff" onclick="moveTask(${t.id},'done')">✓ 完成</button>`;
      h+=`<button class="dng" style="padding:3px 8px;font-size:.75rem" onclick="delTask(${t.id})">删除</button>`;
      h+=`</div></div>`;
    });
    if(filtered.length===0)h+=`<div style="text-align:center;color:var(--text2);padding:20px;font-size:.85rem">暂无任务</div>`;
    h+=`</div>`;
  });
  h+=`</div>`;
  h+=`<div id="modal" class="hidden"><div class="modal-overlay" onclick="if(event.target===this)hideModal()"><div class="modal">`;
  h+=`<h2 style="margin-bottom:16px">新建任务</h2>`;
  h+=`<label>任务标题</label><input type="text" id="tTitle" placeholder="任务标题">`;
  h+=`<label>描述</label><textarea id="tDesc" placeholder="任务描述（可选）"></textarea>`;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>优先级</label><select id="tPriority"><option value="高">高</option><option value="中" selected>中</option><option value="低">低</option></select></div>`;
  h+=`<div><label>类别</label><select id="tCategory"><option>工作</option><option>个人</option><option>学习</option><option>其他</option></select></div></div>`;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>负责人</label><input type="text" id="tAssignee" placeholder="负责人"></div>`;
  h+=`<div><label>截止日期</label><input type="date" id="tDue"></div></div>`;
  h+=`<div class="bg"><button onclick="addTask()">创建任务</button><button class="sec" onclick="hideModal()">取消</button></div></div></div></div>`;
  $('app').innerHTML=h;
}
function getFiltered(){
  return tasks.filter(t=>{
    if(filterPriority&&t.priority!==filterPriority)return false;
    if(filterCategory&&t.category!==filterCategory)return false;
    if(searchText&&!t.title.includes(searchText)&&!(t.desc||'').includes(searchText))return false;
    return true;
  });
}
function showModal(){$('modal').classList.remove('hidden')}
function hideModal(){$('modal').classList.add('hidden')}
function addTask(){
  const title=$('tTitle').value.trim();
  if(!title){alert('请输入任务标题');return;}
  tasks.push({id:Date.now(),title,desc:$('tDesc').value.trim(),priority:$('tPriority').value,category:$('tCategory').value,assignee:$('tAssignee').value.trim(),due:$('tDue').value,status:'todo'});
  save();hideModal();render();
}
function delTask(id){if(!confirm('确定删除？'))return;tasks=tasks.filter(t=>t.id!==id);save();render()}
function moveTask(id,status){const t=tasks.find(t=>t.id===id);if(t){t.status=status;save();render()}}
function dragTask(e,id){e.dataTransfer.setData('text/plain',id)}
function dropTask(e,status){e.preventDefault();const id=parseInt(e.dataTransfer.getData('text/plain'));moveTask(id,status)}
render();
</script>
</body>
</html>
