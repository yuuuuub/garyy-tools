<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 表格生成器 | Markdown Table Generator</title>
<meta property="og:title" content="Markdown 表格生成器 | Markdown Table Generator">
<meta property="og:description" content="Markdown 表格生成器 | Markdown Table Generator - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="Markdown表格生成器，将CSV/TSV数据快速转换为Markdown表格">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<script src="i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5padding:16px;scroll-behavior:smooth;}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.container{max-width:1600px;margin:0 auto;padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:calc(100vh - 140px)}
@media(max-width:900px){.container{grid-template-columns:1fr}}
.panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:500;color:var(--text-secondary);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
textarea{width:100%;flex:1;min-height:400px;padding:16px;background:var(--bg);color:var(--text);border:none;resize:none;font-family:'Fira Code',Consolas,Monaco,monospace;font-size:.85rem;line-height:1.6;outline:none}
textarea::placeholder{color:var(--text-secondary)}
.output-area{width:100%;flex:1;min-height:400px;padding:16px;background:var(--bg);color:var(--text);border:none;resize:none;font-family:'Fira Code',Consolas,Monaco,monospace;font-size:.85rem;line-height:1.6;outline:none;white-space:pre-wrap;word-break:break-all}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg-secondary)}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 20px;border-radius:var(--radius-sm);background:var(--green);color:#fff;font-size:.85rem;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.align-select{padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);font-size:.75rem}
.col-count{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--text-secondary)}
.col-count input{width:40px;padding:4px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);text-align:center;font-size:.8rem}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);outline:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header class="app-header">
<div>
<h1>📊 Markdown 表格生成器</h1>
<span class="subtitle">将CSV/TSV数据快速转换为Markdown表格</span>
</div>
<div class="btn-group">
<button class="btn" onclick="loadSample()">示例数据</button>
<button class="btn" onclick="clearAll()">清空</button>
</div>
</header>
<div class="container">
<div class="panel">
<div class="panel-header">
<span>📥 输入数据（CSV / TSV / 制表符分隔）</span>
<div class="col-count">
列数: <input type="number" id="colCount" value="3" min="1" max="20" onchange="generateTable()">
</div>
</div>
<textarea id="input" placeholder="粘贴CSV、TSV或用制表符分隔的数据...&#10;&#10;示例：&#10;姓名,年龄,城市&#10;张三,25,北京&#10;李四,30,上海&#10;王五,28,广州"></textarea>
</div>
<div class="panel">
<div class="panel-header">
<span>📤 生成的 Markdown 表格</span>
<div class="btn-group">
<button class="btn" onclick="copyOutput()">📋 复制</button>
</div>
</div>
<textarea class="output-area" id="output" readonly placeholder="Markdown表格将在这里显示..."></textarea>
</div>
</div>
<div class="toolbar">
<span style="font-size:.8rem;color:var(--text-secondary)">列对齐：</span>
<select id="alignMode" class="align-select" onchange="generateTable()">
<option value="left">全部左对齐</option>
<option value="center">全部居中</option>
<option value="right">全部右对齐</option>
<option value="auto" selected>智能对齐（数字右对齐）</option>
</select>
<span style="font-size:.8rem;color:var(--text-secondary);margin-left:8px">分隔符：</span>
<select id="delimiter" class="align-select" onchange="generateTable()">
<option value="auto" selected>自动检测</option>
<option value=",">逗号 (,)</option>
<option value="	">制表符 (Tab)</option>
<option value=";">分号 (;)</option>
<option value="|">管道 (|)</option>
</select>
<span id="rowCount" style="font-size:.8rem;color:var(--text-secondary);margin-left:auto"></span>
</div>
<div class="toast" id="toast">已复制到剪贴板</div>

<script>
const input=document.getElementById('input'),output=document.getElementById('output'),alignMode=document.getElementById('alignMode'),delimiter=document.getElementById('delimiter'),colCount=document.getElementById('colCount'),rowCountEl=document.getElementById('rowCount'),toast=document.getElementById('toast');

input.addEventListener('input',generateTable);

function detectDelimiter(line){
const d=delimiter.value;
if(d!=='auto')return d;
if(line.includes('\t'))return '\t';
if(line.includes(','))return ',';
if(line.includes(';'))return ';';
if(line.includes('|'))return '|';
return ',';
}

function parseRow(line,delim){
const rows=[];let current='';let inQuote=false;
for(let i=0;i<line.length;i++){
const c=line[i];
if(inQuote){
if(c==='"'){if(i+1<line.length&&line[i+1]==='"'){current+='"';i++}else{inQuote=false}}
else{current+=c}
}else{
if(c==='"'){inQuote=true}
else if(c===delim){rows.push(current.trim());current=''}
else{current+=c}
}}
rows.push(current.trim());
return rows;
}

function isNumber(v){return /^-?\d+(\.\d+)?$/.test(v.trim())}

function getAlign(values,colIndex,mode){
if(mode==='left')return '---';
if(mode==='center')return ':---:';
if(mode==='right')return '---:';
const allNum=values.every(v=>isNumber(v[colIndex]));
return allNum?'---:':'---';
}

function generateTable(){
const text=input.value.trim();
if(!text){output.value='';rowCountEl.textContent='';return}
const lines=text.split('\n').filter(l=>l.trim());
if(!lines.length){output.value='';return}
const delim=detectDelimiter(lines[0]);
const rows=lines.map(l=>parseRow(l,delim));
const numCols=parseInt(colCount.value)||3;
const paddedRows=rows.map(r=>{while(r.length<numCols)r.push('');return r.slice(0,numCols)});
const header=paddedRows[0];
const body=paddedRows.slice(1);
const mode=alignMode.value;
const aligns=header.map((_,i)=>getAlign(body.map(r=>r[i]||''),i,mode));
const colWidths=header.map((_,i)=>{
const allVals=[...header,...body].map(r=>r[i]||'');
return Math.max(...allVals.map(v=>v.length),3);
});
function pad(s,w){const len=s.length;return s+' '.repeat(Math.max(0,w-len))}
const md=[];
md.push('| '+header.map((h,i)=>pad(h,colWidths[i])).join(' | ')+' |');
md.push('| '+aligns.map((a,i)=>a==='---'?'-'.repeat(colWidths[i]):a==='---:'?':-'+'-'.repeat(colWidths[i]-1):'-'.repeat(colWidths[i]-1)+':').join(' | ')+' |');
body.forEach(r=>{
md.push('| '+r.map((c,i)=>pad(c||'',colWidths[i])).join(' | ')+' |');
});
output.value=md.join('\n');
rowCountEl.textContent=rows.length+'行 × '+numCols+'列';
}

function copyOutput(){
if(!output.value)return;
navigator.clipboard.writeText(output.value).then(()=>{showToast()});
}

function showToast(){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}

function clearAll(){input.value='';output.value='';rowCountEl.textContent=''}

function loadSample(){
input.value='姓名,年龄,城市,职业\n张三,25,北京,工程师\n李四,30,上海,设计师\n王五,28,广州,产品经理\n赵六,35,深圳,数据分析师\n孙七,22,杭州,前端开发';
colCount.value=4;
generateTable();
}

generateTable();
</script>
</body>
</html>
