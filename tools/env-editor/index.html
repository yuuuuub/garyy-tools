<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.env 编辑器 | Env Editor</title>
<meta property="og:title" content=".env 编辑器 | Env Editor">
<meta property="og:description" content=".env 文件在线编辑器，支持语法高亮和格式转换">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线.env文件编辑器，支持语法高亮、格式转换、导入导出">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
<script src="i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5padding:16px;scroll-behavior:smooth;}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.main{max-width:1400px;margin:0 auto;padding:20px 24px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red-bg)}
.editor-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.editor-wrap{grid-template-columns:1fr}}
.panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:500;color:var(--text-secondary);display:flex;align-items:center;justify-content:space-between}
.editor{width:100%;min-height:500px;padding:16px;border:none;background:var(--bg);color:var(--text);font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.7;resize:vertical;outline:none;tab-size:4}
.editor:focus{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--radius-sm)}
.result-area{flex:1;padding:16px;background:var(--bg);min-height:500px;overflow:auto}
.result-area pre{font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.7;color:var(--text);white-space:pre-wrap}
.line-numbers{padding:16px 8px 16px 16px;background:var(--bg);border-right:1px solid var(--border);color:var(--text-secondary);font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.7;text-align:right;user-select:none;overflow:hidden;min-width:50px}
.var-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);align-items:center;font-family:'Fira Code',Consolas,monospace;font-size:.8rem}
.var-key{color:var(--cyan);font-weight:600;min-width:200px}
.var-eq{color:var(--text-secondary)}
.var-val{color:var(--green);word-break:break-all}
.var-comment{color:var(--text-secondary);font-style:italic}
.stat-bar{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--border);font-size:.8rem;color:var(--text-secondary)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:.85rem;font-weight:500;z-index:99999;transition:opacity .3s}
.toast-success{background:var(--green);color:#fff}
.toast-error{background:var(--red);color:#fff}
.hidden{display:none}
</style>
</head>
<body>
<header class="app-header">
<div>
<h1>⚙️ .env 编辑器</h1>
<span class="subtitle">编辑和转换 .env 配置文件</span>
</div>
<div class="toolbar">
<button class="btn" onclick="loadSample()">加载示例</button>
<button class="btn" onclick="formatEnv()">格式化</button>
<button class="btn" onclick="copyParsed()">📋 复制 JSON</button>
<button class="btn" onclick="downloadEnv()">⬇ 下载 .env</button>
<button class="btn btn-danger" onclick="clearAll()">清空</button>
</div>
</header>
<div class="main">
<div class="editor-wrap">
<div class="panel">
<div class="panel-header"><span>📝 编辑器</span><span id="lineCount">0 行</span></div>
<textarea class="editor" id="envEditor" placeholder="在此输入 .env 内容..." spellcheck="false"></textarea>
<div class="stat-bar"><span id="varCount">0 个变量</span><span id="emptyCount">0 个空行</span><span id="commentCount">0 个注释</span></div>
</div>
<div class="panel">
<div class="panel-header"><span>📊 解析结果</span><span id="parseStatus">就绪</span></div>
<div class="result-area" id="resultArea"><div style="color:var(--text-secondary);text-align:center;padding:40px">输入 .env 内容后自动解析</div></div>
</div>
</div>
</div>

<script>
const editor=document.getElementById('envEditor');
const resultArea=document.getElementById('resultArea');

const SAMPLE=`# 数据库配置
DB_HOST=localhost
DB_PORT=5432
DB_NAME=myapp
DB_USER=admin
DB_PASS=secret123

# API 配置
API_URL=https://api.example.com
API_KEY=sk-abcdef1234567890
API_SECRET=my_secret_key

# 应用配置
APP_NAME=MyApplication
APP_ENV=development
APP_DEBUG=true
APP_PORT=3000

# Redis 配置
REDIS_URL=redis://localhost:6379
REDIS_PREFIX=app:

# 邮件配置
SMTP_HOST=smtp.gmail.com
SMTP_PORT=587
SMTP_USER=user@gmail.com
SMTP_PASS=email_password
`;

function parseEnv(text){
  const lines=text.split('\n');
  const vars=[];
  let comments=0, empty=0;
  lines.forEach(line=>{
    const trimmed=line.trim();
    if(!trimmed){empty++;return}
    if(trimmed.startsWith('#')){comments++;return}
    const eqIdx=trimmed.indexOf('=');
    if(eqIdx===-1)return;
    const key=trimmed.slice(0,eqIdx).trim();
    let val=trimmed.slice(eqIdx+1).trim();
    if((val.startsWith('"')&&val.endsWith('"'))||(val.startsWith("'")&&val.endsWith("'"))){
      val=val.slice(1,-1);
    }
    vars.push({key,val,comment:''});
  });
  return{vars,comments,empty,total:lines.length};
}

function renderParsed(parsed){
  if(!parsed.vars.length){
    resultArea.innerHTML='<div style="color:var(--text-secondary);text-align:center;padding:40px">无解析结果</div>';
    return;
  }
  let html='<div style="padding:4px 0">';
  parsed.vars.forEach(v=>{
    html+=`<div class="var-row"><span class="var-key">${esc(v.key)}</span><span class="var-eq">=</span><span class="var-val">${esc(v.val)}</span></div>`;
  });
  html+='</div>';
  html+=`<div style="padding:12px 0;font-size:.8rem;color:var(--text-secondary)">JSON 输出:</div>`;
  html+=`<pre style="background:var(--bg-tertiary);padding:12px;border-radius:6px;overflow-x:auto"><code>${esc(JSON.stringify(Object.fromEntries(parsed.vars.map(v=>[v.key,v.val])),null,2))}</code></pre>`;
  resultArea.innerHTML=html;
}

function updateStats(parsed){
  document.getElementById('lineCount').textContent=parsed.total+' 行';
  document.getElementById('varCount').textContent=parsed.vars.length+' 个变量';
  document.getElementById('emptyCount').textContent=parsed.empty+' 个空行';
  document.getElementById('commentCount').textContent=parsed.comments+' 个注释';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function onInput(){
  const text=editor.value;
  const parsed=parseEnv(text);
  renderParsed(parsed);
  updateStats(parsed);
  document.getElementById('parseStatus').textContent=parsed.vars.length+' 个变量已解析';
}

function loadSample(){editor.value=SAMPLE;onInput()}

function formatEnv(){
  const parsed=parseEnv(editor.value);
  let out='# 环境变量配置\n\n';
  const groups={};
  parsed.vars.forEach(v=>{
    const prefix=v.key.split('_')[0];
    if(!groups[prefix])groups[prefix]=[];
    groups[prefix].push(v);
  });
  Object.entries(groups).forEach(([group,vars])=>{
    out+=`# ${group} 配置\n`;
    vars.forEach(v=>{out+=`${v.key}=${v.val}\n`});
    out+='\n';
  });
  editor.value=out.trim()+'\n';
  onInput();
  showToast('格式化完成','success');
}

function copyParsed(){
  const parsed=parseEnv(editor.value);
  const obj=Object.fromEntries(parsed.vars.map(v=>[v.key,v.val]));
  navigator.clipboard.writeText(JSON.stringify(obj,null,2)).then(()=>showToast('JSON 已复制','success'));
}

function downloadEnv(){
  const blob=new Blob([editor.value],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='.env';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('已下载 .env','success');
}

function clearAll(){
  editor.value='';
  onInput();
  showToast('已清空','success');
}

function showToast(msg,type='success'){
  const t=document.createElement('div');
  t.className='toast toast-'+type;
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2000);
}

editor.addEventListener('input',onInput);

editor.addEventListener('keydown',function(e){
  if(e.key==='Tab'){
    e.preventDefault();
    const start=this.selectionStart;
    const end=this.selectionEnd;
    this.value=this.value.substring(0,start)+'    '+this.value.substring(end);
    this.selectionStart=this.selectionEnd=start+4;
    onInput();
  }
});
</script>
</body>
</html>
