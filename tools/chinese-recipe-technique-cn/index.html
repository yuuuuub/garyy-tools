<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中餐烹饪技法 - Chinese Recipe Techniques</title>
<meta name="description" content="中餐烹饪技法大全，详解炒、蒸、煮、炖、炸、烤等传统中式烹饪方法">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中餐烹饪技法 - Chinese Recipe Techniques">
<meta property="og:description" content="详解炒、蒸、煮、炖、炸、烤等传统中式烹饪方法">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-recipe-technique-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔪</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
header{background:linear-gradient(135deg,#1a0a00,#2a1505,#3d200a);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3010;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1200px;margin:0 auto;padding:20px}
.search-box{margin-bottom:16px}
.search-box input{width:100%;padding:12px 16px;border-radius:10px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none}
.search-box input:focus{border-color:var(--accent)}
.filter-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.filter-btn{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.82em;transition:all .2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.technique-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:14px}
.tech-card{background:var(--card);border-radius:12px;padding:20px;border:1px solid var(--border);transition:all .3s;cursor:pointer;position:relative;overflow:hidden}
.tech-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:12px 0 0 12px}
.tech-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.tech-card .t-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tech-card .t-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4em;background:rgba(232,168,124,.15);flex-shrink:0}
.tech-card .t-name{font-size:1.2em;font-weight:bold}
.tech-card .t-en{font-size:.78em;color:var(--text2)}
.tech-card .t-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tech-card .t-meta span{font-size:.72em;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text2)}
.tech-card .t-desc{font-size:.82em;color:var(--text2);line-height:1.6}
.tech-card .t-dishes{margin-top:8px;font-size:.78em;color:var(--accent)}
.tech-card.hidden{display:none}
.detail-panel{background:var(--card);border-radius:14px;padding:24px;border:1px solid var(--border);margin-top:20px;display:none}
.detail-panel.show{display:block;animation:fadeIn .3s}
.detail-panel h2{font-size:1.4em;margin-bottom:10px}
.detail-panel .desc{font-size:.88em;color:var(--text2);line-height:1.7;margin-bottom:14px}
.detail-panel .sub-title{font-size:.95em;font-weight:bold;color:var(--accent);margin:14px 0 8px}
.detail-panel ul{list-style:none;padding:0}
.detail-panel ul li{padding:6px 0;border-bottom:1px solid var(--border);font-size:.85em;color:var(--text2);display:flex;align-items:center;gap:8px}
.detail-panel ul li::before{content:'•';color:var(--accent);font-weight:bold}
footer{text-align:center;padding:30px;color:var(--text2);font-size:.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.technique-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🔪 中餐烹饪技法</h1>
<p>Chinese Recipe Techniques — 详解中式传统烹饪方法</p>
</header>
<div class="container">
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索烹饪技法..."></div>
<div class="filter-btns" id="filterBtns">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="火功">🔥 火功类</button>
<button class="filter-btn" data-filter="水功">💧 水功类</button>
<button class="filter-btn" data-filter="刀工">🔪 刀工类</button>
<button class="filter-btn" data-filter="调味">🧂 调味类</button>
</div>
<div class="technique-grid" id="techGrid"></div>
<div class="detail-panel" id="detailPanel"></div>
<footer><p>🔪 中餐烹饪技法 — 火候到家，色香味全</p></footer>
</div>
<script>
const TECHNIQUES=[
{name:"炒",en:"Stir-frying",icon:"🔥",category:"火功",difficulty:"中等",heat:"旺火",desc:"中餐最核心的烹饪技法。旺火热油，快速翻炒，保持食材脆嫩。分为生炒、熟炒、滑炒、干炒、软炒等。",subtypes:["生炒：生料直接下锅翻炒","熟炒：熟料回锅翻炒","滑炒：上浆后低温滑油再炒","干炒：不勾芡，炒干水分","软炒：蛋奶类软嫩食材翻炒"],dishes:["清炒时蔬","滑炒肉丝","干炒牛河","软炒虾仁","回锅肉"],tips:"关键在于'镬气'——高温产生的独特焦香。食材要切得大小均匀，火要旺，动作要快。"},
{name:"蒸",en:"Steaming",icon:"♨️",category:"水功",difficulty:"简单",heat:"大火",desc:"利用蒸汽加热，最大程度保留食材原味和营养。是中国最健康的烹饪方式之一。",subtypes:["清蒸：原汁原味","粉蒸：裹米粉蒸制","酿蒸：填充馅料蒸制","包蒸：用荷叶等包裹蒸制"],dishes:["清蒸鱼","粉蒸肉","蒸排骨","蒸蛋","蒸包子"],tips:"蒸鱼要水开后放鱼，蒸制时间不可过长。蒸蛋要用温水，比例1:1.5。"},
{name:"煮",en:"Boiling",icon:"💧",category:"水功",difficulty:"简单",heat:"中火",desc:"将食材放入液体中加热至熟。分为白煮、酱煮、卤煮等。汤底可做汤品。",subtypes:["白煮：清水煮制","酱煮：酱油调味煮制","卤煮：卤汁慢煮","水煮：川菜特色，麻辣汤底"],dishes:["白切鸡","水煮牛肉","白煮肉","煮饺","汤圆"],tips:"煮肉要冷水下锅去血沫。煮鱼要沸水下锅保持形状。"},
{name:"炖",en:"Stewing",icon:"🫕",category:"水功",difficulty:"中等",heat:"小火",desc:"食材与汤汁一起长时间加热，使味道充分融合。汤汁浓郁，肉质酥烂。",subtypes:["清炖：汤清味鲜","红炖：酱油上色","隔水炖：汤盅隔水加热","砂锅炖：砂锅慢炖"],dishes:["红烧肉","东坡肉","炖鸡汤","炖牛肉","佛跳墙"],tips:"小火慢炖是关键。水要一次加足，中途不要加冷水。"},
{name:"炸",en:"Deep-frying",icon:"🫧",category:"火功",difficulty:"中等",heat:"中旺火",desc:"食材完全浸入热油中加热。外酥里嫩，色泽金黄。分为干炸、软炸、酥炸等。",subtypes:["干炸：直接裹粉炸","软炸：挂蛋糊炸","酥炸：多次炸制","清炸：不裹任何粉料"],dishes:["糖醋里脊","炸鸡排","干炸丸子","酥肉","春卷"],tips:"油温控制是关键。一般需要复炸——第一次低温炸熟，第二次高温炸酥。"},
{name:"烤",en:"Roasting/Grilling",icon:"🔥",category:"火功",difficulty:"中等",heat:"中火",desc:"利用辐射热加热食材。皮脆肉嫩，香气浓郁。分为明烤、暗烤、叉烧等。",subtypes:["明烤：直接火烤","暗烤：烤箱烤制","叉烧：悬挂烤制","泥烤：裹泥烤制"],dishes:["北京烤鸭","叉烧","叫化鸡","烤全羊","烤乳猪"],tips:"烤鸭要提前风干鸭皮。烤肉时要注意翻面，保持受热均匀。"},
{name:"煎",en:"Pan-frying",icon:"🍳",category:"火功",difficulty:"简单",heat:"中小火",desc:"少量油加热，食材单面或双面煎制。外焦里嫩，色泽诱人。",subtypes:["干煎：少油煎制","软煎：挂糊煎制","香煎：煎至焦香","水煎：底部煎制加水焖"],dishes:["煎饺","煎蛋","香煎鲈鱼","水煎包","锅贴"],tips:"煎制时不要频繁翻动。等一面煎定型后再翻面。"},
{name:"焖",en:"Braising",icon:"🫕",category:"水功",difficulty:"中等",heat:"中小火",desc:"先煎炒后加液体，加盖小火慢煮。食材入味，汤汁浓稠。",subtypes:["红焖：酱油上色","黄焖：黄色酱汁","油焖：少油焖制"],dishes:["油焖大虾","黄焖鸡","红焖羊肉","焖面","焖饭"],tips:"焖制时火不能太大。汤汁要收浓但不能烧干。"},
{name:"溜",en:"Quick-frying with sauce",icon:"💨",category:"火功",difficulty:"困难",heat:"旺火",desc:"食材先炸或蒸，再浇上快速调制的芡汁。汁紧包裹，口感滑嫩。",subtypes:["焦溜：炸后浇汁","滑溜：滑嫩浇汁","醋溜：醋味芡汁","糟溜：酒糟芡汁"],dishes:["焦溜肉片","醋溜白菜","糟溜鱼片","溜肉段","溜肝尖"],tips:"芡汁要调好再下锅，动作要快。汁要均匀包裹食材。"},
{name:"爆",en:"Quick-frying",icon:"⚡",category:"火功",difficulty:"困难",heat:"极旺火",desc:"极旺火快速翻炒，瞬间锁住食材水分。口感脆嫩，锅气十足。",subtypes:["油爆：热油爆制","芫爆：香菜爆制","酱爆：酱料爆制","葱爆：大葱爆制"],dishes:["爆炒腰花","油爆双脆","芫爆散丹","酱爆鸡丁","葱爆羊肉"],tips:"火要极旺，动作要极快。食材要切得薄而均匀。"},
{name:"刀工",en:"Knife Skills",icon:"🔪",category:"刀工",difficulty:"困难",heat:"—",desc:"中式烹饪的基础功底。刀法决定了食材的形状、口感和入味程度。",subtypes:["切：直切、推切、拉切、锯切","片：正片、反片、斜片","剞：十字花刀、柳叶花刀","斩：剁、斩、砍"],dishes:["文思豆腐（切丝）","松鼠鳜鱼（剞花刀）","菊花鱼","腰花（十字花刀）"],tips:"刀工讲究'片薄如纸、切细如丝、剞花如菊'。需要长期练习。"},
{name:"调味",en:"Seasoning",icon:"🧂",category:"调味",difficulty:"中等",heat:"—",desc:"中餐调味讲究'五味调和'。酸、甜、苦、辣、咸五味平衡是中餐的灵魂。",subtypes:["复合味型：鱼香、怪味、椒麻","基础调味：盐、糖、醋、酱油","增香调味：葱姜蒜、花椒、八角","提鲜调味：味精、鸡精、蚝油"],dishes:["鱼香味型","怪味味型","椒麻味型","麻辣味型","酸辣味型"],tips:"调味讲究'先后顺序'——先放的入味，后放的提香。盐要最后调。"}
];
function render(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const cat=document.querySelector('.filter-btn.active').dataset.filter;
  const grid=document.getElementById('techGrid');
  const filtered=TECHNIQUES.filter(t=>{
    if(q&&!t.name.includes(q)&&!t.en.toLowerCase().includes(q))return false;
    if(cat!=='all'&&t.category!==cat)return false;
    return true;
  });
  if(!filtered.length){grid.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2);grid-column:1/-1">未找到匹配的技法</div>';return}
  grid.innerHTML=filtered.map((t,i)=>`
    <div class="tech-card" onclick="showDetail(${TECHNIQUES.indexOf(t)})">
      <div class="t-head"><div class="t-icon">${t.icon}</div><div><div class="t-name">${t.name}</div><div class="t-en">${t.en}</div></div></div>
      <div class="t-meta"><span>${t.category}</span><span>🔥 ${t.heat}</span><span>${t.difficulty}</span></div>
      <div class="t-desc">${t.desc.substring(0,60)}...</div>
      <div class="t-dishes">代表菜：${t.dishes.slice(0,3).join('、')}</div>
    </div>`).join('');
}
function showDetail(idx){
  const t=TECHNIQUES[idx];
  const panel=document.getElementById('detailPanel');
  panel.className='detail-panel show';
  panel.innerHTML=`
    <h2>${t.icon} ${t.name} <span style="font-size:.5em;color:var(--text2)">${t.en}</span></h2>
    <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap"><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">${t.category}</span><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">🔥 ${t.heat}</span><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">${t.difficulty}</span></div>
    <div class="desc">${t.desc}</div>
    <div class="sub-title">分类变体</div>
    <ul>${t.subtypes.map(s=>`<li>${s}</li>`).join('')}</ul>
    <div class="sub-title">代表菜品</div>
    <ul>${t.dishes.map(d=>`<li>${d}</li>`).join('')}</ul>
    <div class="sub-title">💡 技法要点</div>
    <div style="background:rgba(232,168,124,.1);border:1px solid var(--accent);border-radius:10px;padding:14px;font-size:.85em;color:var(--text2);line-height:1.7">${t.tips}</div>`;
  panel.scrollIntoView({behavior:'smooth'});
}
document.getElementById('searchInput').addEventListener('input',render);
document.getElementById('filterBtns').addEventListener('click',e=>{
  if(!e.target.classList.contains('filter-btn'))return;
  e.target.parentElement.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  render();
});
render();
</script>
</body>
</html>
