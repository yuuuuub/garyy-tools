<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国诗词游戏</title><meta name="description" content="中国诗词游戏 - 猜诗人、填诗句、诗词接龙"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#d29922;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin:4px}.btn:hover{opacity:.85}.btn.active{background:var(--green)}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}.mode-tabs{display:flex;gap:8px;margin-bottom:16px;justify-content:center;flex-wrap:wrap}.mode-tab{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text2);font-size:.85rem}.mode-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.poem-display{text-align:center;padding:30px 20px;background:var(--bg);border-radius:12px;margin:16px 0;border-left:4px solid var(--blue)}.poem-line{font-size:1.3rem;line-height:2.2;color:var(--text)}.poem-line .blank{display:inline-block;min-width:4em;border-bottom:3px dashed var(--blue);margin:0 4px;color:var(--blue)}.poem-author{font-size:.9rem;color:var(--text2);margin-top:12px}.poem-title{font-size:1.1rem;color:var(--yellow);margin-bottom:8px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.option-btn{padding:14px;background:var(--bg);border:2px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;cursor:pointer;transition:all .2s;text-align:center}.option-btn:hover{border-color:var(--blue);transform:scale(1.02)}.option-btn.correct{background:rgba(35,134,54,.3);border-color:var(--green)}.option-btn.wrong{background:rgba(239,68,68,.3);border-color:var(--red)}.feedback{padding:12px;border-radius:8px;margin-top:12px;text-align:center;font-weight:600;display:none}.feedback.show{display:block}.feedback.correct{background:rgba(35,134,54,.2);color:var(--green)}.feedback.wrong{background:rgba(239,68,68,.2);color:var(--red)}.score-bar{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:8px;margin-top:12px}.score-val{font-size:1.3rem;font-weight:700;color:var(--blue)}.poem-card{padding:16px;background:var(--bg);border-radius:8px;margin-bottom:12px;border-left:3px solid var(--blue);cursor:pointer;transition:all .2s}.poem-card:hover{transform:translateY(-2px)}.poem-card .title{font-size:1.1rem;margin-bottom:4px}.poem-card .author{font-size:.85rem;color:var(--text2)}.poem-card .dynasty{font-size:.75rem;color:var(--yellow);display:inline-block;background:rgba(210,153,34,.15);padding:2px 8px;border-radius:10px;margin-left:8px}.tag{display:inline-block;padding:4px 10px;background:rgba(59,130,246,.15);color:var(--blue);border-radius:12px;font-size:.75rem;margin:2px}</style><meta property="og:title" content="中国诗词游戏"><meta property="og:description" content="中国诗词游戏 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📜 中国诗词游戏</h1><p class="sub">猜诗人、填诗句、诗词知识</p>
<div class="card">
<div class="mode-tabs">
<div class="mode-tab active" onclick="switchMode('poet',this)">猜诗人</div>
<div class="mode-tab" onclick="switchMode('fill',this)">诗句填空</div>
<div class="mode-tab" onclick="switchMode('complete',this)">补全诗句</div>
<div class="mode-tab" onclick="switchMode('dynasty',this)">朝代问答</div>
<div class="mode-tab" onclick="switchMode('browse',this)">诗词库</div>
</div>
<div class="btn-group">
<button class="btn" onclick="startGame()">开始游戏</button>
<button class="btn" onclick="skipQuestion()">跳过</button>
<button class="btn" onclick="useHint()">提示</button>
</div>
<div class="score-bar">
<div><span class="score-val" id="score">0</span> 分</div>
<div><span id="qNum">0</span>/<span id="qTotal">20</span></div>
<div>🔥 <span id="streak">0</span> 连对</div>
</div>
</div>
<div class="card" id="quizArea">
<div class="poem-display" id="questionDisplay">点击"开始游戏"</div>
<div class="options" id="optionsArea"></div>
<div class="feedback" id="feedback"></div>
</div>
<div class="card" id="browseArea" style="display:none">
<div id="browseList"></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var poems=[
{title:'静夜思',author:'李白',dynasty:'唐',lines:['床前明月光，','疑是地上霜。','举头望明月，','低头思故乡。'],tags:['思乡','月']},
{title:'春晓',author:'孟浩然',dynasty:'唐',lines:['春眠不觉晓，','处处闻啼鸟。','夜来风雨声，','花落知多少。'],tags:['春天','写景']},
{title:'登鹳雀楼',author:'王之涣',dynasty:'唐',lines:['白日依山尽，','黄河入海流。','欲穷千里目，','更上一层楼。'],tags:['写景','哲理']},
{title:'悯农',author:'李绅',dynasty:'唐',lines:['锄禾日当午，','汗滴禾下土。','谁知盘中餐，','粒粒皆辛苦。'],tags:['劳动','珍惜']},
{title:'望庐山瀑布',author:'李白',dynasty:'唐',lines:['日照香炉生紫烟，','遥看瀑布挂前川。','飞流直下三千尺，','疑是银河落九天。'],tags:['写景','瀑布']},
{title:'江雪',author:'柳宗元',dynasty:'唐',lines:['千山鸟飞绝，','万径人踪灭。','孤舟蓑笠翁，','独钓寒江雪。'],tags:['冬天','孤独']},
{title:'枫桥夜泊',author:'张继',dynasty:'唐',lines:['月落乌啼霜满天，','江枫渔火对愁眠。','姑苏城外寒山寺，','夜半钟声到客船。'],tags:['夜景','思乡']},
{title:'游子吟',author:'孟郊',dynasty:'唐',lines:['慈母手中线，','游子身上衣。','临行密密缝，','意恐迟迟归。','谁言寸草心，','报得三春晖。'],tags:['母爱','感恩']},
{title:'出塞',author:'王昌龄',dynasty:'唐',lines:['秦时明月汉时关，','万里长征人未还。','但使龙城飞将在，','不教胡马度阴山。'],tags:['边塞','爱国']},
{title:'望岳',author:'杜甫',dynasty:'唐',lines:['岱宗夫如何？齐鲁青未了。','造化钟神秀，阴阳割昏晓。','荡胸生曾云，决眦入归鸟。','会当凌绝顶，一览众山小。'],tags:['泰山','壮志']},
{title:'春望',author:'杜甫',dynasty:'唐',lines:['国破山河在，城春草木深。','感时花溅泪，恨别鸟惊心。'],tags:['爱国','忧民']},
{title:'将进酒',author:'李白',dynasty:'唐',lines:['君不见黄河之水天上来，','奔流到海不复回。','君不见高堂明镜悲白发，','朝如青丝暮成雪。'],tags:['豪放','饮酒']},
{title:'水调歌头',author:'苏轼',dynasty:'宋',lines:['明月几时有？把酒问青天。','不知天上宫阙，今夕是何年。'],tags:['中秋','思亲']},
{title:'念奴娇·赤壁怀古',author:'苏轼',dynasty:'宋',lines:['大江东去，浪淘尽，千古风流人物。'],tags:['怀古','豪放']},
{title:'满江红',author:'岳飞',dynasty:'宋',lines:['怒发冲冠，凭栏处、潇潇雨歇。','抬望眼、仰天长啸，壮怀激烈。'],tags:['爱国','豪放']},
{title:'声声慢',author:'李清照',dynasty:'宋',lines:['寻寻觅觅，冷冷清清，','凄凄惨惨戚戚。'],tags:['婉约','愁绪']},
{title:'如梦令',author:'李清照',dynasty:'宋',lines:['昨夜雨疏风骤，浓睡不消残酒。','试问卷帘人，却道海棠依旧。'],tags:['婉约','惜春']},
{title:'天净沙·秋思',author:'马致远',dynasty:'元',lines:['枯藤老树昏鸦，小桥流水人家，','古道西风瘦马。','夕阳西下，断肠人在天涯。'],tags:['思乡','秋天']},
{title:'虞美人',author:'李煜',dynasty:'南唐',lines:['春花秋月何时了？往事知多少。','小楼昨夜又东风，故国不堪回首月明中。'],tags:['亡国','愁绪']},
{title:'饮酒',author:'陶渊明',dynasty:'东晋',lines:['结庐在人境，而无车马喧。','问君何能尔？心远地自偏。'],tags:['田园','隐居']}
];
var mode='quiz',currentQ=null,score=0,qNum=0,totalQ=20,streak=0,maxStreak=0,history=[],usedIds=[];
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function switchMode(m,el){mode=m;document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');score=0;qNum=0;streak=0;history=[];usedIds=[];updateScore();
document.getElementById('browseArea').style.display=m==='browse'?'block':'none';
document.getElementById('quizArea').style.display=m==='browse'?'none':'block';
if(m==='browse')renderBrowse();
if(m!=='browse'){document.getElementById('questionDisplay').innerHTML='点击"开始游戏"';document.getElementById('optionsArea').innerHTML='';document.getElementById('feedback').className='feedback';}
}
function startGame(){score=0;qNum=0;streak=0;history=[];usedIds=[];totalQ=20;updateScore();nextQuestion();}
function nextQuestion(){
if(qNum>=totalQ){showResult();return;}
var available=[];for(var i=0;i<poems.length;i++){if(usedIds.indexOf(i)===-1)available.push(i);}
if(available.length===0){usedIds=[];available=poems.map(function(_,i){return i;});}
var idx=available[Math.floor(Math.random()*available.length)];usedIds.push(idx);currentQ=poems[idx];qNum++;
document.getElementById('qNum').textContent=qNum;document.getElementById('qTotal').textContent=totalQ;
document.getElementById('feedback').className='feedback';
if(mode==='poet'){
document.getElementById('questionDisplay').innerHTML='<div class="poem-title">《'+currentQ.title+'》</div><div class="poem-line">'+currentQ.lines[0]+'</div><div class="poem-author">这首诗的作者是谁？</div>';
renderPoetOptions();
}else if(mode==='fill'){
var lineIdx=Math.floor(Math.random()*currentQ.lines.length);
var line=currentQ.lines[lineIdx];
var chars=line.replace(/[，。！？、；：]/g,'').split('');
var fillIdx=Math.floor(Math.random()*chars.length);
var display='';for(var i=0;i<line.length;i++){var ch=line[i];if('，。！？、；：'.indexOf(ch)>=0)display+=ch;else{if(chars.indexOf(ch)===fillIdx||line.substring(0,i+1).replace(/[，。！？、；：]/g,'').length-1===fillIdx)display+='<span class="blank">?</span>';else display+=ch;}}
document.getElementById('questionDisplay').innerHTML='<div class="poem-title">《'+currentQ.title+'》</div><div class="poem-line">'+display+'</div><div class="poem-author">'+currentQ.dynasty+' · '+currentQ.author+'</div>';
renderFillCharOptions(chars[fillIdx]);
}else if(mode==='complete'){
var lastLine=currentQ.lines[currentQ.lines.length-1];
document.getElementById('questionDisplay').innerHTML='<div class="poem-title">《'+currentQ.title+'》</div>';
var linesHtml='';currentQ.lines.forEach(function(l,i){linesHtml+='<div class="poem-line">'+l+'</div>';});
document.getElementById('questionDisplay').innerHTML+='<div class="poem-line">'+currentQ.lines.slice(0,-1).join('')+'</div>';
document.getElementById('questionDisplay').innerHTML+='<div class="poem-line">？</div><div class="poem-author">'+currentQ.dynasty+' · '+currentQ.author+'</div>';
renderCompleteOptions(lastLine);
}else{
document.getElementById('questionDisplay').innerHTML='<div class="poem-title">这首诗属于哪个朝代？</div><div class="poem-line">《'+currentQ.title+'》· '+currentQ.author+'</div>';
renderDynastyOptions();
}
}
function renderPoetOptions(){
var wrongs=shuffle(poems.filter(function(p){return p.author!==currentQ.author;})).slice(0,3).map(function(p){return p.author;});
var opts=shuffle([currentQ.author].concat(wrongs));
var html='';opts.forEach(function(o){html+='<button class="option-btn" onclick="checkAnswer(this,\''+o+'\')">'+o+'</button>';});
document.getElementById('optionsArea').innerHTML=html;
}
function renderFillCharOptions(correct){
var allChars='一二三四五六七八九十百千万大小上下左右前后东西南北天地人日月水火山石花鸟风雨春夏秋冬山河明月春风';var opts=[correct];while(opts.length<4){var c=allChars[Math.floor(Math.random()*allChars.length)];if(opts.indexOf(c)===-1)opts.push(c);}
opts=shuffle(opts);
var html='';opts.forEach(function(o){html+='<button class="option-btn" onclick="checkFill(this,\''+o+'\')">'+o+'</button>';});
document.getElementById('optionsArea').innerHTML=html;
}
function renderCompleteOptions(correct){
var wrongPool=poems.filter(function(p){return p.lines[p.lines.length-1]!==correct;});
var wrongs=shuffle(wrongPool).slice(0,3).map(function(p){return p.lines[p.lines.length-1];});
var opts=shuffle([correct].concat(wrongs));
var html='';opts.forEach(function(o){html+='<button class="option-btn" onclick="checkAnswer(this,\''+o.replace(/'/g,"\\'").replace(/'/g,"\\'")+'\')">'+o+'</button>';});
document.getElementById('optionsArea').innerHTML=html;
}
function renderDynastyOptions(){
var dynasties=['唐','宋','元','明','清','东晋','南唐','先秦'];
var opts=shuffle([currentQ.dynasty].concat(dynasties.filter(function(d){return d!==currentQ.dynasty;}).slice(0,3)));
var html='';opts.forEach(function(o){html+='<button class="option-btn" onclick="checkAnswer(this,\''+o+'\')">'+o+'</button>';});
document.getElementById('optionsArea').innerHTML=html;
}
function checkAnswer(el,ans){
var correct;
if(mode==='poet')correct=ans===currentQ.author;
else if(mode==='complete')correct=ans===currentQ.lines[currentQ.lines.length-1];
else if(mode==='dynasty')correct=ans===currentQ.dynasty;
else correct=ans===currentQ.meaning;
showFeedback(el,correct);
}
function checkFill(el,ans){
var correct=ans===currentQ.lines.join('').replace(/[，。！？、；：]/g,'')[Math.floor(Math.random()*currentQ.lines.join('').replace(/[，。！？、；：]/g,'').length)];
showFeedback(el,correct);
}
function showFeedback(el,correct){
var fb=document.getElementById('feedback');
if(correct){el.classList.add('correct');fb.className='feedback show correct';fb.textContent='✓ 正确！';score+=10+streak*2;streak++;if(streak>maxStreak)maxStreak=streak;history.push(true);}else{el.classList.add('wrong');fb.className='feedback show wrong';var ans=mode==='poet'?currentQ.author:mode==='complete'?currentQ.lines[currentQ.lines.length-1]:mode==='dynasty'?currentQ.dynasty:'答案';fb.textContent='✗ 答案：'+ans;streak=0;history.push(false);}
updateScore();
document.querySelectorAll('.option-btn').forEach(function(b){b.onclick=null;b.style.cursor='default';});
setTimeout(nextQuestion,1800);
}
function skipQuestion(){streak=0;history.push(false);updateScore();setTimeout(nextQuestion,500);}
function useHint(){
if(mode==='poet')document.getElementById('feedback').className='feedback show',document.getElementById('feedback').textContent='💡 提示：'+currentQ.dynasty+'代诗人，诗仙';
else if(mode==='complete')document.getElementById('feedback').className='feedback show',document.getElementById('feedback').textContent='💡 提示：最后一句是关于...';
else document.getElementById('feedback').className='feedback show',document.getElementById('feedback').textContent='💡 提示：'+currentQ.author+'是'+currentQ.dynasty+'代诗人';
score=Math.max(0,score-3);updateScore();
}
function updateScore(){document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;}
function renderBrowse(){
var html='';poems.forEach(function(p,i){
html+='<div class="poem-card" onclick="togglePoem('+i+')">';
html+='<div class="title">《'+p.title+'》<span class="dynasty">'+p.dynasty+'</span></div>';
html+='<div class="author">'+p.author+'</div>';
html+='<div style="display:none;margin-top:12px" id="poemDetail'+i+'">';
p.lines.forEach(function(l){html+='<div class="poem-line">'+l+'</div>';});
html+='<div style="margin-top:8px">';p.tags.forEach(function(t){html+='<span class="tag">'+t+'</span>';});html+='</div></div></div>';
});
document.getElementById('browseList').innerHTML=html;
}
function togglePoem(i){var d=document.getElementById('poemDetail'+i);d.style.display=d.style.display==='none'?'block':'none';}
function showResult(){
var correct=history.filter(Boolean).length;
var pct=Math.round(correct/totalQ*100);
var grade=pct>=90?'S':pct>=80?'A':pct>=70?'B':pct>=60?'C':'D';
document.getElementById('quizArea').innerHTML='<div style="text-align:center;padding:30px"><div style="font-size:4rem;margin-bottom:16px">'+grade+'</div><h2>游戏结束</h2><p style="color:var(--text2);margin:12px 0">正确率：'+pct+'% ('+correct+'/'+totalQ+')</p><p style="color:var(--text2)">最高连对：'+maxStreak+'</p><p style="color:var(--blue);font-size:1.2rem;margin-top:12px">总分：'+score+'</p><button class="btn" onclick="startGame()" style="margin-top:16px">再来一局</button></div>';
}
</script></body></html>
