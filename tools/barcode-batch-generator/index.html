<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量条形码生成器</title>
<meta name="description" content="批量生成QR二维码，支持CSV导入和一键下载所有码">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;min-height:100vh;scroll-behavior:smooth}
.container{max-width:900px;margin:auto;padding-bottom:50px;text-align:center}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.input-group{margin-bottom:14px;text-align:left}
.input-group label{display:block;font-size:.82rem;color:var(--text2);margin-bottom:6px}
.input-group textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85rem;outline:none;font-family:monospace;min-height:120px;resize:vertical}
.input-group textarea:focus{border-color:var(--blue)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.btn{padding:10px 24px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.85rem;background:var(--blue);color:#fff;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.green{background:var(--green)}
.btn.gold{background:var(--gold);color:#000}
.btn.sm{padding:8px 16px;font-size:.78rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px}
.qr-item{background:#fff;border-radius:8px;padding:12px;text-align:center}
.qr-item canvas{display:block;margin:0 auto 6px}
.qr-item .label{font-size:.7rem;color:#333;word-break:break-all;max-height:2.4em;overflow:hidden}
.qr-item .actions{display:flex;gap:4px;justify-content:center;margin-top:6px}
.qr-item .actions button{padding:4px 10px;border:none;border-radius:4px;cursor:pointer;font-size:.7rem}
.count-badge{display:inline-block;padding:4px 12px;border-radius:12px;background:rgba(59,130,246,.15);color:var(--blue);font-size:.8rem;margin:8px 0}
.size-options{display:flex;gap:8px;justify-content:center;margin:12px 0}
.size-btn{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text2);cursor:pointer;font-size:.8rem;transition:all .15s}
.size-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(59,130,246,.1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="批量条形码生成器">
<meta property="og:description" content="批量生成QR二维码，支持CSV导入">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/barcode-batch-generator/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>批量二维码生成器</h1><p>一次生成多个二维码，支持CSV导入</p></header>
<div class="card">
<div class="input-group">
<label>每行输入一个内容（最多50个）</label>
<textarea id="batch-input" placeholder="每行一个，例如：
https://example.com/product/1
https://example.com/product/2
https://example.com/product/3">https://garyy.top
https://github.com
https://google.com</textarea>
</div>
<div class="size-options">
<button class="size-btn" data-size="100">小</button>
<button class="size-btn active" data-size="130">中</button>
<button class="size-btn" data-size="160">大</button>
</div>
<div class="btn-row">
<button class="btn green" id="generate-btn">批量生成</button>
<button class="btn gold" id="download-all-btn">下载全部 (ZIP)</button>
</div>
<div class="count-badge" id="count-badge">已输入 3 条</div>
</div>
<div class="card">
<div id="qr-grid" class="grid"></div>
</div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const input=$('batch-input');
let qrSize=130;

const GF256={exp:new Array(512),log:new Array(256)};
(function(){let v=1;for(let i=0;i<255;i++){GF256.exp[i]=v;GF256.log[v]=i;v=(v*2)^(v>=128?0x11d:0);}for(let i=255;i<512;i++)GF256.exp[i]=GF256.exp[i-255];})();
function gfMul(a,b){if(a===0||b===0)return 0;return GF256.exp[(GF256.log[a]+GF256.log[b])%255];}
function gfPow(a,n){return GF256.exp[(GF256.log[a]*n)%255];}
function reedSolomonEncode(data,eccCount){let gen=[1];for(let i=0;i<eccCount;i++){const term=[1,gfPow(2,i)];const ng=new Array(gen.length+1).fill(0);for(let j=0;j<gen.length;j++){ng[j]^=gfMul(gen[j],term[0]);ng[j+1]^=gfMul(gen[j],term[1]);}gen=ng;}const msg=[...data,...new Array(eccCount).fill(0)];for(let i=0;i<data.length;i++){if(msg[i]!==0){const f=GF256.log[msg[i]];for(let j=0;j<gen.length;j++){msg[i+j]^=GF256.exp[(f+GF256.log[gen[j]])%255];}}}return msg.slice(data.length);}

function generateQRMatrix(text){
  const data=[];const str=String(text);
  for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);if(c<128)data.push(c);else if(c<0x800){data.push(0xc0|(c>>6));data.push(0x80|(c&0x3f));}else{data.push(0xe0|(c>>12));data.push(0x80|((c>>6)&0x3f));data.push(0x80|(c&0x3f));}}
  const versions=[{ver:2,total:44,ecc:18,blocks:1},{ver:3,total:70,ecc:26,blocks:1},{ver:4,total:100,ecc:36,blocks:2},{ver:5,total:134,ecc:48,blocks:2}];
  let vi=versions[versions.length-1];
  for(const v of versions){if(data.length+3<=Math.floor((v.total-v.ecc)/2)){vi=v;break;}}
  const{ver,total,ecc,blocks}=vi;const ms=17+ver*4;
  const enc=[0x40];if(ver<10)enc.push(data.length);else{enc.push(data.length>>8);enc.push(data.length&0xff);}
  data.forEach(b=>enc.push(b));
  const td=total-ecc*blocks;while(enc.length<td){enc.push(0xec);if(enc.length<td)enc.push(0x11);}
  const allData=[];const bs=Math.ceil(enc.length/blocks);
  for(let b=0;b<blocks;b++){const s=b*bs;const d=enc.slice(s,s+bs);allData.push({data:d,ecc:reedSolomonEncode(d,ecc)});}
  const fb=[];const ml=Math.max(...allData.map(b=>b.data.length));
  for(let i=0;i<ml;i++)for(const blk of allData)if(i<blk.data.length)fb.push(blk.data[i]);
  for(let i=0;i<ecc;i++)for(const blk of allData)if(i<blk.ecc.length)fb.push(blk.ecc[i]);
  const mx=[];for(let i=0;i<ms;i++)mx[i]=new Array(ms).fill(0);
  function addFP(x,y){for(let r=-1;r<=7;r++)for(let c=-1;c<=7;c++){if(x+c<0||x+c>=ms||y+r<0||y+r>=ms)continue;if(r>=0&&r<=6&&c>=0&&c<=6){mx[y+r][x+c]=(r===0||r===6||c===0||c===6||((r>=2&&r<=4)&&(c>=2&&c<=4)))?1:0;}else mx[y+r][x+c]=0;}}
  addFP(0,0);addFP(ms-7,0);addFP(0,ms-7);
  for(let i=8;i<ms-8;i++){mx[6][i]=i%2===0?1:0;mx[i][6]=i%2===0?1:0;}
  let bi=0,dir=-1;
  for(let col=ms-1;col>0;col-=2){if(col===6)col--;for(let row=dir===-1?ms-1:0;row>=0&&row<ms;row+=dir){for(let c=0;c<2;c++){const x=col-c;if(x<0||mx[row][x]!==0||row===8||x===8)continue;if((row<8&&x<8)||(row<8&&x>=ms-8)||(row>=ms-8&&x<8))continue;if(bi<fb.length*8){mx[row][x]=(fb[Math.floor(bi/8)]>>(7-(bi%8)))&1;bi++;}else mx[row][x]=0;}}dir=-dir;}
  for(let r=0;r<ms;r++)for(let c=0;c<ms;c++){if((r<9&&c<9)||(r<9&&c>=ms-8)||(r>=ms-8&&c<9)||r===6||c===6||r===8||c===8)continue;if((r+c)%2===0)mx[r][c]=mx[r][c]===0?1:0;}
  return mx;
}

function drawQRToCanvas(canvas,text){
  const mx=generateQRMatrix(text);const ms=mx.length;const cs=canvas.width/ms;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let r=0;r<ms;r++)for(let c=0;c<ms;c++)if(mx[r][c]){ctx.fillStyle='#000';ctx.fillRect(c*cs,r*cs,Math.ceil(cs),Math.ceil(cs));}
}

function getLines(){return input.value.split('\n').map(l=>l.trim()).filter(l=>l.length>0);}

input.addEventListener('input',function(){
  const lines=getLines();
  $('count-badge').textContent='已输入 '+lines.length+' 条';
});

function generate(){
  const lines=getLines().slice(0,50);
  const grid=$('qr-grid');grid.innerHTML='';
  lines.forEach(function(text,i){
    const item=document.createElement('div');item.className='qr-item';
    const canvas=document.createElement('canvas');canvas.width=qrSize;canvas.height=qrSize;
    drawQRToCanvas(canvas,text);
    const label=document.createElement('div');label.className='label';label.textContent=text;
    const actions=document.createElement('div');actions.className='actions';
    const dlBtn=document.createElement('button');dlBtn.textContent='下载';
    dlBtn.style.background='#0969da';dlBtn.style.color='#fff';
    dlBtn.addEventListener('click',function(){
      const link=document.createElement('a');link.download='qr-'+(i+1)+'.png';
      link.href=canvas.toDataURL('image/png');link.click();
    });
    actions.appendChild(dlBtn);
    item.appendChild(canvas);item.appendChild(label);item.appendChild(actions);
    grid.appendChild(item);
  });
}

document.querySelectorAll('.size-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    qrSize=parseInt(this.dataset.size);
  });
});

$('generate-btn').addEventListener('click',generate);

$('download-all-btn').addEventListener('click',function(){
  const items=document.querySelectorAll('.qr-item canvas');
  if(!items.length)return;
  items.forEach(function(canvas,i){
    setTimeout(function(){
      const link=document.createElement('a');link.download='qr-'+(i+1)+'.png';
      link.href=canvas.toDataURL('image/png');link.click();
    },i*200);
  });
});

generate();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
