<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>游戏计分板</title>
<meta name="description" content="游戏计分板 - 实时记录和管理多玩家游戏分数">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:700px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
input,select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem;width:100%}
label{display:block;color:var(--text2);font-size:.85rem;margin-bottom:4px}
.form-group{margin-bottom:12px}
.score-list{list-style:none}
.score-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.score-item:last-child{border-bottom:none}
.player-name{font-weight:600;font-size:1.1rem}
.player-score{font-size:1.5rem;font-weight:700;color:var(--accent)}
.score-controls{display:flex;gap:6px}
.score-btn{width:36px;height:36px;border-radius:50%;border:none;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.score-btn:hover{opacity:.8}
.score-btn.plus{background:var(--green);color:#fff}
.score-btn.minus{background:var(--red);color:#fff}
.empty{text-align:center;color:var(--text2);padding:40px}
.winner{background:rgba(59,130,246,.1);border-radius:8px;padding:16px;text-align:center;margin-bottom:16px}
.winner-title{font-size:1.2rem;font-weight:700;color:var(--accent)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}}
</style>
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🎮 游戏计分板';
const APP=document.getElementById('app');
let players=JSON.parse(localStorage.getItem('gs_players')||'[]');
let gameHistory=JSON.parse(localStorage.getItem('gs_history')||'[]');

function save(){localStorage.setItem('gs_players',JSON.stringify(players));localStorage.setItem('gs_history',JSON.stringify(gameHistory))}

function render(){
  const sorted=[...players].sort((a,b)=>b.score-a.score);
  const winner=players.length>=2?sorted[0]:null;
  APP.innerHTML=`
    <h1>🎮 游戏计分板</h1>
    <p class="subtitle">实时记录和管理多玩家游戏分数</p>
    ${winner?`<div class="winner"><div class="winner-title">🏆 当前领先: ${winner.name} (${winner.score} 分)</div></div>`:''}
    <div class="card">
      <div class="form-group">
        <label>添加玩家</label>
        <div class="flex">
          <input id="pname" placeholder="输入玩家名称" style="flex:1">
          <button class="btn" onclick="addPlayer()">添加</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="flex-between" style="margin-bottom:16px">
        <h2 style="font-size:1.2rem">玩家分数</h2>
        <div class="flex">
          <button class="btn btn-sm" onclick="resetScores()">重置分数</button>
          <button class="btn btn-sm btn-danger" onclick="clearAll()">清空</button>
        </div>
      </div>
      ${players.length===0?'<div class="empty">添加玩家开始计分</div>':''}
      <ul class="score-list">
        ${sorted.map((p,i)=>`
          <li class="score-item">
            <div>
              <span style="color:var(--text2);margin-right:8px">#${i+1}</span>
              <span class="player-name">${p.name}</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
              <div class="score-controls">
                <button class="score-btn minus" onclick="changeScore('${p.id}',-1)">−</button>
                <button class="score-btn minus" onclick="changeScore('${p.id}',-10)" style="font-size:.7rem">-10</button>
              </div>
              <span class="player-score">${p.score}</span>
              <div class="score-controls">
                <button class="score-btn plus" onclick="changeScore('${p.id}',1)">+</button>
                <button class="score-btn plus" onclick="changeScore('${p.id}',10)" style="font-size:.7rem">+10</button>
              </div>
              <button class="btn btn-sm btn-danger" onclick="removePlayer('${p.id}')">✕</button>
            </div>
          </li>
        `).join('')}
      </ul>
    </div>
    ${gameHistory.length>0?`<div class="card">
      <h2 style="font-size:1.2rem;margin-bottom:12px">历史记录</h2>
      ${gameHistory.slice(-5).reverse().map(h=>`
        <div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem;color:var(--text2)">
          ${h.date} - 冠军: ${h.winner} (${h.score}分), 共${h.count}名玩家
        </div>
      `).join('')}
    </div>`:''}
  `;
}

function addPlayer(){
  const name=document.getElementById('pname').value.trim();
  if(!name)return;
  if(players.find(p=>p.name===name)){alert('玩家已存在');return}
  players.push({id:Date.now().toString(),name,score:0});
  document.getElementById('pname').value='';
  save();render();
}

function changeScore(id,delta){
  const p=players.find(x=>x.id===id);
  if(p){p.score=Math.max(0,p.score+delta);save();render()}
}

function removePlayer(id){
  if(!confirm('确定移除该玩家?'))return;
  players=players.filter(p=>p.id!==id);save();render();
}

function resetScores(){
  if(!confirm('确定重置所有分数?'))return;
  players.forEach(p=>p.score=0);save();render();
}

function clearAll(){
  if(!confirm('确定清空所有玩家和记录?'))return;
  players=[];gameHistory=[];save();render();
}

function endGame(){
  if(players.length<2){alert('至少需要2名玩家');return}
  const sorted=[...players].sort((a,b)=>b.score-a.score);
  gameHistory.push({date:new Date().toLocaleDateString('zh-CN'),winner:sorted[0].name,score:sorted[0].score,count:players.length});
  save();alert(`游戏结束！冠军: ${sorted[0].name}`);
}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement.id==='pname')addPlayer()});
render();
</script>
</body>
</html>
