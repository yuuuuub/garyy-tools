<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡路里记录 - garyy-tools</title>
<meta name="description" content="卡路里记录工具，追踪每日饮食热量摄入">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16pxscroll-behavior:smooth;padding:16px;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;margin-bottom:4px}
.sub{color:var(--text2);font-size:.85rem}
button{padding:9px 20px;border-radius:6px;border:none;background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.85}
input,textarea,select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.9rem;width:100%;outline:none;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-gold{background:var(--gold);color:#000}
.cal-display{text-align:center;padding:10px 0}
.cal-amount{font-size:2.5rem;font-weight:700;color:var(--gold)}
.cal-target{color:var(--text2);font-size:.85rem}
.progress-wrap{height:24px;background:var(--border);border-radius:12px;overflow:hidden;margin:16px 0;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:12px;transition:width .5s;width:0}
.progress-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:500}
.food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:16px}
.food-btn{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:all .15s;text-align:center}
.food-btn:hover{border-color:var(--blue);background:rgba(59,130,246,.08)}
.food-btn .food-name{font-size:.85rem;margin-bottom:2px}
.food-btn .food-cal{font-size:.72rem;color:var(--text2)}
.food-btn .food-per{font-size:.65rem;color:var(--text2)}
.add-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap}
.add-row select{flex:1;min-width:150px}
.add-row input{width:80px}
.add-row button{flex-shrink:0}
.records-list{list-style:none;margin-top:12px;max-height:300px;overflow-y:auto}
.records-list li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.records-list li:last-child{border-bottom:none}
.records-list .food-info{flex:1}
.records-list .food-name2{color:var(--text)}
.records-list .food-detail{color:var(--text2);font-size:.78rem}
.records-list .food-cal2{color:var(--gold);font-weight:500;flex-shrink:0;margin-right:10px}
.records-list .del-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:.85rem;padding:4px 6px;border-radius:4px;flex-shrink:0}
.records-list .del-btn:hover{background:rgba(239,68,68,.15)}
.search-box{margin-bottom:10px}
.target-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.target-row label{color:var(--text2);font-size:.85rem;white-space:nowrap}
.target-row input{width:100px}
.target-row button{font-size:.8rem;padding:5px 12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

@media(max-width:600px){
  body{padding:12px!important}
  .container{max-width:100%!important;padding:0!important}
  h1{font-size:1.3rem!important}
  .card{padding:14px!important;margin-bottom:10px!important}
  .btn{padding:8px 16px!important;font-size:.85rem!important}
  textarea,.input-group input,.input-group select{font-size:16px!important}
  .tools-grid,.grid,.result-grid{grid-template-columns:1fr!important}
  table{font-size:.78rem!important}
  th,td{padding:5px 4px!important}
  .tab-bar{gap:4px!important}
  .tab{padding:6px 10px!important;font-size:.75rem!important}
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="卡路里记录 - garyy-tools">
  <meta property="og:description" content="卡路里记录工具，追踪每日饮食热量摄入">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/calorie-tracker/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>🥗 卡路里记录</h1>
<div class="sub">每日热量摄入记录</div>
</header>

<div class="card">
<div class="cal-display">
<div class="cal-amount" id="totalCal">0</div>
<div class="cal-target">卡路里 / <span id="targetCal">2000</span> 卡</div>
</div>

<div class="progress-wrap">
<div class="progress-fill" id="progressFill"></div>
<div class="progress-text" id="progressText">0%</div>
</div>
</div>

<div class="card">
<h2 style="font-size:.95rem;margin-bottom:10px">常见食物</h2>
<input type="text" class="search-box" id="searchFood" placeholder="搜索食物..." style="margin-bottom:10px">
<div class="food-grid" id="foodGrid"></div>
</div>

<div class="card">
<h2 style="font-size:.95rem;margin-bottom:10px">今日记录</h2>
<div class="add-row">
<select id="foodSelect"></select>
<input type="number" id="foodServing" value="1" min="1" max="99">
<button class="btn-green" id="btnAddFood">添加</button>
</div>
<ul class="records-list" id="recordsList">
<li style="color:var(--text2);text-align:center;justify-content:center">暂无记录</li>
</ul>

<div class="target-row">
<label>每日目标:</label>
<input type="number" id="dailyTargetCal" value="2000" min="100" max="99999">
<button id="btnSetTarget">设置</button>
</div>
</div>
</div>

<script>
(function(){
'use strict';

const FOODS=[
{name:'米饭(200g)',cal:232,per:'200g'},
{name:'鸡蛋(1个)',cal:72,per:'1个'},
{name:'苹果',cal:95,per:'1个'},
{name:'香蕉',cal:105,per:'1根'},
{name:'牛奶(250ml)',cal:160,per:'250ml'},
{name:'全麦面包(1片)',cal:75,per:'1片'},
{name:'鸡胸肉(100g)',cal:165,per:'100g'},
{name:'牛肉(100g)',cal:250,per:'100g'},
{name:'三文鱼(100g)',cal:208,per:'100g'},
{name:'豆腐(100g)',cal:76,per:'100g'},
{name:'西兰花(100g)',cal:34,per:'100g'},
{name:'红薯(1个)',cal:115,per:'1个'},
{name:'意面(100g)',cal:158,per:'100g'},
{name:'燕麦片(50g)',cal:194,per:'50g'},
{name:'酸奶(200ml)',cal:160,per:'200ml'},
{name:'坚果(30g)',cal:180,per:'30g'},
{name:'橙子',cal:62,per:'1个'},
{name:'葡萄(100g)',cal:69,per:'100g'},
];

const STORAGE_KEY='garyy_calories';
const TARGET_KEY='garyy_cal_target';
let dailyTarget=parseInt(localStorage.getItem(TARGET_KEY))||2000;
let records=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');

function todayStr(){
return new Date().toISOString().slice(0,10);
}

function getTodayRecords(){
return records.filter(function(r){return r.date===todayStr();});
}

function save(){
localStorage.setItem(STORAGE_KEY,JSON.stringify(records));
render();
}

function escHtml(s){
return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderFoodGrid(){
const grid=document.getElementById('foodGrid');
const search=document.getElementById('searchFood').value.toLowerCase();
const filtered=FOODS.filter(function(f){
return f.name.toLowerCase().includes(search)||f.name.includes(search);
});
grid.innerHTML='';
filtered.forEach(function(food,idx){
const btn=document.createElement('button');
btn.className='food-btn';
btn.innerHTML='<div class="food-name">'+escHtml(food.name)+'</div><div class="food-cal">'+food.cal+' 卡</div>';
btn.addEventListener('click',function(){
addFood(food,1);
});
grid.appendChild(btn);
});
}

function renderFoodSelect(){
const sel=document.getElementById('foodSelect');
sel.innerHTML='';
FOODS.forEach(function(f){
const opt=document.createElement('option');
opt.value=f.name;
opt.textContent=f.name+' ('+f.cal+'卡)';
sel.appendChild(opt);
});
}

function addFood(food,serving){
const todayRecs=getTodayRecords();
todayRecs.push({name:food.name,cal:food.cal,serving:serving,date:todayStr(),id:Date.now()+Math.random()});
records.push({name:food.name,cal:food.cal,serving:serving,date:todayStr(),id:Date.now()+Math.random()});
save();
}

function deleteRecord(id){
if(confirm('删除这条记录？')){
records=records.filter(function(r){return r.id!==Number(id);});
save();
}
}

function render(){
const todayRecs=getTodayRecords();
let total=0;
todayRecs.forEach(function(r){total+=r.cal*r.serving;});

document.getElementById('totalCal').textContent=total;
document.getElementById('targetCal').textContent=dailyTarget;
document.getElementById('dailyTargetCal').value=dailyTarget;

const pct=Math.min(100,Math.round((total/dailyTarget)*100));
document.getElementById('progressFill').style.width=pct+'%';
document.getElementById('progressText').textContent=pct+'%';

const el=document.getElementById('recordsList');
if(todayRecs.length===0){
el.innerHTML='<li style="color:var(--text2);text-align:center;justify-content:center">暂无记录</li>';
return;
}
let html='';
todayRecs.slice().reverse().forEach(function(r){
html+='<li>'+
'<div class="food-info">'+
'<span class="food-name2">'+escHtml(r.name)+'</span>'+
'<span class="food-detail"> x'+r.serving+'份</span>'+
'</div>'+
'<span class="food-cal2">'+(r.cal*r.serving)+'卡</span>'+
'<button class="del-btn" data-id="'+r.id+'">✕</button>'+
'</li>';
});
el.innerHTML=html;
el.querySelectorAll('.del-btn').forEach(function(btn){
btn.addEventListener('click',function(){
deleteRecord(this.dataset.id);
});
});
}

document.getElementById('btnAddFood').addEventListener('click',function(){
const name=document.getElementById('foodSelect').value;
const serving=parseInt(document.getElementById('foodServing').value)||1;
const food=FOODS.find(function(f){return f.name===name;});
if(food)addFood(food,serving);
});

document.getElementById('searchFood').addEventListener('input',function(){
renderFoodGrid();
});

document.getElementById('btnSetTarget').addEventListener('click',function(){
const val=parseInt(document.getElementById('dailyTargetCal').value);
if(val>=100&&val<=99999){
dailyTarget=val;
localStorage.setItem(TARGET_KEY,String(val));
render();
}
});

renderFoodGrid();
renderFoodSelect();
render();
})();
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
