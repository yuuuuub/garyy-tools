<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR增强现实游戏</title>
<meta name="description" content="AR增强现实游戏，用手机摄像头体验沉浸式游戏">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--success:#22c55e;--error:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px}
h1{font-size:1.5rem;margin-bottom:8px;color:var(--accent)}
.info-bar{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.info-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:0.85rem}
.info-item span{color:var(--accent);font-weight:bold}
.game-wrap{position:relative;width:100%;max-width:400px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:2px solid var(--border);margin-bottom:10px}
video{width:100%;height:100%;object-fit:cover;display:block}
canvas#arCanvas{position:absolute;top:0;left:0;width:100%;height:100%}
.msg{font-size:0.9rem;padding:6px;text-align:center;min-height:30px;color:var(--accent)}
.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:0.9rem;cursor:pointer;font-family:inherit}
button:hover{opacity:0.85}
.score-popup{position:absolute;font-size:1.5rem;font-weight:bold;color:var(--success);animation:floatUp 1s forwards;pointer-events:none}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
.fallback{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;width:100%;max-width:400px}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="AR增强现实游戏">
  <meta property="og:description" content="AR增强现实游戏，用手机摄像头体验沉浸式游戏">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/ar-game/">
</head>
<body>
<h1>🔮 AR增强现实</h1>
<div class="info-bar">
  <div class="info-item">🏆 分数: <span id="score">0</span></div>
  <div class="info-item">🎯 <span id="round">1</span>/10</div>
  <div class="info-item">⏱ <span id="timer">30</span>秒</div>
</div>
<div class="game-wrap" id="gameWrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="arCanvas"></canvas>
</div>
<div class="msg" id="msg">点击屏幕上的虚拟物体得分</div>
<div class="buttons">
  <button onclick="startGame()">▶ 开始游戏</button>
  <button onclick="stopCamera()">⏹ 停止</button>
</div>
<script>
let stream=null,objects=[],score=0,roundNum=0,timer=30,timerInterval=null,running=false;
const video=document.getElementById('video');
const canvas=document.getElementById('arCanvas');
const ctx=canvas.getContext('2d');
let camOk=false;

async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=stream;
    await new Promise(r=>{video.onloadedmetadata=r});
    canvas.width=video.videoWidth;canvas.height=video.videoHeight;
    camOk=true;return true;
  }catch(e){
    canvas.width=400;canvas.height=533;
    return false;
  }
}

function stopCamera(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  running=false;clearInterval(timerInterval);
  video.srcObject=null;
}

function startGame(){
  score=0;roundNum=0;timer=30;
  document.getElementById('score').textContent=0;
  document.getElementById('timer').textContent=30;
  startCamera().then(()=>{nextRound();startLoop()});
}

function nextRound(){
  roundNum++;document.getElementById('round').textContent=roundNum;
  if(roundNum>10){endGame();return}
  objects=[];
  const shapes=['circle','triangle','square','diamond','star'];
  const colors=['#ef4444','#f59e0b','#22c55e','#3b82f6','#8b5cf6','#ec4899'];
  const target=shapes[Math.floor(Math.random()*shapes.length)];
  const tColor=colors[Math.floor(Math.random()*colors.length)];
  for(let i=0;i<5;i++){
    const isTarget=i===0;
    objects.push({
      x:50+Math.random()*(canvas.width-100),
      y:50+Math.random()*(canvas.height-100),
      size:30+Math.random()*20,
      shape:isTarget?target:shapes[Math.floor(Math.random()*shapes.length)],
      color:isTarget?tColor:colors[Math.floor(Math.random()*colors.length)],
      isTarget,
      vx:(Math.random()-0.5)*2,
      vy:(Math.random()-0.5)*2
    });
  }
  document.getElementById('msg').textContent=`点击 ${target} 获得分！(${tColor})`;
  timer=30;
}

function startLoop(){
  running=true;clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(!running)return;
    timer--;document.getElementById('timer').textContent=timer;
    if(timer<=0){nextRound()}
  },1000);
  requestAnimationFrame(loop);
}

function loop(){
  if(!running)return;
  // Draw video frame
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  // Semi-transparent overlay
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(0,0,canvas.width,canvas.height);
  // Move and draw objects
  objects.forEach(obj=>{
    obj.x+=obj.vx;obj.y+=obj.vy;
    if(obj.x<30||obj.x>canvas.width-30)obj.vx*=-1;
    if(obj.y<30||obj.y>canvas.height-30)obj.vy*=-1;
    drawShape(obj);
  });
  requestAnimationFrame(loop);
}

function drawShape(obj){
  ctx.save();ctx.translate(obj.x,obj.y);ctx.fillStyle=obj.color;
  ctx.shadowColor=obj.color;ctx.shadowBlur=obj.isTarget?20:10;
  if(obj.shape==='circle'){
    ctx.beginPath();ctx.arc(0,0,obj.size/2,0,Math.PI*2);ctx.fill();
  } else if(obj.shape==='triangle'){
    ctx.beginPath();ctx.moveTo(0,-obj.size/2);ctx.lineTo(-obj.size/2,obj.size/2);ctx.lineTo(obj.size/2,obj.size/2);ctx.closePath();ctx.fill();
  } else if(obj.shape==='square'){
    ctx.fillRect(-obj.size/2,-obj.size/2,obj.size,obj.size);
  } else if(obj.shape==='diamond'){
    ctx.beginPath();ctx.moveTo(0,-obj.size/2);ctx.lineTo(obj.size/2,0);ctx.lineTo(0,obj.size/2);ctx.lineTo(-obj.size/2,0);ctx.closePath();ctx.fill();
  } else if(obj.shape==='star'){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const angle=i*4*Math.PI/5-Math.PI/2;
      const r=i%2===0?obj.size/2:obj.size/4;
      ctx.lineTo(Math.cos(angle)*r,Math.sin(angle)*r);
    }
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

canvas.addEventListener('click',e=>{
  if(!running)return;
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width,scaleY=canvas.height/rect.height;
  const x=(e.clientX-rect.left)*scaleX;
  const y=(e.clientY-rect.top)*scaleY;
  objects.forEach((obj,i)=>{
    const dx=x-obj.x,dy=y-obj.y;
    if(Math.sqrt(dx*dx+dy*dy)<obj.size){
      if(obj.isTarget){
        score+=100;
        document.getElementById('score').textContent=score;
        showPopup(e.clientX,e.clientY,'+100');
        document.getElementById('msg').textContent='✅ 命中目标！';
        setTimeout(nextRound,800);
      } else {
        showPopup(e.clientX,e.clientY,'-50');
        score=Math.max(0,score-50);
        document.getElementById('score').textContent=score;
        document.getElementById('msg').textContent='❌ 错误目标！';
      }
    }
  });
});

function showPopup(x,y,text){
  const popup=document.createElement('div');
  popup.className='score-popup';popup.textContent=text;
  popup.style.left=x+'px';popup.style.top=y+'px';
  document.body.appendChild(popup);
  setTimeout(()=>popup.remove(),1000);
}

function endGame(){
  running=false;clearInterval(timerInterval);
  document.getElementById('msg').textContent=`🎉 游戏结束！得分: ${score}`;
}
</script>
<script src="../i18n.js"></script>
</body>
</html>
