<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字学习</title><meta name="description" content="汉字学习 - 在线学习汉字"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.character-display{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.character-main{font-size:6rem;font-weight:700;color:var(--blue)}.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}.info-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}.info-value{font-size:1.2rem;font-weight:600;color:var(--blue)}.info-label{font-size:.8rem;color:var(--text2);margin-top:4px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}</style><meta property="og:title" content="汉字学习"><meta property="og:description" content="汉字学习 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📚 汉字学习</h1><p class="sub">在线学习汉字</p>
<div class="card">
<div class="btn-group">
<button class="btn" onclick="randomCharacter()">随机学习</button>
<button class="btn" onclick="nextCharacter()">下一个</button>
<button class="btn" onclick="prevCharacter()">上一个</button>
</div>
</div>
<div id="result"></div>
<div class="card">
<h3 style="margin-bottom:16px">学习进度</h3>
<div id="progress" style="padding:12px;background:var(--bg);border-radius:8px"></div>
</div></div>
<script src="../i18n.js" defer></script>
<script>
var characters=[
  {char:'一',pinyin:'yī',meaning:'一，第一',strokes:1,radical:'一',structure:'独体字',example:'一个、一天、一样'},
  {char:'二',pinyin:'èr',meaning:'二，第二',strokes:2,radical:'二',structure:'独体字',example:'二月、第二、二楼'},
  {char:'三',pinyin:'sān',meaning:'三，第三',strokes:3,radical:'一',structure:'独体字',example:'三月、第三、三角'},
  {char:'四',pinyin:'sì',meaning:'四，第四',strokes:5,radical:'囗',structure:'全包围结构',example:'四月、第四、四季'},
  {char:'五',pinyin:'wǔ',meaning:'五，第五',strokes:4,radical:'一',structure:'独体字',example:'五月、第五、五彩'},
  {char:'六',pinyin:'liù',meaning:'六，第六',strokes:4,radical:'八',structure:'上下结构',example:'六月、第六、六方'},
  {char:'七',pinyin:'qī',meaning:'七，第七',strokes:2,radical:'一',structure:'独体字',example:'七月、第七、七彩'},
  {char:'八',pinyin:'bā',meaning:'八，第八',strokes:2,radical:'八',structure:'独体字',example:'八月、第八、八方'},
  {char:'九',pinyin:'jiǔ',meaning:'九，第九',strokes:2,radical:'丿',structure:'独体字',example:'九月、第九、九州'},
  {char:'十',pinyin:'shí',meaning:'十，第十',strokes:2,radical:'十',structure:'独体字',example:'十月、第十、十分'},
  {char:'百',pinyin:'bǎi',meaning:'百，一百',strokes:6,radical:'白',structure:'上下结构',example:'百分、百万、百姓'},
  {char:'千',pinyin:'qiān',meaning:'千，一千',strokes:3,radical:'十',structure:'独体字',example:'千万、千年、千古'},
  {char:'万',pinyin:'wàn',meaning:'万，一万',strokes:3,radical:'一',structure:'独体字',example:'万一、万岁、万事'},
  {char:'亿',pinyin:'yì',meaning:'亿，一亿',strokes:3,radical:'亻',structure:'左右结构',example:'亿万、亿兆'},
  {char:'大',pinyin:'dà',meaning:'大的，巨大',strokes:3,radical:'大',structure:'独体字',example:'大小、大人、大学'},
  {char:'小',pinyin:'xiǎo',meaning:'小的，微小',strokes:3,radical:'小',structure:'独体字',example:'大小、小孩、小学'},
  {char:'多',pinyin:'duō',meaning:'多的，很多',strokes:6,radical:'夕',structure:'上下结构',example:'多少、多年、多么'},
  {char:'少',pinyin:'shǎo',meaning:'少的，很少',strokes:4,radical:'小',structure:'独体字',example:'多少、少年、少数'},
  {char:'上',pinyin:'shàng',meaning:'上面，上方',strokes:3,radical:'一',structure:'独体字',example:'上面、上学、上班'},
  {char:'下',pinyin:'xià',meaning:'下面，下方',strokes:3,radical:'一',structure:'独体字',example:'下面、下雨、下班'},
  {char:'左',pinyin:'zuǒ',meaning:'左边，左侧',strokes:5,radical:'工',structure:'半包围结构',example:'左边、左手、左右'},
  {char:'右',pinyin:'yòu',meaning:'右边，右侧',strokes:5,radical:'口',structure:'半包围结构',example:'右边、右手、左右'},
  {char:'前',pinyin:'qián',meaning:'前面，前方',strokes:9,radical:'刂',structure:'上下结构',example:'前面、前进、以前'},
  {char:'后',pinyin:'hòu',meaning:'后面，后方',strokes:6,radical:'口',structure:'半包围结构',example:'后面、后来、以后'},
  {char:'东',pinyin:'dōng',meaning:'东方，东边',strokes:5,radical:'一',structure:'独体字',example:'东方、东西、东风'},
  {char:'西',pinyin:'xī',meaning:'西方，西边',strokes:6,radical:'西',structure:'独体字',example:'西方、东西、西瓜'},
  {char:'南',pinyin:'nán',meaning:'南方，南边',strokes:9,radical:'十',structure:'上下结构',example:'南方、南瓜、南京'},
  {char:'北',pinyin:'běi',meaning:'北方，北边',strokes:5,radical:'匕',structure:'左右结构',example:'北方、北京、北斗'},
  {char:'天',pinyin:'tiān',meaning:'天空，一天',strokes:4,radical:'大',structure:'独体字',example:'天空、今天、天气'},
  {char:'地',pinyin:'dì',meaning:'地面，土地',strokes:6,radical:'土',structure:'左右结构',example:'土地、地球、地方'},
  {char:'人',pinyin:'rén',meaning:'人类，人们',strokes:2,radical:'人',structure:'独体字',example:'人们、人类、人生'},
  {char:'口',pinyin:'kǒu',meaning:'嘴，口',strokes:3,radical:'口',structure:'独体字',example:'门口、出口、人口'},
  {char:'日',pinyin:'rì',meaning:'太阳，日子',strokes:4,radical:'日',structure:'独体字',example:'日出、日期、日记'},
  {char:'月',pinyin:'yuè',meaning:'月亮，月份',strokes:4,radical:'月',structure:'独体字',example:'月亮、月光、月薪'},
  {char:'水',pinyin:'shuǐ',meaning:'水，液体',strokes:4,radical:'水',structure:'独体字',example:'河水、水果、水平'},
  {char:'火',pinyin:'huǒ',meaning:'火，火焰',strokes:4,radical:'火',structure:'独体字',example:'火灾、火车、火柴'},
  {char:'木',pinyin:'mù',meaning:'木头，树木',strokes:4,radical:'木',structure:'独体字',example:'树木、木头、木材'},
  {char:'金',pinyin:'jīn',meaning:'金属，黄金',strokes:8,radical:'金',structure:'独体字',example:'黄金、金钱、金融'},
  {char:'土',pinyin:'tǔ',meaning:'土壤，土地',strokes:3,radical:'土',structure:'独体字',example:'土地、国土、土质'}
];
var currentIndex=0;
var learnedChars=new Set();
function showCharacter(){
  var char=characters[currentIndex];
  var html='<div class="card">';
  html+='<div class="character-display">';
  html+='<div class="character-main">'+char.char+'</div>';
  html+='</div>';
  html+='<div class="info-grid">';
  html+='<div class="info-item"><div class="info-value">'+char.pinyin+'</div><div class="info-label">拼音</div></div>';
  html+='<div class="info-item"><div class="info-value">'+char.strokes+'</div><div class="info-label">笔画数</div></div>';
  html+='<div class="info-item"><div class="info-value">'+char.radical+'</div><div class="info-label">部首</div></div>';
  html+='<div class="info-item"><div class="info-value">'+char.structure+'</div><div class="info-label">结构</div></div>';
  html+='</div>';
  html+='<div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>含义：</strong>'+char.meaning+'</div>';
  html+='<div><strong>例词：</strong>'+char.example+'</div>';
  html+='</div>';
  html+='<div class="btn-group" style="margin-top:16px">';
  html+='<button class="btn" onclick="markLearned()">已学习</button>';
  html+='<button class="btn" onclick="nextCharacter()">下一个</button>';
  html+='</div></div>';
  document.getElementById('result').innerHTML=html;
  updateProgress();
}
function randomCharacter(){
  currentIndex=Math.floor(Math.random()*characters.length);
  showCharacter();
}
function nextCharacter(){
  currentIndex=(currentIndex+1)%characters.length;
  showCharacter();
}
function prevCharacter(){
  currentIndex=(currentIndex-1+characters.length)%characters.length;
  showCharacter();
}
function markLearned(){
  learnedChars.add(characters[currentIndex].char);
  updateProgress();
  nextCharacter();
}
function updateProgress(){
  var total=characters.length;
  var learned=learnedChars.size;
  var percentage=Math.round(learned/total*100);
  var html='<div style="margin-bottom:8px"><strong>学习进度：</strong>'+learned+'/'+total+' ('+percentage+'%)</div>';
  html+='<div style="height:20px;background:var(--border);border-radius:10px;overflow:hidden">';
  html+='<div style="height:100%;width:'+percentage+'%;background:var(--green);transition:width .3s"></div>';
  html+='</div>';
  html+='<div style="margin-top:8px;font-size:.85rem;color:var(--text2)">已学习：'+Array.from(learnedChars).join('、')+'</div>';
  document.getElementById('progress').innerHTML=html;
}
showCharacter();
</script></body></html>
