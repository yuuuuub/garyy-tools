<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商店查找 - Shop Finder</title>
<meta name="description" content="商店查找工具，帮你找到附近的商铺和超市">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#22c55e;--yellow:#eab308;--muted:#8b949e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 0}
header h1{font-size:1.8em;margin-bottom:4px}
header p{color:var(--muted)}
.filters{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.filter-group label{font-size:12px;color:var(--muted);font-weight:600}
.filter-group input,.filter-group select{background:#0d1117;border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px;width:100%}
.filter-group input:focus,.filter-group select:focus{outline:none;border-color:var(--accent)}
.cat-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cat-tab{background:#0d1117;border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s}
.cat-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sort-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.sort-bar span{color:var(--muted);font-size:14px}
.sort-options{display:flex;gap:8px}
.sort-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s}
.sort-btn.active{background:var(--accent);border-color:var(--accent)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card h3{font-size:16px;margin-bottom:6px}
.card-cat{font-size:11px;padding:3px 8px;border-radius:12px;display:inline-block;margin-bottom:8px}
.cat-supermarket{background:rgba(34,197,94,.15);color:var(--green)}
.cat-convenience{background:rgba(59,130,246,.15);color:var(--accent)}
.cat-department{background:rgba(168,85,247,.15);color:#a855f7}
.cat-specialty{background:rgba(251,146,60,.15);color:#fb923c}
.card-info{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);margin-bottom:8px}
.card-info span{display:flex;align-items:center;gap:6px}
.products{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.prod-tag{font-size:11px;background:rgba(59,130,246,.1);color:var(--accent);padding:2px 8px;border-radius:10px}
.promo{font-size:12px;color:var(--green);font-weight:600;margin-top:6px}
.no-results{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:640px){.results{grid-template-columns:1fr}.filters{flex-direction:column}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="商店查找 - Shop Finder">
  <meta property="og:description" content="商店查找工具，帮你找到附近的商铺和超市">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/shop-finder/">
</head>
<body>
<div class="container">
<header><h1>🛒 商店查找</h1><p>发现附近优质商店，便捷购物</p></header>
<div class="filters">
<div class="filter-group" style="flex:2"><label>搜索</label><input type="text" id="search" placeholder="输入商店名称或地址..."></div>
<div class="filter-group"><label>营业状态</label><select id="openFilter"><option value="">全部</option><option value="open">营业中</option><option value="closed">已打烊</option></select></div>
</div>
<div class="cat-tabs"><button class="cat-tab active" data-cat="">全部</button><button class="cat-tab" data-cat="supermarket">🏪 超市</button><button class="cat-tab" data-cat="convenience">🏬 便利店</button><button class="cat-tab" data-cat="department">🏬 商场</button><button class="cat-tab" data-cat="specialty">🎁 专营店</button></div>
<div class="sort-bar"><span id="resultCount"></span><div class="sort-options"><button class="sort-btn active" data-sort="rating">评分优先</button><button class="sort-btn" data-sort="name">名称排序</button></div></div>
<div class="results" id="results"></div>
</div>
<script>
const shops=[
{id:1,name:"盒马鲜生(国贸店)",address:"朝阳区建国路93号",category:"supermarket",rating:4.6,phone:"010-65881688",hours:"08:00-22:00",status:"open",products:["生鲜","水果","烘焙","熟食"],promo:"新用户满100减30",description:"阿里旗下新零售超市，线上线下一体化体验"},
{id:2,name:"7-ELEVEN(望京店)",address:"朝阳区望京西路50号",category:"convenience",rating:4.3,phone:"010-84726018",hours:"24小时",status:"open",products:["便当","饮料","零食","日用品"],promo:"买三免一",description:"全球连锁便利店，24小时营业"},
{id:3,name:"万达广场(通州店)",address:"通州区新华西街58号",category:"department",rating:4.4,phone:"010-60598888",hours:"10:00-22:00",status:"open",products:["服装","餐饮","电影","儿童"],promo:"会员日全场8折",description:"大型城市综合体，购物娱乐一站式"},
{id:4,name:"三只松鼠(旗舰店)",address:"弋江区中山南路718号",category:"specialty",rating:4.5,phone:"0553-5886688",hours:"09:00-21:00",status:"open",products:["坚果","零食","干果","礼盒"],promo:"满199减50",description:"知名零食品牌旗舰店"},
{id:5,name:"永辉超市(中关村店)",address:"海淀区中关村大街27号",category:"supermarket",rating:4.2,phone:"010-82620888",hours:"07:30-22:00",status:"open",products:["蔬菜","肉禽","粮油","日化"],promo:"每周三会员价",description:"社区生鲜超市，新鲜实惠"},
{id:6,name:"全家便利店(三里屯店)",address:"朝阳区三里屯路19号",category:"convenience",rating:4.1,phone:"010-64169988",hours:"24小时",status:"open",products:["便当","饭团","饮品","关东煮"],promo:"早餐套餐9.9元",description:"日系连锁便利店，品质快餐"},
{id:7,name:"银泰百货(王府井店)",address:"东城区王府井大街88号",category:"department",rating:4.5,phone:"010-65288888",hours:"10:00-22:00",status:"closed",products:["奢侈品","化妆品","珠宝","服饰"],promo:"满3000减500",description:"高端百货商场，国际品牌云集"},
{id:8,name:"周大福(西单店)",address:"西城区西单北大街176号",category:"specialty",rating:4.6,phone:"010-66163288",hours:"10:00-22:00",status:"open",products:["黄金","钻石","K金","翡翠"],promo:"工费8折优惠",description:"知名珠宝品牌，品质保障"},
{id:9,name:"华润万家(望京店)",address:"朝阳区望京街9号",category:"supermarket",rating:4.3,phone:"010-84712888",hours:"08:00-22:00",status:"open",products:["食品","饮料","日用","母婴"],promo:"满200减20",description:"综合超市，品类齐全"},
{id:10,name:"便利蜂(五道口店)",address:"海淀区成府路28号",category:"convenience",rating:4.0,phone:"010-82866988",hours:"24小时",status:"open",products:["快餐","咖啡","零食","生鲜"],promo:"新用户首单5折",description:"智能便利店，扫码即购"}
];
let currentCat="",currentSort="rating";
function render(){
const q=document.getElementById("search").value.toLowerCase();
const of2=document.getElementById("openFilter").value;
let filtered=shops.filter(s=>{
if(q&&!s.name.toLowerCase().includes(q)&&!s.address.includes(q))return false;
if(currentCat&&s.category!==currentCat)return false;
if(of2&&s.status!==of2)return false;
return true;
});
filtered.sort({rating:(a,b)=>b.rating-a.rating,name:(a,b)=>a.name.localeCompare(b.name,"zh")}[currentSort]||(a,b)=>b.rating-a.rating);
document.getElementById("resultCount").textContent=`找到 ${filtered.length} 家商店`;
const c=document.getElementById("results");
if(!filtered.length){c.innerHTML='<div class="no-results"><p>未找到符合条件的商店</p></div>';return}
const catLabels={supermarket:"超市",convenience:"便利店",department:"商场",specialty:"专营店"};
c.innerHTML=filtered.map(s=>`<div class="card"><h3>${s.name}</h3><span class="card-cat cat-${s.category}">${catLabels[s.category]}</span><div class="card-info"><span>📍 ${s.address}</span><span>📞 ${s.phone}</span><span>🕐 ${s.hours} ${s.status==="open"?"🟢营业中":"🔴已打烊"}</span></div><p style="font-size:13px;color:var(--muted);margin-bottom:8px">${s.description}</p><div class="products">${s.products.map(p=>`<span class="prod-tag">${p}</span>`).join("")}</div>${s.promo?`<div class="promo">🏷️ ${s.promo}</div>`:""}</div>`).join("")
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("openFilter").addEventListener("change",render);
document.querySelectorAll(".cat-tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".cat-tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentCat=b.dataset.cat;render()}));
document.querySelectorAll(".sort-btn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".sort-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentSort=b.dataset.sort;render()}));
render();
</script>
</body>
</html>
