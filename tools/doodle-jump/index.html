<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐸 涂鸦跳跃</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;flex-direction:column}
h1{font-size:1.3rem;margin-bottom:4px}
.info{font-size:.9rem;color:#8b949e;margin-bottom:8px}
canvas{border:2px solid var(--border);border-radius:4px;touch-action:none}
.hint{font-size:.8rem;color:#8b949e;margin-top:8px}
</style>
</head>
<body>
<h1>🐸 涂鸦跳跃</h1>
<div class="info">最高分 <span id="best">0</span> | 当前 <span id="score">0</span></div>
<canvas id="game" width="320" height="480"></canvas>
<div class="hint">点击/触摸屏幕左右移动 | 空格键</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=320,H=480;
let player,platforms,scrollY=0,score=0,best=0,gameOver=false,lastTap=0;

const SPRITE={x:140,y:400,w:40,h:40,vy:0,vx:0};

function init(){
player={x:140,y:400,w:40,h:40,vy:0,vx:0};
platforms=[];scrollY=0;score=0;gameOver=false;
for(let i=0;i<8;i++){
platforms.push({x:Math.random()*(W-60),y:H-i*65,w:60,h:12,type:i<5?'normal':'moving',dir:Math.random()>.5?1:-1,spd:0.5+Math.random()*1.5});
}
}

function addPlatform(y){
const r=Math.random();
let type='normal';
if(r>.85)type='fragile';
else if(r>.7)type='moving';
platforms.push({x:Math.random()*(W-60),y,w:60,h:12,type,dir:Math.random()>.5?1:-1,spd:0.5+Math.random()*1.5});
}

let targetX=player.x;
canvas.addEventListener('click',e=>{
const rect=canvas.getBoundingClientRect();
const sx=W/rect.width;
targetX=(e.clientX-rect.left)*sx-player.w/2;
});
canvas.addEventListener('touchstart',e=>{
e.preventDefault();
const rect=canvas.getBoundingClientRect();
const sx=W/rect.width;
targetX=(e.touches[0].clientX-rect.left)*sx-player.w/2;
});

function update(){
if(gameOver)return;
// gravity
player.vy+=0.35;
player.y+=player.vy;
// move toward target
const dx=targetX-player.x;
player.x+=dx*0.12;
player.vx=dx*0.12;
if(player.x<0)player.x=0;
if(player.x+player.w>W)player.x=W-player.w;

// camera
if(player.y<H/2){
const diff=H/2-player.y;
player.y=H/2;
scrollY+=diff;
platforms.forEach(p=>p.y+=diff);
score=Math.max(score,Math.floor(scrollY/10));
document.getElementById('score').textContent=score;
}

// platform collision
if(player.vy>0){
platforms.forEach((p,i)=>{
if(p.type==='fragile'&&p.removing)return;
if(player.x+player.w>p.x&&player.x<p.x+p.w&&
player.y+player.h>p.y&&player.y+player.h<p.y+p.h+player.vy+5){
if(p.type==='fragile'){p.removing=true;player.vy=-12}
else{player.vy=-12}
}
});
}

// move platforms
platforms.forEach(p=>{
if(p.type==='moving'){p.x+=p.dir*p.spd;if(p.x<=0||p.x+p.w>=W)p.dir*=-1}
});

// remove old platforms
platforms=platforms.filter(p=>p.y<H+50&&!p.removing);

// add new platforms
while(platforms.length<10){
const topY=Math.min(...platforms.map(p=>p.y));
addPlatform(topY-65-Math.random()*30);
}

// fall
if(player.y>H+100){
gameOver=true;
best=Math.max(best,score);
document.getElementById('best').textContent=best;
setTimeout(()=>{gameOver=false;init()},1000);
}

// ceiling
if(player.y<-player.h){player.vy=2;player.y=-player.h}
}

function draw(){
ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
// platforms
platforms.forEach(p=>{
if(p.type==='fragile'){ctx.fillStyle=p.removing?'#8B4513':'#DEB887';ctx.fillRect(p.x,p.y,p.w,p.h);
ctx.fillStyle='#A0522D';for(let i=0;i<p.w;i+=8)ctx.fillRect(p.x+i,p.y,4,p.h)}
else if(p.type==='moving'){ctx.fillStyle='#4CAF50';ctx.fillRect(p.x,p.y,p.w,p.h);
ctx.fillStyle='#2E7D32';ctx.fillRect(p.x+2,p.y+2,p.w-4,p.h-4)}
else{ctx.fillStyle='#8B4515';ctx.fillRect(p.x,p.y,p.w,p.h);
ctx.fillStyle='#654321';ctx.fillRect(p.x+2,p.y+2,p.w-4,p.h-4)}
});
// player (frog)
const px=player.x,py=player.y;
ctx.fillStyle='#4CAF50';
ctx.beginPath();ctx.ellipse(px+player.w/2,py+player.h/2,18,20,0,0,Math.PI*2);ctx.fill();
// eyes
ctx.fillStyle='#fff';
ctx.beginPath();ctx.arc(px+12,py+10,6,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(px+28,py+10,6,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#000';
ctx.beginPath();ctx.arc(px+12,py+10,3,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(px+28,py+10,3,0,Math.PI*2);ctx.fill();
// mouth
ctx.strokeStyle='#000';ctx.lineWidth=2;
ctx.beginPath();ctx.arc(px+20,py+22,8,0.1*Math.PI,0.9*Math.PI);ctx.stroke();

if(gameOver){
ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
ctx.fillText('游戏结束',W/2,H/2-20);
ctx.font='18px sans-serif';ctx.fillText('得分: '+score,W/2,H/2+20);
}
}

function gameLoop(){update();draw();requestAnimationFrame(gameLoop)}
init();gameLoop();
</script>
</body>
</html>
