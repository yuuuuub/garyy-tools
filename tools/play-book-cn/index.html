<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 剧本手册</title>
<meta name="description" content="剧本手册构建器，创建和管理应急演练剧本和场景化操作手册">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📖 剧本手册">
<meta property="og:description" content="剧本手册构建器 - Gary's Tools">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;transition:background .3s,color .3s}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.3rem;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:60px}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-orange{background:var(--orange)}.btn-purple{background:var(--purple)}.btn-sm{padding:4px 10px;font-size:.8rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px}
.theme-toggle{position:fixed;top:12px;right:12px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:8px;cursor:pointer;z-index:100}
.playbook-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.playbook-item:hover{border-color:var(--blue);transform:translateY(-1px)}
.playbook-item .pb-title{font-weight:600;font-size:.9rem}
.playbook-item .pb-desc{font-size:.8rem;color:var(--text2);margin-top:4px;line-height:1.4}
.playbook-item .pb-meta{font-size:.75rem;color:var(--text2);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;padding:1px 8px;border-radius:12px;font-size:.7rem;border:1px solid var(--border);color:var(--text2)}
.tag-type{background:var(--blue);color:#fff;border-color:var(--blue)}
.scene-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;border-left:4px solid var(--purple)}
.scene-block .scene-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.scene-block .scene-title{font-weight:600;font-size:.9rem}
.scene-block .scene-role{font-size:.8rem;color:var(--purple)}
.action-list{list-style:none;margin-top:8px}
.action-list li{padding:6px 0;border-bottom:1px solid var(--border);font-size:.85rem;display:flex;gap:8px;align-items:flex-start}
.action-list li:last-child{border-bottom:none}
.action-num{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0}
.action-text{flex:1}
.action-cmd{background:#1a1a2e;color:#e6e6e6;padding:4px 8px;border-radius:4px;font-family:'SF Mono',Menlo,monospace;font-size:.75rem;margin-top:4px;display:inline-block}
.dialog-line{padding:8px 12px;border-radius:8px;margin:6px 0;font-size:.85rem}
.dialog-line.speaker{background:var(--blue);color:#fff;display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;margin-bottom:2px}
.dialog-line.text{background:var(--bg);border:1px solid var(--border)}
.preview-box{background:#1a1a2e;color:#e6e6e6;padding:16px;border-radius:8px;border:1px solid var(--border);font-family:'SF Mono',Menlo,monospace;font-size:.8rem;line-height:1.6;white-space:pre-wrap;overflow:auto;max-height:400px}
.rendered{line-height:1.7}
.rendered h2{font-size:1.1rem;color:var(--blue);margin:16px 0 8px}
.rendered h3{font-size:.95rem;margin:12px 0 6px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>📖 剧本手册</h1>

<div class="card">
<div class="section-title">快速模板</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn-sm" onclick="quickTemplate('server-down')">🖥️ 服务器宕机</button>
<button class="btn-sm btn-red" onclick="quickTemplate('db-failover')">🗄️ 数据库切换</button>
<button class="btn-sm btn-orange" onclick="quickTemplate('ddos')">🛡️ DDoS攻击</button>
<button class="btn-sm btn-green" onclick="quickTemplate('data-breach')">🔐 数据泄露</button>
<button class="btn-sm btn-purple" onclick="quickTemplate('service-degrade')">📉 服务降级</button>
</div>
</div>

<div class="card">
<div class="section-title">剧本编辑</div>
<div style="margin-bottom:12px"><label>剧本标题</label><input type="text" id="pbTitle" placeholder="例：服务器宕机应急剧本"></div>
<div class="form-row">
<div><label>场景类型</label><select id="pbType"><option value="incident">故障应急</option><option value="drill">演练剧本</option><option value="onboarding">新人上手</option><option value="checklist">操作检查</option></select></div>
<div><label>优先级</label><select id="pbPriority"><option value="critical">关键</option><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></div>
</div>
<div style="margin-bottom:12px"><label>场景描述</label><textarea id="pbDesc" rows="2" placeholder="描述此剧本适用的场景"></textarea></div>

<div id="scenesContainer"></div>
<button class="btn-sm" onclick="addScene()" style="margin-top:8px">+ 添加场景</button>

<div style="margin-top:12px"><label>总结/注意事项</label><textarea id="pbSummary" rows="3" placeholder="剧本结束后的总结和注意事项"></textarea></div>
<div style="display:flex;gap:8px;margin-top:12px">
<button onclick="savePlaybook()">💾 保存剧本</button>
<button class="btn-green" onclick="previewPlaybook()">👁 预览</button>
<button class="btn-purple" onclick="exportPlaybook()">📤 导出</button>
</div>
</div>

<div class="card">
<div class="section-title">剧本列表 <span id="pbCount" style="font-size:.8rem;color:var(--text2)">(0)</span></div>
<div id="playbookList"></div>
</div>

<div class="card" id="previewCard" style="display:none">
<div class="section-title">剧本预览</div>
<div class="rendered" id="pbPreview"></div>
</div>

<div class="card" id="exportCard" style="display:none">
<div class="section-title">Markdown输出</div>
<div class="preview-box" id="mdOutput"></div>
<div style="margin-top:8px"><button class="btn-sm btn-green" onclick="copyMD()">📋 复制</button></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var playbooks = JSON.parse(localStorage.getItem('playbooks') || '[]');
var idCounter = playbooks.length ? Math.max(...playbooks.map(p=>p.id)) + 1 : 1;
var scenes = [];
var sceneIdCounter = 0;

var quickTemplates = {
  'server-down':{title:'服务器宕机应急剧本',desc:'当生产环境服务器出现宕机时的应急处理流程',scenes:[
    {role:'值班工程师',title:'确认故障',actions:['检查监控面板确认服务器状态','SSH尝试连接目标服务器','检查网络连通性: ping <server-ip>']},
    {role:'值班工程师',title:'初步诊断',actions:['查看服务器最后日志: journalctl -u app --since "10 minutes ago"','检查磁盘空间: df -h','检查内存使用: free -m']},
    {role:'值班工程师',title:'尝试恢复',actions:['重启服务: systemctl restart app','如重启无效，尝试重启服务器: reboot','检查服务健康: curl localhost:3000/health']},
    {role:'团队负责人',title:'通知升级',actions:['通知TL和相关同事','更新状态页面','如15分钟未恢复，升级到P0处理流程']},
    {role:'值班工程师',title:'恢复验证',actions:['确认服务恢复正常','运行冒烟测试','监控10分钟确保稳定']}
  ]},
  'db-failover':{title:'数据库故障切换剧本',desc:'当主数据库出现故障时，切换到从库的应急流程',scenes:[
    {role:'DBA',title:'确认故障',actions:['检查主库连接状态','查看MySQL复制状态: SHOW SLAVE STATUS','检查主库进程: SHOW PROCESSLIST']},
    {role:'DBA',title:'评估影响',actions:['确认哪些服务受影响','统计数据同步延迟','评估数据一致性']},
    {role:'DBA',title:'执行切换',actions:['停止写入主库','提升从库为主库: STOP SLAVE; RESET SLAVE ALL; SET GLOBAL read_only=OFF','更新DNS或配置指向新主库']},
    {role:'应用工程师',title:'应用切换',actions:['更新数据库连接配置','重启应用服务','验证应用功能正常']},
    {role:'DBA',title:'后续处理',actions:['修复原主库','重新搭建主从同步','回切计划']}
  ]},
  'ddos':{title:'DDoS攻击应急剧本',desc:'当遭受DDoS攻击时的应急响应流程',scenes:[
    {role:'安全工程师',title:'确认攻击',actions:['分析流量异常: netstat -ant | awk \'{print $5}\' | cut -d: -f1 | sort | uniq -c','检查请求频率','确认攻击类型: SYN Flood / HTTP Flood / DNS Amplification']},
    {role:'安全工程师',title:'启动防护',actions:['启用CDN防护规则','配置IP黑名单','开启速率限制','联系云服务商启动DDoS防护']},
    {role:'运维工程师',title:'系统加固',actions:['调整防火墙规则','增加服务器带宽','启用连接数限制','关闭非必要端口']},
    {role:'团队负责人',title:'对外沟通',actions:['通知业务方','准备用户公告','联系安全团队']},
    {role:'安全工程师',title:'事后分析',actions:['收集攻击日志','分析攻击来源','更新防护策略','编写安全报告']}
  ]},
  'data-breach':{title:'数据泄露应急剧本',desc:'当发现数据泄露事件时的应急响应流程',scenes:[
    {role:'安全工程师',title:'确认泄露',actions:['确认泄露范围和数据类型','检查访问日志','锁定可疑账户','保存证据']},
    {role:'安全工程师',title:'紧急止损',actions:['关闭泄露通道','重置相关密钥和凭证','隔离受影响系统','通知法务部门']},
    {role:'团队负责人',title:'评估影响',actions:['评估泄露数据量','确认受影响用户数','评估合规风险','准备监管报告']},
    {role:'安全工程师',title:'根因修复',actions:['修复安全漏洞','加强访问控制','更新安全策略','代码审计']},
    {role:'法务/PR',title:'对外通报',actions:['评估是否需要用户通知','准备监管报告','准备公关声明','法律咨询']}
  ]},
  'service-degrade':{title:'服务降级应急剧本',desc:'当服务出现性能降级时的应急处理流程',scenes:[
    {role:'运维工程师',title:'确认降级',actions:['检查监控指标: CPU/内存/磁盘/网络','检查请求延迟和错误率','确认影响的服务和用户范围']},
    {role:'运维工程师',title:'紧急扩容',actions:['水平扩容: 增加实例数量','垂直扩容: 增加单实例资源','启用自动扩缩容策略']},
    {role:'应用工程师',title:'流量控制',actions:['启用限流策略','关闭非核心功能','启用缓存','降级非关键接口']},
    {role:'运维工程师',title:'根因排查',actions:['分析慢查询日志','检查连接池状态','排查内存泄漏','分析GC日志']},
    {role:'团队负责人',title:'恢复确认',actions:['确认性能指标恢复','逐步放开限流','监控稳定性','编写事后报告']}
  ]}
};

function quickTemplate(type){
  var t=quickTemplates[type];
  document.getElementById('pbTitle').value=t.title;
  document.getElementById('pbDesc').value=t.desc;
  scenes=[];
  sceneIdCounter=0;
  t.scenes.forEach(function(s){addSceneWithData(s);});
  renderScenes();
}

function addScene(){addSceneWithData({role:'',title:'',actions:[]});renderScenes();}
function addSceneWithData(data){scenes.push({id:sceneIdCounter++,role:data.role,title:data.title,actions:data.actions||[]});}

function renderScenes(){
  var el=document.getElementById('scenesContainer');
  if(!scenes.length){el.innerHTML='<p style="color:var(--text2);font-size:.82rem">点击"添加场景"或使用快速模板</p>';return;}
  el.innerHTML=scenes.map(function(s,i){
    var actionsHtml=s.actions.map(function(a,j){return '<li><span class="action-num">'+(j+1)+'</span><span class="action-text">'+a+'</span></li>';}).join('');
    return '<div class="scene-block"><div class="scene-header"><div class="scene-title">场景 '+(i+1)+': <input type="text" value="'+s.title+'" onchange="updateScene('+s.id+',\'title\',this.value)" style="width:auto;display:inline;border:none;background:transparent;font-weight:600;font-size:.9rem" placeholder="场景标题"></div><div><input type="text" value="'+s.role+'" onchange="updateScene('+s.id+',\'role\',this.value)" style="width:auto;display:inline;border:none;background:transparent;font-size:.8rem;color:var(--purple)" placeholder="角色"></div></div><div style="margin-bottom:8px"><label>操作步骤</label><textarea rows="3" onchange="updateSceneActions('+s.id+',this.value)" placeholder="每行一个操作步骤">'+s.actions.join('\n')+'</textarea></div><button class="btn-sm btn-red" onclick="removeScene('+s.id+')">删除场景</button></div>';
  }).join('');
}

function updateScene(id,key,val){var s=scenes.find(function(x){return x.id===id;});if(s)s[key]=val;}
function updateSceneActions(id,val){var s=scenes.find(function(x){return x.id===id;});if(s)s.actions=val.split('\n').filter(function(l){return l.trim();});}
function removeScene(id){scenes=scenes.filter(function(s){return s.id!==id;});renderScenes();}

function savePlaybook(){
  var title=document.getElementById('pbTitle').value.trim();
  if(!title){alert('请输入剧本标题');return;}
  playbooks.unshift({
    id:idCounter++,title:title,desc:document.getElementById('pbDesc').value,
    type:document.getElementById('pbType').value,
    priority:document.getElementById('pbPriority').value,
    scenes:JSON.parse(JSON.stringify(scenes)),
    summary:document.getElementById('pbSummary').value,
    created:new Date().toLocaleDateString('zh-CN')
  });
  localStorage.setItem('playbooks',JSON.stringify(playbooks));
  renderList();
  alert('剧本保存成功！');
}

function renderList(){
  var el=document.getElementById('playbookList');
  document.getElementById('pbCount').textContent='('+playbooks.length+')';
  if(!playbooks.length){el.innerHTML='<p style="color:var(--text2);text-align:center;padding:20px">暂无剧本</p>';return;}
  var typeLabels={incident:'故障应急',drill:'演练',onboarding:'新人上手',checklist:'操作检查'};
  var typeColors={incident:'var(--red)',drill:'var(--blue)',onboarding:'var(--green)',checklist:'var(--orange)'};
  el.innerHTML=playbooks.map(function(p){
    return '<div class="playbook-item" onclick="loadPlaybook('+p.id+')"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="pb-title">'+p.title+'</div><button class="btn-sm btn-red" onclick="event.stopPropagation();deletePlaybook('+p.id+')">删除</button></div><div class="pb-desc">'+p.desc+'</div><div class="pb-meta"><span class="tag tag-type" style="background:'+typeColors[p.type]+';border-color:'+typeColors[p.type]+'">'+(typeLabels[p.type]||p.type)+'</span><span class="tag">'+p.scenes.length+'个场景</span><span>'+p.created+'</span></div></div>';
  }).join('');
}

function loadPlaybook(id){
  var p=playbooks.find(function(x){return x.id===id;});
  if(!p)return;
  document.getElementById('pbTitle').value=p.title;
  document.getElementById('pbDesc').value=p.desc;
  document.getElementById('pbType').value=p.type;
  document.getElementById('pbPriority').value=p.priority;
  scenes=p.scenes.map(function(s){return Object.assign({},s,{id:sceneIdCounter++,actions:s.actions.slice()});});
  document.getElementById('pbSummary').value=p.summary||'';
  renderScenes();
  window.scrollTo({top:0,behavior:'smooth'});
}

function deletePlaybook(id){playbooks=playbooks.filter(function(p){return p.id!==id;});localStorage.setItem('playbooks',JSON.stringify(playbooks));renderList();}

function previewPlaybook(){
  var title=document.getElementById('pbTitle').value||'剧本标题';
  var desc=document.getElementById('pbDesc').value;
  var html='<h2>'+title+'</h2>';
  if(desc)html+='<p style="color:var(--text2)">'+desc+'</p>';
  scenes.forEach(function(s,i){
    html+='<h3>场景 '+(i+1)+': '+s.title+(s.role?' <span style="color:var(--purple);font-size:.8rem">['+s.role+']</span>':'')+'</h3>';
    if(s.actions.length){
      html+='<ol style="padding-left:20px">';
      s.actions.forEach(function(a){html+='<li style="padding:4px 0;font-size:.9rem">'+a+'</li>';});
      html+='</ol>';
    }
  });
  var summary=document.getElementById('pbSummary').value;
  if(summary)html+='<h3>总结</h3><div style="background:var(--bg);padding:12px;border-radius:8px;font-size:.85rem">'+summary.replace(/\n/g,'<br>')+'</div>';
  document.getElementById('pbPreview').innerHTML=html;
  document.getElementById('previewCard').style.display='block';
  document.getElementById('previewCard').scrollIntoView({behavior:'smooth'});
}

function exportPlaybook(){
  var title=document.getElementById('pbTitle').value||'剧本标题';
  var desc=document.getElementById('pbDesc').value;
  var md='# '+title+'\n\n'+desc+'\n\n';
  scenes.forEach(function(s,i){
    md+='## 场景 '+(i+1)+': '+s.title+'\n\n';
    if(s.role)md+='**角色**: '+s.role+'\n\n';
    if(s.actions.length){md+='**操作步骤**:\n\n';s.actions.forEach(function(a,j){md+=(j+1)+'. '+a+'\n';});md+='\n';}
  });
  var summary=document.getElementById('pbSummary').value;
  if(summary)md+='## 总结\n\n'+summary+'\n\n';
  document.getElementById('mdOutput').textContent=md;
  document.getElementById('exportCard').style.display='block';
  document.getElementById('exportCard').scrollIntoView({behavior:'smooth'});
}

function copyMD(){navigator.clipboard.writeText(document.getElementById('mdOutput').textContent).then(function(){alert('已复制');});}
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
renderList();
</script>
</body>
</html>
