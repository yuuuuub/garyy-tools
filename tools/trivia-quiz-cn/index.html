<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>知识问答</title>
<meta name="description" content="趣味知识问答游戏，挑战你的知识储备">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px;overflow-x:hidden;scroll-behavior:smooth}
h1{font-size:1.5rem;margin-bottom:16px;color:#eab308;text-shadow:0 0 10px #eab30844}
.container{max-width:560px;width:100%;display:flex;flex-direction:column;gap:16px}
.hud{display:flex;justify-content:space-between;gap:10px}
.hud div{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 16px;text-align:center;flex:1}
.hud .label{font-size:.75rem;color:var(--text2)}
.hud .val{font-size:1.3rem;font-weight:bold;color:#eab308}
.question{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;font-size:1.1rem;line-height:1.6;min-height:80px}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:14px 18px;font-size:1rem;cursor:pointer;transition:all .2s;text-align:left}
.option:hover{border-color:var(--blue);background:var(--blue)11}
.option.correct{border-color:var(--green);background:var(--green)22;color:#fff}
.option.wrong{border-color:var(--red);background:var(--red)22;color:#fff}
.option.disabled{pointer-events:none;opacity:.7}
.next-btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:12px;font-size:1rem;cursor:pointer;width:100%;margin-top:8px;display:none}
.next-btn:hover{opacity:.9}
.progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);transition:width .3s;border-radius:2px}
.result{text-align:center;padding:30px;background:var(--card);border-radius:12px;border:1px solid var(--border)}
.result h2{font-size:1.8rem;margin-bottom:12px}
.result .score{font-size:3rem;font-weight:bold;color:#eab308;margin:16px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>🧠 知识问答</h1>
<div class="container" id="app"></div>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
<script>
const QS=[
{q:'中国最长的河流是？',o:['长江','黄河','珠江','黑龙江'],a:0},
{q:'光的速度大约是每秒多少公里？',o:['30万公里','15万公里','50万公里','10万公里'],a:0},
{q:'太阳系中最大的行星是？',o:['木星','土星','海王星','天王星'],a:0},
{q:'人体最大的器官是？',o:['皮肤','肝脏','大脑','心脏'],a:0},
{q:'一年有多少天？',o:['365天','366天','364天','360天'],a:0},
{q:'地球的天然卫星是？',o:['月球','火星','金星','木星'],a:0},
{q:'水的化学式是？',o:['H₂O','CO₂','O₂','NaCl'],a:0},
{q:'中国有多少个省级行政区？',o:['34个','32个','36个','30个'],a:0},
{q:'世界上最高的山峰是？',o:['珠穆朗玛峰','乔戈里峰','干城章嘉峰','洛子峰'],a:0},
{q:'人体中最硬的部分是？',o:['牙齿','骨骼','指甲','头发'],a:0},
{q:'地球自转一周需要多久？',o:['约24小时','约12小时','约36小时','约48小时'],a:0},
{q:'中国的国宝动物是？',o:['大熊猫','东北虎','金丝猴','白鳍豚'],a:0},
{q:'一年有几个季节？',o:['4个','3个','5个','6个'],a:0},
{q:'彩虹有几种颜色？',o:['7种','5种','6种','8种'],a:0},
{q:'人体有多少块骨头？',o:['206块','208块','204块','210块'],a:0}
];
let qs=[],idx=0,score=0,answered=false;

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

function start(){
qs=shuffle([...QS]).slice(0,10);idx=0;score=0;answered=false;render()
}
function render(){
const app=document.getElementById('app');
if(idx>=qs.length){app.innerHTML=`<div class="result"><h2>🎉 挑战完成!</h2><div class="score">${score} / ${qs.length}</div><p style="color:var(--text2)">${score>=8?'太厉害了!':score>=5?'不错哦!':'继续加油!'}</p><button class="next-btn" style="display:block;margin:16px auto 0;max-width:200px" onclick="start()">再来一轮</button></div>`;return}
const q=qs[idx];
app.innerHTML=`
<div class="progress"><div class="progress-fill" style="width:${(idx/qs.length)*100}%"></div></div>
<div class="hud"><div><div class="label">题目</div><div class="val">${idx+1}/${qs.length}</div></div><div><div class="label">得分</div><div class="val">${score}</div></div></div>
<div class="question">${q.q}</div>
<div class="options">${q.o.map((o,i)=>`<div class="option" onclick="answer(${i})" id="opt-${i}">${o}</div>`).join('')}</div>`;
answered=false
}
function answer(i){
if(answered)return;answered=true;
const q=qs[idx];
document.querySelectorAll('.option').forEach((el,j)=>{
el.classList.add('disabled');
if(j===q.a)el.classList.add('correct');
if(j===i&&j!==q.a)el.classList.add('wrong');
});
if(i===q.a)score++;
setTimeout(()=>{idx++;render()},1000)
}
start();
</script>
</body>
</html>
