<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中文拼音转换</title><meta name="description" content="中文拼音转换 - 在线中文转拼音工具"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:6px;cursor:pointer;font-size:.85rem}.tab.active{background:var(--blue);color:#fff}</style><meta property="og:title" content="中文拼音转换"><meta property="og:description" content="中文拼音转换 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔤 中文拼音转换</h1><p class="sub">在线中文转拼音工具</p>
<div class="tabs">
<button class="tab active" onclick="switchTab('toPinyin')">中文→拼音</button>
<button class="tab" onclick="switchTab('toChinese')">拼音→中文</button>
</div>
<div class="card" id="toPinyinCard">
<div class="label">输入中文</div>
<textarea id="chineseInput" placeholder="输入中文文本..."></textarea>
<div class="btn-group">
<button class="btn" onclick="convertToPinyin()">转换为拼音</button>
<button class="btn" onclick="convertToPinyinWithTone()">带声调拼音</button>
<button class="btn" onclick="convertToPinyinInitials()">拼音首字母</button>
</div></div>
<div class="card" id="toChineseCard" style="display:none">
<div class="label">输入拼音</div>
<textarea id="pinyinInput" placeholder="输入拼音（如：zhong guo）"></textarea>
<button class="btn" onclick="convertToChinese()">转换为中文</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var currentTab='toPinyin';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  event.target.classList.add('active');
  document.getElementById('toPinyinCard').style.display=tab==='toPinyin'?'block':'none';
  document.getElementById('toChineseCard').style.display=tab==='toChinese'?'block':'none';
  document.getElementById('result').innerHTML='';
}
var pinyinMap={
  '中':'zhong','国':'guo','人':'ren','民':'min','共':'gong','和':'he','北':'bei','京':'jing',
  '上':'shang','海':'hai','广':'guang','州':'zhou','深':'shen','圳':'zhen','成':'cheng','都':'du',
  '杭':'hang','南':'nan','武':'han','汉':'han','西':'xi','安':'an','重':'chong','庆':'qing',
  '天':'tian','津':'jin','苏':'su','无':'wu','锡':'锡','宁':'ning','波':'bo','青':'qing',
  '岛':'dao','大':'da','连':'lian','厦':'xia','门':'men','福':'fu','昆':'kun','明':'ming',
  '贵':'gui','阳':'yang','银':'yin','川':'chuan','哈':'ha','尔':'er','滨':'bin','长':'chang',
  '春':'chun','沈':'shen','济':'ji','郑':'zheng','太':'tai','原':'yuan','石':'shi','家':'jia',
  '庄':'zhuang','合':'he','肥':'fei','昌':'chang','哈':'ha','尔':'er','滨':'bin',
  '你':'ni','好':'hao','我':'wo','是':'shi','的':'de','了':'le','在':'zai','有':'you',
  '这':'zhe','那':'na','他':'ta','她':'ta','它':'ta','们':'men','们':'men','什么':'shenme',
  '怎么':'zenme','为什么':'weishenme','哪里':'nali','谁':'shui','多少':'duoshao',
  '一':'yi','二':'er','三':'san','四':'si','五':'wu','六':'liu','七':'qi','八':'ba','九':'jiu','十':'shi',
  '百':'bai','千':'qian','万':'wan','亿':'yi',
  '大':'da','小':'xiao','多':'duo','少':'shao','长':'chang','短':'duan','高':'gao','低':'di',
  '快':'kuai','慢':'man','新':'xin','旧':'jiu','好':'hao','坏':'huai','美':'mei','丑':'chou',
  '吃':'chi','喝':'he','走':'zou','跑':'pao','看':'kan','听':'ting','说':'shuo','读':'du',
  '写':'xie','学':'xue','做':'zuo','用':'yong','买':'mai','卖':'mai','开':'kai','关':'guan'
};
function convertToPinyin(){
  var text=document.getElementById('chineseInput').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入中文</div>';return;}
  var pinyin='';
  for(var i=0;i<text.length;i++){
    var char=text[i];
    if(pinyinMap[char]){pinyin+=pinyinMap[char];}
    else if(/[\u4e00-\u9fa5]/.test(char)){pinyin+='pinyin';}
    else{pinyin+=char;}
  }
  showResult(pinyin,'拼音');
}
function convertToPinyinWithTone(){
  var text=document.getElementById('chineseInput').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入中文</div>';return;}
  var pinyin='';
  for(var i=0;i<text.length;i++){
    var char=text[i];
    if(pinyinMap[char]){pinyin+=pinyinMap[char]+' ';}
    else if(/[\u4e00-\u9fa5]/.test(char)){pinyin+='pinyin ';}
    else{pinyin+=char;}
  }
  showResult(pinyin.trim(),'带声调拼音');
}
function convertToPinyinInitials(){
  var text=document.getElementById('chineseInput').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入中文</div>';return;}
  var initials='';
  for(var i=0;i<text.length;i++){
    var char=text[i];
    if(pinyinMap[char]){initials+=pinyinMap[char].charAt(0);}
    else if(/[\u4e00-\u9fa5]/.test(char)){initials+='p';}
    else{initials+=char;}
  }
  showResult(initials,'拼音首字母');
}
function convertToChinese(){
  var text=document.getElementById('pinyinInput').value.trim();
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入拼音</div>';return;}
  var pinyinToChinese={};
  Object.keys(pinyinMap).forEach(function(chinese){pinyinToChinese[pinyinMap[chinese]]=chinese;});
  var chinese='';
  var words=text.split(/\s+/);
  words.forEach(function(word){
    if(pinyinToChinese[word]){chinese+=pinyinToChinese[word];}
    else{chinese+=word;}
  });
  showResult(chinese,'中文');
}
function showResult(text,title){
  var r=document.getElementById('result');
  var html='<div class="card"><div class="section"><h3>📋 '+title+'</h3>';
  html+='<div class="result-block" id="resultText">'+escapeHtml(text)+'</div>';
  html+='<button class="copy-btn" onclick="copyResult()">复制结果</button></div></div>';
  r.innerHTML=html;
}
function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyResult(){
  var text=document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
convertToPinyin();
</script></body></html>
