<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏃 跑步追踪</title>
<meta name="description" content="跑步数据追踪器，记录距离、配速、路线，查看跑步统计和个人记录">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:10px 0;margin-top:8px}
.bar-chart .bar{flex:1;background:linear-gradient(180deg,var(--success),var(--accent));border-radius:4px 4px 0 0;position:relative;min-width:20px;transition:height .3s}
.bar-chart .bar .val{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--text2)}
.bar-chart .bar .lbl{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--text2);white-space:nowrap}
.pr{background:var(--bg);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🏃 跑步追踪">
<meta property="og:description" content="跑步数据追踪器，记录距离、配速、路线，查看跑步统计">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/running-tracker-cn/">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏃 跑步追踪</h1><p>每一步都算数</p></div>

<div class="cd">
<div class="gr">
<div class="st"><div class="nm" id="totalDist">0</div><div class="lb">总距离(km)</div></div>
<div class="st"><div class="nm" id="avgPace" style="color:var(--success)">0'00"</div><div class="lb">平均配速</div></div>
<div class="st"><div class="nm" id="best5k" style="color:var(--warn)">--</div><div class="lb">最佳5km</div></div>
<div class="st"><div class="nm" id="totalRuns" style="color:var(--danger)">0</div><div class="lb">总跑步次数</div></div>
</div>
</div>

<div class="cd"><h2>记录跑步</h2>
<div class="fr">
<div><label>距离(km)</label><input type="number" id="rDist" placeholder="5.00" step="0.01" min="0.01"></div>
<div><label>时长(分钟)</label><input type="number" id="rMin" placeholder="30" min="1"></div>
</div>
<div class="fr">
<div><label>地形</label><select id="rTerrain"><option>公路</option><option>操场</option><option>越野</option><option>跑步机</option><option>山地</option></select></div>
<div><label>天气</label><select id="rWeather"><option>晴天</option><option>多云</option><option>阴天</option><option>小雨</option><option>大风</option><option>寒冷</option><option>炎热</option></select></div>
</div>
<div><label>日期</label><input type="date" id="rDate"></div>
<div><label>备注(选填)</label><input type="text" id="rNote" placeholder="感觉如何"></div>
<div class="bg"><button onclick="addRun()">保存跑步</button></div></div>

<div class="cd"><h2>近10次跑步距离</h2><div class="bar-chart" id="distChart"></div></div>

<div class="cd"><h2>个人记录</h2><div id="prList" class="es">暂无记录</div></div>

<div class="cd"><h2>跑步历史</h2><div id="runList" class="es">暂无记录</div>
<div class="bg"><button class="dng" onclick="clearRuns()">清空所有</button></div></div>
</div>
<script>
(function(){
var DB_KEY='running_tracker_cn';
var runs=JSON.parse(localStorage.getItem(DB_KEY)||'[]');
var today=function(){return new Date().toISOString().slice(0,10)};

window.addRun=function(){
var dist=parseFloat(document.getElementById('rDist').value)||0;
var min=parseInt(document.getElementById('rMin').value)||0;
if(!dist||!min){alert('请填写距离和时长');return;}
var terrain=document.getElementById('rTerrain').value;
var weather=document.getElementById('rWeather').value;
var date=document.getElementById('rDate').value||today();
var note=document.getElementById('rNote').value.trim();
var pace=min/dist;
runs.push({id:Date.now(),distance:dist,duration:min,terrain:terrain,weather:weather,date:date,note:note,pace:pace});
localStorage.setItem(DB_KEY,JSON.stringify(runs));
document.getElementById('rDist').value='';document.getElementById('rMin').value='';document.getElementById('rNote').value='';
render();
};

window.delRun=function(id){runs=runs.filter(function(r){return r.id!==id});localStorage.setItem(DB_KEY,JSON.stringify(runs));render();};
window.clearRuns=function(){if(!confirm('确定清空所有？'))return;runs=[];localStorage.setItem(DB_KEY,JSON.stringify(runs));render();};

function formatPace(p){
if(!p||!isFinite(p))return "--";
var m=Math.floor(p);var s=Math.round((p-m)*60);
return m+"'"+(s<10?'0':'')+s+'"';
}

function getBest5k(){
var fives=runs.filter(function(r){return r.distance>=5&&!isNaN(r.pace);});
if(!fives.length)return null;
fives.sort(function(a,b){return a.pace-b.pace;});
return fives[0];
}

function getWeeklyDist(){
var now=new Date();var dow=now.getDay()||7;
var ws=new Date(now);ws.setDate(now.getDate()-dow+1);ws.setHours(0,0,0,0);
var wd={};
for(var i=0;i<7;i++){var d=new Date(ws);d.setDate(ws.getDate()+i);wd[d.toISOString().slice(0,10)]=0;}
runs.forEach(function(r){if(wd[r.date]!==undefined)wd[r.date]+=r.distance;});
return wd;
}

function render(){
var totalD=0,totalP=0;
runs.forEach(function(r){totalD+=r.distance;totalP+=r.pace*r.distance;});
var avgP=runs.length?totalP/totalD:0;
var b5k=getBest5k();

document.getElementById('totalDist').textContent=totalD.toFixed(1);
document.getElementById('avgPace').textContent=formatPace(avgP);
document.getElementById('best5k').textContent=b5k?formatPace(b5k.pace):'--';
document.getElementById('totalRuns').textContent=runs.length;

var wd=getWeeklyDist();var dayN=['一','二','三','四','五','六','日'];
var maxV=1;Object.values(wd).forEach(function(v){if(v>maxV)maxV=v;});
var chartH='';Object.keys(wd).forEach(function(k,i){
var h=Math.round(wd[k]/maxV*100);
chartH+='<div class="bar" style="height:'+Math.max(h,3)+'%"><div class="val">'+wd[k].toFixed(1)+'</div><div class="lbl">周'+dayN[i]+'</div></div>';
});
document.getElementById('distChart').innerHTML=chartH;

var prEl=document.getElementById('prList');
var prs=[];
var dists={};
runs.forEach(function(r){var d=Math.floor(r.distance);if(!dists[d]||r.pace<dists[d].pace)dists[d]=r;});
Object.values(dists).sort(function(a,b){return b.distance-a.distance;}).forEach(function(r){
prs.push('<div class="pr"><div><strong>'+r.distance+'km</strong></div><div style="font-weight:600;color:var(--accent)">'+formatPace(r.pace)+'/'+(r.duration)+'分钟<br><span style="font-size:.75rem;color:var(--text2)">'+r.date+'</span></div></div>');
});
prEl.innerHTML=prs.length?prs.join(''):'<div class="es">暂无记录</div>';

var el=document.getElementById('runList');
if(!runs.length){el.innerHTML='<div class="es">暂无记录</div>';return;}
el.innerHTML=runs.slice().reverse().map(function(r){
return '<div class="li"><div style="flex:1"><strong>'+r.distance+'km</strong> <span class="tag">'+r.terrain+'</span><span class="tag w">'+r.weather+'</span><br><span style="font-size:.8rem;color:var(--text2)">配速'+formatPace(r.pace)+' · '+r.duration+'分钟 · '+r.date+(r.note?' · '+r.note:'')+'</span></div><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="delRun('+r.id+')">✕</button></div>';
}).join('');
}
document.getElementById('rDate').value=today();
render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
