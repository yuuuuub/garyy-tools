<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋爱模拟 - 心动时刻</title>
    <meta name="description" content="恋爱模拟游戏，在虚拟世界体验甜蜜恋爱故事">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #3b82f6;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .game-container {
            max-width: 800px;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .game-header {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .game-header h1 {
            font-size: 1.4rem;
        }
        
        .day-info {
            font-size: 0.9rem;
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 15px;
        }
        
        .scene-area {
            position: relative;
            height: 280px;
            overflow: hidden;
        }
        
        .background {
            width: 100%;
            height: 100%;
            transition: background 0.5s;
        }
        
        .bg-school { background: linear-gradient(180deg, #1e3a5f, #3b82f6); }
        .bg-cafe { background: linear-gradient(180deg, #78350f, #b45309); }
        .bg-park { background: linear-gradient(180deg, #14532d, #22c55e); }
        .bg-sunset { background: linear-gradient(180deg, #dc2626, #f97316); }
        .bg-night { background: linear-gradient(180deg, #0f172a, #1e293b); }
        
        .character-display {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        
        .avatar {
            width: 120px;
            height: 140px;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            margin: 0 auto 10px;
            transition: transform 0.3s;
        }
        
        .avatar.love { animation: heartbeat 1s infinite; }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .avatar-miko {
            background: linear-gradient(135deg, #fce7f3, #fbcfe8);
        }
        
        .avatar-yuki {
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
        }
        
        .avatar-rin {
            background: linear-gradient(135deg, #dcfce7, #bbf7d0);
        }
        
        .avatar-hair {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            border-radius: 50% 50% 0 0;
        }
        
        .hair-pink { background: linear-gradient(180deg, #ec4899, #f472b6); }
        .hair-silver { background: linear-gradient(180deg, #9ca3af, #d1d5db); }
        .hair-green { background: linear-gradient(180deg, #16a34a, #4ade80); }
        
        .avatar-face {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 55px;
            background: #fde68a;
            border-radius: 50%;
        }
        
        .avatar-eyes {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
        }
        
        .eye {
            width: 14px;
            height: 14px;
            background: #1f2937;
            border-radius: 50%;
            position: relative;
        }
        
        .eye::after {
            content: '';
            position: absolute;
            top: 3px;
            right: 3px;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
        }
        
        .eye.happy {
            height: 7px;
            border-radius: 0 0 10px 10px;
        }
        
        .eye.love {
            background: #ec4899;
        }
        
        .avatar-blush {
            position: absolute;
            top: 28px;
            width: 15px;
            height: 10px;
            background: #fca5a5;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .blush-left { left: 8px; }
        .blush-right { right: 8px; }
        
        .blush.active { opacity: 0.7; }
        
        .avatar-mouth {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 10px;
            border: 2px solid #dc2626;
            border-top: none;
            border-radius: 0 0 10px 10px;
        }
        
        .mouth-happy {
            width: 22px;
        }
        
        .mouth-love {
            background: #dc2626;
            border-radius: 50%;
            width: 12px;
            height: 12px;
            border: none;
        }
        
        .avatar-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 45px;
            border-radius: 10px 10px 0 0;
        }
        
        .body-school { background: linear-gradient(180deg, #1f2937, #374151); }
        
        .char-name {
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        .dialogue-area {
            position: relative;
            background: rgba(0,0,0,0.85);
            min-height: 160px;
            padding: 20px;
        }
        
        .speaker-name {
            position: absolute;
            top: -12px;
            left: 20px;
            background: #ec4899;
            padding: 4px 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .dialogue-text {
            margin-top: 15px;
            line-height: 1.8;
            font-size: 1rem;
            min-height: 60px;
        }
        
        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        
        .choice-btn {
            background: rgba(236, 72, 153, 0.1);
            border: 1px solid #ec4899;
            color: var(--text);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        
        .choice-btn:hover {
            background: rgba(236, 72, 153, 0.3);
            transform: translateX(5px);
        }
        
        .continue-btn {
            position: absolute;
            bottom: 15px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text);
            opacity: 0.6;
            cursor: pointer;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        .affection-bar {
            padding: 15px 20px;
            background: rgba(0,0,0,0.3);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .affection-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }
        
        .affection-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }
        
        .aff-bar {
            width: 80px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .aff-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }
        
        .aff-miko { background: #ec4899; }
        .aff-yuki { background: #6366f1; }
        .aff-rin { background: #22c55e; }
        
        .heart-popup {
            position: absolute;
            font-size: 2rem;
            animation: floatUp 1s forwards;
            pointer-events: none;
        }
        
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }
        
        .event-select {
            padding: 30px;
        }
        
        .event-select h3 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        
        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .event-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .event-card:hover {
            border-color: #ec4899;
            transform: translateY(-3px);
        }
        
        .event-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .event-title {
            font-size: 1rem;
            margin-bottom: 5px;
        }
        
        .event-desc {
            font-size: 0.8rem;
            opacity: 0.7;
        }
        
        .ending-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .ending-content {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }
        
        .ending-content h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #ec4899;
        }
        
        .ending-avatar {
            width: 150px;
            height: 180px;
            border-radius: 50% 50% 45% 45%;
            margin: 0 auto 20px;
        }
        
        .ending-content p {
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        
        .restart-btn {
            padding: 12px 30px;
            background: #ec4899;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .hidden { display: none !important; }
        
        @media (max-width: 600px) {
            .avatar { width: 100px; height: 120px; }
            .avatar-face { width: 56px; height: 44px; top: 32px; }
            .dialogue-area { min-height: 140px; padding: 15px; }
        }
    </style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>心动时刻</h1>
            <span class="day-info" id="day-info">第 1 天</span>
        </div>
        
        <div class="scene-area">
            <div class="background bg-school" id="background"></div>
            <div class="character-display" id="character-display"></div>
        </div>
        
        <div class="dialogue-area">
            <span class="speaker-name" id="speaker-name"></span>
            <div class="dialogue-text" id="dialogue-text"></div>
            <div class="choices hidden" id="choices"></div>
            <button class="continue-btn" id="continue-btn">▼ 继续</button>
        </div>
        
        <div class="affection-bar">
            <div class="affection-item">
                <div class="affection-avatar avatar-miko" style="width:24px;height:24px;border-radius:50%;"></div>
                <span>美子</span>
                <div class="aff-bar"><div class="aff-fill aff-miko" id="miko-bar"></div></div>
                <span id="miko-val">0</span>
            </div>
            <div class="affection-item">
                <div class="affection-avatar avatar-yuki" style="width:24px;height:24px;border-radius:50%;"></div>
                <span>雪</span>
                <div class="aff-bar"><div class="aff-fill aff-yuki" id="yuki-bar"></div></div>
                <span id="yuki-val">0</span>
            </div>
            <div class="affection-item">
                <div class="affection-avatar avatar-rin" style="width:24px;height:24px;border-radius:50%;"></div>
                <span>凛</span>
                <div class="aff-bar"><div class="aff-fill aff-rin" id="rin-bar"></div></div>
                <span id="rin-val">0</span>
            </div>
        </div>
    </div>
    
    <div class="event-select hidden" id="event-select">
        <div class="game-container">
            <h2>今天要做什么？</h2>
            <div class="event-grid">
                <div class="event-card" onclick="startEvent('miko')">
                    <div class="event-icon">🌸</div>
                    <div class="event-title">和美子约会</div>
                    <div class="event-desc">去咖啡厅聊天</div>
                </div>
                <div class="event-card" onclick="startEvent('yuki')">
                    <div class="event-icon">📚</div>
                    <div class="event-title">和雪学习</div>
                    <div class="event-desc">图书馆一起看书</div>
                </div>
                <div class="event-card" onclick="startEvent('rin')">
                    <div class="event-icon">⚽</div>
                    <div class="event-title">和凛运动</div>
                    <div class="event-desc">去公园跑步</div>
                </div>
                <div class="event-card" onclick="endDay()">
                    <div class="event-icon">🌙</div>
                    <div class="event-title">休息</div>
                    <div class="event-desc">今天到此为止</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="ending-overlay hidden" id="ending-overlay">
        <div class="ending-content" id="ending-content"></div>
    </div>

    <script>
        const gameState = {
            day: 1,
            miko: 0,
            yuki: 0,
            rin: 0,
            currentEvent: null,
            currentStep: 0,
            flags: {}
        };

        const events = {
            miko: {
                bg: 'bg-cafe',
                steps: [
                    { speaker: 'narrator', name: '旁白', text: '你和美子来到一家温馨的咖啡厅。她选了一个靠窗的位置坐下。' },
                    { speaker: 'miko', name: '美子', text: '这里好可爱啊！我经常来这里呢。', emotion: 'happy' },
                    { speaker: 'me', name: '你', text: '是吗？你平时喜欢喝什么？' },
                    { 
                        choices: [
                            { text: '推荐她试试招牌拿铁', next: 1, miko: 5 },
                            { text: '说你喜欢喝甜的', next: 2, miko: 3 },
                            { text: '问她有没有推荐', next: 3, miko: 4 }
                        ]
                    },
                    { speaker: 'miko', name: '美子', text: '招牌拿铁？好啊，那我试试！', emotion: 'happy' },
                    { speaker: 'miko', name: '美子', text: '甜的？哈哈，我们口味好像呢！', emotion: 'happy' },
                    { speaker: 'miko', name: '美子', text: '我推荐焦糖玛奇朵，甜甜的很好喝！', emotion: 'happy' },
                    { speaker: 'narrator', name: '旁白', text: '你们边喝咖啡边聊天，话题从学校聊到兴趣爱好。' },
                    { speaker: 'miko', name: '美子', text: '和你聊天好开心啊...下次我们还能一起出来吗？', emotion: 'shy', miko: 8 }
                ]
            },
            yuki: {
                bg: 'bg-school',
                steps: [
                    { speaker: 'narrator', name: '旁白', text: '你来到图书馆，雪已经在那里等着了。她正专注地看着一本书。' },
                    { speaker: 'yuki', name: '雪', text: '...你来了。', emotion: 'normal' },
                    { speaker: 'me', name: '你', text: '抱歉，让你久等了。' },
                    { 
                        choices: [
                            { text: '问她在看什么书', next: 1, yuki: 4 },
                            { text: '安静地坐在她旁边', next: 2, yuki: 6 },
                            { text: '拿出自己的书开始学习', next: 3, yuki: 3 }
                        ]
                    },
                    { speaker: 'yuki', name: '雪', text: '是一本关于星空的书...你对天文有兴趣吗？', emotion: 'surprised' },
                    { speaker: 'narrator', name: '旁白', text: '你在她旁边坐下，两个人静静地看书。虽然没有说话，但感觉很舒服。' },
                    { speaker: 'yuki', name: '雪', text: '...（小声）其实这样就很好。', emotion: 'shy' },
                    { speaker: 'narrator', name: '旁白', text: '你们一起学习了一个下午。雪看起来比平时放松了很多。' },
                    { speaker: 'yuki', name: '雪', text: '今天...谢谢你。我很开心。', emotion: 'happy', yuki: 6 }
                ]
            },
            rin: {
                bg: 'bg-park',
                steps: [
                    { speaker: 'narrator', name: '旁白', text: '你来到公园，凛正在做热身运动。她穿着运动装，看起来活力十足。' },
                    { speaker: 'rin', name: '凛', text: '哦！你来了！今天要比昨天多跑一圈哦！', emotion: 'excited' },
                    { speaker: 'me', name: '你', text: '没问题，我准备好了！' },
                    { 
                        choices: [
                            { text: '挑战她比赛跑步', next: 1, rin: 5 },
                            { text: '请教她运动技巧', next: 2, rin: 4 },
                            { text: '提议先休息一下', next: 3, rin: 2 }
                        ]
                    },
                    { speaker: 'rin', name: '凛', text: '比赛？哈哈，你输定了！来吧！', emotion: 'excited' },
                    { speaker: 'narrator', name: '旁白', text: '凛耐心地教你怎么正确跑步和呼吸。她的讲解很专业。' },
                    { speaker: 'rin', name: '凛', text: '休息？才刚开始就要休息？不行不行！', emotion: 'sad' },
                    { speaker: 'narrator', name: '旁白', text: '你们一起跑步、做运动，虽然很累但很开心。' },
                    { speaker: 'rin', name: '凛', text: '你进步很快嘛！下次我们去爬山吧！', emotion: 'happy', rin: 6 }
                ]
            }
        };

        function updateAffection() {
            gameState.miko = Math.min(100, Math.max(0, gameState.miko));
            gameState.yuki = Math.min(100, Math.max(0, gameState.yuki));
            gameState.rin = Math.min(100, Math.max(0, gameState.rin));
            
            document.getElementById('miko-bar').style.width = gameState.miko + '%';
            document.getElementById('miko-val').textContent = gameState.miko;
            document.getElementById('yuki-bar').style.width = gameState.yuki + '%';
            document.getElementById('yuki-val').textContent = gameState.yuki;
            document.getElementById('rin-bar').style.width = gameState.rin + '%';
            document.getElementById('rin-val').textContent = gameState.rin;
        }

        function renderCharacter(name, emotion = 'normal') {
            const container = document.getElementById('character-display');
            const chars = {
                miko: { class: 'avatar-miko', hair: 'hair-pink', name: '美子' },
                yuki: { class: 'avatar-yuki', hair: 'hair-silver', name: '雪' },
                rin: { class: 'avatar-rin', hair: 'hair-green', name: '凛' }
            };
            
            if (!chars[name]) {
                container.innerHTML = '';
                return;
            }
            
            const char = chars[name];
            const eyeClass = emotion === 'happy' || emotion === 'love' || emotion === 'excited' ? 'happy' : emotion === 'love' ? 'love' : '';
            const mouthClass = emotion === 'happy' || emotion === 'excited' ? 'mouth-happy' : emotion === 'love' || emotion === 'shy' ? 'mouth-love' : '';
            const blushClass = emotion === 'shy' || emotion === 'love' ? 'active' : '';
            const animClass = emotion === 'love' ? 'love' : '';
            
            container.innerHTML = `
                <div class="avatar ${char.class} ${animClass}">
                    <div class="avatar-hair ${char.hair}"></div>
                    <div class="avatar-face">
                        <div class="avatar-eyes">
                            <div class="eye ${eyeClass}"></div>
                            <div class="eye ${eyeClass}"></div>
                        </div>
                        <div class="avatar-blush blush-left ${blushClass}"></div>
                        <div class="avatar-blush blush-right ${blushClass}"></div>
                        <div class="avatar-mouth ${mouthClass}"></div>
                    </div>
                    <div class="avatar-body body-school"></div>
                </div>
                <div class="char-name">${char.name}</div>
            `;
            
            if (emotion === 'love' || emotion === 'shy') {
                showHeart();
            }
        }

        function showHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-popup';
            heart.textContent = '❤';
            heart.style.left = Math.random() * 60 + 20 + '%';
            heart.style.top = '50%';
            document.querySelector('.scene-area').appendChild(heart);
            setTimeout(() => heart.remove(), 1000);
        }

        function showChoices(choices) {
            const container = document.getElementById('choices');
            container.innerHTML = '';
            container.classList.remove('hidden');
            document.getElementById('continue-btn').classList.add('hidden');
            
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text;
                btn.onclick = () => {
                    if (choice.miko) gameState.miko += choice.miko;
                    if (choice.yuki) gameState.yuki += choice.yuki;
                    if (choice.rin) gameState.rin += choice.rin;
                    updateAffection();
                    gameState.currentStep = choice.next;
                    renderEventStep();
                };
                container.appendChild(btn);
            });
        }

        function renderEventStep() {
            const event = events[gameState.currentEvent];
            const step = event.steps[gameState.currentStep];
            
            if (!step) {
                endEvent();
                return;
            }
            
            document.getElementById('choices').classList.add('hidden');
            document.getElementById('continue-btn').classList.remove('hidden');
            
            document.getElementById('speaker-name').textContent = step.name;
            document.getElementById('speaker-name').className = `speaker-name ${step.speaker === 'miko' ? 'miko' : ''}`;
            document.getElementById('dialogue-text').textContent = step.text;
            
            if (step.speaker !== 'narrator' && step.speaker !== 'me') {
                renderCharacter(step.speaker, step.emotion);
            } else {
                document.getElementById('character-display').innerHTML = '';
            }
        }

        function startEvent(char) {
            gameState.currentEvent = char;
            gameState.currentStep = 0;
            
            document.getElementById('event-select').classList.add('hidden');
            document.getElementById('background').className = `background ${events[char].bg}`;
            document.getElementById('game-content').classList.remove('hidden');
            
            renderEventStep();
        }

        function endEvent() {
            gameState.currentEvent = null;
            
            if (gameState.day >= 7) {
                showEnding();
                return;
            }
            
            gameState.day++;
            document.getElementById('day-info').textContent = `第 ${gameState.day} 天`;
            
            document.getElementById('game-content').classList.add('hidden');
            document.getElementById('event-select').classList.remove('hidden');
            document.getElementById('background').className = 'background bg-night';
            document.getElementById('character-display').innerHTML = '';
        }

        function endDay() {
            if (gameState.day >= 7) {
                showEnding();
            } else {
                gameState.day++;
                document.getElementById('day-info').textContent = `第 ${gameState.day} 天`;
            }
        }

        function showEnding() {
            const overlay = document.getElementById('ending-overlay');
            const content = document.getElementById('ending-content');
            
            let bestChar = 'miko';
            let bestScore = gameState.miko;
            
            if (gameState.yuki > bestScore) {
                bestChar = 'yuki';
                bestScore = gameState.yuki;
            }
            if (gameState.rin > bestScore) {
                bestChar = 'rin';
                bestScore = gameState.rin;
            }
            
            const endings = {
                miko: {
                    title: '结局：甜蜜的恋人',
                    color: '#ec4899',
                    text: `美子终于向你表白了！原来她一直喜欢你，只是害羞不敢说。你们一起去了那家咖啡厅，在樱花树下成为了恋人。她笑着说："以后每天都要一起喝咖啡哦！"`,
                    bg: 'linear-gradient(135deg, #fce7f3, #fbcfe8)'
                },
                yuki: {
                    title: '结局：心灵相通',
                    color: '#6366f1',
                    text: `雪主动拉住了你的手。虽然她平时话不多，但她用行动表达了心意。你们一起看遍了星空，她指着最亮的那颗星说："这是我们的星星。"`,
                    bg: 'linear-gradient(135deg, #e0e7ff, #c7d2fe)'
                },
                rin: {
                    title: '结局：最佳搭档',
                    color: '#22c55e',
                    text: `凛提议你们一起参加马拉松比赛。在终点线上，她气喘吁吁地说："你是第一个能跟上我的人...所以，以后也要一直陪我跑下去！"`,
                    bg: 'linear-gradient(135deg, #dcfce7, #bbf7d0)'
                }
            };
            
            const end = endings[bestChar];
            
            content.innerHTML = `
                <h2 style="color: ${end.color}">${end.title}</h2>
                <div class="ending-avatar ${bestChar === 'miko' ? 'avatar-miko' : bestChar === 'yuki' ? 'avatar-yuki' : 'avatar-rin'}"></div>
                <p>${end.text}</p>
                <p style="opacity: 0.7; font-size: 0.9rem;">美子好感: ${gameState.miko} | 雪好感: ${gameState.yuki} | 凛好感: ${gameState.rin}</p>
                <button class="restart-btn" onclick="restart()">重新开始</button>
            `;
            
            overlay.classList.remove('hidden');
        }

        function restart() {
            gameState.day = 1;
            gameState.miko = 0;
            gameState.yuki = 0;
            gameState.rin = 0;
            gameState.currentEvent = null;
            gameState.flags = {};
            
            updateAffection();
            document.getElementById('day-info').textContent = '第 1 天';
            document.getElementById('ending-overlay').classList.add('hidden');
            document.getElementById('event-select').classList.remove('hidden');
            document.getElementById('game-content').classList.add('hidden');
        }

        document.getElementById('continue-btn').onclick = () => {
            gameState.currentStep++;
            renderEventStep();
        };

        updateAffection();
    </script>
<script src="../i18n.js"></script>
</body>
</html>
