<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 身体围度测量</title>
<meta name="description" content="记录身体各部位围度变化，追踪减脂增肌效果">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px;margin-bottom:2px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}.gr .st{text-align:center;padding:12px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.2rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.75rem;color:var(--text2);margin-top:4px}.gr .st .ch{font-size:.7rem;margin-top:2px}
.change-up{color:var(--danger)}.change-down{color:var(--success)}.change-same{color:var(--text2)}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--border);font-size:.85rem}th{color:var(--text2);font-weight:600;font-size:.8rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📐 身体围度测量">
<meta property="og:description" content="记录身体各部位围度变化，追踪减脂增肌效果">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/body-measurements-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📐 身体围度测量</h1><p>追踪身体变化，见证每一步进步</p></div>

<div class="cd"><h2>最新数据</h2><div class="gr" id="latestStats"></div></div>

<div class="cd"><h2>添加测量</h2>
<label>日期</label><input type="date" id="mDate">
<div class="fr">
<div><label>体重 (kg)</label><input type="number" id="mWeight" placeholder="如：70.5" step="0.1"></div>
<div><label>体脂率 (%)</label><input type="number" id="mFat" placeholder="如：18" step="0.1"></div>
</div>
<div class="fr">
<div><label>胸围 (cm)</label><input type="number" id="mChest" placeholder="如：95" step="0.1"></div>
<div><label>腰围 (cm)</label><input type="number" id="mWaist" placeholder="如：80" step="0.1"></div>
</div>
<div class="fr">
<div><label>臀围 (cm)</label><input type="number" id="mHip" placeholder="如：98" step="0.1"></div>
<div><label>上臂围 (cm)</label><input type="number" id="mArm" placeholder="如：32" step="0.1"></div>
</div>
<div class="fr">
<div><label>大腿围 (cm)</label><input type="number" id="mThigh" placeholder="如：52" step="0.1"></div>
<div><label>小腿围 (cm)</label><input type="number" id="mCalf" placeholder="如：36" step="0.1"></div>
</div>
<div class="bg"><button onclick="addMeasure()">📝 保存测量</button></div></div>

<div class="cd"><h2>测量历史</h2><div id="historyTable"></div></div>

<div class="cd"><h2>📈 趋势</h2><div id="trendArea"></div>
<div class="bg"><button class="dng" onclick="clearAll()">清空所有数据</button></div></div>
</div>
<script>
(function(){
var DB='body_meas_cn';
var records=JSON.parse(localStorage.getItem(DB)||'[]');
var fields=['weight','fat','chest','waist','hip','arm','thigh','calf'];
var labels={weight:'体重(kg)',fat:'体脂(%)',chest:'胸围(cm)',waist:'腰围(cm)',hip:'臀围(cm)',arm:'上臂(cm)',thigh:'大腿(cm)',calf:'小腿(cm)'};

(function initDate(){
var d=new Date();
document.getElementById('mDate').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
})();

window.addMeasure=function(){
var date=document.getElementById('mDate').value;
var entry={date:date,id:Date.now()};
var hasAny=false;
fields.forEach(function(f){
var v=parseFloat(document.getElementById('m'+f.charAt(0).toUpperCase()+f.slice(1)).value);
if(!isNaN(v)){entry[f]=v;hasAny=true;}
});
if(!hasAny){alert('请至少填写一项数据');return;}
records.push(entry);
records.sort(function(a,b){return a.date.localeCompare(b.date)});
localStorage.setItem(DB,JSON.stringify(records));
fields.forEach(function(f){document.getElementById('m'+f.charAt(0).toUpperCase()+f.slice(1)).value='';});
render();
};

window.delMeasure=function(id){records=records.filter(function(r){return r.id!==id});localStorage.setItem(DB,JSON.stringify(records));render();};
window.clearAll(){if(confirm('确定清空所有测量数据？')){records=[];localStorage.setItem(DB,JSON.stringify(records));render();}}

function render(){
var latest=records.length?records[records.length-1]:null;
var prev=records.length>1?records[records.length-2]:null;
var el=document.getElementById('latestStats');
if(!latest){el.innerHTML='<div class="es">暂无测量数据</div>';document.getElementById('historyTable').innerHTML='<div class="es">暂无历史数据</div>';document.getElementById('trendArea').innerHTML='<div class="es">暂无趋势数据</div>';return;}

el.innerHTML=fields.map(function(f){
if(latest[f]===undefined)return '';
var diff='';
if(prev&&prev[f]!==undefined){
var d=latest[f]-prev[f];
if(d>0)diff='<div class="ch change-up">↑ +'+d.toFixed(1)+'</div>';
else if(d<0)diff='<div class="ch change-down">↓ '+d.toFixed(1)+'</div>';
else diff='<div class="ch change-same">→ 不变</div>';
}
return '<div class="st"><div class="nm">'+latest[f]+'</div><div class="lb">'+labels[f]+'</div>'+diff+'</div>';
}).join('');

var hEl=document.getElementById('historyTable');
var html='<table><tr><th>日期</th>';
fields.forEach(function(f){html+='<th>'+labels[f].split('(')[0]+'</th>';});
html+='<th></th></tr>';
records.slice().reverse().slice(0,30).forEach(function(r){
html+='<tr><td>'+r.date+'</td>';
fields.forEach(function(f){html+='<td>'+(r[f]!==undefined?r[f]:'-')+'</td>';});
html+='<td><button class="dng" style="padding:2px 6px;font-size:.7rem" onclick="delMeasure('+r.id+')">✕</button></td></tr>';
});
html+='</table>';
hEl.innerHTML=html;

var tEl=document.getElementById('trendArea');
if(records.length<2){tEl.innerHTML='<div class="es">至少需要2条记录才能显示趋势</div>';return;}
var first=records[0];var last=records[records.length-1];
tEl.innerHTML=fields.map(function(f){
if(first[f]===undefined||last[f]===undefined)return '';
var diff=last[f]-first[f];
var pct=first[f]?(diff/first[f]*100).toFixed(1):0;
var cls=diff>0?'change-up':diff<0?'change-down':'change-same';
var arrow=diff>0?'↑':diff<0?'↓':'→';
return '<div class="li"><span>'+labels[f]+'</span><span class="'+cls+'">'+arrow+' '+Math.abs(diff).toFixed(1)+' ('+Math.abs(pct)+'%)</span></div>';
}).join('');
}
render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
