<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>名言生成器</title><meta name="description" content="随机生成名人名言，汲取智慧力量"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#f59e0b}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:20px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.options{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.options select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem}.btn{display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.btn:hover{opacity:.85}.btn-secondary{background:var(--border);color:var(--text)}.actions{display:flex;gap:8px;justify-content:center;margin-top:16px}.quote-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-top:16px;text-align:center}.quote-icon{font-size:2.5rem;margin-bottom:12px}.quote-text{font-size:1.15rem;line-height:1.8;color:var(--text);margin-bottom:16px;font-style:italic}.quote-author{font-size:.9rem;color:var(--accent);font-weight:600}.quote-source{font-size:.8rem;color:var(--text2);margin-top:4px}.quote-explain{font-size:.9rem;color:var(--text2);line-height:1.6;margin-top:12px;display:none}.quote-card.revealed .quote-explain{display:block}.reveal-btn{display:inline-block;margin-top:12px;padding:8px 20px;background:var(--accent);color:#000;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.reveal-btn:hover{opacity:.85}.quote-card.revealed .reveal-btn{display:none}.quote-tags{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}.quote-tag{padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:.75rem;color:var(--text2)}.counter{font-size:.8rem;color:var(--text2);margin-top:8px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}</style><meta name="robots" content="index, follow"><meta property="og:title" content="名言生成器"><meta property="og:description" content="随机生成名人名言"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>💎 名言生成器</h1><p class="sub">随机生成名人名言，汲取智慧力量</p>
<div class="card">
<div class="options">
<select id="category"><option value="all">全部</option><option value="life">人生</option><option value="success">成功</option><option value="wisdom">智慧</option><option value="love">爱情</option><option value="education">教育</option><option value="philosophy">哲学</option></select>
</div>
<div class="actions"><button class="btn" onclick="generate()">🎲 生成名言</button></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
(function(){
var quotes=[
{c:'life',text:'人生自古谁无死，留取丹心照汗青。',author:'文天祥',source:'过零丁洋',explain:'自古以来人终有一死，我要留下一颗赤诚的心照耀史册。表达了视死如归的英雄气概。'},
{c:'life',text:'天生我材必有用，千金散尽还复来。',author:'李白',source:'将进酒',explain:'上天赋予我才能必然有用处，千金散尽了还会再回来。表达了自信和豪迈的人生态度。'},
{c:'life',text:'不畏浮云遮望眼，自缘身在最高层。',author:'王安石',source:'登飞来峰',explain:'不怕浮云遮住远望的视线，只因为自己站在最高的地方。比喻掌握了正确的观点和方法，就不会被假象所迷惑。'},
{c:'life',text:'沉舟侧畔千帆过，病树前头万木春。',author:'刘禹锡',source:'酬乐天扬州初逢席上见赠',explain:'沉船旁边千帆竞发，病树前头万木争春。新事物必将取代旧事物。'},
{c:'life',text:'落红不是无情物，化作春泥更护花。',author:'龚自珍',source:'己亥杂诗',explain:'落花不是无情的东西，它化作春泥还能培育新花。比喻虽然离开了岗位，但仍然关心培养下一代。'},
{c:'success',text:'长风破浪会有时，直挂云帆济沧海。',author:'李白',source:'行路难',explain:'总有一天会乘长风破万里浪，高高挂起云帆，在沧海中勇往直前。表达了对未来的信心和对理想的追求。'},
{c:'success',text:'千磨万击还坚劲，任尔东西南北风。',author:'郑燮',source:'竹石',explain:'经过千万次磨练打击仍然坚劲，任凭你东南西北风。比喻意志坚定，不怕困难。'},
{c:'success',text:'路漫漫其修远兮，吾将上下而求索。',author:'屈原',source:'离骚',explain:'前面的道路漫长而遥远，我将百折不挠地去探索和追求。表达了追求理想的坚定决心。'},
{c:'success',text:'宝剑锋从磨砺出，梅花香自苦寒来。',author:'古今贤文',source:'警世贤文',explain:'宝剑的锋利是磨出来的，梅花的清香是经过严寒得来的。比喻成功需要经历艰苦的磨练。'},
{c:'success',text:'世上无难事，只要肯登攀。',author:'毛泽东',source:'水调歌头',explain:'世界上没有做不到的事，只要肯努力攀登就一定能成功。'},
{c:'wisdom',text:'学而不思则罔，思而不学则殆。',author:'孔子',source:'论语',explain:'只学习不思考就会迷惘，只思考不学习就会危险。学习和思考要结合起来。'},
{c:'wisdom',text:'知之为知之，不知为不知，是知也。',author:'孔子',source:'论语',explain:'知道就是知道，不知道就是不知道，这才是真正的智慧。'},
{c:'wisdom',text:'三人行，必有我师焉。',author:'孔子',source:'论语',explain:'几个人一起走路，其中必定有人可以做我的老师。要善于向别人学习。'},
{c:'wisdom',text:'纸上得来终觉浅，绝知此事要躬行。',author:'陆游',source:'冬夜读书示子聿',explain:'从书本上得到的知识终归是浅薄的，要真正理解就必须亲身实践。'},
{c:'wisdom',text:'博观而约取，厚积而薄发。',author:'苏轼',source:'稼说送张琥',explain:'广博地阅读而简约地吸取，深厚地积累而少量地释放。比喻积累深厚才能有所成就。'},
{c:'love',text:'两情若是久长时，又岂在朝朝暮暮。',author:'秦观',source:'鹊桥仙',explain:'只要两个人的感情长久，又何必在乎是否天天在一起呢。'},
{c:'love',text:'身无彩凤双飞翼，心有灵犀一点通。',author:'李商隐',source:'无题',explain:'身上没有彩凤那样的翅膀可以比翼双飞，但彼此的心却像灵犀一样息息相通。'},
{c:'love',text:'在天愿作比翼鸟，在地愿为连理枝。',author:'白居易',source:'长恨歌',explain:'在天上愿意做比翼双飞的鸟，在地上愿意做连根并蒂的枝。比喻夫妻恩爱，永不分离。'},
{c:'love',text:'曾经沧海难为水，除却巫山不是云。',author:'元稹',source:'离思五首',explain:'经历过无比深广的沧海，别处的水就看不上了。比喻经历过大世面的人，对一般的事物不放在眼里。'},
{c:'love',text:'春蚕到死丝方尽，蜡炬成灰泪始干。',author:'李商隐',source:'无题',explain:'春蚕到死才停止吐丝，蜡烛烧成灰烬才停止流泪。比喻为了理想和爱情可以奉献一切。'},
{c:'education',text:'业精于勤，荒于嬉；行成于思，毁于随。',author:'韩愈',source:'进学解',explain:'学业的精深在于勤奋，荒废在于嬉游；德行的成就在于思考，毁败在于因循随俗。'},
{c:'education',text:'玉不琢，不成器；人不学，不知道。',author:'礼记',source:'学记',explain:'玉不经过雕琢就不能成为器物，人不学习就不懂得道理。'},
{c:'education',text:'黑发不知勤学早，白首方悔读书迟。',author:'颜真卿',source:'劝学',explain:'年轻时不知道勤奋学习，到老了才后悔读书太迟。'},
{c:'education',text:'少壮不努力，老大徒伤悲。',author:'汉乐府',source:'长歌行',explain:'年轻力壮的时候不奋发图强，到了老年就只能白白地悲伤后悔了。'},
{c:'education',text:'读书破万卷，下笔如有神。',author:'杜甫',source:'奉赠韦左丞丈二十二韵',explain:'读书多了，写文章时就能得心应手，如有神助。'},
{c:'philosophy',text:'己所不欲，勿施于人。',author:'孔子',source:'论语',explain:'自己不想要的东西，不要强加给别人。这是儒家思想的核心之一。'},
{c:'philosophy',text:'知者不惑，仁者不忧，勇者不惧。',author:'孔子',source:'论语',explain:'聪明的人不会迷惑，仁德的人不会忧愁，勇敢的人不会畏惧。'},
{c:'philosophy',text:'天行健，君子以自强不息。',author:'周易',source:'乾卦',explain:'天道的运行刚健有力，君子应该效法天道，自觉地奋发向上，永不停息。'},
{c:'philosophy',text:'海纳百川，有容乃大。',author:'林则徐',source:'对联',explain:'大海能容纳百川，因为它有宽广的胸怀。比喻人要有宽广的胸怀。'},
{c:'philosophy',text:'穷则独善其身，达则兼济天下。',author:'孟子',source:'尽心上',explain:'不得志时就修身养性，得志时就要造福天下。'}
];
var count=0;
function generate(){
var cat=document.getElementById('category').value;
var filtered=cat==='all'?quotes:quotes.filter(function(q){return q.c===cat});
var quote=filtered[Math.floor(Math.random()*filtered.length)];
count++;
var catNames={life:'人生',success:'成功',wisdom:'智慧',love:'爱情',education:'教育',philosophy:'哲学'};
document.getElementById('result').innerHTML='<div class="quote-card" id="quoteCard"><div class="quote-icon">💎</div><div class="quote-text">"'+quote.text+'"</div><div class="quote-author">—— '+quote.author+'</div><div class="quote-source">'+quote.source+'</div><div class="quote-explain">'+quote.explain+'</div><button class="reveal-btn" onclick="document.getElementById(\'quoteCard\').classList.add(\'revealed\')">查看解读</button><div class="quote-tags"><span class="quote-tag">'+catNames[quote.c]+'</span><span class="quote-tag">'+quote.author+'</span></div><div class="counter">已生成 '+count+' 条名言</div></div>';
}
})();
</script></body></html>
