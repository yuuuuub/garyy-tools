<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时区转换器</title>
<meta name="description" content="时区转换器，支持全球时区查询、时间转换、夏令时检测和会议时间计算">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:800px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.result-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin:12px 0}
.result-item{padding:10px 0;border-bottom:1px solid var(--border)}
.result-item:last-child{border-bottom:none}
.swap-btn{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="时区转换器">
<meta property="og:description" content="时区转换器，支持全球时区查询、时间转换、夏令时检测和会议时间计算">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/time-zone-converter-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🌐 时区转换器';
const APP=document.getElementById('app');
let fromZone='Asia/Shanghai';
let toZone='America/New_York';
let inputDate='';
let inputTime='';
let savedPairs=JSON.parse(localStorage.getItem('tz_pairs')||'[]');

const zones=[
  {name:'北京/上海 (CST)',zone:'Asia/Shanghai',offset:'+8:00'},
  {name:'东京 (JST)',zone:'Asia/Tokyo',offset:'+9:00'},
  {name:'首尔 (KST)',zone:'Asia/Seoul',offset:'+9:00'},
  {name:'新加坡 (SGT)',zone:'Asia/Singapore',offset:'+8:00'},
  {name:'曼谷 (ICT)',zone:'Asia/Bangkok',offset:'+7:00'},
  {name:'迪拜 (GST)',zone:'Asia/Dubai',offset:'+4:00'},
  {name:'莫斯科 (MSK)',zone:'Europe/Moscow',offset:'+3:00'},
  {name:'伦敦 (GMT)',zone:'Europe/London',offset:'+0:00'},
  {name:'巴黎 (CET)',zone:'Europe/Paris',offset:'+1:00'},
  {name:'柏林 (CET)',zone:'Europe/Berlin',offset:'+1:00'},
  {name:'纽约 (EST)',zone:'America/New_York',offset:'-5:00'},
  {name:'洛杉矶 (PST)',zone:'America/Los_Angeles',offset:'-8:00'},
  {name:'芝加哥 (CST)',zone:'America/Chicago',offset:'-6:00'},
  {name:'多伦多 (EST)',zone:'America/Toronto',offset:'-5:00'},
  {name:'悉尼 (AEST)',zone:'Australia/Sydney',offset:'+10:00'},
  {name:'奥克兰 (NZST)',zone:'Pacific/Auckland',offset:'+12:00'},
  {name:'孟买 (IST)',zone:'Asia/Kolkata',offset:'+5:30'},
  {name:'圣保罗 (BRT)',zone:'America/Sao_Paulo',offset:'-3:00'},
  {name:'墨西哥城 (CST)',zone:'America/Mexico_City',offset:'-6:00'},
  {name:'雅加达 (WIB)',zone:'Asia/Jakarta',offset:'+7:00'},
  {name:'香港 (HKT)',zone:'Asia/Hong_Kong',offset:'+8:00'},
  {name:'台北 (CST)',zone:'Asia/Taipei',offset:'+8:00'},
  {name:'伊斯坦布尔 (TRT)',zone:'Europe/Istanbul',offset:'+3:00'},
];

function save(){localStorage.setItem('tz_pairs',JSON.stringify(savedPairs))}

function convertTime(){
  if(!inputDate||!inputTime) return null;
  let srcDate=new Date(`${inputDate}T${inputTime}:00`);
  let results=[];
  zones.forEach(z=>{
    try{
      let converted=new Date(srcDate.toLocaleString('en-US',{timeZone:z.zone}));
      let formatted=converted.toLocaleString('zh-CN',{timeZone:z.zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
      let hour=converted.getHours();
      let isWork=hour>=9&&hour<18;
      let isNight=hour>=22||hour<6;
      results.push({...z,formatted,hour,isWork,isNight});
    }catch(e){}
  });
  return results;
}

function getDiffHours(z1,z2){
  try{
    let now=new Date();
    let t1=new Date(now.toLocaleString('en-US',{timeZone:z1}));
    let t2=new Date(now.toLocaleString('en-US',{timeZone:z2}));
    return Math.round((t1-t2)/3600000*10)/10;
  }catch(e){return '--'}
}

function render(){
  let now=new Date();
  if(!inputDate) inputDate=now.toISOString().slice(0,10);
  if(!inputTime) inputTime=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  let h=`<h1>🌐 时区转换器</h1><p class="subtitle">全球时区查询 · 时间转换 · 夏令时检测 · 会议时间计算</p>`;

  h+=`<div class="card"><b>时间转换</b>
    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;margin-top:12px">
      <div><label>从时区</label><select id="fromZone" onchange="fromZone=this.value;doConvert()">${zones.map(z=>`<option value="${z.zone}" ${z.zone===fromZone?'selected':''}>${z.name}</option>`).join('')}</select></div>
      <div style="padding-bottom:10px"><button class="swap-btn" onclick="let t=fromZone;fromZone=toZone;toZone=t;render()">⇄</button></div>
      <div><label>到时区</label><select id="toZone" onchange="toZone=this.value;doConvert()">${zones.map(z=>`<option value="${z.zone}" ${z.zone===toZone?'selected':''}>${z.name}</option>`).join('')}</select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
      <div><label>日期</label><input type="date" id="inputDate" value="${inputDate}" onchange="inputDate=this.value;doConvert()"></div>
      <div><label>时间</label><input type="time" id="inputTime" value="${inputTime}" onchange="inputTime=this.value;doConvert()"></div>
    </div>
  </div>`;

  let results=convertTime();
  let diff=getDiffHours(fromZone,toZone);

  if(results){
    let fromResult=results.find(r=>r.zone===fromZone);
    let toResult=results.find(r=>r.zone===toZone);
    
    h+=`<div class="card" style="text-align:center">
      <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center">
        <div>
          <div style="font-size:.9rem;color:var(--text2)">${fromResult?.name||''}</div>
          <div style="font-size:2rem;font-weight:700;color:var(--accent)">${inputTime}</div>
          <div style="font-size:.85rem;color:var(--text2)">${inputDate}</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:2rem">→</div>
          <div style="font-size:.85rem;color:var(--text2)">相差 ${diff>0?'+':''}${diff}小时</div>
        </div>
        <div>
          <div style="font-size:.9rem;color:var(--text2)">${toResult?.name||''}</div>
          <div style="font-size:2rem;font-weight:700;color:var(--green)">${toResult?.formatted?.split(' ')[1]||'--:--'}</div>
          <div style="font-size:.85rem;color:var(--text2)">${toResult?.formatted?.split(' ')[0]||''}</div>
        </div>
      </div>
    </div>`;

    h+=`<div class="card"><b>全球时间一览</b><div class="result-box">`;
    results.sort((a,b)=>a.offset.localeCompare(b.offset));
    results.forEach(r=>{
      let badge=r.zone===fromZone?'badge-blue':r.zone===toZone?'badge-green':'';
      let timeBadge=r.isNight?'badge-red':r.isWork?'badge-green':'badge-yellow';
      h+=`<div class="result-item flex-between">
        <div><span style="font-size:1rem">${r.name.split('(')[0].trim()}</span> <span class="badge ${badge}">${r.zone===fromZone?'源':r.zone===toZone?'目标':''}</span></div>
        <div class="flex">
          <span style="font-weight:700;font-family:'Courier New',monospace">${r.formatted?.split(' ')[1]||'--:--'}</span>
          <span class="badge ${timeBadge}">${r.isNight?'夜间':r.isWork?'工作时间':'非工作'}</span>
        </div>
      </div>`;
    });
    h+=`</div></div>`;
  }

  h+=`<div class="card"><div class="flex-between"><b>常用转换对</b><button class="btn btn-sm" onclick="savePair()">保存当前</button></div>`;
  if(!savedPairs.length) h+=`<div class="empty">暂无保存的转换对</div>`;
  else{
    savedPairs.forEach((p,i)=>{
      let fromName=zones.find(z=>z.zone===p.from)?.name.split('(')[0].trim()||p.from;
      let toName=zones.find(z=>z.zone===p.to)?.name.split('(')[0].trim()||p.to;
      h+=`<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border)">
        <span>${fromName} → ${toName}</span>
        <div class="flex">
          <button class="btn btn-sm" onclick="fromZone='${p.from}';toZone='${p.to}';render()">使用</button>
          <button class="btn btn-sm btn-danger" onclick="delPair(${i})">删除</button>
        </div>
      </div>`;
    });
  }
  h+=`</div>`;

  h+=`<div class="card"><b>时区信息</b><div style="margin-top:12px">
    <div class="result-item"><span style="color:var(--text2)">当前系统时区：</span><b>${Intl.DateTimeFormat().resolvedOptions().timeZone}</b></div>
    <div class="result-item"><span style="color:var(--text2)">UTC偏移：</span><b>${now.getTimezoneOffset()/-60}小时</b></div>
    <div class="result-item"><span style="color:var(--text2)">夏令时：</span><b>${now.toLocaleString('en',{timeZoneName:'short'}).includes('DT')?'是':'否'}</b></div>
  </div></div>`;

  APP.innerHTML=h;
}

function doConvert(){render()}
function savePair(){
  if(!savedPairs.some(p=>p.from===fromZone&&p.to===toZone)){
    savedPairs.push({from:fromZone,to:toZone});
    save();render();
  }
}
function delPair(idx){savedPairs.splice(idx,1);save();render()}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
