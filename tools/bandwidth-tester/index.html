<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>带宽测试</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--green:#238636;--red:#da3633;--yellow:#9e6a03;--dim:#8b949e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:20px}
.container{max-width:800px;margin:0 auto;text-align:center}
h1{font-size:1.8rem;margin-bottom:8px}
.subtitle{color:var(--dim);margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;margin-bottom:16px}
.big-number{font-size:3rem;font-weight:700;color:var(--accent);margin:12px 0}
.big-label{font-size:1rem;color:var(--dim);margin-bottom:16px}
button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:12px 32px;font-size:15px;cursor:pointer;font-weight:600;transition:opacity .2s}
button:hover{opacity:.85}
button:disabled{opacity:.5;cursor:not-allowed}
.progress{width:100%;height:6px;background:var(--border);border-radius:3px;margin:16px 0;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;width:0%;transition:width .3s}
.chart{width:100%;height:250px;background:var(--bg);border:1px solid var(--border);border-radius:6px;position:relative;overflow:hidden}
.chart canvas{width:100%;height:100%}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;text-align:left}
.result-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px}
.result-label{font-size:11px;color:var(--dim);text-transform:uppercase}
.result-value{font-size:1.3rem;font-weight:700;margin-top:4px}
.legend{display:flex;justify-content:center;gap:20px;margin-top:8px;font-size:12px;color:var(--dim)}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.status{color:var(--dim);font-size:13px;margin-top:8px}
.test-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);text-align:left}
.test-row:last-child{border-bottom:none}
.test-size{width:80px;font-size:13px;color:var(--dim);flex-shrink:0}
.test-bar-wrap{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.test-bar{height:100%;border-radius:4px;transition:width .5s}
.test-speed{width:100px;text-align:right;font-size:13px;font-weight:600;flex-shrink:0}
.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}
@media(max-width:600px){.results-grid{grid-template-columns:1fr}.big-number{font-size:2rem}}
</style>
</head>
<body>
<div class="container">
<h1>📊 带宽测试</h1>
<p class="subtitle">测量不同大小负载下的网络吞吐量</p>

<div class="card">
<div class="big-number" id="bandwidthValue">--</div>
<div class="big-label">Mbps</div>
<button id="startBtn" onclick="startTest()">开始测试</button>
<div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="status" id="status"></div>
</div>

<div class="card" id="chartCard" style="display:none">
<h3 style="margin-bottom:8px;font-size:14px">带宽曲线</h3>
<div class="chart"><canvas id="chart"></canvas></div>
<div class="legend">
<span><span class="legend-dot" style="background:var(--accent)"></span>实际吞吐量</span>
<span><span class="legend-dot" style="background:var(--dim)"></span>理论最大值</span>
</div>
</div>

<div class="card" id="detailsCard" style="display:none">
<h3 style="margin-bottom:12px;font-size:14px">各负载详情</h3>
<div id="testRows"></div>
<div class="results-grid" id="resultsGrid" style="margin-top:16px"></div>
</div>
</div>

<script>
const testPayloads=[
{label:'10 KB',bytes:10*1024},
{label:'50 KB',bytes:50*1024},
{label:'100 KB',bytes:100*1024},
{label:'500 KB',bytes:500*1024},
{label:'1 MB',bytes:1024*1024},
{label:'2 MB',bytes:2*1024*1024},
{label:'5 MB',bytes:5*1024*1024}
];
let testing=false;
async function startTest(){
if(testing)return;
testing=true;
const btn=document.getElementById('startBtn');
btn.disabled=true;
btn.textContent='测试中...';
document.getElementById('progress').style.display='block';
document.getElementById('chartCard').style.display='block';
document.getElementById('detailsCard').style.display='block';
document.getElementById('testRows').innerHTML='';
const results=[];
const maxBandwidth=testPayloads[testPayloads.length-1].bytes*8/1000000;
for(let i=0;i<testPayloads.length;i++){
const p=testPayloads[i];
document.getElementById('status').textContent=`正在测试 ${p.label} 负载...`;
document.getElementById('progressBar').width=((i+1)/testPayloads.length*100)+'%';
try{
const start=performance.now();
const resp=await fetch(`https://speed.cloudflare.com/__down?bytes=${p.bytes}&_=${Date.now()}`,{cache:'no-store'});
const reader=resp.body.getReader();
let received=0;
while(true){
const{done,value}=await reader.read();
if(done)break;
received+=value.length;
}
const elapsed=(performance.now()-start)/1000;
const bps=(received*8)/elapsed;
const mbps=bps/1000000;
results.push({label:p.label,bytes:p.bytes,mbps:mbps,elapsed:elapsed});
document.getElementById('bandwidthValue').textContent=mbps.toFixed(2);
document.getElementById('bandwidthValue').className='big-number '+(mbps>=50?'good':mbps>=10?'':'warn');
}catch(e){
results.push({label:p.label,bytes:p.bytes,mbps:0,elapsed:0,error:true});
}
}
const validResults=results.filter(r=>!r.error);
const avgBw=validResults.length>0?validResults.reduce((a,r)=>a+r.mbps,0)/validResults.length:0;
document.getElementById('bandwidthValue').textContent=avgBw.toFixed(2);
document.getElementById('bandwidthValue').className='big-number '+(avgBw>=50?'good':avgBw>=10?'':'warn');
let rowsHtml='';
results.forEach(r=>{
const pct=Math.min((r.mbps/avgBw)*100,100);
const cls=r.error?'bad':r.mbps>=avgBw*0.8?'good':r.mbps>=avgBw*0.5?'warn':'bad';
rowsHtml+=`<div class="test-row"><span class="test-size">${r.label}</span><div class="test-bar-wrap"><div class="test-bar" style="width:${pct}%;background:${r.error?'var(--red)':r.mbps>=avgBw*0.8?'var(--green)':r.mbps>=avgBw*0.5?'var(--yellow)':'var(--red)'}"></div></div><span class="test-speed ${cls}">${r.error?'失败':r.mbps.toFixed(2)+' Mbps'}</span></div>`;
});
document.getElementById('testRows').innerHTML=rowsHtml;
const minBw=Math.min(...validResults.map(r=>r.mbps));
const maxBw=Math.max(...validResults.map(r=>r.mbps));
const totalTime=results.reduce((a,r)=>a+r.elapsed,0);
document.getElementById('resultsGrid').innerHTML=`
<div class="result-box"><div class="result-label">平均带宽</div><div class="result-value ${avgBw>=50?'good':avgBw>=10?'':'warn'}">${avgBw.toFixed(2)} Mbps</div></div>
<div class="result-box"><div class="result-label">最低带宽</div><div class="result-value">${minBw.toFixed(2)} Mbps</div></div>
<div class="result-box"><div class="result-label">最高带宽</div><div class="result-value">${maxBw.toFixed(2)} Mbps</div></div>
<div class="result-box"><div class="result-label">总传输量</div><div class="result-value">${formatSize(results.reduce((a,r)=>a+r.bytes,0))}</div></div>
<div class="result-box"><div class="result-label">总耗时</div><div class="result-value">${totalTime.toFixed(2)}s</div></div>
<div class="result-box"><div class="result-label">测试项</div><div class="result-value">${validResults.length}/${results.length}</div></div>`;
drawChart(results,avgBw);
document.getElementById('progressBar').width='100%';
document.getElementById('status').textContent='测试完成！';
btn.disabled=false;
btn.textContent='重新测试';
testing=false;
}
function drawChart(results,avgBw){
const canvas=document.getElementById('chart');
const ctx=canvas.getContext('2d');
const rect=canvas.parentElement.getBoundingClientRect();
canvas.width=rect.width*2;
canvas.height=rect.height*2;
ctx.scale(2,2);
const w=rect.width;
const h=rect.height;
const pad=40;
const valid=results.filter(r=>!r.error);
if(valid.length===0)return;
const maxVal=Math.max(...valid.map(r=>r.mbps))*1.2||100;
const barW=(w-pad*2)/valid.length*0.6;
const gap=(w-pad*2)/valid.length;
ctx.clearRect(0,0,w,h);
ctx.strokeStyle='#30363d';ctx.lineWidth=0.5;
for(let i=0;i<=4;i++){
const y=pad+((h-pad*2)/4)*i;
ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();
ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';ctx.textAlign='right';
ctx.fillText((maxVal-(maxVal/4)*i).toFixed(0),pad-4,y+4);
}
ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';ctx.textAlign='center';
valid.forEach((r,i)=>{
const x=pad+i*gap+gap/2;
ctx.fillText(r.label,x,h-pad+16);
});
valid.forEach((r,i)=>{
const x=pad+i*gap+(gap-barW)/2;
const barH=(r.mbps/maxVal)*(h-pad*2);
const y=h-pad-barH;
const gradient=ctx.createLinearGradient(0,y,0,h-pad);
gradient.addColorStop(0,r.mbps>=avgBw*0.8?'#238636':r.mbps>=avgBw*0.5?'#9e6a03':'#da3636');
gradient.addColorStop(1,r.mbps>=avgBw*0.8?'#23863644':r.mbps>=avgBw*0.5?'#9e6a0344':'#da363644');
ctx.fillStyle=gradient;
ctx.fillRect(x,y,barW,barH);
ctx.fillStyle='#e6edf3';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
ctx.fillText(r.mbps.toFixed(1),x+barW/2,y-6);
});
}
function formatSize(bytes){
if(bytes===0)return'0 B';
const k=1024;
const sizes=['B','KB','MB','GB'];
const i=Math.floor(Math.log(bytes)/Math.log(k));
return parseFloat((bytes/Math.pow(k,i)).toFixed(1))+' '+sizes[i];
}
</script>
</body>
</html>
