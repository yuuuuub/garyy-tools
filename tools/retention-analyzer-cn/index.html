<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔁 留存分析器</title>
<meta property="og:title" content="🔁 留存分析器">
<meta property="og:description" content="🔁 留存分析器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="用户留存分析工具，计算日/周/月留存率，绘制留存曲线，识别留存模式">
<meta name="robots" content="index, follow">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:20px}
.container{max-width:1000px;margin:0 auto}
h1{color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
label{display:block;font-weight:600;margin-bottom:4px;font-size:13px;color:var(--text2)}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
textarea{resize:vertical;min-height:60px;font-family:monospace;font-size:13px}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-orange{background:var(--orange)}
.theme-toggle{position:fixed;top:20px;right:20px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:6px;cursor:pointer;z-index:100}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-box{text-align:center;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.stat-box .num{font-size:22px;font-weight:700;color:var(--blue)}
.stat-box .label{font-size:11px;color:var(--text2);margin-top:4px}
.retention-bar{display:flex;align-items:center;gap:8px;margin:6px 0}
.retention-bar .label{width:60px;font-size:12px;color:var(--text2);text-align:right;flex-shrink:0}
.retention-bar .bar-bg{flex:1;height:24px;background:var(--border);border-radius:4px;overflow:hidden}
.retention-bar .bar-fill{height:100%;border-radius:4px;transition:width .3s}
.retention-bar .value{width:50px;font-size:12px;font-weight:600;flex-shrink:0}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{font-weight:600;color:var(--text2);font-size:12px}
.retention-curve{position:relative;height:220px;margin:16px 0}
.retention-curve canvas{width:100%;height:100%}
.insight-box{padding:12px;border-radius:6px;margin-top:8px;font-size:13px}
.insight-good{background:rgba(26,127,55,.1);border:1px solid var(--green)}
.insight-warn{background:rgba(188,76,0,.1);border:1px solid var(--orange)}
.insight-bad{background:rgba(207,34,46,.1);border:1px solid var(--red)}
.metric-tabs{display:flex;gap:4px;margin-bottom:12px}
.metric-tabs button{background:var(--bg);color:var(--text);border:1px solid var(--border);font-size:13px;padding:6px 14px}
.metric-tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>🔁 留存分析器</h1>

<div class="card">
<h3 style="margin-bottom:12px">输入留存数据</h3>
<div class="grid-2">
<div>
<label>数据格式说明</label>
<p style="font-size:12px;color:var(--text2);margin-bottom:8px">每行一个时间点，格式：时间标签,活跃用户数,新增用户数</p>
<textarea id="rawData" rows="8" placeholder="Day0,10000,10000
Day1,4500,0
Day2,3200,0
Day3,2800,0
Day7,2100,0
Day14,1800,0
Day30,1500,0
Day60,1200,0
Day90,1000,0"></textarea>
</div>
<div>
<label>留存计算方式</label>
<select id="retentionType" style="margin-bottom:8px">
<option value="classic">经典留存 (Day N活跃/Day0新增)</option>
<option value="rolling">滚动留存 (N日内活跃)</option>
</select>
<label>产品类型</label>
<select id="productType" style="margin-bottom:8px">
<option value="saas">SaaS / 工具类</option>
<option value="ecommerce">电商类</option>
<option value="social">社交类</option>
<option value="content">内容类</option>
<option value="gaming">游戏类</option>
</select>
<div style="margin-top:12px;display:flex;gap:8px">
<button onclick="analyzeRetention()">📊 分析留存</button>
<button class="btn-green" onclick="loadSample()">📋 加载示例</button>
<button class="btn-orange" onclick="loadSampleData()">📈 加载SaaS示例</button>
</div>
</div>
</div>
</div>

<div id="statsArea"></div>

<div id="chartArea" class="card" style="display:none">
<h3 style="margin-bottom:12px">留存曲线</h3>
<div class="retention-curve"><canvas id="retentionCanvas"></canvas></div>
</div>

<div id="barArea" class="card" style="display:none">
<h3 style="margin-bottom:12px">留存率柱状图</h3>
<div id="retentionBars"></div>
</div>

<div id="insightArea" class="card" style="display:none">
<h3 style="margin-bottom:12px">分析洞察</h3>
<div id="insights"></div>
</div>

<div id="benchmarkArea" class="card" style="display:none">
<h3 style="margin-bottom:12px">行业基准对比</h3>
<div id="benchmarks"></div>
</div>

<div id="historyArea" class="card">
<h3 style="margin-bottom:12px">分析历史</h3>
<div id="historyList"></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var history=JSON.parse(localStorage.getItem('retention_history')||'[]');

var benchmarks={
  saas:{D1:0.4,D7:0.2,D30:0.1,D90:0.05,label:'SaaS'},
  ecommerce:{D1:0.3,D7:0.15,D30:0.08,D90:0.03,label:'电商'},
  social:{D1:0.5,D7:0.35,D30:0.2,D90:0.1,label:'社交'},
  content:{D1:0.35,D7:0.18,D30:0.1,D90:0.04,label:'内容'},
  gaming:{D1:0.3,D7:0.12,D30:0.05,D90:0.02,label:'游戏'}
};

function parseData(text){
  var lines=text.trim().split('\n');
  var data=[];
  lines.forEach(function(line){
    var parts=line.split(',').map(s=>s.trim());
    if(parts.length>=2){
      data.push({label:parts[0],active:parseInt(parts[1])||0,added:parseInt(parts[2])||0});
    }
  });
  return data;
}

function loadSample(){
  document.getElementById('rawData').value='Day0,10000,10000\nDay1,4500,0\nDay2,3200,0\nDay3,2800,0\nDay7,2100,0\nDay14,1800,0\nDay30,1500,0\nDay60,1200,0\nDay90,1000,0';
}

function loadSampleData(){
  document.getElementById('rawData').value='Day0,8000,8000\nDay1,5600,0\nDay3,4800,0\nDay7,3600,0\nDay14,2800,0\nDay30,2200,0\nDay60,1600,0\nDay90,1200,0\nDay180,800,0';
}

function analyzeRetention(){
  var rawText=document.getElementById('rawData').value;
  var data=parseData(rawText);
  if(data.length<2){alert('请至少输入2行数据');return;}

  var type=document.getElementById('retentionType').value;
  var productType=document.getElementById('productType').value;
  var baseUsers=data[0].active;
  var retentionData=data.map(function(d,i){
    var ret=type==='rolling'?(d.active/baseUsers):d.active/baseUsers;
    return{label:d.label,active:d.active,retention:ret,period:i};
  });

  var d1=retentionData.find(d=>d.label.includes('1'))||retentionData[1];
  var d7=retentionData.find(d=>d.label.includes('7'))||retentionData[Math.min(3,retentionData.length-1)];
  var d30=retentionData.find(d=>d.label.includes('30'))||retentionData[Math.min(5,retentionData.length-1)];
  var halfLife=-1;
  for(var i=0;i<retentionData.length;i++){
    if(retentionData[i].retention<=0.5){halfLife=i;break;}
  }

  var html='<div class="stat-row"><div class="stat-box"><div class="num">'+baseUsers.toLocaleString()+'</div><div class="label">初始用户</div></div><div class="stat-box"><div class="num" style="color:var(--green)">'+((d1?d1.retention:0)*100).toFixed(1)+'%</div><div class="label">Day1留存</div></div><div class="stat-box"><div class="num" style="color:var(--blue)">'+((d30?d30.retention:0)*100).toFixed(1)+'%</div><div class="label">Day30留存</div></div><div class="stat-box"><div class="num" style="color:var(--purple)">'+(halfLife>0?data[halfLife].label:'N/A')+'</div><div class="label">半衰期</div></div></div>';
  document.getElementById('statsArea').innerHTML=html;

  document.getElementById('chartArea').style.display='block';
  drawCurve(retentionData);

  document.getElementById('barArea').style.display='block';
  var barsHTML='';
  retentionData.forEach(function(d,i){
    var color=d.retention>0.3?'var(--green)':d.retention>0.1?'var(--blue)':d.retention>0.05?'var(--orange)':'var(--red)';
    barsHTML+='<div class="retention-bar"><span class="label">'+d.label+'</span><div class="bar-bg"><div class="bar-fill" style="width:'+Math.max(2,d.retention*100)+'%;background:'+color+'"></div></div><span class="value" style="color:'+color+'">'+(d.retention*100).toFixed(1)+'%</span></div>';
  });
  document.getElementById('retentionBars').innerHTML=barsHTML;

  var bm=benchmarks[productType];
  var bmHTML='<div class="grid-2"><div><h4>您的产品</h4><p>D1: '+((d1?d1.retention:0)*100).toFixed(1)+'%</p><p>D7: '+((d7?d7.retention:0)*100).toFixed(1)+'%</p><p>D30: '+((d30?d30.retention:0)*100).toFixed(1)+'%</p></div><div><h4>'+bm.label+'行业基准</h4><p>D1: '+(bm.D1*100)+'%</p><p>D7: '+(bm.D7*100)+'%</p><p>D30: '+(bm.D30*100)+'%</p></div></div>';

  var compD1=((d1?d1.retention:0)-bm.D1)*100;
  var compD30=((d30?d30.retention:0)-bm.D30)*100;
  bmHTML+='<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:6px">';
  bmHTML+='<p>D1 vs基准: <strong style="color:'+(compD1>=0?'var(--green)':'var(--red)')+'">'+(compD1>=0?'+':'')+compD1.toFixed(1)+'%</strong></p>';
  bmHTML+='<p>D30 vs基准: <strong style="color:'+(compD30>=0?'var(--green)':'var(--red)')+'">'+(compD30>=0?'+':'')+compD30.toFixed(1)+'%</strong></p></div>';
  document.getElementById('benchmarkArea').style.display='block';
  document.getElementById('benchmarks').innerHTML=bmHTML;

  var insightHTML='';
  var d1Rate=d1?d1.retention:0;
  if(d1Rate>=0.4)insightHTML+='<div class="insight-box insight-good">✅ Day1留存优秀 ('+(d1Rate*100).toFixed(1)+'%)，用户首次体验良好</div>';
  else if(d1Rate>=0.25)insightHTML+='<div class="insight-box insight-warn">⚠️ Day1留存中等 ('+(d1Rate*100).toFixed(1)+'%)，可优化新手引导</div>';
  else insightHTML+='<div class="insight-box insight-bad">🔴 Day1留存偏低 ('+(d1Rate*100).toFixed(1)+'%)，需重点优化激活流程</div>';

  var dropD1toD7=d1&&d7?(d1.retention-d7.retention)/d1.retention*100:0;
  if(dropD1toD7>60)insightHTML+='<div class="insight-box insight-bad" style="margin-top:8px">⚠️ Day1到Day7流失'+dropD1toD7.toFixed(0)+'%，需加强Day2-7的用户触达</div>';

  var d30Rate=d30?d30.retention:0;
  if(d30Rate>=0.15)insightHTML+='<div class="insight-box insight-good" style="margin-top:8px">✅ 长期留存良好，产品价值得到验证</div>';
  else if(d30Rate<0.05)insightHTML+='<div class="insight-box insight-bad" style="margin-top:8px">🔴 长期留存偏低，需增强产品粘性和用户习惯养成</div>';

  document.getElementById('insightArea').style.display='block';
  document.getElementById('insights').innerHTML=insightHTML;

  history.unshift({date:new Date().toLocaleDateString('zh-CN'),base:baseUsers,d1:d1Rate,d30:d30Rate,productType:productType});
  if(history.length>10)history.pop();
  localStorage.setItem('retention_history',JSON.stringify(history));
  renderHistory();
}

function drawCurve(data){
  var canvas=document.getElementById('retentionCanvas');
  var ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth;canvas.height=220;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  var w=canvas.width,h=canvas.height,pad=50;

  ctx.strokeStyle='#d0d7de';ctx.lineWidth=1;
  for(var i=0;i<=4;i++){
    var y=pad+(h-2*pad)*i/4;
    ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-10,y);ctx.stroke();
    ctx.fillStyle='#656d76';ctx.font='11px sans-serif';ctx.textAlign='right';
    ctx.fillText((100-i*25)+'%',pad-6,y+4);
  }

  ctx.strokeStyle='#0969da';ctx.lineWidth=2.5;ctx.beginPath();
  var points=[];
  data.forEach(function(d,i){
    var x=pad+i*(w-pad-10)/(data.length-1||1);
    var y=pad+(1-d.retention)*(h-2*pad);
    points.push({x:x,y:y});
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();

  points.forEach(function(p,i){
    ctx.fillStyle='#0969da';ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fill();
  });

  ctx.fillStyle='#656d76';ctx.font='11px sans-serif';ctx.textAlign='center';
  data.forEach(function(d,i){
    var x=pad+i*(w-pad-10)/(data.length-1||1);
    ctx.fillText(d.label,x,h-8);
  });
}

function renderHistory(){
  document.getElementById('historyList').innerHTML=history.length?history.map(function(h){
    return '<div style="padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between"><div><strong>'+h.date+'</strong> <span style="font-size:12px;color:var(--text2)">'+h.productType+' · 初始'+h.base.toLocaleString()+'用户</span></div><div style="font-size:13px">D1: '+(h.d1*100).toFixed(1)+'% · D30: '+(h.d30*100).toFixed(1)+'%</div></div>';
  }).join(''):'<p style="color:var(--text2);font-size:13px">暂无历史记录</p>';
}

function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
renderHistory();
</script>
</body>
</html>
