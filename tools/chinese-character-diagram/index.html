<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字图解</title><meta name="description" content="汉字图解 - 在线查看汉字图解"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.diagram-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.diagram-main{font-size:6rem;font-weight:700;color:var(--blue);margin-bottom:16px}.diagram-parts{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:16px 0}.diagram-part{padding:12px;background:var(--card);border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s}.diagram-part:hover{border-color:var(--blue);transform:translateY(-2px)}.diagram-part.selected{border-color:var(--green);background:rgba(35,134,54,.1)}.diagram-part-char{font-size:2rem;font-weight:700;color:var(--blue)}.diagram-part-pinyin{font-size:.85rem;color:var(--text2);margin-top:4px}.diagram-part-meaning{font-size:.8rem;color:var(--text);margin-top:4px}</style><meta property="og:title" content="汉字图解"><meta property="og:description" content="汉字图解 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"></head><body>
<div class="container"><h1>🎨 汉字图解</h1><p class="sub">在线查看汉字图解</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="showDiagram()">
</div>
<button class="btn" onclick="showDiagram()">查看图解</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var diagramData={
  '明':{parts:[{char:'日',pinyin:'rì',meaning:'太阳'},{char:'月',pinyin:'yuè',meaning:'月亮'}],explanation:'日和月放在一起表示光明，因为太阳和月亮是最亮的光源。'},
  '休':{parts:[{char:'人',pinyin:'rén',meaning:'人类'},{char:'木',pinyin:'mù',meaning:'树木'}],explanation:'人靠在树旁表示休息，形象地表达了休息的概念。'},
  '林':{parts:[{char:'木',pinyin:'mù',meaning:'树木'},{char:'木',pinyin:'mù',meaning:'树木'}],explanation:'两棵树在一起表示树林，多棵树聚集形成树林。'},
  '森':{parts:[{char:'木',pinyin:'mù',meaning:'树木'},{char:'木',pinyin:'mù',meaning:'树木'},{char:'木',pinyin:'mù',meaning:'树木'}],explanation:'三棵树在一起表示森林，更多树木形成更大的森林。'},
  '从':{parts:[{char:'人',pinyin:'rén',meaning:'人类'},{char:'人',pinyin:'rén',meaning:'人类'}],explanation:'两个人在一起表示跟随，一个人跟着另一个人。'},
  '众':{parts:[{char:'人',pinyin:'rén',meaning:'人类'},{char:'人',pinyin:'rén',meaning:'人类'},{char:'人',pinyin:'rén',meaning:'人类'}],explanation:'三个人在一起表示众人，很多人聚集形成群体。'},
  '磊':{parts:[{char:'石',pinyin:'shí',meaning:'石头'},{char:'石',pinyin:'shí',meaning:'石头'},{char:'石',pinyin:'shí',meaning:'石头'}],explanation:'三块石头在一起表示光明磊落，像石头一样坚实可靠。'},
  '鑫':{parts:[{char:'金',pinyin:'jīn',meaning:'金属'},{char:'金',pinyin:'jīn',meaning:'金属'},{char:'金',pinyin:'jīn',meaning:'金属'}],explanation:'三块金在一起表示财富兴盛，金多表示富有。'},
  '淼':{parts:[{char:'水',pinyin:'shuǐ',meaning:'水'},{char:'水',pinyin:'shuǐ',meaning:'水'},{char:'水',pinyin:'shuǐ',meaning:'水'}],explanation:'三滴水在一起表示水势浩大，形容水面广阔。'},
  '焱':{parts:[{char:'火',pinyin:'huǒ',meaning:'火'},{char:'火',pinyin:'huǒ',meaning:'火'},{char:'火',pinyin:'huǒ',meaning:'火'}],explanation:'三把火在一起表示火花，形容火焰旺盛。'},
  '垚':{parts:[{char:'土',pinyin:'tǔ',meaning:'土'},{char:'土',pinyin:'tǔ',meaning:'土'},{char:'土',pinyin:'tǔ',meaning:'土'}],explanation:'三块土在一起表示山高，土堆得很高形成山。'},
  '犇':{parts:[{char:'牛',pinyin:'niú',meaning:'牛'},{char:'牛',pinyin:'niú',meaning:'牛'},{char:'牛',pinyin:'niú',meaning:'牛'}],explanation:'三头牛在一起表示奔跑，牛群奔跑气势磅礴。'},
  '骉':{parts:[{char:'马',pinyin:'mǎ',meaning:'马'},{char:'马',pinyin:'mǎ',meaning:'马'},{char:'马',pinyin:'mǎ',meaning:'马'}],explanation:'三匹马在一起表示奔跑，马群奔跑速度很快。'},
  '鱻':{parts:[{char:'鱼',pinyin:'yú',meaning:'鱼'},{char:'鱼',pinyin:'yú',meaning:'鱼'},{char:'鱼',pinyin:'yú',meaning:'鱼'}],explanation:'三条鱼在一起表示新鲜，鱼多表示新鲜。'},
  '猋':{parts:[{char:'犬',pinyin:'quǎn',meaning:'狗'},{char:'犬',pinyin:'quǎn',meaning:'狗'},{char:'犬',pinyin:'quǎn',meaning:'狗'}],explanation:'三只狗在一起表示奔跑，狗群奔跑速度很快。'},
  '麤':{parts:[{char:'鹿',pinyin:'lù',meaning:'鹿'},{char:'鹿',pinyin:'lù',meaning:'鹿'},{char:'鹿',pinyin:'lù',meaning:'鹿'}],explanation:'三只鹿在一起表示粗鲁，鹿群奔跑显得粗鲁。'},
  '品':{parts:[{char:'口',pinyin:'kǒu',meaning:'嘴'},{char:'口',pinyin:'kǒu',meaning:'嘴'},{char:'口',pinyin:'kǒu',meaning:'嘴'}],explanation:'三个口在一起表示品尝，用嘴来品尝味道。'},
  '晶':{parts:[{char:'日',pinyin:'rì',meaning:'太阳'},{char:'日',pinyin:'rì',meaning:'太阳'},{char:'日',pinyin:'rì',meaning:'太阳'}],explanation:'三个太阳在一起表示光明，非常明亮。'},
  '想':{parts:[{char:'木',pinyin:'mù',meaning:'树木'},{char:'目',pinyin:'mù',meaning:'眼睛'},{char:'心',pinyin:'xīn',meaning:'心脏'}],explanation:'木和目表示看，心表示思考，看着树木思考。'},
  '思':{parts:[{char:'田',pinyin:'tián',meaning:'田地'},{char:'心',pinyin:'xīn',meaning:'心脏'}],explanation:'田和心在一起表示思考，在田地里用心思考。'},
  '念':{parts:[{char:'今',pinyin:'jīn',meaning:'现在'},{char:'心',pinyin:'xīn',meaning:'心脏'}],explanation:'今表示时间，心表示思念，现在的思念。'},
  '忍':{parts:[{char:'刃',pinyin:'rèn',meaning:'刀刃'},{char:'心',pinyin:'xīn',meaning:'心脏'}],explanation:'刀刃在心上表示忍耐，像刀割一样需要忍耐。'},
  '忘':{parts:[{char:'亡',pinyin:'wáng',meaning:'丢失'},{char:'心',pinyin:'xīn',meaning:'心脏'}],explanation:'心丢失了表示忘记，心中的记忆丢失了。'},
  '忙':{parts:[{char:'心',pinyin:'xīn',meaning:'心脏'},{char:'亡',pinyin:'wáng',meaning:'丢失'}],explanation:'心丢失了表示忙碌，心里忙着其他事情。'},
  '怕':{parts:[{char:'心',pinyin:'xīn',meaning:'心脏'},{char:'白',pinyin:'bái',meaning:'白色'}],explanation:'心表示情感，白表示声音，心里害怕脸色发白。'},
  '惊':{parts:[{char:'心',pinyin:'xīn',meaning:'心脏'},{char:'京',pinyin:'jīng',meaning:'京城'}],explanation:'心表示情感，京表示声音，心里惊讶。'},
  '情':{parts:[{char:'心',pinyin:'xīn',meaning:'心脏'},{char:'青',pinyin:'qīng',meaning:'青色'}],explanation:'心表示情感，青表示声音，表达情感。'},
  '性':{parts:[{char:'心',pinyin:'xīn',meaning:'心脏'},{char:'生',pinyin:'shēng',meaning:'生命'}],explanation:'心表示情感，生表示声音，人的本性。'},
  '悟':{parts:[{char:'心',pinyin:'xīn',meaning:'心脏'},{char:'吾',pinyin:'wú',meaning:'我'}],explanation:'心表示思考，吾表示声音，我心中的领悟。'},
  '快':{parts:[{char:'心',pinyin:'xīn',meaning:'心脏'},{char:'夬',pinyin:'guài',meaning:'果断'}],explanation:'心表示情感，夬表示声音，心里快乐。'},
  '慢':{parts:[{char:'心',pinyin:'xīn',meaning:'心脏'},{char:'曼',pinyin:'màn',meaning:'缓慢'}],explanation:'心表示情感，曼表示声音，心里缓慢。'},
  '悲':{parts:[{char:'非',pinyin:'fēi',meaning:'不是'},{char:'心',pinyin:'xīn',meaning:'心脏'}],explanation:'心不在了一半表示悲伤，心里不完整。'},
  '愁':{parts:[{char:'秋',pinyin:'qiū',meaning:'秋天'},{char:'心',pinyin:'xīn',meaning:'心脏'}],explanation:'秋天的心表示忧愁，秋天容易让人忧愁。'},
  '怒':{parts:[{char:'奴',pinyin:'nú',meaning:'奴隶'},{char:'心',pinyin:'xīn',meaning:'心脏'}],explanation:'奴隶的心表示愤怒，被奴役的愤怒。'},
  '意':{parts:[{char:'音',pinyin:'yīn',meaning:'声音'},{char:'心',pinyin:'xīn',meaning:'心脏'}],explanation:'音和心在一起表示意思，心里的声音表达意思。'},
  '感':{parts:[{char:'咸',pinyin:'xián',meaning:'都'},{char:'心',pinyin:'xīn',meaning:'心脏'}],explanation:'咸表示声音，心表示情感，心中的感受。'},
  '愿':{parts:[{char:'原',pinyin:'yuán',meaning:'原来'},{char:'心',pinyin:'xīn',meaning:'心脏'}],explanation:'原表示声音，心表示愿望，心里的愿望。'},
  '慈':{parts:[{char:'兹',pinyin:'zī',meaning:'这个'},{char:'心',pinyin:'xīn',meaning:'心脏'}],explanation:'兹表示声音，心表示慈爱，心里的慈爱。'},
  '恐':{parts:[{char:'工',pinyin:'gōng',meaning:'工作'},{char:'凡',pinyin:'fán',meaning:'平凡'},{char:'心',pinyin:'xīn',meaning:'心脏'}],explanation:'工和凡表示害怕，心表示情感，心里恐惧。'}
};
function showDiagram(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=diagramData[char];
  if(!data){
    data={parts:[{char:'?',pinyin:'?',meaning:'未知'}],explanation:'暂无图解信息'};
  }
  var html='<div class="card">';
  html+='<div class="diagram-container">';
  html+='<div class="diagram-main">'+char+'</div>';
  html+='<div style="font-size:1.1rem;color:var(--text2);margin-bottom:16px">';
  html+=data.parts.map(function(p){return p.char;}).join(' + ')+ ' = '+char;
  html+='</div>';
  html+='<div class="diagram-parts">';
  data.parts.forEach(function(part){
    html+='<div class="diagram-part">';
    html+='<div class="diagram-part-char">'+part.char+'</div>';
    html+='<div class="diagram-part-pinyin">'+part.pinyin+'</div>';
    html+='<div class="diagram-part-meaning">'+part.meaning+'</div>';
    html+='</div>';
  });
  html+='</div></div>';
  html+='<div class="section"><h3>📝 图解说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div>'+data.explanation+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(diagramData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showDiagram();
}
showDiagram();
</script></body></html>
