<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水坝查找</title>
<meta name="description" content="水坝水库查找工具，发现附近的水利工程设施">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--cyan:#06b6d4;--green:#22c55e;--amber:#f59e0b;--muted:#8b949e}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16pxscroll-behavior:smooth;}
.container{max-width:1200px;margin:0 auto}
h1{text-align:center;font-size:1.8rem;margin-bottom:6px}
.subtitle{text-align:center;color:var(--muted);margin-bottom:24px;font-size:.9rem}
.controls{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.search-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;outline:none}
.search-input:focus{border-color:var(--accent)}
.filter-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-group label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.filter-group select{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;font-size:.85rem;outline:none;min-width:120px}
.sort-btns{display:flex;gap:6px;flex-wrap:wrap}
.sort-btn{padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:.8rem;cursor:pointer;transition:all .2s}
.sort-btn.active,.sort-btn:hover{background:var(--accent);color:var(--text);border-color:var(--accent)}
.results-info{margin-bottom:16px;color:var(--muted);font-size:.85rem}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-name{font-size:1.15rem;font-weight:600}
.card-type-badge{padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:600;background:rgba(6,182,212,.2);color:var(--cyan);border:1px solid rgba(6,182,212,.4)}
.card-location{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.card-desc{color:var(--muted);font-size:.88rem;line-height:1.5;margin-bottom:12px}
.card-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.meta-tag{padding:4px 10px;border-radius:6px;font-size:.75rem}
.tag-height{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:var(--accent)}
.tag-power{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:var(--green)}
.tag-cap{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:var(--amber)}
.card-features{list-style:none;padding:0}
.card-features li{padding:3px 0;font-size:.83rem;color:var(--muted)}
.card-features li::before{content:"• ";color:var(--accent)}
.no-results{text-align:center;color:var(--muted);padding:60px 20px;font-size:1.1rem}
@media(max-width:600px){.results{grid-template-columns:1fr}.search-row{flex-direction:column}.filter-row{flex-direction:column;align-items:stretch}.filter-group select{min-width:auto;width:100%}h1{font-size:1.4rem}}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="水坝查找">
  <meta property="og:description" content="水坝水库查找工具，发现附近的水利工程设施">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/dam-finder/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>💧 水坝查找</h1>
<p class="subtitle">探索世界著名水坝工程</p>
<div class="controls">
<div class="search-row"><input type="text" class="search-input" id="searchInput" placeholder="搜索水坝名称或国家..."></div>
<div class="filter-row">
<div class="filter-group"><label>类型</label><select id="typeFilter"><option value="">全部</option><option value="重力坝">重力坝</option><option value="拱坝">拱坝</option><option value="土石坝">土石坝</option><option value="支墩坝">支墩坝</option></select></div>
<div class="filter-group"><label>排序</label>
<div class="sort-btns"><button class="sort-btn active" data-sort="height">高度 ↓</button><button class="sort-btn" data-sort="power">发电量 ↓</button><button class="sort-btn" data-sort="rating">评分 ↓</button></div>
</div></div></div>
<div class="results-info" id="resultsInfo"></div>
<div class="results" id="results"></div>
</div>
<script>
const dams=[
{id:1,name:"三峡大坝",country:"中国湖北",type:"重力坝",height:181,capacity:"393亿m³",power:22500,year:2006,rating:4.6,desc:"世界最大水利工程，总装机容量22500MW，兼具防洪、发电、航运功能。",features:["三峡大坝景区","185观景平台","截流纪念园","升船机体验"]},
{id:2,name:"伊泰普大坝",country:"巴西/巴拉圭",type:"拱坝",height:196,capacity:"290亿m³",power:14000,year:1984,rating:4.7,desc:"曾长期占据世界最大水电站宝座，年发电量曾居世界第一。",features:["水电站参观","鱼类通道","伊泰普湖","生态公园"]},
{id:3,name:"胡佛大坝",country:"美国亚利桑那/内华达",type:"重力拱坝",height:221,capacity:"350亿m³",power:2080,year:1936,rating:4.8,desc:"大萧条时期的工程奇迹，建造米德湖，至今仍是重要发电设施。",features:["大坝之旅","米德湖游船","拱桥观景","发电厂参观"]},
{id:4,name:"阿斯旺大坝",country:"埃及",type:"土石坝",height:111,capacity:"1620亿m³",power:2100,year:1970,rating:4.5,desc:"尼罗河上的巨型水坝，创造了世界最长人工湖纳赛尔湖。",features:["纳赛尔湖","菲莱神庙迁移","灌溉渠","新博物馆"]},
{id:5,name:"白鹤滩水电站",country:"中国四川/云南",type:"拱坝",height:289,capacity:"206亿m³",power:16000,year:2021,rating:4.7,desc:"世界第二大水电站，300米级拱坝代表了世界水电最高水平。",features:["地下厂房","双曲拱坝","观景平台","金沙江峡谷"]},
{id:6,name:"大古力大坝",country:"美国华盛顿州",type:"重力坝",height:168,capacity:"118亿m³",power:6809,year:1942,rating:4.4,desc:"美国最大水电站，哥伦比亚河上，服务整个太平洋西北地区。",features:["游客中心","哥伦比亚河峡谷","鱼类洄游通道","国家公园"]},
{id:7,name:"水口大坝",country:"中国福建",type:"重力坝",height:101,capacity:"26亿m³",power:1400,year:1996,rating:4.3,desc:"华东地区最大水电站，闽江上的重要水利枢纽。",features:["闽江风光","坝顶观光","升船机","福州水景"]},
{id:8,name:"萨扬-舒申斯克大坝",country:"俄罗斯",type:"拱坝",height:245,capacity:"313亿m³",power:6400,year:1989,rating:4.5,desc:"俄罗斯最大水电站，叶尼塞河上的巨型拱坝工程。",features:["大坝参观","叶尼塞河","克拉斯诺亚尔斯克","水电博物馆"]},
{id:9,name:"锦屏一级大坝",country:"中国四川",type:"拱坝",height:305,capacity:"77亿m³",power:3600,year:2014,rating:4.6,desc:"世界最高拱坝，305米，建于雅砻江大峡谷。",features:["305米拱坝","地下厂房","锦屏大河湾","峡谷风光"]},
{id:10,name:"伊德大坝",country:"瑞士",type:"重力坝",height:72,capacity:"0.4亿m³",power:10,year:1847,rating:4.2,desc:"世界上最古老的大型水电站之一，1847年即开始发电。",features:["历史遗迹","阿尔卑斯风光","水电博物馆","徒步路线"]}
];
let currentSort="height";
let filtered=[...dams];
function render(){
const s=document.getElementById("searchInput").value.toLowerCase();
const type=document.getElementById("typeFilter").value;
filtered=dams.filter(d=>{
if(s&&!d.name.includes(s)&&!d.country.includes(s))return false;
if(type&&d.type!==type)return false;
return true;
});
if(currentSort==="height")filtered.sort((a,b)=>b.height-a.height);
else if(currentSort==="power")filtered.sort((a,b)=>b.power-a.power);
else if(currentSort==="rating")filtered.sort((a,b)=>b.rating-a.rating);
document.getElementById("resultsInfo").textContent=`找到 ${filtered.length} 座水坝`;
const c=document.getElementById("results");
if(!filtered.length){c.innerHTML='<div class="no-results">没有找到匹配的水坝</div>';return;}
c.innerHTML=filtered.map(d=>`<div class="card">
<div class="card-header"><span class="card-name">💧 ${d.name}</span><span class="card-type-badge">${d.type}</span></div>
<div class="card-location">📍 ${d.country} · ⭐ ${d.rating}</div>
<div class="card-desc">${d.desc}</div>
<div class="card-meta">
<span class="meta-tag tag-height">📏 高度 ${d.height}m</span>
<span class="meta-tag tag-power">⚡ ${d.power.toLocaleString()}MW</span>
<span class="meta-tag tag-cap">🏊 库容 ${d.capacity}</span>
<span class="meta-tag tag-height">📅 ${d.year}年</span>
</div>
<ul class="card-features">${d.features.map(f=>`<li>${f}</li>`).join("")}</ul>
</div>`).join("");
}
document.querySelectorAll(".sort-btn").forEach(b=>{b.addEventListener("click",()=>{document.querySelectorAll(".sort-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentSort=b.dataset.sort;render();})});
document.getElementById("searchInput").addEventListener("input",render);
document.getElementById("typeFilter").addEventListener("change",render);
render();
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
</body>
</html>
