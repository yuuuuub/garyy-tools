<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem}.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.search-box{display:flex;gap:8px;max-width:400px;margin:16px auto 0}
.search-box input{flex:1;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.9rem;outline:none}
.search-box button{padding:10px 20px;background:var(--blue);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:.9rem}
.country-card{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px;text-align:center}
.country-flag{font-size:4rem;margin-bottom:8px}
.country-name{font-size:1.3rem;font-weight:700}
.country-name-cn{font-size:.85rem;color:var(--blue);margin-top:4px}
.country-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;text-align:left}
.detail-item{background:var(--bg);border-radius:8px;padding:12px}
.detail-label{font-size:.75rem;color:var(--text2)}
.detail-value{font-size:.9rem;font-weight:600;margin-top:4px}
.quick-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.quick-btn{padding:5px 10px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.78rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">

window.searchCountry=function(){
var q=input.value.trim();
if(!q){app.innerHTML='<div style="text-align:center;color:var(--text2);padding:40px">请输入国家名称</div>';return;}
var apiName=cnCountries[q]||q;
var c=countryDB[apiName];
if(!c){
var found=false;
Object.keys(countryDB).forEach(function(k){
if(k.toLowerCase().indexOf(apiName.toLowerCase())!==-1&&!found){c=countryDB[k];found=true;}
});
}
if(!c){app.innerHTML='<div style="text-align:center;color:var(--text2);padding:40px">未找到"'+q+'"</div>';return;}
var nameCn=Object.keys(cnCountries).find(function(k){return cnCountries[k]===apiName;})||apiName;
var population=c.population?c.population.toLocaleString():'未知';
var area=c.area?c.area.toLocaleString()+' km²':'未知';
var html='<div class="country-card">';
if(c.flag)html+='<div class="country-flag">'+c.flag+'</div>';
html+='<div class="country-name">'+apiName+'</div>';
html+='<div class="country-name-cn">'+nameCn+'</div>';
html+='<div class="country-details">';
html+='<div class="detail-item"><div class="detail-label">🏛️ 首都</div><div class="detail-value">'+c.capital+'</div></div>';
html+='<div class="detail-item"><div class="detail-label">👥 人口</div><div class="detail-value">'+population+'</div></div>';
html+='<div class="detail-item"><div class="detail-label">📐 面积</div><div class="detail-value">'+area+'</div></div>';
html+='<div class="detail-item"><div class="detail-label">🌍 洲</div><div class="detail-value">'+c.region+' / '+c.subregion+'</div></div>';
html+='<div class="detail-item"><div class="detail-label">🗣️ 语言</div><div class="detail-value">'+c.languages+'</div></div>';
html+='<div class="detail-item"><div class="detail-label">💰 货币</div><div class="detail-value">'+c.currencies+'</div></div>';
html+='</div></div>';
app.innerHTML=html;
};
