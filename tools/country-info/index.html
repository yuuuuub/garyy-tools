<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国家信息</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem}.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.search-box{display:flex;gap:8px;max-width:400px;margin:16px auto 0}
.search-box input{flex:1;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.9rem;outline:none}
.search-box button{padding:10px 20px;background:var(--blue);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:.9rem}
.country-card{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px;text-align:center}
.country-flag{font-size:4rem;margin-bottom:8px}
.country-name{font-size:1.3rem;font-weight:700}
.country-name-cn{font-size:.85rem;color:var(--blue);margin-top:4px}
.country-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;text-align:left}
.detail-item{background:var(--bg);border-radius:8px;padding:12px}
.detail-label{font-size:.75rem;color:var(--text2)}
.detail-value{font-size:.9rem;font-weight:600;margin-top:4px}
.quick-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.quick-btn{padding:5px 10px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.78rem}
</style>
</head>
<body>
<div class="container">
<header><h1>🌍 国家信息</h1><p class="sub">支持中文名搜索 · restcountries API</p></header>
<div class="search-box">
<input type="text" id="searchInput" placeholder="输入国家名称，如 中国、美国" onkeydown="if(event.key==='Enter')searchCountry()">
<button onclick="searchCountry()">查询</button>
</div>
<div class="quick-list" id="quickList"></div>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var input=document.getElementById('searchInput');
var cnCountries={
'中国':'China','美国':'United States','日本':'Japan','韩国':'South Korea',
'英国':'United Kingdom','法国':'France','德国':'Germany','俄罗斯':'Russia',
'加拿大':'Canada','澳大利亚':'Australia','巴西':'Brazil','印度':'India',
'意大利':'Italy','西班牙':'Spain','墨西哥':'Mexico','泰国':'Thailand',
'越南':'Vietnam','新加坡':'Singapore','马来西亚':'Malaysia','印度尼西亚':'Indonesia',
'菲律宾':'Philippines','埃及':'Egypt','南非':'South Africa','阿根廷':'Argentina',
'荷兰':'Netherlands','比利时':'Belgium','瑞士':'Switzerland','奥地利':'Austria',
'瑞典':'Sweden','挪威':'Norway','芬兰':'Finland','丹麦':'Denmark',
'波兰':'Poland','捷克':'Czech Republic','匈牙利':'Hungary','希腊':'Greece',
'葡萄牙':'Portugal','土耳其':'Turkey','以色列':'Israel','阿联酋':'UAE',
'新西兰':'New Zealand','秘鲁':'Peru','智利':'Chile','哥伦比亚':'Colombia',
'尼日利亚':'Nigeria','肯尼亚':'Kenya','摩洛哥':'Morocco','冰岛':'Iceland',
'爱尔兰':'Ireland','克罗地亚':'Croatia','斯洛文尼亚':'Slovenia',
'爱沙尼亚':'Estonia','拉脱维亚':'Latvia','立陶宛':'Lithuania',
'保加利亚':'Bulgaria','罗马尼亚':'Romania','乌克兰':'Ukraine',
'古巴':'Cuba','牙买加':'Jamaica','哥斯达黎加':'Costa Rica',
'巴拿马':'Panama','厄瓜多尔':'Ecuador','玻利维亚':'Bolivia',
'巴拉圭':'Paraguay','乌拉圭':'Uruguay','孟加拉国':'Bangladesh',
'巴基斯坦':'Pakistan','斯里兰卡':'Sri Lanka','尼泊尔':'Nepal',
'柬埔寨':'Cambodia','老挝':'Laos','缅甸':'Myanmar','蒙古':'Mongolia'
};
var quickCountries=['中国','美国','日本','韩国','英国','法国','德国','俄罗斯','澳大利亚','巴西'];
function renderQuick(){
var html='';
quickCountries.forEach(function(c){
html+='<button class="quick-btn" onclick="quickSearch(\''+c+'\')">'+c+'</button>';
});
document.getElementById('quickList').innerHTML=html;
}
window.quickSearch=function(c){input.value=c;searchCountry();};
window.searchCountry=function(){
var q=input.value.trim();
if(!q){app.innerHTML='<div style="text-align:center;color:var(--text2);padding:40px">请输入国家名称</div>';return;}
var apiName=cnCountries[q]||q;
app.innerHTML='<div style="text-align:center;padding:60px 0;color:var(--text2)"><div class="spinner" style="width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px"></div><p>查询中...</p></div>';
fetch('https://restcountries.com/v3.1/name/'+encodeURIComponent(apiName))
.then(function(r){if(!r.ok)throw new Error('未找到该国家');return r.json();})
.then(function(data){
if(!data||!data.length){app.innerHTML='<div style="text-align:center;color:var(--text2);padding:40px">未找到"'+q+'"</div>';return;}
var c=data[0];
var name=c.name.common||'';
var nameCn=Object.keys(cnCountries).find(function(k){return cnCountries[k]===name;})||name;
var flag=c.flags&&c.flags.emoji?c.flags.emoji:'';
var capital=c.capital?c.capital[0]:'无';
var population=c.population?c.population.toLocaleString():'未知';
var area=c.area?c.area.toLocaleString()+' km²':'未知';
var region=c.region||'未知';
var subregion=c.subregion||'未知';
var languages=c.languages?Object.values(c.languages).join(', '):'未知';
var currencies=c.currencies?Object.values(c.currencies).map(function(cur){return cur.name+' ('+cur.symbol+')';}).join(', '):'未知';
var html='<div class="country-card">';
if(flag)html+='<div class="country-flag">'+flag+'</div>';
html+='<div class="country-name">'+name+'</div>';
html+='<div class="country-name-cn">'+nameCn+'</div>';
html+='<div class="country-details">';
html+='<div class="detail-item"><div class="detail-label">🏛️ 首都</div><div class="detail-value">'+capital+'</div></div>';
html+='<div class="detail-item"><div class="detail-label">👥 人口</div><div class="detail-value">'+population+'</div></div>';
html+='<div class="detail-item"><div class="detail-label">📐 面积</div><div class="detail-value">'+area+'</div></div>';
html+='<div class="detail-item"><div class="detail-label">🌍 洲</div><div class="detail-value">'+region+' / '+subregion+'</div></div>';
html+='<div class="detail-item"><div class="detail-label">🗣️ 语言</div><div class="detail-value">'+languages+'</div></div>';
html+='<div class="detail-item"><div class="detail-label">💰 货币</div><div class="detail-value">'+currencies+'</div></div>';
html+='</div></div>';
app.innerHTML=html;
})
.catch(function(e){
app.innerHTML='<div style="text-align:center;padding:40px 0;color:var(--text2)"><p>⚠️ '+e.message+'</p></div>';
});
};
renderQuick();
})();
</script>
</body>
</html>
