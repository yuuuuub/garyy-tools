<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国家信息查询</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;color:var(--text)}
.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.search-box{display:flex;gap:8px;max-width:400px;margin:16px auto 0}
.search-box input{flex:1;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.9rem;outline:none}
.search-box input:focus{border-color:var(--blue)}
.search-box button{padding:10px 20px;background:var(--blue);border:none;border-radius:var(--radius);color:#fff;cursor:pointer;font-size:.9rem}
.search-box button:hover{opacity:.9}
.loading{text-align:center;padding:60px 0}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:.85rem}
.error{text-align:center;padding:40px 0;color:var(--red);font-size:.9rem}
.retry-btn{margin-top:10px;padding:8px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.85rem}
.card{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.country-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.flag{font-size:3.5rem;line-height:1}
.country-name h2{font-size:1.2rem}
.country-name span{font-size:.82rem;color:var(--text2)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-item{display:flex;justify-content:space-between;padding:10px 14px;background:var(--bg);border-radius:var(--radius)}
.detail-item .label{color:var(--text2);font-size:.82rem}
.detail-item .value{font-weight:600;font-size:.82rem;text-align:right;max-width:60%;word-break:break-all}
@media(max-width:500px){
.detail-grid{grid-template-columns:1fr}
.flag{font-size:2.5rem}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🏳️ 国家信息查询</h1>
<p class="sub">REST Countries API</p>
</header>
<div class="search-box">
<input type="text" id="countryInput" placeholder="输入国家名称（中/英文）" onkeydown="if(event.key==='Enter')searchCountry()">
<button onclick="searchCountry()">查询</button>
</div>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var input=document.getElementById('countryInput');
window.searchCountry=function(){
var q=input.value.trim();
if(!q){app.innerHTML='<div class="error"><p>请输入国家名称</p></div>';return;}
app.innerHTML='<div class="loading"><div class="spinner"></div><p>搜索中...</p></div>';
fetch('https://restcountries.com/v3.1/name/'+encodeURIComponent(q))
.then(function(r){
if(r.status===404)throw new Error('未找到该国家');
if(!r.ok)throw new Error('请求失败 ('+r.status+')');
return r.json();
})
.then(function(data){
if(!data||!data.length){app.innerHTML='<div class="error"><p>未找到该国家</p></div>';return;}
var c=data[0];
var name=c.translations&&c.translations.zho&&c.translations.zho.common||c.name.common;
var official=c.translations&&c.translations.zho&&c.translations.zho.official||c.name.official;
var flag=c.flag||'🏳️';
var capital=c.capital?c.capital.join(', '):'N/A';
var pop=c.population?popFormat(c.population):'N/A';
var area=c.area?areaFormat(c.area):'N/A';
var lang=c.languages?Object.values(c.languages).join(', '):'N/A';
var cur=c.currencies?Object.values(c.currencies).map(function(v){return v.name+(v.symbol?' ('+v.symbol+')':'');}).join(', '):'N/A';
var tz=c.timezones&&c.timezones.length?c.timezones.join(', '):'N/A';
var region=c.region||'N/A';
var subregion=c.subregion||'N/A';
var cont=c.continents?c.continents.join(', '):'N/A';
var domain=c.tld?c.tld.join(', '):'N/A';
var html='<div class="card">';
html+='<div class="country-header"><div class="flag">'+flag+'</div><div class="country-name"><h2>'+name+'</h2><span>'+official+'</span></div></div>';
html+='<div class="detail-grid">';
html+='<div class="detail-item"><span class="label">🏙️ 首都</span><span class="value">'+capital+'</span></div>';
html+='<div class="detail-item"><span class="label">👥 人口</span><span class="value">'+pop+'</span></div>';
html+='<div class="detail-item"><span class="label">🗺️ 面积</span><span class="value">'+area+'</span></div>';
html+='<div class="detail-item"><span class="label">🌍 大洲</span><span class="value">'+cont+'</span></div>';
html+='<div class="detail-item"><span class="label">📍 区域</span><span class="value">'+region+(subregion!='N/A'?' / '+subregion:'')+'</span></div>';
html+='<div class="detail-item"><span class="label">🗣️ 语言</span><span class="value">'+lang+'</span></div>';
html+='<div class="detail-item"><span class="label">💱 货币</span><span class="value">'+cur+'</span></div>';
html+='<div class="detail-item"><span class="label">🕐 时区</span><span class="value">'+tz+'</span></div>';
html+='<div class="detail-item"><span class="label">🔗 域名</span><span class="value">'+domain+'</span></div>';
html+='</div></div>';
app.innerHTML=html;
})
.catch(function(e){
app.innerHTML='<div class="error"><p>⚠️ '+e.message+'</p><button class="retry-btn" onclick="searchCountry()">重试</button></div>';
});
};
function popFormat(n){if(n>=1e9)return (n/1e9).toFixed(2)+'B';if(n>=1e6)return (n/1e6).toFixed(2)+'M';if(n>=1e3)return (n/1e3).toFixed(1)+'K';return n.toLocaleString();}
function areaFormat(n){if(n>=1e6)return (n/1e6).toFixed(2)+'M km²';return n.toLocaleString()+' km²';}
})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
