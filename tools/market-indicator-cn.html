<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="市场指标综合面板 - RSI、MACD、布林带、均线等多指标综合分析">
    <meta name="robots" content="index, follow">
    <title>市场指标综合面板</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #007bff; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #e0e0e0; --primary-color: #0d6efd; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        button { background-color: var(--primary-color); color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { opacity: 0.85; }
        canvas { width: 100%; border-radius: 6px; border: 1px solid var(--border-color); }
        .stat-box { text-align: center; padding: 14px; border: 1px solid var(--border-color); border-radius: 8px; }
        .stat-box .num { font-size: 20px; font-weight: bold; }
        .stat-box .label { font-size: 11px; color: var(--secondary-color); margin-top: 3px; }
        .stat-up { color: var(--success-color); }
        .stat-down { color: var(--danger-color); }
        .signal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
        .signal-item { padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .signal-item .name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        .signal-item .value { font-size: 18px; font-weight: bold; }
        .signal-item .desc { font-size: 12px; color: var(--secondary-color); margin-top: 4px; }
        .signal-buy { border-left: 4px solid var(--success-color); }
        .signal-sell { border-left: 4px solid var(--danger-color); }
        .signal-neutral { border-left: 4px solid var(--secondary-color); }
        .gauge-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .gauge-item { text-align: center; }
        .gauge-item canvas { border: none; }
        .gauge-label { font-size: 13px; font-weight: bold; margin-top: 4px; }
        .summary-box { padding: 16px; border-radius: 8px; text-align: center; font-size: 20px; font-weight: bold; }
        .summary-bullish { background: rgba(40,167,69,0.15); color: var(--success-color); border: 2px solid var(--success-color); }
        .summary-bearish { background: rgba(220,53,69,0.15); color: var(--danger-color); border: 2px solid var(--danger-color); }
        .summary-neutral { background: rgba(108,117,125,0.15); color: var(--secondary-color); border: 2px solid var(--secondary-color); }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>市场指标综合面板</h1>

        <div class="card">
            <div class="form-group">
                <label>价格数据（逗号分隔，从旧到新）</label>
                <input type="text" id="priceInput" value="50,50.5,51,50.8,51.5,52,51.8,52.5,53,52.8,53.5,54,53.8,54.5,55,54.8,55.5,56,55.5,55,54.5,55,55.5,56,56.5,57,56.8,57.5,58,57.5,57,56.5,57,57.5,58,58.5,59,58.5,58,57.5" placeholder="例: 50,50.5,51...">
            </div>
            <button onclick="analyze()">综合分析</button>
        </div>

        <div id="summaryCard" class="card" style="display:none;"></div>

        <div id="statsArea" class="grid-6" style="display:none;"></div>

        <div class="card" id="gaugesCard" style="display:none;">
            <h3>指标仪表盘</h3>
            <div class="gauge-row" id="gaugesRow"></div>
        </div>

        <div class="card" id="chartCard" style="display:none;">
            <h3>价格走势</h3>
            <canvas id="mainChart" height="300"></canvas>
            <div class="legend" style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;">
                <span style="font-size:12px;display:flex;align-items:center;gap:4px;"><i style="display:inline-block;width:12px;height:12px;border-radius:2px;background:#007bff;"></i> 价格</span>
                <span style="font-size:12px;display:flex;align-items:center;gap:4px;"><i style="display:inline-block;width:12px;height:12px;border-radius:2px;background:#ffc107;"></i> MA20</span>
                <span style="font-size:12px;display:flex;align-items:center;gap:4px;"><i style="display:inline-block;width:12px;height:12px;border-radius:2px;background:rgba(220,53,69,0.5);"></i> BB上轨</span>
                <span style="font-size:12px;display:flex;align-items:center;gap:4px;"><i style="display:inline-block;width:12px;height:12px;border-radius:2px;background:rgba(40,167,69,0.5);"></i> BB下轨</span>
            </div>
        </div>

        <div class="grid-2">
            <div class="card" id="macdCard" style="display:none;">
                <h3>MACD</h3>
                <canvas id="macdChart" height="200"></canvas>
            </div>
            <div class="card" id="rsiCard" style="display:none;">
                <h3>RSI</h3>
                <canvas id="rsiChart" height="200"></canvas>
            </div>
        </div>

        <div class="card" id="signalsCard" style="display:none;">
            <h3>信号汇总</h3>
            <div class="signal-grid" id="signalGrid"></div>
        </div>
    </div>

    <script src="i18n.js" defer></script>
    <script>
        function toggleTheme() { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; }

        function parsePrices() {
            return document.getElementById('priceInput').value.split(',').map(Number).filter(n => !isNaN(n));
        }

        function calcSMA(data, p) {
            return data.map((_, i) => {
                if (i < p - 1) return null;
                let s = 0; for (let j = i - p + 1; j <= i; j++) s += data[j];
                return s / p;
            });
        }

        function calcEMA(data, p) {
            const k = 2 / (p + 1);
            const ema = [data[0]];
            for (let i = 1; i < data.length; i++) ema.push(data[i] * k + ema[i-1] * (1-k));
            return ema;
        }

        function calcRSI(prices, p) {
            const rsi = [];
            let gains = [], losses = [];
            for (let i = 1; i < prices.length; i++) {
                const d = prices[i] - prices[i-1];
                gains.push(d > 0 ? d : 0);
                losses.push(d < 0 ? -d : 0);
            }
            let ag = gains.slice(0, p).reduce((a,b)=>a+b,0)/p;
            let al = losses.slice(0, p).reduce((a,b)=>a+b,0)/p;
            for (let i = 0; i < prices.length; i++) {
                if (i < p) { rsi.push(null); continue; }
                if (i > p) { ag = (ag*(p-1)+gains[i-1])/p; al = (al*(p-1)+losses[i-1])/p; }
                rsi.push(al === 0 ? 100 : 100 - 100/(1+ag/al));
            }
            return rsi;
        }

        function calcBollinger(prices, p, k) {
            const mid = calcSMA(prices, p);
            const upper = [], lower = [];
            for (let i = 0; i < prices.length; i++) {
                if (mid[i] === null) { upper.push(null); lower.push(null); continue; }
                let sq = 0;
                for (let j = i-p+1; j <= i; j++) sq += Math.pow(prices[j]-mid[i],2);
                const std = Math.sqrt(sq/p);
                upper.push(mid[i]+k*std);
                lower.push(mid[i]-k*std);
            }
            return { mid, upper, lower };
        }

        function calcMACD(prices) {
            const fast = calcEMA(prices, 12);
            const slow = calcEMA(prices, 26);
            const macd = fast.map((v,i) => v-slow[i]);
            const signal = calcEMA(macd, 9);
            const hist = macd.map((v,i) => v-signal[i]);
            return { macd, signal, hist };
        }

        function calcStochastic(prices, kPeriod, dPeriod) {
            const k = [], d = [];
            for (let i = 0; i < prices.length; i++) {
                if (i < kPeriod - 1) { k.push(null); d.push(null); continue; }
                let hi = -Infinity, lo = Infinity;
                for (let j = i-kPeriod+1; j <= i; j++) { hi = Math.max(hi, prices[j]); lo = Math.min(lo, prices[j]); }
                const val = hi === lo ? 50 : (prices[i] - lo) / (hi - lo) * 100;
                k.push(val);
                if (i >= kPeriod + dPeriod - 2) {
                    let sum = 0;
                    for (let j = i-dPeriod+1; j <= i; j++) sum += k[j];
                    d.push(sum / dPeriod);
                } else d.push(null);
            }
            return { k, d };
        }

        function analyze() {
            const prices = parsePrices();
            if (prices.length < 30) { alert('请输入至少30个价格数据以获得最佳分析结果'); return; }

            const n = prices.length;
            const current = prices[n-1];
            const prev = prices[n-2];

            const ma5 = calcSMA(prices, 5);
            const ma10 = calcSMA(prices, 10);
            const ma20 = calcSMA(prices, 20);
            const rsi = calcRSI(prices, 14);
            const bb = calcBollinger(prices, 20, 2);
            const macd = calcMACD(prices);
            const stoch = calcStochastic(prices, 14, 3);

            const currentRSI = rsi[n-1];
            const currentMACD = macd.macd[n-1];
            const currentSignal = macd.signal[n-1];
            const currentHist = macd.hist[n-1];
            const currentBBUpper = bb.upper[n-1];
            const currentBBLower = bb.lower[n-1];
            const currentMA20 = ma20[n-1];
            const currentK = stoch.k[n-1];
            const currentD = stoch.d[n-1];

            const signals = [];
            let bullCount = 0, bearCount = 0;

            // MA signal
            const maSignal = current > currentMA20 ? 'buy' : 'sell';
            if (maSignal === 'buy') bullCount++; else bearCount++;
            signals.push({ name: 'MA20', value: currentMA20?.toFixed(2), signal: maSignal, desc: current > currentMA20 ? '价格在MA20上方' : '价格在MA20下方' });

            // RSI signal
            const rsiSignal = currentRSI > 70 ? 'sell' : currentRSI < 30 ? 'buy' : 'neutral';
            if (rsiSignal === 'buy') bullCount++; else if (rsiSignal === 'sell') bearCount++;
            signals.push({ name: 'RSI(14)', value: currentRSI?.toFixed(2), signal: rsiSignal, desc: currentRSI > 70 ? '超买' : currentRSI < 30 ? '超卖' : '中性' });

            // MACD signal
            const macdSignal = currentMACD > currentSignal ? (currentHist > 0 && macd.hist[n-2] <= 0 ? 'buy' : 'buy') : (currentHist < 0 && macd.hist[n-2] >= 0 ? 'sell' : 'sell');
            const macdSimple = currentMACD > currentSignal ? 'buy' : 'sell';
            if (macdSimple === 'buy') bullCount++; else bearCount++;
            signals.push({ name: 'MACD', value: currentMACD?.toFixed(3), signal: macdSimple, desc: currentMACD > currentSignal ? 'MACD线在信号线上方' : 'MACD线在信号线下方' });

            // Bollinger signal
            const bbSignal = current > currentBBUpper ? 'sell' : current < currentBBLower ? 'buy' : 'neutral';
            if (bbSignal === 'buy') bullCount++; else if (bbSignal === 'sell') bearCount++;
            signals.push({ name: '布林带', value: `${currentBBLower?.toFixed(1)}-${currentBBUpper?.toFixed(1)}`, signal: bbSignal, desc: current > currentBBUpper ? '突破上轨' : current < currentBBLower ? '跌破下轨' : '正常区间' });

            // Stochastic signal
            const stochSignal = currentK > 80 ? 'sell' : currentK < 20 ? 'buy' : 'neutral';
            if (stochSignal === 'buy') bullCount++; else if (stochSignal === 'sell') bearCount++;
            signals.push({ name: 'KDJ', value: `K${currentK?.toFixed(1)} D${currentD?.toFixed(1)}`, signal: stochSignal, desc: currentK > 80 ? '超买' : currentK < 20 ? '超卖' : '中性' });

            // MA alignment
            const maAlign = ma5[n-1] > ma10[n-1] && ma10[n-1] > ma20[n-1];
            const maAlignSignal = maAlign ? 'buy' : ma5[n-1] < ma10[n-1] && ma10[n-1] < ma20[n-1] ? 'sell' : 'neutral';
            if (maAlignSignal === 'buy') bullCount++; else if (maAlignSignal === 'sell') bearCount++;
            signals.push({ name: '均线排列', value: maAlign ? '多头' : maAlignSignal === 'sell' ? '空头' : '交叉', signal: maAlignSignal, desc: maAlign ? 'MA5>MA10>MA20 多头排列' : '非多头排列' });

            const totalSignals = bullCount + bearCount;
            const score = totalSignals > 0 ? ((bullCount - bearCount) / totalSignals * 100) : 0;
            let summaryText, summaryClass;
            if (score > 30) { summaryText = '🟢 看涨 — 多数指标看多'; summaryClass = 'summary-bullish'; }
            else if (score < -30) { summaryText = '🔴 看跌 — 多数指标看空'; summaryClass = 'summary-bearish'; }
            else { summaryText = '⚪ 中性 — 指标信号分歧'; summaryClass = 'summary-neutral'; }

            document.getElementById('summaryCard').style.display = 'block';
            document.getElementById('summaryCard').innerHTML = `<div class="summary-box ${summaryClass}">${summaryText}<div style="font-size:14px;margin-top:4px;">看涨 ${bullCount} / 看跌 ${bearCount} / 中性 ${6 - bullCount - bearCount} | 综合评分: ${score.toFixed(0)}</div></div>`;

            document.getElementById('statsArea').style.display = 'grid';
            document.getElementById('statsArea').innerHTML = `
                <div class="stat-box"><div class="num">${current.toFixed(2)}</div><div class="label">当前价格</div></div>
                <div class="stat-box"><div class="num ${currentRSI > 50 ? 'stat-up' : 'stat-down'}">${currentRSI?.toFixed(1)}</div><div class="label">RSI</div></div>
                <div class="stat-box"><div class="num ${currentMACD > currentSignal ? 'stat-up' : 'stat-down'}">${currentMACD?.toFixed(3)}</div><div class="label">MACD</div></div>
                <div class="stat-box"><div class="num">${currentMA20?.toFixed(2)}</div><div class="label">MA20</div></div>
                <div class="stat-box"><div class="num">${currentBBUpper?.toFixed(2)}</div><div class="label">BB上轨</div></div>
                <div class="stat-box"><div class="num">${currentBBLower?.toFixed(2)}</div><div class="label">BB下轨</div></div>
            `;

            drawMiniGauges(currentRSI, currentK, score);
            drawMainChart(prices, ma20, bb);
            drawMACDChart(macd);
            drawRSIChart(rsi);
            showSignals(signals);
        }

        function drawMiniGauges(rsi, stochK, score) {
            const container = document.getElementById('gaugesRow');
            container.innerHTML = '';

            function drawGauge(canvas, value, maxVal, color, label) {
                const ctx = canvas.getContext('2d');
                const W = 160, H = 90;
                canvas.width = W; canvas.height = H;
                const cx = W/2, cy = H - 5, r = 60;
                const startA = Math.PI, endA = 2 * Math.PI;

                ctx.beginPath(); ctx.arc(cx, cy, r, startA, endA);
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim();
                ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.stroke();

                const valAngle = startA + (value / maxVal) * Math.PI;
                ctx.beginPath(); ctx.arc(cx, cy, r, startA, valAngle);
                ctx.strokeStyle = color; ctx.lineWidth = 10; ctx.stroke();

                ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = color; ctx.textAlign = 'center';
                ctx.fillText(value.toFixed(1), cx, cy - 10);
                ctx.font = '12px sans-serif';
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim();
                ctx.fillText(label, cx, cy + 5);
            }

            const gauges = [
                { value: rsi || 0, max: 100, color: rsi > 70 ? '#dc3545' : rsi < 30 ? '#28a745' : '#007bff', label: 'RSI(14)' },
                { value: stochK || 0, max: 100, color: stochK > 80 ? '#dc3545' : stochK < 20 ? '#28a745' : '#ffc107', label: 'KDJ-K' },
                { value: (score + 100) / 2, max: 100, color: score > 30 ? '#28a745' : score < -30 ? '#dc3545' : '#6c757d', label: '综合评分' }
            ];

            gauges.forEach(g => {
                const div = document.createElement('div');
                div.className = 'gauge-item';
                const c = document.createElement('canvas');
                div.appendChild(c);
                container.appendChild(div);
                drawGauge(c, g.value, g.max, g.color, g.label);
            });

            document.getElementById('gaugesCard').style.display = 'block';
        }

        function drawMainChart(prices, ma20, bb) {
            const canvas = document.getElementById('mainChart');
            const ctx = canvas.getContext('2d');
            const W = canvas.width = canvas.offsetWidth * 2;
            const H = canvas.height * 2;
            ctx.clearRect(0, 0, W, H);

            let allVals = [...prices];
            bb.upper.forEach(v => { if (v !== null) allVals.push(v); });
            bb.lower.forEach(v => { if (v !== null) allVals.push(v); });
            const minV = Math.min(...allVals) * 0.97;
            const maxV = Math.max(...allVals) * 1.03;
            const padL = 60, padR = 20, padT = 15, padB = 25;
            const cW = W - padL - padR, cH = H - padT - padB;
            const n = prices.length;

            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim();
            ctx.font = '18px sans-serif';
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim();
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = padT + cH - (i/4)*cH;
                ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
                ctx.fillText((minV+(i/4)*(maxV-minV)).toFixed(1), 4, y+5);
            }

            const x = i => padL + (i/(n-1))*cW;
            const y = v => padT + cH - ((v-minV)/(maxV-minV))*cH;

            ctx.fillStyle = 'rgba(0,123,255,0.06)';
            ctx.beginPath();
            for (let i = 0; i < n; i++) { if (bb.upper[i]===null) continue; if(i===0) ctx.moveTo(x(i),y(bb.upper[i])); else ctx.lineTo(x(i),y(bb.upper[i])); }
            for (let i = n-1; i >= 0; i--) { if (bb.lower[i]===null) continue; ctx.lineTo(x(i),y(bb.lower[i])); }
            ctx.closePath(); ctx.fill();

            function drawDashedLine(data, color) {
                ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([5,3]); ctx.beginPath();
                let s = false;
                data.forEach((v,i) => { if(v===null)return; if(!s){ctx.moveTo(x(i),y(v));s=true;}else ctx.lineTo(x(i),y(v)); });
                ctx.stroke(); ctx.setLineDash([]);
            }

            drawDashedLine(bb.upper, 'rgba(220,53,69,0.6)');
            drawDashedLine(bb.lower, 'rgba(40,167,69,0.6)');

            ctx.strokeStyle = '#ffc107'; ctx.lineWidth = 1.5; ctx.beginPath();
            let s = false;
            ma20.forEach((v,i) => { if(v===null)return; if(!s){ctx.moveTo(x(i),y(v));s=true;}else ctx.lineTo(x(i),y(v)); });
            ctx.stroke();

            ctx.strokeStyle = '#007bff'; ctx.lineWidth = 2.5; ctx.beginPath();
            prices.forEach((p,i) => { if(i===0) ctx.moveTo(x(i),y(p)); else ctx.lineTo(x(i),y(p)); });
            ctx.stroke();

            document.getElementById('chartCard').style.display = 'block';
        }

        function drawMACDChart(macd) {
            const canvas = document.getElementById('macdChart');
            const ctx = canvas.getContext('2d');
            const W = canvas.width = canvas.offsetWidth * 2;
            const H = canvas.height * 2;
            ctx.clearRect(0, 0, W, H);

            const allV = [...macd.macd, ...macd.signal, ...macd.hist];
            const maxV = Math.max(...allV.map(Math.abs)) * 1.2 || 1;
            const padL = 50, padR = 10, padT = 10, padB = 20;
            const cW = W-padL-padR, cH = H-padT-padB;
            const n = macd.macd.length;
            const zeroY = padT + cH/2;
            const gap = cW/n;
            const barW = Math.max(1, gap*0.6);

            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim();
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(padL, zeroY); ctx.lineTo(W-padR, zeroY); ctx.stroke();

            macd.hist.forEach((v,i) => {
                const x = padL + i*gap + gap/2;
                const h = Math.abs(v/maxV)*(cH/2);
                ctx.fillStyle = v >= 0 ? 'rgba(40,167,69,0.5)' : 'rgba(220,53,69,0.5)';
                if (v >= 0) ctx.fillRect(x-barW/2, zeroY-h, barW, h);
                else ctx.fillRect(x-barW/2, zeroY, barW, h);
            });

            function drawLine(data, color, w) {
                ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath();
                data.forEach((v,i) => { const x2 = padL+i*gap+gap/2; const y2 = zeroY-(v/maxV)*(cH/2); if(i===0) ctx.moveTo(x2,y2); else ctx.lineTo(x2,y2); });
                ctx.stroke();
            }
            drawLine(macd.signal, '#dc3545', 1.5);
            drawLine(macd.macd, '#007bff', 2);

            document.getElementById('macdCard').style.display = 'block';
        }

        function drawRSIChart(rsi) {
            const canvas = document.getElementById('rsiChart');
            const ctx = canvas.getContext('2d');
            const W = canvas.width = canvas.offsetWidth * 2;
            const H = canvas.height * 2;
            ctx.clearRect(0, 0, W, H);

            const padL = 50, padR = 10, padT = 10, padB = 20;
            const cW = W-padL-padR, cH = H-padT-padB;
            const n = rsi.length;
            const gap = cW/n;

            ctx.fillStyle = 'rgba(220,53,69,0.06)'; ctx.fillRect(padL, padT, cW, cH*0.3);
            ctx.fillStyle = 'rgba(40,167,69,0.06)'; ctx.fillRect(padL, padT+cH*0.7, cW, cH*0.3);

            ctx.strokeStyle = 'rgba(220,53,69,0.4)'; ctx.setLineDash([4,3]); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(padL, padT+cH*0.3); ctx.lineTo(W-padR, padT+cH*0.3); ctx.stroke();
            ctx.strokeStyle = 'rgba(40,167,69,0.4)';
            ctx.beginPath(); ctx.moveTo(padL, padT+cH*0.7); ctx.lineTo(W-padR, padT+cH*0.7); ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = '#007bff'; ctx.lineWidth = 2; ctx.beginPath();
            let s = false;
            rsi.forEach((v,i) => { if(v===null)return; const x2=padL+i*gap+gap/2; const y2=padT+cH-(v/100)*cH; if(!s){ctx.moveTo(x2,y2);s=true;}else ctx.lineTo(x2,y2); });
            ctx.stroke();

            document.getElementById('rsiCard').style.display = 'block';
        }

        function showSignals(signals) {
            let html = '';
            signals.forEach(s => {
                const cls = s.signal === 'buy' ? 'signal-buy' : s.signal === 'sell' ? 'signal-sell' : 'signal-neutral';
                const icon = s.signal === 'buy' ? '🟢' : s.signal === 'sell' ? '🔴' : '⚪';
                html += `<div class="signal-item ${cls}">
                    <div class="name">${icon} ${s.name}</div>
                    <div class="value" style="color:${s.signal==='buy'?'var(--success-color)':s.signal==='sell'?'var(--danger-color)':'var(--secondary-color)'};">${s.value}</div>
                    <div class="desc">${s.desc}</div>
                </div>`;
            });
            document.getElementById('signalGrid').innerHTML = html;
            document.getElementById('signalsCard').style.display = 'block';
        }

        analyze();
    </script>
</body>
</html>
