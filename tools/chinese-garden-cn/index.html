<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国园林 - 叠山理水 | Gary's Tools</title><meta name="description" content="中国古典园林百科 - 叠山理水、花木配置、亭台楼阁、造园艺术与名家名园"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#4a9e6e;--accent2:#2d7a4a}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#2d7a4a;--accent2:#1a5c32}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;transition:background var(--transition),color var(--transition)}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.category-btn{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all var(--transition)}.category-btn.active{background:var(--accent);color:#fff}.category-btn:hover{opacity:.85}.garden-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all var(--transition)}.garden-item:hover{transform:translateY(-2px);border-color:var(--accent)}.garden-item.open .garden-detail{display:block}.garden-title{font-size:1.1rem;font-weight:600;color:var(--accent);margin-bottom:4px}.garden-meta{font-size:.8rem;color:var(--green);margin-bottom:4px}.garden-desc{font-size:.9rem;color:var(--text2);line-height:1.6}.garden-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.9rem;line-height:1.8;color:var(--text)}.garden-detail h4{color:var(--accent);margin-bottom:8px}.garden-tag{display:inline-block;padding:2px 8px;background:var(--border);border-radius:4px;font-size:.75rem;color:var(--text2);margin:2px}#stats{text-align:center;color:var(--text2);font-size:.8rem;margin-bottom:12px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem)}</style><meta property="og:title" content="中国园林"><meta property="og:description" content="中国古典园林百科 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏯</text></svg>"></head><body>

<div class="container"><h1>🏯 中国古典园林</h1><p class="sub">叠山理水 · 花木配置 · 亭台楼阁 · 造园艺术</p>
<div class="card"><div class="search-box"><input type="text" id="searchInput" placeholder="搜索园林知识..." oninput="filterList()"></div>
<div class="btn-group">
<button class="category-btn active" onclick="filterCat('all',this)">全部</button>
<button class="category-btn" onclick="filterCat('手法',this)">造园手法</button>
<button class="category-btn" onclick="filterCat('名园',this)">名园</button>
<button class="category-btn" onclick="filterCat('元素',this)">园林元素</button>
<button class="category-btn" onclick="filterCat('理论',this)">造园理论</button>
</div></div>
<div id="stats"></div><div id="list"></div></div>
<script src="../i18n.js" defer></script>
<script>
var data=[
{title:'借景',cat:'手法',tags:['手法','视觉','空间'],desc:'将园外之景纳入园内视线，扩大空间感。',detail:'借景是造园最重要的手法之一，分为远借、邻借、仰借、俯借、应时而借等。远借如拙政园借北寺塔；邻借如借邻家墙头花木；应时而借如借四季变化。计成在《园冶》中说："巧于因借，精在体宜。"',ref:'《园冶》'},
{title:'对景',cat:'手法',tags:['手法','视线','焦点'],desc:'在视线的端点设置景物，形成视觉焦点。',detail:'对景是指在游人视线的终点设置主要景观，使其成为视觉焦点。如站在苏州留园入口处，正对"古木交柯"景观。对景又分正对景和反对景，正对景是面对主要景观，反对景是背对主要景观。',ref:'《中国古典园林史》'},
{title:'框景',cat:'手法',tags:['手法','门洞','画框'],desc:'利用门窗洞口等将景色框成一幅画。',detail:'框景是利用门、窗、洞等建筑构件作为画框，将园中景色框入其中，形成一幅天然图画。苏州拙政园的梧竹幽居亭四面圆洞门框景最为著名，每个洞门都是一幅不同的画卷。',ref:'《园冶》'},
{title:'漏景',cat:'手法',tags:['手法','透漏','隐约'],desc:'通过花窗、漏墙等半遮半露地透出景物。',detail:'漏景是通过花窗、漏墙、栅栏等半通透的构件，使景物若隐若现，增加层次感。漏窗图案各异，有冰裂纹、梅花纹、几何纹等，本身也是精美的艺术品。',ref:'《苏州古典园林》'},
{title:'抑景',cat:'手法',tags:['手法','欲扬先抑','空间'],desc:'先用障景遮挡视线，再豁然开朗。',detail:'抑景即"欲扬先抑"的手法。进入园林时先用假山、影壁等遮挡视线，使游人不能一览全貌，转过障景后豁然开朗，产生强烈的对比效果。苏州拙政园入口即采用此手法。',ref:'《园冶》'},
{title:'拙政园',cat:'名园',tags:['苏州','明代','水景'],desc:'中国四大名园之一，以水为灵魂的江南园林典范。',detail:'拙政园始建于明正德年间，占地78亩。全园以水为中心，三分之二为水面。分为东、中、西三部分。中部"远香堂"为全园主体，水面开阔，荷风四面。以"虽由人作，宛自天开"著称。',ref:'《拙政园志》'},
{title:'留园',cat:'名园',tags:['苏州','清代','建筑'],desc:'以建筑空间处理见长的苏州名园。',detail:'留园始建于明万历年间，原名东园。全园面积约2万平方米，以建筑空间的巧妙处理著称。通过曲折的廊道将各景区串联，移步换景。冠云峰高6.5米，是江南园林中最高的太湖石峰。',ref:'《留园志》'},
{title:'网师园',cat:'名园',tags:['苏州','小型','精巧'],desc:'苏州最小的名园，以精巧著称，被誉为"小园极则"。',detail:'网师园占地仅半公顷，是苏州四大名园中最小的。但其布局紧凑，建筑精巧，水面处理尤为出色。月到风来亭、殿春簃等景观堪称精品。陈从周先生赞其"小园极则"。',ref:'《说园》'},
{title:'圆明园',cat:'名园',tags:['北京','皇家','万园之园'],desc:'清代皇家园林，被誉为"万园之园"，1860年被焚毁。',detail:'圆明园始建于康熙年间，历经雍正、乾隆、嘉庆、道光五朝营建，占地350公顷。由圆明园、长春园、绮春园组成，融合了中西建筑风格。1860年被英法联军焚毁，今仅存遗址。',ref:'《圆明园遗址公园》'},
{title:'湖石',cat:'元素',tags:['太湖石','瘦漏透皱','叠山'],desc:'以太湖石为代表的园林假山石，讲究"瘦、漏、透、皱"。',detail:'太湖石是园林假山的主要材料，以太湖地区所产最佳。评判标准为"瘦、漏、透、皱"：瘦指石形修长；漏指孔洞贯通；透指玲珑剔透；皱指纹理丰富。著名的有苏州留园冠云峰、上海豫园玉玲珑等。',ref:'《太湖石记》'},
{title:'花窗',cat:'元素',tags:['漏窗','图案','透景'],desc:'园林墙面上的装饰性窗洞，兼具实用与美观。',detail:'花窗又称漏窗，是苏州园林中最具特色的建筑元素之一。窗洞图案千变万化，有几何纹、植物纹、动物纹等数百种。透过花窗，内外景色相互渗透，形成"隔而不断"的空间效果。',ref:'《苏州古典园林》'},
{title:'廊桥',cat:'元素',tags:['走廊','连接','遮蔽'],desc:'有顶的走廊，连接各建筑，提供遮风避雨的通道。',detail:'廊是中国园林中重要的连接建筑，按形式分为直廊、曲廊、回廊、爬山廊等。拙政园的小飞虹是苏州唯一的廊桥。廊不仅连接建筑，其本身也是重要的观景空间。',ref:'《中国古建筑术语辞典》'},
{title:'匾额楹联',cat:'元素',tags:['文化','书法','意境'],desc:'悬挂于建筑上的题字和对联，赋予景观文化内涵。',detail:'匾额楹联是中国园林独特的人文景观。匾额点明建筑主题，楹联描绘景观意境。如拙政园"与谁同坐轩"取自苏轼词"与谁同坐？明月清风我"。这些文学元素提升了园林的文化品位。',ref:'《中国园林文化》'},
{title:'《园冶》',cat:'理论',tags:['计成','明代','造园'],desc:'中国第一本造园专著，系统阐述了造园理论和技法。',detail:'《园冶》成书于明崇祯四年（1631年），作者计成。全书分相地、立基、屋宇、装折、门窗、墙垣、铺地、掇山、选石、借景十篇。提出"虽由人作，宛自天开"的造园最高境界。',ref:'《园冶》'},
{title:'《说园》',cat:'理论',tags:['陈从周','现代','美学'],desc:'现代园林美学经典著作，以文学笔法论述园林艺术。',detail:'《说园》是陈从周先生的代表作，以优美的文笔论述中国古典园林的美学精髓。提出"动观""静观"的游赏理论，强调园林的"虚实""疏密""动静"之美。被誉为了解中国园林的必读书。',ref:'《说园》'},
{title:'风水与园林',cat:'理论',tags:['风水','选址','布局'],desc:'传统风水理论对园林选址和布局的深刻影响。',detail:'中国古典园林的选址和布局深受风水理论影响。园林多选择"背山面水"的格局，讲究"藏风聚气"。建筑布局注意朝向、高低、虚实的关系。水面宜曲折不宜直，道路宜曲不宜直，都体现了风水理念。',ref:'《风水与建筑》'}
];
var currentCat='all';
function renderList(items){
  var el=document.getElementById('list');
  document.getElementById('stats').textContent='共 '+items.length+' 条知识';
  el.innerHTML=items.map(function(d){
    return '<div class="garden-item" onclick="this.classList.toggle(\'open\')">'+
    '<div class="garden-title">'+d.title+'</div><div class="garden-meta">分类：'+d.cat+'</div>'+
    '<div class="garden-desc">'+d.desc+'</div>'+
    '<div class="garden-detail"><h4>详细介绍</h4><p>'+d.detail+'</p>'+
    '<p style="margin-top:8px;color:var(--accent2)">参考：'+d.ref+'</p>'+
    '<div>'+d.tags.map(function(t){return '<span class="garden-tag">'+t+'</span>'}).join('')+'</div></div></div>';
  }).join('');
}
function filterList(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  renderList(data.filter(function(d){
    return (d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q))&&(currentCat==='all'||d.cat===currentCat);
  }));
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterList();
}
renderList(data);
</script></body></html>
