<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 智能门锁控制</title>
<meta name="description" content="智能门锁远程控制与管理，支持密码、指纹、人脸识别解锁">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.lock-status{text-align:center;padding:30px;border-radius:var(--radius);background:var(--bg);margin-bottom:16px}
.lock-icon{font-size:4rem;margin-bottom:12px}
.lock-text{font-size:1.2rem;font-weight:600}
.lock-btn{margin-top:20px;padding:12px 24px;border-radius:8px;border:none;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
.lock-btn.lock{background:var(--success);color:#fff}
.lock-btn.unlock{background:var(--danger);color:#fff}
.lock-btn:hover{transform:scale(1.05)}
.code-input{display:flex;gap:8px;justify-content:center;margin:20px 0}
.code-input input{width:40px;height:50px;text-align:center;font-size:1.5rem;border:2px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.fingerprint{width:80px;height:80px;border-radius:50%;background:var(--bg);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin:20px auto;cursor:pointer;transition:all .2s}
.fingerprint:hover{border-color:var(--accent);background:rgba(59,130,246,.1)}
.fingerprint.scanning{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.face-id{width:80px;height:80px;border-radius:50%;background:var(--bg);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin:20px auto;cursor:pointer;font-size:2rem}
.log-list{max-height:300px;overflow-y:auto}
.log-item{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.log-item:last-child{border-bottom:none}
.log-time{color:var(--text2);font-size:.85rem}
.log-action{font-weight:600}
.log-method{padding:4px 8px;border-radius:4px;background:var(--bg);font-size:.8rem}
.settings-group{margin-bottom:16px}
.settings-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px}
.settings-group input[type=text],.settings-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
.temp-display{font-size:3rem;font-weight:700;color:var(--accent);text-align:center;margin:10px 0}
.temp-unit{font-size:1rem;color:var(--text2)}
button{padding:8px 16px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔐 智能门锁控制">
<meta property="og:description" content="智能门锁远程控制与管理，支持密码、指纹、人脸识别解锁">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🔐 智能门锁控制</h1><p>远程控制您的门锁，查看开锁记录</p></div>

<div class="cd">
<div class="lock-status" id="lockStatus">
<div class="lock-icon" id="lockIcon">🔒</div>
<div class="lock-text" id="lockText">门锁已锁定</div>
<button class="lock-btn lock" id="lockBtn" onclick="toggleLock()">解锁</button>
</div>
</div>

<div class="cd">
<h2>快捷解锁</h2>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px">
<div class="fingerprint" onclick="fingerprintUnlock()" title="指纹解锁">👆</div>
<div class="face-id" onclick="faceIdUnlock()" title="人脸识别">📷</div>
<button onclick="showPasswordInput()" style="grid-column:1/-1">密码解锁</button>
</div>
<div id="passwordSection" class="hidden" style="margin-top:16px">
<div class="code-input" id="codeInput">
<input type="text" maxlength="1" oninput="moveToNext(this,0)">
<input type="text" maxlength="1" oninput="moveToNext(this,1)">
<input type="text" maxlength="1" oninput="moveToNext(this,2)">
<input type="text" maxlength="1" oninput="moveToNext(this,3)">
<input type="text" maxlength="1" oninput="moveToNext(this,4)">
<input type="text" maxlength="1" oninput="moveToNext(this,5)">
</div>
<button onclick="passwordUnlock()" style="width:100%">确认解锁</button>
</div>
</div>

<div class="cd">
<h2>温度显示</h2>
<div class="temp-display"><span id="tempValue">24.5</span><span class="temp-unit">°C</span></div>
<div style="text-align:center;color:var(--text2);font-size:.85rem">门锁内置温度传感器</div>
</div>

<div class="cd">
<h2>开锁记录</h2>
<div class="log-list" id="logList"></div>
</div>

<div class="cd">
<h2>门锁设置</h2>
<div class="settings-group">
<label>门锁名称</label>
<input type="text" id="lockName" value="前门门锁" onchange="saveSettings()">
</div>
<div class="settings-group">
<label>自动锁定时间（秒）</label>
<select id="autoLock" onchange="saveSettings()">
<option value="5">5秒</option>
<option value="10" selected>10秒</option>
<option value="30">30秒</option>
<option value="60">60秒</option>
</select>
</div>
<div class="settings-group">
<label>临时密码</label>
<div style="display:flex;gap:8px">
<input type="text" id="tempPassword" placeholder="设置临时密码" readonly>
<button onclick="generateTempPassword()">生成</button>
</div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let isLocked=JSON.parse(localStorage.getItem('sl_locked')||'true');
let logs=JSON.parse(localStorage.getItem('sl_logs')||'[]');
let settings=JSON.parse(localStorage.getItem('sl_settings')||'{"name":"前门门锁","autoLock":"10"}');

function save(){localStorage.setItem('sl_locked',JSON.stringify(isLocked));}
function saveLogs(){localStorage.setItem('sl_logs',JSON.stringify(logs.slice(-20)));}
function saveSettings(){localStorage.setItem('sl_settings',JSON.stringify(settings));}

function updateUI(){
  $('lockIcon').textContent=isLocked?'🔒':'🔓';
  $('lockText').textContent=isLocked?'门锁已锁定':'门锁已解锁';
  $('lockBtn').textContent=isLocked?'解锁':'锁定';
  $('lockBtn').className='lock-btn '+(isLocked?'unlock':'lock');
  $('lockName').value=settings.name;
  $('autoLock').value=settings.autoLock;
}

function toggleLock(){
  isLocked=!isLocked;
  addLog(isLocked?'手动锁定':'手动解锁','手动');
  save();
  updateUI();
  if(!isLocked){
    const autoLockTime=parseInt(settings.autoLock)*1000;
    setTimeout(()=>{
      if(!isLocked){
        isLocked=true;
        addLog('自动锁定','自动');
        save();
        updateUI();
      }
    },autoLockTime);
  }
}

function fingerprintUnlock(){
  if(!isLocked)return;
  isLocked=false;
  addLog('指纹解锁','指纹');
  save();
  updateUI();
  startAutoLock();
}

function faceIdUnlock(){
  if(!isLocked)return;
  isLocked=false;
  addLog('人脸识别解锁','人脸');
  save();
  updateUI();
  startAutoLock();
}

function showPasswordInput(){
  $('passwordSection').classList.toggle('hidden');
}

function moveToNext(input,index){
  if(input.value.length===1){
    const inputs=$('codeInput').querySelectorAll('input');
    if(index<inputs.length-1)inputs[index+1].focus();
  }
}

function passwordUnlock(){
  const inputs=$('codeInput').querySelectorAll('input');
  const code=Array.from(inputs).map(i=>i.value).join('');
  if(code.length===6){
    isLocked=false;
    addLog('密码解锁','密码');
    save();
    updateUI();
    inputs.forEach(i=>i.value='');
    $('passwordSection').classList.add('hidden');
    startAutoLock();
  }
}

function startAutoLock(){
  const autoLockTime=parseInt(settings.autoLock)*1000;
  setTimeout(()=>{
    if(!isLocked){
      isLocked=true;
      addLog('自动锁定','自动');
      save();
      updateUI();
    }
  },autoLockTime);
}

function addLog(action,method){
  const now=new Date();
  logs.unshift({time:now.toLocaleString('zh-CN'),action,method});
  saveLogs();
  renderLogs();
}

function renderLogs(){
  $('logList').innerHTML=logs.map(log=>`
    <div class="log-item">
      <div><div class="log-action">${log.action}</div><div class="log-time">${log.time}</div></div>
      <div class="log-method">${log.method}</div>
    </div>
  `).join('');
}

function generateTempPassword(){
  const pwd=Math.floor(100000+Math.random()*900000).toString();
  $('tempPassword').value=pwd;
}

function updateTemp(){
  const base=24.5;
  const variation=(Math.random()-0.5)*0.5;
  $('tempValue').textContent=(base+variation).toFixed(1);
}

updateUI();
renderLogs();
setInterval(updateTemp,10000);
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
