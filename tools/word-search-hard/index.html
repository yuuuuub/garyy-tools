<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>困难找单词</title>
<meta name="description" content="困难找单词，增加更多隐藏词汇提高难度"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#8b5cf6;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8em;margin-bottom:8px;text-align:center}
.subtitle{color:#8b949e;margin-bottom:20px;text-align:center;font-size:.9em}
.game-area{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:100%;margin-bottom:16px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:1em;transition:all .2s}
.btn:hover{opacity:.9;transform:scale(1.02)}
.btn:active{transform:scale(.98)}
.btn-sm{padding:6px 14px;font-size:.85em}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-yellow{background:var(--yellow);color:#000}.btn-orange{background:var(--orange)}
.flex{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;gap:4px}
.info{text-align:center;color:#8b949e;margin:12px 0;font-size:.95em}
.result{text-align:center;font-size:1.2em;margin:16px 0;padding:16px;border-radius:8px;background:var(--bg);min-height:40px}
.token{display:inline-block;padding:4px 10px;margin:3px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.token:hover{border-color:var(--accent)}
.token.active{background:var(--accent);border-color:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media(max-width:480px){body{padding:12px}.game-area{padding:16px}h1{font-size:1.4em}}
</style><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<h1>困难找单词</h1><p class="subtitle">12x12找单词</p>
<div class="game-area"><div id="board" class="grid" style="grid-template-columns:repeat(12,30px);margin:0 auto;width:fit-content"></div>
<div id="words" style="margin:16px 0;text-align:center"></div>
<div class="flex"><button class="btn" onclick="newGame()">新游戏</button><button class="btn btn-yellow" onclick="showHint()">提示</button></div>
<div class="result" id="result"></div>
<script>
const S=12,WC=8;
const WORDS=['苹果','香蕉','橙子','西瓜','葡萄','草莓','芒果','熊猫','老虎','狮子','大象','猴子','兔子','鲸鱼','海豚','蝴蝶','彩虹','星星','月亮','太阳','白云','青山','绿水','清风','森林','草原','高山','大海','冰川','春风'];
let grid,wds=[];
function init(){grid=Array(S).fill(null).map(()=>Array(S).fill(''));wds=[];
const avail=[...WORDS].sort(()=>Math.random()-.5);
for(let i=0;i<Math.min(WC,avail.length);i++){const w=avail[i];wds.push(w);
const dir=Math.random()<.5;let r=Math.floor(Math.random()*S),c=Math.floor(Math.random()*(S-w.length+1));
if(dir)r=Math.floor(Math.random()*(S-w.length+1));
for(let j=0;j<w.length;j++){const nr=dir?r+j:r,nc=dir?c:c+j;if(nr<S&&nc<S)grid[nr][nc]=w[j];}}
render();}
function render(){const b=document.getElementById('board');b.innerHTML='';
for(let r=0;r<S;r++)for(let c=0;c<S;c++){const d=document.createElement('div');
d.style.cssText='width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:3px;font-size:.85em;cursor:pointer;background:'+(grid[r][c]?'var(--card)':'#1a1e24');
d.textContent=grid[r][c];d.onclick=()=>d.classList.toggle('active');b.appendChild(d);}
document.getElementById('words').innerHTML='找单词: '+wds.map(w=>'<span class="token">'+w+'</span>').join('');}
function showHint(){const b=document.getElementById('board').children;
for(let i=0;i<b.length;i++)if(b[i].textContent){b[i].style.background='var(--accent)';setTimeout(()=>b[i].style.background='',800);break;}}
function newGame(){init();document.getElementById('result').innerHTML='找到所有单词！';}
init();</script>
</div><script src="../i18n.js"></script>
</body></html>
