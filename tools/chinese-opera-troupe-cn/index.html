<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国戏曲剧团大全 - Chinese Opera Troupe Encyclopedia</title>
<meta name="description" content="中国戏曲剧团大全，收录国家级戏曲院团的历史沿革、代表剧目与艺术流派">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国戏曲剧团大全 - Chinese Opera Troupe Encyclopedia">
<meta property="og:description" content="中国戏曲剧团大全，收录国家级戏曲院团的历史沿革、代表剧目与艺术流派">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-opera-troupe-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#14b8a6;--accent2:#0d9488}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#0f766e;--accent2:#115e59}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#051515 0%,#0a2525 50%,#103535 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #1a5a5a;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#14b8a6,#2dd4bf,#0d9488,#0f766e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.troupe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.troupe-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.troupe-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.troupe-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.troupe-card .tr-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.troupe-card .tr-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(20,184,166,0.15);color:var(--accent)}
.troupe-card .tr-name{font-size:1.3em;font-weight:bold}
.troupe-card .tr-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.troupe-card .tr-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.troupe-card .tr-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.troupe-card .tr-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.troupe-card .tr-detail strong{color:var(--text)}
.troupe-card .tr-artists{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.troupe-card .tr-artists .ar-label{font-size:0.8em;color:var(--accent);margin-bottom:6px}
.troupe-card .tr-artists .ar-list{display:flex;flex-wrap:wrap;gap:6px}
.troupe-card .tr-artists .ar-tag{font-size:0.75em;padding:3px 10px;border-radius:10px;background:rgba(20,184,166,0.08);color:var(--accent);border:1px solid rgba(20,184,166,0.2)}
.troupe-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.troupe-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🏛️ 中国戏曲剧团大全</h1>
<p>Chinese Opera Troupe Encyclopedia — 了解国家级戏曲院团的历史沿革与艺术成就</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索剧团、流派或代表人物...（如"梅兰芳""国家京剧院""越剧"）" title="Enter键搜索">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="国家级院团">国家级院团</button>
<button class="filter-btn" data-filter="地方院团">地方院团</button>
<button class="filter-btn" data-filter="民间剧团">民间剧团</button>
<button class="filter-btn" data-filter="戏曲学校">戏曲学校</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="troupe-grid" id="troupeGrid"></div>
</div>
<footer>中国戏曲剧团大全 — 梨园传承 · 薪火不息 · garyy.top</footer>
<script>
const troupeData=[
{name:"国家京剧院",category:"国家级院团",icon:"🏛️",subtitle:"京剧最高殿堂",location:"北京",founded:"1955年",level:"国家级",description:"国家京剧院是文化和旅游部直属的国家京剧院团，前身是中国京剧院。培养了大批京剧表演艺术家，创排了众多经典剧目。",artists:["梅兰芳","李少春","袁世海","杜近芳"]},
{name:"北京京剧院",category:"国家级院团",icon:"🏛️",subtitle:"梅派艺术传承",location:"北京",founded:"1979年",level:"市级重点",description:"北京京剧院是以梅兰芳大师为代表的京剧艺术传承基地，拥有梅、程、荀、张等多个流派的传承人。",artists:["梅葆玖","谭元寿","张学津"]},
{name:"上海京剧院",category:"国家级院团",icon:"🏛️",subtitle:"海派京剧重镇",location:"上海",founded:"1955年",level:"国家级",description:"上海京剧院是海派京剧的重要传承单位，以海纳百川的创新精神著称，创排了《曹操与杨修》等新编历史剧。",artists:["尚长荣","关栋天","史依弘"]},
{name:"中国国家话剧院",category:"国家级院团",icon:"🎭",subtitle:"话剧最高殿堂",location:"北京",founded:"2001年",level:"国家级",description:"中国国家话剧院由中国青年艺术剧院和中央实验话剧院合并组建，是中国话剧艺术的最高表演团体。",artists:["田沁鑫","倪大红","韩童生"]},
{name:"北方昆曲剧院",category:"国家级院团",icon:"🏛️",subtitle:"北方昆曲传承",location:"北京",founded:"1957年",level:"国家级",description:"北方昆曲剧院是北方昆曲艺术的唯一专业院团，致力于昆曲艺术的传承与创新，培养了大批昆曲表演人才。",artists:["韩世昌","白云生","蔡瑶铣"]},
{name:"上海昆剧团",category:"国家级院团",icon:"🏛️",subtitle:"南昆正宗",location:"上海",founded:"1978年",level:"国家级",description:"上海昆剧团是南昆艺术的重要传承单位，以全本大戏和折子戏并重，培养了多代昆曲表演艺术家。",artists:["蔡正仁","岳美缇","华文漪"]},
{name:"浙江省昆剧团",category:"地方院团",icon:"🏛️",subtitle:"浙昆新声",location:"杭州",founded:"1956年",level:"省级",description:"浙江省昆剧团继承了昆曲\"浙昆\"流派的艺术传统，在传承经典的同时积极创排新剧目。",artists:["周传瑛","王世瑶"]},
{name:"绍兴小百花越剧团",category:"地方院团",icon:"🏛️",subtitle:"越剧之乡",location:"绍兴",founded:"1986年",level:"市级",description:"绍兴小百花越剧团以青春靓丽的阵容和精湛的演技著称，是越剧界的一支劲旅。",artists:["吴凤花","吴素英","陈飞"]},
{name:"上海越剧院",category:"国家级院团",icon:"🏛️",subtitle:"越剧发源地",location:"上海",founded:"1955年",level:"国家级",description:"上海越剧院是越剧艺术的重要传承单位，拥有袁（雪芬）、傅（全香）、王（文娟）等多个流派的传承人。",artists:["袁雪芬","傅全香","王文娟","徐玉兰"]},
{name:"安徽省黄梅戏剧院",category:"地方院团",icon:"🏛️",subtitle:"黄梅戏故乡",location:"合肥",founded:"1953年",level:"省级",description:"安徽省黄梅戏剧院是黄梅戏艺术的最高表演团体，传承了严凤英、王少舫等艺术家的经典唱腔。",artists:["严凤英","王少舫","马兰","韩再芬"]},
{name:"河南省豫剧院",category:"地方院团",icon:"🏛️",subtitle:"豫剧故乡",location:"郑州",founded:"1956年",level:"省级",description:"河南省豫剧院是豫剧艺术的最高表演团体，拥有常（香玉）、陈（素真）、崔（兰田）等多个流派。",artists:["常香玉","陈素真","崔兰田","牛得草"]},
{name:"中国戏曲学院",category:"戏曲学校",icon:"🎓",subtitle:"戏曲教育最高学府",location:"北京",founded:"1950年",level:"本科院校",description:"中国戏曲学院是中国唯一一所独立建制的戏曲高等艺术院校，被誉为\"中国戏曲教育的摇篮\"。",artists:["培养了大批戏曲表演、导演、编剧人才"]},
{name:"上海戏剧学院",category:"戏曲学校",icon:"🎓",subtitle:"综合艺术院校",location:"上海",founded:"1945年",level:"本科院校",description:"上海戏剧学院设有戏曲学院，培养戏曲表演、导演、编剧等专业人才，是重要的戏曲教育基地。",artists:["培养了大批戏曲与话剧人才"]},
{name:"北京民间京剧院团",category:"民间剧团",icon:"🎭",subtitle:"民间传承力量",location:"北京",founded:"2000年代",level:"民间",description:"北京有多支民间京剧院团和票房，是京剧艺术在民间传承的重要力量，活跃于各大剧场和社区。",artists:["众多民间京剧爱好者与票友"]}
];
function getStats(data){const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});return cats}
function renderStats(data){const stats=getStats(data);document.getElementById('statsOverview').innerHTML=`<div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">剧团总数</div></div>`+Object.entries(stats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}
function renderCards(data){document.getElementById('troupeGrid').innerHTML=data.map(m=>`<div class="troupe-card" data-category="${m.category}"><div class="tr-header"><div class="tr-icon">${m.icon}</div><div><div class="tr-name">${m.name}</div><div class="tr-sub">${m.subtitle}</div></div></div><div class="tr-meta"><span>${m.location}</span><span>创立：${m.founded}</span><span>${m.level}</span></div><div class="tr-detail">${m.description}</div><div class="tr-artists"><div class="ar-label">🎭 代表人物</div><div class="ar-list">${m.artists.map(a=>`<span class="ar-tag">${a}</span>`).join('')}</div></div></div>`).join('')}
function filterCards(){const q=document.getElementById('searchInput').value.toLowerCase();const f=document.querySelector('.filter-btn.active').dataset.filter;const filtered=troupeData.filter(m=>{const matchF=f==='all'||m.category===f;const matchQ=!q||m.name.toLowerCase().includes(q)||m.description.toLowerCase().includes(q)||m.location.toLowerCase().includes(q)||m.artists.some(a=>a.toLowerCase().includes(q));return matchF&&matchQ});renderCards(filtered);renderStats(filtered)}
document.getElementById('searchInput').addEventListener('input',filterCards);
document.getElementById('filterRow').addEventListener('click',e=>{if(e.target.classList.contains('filter-btn')){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');filterCards()}});
renderCards(troupeData);renderStats(troupeData);
</script>
</body>
</html>
