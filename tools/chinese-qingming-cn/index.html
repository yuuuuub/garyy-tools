<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>清明节踏青祭祖</title>
<meta name="description" content="清明节踏青祭祖 - 清明诗词、传统习俗、时令美食、踏青指南">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<meta name="robots" content="index,follow">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.hidden{display:none}
.poem-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px;transition:all var(--transition)}
.poem-card:hover{border-color:var(--green)}
.poem-title{font-weight:700;margin-bottom:4px}
.poem-author{color:var(--green);font-size:.85rem;margin-bottom:8px}
.poem-text{color:var(--text2);font-size:.9rem;line-height:1.8;white-space:pre-line}
.custom-list{display:flex;flex-direction:column;gap:10px}
.custom-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all var(--transition)}
.custom-item:hover{border-color:var(--green)}
.custom-header{display:flex;align-items:center;gap:10px}
.custom-icon{font-size:1.5rem}
.custom-name{font-weight:600}
.custom-desc{color:var(--text2);font-size:.85rem;margin-top:4px}
.custom-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--text2);font-size:.85rem;line-height:1.6;display:none}
.custom-detail.show{display:block}
.nature-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.nature-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;transition:all var(--transition)}
.nature-item:hover{border-color:var(--green);transform:translateY(-2px)}
.nature-emoji{font-size:2rem;display:block;margin-bottom:6px}
.nature-name{font-weight:600;font-size:.9rem}
.nature-desc{color:var(--text2);font-size:.8rem;margin-top:4px}
.food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.food-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;display:flex;align-items:center;gap:10px}
.food-emoji{font-size:1.5rem}
.food-name{font-weight:600;font-size:.9rem}
.food-desc{color:var(--text2);font-size:.8rem}
.wish-board{display:flex;flex-direction:column;gap:10px}
.wish-input{display:flex;gap:8px}
.wish-input input{flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
.wish-input input:focus{outline:none;border-color:var(--green)}
.wish-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.wish-text{font-size:.9rem}
.wish-time{font-size:.75rem;color:var(--text2)}
.wish-del{color:var(--red);cursor:pointer;font-size:.8rem}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.countdown-box{display:flex;gap:16px;justify-content:center;margin:16px 0}
.countdown-item{text-align:center}
.countdown-num{font-size:2rem;font-weight:700;color:var(--green);line-height:1}
.countdown-label{font-size:.75rem;color:var(--text2);margin-top:4px}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div style="position:fixed;top:8px;right:8px;z-index:9999"><button class="btn btn-secondary" onclick="toggleTheme()" style="font-size:.8rem;padding:4px 10px" id="themeBtn">🌙 暗色</button></div>
<div class="container">
<h1>🌸 清明节踏青祭祖</h1>
<p class="sub">清明诗词 · 传统习俗 · 时令美食 · 踏青指南</p>

<div class="card" style="text-align:center">
<h3 style="margin-bottom:4px">🌿 距离清明节</h3>
<div class="countdown-box" id="countdown"></div>
</div>

<div class="tabs">
<button class="btn btn-primary" onclick="showTab('poems')" id="tabPoems">📜 诗词</button>
<button class="btn btn-secondary" onclick="showTab('customs')" id="tabCustoms">🎊 习俗</button>
<button class="btn btn-secondary" onclick="showTab('food')" id="tabFood">🍃 时令美食</button>
<button class="btn btn-secondary" onclick="showTab('nature')" id="tabNature">🌳 踏青指南</button>
<button class="btn btn-secondary" onclick="showTab('wish')" id="tabWish">🕯️ 寄语</button>
</div>

<div id="poemsView"></div>
<div id="customsView" class="hidden"><div class="custom-list" id="customList"></div></div>
<div id="foodView" class="hidden"><div class="food-grid" id="foodGrid"></div></div>
<div id="natureView" class="hidden"><div class="nature-grid" id="natureGrid"></div></div>
<div id="wishView" class="hidden">
<div class="card">
<h3 style="margin-bottom:12px">🕯️ 思念寄语</h3>
<div class="wish-board">
<div class="wish-input"><input type="text" id="wishInput" placeholder="写下你的思念与祝福..." onkeydown="if(event.key==='Enter')addWish()"><button class="btn btn-primary" onclick="addWish()">添加</button></div>
<div id="wishList"></div>
</div>
</div>
</div>
</div>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script src="../i18n.js" defer></script>
<script>
var poems=[
{title:'清明',author:'杜牧（唐）',text:'清明时节雨纷纷，路上行人欲断魂。\n借问酒家何处有？牧童遥指杏花村。'},
{title:'寒食',author:'韩翃（唐）',text:'春城无处不飞花，寒食东风御柳斜。\n日暮汉宫传蜡烛，轻烟散入五侯家。'},
{title:'途中寒食',author:'宋之问（唐）',text:'马上逢寒食，途中属暮春。\n可怜江浦望，不见洛阳人。'},
{title:'清明夜',author:'白居易（唐）',text:'好风胧月清明夜，碧砌红轩刺史家。\n独绑花枝漫自归，明朝应是雨纷纷。'},
{title:'苏堤清明即事',author:'吴惟信（宋）',text:'梨花风起正清明，游子寻春半出城。\n日暮笙歌收拾去，万株杨柳属流莺。'}
];
var customs=[
{name:'扫墓祭祖',icon:'🪦',desc:'清明节祭扫先人墓地，表达思念',detail:'清明扫墓是最重要的祭祀活动。传统习俗包括：上坟除草、添土、烧纸钱、摆供品、磕头。现代增加了献花、鞠躬等文明祭祀方式。'},
{name:'踏青',icon:'🌸',desc:'清明时节春暖花开，外出郊游赏景',detail:'清明踏青又叫"春游"或"探春"。清明前后，万物复苏，正是外出赏花踏青的好时节。踏青时还可以放风筝、荡秋千、蹴鞠等。'},
{name:'放风筝',icon:'🪁',desc:'清明放风筝，放走晦气迎好运',detail:'清明放风筝是古老习俗。人们会在风筝上写下祝福或病痛，放飞后剪断线让它飘走，寓意放走晦气和疾病。'},
{name:'荡秋千',icon:'🎠',desc:'清明荡秋千，祈求健康平安',detail:'荡秋千是清明节的传统娱乐活动。据说荡秋千可以驱除百病，越荡越高象征步步高升。古代秋千用树枝搭建，挂在大树上。'},
{name:'插柳',icon:'🌿',desc:'清明插柳戴柳，辟邪祈福',detail:'清明插柳习俗由来已久。柳树生命力强，插柳象征生命力的延续。人们会在门前插柳枝，头上戴柳环，据说可以辟邪。'}
];
var foods=[
{emoji:'🟢',name:'青团',desc:'艾草汁和糯米粉制成的绿色糕点'},
{emoji:'🫓',name:'馓子',desc:'油炸面食，酥脆可口'},
{emoji:'🥚',name:'清明蛋',desc:'煮熟的鸡蛋，象征生命'},
{emoji:'🍵',name:'明前茶',desc:'清明前采制的茶叶，品质最佳'},
{emoji:'🌿',name:'艾草粿',desc:'用艾草做的糯米饭团'},
{emoji:'🐟',name:'螺蛳',desc:'清明前后螺蛳最肥美'}
];
var natureItems=[
{emoji:'🌸',name:'樱花',desc:'花期3-4月'},
{emoji:'🌼',name:'油菜花',desc:'花期3-4月'},
{emoji:'🌺',name:'桃花',desc:'花期3-4月'},
{emoji:'🍃',name:'柳树',desc:'新芽初绽'},
{emoji:'🦅',name:'燕子',desc:'春归筑巢'},
{emoji:'🐛',name:'蝴蝶',desc:'翩翩起舞'},
{emoji:'☀️',name:'暖阳',desc:'春光正好'},
{emoji:'🌧️',name:'春雨',desc:'润物无声'}
];
var wishes=JSON.parse(localStorage.getItem('qingming_wishes')||'[]');

function updateCountdown(){
  var now=new Date();var year=now.getFullYear();
  var qm=new Date(year,3,5);
  if(now>qm)qm=new Date(year+1,3,5);
  var diff=qm-now;var d=Math.floor(diff/864e5);
  document.getElementById('countdown').innerHTML='<div class="countdown-item"><div class="countdown-num">'+d+'</div><div class="countdown-label">天</div></div>';
}

function showTab(tab){
  ['poemsView','customsView','foodView','natureView','wishView'].forEach(function(v){document.getElementById(v).classList.add('hidden')});
  document.getElementById(tab+'View').classList.remove('hidden');
  ['tabPoems','tabCustoms','tabFood','tabNature','tabWish'].forEach(function(id){document.getElementById(id).className='btn btn-secondary'});
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).className='btn btn-primary';
  if(tab==='poems')renderPoems();
  if(tab==='wish')renderWishes();
}

function renderPoems(){
  var h='';poems.forEach(function(p){
    h+='<div class="card poem-card"><div class="poem-title">'+p.title+'</div><div class="poem-author">'+p.author+'</div><div class="poem-text">'+p.text+'</div></div>';
  });document.getElementById('poemsView').innerHTML=h;
}

function renderCustoms(){
  var h='';
  customs.forEach(function(c,i){
    h+='<div class="custom-item" onclick="toggleDetail('+i+')">';
    h+='<div class="custom-header"><span class="custom-icon">'+c.icon+'</span><div><div class="custom-name">'+c.name+'</div><div class="custom-desc">'+c.desc+'</div></div></div>';
    h+='<div class="custom-detail" id="cd-'+i+'">'+c.detail+'</div></div>';
  });
  document.getElementById('customList').innerHTML=h;
}

function toggleDetail(idx){var el=document.getElementById('cd-'+idx);if(el)el.classList.toggle('show')}

function renderFood(){
  var h='';foods.forEach(function(f){
    h+='<div class="food-item"><span class="food-emoji">'+f.emoji+'</span><div><div class="food-name">'+f.name+'</div><div class="food-desc">'+f.desc+'</div></div></div>';
  });document.getElementById('foodGrid').innerHTML=h;
}

function renderNature(){
  var h='';natureItems.forEach(function(n){
    h+='<div class="nature-item"><span class="nature-emoji">'+n.emoji+'</span><div class="nature-name">'+n.name+'</div><div class="nature-desc">'+n.desc+'</div></div>';
  });document.getElementById('natureGrid').innerHTML=h;
}

function addWish(){
  var inp=document.getElementById('wishInput');
  var text=inp.value.trim();
  if(!text)return;
  wishes.unshift({text:text,time:new Date().toLocaleString('zh-CN')});
  localStorage.setItem('qingming_wishes',JSON.stringify(wishes));
  inp.value='';renderWishes();
}

function deleteWish(i){
  wishes.splice(i,1);
  localStorage.setItem('qingming_wishes',JSON.stringify(wishes));
  renderWishes();
}

function renderWishes(){
  var h='';
  wishes.forEach(function(w,i){
    h+='<div class="wish-item"><div><div class="wish-text">'+w.text+'</div><div class="wish-time">'+w.time+'</div></div><span class="wish-del" onclick="deleteWish('+i+')">✕</span></div>';
  });
  document.getElementById('wishList').innerHTML=h||'<p style="text-align:center;color:var(--text2);padding:20px">写下你的思念与祝福...</p>';
}

function toggleTheme(){
  var html=document.documentElement;var isLight=html.getAttribute('data-theme')==='light';
  html.setAttribute('data-theme',isLight?'dark':'light');
  document.getElementById('themeBtn').textContent=isLight?'☀️ 亮色':'🌙 暗色';
}

renderCustoms();renderFood();renderNature();renderPoems();renderWishes();updateCountdown();setInterval(updateCountdown,36e5);
window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});
</script>
</body>
</html>
