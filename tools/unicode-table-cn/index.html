<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unicode字符表 - 在线Unicode码点查询</title>
<meta property="og:title" content="Unicode字符表 - 在线Unicode码点查询">
<meta property="og:description" content="Unicode字符表 - 在线Unicode码点查询 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线Unicode字符表 - 查询Unicode码点、字符属性、名称，支持中日韩字符、Emoji等">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<script src="../i18n.js" defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {--green:#238636;--red:#ef4444;--blue:#3b82f6;
  --bg: #0d1117; --bg-card: #161b22; --bg-input: #0d1117;
  --border: #30363d; --text: #e6edf3; --text-secondary: #8b949e;
  --accent: #58a6ff; --accent-hover: #79c0ff; --danger: #f85149;
  --success: #3fb950; --warning: #d2991d; --radius: 8px;
}
[data-theme="light"] { --bg: #f6f8fa; --bg-card: #fff; --bg-input: #fff; --border: #d0d7de; --text: #1f2328; --text-secondary: #656d76; --accent: #0969da; --accent-hover: #0550ae; --danger: #cf222e; --success: #1a7f37; --warning: #9a6700; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; line-height: 1.6; }
.container { max-width: 1000px; margin: 0 auto; }
h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), #bc8cff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 8px; }
.subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 32px; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
.card h2 { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
label { display: block; font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 4px; margin-top: 12px; }
input, select { padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.95rem; outline: none; }
input:focus, select:focus { border-color: var(--accent); }
.row { display: flex; gap: 12px; align-items: flex-end; }
.row > * { flex: 1; }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: 0.2s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 6px 12px; font-size: 0.8rem; }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 0.9rem; z-index: 1000; animation: slideIn 0.3s ease; }
.toast-success { background: var(--success); }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.search-area { display: flex; gap: 12px; align-items: center; }
.search-area input { flex: 1; }
.char-detail { display: flex; gap: 24px; padding: 20px; background: var(--bg-input); border-radius: 8px; margin-top: 12px; flex-wrap: wrap; }
.char-preview { font-size: 4rem; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--border); border-radius: 8px; background: var(--bg-card); flex-shrink: 0; }
.char-info { flex: 1; min-width: 200px; }
.char-info .row-item { display: flex; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
.char-info .row-item .label { color: var(--text-secondary); width: 120px; flex-shrink: 0; }
.char-info .row-item .value { font-family: monospace; word-break: break-all; }
.block-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; max-height: 120px; overflow-y: auto; }
.block-tab { padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-size: 0.75rem; background: transparent; color: var(--text-secondary); transition: 0.2s; white-space: nowrap; }
.block-tab:hover { border-color: var(--accent); color: var(--accent); }
.block-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 4px; }
.char-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 4px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; transition: 0.2s; min-height: 52px; }
.char-cell:hover { border-color: var(--accent); background: rgba(88,166,255,0.1); }
.char-cell .char { font-size: 1.3rem; line-height: 1; }
.char-cell .code { font-size: 0.6rem; color: var(--text-secondary); font-family: monospace; }
.pagination { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
.char-cell.selected { border-color: var(--accent); background: rgba(88,166,255,0.15); }
.input-area { margin-bottom: 16px; }
.input-area textarea { font-family: monospace; font-size: 1rem; }
.result-codes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.result-code { padding: 8px 12px; background: var(--bg-input); border-radius: 6px; font-family: monospace; font-size: 0.85rem; cursor: pointer; border: 1px solid var(--border); transition: 0.2s; }
.result-code:hover { border-color: var(--accent); }
.result-code .label { font-size: 0.7rem; color: var(--text-secondary); display: block; margin-bottom: 2px; }

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
  <h1>📊 Unicode字符表</h1>
  <p class="subtitle">Unicode码点查询 · 字符属性 · 中日韩字符 · Emoji</p>

  <div class="card">
    <h2>🔍 字符查询</h2>
    <div class="input-area">
      <label>输入字符或码点（如 U+4E2D 或 中）</label>
      <input id="search-input" placeholder="输入字符或 U+XXXX 格式码点" oninput="searchChar()">
    </div>
    <div class="char-detail" id="char-detail" style="display:none">
      <div class="char-preview" id="char-preview"></div>
      <div class="char-info" id="char-info"></div>
    </div>
  </div>

  <div class="card">
    <h2>📝 文本分析</h2>
    <textarea id="text-analyze" rows="3" placeholder="输入文本，分析每个字符的Unicode码点" oninput="analyzeText()"></textarea>
    <div class="result-codes" id="text-codes"></div>
  </div>

  <div class="card">
    <h2>📚 Unicode区块浏览</h2>
    <div class="block-tabs" id="block-tabs"></div>
    <div class="char-grid" id="char-grid"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<script>
let currentBlock = 'CJK统一汉字';
let currentPage = 0;
const PAGE_SIZE = 256;

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

const BLOCKS = {
  '基本拉丁': { start: 0x0020, end: 0x007E, desc: 'ASCII字符' },
  '拉丁补充': { start: 0x00A0, end: 0x00FF, desc: '拉丁扩展' },
  '希腊字母': { start: 0x0370, end: 0x03FF, desc: '希腊/科普特' },
  '西里尔字母': { start: 0x0400, end: 0x04FF, desc: '俄文等' },
  '中文标点': { start: 0x3000, end: 0x303F, desc: 'CJK符号' },
  '全角ASCII': { start: 0xFF01, end: 0xFF5E, desc: '全角字母数字' },
  'CJK统一汉字': { start: 0x4E00, end: 0x9FFF, desc: '中文汉字' },
  'CJK扩展A': { start: 0x3400, end: 0x4DBF, desc: '扩展汉字' },
  'CJK扩展B': { start: 0x20000, end: 0x2A6DF, desc: '生僻汉字' },
  '平假名': { start: 0x3040, end: 0x309F, desc: '日文平假名' },
  '片假名': { start: 0x30A0, end: 0x30FF, desc: '日文片假名' },
  '韩文字母': { start: 0xAC00, end: 0xD7AF, desc: '韩文音节' },
  '数学运算符': { start: 0x2200, end: 0x22FF, desc: '数学符号' },
  '箭头': { start: 0x2190, end: 0x21FF, desc: '箭头符号' },
  '制表符': { start: 0x2500, end: 0x257F, desc: '方框绘制' },
  '几何图形': { start: 0x25A0, end: 0x25FF, desc: '几何形状' },
  '杂项符号': { start: 0x2600, end: 0x26FF, desc: '各类符号' },
  'Emoji基础': { start: 0x1F300, end: 0x1F5FF, desc: '杂项Emoji' },
  'Emoji表情': { start: 0x1F600, end: 0x1F64F, desc: '表情Emoji' },
  'Emoji修饰': { start: 0x1F680, end: 0x1F6FF, desc: '交通/地标' }
};

function searchChar() {
  const input = document.getElementById('search-input').value.trim();
  const detail = document.getElementById('char-detail');
  if (!input) { detail.style.display = 'none'; return; }

  let codePoint;
  let char;

  if (input.startsWith('U+') || input.startsWith('u+')) {
    codePoint = parseInt(input.slice(2), 16);
    char = String.fromCodePoint(codePoint);
  } else if (/^[0-9]+$/.test(input)) {
    codePoint = parseInt(input);
    char = String.fromCodePoint(codePoint);
  } else {
    char = input[0];
    codePoint = char.codePointAt(0);
  }

  if (isNaN(codePoint) || codePoint < 0 || codePoint > 0x10FFFF) {
    detail.style.display = 'none';
    return;
  }

  detail.style.display = 'flex';
  document.getElementById('char-preview').textContent = char;
  document.getElementById('char-preview').style.fontSize = '4rem';

  const hex = codePoint.toString(16).toUpperCase().padStart(4, '0');
  const utf8 = [];
  for (const b of new TextEncoder().encode(char)) utf8.push('0x' + b.toString(16).toUpperCase().padStart(2, '0'));
  const category = getCharCategory(codePoint);
  const block = getCharBlock(codePoint);

  document.getElementById('char-info').innerHTML = `
    <div class="row-item"><span class="label">字符</span><span class="value" style="font-size:1.2rem">${esc(char)}</span></div>
    <div class="row-item"><span class="label">码点 (U+)</span><span class="value">U+${hex}</span></div>
    <div class="row-item"><span class="label">十进制</span><span class="value">${codePoint}</span></div>
    <div class="row-item"><span class="label">UTF-8</span><span class="value">${utf8.join(' ')}</span></div>
    <div class="row-item"><span class="label">UTF-16</span><span class="value">0x${codePoint.toString(16).toUpperCase().padStart(4, '0')}</span></div>
    <div class="row-item"><span class="label">类别</span><span class="value">${category}</span></div>
    <div class="row-item"><span class="label">区块</span><span class="value">${block}</span></div>
    <div class="row-item"><span class="label">HTML实体</span><span class="value">&amp;#${codePoint};</span></div>
    <div class="row-item"><span class="label">CSS</span><span class="value">\\${hex}</span></div>
    <div class="row-item"><span class="label">复制</span><span class="value" style="color:var(--accent);cursor:pointer" onclick="navigator.clipboard.writeText('${esc(char)}');toast('已复制')">点击复制字符</span></div>`;
}

function getCharCategory(cp) {
  if (cp >= 0x4E00 && cp <= 0x9FFF) return 'CJK统一汉字 (Lo)';
  if (cp >= 0x3040 && cp <= 0x309F) return '平假名 (Lo)';
  if (cp >= 0x30A0 && cp <= 0x30FF) return '片假名 (Lo)';
  if (cp >= 0xAC00 && cp <= 0xD7AF) return '韩文音节 (Lo)';
  if (cp >= 0x0041 && cp <= 0x005A) return '大写字母 (Lu)';
  if (cp >= 0x0061 && cp <= 0x007A) return '小写字母 (Ll)';
  if (cp >= 0x0030 && cp <= 0x0039) return '数字 (Nd)';
  if (cp >= 0x1F300) return 'Emoji (So)';
  if (cp >= 0x2000 && cp <= 0x206F) return '通用标点 (Pc/Pd/Pe)';
  if (cp >= 0x2200 && cp <= 0x22FF) return '数学运算符 (Sm)';
  if (cp >= 0x2190 && cp <= 0x21FF) return '箭头 (So)';
  return '其他 (Cn)';
}

function getCharBlock(cp) {
  for (const [name, block] of Object.entries(BLOCKS)) {
    if (cp >= block.start && cp <= block.end) return `${name} (${block.desc})`;
  }
  return '未知区块';
}

function esc(s) { return String(s).replace(/'/g, "\\'").replace(/</g, '&lt;'); }

function analyzeText() {
  const text = document.getElementById('text-analyze').value;
  const container = document.getElementById('text-codes');
  if (!text) { container.innerHTML = ''; return; }
  container.innerHTML = Array.from(text).map(char => {
    const cp = char.codePointAt(0);
    return `<div class="result-code" onclick="navigator.clipboard.writeText('${esc(char)}');toast('${esc(char)} 已复制')">
      <span class="label">U+${cp.toString(16).toUpperCase().padStart(4, '0')}</span>${esc(char)}</div>`;
  }).join('');
}

function renderBlockTabs() {
  const tabs = document.getElementById('block-tabs');
  tabs.innerHTML = Object.keys(BLOCKS).map(name =>
    `<div class="block-tab${name === currentBlock ? ' active' : ''}" onclick="selectBlock('${name}')">${name}</div>`
  ).join('');
}

function selectBlock(name) {
  currentBlock = name;
  currentPage = 0;
  renderBlockTabs();
  renderGrid();
}

function renderGrid() {
  const block = BLOCKS[currentBlock];
  const start = block.start + currentPage * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, block.end + 1);
  const grid = document.getElementById('char-grid');
  let html = '';
  for (let cp = start; cp < end; cp++) {
    const char = String.fromCodePoint(cp);
    if (/[\x00-\x08\x0B\x0C\x0E-\x1F]/.test(char)) continue;
    const hex = cp.toString(16).toUpperCase().padStart(4, '0');
    html += `<div class="char-cell" onclick="document.getElementById('search-input').value='U+${hex}';searchChar()">
      <span class="char">${char}</span><span class="code">${hex}</span></div>`;
  }
  grid.innerHTML = html;

  const totalPages = Math.ceil((block.end - block.start + 1) / PAGE_SIZE);
  const pagination = document.getElementById('pagination');
  if (totalPages <= 1) { pagination.innerHTML = ''; return; }
  let phtml = '';
  if (currentPage > 0) phtml += `<button class="btn btn-outline btn-sm" onclick="currentPage--;renderGrid()">上一页</button>`;
  phtml += `<span style="color:var(--text-secondary);font-size:0.85rem">${currentPage + 1} / ${totalPages}</span>`;
  if (currentPage < totalPages - 1) phtml += `<button class="btn btn-outline btn-sm" onclick="currentPage++;renderGrid()">下一页</button>`;
  pagination.innerHTML = phtml;
}

renderBlockTabs();
renderGrid();
</script>
</body>
</html>
