<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 家庭物品清单</title>
<meta property="og:title" content="🏠 家庭物品清单">
<meta property="og:description" content="🏠 家庭物品清单 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="管理家中物品库存，记录存放位置和保质期">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1}.ctn{padding:0}}
.li{padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.gr .st{text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;color:#fff;margin-right:4px}
.tag.food{background:var(--warn)}.tag.electronics{background:var(--accent)}.tag.furniture{background:#9b59b6}.tag.clothes{background:#e74c3c}.tag.supplies{background:var(--success)}.tag.other{background:var(--text2)}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar button{padding:6px 14px;font-size:.85rem;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:20px;cursor:pointer}
.filter-bar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.expiring{color:var(--danger);font-weight:600}
.search-box{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;margin-bottom:12px;font-size:.95rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏠 家庭物品清单</h1><p>管理家中物品，追踪保质期</p></div>

<div class="gr">
<div class="st"><div class="nm" id="sTotal">0</div><div class="lb">总物品</div></div>
<div class="st"><div class="nm" id="sValue">0</div><div class="lb">总价值</div></div>
<div class="st"><div class="nm" id="sExpiring">0</div><div class="lb">即将过期</div></div>
<div class="st"><div class="nm" id="sRooms">0</div><div class="lb">存放位置</div></div>
</div>

<div class="cd" style="margin-top:16px"><h2>添加物品</h2>
<div class="fr">
<div><label>物品名称</label><input type="text" id="hName" placeholder="如：橄榄油"></div>
<div><label>分类</label><select id="hCategory"><option value="food">食品</option><option value="electronics">电子产品</option><option value="furniture">家具</option><option value="clothes">衣物</option><option value="supplies">日用品</option><option value="other">其他</option></select></div>
</div>
<div class="fr">
<div><label>数量</label><input type="number" id="hQty" placeholder="1" min="1"></div>
<div><label>价值(元)</label><input type="number" id="hValue" placeholder="0"></div>
</div>
<div class="fr">
<div><label>存放位置</label><input type="text" id="hLocation" placeholder="如：厨房柜子"></div>
<div><label>保质期</label><input type="date" id="hExpiry"></div>
</div>
<label>备注</label><textarea id="hNote" placeholder="备注信息..."></textarea>
<div class="bg"><button onclick="addItem()">添加物品</button></div>
<div id="hMsg" style="display:none;text-align:center;padding:8px;border-radius:8px;margin-top:8px;font-size:.85rem"></div></div>

<div class="cd"><h2>物品清单</h2>
<input type="text" class="search-box" id="searchBox" placeholder="搜索物品..." oninput="render()">
<div class="filter-bar">
<button class="active" onclick="setFilter('all',this)">全部</button>
<button onclick="setFilter('food',this)">食品</button>
<button onclick="setFilter('electronics',this)">电子产品</button>
<button onclick="setFilter('furniture',this)">家具</button>
<button onclick="setFilter('clothes',this)">衣物</button>
<button onclick="setFilter('supplies',this)">日用品</button>
</div>
<div id="itemList" class="es">暂无物品</div>
</div>
</div>

<script>
let items=JSON.parse(localStorage.getItem('homeInventory')||'[]');
let filter='all';
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function save(){localStorage.setItem('homeInventory',JSON.stringify(items))}
function showMsg(m,t){const e=$('hMsg');e.textContent=m;e.style.display='block';e.style.background=t==='error'?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)';e.style.color=t==='error'?'var(--danger)':'var(--success)';setTimeout(()=>e.style.display='none',2000)}
function isExpiring(d){if(!d)return false;const diff=(new Date(d)-new Date())/(1000*60*60*24);return diff>=0&&diff<=30}
function addItem(){const name=$('hName').value.trim(),category=$('hCategory').value,qty=parseInt($('hQty').value)||1,value=parseFloat($('hValue').value)||0,location=$('hLocation').value.trim(),expiry=$('hExpiry').value,note=$('hNote').value.trim();if(!name){showMsg('请填写物品名称','error');return}items.push({name,category,qty,value,location,expiry,note,addedAt:Date.now()});save();render();showMsg('物品已添加','success');['hName','hQty','hValue','hLocation','hExpiry','hNote'].forEach(id=>$(id).value='')}
function setFilter(f,el){filter=f;document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function render(){const q=($('searchBox').value||'').toLowerCase();const filtered=items.filter(it=>{if(filter!=='all'&&it.category!==filter)return false;if(q&&!it.name.toLowerCase().includes(q)&&!(it.location||'').toLowerCase().includes(q))return false;return true});const locations=[...new Set(items.map(i=>i.location).filter(Boolean))];$('sTotal').textContent=items.reduce((s,i)=>s+i.qty,0);$('sValue').textContent=items.reduce((s,i)=>s+i.value*i.qty,0).toFixed(0);$('sExpiring').textContent=items.filter(i=>isExpiring(i.expiry)).length;$('sRooms').textContent=locations.length;const catMap={food:'食品',electronics:'电子产品',furniture:'家具',clothes:'衣物',supplies:'日用品',other:'其他'};$('itemList').innerHTML=filtered.length?filtered.map((it,i)=>{const realIdx=items.indexOf(it);const expiring=isExpiring(it.expiry);return '<div class="li"><div style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-weight:600">'+esc(it.name)+'</span>'+(it.qty>1?' <span style="color:var(--text2)">×'+it.qty+'</span>':'')+'<br><span class="tag '+it.category+'">'+catMap[it.category]+'</span>'+(it.location?'<span style="color:var(--text2);font-size:.8rem;margin-left:4px">📍 '+esc(it.location)+'</span>':'')+(it.expiry?'<span style="font-size:.8rem;margin-left:4px'+(expiring?' class="expiring"':'')+'">📅 '+it.expiry+(expiring?' ⚠️':'')+'</span>':'')+'</div><div style="text-align:right"><div style="font-size:.9rem;color:var(--warn)">'+(it.value?'¥'+(it.value*it.qty).toFixed(0):'')+'</div></div></div>'+(it.note?'<div style="font-size:.85rem;color:var(--text2);margin-top:4px">'+esc(it.note)+'</div>':'')+'<div class="bg"><button class="sec" style="padding:4px 12px;font-size:.8rem" onclick="adjustQty('+realIdx+',-1)">-</button><button class="sec" style="padding:4px 12px;font-size:.8rem" onclick="adjustQty('+realIdx+',1)">+</button><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="removeItem('+realIdx+')">删除</button></div></div>'}).join(''):'<div class="es">暂无物品</div>'}
function adjustQty(i,delta){items[i].qty=Math.max(1,items[i].qty+delta);save();render()}
function removeItem(i){items.splice(i,1);save();render()}
render()
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
