<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时间戳转换器</title><meta name="description" content="时间戳转换器 - 在线时间戳日期转换工具"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:6px;cursor:pointer;font-size:.85rem}.tab.active{background:var(--blue);color:#fff}.current-time{font-size:1.2rem;font-weight:600;color:var(--blue);text-align:center;padding:12px;background:var(--bg);border-radius:8px;margin:12px 0}</style><meta property="og:title" content="时间戳转换器"><meta property="og:description" content="时间戳转换器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"></head><body>
<div class="container"><h1>⏱️ 时间戳转换器</h1><p class="sub">在线时间戳日期转换工具</p>
<div class="current-time" id="currentTime"></div>
<div class="tabs">
<button class="tab active" onclick="switchTab('timestamp')">时间戳→日期</button>
<button class="tab" onclick="switchTab('date')">日期→时间戳</button>
<button class="tab" onclick="switchTab('now')">获取当前时间戳</button>
</div>
<div class="card" id="timestampCard">
<div class="input-group">
<label>输入时间戳（秒或毫秒）</label>
<input type="text" id="timestampInput" placeholder="1672531200 或 1672531200000">
</div>
<div class="input-group">
<label>时间戳单位</label>
<select id="timestampUnit">
<option value="auto">自动检测</option>
<option value="seconds">秒</option>
<option value="milliseconds">毫秒</option>
</select>
</div>
<button class="btn" onclick="convertTimestamp()">转换</button>
</div>
<div class="card" id="dateCard" style="display:none">
<div class="input-group">
<label>选择日期和时间</label>
<input type="datetime-local" id="dateInput">
</div>
<button class="btn" onclick="convertDate()">转换</button>
</div>
<div class="card" id="nowCard" style="display:none">
<button class="btn" onclick="getNow()">获取当前时间戳</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var currentTab='timestamp';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  event.target.classList.add('active');
  document.getElementById('timestampCard').style.display=tab==='timestamp'?'block':'none';
  document.getElementById('dateCard').style.display=tab==='date'?'block':'none';
  document.getElementById('nowCard').style.display=tab==='now'?'block':'none';
  document.getElementById('result').innerHTML='';
}
function updateCurrentTime(){
  var now=new Date();
  var timeStr=now.toLocaleString('zh-CN');
  var timestamp=Math.floor(now.getTime()/1000);
  document.getElementById('currentTime').textContent=timeStr+' | '+timestamp;
}
setInterval(updateCurrentTime,1000);
updateCurrentTime();
function convertTimestamp(){
  var input=document.getElementById('timestampInput').value.trim();
  var unit=document.getElementById('timestampUnit').value;
  var r=document.getElementById('result');
  if(!input){r.innerHTML='<div class="card" style="color:var(--red)">请输入时间戳</div>';return;}
  var timestamp=parseInt(input);
  if(isNaN(timestamp)){r.innerHTML='<div class="card" style="color:var(--red)">无效的时间戳</div>';return;}
  if(unit==='auto'){
    if(timestamp>9999999999){timestamp=timestamp;}
    else{timestamp=timestamp*1000;}
  }else if(unit==='seconds'){
    timestamp=timestamp*1000;
  }
  var date=new Date(timestamp);
  if(isNaN(date.getTime())){r.innerHTML='<div class="card" style="color:var(--red)">无效的时间戳</div>';return;}
  var formats={
    'ISO':date.toISOString(),
    'UTC':date.toUTCString(),
    '本地时间':date.toLocaleString('zh-CN'),
    '日期':date.toLocaleDateString('zh-CN'),
    '时间':date.toLocaleTimeString('zh-CN'),
    '年':date.getFullYear(),
    '月':date.getMonth()+1,
    '日':date.getDate(),
    '星期':['日','一','二','三','四','五','六'][date.getDay()],
    '小时':date.getHours(),
    '分钟':date.getMinutes(),
    '秒':date.getSeconds(),
    '毫秒':date.getMilliseconds(),
    '时间戳(秒)':Math.floor(date.getTime()/1000),
    '时间戳(毫秒)':date.getTime()
  };
  var html='<div class="card"><div class="section"><h3>📋 转换结果</h3><div class="result-block">';
  for(var key in formats){
    html+=key+': '+formats[key]+'\n';
  }
  html+='</div><button class="copy-btn" onclick="copyResult()">复制结果</button></div></div>';
  r.innerHTML=html;
}
function convertDate(){
  var input=document.getElementById('dateInput').value;
  var r=document.getElementById('result');
  if(!input){r.innerHTML='<div class="card" style="color:var(--red)">请选择日期和时间</div>';return;}
  var date=new Date(input);
  if(isNaN(date.getTime())){r.innerHTML='<div class="card" style="color:var(--red)">无效的日期</div>';return;}
  var timestamp_seconds=Math.floor(date.getTime()/1000);
  var timestamp_milliseconds=date.getTime();
  var html='<div class="card"><div class="section"><h3>📋 转换结果</h3><div class="result-block">';
  html+='时间戳(秒): '+timestamp_seconds+'\n';
  html+='时间戳(毫秒): '+timestamp_milliseconds+'\n';
  html+='ISO: '+date.toISOString()+'\n';
  html+='UTC: '+date.toUTCString()+'\n';
  html+='本地时间: '+date.toLocaleString('zh-CN')+'\n';
  html+='</div><button class="copy-btn" onclick="copyResult()">复制结果</button></div></div>';
  r.innerHTML=html;
}
function getNow(){
  var now=new Date();
  var timestamp_seconds=Math.floor(now.getTime()/1000);
  var timestamp_milliseconds=now.getTime();
  var html='<div class="card"><div class="section"><h3>📋 当前时间戳</h3><div class="result-block">';
  html+='时间戳(秒): '+timestamp_seconds+'\n';
  html+='时间戳(毫秒): '+timestamp_milliseconds+'\n';
  html+='ISO: '+now.toISOString()+'\n';
  html+='UTC: '+now.toUTCString()+'\n';
  html+='本地时间: '+now.toLocaleString('zh-CN')+'\n';
  html+='</div><button class="copy-btn" onclick="copyResult()">复制结果</button></div></div>';
  document.getElementById('result').innerHTML=html;
}
function copyResult(){
  var text=document.querySelector('.result-block').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
document.getElementById('dateInput').value=new Date().toISOString().slice(0,16);
</script></body></html>
