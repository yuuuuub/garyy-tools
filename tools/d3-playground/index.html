<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D3游乐场 - 在线D3.js编辑器</title>
<meta name="description" content="D3.js数据可视化在线编辑器，编写D3图表代码">
<style>
:root {
--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;
}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth;}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
nav .logo{font-size:18px;font-weight:600;color:var(--accent2);}
nav a{color:var(--accent);text-decoration:none;font-size:14px;}
nav a:hover{color:var(--accent2);}
.container{display:flex;flex-direction:column;height:calc(100vh - 52px);}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s;}
.btn-primary{background:var(--accent);color:var(--text);}
.btn-primary:hover{background:var(--accent2);}
.btn-secondary{background:var(--border);color:var(--text);}
.btn-secondary:hover{background:#3d444d;}
.workspace{display:flex;flex:1;overflow:hidden;}
.editor-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);}
.preview-panel{flex:1;display:flex;flex-direction:column;}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;font-size:13px;color:var(--accent2);font-weight:500;}
.editor-wrapper{flex:1;position:relative;}
#d3Editor{width:100%;height:100%;background:var(--bg);border:none;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:12px;padding:12px;resize:none;outline:none;line-height:1.5;}
.preview-area{flex:1;background:#fff;padding:20px;overflow:auto;}
#d3Container{width:100%;height:100%;}
.templates{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;}
.templates span{font-size:12px;color:#8b949e;margin-right:8px;}
.template-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--accent2);cursor:pointer;margin-right:6px;margin-bottom:4px;}
.template-btn:hover{border-color:var(--accent);color:var(--accent);}
@media(max-width:768px){
.workspace{flex-direction:column;}
.editor-panel{border-right:none;border-bottom:1px solid var(--border);}
}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="D3游乐场 - 在线D3.js编辑器">
  <meta property="og:description" content="D3.js数据可视化在线编辑器，编写D3图表代码">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/d3-playground/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<h1 style="text-align:center;padding:20px 0;font-size:1.5rem">D3游乐场 - 在线D3.js编辑器</h1>
<nav>
<span class="logo">D3游乐场</span>
<a href="/index.html">← 返回工具箱</a>
</nav>
<div class="container">
<div class="toolbar">
<button class="btn btn-primary" onclick="runCode()">▶ 运行</button>
<button class="btn btn-secondary" onclick="copyCode()">复制代码</button>
<button class="btn btn-secondary" onclick="resetCode()">重置</button>
</div>
<div class="templates">
<span>模板:</span>
<button class="template-btn" data-code="// 柱状图\nconst data = [30, 86, 168, 281, 303, 365];\nconst width = 500, height = 300;\nconst margin = {top: 20, right: 20, bottom: 30, left: 40};\n\nconst svg = d3.select('#d3Container')\n  .append('svg')\n  .attr('width', width)\n  .attr('height', height);\n\nconst x = d3.scaleBand()\n  .domain(d3.range(data.length))\n  .range([margin.left, width - margin.right])\n  .padding(0.1);\n\nconst y = d3.scaleLinear()\n  .domain([0, d3.max(data)])\n  .range([height - margin.bottom, margin.top]);\n\nsvg.selectAll('rect')\n  .data(data)\n  .join('rect')\n  .attr('x', (d, i) => x(i))\n  .attr('y', d => y(d))\n  .attr('width', x.bandwidth())\n  .attr('height', d => height - margin.bottom - y(d))\n  .attr('fill', '#3b82f6');">柱状图</button>
<button class="template-btn" data-code="// 折线图\nconst data = [{x:0,y:10},{x:1,y:40},{x:2,y:25},{x:3,y:60},{x:4,y:35},{x:5,y:80}];\nconst width = 500, height = 300;\nconst margin = {top: 20, right: 20, bottom: 30, left: 40};\n\nconst svg = d3.select('#d3Container')\n  .append('svg')\n  .attr('width', width)\n  .attr('height', height);\n\nconst x = d3.scaleLinear()\n  .domain(d3.extent(data, d => d.x))\n  .range([margin.left, width - margin.right]);\n\nconst y = d3.scaleLinear()\n  .domain([0, d3.max(data, d => d.y)])\n  .range([height - margin.bottom, margin.top]);\n\nconst line = d3.line()\n  .x(d => x(d.x))\n  .y(d => y(d.y))\n  .curve(d3.curveMonotoneX);\n\nsvg.append('path')\n  .datum(data)\n  .attr('fill', 'none')\n  .attr('stroke', '#3b82f6')\n  .attr('stroke-width', 3)\n  .attr('d', line);">折线图</button>
<button class="template-btn" data-code="// 饼图\nconst data = [{label:'A',value:30},{label:'B',value:50},{label:'C',value:20},{label:'D',value:40}];\nconst width = 400, height = 300;\nconst radius = Math.min(width, height) / 2;\n\nconst svg = d3.select('#d3Container')\n  .append('svg')\n  .attr('width', width)\n  .attr('height', height)\n  .append('g')\n  .attr('transform', `translate(${width/2},${height/2})`);\n\nconst color = d3.scaleOrdinal()\n  .domain(data.map(d => d.label))\n  .range(['#3b82f6','#10b981','#f59e0b','#ef4444']);\n\nconst pie = d3.pie().value(d => d.value);\nconst arc = d3.arc().innerRadius(0).outerRadius(radius);\n\nsvg.selectAll('path')\n  .data(pie(data))\n  .join('path')\n  .attr('d', arc)\n  .attr('fill', d => color(d.data.label));">饼图</button>
<button class="template-btn" data-code="// 散点图\nconst data = Array.from({length: 50}, () => ({\n  x: Math.random() * 100,\n  y: Math.random() * 100,\n  r: Math.random() * 10 + 2\n}));\nconst width = 500, height = 300;\nconst margin = {top: 20, right: 20, bottom: 30, left: 40};\n\nconst svg = d3.select('#d3Container')\n  .append('svg')\n  .attr('width', width)\n  .attr('height', height);\n\nconst x = d3.scaleLinear()\n  .domain([0, 100])\n  .range([margin.left, width - margin.right]);\n\nconst y = d3.scaleLinear()\n  .domain([0, 100])\n  .range([height - margin.bottom, margin.top]);\n\nsvg.selectAll('circle')\n  .data(data)\n  .join('circle')\n  .attr('cx', d => x(d.x))\n  .attr('cy', d => y(d.y))\n  .attr('r', d => d.r)\n  .attr('fill', '#3b82f6')\n  .attr('opacity', 0.6);">散点图</button>
</div>
<div class="workspace">
<div class="editor-panel">
<div class="panel-header">D3.js代码</div>
<div class="editor-wrapper">
<textarea id="d3Editor">// 柱状图示例
const data = [30, 86, 168, 281, 303, 365];
const width = 500, height = 300;
const margin = {top: 20, right: 20, bottom: 30, left: 40};

const container = document.getElementById('d3Container');
container.innerHTML = '';

const svg = d3.select(container)
  .append('svg')
  .attr('width', width)
  .attr('height', height);

const x = d3.scaleBand()
  .domain(d3.range(data.length))
  .range([margin.left, width - margin.right])
  .padding(0.1);

const y = d3.scaleLinear()
  .domain([0, d3.max(data)])
  .range([height - margin.bottom, margin.top]);

svg.selectAll('rect')
  .data(data)
  .join('rect')
  .attr('x', (d, i) => x(i))
  .attr('y', d => y(d))
  .attr('width', x.bandwidth())
  .attr('height', d => height - margin.bottom - y(d))
  .attr('fill', '#3b82f6')
  .attr('rx', 4);

svg.selectAll('text')
  .data(data)
  .join('text')
  .attr('x', (d, i) => x(i) + x.bandwidth() / 2)
  .attr('y', d => y(d) - 5)
  .attr('text-anchor', 'middle')
  .attr('fill', '#333')
  .text(d => d);</textarea>
</div>
</div>
<div class="preview-panel">
<div class="panel-header">可视化预览</div>
<div class="preview-area">
<div id="d3Container"></div>
</div>
</div>
</div>
</div>
<script>
const d3Editor=document.getElementById('d3Editor');

function runCode(){
try{
(new Function(d3Editor.value))();
}catch(e){
garyyToast('代码错误: '+e.message);
}
}

function copyCode(){
navigator.clipboard.writeText(d3Editor.value).then(()=>garyyToast('代码已复制到剪贴板'));
}

function resetCode(){
d3Editor.value='// 柱状图示例\nconst data = [30, 86, 168, 281, 303, 365];\nconst width = 500, height = 300;\nconst margin = {top: 20, right: 20, bottom: 30, left: 40};\n\nconst container = document.getElementById(\'d3Container\');\ncontainer.innerHTML = \'\';\n\nconst svg = d3.select(container)\n  .append(\'svg\')\n  .attr(\'width\', width)\n  .attr(\'height\', height);\n\nconst x = d3.scaleBand()\n  .domain(d3.range(data.length))\n  .range([margin.left, width - margin.right])\n  .padding(0.1);\n\nconst y = d3.scaleLinear()\n  .domain([0, d3.max(data)])\n  .range([height - margin.bottom, margin.top]);\n\nsvg.selectAll(\'rect\')\n  .data(data)\n  .join(\'rect\')\n  .attr(\'x\', (d, i) => x(i))\n  .attr(\'y\', d => y(d))\n  .attr(\'width\', x.bandwidth())\n  .attr(\'height\', d => height - margin.bottom - y(d))\n  .attr(\'fill\', \'#3b82f6\');';
runCode();
}

document.querySelectorAll('.template-btn').forEach(btn=>{
btn.onclick=()=>{
d3Editor.value=btn.dataset.code;
runCode();
};
});

// 等待D3加载
if(typeof d3==='undefined'){
const s=document.createElement('script');
s.src='https://d3js.org/d3.v7.min.js';
s.onload=runCode;
document.head.appendChild(s);
}else{
runCode();
}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
