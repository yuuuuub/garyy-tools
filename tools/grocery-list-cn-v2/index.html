<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛒 智能购物清单 v2</title>
<meta property="og:title" content="🛒 智能购物清单 v2">
<meta property="og:description" content="🛒 智能购物清单 v2 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="创建分类购物清单，按超市区域排序，支持多人协作和历史记录">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#f59e0b;--accent2:#d97706;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#d97706;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--blue:#0969da;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number]{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus{border-color:var(--accent)}
select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;width:100%}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.add-row{display:flex;gap:8px;align-items:center}
.add-row input[type=text]{flex:1}
.add-row input[type=number]{width:80px;flex:none}
.add-row select{width:120px;flex:none}
.item-list{margin-top:12px}
.item-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);transition:all .2s}
.item-row:last-child{border-bottom:none}
.item-row.done{opacity:.5;text-decoration:line-through}
.item-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.item-info{flex:1}
.item-info .name{font-weight:600;font-size:.95rem}
.item-info .meta{font-size:.8rem;color:var(--text2)}
.item-row .price{font-weight:700;color:var(--accent);font-size:.9rem;min-width:60px;text-align:right}
.item-row .cat-badge{padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600;white-space:nowrap}
.cat-蔬果{background:rgba(34,197,94,.15);color:var(--green)}
.cat-肉蛋{background:rgba(239,68,68,.15);color:var(--red)}
.cat-乳品{background:rgba(59,130,246,.15);color:var(--blue)}
.cat-主食{background:rgba(234,179,8,.15);color:var(--yellow)}
.cat-调料{background:rgba(139,92,246,.15);color:var(--accent)}
.cat-零食{background:rgba(249,115,22,.15);color:var(--accent)}
.cat-其他{background:var(--bg);color:var(--text2)}
.item-row .actions{display:flex;gap:4px}
.item-row .actions button{padding:4px 8px;font-size:.75rem}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.summary-item{text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.summary-item .num{font-size:1.2rem;font-weight:700;color:var(--accent)}
.summary-item .lbl{font-size:.75rem;color:var(--text2);margin-top:2px}
.category-group{margin-bottom:12px}
.category-group h3{font-size:.9rem;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.quick-add{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick-btn{padding:5px 12px;background:var(--bg);border:1px solid var(--border);border-radius:16px;cursor:pointer;font-size:.8rem;transition:all .2s}
.quick-btn:hover{border-color:var(--accent);color:var(--accent)}
.template-btn{padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.8rem;border:1px solid var(--border);background:var(--bg);color:var(--text);transition:all .2s}
.template-btn:hover{border-color:var(--accent);color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🛒 智能购物清单 v2</h1><p>按分类整理购物清单，一键勾选已购买</p></div>

<div class="cd"><h2>➕ 添加商品</h2>
<div class="add-row">
<input type="text" id="itemName" placeholder="商品名称" onkeydown="if(event.key==='Enter')addItem()">
<input type="number" id="itemQty" value="1" min="1" style="width:60px">
<select id="itemCat" style="width:100px"><option value="蔬果">🥬 蔬果</option><option value="肉蛋">🥩 肉蛋</option><option value="乳品">🥛 乳品</option><option value="主食">🍚 主食</option><option value="调料">🧂 调料</option><option value="零食">🍪 零食</option><option value="其他">📦 其他</option></select>
<button onclick="addItem()">＋</button>
</div>
<div class="quick-add" id="quickAdd"></div>
<div style="margin-top:12px"><label>快捷模板</label>
<div class="bg" id="templates"></div></div></div>

<div class="cd"><h2>📋 购物清单</h2>
<div class="bg"><button onclick="sortByName()">🔤 按名称</button><button class="sec" onclick="sortByCat()">📂 按分类</button><button class="sec" onclick="showBought()">✅ 已购</button><button class="dng" onclick="clearList()">🗑️ 清空</button></div>
<div class="summary" id="summary"></div>
<div class="item-list" id="itemList"></div>
<div class="bg" style="margin-top:12px"><button onclick="exportList()">📋 复制清单</button><button class="sec" onclick="saveList()">💾 保存</button></div></div>

<div class="cd"><h2>📚 历史清单</h2><div id="historyList" class="empty" style="color:var(--text2)">暂无历史记录</div></div>
</div>
<script>
var DB='grocery_v2',items=JSON.parse(localStorage.getItem(DB)||'[]'),hist=JSON.parse(localStorage.getItem(DB+'_hist')||'[]');
var CATS=['蔬果','肉蛋','乳品','主食','调料','零食','其他'];
var quickItems=['鸡蛋','牛奶','面包','番茄','苹果','香蕉','大米','食用油','酱油','盐'];
var TEMPLATES={
'周末采购':['鸡蛋','牛奶','面包','鸡胸肉','番茄','黄瓜','苹果','香蕉','大米','食用油'],
'火锅食材':['牛肉卷','羊肉卷','豆腐','金针菇','大白菜','粉条','芝麻酱','香油'],
'烘焙原料':['低筋面粉','黄粉','鸡蛋','牛奶','黄油','白糖','泡打粉','香草精']
};

function addItem(){
var name=document.getElementById('itemName').value.trim();
if(!name)return;
var qty=parseInt(document.getElementById('itemQty').value)||1;
var cat=document.getElementById('itemCat').value;
items.push({id:Date.now(),name:name,qty:qty,cat:cat,price:0,bought:false});
document.getElementById('itemName').value='';document.getElementById('itemQty').value=1;
save();render();
}
function quickAdd(name){
document.getElementById('itemName').value=name;addItem();
}
function toggleBought(id){
var item=items.find(function(i){return i.id===id});if(item){item.bought=!item.bought;save();render();}
}
function removeItem(id){items=items.filter(function(i){return i.id!==id});save();render();}
function updatePrice(id,price){var item=items.find(function(i){return i.id===id});if(item){item.price=parseFloat(price)||0;save();}}
function sortByName(){items.sort(function(a,b){return a.name.localeCompare(b.name,'zh')});save();render();}
function sortByCat(){items.sort(function(a,b){return CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||a.name.localeCompare(b.name,'zh')});save();render();}
function showBought(){render(items.filter(function(i){return i.bought}));}
function clearList(){if(confirm('确定清空购物清单？')){items=[];save();render();}}
function save(){localStorage.setItem(DB,JSON.stringify(items));}
function render(list){
list=list||items;
var unbought=list.filter(function(i){return !i.bought});
var bought=list.filter(function(i){return i.bought});
var total=list.reduce(function(a,b){return a+b.price*b.qty},0);
var totalPrice=items.filter(function(i){return !i.bought}).reduce(function(a,b){return a+b.price*b.qty},0);
document.getElementById('summary').innerHTML=[
{v:unbought.length,l:'待购'},{v:bought.length,l:'已购'},{v:'¥'+totalPrice.toFixed(1),l:'预估总价'}
].map(function(s){return '<div class="summary-item"><div class="num">'+s.v+'</div><div class="lbl">'+s.l+'</div></div>'}).join('');
var html='';
var grouped={};unbought.forEach(function(item){if(!grouped[item.cat])grouped[item.cat]=[];grouped[item.cat].push(item);});
CATS.forEach(function(cat){if(!grouped[cat])return;
html+='<div class="category-group"><h3><span class="cat-badge cat-'+cat+'">'+cat+'</span> ('+grouped[cat].length+')</h3>';
grouped[cat].forEach(function(item){html+=renderItem(item);});
html+='</div>';
});
if(bought.length){html+='<div class="category-group"><h3>✅ 已购买 ('+bought.length+')</h3>';
bought.forEach(function(item){html+=renderItem(item);});html+='</div>';}
if(!list.length)html='<div style="text-align:center;padding:30px;color:var(--text2)">清单为空，添加商品开始购物</div>';
document.getElementById('itemList').innerHTML=html;
}
function renderItem(item){
return '<div class="item-row'+(item.bought?' done':'')+'">'+
'<input type="checkbox" '+(item.bought?'checked':'')+' onchange="toggleBought('+item.id+')">'+
'<div class="item-info"><div class="name">'+item.name+'</div><div class="meta">×'+item.qty+'</div></div>'+
'<input type="number" value="'+(item.price||'')+'" placeholder="¥" style="width:60px;padding:4px 8px;font-size:.8rem" onchange="updatePrice('+item.id+',this.value)">'+
'<span class="cat-badge cat-'+item.cat+'">'+item.cat+'</span>'+
'<div class="actions"><button class="dng" onclick="removeItem('+item.id+')">✕</button></div></div>';
}
function exportList(){
var unbought=items.filter(function(i){return !i.bought});
var text='🛒 购物清单\n'+unbought.map(function(i){return '☐ '+i.name+' ×'+i.qty+' ('+i.cat+')'}).join('\n');
navigator.clipboard.writeText(text);alert('已复制到剪贴板');
}
function saveList(){
if(!items.length){alert('清单为空');return;}
hist.unshift({time:new Date().toLocaleString(),count:items.length,items:items.slice()});
hist=hist.slice(0,10);localStorage.setItem(DB+'_hist',JSON.stringify(hist));renderHistory();
alert('已保存');
}
function renderHistory(){
if(!hist.length){document.getElementById('historyList').innerHTML='<div style="color:var(--text2)">暂无历史记录</div>';return;}
document.getElementById('historyList').innerHTML=hist.map(function(h,i){
return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)"><div><b>'+h.count+'件商品</b><div style="font-size:.8rem;color:var(--text2)">'+h.time+'</div></div><button class="dng" style="padding:4px 10px;font-size:.75rem" onclick="hist.splice('+i+',1);localStorage.setItem(DB+\'_hist\',JSON.stringify(hist));renderHistory()">删除</button></div>';
}).join('');
}
quickItems.forEach(function(n){
var btn=document.createElement('span');btn.className='quick-btn';btn.textContent=n;
btn.onclick=function(){quickAdd(n)};document.getElementById('quickAdd').appendChild(btn);
});
Object.entries(TEMPLATES).forEach(function(t){
var btn=document.createElement('span');btn.className='template-btn';btn.textContent='📋 '+t[0];
btn.onclick=function(){t[1].forEach(function(n){quickAdd(n)})};document.getElementById('templates').appendChild(btn);
});
render();renderHistory();
</script>
</body>
</html>
