<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国古建筑 - 飞檐斗拱 | Gary's Tools</title><meta name="description" content="中国古建筑知识大全 - 飞檐斗拱、榫卯结构、琉璃瓦顶、园林建筑等传统建筑文化百科"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#d4a574;--accent2:#8b6914}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#8b5e3c;--accent2:#6b4226}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;transition:background var(--transition),color var(--transition)}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.category-btn{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all var(--transition)}.category-btn.active{background:var(--accent);color:#fff}.category-btn:hover{opacity:.85}.arch-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all var(--transition)}.arch-item:hover{transform:translateY(-2px);border-color:var(--accent)}.arch-item.open .arch-detail{display:block}.arch-title{font-size:1.1rem;font-weight:600;color:var(--accent);margin-bottom:6px}.arch-era{font-size:.8rem;color:var(--green);margin-bottom:4px}.arch-desc{font-size:.9rem;color:var(--text2);line-height:1.6}.arch-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.9rem;line-height:1.8;color:var(--text)}.arch-detail h4{color:var(--accent);margin-bottom:8px}.arch-tag{display:inline-block;padding:2px 8px;background:var(--border);border-radius:4px;font-size:.75rem;color:var(--text2);margin:2px}#stats{text-align:center;color:var(--text2);font-size:.8rem;margin-bottom:12px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem)}</style><meta property="og:title" content="中国古建筑"><meta property="og:description" content="中国古建筑知识百科 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>"></head><body>

<div class="container"><h1>🏛️ 中国古建筑</h1><p class="sub">飞檐斗拱 · 榫卯结构 · 琉璃瓦顶 · 园林建筑</p>
<div class="card">
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索古建筑知识..." oninput="filterList()"></div>
<div class="btn-group">
<button class="category-btn active" onclick="filterCat('all',this)">全部</button>
<button class="category-btn" onclick="filterCat('结构',this)">结构</button>
<button class="category-btn" onclick="filterCat('屋顶',this)">屋顶</button>
<button class="category-btn" onclick="filterCat('园林',this)">园林</button>
<button class="category-btn" onclick="filterCat('宫殿',this)">宫殿</button>
<button class="category-btn" onclick="filterCat('民居',this)">民居</button>
<button class="category-btn" onclick="filterCat('塔桥',this)">塔桥</button>
</div></div>
<div id="stats"></div>
<div id="list"></div></div>
<script src="../i18n.js" defer></script>
<script>
var data=[
{title:'榫卯结构',era:'新石器时代至今',cat:'结构',tags:['木构','连接','抗震'],desc:'不用一颗钉子的木构连接技术，是中国古建筑的灵魂。',detail:'榫卯是在两个木构件上所采用的一种凹凸结合的连接方式。凸出部分叫榫，凹进部分叫卯。其种类多达数十种，如燕尾榫、格角榫、粽角榫等。故宫历经多次地震而不倒，正是因为榫卯结构具有良好的弹性和抗震性。',ref:'《营造法式》'},
{title:'斗拱',era:'周代至清代',cat:'结构',tags:['承重','装饰','等级'],desc:'中国古建筑特有的承重构件，位于柱顶与屋顶之间。',detail:'斗拱由斗、拱、昂、翘等构件组成，层层叠加，将屋顶的重量均匀传递到柱子上。斗拱不仅是结构构件，更是建筑等级的象征。清代《工程做法则例》规定了严格的斗拱用材等级。',ref:'《营造法式》'},
{title:'飞檐翘角',era:'汉代至清代',cat:'屋顶',tags:['造型','排水','采光'],desc:'屋檐向上翘起如飞鸟展翅，兼具实用与美观。',detail:'飞檐翘角是中国传统建筑屋顶的标志性特征。上翘的屋角有利于增加室内采光面积，同时便于排水。南方建筑飞檐更为夸张，北方则相对平缓，体现了地域差异。',ref:'《中国建筑史》'},
{title:'庑殿顶',era:'汉代至清代',cat:'屋顶',tags:['等级','宫殿','五脊'],desc:'四面斜坡、一条正脊四条垂脊的屋顶形式，等级最高。',detail:'庑殿顶又称四阿顶，是古代建筑中等级最高的屋顶形式。正脊一条，垂脊四条，故又称五脊殿。太和殿即采用重檐庑殿顶，是现存最大的庑殿顶建筑。',ref:'《营造法式》'},
{title:'歇山顶',era:'汉代至清代',cat:'屋顶',tags:['等级','九脊'],desc:'由一条正脊、四条垂脊和四条戗脊组成，等级仅次于庑殿顶。',detail:'歇山顶又称九脊殿，其特征是上半部分为悬山式，下半部分为庑殿式。天安门城楼即采用歇山顶。在南方，歇山顶常演变为歇山式样，增加了建筑的层次感。',ref:'《营造法式》'},
{title:'攒尖顶',era:'汉代至清代',cat:'屋顶',tags:['亭阁','园林'],desc:'屋顶各脊交于一点，形成尖顶，常用于亭、阁、塔。',detail:'攒尖顶的特点是所有屋脊在顶部汇聚于一点，形成尖顶。有四角攒尖、六角攒尖、八角攒尖和圆形攒尖等。天坛祈年殿即为三重檐圆形攒尖顶的典范。',ref:'《中国建筑史》'},
{title:'苏州拙政园',era:'明代',cat:'园林',tags:['私家园林','水景','借景'],desc:'中国四大名园之一，以水为中心的典型江南园林。',detail:'拙政园始建于明正德年间，占地78亩，是苏州最大的古典园林。园内以水为灵魂，水面占三分之一。布局疏密相间，以"借景"手法将远处的北寺塔纳入园中，体现了"虽由人作，宛自天开"的造园理念。',ref:'《园冶》'},
{title:'颐和园',era:'清代',cat:'园林',tags:['皇家园林','万寿山','昆明湖'],desc:'现存最大的皇家园林，集南北园林艺术之大成。',detail:'颐和园占地290公顷，以万寿山和昆明湖为主体。昆明湖占全园面积四分之三，万寿山上的佛香阁是全园的制高点。长廊长728米，是中国园林中最长的游廊。1860年被英法联军焚毁，1888年重建。',ref:'《中国古典园林史》'},
{title:'拙政园与留园',era:'明清',cat:'园林',tags:['四大名园','叠石','理水'],desc:'江南园林的杰出代表，体现了文人审美与自然山水的融合。',detail:'留园以建筑空间处理见长，通过曲折的廊道将各景区串联。园中冠云峰高6.5米，是江南园林中最高的太湖石峰。"片石山房"为石涛大师遗作，以石造山，浑然天成。',ref:'《园冶》'},
{title:'紫禁城',era:'明代',cat:'宫殿',tags:['故宫','中轴线','九千间'],desc:'明清两代皇宫，世界最大的宫殿建筑群。',detail:'紫禁城始建于明永乐四年（1406年），历时14年建成。占地72万平方米，建筑面积15万平方米，有房屋9000余间。整个建筑沿中轴线对称布局，体现了皇权至上的理念。1987年被列为世界文化遗产。',ref:'《明史·地理志》'},
{title:'布达拉宫',era:'唐代至今',cat:'宫殿',tags:['藏式','白宫红宫','信仰'],desc:'世界海拔最高的宫殿，藏传佛教圣地。',detail:'布达拉宫坐落于拉萨红山之上，始建于公元7世纪吐蕃王朝松赞干布时期。17世纪五世达赖重建后形成现在的规模，由白宫和红宫组成。宫内藏有大量珍贵文物和壁画。1994年被列为世界文化遗产。',ref:'《西藏王统记》'},
{title:'皖南民居',era:'明清',cat:'民居',tags:['徽派','马头墙','天井'],desc:'以白墙黑瓦、马头墙为特征的徽派建筑。',detail:'皖南民居以宏村、西递为代表，其特征是高大的马头墙（封火墙）、天井院落和精美的砖木石三雕。马头墙高出屋脊，既防火又美观。天井承担采光、通风和排水功能，体现了"四水归堂"的聚财理念。',ref:'《徽州古建筑丛书》'},
{title:'福建土楼',era:'宋元至今',cat:'民居',tags:['圆形','防御','客家人'],desc:'世界独一无二的大型夯土民居建筑，被誉为"东方古城堡"。',detail:'福建土楼以生土为主要建筑材料，就地取材夯筑而成。圆形土楼最为典型，直径可达70米，高四至五层，可容纳数十户人家。外墙厚达1.5米，底层不开窗，具有极强的防御功能。2008年被列入世界文化遗产。',ref:'《福建土楼》'},
{title:'北京四合院',era:'明清',cat:'民居',tags:['合院','中轴','等级'],desc:'北京传统民居的典型形式，体现了中国传统的家族伦理观念。',detail:'四合院由正房、倒座房、东西厢房围合而成，形成"口"字形布局。院落坐北朝南，正房为长辈居住，厢房为晚辈居住，倒座房为客房或仆人居住。垂花门是内宅与外院的分界线。',ref:'《北京四合院》'},
{title:'赵州桥',era:'隋代',cat:'塔桥',tags:['石拱桥','敞肩拱','李春'],desc:'世界上现存最古老的石拱桥，建于公元605年。',detail:'赵州桥又名安济桥，由隋代匠师李春设计建造。桥长64.4米，宽9.6米，主拱净跨37.02米。其创新之处在于采用"敞肩拱"设计，大拱两肩各有两个小拱，既减轻自重又利于泄洪。',ref:'《中国桥梁史》'},
{title:'苏州虎丘塔',era:'五代',cat:'塔桥',tags:['砖塔','斜塔','云岩寺'],desc:'中国第一斜塔，建于公元959年，倾斜度超过比萨斜塔。',detail:'虎丘塔又称云岩寺塔，为八角七层仿楼阁式砖塔。塔高47.7米，因基础不均匀沉降，塔身向东北方向倾斜2.34米。其建造年代比比萨斜塔早400多年，是中国斜塔之最。',ref:'《苏州古典园林》'},
{title:'应县木塔',era:'辽代',cat:'塔桥',tags:['纯木','斗拱','释迦塔'],desc:'世界现存最高最古老的木构塔式建筑，高67.31米。',detail:'应县木塔始建于辽清宁二年（1056年），全称佛宫寺释迦塔。塔高67.31米，底层直径30.27米，使用54种斗拱。木塔历经多次地震和战火，至今屹立不倒，堪称建筑奇迹。',ref:'《中国古塔》'}
];
var currentCat='all';
function renderList(items){
  var el=document.getElementById('list');
  var s=document.getElementById('stats');
  s.textContent='共 '+items.length+' 条知识';
  el.innerHTML=items.map(function(d,i){
    return '<div class="arch-item" onclick="this.classList.toggle(\'open\')">'+
    '<div class="arch-title">'+d.title+'</div>'+
    '<div class="arch-era">朝代：'+d.era+'</div>'+
    '<div class="arch-desc">'+d.desc+'</div>'+
    '<div class="arch-detail"><h4>详细介绍</h4><p>'+d.detail+'</p>'+
    '<p style="margin-top:8px;color:var(--accent2)">参考：'+d.ref+'</p>'+
    '<div>'+d.tags.map(function(t){return '<span class="arch-tag">'+t+'</span>'}).join('')+'</div></div></div>';
  }).join('');
}
function filterList(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=data.filter(function(d){
    var matchQ=d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q)||d.era.toLowerCase().includes(q);
    var matchC=currentCat==='all'||d.cat===currentCat;
    return matchQ&&matchC;
  });
  renderList(filtered);
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterList();
}
renderList(data);
</script></body></html>
