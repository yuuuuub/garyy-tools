<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😊 情感分析 - Gary's Tools</title>
<meta name="description" content="AI情感分析工具，检测文本中的正面负面情绪">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;line-height:1.6;min-height:100vhscroll-behavior:smooth;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.8rem;font-weight:700;margin-bottom:4px}
header p{color:var(--text2);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.card-title{font-size:.95rem;font-weight:600;margin-bottom:10px;color:var(--text2)}
textarea{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;width:100%;font-size:.9rem;resize:vertical;font-family:inherit;outline:none;transition:border .2s}
textarea:focus{border-color:var(--blue)}
button{padding:9px 20px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;font-family:inherit;transition:opacity .2s}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;padding:4px 10px;border-radius:4px;font-size:.75rem;margin:2px}
.tag-positive{background:rgba(35,134,54,.2);color:var(--green);border:1px solid var(--green)}
.tag-negative{background:rgba(239,68,68,.2);color:var(--red);border:1px solid var(--red)}
.result-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px;min-height:60px}
.result-box .label{color:var(--text2);font-size:.8rem;margin-bottom:6px}
.result-box .value{font-size:1.1rem;font-weight:600}
.bar-wrap{background:var(--border);border-radius:4px;height:8px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{background:rgba(239,68,68,.1);border:1px solid var(--red);border-radius:6px;padding:10px;color:var(--red);font-size:.82rem;margin-top:10px;display:none}
.waiting-msg{background:rgba(245,158,11,.1);border:1px solid var(--gold);border-radius:6px;padding:10px;color:var(--gold);font-size:.82rem;margin-top:10px;display:none}
.btn-group{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="😊 情感分析 - Gary's Tools">
  <meta property="og:description" content="AI情感分析工具，检测文本中的正面负面情绪">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/ai-sentiment/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>😊 情感分析</h1>
<p>HuggingFace · 文本情感分析</p>
</header>
<div class="card">
<div class="card-title">输入文本</div>
<textarea id="inputText" rows="4" placeholder="请输入要分析情感的文本，例如：I love this product!"></textarea>
<div class="btn-group">
<button id="analyzeBtn">🔍 分析情感</button>
<button id="clearBtn" style="border-color:var(--border);background:transparent;color:var(--text)">清空</button>
</div>
<div id="waitingMsg" class="waiting-msg">⏳ 模型加载中，请稍候...</div>
<div id="errorMsg" class="error-msg"></div>
<div id="resultArea" style="display:none">
<div class="result-box">
<div class="label">分析结果</div>
<div id="sentimentLabel" class="value"></div>
<div style="margin-top:8px">
<div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2)">
<span>置信度</span>
<span id="confidenceText">0%</span>
</div>
<div class="bar-wrap"><div id="confidenceBar" class="bar-fill" style="width:0%"></div></div>
</div>
</div>
</div>
</div>
</div>
<script>
(function(){
'use strict';
var input=document.getElementById('inputText');
var analyzeBtn=document.getElementById('analyzeBtn');
var clearBtn=document.getElementById('clearBtn');
var resultArea=document.getElementById('resultArea');
var sentimentLabel=document.getElementById('sentimentLabel');
var confidenceText=document.getElementById('confidenceText');
var confidenceBar=document.getElementById('confidenceBar');
var errorMsg=document.getElementById('errorMsg');
var waitingMsg=document.getElementById('waitingMsg');
var API_URL='https://api.siliconflow.cn/v1/chat/completions';
var API_KEY=localStorage.getItem('sf_api_key')||'';
var MODEL='Qwen/Qwen2-7B-Instruct';

function analyze(){
  var text=input.value.trim();
  if(!text){showError('请输入要分析的文本');return;}
  if(!API_KEY){showError('请先设置 API Key');return;}
  setLoading(true);
  hideError();
  hideWaiting();
  resultArea.style.display='none';
  fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
    body:JSON.stringify({model:MODEL,messages:[{role:'system',content:'你是一个情感分析助手。请分析以下文本的情感倾向，只返回JSON格式：{"sentiment":"正面/负面/中性","confidence":0.85,"keywords":["关键词1","关键词2"]}。不要返回其他内容。'},{role:'user',content:text}],max_tokens:200,temperature:0.1})
  })
  .then(function(r){
    if(!r.ok)return r.json().then(function(d){throw new Error(d.error?.message||'请求失败')});
    return r.json();
  })
  .then(function(data){
    setLoading(false);
    hideWaiting();
    if(data&&data.choices&&data.choices[0]&&data.choices[0].message){
      try{
        var content=data.choices[0].message.content;
        var jsonStr=content.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
        var result=JSON.parse(jsonStr);
        var sentiment=result.sentiment||'中性';
        var confidence=result.confidence||0.5;
        var keywords=result.keywords||[];
        var pct=Math.round(confidence*100);
        resultArea.style.display='block';
        var isPos=sentiment==='正面';
        var isNeg=sentiment==='负面';
        sentimentLabel.innerHTML='<span class="tag '+(isPos?'tag-positive':isNeg?'tag-negative':'tag-neutral')+'">'+(isPos?'😊 正面':isNeg?'😟 负面':'😐 中性')+'</span>';
        confidenceText.textContent=pct+'%';
        confidenceBar.style.width=pct+'%';
        confidenceBar.style.background=isPos?'var(--green)':isNeg?'var(--red)':'var(--gold)';
      }catch(e){
        sentimentLabel.innerHTML='<span class="tag tag-neutral">😐 '+data.choices[0].message.content+'</span>';
        confidenceText.textContent='-';
        confidenceBar.style.width='0%';
      }
    }else{
      showError('无法解析返回结果');
    }
  })
  .catch(function(err){
    setLoading(false);
    showError(err.message||'请求失败，请稍后重试');
  });
}

function setLoading(v){analyzeBtn.disabled=v;analyzeBtn.textContent=v?'⏳ 分析中...':'🔍 分析情感';}
function showError(msg){errorMsg.textContent=msg;errorMsg.style.display='block';}
function hideError(){errorMsg.style.display='none';}
function showWaiting(){waitingMsg.style.display='block';}
function hideWaiting(){waitingMsg.style.display='none';}

analyzeBtn.addEventListener('click',analyze);
clearBtn.addEventListener('click',function(){
  input.value='';
  resultArea.style.display='none';
  hideError();
  hideWaiting();
});
input.addEventListener('keydown',function(e){
  if(e.key==='Enter' && e.ctrlKey)analyze();
});
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
