<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 专业习惯追踪</title>
<meta name="description" content="专业习惯追踪器，支持多维度打卡、数据分析、连续记录、统计图表">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
button.suc{background:var(--success)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.li{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text)}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.empty{text-align:center;padding:40px;color:var(--text2)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.stat-card .num{font-size:1.8rem;font-weight:700;color:var(--accent)}
.stat-card .lbl{font-size:.8rem;color:var(--text2);margin-top:4px}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:12px}
.bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:4px;transition:height .3s}
.bar-lbl{font-size:.65rem;color:var(--text2);text-align:center;margin-top:4px}
.streak-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:.85rem;font-weight:600}
.streak-badge.fire{background:rgba(245,158,11,.15);color:var(--warn)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--success);border-radius:4px;transition:width .3s}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:400px}
.modal h3{margin-bottom:12px}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--bg);border-radius:8px;padding:4px}
.tab{flex:1;padding:8px;text-align:center;border-radius:6px;cursor:pointer;font-size:.85rem;color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:var(--text);font-weight:600}
@media(max-width:480px){.stats-grid{grid-template-columns:1fr 1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🎯 专业习惯追踪">
<meta property="og:description" content="专业习惯追踪器，支持多维度打卡、数据分析、连续记录、统计图表">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🎯 专业习惯追踪</h1><p>量化你的成长，坚持每一天</p></div>

<div class="tabs">
<div class="tab active" onclick="switchTab('add')">添加习惯</div>
<div class="tab" onclick="switchTab('today')">今日打卡</div>
<div class="tab" onclick="switchTab('stats')">数据统计</div>
<div class="tab" onclick="switchTab('history')">历史记录</div>
</div>

<div id="tab-add">
<div class="cd"><h2>添加新习惯</h2>
<label>习惯名称</label><input type="text" id="hN" placeholder="如：早起、运动、阅读">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label>类别</label><select id="hC"><option>健康</option><option>学习</option><option>工作</option><option>生活</option><option>社交</option><option>其他</option></select></div>
<div><label>频率</label><select id="hF"><option>每天</option><option>工作日</option><option>每周3次</option><option>每周</option></select></div>
</div>
<label>目标天数</label><input type="number" id="hDays" value="30" min="1" max="365">
<label>备注</label><textarea id="hNote" rows="2" placeholder="为什么想养成这个习惯？"></textarea>
<div class="bg"><button onclick="addHabit()">添加习惯</button></div></div>
</div>

<div id="tab-today" style="display:none">
<div class="cd"><h2>📅 今日打卡 <span id="todayDate" style="font-size:.85rem;color:var(--text2)"></span></h2><div id="todayList" class="empty">暂无习惯，请先添加</div></div>
</div>

<div id="tab-stats" style="display:none">
<div class="cd"><h2>📊 数据统计</h2>
<div class="stats-grid" id="statsGrid"></div>
<div style="margin-top:16px"><h3 style="font-size:.95rem;margin-bottom:8px">本周完成率</h3><div id="weekBars" class="bar-chart"></div></div>
<div style="margin-top:16px"><h3 style="font-size:.95rem;margin-bottom:8px">各类别分布</h3><div id="catDist"></div></div>
</div>
<div class="cd"><h2>🏆 连续记录</h2><div id="streakList" class="empty">暂无数据</div></div>
</div>

<div id="tab-history" style="display:none">
<div class="cd"><h2>📋 历史记录</h2><div id="historyList" class="empty">暂无记录</div></div>
</div>
</div>

<div class="modal-overlay" id="editModal">
<div class="modal">
<h3>编辑习惯</h3>
<label>名称</label><input type="text" id="eN">
<label>类别</label><select id="eC"><option>健康</option><option>学习</option><option>工作</option><option>生活</option><option>社交</option><option>其他</option></select>
<label>目标天数</label><input type="number" id="eDays" min="1" max="365">
<div class="bg" style="justify-content:space-between">
<button onclick="saveEdit()">保存</button>
<button class="dng" onclick="deleteHabit()">删除</button>
<button class="sec" onclick="closeModal()">取消</button>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let habits=JSON.parse(localStorage.getItem('htp_habits')||'[]');
let editIdx=-1;
const today=()=>new Date().toISOString().slice(0,10);
const dayName=()=>['日','一','二','三','四','五','六'][new Date().getDay()];
const save=()=>localStorage.setItem('htp_habits',JSON.stringify(habits));

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>{el.classList.toggle('active',['add','today','stats','history'][i]===t)});
  ['add','today','stats','history'].forEach(id=>{ $('tab-'+id).style.display=id===t?'block':'none'});
  if(t==='today')renderToday();if(t==='stats')renderStats();if(t==='history')renderHistory();
}

function addHabit(){
  const n=$('hN').value.trim();if(!n){alert('请输入习惯名称');return}
  habits.push({name:n,cat:$('hC').value,freq:$('hF').value,days:parseInt($('hDays').value)||30,note:$('hNote').value,records:{},created:today()});
  save();$('hN').value='';$('hNote').value='';switchTab('today');
}

function renderToday(){
  $('todayDate').textContent=`${today()} 星期${dayName()}`;
  if(!habits.length){$('todayList').innerHTML='<div class="empty">暂无习惯，请先添加</div>';return}
  let html='';habits.forEach((h,i)=>{
    const done=h.records[today()];const streak=getStreak(h);
    html+=`<div class="li" style="cursor:pointer" onclick="toggleCheck(${i})">
      <div><div style="font-weight:600">${done?'✅':'⬜'} ${h.name}</div>
      <div style="font-size:.8rem;color:var(--text2)">${h.cat} · ${h.freq}
        ${streak>0?` · <span class="streak-badge fire">🔥 ${streak}天</span>`:''}
      </div></div>
      <div style="display:flex;gap:6px">
        <button class="sec" onclick="event.stopPropagation();openEdit(${i})" style="padding:6px 10px;font-size:.8rem">编辑</button>
      </div></div>`;
  });$('todayList').innerHTML=html;
}

function toggleCheck(i){
  const d=today();habits[i].records[d]=!habits[i].records[d];
  if(!habits[i].records[d])delete habits[i].records[d];save();renderToday();
}

function getStreak(h){
  let s=0;const d=new Date();
  for(let i=0;i<365;i++){
    const k=d.toISOString().slice(0,10);
    if(h.records[k])s++;else break;d.setDate(d.getDate()-1);
  }return s;
}

function getStreaks(){return habits.map((h,i)=>({idx:i,name:h.name,streak:getStreak(h)})).sort((a,b)=>b.streak-a.streak)}

function openEdit(i){editIdx=i;$('eN').value=habits[i].name;$('eC').value=habits[i].cat;$('eDays').value=habits[i].days;$('editModal').classList.add('show')}
function closeModal(){$('editModal').classList.remove('show');editIdx=-1}
function saveEdit(){if(editIdx<0)return;habits[editIdx].name=$('eN').value;habits[editIdx].cat=$('eC').value;habits[editIdx].days=parseInt($('eDays').value)||30;save();closeModal();switchTab('today')}
function deleteHabit(){if(editIdx<0||!confirm('确定删除此习惯？'))return;habits.splice(editIdx,1);save();closeModal();switchTab('today')}

function renderStats(){
  const total=habits.length;
  const todayDone=habits.filter(h=>h.records[today()]).length;
  const totalChecks=habits.reduce((s,h)=>s+Object.keys(h.records).length,0);
  const avgRate=total?Math.round(todayDone/total*100):0;
  $('statsGrid').innerHTML=`
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">总习惯数</div></div>
    <div class="stat-card"><div class="num">${todayDone}</div><div class="lbl">今日完成</div></div>
    <div class="stat-card"><div class="num">${totalChecks}</div><div class="lbl">总打卡次数</div></div>
    <div class="stat-card"><div class="num">${avgRate}%</div><div class="lbl">今日完成率</div></div>`;

  const bars=[];for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);
    const done=habits.filter(h=>h.records[k]).length;
    const pct=total?Math.round(done/total*100):0;
    bars.push(`<div style="flex:1;text-align:center"><div class="bar" style="height:${pct}%"></div><div class="bar-lbl">${['日','一','二','三','四','五','六'][d.getDay()]}</div></div>`);
  }$('weekBars').innerHTML=bars.join('');

  const cats={};habits.forEach(h=>{cats[h.cat]=(cats[h.cat]||0)+1});
  let catHtml='';Object.entries(cats).forEach(([c,n])=>{
    const pct=Math.round(n/total*100);catHtml+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:.85rem"><span>${c}</span><span>${n}个 (${pct}%)</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
  });$('catDist').innerHTML=catHtml||'<div class="empty">暂无数据</div>';

  const streaks=getStreaks();
  let sHtml='';streaks.forEach(s=>{
    if(s.streak>0)sHtml+=`<div class="li"><span>${s.name}</span><span class="streak-badge fire">🔥 ${s.streak}天</span></div>`;
  });$('streakList').innerHTML=sHtml||'<div class="empty">暂无连续记录</div>';
}

function renderHistory(){
  const days=new Map();habits.forEach(h=>{Object.keys(h.records).forEach(d=>{if(!days.has(d))days.set(d,[]);days.get(d).push(h.name)})});
  const sorted=[...days.entries()].sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30);
  let html='';sorted.forEach(([d,names])=>{html+=`<div class="li"><div><strong>${d}</strong><div style="font-size:.8rem;color:var(--text2)">${names.join('、')}</div></div><span class="tag s">${names.length}个</span></div>`});
  $('historyList').innerHTML=html||'<div class="empty">暂无历史记录</div>';
}

switchTab('today');
</script>
</body>
</html>
