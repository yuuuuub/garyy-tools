<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📸 照片滤镜</title>
<meta name="description" content="在线照片滤镜，20+种滤镜效果，支持亮度对比度调节，一键导出">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s}
.upload-area:hover{border-color:var(--accent);background:var(--tag-bg)}
.upload-icon{font-size:48px;margin-bottom:8px}
.upload-text{font-size:14px;color:var(--text-secondary)}
.preview-wrap{display:flex;justify-content:center;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.preview-wrap canvas{width:100%;height:auto;display:block}
.filter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.filter-btn{padding:10px 4px;border-radius:10px;border:2px solid var(--border);background:var(--card-bg);cursor:pointer;text-align:center;transition:all .2s;font-size:12px}
.filter-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.filter-btn.active{border-color:var(--accent);background:var(--tag-bg);font-weight:600}
.filter-icon{font-size:20px;display:block;margin-bottom:4px}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slider-row label{font-size:13px;color:var(--text-secondary);min-width:60px}
.slider-row input[type="range"]{flex:1}
.slider-row span{font-size:13px;color:var(--text-secondary);min-width:36px;text-align:right}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.hidden{display:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📸 照片滤镜">
<meta property="og:description" content="在线照片滤镜，20+种滤镜效果">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/photo-filter-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📸 照片滤镜</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card" id="uploadCard">
    <div class="card-title">📤 上传照片</div>
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">🖼️</div>
      <div class="upload-text">点击或拖拽上传照片</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="card hidden" id="previewCard">
    <div class="card-title">👁️ 预览</div>
    <div class="preview-wrap"><canvas id="previewCanvas"></canvas></div>
  </div>

  <div class="card hidden" id="filterCard">
    <div class="card-title">🎨 选择滤镜</div>
    <div class="filter-grid" id="filterGrid"></div>
  </div>

  <div class="card hidden" id="adjustCard">
    <div class="card-title">🔧 参数调节</div>
    <div class="slider-row"><label>亮度</label><input type="range" min="-100" max="100" value="0" id="brightness" oninput="applyFilter()"><span id="brightnessVal">0</span></div>
    <div class="slider-row"><label>对比度</label><input type="range" min="-100" max="100" value="0" id="contrast" oninput="applyFilter()"><span id="contrastVal">0</span></div>
    <div class="slider-row"><label>饱和度</label><input type="range" min="-100" max="100" value="0" id="saturation" oninput="applyFilter()"><span id="saturationVal">0</span></div>
    <div class="slider-row"><label>模糊</label><input type="range" min="0" max="20" value="0" id="blur" oninput="applyFilter()"><span id="blurVal">0</span></div>
    <div class="slider-row"><label>色温</label><input type="range" min="-100" max="100" value="0" id="temperature" oninput="applyFilter()"><span id="temperatureVal">0</span></div>
    <div class="slider-row"><label>暗角</label><input type="range" min="0" max="100" value="0" id="vignette" oninput="applyFilter()"><span id="vignetteVal">0</span></div>
  </div>

  <div class="btn-row hidden" id="btnRow">
    <button class="btn btn-primary" onclick="downloadImage()">💾 下载照片</button>
    <button class="btn btn-outline" onclick="resetAll()">🔄 重置</button>
  </div>

  <footer>照片滤镜 · 所有处理本地完成，不上传服务器</footer>
</div>
<div class="toast" id="toast"></div>
<script src="../i18n.js" defer></script>
<script>
let baseImage = null;
let currentFilter = 'normal';

const filters = [
  { name:'原图', id:'normal', icon:'📷', fn: null },
  { name:'黑白', id:'grayscale', icon:'⬛', fn: ctx => ctx.filter += ' grayscale(100%)' },
  { name:'复古', id:'sepia', icon:'🟤', fn: ctx => ctx.filter += ' sepia(100%)' },
  { name:'怀旧', id:'vintage', icon:'🎞️', fn: null },
  { name:'冷色', id:'cool', icon:'🧊', fn: null },
  { name:'暖色', id:'warm', icon:'☀️', fn: null },
  { name:'鲜艳', id:'vivid', icon:'🌈', fn: ctx => ctx.filter += ' saturate(200%)' },
  { name:'柔和', id:'soft', icon:'☁️', fn: ctx => ctx.filter += ' contrast(80%) brightness(110%)' },
  { name:'高对比', id:'hiCon', icon:'🔲', fn: ctx => ctx.filter += ' contrast(180%)' },
  { name:'褪色', id:'fade', icon:'🌫️', fn: ctx => ctx.filter += ' saturate(40%) brightness(120%)' },
  { name:'电影', id:'cinema', icon:'🎬', fn: null },
  { name:'胶片', id:'film', icon:'📷', fn: null },
  { name:'日系', id:'japan', icon:'🇯🇵', fn: null },
  { name:'黑白加', id:'bw+', icon:'🎹', fn: ctx => ctx.filter += ' grayscale(100%) contrast(150%)' },
  { name:'逆光', id:'backlight', icon:'🌅', fn: null },
  { name:'梦幻', id:'dream', icon:'💫', fn: ctx => ctx.filter += ' blur(1px) brightness(120%) saturate(150%)' },
  { name:'锐化', id:'sharp', icon:'🔪', fn: ctx => ctx.filter += ' contrast(130%) saturate(120%)' },
  { name:'夜景', id:'night', icon:'🌙', fn: null },
  { name:'HDR', id:'hdr', icon:'📺', fn: ctx => ctx.filter += ' contrast(150%) saturate(130%) brightness(90%)' },
  { name:'素描', id:'sketch', icon:'✏️', fn: null }
];

function init() {
  document.getElementById('filterGrid').innerHTML = filters.map(f => `<div class="filter-btn${f.id===currentFilter?' active':''}" data-id="${f.id}" onclick="setFilter('${f.id}')"><span class="filter-icon">${f.icon}</span>${f.name}</div>`).join('');

  const ua = document.getElementById('uploadArea');
  const fi = document.getElementById('fileInput');
  ua.addEventListener('click', () => fi.click());
  ua.addEventListener('dragover', e => { e.preventDefault(); ua.classList.add('dragover'); });
  ua.addEventListener('dragleave', () => ua.classList.remove('dragover'));
  ua.addEventListener('drop', e => { e.preventDefault(); ua.classList.remove('dragover'); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
  fi.addEventListener('change', e => { if(e.target.files[0]) loadFile(e.target.files[0]); });
}

function loadFile(f) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      baseImage = img;
      const c = document.getElementById('previewCanvas');
      const maxW = 540;
      const ratio = Math.min(maxW / img.width, 1);
      c.width = img.width * ratio; c.height = img.height * ratio;
      ['uploadCard'].forEach(id => document.getElementById(id).classList.add('hidden'));
      ['previewCard','filterCard','adjustCard','btnRow'].forEach(id => document.getElementById(id).classList.remove('hidden'));
      applyFilter();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
}

function setFilter(id) {
  currentFilter = id;
  document.querySelectorAll('.filter-btn').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  applyFilter();
}

function applyFilter() {
  if (!baseImage) return;
  const c = document.getElementById('previewCanvas');
  const ctx = c.getContext('2d');
  const brightness = +document.getElementById('brightness').value;
  const contrast = +document.getElementById('contrast').value;
  const saturation = +document.getElementById('saturation').value;
  const blur = +document.getElementById('blur').value;
  const temperature = +document.getElementById('temperature').value;
  const vignette = +document.getElementById('vignette').value;

  document.getElementById('brightnessVal').textContent = brightness;
  document.getElementById('contrastVal').textContent = contrast;
  document.getElementById('saturationVal').textContent = saturation;
  document.getElementById('blurVal').textContent = blur;
  document.getElementById('temperatureVal').textContent = temperature;
  document.getElementById('vignetteVal').textContent = vignette;

  ctx.clearRect(0, 0, c.width, c.height);
  ctx.filter = `brightness(${100+brightness}%) contrast(${100+contrast}%) saturate(${100+saturation}%) blur(${blur}px)`;

  const f = filters.find(fl => fl.id === currentFilter);
  if (f && f.fn) f.fn(ctx);

  ctx.drawImage(baseImage, 0, 0, c.width, c.height);

  // temperature
  if (temperature !== 0) {
    const id = ctx.getImageData(0, 0, c.width, c.height);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      d[i] = Math.min(255, Math.max(0, d[i] + temperature * 0.5));
      d[i+2] = Math.min(255, Math.max(0, d[i+2] - temperature * 0.5));
    }
    ctx.putImageData(id, 0, 0);
  }

  // vignette
  if (vignette > 0) {
    const g = ctx.createRadialGradient(c.width/2, c.height/2, c.width*0.3, c.width/2, c.height/2, c.width*0.7);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, `rgba(0,0,0,${vignette/100})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, c.width, c.height);
  }

  // vintage / cinema / film / japan / night / sketch special processing
  if (['vintage','cinema','film','japan','night','sketch'].includes(currentFilter)) {
    const id = ctx.getImageData(0, 0, c.width, c.height);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      if (currentFilter === 'vintage') { d[i] = Math.min(255, d[i]*1.1+20); d[i+1] = d[i+1]*0.9+10; d[i+2] = d[i+2]*0.8; }
      if (currentFilter === 'cinema') { d[i] = d[i]*0.9; d[i+1] = d[i+1]*0.95; d[i+2] = Math.min(255, d[i+2]*1.2); }
      if (currentFilter === 'film') { d[i] = Math.min(255, d[i]*1.05+10); d[i+1] = Math.min(255, d[i+1]*1.02+5); d[i+2] = d[i+2]*0.95; d[i] = d[i]*0.95+d[i+1]*0.05; }
      if (currentFilter === 'japan') { d[i] = Math.min(255, d[i]*1.05); d[i+1] = Math.min(255, d[i+1]*1.08); d[i+2] = Math.min(255, d[i+2]*1.1+10); }
      if (currentFilter === 'night') { d[i] = d[i]*0.6; d[i+1] = d[i+1]*0.7; d[i+2] = Math.min(255, d[i+2]*1.4+20); }
      if (currentFilter === 'sketch') { const g = d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11; d[i]=d[i+1]=d[i+2]= g > 128 ? 255 : 0; }
    }
    ctx.putImageData(id, 0, 0);
  }

  ctx.filter = 'none';
}

function downloadImage() {
  const c = document.getElementById('previewCanvas');
  const a = document.createElement('a');
  a.download = 'filtered-photo.png'; a.href = c.toDataURL('image/png'); a.click();
  showToast('照片已下载！');
}

function resetAll() {
  baseImage = null; currentFilter = 'normal';
  document.getElementById('brightness').value = 0;
  document.getElementById('contrast').value = 0;
  document.getElementById('saturation').value = 0;
  document.getElementById('blur').value = 0;
  document.getElementById('temperature').value = 0;
  document.getElementById('vignette').value = 0;
  document.getElementById('uploadCard').classList.remove('hidden');
  ['previewCard','filterCard','adjustCard','btnRow'].forEach(id => document.getElementById(id).classList.add('hidden'));
}

function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

init();
</script>
</body>
</html>
