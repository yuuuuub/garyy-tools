<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏃 运动日志</title>
<meta name="description" content="记录每日运动锻炼，追踪运动类型、时长和消耗热量">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px;margin-bottom:2px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.exercise-item{padding:12px;border-bottom:1px solid var(--border)}.exercise-item:last-child{border-bottom:none}
.exercise-item .top{display:flex;justify-content:space-between;align-items:center}.exercise-item .name{font-weight:600}.exercise-item .meta{font-size:.8rem;color:var(--text2);margin-top:4px}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.quick-btn{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;text-align:center;transition:all .15s}
.quick-btn:hover{border-color:var(--accent);background:rgba(59,130,246,.08)}
.quick-btn .icon{font-size:1.5rem}.quick-btn .name{font-size:.8rem;margin-top:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🏃 运动日志">
<meta property="og:description" content="记录每日运动锻炼，追踪运动类型、时长和消耗热量">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/exercise-log-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏃 运动日志</h1><p>每一次运动都值得被记录</p></div>

<div class="cd">
<div class="gr">
<div class="st"><div class="nm" id="todayMin" style="color:var(--success)">0</div><div class="lb">今日运动 (分钟)</div></div>
<div class="st"><div class="nm" id="todayCal" style="color:var(--warn)">0</div><div class="lb">消耗热量 (kcal)</div></div>
<div class="st"><div class="nm" id="weekDays" style="color:var(--accent)">0</div><div class="lb">本周运动天数</div></div>
<div class="st"><div class="nm" id="streak" style="color:var(--danger)">0</div><div class="lb">连续运动天数</div></div>
</div></div>

<div class="cd"><h2>快速记录运动</h2>
<div class="quick-grid" id="quickGrid"></div></div>

<div class="cd"><h2>自定义记录</h2>
<label>运动类型</label>
<select id="exType">
<option value="跑步">🏃 跑步</option><option value="走路">🚶 走路</option><option value="骑行">🚴 骑行</option>
<option value="游泳">🏊 游泳</option><option value="力量训练">💪 力量训练</option><option value="瑜伽">🧘 瑜伽</option>
<option value="跳绳">🪢 跳绳</option><option value="篮球">🏀 篮球</option><option value="足球">⚽ 足球</option>
<option value="羽毛球">🏸 羽毛球</option><option value="乒乓球">🏓 乒乓球</option><option value="HIIT">⚡ HIIT</option>
<option value="拉伸">🤸 拉伸</option><option value="其他">🏅 其他</option>
</select>
<div class="fr">
<div><label>运动时长 (分钟)</label><input type="number" id="exDuration" placeholder="30" min="1"></div>
<div><label>消耗热量 (kcal，选填)</label><input type="number" id="exCal" placeholder="自动估算"></div>
</div>
<label>运动感受</label>
<select id="exFeel"><option value="😊 轻松">😊 轻松</option><option value="💪 适中">💪 适中</option><option value="😤 累">😤 累</option><option value="🤯 超累">🤯 超累</option></select>
<label>备注</label><input type="text" id="exNote" placeholder="选填">
<div class="bg"><button onclick="addExercise()">📝 记录运动</button></div></div>

<div class="cd"><h2>今日运动</h2><div id="todayList"></div></div>

<div class="cd"><h2>历史记录</h2>
<div id="historyList"></div></div>
</div>
<script>
(function(){
var DB='exercise_log_cn';
var records=JSON.parse(localStorage.getItem(DB)||'[]');
var CAL_RATES={跑步:10,走路:4,骑行:8,游泳:9,力量训练:7,瑜伽:4,跳绳:12,篮球:8,足球:9,羽毛球:7,乒乓球:6,HIIT:12,拉伸:3,其他:6};
var QUICKS=[{icon:'🏃',name:'跑步',dur:30},{icon:'🚶',name:'走路',dur:30},{icon:'💪',name:'力量训练',dur:45},{icon:'🧘',name:'瑜伽',dur:30},{icon:'🏊',name:'游泳',dur:30},{icon:'⚡',name:'HIIT',dur:20},{icon:'🪢',name:'跳绳',dur:20},{icon:'🚴',name:'骑行',dur:30}];

function today(){return new Date().toLocaleDateString()}
function todayRecords(){return records.filter(function(r){return r.date===today()})}

function renderQuick(){
document.getElementById('quickGrid').innerHTML=QUICKS.map(function(q,i){
return '<div class="quick-btn" onclick="quickAdd('+i+')"><div class="icon">'+q.icon+'</div><div class="name">'+q.name+' '+q.dur+'分钟</div></div>';
}).join('');
}
window.quickAdd=function(i){
var q=QUICKS[i];
var cal=Math.round(q.dur*CAL_RATES[q.name]/60*10)/10;
records.push({type:q.name,duration:q.dur,cal:cal,feel:'💪 适中',note:'',date:today(),id:Date.now()});
localStorage.setItem(DB,JSON.stringify(records));
render();
};

window.addExercise=function(){
var type=document.getElementById('exType').value;
var dur=parseInt(document.getElementById('exDuration').value)||0;
var cal=parseInt(document.getElementById('exCal').value)||0;
var feel=document.getElementById('exFeel').value;
var note=document.getElementById('exNote').value.trim();
if(!dur||dur<1){alert('请输入运动时长');return;}
if(!cal)cal=Math.round(dur*CAL_RATES[type]/60*10)/10;
records.push({type:type,duration:dur,cal:cal,feel:feel,note:note,date:today(),id:Date.now()});
localStorage.setItem(DB,JSON.stringify(records));
document.getElementById('exDuration').value='';document.getElementById('exCal').value='';document.getElementById('exNote').value='';
render();
};

window.delRecord=function(id){records=records.filter(function(r){return r.id!==id});localStorage.setItem(DB,JSON.stringify(records));render();};

function render(){
var tr=todayRecords();
var totalMin=0,totalCal=0;
tr.forEach(function(r){totalMin+=r.duration;totalCal+=r.cal});
document.getElementById('todayMin').textContent=totalMin;
document.getElementById('todayCal').textContent=Math.round(totalCal);

var thisWeek=new Set();
var weekStart=new Date();weekStart.setDate(weekStart.getDate()-weekStart.getDay());
records.forEach(function(r){
var rd=new Date(r.date);
if(rd>=weekStart)thisWeek.add(r.date);
});
document.getElementById('weekDays').textContent=thisWeek.size;

var streak=0;var checkDate=new Date();
while(true){
var dk=checkDate.toLocaleDateString();
var hasRecord=records.some(function(r){return r.date===dk});
if(hasRecord){streak++;checkDate.setDate(checkDate.getDate()-1);}
else break;
}
document.getElementById('streak').textContent=streak;

var el=document.getElementById('todayList');
if(!tr.length){el.innerHTML='<div class="es">今天还没有运动记录</div>';return;}
el.innerHTML=tr.slice().reverse().map(function(r){
return '<div class="exercise-item"><div class="top"><span class="name">'+r.type+'</span><span class="tag">'+r.duration+'分钟</span><span class="tag s">'+r.cal+'kcal</span><button class="dng" style="padding:2px 8px;font-size:.75rem" onclick="delRecord('+r.id+')">✕</button></div><div class="meta">'+r.feel+(r.note?' · '+r.note:'')+'</div></div>';
}).join('');

var hist={};
records.forEach(function(r){
if(!hist[r.date])hist[r.date]={min:0,cal:0,count:0};
hist[r.date].min+=r.duration;
hist[r.date].cal+=r.cal;
hist[r.date].count++;
});
var dates=Object.keys(hist).sort().reverse().slice(0,14);
var hEl=document.getElementById('historyList');
if(!dates.length){hEl.innerHTML='<div class="es">暂无历史数据</div>';return;}
hEl.innerHTML=dates.map(function(d){
return '<div class="li"><div><strong>'+d+'</strong> <span style="color:var(--text2);font-size:.8rem">'+hist[d].count+'项运动</span></div><div><span class="tag">'+hist[d].min+'分钟</span><span class="tag s">'+Math.round(hist[d].cal)+'kcal</span></div></div>';
}).join('');
}
renderQuick();render();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
