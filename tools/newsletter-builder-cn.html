<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="邮件通讯构建器 - 快速创建专业的邮件通讯模板">
    <meta name="robots" content="index, follow">
    <title>邮件通讯构建器</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #007bff; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #0d6efd; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 900px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        textarea, input[type="text"], select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); font-family: inherit; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 80px; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 8px; }
        button:hover { opacity: 0.9; }
        .btn-success { background-color: var(--success-color); }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .output { white-space: pre-wrap; font-family: 'Courier New', monospace; line-height: 1.6; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .copy-btn { background-color: var(--secondary-color); font-size: 14px; padding: 6px 14px; }
        .preview-frame { border: 1px solid var(--border-color); border-radius: 4px; padding: 20px; background: white; color: #333; font-family: Georgia, serif; line-height: 1.8; }
        .section-block { border: 2px dashed var(--border-color); padding: 15px; margin-bottom: 12px; border-radius: 6px; position: relative; }
        .section-block .remove-btn { position: absolute; top: 5px; right: 10px; background: var(--danger-color); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 14px; }
        .add-section-btn { background: var(--secondary-color); border: 2px dashed var(--primary-color); width: 100%; padding: 12px; color: var(--primary-color); font-weight: bold; }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-bar button { flex: 1; }
        .tab-bar button.active { background-color: var(--primary-color); }
        .preview-email { max-width: 600px; margin: 0 auto; }
        .preview-email h1 { font-size: 24px; color: #1a1a2e; border: none; padding: 0; text-align: center; }
        .preview-email .divider { border: none; border-top: 2px solid #eee; margin: 20px 0; }
        .preview-email .article { margin-bottom: 24px; }
        .preview-email .article h2 { font-size: 18px; color: #2d3436; margin-bottom: 8px; }
        .preview-email .article p { font-size: 14px; color: #555; }
        .preview-email .footer { text-align: center; font-size: 12px; color: #999; margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>邮件通讯构建器</h1>
        <div class="tab-bar">
            <button class="active" onclick="switchTab('edit')">编辑内容</button>
            <button onclick="switchTab('preview')">预览效果</button>
            <button onclick="switchTab('code')">导出HTML</button>
        </div>

        <div id="tabEdit">
            <div class="card">
                <div class="grid-2">
                    <div class="form-group">
                        <label>通讯名称</label>
                        <input type="text" id="newsletterName" placeholder="例如：技术周刊 第42期">
                    </div>
                    <div class="form-group">
                        <label>发送者</label>
                        <input type="text" id="senderName" placeholder="您的名字或品牌名">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>主色调</label>
                        <input type="text" id="brandColor" value="#007bff" placeholder="#hex">
                    </div>
                    <div class="form-group">
                        <label>模板类型</label>
                        <select id="templateType">
                            <option value="minimal">极简风格</option>
                            <option value="modern">现代风格</option>
                            <option value="classic">经典风格</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="sectionsContainer">
                <div class="section-block" data-index="0">
                    <button class="remove-btn" onclick="removeSection(this)">×</button>
                    <div class="form-group">
                        <label>文章标题</label>
                        <input type="text" class="sec-title" placeholder="文章标题">
                    </div>
                    <div class="form-group">
                        <label>摘要内容</label>
                        <textarea class="sec-content" rows="3" placeholder="简短描述文章内容..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>链接地址</label>
                        <input type="text" class="sec-link" placeholder="https://...">
                    </div>
                </div>
            </div>
            <button class="add-section-btn" onclick="addSection()">+ 添加文章区块</button>

            <div class="card" style="margin-top:16px;">
                <div class="form-group">
                    <label>页脚文字</label>
                    <input type="text" id="footerText" placeholder="退订链接 | 联系方式">
                </div>
            </div>
            <button onclick="buildNewsletter()" style="width:100%;margin-top:10px;">构建通讯</button>
        </div>

        <div id="tabPreview" style="display:none;">
            <div class="card">
                <div class="preview-email" id="previewArea"></div>
            </div>
        </div>

        <div id="tabCode" style="display:none;">
            <div class="card">
                <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
                    <h2>导出HTML代码</h2>
                    <button class="copy-btn" onclick="copyHtmlCode()">复制代码</button>
                </div>
                <pre id="htmlCodeOutput" class="output" style="background:var(--bg-color);padding:15px;border-radius:4px;max-height:500px;overflow:auto;font-size:13px;"></pre>
                <button class="btn-success" onclick="downloadHtml()" style="margin-top:10px;">下载HTML文件</button>
            </div>
        </div>
    </div>

    <script src="i18n.js" defer></script>
    <script>
        function toggleTheme() { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; }

        let sectionCount = 1;

        function switchTab(tab) {
            document.querySelectorAll('.tab-bar button').forEach((b, i) => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tabEdit').style.display = tab === 'edit' ? 'block' : 'none';
            document.getElementById('tabPreview').style.display = tab === 'preview' ? 'block' : 'none';
            document.getElementById('tabCode').style.display = tab === 'code' ? 'block' : 'none';
        }

        function addSection() {
            sectionCount++;
            const div = document.createElement('div');
            div.className = 'section-block';
            div.dataset.index = sectionCount;
            div.innerHTML = `<button class="remove-btn" onclick="removeSection(this)">×</button>
                <div class="form-group"><label>文章标题</label><input type="text" class="sec-title" placeholder="文章标题"></div>
                <div class="form-group"><label>摘要内容</label><textarea class="sec-content" rows="3" placeholder="简短描述..."></textarea></div>
                <div class="form-group"><label>链接地址</label><input type="text" class="sec-link" placeholder="https://..."></div>`;
            document.getElementById('sectionsContainer').appendChild(div);
        }

        function removeSection(btn) {
            const blocks = document.querySelectorAll('.section-block');
            if (blocks.length > 1) btn.parentElement.remove();
        }

        function getSections() {
            return Array.from(document.querySelectorAll('.section-block')).map(block => ({
                title: block.querySelector('.sec-title').value.trim(),
                content: block.querySelector('.sec-content').value.trim(),
                link: block.querySelector('.sec-link').value.trim()
            })).filter(s => s.title || s.content);
        }

        function buildNewsletter() {
            const sections = getSections();
            const name = document.getElementById('newsletterName').value.trim() || '邮件通讯';
            const sender = document.getElementById('senderName').value.trim() || '团队';
            const color = document.getElementById('brandColor').value.trim() || '#007bff';
            const footer = document.getElementById('footerText').value.trim() || '';
            const type = document.getElementById('templateType').value;

            let articles = sections.map(s => {
                const linkHtml = s.link ? `<a href="${s.link}" style="color:${color};text-decoration:none;">阅读更多 →</a>` : '';
                return `<div style="margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid #eee;">
                    <h2 style="font-size:18px;color:#2d3436;margin:0 0 8px 0;">${s.title || '无标题'}</h2>
                    <p style="font-size:14px;color:#555;margin:0 0 10px 0;">${s.content || ''}</p>
                    ${linkHtml}
                </div>`;
            }).join('');

            const preview = `<div style="max-width:600px;margin:0 auto;font-family:Georgia,serif;">
                <div style="text-align:center;padding:30px 0 20px;">
                    <h1 style="font-size:24px;color:#1a1a2e;margin:0;">${name}</h1>
                    <p style="font-size:13px;color:#999;margin-top:8px;">${sender} · ${new Date().toLocaleDateString('zh-CN')}</p>
                </div>
                <hr style="border:none;border-top:2px solid ${color};margin:0 0 30px 0;">
                ${articles || '<p style="text-align:center;color:#999;">暂无文章内容</p>'}
                <div style="text-align:center;font-size:12px;color:#999;margin-top:30px;padding-top:20px;border-top:1px solid #eee;">
                    <p>${footer}</p>
                    <p>© ${new Date().getFullYear()} ${sender}</p>
                </div>
            </div>`;

            document.getElementById('previewArea').innerHTML = preview;

            const htmlCode = `<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${name}</title></head>
<body style="margin:0;padding:20px;background:#f5f5f5;">
<div style="max-width:600px;margin:0 auto;background:white;padding:30px;font-family:Georgia,serif;border-radius:8px;">
    <div style="text-align:center;padding-bottom:20px;">
        <h1 style="font-size:24px;color:#1a1a2e;margin:0;">${name}</h1>
        <p style="font-size:13px;color:#999;margin-top:8px;">${sender} · ${new Date().toLocaleDateString('zh-CN')}</p>
    </div>
    <hr style="border:none;border-top:2px solid ${color};margin:0 0 30px 0;">
    ${sections.map(s => `<div style="margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid #eee;">
        <h2 style="font-size:18px;color:#2d3436;margin:0 0 8px 0;">${s.title || '无标题'}</h2>
        <p style="font-size:14px;color:#555;margin:0 0 10px 0;">${s.content || ''}</p>
        ${s.link ? `<a href="${s.link}" style="color:${color};text-decoration:none;font-size:14px;">阅读更多 →</a>` : ''}
    </div>`).join('\n    ')}
    <div style="text-align:center;font-size:12px;color:#999;margin-top:30px;padding-top:20px;border-top:1px solid #eee;">
        <p>${footer}</p>
        <p>© ${new Date().getFullYear()} ${sender}</p>
    </div>
</div>
</body>
</html>`;
            document.getElementById('htmlCodeOutput').textContent = htmlCode;
            switchTab('preview');
            document.querySelectorAll('.tab-bar button')[1].click();
        }

        function copyHtmlCode() {
            navigator.clipboard.writeText(document.getElementById('htmlCodeOutput').textContent).then(() => alert('HTML代码已复制'));
        }

        function downloadHtml() {
            const blob = new Blob([document.getElementById('htmlCodeOutput').textContent], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = (document.getElementById('newsletterName').value.trim() || 'newsletter') + '.html';
            a.click();
        }
    </script>
</body>
</html>
