<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌐 网络拓扑图 - Network Topology</title>
<meta name="description" content="创建网络拓扑图，可视化网络设备和连接关系">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🌐 网络拓扑图 - Network Topology">
<meta property="og:description" content="创建网络拓扑图，可视化网络设备和连接关系">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/network-topology-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px;z-index:100;box-shadow:var(--shadow)}
.topbar h1{font-size:1rem;color:var(--accent);font-weight:700;margin-right:8px}
.topbar button{padding:6px 12px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.8rem}
.topbar button:hover{border-color:var(--accent)}
.topbar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.topbar .sep{width:1px;height:24px;background:var(--border)}
.palette{position:fixed;top:52px;left:0;right:0;height:60px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;z-index:99;overflow-x:auto}
.palette .device{display:flex;flex-direction:column;align-items:center;padding:6px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.7rem;color:var(--text2);min-width:60px}
.palette .device:hover{border-color:var(--accent);color:var(--accent)}
.palette .device.active{border-color:var(--accent);background:rgba(59,130,246,0.1);color:var(--accent)}
.palette .device canvas{margin-bottom:2px}
.canvas-wrap{position:fixed;top:112px;left:0;right:0;bottom:0;overflow:hidden}
canvas{display:block;cursor:crosshair}
#tooltip{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.8rem;pointer-events:none;display:none;z-index:200;box-shadow:var(--shadow)}
.stats{position:fixed;bottom:16px;left:16px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:.75rem;color:var(--text2);z-index:90}
.info-panel{position:fixed;top:120px;right:16px;width:200px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;z-index:90;box-shadow:var(--shadow);display:none}
.info-panel h3{font-size:.85rem;color:var(--accent);margin-bottom:8px}
.info-panel p{font-size:.8rem;color:var(--text2);margin:4px 0}
.info-panel .lbl{color:var(--text2)}
.info-panel .val{color:var(--text);font-weight:600}
.info-panel input{width:100%;padding:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.8rem;margin-top:4px}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>

<div class="topbar">
<h1>🌐 网络拓扑图</h1>
<button id="btnSelect" onclick="setMode('select')" class="active">🖱 选择</button>
<button id="btnConnect" onclick="setMode('connect')">🔗 连线</button>
<button id="btnDelete" onclick="setMode('delete')">🗑 删除</button>
<div class="sep"></div>
<button onclick="autoLayout()">📐 自动布局</button>
<button onclick="exportPNG()">💾 导出PNG</button>
<button onclick="clearAll()">🧹 清空</button>
<button onclick="loadSample()">📝 示例</button>
</div>

<div class="palette" id="palette"></div>

<div class="canvas-wrap">
<canvas id="c"></canvas>
</div>

<div id="tooltip"></div>
<div class="stats" id="stats">设备: 0 | 连接: 0</div>

<div class="info-panel" id="infoPanel">
<h3>设备信息</h3>
<p><span class="lbl">类型：</span><span class="val" id="infoType">-</span></p>
<p><span class="lbl">名称：</span></p><input id="infoName" onchange="updateDeviceName()">
<p><span class="lbl">IP：</span></p><input id="infoIP" onchange="updateDeviceIP()">
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

const DEVICE_TYPES = [
  {type:'cloud', label:'☁️ 云端', color:'#8b949e'},
  {type:'router', label:'📡 路由器', color:'#3b82f6'},
  {type:'firewall', label:'🛡 防火墙', color:'#ef4444'},
  {type:'switch', label:'🔀 交换机', color:'#22c55e'},
  {type:'server', label:'🖥 服务器', color:'#f59e0b'},
  {type:'database', label:'🗄 数据库', color:'#8b5cf6'},
  {type:'client', label:'💻 终端', color:'#06b6d4'}
];

let devices = [];
let links = [];
let mode = 'select';
let selected = null;
let linkStart = null;
let dragging = null;
let dragOff = {x:0,y:0};
let mouseX=0, mouseY=0;
let deviceId = 0;
const DEVICE_R = 28;

function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}
resize();
window.addEventListener('resize', resize);

// Draw device icons on palette
function initPalette() {
  const pal = document.getElementById('palette');
  pal.innerHTML = DEVICE_TYPES.map(d =>
    `<div class="device" onclick="selectDeviceType('${d.type}')" id="pal-${d.type}">
      <canvas width="32" height="32" id="palCanvas-${d.type}"></canvas>
      <span>${d.label}</span>
    </div>`
  ).join('');

  DEVICE_TYPES.forEach(d => {
    const c = document.getElementById('palCanvas-'+d.type).getContext('2d');
    drawDeviceIcon(c, d.type, 16, 16, 14, d.color);
  });
}

function drawDeviceIcon(ctx, type, x, y, r, color) {
  ctx.clearRect(0,0,32,32);
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;

  switch(type) {
    case 'cloud':
      ctx.beginPath();
      ctx.arc(x, y+2, r*0.7, Math.PI, 0);
      ctx.arc(x-r*0.4, y-2, r*0.5, Math.PI*1.2, Math.PI*0.3);
      ctx.arc(x+r*0.4, y-2, r*0.5, Math.PI*0.7, Math.PI*1.8, true);
      ctx.closePath();
      ctx.fill();
      break;
    case 'router':
      ctx.beginPath();
      ctx.arc(x, y, r*0.7, 0, Math.PI*2);
      ctx.stroke();
      for(let i=0;i<4;i++){
        const a=i*Math.PI/2;
        ctx.beginPath();
        ctx.moveTo(x+Math.cos(a)*r*0.5, y+Math.sin(a)*r*0.5);
        ctx.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
        ctx.stroke();
      }
      break;
    case 'firewall':
      ctx.fillRect(x-r*0.8, y-r*0.2, r*1.6, r*0.4);
      ctx.fillRect(x-r*0.2, y-r*0.8, r*0.4, r*1.6);
      ctx.fillRect(x-r*0.6, y-r*0.6, r*0.3, r*0.3);
      ctx.fillRect(x+r*0.3, y-r*0.6, r*0.3, r*0.3);
      ctx.fillRect(x-r*0.6, y+r*0.3, r*0.3, r*0.3);
      ctx.fillRect(x+r*0.3, y+r*0.3, r*0.3, r*0.3);
      break;
    case 'switch':
      ctx.fillRect(x-r*0.8, y-r*0.3, r*1.6, r*0.6);
      for(let i=0;i<4;i++){
        ctx.beginPath();
        ctx.arc(x-r*0.5+i*r*0.35, y, 2, 0, Math.PI*2);
        ctx.fillStyle='#fff';
        ctx.fill();
      }
      break;
    case 'server':
      ctx.fillRect(x-r*0.6, y-r*0.8, r*1.2, r*1.6);
      for(let i=0;i<3;i++){
        ctx.beginPath();
        ctx.arc(x+r*0.4, y-r*0.5+i*r*0.4, 2, 0, Math.PI*2);
        ctx.fillStyle='#0d1117';
        ctx.fill();
      }
      break;
    case 'database':
      ctx.beginPath();
      ctx.ellipse(x, y-r*0.5, r*0.6, r*0.3, 0, 0, Math.PI*2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x-r*0.6, y-r*0.5);
      ctx.lineTo(x-r*0.6, y+r*0.5);
      ctx.ellipse(x, y+r*0.5, r*0.6, r*0.3, 0, Math.PI, 0, true);
      ctx.lineTo(x+r*0.6, y-r*0.5);
      ctx.stroke();
      break;
    case 'client':
      ctx.fillRect(x-r*0.7, y-r*0.6, r*1.4, r*0.9);
      ctx.fillRect(x-r*0.3, y+r*0.3, r*0.6, r*0.2);
      ctx.fillRect(x-r*0.5, y+r*0.5, r*1, r*0.1);
      break;
  }
}

let selectedDeviceType = 'router';
function selectDeviceType(type) {
  selectedDeviceType = type;
  document.querySelectorAll('.palette .device').forEach(d => d.classList.remove('active'));
  document.getElementById('pal-'+type).classList.add('active');
  setMode('select');
}

function setMode(m) {
  mode = m;
  linkStart = null;
  document.querySelectorAll('.topbar button').forEach(b => b.classList.remove('active'));
  const map = {select:'btnSelect',connect:'btnConnect',delete:'btnDelete'};
  if(map[m]) document.getElementById(map[m]).classList.add('active');
}

function addDevice(x, y) {
  const dt = DEVICE_TYPES.find(d => d.type === selectedDeviceType);
  devices.push({id: deviceId++, type: selectedDeviceType, name: dt.label.replace(/[^\u4e00-\u9fa5a-zA-Z]/g,''), x, y, ip: '192.168.1.'+(deviceId+1), color: dt.color});
  updateStats();
}

function addLink(from, to) {
  if(from === to) return;
  if(links.find(l => (l.from===from&&l.to===to)||(l.from===to&&l.to===from))) return;
  links.push({from, to});
  updateStats();
}

function removeDevice(id) {
  devices = devices.filter(d => d.id !== id);
  links = links.filter(l => l.from !== id && l.to !== id);
  if(selected === id) { selected=null; document.getElementById('infoPanel').style.display='none'; }
  updateStats();
}

function clearAll() {
  if(!confirm('清空所有设备和连接？')) return;
  devices=[]; links=[]; selected=null; deviceId=0;
  document.getElementById('infoPanel').style.display='none';
  updateStats();
}

function updateStats() {
  document.getElementById('stats').textContent = '设备: '+devices.length+' | 连接: '+links.length;
}

function autoLayout() {
  if(!devices.length) return;
  const cx = canvas.width/2, cy = canvas.height/2;
  const levels = {};
  // BFS from cloud/router
  const root = devices.find(d => d.type==='cloud'||d.type==='router') || devices[0];
  levels[root.id] = 0;
  const queue = [root];
  const visited = new Set([root.id]);
  while(queue.length) {
    const cur = queue.shift();
    links.forEach(l => {
      let neighbor = null;
      if(l.from===cur.id && !visited.has(l.to)) neighbor = devices.find(d=>d.id===l.to);
      if(l.to===cur.id && !visited.has(l.from)) neighbor = devices.find(d=>d.id===l.from);
      if(neighbor) {
        visited.add(neighbor.id);
        levels[neighbor.id] = (levels[cur.id]||0)+1;
        queue.push(neighbor);
      }
    });
  }
  devices.forEach(d => {
    if(levels[d.id]===undefined) levels[d.id] = 2;
  });

  const maxLevel = Math.max(...Object.values(levels));
  const levelGroups = {};
  devices.forEach(d => {
    const l = levels[d.id];
    if(!levelGroups[l]) levelGroups[l] = [];
    levelGroups[l].push(d);
  });

  Object.entries(levelGroups).forEach(([level, group]) => {
    const l = parseInt(level);
    const y = 80 + l * (canvas.height-120) / (maxLevel+1);
    group.forEach((d, i) => {
      const spacing = canvas.width / (group.length+1);
      d.x = spacing * (i+1);
      d.y = y;
    });
  });
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Draw links
  links.forEach(l => {
    const a = devices.find(d => d.id===l.from), b = devices.find(d => d.id===l.to);
    if(!a||!b) return;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = 'rgba(139,148,158,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // Draw link preview
  if(linkStart !== null) {
    const a = devices.find(d => d.id===linkStart);
    if(a) {
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(mouseX, mouseY);
      ctx.strokeStyle = 'rgba(59,130,246,0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6,4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Draw devices
  devices.forEach(d => {
    const isSelected = d.id === selected;

    // Shadow
    ctx.beginPath();
    ctx.arc(d.x+2, d.y+2, DEVICE_R, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();

    // Circle
    ctx.beginPath();
    ctx.arc(d.x, d.y, DEVICE_R, 0, Math.PI*2);
    ctx.fillStyle = isSelected ? '#fff' : d.color + '33';
    ctx.fill();
    ctx.strokeStyle = isSelected ? d.color : d.color;
    ctx.lineWidth = isSelected ? 3 : 2;
    ctx.stroke();

    // Icon
    drawDeviceIcon(ctx, d.type, d.x, d.y, DEVICE_R*0.6, isSelected?'#0d1117':d.color);

    // Label
    ctx.fillStyle = '#e6edf3';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(d.name, d.x, d.y + DEVICE_R + 4);
  });

  requestAnimationFrame(draw);
}

function findDevice(x,y) {
  return devices.find(d => Math.hypot(d.x-x, d.y-y) < DEVICE_R);
}

canvas.addEventListener('mousedown', e => {
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  const d = findDevice(mx, my);

  if(mode==='select') {
    if(d) {
      selected = d.id;
      dragging = d;
      dragOff = {x:mx-d.x, y:my-d.y};
      showInfo(d);
    } else {
      addDevice(mx, my);
      selected = null;
      document.getElementById('infoPanel').style.display='none';
    }
  } else if(mode==='connect') {
    if(d) {
      if(linkStart===null) linkStart=d.id;
      else { addLink(linkStart, d.id); linkStart=null; }
    }
  } else if(mode==='delete') {
    if(d) removeDevice(d.id);
  }
});

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX=e.clientX-r.left; mouseY=e.clientY-r.top;
  if(dragging) {
    dragging.x = mouseX - dragOff.x;
    dragging.y = mouseY - dragOff.y;
  }
});

canvas.addEventListener('mouseup', () => { dragging=null; });

function showInfo(d) {
  const panel = document.getElementById('infoPanel');
  panel.style.display='block';
  document.getElementById('infoType').textContent = DEVICE_TYPES.find(t=>t.type===d.type)?.label || d.type;
  document.getElementById('infoName').value = d.name;
  document.getElementById('infoIP').value = d.ip;
}

function updateDeviceName() {
  const d = devices.find(d => d.id===selected);
  if(d) d.name = document.getElementById('infoName').value;
}

function updateDeviceIP() {
  const d = devices.find(d => d.id===selected);
  if(d) d.ip = document.getElementById('infoIP').value;
}

function exportPNG() {
  const link = document.createElement('a');
  link.download = 'network-topology.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function loadSample() {
  devices = []; links = []; deviceId = 0;
  const cw = canvas.width, ch = canvas.height;
  // Cloud
  devices.push({id:deviceId++,type:'cloud',name:'互联网',x:cw/2,y:50,ip:'N/A',color:'#8b949e'});
  // Firewall
  devices.push({id:deviceId++,type:'firewall',name:'防火墙',x:cw/2,y:150,ip:'10.0.0.1',color:'#ef4444'});
  // Router
  devices.push({id:deviceId++,type:'router',name:'核心路由',x:cw/2,y:250,ip:'10.0.0.254',color:'#3b82f6'});
  // Switches
  devices.push({id:deviceId++,type:'switch',name:'交换机A',x:cw/4,y:350,ip:'10.0.1.1',color:'#22c55e'});
  devices.push({id:deviceId++,type:'switch',name:'交换机B',x:cw*3/4,y:350,ip:'10.0.2.1',color:'#22c55e'});
  // Servers
  devices.push({id:deviceId++,type:'server',name:'Web服务器',x:cw/6,y:450,ip:'10.0.1.10',color:'#f59e0b'});
  devices.push({id:deviceId++,type:'database',name:'数据库',x:cw/3,y:450,ip:'10.0.1.20',color:'#8b5cf6'});
  devices.push({id:deviceId++,type:'server',name:'应用服务器',x:cw*2/3,y:450,ip:'10.0.2.10',color:'#f59e0b'});
  // Clients
  devices.push({id:deviceId++,type:'client',name:'工作站A',x:cw/6,y:540,ip:'10.0.1.100',color:'#06b6d4'});
  devices.push({id:deviceId++,type:'client',name:'工作站B',x:cw/3,y:540,ip:'10.0.1.101',color:'#06b6d4'});
  devices.push({id:deviceId++,type:'client',name:'工作站C',x:cw*2/3,y:540,ip:'10.0.2.100',color:'#06b6d4'});

  links = [
    {from:0,to:1},{from:1,to:2},{from:2,to:3},{from:2,to:4},
    {from:3,to:5},{from:3,to:6},{from:4,to:7},
    {from:3,to:8},{from:3,to:9},{from:4,to:10}
  ];
  updateStats();
}

initPalette();
selectDeviceType('router');
loadSample();
draw();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
