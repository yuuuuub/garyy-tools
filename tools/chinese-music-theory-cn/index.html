<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国音乐理论大全 - Chinese Music Theory Encyclopedia</title>
<meta name="description" content="中国音乐理论大全，涵盖五声音阶、宫调系统、律学与传统音乐美学的系统知识">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国音乐理论大全 - Chinese Music Theory Encyclopedia">
<meta property="og:description" content="中国音乐理论大全，涵盖五声音阶、宫调系统、律学与传统音乐美学的系统知识">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-music-theory-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎼</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#818cf8;--accent2:#6366f1}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#4f46e5;--accent2:#4338ca}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#0a0520 0%,#100a30 50%,#1a1040 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #2a1a6a;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#818cf8,#a5b4fc,#6366f1,#4f46e5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.theory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.theory-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.theory-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.theory-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.theory-card .th-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.theory-card .th-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(129,140,248,0.15);color:var(--accent)}
.theory-card .th-name{font-size:1.3em;font-weight:bold}
.theory-card .th-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.theory-card .th-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.theory-card .th-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.theory-card .th-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.theory-card .th-detail strong{color:var(--text)}
.theory-card .th-formula{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;font-size:0.85em;color:var(--accent);font-family:monospace;background:var(--bg);padding:8px 12px;border-radius:8px}
.theory-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.theory-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🎼 中国音乐理论大全</h1>
<p>Chinese Music Theory Encyclopedia — 探索五声音阶、宫调系统与传统音乐美学</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索理论、概念或术语...（如"五声""宫调""三分损益"）" title="Enter键搜索">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="音阶体系">音阶体系</button>
<button class="filter-btn" data-filter="宫调理论">宫调理论</button>
<button class="filter-btn" data-filter="律学">律学</button>
<button class="filter-btn" data-filter="音乐美学">音乐美学</button>
<button class="filter-btn" data-filter="记谱法">记谱法</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="theory-grid" id="theoryGrid"></div>
</div>
<footer>中国音乐理论大全 — 乐理之源 · 千年智慧 · garyy.top</footer>
<script>
const theoryData=[
{name:"五声音阶",category:"音阶体系",icon:"🎹",subtitle:"宫商角徵羽",description:"五声音阶是中国传统音乐的基础，由宫、商、角、徵、羽五个音组成。对应西方音乐的C、D、E、G、A。五声音阶无半音关系，形成独特的东方韵味。",formula:"宫(C) → 商(D) → 角(E) → 徵(G) → 羽(A)"},
{name:"七声雅乐音阶",category:"音阶体系",icon:"🎶",subtitle:"五声+变徵变宫",description:"在五声音阶基础上加入变徵（#F）和变宫（B），形成七声雅乐音阶。这是中国古代雅乐使用的音阶形式。",formula:"宫(C) 商(D) 角(E) 变徵(#F) 徵(G) 羽(A) 变宫(B)"},
{name:"七声清乐音阶",category:"音阶体系",icon:"🎶",subtitle:"五声+清角变宫",description:"在五声音阶基础上加入清角（F）和变宫（B），形成七声清乐音阶。这是民间音乐常用的音阶形式。",formula:"宫(C) 商(D) 角(E) 清角(F) 徵(G) 羽(A) 变宫(B)"},
{name:"七声燕乐音阶",category:"音阶体系",icon:"🎶",subtitle:"五声+清角闰",description:"在五声音阶基础上加入清角（F）和闰（bB），形成七声燕乐音阶。这是隋唐燕乐使用的音阶形式。",formula:"宫(C) 商(D) 角(E) 清角(F) 徵(G) 羽(A) 闰(bB)"},
{name:"十二律",category:"宫调理论",icon:"🔢",subtitle:"黄钟大吕",description:"十二律是将一个八度分为十二个半音的律制，从低到高依次为：黄钟、大吕、太簇、夹钟、姑洗、仲吕、蕤宾、林钟、夷则、南吕、无射、应钟。",formula:"黄钟 大吕 太簇 夹钟 姑洗 仲吕 蕤宾 林钟 夷则 南吕 无射 应钟"},
{name:"三分损益法",category:"律学",icon:"📐",subtitle:"律学之祖",description:"三分损益法是中国最早的生律方法，由春秋时期的管仲提出。通过弦长的三分之二（损）或三分之四（益）交替计算，产生五声音阶的各音。",formula:"黄钟 → 林钟 → 太簇 → 南吕 → 姑洗 → 应钟 → 蕤宾 → 大吕 → 夷则 → 夹钟 → 无射 → 仲吕"},
{name:"十二平均律",category:"律学",icon:"⚖️",subtitle:"朱载堉的贡献",description:"明代朱载堉发明的十二平均律，将八度等分为十二个半音，每个半音的频率比为2的12次方根。这一发明比欧洲早了一百多年。",formula:"频率比 = 2^(1/12) ≈ 1.059463"},
{name:"宫调系统",category:"宫调理论",icon:"🏛️",subtitle:"旋宫转调",description:"宫调系统是以十二律为基础，每律可作为宫音，形成十二个不同的宫。每个宫又可采用五种不同的调式，形成六十调。",formula:"十二律 × 五种调式 = 六十调"},
{name:"工尺谱",category:"记谱法",icon:"📝",subtitle:"传统记谱法",description:"工尺谱是中国传统的记谱方法，用\"上尺工凡六五乙\"等字表示音高。工尺谱在戏曲、民间音乐中广泛使用，至今仍在传承。",formula:"上(C) 尺(D) 工(E) 凡(F) 六(G) 五(A) 乙(B)"},
{name:"减字谱",category:"记谱法",icon:"🎵",subtitle:"古琴专用谱",description:"减字谱是古琴的专用记谱法，用汉字偏旁部首的缩写表示左手按弦位置和右手弹奏技法。减字谱是世界上最早的指位谱之一。",formula:"如：大指九徽勾一弦 = 「勹」+「九」+「一」"},
{name:"音乐美学·中和",category:"音乐美学",icon:"☯️",subtitle:"中正平和",description:"中国传统音乐美学强调\"中和\"之美，追求音乐的和谐平衡。《乐记》提出\"乐者，天地之和也\"，音乐应达到\"温柔敦厚\"的境界。",formula:"中 = 不偏不倚 | 和 = 和谐统一"},
{name:"音乐美学·气韵",category:"音乐美学",icon:"🌊",subtitle:"气韵生动",description:"\"气韵生动\"原为绘画理论，后引入音乐美学。音乐演奏要\"以气运声\"，追求内在精神与外在技巧的统一，达到\"弦外之音\"的境界。",formula:"气韵 = 内在精神 + 外在技巧 → 弦外之音"},
{name:"音乐美学·意境",category:"音乐美学",icon:"🏔️",subtitle:"弦外之音",description:"中国音乐追求\"意境\"之美，不满足于音声本身的表达，更追求\"弦外之音\"\"象外之意\"。音乐要营造一种超越音响本身的精神境界。",formula:"音声 → 意象 → 意境 → 象外之意"},
{name:"板眼体系",category:"记谱法",icon:"📏",subtitle:"节拍记谱",description:"板眼是中国戏曲音乐的节拍体系，\"板\"为强拍，\"眼\"为弱拍。有板无眼（1/4）、一板一眼（2/4）、一板三眼（4/4）、散板（自由节拍）。",formula:"有板无眼(1/4) | 一板一眼(2/4) | 一板三眼(4/4) | 散板(自由)"}
];
function getStats(data){const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});return cats}
function renderStats(data){const stats=getStats(data);document.getElementById('statsOverview').innerHTML=`<div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">理论条目</div></div>`+Object.entries(stats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}
function renderCards(data){document.getElementById('theoryGrid').innerHTML=data.map(m=>`<div class="theory-card" data-category="${m.category}"><div class="th-header"><div class="th-icon">${m.icon}</div><div><div class="th-name">${m.name}</div><div class="th-sub">${m.subtitle}</div></div></div><div class="th-meta"><span>${m.category}</span></div><div class="th-detail">${m.description}</div><div class="th-formula">${m.formula}</div></div>`).join('')}
function filterCards(){const q=document.getElementById('searchInput').value.toLowerCase();const f=document.querySelector('.filter-btn.active').dataset.filter;const filtered=theoryData.filter(m=>{const matchF=f==='all'||m.category===f;const matchQ=!q||m.name.toLowerCase().includes(q)||m.description.toLowerCase().includes(q)||m.subtitle.toLowerCase().includes(q);return matchF&&matchQ});renderCards(filtered);renderStats(filtered)}
document.getElementById('searchInput').addEventListener('input',filterCards);
document.getElementById('filterRow').addEventListener('click',e=>{if(e.target.classList.contains('filter-btn')){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');filterCards()}});
renderCards(theoryData);renderStats(theoryData);
</script>
</body>
</html>
