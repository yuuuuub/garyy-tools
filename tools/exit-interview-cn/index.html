<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离职面谈</title>
<meta name="description" content="离职面谈工具 - 结构化离职访谈，收集反馈改进组织">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚪</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a371f7;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
input,textarea,select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
textarea{resize:vertical;min-height:60px}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:550px;max-height:80vh;overflow-y:auto}
.interview-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all .2s}
.interview-card:hover{border-color:var(--accent)}
.interview-header{display:flex;justify-content:space-between;align-items:center}
.interview-name{font-weight:700;font-size:1.05rem}
.interview-date{font-size:.8rem;color:var(--text2)}
.reason-tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.8rem;font-weight:600}
.reason-better{background:rgba(63,185,80,.2);color:var(--green)}
.reason-culture{background:rgba(163,113,247,.2);color:var(--purple)}
.reason-growth{background:rgba(59,130,246,.2);color:var(--accent)}
.reason-salary{background:rgba(210,153,34,.2);color:var(--yellow)}
.reason-other{background:rgba(139,148,158,.2);color:var(--text2)}
.qa-item{padding:12px;background:var(--bg);border-radius:8px;margin-bottom:8px}
.qa-question{font-weight:600;font-size:.9rem;margin-bottom:4px;color:var(--accent)}
.qa-answer{font-size:.9rem;line-height:1.5}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat-card{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.stat-num{font-size:2rem;font-weight:700}
.stat-label{font-size:.8rem;color:var(--text2);margin-top:4px}
.reasons-chart{display:grid;gap:8px;margin:12px 0}
.reason-bar{display:flex;align-items:center;gap:10px}
.reason-label{width:100px;font-size:.85rem;color:var(--text2);text-align:right}
.reason-track{flex:1;height:24px;background:var(--bg);border-radius:4px;overflow:hidden}
.reason-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:.75rem;color:#fff;font-weight:600}
@media(max-width:600px){h1{font-size:1.4rem}.stats-grid{grid-template-columns:repeat(2,1fr)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🚪 离职面谈';
const APP=document.getElementById('app');
const QUESTIONS=['你离职的主要原因是什么？','你对公司文化有什么看法？','你的直属领导管理方式如何？','你认为公司最需要改进什么？','你会推荐朋友来这里工作吗？','你对公司福利待遇满意吗？','你在公司最有成就感的是什么？','你对公司有什么建议？'];
const REASONS={better:'更好的机会',culture:'文化不匹配',growth:'成长受限',salary:'薪资不满意',other:'其他原因'};
let data=JSON.parse(localStorage.getItem('ei_data')||'{"interviews":[]}');

function save(){localStorage.setItem('ei_data',JSON.stringify(data))}

function render(){
  let h=`<h1>🚪 离职面谈</h1><p class="subtitle">结构化离职访谈，收集真实反馈</p>`;
  const total=data.interviews.length;
  const reasonCounts={};data.interviews.forEach(i=>{reasonCounts[i.reason]=(reasonCounts[i.reason]||0)+1});
  const topReason=Object.entries(reasonCounts).sort((a,b)=>b[1]-a[1])[0];

  h+=`<div class="stats-grid">`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--accent)">${total}</div><div class="stat-label">面谈总数</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--purple)">${new Set(data.interviews.map(i=>i.department)).size}</div><div class="stat-label">涉及部门</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--yellow)">${topReason?REASONS[topReason[0]]||topReason[0]:'-'}</div><div class="stat-label">最常见原因</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--green)">${new Set(data.interviews.map(i=>i.interviewer)).size}</div><div class="stat-label">面谈官数</div></div>`;
  h+=`</div>`;

  if(total>0){
    h+=`<div class="card"><b>📊 离职原因分布</b><div class="reasons-chart">`;
    const maxCount=Math.max(...Object.values(reasonCounts));
    Object.entries(REASONS).forEach(([key,label])=>{
      const count=reasonCounts[key]||0;
      const pct=maxCount?count/maxCount*100:0;
      const colors={better:'var(--green)',culture:'var(--purple)',growth:'var(--accent)',salary:'var(--yellow)',other:'var(--text2)'};
      h+=`<div class="reason-bar"><span class="reason-label">${label}</span><div class="reason-track"><div class="reason-fill" style="width:${pct}%;background:${colors[key]}">${count}</div></div></div>`;
    });
    h+=`</div></div>`;
  }

  h+=`<div class="card"><div class="flex-between"><b>💬 面谈问题模板</b><button class="btn btn-sm btn-outline" onclick="addQuestion()">+ 添加</button></div>`;
  QUESTIONS.forEach((q,i)=>{h+=`<div class="qa-item"><span style="font-size:.9rem">${i+1}. ${q}</span></div>`});
  h+=`</div>`;

  h+=`<div class="flex-between" style="margin:16px 0 12px"><b style="font-size:1.1rem">📋 面谈记录</b><button class="btn btn-sm" onclick="addInterview()">+ 新建面谈</button></div>`;

  if(!data.interviews.length) h+=`<div class="card" style="text-align:center;color:var(--text2);padding:40px">暂无面谈记录</div>`;

  data.interviews.forEach((interview,i)=>{
    h+=`<div class="interview-card"><div class="interview-header"><div><span class="interview-name">${interview.name}</span><span class="reason-tag reason-${interview.reason}" style="margin-left:8px">${REASONS[interview.reason]}</span></div><div class="flex"><span class="interview-date">${interview.date} · ${interview.department}</span><button class="btn btn-sm btn-danger" onclick="delInterview(${i})">删除</button></div></div>`;
    if(interview.answers){
      interview.answers.forEach((a,ai)=>{
        if(a) h+=`<div class="qa-item"><div class="qa-question">${QUESTIONS[ai]||`问题${ai+1}`}</div><div class="qa-answer">${a}</div></div>`;
      });
    }
    if(interview.overallNotes){h+=`<div class="qa-item"><div class="qa-question">综合记录</div><div class="qa-answer">${interview.overallNotes}</div></div>`}
    h+=`</div>`;
  });
  APP.innerHTML=h;
}

function addInterview(){
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">🚪 新建面谈</h3>
    <label>离职员工</label><input id="en" placeholder="姓名">
    <label>部门</label><input id="edep" placeholder="部门">
    <label>面谈官</label><input id="eint" placeholder="面谈官姓名">
    <label>离职原因</label><select id="erea">${Object.entries(REASONS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
    <label>日期</label><input id="edate" type="date" value="${new Date().toISOString().split('T')[0]}">
    ${QUESTIONS.map((q,i)=>`<label>${q}</label><textarea id="ea${i}" rows="2" placeholder="回答..."></textarea>`).join('')}
    <label>综合记录</label><textarea id="eon" placeholder="其他重要信息..."></textarea>
    <div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    <button class="btn btn-success" onclick="saveInterview()">保存</button></div></div>`;
  document.body.appendChild(m);
}
function saveInterview(){
  const name=document.getElementById('en').value.trim();if(!name){alert('请输入姓名');return}
  const answers=QUESTIONS.map((_,i)=>document.getElementById('ea'+i).value.trim());
  data.interviews.push({name,department:document.getElementById('edep').value.trim(),interviewer:document.getElementById('eint').value.trim(),reason:document.getElementById('erea').value,date:document.getElementById('edate').value,answers,overallNotes:document.getElementById('eon').value.trim()});
  save();document.querySelector('.modal-overlay').remove();render();
}
function delInterview(i){if(confirm('删除此面谈记录？')){data.interviews.splice(i,1);save();render()}}
function addQuestion(){const q=prompt('新问题：');if(q){QUESTIONS.push(q);render()}}
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
