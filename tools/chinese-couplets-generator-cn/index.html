min-width:60px;text-align:center;border:2px solid #b91c1c}.couplet-heng{writing-mode:horizontal-tb;background:#dc2626;color:#fbbf24;font-size:1.2rem;padding:10px 20px;border-radius:8px;line-height:1.6;letter-spacing:0.1em;font-weight:bold;text-align:center;border:2px solid #b91c1c;max-width:300px;margin:0 auto}.couplet-list{margin-top:16px}.couplet-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;transition:var(--transition)}.couplet-item:hover{border-color:var(--blue)}.couplet-item.selected{border-color:var(--red);background:rgba(239,68,68,.1)}.couplet-item .upper{color:var(--red);font-weight:bold}.couplet-item .lower{color:#0969da;font-weight:bold}.couplet-item .heng{color:var(--green);font-size:.9rem;margin-top:4px}.couplet-item .note{color:var(--text2);font-size:.8rem;margin-top:4px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}</style><meta property="og:title" content="中国对联生成器"><meta property="og:description" content="中国对联生成器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏮</text></svg>"></head><body>

<div class="input-group" id="keywordGroup" style="display:none"><label>关键词/主题</label><input type="text" id="keyword" placeholder="如：龙年、花开、富贵..."></div>
<div class="input-group"><label>字数</label><select id="length"><option value="5">五言</option><option value="7" selected>七言</option><option value="9">九言</option><option value="11">十一言</option></select></div>
<div class="input-group"><label>风格</label><select id="style"><option value="elegant">典雅庄重</option><option value="lively">喜庆热闹</option><option value="literary">文雅诗意</option><option value="folk">通俗易懂</option></select></div>
<button class="btn" onclick="generate()">生成对联</button>
<button class="btn" onclick="randomGen()" style="background:var(--green)">随机推荐</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>

{upper:"花烛笑迎比翼鸟",lower:"洞房喜开并蒂莲",heng:"永结同心",note:"洞房花烛"},

],

{upper:"生意兴隆通四海",lower:"财源茂盛达三江",heng:"财源广进",note:"经典生意联"},
{upper:"门迎晓日财源广",lower:"户纳春风吉庆多",heng:"生意兴隆",note:"吉祥生意"},
{upper:"百事生意好",lower:"万商云集财源多",heng:"日进斗金",note:"商贸繁荣"},

{upper:"山高水长天地宽",lower:"松青竹翠岁月安",heng:"宁静致远",note:"淡泊明志"}
]};
var typeNames={spring:"春联",wedding:"婚联",longevity:"寿联",memorial:"挽联",couple:"对偶联",study:"书房联",door:"大门联",business:"生意联",custom:"自定义"};
document.getElementById('type').addEventListener('change',function(){
document.getElementById('keywordGroup').style.display=this.value==='custom'?'block':'none';
});
function generate(){
var t=document.getElementById('type').value;
var l=parseInt(document.getElementById('length').value);
var list=couplets[t]||couplets.spring;
var filtered=list.filter(function(c){return c.upper.length===l||c.lower.length===l});
if(filtered.length===0) filtered=list;
var selected=filtered[Math.floor(Math.random()*filtered.length)];
var html='<div class="card"><h3 style="text-align:center;margin-bottom:8px">'+typeNames[t]+'</h3>';
html+='<div class="couplet-col" style="margin:0 auto">'+selected.upper+'</div>';
html+='<div class="couplet-heng">'+selected.heng+'</div>';
html+='<div class="couplet-col" style="margin:0 auto">'+selected.lower+'</div>';
html+='<p style="text-align:center;color:var(--text2);margin-top:16px;font-size:.85rem">'+selected.note+'</p>';
html+='</div><div class="card"><h3>更多推荐</h3><div class="couplet-list">';
filtered.forEach(function(c,i){
html+='<div class="couplet-item" onclick="showDetail('+i+')" data-idx="'+i+'">';
html+='<div class="upper">上联：'+c.upper+'</div>';
html+='<div class="lower">下联：'+c.lower+'</div>';
html+='<div class="heng">横批：'+c.heng+'</div></div>';
});
html+='</div></div>';
html+='<div class="card"><h3>对联贴法</h3><p style="color:var(--text2);line-height:1.8;margin-top:8px">📌 面对大门：<strong>上联贴右边</strong>，<strong>下联贴左边</strong><br>📌 横批从左到右书写（现代）或从右到左（传统）<br>📌 区分上下联：上联尾字为<strong>仄声</strong>（三四声），下联尾字为<strong>平声</strong>（一二声）</p></div>';
document.getElementById('result').innerHTML=html;
window._currentList=filtered;
}
function showDetail(idx){
var c=window._currentList[idx];
var items=document.querySelectorAll('.couplet-item');
items.forEach(function(i){i.classList.remove('selected')});
items[idx].classList.add('selected');
}
function randomGen(){
document.getElementById('type').selectedIndex=Math.floor(Math.random()*9);
document.getElementById('length').selectedIndex=Math.random()<0.5?1:0;
document.getElementById('style').selectedIndex=Math.floor(Math.random()*4);
generate();
}
generate();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
