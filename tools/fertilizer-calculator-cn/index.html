<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肥料计算器</title>
<meta property="og:title" content="肥料计算器">
<meta property="og:description" content="肥料计算器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="科学施肥计算，根据土壤和作物需求精准配比氮磷钾肥料">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#8b5cf6;--accent2:#7c3aed;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#8250df;--accent2:#6639ba;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;margin-right:4px}
.li{padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:12px}
.result-item{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.result-item .num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.result-item .label{font-size:.8rem;color:var(--text2);margin-top:4px}
.table-wrap{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:.9rem}
th{color:var(--text2);font-weight:600;font-size:.8rem}
.npk-bar{display:flex;gap:4px;height:24px;border-radius:4px;overflow:hidden;margin:8px 0}
.npk-bar .n{background:#22c55e}
.npk-bar .p{background:#3b82f6}
.npk-bar .k{background:#f59e0b}
.hidden{display:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🧪 肥料计算器</h1><p>科学施肥 · 精准配比 · NPK计算</p></div>

<div class="cd">
<h2>作物与面积</h2>
<div class="fr">
<div><label>作物类型</label><select id="cropType" onchange="updateRecommendation()">
<option>叶菜类(白菜、菠菜)</option><option>果菜类(番茄、辣椒)</option><option>根茎类(萝卜、红薯)</option>
<option>豆类(大豆、豌豆)</option><option>果树(苹果、柑橘)</option><option>花卉(月季、兰花)</option>
<option>草坪</option><option>自定义</option></select></div>
<div><label>种植面积(㎡)</label><input type="number" id="area" placeholder="面积" value="10"></div>
</div>
<div class="fr">
<div><label>土壤肥力</label><select id="soilFert" onchange="updateRecommendation()">
<option value="low">贫瘠</option><option value="mid" selected>中等</option><option value="high">肥沃</option></select></div>
<div><label>生长期</label><select id="growthStage" onchange="updateRecommendation()">
<option>苗期</option><option selected>生长期</option><option>开花期</option><option>结果期</option></select></div>
</div>
</div>

<div class="cd">
<h2>自定义NPK比例</h2>
<p style="font-size:.85rem;color:var(--text2);margin-bottom:8px">或手动输入所需氮(N)、磷(P₂O₅)、钾(K₂O)用量(g/㎡)</p>
<div class="fr">
<div><label>氮 N (g/㎡)</label><input type="number" id="nReq" placeholder="g/㎡" oninput="calculate()"></div>
<div><label>磷 P₂O₅ (g/㎡)</label><input type="number" id="pReq" placeholder="g/㎡" oninput="calculate()"></div>
</div>
<div class="fr">
<div><label>钾 K₂O (g/㎡)</label><input type="number" id="kReq" placeholder="g/㎡" oninput="calculate()"></div>
<div><label>肥料类型</label><select id="fertType" onchange="calculate()">
<option>复合肥(15-15-15)</option><option>尿素(46-0-0)</option><option>过磷酸钙(0-16-0)</option>
<option>硫酸钾(0-0-50)</option><option>有机肥(NPK综合)</option></select></div>
</div>
<button onclick="calculate()" style="margin-top:8px">计算施肥方案</button>
<div id="calcResult"></div>
</div>

<div class="cd">
<h2>常见肥料NPK含量</h2>
<div class="table-wrap">
<table>
<thead><tr><th>肥料名称</th><th>N%</th><th>P₂O₅%</th><th>K₂O%</th><th>类型</th></tr></thead>
<tbody>
<tr><td>尿素</td><td>46</td><td>0</td><td>0</td><td><span class="tag g">氮肥</span></td></tr>
<tr><td>过磷酸钙</td><td>0</td><td>16</td><td>0</td><td><span class="tag" style="background:#3b82f6;color:#fff">磷肥</span></td></tr>
<tr><td>硫酸钾</td><td>0</td><td>0</td><td>50</td><td><span class="tag w">钾肥</span></td></tr>
<tr><td>复合肥(15-15-15)</td><td>15</td><td>15</td><td>15</td><td><span class="tag" style="background:#8b5cf6;color:#fff">复合肥</span></td></tr>
<tr><td>磷酸二铵</td><td>18</td><td>46</td><td>0</td><td><span class="tag" style="background:#3b82f6;color:#fff">复合肥</span></td></tr>
<tr><td>硝酸钾</td><td>13</td><td>0</td><td>46</td><td><span class="tag w">复合肥</span></td></tr>
<tr><td>有机肥(腐熟)</td><td>2</td><td>1.5</td><td>1.5</td><td><span class="tag g">有机肥</span></td></tr>
<tr><td>饼肥</td><td>5</td><td>2</td><td>1</td><td><span class="tag g">有机肥</span></td></tr>
<tr><td>草木灰</td><td>0</td><td>2</td><td>5</td><td><span class="tag w">钾肥</span></td></tr>
</tbody>
</table>
</div>
</div>

<div class="cd">
<h2>施肥记录</h2>
<div id="recordList" class="es">暂无记录</div>
</div>
</div>

<script>
const DB='fertilizer_calculator_db';
let records=JSON.parse(localStorage.getItem(DB)||'[]');

const CROP_NPK={
  '叶菜类(白菜、菠菜)':{n:3,p:1.5,k:2,note:'需氮较多，促进叶片生长'},
  '果菜类(番茄、辣椒)':{n:2.5,p:3,k:4,note:'需磷钾较多，促进果实发育'},
  '根茎类(萝卜、红薯)':{n:1.5,p:2,k:3,note:'需钾较多，促进根茎膨大'},
  '豆类(大豆、豌豆)':{n:1,p:2,k:1.5,note:'自身固氮，减少氮肥'},
  '果树(苹果、柑橘)':{n:2,p:1.5,k:2.5,note:'全年分次施肥'},
  '花卉(月季、兰花)':{n:2,p:2.5,k:2,note:'开花前增磷钾'},
  '草坪':{n:3,p:1,k:1.5,note:'定期少量施肥'},
  '自定义':{n:2,p:2,k:2,note:'根据实际情况调整'},
};

const FERT_NPK={
  '复合肥(15-15-15)':{n:15,p:15,k:15},
  '尿素(46-0-0)':{n:46,p:0,k:0},
  '过磷酸钙(0-16-0)':{n:0,p:16,k:0},
  '硫酸钾(0-0-50)':{n:0,p:0,k:50},
  '有机肥(NPK综合)':{n:2,p:1.5,k:1.5},
};

function updateRecommendation(){
  const crop=document.getElementById('cropType').value;
  const soil=document.getElementById('soilFert').value;
  const r=CROP_NPK[crop]||CROP_NPK['自定义'];
  const mult=soil==='low'?1.3:soil==='high'?0.7:1;
  document.getElementById('nReq').value=(r.n*mult).toFixed(1);
  document.getElementById('pReq').value=(r.p*mult).toFixed(1);
  document.getElementById('kReq').value=(r.k*mult).toFixed(1);
  calculate();
}

function calculate(){
  const area=+document.getElementById('area').value||10;
  const nReq=+document.getElementById('nReq').value||0;
  const pReq=+document.getElementById('pReq').value||0;
  const kReq=+document.getElementById('kReq').value||0;
  const fertType=document.getElementById('fertType').value;
  const fert=FERT_NPK[fertType]||FERT_NPK['复合肥(15-15-15)'];
  const crop=document.getElementById('cropType').value;
  const cropInfo=CROP_NPK[crop];

  const totalN=nReq*area,totalP=pReq*area,totalK=kReq*area;

  let fertAmount=0;
  if(fert.n>0)fertAmount=Math.max(fertAmount,totalN/fert.n*100);
  if(fert.p>0)fertAmount=Math.max(fertAmount,totalP/fert.p*100);
  if(fert.k>0)fertAmount=Math.max(fertAmount,totalK/fert.k*100);

  const actualN=fertAmount*fert.n/100;
  const actualP=fertAmount*fert.p/100;
  const actualK=fertAmount*fert.k/100;

  document.getElementById('calcResult').innerHTML=`
    <div class="result-grid">
      <div class="result-item"><div class="num">${fertAmount.toFixed(0)}g</div><div class="label">肥料总量</div></div>
      <div class="result-item"><div class="num">${(fertAmount/1000).toFixed(2)}kg</div><div class="label">肥料(公斤)</div></div>
      <div class="result-item"><div class="num">${(fertAmount/area).toFixed(0)}g/㎡</div><div class="label">单位用量</div></div>
      <div class="result-item"><div class="num">${area}㎡</div><div class="label">种植面积</div></div>
    </div>
    <div style="margin-top:12px">
      <div style="font-size:.85rem;font-weight:600;margin-bottom:4px">实际NPK供给量(g)</div>
      <div class="npk-bar"><div class="n" style="width:${actualN/(actualN+actualP+actualK+1)*100}%"></div><div class="p" style="width:${actualP/(actualN+actualP+actualK+1)*100}%"></div><div class="k" style="width:${actualK/(actualN+actualP+actualK+1)*100}%"></div></div>
      <div style="display:flex;gap:16px;font-size:.85rem"><span style="color:#22c55e">■ N: ${actualN.toFixed(1)}g</span><span style="color:#3b82f6">■ P: ${actualP.toFixed(1)}g</span><span style="color:#f59e0b">■ K: ${actualK.toFixed(1)}g</span></div>
    </div>
    ${cropInfo?`<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px;font-size:.85rem;color:var(--text2)">💡 ${crop}：${cropInfo.note}</div>`:''}
    <div class="bg"><button onclick="saveRecord('${fertType}',${fertAmount.toFixed(0)},${area})">保存记录</button></div>`;
}

function saveRecord(type,amount,area){
  records.push({type,amount,area,crop:document.getElementById('cropType').value,date:new Date().toLocaleDateString(),id:Date.now()});
  localStorage.setItem(DB,JSON.stringify(records));renderRecords();
}

function renderRecords(){
  const el=document.getElementById('recordList');
  if(!records.length){el.innerHTML='<div class="es">暂无记录</div>';return}
  el.innerHTML=records.map((r,i)=>`<div class="li" style="display:flex;justify-content:space-between;align-items:center">
    <div><strong>${r.crop}</strong> <span class="tag" style="background:var(--accent);color:#fff">${r.type}</span><div style="font-size:.85rem;color:var(--text2)">${r.amount}g · ${r.area}㎡ · ${r.date}</div></div>
    <button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="records.splice(${i},1);localStorage.setItem('${DB}',JSON.stringify(records));renderRecords()">删除</button>
  </div>`).reverse().join('');
}

updateRecommendation();renderRecords();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
