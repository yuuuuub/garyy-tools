<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问卷分析</title>
<meta name="description" content="问卷分析工具，统计问卷结果并生成可视化报告">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6scroll-behavior:smooth;}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:var(--text);font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px;font-family:monospace}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.hidden{display:none!important}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.table th{color:var(--text2);font-size:.85rem;font-weight:600}
.table tr:hover{background:rgba(59,130,246,.05)}
.result-bar{display:flex;align-items:center;gap:10px;margin:8px 0}
.result-label{min-width:80px;font-size:.9rem;text-align:right}
.result-track{flex:1;height:28px;background:var(--border);border-radius:6px;overflow:hidden;position:relative}
.result-fill{height:100%;border-radius:6px;transition:width .4s;display:flex;align-items:center;padding-left:8px;font-size:.8rem;color:#fff;font-weight:600}
.result-pct{min-width:45px;font-size:.9rem;font-weight:600;color:var(--accent)}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="问卷分析">
<meta property="og:description" content="问卷分析工具，统计问卷结果并生成可视化报告">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/survey-analytics-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📊 问卷分析';
const APP=document.getElementById('app');
let surveys=JSON.parse(localStorage.getItem('sa_surveys')||'[]');
let curSurvey=null;
let viewTab='input';
const COLORS=['#3b82f6','#3fb950','#f85149','#d29922','#a855f7','#ec4899','#06b6d4','#f97316'];

function save(){localStorage.setItem('sa_surveys',JSON.stringify(surveys))}

function render(){
  let h=`<h1>📊 问卷分析</h1><p class="subtitle">输入问卷数据，自动生成统计分析</p>`;
  if(curSurvey!==null){
    let s=surveys[curSurvey];
    h+=`<div class="card"><div class="flex-between"><button class="btn btn-sm" onclick="curSurvey=null;render()">← 返回</button><b>${s.title}</b><div class="flex"><button class="btn btn-sm btn-danger" onclick="delSurvey(${curSurvey})">删除</button></div></div></div>`;
    h+=`<div class="card"><div class="flex" style="margin-bottom:12px">`;
    h+=`<button class="btn btn-sm ${viewTab==='input'?'btn-success':''}" onclick="viewTab='input';render()">数据录入</button>`;
    h+=`<button class="btn btn-sm ${viewTab==='results'?'btn-success':''}" onclick="viewTab='results';render()">分析结果</button>`;
    h+=`</div></div>`;
    if(viewTab==='input'){
      h+=`<div class="card"><label>问题定义（每行一个，格式：问题名|选项1,选项2,选项3...）</label>`;
      h+=`<textarea id="questions" rows="6" placeholder="满意度|非常满意,满意,一般,不满意,非常不满意&#10;推荐意愿|一定会,可能会,不确定,可能不会,一定不会&#10;使用频率|每天,每周,每月,很少,从不">${s.questionsText||''}</textarea>`;
      h+=`<button class="btn" onclick="saveQuestions(${curSurvey})">保存问题</button></div>`;
      h+=`<div class="card"><label>录入回答数据（每行一个回答，用逗号分隔每个问题的答案）</label>`;
      h+=`<textarea id="responses" rows="8" placeholder="非常满意,一定会,每天&#10;满意,可能会,每周&#10;一般,不确定,每月">${s.responsesText||''}</textarea>`;
      h+=`<button class="btn" onclick="saveResponses(${curSurvey})">保存数据</button></div>`;
    } else {
      let analysis=analyze(s);
      if(!analysis){
        h+=`<div class="empty">请先录入问题和回答数据</div>`;
      } else {
        h+=`<div class="card"><b style="margin-bottom:4px;display:block">样本总数：${analysis.total} 份</b></div>`;
        analysis.questions.forEach((q,qi)=>{
          h+=`<div class="card"><b style="margin-bottom:12px;display:block">${qi+1}. ${q.name}</b>`;
          q.options.forEach((opt,oi)=>{
            let pct=analysis.total?Math.round(opt.count/analysis.total*100):0;
            h+=`<div class="result-bar"><span class="result-label">${opt.label}</span><div class="result-track"><div class="result-fill" style="width:${pct}%;background:${COLORS[oi%COLORS.length]}">${opt.count}</div></div><span class="result-pct">${pct}%</span></div>`;
          });
          h+=`</div>`;
        });
      }
    }
  } else {
    h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">问卷列表</span><button class="btn btn-sm" onclick="newSurvey()">+ 新建</button></div></div>`;
    surveys.forEach((s,i)=>{
      let info=s.responsesText?s.responsesText.split('\n').filter(Boolean).length+' 份':'未录入';
      h+=`<div class="card"><div class="flex-between"><b>${s.title}</b><div class="flex"><span class="badge badge-blue">${info}</span><button class="btn btn-sm" onclick="openSurvey(${i})">打开</button><button class="btn btn-sm btn-danger" onclick="delSurvey(${i})">×</button></div></div></div>`;
    });
    if(!surveys.length) h+=`<div class="empty">暂无问卷</div>`;
  }
  APP.innerHTML=h;
}

function analyze(s){
  if(!s.questionsText||!s.responsesText) return null;
  let qLines=s.questionsText.trim().split('\n').filter(Boolean);
  let rLines=s.responsesText.trim().split('\n').filter(Boolean);
  if(!qLines.length||!rLines.length) return null;
  let questions=qLines.map(line=>{
    let parts=line.split('|');
    let name=parts[0].trim();
    let options=(parts[1]||'').split(',').map(o=>({label:o.trim(),count:0})).filter(o=>o.label);
    return {name,options};
  });
  rLines.forEach(line=>{
    let answers=line.split(',').map(a=>a.trim());
    answers.forEach((ans,qi)=>{
      if(!questions[qi]) return;
      let opt=questions[qi].options.find(o=>o.label===ans);
      if(opt) opt.count++;
    });
  });
  return {total:rLines.length,questions};
}

function saveQuestions(i){
  surveys[i].questionsText=document.getElementById('questions').value;
  save();alert('问题已保存');
}

function saveResponses(i){
  surveys[i].responsesText=document.getElementById('responses').value;
  save();alert('数据已保存');
}

function newSurvey(){let t=prompt('问卷名称：');if(t){surveys.push({title:t,questionsText:'',responsesText:''});save();render()}}
function openSurvey(i){curSurvey=i;viewTab='input';render()}
function delSurvey(i){if(confirm('删除？')){surveys.splice(i,1);curSurvey=null;save();render()}}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
