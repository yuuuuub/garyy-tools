var currentRound='all';
function render(){
  var tabs=document.getElementById('roundTabs');
  var html='<div class="tab active" onclick="filterRound(\'all\',this)">全部</div>';
  ['小组赛','淘汰赛'].forEach(function(r){
    html+='<div class="tab" onclick="filterRound(\''+r+'\',this)">'+r+'</div>';
  });
  tabs.innerHTML=html;
  showMatches('all');
}

function filterRound(r,el){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  currentRound=r;
  showMatches(r);
}

function showMatches(round){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var list=document.getElementById('matchList');
  var html='';
  matches.forEach(function(round_data){
    if(round!=='all'&&round_data.r!==round)return;
    html+='<div class="group-header">⚽ '+round_data.g+'</div>';
    round_data.m.forEach(function(m){
      if(q&&!m.t.toLowerCase().includes(q)&&!m.a.toLowerCase().includes(q)&&!m.v.toLowerCase().includes(q))return;
      html+='<div class="match-row">';
      html+='<div class="match-time">'+m.d+'<br>'+m.time+'</div>';
      html+='<div class="match-teams"><span class="team home">'+m.t+'</span><span class="vs">vs</span><span class="team away">'+m.a+'</span></div>';
      html+='<div class="match-venue">'+m.v+'</div>';
      html+='</div>';
    });
  });
  list.innerHTML=html||'<div style="text-align:center;padding:20px;color:var(--text2)">无匹配结果</div>';
}

document.getElementById('searchInput').addEventListener('input',function(){showMatches(currentRound)});
