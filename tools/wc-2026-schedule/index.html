<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026世界杯赛程</title>
<meta name="description" content="2026年美加墨世界杯赛程 - 实时数据由ESPN提供"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>"><meta name="robots" content="index, follow"><meta property="og:title" content="2026世界杯赛程"><meta property="og:description" content="2026年美加墨世界杯赛程 - 实时比分">
<style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d29922}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#9a6700}body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;line-height:1.6}.container{max-width:800px;margin:0 auto}h1{text-align:center;padding:20px 0 4px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}.loading{text-align:center;padding:40px;color:var(--text2)}.loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.match-row{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--border)}.match-row:last-child{border-bottom:none}.match-date{font-size:.78rem;color:var(--text2);min-width:52px;text-align:center}.match-teams{flex:1;display:flex;align-items:center;gap:6px;font-size:.9rem}.team{text-align:center;min-width:90px}.team.home{text-align:right}.team.away{text-align:left}.team-name{font-weight:600}.team-score{font-weight:700;color:var(--gold);font-size:1.1rem;min-width:40px;text-align:center}.match-status{font-size:.72rem;padding:2px 8px;border-radius:10px;min-width:50px;text-align:center}.status-live{background:rgba(239,68,68,.2);color:var(--red);animation:pulse 1.5s infinite}.status-ft{background:rgba(35,134,54,.15);color:var(--green)}.status-scheduled{background:rgba(139,148,158,.15);color:var(--text2)}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}.group-badge{font-size:.75rem;padding:2px 8px;background:rgba(210,153,34,.1);color:var(--gold);border-radius:10px;margin-left:4px}.source{text-align:center;font-size:.75rem;color:var(--text2);margin-top:12px}.tab-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.82rem;transition:all .2s}.tab.active{background:var(--gold);color:#000;border-color:var(--gold)}.search-box{margin-bottom:12px}.search-box input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem}.search-box input:focus{border-color:var(--blue);outline:none}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}@media(max-width:480px){body{padding:12px}.team{min-width:70px}.team-name{font-size:.82rem}}</style></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>⚽ 2026世界杯赛程</h1>
<p class="sub">实时比分 · 由ESPN API提供</p>
<div class="card">
<div class="tab-bar" id="filterTabs"></div>
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索球队..."></div>
<div id="matchList"><div class="loading"><div class="spinner"></div><p style="margin-top:12px">加载比赛数据...</p></div></div>
<div class="source">数据来源：ESPN · 自动刷新</div>
</div>
</div>
<script src="../i18n.js" defer></script>
<script>
var API_BASE='https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world';
var STATUS_MAP={'STATUS_SCHEDULED':'未开始','STATUS_IN_PROGRESS':'进行中','STATUS_HALFTIME':'中场休息','STATUS_FULL_TIME':'已结束','STATUS_POSTPONED':'推迟','STATUS_CANCELLED':'取消','STATUS_DELAYED':'延迟'};
var currentFilter='all';
window._allMatches=[];

function renderTabs(){
  var tabs=document.getElementById('filterTabs');
  tabs.innerHTML='<div class="tab active" onclick="filterMatches(\'all\',this)">全部</div>'+
    '<div class="tab" onclick="filterMatches(\'live\',this)">🔴 进行中</div>'+
    '<div class="tab" onclick="filterMatches(\'finished\',this)">✅ 已结束</div>'+
    '<div class="tab" onclick="filterMatches(\'scheduled\',this)">📅 未开始</div>';
}

function filterMatches(f,el){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  if(el)el.classList.add('active');
  currentFilter=f;
  renderMatches();
}

function renderMatches(){
  var matches=window._allMatches;
  var q=document.getElementById('searchInput').value.toLowerCase();
  var list=document.getElementById('matchList');
  var html='';
  var shown=0;
  matches.forEach(function(m){
    if(currentFilter==='live'&&m.statusType!=='STATUS_IN_PROGRESS'&&m.statusType!=='STATUS_HALFTIME')return;
    if(currentFilter==='finished'&&m.statusType!=='STATUS_FULL_TIME')return;
    if(currentFilter==='scheduled'&&m.statusType!=='STATUS_SCHEDULED')return;
    if(q&&!m.home.toLowerCase().includes(q)&&!m.away.toLowerCase().includes(q))return;
    shown++;
    var statusCls=m.statusType==='STATUS_FULL_TIME'?'status-ft':(m.statusType==='STATUS_IN_PROGRESS'||m.statusType==='STATUS_HALFTIME')?'status-live':'status-scheduled';
    var statusText=STATUS_MAP[m.statusType]||m.statusType;
    var dateStr=m.date.substring(5,10).replace('-','/');
    var timeStr=m.date.length>10?m.date.substring(11,16):'';
    html+='<div class="match-row">';
    html+='<div class="match-date">'+dateStr+'<br>'+timeStr+'</div>';
    html+='<div class="match-teams">';
    html+='<span class="team home"><span class="team-name">'+m.home+'</span></span>';
    if(m.statusType==='STATUS_SCHEDULED'){
      html+='<span class="team-score" style="color:var(--text2);font-size:.85rem">vs</span>';
    }else{
      html+='<span class="team-score">'+m.homeScore+' - '+m.awayScore+'</span>';
    }
    html+='<span class="team away"><span class="team-name">'+m.away+'</span></span>';
    html+='</div>';
    html+='<span class="match-status '+statusCls+'">'+statusText+'</span>';
    if(m.group)html+='<span class="group-badge">'+m.group+'</span>';
    html+='</div>';
  });
  list.innerHTML=html||'<div style="text-align:center;padding:20px;color:var(--text2)">无匹配结果</div>';
}

function fetchMatches(){
  fetch(API_BASE+'/scoreboard?dates=20260611-20260719')
    .then(function(r){return r.json()})
    .then(function(data){
      var matches=[];
      (data.events||[]).forEach(function(ev){
        var comp=(ev.competitions||[])[0];
        if(!comp)return;
        var competitors=comp.competitors||[];
        var home=competitors.find(function(c){return c.homeAway==='home';});
        var away=competitors.find(function(c){return c.homeAway==='away';});
        if(!home||!away)return;
        matches.push({
          date:ev.date||'',
          home:home.team?.displayName||home.team?.abbreviation||'?',
          away:away.team?.displayName||away.team?.abbreviation||'?',
          homeScore:home.score||'0',awayScore:away.score||'0',
          statusType:comp.status?.type?.name||'STATUS_SCHEDULED',
          group:comp.group?.name||''
        });
      });
      matches.sort(function(a,b){return a.date.localeCompare(b.date);});
      window._allMatches=matches;
      renderMatches();
    })
    .catch(function(err){
      document.getElementById('matchList').innerHTML='<div style="text-align:center;padding:20px;color:var(--red)">加载失败: '+err.message+'</div>';
    });
}

document.getElementById('searchInput').addEventListener('input',renderMatches);
renderTabs();
fetchMatches();
setInterval(fetchMatches,60*1000);
</script></body></html>
