<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国酒文化 - Chinese Wine Culture</title>
<meta name="description" content="中国酒文化百科，白酒、黄酒、米酒历史，酒桌礼仪，行酒令，名酒典故">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国酒文化 - Chinese Wine Culture">
<meta property="og:description" content="中国酒文化百科，白酒、黄酒、米酒历史，酒桌礼仪，行酒令，名酒典故">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-wine-culture-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍶</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#b8860b;--accent2:#8b6914}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#b8860b;--accent2:#8b6914}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a1505 0%,#2a2010 50%,#3a2a15 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a4020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#daa520,#b8860b,#cd853f,#8b6914);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.tea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.tea-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.tea-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.tea-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.tea-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tea-card .t-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(184,134,11,0.15);color:var(--accent)}
.tea-card .t-name{font-size:1.3em;font-weight:bold}
.tea-card .t-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.tea-card .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tea-card .t-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.tea-card .t-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.tea-card .t-detail strong{color:var(--text)}
.tea-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.tea-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🍶 中国酒文化</h1>
<p>Chinese Wine Culture — 千年酒韵，杯中乾坤</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索酒类、名酒或酒礼...（如"茅台""黄酒""行酒令"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="酒类品种">🍶 酒类品种</button>
<button class="filter-btn" data-filter="酒桌礼仪">🤝 酒桌礼仪</button>
<button class="filter-btn" data-filter="行酒令">🎯 行酒令</button>
<button class="filter-btn" data-filter="名酒典故">📖 名酒典故</button>
<button class="filter-btn" data-filter="酿酒工艺">⚗️ 酿酒工艺</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="tea-grid" id="teaGrid"></div>
<footer><p>🍶 中国酒文化 — 酒逢知己千杯少</p></footer>
</div>
<script>
const TEA_DATA=[
  {id:1,name:"白酒",en:"Baijiu (Chinese White Liquor)",category:"酒类品种",icon:"🍶",summary:"中国烈酒之王",detail:"白酒是中国特有的蒸馏酒，以粮谷为原料，经发酵、蒸馏、陈酿而成。酒精度一般在38%-65%之间。按香型分为酱香、浓香、清香、米香、凤香等十二大香型。",origin:"宋代蒸馏技术成熟",usage:"中国最重要的酒类，占酒类消费总量的70%以上"},
  {id:2,name:"黄酒",en:"Huangjiu (Chinese Yellow Wine)",category:"酒类品种",icon:"🫗",summary:"世界三大古酒之一",detail:"黄酒是中国最古老的酒种之一，以糯米、粳米为原料酿造。酒精度一般在14%-20%之间，色泽金黄，口感醇厚。代表品牌有绍兴花雕、加饭酒等。",origin:"三千多年酿造历史",usage:"江浙地区的传统饮品，也是烹饪料酒"},
  {id:3,name:"米酒",en:"Rice Wine / Jiuniang",category:"酒类品种",icon:"🍚",summary:"甜醇的民间酒",detail:"米酒又称酒酿、醪糟，是以糯米为原料发酵而成的低度甜酒。酒精度仅2%-5%，香甜可口。既是饮品也是传统食品，常用于制作酒酿圆子等甜品。",origin:"新石器时代已有酿造",usage:"南方地区的传统食品和饮品"},
  {id:4,name:"药酒",en:"Medicinal Wine",category:"酒类品种",icon:"🏥",summary:"酒为百药之长",detail:"药酒是将中药材浸泡在白酒或黄酒中制成的保健酒。中医认为酒能活血通络，与药材结合可增强疗效。如人参酒、枸杞酒、蛇酒等。",origin:"《黄帝内经》已有记载",usage:"传统养生与辅助治疗"},
  {id:5,name:"主宾之礼",en:"Host-Guest Drinking Etiquette",category:"酒桌礼仪",icon:"🤝",summary:"座次与敬酒",detail:"酒桌座次讲究：面对门口为尊位，主人坐在门口一侧。敬酒时主人先敬客人三杯，客人回敬。晚辈敬长辈要双手举杯，杯沿要低于长辈。",origin:"周礼传统",usage:"商务宴请与家庭聚餐的基本礼仪"},
  {id:6,name:"酒满敬人",en:"Full Glass Shows Respect",category:"酒桌礼仪",icon:"🍷",summary:"倒酒的讲究",detail:"中国酒文化中'酒满敬人，茶满欺人'。白酒要倒满，表示诚意十足；红酒倒三分之一。敬酒碰杯时，如果对方是长辈或尊者，杯沿要略低于对方以示尊敬。",origin:"民间传统",usage:"日常饮酒与正式宴席的通用礼仪"},
  {id:7,name:"先干为敬",en:"Drain First as a Sign of Respect",category:"酒桌礼仪",icon:"🥂",summary:"以喝完表示诚意",detail:"敬酒时自己先将杯中酒一饮而尽，然后看着对方喝完。这是以身作则表示诚意的做法。但现代酒桌文化中应适度，不应强迫他人饮酒。",origin:"古代军中饮酒传统",usage:"敬酒时表示诚意的标准做法"},
  {id:8,name:"飞花令",en:"Feihua Ling (Flying Flower Game)",category:"行酒令",icon:"🌸",summary:"诗词行酒令",detail:"飞花令是古代文人的高级行酒令。规定一个字（如'花'、'月'、'酒'），轮流说出含该字的诗句，说不出者饮酒。源自唐代韩翃诗句'春城无处不飞花'。",origin:"唐代文人酒会",usage:"文人雅集中的高雅酒令游戏"},
  {id:9,name:"猜拳行令",en:"Finger Guessing Game",category:"行酒令",icon:"✊",summary:"拇战与划拳",detail:"猜拳是最流行的民间酒令。两人同时出拳喊数，所出手指与所喊数字相同者赢。常见有'五魁首''八匹马''六六六'等口诀，气氛热烈。",origin:"明代已广泛流行",usage:"民间饮酒聚会中最活跃的助兴游戏"},
  {id:10,name:"击鼓传花",en:"Pass the Flower while Drum Beats",category:"行酒令",icon:"🥁",summary:"鼓停花落饮酒",detail:"一人蒙眼击鼓，众人依次传递花朵。鼓声停止时花在谁手中，谁就饮酒或表演节目。简单易行，适用于各种规模的饮酒聚会。",origin:"古代宫廷酒令",usage:"聚会与宴会中的经典助兴游戏"},
  {id:11,name:"贵州茅台",en:"Kweichow Moutai",category:"名酒典故",icon:"🏆",summary:"国酒传奇",detail:"茅台酒产于贵州仁怀茅台镇，是酱香型白酒的代表。1915年获巴拿马万国博览会金奖，被誉为'国酒'。酿造工艺独特，需经历九次蒸煮、八次发酵、七次取酒。",origin:"西汉时期已有酿造",usage:"国宴用酒与中国白酒的标杆"},
  {id:12,name:"泸州老窖",en:"Luzhou Laojiao",category:"名酒典故",icon:"🏺",summary:"浓香鼻祖",detail:"泸州老窖产于四川泸州，是浓香型白酒的典型代表。拥有始建于明代万历年间的国宝窖池群，连续使用446年不间断，被誉为'活文物'。",origin:"明代万历年间",usage:"浓香型白酒的标杆产品"},
  {id:13,name:"绍兴花雕",en:"Shaoxing Huadiao",category:"名酒典故",icon:"🫗",summary:"女儿红的故事",detail:"绍兴花雕是黄酒的代表。传统上女儿出生时酿酒封坛，待出嫁时取出饮用，故又称'女儿红'。酒坛上绘有精美花纹，既是酒也是艺术品。",origin:"宋代绍兴传统",usage:"江浙地区婚嫁与宴席的必备酒"},
  {id:14,name:"曲蘖酿酒",en:"QuNie Fermentation",category:"酿酒工艺",icon:"⚗️",summary:"酒曲的发明",detail:"中国是世界上最早使用酒曲酿酒的国家。曲蘖是含霉菌、酵母的发酵剂，将淀粉转化为糖再转化为酒精。这一技术比西方的啤酒花发酵早了两千多年。",origin:"商代已有明确记载",usage:"中国白酒和黄酒酿造的核心技术"},
  {id:15,name:"固态发酵",en:"Solid-State Fermentation",category:"酿酒工艺",icon:"🧱",summary:"白酒的灵魂工艺",detail:"中国白酒采用独特的固态发酵法，以高粱、小麦等谷物为原料，在窖池或地缸中发酵。发酵过程中产生丰富的香味物质，是白酒风味的核心来源。",origin:"元代蒸馏酒技术成熟",usage:"所有中国传统白酒的酿造基础"},
  {id:16,name:"酒桌转盘",en:"Lazy Susan on Dining Table",category:"酒桌礼仪",icon:"🔄",summary:"转盘的礼仪",detail:"使用转盘时要顺时针缓慢转动，不能在别人夹菜时突然转动。别人正在取菜时应等待。转盘上最后一道菜通常留给长辈或客人。",origin:"现代宴席传统",usage:"中式圆桌宴席的标准配置"},
  {id:17,name:"以茶代酒",en:"Tea Instead of Wine",category:"酒桌礼仪",icon:"🍵",summary:"不喝酒的礼仪",detail:"不能饮酒者可用茶代替敬酒，同样表示敬意。说'以茶代酒'即可，不应被强迫饮酒。这一传统古已有之，《三国志》中就有'以茶代酒'的记载。",origin:"三国时期",usage:"不饮酒者的礼貌回应方式"},
  {id:18,name:"酒后真言",en:"Truths After Drinking",category:"名酒典故",icon:"💬",summary:"酒后吐真言",detail:"中国有'酒后吐真言'的说法，认为饮酒后人的防备心降低，会说出平时不敢说的话。李白斗酒诗百篇，张旭醉后狂草，酒成为文人创作的催化剂。",origin:"民间俗语",usage:"理解酒文化心理的重要概念"},
  {id:19,name:"解酒之法",en:"Hangover Remedies",category:"酒桌礼仪",icon:"🍋",summary:"传统解酒智慧",detail:"中国民间有许多解酒方法：喝蜂蜜水缓解头痛，吃梨子生津止渴，饮用葛花茶解酒毒。中医认为酒属湿热之品，解酒需清热利湿、健脾和胃。",origin:"中医养生传统",usage:"饮酒后的传统保健方法"},
  {id:20,name:"封坛酒",en:"Sealed Jar Wine",category:"酿酒工艺",icon:"🪣",summary:"时间的味道",detail:"封坛酒是将新酿的酒密封在陶坛中长期贮存。酒在坛中继续发酵和氧化，口感越来越醇厚。茅台、五粮液等名酒都需贮存数年才能出厂。",origin:"古代储酒传统",usage:"提升酒质的关键工艺环节"}
];
function renderCards(data){
  document.getElementById('teaGrid').innerHTML=data.map(t=>`
    <div class="tea-card" data-category="${t.category}">
      <div class="t-header"><div class="t-icon">${t.icon}</div><div><div class="t-name">${t.name}</div><div class="t-sub">${t.en}</div></div></div>
      <div class="t-meta"><span>${t.summary}</span><span>${t.category}</span></div>
      <div class="t-detail">${t.detail}</div>
      <div class="t-detail"><strong>起源：</strong>${t.origin}</div>
      <div class="t-detail"><strong>应用：</strong>${t.usage}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(t=>{cats[t.category]=(cats[t.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">酒文化</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(TEA_DATA);renderStats(TEA_DATA);
</script>
</body>
</html>
