<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏊 泳池安全指南 - Gary's Tools</title>
<meta name="description" content="夏季游泳安全指南：泳池礼仪、防溺水知识、热身拉伸、抽筋自救、儿童安全须知">
<style>
:root{--bg:#f0f9ff;--card:#fff;--text:#0c4a6e;--text2:#0284c7;--accent:#0ea5e9;--red:#ef4444;--green:#22c55e;--border:#bae6fd;--radius:14px}
[data-theme="dark"]{--bg:#082f49;--card:#0c4a6e;--text:#bae6fd;--text2:#38bdf8;--border:#0369a1}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#0284c7,#0ea5e9,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.03)}
.card h3{font-size:1rem;font-weight:700;margin-bottom:12px}
.rule-list{display:flex;flex-direction:column;gap:8px}
.rule-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.8rem;line-height:1.5}
.rule-item .r-icon{font-size:1.2rem;flex-shrink:0}
.rule-item.do{border-left:3px solid var(--green)}
.rule-item.dont{border-left:3px solid var(--red)}
.stretch-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stretch-item{padding:12px;background:var(--bg);border-radius:10px;font-size:.78rem;text-align:center;line-height:1.5}
.stretch-item .s-emoji{font-size:1.6rem;display:block;margin-bottom:4px}
.cramp-card{padding:14px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:10px;margin-bottom:8px}
.cramp-card .c-name{font-weight:800;font-size:.85rem;color:var(--red);margin-bottom:4px}
.cramp-card .c-fix{font-size:.78rem;line-height:1.5}
.kid-tips{display:flex;flex-direction:column;gap:8px}
.kid-tip{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.78rem}
.kid-tip .k-num{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:900;flex-shrink:0}
.alert-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:14px;font-size:.8rem;line-height:1.6;text-align:center}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🏊 泳池安全指南 - Gary's Tools">
  <meta property="og:description" content="夏季游泳安全指南：泳池礼仪、防溺水知识、热身拉伸、抽筋自救、儿童安全须知">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/pool-safety/">
</head>
<body>
<div class="container">
<header><h1>🏊 泳池安全指南</h1><p>夏日清凉 · 安全第一</p></header>

<div class="card">
<h2>📋 泳池黄金法则</h2>
<div class="rule-list" id="ruleList"></div>
</div>

<div class="card">
<h2>🤸 下水前热身（必做！）</h2>
<div class="stretch-grid" id="stretchList"></div>
</div>

<div class="card">
<h2>🆘 抽筋自救方法</h2>
<div id="crampList"></div>
</div>

<div class="card">
<h2>👶 带娃游泳安全须知</h2>
<div class="kid-tips" id="kidTips"></div>
</div>

<div class="alert-box">⚠️ <b>发现有人溺水：</b>先呼救/打120！不要贸然下水救人（溺水者会拼命把你往下拉）。抛救生圈/绳子/长杆，让溺水者抓住后再拉回来。自己不是救生员别逞英雄！</div>

<footer>游泳愉快 · 安全回家 🏊</footer>
</div>

<script>
const rules=[
{i:'✅',t:'下水前冲淋身体',d:'保持泳池水质，也让自己适应水温',c:'do'},
{i:'✅',t:'空腹或饭后1小时再游',d:'空腹易抽筋低血糖，饭后立即游易胃痉挛',c:'do'},
{i:'✅',t:'选择正规泳池',d:'有救生员、有救生设备、水质检测公示',c:'do'},
{i:'❌',t:'不独自去野外水域',d:'水库/河流/海边暗流漩涡，再会游泳都不行',c:'dont'},
{i:'❌',t:'不酒后游泳',d:'酒精使血管扩张，下水后体温骤降极易引发危险',c:'dont'},
{i:'❌',t:'不在雷雨天游泳',d:'水导电！打雷时立即上岸远离水边',c:'dont'},
{i:'❌',t:'不在泳池奔跑',d:'池边非常滑，摔伤头部后果严重',c:'dont'},
];

document.getElementById('ruleList').innerHTML=rules.map(r=>`<div class="rule-item ${r.c}"><span class="r-icon">${r.i}</span><div><b>${r.t}：</b>${r.d}</div></div>`).join('');

const stretches=[
{e:'🦵',n:'弓步压腿',d:'前后弓步各30秒，活动大腿肌肉'},
{e:'🏃',n:'高抬腿',d:'原地高抬腿30秒，激活核心'},
{e:'💪',n:'肩关节绕环',d:'手臂画大圈前后各10次'},
{e:'🦶',n:'脚踝手腕',d:'转动手腕脚腕各30秒'},
{e:'🤸',n:'侧身拉伸',d:'手臂上举身体侧弯保持15秒'},
{e:'🧘',n:'颈部转动',d:'缓慢转头左右各5次'},
];

document.getElementById('stretchList').innerHTML=stretches.map(s=>`<div class="stretch-item"><span class="s-emoji">${s.e}</span><b>${s.n}</b><div style="font-size:.68rem;color:var(--text2);margin-top:3px">${s.d}</div></div>`).join('');

const cramps=[
{n:'小腿抽筋',f:'深吸一口气仰面漂浮，用对侧手抓住抽筋脚的大脚趾用力往身体方向拉，同时伸直膝盖。保持到抽筋缓解。上岸后按摩小腿肚。'},
{n:'大腿抽筋',f:'仰面漂浮，双手抱住脚踝把腿拉向臀部。或者弯曲膝盖，用手按摩大腿前后侧。'},
{n:'脚趾抽筋',f:'仰面漂浮，用手把抽筋的脚趾往脚背方向掰。不要用力过猛慢慢来。'},
{n:'手指抽筋',f:'用力握拳→再用力张开手指，反复几次。另一只手按摩抽筋手指。'},
{n:'腹部抽筋',f:'仰面漂浮，双腿弯曲贴近胸口，双手抱住膝盖。用鼻子吸气、嘴呼气，放松腹肌。这是最危险的一种，尽快上岸！'},
];

document.getElementById('crampList').innerHTML=cramps.map(c=>`
<div class="cramp-card"><div class="c-name">⚡ ${c.n}</div><div class="c-fix">💡 ${c.f}</div></div>`).join('');

const kids=[
'任何时候不要让小孩离开视线范围，一秒钟都不行！溺水是无声的',
'给不熟练的孩子穿合格的救生衣/臂圈，不要依赖游泳圈',
'教孩子：没有大人在场绝不下水，哪怕只是在浅水区',
'先带孩子热身再下水，孩子也容易抽筋',
'泳后立即给孩子披上浴巾，小朋友体温调节能力弱，容易着凉',
'告诉孩子不要在泳池里推搡打闹/压别人头/跳水',
];

document.getElementById('kidTips').innerHTML=kids.map((t,i)=>`
<div class="kid-tip"><span class="k-num">${i+1}</span><span>${t}</span></div>`).join('');
</script>
<script>
(function(){
var key = 'checklist_' + document.title;
var items = [
  '下水前冲淋身体适应水温',
  '做足热身拉伸（弓步/高抬腿/绕肩）',
  '空腹或饭后1小时再下水',
  '选择有救生员的正规泳池',
  '不独自去野外水域游泳',
  '不在酒后下水游泳',
  '雷雨天及时上岸远离水边',
  '不在泳池边奔跑打闹',
  '带娃时全程保持视线不离开',
  '学会抽筋自救方法'
];

function render() {
  var saved = JSON.parse(localStorage.getItem(key) || '[]');
  var list = document.createElement('div');
  list.style.cssText = 'max-width:600px;margin:30px auto;padding:16px;background:var(--card,#fff);border:1px solid var(--border,#bae6fd);border-radius:10px';
  list.innerHTML = '<h3 style="margin:0 0 12px;font-size:1rem;color:var(--text,#0c4a6e)">📋 泳池安全清单</h3>';
  items.forEach(function(text,i){
    var checked = saved.includes(i);
    list.innerHTML += '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;font-size:.85rem;color:var(--text,#0c4a6e)"><input type="checkbox" ' + (checked?'checked':'') + ' data-idx="'+i+'" style="width:16px;height:16px;accent-color:#0ea5e9">' + (checked?'<s>':'') + text + (checked?'</s>':'') + '</label>';
  });
  list.innerHTML += '<button id="resetChecklist" style="margin-top:10px;padding:6px 14px;border:1px solid var(--border,#bae6fd);border-radius:6px;background:transparent;color:var(--text2,#0284c7);font-size:.78rem;cursor:pointer">重置</button></div>';
  
  var existing = document.getElementById('checklist_' + key);
  if (existing) existing.replaceWith(list);
  else document.body.appendChild(list);
  list.id = 'checklist_' + key;
  
  list.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.addEventListener('change',function(){
      var arr = JSON.parse(localStorage.getItem(key) || '[]');
      var idx = parseInt(this.dataset.idx);
      if (this.checked) { if (!arr.includes(idx)) arr.push(idx); }
      else { arr = arr.filter(function(v){ return v !== idx; }); }
      localStorage.setItem(key, JSON.stringify(arr));
      render();
    });
  });
  list.querySelector('#resetChecklist').addEventListener('click',function(){
    localStorage.removeItem(key);
    render();
  });
}
render();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
