<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合并3</title>
<meta name="description" content="合并3游戏，将相同数字方块合并消除">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0padding:16px;scroll-behavior:smooth;}
.container{text-align:center;padding:20px;max-width:500px;width:100%}
h1{font-size:28px;margin-bottom:10px;color:var(--accent)}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:15px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 20px;min-width:100px}
.stat-label{font-size:12px;color:#8b949e;text-transform:uppercase}
.stat-value{font-size:24px;font-weight:bold;color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:400px;margin:0 auto;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:10px}
.cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;cursor:pointer;transition:all .2s;user-select:none}
.cell:hover{transform:scale(1.05)}
.cell.selected{box-shadow:0 0 0 3px var(--accent);transform:scale(1.1)}
.cell.merge{animation:mergeAnim .3s ease-out}
@keyframes mergeAnim{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.btn{background:var(--accent);color:var(--text);border:none;padding:12px 30px;border-radius:8px;font-size:16px;cursor:pointer;margin-top:15px;font-weight:bold}
.btn:hover{opacity:.9}
.hint{color:#8b949e;font-size:13px;margin-top:10px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="合并3">
  <meta property="og:description" content="合并3游戏，将相同数字方块合并消除">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/merge-3/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🔀 合并3</h1>
<div class="stats">
<div class="stat"><div class="stat-label">分数</div><div class="stat-value" id="score">0</div></div>
<div class="stat"><div class="stat-label">最大数字</div><div class="stat-value" id="maxVal">2</div></div>
<div class="stat"><div class="stat-label">步数</div><div class="stat-value" id="moves">0</div></div>
</div>
<div class="board" id="board"></div>
<p class="hint">点击选择一个方块，再点击相邻的同数字方块合并</p>
<button class="btn" onclick="restartGame()">重新开始</button>
</div>
<script>
const SIZE=4;
let grid=[],selected=null,score=0,moves=0,maxVal=2;
const colors={2:'#ff6b6b',4:'#feca57',8:'#48dbfb',16:'#ff9ff3',32:'#55efc4',64:'#a29bfe',128:'#fd79a8',256:'#fdcb6e',512:'#e17055',1024:'#00cec9',2048:'#6c5ce7'};

function init(){
    grid=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
    addRandom();addRandom();render();
}

function addRandom(){
    const empty=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]===0)empty.push({r,c});
    if(empty.length===0)return false;
    const{r,c}=empty[Math.floor(Math.random()*empty.length)];
    grid[r][c]=Math.random()<0.9?2:4;
    return true;
}

function render(){
    const board=document.getElementById('board');
    board.innerHTML='';
    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
            const cell=document.createElement('div');
            cell.className='cell';
            const v=grid[r][c];
            if(v>0){
                cell.textContent=v;
                cell.style.background=colors[v]||`hsl(${Math.log2(v)*30},70%,50%)`;
                cell.style.color=v<=4?'#000':'#fff';
            }else{
                cell.style.background='rgba(255,255,255,0.05)';
            }
            if(selected&&selected.r===r&&selected.c===c)cell.classList.add('selected');
            cell.addEventListener('click',()=>onClick(r,c));
            board.appendChild(cell);
        }
    }
    document.getElementById('score').textContent=score;
    document.getElementById('maxVal').textContent=maxVal;
    document.getElementById('moves').textContent=moves;
}

function onClick(r,c){
    if(grid[r][c]===0)return;
    if(!selected){selected={r,c};render();return;}
    if(selected.r===r&&selected.c===c){selected=null;render();return;}
    const dr=Math.abs(selected.r-r),dc=Math.abs(selected.c-c);
    if(dr+dc===1&&grid[selected.r][selected.c]===grid[r][c]){
        const newVal=grid[r][c]*2;
        grid[r][c]=newVal;
        grid[selected.r][selected.c]=0;
        if(newVal>maxVal)maxVal=newVal;
        score+=newVal;
        moves++;
        addRandom();
    }
    selected=null;
    render();
}

function restartGame(){score=0;moves=0;maxVal=2;selected=null;init();}

init();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
