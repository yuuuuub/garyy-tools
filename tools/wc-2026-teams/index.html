var regions=['全部','欧洲','南美洲','非洲','亚洲','北中美','大洋洲'];
var currentRegion='全部';

function render(){
  var bar=document.getElementById('regionBar');
  bar.innerHTML=regions.map(function(r){
    return '<div class="region-btn'+(r===currentRegion?' active':'')+'" onclick="filterRegion(\''+r+'\',this)">'+r+'</div>';
  }).join('');
  showTeams();
}

function filterRegion(r,el){
  currentRegion=r;
  document.querySelectorAll('.region-btn').forEach(function(b){b.classList.remove('active')});
  el.classList.add('active');
  showTeams();
}

function showTeams(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var grid=document.getElementById('teamGrid');
  var filtered=teams.filter(function(t){
    if(currentRegion!=='全部'&&t.conf!==currentRegion)return false;
    if(q&&!t.name.toLowerCase().includes(q)&&!t.stars.toLowerCase().includes(q))return false;
    return true;
  });
  grid.innerHTML=filtered.map(function(t,i){
    return '<div class="team-card" onclick="showDetail('+i+')"><div class="team-flag">'+t.flag+'</div><div class="team-name">'+t.name+'</div><div class="team-conf">'+t.conf+'</div></div>';
  }).join('')||'<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text2)">无匹配球队</div>';
  document.getElementById('detailPanel').style.display='none';
}

function showDetail(idx){
  var t=teams[idx];
  var panel=document.getElementById('detailPanel');
  panel.style.display='block';
  panel.innerHTML='<h3>'+t.flag+' '+t.name+'</h3>'+
    '<div class="info-row"><span>所属联合会</span><span>'+t.conf+'</span></div>'+
    '<div class="info-row"><span>主教练</span><span>'+t.coach+'</span></div>'+
    '<div class="info-row"><span>世界杯参赛次数</span><span>'+t.world_cups+'次</span></div>'+
    '<div class="info-row"><span>历史最佳成绩</span><span>'+t.best+'</span></div>'+
    '<div class="info-row"><span>核心球星</span><span>'+t.stars+'</span></div>'+
    '<div class="info-row"><span>所在小组</span><span>'+(t.group!=='—'?'第'+t.group+'组':'待定')+'</span></div>';
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

document.getElementById('searchInput').addEventListener('input',showTeams);
render();
