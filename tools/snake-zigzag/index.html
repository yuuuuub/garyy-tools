<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锯齿贪吃蛇</title>
<meta name="description" content="锯齿贪吃蛇，控制蛇在锯齿通道中前进">
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --accent:#3b82f6; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px; }
h1 { color:var(--accent); margin-bottom:8px; font-size:1.5rem; }
.hud { display:flex; gap:12px; margin:10px 0; }
.hud span { background:var(--card); border:1px solid var(--border); padding:6px 14px; border-radius:8px; }
canvas { border:2px solid var(--accent); border-radius:4px; display:block; margin:10px 0; }
.controls { display:flex; gap:10px; margin-top:8px; }
button { background:var(--accent); color:#fff; border:none; padding:8px 20px; border-radius:6px; cursor:pointer; font-size:1rem; }
button:hover { opacity:0.85; }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="锯齿贪吃蛇">
  <meta property="og:description" content="锯齿贪吃蛇，控制蛇在锯齿通道中前进">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/snake-zigzag/">
</head>
<body>
<h1>🐍 锯齿贪吃蛇</h1>
<div class="hud">
<span id="score">得分: 0</span>
<span id="length">长度: 3</span>
<span id="best">最高: 0</span>
</div>
<canvas id="game" width="400" height="500"></canvas>
<div class="controls">
<button onclick="startGame()">开始游戏</button>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const G=20,C=20;
const ROWS=25;

let snake,dir,nextDir,food,walls,score,best=0,alive,gameLoop;

function generateWalls(){
  walls=[];
  const wallSet=new Set();
  // Zigzag pattern: alternating left-right gaps
  for(let row=2;row<ROWS-1;row+=2){
    const gapStart=Math.floor(Math.random()*(C-4))+1;
    for(let col=0;col<C;col++){
      if(col<gapStart||col>gapStart+2){
        const key=row+','+col;
        if(!wallSet.has(key)){wallSet.add(key);walls.push({x:col,y:row});}
      }
    }
  }
}

function init(){
  snake=[{x:10,y:0},{x:10,y:1},{x:10,y:2}];
  dir={x:0,y:1};nextDir={x:0,y:1};
  score=0;alive=true;
  generateWalls();
  spawnFood();
  updateHUD();
}

function spawnFood(){
  do{food={x:Math.floor(Math.random()*C),y:Math.floor(Math.random()*ROWS)};}
  while(snake.some(s=>s.x===food.x&&s.y===food.y)||walls.some(w=>w.x===food.x&&w.y===food.y));
}

function updateHUD(){
  document.getElementById('score').textContent='得分: '+score;
  document.getElementById('length').textContent='长度: '+snake.length;
  document.getElementById('best').textContent='最高: '+best;
}

function step(){
  if(!alive)return;
  dir={...nextDir};
  let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  
  if(head.x<0||head.x>=C||head.y<0||head.y>=ROWS){alive=false;end();return;}
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){alive=false;end();return;}
  if(walls.some(w=>w.x===head.x&&w.y===head.y)){alive=false;end();return;}
  
  snake.unshift(head);let ate=false;
  if(head.x===food.x&&head.y===food.y){
    score+=10;ate=true;spawnFood();
  }
  if(!ate)snake.pop();
  draw();updateHUD();
}

function end(){
  if(score>best)best=score;
  draw();
  setTimeout(()=>alert('游戏结束！得分: '+score),50);
}

function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#1a2030';ctx.lineWidth=0.5;
  for(let x=0;x<=C;x++){ctx.beginPath();ctx.moveTo(x*G,0);ctx.lineTo(x*G,canvas.height);ctx.stroke();}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*G);ctx.lineTo(canvas.width,y*G);ctx.stroke();}
  
  // Walls
  ctx.fillStyle='#30363d';
  walls.forEach(w=>ctx.fillRect(w.x*G,w.y*G,G,G));
  
  // Food
  ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(food.x*G+G/2,food.y*G+G/2,G/2-2,0,Math.PI*2);ctx.fill();
  
  // Snake
  snake.forEach((s,i)=>{
    const t=1-i/snake.length;
    ctx.fillStyle=i===0?'#22c55e':`rgb(${Math.floor(22-t*20)},${Math.floor(197-t*30)},${Math.floor(94-t*30)})`;
    ctx.fillRect(s.x*G+1,s.y*G+1,G-2,G-2);
  });
  
  if(!alive){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#ef4444';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
    ctx.fillText('游戏结束',canvas.width/2,canvas.height/2);
  }
}

function startGame(){clearInterval(gameLoop);init();draw();gameLoop=setInterval(step,100);}

document.addEventListener('keydown',e=>{
  const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
  const nd=m[e.key];if(nd&&(nd.x+dir.x!==0||nd.y+dir.y!==0)){nextDir=nd;e.preventDefault();}
});

let tx,ty;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  let nd;if(Math.abs(dx)>Math.abs(dy))nd={x:dx>0?1:-1,y:0};else nd={x:0,y:dy>0?1:-1};
  if(nd.x+dir.x!==0||nd.y+dir.y!==0)nextDir=nd;
});

init();draw();
</script>
</body>
</html>
