<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>彩票</title>
<meta name="description" content="彩票模拟开奖工具，模拟各种彩票随机开奖"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#8b5cf6;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8em;margin-bottom:8px;text-align:center}
.subtitle{color:#8b949e;margin-bottom:20px;text-align:center;font-size:.9em}
.game-area{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:100%;margin-bottom:16px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:1em;transition:all .2s}
.btn:hover{opacity:.9;transform:scale(1.02)}
.btn:active{transform:scale(.98)}
.btn-sm{padding:6px 14px;font-size:.85em}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-yellow{background:var(--yellow);color:#000}.btn-orange{background:var(--orange)}
.flex{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;gap:4px}
.info{text-align:center;color:#8b949e;margin:12px 0;font-size:.95em}
.result{text-align:center;font-size:1.2em;margin:16px 0;padding:16px;border-radius:8px;background:var(--bg);min-height:40px}
.token{display:inline-block;padding:4px 10px;margin:3px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.token:hover{border-color:var(--accent)}
.token.active{background:var(--accent);border-color:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media(max-width:480px){body{padding:12px}.game-area{padding:16px}h1{font-size:1.4em}}
</style><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="彩票">
  <meta property="og:description" content="彩票模拟开奖工具，模拟各种彩票随机开奖">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/lottery/">
</head><body>
<h1>彩票</h1><p class="subtitle">双色球模拟</p>
<div class="game-area"><div id="board" class="flex" style="gap:8px;margin:0 auto;width:fit-content"></div>
<div class="flex" style="margin-top:16px"><button class="btn" onclick="genLottery()">生成号码</button><button class="btn btn-green" onclick="drawLottery()">开奖</button></div>
<div class="result" id="result"></div>
<script>
let myNums=[],drawn=[];
function genLottery(){myNums=[];while(myNums.length<6){const n=Math.floor(Math.random()*33)+1;if(!myNums.includes(n))myNums.push(n);}
myNums.sort((a,b)=>a-b);drawn=[];render();document.getElementById('result').innerHTML='已生成6个号码';}
function render(){document.getElementById('board').innerHTML=myNums.map(n=>'<div style="width:50px;height:50px;border-radius:50%;background:'+(drawn.length&&drawn.includes(n)?'var(--green)':'var(--card)')+';border:2px solid '+(drawn.length&&drawn.includes(n)?'var(--green)':'var(--border)')+';display:flex;align-items:center;justify-content:center;font-size:1.2em;font-weight:bold">'+n+'</div>').join('');}
function drawLottery(){if(!myNums.length)genLottery();drawn=[];
while(drawn.length<7){const n=Math.floor(Math.random()*33)+1;if(!drawn.includes(n))drawn.push(n);}
drawn.sort((a,b)=>a-b);render();const matches=myNums.filter(n=>drawn.slice(0,6).includes(n)).length;
document.getElementById('result').innerHTML='开奖: '+drawn.slice(0,6).join(' ')+' + '+drawn[6]+'<br>命中'+matches+'个'+(matches>=3?' 中奖!':'');}
genLottery();</script>
</div><script src="../i18n.js" defer></script>
</body></html>
