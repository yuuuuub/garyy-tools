<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专业计时器Pro V2</title>
<meta name="description" content="专业计时器Pro V2，支持多计时器并行、自定义预设、渐强提醒和全屏模式">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-warning{background:var(--yellow);color:#000}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px}
.timer-display{font-size:4rem;font-weight:700;font-family:'Courier New',monospace;text-align:center;padding:16px;color:var(--accent)}
.timer-ms{font-size:1.8rem;color:var(--text2)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .5s linear}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.timer-display{font-size:2.5rem}.timer-ms{font-size:1.2rem}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏲️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="专业计时器Pro V2">
<meta property="og:description" content="专业计时器Pro V2，支持多计时器并行、自定义预设、渐强提醒和全屏模式">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/timer-pro-cn-v2/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='⏲️ 专业计时器Pro V2';
const APP=document.getElementById('app');
let timers=JSON.parse(localStorage.getItem('tpv2_timers')||'[]');
let modalOpen=false;
let editingIdx=-1;
let animFrames={};

const presets=[
  {name:'番茄钟',minutes:25},{name:'短休息',minutes:5},{name:'长休息',minutes:15},
  {name:'1分钟',minutes:1},{name:'3分钟',minutes:3},{name:'5分钟',minutes:5},
  {name:'10分钟',minutes:10},{name:'15分钟',minutes:15},{name:'30分钟',minutes:30},
  {name:'45分钟',minutes:45},{name:'1小时',minutes:60},{name:'2小时',minutes:120}
];

function save(){localStorage.setItem('tpv2_timers',JSON.stringify(timers))}

function formatDisplay(ms){
  if(ms<=0) return {full:'00:00',ms:'00',progress:100};
  let totalSec=Math.ceil(ms/1000);
  let m=Math.floor(totalSec/60);
  let s=totalSec%60;
  let mStr=String(m).padStart(2,'0');
  let sStr=String(s).padStart(2,'0');
  return {full:`${mStr}:${sStr}`,ms:0,progress:0};
}

function getProgress(timer){
  if(!timer.totalMs) return 0;
  return Math.max(0,Math.min(100,((timer.totalMs-timer.remainingMs)/timer.totalMs)*100));
}

function render(){
  let h=`<h1>⏲️ 专业计时器Pro V2</h1><p class="subtitle">多计时器并行 · 自定义预设 · 渐强提醒 · 全屏模式</p>`;
  
  h+=`<div class="card"><div class="flex-between"><b>计时器列表</b><button class="btn btn-sm" onclick="openModal(-1)">+ 新建计时器</button></div>`;
  h+=`<div class="flex" style="margin-top:12px;flex-wrap:wrap">`;
  presets.forEach(p=>{
    h+=`<button class="btn btn-sm" style="margin:3px;font-size:.8rem" onclick="quickAdd(${p.minutes})">${p.name}</button>`;
  });
  h+=`</div></div>`;

  if(!timers.length){
    h+=`<div class="empty">暂无计时器，点击上方按钮创建</div>`;
  } else {
    timers.forEach((t,i)=>{
      let progress=getProgress(t);
      let isComplete=t.remainingMs<=0&&t.totalMs>0;
      let isRunning=t.running;
      let display=formatDisplay(t.remainingMs);
      h+=`<div class="card" style="${isComplete?'border-color:var(--green)':''}">
        <div class="flex-between" style="margin-bottom:8px">
          <b>${t.name}</b>
          <span class="badge ${isComplete?'badge-green':isRunning?'badge-blue':'badge-red'}">${isComplete?'已完成':isRunning?'运行中':'已暂停'}</span>
        </div>
        <div class="timer-display" style="${isComplete?'color:var(--green);animation:pulse 1s infinite':''}">${display.full}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%;background:${isComplete?'var(--green)':'var(--accent)'}"></div></div>
        <div class="flex" style="justify-content:center">
          ${isComplete?
            `<button class="btn btn-sm btn-success" onclick="restartTimer(${i})">重新开始</button>`:
            `<button class="btn btn-sm" onclick="toggleTimer(${i})">${isRunning?'暂停':'开始'}</button>
             <button class="btn btn-sm btn-danger" onclick="resetTimer(${i})">重置</button>`
          }
          <button class="btn btn-sm" style="background:var(--border)" onclick="openModal(${i})">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="delTimer(${i})">删除</button>
        </div>
      </div>`;
    });
  }

  if(modalOpen) h+=renderModal();
  APP.innerHTML=h;
}

function renderModal(){
  let t=editingIdx>=0?timers[editingIdx]:null;
  return `<div class="modal-overlay" onclick="modalOpen=false;render()"><div class="modal" onclick="event.stopPropagation()">
    <h2 style="margin-bottom:16px">${t?'编辑计时器':'新建计时器'}</h2>
    <label>名称</label><input id="tpName" value="${t?t.name:''}" placeholder="计时器名称">
    <label>时间（分钟）</label><input id="tpMin" type="number" min="1" max="999" value="${t?Math.ceil(t.totalMs/60000):25}">
    <label>时间（秒）</label><input id="tpSec" type="number" min="0" max="59" value="${t?Math.floor((t.totalMs%60000)/1000):0}">
    <label>完成提醒</label><select id="tpAlert"><option value="yes">是</option><option value="no">否</option></select>
    <div class="flex" style="justify-content:flex-end;margin-top:16px">
      <button class="btn btn-sm" style="background:var(--border);color:var(--text)" onclick="modalOpen=false;render()">取消</button>
      <button class="btn btn-sm btn-success" onclick="saveTimer()">保存</button>
    </div>
  </div></div>`;
}

function quickAdd(minutes){
  timers.push({name:`${minutes}分钟`,totalMs:minutes*60000,remainingMs:minutes*60000,running:false,alert:true});
  save();render();
}

function openModal(idx){editingIdx=idx;modalOpen=true;render();setTimeout(()=>{let t=document.getElementById('tpName');if(t)t.focus()},100)}

function saveTimer(){
  let name=document.getElementById('tpName').value.trim()||'计时器';
  let min=parseInt(document.getElementById('tpMin').value)||0;
  let sec=parseInt(document.getElementById('tpSec').value)||0;
  let totalMs=(min*60+sec)*1000;
  let alert=document.getElementById('tpAlert').value==='yes';
  if(totalMs<=0){alert('请设置时间');return}
  if(editingIdx>=0){
    timers[editingIdx]={...timers[editingIdx],name,totalMs,remainingMs:totalMs,running:false,alert};
  } else {
    timers.push({name,totalMs,remainingMs:totalMs,running:false,alert});
  }
  save();modalOpen=false;editingIdx=-1;render();
}

function toggleTimer(idx){
  let t=timers[idx];
  if(t.running){
    cancelAnimationFrame(animFrames[idx]);
    t.running=false;
  } else {
    t.running=true;
    let lastTick=performance.now();
    function tick(now){
      if(!t.running) return;
      let delta=now-lastTick;
      lastTick=now;
      t.remainingMs-=delta;
      if(t.remainingMs<=0){
        t.remainingMs=0;
        t.running=false;
        if(t.alert) playAlert();
        render();
        return;
      }
      let display=formatDisplay(t.remainingMs);
      let el=document.querySelectorAll('.timer-display')[idx];
      if(el) el.textContent=display.full;
      let prog=document.querySelectorAll('.progress-fill')[idx];
      if(prog) prog.style.width=getProgress(t)+'%';
      animFrames[idx]=requestAnimationFrame(tick);
    }
    animFrames[idx]=requestAnimationFrame(tick);
  }
  save();render();
}

function resetTimer(idx){
  cancelAnimationFrame(animFrames[idx]);
  timers[idx].remainingMs=timers[idx].totalMs;
  timers[idx].running=false;
  save();render();
}

function restartTimer(idx){
  resetTimer(idx);
  toggleTimer(idx);
}

function delTimer(idx){
  if(confirm('删除此计时器？')){
    cancelAnimationFrame(animFrames[idx]);
    timers.splice(idx,1);
    save();render();
  }
}

function playAlert(){
  try{
    let ctx=new(window.AudioContext||window.webkitAudioContext)();
    let osc=ctx.createOscillator();
    let gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.value=660;gain.gain.value=0.3;
    osc.start();setTimeout(()=>{osc.stop();ctx.close()},1500);
  }catch(e){}
  garyyToast('⏲️ 计时器完成！');
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
