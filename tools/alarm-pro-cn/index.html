<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能闹钟Pro</title>
<meta name="description" content="智能闹钟Pro，支持多个闹钟、重复设置、渐强铃声和贪睡模式">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:800px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.toggle{position:relative;width:48px;height:26px;border-radius:13px;background:var(--border);cursor:pointer;transition:background .3s}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .3s}
.toggle.on::after{transform:translateX(22px)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px}
.big-clock{font-size:5rem;font-weight:700;font-family:'Courier New',monospace;text-align:center;padding:20px;color:var(--accent)}
.big-date{text-align:center;color:var(--text2);font-size:1.1rem;margin-bottom:20px}
.alarm-item{padding:16px;border-bottom:1px solid var(--border)}
.alarm-item:last-child{border-bottom:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes ring{0%,100%{transform:rotate(0)}10%,30%,50%,70%,90%{transform:rotate(15deg)}20%,40%,60%,80%{transform:rotate(-15deg)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.big-clock{font-size:3rem}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏰</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="智能闹钟Pro">
<meta property="og:description" content="智能闹钟Pro，支持多个闹钟、重复设置、渐强铃声和贪睡模式">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/alarm-pro-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='⏰ 智能闹钟Pro';
const APP=document.getElementById('app');
let alarms=JSON.parse(localStorage.getItem('ap_alarms')||'[]');
let modalOpen=false;
let editingIdx=-1;
let ringingAlarmIdx=-1;
let audioCtx=null;
let osc=null;

const repeatDays=['周日','周一','周二','周三','周四','周五','周六'];
const sounds=['经典','柔和','激进','渐强'];

function save(){localStorage.setItem('ap_alarms',JSON.stringify(alarms))}

function getCurrentTime(){
  let now=new Date();
  return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
}

function getFullDate(){
  let now=new Date();
  let weekdays=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  return `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;
}

function checkAlarms(){
  if(ringingAlarmIdx>=0) return;
  let now=new Date();
  let currentTime=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  let currentDay=now.getDay();
  alarms.forEach((a,i)=>{
    if(!a.active) return;
    if(a.time===currentTime){
      if(a.repeatDays.length===0||a.repeatDays.includes(currentDay)){
        startRinging(i);
      }
    }
  });
}

function startRinging(idx){
  ringingAlarmIdx=idx;
  let a=alarms[idx];
  garyyToast(`⏰ ${a.label||'闹钟'} 响了！`);
  startAlarmSound(a.sound);
  render();
}

function startAlarmSound(soundType){
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    let freq=soundType==='柔和'?440:soundType==='激进'?880:soundType==='渐强'?520:660;
    osc=audioCtx.createOscillator();
    let gain=audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value=freq;
    gain.gain.value=0;
    if(soundType==='渐强'){
      gain.gain.linearRampToValueAtTime(0.5,audioCtx.currentTime+2);
    } else {
      gain.gain.value=0.3;
    }
    osc.start();
    osc.type=soundType==='柔和'?'sine':'square';
  }catch(e){}
}

function stopRinging(){
  if(osc){try{osc.stop();audioCtx.close()}catch(e){}}
  ringingAlarmIdx=-1;
  render();
}

function snooze(){
  if(ringingAlarmIdx<0) return;
  let a=alarms[ringingAlarmIdx];
  let now=new Date();
  now.setMinutes(now.getMinutes()+5);
  let newTime=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  alarms.push({...a,time:newTime,repeatDays:[],active:true,label:(a.label||'闹钟')+' (贪睡)'});
  stopRinging();
}

function render(){
  let h=`<h1>⏰ 智能闹钟Pro</h1><p class="subtitle">多闹钟 · 重复设置 · 渐强铃声 · 贪睡模式</p>`;
  
  h+=`<div class="card"><div class="big-clock" id="liveClock">${getCurrentTime()}</div><div class="big-date">${getFullDate()}</div></div>`;

  if(ringingAlarmIdx>=0){
    let a=alarms[ringingAlarmIdx];
    h+=`<div class="card" style="border-color:var(--red);text-align:center;padding:40px">
      <div style="font-size:4rem;animation:ring .5s infinite">🔔</div>
      <h2 style="margin:16px 0">${a.label||'闹钟'}</h2>
      <p style="color:var(--text2)">${a.time}</p>
      <div class="flex" style="justify-content:center;margin-top:20px">
        <button class="btn btn-success" onclick="stopRinging()">停止</button>
        <button class="btn btn-warning" onclick="snooze()">贪睡5分钟</button>
      </div>
    </div>`;
  }

  h+=`<div class="card"><div class="flex-between"><b>闹钟列表</b><button class="btn btn-sm" onclick="openModal(-1)">+ 添加闹钟</button></div></div>`;
  
  if(!alarms.length){
    h+=`<div class="empty">暂无闹钟，点击上方按钮添加</div>`;
  } else {
    alarms.forEach((a,i)=>{
      let repeatStr=a.repeatDays.length?a.repeatDays.map(d=>repeatDays[d]).join('、'):'单次';
      h+=`<div class="card alarm-item">
        <div class="flex-between">
          <div>
            <div style="font-size:2rem;font-weight:700;color:${a.active?'var(--accent)':'var(--text2)'}">${a.time}</div>
            <div style="font-size:.85rem;color:var(--text2)">${a.label||'闹钟'} · ${repeatStr} · ${sounds[a.sound]||'经典'}</div>
          </div>
          <div class="flex">
            <div class="toggle ${a.active?'on':''}" onclick="toggleAlarm(${i})"></div>
            <button class="btn btn-sm" onclick="openModal(${i})">编辑</button>
            <button class="btn btn-sm btn-danger" onclick="delAlarm(${i})">删除</button>
          </div>
        </div>
      </div>`;
    });
  }

  if(modalOpen) h+=renderModal();
  APP.innerHTML=h;
}

function renderModal(){
  let a=editingIdx>=0?alarms[editingIdx]:null;
  return `<div class="modal-overlay" onclick="modalOpen=false;render()"><div class="modal" onclick="event.stopPropagation()">
    <h2 style="margin-bottom:16px">${a?'编辑闹钟':'添加闹钟'}</h2>
    <label>时间</label><input id="aTime" type="time" value="${a?a.time:'07:00'}">
    <label>标签</label><input id="aLabel" value="${a?a.label||'':''}" placeholder="闹钟标签（可选）">
    <label>铃声</label><select id="aSound">${sounds.map((s,i)=>`<option value="${i}" ${a&&a.sound===i?'selected':''}>${s}</option>`).join('')}</select>
    <label>重复</label>
    <div class="flex" style="flex-wrap:wrap">
      ${repeatDays.map((d,i)=>`<label style="width:auto;display:flex;align-items:center;gap:4px;font-size:.85rem;cursor:pointer">
        <input type="checkbox" class="rep-day" value="${i}" ${a&&a.repeatDays.includes(i)?'checked':''}> ${d}
      </label>`).join('')}
    </div>
    <div class="flex" style="justify-content:flex-end;margin-top:16px">
      <button class="btn btn-sm" style="background:var(--border);color:var(--text)" onclick="modalOpen=false;render()">取消</button>
      <button class="btn btn-sm btn-success" onclick="saveAlarm()">保存</button>
    </div>
  </div></div>`;
}

function openModal(idx){editingIdx=idx;modalOpen=true;render();setTimeout(()=>{let t=document.getElementById('aTime');if(t)t.focus()},100)}

function saveAlarm(){
  let time=document.getElementById('aTime').value;
  let label=document.getElementById('aLabel').value.trim();
  let sound=parseInt(document.getElementById('aSound').value);
  let repeatDays=[];
  document.querySelectorAll('.rep-day:checked').forEach(cb=>repeatDays.push(parseInt(cb.value)));
  if(!time){alert('请设置时间');return}
  if(editingIdx>=0){
    alarms[editingIdx]={...alarms[editingIdx],time,label,sound,repeatDays};
  } else {
    alarms.push({time,label,sound,repeatDays,active:true});
  }
  save();modalOpen=false;editingIdx=-1;render();
}

function toggleAlarm(idx){alarms[idx].active=!alarms[idx].active;save();render()}
function delAlarm(idx){if(confirm('删除此闹钟？')){alarms.splice(idx,1);save();render()}}

setInterval(()=>{let c=document.getElementById('liveClock');if(c)c.textContent=getCurrentTime();checkAlarms()},1000);
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
