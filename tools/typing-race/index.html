<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打字竞赛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:15px}
h1{font-size:1.5rem;margin-bottom:15px;color:#3b82f6}
.hud{display:flex;gap:15px;margin-bottom:15px;font-size:0.95rem;flex-wrap:wrap;justify-content:center}
.hud span{background:#161b22;padding:6px 14px;border-radius:6px;border:1px solid #30363d}
.text-display{background:#161b22;border:2px solid #30363d;border-radius:10px;padding:20px;max-width:600px;width:100%;font-size:1.3rem;line-height:2;margin-bottom:15px;min-height:80px;letter-spacing:1px}
.text-display .correct{color:#22c55e}.text-display .wrong{color:#ef4444;text-decoration:underline}.text-display .current{border-bottom:2px solid #fbbf24}.text-display .pending{color:#8b949e}
input[type=text]{width:100%;max-width:600px;padding:12px 16px;background:#161b22;border:2px solid #30363d;border-radius:8px;color:#e6edf3;font-size:1.1rem;outline:none;margin-bottom:12px}
input:focus{border-color:#3b82f6}
button{padding:10px 24px;border:none;background:#3b82f6;color:#fff;border-radius:8px;cursor:pointer;font-size:1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:600px;width:100%;margin-top:10px}
.stat{background:#161b22;padding:12px;border-radius:8px;border:1px solid #30363d;text-align:center}
.stat .num{font-size:1.5rem;font-weight:bold;color:#3b82f6}
.stat .lbl{font-size:0.8rem;color:#8b949e;margin-top:2px}
.status{margin-top:10px;font-size:1rem;min-height:1.5em}
</style>
</head>
<body>
<h1>⌨️ 打字竞赛</h1>
<div class="hud">
<span>⏱ <b id="time">60</b>秒</span>
<span>速度: <b id="wpm">0</b> 字/分</span>
<span>准确率: <b id="acc">100</b>%</span>
</div>
<div class="text-display" id="display"></div>
<input type="text" id="input" placeholder="在这里输入..." autocomplete="off" disabled>
<button onclick="start()">开始挑战</button>
<div class="stats">
<div class="stat"><div class="num" id="total">0</div><div class="lbl">总字数</div></div>
<div class="stat"><div class="num" id="correct">0</div><div class="lbl">正确</div></div>
<div class="stat"><div class="num" id="wrongN">0</div><div class="lbl">错误</div></div>
</div>
<div class="status" id="status">点击开始60秒打字挑战</div>
<script>
const texts=[
  '今天天气真好阳光明媚万里无云',
  '春天来了花儿开了鸟儿在枝头唱歌',
  '科技改变生活人工智能正在快速发展',
  '读书使人充实讨论使人机智写作使人精确',
  '生活就像一盒巧克力你永远不知道下一颗是什么味道',
  '千里之行始于足下不积跬步无以至千里',
  '学而不思则罔思而不学则殆',
  '时间就像海绵里的水只要愿挤总还是有的',
  '世界上最快乐的事莫过于为理想而奋斗',
  '真正的智慧是知道自己的无知苏格拉底',
];
let text='',running=false,timer=60,totalC=0,correctC=0,wrongC=0,timerId=null;

function start(){
  text=texts[Math.floor(Math.random()*texts.length)];
  running=true;timer=60;totalC=0;correctC=0;wrongC=0;
  document.getElementById('input').disabled=false;document.getElementById('input').value='';
  document.getElementById('input').focus();
  renderDisplay();
  if(timerId)clearInterval(timerId);
  timerId=setInterval(()=>{timer--;document.getElementById('time').textContent=timer;
    const elapsed=60-timer||1;
    document.getElementById('wpm').textContent=Math.round(correctC/elapsed*60);
    if(timer<=0)end();
  },1000);
  document.getElementById('status').textContent='开始输入！';
}

const input=document.getElementById('input');
input.addEventListener('input',()=>{
  if(!running)return;
  const val=input.value;const len=val.length;
  totalC=len;correctC=0;wrongC=0;
  for(let i=0;i<len&&i<text.length;i++){if(val[i]===text[i])correctC++;else wrongC++}
  document.getElementById('total').textContent=totalC;
  document.getElementById('correct').textContent=correctC;
  document.getElementById('wrongN').textContent=wrongC;
  document.getElementById('acc').textContent=totalC?Math.round(correctC/totalC*100):100;
  renderDisplay();
  if(len>=text.length)end();
});

function renderDisplay(){
  const val=input.value;
  let html='';
  for(let i=0;i<text.length;i++){
    if(i<val.length){
      html+=`<span class="${val[i]===text[i]?'correct':'wrong'}">${text[i]}</span>`;
    }else if(i===val.length){
      html+=`<span class="current">${text[i]}</span>`;
    }else{
      html+=`<span class="pending">${text[i]}</span>`;
    }
  }
  document.getElementById('display').innerHTML=html;
}

function end(){
  running=false;clearInterval(timerId);
  document.getElementById('input').disabled=true;
  const elapsed=60-timer||1;
  document.getElementById('wpm').textContent=Math.round(correctC/elapsed*60);
  document.getElementById('status').textContent=`🎉 完成！${correctC}/${text.length} 正确，速度 ${Math.round(correctC/elapsed*60)} 字/分`;
}

newGame=function(){clearInterval(timerId);document.getElementById('input').disabled=true;document.getElementById('input').value='';
  document.getElementById('display').innerHTML='';document.getElementById('status').textContent='点击开始60秒打字挑战';
  document.getElementById('time').textContent=60;document.getElementById('wpm').textContent=0;document.getElementById('acc').textContent=100;
  document.getElementById('total').textContent=0;document.getElementById('correct').textContent=0;document.getElementById('wrongN').textContent=0;running=false};
</script>
</body>
</html>
