<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物养护指南 v2</title>
<meta name="description" content="全面的植物养护百科，浇水、施肥、光照、修剪一站式指南">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#22c55e;--accent2:#16a34a;--warn:#f59e0b;--danger:#ef4444;--info:#3b82f6;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#1a7f37;--accent2:#116329;--warn:#9a6700;--danger:#cf222e;--info:#0969da}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;resize:vertical;min-height:60px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}.button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;margin-right:4px}
.tag.g{background:var(--accent);color:#fff}.tag.w{background:var(--warn);color:#fff}.tag.r{background:var(--danger);color:#fff}.tag.b{background:var(--info);color:#fff}
.li{padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.li h3{font-size:1rem;margin-bottom:4px}.li p{font-size:.85rem;color:var(--text2)}
.es{text-align:center;padding:40px;color:var(--text2)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.search{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:24px;color:var(--text);outline:none;font-size:.95rem;margin-bottom:16px}
.search:focus{border-color:var(--accent)}
.plant-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s}
.plant-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.plant-card h3{font-size:1rem;margin-bottom:6px}.plant-card .info{font-size:.8rem;color:var(--text2)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.detail-item{padding:12px;background:var(--bg);border-radius:8px}
.detail-item .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.detail-item .value{font-size:.95rem;font-weight:600}
.meter{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:6px}
.meter .fill{height:100%;border-radius:4px;transition:width .3s}
.hidden{display:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto}
.modal h2{margin-bottom:16px;color:var(--accent)}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🌿 植物养护指南 v2</h1><p>浇水 · 施肥 · 光照 · 修剪 · 养护百科</p></div>

<div class="cd">
<h2>我的植物</h2>
<div class="fr">
<div><label>植物名称</label><input type="text" id="pName" placeholder="如：绿萝"></div>
<div><label>植物类型</label><select id="pType"><option>观叶植物</option><option>多肉植物</option><option>开花植物</option><option>草本植物</option><option>蔬菜</option><option>果树</option></select></div>
</div>
<div class="fr">
<div><label>购买日期</label><input type="text" id="pDate" placeholder="YYYY-MM-DD"></div>
<div><label>摆放位置</label><select id="pLight"><option>全日照</option><option>半日照</option><option>散射光</option><option>阴暗处</option></select></div>
</div>
<label>备注</label><textarea id="pNote" placeholder="特殊需求等"></textarea>
<div class="bg"><button onclick="addPlant()">添加植物</button></div>
</div>

<div class="cd">
<h2>植物列表</h2>
<input type="text" class="search" id="searchInput" placeholder="🔍 搜索植物..." oninput="filterPlants()">
<div id="plantGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px"></div>
<div id="emptyState" class="es">暂无植物，点击上方添加</div>
</div>

<div class="cd">
<h2>养护提醒</h2>
<div id="reminderList" class="es">添加植物后自动生成养护提醒</div>
</div>
</div>

<div id="detailModal" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
<div class="modal" id="detailContent"></div>
</div>

<script>
const DB='plant_care_v2_db';
let plants=JSON.parse(localStorage.getItem(DB)||'[]');

const PLANT_DB={
  '绿萝':{water:3,light:'散射光',fertilize:'每月1次',prune:'随时',temp:'15-30℃',humidity:'高',difficulty:'简单',tips:'喜湿润，冬季减少浇水'},
  '多肉':{water:7,light:'全日照',fertilize:'春秋各1次',prune:'枯叶时',temp:'10-35℃',humidity:'低',difficulty:'简单',tips:'宁干勿湿，通风很重要'},
  '吊兰':{water:3,light:'散射光',fertilize:'每月1次',prune:'黄叶时',temp:'15-25℃',humidity:'中',difficulty:'简单',tips:'空气净化能力强'},
  '仙人掌':{water:14,light:'全日照',fertilize:'春季1次',prune:'不需要',temp:'10-40℃',humidity:'低',difficulty:'简单',tips:'极度耐旱，冬季几乎不浇水'},
  '栀子花':{water:2,light:'全日照',fertilize:'每周1次',prune:'花后修剪',temp:'16-30℃',humidity:'高',difficulty:'中等',tips:'喜酸性土壤，定期补铁'},
  '番茄':{water:1,light:'全日照',fertilize:'每周1次',prune:'打杈摘心',temp:'15-30℃',humidity:'中',difficulty:'中等',tips:'支架支撑，及时疏果'},
  '薄荷':{water:2,light:'半日照',fertilize:'每月1次',prune:'经常修剪',temp:'10-30℃',humidity:'中',difficulty:'简单',tips:'生长旺盛，及时修剪防止徒长'},
  '兰花':{water:5,light:'散射光',fertilize:'每2周',prune:'花后剪花梗',temp:'15-28℃',humidity:'高',difficulty:'困难',tips:'通风良好，避免积水'},
};

function addPlant(){
  const name=document.getElementById('pName').value.trim();
  if(!name)return alert('请输入植物名称');
  const plant={
    id:Date.now(),name,
    type:document.getElementById('pType').value,
    date:document.getElementById('pDate').value||new Date().toLocaleDateString(),
    light:document.getElementById('pLight').value,
    note:document.getElementById('pNote').value.trim(),
    lastWater:new Date().toISOString(),
    lastFertilize:new Date().toISOString()
  };
  plants.push(plant);
  localStorage.setItem(DB,JSON.stringify(plants));
  ['pName','pDate','pNote'].forEach(id=>document.getElementById(id).value='');
  renderAll();
}

function renderAll(){
  renderPlants();renderReminders();
}

function renderPlants(filter=''){
  const el=document.getElementById('plantGrid');
  const empty=document.getElementById('emptyState');
  const filtered=plants.filter(p=>!filter||p.name.includes(filter)||p.type.includes(filter));
  if(!filtered.length){el.innerHTML='';empty.style.display='';return}
  empty.style.display='none';
  el.innerHTML=filtered.map(p=>{
    const info=PLANT_DB[p.name]||{water:3,light:p.light||'散射光',difficulty:'未知'};
    const daysSinceWater=Math.floor((Date.now()-new Date(p.lastWater).getTime())/(86400000));
    const waterStatus=daysSinceWater>=info.water?'r':daysSinceWater>=info.water-1?'w':'g';
    return`<div class="plant-card" onclick="showDetail(${p.id})">
      <h3>${p.name}</h3>
      <div class="info">${p.type} · ${p.light}</div>
      <div style="margin-top:8px">
        <span style="font-size:.8rem;color:var(--text2)">浇水状态</span>
        <div class="meter"><div class="fill" style="width:${Math.min(100,daysSinceWater/info.water*100)}%;background:var(--${waterStatus==='g'?'accent':waterStatus==='w'?'warn':'danger'})"></div></div>
        <span style="font-size:.75rem;color:var(--text2)">${daysSinceWater}天未浇水</span>
      </div>
    </div>`}).join('');
}

function filterPlants(){renderPlants(document.getElementById('searchInput').value.trim())}

function showDetail(id){
  const p=plants.find(x=>x.id===id);if(!p)return;
  const info=PLANT_DB[p.name]||{water:'3天',light:p.light,fertilize:'每月1次',prune:'适时',temp:'适宜',humidity:'中',difficulty:'未知',tips:'暂无详细信息'};
  document.getElementById('detailContent').innerHTML=`
    <h2>${p.name}</h2>
    <div class="detail-grid">
      <div class="detail-item"><div class="label">类型</div><div class="value">${p.type}</div></div>
      <div class="detail-item"><div class="label">光照</div><div class="value">${info.light||p.light}</div></div>
      <div class="detail-item"><div class="label">浇水频率</div><div class="value">每${info.water}天</div></div>
      <div class="detail-item"><div class="label">施肥</div><div class="value">${info.fertilize}</div></div>
      <div class="detail-item"><div class="label">修剪</div><div class="value">${info.prune}</div></div>
      <div class="detail-item"><div class="label">适宜温度</div><div class="value">${info.temp}</div></div>
      <div class="detail-item"><div class="label">湿度需求</div><div class="value">${info.humidity}</div></div>
      <div class="detail-item"><div class="label">养护难度</div><div class="value">${info.difficulty}</div></div>
    </div>
    <div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:.85rem;font-weight:600;margin-bottom:4px">养护贴士</div>
      <div style="font-size:.85rem;color:var(--text2)">${info.tips}</div>
    </div>
    ${p.note?'<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:.85rem;font-weight:600;margin-bottom:4px">我的备注</div><div style="font-size:.85rem;color:var(--text2)">'+p.note+'</div></div>':''}
    <div class="bg" style="margin-top:16px">
      <button onclick="waterPlant(${p.id})">💧 浇水</button>
      <button onclick="fertilizePlant(${p.id})">🌱 施肥</button>
      <button class="dng" onclick="deletePlant(${p.id})">删除</button>
      <button class="sec" onclick="closeModal()">关闭</button>
    </div>`;
  document.getElementById('detailModal').classList.remove('hidden');
}

function closeModal(){document.getElementById('detailModal').classList.add('hidden')}

function waterPlant(id){
  const p=plants.find(x=>x.id===id);if(p){p.lastWater=new Date().toISOString();localStorage.setItem(DB,JSON.stringify(plants));renderAll();closeModal()}
}
function fertilizePlant(id){
  const p=plants.find(x=>x.id===id);if(p){p.lastFertilize=new Date().toISOString();localStorage.setItem(DB,JSON.stringify(plants));renderAll();closeModal()}
}
function deletePlant(id){
  if(!confirm('确定删除？'))return;
  plants=plants.filter(x=>x.id!==id);localStorage.setItem(DB,JSON.stringify(plants));renderAll();closeModal();
}

function renderReminders(){
  const el=document.getElementById('reminderList');
  const reminders=[];
  plants.forEach(p=>{
    const info=PLANT_DB[p.name]||{water:3};
    const daysW=Math.floor((Date.now()-new Date(p.lastWater).getTime())/(86400000));
    if(daysW>=info.water)reminders.push({plant:p.name,type:'浇水',urgency:daysW-info.water>=2?'r':'w',msg:`已${daysW}天未浇水`});
    const daysF=Math.floor((Date.now()-new Date(p.lastFertilize).getTime())/(86400000));
    if(daysF>=30)reminders.push({plant:p.name,type:'施肥',urgency:'w',msg:`已${daysF}天未施肥`});
  });
  if(!reminders.length){el.innerHTML='<div class="es">所有植物状态良好 ✨</div>';return}
  el.innerHTML=reminders.map(r=>`<div class="li"><span class="tag ${r.urgency}">${r.type}</span><strong>${r.plant}</strong><span style="font-size:.85rem;color:var(--text2);margin-left:8px">${r.msg}</span></div>`).join('');
}
renderAll();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
