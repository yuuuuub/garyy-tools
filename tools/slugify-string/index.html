<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Slug生成器</title><meta name="description" content="URL Slug生成器 - 在线生成URL友好的字符串"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.option-group{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}.option-group label{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--text2);cursor:pointer}.option-group input[type="checkbox"]{width:auto;margin:0}.option-group select{padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="URL Slug生成器"><meta property="og:description" content="URL Slug生成器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔗 URL Slug生成器</h1><p class="sub">在线生成URL友好的字符串</p>
<div class="card"><div class="label">输入文本</div>
<textarea id="inputText" placeholder="Hello World! 这是一个测试"></textarea>
<div class="option-group">
<label><input type="checkbox" id="toLowerCase" checked> 转小写</label>
<label><input type="checkbox" id="removeSpecial" checked> 移除特殊字符</label>
<label><input type="checkbox" id="replaceSpaces" checked> 空格转连字符</label>
<label><input type="checkbox" id="trimDashes" checked> 移除首尾连字符</label>
<label>分隔符:
<select id="separator">
<option value="-">连字符 (-)</option>
<option value="_">下划线 (_)</option>
<option value=".">点号 (.)</option>
</select>
</label>
</div>
<div class="btn-group">
<button class="btn" onclick="generateSlug()">生成Slug</button>
<button class="btn" onclick="generateMultiple()">生成多个变体</button>
<button class="btn" onclick="generateChinese()">中文拼音Slug</button>
</div></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function generateSlug(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var slug=slugify(text);
  showResult(slug,'Slug');
}
function generateMultiple(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var variants=[];
  variants.push('kebab-case: '+slugify(text,'-'));
  variants.push('snake_case: '+slugify(text,'_'));
  variants.push('dot.case: '+slugify(text,'.'));
  variants.push('camelCase: '+toCamelCase(text));
  variants.push('PascalCase: '+toPascalCase(text));
  variants.push('UPPER_SNAKE: '+slugify(text,'_').toUpperCase());
  showResult(variants.join('\n'),'多个变体');
}
function generateChinese(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var pinyin=chineseToPinyin(text);
  var slug=slugify(pinyin);
  showResult(slug,'拼音Slug');
}
function slugify(text,separator){
  separator=separator||document.getElementById('separator').value;
  var toLowerCase=document.getElementById('toLowerCase').checked;
  var removeSpecial=document.getElementById('removeSpecial').checked;
  var replaceSpaces=document.getElementById('replaceSpaces').checked;
  var trimDashes=document.getElementById('trimDashes').checked;
  var slug=text;
  if(toLowerCase)slug=slug.toLowerCase();
  if(replaceSpaces)slug=slug.replace(/\s+/g,separator);
  if(removeSpecial){
    var regex=new RegExp('[^a-z0-9\\u4e00-\\u9fa5'+separator.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&')+']','g');
    slug=slug.replace(regex,'');
  }
  if(trimDashes){
    var sepEsc=separator.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&');
    slug=slug.replace(new RegExp('^'+sepEsc+'+|'+sepEsc+'+$','g'),'');
  }
  slug=slug.replace(new RegExp(separator+'{2,}','g'),separator);
  return slug;
}
function toCamelCase(text){
  return text.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g,function(_,c){return c.toUpperCase();});
}
function toPascalCase(text){
  var camel=toCamelCase(text);
  return camel.charAt(0).toUpperCase()+camel.slice(1);
}
function chineseToPinyin(text){
  var pinyinMap={
    '中':'zhong','国':'guo','人':'ren','民':'min','共':'gong','和':'he','国':'guo',
    '北':'bei','京':'jing','上':'shang','海':'hai','广':'guang','州':'zhou','深':'shen',
    '圳':'zhen','成':'cheng','都':'du','杭':'hang','州':'zhou','南':'nan','京':'jing',
    '武':'wu','汉':'han','西':'xi','安':'an','重':'chong','庆':'qing','天':'tian',
    '津':'jin','苏':'su','州':'zhou','无':'wu','锡':'xi','宁':'ning','波':'bo',
    '青':'qing','岛':'dao','大':'da','连':'lian','厦':'xia','门':'men','福':'fu',
    '州':'zhou','昆':'kun','明':'ming','贵':'gui','阳':'yang','银':'yin','川':'chuan',
    '哈':'ha','尔':'er','滨':'bin','长':'chang','春':'chun','沈':'shen','阳':'yang',
    '济':'ji','南':'nan','郑':'zheng','州':'zhou','太':'tai','原':'yuan','石':'shi',
    '家':'jia','庄':'zhuang','合':'he','肥':'fei','福':'fu','州':'zhou','南':'nan',
    '昌':'chang','太':'tai','原':'yuan','哈':'ha','尔':'er','滨':'bin'
  };
  var result='';
  for(var i=0;i<text.length;i++){
    var char=text[i];
    if(pinyinMap[char]){result+=pinyinMap[char];}
    else if(/[\u4e00-\u9fa5]/.test(char)){
      result+='pinyin';
    }
    else{result+=char;}
  }
  return result;
}
function showResult(text,title){
  var r=document.getElementById('result');
  var html='<div class="card"><div class="section"><h3>📋 '+title+'</h3>';
  html+='<div class="result-block" id="resultText">'+escapeHtml(text)+'</div>';
  html+='<button class="copy-btn" onclick="copyResult()">复制结果</button></div></div>';
  r.innerHTML=html;
}
function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyResult(){
  var text=document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
generateSlug();
</script></body></html>
