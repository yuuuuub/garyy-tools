<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOP标准操作流程生成器</title>
<meta name="description" content="在线创建标准操作流程(SOP)文档，支持多种模板">
<script defer src="../i18n.js"></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth;padding:16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button,textarea{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:60px}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s;display:inline-block;text-align:center}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.step-list{list-style:none;counter-reset:step}
.step-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;position:relative}
.step-item .step-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.step-num{background:var(--blue);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.step-item input,.step-item textarea{font-size:.82rem;padding:6px 8px}
.step-remove{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:.75rem}
.preview-box{background:#fff;color:#333;padding:24px;border-radius:var(--radius);border:1px solid #ddd;font-size:.82rem;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.output-area{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
@media(max-width:640px){.form-row{flex-direction:column}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="SOP标准操作流程生成器">
<meta property="og:description" content="在线创建标准操作流程文档">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📝 SOP标准操作流程生成器</h1>
    <p>快速创建标准化操作流程文档</p>
  </header>

  <div class="card">
    <div class="section-title">基本信息</div>
    <div class="form-row">
      <div class="group"><label>SOP标题</label><input type="text" id="sopTitle" value="新员工入职流程"></div>
      <div class="group"><label>SOP编号</label><input type="text" id="sopCode" value="SOP-HR-001"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>适用部门</label><input type="text" id="department" value="人力资源部"></div>
      <div class="group"><label>版本号</label><input type="text" id="version" value="V1.0"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>编制人</label><input type="text" id="author" value="张三"></div>
      <div class="group"><label>编制日期</label><input type="date" id="createDate"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>目的</label><textarea id="purpose" rows="2">规范新员工入职流程，确保每位新员工能够顺利融入公司，快速适应工作环境。</textarea></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">操作步骤</div>
    <ul class="step-list" id="stepList"></ul>
    <button class="btn btn-outline" onclick="addStep()" style="margin-top:8px">+ 添加步骤</button>
  </div>

  <div class="card">
    <div class="section-title">注意事项</div>
    <div class="form-row">
      <div class="group"><textarea id="notes" rows="3">1. 所有步骤须在新员工入职当天完成
2. 涉及系统权限的操作需部门主管审批
3. 保密文件需签署保密协议后方可发放</textarea></div>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" onclick="generate()">生成SOP</button>
    <button class="btn btn-green" onclick="copySop()">复制</button>
    <button class="btn btn-outline" onclick="downloadSop()">下载 TXT</button>
  </div>

  <div class="output-area" id="outputArea" style="display:none">
    <div class="section-title">SOP预览</div>
    <div class="preview-box" id="preview"></div>
  </div>
</div>

<script>
document.getElementById('createDate').value = new Date().toISOString().split('T')[0];

var stepData = [
  {title:'接收入职通知', desc:'HR确认候选人已接受offer，准备入职资料。', responsible:'HR专员', tools:'邮件、OA系统', time:'15分钟'},
  {title:'准备办公设备', desc:'申请电脑、工位、门禁卡等办公设备。', responsible:'行政部', tools:'资产管理系统', time:'30分钟'},
  {title:'办理入职手续', desc:'收集身份证、学历证明等材料，签署劳动合同。', responsible:'HR专员', tools:'劳动合同、员工登记表', time:'45分钟'},
  {title:'系统账号开通', desc:'开通邮箱、OA、企业微信等系统账号。', responsible:'IT部门', tools:'系统管理后台', time:'20分钟'},
  {title:'部门介绍', desc:'由直属领导带领认识团队，介绍工作职责。', responsible:'部门主管', tools:'无', time:'30分钟'}
];

function renderSteps() {
  var list = document.getElementById('stepList');
  list.innerHTML = '';
  stepData.forEach(function(s, i) {
    var li = document.createElement('li');
    li.className = 'step-item';
    li.innerHTML = '<button class="step-remove" onclick="removeStep(' + i + ')">删除</button>' +
      '<div class="step-head"><span class="step-num">' + (i+1) + '</span><input type="text" value="' + s.title + '" placeholder="步骤标题" onchange="stepData[' + i + '].title=this.value"></div>' +
      '<textarea rows="2" placeholder="步骤描述" onchange="stepData[' + i + '].desc=this.value">' + s.desc + '</textarea>' +
      '<div class="form-row" style="margin-top:8px;margin-bottom:0">' +
      '<div class="group"><label>责任人</label><input type="text" value="' + s.responsible + '" onchange="stepData[' + i + '].responsible=this.value"></div>' +
      '<div class="group"><label>所需工具</label><input type="text" value="' + s.tools + '" onchange="stepData[' + i + '].tools=this.value"></div>' +
      '<div class="group"><label>预计时间</label><input type="text" value="' + s.time + '" onchange="stepData[' + i + '].time=this.value"></div>' +
      '</div>';
    list.appendChild(li);
  });
}

function addStep() {
  stepData.push({title:'新步骤', desc:'请填写步骤描述', responsible:'待定', tools:'待定', time:'待定'});
  renderSteps();
}

function removeStep(i) {
  stepData.splice(i, 1);
  renderSteps();
}

function generate() {
  var title = document.getElementById('sopTitle').value || 'SOP文档';
  var code = document.getElementById('sopCode').value || '';
  var dept = document.getElementById('department').value || '';
  var ver = document.getElementById('version').value || 'V1.0';
  var author = document.getElementById('author').value || '';
  var date = document.getElementById('createDate').value || '';
  var purpose = document.getElementById('purpose').value || '';
  var notes = document.getElementById('notes').value || '';

  var p = '════════════════════════════════════════\n';
  p += '    标准操作流程 (SOP)\n';
  p += '════════════════════════════════════════\n\n';
  p += '标题: ' + title + '\n';
  p += '编号: ' + code + '\n';
  p += '版本: ' + ver + '\n';
  p += '部门: ' + dept + '\n';
  p += '编制: ' + author + '\n';
  p += '日期: ' + date + '\n\n';
  p += '──────────────────────────────────────\n';
  p += '一、目的\n──────────────────────────────────────\n\n';
  p += purpose + '\n\n';
  p += '──────────────────────────────────────\n';
  p += '二、操作步骤\n──────────────────────────────────────\n\n';
  stepData.forEach(function(s, i) {
    p += '步骤 ' + (i+1) + ': ' + s.title + '\n';
    p += '  责任人: ' + s.responsible + '\n';
    p += '  所需工具: ' + s.tools + '\n';
    p += '  预计时间: ' + s.time + '\n';
    p += '  操作描述: ' + s.desc + '\n\n';
  });
  if (notes) {
    p += '──────────────────────────────────────\n';
    p += '三、注意事项\n──────────────────────────────────────\n\n';
    p += notes + '\n\n';
  }
  p += '════════════════════════════════════════\n';
  p += '编制人: ' + author + '    审核人: ________\n';
  p += '批准人: ________    生效日期: ' + date + '\n';

  document.getElementById('preview').textContent = p;
  document.getElementById('outputArea').style.display = 'block';
  document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
}

function copySop() {
  generate();
  navigator.clipboard.writeText(document.getElementById('preview').textContent).then(function() {
    alert('已复制到剪贴板');
  });
}

function downloadSop() {
  generate();
  var blob = new Blob([document.getElementById('preview').textContent], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'SOP-' + document.getElementById('sopCode').value + '.txt';
  a.click();
}

renderSteps();
</script>
</body>
</html>
