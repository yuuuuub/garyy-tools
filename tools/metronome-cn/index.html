<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 节拍器</title>
<meta property="og:title" content="🎵 节拍器">
<meta property="og:description" content="🎵 节拍器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线节拍器，支持BPM调节、拍号选择、重音显示和闪光提示">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:400px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.bpm-display{text-align:center;padding:20px 0}
.bpm-number{font-size:72px;font-weight:800;line-height:1;color:var(--accent);font-family:monospace}
.bpm-label{font-size:14px;color:var(--text-secondary);margin-top:4px}
.bpm-slider{width:100%;margin:16px 0}
.bpm-slider input[type="range"]{width:100%;height:8px;border-radius:4px;-webkit-appearance:none;background:var(--border)}
.bpm-slider input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 8px rgba(99,102,241,.3)}
.bpm-presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.bpm-preset{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s}
.bpm-preset:hover{border-color:var(--accent)}
.bpm-preset.active{border-color:var(--accent);background:var(--accent);color:#fff}
.beat-display{display:flex;gap:8px;justify-content:center;margin:20px 0}
.beat-dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);background:var(--card-bg);transition:all .05s;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.beat-dot.active{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.2)}
.beat-dot.accent-beat.active{background:var(--red);border-color:var(--red)}
.time-signature{display:flex;gap:8px;justify-content:center;margin:12px 0}
.ts-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:18px;font-weight:700;cursor:pointer;transition:all .2s}
.ts-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.play-btn{width:80px;height:80px;border-radius:50%;border:none;font-size:32px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.3);margin:0 auto}
.play-btn:hover{transform:scale(1.05)}
.play-btn:active{transform:scale(.95)}
.play-btn.playing{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 15px rgba(239,68,68,0)}}
.flash-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--accent);opacity:0;pointer-events:none;transition:opacity .05s;z-index:100}
.flash-overlay.flash{opacity:.08}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slider-row label{font-size:13px;color:var(--text-secondary);min-width:80px}
.slider-row input[type="range"]{flex:1}
.slider-row span{font-size:13px;min-width:36px;text-align:right;color:var(--accent);font-weight:600}
.footer{text-align:center;padding:20px 0;font-size:12px;color:var(--text-secondary)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<div class="flash-overlay" id="flashOverlay"></div>
<header>
<h1>🎵 节拍器</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="bpm-display">
<div class="bpm-number" id="bpmDisplay">120</div>
<div class="bpm-label">BPM</div>
</div>
<div class="bpm-slider">
<input type="range" min="20" max="300" value="120" id="bpmSlider" oninput="setBpm(+this.value)">
</div>
<div class="bpm-presets">
<button class="bpm-preset" onclick="setBpm(60,this)">Largo</button>
<button class="bpm-preset" onclick="setBpm(80,this)">Andante</button>
<button class="bpm-preset active" onclick="setBpm(120,this)">Moderato</button>
<button class="bpm-preset" onclick="setBpm(140,this)">Allegro</button>
<button class="bpm-preset" onclick="setBpm(180,this)">Presto</button>
</div>
</div>
<div class="card">
<div class="card-title" style="justify-content:center">拍号</div>
<div class="time-signature">
<button class="ts-btn" onclick="setTS(2,this)">2/4</button>
<button class="ts-btn active" onclick="setTS(3,this)">3/4</button>
<button class="ts-btn" onclick="setTS(4,this)">4/4</button>
<button class="ts-btn" onclick="setTS(5,this)">5/4</button>
<button class="ts-btn" onclick="setTS(6,this)">6/8</button>
<button class="ts-btn" onclick="setTS(7,this)">7/8</button>
</div>
<div class="beat-display" id="beatDisplay"></div>
<div style="text-align:center">
<button class="play-btn" id="playBtn" onclick="togglePlay()">▶️</button>
</div>
</div>
<div class="card">
<div class="card-title">⚙️ 设置</div>
<div class="slider-row"><label>音量</label><input type="range" min="0" max="100" value="80" id="volSlider" oninput="document.getElementById('volVal').textContent=this.value+'%'"><span id="volVal">80%</span></div>
<div class="slider-row"><label>重音频率</label><input type="range" min="2000" max="4000" value="3000" id="accentFreq" oninput="document.getElementById('accentFreqVal').textContent=this.value+'Hz'"><span id="accentFreqVal">3000Hz</span></div>
<div class="slider-row"><label>普通频率</label><input type="range" min="600" max="1500" value="1000" id="normalFreq" oninput="document.getElementById('normalFreqVal').textContent=this.value+'Hz'"><span id="normalFreqVal">1000Hz</span></div>
</div>
<div class="footer">节拍器 - 基于 Web Audio API</div>
</div>
<script>
let audioCtx,bpm=120,timeSignature=4,isPlaying=false,currentBeat=0,nextNoteTime=0,timerId=null,flashEl=document.getElementById('flashOverlay');
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function setBpm(v,el){bpm=v;document.getElementById('bpmDisplay').textContent=v;document.getElementById('bpmSlider').value=v;if(el){el.parentElement.querySelectorAll('.bpm-preset').forEach(b=>b.classList.remove('active'));el.classList.add('active')}}
function setTS(v,el){timeSignature=v;document.querySelectorAll('.ts-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');buildBeatDisplay();if(isPlaying){stopPlay();startPlay()}}
function buildBeatDisplay(){const el=document.getElementById('beatDisplay');el.innerHTML=Array.from({length:timeSignature},(_,i)=>`<div class="beat-dot${i===0?' accent-beat':''}" data-beat="${i}">${i===0?'●':'○'}</div>`).join('')}
function playClick(isAccent){initAudio();const vol=document.getElementById('volSlider').value/100;const freq=isAccent?parseInt(document.getElementById('accentFreq').value):parseInt(document.getElementById('normalFreq').value);const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;const dur=isAccent?0.08:0.04;g.gain.setValueAtTime(vol*(isAccent?1:0.6),audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);osc.connect(g);g.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+dur);flashEl.classList.add('flash');setTimeout(()=>flashEl.classList.remove('flash'),60)}
function scheduleNote(){const interval=60/bpm;nextNoteTime+=interval;currentBeat=(currentBeat+1)%timeSignature;playClick(currentBeat===0)}
function startPlay(){initAudio();if(audioCtx.state==='suspended')audioCtx.resume();isPlaying=true;currentBeat=timeSignature-1;nextNoteTime=audioCtx.currentTime;document.getElementById('playBtn').classList.add('playing');document.getElementById('playBtn').textContent='⏸️';playClick(true);function loop(){if(!isPlaying)return;while(nextNoteTime<audioCtx.currentTime+0.1){scheduleNote()}timerId=requestAnimationFrame(loop)}loop()}
function stopPlay(){isPlaying=false;cancelAnimationFrame(timerId);document.getElementById('playBtn').classList.remove('playing');document.getElementById('playBtn').textContent='▶️';document.querySelectorAll('.beat-dot').forEach(d=>d.classList.remove('active'))}
function togglePlay(){if(isPlaying)stopPlay();else startPlay()}
buildBeatDisplay();
</script>
</body>
</html>
