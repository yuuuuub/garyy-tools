<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>采收记录器</title>
<meta property="og:title" content="采收记录器">
<meta property="og:description" content="采收记录器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="农产品采收记录与产量追踪，数据分析、销售管理一站式工具">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧺</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#22c55e;--accent2:#16a34a;--success:#3b82f6;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#1a7f37;--accent2:#116329;--success:#0969da;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;margin-right:4px}
.tag.g{background:var(--accent);color:#fff}.tag.w{background:var(--warn);color:#fff}.tag.r{background:var(--danger);color:#fff}.tag.b{background:var(--success);color:#fff}
.li{padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-item{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.stat-item .num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-item .label{font-size:.8rem;color:var(--text2);margin-top:4px}
.chart-bar{display:flex;align-items:end;gap:4px;height:120px;padding:0 8px}
.chart-bar .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar .bar{width:100%;background:var(--accent);border-radius:4px 4px 0 0;transition:height .3s}
.chart-bar .bar-label{font-size:.7rem;color:var(--text2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chart-bar .bar-val{font-size:.7rem;color:var(--text)}
.crop-summary{display:flex;align-items:center;gap:12px;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:8px}
.crop-summary .emoji{font-size:1.5rem}
.crop-summary .info{flex:1}
.crop-summary .name{font-weight:600}
.crop-summary .detail{font-size:.8rem;color:var(--text2)}
.crop-summary .amount{font-size:1.1rem;font-weight:700;color:var(--accent)}
.hidden{display:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🧺 采收记录器</h1><p>产量追踪 · 数据分析 · 销售管理</p></div>

<div class="cd">
<h2>添加采收记录</h2>
<div class="fr">
<div><label>作物名称</label><input type="text" id="hCrop" placeholder="如：番茄"></div>
<div><label>品种</label><input type="text" id="hVariety" placeholder="如：红罗兰"></div>
</div>
<div class="fr">
<div><label>采收重量(kg)</label><input type="number" id="hWeight" placeholder="重量" step="0.1"></div>
<div><label>采收数量</label><input type="number" id="hCount" placeholder="个/根等"></div>
</div>
<div class="fr">
<div><label>采收日期</label><input type="date" id="hDate"></div>
<div><label>种植地块</label><input type="text" id="hPlot" placeholder="如：菜地A"></div>
</div>
<div class="fr">
<div><label>品质等级</label><select id="hGrade"><option>特级</option><option>一级</option><option>二级</option><option>三级</option></select></div>
<div><label>单价(元/kg)</label><input type="number" id="hPrice" placeholder="单价" step="0.1"></div>
</div>
<label>备注</label><input type="text" id="hNote" placeholder="采收情况说明">
<div class="bg"><button onclick="addHarvest()">记录采收</button></div>
</div>

<div class="cd">
<h2>数据总览</h2>
<div class="stats-grid" id="statsGrid"></div>
</div>

<div class="cd">
<h2>作物产量排行</h2>
<div id="cropRanking"></div>
</div>

<div class="cd">
<h2>月度产量趋势</h2>
<div class="chart-bar" id="monthChart"></div>
</div>

<div class="cd">
<h2>采收记录</h2>
<input type="text" id="searchInput" placeholder="🔍 搜索作物..." oninput="renderRecords()" style="margin-bottom:12px">
<div id="recordList" class="es">暂无记录</div>
</div>

<div class="cd">
<h2>销售记录</h2>
<div class="fr">
<div><label>选择采收记录</label><select id="saleRecord"></select></div>
<div><label>销售重量(kg)</label><input type="number" id="saleWeight" placeholder="重量" step="0.1"></div>
</div>
<div class="fr">
<div><label>销售单价(元/kg)</label><input type="number" id="salePrice" placeholder="单价" step="0.1"></div>
<div><label>买家</label><input type="text" id="saleBuyer" placeholder="买家名称"></div>
</div>
<div class="bg"><button onclick="addSale()">记录销售</button></div>
<div id="saleList" class="es" style="margin-top:12px">暂无销售</div>
</div>
</div>

<script>
const H_DB='harvest_tracker_db';
const S_DB='harvest_sales_db';
let harvests=JSON.parse(localStorage.getItem(H_DB)||'[]');
let sales=JSON.parse(localStorage.getItem(S_DB)||'[]');

const CROP_EMOJI={'番茄':'🍅','黄瓜':'🥒','白菜':'🥬','萝卜':'🥕','辣椒':'🌶️','茄子':'🍆','土豆':'🥔','西瓜':'🍉','南瓜':'🎃','玉米':'🌽','苹果':'🍎','葡萄':'🍇','草莓':'🍓','大蒜':'🧄','生姜':'🫚','莴苣':'🥬','豌豆':'🫛','花生':'🥜','大豆':'🫘','菠菜':'🥬'};

function addHarvest(){
  const crop=document.getElementById('hCrop').value.trim();
  const weight=+document.getElementById('hWeight').value||0;
  if(!crop||!weight)return alert('请填写作物名称和重量');
  harvests.push({
    id:Date.now(),crop,
    variety:document.getElementById('hVariety').value.trim(),
    weight,
    count:+document.getElementById('hCount').value||0,
    date:document.getElementById('hDate').value||new Date().toISOString().slice(0,10),
    plot:document.getElementById('hPlot').value.trim(),
    grade:document.getElementById('hGrade').value,
    price:+document.getElementById('hPrice').value||0,
    note:document.getElementById('hNote').value.trim()
  });
  localStorage.setItem(H_DB,JSON.stringify(harvests));
  ['hCrop','hVariety','hWeight','hCount','hPlot','hPrice','hNote'].forEach(id=>document.getElementById(id).value='');
  renderAll();
}

function renderAll(){renderStats();renderRanking();renderMonthChart();renderRecords();renderSaleSelect();renderSales()}

function renderStats(){
  const totalWeight=harvests.reduce((s,h)=>s+h.weight,0);
  const totalCount=harvests.reduce((s,h)=>s+h.count,0);
  const totalValue=harvests.reduce((s,h)=>s+h.weight*h.price,0);
  const cropTypes=new Set(harvests.map(h=>h.crop)).size;
  const totalSales=sales.reduce((s,x)=>s+x.amount,0);
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-item"><div class="num">${harvests.length}</div><div class="label">采收次数</div></div>
    <div class="stat-item"><div class="num">${totalWeight.toFixed(1)}</div><div class="label">总产量(kg)</div></div>
    <div class="stat-item"><div class="num">${cropTypes}</div><div class="label">作物种类</div></div>
    <div class="stat-item"><div class="num">¥${totalValue.toFixed(0)}</div><div class="label">总产值</div></div>
    <div class="stat-item"><div class="num">¥${totalSales.toFixed(0)}</div><div class="label">已销售</div></div>
    <div class="stat-item"><div class="num">${(totalWeight*1000).toFixed(0)}</div><div class="label">总产量(g)</div></div>`;
}

function renderRanking(){
  const el=document.getElementById('cropRanking');
  const cropMap={};
  harvests.forEach(h=>{cropMap[h.crop]=(cropMap[h.crop]||0)+h.weight});
  const sorted=Object.entries(cropMap).sort((a,b)=>b[1]-a[1]);
  const max=sorted[0]?sorted[0][1]:1;
  if(!sorted.length){el.innerHTML='<div class="es">暂无数据</div>';return}
  el.innerHTML=sorted.map(([crop,weight])=>{
    const emoji=CROP_EMOJI[crop]||'🌱';
    return`<div class="crop-summary">
      <div class="emoji">${emoji}</div>
      <div class="info"><div class="name">${crop}</div><div class="detail">${weight.toFixed(1)}kg · ${Math.round(weight/max*100)}%</div></div>
      <div class="amount">${weight.toFixed(1)}kg</div>
    </div>`}).join('');
}

function renderMonthChart(){
  const el=document.getElementById('monthChart');
  const monthMap={};
  harvests.forEach(h=>{const m=h.date.slice(0,7);monthMap[m]=(monthMap[m]||0)+h.weight});
  const months=Object.entries(monthMap).sort((a,b)=>a[0].localeCompare(b[0])).slice(-12);
  if(!months.length){el.innerHTML='<div style="text-align:center;color:var(--text2);font-size:.85rem;width:100%">暂无数据</div>';return}
  const max=Math.max(...months.map(m=>m[1]));
  el.innerHTML=months.map(([m,w])=>{
    const h=Math.round(w/max*100);
    return`<div class="bar-wrap"><div class="bar-val">${w.toFixed(0)}</div><div class="bar" style="height:${h}%"></div><div class="bar-label">${m.slice(5)}月</div></div>`;
  }).join('');
}

function renderRecords(){
  const el=document.getElementById('recordList');
  const filter=(document.getElementById('searchInput').value||'').trim();
  const filtered=harvests.filter(h=>!filter||h.crop.includes(filter)||h.plot.includes(filter)||h.variety.includes(filter));
  if(!filtered.length){el.innerHTML='<div class="es">暂无记录</div>';return}
  el.innerHTML=filtered.map((h,i)=>{
    const emoji=CROP_EMOJI[h.crop]||'🌱';
    return`<div class="li" style="display:flex;justify-content:space-between;align-items:center">
      <div><span style="font-size:1.2rem">${emoji}</span> <strong>${h.crop}</strong> <span class="tag g">${h.weight}kg</span> <span class="tag b">${h.grade}</span><div style="font-size:.85rem;color:var(--text2)">${h.date} ${h.plot?'· '+h.plot:''} ${h.price?'· ¥'+h.price+'/kg':''}</div></div>
      <button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="harvests.splice(${harvests.indexOf(h)},1);localStorage.setItem('${H_DB}',JSON.stringify(harvests));renderAll()">删除</button>
    </div>`}).reverse().join('');
}

function renderSaleSelect(){
  const el=document.getElementById('saleRecord');
  el.innerHTML=harvests.map(h=>`<option value="${h.id}">${h.crop} ${h.weight}kg (${h.date})</option>`).join('');
}

function addSale(){
  const recordId=+document.getElementById('saleRecord').value;
  const weight=+document.getElementById('saleWeight').value||0;
  const price=+document.getElementById('salePrice').value||0;
  if(!weight)return alert('请输入销售重量');
  const h=harvests.find(x=>x.id===recordId);
  sales.push({
    id:Date.now(),
    crop:h?h.crop:'未知',
    weight,price,
    amount:weight*price,
    buyer:document.getElementById('saleBuyer').value.trim(),
    date:new Date().toISOString().slice(0,10)
  });
  localStorage.setItem(S_DB,JSON.stringify(sales));
  ['saleWeight','salePrice','saleBuyer'].forEach(id=>document.getElementById(id).value='');
  renderAll();
}

function renderSales(){
  const el=document.getElementById('saleList');
  if(!sales.length){el.innerHTML='<div class="es">暂无销售</div>';return}
  el.innerHTML=sales.map((s,i)=>{
    const emoji=CROP_EMOJI[s.crop]||'🌱';
    return`<div class="li" style="display:flex;justify-content:space-between;align-items:center">
      <div><span style="font-size:1.2rem">${emoji}</span> <strong>${s.crop}</strong> <span class="tag g">${s.weight}kg</span> <span class="tag w">¥${s.amount.toFixed(0)}</span><div style="font-size:.85rem;color:var(--text2)">${s.date} ${s.buyer?'· '+s.buyer:''}</div></div>
      <button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="sales.splice(${i},1);localStorage.setItem('${S_DB}',JSON.stringify(sales));renderAll()">删除</button>
    </div>`}).reverse().join('');
}

document.getElementById('hDate').value=new Date().toISOString().slice(0,10);
renderAll();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
