<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 团队番茄钟</title>
<meta name="description" content="团队协作番茄钟计时器，支持多成员同步专注和休息">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.timer-display{font-size:3.5rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px}
.timer-label{text-align:center;color:var(--text2);margin-top:4px;font-size:.9rem}
.mode-tabs{display:flex;gap:4px;justify-content:center;margin-bottom:16px}
.mode-tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;color:var(--text2);border:1px solid var(--border);background:var(--bg);transition:all .2s}
.mode-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.member-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;transition:all .2s}
.member-card.active{border-color:var(--accent);box-shadow:0 0 12px rgba(59,130,246,.3)}
.member-card.breaking{border-color:var(--green)}
.member-card.idle{opacity:.6}
.member-avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;margin:0 auto 8px}
.member-name{font-weight:600;font-size:.9rem}
.member-timer{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.member-status{font-size:.75rem;color:var(--text2);margin-top:2px}
.member-tasks{font-size:.75rem;color:var(--text2);margin-top:4px}
.member-tasks span{color:var(--accent);font-weight:600}
.progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 1s linear}
.form-row{display:flex;gap:8px;margin-bottom:8px}
.form-row input,.form-row select{flex:1;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem}
.form-row input:focus{outline:none;border-color:var(--accent)}
.stats-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.stat{text-align:center}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-lbl{font-size:.75rem;color:var(--text2)}
.hidden{display:none}
@media(max-width:600px){.member-grid{grid-template-columns:1fr 1fr}.timer-display{font-size:2.5rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🍅 团队番茄钟">
<meta property="og:description" content="团队协作番茄钟计时器，支持多成员同步专注和休息">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='pomodoro_team';
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{
  members:[{id:1,name:'成员1',color:'#3b82f6'},{id:2,name:'成员2',color:'#8b5cf6'},{id:3,name:'成员3',color:'#f59e0b'}],
  focusMin:25,shortMin:5,longMin:15,sessionsBeforeLong:4,
  globalTimer:null,globalMode:'focus',globalRunning:false,globalRemaining:25*60,
  completedSessions:0,totalFocusMin:0
};
let nextId=state.members.length?Math.max(...state.members.map(m=>m.id))+1:1;
const colors=['#3b82f6','#8b5cf6','#f59e0b','#ef4444','#22c55e','#ec4899','#14b8a6','#f97316'];
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function formatTime(s){const m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function getProgress(){const total=state.globalMode==='focus'?state.focusMin*60:state.globalMode==='short'?state.shortMin*60:state.longMin*60;return((total-state.globalRemaining)/total)*100}
function startGlobal(){if(!state.globalRunning){state.globalRunning=true;state.globalStartTime=Date.now();state.globalEndAt=Date.now()+state.globalRemaining*1000;save();tickGlobal()}}
function pauseGlobal(){state.globalRunning=false;state.globalRemaining=Math.max(0,Math.round((state.globalEndAt-Date.now())/1000));save();render()}
function resetGlobal(){state.globalRunning=false;state.globalMode='focus';state.globalRemaining=state.focusMin*60;save();render()}
function setMode(m){if(state.globalRunning)return;state.globalMode=m;state.globalRemaining=m==='focus'?state.focusMin*60:m==='short'?state.shortMin*60:state.longMin*60;save();render()}
function tickGlobal(){if(!state.globalRunning)return;const rem=Math.max(0,Math.round((state.globalEndAt-Date.now())/1000));state.globalRemaining=rem;render();if(rem<=0){onTimerEnd();return}setTimeout(tickGlobal,500)}
function onTimerEnd(){if(state.globalMode==='focus'){state.completedSessions++;state.totalFocusMin+=state.focusMin;if(state.completedSessions%state.sessionsBeforeLong===0){state.globalMode='long';state.globalRemaining=state.longMin*60}else{state.globalMode='short';state.globalRemaining=state.shortMin*60}}else{state.globalMode='focus';state.globalRemaining=state.focusMin*60}state.globalRunning=false;save();render();try{new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH+JkI+Gd2BaaXN/g4ODe21lZm10gIaLjYl8cWdmbXR+g4ODe21lZm10f4aLjYl8cWdmbXR+g4ODe21lZm10f4aLjYl8cWdmbXR+').play().catch(()=>{})}catch(e){}}
function addMember(){const name='成员'+nextId;state.members.push({id:nextId,name,color:colors[(nextId-1)%colors.length],sessions:0,focusMin:0});nextId++;save();render()}
function removeMember(id){state.members=state.members.filter(m=>m.id!==id);save();render()}
function renameMember(id,name){const m=state.members.find(m=>m.id===id);if(m){m.name=name;save();render()}}
function render(){
  let h=`<div class="hdr"><h1>🍅 团队番茄钟</h1><p>多人协作专注计时</p></div>`;
  h+=`<div class="cd"><div class="mode-tabs">`;
  ['focus','short','long'].forEach(m=>{const labels={focus:'专注',short:'短休息',long:'长休息'};h+=`<div class="mode-tab${state.globalMode===m?' active':''}" onclick="setMode('${m}')">${labels[m]}</div>`});
  h+=`</div><div class="timer-display">${formatTime(state.globalRemaining)}</div>`;
  h+=`<div class="timer-label">${{focus:'专注时间',short:'短休息',long:'长休息'}[state.globalMode]}</div>`;
  h+=`<div class="progress-bar"><div class="progress-fill" style="width:${getProgress()}%"></div></div>`;
  h+=`<div class="bg" style="margin-top:16px">`;
  if(state.globalRunning){h+=`<button onclick="pauseGlobal()">⏸ 暂停</button>`}else{h+=`<button onclick="startGlobal()">▶ 开始</button>`}
  h+=`<button class="sec" onclick="resetGlobal()">↺ 重置</button></div>`;
  h+=`<div class="stats-row"><div class="stat"><div class="stat-num">${state.completedSessions}</div><div class="stat-lbl">已完成轮次</div></div>`;
  h+=`<div class="stat"><div class="stat-num">${state.totalFocusMin}</div><div class="stat-lbl">专注分钟</div></div></div></div>`;
  h+=`<div class="cd"><h2>👥 团队成员 <button class="sec" style="font-size:.8rem;padding:4px 12px;margin-left:8px" onclick="addMember()">+ 添加</button></h2>`;
  h+=`<div class="member-grid">`;
  state.members.forEach(m=>{
    const isGlobalActive=state.globalRunning;
    const statusClass=isGlobalActive?(state.globalMode==='focus'?'active':'breaking'):'idle';
    h+=`<div class="member-card ${statusClass}">`;
    h+=`<div class="member-avatar" style="background:${m.color}">${m.name[0]}</div>`;
    h+=`<div class="member-name"><input value="${m.name}" onchange="renameMember(${m.id},this.value)" style="text-align:center;background:transparent;border:none;color:var(--text);font-weight:600;font-size:.9rem;width:80px"></div>`;
    h+=`<div class="member-timer">${formatTime(state.globalRemaining)}</div>`;
    h+=`<div class="member-status">${isGlobalActive?(state.globalMode==='focus'?'🔴 专注中':'🟢 休息中'):'⚪ 待命'}</div>`;
    h+=`<button class="sec" style="font-size:.7rem;padding:2px 8px;margin-top:6px" onclick="removeMember(${m.id})">移除</button>`;
    h+=`</div>`});
  h+=`</div></div>`;
  h+=`<div class="cd"><h2>⚙️ 设置</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px">`;
  [{l:'专注(分)',v:'focusMin'},{l:'短休(分)',v:'shortMin'},{l:'长休(分)',v:'longMin'},{l:'几轮后长休',v:'sessionsBeforeLong'}].forEach(s=>{
    h+=`<div><label style="display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px">${s.l}</label>`;
    h+=`<input type="number" value="${state[s.v]}" min="1" max="120" onchange="state.${s.v}=+this.value;save()" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>`});
  h+=`</div></div>`;
  $('app').innerHTML=h;
}
render();
</script>
</body>
</html>
