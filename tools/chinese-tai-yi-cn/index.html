<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>太乙神数 - 太乙排盘 | Gary's Tools</title><meta name="description" content="太乙神数排盘工具 - 三式之首，以太乙、文昌、始击等神煞推算国运与人事"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#8e44ad;--accent2:#7d3c98}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#7d3c98;--accent2:#6c3483}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;transition:background var(--transition),color var(--transition)}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}.form-group{flex:1;min-width:120px}.form-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.form-group select,.form-group input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem}.btn{display:inline-block;padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:8px}.btn:hover{opacity:.85}#chart{width:100%;border-collapse:collapse;margin:12px 0}#chart td{border:1px solid var(--border);padding:8px;text-align:center;font-size:.8rem}#chart .header{font-weight:700;color:var(--accent);background:var(--bg)}#chart .content{color:var(--text)}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.info-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px}.info-item h4{color:var(--accent);margin-bottom:6px;font-size:.9rem}.info-item p{font-size:.8rem;color:var(--text2);line-height:1.5}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem)}</style><meta property="og:title" content="太乙神数"><meta property="og:description" content="太乙神数排盘工具 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☯️</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>☯️ 太乙神数</h1><p class="sub">三式之首 · 国运推算 · 太乙文昌始击</p>
<div class="card">
<div class="form-row">
<div class="form-group"><label>年份</label><input type="number" id="year" value="2024"></div>
<div class="form-group"><label>月份</label><select id="month"></select></div>
<div class="form-group"><label>日期</label><input type="number" id="day" value="1" min="1" max="31"></div>
<div class="form-group"><label>时辰</label><select id="hour"></select></div>
</div>
<button class="btn" onclick="generate()">排盘</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var tianGan=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var diZhi=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var wuXing=['金','木','水','火','土'];
var palace=['坎一','坤二','震三','巽四','中五','乾六','兑七','艮八','离九'];
var taiYiShen=['太乙','文昌','始击','地主','计神','合神','定目','四神','天皇'];
function initSelects(){
  var mSel=document.getElementById('month');
  for(var m=1;m<=12;m++)mSel.add(new Option(m+'月',m));
  var hSel=document.getElementById('hour');
  var hours=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  hours.forEach(function(h,i){hSel.add(new Option(h+'时',i));});
}
function generate(){
  var year=parseInt(document.getElementById('year').value);
  var month=parseInt(document.getElementById('month').value);
  var day=parseInt(document.getElementById('day').value);
  var hour=parseInt(document.getElementById('hour').value);
  var seed=(year*365+month*30+day*12+hour)%10000;
  function rng(s){return(s*9301+49297)%10000;}
  var ganIdx=(year-4)%10;
  var zhiIdx=(year-4)%12;
  var taiYiPalace=Math.floor(rng(seed)%9);
  var wenChangPalace=Math.floor(rng(seed+100)%9);
  var shiJiPalace=Math.floor(rng(seed+200)%9);
  var jiShenPalace=Math.floor(rng(seed+300)%9);
  var yuanQi=Math.floor(rng(seed+400)%4);
  var yuanQiNames=['上元','中元','下元','超神'];
  var html='<div class="card"><h3 style="color:var(--accent);margin-bottom:12px">太乙神数盘</h3>';
  html+='<p style="font-size:.85rem;color:var(--text2);margin-bottom:12px">岁次：'+tianGan[ganIdx]+diZhi[zhiIdx]+'年 | 元局：'+yuanQiNames[yuanQi]+' | 局数：'+(Math.floor(rng(seed+500)%72)+1)+'</p>';
  html+='<table id="chart"><tr><td class="header">神煞</td><td class="header">所在宫位</td><td class="header">五行</td><td class="header">吉凶</td></tr>';
  var shenArr=[
    {name:'太乙',palace:taiYiPalace},
    {name:'文昌',palace:wenChangPalace},
    {name:'始击',palace:shiJiPalace},
    {name:'计神',palace:jiShenPalace},
    {name:'地主',palace:Math.floor(rng(seed+600)%9)},
    {name:'合神',palace:Math.floor(rng(seed+700)%9)},
    {name:'定目',palace:Math.floor(rng(seed+800)%9)},
    {name:'四神',palace:Math.floor(rng(seed+900)%9)}
  ];
  shenArr.forEach(function(s){
    var wx=wuXing[Math.floor(rng(seed+s.palace*13)%5)];
    var jx=Math.floor(rng(seed+s.palace*17)%3);
    var jxStr=['吉','凶','平'][jx];
    var jxColor=jx===0?'var(--green)':jx===1?'var(--red)':'var(--text2)';
    html+='<tr><td class="header">'+s.name+'</td><td class="content">'+palace[s.palace]+'</td><td class="content">'+wx+'</td><td class="content" style="color:'+jxColor+'">'+jxStr+'</td></tr>';
  });
  html+='</table></div>';
  html+='<div class="card"><h3 style="color:var(--accent);margin-bottom:12px">太乙神数解读</h3><div class="info-grid">';
  html+='<div class="info-item"><h4>太乙</h4><p>太乙为至尊之神，所临宫位代表核心运势。太乙临'+palace[taiYiPalace]+'，主大局趋势。太乙所在宫位的五行与年命五行的关系是判断吉凶的重要依据。</p></div>';
  html+='<div class="info-item"><h4>文昌</h4><p>文昌主文运、科举、学业。文昌临'+palace[wenChangPalace]+'，利于考试、学习、文化事业。文昌与太乙同宫为大吉，相生亦吉。</p></div>';
  html+='<div class="info-item"><h4>始击</h4><p>始击主兵事、竞争、冲突。始击临'+palace[shiJiPalace]+'，与太乙对冲则有争斗之象。始击所临宫位的五行与太乙宫位的关系需要重点关注。</p></div>';
  html+='<div class="info-item"><h4>计神</h4><p>计神主谋略、计算、策划。计神临'+palace[jiShenPalace]+'，利于制定策略和计划。计神与文昌同宫，利文职谋略；与始击同宫，利军事谋略。</p></div>';
  html+='</div>';
  html+='<div class="info-item" style="margin-top:12px"><h4>综合判断</h4><p>'+getInterpretation(taiYiPalace,wenChangPalace,shiJiPalace,yuanQi)+'</p></div>';
  html+='</div>';
  document.getElementById('result').innerHTML=html;
}
function getInterpretation(taiYi,wenChang,shiJi,yuanQi){
  var result='太乙神数以'+yuanQiNames[yuanQi]+'起算。';
  if(taiYi===wenChang){result+='太乙与文昌同宫，文运昌盛，利于考试升迁、文化发展。';}
  else if(taiYi===shiJi){result+='太乙与始击同宫，有竞争冲突之象，需谨慎应对变化。';}
  else{result+='太乙独坐'+palace[taiYi]+'，文昌在'+palace[wenChang]+'，始击在'+palace[shiJi]+'。';if(wenChang<shiJi){result+='文昌在始击之前，文运优于武运，宜以文治事。';}else{result+='始击在文昌之前，武运较强，宜积极应对竞争。';}}
  result+='建议结合具体所问之事，综合分析各神煞的生克关系。';
  return result;
}
initSelects();
</script></body></html>
