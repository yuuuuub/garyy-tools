<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奇门遁甲 - 排盘预测 | Gary's Tools</title><meta name="description" content="奇门遁甲排盘工具 - 天盘地盘人盘神盘，九宫八门九星八神详解"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#f39c12;--accent2:#d68910}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#d68910;--accent2:#b7950b}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;transition:background var(--transition),color var(--transition)}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}.form-group{flex:1;min-width:120px}.form-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.form-group select,.form-group input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem}.btn{display:inline-block;padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:8px}.btn:hover{opacity:.85}#chart{width:100%;border-collapse:collapse}#chart td{border:1px solid var(--border);padding:8px;text-align:center;font-size:.8rem;vertical-align:middle;width:25%}#chart .cell-header{font-weight:700;color:var(--accent);font-size:.85rem}#chart .cell-main{font-size:.75rem;color:var(--text2);line-height:1.5}#chart .cell-god{color:#9b59b6}#chart .cell-star{color:#3498db}#chart .cell-door{color:#e67e22}#chart .cell-yi{color:#2ecc71}#chart .center-cell{background:var(--card);font-size:.8rem;color:var(--accent)}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.info-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px}.info-item h4{color:var(--accent);margin-bottom:6px;font-size:.9rem}.info-item p{font-size:.8rem;color:var(--text2);line-height:1.5}.tag{display:inline-block;padding:2px 8px;background:var(--border);border-radius:4px;font-size:.75rem;color:var(--text2);margin:2px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem)}</style><meta property="og:title" content="奇门遁甲"><meta property="og:description" content="奇门遁甲排盘工具 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔮 奇门遁甲</h1><p class="sub">天盘地盘 · 人盘神盘 · 九宫八门</p>
<div class="card">
<div class="form-row">
<div class="form-group"><label>年份</label><input type="number" id="year" value="2024"></div>
<div class="form-group"><label>月份</label><select id="month"></select></div>
<div class="form-group"><label>日期</label><input type="number" id="day" value="1" min="1" max="31"></div>
<div class="form-group"><label>时辰</label><select id="hour"></select></div>
</div>
<button class="btn" onclick="generate()">排盘</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var jiuGong=['坎一宫','坤二宫','震三宫','巽四宫','中五宫','乾六宫','兑七宫','艮八宫','离九宫'];
var baMen=['休门','死门','伤门','杜门','','开门','惊门','生门','景门'];
var jiuXiao:['天蓬','天芮','天冲','天辅','天禽','天心','天柱','天任','天英'];
var baShen=['值符','螣蛇','太阴','六合','白虎','玄武','九地','九天'];
var tianGan=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var diZhi=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var palaceNames=['坎','坤','震','巽','中','乾','兑','艮','离'];
function initSelects(){
  var mSel=document.getElementById('month');
  for(var m=1;m<=12;m++)mSel.add(new Option(m+'月',m));
  var hSel=document.getElementById('hour');
  var hours=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  hours.forEach(function(h,i){hSel.add(new Option(h+'时',i));});
}
function generate(){
  var year=parseInt(document.getElementById('year').value);
  var month=parseInt(document.getElementById('month').value);
  var day=parseInt(document.getElementById('day').value);
  var hour=parseInt(document.getElementById('hour').value);
  var seed=(year+month+day+hour)%108;
  var ju=seed%9;
  var yinYang=seed%2===0?'阴遁':'阳遁';
  var juNum=(seed%9)+1;
  function rng(s){s=Math.sin(s*9301+49297)%1;if(s<0)s+=1;return s;}
  var cells=[];
  for(var i=0;i<9;i++){
    var godIdx=Math.floor(rng(seed+i*7)*8);
    var starIdx=Math.floor(rng(seed+i*13)*9);
    var doorIdx=Math.floor(rng(seed+i*17)*8);
    var yiIdx=Math.floor(rng(seed+i*23)*10);
    cells.push({god:baShen[godIdx],star:jiuXiao[starIdx],door:baMen[doorIdx]||'值符',yi:tianGan[yiIdx]});
  }
  var html='<div class="card"><h3 style="color:var(--accent);margin-bottom:12px">奇门遁甲盘</h3>';
  html+='<p style="font-size:.85rem;color:var(--text2);margin-bottom:12px">'+yinYang+'遁 第'+juNum+'局 | 年：'+tianGan[(year-4)%10]+diZhi[(year-4)%12]+' | 月：'+tianGan[(year-4)%10]+diZhi[(month+1)%12]+' 日：'+tianGan[(day)%10]+diZhi[(day)%12]+' 时：'+tianGan[(hour*2)%10]+diZhi[hour*2%12]+'</p>';
  html+='<table id="chart"><tr>';
  var order=[7,8,3,6,4,2,1,0,5];
  for(var r=0;r<3;r++){
    html+='<tr>';
    for(var c=0;c<3;c++){
      var idx=order[r*3+c];
      var cell=cells[idx];
      html+='<td><div class="cell-header">'+jiuGong[idx]+'</div>';
      html+='<div class="cell-main">';
      html+='<div class="cell-god">神：'+cell.god+'</div>';
      html+='<div class="cell-star">星：'+cell.star+'</div>';
      html+='<div class="cell-door">门：'+cell.door+'</div>';
      html+='<div class="cell-yi">仪：'+cell.yi+'</div>';
      html+='</div></td>';
    }
    html+='</tr>';
  }
  html+='</table></div>';
  html+='<div class="card"><h3 style="color:var(--accent);margin-bottom:12px">盘面解读</h3><div class="info-grid">';
  html+='<div class="info-item"><h4>天盘</h4><p>九星随天盘转动，代表天时。天蓬星值坎宫，天英星值离宫，各星所临宫位不同，吉凶有别。</p></div>';
  html+='<div class="info-item"><h4>地盘</h4><p>九宫固定不动，代表地利。八门、九星、八神依次排布其上，形成完整的奇门格局。</p></div>';
  html+='<div class="info-item"><h4>人盘</h4><p>八门主人事，代表人和。开门、休门、生门为吉门；死门、惊门、伤门为凶门；杜门、景门为中平。</p></div>';
  html+='<div class="info-item"><h4>神盘</h4><p>八神代表神秘力量。值符为最吉之神，腾蛇主虚惊，太阴主隐蔽，六合主和合，白虎主凶煞。</p></div>';
  html+='</div>';
  html+='<div class="info-item" style="margin-top:12px"><h4>综合判断</h4><p>'+getInterpretation(yinYang,juNum,cells)+'</p></div>';
  html+='</div>';
  document.getElementById('result').innerHTML=html;
}
function getInterpretation(yinYang,juNum,cells){
  var吉门=cells.filter(function(c){return['开门','休门','生门'].indexOf(c.door)>-1}).length;
  var凶门=cells.filter(function(c){return['死门','惊门','伤门'].indexOf(c.door)>-1}).length;
  var result=yinYang+'遁第'+juNum+'局。';
  if(吉门>凶门){result+='吉门较多（'+吉门+'吉/'+凶门+'凶），整体格局偏吉。宜积极行动，把握机遇。';}
  else if(吉门<凶门){result+='凶门较多（'+吉门+'吉/'+凶门+'凶），整体格局偏凶。宜谨慎行事，守成为上。';}
  else{result+='吉凶门数量相当（'+吉门+'吉/'+凶门+'凶），格局中平。宜稳中求进，不可冒进。';}
  result+='建议结合具体所问之事，参考值符、值使所临宫位综合判断。';
  return result;
}
initSelects();
</script></body></html>
