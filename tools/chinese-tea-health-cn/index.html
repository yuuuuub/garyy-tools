<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#22c55e;--accent2:#16a34a}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#16a34a;--accent2:#15803d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#051a0a 0%,#0a2a10 50%,#103a18 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #1a5a28;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#22c55e,#16a34a,#4ade80,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.tea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.tea-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.tea-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.tea-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.tea-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tea-card .t-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(34,197,94,0.15);color:var(--accent)}
.tea-card .t-name{font-size:1.3em;font-weight:bold}
.tea-card .t-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.tea-card .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tea-card .t-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.tea-card .t-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.tea-card .t-detail strong{color:var(--text)}
.tea-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.tea-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>💚 中国茶养生</h1>
<p>Chinese Tea Health Benefits — 茶为万病之药，养生第一饮品</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索茶养生...（如"绿茶抗氧化""冬季饮茶""茶疗"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="中医理论">🏥 中医理论</button>
<button class="filter-btn" data-filter="各茶功效">🍵 各茶功效</button>
<button class="filter-btn" data-filter="四季饮茶">🌿 四季饮茶</button>
<button class="filter-btn" data-filter="茶疗方剂">💊 茶疗方剂</button>
<button class="filter-btn" data-filter="饮茶禁忌">⚠️ 饮茶禁忌</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="tea-grid" id="teaGrid"></div>
<footer><p>💚 中国茶养生 — 茶为万病之药，养生第一饮品</p></footer>
</div>
<script>
const TEA_DATA=[
  {id:1,name:"茶为万病之药",en:"Tea as Universal Medicine",category:"中医理论",icon:"🏥",summary:"茶的医学地位",detail:"唐代陈藏器《本草拾遗》提出'茶为万病之药'。中医认为茶味苦甘性凉，入心、肺、胃经。具有清热降火、消食化痰、利尿解毒、醒脑提神等功效。茶是中医养生的重要组成部分。",origin:"唐代《本草拾遗》",usage:"中医养生的基础理论"},
  {id:2,name:"茶性与体质",en:"Tea Nature and Body Constitution",category:"中医理论",icon:"🫀",summary:"因人择茶",detail:"中医将人的体质分为九种，不同体质适合不同茶类。热性体质宜喝绿茶、白茶（性凉）；寒性体质宜喝红茶、熟普（性温）；平和体质各类茶均可。选对茶才能养生。",origin:"中医体质学",usage:"个人选茶的理论指导"},
  {id:3,name:"茶的四气五味",en:"Four Natures and Five Flavors",category:"中医理论",icon:"☯️",summary:"茶的中医属性",detail:"茶的四气：寒、凉、温、平。绿茶性寒，白茶性凉，黄茶性凉，乌龙茶性平，红茶性温，黑茶性温。五味：苦、甘、酸、辛、咸。茶以苦甘为主，苦能泻火，甘能补益。",origin:"中医基础理论",usage:"茶性分类的中医依据"},
  {id:4,name:"绿茶功效",en:"Green Tea Benefits",category:"各茶功效",icon:"🍃",summary:"抗氧化之王",detail:"绿茶保留了最多的天然物质，茶多酚含量最高。功效：抗氧化（延缓衰老）、降血脂（预防心血管疾病）、抗菌消炎、提神醒脑、降血压。日本研究显示每天喝4杯绿茶可降低死亡风险。",origin:"现代医学研究",usage:"日常保健的首选茶类"},
  {id:5,name:"红茶功效",en:"Black Tea Benefits",category:"各茶功效",icon:"🫖",summary:"暖胃养胃",detail:"红茶经全发酵，茶多酚氧化减少，对胃的刺激小。功效：暖胃养胃、促进消化、降血糖、抗氧化、抗炎。红茶性温，适合胃寒和体质虚寒的人饮用。冬天喝红茶尤其适宜。",origin:"中医与现代研究",usage:"胃寒人群和冬季养生的推荐"},
  {id:6,name:"乌龙茶功效",en:"Oolong Tea Benefits",category:"各茶功效",icon:"🍵",summary:"减肥降脂",detail:"乌龙茶半发酵，兼具绿茶和红茶的优点。功效：促进脂肪分解（减肥）、降低胆固醇、抗衰老、美容养颜。饭后喝乌龙茶可解油腻，是'减肥茶'的天然选择。",origin:"现代研究",usage:"减肥和美容养生的推荐"},
  {id:7,name:"白茶功效",en:"White Tea Benefits",category:"各茶功效",icon:"🤍",summary:"清热解毒",detail:"白茶加工最简，保留了最多的天然成分。功效：清热解毒、降火消炎、美容养颜、抗病毒。老白茶还有润肺止咳的功效。白茶'一年茶、三年药、七年宝'，越陈越有药用价值。",origin:"传统中医",usage:"春夏清热和秋冬润肺的养生"},
  {id:8,name:"黑茶功效",en:"Dark Tea Benefits",category:"各茶功效",icon:"⬛",summary:"消食化滞",detail:"黑茶后发酵，含有丰富的益生菌。功效：消食化滞、降脂减肥、暖胃养胃、调节肠道菌群。普洱熟茶和安化黑茶是黑茶的代表。适合饮食油腻的人饮用。",origin:"中医与微生物学",usage:"消化不良和高血脂人群的推荐"},
  {id:9,name:"春季饮茶",en:"Spring Tea Drinking",category:"四季饮茶",icon:"🌸",summary:"春季宜饮花茶",detail:"春季万物复苏，人体阳气生发。宜饮花茶（茉莉花茶、玫瑰花茶）以散发冬季积存的寒气。也可饮绿茶，帮助肝脏疏泄。春季不宜饮太浓的茶，以免耗散阳气。",origin:"中医四季养生",usage:"春季养生的饮茶指南"},
  {id:10,name:"夏季饮茶",en:"Summer Tea Drinking",category:"四季饮茶",icon:"☀️",summary:"夏季宜饮绿茶",detail:"夏季炎热，人体出汗多。宜饮绿茶（龙井、碧螺春）以清热解暑、生津止渴。菊花茶、薄荷茶也是夏季佳品。不宜饮太烫的茶，冰镇绿茶可适量饮用但不宜过多。",origin:"中医四季养生",usage:"夏季消暑的饮茶指南"},
  {id:11,name:"秋季饮茶",en:"Autumn Tea Drinking",category:"四季饮茶",icon:"🍂",summary:"秋季宜饮乌龙茶",detail:"秋季干燥，人体需要滋润。乌龙茶不寒不热，性平和，适合秋季饮用。青茶（铁观音、大红袍）可润肤益肺、生津润喉。也可饮菊花茶以清肝明目。",origin:"中医四季养生",usage:"秋季润燥的饮茶指南"},
  {id:12,name:"冬季饮茶",en:"Winter Tea Drinking",category:"四季饮茶",icon:"❄️",summary:"冬季宜饮红茶熟普",detail:"冬季寒冷，人体需要保暖。宜饮红茶、熟普、黑茶等温性茶以驱寒暖胃。也可饮姜茶、桂圆茶等调味茶。冬季饮茶宜温热，不宜过烫，以免损伤食道。",origin:"中医四季养生",usage:"冬季保暖的饮茶指南"},
  {id:13,name:"绿茶蜂蜜茶",en:"Green Tea with Honey",category:"茶疗方剂",icon:"🍯",summary:"清热润肠",detail:"材料：绿茶3克，蜂蜜15毫升。做法：绿茶冲泡后待温，加入蜂蜜搅匀。功效：清热解毒、润肠通便、美容养颜。适合便秘和皮肤干燥者。注意水温不能太高，会破坏蜂蜜营养。",origin:"民间茶疗",usage:"日常保健的简单茶方"},
  {id:14,name:"红枣姜茶",en:"Red Date Ginger Tea",category:"茶疗方剂",icon:"🫚",summary:"温中散寒",detail:"材料：红茶5克，红枣5颗，生姜3片。做法：一起煮沸10分钟，加红糖调味。功效：温中散寒、暖胃止痛、补气养血。适合胃寒痛经、手脚冰凉者。冬季饮用尤佳。",origin:"民间茶疗",usage:"冬季和女性养生的暖身茶"},
  {id:15,name:"菊花枸杞茶",en:"Chrysanthemum Goji Tea",category:"茶疗方剂",icon:"🌼",summary:"清肝明目",detail:"材料：菊花5朵，枸杞10粒。做法：沸水冲泡5分钟。功效：清肝明目、滋补肝肾、降压降脂。适合用眼过度、眼睛干涩、高血压人群。长期饮用效果显著。",origin:"中医养生方",usage:"办公族和老年人的护眼茶"},
  {id:16,name:"普洱消脂茶",en:"Pu'er Fat-Reducing Tea",category:"茶疗方剂",icon:"🍵",summary:"消脂减肥",detail:"材料：普洱熟茶5克，山楂3片。做法：沸水冲泡，饭后半小时饮用。功效：消食化滞、降脂减肥、调理肠胃。适合饮食油腻、需要减肥的人群。坚持饮用效果明显。",origin:"中医食疗",usage:"减肥和消化调理的茶疗方"},
  {id:17,name:"空腹不饮茶",en:"Don't Drink Tea on Empty Stomach",category:"饮茶禁忌",icon:"🚫",summary:"空腹饮茶的危害",detail:"空腹饮茶会稀释胃液，降低消化功能。茶中的鞣酸会与食物中的蛋白质结合，影响吸收。空腹喝浓茶还会引起心慌、头晕等'茶醉'现象。建议饭后半小时再饮茶。",origin:"中医养生常识",usage:"日常饮茶的基本禁忌"},
  {id:18,name:"睡前不饮浓茶",en:"No Strong Tea Before Bed",category:"饮茶禁忌",icon:"🌙",summary:"饮茶时间的讲究",detail:"茶叶含咖啡因，有提神作用。睡前2小时内不宜饮浓茶，否则会影响睡眠质量。如果想晚上喝茶，可以选择低咖啡因的茶类（如熟普、红茶），且泡淡一些。",origin:"现代医学",usage:"保证睡眠质量的饮茶建议"},
  {id:19,name:"孕妇饮茶注意",en:"Pregnancy Tea Precautions",category:"饮茶禁忌",icon:"🤰",summary:"孕期饮茶需谨慎",detail:"孕妇可以适量饮淡茶，但不宜饮浓茶。浓茶中的咖啡因和鞣酸会影响胎儿发育和铁的吸收。建议选择低咖啡因的茶类，如淡绿茶或花草茶，每天不超过2杯。",origin:"医学建议",usage:"孕妇饮茶的安全指南"},
  {id:20,name:"茶水不送药",en:"Tea Water Shouldn't Send Medicine",category:"饮茶禁忌",icon:"💊",summary:"茶与药物的冲突",detail:"茶中的鞣酸和咖啡因可能与多种药物发生反应，影响药效。服药前后2小时内不宜饮茶。特别是铁剂、抗生素、镇静剂等药物。最好用白开水送服药物。",origin:"药学常识",usage:"服药期间的饮茶注意事项"},
  {id:21,name:"茶多酚的科学",en:"Science of Tea Polyphenols",category:"中医理论",icon:"🔬",summary:"茶的活性成分",detail:"茶多酚是茶叶中最重要的活性物质，占茶叶干重的18%-36%。主要包括儿茶素、黄酮类等。具有抗氧化、抗炎、抗癌、降血脂等多种生物活性。绿茶中含量最高，发酵茶中含量较低。",origin:"现代科学研究",usage:"茶叶保健功效的科学基础"}
];
function renderCards(data){
  document.getElementById('teaGrid').innerHTML=data.map(t=>`
    <div class="tea-card" data-category="${t.category}">
      <div class="t-header"><div class="t-icon">${t.icon}</div><div><div class="t-name">${t.name}</div><div class="t-sub">${t.en}</div></div></div>
      <div class="t-meta"><span>${t.summary}</span><span>${t.category}</span></div>
      <div class="t-detail">${t.detail}</div>
      <div class="t-detail"><strong>来源：</strong>${t.origin}</div>
      <div class="t-detail"><strong>应用：</strong>${t.usage}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(t=>{cats[t.category]=(cats[t.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">养生知识</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(TEA_DATA);renderStats(TEA_DATA);
</script>
</body>
</html>
