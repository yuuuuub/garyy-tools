--accent-light: #ff6b5a;
--gold: #daa520;
--gold-light: #f0c040;
--border: #4a3f32;
--border-light: #3a3228;
--shadow: rgba(0,0,0,0.3);
--char-bg: #2a241d;
--char-hover: #342d24;
--tag-bg: #3a3228;
--tag-text: #a89880;
--unknown-bg: #3a1a16;
--unknown-text: #ff6b5a;
--scrollbar-bg: #1a1612;

* { margin: 0; padding: 0; box-sizing: border-box; }
body {font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
transition: background .3s, color .3s;
display: flex; flex-direction: column; align-items: center;
-webkit-font-smoothing: antialiased}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--scrollbar-bg); }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
.header {width: 100%; max-width: 720px; padding: 28px 20px 0; text-align: center}
.header h1 {font-size: 2rem; font-weight: 700; letter-spacing: .08em;
background: linear-gradient(135deg, var(--accent), var(--gold));
-webkit-background-clip: text; -webkit-text-fill-color: transparent;
background-clip: text}
.header .subtitle {font-size: .85rem; color: var(--text-secondary); margin-top: 6px;
letter-spacing: .04em}
.theme-toggle {position: fixed; top: 16px; right: 16px; z-index: 100;
width: 40px; height: 40px; border-radius: 50%;
border: 1px solid var(--border); background: var(--bg-card);
cursor: pointer; font-size: 1.2rem; display: flex;
align-items: center; justify-content: center;
transition: all .3s; color: var(--text);
box-shadow: 0 2px 8px var(--shadow)}
.theme-toggle:hover { transform: scale(1.1); border-color: var(--gold); }
.main { width: 100%; max-width: 720px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
.input-section {background: var(--bg-card); border-radius: 16px; padding: 24px;
border: 1px solid var(--border); box-shadow: 0 4px 16px var(--shadow)}
.input-label {font-size: .95rem; font-weight: 600; color: var(--text);
margin-bottom: 10px; display: block; letter-spacing: .04em}
.input-row {display: flex; gap: 10px; align-items: stretch}
#nameInput {flex: 1; padding: 12px 16px; border-radius: 10px;
border: 2px solid var(--border); background: var(--bg-input);
color: var(--text); font-size: 1.2rem; outline: none;
transition: border-color .3s; font-family: inherit;
letter-spacing: .08em}
#nameInput:focus { border-color: var(--accent); }
#nameInput::placeholder { color: var(--text-secondary); letter-spacing: .04em; }
#analyzeBtn {padding: 12px 24px; border-radius: 10px; border: none;
background: var(--accent); color: #fff; font-size: 1rem;
cursor: pointer; font-weight: 600; letter-spacing: .06em;
transition: all .3s; white-space: nowrap;
font-family: inherit}
#analyzeBtn:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(192,57,43,.3); }
#analyzeBtn:active { transform: translateY(0); }
.result-section { display: none; flex-direction: column; gap: 16px; }
.result-section.active { display: flex; }
.total-card {background: var(--bg-card); border-radius: 16px; padding: 24px;
border: 1px solid var(--border); box-shadow: 0 4px 16px var(--shadow);
text-align: center}
.total-label { font-size: .85rem; color: var(--text-secondary); letter-spacing: .06em; }
.total-number {font-size: 3.5rem; font-weight: 900;
background: linear-gradient(135deg, var(--accent), var(--gold));
-webkit-background-clip: text; -webkit-text-fill-color: transparent;
background-clip: text; line-height: 1.2}
.total-unit { font-size: .9rem; color: var(--text-secondary); }
.char-list { display: flex; flex-direction: column; gap: 12px; }
.char-card {background: var(--char-bg); border-radius: 12px; padding: 16px 20px;
border: 1px solid var(--border-light); display: flex;
align-items: center; gap: 16px; transition: all .3s;
box-shadow: 0 2px 8px var(--shadow)}
.char-card:hover { background: var(--char-hover); transform: translateX(4px); }
.char-card.unknown { background: var(--unknown-bg); border-color: var(--unknown-text); }
.char-glyph {font-size: 2.8rem; font-weight: 700; min-width: 56px; text-align: center;

.char-card.unknown .char-glyph { color: var(--unknown-text); }
.char-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.char-info .char-name { font-size: .8rem; color: var(--text-secondary); }
.char-info .char-detail { font-size: .85rem; color: var(--text); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.char-strokes {font-size: 1.4rem; font-weight: 700; color: var(--gold);

.char-card.unknown .char-strokes { color: var(--unknown-text); }

.tag.warning { background: var(--unknown-bg); color: var(--unknown-text); }

.fortune-card::before {content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;

.fortune-icon { font-size: 2.5rem; margin-bottom: 8px; }
.fortune-title { font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-bottom: 6px; letter-spacing: .06em; }
.fortune-text { font-size: .9rem; color: var(--text-secondary); line-height: 1.6; letter-spacing: .04em; }

.fortune-level.daji { background: #fde8e8; color: #c0392b; }
.fortune-level.ping { background: #e8f0e8; color: #4a6741; }

[data-theme="dark"] .fortune-level.daji { background: #3a1a16; color: #ff6b5a; }

.empty-state .icon { font-size: 4rem; margin-bottom: 12px; opacity: .6; }
.empty-state p { font-size: .9rem; letter-spacing: .04em; }

.footer {text-align: center; padding: 20px; color: var(--text-secondary);

.total-number { font-size: 2.8rem; }
.input-row { flex-direction: column; }
#analyzeBtn { width: 100%; }}

.char-card:nth-child(3) { animation-delay: .15s; }

function detectRadical(char) {

function estimateStrokes(char) {

function analyze() {

  chars.forEach(ch => {
    if (ch.match(/[\u3400-\u9FFF\uF900-\uFAFF\u4E00-\u9FFF\u{20000}-\u{2A6DF}]/u)) {
      chineseChars.push(ch);
    } else if (ch.trim()) {

  const unknownCount = charInfos.filter(c => !c.known && !c.isNotChinese).length;
  const estimatedCount = charInfos.filter(c => c.estimated).length;
