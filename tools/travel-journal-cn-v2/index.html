<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行日记 v2</title>
<meta property="og:title" content="旅行日记 v2">
<meta property="og:description" content="记录旅途中的精彩瞬间与回忆">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="旅行日记工具，记录旅途中的见闻和感受">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📔</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:16px;min-height:100vh;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text);margin-right:4px;margin-bottom:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.gr .st{text-align:center;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mood-btn{width:40px;height:40px;font-size:1.4rem;background:var(--bg);border:2px solid var(--border);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mood-btn:hover,.mood-btn.sel{border-color:var(--accent);background:var(--accent);transform:scale(1.1)}
.weather-btn{width:40px;height:40px;font-size:1.4rem;background:var(--bg);border:2px solid var(--border);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.weather-btn:hover,.weather-btn.sel{border-color:var(--accent);background:var(--accent);transform:scale(1.1)}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1}
.card-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);transition:transform .15s}
.card-item:hover{transform:translateY(-2px)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-title{font-size:1.1rem;font-weight:600}
.card-date{font-size:.8rem;color:var(--text2)}
.card-body{font-size:.9rem;color:var(--text2);margin-bottom:8px;white-space:pre-wrap}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.card-actions{display:flex;gap:8px}
.hidden{display:none}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filter-btn{padding:4px 12px;border-radius:16px;font-size:.8rem;background:var(--bg);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s}
.filter-btn:hover,.filter-btn.active{background:var(--accent);color:var(--text);border-color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📔 旅行日记 v2</h1><p>记录旅途中的精彩瞬间与回忆</p></div>

<div class="gr" id="stats"></div>

<div class="cd"><h2>📝 添加日记</h2>
<input type="hidden" id="editIdx" value="-1">
<label>标题</label><input type="text" id="title" placeholder="日记标题">
<label>目的地</label><input type="text" id="dest" placeholder="目的地城市/景点">
<div class="fr">
<div><label>日期</label><input type="date" id="date"></div>
<div><label>天气</label>
<div style="display:flex;gap:6px;margin-top:4px" id="weatherPicker">
<button class="weather-btn" data-w="☀️ 晴" onclick="pickWeather(this)">☀️</button>
<button class="weather-btn" data-w="☁️ 多云" onclick="pickWeather(this)">☁️</button>
<button class="weather-btn" data-w="🌧️ 雨" onclick="pickWeather(this)">🌧️</button>
<button class="weather-btn" data-w="❄️ 雪" onclick="pickWeather(this)">❄️</button>
<button class="weather-btn" data-w="🌬️ 风" onclick="pickWeather(this)">🌬️</button>
</div></div>
</div>
<label>心情</label>
<div style="display:flex;gap:6px;margin-top:4px" id="moodPicker">
<button class="mood-btn" data-m="😊 开心" onclick="pickMood(this)">😊</button>
<button class="mood-btn" data-m="🤩 兴奋" onclick="pickMood(this)">🤩</button>
<button class="mood-btn" data-m="😌 平静" onclick="pickMood(this)">😌</button>
<button class="mood-btn" data-m="😴 疲惫" onclick="pickMood(this)">😴</button>
<button class="mood-btn" data-m="😢 低落" onclick="pickMood(this)">😢</button>
</div>
<label>标签（逗号分隔）</label><input type="text" id="tags" placeholder="美食,古迹,购物">
<label>图片链接</label><input type="text" id="photo" placeholder="图片URL（可选）">
<label>日记内容</label><textarea id="content" placeholder="记录今天的旅程..." style="min-height:120px"></textarea>
<div class="bg">
<button onclick="saveEntry()" id="saveBtn">💾 保存日记</button>
<button class="sec" onclick="resetForm()">🔄 重置</button>
</div></div>

<div class="cd">
<h2>📖 日记列表</h2>
<div class="search-bar">
<input type="text" id="searchInput" placeholder="🔍 搜索日记..." oninput="renderList()">
</div>
<div class="filter-bar" id="filterBar"></div>
<div id="listContainer" class="es">暂无日记</div>
</div>

<div class="cd">
<h2>📤 数据管理</h2>
<div class="bg">
<button class="sec" onclick="exportData()">📥 导出JSON</button>
<button class="sec" onclick="document.getElementById('importFile').click()">📂 导入数据</button>
<input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
<button class="dng" onclick="clearAll()">🗑️ 清空全部</button>
</div></div>
</div>

<script>
let entries=JSON.parse(localStorage.getItem('travel_journal_v2')||'[]');
let selectedWeather='',selectedMood='';

function $(id){return document.getElementById(id)}
function pickWeather(btn){
  document.querySelectorAll('.weather-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');selectedWeather=btn.dataset.w;
}
function pickMood(btn){
  document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');selectedMood=btn.dataset.m;
}
function saveEntry(){
  const title=$('title').value.trim(),dest=$('dest').value.trim(),date=$('date').value;
  const content=$('content').value.trim(),tags=$('tags').value.trim(),photo=$('photo').value.trim();
  if(!title||!dest){alert('请填写标题和目的地');return;}
  const entry={title,dest,date:date||new Date().toISOString().slice(0,10),weather:selectedWeather,mood:selectedMood,tags:tags?tags.split(',').map(t=>t.trim()):[],photo,content,createdAt:new Date().toISOString()};
  const idx=parseInt($('editIdx').value);
  if(idx>=0){entries[idx]={...entries[idx],...entry};}
  else{entries.push(entry);}
  localStorage.setItem('travel_journal_v2',JSON.stringify(entries));
  resetForm();renderList();updateStats();
}
function resetForm(){
  $('title').value='';$('dest').value='';$('date').value='';$('content').value='';
  $('tags').value='';$('photo').value='';$('editIdx').value='-1';
  $('saveBtn').textContent='💾 保存日记';
  selectedWeather='';selectedMood='';
  document.querySelectorAll('.weather-btn,.mood-btn').forEach(b=>b.classList.remove('sel'));
}
function editEntry(i){
  const e=entries[i];$('title').value=e.title;$('dest').value=e.dest;$('date').value=e.date;
  $('content').value=e.content;$('tags').value=(e.tags||[]).join(', ');
  $('photo').value=e.photo||'';$('editIdx').value=i;$('saveBtn').textContent='✏️ 更新日记';
  if(e.weather){selectedWeather=e.weather;document.querySelectorAll('.weather-btn').forEach(b=>{b.classList.toggle('sel',b.dataset.w===e.weather)});}
  if(e.mood){selectedMood=e.mood;document.querySelectorAll('.mood-btn').forEach(b=>{b.classList.toggle('sel',b.dataset.m===e.mood)});}
  window.scrollTo({top:0,behavior:'smooth'});
}
function deleteEntry(i){if(confirm('确定删除这条日记？')){entries.splice(i,1);localStorage.setItem('travel_journal_v2',JSON.stringify(entries));renderList();updateStats();}}
function renderList(){
  const q=($('searchInput').value||'').toLowerCase();
  const allTags=[...new Set(entries.flatMap(e=>e.tags||[]))];
  renderFilters(allTags);
  let filtered=entries.filter(e=>{
    if(q&&!e.title.toLowerCase().includes(q)&&!e.dest.toLowerCase().includes(q)&&!(e.content||'').toLowerCase().includes(q))return false;
    const activeFilter=document.querySelector('.filter-btn.active');
    if(activeFilter&&activeFilter.dataset.tag!=='all'&&!((e.tags||[]).includes(activeFilter.dataset.tag)))return false;
    return true;
  }).reverse();
  if(!filtered.length){$('listContainer').innerHTML='<div class="es">暂无日记</div>';return;}
  $('listContainer').innerHTML=filtered.map((e,i)=>{
    const origIdx=entries.indexOf(e);
    const img=e.photo?`<img src="${e.photo}" style="width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-bottom:8px">`:'';
    return `<div class="card-item">
      <div class="card-head"><span class="card-title">${e.weather||''} ${e.title}</span><span class="card-date">${e.date}</span></div>
      <div class="card-tags">${e.mood?`<span class="tag">${e.mood}</span>`:''}${e.dest?`<span class="tag s">${e.dest}</span>`:''}
      ${(e.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      ${img}
      <div class="card-body">${e.content||'无内容'}</div>
      <div class="card-actions">
        <button class="sec" style="padding:4px 12px;font-size:.8rem" onclick="editEntry(${origIdx})">✏️ 编辑</button>
        <button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="deleteEntry(${origIdx})">🗑️ 删除</button>
      </div></div>`;
  }).join('');
}
function renderFilters(tags){
  const bar=$('filterBar');
  if(!tags.length){bar.innerHTML='';return;}
  bar.innerHTML=`<button class="filter-btn active" data-tag="all" onclick="setFilter(this)">全部</button>`+
    tags.map(t=>`<button class="filter-btn" data-tag="${t}" onclick="setFilter(this)">${t}</button>`).join('');
}
function setFilter(btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');renderList();
}
function updateStats(){
  const total=entries.length;
  const countries=new Set(entries.map(e=>e.dest)).size;
  const tags=new Set(entries.flatMap(e=>e.tags||[])).size;
  $('stats').innerHTML=`
    <div class="st"><div class="nm">${total}</div><div class="lb">日记总数</div></div>
    <div class="st"><div class="nm">${countries}</div><div class="lb">去过地方</div></div>
    <div class="st"><div class="nm">${tags}</div><div class="lb">标签分类</div></div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='旅行日记v2.json';a.click();
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{const data=JSON.parse(ev.target.result);if(Array.isArray(data)){entries=data;localStorage.setItem('travel_journal_v2',JSON.stringify(entries));renderList();updateStats();alert('导入成功！');}else alert('无效数据格式');}
    catch(err){alert('文件解析失败');}
  };reader.readAsText(file);
}
function clearAll(){if(confirm('确定清空所有日记？此操作不可恢复！')){entries=[];localStorage.removeItem('travel_journal_v2');renderList();updateStats();}}
$('date').value=new Date().toISOString().slice(0,10);
renderList();updateStats();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
