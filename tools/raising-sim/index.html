<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>养成游戏 - 我的小宝贝</title>
    <meta name="description" content="养成模拟游戏，照顾培养你的虚拟宝贝成长">
    <style>
:root {--bg: #0d1117;
--card: #161b22;
--border: #30363d;
--text: #e6edf3;
--accent: #3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
* {margin: 0;
padding: 0;
box-sizing: border-box}
body {font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20pxscroll-behavior:smooth;}
.game-container {max-width: 600px;
width: 100%;
background: var(--card);
border: 1px solid var(--border);
border-radius: 12px;
overflow: hidden}
.game-header {background: linear-gradient(135deg, #22c55e, #16a34a);
padding: 15px 20px;
display: flex;
justify-content: space-between;
align-items: center}
.game-header h1 {font-size: 1.3rem}
.day-info {font-size: 0.9rem;
background: rgba(255,255,255,0.2);
padding: 5px 12px;
border-radius: 15px}
.pet-area {position: relative;
height: 250px;
background: linear-gradient(180deg, #87ceeb, #90ee90);
display: flex;
justify-content: center;
align-items: center}
.pet {position: relative;
cursor: pointer;
transition: transform 0.2s}
.pet:hover {transform: scale(1.05)}
.pet-body {width: 150px;
height: 120px;
background: linear-gradient(180deg, #fbbf24, #f59e0b);
border-radius: 50% 50% 45% 45%;
position: relative}
.pet-ear {position: absolute;
width: 35px;
height: 50px;
background: linear-gradient(180deg, #fbbf24, #f59e0b);
border-radius: 50% 50% 30% 30%}
.ear-left {top: -25px;
left: 15px;
transform: rotate(-15deg)}
.ear-right {top: -25px;
right: 15px;
transform: rotate(15deg)}
.pet-face {position: absolute;
top: 30px;
left: 50%;
transform: translateX(-50%);
width: 100px;
height: 60px}
.pet-eyes {position: absolute;
top: 10px;
left: 50%;
transform: translateX(-50%);
display: flex;
gap: 30px}
.eye {width: 20px;
height: 20px;
background: var(--bg);
border-radius: 50%;
position: relative}
.eye::after {content: '';
position: absolute;
top: 4px;
right: 4px;
width: 7px;
height: 7px;
background: white;
border-radius: 50%}
.eye.happy {height: 10px;
border-radius: 0 0 15px 15px}
.eye.sad {height: 15px;
border-radius: 50% 50% 0 0}
.eye.sleepy {height: 5px;
border-radius: 0}
.pet-nose {position: absolute;
top: 35px;
left: 50%;
transform: translateX(-50%);
width: 15px;
height: 10px;
background: #c2410c;
border-radius: 50%}
.pet-mouth {position: absolute;
top: 50px;
left: 50%;
transform: translateX(-50%);
width: 25px;
height: 12px;
border: 3px solid #92400e;
border-top: none;
border-radius: 0 0 20px 20px}
.mouth-happy {border-color: #92400e}
.mouth-sad {border-radius: 20px 20px 0 0;
border: 3px solid #92400e;
border-bottom: none;
top: 48px}
.pet-paws {position: absolute;
bottom: -15px;
left: 50%;
transform: translateX(-50%);
display: flex;
gap: 40px}
.paw {width: 30px;
height: 20px;
background: #f59e0b;
border-radius: 0 0 50% 50%}
.pet-name {position: absolute;
bottom: -40px;
left: 50%;
transform: translateX(-50%);
font-size: 1.1rem;
font-weight: bold;
white-space: nowrap}
.pet-mood {position: absolute;
top: 20px;
right: 20px;
font-size: 2rem}
.status-area {padding: 20px}
.status-grid {display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 15px;
margin-bottom: 20px}
.status-item {text-align: center}
.status-icon {font-size: 1.5rem;
margin-bottom: 5px}
.status-bar {height: 8px;
background: rgba(255,255,255,0.2);
border-radius: 4px;
overflow: hidden;
margin-bottom: 5px}
.status-fill {height: 100%;
border-radius: 4px;
transition: width 0.3s}
.fill-hunger { background: #f97316; }
.fill-happy { background: #ec4899; }
.fill-clean { background: #3b82f6; }
.fill-energy { background: #22c55e; }
.status-label {font-size: 0.8rem;
opacity: 0.8}
.action-grid {display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 10px}
.action-btn {padding: 15px;
border: 1px solid var(--border);
background: var(--bg);
color: var(--text);
border-radius: 10px;
cursor: pointer;
display: flex;
flex-direction: column;
align-items: center;
gap: 8px;
transition: all 0.3s}
.action-btn:hover:not(:disabled) {border-color: var(--accent);
background: rgba(59, 130, 246, 0.1);
transform: translateY(-2px)}
.action-btn:disabled {opacity: 0.5;
cursor: not-allowed}
.action-icon {font-size: 1.8rem}
.action-text {font-size: 0.9rem}
.action-cost {font-size: 0.75rem;
opacity: 0.6}
.day-controls {display: flex;
gap: 10px;
margin-top: 15px}
.control-btn {flex: 1;
padding: 12px;
border: none;
border-radius: 8px;
cursor: pointer;
font-size: 1rem;
font-weight: bold;
transition: transform 0.2s}
.control-btn:hover {transform: scale(1.02)}
.sleep-btn {background: #6366f1;
color: white}
.next-btn {background: #22c55e;
color: white}
.message {position: fixed;
top: 20px;
left: 50%;
transform: translateX(-50%);
background: var(--card);
border: 1px solid var(--accent);
padding: 12px 24px;
border-radius: 8px;
opacity: 0;
transition: opacity 0.3s;
z-index: 100}
.message.show {opacity: 1}
.ending-overlay {position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: rgba(0,0,0,0.9);
display: flex;
justify-content: center;
align-items: center;
z-index: 100}
.ending-content {text-align: center;
padding: 40px;
max-width: 500px}
.ending-content h2 {font-size: 1.8rem;
margin-bottom: 20px}
.ending-content p {font-size: 1rem;
line-height: 1.8;
margin-bottom: 20px}
.restart-btn {padding: 12px 30px;
background: var(--accent);
border: none;
color: white;
border-radius: 8px;
cursor: pointer;
font-size: 1rem}
.hidden { display: none !important; }
@keyframes bounce {0%, 100% { transform: translateY(0); }
50% { transform: translateY(-10px); }}
.pet.bounce {animation: bounce 0.5s}
@keyframes shake {0%, 100% { transform: translateX(0); }
25% { transform: translateX(-5px); }
75% { transform: translateX(5px); }}
.pet.shake {animation: shake 0.5s}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="养成游戏 - 我的小宝贝">
  <meta property="og:description" content="养成模拟游戏，照顾培养你的虚拟宝贝成长">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/raising-sim/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
    <div class="message" id="message"></div>

    <div class="game-container">
        <div class="game-header">
            <h1>我的小宝贝</h1>
            <span class="day-info" id="day-info">第 1 天</span>
        </div>

        <div class="pet-area">
            <div class="pet" id="pet" onclick="petPet()">
                <div class="pet-body">
                    <div class="pet-ear ear-left"></div>
                    <div class="pet-ear ear-right"></div>
                    <div class="pet-face">
                        <div class="pet-eyes">
                            <div class="eye" id="eye-left"></div>
                            <div class="eye" id="eye-right"></div>
                        </div>
                        <div class="pet-nose"></div>
                        <div class="pet-mouth" id="pet-mouth"></div>
                    </div>
                    <div class="pet-paws">
                        <div class="paw"></div>
                        <div class="paw"></div>
                    </div>
                </div>
                <div class="pet-name">小可爱</div>
            </div>
            <div class="pet-mood" id="pet-mood">😊</div>
        </div>

        <div class="status-area">
            <div class="status-grid">
                <div class="status-item">
                    <div class="status-icon">🍖</div>
                    <div class="status-bar"><div class="status-fill fill-hunger" id="hunger-bar"></div></div>
                    <div class="status-label">饱食度: <span id="hunger-val">70</span></div>
                </div>
                <div class="status-item">
                    <div class="status-icon">❤️</div>
                    <div class="status-bar"><div class="status-fill fill-happy" id="happy-bar"></div></div>
                    <div class="status-label">心情: <span id="happy-val">60</span></div>
                </div>
                <div class="status-item">
                    <div class="status-icon">✨</div>
                    <div class="status-bar"><div class="status-fill fill-clean" id="clean-bar"></div></div>
                    <div class="status-label">清洁: <span id="clean-val">80</span></div>
                </div>
            </div>

            <div class="action-grid">
                <button class="action-btn" onclick="doAction('feed')">
                    <span class="action-icon">🍖</span>
                    <span class="action-text">喂食</span>
                    <span class="action-cost">-10 体力</span>
                </button>
                <button class="action-btn" onclick="doAction('play')">
                    <span class="action-icon">🎾</span>
                    <span class="action-text">玩耍</span>
                    <span class="action-cost">-15 体力</span>
                </button>
                <button class="action-btn" onclick="doAction('wash')">
                    <span class="action-icon">🛁</span>
                    <span class="action-text">洗澡</span>
                    <span class="action-cost">-20 体力</span>
                </button>
                <button class="action-btn" onclick="doAction('train')">
                    <span class="action-icon">🎯</span>
                    <span class="action-text">训练</span>
                    <span class="action-cost">-25 体力</span>
                </button>
            </div>

            <div class="day-controls">
                <button class="control-btn sleep-btn" onclick="sleep()">😴 睡觉恢复</button>
                <button class="control-btn next-btn" onclick="nextDay()">📅 下一天</button>
            </div>
        </div>
    </div>

    <div class="ending-overlay hidden" id="ending-overlay">
        <div class="ending-content" id="ending-content"></div>
    </div>

    <script>
        const pet = {
            hunger: 70,
            happy: 60,
            clean: 80,
            energy: 100,
            day: 1,
            intelligence: 0,
            strength: 0
        };
        function updateUI() {
            document.getElementById('hunger-bar').style.width = pet.hunger + '%';
            document.getElementById('hunger-val').textContent = Math.round(pet.hunger);
            document.getElementById('happy-bar').style.width = pet.happy + '%';
            document.getElementById('happy-val').textContent = Math.round(pet.happy);
            document.getElementById('clean-bar').style.width = pet.clean + '%';
            document.getElementById('clean-val').textContent = Math.round(pet.clean);
            document.getElementById('day-info').textContent = `第 ${pet.day} 天`;
            const eyeLeft = document.getElementById('eye-left');
            const eyeRight = document.getElementById('eye-right');
            const mouth = document.getElementById('pet-mouth');
            const mood = document.getElementById('pet-mood');
            eyeLeft.className = 'eye';
            eyeRight.className = 'eye';
            mouth.className = 'pet-mouth';
            if (pet.happy >= 70) {
                eyeLeft.classList.add('happy');
                eyeRight.classList.add('happy');
                mood.textContent = '😊';
            } else if (pet.happy <= 30) {
                eyeLeft.classList.add('sad');
                eyeRight.classList.add('sad');
                mouth.classList.add('mouth-sad');
                mood.textContent = '😢';
            } else if (pet.energy <= 20) {
                eyeLeft.classList.add('sleepy');
                eyeRight.classList.add('sleepy');
                mood.textContent = '😴';
            } else {
                mood.textContent = '😐';
            }
            if (pet.hunger <= 20) {
                mood.textContent = '😰';
            }
        }
        function showMessage(text) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 2000);
        }
        function animatePet(type) {
            const petEl = document.getElementById('pet');
            petEl.classList.remove('bounce', 'shake');
            void petEl.offsetWidth;
            petEl.classList.add(type);
        }
        function doAction(action) {
            let message = '';
            switch (action) {
                case 'feed':
                    if (pet.energy < 10) {
                        showMessage('体力不足！请先休息');
                        return;
                    }
                    pet.hunger = Math.min(100, pet.hunger + 25);
                    pet.energy -= 10;
                    pet.happy += 5;
                    message = '吃得真开心！';
                    animatePet('bounce');
                    break;
                case 'play':
                    if (pet.energy < 15) {
                        showMessage('体力不足！请先休息');
                        return;
                    }
                    pet.happy = Math.min(100, pet.happy + 30);
                    pet.hunger = Math.max(0, pet.hunger - 10);
                    pet.clean = Math.max(0, pet.clean - 5);
                    pet.energy -= 15;
                    message = '玩耍好开心！';
                    animatePet('bounce');
                    break;
                case 'wash':
                    if (pet.energy < 20) {
                        showMessage('体力不足！请先休息');
                        return;
                    }
                    pet.clean = Math.min(100, pet.clean + 35);
                    pet.happy += 10;
                    pet.energy -= 20;
                    message = '洗得干干净净！';
                    animatePet('shake');
                    break;
                case 'train':
                    if (pet.energy < 25) {
                        showMessage('体力不足！请先休息');
                        return;
                    }
                    pet.strength += 3;
                    pet.intelligence += 2;
                    pet.hunger = Math.max(0, pet.hunger - 15);
                    pet.happy = Math.max(0, pet.happy - 5);
                    pet.energy -= 25;
                    message = '训练完成！能力提升了！';
                    animatePet('bounce');
                    break;
            }
            showMessage(message);
            updateUI();
        }
        function petPet() {
            pet.happy = Math.min(100, pet.happy + 5);
            showMessage('摸摸头~');
            animatePet('bounce');
            updateUI();
        }
        function sleep() {
            pet.energy = 100;
            pet.hunger = Math.max(0, pet.hunger - 10);
            pet.clean = Math.max(0, pet.clean - 5);
            showMessage('睡了个好觉，体力恢复了！');
            updateUI();
        }
        function nextDay() {
            pet.day++;
            pet.hunger = Math.max(0, pet.hunger - 15);
            pet.happy = Math.max(0, pet.happy - 10);
            pet.clean = Math.max(0, pet.clean - 10);
            pet.energy = Math.min(100, pet.energy + 50);
            if (pet.day > 30) {
                showEnding();
                return;
            }
            const events = [
                { msg: '今天是平凡的一天', effect: null },
                { msg: '小可爱今天特别开心！', effect: () => pet.happy += 10 },
                { msg: '小可爱有点饿了...', effect: () => pet.hunger -= 10 },
                { msg: '下雨了，小可爱有点无聊', effect: () => pet.happy -= 5 },
                { msg: '邻居送来了好吃的！', effect: () => pet.hunger += 15 }
            ];
            const event = events[Math.floor(Math.random() * events.length)];
            showMessage(`第 ${pet.day} 天 - ${event.msg}`);
            if (event.effect) event.effect();
            updateUI();
        }
        function showEnding() {
            const overlay = document.getElementById('ending-overlay');
            const content = document.getElementById('ending-content');
            const totalScore = Math.round((pet.hunger + pet.happy + pet.clean) / 3) + pet.strength + pet.intelligence;
            let ending;
            if (totalScore >= 150) {
                ending = {
                    title: '🌟 完美结局：幸福的一家',
                    color: '#fbbf24',
                    text: `经过30天的精心照顾，小可爱成长为一只健康快乐的宝贝。它学会了各种技能，成为了最棒的伙伴。你们的故事被写进了童话书，成为了永恒的传说。`
                };
            } else if (totalScore >= 100) {
                ending = {
                    title: '❤️ 美好结局：温暖的日常',
                    color: '#ec4899',
                    text: `小可爱在你的照顾下健康成长。虽然不是最完美的，但它每天都很开心。你们一起度过了许多美好的时光，这份陪伴是最珍贵的礼物。`
                };
            } else if (totalScore >= 60) {
                ending = {
                    title: '😊 普通结局：平凡的幸福',
                    color: '#22c55e',
                    text: `小可爱普普通通地长大了。虽然有些小遗憾，但你们都在努力。也许下次能做得更好，给它一个更幸福的童年。`
                };
            } else {
                ending = {
                    title: '😢 遗憾结局：需要更多关爱',
                    color: '#ef4444',
                    text: `小可爱看起来不太开心。也许你太忙了，没有好好照顾它。但没关系，爱永远不嫌晚。试着多花点时间陪陪它吧。`
                };
            }
            content.innerHTML = `
                <h2 style="color: ${ending.color}">${ending.title}</h2>
                <p>${ending.text}</p>
                <p style="opacity: 0.7; font-size: 0.9rem;">
                    最终属性 - 饱食: ${Math.round(pet.hunger)} | 心情: ${Math.round(pet.happy)} | 清洁: ${Math.round(pet.clean)}<br>
                    力量: ${pet.strength} | 智力: ${pet.intelligence}
                </p>
                <button class="restart-btn" onclick="restart()">重新开始</button>
            `;
            overlay.classList.remove('hidden');
        }
        function restart() {
            pet.hunger = 70;
            pet.happy = 60;
            pet.clean = 80;
            pet.energy = 100;
            pet.day = 1;
            pet.intelligence = 0;
            pet.strength = 0;
            document.getElementById('ending-overlay').classList.add('hidden');
            updateUI();
        }
        updateUI();
    </script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
