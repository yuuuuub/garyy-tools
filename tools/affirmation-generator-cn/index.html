<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ 自我肯定语</title>
<meta name="description" content="自我肯定语生成器，每天给自己积极的心理暗示，增强自信">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.quote-card{text-align:center;padding:30px;background:linear-gradient(135deg,var(--bg),var(--card));border-radius:var(--radius);border:2px solid var(--accent);margin-bottom:16px;position:relative;overflow:hidden}
.quote-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(59,130,246,.05) 0%,transparent 70%);animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
.quote-card .text{font-size:1.2rem;font-weight:600;line-height:1.8;position:relative;z-index:1}
.quote-card .author{font-size:.85rem;color:var(--text2);margin-top:12px;position:relative;z-index:1}
.category-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cat-tag{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.85rem;transition:all .2s}
.cat-tag:hover,.cat-tag.active{border-color:var(--accent);background:var(--accent);color:#fff}
.entry{padding:12px;border-bottom:1px solid var(--border)}.entry:last-child{border-bottom:none}
.entry .text{font-size:.95rem;font-style:italic}.entry .date{font-size:.75rem;color:var(--text2);margin-top:4px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="✨ 自我肯定语">
<meta property="og:description" content="自我肯定语生成器，每天给自己积极的心理暗示">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>✨ 自我肯定语</h1><p>每天给自己积极的心理暗示</p></div>

<div class="cd"><h2>今日肯定语</h2>
<div id="quoteDisplay" class="quote-card"></div>
<div class="category-tags" id="catTags"></div>
<div class="bg"><button onclick="shuffleQuote()">🔄 换一个</button><button onclick="saveFavorite()">❤️ 收藏</button></div></div>

<div class="cd"><h2>自定义肯定语</h2>
<textarea id="customQuote" placeholder="写下你自己的肯定语..."></textarea>
<div class="bg"><button onclick="addCustom()">添加自定义</button></div></div>

<div class="cd"><h2>收藏夹</h2><div id="favoriteList"></div></div>

<div class="cd"><h2>历史使用</h2><div id="historyList"></div></div>

<div class="cd"><h2>统计</h2><div class="gr" id="stats"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let favorites=JSON.parse(localStorage.getItem('ag_favorites')||'[]');
let history=JSON.parse(localStorage.getItem('ag_history')||'[]');
let customQuotes=JSON.parse(localStorage.getItem('ag_custom')||'[]');
let currentQuote=null;
let selectedCat='all';

const quotes=[
  {text:'我值得被爱，也值得去爱',cat:'self-love'},
  {text:'我相信自己的能力，我能克服任何挑战',cat:'confidence'},
  {text:'每一天都是新的开始，我选择积极面对',cat:'positivity'},
  {text:'我正在成为更好的自己',cat:'growth'},
  {text:'我感恩生命中的一切美好',cat:'gratitude'},
  {text:'我的努力终将得到回报',cat:'motivation'},
  {text:'我有权说"不"，也有权追求自己的幸福',cat:'boundaries'},
  {text:'我是一个有价值的人，我的贡献很重要',cat:'self-worth'},
  {text:'我选择放下焦虑，拥抱当下',cat:'peace'},
  {text:'我的梦想值得我去追求',cat:'dreams'},
  {text:'我有能力创造我想要的生活',cat:'empowerment'},
  {text:'我原谅自己的过去，专注于美好的未来',cat:'healing'},
  {text:'我是一个独特而美丽的人',cat:'self-love'},
  {text:'我值得拥有健康和幸福',cat:'wellness'},
  {text:'我有能力处理生活中的任何事情',cat:'resilience'},
  {text:'我感谢经历的一切，它们让我成长',cat:'gratitude'},
  {text:'我相信宇宙会给我最好的安排',cat:'trust'},
  {text:'我每天都在进步，哪怕只是一点点',cat:'growth'},
  {text:'我选择快乐，而不是等待快乐',cat:'positivity'},
  {text:'我是一个有力量的人，我能改变自己的生活',cat:'empowerment'},
  {text:'我值得被尊重，也尊重他人',cat:'respect'},
  {text:'我的内心充满平静与喜悦',cat:'peace'},
  {text:'我勇敢面对未知，因为我知道自己足够强大',cat:'courage'},
  {text:'我感恩此刻的呼吸，感恩活着的每一天',cat:'gratitude'},
  {text:'我的未来充满无限可能',cat:'hope'},
  {text:'我有权利追求自己的梦想，不需要任何人批准',cat:'freedom'},
  {text:'我是一个善良的人，我选择用爱回应世界',cat:'kindness'},
  {text:'我相信自己的直觉，它会引导我走向正确方向',cat:'intuition'},
  {text:'我正在创造一个充满爱和幸福的人生',cat:'creation'},
  {text:'我是一个坚强的幸存者，没有什么能打倒我',cat:'resilience'},
];

const catLabels={all:'全部','self-love':'自爱',confidence:'自信',positivity:'积极',growth:'成长',gratitude:'感恩',motivation:'动力',boundaries:'边界',self-worth:'自我价值',peace:'平静',dreams:'梦想',empowerment:'赋权',healing:'疗愈',wellness:'健康',resilience:'韧性',trust:'信任',hope:'希望',freedom:'自由',kindness:'善良',intuition:'直觉',creation:'创造',courage:'勇气',respect:'尊重'};
const catEmojis={all:'✨','self-love':'💕',confidence:'💪',positivity:'☀️',growth:'🌱',gratitude:'🙏',motivation:'🔥',boundaries:'🛡️',self-worth:'👑',peace:'🕊️',dreams:'🌟',empowerment:'⚡',healing:'💊',wellness:'🏥',resilience:'💎',trust:'🔮',hope:'🌈',freedom:'🦋',kindness:'💝',intuition:'🔮',creation:'🎨',courage:'🦁',respect:'🤝'};

function getAllQuotes(){return[...quotes,...customQuotes.map(t=>({text:t,cat:'custom'}))];}

function shuffleQuote(){
  const all=getAllQuotes();
  const filtered=selectedCat==='all'?all:all.filter(q=>q.cat===selectedCat);
  currentQuote=filtered[Math.floor(Math.random()*filtered.length)];
  renderQuote();
  addToHistory(currentQuote);
}

function renderQuote(){
  if(!currentQuote){shuffleQuote();return;}
  $('quoteDisplay').innerHTML=`<div class="text">"${currentQuote.text}"</div><div class="author">${catLabels[currentQuote.cat]||''} ${catEmojis[currentQuote.cat]||''}</div>`;
  $('catTags').innerHTML=Object.entries(catLabels).map(([k,v])=>
    `<span class="cat-tag ${k===selectedCat?'active':''}" onclick="selectCat('${k}')">${catEmojis[k]} ${v}</span>`
  ).join('');
}

function selectCat(cat){selectedCat=cat;shuffleQuote();}

function saveFavorite(){
  if(!currentQuote)return;
  if(!favorites.find(f=>f.text===currentQuote.text)){
    favorites.push({...currentQuote,date:new Date().toLocaleDateString()});
    save();renderFavorites();alert('已收藏！');
  }else{alert('已在收藏夹中');}
}

function addCustom(){
  const text=$('customQuote').value.trim();
  if(!text){alert('请输入肯定语');return;}
  customQuotes.push(text);save();$('customQuote').value='';alert('已添加！');
}

function addToHistory(q){
  history.unshift({...q,date:new Date().toLocaleDateString()});
  if(history.length>50)history=history.slice(0,50);
  save();renderHistory();
}

function removeFavorite(i){favorites.splice(i,1);save();renderFavorites();}
function clearHistory(){history=[];save();renderHistory();}
function save(){localStorage.setItem('ag_favorites',JSON.stringify(favorites));localStorage.setItem('ag_history',JSON.stringify(history));localStorage.setItem('ag_custom',JSON.stringify(customQuotes));}

function renderFavorites(){
  $('favoriteList').innerHTML=favorites.length?favorites.map((f,i)=>`<div class="entry">
    <div class="text">"${f.text}"</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
      <span class="date">📅 ${f.date} · ${catLabels[f.cat]||''}</span>
      <button class="dng" style="padding:2px 8px;font-size:.7rem" onclick="removeFavorite(${i})">删除</button>
    </div>
  </div>`).reverse().join(''):'<div class="es">暂无收藏</div>';
}

function renderHistory(){
  $('historyList').innerHTML=history.length?history.slice(0,10).map(h=>`<div class="entry">
    <div class="text">"${h.text}"</div><div class="date">📅 ${h.date}</div>
  </div>`).join(''):'<div class="es">暂无使用记录</div>';
}

function renderStats(){
  const total=favorites.length+history.length;
  $('stats').innerHTML=`
    <div class="st"><div class="nm">${favorites.length}</div><div class="lb">收藏数</div></div>
    <div class="st"><div class="nm" style="color:var(--success)">${history.length}</div><div class="lb">使用次数</div></div>
    <div class="st"><div class="nm" style="color:var(--warn)">${customQuotes.length}</div><div class="lb">自定义</div></div>
    <div class="st"><div class="nm" style="color:var(--accent)">${quotes.length+customQuotes.length}</div><div class="lb">总语录</div></div>`;
}

shuffleQuote();renderFavorites();renderHistory();renderStats();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
