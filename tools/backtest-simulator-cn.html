<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="回测模拟器 - 模拟历史投资策略回测，分析策略表现和风险指标">
    <meta name="robots" content="index, follow">
    <title>回测模拟器</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="i18n.js" defer></script>
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #0ea5e9; --secondary-color: #6b7280; --success-color: #10b981; --warning-color: #f59e0b; --danger-color: #ef4444; --border-color: #e5e7eb; --card-bg: #f9fafb; }
        [data-theme="dark"] { --bg-color: #111827; --text-color: #f9fafb; --primary-color: #38bdf8; --secondary-color: #9ca3af; --success-color: #34d399; --warning-color: #fbbf24; --danger-color: #f87171; --border-color: #374151; --card-bg: #1f2937; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-top: 0; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 12px; background: var(--card-bg); margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); color: var(--text-color); font-size: 14px; }
        textarea { resize: vertical; min-height: 60px; font-family: 'Courier New', monospace; font-size: 13px; }
        input:focus, textarea:focus { outline: 2px solid var(--primary-color); border-color: transparent; }
        button { background: var(--primary-color); color: #fff; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: opacity 0.2s; }
        button:hover { opacity: 0.85; }
        .btn-success { background: var(--success-color); }
        .btn-sm { padding: 5px 12px; font-size: 13px; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 14px; background: var(--secondary-color); color: #fff; border: none; border-radius: 8px; cursor: pointer; z-index: 100; }
        .result-chart { width: 100%; height: 300px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        canvas { width: 100%; height: 100%; }
        .stat-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .stat-box { flex: 1; min-width: 120px; text-align: center; padding: 14px; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--border-color); }
        .stat-box .num { font-size: 20px; font-weight: 700; color: var(--primary-color); }
        .stat-box .lbl { font-size: 11px; color: var(--secondary-color); margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        th { font-weight: 600; color: var(--secondary-color); }
        .positive { color: var(--success-color); }
        .negative { color: var(--danger-color); }
        .strategy-tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: var(--primary-color); color: #fff; margin: 2px; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>🔬 回测模拟器</h1>
        <p style="color:var(--secondary-color)">模拟投资策略的历史表现，评估收益与风险</p>

        <div class="grid-2">
            <div class="card">
                <h3>策略参数</h3>
                <label>策略类型</label>
                <select id="strategy">
                    <option value="sma">均线交叉 (SMA)</option>
                    <option value="rsi">RSI超卖超买</option>
                    <option value="macd">MACD信号</option>
                    <option value="bollinger">布林带突破</option>
                    <option value="buyhold">买入持有</option>
                    <option value="dca">定投策略</option>
                </select>
                <label style="margin-top:12px">初始资金 (元)</label>
                <input type="number" id="initialCapital" value="100000">
                <label style="margin-top:12px">交易费率 (%)</label>
                <input type="number" id="commission" value="0.1" step="0.01">
                <div class="grid-2" style="margin-top:12px">
                    <div><label>短期周期</label><input type="number" id="shortPeriod" value="5"></div>
                    <div><label>长期周期</label><input type="number" id="longPeriod" value="20"></div>
                </div>
                <label style="margin-top:12px">回测区间</label>
                <select id="backtestPeriod">
                    <option value="1">1年</option>
                    <option value="2">2年</option>
                    <option value="3" selected>3年</option>
                    <option value="5">5年</option>
                </select>
            </div>
            <div class="card">
                <h3>市场数据</h3>
                <label>数据源</label>
                <select id="dataSource">
                    <option value="hs300">沪深300</option>
                    <option value="zz500">中证500</option>
                    <option value="cyb">创业板指</option>
                    <option value="sp500">标普500 (模拟)</option>
                </select>
                <label style="margin-top:12px">数据频率</label>
                <select id="frequency">
                    <option value="daily">日线</option>
                    <option value="weekly">周线</option>
                    <option value="monthly">月线</option>
                </select>
                <button onclick="runBacktest()" style="margin-top:20px;width:100%">运行回测</button>
            </div>
        </div>

        <div class="card">
            <h3>净值曲线</h3>
            <div class="result-chart"><canvas id="equityCanvas"></canvas></div>
        </div>

        <div class="card">
            <h3>核心指标</h3>
            <div class="stat-row" id="metrics"></div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>月度收益</h3>
                <div id="monthlyReturns" style="overflow-x:auto"></div>
            </div>
            <div class="card">
                <h3>交易记录</h3>
                <div id="trades" style="max-height:300px;overflow-y:auto"></div>
            </div>
        </div>
    </div>

    <script>
        function generatePriceData(source, years) {
            const basePrices = { hs300: 3800, zz500: 6200, cyb: 2500, sp500: 4500 };
            const basePrice = basePrices[source] || 3800;
            const days = years * 252;
            const prices = [basePrice];
            const mu = 0.08 / 252;
            const sigma = 0.22 / Math.sqrt(252);

            for (let i = 1; i < days; i++) {
                const shock = (Math.random() - 0.5) * 2 + (Math.random() - 0.5) * 2;
                const drift = mu + sigma * shock * 0.3;
                const trend = Math.sin(i / 60) * 0.001;
                prices.push(prices[i - 1] * (1 + drift + trend));
            }
            return prices;
        }

        function sma(data, period) {
            return data.map((_, i) => {
                if (i < period - 1) return null;
                const slice = data.slice(i - period + 1, i + 1);
                return slice.reduce((a, b) => a + b, 0) / period;
            });
        }

        function rsi(data, period) {
            const result = [null];
            for (let i = 1; i < data.length; i++) {
                if (i < period) { result.push(null); continue; }
                let gains = 0, losses = 0;
                for (let j = i - period + 1; j <= i; j++) {
                    const diff = data[j] - data[j - 1];
                    if (diff > 0) gains += diff; else losses -= diff;
                }
                const avgGain = gains / period;
                const avgLoss = losses / period || 0.001;
                result.push(100 - 100 / (1 + avgGain / avgLoss));
            }
            return result;
        }

        function runBacktest() {
            const strategy = document.getElementById('strategy').value;
            const capital = +document.getElementById('initialCapital').value;
            const comm = +document.getElementById('commission').value / 100;
            const years = +document.getElementById('backtestPeriod').value;
            const source = document.getElementById('dataSource').value;
            const shortP = +document.getElementById('shortPeriod').value;
            const longP = +document.getElementById('longPeriod').value;

            const prices = generatePriceData(source, years);
            const n = prices.length;

            let position = 0;
            let cash = capital;
            let shares = 0;
            const equity = [];
            const trades = [];
            let lastSignal = 0;

            const shortMA = sma(prices, shortP);
            const longMA = sma(prices, longP);
            const rsiVals = rsi(prices, 14);

            for (let i = 0; i < n; i++) {
                let signal = 0;

                if (strategy === 'sma') {
                    if (shortMA[i] && longMA[i]) signal = shortMA[i] > longMA[i] ? 1 : -1;
                } else if (strategy === 'rsi') {
                    if (rsiVals[i]) signal = rsiVals[i] < 30 ? 1 : rsiVals[i] > 70 ? -1 : 0;
                } else if (strategy === 'buyhold') {
                    signal = 1;
                } else if (strategy === 'dca') {
                    if (i % 21 === 0) {
                        const buyShares = Math.floor(cash * 0.05 / prices[i]);
                        if (buyShares > 0) {
                            shares += buyShares;
                            cash -= buyShares * prices[i] * (1 + comm);
                            trades.push({ day: i, type: '买入', price: prices[i].toFixed(2), shares: buyShares });
                        }
                    }
                    signal = 1;
                } else {
                    signal = lastSignal;
                }

                if (signal === 1 && lastSignal !== 1 && shares === 0 && strategy !== 'dca') {
                    shares = Math.floor(cash / (prices[i] * (1 + comm)));
                    cash -= shares * prices[i] * (1 + comm);
                    trades.push({ day: i, type: '买入', price: prices[i].toFixed(2), shares });
                } else if (signal === -1 && lastSignal !== -1 && shares > 0 && strategy !== 'dca') {
                    cash += shares * prices[i] * (1 - comm);
                    trades.push({ day: i, type: '卖出', price: prices[i].toFixed(2), shares });
                    shares = 0;
                }

                if (signal !== 0) lastSignal = signal;
                equity.push(cash + shares * prices[i]);
            }

            const finalValue = equity[equity.length - 1];
            const totalReturn = (finalValue / capital - 1) * 100;
            const annualReturn = (Math.pow(finalValue / capital, 252 / n) - 1) * 100;

            let maxDD = 0, peak = equity[0];
            let maxDDStart = 0, maxDDEnd = 0, tempStart = 0;
            for (let i = 0; i < n; i++) {
                if (equity[i] > peak) { peak = equity[i]; tempStart = i; }
                const dd = (peak - equity[i]) / peak;
                if (dd > maxDD) { maxDD = dd; maxDDStart = tempStart; maxDDEnd = i; }
            }

            const dailyReturns = [];
            for (let i = 1; i < equity.length; i++) dailyReturns.push(equity[i] / equity[i - 1] - 1);
            const avgRet = dailyReturns.reduce((a, b) => a + b, 0) / dailyReturns.length;
            const stdDev = Math.sqrt(dailyReturns.reduce((s, r) => s + (r - avgRet) ** 2, 0) / dailyReturns.length);
            const sharpe = (avgRet * 252 - 0.025) / (stdDev * Math.sqrt(252));
            const calmar = annualReturn / (maxDD * 100);

            let winTrades = 0, loseTrades = 0;
            for (let i = 1; i < trades.length; i++) {
                if (trades[i].type === '卖出' && trades[i - 1].type === '买入') {
                    if (trades[i].price > trades[i - 1].price) winTrades++; else loseTrades++;
                }
            }

            document.getElementById('metrics').innerHTML = `
                <div class="stat-box"><div class="num">${totalReturn.toFixed(2)}%</div><div class="lbl">总收益率</div></div>
                <div class="stat-box"><div class="num">${annualReturn.toFixed(2)}%</div><div class="lbl">年化收益</div></div>
                <div class="stat-box"><div class="num">${(maxDD * 100).toFixed(2)}%</div><div class="lbl">最大回撤</div></div>
                <div class="stat-box"><div class="num">${sharpe.toFixed(2)}</div><div class="lbl">夏普比率</div></div>
                <div class="stat-box"><div class="num">${calmar.toFixed(2)}</div><div class="lbl">卡玛比率</div></div>
                <div class="stat-box"><div class="num">${trades.length}</div><div class="lbl">交易次数</div></div>
                <div class="stat-box"><div class="num">${winTrades}/${winTrades + loseTrades}</div><div class="lbl">胜率</div></div>
                <div class="stat-box"><div class="num">¥${finalValue.toFixed(0)}</div><div class="lbl">最终资金</div></div>
            `;

            drawEquity(equity, capital);
            renderMonthlyReturns(dailyReturns, n);
            renderTrades(trades);
        }

        function drawEquity(equity, capital) {
            const canvas = document.getElementById('equityCanvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.parentElement.clientWidth;
            const H = 300;
            canvas.width = W * 2; canvas.height = H * 2;
            canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            ctx.scale(2, 2);
            ctx.clearRect(0, 0, W, H);

            const pad = { l: 60, r: 20, t: 20, b: 35 };
            const yMin = Math.min(...equity) * 0.95;
            const yMax = Math.max(...equity) * 1.05;

            ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const y = pad.t + (i / 4) * (H - pad.t - pad.b);
                ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
                ctx.fillStyle = '#999'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
                const val = yMax - i / 4 * (yMax - yMin);
                ctx.fillText('¥' + (val / 10000).toFixed(1) + '万', pad.l - 5, y + 4);
            }

            const gradient = ctx.createLinearGradient(0, pad.t, 0, H - pad.b);
            gradient.addColorStop(0, 'rgba(14,165,233,0.15)');
            gradient.addColorStop(1, 'rgba(14,165,233,0.01)');

            ctx.beginPath();
            ctx.moveTo(pad.l, H - pad.b);
            equity.forEach((v, i) => {
                const x = pad.l + (i / (equity.length - 1)) * (W - pad.l - pad.r);
                const y = pad.t + ((yMax - v) / (yMax - yMin)) * (H - pad.t - pad.b);
                ctx.lineTo(x, y);
            });
            ctx.lineTo(W - pad.r, H - pad.b);
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.beginPath();
            equity.forEach((v, i) => {
                const x = pad.l + (i / (equity.length - 1)) * (W - pad.l - pad.r);
                const y = pad.t + ((yMax - v) / (yMax - yMin)) * (H - pad.t - pad.b);
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            });
            ctx.strokeStyle = '#0ea5e9'; ctx.lineWidth = 2; ctx.stroke();

            const capY = pad.t + ((yMax - capital) / (yMax - yMin)) * (H - pad.t - pad.b);
            ctx.strokeStyle = '#999'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(pad.l, capY); ctx.lineTo(W - pad.r, capY); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#999'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
            ctx.fillText('初始资金', W - pad.r - 50, capY - 5);
        }

        function renderMonthlyReturns(dailyReturns, n) {
            const months = Math.floor(n / 21);
            const monthly = [];
            for (let m = 0; m < months; m++) {
                const start = m * 21;
                const end = Math.min(start + 21, dailyReturns.length);
                let ret = 1;
                for (let i = start; i < end; i++) ret *= (1 + dailyReturns[i]);
                monthly.push(ret - 1);
            }

            let html = '<div style="display:flex;flex-wrap:wrap;gap:4px">';
            monthly.forEach((r, i) => {
                const pct = (r * 100).toFixed(1);
                const intensity = Math.min(Math.abs(r) * 5, 1);
                const bg = r >= 0 ? `rgba(16,185,129,${0.2 + intensity * 0.6})` : `rgba(239,68,68,${0.2 + intensity * 0.6})`;
                html += `<div style="width:48px;height:36px;background:${bg};border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600">${pct}%</div>`;
            });
            html += '</div>';
            document.getElementById('monthlyReturns').innerHTML = html;
        }

        function renderTrades(trades) {
            let html = '<table><tr><th>交易日</th><th>类型</th><th>价格</th><th>数量</th></tr>';
            trades.slice(-30).forEach(t => {
                const cls = t.type === '买入' ? 'positive' : 'negative';
                html += `<tr><td>第${t.day}天</td><td class="${cls}">${t.type}</td><td>¥${t.price}</td><td>${t.shares}</td></tr>`;
            });
            html += '</table>';
            if (trades.length > 30) html += `<p style="color:var(--secondary-color);font-size:12px;text-align:center">显示最近30条，共${trades.length}条</p>`;
            document.getElementById('trades').innerHTML = html;
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        runBacktest();
    </script>
</body>
</html>
