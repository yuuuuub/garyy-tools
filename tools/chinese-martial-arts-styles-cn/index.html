<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国武术流派大全 - Chinese Martial Arts Styles</title>
<meta name="description" content="中国武术流派大全，涵盖少林、武当、太极、形意、八卦、咏春、洪拳、蔡李佛等各大门派详细介绍">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国武术流派大全 - Chinese Martial Arts Styles">
<meta property="og:description" content="中国武术流派大全，涵盖少林、武当、太极、形意、八卦、咏春、洪拳、蔡李佛等各大门派详细介绍">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-martial-arts-styles-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥋</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a05 0%,#2a1510 50%,#3d2015 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a,#b06a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px}
.style-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.style-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.style-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.style-card .s-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.style-card .s-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(232,168,124,0.15);color:var(--accent)}
.style-card .s-name{font-size:1.3em;font-weight:bold}
.style-card .s-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.style-card .s-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.style-card .s-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.style-card .s-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.style-card .s-detail strong{color:var(--text)}
.style-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.style-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🥋 中国武术流派大全</h1>
<p>Chinese Martial Arts Styles — 探索各大武术门派的起源、特点与传承</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索流派名称或特点...">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部流派</button>
<button class="filter-btn" data-filter="外家拳">🥊 外家拳</button>
<button class="filter-btn" data-filter="内家拳">☯️ 内家拳</button>
<button class="filter-btn" data-filter="南拳">🏯 南拳</button>
<button class="filter-btn" data-filter="象形拳">🐾 象形拳</button>
<button class="filter-btn" data-filter="长拳">🏃 长拳</button>
<button class="filter-btn" data-filter="短打">💪 短打</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="style-grid" id="styleGrid"></div>
<footer><p>🥋 中国武术流派大全 — 武学浩瀚，各门各派各有千秋</p></footer>
</div>

  {id:4,name:"八卦掌",en:"Ba Gua Zhang",category:"内家拳",icon:"🔄",origin:"北京",era:"清代",characteristic:"走转掌法、变化无穷",description:"八卦掌以走圈转掌为基本训练方法，步法灵活多变，掌法千变万化，体现了《易经》八卦变化的哲学思想。",subStyles:["程派","尹派","梁派","宫派"],famousFor:"游龙八卦，变化无穷",training:"以走转为基础，八大母掌为核心",representatives:["董海川","程廷华","尹福"]},

  {id:12,name:"鹰爪拳",en:"Eagle Claw Fist",category:"象形拳",icon:"🦅",origin:"河北",era:"明代",characteristic:"鹰爪擒拿、抓打掐拿",description:"鹰爪拳模仿鹰的爪法，以擒拿为主，抓打掐拿，手法刚猛有力，有'鹰爪锁喉'之称。",subStyles:["鹰爪翻子拳","鹰爪拳"],famousFor:"鹰爪锁喉，一抓必中",training:"以鹰爪功为基础，擒拿手法为核心",representatives:["陈子正","刘仕俊"]},

  {id:14,name:"华拳",en:"Hua Quan",category:"长拳",icon:"🏃",origin:"山东",era:"明代",characteristic:"姿势舒展、劲力顺达",description:"华拳以姿势舒展、劲力顺达著称，动作大方，节奏鲜明，是长拳体系中的重要组成部分。",subStyles:["华拳一路","华拳二路"],famousFor:"华拳四十八，拳拳见真功",training:"以华拳十二路为核心",representatives:["蔡龙云"]},

function renderCards(data){
  document.getElementById('styleGrid').innerHTML=data.map(m=>`
    <div class="style-card" data-category="${m.category}">
      <div class="s-header"><div class="s-icon">${m.icon}</div><div><div class="s-name">${m.name}</div><div class="s-sub">${m.en} · ${m.origin}</div></div></div>
      <div class="s-meta"><span>${m.era}</span><span>${m.characteristic}</span></div>
      <div class="s-detail"><strong>简介：</strong>${m.description}</div>
      <div class="s-detail"><strong>分支：</strong>${m.subStyles.join('、')}</div>
      <div class="s-detail"><strong>名言：</strong>${m.famousFor}</div>
      <div class="s-detail"><strong>训练：</strong>${m.training}</div>
      <div class="s-detail"><strong>代表人物：</strong>${m.representatives.join('、')}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">武术流派</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.style-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.style-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(STYLE_DATA);renderStats(STYLE_DATA);
</script>
</body>
</html>
