<script>
var data=[
{name:'春节',icon:'🧧',era:'先秦',year:'约公元前2000年',title:'春节的起源',desc:'源于上古时代的岁首祈年祭祀，"年"的概念来自农作物的收获周期。',detail:'春节是中国最古老的节日之一，其起源可追溯到殷商时期的年头岁尾祭神祭祖活动。"年"字在甲骨文中就是一个人背负成熟的禾苗，象征收获。先秦时期每逢新年，人们举行腊祭，感谢天地神灵和祖先的庇佑。',tags:['祭祀','丰收']},
{name:'春节',icon:'🧧',era:'汉代',year:'汉武帝时期',title:'春节日期确立',desc:'汉武帝太初元年(前104年)使用《太初历》，确定正月初一为岁首。',detail:'汉代是春节定型的关键时期。汉武帝颁行《太初历》，将正月初一定为岁首，春节的时间从此固定下来。汉代春节已有了燃放爆竹（烧竹子）、饮椒柏酒、食胶牙饧等习俗。朝廷也会举行盛大朝会。',tags:['定历法','爆竹']},
{name:'春节',icon:'🧧',era:'宋代',year:'宋代',title:'春节习俗丰富化',desc:'宋代出现了贴春联（桃符）、拜年、给压岁钱等习俗，春节文化空前繁荣。',detail:'宋代的春节习俗已非常丰富：除夕贴桃符（春联前身）、守岁、放爆竹、饮屠苏酒、吃馎饦（饺子前身）。宋人还有正月初一拜年、正月初五迎财神等习俗。《东京梦华录》详细记载了北宋开封的春节盛况。',tags:['桃符','拜年','压岁钱']},
{name:'春节',icon:'🧧',era:'明清',year:'明清时期',title:'春节习俗定型',desc:'明清时期贴春联、放鞭炮、吃年夜饭、守岁等习俗基本定型，延续至今。',detail:'明代朱元璋大力推广贴春联，春节贴春联成为全民习俗。清代春节习俗进一步丰富，增加了贴年画、逛庙会、扭秧歌等内容。吃年夜饭、守岁、拜年、放鞭炮等核心习俗在明清时期完全定型。',tags:['春联','年画','庙会']},
{name:'春节',icon:'🧧',era:'现代',year:'1912年至今',title:'春节的现代化',desc:'1912年民国改用公历，春节被称为"旧历年"。1949年后恢复为法定假日。',detail:'1912年民国政府改用公历，将公历1月1日定为"新年"，农历正月初一改称"春节"。1949年后，春节被确定为法定假日。2006年春节被列入首批国家级非物质文化遗产。2023年春节被联合国列为联合国假日。如今的春节增加了看春晚、微信红包等新习俗。',tags:['法定假日','春晚','非遗']},

{name:'元宵节',icon:'🏮',era:'汉代',year:'西汉时期',title:'元宵节起源',desc:'元宵节起源于西汉，与祭祀太一神（天帝）有关，正月十五燃灯表佛。',detail:'元宵节的起源有多种说法。一说起源于西汉文帝为纪念平定"诸吕之乱"；一说与汉武帝祭祀太一神有关；另一说与东汉明帝提倡佛教、正月十五点灯表佛有关。无论哪种说法，汉代是元宵节的萌芽期。',tags:['祭祀','燃灯']},
{name:'元宵节',icon:'🏮',era:'唐代',year:'唐代',title:'元宵节成为狂欢节',desc:'唐代元宵节放假三天，取消宵禁，满城灯火，成为盛大的狂欢节日。',detail:'唐代元宵节极为盛大，唐玄宗时期元宵节放假三天（后延长到五天甚至七天），取消宵禁，百姓可以通宵游玩。长安城内灯火辉煌，出现了灯轮、灯树、灯楼等大型灯饰。苏味道诗"火树银花合，星桥铁锁开"即描写此盛况。',tags:['灯会','取消宵禁']},
{name:'元宵节',icon:'🏮',era:'宋代',year:'宋代',title:'猜灯谜习俗形成',desc:'宋代元宵节出现了猜灯谜（隐语）的习俗，花灯种类更加丰富多彩。',detail:'宋代元宵节的花灯技艺达到新高度，出现了琉璃灯、珠子灯、走马灯等精美花灯。"猜灯谜"（当时称"弹壁灯"或"灯虎"）成为元宵节的核心娱乐活动。宋代元宵节假期长达五天，京城汴梁的灯会盛况空前。',tags:['灯谜','花灯艺术']},

{name:'清明节',icon:'🌿',era:'周代',year:'周代',title:'清明节起源',desc:'清明节源于周代的"墓祭"之礼，与寒食节、上巳节逐渐融合。',detail:'清明最初是二十四节气之一，后来与寒食节（纪念介子推）和上巳节（祓禊祈福）融合，形成了兼具祭祀和踏青功能的节日。春秋时期已有墓祭习俗，《孟子》中"齐人有一妻一妾"的故事就提到了墓祭。',tags:['节气','墓祭']},
{name:'清明节',icon:'🌿',era:'唐代',year:'唐代',title:'清明节官方化',desc:'唐玄宗将寒食扫墓列为"五礼"之一，清明扫墓成为官方认可的礼仪。',detail:'唐代是清明节成为正式节日的关键时期。开元二十年（732年），唐玄宗颁令将寒食扫墓列入"五礼"，清明扫墓成为官方认可的礼仪活动。唐代清明节已有踏青、荡秋千、蹴鞠、插柳等丰富习俗。',tags:['官方化','踏青','蹴鞠']},
{name:'清明节',icon:'🌿',era:'宋代',year:'宋代',title:'清明习俗丰富',desc:'宋代清明节习俗更加丰富，出现了吃青团、放风筝、插柳等习俗。',detail:'《清明上河图》生动描绘了北宋清明时节的市井风情。宋代清明节习俗极为丰富：扫墓祭祖、踏青郊游、荡秋千、蹴鞠、放风筝、插柳戴柳、吃青团等。朝廷还会举办蹴鞠比赛。',tags:['青团','风筝','蹴鞠']},

{name:'端午节',icon:'🐲',era:'先秦',year:'先秦时期',title:'端午节起源',desc:'端午节起源于上古时期的龙图腾祭祀和夏季驱邪避瘟习俗。',detail:'端午节的起源早于屈原传说。上古时期，五月初五是"恶日"，人们在这天举行龙图腾祭祀、悬挂菖蒲艾草、饮用雄黄酒等驱邪避瘟活动。闻一多先生在《端午考》中认为端午节源于古越民族的龙图腾祭。',tags:['龙图腾','驱邪']},
{name:'端午节',icon:'🐲',era:'汉代',year:'汉代',title:'屈原传说融入',desc:'汉代以后，纪念屈原的说法逐渐成为端午节的主流叙事。',detail:'虽然屈原传说在战国末期就已流传，但到汉代才逐渐成为端午节的主流叙事。汉代端午节已有吃粽子、赛龙舟、系五色丝线、佩香囊等习俗。应劭《风俗通》记载了多种端午辟邪方法。',tags:['屈原','粽子','龙舟']},
{name:'端午节',icon:'🐲',era:'宋代',year:'宋代',title:'端午习俗完备',desc:'宋代端午节习俗完备，赛龙舟成为盛大的竞技活动，粽子种类繁多。',detail:'宋代端午节已形成完整的习俗体系：赛龙舟、吃粽子、挂艾草、佩香囊、饮雄黄酒、系五色丝线等。南宋《武林旧事》记载了杭州端午龙舟竞渡的壮观场面，参与者数以万计。',tags:['龙舟竞渡','粽子多样化']},

{name:'中秋节',icon:'🌕',era:'唐代',year:'唐代',title:'中秋节起源',desc:'中秋节起源于唐代，最初是帝王祭祀月亮的活动，后普及为民间节日。',detail:'中秋节的起源与古代的月亮崇拜有关。唐代中秋赏月、玩月之风盛行，中秋成为官方认定的节日。唐玄宗曾于中秋夜游月宫的传说广为流传。李白"举杯邀明月"即反映了唐人对月亮的浪漫想象。',tags:['赏月','月亮崇拜']},
{name:'中秋节',icon:'🌕',era:'宋代',year:'宋代',title:'中秋节全民化',desc:'宋代中秋节成为全民性节日，吃月饼、赏月、饮酒成为核心习俗。',detail:'宋代中秋节已成为全民性的重要节日。《东京梦华录》记载了北宋中秋节的盛况："中秋夜，贵家结饰台榭，民间争占酒楼玩月。"月饼作为中秋节的节令食品在宋代已广泛出现。',tags:['月饼','全民节日']},
{name:'中秋节',icon:'🌕',era:'明清',year:'明清时期',title:'中秋节定型',desc:'明清时期中秋节习俗完全定型，月饼制作精美，成为馈赠佳品。',detail:'明清时期中秋节的习俗和象征意义基本定型。月饼制作工艺日益精湛，成为中秋节最重要的象征。赏月、吃月饼、赏桂花、饮桂花酒、玩花灯等习俗在明清时期完全成熟。《帝京景物略》记载了明代北京中秋节的详细习俗。',tags:['月饼定型','团圆象征']},

{name:'重阳节',icon:'⛰️',era:'汉代',year:'汉代',title:'重阳节起源',desc:'重阳节起源于先秦时期的秋季丰收祭祀，汉代开始有登高饮菊花酒的习俗。',detail:'重阳节的起源与先秦时期的秋季丰收祭祀有关。《吕氏春秋》记载了秋季九月的祭享活动。汉代已有重阳登高、饮菊花酒的习俗。《西京杂记》记载了汉代宫中重阳佩戴茱萸、食蓬饵、饮菊花酒的风俗。',tags:['登高','菊花酒']},
{name:'重阳节',icon:'⛰️',era:'唐代',year:'唐代',title:'重阳节法定化',desc:'唐代将重阳节定为官方节日，皇帝赐宴群臣，民间广泛庆祝。',detail:'唐代正式将九月九日重阳节定为官方节日，每逢重阳，皇帝赐宴群臣，赐茱萸、菊花。王维"遥知兄弟登高处，遍插茱萸少一人"即写于此时。唐代重阳节习俗包括登高、赏菊、佩茱萸、饮菊花酒、吃重阳糕等。',tags:['官方节日','茱萸']},

{name:'七夕节',icon:'💑',era:'汉代',year:'汉代',title:'七夕节起源',desc:'七夕节起源于汉代，牛郎织女传说在汉代广泛流传并与七月初七结合。',detail:'七夕节与牛郎织女的传说密切相关。牛郎织女的故事在先秦时期已有雏形，《诗经·小雅·大东》最早记载了牵牛星和织女星。到汉代，这个故事与七月初七结合，形成了七夕节。汉代宫廷中已有七月七日穿针乞巧的习俗。',tags:['牛郎织女','乞巧']},
{name:'七夕节',icon:'💑',era:'宋代',year:'宋代',title:'七夕成为女儿节',desc:'宋代七夕节极其盛大，被称为"乞巧节"或"女儿节"，市井繁华。',detail:'宋代七夕节盛况空前，《东京梦华录》记载："七夕前三五日，车马盈市，罗绮满街。"七夕市集上售卖各种乞巧物品，如磨喝乐（泥塑偶人）、花瓜、果食等。宋代七夕是仅次于春节和元宵的第三大节日。',tags:['女儿节','乞巧市集']},

{name:'腊八节',icon:'🥣',era:'宋代',year:'宋代',title:'腊八节习俗形成',desc:'宋代腊八节喝腊八粥的习俗广泛流传，成为春节的序曲。',detail:'腊八节喝粥的习俗与佛教有关。相传释迦牟尼在腊月初八悟道成佛，佛教寺院每年这天煮粥供佛。宋代以后，腊八粥的习俗从寺院传入民间，成为腊八节最重要的习俗。《梦粱录》记载了南宋杭州腊八节施粥的盛况。',tags:['腊八粥','佛教']},
{name:'腊八节',icon:'🥣',era:'明清',year:'明清时期',title:'腊八粥丰富化',desc:'明清时期腊八粥的配方更加丰富，成为春节前最重要的民俗活动。',detail:'明清时期腊八粥的制作更加讲究，用料丰富多样。明代《酌中志》记载了宫廷腊八粥的制作方法。民间还增加了泡腊八蒜、制腊八豆腐等习俗。腊八节被视为"春节的序幕"，从这天开始，人们就忙着准备年货了。',tags:['腊八蒜','年货准备']},

{name:'寒食节',icon:'🔥',era:'先秦',year:'春秋时期',title:'寒食节起源',desc:'寒食节起源于春秋时期，纪念忠臣介子推被焚于绵山。',detail:'相传春秋时期，晋国忠臣介子推随晋文公流亡十九年，功成后不受封赏，携母隐居绵山。晋文公放火烧山想逼他出来，介子推宁死不出，与母俱亡。晋文公下令这天禁火寒食以纪念，由此产生了寒食节。',tags:['介子推','禁火']},
{name:'寒食节',icon:'🔥',era:'唐代',year:'唐代',title:'寒食清明融合',desc:'唐代寒食节与清明节逐渐融合，寒食禁火、清明改火成为固定习俗。',detail:'唐代寒食节放假七天（后改为四天），与清明节在时间上非常接近（寒食在清明前一两天），两节逐渐融合。唐代寒食节有禁火、吃冷食、扫墓、荡秋千、蹴鞠等习俗。韩翃"日暮汉宫传蜡烛，轻烟散入五侯家"即描写寒食传烛的习俗。',tags:['禁火','融合清明']},

var currentEra='all';

function selectEra(el,era){
  document.querySelectorAll('.era-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');currentEra=era;filterTimeline();
}

function filterTimeline(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=data.filter(function(d){
    if(currentEra!=='all'&&d.era!==currentEra)return false;
    if(search&&!d.name.toLowerCase().includes(search)&&!d.era.toLowerCase().includes(search)&&!d.title.toLowerCase().includes(search))return false;
    return true;
  });
  renderTimeline(filtered);
}

function renderTimeline(items){
  var tl=document.getElementById('timeline');
  if(!items.length){tl.innerHTML='<div class="card" style="text-align:center;color:var(--text2)">没有找到匹配的记录</div>';return}
  var h='';
  items.forEach(function(d,i){
    h+='<div class="tl-item" onclick="toggleDetail('+i+')">';
    h+='<div class="tl-dot"></div>';
    h+='<div class="tl-content"><div class="tl-era">'+d.icon+' '+d.era+' · '+d.year+'</div>';
    h+='<div class="tl-title">'+d.name+' - '+d.title+'</div>';
    h+='<div class="tl-desc">'+d.desc+'</div>';
    h+='<div class="tl-detail" id="detail-'+i+'">'+d.detail+'</div>';
    h+='<div>'+d.tags.map(function(t){return '<span class="tl-tag" style="background:rgba(59,130,246,.15);color:var(--blue)">'+t+'</span>'}).join('')+'</div></div></div>';
  });
  tl.innerHTML=h;
}

function toggleDetail(i){
  var el=document.getElementById('detail-'+i);
  if(el)el.classList.toggle('show');
}

filterTimeline();

</script>
