<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字艺术效果</title>
<meta name="description" content="为汉字添加霓虹、3D、火焰、金属等酷炫CSS艺术效果">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:800px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.effect-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:16px}
.effect-card{padding:24px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);text-align:center;cursor:pointer;transition:all .3s;min-height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.effect-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 4px 20px rgba(59,130,246,.2)}
.effect-card.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
.effect-card .preview{font-size:2.5rem;font-weight:700;margin-bottom:8px;line-height:1.2}
.effect-card .name{font-size:.85rem;color:var(--text2)}
.preview-box{text-align:center;padding:40px;background:var(--bg);border-radius:var(--radius);border:2px solid var(--border);margin:16px 0;min-height:120px;display:flex;align-items:center;justify-content:center}
.preview-text{font-size:4rem;font-weight:700;transition:all .3s}
.code-box{background:#1a1a2e;color:#e0e0e0;padding:14px;border-radius:8px;font-family:'Fira Code',monospace;font-size:.8rem;overflow-x:auto;white-space:pre;max-height:200px;overflow-y:auto}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes neonPulse{0%,100%{text-shadow:0 0 10px #0ff,0 0 20px #0ff,0 0 40px #0ff,0 0 80px #0ff}50%{text-shadow:0 0 5px #0ff,0 0 10px #0ff,0 0 20px #0ff,0 0 40px #0ff}}
@keyframes fireGlow{0%,100%{text-shadow:0 0 10px #ff6a00,0 0 20px #ff6a00,0 0 40px #ee0979,0 0 80px #ee0979}50%{text-shadow:0 0 5px #ff6a00,0 0 15px #ff6a00,0 0 30px #ee0979,0 0 60px #ee0979}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes rainbow{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(2px,-2px)}60%{transform:translate(-1px,1px)}80%{transform:translate(1px,-1px)}100%{transform:translate(0)}}
@keyframes typewriter{from{width:0}to{width:100%}}
@keyframes blink{0%,100%{border-right-color:transparent}50%{border-right-color:var(--accent)}}
@keyframes waveAnim{0%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-5px) rotate(2deg)}50%{transform:translateY(0) rotate(0deg)}75%{transform:translateY(5px) rotate(-2deg)}100%{transform:translateY(0) rotate(0deg)}}
@keyframes shadowPulse{0%,100%{text-shadow:4px 4px 8px rgba(0,0,0,.5)}50%{text-shadow:8px 8px 16px rgba(0,0,0,.8)}}
@keyframes outlineMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="汉字艺术效果">
<meta property="og:description" content="霓虹、3D、火焰等CSS艺术效果">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🎨 汉字艺术效果</h1><p>为汉字添加酷炫的CSS艺术效果</p></div>

<div class="cd"><h2>输入汉字</h2>
<div style="display:flex;gap:8px">
<input type="text" id="charInput" value="龙" maxlength="4" style="flex:1">
<button onclick="updatePreview()">更新</button>
</div></div>

<div class="cd"><h2>效果预览</h2>
<div class="preview-box"><div class="preview-text" id="previewText">龙</div></div>
<div class="bg" style="justify-content:center">
<button onclick="copyCSS()">📋 复制CSS</button>
<button class="sec" onclick="downloadImage()">💾 保存图片</button>
</div></div>

<div class="cd"><h2>CSS代码</h2><div class="code-box" id="codeBox">选择一个效果查看代码</div></div>

<div class="cd"><h2>选择效果</h2>
<div class="effect-grid" id="effectGrid"></div></div>
</div>
<canvas id="saveCanvas" style="display:none"></canvas>
<script>
const $=id=>document.getElementById(id);
let currentEffect='neon';

const effects=[
{id:'neon',name:'霓虹灯',css:'color:#0ff;text-shadow:0 0 10px #0ff,0 0 20px #0ff,0 0 40px #0ff,0 0 80px #0ff;animation:neonPulse 2s ease-in-out infinite'},
{id:'fire',name:'烈焰',css:'background:linear-gradient(180deg,#ff6a00,#ee0979);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 0 10px #ff6a00);animation:fireGlow 1.5s ease-in-out infinite'},
{id:'ice',name:'冰霜',css:'color:#a0d2db;text-shadow:2px 2px 4px #0ff,0 0 20px rgba(0,255,255,.3);background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent'},
{id:'gold',name:'黄金',css:'background:linear-gradient(135deg,#f5af19,#f12711);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(2px 2px 4px rgba(0,0,0,.3))'},
{id:'rainbow',name:'彩虹',css:'background:linear-gradient(90deg,#ff0000,#ff7700,#ffff00,#00ff00,#0000ff,#8b00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbow 3s linear infinite'},
{id:'float',name:'悬浮',css:'color:var(--accent);animation:float 2s ease-in-out infinite;filter:drop-shadow(4px 4px 8px rgba(0,0,0,.3))'},
{id:'glitch',name:'故障',css:'color:var(--text);animation:glitch 0.3s infinite;position:relative;text-shadow:2px 0 #ff0000,-2px 0 #0000ff'},
{id:'3d',name:'3D立体',css:'color:#e6edf3;text-shadow:1px 1px 0 #ccc,2px 2px 0 #bbb,3px 3px 0 #aaa,4px 4px 0 #999,5px 5px 0 #888,6px 6px 10px rgba(0,0,0,.3)'},
{id:'emboss',name:'浮雕',css:'color:var(--bg);text-shadow:1px 1px 1px var(--text2),-1px -1px 1px rgba(255,255,255,.3);background:var(--bg);-webkit-background-clip:text'},
{id:'outline',name:'描边',css:'color:transparent;-webkit-text-stroke:2px var(--accent);text-shadow:none'},
{id:'gradient',name:'渐变',css:'background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 200%;animation:outlineMove 3s ease infinite'},
{id:'wave',name:'波浪',css:'color:var(--accent);display:inline-block;animation:waveAnim 1s ease-in-out infinite'},
{id:'shadow',name:'长阴影',css:'color:var(--text);text-shadow:4px 4px 8px rgba(0,0,0,.5);animation:shadowPulse 2s ease-in-out infinite'},
{id:'matrix',name:'矩阵',css:'color:#00ff41;font-family:monospace;text-shadow:0 0 10px #00ff41,0 0 20px #00ff41;background:#000;padding:20px 40px;border-radius:8px;border:1px solid #00ff41'},
{id:'neonPink',name:'粉红霓虹',css:'color:#ff6ec7;text-shadow:0 0 10px #ff6ec7,0 0 20px #ff6ec7,0 0 40px #ff6ec7,0 0 80px #ff1493'},
{id:'pixel',name:'像素风',css:'color:var(--accent);font-family:monospace;letter-spacing:4px;text-shadow:2px 2px 0 var(--danger),4px 4px 0 var(--warn)'},
];

function init(){
  $('effectGrid').innerHTML=effects.map(e=>{
    const char=$('charInput').value||'龙';
    return`<div class="effect-card ${e.id===currentEffect?'active':''}" onclick="selectEffect('${e.id}')">
      <div class="preview" style="${getPreviewCSS(e.id)}">${char}</div>
      <div class="name">${e.name}</div>
    </div>`;
  }).join('');
}

function getPreviewCSS(id){
  const e=effects.find(x=>x.id===id);
  if(!e)return'';
  let css=e.css;
  if(id==='matrix')css+=';font-size:1.5rem;padding:8px 16px';
  return css;
}

function selectEffect(id){
  currentEffect=id;
  init();updatePreview();
  const e=effects.find(x=>x.id===id);
  $('codeBox').textContent=`.${id}-effect {\n  ${e.css.replace(/;/g,';\n  ')}\n}`;
}

function updatePreview(){
  const char=$('charInput').value||'龙';
  const el=$('previewText');
  el.textContent=char;
  el.style.cssText='';
  const e=effects.find(x=>x.id===currentEffect);
  if(e){
    let css=e.css;
    if(currentEffect==='matrix'){
      css+=';font-size:4rem;padding:20px 40px;border-radius:8px';
    }
    if(currentEffect==='wave'){
      el.style.display='inline-block';
    }
    el.style.cssText=css;
  }
}

function copyCSS(){
  const e=effects.find(x=>x.id===currentEffect);
  if(e){
    const code=`.${currentEffect}-effect {\n  ${e.css}\n}`;
    navigator.clipboard.writeText(code).then(()=>alert('CSS已复制到剪贴板'));
  }
}

function downloadImage(){
  const canvas=$('saveCanvas');
  const size=800;canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,size,size);
  ctx.textAlign='center';ctx.textBaseline='middle';
  const char=$('charInput').value||'龙';
  ctx.font=`bold ${size*0.4}px "PingFang SC","Noto Sans SC",sans-serif`;
  const e=effects.find(x=>x.id===currentEffect);
  if(currentEffect==='neon'||currentEffect==='neonPink'){
    ctx.shadowColor=currentEffect==='neon'?'#0ff':'#ff6ec7';
    ctx.shadowBlur=30;ctx.fillStyle=currentEffect==='neon'?'#0ff':'#ff6ec7';
  }else if(currentEffect==='fire'){
    ctx.shadowColor='#ff6a00';ctx.shadowBlur=30;
    const grad=ctx.createLinearGradient(size/2,size*0.3,size/2,size*0.7);
    grad.addColorStop(0,'#ff6a00');grad.addColorStop(1,'#ee0979');ctx.fillStyle=grad;
  }else if(currentEffect==='gold'){
    const grad=ctx.createLinearGradient(size*0.3,size*0.3,size*0.7,size*0.7);
    grad.addColorStop(0,'#f5af19');grad.addColorStop(1,'#f12711');ctx.fillStyle=grad;
  }else if(currentEffect==='matrix'){
    ctx.shadowColor='#00ff41';ctx.shadowBlur=20;ctx.fillStyle='#00ff41';
  }else if(currentEffect==='ice'){
    ctx.fillStyle='#a0d2db';ctx.shadowColor='#0ff';ctx.shadowBlur=20;
  }else{
    ctx.fillStyle='#e6edf3';
  }
  ctx.fillText(char,size/2,size/2);
  const link=document.createElement('a');
  link.download=`${char}_${currentEffect}.png`;
  link.href=canvas.toDataURL('image/png');
  link.click();
}

$('charInput').addEventListener('input',updatePreview);
init();updatePreview();selectEffect('neon');
</script>
</body>
</html>
