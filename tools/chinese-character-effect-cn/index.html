<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字特效生成器 - 文字动画与效果</title>
<meta property="og:title" content="汉字特效生成器 - 文字动画与效果">
<meta property="og:description" content="汉字特效生成器 - 多种文字动画效果在线生成 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="汉字特效生成器 - 打字机、故障风、霓虹灯、黑客帝国等多种文字动画效果">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--transition:0.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:800px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px;transition:var(--transition)}
.btn:hover{opacity:.85}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn-secondary{background:var(--border);color:var(--text)}
.input{width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:1rem;text-align:center;margin-bottom:12px}
.input:focus{outline:none;border-color:var(--blue)}
canvas{display:block;margin:12px auto;border:2px solid var(--border);border-radius:var(--radius);background:#000}
.effect-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.effect-tab{padding:12px;text-align:center;background:var(--bg);border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:var(--transition);font-size:.85rem}
.effect-tab:hover{border-color:var(--blue)}
.effect-tab.active{border-color:var(--blue);background:rgba(59,130,246,0.1);color:var(--blue)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.controls label{font-size:.85rem;color:var(--text2)}
.controls input[type="range"]{width:100px}
.controls input[type="color"]{width:32px;height:32px;border:none;border-radius:4px;cursor:pointer}
.color-pick{display:flex;gap:8px;align-items:center;margin:8px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>✨ 汉字特效生成器</h1>
  <p class="sub">多种文字动画效果，在线生成</p>

  <div class="card">
    <input class="input" id="textInput" placeholder="输入文字" value="汉字特效">
    <h3 style="margin:12px 0 8px;font-size:.9rem">选择特效</h3>
    <div class="effect-tabs" id="effectTabs">
      <div class="effect-tab active" onclick="setEffect(this,0)">⌨ 打字机</div>
      <div class="effect-tab" onclick="setEffect(this,1)">⚡ 故障风</div>
      <div class="effect-tab" onclick="setEffect(this,2)">💡 霓虹灯</div>
      <div class="effect-tab" onclick="setEffect(this,3)">🌐 黑客帝国</div>
      <div class="effect-tab" onclick="setEffect(this,4)">💥 粒子爆炸</div>
      <div class="effect-tab" onclick="setEffect(this,5)">🖌 毛笔书写</div>
    </div>
    <div class="controls">
      <label>速度:</label>
      <input type="range" id="speedSlider" min="1" max="10" value="5">
      <label>字号:</label>
      <input type="range" id="sizeSlider" min="16" max="72" value="36">
    </div>
    <div class="color-pick">
      <label style="font-size:.85rem;color:var(--text2)">颜色:</label>
      <input type="color" id="colorPicker" value="#3b82f6">
      <label style="font-size:.85rem;color:var(--text2)">背景:</label>
      <input type="color" id="bgColorPicker" value="#000000">
    </div>
    <canvas id="effectCanvas" width="760" height="300"></canvas>
    <div class="btn-group" style="justify-content:center">
      <button class="btn" onclick="startEffect()">▶ 播放</button>
      <button class="btn btn-secondary" onclick="stopEffect()">⏹ 停止</button>
      <button class="btn btn-secondary" onclick="resetEffect()">↺ 重置</button>
    </div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var canvas, ctx;
var effectType = 0;
var animId = null;
var particles = [];
var frame = 0;
var typingIdx = 0;

var effects = [
  {name:'打字机',start:typewriterStart,update:typewriterUpdate},
  {name:'故障风',start:glitchStart,update:glitchUpdate},
  {name:'霓虹灯',start:neonStart,update:neonUpdate},
  {name:'黑客帝国',start:matrixStart,update:matrixUpdate},
  {name:'粒子爆炸',start:particleStart,update:particleUpdate},
  {name:'毛笔书写',start:brushStart,update:brushUpdate}
];

function init() {
  canvas = document.getElementById('effectCanvas');
  ctx = canvas.getContext('2d');
  startEffect();
}

function setEffect(el, idx) {
  document.querySelectorAll('.effect-tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  effectType = idx;
  resetEffect();
  startEffect();
}

function startEffect() {
  stopEffect();
  frame = 0;
  typingIdx = 0;
  particles = [];
  effects[effectType].start();
  animate();
}

function stopEffect() {
  if (animId) cancelAnimationFrame(animId);
  animId = null;
}

function resetEffect() {
  stopEffect();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function animate() {
  effects[effectType].update();
  animId = requestAnimationFrame(animate);
}

function getText() { return document.getElementById('textInput').value || '汉字特效'; }
function getColor() { return document.getElementById('colorPicker').value; }
function getBgColor() { return document.getElementById('bgColorPicker').value; }
function getSpeed() { return parseInt(document.getElementById('speedSlider').value); }
function getSize() { return parseInt(document.getElementById('sizeSlider').value); }

function typewriterStart() {
  ctx.fillStyle = getBgColor();
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function typewriterUpdate() {
  var text = getText();
  var spd = getSpeed();
  ctx.fillStyle = getBgColor();
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (frame % Math.max(1, 11 - spd) === 0 && typingIdx <= text.length) typingIdx++;
  ctx.font = getSize() + 'px "KaiTi","STKaiti",sans-serif';
  ctx.fillStyle = getColor();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var display = text.substring(0, typingIdx);
  ctx.fillText(display, canvas.width / 2, canvas.height / 2);
  if (frame % 30 < 15) {
    var w = ctx.measureText(display).width;
    ctx.fillRect(canvas.width / 2 + w / 2 + 4, canvas.height / 2 - getSize() / 2, 3, getSize());
  }
  frame++;
}

function glitchStart() { frame = 0; }

function glitchUpdate() {
  var text = getText();
  var spd = getSpeed();
  ctx.fillStyle = getBgColor();
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = 'bold ' + getSize() + 'px "KaiTi","STKaiti",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var glitch = Math.random() < 0.1 * spd;
  if (glitch) {
    for (var i = 0; i < 3; i++) {
      ctx.fillStyle = ['rgba(255,0,0,0.5)', 'rgba(0,255,0,0.5)', 'rgba(0,0,255,0.5)'][i];
      var dx = (Math.random() - 0.5) * 20;
      var dy = (Math.random() - 0.5) * 10;
      ctx.fillText(text, canvas.width / 2 + dx, canvas.height / 2 + dy);
    }
    if (Math.random() < 0.3) {
      var y = Math.random() * canvas.height;
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      ctx.fillRect(0, y, canvas.width, 2 + Math.random() * 4);
    }
  }
  ctx.fillStyle = getColor();
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  frame++;
}

function neonStart() { frame = 0; }

function neonUpdate() {
  var text = getText();
  var spd = getSpeed();
  ctx.fillStyle = getBgColor();
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  var glow = 10 + Math.sin(frame * 0.05 * spd) * 8;
  ctx.save();
  ctx.shadowBlur = glow;
  ctx.shadowColor = getColor();
  ctx.font = 'bold ' + getSize() + 'px "KaiTi","STKaiti",sans-serif';
  ctx.fillStyle = getColor();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  ctx.shadowBlur = glow * 2;
  ctx.globalAlpha = 0.3;
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  ctx.restore();
  frame++;
}

function matrixStart() {
  frame = 0;
  particles = [];
  var text = getText();
  for (var i = 0; i < canvas.width / 16; i++) {
    particles.push({x: i * 16, y: Math.random() * canvas.height, speed: 1 + Math.random() * 4, chars: []});
    for (var j = 0; j < 20; j++) {
      particles[i].chars.push(text[Math.floor(Math.random() * text.length)] || String.fromCharCode(0x4e00 + Math.floor(Math.random() * 100)));
    }
  }
}

function matrixUpdate() {
  var spd = getSpeed();
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = '14px monospace';
  particles.forEach(function(p) {
    for (var i = 0; i < p.chars.length; i++) {
      var y = p.y - i * 16;
      if (y < 0 || y > canvas.height) continue;
      var alpha = 1 - i / p.chars.length;
      if (i === 0) {
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = '#0f0';
        ctx.globalAlpha = alpha * 0.8;
      }
      if (Math.random() < 0.02) p.chars[i] = String.fromCharCode(0x4e00 + Math.floor(Math.random() * 100));
      ctx.fillText(p.chars[i], p.x, y);
    }
    ctx.globalAlpha = 1;
    p.y += p.speed * spd * 0.5;
    if (p.y - p.chars.length * 16 > canvas.height) p.y = 0;
  });
  frame++;
}

function particleStart() {
  frame = 0;
  particles = [];
  var text = getText();
  ctx.font = 'bold ' + getSize() + 'px "KaiTi","STKaiti",sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (var y = 0; y < canvas.height; y += 4) {
    for (var x = 0; x < canvas.width; x += 4) {
      var idx = (y * canvas.width + x) * 4;
      if (imgData.data[idx + 3] > 128) {
        particles.push({x: x, y: y, ox: canvas.width / 2, oy: canvas.height / 2, color: getColor(), size: 2 + Math.random() * 2});
      }
    }
  }
  particles.forEach(function(p) {
    p.tx = canvas.width / 2 + (Math.random() - 0.5) * 400;
    p.ty = canvas.height / 2 + (Math.random() - 0.5) * 200;
    p.x = canvas.width / 2;
    p.y = canvas.height / 2;
    p.vx = (p.tx - p.x) * 0.02;
    p.vy = (p.ty - p.y) * 0.02;
  });
}

function particleUpdate() {
  var spd = getSpeed();
  ctx.fillStyle = getBgColor();
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  particles.forEach(function(p) {
    p.x += p.vx * spd * 0.5;
    p.y += p.vy * spd * 0.5;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
  if (frame > 120) {
    particles.forEach(function(p) {
      p.x += (p.ox - p.x) * 0.05;
      p.y += (p.oy - p.y) * 0.05;
    });
  }
  frame++;
}

function brushStart() {
  frame = 0;
  typingIdx = 0;
  ctx.fillStyle = getBgColor();
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function brushUpdate() {
  var text = getText();
  var spd = getSpeed();
  var sz = getSize();
  if (frame % Math.max(1, 6 - Math.floor(spd / 2)) === 0 && typingIdx <= text.length) typingIdx++;
  ctx.fillStyle = getBgColor();
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.font = 'bold ' + sz + 'px "KaiTi","STKaiti",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var fullW = ctx.measureText(text).width;
  var startX = (canvas.width - fullW) / 2;
  var measuredW = ctx.measureText(text.substring(0, typingIdx)).width;
  ctx.beginPath();
  ctx.rect(0, 0, startX + measuredW + 10, canvas.height);
  ctx.clip();
  ctx.fillStyle = getColor();
  ctx.globalAlpha = 0.15;
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  ctx.globalAlpha = 1;
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  ctx.restore();
  if (typingIdx < text.length && typingIdx > 0) {
    var penX = startX + measuredW;
    ctx.fillStyle = getColor();
    ctx.beginPath();
    ctx.arc(penX, canvas.height / 2, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  frame++;
}

function toggleTheme() {
  var h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
}

init();
</script>
</body>
</html>
