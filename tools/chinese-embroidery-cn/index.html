<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国刺绣鉴赏</title><meta name="description" content="中国刺绣鉴赏 - 在线了解中国四大名绣"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a017;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .2s}.item:hover{transform:translateY(-2px)}.item-title{font-size:1.2rem;font-weight:600;color:var(--gold);margin-bottom:8px}.item-meta{font-size:.9rem;color:var(--text2);margin-bottom:4px}.item-display{font-size:3rem;text-align:center;padding:30px;background:var(--bg);border-radius:8px;margin-bottom:12px;min-height:100px;display:flex;align-items:center;justify-content:center}.item-desc{font-size:.9rem;color:var(--text)}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .2s}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;position:relative}.modal h2{color:var(--gold);margin-bottom:12px}.modal p{color:var(--text2);line-height:1.8;margin-bottom:12px}.close-btn{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer}.theme-toggle{position:fixed;top:8px;right:80px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;color:var(--text);font-size:.75rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="中国刺绣鉴赏"><meta property="og:description" content="中国刺绣鉴赏 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪡</text></svg>"></head><body>

<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🪡 中国刺绣鉴赏</h1><p class="sub">在线了解中国四大名绣</p>
<div class="card"><div class="search-box"><input type="text" id="searchInput" placeholder="搜索刺绣名称..." oninput="filterItems()"></div>
<div class="btn-group"><button class="btn active" onclick="filterByType('all',this)">全部</button><button class="btn" onclick="filterByType('苏绣',this)">苏绣</button><button class="btn" onclick="filterByType('湘绣',this)">湘绣</button><button class="btn" onclick="filterByType('蜀绣',this)">蜀绣</button><button class="btn" onclick="filterByType('粤绣',this)">粤绣</button><button class="btn" onclick="filterByType('双面绣',this)">双面绣</button></div></div>
<div id="itemList"></div></div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="close-btn" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><div id="modalDisplay" class="item-display"></div><p id="modalMeta"></p><p id="modalDesc"></p><p id="modalDetail" style="padding-top:12px;border-top:1px solid var(--border);margin-top:8px"></p></div></div>
<script src="../i18n.js" defer></script>
<script>
var items=[
  {title:'苏绣双面绣猫',type:'苏绣',emoji:'🐱',desc:'苏绣的代表作品，以精细著称，双面绣猫两面图案不同，针法细腻，栩栩如生。',detail:'苏绣以苏州为中心，以精细雅洁著称。双面绣是苏绣的高级技法，正反两面都有图案，且针脚不能外露。'},
  {title:'湘绣狮虎图',type:'湘绣',emoji:'🦁',desc:'湘绣的代表作品，以"鬅毛针"绣制狮虎，毛发蓬松立体，有"绣花能生香，绣鸟能听声"之誉。',detail:'湘绣以湖南长沙为中心，以鬅毛针绣制动物皮毛见长。湘绣色彩丰富，风格豪放，尤善绣制狮虎等猛兽。'},
  {title:'蜀绣芙蓉鲤鱼',type:'蜀绣',emoji:'🐟',desc:'蜀绣的代表作品，以"车拧针"绣制芙蓉鲤鱼，鱼鳞层次分明，栩栩如生。',detail:'蜀绣以四川成都为中心，以针法严谨、线片光亮著称。车拧针是蜀绣的独特针法，适合表现鱼鳞等纹理。'},
  {title:'粤绣龙凤褂',type:'粤绣',emoji:'🐉',desc:'粤绣的代表作品，用于婚嫁的龙凤褂，金银线绣制龙凤图案，金碧辉煌，喜庆华贵。',detail:'粤绣以广东广州为中心，以金银线绣制见长。龙凤褂是粤绣在婚嫁中的经典应用，图案寓意吉祥。'},
  {title:'苏绣牡丹图',type:'苏绣',emoji:'🌺',desc:'苏绣花卉题材的经典作品，以"乱针绣"表现牡丹的层次感，色彩丰富，立体感强。',detail:'乱针绣是苏绣的创新针法，打破传统针法的规律，以长短交叉的线条表现光影和层次，适合绣制油画效果。'},
  {title:'湘绣荷花鲤鱼',type:'湘绣',emoji:'🪷',desc:'湘绣的经典作品，以"掺针"绣制荷花和鲤鱼，色彩过渡自然，意境优美。',detail:'掺针是湘绣的基本针法，通过长短针的交替使用，使色彩过渡自然，适合表现花卉和水景。'},
  {title:'双面绣熊猫',type:'双面绣',emoji:'🐼',desc:'双面绣的精品，正反两面绣出不同的熊猫图案，展现了苏绣双面绣的高超技艺。',detail:'双面绣要求绣工在绣制过程中将线头藏在绣布中间，正反两面都不能看到针脚，技术难度极高。'},
  {title:'粤绣百鸟朝凤',type:'粤绣',emoji:'🦜',desc:'粤绣的经典题材，以金银线绣制百鸟朝凤的宏大场面，色彩华丽，气势恢宏。',detail:'百鸟朝凤是粤绣的传统题材，象征太平盛世。绣制时大量使用金银线，配以彩色丝线，效果金碧辉煌。'},
  {title:'蜀绣芙蓉锦鲤',type:'蜀绣',emoji:'🐠',desc:'蜀绣的经典作品，以精细的针法绣制芙蓉锦鲤，鱼鳞光泽感强，花朵层次分明。',detail:'蜀绣的锦鲤题材最为经典，通过"车拧针"和"滚针"的配合，使鱼鳞呈现出自然的光泽和层次。'},
  {title:'苏绣花鸟图',type:'苏绣',emoji:'🐦',desc:'苏绣花鸟题材的精品，以"平绣"为主，针脚平整，色彩淡雅，富有文人画意境。',detail:'平绣是苏绣的基本针法，要求针脚平整、紧密，丝理清晰。苏绣花鸟图多以传统绘画为蓝本，追求文人画的意境。'},
  {title:'苗绣服饰',type:'湘绣',emoji:'👗',desc:'苗族刺绣的代表作品，以几何纹样和动植物图案为主，色彩鲜艳，富有民族特色。',detail:'苗绣是苗族的传统手工艺，图案多为蝴蝶、龙、花卉等，色彩以红、黄、蓝为主，具有鲜明的民族风格。'},
  {title:'京绣龙袍',type:'苏绣',emoji:'👑',desc:'京绣的代表作品，以金银线绣制龙袍上的龙纹，工艺精湛，是皇家御用刺绣。',detail:'京绣以北京为中心，为宫廷御用。龙袍上的龙纹以金线绣制，用"钉线绣"将金线固定在绣面上，工艺极为精细。'}
];
var currentType='all';
function renderItems(list){
  var el=document.getElementById('itemList');
  var html='';
  list.forEach(function(p,i){
    html+='<div class="item" onclick="showDetail('+items.indexOf(p)+')">';
    html+='<div class="item-title">'+p.emoji+' '+p.title+'</div>';
    html+='<div class="item-meta">'+p.type+'</div>';
    html+='<div class="item-display">'+p.emoji+'</div>';
    html+='<div class="item-desc">'+p.desc.substring(0,60)+'...</div>';
    html+='</div>';
  });
  el.innerHTML=html||'<div class="card" style="text-align:center;color:var(--text2)">未找到匹配的刺绣作品</div>';
}
function filterItems(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=items.filter(function(p){return(p.title.includes(q)||p.desc.includes(q))&&(currentType==='all'||p.type===currentType);});
  renderItems(filtered);
}
function filterByType(type,btn){
  currentType=type;
  document.querySelectorAll('.btn-group .btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterItems();
}
function showDetail(i){
  var p=items[i];
  document.getElementById('modalTitle').textContent=p.title;
  document.getElementById('modalDisplay').textContent=p.emoji;
  document.getElementById('modalMeta').textContent=p.type;
  document.getElementById('modalDesc').textContent=p.desc;
  document.getElementById('modalDetail').textContent=p.detail;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='light'?'dark':'light');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
renderItems(items);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
