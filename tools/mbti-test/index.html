<style>

  header p {

    font-size: 0.9rem;

  }
  /* Card */
  .card {
    background: #161b22;

  /* Start Screen */
  .start-screen { text-align: center; }

  }

    color: #8b949e;
    font-size: 0.9rem;
    line-height: 1.7;
    margin-bottom: 1.5rem;

    margin-bottom: 1.5rem;

  .btn {

  .btn-restart {

  @keyframes pulse {

<body>
<div class="container">
  <header>
    <h1>MBTI十六型人格测试</h1>
    <p>探索你的性格类型 · 20道精简题目</p>
  </header>

  <div class="card">
    <!-- Start Screen -->
    <div id="startScreen" class="start-screen fade-in">
      <div class="logo">🧠</div>
      <h2>欢迎来到 MBTI 人格测试</h2>
      <p>
        基于荣格心理类型理论，从四个维度分析你的性格偏好：<br>
        共 20 道题，每道题请选择「同意」或「不同意」，预计耗时 3-5 分钟。
      </p>
      <div class="dimension-info">
        <div class="dim-item"><strong>E / I</strong> 外向 · 内向</div>
        <div class="dim-item"><strong>S / N</strong> 实感 · 直觉</div>
        <div class="dim-item"><strong>T / F</strong> 思考 · 情感</div>
        <div class="dim-item"><strong>J / P</strong> 判断 · 感知</div>
      </div>
      <button class="btn btn-primary" onclick="startTest()">开始测试</button>
    </div>

    <!-- Question Section -->
    <div id="questionSection" class="question-section">
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="progressText">第 1 / 20 题</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>
      <div class="question-dimension" id="qDimension">E/I</div>
      <div class="question-text" id="qText">题目加载中...</div>
      <div class="btn-group">
        <button class="btn btn-agree" id="btnAgree" onclick="answer(1)">👍 同意</button>
        <button class="btn btn-disagree" id="btnDisagree" onclick="answer(-1)">👎 不同意</button>
      </div>
    </div>

    <!-- Result Section -->
    <div id="resultSection" class="result-section">
      <div class="result-type fade-in">
        <div class="type-icon" id="rIcon">🧠</div>
        <div class="type-code" id="rCode">INTJ</div>
        <div class="type-name" id="rName">建筑师</div>
        <div class="type-name-en" id="rNameEn">Architect</div>
      </div>

      <div class="result-dimensions" id="rDimensions"></div>

      <div class="result-detail fade-in">
        <h3>📖 性格描述</h3>
        <p id="rDesc"></p>

        <h3>💪 优势</h3>
        <ul id="rStrengths"></ul>

        <h3>⚠️ 劣势</h3>
        <ul id="rWeaknesses"></ul>

        <h3>💼 适合职业</h3>
        <ul id="rCareers"></ul>
      </div>

      <div class="result-actions">
        <button class="btn btn-restart" onclick="resetTest()">🔄 重新测试</button>
      </div>
    </div>
  </div>
</div>

// agree  -> first letter (+1), disagree -> second letter (-1)

  { text: "在社交聚会中，我更喜欢主动与陌生人交谈互动。", dim: "EI", agree: "E", disagree: "I" },

];

// ==================== Test Logic ====================
let currentIndex = 0;
let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

function startTest() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('questionSection').classList.add('active');
  currentIndex = 0;
  scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
  showQuestion();
}

function showQuestion() {
  if (currentIndex >= questions.length) {
    showResult();
    return;
  }
  const q = questions[currentIndex];
  document.getElementById('qDimension').textContent = q.dim.replace(/(.)(.)/, "$1 / $2");
  document.getElementById('qText').textContent = q.text;
  const pct = Math.round((currentIndex / questions.length) * 100);
  document.getElementById('progressText').textContent = `第 ${currentIndex + 1} / ${questions.length} 题`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('btnAgree').disabled = false;
  document.getElementById('btnDisagree').disabled = false;
  document.getElementById('questionSection').classList.add('fade-in');
}

function answer(val) {
  document.getElementById('btnAgree').disabled = true;
  document.getElementById('btnDisagree').disabled = true;
  const q = questions[currentIndex];
  // val=1 -> agree, val=-1 -> disagree
  const chosen = val === 1 ? q.agree : q.disagree;
  const other = val === 1 ? q.disagree : q.agree;
  scores[chosen] = (scores[chosen] || 0) + 1;
  scores[other] = (scores[other] || 0) + 0;
  currentIndex++;
  setTimeout(showQuestion, 250);
}

function showResult() {
  document.getElementById('questionSection').classList.remove('active');
  document.getElementById('questionSection').style.display = 'none';
  document.getElementById('resultSection').classList.add('active');
  document.getElementById('resultSection').style.display = 'block';

  const type = scores.E >= scores.I ? 'E' : 'I';
  const sense = scores.S >= scores.N ? 'S' : 'N';
  const think = scores.T >= scores.F ? 'T' : 'F';
  const judge = scores.J >= scores.P ? 'J' : 'P';
  const code = type + sense + think + judge;

  const data = types[code] || types['INTJ'];

  document.getElementById('rIcon').textContent = data.icon;
  document.getElementById('rCode').textContent = code;
  document.getElementById('rName').textContent = data.name;
  document.getElementById('rNameEn').textContent = data.nameEn;
  document.getElementById('rDesc').textContent = data.desc;

  const sl = document.getElementById('rStrengths');
  sl.innerHTML = data.strengths.map(s => '<li>' + s + '</li>').join('');

  const wl = document.getElementById('rWeaknesses');
  wl.innerHTML = data.weaknesses.map(w => '<li>' + w + '</li>').join('');

  const cl = document.getElementById('rCareers');
  cl.innerHTML = data.careers.map(c => '<li>' + c + '</li>').join('');

  // dimension bars
  const dims = document.getElementById('rDimensions');
  const pairs = [
    ['E', 'I', '外向', '内向'],
    ['S', 'N', '实感', '直觉'],
    ['T', 'F', '思考', '情感'],
    ['J', 'P', '判断', '感知']
  ];
  dims.innerHTML = pairs.map(([a, b, la, lb]) => {
    const total = (scores[a] || 0) + (scores[b] || 0) || 1;
    const pctA = Math.round(((scores[a] || 0) / total) * 100);
    const highlighted = scores[a] >= scores[b] ? a : b;
    return `
      <div class="result-dim">
        <div class="dim-label">${la} / ${lb}</div>
        <div class="dim-value">${highlighted}</div>
        <div style="font-size:0.7rem;color:#8b949e;margin-top:0.2rem;">${pctA}% / ${100-pctA}%</div>
      </div>
    `;
  }).join('');

  // scroll to top of result
  document.querySelector('.container').scrollIntoView({ behavior: 'smooth' });
}

function resetTest() {
  document.getElementById('resultSection').classList.remove('active');
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('questionSection').style.display = 'block';
  document.getElementById('startScreen').style.display = 'block';
  currentIndex = 0;
  scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
}
