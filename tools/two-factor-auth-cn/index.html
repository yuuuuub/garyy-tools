<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>两步验证工具 - TOTP/HOTP 生成器</title>
<meta name="description" content="在线两步验证(2FA)工具 - 生成TOTP/HOTP验证码，支持导入导出密钥">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<script src="../i18n.js" defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --bg-card: #161b22; --bg-input: #0d1117;
  --border: #30363d; --text: #e6edf3; --text-secondary: #8b949e;
  --accent: #58a6ff; --accent-hover: #79c0ff; --danger: #f85149;
  --success: #3fb950; --warning: #d2991d; --radius: 8px;
}
[data-theme="light"] { --bg: #f6f8fa; --bg-card: #fff; --bg-input: #fff; --border: #d0d7de; --text: #1f2328; --text-secondary: #656d76; --accent: #0969da; --accent-hover: #0550ae; --danger: #cf222e; --success: #1a7f37; --warning: #9a6700; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; line-height: 1.6; }
.container { max-width: 800px; margin: 0 auto; }
h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), #bc8cff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 8px; }
.subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 32px; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
.card h2 { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
label { display: block; font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 4px; margin-top: 12px; }
input, select, textarea { width: 100%; padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.95rem; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
.row { display: flex; gap: 12px; align-items: flex-end; }
.row > * { flex: 1; }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: 0.2s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-success { background: var(--success); color: #fff; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 6px 12px; font-size: 0.8rem; }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 0.9rem; z-index: 1000; animation: slideIn 0.3s ease; }
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.otp-card { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: var(--bg-input); border-radius: 8px; margin-bottom: 12px; }
.otp-info { flex: 1; }
.otp-name { font-weight: 600; font-size: 1rem; }
.otp-issuer { font-size: 0.8rem; color: var(--text-secondary); }
.otp-code { font-size: 2rem; font-weight: 700; font-family: 'Courier New', monospace; letter-spacing: 6px; color: var(--accent); text-align: center; margin: 8px 0; }
.otp-code.error { color: var(--danger); }
.otp-timer { width: 100%; height: 4px; border-radius: 2px; background: var(--border); margin-top: 8px; overflow: hidden; }
.otp-timer-fill { height: 100%; background: var(--accent); transition: width 1s linear; }
.otp-timer-fill.urgent { background: var(--danger); }
.otp-actions { display: flex; gap: 6px; }
.empty-state { text-align: center; padding: 48px; color: var(--text-secondary); }
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 999; }
.modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 90%; max-width: 500px; }
.modal h3 { margin-bottom: 16px; }
.info-box { padding: 12px; background: var(--bg-input); border-radius: 6px; font-size: 0.85rem; color: var(--text-secondary); margin-top: 8px; }
.format-hint { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }
.secret-display { font-family: monospace; font-size: 1.2rem; letter-spacing: 2px; padding: 12px; background: var(--bg-input); border-radius: 6px; text-align: center; margin: 8px 0; word-break: break-all; }
.qr-area { width: 200px; height: 200px; margin: 12px auto; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #fff; }
.qr-area canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<div class="container">
  <h1>🛡️ 两步验证工具</h1>
  <p class="subtitle">TOTP/HOTP 验证码生成器 · 本地运行，密钥不离开浏览器</p>

  <div class="card">
    <h2>➕ 添加账户</h2>
    <div class="row">
      <div>
        <label>账户名称</label>
        <input id="acct-name" placeholder="例如: user@email.com">
      </div>
      <div>
        <label>服务商</label>
        <input id="acct-issuer" placeholder="例如: Google, GitHub">
      </div>
    </div>
    <label>密钥 (Base32)</label>
    <div class="row">
      <input id="acct-secret" placeholder="输入Base32密钥" style="text-transform:uppercase;font-family:monospace">
      <button class="btn btn-outline btn-sm" onclick="generateSecret()">生成密钥</button>
    </div>
    <p class="format-hint">支持 otpauth:// URI 格式直接粘贴</p>
    <label>算法</label>
    <select id="acct-algo">
      <option value="SHA1">SHA-1</option>
      <option value="SHA256">SHA-256</option>
      <option value="SHA512">SHA-512</option>
    </select>
    <div class="row">
      <div>
        <label>类型</label>
        <select id="acct-type"><option value="totp">TOTP (时间)</option><option value="hotp">HOTP (计数)</option></select>
      </div>
      <div>
        <label>位数</label>
        <select id="acct-digits"><option value="6" selected>6位</option><option value="8">8位</option></select>
      </div>
      <div>
        <label>周期(秒)</label>
        <input id="acct-period" type="number" value="30" min="10" max="120">
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="addAccount()">添加账户</button>
      <button class="btn btn-outline" onclick="showImportModal()">导入 otpauth URI</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="margin:0">🔑 验证码生成器</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="exportAccounts()">导出</button>
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('import-file').click()">导入JSON</button>
      </div>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleFileImport(event)">
    <div id="otp-list"></div>
  </div>
</div>

<input type="hidden" id="modal-type">

<script>
const STORAGE_KEY = 'tfa_accounts';
let accounts = [];
let timers = {};

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function base32Decode(str) {
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  str = str.replace(/[\s=-]/g, '').toUpperCase();
  let bits = '';
  for (const c of str) {
    const val = alphabet.indexOf(c);
    if (val === -1) continue;
    bits += val.toString(2).padStart(5, '0');
  }
  const bytes = new Uint8Array(Math.floor(bits.length / 8));
  for (let i = 0; i < bytes.length; i++) {
    bytes[i] = parseInt(bits.substr(i * 8, 8), 2);
  }
  return bytes;
}

function base32Encode(buffer) {
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  let bits = '';
  for (const b of buffer) bits += b.toString(2).padStart(8, '0');
  let result = '';
  for (let i = 0; i < bits.length; i += 5) {
    const chunk = bits.substr(i, 5).padEnd(5, '0');
    result += alphabet[parseInt(chunk, 2)];
  }
  return result;
}

async function hmacHash(algorithm, key, data) {
  const algoMap = { 'SHA1': 'SHA-1', 'SHA256': 'SHA-256', 'SHA512': 'SHA-512' };
  const cryptoKey = await crypto.subtle.importKey(
    'raw', key, { name: 'HMAC', hash: { name: algoMap[algorithm] || 'SHA-1' } }, false, ['sign']
  );
  const sig = await crypto.subtle.sign('HMAC', cryptoKey, data);
  return new Uint8Array(sig);
}

async function generateTOTP(secret, time, algo, digits, period) {
  const key = base32Decode(secret);
  const counter = Math.floor(time / period);
  const data = new ArrayBuffer(8);
  const view = new DataView(data);
  view.setUint32(4, counter, false);
  const hash = await hmacHash(algo, key, new Uint8Array(data));
  const offset = hash[hash.length - 1] & 0x0f;
  const code = ((hash[offset] & 0x7f) << 24) | (hash[offset + 1] << 16) | (hash[offset + 2] << 8) | hash[offset + 3];
  return (code % Math.pow(10, digits)).toString().padStart(digits, '0');
}

async function generateHOTP(secret, counter, algo, digits) {
  const key = base32Decode(secret);
  const data = new ArrayBuffer(8);
  const view = new DataView(data);
  view.setUint32(4, counter, false);
  const hash = await hmacHash(algo, key, new Uint8Array(data));
  const offset = hash[hash.length - 1] & 0x0f;
  const code = ((hash[offset] & 0x7f) << 24) | (hash[offset + 1] << 16) | (hash[offset + 2] << 8) | hash[offset + 3];
  return (code % Math.pow(10, digits)).toString().padStart(digits, '0');
}

function generateSecret() {
  const bytes = new Uint8Array(20);
  crypto.getRandomValues(bytes);
  document.getElementById('acct-secret').value = base32Encode(bytes);
}

function parseURI(uri) {
  try {
    const url = new URL(uri);
    if (url.protocol !== 'otpauth:') return null;
    const type = url.hostname;
    const label = decodeURIComponent(url.pathname.slice(1));
    const params = Object.fromEntries(url.searchParams);
    return {
      type: type,
      issuer: params.issuer || label.split(':')[0] || '',
      name: label.includes(':') ? label.split(':').slice(1).join(':').trim() : label,
      secret: params.secret,
      algorithm: (params.algorithm || 'SHA1').toUpperCase(),
      digits: parseInt(params.digits || '6'),
      period: parseInt(params.period || '30'),
      counter: parseInt(params.counter || '0')
    };
  } catch (e) { return null; }
}

function addAccount() {
  const name = document.getElementById('acct-name').value.trim();
  const issuer = document.getElementById('acct-issuer').value.trim();
  const secret = document.getElementById('acct-secret').value.replace(/\s/g, '').toUpperCase();
  const algo = document.getElementById('acct-algo').value;
  const type = document.getElementById('acct-type').value;
  const digits = parseInt(document.getElementById('acct-digits').value);
  const period = parseInt(document.getElementById('acct-period').value);

  if (!name || !secret) { toast('请填写账户名称和密钥', 'error'); return; }
  try { base32Decode(secret); } catch (e) { toast('密钥格式无效', 'error'); return; }

  accounts.push({ id: Date.now(), name, issuer, secret, algorithm: algo, type, digits, period, counter: 0 });
  saveAccounts();
  renderOTP();
  document.getElementById('acct-name').value = '';
  document.getElementById('acct-issuer').value = '';
  document.getElementById('acct-secret').value = '';
  toast('账户已添加');
}

function showImportModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="modal">
    <h3>导入 otpauth URI</h3>
    <label>粘贴 otpauth:// URI</label>
    <textarea id="import-uri" rows="3" placeholder="otpauth://totp/Service:user@email.com?secret=XXXX&issuer=Service" style="font-family:monospace;font-size:0.85rem"></textarea>
    <div class="actions">
      <button class="btn btn-primary" onclick="importURI()">导入</button>
      <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

function importURI() {
  const uri = document.getElementById('import-uri').value.trim();
  const parsed = parseURI(uri);
  if (!parsed || !parsed.secret) { toast('URI格式无效', 'error'); return; }
  accounts.push({
    id: Date.now(), name: parsed.name, issuer: parsed.issuer, secret: parsed.secret,
    algorithm: parsed.algorithm, type: parsed.type, digits: parsed.digits,
    period: parsed.period, counter: parsed.counter || 0
  });
  saveAccounts();
  renderOTP();
  document.querySelector('.modal-overlay').remove();
  toast('账户已导入');
}

function deleteAccount(id) {
  if (!confirm('确定删除此账户？')) return;
  accounts = accounts.filter(a => a.id !== id);
  saveAccounts();
  renderOTP();
}

async function renderOTP() {
  const list = document.getElementById('otp-list');
  if (accounts.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🔐</div><p>暂无账户，请添加或导入</p></div>';
    return;
  }

  list.innerHTML = '';
  for (const acct of accounts) {
    const now = Math.floor(Date.now() / 1000);
    let code, timeLeft = 0;
    try {
      if (acct.type === 'totp') {
        code = await generateTOTP(acct.secret, now, acct.algorithm, acct.digits, acct.period);
        timeLeft = acct.period - (now % acct.period);
      } else {
        code = await generateHOTP(acct.secret, acct.counter, acct.algorithm, acct.digits);
        timeLeft = -1;
      }
    } catch (e) {
      code = 'ERROR';
    }

    const card = document.createElement('div');
    card.className = 'otp-card';
    card.innerHTML = `
      <div class="otp-info">
        <div class="otp-name">${esc(acct.name)}</div>
        <div class="otp-issuer">${esc(acct.issuer)} · ${acct.algorithm} · ${acct.type.toUpperCase()}</div>
      </div>
      <div style="text-align:center;min-width:200px">
        <div class="otp-code" id="code-${acct.id}">${code === 'ERROR' ? '❌' : code.replace(/(\d{3})(\d{3})/, '$1 $2')}</div>
        ${timeLeft >= 0 ? `<div class="otp-timer"><div class="otp-timer-fill ${timeLeft <= 5 ? 'urgent' : ''}" id="timer-${acct.id}" style="width:${(timeLeft / acct.period) * 100}%"></div></div>
        <div style="font-size:0.8rem;color:var(--text-secondary);margin-top:4px">${timeLeft}秒后刷新</div>` : `<div style="font-size:0.8rem;color:var(--text-secondary)">计数器: ${acct.counter}</div>`}
      </div>
      <div class="otp-actions">
        <button class="btn btn-outline btn-sm" onclick="copyOTP('${acct.id}')">复制</button>
        ${acct.type === 'hotp' ? `<button class="btn btn-outline btn-sm" onclick="incrementHOTP(${acct.id})">+</button>` : ''}
        <button class="btn btn-danger btn-sm" onclick="deleteAccount(${acct.id})">×</button>
      </div>`;
    list.appendChild(card);
  }
}

function esc(s) { return s.replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

async function copyOTP(id) {
  const el = document.getElementById('code-' + id);
  if (el) {
    await navigator.clipboard.writeText(el.textContent.replace(/\s/g, ''));
    toast('验证码已复制');
  }
}

function incrementHOTP(id) {
  const acct = accounts.find(a => a.id === id);
  if (acct) { acct.counter++; saveAccounts(); renderOTP(); }
}

function saveAccounts() { localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts)); }

function exportAccounts() {
  const blob = new Blob([JSON.stringify(accounts, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '2fa-accounts-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function handleFileImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (Array.isArray(data)) {
        accounts = accounts.concat(data);
        saveAccounts();
        renderOTP();
        toast('导入成功，共 ' + data.length + ' 个账户');
      }
    } catch (err) { toast('导入失败', 'error'); }
  };
  reader.readAsText(file);
}

function updateTimers() {
  const now = Math.floor(Date.now() / 1000);
  for (const acct of accounts) {
    if (acct.type !== 'totp') continue;
    const timeLeft = acct.period - (now % acct.period);
    const timerEl = document.getElementById('timer-' + acct.id);
    if (timerEl) {
      timerEl.style.width = (timeLeft / acct.period) * 100 + '%';
      timerEl.className = 'otp-timer-fill' + (timeLeft <= 5 ? ' urgent' : '');
    }
    if (timeLeft === acct.period) renderOTP();
  }
}

setInterval(updateTimers, 1000);

const saved = localStorage.getItem(STORAGE_KEY);
if (saved) { try { accounts = JSON.parse(saved); } catch (e) { accounts = []; } }
renderOTP();
</script>
</body>
</html>
