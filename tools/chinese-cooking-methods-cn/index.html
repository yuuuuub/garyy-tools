<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中式烹饪方法 - Chinese Cooking Methods</title>
<meta name="description" content="中式烹饪方法详解，炒、蒸、煮、炖、炸、烤、煎、焖八大技法全面解析">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中式烹饪方法 - Chinese Cooking Methods">
<meta property="og:description" content="炒、蒸、煮、炖、炸、烤、煎、焖八大技法全面解析">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-cooking-methods-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
header{background:linear-gradient(135deg,#1a0a00,#2a1505,#3d200a);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3010;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1200px;margin:0 auto;padding:20px}
.method-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:14px}
.method-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all .3s;cursor:pointer;position:relative;overflow:hidden}
.method-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.method-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.method-card .m-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.method-card .m-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;background:rgba(232,168,124,.15);flex-shrink:0}
.method-card .m-name{font-size:1.3em;font-weight:bold}
.method-card .m-en{font-size:.78em;color:var(--text2)}
.method-card .m-stats{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.method-card .m-stat{font-size:.72em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text2)}
.method-card .m-desc{font-size:.85em;color:var(--text2);line-height:1.6;margin-bottom:10px}
.method-card .m-dishes{font-size:.8em;color:var(--accent)}
.method-card .m-dishes strong{color:var(--text)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:14px;padding:28px;max-width:650px;width:100%;max-height:85vh;overflow-y:auto;border:1px solid var(--border)}
.modal h2{font-size:1.5em;margin-bottom:10px}
.modal .close-btn{float:right;background:none;border:none;color:var(--text2);font-size:1.4em;cursor:pointer}
.modal .section{margin-top:16px}
.modal .section-title{font-size:.95em;font-weight:bold;color:var(--accent);margin-bottom:8px}
.modal p{font-size:.85em;color:var(--text2);line-height:1.7}
.modal ul{list-style:none;padding:0;margin-top:6px}
.modal ul li{padding:5px 0;font-size:.83em;color:var(--text2);border-bottom:1px solid var(--border)}
.modal ul li::before{content:'• ';color:var(--accent)}
footer{text-align:center;padding:30px;color:var(--text2);font-size:.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.method-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🍳 中式烹饪方法</h1>
<p>Chinese Cooking Methods — 八大烹饪技法全面解析</p>
</header>
<div class="container">
<div class="method-grid" id="methodGrid"></div>
<footer><p>🍳 中式烹饪方法 — 火候为要，技法为先</p></footer>
</div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="close-btn" id="closeModal">×</button><div id="modalContent"></div></div></div>
<script>
const METHODS=[
{name:"炒",en:"Stir-fry",icon:"🔥",temp:"旺火 180-240°C",time:"1-5分钟",oil:"少量",difficulty:"中等",desc:"中餐最核心的烹饪技法。旺火热油，快速翻炒，保持食材脆嫩和营养。讲究'镬气'——高温产生的独特焦香。",subtypes:["生炒：生料直接下锅翻炒，如清炒时蔬","熟炒：熟料回锅翻炒，如回锅肉","滑炒：上浆后低温滑油再炒，如滑炒肉丝","干炒：不勾芡炒干水分，如干炒牛河","软炒：蛋奶类软嫩食材翻炒","爆炒：极旺火快速翻炒，如爆炒腰花"],dishes:["清炒时蔬","滑炒肉丝","回锅肉","宫保鸡丁","鱼香肉丝","干炒牛河"],tips:["锅要烧热再放油（热锅凉油）","食材切得大小均匀","大火快炒不超过2分钟","肉类要提前腌制上浆"],history:"炒是中国最重要的烹饪技法，'镬气'是炒菜的灵魂。炒法的普及与铁锅的发明密不可分。"},
{name:"蒸",en:"Steam",icon:"♨️",temp:"100°C",time:"5-30分钟",oil:"无或少量",difficulty:"简单",desc:"利用蒸汽加热，最大程度保留食材原味和营养。是中国最健康的烹饪方式之一。广东人最擅长此法。",subtypes:["清蒸：原汁原味，如清蒸鱼","粉蒸：裹米粉蒸制，如粉蒸肉","酿蒸：填充馅料蒸制","包蒸：用荷叶等包裹蒸制","气蒸：利用蒸汽循环加热"],dishes:["清蒸鱼","粉蒸肉","蒸排骨","蒸蛋","蒸包子","蒸螃蟹"],tips:["蒸鱼要水开后放鱼","蒸制时间不可过长","蒸蛋用温水，比例1:1.5","蒸菜要大火，蒸饭要中火"],history:"蒸是中国最古老的烹饪技法之一，可追溯到新石器时代。蒸笼的发明使蒸制更高效。"},
{name:"煮",en:"Boil",icon:"💧",temp:"100°C",time:"5-60分钟",oil:"无或少量",difficulty:"简单",desc:"将食材放入液体中加热至熟。分为白煮、酱煮、卤煮等。汤底可做汤品，是最家常的做法。",subtypes:["白煮：清水煮制，如白切鸡","酱煮：酱油调味煮制","卤煮：卤汁慢煮","水煮：川菜特色麻辣汤底煮制","汆：沸水中快速煮制"],dishes:["白切鸡","水煮牛肉","白煮肉","煮饺","汤圆","水煮鱼"],tips:["煮肉冷水下锅去血沫","煮鱼沸水下锅保持形状","煮饺子水要宽，点三次冷水","煮面不要加冷水"],history:"煮是最原始的烹饪方式之一，中国人在7000年前就开始用水煮食物。"},
{name:"炖",en:"Stew",icon:"🫕",temp:"85-95°C",time:"60-180分钟",oil:"少量",difficulty:"中等",desc:"食材与汤汁一起长时间加热，使味道充分融合。汤汁浓郁，肉质酥烂。是北方和冬季的首选。",subtypes:["清炖：汤清味鲜，如清炖鸡汤","红炖：酱油上色，如红烧肉","隔水炖：汤盅隔水加热","砂锅炖：砂锅慢炖，保温性好"],dishes:["红烧肉","东坡肉","炖鸡汤","炖牛肉","佛跳墙","羊肉汤"],tips:["小火慢炖是关键","水要一次加足","砂锅炖效果最佳","中途不要加冷水"],history:"炖是最温暖的烹饪方式，'慢著火，少著水，火候足时它自美'是苏东坡对炖的精辟总结。"},
{name:"炸",en:"Deep-fry",icon:"🫧",temp:"150-200°C",time:"2-10分钟",oil:"大量",difficulty:"中等",desc:"食材完全浸入热油中加热。外酥里嫩，色泽金黄。需要控制好油温和时间。",subtypes:["干炸：直接裹粉炸，如干炸丸子","软炸：挂蛋糊炸，如软炸里脊","酥炸：多次炸制更酥脆","清炸：不裹任何粉料","脆皮炸：表皮酥脆"],dishes:["糖醋里脊","炸鸡排","干炸丸子","酥肉","春卷","油条"],tips:["油温控制是关键","一般需要复炸（先低温后高温）","食材要沥干水分再下锅","不要一次放太多"],history:"油炸技术在中国有上千年历史，宋代的'油炸桧'（油条）是最著名的油炸食品之一。"},
{name:"烤",en:"Roast",icon:"🔥",temp:"150-250°C",time:"20-120分钟",oil:"少量或无",difficulty:"中等",desc:"利用辐射热加热食材。皮脆肉嫩，香气浓郁。分为明烤、暗烤、叉烧等。",subtypes:["明烤：直接火烤，如烤串","暗烤：烤箱烤制，如烤鸭","叉烧：悬挂烤制","泥烤：裹泥烤制，如叫化鸡","炭烤：炭火烤制"],dishes:["北京烤鸭","叉烧","叫化鸡","烤全羊","烤乳猪","烤串"],tips:["烤鸭要提前风干鸭皮","烤肉注意翻面","烤箱要预热","刷油保持湿润"],history:"烤是最古老的烹饪方式。北京烤鸭源于明代，是烤制技艺的巅峰之作。"},
{name:"煎",en:"Pan-fry",icon:"🍳",temp:"120-180°C",time:"3-10分钟",oil:"少量",difficulty:"简单",desc:"少量油加热，食材单面或双面煎制。外焦里嫩，色泽诱人。家常菜中最常用。",subtypes:["干煎：少油煎制","软煎：挂糊煎制","香煎：煎至焦香","水煎：底部煎制加水焖熟"],dishes:["煎饺","煎蛋","香煎鲈鱼","水煎包","锅贴","煎豆腐"],tips:["煎制时不要频繁翻动","等一面煎定型再翻面","中小火慢煎","用不粘锅更易操作"],history:"煎是中国最家常的烹饪方式之一，煎饺和锅贴是最具代表性的煎制食品。"},
{name:"焖",en:"Braise",icon:"🫕",temp:"85-95°C",time:"15-60分钟",oil:"少量",difficulty:"中等",desc:"先煎炒后加液体，加盖小火慢煮。食材入味，汤汁浓稠。介于炒和炖之间。",subtypes:["红焖：酱油上色","黄焖：黄色酱汁","油焖：少油焖制","黄焖鸡米饭是代表"],dishes:["油焖大虾","黄焖鸡","红焖羊肉","焖面","焖饭"],tips:["焖制时火不能太大","汤汁要收浓但不能烧干","加盖保持蒸汽循环","最后可大火收汁"],history:"焖是炖的简化版，更适合家庭烹饪。黄焖鸡米饭是近年来最受欢迎的焖制快餐。"}
];
function render(){
  document.getElementById('methodGrid').innerHTML=METHODS.map((m,i)=>`
    <div class="method-card" onclick="showDetail(${i})">
      <div class="m-head"><div class="m-icon">${m.icon}</div><div><div class="m-name">${m.name}</div><div class="m-en">${m.en}</div></div></div>
      <div class="m-stats"><span class="m-stat">🌡️ ${m.temp}</span><span class="m-stat">⏱️ ${m.time}</span><span class="m-stat">🫒 ${m.oil}</span><span class="m-stat">${m.difficulty}</span></div>
      <div class="m-desc">${m.desc.substring(0,60)}...</div>
      <div class="m-dishes"><strong>代表菜：</strong>${m.dishes.slice(0,3).join('、')}</div>
    </div>`).join('');
}
function showDetail(idx){
  const m=METHODS[idx];
  document.getElementById('modalContent').innerHTML=`
    <h2>${m.icon} ${m.name} <span style="font-size:.5em;color:var(--text2)">${m.en}</span></h2>
    <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap"><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">🌡️ ${m.temp}</span><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">⏱️ ${m.time}</span><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">🫒 用油：${m.oil}</span><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">难度：${m.difficulty}</span></div>
    <p>${m.desc}</p>
    <div class="section"><div class="section-title">变体分类</div><ul>${m.subtypes.map(s=>`<li>${s}</li>`).join('')}</ul></div>
    <div class="section"><div class="section-title">代表菜品</div><ul>${m.dishes.map(d=>`<li>${d}</li>`).join('')}</ul></div>
    <div class="section"><div class="section-title">💡 烹饪技巧</div><ul>${m.tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>
    <div class="section"><div class="section-title">📖 历史渊源</div><p>${m.history}</p></div>`;
  document.getElementById('modal').classList.add('show');
}
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('show')};
render();
</script>
</body>
</html>
