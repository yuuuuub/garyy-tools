<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG游乐场 - 在线SVG编辑器</title>
<meta name="description" content="SVG在线编辑器，实时编写和预览SVG代码">
<style>
:root {
--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;
}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
nav .logo{font-size:18px;font-weight:600;color:var(--accent2);}
nav a{color:var(--accent);text-decoration:none;font-size:14px;}
nav a:hover{color:var(--accent2);}
.container{display:flex;flex-direction:column;height:calc(100vh - 52px);}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s;}
.btn-primary{background:var(--accent);color:var(--text);}
.btn-primary:hover{background:var(--accent2);}
.btn-secondary{background:var(--border);color:var(--text);}
.btn-secondary:hover{background:#3d444d;}
.workspace{display:flex;flex:1;overflow:hidden;}
.editor-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);}
.preview-panel{flex:1;display:flex;flex-direction:column;}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;font-size:13px;color:var(--accent2);font-weight:500;}
.editor-wrapper{flex:1;position:relative;}
#svgEditor{width:100%;height:100%;background:var(--bg);border:none;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:13px;padding:12px;resize:none;outline:none;line-height:1.6;}
.preview-area{flex:1;display:flex;justify-content:center;align-items:center;background:var(--bg);padding:20px;overflow:auto;}
#svgPreview{max-width:100%;max-height:100%;}
.templates{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;}
.templates span{font-size:12px;color:#8b949e;margin-right:8px;}
.template-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--accent2);cursor:pointer;margin-right:6px;margin-bottom:4px;}
.template-btn:hover{border-color:var(--accent);color:var(--accent);}
@media(max-width:768px){
.workspace{flex-direction:column;}
.editor-panel{border-right:none;border-bottom:1px solid var(--border);}
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="SVG游乐场 - 在线SVG编辑器">
  <meta property="og:description" content="SVG在线编辑器，实时编写和预览SVG代码">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/svg-playground/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<h1 style="text-align:center;padding:20px 0;font-size:1.5rem">SVG游乐场 - 在线SVG编辑器</h1>
<nav>
<span class="logo">SVG游乐场</span>
<a href="/index.html">← 返回工具箱</a>
</nav>
<div class="container">
<div class="toolbar">
<button class="btn btn-primary" onclick="updatePreview()">更新预览</button>
<button class="btn btn-secondary" onclick="downloadSVG()">下载SVG</button>
<button class="btn btn-secondary" onclick="copyCode()">复制代码</button>
<button class="btn btn-secondary" onclick="resetCode()">重置</button>
</div>
<div class="templates">
<span>模板:</span>
<button class="template-btn" data-svg='<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">\n  <circle cx="100" cy="100" r="80" fill="#3b82f6" />\n  <circle cx="100" cy="100" r="60" fill="#1e40af" />\n  <circle cx="100" cy="100" r="40" fill="#60a5fa" />\n</svg>'>圆形</button>
<button class="template-btn" data-svg='<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">\n  <rect x="20" y="20" width="160" height="160" rx="20" fill="#3b82f6" />\n  <rect x="40" y="40" width="120" height="120" rx="15" fill="#60a5fa" />\n  <rect x="60" y="60" width="80" height="80" rx="10" fill="#93c5fd" />\n</svg>'>矩形</button>
<button class="template-btn" data-svg='<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">\n  <defs>\n    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">\n      <stop offset="0%" style="stop-color:#3b82f6" />\n      <stop offset="100%" style="stop-color:#8b5cf6" />\n    </linearGradient>\n  </defs>\n  <polygon points="100,20 180,180 20,180" fill="url(#grad)" />\n</svg>'>三角形</button>
<button class="template-btn" data-svg='<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">\n  <path d="M100 20 L180 80 L155 170 L45 170 L20 80 Z" fill="none" stroke="#3b82f6" stroke-width="3" />\n  <circle cx="100" cy="100" r="40" fill="#3b82f6" opacity="0.3" />\n</svg>'>路径</button>
<button class="template-btn" data-svg='<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">\n  <defs>\n    <radialGradient id="glow" cx="50%" cy="50%" r="50%">\n      <stop offset="0%" style="stop-color:#60a5fa" />\n      <stop offset="100%" style="stop-color:#3b82f6" />\n    </radialGradient>\n  </defs>\n  <circle cx="100" cy="100" r="80" fill="url(#glow)" />\n  <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="3s" repeatCount="indefinite" />\n  <rect x="85" y="40" width="30" height="30" fill="#fff" rx="5">\n    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="3s" repeatCount="indefinite" />\n  </rect>\n</svg>'>动画</button>
<button class="template-btn" data-svg='<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">\n  <defs>\n    <filter id="shadow">\n      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3" />\n    </filter>\n  </defs>\n  <rect x="20" y="40" width="160" height="120" rx="16" fill="#1e293b" filter="url(#shadow)" />\n  <text x="100" y="90" text-anchor="middle" fill="#3b82f6" font-size="24" font-weight="bold">SVG</text>\n  <text x="100" y="120" text-anchor="middle" fill="#94a3b8" font-size="14">阴影效果</text>\n</svg>'>阴影文字</button>
</div>
<div class="workspace">
<div class="editor-panel">
<div class="panel-header">SVG代码</div>
<div class="editor-wrapper">
<textarea id="svgEditor"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6" />
      <stop offset="100%" style="stop-color:#8b5cf6" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="80" fill="url(#grad)" />

  <text x="100" y="105" text-anchor="middle" fill="white" font-size="24" font-weight="bold">SVG</text>
</svg></textarea>
</div>
</div>
<div class="preview-panel">
<div class="panel-header">实时预览</div>
<div class="preview-area">
<div id="svgPreview"></div>
</div>
</div>
</div>
</div>
<script>
const svgEditor=document.getElementById('svgEditor');
const svgPreview=document.getElementById('svgPreview');

function updatePreview(){
try{
const doc=new DOMParser().parseFromString(svgEditor.value,'image/svg+xml');
const err=doc.querySelector('parsererror');
if(err){svgPreview.innerHTML='<p style="color:var(--red)">SVG 解析错误</p>';return;}
svgPreview.innerHTML='';
svgPreview.appendChild(doc.documentElement);
}catch(e){
svgPreview.innerHTML='<p style="color:var(--red)">SVG 解析错误</p>';
}
}

function downloadSVG(){
const blob=new Blob([svgEditor.value],{type:'image/svg+xml'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download='drawing.svg';
a.click();
URL.revokeObjectURL(url);
}

function copyCode(){
navigator.clipboard.writeText(svgEditor.value).then(()=>garyyToast('SVG代码已复制到剪贴板'));
}

function resetCode(){
svgEditor.value='<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">\n  <circle cx="100" cy="100" r="80" fill="#3b82f6" />\n  <text x="100" y="105" text-anchor="middle" fill="white" font-size="24">SVG</text>\n</svg>';
updatePreview();
}

document.querySelectorAll('.template-btn').forEach(btn=>{
btn.onclick=()=>{
svgEditor.value=btn.dataset.svg;
updatePreview();
};
});

svgEditor.addEventListener('input',updatePreview);
updatePreview();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
