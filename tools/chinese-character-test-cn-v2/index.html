<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字测试 v2 - 汉字能力测验</title>
<meta property="og:title" content="汉字测试 v2 - 汉字能力测验">
<meta property="og:description" content="汉字测试 v2 - 在线汉字能力测验与听写练习 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="汉字测试 v2 - 在线汉字能力测验，包含选择题、听写、部首识别等多种模式">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--transition:0.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:800px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px;transition:var(--transition)}
.btn:hover{opacity:.85}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.input{width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:1rem;text-align:center;margin-bottom:12px}
.input:focus{outline:none;border-color:var(--blue)}
.quiz-char{font-size:4rem;text-align:center;margin:20px 0;font-weight:bold}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.option-btn{padding:14px;background:var(--bg);color:var(--text);border:2px solid var(--border);border-radius:8px;cursor:pointer;font-size:1rem;transition:var(--transition);text-align:center}
.option-btn:hover{border-color:var(--blue)}
.option-btn.correct{border-color:var(--green);background:rgba(35,134,54,0.15);color:var(--green)}
.option-btn.wrong{border-color:var(--red);background:rgba(239,68,68,0.15);color:var(--red)}
.option-btn:disabled{cursor:default}
.timer{display:flex;justify-content:center;align-items:center;gap:8px;margin:12px 0;font-size:1.1rem}
.timer-bar{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:8px 0}
.timer-fill{height:100%;background:var(--blue);transition:width .1s linear;border-radius:3px}
.score-board{display:flex;justify-content:center;gap:24px;margin:16px 0}
.score-item{text-align:center}
.score-num{font-size:2rem;font-weight:bold;color:var(--blue)}
.score-label{font-size:.8rem;color:var(--text2)}
.mode-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.mode-tab{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.85rem;transition:var(--transition)}
.mode-tab:hover,.mode-tab.active{border-color:var(--blue);color:var(--blue)}
.difficulty{display:flex;gap:8px;margin:12px 0}
.diff-btn{padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.8rem;transition:var(--transition)}
.diff-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(59,130,246,0.1)}
.dictation-input{font-size:2rem;text-align:center;width:120px;margin:16px auto;display:block;padding:8px}
.result-card{text-align:center;padding:20px}
.result-card .big{font-size:3rem;margin:12px 0}
.history-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--border);font-size:.85rem}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>📝 汉字测试 v2</h1>
  <p class="sub">汉字能力测验 - 选择题、听写、部首识别</p>

  <div class="card" id="startCard">
    <h3 style="margin-bottom:12px">选择模式</h3>
    <div class="mode-tabs" id="modeTabs">
      <div class="mode-tab active" onclick="setMode('choice')">选择题</div>
      <div class="mode-tab" onclick="setMode('dictation')">听写</div>
      <div class="mode-tab" onclick="setMode('radical')">部首识别</div>
    </div>
    <h3 style="margin:16px 0 12px">难度</h3>
    <div class="difficulty">
      <div class="diff-btn active" onclick="setDifficulty(this,0)">基础</div>
      <div class="diff-btn" onclick="setDifficulty(this,1)">中级</div>
      <div class="diff-btn" onclick="setDifficulty(this,2)">高级</div>
    </div>
    <div style="text-align:center">
      <button class="btn" onclick="startQuiz()" style="margin-top:20px">开始测验</button>
    </div>
  </div>

  <div class="card hidden" id="quizCard">
    <div class="timer">
      <span id="timerIcon">⏱</span>
      <span id="timerText">30s</span>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
    <div class="score-board">
      <div class="score-item"><div class="score-num" id="scoreDisplay">0</div><div class="score-label">得分</div></div>
      <div class="score-item"><div class="score-num" id="questionNum">1/10</div><div class="score-label">进度</div></div>
    </div>
    <div id="quizContent"></div>
    <div id="feedbackArea" style="text-align:center;margin:16px 0"></div>
    <div style="text-align:center">
      <button class="btn hidden" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
    </div>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="result-card">
      <h2>测验完成</h2>
      <div class="big" id="finalScore">0</div>
      <div style="color:var(--text2);margin:8px 0" id="finalAccuracy">正确率: 0%</div>
      <div id="finalDetail" style="font-size:.9rem;color:var(--text2);margin:16px 0"></div>
      <button class="btn" onclick="showStart()">再来一次</button>
      <button class="btn btn-secondary" onclick="showHistory()">查看记录</button>
    </div>
  </div>

  <div class="card hidden" id="historyCard">
    <h3 style="margin-bottom:12px">历史记录</h3>
    <div id="historyList"></div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var quizData = {
  basic: [
    {char:'一',pinyin:'yī',meaning:'一',radical:'一',choices:['一','二','三','十']},
    {char:'二',pinyin:'èr',meaning:'二',radical:'二',choices:['一','二','三','人']},
    {char:'三',pinyin:'sān',meaning:'三',radical:'一',choices:['三','王','大','天']},
    {char:'人',pinyin:'rén',meaning:'人',radical:'人',choices:['人','入','八','大']},
    {char:'大',pinyin:'dà',meaning:'大',radical:'大',choices:['大','太','犬','天']},
    {char:'小',pinyin:'xiǎo',meaning:'小',radical:'小',choices:['小','少','水','山']},
    {char:'日',pinyin:'rì',meaning:'太阳/天',radical:'日',choices:['日','目','月','田']},
    {char:'月',pinyin:'yuè',meaning:'月亮/月',radical:'月',choices:['月','日','明','朋']},
    {char:'水',pinyin:'shuǐ',meaning:'水',radical:'水',choices:['水','火','木','冰']},
    {char:'火',pinyin:'huǒ',meaning:'火',radical:'火',choices:['火','水','山','土']},
    {char:'山',pinyin:'shān',meaning:'山',radical:'山',choices:['山','出','石','田']},
    {char:'土',pinyin:'tǔ',meaning:'土/土地',radical:'土',choices:['土','士','干','工']},
    {char:'木',pinyin:'mù',meaning:'树木',radical:'木',choices:['木','本','末','禾']},
    {char:'金',pinyin:'jīn',meaning:'金属/金',radical:'金',choices:['金','鑫','银','铜']},
    {char:'天',pinyin:'tiān',meaning:'天空',radical:'大',choices:['天','夫','太','犬']},
    {char:'田',pinyin:'tián',meaning:'田地',radical:'田',choices:['田','由','甲','申']},
    {char:'口',pinyin:'kǒu',meaning:'嘴',radical:'口',choices:['口','日','目','回']},
    {char:'手',pinyin:'shǒu',meaning:'手',radical:'手',choices:['手','毛','牛','丰']},
    {char:'心',pinyin:'xīn',meaning:'心',radical:'心',choices:['心','必','思','意']},
    {char:'目',pinyin:'mù',meaning:'眼睛',radical:'目',choices:['目','日','耳','自']}
  ],
  intermediate: [
    {char:'学',pinyin:'xué',meaning:'学习',radical:'子',choices:['学','字','李','季']},
    {char:'语',pinyin:'yǔ',meaning:'语言',radical:'讠',choices:['语','说','话','读']},
    {char:'数',pinyin:'shù',meaning:'数字',radical:'攵',choices:['数','教','放','散']},
    {char:'明',pinyin:'míng',meaning:'明亮',radical:'日',choices:['明','朋','期','朝']},
    {char:'春',pinyin:'chūn',meaning:'春天',radical:'日',choices:['春','夏','秋','冬']},
    {char:'花',pinyin:'huā',meaning:'花',radical:'艹',choices:['花','草','茶','药']},
    {char:'风',pinyin:'fēng',meaning:'风',radical:'风',choices:['风','凤','凡','冈']},
    {char:'雨',pinyin:'yǔ',meaning:'雨',radical:'雨',choices:['雨','雪','雷','电']},
    {char:'云',pinyin:'yún',meaning:'云',radical:'二',choices:['云','去','会','动']},
    {char:'龙',pinyin:'lóng',meaning:'龙',radical:'龙',choices:['龙','尤','庞','龚']},
    {char:'国',pinyin:'guó',meaning:'国家',radical:'囗',choices:['国','围','园','圆']},
    {char:'家',pinyin:'jiā',meaning:'家',radical:'宀',choices:['家','字','安','完']},
    {char:'书',pinyin:'shū',meaning:'书',radical:'乙',choices:['书','画','写','字']},
    {char:'画',pinyin:'huà',meaning:'画',radical:'田',choices:['画','书','田','界']},
    {char:'车',pinyin:'chē',meaning:'车',radical:'车',choices:['车','东','转','轮']},
    {char:'马',pinyin:'mǎ',meaning:'马',radical:'马',choices:['马','妈','吗','码']},
    {char:'鸟',pinyin:'niǎo',meaning:'鸟',radical:'鸟',choices:['鸟','鸡','鸭','鹅']},
    {char:'鱼',pinyin:'yú',meaning:'鱼',radical:'鱼',choices:['鱼','渔','鲁','鲜']},
    {char:'牛',pinyin:'niú',meaning:'牛',radical:'牛',choices:['牛','午','件','特']},
    {char:'羊',pinyin:'yáng',meaning:'羊',radical:'羊',choices:['羊','美','样','洋']}
  ],
  advanced: [
    {char:'赢',pinyin:'yíng',meaning:'赢/胜利',radical:'贝',choices:['赢','羸','嬴','蠃']},
    {char:'鬣',pinyin:'liè',meaning:'鬃毛',radical:'髟',choices:['鬣','鬣','鬛','鱲']},
    {char:'饕',pinyin:'tāo',meaning:'贪食',radical:'食',choices:['饕','餮','餍','餍']},
    {char:'爨',pinyin:'cuàn',meaning:'烧火做饭',radical:'火',choices:['爨','爨','灇','斺']},
    {char:'龘',pinyin:'dá',meaning:'龙飞的样子',radical:'龙',choices:['龘','龖','龗','龙']},
    {char:'靐',pinyin:'bìng',meaning:'雷声',radical:'雨',choices:['靐','雷','霬','霊']},
    {char:'齉',pinyin:'nàng',meaning:'鼻子不通气',radical:'鼻',choices:['齉','鼻','齁','齁']},
    {char:'麤',pinyin:'cū',meaning:'粗',radical:'鹿',choices:['麤','粗','鹿','麈']},
    {char:'垚',pinyin:'yáo',meaning:'山高',radical:'土',choices:['垚','堯','窑','遥']},
    {char:'犇',pinyin:'bēn',meaning:'奔跑',radical:'牛',choices:['犇','奔','牛','驽']},
    {char:'淼',pinyin:'miǎo',meaning:'水大',radical:'水',choices:['淼','渺','眇','庙']},
    {char:'焱',pinyin:'yàn',meaning:'火花',radical:'火',choices:['焱','炎','焰','燚']},
    {char:'鑫',pinyin:'xīn',meaning:'财富兴盛',radical:'金',choices:['鑫','金','淼','森']},
    {char:'森',pinyin:'sēn',meaning:'树木多',radical:'木',choices:['森','林','彬','楚']},
    {char:'磊',pinyin:'lěi',meaning:'石头多',radical:'石',choices:['磊','磊','砳','儡']},
    {char:'晶',pinyin:'jīng',meaning:'光亮',radical:'日',choices:['晶','品','吕','昌']},
    {char:'众',pinyin:'zhòng',meaning:'许多人',radical:'人',choices:['众','从','仁','会']},
    {char:'品',pinyin:'pǐn',meaning:'物品',radical:'口',choices:['品','晶','吕','器']},
    {char:'林',pinyin:'lín',meaning:'树林',radical:'木',choices:['林','森','彬','楚']},
    {char:'朋',pinyin:'péng',meaning:'朋友',radical:'月',choices:['朋','明','期','朝']}
  ]
};

var mode = 'choice';
var difficulty = 0;
var questions = [];
var currentQ = 0;
var score = 0;
var correct = 0;
var totalQ = 10;
var timerInterval = null;
var timeLeft = 30;
var history = [];

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
  event.target.classList.add('active');
}

function setDifficulty(el, d) {
  difficulty = d;
  document.querySelectorAll('.diff-btn').forEach(function(b) { b.classList.remove('active'); });
  el.classList.add('active');
}

function startQuiz() {
  var levels = ['basic', 'intermediate', 'advanced'];
  var pool = quizData[levels[difficulty]].slice();
  questions = shuffle(pool).slice(0, totalQ);
  currentQ = 0; score = 0; correct = 0;
  document.getElementById('startCard').classList.add('hidden');
  document.getElementById('quizCard').classList.remove('hidden');
  document.getElementById('resultCard').classList.add('hidden');
  document.getElementById('historyCard').classList.add('hidden');
  showQuestion();
}

function showQuestion() {
  if (currentQ >= questions.length) { endQuiz(); return; }
  var q = questions[currentQ];
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('questionNum').textContent = (currentQ + 1) + '/' + questions.length;
  document.getElementById('feedbackArea').innerHTML = '';
  document.getElementById('nextBtn').classList.add('hidden');

  if (mode === 'choice') {
    showChoiceQuestion(q);
  } else if (mode === 'dictation') {
    showDictationQuestion(q);
  } else {
    showRadicalQuestion(q);
  }
  startTimer(30);
}

function showChoiceQuestion(q) {
  var opts = shuffle(q.choices.slice());
  var html = '<div class="quiz-char">' + q.meaning + '</div>';
  html += '<div style="text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:12px">请选择对应的汉字（拼音: ' + q.pinyin + '）</div>';
  html += '<div class="options">';
  opts.forEach(function(o) {
    html += '<button class="option-btn" onclick="checkChoice(this,\'' + o + '\',\'' + q.char + '\')">' + o + '</button>';
  });
  html += '</div>';
  document.getElementById('quizContent').innerHTML = html;
}

function showDictationQuestion(q) {
  var html = '<div style="text-align:center;font-size:1.2rem;margin:12px 0">听写模式</div>';
  html += '<div class="quiz-char">' + q.pinyin + '</div>';
  html += '<div style="text-align:center;color:var(--text2);margin:8px 0">' + q.meaning + '</div>';
  html += '<button class="btn btn-secondary" onclick="speakChar(\'' + q.char + '\')">🔊 播放读音</button>';
  html += '<input class="input dictation-input" id="dictationInput" placeholder="?" maxlength="1" style="margin-top:16px">';
  html += '<div style="text-align:center"><button class="btn" onclick="checkDictation(\'' + q.char + '\')">确认</button></div>';
  document.getElementById('quizContent').innerHTML = html;
  setTimeout(function() {
    speakChar(q.char);
    document.getElementById('dictationInput').focus();
  }, 300);
  document.getElementById('dictationInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkDictation(q.char);
  });
}

function showRadicalQuestion(q) {
  var allRadicals = ['氵','木','火','土','金','石','口','日','月','山','田','心','手','目','耳','鸟','鱼','马','牛','羊','虫','衣','言','食','女','子','人','大','小','力','刀','弓','马','车','门','雨','风','云','龙','贝','辶','钅','饣','饣','犭','廴','凵','冫','讠'];
  var wrongRadicals = shuffle(allRadicals.filter(function(r) { return r !== q.radical; })).slice(0, 3);
  var opts = shuffle([q.radical].concat(wrongRadicals));
  var html = '<div class="quiz-char">' + q.char + '</div>';
  html += '<div style="text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:12px">请选择"' + q.char + '"的部首</div>';
  html += '<div class="options">';
  opts.forEach(function(o) {
    html += '<button class="option-btn" onclick="checkChoice(this,\'' + o + '\',\'' + q.radical + '\')">' + o + '</button>';
  });
  html += '</div>';
  document.getElementById('quizContent').innerHTML = html;
}

function checkChoice(btn, chosen, correct) {
  var btns = document.querySelectorAll('.option-btn');
  btns.forEach(function(b) { b.disabled = true; });
  if (chosen === correct) {
    btn.classList.add('correct');
    score += 10;
    correct++;
    document.getElementById('feedbackArea').innerHTML = '<div style="color:var(--green);font-size:1.1rem">✓ 正确！</div>';
  } else {
    btn.classList.add('wrong');
    btns.forEach(function(b) { if (b.textContent === correct) b.classList.add('correct'); });
    document.getElementById('feedbackArea').innerHTML = '<div style="color:var(--red);font-size:1.1rem">✗ 错误，正确答案: ' + correct + '</div>';
  }
  clearInterval(timerInterval);
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('nextBtn').classList.remove('hidden');
}

function checkDictation(correctChar) {
  var input = document.getElementById('dictationInput').value.trim();
  var btns = document.querySelectorAll('.option-btn');
  if (input === correctChar) {
    score += 10;
    correct++;
    document.getElementById('feedbackArea').innerHTML = '<div style="color:var(--green);font-size:1.1rem">✓ 正确！</div>';
  } else {
    document.getElementById('feedbackArea').innerHTML = '<div style="color:var(--red);font-size:1.1rem">✗ 错误，正确答案: ' + correctChar + '</div>';
  }
  clearInterval(timerInterval);
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('nextBtn').classList.remove('hidden');
}

function speakChar(ch) {
  if ('speechSynthesis' in window) {
    var u = new SpeechSynthesisUtterance(ch);
    u.lang = 'zh-CN';
    u.rate = 0.8;
    speechSynthesis.speak(u);
  }
}

function nextQuestion() {
  currentQ++;
  showQuestion();
}

function startTimer(sec) {
  timeLeft = sec;
  clearInterval(timerInterval);
  var updateTimer = function() {
    document.getElementById('timerText').textContent = timeLeft + 's';
    document.getElementById('timerFill').style.width = (timeLeft / 30 * 100) + '%';
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      document.getElementById('feedbackArea').innerHTML = '<div style="color:var(--red)">⏱ 时间到！</div>';
      var q = questions[currentQ];
      var correctAns = mode === 'radical' ? q.radical : q.char;
      document.querySelectorAll('.option-btn').forEach(function(b) { b.disabled = true; if (b.textContent === correctAns) b.classList.add('correct'); });
      document.getElementById('nextBtn').classList.remove('hidden');
    }
    timeLeft--;
  };
  updateTimer();
  timerInterval = setInterval(updateTimer, 1000);
}

function endQuiz() {
  clearInterval(timerInterval);
  document.getElementById('quizCard').classList.add('hidden');
  document.getElementById('resultCard').classList.remove('hidden');
  var acc = questions.length > 0 ? Math.round(correct / questions.length * 100) : 0;
  document.getElementById('finalScore').textContent = score + ' 分';
  document.getElementById('finalAccuracy').textContent = '正确率: ' + acc + '% (' + correct + '/' + questions.length + ')';
  var grade = acc >= 90 ? '🏆 优秀' : acc >= 70 ? '👍 良好' : acc >= 50 ? '📖 及格' : '💪 继续努力';
  document.getElementById('finalDetail').textContent = '评级: ' + grade;
  var record = {score: score, accuracy: acc, difficulty: ['基础','中级','高级'][difficulty], mode: ['选择题','听写','部首'][mode === 'choice' ? 0 : mode === 'dictation' ? 1 : 2], time: new Date().toLocaleString()};
  history.unshift(record);
  if (history.length > 20) history.pop();
  localStorage.setItem('chinese_test_history', JSON.stringify(history));
}

function showStart() {
  document.getElementById('startCard').classList.remove('hidden');
  document.getElementById('quizCard').classList.add('hidden');
  document.getElementById('resultCard').classList.add('hidden');
  document.getElementById('historyCard').classList.add('hidden');
}

function showHistory() {
  var stored = localStorage.getItem('chinese_test_history');
  if (stored) history = JSON.parse(stored);
  document.getElementById('resultCard').classList.add('hidden');
  document.getElementById('historyCard').classList.remove('hidden');
  if (history.length === 0) {
    document.getElementById('historyList').innerHTML = '<div style="text-align:center;color:var(--text2);padding:20px">暂无记录</div>';
    return;
  }
  var html = '';
  history.slice(0, 20).forEach(function(h) {
    html += '<div class="history-item"><span>' + h.difficulty + ' · ' + h.mode + ' · ' + h.score + '分</span><span style="color:var(--text2)">' + h.time + '</span></div>';
  });
  document.getElementById('historyList').innerHTML = html;
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var stored = localStorage.getItem('chinese_test_history');
if (stored) history = JSON.parse(stored);
</script>
