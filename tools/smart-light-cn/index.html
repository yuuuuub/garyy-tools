<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💡 智能灯光控制</title>
<meta name="description" content="智能灯光亮度、色温、颜色调节，支持场景模式与定时">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.light-preview{text-align:center;padding:30px;border-radius:var(--radius);background:var(--bg);margin-bottom:16px}
.light-bulb{width:100px;height:100px;border-radius:50%;margin:0 auto 16px;transition:all .3s;box-shadow:0 0 50px rgba(255,255,255,.3)}
.light-bulb.on{box-shadow:0 0 80px rgba(255,255,255,.6)}
.light-status{font-size:1.2rem;font-weight:600;margin-bottom:16px}
.light-btn{padding:12px 24px;border-radius:8px;border:none;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
.light-btn.on{background:var(--success);color:#fff}
.light-btn.off{background:var(--danger);color:#fff}
.control-group{margin-bottom:20px}
.control-label{display:flex;justify-content:space-between;margin-bottom:8px;font-size:.9rem}
.control-value{color:var(--accent);font-weight:600}
.slider{width:100%;accent-color:var(--accent)}
.color-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.color-option{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s}
.color-option:hover{transform:scale(1.1)}
.color-option.active{border-color:var(--text);box-shadow:0 0 10px rgba(255,255,255,.5)}
.scene-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.scene-card{padding:16px;border-radius:8px;background:var(--bg);border:1px solid var(--border);text-align:center;cursor:pointer;transition:all .2s}
.scene-card:hover{border-color:var(--accent)}
.scene-card.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.scene-icon{font-size:2rem;margin-bottom:8px}
.scene-name{font-size:.9rem}
.group-list{display:flex;flex-direction:column;gap:8px}
.group-item{padding:12px;background:var(--bg);border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.group-info{display:flex;align-items:center;gap:12px}
.group-icon{font-size:1.5rem}
.group-name{font-weight:600}
.group-count{font-size:.85rem;color:var(--text2)}
.schedule-item{padding:12px;background:var(--bg);border-radius:8px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.schedule-time{font-weight:600}
.schedule-action{font-size:.85rem;color:var(--text2)}
.settings-group{margin-bottom:16px}
.settings-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px}
.settings-group input[type=text],.settings-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
.toggle-group{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.toggle-group:last-child{border-bottom:none}
.toggle{width:50px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background .2s;cursor:pointer}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s}
.toggle.on::after{transform:translateX(24px)}
button{padding:8px 16px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="💡 智能灯光控制">
<meta property="og:description" content="智能灯光亮度、色温、颜色调节，支持场景模式与定时">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>💡 智能灯光控制</h1><p>调节亮度、色温与颜色，打造理想光环境</p></div>

<div class="cd">
<div class="light-preview">
<div class="light-bulb" id="lightBulb" style="background:rgb(255,220,180)"></div>
<div class="light-status" id="lightStatus">灯光已关闭</div>
<button class="light-btn off" id="lightBtn" onclick="toggleLight()">开启</button>
</div>
</div>

<div class="cd">
<h2>亮度调节</h2>
<div class="control-group">
<div class="control-label"><span>亮度</span><span class="control-value" id="brightnessValue">80%</span></div>
<input type="range" class="slider" id="brightnessSlider" min="0" max="100" value="80" oninput="updateBrightness()">
</div>
<div class="control-group">
<div class="control-label"><span>色温</span><span class="control-value" id="colorTempValue">4000K</span></div>
<input type="range" class="slider" id="colorTempSlider" min="2700" max="6500" value="4000" oninput="updateColorTemp()">
<div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2)"><span>暖光</span><span>冷光</span></div>
</div>
</div>

<div class="cd">
<h2>颜色选择</h2>
<div class="color-picker" id="colorPicker"></div>
<div style="text-align:center;margin-top:12px">
<input type="color" id="customColor" value="#ffcc80" onchange="setCustomColor(this.value)">
<span style="margin-left:8px;font-size:.85rem;color:var(--text2)">自定义颜色</span>
</div>
</div>

<div class="cd">
<h2>场景模式</h2>
<div class="scene-grid" id="sceneGrid"></div>
</div>

<div class="cd">
<h2>灯组管理</h2>
<div class="group-list" id="groupList"></div>
<div style="margin-top:12px">
<button onclick="addGroup()">+ 添加灯组</button>
</div>
</div>

<div class="cd">
<h2>定时计划</h2>
<div id="scheduleList"></div>
<div style="margin-top:12px">
<button onclick="addSchedule()">+ 添加计划</button>
</div>
</div>

<div class="cd">
<h2>灯光设置</h2>
<div class="settings-group">
<label>灯光名称</label>
<input type="text" id="lightName" value="客厅主灯" onchange="saveSettings()">
</div>
<div class="toggle-group">
<span>渐变效果</span>
<div class="toggle on" id="fadeToggle" onclick="toggleSetting('fade')"></div>
</div>
<div class="toggle-group">
<span>日出模拟</span>
<div class="toggle" id="sunriseToggle" onclick="toggleSetting('sunrise')"></div>
</div>
<div class="toggle-group">
<span>日落模拟</span>
<div class="toggle on" id="sunsetToggle" onclick="toggleSetting('sunset')"></div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let isOn=JSON.parse(localStorage.getItem('sli_on')||'false');
let brightness=80;
let colorTemp=4000;
let currentColor='#ffcc80';
let currentScene='normal';
let schedules=JSON.parse(localStorage.getItem('sli_schedules')||'[]');
let settings=JSON.parse(localStorage.getItem('sli_settings')||'{"name":"客厅主灯","fade":true,"sunrise":false,"sunset":true}');
const colors=['#ff6b6b','#ff8e53','#ffc107','#4caf50','#2196f3','#9c27b0','#e91e63','#00bcd4','#ffcc80','#ffffff'];
const scenes=[
  {id:'normal',icon:'☀️',name:'日常'},
  {id:'reading',icon:'📖',name:'阅读'},
  {id:'movie',icon:'🎬',name:'影院'},
  {id:'sleep',icon:'🌙',name:'睡眠'},
  {id:'party',icon:'🎉',name:'派对'},
  {id:'romantic',icon:'🕯️',name:'浪漫'}
];
const groups=[
  {id:1,name:'客厅灯光',icon:'🛋️',count:3},
  {id:2,name:'卧室灯光',icon:'🛏️',count:2},
  {id:3,name:'厨房灯光',icon:'🍳',count:2}
];

function saveSchedules(){localStorage.setItem('sli_schedules',JSON.stringify(schedules));}
function saveSettings(){localStorage.setItem('sli_settings',JSON.stringify(settings));}

function updateUI(){
  $('lightName').value=settings.name;
  ['fade','sunrise','sunset'].forEach(key=>{
    $(key+'Toggle').className='toggle '+(settings[key]?'on':'');
  });
  updateLightPreview();
}

function updateLightPreview(){
  if(isOn){
    const r=Math.round(255*(colorTemp/6500));
    const g=Math.round(220*(brightness/100));
    const b=Math.round(180*(6500/colorTemp));
    $('lightBulb').style.background=currentColor||`rgb(${r},${g},${b})`;
    $('lightBulb').style.boxShadow=`0 0 ${80*(brightness/100)}px ${currentColor||`rgba(${r},${g},${b},0.6)`}`;
    $('lightBulb').className='light-bulb on';
  }else{
    $('lightBulb').style.background='#333';
    $('lightBulb').style.boxShadow='none';
    $('lightBulb').className='light-bulb';
  }
  $('lightStatus').textContent=isOn?'灯光已开启':'灯光已关闭';
  $('lightBtn').textContent=isOn?'关闭':'开启';
  $('lightBtn').className='light-btn '+(isOn?'on':'off');
}

function toggleLight(){
  isOn=!isOn;
  updateLightPreview();
}

function updateBrightness(){
  brightness=$('brightnessSlider').value;
  $('brightnessValue').textContent=brightness+'%';
  updateLightPreview();
}

function updateColorTemp(){
  colorTemp=$('colorTempSlider').value;
  $('colorTempValue').textContent=colorTemp+'K';
  updateLightPreview();
}

function renderColors(){
  $('colorPicker').innerHTML=colors.map(c=>`
    <div class="color-option ${c===currentColor?'active':''}" style="background:${c}" onclick="setColor('${c}')"></div>
  `).join('');
}

function setColor(color){
  currentColor=color;
  renderColors();
  updateLightPreview();
}

function setCustomColor(color){
  currentColor=color;
  renderColors();
  updateLightPreview();
}

function renderScenes(){
  $('sceneGrid').innerHTML=scenes.map(s=>`
    <div class="scene-card ${s.id===currentScene?'active':''}" onclick="setScene('${s.id}')">
      <div class="scene-icon">${s.icon}</div>
      <div class="scene-name">${s.name}</div>
    </div>
  `).join('');
}

function setScene(sceneId){
  currentScene=sceneId;
  switch(sceneId){
    case 'normal':brightness=80;colorTemp=4000;break;
    case 'reading':brightness=90;colorTemp=4500;break;
    case 'movie':brightness=20;colorTemp=2700;break;
    case 'sleep':brightness=5;colorTemp=2700;break;
    case 'party':brightness=100;colorTemp=6500;break;
    case 'romantic':brightness=30;colorTemp=2700;break;
  }
  $('brightnessSlider').value=brightness;
  $('colorTempSlider').value=colorTemp;
  $('brightnessValue').textContent=brightness+'%';
  $('colorTempValue').textContent=colorTemp+'K';
  renderScenes();
  updateLightPreview();
}

function renderGroups(){
  $('groupList').innerHTML=groups.map(g=>`
    <div class="group-item">
      <div class="group-info">
        <div class="group-icon">${g.icon}</div>
        <div>
          <div class="group-name">${g.name}</div>
          <div class="group-count">${g.count}个灯</div>
        </div>
      </div>
      <button onclick="toggleGroup(${g.id})">${isOn?'关闭':'开启'}</button>
    </div>
  `).join('');
}

function addGroup(){
  const name=prompt('输入灯组名称:');
  if(name){
    groups.push({id:Date.now(),name,icon:'💡',count:1});
    renderGroups();
  }
}

function toggleGroup(id){
  // Toggle all lights in group
}

function renderSchedules(){
  $('scheduleList').innerHTML=schedules.map((s,i)=>`
    <div class="schedule-item">
      <div>
        <div class="schedule-time">${s.time}</div>
        <div class="schedule-action">${s.action==='on'?'开启':'关闭'}灯光</div>
      </div>
      <button onclick="removeSchedule(${i})" style="background:var(--danger)">删除</button>
    </div>
  `).join('');
}

function addSchedule(){
  const time=prompt('设置时间 (HH:MM):');
  const action=prompt('操作 (on/off):');
  if(time&&action){
    schedules.push({time,action});
    saveSchedules();
    renderSchedules();
  }
}

function removeSchedule(index){
  schedules.splice(index,1);
  saveSchedules();
  renderSchedules();
}

function toggleSetting(key){
  settings[key]=!settings[key];
  saveSettings();
  updateUI();
}

// Initialize
if(schedules.length===0){
  schedules=[
    {time:'18:00',action:'on'},
    {time:'23:00',action:'off'}
  ];
  saveSchedules();
}

updateUI();
renderColors();
renderScenes();
renderGroups();
renderSchedules();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
