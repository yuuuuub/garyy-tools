<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥩 蛋白质需求计算器</title>
<meta property="og:title" content="🥩 蛋白质需求计算器">
<meta property="og:description" content="🥩 蛋白质需求计算器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线蛋白质每日需求量计算器，根据体重和运动量计算所需蛋白质克数">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.goal-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.goal-tab{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);font-size:13px;cursor:pointer;transition:all .2s;font-weight:500}
.goal-tab.active{border-color:var(--accent);background:var(--accent);color:#fff}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-group label{font-size:12px;color:var(--text-secondary);font-weight:500}
.input-group input{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;transition:all .2s}
.input-group input:focus{outline:none;border-color:var(--accent)}
.calc-btn{width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.calc-btn:hover{background:var(--accent-hover)}
.result-main{background:var(--tag-bg);border-radius:12px;padding:20px;text-align:center;margin-top:12px}
.result-val{font-size:48px;font-weight:800;color:var(--accent)}
.result-unit{font-size:14px;color:var(--text-secondary)}
.result-sub{font-size:13px;color:var(--text-secondary);margin-top:8px}
.food-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.food-item{background:var(--card-bg);border-radius:10px;padding:12px;text-align:center;border:1px solid var(--border)}
.food-item .emoji{font-size:24px}
.food-item .name{font-size:11px;color:var(--text-secondary);margin-top:4px}
.food-item .val{font-size:14px;font-weight:700;color:var(--accent);margin-top:2px}
.progress-bar{height:12px;background:var(--border);border-radius:6px;margin-top:12px;overflow:hidden}
.progress-fill{height:100%;border-radius:6px;transition:width .5s}
.tip{font-size:12px;color:var(--text-secondary);margin-top:12px;line-height:1.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🥩 蛋白质需求计算器</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">🎯 目标</div>
<div class="goal-tabs" id="goalTabs">
<div class="goal-tab active" data-mult="0.8" onclick="setGoal(this)">维持健康</div>
<div class="goal-tab" data-mult="1.2" onclick="setGoal(this)">轻度运动</div>
<div class="goal-tab" data-mult="1.6" onclick="setGoal(this)">中度运动</div>
<div class="goal-tab" data-mult="2.0" onclick="setGoal(this)">增肌塑形</div>
<div class="goal-tab" data-mult="2.2" onclick="setGoal(this)">高强度训练</div>
</div>
<div class="input-row">
<div class="input-group">
<label>体重（kg）</label>
<input type="number" id="weight" placeholder="65" min="20" max="250">
</div>
<div class="input-group">
<label>每公斤体重（g/kg）</label>
<input type="number" id="perKg" placeholder="1.6" step="0.1" min="0.5" max="4">
</div>
</div>
<button class="calc-btn" onclick="calculate()">🥩 计算蛋白质需求</button>
</div>
<div class="card" id="resultCard" style="display:none">
<div class="card-title">📊 蛋白质需求</div>
<div class="result-main">
<div class="result-val" id="proteinVal">--</div>
<div class="result-unit">克/天</div>
<div class="result-sub" id="proteinSub"></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="proteinBar" style="width:0;background:var(--accent)"></div></div>
<div class="food-grid" id="foodGrid"></div>
</div>
<div class="card">
<div class="card-title">ℹ️ 说明</div>
<div class="tip">
• 普通人建议：0.8-1.0 g/kg 体重<br>
• 运动人群建议：1.2-2.0 g/kg 体重<br>
• 增肌期建议：1.6-2.2 g/kg 体重<br>
• 蛋白质来源：鸡蛋(13g/个)、鸡胸肉(31g/100g)、牛肉(26g/100g)、豆腐(8g/100g)
</div>
</div>
<div class="footer">Gary's Tools · 蛋白质摄入仅供参考</div>
</div>
<script>
let currentMult=0.8;
function setGoal(el){
document.querySelectorAll('.goal-tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
currentMult=parseFloat(el.dataset.mult);
document.getElementById('perKg').value=currentMult;
}
function calculate(){
const w=parseFloat(document.getElementById('weight').value);
const perKg=parseFloat(document.getElementById('perKg').value)||currentMult;
if(!w){alert('请输入体重');return}
const protein=Math.round(w*perKg);
const proteinCal=protein*4;
const pct=Math.min(100,(protein/(w*3))*100);
document.getElementById('proteinVal').textContent=protein+'g';
document.getElementById('proteinSub').textContent=`每公斤体重 ${perKg}g，占体重 ${(perKg).toFixed(1)}g/kg`;
document.getElementById('proteinBar').style.width=pct+'%';
const foods=[
{emoji:'🥚',name:'鸡蛋',val:Math.ceil(protein/6.5)+'个',per:'6.5g/个'},
{emoji:'🍗',name:'鸡胸肉',val:Math.round(protein/3.1)+'g',per:'31g/100g'},
{emoji:'🥩',name:'牛肉',val:Math.round(protein/2.6)+'g',per:'26g/100g'},
{emoji:'🐟',name:'三文鱼',val:Math.round(protein/2.0)+'g',per:'20g/100g'},
{emoji:'🫘',name:'豆腐',val:Math.round(protein/0.8)+'g',per:'8g/100g'},
{emoji:'🥛',name:'牛奶',val:Math.round(protein/0.034)+'ml',per:'3.4g/100ml'}
];
document.getElementById('foodGrid').innerHTML=foods.map(f=>
`<div class="food-item"><div class="emoji">${f.emoji}</div><div class="name">${f.name}</div><div class="val">${f.val}</div><div class="name">${f.per}</div></div>`
).join('');
document.getElementById('resultCard').style.display='block';
}
function toggleTheme(){
const html=document.documentElement;
const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
html.setAttribute('data-theme',next);
document.querySelector('.theme-toggle').textContent=next==='dark'?'☀️':'🌙';
}
document.getElementById('perKg').value=currentMult;
</script>
</body>
</html>
