<style>

.review-item {display: flex;

padding: 10px 14px;
background: rgba(248, 113, 113, 0.08);

border: 1px solid rgba(248, 113, 113, 0.15);

.review-question { color: var(--text); }
.review-wrong { color: var(--error); text-decoration: line-through; margin-right: 6px; }

.progress-grid {display: grid;

border: 1px solid rgba(255,255,255,0.04)}
.progress-val { font-size: 1.3rem; font-weight: 700; }
.progress-lbl { font-size: 0.68rem; color: var(--text-secondary); margin-top: 2px; }
.canvas-overlay {position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;

::-webkit-scrollbar { width: 4px; }

<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>

<div class="header">
  <h1>口算练习</h1>
  <div class="subtitle">数学思维训练</div>
</div>

<div class="container">

  <div class="card">
    <div class="section-title">练习模式</div>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="practice" id="modePractice">自由练习</button>
      <button class="mode-btn" data-mode="timed" id="modeTimed">计时挑战</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">难度等级</div>
    <div class="grade-selector" id="gradeSelector">
      <button class="grade-btn" data-grade="0">幼小衔接</button>
      <button class="grade-btn active" data-grade="1">1-2年级</button>
      <button class="grade-btn" data-grade="2">3-4年级</button>
      <button class="grade-btn" data-grade="3">5-6年级</button>
      <button class="grade-btn" data-grade="4">中学</button>
      <button class="grade-btn" data-grade="5">成人</button>
    </div>
    <div class="settings-row" style="margin-top:14px;">
      <div class="setting-group">
        <label>最小数</label>
        <input type="number" id="numMin" value="1" min="0" max="9999">
      </div>
      <div class="setting-group">
        <label>最大数</label>
        <input type="number" id="numMax" value="20" min="1" max="99999">
      </div>
      <label class="op-checkbox checked" id="opAdd"><span>+</span> 加法</label>
      <label class="op-checkbox checked" id="opSub"><span>-</span> 减法</label>
      <label class="op-checkbox" id="opMul"><span>×</span> 乘法</label>
      <label class="op-checkbox" id="opDiv"><span>÷</span> 除法</label>
    </div>
  </div>

  <div class="card game-area" id="gameCard">
    <div id="timerSection" style="display:none;">
      <div class="timer-display">
        <div class="timer-item">
          <div class="timer-value" id="timerDisplay">60</div>
          <div class="timer-label">剩余时间</div>
        </div>
        <div class="timer-item">
          <div class="timer-value" id="scoreDisplay" style="color:var(--accent)">0</div>
          <div class="timer-label">得分</div>
        </div>
        <div class="timer-item">
          <div class="timer-value" id="comboDisplay" style="color:var(--warning)">0</div>
          <div class="timer-label">连击</div>
        </div>
      </div>
    </div>

    <div id="practiceScore" style="text-align:center; margin-bottom:12px; display:none;">
      <span style="font-size:1.1rem; color:var(--text-secondary);">已答 <b style="color:var(--accent);" id="practiceTotal">0</b> 题，正确 <b style="color:var(--success);" id="practiceCorrect">0</b> 题</span>
    </div>

    <div id="preGame" style="text-align:center;">
      <p style="color:var(--text-secondary); margin-bottom:16px; font-size:1.05rem;" id="preGameText">
        准备好开始口算练习了吗？
      </p>
      <button class="start-btn" id="btnStart">开始练习</button>
    </div>

    <div id="inGame" style="display:none;">
      <div class="question-box" id="questionBox">
        <div class="question-text" id="questionText">8 + 5 = ?</div>
        <div class="question-feedback" id="questionFeedback"></div>
      </div>
      <div class="number-line-container" id="numberLineContainer">
        <div class="number-line-label"></div>
        <div class="number-line">
          <div class="number-line-track"></div>
          <div class="number-line-marks" id="numberLineMarks"></div>
          <div class="number-line-pointer" id="numberLinePointer" style="left:20px;"></div>
        </div>
        <div class="number-line-labels" id="numberLineLabels"></div>
      </div>
      <div class="answer-row">
        <input type="number" class="answer-input" id="answerInput" placeholder="?" autocomplete="off" inputmode="numeric">
        <button class="submit-btn" id="btnSubmit">确定</button>
      </div>
    </div>

    <div id="postGame" style="display:none;">
      <div class="result-summary" id="resultSummary"></div>
      <div id="wrongReview" style="margin-top:12px;"></div>
      <button class="start-btn" id="btnRetry" style="margin-top:16px; font-size:1rem; padding:12px 32px;">再来一次</button>
    </div>
  </div>

  <div class="card" style="text-align:center;">
    <div class="section-title">每日挑战</div>
    <div id="dailyChallenge">
      <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:8px;" id="dailyText">加载中...</p>
      <div id="dailyBadge"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">练习记录</div>
    <div class="progress-grid" id="progressGrid">
      <div class="progress-item">
        <div class="progress-val" id="statTotal">0</div>
        <div class="progress-lbl">累计答题</div>
      </div>
      <div class="progress-item">
        <div class="progress-val" style="color:var(--success)" id="statCorrect">0</div>
        <div class="progress-lbl">累计正确</div>
      </div>
      <div class="progress-item">
        <div class="progress-val" style="color:var(--accent)" id="statBest">0</div>
        <div class="progress-lbl">最高分</div>
      </div>
      <div class="progress-item">
        <div class="progress-val" style="color:var(--warning)" id="statStreak">0</div>
        <div class="progress-lbl">连续天数</div>
      </div>
      <div class="progress-item">
        <div class="progress-val" style="color:var(--grade-0)" id="statAccuracy">-</div>
        <div class="progress-lbl">正确率</div>
      </div>
    </div>
  </div>

</div>

<canvas class="canvas-overlay" id="confettiCanvas"></canvas>
<div class="stars-burst" id="starsBurst"></div>

<script>
const gradeConfig = {
  0: { name: '幼小衔接', min: 0, max: 10, ops: ['+'] },
  1: { name: '1-2年级', min: 1, max: 20, ops: ['+', '-'] },
  2: { name: '3-4年级', min: 1, max: 100, ops: ['+', '-', '×', '÷'] },
  3: { name: '5-6年级', min: 1, max: 1000, ops: ['+', '-', '×', '÷'] },
  4: { name: '中学', min: -50, max: 500, ops: ['+', '-', '×', '÷'] },
  5: { name: '成人', min: -999, max: 9999, ops: ['+', '-', '×', '÷'] },
};
let state = {
  mode: 'practice',
  grade: 1,
  numMin: 1,
  numMax: 20,
  operations: ['+', '-'],
  running: false,
  question: null,
  score: 0,
  combo: 0,
  maxCombo: 0,
  timeLeft: 60,
  timerInterval: null,
  totalAnswered: 0,
  correctAnswered: 0,
  wrongList: [],
  practiceTotal: 0,
  practiceCorrect: 0,
  dailyTarget: 20,
  dailyDone: 0,
  dailyDate: '',
};
const $ = id => document.getElementById(id);
const preGame = $('preGame');
const inGame = $('inGame');
const postGame = $('postGame');
const questionText = $('questionText');
const questionBox = $('questionBox');
const questionFeedback = $('questionFeedback');
const answerInput = $('answerInput');
const timerDisplay = $('timerDisplay');
const timerSection = $('timerSection');
const scoreDisplay = $('scoreDisplay');
const comboDisplay = $('comboDisplay');
const practiceScore = $('practiceScore');
const practiceTotal = $('practiceTotal');
const practiceCorrect = $('practiceCorrect');
const numberLineContainer = $('numberLineContainer');
const numberLinePointer = $('numberLinePointer');
const numberLineMarks = $('numberLineMarks');
const numberLineLabels = $('numberLineLabels');
const resultSummary = $('resultSummary');
const wrongReview = $('wrongReview');
const preGameText = $('preGameText');
const dailyText = $('dailyText');
const dailyBadge = $('dailyBadge');
const confettiCanvas = $('confettiCanvas');
const ctx = confettiCanvas.getContext('2d');
$('modePractice').addEventListener('click', () => setMode('practice'));
$('modeTimed').addEventListener('click', () => setMode('timed'));
document.querySelectorAll('#gradeSelector .grade-btn').forEach(btn => {
  btn.addEventListener('click', () => setGrade(parseInt(btn.dataset.grade)));
});
document.querySelectorAll('.op-checkbox').forEach(el => {
  el.addEventListener('click', () => {
    const opMap = { opAdd: '+', opSub: '-', opMul: '×', opDiv: '÷' };
    const op = opMap[el.id];
    if (el.classList.contains('checked')) {
      if (state.operations.length > 1) {
        el.classList.remove('checked');
        state.operations = state.operations.filter(o => o !== op);
      }
    } else {
      el.classList.add('checked');
      if (!state.operations.includes(op)) state.operations.push(op);
    }
    updateGradeBtnActive();
  });
});
$('numMin').addEventListener('change', () => {
  state.numMin = parseInt($('numMin').value) || 0;
  updateGradeBtnActive();
});
$('numMax').addEventListener('change', () => {
  state.numMax = parseInt($('numMax').value) || 20;
  updateGradeBtnActive();
});
$('btnStart').addEventListener('click', startGame);
$('btnRetry').addEventListener('click', startGame);
$('btnSubmit').addEventListener('click', handleSubmit);
$('answerInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(); });
function setMode(mode) {
  state.mode = mode;
  $('modePractice').classList.toggle('active', mode === 'practice');
  $('modeTimed').classList.toggle('active', mode === 'timed');
  timerSection.style.display = mode === 'timed' ? 'block' : 'none';
  practiceScore.style.display = mode === 'practice' ? 'block' : 'none';
  preGameText.textContent = mode === 'practice'
    ? '准备好开始自由练习了吗？不限时间，答对得分！'
    : '准备好接受 60 秒挑战了吗？尽可能多地答题！';
  if (state.running) endGame(false);
}
function setGrade(grade) {
  state.grade = grade;
  const cfg = gradeConfig[grade];
  state.numMin = cfg.min;
  state.numMax = cfg.max;
  state.operations = [...cfg.ops];
  $('numMin').value = cfg.min;
  $('numMax').value = cfg.max;
  updateOpCheckboxes();
  updateGradeBtnActive();
  if (state.running) generateQuestion();
}
function updateGradeBtnActive() {
  document.querySelectorAll('#gradeSelector .grade-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.grade) === state.grade);
  });
  const cfg = gradeConfig[state.grade];
  if (cfg && (state.numMin !== cfg.min || state.numMax !== cfg.max ||
    JSON.stringify([...state.operations].sort()) !== JSON.stringify([...cfg.ops].sort()))) {
    document.querySelectorAll('#gradeSelector .grade-btn').forEach(btn => btn.classList.remove('active'));
  }
}
function updateOpCheckboxes() {
  const opMap = { '+': 'opAdd', '-': 'opSub', '×': 'opMul', '÷': 'opDiv' };
  Object.values(opMap).forEach(id => $(id).classList.remove('checked'));
  state.operations.forEach(op => { if (opMap[op]) $(opMap[op]).classList.add('checked'); });
}
function generateQuestion() {
  const ops = state.operations;
  const op = ops[Math.floor(Math.random() * ops.length)];
  let a, b, answer, displayOp = op;
  switch (op) {
    case '+':
      a = randInt(state.numMin, state.numMax);
      b = randInt(state.numMin, state.numMax);
      answer = a + b;
      break;
    case '-':
      a = randInt(Math.max(0, state.numMin), state.numMax);
      b = randInt(Math.max(0, state.numMin), a);
      answer = a - b;
      break;
    case '×':
      if (state.grade <= 2) {
        a = randInt(1, Math.min(9, state.numMax));
        b = randInt(1, Math.min(9, state.numMax));
      } else {
        a = randInt(Math.max(1, state.numMin), Math.min(state.numMax, 99));
        b = randInt(1, Math.min(state.numMax, 99));
      }
      answer = a * b;
      break;
    case '÷':
      let divisorMax = state.grade <= 2 ? 9 : Math.min(state.numMax, 99);
      b = randInt(1, Math.max(1, divisorMax));
      let quotient = randInt(Math.max(1, state.numMin), Math.min(state.numMax, divisorMax * 3));
      a = b * quotient;
      answer = quotient;
      break;
    default:
      a = randInt(state.numMin, state.numMax);
      b = randInt(state.numMin, state.numMax);
      answer = a + b;
      displayOp = '+';
  }
  state.question = { a, b, op: displayOp, answer };
  questionText.textContent = `${a} ${displayOp} ${b} = ?`;
  questionFeedback.textContent = '';
  answerInput.value = '';
  answerInput.className = 'answer-input';
  answerInput.focus();
  questionBox.style.borderColor = 'rgba(255,255,255,0.06)';
  updateNumberLine(a, b, displayOp);
}
function randInt(min, max) {
  min = Math.ceil(min);
  max = Math.floor(max);
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function updateNumberLine(a, b, op) {
  if (state.grade > 2) {
    numberLineContainer.classList.add('hidden');
    return;
  }
  numberLineContainer.classList.remove('hidden');
  let result, labelA, labelB;
  switch (op) {
    case '+': result = a + b; labelA = String(a); labelB = String(b); break;
    case '-': result = a - b; labelA = String(a); labelB = String(b); result = a - b; break;
    case '×': result = a * b; labelA = String(a); labelB = String(b); break;
    case '÷': result = a; b = a; labelA = '0'; labelB = String(a); break;
    default: result = a + b; labelA = String(a); labelB = String(b);
  }
  const minVal = Math.min(0, a, b, result);
  const maxVal = Math.max(a, b, result, 10);
  const range = maxVal - minVal;
  const step = Math.max(1, Math.ceil(range / 10));
  const marks = [];
  const labels = [];
  for (let v = minVal; v <= maxVal; v += step) {
    marks.push(v);
    labels.push(v);
  }
  if (labels[labels.length - 1] < maxVal) { marks.push(maxVal); labels.push(maxVal); }
  numberLineMarks.innerHTML = marks.map(() => '<div class="number-line-mark"></div>').join('');
  numberLineLabels.innerHTML = labels.map(l => `<span>${l}</span>`).join('');
  const pct = range === 0 ? 50 : ((result - minVal) / range) * 100;
  numberLinePointer.style.left = pct + '%';
  numberLinePointer.classList.remove('result');
  const labelEl = numberLineContainer.querySelector('.number-line-label');
  if (labelEl) {
    labelEl.textContent = `${labelA} ${op} ${labelB} = ${result}`;
  }
}
function showResultOnNumberLine(result) {
  numberLinePointer.classList.add('result');
}
function startGame() {
  state.running = true;
  state.score = 0;
  state.combo = 0;
  state.maxCombo = 0;
  state.totalAnswered = 0;
  state.correctAnswered = 0;
  state.wrongList = [];
  state.timeLeft = 60;
  state.practiceTotal = 0;
  state.practiceCorrect = 0;
  preGame.style.display = 'none';
  inGame.style.display = 'block';
  postGame.style.display = 'none';
  answerInput.disabled = false;
  $('btnSubmit').disabled = false;
  if (state.mode === 'timed') {
    timerSection.style.display = 'block';
    practiceScore.style.display = 'none';
    timerDisplay.textContent = '60';
    timerDisplay.className = 'timer-value';
    scoreDisplay.textContent = '0';
    comboDisplay.textContent = '0';
    state.timerInterval = setInterval(tickTimer, 1000);
  } else {
    timerSection.style.display = 'none';
    practiceScore.style.display = 'block';
    practiceTotal.textContent = '0';
    practiceCorrect.textContent = '0';
  }
  generateQuestion();
}
function tickTimer() {
  state.timeLeft--;
  timerDisplay.textContent = state.timeLeft;
  if (state.timeLeft <= 10) timerDisplay.className = 'timer-value danger';
  else if (state.timeLeft <= 20) timerDisplay.className = 'timer-value warning';
  if (state.timeLeft <= 0) {
    endGame(true);
  }
}
function endGame(showResult) {
  state.running = false;
  clearInterval(state.timerInterval);
  if (state.mode === 'timed' && showResult) {
    inGame.style.display = 'none';
    postGame.style.display = 'block';
    if (state.score > getBestScore()) saveBestScore(state.score);
    resultSummary.innerHTML = `
      <div class="result-item">
        <div class="result-num correct-num">${state.correctAnswered}</div>
        <div class="result-label">答对</div>
      </div>
      <div class="result-item">
        <div class="result-num wrong-num">${state.totalAnswered - state.correctAnswered}</div>
        <div class="result-label">答错</div>
      </div>
      <div class="result-item">
        <div class="result-num accuracy-num">${state.totalAnswered > 0 ? Math.round(state.correctAnswered / state.totalAnswered * 100) : 0}%</div>
        <div class="result-label">正确率</div>
      </div>
      <div class="result-item">
        <div class="result-num" style="color:var(--warning)">${state.maxCombo}</div>
        <div class="result-label">最高连击</div>
      </div>
    `;
    if (state.wrongList.length > 0) {
      wrongReview.innerHTML = `
        <div class="section-title" style="margin-bottom:8px;">错题回顾</div>
        <div class="review-list">
          ${state.wrongList.map(w => `
            <div class="review-item">
              <span class="review-question">${w.a} ${w.op} ${w.b} = ?</span>
              <span><span class="review-wrong">${w.userAnswer}</span><span class="review-correct-val">${w.answer}</span></span>
            </div>
          `).join('')}
        </div>
      `;
    } else {
      wrongReview.innerHTML = '<p style="text-align:center; color:var(--success); padding:12px;">太棒了！全对！</p>';
    }
    updateProgress(state.correctAnswered, state.totalAnswered);
    updateDailyChallenge();
  } else if (!showResult) {
    inGame.style.display = 'none';
    preGame.style.display = 'block';
    postGame.style.display = 'none';
  }
  if (state.correctAnswered >= 10) spawnConfetti();
  if (state.maxCombo >= 5) spawnStars();
}
function handleSubmit() {
  if (!state.running) return;
  if (!state.question) return;
  const userAnswerStr = answerInput.value.trim();
  if (userAnswerStr === '') return;
  const userAnswer = parseInt(userAnswerStr, 10);
  const q = state.question;
  const correct = userAnswer === q.answer;
  state.totalAnswered++;
  if (correct) {
    state.correctAnswered++;
    state.combo++;
    if (state.combo > state.maxCombo) state.maxCombo = state.combo;
    if (state.combo >= 5 && state.combo % 5 === 0) spawnStars();
    questionFeedback.textContent = '✓';
    questionFeedback.style.color = 'var(--success)';
    answerInput.className = 'answer-input correct-answer';
    questionBox.style.borderColor = 'rgba(74, 222, 128, 0.4)';
    showResultOnNumberLine(q.answer);
    if (state.mode === 'practice') {
      state.practiceCorrect++;
    } else {
      state.score += 10 + Math.floor(state.combo / 3) * 5;
    }
  } else {
    state.combo = 0;
    state.wrongList.push({ a: q.a, b: q.b, op: q.op, answer: q.answer, userAnswer });
    questionFeedback.textContent = `✗ ${q.answer}`;
    questionFeedback.style.color = 'var(--error)';
    answerInput.className = 'answer-input wrong-answer';
    questionBox.style.borderColor = 'rgba(248, 113, 113, 0.4)';
  }
  if (state.mode === 'practice') {
    state.practiceTotal++;
    practiceTotal.textContent = state.practiceTotal;
    practiceCorrect.textContent = state.practiceCorrect;
  } else {
    scoreDisplay.textContent = state.score;
  }
  comboDisplay.textContent = state.combo;
  setTimeout(() => {
    if (state.running) generateQuestion();
  }, correct ? 300 : 800);
}
function updateDailyChallenge() {
  const today = new Date().toISOString().split('T')[0];
  if (state.dailyDate !== today) {
    state.dailyDate = today;
    state.dailyDone = 0;
  }
  state.dailyDone += state.correctAnswered;
  if (state.dailyDone >= state.dailyTarget) state.dailyDone = state.dailyTarget;
  saveDaily();
  renderDailyChallenge();
}
function renderDailyChallenge() {
  const today = new Date().toISOString().split('T')[0];
  const saved = loadDaily();
  if (saved.date !== today) {
    state.dailyDate = today;
    state.dailyDone = 0;
  } else {
    state.dailyDate = saved.date;
    state.dailyDone = saved.done;
  }
  state.dailyTarget = saved.target || 20;
  const remaining = Math.max(0, state.dailyTarget - state.dailyDone);
  if (state.dailyDone >= state.dailyTarget) {
    dailyText.textContent = '今日挑战已完成！明天继续加油！';
    dailyBadge.innerHTML = '<span class="daily-badge daily-completed">已完成</span>';
  } else {
    dailyText.textContent = `今日目标：答对 ${state.dailyTarget} 题，还剩 ${remaining} 题`;
    dailyBadge.innerHTML = '<span class="daily-badge">进行中</span>';
  }
  updateStreak();
}
function loadDaily() {
  try {
    const d = JSON.parse(localStorage.getItem('math_quiz_daily') || '{}');
    return { date: d.date || '', done: d.done || 0, target: d.target || 20, streak: d.streak || 0, lastActive: d.lastActive || '' };
  } catch { return { date: '', done: 0, target: 20, streak: 0, lastActive: '' }; }
}
function saveDaily() {
  const d = loadDaily();
  const today = new Date().toISOString().split('T')[0];
  if (d.lastActive !== today) {
    const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
    if (d.lastActive === yesterday) {
      d.streak = (d.streak || 0) + 1;
    } else if (d.lastActive !== today) {
      d.streak = 1;
    }
    d.lastActive = today;
  }
  if (state.dailyDate === today && state.dailyDone >= state.dailyTarget) {
    d.done = state.dailyTarget;
  } else {
    d.done = Math.max(d.done || 0, state.dailyDone);
  }
  d.date = today;
  d.target = state.dailyTarget;
  localStorage.setItem('math_quiz_daily', JSON.stringify(d));
}
function updateStreak() {
  const d = loadDaily();
  $('statStreak').textContent = d.streak || 0;
}
function updateProgress(correct, total) {
  const p = loadProgress();
  p.totalAnswered = (p.totalAnswered || 0) + total;
  p.totalCorrect = (p.totalCorrect || 0) + correct;
  saveProgress(p);
  renderProgress();
}
function loadProgress() {
  try {
    return JSON.parse(localStorage.getItem('math_quiz_progress') || '{}');
  } catch { return {}; }
}
function saveProgress(p) {
  localStorage.setItem('math_quiz_progress', JSON.stringify(p));
}
function getBestScore() {
  return loadProgress().bestScore || 0;
}
function saveBestScore(score) {
  const p = loadProgress();
  p.bestScore = Math.max(p.bestScore || 0, score);
  saveProgress(p);
}
function renderProgress() {
  const p = loadProgress();
  $('statTotal').textContent = p.totalAnswered || 0;
  $('statCorrect').textContent = p.totalCorrect || 0;
  $('statBest').textContent = p.bestScore || 0;
  $('statStreak').textContent = loadDaily().streak || 0;
  $('statAccuracy').textContent = p.totalAnswered > 0
    ? Math.round((p.totalCorrect || 0) / p.totalAnswered * 100) + '%'
    : '-';
}
function spawnConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
  const particles = [];
  const colors = ['#7c5cfc', '#f472b6', '#4ade80', '#fbbf24', '#60a5fa', '#fb923c', '#34d399'];
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random() * confettiCanvas.width,
      y: -20 - Math.random() * 100,
      w: Math.random() * 10 + 4,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 3 + 2,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
    });
  }
  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let alive = false;
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
      if (p.y < confettiCanvas.height + 20) alive = true;
    });
    if (alive && frame < 120) { frame++; requestAnimationFrame(animate); }
    else ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  }
  requestAnimationFrame(animate);
}
function spawnStars() {
  const container = $('starsBurst');
  const emojis = ['⭐', '🌟', '✨', '💫', '🎉', '🏆'];
  const fragment = document.createDocumentFragment();
  for (let i = 0; i < 12; i++) {
    const el = document.createElement('span');
    el.className = 'star-particle';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const angle = (Math.PI * 2 / 12) * i + Math.random() * 0.3;
    const dist = 60 + Math.random() * 80;
    el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    el.style.animationDuration = (0.6 + Math.random() * 0.4) + 's';
    fragment.appendChild(el);
  }
  container.innerHTML = '';
  container.appendChild(fragment);
  setTimeout(() => { container.innerHTML = ''; }, 1200);
}
function init() {
  setGrade(1);
  updateOpCheckboxes();
  renderProgress();
  renderDailyChallenge();
  updateStreak();
  preGame.style.display = 'block';
  inGame.style.display = 'none';
  postGame.style.display = 'none';
  timerSection.style.display = 'none';
  practiceScore.style.display = 'none';
  window.addEventListener('resize', () => {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  });
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
init();
</script>
