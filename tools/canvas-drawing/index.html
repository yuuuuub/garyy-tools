<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas画板</title><meta name="description" content="Canvas画板 - 在线画板工具，支持画笔、形状、文字、橡皮擦"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:1000px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}.toolbar label{font-size:.8rem;color:var(--text2)}.btn{padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.8rem}.btn:hover{opacity:.85}.btn.active{outline:2px solid var(--green);outline-offset:2px}.btn-red{background:var(--red)}.btn-green{background:var(--green)}input[type="color"]{width:32px;height:32px;border:none;border-radius:6px;cursor:pointer;background:none}input[type="range"]{width:80px}canvas{border:1px solid var(--border);border-radius:8px;cursor:crosshair;display:block;background:#fff}.canvas-wrap{display:flex;justify-content:center;overflow:auto}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);outline:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style>
<meta property="og:title" content="Canvas画板">
<meta property="og:description" content="Canvas画板 - 在线画板工具，支持画笔、形状、文字、橡皮擦">
<meta property="og:image" content="/og-default.png">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎨 Canvas画板</h1><p class="sub">在线画板工具，支持画笔、形状、文字、橡皮擦</p>
<div class="card">
<div class="toolbar">
<button class="btn active" id="toolBrush" onclick="setTool('brush')">画笔</button>
<button class="btn" id="toolEraser" onclick="setTool('eraser')">橡皮擦</button>
<button class="btn" id="toolLine" onclick="setTool('line')">直线</button>
<button class="btn" id="toolRect" onclick="setTool('rect')">矩形</button>
<button class="btn" id="toolCircle" onclick="setTool('circle')">圆形</button>
<button class="btn" id="toolText" onclick="setTool('text')">文字</button>
<span style="width:1px;height:24px;background:var(--border);margin:0 4px"></span>
<label>颜色</label><input type="color" id="colorPicker" value="#000000">
<label>大小</label><input type="range" id="sizeSlider" min="1" max="50" value="3">
<span id="sizeLabel" style="font-size:.8rem;color:var(--text2)">3</span>
<span style="width:1px;height:24px;background:var(--border);margin:0 4px"></span>
<button class="btn" onclick="undo()">撤销</button>
<button class="btn btn-red" onclick="clearCanvas()">清空</button>
<button class="btn btn-green" onclick="saveImage()">保存PNG</button>
</div>
<div class="canvas-wrap"><canvas id="canvas" width="900" height="600"></canvas></div>
</div></div>
<script src="../i18n.js" defer></script>
<script>
var canvas=document.getElementById('canvas');
var ctx=canvas.getContext('2d');
var drawing=false,tool='brush',startX=0,startY=0,snapshot=null;
var history=[];
document.getElementById('sizeSlider').oninput=function(){document.getElementById('sizeLabel').textContent=this.value;};
function setTool(t){
  tool=t;
  document.querySelectorAll('.toolbar .btn').forEach(function(b){b.classList.remove('active');});
  var el=document.getElementById('tool'+t.charAt(0).toUpperCase()+t.slice(1));
  if(el)el.classList.add('active');
  canvas.style.cursor=t==='text'?'text':'crosshair';
}
function saveState(){history.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(history.length>50)history.shift();}
function undo(){if(history.length>0){ctx.putImageData(history.pop(),0,0);}}
function clearCanvas(){saveState();ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);}
canvas.onmousedown=function(e){
  var rect=canvas.getBoundingClientRect();
  startX=e.clientX-rect.left;startY=e.clientY-rect.top;
  if(tool==='text'){
    var txt=prompt('输入文字:');if(txt){
      saveState();
      ctx.font=document.getElementById('sizeSlider').value*2+'px sans-serif';
      ctx.fillStyle=document.getElementById('colorPicker').value;
      ctx.fillText(txt,startX,startY);
    }return;
  }
  drawing=true;saveState();
  if(tool==='brush'||tool==='eraser'){
    ctx.beginPath();ctx.moveTo(startX,startY);
    ctx.strokeStyle=tool==='eraser'?'#fff':document.getElementById('colorPicker').value;
    ctx.lineWidth=document.getElementById('sizeSlider').value;
    ctx.lineCap='round';ctx.lineJoin='round';
  }
};
canvas.onmousemove=function(e){
  if(!drawing)return;
  var rect=canvas.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  if(tool==='brush'||tool==='eraser'){
    ctx.lineTo(x,y);ctx.stroke();
  }else{
    ctx.putImageData(history[history.length-1],0,0);
    ctx.strokeStyle=document.getElementById('colorPicker').value;
    ctx.lineWidth=document.getElementById('sizeSlider').value;
    if(tool==='line'){ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(x,y);ctx.stroke();}
    else if(tool==='rect'){ctx.strokeRect(startX,startY,x-startX,y-startY);}
    else if(tool==='circle'){ctx.beginPath();ctx.arc(startX,startY,Math.sqrt(Math.pow(x-startX,2)+Math.pow(y-startY,2)),0,Math.PI*2);ctx.stroke();}
  }
};
canvas.onmouseup=function(){drawing=false;};
canvas.onmouseleave=function(){drawing=false;};
function saveImage(){
  var link=document.createElement('a');link.download='drawing.png';link.href=canvas.toDataURL('image/png');link.click();
}
clearCanvas();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
