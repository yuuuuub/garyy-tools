<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💧 流体模拟</title>
<meta property="og:title" content="💧 流体模拟">
<meta property="og:description" content="💧 流体模拟 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="流体模拟 - 基于Navier-Stokes方程的实时流体动力学模拟">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.hdr{text-align:center;margin-bottom:16px}.hdr h1{font-size:1.6rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.canvas-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
canvas{display:block;width:100%;cursor:crosshair}
.controls{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.controls .row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.controls label{font-size:.8rem;color:var(--text2);min-width:70px}
.controls input[type=range]{flex:1;accent-color:var(--accent)}
.controls .val{font-size:.8rem;color:var(--accent);min-width:50px;text-align:right}
.controls select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;font-size:.8rem}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.85}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{opacity:.85}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.info-bar{display:flex;gap:16px;justify-content:center;color:var(--text2);font-size:.8rem;padding:8px 0}
.info-bar span{color:var(--accent);font-weight:600}
.hint{color:var(--text2);text-align:center;font-size:.8rem;margin-bottom:8px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="hdr"><h1>💧 流体模拟</h1><p>基于Navier-Stokes方程的实时流体动力学</p></div>

<div class="hint">鼠标拖拽注入速度 | 按住Shift注入密度 | 滚轮调整笔刷大小</div>
<div class="canvas-wrap"><canvas id="fluid"></canvas></div>

<div class="controls">
<div class="row"><label>扩散率</label><input type="range" min="0" max="0.01" step="0.0001" value="0.00001" id="diff"><span class="val">0.00001</span></div>
<div class="row"><label>粘度</label><input type="range" min="0" max="0.01" step="0.0001" value="0.000001" id="visc"><span class="val">0.000001</span></div>
<div class="row"><label>笔刷大小</label><input type="range" min="2" max="20" step="1" value="8" id="brush"><span class="val">8</span></div>
<div class="row"><label>颜色</label>
<select id="colorMode"><option value="velocity">速度着色</option><option value="density">密度着色</option><option value="pressure">压力着色</option><option value="rainbow">彩虹</option></select>
</div>
</div>

<div class="btn-row">
<button class="btn btn-primary" onclick="togglePlay()">▶ 播放/暂停</button>
<button class="btn btn-success" onclick="addSource()">💨 添加源</button>
<button class="btn btn-danger" onclick="clearAll()">🗑 清空</button>
<button class="btn btn-outline" onclick="screenshot()">📷 截图</button>
</div>

<div class="info-bar">FPS: <span id="fps">0</span> | 网格: <span id="gridInfo">0x0</span> | 状态: <span id="state">播放中</span></div>

<script>
const canvas=document.getElementById('fluid'),ctx=canvas.getContext('2d');
let W,H,N=128,dt=0.1,diff=0.00001,visc=0.000001,brushSize=8,colorMode='velocity';
let playing=true,animId,lastTime=0,fpsCount=0,fpsTime=0;

let u,v,u0,v0,dens,dens0;

function IX(x,y){return x+(N+2)*y}

function init(){
const size=(N+2)*(N+2);
u=new Float32Array(size);v=new Float32Array(size);u0=new Float32Array(size);v0=new Float32Array(size);
dens=new Float32Array(size);dens0=new Float32Array(size);
document.getElementById('gridInfo').textContent=`${N}x${N}`;
}

function addSource(){
for(let i=0;i<20;i++){
const x=Math.floor(Math.random()*N)+1,y=Math.floor(Math.random()*N)+1;
const idx=IX(x,y);u[idx]=(Math.random()-.5)*50;v[idx]=(Math.random()-.5)*50;dens[idx]=Math.random()*200;
}
}

function clearAll(){init()}

function setBnd(b,x){
for(let i=1;i<=N;i++){
x[IX(0,i)]=b===1?-x[IX(1,i)]:x[IX(1,i)];x[IX(N+1,i)]=b===1?-x[IX(N,i)]:x[IX(N,i)];
x[IX(i,0)]=b===2?-x[IX(i,1)]:x[IX(i,1)];x[IX(i,N+1)]=b===2?-x[IX(i,N)]:x[IX(i,N)];
}
x[IX(0,0)]=0.5*(x[IX(1,0)]+x[IX(0,1)]);x[IX(0,N+1)]=0.5*(x[IX(1,N+1)]+x[IX(0,N)]);
x[IX(N+1,0)]=0.5*(x[IX(N,0)]+x[IX(N+1,1)]);x[IX(N+1,N+1)]=0.5*(x[IX(N,N+1)]+x[IX(N+1,N)]);
}

function diffuse(b,x,x0,diff){
const a=dt*diff*N*N;
for(let k=0;k<20;k++){
for(let i=1;i<=N;i++)for(let j=1;j<=N;j++){
x[IX(i,j)]=(x0[IX(i,j)]+a*(x[IX(i-1,j)]+x[IX(i+1,j)]+x[IX(i,j-1)]+x[IX(i,j+1)]))/(1+4*a);
}
setBnd(b,x);
}
}

function advect(b,d,d0,u,v){
const dtx=dt*N,dty=dt*N;
for(let i=1;i<=N;i++)for(let j=1;j<=N;j++){
let x=i-dtx*u[IX(i,j)],y=j-dty*v[IX(i,j)];
if(x<0.5)x=0.5;if(x>N+0.5)x=N+0.5;const i0=Math.floor(x),i1=i0+1;
if(y<0.5)y=0.5;if(y>N+0.5)y=N+0.5;const j0=Math.floor(y),j1=j0+1;
const s1=x-i0,s0=1-s1,t1=y-j0,t0=1-t1;
d[IX(i,j)]=s0*(t0*d0[IX(i0,j0)]+t1*d0[IX(i0,j1)])+s1*(t0*d0[IX(i1,j0)]+t1*d0[IX(i1,j1)]);
}
setBnd(b,d);
}

function project(u,v,p,div){
for(let i=1;i<=N;i++)for(let j=1;j<=N;j++){
div[IX(i,j)]=-0.5*(u[IX(i+1,j)]-u[IX(i-1,j)]+v[IX(i,j+1)]-v[IX(i,j-1)])/N;
p[IX(i,j)]=0;
}
setBnd(0,div);setBnd(0,p);
for(let k=0;k<20;k++){
for(let i=1;i<=N;i++)for(let j=1;j<=N;j++){
p[IX(i,j)]=(div[IX(i,j)]+p[IX(i-1,j)]+p[IX(i+1,j)]+p[IX(i,j-1)]+p[IX(i,j+1)])/4;
}
setBnd(0,p);
}
for(let i=1;i<=N;i++)for(let j=1;j<=N;j++){
u[IX(i,j)]-=0.5*N*(p[IX(i+1,j)]-p[IX(i-1,j)]);
v[IX(i,j)]-=0.5*N*(p[IX(i,j+1)]-p[IX(i,j-1)]);
}
setBnd(1,u);setBnd(2,v);
}

function velStep(u,v,u0,v0,visc){
for(let i=0;i<u.length;i++){u[i]+=dt*u0[i];v[i]+=dt*v0[i]}
diffuse(1,u,u0,visc);diffuse(2,v,v0,visc);
const px=new Float32Array((N+2)*(N+2)),py=new Float32Array((N+2)*(N+2));
project(u,v,px,py);
const tx=u.slice(),ty=v.slice();
advect(1,u,tx,tx,ty);advect(2,v,ty,tx,ty);
project(u,v,px,py);
}

function densStep(x,x0,u,v,diff){
for(let i=0;i<x.length;i++)x[i]+=dt*x0[i];
diffuse(0,x,x0,diff);
const tmp=x0.slice();advect(0,x,tmp,u,v);
}

function toColor(val){
val=Math.max(0,Math.min(1,val));
if(colorMode==='rainbow')return`hsl(${val*360},90%,50%)`;
if(colorMode==='density')return`rgb(${val*50},${val*100+50},${val*200+55})`;
if(colorMode==='pressure')return`rgb(${val*200},${Math.abs(val-0.5)*2*100},${(1-val)*200})`;
return`rgb(${val*255},${val*200},${255-val*150})`;
}

function draw(){
const imageData=ctx.createImageData(W,H);const data=imageData.data;
const cellW=W/N,cellH=H/N;
for(let i=1;i<=N;i++)for(let j=1;j<=N;j++){
const val=Math.min(1,(dens[IX(i,j)]||0)/100);
const vel=Math.sqrt(u[IX(i,j)]**2+v[IX(i,j)]**2);
let r,g,b;
if(colorMode==='velocity'){const t=Math.min(1,vel/30);r=t*255;g=t*180;b=255-t*100}
else if(colorMode==='density'){r=val*50;g=val*100+50;b=val*200+55}
else if(colorMode==='pressure'){r=val*200;g=Math.abs(val-0.5)*200;b=(1-val)*200}
else{const h=val*360;const c=val;const x=c*(1-Math.abs((h/60)%2-1));const m=0;let rr,gg,bb;
if(h<60){rr=c;gg=x;bb=0}else if(h<120){rr=x;gg=c;bb=0}else if(h<180){rr=0;gg=c;bb=x}else if(h<240){rr=0;gg=x;bb=c}else if(h<300){rr=x;gg=0;bb=c}else{rr=c;gg=0;bb=x}
r=rr*255;g=gg*255;b=bb*255}
const px0=Math.floor((i-1)*cellW),py0=Math.floor((j-1)*cellH);
const px1=Math.floor(i*cellW),py1=Math.floor(j*cellH);
for(let y=py0;y<py1&&y<H;y++)for(let x=px0;x<px1&&x<W;x++){
const idx=(y*W+x)*4;data[idx]=r;data[idx+1]=g;data[idx+2]=b;data[idx+3]=255;
}
}
ctx.putImageData(imageData,0,0);
}

function simStep(){
velStep(u,v,u0,v0,visc);densStep(dens,dens0,u,v,diff);
for(let i=0;i<u0.length;i++){u0[i]=0;v0[i]=0;dens0[i]=0}
}

let mouseDown=false,lastMX=0,lastMY=0;

function addForce(mx,my,dx,dy){
const gx=Math.floor(mx/W*N)+1,gy=Math.floor(my/H*N)+1;
const b=brushSize;
for(let i=-b;i<=b;i++)for(let j=-b;j<=b;j++){
if(i*i+j*j>b*b)continue;
const x=gx+i,y=gy+j;
if(x>=1&&x<=N&&y>=1&&y<=N){
const falloff=1-Math.sqrt(i*i+j*j)/b;
u0[IX(x,y)]=dx*falloff*10;v0[IX(x,y)]=dy*falloff*10;
dens0[IX(x,y)]=50*falloff;
}
}
}

canvas.addEventListener('mousedown',e=>{mouseDown=true;lastMX=e.clientX;lastMY=e.clientY});
canvas.addEventListener('mousemove',e=>{
if(!mouseDown)return;
const dx=e.clientX-lastMX,dy=e.clientY-lastMY;
const rect=canvas.getBoundingClientRect();
addForce(e.clientX-rect.left,e.clientY-rect.top,dx,dy);
lastMX=e.clientX;lastMY=e.clientY;
});
canvas.addEventListener('mouseup',()=>mouseDown=false);
canvas.addEventListener('mouseleave',()=>mouseDown=false);

canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];mouseDown=true;lastMX=t.clientX;lastMY=t.clientY},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!mouseDown)return;const t=e.touches[0];
const dx=t.clientX-lastMX,dy=t.clientY-lastMY;const rect=canvas.getBoundingClientRect();
addForce(t.clientX-rect.left,t.clientY-rect.top,dx,dy);lastMX=t.clientX;lastMY=t.clientY},{passive:false});
canvas.addEventListener('touchend',()=>mouseDown=false);

canvas.addEventListener('wheel',e=>{e.preventDefault();brushSize=Math.max(2,Math.min(20,brushSize+(e.deltaY>0?-1:1)));document.getElementById('brush').value=brushSize;document.getElementById('brush').nextElementSibling.textContent=brushSize},{passive:false});

function togglePlay(){playing=!playing;document.getElementById('state').textContent=playing?'播放中':'暂停'}
function screenshot(){const link=document.createElement('a');link.download='fluid.png';link.href=canvas.toDataURL();link.click()}

function resize(){
const r=canvas.parentElement.getBoundingClientRect();W=canvas.width=r.width;H=canvas.height=Math.min(500,r.width*0.6);
init();
}

function animate(t){
if(!playing){animId=requestAnimationFrame(animate);return}
fpsCount++;if(t-fpsTime>1000){document.getElementById('fps').textContent=fpsCount;fpsCount=0;fpsTime=t}
simStep();draw();animId=requestAnimationFrame(animate);
}

document.getElementById('diff').oninput=function(){diff=+this.value;this.nextElementSibling.textContent=diff};
document.getElementById('visc').oninput=function(){visc=+this.value;this.nextElementSibling.textContent=visc};
document.getElementById('brush').oninput=function(){brushSize=+this.value;this.nextElementSibling.textContent=brushSize};
document.getElementById('colorMode').onchange=function(){colorMode=this.value};

resize();init();requestAnimationFrame(animate);
window.addEventListener('resize',resize);
</script>
</body></html>
