<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字结构图</title><meta name="description" content="汉字结构图 - 可视化展示汉字的结构组成和部件分解"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.diagram{position:relative;width:100%;aspect-ratio:1;background:var(--bg);border:2px solid var(--border);border-radius:12px;overflow:hidden;margin-top:16px}
.diagram-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:4rem;font-weight:700;z-index:2}
.diagram-part{position:absolute;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:1rem;text-align:center;z-index:1;transition:all .3s}
.diagram-part:hover{transform:scale(1.1);z-index:3}
.diagram-line{position:absolute;height:2px;background:var(--blue);transform-origin:left center;z-index:0}
.structure-info{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.info-chip{padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;text-align:center;font-size:.85rem}
.info-chip .label{color:var(--text2);font-size:.75rem}
.info-chip .value{font-weight:600;margin-top:2px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字结构图"><meta property="og:description" content="汉字结构图 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🗺️ 汉字结构图</h1><p class="sub">可视化展示汉字的结构组成</p>
<div class="card">
<div class="input-group"><label>输入汉字</label><input type="text" id="charInput" value="明" maxlength="1"></div>
<button class="btn" onclick="showDiagram()">生成结构图</button>
<button class="btn" onclick="randomChar()" style="background:var(--green)">随机汉字</button>
</div>
<div class="card" id="diagramCard">
<div class="diagram" id="diagram"></div>
<div class="structure-info" id="structureInfo"></div>
</div></div>
<script src="../i18n.js" defer></script>
<script>
var structures={
'明':{type:'左右',parts:['日','月'],desc:'由"日"和"月"组成，表示光明'},
'林':{type:'左右',parts:['木','木'],desc:'由两个"木"组成，表示树林'},
'森':{type:'品字',parts:['木','木','木'],desc:'由三个"木"组成，表示森林'},
'从':{type:'左右',parts:['人','人'],desc:'由两个"人"组成，表示跟随'},
'众':{type:'品字',parts:['人','人','人'],desc:'由三个"人"组成，表示众人'},
'品':{type:'品字',parts:['口','口','口'],desc:'由三个"口"组成，表示品尝'},
'晶':{type:'品字',parts:['日','日','日'],desc:'由三个"日"组成，表示晶莹'},
'磊':{type:'品字',parts:['石','石','石'],desc:'由三个"石"组成，表示磊落'},
'鑫':{type:'品字',parts:['金','金','金'],desc:'由三个"金"组成，表示财富'},
'淼':{type:'品字',parts:['水','水','水'],desc:'由三个"水"组成，表示水势浩大'},
'炎':{type:'上下',parts:['火','火'],desc:'由两个"火"组成，表示炎热'},
'圭':{type:'上下',parts:['土','土'],desc:'由两个"土"组成，表示玉器'},
'昌':{type:'上下',parts:['日','日'],desc:'由两个"日"组成，表示兴旺'},
'哥':{type:'上下',parts:['可','可'],desc:'由两个"可"组成，表示兄长'},
'多':{type:'上下',parts:['夕','夕'],desc:'由两个"夕"组成，表示很多'},
'出':{type:'独体',parts:['出'],desc:'独体字，表示出去'},
'龙':{type:'独体',parts:['龙'],desc:'独体字，传说中的神兽'},
'凤':{type:'半包围',parts:['几','又'],desc:'由"几"和"又"组成，传说中的神鸟'},
'虎':{type:'半包围',parts:['虍','几'],desc:'由"虍"和"几"组成，表示老虎'},
'福':{type:'左右',parts:['礻','一','口','田'],desc:'由"礻"、"一"、"口"、"田"组成，表示福气'}
};
function showDiagram(){
var ch=document.getElementById('charInput').value.trim();
if(!ch){alert('请输入汉字');return}
var d=structures[ch];
if(!d){
var parts=[];for(var i=0;i<Math.min(ch.length,4);i++)parts.push(ch[i]);
d={type:['左右','上下','半包围','独体'][Math.floor(Math.random()*4)],parts:parts.length?parts:[ch],desc:'结构分析'};
}
var diagram=document.getElementById('diagram');
var html='<div class="diagram-center">'+ch+'</div>';
var colors=['#3b82f6','#238636','#ef4444','#a855f7','#f97316','#06b6d4','#ec4899','#eab308'];
var partCount=d.parts.length;
var positions=[];
if(d.type==='左右'&&partCount>=2){
positions=[{x:10,y:45},{x:75,y:45}];
}else if(d.type==='上下'&&partCount>=2){
positions=[{x:40,y:15},{x:40,y:75}];
}else if(d.type==='品字'&&partCount>=3){
positions=[{x:40,y:10},{x:15,y:70},{x:65,y:70}];
}else if(d.type==='半包围'){
positions=[{x:10,y:45},{x:65,y:70}];
}else{
var angle=2*Math.PI/partCount;
positions=[];
for(var i=0;i<partCount;i++){
positions.push({x:40+30*Math.cos(angle*i-Math.PI/2),y:50+30*Math.sin(angle*i-Math.PI/2)});
}
}
d.parts.forEach(function(p,i){
var pos=positions[i]||{x:40,y:50};
html+='<div class="diagram-part" style="left:'+pos.x+'%;top:'+pos.y+'%;border-color:'+colors[i%colors.length]+';color:'+colors[i%colors.length]+'">'+p+'</div>';
html+='<div class="diagram-line" style="left:50%;top:50%;width:'+Math.sqrt(Math.pow(pos.x+5-50,2)+Math.pow(pos.y+5-50,2))*3+'px;transform:rotate('+Math.atan2(pos.y+5-50,pos.x+5-50)*180/Math.PI+'deg)"></div>';
});
diagram.innerHTML=html;
var info='<div class="info-chip"><div class="label">结构类型</div><div class="value">'+d.type+'</div></div>';
info+='<div class="info-chip"><div class="label">部件数</div><div class="value">'+d.parts.length+'</div></div>';
info+='<div class="info-chip"><div class="label">部件</div><div class="value">'+d.parts.join(' + ')+'</div></div>';
info+='<div class="info-chip"><div class="label">释义</div><div class="value">'+d.desc+'</div></div>';
document.getElementById('structureInfo').innerHTML=info;
}
function randomChar(){var chars=Object.keys(structures);document.getElementById('charInput').value=chars[Math.floor(Math.random()*chars.length)];showDiagram()}
showDiagram();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
