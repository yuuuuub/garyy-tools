<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON查看器</title><meta name="description" content="JSON查看器 - 在线JSON格式化查看工具"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:1000px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:200px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:600px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tree-view{margin-top:16px}.tree-item{padding:4px 0;cursor:pointer}.tree-item:hover{background:rgba(59,130,246,0.1);border-radius:4px}.tree-key{color:var(--blue);font-weight:500}.tree-string{color:var(--green)}.tree-number{color:var(--red)}.tree-boolean{color:var(--blue)}.tree-null{color:var(--text2)}.tree-bracket{color:var(--text2)}.tree-toggle{display:inline-block;width:16px;cursor:pointer;color:var(--text2)}.tree-children{margin-left:20px;border-left:1px solid var(--border);padding-left:8px}</style><meta property="og:title" content="JSON查看器"><meta property="og:description" content="JSON查看器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"></head><body>
<div class="container"><h1>📊 JSON查看器</h1><p class="sub">在线JSON格式化查看工具</p>
<div class="card"><div class="label">输入JSON</div>
<textarea id="inputJson" placeholder='{"key": "value", "number": 123, "array": [1, 2, 3]}'></textarea>
<div class="btn-group">
<button class="btn" onclick="formatJson()">格式化</button>
<button class="btn" onclick="minifyJson()">压缩</button>
<button class="btn" onclick="treeView()">树形视图</button>
<button class="btn" onclick="validateJson()">验证</button>
<button class="btn" onclick="copyFormatted()">复制格式化</button>
</div></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function formatJson(){
  var text=document.getElementById('inputJson').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入JSON</div>';return;}
  try{
    var obj=JSON.parse(text);
    var formatted=JSON.stringify(obj,null,2);
    r.innerHTML='<div class="card"><div class="section"><h3>📋 格式化结果</h3><div class="result-block" id="resultText">'+syntaxHighlight(formatted)+'</div><button class="copy-btn" onclick="copyResult()">复制结果</button></div></div>';
  }catch(e){
    r.innerHTML='<div class="card" style="color:var(--red)">JSON格式错误: '+e.message+'</div>';
  }
}
function minifyJson(){
  var text=document.getElementById('inputJson').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入JSON</div>';return;}
  try{
    var obj=JSON.parse(text);
    var minified=JSON.stringify(obj);
    r.innerHTML='<div class="card"><div class="section"><h3>📋 压缩结果</h3><div class="result-block" id="resultText">'+syntaxHighlight(minified)+'</div><button class="copy-btn" onclick="copyResult()">复制结果</button></div></div>';
  }catch(e){
    r.innerHTML='<div class="card" style="color:var(--red)">JSON格式错误: '+e.message+'</div>';
  }
}
function validateJson(){
  var text=document.getElementById('inputJson').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入JSON</div>';return;}
  try{
    JSON.parse(text);
    r.innerHTML='<div class="card" style="color:var(--green)">✅ JSON格式有效</div>';
  }catch(e){
    r.innerHTML='<div class="card" style="color:var(--red)">❌ JSON格式无效: '+e.message+'</div>';
  }
}
function treeView(){
  var text=document.getElementById('inputJson').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入JSON</div>';return;}
  try{
    var obj=JSON.parse(text);
    var html='<div class="card"><div class="section"><h3>🌳 树形视图</h3><div class="tree-view" id="treeView">'+renderTree(obj,'')+'</div></div></div>';
    r.innerHTML=html;
  }catch(e){
    r.innerHTML='<div class="card" style="color:var(--red)">JSON格式错误: '+e.message+'</div>';
  }
}
function renderTree(obj,prefix){
  if(obj===null)return'<span class="tree-null">null</span>';
  if(typeof obj==='string')return'<span class="tree-string">"'+escapeHtml(obj)+'"</span>';
  if(typeof obj==='number')return'<span class="tree-number">'+obj+'</span>';
  if(typeof obj==='boolean')return'<span class="tree-boolean">'+obj+'</span>';
  if(Array.isArray(obj)){
    if(obj.length===0)return'<span class="tree-bracket">[]</span>';
    var html='<span class="tree-toggle" onclick="toggleTree(this)">▼</span><span class="tree-bracket">[</span><div class="tree-children">';
    for(var i=0;i<obj.length;i++){
      html+='<div class="tree-item">'+renderTree(obj[i],prefix+'  ');
      if(i<obj.length-1)html+=',';
      html+='</div>';
    }
    html+='</div><span class="tree-bracket">]</span>';
    return html;
  }
  if(typeof obj==='object'){
    var keys=Object.keys(obj);
    if(keys.length===0)return'<span class="tree-bracket">{}</span>';
    var html='<span class="tree-toggle" onclick="toggleTree(this)">▼</span><span class="tree-bracket">{</span><div class="tree-children">';
    for(var i=0;i<keys.length;i++){
      html+='<div class="tree-item"><span class="tree-key">"'+escapeHtml(keys[i])+'"</span>: '+renderTree(obj[keys[i]],prefix+'  ');
      if(i<keys.length-1)html+=',';
      html+='</div>';
    }
    html+='</div><span class="tree-bracket">}</span>';
    return html;
  }
  return String(obj);
}
function toggleTree(el){
  var children=el.nextElementSibling.nextElementSibling;
  if(children.style.display==='none'){
    children.style.display='block';
    el.textContent='▼';
  }else{
    children.style.display='none';
    el.textContent='▶';
  }
}
function syntaxHighlight(json){
  return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"([^"]+)"(?=\s*:)/g,'<span style="color:#79c0ff">"$1"</span>')
    .replace(/:\s*"([^"]*)"/g,': <span style="color:#a5d6ff">"$1"</span>')
    .replace(/:\s*(\d+)/g,': <span style="color:#d2a8ff">$1</span>')
    .replace(/:\s*(true|false)/g,': <span style="color:#ff7b72">$1</span>')
    .replace(/:\s*(null)/g,': <span style="color:#8b949e">$1</span>');
}
function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyResult(){
  var text=document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
function copyFormatted(){
  var text=document.getElementById('inputJson').value;
  try{
    var obj=JSON.parse(text);
    var formatted=JSON.stringify(obj,null,2);
    navigator.clipboard.writeText(formatted).then(function(){alert('已复制格式化JSON');}).catch(function(){alert('复制失败');});
  }catch(e){
    alert('JSON格式错误，无法复制');
  }
}
formatJson();
</script></body></html>
