</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🧬 汉字进化22</h1><p class="sub">在线查看汉字进化过程</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="showEvolution()">
</div>
<button class="btn" onclick="showEvolution()">查看进化</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var evolutionData={
  '春':{stages:[{era:'甲骨文',char:'🌱',name:'会意字',desc:'从日从屯，草木生长'},{era:'金文',char:'春',name:'会意字',desc:'春日之形'},{era:'小篆',char:'春',name:'会意字',desc:'规范化春字'},{era:'隶书',char:'春',name:'方块字',desc:'更加规整'},{era:'楷书',char:'春',name:'标准字',desc:'现代标准写法'}]},
  '夏':{stages:[{era:'甲骨文',char:'☀️',name:'象形字',desc:'像人正面站立'},{era:'金文',char:'夏',name:'象形字',desc:'人形更加清晰'},{era:'小篆',char:'夏',name:'象形字',desc:'规范化夏字'},{era:'隶书',char:'夏',name:'方块字',desc:'更加规整'},{era:'楷书',char:'夏',name:'标准字',desc:'现代标准写法'}]},
  '秋':{stages:[{era:'甲骨文',char:'🍂',name:'会意字',desc:'从禾从火'},{era:'金文',char:'秋',name:'会意字',desc:'禾谷成熟'},{era:'小篆',char:'秋',name:'会意字',desc:'规范化秋字'},{era:'隶书',char:'秋',name:'方块字',desc:'更加规整'},{era:'楷书',char:'秋',name:'标准字',desc:'现代标准写法'}]},
  '冬':{stages:[{era:'甲骨文',char:'❄️',name:'会意字',desc:'从仌从夂'},{era:'金文',char:'冬',name:'会意字',desc:'终了之形'},{era:'小篆',char:'冬',name:'会意字',desc:'规范化冬字'},{era:'隶书',char:'冬',name:'方块字',desc:'更加规整'},{era:'楷书',char:'冬',name:'标准字',desc:'现代标准写法'}]},
  '风':{stages:[{era:'甲骨文',char:'💨',name:'象形字',desc:'像风吹动的样子'},{era:'金文',char:'風',name:'象形字',desc:'风字更加清晰'},{era:'小篆',char:'風',name:'象形字',desc:'规范化风字'},{era:'隶书',char:'風',name:'繁体字',desc:'繁体风字'},{era:'楷书',char:'风',name:'简体字',desc:'现代简体写法'}]},
  '雨':{stages:[{era:'甲骨文',char:'🌧️',name:'象形字',desc:'像天空下雨'},{era:'金文',char:'雨',name:'象形字',desc:'雨滴之形'},{era:'小篆',char:'雨',name:'象形字',desc:'规范化雨字'},{era:'隶书',char:'雨',name:'方块字',desc:'更加规整'},{era:'楷书',char:'雨',name:'标准字',desc:'现代标准写法'}]},
  '雪':{stages:[{era:'甲骨文',char:'🌨️',name:'形声字',desc:'从雨从彗'},{era:'金文',char:'雪',name:'形声字',desc:'雨旁更加清晰'},{era:'小篆',char:'雪',name:'形声字',desc:'规范化雪字'},{era:'隶书',char:'雪',name:'方块字',desc:'更加规整'},{era:'楷书',char:'雪',name:'标准字',desc:'现代标准写法'}]},
  '雷':{stages:[{era:'甲骨文',char:'⚡',name:'象形字',desc:'像闪电雷鸣'},{era:'金文',char:'雷',name:'象形字',desc:'雷声之形'},{era:'小篆',char:'雷',name:'象形字',desc:'规范化雷字'},{era:'隶书',char:'雷',name:'方块字',desc:'更加规整'},{era:'楷书',char:'雷',name:'标准字',desc:'现代标准写法'}]},
  '电':{stages:[{era:'甲骨文',char:'⚡',name:'象形字',desc:'像闪电形状'},{era:'金文',char:'電',name:'象形字',desc:'闪电之形'},{era:'小篆',char:'電',name:'象形字',desc:'规范化电字'},{era:'隶书',char:'電',name:'繁体字',desc:'繁体电字'},{era:'楷书',char:'电',name:'简体字',desc:'现代简体写法'}]},
  '霜':{stages:[{era:'甲骨文',char:'🌫️',name:'形声字',desc:'从雨相声'},{era:'金文',char:'霜',name:'形声字',desc:'雨旁更加清晰'},{era:'小篆',char:'霜',name:'形声字',desc:'规范化霜字'},{era:'隶书',char:'霜',name:'方块字',desc:'更加规整'},{era:'楷书',char:'霜',name:'标准字',desc:'现代标准写法'}]}
};
function showEvolution(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=evolutionData[char];
  if(!data){
    data={stages:[{era:'古代',char:char,name:'汉字',desc:'暂无详细进化信息'},{era:'现代',char:char,name:'标准字',desc:'现代标准写法'}]};
  }
  var html='<div class="card">';
  html+='<div style="text-align:center;margin-bottom:20px">';
  html+='<div style="font-size:4rem;font-weight:700;color:var(--blue)">'+char+'</div>';
  html+='<div style="font-size:1.1rem;color:var(--text2);margin-top:8px">汉字进化历程</div>';
  html+='</div>';
  html+='<div class="evolution-timeline">';
  data.stages.forEach(function(stage,index){
    html+='<div class="evolution-stage">';
    html+='<div class="evolution-char">'+stage.char+'</div>';
    html+='<div class="evolution-info">';
    html+='<div class="evolution-era">'+stage.era+'</div>';
    html+='<div class="evolution-name">'+stage.name+'</div>';
    html+='<div class="evolution-desc">'+stage.desc+'</div>';
    html+='</div>';
    if(index<data.stages.length-1){
      html+='<div class="evolution-line"></div>';
    }
    html+='</div>';
  });
  html+='</div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(evolutionData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showEvolution();
}
showEvolution();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
