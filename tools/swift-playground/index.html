<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swift 游乐场</title>
<meta name="description" content="Swift语言在线编辑器，编写和运行Swift代码">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.navbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.navbar a{color:var(--accent2);text-decoration:none;font-size:14px;display:flex;align-items:center;gap:6px}
.navbar a:hover{text-decoration:underline}
.navbar h1{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.navbar h1 span{color:var(--accent)}
.main{display:flex;flex:1;overflow:hidden;height:calc(100vh - 50px)}
.sidebar{width:260px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--warning);font-weight:600}
.sidebar ul{list-style:none;overflow-y:auto;flex:1;padding:8px}
.sidebar li{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text);transition:background .15s}
.sidebar li:hover{background:rgba(59,130,246,.15)}
.sidebar li.active{background:rgba(59,130,246,.2);color:var(--accent2);font-weight:500}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.editor-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--border)}
.editor-tabs{display:flex;gap:4px}
.editor-tab{padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;background:transparent;color:var(--text);border:1px solid transparent;transition:all .15s}
.editor-tab.active{background:var(--bg);border-color:var(--border);color:var(--accent2)}
.run-btn{padding:6px 16px;border-radius:6px;background:var(--accent);color:var(--text);border:none;font-size:13px;cursor:pointer;font-weight:500;transition:background .15s}
.run-btn:hover{background:var(--accent2)}
.run-btn:disabled{opacity:.5;cursor:not-allowed}
.editor-wrap{flex:1;position:relative;overflow:hidden}
#codeEditor{width:100%;height:100%;background:var(--bg);color:var(--text);border:none;resize:none;padding:16px;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:14px;line-height:1.6;tab-size:4;outline:none}
.output-panel{height:200px;border-top:1px solid var(--border);background:#000;display:flex;flex-direction:column;flex-shrink:0}
.output-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--border)}
.output-header span{font-size:13px;font-weight:600;color:var(--warning)}
.output-header button{background:none;border:none;color:var(--text);cursor:pointer;font-size:12px;padding:2px 8px;border-radius:4px}
.output-header button:hover{background:rgba(255,255,255,.1)}
#output{flex:1;padding:12px 16px;font-family:'Cascadia Code',Consolas,monospace;font-size:13px;line-height:1.5;overflow-y:auto;white-space:pre-wrap;color:var(--success)}
.info-panel{display:none;position:fixed;top:50px;right:20px;width:380px;max-height:calc(100vh - 80px);background:var(--card);border:1px solid var(--border);border-radius:8px;z-index:200;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.info-panel.show{display:flex;flex-direction:column}
.info-panel-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.info-panel-header h3{font-size:14px;color:var(--accent2)}
.info-panel-header button{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer}
.info-content{padding:16px;overflow-y:auto;flex:1;font-size:13px;line-height:1.7}
.info-content h4{color:var(--accent);margin:12px 0 6px;font-size:13px}
.info-content code{background:rgba(59,130,246,.15);padding:1px 6px;border-radius:3px;font-family:'Cascadia Code',Consolas,monospace;font-size:12px;color:var(--accent2)}
.info-content pre{background:#000;padding:10px;border-radius:6px;margin:6px 0;overflow-x:auto;font-size:12px;line-height:1.5}
.info-content pre code{background:none;padding:0}
@media(max-width:768px){.main{flex-direction:column}.sidebar{width:100%;max-height:150px;border-right:none;border-bottom:1px solid var(--border)}.info-panel{width:calc(100% - 20px);right:10px}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Swift 游乐场">
  <meta property="og:description" content="Swift语言在线编辑器，编写和运行Swift代码">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/swift-playground/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<nav class="navbar">
  <a href="/index.html">← 返回工具箱</a>
  <h1><span>S</span>wift 游乐场</h1>
  <button onclick="toggleInfo()" style="background:none;border:1px solid var(--border);color:var(--accent2);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:13px">语法参考</button>
</nav>
<div class="main">
  <aside class="sidebar">
    <div class="sidebar-header">📦 内置模板</div>
    <ul id="templateList"></ul>
  </aside>
  <div class="content">
    <div class="editor-area">
      <div class="editor-header">
        <div class="editor-tabs"><div class="editor-tab active">main.swift</div></div>
        <button class="run-btn" onclick="runCode()">▶ 运行</button>
      </div>
      <div class="editor-wrap"><textarea id="codeEditor" spellcheck="false"></textarea></div>
    </div>
    <div class="output-panel">
      <div class="output-header"><span>控制台输出</span><button onclick="clearOutput()">清空</button></div>
      <div id="output">// 点击"运行"查看模拟输出...</div>
    </div>
  </div>
</div>
<div class="info-panel" id="infoPanel">
  <div class="info-panel-header"><h2>Swift 语法参考</h2><button onclick="toggleInfo()">×</button></div>
  <div class="info-content" id="infoContent"></div>
</div>
<script>
const templates=[
  {name:"Hello World",code:`print("Hello, Swift!")\n\nlet name = "Swift"\nprint("你好, \\(name)!")\n\nlet numbers = [1, 2, 3, 4, 5]\nprint("数组: \\(numbers)")\n\nfor i in 1...3 {\n    print("\\(i)² = \\(i * i)")\n}`},
  {name:"Optional 可选值",code:`func divide(_ a: Int, by b: Int) -> Int? {\n    guard b != 0 else { return nil }\n    return a / b\n}\n\nlet result = divide(10, by: 3)\nif let value = result {\n    print("10 / 3 = \\(value)")\n}\n\n
  {name:"Protocol 协议",code:`protocol Drawable {\n    func draw()\n    var area: Double { get }\n}\n\nstruct Circle: Drawable {\n    var radius: Double\n    var area: Double { .pi * radius * radius }\n    func draw() { print("Drawing circle with radius \\(radius)") }\n}\n\nstruct Rect: Drawable {\n    var width: Double\n    var height: Double\n    var area: Double { width * height }\n    func draw() { print("Drawing rect \\(width)x\\(height)") }\n}\n\nprotocol Cacheable {\n    associatedtype Key: Hashable\n    func get(_ key: Key) -> String?\n    mutating func set(_ key: Key, value: String)\n}\n\nstruct MemCache: Cacheable {\n    typealias Key = String\n    private var storage: [String: String] = [:]\n    func get(_ key: String) -> String? { storage[key] }\n    mutating func set(_ key: String, value: String) { storage[key] = value }\n}\n\nfunc totalArea(_ items: [Drawable]) -> Double {\n    items.reduce(0) { $0 + $1.area }\n}\n\nlet shapes: [Drawable] = [Circle(radius: 5), Rect(width: 4, height: 6)]\nshapes.forEach { $0.draw(); print("  Area: \\(String(format: "%.2f", $0.area))") }\nprint("总面积: \\(String(format: "%.2f", totalArea(shapes)))")`},
  {name:"Extension 扩展",code:`extension String {\n    var isEmail: Bool {\n        range(of: "[A-Z0-9a-z._%+-]+@[A-Za-z0-9.-]+\\\\.[A-Za-z]{2,}",\n              options: .regularExpression) != nil\n    }\n    func truncated(_ maxLen: Int) -> String {\n        count > maxLen ? prefix(maxLen) + "..." : self\n    }\n}\n\nextension Array where Element == Int {\n    var average: Double {\n        isEmpty ? 0 : Double(reduce(0, +)) / Double(count)\n    }\n}\n\nextension Optional where Wrapped == String {\n    var orEmpty: String { self ?? "" }\n}\n\nprint("test@email.com isEmail: \\("test@email.com".isEmail)")\nprint("长文本截断: \\("这是一段很长的内容".truncated(5))")\nprint("平均值: \\([10, 20, 30].average)")\n\nlet maybeName: String? = nil\nprint("空值处理: '\\(maybeName.orEmpty)'")`},
  {name:"Closure 闭包",code:`
  {name:"Struct 结构体",code:`struct Point: CustomStringConvertible {\n    var x: Double\n    var y: Double\n    var description: String { "P(\\(x), \\(y))" }\n    \n    static let zero = Point(x: 0, y: 0)\n    \n    func distance(to other: Point) -> Double {\n        let dx = x - other.x\n        let dy = y - other.y\n        return (dx*dx + dy*dy).squareRoot()\n    }\n    mutating func moveBy(dx: Double, dy: Double) {\n        x += dx\n        y += dy\n    }\n}\n\nstruct Rectangle {\n    var origin: Point\n    var width: Double\n    var height: Double\n    \n    var area: Double { width * height }\n    var center: Point {\n        Point(x: origin.x + width/2, y: origin.y + height/2)\n    }\n}\n\nvar p1 = Point(x: 0, y: 0)\nvar p2 = Point(x: 3, y: 4)\nprint("\\(p1) 到 \\(p2) 距离: \\(p1.distance(to: p2))")\n\np1.moveBy(dx: 1, dy: 1)\nprint("移动后: \\(p1)")\n\nlet rect = Rectangle(origin: .zero, width: 10, height: 5)\nprint("矩形面积: \\(rect.area), 中心: \\(rect.center)")`},
  {name:"Enum 枚举",code:`enum Direction: CaseIterable {\n    case north, south, east, west\n    \n    var emoji: String {\n        switch self {\n        case .north: return "⬆️"\n        case .south: return "⬇️"\n        case .east: return "➡️"\n        case .west: return "⬅️"\n        }\n    }\n}\n\nenum NetworkResult {\n    case success(data: String, code: Int)\n    case failure(error: String)\n    case loading\n}\n\nfunc handleResult(_ result: NetworkResult) {\n    switch result {\n    case .success(let data, let code):\n        print("✅ [\\(code)] \\(data)")\n    case .failure(let error):\n        print("❌ \\(error)")\n    case .loading:\n        print("⏳ 加载中...")\n    }\n}\n\nDirection.allCases.forEach { print("\\($0.emoji) \\($0)") }\n\nlet results: [NetworkResult] = [\n    .success(data: "用户数据", code: 200),\n    .failure(error: "超时"),\n    .loading\n]\nresults.forEach { handleResult($0) }`}
];
const syntaxRef=`<h4>基本语法</h4>
<pre><code>
let name = "Swift"
var count = 0
let pi: Double = 3.14
let items: [String] = ["a", "b"]
print("Hello, \\(name)!")</code></pre>
<h4>Optional 可选值</h4>
<pre><code>var name: String? = nil
if let n = name { print(n) }
func greet(_ name: String?) {
    guard let n = name else { return }
    print("Hello, \\(n)")
}
let v = name ?? "default"</code></pre>
<h4>Protocol 协议</h4>
<pre><code>protocol Drawable {
    func draw()
    var area: Double { get }
}
struct Circle: Drawable {
    var radius: Double
    var area: Double { .pi * radius * radius }
    func draw() { ... }
}</code></pre>
<h4>Extension 扩展</h4>
<pre><code>extension String {
    var isEmail: Bool {
        range(of: "...",
              options: .regularExpression) != nil
    }
}
extension Array where Element == Int {
    var average: Double { ... }
}</code></pre>
<h4>闭包 Closure</h4>
<pre><code>let greet = { (name: String) -> String in
    "Hello, \\(name)!"
}
numbers.filter { $0 > 0 }
       .map { $0 * 2 }</code></pre>
<h4>Struct 结构体</h4>
<pre><code>struct Point {
    var x: Double
    var y: Double
    mutating func move(dx: Double) {
        x += dx
    }
}
let p = Point(x: 0, y: 0)</code></pre>
<h4>Enum 枚举</h4>
<pre><code>enum Result {
    case success(data: String)
    case failure(error: String)
}
switch result {
case .success(let data): ...
case .failure(let error): ...
}</code></pre>
<h4>错误处理</h4>
<pre><code>enum Error: Swift.Error {
    case notFound, unauthorized
}
func load() throws -> String {
    throw Error.notFound
}
do {
    let s = try load()
} catch { print(error) }</code></pre>`;
const el=document.getElementById('codeEditor');
const templateList=document.getElementById('templateList');
templates.forEach((t,i)=>{
  const li=document.createElement('li');
  li.textContent=t.name;
  li.onclick=()=>{el.value=t.code;document.querySelectorAll('.sidebar li').forEach(l=>l.classList.remove('active'));li.classList.add('active');clearOutput()};
  if(i===0)li.classList.add('active');
  templateList.appendChild(li);
});
el.value=templates[0].code;
document.getElementById('infoContent').innerHTML=syntaxRef;
function toggleInfo(){document.getElementById('infoPanel').classList.toggle('show')}
function clearOutput(){document.getElementById('output').textContent=''}
function runCode(){
  const btn=document.querySelector('.run-btn');
  btn.disabled=true;btn.textContent='⏳ 运行中...';
  const output=document.getElementById('output');output.textContent='';
  setTimeout(()=>{
    const code=el.value;
    const lines=[];
    const printMatches=code.match(/print\(([^)]*(?:\([^)]*\))*[^)]*)\)/g)||[];
    printMatches.forEach(m=>{
      let arg=m.replace(/^print\(/,'').replace(/\)$/,'');
      if(arg.startsWith('"')&&arg.endsWith('"'))lines.push(arg.slice(1,-1));
      else if(arg.startsWith('"\\\\(')||arg.startsWith('"\\(')){
        let s=arg.replace(/^"|"$/g,'');
        s=s.replace(/\\\\?\(([^)]+)\)/g,'$1');
        lines.push(s);
      }
      else lines.push(`
    });
    if(lines.length===0){lines.push('✅ 代码语法检查通过');lines.push('(注: 浏览器环境无法真正执行Swift，已模拟print输出)');}
    else{lines.push('');lines.push('--- 程序执行完毕 ---');}
    output.textContent=lines.join('\n');output.style.color='var(--success)';
    btn.disabled=false;btn.textContent='▶ 运行';
  },800);
}
el.addEventListener('keydown',function(e){
  if(e.key==='Tab'){e.preventDefault();const s=this.selectionStart;this.value=this.value.substring(0,s)+'    '+this.value.substring(this.selectionEnd);this.selectionStart=this.selectionEnd=s+4;}
});
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
