<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>记忆翻牌</title>
<meta property="og:title" content="记忆翻牌">
<meta property="og:description" content="记忆翻牌 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="经典记忆配对翻牌游戏，翻找相同的卡片配对消除">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px;overflow-x:hidden;scroll-behavior:smoothpadding:16px;}
h1{font-size:1.5rem;margin-bottom:12px;color:#f97316;text-shadow:0 0 10px #f9731644}
.hud{display:flex;gap:16px;margin-bottom:16px;font-size:0.95rem;color:var(--text2)}
.hud span{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 14px}
.grid{display:grid;gap:8px;margin-bottom:16px}
.card{width:72px;height:72px;border-radius:8px;cursor:pointer;perspective:600px;position:relative}
.card-inner{width:100%;height:100%;transition:transform 0.4s;transform-style:preserve-3d;position:relative}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card.matched .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;border:2px solid var(--border)}
.card-back{background:#30363d;color:#8b949e}
.card-front{background:var(--card);transform:rotateY(180deg);border-color:#f97316}
.card.matched .card-front{border-color:var(--green);background:var(--green)22}
.btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:1rem;cursor:pointer;margin-top:8px}
.btn:hover{opacity:.9}
.diff{display:flex;gap:8px;margin-bottom:16px}
.diff button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.9rem}
.diff button.active{border-color:var(--blue);background:var(--blue);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>🃏 记忆翻牌</h1>
<div class="diff">
<button onclick="setDiff(4,3)" id="d4" class="active">4×3</button>
<button onclick="setDiff(4,4)" id="d44">4×4</button>
<button onclick="setDiff(6,4)" id="d6">6×4</button>
</div>
<div class="hud"><span>步数: <b id="moves">0</b></span><span>配对: <b id="pairs">0</b>/<b id="total">6</b></span><span>时间: <b id="time">0</b>s</span></div>
<div class="grid" id="grid"></div>
<button class="btn" onclick="initGame()">重新开始</button>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
<script>
const EMOJIS=['🍎','🍊','🍋','🍇','🍉','🍓','🍒','🍑','🥝','🌸','🌙','⭐','🔥','💎','🎵','🎨','🎮','🎯','🎲','🏆'];
let cols=4,rows=3,flipped=[],matched=[],moves=0,pairs=0,lock=false,timer=0,interval=null;

function setDiff(c,r){cols=c;rows=r;document.querySelectorAll('.diff button').forEach(b=>b.classList.remove('active'));document.getElementById('d'+c+(c===r?'4':'')).classList.add('active');initGame()}

function initGame(){
clearInterval(interval);timer=0;moves=0;pairs=0;flipped=[];matched=[];lock=false;
const total=(cols*rows)/2;
document.getElementById('moves').textContent='0';
document.getElementById('pairs').textContent='0';
document.getElementById('total').textContent=total;
document.getElementById('time').textContent='0';
const emojis=shuffle(EMOJIS).slice(0,total);
const cards=shuffle([...emojis,...emojis]);
const grid=document.getElementById('grid');
grid.style.gridTemplateColumns=`repeat(${cols},72px)`;
grid.innerHTML='';
cards.forEach((e,i)=>{
const card=document.createElement('div');card.className='card';card.dataset.emoji=e;card.dataset.idx=i;
card.innerHTML=`<div class="card-inner"><div class="card-face card-back">❓</div><div class="card-face card-front">${e}</div></div>`;
card.onclick=()=>flip(card);grid.appendChild(card)
});
interval=setInterval(()=>{timer++;document.getElementById('time').textContent=timer},1000);
}

function flip(card){
if(lock||card.classList.contains('flipped')||card.classList.contains('matched'))return;
card.classList.add('flipped');flipped.push(card);
if(flipped.length===2){moves++;document.getElementById('moves').textContent=moves;lock=true;
if(flipped[0].dataset.emoji===flipped[1].dataset.emoji){
flipped.forEach(c=>c.classList.add('matched'));matched.push(flipped[0].dataset.emoji);
pairs++;document.getElementById('pairs').textContent=pairs;flipped=[];lock=false;
if(pairs===(cols*rows)/2){clearInterval(interval);setTimeout(()=>alert('🎉 恭喜完成! 用时'+timer+'秒, '+moves+'步'),300)}
}else{setTimeout(()=>{flipped.forEach(c=>c.classList.remove('flipped'));flipped=[];lock=false},700)}
}
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
initGame();
</script>
</body>
</html>
