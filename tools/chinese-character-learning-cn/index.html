function setLevel(lv,el){level=lv;currentIdx=0;flipped=false;learned={};
document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});el.classList.add('active');
showCard();renderList();}
function showCard(){
var cards=levels[level];if(!cards||!cards.length)return;
document.getElementById('cardArea').style.display='block';
var ch=cards[currentIdx];
document.getElementById('frontChar').textContent=ch.c;
document.getElementById('backInfo').innerHTML='<div style="font-size:2rem;font-weight:700;margin-bottom:8px">'+ch.c+'</div><div style="font-size:1.1rem;margin-bottom:4px">拼音：'+ch.p+'</div><div>部首：'+ch.r+' | 笔画：'+ch.s+'画 | 结构：'+ch.st+'</div><div style="margin-top:8px;color:var(--text2)">'+ch.m+'</div>';
document.getElementById('flashcard').classList.remove('flipped');flipped=false;
updateStats();}
function flipCard(){flipped=!flipped;document.getElementById('flashcard').classList.toggle('flipped',flipped);}
function nextCard(){var cards=levels[level];currentIdx=(currentIdx+1)%cards.length;showCard();}
function prevCard(){var cards=levels[level];currentIdx=(currentIdx-1+cards.length)%cards.length;showCard();}
function markLearned(){var cards=levels[level];var c=cards[currentIdx].c;learned[c]=true;nextCard();updateStats();renderList();}
function updateStats(){
var cards=levels[level];var total=cards.length;var lCount=0;
cards.forEach(function(ch){if(learned[ch.c])lCount++;});
document.getElementById('learnedCount').textContent=lCount;
document.getElementById('remainCount').textContent=total-lCount;
document.getElementById('totalCards').textContent=total;
document.getElementById('progressFill').style.width=(total?lCount/total*100:0)+'%';}
function renderList(){
var cards=levels[level];var html='<div class="card"><h3 style="margin-bottom:8px">字卡列表</h3><div class="learn-list">';
cards.forEach(function(ch,i){
var cls=learned[ch.c]?'learn-chip learned':'learn-chip';
html+='<div class="'+cls+'" onclick="currentIdx='+i+';showCard()">'+ch.c+'</div>';});
html+='</div></div>';document.getElementById('learnList').innerHTML=html;}
setLevel('basic',document.querySelector('.tab'));
