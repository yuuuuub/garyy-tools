<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行天气查询</title>
<meta property="og:title" content="旅行天气查询">
<meta property="og:description" content="查询旅行目的地天气预报">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="旅行天气查询工具，了解目的地天气，合理安排行程">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:16px;min-height:100vh;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text);margin-right:4px;margin-bottom:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.weather-now{display:flex;align-items:center;gap:20px;padding:20px;background:var(--bg);border-radius:var(--radius);margin-bottom:16px}
.weather-icon{font-size:4rem;line-height:1}
.weather-temp{font-size:3rem;font-weight:700;line-height:1}
.weather-desc{font-size:1rem;color:var(--text2)}
.weather-detail{display:flex;gap:20px;margin-top:4px;font-size:.85rem;color:var(--text2)}
.forecast{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.forecast-day{min-width:80px;text-align:center;padding:12px 8px;background:var(--bg);border-radius:var(--radius);flex-shrink:0}
.forecast-day .day{font-size:.8rem;color:var(--text2);margin-bottom:4px}
.forecast-day .icon{font-size:1.8rem;margin-bottom:4px}
.forecast-day .temp{font-size:.9rem;font-weight:600}
.forecast-day .range{font-size:.75rem;color:var(--text2)}
.suggestion-card{background:var(--bg);border-radius:8px;padding:12px;margin-bottom:8px}
.suggestion-card .title{font-weight:600;font-size:.9rem;margin-bottom:4px}
.suggestion-card .desc{font-size:.85rem;color:var(--text2)}
.suggestion-icon{font-size:1.2rem;margin-right:6px}
.city-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.city-card{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;transition:all .15s}
.city-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.city-card .city-icon{font-size:1.5rem}
.city-card .city-name{font-size:.85rem;font-weight:600;margin:4px 0}
.city-card .city-temp{font-size:.8rem;color:var(--text2)}
.packing-tips{margin-top:8px}
.packing-tips li{font-size:.85rem;padding:4px 0;color:var(--text2);list-style:none}
.packing-tips li::before{content:'✓ ';color:var(--success)}
.es{text-align:center;padding:40px;color:var(--text2)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🌤️ 旅行天气查询</h1><p>了解目的地天气，合理安排行程</p></div>

<div class="cd"><h2>🔍 查询天气</h2>
<div style="display:flex;gap:8px">
<select id="citySelect" style="flex:1"></select>
<button onclick="queryWeather()" style="width:auto;white-space:nowrap">🔍 查询</button>
</div></div>

<div class="cd" id="nowCard"><h2>📍 今日天气</h2><div id="currentWeather"></div></div>

<div class="cd"><h2>📅 7日预报</h2><div class="forecast" id="forecast"></div></div>

<div class="cd"><h2>👔 穿衣建议</h2><div id="clothingSuggestion"></div></div>

<div class="cd"><h2>📋 出行建议</h2><div id="travelSuggestion"></div></div>

<div class="cd"><h2>🧳 天气行李建议</h2><ul class="packing-tips" id="packingTips"></ul></div>

<div class="cd"><h2>🏙️ 热门城市速查</h2><div class="city-grid" id="cityGrid"></div></div>
</div>

<script>
const WEATHER_DATA={
  '北京':{temp:28,humidity:55,wind:3,icon:'☀️',desc:'晴',high:32,low:22,uv:8,air:'良',
    forecast:[{d:'周一',icon:'☀️',h:32,l:22},{d:'周二',icon:'⛅',h:30,l:21},{d:'周三',icon:'🌧️',h:26,l:19},{d:'周四',icon:'⛅',h:29,l:20},{d:'周五',icon:'☀️',h:33,l:23},{d:'周六',icon:'☀️',h:34,l:24},{d:'周日',icon:'⛅',h:31,l:22}]},
  '上海':{temp:30,humidity:70,wind:4,icon:'⛅',desc:'多云',high:33,low:25,uv:6,air:'良',
    forecast:[{d:'周一',icon:'⛅',h:33,l:25},{d:'周二',icon:'🌧️',h:29,l:24},{d:'周三',icon:'🌧️',h:28,l:23},{d:'周四',icon:'⛅',h:31,l:24},{d:'周五',icon:'☀️',h:34,l:26},{d:'周六',icon:'⛅',h:32,l:25},{d:'周日',icon:'☀️',h:35,l:26}]},
  '广州':{temp:33,humidity:80,wind:2,icon:'☀️',desc:'晴热',high:36,low:27,uv:9,air:'良',
    forecast:[{d:'周一',icon:'☀️',h:36,l:27},{d:'周二',icon:'☀️',h:37,l:28},{d:'周三',icon:'⛈️',h:32,l:26},{d:'周四',icon:'🌧️',h:30,l:25},{d:'周五',icon:'⛅',h:33,l:26},{d:'周六',icon:'☀️',h:35,l:27},{d:'周日',icon:'☀️',h:36,l:28}]},
  '成都':{temp:26,humidity:75,wind:1,icon:'🌧️',desc:'小雨',high:28,low:20,uv:3,air:'良',
    forecast:[{d:'周一',icon:'🌧️',h:28,l:20},{d:'周二',icon:'🌧️',h:27,l:19},{d:'周三',icon:'⛅',h:30,l:21},{d:'周四',icon:'☀️',h:32,l:22},{d:'周五',icon:'⛅',h:31,l:21},{d:'周六',icon:'🌧️',h:28,l:20},{d:'周日',icon:'⛅',h:30,l:21}]},
  '杭州':{temp:29,humidity:65,wind:3,icon:'⛅',desc:'多云',high:32,low:24,uv:6,air:'良',
    forecast:[{d:'周一',icon:'⛅',h:32,l:24},{d:'周二',icon:'☀️',h:34,l:25},{d:'周三',icon:'🌧️',h:29,l:23},{d:'周四',icon:'⛅',h:31,l:24},{d:'周五',icon:'☀️',h:33,l:25},{d:'周六',icon:'⛅',h:32,l:24},{d:'周日',icon:'☀️',h:35,l:26}]},
  '深圳':{temp:31,humidity:78,wind:3,icon:'☀️',desc:'晴',high:34,low:26,uv:8,air:'优',
    forecast:[{d:'周一',icon:'☀️',h:34,l:26},{d:'周二',icon:'⛅',h:33,l:25},{d:'周三',icon:'☀️',h:35,l:27},{d:'周四',icon:'⛈️',h:30,l:24},{d:'周五',icon:'⛅',h:32,l:25},{d:'周六',icon:'☀️',h:34,l:26},{d:'周日',icon:'☀️',h:35,l:27}]},
  '西安':{temp:30,humidity:50,wind:4,icon:'☀️',desc:'晴',high:34,low:21,uv:9,air:'良',
    forecast:[{d:'周一',icon:'☀️',h:34,l:21},{d:'周二',icon:'☀️',h:35,l:22},{d:'周三',icon:'⛅',h:33,l:21},{d:'周四',icon:'🌧️',h:28,l:19},{d:'周五',icon:'⛅',h:31,l:20},{d:'周六',icon:'☀️',h:34,l:22},{d:'周日',icon:'☀️',h:35,l:23}]},
  '三亚':{temp:32,humidity:75,wind:5,icon:'☀️',desc:'晴热',high:34,low:27,uv:10,air:'优',
    forecast:[{d:'周一',icon:'☀️',h:34,l:27},{d:'周二',icon:'☀️',h:35,l:28},{d:'周三',icon:'⛅',h:33,l:27},{d:'周四',icon:'☀️',h:34,l:28},{d:'周五',icon:'⛈️',h:30,l:26},{d:'周六',icon:'⛅',h:32,l:27},{d:'周日',icon:'☀️',h:34,l:28}]},
  '丽江':{temp:22,humidity:60,wind:2,icon:'⛅',desc:'多云',high:25,low:14,uv:7,air:'优',
    forecast:[{d:'周一',icon:'⛅',h:25,l:14},{d:'周二',icon:'☀️',h:26,l:15},{d:'周三',icon:'🌧️',h:22,l:13},{d:'周四',icon:'⛅',h:24,l:14},{d:'周五',icon:'☀️',h:26,l:15},{d:'周六',icon:'⛅',h:25,l:14},{d:'周日',icon:'☀️',h:27,l:16}]},
  '哈尔滨':{temp:24,humidity:55,wind:4,icon:'☀️',desc:'晴',high:28,low:16,uv:6,air:'优',
    forecast:[{d:'周一',icon:'☀️',h:28,l:16},{d:'周二',icon:'⛅',h:26,l:15},{d:'周三',icon:'🌧️',h:22,l:13},{d:'周四',icon:'⛅',h:25,l:14},{d:'周五',icon:'☀️',h:29,l:17},{d:'周六',icon:'☀️',h:30,l:18},{d:'周日',icon:'⛅',h:27,l:16}]}
};
const CLOTHING_MAP={
  hot:'短袖、短裤、凉鞋、遮阳帽、太阳镜',
  warm:'薄外套、长裤、运动鞋',
  cool:'夹克、卫衣、长裤',
  cold:'羽绒服、保暖内衣、帽子围巾手套'
};
function $(id){return document.getElementById(id)}
function initCities(){
  const cities=Object.keys(WEATHER_DATA);
  $('citySelect').innerHTML=cities.map(c=>`<option value="${c}">${c}</option>`).join('');
  $('cityGrid').innerHTML=cities.map(c=>{
    const w=WEATHER_DATA[c];
    return `<div class="city-card" onclick="document.getElementById('citySelect').value='${c}';queryWeather()">
      <div class="city-icon">${w.icon}</div><div class="city-name">${c}</div><div class="city-temp">${w.temp}°C</div></div>`;
  }).join('');
}
function queryWeather(){
  const city=$('citySelect').value;
  const w=WEATHER_DATA[city];if(!w)return;
  $('currentWeather').innerHTML=`<div class="weather-now">
    <div class="weather-icon">${w.icon}</div>
    <div><div class="weather-temp">${w.temp}°C</div><div class="weather-desc">${w.desc} · ${city}</div>
    <div class="weather-detail"><span>💧 湿度 ${w.humidity}%</span><span>🌬️ 风力 ${w.wind}级</span><span>☀️ UV ${w.uv}</span><span>🌫️ 空气${w.air}</span></div></div></div>`;
  $('forecast').innerHTML=w.forecast.map(f=>`<div class="forecast-day">
    <div class="day">${f.d}</div><div class="icon">${f.icon}</div>
    <div class="temp">${f.h}°/${f.l}°</div><div class="range">${f.l}-${f.h}°C</div></div>`).join('');
  let tempCat=w.temp>=30?'hot':w.temp>=20?'warm':w.temp>=10?'cool':'cold';
  const clothing=CLOTHING_MAP[tempCat];
  $('clothingSuggestion').innerHTML=`<div class="suggestion-card"><div class="title"><span class="suggestion-icon">👔</span>推荐穿搭</div>
    <div class="desc">当前温度 ${w.temp}°C，建议穿着：${clothing}</div></div>`;
  const suggestions=[];
  if(w.uv>=6)suggestions.push({icon:'🧴',t:'防晒提醒',d:'紫外线较强，建议涂抹防晒霜SPF30+'});
  if(w.humidity>=70)suggestions.push({icon:'💧',t:'防潮提醒',d:'湿度较高，衣物不易晾干，建议带速干衣'});
  if(w.wind>=4)suggestions.push({icon:'🧥',t:'防风提醒',d:'风力较大，建议携带防风外套'});
  if(w.desc.includes('雨'))suggestions.push({icon:'☂️',t:'雨具提醒',d:'有降雨可能，请携带雨伞或雨衣'});
  if(w.temp>=33)suggestions.push({icon:'🧊',t:'防暑提醒',d:'气温较高，注意防暑降温，多补充水分'});
  suggestions.push({icon:'💊',t:'常备药品',d:'建议携带感冒药、肠胃药、创可贴等'});
  $('travelSuggestion').innerHTML=suggestions.map(s=>`<div class="suggestion-card">
    <div class="title"><span class="suggestion-icon">${s.icon}</span>${s.t}</div><div class="desc">${s.d}</div></div>`).join('');
  const tips=[];
  if(w.temp>=30)tips.push('防晒霜','太阳镜','遮阳帽','便携风扇','清凉喷雾');
  if(w.desc.includes('雨'))tips.push('雨伞','防水背包','防水鞋套');
  if(w.temp<=15)tips.push('保暖内衣','暖宝宝','保温杯');
  tips.push('充电宝','水杯','常用药品');
  $('packingTips').innerHTML=tips.map(t=>`<li>${t}</li>`).join('');
}
initCities();queryWeather();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
