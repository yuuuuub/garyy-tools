<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国武术赛事大全 - Chinese Martial Arts Competitions</title>
<meta name="description" content="中国武术赛事大全，涵盖武术套路、散打、太极、传统武术等各类武术比赛">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国武术赛事大全 - Chinese Martial Arts Competitions">
<meta property="og:description" content="中国武术赛事大全，涵盖武术套路、散打、太极、传统武术等各类武术比赛">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-martial-arts-competitions-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a05 0%,#2a1510 50%,#3d2015 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a,#b06a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px}
.comp-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.comp-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.comp-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.comp-card .c-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.comp-card .c-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(232,168,124,0.15);color:var(--accent)}
.comp-card .c-name{font-size:1.3em;font-weight:bold}
.comp-card .c-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.comp-card .c-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.comp-card .c-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.comp-card .c-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.comp-card .c-detail strong{color:var(--text)}
.comp-card .c-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.comp-card .c-items span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.comp-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.comp-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🏆 中国武术赛事大全</h1>
<p>Chinese Martial Arts Competitions — 从国内到国际的武术赛事</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索赛事名称或类型...">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部赛事</button>
<button class="filter-btn" data-filter="国际赛事">🌍 国际赛事</button>
<button class="filter-btn" data-filter="国内赛事">🇨🇳 国内赛事</button>
<button class="filter-btn" data-filter="套路比赛">🥋 套路比赛</button>
<button class="filter-btn" data-filter="散打比赛">🥊 散打比赛</button>
<button class="filter-btn" data-filter="传统武术">🏯 传统武术</button>
<button class="filter-btn" data-filter="太极比赛">☯️ 太极比赛</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="comp-grid" id="compGrid"></div>
<footer><p>🏆 中国武术赛事大全 — 以武会友，切磋技艺</p></footer>
</div>
<script>
const COMP_DATA=[
  {id:1,name:"世界武术锦标赛",en:"World Wushu Championships",category:"国际赛事",icon:"🌍",organizer:"国际武术联合会",frequency:"每两年一届",firstHeld:1991,countries:150,description:"世界武术锦标赛是国际武术联合会主办的最高级别武术赛事，涵盖武术套路和散打两大项目，是武术界的'世界杯'。",events:["长拳","南拳","太极拳","刀术","剑术","枪术","棍术","散打"],prizes:["金牌","银牌","铜牌","最佳技术奖"],significance:"武术界最高级别赛事"},
  {id:2,name:"亚洲武术锦标赛",en:"Asian Wushu Championships",category:"国际赛事",icon:"🌏",organizer:"亚洲武术联合会",frequency:"每两年一届",firstHeld:1987,countries:40,description:"亚洲武术锦标赛是亚洲地区最高级别的武术赛事，汇聚亚洲各国武术精英，是亚运会武术项目的选拔赛。",events:["长拳","南拳","太极拳","刀术","剑术","枪术","棍术","散打"],prizes:["金牌","银牌","铜牌"],significance:"亚洲最高级别武术赛事"},
  {id:3,name:"全运会武术比赛",en:"National Games Wushu",category:"国内赛事",icon:"🇨🇳",organizer:"国家体育总局",frequency:"每四年一届",firstHeld:1959,description:"全运会武术比赛是中国国内最高级别的武术赛事，各省市区派队参赛，是国内武术竞技的最高殿堂。",events:["长拳","南拳","太极拳","刀术","剑术","枪术","棍术","散打"],prizes:["金牌","银牌","铜牌"],significance:"国内最高级别武术赛事"},
  {id:4,name:"全国武术套路锦标赛",en:"National Wushu Taolu Championships",category:"套路比赛",icon:"🥋",organizer:"中国武术协会",frequency:"每年一届",firstHeld:1958,description:"全国武术套路锦标赛是国内武术套路项目的最高级别赛事，汇聚全国武术套路精英。",events:["长拳","南拳","太极拳","刀术","剑术","枪术","棍术","对练"],prizes:["金牌","银牌","铜牌"],significance:"国内套路最高赛事"},
  {id:5,name:"全国武术散打锦标赛",en:"National Sanda Championships",category:"散打比赛",icon:"🥊",organizer:"中国武术协会",frequency:"每年一届",firstHeld:1989,description:"全国武术散打锦标赛是国内散打项目的最高级别赛事，是国内散打运动员展示实力的舞台。",events:["56kg","60kg","65kg","70kg","75kg","80kg","85kg","90kg以上"],prizes:["金牌","银牌","铜牌"],significance:"国内散打最高赛事"},
  {id:6,name:"世界太极拳健康大会",en:"World Tai Chi Health Conference",category:"太极比赛",icon:"☯️",organizer:"国际武术联合会",frequency:"每年一届",firstHeld:2000,description:"世界太极拳健康大会是太极拳领域的国际盛会，涵盖太极拳竞赛、展示、研讨等多个环节。",events:["太极拳竞赛","太极剑竞赛","太极扇展示","太极推手","太极拳研讨"],prizes:["金牌","银牌","铜牌","最佳传承奖"],significance:"太极拳国际盛会"},
  {id:7,name:"中国传统武术大赛",en:"Chinese Traditional Wushu Competition",category:"传统武术",icon:"🏯",organizer:"中国武术协会",frequency:"每年一届",firstHeld:2000,description:"中国传统武术大赛是国内传统武术的最高赛事，涵盖各门各派的传统拳术和器械。",events:["少林拳","太极拳","形意拳","八卦掌","咏春拳","洪拳","螳螂拳","各类器械"],prizes:["金奖","银奖","铜奖","最佳传承奖"],significance:"传统武术最高赛事"},
  {id:8,name:"国际武术邀请赛",en:"International Wushu Invitational",category:"国际赛事",icon:"🌍",organizer:"中国武术协会",frequency:"每年一届",firstHeld:1985,description:"国际武术邀请赛是中国主办的国际武术赛事，邀请世界各国武术高手参赛，促进国际武术交流。",events:["武术套路","散打","太极推手","传统武术"],prizes:["金牌","银牌","铜牌"],significance:"国际武术交流平台"},
  {id:9,name:"全国太极拳公开赛",en:"National Tai Chi Open",category:"太极比赛",icon:"☯️",organizer:"中国武术协会",frequency:"每年一届",firstHeld:2010,description:"全国太极拳公开赛是国内太极拳项目的大型赛事，面向全社会开放，参与人数众多。",events:["太极拳竞赛","太极剑竞赛","太极扇竞赛","太极推手","集体项目"],prizes:["金牌","银牌","铜牌","最佳组织奖"],significance:"国内太极拳大型赛事"},
  {id:10,name:"世界散打世界杯",en:"Sanda World Cup",category:"散打比赛",icon:"🥊",organizer:"国际武术联合会",frequency:"每两年一届",firstHeld:2002,description:"散打世界杯是国际武术联合会主办的散打项目最高级别赛事，是散打界的'世界杯'。",events:["56kg","60kg","65kg","70kg","75kg","80kg","85kg","90kg以上"],prizes:["金牌","银牌","铜牌"],significance:"散打界最高赛事"},
  {id:11,name:"全国武术之乡比赛",en:"National Wushu Hometown Competition",category:"国内赛事",icon:"🇨🇳",organizer:"中国武术协会",frequency:"每年一届",firstHeld:2005,description:"全国武术之乡比赛面向全国武术之乡单位，展示各地武术特色和传承成果。",events:["武术套路","散打","传统武术","集体项目"],prizes:["金牌","银牌","铜奖","最佳传承奖"],significance:"武术之乡展示平台"},
  {id:12,name:"国际太极拳邀请赛",en:"International Tai Chi Invitational",category:"太极比赛",icon:"☯️",organizer:"国际武术联合会",frequency:"每年一届",firstHeld:2005,description:"国际太极拳邀请赛是太极拳领域的国际赛事，邀请世界各国太极拳高手参赛。",events:["太极拳竞赛","太极剑竞赛","太极推手","太极扇展示"],prizes:["金牌","银牌","铜牌"],significance:"太极拳国际交流平台"}
];
function renderCards(data){
  document.getElementById('compGrid').innerHTML=data.map(m=>`
    <div class="comp-card" data-category="${m.category}">
      <div class="c-header"><div class="c-icon">${m.icon}</div><div><div class="c-name">${m.name}</div><div class="c-sub">${m.en} · ${m.organizer}</div></div></div>
      <div class="c-meta"><span>创办：${m.firstHeld}年</span><span>周期：${m.frequency}</span></div>
      <div class="c-detail"><strong>简介：</strong>${m.description}</div>
      <div class="c-detail"><strong>项目：</strong>${m.events.join('、')}</div>
      <div class="c-detail"><strong>奖项：</strong>${m.prizes.join('、')}</div>
      <div class="c-detail"><strong>意义：</strong>${m.significance}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">武术赛事</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.comp-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.comp-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(COMP_DATA);renderStats(COMP_DATA);
</script>
</body>
</html>
