<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 成本效益分析</title>
<meta name="description" content="成本效益分析工具，科学评估项目投资回报">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:800px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
button.grn{background:var(--green)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.item-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--border)}
.item-row input,.item-row select{margin-bottom:0;font-size:.85rem;padding:8px 10px}
.item-row input:first-child{flex:2}
.item-row input[type=number]{width:100px}
.item-row select{width:auto;min-width:90px}
.item-row button{padding:4px 10px;font-size:.8rem}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.result-card{text-align:center;padding:16px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.result-card .num{font-size:1.5rem;font-weight:700}
.result-card .lbl{font-size:.75rem;color:var(--text2);margin-top:2px}
.result-card .num.green{color:var(--green)}.result-card .num.red{color:var(--red)}.result-card .num.blue{color:var(--accent)}
.chart-wrap{position:relative;width:100%;height:300px;margin-top:12px}
canvas{width:100%!important;height:100%!important;border:1px solid var(--border);border-radius:8px}
.recommendation{padding:16px;border-radius:8px;font-weight:600;text-align:center;margin-top:12px}
.rec-good{background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.3)}
.rec-bad{background:rgba(248,81,73,.15);color:var(--red);border:1px solid rgba(248,81,73,.3)}
.rec-mid{background:rgba(210,153,34,.15);color:var(--yellow);border:1px solid rgba(210,153,34,.3)}
.hidden{display:none!important}
@media(max-width:600px){.results-grid{grid-template-columns:repeat(2,1fr)}body{padding:10px}.item-row{flex-wrap:wrap}.item-row input,.item-row select{min-width:80px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="💰 成本效益分析">
<meta property="og:description" content="成本效益分析工具，科学评估项目投资回报">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/cost-benefit-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='cb_data';
let analyses=JSON.parse(localStorage.getItem(STORE)||'[]');
let curIdx=-1;
function save(){localStorage.setItem(STORE,JSON.stringify(analyses))}
function fmt(n){return '¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:0})}
function render(){
  let h=`<div class="hdr"><h1>💰 成本效益分析</h1><p>科学评估项目投资回报</p></div>`;
  h+=`<div class="flex" style="justify-content:center;margin-bottom:16px"><button onclick="newAnalysis()">+ 新建分析</button>`;
  if(analyses.length>0)h+=`<select onchange="curIdx=parseInt(this.value);render()" style="min-width:150px"><option value="-1">选择分析</option>${analyses.map((a,i)=>`<option value="${i}"${i===curIdx?' selected':''}>${a.name}</option>`).join('')}</select>`;
  h+=`</div>`;
  if(curIdx>=0&&curIdx<analyses.length){
    const a=analyses[curIdx];
    h+=`<div class="cd"><div class="flex-between"><input type="text" value="${a.name}" onchange="analyses[${curIdx}].name=this.value;save()" style="width:250px;margin-bottom:0;font-weight:700" placeholder="分析名称"><div class="flex"><label style="margin:0;font-size:.85rem;color:var(--text2)">时间跨度:</label><select onchange="analyses[${curIdx}].horizon=parseInt(this.value);save();render()" style="width:auto"><option${a.horizon===1?' selected':''}>1</option><option${a.horizon===3?' selected':''}>3</option><option${a.horizon===5?' selected':''}>5</option><option${a.horizon===10?' selected':''}>10</option></select><label style="margin:0;font-size:.85rem;color:var(--text2)">年</label>`;
    h+=`<label style="margin:0;font-size:.85rem;color:var(--text2)">折现率:</label><input type="number" value="${a.discount}" min="0" max="50" step="0.5" style="width:70px;margin-bottom:0" onchange="analyses[${curIdx}].discount=parseFloat(this.value)||0;save();render()">%`;
    h+=`<button class="dng" style="padding:6px 12px;font-size:.8rem" onclick="delAnalysis()">删除</button></div></div></div>`;
    h+=`<div class="cd"><h2>成本项目 <button class="sec" style="float:right;padding:4px 12px;font-size:.8rem" onclick="addItem('cost')">+ 添加</button></h2>`;
    a.costs.forEach((c,i)=>{h+=renderItemRow('cost',c,i);});
    if(a.costs.length===0)h+=`<div style="text-align:center;color:var(--text2);padding:10px;font-size:.85rem">暂无成本项目</div>`;
    h+=`</div>`;
    h+=`<div class="cd"><h2>效益项目 <button class="sec" style="float:right;padding:4px 12px;font-size:.8rem" onclick="addItem('benefit')">+ 添加</button></h2>`;
    a.benefits.forEach((b,i)=>{h+=renderItemRow('benefit',b,i);});
    if(a.benefits.length===0)h+=`<div style="text-align:center;color:var(--text2);padding:10px;font-size:.85rem">暂无效益项目</div>`;
    h+=`</div>`;
    const metrics=calcMetrics(a);
    h+=`<div class="cd"><h2>分析结果</h2><div class="results-grid">`;
    h+=`<div class="result-card"><div class="num red">${fmt(metrics.totalCost)}</div><div class="lbl">总成本</div></div>`;
    h+=`<div class="result-card"><div class="num green">${fmt(metrics.totalBenefit)}</div><div class="lbl">总效益</div></div>`;
    h+=`<div class="result-card"><div class="num ${metrics.netBenefit>=0?'green':'red'}">${fmt(metrics.netBenefit)}</div><div class="lbl">净效益</div></div>`;
    h+=`<div class="result-card"><div class="num blue">${metrics.roi.toFixed(1)}%</div><div class="lbl">投资回报率</div></div>`;
    h+=`<div class="result-card"><div class="num blue">${fmt(metrics.npv)}</div><div class="lbl">净现值(NPV)</div></div>`;
    h+=`<div class="result-card"><div class="num blue">${metrics.payback}月</div><div class="lbl">回收期</div></div>`;
    h+=`<div class="result-card"><div class="num ${metrics.bcr>=1?'green':'red'}">${metrics.bcr.toFixed(2)}</div><div class="lbl">效益成本比</div></div>`;
    h+=`<div class="result-card"><div class="num blue">${metrics.annuity?fmt(metrics.annuity):'N/A'}</div><div class="lbl">年均净效益</div></div>`;
    h+=`</div>`;
    const recClass=metrics.roi>=20?'rec-good':metrics.roi>=0?'rec-mid':'rec-bad';
    const recText=metrics.roi>=20?'✅ 推荐投资：ROI较高，项目可行':metrics.roi>=0?'⚠️ 谨慎投资：ROI一般，需进一步评估':'❌ 不建议投资：ROI为负，项目不可行';
    h+=`<div class="recommendation ${recClass}">${recText}</div></div>`;
    h+=`<div class="cd"><h2>成本vs效益趋势</h2><div class="chart-wrap"><canvas id="cbChart"></canvas></div></div>`;
    h+=`<div class="bg" style="justify-content:center"><button onclick="exportReport()">导出报告</button></div>`;
  }
  $('app').innerHTML=h;
  if(curIdx>=0)drawChart();
}
function renderItemRow(type,item,i){
  const catOpts=type==='cost'?'<option>一次性成本</option><option>运营成本</option><option>人力成本</option><option>其他</option>':'<option>收入增长</option><option>成本节约</option><option>效率提升</option><option>其他</option>';
  let h=`<div class="item-row"><input type="text" value="${item.name}" placeholder="名称" onchange="analyses[${curIdx}].${type}s[${i}].name=this.value;save()">`;
  h+=`<input type="number" value="${item.amount}" min="0" placeholder="金额" onchange="analyses[${curIdx}].${type}s[${i}].amount=parseFloat(this.value)||0;save();render()">`;
  h+=`<select onchange="analyses[${curIdx}].${type}s[${i}].category=this.value;save()">${catOpts.replace(item.category,item.category+' selected')}</select>`;
  h+=`<select onchange="analyses[${curIdx}].${type}s[${i}].recurring=this.value==='true';save()"><option value="false"${!item.recurring?' selected':''}>一次性</option><option value="true"${item.recurring?' selected':''}>每年</option></select>`;
  h+=`<button class="dng" onclick="removeItem('${type}',${i})">✕</button></div>`;
  return h;
}
function addItem(type){
  analyses[curIdx][type+'s'].push({name:'',amount:0,category:type==='cost'?'运营成本':'收入增长',recurring:false});save();render();
}
function removeItem(type,i){analyses[curIdx][type+'s'].splice(i,1);save();render()}
function calcMetrics(a){
  const costs=a.costs.map(c=>c.recurring?c.amount*c.horizon:c.amount);
  const benefits=a.benefits.map(b=>b.recurring?b.amount*b.horizon:b.amount);
  const totalCost=costs.reduce((s,v)=>s+v,0);
  const totalBenefit=benefits.reduce((s,v)=>s+v,0);
  const netBenefit=totalBenefit-totalCost;
  const roi=totalCost>0?(netBenefit/totalCost)*100:0;
  const r=(a.discount||0)/100;
  let npv=0;
  for(let y=1;y<=a.horizon;y++){
    const factor=Math.pow(1+r,y);
    const yearCost=a.costs.reduce((s,c)=>s+(c.recurring?c.amount/c.horizon:0),0);
    const yearBenefit=a.benefits.reduce((s,b)=>s+(b.recurring?b.amount/b.horizon:0),0);
    npv+=(yearBenefit-yearCost)/factor;
  }
  const monthlyNet=netBenefit/(a.horizon*12);
  let payback=monthlyNet>0?Math.ceil(totalCost/monthlyNet):999;
  payback=Math.min(payback,a.horizon*12);
  const bcr=totalCost>0?totalBenefit/totalCost:0;
  const annuity=r>0?npv*(r*Math.pow(1+r,a.horizon))/(Math.pow(1+r,a.horizon)-1):npv/a.horizon;
  return{totalCost,totalBenefit,netBenefit,roi,npv,payback,bcr,annuity};
}
function newAnalysis(){
  const name=prompt('请输入分析名称：','新成本效益分析');if(!name)return;
  analyses.push({name,costs:[],benefits:[],horizon:5,discount:8});curIdx=analyses.length-1;save();render();
}
function delAnalysis(){if(!confirm('确定删除？'))return;analyses.splice(curIdx,1);curIdx=analyses.length>0?0:-1;save();render()}
function drawChart(){
  const canvas=$('cbChart');if(!canvas)return;
  const a=analyses[curIdx];
  const ctx=canvas.getContext('2d');
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width*2;canvas.height=rect.height*2;
  ctx.scale(2,2);
  const W=rect.width,H=rect.height;
  const pad={t:30,r:20,b:40,l:60};
  const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  ctx.clearRect(0,0,W,H);
  const years=a.horizon;
  let costData=[],benefitData=[];
  for(let y=1;y<=years;y++){
    const yc=a.costs.reduce((s,c)=>s+(c.recurring?c.amount*a.horizon/years:0),0);
    const yb=a.benefits.reduce((s,b)=>s+(b.recurring?b.amount*a.horizon/years:0),0);
    costData.push(yc);benefitData.push(yb);
  }
  const maxVal=Math.max(...costData,...benefitData,1);
  ctx.strokeStyle='rgba(128,128,128,.3)';ctx.lineWidth=.5;
  for(let i=0;i<=4;i++){
    const y=pad.t+cH-cH*(i/4);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();
    ctx.fillStyle='#8b949e';ctx.font='11px sans-serif';ctx.textAlign='right';
    ctx.fillText(fmt(maxVal*i/4),pad.l-5,y+4);
  }
  const barW=cW/(years*3);
  for(let y=0;y<years;y++){
    const x=pad.l+y*(cW/years)+cW/years/2-barW;
    const cH1=cH*(costData[y]/maxVal);
    ctx.fillStyle='#f85149';ctx.fillRect(x,pad.t+cH-cH1,barW-2,cH1);
    const bH=cH*(benefitData[y]/maxVal);
    ctx.fillStyle='#3fb950';ctx.fillRect(x+barW,pad.t+cH-bH,barW-2,bH);
    ctx.fillStyle='#8b949e';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(`${y+1}年`,x+barW,pad.t+cH+16);
  }
  ctx.fillStyle='#f85149';ctx.fillRect(pad.l,pad.t-15,10,10);ctx.fillStyle='#8b949e';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText('成本',pad.l+14,pad.t-6);
  ctx.fillStyle='#3fb950';ctx.fillRect(pad.l+60,pad.t-15,10,10);ctx.fillText('效益',pad.l+74,pad.t-6);
}
function exportReport(){
  const a=analyses[curIdx];
  const m=calcMetrics(a);
  let txt=`成本效益分析报告: ${a.name}\n${'═'.repeat(40)}\n\n`;
  txt+=`时间跨度: ${a.horizon}年\n折现率: ${a.discount}%\n\n`;
  txt+=`成本项目:\n`;a.costs.forEach(c=>txt+=`  - ${c.name}: ${fmt(c.amount)} (${c.recurring?'每年':'一次性'}, ${c.category})\n`);
  txt+=`\n效益项目:\n`;a.benefits.forEach(b=>txt+=`  - ${b.name}: ${fmt(b.amount)} (${b.recurring?'每年':'一次性'}, ${b.category})\n`);
  txt+=`\n${'─'.repeat(40)}\n分析结果\n${'─'.repeat(40)}\n`;
  txt+=`总成本: ${fmt(m.totalCost)}\n总效益: ${fmt(m.totalBenefit)}\n净效益: ${fmt(m.netBenefit)}\n`;
  txt+=`ROI: ${m.roi.toFixed(1)}%\nNPV: ${fmt(m.npv)}\n回收期: ${m.payback}个月\n效益成本比: ${m.bcr.toFixed(2)}\n`;
  txt+=`推荐: ${m.roi>=20?'推荐投资':m.roi>=0?'谨慎投资':'不建议投资'}\n`;
  navigator.clipboard.writeText(txt).then(()=>alert('已复制到剪贴板！')).catch(()=>alert('复制失败'));
}
render();
</script>
</body>
</html>
