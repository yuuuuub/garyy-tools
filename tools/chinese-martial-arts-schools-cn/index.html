<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="index, follow">
<meta property="og:title" content="中国武术门派大全 - Chinese Martial Arts Schools">
<meta property="og:description" content="中国武术门派大全，涵盖少林、武当、峨眉、崆峒等各大门派详细介绍">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-martial-arts-schools-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏯</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a05 0%,#2a1510 50%,#3d2015 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a,#b06a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.school-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px}
.school-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.school-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.school-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.school-card .s-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.school-card .s-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(232,168,124,0.15);color:var(--accent)}
.school-card .s-name{font-size:1.3em;font-weight:bold}
.school-card .s-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.school-card .s-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.school-card .s-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.school-card .s-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.school-card .s-detail strong{color:var(--text)}
.school-card .s-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.school-card .s-items span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.school-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.school-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>

</div>

  {id:3,name:"峨眉派",en:"Emei School",category:"道教门派",icon:"☸️",location:"四川峨眉山",era:"南宋",founder:"司徒玄空",description:"峨眉派是四川武术的代表，以'亦刚亦柔，内外兼修'著称。峨眉派融合了佛教和道教的武术精华。",characteristics:["亦刚亦柔","内外兼修","攻防兼备","灵活多变"],famousFor:"峨眉天下秀",martialArts:["峨眉剑","峨眉刺","峨眉拳","峨眉枪"],representatives:["司徒玄空","白眉道人","凌云侠"]},

  {id:15,name:"昆仑派",en:"Kunlun School",category:"民间门派",icon:"🏔️",location:"新疆昆仑山",era:"唐代",founder:"不详",description:"昆仑派是西北武术的重要门派，以'大开大合，刚猛有力'著称。昆仑派融合了西域武术的特色。",characteristics:["大开大合","刚猛有力","腿法精妙","西域特色"],famousFor:"昆仑山上玉虚宫",martialArts:["昆仑剑","昆仑拳","昆仑腿法","昆仑掌法"],representatives:["昆仑三圣","何足道"]},

function renderCards(data){
  document.getElementById('schoolGrid').innerHTML=data.map(m=>`
    <div class="school-card" data-category="${m.category}">
      <div class="s-header"><div class="s-icon">${m.icon}</div><div><div class="s-name">${m.name}</div><div class="s-sub">${m.en} · ${m.location}</div></div></div>
      <div class="s-meta"><span>${m.category}</span><span>创立：${m.era}</span><span>创始人：${m.founder}</span></div>
      <div class="s-detail"><strong>简介：</strong>${m.description}</div>
      <div class="s-detail"><strong>特点：</strong>${m.characteristics.join('、')}</div>
      <div class="s-detail"><strong>名言：</strong>${m.famousFor}</div>
      <div class="s-detail"><strong>代表武功：</strong>${m.martialArts.join('、')}</div>
      <div class="s-items">${m.representatives.map(r=>`<span>${r}</span>`).join('')}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">武术门派</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.school-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.school-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(SCHOOL_DATA);renderStats(SCHOOL_DATA);
</script>
</body>
</html>
