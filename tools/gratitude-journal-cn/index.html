<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🙏 感恩日记</title>
<meta name="description" content="感恩日记工具，每天记录值得感恩的事情，培养积极心态">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.entry{padding:16px;border-bottom:1px solid var(--border)}.entry:last-child{border-bottom:none}
.entry .date{font-size:.8rem;color:var(--accent);font-weight:600}
.entry .items{margin-top:8px}
.entry .item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:.9rem}
.entry .item .emoji{font-size:1.2rem;flex-shrink:0}
.entry .note{font-size:.85rem;color:var(--text2);margin-top:6px;font-style:italic}
.mood-selector{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mood-btn{padding:8px 16px;border-radius:20px;border:2px solid var(--border);background:var(--bg);cursor:pointer;font-size:1.2rem;transition:all .2s}
.mood-btn:hover,.mood-btn.selected{border-color:var(--accent);background:var(--accent);color:#fff}
.streak-display{text-align:center;padding:20px}.streak-num{font-size:3rem;font-weight:700;color:var(--warn)}.streak-label{font-size:.9rem;color:var(--text2);margin-top:4px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🙏</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🙏 感恩日记">
<meta property="og:description" content="感恩日记工具，每天记录值得感恩的事情">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🙏 感恩日记</h1><p>每天记录感恩事项，培养积极心态</p></div>

<div class="cd"><h2>🏆 连续记录</h2>
<div class="streak-display"><div class="streak-num" id="streakNum">0</div><div class="streak-label">天连续记录</div></div></div>

<div class="cd"><h2>今日感恩</h2>
<div class="mood-selector" id="moodSelector">
<span class="mood-btn" data-mood="😊" onclick="selectMood(this)">😊</span>
<span class="mood-btn" data-mood="🥰" onclick="selectMood(this)">🥰</span>
<span class="mood-btn" data-mood="😌" onclick="selectMood(this)">😌</span>
<span class="mood-btn" data-mood="💪" onclick="selectMood(this)">💪</span>
<span class="mood-btn" data-mood="🎉" onclick="selectMood(this)">🎉</span>
</div>
<label>感恩事项 1</label><input type="text" id="item1" placeholder="我感恩...">
<label>感恩事项 2</label><input type="text" id="item2" placeholder="我感恩...">
<label>感恩事项 3</label><input type="text" id="item3" placeholder="我感恩...">
<label>今日感言（可选）</label><textarea id="note" placeholder="今天的心情和感悟..."></textarea>
<div class="bg"><button onclick="saveEntry()">保存今日感恩</button></div></div>

<div class="cd"><h2>历史记录</h2><div id="entryList"></div></div>

<div class="cd"><h2>统计</h2><div class="gr" id="stats"></div>
<div class="bg"><button class="sec" onclick="clearAll()">清空全部</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let entries=JSON.parse(localStorage.getItem('gj_entries')||'[]');
let selectedMood='😊';
const today=()=>new Date().toISOString().slice(0,10);

function selectMood(el){
  document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  selectedMood=el.dataset.mood;
}

function save(){
  localStorage.setItem('gj_entries',JSON.stringify(entries));
}

function saveEntry(){
  const items=[$('item1').value.trim(),$('item2').value.trim(),$('item3').value.trim()].filter(Boolean);
  if(!items.length){alert('请至少填写一个感恩事项');return;}
  entries.push({id:Date.now(),date:today(),mood:selectedMood,items,note:$('note').value.trim()});
  save();render();
  $('item1').value='';$('item2').value='';$('item3').value='';$('note').value='';
  alert('已保存！感恩每一天 🙏');
}

function deleteEntry(id){entries=entries.filter(e=>e.id!==id);save();render();}
function clearAll(){entries=[];save();render();}

function getStreak(){
  if(!entries.length)return 0;
  const dates=[...new Set(entries.map(e=>e.date))].sort().reverse();
  let streak=0,d=new Date();
  while(true){
    const ds=d.toISOString().slice(0,10);
    if(dates.includes(ds)){streak++;d.setDate(d.getDate()-1);}else break;
  }
  return streak;
}

function render(){
  const streak=getStreak();
  $('streakNum').textContent=streak;
  
  $('entryList').innerHTML=entries.length?entries.map(e=>`<div class="entry">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="date">📅 ${e.date}</span>
      <span style="font-size:1.5rem">${e.mood}</span>
    </div>
    <div class="items">${e.items.map(item=>`<div class="item"><span class="emoji">🙏</span><span>${item}</span></div>`).join('')}</div>
    ${e.note?`<div class="note">"${e.note}"</div>`:''}
    <button class="dng" style="padding:4px 10px;font-size:.8rem;margin-top:8px" onclick="deleteEntry(${e.id})">删除</button>
  </div>`).reverse().join(''):'<div class="es">暂无记录，开始写下今天的感恩吧！</div>';
  
  const total=entries.length;
  const totalItems=entries.reduce((s,e)=>s+e.items.length,0);
  const uniqueDays=[...new Set(entries.map(e=>e.date))].length;
  $('stats').innerHTML=`
    <div class="st"><div class="nm">${total}</div><div class="lb">总记录</div></div>
    <div class="st"><div class="nm" style="color:var(--success)">${totalItems}</div><div class="lb">感恩事项</div></div>
    <div class="st"><div class="nm" style="color:var(--warn)">${streak}</div><div class="lb">连续天数</div></div>
    <div class="st"><div class="nm" style="color:var(--accent)">${uniqueDays}</div><div class="lb">记录天数</div></div>`;
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
