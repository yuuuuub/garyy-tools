<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俯视角射击</title>
    <meta name="description" content="俯视角射击游戏，从上帝视角消灭敌人">
    <style>
:root {--bg: #0d1117;
--card: #161b22;
--border: #30363d;
--text: #e6edf3;
--accent: #3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {background: var(--bg);
color: var(--text);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
padding: 20px;
overflow: hiddenscroll-behavior:smooth;padding:16px;}
h1 { margin-bottom: 10px; }
.stats {display: flex;
gap: 30px;
margin-bottom: 10px;
font-size: 1.1rem}
.stats span { color: var(--accent); font-weight: bold; }
#gameCanvas {border: 2px solid var(--border);
border-radius: 8px;
cursor: crosshair}
.info { margin-top: 10px; color: #8b949e; font-size: 0.9rem; }

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="俯视角射击">
  <meta property="og:description" content="俯视角射击游戏，从上帝视角消灭敌人">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/top-down-shooter/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
    <h1>🔫 俯视角射击</h1>
    <div class="stats">
        分数：<span id="score">0</span>
        波次：<span id="wave">1</span>
        生命：<span id="health">100</span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="info">WASD移动 | 鼠标瞄准自动射击 | 击杀敌人得分</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player = {x:400, y:300, r:15, health:100, speed:4};
        let bullets = [], enemies = [], particles = [];
        let score = 0, wave = 1, spawnTimer = 0, enemiesPerWave = 5;
        let mouseX = 400, mouseY = 0;
        let keys = {};

        document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 400 + Math.random() * 100;
            enemies.push({
                x: player.x + Math.cos(angle) * dist,
                y: player.y + Math.sin(angle) * dist,
                r: 12 + Math.random() * 8,
                speed: 1.5 + wave * 0.2 + Math.random(),
                health: 1 + Math.floor(wave / 3),
                color: ['#ef4444','#f97316','#a855f7'][Math.floor(Math.random()*3)]
            });
        }

        function shoot() {
            const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
            bullets.push({
                x: player.x, y: player.y,
                vx: Math.cos(angle) * 10,
                vy: Math.sin(angle) * 10,
                life: 60
            });
        }

        let shootTimer = 0;
        function update() {
            if (keys['w'] || keys['arrowup']) player.y -= player.speed;
            if (keys['s'] || keys['arrowdown']) player.y += player.speed;
            if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
            if (keys['d'] || keys['arrowright']) player.x += player.speed;
            player.x = Math.max(15, Math.min(785, player.x));
            player.y = Math.max(15, Math.min(585, player.y));

            shootTimer++;
            if (shootTimer % 8 === 0) shoot();

            bullets.forEach(b => { b.x += b.vx; b.y += b.vy; b.life--; });
            bullets = bullets.filter(b => b.life > 0 && b.x > 0 && b.x < 800 && b.y > 0 && b.y < 600);

            enemies.forEach(e => {
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;
            });

            bullets.forEach((b, bi) => {
                enemies.forEach((e, ei) => {
                    if (e.health <= 0) return;
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 3) {
                        e.health--;
                        b.life = 0;
                        if (e.health <= 0) {
                            score += 10;
                            for (let i = 0; i < 8; i++) {
                                particles.push({x:e.x, y:e.y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, life:20, color:e.color});
                            }
                        }
                    }
                });
            });

            enemies.forEach(e => {
                if (Math.hypot(player.x - e.x, player.y - e.y) < player.r + e.r) {
                    player.health -= 0.5;
                    e.health = 0;
                    for (let i = 0; i < 5; i++) {
                        particles.push({x:e.x, y:e.y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, life:15, color:'#ef4444'});
                    }
                }
            });

            enemies = enemies.filter(e => e.health > 0);

            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
            particles = particles.filter(p => p.life > 0);

            spawnTimer++;
            if (spawnTimer % Math.max(20, 60 - wave * 5) === 0 && enemies.length < 10 + wave * 2) spawnEnemy();

            if (enemies.length === 0 && spawnTimer > 60) {
                wave++;
                enemiesPerWave += 3;
                for (let i = 0; i < enemiesPerWave; i++) spawnEnemy();
            }

            if (player.health <= 0) {
                player.health = 100;
                score = Math.max(0, score - 20);
                wave = 1;
                enemies = [];
                bullets = [];
                spawnTimer = 0;
                player.x = 400;
                player.y = 300;
            }

            document.getElementById('score').textContent = score;
            document.getElementById('wave').textContent = wave;
            document.getElementById('health').textContent = Math.ceil(player.health);
        }

        function draw() {
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, 800, 600);

            ctx.strokeStyle = '#1a2332';
            for (let i = 0; i < 800; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 600); ctx.stroke();
            }
            for (let i = 0; i < 600; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(800, i); ctx.stroke();
            }

            particles.forEach(p => {
                ctx.globalAlpha = p.life / 20;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            bullets.forEach(b => {
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI*2);
                ctx.fill();
            });

            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(e.x-3, e.y-3, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x+3, e.y-3, 3, 0, Math.PI*2);
                ctx.fill();
            });

            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
            ctx.fill();

            const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
            ctx.strokeStyle = '#1d4ed8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x + Math.cos(angle) * 25, player.y + Math.sin(angle) * 25);
            ctx.stroke();
            ctx.lineWidth = 1;

            ctx.fillStyle = 'rgba(239,68,68,0.3)';
            ctx.fillRect(10, 10, 104, 14);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(12, 12, player.health, 10);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
