<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字书写练习 - 在线汉字书写练习工具</title>
<meta property="og:title" content="汉字书写练习 - 在线汉字书写练习工具">
<meta property="og:description" content="汉字书写练习 - 在线汉字书写练习工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="汉字书写练习 - 在线练习汉字书写，支持笔画顺序和临摹练习">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --blue: #3b82f6;
  --green: #238636;
  --red: #ef4444;
  --radius: 10px;
  --transition: 0.2s ease;
}
[data-theme="light"] {
  --bg: #f6f8fa;
  --card: #fff;
  --border: #d0d7de;
  --text: #1f2328;
  --text2: #656d76;
  --blue: #0969da;
  --green: #1a7f37;
  --red: #cf222e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  padding: 16px;
}
.container { max-width: 800px; margin: auto; }
h1 { text-align: center; padding: 24px 0 8px; font-size: 1.5rem; }
.sub { text-align: center; color: var(--text2); font-size: .85rem; margin-bottom: 20px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.btn {
  display: inline-block;
  padding: 10px 24px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: .9rem;
  margin-top: 12px;
  transition: var(--transition);
}
.btn:hover { opacity: .85; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.btn-secondary { background: var(--border); color: var(--text); }
.practice-area {
  display: flex;
  gap: 20px;
  margin: 16px 0;
  flex-wrap: wrap;
  justify-content: center;
}
.reference-char {
  width: 200px;
  height: 200px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8rem;
  position: relative;
}
.reference-char::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--border);
}
.reference-char::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border);
}
.canvas-container {
  position: relative;
  width: 200px;
  height: 200px;
}
.practice-canvas {
  width: 200px;
  height: 200px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  cursor: crosshair;
  touch-action: none;
}
.grid-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 200px;
  height: 200px;
  pointer-events: none;
}
.char-input {
  width: 100%;
  padding: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 1.2rem;
  text-align: center;
  color: var(--text);
  margin-bottom: 16px;
}
.char-input:focus {
  outline: none;
  border-color: var(--blue);
}
.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 16px 0;
}
.char-list {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  margin: 16px 0;
}
.char-item {
  padding: 8px;
  text-align: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: var(--transition);
  font-size: 1.2rem;
}
.char-item:hover {
  border-color: var(--blue);
  background: var(--card);
}
.char-item.active {
  border-color: var(--blue);
  background: rgba(59,130,246,0.1);
}
.stroke-info {
  display: flex;
  gap: 16px;
  margin: 12px 0;
  font-size: .85rem;
}
.stroke-info div {
  padding: 6px 12px;
  background: var(--bg);
  border-radius: 6px;
}
.stroke-info span {
  color: var(--blue);
  font-weight: bold;
}
.stroke-order {
  display: flex;
  gap: 8px;
  margin: 12px 0;
  flex-wrap: wrap;
}
.stroke-step {
  width: 40px;
  height: 40px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .8rem;
  cursor: pointer;
  transition: var(--transition);
}
.stroke-step:hover {
  border-color: var(--blue);
}
.stroke-step.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.stroke-step.completed {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.pen-size {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 12px 0;
}
.pen-size input {
  width: 100px;
}
.pen-preview {
  width: 20px;
  height: 20px;
  background: var(--text);
  border-radius: 50%;
}
.color-picker {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}
.color-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: var(--transition);
}
.color-btn:hover, .color-btn.active {
  border-color: var(--blue);
  transform: scale(1.1);
}
.history {
  margin-top: 16px;
}
.history-item {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  font-size: .85rem;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
body, .container { animation: fadeIn .4s ease-out; }
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>✏️ 汉字书写练习</h1>
  <p class="sub">在线练习汉字书写，支持笔画顺序和临摹练习</p>

  <div class="card">
    <input type="text" class="char-input" id="charInput" value="永" maxlength="1" placeholder="输入要练习的汉字">
    <div class="btn-group">
      <button class="btn" onclick="startPractice()">开始练习</button>
      <button class="btn btn-secondary" onclick="clearCanvas()">清除画布</button>
      <button class="btn btn-secondary" onclick="undoStroke()">撤销</button>
      <button class="btn btn-secondary" onclick="toggleTheme()">🌓 切换主题</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">练习区域</h3>
    <div class="practice-area">
      <div>
        <div style="text-align:center;font-size:.85rem;color:var(--text2);margin-bottom:8px">参考字</div>
        <div class="reference-char" id="referenceChar">永</div>
      </div>
      <div>
        <div style="text-align:center;font-size:.85rem;color:var(--text2);margin-bottom:8px">练习区</div>
        <div class="canvas-container">
          <canvas id="practiceCanvas" class="practice-canvas" width="200" height="200"></canvas>
          <canvas id="gridOverlay" class="grid-overlay" width="200" height="200"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">画笔设置</h3>
    <div class="pen-size">
      <span>笔画粗细:</span>
      <input type="range" id="penSize" min="2" max="20" value="4" oninput="updatePenSize()">
      <div class="pen-preview" id="penPreview"></div>
    </div>
    <div class="color-picker" id="colorPicker"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">汉字信息</h3>
    <div class="stroke-info">
      <div>笔画数: <span id="strokeCount">5</span></div>
      <div>部首: <span id="radical">水</span></div>
      <div>拼音: <span id="pinyin">yǒng</span></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">常用练习汉字</h3>
    <div class="char-list" id="charList"></div>
  </div>

  <div class="card history" id="historyCard" style="display:none">
    <h3 style="margin-bottom:12px">练习记录</h3>
    <div id="history"></div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var characters = [
  {char:'永',pinyin:'yǒng',radical:'水',stroke:5},
  {char:'一',pinyin:'yī',radical:'一',stroke:1},
  {char:'二',pinyin:'èr',radical:'二',stroke:2},
  {char:'三',pinyin:'sān',radical:'一',stroke:3},
  {char:'大',pinyin:'dà',radical:'大',stroke:3},
  {char:'小',pinyin:'xiǎo',radical:'小',stroke:3},
  {char:'人',pinyin:'rén',radical:'人',stroke:2},
  {char:'口',pinyin:'kǒu',radical:'口',stroke:3},
  {char:'日',pinyin:'rì',radical:'日',stroke:4},
  {char:'月',pinyin:'yuè',radical:'月',stroke:4},
  {char:'水',pinyin:'shuǐ',radical:'水',stroke:4},
  {char:'火',pinyin:'huǒ',radical:'火',stroke:4},
  {char:'木',pinyin:'mù',radical:'木',stroke:4},
  {char:'金',pinyin:'jīn',radical:'金',stroke:8},
  {char:'土',pinyin:'tǔ',radical:'土',stroke:3},
  {char:'山',pinyin:'shān',radical:'山',stroke:3},
  {char:'石',pinyin:'shí',radical:'石',stroke:5},
  {char:'田',pinyin:'tián',radical:'田',stroke:5},
  {char:'王',pinyin:'wáng',radical:'王',stroke:4},
  {char:'马',pinyin:'mǎ',radical:'马',stroke:3},
  {char:'龙',pinyin:'lóng',radical:'龙',stroke:5},
  {char:'凤',pinyin:'fèng',radical:'几',stroke:4},
  {char:'福',pinyin:'fú',radical:'礻',stroke:15},
  {char:'禄',pinyin:'lù',radical:'礻',stroke:12},
  {char:'寿',pinyin:'shòu',radical:'寸',stroke:7},
  {char:'喜',pinyin:'xǐ',radical:'口',stroke:12},
  {char:'财',pinyin:'cái',radical:'贝',stroke:7},
  {char:'吉',pinyin:'jí',radical:'口',stroke:6},
  {char:'祥',pinyin:'xiáng',radical:'礻',stroke:10},
  {char:'如',pinyin:'rú',radical:'女',stroke:6},
  {char:'意',pinyin:'yì',radical:'心',stroke:13},
  {char:'平',pinyin:'píng',radical:'干',stroke:5}
];

var canvas, ctx;
var isDrawing = false;
var strokes = [];
var currentStroke = [];
var penColor = '#e6edf3';
var penSize = 4;
var currentChar = '永';
var history = [];
var colors = ['#e6edf3','#ef4444','#3b82f6','#238636','#f59e0b','#8b5cf6','#ec4899'];

function init() {
  canvas = document.getElementById('practiceCanvas');
  ctx = canvas.getContext('2d');
  drawGrid();
  renderCharList();
  renderColorPicker();
  setupCanvasEvents();
}

function drawGrid() {
  var gridCanvas = document.getElementById('gridOverlay');
  var gridCtx = gridCanvas.getContext('2d');
  gridCtx.clearRect(0, 0, 200, 200);
  gridCtx.strokeStyle = '#30363d';
  gridCtx.lineWidth = 1;
  gridCtx.setLineDash([5, 5]);
  gridCtx.beginPath();
  gridCtx.moveTo(100, 0);
  gridCtx.lineTo(100, 200);
  gridCtx.moveTo(0, 100);
  gridCtx.lineTo(200, 100);
  gridCtx.moveTo(0, 0);
  gridCtx.lineTo(200, 200);
  gridCtx.moveTo(200, 0);
  gridCtx.lineTo(0, 200);
  gridCtx.stroke();
}

function renderCharList() {
  var html = '';
  characters.forEach(function(c) {
    var cls = 'char-item' + (c.char === currentChar ? ' active' : '');
    html += '<div class="' + cls + '" onclick="selectChar(\'' + c.char + '\')">' + c.char + '</div>';
  });
  document.getElementById('charList').innerHTML = html;
}

function renderColorPicker() {
  var html = '';
  colors.forEach(function(c) {
    var cls = 'color-btn' + (c === penColor ? ' active' : '');
    html += '<div class="' + cls + '" style="background:' + c + '" onclick="setColor(\'' + c + '\')"></div>';
  });
  document.getElementById('colorPicker').innerHTML = html;
}

function selectChar(ch) {
  currentChar = ch;
  document.getElementById('charInput').value = ch;
  document.getElementById('referenceChar').textContent = ch;
  var charData = characters.find(function(c) { return c.char === ch; });
  if(charData) {
    document.getElementById('strokeCount').textContent = charData.stroke;
    document.getElementById('radical').textContent = charData.radical;
    document.getElementById('pinyin').textContent = charData.pinyin;
  }
  renderCharList();
  clearCanvas();
}

function setupCanvasEvents() {
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var touch = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    startDraw({clientX:touch.clientX,clientY:touch.clientY});
  });
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var touch = e.touches[0];
    draw({clientX:touch.clientX,clientY:touch.clientY});
  });
  canvas.addEventListener('touchend', endDraw);
}

function startDraw(e) {
  isDrawing = true;
  currentStroke = [];
  var rect = canvas.getBoundingClientRect();
  var x = e.clientX - rect.left;
  var y = e.clientY - rect.top;
  currentStroke.push({x:x, y:y, color:penColor, size:penSize});
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.strokeStyle = penColor;
  ctx.lineWidth = penSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}

function draw(e) {
  if(!isDrawing) return;
  var rect = canvas.getBoundingClientRect();
  var x = e.clientX - rect.left;
  var y = e.clientY - rect.top;
  currentStroke.push({x:x, y:y, color:penColor, size:penSize});
  ctx.lineTo(x, y);
  ctx.stroke();
}

function endDraw() {
  if(!isDrawing) return;
  isDrawing = false;
  if(currentStroke.length > 0) {
    strokes.push(currentStroke);
  }
  currentStroke = [];
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  strokes = [];
}

function undoStroke() {
  if(strokes.length === 0) return;
  strokes.pop();
  redraw();
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  strokes.forEach(function(stroke) {
    if(stroke.length < 2) return;
    ctx.beginPath();
    ctx.strokeStyle = stroke[0].color;
    ctx.lineWidth = stroke[0].size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.moveTo(stroke[0].x, stroke[0].y);
    for(var i = 1; i < stroke.length; i++) {
      ctx.lineTo(stroke[i].x, stroke[i].y);
    }
    ctx.stroke();
  });
}

function setColor(color) {
  penColor = color;
  renderColorPicker();
}

function updatePenSize() {
  penSize = parseInt(document.getElementById('penSize').value);
  document.getElementById('penPreview').style.width = penSize + 'px';
  document.getElementById('penPreview').style.height = penSize + 'px';
}

function startPractice() {
  var ch = document.getElementById('charInput').value;
  if(ch) selectChar(ch);
}

function toggleTheme() {
  var html = document.documentElement;
  var current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
}

init();
</script>
</body>
</html>
