<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国篆刻艺术</title><meta name="description" content="中国篆刻艺术 - 在线了解中国篆刻"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a017;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .2s}.item:hover{transform:translateY(-2px)}.item-title{font-size:1.2rem;font-weight:600;color:var(--gold);margin-bottom:8px}.item-meta{font-size:.9rem;color:var(--text2);margin-bottom:4px}.item-display{font-size:3rem;text-align:center;padding:30px;background:var(--bg);border-radius:8px;margin-bottom:12px;min-height:100px;display:flex;align-items:center;justify-content:center}.item-desc{font-size:.9rem;color:var(--text)}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .2s}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;position:relative}.modal h2{color:var(--gold);margin-bottom:12px}.modal p{color:var(--text2);line-height:1.8;margin-bottom:12px}.close-btn{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer}.theme-toggle{position:fixed;top:8px;right:80px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;color:var(--text);font-size:.75rem}.seal-maker{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;text-align:center}.seal-preview{width:150px;height:150px;border:4px solid #d32f2f;display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem;color:#d32f2f;font-weight:bold;margin:16px auto;line-height:1.2;letter-spacing:4px;background:#fff}.seal-preview.circle{border-radius:50%}.input-row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}.input-row input{padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);width:200px;text-align:center;font-size:1rem}.input-row input:focus{border-color:var(--blue);outline:none}.tools-row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}</style><meta property="og:title" content="中国篆刻艺术"><meta property="og:description" content="中国篆刻艺术 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>印</text></svg>"></head><body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>印 中国篆刻艺术</h1><p class="sub">在线了解中国篆刻艺术</p>
<div class="card"><h3 style="margin-bottom:12px;color:var(--gold)">🔴 篆刻印章制作</h3>
<div class="seal-maker">
<div class="seal-preview" id="sealPreview">印</div>
<div class="input-row">
<input type="text" id="sealText" placeholder="输入印章文字（2-4字）" oninput="updateSeal()" maxlength="4">
</div>
<div class="tools-row">
<button class="btn active" onclick="setShape('square',this)">⬜ 方印</button>
<button class="btn" onclick="setShape('circle',this)">⭕ 圆印</button>
<button class="btn" onclick="setStyle('zhuwen',this)">朱文</button>
<button class="btn" onclick="setStyle('baiwen',this)">白文</button>
<button class="btn" onclick="downloadSeal()">💾 保存</button>
</div>
<p style="margin-top:8px;font-size:.8rem;color:var(--text2)">朱文：红底白字 | 白文：白底红字</p>
</div></div>
<div class="card"><div class="search-box"><input type="text" id="searchInput" placeholder="搜索篆刻知识..." oninput="filterItems()"></div>
<div class="btn-group"><button class="btn active" onclick="filterByType('all',this)">全部</button><button class="btn" onclick="filterByType('名家',this)">名家</button><button class="btn" onclick="filterByType('流派',this)">流派</button><button class="btn" onclick="filterByType('技法',this)">技法</button><button class="btn" onclick="filterByType('名印',this)">名印</button></div></div>
<div id="itemList"></div></div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="close-btn" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><div id="modalDisplay" class="item-display"></div><p id="modalMeta"></p><p id="modalDesc"></p><p id="modalDetail" style="padding-top:12px;border-top:1px solid var(--border);margin-top:8px"></p></div></div>
<script src="../i18n.js" defer></script>
<script>
var sealShape='square',sealStyle='zhuwen';
function updateSeal(){
  var text=document.getElementById('sealText').value||'印';
  var preview=document.getElementById('sealPreview');
  preview.textContent=text;
  if(sealStyle==='zhuwen'){preview.style.background='#d32f2f';preview.style.color='#fff';preview.style.borderColor='#d32f2f';}
  else{preview.style.background='#fff';preview.style.color='#d32f2f';preview.style.borderColor='#d32f2f';}
}
function setShape(shape,btn){
  sealShape=shape;var preview=document.getElementById('sealPreview');
  preview.className='seal-preview'+(shape==='circle'?' circle':'');
  document.querySelectorAll('.tools-row .btn').forEach(function(b,i){if(i<2)b.classList.remove('active');});
  btn.classList.add('active');
}
function setStyle(style,btn){
  sealStyle=style;updateSeal();
  document.querySelectorAll('.tools-row .btn').forEach(function(b,i){if(i>=2&&i<4)b.classList.remove('active');});
  btn.classList.add('active');
}
function downloadSeal(){
  var c=document.createElement('canvas');c.width=300;c.height=300;var cx=c.getContext('2d');
  cx.fillStyle=sealStyle==='zhuwen'?'#d32f2f':'#fff';cx.fillRect(0,0,300,300);
  cx.strokeStyle='#d32f2f';cx.lineWidth=8;
  if(sealShape==='circle'){cx.beginPath();cx.arc(150,150,140,0,Math.PI*2);cx.stroke();}
  else{cx.strokeRect(10,10,280,280);}
  cx.fillStyle=sealStyle==='zhuwen'?'#fff':'#d32f2f';cx.font='bold 60px serif';cx.textAlign='center';cx.textBaseline='middle';
  var text=document.getElementById('sealText').value||'印';
  if(text.length<=2){cx.font='bold 80px serif';cx.fillText(text,150,150);}
  else{cx.fillText(text.substring(0,2),150,110);cx.fillText(text.substring(2,4),150,190);}
  var link=document.createElement('a');link.download='印章.png';link.href=c.toDataURL();link.click();
}

var items=[
  {title:'文彭',type:'名家',emoji:'👨',desc:'明代篆刻家，文徵明之子，被誉为"文人篆刻之祖"。他开创了以冻石刻印的风气。',detail:'文彭发现灯光冻石可以刻印，从此文人开始自己动手篆刻，不再假手于工匠。他主张"印从书出"，将书法融入篆刻。'},
  {title:'浙派',type:'流派',emoji:'🏔️',desc:'以丁敬为代表的篆刻流派，风格刚健苍劲，刀法爽利，影响深远。',detail:'浙派是清代最重要的篆刻流派之一，以杭州为中心。丁敬开创，后经蒋仁、黄易等发展，形成"西泠八家"。'},
  {title:'皖派',type:'流派',emoji:'🌊',desc:'以邓石如为代表的篆刻流派，风格圆润流畅，以"书从印入，印从书出"著称。',detail:'皖派以安徽为中心，邓石如开创。其特点是将篆书笔法融入篆刻，刀法圆润，线条流畅。吴让之、赵之谦都是皖派传人。'},
  {title:'冲刀法',type:'技法',emoji:'🔪',desc:'篆刻的基本刀法之一，以刀角向前推进，刻出的线条流畅有力。',detail:'冲刀法是篆刻中最常用的刀法，特点是行刀速度快，刻出的线条流畅、爽利。适合刻制比较规整的印章。'},
  {title:'切刀法',type:'技法',emoji:'✂️',desc:'篆刻的基本刀法之一，以刀角向下切入，刻出的线条苍劲古朴。',detail:'切刀法是浙派的标志性刀法，特点是行刀速度慢，一刀一刀切出，刻出的线条有金石味，苍劲古朴。'},
  {title:'和氏璧',type:'名印',emoji:'💎',desc:'传说中的稀世珍宝，秦始皇将其制成传国玉玺，是中国历史上最著名的印章。',detail:'和氏璧是春秋时期楚人卞和发现的美玉，后被秦始皇制成传国玉玺，刻有"受命于天，既寿永昌"八字。'},
  {title:'齐白石篆刻',type:'名家',emoji:'🎨',desc:'齐白石的篆刻以单刀直冲著称，风格雄强豪放，与他的绘画一样具有鲜明的个人风格。',detail:'齐白石篆刻以"胆敢独造"著称，他用单刀冲刻，不加修饰，线条刚劲有力。他主张"刻印，其篆法别有天趣胜人者，唯秦汉人。"'},
  {title:'吴昌硕篆刻',type:'名家',emoji:'🖌️',desc:'晚清篆刻大家，以石鼓文入印，风格浑厚苍劲，是"后海派"的代表人物。',detail:'吴昌硕将石鼓文的笔法融入篆刻，形成了独特的"吴派"风格。他的篆刻苍劲浑厚，被誉为"集大成者"。'},
  {title:'朱文印',type:'技法',emoji:'🔴',desc:'又称"阳文印"，印章上的文字是凸起的，钤印后文字呈红色。',detail:'朱文印是将文字以外的部分刻去，使文字凸起。钤印时文字部分着墨，呈现红色。朱文印线条细劲，适合刻制较复杂的文字。'},
  {title:'白文印',type:'技法',emoji:'⬜',desc:'又称"阴文印"，印章上的文字是凹陷的，钤印后文字呈白色（纸的颜色）。',detail:'白文印是将文字刻凹进去，钤印时文字部分不着墨，呈现纸的颜色。白文印线条粗壮，风格古朴。'},
  {title:'秦代印章',type:'名印',emoji:'🏛️',desc:'秦代统一印章制度，规定天子用玺，臣民用印。秦印以小篆入印，风格端庄严谨。',detail:'秦代是中国印章制度化的开端。秦印以白文为主，边框较粗，文字端庄严谨，是后世篆刻学习的典范。'},
  {title:'汉代官印',type:'名印',emoji:'👑',desc:'汉代官印以缪篆入印，方正平直，气势雄浑，是篆刻艺术的高峰。',detail:'汉印是中国篆刻的巅峰，以缪篆（摹印篆）入印，风格方正平直、浑厚古朴。"印宗秦汉"是篆刻界的共识。'}
];
var currentType='all';
function renderItems(list){
  var el=document.getElementById('itemList');
  var html='';
  list.forEach(function(p,i){
    html+='<div class="item" onclick="showDetail('+items.indexOf(p)+')">';
    html+='<div class="item-title">'+p.emoji+' '+p.title+'</div>';
    html+='<div class="item-meta">'+p.type+'</div>';
    html+='<div class="item-display">'+p.emoji+'</div>';
    html+='<div class="item-desc">'+p.desc.substring(0,60)+'...</div>';
    html+='</div>';
  });
  el.innerHTML=html||'<div class="card" style="text-align:center;color:var(--text2)">未找到匹配的内容</div>';
}
function filterItems(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=items.filter(function(p){return(p.title.includes(q)||p.desc.includes(q))&&(currentType==='all'||p.type===currentType);});
  renderItems(filtered);
}
function filterByType(type,btn){
  currentType=type;
  document.querySelectorAll('.btn-group .btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterItems();
}
function showDetail(i){
  var p=items[i];
  document.getElementById('modalTitle').textContent=p.title;
  document.getElementById('modalDisplay').textContent=p.emoji;
  document.getElementById('modalMeta').textContent=p.type;
  document.getElementById('modalDesc').textContent=p.desc;
  document.getElementById('modalDetail').textContent=p.detail;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='light'?'dark':'light');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
renderItems(items);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
