<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贵金属价格</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s}
.btn:hover{opacity:.85}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{text-align:center;padding:30px 0}
.error-box p{color:var(--red);margin-bottom:10px}
.error-box .btn{background:var(--red)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.metal-card{text-align:center;padding:24px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);position:relative;overflow:hidden}
.metal-card.gold-card{border-color:rgba(245,158,11,.3)}
.metal-card.silver-card{border-color:rgba(148,163,184,.3)}
.metal-icon{font-size:2.5rem;margin-bottom:8px}
.metal-name{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.metal-price{font-size:1.8rem;font-weight:700}
.metal-price.gold{color:var(--gold)}
.metal-price.silver{color:var(--text)}
.metal-unit{font-size:.8rem;color:var(--text2);font-weight:400}
.metal-change{font-size:.9rem;margin-top:4px}
.up{color:var(--green)}
.down{color:var(--red)}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge.up{background:rgba(35,134,54,.2);color:var(--green)}
.badge.down{background:rgba(239,68,68,.2);color:var(--red)}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{padding:10px;background:var(--bg);border-radius:var(--radius);text-align:center}
.info-item .label{font-size:.72rem;color:var(--text2);margin-bottom:2px}
.info-item .value{font-size:.95rem;font-weight:600}
.last-update{text-align:center;font-size:.75rem;color:var(--text2);margin-top:4px}
@media(max-width:640px){.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🥇 贵金属价格</h1>
    <p>黄金·白银实时行情</p>
  </header>

  <div id="metalPrices"></div>
  <div id="extraInfo"></div>
  <div id="lastUpdate" class="last-update"></div>
</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const metalPrices = $('metalPrices');
const extraInfo = $('extraInfo');
const lastUpdate = $('lastUpdate');

function loading(){
  metalPrices.innerHTML = '<div class="spinner"></div>';
  extraInfo.innerHTML = '';
}

function showError(msg){
  metalPrices.innerHTML = `<div class="error-box"><p>${msg}</p><button class="btn" onclick="location.reload()">重试</button></div>`;
  extraInfo.innerHTML = '';
}

function formatPrice(v){
  return '$' + Number(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function formatChange(v){
  if(v === null || v === undefined) return '--';
  return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}

// 存储上次报价用于计算涨跌幅
const PRICE_CACHE_KEY = 'gold-price-cache';

function getCachedPrice(){
  try{
    const cached = localStorage.getItem(PRICE_CACHE_KEY);
    if(cached) return JSON.parse(cached);
  }catch(e){}
  return null;
}

function setCachedPrice(goldPrice, silverPrice){
  try{
    localStorage.setItem(PRICE_CACHE_KEY, JSON.stringify({gold: goldPrice, silver: silverPrice, time: Date.now()}));
  }catch(e){}
}

function renderPrices(gold, silver, realData = true){
  const goldChange = gold.change !== undefined && gold.change !== null ? parseFloat(gold.change) : null;
  const silverChange = silver.change !== undefined && silver.change !== null ? parseFloat(silver.change) : null;

  metalPrices.innerHTML = `
    <div class="grid-2">
      <div class="metal-card gold-card">
        <div class="metal-icon">🥇</div>
        <div class="metal-name">黄金 (XAU)</div>
        <div class="metal-price gold">${formatPrice(gold.price)} <span class="metal-unit">/盎司</span></div>
        <div class="metal-change">${goldChange !== null ? `<span class="badge ${goldChange >= 0 ? 'up' : 'down'}">${formatChange(goldChange)}</span>` : `<span class="badge" style="color:var(--text2)">实时</span>`}</div>
      </div>
      <div class="metal-card silver-card">
        <div class="metal-icon">🥈</div>
        <div class="metal-name">白银 (XAG)</div>
        <div class="metal-price silver">${formatPrice(silver.price)} <span class="metal-unit">/盎司</span></div>
        <div class="metal-change">${silverChange !== null ? `<span class="badge ${silverChange >= 0 ? 'up' : 'down'}">${formatChange(silverChange)}</span>` : `<span class="badge" style="color:var(--text2)">实时</span>`}</div>
      </div>
    </div>`;
}

function renderExtra(gold, silver){
  extraInfo.innerHTML = `
    <div class="card">
      <div class="section-title">📊 贵金属详情</div>
      <div class="info-grid">
        <div class="info-item"><div class="label">黄金当前价</div><div class="value">${formatPrice(gold.price)}</div></div>
        <div class="info-item"><div class="label">白银当前价</div><div class="value">${formatPrice(silver.price)}</div></div>
        <div class="info-item"><div class="label">昨收黄金</div><div class="value">${formatPrice(gold.prev_close_price || gold.price)}</div></div>
        <div class="info-item"><div class="label">昨收白银</div><div class="value">${formatPrice(silver.prev_close_price || silver.price)}</div></div>
        <div class="info-item"><div class="label">黄金最高(今日)</div><div class="value" style="color:var(--green)">${formatPrice(gold.high_price || gold.price)}</div></div>
        <div class="info-item"><div class="label">白银最高(今日)</div><div class="value" style="color:var(--green)">${formatPrice(silver.high_price || silver.price)}</div></div>
      </div>
      <div style="text-align:center;margin-top:12px;font-size:.78rem;color:var(--text2)">价格为美元/盎司</div>
    </div>`;
}

async function fetchPrices(){
  loading();
  try{
    // 同时获取黄金和白银价格
    const [goldRes, silverRes] = await Promise.all([
      fetch('https://api.gold-api.com/price/XAU'),
      fetch('https://api.gold-api.com/price/XAG')
    ]);
    if(!goldRes.ok || !silverRes.ok) throw new Error('HTTP ' + (!goldRes.ok ? goldRes.status : silverRes.status));

    const goldData = await goldRes.json();
    const silverData = await silverRes.json();

    const goldPrice = goldData.price;
    const silverPrice = silverData.price;

    // 计算涨跌幅（对比缓存中的上次价格）
    const cached = getCachedPrice();
    let goldChange = null;
    let silverChange = null;
    if(cached && cached.gold && cached.silver){
      goldChange = (goldPrice - cached.gold) / cached.gold * 100;
      silverChange = (silverPrice - cached.silver) / cached.silver * 100;
    }

    // 更新缓存
    setCachedPrice(goldPrice, silverPrice);

    const gold = {price: goldPrice, change: goldChange, prev_close_price: cached?.gold || goldPrice};
    const silver = {price: silverPrice, change: silverChange, prev_close_price: cached?.silver || silverPrice};

    renderPrices(gold, silver, true);
    renderExtra(gold, silver);
    lastUpdate.textContent = '数据更新于: ' + new Date().toLocaleString('zh-CN') + ' | 来源: gold-api.com';
  }catch(e){
    // 降级: 使用模拟数据
    const gold = {price: 2391.45, change: 1.23, prev_close_price: 2362.50, high_price: 2395.80, low_price: 2378.10};
    const silver = {price: 29.57, change: 2.15, prev_close_price: 28.94, high_price: 29.72, low_price: 29.10};
    renderPrices(gold, silver, false);
    renderExtra(gold, silver);
    lastUpdate.textContent = '实时API不可用，显示模拟数据 | '+new Date().toLocaleString('zh-CN');
  }
}

fetchPrices();
})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
