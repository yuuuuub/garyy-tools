<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贵金属价格</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem}.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.price-card{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px;text-align:center}
.price-icon{font-size:3rem;margin-bottom:8px}
.price-value{font-size:2rem;font-weight:700;margin-top:8px}
.price-unit{font-size:.85rem;color:var(--text2)}
.price-change{font-size:.9rem;margin-top:8px}
.price-change.up{color:var(--green)}.price-change.down{color:var(--red)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;text-align:left}
.info-item{background:var(--bg);border-radius:8px;padding:12px}
.info-label{font-size:.75rem;color:var(--text2)}
.info-value{font-size:.9rem;font-weight:600;margin-top:4px}
.brand-section{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px}
.brand-title{font-size:1rem;font-weight:600;margin-bottom:12px;text-align:center}
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.brand-item{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
.brand-name{font-size:.85rem;font-weight:600}
.brand-price{font-size:1.1rem;color:var(--gold);margin-top:4px}
.brand-unit{font-size:.75rem;color:var(--text2)}
.refresh-btn{display:block;margin:20px auto 0;padding:10px 24px;background:var(--blue);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:.85rem}
</style>
</head>
<body>
<div class="container">
<header><h1>🥇 贵金属价格</h1><p class="sub">国际金价 · 品牌参考价</p></header>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var USD_TO_CNY=7.25;
var OZ_TO_GRAM=31.1035;
function formatPrice(p){return '$'+p.toFixed(2);}
function formatCNY(p){return '¥'+p.toFixed(2);}
function loadPrices(){
app.innerHTML='<div style="text-align:center;padding:60px 0;color:var(--text2)"><div class="spinner" style="width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px"></div><p>获取价格中...</p></div>';
fetch('https://api.gold-api.com/price/XAU')
.then(function(r){return r.json();})
.then(function(goldData){
var goldPrice=goldData.price||2391.45;
var goldChange=goldData.chp||1.23;
var goldPerGram=goldPrice/OZ_TO_GRAM;
var goldCNY=goldPerGram*USD_TO_CNY;
var brands=[
{name:'周大福',markup:58},{name:'周生生',markup:55},{name:'老凤祥',markup:52},
{name:'六福珠宝',markup:56},{name:'中国黄金',markup:48}
];
var html='<div class="price-card">';
html+='<div class="price-icon">🥇</div>';
html+='<div class="price-value" style="color:var(--gold)">'+formatPrice(goldPrice)+'</div>';
html+='<div class="price-unit">美元/盎司 · ≈ '+formatCNY(goldCNY)+'/克</div>';
html+='<div class="price-change '+(goldChange>=0?'up':'down')+'">'+(goldChange>=0?'↑':'↓')+' '+Math.abs(goldChange).toFixed(2)+'%</div>';
html+='<div class="info-grid">';
html+='<div class="info-item"><div class="info-label">💰 人民币/克</div><div class="info-value" style="color:var(--gold)">'+formatCNY(goldCNY)+'</div></div>';
html+='<div class="info-item"><div class="info-label">📊 美元/盎司</div><div class="info-value">'+formatPrice(goldPrice)+'</div></div>';
html+='<div class="info-item"><div class="info-label">🔄 汇率参考</div><div class="info-value">1 USD ≈ '+USD_TO_CNY+' CNY</div></div>';
html+='<div class="info-item"><div class="info-label">📏 换算</div><div class="info-value">1盎司 ≈ '+OZ_TO_GRAM+'克</div></div>';
html+='</div></div>';
html+='<div class="brand-section">';
html+='<div class="brand-title">🏪 品牌金价参考 (元/克)</html>';
html+='<div class="brand-grid">';
brands.forEach(function(b){
var price=Math.round(goldCNY)+b.markup;
html+='<div class="brand-item"><div class="brand-name">'+b.name+'</div><div class="brand-price">¥'+price+'</div><div class="brand-unit">足金/克</div></div>';
});
html+='</div></div>';
html+='<button class="refresh-btn" onclick="loadPrices()">🔄 刷新价格</button>';
app.innerHTML=html;
})
.catch(function(e){
var goldCNY=450+50;
var html='<div class="price-card">';
html+='<div class="price-icon">🥇</div>';
html+='<div class="price-value" style="color:var(--gold)">≈ ¥'+goldCNY.toFixed(0)+'/克</div>';
html+='<div class="price-unit">参考价格 · 网络异常时显示估算值</div>';
html+='<div class="info-grid">';
html+='<div class="info-item"><div class="info-label">💰 人民币/克</div><div class="info-value" style="color:var(--gold)">≈ ¥'+goldCNY.toFixed(0)+'</div></div>';
html+='<div class="info-item"><div class="info-label">📊 美元/盎司</div><div class="info-value">≈ $'+(goldCNY*OZ_TO_GRAM/USD_TO_CNY).toFixed(0)+'</div></div>';
html+='</div></div>';
html+='<div class="brand-section">';
html+='<div class="brand-title">🏪 品牌金价参考 (元/克)</div>';
html+='<div class="brand-grid">';
[{name:'周大福',price:goldCNY+58},{name:'周生生',price:goldCNY+55},{name:'老凤祥',price:goldCNY+52},{name:'六福珠宝',price:goldCNY+56},{name:'中国黄金',price:goldCNY+48}].forEach(function(b){
html+='<div class="brand-item"><div class="brand-name">'+b.name+'</div><div class="brand-price">¥'+Math.round(b.price)+'</div><div class="brand-unit">足金/克</div></div>';
});
html+='</div></div>';
html+='<button class="refresh-btn" onclick="loadPrices()">🔄 重新加载</button>';
app.innerHTML=html;
});
}
window.loadPrices=loadPrices;
loadPrices();
})();
</script>
</body>
</html>
