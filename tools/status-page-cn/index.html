<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🟢 状态页面</title>
<meta name="description" content="服务状态页面构建器，创建和展示系统服务运行状态">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🟢 状态页面">
<meta property="og:description" content="状态页面构建器 - Gary's Tools">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🟢</text></svg>">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;transition:background .3s,color .3s}
.container{max-width:800px;margin:0 auto}
h1{font-size:1.3rem;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:60px}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-orange{background:var(--orange)}.btn-sm{padding:4px 10px;font-size:.8rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px}
.theme-toggle{position:fixed;top:12px;right:12px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:8px;cursor:pointer;z-index:100}
.overall-status{text-align:center;padding:32px;border-radius:12px;margin-bottom:16px}
.overall-status .icon{font-size:3rem;margin-bottom:8px}
.overall-status .text{font-size:1.2rem;font-weight:700}
.overall-status .sub{font-size:.85rem;margin-top:4px}
.overall-ok{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#166534}
.overall-warn{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e}
.overall-down{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b}
.service-item{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border)}
.service-item:last-child{border-bottom:none}
.service-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dot-up{background:var(--green)}.dot-degraded{background:var(--orange)}.dot-down{background:var(--red)}.dot-unknown{background:var(--text2)}
.service-info{flex:1}
.service-name{font-weight:600;font-size:.9rem}
.service-desc{font-size:.75rem;color:var(--text2)}
.service-uptime{font-size:.8rem;color:var(--text2);text-align:right}
.uptime-bar{display:flex;gap:1px;margin-top:6px}
.uptime-bar .day{width:4px;height:20px;border-radius:1px}
.uptime-history{display:flex;gap:2px;margin:4px 0}
.uptime-history .block{height:24px;border-radius:3px;flex:1}
.preview-box{background:#1a1a2e;color:#e6e6e6;padding:16px;border-radius:8px;border:1px solid var(--border);font-family:'SF Mono',Menlo,monospace;font-size:.8rem;line-height:1.6;white-space:pre-wrap;overflow:auto;max-height:400px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>🟢 状态页面</h1>

<div class="card">
<div class="section-title">添加服务</div>
<div class="form-row">
<div><label>服务名称</label><input type="text" id="sName" placeholder="例：API网关"></div>
<div><label>描述</label><input type="text" id="sDesc" placeholder="核心API服务"></div>
</div>
<div class="form-row">
<div><label>URL (可选)</label><input type="url" id="sUrl" placeholder="https://status.example.com"></div>
<div><label>状态</label><select id="sStatus"><option value="up">正常运行</option><option value="degraded">性能降级</option><option value="down">宕机</option><option value="unknown">未知</option></select></div>
</div>
<div style="margin-bottom:12px"><label>分组</label><input type="text" id="sGroup" placeholder="例：核心服务"></div>
<div style="display:flex;gap:8px">
<button onclick="addService()">➕ 添加服务</button>
<button class="btn-green" onclick="genStatusPage()">👁 生成状态页</button>
<button class="btn-orange" onclick="genEmbed()">📋 生成嵌入代码</button>
</div>
</div>

<div class="card">
<div class="section-title">状态概览</div>
<div id="overallStatus"></div>
</div>

<div class="card">
<div class="section-title">服务列表</div>
<div id="serviceList"></div>
</div>

<div class="card" id="previewCard" style="display:none">
<div class="section-title">状态页预览</div>
<div id="statusPagePreview"></div>
</div>

<div class="card" id="embedCard" style="display:none">
<div class="section-title">嵌入代码</div>
<div class="preview-box" id="embedOutput"></div>
<div style="margin-top:8px"><button class="btn-sm btn-green" onclick="copyEmbed()">📋 复制</button></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var services = JSON.parse(localStorage.getItem('status_services') || '[]');
var idCounter = services.length ? Math.max(...services.map(s=>s.id)) + 1 : 1;

function addService(){
  var name=document.getElementById('sName').value.trim();
  if(!name){alert('请输入服务名称');return;}
  services.push({
    id:idCounter++,name:name,desc:document.getElementById('sDesc').value,
    url:document.getElementById('sUrl').value,status:document.getElementById('sStatus').value,
    group:document.getElementById('sGroup').value||'默认',
    history:Array.from({length:30},function(){return Math.random()>0.05?'up':Math.random()>0.5?'degraded':'down';}),
    created:new Date().toLocaleDateString('zh-CN')
  });
  localStorage.setItem('status_services',JSON.stringify(services));
  renderAll();
  ['sName','sDesc','sUrl','sGroup'].forEach(function(id){document.getElementById(id).value='';});
}

function renderAll(){
  renderOverall();
  renderServices();
}

function renderOverall(){
  var total=services.length;
  var up=services.filter(function(s){return s.status==='up';}).length;
  var down=services.filter(function(s){return s.status==='down';}).length;
  var degraded=services.filter(function(s){return s.status==='degraded';}).length;
  var cls=down>0?'overall-down':degraded>0?'overall-warn':'overall-ok';
  var icon=down>0?'🔴':degraded>0?'🟡':'🟢';
  var text=down>0?'部分服务异常':degraded>0?'部分服务性能降级':'所有系统正常运行';
  var sub=up+'/'+total+' 服务正常运行';
  document.getElementById('overallStatus').innerHTML='<div class="overall-status '+cls+'"><div class="icon">'+icon+'</div><div class="text">'+text+'</div><div class="sub">'+sub+'</div></div>';
}

function renderServices(){
  var el=document.getElementById('serviceList');
  if(!services.length){el.innerHTML='<p style="color:var(--text2);text-align:center;padding:20px">暂无服务</p>';return;}
  var groups={};
  services.forEach(function(s){if(!groups[s.group])groups[s.group]=[];groups[s.group].push(s);});
  var html='';
  Object.keys(groups).forEach(function(g){
    html+='<div style="font-size:.85rem;font-weight:600;color:var(--text2);margin:12px 0 4px">'+g+'</div>';
    groups[g].forEach(function(s,i){
      var dotClass={up:'dot-up',degraded:'dot-degraded',down:'dot-down',unknown:'dot-unknown'}[s.status];
      var statusText={up:'正常',degraded:'降级',down:'宕机',unknown:'未知'}[s.status];
      var uptimePct=s.history.length?Math.round(s.history.filter(function(h){return h==='up';}).length/s.history.length*100):100;
      var uptimeBars=s.history.map(function(h){
        var color=h==='up'?'var(--green)':h==='degraded'?'var(--orange)':'var(--red)';
        return '<div class="block" style="background:'+color+'"></div>';
      }).join('');
      html+='<div class="service-item"><div class="service-dot '+dotClass+'"></div><div class="service-info"><div class="service-name">'+s.name+'</div><div class="service-desc">'+s.desc+'</div><div class="uptime-history">'+uptimeBars+'</div></div><div style="text-align:right"><div class="service-uptime">'+uptimePct+'%</div><div style="margin-top:4px"><button class="btn-sm" onclick="cycleStatus('+s.id+')">'+statusText+'</button> <button class="btn-sm btn-red" onclick="deleteService('+s.id+')">删除</button></div></div></div>';
    });
  });
  el.innerHTML=html;
}

function cycleStatus(id){
  var s=services.find(function(x){return x.id===id;});
  if(!s)return;
  var cycle=['up','degraded','down','unknown'];
  var idx=cycle.indexOf(s.status);
  s.status=cycle[(idx+1)%cycle.length];
  s.history.push(s.status==='up'?'up':s.status);
  if(s.history.length>30)s.history=s.history.slice(-30);
  localStorage.setItem('status_services',JSON.stringify(services));
  renderAll();
}

function deleteService(id){
  services=services.filter(function(s){return s.id!==id;});
  localStorage.setItem('status_services',JSON.stringify(services));
  renderAll();
}

function genStatusPage(){
  var html='<div style="max-width:600px;margin:0 auto;font-family:-apple-system,sans-serif">';
  var down=services.filter(function(s){return s.status==='down';}).length;
  var degraded=services.filter(function(s){return s.status==='degraded';}).length;
  var cls=down>0?'#fee2e2':degraded>0?'#fef3c7':'#dcfce7';
  var text=down>0?'部分服务异常':degraded>0?'性能降级':'所有系统正常运行';
  html+='<div style="background:'+cls+';padding:32px;text-align:center;border-radius:12px;margin-bottom:24px"><div style="font-size:2rem;margin-bottom:8px">'+(down>0?'🔴':degraded>0?'🟡':'🟢')+'</div><div style="font-size:1.2rem;font-weight:700">'+text+'</div></div>';
  var groups={};
  services.forEach(function(s){if(!groups[s.group])groups[s.group]=[];groups[s.group].push(s);});
  Object.keys(groups).forEach(function(g){
    html+='<h3 style="font-size:.9rem;color:#666;margin:16px 0 8px">'+g+'</h3><div style="background:#fff;border:1px solid #eee;border-radius:8px;overflow:hidden">';
    groups[g].forEach(function(s){
      var dotColor=s.status==='up'?'#16a34a':s.status==='degraded'?'#d97706':s.status==='down'?'#dc2622':'#999';
      var statusText={up:'正常',degraded:'降级',down:'宕机',unknown:'未知'}[s.status];
      html+='<div style="display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #f0f0f0"><div style="width:10px;height:10px;border-radius:50%;background:'+dotColor+'"></div><div style="flex:1"><div style="font-weight:600">'+s.name+'</div><div style="font-size:.8rem;color:#999">'+s.desc+'</div></div><div style="font-size:.85rem;color:#666">'+statusText+'</div></div>';
    });
    html+='</div>';
  });
  html+='<div style="text-align:center;font-size:.75rem;color:#999;margin-top:16px">最后更新: '+new Date().toLocaleString('zh-CN')+'</div></div>';
  document.getElementById('statusPagePreview').innerHTML=html;
  document.getElementById('previewCard').style.display='block';
  document.getElementById('previewCard').scrollIntoView({behavior:'smooth'});
}

function genEmbed(){
  var iframe='<iframe src="data:text/html;charset=utf-8,'+encodeURIComponent(generateMiniPage())+'" width="100%" height="600" frameborder="0" style="border-radius:12px;border:1px solid #eee"></iframe>';
  document.getElementById('embedOutput').textContent=iframe;
  document.getElementById('embedCard').style.display='block';
  document.getElementById('embedCard').scrollIntoView({behavior:'smooth'});
}

function generateMiniPage(){
  return '<html><body style="font-family:sans-serif;padding:20px;background:#f9f9f9"><h2 style="text-align:center">系统状态</h2>'+document.getElementById('statusPagePreview').innerHTML+'</body></html>';
}

function copyEmbed(){navigator.clipboard.writeText(document.getElementById('embedOutput').textContent).then(function(){alert('已复制');});}
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
renderAll();
</script>
</body>
</html>
