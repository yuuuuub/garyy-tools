<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔄 回顾模板</title>
<meta name="description" content="团队回顾模板工具，总结经验教训持续改进">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.retros{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.retro-col{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px}
.retro-col h3{font-size:.9rem;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.retro-col.green{border-top:3px solid var(--green)}
.retro-col.yellow{border-top:3px solid var(--yellow)}
.retro-col.red{border-top:3px solid var(--red)}
.retro-item{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;font-size:.9rem;display:flex;justify-content:space-between;align-items:flex-start}
.retro-item .text{flex:1}
.remove-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:.85rem;flex-shrink:0}
.add-row{display:flex;gap:6px;margin-top:8px}
.add-row input{margin-bottom:0;flex:1}
.summary-item{padding:10px;border-bottom:1px solid var(--border);font-size:.9rem}
.summary-item:last-child{border-bottom:none}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.85rem}
@media(max-width:600px){.retros{grid-template-columns:1fr}body{padding:10px}.ctn{max-width:100%}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🔄 回顾模板">
<meta property="og:description" content="团队回顾模板工具，总结经验教训持续改进">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/retrospective-template-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='retro_tmpl';
let retros=JSON.parse(localStorage.getItem(STORE)||'[]');
let curView='list',curId=null;
function save(){localStorage.setItem(STORE,JSON.stringify(retros))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function render(){
  let h=`<div class="hdr"><h1>🔄 回顾模板</h1><p>总结经验教训，持续改进</p></div>`;
  h+=`<div class="flex" style="justify-content:center;margin-bottom:16px"><button onclick="showNew()">新建回顾</button><button class="sec" onclick="curView='list';render()">全部回顾</button></div>`;
  h+=`<div id="viewNew" class="${curView==='new'?'':'hidden'}"></div>`;
  h+=`<div id="viewList" class="${curView==='list'?'':'hidden'}"></div>`;
  h+=`<div id="viewDetail" class="${curView==='detail'?'':'hidden'}"></div>`;
  $('app').innerHTML=h;
  if(curView==='new')renderNew();else if(curView==='list')renderList();else renderDetail();
}
function renderNew(){
  let h=`<div class="cd"><h2>新建回顾</h2>`;
  h+=`<label>回顾主题</label><input id="rTitle" placeholder="例如：Sprint 5 回顾">`;
  h+=`<label>日期</label><input type="date" id="rDate">`;
  h+=`<label>参与者</label><input id="rPeople" placeholder="用逗号分隔">`;
  h+=`<div class="bg"><button onclick="saveRetro()">创建</button><button class="sec" onclick="curView='list';render()">取消</button></div></div>`;
  $('viewNew').innerHTML=h;
}
function saveRetro(){
  const title=$('rTitle').value.trim();if(!title){alert('请输入主题');return}
  retros.push({id:uid(),title,date:$('rDate').value,people:$('rPeople').value,
    good:[],improve:[],action:[], createdAt:new Date().toISOString()});
  save();curId=retros[retros.length-1].id;curView='detail';render();
}
function renderList(){
  let h=`<div class="cd">`;
  if(!retros.length){h+=`<p class="empty">暂无回顾记录</p>`}
  retros.slice().reverse().forEach(r=>{
    h+=`<div class="flex-between" style="padding:12px;border-bottom:1px solid var(--border);cursor:pointer" onclick="viewRetro('${r.id}')">`;
    h+=`<div><b>${r.title}</b><div style="font-size:.8rem;color:var(--text2)">${r.date||'未定'} · ${(r.good||[]).length+(r.improve||[]).length+(r.action||[]).length}条记录</div></div>`;
    h+=`<button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="event.stopPropagation();delRetro('${r.id}')">删除</button></div>`;
  });
  h+=`</div>`;$('viewList').innerHTML=h;
}
function viewRetro(id){curId=id;curView='detail';render()}
function delRetro(id){if(!confirm('确定删除?'))return;retros=retros.filter(r=>r.id!==id);save();curView='list';render()}
function renderDetail(){
  const r=retros.find(x=>x.id===curId);if(!r){curView='list';render();return}
  let h=`<div class="cd"><div class="flex-between"><h2>${r.title}</h2><span style="font-size:.85rem;color:var(--text2)">${r.date||''}</span></div>`;
  if(r.people)h+=`<p style="font-size:.85rem;color:var(--text2);margin-bottom:12px">参与者：${r.people}</p>`;
  h+=`<div class="retros">`;
  const sections=[
    {key:'good',icon:'✅',label:'做得好的',cls:'green'},
    {key:'improve',icon:'🔧',label:'待改进的',cls:'yellow'},
    {key:'action',icon:'🎯',label:'行动项',cls:'red'}
  ];
  sections.forEach(sec=>{
    h+=`<div class="retro-col ${sec.cls}"><h3>${sec.icon} ${sec.label} (${(r[sec.key]||[]).length})</h3>`;
    (r[sec.key]||[]).forEach((item,ii)=>{
      h+=`<div class="retro-item"><span class="text">${item}</span><button class="remove-btn" onclick="removeItem('${r.id}','${sec.key}',${ii})">✕</button></div>`;
    });
    h+=`<div class="add-row"><input id="add_${sec.key}" placeholder="添加..." onkeydown="if(event.key==='Enter')addItem('${r.id}','${sec.key}')"><button style="padding:6px 12px" onclick="addItem('${r.id}','${sec.key}')">+</button></div>`;
    h+=`</div>`;
  });
  h+=`</div>`;
  h+=`<div class="bg"><button class="sec" onclick="curView='list';render()">返回</button><button class="dng" onclick="delRetro('${r.id}')">删除</button></div></div>`;
  $('viewDetail').innerHTML=h;
}
function addItem(id,key){
  const r=retros.find(x=>x.id===id);if(!r)return;
  const input=$('add_'+key);const val=input.value.trim();if(!val)return;
  r[key]=r[key]||[];r[key].push(val);save();input.value='';renderDetail();
}
function removeItem(id,key,idx){
  const r=retros.find(x=>x.id===id);if(!r)return;
  r[key].splice(idx,1);save();renderDetail();
}
function showNew(){curView='new';render()}
render();
</script>
</body>
</html>
