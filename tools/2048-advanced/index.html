<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高级2048</title>
<meta name="description" content="高级模式2048数字益智游戏，增加特殊规则玩法">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.container{text-align:center;padding:20px;max-width:500px;width:100%}
h1{font-size:28px;margin-bottom:10px;color:var(--accent)}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:15px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 20px;min-width:100px}
.stat-label{font-size:12px;color:#8b949e;text-transform:uppercase}
.stat-value{font-size:24px;font-weight:bold;color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:0 auto;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:12px}
.cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;transition:all .15s}
.btn{background:var(--accent);color:#fff;border:none;padding:12px 30px;border-radius:8px;font-size:16px;cursor:pointer;margin-top:10px;font-weight:bold}
.skill-bar{display:flex;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.skill{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;transition:all .2s}
.skill:hover{border-color:var(--accent);background:rgba(59,130,246,0.1)}
.skill.disabled{opacity:.4;cursor:not-allowed}
.skill-count{color:var(--accent);font-weight:bold}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100}
.overlay-box{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:30px;text-align:center}
.overlay-box h2{font-size:32px;margin-bottom:10px;color:var(--accent)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div class="container">
<h1>🎮 高级2048</h1>
<div class="stats">
<div class="stat"><div class="stat-label">分数</div><div class="stat-value" id="score">0</div></div>
<div class="stat"><div class="stat-label">最高方块</div><div class="stat-value" id="maxTile">2</div></div>
<div class="stat"><div class="stat-label">步数</div><div class="stat-value" id="moves">0</div></div>
</div>
<div class="skill-bar" id="skillBar"></div>
<div class="board" id="board"></div>
<button class="btn" onclick="restartGame()">重新开始</button>
</div>
<div class="overlay" id="overlay" style="display:none">
<div class="overlay-box">
<h2 id="overlayTitle">游戏结束</h2>
<p id="overlayMsg" style="margin:10px 0"></p>
<button class="btn" onclick="restartGame();document.getElementById('overlay').style.display='none'">再来一局</button>
</div>
</div>
<script>
const SIZE=4;
let grid,score,moves,maxTile,skills,skillUses;
const colors={0:'rgba(255,255,255,0.05)',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e',4096:'#3c3a32',8192:'#3c3a32'};

const skillDefs=[
    {id:'undo',name:'撤销',icon:'↩️',desc:'撤销上一步',max:3},
    {id:'shuffle',name:'洗牌',icon:'🔀',desc:'随机重排所有方块',max:2},
    {id:'bomb',name:'炸弹',icon:'💣',desc:'消除最小的3个方块',max:2},
    {id:'double',name:'翻倍',icon:'✖️',desc:'将最大方块翻倍',max:1},
    {id:'freeze',name:'冻结',icon:'❄️',desc:'下一次新方块不会出现',max:3}
];

function init(){
    grid=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
    score=0;moves=0;maxTile=2;skillUses={undo:0,shuffle:0,bomb:0,double:0,freeze:0};
    skills=skillDefs.map(s=>({...s,remaining:s.max}));
    addRandom();addRandom();renderSkills();render();hideOverlay();
}

function addRandom(freeze){
    const empty=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]===0)empty.push({r,c});
    if(empty.length===0||freeze)return false;
    const{r,c}=empty[Math.floor(Math.random()*empty.length)];
    grid[r][c]=Math.random()<0.9?2:4;
    return true;
}

function renderSkills(){
    const bar=document.getElementById('skillBar');
    bar.innerHTML='';
    skills.forEach(s=>{
        const div=document.createElement('div');
        div.className='skill'+(s.remaining<=0?' disabled':'');
        div.innerHTML=`${s.icon} ${s.name} <span class="skill-count">(${s.remaining})</span>`;
        div.title=s.desc;
        div.onclick=()=>useSkill(s.id);
        bar.appendChild(div);
    });
}

function useSkill(id){
    const s=skills.find(sk=>sk.id===id);
    if(!s||s.remaining<=0)return;
    switch(id){
        case'undo':undoLast();break;
        case'shuffle':shuffleBoard();break;
        case'bomb':bombSmallest();break;
        case'double':doubleMax();break;
        case'freeze':addRandom(true);break;
    }
    s.remaining--;
    renderSkills();render();
}

let history=[];
function saveState(){history.push({grid:grid.map(r=>[...r]),score,moves,maxTile});if(history.length>20)history.shift();}

function undoLast(){
    if(history.length===0)return;
    const s=history.pop();
    grid=s.grid;score=s.score;moves=s.moves;maxTile=s.maxTile;
}

function shuffleBoard(){
    const vals=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]>0)vals.push(grid[r][c]);
    for(let i=vals.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]];}
    let idx=0;
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)grid[r][c]=idx<vals.length?vals[idx++]:0;
}

function bombSmallest(){
    const tiles=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]>0)tiles.push({r,c,v:grid[r][c]});
    tiles.sort((a,b)=>a.v-b.v);
    for(let i=0;i<Math.min(3,tiles.length);i++)grid[tiles[i].r][tiles[i].c]=0;
}

function doubleMax(){
    let max=0,mr=0,mc=0;
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]>max){max=grid[r][c];mr=r;mc=c;}
    if(max>0){grid[mr][mc]*=2;score+=grid[mr][mc];maxTile=Math.max(maxTile,grid[mr][mc]);}
}

function render(){
    const board=document.getElementById('board');
    board.innerHTML='';
    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
            const cell=document.createElement('div');
            cell.className='cell';
            const v=grid[r][c];
            cell.textContent=v||'';
            cell.style.background=colors[v]||`hsl(${Math.log2(v)*30},70%,50%)`;
            cell.style.color=v<=4?'#000':'#fff';
            cell.style.fontSize=v>=1024?'16px':v>=128?'20px':'24px';
            board.appendChild(cell);
        }
    }
    document.getElementById('score').textContent=score;
    document.getElementById('maxTile').textContent=maxTile;
    document.getElementById('moves').textContent=moves;
}

function slide(row){
    let arr=row.filter(v=>v!==0);
    let merged=false;
    for(let i=0;i<arr.length-1;i++){
        if(arr[i]===arr[i+1]){arr[i]*=2;score+=arr[i];arr.splice(i+1,1);merged=true;}
    }
    while(arr.length<SIZE)arr.push(0);
    return arr;
}

function move(dir){
    saveState();
    let moved=false;
    const g=grid.map(r=>[...r]);
    if(dir==='left'){
        for(let r=0;r<SIZE;r++){const s=slide(g[r]);if(s.join(',')!==g[r].join(','))moved=true;grid[r]=s;}
    }else if(dir==='right'){
        for(let r=0;r<SIZE;r++){const s=slide(g[r].slice().reverse()).reverse();if(s.join(',')!==g[r].join(','))moved=true;grid[r]=s;}
    }else if(dir==='up'){
        for(let c=0;c<SIZE;c++){const col=g.map(r=>r[c]);const s=slide(col);if(s.join(',')!==col.join(','))moved=true;for(let r=0;r<SIZE;r++)grid[r][c]=s[r];}
    }else if(dir==='down'){
        for(let c=0;c<SIZE;c++){const col=g.map(r=>r[c]).reverse();const s=slide(col).reverse();const orig=g.map(r=>r[c]);if(s.join(',')!==orig.join(','))moved=true;for(let r=0;r<SIZE;r++)grid[r][c]=s[r];}
    }
    if(moved){
        moves++;
        for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]>maxTile)maxTile=grid[r][c];
        addRandom();render();
        if(isGameOver())showOverlay('游戏结束',`最终分数: ${score}`);
        if(maxTile>=2048)showOverlay('🎉 你赢了!',`分数: ${score}`);
    }
}

function isGameOver(){
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
        if(grid[r][c]===0)return false;
        if(c<SIZE-1&&grid[r][c]===grid[r][c+1])return false;
        if(r<SIZE-1&&grid[r][c]===grid[r+1][c])return false;
    }
    return true;
}

function showOverlay(title,msg){
    document.getElementById('overlayTitle').textContent=title;
    document.getElementById('overlayMsg').textContent=msg;
    document.getElementById('overlay').style.display='flex';
}
function hideOverlay(){document.getElementById('overlay').style.display='none';}

document.addEventListener('keydown',e=>{
    const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
    if(map[e.key]){e.preventDefault();move(map[e.key]);}
});

let touchStartX,touchStartY;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;});
document.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-touchStartX;
    const dy=e.changedTouches[0].clientY-touchStartY;
    if(Math.abs(dx)<30&&Math.abs(dy)<30)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
});

function restartGame(){history=[];init();}

init();
</script>
<script src="../i18n.js"></script>
</body>
</html>
