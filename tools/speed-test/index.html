<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网速测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950;--red:#f85149;--yellow:#d29922}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;width:100%;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.container{max-width:500px;width:100%;padding:24px}
.gauge{width:240px;height:240px;margin:0 auto 24px;position:relative}
.gauge svg{width:100%;height:100%}
.gauge-bg{fill:none;stroke:var(--border);stroke-width:12}
.gauge-fill{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;stroke-dasharray:628;stroke-dashoffset:628;transition:stroke-dashoffset .3s}
.gauge-value{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.gauge-value .speed{font-size:48px;font-weight:700;color:var(--accent)}
.gauge-value .unit{font-size:14px;color:var(--muted)}
.btn{width:100%;padding:16px;border-radius:12px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:16px;font-weight:600;margin-bottom:24px}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.result-card .icon{font-size:24px;margin-bottom:6px}
.result-card .value{font-size:22px;font-weight:600}
.result-card .label{font-size:12px;color:var(--muted);margin-top:2px}
.status{margin:12px 0;font-size:14px;color:var(--muted);text-align:center}
.progress{width:100%;height:6px;background:var(--border);border-radius:3px;margin-bottom:16px;display:none}
.progress.show{display:block}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .2s}
.history{margin-top:20px;width:100%}
.history h3{font-size:14px;color:var(--muted);margin-bottom:8px}
.history-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
</style>
</head>
<body>
<div class="header">
<span style="font-size:28px">⚡</span>
<h1>网速测试</h1>
</div>
<div class="container">
<div class="gauge">
<svg viewBox="0 0 200 200">
<circle class="gauge-bg" cx="100" cy="100" r="90"/>
<circle class="gauge-fill" id="gaugeFill" cx="100" cy="100" r="90" transform="rotate(-90 100 100)"/>
</svg>
<div class="gauge-value">
<div class="speed" id="speedValue">0</div>
<div class="unit">Mbps</div>
</div>
</div>
<button class="btn" id="startBtn" onclick="startTest()">开始测试</button>
<div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="status" id="status"></div>
<div class="results">
<div class="result-card"><div class="icon">⬇️</div><div class="value" id="downloadSpeed">-</div><div class="label">下载速度</div></div>
<div class="result-card"><div class="icon">⬆️</div><div class="value" id="uploadSpeed">-</div><div class="label">上传速度</div></div>
<div class="result-card"><div class="icon">📡</div><div class="value" id="latency">-</div><div class="label">延迟</div></div>
</div>
<div class="history" id="history"></div>
</div>
<script>
let history=JSON.parse(localStorage.getItem('speedHistory')||'[]');
function startTest(){
document.getElementById('startBtn').disabled=true;
document.getElementById('progress').classList.add('show');
testLatency().then(ms=>{
document.getElementById('latency').textContent=ms+'ms';
document.getElementById('status').textContent='测试下载速度...';
testDownload().then(speed=>{
document.getElementById('downloadSpeed').textContent=speed+'Mbps';
setGauge(speed);
document.getElementById('status').textContent='测试上传速度...';
testUpload().then(uspeed=>{
document.getElementById('uploadSpeed').textContent=uspeed+'Mbps';
document.getElementById('status').textContent='测试完成';
document.getElementById('progress').classList.remove('show');
document.getElementById('startBtn').disabled=false;
history.unshift({date:new Date().toLocaleString('zh-CN'),dl:speed,ul:uspeed,lat:ms});
if(history.length>10)history.pop();
localStorage.setItem('speedHistory',JSON.stringify(history));
showHistory();
});
});
});
}
function testLatency(){
const start=performance.now();
return fetch('https://www.cloudflare.com/cdn-cgi/trace',{cache:'no-store'})
.then(()=>Math.round(performance.now()-start));
}
function testDownload(){
const urls=['https://speed.cloudflare.com/__down?bytes=10000000','https://speed.cloudflare.com/__down?bytes=5000000'];
const start=performance.now();
return Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>r.blob())))
.then(blobs=>{
const totalBytes=blobs.reduce((s,b)=>s+b.size,0);
const elapsed=(performance.now()-start)/1000;
return Math.round(totalBytes*8/elapsed/1000000);
});
}
function testUpload(){
const data=new Blob([new ArrayBuffer(2000000)]);
const start=performance.now();
return fetch('https://speed.cloudflare.com/__up',{method:'POST',body:data})
.then(()=>Math.round(2000000*8/((performance.now()-start)/1000)/1000000));
}
function setGauge(speed){
const max=200;
const pct=Math.min(speed/max,1);
const offset=628-(628*pct);
document.getElementById('gaugeFill').style.strokeDashoffset=offset;
document.getElementById('speedValue').textContent=speed;
}
function showHistory(){
if(!history.length)return;
let html='<h3>历史记录</h3>';
history.forEach(h=>{
html+=`<div class="history-item"><span>${h.date}</span><span>⬇️${h.dl}Mbps ⬆️${h.ul}Mbps 📡${h.lat}ms</span></div>`;
});
document.getElementById('history').innerHTML=html;
}
showHistory();
</script>
</body>
</html>
