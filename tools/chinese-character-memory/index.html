<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字记忆</title><meta name="description" content="汉字记忆 - 在线记忆汉字游戏"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.memory-cell{aspect-ratio:1;background:var(--card);border:2px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transition:all .2s}.memory-cell:hover{border-color:var(--blue)}.memory-cell.flipped{border-color:var(--green);background:rgba(35,134,54,.1)}.memory-cell.matched{border-color:var(--green);background:rgba(35,134,54,.2);pointer-events:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}.score-display{font-size:1.2rem;margin:16px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style><meta property="og:title" content="汉字记忆"><meta property="og:description" content="汉字记忆 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🧠 汉字记忆</h1><p class="sub">在线记忆汉字游戏</p>
<div class="card">
<div class="btn-group">
<button class="btn" onclick="startMemory()">开始游戏</button>
<button class="btn" onclick="resetMemory()">重新开始</button>
</div>
<div class="score-display" id="scoreDisplay"></div>
</div>
<div id="result"></div>
<div class="card" id="historyCard" style="display:none">
<h3 style="margin-bottom:16px">游戏记录</h3>
<div id="history" style="padding:12px;background:var(--bg);border-radius:8px"></div>
</div></div>
<script src="../i18n.js" defer></script>
<script>
var characters=[
  {char:'一',pinyin:'yī'},
  {char:'二',pinyin:'èr'},
  {char:'三',pinyin:'sān'},
  {char:'四',pinyin:'sì'},
  {char:'五',pinyin:'wǔ'},
  {char:'六',pinyin:'liù'},
  {char:'七',pinyin:'qī'},
  {char:'八',pinyin:'bā'},
  {char:'九',pinyin:'jiǔ'},
  {char:'十',pinyin:'shí'},
  {char:'大',pinyin:'dà'},
  {char:'小',pinyin:'xiǎo'},
  {char:'多',pinyin:'duō'},
  {char:'少',pinyin:'shǎo'},
  {char:'上',pinyin:'shàng'},
  {char:'下',pinyin:'xià'}
];
var cards=[];
var flippedCards=[];
var matchedPairs=0;
var totalPairs=8;
var score=0;
var moves=0;
function startMemory(){
  var selectedCharacters=characters.slice(0,totalPairs);
  cards=[];
  selectedCharacters.forEach(function(char){
    cards.push({type:'char',value:char.char,id:char.char});
    cards.push({type:'pinyin',value:char.pinyin,id:char.char});
  });
  cards=shuffleArray(cards);
  flippedCards=[];
  matchedPairs=0;
  score=0;
  moves=0;
  renderMemory();
}
function renderMemory(){
  var html='<div class="card">';
  html+='<div class="memory-grid">';
  cards.forEach(function(card,index){
    var isFlipped=flippedCards.some(function(fc){return fc.index===index;});
    var isMatched=matchedPairs>0&&cards.some(function(c){return c.id===card.id&&c.type!==card.type;});
    html+='<div class="memory-cell '+(isFlipped?'flipped':'')+(isMatched?' matched':'')+'" onclick="flipCard('+index+')">';
    if(isFlipped||isMatched){
      html+=card.value;
    }else{
      html+='?';
    }
    html+='</div>';
  });
  html+='</div></div>';
  document.getElementById('result').innerHTML=html;
  updateScore();
}
function flipCard(index){
  if(flippedCards.length>=2)return;
  if(flippedCards.some(function(fc){return fc.index===index;}))return;
  flippedCards.push({index:index,card:cards[index]});
  renderMemory();
  if(flippedCards.length===2){
    moves++;
    checkMatch();
  }
}
function checkMatch(){
  var card1=flippedCards[0].card;
  var card2=flippedCards[1].card;
  if(card1.id===card2.id&&card1.type!==card2.type){
    matchedPairs++;
    score+=100;
    flippedCards=[];
    renderMemory();
    if(matchedPairs===totalPairs){
      setTimeout(function(){
        alert('🎉 恭喜完成！得分：'+score+'分，步数：'+moves+'步');
        updateHistory();
      },300);
    }
  }else{
    setTimeout(function(){
      flippedCards=[];
      renderMemory();
    },1000);
  }
}
function resetMemory(){
  startMemory();
}
function updateScore(){
  document.getElementById('scoreDisplay').innerHTML='得分：'+score+'分 | 已匹配：'+matchedPairs+'/'+totalPairs+' | 步数：'+moves+'步';
}
function updateHistory(){
  document.getElementById('historyCard').style.display='block';
  var html='<div style="padding:8px;background:rgba(35,134,54,.1);border-radius:4px">';
  html+='<strong>完成游戏</strong> | 得分：'+score+'分 | 步数：'+moves+'步';
  html+='</div>';
  document.getElementById('history').innerHTML=html;
}
function shuffleArray(array){
  for(var i=array.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var temp=array[i];
    array[i]=array[j];
    array[j]=temp;
  }
  return array;
}
startMemory();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
