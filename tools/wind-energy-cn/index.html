<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风力发电知识库 | Wind Energy CN</title>
<meta property="og:title" content="风力发电知识库 | Wind Energy CN">
<meta property="og:description" content="风力发电知识库 | Wind Energy CN - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="风力发电知识百科，了解风能发电原理与应用">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌬️</text></svg>">
<meta name="robots" content="index, follow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--input:#242836;--text:#e2e4e9;--text2:#8b8fa3;--cyan:#06b6d4;--cyan2:#0891b2;--green:#22c55e;--blue:#3b82f6;--border:#2a2e3a;--radius:12px;--radius-sm:8px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--input:#f0f2f5;--text:#1f2328;--text2:#656d76;--cyan:#0891b2;--green:#1a7f37;--blue:#0969da;--border:#d0d7de}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;line-height:1.6;padding:20px}
.container{max-width:860px;margin:0 auto;padding:0 12px}
header{text-align:center;padding:40px 0 24px}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#06b6d4,#22d3ee,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{color:var(--text2);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px}
.card h2{font-size:1.15rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.search-box{display:flex;gap:12px;margin-bottom:24px}
.search-box input{flex:1;background:var(--input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;color:var(--text);font-size:1rem;outline:none}
.search-box input:focus{border-color:var(--cyan)}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--input);color:var(--text2);cursor:pointer;font-size:.88rem;transition:all .2s}
.tab:hover,.tab.active{border-color:var(--cyan);color:var(--cyan);background:rgba(6,182,212,.05)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.info-grid{grid-template-columns:1fr}}
.info-item{background:var(--input);border-radius:var(--radius-sm);padding:16px;border-left:3px solid var(--cyan)}
.info-item .i-cat{font-size:.75rem;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.info-item .i-title{font-weight:600;font-size:.95rem;margin-bottom:6px}
.info-item .i-desc{font-size:.85rem;color:var(--text2);line-height:1.6}
.calc-section{background:var(--input);border-radius:var(--radius-sm);padding:20px;margin-top:16px}
.calc-section label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px}
.calc-section input{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:.93rem;width:100%;margin-bottom:12px;outline:none}
.calc-section input:focus{border-color:var(--cyan)}
.calc-btn{background:var(--cyan);color:#000;border:none;border-radius:var(--radius-sm);padding:10px 24px;font-size:.95rem;font-weight:600;cursor:pointer;width:100%}
.calc-result{text-align:center;padding:16px;margin-top:12px;display:none}
.calc-result.show{display:block}
.calc-result .r-num{font-size:2rem;font-weight:800;color:var(--cyan)}
.calc-result .r-label{font-size:.85rem;color:var(--text2)}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.82rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header><h1>🌬️ 风力发电知识库</h1><p class="subtitle">了解风能，探索清洁能源的未来</p></header>
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索风能知识..." oninput="filterItems()">
</div>
<div class="tabs" id="tabs"></div>
<div class="info-grid" id="infoGrid"></div>
<div class="card" style="margin-top:24px">
<h2><span class="icon">🔧</span> 风力发电功率计算器</h2>
<div class="calc-section">
<label>风速（m/s）</label><input type="number" id="windSpeed" value="8" min="0" max="40" step="0.5">
<label>风轮直径（米）</label><input type="number" id="rotorDia" value="80" min="1" max="200" step="1">
<label>空气密度（kg/m³，标准1.225）</label><input type="number" id="airDensity" value="1.225" min="0.8" max="1.5" step="0.01">
<button class="calc-btn" onclick="calcPower()">计算发电功率</button>
<div class="calc-result" id="calcResult">
<div class="r-num" id="rPower">0 kW</div>
<div class="r-label" id="rDesc"></div>
</div>
</div>
</div>
<div class="card">
<h2><span class="icon">📊</span> 中国风电数据</h2>
<div class="info-grid">
<div class="info-item"><div class="i-cat">装机容量</div><div class="i-title">全国风电装机</div><div class="i-desc">截至2024年，中国风电累计装机容量超过4.5亿千瓦，居世界第一</div></div>
<div class="info-item"><div class="i-cat">年发电量</div><div class="i-title">风电年发电量</div><div class="i-desc">2023年风电发电量约8800亿千瓦时，占全国总发电量的9.5%</div></div>
<div class="info-item"><div class="i-cat">发展目标</div><div class="i-title">2060碳中和目标</div><div class="i-desc">预计到2060年风电装机将达到30亿千瓦以上</div></div>
<div class="info-item"><div class="i-cat">技术进步</div><div class="i-title">单机容量突破</div><div class="i-desc">中国已研制出16MW海上风电机组，叶轮直径超250米</div></div>
</div>
</div>
<footer>风力发电知识库 · 数据来源：国家能源局、中国可再生能源学会</footer>
</div>
<script>
const CATEGORIES=[
{id:'all',name:'全部'},
{id:'principle',name:'发电原理'},
{id:'types',name:'风机类型'},
{id:'application',name:'应用场景'},
{id:'environment',name:'环境影响'},
{id:'future',name:'发展前景'}
];
const ITEMS=[
{cat:'principle',title:'风能转换原理',desc:'风力推动叶片旋转，通过齿轮箱增速后驱动发电机，将动能转化为电能。贝兹极限理论最大效率为59.3%。'},
{cat:'principle',title:'功率曲线',desc:'风机有切入风速（约3m/s）、额定风速（约12m/s）和切出风速（约25m/s），功率与风速的三次方成正比。'},
{cat:'principle',title:'风能公式',desc:'P = 0.5 × ρ × A × V³ × Cp，其中ρ为空气密度，A为扫掠面积，V为风速，Cp为功率系数。'},
{cat:'types',title:'水平轴风机',desc:'叶片水平旋转，是目前最主流的风机类型，效率高，适合大规模风电场。'},
{cat:'types',title:'垂直轴风机',desc:'叶片垂直旋转，无需对风，适合城市和分散式场景，但效率略低。'},
{cat:'types',title:'海上风电',desc:'安装在海上，风资源丰富稳定，不占用土地，但建设和维护成本较高。'},
{cat:'application',title:'集中式风电场',desc:'在风资源丰富地区建设大型风电场，通过高压输电线路并入电网。'},
{cat:'application',title:'分散式风电',desc:'就近接入电网，不需长距离输电，适合工业园区和新农村建设。'},
{cat:'application',title:'风光互补',desc:'风电与光伏结合，昼夜互补，提高可再生能源发电的稳定性。'},
{cat:'environment',title:'鸟类影响',desc:'风机可能对鸟类造成威胁，但影响远小于高楼和电线，可通过选址和雷达避让减少。'},
{cat:'environment',title:'噪音问题',desc:'现代风机噪音控制在40-45分贝，距居民区保持安全距离即可。'},
{cat:'environment',title:'碳排放对比',desc:'风电全生命周期碳排放仅11g CO₂/kWh，远低于火电的820g。'},
{cat:'future',title:'深远海风电',desc:'漂浮式海上风电技术正在发展，可开发深水区域的风能资源。'},
{cat:'future',title:'智能运维',desc:'AI和大数据技术用于风机故障预测和发电量优化，提升运维效率。'},
{cat:'future',title:'储能配套',desc:'风电+储能组合可解决间歇性问题，提高电网稳定性。'}
];
let activeTab='all';
function renderTabs(){
let h='';
CATEGORIES.forEach(c=>{h+=`<div class="tab ${activeTab===c.id?'active':''}" onclick="setTab('${c.id}')">${c.name}</div>`});
document.getElementById('tabs').innerHTML=h;
}
function renderList(query=''){
let filtered=ITEMS;
if(activeTab!=='all')filtered=filtered.filter(i=>i.cat===activeTab);
if(query)filtered=filtered.filter(i=>i.title.includes(query)||i.desc.includes(query));
let h='';
filtered.forEach(i=>{
h+=`<div class="info-item"><div class="i-cat">${CATEGORIES.find(c=>c.id===i.cat)?.name||i.cat}</div><div class="i-title">${i.title}</div><div class="i-desc">${i.desc}</div></div>`;
});
if(!filtered.length)h='<div style="text-align:center;padding:40px;color:var(--text2);grid-column:1/-1">未找到相关内容</div>';
document.getElementById('infoGrid').innerHTML=h;
}
function setTab(id){activeTab=id;renderTabs();renderList(document.getElementById('searchInput').value)}
function filterItems(){renderList(document.getElementById('searchInput').value)}
function calcPower(){
const v=parseFloat(document.getElementById('windSpeed').value)||0;
const d=parseFloat(document.getElementById('rotorDia').value)||80;
const rho=parseFloat(document.getElementById('airDensity').value)||1.225;
const r=d/2;
const area=Math.PI*r*r;
const cp=0.4;
const power=0.5*rho*area*Math.pow(v,3)*cp/1000;
document.getElementById('rPower').textContent=power.toFixed(1)+' kW';
const dailyKwh=power*24*0.3;
document.getElementById('rDesc').textContent=`预计日发电量约 ${dailyKwh.toFixed(0)} kWh，年发电约 ${(dailyKwh*365).toFixed(0)} kWh`;
document.getElementById('calcResult').className='calc-result show';
}
renderTabs();renderList();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
