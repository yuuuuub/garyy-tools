<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍳 中式菜谱</title>
<meta property="og:title" content="🍳 中式菜谱">
<meta property="og:description" content="🍳 中式菜谱 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="收藏和管理你的中式菜谱，记录食材与做法">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1}.ctn{padding:0}}
.li{padding:14px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;color:#fff;margin-right:4px}
.tag.easy{background:var(--success)}.tag.medium{background:var(--warn)}.tag.hard{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.gr .st{text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.detail{display:none;margin-top:10px;padding:10px;background:var(--bg);border-radius:8px;font-size:.9rem}
.detail.open{display:block}
.detail h3{font-size:.9rem;margin-bottom:6px;color:var(--accent)}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar button{padding:6px 14px;font-size:.85rem;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:20px;cursor:pointer}
.filter-bar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-box{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;margin-bottom:12px;font-size:.95rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🍳 中式菜谱</h1><p>收藏和管理你的菜谱</p></div>

<div class="gr">
<div class="st"><div class="nm" id="sTotal">0</div><div class="lb">总菜谱</div></div>
<div class="st"><div class="nm" id="sEasy">0</div><div class="lb">简单</div></div>
<div class="st"><div class="nm" id="sMedium">0</div><div class="lb">中等</div></div>
<div class="st"><div class="nm" id="sHard">0</div><div class="lb">复杂</div></div>
</div>

<div class="cd" style="margin-top:16px"><h2>添加菜谱</h2>
<div class="fr">
<div><label>菜名</label><input type="text" id="rName" placeholder="如：红烧肉"></div>
<div><label>分类</label><input type="text" id="rCategory" placeholder="川菜、粤菜..."></div>
</div>
<div class="fr">
<div><label>烹饪时间(分钟)</label><input type="number" id="rTime" placeholder="30"></div>
<div><label>难度</label><select id="rDifficulty"><option value="easy">简单</option><option value="medium">中等</option><option value="hard">复杂</option></select></div>
</div>
<label>食材 (每行一种)</label><textarea id="rIngredients" placeholder="五花肉 500g&#10;生抽 2勺&#10;老抽 1勺"></textarea>
<label>做法步骤 (每行一步)</label><textarea id="rSteps" placeholder="1. 五花肉切块焯水&#10;2. 锅中放油炒糖色&#10;3. 加入肉块翻炒"></textarea>
<label>小贴士</label><textarea id="rTips" placeholder="可选的烹饪小贴士..."></textarea>
<div class="bg"><button onclick="addRecipe()">添加菜谱</button></div>
<div id="rMsg" style="display:none;text-align:center;padding:8px;border-radius:8px;margin-top:8px;font-size:.85rem"></div></div>

<div class="cd"><h2>我的菜谱</h2>
<input type="text" class="search-box" id="searchBox" placeholder="搜索菜谱..." oninput="render()">
<div class="filter-bar">
<button class="active" onclick="setFilter('all',this)">全部</button>
<button onclick="setFilter('easy',this)">简单</button>
<button onclick="setFilter('medium',this)">中等</button>
<button onclick="setFilter('hard',this)">复杂</button>
</div>
<div id="recipeList" class="es">暂无菜谱</div>
</div>
</div>

<script>
let recipes=JSON.parse(localStorage.getItem('recipeBookCn')||'[]');
let filter='all';
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function save(){localStorage.setItem('recipeBookCn',JSON.stringify(recipes))}
function showMsg(m,t){const e=$('rMsg');e.textContent=m;e.style.display='block';e.style.background=t==='error'?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)';e.style.color=t==='error'?'var(--danger)':'var(--success)';setTimeout(()=>e.style.display='none',2000)}
function addRecipe(){const name=$('rName').value.trim(),category=$('rCategory').value.trim(),time=parseInt($('rTime').value)||0,difficulty=$('rDifficulty').value,ingredients=$('rIngredients').value.trim(),steps=$('rSteps').value.trim(),tips=$('rTips').value.trim();if(!name){showMsg('请填写菜名','error');return}recipes.push({name,category,time,difficulty,ingredients,steps,tips,addedAt:Date.now()});save();render();showMsg('菜谱已添加','success');['rName','rCategory','rTime','rIngredients','rSteps','rTips'].forEach(id=>$(id).value='')}
function setFilter(f,el){filter=f;document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function toggleDetail(i){const el=document.getElementById('detail-'+i);el.classList.toggle('open')}
function render(){const q=($('searchBox').value||'').toLowerCase();const filtered=recipes.filter(r=>{if(filter!=='all'&&r.difficulty!==filter)return false;if(q&&!r.name.toLowerCase().includes(q)&&!(r.category||'').toLowerCase().includes(q))return false;return true});$('sTotal').textContent=recipes.length;$('sEasy').textContent=recipes.filter(r=>r.difficulty==='easy').length;$('sMedium').textContent=recipes.filter(r=>r.difficulty==='medium').length;$('sHard').textContent=recipes.filter(r=>r.difficulty==='hard').length;$('recipeList').innerHTML=filtered.length?filtered.map((r,i)=>{const realIdx=recipes.indexOf(r);const diffMap={easy:'简单',medium:'中等',hard:'复杂'};const ingList=r.ingredients?r.ingredients.split('\n').map(x=>'<li>'+esc(x)+'</li>').join(''):'';const stepList=r.steps?r.steps.split('\n').map(x=>'<li>'+esc(x)+'</li>').join(''):'';return '<div class="li"><div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleDetail('+realIdx+')"><div><span style="font-weight:600;font-size:1.05rem">'+esc(r.name)+'</span><br><span class="tag '+r.difficulty+'">'+diffMap[r.difficulty]+'</span>'+(r.category?'<span style="color:var(--text2);font-size:.8rem;margin-left:4px">'+esc(r.category)+'</span>':'')+(r.time?'<span style="color:var(--text2);font-size:.8rem;margin-left:4px">⏱ '+r.time+'分钟</span>':'')+'</div><span style="color:var(--text2)">▼</span></div><div class="detail" id="detail-'+realIdx+'">'+(ingList?'<h3>食材</h3><ul style="margin:0 0 10px 20px">'+ingList+'</ul>':'')+(stepList?'<h3>做法</h3><ol style="margin:0 0 10px 20px">'+stepList+'</ol>':'')+(r.tips?'<h3>小贴士</h3><p style="color:var(--text2)">'+esc(r.tips)+'</p>':'')+'<div class="bg" style="margin-top:12px"><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="event.stopPropagation();removeRecipe('+realIdx+')">删除</button></div></div></div>'}).join(''):'<div class="es">暂无菜谱</div>'}
function removeRecipe(i){if(!confirm('确认删除？'))return;recipes.splice(i,1);save();render()}
render()
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
