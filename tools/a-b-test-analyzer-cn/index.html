<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔬 A/B测试分析器</title>
<meta property="og:title" content="🔬 A/B测试分析器">
<meta property="og:description" content="🔬 A/B测试分析器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="A/B测试统计分析工具，计算显著性、置信区间、效应量和样本量">
<meta name="robots" content="index, follow">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:20px}
.container{max-width:1000px;margin:0 auto}
h1{color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
label{display:block;font-weight:600;margin-bottom:4px;font-size:13px;color:var(--text2)}
input,select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-sm{padding:4px 10px;font-size:12px}
.theme-toggle{position:fixed;top:20px;right:20px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:6px;cursor:pointer;z-index:100}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-box{text-align:center;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.stat-box .num{font-size:24px;font-weight:700;color:var(--blue)}
.stat-box .label{font-size:12px;color:var(--text2);margin-top:4px}
.result-card{padding:16px;border-radius:8px;margin-top:12px}
.result-significant{background:rgba(26,127,55,.1);border:1px solid var(--green);color:var(--green)}
.result-not-significant{background:rgba(207,34,46,.1);border:1px solid var(--red);color:var(--red)}
.bar-chart{display:flex;align-items:flex-end;gap:24px;justify-content:center;height:160px;padding:16px 0}
.bar-group{display:flex;flex-direction:column;align-items:center;gap:8px}
.bar{width:60px;border-radius:4px 4px 0 0;transition:height .3s}
.bar-label{font-size:12px;color:var(--text2)}
.bar-value{font-size:13px;font-weight:600}
.ci-bar{position:relative;height:24px;background:var(--border);border-radius:12px;margin:6px 0}
.ci-fill{position:absolute;height:100%;border-radius:12px}
.ci-point{position:absolute;width:12px;height:12px;border-radius:50%;top:6px;transform:translateX(-50%)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{font-weight:600;color:var(--text2);font-size:12px}
.history-item{padding:12px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;background:var(--card)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>🔬 A/B测试分析器</h1>

<div class="stat-row" id="statsRow"></div>

<div class="card">
<h3 style="margin-bottom:16px">双样本比例检验</h3>
<div class="grid-2">
<div>
<h4 style="margin-bottom:8px;color:var(--blue)">对照组 (A)</h4>
<div class="grid-2">
<div><label>样本量</label><input type="number" id="aVisitors" placeholder="10000"></div>
<div><label>转化数</label><input type="number" id="aConversions" placeholder="350"></div>
</div>
</div>
<div>
<h4 style="margin-bottom:8px;color:var(--green)">实验组 (B)</h4>
<div class="grid-2">
<div><label>样本量</label><input type="number" id="bVisitors" placeholder="10000"></div>
<div><label>转化数</label><input type="number" id="bConversions" placeholder="420"></div>
</div>
</div>
</div>
<div style="margin-top:12px;display:flex;gap:8px;align-items:center">
<button onclick="runTest()">🔬 运行分析</button>
<select id="alphaLevel" style="width:auto"><option value="0.05">α = 0.05</option><option value="0.01">α = 0.01</option><option value="0.10">α = 0.10</option></select>
</div>
</div>

<div id="resultArea"></div>

<div class="card">
<h3 style="margin-bottom:16px">样本量计算器</h3>
<div class="grid-3">
<div><label>基准转化率 (%)</label><input type="number" id="sBaseRate" value="5" step="0.1"></div>
<div><label>最小可检测效应 (%)</label><input type="number" id="sMDE" value="1" step="0.1"></div>
<div><label>统计功效</label><select id="sPower"><option value="0.8">80%</option><option value="0.9">90%</option></select></div>
</div>
<div style="margin-top:12px;display:flex;gap:8px;align-items:center">
<button onclick="calcSampleSize()">📊 计算样本量</button>
<span id="sampleResult" style="font-size:14px;color:var(--text2)"></span>
</div>
</div>

<div class="card">
<h3 style="margin-bottom:16px">序贯分析 (多重检验)</h3>
<div id="sequentialArea">
<div class="grid-2">
<div><label>每次检验的样本量</label><input type="number" id="seqN" value="1000"></div>
<div><label>总检验次数</label><input type="number" id="seqK" value="5"></div>
</div>
<div style="margin-top:8px"><label>各次检验的累计转化 (用逗号分隔)</label><input type="text" id="seqData" placeholder="例：35,72,108,150,189"></div>
<div style="margin-top:8px;display:flex;gap:8px">
<button onclick="runSequential()">📈 序贯分析</button>
<button class="btn-green" onclick="runSequentialOBF()">📐 O'Brien-Fleming边界</button>
</div>
<div id="seqResult" style="margin-top:8px"></div>
</div>
</div>

<div class="card">
<h3 style="margin-bottom:16px">分析历史</h3>
<div id="historyList"></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var history=JSON.parse(localStorage.getItem('ab_history')||'[]');

function normalCDF(x){
  var a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  var sign=x<0?-1:1;x=Math.abs(x)/Math.sqrt(2);
  var t=1/(1+p*x);
  var y=1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return 0.5*(1+sign*y);
}

function normalInv(p){
  if(p<=0)return-Infinity;if(p>=1)return Infinity;
  var a=[-3.969683028665376e1,2.209460984245205e2,-2.759285104469687e2,1.383577518672690e2,-3.066479806614716e1,2.506628277459239e0];
  var b=[-5.447609879822406e1,1.615858368580409e2,-1.556989798598866e2,6.680131188771972e1,-1.328068155288572e1];
  var c=[-7.784894002430293e-3,-3.223964580411365e-1,-2.400758277161838e0,-2.549732539343734e0,4.374664141464968e0,2.938163982698783e0];
  var d=[7.784695709041462e-3,3.224671290700398e-1,2.445134137142996e0,3.754408661907416e0];
  var pLow=0.02425,pHigh=1-pLow;
  var q,r;
  if(p<pLow){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p<=pHigh){q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
  q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}

function runTest(){
  var n1=parseInt(document.getElementById('aVisitors').value);
  var c1=parseInt(document.getElementById('aConversions').value);
  var n2=parseInt(document.getElementById('bVisitors').value);
  var c2=parseInt(document.getElementById('bConversions').value);
  var alpha=parseFloat(document.getElementById('alphaLevel').value);
  if(!n1||!c1||!n2||!c2||c1>n1||c2>n2){alert('请填写有效数据');return;}

  var p1=c1/n1,p2=c2/n2;
  var pPool=(c1+c2)/(n1+n2);
  var se=Math.sqrt(pPool*(1-pPool)*(1/n1+1/n2));
  var z=(p2-p1)/se;
  var pValue=2*(1-normalCDF(Math.abs(z)));
  var significant=pValue<alpha;

  var ci95_se=Math.sqrt(p1*(1-p1)/n1+p2*(1-p2)/n2);
  var ciLow=(p2-p1)-1.96*ci95_se;
  var ciHigh=(p2-p1)+1.96*ci95_se;

  var lift=(p2-p1)/p1*100;
  var pooledSD=Math.sqrt(pPool*(1-pPool));
  var cohensH=2*(Math.asin(Math.sqrt(p2))-Math.asin(Math.sqrt(p1)));
  var nrm=c1+n2;
  var power=1-normalCDF(1.96-Math.abs(p2-p1)/Math.sqrt(pPool*(1-pPool)*(1/n1+1/n2)));

  var item={date:new Date().toLocaleDateString('zh-CN'),n1:n1,c1:c1,n2:n2,c2:c2,p1:p1.toFixed(4),p2:p2.toFixed(4),z:z.toFixed(4),pValue:pValue.toFixed(6),significant:significant,lift:lift.toFixed(2),alpha:alpha};
  history.unshift(item);if(history.length>20)history.pop();
  localStorage.setItem('ab_history',JSON.stringify(history));

  var resultHTML='<div class="result-card '+(significant?'result-significant':'result-not-significant')+'">';
  resultHTML+='<h3>'+(significant?'✅ 结果显著':'⚠️ 结果不显著')+'</h3>';
  resultHTML+='<div class="stat-row" style="grid-template-columns:repeat(5,1fr);margin-top:12px">';
  resultHTML+='<div class="stat-box"><div class="num" style="font-size:20px">'+(p1*100).toFixed(2)+'%</div><div class="label">对照组转化率</div></div>';
  resultHTML+='<div class="stat-box"><div class="num" style="font-size:20px;color:var(--green)">'+(p2*100).toFixed(2)+'%</div><div class="label">实验组转化率</div></div>';
  resultHTML+='<div class="stat-box"><div class="num" style="font-size:20px;color:'+(significant?'var(--green)':'var(--red)')+'">'+z.toFixed(3)+'</div><div class="label">Z值</div></div>';
  resultHTML+='<div class="stat-box"><div class="num" style="font-size:20px;color:'+(significant?'var(--green)':'var(--red)')+'">'+pValue.toFixed(4)+'</div><div class="label">P值</div></div>';
  resultHTML+='<div class="stat-box"><div class="num" style="font-size:20px;color:'+lift>0?'var(--green)':'var(--red)'+'">'+(lift>0?'+':'')+lift.toFixed(2)+'%</div><div class="label">提升幅度</div></div>';
  resultHTML+='</div>';

  resultHTML+='<h4 style="margin-top:16px">转化率对比</h4>';
  var maxP=Math.max(p1,p2)*100;
  resultHTML+='<div class="bar-chart"><div class="bar-group"><div class="bar-value" style="color:var(--text2)">'+(p1*100).toFixed(2)+'%</div><div class="bar" style="height:'+(p1/maxP*120)+'px;background:var(--text2)"></div><div class="bar-label">对照组 A</div></div>';
  resultHTML+='<div class="bar-group"><div class="bar-value" style="color:var(--green)">'+(p2*100).toFixed(2)+'%</div><div class="bar" style="height:'+(p2/maxP*120)+'px;background:var(--green)"></div><div class="bar-label">实验组 B</div></div></div>';

  resultHTML+='<h4 style="margin-top:16px">差异置信区间 (95%)</h4>';
  resultHTML+='<div style="padding:0 20px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2)"><span>'+(ciLow*100).toFixed(2)+'%</span><span>0</span><span>'+(ciHigh*100).toFixed(2)+'%</span></div>';
  resultHTML+='<div class="ci-bar"><div class="ci-fill" style="left:'+(50+ciLow*100/4*50)+'%;width:'+Math.abs(ciHigh-ciLow)*100/4*50+'%;background:'+(significant?'rgba(26,127,55,.3)':'rgba(207,34,46,.3)')+'"></div><div class="ci-point" style="left:50%;background:var(--blue)"></div></div></div>';

  resultHTML+='<div style="margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px">';
  resultHTML+='<div style="text-align:center;padding:12px;background:var(--bg);border-radius:6px"><div style="font-size:20px;font-weight:700;color:var(--purple)">'+cohensH.toFixed(4)+'</div><div style="font-size:12px;color:var(--text2)">Cohen\'s h效应量</div></div>';
  resultHTML+='<div style="text-align:center;padding:12px;background:var(--bg);border-radius:6px"><div style="font-size:20px;font-weight:700;color:var(--blue)">'+(power*100).toFixed(1)+'%</div><div style="font-size:12px;color:var(--text2)">统计功效</div></div>';
  resultHTML+='<div style="text-align:center;padding:12px;background:var(--bg);border-radius:6px"><div style="font-size:20px;font-weight:700">'+alpha+'</div><div style="font-size:12px;color:var(--text2)">显著性水平 α</div></div>';
  resultHTML+='</div>';

  var effectSize=Math.abs(cohensH);
  var effectLabel=effectSize<0.2?'小':effectSize<0.5?'小到中':effectSize<0.8?'中到大':'大';
  resultHTML+='<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:6px;font-size:13px"><strong>结论：</strong>';
  if(significant)resultHTML+='实验组B的转化率显著高于对照组A (p='+pValue.toFixed(4)+' < α='+alpha+')，提升'+lift.toFixed(2)+'%，效应量为'+effectLabel+'。建议采用实验组方案。';
  else resultHTML+='两组之间无统计显著差异 (p='+pValue.toFixed(4)+' ≥ α='+alpha+')。建议增加样本量或调整实验设计后重新测试。';
  resultHTML+='</div></div>';

  document.getElementById('resultArea').innerHTML=resultHTML;
  renderHistory();renderStats();
}

function calcSampleSize(){
  var baseRate=parseFloat(document.getElementById('sBaseRate').value)/100;
  var mde=parseFloat(document.getElementById('sMDE').value)/100;
  var power=parseFloat(document.getElementById('sPower').value);
  if(!baseRate||!mde){alert('请填写有效数值');return;}
  var alpha=0.05;
  var z1=normalInv(1-alpha/2);
  var z2=normalInv(power);
  var n=Math.ceil(Math.pow(z1+z2,2)*(2*baseRate*(1-baseRate)+2*(baseRate+mde)*(1-baseRate-mde))/Math.pow(mde,2));
  document.getElementById('sampleResult').innerHTML='<strong style="color:var(--blue)">每组需要 '+n.toLocaleString()+' 样本量，共需 '+((n*2).toLocaleString())+'</strong>';
}

function runSequential(){
  var nPerLook=parseInt(document.getElementById('seqN').value)||1000;
  var data=document.getElementById('seqData').value.split(',').map(Number).filter(x=>!isNaN(x));
  var k=parseInt(document.getElementById('seqK').value)||data.length;
  if(!data.length){alert('请输入累计转化数据');return;}

  var alpha=0.05;
  var html='<table><thead><tr><th>检验次序</th><th>累计样本</th><th>累计转化</th><th>当前转化率</th><th>P值 (vs 第1次)</th><th>累积α消耗</th><th>结论</th></tr></thead><tbody>';
  var cumAlpha=0;
  data.forEach(function(c,i){
    var cumN=nPerLook*(i+1);
    var rate=c/cumN;
    var firstRate=data[0]/nPerLook;
    var se=Math.sqrt(firstRate*(1-firstRate)/nPerLook+rate*(1-rate)/(cumN-nPerLook));
    var z=se>0?(rate-firstRate)/se:0;
    var pVal=2*(1-normalCDF(Math.abs(z)));
    cumAlpha+=alpha/k;
    var decision=i===0?'基线':pVal<(alpha/(k-i))?'✅ 显著':'⏳ 继续';
    html+='<tr><td>'+(i+1)+'</td><td>'+cumN.toLocaleString()+'</td><td>'+c+'</td><td>'+(rate*100).toFixed(2)+'%</td><td>'+pVal.toFixed(4)+'</td><td>'+(cumAlpha*100).toFixed(1)+'%</td><td>'+decision+'</td></tr>';
  });
  html+='</tbody></table>';
  document.getElementById('seqResult').innerHTML=html;
}

function runSequentialOBF(){
  var nPerLook=parseInt(document.getElementById('seqN').value)||1000;
  var data=document.getElementById('seqData').value.split(',').map(Number).filter(x=>!isNaN(x));
  var k=parseInt(document.getElementById('seqK').value)||data.length;
  if(!data.length){alert('请输入累计转化数据');return;}

  var alpha=0.05;
  var html='<h4 style="margin:12px 0 8px">O\'Brien-Fleming边界</h4><table><thead><tr><th>次序</th><th>累计样本</th><th>边界Z值</th><th>边界α</th><th>实际Z值</th><th>结论</th></tr></thead><tbody>';
  data.forEach(function(c,i){
    var cumN=nPerLook*(i+1);
    var rate=c/cumN;
    var obfZ=normalInv(1-alpha/2)/Math.sqrt((i+1)/k);
    var firstRate=data[0]/nPerLook;
    var se=Math.sqrt(firstRate*(1-firstRate)/nPerLook+rate*(1-rate)/Math.max(1,cumN-nPerLook));
    var actualZ=se>0?(rate-firstRate)/se:0;
    var pBound=2*(1-normalCDF(obfZ));
    var decision=Math.abs(actualZ)>=obfZ?'✅ 拒绝H0':'⏳ 继续';
    html+='<tr><td>'+(i+1)+'</td><td>'+cumN.toLocaleString()+'</td><td>±'+obfZ.toFixed(3)+'</td><td>'+pBound.toFixed(6)+'</td><td>'+actualZ.toFixed(3)+'</td><td>'+decision+'</td></tr>';
  });
  html+='</tbody></table>';
  document.getElementById('seqResult').innerHTML+=html;
}

function renderHistory(){
  var el=document.getElementById('historyList');
  if(!history.length){el.innerHTML='<p style="color:var(--text2)">暂无历史记录</p>';return;}
  el.innerHTML=history.map(function(h){
    return '<div class="history-item"><div style="display:flex;justify-content:space-between;align-items:center"><div><strong>'+(h.significant?'✅':'⚠️')+' '+h.date+'</strong> <span style="font-size:13px;color:var(--text2)">α='+h.alpha+'</span></div><div style="font-size:13px">'+h.lift+'% 提升</div></div><div style="font-size:12px;color:var(--text2);margin-top:4px">A: '+h.p1+' ('+h.c1+'/'+h.n1+') vs B: '+h.p2+' ('+h.c2+'/'+h.n2+') · Z='+h.z+' · P='+h.pValue+'</div></div>';
  }).join('');
}

function renderStats(){
  var total=history.length;
  var sig=history.filter(h=>h.significant).length;
  var avgLift=history.length?history.reduce((s,h)=>s+parseFloat(h.lift),0)/history.length:0;
  document.getElementById('statsRow').innerHTML='<div class="stat-box"><div class="num">'+total+'</div><div class="label">总测试数</div></div><div class="stat-box"><div class="num" style="color:var(--green)">'+sig+'</div><div class="label">显著结果</div></div><div class="stat-box"><div class="num" style="color:var(--blue)">'+(avgLift>0?'+':'')+avgLift.toFixed(2)+'%</div><div class="label">平均提升</div></div><div class="stat-box"><div class="num" style="color:var(--purple)">'+(total?Math.round(sig/total*100):0)+'%</div><div class="label">成功率</div></div>';
}

function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
renderStats();renderHistory();
</script>
</body>
</html>
