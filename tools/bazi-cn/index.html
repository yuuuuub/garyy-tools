<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>八字排盘 - 命理分析</title>
<meta name="description" content="八字排盘工具 - 输入出生时间，排八字、算五行、分析命理"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--accent2:#8b5cf6;--green:#10b981;--red:#ef4444;--gold:#f59e0b}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#9a6700}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:20px;line-height:1.6}
.container{max-width:600px;margin:0 auto}
h1{font-size:1.6rem;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{background:var(--blue);color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:.95rem;width:100%;margin-top:8px;transition:all .2s}
.btn:hover{opacity:.9}
.label{font-size:.85rem;color:var(--text2);margin-bottom:6px;margin-top:10px}
select,input[type=number]{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:4px;font-family:inherit}
select:focus,input:focus{border-color:var(--blue);outline:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px}
.result h3{font-size:1rem;color:var(--blue);margin-bottom:8px}
.result p{margin:6px 0;font-size:.9rem}
.result .highlight{font-size:1.2rem;font-weight:700;color:var(--gold);text-align:center;margin:12px 0}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.8rem;margin:2px;font-weight:500}
.tag-gold{background:rgba(245,158,11,.15);color:var(--gold)}
.tag-green{background:rgba(16,185,129,.15);color:var(--green)}
.tag-red{background:rgba(239,68,68,.15);color:var(--red)}
.tag-blue{background:rgba(59,130,246,.15);color:var(--blue)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
@media(max-width:480px){body{padding:12px}.row{grid-template-columns:1fr}}
</style><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="八字排盘 - 命理分析">
<meta property="og:description" content="八字排盘工具 - 输入出生时间，排八字、算五行、分析命理">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🔮 八字排盘</h1>
<p class="sub">输入出生时间，排八字、算五行、分析命理</p>

<div class="card">
<div class="label">出生年份</div>
<select id="year"></select>
<div class="label">出生月份（农历）</div>
<select id="month"></select>
<div class="label">出生日期（农历）</div>
<select id="day"></select>
<div class="label">出生时辰</div>
<select id="hour">
<option value="0">子时 (23:00-01:00)</option>
<option value="1">丑时 (01:00-03:00)</option>
<option value="2">寅时 (03:00-05:00)</option>
<option value="3">卯时 (05:00-07:00)</option>
<option value="4">辰时 (07:00-09:00)</option>
<option value="5">巳时 (09:00-11:00)</option>
<option value="6">午时 (11:00-13:00)</option>
<option value="7">未时 (13:00-15:00)</option>
<option value="8">申时 (15:00-17:00)</option>
<option value="9">酉时 (17:00-19:00)</option>
<option value="10">戌时 (19:00-21:00)</option>
<option value="11">亥时 (21:00-23:00)</option>
</select>
<button class="btn" onclick="calculate()">排盘分析</button>
</div>

<div id="result"></div>
</div>

<script>
var tianGan=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var diZhi=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var shengXiao=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
var wuXingGan=['木','木','火','火','土','土','金','金','水','水'];
var wuXingZhi=['水','土','木','木','土','火','火','土','金','金','土','水'];
var tianGanWuXing=['甲木','乙木','丙火','丁火','戊土','己土','庚金','辛金','壬水','癸水'];
var diZhiWuXing=['子水','丑土','寅木','卯木','辰土','巳火','午火','未土','申金','酉金','戌土','亥水'];
var wuXingShengKe={
  '木生火':'木生火，火生土，土生金，金生水，水生木',
  '木克土':'木克土，土克水，水克火，火克金，金克木'
};
var shengRelation={'木':'火','火':'土','土':'金','金':'水','水':'木'};
var keRelation={'木':'土','土':'水','水':'火','火':'金','金':'木'};

for(var y=1940;y<=2030;y++){
  var opt=document.createElement('option');
  opt.value=y-1940;opt.textContent=y+'年 ('+shengXiao[(y-4)%12]+'年)';
  document.getElementById('year').appendChild(opt);
}
for(var m=1;m<=12;m++){
  var opt=document.createElement('option');
  opt.value=m-1;opt.textContent=m+'月';
  document.getElementById('month').appendChild(opt);
}
for(var d=1;d<=30;d++){
  var opt=document.createElement('option');
  opt.value=d-1;opt.textContent=d+'日';
  document.getElementById('day').appendChild(opt);
}
document.getElementById('year').value=15;

function calculate(){
  var yIdx=parseInt(document.getElementById('year').value);
  var mIdx=parseInt(document.getElementById('month').value);
  var dIdx=parseInt(document.getElementById('day').value);
  var hIdx=parseInt(document.getElementById('hour').value);
  var year=1940+yIdx;
  var month=mIdx+1;
  var day=dIdx+1;
  
  var yearGan=(year-4)%10;
  var yearZhi=(year-4)%12;
  var monthGan=(yearGan*2+month)%10;
  var monthZhi=(month+1)%12;
  var dayGan=(year*5+year/4+9*month+day+15)%10;
  if(dayGan<0)dayGan+=10;
  dayGan=Math.floor(dayGan)%10;
  var dayZhi=Math.floor((dayGan+2*monthZhi)%12);
  if(dayZhi<0)dayZhi+=12;
  var hourGan=(dayGan*2+hIdx)%10;
  var hourZhi=hIdx;
  
  var bazi=[
    {label:'年柱',gan:tianGan[yearGan],zhi:diZhi[yearZhi],wxGan:wuXingGan[yearGan],wxZhi:wuXingZhi[yearZhi]},
    {label:'月柱',gan:tianGan[monthGan],zhi:diZhi[monthZhi],wxGan:wuXingGan[monthGan],wxZhi:wuXingZhi[monthZhi]},
    {label:'日柱',gan:tianGan[dayGan],zhi:diZhi[dayZhi],wxGan:wuXingGan[dayGan],wxZhi:wuXingZhi[dayZhi]},
    {label:'时柱',gan:tianGan[hourGan],zhi:diZhi[hourZhi],wxGan:wuXingGan[hourGan],wxZhi:wuXingZhi[hourZhi]}
  ];
  
  var counts={};tianGanWuXing.forEach(function(w){var x=w[0]+w[1];if(!counts[x])counts[x]=0;});
  bazi.forEach(function(b){
    var g=b.wxGan;if(!counts[g])counts[g]=0;counts[g]++;
  });
  var elements=Object.keys(counts).map(function(k){return{k:k,v:counts[k]};}).sort(function(a,b){return b.v-a.v;});
  
  var shengXiaoIdx=(year-4)%12;
  var dayMaster=tianGan[bazi[2].gan];
  
  var html='<div class="card">';
  html+='<div class="result"><div class="highlight">日主：'+dayMaster+'（'+wuXingGan[bazi[2].gan]+'）</div>';
  html+='<div style="text-align:center"><span class="tag tag-blue">'+shengXiao[shengXiaoIdx]+'年出生</span></div></div>';
  
  html+='<div class="result"><h3>📋 八字排盘</h3>';
  html+='<table style="width:100%;border-collapse:collapse;margin-top:8px">';
  html+='<tr style="border-bottom:1px solid var(--border)"><td style="padding:8px;color:var(--text2);width:25%">时柱</td><td style="padding:8px;color:var(--text2)">日柱</td><td style="padding:8px;color:var(--text2)">月柱</td><td style="padding:8px;color:var(--text2)">年柱</td></tr>';
  html+='<tr><td style="padding:8px;font-size:1.1em;font-weight:700;text-align:center">'+tianGan[hourGan]+'</td><td style="padding:8px;font-size:1.1em;font-weight:700;text-align:center">'+tianGan[dayGan]+'</td><td style="padding:8px;font-size:1.1em;font-weight:700;text-align:center">'+tianGan[monthGan]+'</td><td style="padding:8px;font-size:1.1em;font-weight:700;text-align:center">'+tianGan[yearGan]+'</td></tr>';
  html+='<tr><td style="padding:8px;font-size:1.1em;text-align:center">'+diZhi[hourZhi]+'</td><td style="padding:8px;font-size:1.1em;text-align:center">'+diZhi[dayZhi]+'</td><td style="padding:8px;font-size:1.1em;text-align:center">'+diZhi[monthZhi]+'</td><td style="padding:8px;font-size:1.1em;text-align:center">'+diZhi[yearZhi]+'</td></tr>';
  html+='<tr style="border-top:1px solid var(--border)"><td style="padding:6px;text-align:center;font-size:.8em;color:var(--text2)">'+diZhiWuXing[hourZhi]+'</td><td style="padding:6px;text-align:center;font-size:.8em;color:var(--text2)">'+diZhiWuXing[dayZhi]+'</td><td style="padding:6px;text-align:center;font-size:.8em;color:var(--text2)">'+diZhiWuXing[monthZhi]+'</td><td style="padding:6px;text-align:center;font-size:.8em;color:var(--text2)">'+diZhiWuXing[yearZhi]+'</td></tr>';
  html+='</table></div>';
  
  html+='<div class="result"><h3>🔥 五行分析</h3>';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">';
  var colors={'木':'#22c55e','火':'#ef4444','土':'#f59e0b','金':'#e5e7eb','水':'#3b82f6'};
  var wuXings=['木','火','土','金','水'];
  wuXings.forEach(function(w){
    var c=counts[w]||0;
    html+='<span style="background:'+(colors[w]+'22')+';color:'+colors[w]+';padding:6px 14px;border-radius:8px;font-weight:600;border:1px solid '+(colors[w]+'44')+'">'+w+' '+c+'</span>';
  });
  html+='</div>';
  html+='<p style="font-size:.85rem;color:var(--text2);margin-top:8px">日主<strong>'+dayMaster+'</strong>属'+wuXingGan[bazi[2].gan]+'，'+getWuXingAdvice(wuXingGan[bazi[2].gan])+'</p>';
  html+='</div></div>';
  
  document.getElementById('result').innerHTML=html;
}

function getWuXingAdvice(wx){
  var advice={
    '木':'木主仁，性格温和有同情心，适合教育、文化、艺术类工作。宜穿绿色、蓝色系衣物。',
    '火':'火主礼，性格热情开朗，适合传媒、演艺、餐饮类工作。宜穿红色、紫色系衣物。',
    '土':'土主信，性格稳重踏实，适合房产、农业、建筑类工作。宜穿黄色、棕色系衣物。',
    '金':'金主义，性格果断刚毅，适合金融、法律、军警类工作。宜穿白色、银色系衣物。',
    '水':'水主智，性格聪明灵活，适合贸易、旅游、物流类工作。宜穿黑色、蓝色系衣物。'
  };
  return advice[wx]||'';
}
calculate();
</script>
<script src="../i18n.js" defer></script>
</body></html>
