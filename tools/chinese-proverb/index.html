<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国谚语格言</title><meta name="description" content="中国谚语格言 - 在线查询中国谚语格言"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.proverb-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .2s}.proverb-item:hover{transform:translateY(-2px)}.proverb-text{font-size:1.1rem;line-height:1.6;margin-bottom:8px;color:var(--text)}.proverb-source{font-size:.85rem;color:var(--text2)}.proverb-meaning{font-size:.9rem;color:var(--blue);margin-top:8px;display:none}.proverb-item.expanded .proverb-meaning{display:block}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.85rem}.btn:hover{opacity:.85}.btn.active{background:var(--green)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="中国谚语格言"><meta property="og:description" content="中国谚语格言 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">

<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📖 中国谚语格言</h1><p class="sub">在线查询中国谚语格言</p>
<div class="card">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索谚语..." oninput="filterProverbs()">
</div>
<div class="btn-group">
<button class="btn active" onclick="filterByCategory('all',this)">全部</button>
<button class="btn" onclick="filterByCategory('人生',this)">人生</button>
<button class="btn" onclick="filterByCategory('学习',this)">学习</button>
<button class="btn" onclick="filterByCategory('工作',this)">工作</button>
<button class="btn" onclick="filterByCategory('社交',this)">社交</button>
<button class="btn" onclick="filterByCategory('其他',this)">其他</button>
</div>
</div>
<div id="proverbList"></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var proverbs=[
  {text:'千里之行，始于足下',source:'老子',category:'人生',meaning:'再远的路，也要从脚下第一步开始走起。比喻事情的成功是由小到大逐渐积累的。'},
  {text:'塞翁失马，焉知非福',source:'淮南子',category:'人生',meaning:'比喻一时虽然受到损失，但也有可能带来好处。'},
  {text:'己所不欲，勿施于人',source:'论语',category:'社交',meaning:'自己不想要的东西，不要强加给别人。'},
  {text:'学而时习之，不亦说乎',source:'论语',category:'学习',meaning:'学习并且经常复习，不是很快乐吗？'},
  {text:'温故而知新，可以为师矣',source:'论语',category:'学习',meaning:'温习旧知识从而得知新的理解，凭借这一点就可以成为老师了。'},
  {text:'三人行，必有我师焉',source:'论语',category:'学习',meaning:'几个人一起走路，其中必定有人可以做我的老师。'},
  {text:'业精于勤，荒于嬉',source:'韩愈',category:'工作',meaning:'学业或事业的精进在于勤奋，而荒废在于嬉游。'},
  {text:'书山有路勤为径，学海无涯苦作舟',source:'韩愈',category:'学习',meaning:'在读书、学习的道路上，没有捷径可走，勤奋和刻苦是唯一的途径。'},
  {text:'路遥知马力，日久见人心',source:'元曲',category:'社交',meaning:'路途遥远才能知道马的力气大小，日子长了才能看出人心的好坏。'},
  {text:'画龙画虎难画骨，知人知面不知心',source:'民间谚语',category:'社交',meaning:'画龙画虎容易，但画出骨头很难；认识一个人的面貌容易，但了解他的内心很难。'},
  {text:'良药苦口利于病，忠言逆耳利于行',source:'史记',category:'社交',meaning:'好药吃起来虽苦，却有利于治病；忠诚的告诫听起来不舒服，却有利于行事。'},
  {text:'滴水穿石，非一日之功',source:'民间谚语',category:'工作',meaning:'水滴能把石头穿透，这不是一天的功夫。比喻力量虽小，只要坚持不懈，事情就能成功。'},
  {text:'世上无难事，只怕有心人',source:'民间谚语',category:'人生',meaning:'只要下定决心去做，世界上没有什么办不到的事情。'},
  {text:'一分耕耘，一分收获',source:'民间谚语',category:'工作',meaning:'付出一份努力，就会有一份收获。'},
  {text:'吃一堑，长一智',source:'民间谚语',category:'人生',meaning:'受一次挫折，增长一分见识。'},
  {text:'百闻不如一见',source:'汉书',category:'学习',meaning:'听别人说一百次，不如自己亲眼见一次。'},
  {text:'活到老，学到老',source:'民间谚语',category:'学习',meaning:'人要不停地学习，直到生命的尽头。'},
  {text:'人心齐，泰山移',source:'民间谚语',category:'社交',meaning:'只要大家一心一意，就能产生巨大的力量，连泰山也能移动。'},
  {text:'种瓜得瓜，种豆得豆',source:'民间谚语',category:'人生',meaning:'做了什么事，就会得到什么样的结果。'},
  {text:'不经一番寒彻骨，怎得梅花扑鼻香',source:'唐·黄檗禅师',category:'人生',meaning:'不经历一番刺骨的寒冷，怎能有梅花扑鼻的芳香。比喻不经历艰难困苦，就不能获得成功。'}
];
var currentCategory='all';
function renderProverbs(proverbsToShow){
  var list=document.getElementById('proverbList');
  var html='';
  proverbsToShow.forEach(function(proverb,index){
    html+='<div class="proverb-item" onclick="toggleProverb(this)">';
    html+='<div class="proverb-text">"'+proverb.text+'"</div>';
    html+='<div class="proverb-source">—— '+proverb.source+'</div>';
    html+='<div class="proverb-meaning">'+proverb.meaning+'</div>';
    html+='</div>';
  });
  list.innerHTML=html;
}
function filterProverbs(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=proverbs.filter(function(proverb){
    var matchSearch=proverb.text.toLowerCase().includes(search)||proverb.source.toLowerCase().includes(search)||proverb.meaning.toLowerCase().includes(search);
    var matchCategory=currentCategory==='all'||proverb.category===currentCategory;
    return matchSearch&&matchCategory;
  });
  renderProverbs(filtered);
}
function filterByCategory(category,btn){
  currentCategory=category;
  document.querySelectorAll('.btn-group .btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterProverbs();
}
function toggleProverb(element){
  element.classList.toggle('expanded');
}
renderProverbs(proverbs);

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
