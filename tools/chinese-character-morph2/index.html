gin-top:8px}.morph2-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.morph2-char{font-size:6rem;font-weight:700;color:var(--blue);display:inline-block}.morph2-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.morph2-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.morph2-option:hover{border-color:var(--blue)}.morph2-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}

<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔄 汉字变形2</h1><p class="sub">在线查看汉字变形效果</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="变" oninput="showMorph2()">
</div>
<button class="btn" onclick="showMorph2()">显示变形</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var morphTypes2=['elastic','bounce','rubber','jelly','wobble','swing','tada','pulse','glow','shadow'];
var currentMorph2='elastic';
function showMorph2(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="morph2-options">';
  morphTypes2.forEach(function(type){
    html+='<div class="morph2-option '+(type===currentMorph2?'active':'')+'" onclick="setMorph2(\''+type+'\')">'+getMorphName2(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="morph2-container">';
  html+='<div class="morph2-char" style="animation:'+getMorphCSS2(currentMorph2)+'">'+char+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>📋 变形说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>变形类型：</strong>'+getMorphName2(currentMorph2)+'</div>';
  html+='<div><strong>效果描述：</strong>'+getMorphDescription2(currentMorph2)+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function setMorph2(type){
  currentMorph2=type;
  showMorph2();
}
function getMorphName2(type){
  switch(type){
    case 'elastic':return'弹性';
    case 'bounce':return'弹跳';
    case 'rubber':return'橡皮';
    case 'jelly':return'果冻';
    case 'wobble':return'摇晃';
    case 'swing':return'摇摆';
    case 'tada':return'塔达';
    case 'pulse':return'脉冲';
    case 'glow':return'发光';
    case 'shadow':return'阴影';
    default:return'未知';
  }
}
function getMorphDescription2(type){
  switch(type){
    case 'elastic':return'弹性伸缩效果，像弹簧一样';
    case 'bounce':return'弹跳效果，像球一样弹起';
    case 'rubber':return'橡皮筋效果，拉伸后回弹';
    case 'jelly':return'果冻效果，柔软晃动';
    case 'wobble':return'摇晃效果，左右摇摆';
    case 'swing':return'摇摆效果，像秋千一样';
    case 'tada':return'塔达效果，庆祝动画';
    case 'pulse':return'脉冲效果，呼吸般缩放';
    case 'glow':return'发光效果，光芒四射';
    case 'shadow':return'阴影效果，影子跟随';
    default:return'未知效果';
  }
}
function getMorphCSS2(type){
  switch(type){
    case 'elastic':return'elastic 1s infinite';
    case 'bounce':return'bounce 1s infinite';
    case 'rubber':return'rubber 1s infinite';
    case 'jelly':return'jelly 2s infinite';
    case 'wobble':return'wobble 1s infinite';
    case 'swing':return'swing 1s infinite';
    case 'tada':return'tada 1s infinite';
    case 'pulse':return'pulse 1s infinite';
    case 'glow':return'glow 1.5s infinite';
    case 'shadow':return'shadow 2s infinite';
    default:return'none';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showMorph2();
}
showMorph2();
</script>
<style>
@keyframes elastic{0%,100%{transform:scale(1)}25%{transform:scale(1.25,0.75)}50%{transform:scale(0.75,1.25)}75%{transform:scale(1.15,0.85)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
@keyframes rubber{0%,100%{transform:scale(1)}30%{transform:scale(1.25,0.75)}40%{transform:scale(0.75,1.25)}50%{transform:scale(1.15,0.85)}65%{transform:scale(0.95,1.05)}75%{transform:scale(1.05,0.95)}}
@keyframes jelly{0%,100%{transform:scale(1,1)}25%{transform:scale(0.9,1.1)}50%{transform:scale(1.1,0.9)}75%{transform:scale(0.95,1.05)}}
@keyframes wobble{0%,100%{transform:translateX(0)}15%{transform:translateX(-25px) rotate(-5deg)}30%{transform:translateX(20px) rotate(3deg)}45%{transform:translateX(-15px) rotate(-3deg)}60%{transform:translateX(10px) rotate(2deg)}75%{transform:translateX(-5px) rotate(-1deg)}}
@keyframes swing{20%{transform:rotate(15deg)}40%{transform:rotate(-10deg)}60%{transform:rotate(5deg)}80%{transform:rotate(-5deg)}100%{transform:rotate(0deg)}}
@keyframes tada{0%,100%{transform:scale(1) rotate(0deg)}10%,20%{transform:scale(0.9) rotate(-3deg)}30%,50%,70%,90%{transform:scale(1.1) rotate(3deg)}40%,60%,80%{transform:scale(1.1) rotate(-3deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes glow{0%,100%{text-shadow:0 0 10px var(--blue)}50%{text-shadow:0 0 30px var(--blue),0 0 50px var(--blue)}}
@keyframes shadow{0%,100%{text-shadow:2px 2px 4px rgba(0,0,0,0.5)}50%{text-shadow:5px 5px 10px rgba(0,0,0,0.8)}}
</style></body></html>
