<html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字进化39 - 交通工具类</title><meta name="description" content="汉字进化39 - 交通工具类汉字进化过程"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px;margin-right:8px}.btn:hover{opacity:.85}.evolution-timeline{display:flex;flex-direction:column;gap:16px;padding:20px 0}.evolution-stage{display:flex;align-items:center;gap:16px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;position:relative}.evolution-char{font-size:2.5rem;font-weight:700;color:var(--blue);min-width:60px;text-align:center}.evolution-info{flex:1}.evolution-era{font-size:.85rem;color:var(--text2);margin-bottom:4px}.evolution-name{font-size:.95rem;font-weight:600;margin-bottom:2px}.evolution-desc{font-size:.85rem;color:var(--text2)}.evolution-line{position:absolute;bottom:-10px;left:30px;width:2px;height:16px;background:var(--border)}</style><meta property="og:title" content="汉字进化39 - 交通工具类"><meta property="og:description" content="汉字进化39 - 交通工具类汉字进化过程"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🧬 汉字进化39 - 交通工具类</h1><p class="sub">在线查看交通工具类汉字进化过程</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="showEvolution()">
</div>
<button class="btn" onclick="showEvolution()">查看进化</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var evolutionData={
  '车':{stages:[{era:'甲骨文',char:'🚗',name:'象形字',desc:'像车子的形状，有两个轮子'},{era:'金文',char:'🚗',name:'象形字',desc:'继续描绘车子的形态'},{era:'小篆',char:'車',name:'象形字',desc:'演变为繁体字'},{era:'隶书',char:'车',name:'象形字',desc:'简化为车字'},{era:'楷书',char:'车',name:'标准字',desc:'现代标准写法'}]},
  '舟':{stages:[{era:'甲骨文',char:'🚣',name:'象形字',desc:'像小船的形状'},{era:'金文',char:'🚣',name:'象形字',desc:'继续描绘小船'},{era:'小篆',char:'舟',name:'象形字',desc:'字形趋于规整'},{era:'隶书',char:'舟',name:'方块字',desc:'笔画变得平直'},{era:'楷书',char:'舟',name:'标准字',desc:'现代标准写法'}]},
  '船':{stages:[{era:'甲骨文',char:'⛵',name:'形声字',desc:'从舟㕣声'},{era:'金文',char:'⛵',name:'形声字',desc:'继续描绘船只'},{era:'小篆',char:'船',name:'形声字',desc:'字形趋于规整'},{era:'隶书',char:'船',name:'形声字',desc:'笔画变得平直'},{era:'楷书',char:'船',name:'标准字',desc:'现代标准写法'}]},
  '马':{stages:[{era:'甲骨文',char:'🐴',name:'象形字',desc:'像马的形状，有头、身、尾'},{era:'金文',char:'🐴',name:'象形字',desc:'继续描绘马的形态'},{era:'小篆',char:'馬',name:'象形字',desc:'演变为繁体字'},{era:'隶书',char:'马',name:'象形字',desc:'简化为马字'},{era:'楷书',char:'马',name:'标准字',desc:'现代标准写法'}]},
  '轿':{stages:[{era:'甲骨文',char:'🧑‍🦯',name:'形声字',desc:'从车乔声'},{era:'金文',char:'🧑‍🦯',name:'形声字',desc:'继续描绘轿子'},{era:'小篆',char:'轎',name:'形声字',desc:'演变为繁体字'},{era:'隶书',char:'轿',name:'形声字',desc:'简化为轿字'},{era:'楷书',char:'轿',name:'标准字',desc:'现代标准写法'}]},
  '桥':{stages:[{era:'甲骨文',char:'🌉',name:'形声字',desc:'从木乔声'},{era:'金文',char:'🌉',name:'形声字',desc:'继续描绘桥梁'},{era:'小篆',char:'橋',name:'形声字',desc:'演变为繁体字'},{era:'隶书',char:'桥',name:'形声字',desc:'简化为桥字'},{era:'楷书',char:'桥',name:'标准字',desc:'现代标准写法'}]},
  '路':{stages:[{era:'甲骨文',char:'🛤',name:'会意字',desc:'从足从各，表示人行走的通道'},{era:'金文',char:'🛤',name:'会意字',desc:'继续描绘道路'},{era:'小篆',char:'路',name:'会意字',desc:'字形趋于规整'},{era:'隶书',char:'路',name:'会意字',desc:'笔画变得平直'},{era:'楷书',char:'路',name:'标准字',desc:'现代标准写法'}]},
  '站':{stages:[{era:'甲骨文',char:'🏢',name:'会意字',desc:'从立从占，表示停留的地方'},{era:'金文',char:'🏢',name:'会意字',desc:'继续描绘站点'},{era:'小篆',char:'站',name:'会意字',desc:'字形趋于规整'},{era:'隶书',char:'站',name:'会意字',desc:'笔画变得平直'},{era:'楷书',char:'站',name:'标准字',desc:'现代标准写法'}]},
  '骑':{stages:[{era:'甲骨文',char:'🐎',name:'形声字',desc:'从马奇声'},{era:'金文',char:'🐎',name:'形声字',desc:'继续描绘骑马'},{era:'小篆',char:'騎',name:'形声字',desc:'演变为繁体字'},{era:'隶书',char:'骑',name:'形声字',desc:'简化为骑字'},{era:'楷书',char:'骑',name:'标准字',desc:'现代标准写法'}]},
  '航':{stages:[{era:'甲骨文',char:'✈️',name:'形声字',desc:'从舟亢声'},{era:'金文',char:'✈️',name:'形声字',desc:'继续描绘航行'},{era:'小篆',char:'航',name:'形声字',desc:'字形趋于规整'},{era:'隶书',char:'航',name:'形声字',desc:'笔画变得平直'},{era:'楷书',char:'航',name:'标准字',desc:'现代标准写法'}]}
};
function showEvolution(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=evolutionData[char];
  if(!data){
    data={stages:[{era:'古代',char:char,name:'汉字',desc:'暂无详细进化信息'},{era:'现代',char:char,name:'标准字',desc:'现代标准写法'}]};
  }
  var html='<div class="card">';
  html+='<div style="text-align:center;margin-bottom:20px">';
  html+='<div style="font-size:4rem;font-weight:700;color:var(--blue)">'+char+'</div>';
  html+='<div style="font-size:1.1rem;color:var(--text2);margin-top:8px">交通工具类汉字进化历程</div>';
  html+='</div>';
  html+='<div class="evolution-timeline">';
  data.stages.forEach(function(stage,index){
    html+='<div class="evolution-stage">';
    html+='<div class="evolution-char">'+stage.char+'</div>';
    html+='<div class="evolution-info">';
    html+='<div class="evolution-era">'+stage.era+'</div>';
    html+='<div class="evolution-name">'+stage.name+'</div>';
    html+='<div class="evolution-desc">'+stage.desc+'</div>';
    html+='</div>';
    if(index<data.stages.length-1){html+='<div class="evolution-line"></div>';}
    html+='</div>';
  });
  html+='</div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(evolutionData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showEvolution();
}
showEvolution();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
