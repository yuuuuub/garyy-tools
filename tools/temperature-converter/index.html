<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>温度转换器</title><meta name="description" content="温度转换器 - 在线温度单位转换工具"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.temp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}.temp-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}.temp-value{font-size:1.5rem;font-weight:700;color:var(--blue);margin:8px 0}.temp-label{font-size:.85rem;color:var(--text2)}
/* === Smooth Animations === */
@keyframes animFadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes animScaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
body, .container, main, .container-fluid, .wrapper {
  animation: animFadeIn .45s ease-out both;
}
.weather-card, .word-card, .result-card, .output-card, .info-card,
.card, [class*="card"], [class*="panel"], [class*="result"], [class*="output"],
[class*="detail"], [class*="item"], [class*="section"]:not(header):not(nav),
[class*="box"]:not(.search-box) {
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.weather-card:hover, .word-card:hover, .result-card:hover, .output-card:hover,
.info-card:hover, .card:hover, [class*="card"]:hover, [class*="panel"]:hover,
[class*="result"]:hover, [class*="output"]:hover, [class*="detail"]:hover,
[class*="item"]:hover, [class*="box"]:not(.search-box):hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(0,0,0,.12);
}
button, input[type="submit"], .btn, [class*="btn"], .search-box button,
.filter-btn, .refresh-btn, .retry-btn {
  transition: transform .12s ease, opacity .2s ease, background .2s ease, box-shadow .2s ease;
}
button:active, input[type="submit"]:active, .btn:active, [class*="btn"]:active,
.search-box button:active, .filter-btn:active, .refresh-btn:active, .retry-btn:active {
  transform: scale(.96);
  opacity: .88;
}
button:hover, .btn:hover, [class*="btn"]:hover {
  box-shadow: 0 2px 8px rgba(59,130,246,.18);
}
html { scroll-behavior: smooth; }
.coin-item { transition: transform .2s ease, box-shadow .2s ease; }
.coin-item:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.city-item { transition: transform .2s ease, background .2s ease, border-color .2s ease; }
.city-item:hover { transform: translateX(4px); }
input[type="text"], input[type="number"], textarea, select {
  transition: border-color .2s ease, box-shadow .2s ease;
}
input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}
/* end animations */

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="温度转换器"><meta property="og:description" content="温度转换器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🌡️ 温度转换器</h1><p class="sub">在线温度单位转换工具</p>
<div class="card">
<div class="input-group">
<label>输入温度值</label>
<input type="number" id="tempInput" value="100" oninput="convertTemp()">
</div>
<div class="input-group">
<label>选择单位</label>
<select id="tempUnit" onchange="convertTemp()">
<option value="c">摄氏度 (°C)</option>
<option value="f">华氏度 (°F)</option>
<option value="k">开尔文 (K)</option>
</select>
</div>
<button class="btn" onclick="convertTemp()">转换</button>
</div>
<div class="temp-grid" id="tempGrid"></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function convertTemp(){
  var value=parseFloat(document.getElementById('tempInput').value);
  var unit=document.getElementById('tempUnit').value;
  var r=document.getElementById('tempGrid');
  if(isNaN(value)){r.innerHTML='';return;}
  var celsius,fahrenheit,kelvin;
  switch(unit){
    case 'c':celsius=value;fahrenheit=value*9/5+32;kelvin=value+273.15;break;
    case 'f':celsius=(value-32)*5/9;fahrenheit=value;kelvin=(value-32)*5/9+273.15;break;
    case 'k':celsius=value-273.15;fahrenheit=(value-273.15)*9/5+32;kelvin=value;break;
  }
  var html='<div class="temp-card"><div class="temp-label">摄氏度</div><div class="temp-value">'+celsius.toFixed(2)+'°C</div></div>';
  html+='<div class="temp-card"><div class="temp-label">华氏度</div><div class="temp-value">'+fahrenheit.toFixed(2)+'°F</div></div>';
  html+='<div class="temp-card"><div class="temp-label">开尔文</div><div class="temp-value">'+kelvin.toFixed(2)+' K</div></div>';
  r.innerHTML=html;
  var html2='<div class="card"><div class="section"><h3>📋 转换详情</h3><div class="result-block">';
  html2+='摄氏度: '+celsius.toFixed(2)+'°C\n';
  html2+='华氏度: '+fahrenheit.toFixed(2)+'°F\n';
  html2+='开尔文: '+kelvin.toFixed(2)+' K\n';
  html2+='兰氏度: '+((celsius*9/5+491.67)*5/9).toFixed(2)+' °R\n';
  html2+='列氏度: '+(celsius*4/5).toFixed(2)+' °Ré\n';
  html2+='</div></div></div>';
  document.getElementById('result').innerHTML=html2;
}
convertTemp();
</script></body></html>
