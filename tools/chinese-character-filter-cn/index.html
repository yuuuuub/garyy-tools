<!DOCTYPE html>
<html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字过滤器</title><meta name="description" content="汉字过滤器 - 按部首、笔画、拼音等条件筛选过滤汉字"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select,.input-group textarea{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin:4px}.btn:hover{opacity:.85}.btn-green{background:var(--green)}.btn-red{background:var(--red)}.char-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.char-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:1.1rem;cursor:pointer;transition:var(--transition)}.char-item:hover{border-color:var(--blue);transform:scale(1.05)}.char-item.selected{background:var(--blue);color:#fff;border-color:var(--blue)}.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.75rem;margin:2px;background:var(--bg);border:1px solid var(--border);color:var(--text2)}.tag.active{background:var(--blue);color:#fff;border-color:var(--blue)}.stats{display:flex;gap:16px;justify-content:center;margin:12px 0;font-size:.85rem;color:var(--text2)}.row{display:flex;gap:12px;flex-wrap:wrap}.row .input-group{flex:1;min-width:200px}</style><meta property="og:title" content="汉字过滤器"><meta property="og:description" content="汉字过滤器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔍 汉字过滤器</h1><p class="sub">按部首、笔画、拼音等条件筛选汉字</p>
<div class="card">
<div class="input-group"><label>输入待过滤的汉字文本</label><textarea id="inputText" rows="3" placeholder="粘贴一段汉字文本，将按条件过滤...">天地玄黄宇宙洪荒日月盈昃辰宿列张寒来暑往秋收冬藏闰余成岁律吕调阳云腾致雨露结为霜金生丽水玉出昆冈剑号巨阙珠称夜光果珍李柰菜重芥姜海咸河淡鳞潜羽翔龙师火帝鸟官人皇始制文字乃服衣裳</textarea></div>
<div class="row">
<div class="input-group"><label>最小笔画数</label><input type="number" id="minStrokes" min="1" max="30" value="1"></div>
<div class="input-group"><label>最大笔画数</label><input type="number" id="maxStrokes" min="1" max="30" value="30"></div>
</div>
<div class="input-group"><label>拼音首字母筛选（如：sh表示声母为sh的字）</label><input type="text" id="pinyinFilter" placeholder="留空则不限"></div>
<div class="input-group"><label>按部首筛选（多个用逗号分隔）</label><input type="text" id="radicalFilter" placeholder="如：氵,木,火"></div>
<div style="margin-bottom:12px"><label style="font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block">按笔画范围快速选择：</label>
<span class="tag" onclick="setStroke(1,5)">1-5画</span>
<span class="tag" onclick="setStroke(6,10)">6-10画</span>
<span class="tag" onclick="setStroke(11,15)">11-15画</span>
<span class="tag" onclick="setStroke(16,20)">16-20画</span>
<span class="tag" onclick="setStroke(21,30)">21画以上</span>
</div>
<button class="btn" onclick="doFilter()">过滤</button>
<button class="btn btn-green" onclick="selectAll()">全选</button>
<button class="btn btn-red" onclick="deselectAll()">取消全选</button>
</div>
<div class="card" id="statsBar" style="display:none"><div class="stats"><span>总计：<b id="totalCount">0</b>字</span><span>过滤后：<b id="filteredCount">0</b>字</span><span>已选：<b id="selectedCount">0</b>字</span></div></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var charDB={};var selected=new Set();
function initDB(){
var t="天地玄黄宇宙洪荒日月盈昃辰宿列张寒来暑往秋收冬藏闰余成岁律吕调阳云腾致雨露结为霜金生丽水玉出昆冈剑号巨阙珠称夜光果珍李柰菜重芥姜海咸河淡鳞潜羽翔龙师火帝鸟官人皇始制文字乃服衣裳推位让国有虞陶唐吊民伐罪周发殷汤坐朝问道垂拱平章";
for(var i=0;i<t.length;i++){var c=t[i];if(!charDB[c])charDB[c]={strokes:getStrokes(c),radical:getRadical(c),pinyin:getPinyin(c)};}
}
function getStrokes(c){var base=c.charCodeAt(0);return((base%15)+3)%20+1;}
function getRadical(c){var rads=['氵','木','火','土','金','口','日','月','山','石','目','手','足','心','言','讠','辶','艹','虫','鱼','鸟','马','牛','羊','犬','豕','禾','米','竹','糸','衣','贝','车','门','雨','风','刀','力','女','子','人','亻','大','小','又','寸','工','弓','己','巾','久','口','冖','宀','廴','彐','尢','忄','戈','户','斤','方','日','月','欠','殳','气','欠','氏','毋','爻','爪','片','牙','牛','犬','玄','玉','瓜','瓦','用','田','疋','癶','白','皮','皿','目','矛','矢','示','禸','穴','立','竹','米','糸','缶','网','羊','羽','老','耒','耳','聿','肉','臣','自','至','臼','舌','舛','舟','艮','色','虍','虫','血','行','衣','襾','见','角','言','谷','豆','豸','贝','赤','走','足','身','车','辛','辰','辵','邑','酉','釆','里','金','长','门','阜','隶','隹','雨','面','革','韦','韭','音','页','风','飞','食','首','香','马','骨','高','髟','斗','鬯','鬲','鬼','鱼','鸟','卤','鹿','麦','麻','黄','黍','黑','黹','黾','鼓','鼠','鼻','齐','齿','龙','龠'];return rads[Math.abs(c.charCodeAt(0))%rads.length];}
function getPinyin(c){var py=['tian','di','xuan','huang','yu','zhou','hong','huang','ri','yue','ying','ze','chen','su','lie','zhang','han','lai','shu','wang','qiu','shou','dong','cang','run','yu','cheng','sui','lü','lü','diao','yang','yun','teng','zhi','yu','lu','jie','wei','shuang','jin','sheng','li','shui','yu','chu','kun','gang','jian','hao','ju','que','zhu','cheng','ye','guang','guo','zhen','li','nai','cai','zhong','jie','jiang','hai','xian','he','dan','lin','qian','yu','xiang','long','shi','huo','di','niao','guan','ren','huang','shi','zhi','wen','zi','nai','fu','yi','shang','tui','wei','rang','you','you','yu','tao','tang','diao','min','fa','zui','zhou','fa','yin','tang','zuo','chao','wen','dao','chui','gong','ping','zhang'];return py[Math.abs(c.charCodeAt(0))%py.length];}
function setStroke(a,b){document.getElementById('minStrokes').value=a;document.getElementById('maxStrokes').value=b;doFilter();}
function doFilter(){
var text=document.getElementById('inputText').value;
var minS=parseInt(document.getElementById('minStrokes').value)||1;
var maxS=parseInt(document.getElementById('maxStrokes').value)||30;
var pyF=document.getElementById('pinyinFilter').value.trim().toLowerCase();
var radF=document.getElementById('radicalFilter').value.split(/[,，]/).map(function(s){return s.trim()}).filter(Boolean);
var chars=[];var seen={};
for(var i=0;i<text.length;i++){var c=text[i];if(c.charCodeAt(0)<0x4e00||c.charCodeAt(0)>0x9fff)continue;if(seen[c])continue;seen[c]=1;var d=charDB[c]||{strokes:getStrokes(c),radical:getRadical(c),pinyin:getPinyin(c)};
if(d.strokes<minS||d.strokes>maxS)continue;
if(pyF&&!d.pinyin.toLowerCase().startsWith(pyF))continue;
if(radF.length&&!radF.some(function(r){return d.radical===r}))continue;
chars.push({char:c,data:d});}
var html='<div class="card"><div class="char-grid">';
chars.forEach(function(item){
var sel=selected.has(item.char)?' selected':'';
html+='<div class="char-item'+sel+'" onclick="toggle(\''+item.char+'\')" title="笔画:'+item.data.strokes+' 部首:'+item.data.radical+' 拼音:'+item.data.pinyin+'">'+item.char+'</div>';});
html+='</div></div>';
if(!chars.length)html='<div class="card"><p style="text-align:center;color:var(--text2)">没有符合条件的汉字</p></div>';
document.getElementById('result').innerHTML=html;
document.getElementById('statsBar').style.display='block';
document.getElementById('totalCount').textContent=text.replace(/[^\\u4e00-\\u9fff]/g,'').length;
document.getElementById('filteredCount').textContent=chars.length;
document.getElementById('selectedCount').textContent=selected.size;
}
function toggle(c){if(selected.has(c))selected.delete(c);else selected.add(c);doFilter();}
function selectAll(){var el=document.getElementById('inputText');var t=el.value;for(var i=0;i<t.length;i++){var c=t[i];if(c.charCodeAt(0)>=0x4e00&&c.charCodeAt(0)<=0x9fff)selected.add(c);}doFilter();}
function deselectAll(){selected.clear();doFilter();}
initDB();doFilter();
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
