<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL 格式化工具 | SQL Formatter</title>
<meta property="og:title" content="SQL 格式化工具 | SQL Formatter">
<meta property="og:description" content="SQL 格式化工具 | SQL Formatter - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="SQL格式化工具，一键美化和压缩SQL代码，支持语法高亮">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗃️</text></svg>">
<script src="i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5padding:16px;scroll-behavior:smooth;}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.container{max-width:1600px;margin:0 auto;padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:calc(100vh - 140px)}
@media(max-width:900px){.container{grid-template-columns:1fr}}
.panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:500;color:var(--text-secondary);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
textarea{width:100%;flex:1;min-height:400px;padding:16px;background:var(--bg);color:var(--text);border:none;resize:none;font-family:'Fira Code',Consolas,Monaco,monospace;font-size:.85rem;line-height:1.6;outline:none}
textarea::placeholder{color:var(--text-secondary)}
.output{width:100%;flex:1;min-height:400px;padding:16px;background:var(--bg);color:var(--text);border:none;resize:none;font-family:'Fira Code',Consolas,Monaco,monospace;font-size:.85rem;line-height:1.6;outline:none;white-space:pre-wrap;word-break:break-all}
.output:read-only{cursor:default}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg-secondary)}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 20px;border-radius:var(--radius-sm);background:var(--green);color:#fff;font-size:.85rem;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.indent-select{padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);font-size:.75rem}
.kw{color:var(--purple);font-weight:600}
.fn{color:var(--cyan)}
.str{color:var(--green)}
.num{color:var(--blue)}
.cmt{color:var(--text-secondary);font-style:italic}
.hl-output{width:100%;flex:1;min-height:400px;padding:16px;background:var(--bg);border:none;border-radius:0;overflow:auto;font-family:'Fira Code',Consolas,Monaco,monospace;font-size:.85rem;line-height:1.6;white-space:pre-wrap;word-break:break-all}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);outline:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header class="app-header">
<div>
<h1>🗃️ SQL 格式化工具</h1>
<span class="subtitle">一键美化和压缩SQL代码</span>
</div>
<div class="btn-group">
<button class="btn" onclick="loadSample()">示例SQL</button>
<button class="btn" onclick="clearAll()">清空</button>
</div>
</header>
<div class="container">
<div class="panel">
<div class="panel-header">
<span>📥 输入 SQL</span>
</div>
<textarea id="input" placeholder="粘贴SQL代码..."></textarea>
</div>
<div class="panel">
<div class="panel-header">
<span>📤 格式化输出</span>
<div class="btn-group">
<button class="btn" onclick="copyOutput()">📋 复制</button>
</div>
</div>
<div class="hl-output" id="output"><span style="color:var(--text-secondary)">格式化后的SQL将在这里显示...</span></div>
</div>
</div>
<div class="toolbar">
<button class="btn" onclick="formatSQL()" style="border-color:var(--accent);color:var(--accent)">✨ 格式化</button>
<button class="btn" onclick="minifySQL()">📦 压缩</button>
<button class="btn" onclick="copyOutput()">📋 复制结果</button>
<span style="font-size:.8rem;color:var(--text-secondary);margin-left:8px">缩进：</span>
<select id="indentSize" class="indent-select" onchange="formatSQL()">
<option value="2">2 空格</option>
<option value="4" selected>4 空格</option>
<option value="tab">Tab</option>
</select>
</div>
<div class="toast" id="toast">已复制到剪贴板</div>

<script>
const input=document.getElementById('input'),outputEl=document.getElementById('output'),indentSel=document.getElementById('indentSize');

const KW=['SELECT','FROM','WHERE','AND','OR','NOT','IN','BETWEEN','LIKE','IS','NULL','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','ALTER','DROP','INDEX','JOIN','INNER','LEFT','RIGHT','FULL','OUTER','ON','GROUP','BY','ORDER','ASC','DESC','HAVING','LIMIT','OFFSET','UNION','ALL','DISTINCT','AS','CASE','WHEN','THEN','ELSE','END','EXISTS','COUNT','SUM','AVG','MAX','MIN','IF','PRIMARY','KEY','FOREIGN','REFERENCES','CONSTRAINT','DEFAULT','AUTO_INCREMENT','INT','INTEGER','VARCHAR','TEXT','BOOLEAN','DATE','DATETIME','TIMESTAMP','FLOAT','DOUBLE','DECIMAL','CHAR','BLOB','WITH','RECURSIVE','OVER','PARTITION','ROW_NUMBER','RANK','DENSE_RANK','FETCH','NEXT','ROWS','ONLY','TOP','PERCENT','REPLACE','GRANT','REVOKE','COMMIT','ROLLBACK','BEGIN','TRANSACTION','SAVEPOINT','TRUNCATE','EXPLAIN','ANALYZE','USING','NATURAL','CROSS','FULL OUTER'];

function getIndent(){
const v=indentSel.value;
return v==='tab'?'  ':v==='2'?'  ':'    ';
}

function escapeHtml(s){
return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightSQL(sql){
let s=escapeHtml(sql);
s=s.replace(/(--[^\n]*)/g,'<span class="cmt">$1</span>');
s=s.replace(/(\/\*[\s\S]*?\*\/)/g,'<span class="cmt">$1</span>');
s=s.replace(/('(?:[^'\\]|\\.)*')/g,'<span class="str">$1</span>');
s=s.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="num">$1</span>');
KW.forEach(kw=>{
const re=new RegExp('\\b('+kw+')\\b','gi');
s=s.replace(re,'<span class="kw">$1</span>');
});
return s;
}

function formatSQL(){
const sql=input.value.trim();
if(!sql){outputEl.innerHTML='<span style="color:var(--text-secondary)">格式化后的SQL将在这里显示...</span>';return}
const ind=getIndent();
let result='';
let depth=0;
let i=0;
const tokens=tokenize(sql);

const breakBefore=['SELECT','FROM','WHERE','AND','OR','JOIN','INNER JOIN','LEFT JOIN','RIGHT JOIN','FULL JOIN','FULL OUTER JOIN','LEFT OUTER JOIN','RIGHT OUTER JOIN','CROSS JOIN','NATURAL JOIN','ON','GROUP BY','ORDER BY','HAVING','LIMIT','OFFSET','UNION','UNION ALL','INSERT INTO','VALUES','UPDATE','SET','DELETE FROM','CREATE TABLE','ALTER TABLE','DROP TABLE','WITH','EXPLAIN'];
const breakAfter=['SELECT','FROM','WHERE','SET','VALUES','INTO','ON'];
const dedentBefore=['END','ELSE','WHEN'];
const indentAfter=['THEN','ELSE','WHEN'];

tokens.forEach((token,idx)=>{
const upToken=token.trim().toUpperCase();

if(dedentBefore.some(k=>upToken===k||upToken.startsWith(k+' '))){depth=Math.max(0,depth-1)}

if(idx>0&&breakBefore.some(k=>upToken===k||upToken.startsWith(k+' '))){
result+='\n'+ind.repeat(depth);
}

result+=token+' ';

if(breakAfter.includes(upToken)){result+='\n'+ind.repeat(depth);depth++}

if(indentAfter.includes(upToken)&&idx>0){
const prevUp=tokens[idx-1]?tokens[idx-1].trim().toUpperCase():'';
if(prevUp==='CASE'||prevUp==='WHEN'||prevUp==='ELSE'){}
}
if(upToken==='CASE'){depth++}
if(upToken==='END'){depth=Math.max(0,depth-1)}
});

result=result.replace(/ +/g,' ').replace(/\n\s*\n/g,'\n').trim();
outputEl.innerHTML=highlightSQL(result);
window._formattedSQL=result;
}

function tokenize(sql){
const tokens=[];let current='';let inStr=false;let inComment=false;let inLineComment=false;
for(let i=0;i<sql.length;i++){
const c=sql[i];
if(inLineComment){current+=c;if(c==='\n'){tokens.push(current);current='';inLineComment=false}continue}
if(inComment){current+=c;if(c==='*'&&sql[i+1]==='/'){current+='/';tokens.push(current);current='';inComment=false;i++;}continue}
if(inStr){current+=c;if(c==="'"&&(i+1>=sql.length||sql[i+1]!=='"')&&(i===0||sql[i-1]!=='\\')){tokens.push(current);current='';inStr=false}continue}
if(c==="'"){if(current.trim())tokens.push(current);current='';inStr=true;continue}
if(c==='-'&&sql[i+1]==='-'){if(current.trim())tokens.push(current);current='';inLineComment=true;current='--';i++;continue}
if(c==='/'&&sql[i+1]==='*'){if(current.trim())tokens.push(current);current='';inComment=true;current='/*';i++;continue}
if(c===''||c==='\n'||c==='\t'||c==='\r'){if(current.trim())tokens.push(current);current='';continue}
if(c===','||c==='('||c===')'||c===';'||c==='='||c==='<'||c==='>'||c==='+'||c==='-'||c==='*'||c==='/'||c==='%'||c==='!'){
if(current.trim())tokens.push(current);current='';tokens.push(c);continue}
current+=c;
}
if(current.trim())tokens.push(current);
return tokens;
}

function minifySQL(){
const sql=input.value.trim();
if(!sql)return;
const minified=sql.replace(/\s+/g,' ').replace(/\s*([(),;=<>])\s*/g,'$1').trim();
outputEl.innerHTML=highlightSQL(minified);
window._formattedSQL=minified;
}

function copyOutput(){
const text=window._formattedSQL||outputEl.textContent;
if(text&&text!=='格式化后的SQL将在这里显示...'){
navigator.clipboard.writeText(text).then(()=>{showToast()});
}
}

function showToast(){document.getElementById('toast').classList.add('show');setTimeout(()=>document.getElementById('toast').classList.remove('show'),1500)}

function clearAll(){input.value='';outputEl.innerHTML='<span style="color:var(--text-secondary)">格式化后的SQL将在这里显示...</span>';window._formattedSQL=''}

function loadSample(){
input.value=`SELECT u.id, u.name, u.email, COUNT(o.id) as order_count, SUM(o.total) as total_spent FROM users u LEFT JOIN orders o ON u.id = o.user_id WHERE u.created_at >= '2024-01-01' AND u.status = 'active' GROUP BY u.id, u.name, u.email HAVING COUNT(o.id) > 5 ORDER BY total_spent DESC LIMIT 100;`;
formatSQL();
}

input.addEventListener('input',formatSQL);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
