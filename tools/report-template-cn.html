<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="报告模板工具 - 快速生成专业报告模板">
    <meta name="robots" content="index, follow">
    <title>报告模板工具</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #64748b; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #94a3b8; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="date"], textarea, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        textarea { resize: vertical; min-height: 80px; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 8px; }
        button:hover { opacity: 0.9; }
        .btn-sm { padding: 4px 10px; font-size: 13px; }
        .btn-success { background-color: var(--success-color); }
        .btn-danger { background-color: var(--danger-color); }
        .btn-outline { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .template-card { padding: 16px; border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; text-align: center; }
        .template-card:hover, .template-card.active { border-color: var(--primary-color); background: var(--card-bg); }
        .template-card .icon { font-size: 32px; margin-bottom: 8px; }
        .report-preview { background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 40px; max-width: 800px; margin: 0 auto; color: #333; font-size: 14px; line-height: 1.8; }
        .report-preview .report-header { text-align: center; border-bottom: 3px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
        .report-preview .report-header h2 { margin: 0; font-size: 24px; }
        .report-preview .report-header .meta { color: #666; font-size: 13px; margin-top: 8px; }
        .report-preview h3 { font-size: 18px; border-left: 4px solid #333; padding-left: 12px; margin: 24px 0 12px; }
        .report-preview .section { margin-bottom: 20px; }
        .report-preview table { width: 100%; border-collapse: collapse; margin: 12px 0; }
        .report-preview table th { background: #f0f0f0; padding: 8px 12px; border: 1px solid #ddd; text-align: left; font-size: 13px; }
        .report-preview table td { padding: 8px 12px; border: 1px solid #ddd; font-size: 13px; }
        .report-preview .kpi-row { display: flex; gap: 16px; margin: 16px 0; }
        .report-preview .kpi-box { flex: 1; text-align: center; padding: 16px; background: #f8f9fa; border-radius: 8px; border: 1px solid #eee; }
        .report-preview .kpi-box .value { font-size: 28px; font-weight: bold; color: #333; }
        .report-preview .kpi-box .label { font-size: 12px; color: #666; }
        .report-preview .placeholder { background: #f0f0f0; border: 2px dashed #ccc; padding: 40px; text-align: center; border-radius: 8px; color: #999; }
        .report-preview .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; text-align: center; font-size: 12px; color: #999; }
        .section-editor { border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; margin-bottom: 10px; background: var(--bg-color); }
        .section-editor h4 { margin: 0 0 8px 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .code-output { white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 12px; background: var(--bg-color); padding: 16px; border-radius: 6px; border: 1px solid var(--border-color); max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>报告模板工具</h1>

        <div class="card">
            <h3>选择模板</h3>
            <div class="grid-2" style="grid-template-columns:repeat(4,1fr);">
                <div class="template-card active" onclick="setTemplate('business',this)"><div class="icon">📊</div><div>商业报告</div></div>
                <div class="template-card" onclick="setTemplate('weekly',this)"><div class="icon">📋</div><div>周报</div></div>
                <div class="template-card" onclick="setTemplate('project',this)"><div class="icon">📁</div><div>项目报告</div></div>
                <div class="template-card" onclick="setTemplate('research',this)"><div class="icon">🔬</div><div>研究报告</div></div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>报告信息</h3>
                <div class="form-group"><label>报告标题</label><input type="text" id="reportTitle" value="2024年度业务分析报告" oninput="renderPreview()"></div>
                <div class="grid-2">
                    <div class="form-group"><label>作者</label><input type="text" id="reportAuthor" value="数据分析部" oninput="renderPreview()"></div>
                    <div class="form-group"><label>日期</label><input type="date" id="reportDate" oninput="renderPreview()"></div>
                </div>
                <div class="form-group"><label>公司/组织</label><input type="text" id="reportOrg" value="XX科技有限公司" oninput="renderPreview()"></div>

                <h4 style="margin-top:16px;">章节管理</h4>
                <div id="sectionEditors"></div>
                <button class="btn-sm" onclick="addSection()">+ 添加章节</button>
            </div>

            <div class="card">
                <h3>预览</h3>
                <div class="report-preview" id="reportPreview"></div>
            </div>
        </div>

        <div class="card">
            <h3>导出 <button class="btn-sm" onclick="exportHTML()">HTML</button> <button class="btn-sm" onclick="copyText()">纯文本</button></h3>
            <div class="code-output" id="exportArea">点击上方按钮导出</div>
        </div>
    </div>

    <script defer src="i18n.js"></script>
    <script>
        let currentTemplate = 'business';
        let sections = [
            { title: '执行摘要', content: '本报告总结了2024年度公司各项业务指标表现，涵盖营收增长、用户发展、市场份额等核心数据。整体业务保持稳健增长态势，同比增长32%。', type: 'text' },
            { title: '核心指标', content: '', type: 'kpi', kpis: [
                { label: '总营收', value: '2,580万', change: '+32%' },
                { label: '活跃用户', value: '128万', change: '+45%' },
                { label: '客户满意度', value: '96.5%', change: '+2.3%' },
                { label: '市场份额', value: '18.7%', change: '+3.2%' }
            ]},
            { title: '数据分析', content: '', type: 'table', tableData: [
                ['Q1', '520万', '32万', '95.2%', '16.5%'],
                ['Q2', '680万', '38万', '96.1%', '17.2%'],
                ['Q3', '720万', '42万', '96.8%', '18.1%'],
                ['Q4', '660万', '48万', '97.2%', '18.7%']
            ], tableHeaders: ['季度', '营收', '新增用户', '满意度', '市场份额'] },
            { title: '结论与建议', content: '1. 继续加大研发投入，保持技术领先优势\n2. 优化用户体验，提升客户满意度\n3. 拓展海外市场，寻求新的增长点\n4. 加强人才储备，支撑业务快速发展', type: 'text' }
        ];

        function init() {
            document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
            renderSectionEditors(); renderPreview();
        }

        function setTemplate(type, el) {
            currentTemplate = type;
            document.querySelectorAll('.template-card').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            if (type === 'weekly') {
                sections = [
                    { title: '本周工作总结', content: '完成了用户系统的重构工作，优化了查询性能，响应时间从200ms降低到50ms。', type: 'text' },
                    { title: '关键成果', content: '', type: 'kpi', kpis: [
                        { label: '完成任务', value: '12', change: '' },
                        { label: '代码提交', value: '47', change: '' },
                        { label: 'Bug修复', value: '8', change: '' },
                        { label: '文档更新', value: '5', change: '' }
                    ]},
                    { title: '下周计划', content: '1. 完成支付模块集成\n2. 编写API文档\n3. 性能压测\n4. 代码审查', type: 'text' }
                ];
                document.getElementById('reportTitle').value = '第24周工作周报';
            } else if (type === 'project') {
                sections = [
                    { title: '项目概述', content: '项目名称：智能客服系统 v2.0\n项目周期：2024年1月-6月\n项目预算：150万元', type: 'text' },
                    { title: '进度概览', content: '', type: 'kpi', kpis: [
                        { label: '总体进度', value: '75%', change: '' },
                        { label: '已完成', value: '18/24', change: '' },
                        { label: '预算使用', value: '68%', change: '' },
                        { label: '团队规模', value: '12人', change: '' }
                    ]},
                    { title: '风险与问题', content: '1. 第三方接口响应延迟 - 已制定降级方案\n2. 人员变动风险 - 已安排知识转移', type: 'text' }
                ];
                document.getElementById('reportTitle').value = '智能客服项目进展报告';
            } else if (type === 'research') {
                sections = [
                    { title: '研究背景', content: '随着AI技术的快速发展，大语言模型在各行业的应用越来越广泛。本研究旨在分析当前市场格局和发展趋势。', type: 'text' },
                    { title: '核心发现', content: '', type: 'kpi', kpis: [
                        { label: '市场规模', value: '450亿', change: '+68%' },
                        { label: '企业采用率', value: '42%', change: '+15%' },
                        { label: '投资增长', value: '120%', change: '' },
                        { label: '专利申请', value: '8,500', change: '+45%' }
                    ]},
                    { title: '研究结论', content: '大语言模型市场正处于快速增长期，预计未来3年将保持50%以上的年复合增长率。', type: 'text' }
                ];
                document.getElementById('reportTitle').value = 'AI大语言模型市场研究报告';
            }
            renderSectionEditors(); renderPreview();
        }

        function renderSectionEditors() {
            document.getElementById('sectionEditors').innerHTML = sections.map((s, i) => `
                <div class="section-editor">
                    <h4>${s.title} <button class="btn-sm btn-danger" onclick="removeSection(${i})">×</button></h4>
                    <div class="form-group"><input type="text" value="${s.title}" onchange="sections[${i}].title=this.value;renderSectionEditors();renderPreview()"></div>
                    <div class="form-group">
                        <select onchange="sections[${i}].type=this.value;renderSectionEditors();renderPreview()">
                            <option value="text" ${s.type==='text'?'selected':''}>文本</option>
                            <option value="kpi" ${s.type==='kpi'?'selected':''}>KPI指标</option>
                            <option value="table" ${s.type==='table'?'selected':''}>数据表格</option>
                            <option value="chart" ${s.type==='chart'?'selected':''}>图表占位</option>
                        </select>
                    </div>
                    ${s.type === 'text' ? `<div class="form-group"><textarea rows="3" onchange="sections[${i}].content=this.value;renderPreview()">${s.content}</textarea></div>` : ''}
                    ${s.type === 'kpi' ? `<div class="form-group"><textarea rows="3" placeholder="格式: 标签|数值|变化 (每行一项)" onchange="parseKPIs(${i},this.value)">${(s.kpis||[]).map(k=>`${k.label}|${k.value}|${k.change}`).join('\n')}</textarea></div>` : ''}
                    ${s.type === 'table' ? `<div class="form-group"><textarea rows="3" placeholder="格式: 表头1,表头2... (第一行)\n数据1,数据2... (后续行)" onchange="parseTable(${i},this.value)">${s.tableHeaders ? s.tableHeaders.join(',') + '\n' + (s.tableData||[]).map(r=>r.join(',')).join('\n') : ''}</textarea></div>` : ''}
                </div>
            `).join('');
        }

        function addSection() {
            sections.push({ title: '新章节', content: '请输入内容...', type: 'text' });
            renderSectionEditors(); renderPreview();
        }

        function removeSection(i) {
            sections.splice(i, 1);
            renderSectionEditors(); renderPreview();
        }

        function parseKPIs(i, val) {
            sections[i].kpis = val.trim().split('\n').map(line => {
                const [label, value, change] = line.split('|').map(s => s.trim());
                return { label: label||'', value: value||'', change: change||'' };
            }).filter(k => k.label);
        }

        function parseTable(i, val) {
            const lines = val.trim().split('\n');
            if (lines.length > 0) {
                sections[i].tableHeaders = lines[0].split(',').map(s => s.trim());
                sections[i].tableData = lines.slice(1).map(l => l.split(',').map(s => s.trim()));
            }
        }

        function renderPreview() {
            const title = document.getElementById('reportTitle').value;
            const author = document.getElementById('reportAuthor').value;
            const date = document.getElementById('reportDate').value;
            const org = document.getElementById('reportOrg').value;

            let html = `<div class="report-header">
                <h2>${title}</h2>
                <div class="meta">${org} | ${author} | ${date}</div>
            </div>`;

            sections.forEach(s => {
                html += `<div class="section"><h3>${s.title}</h3>`;
                if (s.type === 'text') {
                    html += `<p>${s.content.replace(/\n/g, '<br>')}</p>`;
                } else if (s.type === 'kpi' && s.kpis) {
                    html += `<div class="kpi-row">${s.kpis.map(k => `
                        <div class="kpi-box">
                            <div class="value">${k.value}</div>
                            <div class="label">${k.label}${k.change ? ` (${k.change})` : ''}</div>
                        </div>
                    `).join('')}</div>`;
                } else if (s.type === 'table' && s.tableHeaders) {
                    html += `<table><thead><tr>${s.tableHeaders.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;
                    (s.tableData||[]).forEach(row => {
                        html += `<tr>${row.map(c => `<td>${c}</td>`).join('')}</tr>`;
                    });
                    html += '</tbody></table>';
                } else if (s.type === 'chart') {
                    html += '<div class="placeholder">📊 图表区域 - 可插入图表图片</div>';
                }
                html += '</div>';
            });

            html += `<div class="footer">本报告由报告模板工具自动生成 | ${org}</div>`;
            document.getElementById('reportPreview').innerHTML = html;
            document.getElementById('exportArea').textContent = document.getElementById('reportPreview').outerHTML;
        }

        function exportHTML() {
            const fullHtml = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>${document.getElementById('reportTitle').value}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.8; }
    h2 { text-align: center; border-bottom: 3px solid #333; padding-bottom: 16px; }
    h3 { border-left: 4px solid #333; padding-left: 12px; margin: 24px 0 12px; }
    .meta { text-align: center; color: #666; margin-bottom: 30px; }
    table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    th, td { padding: 8px 12px; border: 1px solid #ddd; text-align: left; }
    th { background: #f0f0f0; }
    .kpi-row { display: flex; gap: 16px; margin: 16px 0; }
    .kpi-box { flex: 1; text-align: center; padding: 16px; background: #f8f9fa; border-radius: 8px; border: 1px solid #eee; }
    .kpi-box .value { font-size: 28px; font-weight: bold; }
    .kpi-box .label { font-size: 12px; color: #666; }
  </style>
</head>
<body>
${document.getElementById('reportPreview').innerHTML}
</body>
</html>`;
            document.getElementById('exportArea').textContent = fullHtml;
        }

        function copyText() {
            const el = document.getElementById('reportPreview');
            const text = el.innerText;
            navigator.clipboard.writeText(text).then(() => alert('纯文本已复制'));
            document.getElementById('exportArea').textContent = text;
        }

        function toggleTheme() {
            const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
        }

        init();
    </script>
</body>
</html>
