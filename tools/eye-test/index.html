<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视力测试</title>
<meta name="description" content="视力自测工具，在线检测你的视力状况">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#60a5fa;--success:#4ade80;--warning:#fbbf24;--muted:#8b949e;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.container{width:100%;max-width:500px}
h1{font-size:1.5rem;text-align:center;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.mode-select{display:flex;gap:10px;margin-bottom:16px}
.mode-btn{flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;text-align:center;transition:.2s}
.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.e-display{display:flex;justify-content:center;align-items:center;height:200px;margin:20px 0}
.e-char{transition:transform .3s;font-weight:700;color:#fff}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:200px;margin:0 auto}
.arrow-btn{width:60px;height:60px;border:2px solid var(--border);border-radius:12px;background:transparent;color:var(--text);font-size:1.5rem;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
.arrow-btn:hover{border-color:var(--accent);background:rgba(59,130,246,.1)}
.arrow-btn:active{background:var(--accent);color:#fff}
.arrow-btn.center{visibility:hidden}
.arrow-btn.up{grid-column:2}
.arrow-btn.left{grid-column:1;grid-row:2}
.arrow-btn.right{grid-column:3;grid-row:2}
.arrow-btn.down{grid-column:2;grid-row:3}
.stats{display:flex;justify-content:space-around;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.stat-item{text-align:center}
.stat-value{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--muted);margin-top:4px}
.progress{display:flex;gap:4px;margin-bottom:16px}
.dot{width:24px;height:6px;border-radius:3px;background:var(--border);transition:.3s}
.dot.correct{background:var(--success)}.dot.wrong{background:var(--danger)}
.result{text-align:center;padding:20px}
.result-score{font-size:3rem;font-weight:700;margin:12px 0}
.result-text{color:var(--muted);line-height:1.8}
.btn{padding:10px 24px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div class="container">
<h1>👁️ 视力测试</h1>

<div class="card" id="startCard">
<div class="mode-select">
<div class="mode-btn active" onclick="selectMode(this,0)">标准模式</div>
<div class="mode-btn" onclick="selectMode(this,1)">快速模式</div>
</div>
<p style="color:var(--muted);font-size:.85rem;text-align:center;margin-bottom:16px">
请在光线充足的环境下，距离屏幕约30cm<br>看清E字开口方向后点击对应箭头
</p>
<button class="btn btn-primary" style="width:100%" onclick="startTest()">开始测试</button>
</div>

<div class="card hidden" id="testCard">
<div class="progress" id="progressDots"></div>
<div class="e-display"><span class="e-char" id="eChar">E</span></div>
<div class="controls">
<button class="arrow-btn up" onclick="answer('up')">↑</button>
<button class="arrow-btn left" onclick="answer('left')">←</button>
<button class="arrow-btn center">·</button>
<button class="arrow-btn right" onclick="answer('right')">→</button>
<button class="arrow-btn down" onclick="answer('down')">↓</button>
</div>
<div class="stats">
<div class="stat-item"><div class="stat-value" id="correctCount">0</div><div class="stat-label">正确</div></div>
<div class="stat-item"><div class="stat-value" id="totalCount">0</div><div class="stat-label">已测</div></div>
<div class="stat-item"><div class="stat-value" id="currentLevel">1.0</div><div class="stat-label">当前视力</div></div>
</div>
</div>

<div class="card result hidden" id="resultCard">
<div class="result-score" id="resultScore"></div>
<div class="result-text" id="resultText"></div>
<button class="btn btn-primary" style="width:100%;margin-top:16px" onclick="resetTest()">重新测试</button>
</div>
</div>

<script>
const levels = [
  { acuity: 4.0, size: 80, label: '4.0 (0.1)' },
  { acuity: 4.1, size: 70, label: '4.1 (0.12)' },
  { acuity: 4.2, size: 62, label: '4.2 (0.15)' },
  { acuity: 4.3, size: 54, label: '4.3 (0.2)' },
  { acuity: 4.4, size: 47, label: '4.4 (0.25)' },
  { acuity: 4.5, size: 40, label: '4.5 (0.3)' },
  { acuity: 4.6, size: 35, label: '4.6 (0.4)' },
  { acuity: 4.7, size: 30, label: '4.7 (0.5)' },
  { acuity: 4.8, size: 25, label: '4.8 (0.6)' },
  { acuity: 4.9, size: 20, label: '4.9 (0.8)' },
  { acuity: 5.0, size: 16, label: '5.0 (1.0)' },
  { acuity: 5.1, size: 13, label: '5.1 (1.2)' },
  { acuity: 5.2, size: 10, label: '5.2 (1.5)' },
  { acuity: 5.3, size: 8, label: '5.3 (2.0)' }
];

const directions = ['up', 'down', 'left', 'right'];
let mode = 0, levelIndex = 0, questionIndex = 0;
let correctInLevel = 0, totalInLevel = 0;
let results = [];

function selectMode(el, m) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  mode = m;
}

function startTest() {
  levelIndex = 0; questionIndex = 0; correctInLevel = 0; totalInLevel = 0; results = [];
  document.getElementById('startCard').classList.add('hidden');
  document.getElementById('testCard').classList.remove('hidden');
  document.getElementById('resultCard').classList.add('hidden');
  showQuestion();
}

function getRotation(dir) {
  return { up: 0, down: 180, left: 270, right: 90 }[dir];
}

function showQuestion() {
  const level = levels[levelIndex];
  const eEl = document.getElementById('eChar');
  const dir = directions[Math.floor(Math.random() * 4)];
  eEl.style.fontSize = level.size + 'px';
  eEl.style.transform = `rotate(${getRotation(dir)}deg)`;
  eEl.dataset.dir = dir;
  eEl.dataset.level = levelIndex;

  const progress = document.getElementById('progressDots');
  progress.innerHTML = '';
  for (let i = 0; i < results.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot ' + (results[i] ? 'correct' : 'wrong');
    progress.appendChild(dot);
  }

  document.getElementById('currentLevel').textContent = level.acuity.toFixed(1);
  document.getElementById('correctCount').textContent = results.filter(r => r).length;
  document.getElementById('totalCount').textContent = results.length;
}

function answer(dir) {
  const eEl = document.getElementById('eChar');
  const correct = eEl.dataset.dir === dir;
  const levelIdx = parseInt(eEl.dataset.level);
  totalInLevel++;
  if (correct) correctInLevel++;
  results.push(correct);

  if (totalInLevel >= (mode === 0 ? 3 : 2)) {
    const rate = correctInLevel / totalInLevel;
    if (rate < 0.5) {
      showResult(levelIndex > 0 ? levelIndex - 1 : 0);
      return;
    }
    levelIndex++;
    totalInLevel = 0;
    correctInLevel = 0;
    if (levelIndex >= levels.length) {
      showResult(levels.length - 1);
      return;
    }
  }
  showQuestion();
}

function showResult(idx) {
  document.getElementById('testCard').classList.add('hidden');
  document.getElementById('resultCard').classList.remove('hidden');
  const level = levels[idx];
  document.getElementById('resultScore').textContent = level.label;
  document.getElementById('resultScore').style.color = level.acuity >= 5.0 ? 'var(--success)' : level.acuity >= 4.7 ? 'var(--accent)' : 'var(--warning)';
  const total = results.length;
  const correct = results.filter(r => r).length;
  let advice = '';
  if (level.acuity >= 5.0) advice = '视力优秀，请继续保持良好的用眼习惯。';
  else if (level.acuity >= 4.7) advice = '视力正常，建议减少长时间近距离用眼。';
  else if (level.acuity >= 4.3) advice = '视力偏低，建议增加户外活动时间，注意用眼休息。';
  else advice = '视力较差，建议尽快到眼科进行专业检查。';
  document.getElementById('resultText').innerHTML = `测试共 ${total} 题，正确 ${correct} 题<br>视力等级：${level.label}<br><br>${advice}`;
}

function resetTest() {
  document.getElementById('startCard').classList.remove('hidden');
  document.getElementById('testCard').classList.add('hidden');
  document.getElementById('resultCard').classList.add('hidden');
}
</script>
<script src="../i18n.js"></script>
</body>
</html>
