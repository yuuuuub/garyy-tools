<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>横版卷轴</title>
    <meta name="description" content="横版卷轴冒险游戏，操控角色前进探索世界">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; }
        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .stats span { color: var(--accent); font-weight: bold; }
        #gameCanvas {
            border: 2px solid var(--border);
            border-radius: 8px;
            max-width: 100%;
        }
        .info { margin-top: 10px; color: #8b949e; }
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }
        .overlay.show { display: flex; }
        .overlay h2 { color: var(--accent); margin-bottom: 10px; }
        .overlay button {
            background: var(--accent);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
        }
        .mobile-controls {
            display: none;
            margin-top: 15px;
        }
        .mobile-btn {
            width: 80px;
            height: 60px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 1.3rem;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            .mobile-controls { display: flex; justify-content: center; }
        }
    </style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="横版卷轴">
  <meta property="og:description" content="横版卷轴冒险游戏，操控角色前进探索世界">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/side-scroller/">
</head>
<body>
    <h1>🏃 横版卷轴</h1>
    <div class="stats">
        距离：<span id="distance">0</span>m
        金币：<span id="coins">0</span>
        最高：<span id="best">0</span>m
    </div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="info">空格跳跃（可二段跳），躲避障碍物</div>
    <div class="mobile-controls">
        <button class="mobile-btn" id="btnJump">跳跃</button>
    </div>
    <div class="overlay" id="gameOver">
        <h2>游戏结束</h2>
        <p>距离：<span id="finalDist">0</span>m | 金币：<span id="finalCoins">0</span></p>
        <button onclick="startGame()">再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRAVITY = 0.7, JUMP_FORCE = -13, GROUND_Y = 330;

        let player, obstacles, bgCoins, distance, coins, speed, gameOver, bestDist, jumpsLeft;

        function startGame() {
            document.getElementById('gameOver').classList.remove('show');
            player = {x: 100, y: GROUND_Y, vy: 0, w: 30, h: 40, grounded: true};
            obstacles = [];
            bgCoins = [];
            distance = 0;
            coins = 0;
            speed = 6;
            gameOver = false;
            jumpsLeft = 2;
            bestDist = Math.max(bestDist || 0, distance);
            updateUI();
        }

        function updateUI() {
            document.getElementById('distance').textContent = Math.floor(distance);
            document.getElementById('coins').textContent = coins;
            document.getElementById('best').textContent = Math.floor(bestDist);
        }

        let keys = {};
        document.addEventListener('keydown', e => {
            if (e.code === 'Space') { e.preventDefault(); jump(); }
            keys[e.code] = true;
        });
        document.addEventListener('keyup', e => keys[e.code] = false);
        document.getElementById('btnJump').addEventListener('touchstart', e => { e.preventDefault(); jump(); });

        function jump() {
            if (gameOver) return;
            if (jumpsLeft > 0) {
                player.vy = JUMP_FORCE;
                player.grounded = false;
                jumpsLeft--;
            }
        }

        function spawnObstacle() {
            const types = ['cactus', 'bird', 'rock'];
            const type = types[Math.floor(Math.random() * types.length)];
            let ob = {x: 850, type};
            if (type === 'cactus') { ob.y = GROUND_Y; ob.w = 25; ob.h = 50; }
            else if (type === 'bird') { ob.y = GROUND_Y - 80 - Math.random()*80; ob.w = 40; ob.h = 25; }
            else { ob.y = GROUND_Y + 10; ob.w = 35; ob.h = 25; }
            obstacles.push(ob);
        }

        function spawnCoin() {
            bgCoins.push({x: 850, y: GROUND_Y - 60 - Math.random()*100, r: 12, collected: false});
        }

        function update() {
            if (gameOver) return;
            distance += speed * 0.02;
            speed = 6 + distance * 0.002;

            player.vy += GRAVITY;
            player.y += player.vy;
            if (player.y >= GROUND_Y) {
                player.y = GROUND_Y;
                player.vy = 0;
                player.grounded = true;
                jumpsLeft = 2;
            }

            if (Math.random() < 0.02 + distance * 0.0001) spawnObstacle();
            if (Math.random() < 0.015) spawnCoin();

            obstacles.forEach(o => o.x -= speed);
            bgCoins.forEach(c => c.x -= speed);
            obstacles = obstacles.filter(o => o.x > -50);
            bgCoins = bgCoins.filter(c => c.x > -50);

            obstacles.forEach(o => {
                if (player.x + player.w > o.x + 5 && player.x < o.x + o.w - 5 &&
                    player.y + player.h > o.y + 5 && player.y < o.y + o.h - 5) {
                    gameOver = true;
                    bestDist = Math.max(bestDist, distance);
                    document.getElementById('finalDist').textContent = Math.floor(distance);
                    document.getElementById('finalCoins').textContent = coins;
                    document.getElementById('gameOver').classList.add('show');
                }
            });

            bgCoins.forEach(c => {
                if (!c.collected && Math.hypot(player.x+15-c.x, player.y+20-c.y) < 30) {
                    c.collected = true;
                    coins++;
                }
            });

            updateUI();
        }

        function draw() {
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, 800, 400);

            ctx.fillStyle = '#1a2332';
            for (let i = 0; i < 8; i++) {
                let x = (i * 120 - (distance * 2) % 120);
                ctx.fillRect(x, 370, 80, 30);
            }

            ctx.fillStyle = '#30363d';
            ctx.fillRect(0, GROUND_Y + 40, 800, 60);

            bgCoins.forEach(c => {
                if (c.collected) return;
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
                ctx.fill();
            });

            obstacles.forEach(o => {
                ctx.fillStyle = o.type === 'bird' ? '#a855f7' : o.type === 'rock' ? '#6b7280' : '#22c55e';
                if (o.type === 'bird') {
                    ctx.beginPath();
                    ctx.moveTo(o.x, o.y + o.h/2);
                    ctx.lineTo(o.x + o.w/2, o.y);
                    ctx.lineTo(o.x + o.w, o.y + o.h/2);
                    ctx.lineTo(o.x + o.w/2, o.y + o.h);
                    ctx.fill();
                } else {
                    ctx.fillRect(o.x, o.y, o.w, o.h);
                }
            });

            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fillStyle = '#1d4ed8';
            ctx.fillRect(player.x + 20, player.y + 10, 8, 8);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        bestDist = 0;
        startGame();
        gameLoop();
    </script>
<script src="../i18n.js"></script>
</body>
</html>
