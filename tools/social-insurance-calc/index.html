<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五险一金计算器</title>
<meta name="description" content="五险一金计算器，计算社保公积金缴纳金额">
<style>
:root {--bg: #f5f5f7;
--card-bg: #ffffff;
--text: #1d1d1f;
--text-secondary: #6e6e73;
--border: #e5e5ea;
--accent: #0071e3;
--accent-hover: #0077ed;
--personal-bar: #0071e3;
--company-bar: #34c759;
--danger: #ff3b30;
--shadow: 0 2px 12px rgba(0,0,0,0.08);
--radius: 14px}
@media (prefers-color-scheme: dark) {:root {--bg: #1c1c1e;
--card-bg: #2c2c2e;
--text: #f5f5f7;
--text-secondary: #98989d;
--border: #3a3a3c;
--shadow: 0 2px 12px rgba(0,0,0,0.3)}}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
line-height: 1.6;
-webkit-font-smoothing: antialiased}
.container { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 1.75rem; font-weight: 700; text-align: center; margin-bottom: 24px; letter-spacing: -0.02em; }
.card {background: var(--card-bg);
border-radius: var(--radius);
padding: 20px;
margin-bottom: 16px;
box-shadow: var(--shadow)}
.input-group { margin-bottom: 16px; }
.input-group:last-child { margin-bottom: 0; }
.input-group label {display: block;
font-size: 0.85rem;
font-weight: 600;
color: var(--text-secondary);
margin-bottom: 6px;
letter-spacing: 0.02em}
.input-group input, .input-group select {width: 100%;
padding: 12px 14px;
border: 1.5px solid var(--border);
border-radius: 10px;
font-size: 1rem;
background: var(--bg);
color: var(--text);
outline: none;
transition: border-color 0.2s;
font-family: inherit;
-webkit-appearance: none;
appearance: none}
.input-group input:focus, .input-group select:focus {border-color: var(--accent)}
.input-row { display: flex; gap: 12px; }
.input-row .input-group { flex: 1; }
.section-title {font-size: 0.8rem;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.05em;
color: var(--text-secondary);
margin-bottom: 12px;
padding-bottom: 8px;
border-bottom: 1px solid var(--border)}
.item-row {display: flex;
justify-content: space-between;
align-items: center;
padding: 8px 0;
font-size: 0.92rem}
.item-row:not(:last-child) { border-bottom: 1px solid var(--border); }
.item-name { font-weight: 500; }
.item-detail { font-size: 0.78rem; color: var(--text-secondary); }
.item-values { text-align: right; }
.item-personal { color: var(--personal-bar); font-weight: 600; font-size: 0.9rem; }
.item-company { color: var(--company-bar); font-weight: 500; font-size: 0.82rem; }
.summary-row {display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 0;
font-weight: 600;
font-size: 1rem}
.summary-row.highlight {color: var(--accent);
font-size: 1.1rem}
.fun-card {background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
color: #fff}
.fun-card .fun-text { font-size: 0.95rem; line-height: 1.7; }
.fun-card .fun-big { font-size: 1.5rem; font-weight: 800; }
.take-home {text-align: center;
padding: 16px 0 8px}
.take-home .amount {font-size: 2.8rem;
font-weight: 800;
color: var(--accent);
letter-spacing: -0.03em;
line-height: 1.1}
.take-home .label { font-size: 0.82rem; color: var(--text-secondary); margin-top: 4px; }
.percent-tag {display: inline-block;
font-size: 0.72rem;
background: var(--bg);
padding: 2px 6px;
border-radius: 4px;
margin-left: 4px;
font-weight: 400;
color: var(--text-secondary)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="五险一金计算器">
  <meta property="og:description" content="五险一金计算器，计算社保公积金缴纳金额">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/social-insurance-calc/">
</head>
<body>
<div class="container">
  <h1>五险一金计算器</h1>

  <div class="card">
    <div class="input-row">
      <div class="input-group">
        <label>税前月薪 (元)</label>
        <input type="number" id="salary" placeholder="例如 15000" value="15000" step="100" min="0">
      </div>
      <div class="input-group">
        <label>缴纳城市</label>
        <select id="city">
          <option value="beijing">北京</option>
          <option value="shanghai">上海</option>
          <option value="guangzhou">广州</option>
          <option value="shenzhen">深圳</option>
          <option value="hangzhou">杭州</option>
          <option value="chengdu">成都</option>
        </select>
      </div>
    </div>
    <div class="input-group">
      <label>公积金缴纳比例 <span class="percent-tag">个人+单位</span></label>
      <select id="fundRate">
        <option value="0.12" selected>12% (最高)</option>
        <option value="0.10">10%</option>
        <option value="0.08">8%</option>
        <option value="0.07">7%</option>
        <option value="0.05">5% (最低)</option>
      </select>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="take-home" id="takeHomeBlock"></div>

    <div class="section-title" style="margin-top:16px;">各项明细</div>
    <div id="detailItems"></div>

    <div class="section-title" style="margin-top:16px;">汇总</div>
    <div class="summary-row">
      <span>个人实缴总额</span>
      <span style="color:var(--personal-bar);" id="sumPersonal">--</span>
    </div>
    <div class="summary-row">
      <span>单位缴纳总额</span>
      <span style="color:var(--company-bar);" id="sumCompany">--</span>
    </div>
  </div>

  <div class="card fun-card" id="funCard" style="display:none;">
    <div class="fun-text" id="funCost"></div>
    <div class="fun-text" style="margin-top:12px;" id="funHouse"></div>
  </div>

  <div class="card" style="display:none;" id="taxCard">
    <div class="section-title">个税明细</div>
    <div class="summary-row">
      <span>应纳税所得额</span>
      <span id="taxableIncome">--</span>
    </div>
    <div class="summary-row">
      <span>适用税率</span>
      <span id="taxRate">--</span>
    </div>
    <div class="summary-row">
      <span>速算扣除数</span>
      <span id="quickDeduction">--</span>
    </div>
    <div class="summary-row highlight">
      <span>应缴个税</span>
      <span id="taxAmount">--</span>
    </div>
  </div>
</div>

<script>
const CITIES = {
  beijing: {
    name: '北京',
    pension:     { name: '养老保险', personal: 0.08,  company: 0.16 },
    medical:     { name: '医疗保险', personal: 0.02,  company: 0.098, extraPersonal: 3 },
    unemployment:{ name: '失业保险', personal: 0.005, company: 0.005 },
    injury:      { name: '工伤保险', personal: 0,     company: 0.004 },
    maternity:   { name: '生育保险', personal: 0,     company: 0.008 },
    housePrice: 60000
  },
  shanghai: {
    name: '上海',
    pension:     { name: '养老保险', personal: 0.08,  company: 0.16 },
    medical:     { name: '医疗保险', personal: 0.02,  company: 0.105 },
    unemployment:{ name: '失业保险', personal: 0.005, company: 0.005 },
    injury:      { name: '工伤保险', personal: 0,     company: 0.0026 },
    maternity:   { name: '生育保险', personal: 0,     company: 0.01 },
    housePrice: 55000
  },
  guangzhou: {
    name: '广州',
    pension:     { name: '养老保险', personal: 0.08,  company: 0.14 },
    medical:     { name: '医疗保险', personal: 0.02,  company: 0.055 },
    unemployment:{ name: '失业保险', personal: 0.002, company: 0.008 },
    injury:      { name: '工伤保险', personal: 0,     company: 0.002 },
    maternity:   { name: '生育保险', personal: 0,     company: 0.0085 },
    housePrice: 30000
  },
  shenzhen: {
    name: '深圳',
    pension:     { name: '养老保险', personal: 0.08,  company: 0.14 },
    medical:     { name: '医疗保险', personal: 0.02,  company: 0.062 },
    unemployment:{ name: '失业保险', personal: 0.003, company: 0.007 },
    injury:      { name: '工伤保险', personal: 0,     company: 0.0028 },
    maternity:   { name: '生育保险', personal: 0,     company: 0.0045 },
    housePrice: 55000
  },
  hangzhou: {
    name: '杭州',
    pension:     { name: '养老保险', personal: 0.08,  company: 0.14 },
    medical:     { name: '医疗保险', personal: 0.02,  company: 0.099 },
    unemployment:{ name: '失业保险', personal: 0.005, company: 0.005 },
    injury:      { name: '工伤保险', personal: 0,     company: 0.004 },
    maternity:   { name: '生育保险', personal: 0,     company: 0 },
    housePrice: 30000
  },
  chengdu: {
    name: '成都',
    pension:     { name: '养老保险', personal: 0.08,  company: 0.16 },
    medical:     { name: '医疗保险', personal: 0.02,  company: 0.077 },
    unemployment:{ name: '失业保险', personal: 0.004, company: 0.006 },
    injury:      { name: '工伤保险', personal: 0,     company: 0.004 },
    maternity:   { name: '生育保险', personal: 0,     company: 0.008 },
    housePrice: 15000
  }
};
const TAX_BRACKETS = [
  { max: 3000,   rate: 0.03, deduction: 0 },
  { max: 12000,  rate: 0.10, deduction: 210 },
  { max: 25000,  rate: 0.20, deduction: 1410 },
  { max: 35000,  rate: 0.25, deduction: 2660 },
  { max: 55000,  rate: 0.30, deduction: 4410 },
  { max: 80000,  rate: 0.35, deduction: 7160 },
  { max: Infinity, rate: 0.45, deduction: 15160 }
];
const TAX_THRESHOLD = 5000;
function calcTax(taxableIncome) {
  if (taxableIncome <= 0) return { tax: 0, rate: 0, deduction: 0 };
  for (const b of TAX_BRACKETS) {
    if (taxableIncome <= b.max) {
      const tax = Math.max(0, taxableIncome * b.rate - b.deduction);
      return { tax: Math.round(tax * 100) / 100, rate: b.rate, deduction: b.deduction };
    }
  }
  return { tax: 0, rate: 0, deduction: 0 };
}
function fmt(n) {
  return n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtWan(n) {
  const w = n / 10000;
  return w.toFixed(1) + '万';
}
function calculate() {
  const salary = parseFloat(document.getElementById('salary').value) || 0;
  const cityKey = document.getElementById('city').value;
  const fundRate = parseFloat(document.getElementById('fundRate').value);
  const city = CITIES[cityKey];
  const items = [
    { ...city.pension,     category: 'pension' },
    { ...city.medical,     category: 'medical' },
    { ...city.unemployment,category: 'unemployment' },
    { ...city.injury,      category: 'injury' },
    { ...city.maternity,   category: 'maternity' },
  ];
  let totalPersonal = 0;
  let totalCompany = 0;
  let html = '';
  for (const item of items) {
    let personalAmt = Math.round(salary * item.personal * 100) / 100;
    if (item.extraPersonal) personalAmt += item.extraPersonal;
    const companyAmt = Math.round(salary * item.company * 100) / 100;
    totalPersonal += personalAmt;
    totalCompany += companyAmt;
    const pRateStr = item.personal > 0 ? `${(item.personal * 100)}%` : '--';
    const cRateStr = `${(item.company * 100)}%`;
    html += `
      <div class="item-row">
        <div>
          <div class="item-name">${item.name}</div>
          <div class="item-detail">个人 ${pRateStr} | 单位 ${cRateStr}</div>
        </div>
        <div class="item-values">
          <div class="item-personal">-${fmt(personalAmt)}</div>
          <div class="item-company">单位 ${fmt(companyAmt)}</div>
        </div>
      </div>`;
  }
  const fundPersonal = Math.round(salary * fundRate * 100) / 100;
  const fundCompany = Math.round(salary * fundRate * 100) / 100;
  totalPersonal += fundPersonal;
  totalCompany += fundCompany;
  const fundRatePercent = (fundRate * 100) + '%';
  html += `
    <div class="item-row">
      <div>
        <div class="item-name">住房公积金</div>
        <div class="item-detail">个人 ${fundRatePercent} | 单位 ${fundRatePercent}</div>
      </div>
      <div class="item-values">
        <div class="item-personal">-${fmt(fundPersonal)}</div>
        <div class="item-company">单位 ${fmt(fundCompany)}</div>
      </div>
    </div>`;
  totalPersonal = Math.round(totalPersonal * 100) / 100;
  totalCompany = Math.round(totalCompany * 100) / 100;
  const taxableIncome = salary - totalPersonal - TAX_THRESHOLD;
  const taxResult = calcTax(taxableIncome);
  const takeHome = Math.round((salary - totalPersonal - taxResult.tax) * 100) / 100;
  const totalCost = Math.round((salary + totalCompany) * 100) / 100;
  const multiplier = (totalCost / salary).toFixed(1);
  const fundYearly = Math.round((fundPersonal + fundCompany) * 12 * 100) / 100;
  const houseSquareMeters = (fundYearly / city.housePrice).toFixed(2);
  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('funCard').style.display = 'block';
  document.getElementById('taxCard').style.display = 'block';
  document.getElementById('takeHomeBlock').innerHTML = `
    <div class="label">税后到手薪资</div>
    <div class="amount">${fmt(takeHome)}</div>
    <div class="label">元/月</div>`;
  document.getElementById('detailItems').innerHTML = html;
  document.getElementById('sumPersonal').textContent = fmt(totalPersonal) + ' 元';
  document.getElementById('sumCompany').textContent = fmt(totalCompany) + ' 元';
  document.getElementById('funCost').innerHTML =
    `公司实际为你付出的成本是 <span class="fun-big">${fmtWan(totalCost)}</span>（你的 <span class="fun-big">${multiplier} 倍</span>）`;
  document.getElementById('funHouse').innerHTML =
    `你的公积金一年能存 <span class="fun-big">${fmtWan(fundYearly)}</span>，够在${city.name}买 <span class="fun-big">${houseSquareMeters}</span> 平米`;
  document.getElementById('taxableIncome').textContent = fmt(Math.max(0, taxableIncome)) + ' 元';
  document.getElementById('taxRate').textContent = (taxResult.rate * 100) + '%';
  document.getElementById('quickDeduction').textContent = fmt(taxResult.deduction) + ' 元';
  document.getElementById('taxAmount').textContent = fmt(taxResult.tax) + ' 元';
}
document.getElementById('salary').addEventListener('input', calculate);
document.getElementById('city').addEventListener('change', calculate);
document.getElementById('fundRate').addEventListener('change', calculate);
calculate();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
