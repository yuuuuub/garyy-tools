<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">

<title>颜色命名查询 - Color Naming 中文</title>

<meta property="og:description" content="颜色命名查询 - Color Naming 中文 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="输入HEX颜色值查询中文颜色名称，支持近似颜色匹配和颜色名称反向查询">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📛</text></svg>">
<meta name="robots" content="index, follow">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--radius:10px;--transition:.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.back{position:fixed;top:8px;left:8px;z-index:9999;text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)}
.header{text-align:center;padding:2rem 1rem 1rem}
.header h1{font-size:1.8rem;margin-bottom:.3rem}
.header p{color:var(--text2);font-size:.9rem}
.theme-btn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:.75rem}
.container{max-width:900px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.card h2{font-size:1.1rem;margin-bottom:.8rem;color:var(--accent)}
.search-area{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin:1rem 0}
.search-area input[type="color"]{width:64px;height:64px;border:none;border-radius:10px;cursor:pointer;background:none;padding:0}
.search-area input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
.search-area input[type="color"]::-webkit-color-swatch{border-radius:10px;border:2px solid var(--border)}
.search-area input[type="text"]{flex:1;min-width:200px;padding:.7rem 1rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;font-family:monospace}
.search-area input[type="text"]:focus{outline:none;border-color:var(--accent)}
.result-area{margin:1.5rem 0}
.result-main{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.result-swatch{width:120px;height:120px;border-radius:16px;border:3px solid var(--border);flex-shrink:0}
.result-info h3{font-size:1.5rem;margin-bottom:.3rem}
.result-info .name-en{font-size:1rem;color:var(--text2);margin-bottom:.5rem}
.result-info .color-values{font-family:monospace;font-size:.85rem;line-height:1.8;color:var(--text2)}
.result-info .color-values span{color:var(--text)}
.nearby-section{margin-top:1rem}
.nearby-section h3{font-size:.95rem;margin-bottom:.5rem;color:var(--text2)}
.nearby-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.5rem}
.nearby-item{display:flex;align-items:center;gap:.5rem;padding:.5rem;border-radius:8px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .2s;font-size:.8rem}
.nearby-item:hover{border-color:var(--accent)}
.nearby-dot{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);flex-shrink:0}
.name-search{margin:1rem 0}
.name-search input{width:100%;padding:.7rem 1rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.95rem}
.name-search input:focus{outline:none;border-color:var(--accent)}
.name-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.5rem;margin-top:.8rem;max-height:400px;overflow-y:auto}
.name-item{display:flex;align-items:center;gap:.6rem;padding:.6rem;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .2s}
.name-item:hover{border-color:var(--accent);background:var(--bg)}
.name-dot{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);flex-shrink:0}
.copy-btn{padding:.3rem .6rem;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:.75rem;margin-top:.5rem}
.copy-btn:hover{background:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1,transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<a href="../index.html" class="back">← 首页</a>
<button class="theme-btn" onclick="toggleTheme()">🌓 主题</button>
<div class="header">
<h1>📛 颜色命名查询</h1>
<p>输入HEX值查询中文颜色名称，或搜索颜色名称</p>
</div>
<div class="container">
<div class="card">
<h2>HEX 颜色查询</h2>
<div class="search-area">
<input type="color" id="colorPicker" value="#E74C3C" oninput="lookupHex(this.value)">
<input type="text" id="hexInput" value="#E74C3C" placeholder="#RRGGBB" oninput="lookupHex(this.value)">
</div>
<div class="result-area" id="resultArea"></div>
</div>

<div class="card">
<h2>颜色名称搜索</h2>
<div class="name-search"><input type="text" id="nameSearch" placeholder="输入中文颜色名称搜索..." oninput="searchName(this.value)"></div>
<div class="name-results" id="nameResults"></div>
</div>
</div>

<script>
function toggleTheme(){const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t)}
function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase()}
function colorDist(c1,c2){return Math.sqrt((c1[0]-c2[0])**2+(c1[1]-c2[1])**2+(c1[2]-c2[2])**2)}
function getLuminance(hex){const [r,g,b]=hexToRgb(hex);return(0.299*r+0.587*g+0.114*b)/255}

const colorNames=[
{name:'黑色',en:'Black',hex:'#000000'},{name:'白色',en:'White',hex:'#FFFFFF'},
{name:'红色',en:'Red',hex:'#FF0000'},{name:'深红',en:'Dark Red',hex:'#8B0000'},
{name:'火砖红',en:'Firebrick',hex:'#B22222'},{name:'印度红',en:'Indian Red',hex:'#CD5C5C'},
{name:'浅珊瑚',en:'Light Coral',hex:'#F08080'},{name:'鲑鱼红',en:'Salmon',hex:'#FA8072'},
{name:'橙红',en:'Orange Red',hex:'#FF4500'},{name:'番茄红',en:'Tomato',hex:'#FF6347'},
{name:'珊瑚色',en:'Coral',hex:'#FF7F50'},{name:'橙色',en:'Orange',hex:'#FFA500'},
{name:'深橙',en:'Dark Orange',hex:'#FF8C00'},{name:'金色',en:'Gold',hex:'#FFD700'},
{name:'黄色',en:'Yellow',hex:'#FFFF00'},{name:'浅黄',en:'Light Yellow',hex:'#FFFFE0'},
{name:'柠檬绸',en:'Lemon Chiffon',hex:'#FFFACD'},{name:'卡其色',en:'Khaki',hex:'#F0E68C'},
{name:'深卡其',en:'Dark Khaki',hex:'#BDB76B'},{name:'橄榄',en:'Olive',hex:'#808000'},
{name:'绿色',en:'Green',hex:'#008000'},{name:'深绿',en:'Dark Green',hex:'#006400'},
{name:'草绿',en:'Lawn Green',hex:'#7CFC00'},{name:'查特酒绿',en:'Chartreuse',hex:'#7FFF00'},
{name:'浅绿',en:'Light Green',hex:'#90EE90'},{name:'薄荷绿',en:'Mint Cream',hex:'#F5FFFA'},
{name:'春绿',en:'Spring Green',hex:'#00FF7F'},{name:'海洋绿',en:'Sea Green',hex:'#2E8B57'},
{name:'中海洋蓝',en:'Medium Sea Green',hex:'#3CB371'},{name:'翠绿',en:'Emerald',hex:'#50C878'},
{name:'青色',en:'Cyan',hex:'#00FFFF'},{name:'深青',en:'Dark Cyan',hex:'#008B8B'},
{name:'水鸭蓝',en:'Teal',hex:'#008080'},{name:'浅青',en:'Light Cyan',hex:'#E0FFFF'},
{name:'碧蓝',en:'Aquamarine',hex:'#7FFFD4'},{name:'蓝绿',en:'Blue Green',hex:'#0095B6'},
{name:'蓝色',en:'Blue',hex:'#0000FF'},{name:'深蓝',en:'Dark Blue',hex:'#00008B'},
{name:'海军蓝',en:'Navy',hex:'#000080'},{name:'皇室蓝',en:'Royal Blue',hex:'#4169E1'},
{name:'道奇蓝',en:'Dodger Blue',hex:'#1E90FF'},{name:'天蓝',en:'Sky Blue',hex:'#87CEEB'},
{name:'浅天蓝',en:'Light Sky Blue',hex:'#87CEFA'},{name:'钢青',en:'Steel Blue',hex:'#4682B4'},
{name:'矢车菊蓝',en:'Cornflower Blue',hex:'#6495ED'},{name:'午夜蓝',en:'Midnight Blue',hex:'#191970'},
{name:'淡蓝',en:'Light Blue',hex:'#ADD8E6'},{name:'粉蓝',en:'Powder Blue',hex:'#B0E0E6'},
{name:'紫色',en:'Purple',hex:'#800080'},{name:'深紫',en:'Dark Violet',hex:'#9400D3'},
{name:'暗紫',en:'Dark Magenta',hex:'#8B008B'},{name:'靛蓝',en:'Indigo',hex:'#4B0082'},
{name:'蓝紫',en:'Blue Violet',hex:'#8A2BE2'},{name:'中紫',en:'Medium Purple',hex:'#9370DB'},
{name:'暗兰花紫',en:'Dark Orchid',hex:'#9932CC'},{name:'兰花紫',en:'Orchid',hex:'#DA70D6'},
{name:'紫罗兰',en:'Violet',hex:'#EE82EE'},{name:'梅红',en:'Plum',hex:'#DDA0DD'},
{name:'玫瑰红',en:'Hot Pink',hex:'#FF69B4'},{name:'深粉',en:'Deep Pink',hex:'#FF1493'},
{name:' mediumvioletred',en:'Medium Violet Red',hex:'#C71585'},
{name:'粉色',en:'Pink',hex:'#FFC0CB'},{name:'浅粉',en:'Light Pink',hex:'#FFB6C1'},
{name:' Antique White',en:'Antique White',hex:'#FAEBD7'},
{name:'米色',en:'Beige',hex:'#F5F5DC'},{name:'亚麻色',en:'Linen',hex:'#FAF0E6'},
{name:'象牙色',en:'Ivory',hex:'#FFFFF0'},{name:'雪白',en:'Snow',hex:'#FFFAFA'},
{name:'古白',en:'Old Lace',hex:'#FDF5E6'},{name:'花白',en:'Floral White',hex:'#FFFAF0'},
{name:'浅灰',en:'Light Gray',hex:'#D3D3D3'},{name:'深灰',en:'Dark Gray',hex:'#A9A9A9'},
{name:'灰色',en:'Gray',hex:'#808080'},{name:'暗灰',en:'Dim Gray',hex:'#696969'},
{name:'银色',en:'Silver',hex:'#C0C0C0'},{name:'巧克力色',en:'Chocolate',hex:'#D2691E'},
{name:'棕色',en:'Brown',hex:'#A52A2A'},{name:'马鞍棕',en:'Saddle Brown',hex:'#8B4513'},
{name:'赭色',en:'Sienna',hex:'#A0522D'},{name:'土黄',en:'Sandy Brown',hex:'#F4A460'},
{name:'棕褐',en:'Tan',hex:'#D2B48C'},{name:'小麦色',en:'Wheat',hex:'#F5DEB3'},
{name:'玫瑰棕',en:'Rosy Brown',hex:'#BC8F8F'},{name:'秘鲁色',en:'Peru',hex:'#CD853F'},
{name:'暗橄榄绿',en:'Dark Olive Green',hex:'#556B2F'},
{name:'暗海绿',en:'Dark Sea Green',hex:'#8FBC8F'},
{name:'薰衣草',en:'Lavender',hex:'#E6E6FA'},{name:'天青石蓝',en:'Slate Blue',hex:'#6A5ACD'},
{name:'暗板岩蓝',en:'Dark Slate Blue',hex:'#483D8B'},
{name:'板岩灰',en:'Slate Gray',hex:'#708090'},
{name:'暗板岩灰',en:'Dark Slate Gray',hex:'#2F4F4F'}
];

function lookupHex(v){
if(!/^#[0-9A-Fa-f]{6}$/.test(v))return;
document.getElementById('colorPicker').value=v;
document.getElementById('hexInput').value=v.toUpperCase();
const rgb=hexToRgb(v);
const [h,s,l]=rgbToHsl(rgb[0],rgb[1],rgb[2]);

let bestMatch=colorNames[0],bestDist=Infinity;
colorNames.forEach(c=>{
const d=colorDist(rgb,hexToRgb(c.hex));
if(d<bestDist){bestDist=d;bestMatch=c}
});

const nearby=colorNames.map(c=>({...c,dist:colorDist(rgb,hexToRgb(c.hex))})).sort((a,b)=>a.dist-b.dist).slice(1,9);

const ra=document.getElementById('resultArea');
ra.innerHTML=`
<div class="result-main">
<div class="result-swatch" style="background:${v}"></div>
<div class="result-info">
<h3>${bestMatch.name}</h3>
<div class="name-en">${bestMatch.en} (相似度 ${Math.max(0,100-Math.round(bestDist/4.41))}%)</div>
<div class="color-values">
<div>HEX: <span>${v.toUpperCase()}</span></div>
<div>RGB: <span>${rgb[0]}, ${rgb[1]}, ${rgb[2]}</span></div>
<div>HSL: <span>${Math.round(h)}°, ${Math.round(s)}%, ${Math.round(l)}%</span></div>
</div>
<button class="copy-btn" onclick="navigator.clipboard&&navigator.clipboard.writeText('${v.toUpperCase()}')">复制 HEX</button>
</div>
</div>
<div class="nearby-section">
<h3>相近颜色</h3>
<div class="nearby-grid">${nearby.map(c=>`<div class="nearby-item" onclick="lookupHex('${c.hex}')"><div class="nearby-dot" style="background:${c.hex}"></div><div><strong>${c.name}</strong><br><span style="color:var(--text2);font-size:.7rem">${c.hex}</span></div></div>`).join('')}</div>
</div>`;
}

function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h,s,l=(mx+mn)/2;if(mx===mn){h=s=0}else{const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);switch(mx){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break}}return[h*360,s*100,l*100]}

function searchName(q){
const el=document.getElementById('nameResults');
if(!q){el.innerHTML=colorNames.slice(0,30).map(c=>`<div class="name-item" onclick="lookupHex('${c.hex}')"><div class="name-dot" style="background:${c.hex}"></div><div><strong>${c.name}</strong><br><span style="color:var(--text2);font-size:.7rem">${c.en} ${c.hex}</span></div></div>`).join('');return}
const filtered=colorNames.filter(c=>c.name.includes(q)||c.en.toLowerCase().includes(q.toLowerCase()));
el.innerHTML=filtered.length?filtered.map(c=>`<div class="name-item" onclick="lookupHex('${c.hex}')"><div class="name-dot" style="background:${c.hex}"></div><div><strong>${c.name}</strong><br><span style="color:var(--text2);font-size:.7rem">${c.en} ${c.hex}</span></div></div>`).join(''):'<div style="color:var(--text2);font-size:.85rem;padding:1rem">未找到匹配的颜色名称</div>';
}

searchName('');
lookupHex('#E74C3C');
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
