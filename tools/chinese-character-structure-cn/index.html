<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字结构分析</title>
<meta name="description" content="在线汉字结构分析工具，输入汉字即可查看部首、笔画、结构类型等详细信息">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:800px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.char-display{text-align:center;font-size:4rem;font-weight:700;padding:20px;background:var(--bg);border-radius:var(--radius);border:2px solid var(--accent);margin:12px 0}
.structure-visual{display:flex;justify-content:center;align-items:center;padding:20px;margin:12px 0;background:var(--bg);border-radius:8px}
.struct-box{border:2px solid var(--accent);padding:8px 12px;border-radius:4px;font-size:.9rem;color:var(--accent);font-weight:600}
.struct-box.highlight{background:var(--accent);color:#fff}
.tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:600;margin:2px}
.tag-blue{background:rgba(59,130,246,.15);color:var(--accent)}
.tag-green{background:rgba(34,197,94,.15);color:var(--success)}
.tag-yellow{background:rgba(245,158,11,.15);color:var(--warn)}
.tag-red{background:rgba(239,68,68,.15);color:var(--danger)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="汉字结构分析">
<meta property="og:description" content="在线汉字结构分析工具">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🔍 汉字结构分析</h1><p>输入汉字，查看部首、笔画、结构类型等详细信息</p></div>

<div class="cd"><h2>输入汉字</h2>
<div style="display:flex;gap:8px">
<input type="text" id="charInput" placeholder="请输入一个或多个汉字" maxlength="20" style="flex:1">
<button onclick="analyzeChars()">分析</button>
</div>
<div class="bg" style="margin-top:8px">
<button class="sec" onclick="setChars('龙凤呈祥')">龙凤呈祥</button>
<button class="sec" onclick="setChars('魑魅魍魉')">魑魅魍魉</button>
<button class="sec" onclick="setChars('天地玄黄')">天地玄黄</button>
<button class="sec" onclick="setChars('你好世界')">你好世界</button>
</div></div>

<div id="resultArea" class="hidden"></div>
</div>
<script>
const $=id=>document.getElementById(id);
function setChars(s){$('charInput').value=s;analyzeChars()}

const structures={
  '独体字':{desc:'由一个部件构成',color:'#3b82f6'},
  '左右结构':{desc:'左边和右边两部分',color:'#22c55e'},
  '左中右结构':{desc:'左中右三部分',color:'#f59e0b'},
  '上下结构':{desc:'上面和下面两部分',color:'#ef4444'},
  '上中下结构':{desc:'上中下三部分',color:'#8b5cf6'},
  '全包围结构':{desc:'外面完全包围里面',color:'#ec4899'},
  '半包围结构':{desc:'部分包围内部',color:'#06b6d4'},
  '品字形结构':{desc:'三个相同部件排列',color:'#f97316'},
  '框架结构':{desc:'含有框架性部件',color:'#84cc16'}
};

const charDB={
  '一':{pinyin:'yī',strokes:1,radical:'一',struct:'独体字',meaning:'数目，最小的正整数',components:['一']},
  '二':{pinyin:'èr',strokes:2,radical:'二',struct:'独体字',meaning:'数目，一加一的和',components:['二']},
  '三':{pinyin:'sān',strokes:3,radical:'一',struct:'独体字',meaning:'数目，二加一的和',components:['三']},
  '人':{pinyin:'rén',strokes:2,radical:'人',struct:'独体字',meaning:'能制造工具并使用工具进行劳动的高等动物',components:['人']},
  '大':{pinyin:'dà',strokes:3,radical:'大',struct:'独体字',meaning:'指面积、体积、容量、数量等超过一般',components:['大']},
  '小':{pinyin:'xiǎo',strokes:3,radical:'小',struct:'独体字',meaning:'面积、体积、容量、数量等不大',components:['小']},
  '中':{pinyin:'zhōng',strokes:4,radical:'丨',struct:'独体字',meaning:'里面、中间',components:['中']},
  '国':{pinyin:'guó',strokes:8,radical:'囗',struct:'全包围结构',meaning:'国家',components:['囗','玉']},
  '好':{pinyin:'hǎo',strokes:6,radical:'女',struct:'左右结构',meaning:'优点多的，使人满意',components:['女','子']},
  '明':{pinyin:'míng',strokes:8,radical:'日',struct:'左右结构',meaning:'亮，与暗相对',components:['日','月']},
  '林':{pinyin:'lín',strokes:8,radical:'木',struct:'左右结构',meaning:'长在一片土地上的许多树木',components:['木','木']},
  '森':{pinyin:'sēn',strokes:12,radical:'木',struct:'品字形结构',meaning:'树木众多',components:['木','木','木']},
  '花':{pinyin:'huā',strokes:7,radical:'艹',struct:'上下结构',meaning:'植物的繁殖器官',components:['艹','化']},
  '草':{pinyin:'cǎo',strokes:9,radical:'艹',struct:'上下结构',meaning:'高等植物中栽培植物以外的草本植物',components:['艹','早']},
  '想':{pinyin:'xiǎng',strokes:13,radical:'心',struct:'上下结构',meaning:'思考、思索',components:['相','心']},
  '思':{pinyin:'sī',strokes:9,radical:'心',struct:'上下结构',meaning:'考虑、想',components:['田','心']},
  '问':{pinyin:'wèn',strokes:6,radical:'门',struct:'半包围结构',meaning:'有不知道或不明白的请人解答',components:['门','口']},
  '间':{pinyin:'jiān',strokes:7,radical:'门',struct:'半包围结构',meaning:'两段时间或两种事物之间',components:['门','日']},
  '同':{pinyin:'tóng',strokes:6,radical:'冂',struct:'半包围结构',meaning:'一样，没有差异',components:['冂','一','口']},
  '龙':{pinyin:'lóng',strokes:5,radical:'龙',struct:'独体字',meaning:'传说中的一种动物',components:['龙']},
  '凤':{pinyin:'fèng',strokes:4,radical:'几',struct:'半包围结构',meaning:'凤凰，传说中的百鸟之王',components:['几','又']},
  '呈':{pinyin:'chéng',strokes:7,radical:'口',struct:'上下结构',meaning:'显出、露出',components:['口','王']},
  '祥':{pinyin:'xiáng',strokes:10,radical:'礻',struct:'左右结构',meaning:'吉利',components:['礻','羊']},
  '你':{pinyin:'nǐ',strokes:7,radical:'亻',struct:'左右结构',meaning:'称对方',components:['亻','尔']},
  '他':{pinyin:'tā',strokes:5,radical:'亻',struct:'左右结构',meaning:'称自己和对方以外的男性',components:['亻','也']},
  '她':{pinyin:'tā',strokes:6,radical:'女',struct:'左右结构',meaning:'称自己和对方以外的女性',components:['女','也']},
  '水':{pinyin:'shuǐ',strokes:4,radical:'水',struct:'独体字',meaning:'无色透明的液体',components:['水']},
  '火':{pinyin:'huǒ',strokes:4,radical:'火',struct:'独体字',meaning:'物体燃烧时所发出的光和焰',components:['火']},
  '山':{pinyin:'shān',strokes:3,radical:'山',struct:'独体字',meaning:'地面形成的高耸的部分',components:['山']},
  '石':{pinyin:'shí',strokes:5,radical:'石',struct:'独体字',meaning:'构成地壳的矿物质硬块',components:['石']},
  '田':{pinyin:'tián',strokes:5,radical:'田',struct:'独体字',meaning:'种植农作物的土地',components:['田']},
  '口':{pinyin:'kǒu',strokes:3,radical:'口',struct:'独体字',meaning:'嘴',components:['口']},
  '日':{pinyin:'rì',strokes:4,radical:'日',struct:'独体字',meaning:'太阳',components:['日']},
  '月':{pinyin:'yuè',strokes:4,radical:'月',struct:'独体字',meaning:'月亮',components:['月']},
  '木':{pinyin:'mù',strokes:4,radical:'木',struct:'独体字',meaning:'树类植物的通称',components:['木']},
  '金':{pinyin:'jīn',strokes:8,radical:'金',struct:'上下结构',meaning:'一种金属元素',components:['金']},
  '木':{pinyin:'mù',strokes:4,radical:'木',struct:'独体字',meaning:'树木',components:['木']},
  '马':{pinyin:'mǎ',strokes:3,radical:'马',struct:'独体字',meaning:'哺乳动物',components:['马']},
  '鸟':{pinyin:'niǎo',strokes:5,radical:'鸟',struct:'独体字',meaning:'有羽毛、能飞的动物',components:['鸟']},
  '鱼':{pinyin:'yú',strokes:8,radical:'鱼',struct:'独体字',meaning:'生活在水中的脊椎动物',components:['鱼']},
  '牛':{pinyin:'niú',strokes:4,radical:'牛',struct:'独体字',meaning:'哺乳动物',components:['牛']},
  '羊':{pinyin:'yáng',strokes:6,radical:'羊',struct:'独体字',meaning:'哺乳动物',components:['羊']},
  '犬':{pinyin:'quǎn',strokes:4,radical:'犬',struct:'独体字',meaning:'狗',components:['犬']},
  '猫':{pinyin:'māo',strokes:11,radical:'犭',struct:'左右结构',meaning:'哺乳动物',components:['犭','苗']},
  '狗':{pinyin:'gǒu',strokes:8,radical:'犭',struct:'左右结构',meaning:'哺乳动物',components:['犭','句']},
  '想':{pinyin:'xiǎng',strokes:13,radical:'心',struct:'上下结构',meaning:'思考',components:['相','心']},
  '爱':{pinyin:'ài',strokes:10,radical:'爫',struct:'上下结构',meaning:'对人或事有深厚真挚的感情',components:['爫','冖','友']},
  '学':{pinyin:'xué',strokes:8,radical:'子',struct:'上下结构',meaning:'学习',components:['⺍','冖','子']},
  '天':{pinyin:'tiān',strokes:4,radical:'大',struct:'独体字',meaning:'在地面以上的高空',components:['天']},
  '地':{pinyin:'dì',strokes:6,radical:'土',struct:'左右结构',meaning:'人类生长活动的所在',components:['土','也']},
  '玄':{pinyin:'xuán',strokes:5,radical:'玄',struct:'上下结构',meaning:'深奥不容易理解的',components:['玄']},
  '黄':{pinyin:'huáng',strokes:11,radical:'黄',struct:'上中下结构',meaning:'像金子或向日葵花的颜色',components:['黄']},
  '魑':{pinyin:'chī',strokes:19,radical:'鬼',struct:'左右结构',meaning:'传说中山林里害人的妖怪',components:['鬼','离']},
  '魅':{pinyin:'mèi',strokes:14,radical:'鬼',struct:'左右结构',meaning:'传说中的鬼怪',components:['鬼','未']},
  '魍':{pinyin:'wǎng',strokes:17,radical:'鬼',struct:'左右结构',meaning:'传说中的水怪',components:['鬼','罔']},
  '魉':{pinyin:'liǎng',strokes:16,radical:'鬼',struct:'左右结构',meaning:'传说中的妖怪',components:['鬼','两']},
  '家':{pinyin:'jiā',strokes:10,radical:'宀',struct:'上下结构',meaning:'共同生活的眷属和他们所住的地方',components:['宀','豕']},
  '房':{pinyin:'fáng',strokes:8,radical:'户',struct:'半包围结构',meaning:'住人或放东西的建筑物',components:['户','方']},
  '树':{pinyin:'shù',strokes:9,radical:'木',struct:'左右结构',meaning:'木本植物的通称',components:['木','又','寸']},
  '河':{pinyin:'hé',strokes:8,radical:'氵',struct:'左右结构',meaning:'水道的通称',components:['氵','可']},
  '湖':{pinyin:'hú',strokes:12,radical:'氵',struct:'左右结构',meaning:'陆地上聚积的大水',components:['氵','胡']},
  '海':{pinyin:'hǎi',strokes:10,radical:'氵',struct:'左右结构',meaning:'靠近大陆，比洋小的水域',components:['氵','每']},
  '红':{pinyin:'hóng',strokes:6,radical:'纟',struct:'左右结构',meaning:'像鲜血的颜色',components:['纟','工']},
  '绿':{pinyin:'lǜ',strokes:11,radical:'纟',struct:'左右结构',meaning:'蓝和黄混合成的颜色',components:['纟','录']},
  '蓝':{pinyin:'lán',strokes:13,radical:'艹',struct:'上下结构',meaning:'用靛青染成的颜色',components:['艹','监']},
};

function analyzeChars(){
  const text=$('charInput').value.trim();
  if(!text){$('resultArea').classList.add('hidden');return}
  let html='';
  for(const ch of text){
    const c=charDB[ch];
    const strokes=c?c.strokes:ch.length>0?estimateStrokes(ch):0;
    const radical=c?c.radical:'—';
    const struct=c?c.struct:estimateStruct(ch);
    const meaning=c?c.meaning:'暂无数据';
    const pinyin=c?c.pinyin:'—';
    const components=c?c.components:[ch];
    const sInfo=structures[struct]||{desc:'',color:'#888'};
    html+=`<div class="cd">
      <div class="char-display">${ch}</div>
      <div class="gr">
        <div class="st"><div class="nm">${pinyin}</div><div class="lb">拼音</div></div>
        <div class="st"><div class="nm">${strokes}</div><div class="lb">笔画数</div></div>
        <div class="st"><div class="nm">${radical}</div><div class="lb">部首</div></div>
        <div class="st"><div class="nm" style="font-size:1rem;color:${sInfo.color}">${struct}</div><div class="lb">结构类型</div></div>
      </div>
      <div style="margin-top:12px">
        <span class="tag tag-blue">${struct}</span>
        <span class="tag tag-green">部首：${radical}</span>
        <span class="tag tag-yellow">笔画：${strokes}</span>
      </div>
      <div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px">
        <div style="font-size:.85rem;color:var(--text2);margin-bottom:4px">释义</div>
        <div style="font-size:.95rem">${meaning}</div>
      </div>
      <div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px">
        <div style="font-size:.85rem;color:var(--text2);margin-bottom:4px">结构说明</div>
        <div style="font-size:.9rem">${sInfo.desc}</div>
      </div>
      <div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px">
        <div style="font-size:.85rem;color:var(--text2);margin-bottom:4px">组成部件</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${components.map(cp=>'<span class="struct-box">'+cp+'</span>').join('')}</div>
      </div>
    </div>`;
  }
  $('resultArea').innerHTML=html;
  $('resultArea').classList.remove('hidden');
}

function estimateStrokes(ch){
  const code=ch.charCodeAt(0);
  if(code>=0x4E00&&code<=0x9FFF)return Math.floor(Math.random()*10)+2;
  return 1;
}

function estimateStruct(ch){
  const structs=['独体字','左右结构','上下结构','全包围结构','半包围结构'];
  const code=ch.charCodeAt(0);
  return structs[code%structs.length];
}

$('charInput').addEventListener('keydown',e=>{if(e.key==='Enter')analyzeChars()});
</script>
</body>
</html>
