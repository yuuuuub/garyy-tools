<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 每日计划</title>
<meta name="description" content="每日计划管理工具，规划一天的任务和时间安排">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:20pxpadding:16px;}
.ctn{max-width:600px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=time],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border);gap:8px}
.li:last-child{border-bottom:none}
.li.done .task-name{text-decoration:line-through;opacity:.5}
.task-time{font-size:.8rem;color:var(--accent);font-weight:600;min-width:48px}
.task-name{flex:1;font-size:.95rem}
.priority{padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:600}
.priority.high{background:var(--danger);color:#fff}
.priority.mid{background:var(--warn);color:#000}
.priority.low{background:var(--success);color:#fff}
.empty{color:var(--text2);text-align:center;padding:20px}
.day-nav{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:16px}
.day-nav button{padding:8px 16px;font-size:.85rem}
.day-label{font-size:1rem;font-weight:600;min-width:120px;text-align:center}
.summary{display:flex;gap:16px;font-size:.85rem;color:var(--text2);margin-bottom:8px;flex-wrap:wrap}
.summary span{display:flex;align-items:center;gap:4px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📅 每日计划">
<meta property="og:description" content="每日计划管理工具，规划一天的任务和时间安排">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📅 每日计划</h1><p>规划每一天，高效完成任务</p></div>

<div class="day-nav">
  <button class="sec" onclick="changeDay(-1)">◀</button>
  <span class="day-label" id="dayLabel"></span>
  <button class="sec" onclick="changeDay(1)">▶</button>
  <button class="sec" onclick="goToday()">今天</button>
</div>

<div class="cd"><h2>添加任务</h2>
<label>时间</label><input type="time" id="tTime">
<label>任务内容</label><input type="text" id="tName" placeholder="如：完成报告">
<label>优先级</label><select id="tPri"><option value="high">高</option><option value="mid" selected>中</option><option value="low">低</option></select>
<div class="bg"><button onclick="addTask()">添加任务</button></div></div>

<div class="summary" id="summary"></div>

<div class="cd"><h2>今日任务</h2><div id="taskList" class="empty">暂无任务</div></div>

<div class="cd"><h2>已完成</h2><div id="doneList" class="empty">暂无完成的任务</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let plans = JSON.parse(localStorage.getItem('dp_plans') || '{}');
let currentDate = new Date();

function key() { return currentDate.toISOString().slice(0, 10); }
function save() { plans[key()] = getTasks(); localStorage.setItem('dp_plans', JSON.stringify(plans)); }
function getTasks() { return plans[key()] || []; }

function changeDay(offset) { currentDate.setDate(currentDate.getDate() + offset); render(); }
function goToday() { currentDate = new Date(); render(); }

function addTask() {
  const name = $('tName').value.trim();
  if (!name) { alert('请输入任务内容'); return; }
  const tasks = getTasks();
  tasks.push({ id: Date.now(), time: $('tTime').value || '09:00', name, priority: $('tPri').value, done: false });
  tasks.sort((a, b) => a.time.localeCompare(b.time));
  plans[key()] = tasks;
  save(); render(); $('tName').value = '';
}

function toggleTask(id) {
  const tasks = getTasks();
  const t = tasks.find(x => x.id === id);
  if (t) t.done = !t.done;
  plans[key()] = tasks; save(); render();
}

function deleteTask(id) {
  plans[key()] = getTasks().filter(x => x.id !== id);
  save(); render();
}

function render() {
  const d = currentDate;
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  $('dayLabel').textContent = `${d.getMonth() + 1}月${d.getDate()}日 周${weekdays[d.getDay()]}`;

  const tasks = getTasks();
  const pending = tasks.filter(t => !t.done);
  const done = tasks.filter(t => t.done);
  const totalMin = pending.reduce((s, t) => { const [h, m] = t.time.split(':').map(Number); return s + h * 60 + m; }, 0);

  $('summary').innerHTML = `<span>📝 总计 ${tasks.length} 项</span><span>⏳ 待完成 ${pending.length} 项</span><span>✅ 已完成 ${done.length} 项</span>`;

  const priLabel = { high: '高', mid: '中', low: '低' };
  $('taskList').innerHTML = pending.length ? pending.map(t =>
    `<div class="li"><span class="task-time">${t.time}</span><span class="task-name">${t.name}</span><span class="priority ${t.priority}">${priLabel[t.priority]}</span><button style="padding:4px 10px;font-size:.8rem" onclick="toggleTask(${t.id})">✓</button><button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="deleteTask(${t.id})">删</button></div>`
  ).join('') : '<div class="empty">今日暂无任务</div>';

  $('doneList').innerHTML = done.length ? done.map(t =>
    `<div class="li done"><span class="task-time">${t.time}</span><span class="task-name">${t.name}</span><button class="sec" style="padding:4px 10px;font-size:.8rem" onclick="toggleTask(${t.id})">↩</button><button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="deleteTask(${t.id})">删</button></div>`
  ).join('') : '<div class="empty">暂无完成的任务</div>';
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
