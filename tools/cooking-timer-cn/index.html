<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⏱️ 烹饪计时器</title>
<meta property="og:title" content="⏱️ 烹饪计时器">
<meta property="og:description" content="⏱️ 烹饪计时器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="多任务烹饪计时器，支持预设计时、自定义和声音提醒">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#ef4444;--accent2:#dc2626;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#dc2626;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--blue:#0969da;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=number]{width:80px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;text-align:center}
input:focus{border-color:var(--accent)}
select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.green{background:var(--green)}.button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.timer-display{font-size:3.5rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;padding:30px 0;letter-spacing:2px}
.timer-display.running{color:var(--green)}.timer-display.paused{color:var(--yellow)}.timer-display.done{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.timer-ring{width:200px;height:200px;margin:0 auto;position:relative}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:6}
.timer-ring .bg-ring{stroke:var(--border)}
.timer-ring .fg-ring{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.timer-ring .center-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.timer-controls{display:flex;justify-content:center;gap:12px;margin:16px 0}
.timer-controls button{min-width:80px}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}
.preset-item{padding:12px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s}
.preset-item:hover{border-color:var(--accent);transform:translateY(-2px)}
.preset-item .emoji{font-size:1.5rem;margin-bottom:4px}
.preset-item .name{font-size:.85rem;font-weight:600}
.preset-item .time{font-size:.75rem;color:var(--text2)}
.timer-list{margin-top:12px}
.timer-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:10px;margin-bottom:8px;border:1px solid var(--border);transition:all .2s}
.timer-item.active{border-color:var(--accent)}
.timer-item.done{border-color:var(--green);opacity:.7}
.timer-item .info{flex:1}
.timer-item .name{font-weight:600;font-size:.95rem}
.timer-item .remaining{font-size:.8rem;color:var(--text2)}
.timer-item .time-big{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.timer-item .actions{display:flex;gap:4px}
.timer-item .actions button{padding:6px 10px;font-size:.8rem}
.custom-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.custom-row span{font-size:.9rem;color:var(--text2)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>⏱️ 烹饪计时器</h1><p>同时管理多个烹饪计时任务</p></div>

<div class="cd"><h2>➕ 新建计时器</h2>
<label>快速选择预设</label>
<div class="preset-grid" id="presets"></div>
<label>自定义时间</label>
<div class="custom-row">
<input type="number" id="cMin" min="0" max="999" value="0"><span>分</span>
<input type="number" id="cSec" min="0" max="59" value="0"><span>秒</span>
<input type="text" id="cName" placeholder="备注名称" style="flex:1;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none">
<button onclick="addTimer()">＋ 添加</button>
</div></div>

<div class="cd"><h2>🎛️ 当前计时器</h2>
<div class="timer-list" id="timerList"><div class="empty">暂无计时器，请添加</div></div>
<div class="bg" style="justify-content:center"><button class="sec" onclick="clearAll()">🗑️ 清空全部</button></div></div>
</div>
<script>
var DB='cooking_timer_cn',timers=[],intervals={},audioCtx=null;
var PRESETS=[
{emoji:'🥚',name:'煮鸡蛋',min:10,sec:0},{emoji:'🍝',name:'煮面条',min:8,sec:0},{emoji:'🍚',name:'蒸米饭',min:25,sec:0},
{emoji:'🥟',name:'煮饺子',min:8,sec:0},{emoji:'🍗',name:'烤鸡翅',min:25,sec:0},{emoji:'🥩',name:'煎牛排',min:4,sec:0},
{emoji:'🥦',name:'焯西兰花',min:1,sec:30},{emoji:'🐟',name:'蒸鱼',min:8,sec:0},{emoji:'🥘',name:'炖汤',min:60,sec:0},
{emoji:'🍞',name:'烤面包',min:15,sec:0},{emoji:'🍕',name:'烤披萨',min:12,sec:0},{emoji:'🫕',name:'火锅涮肉',min:0,sec:30}
];

function playSound(){
if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
[0,0.15,0.3].forEach(function(delay){
var osc=audioCtx.createOscillator();var gain=audioCtx.createGain();
osc.connect(gain);gain.connect(audioCtx.destination);
osc.frequency.value=880;osc.type='sine';
gain.gain.setValueAtTime(0.3,audioCtx.currentTime+delay);
gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+delay+0.15);
osc.start(audioCtx.currentTime+delay);osc.stop(audioCtx.currentTime+delay+0.15);
});
}
function formatTime(s){var m=Math.floor(s/60);var sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}
function addTimer(name,min,sec){
name=name||document.getElementById('cName').value.trim()||'计时器';
min=min||parseInt(document.getElementById('cMin').value)||0;
sec=sec||parseInt(document.getElementById('cSec').value)||0;
var total=min*60+sec;if(!total){alert('请设置时间');return;}
timers.push({id:Date.now(),name:name,total:total,remaining:total,status:'paused'});
document.getElementById('cName').value='';document.getElementById('cMin').value=0;document.getElementById('cSec').value=0;
render();
}
function startTimer(id){
var t=timers.find(function(x){return x.id===id});if(!t||t.status==='running')return;
t.status='running';
intervals[id]=setInterval(function(){
t.remaining--;
if(t.remaining<=0){t.remaining=0;t.status='done';clearInterval(intervals[id]);playSound();alert(t.name+' 时间到！');}
render();
},1000);
render();
}
function pauseTimer(id){var t=timers.find(function(x){return x.id===id});if(!t)return;t.status='paused';clearInterval(intervals[id]);render();}
function resetTimer(id){var t=timers.find(function(x){return x.id===id});if(!t)return;clearInterval(intervals[id]);t.remaining=t.total;t.status='paused';render();}
function removeTimer(id){clearInterval(intervals[id]);timers=timers.filter(function(x){return x.id!==id});render();}
function clearAll(){if(!confirm('清空全部计时器？'))return;Object.keys(intervals).forEach(function(id){clearInterval(intervals[id])});intervals={};timers=[];render();}
function render(){
var el=document.getElementById('timerList');
if(!timers.length){el.innerHTML='<div class="empty">暂无计时器，请添加</div>';return;}
el.innerHTML=timers.map(function(t){
var statusClass=t.status==='done'?'done':t.status==='running'?'active':'';
var display=t.status==='done'?'✅ 完成':formatTime(t.remaining);
var statusColor=t.status==='done'?'var(--green)':t.status==='running'?'var(--accent)':'var(--text2)';
var circ=2*Math.PI*80;
var offset=circ*(1-t.remaining/t.total);
var pct=Math.round(t.remaining/t.total*100);
return '<div class="timer-item '+statusClass+'">'+
'<div style="text-align:center;min-width:60px"><svg width="60" height="60" viewBox="0 0 180 180"><circle cx="90" cy="90" r="80" class="bg-ring" fill="none" stroke="var(--border)" stroke-width="6"/>'+
'<circle cx="90" cy="90" r="80" fill="none" stroke="'+statusColor+'" stroke-width="6" stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'" stroke-linecap="round" style="transform:rotate(-90deg);transform-origin:center"/></svg>'+
'<div style="font-size:.7rem;color:var(--text2);margin-top:-40px">'+pct+'%</div></div>'+
'<div class="info"><div class="name">'+t.name+'</div><div class="remaining">剩余 '+display+'</div></div>'+
'<div class="actions">'+(t.status==='running'?'<button class="sec" onclick="pauseTimer('+t.id+')">⏸</button>':
t.status==='done'?'<button onclick="resetTimer('+t.id+')">🔄</button>':
'<button onclick="startTimer('+t.id+')">▶</button>')+
'<button onclick="resetTimer('+t.id+')">↺</button>'+
'<button class="dng" onclick="removeTimer('+t.id+')">✕</button></div></div>';
}).join('');
}
function renderPresets(){
document.getElementById('presets').innerHTML=PRESETS.map(function(p){
return '<div class="preset-item" onclick="addTimer(\''+p.name+'\','+p.min+','+p.sec+')"><div class="emoji">'+p.emoji+'</div><div class="name">'+p.name+'</div><div class="time">'+(p.min>0?p.min+'分':'')+(p.sec>0?p.sec+'秒':'')+'</div></div>';
}).join('');
}
renderPresets();render();
</script>
</body>
</html>
