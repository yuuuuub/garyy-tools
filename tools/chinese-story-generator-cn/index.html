<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国故事生成器 - Chinese Story Generator</title>
<meta property="og:title" content="中国故事生成器 - Chinese Story Generator">
<meta property="og:description" content="中国故事生成器 - Chinese Story Generator - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线中国故事生成器 - 自动生成成语故事、寓言故事、民间传说等中国经典故事">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}
.container{max-width:800px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}
.input-group select:focus{border-color:var(--blue);outline:none}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:8px;margin-right:8px}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.story-display{padding:20px}
.story-title{font-size:1.3rem;font-weight:700;text-align:center;margin-bottom:4px}
.story-meta{text-align:center;font-size:.8rem;color:var(--text2);margin-bottom:16px}
.story-type{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;background:rgba(59,130,246,0.15);color:var(--blue);margin:0 4px}
.story-body{font-size:1rem;line-height:2;white-space:pre-line;margin:16px 0;padding:16px;background:var(--bg);border-radius:8px;border-left:3px solid var(--blue)}
.story-moral{padding:12px;background:var(--bg);border-radius:8px;margin-top:12px}
.story-moral h4{font-size:.9rem;color:var(--green);margin-bottom:4px}
.story-moral p{font-size:.85rem;color:var(--text2);line-height:1.6}
.story-examples{margin-top:8px}
.example-btn{display:inline-block;padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.8rem;margin:3px;color:var(--text)}
.example-btn:hover{border-color:var(--blue);color:var(--blue)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>📖 中国故事生成器</h1>
<p class="sub">自动生成中国经典故事</p>

<div class="card">
<div class="input-group">
<label>故事类型</label>
<select id="storyType">
<option value="chengyu">成语故事</option>
<option value="fable">寓言故事</option>
<option value="legend">民间传说</option>
<option value="idiom">典故故事</option>
<option value="folk">民间故事</option>
</select>
</div>
<div class="input-group">
<label>主题</label>
<select id="storyTheme">
<option value="wisdom">智慧</option>
<option value="moral">品德</option>
<option value="courage">勇气</option>
<option value="perseverance">坚持</option>
<option value="kindness">善良</option>
<option value="humor">幽默</option>
</select>
</div>
<button class="btn" onclick="generateStory()">✨ 生成故事</button>
<button class="btn btn-green" onclick="randomStory()">🎲 随机生成</button>
</div>

<div id="storyList" style="margin-top:12px"></div>
<div id="result"></div>
</div>
<script src="../i18n.js" defer></script>
<script>
var stories=[
{id:1,type:'chengyu',theme:'perseverance',title:'愚公移山',dynasty:'战国',source:'《列子·汤问》',
body:'太行、王屋二山，方七百里，高万仞。本在冀州之南，河阳之北。\n\n北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰："吾与汝毕力平险，指通豫南，达于汉阴，可乎？"杂然相许。\n\n其妻献疑曰："以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？"杂曰："投诸渤海之尾，隐土之北。"\n\n遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。\n\n河曲智叟笑而止之曰："甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？"\n\n北山愚公长息曰："汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉；子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？"\n\n河曲智叟亡以应。\n\n操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。',
moral:'只要有坚定的意志和持之以恒的精神，再大的困难也能克服。愚公的精神告诉我们：不畏艰难，坚持不懈，终能成功。'},
{id:2,type:'chengyu',theme:'wisdom',title:'刻舟求剑',dynasty:'战国',source:'《吕氏春秋·察今》',
body:'楚人有涉江者，其剑自舟中坠于水，遽契其舟，曰："是吾剑之所从坠。"舟止，从其所契者入水求之。舟已行矣，而剑不行，求剑若此，不亦惑乎？',
moral:'世界万物都在不断变化，不能用静止的眼光看待发展变化的事物。要根据实际情况灵活变通。'},
{id:3,type:'fable',theme:'humor',title:'守株待兔',dynasty:'战国',source:'《韩非子·五蠹》',
body:'宋人有耕者，田中有株，兔走触株，折颈而死，因释其耒而守株，冀复得兔，兔不可复得，而身为宋国笑。\n\n故事讲述了一个宋国农夫偶然看到一只兔子撞死在树桩上，便放下农具，每天守在树桩旁等待再有兔子撞死。结果兔子没有再来，他的田地也荒芜了，成为宋国人的笑柄。',
moral:'不要把偶然的幸运当作必然的规律，不劳而获终将一无所获。要通过自己的努力去创造价值。'},
{id:4,type:'legend',theme:'courage',title:'精卫填海',dynasty:'上古',source:'《山海经·北山经》',
body:'又北二百里，曰发鸠之山，其上多柘木，有鸟焉，其状如乌，文首，白喙，赤足，名曰："精卫"，其鸣自詨，是炎帝之少女，名曰女娃。女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以堙于东海。\n\n炎帝的女儿女娃在东海游泳时不幸溺水身亡。她的灵魂化作了一只名为精卫的鸟，每天从西山衔来小石子和树枝，投入东海，想要把大海填平。虽然大海浩瀚无边，精卫的力量微小，但她从未放弃，日复一日地坚持着。',
moral:'精卫填海的精神代表了不屈不挠、永不放弃的意志。即使面对看似不可能完成的任务，也要坚持努力。'},
{id:5,type:'fable',theme:'moral',title:'狐假虎威',dynasty:'战国',source:'《战国策·楚策》',
body:'荆宣王问群臣曰："吾闻北方之畏昭奚恤也，果诚何如？"群臣莫对。\n\n江乙对曰："虎求百兽而食之，得狐。狐曰：\'子无敢食我也！天帝使我长百兽。今子食我，是逆天帝命也。子以我为不信，吾为子先行，子随我后，观百兽之见我而敢不走乎？\'\n\n虎以为然，故遂与之行。兽见之皆走。虎不知兽畏己而走也，以为畏狐也。今王之地方五千里，带甲百万，而专属之昭奚恤。故北方之畏昭奚恤也，其实畏王之甲兵也，犹百兽之畏虎也。"',
moral:'比喻倚仗别人的威势来欺压人。真正的权威来自于自身的能力和实力，而非借助他人的力量。'},
{id:6,type:'idiom',theme:'kindness',title:'一诺千金',dynasty:'汉朝',source:'《史记·季布栾布列传》',
body:'季布者，楚人也。为气任侠，有名于楚。项籍使将兵，数窘汉王。及项羽灭，高祖购求布千金，敢有舍匿，罪三族。\n\n曹沫之将军也，为鲁将，与齐战，三败北。鲁庄公惧，乃献遂邑之地以和。犹复以为将。\n\n季布用事，名重天下。曹丘至，即揖季布曰："楚人谚曰\'得黄金百斤，不如得季布一诺\'，足下何以得此声于梁楚间哉？且仆楚人，足下亦楚人也。仆游扬足下之名于天下，顾不重邪？何足下距仆之深也！"季布乃大说，引入，留数月，为上客，厚送之。',
moral:'一个承诺价值千金，强调了诚信的重要性。做人要言而有信，信守承诺。'},
{id:7,type:'folk',theme:'perseverance',title:'夸父追日',dynasty:'上古',source:'《山海经·海外北经》',
body:'夸父与日逐走，入日；渴，欲得饮，饮于河、渭；河、渭不足，北饮大泽。未至，道渴而死。弃其杖，化为邓林。\n\n夸父族的首领夸父想要追赶太阳，与太阳赛跑。他一直追到太阳落山的地方，感到非常口渴，就喝干了黄河和渭水的水。但还是不够喝，又去北方喝大泽的水，还没有走到，就在半路上渴死了。他丢弃的手杖，化成了一片桃林（邓林）。',
moral:'夸父追日体现了古人征服自然的雄心壮志和不屈不挠的精神。虽然最终未能成功，但他的精神永远激励着后人。'},
{id:8,type:'chengyu',theme:'wisdom',title:'塞翁失马',dynasty:'西汉',source:'《淮南子·人间训》',
body:'近塞上之人，有善术者，马无故亡而入胡。人皆吊之，其父曰："此何遽不为福乎？"居数月，其马将胡骏马而归。人皆贺之，其父曰："此何遽不为祸乎？"家富良马，其子好骑，堕而折其髀。人皆吊之，其父曰："此何遽不为福乎？"居一年，胡人大入塞，丁壮者引弦而战。近塞之人，死者十九。此独以跛之故，父子相保。\n\n故福之为祸，祸之为福，化不可极，深不可测也。',
moral:'祸福相依，坏事可能变成好事，好事也可能变成坏事。要以辩证的眼光看待人生的得失。'},
{id:9,type:'fable',theme:'perseverance',title:'铁杵磨针',dynasty:'唐朝',source:'《方舆胜览》',
body:'磨针溪，在眉州象耳山下。世传李太白读书山中，未成，弃去。过小溪，逢老媪方磨铁杵，问之，曰："欲作针。"太白感其意，还卒业。\n\n故事说李白在山中读书，觉得学业太难，想要放弃。下山途中遇到一位老婆婆在溪边磨铁杵，李白问她做什么，老婆婆说要把铁杵磨成针。李白深受感动，回去继续完成了学业。',
moral:'只要功夫深，铁杵磨成针。只要有恒心和毅力，再困难的事情也能做成。'},
{id:10,type:'legend',theme:'kindness',title:'牛郎织女',dynasty:'上古',source:'民间传说',
body:'很久以前，有一个放牛的年轻人叫牛郎，他与一头老牛相依为命。老牛告诉他，天上的织女会下凡洗澡，牛郎可以趁机与织女相识。\n\n牛郎按照老牛的指引，果然遇到了美丽的织女。两人一见钟情，结为夫妻，过着幸福的生活，还生了一儿一女。\n\n但是，王母娘娘得知后非常愤怒，强行将织女带回天庭。牛郎披着老牛死后留下的牛皮，挑着两个孩子追赶。王母娘娘拔下头上的金簪，在天空划出一条银河，将牛郎和织女分隔两岸。\n\n他们的真情感动了喜鹊，每年七月初七，成千上万的喜鹊飞来搭成鹊桥，让牛郎织女在桥上相会。',
moral:'忠贞不渝的爱情能够感动天地。这个故事也体现了人们对美好爱情的向往和追求。'}
];

function generateStory(){
var type=document.getElementById('storyType').value;
var theme=document.getElementById('storyTheme').value;
var filtered=stories.filter(function(s){return s.type===type||s.theme===theme;});
if(filtered.length===0)filtered=stories;
var idx=Math.floor(Math.random()*filtered.length);
showStory(filtered[idx]);
showList(filtered.slice(0,5));
}

function randomStory(){
var idx=Math.floor(Math.random()*stories.length);
showStory(stories[idx]);
showList(stories.slice(0,5));
}

function showList(list){
var el=document.getElementById('storyList');
var html='<div class="card"><h3 style="font-size:.95rem;margin-bottom:12px;color:var(--blue)">📚 更多故事</h3>';
list.forEach(function(s){
html+='<button class="example-btn" onclick="showStory(stories['+(stories.indexOf(s))+'])">'+s.title+'</button>';
});
html+='</div>';
el.innerHTML=html;
}

function showStory(s){
var typeNames={chengyu:'成语故事',fable:'寓言故事',legend:'民间传说',idiom:'典故故事',folk:'民间故事'};
var html='<div class="card story-display">';
html+='<div class="story-title">'+s.title+'</div>';
html+='<div class="story-meta"><span class="story-type">'+typeNames[s.type]+'</span>';
html+=' '+s.dynasty+' | '+s.source+'</div>';
html+='<div class="story-body">'+s.body+'</div>';
html+='<div class="story-moral"><h4>💡 寓意</h4><p>'+s.moral+'</p></div>';
html+='<div style="text-align:center;padding-top:12px">';
html+='<button class="btn" onclick="copyStory(\''+s.title.replace(/'/g,"\\'")+'\')">📋 复制故事</button>';
html+='</div></div>';
document.getElementById('result').innerHTML=html;
}

function copyStory(title){
var s=stories.find(function(x){return x.title===title;});
if(!s)return;
var text=s.title+'\n\n'+s.body+'\n\n【寓意】'+s.moral;
navigator.clipboard.writeText(text).then(function(){alert('已复制故事');}).catch(function(){alert('复制失败');});
}
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
