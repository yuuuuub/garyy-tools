@media (max-width: 768px) {body { padding: 0 8px; }

.piano { height: 180px; }

<script>
(function() {
  let audioCtx = null;
  const activeOscillators = new Map();
  let masterGain = null;
  let sustainOn = false;
  const sustainedNotes = new Set();
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.connect(audioCtx.destination);
      masterGain.gain.value = 0.65;
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }
  function noteFreq(noteIndex) {
    return 440 * Math.pow(2, (noteIndex - 49) / 12);
  }
  let octaveOffset = 0;
  function getNoteIndex(semitone, baseOctave) {
    const base = 48;
    return base + octaveOffset * 12 + semitone;
  }
  const whiteKeys = [
    { id: 'C3',  semitone: 0,  octave: 3, label: 'C',  kb: 'A' },
    { id: 'D3',  semitone: 2,  octave: 3, label: 'D',  kb: 'S' },
    { id: 'E3',  semitone: 4,  octave: 3, label: 'E',  kb: 'D' },
    { id: 'F3',  semitone: 5,  octave: 3, label: 'F',  kb: 'F' },
    { id: 'G3',  semitone: 7,  octave: 3, label: 'G',  kb: 'G' },
    { id: 'A3',  semitone: 9,  octave: 3, label: 'A',  kb: 'H' },
    { id: 'B3',  semitone: 11, octave: 3, label: 'B',  kb: 'J' },
    { id: 'C4',  semitone: 12, octave: 4, label: 'C',  kb: 'K' },
    { id: 'D4',  semitone: 14, octave: 4, label: 'D',  kb: 'L' },
    { id: 'E4',  semitone: 16, octave: 4, label: 'E',  kb: ';' },
    { id: 'F4',  semitone: 17, octave: 4, label: 'F',  kb: '\'' },
  ];
  const blackKeys = [
    { id: 'C#3', semitone: 1,  octave: 3, label: 'C#', kb: 'W', afterWhite: 'C3' },
    { id: 'D#3', semitone: 3,  octave: 3, label: 'D#', kb: 'E', afterWhite: 'D3' },
    { id: 'F#3', semitone: 6,  octave: 3, label: 'F#', kb: 'T', afterWhite: 'F3' },
    { id: 'G#3', semitone: 8,  octave: 3, label: 'G#', kb: 'Y', afterWhite: 'G3' },
    { id: 'A#3', semitone: 10, octave: 3, label: 'A#', kb: 'U', afterWhite: 'A3' },
    { id: 'C#4', semitone: 13, octave: 4, label: 'C#', kb: 'O', afterWhite: 'C4' },
    { id: 'D#4', semitone: 15, octave: 4, label: 'D#', kb: 'P', afterWhite: 'D4' },
  ];
  const allKeys = [...whiteKeys.map(w => ({ ...w, color: 'white' })), ...blackKeys.map(b => ({ ...b, color: 'black' }))];
  const envelope = { attack: 0.008, decay: 0.1, sustain: 0.55, release: 0.9 };
  function playNote(noteId) {
    initAudio();
    const keyData = allKeys.find(k => k.id === noteId);
    if (!keyData) return;
    stopNote(noteId);
    const time = audioCtx.currentTime;
    const freq = noteFreq(getNoteIndex(keyData.semitone, keyData.octave));
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'triangle';
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.value = freq;
    gain2.gain.value = 1.0;
    osc2.connect(gain2);
    const combinedGain = audioCtx.createGain();
    gainNode.connect(combinedGain);
    gain2.connect(combinedGain);
    combinedGain.connect(masterGain);
    osc.frequency.value = freq;
    const g = combinedGain.gain;
    g.setValueAtTime(0, time);
    g.linearRampToValueAtTime(1.0, time + envelope.attack);
    g.linearRampToValueAtTime(envelope.sustain, time + envelope.attack + envelope.decay);
    const osc3 = audioCtx.createOscillator();
    const gain3 = audioCtx.createGain();
    osc3.type = 'sine';
    osc3.frequency.value = freq * 0.5;
    gain3.gain.value = 0.3;
    osc3.connect(gain3);
    gain3.connect(combinedGain);
    osc.start(time);
    osc2.start(time);
    osc3.start(time);
    activeOscillators.set(noteId, {
      osc, osc2, osc3,
      gainNode: combinedGain,
      gainNodes: [gainNode, gain2, gain3],
      keyData,
    });
    const keyEl = document.getElementById('key-' + noteId);
    if (keyEl) keyEl.classList.add('pressed');
  }
  function stopNote(noteId, immediate = false) {
    const entry = activeOscillators.get(noteId);
    if (!entry) return;
    if (sustainOn && !immediate) {
      sustainedNotes.add(noteId);
      return;
    }
    const time = audioCtx.currentTime;
    const releaseTime = immediate ? 0.01 : envelope.release;
    try {
      entry.gainNode.gain.setValueAtTime(entry.gainNode.gain.value || envelope.sustain, time);
      entry.gainNode.gain.linearRampToValueAtTime(0, time + releaseTime);
    } catch (e) {}
    setTimeout(() => {
      try {
        entry.osc.stop(audioCtx.currentTime + 0.1);
        entry.osc2.stop(audioCtx.currentTime + 0.1);
        entry.osc3.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}
    }, releaseTime * 1000 + 100);
    activeOscillators.delete(noteId);
    sustainedNotes.delete(noteId);
    const keyEl = document.getElementById('key-' + noteId);
    if (keyEl) keyEl.classList.remove('pressed');
  }
  function releaseSustain() {
    const notesToRelease = [...sustainedNotes];
    sustainedNotes.clear();
    notesToRelease.forEach(noteId => stopNote(noteId, false));
  }
  function stopAllNotes() {
    const allNoteIds = [...activeOscillators.keys()];
    allNoteIds.forEach(noteId => stopNote(noteId, true));
    sustainedNotes.clear();
  }
  const pianoEl = document.getElementById('piano');
  function buildPiano() {
    pianoEl.innerHTML = '';
    whiteKeys.forEach(wk => {
      const el = document.createElement('div');
      el.className = 'key white-key';
      el.id = 'key-' + wk.id;
      el.dataset.note = wk.id;
      el.innerHTML = `<span class="note-label">${wk.label}${wk.octave}</span><span class="keyboard-hint">${wk.kb}</span>`;
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        playNote(wk.id);
      });
      el.addEventListener('mouseup', () => stopNote(wk.id));
      el.addEventListener('mouseleave', () => stopNote(wk.id));
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        playNote(wk.id);
      });
      el.addEventListener('touchend', (e) => {
        e.preventDefault();
        stopNote(wk.id);
      });
      pianoEl.appendChild(el);
    });
    const whiteKeyEls = pianoEl.querySelectorAll('.white-key');
    const whiteKeyArray = Array.from(whiteKeyEls);
    blackKeys.forEach(bk => {
      const el = document.createElement('div');
      el.className = 'key black-key';
      el.id = 'key-' + bk.id;
      el.dataset.note = bk.id;
      el.innerHTML = `<span class="note-label">${bk.label}${bk.octave}</span><span class="keyboard-hint">${bk.kb}</span>`;
      const afterIndex = whiteKeys.findIndex(w => w.id === bk.afterWhite);
      if (afterIndex >= 0 && afterIndex < whiteKeyArray.length) {
        const refKey = whiteKeyArray[afterIndex];
        el.style.left = (refKey.offsetLeft + refKey.offsetWidth - 16) + 'px';
      }
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        playNote(bk.id);
      });
      el.addEventListener('mouseup', () => stopNote(bk.id));
      el.addEventListener('mouseleave', () => stopNote(bk.id));
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        playNote(bk.id);
      });
      el.addEventListener('touchend', (e) => {
        e.preventDefault();
        stopNote(bk.id);
      });
      pianoEl.appendChild(el);
    });
  }
  let resizeTimeout;
  function repositionBlackKeys() {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      const whiteKeyEls = pianoEl.querySelectorAll('.white-key');
      const whiteKeyArray = Array.from(whiteKeyEls);
      blackKeys.forEach(bk => {
        const el = document.getElementById('key-' + bk.id);
        if (!el) return;
        const afterIndex = whiteKeys.findIndex(w => w.id === bk.afterWhite);
        if (afterIndex >= 0 && afterIndex < whiteKeyArray.length) {
          const refKey = whiteKeyArray[afterIndex];
          el.style.left = (refKey.offsetLeft + refKey.offsetWidth - 16) + 'px';
        }
      });
    }, 150);
  }
  window.addEventListener('resize', repositionBlackKeys);
  buildPiano();
  setTimeout(repositionBlackKeys, 50);
  const kbToNote = {};
  whiteKeys.forEach(w => { kbToNote[w.kb.toLowerCase()] = w.id; });
  blackKeys.forEach(b => { kbToNote[b.kb.toLowerCase()] = b.id; });
  const pressedKeys = new Set();
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
    const key = e.key.toLowerCase();
    const noteId = kbToNote[key];
    if (!noteId) return;
    e.preventDefault();
    if (pressedKeys.has(noteId)) return;
    pressedKeys.add(noteId);
    playNote(noteId);
    if (isRecording) {
      recordEvent({ type: 'noteOn', noteId, time: audioCtx ? audioCtx.currentTime : performance.now() / 1000 });
    }
  });
  document.addEventListener('keyup', (e) => {
    const key = e.key.toLowerCase();
    const noteId = kbToNote[key];
    if (!noteId) return;
    e.preventDefault();
    pressedKeys.delete(noteId);
    stopNote(noteId);
    if (isRecording) {
      recordEvent({ type: 'noteOff', noteId, time: audioCtx ? audioCtx.currentTime : performance.now() / 1000 });
    }
  });
  const origPlayNote = playNote;
  const origStopNote = stopNote;
  playNote = function(noteId) {
    origPlayNote(noteId);
    if (isRecording) {
      recordEvent({ type: 'noteOn', noteId, time: audioCtx ? audioCtx.currentTime : performance.now() / 1000 });
    }
  };
  stopNote = function(noteId, immediate) {
    origStopNote(noteId, immediate);
    if (isRecording) {
      recordEvent({ type: 'noteOff', noteId, time: audioCtx ? audioCtx.currentTime : performance.now() / 1000 });
    }
  };
  let isRecording = false;
  let recordedEvents = [];
  let recordStartTime = 0;
  function recordEvent(event) {
    recordedEvents.push({ ...event, time: event.time - recordStartTime });
  }
  const recordBtn = document.getElementById('recordBtn');
  const playbackBtn = document.getElementById('playbackBtn');
  const stopBtn = document.getElementById('stopBtn');

      stopBtn.disabled = true;
      if (recordedEvents.length > 0) {

      }

      isRecording = true;
      recordBtn.classList.add('active');
      recordBtn.textContent = '停止录制';
      recordingStatus.style.display = 'inline';
      stopBtn.disabled = false;
      playbackBtn.disabled = true;
      playingStatus.style.display = 'none';
    }
  });
  let playbackTimer = null;
  let isPlayingBack = false;
  playbackBtn.addEventListener('click', () => {
    if (isPlayingBack) return;

    initAudio();
    isPlayingBack = true;
    playbackBtn.classList.add('active');
    playbackBtn.textContent = '回放中...';
    playbackBtn.disabled = true;
    playingStatus.style.display = 'inline';
    stopBtn.disabled = false;
    recordBtn.disabled = true;
    const startTime = audioCtx.currentTime;
    let eventIndex = 0;
    function scheduleNext() {
      if (!isPlayingBack) return;
      while (eventIndex < recordedEvents.length) {
        const evt = recordedEvents[eventIndex];
        const scheduleTime = startTime + evt.time;
        const now = audioCtx.currentTime;
        if (scheduleTime <= now + 0.05) {
          if (evt.type === 'noteOn') {
            playNote(evt.noteId);
          } else if (evt.type === 'noteOff') {
            stopNote(evt.noteId);
          }
          eventIndex++;
        } else {
          const delay = (scheduleTime - now) * 1000;
          playbackTimer = setTimeout(() => {
            scheduleNext();
          }, Math.max(delay, 5));
          return;
        }
      }
      stopPlayback();
    }
    scheduleNext();
  });
  function stopPlayback() {
    isPlayingBack = false;
    if (playbackTimer) clearTimeout(playbackTimer);
    playbackTimer = null;
    stopAllNotes();
    playbackBtn.classList.remove('active');
    playbackBtn.textContent = '回放';
    playbackBtn.disabled = false;
    playingStatus.style.display = 'none';
    stopBtn.disabled = true;
    recordBtn.disabled = false;
    if (isRecording) {

      recordBtn.classList.remove('active');
      recordBtn.textContent = '录制';
      recordingStatus.style.display = 'none';
    }
  }

    if (!songKey || !songs[songKey]) return;
    initAudio();
    if (currentSongPlayer) {
      currentSongPlayer.stop();
    }
    const song = songs[songKey];
    const beatDuration = 60 / song.tempo;
    let noteIndex = 0;
    let noteTimers = [];
    let stopped = false;
    playSongBtn.classList.add('active');
    playSongBtn.textContent = '播放中...';
    function playNext() {
      if (stopped || noteIndex >= song.notes.length) {
        playSongBtn.classList.remove('active');
        playSongBtn.textContent = '播放';
        currentSongPlayer = null;
        return;
      }
      const n = song.notes[noteIndex];
      playNote(n.note);
      noteTimers.push(setTimeout(() => {
        stopNote(n.note);
      }, n.dur * beatDuration * 900));
      noteIndex++;
      noteTimers.push(setTimeout(() => {
        playNext();
      }, n.dur * beatDuration * 1000));
    }
    currentSongPlayer = {
      stop: () => {
        stopped = true;
        noteTimers.forEach(t => clearTimeout(t));
        stopAllNotes();
        playSongBtn.classList.remove('active');
        playSongBtn.textContent = '播放';
        currentSongPlayer = null;
      }
    };

  });
