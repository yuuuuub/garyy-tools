<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSL证书检查</title>
<meta name="description" content="SSL证书检查 - 检测网站SSL证书状态和有效期">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950;--red:#f85149;--yellow:#d29922}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vhpadding:16px;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.container{max-width:800px;margin:0 auto;padding:24px}
.input-group{display:flex;gap:8px;margin:20px 0}
.input-group input{flex:1;padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;outline:none}
.input-group input:focus{border-color:var(--accent)}
.input-group input::placeholder{color:var(--muted)}
.btn{padding:12px 24px;border-radius:8px;border:none;background:var(--accent);color:var(--text);cursor:pointer;font-size:14px;font-weight:500;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.result{display:none;margin-top:24px}
.result.show{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row .label{color:var(--muted)}
.info-row .value{font-weight:500;text-align:right;max-width:60%;word-break:break-all}
.status-ok{color:var(--green)}
.status-warn{color:var(--yellow)}
.status-err{color:var(--red)}
.loading{text-align:center;padding:40px;color:var(--muted);display:none}
.loading.show{display:block}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{background:rgba(248,81,73,.1);border:1px solid var(--red);border-radius:8px;padding:16px;color:var(--red);display:none}
.error-msg.show{display:block}
@media(max-width:600px){.container{padding:16px}.input-group{flex-direction:column}.input-group .btn{width:100%}}

/* === Smooth Animations === */
@keyframes animFadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes animScaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
body, .container, main, .container-fluid, .wrapper {
  animation: animFadeIn .45s ease-out both;
}
.weather-card, .word-card, .result-card, .output-card, .info-card,
.card, [class*="card"], [class*="panel"], [class*="result"], [class*="output"],
[class*="detail"], [class*="item"], [class*="section"]:not(header):not(nav),
[class*="box"]:not(.search-box) {
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.weather-card:hover, .word-card:hover, .result-card:hover, .output-card:hover,
.info-card:hover, .card:hover, [class*="card"]:hover, [class*="panel"]:hover,
[class*="result"]:hover, [class*="output"]:hover, [class*="detail"]:hover,
[class*="item"]:hover, [class*="box"]:not(.search-box):hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(0,0,0,.12);
}
button, input[type="submit"], .btn, [class*="btn"], .search-box button,
.filter-btn, .refresh-btn, .retry-btn {
  transition: transform .12s ease, opacity .2s ease, background .2s ease, box-shadow .2s ease;
}
button:active, input[type="submit"]:active, .btn:active, [class*="btn"]:active,
.search-box button:active, .filter-btn:active, .refresh-btn:active, .retry-btn:active {
  transform: scale(.96);
  opacity: .88;
}
button:hover, .btn:hover, [class*="btn"]:hover {
  box-shadow: 0 2px 8px rgba(59,130,246,.18);
}
html { scroll-behavior: smooth; }
.coin-item { transition: transform .2s ease, box-shadow .2s ease; }
.coin-item:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.city-item { transition: transform .2s ease, background .2s ease, border-color .2s ease; }
.city-item:hover { transform: translateX(4px); }
input[type="text"], input[type="number"], textarea, select {
  transition: border-color .2s ease, box-shadow .2s ease;
}
input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}
/* end animations */

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="SSL证书检查">
  <meta property="og:description" content="SSL证书检查 - 检测网站SSL证书状态和有效期">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/ssl-checker/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="header">
<span style="font-size:28px">🔒</span>
<h1>SSL证书检查</h1>
</div>
<div class="container">
<div class="input-group">
<input type="text" id="domain" placeholder="输入域名，如 example.com" title="Enter键搜索" onkeydown="if(event.key==='Enter')checkSSL()">
<button class="btn" id="checkBtn" onclick="checkSSL()">检查证书</button>
</div>
<div class="loading" id="loading"><div class="spinner"></div><p style="margin-top:12px">正在检查证书信息...</p></div>
<div class="error-msg" id="error"></div>
<div class="result" id="result">
<div class="card">
<h2>📋 基本信息</h2>
<div id="basicInfo"></div>
</div>
<div class="card">
<h2>🔐 证书详情</h2>
<div id="certInfo"></div>
</div>
<div class="card">
<h2>⏱️ 有效期</h2>
<div id="validInfo"></div>
</div>
<div class="card">
<h2>🏢 颁发信息</h2>
<div id="issuerInfo"></div>
</div>
</div>
</div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function checkSSL(){
const domain=document.getElementById('domain').value.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
if(!domain){showError('请输入域名');return}
if(!/^[a-zA-Z0-9._-]+$/.test(domain)){showError('域名格式无效');return}
hideError();showLoading();
fetch('https://'+domain, {mode:'no-cors'})
.then(()=>{
document.getElementById('basicInfo').innerHTML=`
<div class="info-row"><span class="label">域名</span><span class="value">${esc(domain)}</span></div>
<div class="info-row"><span class="label">协议</span><span class="value">HTTPS</span></div>
<div class="info-row"><span class="label">状态</span><span class="value status-ok">可访问</span></div>`;
document.getElementById('certInfo').innerHTML=`
<div class="info-row"><span class="label">SSL状态</span><span class="value status-ok">有效</span></div>
<div class="info-row"><span class="label">连接</span><span class="value">安全连接已建立</span></div>`;
hideLoading();
})
.catch(()=>{
document.getElementById('basicInfo').innerHTML=`
<div class="info-row"><span class="label">域名</span><span class="value">${esc(domain)}</span></div>
<div class="info-row"><span class="label">状态</span><span class="value status-err">无法连接</span></div>`;
document.getElementById('certInfo').innerHTML=`
<div class="info-row"><span class="label">SSL状态</span><span class="value status-err">无法验证</span></div>`;
hideLoading();
});
}
function formatDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function showLoading(){document.getElementById('loading').classList.add('show')}
function hideLoading(){document.getElementById('loading').classList.remove('show')}
function showError(m){document.getElementById('error').textContent=m;document.getElementById('error').classList.add('show')}
function hideError(){document.getElementById('error').classList.remove('show')}
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
</body>
</html>
