<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏛 国家百科</title>
<meta name="description" content="国家百科 - 查看世界各国的国旗、首都、人口、面积等详细信息">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6padding:16px;}
.ctn{max-width:1000px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text]{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.search-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-row input{flex:1;min-width:200px}
.search-row select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);min-width:120px}
.country-card{display:flex;align-items:center;gap:16px;padding:14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.country-card:hover{background:var(--bg)}
.country-card .flag-big{font-size:2rem}
.country-card .info{flex:1}
.country-card .name{font-weight:600;font-size:1rem}
.country-card .meta{font-size:.8rem;color:var(--text2)}
.country-card .arrow{color:var(--text2)}
.detail-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow);display:none}
.detail-panel.show{display:block}
.detail-header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.detail-header .flag-huge{font-size:4rem}
.detail-header h2{font-size:1.5rem}
.detail-header .sub{color:var(--text2);font-size:.9rem}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.info-grid .item{background:var(--bg);padding:12px;border-radius:8px}
.info-grid .item .label{font-size:.75rem;color:var(--text2);margin-bottom:2px}
.info-grid .item .val{font-size:1rem;font-weight:600}
.desc-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.desc-section p{color:var(--text2);line-height:1.8}
.es{text-align:center;padding:40px;color:var(--text2)}
.hidden{display:none}
.stat-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.stat-bar .fill{height:100%;border-radius:4px;background:var(--accent)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏛 国家百科</h1><p>世界各国详细信息，探索地球每个角落</p></div>

<div class="cd">
<div class="search-row">
<input type="text" id="search" placeholder="搜索国家名称..." oninput="filterCountries()">
<select id="continentFilter" onchange="filterCountries()">
<option value="">全部大洲</option>
<option value="亚洲">亚洲</option>
<option value="欧洲">欧洲</option>
<option value="北美洲">北美洲</option>
<option value="南美洲">南美洲</option>
<option value="非洲">非洲</option>
<option value="大洋洲">大洋洲</option>
</select>
<select id="sortBy" onchange="filterCountries()">
<option value="name">按名称</option>
<option value="population">按人口</option>
<option value="area">按面积</option>
</select>
</div>
<p style="color:var(--text2);font-size:.85rem;margin-bottom:8px">共 <span id="count">0</span> 个国家</p>
</div>

<div id="detailPanel" class="detail-panel"></div>

<div class="cd" id="listArea">
<div id="countryList"></div>
</div>
</div>

<script>

{name:'中国',flag:'🇨🇳',capital:'北京',continent:'亚洲',population:1411780000,area:9596961,gdp:17.7,lat:35.86,lng:104.2,language:'汉语',currency:'人民币 (CNY)',timezone:'UTC+8',phone:'+86',food:'北京烤鸭、火锅',landmark:'长城、故宫'},

{name:'澳大利亚',flag:'🇦🇺',capital:'堪培拉',continent:'大洋洲',population:25700000,area:7692024,gdp:1.68,lat:-25.27,lng:133.78,language:'英语',currency:'澳元 (AUD)',timezone:'UTC+8~+11',phone:'+61',food:'肉派、维吉麦',landmark:'悉尼歌剧院'},

{name:'新加坡',flag:'🇸🇬',capital:'新加坡',continent:'亚洲',population:5690000,area:728,gdp:0.4,lat:1.35,lng:103.82,language:'英语/华语/马来语',currency:'新加坡元 (SGD)',timezone:'UTC+8',phone:'+65',food:'海南鸡饭、辣椒蟹',landmark:'鱼尾狮公园'},

{name:'意大利',flag:'🇮🇹',capital:'罗马',continent:'欧洲',population:60400000,area:301336,gdp:2.01,lat:41.87,lng:12.57,language:'意大利语',currency:'欧元 (EUR)',timezone:'UTC+1',phone:'+39',food:'披萨、意面',landmark:'罗马斗兽场'},
{name:'西班牙',flag:'🇪🇸',capital:'马德里',continent:'欧洲',population:46700000,area:505990,gdp:1.4,lat:40.46,lng:-3.75,language:'西班牙语',currency:'欧元 (EUR)',timezone:'UTC+1',phone:'+34',food:'海鲜饭、火腿',landmark:'圣家堂'},
{name:'荷兰',flag:'🇳🇱',capital:'阿姆斯特丹',continent:'欧洲',population:17400000,area:41543,gdp:1.01,lat:52.13,lng:5.29,language:'荷兰语',currency:'欧元 (EUR)',timezone:'UTC+1',phone:'+31',food:'奶酪、煎饼',landmark:'风车村'},
{name:'瑞典',flag:'🇸🇪',capital:'斯德哥尔摩',continent:'欧洲',population:10100000,area:450295,gdp:0.59,lat:60.13,lng:18.64,language:'瑞典语',currency:'瑞典克朗 (SEK)',timezone:'UTC+1',phone:'+46',food:'肉丸、虾三明治',landmark:'瓦萨沉船博物馆'},
{name:'墨西哥',flag:'🇲🇽',capital:'墨西哥城',continent:'北美洲',population:129000000,area:1964375,gdp:1.32,lat:23.63,lng:-102.55,language:'西班牙语',currency:'墨西哥比索 (MXN)',timezone:'UTC-6~-8',phone:'+52',food:'玉米饼、塔可',landmark:'奇琴伊察'},
{name:'土耳其',flag:'🇹🇷',capital:'安卡拉',continent:'亚洲',population:84300000,area:783562,gdp:0.91,lat:38.96,lng:35.24,language:'土耳其语',currency:'土耳其里拉 (TRY)',timezone:'UTC+3',phone:'+90',food:'烤肉、冰淇淋',landmark:'圣索菲亚大教堂'},
{name:'阿联酋',flag:'🇦🇪',capital:'阿布扎比',continent:'亚洲',population:9900000,area:83600,gdp:0.51,lat:23.42,lng:53.85,language:'阿拉伯语',currency:'迪拉姆 (AED)',timezone:'UTC+4',phone:'+971',food:'烤骆驼、鹰嘴豆泥',landmark:'哈利法塔'},
{name:'新西兰',flag:'🇳🇿',capital:'惠灵顿',continent:'大洋洲',population:5080000,area:268021,gdp:0.25,lat:-40.9,lng:174.89,language:'英语/毛利语',currency:'新西兰元 (NZD)',timezone:'UTC+12',phone:'+64',food:'新西兰羊肉',landmark:'米尔福德峡湾'},
{name:'挪威',flag:'🇳🇴',capital:'奥斯陆',continent:'欧洲',population:5400000,area:323802,gdp:0.58,lat:60.47,lng:8.47,language:'挪威语',currency:'挪威克朗 (NOK)',timezone:'UTC+1',phone:'+47',food:'三文鱼、肉丸',landmark:'峡湾'},
{name:'沙特阿拉伯',flag:'🇸🇦',capital:'利雅得',continent:'亚洲',population:34800000,area:2149690,gdp:1.11,lat:23.89,lng:45.08,language:'阿拉伯语',currency:'沙特里亚尔 (SAR)',timezone:'UTC+3',phone:'+966',food:'烤全羊、库纳法',landmark:'麦加清真寺'}
];

const maxPop=Math.max(...countries.map(c=>c.population));
const maxArea=Math.max(...countries.map(c=>c.area));
function $(id){return document.getElementById(id)}

function filterCountries(){
  const q($('search').value.toLowerCase()),cont=$('continentFilter').value,sort=$('sortBy').value;
  let list=countries.filter(c=>(!q||c.name.includes(q)||c.capital.includes(q))&&(!cont||c.continent===cont));
  if(sort==='population')list.sort((a,b)=>b.population-a.population);
  else if(sort==='area')list.sort((a,b)=>b.area-a.area);
  else list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  $('count').textContent=list.length;
  const el=$('countryList');
  if(!list.length){el.innerHTML='<div class="es">没有找到匹配的国家</div>';return}
  el.innerHTML=list.map((c,i)=>{
    const idx=countries.indexOf(c);
    const popStr=c.population>=1e8?(c.population/1e8).toFixed(2)+'亿':c.population>=1e4?(c.population/1e4).toFixed(0)+'万':c.population;
    return '<div class="country-card" onclick="showDetail('+idx+')"><span class="flag-big">'+c.flag+'</span><div class="info"><div class="name">'+c.name+'</div><div class="meta">'+c.capital+' · '+c.continent+' · 人口:'+popStr+'</div></div><span class="arrow">→</span></div>';
  }).join('');
}

function showDetail(i){
  const c=countries[i];$('detailPanel').className='detail-panel show';
  const popStr=c.population>=1e8?(c.population/1e8).toFixed(2)+'亿':c.population>=1e4?(c.population/1e4).toFixed(0)+'万':c.population;
  const popPct=Math.round(c.population/maxPop*100),areaPct=Math.round(c.area/maxArea*100);
  $('detailPanel').innerHTML='<div class="detail-header"><span class="flag-huge">'+c.flag+'</span><div><h2>'+c.name+'</h2><div class="sub">'+c.continent+' · '+c.capital+'</div></div></div><div class="info-grid"><div class="item"><div class="label">首都</div><div class="val">'+c.capital+'</div></div><div class="item"><div class="label">人口</div><div class="val">'+popStr+'</div><div class="stat-bar"><div class="fill" style="width:'+popPct+'%"></div></div></div><div class="item"><div class="label">面积</div><div class="val">'+c.area.toLocaleString()+' km²</div><div class="stat-bar"><div class="fill" style="width:'+areaPct+'%"></div></div></div><div class="item"><div class="label">GDP</div><div class="val">'+c.gdp+' 万亿$</div></div><div class="item"><div class="label">语言</div><div class="val">'+c.language+'</div></div><div class="item"><div class="label">货币</div><div class="val">'+c.currency+'</div></div><div class="item"><div class="label">时区</div><div class="val">'+c.timezone+'</div></div><div class="item"><div class="label">电话区号</div><div class="val">'+c.phone+'</div></div></div><div class="desc-section"><h2 style="font-size:1rem;margin-bottom:8px">特色</h2><p><strong>美食：</strong>'+c.food+'</p><p><strong>地标：</strong>'+c.landmark+'</p></div>';
  $('detailPanel').scrollIntoView({behavior:'smooth'});
}

filterCountries();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
