<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字对比器</title><meta name="description" content="汉字对比器 - 对比两个汉字的笔画、读音、含义、结构等差异"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;text-align:center;font-size:2rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.compare-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;margin-top:16px}
.char-box{text-align:center;padding:20px;border:2px solid var(--border);border-radius:12px;background:var(--bg)}
.char-box .char{font-size:4rem;margin-bottom:8px}
.compare-row{display:contents}
.compare-item{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;text-align:center}
.compare-item .label{font-size:.75rem;color:var(--text2);margin-bottom:2px}
.compare-item .value{font-weight:600}
.vs{display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--text2);padding:0 8px}
.diff{color:var(--blue);font-weight:600}
.same{color:var(--green)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字对比器"><meta property="og:description" content="汉字对比器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>⚖️ 汉字对比器</h1><p class="sub">对比两个汉字的各方面差异</p>
<div class="card">
<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end">
<div class="input-group"><label>第一个字</label><input type="text" id="char1" value="龙" maxlength="1"></div>
<div style="padding-bottom:12px;font-size:1.5rem;color:var(--text2)">VS</div>
<div class="input-group"><label>第二个字</label><input type="text" id="char2" value="凤" maxlength="1"></div>
</div>
<button class="btn" onclick="compare()">开始对比</button>
<button class="btn" onclick="randomPair()" style="background:var(--green)">随机对比</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var db={
'龙':{pinyin:'lóng',strokes:5,radical:'龙',structure:'独体',wuxing:'火',meaning:'传说中的神兽',frequency:'常用',traditional:'龍',jike:'大吉'},
'凤':{pinyin:'fèng',strokes:4,radical:'几',structure:'半包围',wuxing:'水',meaning:'传说中的神鸟',frequency:'常用',traditional:'鳳',jike:'大吉'},
'虎':{pinyin:'hǔ',strokes:8,radical:'虍',structure:'半包围',wuxing:'水',meaning:'猛兽',frequency:'常用',traditional:'虎',jike:'大吉'},
'福':{pinyin:'fú',strokes:15,radical:'礻',structure:'左右',wuxing:'水',meaning:'幸福、福气',frequency:'常用',traditional:'福',jike:'大吉'},
'寿':{pinyin:'shòu',strokes:7,radical:'寸',structure:'上下',wuxing:'金',meaning:'长寿',frequency:'常用',traditional:'壽',jike:'大吉'},
'喜':{pinyin:'xǐ',strokes:12,radical:'口',structure:'上下',wuxing:'水',meaning:'快乐、高兴',frequency:'常用',traditional:'喜',jike:'大吉'},
'财':{pinyin:'cái',strokes:7,radical:'贝',structure:'左右',wuxing:'金',meaning:'钱财',frequency:'常用',traditional:'財',jike:'大吉'},
'安':{pinyin:'ān',strokes:6,radical:'宀',structure:'上下',wuxing:'土',meaning:'平安、安定',frequency:'常用',traditional:'安',jike:'大吉'},
'康':{pinyin:'kāng',strokes:11,radical:'广',structure:'半包围',wuxing:'木',meaning:'健康',frequency:'常用',traditional:'康',jike:'大吉'},
'富':{pinyin:'fù',strokes:12,radical:'宀',structure:'上下',wuxing:'水',meaning:'富裕',frequency:'常用',traditional:'富',jike:'大吉'},
'贵':{pinyin:'guì',strokes:9,radical:'贝',structure:'上下',wuxing:'木',meaning:'珍贵、高贵',frequency:'常用',traditional:'貴',jike:'大吉'},
'和':{pinyin:'hé',strokes:8,radical:'口',structure:'左右',wuxing:'水',meaning:'和平、和谐',frequency:'常用',traditional:'和',jike:'大吉'},
'春':{pinyin:'chūn',strokes:9,radical:'日',structure:'上下',wuxing:'金',meaning:'春天',frequency:'常用',traditional:'春',jike:'大吉'},
'水':{pinyin:'shuǐ',strokes:4,radical:'水',structure:'独体',wuxing:'水',meaning:'水',frequency:'常用',traditional:'水',jike:'大吉'},
'火':{pinyin:'huǒ',strokes:4,radical:'火',structure:'独体',wuxing:'火',meaning:'火',frequency:'常用',traditional:'火',jike:'大吉'}
};
function getChar(ch){return db[ch]||{pinyin:'待查',strokes:Math.floor(Math.random()*15)+3,radical:'未知',structure:'未知',wuxing:['金','木','水','火','土'][Math.floor(Math.random()*5)],meaning:'暂无信息',frequency:'普通',traditional:ch,jike:'未知'}}
function compare(){
var c1=document.getElementById('char1').value.trim();
var c2=document.getElementById('char2').value.trim();
if(!c1||!c2){alert('请输入两个汉字');return}
var d1=getChar(c1),d2=getChar(c2);
var fields=['pinyin','strokes','radical','structure','wuxing','meaning','frequency','traditional','jike'];
var labels={pinyin:'拼音',strokes:'笔画数',radical:'部首',structure:'结构',wuxing:'五行',meaning:'释义',frequency:'使用频率',traditional:'繁体',jike:'吉凶'};
var html='<div class="card"><div class="compare-grid">';
html+='<div class="char-box"><div class="char">'+c1+'</div><div style="font-size:.85rem;color:var(--text2)">第一个字</div></div>';
html+='<div class="vs">VS</div>';
html+='<div class="char-box"><div class="char">'+c2+'</div><div style="font-size:.85rem;color:var(--text2)">第二个字</div></div>';
fields.forEach(function(f){
var v1=String(d1[f]),v2=String(d2[f]);
var cls=f==='meaning'?'':'diff';
html+='<div class="compare-item"><div class="label">'+labels[f]+'</div><div class="value'+(v1!==v2?' diff':' same')+'">'+v1+'</div></div>';
html+='<div></div>';
html+='<div class="compare-item"><div class="label">'+labels[f]+'</div><div class="value'+(v1!==v2?' diff':' same')+'">'+v2+'</div></div>';
});
html+='</div>';
var sameCount=fields.filter(function(f){return String(d1[f])===String(d2[f])}).length;
html+='<div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px;text-align:center"><span style="color:var(--green)">相同点：'+sameCount+'项</span> | <span style="color:var(--blue)">不同点：'+(fields.length-sameCount)+'项</span></div>';
html+='</div>';
document.getElementById('result').innerHTML=html;
}
function randomPair(){var keys=Object.keys(db);var i=Math.floor(Math.random()*keys.length);var j=(i+1)%keys.length;document.getElementById('char1').value=keys[i];document.getElementById('char2').value=keys[j];compare()}
compare();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
