<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="色彩对比度检查工具 - 检查颜色对比度是否符合无障碍标准">
    <meta name="robots" content="index, follow">
    <title>色彩对比度检查工具</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #dee2e6;
            --card-bg: #f8f9fa;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #444444;
            --card-bg: #2d2d2d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="color"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-family: monospace;
        }
        input[type="color"] {
            height: 50px;
            cursor: pointer;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
        }
        .preview {
            padding: 20px;
            border-radius: 4px;
            text-align: center;
            font-size: 18px;
            margin: 15px 0;
        }
        .contrast-info {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .contrast-item {
            flex: 1;
            min-width: 150px;
            padding: 10px;
            border-radius: 4px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }
        .contrast-ratio {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }
        .wcag-results {
            margin-top: 15px;
        }
        .wcag-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .wcag-item:last-child {
            border-bottom: none;
        }
        .wcag-pass {
            color: var(--success-color);
            font-weight: bold;
        }
        .wcag-fail {
            color: var(--danger-color);
            font-weight: bold;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .color-inputs {
            display: flex;
            gap: 20px;
        }
        .color-inputs .form-group {
            flex: 1;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>色彩对比度检查工具</h1>
        <p>检查前景色和背景色的对比度是否符合WCAG标准</p>
        
        <div class="color-inputs">
            <div class="form-group">
                <label for="fgColor">前景色:</label>
                <input type="color" id="fgColor" value="#000000">
                <input type="text" id="fgColorText" value="#000000" placeholder="#000000">
            </div>
            
            <div class="form-group">
                <label for="bgColor">背景色:</label>
                <input type="color" id="bgColor" value="#ffffff">
                <input type="text" id="bgColorText" value="#ffffff" placeholder="#ffffff">
            </div>
        </div>
        
        <div class="form-group">
            <label for="sampleText">示例文本:</label>
            <input type="text" id="sampleText" value="这是示例文本 The quick brown fox" placeholder="输入示例文本">
        </div>
        
        <button onclick="checkContrast()">检查对比度</button>
        
        <div id="result" class="result" style="display: none;">
            <h2>检查结果</h2>
            <div id="preview" class="preview"></div>
            
            <div class="contrast-info">
                <div class="contrast-item">
                    <div>对比度</div>
                    <div id="contrastRatio" class="contrast-ratio"></div>
                </div>
                <div class="contrast-item">
                    <div>前景色亮度</div>
                    <div id="fgLuminance"></div>
                </div>
                <div class="contrast-item">
                    <div>背景色亮度</div>
                    <div id="bgLuminance"></div>
                </div>
            </div>
            
            <div class="wcag-results">
                <h3>WCAG 2.1 标准</h3>
                <div class="wcag-item">
                    <span>AA级 普通文本 (4.5:1)</span>
                    <span id="aa-normal"></span>
                </div>
                <div class="wcag-item">
                    <span>AA级 大文本 (3:1)</span>
                    <span id="aa-large"></span>
                </div>
                <div class="wcag-item">
                    <span>AAA级 普通文本 (7:1)</span>
                    <span id="aaa-normal"></span>
                </div>
                <div class="wcag-item">
                    <span>AAA级 大文本 (4.5:1)</span>
                    <span id="aaa-large"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="i18n.js" defer></script>
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            html.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
        }

        // 同步颜色输入
        document.getElementById('fgColor').addEventListener('input', function() {
            document.getElementById('fgColorText').value = this.value;
        });
        document.getElementById('fgColorText').addEventListener('input', function() {
            if (/^#[0-9A-Fa-f]{6}$/.test(this.value)) {
                document.getElementById('fgColor').value = this.value;
            }
        });
        document.getElementById('bgColor').addEventListener('input', function() {
            document.getElementById('bgColorText').value = this.value;
        });
        document.getElementById('bgColorText').addEventListener('input', function() {
            if (/^#[0-9A-Fa-f]{6}$/.test(this.value)) {
                document.getElementById('bgColor').value = this.value;
            }
        });

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function luminance(r, g, b) {
            const a = [r, g, b].map(v => {
                v /= 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
        }

        function checkContrast() {
            const fgHex = document.getElementById('fgColorText').value;
            const bgHex = document.getElementById('bgColorText').value;
            const sampleText = document.getElementById('sampleText').value || '示例文本';
            
            const fgRgb = hexToRgb(fgHex);
            const bgRgb = hexToRgb(bgHex);
            
            if (!fgRgb || !bgRgb) {
                alert('请输入有效的颜色值');
                return;
            }
            
            const fgLum = luminance(fgRgb.r, fgRgb.g, fgRgb.b);
            const bgLum = luminance(bgRgb.r, bgRgb.g, bgRgb.b);
            
            const brightest = Math.max(fgLum, bgLum);
            const darkest = Math.min(fgLum, bgLum);
            const contrastRatio = (brightest + 0.05) / (darkest + 0.05);
            
            // 显示预览
            const preview = document.getElementById('preview');
            preview.style.backgroundColor = bgHex;
            preview.style.color = fgHex;
            preview.textContent = sampleText;
            
            // 显示对比度
            document.getElementById('contrastRatio').textContent = `${contrastRatio.toFixed(2)}:1`;
            document.getElementById('fgLuminance').textContent = fgLum.toFixed(4);
            document.getElementById('bgLuminance').textContent = bgLum.toFixed(4);
            
            // WCAG结果
            document.getElementById('aa-normal').innerHTML = contrastRatio >= 4.5 ? '<span class="wcag-pass">通过</span>' : '<span class="wcag-fail">未通过</span>';
            document.getElementById('aa-large').innerHTML = contrastRatio >= 3 ? '<span class="wcag-pass">通过</span>' : '<span class="wcag-fail">未通过</span>';
            document.getElementById('aaa-normal').innerHTML = contrastRatio >= 7 ? '<span class="wcag-pass">通过</span>' : '<span class="wcag-fail">未通过</span>';
            document.getElementById('aaa-large').innerHTML = contrastRatio >= 4.5 ? '<span class="wcag-pass">通过</span>' : '<span class="wcag-fail">未通过</span>';
            
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
