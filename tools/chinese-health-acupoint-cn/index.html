<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.detail{display:none}.detail.active{display:block}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-chip{padding:6px 12px;border-radius:16px;font-size:.8rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.filter-chip.active{background:var(--accent);color:white;border-color:var(--accent)}
.body-diagram{position:relative;width:100%;max-width:300px;margin:0 auto 20px}
.body-diagram svg{width:100%;height:auto}
.acupoint-dot{fill:var(--danger);cursor:pointer;transition:all .2s}
.acupoint-dot:hover{fill:var(--accent);transform:scale(1.3)}
.acupoint-dot.active{fill:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.acupoint-label{font-size:8px;fill:var(--text);pointer-events:none}
.massage-timer{width:150px;height:150px;border-radius:50%;border:4px solid var(--border);margin:20px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
.massage-timer svg{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg)}
.massage-timer circle{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:440;stroke-dashoffset:440;transition:stroke-dashoffset 1s linear}
.massage-timer.active circle{stroke:var(--success)}
.timer-display{font-size:2rem;font-weight:700;color:var(--accent)}
.log-item{padding:12px;border-bottom:1px solid var(--border)}
.log-header{display:flex;justify-content:space-between;align-items:center}
.log-meta{color:var(--text2);font-size:.85rem;margin-top:4px}
.rating{display:flex;gap:4px;margin-top:8px}
.rating-star{cursor:pointer;font-size:1.2rem}
.rating-star.filled{color:var(--warn)}
</style>

<div class="massage-timer" id="massage-timer">

</div>
<div id="post-massage" style="display:none;margin-top:16px">
<h3>按摩后感受</h3>
<p style="color:var(--text2);margin-bottom:8px">缓解程度</p>
<div class="rating" id="relief-rating">
<span class="rating-star" data-rating="1">⭐</span>
<span class="rating-star" data-rating="2">⭐</span>
<span class="rating-star" data-rating="3">⭐</span>
<span class="rating-star" data-rating="4">⭐</span>
<span class="rating-star" data-rating="5">⭐</span>
</div>
<button onclick="saveMassageSession()" style="margin-top:12px">保存记录</button>
</div>
</div>
</div>

<div id="view-log" class="detail">
<div class="cd">
<h2>📋 按摩记录</h2>
<div id="massage-log"></div>
</div>
</div>
</div>

<script>
const acupoints = [
  { name: '合谷', region: '上肢', location: '手背，第一、二掌骨间，第二掌骨桡侧的中点处', technique: '拇指按揉，每次2-3分钟', benefits: ['头痛', '牙痛', '感冒', '发热'], duration: '2-3分钟', svgX: 35, svgY: 145 },
  { name: '足三里', region: '下肢', location: '小腿前外侧，犊鼻下3寸，距胫骨前缘一横指', technique: '拇指按揉，每次3-5分钟', benefits: ['消化不良', '疲劳', '免疫力低下'], duration: '3-5分钟', svgX: 75, svgY: 320 },
  { name: '内关', region: '上肢', location: '前臂掌侧，腕横纹上2寸，掌长肌腱与桡侧腕屈肌腱之间', technique: '拇指按压，每次2-3分钟', benefits: ['心悸', '失眠', '胃痛'], duration: '2-3分钟', svgX: 35, svgY: 125 },
  { name: '外关', region: '上肢', location: '前臂背侧，腕背横纹上2寸，尺骨与桡骨之间', technique: '拇指按揉，每次2-3分钟', benefits: ['头痛', '耳鸣', '手臂痛'], duration: '2-3分钟', svgX: 35, svgY: 115 },
  { name: '太冲', region: '下肢', location: '足背侧，第一、二跖骨结合部之前凹陷处', technique: '拇指按揉，每次3-5分钟', benefits: ['头痛', '失眠', '高血压'], duration: '3-5分钟', svgX: 115, svgY: 385 },
  { name: '三阴交', region: '下肢', location: '小腿内侧，内踝尖上3寸，胫骨内侧缘后方', technique: '拇指按揉，每次3-5分钟', benefits: ['失眠', '消化不良', '月经不调'], duration: '3-5分钟', svgX: 115, svgY: 320 },
  { name: '百会', region: '头面部', location: '头顶正中线与两耳尖连线的交点处', technique: '指腹轻叩，每次2-3分钟', benefits: ['头痛', '失眠', '眩晕'], duration: '2-3分钟', svgX: 100, svgY: 15 },
  { name: '印堂', region: '头面部', location: '两眉头连线的中点处', technique: '拇指按揉，每次1-2分钟', benefits: ['头痛', '失眠', '鼻塞'], duration: '1-2分钟', svgX: 100, svgY: 30 },
  { name: '太阳', region: '头面部', location: '眉梢与目外眦之间，向后约一横指的凹陷处', technique: '指腹按揉，每次2-3分钟', benefits: ['头痛', '眼睛疲劳', '偏头痛'], duration: '2-3分钟', svgX: 65, svgY: 35 },
  { name: '风池', region: '头面部', location: '枕骨之下，胸锁乳突肌与斜方肌上端之间的凹陷处', technique: '拇指按揉，每次2-3分钟', benefits: ['头痛', '颈椎', '感冒'], duration: '2-3分钟', svgX: 100, svgY: 55 },
  { name: '肩井', region: '躯干', location: '肩上，大椎穴与肩峰连线的中点处', technique: '拇指按揉，每次3-5分钟', benefits: ['颈椎', '肩周炎', '头痛'], duration: '3-5分钟', svgX: 60, svgY: 100 },
  { name: '曲池', region: '上肢', location: '肘横纹外侧端，屈肘，尺泽与肱骨外上髁连线中点', technique: '拇指按揉，每次2-3分钟', benefits: ['感冒', '发热', '手臂痛'], duration: '2-3分钟', svgX: 25, svgY: 160 },
  { name: '血海', region: '下肢', location: '屈膝，大腿内侧，髌底内侧端上2寸，股四头肌内侧头的隆起处', technique: '拇指按揉，每次3-5分钟', benefits: ['月经不调', '皮肤瘙痒'], duration: '3-5分钟', svgX: 85, svgY: 270 },
  { name: '涌泉', region: '下肢', location: '足底前部凹陷处，第2、3趾趾缝纹头端与足跟连线的前三分之一处', technique: '拇指按压，每次3-5分钟', benefits: ['失眠', '头痛', '高血压'], duration: '3-5分钟', svgX: 115, svgY: 395 },
  { name: '劳宫', region: '上肢', location: '手掌心，第2、3掌骨之间偏于第3掌骨，握拳屈指时中指尖处', technique: '拇指按压，每次2-3分钟', benefits: ['心悸', '失眠', '口臭'], duration: '2-3分钟', svgX: 35, svgY: 155 },
  { name: '神门', region: '上肢', location: '腕前区，腕掌侧远端横纹尺侧端，尺侧腕屈肌腱的桡侧缘', technique: '拇指按揉，每次2-3分钟', benefits: ['失眠', '心悸', '健忘'], duration: '2-3分钟', svgX: 40, svgY: 135 },
  { name: '中脘', region: '躯干', location: '上腹部，前正中线上，脐中上4寸', technique: '掌心按揉，每次3-5分钟', benefits: ['胃痛', '消化不良', '呕吐'], duration: '3-5分钟', svgX: 100, svgY: 150 },
  { name: '气海', region: '躯干', location: '下腹部，前正中线上，脐中下1.5寸', technique: '掌心按揉，每次3-5分钟', benefits: ['疲劳', '消化不良', '月经不调'], duration: '3-5分钟', svgX: 100, svgY: 185 },
  { name: '关元', region: '躯干', location: '下腹部，前正中线上，脐中下3寸', technique: '掌心按揉，每次3-5分钟', benefits: ['疲劳', '免疫力低下', '月经不调'], duration: '3-5分钟', svgX: 100, svgY: 195 },
  { name: '命门', region: '躯干', location: '腰部，后正中线上，第2腰椎棘突下凹陷中', technique: '掌心按揉，每次3-5分钟', benefits: ['腰痛', '疲劳', '免疫力低下'], duration: '3-5分钟', svgX: 100, svgY: 220 }
];

const regions = ['全部', '头面部', '上肢', '下肢', '躯干'];
const symptoms = ['头痛', '失眠', '消化不良', '疲劳', '感冒', '腰痛', '颈椎', '眼睛疲劳'];

let favorites = JSON.parse(localStorage.getItem('acupoint-favorites') || '[]');
let massageLog = JSON.parse(localStorage.getItem('acupoint-log') || '[]');
let selectedRegion = '全部';
let selectedAcupoint = null;
let massageInterval = null;
let massageSeconds = 0;
let isMassaging = false;
let selectedRelief = 0;

function saveFavorites() { localStorage.setItem('acupoint-favorites', JSON.stringify(favorites)); }
function saveMassageLog() { localStorage.setItem('acupoint-log', JSON.stringify(massageLog)); }

function renderRegionFilter() {
  document.getElementById('region-filter').innerHTML = regions.map(r => `
    <div class="filter-chip ${r === selectedRegion ? 'active' : ''}" onclick="filterByRegion('${r}')">${r === '全部' ? '全部部位' : r}</div>
  `).join('');
}

function filterByRegion(region) {
  selectedRegion = region;
  renderRegionFilter();
  renderAcupointList();
}

function renderAcupointList() {
  let filtered = acupoints;
  if (selectedRegion !== '全部') {
    filtered = filtered.filter(a => a.region === selectedRegion);
  }
  const container = document.getElementById('acupoint-list');
  container.innerHTML = filtered.map((a, i) => `
    <div class="li" onclick="showAcupointDetail(${acupoints.indexOf(a)})">
      <div><strong>${a.name}</strong><br><span style="color:var(--text2);font-size:.85rem">${a.region} · ${a.duration}</span></div>
      <span class="tag s">${a.benefits.length}种功效</span>
    </div>
  `).join('');
}

function showAcupointDetail(index) {
  const a = acupoints[index];
  const container = document.getElementById('acupoint-list');
  container.innerHTML = `
    <div class="cd">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin-bottom:0">${a.name}</h2>
        <button onclick="toggleFavorite(${index})" style="padding:4px 8px;font-size:.8rem">${favorites.includes(index) ? '❤️ 已收藏' : '🤍 收藏'}</button>
      </div>
      <p style="color:var(--text2);margin:8px 0">${a.region}</p>
      <div style="margin-bottom:12px">
        <strong>位置：</strong>
        <p style="color:var(--text2);font-size:.9rem;margin-top:4px">${a.location}</p>
      </div>
      <div style="margin-bottom:12px">
        <strong>按摩手法：</strong>
        <p style="color:var(--text2);font-size:.9rem;margin-top:4px">${a.technique}</p>
      </div>
      <div style="margin-bottom:12px">
        <strong>建议时长：</strong>${a.duration}
      </div>
      <div style="margin-bottom:12px">
        <strong>功效：</strong>
        ${a.benefits.map(b => `<span class="tag s" style="margin:2px">${b}</span>`).join('')}
      </div>
      <button onclick="startMassage(${index})" style="width:100%">💆 开始按摩此穴位</button>
      <button class="sec" onclick="renderAcupointList()" style="width:100%;margin-top:8px">返回列表</button>
    </div>
  `;
}

function toggleFavorite(index) {
  if (favorites.includes(index)) {
    favorites = favorites.filter(i => i !== index);
  } else {
    favorites.push(index);
  }
  saveFavorites();
  showAcupointDetail(index);
}

function renderBodyDiagram() {
  const container = document.getElementById('acupoint-dots');
  container.innerHTML = acupoints.map((a, i) => `
    <g class="acupoint-group" onclick="selectAcupointFromDiagram(${i})">
      <circle cx="${a.svgX}" cy="${a.svgY}" r="6" class="acupoint-dot" id="dot-${i}"/>
      <text x="${a.svgX + 10}" y="${a.svgY + 3}" class="acupoint-label">${a.name}</text>
    </g>
  `).join('');
}

function selectAcupointFromDiagram(index) {
  document.querySelectorAll('.acupoint-dot').forEach(d => d.classList.remove('active'));
  document.getElementById('dot-' + index).classList.add('active');
  selectedAcupoint = index;
  const a = acupoints[index];
  const detailDiv = document.getElementById('selected-acupoint');
  detailDiv.style.display = 'block';
  detailDiv.innerHTML = `
    <div class="cd">
      <h3>${a.name}</h3>
      <p style="color:var(--text2);margin:8px 0">${a.location}</p>
      <div style="margin-bottom:8px">
        <strong>功效：</strong>${a.benefits.map(b => `<span class="tag s" style="margin:2px">${b}</span>`).join('')}
      </div>
      <button onclick="startMassage(${index})" style="width:100%">💆 开始按摩</button>
    </div>
  `;
}

function renderSymptomFilter() {
  document.getElementById('symptom-filter').innerHTML = symptoms.map(s => `
    <div class="filter-chip" onclick="filterBySymptom('${s}')">${s}</div>
  `).join('');
}

function filterBySymptom(symptom) {
  const results = acupoints.filter(a => a.benefits.includes(symptom));
  const container = document.getElementById('symptom-results');
  container.innerHTML = `
    <h3 style="margin-bottom:12px">治疗「${symptom}」的穴位：</h3>
    ${results.map((a, i) => `
      <div class="li" onclick="showAcupointDetail(${acupoints.indexOf(a)})">
        <div><strong>${a.name}</strong><br><span style="color:var(--text2);font-size:.85rem">${a.technique}</span></div>
        <span class="tag s">${a.duration}</span>
      </div>
    `).join('')}
  `;
}

function startMassage(index) {
  selectedAcupoint = index;
  document.getElementById('massage-acupoint-name').textContent = acupoints[index].name;
  document.getElementById('massage-area').style.display = 'block';
  document.getElementById('post-massage').style.display = 'none';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
  document.querySelector('[data-tab="massage"]').classList.add('active');
  document.getElementById('view-massage').classList.add('active');
}

function toggleMassageTimer() {
  if (isMassaging) {
    pauseMassageTimer();
  } else {
    startMassageTimer();
  }
}

function startMassageTimer() {
  isMassaging = true;
  document.getElementById('massage-btn').textContent = '⏸ 暂停';
  document.getElementById('massage-timer').classList.add('active');
  
  massageInterval = setInterval(() => {
    massageSeconds++;
    updateMassageDisplay();
  }, 1000);
}

function pauseMassageTimer() {
  isMassaging = false;
  document.getElementById('massage-btn').textContent = '▶ 继续';
  clearInterval(massageInterval);
}

function resetMassageTimer() {
  isMassaging = false;
  clearInterval(massageInterval);
  massageSeconds = 0;
  document.getElementById('massage-btn').textContent = '▶ 开始按摩';
  document.getElementById('massage-timer').classList.remove('active');
  document.getElementById('post-massage').style.display = 'none';
  updateMassageDisplay();
}

function updateMassageDisplay() {
  const mins = Math.floor(massageSeconds / 60).toString().padStart(2, '0');
  const secs = (massageSeconds % 60).toString().padStart(2, '0');
  document.getElementById('massage-timer-display').textContent = `${mins}:${secs}`;
  
  const progress = (massageSeconds % 120) / 120;
  const circle = document.getElementById('timer-circle');
  circle.style.strokeDashoffset = 440 - (progress * 440);
}

document.querySelectorAll('.rating-star').forEach(star => {
  star.addEventListener('click', () => {
    selectedRelief = parseInt(star.dataset.rating);
    document.querySelectorAll('.rating-star').forEach((s, i) => {
      s.classList.toggle('filled', i < selectedRelief);
    });
  });
});

function saveMassageSession() {
  if (selectedAcupoint === null) return;
  const today = new Date().toISOString().split('T')[0];
  massageLog.push({
    date: today,
    acupoint: acupoints[selectedAcupoint].name,
    duration: massageSeconds,
    relief: selectedRelief,
    timestamp: Date.now()
  });
  saveMassageLog();
  alert('✅ 按摩记录已保存');
  resetMassageTimer();
}

function renderMassageLog() {
  const container = document.getElementById('massage-log');
  if (massageLog.length === 0) {
    container.innerHTML = '<div class="empty">暂无按摩记录</div>';
    return;
  }
  container.innerHTML = massageLog.slice().reverse().map(l => `
    <div class="log-item">
      <div class="log-header">
        <strong>${l.acupoint}</strong>
        <span class="tag s">${Math.floor(l.duration / 60)}分${l.duration % 60}秒</span>
      </div>
      <div class="log-meta">${l.date} · 缓解程度 ${'⭐'.repeat(l.relief)}</div>
    </div>
  `).join('');
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'log') renderMassageLog();
  });
});

renderRegionFilter();
renderAcupointList();
renderBodyDiagram();
renderSymptomFilter();
</script>
</body>
