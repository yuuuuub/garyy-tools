generate();

// ⏱️ 番茄钟计时器
let timerSeconds=25*60,timerRunning=false,timerInterval=null,isWorkPhase=true;
const timerDisplay=document.getElementById('timerDisplay');
const timerPhase=document.getElementById('timerPhase');
const timerStart=document.getElementById('timerStart');
const timerReset=document.getElementById('timerReset');
let pomoCount=parseInt(localStorage.getItem('pomoCount')||'0');
document.getElementById('pomodoroCount').textContent=pomoCount;

function updateTimerDisplay(){
  const m=Math.floor(timerSeconds/60);const s=timerSeconds%60;
  timerDisplay.textContent=m.toString().padStart(2,'0')+':'+s.toString().padStart(2,'0');
  document.title=isWorkPhase?'🍅 '+timerDisplay.textContent+' 学习中':'☕ '+timerDisplay.textContent+' 休息中';
}
function switchPhase(){
  isWorkPhase=!isWorkPhase;
  if(isWorkPhase){timerSeconds=parseInt(document.getElementById('workMin').value)*60;timerPhase.textContent='🍅 专注时间';timerPhase.style.color='var(--accent)';}
  else{timerSeconds=parseInt(document.getElementById('breakMin').value)*60;timerPhase.textContent='☕ 休息时间';timerPhase.style.color='var(--green)';}
  updateTimerDisplay();
}
function timerTick(){
  timerSeconds--;
  if(timerSeconds<=0){
    if(isWorkPhase){pomoCount++;localStorage.setItem('pomoCount',pomoCount);document.getElementById('pomodoroCount').textContent=pomoCount;}
    switchPhase();
    if('Notification' in window && Notification.permission==='granted'){new Notification(isWorkPhase?'☕ 休息结束，开始专注！':'🍅 番茄完成！休息一下吧');}
  }
  updateTimerDisplay();
}
timerStart.addEventListener('click',function(){
  if(timerRunning){
    clearInterval(timerInterval);timerRunning=false;timerStart.textContent='▶ 继续';
  }else{
    if('Notification' in window && Notification.permission!=='denied'){Notification.requestPermission();}
    timerRunning=true;timerStart.textContent='⏸ 暂停';
    timerInterval=setInterval(timerTick,1000);
  }
});
timerReset.addEventListener('click',function(){
  clearInterval(timerInterval);timerRunning=false;timerStart.textContent='▶ 开始';
  isWorkPhase=true;timerSeconds=parseInt(document.getElementById('workMin').value)*60;
  timerPhase.textContent='🍅 专注时间';timerPhase.style.color='var(--accent)';updateTimerDisplay();
});
document.getElementById('workMin').addEventListener('change',function(){if(!timerRunning&&isWorkPhase){timerSeconds=parseInt(this.value)*60;updateTimerDisplay();}});
document.getElementById('breakMin').addEventListener('change',function(){});
updateTimerDisplay();
</script>
<script src="../i18n.js" defer></script>
</body>
