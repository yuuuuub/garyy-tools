<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>税后工资计算器</title>
<meta name="description" content="税后工资计算器，计算扣除五险一金后的实际工资">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.result-big{text-align:center;padding:18px}
.result-big .label{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.result-big .value{font-size:2rem;font-weight:700;color:var(--green)}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.stat-card{text-align:center;padding:14px;background:var(--bg);border-radius:var(--radius)}
.stat-card .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:1.1rem;font-weight:700}
.stat-card .value.blue{color:var(--blue)}
.stat-card .value.gold{color:var(--gold)}
.stat-card .value.red{color:var(--red)}
.stat-card .value.green{color:var(--green)}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.breakdown-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.breakdown-item:last-child{border-bottom:none}
.breakdown-item .bl{color:var(--text2)}
.breakdown-item .br{font-weight:600}
.slider-group{margin-bottom:10px}
.slider-group label{font-size:.8rem;color:var(--text2);margin-bottom:4px;display:flex;justify-content:space-between}
.slider-group input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;background:var(--border);border-radius:2px;outline:none;margin-top:4px}
.slider-group input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--blue);cursor:pointer}
.chart-bar-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.chart-bar-row .label{min-width:70px;font-size:.75rem;color:var(--text2)}
.chart-bar-row .bar-track{flex:1;height:16px;background:var(--bg);border-radius:4px;overflow:hidden}
.chart-bar-row .bar-fill{height:100%;border-radius:4px;transition:width .5s}
.chart-bar-row .val{min-width:60px;text-align:right;font-size:.75rem;font-weight:600}
.preset-group{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.preset-btn{padding:4px 12px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;background:var(--card);color:var(--text);cursor:pointer;transition:all .2s}
.preset-btn:hover{border-color:var(--blue);color:var(--blue)}
@media(max-width:640px){.form-row{flex-direction:column}.grid-3{grid-template-columns:1fr}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="税后工资计算器">
  <meta property="og:description" content="税后工资计算器，计算扣除五险一金后的实际工资">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/salary-calc/">
</head>
<body>
<div class="container">
  <header>
    <h1>💼 税后工资计算器</h1>
    <p>个人所得税计算</p>
  </header>

  <div class="card">
    <div class="form-row">
      <div class="group">
        <label>税前月薪 (元)</label>
        <input type="number" id="salary" value="15000" min="0" step="any">
      </div>
    </div>
    <div class="preset-group" id="salaryPresets"></div>

    <div class="section-title" style="margin-top:8px">五险一金比例 (可调整)</div>
    <div class="slider-group">
      <label><span>养老保险 8%</span><span id="pensionVal">8%</span></label>
      <input type="range" id="pension" min="0" max="8" value="8" step="0.5">
    </div>
    <div class="slider-group">
      <label><span>医疗保险 2%</span><span id="medicalVal">2%</span></label>
      <input type="range" id="medical" min="0" max="2" value="2" step="0.5">
    </div>
    <div class="slider-group">
      <label><span>失业保险 0.5%</span><span id="unemployVal">0.5%</span></label>
      <input type="range" id="unemploy" min="0" max="1" value="0.5" step="0.1">
    </div>
    <div class="slider-group">
      <label><span>住房公积金 12%</span><span id="housingVal">12%</span></label>
      <input type="range" id="housing" min="0" max="12" value="12" step="1">
    </div>
  </div>

  <div class="card">
    <div class="result-big">
      <div class="label">税后月薪</div>
      <div class="value" id="afterTaxDisplay">¥--</div>
    </div>
    <div class="grid-3">
      <div class="stat-card"><div class="label">个人所得税</div><div class="value red" id="taxDisplay">¥--</div></div>
      <div class="stat-card"><div class="label">五险一金</div><div class="value gold" id="insuranceDisplay">¥--</div></div>
      <div class="stat-card"><div class="label">税前月薪</div><div class="value blue" id="beforeTaxDisplay">¥--</div></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">📊 工资构成</div>
    <div id="breakdownChart"></div>
  </div>

  <div class="card">
    <div class="section-title">📋 费用明细</div>
    <div id="breakdownDetail"></div>
  </div>
</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const salaryInp = $('salary');
const pension = $('pension');
const medical = $('medical');
const unemploy = $('unemploy');
const housing = $('housing');
const afterTaxDisplay = $('afterTaxDisplay');
const taxDisplay = $('taxDisplay');
const insuranceDisplay = $('insuranceDisplay');
const beforeTaxDisplay = $('beforeTaxDisplay');
const breakdownChart = $('breakdownChart');
const breakdownDetail = $('breakdownDetail');

const salaryPresets = [8000, 12000, 15000, 20000, 30000, 50000, 80000];

function renderPresets(){
  const container = $('salaryPresets');
  container.innerHTML = salaryPresets.map(v => {
    return `<button class="preset-btn${parseFloat(salaryInp.value) === v ? ' active' : ''}" data-val="${v}">${v.toLocaleString()}</button>`;
  }).join('');
  container.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      salaryInp.value = btn.dataset.val;
      container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calc();
    });
  });
}

// 个税累进税率表（月度）
function calcTax(income){
  const brackets = [
    {limit: 3000, rate: 0.03, quick: 0},
    {limit: 12000, rate: 0.1, quick: 210},
    {limit: 25000, rate: 0.2, quick: 1410},
    {limit: 35000, rate: 0.25, quick: 2660},
    {limit: 55000, rate: 0.3, quick: 4410},
    {limit: 80000, rate: 0.35, quick: 7160},
    {limit: Infinity, rate: 0.45, quick: 15160}
  ];
  for(const b of brackets){
    if(income <= b.limit){
      return income * b.rate - b.quick;
    }
  }
  return 0;
}

function calc(){
  const salary = parseFloat(salaryInp.value) || 0;
  const pensionRate = parseFloat(pension.value) / 100;
  const medicalRate = parseFloat(medical.value) / 100;
  const unemployRate = parseFloat(unemploy.value) / 100;
  const housingRate = parseFloat(housing.value) / 100;

  $('pensionVal').textContent = (pensionRate * 100).toFixed(1) + '%';
  $('medicalVal').textContent = (medicalRate * 100).toFixed(1) + '%';
  $('unemployVal').textContent = (unemployRate * 100).toFixed(1) + '%';
  $('housingVal').textContent = (housingRate * 100).toFixed(0) + '%';

  const totalInsuranceRate = pensionRate + medicalRate + unemployRate + housingRate;
  const insurance = salary * totalInsuranceRate;

  // 个税起征点5000
  const taxable = Math.max(0, salary - insurance - 5000);
  const tax = calcTax(taxable);
  const afterTax = salary - insurance - tax;

  beforeTaxDisplay.textContent = '¥' + salary.toLocaleString('zh-CN',{minimumFractionDigits:2});
  insuranceDisplay.textContent = '¥' + insurance.toLocaleString('zh-CN',{minimumFractionDigits:2});
  taxDisplay.textContent = '¥' + tax.toLocaleString('zh-CN',{minimumFractionDigits:2});
  afterTaxDisplay.textContent = '¥' + afterTax.toLocaleString('zh-CN',{minimumFractionDigits:2});

  // 工资构成图
  const maxVal = salary;
  const afterPct = (afterTax / maxVal * 100);
  const insPct = (insurance / maxVal * 100);
  const taxPct = (tax / maxVal * 100);

  breakdownChart.innerHTML = `
    <div class="chart-bar-row">
      <div class="label">税后工资</div>
      <div class="bar-track"><div class="bar-fill" style="width:${afterPct}%;background:var(--green)"></div></div>
      <div class="val" style="color:var(--green)">¥${afterTax.toLocaleString('zh-CN',{minimumFractionDigits:0})}</div>
    </div>
    <div class="chart-bar-row">
      <div class="label">五险一金</div>
      <div class="bar-track"><div class="bar-fill" style="width:${insPct}%;background:var(--gold)"></div></div>
      <div class="val" style="color:var(--gold)">¥${insurance.toLocaleString('zh-CN',{minimumFractionDigits:0})}</div>
    </div>
    <div class="chart-bar-row">
      <div class="label">个税</div>
      <div class="bar-track"><div class="bar-fill" style="width:${taxPct}%;background:var(--red)"></div></div>
      <div class="val" style="color:var(--red)">¥${tax.toLocaleString('zh-CN',{minimumFractionDigits:0})}</div>
    </div>
  `;

  // 明细
  breakdownDetail.innerHTML = `
    <div class="breakdown-item"><span class="bl">税前月薪</span><span class="br">¥${salary.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
    <div class="breakdown-item"><span class="bl">养老保险 (${(pensionRate*100).toFixed(1)}%)</span><span class="br">¥${(salary * pensionRate).toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
    <div class="breakdown-item"><span class="bl">医疗保险 (${(medicalRate*100).toFixed(1)}%)</span><span class="br">¥${(salary * medicalRate).toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
    <div class="breakdown-item"><span class="bl">失业保险 (${(unemployRate*100).toFixed(1)}%)</span><span class="br">¥${(salary * unemployRate).toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
    <div class="breakdown-item"><span class="bl">住房公积金 (${(housingRate*100).toFixed(0)}%)</span><span class="br">¥${(salary * housingRate).toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
    <div class="breakdown-item"><span class="bl">五险一金合计</span><span class="br" style="color:var(--gold)">¥${insurance.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
    <div class="breakdown-item"><span class="bl">应纳税所得额</span><span class="br">¥${taxable.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
    <div class="breakdown-item"><span class="bl">个人所得税</span><span class="br" style="color:var(--red)">¥${tax.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span></div>
    <div class="breakdown-item" style="border-top:2px solid var(--border);margin-top:4px;padding-top:10px">
      <span class="bl" style="font-weight:600">税后月薪</span>
      <span class="br" style="color:var(--green);font-size:1.1rem">¥${afterTax.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span>
    </div>
  `;

  renderPresets();
}

[pension, medical, unemploy, housing].forEach(el => {
  el.addEventListener('input', calc);
});
salaryInp.addEventListener('input', calc);
salaryInp.addEventListener('change', calc);

calc();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
