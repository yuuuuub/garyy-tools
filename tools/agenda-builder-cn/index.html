<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 议程编排</title>
<meta name="description" content="会议议程编排工具，快速创建结构化议程，分配时间和发言人">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.agenda-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;position:relative;transition:all .2s}
.agenda-item:hover{border-color:var(--accent)}
.agenda-item.dragging{opacity:.5;border-color:var(--accent)}
.item-num{position:absolute;top:12px;left:-4px;background:var(--accent);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.item-body{margin-left:24px}
.item-title{font-weight:600;font-size:1rem}
.item-meta{font-size:.8rem;color:var(--text2);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.item-desc{font-size:.85rem;color:var(--text2);margin-top:6px}
.item-actions{display:flex;gap:4px;margin-top:8px}
.item-actions button{padding:4px 10px;font-size:.8rem}
.time-badge{background:rgba(59,130,246,.15);color:var(--accent);padding:2px 8px;border-radius:12px;font-size:.75rem;font-weight:600}
.speaker-badge{background:rgba(63,185,80,.15);color:var(--green);padding:2px 8px;border-radius:12px;font-size:.75rem;font-weight:600}
.summary{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.summary-item{padding:12px 20px;background:var(--bg);border:1px solid var(--border);border-radius:8px;text-align:center;flex:1;min-width:120px}
.summary-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.summary-label{font-size:.75rem;color:var(--text2);margin-top:2px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.hidden{display:none!important}
@media(max-width:768px){body{padding:10px}.summary{flex-direction:column}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📋 议程编排">
<meta property="og:description" content="会议议程编排工具，快速创建结构化议程，分配时间和发言人">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/agenda-builder-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='agenda_data';
let state=JSON.parse(localStorage.getItem(STORE)||'{"meetings":[]}');
if(!state.meetings.length){
  state.meetings=[{id:'m1',title:'产品周会',date:new Date().toISOString().slice(0,10),time:'10:00',items:[
    {id:'i1',title:'上周回顾',speaker:'张三',minutes:10,desc:'回顾上周完成的工作'},
    {id:'i2',title:'产品路线图讨论',speaker:'李四',minutes:20,desc:'讨论Q3产品规划'},
    {id:'i3',title:'技术方案评审',speaker:'王五',minutes:15,desc:'评审新架构方案'},
    {id:'i4',title:'Q&A',speaker:'全体',minutes:10,desc:'开放讨论'}
  ]}];
}
let currentMeeting=state.meetings[0]?.id||null,showModal=false,editingItem=null;

function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function genId(){return'id'+Date.now()+Math.random().toString(36).slice(2,6)}
function getMeeting(){return state.meetings.find(m=>m.id===currentMeeting)}

function render(){
  let h=`<div class="hdr"><h1>📋 议程编排</h1><p>创建结构化会议议程</p></div>`;

  h+=`<div class="cd"><div class="flex-between"><h2 style="margin:0">选择会议</h2><button onclick="createMeeting()" style="padding:6px 14px;font-size:.85rem">+ 新会议</button></div><div class="flex" style="margin-top:10px;gap:8px">`;
  state.meetings.forEach(m=>{
    h+=`<div class="flex" style="gap:4px"><div onclick="currentMeeting='${m.id}';render()" style="padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;${m.id===currentMeeting?'background:var(--accent);color:#fff':'background:var(--bg);border:1px solid var(--border)'}">${m.title}</div><button class="dng" style="padding:4px 8px;font-size:.75rem" onclick="deleteMeeting('${m.id}')">✕</button></div>`;
  });
  h+=`</div></div>`;

  const mtg=getMeeting();
  if(!mtg){h+=`<div class="cd"><p style="text-align:center;color:var(--text2);padding:40px">请创建一个会议议程</p></div>`; $('app').innerHTML=h;return}

  const totalMin=mtg.items.reduce((s,i)=>s+i.minutes,0);
  const h2=Math.floor(totalMin/60),m2=totalMin%60;
  h+=`<div class="summary"><div class="summary-item"><div class="summary-num">${mtg.items.length}</div><div class="summary-label">议程项</div></div><div class="summary-item"><div class="summary-num">${h2>0?h2+'h':''}${m2}m</div><div class="summary-label">总时长</div></div><div class="summary-item"><div class="summary-num">${new Set(mtg.items.map(i=>i.speaker)).size}</div><div class="summary-label">发言人</div></div></div>`;

  h+=`<div class="cd"><div class="flex-between"><h2 style="margin:0">📝 ${mtg.title} <span style="font-size:.85rem;color:var(--text2);font-weight:400">📅 ${mtg.date} ⏰ ${mtg.time}</span></h2><button onclick="openAddItem()" style="padding:6px 14px;font-size:.85rem">+ 添加议题</button></div>`;

  if(!mtg.items.length){h+=`<p style="text-align:center;color:var(--text2);padding:30px">点击"添加议题"开始编排</p>`}
  else{
    let cumTime=0;
    mtg.items.forEach((item,idx)=>{
      const startTime=mtg.time.split(':').map(Number);
      const startMin=startTime[0]*60+startTime[1]+cumTime;
      const sh=Math.floor(startMin/60)%24,sm=startMin%60;
      const endMin=startMin+item.minutes;
      const eh=Math.floor(endMin/60)%24,em=endMin%60;
      cumTime+=item.minutes;
      h+=`<div class="agenda-item" draggable="true" ondragstart="dragStart(event,'${item.id}')" ondragover="event.preventDefault()" ondrop="dropItem(event,'${item.id}')"><div class="item-num">${idx+1}</div><div class="item-body"><div class="item-title">${item.title}</div><div class="item-meta"><span class="time-badge">⏰ ${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}-${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')} (${item.minutes}分钟)</span><span class="speaker-badge">🎤 ${item.speaker}</span></div>${item.desc?`<div class="item-desc">${item.desc}</div>`:''}<div class="item-actions"><button class="sec" onclick="editItem('${item.id}')">✏️ 编辑</button><button class="dng" onclick="deleteItem('${item.id}')">🗑️ 删除</button><button class="sec" onclick="moveItem('${item.id}',-1)">↑</button><button class="sec" onclick="moveItem('${item.id}',1)">↓</button></div></div></div>`;
    });
    h+=`<div style="margin-top:12px;padding:10px;background:var(--bg);border-radius:8px;font-size:.85rem;color:var(--text2);text-align:center">⏱️ 预计结束时间：${String(Math.floor((mtg.time.split(':').map(Number)[0]*60+mtg.time.split(':').map(Number)[1]+totalMin)/60)%24).padStart(2,'0')}:${String((mtg.time.split(':').map(Number)[0]*60+mtg.time.split(':').map(Number)[1]+totalMin)%60).padStart(2,'0')}</div>`;
  }
  h+=`</div>`;

  h+=`<div class="cd"><h2>📤 导出议程</h2><div class="flex" style="gap:8px"><button onclick="copyAgenda()" style="padding:6px 14px;font-size:.85rem">📋 复制文本</button><button class="sec" onclick="downloadAgenda()" style="padding:6px 14px;font-size:.85rem">💾 下载TXT</button></div></div>`;

  if(showModal)h+=renderModal();
  $('app').innerHTML=h;
}

function renderModal(){
  const isEdit=!!editingItem?.id;
  let h=`<div class="modal-overlay" onclick="showModal=false;editingItem=null;render()"><div class="modal" onclick="event.stopPropagation()">`;
  h+=`<h2 style="margin-bottom:16px">${isEdit?'✏️ 编辑议题':'➕ 添加议题'}</h2>`;
  h+=`<label>议题标题</label><input id="mTitle" value="${editingItem?.title||''}" placeholder="例：产品路线图讨论">`;
  h+=`<label>发言人</label><input id="mSpeaker" value="${editingItem?.speaker||''}" placeholder="例：张三">`;
  h+=`<label>时长（分钟）</label><input type="number" id="mMinutes" value="${editingItem?.minutes||10}" min="1" max="120">`;
  h+=`<label>描述</label><textarea id="mDesc" placeholder="议题的简要说明...">${editingItem?.desc||''}</textarea>`;
  h+=`<div class="flex" style="margin-top:16px;justify-content:flex-end"><button class="sec" onclick="showModal=false;editingItem=null;render()">取消</button><button onclick="saveItem()">${isEdit?'保存':'添加'}</button></div>`;
  h+=`</div></div>`;
  return h;
}

function createMeeting(){
  const name=prompt('会议名称：','新会议');
  if(!name)return;
  const m={id:genId(),title:name,date:new Date().toISOString().slice(0,10),time:'10:00',items:[]};
  state.meetings.push(m);currentMeeting=m.id;save();render();
}
function deleteMeeting(id){
  if(!confirm('确定删除此会议？'))return;
  state.meetings=state.meetings.filter(m=>m.id!==id);
  currentMeeting=state.meetings[0]?.id||null;save();render();
}
function openAddItem(){editingItem={};showModal=true;render()}
function editItem(id){const mtg=getMeeting();editingItem={...mtg.items.find(i=>i.id===id)};showModal=true;render()}
function saveItem(){
  const title=$('mTitle').value.trim();
  const speaker=$('mSpeaker').value.trim()||'待定';
  const minutes=parseInt($('mMinutes').value)||10;
  const desc=$('mDesc').value.trim();
  if(!title){alert('请输入议题标题');return}
  const mtg=getMeeting();
  if(editingItem?.id){
    const idx=mtg.items.findIndex(i=>i.id===editingItem.id);
    if(idx>=0)mtg.items[idx]={...mtg.items[idx],title,speaker,minutes,desc};
  } else {
    mtg.items.push({id:genId(),title,speaker,minutes,desc});
  }
  save();showModal=false;editingItem=null;render();
}
function deleteItem(id){const mtg=getMeeting();mtg.items=mtg.items.filter(i=>i.id!==id);save();render()}
function moveItem(id,dir){
  const mtg=getMeeting();
  const idx=mtg.items.findIndex(i=>i.id===id);
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=mtg.items.length)return;
  [mtg.items[idx],mtg.items[newIdx]]=[mtg.items[newIdx],mtg.items[idx]];
  save();render();
}
let dragId=null;
function dragStart(e,id){dragId=id;e.dataTransfer.effectAllowed='move'}
function dropItem(e,id){
  e.preventDefault();
  if(!dragId||dragId===id)return;
  const mtg=getMeeting();
  const fromIdx=mtg.items.findIndex(i=>i.id===dragId);
  const toIdx=mtg.items.findIndex(i=>i.id===id);
  const [item]=mtg.items.splice(fromIdx,1);
  mtg.items.splice(toIdx,0,item);
  dragId=null;save();render();
}
function copyAgenda(){
  const mtg=getMeeting();if(!mtg)return;
  let txt=`会议：${mtg.title}\n日期：${mtg.date} ${mtg.time}\n\n`;
  mtg.items.forEach((item,i)=>{
    txt+=`${i+1}. ${item.title} (${item.minutes}分钟)\n   发言人：${item.speaker}\n   ${item.desc||''}\n\n`;
  });
  navigator.clipboard.writeText(txt).then(()=>alert('议程已复制到剪贴板'));
}
function downloadAgenda(){
  const mtg=getMeeting();if(!mtg)return;
  let txt=`会议：${mtg.title}\n日期：${mtg.date} ${mtg.time}\n\n`;
  mtg.items.forEach((item,i)=>{
    txt+=`${i+1}. ${item.title} (${item.minutes}分钟)\n   发言人：${item.speaker}\n   ${item.desc||''}\n\n`;
  });
  const blob=new Blob([txt],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`议程_${mtg.title}_${mtg.date}.txt`;a.click();
}
render();
</script>
</body>
</html>
