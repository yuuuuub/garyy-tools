<script>
(function() {
  const $ = id => document.getElementById(id);
  const widthInp = $('width');
  const heightInp = $('height');
  const bgColor = $('bgColor');
  const bgColorHex = $('bgColorHex');
  const textColor = $('textColor');
  const textColorHex = $('textColorHex');
  const customText = $('customText');
  const fontSize = $('fontSize');
  const fontSizeVal = $('fontSizeVal');
  const useGradient = $('useGradient');
  const useGrid = $('useGrid');
  const useCrosshair = $('useCrosshair');
  const useRounded = $('useRounded');
  const gradColor2 = $('gradColor2');
  const gradDirection = $('gradDirection');
  const gridSize = $('gridSize');
  const gridColor = $('gridColor');
  const gridOpacity = $('gridOpacity');
  const gridOpacityVal = $('gridOpacityVal');
  const roundedRadius = $('roundedRadius');
  const roundedVal = $('roundedVal');
  const canvas = $('previewCanvas');
  const ctx = canvas.getContext('2d');
  const previewLabel = $('previewLabel');
  const urlPreview = $('urlPreview');
  const urlNote = $('urlNote');
  const historyList = $('historyList');
  const historyHint = $('historyHint');
  const HISTORY_KEY = 'imgph_history';
  const MAX_HISTORY = 20;
  function getState() {
    return {
      w: clamp(parseInt(widthInp.value) || 800, 50, 2000),
      h: clamp(parseInt(heightInp.value) || 600, 50, 2000),
      bg: bgColor.value,
      tc: textColor.value,
      txt: customText.value.trim() || `${widthInp.value}×${heightInp.value}`,
      fs: parseInt(fontSize.value) || 42,
      grad: useGradient.checked,
      gradC2: gradColor2.value,
      gradDir: gradDirection.value,
      grid: useGrid.checked,
      gSize: parseInt(gridSize.value) || 40,
      gColor: gridColor.value,
      gOpacity: parseInt(gridOpacity.value) || 15,
      xhair: useCrosshair.checked,
      rounded: useRounded.checked,
      rRad: parseInt(roundedRadius.value) || 20,
    };
  }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function hexToRGB(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return m ? [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)] : [0,0,0];
  }
  function hexToRGBA(hex, alpha) {
    const [r,g,b] = hexToRGB(hex);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
  function render() {
    const s = getState();
    const { w, h } = s;
    const dpr = window.devicePixelRatio || 1;
    const maxDisplayW = 700;
    const scale = Math.min(1, maxDisplayW / w);
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = (w * scale) + 'px';
    canvas.style.height = (h * scale) + 'px';
    ctx.save();
    if (s.rounded && s.rRad > 0) {
      drawRoundedRect(ctx, 0, 0, w, h, s.rRad);
      ctx.clip();
    }
    if (s.grad) {
      const grad = ctx.createLinearGradient(0, 0,
        s.gradDir.includes('right') ? w : 0,
        s.gradDir.includes('bottom') ? h : 0);
      grad.addColorStop(0, s.bg);
      grad.addColorStop(1, s.gradC2);
      ctx.fillStyle = grad;
    } else {
      ctx.fillStyle = s.bg;
    }
    ctx.fillRect(0, 0, w, h);
    if (s.grid) {
      ctx.strokeStyle = hexToRGBA(s.gColor, s.gOpacity / 100);
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= w; x += s.gSize) {
        ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, h); ctx.stroke();
      }
      for (let y = 0; y <= h; y += s.gSize) {
        ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); ctx.stroke();
      }
    }
    if (s.xhair) {
      ctx.strokeStyle = hexToRGBA(s.tc, 0.25);
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 8]);
      ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (s.rounded && s.rRad > 0) {
      drawRoundedRect(ctx, 1, 1, w - 2, h - 2, s.rRad);
      ctx.strokeStyle = hexToRGBA(s.tc, 0.12);
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.fillStyle = s.tc;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const fs = s.fs;
    ctx.font = `bold ${fs}px ${getComputedStyle(document.body).fontFamily}`;
    const metrics = ctx.measureText(s.txt);
    let actualFs = fs;
    if (metrics.width > w * 0.85) {
      actualFs = Math.floor(fs * (w * 0.85) / metrics.width);
      ctx.font = `bold ${actualFs}px ${getComputedStyle(document.body).fontFamily}`;
    }
    const [r2,g2,b2] = hexToRGB(s.bg);
    const brightness = (r2*299 + g2*587 + b2*114) / 1000;
    if (s.grad) {
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 1;
    }
    ctx.fillText(s.txt, w / 2, h / 2);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.restore();
    previewLabel.textContent = `预览 · ${w} × ${h}`;
    updateURL(s);
    scheduleHistorySave();
  }
  function generateSVG() {
    const s = getState();
    const { w, h } = s;
    let bgDef = '';
    if (s.grad) {
      const x1 = s.gradDir.includes('left') ? '100%' : '0%';
      const y1 = s.gradDir.includes('top') ? '100%' : '0%';
      const x2 = s.gradDir.includes('right') ? '100%' : '0%';
      const y2 = s.gradDir.includes('bottom') ? '100%' : '0%';
      bgDef = `<defs><linearGradient id="bgGrad" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"><stop offset="0%" stop-color="${s.bg}"/><stop offset="100%" stop-color="${s.gradC2}"/></linearGradient></defs>`;
    }
    let rx = s.rounded ? s.rRad : 0;
    let fillAttr = s.grad ? 'url(#bgGrad)' : s.bg;
    let rectEl = `<rect width="${w}" height="${h}" fill="${fillAttr}"${rx > 0 ? ` rx="${rx}"` : ''}/>`;
    let gridEls = '';
    if (s.grid) {
      const gOpac = (s.gOpacity / 100).toFixed(2);
      for (let x = 0; x <= w; x += s.gSize) {
        gridEls += `<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="${s.gColor}" stroke-opacity="${gOpac}" stroke-width="0.5"/>`;
      }
      for (let y = 0; y <= h; y += s.gSize) {
        gridEls += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${s.gColor}" stroke-opacity="${gOpac}" stroke-width="0.5"/>`;
      }
    }
    let xhairEls = '';
    if (s.xhair) {
      xhairEls = `<line x1="${w/2}" y1="0" x2="${w/2}" y2="${h}" stroke="${s.tc}" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="6,8"/><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="${s.tc}" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="6,8"/>`;
    }
    let borderEl = '';
    if (s.rounded && rx > 0) {
      borderEl = `<rect x="1" y="1" width="${w-2}" height="${h-2}" fill="none" stroke="${s.tc}" stroke-opacity="0.12" stroke-width="2" rx="${rx}"/>`;
    }
    let textEl = `<text x="${w/2}" y="${h/2}" fill="${s.tc}" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="${s.fs}" font-weight="bold" text-anchor="middle" dominant-baseline="central">${escXml(s.txt)}</text>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${bgDef}\n  ${rectEl}\n  ${gridEls}\n  ${xhairEls}\n  ${borderEl}\n  ${textEl}\n</svg>`;
  }
  function escXml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function updateURL(s) {
    let parts = [];
    parts.push(s.w + 'x' + s.h);
    parts.push(s.bg.replace('#', ''));
    parts.push(s.tc.replace('#', ''));
    if (s.txt !== `${s.w}×${s.h}`) parts.push(encodeURIComponent(s.txt));
    parts.push(s.fs);
    if (s.grad) parts.push('gradient');
    if (s.grid) parts.push('grid');
    if (s.xhair) parts.push('crosshair');
    if (s.rounded) parts.push('rounded' + s.rRad);
    const url = 'https://via.placeholder.com/' + parts.join('/');
    urlPreview.value = url;
    urlNote.textContent = '上为 via.placeholder.com 风格的模拟链接格式';
  }
  function downloadPNG() {
    render();
    const link = document.createElement('a');
    link.download = `placeholder-${widthInp.value}x${heightInp.value}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
  function downloadSVG() {
    const svg = generateSVG();
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = `placeholder-${widthInp.value}x${heightInp.value}.svg`;
    link.href = url;
    link.click();
    URL.revokeObjectURL(url);
  }
  function copyDataURI() {
    render();
    const uri = canvas.toDataURL('image/png');
    navigator.clipboard.writeText(uri).then(() => {
      flashMsg('已复制 Data URI 到剪贴板');
    }).catch(() => {
      prompt('请手动复制：', uri);
    });
  }
  function copyURL() {
    navigator.clipboard.writeText(urlPreview.value).then(() => {
      flashMsg('已复制链接');
    }).catch(() => {
      prompt('请手动复制：', urlPreview.value);
    });
  }
  let toastTimer;
  function flashMsg(msg) {
    let el = document.querySelector('.toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'toast';
      el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--text);padding:10px 22px;border-radius:20px;font-size:0.85rem;z-index:999;font-family:var(--font);transition:0.3s;pointer-events:none;';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = '1';
    el.style.transform = 'translate(-50%, 0)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translate(-50%, 10px)';
    }, 1800);
  }
  function loadHistory() {
    try {
      return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    } catch { return []; }
  }
  function saveHistory(entries) {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(entries));
  }
  function addToHistory() {
    const s = getState();
    const uri = canvas.toDataURL('image/png');
    let hist = loadHistory();
    const key = `${s.w}x${s.h}-${s.bg}-${s.tc}-${s.txt}`;
    hist = hist.filter(e => e.key !== key);
    hist.unshift({ key, w: s.w, h: s.h, bg: s.bg, tc: s.tc, txt: s.txt, fs: s.fs,
      grad: s.grad, gradC2: s.gradC2, gradDir: s.gradDir,
      grid: s.grid, gSize: s.gSize, gColor: s.gColor, gOpacity: s.gOpacity,
      xhair: s.xhair, rounded: s.rounded, rRad: s.rRad,
      thumb: uri, ts: Date.now() });
    if (hist.length > MAX_HISTORY) hist = hist.slice(0, MAX_HISTORY);
    saveHistory(hist);
    renderHistory();
  }
  let historySavePending = false;
  function scheduleHistorySave() {
    if (historySavePending) return;
    historySavePending = true;
    setTimeout(() => {
      historySavePending = false;
      addToHistory();
    }, 600);
  }
  function renderHistory() {
    const hist = loadHistory();
    historyList.innerHTML = '';
    if (hist.length === 0) {
      historyHint.textContent = '生成图片后会自动记录在此';
      return;
    }
    historyHint.textContent = `共 ${hist.length} 条记录，点击缩略图恢复配置`;
    hist.forEach((entry, idx) => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.title = `${entry.w}×${entry.h}`;
      const img = document.createElement('img');
      img.src = entry.thumb;
      img.alt = `${entry.w}x${entry.h}`;
      div.appendChild(img);
      const delBtn = document.createElement('button');
      delBtn.className = 'h-del';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        let h = loadHistory();
        h.splice(idx, 1);
        saveHistory(h);
        renderHistory();
      });
      div.appendChild(delBtn);
      div.addEventListener('click', () => restoreHistory(entry));
      historyList.appendChild(div);
    });
  }
  function restoreHistory(entry) {
    widthInp.value = entry.w;
    heightInp.value = entry.h;
    bgColor.value = entry.bg;
    bgColorHex.value = entry.bg;
    textColor.value = entry.tc;
    textColorHex.value = entry.tc;
    customText.value = entry.txt;
    fontSize.value = entry.fs;
    fontSizeVal.textContent = entry.fs;
    useGradient.checked = entry.grad;
    gradColor2.value = entry.gradC2;
    gradDirection.value = entry.gradDir;
    useGrid.checked = entry.grid;
    gridSize.value = entry.gSize;
    gridColor.value = entry.gColor;
    gridOpacity.value = entry.gOpacity;
    gridOpacityVal.textContent = entry.gOpacity + '%';
    useCrosshair.checked = entry.xhair;
    useRounded.checked = entry.rounded;
    roundedRadius.value = entry.rRad;
    roundedVal.textContent = entry.rRad;
    toggleGradientOpts();
    toggleGridOpts();
    toggleRoundedOpts();
    document.querySelectorAll('.preset-chips .chip').forEach(c => c.classList.remove('active'));
    render();
    flashMsg('已恢复历史记录');
  }
  function clearHistory() {
    saveHistory([]);
    renderHistory();
    flashMsg('历史记录已清空');
  }
  function toggleGradientOpts() {
    $('gradientOpts').style.display = useGradient.checked ? 'block' : 'none';
    render();
  }
  function toggleGridOpts() {
    $('gridOpts').style.display = useGrid.checked ? 'block' : 'none';
    render();
  }
  function toggleRoundedOpts() {
    $('roundedOpts').style.display = useRounded.checked ? 'block' : 'none';
    render();
  }
  function setupPresets() {
    document.querySelectorAll('.preset-chips .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const w = parseInt(chip.dataset.w);
        const h = parseInt(chip.dataset.h);
        widthInp.value = w;
        heightInp.value = h;
        document.querySelectorAll('.preset-chips .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        render();
      });
    });
  }
  function bindEvents() {
    [widthInp, heightInp].forEach(el => el.addEventListener('input', render));
    bgColor.addEventListener('input', () => { bgColorHex.value = bgColor.value; render(); });
    bgColorHex.addEventListener('input', () => {
      const v = bgColorHex.value;
      if (/^#[0-9a-fA-F]{6}$/.test(v)) {
        bgColor.value = v;
        render();
      }
    });
    textColor.addEventListener('input', () => { textColorHex.value = textColor.value; render(); });
    textColorHex.addEventListener('input', () => {
      const v = textColorHex.value;
      if (/^#[0-9a-fA-F]{6}$/.test(v)) {
        textColor.value = v;
        render();
      }
    });
    customText.addEventListener('input', render);
    fontSize.addEventListener('input', () => { fontSizeVal.textContent = fontSize.value; render(); });
    useGradient.addEventListener('change', toggleGradientOpts);
    useGrid.addEventListener('change', toggleGridOpts);
    useCrosshair.addEventListener('change', render);
    useRounded.addEventListener('change', toggleRoundedOpts);
    gradColor2.addEventListener('input', render);
    gradDirection.addEventListener('change', render);
    gridSize.addEventListener('input', render);
    gridColor.addEventListener('input', render);
    gridOpacity.addEventListener('input', () => {
      gridOpacityVal.textContent = gridOpacity.value + '%';
      render();
    });
    roundedRadius.addEventListener('input', () => {
      roundedVal.textContent = roundedRadius.value;
      render();
    });
    $('downloadPNG').addEventListener('click', downloadPNG);
    $('downloadSVG').addEventListener('click', downloadSVG);
    $('copyDataURI').addEventListener('click', copyDataURI);
    $('copyURL').addEventListener('click', copyURL);
    $('clearHistory').addEventListener('click', clearHistory);
    widthInp.addEventListener('change', () => {
      widthInp.value = clamp(parseInt(widthInp.value) || 800, 50, 2000);
      render();
    });
    heightInp.addEventListener('change', () => {
      heightInp.value = clamp(parseInt(heightInp.value) || 600, 50, 2000);
      render();
    });
    window.addEventListener('resize', () => render());
  }
  function init() {
    bindEvents();
    setupPresets();
    renderHistory();
    render();
    gradColor2.value = '#8b5cf6';
    gridColor.value = '#ffffff';
  }
  init();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
