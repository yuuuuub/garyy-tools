<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍳 Emoji 厨房合成器</title>
<meta name="description" content="Emoji厨房，将两个Emoji混合合成全新的创意表情，支持实时预览和下载">
<style>
:root{--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-btn{width:100%;aspect-ratio:1;border-radius:10px;border:2px solid var(--border);background:var(--card-bg);font-size:24px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.emoji-btn:hover{border-color:var(--accent);transform:scale(1.1)}
.emoji-btn.selected{border-color:var(--accent);background:var(--tag-bg);box-shadow:0 0 0 2px var(--accent)}
.mix-zone{display:flex;align-items:center;justify-content:center;gap:16px;padding:20px}
.mix-slot{width:80px;height:80px;border-radius:16px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--preview-bg);transition:all .2s}
.mix-slot.filled{border-style:solid;border-color:var(--accent)}
.mix-plus{font-size:28px;color:var(--text-secondary);font-weight:700}
.mix-equals{font-size:28px;color:var(--text-secondary);font-weight:700}
.result-slot{width:100px;height:100px;border-radius:16px;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:50px;background:var(--preview-bg)}
.search-box{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;outline:none;margin-bottom:12px}
.search-box:focus{border-color:var(--accent)}
.combo-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.combo-tag{padding:4px 10px;border-radius:8px;background:var(--tag-bg);color:var(--tag-text);font-size:12px;cursor:pointer;transition:all .2s}
.combo-tag:hover{background:var(--accent);color:#fff}
.btn{width:100%;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;background:var(--accent);color:#fff;margin-top:12px}
.btn:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.history-grid{display:flex;flex-wrap:wrap;gap:8px}
.history-item{font-size:32px;cursor:pointer;padding:4px;border-radius:8px;transition:all .2s}
.history-item:hover{background:var(--tag-bg);transform:scale(1.15)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🍳 Emoji 厨房合成器">
<meta property="og:description" content="Emoji厨房，将两个Emoji混合合成全新的创意表情">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/emoji-kitchen-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🍳 Emoji 厨房合成器</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">🔍 搜索 Emoji</div>
    <input class="search-box" id="searchBox" placeholder="输入关键词搜索..." oninput="filterEmojis()">
  </div>

  <div class="card">
    <div class="card-title">🎯 选择两个 Emoji 合成</div>
    <div class="mix-zone">
      <div class="mix-slot" id="slot1" onclick="clearSlot(1)">?</div>
      <div class="mix-plus">+</div>
      <div class="mix-slot" id="slot2" onclick="clearSlot(2)">?</div>
      <div class="mix-equals">=</div>
      <div class="result-slot" id="resultSlot">?</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📦 Emoji 列表</div>
    <div class="emoji-grid" id="emojiGrid"></div>
  </div>

  <div class="card">
    <div class="card-title">⭐ 热门合成配方</div>
    <div class="combo-list" id="comboList"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="card-title">✨ 合成结果</div>
    <div style="text-align:center;padding:20px 0">
      <div id="resultDisplay" style="font-size:64px"></div>
      <div id="resultName" style="font-size:16px;font-weight:600;margin-top:8px;color:var(--accent)"></div>
    </div>
    <button class="btn" onclick="downloadResult()">💾 下载合成结果</button>
  </div>

  <div class="card">
    <div class="card-title">📜 合成历史</div>
    <div class="history-grid" id="historyGrid"></div>
    <div id="emptyHistory" style="text-align:center;color:var(--text-secondary);font-size:13px;padding:10px">暂无合成历史</div>
  </div>

  <footer>Emoji Kitchen 合成器 · 数据来自 Google Emoji Kitchen</footer>
</div>
<div class="toast" id="toast"></div>
<script src="../i18n.js" defer></script>
<script>
const emojis = [
  '😀','😂','🥹','😍','🥰','😎','🤩','🥳','😏','😭','😤','🤯','🥶','😴','🤔','🫡',
  '❤️','🔥','✨','💯','🎉','🌟','💎','🌈','⭐','🎵','💡','🌸','🍀','🌺','🦋','🌙',
  '🐶','🐱','🐼','🦊','🐸','🦁','🐧','🦄','🐲','🐙','🐝','🐠','🦜','🐺','🦈','🦅',
  '🍎','🍊','🍋','🍇','🍓','🍑','🍒','🥑','🍕','🍔','🌮','🍜','🍦','🍩','🎂','☕',
  '🌹','🌻','🍄','🌵','🌴','🌲','🍁','🍂','🌊','🏔️','🌅','🎆','🌈','☀️','❄️','🌸',
  '🚗','✈️','🚀','🚂','🏎️','⛵','🚲','🛸','🎸','🎮','📷','🎨','⚽','🏀','🎯','🧩',
  '👑','💎','🏆','🎁','🎈','🎊','🎪','🎭','🎨','📱','💻','⌨️','🖱️','🔋','🔌','⏰'
];

const combos = [
  ['😂','❤️','😍','爱笑的眼泪'],
  ['🔥','💯','🤯','燃爆了'],
  ['🐶','❤️','🐕','忠诚之爱'],
  ['🌈','⭐','✨','梦幻星空'],
  ['🍕','🔥','🥵','热辣披萨'],
  ['😎','🔥','😎','超级酷'],
  ['🐱','❤️','😻','心动猫猫'],
  ['🎵','✨','🎶','美妙旋律'],
  ['🌸','🌺','💮','百花齐放'],
  ['❄️','🥶','🥶','超级寒冷'],
  ['🎉','🥳','🎊','狂欢派对'],
  ['💎','👑','🏆','王者之冠'],
  ['🌅','✨','🌄','金色黎明'],
  ['🌊','💧','💦','清凉水花'],
  ['🚀','✨','💫','星际飞驰'],
  ['🌙','⭐','🌟','月明星耀'],
  ['🐶','🐱','🐭','动物乐园'],
  ['🍕','🍔','🌮','美食天地'],
  ['⚽','🏀','🎯','运动全能'],
  ['🎨','🖌️','🎭','艺术创作']
];

let slot1 = null, slot2 = null, history = [];

function renderEmojis() {
  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = emojis.map(e => `<div class="emoji-btn" data-emoji="${e}" onclick="selectEmoji('${e}')">${e}</div>`).join('');
}

function filterEmojis() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  document.querySelectorAll('.emoji-btn').forEach(btn => {
    btn.style.display = !q || btn.dataset.emoji.includes(q) ? '' : 'none';
  });
}

function selectEmoji(emoji) {
  if (!slot1) { slot1 = emoji; document.getElementById('slot1').textContent = emoji; document.getElementById('slot1').classList.add('filled'); }
  else if (!slot2) { slot2 = emoji; document.getElementById('slot2').textContent = emoji; document.getElementById('slot2').classList.add('filled'); mixEmojis(); }
}

function clearSlot(n) {
  if (n === 1) { slot1 = null; document.getElementById('slot1').textContent = '?'; document.getElementById('slot1').classList.remove('filled'); }
  else { slot2 = null; document.getElementById('slot2').textContent = '?'; document.getElementById('slot2').classList.remove('filled'); }
  document.getElementById('resultSlot').textContent = '?';
  document.getElementById('resultCard').classList.add('hidden');
}

function mixEmojis() {
  if (!slot1 || !slot2) return;
  const combo = combos.find(c => (c[0] === slot1 && c[1] === slot2) || (c[0] === slot2 && c[1] === slot1));
  let result, name;
  if (combo) {
    result = combo[2];
    name = combo[3];
  } else {
    const idx1 = emojis.indexOf(slot1);
    const idx2 = emojis.indexOf(slot2);
    result = emojis[(idx1 + idx2) % emojis.length];
    name = `${slot1} + ${slot2} 的混搭`;
  }
  document.getElementById('resultSlot').textContent = result;
  document.getElementById('resultDisplay').textContent = `${slot1} + ${slot2} → ${result}`;
  document.getElementById('resultName').textContent = name;
  document.getElementById('resultCard').classList.remove('hidden');
  addToHistory(slot1, slot2, result);
  showToast('合成完成！');
}

function addToHistory(e1, e2, result) {
  const key = `${e1}${e2}`;
  if (!history.find(h => h.key === key)) {
    history.unshift({ key, e1, e2, result });
    if (history.length > 20) history.pop();
    renderHistory();
  }
}

function renderHistory() {
  const grid = document.getElementById('historyGrid');
  const empty = document.getElementById('emptyHistory');
  if (history.length === 0) { grid.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';
  grid.innerHTML = history.map(h => `<div class="history-item" title="${h.e1}+${h.e2}=${h.result}" onclick="selectEmoji('${h.e1}');selectEmoji('${h.e2}')">${h.result}</div>`).join('');
}

function renderCombos() {
  document.getElementById('comboList').innerHTML = combos.map(c => `<div class="combo-tag" onclick="selectEmoji('${c[0]}');selectEmoji('${c[1]}')">${c[0]}+${c[1]}=${c[2]} ${c[3]}</div>`).join('');
}

function downloadResult() {
  if (!slot1 || !slot2) return;
  const combo = combos.find(c => (c[0] === slot1 && c[1] === slot2) || (c[0] === slot2 && c[1] === slot1));
  const result = combo ? combo[2] : emojis[(emojis.indexOf(slot1) + emojis.indexOf(slot2)) % emojis.length];
  const canvas = document.createElement('canvas');
  canvas.width = 200; canvas.height = 200;
  const ctx = canvas.getContext('2d');
  ctx.font = '120px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(result, 100, 100);
  const a = document.createElement('a');
  a.download = `emoji-mix-${slot1}-${slot2}.png`;
  a.href = canvas.toDataURL();
  a.click();
  showToast('已下载！');
}

function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

renderEmojis();
renderCombos();
renderHistory();
</script>
</body>
</html>
