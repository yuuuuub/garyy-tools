<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js游乐场 - 在线3D编辑器</title>
<meta name="description" content="Three.js 3D在线编辑器，创建WebGL 3D场景">
<style>
:root {
--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
nav .logo{font-size:18px;font-weight:600;color:var(--accent2);}
nav a{color:var(--accent);text-decoration:none;font-size:14px;}
nav a:hover{color:var(--accent2);}
.container{display:flex;flex-direction:column;height:calc(100vh - 52px);}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent2);}
.btn-secondary{background:var(--border);color:var(--text);}
.btn-secondary:hover{background:#3d444d;}
.workspace{display:flex;flex:1;overflow:hidden;}
.editor-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);}
.preview-panel{flex:1;display:flex;flex-direction:column;}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;font-size:13px;color:var(--accent2);font-weight:500;}
.editor-wrapper{flex:1;position:relative;}
#threeEditor{width:100%;height:100%;background:var(--bg);border:none;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:12px;padding:12px;resize:none;outline:none;line-height:1.5;}
.preview-area{flex:1;background:#1a1a2e;position:relative;}
#threeCanvas{width:100%;height:100%;display:block;}
.templates{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;}
.templates span{font-size:12px;color:#8b949e;margin-right:8px;}
.template-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--accent2);cursor:pointer;margin-right:6px;margin-bottom:4px;}
.template-btn:hover{border-color:var(--accent);color:var(--accent);}
@media(max-width:768px){
.workspace{flex-direction:column;}
.editor-panel{border-right:none;border-bottom:1px solid var(--border);}
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<nav>
<span class="logo">Three.js游乐场</span>
<a href="/index.html">← 返回工具箱</a>
</nav>
<div class="container">
<div class="toolbar">
<button class="btn btn-primary" onclick="runCode()">▶ 运行</button>
<button class="btn btn-secondary" onclick="copyCode()">复制代码</button>
<button class="btn btn-secondary" onclick="resetCode()">重置</button>
</div>
<div class="templates">
<span>模板:</span>
<button class="template-btn" data-code="// 立方体\nconst geometry = new THREE.BoxGeometry(1, 1, 1);\nconst material = new THREE.MeshPhongMaterial({ color: 0x3b82f6 });\nconst cube = new THREE.Mesh(geometry, material);\nscene.add(cube);\n\n// 动画\nfunction animate() {\n  requestAnimationFrame(animate);\n  cube.rotation.x += 0.01;\n  cube.rotation.y += 0.01;\n  renderer.render(scene, camera);\n}\nanimate();">立方体</button>
<button class="template-btn" data-code="// 球体\nconst geometry = new THREE.SphereGeometry(1, 32, 32);\nconst material = new THREE.MeshPhongMaterial({ \n  color: 0x3b82f6,\n  shininess: 100\n});\nconst sphere = new THREE.Mesh(geometry, material);\nscene.add(sphere);\n\n// 动画\nfunction animate() {\n  requestAnimationFrame(animate);\n  sphere.rotation.y += 0.01;\n  renderer.render(scene, camera);\n}\nanimate();">球体</button>
<button class="template-btn" data-code="// 多个几何体\nconst objects = [];\nconst colors = [0x3b82f6, 0x10b981, 0xf59e0b, 0xef4444, 0x8b5cf6];\n\nfor (let i = 0; i < 5; i++) {\n  const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);\n  const material = new THREE.MeshPhongMaterial({ color: colors[i] });\n  const cube = new THREE.Mesh(geometry, material);\n  cube.position.x = (i - 2) * 1.5;\n  scene.add(cube);\n  objects.push(cube);\n}\n\n// 动画\nfunction animate() {\n  requestAnimationFrame(animate);\n  objects.forEach((obj, i) => {\n    obj.rotation.x += 0.01 * (i + 1);\n    obj.rotation.y += 0.01 * (i + 1);\n    obj.position.y = Math.sin(Date.now() * 0.002 + i) * 0.3;\n  });\n  renderer.render(scene, camera);\n}\nanimate();">多个物体</button>
<button class="template-btn" data-code="// 粒子系统\nconst particles = 1000;\nconst geometry = new THREE.BufferGeometry();\nconst positions = new Float32Array(particles * 3);\n\nfor (let i = 0; i < particles * 3; i += 3) {\n  positions[i] = (Math.random() - 0.5) * 10;\n  positions[i + 1] = (Math.random() - 0.5) * 10;\n  positions[i + 2] = (Math.random() - 0.5) * 10;\n}\n\ngeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));\nconst material = new THREE.PointsMaterial({ color: 0x3b82f6, size: 0.05 });\nconst points = new THREE.Points(geometry, material);\nscene.add(points);\n\n// 动画\nfunction animate() {\n  requestAnimationFrame(animate);\n  points.rotation.y += 0.002;\n  renderer.render(scene, camera);\n}\nanimate();">粒子系统</button>
</div>
<div class="workspace">
<div class="editor-panel">
<div class="panel-header">Three.js代码</div>
<div class="editor-wrapper">
<textarea id="threeEditor">// 初始化场景
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

// 初始化相机
const canvas = document.getElementById('threeCanvas');
const camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
camera.position.z = 3;

// 初始化渲染器
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(canvas.clientWidth, canvas.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);

// 添加灯光
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
directionalLight.position.set(5, 5, 5);
scene.add(directionalLight);

// 创建立方体
const geometry = new THREE.BoxGeometry(1, 1, 1);
const material = new THREE.MeshPhongMaterial({ 
  color: 0x3b82f6,
  shininess: 100
});
const cube = new THREE.Mesh(geometry, material);
scene.add(cube);

// 动画循环
function animate() {
  requestAnimationFrame(animate);
  cube.rotation.x += 0.01;
  cube.rotation.y += 0.01;
  renderer.render(scene, camera);
}
animate();

// 响应窗口大小变化
window.addEventListener('resize', () => {
  camera.aspect = canvas.clientWidth / canvas.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);
});</textarea>
</div>
</div>
<div class="preview-panel">
<div class="panel-header">3D预览 (鼠标拖拽旋转)</div>
<div class="preview-area">
<canvas id="threeCanvas"></canvas>
</div>
</div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const threeEditor=document.getElementById('threeEditor');
const threeCanvas=document.getElementById('threeCanvas');

function runCode(){
const script=document.querySelector('script[src*="three.min.js"]');
if(!script){
const s=document.createElement('script');
s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
s.onload=()=>eval(threeEditor.value);
document.head.appendChild(s);
}else{
try{
eval(threeEditor.value);
}catch(e){
alert('代码错误: '+e.message);
}
}
}

function copyCode(){
navigator.clipboard.writeText(threeEditor.value).then(()=>alert('代码已复制到剪贴板'));
}

function resetCode(){
threeEditor.value='// 初始化场景\nconst scene = new THREE.Scene();\nscene.background = new THREE.Color(0x1a1a2e);\n\n// 初始化相机\nconst canvas = document.getElementById(\'threeCanvas\');\nconst camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);\ncamera.position.z = 3;\n\n// 初始化渲染器\nconst renderer = new THREE.WebGLRenderer({ canvas, antialias: true });\nrenderer.setSize(canvas.clientWidth, canvas.clientHeight);\n\n// 添加灯光\nconst ambientLight = new THREE.AmbientLight(0xffffff, 0.5);\nscene.add(ambientLight);\n\nconst directionalLight = new THREE.DirectionalLight(0xffffff, 1);\ndirectionalLight.position.set(5, 5, 5);\nscene.add(directionalLight);\n\n// 创建立方体\nconst geometry = new THREE.BoxGeometry(1, 1, 1);\nconst material = new THREE.MeshPhongMaterial({ color: 0x3b82f6 });\nconst cube = new THREE.Mesh(geometry, material);\nscene.add(cube);\n\n// 动画\nfunction animate() {\n  requestAnimationFrame(animate);\n  cube.rotation.x += 0.01;\n  cube.rotation.y += 0.01;\n  renderer.render(scene, camera);\n}\nanimate();';
runCode();
}

document.querySelectorAll('.template-btn').forEach(btn=>{
btn.onclick=()=>{
threeEditor.value=btn.dataset.code;
runCode();
};
});

// 简单的鼠标控制
let isDragging=false,prevMouse={x:0,y:0};
threeCanvas.addEventListener('mousedown',e=>{isDragging=true;prevMouse={x:e.clientX,y:e.clientY};});
threeCanvas.addEventListener('mousemove',e=>{
if(!isDragging)return;
const dx=e.clientX-prevMouse.x;
const dy=e.clientY-prevMouse.y;
try{
eval('cube.rotation.y+='+dx*0.01+';cube.rotation.x+='+dy*0.01+';');
}catch(e){}
prevMouse={x:e.clientX,y:e.clientY};
});
threeCanvas.addEventListener('mouseup',()=>isDragging=false);
threeCanvas.addEventListener('mouseleave',()=>isDragging=false);
</script>
<script src="../i18n.js"></script>
</body>
</html>
