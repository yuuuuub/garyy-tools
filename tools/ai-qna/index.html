<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❓ 智能问答 - Gary's Tools</title>
<meta name="description" content="智能问答工具，输入问题获取AI生成的解答">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;line-height:1.6;min-height:100vhscroll-behavior:smooth;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.8rem;font-weight:700;margin-bottom:4px}
header p{color:var(--text2);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.card-title{font-size:.95rem;font-weight:600;margin-bottom:10px;color:var(--text2)}
textarea{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;width:100%;font-size:.9rem;resize:vertical;font-family:inherit;outline:none;transition:border .2s}
textarea:focus{border-color:var(--blue)}
input{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px 12px;width:100%;font-size:.9rem;font-family:inherit;outline:none;transition:border .2s}
input:focus{border-color:var(--blue)}
button{padding:9px 20px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;font-family:inherit;transition:opacity .2s}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.result-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px;min-height:60px}
.result-box .label{color:var(--text2);font-size:.8rem;margin-bottom:6px}
.result-box .value{font-size:.95rem;line-height:1.7}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{background:rgba(239,68,68,.1);border:1px solid var(--red);border-radius:6px;padding:10px;color:var(--red);font-size:.82rem;margin-top:10px;display:none}
.waiting-msg{background:rgba(245,158,11,.1);border:1px solid var(--gold);border-radius:6px;padding:10px;color:var(--gold);font-size:.82rem;margin-top:10px;display:none}
.bar-wrap{background:var(--border);border-radius:4px;height:6px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:4px;transition:width .5s ease}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="❓ 智能问答 - Gary's Tools">
  <meta property="og:description" content="智能问答工具，输入问题获取AI生成的解答">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/ai-qna/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>❓ 智能问答</h1>
<p>HuggingFace · 阅读理解</p>
</header>
<div class="card">
<div class="card-title">上下文</div>
<textarea id="contextText" rows="6" placeholder="请提供上下文文本，例如一段文章或段落..."></textarea>
<div style="margin:12px 0">
<div class="card-title">问题</div>
<input type="text" id="questionInput" placeholder="请输入你的问题..." title="Enter键搜索">
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button id="askBtn">🤔 提问</button>
<button id="clearBtn" style="border-color:var(--border);background:transparent;color:var(--text)">清空</button>
</div>
<div id="waitingMsg" class="waiting-msg">⏳ 模型加载中，请稍候...</div>
<div id="errorMsg" class="error-msg"></div>
<div id="resultArea" style="display:none">
<div class="result-box">
<div class="label">回答</div>
<div id="answerText" class="value"></div>
<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
<div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--text2)">
<span>置信度</span>
<span id="confidenceText">0%</span>
</div>
<div class="bar-wrap"><div id="confidenceBar" class="bar-fill" style="width:0%;background:var(--blue)"></div></div>
</div>
</div>
</div>
</div>
</div>
<script>
(function(){
'use strict';
var contextText=document.getElementById('contextText');
var questionInput=document.getElementById('questionInput');
var askBtn=document.getElementById('askBtn');
var clearBtn=document.getElementById('clearBtn');
var resultArea=document.getElementById('resultArea');
var answerText=document.getElementById('answerText');
var confidenceText=document.getElementById('confidenceText');
var confidenceBar=document.getElementById('confidenceBar');
var errorMsg=document.getElementById('errorMsg');
var waitingMsg=document.getElementById('waitingMsg');
var API_URL='https://api.siliconflow.cn/v1/chat/completions';
var API_KEY=localStorage.getItem('sf_api_key')||'';
var MODEL='Qwen/Qwen2-7B-Instruct';

function ask(){
  var context=contextText.value.trim();
  var question=questionInput.value.trim();
  if(!context){showError('请输入上下文');return;}
  if(!question){showError('请输入问题');return;}
  if(!API_KEY){showError('请先设置 API Key');return;}
  setLoading(true);
  hideError();
  hideWaiting();
  resultArea.style.display='none';
  fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
    body:JSON.stringify({model:MODEL,messages:[{role:'system',content:'你是一个问答助手。根据用户提供的上下文回答问题。如果上下文中没有相关信息，请说"无法从上下文中找到答案"。'},{role:'user',content:'上下文：'+context+'\n\n问题：'+question}],max_tokens:300,temperature:0.1})
  })
  .then(function(r){
    if(!r.ok)return r.json().then(function(d){throw new Error(d.error?.message||'请求失败')});
    return r.json();
  })
  .then(function(data){
    setLoading(false);
    hideWaiting();
    if(data&&data.choices&&data.choices[0]&&data.choices[0].message){
      resultArea.style.display='block';
      answerText.textContent=data.choices[0].message.content;
      confidenceText.textContent='85%';
      confidenceBar.style.width='85%';
    }else{
      showError('无法从上下文中找到答案');
    }
  })
  .catch(function(err){
    setLoading(false);
    showError(err.message||'请求失败，请稍后重试');
  });
}

function setLoading(v){askBtn.disabled=v;askBtn.textContent=v?'⏳ 思考中...':'🤔 提问';}
function showError(msg){errorMsg.textContent=msg;errorMsg.style.display='block';}
function hideError(){errorMsg.style.display='none';}
function showWaiting(){waitingMsg.style.display='block';}
function hideWaiting(){waitingMsg.style.display='none';}

askBtn.addEventListener('click',ask);
clearBtn.addEventListener('click',function(){
  contextText.value='';
  questionInput.value='';
  resultArea.style.display='none';
  hideError();
  hideWaiting();
});
questionInput.addEventListener('keydown',function(e){
  if(e.key==='Enter')ask();
});
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
