<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌊 波形可视化</title>
<meta property="og:title" content="🌊 波形可视化">
<meta property="og:description" content="🌊 波形可视化 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线波形可视化工具，实时显示音频波形、相位和振幅">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<meta name="robots" content="noindex">
<script src="../i18n.js" defer></script>
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.wave-selector{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.wave-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s;font-weight:600}
.wave-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
.slider-group{margin-bottom:12px}
.slider-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.slider-label b{color:var(--text);font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent)}
.canvas-wrap{background:#0a0a1a;border-radius:12px;overflow:hidden;margin:12px 0}
canvas{width:100%;display:block}
.controls{display:flex;gap:8px;justify-content:center;margin:12px 0}
.ctrl-btn{padding:10px 20px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.ctrl-btn.play{background:var(--green);color:#fff}
.ctrl-btn.play:hover{background:#2ea043}
.ctrl-btn.play.active{background:var(--red)}
.info-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.info-tag{padding:4px 10px;border-radius:6px;background:var(--tag-bg);color:var(--tag-text);font-size:11px;font-weight:600}
.footer{text-align:center;padding:20px 0;font-size:12px;color:var(--text-secondary)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🌊 波形可视化</h1>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</header>
<div class="card">
<div class="card-title">🌊 波形类型</div>
<div class="wave-selector" id="waveSelector"></div>
</div>
<div class="card">
<div class="card-title">🎛️ 参数</div>
<div class="slider-group">
<div class="slider-label"><span>频率</span><b id="freqVal">440 Hz</b></div>
<input type="range" min="20" max="2000" value="440" id="freqSlider" oninput="updateParam()">
</div>
<div class="slider-group">
<div class="slider-label"><span>振幅</span><b id="ampVal">50%</b></div>
<input type="range" min="0" max="100" value="50" id="ampSlider" oninput="updateParam()">
</div>
<div class="slider-group">
<div class="slider-label"><span>相位偏移</span><b id="phaseVal">0°</b></div>
<input type="range" min="0" max="360" value="0" id="phaseSlider" oninput="updateParam()">
</div>
</div>
<div class="card">
<div class="card-title">📊 实时波形</div>
<div class="canvas-wrap"><canvas id="waveCanvas" width="500" height="200"></canvas></div>
<div class="controls">
<button class="ctrl-btn play" id="playBtn" onclick="togglePlay()">▶ 播放</button>
</div>
</div>
<div class="card">
<div class="card-title">📐 波形参数</div>
<div class="info-row" id="infoRow"></div>
</div>
<div class="footer">波形可视化 - Web Audio API + Canvas</div>
</div>
<script>
let audioCtx,oscillator,gainNode,analyser,animId,isPlaying=false;
let freq=440,amp=50,phase=0,waveType='sine';
const WAVES=[{id:'sine',name:'正弦波'},{id:'square',name:'方波'},{id:'sawtooth',name:'锯齿波'},{id:'triangle',name:'三角波'}];
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('.theme-toggle').textContent=t==='dark'?'☀️':'🌙'}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function buildWaveSelector(){document.getElementById('waveSelector').innerHTML=WAVES.map(w=>`<button class="wave-btn${w.id===waveType?' active':''}" onclick="selectWave('${w.id}')">${w.name}</button>`).join('')}
function selectWave(w){waveType=w;buildWaveSelector();if(isPlaying){stopOsc();startOsc()}}
function updateParam(){freq=+document.getElementById('freqSlider').value;amp=+document.getElementById('ampSlider').value;phase=+document.getElementById('phaseSlider').value;document.getElementById('freqVal').textContent=freq+' Hz';document.getElementById('ampVal').textContent=amp+'%';document.getElementById('phaseVal').textContent=phase+'°';if(oscillator)oscillator.frequency.setValueAtTime(freq,audioCtx.currentTime);if(gainNode)gainNode.gain.setValueAtTime(amp/100*0.3,audioCtx.currentTime);updateInfo()}
function togglePlay(){if(isPlaying)stopPlay();else startPlay()}
function startPlay(){initAudio();isPlaying=true;document.getElementById('playBtn').textContent='⏹ 停止';document.getElementById('playBtn').classList.add('active');oscillator=audioCtx.createOscillator();gainNode=audioCtx.createGain();analyser=audioCtx.createAnalyser();analyser.fftSize=2048;oscillator.type=waveType;oscillator.frequency.setValueAtTime(freq,audioCtx.currentTime);gainNode.gain.setValueAtTime(amp/100*0.3,audioCtx.currentTime);oscillator.connect(gainNode);gainNode.connect(analyser);analyser.connect(audioCtx.destination);oscillator.start();drawWave()}
function stopPlay(){isPlaying=false;document.getElementById('playBtn').textContent='▶ 播放';document.getElementById('playBtn').classList.remove('active');stopOsc();cancelAnimationFrame(animId);clearCanvas()}
function stopOsc(){if(oscillator){try{oscillator.stop()}catch(e){}oscillator=null}}
function drawWave(){if(!isPlaying||!analyser)return;const canvas=document.getElementById('waveCanvas');const ctx=canvas.getContext('2d');const W=canvas.width,H=canvas.height;const bufferLength=analyser.fftSize;const dataArray=new Float32Array(bufferLength);analyser.getFloatTimeDomainData(dataArray);ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#00ff88';ctx.lineWidth=2;ctx.beginPath();const sliceWidth=W/bufferLength;let x=0;for(let i=0;i<bufferLength;i++){const v=dataArray[i];const y=(v+1)/2*H;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);x+=sliceWidth}ctx.stroke();ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();animId=requestAnimationFrame(drawWave)}
function clearCanvas(){const canvas=document.getElementById('waveCanvas');const ctx=canvas.getContext('2d');ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.moveTo(0,canvas.height/2);ctx.lineTo(canvas.width,canvas.height/2);ctx.stroke()}
function updateInfo(){const wavelength=340/freq;const period=1/freq*1000;document.getElementById('infoRow').innerHTML=`<span class="info-tag">波长: ${wavelength.toFixed(2)}m</span><span class="info-tag">周期: ${period.toFixed(2)}ms</span><span class="info-tag">波形: ${WAVES.find(w=>w.id===waveType).name}</span><span class="info-tag">频率: ${freq}Hz</span>`}
function drawStaticWave(){const canvas=document.getElementById('waveCanvas');const ctx=canvas.getContext('2d');const W=canvas.width,H=canvas.height;ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#6366f1';ctx.lineWidth=2;ctx.beginPath();const phaseRad=phase*Math.PI/180;for(let x=0;x<W;x++){const t=x/W*4*Math.PI+phaseRad;let y;const a=amp/100;if(waveType==='sine')y=Math.sin(t*freq/220);else if(waveType==='square')y=Math.sign(Math.sin(t*freq/220));else if(waveType==='sawtooth')y=2*(t*freq/220/(2*Math.PI)%1)-1;else y=2*Math.abs(2*(t*freq/220/(2*Math.PI)%1)-1)-1;const py=H/2-y*a*H/2;if(x===0)ctx.moveTo(x,py);else ctx.lineTo(x,py)}ctx.stroke();ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke()}
buildWaveSelector();updateInfo();drawStaticWave();
</script>
</body>
</html>
