<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>倒计时组件 - garyy-tools</title>
<meta name="description" content="倒计时组件，支持自定义日期倒计时、节日倒计时和生日倒计时">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;scroll-behavior:smooth}.container{max-width:600px;margin:auto;padding-bottom:50px}header{text-align:center;padding:28px 0 16px}h1{font-size:1.3rem;margin-bottom:4px}.sub{color:var(--text2);font-size:.85rem}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}button{padding:8px 16px;border-radius:6px;border:none;background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;transition:opacity .2s}button:hover{opacity:.85}.btn-green{background:var(--green)}.btn-red{background:var(--red)}input,select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.9rem;width:100%;outline:none;font-family:inherit}input:focus,select:focus{border-color:var(--blue)}.input-row{display:flex;gap:10px;margin-bottom:12px}.input-row input{flex:1}.countdown-list{display:grid;gap:12px}.cd-item{background:var(--bg);border-radius:8px;padding:16px;position:relative}.cd-item .title{font-weight:600;margin-bottom:4px}.cd-item .date{font-size:.8rem;color:var(--text2);margin-bottom:12px}.cd-nums{display:flex;gap:8px;justify-content:center}.cd-num{text-align:center}.cd-num .val{font-size:1.8rem;font-weight:700;color:var(--blue);display:block;line-height:1}.cd-num .lbl{font-size:.7rem;color:var(--text2)}.cd-item .del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--red);cursor:pointer;font-size:.8rem;padding:4px;border-radius:4px}.cd-item .del:hover{background:rgba(239,68,68,.15)}.empty{text-align:center;color:var(--text2);padding:24px;font-size:.85rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="倒计时组件 - garyy-tools">
<meta property="og:description" content="倒计时组件，支持自定义日期倒计时、节日倒计时和生日倒计时">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>⏳ 倒计时组件</h1>
<div class="sub">自定义日期 · 节日倒计时 · 生日倒计时</div>
</header>
<div class="card">
<div class="input-row">
<input type="text" id="cdTitle" placeholder="事件名称" maxlength="30">
</div>
<div class="input-row">
<input type="datetime-local" id="cdDate">
<button class="btn-green" id="btnAdd">添加</button>
</div>
<div style="margin-top:8px">
<div style="font-size:.8rem;color:var(--text2);margin-bottom:8px">快捷添加：</div>
<div style="display:flex;gap:6px;flex-wrap:wrap" id="quickBtns"></div>
</div>
</div>
<div class="card">
<div class="countdown-list" id="cdList"></div>
</div>
</div>
<script>
(function(){
'use strict';
const STORAGE_KEY='widget-countdowns';
let items=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(items));}
function getDiff(target){
const now=new Date();const t=new Date(target);
const diff=t-now;
if(diff<=0)return null;
const days=Math.floor(diff/86400000);
const hours=Math.floor((diff%86400000)/3600000);
const mins=Math.floor((diff%3600000)/60000);
const secs=Math.floor((diff%60000)/1000);
return{days,hours,mins,secs};
}
function render(){
const el=document.getElementById('cdList');
if(!items.length){el.innerHTML='<div class="empty">暂无倒计时，添加一个吧</div>';return;}
items.sort((a,b)=>new Date(a.date)-new Date(b.date));
el.innerHTML=items.map((item,i)=>{
const d=getDiff(item.date);
if(!d){
const target=new Date(item.date);
return '<div class="cd-item"><button class="del" data-i="'+i+'">✕</button><div class="title">'+escHtml(item.title)+'</div><div class="date">'+target.toLocaleDateString('zh-CN')+'</div><div style="text-align:center;color:var(--gold);font-weight:600">🎉 时间已到！</div></div>';
}
return '<div class="cd-item"><button class="del" data-i="'+i+'">✕</button><div class="title">'+escHtml(item.title)+'</div><div class="date">'+new Date(item.date).toLocaleDateString('zh-CN')+'</div><div class="cd-nums"><div class="cd-num"><span class="val">'+d.days+'</span><span class="lbl">天</span></div><div class="cd-num"><span class="val">'+String(d.hours).padStart(2,'0')+'</span><span class="lbl">时</span></div><div class="cd-num"><span class="val">'+String(d.mins).padStart(2,'0')+'</span><span class="lbl">分</span></div><div class="cd-num"><span class="val">'+String(d.secs).padStart(2,'0')+'</span><span class="lbl">秒</span></div></div></div>';
}).join('');
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function addItem(title,dateStr){
if(!title||!dateStr)return;
items.push({title,date:dateStr});
save();render();
}
document.getElementById('btnAdd').onclick=()=>{
const title=document.getElementById('cdTitle').value.trim();
const date=document.getElementById('cdDate').value;
if(!title){alert('请输入事件名称');return;}
if(!date){alert('请选择日期');return;}
addItem(title,date);
document.getElementById('cdTitle').value='';
document.getElementById('cdDate').value='';
};
const quickEvents=[
{name:'元旦',month:0,day:1},
{name:'春节',month:1,day:1},
{name:'五一劳动节',month:4,day:1},
{name:'国庆节',month:9,day:1},
{name:'圣诞节',month:11,day:25},
{name:'明年元旦',month:0,day:1,nextYear:true}
];
document.getElementById('quickBtns').innerHTML=quickEvents.map(e=>'<button style="font-size:.78rem;padding:4px 10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)" data-name="'+e.name+'" data-m="'+e.month+'" data-d="'+e.day+'" data-ny="'+(e.nextYear?'1':'0')+'">'+e.name+'</button>').join('');
document.getElementById('quickBtns').onclick=function(e){
const btn=e.target.closest('button');if(!btn)return;
const now=new Date();let y=now.getFullYear();
const m=+btn.dataset.m,d=+btn.dataset.d;
if(btn.dataset.ny==='1'||new Date(y,m,d)<=now){y++;}
const dateStr=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')+'T00:00';
addItem(btn.dataset.name,dateStr);
};
document.getElementById('cdList').onclick=function(e){
if(e.target.classList.contains('del')){
const i=+e.target.dataset.i;items.splice(i,1);save();render();
}
};
render();setInterval(render,1000);
})();
</script>
</body>
</html>
