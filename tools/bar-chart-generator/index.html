<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柱状图生成器 - Bar Chart Generator</title>
<meta property="og:title" content="柱状图生成器 - Bar Chart Generator">
<meta property="og:description" content="柱状图生成器 - Bar Chart Generator">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线柱状图生成器，支持自定义数据、颜色和样式，快速生成美观的柱状图">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='18' width='6' height='12' fill='%23e94560' rx='1'/><rect x='10' y='10' width='6' height='20' fill='%23533483' rx='1'/><rect x='18' y='14' width='6' height='16' fill='%230f3460' rx='1'/><rect x='26' y='6' width='6' height='24' fill='%23e94560' rx='1'/></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--text:#e0e0e0;--text2:#a0a0b0;--accent:#e94560;--accent2:#533483;--border:#2a2a4a;--shadow:0 4px 24px rgba(0,0,0,.4);--radius:10px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--surface:#fff;--surface2:#f0f3f6;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#8250df;--border:#d0d7de;--shadow:0 2px 8px rgba(0,0,0,.1);--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vhpadding:16px;}
h1{font-size:20px;font-weight:700;color:var(--accent);padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.container{display:flex;height:calc(100vh - 56px)}
.sidebar{width:320px;background:var(--surface);border-right:1px solid var(--border);padding:16px;overflow-y:auto;flex-shrink:0}
.main{flex:1;padding:16px;overflow:auto;display:flex;flex-direction:column}
label{display:block;font-size:13px;color:var(--text2);margin:8px 0 4px}
input,textarea,select{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:13px;font-family:inherit}
textarea{resize:vertical;min-height:80px;font-family:monospace}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;width:100%;margin-top:12px;transition:var(--transition)}
.btn:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);margin-top:8px}
.btn-outline:hover{background:var(--surface2)}
.chart-wrap{flex:1;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;min-height:400px}
canvas{max-width:100%;max-height:100%}
.toggle-theme{position:fixed;top:16px;right:16px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;z-index:200}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<h1>📊 柱状图生成器 Bar Chart Generator</h1>
<button class="toggle-theme" onclick="toggleTheme()">🌙 / ☀️</button>
<div class="container">
<div class="sidebar">
<label>图表标题</label>
<input id="title" value="月度销售额" placeholder="输入标题">
<label>数据（每行：标签,数值）</label>
<textarea id="data" rows="8">一月,120
二月,200
三月,150
四月,280
五月,220
六月,310</textarea>
<label>颜色主题</label>
<select id="theme">
<option value="rainbow">彩虹色</option>
<option value="warm">暖色系</option>
<option value="cool">冷色系</option>
<option value="mono">单色渐变</option>
<option value="neon">霓虹色</option>
</select>
<label>柱体圆角</label>
<input id="radius" type="range" min="0" max="20" value="4">
<label>显示数值</label>
<select id="showValues"><option value="yes">显示</option><option value="no">隐藏</option></select>
<label>柱体间距</label>
<input id="gap" type="range" min="10" max="60" value="30">
<button class="btn" onclick="drawChart()">生成图表</button>
<button class="btn btn-outline" onclick="exportPNG()">导出 PNG</button>
<button class="btn btn-outline" onclick="exportSVG()">导出 SVG</button>
</div>
<div class="main">
<div class="chart-wrap"><canvas id="canvas"></canvas></div>
</div>
</div>
<script>
const palettes={rainbow:['#e94560','#533483','#0f3460','#f5a623','#1a7f37','#0969da','#8250df','#cf222e','#bf8700','#1f6feb'],warm:['#e94560','#f5a623','#cf222e','#bf8700','#da3633','#ea6045','#f0883e','#d29922'],cool:['#0969da','#533483','#1f6feb','#8250df','#0550ae','#116329','#0969da','#6639ba'],mono:['#0f3460','#1a4a7a','#2563a0','#3080c0','#40a0e0','#60b8f0'],neon:['#e94560','#00ff88','#00aaff','#ff6600','#cc00ff','#ffff00','#00ffcc','#ff0066']};
function parseData(){return document.getElementById('data').value.trim().split('\n').map(l=>{const p=l.split(/[,，]/);return{label:p[0]||'',value:parseFloat(p[1])||0}}).filter(d=>d.label)}
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'}
function drawChart(){
const cv=document.getElementById('canvas'),ctx=cv.getContext('2d');
const wrap=cv.parentElement;
cv.width=wrap.clientWidth*2;cv.height=wrap.clientHeight*2;
ctx.scale(2,2);
const W=wrap.clientWidth,H=wrap.clientHeight;
const data=parseData();if(!data.length)return;
const title=document.getElementById('title').value;
const pal=palettes[document.getElementById('theme').value];
const barR=+document.getElementById('radius').value;
const showV=document.getElementById('showValues').value==='yes';
const gap=+document.getElementById('gap').value;
const maxV=Math.max(...data.map(d=>d.value),1);
const pad={top:60,right:30,bottom:60,left:60};
const cW=W-pad.left-pad.right,cH=H-pad.top-pad.bottom;
const barW=(cW-gap*(data.length-1))/data.length;
ctx.clearRect(0,0,W,H);
ctx.fillStyle=ctx.canvas.style.background||'#16213e';
ctx.fillRect(0,0,W,H);
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#e0e0e0';
ctx.font='bold 16px -apple-system,sans-serif';ctx.textAlign='center';
ctx.fillText(title,W/2,30);
const gridLines=5;
for(let i=0;i<=gridLines;i++){
const y=pad.top+cH-cH*(i/gridLines);
ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(W-pad.right,y);ctx.stroke();
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text2').trim()||'#a0a0b0';
ctx.font='11px sans-serif';ctx.textAlign='right';
ctx.fillText(Math.round(maxV*i/gridLines),pad.left-8,y+4);
}
data.forEach((d,i)=>{
const x=pad.left+i*(barW+gap);
const bH=cH*(d.value/maxV);
const y=pad.top+cH-bH;
const color=pal[i%pal.length];
ctx.fillStyle=color;
ctx.beginPath();
if(barR>0&&bH>barR*2){
ctx.moveTo(x,y+barR);ctx.arcTo(x,y,x+barW,y,barR);ctx.arcTo(x+barW,y,x+barW,y+bH,barR);
ctx.lineTo(x+barW,pad.top+cH);ctx.lineTo(x,pad.top+cH);ctx.closePath();ctx.fill();
}else{ctx.fillRect(x,y,barW,bH)}
if(showV){ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#e0e0e0';
ctx.font='bold 12px sans-serif';ctx.textAlign='center';
ctx.fillText(d.value,x+barW/2,y-6)}
ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text2').trim()||'#a0a0b0';
ctx.font='12px sans-serif';ctx.textAlign='center';
ctx.fillText(d.label,x+barW/2,pad.top+cH+20);
});
}
function exportPNG(){
const cv=document.getElementById('canvas');
const a=document.createElement('a');a.download='bar-chart.png';a.href=cv.toDataURL('image/png');a.click();
}
function exportSVG(){
const data=parseData();if(!data.length)return;
const maxV=Math.max(...data.map(d=>d.value),1);
const pal=palettes[document.getElementById('theme').value];
const W=800,H=500,pad={top:60,right:30,bottom:60,left:60};
const cW=W-pad.left-pad.right,cH=H-pad.top-pad.bottom;
const gap=+document.getElementById('gap').value;
const barW=(cW-gap*(data.length-1))/data.length;
let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
<rect width="${W}" height="${H}" fill="#16213e"/>
<text x="${W/2}" y="35" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">${document.getElementById('title').value}</text>`;
data.forEach((d,i)=>{
const x=pad.left+i*(barW+gap);const bH=cH*(d.value/maxV);const y=pad.top+cH-bH;
svg+=`<rect x="${x}" y="${y}" width="${barW}" height="${bH}" fill="${pal[i%pal.length]}" rx="4"/>`;
if(document.getElementById('showValues').value==='yes')
svg+=`<text x="${x+barW/2}" y="${y-6}" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="bold">${d.value}</text>`;
svg+=`<text x="${x+barW/2}" y="${pad.top+cH+20}" text-anchor="middle" fill="#a0a0b0" font-size="12">${d.label}</text>`;
});
svg+='</svg>';
const blob=new Blob([svg],{type:'image/svg+xml'});
const a=document.createElement('a');a.download='bar-chart.svg';a.href=URL.createObjectURL(blob);a.click();
}
drawChart();window.addEventListener('resize',drawChart);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
</body>
</html>
