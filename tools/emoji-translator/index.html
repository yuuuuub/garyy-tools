<html lang="zh-CN">

<meta charset="UTF-8">

<title>😎 Emoji 翻译器</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0f4ff;

  --text: #1a1a2e;
  --text-secondary: #555;
  --primary: #6c63ff;
  --primary-hover: #5a52d5;
  --input-bg: #f5f6fa;
  --input-border: #d1d5db;
  --tag-bg: #eef0ff;
  --tag-text: #6c63ff;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --toast-bg: #1a1a2e;
  --toast-text: #fff;
  --divider: #e5e7eb;
  --toggle-bg: #ddd;
}
.dark {
  --bg: #0f0f23;
  --card-bg: #1a1a2e;
  --text: #e4e4f0;
  --text-secondary: #a0a0b8;
  --input-bg: #252540;
  --input-border: #3a3a5c;
  --tag-bg: #2a2a45;
  --tag-text: #b4b4ff;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --toast-bg: #e4e4f0;
  --toast-text: #1a1a2e;
  --divider: #2a2a45;
  --toggle-bg: #3a3a5c;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 16px;
  transition: background 0.3s, color 0.3s;
}
.container {
  width: 100%;
  max-width: 520px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
}
h1 {
  font-size: 1.5rem;
  font-weight: 700;
}
.theme-toggle {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: var(--card-bg);
  color: var(--text);
  font-size: 1.2rem;
  cursor: pointer;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}
.theme-toggle:hover { transform: scale(1.08); }
.card {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
  transition: background 0.3s;
}
.mode-tabs {
  display: flex;
  gap: 4px;
  background: var(--input-bg);
  border-radius: 12px;
  padding: 4px;
}
.mode-tab {
  flex: 1;
  padding: 10px 8px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.mode-tab.active {
  background: var(--primary);
  color: #fff;
}
textarea {
  width: 100%;
  min-height: 110px;
  padding: 14px;
  border: 2px solid var(--input-border);
  border-radius: 12px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 0.95rem;
  font-family: inherit;
  resize: vertical;
  transition: border-color 0.2s;
  margin-top: 16px;
}
textarea:focus {
  outline: none;
  border-color: var(--primary);
}
textarea::placeholder { color: var(--text-secondary); opacity: 0.6; }
.result-box {
  margin-top: 12px;
  min-height: 60px;
  padding: 14px;
  border: 2px dashed var(--input-border);
  border-radius: 12px;
  background: var(--input-bg);
  font-size: 1.1rem;
  line-height: 1.7;
  word-break: break-word;
  position: relative;
  transition: border-color 0.2s;
}
.result-box.has-content { border-style: solid; border-color: var(--primary); }
.result-placeholder {
  color: var(--text-secondary);
  opacity: 0.5;
  font-size: 0.9rem;
}
.btn-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.btn {
  padding: 10px 18px;
  border: none;
  border-radius: 10px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  white-space: nowrap;
}
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
.btn-outline {
  background: transparent;
  color: var(--primary);
  border: 2px solid var(--primary);
}
.btn-outline:hover { background: var(--primary); color: #fff; }
.fun-mode-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: linear-gradient(135deg, #ff6b6b, #ffd93d);
  color: #1a1a2e;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 700;
  animation: pulse 2s infinite;
  margin-left: 4px;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}
.emoji-meaning-block {
  margin-top: 8px;
  padding: 12px;
  border-radius: 10px;
  background: var(--input-bg);
  min-height: 50px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.emoji-big {
  font-size: 2.5rem;
  flex-shrink: 0;
}
.emoji-info { flex: 1; min-width: 0; }
.emoji-keyword {
  display: inline-block;
  background: var(--tag-bg);
  color: var(--tag-text);
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.75rem;
  margin: 2px 4px 2px 0;
}
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--toast-bg);
  color: var(--toast-text);
  padding: 10px 24px;
  border-radius: 25px;
  font-size: 0.85rem;
  font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  z-index: 999;
  transition: transform 0.3s ease;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
footer {
  text-align: center;
  padding: 8px 0 16px;
  color: var(--text-secondary);
  font-size: 0.75rem;
  opacity: 0.6;
}
@media (min-width: 600px) {
  .mode-tab { font-size: 0.9rem; padding: 12px 16px; }
  h1 { font-size: 1.75rem; }
}
</style>
</head>

<div class="container">
  <header>
    <h1>😎 Emoji 翻译器</h1>
    <button class="theme-toggle" id="themeToggle" aria-label="切换暗色模式">🌙</button>
  </header>

  <!-- 模式切换 -->
  <div class="card">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="text-to-emoji">文字 → Emoji</button>
      <button class="mode-tab" data-mode="emoji-to-text">Emoji → 文字</button>
    </div>

    <!-- 文字→Emoji 模式 -->
    <div id="panelTextToEmoji">
      <textarea id="inputText" placeholder="输入中文或英文，自动翻译成 Emoji...&#10;例如：我今天很开心，吃了苹果和披萨"></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnTranslate">🔍 翻译</button>
        <button class="btn btn-outline" id="btnCopyText" disabled>📋 复制结果</button>
        <button class="btn btn-outline" id="btnFunMode">🤪 趣味加密</button>
      </div>
      <div id="funIndicator" style="margin-top:8px;display:none;"></div>
      <div class="result-box" id="resultBox">
        <span class="result-placeholder">翻译结果将显示在这里...</span>
      </div>
    </div>

    <!-- Emoji→文字 模式（默认隐藏） -->
    <div id="panelEmojiToText" style="display:none;">
      <textarea id="inputEmoji" placeholder="输入 Emoji 查看含义...&#10;例如：😊 🐱 🍎 🌈"></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnLookup">🔍 查看含义</button>
        <button class="btn btn-outline" id="btnCopyMeaning" disabled>📋 复制结果</button>
      </div>
      <div class="result-box" id="meaningBox">
        <span class="result-placeholder">Emoji 含义将显示在这里...</span>
      </div>
    </div>
  </div>

  <!-- 快速参考 -->

  </div>

  <footer>点击 Emoji 标签可快速查看含义</footer>
</div>
<div class="toast" id="toast"></div>

  { emoji: '💯', keywords: ['满分', '一百', '100', 'perfect', '完美'] },
  { emoji: '💥', keywords: ['爆炸', '冲突', 'explosion', 'boom'] },
  { emoji: '💩', keywords: ['屎', '便便', 'poop', 'crap', '糟糕'] },
  { emoji: '👻', keywords: ['幽灵', '鬼', 'ghost', '万圣节'] },
  { emoji: '🤖', keywords: ['机器人', 'AI', 'robot'] },
  { emoji: '👽', keywords: ['外星人', 'alien', 'ufo'] },
  { emoji: '🎉', keywords: ['庆祝', 'party', 'celebration', '派对'] },

  // === 旗帜 (Flags) ===
  { emoji: '🇨🇳', keywords: ['中国', 'china', '中华'] },
  { emoji: '🇺🇸', keywords: ['美国', 'usa', 'america', '美国佬'] },
  { emoji: '🇬🇧', keywords: ['英国', 'uk', 'britain', '英格兰'] },
  { emoji: '🇯🇵', keywords: ['日本', 'japan'] },
  { emoji: '🇰🇷', keywords: ['韩国', 'korea', '思密达'] },
  { emoji: '🇫🇷', keywords: ['法国', 'france'] },
  { emoji: '🇩🇪', keywords: ['德国', 'germany'] },
  { emoji: '🇨🇦', keywords: ['加拿大', 'canada'] },
  { emoji: '🇦🇺', keywords: ['澳大利亚', 'australia', '澳洲'] },
  { emoji: '🏳️‍🌈', keywords: ['彩虹旗', 'LGBT', 'pride', '平等'] },
];

// 预构建查找结构
const keywordToEmoji = new Map();
const emojiToEntry = new Map();
emojiMap.forEach(entry => {
  emojiToEntry.set(entry.emoji, entry);
  entry.keywords.forEach(kw => keywordToEmoji.set(kw, entry.emoji));
});

// ====================
// 状态
// ====================
let currentMode = 'text-to-emoji';
let funModeActive = false;
let lastTextResult = '';
let lastEmojiResult = '';

// ====================
// DOM 元素
// ====================
const el = id => document.getElementById(id);
const modeTabs = document.querySelectorAll('.mode-tab');
const panelTextToEmoji = el('panelTextToEmoji');
const panelEmojiToText = el('panelEmojiToText');
const inputText = el('inputText');
const inputEmoji = el('inputEmoji');
const resultBox = el('resultBox');
const meaningBox = el('meaningBox');
const btnTranslate = el('btnTranslate');
const btnCopyText = el('btnCopyText');
const btnCopyMeaning = el('btnCopyMeaning');
const btnFunMode = el('btnFunMode');
const funIndicator = el('funIndicator');
const themeToggle = el('themeToggle');
const dictTags = el('dictTags');
const toast = el('toast');

// ====================
// 主题切换
// ====================
function initTheme() {
  const saved = localStorage.getItem('emoji-translator-theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
    themeToggle.textContent = '☀️';
  }
}
initTheme();
themeToggle.addEventListener('click', () => {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('emoji-translator-theme', isDark ? 'dark' : 'light');
  themeToggle.textContent = isDark ? '☀️' : '🌙';
});

// ====================
// 模式切换
// ====================
modeTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    modeTabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    panelTextToEmoji.style.display = currentMode === 'text-to-emoji' ? 'block' : 'none';
    panelEmojiToText.style.display = currentMode === 'emoji-to-text' ? 'block' : 'none';
    funModeActive = false;
    updateFunIndicator();
  });
});

// ====================
// 文字 → Emoji 翻译
// ====================
function translateTextToEmoji(text, maxReplace = Infinity) {
  if (!text.trim()) return '';
  let result = text;
  // 按关键词长度降序排列，优先匹配长关键词
  const sortedKeys = [...keywordToEmoji.keys()].sort((a, b) => b.length - a.length);
  let replaced = 0;
  for (const keyword of sortedKeys) {
    if (replaced >= maxReplace) break;
    const emoji = keywordToEmoji.get(keyword);
    // 构建不区分大小写的正则
    const regex = new RegExp(keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    let count = 0;
    result = result.replace(regex, match => {
      count++;
      return emoji;
    });
    if (count > 0) {
      replaced++;
    }
  }
  return result;
}

function doTextTranslate() {
  const text = inputText.value.trim();
  if (!text) {
    showToast('请先输入文字');
    return;
  }
  const maxReplace = funModeActive ? Infinity : Infinity;
  lastTextResult = translateTextToEmoji(text, maxReplace);
  if (lastTextResult === text) {
    resultBox.innerHTML = '<span style="color:var(--text-secondary);font-size:0.9rem;">没有找到可匹配的 Emoji，请尝试其他关键词</span>';
    btnCopyText.disabled = true;
  } else {
    resultBox.textContent = lastTextResult;
    resultBox.classList.add('has-content');
    btnCopyText.disabled = false;
  }
}

btnTranslate.addEventListener('click', doTextTranslate);

// Enter 键触发翻译（在 textarea 中 Shift+Enter 换行）
inputText.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    doTextTranslate();
  }
});

// ====================
// 趣味模式
// ====================
function toggleFunMode() {
  funModeActive = !funModeActive;
  updateFunIndicator();
  if (funModeActive && inputText.value.trim()) {
    doTextTranslate();
  } else if (!funModeActive && inputText.value.trim()) {
    doTextTranslate();
  }
}

function updateFunIndicator() {
  if (funModeActive) {
    btnFunMode.classList.add('btn-primary');
    btnFunMode.classList.remove('btn-outline');
    btnFunMode.innerHTML = '🤪 趣味加密 <span class="fun-mode-badge">ON</span>';
  } else {
    btnFunMode.classList.remove('btn-primary');
    btnFunMode.classList.add('btn-outline');
    btnFunMode.textContent = '🤪 趣味加密';
  }
}

btnFunMode.addEventListener('click', toggleFunMode);

// ====================
// Emoji → 文字 查询
// ====================
function lookupEmoji(emojiStr) {
  if (!emojiStr.trim()) return '';
  // 处理组合 emoji（如 🏳️‍🌈）
  let results = [];
  let i = 0;
  const chars = [...emojiStr.trim()];
  while (i < chars.length) {
    let found = false;
    // 尝试向前匹配多字符 emoji
    for (let len = Math.min(8, chars.length - i); len >= 1; len--) {
      const candidate = chars.slice(i, i + len).join('');
      const entry = emojiToEntry.get(candidate);
      if (entry) {
        results.push(entry);
        i += len;
        found = true;
        break;
      }
    }
    if (!found) {
      // 不是 emoji，原样保留（可能是普通文字）
      if (chars[i] !== ' ' && chars[i] !== '\n') {
        results.push({ emoji: chars[i], keywords: ['(未识别)'] });
      }
      i++;
    }
  }
  return results;
}

function doEmojiLookup() {
  const text = inputEmoji.value.trim();
  if (!text) {
    showToast('请输入 Emoji');
    return;
  }
  const results = lookupEmoji(text);
  if (results.length === 0) {
    meaningBox.innerHTML = '<span style="color:var(--text-secondary);font-size:0.9rem;">未找到 Emoji 信息</span>';
    btnCopyMeaning.disabled = true;
    lastEmojiResult = '';
    return;
  }
  let html = '';
  let textResult = '';
  results.forEach(r => {
    const isUnknown = r.keywords.includes('(未识别)');
    textResult += r.emoji + ' = ' + r.keywords.join(', ') + '\n';
    html += `<div class="emoji-meaning-block">
      <span class="emoji-big">${r.emoji}</span>
      <div class="emoji-info">
        ${isUnknown ? '<span style="color:var(--text-secondary);font-size:0.85rem;">未识别的字符</span>' : r.keywords.map(k => `<span class="emoji-keyword">${k}</span>`).join('')}
      </div>
    </div>`;
  });
  meaningBox.innerHTML = html;
  meaningBox.classList.add('has-content');
  btnCopyMeaning.disabled = false;
  lastEmojiResult = textResult.trim();
}

el('btnLookup').addEventListener('click', doEmojiLookup);
inputEmoji.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    doEmojiLookup();
  }
});

// ====================
// 复制
// ====================
btnCopyText.addEventListener('click', () => {
  copyToClipboard(lastTextResult);
});
btnCopyMeaning.addEventListener('click', () => {
  copyToClipboard(lastEmojiResult);
});

function copyToClipboard(text) {
  if (!text) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('复制成功！'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('复制成功！');
  }
}

// ====================
// Toast
// ====================
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ====================
// 词典标签
// ====================
function renderDictTags() {
  // 按分类展示一些代表性 emoji
  const tagsHtml = emojiMap.map(e =>
    `<span class="emoji-keyword" style="cursor:pointer;font-size:1.1rem;padding:6px 10px;" data-emoji="${e.emoji}" title="${e.keywords.join(', ')}">${e.emoji}</span>`
  ).join('');
  dictTags.innerHTML = tagsHtml;

  dictTags.addEventListener('click', e => {
    const tag = e.target.closest('[data-emoji]');
    if (tag) {
      const emoji = tag.dataset.emoji;
      inputEmoji.value = emoji;
      // 切换到 Emoji→文字 模式
      modeTabs.forEach(t => t.classList.remove('active'));
      const emojiTab = document.querySelector('[data-mode="emoji-to-text"]');
      if (emojiTab) emojiTab.classList.add('active');
      currentMode = 'emoji-to-text';
      panelTextToEmoji.style.display = 'none';
      panelEmojiToText.style.display = 'block';
      doEmojiLookup();
      // 滚动到结果区
      meaningBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
}
renderDictTags();
</script>
</body>
