<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国武术百科 - Chinese Martial Arts Encyclopedia</title>
<meta name="description" content="中国武术百科，涵盖少林、武当、太极、形意、八卦等各大门派的拳法与器械">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国武术百科 - Chinese Martial Arts Encyclopedia">
<meta property="og:description" content="中国武术百科，涵盖少林、武当、太极、形意、八卦等各大门派的拳法与器械">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-martial-arts-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥋</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a05 0%,#2a1510 50%,#3d2015 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a,#b06a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.martial-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.martial-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.martial-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.martial-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.martial-card .m-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.martial-card .m-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(232,168,124,0.15);color:var(--accent)}
.martial-card .m-name{font-size:1.3em;font-weight:bold}
.martial-card .m-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.martial-card .m-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.martial-card .m-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.martial-card .m-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.martial-card .m-detail strong{color:var(--text)}
.martial-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.martial-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🥋 中国武术百科</h1>
<p>Chinese Martial Arts Encyclopedia — 探索少林、武当、太极、形意、八卦等武术门派</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索门派、拳法或器械...（如"少林""太极拳""咏春"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部门派</button>
<button class="filter-btn" data-filter="外家拳">🥊 外家拳</button>
<button class="filter-btn" data-filter="内家拳">☯️ 内家拳</button>
<button class="filter-btn" data-filter="南拳">🏯 南拳</button>
<button class="filter-btn" data-filter="器械">⚔️ 器械</button>
<button class="filter-btn" data-filter="气功养生">🧘 气功养生</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="martial-grid" id="martialGrid"></div>
<footer><p>🥋 中国武术百科 — 武以载道，以武会友</p></footer>
</div>
<script>
const MARTIAL_DATA=[
  {id:1,name:"少林功夫",en:"Shaolin Kung Fu",category:"外家拳",icon:"🥊",origin:"河南嵩山",dynasty:"北魏",features:"刚猛有力、拳禅一体",history:"少林功夫起源于河南嵩山少林寺，有一千五百多年历史。以'天下功夫出少林'闻名，是中国武术的重要代表。",techniques:["拳法","腿法","擒拿","气功","棍术","刀术","剑术","枪术"],forms:["少林长拳","罗汉拳","炮拳","梅花拳","七星拳","心意把","易筋经","洗髓经"],weapons:["棍","刀","剑","枪","禅杖","九节鞭","三节棍","流星锤"],culture:"少林功夫讲究'禅武合一'，是佛教禅宗与武术的完美结合。"},
  {id:2,name:"太极拳",en:"Tai Chi",category:"内家拳",icon:"☯️",origin:"河南温县",dynasty:"明末清初",features:"以柔克刚、阴阳相济",history:"太极拳起源于河南温县陈家沟，是中国最具代表性的内家拳术。2020年被列入联合国教科文组织人类非物质文化遗产代表作名录。",techniques:["掤","捋","挤","按","采","挒","肘","靠"],forms:["陈式太极拳","杨式太极拳","吴式太极拳","武式太极拳","孙式太极拳","24式简化太极拳","42式太极拳","太极剑"],weapons:["太极剑","太极刀","太极棍","太极枪","太极扇","太极球","太极尺","太极绳"],culture:"太极拳体现了中国传统哲学中'阴阳相济'的思想，是健身、养生、技击三位一体的武术。"},
  {id:3,name:"咏春拳",en:"Wing Chun",category:"南拳",icon:"🥊",origin:"广东佛山",dynasty:"清代",features:"寸劲、中线理论",history:"咏春拳是南拳的代表性拳种，以贴身短打、寸劲发力著称。因李小龙和叶问而闻名世界。",techniques:["小念头","寻桥","标指","寸劲","连消带打","黐手","日字冲拳","摊膀伏"],forms:["小念头","寻桥","标指","木人桩","八斩刀","六点半棍","蝴蝶刀","二字钳羊马"],weapons:["八斩刀","六点半棍","蝴蝶双刀","短棍","长棍","双刀","单刀","藤牌"],culture:"咏春拳以'中线理论'为核心，强调以最短距离、最快速度攻击对手要害。"},
  {id:4,name:"武当功夫",en:"Wudang Kung Fu",category:"内家拳",icon:"🏔️",origin:"湖北武当山",dynasty:"明代",features:"以静制动、后发先至",history:"武当功夫源于湖北武当山，以张三丰为祖师。与少林功夫并称'北崇少林，南尊武当'。",techniques:["以静制动","后发先至","四两拨千斤","借力打力","引进落空","粘连黏随","听劲化劲","发劲"],forms:["武当太极","武当形意","武当八卦","武当纯阳","武当太乙","武当玄武","武当龙形","武当蛇形"],weapons:["武当剑","武当刀","武当枪","武当拂尘","武当棍","武当扇","武当笛","武当笔"],culture:"武当功夫融合了道家思想，强调'道法自然'，注重内功修炼和身心修养。"},
  {id:5,name:"形意拳",en:"Xing Yi Quan",category:"内家拳",icon:"🐉",origin:"山西",dynasty:"明末清初",features:"五行拳、十二形",history:"形意拳是中国三大内家拳之一，以五行拳和十二形拳为基本内容。拳法简朴，威力巨大。",techniques:["劈","崩","钻","炮","横","龙形","虎形","猴形"],forms:["五行拳","十二形","杂式捶","连环拳","安身炮","对练","五行相克","五行连环"],weapons:["形意刀","形意剑","形意枪","形意棍","形意鞭","形意锤","形意戟","形意钺"],culture:"形意拳以'形'为外在表现，以'意'为内在驱动，强调'心意诚于中，肢体形于外'。"},
  {id:6,name:"八卦掌",en:"Ba Gua Zhang",category:"内家拳",icon:"🔄",origin:"北京",dynasty:"清代",features:"走转掌法、变化无穷",history:"八卦掌是中国三大内家拳之一，以走转掌法为特色。创始人董海川，以'游龙八卦'闻名。",techniques:["单换掌","双换掌","顺势掌","背身掌","翻身掌","磨身掌","三穿掌","回身掌"],forms:["八大母掌","六十四掌","游身八卦掌","龙形八卦","蛇形八卦","狮形八卦","鹿形八卦","鹰形八卦"],weapons:["八卦刀","八卦剑","八卦枪","八卦棍","八卦钺","八卦锤","八卦鞭","八卦刺"],culture:"八卦掌以'走'为核心，体现了《易经》八卦变化的哲学思想。"},
  {id:7,name:"洪拳",en:"Hung Gar",category:"南拳",icon:"🏯",origin:"广东",dynasty:"清代",features:"桥手、铁线拳",history:"洪拳是南拳的代表性拳种，以刚猛著称。创始人洪熙官，是南少林五祖之一。",techniques:["桥手","铁线拳","工字伏虎","虎鹤双形","五形拳","十形拳","标指","扣打"],forms:["工字伏虎","虎鹤双形","五形拳","十形拳","铁线拳","五形拳","千字掌","虎爪"],weapons:["洪家刀","洪家棍","洪家剑","洪家枪","铁尺","蝴蝶刀","藤牌","双刀"],culture:"洪拳以'硬桥硬马'著称，体现了南派武术刚猛有力的特点。"},
  {id:8,name:"八段锦",en:"Ba Duan Jin",category:"气功养生",icon:"🧘",origin:"宋代",dynasty:"宋代",features:"八式动作、简单易学",history:"八段锦是中国传统的气功养生功法，有八百多年历史。因其动作简单、效果显著而广为流传。",techniques:["双手托天理三焦","左右开弓似射雕","调理脾胃须单举","五劳七伤往后瞧","摇头摆尾去心火","两手攀足固肾腰","攒拳怒目增气力","背后七颠百病消"],forms:["坐式八段锦","立式八段锦","南派八段锦","北派八段锦"],culture:"八段锦是中国传统养生文化的精华，简单易学，适合各年龄段人群练习。"},
  {id:9,name:"五禽戏",en:"Wu Qin Xi",category:"气功养生",icon:"🐾",origin:"东汉",dynasty:"东汉",features:"模仿五种动物",history:"五禽戏是东汉名医华佗创编的健身气功，模仿虎、鹿、熊、猿、鸟五种动物的动作。",techniques:["虎戏","鹿戏","熊戏","猿戏","鸟戏","虎扑","鹿抵","熊晃"],forms:["华佗五禽戏","五禽戏新编","五禽戏健身法","五禽戏养生法"],culture:"五禽戏是中国最早的仿生健身气功，体现了'天人合一'的养生理念。"},
  {id:10,name:"易筋经",en:"Yi Jin Jing",category:"气功养生",icon:"💪",origin:"南北朝",dynasty:"南北朝",features:"强筋壮骨、内外兼修",history:"易筋经是中国传统的健身气功，相传为达摩祖师所创。'易'意为改变，'筋'指筋骨，意为改变筋骨。",techniques:["韦驮献杵","横胆降魔","摘星换斗","出爪亮翅","九鬼拔马刀","三盘落地","青龙探爪","卧虎扑食"],forms:["少林易筋经","道家易筋经","坐式易筋经","立式易筋经"],culture:"易筋经强调'内练一口气，外练筋骨皮'，是内外兼修的养生功法。"},
  {id:11,name:"醉拳",en:"Drunken Fist",category:"外家拳",icon:"🍶",origin:"民间",dynasty:"明代",features:"似醉非醉、形醉意不醉",history:"醉拳是中国武术中独特的拳种，模仿醉汉的形态，似醉非醉，形醉意不醉。",techniques:["醉步","醉眼","醉身","醉手","醉腿","醉跌","醉跳","醉转"],forms:["醉八仙","太白醉酒","武松醉打蒋门神","鲁智深醉打山门","醉剑","醉棍","醉刀","醉枪"],culture:"醉拳体现了中国武术'以形取意'的特点，看似随意，实则暗藏杀机。"},
  {id:12,name:"苗刀",en:"Miao Dao",category:"器械",icon:"⚔️",origin:"明代",dynasty:"明代",features:"长刀、双手握持",history:"苗刀是明代抗倭名将戚继光根据日本刀法改良的中国刀法。刀身修长，适合劈砍。",techniques:["劈","砍","撩","刺","挂","拦","扫","抹"],forms:["苗刀一路","苗刀二路","苗刀三路","苗刀对练"],weapons:["苗刀","长刀","腰刀","短刀","单刀","双刀","柳叶刀","雁翎刀"],culture:"苗刀是中国刀法的精华，体现了中国武术兼容并蓄的特点。"}
];
function renderCards(data){
  document.getElementById('martialGrid').innerHTML=data.map(m=>`
    <div class="martial-card" data-category="${m.category}">
      <div class="m-header"><div class="m-icon">${m.icon}</div><div><div class="m-name">${m.name}</div><div class="m-sub">${m.en} · ${m.origin}</div></div></div>
      <div class="m-meta"><span>${m.dynasty}</span><span>${m.features}</span></div>
      <div class="m-detail"><strong>历史：</strong>${m.history}</div>
      <div class="m-detail"><strong>技法：</strong>${m.techniques.join('、')}</div>
      <div class="m-detail"><strong>套路：</strong>${m.forms.join('、')}</div>
      <div class="m-detail"><strong>兵器：</strong>${m.weapons.join('、')}</div>
      <div class="m-detail"><strong>文化：</strong>${m.culture}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">门派/功法</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.martial-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.martial-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(MARTIAL_DATA);renderStats(MARTIAL_DATA);
</script>
</body>
</html>
