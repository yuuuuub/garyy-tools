<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国民族乐器学习指南 - Chinese Instrument Learning Guide</title>
<meta name="description" content="中国民族乐器学习指南，涵盖弹拨、拉弦、吹管、打击四大类乐器的入门教程与选购建议">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国民族乐器学习指南 - Chinese Instrument Learning Guide">
<meta property="og:description" content="中国民族乐器学习指南，涵盖弹拨、拉弦、吹管、打击四大类乐器的入门教程与选购建议">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-instrument-guide-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪕</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#60a5fa;--accent2:#3b82f6}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#2563eb;--accent2:#1d4ed8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#050d1a 0%,#0a1a30 50%,#102840 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #1a4a7a;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#60a5fa,#93c5fd,#3b82f6,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.guide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.guide-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.guide-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.guide-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.guide-card .gd-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.guide-card .gd-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(96,165,250,0.15);color:var(--accent)}
.guide-card .gd-name{font-size:1.3em;font-weight:bold}
.guide-card .gd-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.guide-card .gd-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.guide-card .gd-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.guide-card .gd-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.guide-card .gd-detail strong{color:var(--text)}
.guide-card .gd-section{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.guide-card .gd-section .sec-label{font-size:0.8em;color:var(--accent);margin-bottom:6px}
.guide-card .gd-section .sec-list{display:flex;flex-wrap:wrap;gap:6px}
.guide-card .gd-section .sec-tag{font-size:0.75em;padding:3px 10px;border-radius:10px;background:rgba(96,165,250,0.08);color:var(--accent);border:1px solid rgba(96,165,250,0.2)}
.guide-card.hidden{display:none}
.difficulty-bar{display:flex;gap:3px;margin-top:4px}
.diff-dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.diff-dot.filled{background:var(--accent)}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.guide-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🪕 中国民族乐器学习指南</h1>
<p>Chinese Instrument Learning Guide — 从入门到精通的民乐学习之路</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索乐器、类别或难度...（如"古筝""琵琶入门""初学者"）" title="Enter键搜索">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="弹拨乐器">弹拨乐器</button>
<button class="filter-btn" data-filter="拉弦乐器">拉弦乐器</button>
<button class="filter-btn" data-filter="吹管乐器">吹管乐器</button>
<button class="filter-btn" data-filter="打击乐器">打击乐器</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="guide-grid" id="guideGrid"></div>
</div>
<footer>中国民族乐器学习指南 — 传承民乐 · 以乐会友 · garyy.top</footer>
<script>
const guideData=[
{name:"古筝",category:"弹拨乐器",icon:"🎶",subtitle:"东方钢琴",difficulty:2,price:"2000-20000元",period:"3-6个月入门",description:"古筝是中国最普及的弹拨乐器，音色优美动听，表现力丰富。21弦古筝是现代标准形制，适合初学者入门。",learning:["基本指法（勾托抹托）","双手配合","摇指技法","琶音练习"],famous:["渔舟唱晚","高山流水","战台风","春江花月夜"]},
{name:"琵琶",category:"弹拨乐器",icon:"🎸",subtitle:"民乐之王",difficulty:4,price:"3000-30000元",period:"6-12个月入门",description:"琵琶被称为\"民乐之王\"，表现力极强，可独奏、合奏。四根弦，需用假指甲弹奏。技法繁多，入门难度较高。",learning:["弹挑技法","轮指技法","扫拂技法","武曲文曲"],famous:["十面埋伏","霸王卸甲","春江花月夜","彝族舞曲"]},
{name:"二胡",category:"拉弦乐器",icon:"🎻",subtitle:"东方小提琴",difficulty:3,price:"500-10000元",period:"3-6个月入门",description:"二胡是最具代表性的拉弦乐器，两根弦，弓在弦间拉奏。音色柔美抒情，表现力极强，适合演奏各种风格的乐曲。",learning:["持琴姿势","运弓技法","揉弦技法","换把练习"],famous:["二泉映月","赛马","空山鸟语","良宵"]},
{name:"笛子",category:"吹管乐器",icon:"🎵",subtitle:"竹笛悠扬",difficulty:2,price:"100-2000元",period:"1-3个月入门",description:"笛子是中国最古老的吹管乐器之一，竹制，有膜孔。音色清脆嘹亮，表现力丰富，是民乐入门的热门选择。",learning:["口风练习","长音练习","吐音技法","花舌技法"],famous:["姑苏行","牧民新歌","扬鞭催马运粮忙","鹧鸪飞"]},
{name:"葫芦丝",category:"吹管乐器",icon:"🫧",subtitle:"云南风情",difficulty:1,price:"50-500元",period:"1-2周入门",description:"葫芦丝是云南少数民族乐器，结构简单，音色独特优美。是最容易入门的民族乐器之一，适合零基础学习者。",learning:["气息控制","指法练习","颤音技法","滑音技法"],famous:["月光下的凤尾竹","竹林深处","傣乡情歌","婚誓"]},
{name:"扬琴",category:"弹拨乐器",icon:"🔔",subtitle:"击弦乐器",difficulty:3,price:"2000-15000元",period:"3-6个月入门",description:"扬琴是击弦乐器，用竹制琴竹敲击琴弦发声。音色清脆明亮，是民族管弦乐队的重要组成部分。",learning:["持竹姿势","单音技法","轮音技法","双竹技法"],famous:["旱天雷","倒垂帘","将军令","林冲夜奔"]},
{name:"唢呐",category:"吹管乐器",icon:"📣",subtitle:"乐器流氓",difficulty:3,price:"200-2000元",period:"3-6个月入门",description:"唢呐是中国最具特色的吹管乐器，音量大，穿透力极强。在民间婚丧嫁娶中不可或缺，被誉为\"乐器流氓\"。",learning:["口风控制","气息训练","循环换气","花舌技法"],famous:["百鸟朝凤","抬花轿","全家福","山坡羊"]},
{name:"竹笛（箫）",category:"吹管乐器",icon:"🌬️",subtitle:"洞箫清幽",difficulty:2,price:"100-1000元",period:"2-4个月入门",description:"箫是竖吹的竹制乐器，音色低沉悠远，适合独奏和伴奏。比笛子更安静内敛，适合喜欢古典音乐的学习者。",learning:["口风练习","长音练习","气息控制","叠音打音"],famous:["平湖秋月","梅花三弄","忆故人","关山月"]},
{name:"中阮",category:"弹拨乐器",icon:"🪕",subtitle:"民乐贝斯",difficulty:2,price:"1500-8000元",period:"3-6个月入门",description:"中阮是民族管弦乐队的中低音弹拨乐器，音色浑厚圆润。四根弦，是弹拨乐组的重要支撑。",learning:["弹挑技法","扫弦技法","轮指技法","和弦练习"],famous:["云南回忆","丝路驼铃","火把节之夜","彝族舞曲"]},
{name:"古琴",category:"弹拨乐器",icon:"☯️",subtitle:"文人雅器",difficulty:5,price:"5000-100000元",period:"1-2年入门",description:"古琴是中国最古老的弹拨乐器之一，七弦无品。音色深沉悠远，是古代文人必修的\"琴棋书画\"之首。被列为世界非物质文化遗产。",learning:["右手基本指法","左手吟猱绰注","琴曲研习","琴歌演唱"],famous:["流水","广陵散","梅花三弄","平沙落雁"]},
{name:"板胡",category:"拉弦乐器",icon:"🎻",subtitle:"北方梆子腔",difficulty:3,price:"300-5000元",period:"3-6个月入门",description:"板胡是北方梆子戏的主要伴奏乐器，音色高亢明亮。与二胡相比，板胡用薄木板代替蛇皮，音色更具穿透力。",learning:["持琴姿势","运弓技法","把位练习","滑音技法"],famous:["大姑娘美","花梆子","秦腔牌子曲","红军哥哥回来了"]},
{name:"排鼓",category:"打击乐器",icon:"🥁",subtitle:"民族排鼓",difficulty:2,price:"2000-10000元",period:"2-4个月入门",description:"排鼓是民族管弦乐队的打击乐器，由多个大小不同的鼓组成。音色丰富多变，节奏感强，是打击乐入门的好选择。",learning:["基本鼓点","节奏训练","双手配合","花式打法"],famous:["龙腾虎跃","牛斗虎","鼓诗","丰收锣鼓"]},
{name:"笙",category:"吹管乐器",icon:"🎼",subtitle:"和声乐器",difficulty:4,price:"2000-20000元",period:"6-12个月入门",description:"笙是中国古老的簧管乐器，可同时演奏多个音，是民乐中唯一的和声乐器。音色清越典雅，技巧难度较高。",learning:["气息控制","和音练习","打音技法","花舌技法"],famous:["凤凰展翅","孔雀开屏","牧场春色","挂红灯"]},
{name:"京胡",category:"拉弦乐器",icon:"🎻",subtitle:"京剧之魂",difficulty:4,price:"500-5000元",period:"6-12个月入门",description:"京胡是京剧的主要伴奏乐器，琴筒竹制，蛇皮蒙面。音色高亢明亮，穿透力极强，是京剧音乐的灵魂。",learning:["持琴姿势","运弓技法","把位练习","伴奏技巧"],famous:["京剧曲牌","二黄原板","西皮流水","反二黄"]},
{name:"扬琴（电扬琴）",category:"弹拨乐器",icon:"🎹",subtitle:"现代改良",difficulty:3,price:"5000-20000元",period:"3-6个月入门",description:"电扬琴是扬琴的现代改良版本，保留传统音色的同时增加了电声效果。适合现代音乐创作和跨界演出。",learning:["传统技法","电声控制","效果器使用","即兴演奏"],famous:["现代民乐作品","跨界音乐","电子民乐"]}
];
function getStats(data){const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});return cats}
function renderStats(data){const stats=getStats(data);document.getElementById('statsOverview').innerHTML=`<div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">乐器指南</div></div>`+Object.entries(stats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}
function renderCards(data){document.getElementById('guideGrid').innerHTML=data.map(m=>`<div class="guide-card" data-category="${m.category}"><div class="gd-header"><div class="gd-icon">${m.icon}</div><div><div class="gd-name">${m.name}</div><div class="gd-sub">${m.subtitle}</div></div></div><div class="gd-meta"><span>${m.category}</span><span>价格：${m.price}</span><span>周期：${m.period}</span></div><div class="gd-detail"><strong>简介：</strong>${m.description}<br><strong>难度：</strong></div><div class="difficulty-bar">${[1,2,3,4,5].map(i=>`<div class="diff-dot${i<=m.difficulty?' filled':''}"></div>`).join('')}</div><div class="gd-section"><div class="sec-label">📝 学习要点</div><div class="sec-list">${m.learning.map(l=>`<span class="sec-tag">${l}</span>`).join('')}</div></div><div class="gd-section"><div class="sec-label">🎵 代表曲目</div><div class="sec-list">${m.famous.map(f=>`<span class="sec-tag">${f}</span>`).join('')}</div></div></div>`).join('')}
function filterCards(){const q=document.getElementById('searchInput').value.toLowerCase();const f=document.querySelector('.filter-btn.active').dataset.filter;const filtered=guideData.filter(m=>{const matchF=f==='all'||m.category===f;const matchQ=!q||m.name.toLowerCase().includes(q)||m.description.toLowerCase().includes(q)||m.subtitle.toLowerCase().includes(q);return matchF&&matchQ});renderCards(filtered);renderStats(filtered)}
document.getElementById('searchInput').addEventListener('input',filterCards);
document.getElementById('filterRow').addEventListener('click',e=>{if(e.target.classList.contains('filter-btn')){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');filterCards()}});
renderCards(guideData);renderStats(guideData);
</script>
</body>
</html>
