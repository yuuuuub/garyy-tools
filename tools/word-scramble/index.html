<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文文字拼图</title>
<meta name="description" content="中文文字拼图游戏，打乱汉字让你重新排列">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--success:#22c55e;--error:#ef4444}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20pxscroll-behavior:smooth;}
h1{font-size:1.8rem;margin-bottom:10px;color:var(--accent)}
.info-bar{display:flex;gap:15px;margin-bottom:15px;flex-wrap:wrap;justify-content:center}
.info-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:0.9rem}
.info-item span{color:var(--accent);font-weight:bold}
.category-btns{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;justify-content:center}
.cat-btn{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:0.85rem;transition:all 0.2s}
.cat-btn.active,.cat-btn:hover{background:var(--accent);border-color:var(--accent)}
.hint-area{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:15px;width:100%;max-width:500px;text-align:center}
.hint-area .word{font-size:1.3rem;margin-bottom:5px;opacity:0.6}
.hint-area .pinyin{color:var(--accent);font-size:0.9rem}
.chars-area{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:15px;min-height:60px}
.char-slot{width:50px;height:50px;background:var(--card);border:2px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;transition:all 0.2s}
.char-slot.filled{border-color:var(--accent);background:#1a2744}
.char-slot.correct{border-color:var(--success);background:#1a2744}
.char-slot.wrong{border-color:var(--error);background:#2d1515;animation:shake 0.3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.char-pool{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
.char-btn{width:50px;height:50px;background:var(--card);border:2px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;transition:all 0.2s;color:var(--text)}
.char-btn:hover{border-color:var(--accent);transform:scale(1.05)}
.char-btn.used{opacity:0.3;pointer-events:none}
.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{background:var(--accent);color:var(--text);border:none;border-radius:8px;padding:10px 20px;font-size:1rem;cursor:pointer;font-family:inherit;transition:all 0.2s}
button:hover{opacity:0.85}
.result{font-size:1.1rem;padding:15px;text-align:center;color:var(--success)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="中文文字拼图">
  <meta property="og:description" content="中文文字拼图游戏，打乱汉字让你重新排列">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/word-scramble/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>📝 中文文字拼图</h1>
<div class="category-btns" id="cats"></div>
<div class="info-bar">
  <div class="info-item">⏱ <span id="timer">0</span>秒</div>
  <div class="info-item">🏆 得分: <span id="score">0</span></div>
  <div class="info-item">📊 <span id="round">1</span>/10</div>
</div>
<div class="hint-area">
  <div class="pinyin" id="pinyin">提示将显示在此</div>
  <div class="word" id="def"></div>
</div>
<div class="chars-area" id="answer"></div>
<div class="char-pool" id="pool"></div>
<div class="buttons">
  <button onclick="showHint()">💡 提示</button>
  <button onclick="clearAnswer()">🗑 清空</button>
  <button onclick="checkAnswer()">✅ 确认</button>
  <button onclick="nextWord()">⏭ 跳过</button>
</div>
<div class="result" id="result"></div>
<script>
const WORDS={
  '日常用词':[
    {word:'天气',pinyin:'tiān qì',def:'大气在一定时间内的状态'},
    {word:'学习',pinyin:'xué xí',def:'获取知识或技能'},
    {word:'朋友',pinyin:'péng yǒu',def:'彼此有交情的人'},
    {word:'快乐',pinyin:'kuài lè',def:'感到幸福或满意'},
    {word:'努力',pinyin:'nǔ lì',def:'尽力做事'},
    {word:'勇敢',pinyin:'yǒng gǎn',def:'有勇气不害怕'},
    {word:'安静',pinyin:'ān jìng',def:'没有声音'},
    {word:'温暖',pinyin:'wēn nuǎn',def:'气候温暖'},
    {word:'希望',pinyin:'xī wàng',def:'心里的愿望'},
    {word:'幸福',pinyin:'xìng fú',def:'生活境遇圆满如意'}
  ],
  '成语':[
    {word:'一心一意',pinyin:'yī xīn yī yì',def:'专心致志'},
    {word:'三心二意',pinyin:'sān xīn èr yì',def:'犹豫不决'},
    {word:'画龙点睛',pinyin:'huà lóng diǎn jīng',def:'关键处点明要旨'},
    {word:'守株待兔',pinyin:'shǒu zhū dài tù',def:'不劳而获'},
    {word:'亡羊补牢',pinyin:'wáng yáng bǔ láo',def:'事后补救'},
    {word:'掩耳盗铃',pinyin:'yǎn ěr dào líng',def:'自欺欺人'},
    {word:'井底之蛙',pinyin:'jǐng dǐ zhī wā',def:'见识短浅'},
    {word:'对牛弹琴',pinyin:'duì niú tán qín',def:'白费口舌'},
    {word:'狐假虎威',pinyin:'hú jiǎ hǔ wēi',def:'借势欺人'},
    {word:'画蛇添足',pinyin:'huà shé tiān zú',def:'多此一举'}
  ],
  '地名':[
    {word:'北京',pinyin:'běi jīng',def:'中国首都'},
    {word:'上海',pinyin:'shàng hǎi',def:'东方明珠'},
    {word:'广州',pinyin:'guǎng zhōu',def:'花城'},
    {word:'深圳',pinyin:'shēn zhèn',def:'科技之城'},
    {word:'成都',pinyin:'chéng dū',def:'天府之国'},
    {word:'西安',pinyin:'xī ān',def:'古都长安'},
    {word:'杭州',pinyin:'háng zhōu',def:'人间天堂'},
    {word:'苏州',pinyin:'sū zhōu',def:'园林之城'},
    {word:'重庆',pinyin:'chóng qìng',def:'山城雾都'},
    {word:'武汉',pinyin:'wǔ hàn',def:'九省通衢'}
  ]
};
let currentCat='日常用词',words=[],currentIdx=0,answer=[],score=0,timer=0,timerInterval=null,hintShown=false;

function initCats(){
  const el=document.getElementById('cats');
  Object.keys(WORDS).forEach(k=>{
    const btn=document.createElement('button');
    btn.className='cat-btn'+(k===currentCat?' active':'');
    btn.textContent=k;
    btn.onclick=()=>{currentCat=k;currentIdx=0;score=0;document.getElementById('score').textContent=0;startRound();initCats()};
    el.appendChild(btn);
  });
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function startRound(){
  words=shuffle([...WORDS[currentCat]]);
  currentIdx=0;answer=[];hintShown=false;
  renderWord();
}

function renderWord(){
  if(currentIdx>=words.length){currentIdx=0;words=shuffle([...WORDS[currentCat]])}
  const w=words[currentIdx];
  document.getElementById('pinyin').textContent=hintShown?w.pinyin:'点击"提示"查看拼音';
  document.getElementById('def').textContent=''+w.def;
  document.getElementById('result').textContent='';
  document.getElementById('round').textContent=currentIdx+1;
  answer=new Array(w.word.length).fill(null);
  renderAnswer();
  renderPool();
  clearInterval(timerInterval);timer=0;
  document.getElementById('timer').textContent=0;
  timerInterval=setInterval(()=>{timer++;document.getElementById('timer').textContent=timer},1000);
}

function renderAnswer(){
  const w=words[currentIdx];
  const el=document.getElementById('answer');
  el.innerHTML='';
  for(let i=0;i<w.word.length;i++){
    const slot=document.createElement('div');
    slot.className='char-slot'+(answer[i]?' filled':'');
    slot.textContent=answer[i]||'';
    slot.onclick=()=>{
      if(answer[i]){
        const idx=answer[i];
        answer[i]=null;
        document.querySelector(`.char-btn[data-char="${i}"]`)?.classList.remove('used');
        renderAnswer();renderPool();
      }
    };
    el.appendChild(slot);
  }
}

function renderPool(){
  const w=words[currentIdx];
  const el=document.getElementById('pool');
  el.innerHTML='';
  const chars=shuffle(w.word.split(''));
  chars.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='char-btn';
    btn.dataset.char=i;
    btn.textContent=c;
    if(answer.includes(c))btn.classList.add('used');
    btn.onclick=()=>{
      const emptyIdx=answer.indexOf(null);
      if(emptyIdx===-1)return;
      answer[emptyIdx]=c;
      btn.classList.add('used');
      renderAnswer();
    };
    el.appendChild(btn);
  });
}

function showHint(){hintShown=true;document.getElementById('pinyin').textContent=words[currentIdx].pinyin}

function clearAnswer(){
  answer=answer.map(()=>null);
  renderAnswer();renderPool();
}

function checkAnswer(){
  const w=words[currentIdx];
  const userAns=answer.join('');
  if(!answer.includes(null)){
    if(userAns===w.word){
      score+=100-timer*2;
      document.getElementById('score').textContent=Math.max(0,score);
      document.getElementById('result').textContent='✅ 正确！+'+Math.max(0,100-timer*2)+'分';
      document.getElementById('result').style.color='var(--success)';
    } else {
      document.getElementById('result').textContent='❌ 正确答案: '+w.word;
      document.getElementById('result').style.color='var(--error)';
    }
    setTimeout(()=>nextWord(),1200);
  }
}

function nextWord(){
  currentIdx++;answer=[];hintShown=false;
  renderWord();
}

initCats();startRound();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
