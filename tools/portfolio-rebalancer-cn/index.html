<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投资组合再平衡</title>
<meta name="description" content="投资组合再平衡计算，自动计算调仓方案使资产配比回到目标">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#f59e0b;--purple:#a855f7;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
.container{max-width:800px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.form-row{display:flex;gap:8px;margin-bottom:8px;align-items:end}
.form-row>div{flex:1}
label{font-size:.82rem;color:var(--text2);margin-bottom:3px;display:block}
input,select{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.88rem}
input:focus{outline:none;border-color:var(--blue)}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius);cursor:pointer;font-size:.88rem;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-sm{background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;font-size:.78rem}
.btn-sm:hover{border-color:var(--red);color:var(--red)}
.btn-add{background:var(--green);color:#fff}
.asset-row{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.asset-row:last-child{border-bottom:none}
.asset-name{min-width:80px;font-weight:600}
.asset-pct{color:var(--text2);min-width:50px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--border)}
th{color:var(--text2);font-weight:500;background:var(--bg)}
td:first-child,th:first-child{text-align:left}
.up{color:var(--green)}.down{color:var(--red)}
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}
.donut{position:relative;width:180px;height:180px}
.donut canvas{width:100%;height:100%}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.donut-center .total{font-size:1.1rem;font-weight:700}
.donut-center .label{font-size:.75rem;color:var(--text2)}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:.78rem}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="投资组合再平衡">
<meta property="og:description" content="投资组合再平衡计算工具">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>⚖️ 投资组合再平衡</h1>
    <p>自动计算调仓方案，使资产配比回到目标</p>
  </header>
  <div class="card">
    <div class="form-row">
      <div><label>总资产 (元)</label><input type="number" id="totalAsset" value="100000"></div>
      <div><label>买入佣金 (%)</label><input type="number" id="buyFee" value="0.1" step="0.01"></div>
      <div><label>卖出佣金 (%)</label><input type="number" id="sellFee" value="0.1" step="0.01"></div>
    </div>
    <div id="assetList"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-add" id="addAssetBtn">+ 添加资产</button>
      <button class="btn" id="calcBtn">计算再平衡</button>
    </div>
  </div>
  <div id="chartArea" class="card" style="display:none">
    <b>当前 vs 目标配比</b>
    <div class="donut-wrap">
      <div><div class="donut"><canvas id="donutCurrent"></canvas><div class="donut-center"><div class="total" id="totalCurrent">--</div><div class="label">当前</div></div></div></div>
      <div><div class="donut"><canvas id="donutTarget"></canvas><div class="donut-center"><div class="total" id="totalTarget">--</div><div class="label">目标</div></div></div></div>
    </div>
    <div class="legend" id="legendArea"></div>
  </div>
  <div id="result"></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const colors=['#3b82f6','#238636','#f59e0b','#ef4444','#a855f7','#06b6d4','#ec4899','#84cc16'];
let assets=[
  {name:'沪深300ETF',value:40000,target:35},
  {name:'中证500ETF',value:25000,target:20},
  {name:'纳斯达克ETF',value:15000,target:15},
  {name:'黄金ETF',value:12000,target:15},
  {name:'债券基金',value:8000,target:15}
];
function renderAssets(){
  let h='';
  assets.forEach((a,i)=>{
    h+=`<div class="form-row">
      <div><label>名称</label><input value="${a.name}" onchange="assets[${i}].name=this.value" style="font-size:.82rem"></div>
      <div><label>当前市值</label><input type="number" value="${a.value}" onchange="assets[${i}].value=+this.value"></div>
      <div><label>目标占比(%)</label><input type="number" value="${a.target}" onchange="assets[${i}].target=+this.value" step="0.1"></div>
      <div><label>&nbsp;</label><button class="btn btn-sm" onclick="assets.splice(${i},1);renderAssets()">删</button></div>
    </div>`;
  });
  $('assetList').innerHTML=h;
}
window.assets=assets;window.renderAssets=renderAssets;
$('addAssetBtn').onclick=()=>{assets.push({name:'新资产'+(assets.length+1),value:10000,target:10});renderAssets();};
function drawDonut(canvasId,pctArr,colorArr,totalVal){
  const canvas=$(canvasId);
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  canvas.width=180*dpr;canvas.height=180*dpr;
  ctx.scale(dpr,dpr);
  const cx=90,cy=90,r=70,inner=45;
  let start=-Math.PI/2;
  pctArr.forEach((p,i)=>{
    const angle=p/100*Math.PI*2;
    ctx.beginPath();ctx.arc(cx,cy,r,start,start+angle);ctx.arc(cx,cy,inner,start+angle,start,true);ctx.closePath();
    ctx.fillStyle=colorArr[i%colorArr.length];ctx.fill();
    start+=angle;
  });
}
function calc(){
  const total=+$('totalAsset').value;
  const buyFee=+$('buyFee').value/100;
  const sellFee=+$('sellFee').value/100;
  const totalTarget=assets.reduce((s,a)=>s+a.target,0);
  const result=assets.map((a,i)=>{
    const currentPct=a.value/total*100;
    const targetValue=total*a.target/100;
    const diff=targetValue-a.value;
    const afterBuyFee=diff>0?diff*(1+buyFee):diff;
    const afterSellFee=diff<0?diff*(1-sellFee):diff;
    return{...a,currentPct:currentPct.toFixed(2),targetPct:(a.target/totalTarget*100).toFixed(2),diff:diff.toFixed(2),adjustedDiff:diff>0?afterBuyFee.toFixed(2):afterSellFee.toFixed(2)};
  });
  // Draw donuts
  const currentPcts=result.map(r=>+r.currentPct);
  const targetPcts=result.map(r=>+r.targetPct);
  drawDonut('donutCurrent',currentPcts,colors);
  drawDonut('donutTarget',targetPcts,colors);
  $('totalCurrent').textContent='¥'+total.toLocaleString();
  $('totalTarget').textContent='¥'+total.toLocaleString();
  $('chartArea').style.display='block';
  // Legend
  let lg='';assets.forEach((a,i)=>{lg+=`<span class="legend-item"><span class="legend-dot" style="background:${colors[i%colors.length]}"></span>${a.name}</span>`;});
  $('legendArea').innerHTML=lg;
  // Result table
  let h='<div class="card"><b>再平衡方案</b><table><thead><tr><th>资产</th><th>当前市值</th><th>当前占比</th><th>目标占比</th><th>调仓金额</th><th>操作</th></tr></thead><tbody>';
  let totalAdj=0;
  result.forEach(r=>{
    const adj=+r.adjustedDiff;
    totalAdj+=adj;
    h+=`<tr><td>${r.name}</td><td>¥${(+r.value).toLocaleString()}</td><td>${r.currentPct}%</td><td>${r.targetPct}%</td><td class="${+r.diff>=0?'up':'down'}">¥${(+r.diff>=0?'+':'')+r.diff}</td><td>${+r.diff>=0?'<span class="up">买入</span>':'<span class="down">卖出</span>'}</td></tr>`;
  });
  h+='</tbody></table>';
  h+=`<div style="margin-top:8px;font-size:.85rem;color:var(--text2)">交易费用合计: ¥${Math.abs(totalAdj-total).toFixed(2)}</div>`;
  h+='</div><div class="hint">数据为模拟数据，仅供参考</div>';
  $('result').innerHTML=h;
}
$('calcBtn').onclick=calc;
renderAssets();calc();
})();
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
