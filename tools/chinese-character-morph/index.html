<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字变形动画</title><meta name="description" content="汉字变形动画 - 在线查看汉字变形动画"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.morph-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.morph-char{font-size:6rem;font-weight:700;color:var(--blue);display:inline-block;transition:all 1s}.morph-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.morph-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.morph-option:hover{border-color:var(--blue)}.morph-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}.morph-preview{display:flex;justify-content:center;gap:40px;margin:20px 0;font-size:3rem;font-weight:700;color:var(--blue)}.morph-arrow{font-size:2rem;color:var(--text2);align-self:center}

<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔄 汉字变形动画</h1><p class="sub">在线查看汉字变形动画</p>
<div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="input-group">
<label>起始汉字</label>
<input type="text" id="char1Input" placeholder="输入起始汉字" maxlength="1" value="大" oninput="showMorph()">
</div>
<div class="input-group">
<label>结束汉字</label>
<input type="text" id="char2Input" placeholder="输入结束汉字" maxlength="1" value="小" oninput="showMorph()">
</div>
</div>
<button class="btn" onclick="showMorph()">显示变形</button>
<button class="btn" onclick="randomMorph()">随机变形</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function showMorph(){
  var char1=document.getElementById('char1Input').value.trim();
  var char2=document.getElementById('char2Input').value.trim();
  var r=document.getElementById('result');
  if(!char1||!char2){r.innerHTML='';return;}
  if(char1.length!==1||char2.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入单个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="morph-container">';
  html+='<div class="morph-preview">';
  html+='<div class="morph-char">'+char1+'</div>';
  html+='<div class="morph-arrow">→</div>';
  html+='<div class="morph-char" id="morphTarget">'+char2+'</div>';
  html+='</div>';
  html+='<div style="margin-top:20px">';
  html+='<button class="btn" onclick="playMorph(\''+char1+'\',\''+char2+'\')">播放变形动画</button>';
  html+='</div></div>';
  html+='<div class="section"><h3>📋 变形说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>起始汉字：</strong>'+char1+'</div>';
  html+='<div><strong>结束汉字：</strong>'+char2+'</div>';
  html+='<div><strong>变形效果：</strong>从一个汉字平滑过渡到另一个汉字</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function playMorph(char1,char2){
  var target=document.getElementById('morphTarget');
  if(!target)return;
  target.style.opacity='0';
  target.style.transform='scale(0.5)';
  setTimeout(function(){
    target.textContent=char2;
    target.style.transition='all 1s ease-in-out';
    target.style.opacity='1';
    target.style.transform='scale(1)';
  },500);
}
function randomMorph(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar1=chars[Math.floor(Math.random()*chars.length)];
  var randomChar2=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('char1Input').value=randomChar1;
  document.getElementById('char2Input').value=randomChar2;
  showMorph();
}
showMorph();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
