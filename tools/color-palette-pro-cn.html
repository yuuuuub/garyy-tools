<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专业调色板工具 - 高级配色方案生成</title>
<meta name="description" content="专业调色板工具，支持HSL/RGB调节、色彩和谐、导出CSS/Tailwind/SCSS变量">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
<script src="i18n.js" defer></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--text2:#94a3b8;--accent:#a855f7;--accent2:#c084fc;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--radius:10px}
[data-theme="light"]{--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--accent:#9333ea;--accent2:#a855f7;--green:#16a34a;--red:#dc2626;--yellow:#ca8a04}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px}
.container{max-width:1100px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:1.2rem}
.topbar .spacer{flex:1}
.topbar button{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.topbar button:hover{border-color:var(--accent)}
.topbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:1rem}
.palette-display{display:flex;border-radius:12px;overflow:hidden;height:200px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.palette-color{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px 8px;cursor:pointer;transition:all .2s;position:relative}
.palette-color:hover{flex:1.5}
.palette-color .label{font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.palette-color .hex{font-size:11px;color:rgba(255,255,255,.8);margin-top:2px}
.palette-color .copy-hint{position:absolute;top:8px;right:8px;font-size:10px;background:rgba(0,0,0,.3);color:#fff;padding:2px 6px;border-radius:4px;opacity:0;transition:opacity .2s}
.palette-color:hover .copy-hint{opacity:1}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.controls{grid-template-columns:1fr}}
.control-group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.control-group input[type="range"]{width:100%;accent-color:var(--accent)}
.control-group input[type="color"]{width:100%;height:40px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--bg)}
.control-group .val{font-size:12px;color:var(--accent);font-weight:600;float:right}
.harmony-types{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.harmony-btn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);cursor:pointer;font-size:13px;transition:all .2s}
.harmony-btn:hover{border-color:var(--accent)}
.harmony-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.export-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.export-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px}
.export-block h4{margin:0 0 8px;font-size:.85rem}
.export-block pre{font-size:12px;overflow-x:auto;white-space:pre-wrap;padding:8px;background:var(--card);border-radius:6px;border:1px solid var(--border);max-height:200px;overflow-y:auto}
.export-block .copy-btn{margin-top:8px;padding:4px 10px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px}
.history-row{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.history-swatch{width:60px;height:40px;border-radius:6px;cursor:pointer;flex-shrink:0;border:2px solid transparent;transition:all .2s}
.history-swatch:hover{border-color:var(--accent);transform:scale(1.1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.container{animation:fadeIn .3s ease-out}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>🎭 专业调色板工具</h1>
    <div class="spacer"></div>
    <button onclick="generateRandom()">🎲 随机</button>
    <button onclick="generateFromImage()">📷 从图片提取</button>
    <button onclick="exportAll()">导出</button>
    <button onclick="toggleTheme()">🌙</button>
  </div>

  <div class="card">
    <h3>调色板</h3>
    <div class="harmony-types" id="harmonyTypes"></div>
    <div class="palette-display" id="paletteDisplay"></div>
    <div style="margin-top:12px">
      <h3 style="font-size:.85rem;margin:0 0 8px">历史记录</h3>
      <div class="history-row" id="historyRow"></div>
    </div>
  </div>

  <div class="card">
    <h3>色彩调节</h3>
    <div class="controls" id="controls"></div>
  </div>

  <div class="card">
    <h3>导出格式</h3>
    <div class="export-grid" id="exportGrid"></div>
  </div>
</div>
<script>
const harmonies=['类比','互补','三色组','分裂互补','四色组','单色'];
let currentHarmony='类比',palette=[],history=[],selIdx=0;

function hexToHSL(hex){
  let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),l=(max+min)/2;
  let h=0,s=0;
  if(max!==min){const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);
    if(max===r)h=((g-b)/d+(g<b?6:0))/6;else if(max===g)h=((b-r)/d+2)/6;else h=((r-g)/d+4)/6}
  return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};
}
function hslToHex(h,s,l){
  s/=100;l/=100;
  const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0')};
  return'#'+f(0)+f(8)+f(4);
}
function getContrast(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(r*299+g*587+b*114)/1000>128?'#000':'#fff'}

function generatePalette(baseHex){
  const hsl=hexToHSL(baseHex);let hues=[];
  if(currentHarmony==='类比')hues=[hsl.h-30,hsl.h-15,hsl.h,hsl.h+15,hsl.h+30];
  else if(currentHarmony==='互补')hues=[hsl.h,hsl.h,hsl.h+180,hsl.h+180,hsl.h+180];
  else if(currentHarmony==='三色组')hues=[hsl.h,hsl.h+120,hsl.h+240,hsl.h+60,hsl.h+180];
  else if(currentHarmony==='分裂互补')hues=[hsl.h,hsl.h+150,hsl.h+210,hsl.h+30,hsl.h+330];
  else if(currentHarmony==='四色组')hues=[hsl.h,hsl.h+90,hsl.h+180,hsl.h+270,hsl.h+45];
  else hues=[hsl.h,hsl.h,hsl.h,hsl.h,hsl.h];
  palette=hues.map((h,i)=>{const s=currentHarmony==='单色'?Math.max(10,hsl.s-20+i*5):hsl.s;const l=20+i*15;return hslToHex(((h%360)+360)%360,s,Math.min(l,95))});
  if(selIdx>=palette.length)selIdx=0;
  saveHistory();render();
}

function render(){
  document.getElementById('harmonyTypes').innerHTML=harmonies.map(h=>`<div class="harmony-btn ${h===currentHarmony?'active':''}" onclick="setHarmony('${h}')">${h}</div>`).join('');
  document.getElementById('paletteDisplay').innerHTML=palette.map((c,i)=>`<div class="palette-color" style="background:${c}" onclick="copyHex('${c}')"><div class="copy-hint">点击复制</div><div class="label" style="color:${getContrast(c)}">${c}</div><div class="hex" style="color:${getContrast(c)}">${hexToHSL(c).h}° ${hexToHSL(c).s}% ${hexToHSL(c).l}%</div></div>`).join('');
  const base=palette[selIdx]||'#3b82f6';const hsl=hexToHSL(base);
  document.getElementById('controls').innerHTML=`
    <div class="control-group"><label>色相 <span class="val" id="hVal">${hsl.h}°</span></label><input type="range" min="0" max="360" value="${hsl.h}" oninput="updateColor('h',+this.value)"></div>
    <div class="control-group"><label>饱和度 <span class="val" id="sVal">${hsl.s}%</span></label><input type="range" min="0" max="100" value="${hsl.s}" oninput="updateColor('s',+this.value)"></div>
    <div class="control-group"><label>亮度 <span class="val" id="lVal">${hsl.l}%</span></label><input type="range" min="0" max="100" value="${hsl.l}" oninput="updateColor('l',+this.value)"></div>
    <div class="control-group"><label>基础色</label><input type="color" value="${base}" onchange="generatePalette(this.value)"></div>
  `;
  document.getElementById('historyRow').innerHTML=history.slice(-20).map(c=>`<div class="history-swatch" style="background:${c}" onclick="copyHex('${c}')"></div>`).join('');

  const cssVars=palette.map((c,i)=>`  --palette-${i+1}: ${c};`).join('\n');
  const tailwind=palette.map((c,i)=>`    '${(i+1)*100}': '${c}',`).join('\n');
  const scss=palette.map((c,i)=>`$palette-${i+1}: ${c};`).join('\n');
  const arr=`const palette = ${JSON.stringify(palette)};`;
  document.getElementById('exportGrid').innerHTML=`
    <div class="export-block"><h4>CSS Variables</h4><pre>:root {\n${cssVars}\n}</pre><button class="copy-btn" onclick="copyText(this)">复制</button></div>
    <div class="export-block"><h4>Tailwind Config</h4><pre>colors: {\n  brand: {\n${tailwind}\n  }\n}</pre><button class="copy-btn" onclick="copyText(this)">复制</button></div>
    <div class="export-block"><h4>SCSS</h4><pre>${scss}</pre><button class="copy-btn" onclick="copyText(this)">复制</button></div>
    <div class="export-block"><h4>JavaScript</h4><pre>${arr}</pre><button class="copy-btn" onclick="copyText(this)">复制</button></div>
  `;
}

function setHarmony(h){currentHarmony=h;generatePalette(palette[selIdx]||'#3b82f6')}
function updateColor(ch,v){
  document.getElementById(ch+'Val').textContent=v+(ch==='h'?'°':'%');
  const hsl=hexToHSL(palette[selIdx]);
  hsl[ch]=v;palette[selIdx]=hslToHex(hsl.h,hsl.s,hsl.l);render();
}
function copyHex(hex){navigator.clipboard.writeText(hex);alert('已复制 '+hex)}
function copyText(btn){const pre=btn.previousElementSibling;navigator.clipboard.writeText(pre.textContent)}
function saveHistory(){palette.forEach(c=>{if(!history.includes(c))history.push(c)})}
function generateRandom(){generatePalette('#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'))}
function generateFromImage(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=e=>{const img=new Image();const r=new FileReader();
    r.onload=ev=>{img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);const d=ctx.getImageData(0,0,c.width,c.height).data;const colors={};
      for(let i=0;i<d.length;i+=16){const key=`${Math.round(d[i]/32)*32},${Math.round(d[i+1]/32)*32},${Math.round(d[i+2]/32)*32}`;colors[key]=(colors[key]||0)+1}
      const sorted=Object.entries(colors).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k])=>{const[r,g,b]=k.split(',').map(Number);return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')});
      if(sorted.length>=5)palette=sorted;render();saveHistory()};
    r.readAsDataURL(inp.files[0])};
    img.src=r.result};
  inp.click();
}
function exportAll(){const blob=new Blob([JSON.stringify({palette,harmony:currentHarmony},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='palette.json';a.click()}
function toggleTheme(){const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t}
generatePalette('#3b82f6');
</script>
</body>
</html>
