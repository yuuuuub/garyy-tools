<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>敏捷冲刺规划</title>
<meta property="og:title" content="敏捷冲刺规划">
<meta property="og:description" content="敏捷冲刺规划 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="Sprint规划工具，任务估算、分配、追踪，敏捷团队必备">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:1100px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:4px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.9rem;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.board{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
.column{min-width:240px;flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.col-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.col-title{font-weight:700;font-size:.95rem}
.col-count{font-size:.8rem;color:var(--text2);background:var(--bg);padding:2px 8px;border-radius:10px}
.task-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;transition:all .2s}
.task-card:hover{border-color:var(--accent)}
.task-title{font-weight:600;font-size:.9rem;margin-bottom:4px}
.task-meta{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--text2);margin-top:6px}
.task-points{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:.8rem;font-weight:700}
.task-assignee{display:inline-flex;align-items:center;gap:4px}
.task-delete{cursor:pointer;color:var(--text2);transition:color .2s}
.task-delete:hover{color:var(--red)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:600}
.badge-todo{background:rgba(139,148,158,.2);color:var(--text2)}
.badge-progress{background:rgba(59,130,246,.2);color:var(--accent)}
.badge-review{background:rgba(210,153,34,.2);color:var(--yellow)}
.badge-done{background:rgba(63,185,80,.2);color:var(--green)}
.progress-bar{height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;border-radius:5px;transition:width .3s}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.stat{text-align:center;padding:10px}
.stat-num{font-size:1.6rem;font-weight:700}
.stat-label{font-size:.75rem;color:var(--text2)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.hidden{display:none!important}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.85rem}
.sprint-config{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.task-card{animation:fadeIn .3s ease-out}
@media(max-width:600px){body{padding:10px}h1{font-size:1.4rem}.board{flex-direction:column}.stats-grid{grid-template-columns:repeat(2,1fr)}.sprint-config{grid-template-columns:1fr}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🏃 敏捷冲刺</h1>
<p class="subtitle">Sprint 规划与任务追踪</p>

<div class="stats-grid" id="statsGrid"></div>

<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;background:var(--accent)"></div></div>
<div style="text-align:center;font-size:.85rem;color:var(--text2);margin-bottom:16px" id="progressText">0% 完成</div>

<div class="card">
  <div class="flex-between">
    <b>Sprint 配置</b>
    <div class="flex">
      <button class="btn btn-sm" onclick="showModal()">+ 添加任务</button>
      <button class="btn btn-sm btn-danger" onclick="resetAll()">重置</button>
    </div>
  </div>
  <div class="sprint-config" style="margin-top:12px">
    <div><label>Sprint 名称</label><input type="text" id="sprintName" placeholder="例：Sprint 12" oninput="saveData()" style="margin:0"></div>
    <div><label>开始日期</label><input type="date" id="sprintStart" onchange="saveData()" style="margin:0"></div>
    <div><label>结束日期</label><input type="date" id="sprintEnd" onchange="saveData()" style="margin:0"></div>
  </div>
</div>

<div class="board" id="board"></div>
</div>

<div class="modal-overlay hidden" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 style="margin-bottom:16px" id="modalTitle">添加任务</h3>
    <label>任务名称</label><input type="text" id="taskName" placeholder="例：实现用户登录">
    <label>描述</label><textarea id="taskDesc" rows="2" placeholder="详细说明..."></textarea>
    <label>故事点 (1/2/3/5/8/13)</label>
    <select id="taskPoints"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="5">5</option><option value="8">8</option><option value="13">13</option></select>
    <label>负责人</label><input type="text" id="taskAssignee" placeholder="例：张三">
    <label>优先级</label>
    <select id="taskPriority"><option value="高">高</option><option value="中" selected>中</option><option value="低">低</option></select>
    <div class="flex" style="margin-top:16px;justify-content:flex-end">
      <button class="btn btn-danger btn-sm" onclick="closeModal()">取消</button>
      <button class="btn" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<script>
document.title='🏃 敏捷冲刺规划';
const COLUMNS=[{id:'todo',title:'📋 待办',badge:'badge-todo'},{id:'progress',title:'🔨 进行中',badge:'badge-progress'},{id:'review',title:'👀 评审中',badge:'badge-review'},{id:'done',title:'✅ 已完成',badge:'badge-done'}];
const PRIORITY_COLORS={'高':'var(--red)','中':'var(--yellow)','低':'var(--green)'};

let sprint=JSON.parse(localStorage.getItem('sprint_planner_cn')||'null')||{
  name:'Sprint 12',start:'2025-01-06',end:'2025-01-19',
  tasks:[
    {id:1,name:'实现用户注册',desc:'',points:5,assignee:'张三',priority:'高',status:'done'},
    {id:2,name:'优化首页性能',desc:'首屏加载时间优化到2秒以内',points:8,assignee:'李四',priority:'高',status:'progress'},
    {id:3,name:'编写单元测试',desc:'核心模块测试覆盖率达到80%',points:3,assignee:'王五',priority:'中',status:'progress'},
    {id:4,name:'修复登录Bug',desc:'偶现的登录超时问题',points:2,assignee:'赵六',priority:'高',status:'review'},
    {id:5,name:'更新API文档',desc:'',points:1,assignee:'张三',priority:'低',status:'todo'},
    {id:6,name:'数据库索引优化',desc:'',points:5,assignee:'李四',priority:'中',status:'todo'}
  ]
};
let editingTaskId=null;

function save(){localStorage.setItem('sprint_planner_cn',JSON.stringify(sprint))}
function saveData(){sprint.name=document.getElementById('sprintName').value;sprint.start=document.getElementById('sprintStart').value;sprint.end=document.getElementById('sprintEnd').value;save()}

function showModal(id){
  editingTaskId=id||null;
  document.getElementById('modalTitle').textContent=id?'编辑任务':'添加任务';
  if(id){const t=sprint.tasks.find(x=>x.id===id);document.getElementById('taskName').value=t.name;document.getElementById('taskDesc').value=t.desc||'';document.getElementById('taskPoints').value=t.points;document.getElementById('taskAssignee').value=t.assignee||'';document.getElementById('taskPriority').value=t.priority}
  else{document.getElementById('taskName').value='';document.getElementById('taskDesc').value='';document.getElementById('taskPoints').value=3;document.getElementById('taskAssignee').value='';document.getElementById('taskPriority').value='中'}
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal').classList.add('hidden')}

function saveTask(){
  const name=document.getElementById('taskName').value.trim();if(!name)return;
  const desc=document.getElementById('taskDesc').value.trim();
  const points=+document.getElementById('taskPoints').value;
  const assignee=document.getElementById('taskAssignee').value.trim();
  const priority=document.getElementById('taskPriority').value;
  if(editingTaskId){const t=sprint.tasks.find(x=>x.id===editingTaskId);if(t){t.name=name;t.desc=desc;t.points=points;t.assignee=assignee;t.priority=priority}}
  else sprint.tasks.push({id:Date.now(),name,desc,points,assignee,priority,status:'todo'});
  save();render();closeModal();
}
function deleteTask(id){sprint.tasks=sprint.tasks.filter(t=>t.id!==id);save();render()}
function moveTask(id,status){const t=sprint.tasks.find(x=>x.id===id);if(t){t.status=status;save();render()}}
function resetAll(){if(!confirm('确定重置？'))return;sprint={name:'',start:'',end:'',tasks:[]};save();render()}

function render(){
  document.getElementById('sprintName').value=sprint.name||'';
  document.getElementById('sprintStart').value=sprint.start||'';
  document.getElementById('sprintEnd').value=sprint.end||'';
  
  const totalPoints=sprint.tasks.reduce((s,t)=>s+t.points,0);
  const donePoints=sprint.tasks.filter(t=>t.status==='done').reduce((s,t)=>s+t.points,0);
  const totalTasks=sprint.tasks.length;
  const doneTasks=sprint.tasks.filter(t=>t.status==='done').length;
  const inProgress=sprint.tasks.filter(t=>t.status==='progress').length;
  const progressPct=totalPoints?Math.round(donePoints/totalPoints*100):0;
  
  document.getElementById('statsGrid').innerHTML=`
    <div class="card stat"><div class="stat-num" style="color:var(--text)">${totalTasks}</div><div class="stat-label">总任务</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--accent)">${totalPoints}</div><div class="stat-label">总故事点</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--green)">${doneTasks}</div><div class="stat-label">已完成</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--yellow)">${inProgress}</div><div class="stat-label">进行中</div></div>
    <div class="card stat"><div class="stat-num" style="color:var(--accent)">${donePoints}/${totalPoints}</div><div class="stat-label">完成点数</div></div>`;
  
  document.getElementById('progressFill').style.width=progressPct+'%';
  document.getElementById('progressFill').style.background=progressPct===100?'var(--green)':'var(--accent)';
  document.getElementById('progressText').textContent=`${progressPct}% 完成（${donePoints}/${totalPoints} 故事点）`;
  
  let html='';
  COLUMNS.forEach(col=>{
    const tasks=sprint.tasks.filter(t=>t.status===col.id);
    const colPoints=tasks.reduce((s,t)=>s+t.points,0);
    html+=`<div class="column" ondragover="event.preventDefault()" ondrop="dropTask(event,'${col.id}')">
      <div class="col-header">
        <span class="col-title">${col.title} <span class="col-count">${tasks.length} · ${colPoints}pt</span></span>
      </div>`;
    if(tasks.length===0)html+='<div class="empty">拖拽任务到此列</div>';
    tasks.forEach(t=>{
      html+=`<div class="task-card" draggable="true" ondragstart="event.dataTransfer.setData('text',${t.id})">
        <div style="display:flex;justify-content:space-between;align-items:start">
          <div class="task-title">${t.name}</div>
          <div style="display:flex;gap:4px">
            <span class="task-points">${t.points}</span>
          </div>
        </div>
        ${t.desc?`<div style="font-size:.8rem;color:var(--text2);margin:4px 0">${t.desc}</div>`:''}
        <div class="task-meta">
          <div class="task-assignee"><span style="color:${PRIORITY_COLORS[t.priority]}">●</span>${t.assignee||'未分配'}</div>
          <div class="flex" style="gap:4px">
            <select onchange="moveTask(${t.id},this.value);this.parentElement.parentElement.parentElement.querySelector('select').value=this.value" style="padding:2px 4px;font-size:.7rem;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px;width:auto">${COLUMNS.map(c=>`<option value="${c.id}" ${c.id===t.status?'selected':''}>${c.title}</option>`).join('')}</select>
            <span class="task-delete" onclick="deleteTask(${t.id})">✕</span>
          </div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('board').innerHTML=html;
}

function dropTask(e,status){
  e.preventDefault();
  const taskId=+e.dataTransfer.getData('text');
  moveTask(taskId,status);
}

render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
