<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字图表</title><meta name="description" content="汉字图表 - 在线查看汉字图表"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.chart-container{margin:16px 0}.bar-chart{display:flex;align-items:flex-end;gap:8px;height:200px;padding:20px;background:var(--bg);border-radius:8px}.bar{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:4px;transition:height .3s;cursor:pointer;position:relative}.bar:hover{opacity:.8}.bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--text2);white-space:nowrap}.bar-value{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--blue);white-space:nowrap}.pie-chart{width:200px;height:200px;border-radius:50%;margin:0 auto}.pie-legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}.pie-legend-item{display:flex;align-items:center;gap:4px;font-size:.8rem}.pie-legend-color{width:12px;height:12px;border-radius:2px}</style><meta property="og:title" content="汉字图表"><meta property="og:description" content="汉字图表 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📊 汉字图表</h1><p class="sub">在线查看汉字图表</p>
<div class="card">
<div class="btn-group">
<button class="btn" onclick="showStrokeChart()">笔画分布</button>
<button class="btn" onclick="showRadicalChart()">部首分布</button>
<button class="btn" onclick="showFrequencyChart()">频率统计</button>
</div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var characters=[
  {char:'一',pinyin:'yī',strokes:1,radical:'一'},
  {char:'二',pinyin:'èr',strokes:2,radical:'二'},
  {char:'三',pinyin:'sān',strokes:3,radical:'一'},
  {char:'四',pinyin:'sì',strokes:5,radical:'囗'},
  {char:'五',pinyin:'wǔ',strokes:4,radical:'一'},
  {char:'六',pinyin:'liù',strokes:4,radical:'八'},
  {char:'七',pinyin:'qī',strokes:2,radical:'一'},
  {char:'八',pinyin:'bā',strokes:2,radical:'八'},
  {char:'九',pinyin:'jiǔ',strokes:2,radical:'丿'},
  {char:'十',pinyin:'shí',strokes:2,radical:'十'},
  {char:'大',pinyin:'dà',strokes:3,radical:'大'},
  {char:'小',pinyin:'xiǎo',strokes:3,radical:'小'},
  {char:'多',pinyin:'duō',strokes:6,radical:'夕'},
  {char:'少',pinyin:'shǎo',strokes:4,radical:'小'},
  {char:'上',pinyin:'shàng',strokes:3,radical:'一'},
  {char:'下',pinyin:'xià',strokes:3,radical:'一'},
  {char:'左',pinyin:'zuǒ',strokes:5,radical:'工'},
  {char:'右',pinyin:'yòu',strokes:5,radical:'口'},
  {char:'前',pinyin:'qián',strokes:9,radical:'刂'},
  {char:'后',pinyin:'hòu',strokes:6,radical:'口'},
  {char:'东',pinyin:'dōng',strokes:5,radical:'一'},
  {char:'西',pinyin:'xī',strokes:6,radical:'西'},
  {char:'南',pinyin:'nán',strokes:9,radical:'十'},
  {char:'北',pinyin:'běi',strokes:5,radical:'匕'},
  {char:'天',pinyin:'tiān',strokes:4,radical:'大'},
  {char:'地',pinyin:'dì',strokes:6,radical:'土'},
  {char:'人',pinyin:'rén',strokes:2,radical:'人'},
  {char:'口',pinyin:'kǒu',strokes:3,radical:'口'},
  {char:'日',pinyin:'rì',strokes:4,radical:'日'},
  {char:'月',pinyin:'yuè',strokes:4,radical:'月'},
  {char:'水',pinyin:'shuǐ',strokes:4,radical:'水'},
  {char:'火',pinyin:'huǒ',strokes:4,radical:'火'},
  {char:'木',pinyin:'mù',strokes:4,radical:'木'},
  {char:'金',pinyin:'jīn',strokes:8,radical:'金'},
  {char:'土',pinyin:'tǔ',strokes:3,radical:'土'}
];
function showStrokeChart(){
  var strokeCount={};
  characters.forEach(function(char){
    var key=char.strokes+'画';
    strokeCount[key]=(strokeCount[key]||0)+1;
  });
  var labels=Object.keys(strokeCount).sort();
  var values=labels.map(function(l){return strokeCount[l];});
  var maxValue=Math.max.apply(null,values);
  var html='<div class="card">';
  html+='<div class="section"><h3>📊 笔画分布</h3></div>';
  html+='<div class="chart-container">';
  html+='<div class="bar-chart">';
  labels.forEach(function(label,index){
    var height=values[index]/maxValue*180;
    html+='<div class="bar" style="height:'+height+'px;background:var(--blue)">';
    html+='<div class="bar-value">'+values[index]+'</div>';
    html+='<div class="bar-label">'+label+'</div>';
    html+='</div>';
  });
  html+='</div></div></div>';
  document.getElementById('result').innerHTML=html;
}
function showRadicalChart(){
  var radicalCount={};
  characters.forEach(function(char){
    radicalCount[char.radical]=(radicalCount[char.radical]||0)+1;
  });
  var labels=Object.keys(radicalCount);
  var values=labels.map(function(l){return radicalCount[l];});
  var total=values.reduce(function(a,b){return a+b;},0);
  var colors=['#3b82f6','#238636','#ef4444','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316','#6366f1'];
  var html='<div class="card">';
  html+='<div class="section"><h3>📊 部首分布</h3></div>';
  html+='<div class="chart-container">';
  html+='<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center">';
  html+='<div class="pie-chart" style="background:conic-gradient(';
  var currentAngle=0;
  labels.forEach(function(label,index){
    var angle=values[index]/total*360;
    html+=colors[index%colors.length]+' '+currentAngle+'deg '+(currentAngle+angle)+'deg';
    currentAngle+=angle;
    if(index<labels.length-1)html+=', ';
  });
  html+=')"></div>';
  html+='<div class="pie-legend">';
  labels.forEach(function(label,index){
    html+='<div class="pie-legend-item">';
    html+='<div class="pie-legend-color" style="background:'+colors[index%colors.length]+'"></div>';
    html+='<span>'+label+' ('+values[index]+')</span>';
    html+='</div>';
  });
  html+='</div></div></div></div>';
  document.getElementById('result').innerHTML=html;
}
function showFrequencyChart(){
  var charFreq={};
  characters.forEach(function(char){
    charFreq[char.char]=(charFreq[char.char]||0)+1;
  });
  var sorted=Object.entries(charFreq).sort(function(a,b){return b[1]-a[1];}).slice(0,10);
  var labels=sorted.map(function(s){return s[0];});
  var values=sorted.map(function(s){return s[1];});
  var maxValue=Math.max.apply(null,values);
  var html='<div class="card">';
  html+='<div class="section"><h3>📊 频率统计 (Top 10)</h3></div>';
  html+='<div class="chart-container">';
  html+='<div class="bar-chart">';
  labels.forEach(function(label,index){
    var height=values[index]/maxValue*180;
    html+='<div class="bar" style="height:'+height+'px;background:var(--green)">';
    html+='<div class="bar-value">'+values[index]+'</div>';
    html+='<div class="bar-label">'+label+'</div>';
    html+='</div>';
  });
  html+='</div></div></div>';
  document.getElementById('result').innerHTML=html;
}
showStrokeChart();
</script></body></html>
