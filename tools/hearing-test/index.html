<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>听力测试</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#60a5fa;--success:#4ade80;--warning:#fbbf24;--danger:#f87171;--muted:#8b949e;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.container{width:100%;max-width:600px}
h1{font-size:1.5rem;text-align:center;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.freq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.freq-card{border:2px solid var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:.3s}
.freq-card:hover{border-color:var(--accent)}
.freq-card.active{border-color:var(--accent);background:rgba(59,130,246,.1);box-shadow:0 0 20px rgba(59,130,246,.2)}
.freq-card.done{border-color:var(--success)}
.freq-card.failed{border-color:var(--danger)}
.freq-val{font-size:1.3rem;font-weight:700}
.freq-label{font-size:.75rem;color:var(--muted);margin-top:4px}
.freq-status{font-size:.7rem;margin-top:6px}
.visualizer{height:80px;background:#000;border-radius:8px;margin:16px 0;overflow:hidden;position:relative}
.visualizer canvas{width:100%;height:100%}
.slider-wrap{margin:16px 0}
.slider-wrap label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:8px}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--border);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer}
.btn{padding:10px 24px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#000}
.btn-group{display:flex;gap:10px;justify-content:center}
.chart-area{height:200px;position:relative;margin:16px 0}
.chart-area canvas{width:100%;height:100%}
.result-bar{display:flex;align-items:center;gap:10px;margin:8px 0}
.result-bar .label{width:80px;font-size:.8rem;text-align:right}
.result-bar .bar-track{flex:1;height:20px;background:var(--border);border-radius:4px;overflow:hidden}
.result-bar .bar-fill{height:100%;border-radius:4px;transition:width .5s}
.result-bar .value{width:40px;font-size:.8rem;text-align:left}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h1>🎧 听力测试</h1>

<div class="card" id="startCard">
<p style="color:var(--muted);text-align:center;line-height:1.8;margin-bottom:16px">
  请使用耳机在安静环境下进行测试<br>
  测试将播放不同频率的声音，请在听到声音时点击"听到了"
</p>
<div style="text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:16px">
⚠️ 请控制音量，保护听力
</div>
<button class="btn btn-primary" style="width:100%" onclick="startTest()">开始测试</button>
</div>

<div class="card hidden" id="testCard">
<div class="freq-grid" id="freqGrid"></div>
<div class="visualizer"><canvas id="visCanvas"></canvas></div>
<div class="slider-wrap">
<label><span>音量调节</span><span id="volText">70%</span></label>
<input type="range" min="0" max="100" value="70" id="volSlider" oninput="updateVol(this.value)">
</div>
<div class="btn-group">
<button class="btn btn-success" onclick="heard()">听到了</button>
<button class="btn btn-danger" onclick="notHeard()">没听到</button>
<button class="btn btn-primary" onclick="playTone()">重新播放</button>
</div>
</div>

<div class="card hidden" id="resultCard">
<h3 style="text-align:center;margin-bottom:16px">测试结果</h3>
<div id="resultBars"></div>
<div class="chart-area"><canvas id="chartCanvas"></canvas></div>
<div id="resultSummary" style="text-align:center;color:var(--muted);margin-top:16px;line-height:1.8"></div>
<button class="btn btn-primary" style="width:100%;margin-top:16px" onclick="resetTest()">重新测试</button>
</div>
</div>

<script>
const frequencies = [125, 250, 500, 1000, 2000, 4000, 8000];
const freqLabels = ['125Hz', '250Hz', '500Hz', '1kHz', '2kHz', '4kHz', '8kHz'];
let audioCtx = null, oscillator = null, gainNode = null, analyser = null;
let currentFreq = 0, volume = 70;
let results = {};
let animFrame = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    gainNode = audioCtx.createGain();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    gainNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
}

function startTest() {
  initAudio();
  results = {};
  currentFreq = 0;
  document.getElementById('startCard').classList.add('hidden');
  document.getElementById('testCard').classList.remove('hidden');
  document.getElementById('resultCard').classList.add('hidden');
  buildFreqGrid();
  selectFreq(0);
  startVisualizer();
}

function buildFreqGrid() {
  const grid = document.getElementById('freqGrid');
  grid.innerHTML = '';
  freqLabels.forEach((label, i) => {
    const card = document.createElement('div');
    card.className = 'freq-card' + (i === 0 ? ' active' : '');
    card.id = 'fc' + i;
    card.innerHTML = `<div class="freq-val">${label}</div><div class="freq-status" id="fs${i}">待测试</div>`;
    card.onclick = () => selectFreq(i);
    grid.appendChild(card);
  });
}

function selectFreq(i) {
  if (i >= frequencies.length) { showResult(); return; }
  currentFreq = i;
  document.querySelectorAll('.freq-card').forEach((c, idx) => {
    c.classList.toggle('active', idx === i);
  });
  playTone();
}

function playTone() {
  stopTone();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  oscillator = audioCtx.createOscillator();
  oscillator.type = 'sine';
  oscillator.frequency.value = frequencies[currentFreq];
  gainNode.gain.value = volume / 100 * 0.5;
  oscillator.connect(gainNode);
  oscillator.start();
  setTimeout(stopTone, 2000);
}

function stopTone() {
  if (oscillator) {
    try { oscillator.stop(); } catch(e) {}
    oscillator = null;
  }
}

function updateVol(v) {
  volume = parseInt(v);
  document.getElementById('volText').textContent = v + '%';
  if (gainNode) gainNode.gain.value = volume / 100 * 0.5;
}

function heard() {
  stopTone();
  results[frequencies[currentFreq]] = volume;
  const fc = document.getElementById('fc' + currentFreq);
  fc.classList.remove('active');
  fc.classList.add('done');
  document.getElementById('fs' + currentFreq).textContent = volume + '% ✅';
  document.getElementById('fs' + currentFreq).style.color = 'var(--success)';
  currentFreq++;
  if (currentFreq >= frequencies.length) {
    setTimeout(showResult, 500);
  } else {
    selectFreq(currentFreq);
  }
}

function notHeard() {
  stopTone();
  const fc = document.getElementById('fc' + currentFreq);
  fc.classList.remove('active');
  fc.classList.add('failed');
  document.getElementById('fs' + currentFreq).textContent = '未检测到';
  document.getElementById('fs' + currentFreq).style.color = 'var(--danger)';
  results[frequencies[currentFreq]] = -1;
  currentFreq++;
  if (currentFreq >= frequencies.length) {
    setTimeout(showResult, 500);
  } else {
    selectFreq(currentFreq);
  }
}

function startVisualizer() {
  const canvas = document.getElementById('visCanvas');
  const ctx = canvas.getContext('2d');
  function draw() {
    animFrame = requestAnimationFrame(draw);
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!analyser) return;
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    const barW = canvas.width / data.length * 2.5;
    for (let i = 0; i < data.length; i++) {
      const h = data[i] / 255 * canvas.height;
      const hue = (i / data.length) * 60 + 200;
      ctx.fillStyle = `hsl(${hue},80%,50%)`;
      ctx.fillRect(i * barW, canvas.height - h, barW - 1, h);
    }
  }
  draw();
}

function showResult() {
  stopTone();
  if (animFrame) cancelAnimationFrame(animFrame);
  document.getElementById('testCard').classList.add('hidden');
  document.getElementById('resultCard').classList.remove('hidden');

  const barsDiv = document.getElementById('resultBars');
  barsDiv.innerHTML = '';
  frequencies.forEach((freq, i) => {
    const vol = results[freq];
    const pct = vol === -1 ? 0 : vol;
    const color = vol === -1 ? 'var(--danger)' : vol <= 30 ? 'var(--success)' : vol <= 60 ? 'var(--warning)' : 'var(--danger)';
    barsDiv.innerHTML += `<div class="result-bar"><div class="label">${freqLabels[i]}</div><div class="bar-track"><div class="bar-fill" style="width:${vol === -1 ? 100 : pct}%;background:${color}"></div></div><div class="value">${vol === -1 ? 'N/A' : vol + '%'}</div></div>`;
  });

  drawChart();
  analyzeResult();
}

function drawChart() {
  const canvas = document.getElementById('chartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  const pad = { top: 20, right: 20, bottom: 30, left: 40 };
  const pw = w - pad.left - pad.right;
  const ph = h - pad.top - pad.bottom;

  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 5; i++) {
    const y = pad.top + (ph / 5) * i;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
    ctx.fillStyle = '#8b949e'; ctx.font = '10px sans-serif';
    ctx.fillText((100 - i * 20) + '%', 5, y + 3);
  }

  ctx.beginPath();
  ctx.strokeStyle = 'var(--accent)';
  ctx.lineWidth = 2;
  let started = false;
  frequencies.forEach((freq, i) => {
    const vol = results[freq];
    const x = pad.left + (pw / (frequencies.length - 1)) * i;
    const y = pad.top + ph - (vol === -1 ? 0 : vol / 100 * ph);
    if (!started) { ctx.moveTo(x, y); started = true; }
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  frequencies.forEach((freq, i) => {
    const x = pad.left + (pw / (frequencies.length - 1)) * i;
    ctx.fillStyle = '#e6edf3'; ctx.font = '10px sans-serif';
    ctx.fillText(freqLabels[i], x - 12, h - 5);
  });
}

function analyzeResult() {
  const detected = frequencies.filter(f => results[f] !== -1);
  const avgVol = detected.length > 0 ? detected.reduce((s, f) => s + results[f], 0) / detected.length : 0;
  let level, desc;
  if (detected.length === frequencies.length && avgVol <= 40) {
    level = '听力优秀'; desc = '您在所有频率下都能在较低音量听到声音，听力状况非常好。';
  } else if (detected.length >= 5) {
    level = '听力正常'; desc = '您的听力基本正常，建议继续保持良好的用耳习惯。';
  } else if (detected.length >= 3) {
    level = '听力偏弱'; desc = '部分频率的听力可能偏弱，建议减少耳机使用时间。';
  } else {
    level = '建议检查'; desc = '多个频率未检测到，建议前往医院进行专业听力检查。';
  }
  document.getElementById('resultSummary').innerHTML = `<strong>听力评级：${level}</strong><br>${desc}<br><br>检测到 ${detected.length}/${frequencies.length} 个频率，平均感知音量 ${avgVol.toFixed(0)}%`;
}

function resetTest() {
  stopTone();
  if (animFrame) cancelAnimationFrame(animFrame);
  document.getElementById('startCard').classList.remove('hidden');
  document.getElementById('testCard').classList.add('hidden');
  document.getElementById('resultCard').classList.add('hidden');
}
</script>
</body>
</html>
