<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字动画</title><meta name="description" content="汉字动画 - 在线查看汉字动画"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.animation-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0;position:relative;overflow:hidden}.animation-char{font-size:6rem;font-weight:700;color:var(--blue);display:inline-block}.animation-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.animation-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.animation-option:hover{border-color:var(--blue)}.animation-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}</style><meta property="og:title" content="汉字动画"><meta property="og:description" content="汉字动画 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div class="container"><h1>🎬 汉字动画</h1><p class="sub">在线查看汉字动画</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="animateCharacter()">
</div>
<button class="btn" onclick="animateCharacter()">播放动画</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var animations=['bounce','spin','pulse','shake','float','rubberBand','swing','tada','wobble','jello','heartBeat','flip','rollIn','rollOut','zoomIn','zoomOut','fadeIn','fadeOut','slideInUp','slideInDown','slideInLeft','slideInRight','rotateIn','rotateOut','flipInX','flipOutX','flipInY','flipOutY','lightSpeedIn','lightSpeedOut'];
var currentAnimation='bounce';
function animateCharacter(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="animation-options">';
  animations.forEach(function(anim){
    html+='<div class="animation-option '+(anim===currentAnimation?'active':'')+'" onclick="setAnimation(\''+anim+'\')">'+getAnimationName(anim)+'</div>';
  });
  html+='</div>';
  html+='<div class="animation-container">';
  html+='<div class="animation-char" style="animation:'+getAnimationCSS(currentAnimation)+'">'+char+'</div>';
  html+='</div>';
  html+='<div class="btn-group" style="justify-content:center">';
  html+='<button class="btn" onclick="playAllAnimations()">播放所有动画</button>';
  html+='</div></div>';
  r.innerHTML=html;
}
function setAnimation(anim){
  currentAnimation=anim;
  animateCharacter();
}
function getAnimationName(anim){
  switch(anim){
    case 'bounce':return'弹跳';
    case 'spin':return'旋转';
    case 'pulse':return'脉冲';
    case 'shake':return'摇晃';
    case 'float':return'浮动';
    case 'rubberBand':return'橡皮筋';
    case 'swing':return'摇摆';
    case 'tada':return'塔达';
    case 'wobble':return'摇晃';
    case 'jello':return'果冻';
    case 'heartBeat':return'心跳';
    case 'flip':return'翻转';
    case 'rollIn':return'滚入';
    case 'rollOut':return'滚出';
    case 'zoomIn':return'放大进入';
    case 'zoomOut':return'缩小退出';
    case 'fadeIn':return'淡入';
    case 'fadeOut':return'淡出';
    case 'slideInUp':return'从下滑入';
    case 'slideInDown':return'从上滑入';
    case 'slideInLeft':return'从左滑入';
    case 'slideInRight':return'从右滑入';
    case 'rotateIn':return'旋转进入';
    case 'rotateOut':return'旋转退出';
    case 'flipInX':return'X轴翻转进入';
    case 'flipOutX':return'X轴翻转退出';
    case 'flipInY':return'Y轴翻转进入';
    case 'flipOutY':return'Y轴翻转退出';
    case 'lightSpeedIn':return'光速进入';
    case 'lightSpeedOut':return'光速退出';
    default:return'未知';
  }
}
function getAnimationCSS(anim){
  switch(anim){
    case 'bounce':return'bounce 1s infinite';
    case 'spin':return'spin 1s linear infinite';
    case 'pulse':return'pulse 1s infinite';
    case 'shake':return'shake 0.5s infinite';
    case 'float':return'float 3s ease-in-out infinite';
    case 'rubberBand':return'rubberBand 1s';
    case 'swing':return'swing 1s infinite';
    case 'tada':return'tada 1s';
    case 'wobble':return'wobble 1s';
    case 'jello':return'jello 1s';
    case 'heartBeat':return'heartBeat 1.3s infinite';
    case 'flip':return'flip 1s';
    case 'rollIn':return'rollIn 1s';
    case 'rollOut':return'rollOut 1s';
    case 'zoomIn':return'zoomIn 1s';
    case 'zoomOut':return'zoomOut 1s';
    case 'fadeIn':return'fadeIn 1s';
    case 'fadeOut':return'fadeOut 1s';
    case 'slideInUp':return'slideInUp 1s';
    case 'slideInDown':return'slideInDown 1s';
    case 'slideInLeft':return'slideInLeft 1s';
    case 'slideInRight':return'slideInRight 1s';
    case 'rotateIn':return'rotateIn 1s';
    case 'rotateOut':return'rotateOut 1s';
    case 'flipInX':return'flipInX 1s';
    case 'flipOutX':return'flipOutX 1s';
    case 'flipInY':return'flipInY 1s';
    case 'flipOutY':return'flipOutY 1s';
    case 'lightSpeedIn':return'lightSpeedIn 1s';
    case 'lightSpeedOut':return'lightSpeedOut 1s';
    default:return'none';
  }
}
function playAllAnimations(){
  var animIndex=0;
  var char=document.getElementById('characterInput').value.trim()||'汉';
  function playNext(){
    if(animIndex>=animations.length)return;
    currentAnimation=animations[animIndex];
    var container=document.querySelector('.animation-container');
    if(container){
      container.innerHTML='<div class="animation-char" style="animation:'+getAnimationCSS(currentAnimation)+'">'+char+'</div>';
    }
    animIndex++;
    setTimeout(playNext,1500);
  }
  playNext();
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  animateCharacter();
}
animateCharacter();
</script>
<style>
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes rubberBand{0%{transform:scale(1)}30%{transform:scale(1.25,0.75)}40%{transform:scale(0.75,1.25)}50%{transform:scale(1.15,0.85)}65%{transform:scale(0.95,1.05)}75%{transform:scale(1.05,0.95)}100%{transform:scale(1)}}
@keyframes swing{20%{transform:rotate(15deg)}40%{transform:rotate(-10deg)}60%{transform:rotate(5deg)}80%{transform:rotate(-5deg)}100%{transform:rotate(0deg)}}
@keyframes tada{0%,100%{transform:scale(1) rotate(0deg)}10%,20%{transform:scale(0.9) rotate(-3deg)}30%,50%,70%,90%{transform:scale(1.1) rotate(3deg)}40%,60%,80%{transform:scale(1.1) rotate(-3deg)}}
@keyframes wobble{0%,100%{transform:translateX(0)}15%{transform:translateX(-25px) rotate(-5deg)}30%{transform:translateX(20px) rotate(3deg)}45%{transform:translateX(-15px) rotate(-3deg)}60%{transform:translateX(10px) rotate(2deg)}75%{transform:translateX(-5px) rotate(-1deg)}}
@keyframes jello{0%,100%{transform:skewX(0deg) skewY(0deg)}30%{transform:skewX(-12.5deg) skewY(-6deg)}60%{transform:skewX(6.25deg) skewY(3deg)}80%{transform:skewX(-3deg) skewY(-1.5deg)}}
@keyframes heartBeat{0%,100%{transform:scale(1)}14%{transform:scale(1.3)}28%{transform:scale(1)}42%{transform:scale(1.3)}70%{transform:scale(1)}}
@keyframes flip{0%{transform:perspective(400px) rotateY(0)}40%{transform:perspective(400px) rotateY(-180deg)}100%{transform:perspective(400px) rotateY(0)}}
@keyframes rollIn{0%{opacity:0;transform:translateX(-100%) rotate(-120deg)}100%{opacity:1;transform:translateX(0) rotate(0)}}
@keyframes rollOut{0%{opacity:1;transform:translateX(0) rotate(0)}100%{opacity:0;transform:translateX(100%) rotate(120deg)}}
@keyframes zoomIn{0%{opacity:0;transform:scale(0.3)}50%{opacity:1}100%{transform:scale(1)}}
@keyframes zoomOut{0%{opacity:1;transform:scale(1)}50%{opacity:0;transform:scale(0.3)}100%{opacity:0;transform:scale(0)}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes fadeOut{0%{opacity:1}100%{opacity:0}}
@keyframes slideInUp{0%{transform:translateY(100%);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes slideInDown{0%{transform:translateY(-100%);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes slideInLeft{0%{transform:translateX(-100%);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes slideInRight{0%{transform:translateX(100%);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes rotateIn{0%{transform:rotate(-200deg);opacity:0}100%{transform:rotate(0);opacity:1}}
@keyframes rotateOut{0%{transform:rotate(0);opacity:1}100%{transform:rotate(200deg);opacity:0}}
@keyframes flipInX{0%{transform:perspective(400px) rotateX(90deg);opacity:0}40%{transform:perspective(400px) rotateX(-10deg)}70%{transform:perspective(400px) rotateX(10deg)}100%{transform:perspective(400px) rotateX(0);opacity:1}}
@keyframes flipOutX{0%{transform:perspective(400px) rotateX(0);opacity:1}100%{transform:perspective(400px) rotateX(90deg);opacity:0}}
@keyframes flipInY{0%{transform:perspective(400px) rotateY(90deg);opacity:0}40%{transform:perspective(400px) rotateY(-10deg)}70%{transform:perspective(400px) rotateY(10deg)}100%{transform:perspective(400px) rotateY(0);opacity:1}}
@keyframes flipOutY{0%{transform:perspective(400px) rotateY(0);opacity:1}100%{transform:perspective(400px) rotateY(90deg);opacity:0}}
@keyframes lightSpeedIn{0%{transform:translateX(100%) skewX(-30deg);opacity:0}60%{transform:translateX(-20deg) skewX(5deg);opacity:1}80%{transform:translateX(8deg) skewX(-5deg)}100%{transform:translateX(0) skewX(0)}}
@keyframes lightSpeedOut{0%{transform:translateX(0) skewX(0);opacity:1}100%{transform:translateX(100%) skewX(-30deg);opacity:0}}
</style></body></html>
