<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 宠物护理日志</title>
<meta property="og:title" content="🐾 宠物护理日志">
<meta property="og:description" content="🐾 宠物护理日志 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="记录宠物的喂食、遛弯、疫苗和日常护理">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6padding:16px;}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1}.ctn{padding:0}}
.li{padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.gr .st{text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;color:#fff;margin-right:4px}
.tag.feed{background:var(--success)}.tag.walk{background:var(--accent)}.tag.vaccine{background:var(--warn)}.tag.groom{background:#9b59b6}.tag.health{background:var(--danger)}.tag.other{background:var(--text2)}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar button{padding:6px 14px;font-size:.85rem;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:20px;cursor:pointer}
.filter-bar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pet-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.pet-tabs button{padding:8px 16px;border:2px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;cursor:pointer;font-size:.9rem}
.pet-tabs button.active{border-color:var(--accent);background:var(--accent);color:#fff}
.pet-tabs button.add-pet{border-style:dashed}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🐾 宠物护理日志</h1><p>记录宠物的日常护理</p></div>

<div class="pet-tabs" id="petTabs"></div>

<div class="gr">
<div class="st"><div class="nm" id="sTotal">0</div><div class="lb">总记录</div></div>
<div class="st"><div class="nm" id="sFeed">0</div><div class="lb">喂食</div></div>
<div class="st"><div class="nm" id="sWalk">0</div><div class="lb">遛弯</div></div>
<div class="st"><div class="nm" id="sHealth">0</div><div class="lb">健康</div></div>
</div>

<div class="cd" style="margin-top:16px"><h2>添加记录</h2>
<div class="fr">
<div><label>宠物</label><select id="pPet"></select></div>
<div><label>类型</label><select id="pType"><option value="feed">喂食</option><option value="walk">遛弯</option><option value="vaccine">疫苗</option><option value="groom">美容</option><option value="health">健康</option><option value="other">其他</option></select></div>
</div>
<div class="fr">
<div><label>日期</label><input type="date" id="pDate"></div>
<div><label>花费(元)</label><input type="number" id="pCost" placeholder="0"></div>
</div>
<label>备注</label><textarea id="pNote" placeholder="详细说明..."></textarea>
<div class="bg"><button onclick="addLog()">添加记录</button></div>
<div id="pMsg" style="display:none;text-align:center;padding:8px;border-radius:8px;margin-top:8px;font-size:.85rem"></div></div>

<div class="cd"><h2>护理记录</h2>
<div class="filter-bar">
<button class="active" onclick="setFilter('all',this)">全部</button>
<button onclick="setFilter('feed',this)">喂食</button>
<button onclick="setFilter('walk',this)">遛弯</button>
<button onclick="setFilter('vaccine',this)">疫苗</button>
<button onclick="setFilter('health',this)">健康</button>
</div>
<div id="logList" class="es">暂无记录</div>
</div>
</div>

<script>
let pets=JSON.parse(localStorage.getItem('petCarePets')||'[]');
let logs=JSON.parse(localStorage.getItem('petCareLogs')||'[]');
let activePet=null;
let filter='all';
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function save(){localStorage.setItem('petCarePets',JSON.stringify(pets));localStorage.setItem('petCareLogs',JSON.stringify(logs))}
function showMsg(m,t){const e=$('pMsg');e.textContent=m;e.style.display='block';e.style.background=t==='error'?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)';e.style.color=t==='error'?'var(--danger)':'var(--success)';setTimeout(()=>e.style.display='none',2000)}
function today(){return new Date().toISOString().slice(0,10)}
function addPet(){const name=prompt('输入宠物名字：');if(!name||!name.trim())return;pets.push({id:Date.now(),name:name.trim()});activePet=pets[pets.length-1].id;save();renderPetTabs()}
function removePet(id){if(!confirm('确认删除该宠物？相关记录也会删除'))return;pets=pets.filter(p=>p.id!==id);logs=logs.filter(l=>l.petId!==id);if(activePet===id)activePet=pets.length?pets[0].id:null;save();renderPetTabs();render()}
function renderPetTabs(){$('petTabs').innerHTML=pets.map(p=>'<button class="'+(activePet===p.id?'active':'')+'" onclick="selectPet('+p.id+')">'+esc(p.name)+' <span onclick="event.stopPropagation();removePet('+p.id+')" style="color:var(--danger);margin-left:4px">✕</span></button>').join('')+'<button class="add-pet" onclick="addPet()">+ 添加宠物</button>';const sel=$('pPet');sel.innerHTML=pets.map(p=>'<option value="'+p.id+'"'+(p.id===activePet?' selected':'')+'>'+esc(p.name)+'</option>').join('');if(pets.length&&!activePet)activePet=pets[0].id}
function selectPet(id){activePet=id;renderPetTabs();render()}
function addLog(){const petId=parseInt($('pPet').value),type=$('pType').value,date=$('pDate').value||today(),cost=parseFloat($('pCost').value)||0,note=$('pNote').value.trim();if(!petId){showMsg('请先添加宠物','error');return}logs.push({petId,type,date,cost,note,addedAt:Date.now()});save();render();showMsg('记录已添加','success');$('pNote').value=''}
function setFilter(f,el){filter=f;document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function render(){const filtered=logs.filter(l=>l.petId===activePet&&(filter==='all'||l.type===filter));const petLogs=logs.filter(l=>l.petId===activePet);$('sTotal').textContent=petLogs.length;$('sFeed').textContent=petLogs.filter(l=>l.type==='feed').length;$('sWalk').textContent=petLogs.filter(l=>l.type==='walk').length;$('sHealth').textContent=petLogs.filter(l=>l.type==='health').length;const typeMap={feed:'喂食',walk:'遛弯',vaccine:'疫苗',groom:'美容',health:'健康',other:'其他'};$('logList').innerHTML=filtered.length?filtered.map((l,i)=>{const realIdx=logs.indexOf(l);const pet=pets.find(p=>p.id===l.petId);return '<div class="li"><div style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-weight:600">'+esc(typeMap[l.type])+'</span>'+(pet?' <span style="color:var(--text2)">· '+esc(pet.name)+'</span>':'')+'<br><span class="tag '+l.type+'">'+typeMap[l.type]+'</span><span style="color:var(--text2);font-size:.8rem;margin-left:4px">'+l.date+'</span>'+(l.cost?'<span style="color:var(--text2);font-size:.8rem;margin-left:4px">¥'+l.cost+'</span>':'')+'</div></div>'+(l.note?'<div style="font-size:.85rem;color:var(--text2);margin-top:4px">'+esc(l.note)+'</div>':'')+'<div class="bg"><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="removeLog('+realIdx+')">删除</button></div></div>'}).join(''):'<div class="es">暂无记录</div>'}
function removeLog(i){logs.splice(i,1);save();render()}
$('pDate').value=today();
renderPetTabs();render()
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
