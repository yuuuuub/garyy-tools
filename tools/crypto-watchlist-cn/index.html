<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加密货币观察清单</title>
<meta name="description" content="加密货币观察清单，追踪管理加密货币价格和持仓">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6;scroll-behavior:smooth}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:var(--text);font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.stat{text-align:center;padding:12px}
.stat-num{font-size:2rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.8rem;color:var(--text2)}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.table th{color:var(--text2);font-size:.85rem;font-weight:600}
.table tr:hover{background:rgba(59,130,246,.05)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.hidden{display:none!important}
.sparkline{display:inline-block;vertical-align:middle}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.grid-2,.grid-3{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="加密货币观察清单">
<meta property="og:description" content="加密货币观察清单，追踪管理加密货币价格和持仓">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/crypto-watchlist-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🪙 加密货币观察清单';
const APP=document.getElementById('app');
const DEFAULT_COINS=[
  {symbol:'BTC',name:'比特币',basePrice:43250},
  {symbol:'ETH',name:'以太坊',basePrice:2280},
  {symbol:'BNB',name:'币安币',basePrice:310},
  {symbol:'SOL',name:'Solana',basePrice:98},
  {symbol:'XRP',name:'瑞波币',basePrice:0.62},
  {symbol:'ADA',name:'卡尔达诺',basePrice:0.58},
  {symbol:'DOGE',name:'狗狗币',basePrice:0.082},
  {symbol:'DOT',name:'波卡',basePrice:7.8},
  {symbol:'AVAX',name:'Avalanche',basePrice:36},
  {symbol:'LINK',name:'Chainlink',basePrice:15.2}
];

let watchlist=JSON.parse(localStorage.getItem('cw_list')||'null')||DEFAULT_COINS.map(c=>({...c,quantity:0,buyPrice:0,alertPrice:0}));
let priceHistory={};
let currentPrices={};

function save(){localStorage.setItem('cw_list',JSON.stringify(watchlist))}

function initPrices(){
  watchlist.forEach(c=>{
    if(!currentPrices[c.symbol]){
      const variation=c.basePrice*0.02*(Math.random()-0.5);
      currentPrices[c.symbol]=c.basePrice+variation;
      priceHistory[c.symbol]=[];
      for(let i=0;i<20;i++){
        const v=c.basePrice*(1+0.03*(Math.random()-0.5));
        priceHistory[c.symbol].push(v);
      }
      priceHistory[c.symbol].push(currentPrices[c.symbol]);
    }
  });
}

function tickPrices(){
  watchlist.forEach(c=>{
    const p=currentPrices[c.symbol]||c.basePrice;
    const change=p*0.005*(Math.random()-0.5);
    currentPrices[c.symbol]=Math.max(0.001,p+change);
    if(!priceHistory[c.symbol])priceHistory[c.symbol]=[];
    priceHistory[c.symbol].push(currentPrices[c.symbol]);
    if(priceHistory[c.symbol].length>30)priceHistory[c.symbol].shift();
  });
  render();
}

function drawSparkline(canvasId,symbol){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const data=priceHistory[symbol]||[];
  if(data.length<2)return;
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const min=Math.min(...data),max=Math.max(...data);
  const range=max-min||1;
  const isUp=data[data.length-1]>=data[0];
  ctx.strokeStyle=isUp?'#3fb950':'#f85149';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  data.forEach((v,i)=>{
    const x=(i/(data.length-1))*w;
    const y=h-((v-min)/range)*h*0.8-h*0.1;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.stroke();
}

function render(){
  initPrices();
  let h=`<h1>🪙 加密货币观察清单</h1><p class="subtitle">实时追踪加密货币价格和持仓</p>`;

  let totalVal=0,totalCost=0;
  watchlist.forEach(c=>{
    const p=currentPrices[c.symbol]||c.basePrice;
    totalVal+=p*c.quantity;
    totalCost+=c.buyPrice*c.quantity;
  });
  const totalPnl=totalVal-totalCost;

  h+=`<div class="grid grid-3">`;
  h+=`<div class="card stat"><div class="stat-num">¥${totalVal.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="stat-label">持仓总值</div></div>`;
  h+=`<div class="card stat"><div class="stat-num" style="color:${totalPnl>=0?'var(--green)':'var(--red)'}">¥${totalPnl.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="stat-label">总盈亏</div></div>`;
  h+=`<div class="card stat"><div class="stat-num">${watchlist.length}</div><div class="stat-label">观察数量</div></div>`;
  h+=`</div>`;

  h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">价格行情</span><button class="btn btn-sm" onclick="showAddModal()">+ 添加币种</button></div>`;
  h+=`<table class="table"><thead><tr><th>币种</th><th>价格</th><th>24h变化</th><th>走势</th><th>持仓</th><th>操作</th></tr></thead><tbody>`;
  watchlist.forEach((c,i)=>{
    const p=currentPrices[c.symbol]||c.basePrice;
    const prevP=priceHistory[c.symbol]&&priceHistory[c.symbol].length>1?priceHistory[c.symbol][priceHistory[c.symbol].length-2]:p;
    const change24=((p-prevP)/prevP*100);
    const isUp=change24>=0;
    const val=p*c.quantity;
    h+=`<tr>`;
    h+=`<td><strong>${c.symbol}</strong> <span style="color:var(--text2);font-size:.8rem">${c.name}</span></td>`;
    h+=`<td>¥${p.toLocaleString(undefined,{maximumFractionDigits:p<1?4:2})}</td>`;
    h+=`<td><span class="badge ${isUp?'badge-green':'badge-red'}">${isUp?'+':''}${change24.toFixed(2)}%</span></td>`;
    h+=`<td><canvas id="spark_${c.symbol}" class="sparkline" width="80" height="30"></canvas></td>`;
    h+=`<td>${c.quantity>0?`${c.quantity} 个 (¥${val.toLocaleString(undefined,{maximumFractionDigits:0})})`:'-'}</td>`;
    h+=`<td><button class="btn btn-sm" onclick="showEditModal(${i})">编辑</button> <button class="btn btn-sm btn-danger" onclick="removeCoin(${i})">移除</button></td>`;
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;

  h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">价格提醒</span></div>`;
  const alerts=watchlist.filter(c=>c.alertPrice>0);
  if(alerts.length===0)h+=`<div class="empty">暂无价格提醒</div>`;
  else{
    alerts.forEach(c=>{
      const p=currentPrices[c.symbol]||c.basePrice;
      const triggered=p>=c.alertPrice;
      h+=`<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border)"><span>${c.symbol} - 目标: ¥${c.alertPrice.toLocaleString()}</span><span class="badge ${triggered?'badge-red':'badge-green'}">${triggered?'已触发':'等待中'}</span></div>`;
    });
  }
  h+=`</div>`;

  APP.innerHTML=h;
  watchlist.forEach(c=>drawSparkline('spark_'+c.symbol,c.symbol));
}

function showAddModal(){
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">添加币种</h3>
    <label>代码</label><input id="m_sym" placeholder="如：BTC">
    <label>名称</label><input id="m_name" placeholder="如：比特币">
    <label>基础价格 (¥)</label><input id="m_price" type="number" step="0.01" placeholder="0">
    <div class="flex" style="margin-top:16px"><button class="btn" onclick="addCoin()">添加</button><button class="btn btn-danger" onclick="this.closest('.modal-overlay').remove()">取消</button></div></div>`;
  document.body.appendChild(overlay);
}
function addCoin(){
  const sym=document.getElementById('m_sym').value.trim().toUpperCase();
  const name=document.getElementById('m_name').value.trim();
  const price=parseFloat(document.getElementById('m_price').value)||1;
  if(!sym)return;
  watchlist.push({symbol:sym,name:name||sym,basePrice:price,quantity:0,buyPrice:0,alertPrice:0});
  save();document.querySelector('.modal-overlay').remove();render();
}

function showEditModal(idx){
  const c=watchlist[idx];
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">编辑 ${c.symbol}</h3>
    <label>持仓数量</label><input id="m_qty" type="number" step="0.01" value="${c.quantity}">
    <label>买入均价 (¥)</label><input id="m_buy" type="number" step="0.01" value="${c.buyPrice}">
    <label>价格提醒 (¥，0=关闭)</label><input id="m_alert" type="number" step="0.01" value="${c.alertPrice}">
    <div class="flex" style="margin-top:16px"><button class="btn" onclick="saveEdit(${idx})">保存</button><button class="btn btn-danger" onclick="this.closest('.modal-overlay').remove()">取消</button></div></div>`;
  document.body.appendChild(overlay);
}
function saveEdit(idx){
  watchlist[idx].quantity=parseFloat(document.getElementById('m_qty').value)||0;
  watchlist[idx].buyPrice=parseFloat(document.getElementById('m_buy').value)||0;
  watchlist[idx].alertPrice=parseFloat(document.getElementById('m_alert').value)||0;
  save();document.querySelector('.modal-overlay').remove();render();
}
function removeCoin(idx){watchlist.splice(idx,1);save();render()}

setInterval(tickPrices,3000);
render();
</script>
</body>
</html>
