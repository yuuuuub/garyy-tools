<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧘 中医冥想静心</title>
<meta property="og:title" content="🧘 中医冥想静心">
<meta property="og:description" content="中医冥想静心功法，内观、打坐、观息、入静 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="中医冥想静心功法，内观、打坐、观息、入静">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.detail{display:none}.detail.active{display:block}
.meditation-circle{width:200px;height:200px;border-radius:50%;border:4px solid var(--border);margin:20px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:all 0.5s}
.meditation-circle.active{border-color:var(--accent);box-shadow:0 0 30px rgba(59,130,246,0.3)}
.meditation-circle.bell{animation:bellPulse 1s ease-out}
@keyframes bellPulse{0%{transform:scale(1)}50%{transform:scale(1.1);border-color:var(--success)}100%{transform:scale(1)}}
.timer-display{font-size:2.5rem;font-weight:700;color:var(--accent)}
.phase-text{color:var(--text2);margin-top:8px;font-size:.9rem}
.breathing-guide{display:flex;justify-content:center;gap:20px;margin:20px 0}
.breath-item{text-align:center;padding:12px;border:1px solid var(--border);border-radius:8px;min-width:80px}
.breath-item.active{border-color:var(--accent);background:var(--accent);color:white}
.breath-num{font-size:1.5rem;font-weight:700}
.breath-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.mood-selector{display:flex;gap:8px;justify-content:center;margin:12px 0}
.mood-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);font-size:1.2rem;cursor:pointer;transition:all .2s}
.mood-btn.active{border-color:var(--accent);background:var(--accent);transform:scale(1.1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{padding:12px;background:var(--bg);border-radius:8px}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.log-item{padding:12px;border-bottom:1px solid var(--border)}
.log-header{display:flex;justify-content:space-between;align-items:center}
.log-meta{color:var(--text2);font-size:.85rem;margin-top:4px}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧘</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div class="ctn">
<div class="hdr">
<h1>🧘 中医冥想静心</h1>
<p>内观静心，调和身心</p>
</div>

<div class="tab-bar" id="tabs">
<div class="tab active" data-tab="types">冥想类型</div>
<div class="tab" data-tab="meditate">开始冥想</div>
<div class="tab" data-tab="log">冥想记录</div>
<div class="tab" data-tab="stats">统计数据</div>
</div>

<div id="view-types" class="detail active">
<div class="cd">
<h2>🧘 选择冥想类型</h2>
<div id="type-list"></div>
</div>
</div>

<div id="view-meditate" class="detail">
<div class="cd" id="meditation-guide" style="display:none">
<h2 id="meditation-title">开始冥想</h2>
<div class="meditation-circle" id="meditation-circle">
<div class="timer-display" id="timer-display">00:00</div>
<div class="phase-text" id="phase-text">准备开始</div>
</div>
<div class="breathing-guide" id="breathing-guide" style="display:none">
<div class="breath-item" id="breath-in">
<div class="breath-num" id="breath-in-num">4</div>
<div class="breath-label">吸气</div>
</div>
<div class="breath-item" id="breath-hold">
<div class="breath-num" id="breath-hold-num">4</div>
<div class="breath-label">屏息</div>
</div>
<div class="breath-item" id="breath-out">
<div class="breath-num" id="breath-out-num">6</div>
<div class="breath-label">呼气</div>
</div>
</div>
<div style="text-align:center;margin-top:16px">
<button id="start-btn" onclick="toggleMeditation()">▶ 开始冥想</button>
<button class="sec" onclick="stopMeditation()" style="margin-left:8px">⏹ 结束</button>
</div>
<div id="post-meditation" style="display:none;margin-top:16px">
<h3>冥想后感受</h3>
<p style="color:var(--text2);margin-bottom:8px">你的心情如何？</p>
<div class="mood-selector" id="mood-selector">
<button class="mood-btn" data-mood="1">😫</button>
<button class="mood-btn" data-mood="2">😕</button>
<button class="mood-btn" data-mood="3">😐</button>
<button class="mood-btn" data-mood="4">😊</button>
<button class="mood-btn" data-mood="5">😌</button>
</div>
<label>笔记（可选）</label>
<textarea id="meditation-notes" rows="2" placeholder="记录你的感受..."></textarea>
<button onclick="saveMeditationSession()">保存记录</button>
</div>
</div>
</div>

<div id="view-log" class="detail">
<div class="cd">
<h2>📋 冥想记录</h2>
<div id="meditation-log"></div>
</div>
</div>

<div id="view-stats" class="detail">
<div class="cd">
<h2>📊 统计数据</h2>
<div class="stats">
<div class="stat"><div class="stat-num" id="total-sessions">0</div><div class="stat-label">总次数</div></div>
<div class="stat"><div class="stat-num" id="total-minutes">0</div><div class="stat-label">总分钟</div></div>
<div class="stat"><div class="stat-num" id="avg-mood">0</div><div class="stat-label">平均心情</div></div>
</div>
</div>
</div>
</div>

<script>
const meditationTypes = [
  {
    name: '内观冥想',
    description: '通过观察自己的身体感受和心理活动，培养对当下的觉知，达到内心平静。',
    benefits: ['减轻焦虑', '提升专注力', '增强自我认知'],
    phases: ['放松身体', '觉知呼吸', '观察感受', '接纳当下', '回归自然'],
    breathing: { in: 4, hold: 4, out: 6 }
  },
  {
    name: '打坐入静',
    description: '传统打坐方法，通过静坐调息，使身心归于平静，培养内在的定力。',
    benefits: ['安定心神', '培养定力', '调和气血'],
    phases: ['调身', '调息', '调心', '入静', '出定'],
    breathing: { in: 4, hold: 2, out: 6 }
  },
  {
    name: '观息法',
    description: '专注于呼吸的观察，不加评判地觉知每一次吸气和呼气。',
    benefits: ['专注当下', '平静心绪', '提升觉知'],
    phases: ['观察吸气', '观察呼气', '觉知停顿', '感受全身', '回归呼吸'],
    breathing: { in: 5, hold: 2, out: 5 }
  },
  {
    name: '正念冥想',
    description: '以不评判的态度，觉知当下的体验，包括身体感受、情绪和想法。',
    benefits: ['减少压力', '提升幸福感', '改善情绪调节'],
    phases: ['觉知身体', '觉知呼吸', '觉知情绪', '觉知想法', '觉知当下'],
    breathing: { in: 4, hold: 4, out: 4 }
  },
  {
    name: '禅定修心',
    description: '通过深度静坐，进入禅定状态，体验内心的宁静与清明。',
    benefits: ['深度放松', '内心清明', '智慧增长'],
    phases: ['放松身心', '专注一点', '深入禅定', '保持觉知', '慢慢出定'],
    breathing: { in: 4, hold: 6, out: 8 }
  }
];

let currentType = null;
let meditationInterval = null;
let meditationSeconds = 0;
let isMeditating = false;
let currentPhase = 0;
let breathingInterval = null;
let selectedMood = null;

function loadData() {
  const data = localStorage.getItem('meditation-data');
  return data ? JSON.parse(data) : { sessions: [] };
}

function saveData(data) {
  localStorage.setItem('meditation-data', JSON.stringify(data));
}

function renderTypeList() {
  const container = document.getElementById('type-list');
  container.innerHTML = meditationTypes.map((type, i) => `
    <div class="li" onclick="selectType(${i})">
      <div><strong>${type.name}</strong><br><span style="color:var(--text2);font-size:.85rem">${type.benefits.slice(0, 2).join(' · ')}</span></div>
      <span class="tag s">${type.phases.length}个阶段</span>
    </div>
  `).join('');
}

function selectType(index) {
  currentType = index;
  const type = meditationTypes[index];
  document.getElementById('meditation-title').textContent = type.name;
  document.getElementById('meditation-guide').style.display = 'block';
  document.getElementById('breathing-guide').style.display = 'flex';
  document.getElementById('breath-in-num').textContent = type.breathing.in;
  document.getElementById('breath-hold-num').textContent = type.breathing.hold;
  document.getElementById('breath-out-num').textContent = type.breathing.out;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
  document.querySelector('[data-tab="meditate"]').classList.add('active');
  document.getElementById('view-meditate').classList.add('active');
}

function toggleMeditation() {
  if (isMeditating) {
    pauseMeditation();
  } else {
    startMeditation();
  }
}

function startMeditation() {
  isMeditating = true;
  document.getElementById('start-btn').textContent = '⏸ 暂停';
  document.getElementById('meditation-circle').classList.add('active');
  
  meditationInterval = setInterval(() => {
    meditationSeconds++;
    updateTimerDisplay();
  }, 1000);
  
  startBreathingGuide();
  showBell();
}

function pauseMeditation() {
  isMeditating = false;
  document.getElementById('start-btn').textContent = '▶ 继续';
  clearInterval(meditationInterval);
  clearInterval(breathingInterval);
}

function stopMeditation() {
  if (meditationSeconds < 10) {
    alert('冥想时间太短，建议至少10秒');
    return;
  }
  isMeditating = false;
  clearInterval(meditationInterval);
  clearInterval(breathingInterval);
  document.getElementById('start-btn').textContent = '▶ 开始冥想';
  document.getElementById('meditation-circle').classList.remove('active');
  document.getElementById('breathing-guide').querySelectorAll('.breath-item').forEach(b => b.classList.remove('active'));
  document.getElementById('phase-text').textContent = '冥想结束';
  document.getElementById('post-meditation').style.display = 'block';
  showBell();
}

function startBreathingGuide() {
  if (currentType === null) return;
  const type = meditationTypes[currentType];
  const phases = [
    { id: 'breath-in', duration: type.breathing.in * 1000 },
    { id: 'breath-hold', duration: type.breathing.hold * 1000 },
    { id: 'breath-out', duration: type.breathing.out * 1000 }
  ];
  let phaseIndex = 0;
  
  function nextPhase() {
    if (!isMeditating) return;
    document.querySelectorAll('.breath-item').forEach(b => b.classList.remove('active'));
    document.getElementById(phases[phaseIndex].id).classList.add('active');
    document.getElementById('phase-text').textContent = document.getElementById(phases[phaseIndex].id).querySelector('.breath-label').textContent;
    phaseIndex = (phaseIndex + 1) % phases.length;
    breathingInterval = setTimeout(nextPhase, phases[phaseIndex].duration);
  }
  nextPhase();
}

function updateTimerDisplay() {
  const mins = Math.floor(meditationSeconds / 60).toString().padStart(2, '0');
  const secs = (meditationSeconds % 60).toString().padStart(2, '0');
  document.getElementById('timer-display').textContent = `${mins}:${secs}`;
}

function showBell() {
  const circle = document.getElementById('meditation-circle');
  circle.classList.add('bell');
  setTimeout(() => circle.classList.remove('bell'), 1000);
}

document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedMood = parseInt(btn.dataset.mood);
  });
});

function saveMeditationSession() {
  if (currentType === null) return;
  const data = loadData();
  const today = new Date().toISOString().split('T')[0];
  data.sessions.push({
    date: today,
    type: meditationTypes[currentType].name,
    duration: meditationSeconds,
    mood: selectedMood || 3,
    notes: document.getElementById('meditation-notes').value,
    timestamp: Date.now()
  });
  saveData(data);
  alert('✅ 冥想记录已保存');
  resetMeditation();
  renderStats();
}

function resetMeditation() {
  meditationSeconds = 0;
  selectedMood = null;
  document.getElementById('timer-display').textContent = '00:00';
  document.getElementById('phase-text').textContent = '准备开始';
  document.getElementById('meditation-notes').value = '';
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('post-meditation').style.display = 'none';
}

function renderLog() {
  const data = loadData();
  const container = document.getElementById('meditation-log');
  if (data.sessions.length === 0) {
    container.innerHTML = '<div class="empty">暂无冥想记录</div>';
    return;
  }
  container.innerHTML = data.sessions.slice().reverse().map(s => `
    <div class="log-item">
      <div class="log-header">
        <strong>${s.type}</strong>
        <span class="tag s">${Math.floor(s.duration / 60)}分${s.duration % 60}秒</span>
      </div>
      <div class="log-meta">${s.date} · 心情 ${'😊'.repeat(s.mood)}</div>
      ${s.notes ? `<div style="margin-top:8px;color:var(--text2);font-size:.9rem">${s.notes}</div>` : ''}
    </div>
  `).join('');
}

function renderStats() {
  const data = loadData();
  document.getElementById('total-sessions').textContent = data.sessions.length;
  const totalMinutes = data.sessions.reduce((sum, s) => sum + s.duration, 0);
  document.getElementById('total-minutes').textContent = Math.floor(totalMinutes / 60);
  const avgMood = data.sessions.length > 0 
    ? (data.sessions.reduce((sum, s) => sum + s.mood, 0) / data.sessions.length).toFixed(1)
    : '0';
  document.getElementById('avg-mood').textContent = avgMood;
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'log') renderLog();
    if (tab.dataset.tab === 'stats') renderStats();
  });
});

renderTypeList();
</script>
</body>
</html>
