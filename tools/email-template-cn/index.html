<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮件模板生成器</title>
<meta name="description" content="在线生成专业邮件模板，支持商务、通知、邀请等多种场景">
<script defer src="../i18n.js"></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth;padding:16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button,textarea{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:100px}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s;display:inline-block;text-align:center}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label,.group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:var(--radius);cursor:pointer;font-size:.82rem;background:var(--card);border:1px solid var(--border);color:var(--text2);transition:all .2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.preview-box{background:#fff;color:#333;padding:24px;border-radius:var(--radius);border:1px solid #ddd;font-size:.85rem;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;background:var(--blue);color:#fff;margin:2px}
.tag-remove{cursor:pointer;margin-left:4px;opacity:.7}
.tag-remove:hover{opacity:1}
.output-area{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
.output-area pre{font-size:.82rem;white-space:pre-wrap;word-break:break-word;color:var(--text)}
@media(max-width:640px){.form-row{flex-direction:column}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📧</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="邮件模板生成器">
<meta property="og:description" content="在线生成专业邮件模板，支持商务、通知、邀请等多种场景">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📧 邮件模板生成器</h1>
    <p>快速生成专业邮件模板，支持多种场景</p>
  </header>

  <div class="card">
    <div class="section-title">选择场景</div>
    <div class="tabs" id="sceneTabs">
      <div class="tab active" data-scene="商务合作">商务合作</div>
      <div class="tab" data-scene="会议邀请">会议邀请</div>
      <div class="tab" data-scene="项目通知">项目通知</div>
      <div class="tab" data-scene="客户跟进">客户跟进</div>
      <div class="tab" data-scene="面试邀请">面试邀请</div>
      <div class="tab" data-scene="感谢信">感谢信</div>
      <div class="tab" data-scene="自定义">自定义</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">发件人信息</div>
    <div class="form-row">
      <div class="group"><label>发件人姓名</label><input type="text" id="senderName" value="张三"></div>
      <div class="group"><label>公司/组织</label><input type="text" id="senderCompany" value="示例科技有限公司"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>职位</label><input type="text" id="senderTitle" value="产品经理"></div>
      <div class="group"><label>邮箱</label><input type="email" id="senderEmail" value="zhangsan@example.com"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">收件人信息</div>
    <div class="form-row">
      <div class="group"><label>收件人姓名</label><input type="text" id="recipientName" value="李总"></div>
      <div class="group"><label>公司/组织</label><input type="text" id="recipientCompany" value="目标公司"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>收件人职位</label><input type="text" id="recipientTitle" value="技术总监"></div>
      <div class="group"><label>收件人邮箱</label><input type="email" id="recipientEmail" value="lizong@example.com"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">邮件内容</div>
    <div class="form-row">
      <div class="group"><label>邮件主题</label><input type="text" id="subject" value="关于合作事宜的沟通"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>称呼方式</label>
        <select id="greeting">
          <option value="尊敬的">尊敬的</option>
          <option value="亲爱的">亲爱的</option>
          <option value="您好">您好</option>
        </select>
      </div>
      <div class="group"><label>正文内容</label><textarea id="body" rows="6">希望这封邮件能为您带去问候。我们正在寻找优质的合作伙伴，经过对贵公司的了解，认为双方在业务上有很好的互补性，希望能有机会进行深入交流。"></textarea></div>
    </div>
    <div class="form-row">
      <div class="group"><label>附件说明（可选）</label><input type="text" id="attachment" value=""></div>
    </div>
    <div class="form-row">
      <div class="group"><label>结束语</label>
        <select id="closing">
          <option value="此致敬礼">此致敬礼</option>
          <option value="顺祝商祺">顺祝商祺</option>
          <option value="祝好">祝好</option>
          <option value="期待回复">期待回复</option>
        </select>
      </div>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" onclick="generateEmail()">生成邮件</button>
    <button class="btn btn-green" onclick="copyEmail()">复制到剪贴板</button>
    <button class="btn btn-outline" onclick="clearForm()">清空</button>
  </div>

  <div class="output-area" id="outputArea" style="display:none">
    <div class="section-title">生成结果</div>
    <div class="preview-box" id="preview"></div>
    <div class="btn-group">
      <button class="btn btn-outline" onclick="downloadEmail()">下载为 TXT</button>
    </div>
  </div>
</div>

<script>
var scenes = {
  '商务合作': '我们正在寻找优质的合作伙伴，经过对贵公司的了解，认为双方在业务上有很好的互补性，希望能有机会进行深入交流。',
  '会议邀请': '诚邀您参加即将举办的行业交流会，届时将有多位专家分享前沿观点，期待您的莅临指导。',
  '项目通知': '现就项目最新进展进行通报，请各相关方知悉并配合做好后续工作安排。',
  '客户跟进': '感谢您之前与我们的交流，针对您提出的需求，我们已准备了详细的解决方案，期待与您进一步探讨。',
  '面试邀请': '恭喜您通过初筛！我们诚挚邀请您参加面试，届时将由团队负责人与您面对面交流。',
  '感谢信': '衷心感谢您在百忙之中抽出时间与我们交流，您的宝贵意见对我们非常有帮助，期待未来有更多合作机会。',
  '自定义': ''
};

document.getElementById('sceneTabs').addEventListener('click', function(e) {
  if (e.target.classList.contains('tab')) {
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    e.target.classList.add('active');
    var scene = e.target.dataset.scene;
    if (scenes[scene]) {
      document.getElementById('body').value = scenes[scene];
      if (scene === '商务合作') document.getElementById('subject').value = '关于合作事宜的沟通';
      else if (scene === '会议邀请') document.getElementById('subject').value = '诚邀参加行业交流会';
      else if (scene === '项目通知') document.getElementById('subject').value = '项目进展通报';
      else if (scene === '客户跟进') document.getElementById('subject').value = '解决方案沟通';
      else if (scene === '面试邀请') document.getElementById('subject').value = '面试邀请';
      else if (scene === '感谢信') document.getElementById('subject').value = '感谢信';
    }
  }
});

function generateEmail() {
  var senderName = document.getElementById('senderName').value || '发件人';
  var senderCompany = document.getElementById('senderCompany').value || '';
  var senderTitle = document.getElementById('senderTitle').value || '';
  var senderEmail = document.getElementById('senderEmail').value || '';
  var recipientName = document.getElementById('recipientName').value || '收件人';
  var recipientCompany = document.getElementById('recipientCompany').value || '';
  var recipientTitle = document.getElementById('recipientTitle').value || '';
  var greeting = document.getElementById('greeting').value;
  var subject = document.getElementById('subject').value || '无主题';
  var body = document.getElementById('body').value || '';
  var closing = document.getElementById('closing').value;
  var attachment = document.getElementById('attachment').value;

  var email = '';
  email += '收件人: ' + recipientName;
  if (recipientTitle) email += ' (' + recipientTitle + ')';
  if (recipientCompany) email += ' - ' + recipientCompany;
  email += '\n';
  email += '邮箱: ' + (document.getElementById('recipientEmail').value || '') + '\n';
  email += '主题: ' + subject + '\n';
  email += '\n';
  email += greeting + recipientName + '：\n\n';
  email += body + '\n\n';
  email += closing + '\n\n';
  email += senderName;
  if (senderTitle) email += ' | ' + senderTitle;
  email += '\n';
  if (senderCompany) email += senderCompany + '\n';
  if (senderEmail) email += senderEmail + '\n';
  if (attachment) email += '\n附件: ' + attachment;

  document.getElementById('preview').textContent = email;
  document.getElementById('outputArea').style.display = 'block';
  document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
}

function copyEmail() {
  generateEmail();
  var text = document.getElementById('preview').textContent;
  navigator.clipboard.writeText(text).then(function() {
    alert('已复制到剪贴板');
  });
}

function downloadEmail() {
  generateEmail();
  var text = document.getElementById('preview').textContent;
  var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'email-template.txt';
  a.click();
}

function clearForm() {
  document.querySelectorAll('input,textarea').forEach(function(el){ el.value = ''; });
  document.getElementById('outputArea').style.display = 'none';
}
</script>
</body>
</html>
