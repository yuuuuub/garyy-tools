<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报告构建器</title>
<meta name="description" content="报告构建器，快速创建结构化数据报告">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6scroll-behavior:smooth;}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:var(--text);font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-warning{background:var(--yellow);color:#000}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.hidden{display:none!important}
.report-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-title{font-weight:700;font-size:.95rem}
.section-content{font-size:.9rem;line-height:1.8;white-space:pre-wrap}
.section-actions{display:flex;gap:6px}
.section-actions button{padding:4px 10px;font-size:.8rem;border:none;border-radius:4px;cursor:pointer;background:var(--border);color:var(--text)}
.section-actions button:hover{background:var(--accent)}
.section-actions button.del{background:var(--red);color:#fff}
.report-preview{background:#fff;color:#1f2328;padding:30px;border-radius:8px;font-family:serif;line-height:1.8}
.report-preview h2{font-size:1.3rem;margin:20px 0 10px;border-bottom:2px solid #333;padding-bottom:6px}
.report-preview h3{font-size:1.1rem;margin:16px 0 8px;color:#444}
.report-preview p{margin:8px 0;text-indent:2em}
.report-preview .meta{color:#888;font-size:.85rem;text-align:center;margin-bottom:20px}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="报告构建器">
<meta property="og:description" content="报告构建器，快速创建结构化数据报告">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/report-builder-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📄 报告构建器';
const APP=document.getElementById('app');
let reports=JSON.parse(localStorage.getItem('rb_reports')||'[]');
let curReport=null;
let viewMode='edit';

function save(){localStorage.setItem('rb_reports',JSON.stringify(reports))}

function render(){
  let h=`<h1>📄 报告构建器</h1><p class="subtitle">创建结构化数据报告</p>`;
  if(curReport!==null){
    let r=reports[curReport];
    h+=`<div class="card"><div class="flex-between"><button class="btn btn-sm" onclick="curReport=null;render()">← 返回</button><b>${r.title}</b><div class="flex">`;
    h+=`<button class="btn btn-sm ${viewMode==='edit'?'btn-success':''}" onclick="viewMode='edit';render()">编辑</button>`;
    h+=`<button class="btn btn-sm ${viewMode==='preview'?'btn-success':''}" onclick="viewMode='preview';render()">预览</button>`;
    h+=`<button class="btn btn-sm" onclick="addSection()">+ 章节</button>`;
    h+=`</div></div></div>`;
    if(viewMode==='preview'){
      h+=`<div class="card report-preview"><h2 style="text-align:center;border:none;margin:0 0 6px">${r.title}</h2><div class="meta">作者：${r.author||'未知'} | 日期：${r.date||new Date().toLocaleDateString('zh-CN')}</div>`;
      r.sections.forEach(s=>{
        if(s.level===2) h+=`<h2>${s.title}</h2>`;
        else if(s.level===3) h+=`<h3>${s.title}</h3>`;
        h+=`<p>${(s.content||'').replace(/\n/g,'</p><p>')}</p>`;
      });
      h+=`</div>`;
    } else {
      h+=`<div class="card"><div class="grid" style="grid-template-columns:1fr 1fr">`;
      h+=`<div><label>作者</label><input value="${r.author||''}" onchange="reports[${curReport}].author=this.value;save()"></div>`;
      h+=`<div><label>日期</label><input type="date" value="${r.date||''}" onchange="reports[${curReport}].date=this.value;save()"></div>`;
      h+=`</div></div>`;
      r.sections.forEach((s,si)=>{
        let lvlBadge=s.level===2?'<span class="badge badge-blue">H2</span>':'<span class="badge badge-yellow">H3</span>';
        h+=`<div class="report-section"><div class="section-header"><div class="flex">${lvlBadge}<span class="section-title">${s.title||'(无标题)'}</span></div>`;
        h+=`<div class="section-actions">`;
        h+=`<button onclick="moveSection(${si},-1)">↑</button>`;
        h+=`<button onclick="moveSection(${si},1)">↓</button>`;
        h+=`<button onclick="editSection(${si})">编辑</button>`;
        h+=`<button class="del" onclick="delSection(${si})">×</button>`;
        h+=`</div></div>`;
        h+=`<div class="section-content">${s.content||'(无内容)'}</div>`;
        h+=`</div>`;
      });
      if(!r.sections.length) h+=`<div class="empty">暂无章节</div>`;
    }
  } else {
    h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">报告列表</span><button class="btn btn-sm" onclick="newReport()">+ 新建</button></div></div>`;
    reports.forEach((r,i)=>{
      h+=`<div class="card"><div class="flex-between"><b>${r.title}</b><div class="flex"><span class="badge badge-blue">${r.sections.length} 章节</span><button class="btn btn-sm" onclick="openReport(${i})">编辑</button><button class="btn btn-sm btn-danger" onclick="delReport(${i})">×</button></div></div></div>`;
    });
    if(!reports.length) h+=`<div class="empty">暂无报告</div>`;
  }
  APP.innerHTML=h;
}

function newReport(){let t=prompt('报告标题：');if(t){reports.push({title:t,author:'',date:new Date().toISOString().split('T')[0],sections:[]});save();render()}}
function openReport(i){curReport=i;viewMode='edit';render()}
function delReport(i){if(confirm('删除报告？')){reports.splice(i,1);curReport=null;save();render()}}

function addSection(){
  let level=parseInt(prompt('章节级别（2=二级标题，3=三级标题）：','2'));
  if(level!==2&&level!==3){alert('请输入2或3');return;}
  let title=prompt('章节标题：');
  if(title===null) return;
  let content=prompt('章节内容：','');
  reports[curReport].sections.push({level,title,content:content||''});
  save();render();
}

function editSection(i){
  let s=reports[curReport].sections[i];
  let title=prompt('章节标题：',s.title);
  if(title===null) return;
  let content=prompt('章节内容：',s.content);
  if(content===null) return;
  s.title=title;s.content=content;
  save();render();
}

function delSection(i){if(confirm('删除章节？')){reports[curReport].sections.splice(i,1);save();render()}}

function moveSection(i,dir){
  let secs=reports[curReport].sections;
  let ni=i+dir;
  if(ni<0||ni>=secs.length) return;
  [secs[i],secs[ni]]=[secs[ni],secs[i]];
  save();render();
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
