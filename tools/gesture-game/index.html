<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手势记忆游戏</title>
<meta name="description" content="手势记忆游戏，记住并重现手势序列">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--success:#22c55e;--error:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8rem;margin-bottom:10px;color:var(--accent)}
.info-bar{display:flex;gap:12px;margin-bottom:15px;flex-wrap:wrap;justify-content:center}
.info-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:0.9rem}
.info-item span{color:var(--accent);font-weight:bold}
.sequence-display{display:flex;gap:10px;margin-bottom:15px;min-height:70px;align-items:center;justify-content:center}
.arrow{width:60px;height:60px;background:var(--card);border:2px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem;transition:all 0.3s;opacity:0.4}
.arrow.flash{opacity:1;background:var(--accent);border-color:var(--accent);transform:scale(1.1)}
.arrow.done{opacity:1;border-color:var(--success);color:var(--success)}
.arrow.wrong{opacity:1;border-color:var(--error);color:var(--error);animation:shake 0.3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.input-arrows{display:flex;gap:10px;margin-bottom:15px}
.key-btn{width:70px;height:70px;background:var(--card);border:2px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;transition:all 0.2s;user-select:none}
.key-btn:hover{border-color:var(--accent);background:rgba(59,130,246,0.1)}
.key-btn:active{transform:scale(0.95);background:var(--accent);color:#fff}
.msg{font-size:1.1rem;padding:10px;text-align:center;min-height:40px;color:var(--accent)}
.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:1rem;cursor:pointer;font-family:inherit}
button:hover{opacity:0.85}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="手势记忆游戏">
  <meta property="og:description" content="手势记忆游戏，记住并重现手势序列">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/gesture-game/">
</head>
<body>
<h1>🎮 手势记忆</h1>
<div class="info-bar">
  <div class="info-item">📊 等级: <span id="level">1</span></div>
  <div class="info-item">🔢 序列: <span id="seqLen">3</span></div>
  <div class="info-item">🏆 最高: <span id="bestLevel">0</span></div>
</div>
<div class="sequence-display" id="seqDisplay"></div>
<div class="input-arrows" id="inputArea">
  <div class="key-btn" onclick="onInput(0)">⬆️</div>
  <div class="key-btn" onclick="onInput(1)">⬇️</div>
  <div class="key-btn" onclick="onInput(2)">⬅️</div>
  <div class="key-btn" onclick="onInput(3)">➡️</div>
</div>
<div class="msg" id="msg">点击"开始"记忆箭头序列</div>
<div class="buttons">
  <button onclick="startGame()">▶ 开始</button>
  <button onclick="resetGame()">🔄 重置</button>
</div>
<script>
const ARROWS=['⬆️','⬇️','⬅️','➡️'];
let level=1,sequence=[],playerIdx=0,state='idle',bestLevel=parseInt(localStorage.getItem('gg_best')||'0');
document.getElementById('bestLevel').textContent=bestLevel;

function renderDisplay(){
  const el=document.getElementById('seqDisplay');
  el.innerHTML='';
  for(let i=0;i<Math.max(sequence.length,level+2);i++){
    const div=document.createElement('div');
    div.className='arrow';
    div.dataset.idx=i;
    div.textContent=i<sequence.length?ARROWS[sequence[i]]:'';
    el.appendChild(div);
  }
}

async function showSequence(){
  state='showing';
  document.getElementById('msg').textContent='👀 记住序列...';
  await new Promise(r=>setTimeout(r,500));
  for(let i=0;i<sequence.length;i++){
    const arrow=document.querySelector(`.arrow[data-idx="${i}"]`);
    if(arrow)arrow.classList.add('flash');
    await new Promise(r=>setTimeout(r,500));
    if(arrow)arrow.classList.remove('flash');
    await new Promise(r=>setTimeout(r,150));
  }
  state='input';
  document.getElementById('msg').textContent=`你的回合！输入第 ${playerIdx+1} 个`;
}

function onInput(idx){
  if(state!=='input')return;
  const arrow=document.querySelector(`.arrow[data-idx="${playerIdx}"]`);
  if(idx===sequence[playerIdx]){
    if(arrow){arrow.classList.add('done');arrow.textContent=ARROWS[idx]}
    playerIdx++;
    if(playerIdx>=sequence.length){
      level++;document.getElementById('level').textContent=level;
      document.getElementById('msg').textContent='✅ 正确！下一关';
      setTimeout(startRound,1000);
    } else {
      document.getElementById('msg').textContent=`输入第 ${playerIdx+1} 个`;
    }
  } else {
    if(arrow){arrow.classList.add('wrong');arrow.textContent=ARROWS[idx]}
    gameOver();
  }
}

document.addEventListener('keydown',e=>{
  const map={'ArrowUp':0,'ArrowDown':1,'ArrowLeft':2,'ArrowRight':3};
  if(map[e.key]!==undefined){e.preventDefault();onInput(map[e.key])}
});

function generateSequence(){
  const len=level+2;sequence=[];
  for(let i=0;i<len;i++)sequence.push(Math.floor(Math.random()*4));
  document.getElementById('seqLen').textContent=len;
}

function startRound(){generateSequence();playerIdx=0;renderDisplay();showSequence()}
function startGame(){level=1;document.getElementById('level').textContent=1;startRound()}
function gameOver(){
  state='idle';
  if(level>bestLevel){bestLevel=level-1;localStorage.setItem('gg_best',bestLevel);document.getElementById('bestLevel').textContent=bestLevel}
  document.getElementById('msg').textContent=`❌ 错误！到达等级 ${level-1}`;
}
function resetGame(){state='idle';level=1;playerIdx=0;document.getElementById('level').textContent=1;sequence=[];document.getElementById('msg').textContent='点击"开始"记忆箭头序列';renderDisplay()}
renderDisplay();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
