<!DOCTYPE html>
<html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国书法生成器 V2</title><meta name="description" content="中国书法生成器V2 - 增强版书法生成工具，支持更多字体和效果"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select,.input-group textarea{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group textarea{min-height:80px;resize:vertical}.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px;margin-right:8px}.btn:hover{opacity:.85}.btn-sm{padding:6px 16px;font-size:.8rem;margin-top:8px}.row{display:flex;gap:12px;flex-wrap:wrap}.row .input-group{flex:1;min-width:200px}.canvas-area{background:#f5f5f0;border:1px solid var(--border);border-radius:8px;min-height:400px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-top:16px}.canvas-area canvas{max-width:100%}.seal{position:absolute;bottom:20px;right:20px;width:60px;height:60px;border:2px solid #dc2626;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:1.5rem;border-radius:4px;transform:rotate(-5deg)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.toolbar .btn{margin-top:0}.history-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;transition:var(--transition)}.history-item:hover{border-color:var(--blue)}.tab-bar{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:8px}.tab{padding:8px 16px;cursor:pointer;border-radius:8px 8px 0 0;color:var(--text2);transition:var(--transition)}.tab.active{background:var(--blue);color:#fff}.tab:hover:not(.active){background:var(--bg)}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}</style><meta property="og:title" content="中国书法生成器V2"><meta property="og:description" content="中国书法生成器V2 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖊️</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🖊️ 中国书法生成器 V2</h1><p class="sub">增强版书法生成工具，支持笔触模拟、宣纸纹理和多种效果</p>
<div class="card">
<div class="tab-bar">
<div class="tab active" onclick="switchTab('gen',this)">生成书法</div>
<div class="tab" onclick="switchTab('history',this)">历史记录</div>
<div class="tab" onclick="switchTab('custom',this)">自定义设置</div>
</div>
<div id="tab-gen">
<div class="input-group"><label>输入文字</label><textarea id="textInput" placeholder="输入要生成书法的文字（支持多行）"></textarea></div>
<div class="row">
<div class="input-group"><label>书体</label><select id="styleSelect"><option value="kaishu">楷书</option><option value="xingshu">行书</option><option value="caoshu">草书</option><option value="lishu">隶书</option><option value="zhuanshu">篆书</option><option value="weibei">魏碑</option><option value="songti">宋体</option><option value="heiti">黑体</option><option value="youshu">幼圆</option></select></div>
<div class="input-group"><label>字体大小</label><select id="sizeSelect"><option value="small">小号</option><option value="medium" selected>中号</option><option value="large">大号</option><option value="xlarge">特大号</option></select></div>
<div class="input-group"><label>墨色</label><select id="colorSelect"><option value="#000000">浓墨</option><option value="#1a1a1a">重墨</option><option value="#333333">中墨</option><option value="#666666">淡墨</option><option value="#8B0000">朱砂红</option><option value="#006400">墨绿</option><option value="#00008B">靛蓝</option><option value="#4B0082">紫墨</option><option value="#8B4513">棕墨</option></select></div>
</div>
<div class="row">
<div class="input-group"><label>背景</label><select id="bgSelect"><option value="xuan">宣纸</option><option value="xuan-old">仿古宣纸</option><option value="white">白色</option><option value="dark">深色</option><option value="bamboo">竹简</option><option value="silk">绢帛</option></select></div>
<div class="input-group"><label>布局</label><select id="layoutSelect"><option value="horizontal">横排</option><option value="vertical">竖排</option><option value="grid">田字格</option><option value="mi">米字格</option></select></div>
<div class="input-group"><label>印章</label><select id="sealSelect"><option value="seal1">姓名印</option><option value="seal2">闲章</option><option value="seal3">引首章</option><option value="none">无印章</option></select></div>
</div>
<div class="input-group"><label>特殊效果</label>
<div style="display:flex;gap:16px;flex-wrap:wrap">
<label><input type="checkbox" id="fxInk" checked> 墨色渐变</label>
<label><input type="checkbox" id="fxTexture" checked> 宣纸纹理</label>
<label><input type="checkbox" id="fxBrush"> 笔触效果</label>
<label><input type="checkbox" id="fxWatermark"> 水印</label>
</div></div>
<button class="btn" onclick="generate()">生成书法</button>
<button class="btn" onclick="randomText()" style="background:var(--green)">随机文字</button>
<button class="btn" onclick="generateFromCanvas()" style="background:var(--red)">高清导出</button>
</div>
<div id="tab-history" style="display:none"></div>
<div id="tab-custom" style="display:none">
<div class="card">
<h3>自定义印章</h3>
<div class="input-group"><label>印章文字</label><input type="text" id="sealText" value="印" maxlength="4" placeholder="输入印章文字（1-4字）"></div>
<div class="input-group"><label>印章形状</label><select id="sealShape"><option value="square">方形</option><option value="round">圆形</option><option value="oval">椭圆</option><option value="free">自由形</option></select></div>
<div class="input-group"><label>印章颜色</label><select id="sealColor"><option value="#dc2626">朱砂红</option><option value="#991b1b">深红</option><option value="#b45309">褐色</option><option value="#1e3a5f">蓝章</option></select></div>
<button class="btn" onclick="updateSeal()">更新印章设置</button>
</div>
<div class="card">
<h3>自定义水印</h3>
<div class="input-group"><label>水印文字</label><input type="text" id="watermarkText" placeholder="输入水印文字"></div>
<div class="input-group"><label>水印透明度</label><input type="range" id="watermarkOpacity" min="0.02" max="0.15" step="0.01" value="0.06"></div>
<button class="btn" onclick="updateWatermark()">更新水印</button>
</div>
</div>
<div id="preview" class="canvas-area" style="min-height:400px;margin-top:16px"></div>
</div>
<script src="../i18n.js" defer></script>
<script>
var fonts={kaishu:'"楷体","KaiTi","STKaiti",serif',xingshu:'"行楷","STXingkai","华文行楷",cursive',caoshu:'"草书","STCaiyun","华文草书",cursive',lishu:'"隶书","LiSu","STLiti",serif',zhuanshu:'"篆书","STZhuan","方正小篆体",serif',weibei:'"魏碑","STWeibei",serif',songti:'"宋体","SimSun","STSong",serif',heiti:'"黑体","SimHei","STHeiti",sans-serif',youshu:'"幼圆","YouYuan","STYuanyuan",sans-serif'};
var names={kaishu:'楷书',xingshu:'行书',caoshu:'草书',lishu:'隶书',zhuanshu:'篆书',weibei:'魏碑',songti:'宋体',heiti:'黑体',youshu:'幼圆'};
var sizes={small:'2rem',medium:'3.5rem',large:'5rem',xlarge:'7rem'};
var bgs={xuan:'#f5f5f0','xuan-old':'#f4e4bc',white:'#ffffff',dark:'#1a1a2e',bamboo:'#d4c5a0',silk:'#faf0e6'};
var randoms=['宁静致远','厚德载物','自强不息','上善若水','天道酬勤','海纳百川','有容乃大','大道至简','知行合一','止于至善','心如止水','虚怀若竹','观海听涛','龙马精神','惠风和畅','兰亭雅集','笔墨纸砚','墨韵飘香','气韵生动','妙笔生花','入木三分','铁画银钩','柳骨颜筋','怀素狂草'];
var history=JSON.parse(localStorage.getItem('calligraphy_history')||'[]');
var sealConfig={text:'印',shape:'square',color:'#dc2626'};
var watermarkConfig={text:'',opacity:0.06};
function switchTab(name,el){
document.querySelectorAll('.tab-bar .tab').forEach(function(t){t.classList.remove('active')});
el.classList.add('active');
['tab-gen','tab-history','tab-custom'].forEach(function(id){document.getElementById(id).style.display='none'});
document.getElementById('tab-'+name).style.display='block';
if(name==='history') renderHistory();
}
function generate(){
var t=document.getElementById('textInput').value.trim();
if(!t){alert('请输入文字');return;}
var s=document.getElementById('styleSelect').value;
var sz=document.getElementById('sizeSelect').value;
var c=document.getElementById('colorSelect').value;
var bg=document.getElementById('bgSelect').value;
var layout=document.getElementById('layoutSelect').value;
var sealType=document.getElementById('sealSelect').value;
var fxInk=document.getElementById('fxInk').checked;
var fxTex=document.getElementById('fxTexture').checked;
var fxBrush=document.getElementById('fxBrush').checked;
var bgc=bgs[bg]||bgs.xuan;
var writingMode=layout==='vertical'?'vertical-rl':'horizontal-tb';
var display=layout==='grid'||layout==='mi'?'inline-block':'block';
var gridHtml='';
if(layout==='grid'||layout==='mi'){
gridHtml='<div style="display:grid;grid-template-columns:repeat('+Math.ceil(Math.sqrt(t.length))+',1fr);gap:2px;width:100%;max-width:500px">';
for(var i=0;i<t.length;i++){
var ch=t[i];
if(ch==='\n') continue;
var borderStyle=layout==='mi'?'border:1px solid rgba(220,38,38,.2);position:relative':'border:1px solid rgba(220,38,38,.3)';
var innerGrid='';
if(layout==='mi'){
innerGrid='<div style="position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(220,38,38,.15)"></div><div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(220,38,38,.15)"></div><div style="position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom right,transparent calc(50% - .5px),rgba(220,38,38,.1) calc(50% - .5px),rgba(220,38,38,.1) calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(to top right,transparent calc(50% - .5px),rgba(220,38,38,.1) calc(50% - .5px),rgba(220,38,38,.1) calc(50% + .5px),transparent calc(50% + .5px))"></div>';
}
gridHtml+='<div style="'+borderStyle+';aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative">'+innerGrid+'<span style="font-family:'+fonts[s]+';font-size:'+sizes[s]+';color:'+c+'">'+ch+'</span></div>';
}
gridHtml+='</div>';
}
var html='<div class="card">';
html+='<div class="canvas-area" style="background:'+bgc+(fxTex?';background-image:url(\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><filter id=%22n%22><feTurbulence baseFrequency=%220.8%22 numOctaves=%224%22/></filter><rect width=%22100%22 height=%22100%22 filter=%22url(%23n)%22 opacity=%220.03%22/></svg>\')':'')+'">';
if(gridHtml){
html+=gridHtml;
}else{
html+='<div style="font-family:'+fonts[s]+';font-size:'+sizes[s]+';color:'+c+';writing-mode:'+writingMode+';line-height:1.8;letter-spacing:0.1em;white-space:pre-wrap'+(fxInk?';text-shadow:1px 1px 2px rgba(0,0,0,.1)':'')+'">'+t+'</div>';
}
if(sealType!=='none'){
html+='<div class="seal" style="border-color:'+sealConfig.color+';color:'+sealConfig.color+';border-radius:'+(sealConfig.shape==='round'?'50%':sealConfig.shape==='oval'?'50%/30%':'4px')+'">'+sealConfig.text+'</div>';
}
if(watermarkConfig.text||document.getElementById('fxWatermark').checked){
var wmText=watermarkConfig.text||'书法';
html+='<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:2rem;color:rgba(0,0,0,'+watermarkConfig.opacity+');pointer-events:none;font-family:'+fonts[s]+'">'+wmText+'</div>';
}
html+='</div>';
html+='<div style="text-align:center;margin-top:12px;color:var(--text2);font-size:.85rem">';
html+='书体：'+names[s]+' | 字数：'+t.replace(/\n/g,'').length+'字 | 布局：'+({horizontal:'横排',vertical:'竖排',grid:'田字格',mi:'米字格'}[layout]);
html+='</div>';
html+='<div class="toolbar" style="justify-content:center"><button class="btn btn-sm" onclick="downloadImg()">下载图片</button><button class="btn btn-sm" style="background:var(--green)" onclick="copyText()">复制文字</button><button class="btn btn-sm" style="background:var(--red)" onclick="saveHistory()">保存记录</button></div></div>';
document.getElementById('preview').innerHTML=html;
}
function randomText(){document.getElementById('textInput').value=randoms[Math.floor(Math.random()*randoms.length)];generate()}
function copyText(){var t=document.getElementById('textInput').value;if(!t)return;navigator.clipboard.writeText(t).then(function(){alert('已复制')}).catch(function(){alert('复制失败')})}
function downloadImg(){var el=document.querySelector('.canvas-area');if(!el)return;var c=document.createElement('canvas');c.width=1200;c.height=800;var ctx=c.getContext('2d');ctx.fillStyle='#f5f5f0';ctx.fillRect(0,0,1200,800);ctx.fillStyle='#000';ctx.font='64px KaiTi';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(document.getElementById('textInput').value||'书法',600,400);var a=document.createElement('a');a.download='calligraphy-v2.png';a.href=c.toDataURL('image/png');a.click()}
function saveHistory(){
var t=document.getElementById('textInput').value.trim();
if(!t)return;
history.unshift({text:t,style:document.getElementById('styleSelect').value,time:Date.now()});
if(history.length>20) history.pop();
localStorage.setItem('calligraphy_history',JSON.stringify(history));
alert('已保存');
}
function renderHistory(){
var h=document.getElementById('tab-history');
if(history.length===0){h.innerHTML='<div class="card"><p style="color:var(--text2)">暂无历史记录</p></div>';return;}
var html='<div class="card">';
history.forEach(function(item,i){
html+='<div class="history-item" onclick="useHistory('+i+')">';
html+='<strong>'+item.text+'</strong> <span style="color:var(--text2);font-size:.8rem">'+names[item.style]+'</span>';
html+='</div>';
});
html+='</div>';
h.innerHTML=html;
}
function useHistory(i){
var item=history[i];
document.getElementById('textInput').value=item.text;
document.getElementById('styleSelect').value=item.style;
switchTab('gen',document.querySelector('.tab-bar .tab'));
generate();
}
function updateSeal(){sealConfig.text=document.getElementById('sealText').value||'印';sealConfig.shape=document.getElementById('sealShape').value;sealConfig.color=document.getElementById('sealColor').value;generate()}
function updateWatermark(){watermarkConfig.text=document.getElementById('watermarkText').value;watermarkConfig.opacity=parseFloat(document.getElementById('watermarkOpacity').value);generate()}
function generateFromCanvas(){generate()}
generate();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
