<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>端午节龙舟竞渡</title>
<meta name="description" content="端午节龙舟竞渡 - 端午习俗、龙舟比赛、粽子文化、屈原传说">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<meta name="robots" content="index,follow">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.hidden{display:none}
.race-track{position:relative;background:linear-gradient(180deg,#1e3a5f,#0f2744);border-radius:8px;padding:20px;margin:16px 0;overflow:hidden;height:120px}
.water{position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(59,130,246,.3),rgba(59,130,246,.6));animation:wave 2s ease-in-out infinite}
@keyframes wave{0%,100%{height:40%}50%{height:45%}}
.boat{position:absolute;font-size:2rem;animation:row 3s ease-in-out infinite}
@keyframes row{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}
.boat-1{top:20%;left:0;animation-duration:2.8s}
.boat-2{top:45%;left:10%;animation-duration:3.2s;animation-delay:.3s}
.boat-3{top:70%;left:5%;animation-duration:2.9s;animation-delay:.6s}
.start-btn{text-align:center;margin:12px 0}
.custom-list{display:flex;flex-direction:column;gap:10px}
.custom-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all var(--transition)}
.custom-item:hover{border-color:var(--green)}
.custom-header{display:flex;align-items:center;gap:10px}
.custom-icon{font-size:1.5rem}
.custom-name{font-weight:600}
.custom-desc{color:var(--text2);font-size:.85rem;margin-top:4px}
.custom-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--text2);font-size:.85rem;line-height:1.6;display:none}
.custom-detail.show{display:block}
.zongzi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.zongzi-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;transition:all var(--transition)}
.zongzi-item:hover{border-color:var(--green)}
.zongzi-emoji{font-size:2rem;margin-bottom:6px}
.zongzi-name{font-weight:600;margin-bottom:4px}
.zongzi-desc{color:var(--text2);font-size:.8rem}
.quiz-area{text-align:center}
.quiz-q{font-size:1.1rem;font-weight:600;margin-bottom:16px;line-height:1.6}
.quiz-options{display:flex;flex-direction:column;gap:8px;max-width:500px;margin:0 auto}
.quiz-opt{padding:12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;background:var(--bg)}
.quiz-opt:hover{border-color:var(--blue);background:var(--card)}
.quiz-opt.correct{border-color:var(--green);background:rgba(35,134,54,.2)}
.quiz-opt.wrong{border-color:var(--red);background:rgba(239,68,68,.2)}
.quiz-score{margin-top:12px;font-size:1rem;color:var(--text2)}
.history-text{line-height:1.8;font-size:.9rem;color:var(--text2)}
.history-text p{margin-bottom:10px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div style="position:fixed;top:8px;right:8px;z-index:9999"><button class="btn btn-secondary" onclick="toggleTheme()" style="font-size:.8rem;padding:4px 10px" id="themeBtn">🌙 暗色</button></div>
<div class="container">
<h1>🐉 端午节龙舟竞渡</h1>
<p class="sub">龙舟比赛 · 粽子文化 · 屈原传说 · 端午习俗</p>

<div class="card">
<div class="race-track">
<div class="water"></div>
<div class="boat boat-1">🐉</div>
<div class="boat boat-2">🐲</div>
<div class="boat boat-3">🐉</div>
</div>
<div class="start-btn"><button class="btn btn-primary" onclick="startRace()">🏁 开始龙舟赛</button></div>
<p id="raceResult" style="text-align:center;color:var(--text2);font-size:.9rem"></p>
</div>

<div class="tabs">
<button class="btn btn-primary" onclick="showTab('customs')" id="tabCustoms">🎊 习俗</button>
<button class="btn btn-secondary" onclick="showTab('zongzi')" id="tabZongzi">🫔 粽子</button>
<button class="btn btn-secondary" onclick="showTab('history')" id="tabHistory">📖 屈原</button>
<button class="btn btn-secondary" onclick="showTab('quiz')" id="tabQuiz">🧩 知识问答</button>
</div>

<div id="customsView">
<div class="custom-list" id="customList"></div>
</div>
<div id="zongziView" class="hidden"><div class="zongzi-grid" id="zongziGrid"></div></div>
<div id="historyView" class="hidden"><div class="card"><h3 style="margin-bottom:10px">📖 屈原投江的故事</h3><div class="history-text"><p>屈原（约公元前340年—公元前278年），战国时期楚国诗人、政治家。他创立了"楚辞"文体，代表作有《离骚》《九歌》《天问》等。</p><p>屈原忠心为国，却遭到奸臣陷害，被楚怀王流放。公元前278年，秦国攻破楚国都城郢都，屈原悲愤交加，于农历五月初五投汨罗江自尽。</p><p>当地百姓闻讯后纷纷划船去打捞屈原遗体，并将饭团投入江中，以免鱼虾啃食屈原身体。后来逐渐演变为赛龙舟和吃粽子的习俗。</p><p>2009年，中国端午节被联合国教科文组织列入人类非物质文化遗产代表作名录。</p></div></div></div>
<div id="quizView" class="hidden"><div class="card quiz-area" id="quizArea"></div></div>
</div>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script src="../i18n.js" defer></script>
<script>
var customs=[
{name:'赛龙舟',icon:'🐉',desc:'多人划龙舟竞渡，纪念屈原的水上运动',detail:'赛龙舟相传是楚国百姓划船寻找屈原遗体的演变。龙舟狭长，船头雕有龙头，船尾有龙尾。比赛时鼓手在船头击鼓，划手跟随鼓点整齐划桨。现代龙舟赛已发展为国际性体育赛事。'},
{name:'吃粽子',icon:'🫔',desc:'用竹叶包裹糯米蒸制的食品',detail:'粽子是端午节最重要的食品。北方多甜粽（红枣、豆沙），南方多咸粽（鲜肉、蛋黄）。粽子的包法各地不同：三角粽、四角粽、枕头粽等。'},
{name:'挂艾草',icon:'🌿',desc:'在门上悬挂艾草和菖蒲，驱邪避瘟',detail:'艾草和菖蒲都有特殊香气，古人认为可以驱邪避瘟、防蚊虫。端午时节正值仲夏，蚊虫增多，挂艾草也有实际的卫生作用。'},
{name:'饮雄黄酒',icon:'🍶',desc:'端午饮用雄黄酒，驱毒避邪',detail:'雄黄酒是用雄黄粉末泡制的酒。古人认为雄黄可以克制蛇、蝎等毒虫。民间有"饮了雄黄酒，病魔都远走"的谚语。《白蛇传》中白娘子就是在喝了雄黄酒后现出原形。'},
{name:'佩香囊',icon:'👝',desc:'佩戴装有草药的香囊，驱虫辟邪',detail:'端午香囊内装有朱砂、雄黄、香药等，外包以丝布，清香四溢。香囊形状各异，有圆形、方形、椭圆形等。年轻人还会将香囊作为定情信物互相赠送。'},
{name:'系五彩绳',icon:'🧵',desc:'在手腕脚腕系五色丝线，祈福辟邪',detail:'五彩绳由青、红、白、黑、黄五种颜色的丝线编织而成，代表五行。端午节系在儿童的手腕和脚腕上，等到端午后的第一场雨时取下扔进雨水中，寓意将疾病和灾难冲走。'}
];
var zongzi=[
{emoji:'🫔',name:'甜粽（北方）',desc:'红枣、豆沙馅，蘸白糖吃'},
{emoji:'🫔',name:'咸粽（南方）',desc:'鲜肉、蛋黄馅，口味丰富'},
{emoji:'🫔',name:'碱水粽',desc:'加入碱水，口感Q弹，蘸蜂蜜吃'},
{emoji:'🫔',name:'裹蒸粽',desc:'广东肇庆特色，体型巨大'},
{emoji:'🫔',name:'嘉兴肉粽',desc:'浙江名粽，肥瘦相间'},
{emoji:'🫔',name:'枕头粽',desc:'广西特色，形如枕头'}
];
var quizData=[
{q:'端午节是农历几月初几？',opts:['五月初五','六月初六','七月初七','八月初八'],ans:0},
{q:'赛龙舟是为了纪念哪位诗人？',opts:['李白','杜甫','屈原','苏轼'],ans:2},
{q:'粽子的主要原料是什么？',opts:['大米','糯米','小米','黑米'],ans:1},
{q:'端午节挂艾草的主要目的是什么？',opts:['装饰','驱邪避瘟','祈福','纪念'],ans:1},
{q:'雄黄酒有什么传统功效？',opts:['美容养颜','驱毒避邪','延年益寿','强身健体'],ans:1},
{q:'端午节在哪一年被列入联合国非遗？',opts:['2008年','2009年','2010年','2011年'],ans:1},
{q:'屈原的代表作是什么？',opts:['诗经','离骚','楚辞','论语'],ans:1},
{q:'五彩绳代表什么？',opts:['五行','五谷','五福','五方'],ans:0}
];
var quizIdx=0,quizScore=0,quizAnswered=false;

function startRace(){
  var boats=document.querySelectorAll('.boat');
  boats.forEach(function(b){
    b.style.transition='all 2s ease';
    b.style.left=Math.floor(Math.random()*60+30)+'%';
  });
  var names=['🐉','🐲','🐉'];
  var winner=Math.floor(Math.random()*3);
  setTimeout(function(){
    document.getElementById('raceResult').textContent='🏆 '+names[winner]+' 获胜！恭喜冠军！';
    setTimeout(function(){boats.forEach(function(b){b.style.left='0%'})},3000);
  },2200);
}

function showTab(tab){
  ['customsView','zongziView','historyView','quizView'].forEach(function(v){document.getElementById(v).classList.add('hidden')});
  document.getElementById(tab+'View').classList.remove('hidden');
  ['tabCustoms','tabZongzi','tabHistory','tabQuiz'].forEach(function(id){document.getElementById(id).className='btn btn-secondary'});
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).className='btn btn-primary';
  if(tab==='quiz'&&quizIdx===0)renderQuiz();
}

function renderCustoms(){
  var h='';
  customs.forEach(function(c,i){
    h+='<div class="custom-item" onclick="toggleDetail('+i+')">';
    h+='<div class="custom-header"><span class="custom-icon">'+c.icon+'</span><div><div class="custom-name">'+c.name+'</div><div class="custom-desc">'+c.desc+'</div></div></div>';
    h+='<div class="custom-detail" id="cd-'+i+'">'+c.detail+'</div></div>';
  });
  document.getElementById('customList').innerHTML=h;
}

function toggleDetail(idx){
  var el=document.getElementById('cd-'+idx);
  if(el)el.classList.toggle('show');
}

function renderZongzi(){
  var h='';
  zongzi.forEach(function(z){
    h+='<div class="zongzi-item"><div class="zongzi-emoji">'+z.emoji+'</div><div class="zongzi-name">'+z.name+'</div><div class="zongzi-desc">'+z.desc+'</div></div>';
  });
  document.getElementById('zongziGrid').innerHTML=h;
}

function renderQuiz(){
  if(quizIdx>=quizData.length){
    document.getElementById('quizArea').innerHTML='<h3>🎉 答题结束！</h3><p style="font-size:1.2rem;margin:16px 0">得分：'+quizScore+'/'+quizData.length+'</p><button class="btn btn-primary" onclick="resetQuiz()">🔄 重新开始</button>';
    return;
  }
  var q=quizData[quizIdx];
  var h='<div class="quiz-q">第'+(quizIdx+1)+'题（共'+quizData.length+'题）：'+q.q+'</div><div class="quiz-options">';
  q.opts.forEach(function(o,i){h+='<div class="quiz-opt" onclick="answerQuiz('+i+','+q.ans+')">'+o+'</div>'});
  h+='</div><div class="quiz-score">当前得分：'+quizScore+'</div>';
  document.getElementById('quizArea').innerHTML=h;
}

function answerQuiz(sel,correct){
  if(quizAnswered)return;
  quizAnswered=true;
  var opts=document.querySelectorAll('.quiz-opt');
  opts[correct].classList.add('correct');
  if(sel!==correct)opts[sel].classList.add('wrong');
  else quizScore++;
  setTimeout(function(){quizIdx++;quizAnswered=false;renderQuiz()},1200);
}

function resetQuiz(){quizIdx=0;quizScore=0;quizAnswered=false;renderQuiz()}

function toggleTheme(){
  var html=document.documentElement;
  var isLight=html.getAttribute('data-theme')==='light';
  html.setAttribute('data-theme',isLight?'dark':'light');
  document.getElementById('themeBtn').textContent=isLight?'☀️ 亮色':'🌙 暗色';
}

renderCustoms();renderZongzi();
window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});
</script>
</body>
</html>
