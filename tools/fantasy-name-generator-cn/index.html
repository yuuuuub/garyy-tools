<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玄幻名字生成器</title><meta name="description" content="生成玄幻小说风格的中文名字，适用于角色、笔名、网名"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#a855f7}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:20px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.options{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.options select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem}.btn{display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.btn:hover{opacity:.85}.btn-secondary{background:var(--border);color:var(--text)}.actions{display:flex;gap:8px;justify-content:center;margin-top:16px}.result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center;margin-top:16px}.name-display{font-size:2rem;font-weight:700;color:var(--accent);margin:12px 0}.name-title{font-size:1rem;color:var(--text2);margin-top:4px}.name-desc{color:var(--text2);font-size:.9rem;line-height:1.6;margin-top:8px}.name-tags{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}.name-tag{padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:.75rem;color:var(--text2)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}.grid-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:transform .2s}.grid-item:hover{transform:translateY(-2px)}.grid-name{font-size:1.3rem;font-weight:700;color:var(--accent)}.grid-title{font-size:.8rem;color:var(--text2);margin-top:4px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}</style><meta name="robots" content="index, follow"><meta property="og:title" content="玄幻名字生成器"><meta property="og:description" content="生成玄幻小说风格的中文名字"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>⚔️ 玄幻名字生成器</h1><p class="sub">生成玄幻小说风格的中文名字</p>
<div class="card">
<div class="options">
<select id="realm"><option value="cultivator">修仙者</option><option value="martial">武侠</option><option value="demon">魔族</option><option value="deity">神族</option><option value="ancient">上古</option></select>
<select id="gender"><option value="male">男</option><option value="female">女</option><option value="any">不限</option></select>
<select id="power"><option value="sword">剑修</option><option value="fire">火系</option><option value="ice">冰系</option><option value="nature">自然</option><option value="shadow">暗影</option><option value="light">光系</option></select>
</div>
<div class="actions"><button class="btn" onclick="generate()">🎲 生成名字</button><button class="btn btn-secondary" onclick="generateBatch()">📋 批量生成</button></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
(function(){
var surnames=['慕容','上官','欧阳','司马','东方','独孤','南宫','西门','北冥','轩辕','云','叶','萧','楚','林','苏','白','寒','冷','墨','风','夜','星','月','霜','雪','冰','雷','焰','岚','渊','昊','玄','凌','苍','尘'];
var maleNames=['天行','逸尘','无极','破军','玄策','青云','剑心','傲天','凌云','逐日','星辰','破晓','惊鸿','凌霄','飞羽','惊雷','焚天','灭世','弑神','天怒','苍穹','混沌','太虚','鸿蒙','永恒','不朽','战天','逆天','问道','归元'];
var femaleNames=['清雪','紫萱','雨薇','梦蝶','冰凝','月华','花解语','雪见','夕颜','若兰','紫烟','青霞','碧落','天音','瑶光','霓裳','飞仙','碧霄','凝霜','素心','清漪','云裳','灵犀','若雪','幻月','冰魄','紫电','青霜','星河','月影'];
var titles={cultivator:['真人','道君','仙尊','大帝','圣人','天尊','真人','老祖','宗师','掌门'],martial:['大侠','剑客','宗师','掌门','帮主','盟主','豪杰','英雄','隐士','游侠'],demon:['魔君','魔尊','魔帝','魔主','魔王','妖皇','邪帝','暗主','血王','冥王'],deity:['天帝','天君','天尊','神王','神君','神尊','圣母','帝君','真神','主神'],ancient:['古皇','古帝','古祖','远古大能','太古强者','上古圣人','洪荒老祖','混沌魔神','创世神','不朽者']};
var powerNames={sword:['剑魂','剑圣','剑仙','剑魔','万剑归宗','一剑破万法','剑意通天','剑气纵横','御剑飞仙','以剑入道'],fire:['炎帝','火神','焚天','烈焰','赤炎','火舞','炎魔','炽焰','烈火焚天','火海无边'],ice:['冰皇','寒帝','冰魄','霜降','玄冰','冰心','寒冰','霜华','冰封万里','绝对零度'],nature:['木灵','花仙','森之子','绿意','生命之源','万物生长','大地之母','草木皆兵','花开花落','生生不息'],shadow:['暗影','夜帝','暗夜','幽冥','影杀','暗杀','潜行','幻影','暗夜猎手','影子刺客'],light:['光明','圣光','天照','日耀','光之子','光辉','圣辉','光芒万丈','普照天下','光之裁决']};
function generate(){
var realm=document.getElementById('realm').value;
var gender=document.getElementById('gender').value;
var power=document.getElementById('power').value;
var g=gender==='any'?(Math.random()>.5?'male':'female'):gender;
var surname=surnames[Math.floor(Math.random()*surnames.length)];
var name=g==='male'?maleNames[Math.floor(Math.random()*maleNames.length)]:femaleNames[Math.floor(Math.random()*femaleNames.length)];
var title=titles[realm][Math.floor(Math.random()*titles[realm].length)];
var powerName=powerNames[power][Math.floor(Math.random()*powerNames[power].length)];
var realmNames={cultivator:'修仙界',martial:'武侠界',demon:'魔界',deity:'神界',ancient:'上古'};
document.getElementById('result').innerHTML='<div class="result-card"><div class="name-display">'+surname+name+'</div><div class="name-title">「'+title+'」· '+realmNames[realm]+' · '+powerName+'</div><div class="name-desc">此名蕴含大道至理，'+surname+name+'，'+title+'之姿，修'+powerName+'之道，威震'+realmNames[realm]+'！</div><div class="name-tags"><span class="name-tag">'+realmNames[realm]+'</span><span class="name-tag">'+title+'</span><span class="name-tag">'+powerName+'</span></div></div>';
}
function generateBatch(){
var realm=document.getElementById('realm').value;
var gender=document.getElementById('gender').value;
var power=document.getElementById('power').value;
var g=gender==='any'?(Math.random()>.5?'male':'female'):gender;
var realmNames={cultivator:'修仙',martial:'武侠',demon:'魔族',deity:'神族',ancient:'上古'};
var names=[];var used={};
while(names.length<8){
var surname=surnames[Math.floor(Math.random()*surnames.length)];
var name=g==='male'?maleNames[Math.floor(Math.random()*maleNames.length)]:femaleNames[Math.floor(Math.random()*femaleNames.length)];
var full=surname+name;
if(!used[full]){used[full]=true;names.push(full);}
}
var html='<div class="grid">';
names.forEach(function(n){html+='<div class="grid-item"><div class="grid-name">'+n+'</div><div class="grid-title">'+realmNames[realm]+'</div></div>';});
html+='</div>';
document.getElementById('result').innerHTML=html;
}
})();
</script></body></html>
