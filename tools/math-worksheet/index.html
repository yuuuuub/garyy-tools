<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔢 数学练习生成器</title>
<meta property="og:title" content="🔢 数学练习生成器">
<meta property="og:description" content="🔢 数学练习生成器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="数学练习生成器 - 自动生成加减乘除练习题，支持难度选择和错题本">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3b82f6;--green:#238636;--red:#ef4444;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,button,select{font-family:inherit;font-size:.95rem}
input[type=number],select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;width:100%}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}
.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.question{padding:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.question:last-child{border-bottom:none}
.question .num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.question .expr{flex:1;font-size:1.1rem;font-family:'SF Mono',monospace}
.question input{width:100px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);text-align:center}
.question .result{font-weight:700}
.question .correct{color:var(--success)}
.question .wrong{color:var(--danger)}
.question .missed{color:var(--warn)}
.hidden{display:none}
.op-btn{display:inline-block;padding:6px 14px;border-radius:8px;cursor:pointer;background:var(--bg);border:2px solid var(--border);color:var(--text);transition:all .2s;font-weight:600}
.op-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🔢 数学练习生成器</h1><p>自动生成算术练习，提升计算能力</p></div>

<div class="cd">
<h2>练习设置</h2>
<label>运算类型</label>
<div class="bg" id="opSelect">
<span class="op-btn active" onclick="toggleOp(this,'+')">➕ 加法</span>
<span class="op-btn active" onclick="toggleOp(this,'-')">➖ 减法</span>
<span class="op-btn" onclick="toggleOp(this,'×')">✖️ 乘法</span>
<span class="op-btn" onclick="toggleOp(this,'÷')">➗ 除法</span>
</div>
<div class="fr" style="margin-top:12px">
<div><label>题目数量</label><input type="number" id="count" value="10" min="5" max="50"></div>
<div><label>难度等级</label><select id="difficulty"><option value="1">简单（1-10）</option><option value="2" selected>中等（1-50）</option><option value="3">较难（1-100）</option><option value="4">挑战（1-999）</option></select></div>
</div>
<div class="bg"><button onclick="generate()">生成练习</button></div>
</div>

<div id="worksheet" class="cd hidden">
<h2>练习题</h2>
<div id="questions"></div>
<div class="bg" style="margin-top:16px">
<button onclick="checkAnswers()">✅ 批改</button>
<button class="sec" onclick="showAnswers()">👁 查看答案</button>
<button class="sec" onclick="printSheet()">🖨 打印</button>
</div>
</div>

<div id="resultArea" class="cd hidden">
<h2>批改结果</h2>
<div class="gr" style="margin-bottom:16px">
<div class="st"><div class="nm" id="totalQ">0</div><div class="lb">总题数</div></div>
<div class="st"><div class="nm" id="correctQ" style="color:var(--success)">0</div><div class="lb">正确</div></div>
<div class="st"><div class="nm" id="wrongQ" style="color:var(--danger)">0</div><div class="lb">错误</div></div>
<div class="st"><div class="nm" id="scoreQ" style="color:var(--accent)">0%</div><div class="lb">得分</div></div>
</div>
<div id="wrongList"></div>
</div>

<div class="cd">
<h2>错题本</h2>
<div id="errorBook" class="es">暂无错题</div>
<div class="bg"><button class="sec" onclick="exportErrors()">导出错题</button><button class="dng" onclick="clearErrors()">清空错题本</button></div>
</div>
</div>

<script>
let activeOps=new Set(['+','-']),questions=[],errorBook=[];
function $(id){return document.getElementById(id)}
function load(){try{return JSON.parse(localStorage.getItem('math-worksheet-errors'))||[]}catch(e){return[]}}
function save(){localStorage.setItem('math-worksheet-errors',JSON.stringify(errorBook))}
errorBook=load();

function toggleOp(el,op){el.classList.toggle('active');if(activeOps.has(op))activeOps.delete(op);else activeOps.add(op)}

function generate(){
  if(!activeOps.size)return alert('请至少选择一种运算');
  const count=parseInt($('count').value),diff=parseInt($('difficulty').value),max=diff===1?10:diff===2?50:diff===3?100:999;
  questions=[];
  for(let i=0;i<count;i++){
    const op=[...activeOps][Math.floor(Math.random()*activeOps.size)];
    let a,b,answer;
    if(op==='÷'){b=Math.floor(Math.random()*12)+1;answer=Math.floor(Math.random()*20)+1;a=b*answer}
    else{a=Math.floor(Math.random()*max)+1;b=Math.floor(Math.random()*max)+1;if(op==='-'&&a<b)[a,b]=[b,a];answer=op==='+'?a+b:op==='-'?a-b:a*b}
    questions.push({a,b,op,answer,userAnswer:null,correct:null});
  }
  renderQuestions();$('worksheet').classList.remove('hidden');$('resultArea').classList.add('hidden');
}

function renderQuestions(){
  $('questions').innerHTML=questions.map((q,i)=>
    '<div class="question" id="q'+i+'"><span class="num">'+(i+1)+'</span><span class="expr">'+q.a+' '+q.op+' '+q.b+' = </span><input type="number" id="ans'+i+'" placeholder="?" onkeydown="if(event.key===\'Enter\')document.getElementById(\'ans'+Math.min(i+1,questions.length-1)+'\').focus()"></div>'
  ).join('');
}

function checkAnswers(){
  let correct=0,wrong=0;
  questions.forEach((q,i)=>{
    const val=parseInt($('ans'+i).value);
    q.userAnswer=isNaN(val)?null:val;
    q.correct=q.userAnswer===q.answer;
    const el=$('q'+i);
    if(q.correct){correct++;el.querySelector('input').style.borderColor='var(--success)'}
    else{wrong++;el.querySelector('input').style.borderColor='var(--danger)';
      if(!errorBook.find(e=>e.expr===q.a+' '+q.op+' '+q.b)){errorBook.push({expr:q.a+' '+q.op+' '+q.b,answer:q.answer,userAns:q.userAnswer,date:new Date().toLocaleDateString()})}
    }
  });
  save();renderErrorBook();
  $('totalQ').textContent=questions.length;$('correctQ').textContent=correct;$('wrongQ').textContent=wrong;
  $('scoreQ').textContent=Math.round(correct/questions.length*100)+'%';
  $('resultArea').classList.remove('hidden');
  if(correct===questions.length)playSound(true);else playSound(false);
}

function showAnswers(){
  questions.forEach((q,i)=>{$('ans'+i).value=q.answer;$('ans'+i).style.borderColor='var(--accent)'});
}

function printSheet(){const w=window.open('','','width=800,height=600');w.document.write('<html><head><title>数学练习</title><style>body{font-family:sans-serif;padding:20px}.q{padding:8px 0;border-bottom:1px solid #ccc}input{border:1px solid #999;padding:4px;width:80px;margin-left:8px}</style></head><body><h2>数学练习题</h2>'+questions.map((q,i)=>'<div class="q">'+(i+1)+'. '+q.a+' '+q.op+' '+q.b+' = <input type="text"></div>').join('')+'</body></html>');w.document.close();w.print()}

function playSound(ok){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?520:200;g.gain.value=0.2;o.start();o.stop(ctx.currentTime+.3)}catch(e){}}

function renderErrorBook(){
  if(!errorBook.length){$('errorBook').innerHTML='<div class="es">暂无错题</div>';return}
  $('errorBook').innerHTML=errorBook.map((e,i)=>
    '<div class="question"><span class="expr" style="font-size:1rem">'+e.expr+' = <span class="correct">'+e.answer+'</span></span>'+(e.userAns!==null?'<span class="wrong">你的答案: '+e.userAns+'</span>':'')+'<button class="dng" style="padding:2px 8px;font-size:.7rem" onclick="errorBook.splice('+i+',1);save();renderErrorBook()">删除</button></div>'
  ).join('');
}

function exportErrors(){
  if(!errorBook.length)return alert('暂无错题');
  const text=errorBook.map(e=>e.expr+' = '+e.answer+(e.userAns!==null?' (你的答案: '+e.userAns+')':'')).join('\n');
  const blob=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='错题本.txt';a.click();
}

function clearErrors(){if(confirm('确定清空错题本？')){errorBook=[];save();renderErrorBook()}}
renderErrorBook();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
