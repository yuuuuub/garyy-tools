<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盈亏平衡分析</title>
<meta name="description" content="盈亏平衡分析工具，计算保本销量和保本销售额">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vhscroll-behavior:smooth;padding:16px;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.form-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.result-big{text-align:center;padding:18px}
.result-big .label{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.result-big .value{font-size:2rem;font-weight:700}
.result-big .value.green{color:var(--green)}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.stat-card{text-align:center;padding:14px;background:var(--bg);border-radius:var(--radius)}
.stat-card .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:1.1rem;font-weight:700}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.detail-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
.detail-table th,.detail-table td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}
.detail-table th{color:var(--text2);font-weight:500;background:var(--bg)}
.detail-table td:first-child,.detail-table th:first-child{text-align:left}
.detail-table tr:last-child td{border-bottom:none}
.table-wrap{max-height:350px;overflow-y:auto}
.chart-bar-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.chart-bar-row .label{min-width:70px;font-size:.75rem;color:var(--text2)}
.chart-bar-row .bar-track{flex:1;height:16px;background:var(--bg);border-radius:4px;overflow:hidden}
.chart-bar-row .bar-fill{height:100%;border-radius:4px;transition:width .5s}
.chart-bar-row .val{min-width:60px;text-align:right;font-size:.75rem;font-weight:600}
.preset-group{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.preset-btn{padding:4px 12px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;background:var(--card);color:var(--text);cursor:pointer;transition:all .2s}
.preset-btn:hover{border-color:var(--blue);color:var(--blue)}
.be-chart{position:relative;height:220px;border-left:2px solid var(--border);border-bottom:2px solid var(--border);margin:20px 10px 10px 60px}
.be-chart .axis-label{position:absolute;font-size:.7rem;color:var(--text2)}
.be-chart .line{position:absolute;height:2px;transform-origin:left center}
.be-chart .dot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%)}
.be-chart .dot-label{position:absolute;font-size:.7rem;font-weight:600;transform:translate(-50%,-18px);white-space:nowrap}
@media(max-width:640px){.form-row{flex-direction:column}.grid-3{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="盈亏平衡分析">
<meta property="og:description" content="盈亏平衡分析工具，计算保本销量和保本销售额">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/break-even-analyzer/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📊 盈亏平衡分析</h1>
    <p>计算保本销量和保本销售额</p>
  </header>

  <div class="card">
    <div class="form-row">
      <div class="group">
        <label>固定成本 (元/月)</label>
        <input type="number" id="fixedCost" value="50000" min="0" step="any">
      </div>
      <div class="group">
        <label>单位售价 (元)</label>
        <input type="number" id="unitPrice" value="100" min="0" step="any">
      </div>
    </div>
    <div class="form-row">
      <div class="group">
        <label>单位变动成本 (元)</label>
        <input type="number" id="varCost" value="40" min="0" step="any">
      </div>
      <div class="group">
        <label>预计月销量 (件)</label>
        <input type="number" id="expectedSales" value="1500" min="0" step="1">
      </div>
    </div>
    <div class="preset-group" id="presets"></div>
  </div>

  <div class="card">
    <div class="section-title">📊 保本点</div>
    <div class="result-big" id="mainResult"></div>
    <div class="grid-3" id="statGrid"></div>
  </div>

  <div class="card">
    <div class="section-title">📈 盈亏平衡图</div>
    <div class="be-chart" id="beChart"></div>
  </div>

  <div class="card">
    <div class="section-title">📋 情景分析</div>
    <div class="table-wrap"><table class="detail-table" id="scenarioTable"></table></div>
  </div>

  <div class="card">
    <div class="section-title">📊 关键指标</div>
    <div id="bars"></div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtInt=n=>n.toLocaleString('zh-CN');

const presets=[
  {name:'零售业',fixedCost:30000,unitPrice:50,varCost:30,expectedSales:2000},
  {name:'制造业',fixedCost:200000,unitPrice:500,varCost:300,expectedSales:1500},
  {name:'服务业',fixedCost:15000,unitPrice:200,varCost:60,expectedSales:300},
  {name:'SaaS',fixedCost:100000,unitPrice:299,varCost:30,expectedSales:500}
];

function renderPresets(container,items){
  container.innerHTML=items.map(p=>`<button class="preset-btn" onclick="applyPreset(${JSON.stringify(p).replace(/"/g,'&quot;')})">${p.name}</button>`).join('');
}

window.applyPreset=function(p){
  $('fixedCost').value=p.fixedCost;
  $('unitPrice').value=p.unitPrice;
  $('varCost').value=p.varCost;
  $('expectedSales').value=p.expectedSales;
  calc();
};

function calc(){
  const fixedCost=+$('fixedCost').value||0;
  const unitPrice=+$('unitPrice').value||0;
  const varCost=+$('varCost').value||0;
  const expectedSales=+$('expectedSales').value||0;

  const contributionMargin=unitPrice-varCost;
  const beUnits=contributionMargin>0?Math.ceil(fixedCost/contributionMargin):Infinity;
  const beRevenue=contributionMargin>0?beUnits*unitPrice:Infinity;
  const marginPct=unitPrice>0?(contributionMargin/unitPrice*100):0;
  const safetyMargin=expectedSales-beUnits;
  const safetyPct=expectedSales>0?(safetyMargin/expectedSales*100):0;
  const expectedProfit=(unitPrice-varCost)*expectedSales-fixedCost;

  $('mainResult').innerHTML=`
    <div class="label">保本销量</div>
    <div class="value green">${beUnits===Infinity?'∞':fmtInt(beUnits)} 件</div>
  `;
  $('statGrid').innerHTML=`
    <div class="stat-card"><div class="label">保本销售额</div><div class="value" style="color:var(--gold)">¥${beRevenue===Infinity?'∞':fmt(beRevenue)}</div></div>
    <div class="stat-card"><div class="label">安全边际</div><div class="value" style="color:${safetyMargin>=0?'var(--green)':'var(--red)'}">${fmtInt(safetyMargin)} 件</div></div>
    <div class="stat-card"><div class="label">预计利润</div><div class="value" style="color:${expectedProfit>=0?'var(--green)':'var(--red)'}">¥${fmt(expectedProfit)}</div></div>
  `;

  const maxSales=Math.max(beUnits*2,expectedSales,100);
  const chartW=500,chartH=220;
  const totalRevAtMax=maxSales*unitPrice;
  const totalCostAtMax=fixedCost+maxSales*varCost;
  const maxVal=Math.max(totalRevAtMax,totalCostAtMax,1);
  const pxX=s=>(s/maxSales*100);
  const pxY=v=>(1-v/maxVal*100);

  const revLine=`left:${pxX(0)}%;top:${pxY(0)}%;width:${Math.sqrt(Math.pow(100,2)+Math.pow(pxY(0)-pxY(totalRevAtMax),2))}%;transform:rotate(${Math.atan2(pxY(totalRevAtMax)-pxY(0),100-pxX(0))*180/Math.PI}deg);background:var(--blue)`;
  const costLine=`left:${pxX(0)}%;top:${pxY(fixedCost)}%;width:${Math.sqrt(Math.pow(100,2)+Math.pow(pxY(fixedCost)-pxY(totalCostAtMax),2))}%;transform:rotate(${Math.atan2(pxY(totalCostAtMax)-pxY(fixedCost),100)*180/Math.PI}deg);background:var(--red)`;

  let dotHtml='';
  if(beUnits!==Infinity&&beUnits<=maxSales){
    const dotPctX=pxX(beUnits);
    const dotPctY=pxY(beUnits*unitPrice);
    dotHtml=`<div class="dot" style="left:${dotPctX}%;top:${dotPctY}%;background:var(--green)"></div>
    <div class="dot-label" style="left:${dotPctX}%;top:${dotPctY}%;color:var(--green)">保本点</div>`;
  }

  $('beChart').innerHTML=`
    <div class="axis-label" style="left:-50px;top:-10px">收入/成本</div>
    <div class="axis-label" style="right:0;bottom:-18px">销量</div>
    <div class="line" style="${revLine}"></div>
    <div class="line" style="${costLine}"></div>
    ${dotHtml}
    <div style="display:flex;gap:16px;margin-top:8px;justify-content:center;font-size:.75rem">
      <span style="color:var(--blue)">━ 收入</span>
      <span style="color:var(--red)">━ 总成本</span>
      <span style="color:var(--green)">● 保本点</span>
    </div>
  `;

  const multiples=[0.5,0.75,1,1.25,1.5];
  let tHead=`<tr><th>销量倍数</th><th>销量</th><th>收入</th><th>成本</th><th>利润</th></tr>`;
  let tRows=multiples.map(m=>{
    const vol=Math.round(beUnits*m);
    const rev=vol*unitPrice;
    const cost=fixedCost+vol*varCost;
    const profit=rev-cost;
    return `<tr><td>${(m*100).toFixed(0)}%</td><td>${fmtInt(vol)}</td><td>¥${fmt(rev)}</td><td>¥${fmt(cost)}</td><td style="color:${profit>=0?'var(--green)':'var(--red)'}">¥${fmt(profit)}</td></tr>`;
  }).join('');
  $('scenarioTable').innerHTML=tHead+tRows;

  const maxValBar=Math.max(revenueAtBe=beUnits*unitPrice,fixedCost,1);
  $('bars').innerHTML=`
    <div class="chart-bar-row"><div class="label">固定成本</div><div class="bar-track"><div class="bar-fill" style="width:${fixedCost/maxValBar*100}%;background:var(--red)"></div></div><div class="val" style="color:var(--red)">¥${fmtInt(fixedCost)}</div></div>
    <div class="chart-bar-row"><div class="label">贡献毛利</div><div class="bar-track"><div class="bar-fill" style="width:${contributionMargin*beUnits/maxValBar*100}%;background:var(--green)"></div></div><div class="val" style="color:var(--green)">¥${fmtInt(contributionMargin*beUnits)}</div></div>
    <div style="text-align:center;font-size:.75rem;color:var(--text2);margin-top:8px">贡献毛利率 ${marginPct.toFixed(1)}% | 安全边际率 ${safetyPct.toFixed(1)}% | ${safetyPct>=20?'✅ 安全':'⚠️ 需关注'}</div>
  `;
}
renderPresets($('presets'),presets);
[$('fixedCost'),$('unitPrice'),$('varCost'),$('expectedSales')].forEach(el=>{el.addEventListener('input',calc);el.addEventListener('change',calc)});
calc();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
