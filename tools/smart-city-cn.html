<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏙️ 智能城市综合管理</title>
<meta name="description" content="智能城市综合管理面板，监控城市运行状态、资源调度、应急指挥">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:1100px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.metric{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.metric .icon{font-size:2rem;margin-bottom:6px}
.metric .val{font-size:1.5rem;font-weight:700;color:var(--accent)}
.metric .label{font-size:.8rem;color:var(--text2);margin-top:2px}
.metric .trend{font-size:.75rem;margin-top:4px}
.metric .trend.up{color:var(--success)}
.metric .trend.down{color:var(--danger)}
.status-bar{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.status-item{flex:1;min-width:120px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:.85rem}
.status-item .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.green{background:var(--success)}.dot.yellow{background:var(--warn)}.dot.red{background:var(--danger)}
.alert-list{max-height:200px;overflow-y:auto}
.alert-item{display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--border);font-size:.85rem}
.alert-item:last-child{border-bottom:none}
.alert-time{color:var(--text2);min-width:80px;font-size:.8rem}
.alert-badge{padding:2px 8px;border-radius:10px;font-size:.75rem;font-weight:600;margin-right:8px}
.badge-info{background:rgba(59,130,246,.2);color:var(--accent)}
.badge-warn{background:rgba(245,158,11,.2);color:var(--warn)}
.badge-danger{background:rgba(239,68,68,.2);color:var(--danger)}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:3px;transition:width .5s}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.8rem;transition:all .2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chart-area{height:150px;background:var(--bg);border:1px solid var(--border);border-radius:8px;position:relative;overflow:hidden}
.chart-bar{position:absolute;bottom:0;background:var(--accent);border-radius:4px 4px 0 0;transition:height .5s}
canvas{width:100%;height:150px;border-radius:8px}
.btn{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-size:.85rem}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:4px 10px;font-size:.8rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 2s infinite}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏙️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🏙️ 智能城市综合管理">
<meta property="og:description" content="智能城市综合管理面板，监控城市运行状态、资源调度、应急指挥">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏙️ 智能城市综合管理</h1><p>实时监控城市运行状态，智能调度资源，高效应急指挥</p></div>

<div class="cd">
<h2>📊 城市核心指标</h2>
<div class="grid" id="coreMetrics"></div>
</div>

<div class="cd">
<h2>🔔 实时告警</h2>
<div class="tabs" id="alertTabs"></div>
<div class="alert-list" id="alertList"></div>
</div>

<div class="cd">
<h2>📈 24小时趋势</h2>
<canvas id="trendChart"></canvas>
</div>

<div class="cd">
<h2>🏢 区域状态</h2>
<div class="status-bar" id="districtStatus"></div>
</div>

<div class="cd">
<h2>⚡ 资源调度</h2>
<div id="resourcePanel"></div>
</div>

<div class="cd">
<h2>🚨 应急预案</h2>
<div id="emergencyPanel"></div>
</div>

<div class="cd">
<h2>📋 今日事件</h2>
<div id="eventLog"></div>
</div>
</div>

<script src="i18n.js" defer></script>
<script>
(function(){
var districts=['朝阳区','海淀区','西城区','东城区','丰台区','通州区','大兴区','顺义区'];
var alertTypes=['info','warn','danger'];
var alertMsgs=['交通拥堵指数上升','空气质量预警','水管泄漏检测','用电负荷超标','消防通道占用','垃圾清运延迟','噪音超标提醒','路灯故障报警'];
var resources=[
  {name:'警力部署',icon:'👮',total:1200,used:847},
  {name:'医疗资源',icon:'🏥',total:350,used:218},
  {name:'消防力量',icon:'🚒',total:180,used:42},
  {name:'环卫车辆',icon:'🚛',total:260,used:189},
  {name:'公交车辆',icon:'🚌',total:4500,used:3820},
  {name:'出租车',icon:'🚕',total:8000,used:5230}
];
var emergencies=[
  {level:'🔴',name:'暴雨红色预警',status:'已启动',time:'14:30'},
  {level:'🟡',name:'交通管制预案',status:'待命',time:'-'},
  {level:'🟢',name:'空气质量响应',status:'运行中',time:'08:00'},
  {level:'🟡',name:'食品安全检查',status:'待命',time:'-'},
  {level:'🔴',name:'地震应急响应',status:'已启动',time:'14:30'}
];
var events=[];

function genAlerts(n){
  var arr=[];
  for(var i=0;i<n;i++){
    arr.push({
      time:Random.time(24)+':'+Random.int(0,59).toString().padStart(2,'0'),
      type:Random.pick(alertTypes),
      msg:Random.pick(alertMsgs),
      district:Random.pick(districts)
    });
  }
  return arr.sort(function(a,b){return b.time.localeCompare(a.time)});
}

function renderMetrics(){
  var data=[
    {icon:'🌡️',val:Math.round(22+Math.random()*6)+'°C',label:'平均温度',trend:'+0.5°',dir:'up'},
    {icon:'💨',val:Math.round(40+Math.random()*60),label:'AQI指数',trend:'-12',dir:'up'},
    {icon:'🚗',val:Math.round(60+Math.random()*30)+'%',label:'交通拥堵',trend:'+5%',dir:'down'},
    {icon:'⚡',val:Math.round(2800+Math.random()*400)+'MW',label:'用电负荷',trend:'+80MW',dir:'up'},
    {icon:'💧',val:Math.round(95+Math.random()*4)+'%',label:'供水正常率',trend:'+0.2%',dir:'up'},
    {icon:'🗑️',val:Math.round(85+Math.random()*10)+'%',label:'垃圾清运率',trend:'+2%',dir:'up'},
    {icon:'🚌',val:Math.round(92+Math.random()*6)+'%',label:'公交准点率',trend:'-1%',dir:'down'},
    {icon:'🏗️',val:Math.round(15+Math.random()*10),label:'在建工程',trend:'+2',dir:'up'}
  ];
  var h='';
  data.forEach(function(d){
    h+='<div class="metric"><div class="icon">'+d.icon+'</div><div class="val">'+d.val+'</div><div class="label">'+d.label+'</div><div class="trend '+(d.dir==='up'?'up':'down')+'">'+(d.dir==='up'?'↑':'↓')+' '+d.trend+'</div></div>';
  });
  document.getElementById('coreMetrics').innerHTML=h;
}

function renderAlerts(){
  var tabs=['全部','交通','环境','安全','市政'];
  var th='';
  tabs.forEach(function(t,i){th+='<div class="tab'+(i===0?' active':'')+'" onclick="filterAlerts('+i+')">'+t+'</div>'});
  document.getElementById('alertTabs').innerHTML=th;
  events=genAlerts(15);
  showAlerts(events);
}

function filterAlerts(idx){
  var tabs=document.querySelectorAll('#alertTabs .tab');
  tabs.forEach(function(t,i){t.className='tab'+(i===idx?' active':'')});
  if(idx===0){showAlerts(events)}
  else{showAlerts(events.filter(function(e){return e.type===['info','warn','danger'][idx-1]||idx===4}))}
}

function showAlerts(list){
  var h='';
  list.forEach(function(a){
    var badge=a.type==='danger'?'badge-danger':a.type==='warn'?'badge-warn':'badge-info';
    var label=a.type==='danger'?'紧急':a.type==='warn'?'警告':'提示';
    h+='<div class="alert-item"><span class="alert-badge '+badge+'">'+label+'</span><span style="flex:1">'+a.msg+' · '+a.district+'</span><span class="alert-time">'+a.time+'</span></div>';
  });
  document.getElementById('alertList').innerHTML=h;
}

function renderDistricts(){
  var h='';
  districts.forEach(function(d){
    var score=Math.round(60+Math.random()*35);
    var color=score>80?'var(--success)':score>60?'var(--warn)':'var(--danger)';
    h+='<div class="status-item"><strong>'+d+'</strong><div class="progress-bar"><div class="progress-fill" style="width:'+score+'%;background:'+color+'"></div></div><span style="font-size:.75rem;color:var(--text2)">健康度 '+score+'%</span></div>';
  });
  document.getElementById('districtStatus').innerHTML=h;
}

function renderResources(){
  var h='';
  resources.forEach(function(r){
    var pct=Math.round(r.used/r.total*100);
    var color=pct>80?'var(--danger)':pct>60?'var(--warn)':'var(--success)';
    h+='<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:.85rem"><span>'+r.icon+' '+r.name+'</span><span>'+r.used+' / '+r.total+' ('+pct+'%)</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
  });
  document.getElementById('resourcePanel').innerHTML=h;
}

function renderEmergencies(){
  var h='';
  emergencies.forEach(function(e){
    h+='<div style="display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--border);font-size:.85rem"><span style="font-size:1.2rem;margin-right:10px">'+e.level+'</span><span style="flex:1;font-weight:600">'+e.name+'</span><span style="padding:2px 8px;border-radius:10px;font-size:.75rem;background:'+(e.status==='已启动'?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)')+';color:'+(e.status==='已启动'?'var(--danger)':'var(--success)')+'">'+e.status+'</span><span style="color:var(--text2);font-size:.8rem;margin-left:10px">'+e.time+'</span></div>';
  });
  document.getElementById('emergencyPanel').innerHTML=h;
}

function renderEvents(){
  var types=['📡','🚗','🔧','👷','🚨','📊'];
  var msgs=['系统巡检完成','早高峰流量峰值','路灯维修工单','道路施工备案','消防演练通知','日报数据生成'];
  var h='<div style="max-height:150px;overflow-y:auto">';
  for(var i=0;i<8;i++){
    h+='<div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem"><span style="margin-right:8px">'+Random.pick(types)+'</span><span style="flex:1">'+Random.pick(msgs)+'</span><span style="color:var(--text2);font-size:.8rem">'+Random.time(24)+':'+Random.int(0,59).toString().padStart(2,'0')+'</span></div>';
  }
  h+='</div>';
  document.getElementById('eventLog').innerHTML=h;
}

function drawChart(){
  var canvas=document.getElementById('trendChart');
  var ctx=canvas.getContext('2d');
  var W=canvas.width=canvas.offsetWidth;
  var H=canvas.height=150;
  var data=[];
  for(var i=0;i<24;i++) data.push(30+Math.random()*70);
  var max=Math.max.apply(null,data);
  var bw=(W-40)/24;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--border').trim()||'#30363d';
  ctx.fillRect(20,0,W-40,1);
  data.forEach(function(v,i){
    var bh=(v/max)*(H-30);
    var x=20+i*bw;
    ctx.fillStyle=i===Math.floor(new Date().getHours())?'#3b82f6':'#30363d';
    ctx.fillRect(x+2,H-20-bh,bw-4,bh);
  });
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text2').trim()||'#8b949e';
  ctx.font='10px sans-serif';
  for(var i=0;i<24;i+=4){ctx.fillText(i+':00',20+i*bw,H-5)}
}

window.filterAlerts=filterAlerts;

renderMetrics();
renderAlerts();
renderDistricts();
renderResources();
renderEmergencies();
renderEvents();
setTimeout(drawChart,100);
setInterval(function(){renderMetrics()},5000);
})();
</script>
</body>
</html>
