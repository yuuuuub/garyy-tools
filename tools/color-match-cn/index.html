<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>颜色匹配</title>
<meta name="description" content="考验你的色彩辨别能力，点击匹配目标颜色">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px;overflow-x:hidden;scroll-behavior:smoothpadding:16px;}
h1{font-size:1.5rem;margin-bottom:12px;color:#ec4899;text-shadow:0 0 10px #ec489944}
.hud{display:flex;gap:16px;margin-bottom:20px;font-size:0.95rem;color:var(--text2)}
.hud span{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 14px}
.target{width:120px;height:120px;border-radius:16px;border:3px solid var(--border);margin-bottom:16px;transition:all 0.3s;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.label{font-size:1rem;color:var(--text2);margin-bottom:16px}
.grid{display:grid;gap:10px;margin-bottom:20px}
.option-box{width:80px;height:80px;border-radius:12px;border:3px solid var(--border);cursor:pointer;transition:all 0.2s;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.option-box:hover{transform:scale(1.08);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.option-box.correct{border-color:var(--green);transform:scale(1.15);box-shadow:0 0 20px var(--green)}
.option-box.wrong{border-color:var(--red);animation:shake 0.4s}
.option-box.disabled{pointer-events:none;opacity:.6}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:1rem;cursor:pointer;margin-top:8px}
.btn:hover{opacity:.9}
.diff{display:flex;gap:8px;margin-bottom:16px}
.diff button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.9rem}
.diff button.active{border-color:var(--blue);background:var(--blue);color:#fff}
.game-over{text-align:center;padding:30px;background:var(--card);border-radius:12px;border:1px solid var(--border)}
.game-over h2{font-size:1.6rem;margin-bottom:12px}
.game-over .score{font-size:3rem;font-weight:bold;color:#ec4899;margin:12px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>🎨 颜色匹配</h1>
<div class="diff">
<button onclick="setDiff(4)" id="d4" class="active">简单</button>
<button onclick="setDiff(6)" id="d6">中等</button>
<button onclick="setDiff(9)" id="d9">困难</button>
</div>
<div class="hud"><span>轮次: <b id="round">1</b>/10</span><span>得分: <b id="score">0</b></span><span>正确率: <b id="acc">0</b>%</span></div>
<div class="target" id="target"></div>
<div class="label">点击与目标颜色相同的方块</div>
<div class="grid" id="grid"></div>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
<script>
let gridSize=4,round=0,maxRounds=10,score=0,correct=0,total=0,targetColor;

function setDiff(g){gridSize=g;document.querySelectorAll('.diff button').forEach(b=>b.classList.remove('active'));document.getElementById('d'+g).classList.add('active');initGame()}

function randColor(){return`hsl(${Math.floor(Math.random()*360)},${60+Math.floor(Math.random()*30)}%,${40+Math.floor(Math.random()*25)}%)`}

function similarColor(base,offset){const m=base.match(/hsl\((\d+),(\d+)%,(\d+)%\)/);if(!m)return base;const h=(parseInt(m[1])+Math.floor(offset*30))%360;const s=Math.min(100,Math.max(0,parseInt(m[2])+Math.floor(offset*5)));const l=Math.min(90,Math.max(10,parseInt(m[3])+Math.floor(offset*8)));return`hsl(${h},${s}%,${l}%)`}

function initGame(){round=0;score=0;correct=0;total=0;nextRound()}

function nextRound(){
if(round>=maxRounds){showResult();return}
round++;targetColor=randColor();
document.getElementById('target').style.background=targetColor;
document.getElementById('round').textContent=round;
const grid=document.getElementById('grid');
grid.style.gridTemplateColumns=`repeat(${Math.ceil(Math.sqrt(gridSize*gridSize))},80px)`;
grid.innerHTML='';
const colors=[];
for(let i=0;i<gridSize*gridSize;i++){
if(i===0)colors.push(targetColor);
else{const off=(Math.random()-0.5)*0.6;colors.push(similarColor(targetColor,off))}
}
shuffleArray(colors);
colors.forEach((c,i)=>{
const box=document.createElement('div');
box.className='option-box';
box.style.background=c;
box.onclick=()=>check(box,c===targetColor);
grid.appendChild(box);
});
}

function check(box,ok){
document.querySelectorAll('.option-box').forEach(b=>b.classList.add('disabled'));
total++;
if(ok){correct++;score+=gridSize>=6?15:gridSize>=5?10:5;box.classList.add('correct')}
else{box.classList.add('wrong');
document.querySelectorAll('.option-box').forEach(b=>{
const s=b.style.background;if(s===targetColor)b.classList.add('correct');
})}
document.getElementById('score').textContent=score;
document.getElementById('acc').textContent=total?Math.round(correct/total*100):0;
setTimeout(nextRound,800);
}

function showResult(){
const app=document.getElementById('grid');
app.innerHTML=`<div class="game-over"><h2>🎉 游戏结束!</h2><div class="score">${score} 分</div><p style="color:var(--text2)">正确率: ${total?Math.round(correct/total*100):0}% (${correct}/${total})</p><button class="btn" onclick="initGame()">再来一轮</button></div>`;
document.getElementById('target').style.display='none';
document.querySelector('.label').style.display='none';
}

function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
initGame();
</script>
</body>
</html>
