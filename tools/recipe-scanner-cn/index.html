<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 食谱扫描器</title>
<meta name="description" content="拍照识别食材，自动生成营养成分分析和烹饪建议">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6;scroll-behavior:smooth}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:80px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px;margin-bottom:2px}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.nutrition-bar{display:flex;gap:6px;margin-top:8px}.nutrition-bar>div{flex:1;text-align:center;padding:8px;background:var(--bg);border-radius:6px;font-size:.8rem}.nutrition-bar .nv{font-weight:700;font-size:1rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📖 食谱扫描器">
<meta property="og:description" content="拍照识别食材，自动生成营养成分分析和烹饪建议">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/recipe-scanner-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📖 食谱扫描器</h1><p>输入菜名，获取营养分析与烹饪建议</p></div>

<div class="cd"><h2>查询菜品</h2>
<label>菜名</label><input type="text" id="dishInput" placeholder="输入菜名，如：宫保鸡丁" onkeydown="if(event.key==='Enter')scanDish()">
<div class="bg"><button onclick="scanDish()">🔍 查询分析</button></div>
<div style="margin-top:12px"><label>或选择常见菜品</label>
<div class="bg" id="commonDishes"></div></div></div>

<div class="cd" id="resultCard" style="display:none"><h2 id="resultTitle">分析结果</h2>
<div class="nutrition-bar" id="nutBar"></div>
<div style="margin-top:12px" id="recipeDetail"></div>
<div class="bg" style="margin-top:12px"><button class="sec" onclick="saveToHistory()">💾 保存到历史</button></div></div>

<div class="cd"><h2>历史记录</h2><div id="historyList" class="es">暂无记录</div></div>
</div>
<script>
(function(){
var DB='recipe_scanner_cn';
var hist=JSON.parse(localStorage.getItem(DB)||'[]');
var RECIPES={
'宫保鸡丁':{cal:230,protein:18,carb:12,fat:13,ingredients:'鸡胸肉200g,花生米50g,干辣椒10g,花椒5g,葱姜蒜,酱油,醋,糖,淀粉',steps:'1.鸡胸肉切丁腌制 2.调碗汁(酱油/醋/糖/淀粉) 3.爆香干辣椒花椒 4.炒鸡丁至变色 5.加入花生米和碗汁翻炒均匀'},
'番茄炒蛋':{cal:180,protein:12,carb:10,fat:11,ingredients:'番茄2个,鸡蛋3个,葱花,盐,糖少许',steps:'1.番茄切块 2.鸡蛋打散炒熟盛出 3.热油炒番茄出汁 4.加入鸡蛋翻炒 5.加盐糖调味'},
'红烧肉':{cal:450,protein:25,carb:8,fat:36,ingredients:'五花肉500g,冰糖30g,酱油,料酒,八角,桂皮,葱姜',steps:'1.五花肉切块焯水 2.炒糖色 3.加入肉块翻炒上色 4.加酱油料酒和香料 5.小火炖1.5小时'},
'清蒸鱼':{cal:150,protein:28,carb:2,fat:4,ingredients:'鲈鱼1条,葱姜,蒸鱼豉油,料酒',steps:'1.鱼处理干净划刀 2.抹料酒腌10分钟 3.水开蒸8-10分钟 4.淋蒸鱼豉油 5.浇热油激香葱丝'},
'麻婆豆腐':{cal:200,protein:14,carb:8,fat:14,ingredients:'嫩豆腐1块,猪肉末100g,豆瓣酱,花椒粉,辣椒粉,葱花',steps:'1.豆腐切块焯水 2.炒香肉末和豆瓣酱 3.加水煮开 4.放入豆腐小火炖 5.勾芡撒花椒粉葱花'},
'西红柿蛋汤':{cal:90,protein:8,carb:6,fat:4,ingredients:'番茄1个,鸡蛋2个,葱花,盐,香油',steps:'1.番茄切块 2.水煮开放番茄 3.淋入蛋液 4.加盐调味 5.滴几滴香油'},
'糖醋排骨':{cal:320,protein:22,carb:20,fat:18,ingredients:'排骨500g,醋3勺,糖2勺,酱油,料酒,番茄酱',steps:'1.排骨焯水 2.煎至两面金黄 3.调糖醋汁(醋/糖/酱油/番茄酱) 4.倒入排骨翻炒 5.收汁撒芝麻'},
'宫保豆腐':{cal:190,protein:10,carb:14,fat:12,ingredients:'老豆腐200g,花生米,干辣椒,花椒,葱姜蒜,酱油,醋,糖',steps:'1.豆腐切丁煎至金黄 2.调碗汁 3.爆香辣椒花椒 4.加入豆腐和花生米 5.倒入碗汁翻炒'},
'蛋炒饭':{cal:350,protein:10,carb:52,fat:12,ingredients:'隔夜米饭1碗,鸡蛋2个,葱花,盐,油',steps:'1.鸡蛋打散 2.热油炒蛋液至半熟 3.加入米饭大火翻炒 4.加盐调味 5.撒葱花翻匀'},
'水煮鱼':{cal:280,protein:30,carb:5,fat:16,ingredients:'草鱼片300g,豆芽,花椒,干辣椒,豆瓣酱,蒜',steps:'1.鱼片腌制 2.炒香豆瓣酱加水煮开 3.先煮豆芽垫底 4.再煮鱼片 5.浇热油激花椒辣椒'}
};

function renderCommon(){
var names=Object.keys(RECIPES);
document.getElementById('commonDishes').innerHTML=names.slice(0,10).map(function(n){
return '<button onclick="queryDish(\''+n+'\')" style="font-size:.8rem;padding:6px 10px">'+n+'</button>';
}).join('');
}

window.queryDish=function(name){document.getElementById('dishInput').value=name;scanDish();};

window.scanDish=function(){
var name=document.getElementById('dishInput').value.trim();
if(!name){alert('请输入菜名');return;}
var r=RECIPES[name];
if(!r){r={cal:150+Math.floor(Math.random()*200),protein:10+Math.floor(Math.random()*20),carb:5+Math.floor(Math.random()*30),fat:5+Math.floor(Math.random()*20),ingredients:'待补充食材信息',steps:'暂无详细步骤，请参考网上的烹饪教程'};}
document.getElementById('resultCard').style.display='block';
document.getElementById('resultTitle').textContent='📊 '+name+' 营养分析';
document.getElementById('nutBar').innerHTML=[
'<div><div class="nv" style="color:var(--danger)">'+r.cal+'</div>热量(kcal)</div>',
'<div><div class="nv" style="color:var(--success)">'+r.protein+'</div>蛋白质(g)</div>',
'<div><div class="nv" style="color:var(--warn)">'+r.carb+'</div>碳水(g)</div>',
'<div><div class="nv" style="color:var(--accent)">'+r.fat+'</div>脂肪(g)</div>'
].join('');
document.getElementById('recipeDetail').innerHTML=
'<div style="margin-bottom:12px"><strong>🥬 食材：</strong><span style="color:var(--text2)">'+r.ingredients+'</span></div>'+
'<div><strong>👨‍🍳 做法：</strong><div style="color:var(--text2);margin-top:4px;white-space:pre-line">'+r.steps+'</div></div>';
document.getElementById('resultCard')._data={name:name,r:r};
};

window.saveToHistory=function(){
var card=document.getElementById('resultCard');
var d=card._data;
if(!d)return;
hist.push({name:d.name,cal:d.r.cal,protein:d.r.protein,carb:d.r.carb,fat:d.r.fat,date:new Date().toLocaleDateString(),id:Date.now()});
localStorage.setItem(DB,JSON.stringify(hist));
renderHistory();
alert('已保存！');
};

function renderHistory(){
var el=document.getElementById('historyList');
if(!hist.length){el.innerHTML='<div class="es">暂无记录</div>';return;}
el.innerHTML=hist.slice().reverse().slice(0,20).map(function(h){
return '<div class="li"><div><strong>'+h.name+'</strong> <span class="tag">'+h.cal+'kcal</span> <span class="tag s">P:'+h.protein+'g</span> <span class="tag w">C:'+h.carb+'g</span> <span class="tag d">F:'+h.fat+'g</span></div><button class="dng" style="padding:4px 8px;font-size:.8rem" onclick="delHist('+h.id+')">✕</button></div>';
}).join('');
}
window.delHist=function(id){hist=hist.filter(function(h){return h.id!==id});localStorage.setItem(DB,JSON.stringify(hist));renderHistory();};
renderCommon();renderHistory();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
