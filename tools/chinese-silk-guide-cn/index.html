<!DOCTYPE html>
<html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国丝绸指南</title><meta name="description" content="中国丝绸指南 - 了解中国丝绸的历史、工艺和丝绸之路文化"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.card h3{margin-bottom:12px;color:var(--blue)}.tab-bar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:8px}.tab{padding:8px 16px;cursor:pointer;border-radius:8px;white-space:nowrap;color:var(--text2);transition:var(--transition);border:1px solid var(--border);font-size:.9rem}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.tab:hover:not(.active){background:var(--bg)}.item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;transition:var(--transition)}.item h4{margin-bottom:6px}.item .meta{color:var(--text2);font-size:.85rem}.item .desc{margin-top:8px;line-height:1.8;color:var(--text2)}.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;margin:2px}.silk-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:12px 0}.silk-route{background:var(--bg);border:1px solid var(--bord <div class="container"><h1>🧣 中国丝绸指南</h1><p class="sub">探索中国丝绸的历史、工艺和丝绸之路文化</p>

<script>
var data={
overview:{title:'中国丝绸总览',content:'<p>中国是世界上最早发明丝绸的国家，丝绸文化绵延五千余年。丝绸不仅是华美的织物，更是中华文明的重要象征。</p><h4 style="margin-top:16px">丝绸的基本知识</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px"><div class="item" style="cursor:default"><h4>🐛 蚕丝来源</h4><p class="desc">蚕丝是蚕蛾幼虫（家蚕）吐丝结茧形成的天然纤维。一颗蚕茧可抽出1500-3000米长的丝线。</p></div><div class="item" style="cursor:default"><h4>✨ 丝绸特性</h4><p class="desc">• 光泽柔和，手感滑爽<br>• 吸湿透气，冬暖夏凉<br>• 弹性好，不易起皱<br>• 染色性好，色彩鲜艳</p></div><div class="item" style="cursor:default"><h4>📊 主要品种</h4><p class="desc">• 桑蚕丝：最常见，品质优良<br>• 柞蚕丝：天然淡黄色<br>• 天蚕丝：极为稀有珍贵<br>• 双宫丝：双蚕共结一茧</p></div><div class="item" style="cursor:default"><h4>🔍 鉴别方法</h4><p class="desc">• 触感：真丝滑爽有凉感<br>• 燃烧：有烧焦羽毛味<br>• 光泽：柔和自然<br>• 价格：真丝价格较高</p></div></div>'},
history:{title:'历史发展',items:[
{name:'远古传说',era:'约5000年前',desc:'传说黄帝之妻嫘祖发明养蚕缫丝。考古发现证明，中国在五千年前已有丝绸生产。',tags:['嫘祖','传说']},
{name:'商周时期',era:'约3600年前',desc:'丝绸生产已相当发达，出现了提花织机。丝绸成为贵族服饰的重要材料。',tags:['提花','贵族']},
{name:'汉代',era:'约2200年前',desc:'张骞出使西域，开辟丝绸之路。丝绸大量出口，成为最重要的贸易商品。',tags:['丝绸之路','出口']},
{name:'唐代',era:'约1400年前',desc:'丝绸工艺达到高峰，织锦技术精湛。唐三彩中的丝织品图案丰富多彩。',tags:['高峰','织锦']},
{name:'宋元时期',era:'约1000年前',desc:'缂丝工艺成熟，"一寸缂丝一寸金"。宋锦、云锦等名锦定型。',tags:['缂丝','宋锦']},
{name:'明清时期',era:'约600年前',desc:'南京云锦、苏州宋锦、四川蜀锦、广西壮锦并称"四大名锦"。丝绸品种更加丰富。',tags:['四大名锦']},
{name:'近现代',era:'近代至今',desc:'杭州、苏州、南京成为中国三大丝绸产地。丝绸产业现代化，但传统工艺仍在传承。',tags:['现代','传承']}
]},
silkroad:{title:'丝绸之路',content:'<p>丝绸之路是古代连接中国与世界的重要贸易通道，因丝绸贸易而得名。</p>',
items:[
{name:'陆上丝绸之路',icon:'🐫',desc:'起自西汉都城长安（今西安），经河西走廊、新疆，通往中亚、西亚，最终到达欧洲罗马帝国。全长约7000公里，历时1500余年。',tags:['长安','中亚','欧洲']},
{name:'海上丝绸之路',icon:'⛵',desc:'从东南沿海出发，经南海、印度洋，到达东南亚、南亚、中东和非洲东海岸。唐代以后逐渐成为主要贸易通道。',tags:['南海','印度洋']},
{name:'茶马古道',icon:'🐎',desc:'以茶马互市为主的民间商贸通道，连接云南、四川与西藏、南亚。丝绸是重要贸易品之一。',tags:['茶马','西藏']},
{name:'丝绸之路的影响',icon:'🌍',desc:'• 促进了东西方经济文化交流<br>• 传播了中国四大发明<br>• 促进了宗教传播（佛教东传）<br>• 影响了沿途城市的繁荣',tags:['文化','交流']}
]},
crafts:{title:'工艺技法',items:[
{name:'缫丝',desc:'将蚕茧中的丝线抽出的过程。包括煮茧、缫丝、络丝等工序。现代已有自动缫丝机。',tags:['基础','工序']},
{name:'织造',desc:'将丝线织成织物的过程。包括平纹、斜纹、缎纹等基本组织，以及提花、缂丝等高级技法。',tags:['织造','技法']},
{name:'印染',desc:'在丝绸上印制图案色彩。包括手工印染（扎染、蜡染）和机器印花。真丝印染色彩鲜艳。',tags:['印染','色彩']},
{name:'刺绣',desc:'在丝绸上绣制图案。苏绣、湘绣、蜀绣、粤绣四大名绣都以丝绸为底料。',tags:['刺绣','四大名绣']},
{name:'缂丝',desc:'"通经断纬"的织造技法，"一寸缂丝一寸金"。用于制作高档艺术品和服饰。',tags:['缂丝','高档']},
{name:'宋锦',desc:'苏州传统织锦，图案精美，色彩典雅。常用于装裱书画和制作高级服饰。',tags:['宋锦','苏州']}
]},
brands:{title:'丝绸之都',items:[
{name:'杭州',region:'浙江',desc:'"丝绸之府"，有四千多年丝绸历史。西湖绸伞、都锦生织锦是杭州丝绸代表。中国丝绸博物馆位于杭州。',tags:['丝绸之府','博物馆']},
{name:'苏州',region:'江苏',desc:'"丝绸之乡"，以苏绣闻名。苏州宋锦、缂丝技艺精湛。苏州丝绸博物馆展示丝绸文化。',tags:['苏绣','宋锦']},
{name:'南京',region:'江苏',desc:'"云锦之都"，南京云锦是元明清三代皇家御用贡品。云锦织造技艺被列入人类非遗。',tags:['云锦','非遗']},
{name:'成都',region:'四川',desc:'"蜀锦之乡"，蜀锦有两千多年历史。成都是南方丝绸之路的起点。',tags:['蜀锦','南方丝路']},
{name:'湖州',region:'浙江',desc:'"丝绸之源"，钱山漾遗址出土了世界上最早的丝绸织物。湖州辑里湖丝品质上乘。',tags:['丝绸之源','湖丝']}
]},
quiz:{title:'中国丝绸知识测验',questions:[
{q:'传说中发明养蚕缫丝的是？',options:['黄帝','嫘祖','大禹','尧舜'],answer:1,explain:'嫘祖是黄帝之妻，传说她发明了养蚕缫丝，被尊为"先蚕娘娘"。'},
{q:'丝绸之路因什么而得名？',options:['茶叶贸易','丝绸贸易','瓷器贸易','香料贸易'],answer:1,explain:'丝绸之路因丝绸贸易而得名，是中国古代最重要的贸易通道之一。'},
{q:'四大名锦不包括以下哪一个？',options:['云锦','宋锦','蜀锦','壮锦'],answer:0,explain:'四大名锦是南京云锦、苏州宋锦、四川蜀锦、广西壮锦。云锦虽然著名，但它是四大名锦之一。'},
{q:'"一寸缂丝一寸金"形容的是？',options:['苏绣','云锦','缂丝','宋锦'],answer:2,explain:'缂丝工艺精湛，用时极长，因此有"一寸缂丝一寸金"的说法。'},
{q:'以下哪个城市被称为"丝绸之府"？',options:['苏州','杭州','南京','成都'],answer:1,explain:'杭州被称为"丝绸之府"，有四千多年丝绸历史。'}]}
};
function switchTab(name,el){
document.querySelectorAll('.tab-bar .tab').forEach(function(t){t.classList.remove('active')});
el.classList.add('active');
renderContent(name);
}
function renderContent(name){
var d=data[name];
var html='<div class="card"><h3>'+d.title+'</h3>';
if(d.content) html+=d.content;
if(d.items){
d.items.forEach(function(item){
html+='<div class="item">';
if(item.icon) html+='<div style="font-size:1.5rem;margin-bottom:4px">'+item.icon+'</div>';
html+='<h4>'+item.name+'</h4>';
if(item.region) html+='<div class="meta">'+item.region+'</div>';
if(item.era) html+='<div class="meta">'+item.era+'</div>';
html+='<div class="desc">'+item.desc+'</div>';
if(item.tags) html+='<div style="margin-top:8px">'+item.tags.map(function(t){return '<span class="tag" style="background:rgba(59,130,246,.15);color:var(--blue)">'+t+'</span>'}).join('')+'</div>';
html+='</div>';
});
}
if(d.questions){
d.questions.forEach(function(q,i){
html+='<div class="item" style="cursor:default" id="q'+i+'"><h4>'+q.q+'</h4>';
q.options.forEach(function(opt,j){
html+='<div class="quiz-option" onclick="checkAnswer('+i+','+j+','+q.answer+',this)">'+String.fromCharCode(65+j)+'. '+opt+'</div>';
});
html+='<div class="explain" style="display:none;margin-top:8px;padding:8px;background:rgba(59,130,246,.1);border-radius:8px;font-size:.85rem">'+q.explain+'</div></div>';
});
}
html+='</div>';
document.getElementById('content').innerHTML=html;
}
function checkAnswer(qi,oi,correct,el){
var q=document.getElementById('q'+qi);
var opts=q.querySelectorAll('.quiz-option');
opts.forEach(function(o,i){
if(i===correct) o.style.borderColor='var(--green)';
else if(i===oi) o.style.borderColor='var(--red)';
});
q.querySelector('.explain').style.display='block';
}
renderContent('overview');
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
