<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国结艺</title><meta name="description" content="中国结艺 - 在线了解中国结的编织艺术"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a017;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .2s}.item:hover{transform:translateY(-2px)}.item-title{font-size:1.2rem;font-weight:600;color:var(--gold);margin-bottom:8px}.item-meta{font-size:.9rem;color:var(--text2);margin-bottom:4px}.item-display{font-size:3rem;text-align:center;padding:30px;background:var(--bg);border-radius:8px;margin-bottom:12px;min-height:100px;display:flex;align-items:center;justify-content:center}.item-desc{font-size:.9rem;color:var(--text)}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .2s}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;position:relative}.modal h2{color:var(--gold);margin-bottom:12px}.modal p{color:var(--text2);line-height:1.8;margin-bottom:12px}.close-btn{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer}.theme-toggle{position:fixed;top:8px;right:80px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;color:var(--text);font-size:.75rem}.steps-container{counter-reset:step}.step{display:flex;gap:12px;margin-bottom:16px;padding:12px;background:var(--bg);border-radius:8px;align-items:flex-start}.step::before{counter-increment:step;content:counter(step);display:flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--red);color:#fff;border-radius:50%;font-weight:bold;font-size:.85rem;flex-shrink:0}.step p{margin:0;font-size:.9rem;color:var(--text);line-height:1.6}.knot-display{width:120px;height:120px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:4rem;position:relative}.knot-display::after{content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:40px;height:20px;border-left:2px solid var(--red);border-right:2px solid var(--red);border-bottom:2px solid var(--red);border-radius:0 0 50% 50%}</style><meta property="og:title" content="中国结艺"><meta property="og:description" content="中国结艺 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧶</text></svg>"></head><body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🧶 中国结艺</h1><p class="sub">在线了解中国结的编织艺术</p>
<div class="card"><div class="search-box"><input type="text" id="searchInput" placeholder="搜索中国结..." oninput="filterItems()"></div>
<div class="btn-group"><button class="btn active" onclick="filterByType('all',this)">全部</button><button class="btn" onclick="filterByType('基本结',this)">基本结</button><button class="btn" onclick="filterByType('组合结',this)">组合结</button><button class="btn" onclick="filterByType('装饰结',this)">装饰结</button><button class="btn" onclick="filterByType('实用结',this)">实用结</button></div></div>
<div id="itemList"></div></div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="close-btn" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><div id="modalDisplay" class="knot-display"></div><p id="modalMeta"></p><p id="modalDesc"></p><div id="modalSteps" class="steps-container"></div><p id="modalDetail" style="padding-top:12px;border-top:1px solid var(--border);margin-top:8px"></p></div></div>
<script src="../i18n.js" defer></script>
<script>
var items=[
  {title:'吉祥结',type:'基本结',emoji:'🔮',desc:'中国结中最基本的结法之一，寓意吉祥如意。是学习其他复杂结法的基础。',steps:['准备一根红绳','将绳对折形成两个环','将右环穿过左环','将左绳绕过右绳','将右绳穿过左环','拉紧调整形状','吉祥结完成'],detail:'吉祥结是中国结的入门结法，学会吉祥结后可以学习更复杂的组合结。'},
  {title:'盘长结',type:'基本结',emoji:'♾️',desc:'中国结的代表作品，象征绵延不绝、长长久久。是最经典的中国结造型。',steps:['准备一根长红绳','将绳盘成方形框架','按照规律上下穿插','保持每圈间距均匀','逐步收紧绳结','调整对称性','盘长结完成'],detail:'盘长结是佛教八吉祥之一，象征佛法的绵延不绝。其结构对称，寓意圆满。'},
  {title:'双钱结',type:'基本结',emoji:'💰',desc:'形似两枚铜钱相连，寓意财源广进、好事成双。常用于钱包和装饰。',steps:['准备一根红绳','将绳打一个活结','将绳穿过活结形成第二个圈','将两个圈调整成铜钱形状','收紧绳结','双钱结完成'],detail:'双钱结因形似两枚铜钱而得名，是中国结中寓意财富的经典结法。'},
  {title:'纽扣结',type:'实用结',emoji:'👔',desc:'用于传统服饰的盘扣，实用与美观兼具。旗袍和唐装上常见。',steps:['准备一根绳','将绳对折','将右绳绕成圈','将左绳穿过圈','将右绳绕过左绳','将右绳穿回圈中','拉紧成纽扣状'],detail:'纽扣结是中国传统服饰盘扣的基本结法，一件精美的旗袍需要数十个纽扣结。'},
  {title:'蝴蝶结',type:'装饰结',emoji:'🦋',desc:'造型优美的装饰结，常用于礼品包装和服饰装饰。象征自由和美丽。',steps:['准备一根丝带','将丝带交叉打一个结','将右侧折成环','将左侧折成环','将两个环交叉','从中间穿过拉紧','调整蝴蝶结形状'],detail:'蝴蝶结是最受欢迎的装饰结之一，在婚礼、生日等场合广泛使用。'},
  {title:'金刚结',type:'基本结',emoji:'💪',desc:'藏传佛教的护身符结法，寓意坚不可摧、驱邪避灾。常用于手链。',steps:['准备两根不同颜色的绳','将两根绳并排放置','将右绳绕过左绳打结','将左绳绕过右绳打结','重复交替打结','保持力度均匀','编织到所需长度'],detail:'金刚结是藏传佛教中常用的护身符结法，据说佩戴可以驱邪避灾、保佑平安。'},
  {title:'团锦结',type:'组合结',emoji:'🌸',desc:'形似花朵绽放，寓意花好月圆、团圆美满。是节日装饰的常用结法。',steps:['准备一根红绳','将绳盘成五个圈','将每个圈穿过相邻的圈','形成花瓣形状','收紧调整','团锦结完成'],detail:'团锦结因形似锦缎团花而得名，是中国结中最具装饰性的结法之一。'},
  {title:'藻井结',type:'装饰结',emoji:'🏛️',desc:'形似古代建筑的藻井，寓意天圆地方、富贵吉祥。常用于大型装饰。',steps:['准备一根长红绳','将绳盘成方形框架','按照规律穿插编织','形成回字形图案','收紧绳结','藻井结完成'],detail:'藻井结因形似古代建筑天花板上的藻井而得名，是中国结中最复杂的结法之一。'},
  {title:'平结',type:'实用结',emoji:'🔗',desc:'最简单的实用结法，用于连接绳索和固定物品。手链编织的基础。',steps:['准备一根绳','将绳绕过固定物','将右绳压过左绳','将左绳从下方穿过','将左绳压过右绳','将右绳从下方穿过','拉紧形成平结'],detail:'平结是最基本的实用结法，虽然简单但在生活中应用广泛。'},
  {title:'琵琶结',type:'组合结',emoji:'🎵',desc:'形似琵琶，寓意知音难觅、琴瑟和鸣。常用于乐器装饰。',steps:['准备一根红绳','将绳盘成琵琶形状','按照规律穿插','收紧调整形状','琵琶结完成'],detail:'琵琶结因形似乐器琵琶而得名，是中国传统乐器装饰的常用结法。'},
  {title:'酢浆草结',type:'基本结',emoji:'🍀',desc:'形似三叶草，寓意幸运、幸福。是手链和挂饰的常用结法。',steps:['准备一根红绳','将绳折成三个圈','将每个圈穿过其他圈','形成三叶草形状','收紧绳结','酢浆草结完成'],detail:'酢浆草结因形似酢浆草（三叶草）而得名，象征幸运和幸福。'},
  {title:'同心结',type:'组合结',emoji:'💕',desc:'两个结相互缠绕，寓意永结同心、爱情永恒。是婚礼必备装饰。',steps:['准备两根不同颜色的绳','将两根绳并排放置','将两根绳相互缠绕','形成同心形状','收紧调整','同心结完成'],detail:'同心结是中国传统婚礼中最重要的装饰结，象征夫妻永结同心、白头偕老。'}
];
var currentType='all';
function renderItems(list){
  var el=document.getElementById('itemList');
  var html='';
  list.forEach(function(p,i){
    html+='<div class="item" onclick="showDetail('+items.indexOf(p)+')">';
    html+='<div class="item-title">'+p.emoji+' '+p.title+'</div>';
    html+='<div class="item-meta">'+p.type+'</div>';
    html+='<div class="item-display">'+p.emoji+'</div>';
    html+='<div class="item-desc">'+p.desc.substring(0,60)+'...</div>';
    html+='</div>';
  });
  el.innerHTML=html||'<div class="card" style="text-align:center;color:var(--text2)">未找到匹配的中国结</div>';
}
function filterItems(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=items.filter(function(p){return(p.title.includes(q)||p.desc.includes(q))&&(currentType==='all'||p.type===currentType);});
  renderItems(filtered);
}
function filterByType(type,btn){
  currentType=type;
  document.querySelectorAll('.btn-group .btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterItems();
}
function showDetail(i){
  var p=items[i];
  document.getElementById('modalTitle').textContent=p.title;
  document.getElementById('modalDisplay').textContent=p.emoji;
  document.getElementById('modalMeta').textContent=p.type;
  document.getElementById('modalDesc').textContent=p.desc;
  var stepsHtml='';
  if(p.steps){p.steps.forEach(function(s){stepsHtml+='<div class="step"><p>'+s+'</p></div>';});}
  document.getElementById('modalSteps').innerHTML=stepsHtml;
  document.getElementById('modalDetail').textContent=p.detail;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='light'?'dark':'light');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
renderItems(items);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
